  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and data exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest externally verifiable risk is the compliance perimeter around deploying embodied-AI systems
              in China. China's Data Security Law applies to data processing in China and defines processing broadly to
              include collection, storage, use, processing, transmission, provision, and disclosure. It also requires
              lifecycle security controls, risk monitoring, incident response, and risk assessments for important data.
              For a robot brain trained on simulation and potentially connected to real-world deployments, the relevant
              diligence question is not whether the company has suffered a public breach; no such conclusion is
              supported here. The question is whether its data classification, access controls, incident response, and
              cross-border transfer procedures are documented and tested. The national industrial-robot safety standard
              GB/T 20867.1-2024 was published on 2024-08-23 and took effect on 2025-03-01, replacing the 2007 standard.
              That creates a concrete standards-refresh obligation for any industrial deployment, while the assigned
              sources do not establish Sudu's certification or conformity status.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Execution, reliability, and commercialization
        blocks:
          - type: paragraph
            body: >-
              Sector evidence shows that Chinese policy is pushing humanoid and embodied AI companies from
              demonstrations toward verified workplace deployment. The eWeek report describes a program targeting more
              than 100 application scenarios and more than 10,000 humanoid robots by the end of 2026, while also noting
              that real-world deployment is intended to improve operational data and hardware and software performance.
              This creates both an adoption opportunity and an execution hazard: a company can face compressed
              validation timelines, safety incidents, integration failures, and warranty or service burdens before its
              system is proven at production scale. A Unitree comparison reports that research and education generated
              73.6% of its humanoid revenue while industrial deployment generated about 9%; this is not a Sudu
              benchmark, but it illustrates how sector shipment narratives can run ahead of factory adoption. The
              fetched ManiSkill page exposed only title metadata, so it could not supply a usable technical benchmark.
              Sudu-specific production uptime, incident rates, manufacturing readiness, customer acceptance, and repeat
              deployment data are not disclosed in the assigned pool. Sim-to-real transfer and field reliability
              therefore remain material unresolved exposures, not evidence of failure.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR010
              - CR013
              - CR015
      - number: '7.3'
        title: Dependency, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The sector's capital intensity and concentration make financing and dependency risks central to the
              thesis. An S&P Capital IQ item reports a $500 million Sudu financing announced on 2026-05-08 and describes
              the issuance as convertible preferred shares with participation from strategic and financial investors.
              That report does not disclose terms, runway, liquidation preferences, covenants, or cash availability, so
              the financing should not be treated as equivalent to unrestricted cash or operating runway. Sector funding
              evidence also indicates that large investors and corporate partners are concentrating around companies
              with deployments and manufacturing capacity, while the KraneShares page shows that the investable
              ecosystem spans brain, body, sensing, materials, and integrator companies. Sudu's supplier, cloud,
              capital-provider, and customer dependencies remain unverified; the practical mitigation is to obtain a
              dependency map, concentration schedule, financing documents, and production acceptance metrics before
              underwriting scale.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain the data-governance package, industrial safety/conformity evidence, production reliability series,
              dependency map, and executed financing documents before treating the reported financing or sector
              deployment targets as de-risking evidence.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR010
              - CR014
          - type: callout
            title: Thesis-break triggers
            body: >-
              Reassess the thesis if a material data-security or safety nonconformity is identified, if production task
              success or uptime fails agreed thresholds, if financing terms create an unmodeled preference or runway
              shortfall, or if a key supplier or customer represents an unmitigated concentration.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR008
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence stance is track/research-more, not buy. S&P Capital IQ identifies a May
              2026 Sudu financing whose title labels the amount $500 million and whose body says convertible preferred
              shares were issued; the fetched body renders the amount inconsistently, so the exact consideration still
              needs transaction-document verification. The item does not state a post-money valuation, dilution,
              liquidation preference, conversion terms, or cash runway. A current valuation is therefore not observable
              from this pool. The recommendation is price-sensitive: funding raised is evidence of investor
              participation, not proof of cash available or an attractive entry price. The company-level record also
              does not establish revenue, ARR, customer count, gross margin, or production volume. Those omissions
              prevent a defensible mark-to-revenue or unit-economics conclusion. The disciplined next step is to obtain
              the cap table, signed term sheet, audited or management financials, and customer contracts before
              underwriting an entry price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV016
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis has two evidence-supported elements. First, the reported financing names GL Ventures, BlueRun,
              Tencent, Ant Group, CATL, Alibaba, and IDG Capital as participants, which indicates that sophisticated
              financial and strategic investors assigned value to the opportunity, although it does not reveal their
              price or diligence findings. Second, the sector has substantial policy and capital tailwinds: The Diplomat
              describes embodied intelligence as a dedicated strategic-emerging-industry track in China's draft 15th
              Five-Year Plan. Category trackers put Figure AI near $1.9 billion of total funding and a $39 billion
              valuation and put Apptronik near a $5.5 billion-or-higher valuation, while Tech Market Briefs calculates a
              23–29x trailing-revenue range for a reported Unitree IPO valuation scenario. These are directional
              references, not normalized Sudu comparables: the instruments, stages, revenue profiles, and evidence
              quality differ. The anti-thesis is stronger for underwriting today. Voxos reports that controlled-lab
              success can fall materially in deployment and that humanoid programs remain early pilots, while
              Morningstar's neutral rating on a broad physical-AI ETF illustrates that thematic exposure is not the same
              as expected outperformance. Sudu-specific commercialization, repeatability, and price support remain
              unverified.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be treated as a decision framework, not a forecast. The bull case requires Sudu
              to convert technical differentiation and financing access into repeatable paid deployments, disclose
              enough operating data to support a model, and raise future capital without punitive dilution. The base
              case assumes continued technical progress but delayed commercialization, leaving the next round dependent
              on strategic investors and narrative support rather than measurable recurring revenue. The bear case
              combines a down-round or stalled financing with a persistent sim-to-real gap, high hardware costs, and
              limited customer willingness to pay. Voxos describes 90–120 minute typical humanoid battery life against
              8–20 hour industrial requirements and a 60% real-world success figure after a 95% controlled result; these
              are sector-level signals, not Sudu measurements, but they justify a material execution discount. A Sudu
              valuation range should remain unstated until the company provides denominators for growth, margin,
              deployment, and ownership.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: Diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is currently low from the available evidence. A credible underwriting package needs the
              exact May 2026 financing instrument, fully diluted ownership, option pool, preference stack, debt and
              project-finance obligations, and any investor side letters. It also needs a monthly revenue bridge,
              backlog and signed customer pipeline, gross-margin assumptions by hardware and software component,
              deployment uptime, safety incidents, and sim-to-real performance measured outside curated demonstrations.
              Comparable data must be normalized by business model: Humanoid Index mixes private funding, public
              companies, acquisitions, and subsidiaries, while Morningstar's ETF holdings are public component and
              industrial companies rather than direct Sudu peers. ManiSkill documents simulation throughput and
              sim-to-real tooling, but that capability is not evidence of Sudu production performance. Thesis-break
              triggers are a financing at materially lower terms, inability to demonstrate paid repeat deployments, or
              failure to close the evidence gaps above.
            claimRefs:
              - CV003
              - CV009
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence recommendation
            body: >-
              Track rather than buy. The reported financing is meaningful, but the assigned evidence cannot establish a
              current price, dilution terms, revenue denominator, or repeatable commercial performance.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: callout
            title: Thesis-break trigger
            body: >-
              A lower-priced financing, failed repeat deployment, or inability to produce auditable field reliability
              and ownership data would break the investability thesis.
            calloutType: risk
            claimRefs:
              - CV003
              - CV010
              - CV012
