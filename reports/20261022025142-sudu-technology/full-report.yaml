        title: Exhibits
        blocks:
          - type: callout
            title: Software-layer optionality
            body: >-
              Sudu's standardized model and API positioning could support deployment across robot bodies, a potentially
              scalable alternative to selling one integrated robot form factor.
            calloutType: strength
            claimRefs:
