  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and operating workflow
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology describes Sudo R1 as a general-purpose robot brain rather than a narrow application: the
              product is intended to connect perception, reasoning, and physical action for manipulation in human-built
              environments. Humanoid.Guide independently describes the model as linking vision, language, and action and
              as using simulation to reduce real-world training requirements, while an Origin of Bots account describes
              a workflow in which human motion or task intent is processed with visual and spatial inputs before joint
              actuation and balance correction. A Chinese industry article reports the company is targeting industrial
              manufacturing and logistics, including joint development with CATL, but that account is company-linked
              reporting rather than independent deployment evidence. The practical buyer workflow is therefore best
              treated as an assisted-manipulation or automation platform whose value depends on repeatable task
              transfer, not as proof of broad autonomy.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE010
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE010
              - CE014
      - number: '5.2'
        title: Architecture, training, and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed technical thesis is a simulation-first stack combining a 3D world model, reinforcement
              learning, a manipulation policy, and closed-loop control. The Chinese report attributes near-100%
              zero-shot success on unspecified key tasks to a no-real-robot-data setup and separately describes a
              60-minute unedited test involving unfamiliar object shapes, lighting, and backgrounds. Those are reported
              company or company-adjacent claims, not a reproducible benchmark: the public record does not state the
              test population, denominator, failure taxonomy, robot hardware, evaluator protocol, or sim-to-real holdout
              design. Origin of Bots reports a 15–25 Hz closed-loop policy but also says that robot size, weight, and
              hardware specifications were not published. The architecture is consequently legible at the conceptual
              layer while its engineering maturity and generalization claims remain unverified.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
