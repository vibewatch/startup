          description: The company-linked report says deployment need not collect sensitive production data.
          touchpoints: ["Data governance", "Integration assessment"]
        - stage: "4"
          label: Pilot
          title: Pilot
          description: Pilot status, site, buyer, and acceptance criteria are not disclosed.
          touchpoints: ["Site acceptance", "Safety review"]
        - stage: "5"
          label: Production deployment
          title: Production deployment
          description: No independently named production customer or utilization record is retained in the assigned pool.
          touchpoints: ["Paid deployment", "Uptime and utilization"]
        - stage: "6"
          label: Expansion
          title: Expansion
          description: Expansion from sorting into adjacent warehouse and palletizing workflows is a hypothesis requiring customer evidence.
          touchpoints: ["Multi-site rollout", "Renewal and expansion economics"]
    claimRefs: [CU005, CU006, CU009, CU012, CU015]
callouts:
  - calloutType: strength
    title: Clear industrial wedge
    body: Sudu has articulated use cases where flexible grasping and limited customer-data transfer could matter to industrial buyers.
    claimRefs: [CU001, CU003]
  - calloutType: risk
    title: Adoption evidence is not yet customer evidence
    body: The assigned pool contains a demonstration report but no named paid deployment, retention metric, or customer-level denominator.
    claimRefs: [CU007, CU009, CU010]
  - calloutType: recommendation
    title: Require referenceable deployment proof
    body: Before underwriting commercial traction, obtain at least three referenceable accounts with production-versus-pilot status, paid dates, task logs, renewal terms, and concentration data.
    claimRefs: [CU009, CU010, CU011, CU012]
