      - [Retention or expansion rate, null, "As of 2026-10-22", "No disclosure in assigned pool", Low, "Durability and land-and-expand remain unverified", "Cohort, contract, renewal, and revenue denominator"]
    notes: >-
      Reported test metrics are not customer KPIs; null means the assigned successful prefetched
      sources do not disclose a usable denominator or value.
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    rows:
      - [No named Sudu customer disclosed, Industrial, No customer-specific use case disclosed, Unknown, None independently documented, Customer identity and contract status unavailable]
      - [No named Sudu customer disclosed, Logistics, No customer-specific use case disclosed, Unknown, None independently documented, "Site, task, and paid status unavailable"]
      - [No named Sudu customer disclosed, Developer or integration partner, No customer-specific integration disclosed, Unknown, No adoption metric independently documented, Partner relationship and usage unavailable]
    notes: >-
      This is a partial enumeration of named customer proof in the assigned pool, not a claim
      that Sudu has no customers; it records the absence of referenceable named deployments in
      the reviewed material.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly accessible successful prefetched sources assigned to this chapter for the
        2026-10-22 refresh, limited to named Sudu customer or deployment evidence.
    claimRefs: [CU009, CU010, CU011, CU012, CU014]
