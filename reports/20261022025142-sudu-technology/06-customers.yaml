      - [Developers and integrators, Robotics engineering or integration team, General-purpose model and developer ecosystem, Company-linked ecosystem claim, Reusable deployment surface, "No partner list, API evidence, or adoption metrics"]
    notes: >-
      Sources describe intended industrial scenarios and a company-linked deployment proposition;
      “evidence of scale” is not a customer-count measure, and no row has a named paid account in
