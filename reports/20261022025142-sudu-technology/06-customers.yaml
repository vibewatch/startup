chapter:
  number: 6
  title: Customers
  summary: Public evidence identifies industrial sorting and warehouse palletizing as Sudu Technology's intended customer workflows, with a reported 60-minute grab test and claims of near-100% zero-shot success. The available pool does not independently verify production deployments, recurring revenue, retention, customer concentration, or commercial conversion, so the customer thesis remains evidence-constrained.
sections:
  - id: customer-segments-and-use-cases
    title: Customer segments and use cases
    body: >-
      The strongest customer-facing evidence is a company-linked report describing Sudo R1 for
      industrial sorting and warehouse depalletizing. It says the system can adapt across
      transparent, flexible, reflective, and other unknown objects and that deployment does not
      require collecting sensitive production data. Those claims point to industrial operators
      whose buying criteria include rapid integration, data governance, and tolerance for
      unstructured objects, rather than to a general consumer product. The same report names
      sorting and palletizing as commercial scenarios, but it does not identify a paying
      customer, contract, site, purchase order, or production acceptance test. Broader sector
      evidence places initial humanoid adoption in factories, logistics centers, and other
      semi-structured environments; this is a market context, not proof of Sudu adoption.
    claimRefs: [CU001, CU002, CU003, CU004, CU013]
    tableRefs: [TU001]
  - id: adoption-proof-and-trajectory
    title: Adoption proof and trajectory
    body: >-
      Sudu's public adoption proof is a product demonstration rather than a customer deployment
      record. The reported test ran continuously for 60 minutes and involved grasping multiple
      classes of unknown objects, with a claimed near-100% zero-shot success rate. That is
      relevant to technical feasibility and a prospective buyer's evaluation, but it lacks the
      denominator definition, task-by-task log, independent witness, site name, paid-versus-pilot
      status, utilization history, and post-deployment outcome needed to infer active accounts or
      repeat usage. The adjacent robotics market has clearer public examples of factory and
      warehouse deployments, which raises the evidentiary bar for Sudu: a demo should not be
      presented as production traction. No source in this assigned pool discloses Sudu customer
      count, revenue by customer, renewal, churn, NRR, GRR, or contract duration.
    claimRefs: [CU005, CU006, CU007, CU008, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: expansion-and-concentration
    title: Expansion, procurement, and concentration
    body: >-
      The proposed expansion path is from a first industrial manipulation workflow into
      adjacent sorting, warehousing, and palletizing tasks. A simulation-first approach could
      reduce the need for sensitive customer data during onboarding, but the evidence does not
      establish implementation time, integration cost, safety acceptance, service levels, or
      whether one buyer can expand across sites. Funding and investor disclosures show capital
      participation, not customer concentration or commercial durability. The practical
      diligence priority is therefore a customer-level evidence pack: signed referenceable
      accounts, production-versus-pilot status, paid deployment dates, task-level uptime and
      success logs, expansion economics, and the share of revenue attributable to the largest
      account or channel.
    claimRefs: [CU009, CU010, CU011, CU012, CU014, CU015]
    tableRefs: [TU003]
