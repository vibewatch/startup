callouts:
  - calloutType: strength
    title: Simulation-first technical thesis
    body: "The clearest product thesis is to scale embodied-policy learning through simulation and general manipulation rather than task-by-task real-world data collection."
    claimRefs: [CE005, CE009]
  - calloutType: risk
    title: Sim-to-real proof is the gating risk
    body: "Reported zero-shot and object-generalization results lack the benchmark definitions, denominators, hardware details, and independent replication needed to underwrite production maturity."
    claimRefs: [CE006, CE007, CE008]
  - calloutType: recommendation
    title: Request reproducible deployment evidence
    body: "Before treating Sudo R1 as production-ready, request a held-out task suite, failure and safety logs, embodiment details, security controls, uptime data, and named customer acceptance criteria."
    claimRefs: [CE013, CE014, CE015, CE016]
