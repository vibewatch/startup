  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Investor validation", "May 2026 financing names financial and strategic participants", "Obtain signed terms and confirm independent price discovery"]
      - ["Policy tailwind", "China's draft 15th Five-Year Plan elevates embodied intelligence", "Show conversion of policy support into paid Sudu deployments"]
      - ["Figure AI reference", "Two category trackers report about $1.9B total funding and a $39B valuation", "Normalize stage, instrument, revenue, and commercial proof"]
      - ["Apptronik reference", "Two category trackers place valuation near $5.5B or more but differ on total funding", "Use primary financing documents before relying on the mark"]
      - ["Unitree reference", "Tech Market Briefs calculates 23–29x trailing revenue for a reported IPO valuation scenario", "Verify against the filed prospectus and final offer terms"]
      - ["Reliability risk", "Voxos reports a large lab-to-deployment performance gap", "Provide independently measured field reliability and uptime"]
      - ["Commercial proof gap", "Assigned sources disclose no Sudu revenue or customer denominator", "Produce contracts, backlog, retention, and gross-margin evidence"]
    notes: >-
      Peer and sector evidence is directional only. Competitor and category benchmarks are not
      independent proof of Sudu's performance or valuation.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key trigger]
    rows:
      - [Bull, "Paid deployments repeat; operating data becomes auditable; future capital is non-punitive", "Upside is supportable only after a disclosed revenue or deployment denominator", "Low-to-medium", "Signed repeat customer contracts and third-party field metrics"]
      - [Base, "Technical progress continues but commercialization and disclosures lag", "Track and wait; preserve optionality rather than assign a precise multiple", "Medium", "Next financing with transparent terms and measurable backlog"]
      - [Bear, "Down-round, stalled financing, reliability shortfall, or high hardware intensity", "Capital loss or severe dilution risk; no public target price", "Medium-to-high", "Lower-priced financing, failed deployments, or inability to evidence runway"]
      - [Sensitivity, "Battery, reliability, and sim-to-real constraints persist at sector level", "Apply a material execution discount until production economics are demonstrated", "High relevance, not a probability estimate", "Field success and uptime remain below customer requirements"]
    notes: >-
      Scenarios are conditional decision cases, not probability-calibrated forecasts. The
      assigned sources do not provide enough Sudu-specific data to calculate valuation ranges,
      target returns, or exit multiples without inventing precision.
    claimRefs: [CV010, CV011, CV012, CV016]
