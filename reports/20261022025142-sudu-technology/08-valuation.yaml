company:
  name: Sudu Technology
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a track recommendation rather than a buy: Sudu's reported
    financing is material, but the assigned evidence does not disclose a current price,
    revenue base, customer traction, or cap-table terms. Sector comparables show that
    robotics valuations can be exceptionally dispersed while deployment reliability and
    production economics remain unresolved.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The appropriate public-evidence stance is track/research-more, not buy. S&P Capital IQ
      identifies a May 2026 Sudu financing whose title labels the amount $500 million and whose
      body says convertible preferred shares were issued; the fetched body renders the amount
      inconsistently, so the exact consideration still needs transaction-document verification.
      The item does not state a post-money valuation, dilution, liquidation preference,
      conversion terms, or cash runway. A current valuation is therefore not observable from
      this pool. The recommendation is price-sensitive: funding raised is evidence of investor
      participation, not proof of cash available or an attractive entry price. The company-level
      record also does not establish revenue, ARR, customer count, gross margin, or production
      volume. Those omissions prevent a defensible mark-to-revenue or unit-economics conclusion.
      The disciplined next step is to obtain the cap table, signed term sheet, audited or
      management financials, and customer contracts before underwriting an entry price.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis has two evidence-supported elements. First, the reported financing names
      GL Ventures, BlueRun, Tencent, Ant Group, CATL, Alibaba, and IDG Capital as participants,
      which indicates that sophisticated financial and strategic investors assigned value to
      the opportunity, although it does not reveal their price or diligence findings. Second,
      the sector has substantial policy and capital tailwinds: The Diplomat describes
      embodied intelligence as a dedicated strategic-emerging-industry track in China's draft
      15th Five-Year Plan. Category trackers put Figure AI near $1.9 billion of total funding
      and a $39 billion valuation and put Apptronik near a $5.5 billion-or-higher valuation,
      while Tech Market Briefs calculates a 23–29x trailing-revenue range for a reported
      Unitree IPO valuation scenario. These are directional references, not normalized Sudu
      comparables: the instruments, stages, revenue profiles, and evidence quality differ.
      The anti-thesis is stronger for underwriting today.
      Voxos reports that controlled-lab success can fall materially in deployment and that
      humanoid programs remain early pilots, while Morningstar's neutral rating on a broad
      physical-AI ETF illustrates that thematic exposure is not the same as expected
      outperformance. Sudu-specific commercialization, repeatability, and price support remain
      unverified.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear cases
    body: >-
      Scenario analysis should be treated as a decision framework, not a forecast. The bull
      case requires Sudu to convert technical differentiation and financing access into
      repeatable paid deployments, disclose enough operating data to support a model, and
      raise future capital without punitive dilution. The base case assumes continued
      technical progress but delayed commercialization, leaving the next round dependent on
      strategic investors and narrative support rather than measurable recurring revenue. The
      bear case combines a down-round or stalled financing with a persistent sim-to-real gap,
      high hardware costs, and limited customer willingness to pay. Voxos describes 90–120
      minute typical humanoid battery life against 8–20 hour industrial requirements and a
      60% real-world success figure after a 95% controlled result; these are sector-level
      signals, not Sudu measurements, but they justify a material execution discount. A
      Sudu valuation range should remain unstated until the company provides denominators for growth,
      margin, deployment, and ownership.
    claimRefs: [CV010, CV011, CV012, CV016]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Diligence asks and exit readiness
    body: >-
      Exit readiness is currently low from the available evidence. A credible underwriting
      package needs the exact May 2026 financing instrument, fully diluted ownership, option
      pool, preference stack, debt and project-finance obligations, and any investor side
      letters. It also needs a monthly revenue bridge, backlog and signed customer pipeline,
      gross-margin assumptions by hardware and software component, deployment uptime, safety
      incidents, and sim-to-real performance measured outside curated demonstrations. Comparable
      data must be normalized by business model: Humanoid Index mixes private funding, public
      companies, acquisitions, and subsidiaries, while Morningstar's ETF holdings are public
      component and industrial companies rather than direct Sudu peers. ManiSkill documents
      simulation throughput and sim-to-real tooling, but that capability is not evidence of
      Sudu production performance. Thesis-break triggers are a financing at materially lower
      terms, inability to demonstrate paid repeat deployments, or failure to close the
      evidence gaps above.
    claimRefs: [CV003, CV009, CV015, CV016]
    tableRefs: []
