    notes: "Null means no company-specific public value was available in the assigned prefetched evidence; it does not mean zero revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Value, Status, Underwriting implication]
    rows:
      - [List price, null, "Not disclosed for Sudu", "Cannot estimate bookings or hardware gross profit"]
      - [Realized price or discounting, null, "Not disclosed for Sudu", "Cannot distinguish list pricing from collected revenue"]
      - [Contract model, null, "Software, hardware, and services mix unresolved", "Cannot model recurring versus one-time revenue"]
    notes: "The table separates unavailable company data from peer pricing or market context; no peer price is used as Sudu realized pricing."
    claimRefs: [CI001, CI003, CI004]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters and diligence ask]
    rows:
      - [Gross margin, null, "Unavailable", "Request product-level margin bridge including compute, components, labor, warranty, and support"]
      - [CAC, null, "Unavailable", "Request sales and marketing spend, new logos, channel fees, and cohort payback"]
      - [Cash balance and monthly burn, null, "Unavailable", "Request current cash, 12-month cash bridge, and monthly burn by function"]
      - [Runway, null, "Unavailable", "Calculate only after cash, burn, restricted funds, debt, and committed capex are reconciled"]
    notes: "All nulls are evidence gaps. Financing raised is not substituted for cash available, and no runway estimate is implied."
    claimRefs: [CI005, CI006, CI009, CI010, CI011, CI014]
