chapter:
  number: 4
  title: Financials
  summary: Sudu Technology's public financial disclosure remains limited, while a May 2026 Capital IQ record reports a financing in convertible preferred shares but renders the amount in a malformed format that cannot be normalized. The available evidence supports a capital-adequacy review centered on commercialization proof and missing operating metrics rather than a revenue or margin underwriting case.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and observable traction
    body: >-
      The retained evidence does not disclose Sudu Technology revenue, ARR, GMV, recognized
      units, utilization, realized pricing, gross margin, or customer concentration. The
      May 2026 S&P Capital IQ record identifies a financing event and says the company issued
      convertible preferred shares, but its amount is rendered as "$500,0000,000" and cannot
      be normalized without another source. The Chinese announcement page in the pool is not
      usable for a transaction or operating claim because its fetched body contains only the
      text “看横店” and “不喜欢,” rather than an auditable disclosure. Accordingly, the public
      record cannot classify Sudu as pre-revenue, early-commercial, or scaled; absence of a
      disclosed metric is not evidence that its value is zero.

      The commercial mechanism is also not public enough to classify confidently as SaaS,
      robotics-as-a-service, hardware sales, licensing, or a blended model. For a simulation-
      trained robot-brain company, revenue quality will depend on whether customers pay for
      robot deployments, software access, integration, data, or services, and whether those
      receipts recur. The current record supports a diligence request for contracts, invoices,
      backlog, deferred revenue, shipment records, and a revenue-recognition policy before
      any run-rate or growth multiple is used.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      No retained source provides Sudu Technology's bill of materials, compute spend,
      simulation cost per useful training hour, data-collection expense, manufacturing
      commitments, support burden, gross margin, CAC, sales cycle, payback, or working-capital
      profile. The financing structure therefore matters: a convertible preferred round can
      fund engineering and manufacturing scale, but even a verified amount raised would not
      equal cash currently available after fees, prior obligations, or planned deployment.

      Comparable sector evidence shows why operating proof is material. An industry funding
      overview describes Figure's use of capital for AI training, robot manufacturing,
      engineering headcount, and commercial deployment; BMW's report on Figure 02 documents
      a production trial but does not establish Sudu's economics. Unitree's later public
      financial disclosure provides a benchmark for what useful hardware underwriting can
      eventually look like—revenue, profit, mix, gross margin, and customer composition—but
      those secondary figures belong to Unitree and are peer context rather than an independent
      benchmark for Sudu. Sudu should therefore be underwritten on measured unit economics
      only after management supplies company-specific denominators.
    claimRefs: [CI005, CI006, CI007, CI008, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The strongest current financial fact is the reported May 2026 financing event,
      with GL Ventures, BlueRun, Tencent's investment arm, Ant Group, CATL, Alibaba, and IDG
      Capital listed as participants. The source says the securities were convertible
      preferred shares, but its amount field is malformed and is not treated here as a verified
      $500 million figure. The record does not disclose post-money valuation, cash balance,
      burn rate, runway, debt, liquidation preferences, use of proceeds, or the next-round
      trigger. Financing dependency therefore cannot be quantified: without a cash-flow
      statement and deployment plan, the round cannot be translated into months of runway.

      Sector capital is abundant but selective. The retained 2026 overview reports $13.8
      billion raised by robotics startups globally in 2025 and describes capital concentrating
      in companies with deployments, corporate partnerships, and defensible software. Those
      are market-context observations, not Sudu metrics. The financial verdict is
      research-more: the financing event may provide capacity to build, but the unverified
      amount and absence of revenue, margin, cash, and contract evidence prevent a credible
      return or solvency assessment.
      Priority diligence is a reconciled cash bridge from the financing close to current cash,
      monthly burn by function, committed capex, debt and preferred-share terms, and signed
      commercial obligations.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
  - id: financial-diligence-asks
    title: Evidence gaps that block underwriting
    body: >-
      The open questions are not cosmetic. Revenue recognition cannot be assessed without
      contracts and delivery evidence; unit economics cannot be assessed without the unit,
      customer, and period denominators; and capital adequacy cannot be assessed without
      current cash, burn, liabilities, and financing terms. A financing headline can coexist
      with rapid cash consumption during model training, robot prototyping, facility buildout,
      or customer integration. Until those records are produced, a valuation comparison to
      better-disclosed robotics peers would conflate capital raised with enterprise value and
      conflate market enthusiasm with operating performance.
    claimRefs: [CI004, CI006, CI010, CI014]
