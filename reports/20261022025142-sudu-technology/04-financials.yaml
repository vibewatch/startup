callouts:
  - calloutType: strength
    title: A documented financing event signals investor access
    body: The May 2026 record identifies convertible preferred shares and multiple strategic and institutional participants, but its malformed amount field prevents quantifying the capital raised.
    claimRefs: [CI002, CI003, CI009]
  - calloutType: risk
    title: Capital raised cannot substitute for cash-flow evidence
    body: No retained source reports current cash, burn, runway, debt, preferred terms, or use of proceeds, so solvency and financing dependency remain unquantified.
    claimRefs: [CI010, CI011, CI014]
  - calloutType: recommendation
    title: Underwrite only after a reconciled financial pack
    body: Request revenue contracts, delivery records, gross-margin build, cash bridge, burn schedule, capex commitments, and financing terms before using a valuation or return model.
    claimRefs: [CI004, CI006, CI014]
