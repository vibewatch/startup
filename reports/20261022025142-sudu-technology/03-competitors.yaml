callouts:
  - calloutType: strength
    title: Software-layer optionality
    body: "Sudu's standardized model and API positioning could support deployment across robot bodies, a potentially scalable alternative to selling one integrated robot form factor."
    claimRefs: [CP001, CP003]
  - calloutType: risk
    title: Commercial proof gap
    body: "Assigned evidence does not establish Sudu's customer deployments, realized pricing, retention, or production-scale sim-to-real performance, leaving differentiation and switching costs unproven."
    claimRefs: [CP010, CP012, CP013]
  - calloutType: insight
    title: Integrated competitors can bundle execution
    body: "NEURA and Apptronik show how hardware, software, strategic capital, and enterprise partnerships can be combined into a buyer-facing deployment package."
    claimRefs: [CP006, CP007]

