callouts:
  - calloutType: insight
    title: Industrial proof matters more than headline category size
    body: Sudu's reported financing purpose is scaled verification in real industrial scenarios, so deployment evidence and repeatable buyer economics are more decision-useful than a broad humanoid market forecast.
    claimRefs: [CM003, CM010, CM011]
  - calloutType: risk
    title: Company-specific sizing remains unproven
    body: No assigned source discloses Sudu's serviceable market, obtainable share, pricing, customer count, contract value, or conversion funnel; valuation analysis should not convert external category figures into Sudu revenue.
    claimRefs: [CM009, CM014]
