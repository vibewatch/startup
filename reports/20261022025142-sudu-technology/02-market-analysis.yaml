    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow and trigger, Adoption constraint]
    rows:
      - [Industrial manufacturing, "Plant or operations leadership", "Operators, automation engineers, safety teams", "Plant automation or capital budget", "Pilot a defined repetitive or variable task where cross-task reuse can be tested", "Precision, uptime, safety validation, and integration"]
      - [Logistics and warehousing, "Distribution or fulfillment leadership", "Supervisors and fleet operators", "Operations technology or site capital budget", "Pilot material handling and expand after measured throughput", "Reliability, site integration, and unclear ROI"]
      - [Industrial technology partner, "Automation or robotics platform partner", "Engineering and deployment teams", "Partner product or innovation budget", "Co-develop a reusable physical-intelligence stack", "Data rights, interoperability, and channel control"]
      - [Service or household robotics, "Consumer or service operator", "End users and field staff", "Consumer discretionary or service-operations budget", "Adopt only after safety, usability, and support mature", "Evidence says broad near-term household adoption is unlikely"]
    notes: "The map is a hypothesis from the industrial-verification evidence and sector constraints; no Sudu customer, contract, or budget-owner disclosure was found in the assigned sources."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
