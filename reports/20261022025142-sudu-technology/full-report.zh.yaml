            body: >-
              没有保留来源提供 Sudu Technology
              的物料清单、算力支出、每个有效训练小时的仿真成本、数据采集费用、制造承诺、支持负担、毛利率、CAC、销售周期、回本周期或营运资金状况。因此，融资结构很重要：可转换优先股融资可以支持工程和制造扩张，但即使融资金额得到核实，也不等于扣除费用、既有义务或计划部署后的当前可用现金。

              可比行业证据说明了运营证明为何重要。一份行业融资概览描述 Figure 将资金用于 AI 训练、机器人制造、工程团队和商业部署；BMW 关于 Figure 02 的报告记录了一次生产试验。Unitree
