        title: 信任、可靠性与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              现有来源没有记录 Sudo R1
              的安全模型、隐私影响评估、安全论证、认证、事故历史、正常运行时间承诺、软件更新流程或正式质量体系。中国报道所称的仿真优先方法可能减少收集敏感客户演示数据的需求，但这本身不能证明客户数据、远程操作通道、模型资产或机器人控制接口受到保护。操控演示成功也不能证明在传感器退化、新型接触力、网络中断或对抗性输入下的安全行为。IDG
              Capital 自有网站提示有人冒充，并称官方信息只通过其官方网站发布；该提示不是关于 Sudu
              产品的证据，但强化了通过主要记录核实合作伙伴和投资者说法的必要性。尽调重点应是可复现的基准和带有安全、安保及可靠性控制的部署证据。
