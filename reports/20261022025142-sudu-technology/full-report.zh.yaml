  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与可观察 traction
        blocks:
          - type: paragraph
            body: >-
              保留证据未披露 Sudu Technology 的收入、ARR、GMV、确认销量、利用率、实际定价、毛利率或客户集中度。2026 年 5 月的 S&P Capital IQ
              记录确认了一起融资事件，并称公司发行了可转换优先股，但金额显示为
              "$500,0000,000"，没有其他来源就无法规范化。证据池中的中文公告页面也不能用于交易或运营判断，因为其抓取正文只有“看横店”和“不喜欢”，并非可审计披露。因此，公开记录无法将 Sudu
              归类为尚未产生收入、早期商业化或已规模化；没有披露某项指标，不等于其价值为零。

              商业机制也没有公开到足以判断是
              SaaS、机器人即服务、硬件销售、许可收入还是混合模式。对于一家仿真训练的机器人“大脑”公司，收入质量取决于客户究竟为机器人部署、软件访问、集成、数据还是服务付费，以及这些收入是否可重复。当前记录支持在使用任何运行率或增长倍数前，要求提供合同、发票、订单储备、递延收入、发货记录和收入确认政策。
