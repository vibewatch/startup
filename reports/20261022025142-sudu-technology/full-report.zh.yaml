      - number: '5.3'
        title: 差异化与部署路径
        blocks:
          - type: paragraph
            body: >-
              Sudu
              提议的差异化在于依靠仿真扩展策略学习，而不是主要依赖昂贵的远程操作和真实机器人数据。这可能降低边际数据采集成本，让同一策略更容易跨工作单元移植；但公开证据未能证明这一优势经得住机器人本体、传感器、延迟、接触动力学或工厂安全约束的变化。与公司相关的报道称，系统正面向多个制造和物流工作站开发，公司也在建设开发者中心和工具链。这些信息体现的是路线图和计划中的生态，而不是实测生产正常运行时间、集成时间、客户转化率或支持负担。MarketResearchFuture
              提供了行业背景，称 AI、计算机视觉、机器学习、传感器和执行器是中国人形机器人市场的竞争层，但这不能验证 Sudu 的实现。
