  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与运营工作流
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology 将 Sudo R1 描述为通用型机器人“大脑”，而非狭窄应用：产品旨在让感知、推理和物理行动连接起来，在人类建造的环境中完成操作。Humanoid.Guide
              独立描述该模型连接视觉、语言和行动，并利用仿真降低现实世界训练需求；Origin of Bots
              则描述了一套工作流：先将人体动作或任务意图与视觉和空间输入结合处理，再执行关节驱动和姿态平衡修正。一篇中国行业文章称，公司正瞄准工业制造和物流，包括与 CATL
              联合开发，但该报道与公司相关，并非独立部署证据。因此，实际买方工作流最好被视为辅助操作或自动化平台，其价值取决于任务迁移是否可重复，而不是广泛自主能力的证明。
            claimRefs:
              - CE001
