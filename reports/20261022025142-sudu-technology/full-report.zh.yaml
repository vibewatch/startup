  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采用背景
        blocks:
          - type: paragraph
            body: >-
              相关市场包括让实体工作能够跨任务和环境适应所需的软件、机器人系统及部署服务。范围涵盖具身智能模型、机器人本体、感知与控制系统、仿真与训练基础设施、集成服务，以及面向工业或服务部署的持续支持。不包括只执行单一重复任务、没有通用物理智能层的传统固定式工业自动化，也不包括尚未形成可重复购买流程的推测性家庭需求。现有描述将
              Sudu 定位为通用型具身智能机器人平台开发商，而其 2026 年 10 月融资报告称资金将支持真实工业场景中的规模化验证。因此，相比宽泛的人形机器人市场标题，工业部署证据对决策更有意义。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM011
      - number: '2.2'
        title: 多重测算视角与可比性限制
        blocks:
          - type: paragraph
            body: >-
              证据支持多个并不等价的视角，而不是一个公司特定的 TAM。一份行业追踪报告称，2025 年全球机器人初创企业融资额为 $13.8 billion，并引用 Goldman Sachs 对 2035 年人形机器人市场
              $38 billion 的预测；但这些数字分别代表资本形成和外部品类预测，并非 Sudu 收入或可服务市场。RoboticsTomorrow 总结 IFR 材料称，中国占工业机器人年度安装量的
              54%，并表示近期和中期普及通用型人形机器人并不现实；因此，工业自动化既是替代方案，也是时间约束。Unitree 的 IPO 披露提供了运营市场参照：2025 年收入为 1.699 billion
              yuan，发货量超过 5,500 台人形机器人。另一份 Unitree 分析称，人形机器人收入的 73.6% 来自科研和教育，约 9% 来自工业部署，说明已发货数量尚不能证明工厂级采用。Unitree
              是竞争对手，其数据不能移植到 Sudu。抓取到的 S&P Capital IQ 记录还将一笔据报的 Sudu 融资额以错误的逗号格式呈现，不能作为市场规模输入。现有来源未单独披露 Sudu 的
              SAM、SOM、定价、部署数量或客户预算，因此这些数值仍是尽调缺口。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
