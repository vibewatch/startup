      - number: '2.3'
        title: 买方细分、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              最有支撑的初始买方路径是企业和工业客户：工厂、物流运营商，以及能够针对明确流程验证通用物理智能层的其他场所。买方、使用者和付款方可能不同：运营或工厂管理层负责生产率问题，工程和安全团队验证系统，企业资本或自动化预算为部署买单。2026
              年 10
              月融资说明明确提到真实工业场景和规模化验证，而中国政策报道将演示和试点项目描述为许多人形机器人部署的现状。因此，采用路径可能分阶段推进，从试点走向可重复的多地点部署，ROI、安全、集成、数据控制和可靠性都是闸门条件。与成熟工业机器人切换会受精度和速度要求约束；与人工劳动切换则受信任、培训和运营风险约束。Sudu
              的公开证据未指明付费客户、合同金额、转化率或预算负责人，因此该细分图谱只是基于报道中的工业验证用例提出的尽调假设。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
