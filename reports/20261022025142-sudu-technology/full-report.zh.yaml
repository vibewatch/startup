          - type: callout
            title: 论点失效触发器
            body: 如果发现重大数据安全或安全符合性问题，生产任务成功率或正常运行时间未达约定阈值，融资条款造成未建模的优先权或现金跑道缺口，或关键供应商或客户形成未缓解的集中度，应重新评估该论点。
            calloutType: recommendation
            claimRefs:
