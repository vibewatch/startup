      - number: '3.3'
        title: 切换成本、护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              最持久的潜在护城河不只是融资，而是可复用技能、部署数据、集成接口、合作伙伴渠道，以及仿真训练策略能否可靠迁移到陌生物理环境的证据。如果接口可移植，Sudu 强调的标准化模型能力和 API
              可能降低客户切换摩擦；但如果竞争模型达到类似表现，也可能使智能层更容易被替代。一体化厂商可以通过硬件、服务和工作流集成制造锁定：NEURA 描述了连接机器人、组件、模型、数据、算力和服务的平台；Apptronik
              则通过战略合作扩大 Apollo 部署。Unitree 的公开收入、利润和发货披露也显示出另一种优势：运营规模以及走向公开市场融资的路径。反向证据集中在执行不确定性上：所引 TechCrunch 报道称
              Physical Intelligence 没有商业化时间表，而公开来源也未能证明 Sudu 的生产规模 sim-to-real 表现、客户留存或实际定价。这些缺口使护城河持久性仍未证实。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
