        title: 展示项
        blocks:
          - type: callout
            title: 工业验证比品类市场标题更重要
            body: Sudu 报道中的融资用途是在真实工业场景中进行规模化验证，因此部署证据和可重复的买方经济性比宽泛的人形机器人市场预测更适合决策。
            calloutType: insight
