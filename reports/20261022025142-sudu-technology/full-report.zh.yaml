              - CP010
      - number: '3.2'
        title: 面向买方的能力、分销与定价比较
        blocks:
          - type: paragraph
            body: >-
              买方选择取决于需求是机器人本体、可复用的智能层，还是可直接投入生产的工作流。Unitree 报道的 2025 年收入为 1.699 billion yuan，发货量超过 5,500 台人形机器人，计划通过 IPO
              募集 4.202 billion yuan；这些公开规模信号强于 Sudu 目前可获得的信号，但这些指标与软件平台并不直接可比。Apptronik 公开将制造和物流列为初始用例，并列出
              Mercedes-Benz、GXO Logistics、Jabil 和 Google DeepMind 合作；NEURA 的 Tether 公告描述了多形态产品组合、企业客户管线和 Neuraverse
              软件生态。Physical Intelligence 已融资超过 $1 billion，但据 TechCrunch 在所引日期的报道，尚无商业化时间表。公开标价很少：指定来源未提供
              Sudu、Skild、Physical Intelligence、NEURA、Apptronik 或 Unitree 按任务、API
              调用、机器人或合同计价的直接可比价格。因此，未知定价应视为尽调缺口，而不是竞争优势。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
