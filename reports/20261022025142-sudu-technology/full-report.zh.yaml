  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              合适的公开证据立场是跟踪 / 继续研究，而不是买入。S&P Capital IQ 确认一笔 2026 年 5 月 Sudu 融资，其标题标注金额为 $500
              million，正文称发行了可转换优先股；但抓取正文对金额的呈现不一致，因此仍需通过交易文件核实确切对价。该记录未说明投后估值、稀释、清算优先权、转换条款或现金跑道。因此，当前估值无法从该证据池观察到。建议取决于价格：融资额证明投资者参与，不证明可用现金或有吸引力的入场价格。公司层面记录也未能证明收入、ARR、客户数、毛利率或生产量。这些遗漏阻碍了有依据的收入倍数或单位经济性结论。纪律性的下一步，是在评估入场价格前取得股权结构表、已签署条款清单、经审计或管理层财务资料以及客户合同。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
