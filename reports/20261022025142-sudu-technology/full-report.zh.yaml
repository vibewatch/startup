  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与战略定位
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局不止包括人形机器人制造商。Sudu 的已述主张是打造通用型机器人“大脑”，通过标准化模型能力和 API
              泛化感知与操作技能，因此最接近的直接对手既包括软件层基础模型公司，也包括一体化机器人厂商。ChinaBulls 将 Sudu
              描述为追求“具备强泛化能力的‘机器人脑’”，并从运动智能走向感知和交互智能。与这一定位相对，Skild AI 和 Physical Intelligence
              强调不依赖特定硬件的智能；NEURA、Apptronik 和 Unitree 则将软件与机器人本体或部署项目结合。Agility
              以及企业内部自动化建设是特定仓库或工厂岗位的替代方案；在任务结构化的地方，传统固定式自动化仍是现状。融资和发货数据表明替代方案正在吸引大量资本，但仅凭这些数据不能证明技术能力或客户价值相当。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
