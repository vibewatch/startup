      - number: '7.3'
        title: 依赖、融资与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              行业资本密集度和集中度使融资与依赖风险成为论点核心。S&P Capital IQ 的一条记录称，Sudu 于 2026-05-08 宣布获得 $500 million
              融资，并描述发行可转换优先股，战略和财务投资者参与。该报告未披露条款、现金跑道、清算优先权、契约或现金可用性，因此不应把这笔融资视为不受限制的现金或运营现金跑道。行业融资证据还显示，大型投资者和企业合作伙伴正集中于拥有部署和制造能力的公司；KraneShares
              页面则显示，可投资生态横跨大脑、本体、感知、材料和集成商。Sudu 的供应商、云、资本提供方和客户依赖仍未核实；实际缓解措施是在评估规模前取得依赖图谱、集中度表、融资文件和生产验收指标。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
