  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与数据暴露
        blocks:
          - type: paragraph
            body: >-
              最明确、可外部核验的风险，是在中国部署具身智能系统时面临的合规边界。中国《数据安全法》适用于在中国境内的数据处理，并将处理广泛定义为收集、存储、使用、加工、传输、提供和披露。该法还要求对重要数据实施全生命周期安全控制、风险监测、事件响应和风险评估。对于一套通过仿真训练、且可能连接现实部署的机器人“大脑”，尽调问题不是公司是否发生过公开数据泄露；这里没有证据支持这一结论。真正的问题是其数据分类、访问控制、事件响应和跨境传输流程是否形成文件并经过测试。国家工业机器人安全标准
              GB/T 20867.1-2024 于 2024-08-23 发布，并于 2025-03-01 生效，取代 2007 年标准。这为任何工业部署带来了具体的标准更新义务，但指定来源未能证明 Sudu
              的认证或符合性状态。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: 执行、可靠性与商业化
        blocks:
          - type: paragraph
            body: >-
              行业证据显示，中国政策正在推动人形机器人和具身智能公司从演示走向经过验证的工作场所部署。eWeek 报道一项计划，目标是在 2026 年底前覆盖超过 100 个应用场景和超过 10,000
              台人形机器人，同时指出现实部署旨在改善运营数据以及硬件和软件性能。这既带来采用机会，也带来执行风险：公司可能在系统尚未经过生产规模验证前，就面对压缩的验证期限、安全事故、集成失败以及保修或服务负担。一份
              Unitree 对比称，其人形机器人收入的 73.6% 来自科研和教育，工业部署约占 9%；这不是 Sudu 的基准，但说明行业发货叙事可能领先于工厂采用。抓取的 ManiSkill
              页面只有标题元数据，无法提供可用技术基准。指定证据池没有披露 Sudu 的生产正常运行时间、事故率、制造准备度、客户验收和重复部署数据。因此，sim-to-real
              迁移和现场可靠性仍是重要的未解决风险敞口，不是失败证据。
