      - number: '3.4'
        title: 对投资判断的竞争含义
        blocks:
          - type: paragraph
            body: >-
              Sudu 似乎在争夺具身机器人的智能层，同时面对能够打包硬件、部署、融资和支持的全栈厂商。如果仿真优先路径能带来可靠泛化、更低的数据采集成本，以及可跨机器人本体工作的
              API，公司可能形成差异化；但指定证据未能独立验证这些结果。因此，当前最可观察的竞争信号只是代理指标：竞争对手资本、已披露部署、发货和财务规模、生态合作关系及商业化时间。买方或投资者应测试 Sudu
              能否在任务成功率和集成时间上胜过纯软件替代方案，并在交付总成本和责任归属上胜过垂直一体化厂商。现有记录支持持续跟踪竞争格局，但不支持假设存在持久护城河，也不支持把竞争对手融资视为 Sudu 估值合理的证据。
            claimRefs:
