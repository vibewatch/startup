            body: >-
              已披露的技术论点是一套仿真优先架构，结合 3D 世界模型、强化学习、操作策略和闭环控制。中国报道将未明确的关键任务近 100% 零样本成功率归因于不使用真实机器人数据的设置，并另行描述了一次 60
              分钟、未经剪辑的测试，涉及陌生物体形状、光照和背景。这些是公司或公司相关方的说法，不是可复现基准：公开记录未说明测试样本、分母、失败分类、机器人硬件、评估协议或 sim-to-real 留出设计。Origin
