      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 最高优先级尽调
            body: 在将报道中的融资或行业部署目标视为降低风险的证据前，应取得数据治理包、工业安全与符合性证据、生产可靠性序列、依赖图谱和已签署融资文件。
            calloutType: risk
            claimRefs:
