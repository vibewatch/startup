              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              该论点有两个得到证据支持的要素。第一，所报道融资列出 GL Ventures、BlueRun、Tencent、Ant Group、CATL、Alibaba 和 IDG Capital
              为参与者，说明成熟的财务和战略投资者愿意提供资本。第二，行业拥有明显的政策和资本顺风：The Diplomat 将具身智能描述为中国第 15 个五年计划草案中的战略性新兴产业专门赛道。品类追踪数据将 Figure
              AI 的累计融资额和估值分别置于约 $1.9 billion 和 $39 billion，并将 Apptronik 的估值置于约 $5.5 billion 或更高；Tech Market Briefs
              则按报道中的 Unitree IPO 估值情景计算出 23–29x 的历史收入区间。这些只是方向性参照，不是标准化的 Sudu
              可比公司：工具、阶段、收入画像和证据质量均不同。就今天的投资判断而言，反论点更强。Voxos 报道称，受控实验室中的成功率在部署中可能大幅下降，人形机器人项目仍处于早期试点；Morningstar
              对一只广泛的物理 AI ETF 给出中性评级，也说明主题暴露不等于预期跑赢。Sudu 的商业化、可重复性和价格支撑仍未验证。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析应作为决策框架，而不是预测。乐观情景要求 Sudu
              将技术差异化和融资渠道转化为可重复的付费部署，披露足够运营数据以支持模型，并在不受惩罚性稀释的情况下筹集后续资本。基准情景假设技术持续进步但商业化延迟，下一轮融资依赖战略投资者和叙事支持，而非可量化的经常性收入。悲观情景则是下轮融资或融资停滞叠加持续的
              sim-to-real 缺口、高硬件成本和客户支付意愿有限。Voxos 描述典型人形机器人电池续航为 90–120 分钟，而工业要求为 8–20 小时；受控环境成功率为 95% 时，现实世界成功率仅为
              60%。这些是行业信号，不是 Sudu 的测量值，但足以支持明显的执行折价。在公司提供增长、利润率、部署和所有权分母前，Sudu 的估值区间应保持不披露。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: 尽调要求与退出准备度
        blocks:
          - type: paragraph
            body: >-
              根据现有证据，退出准备度目前较低。一套可信的投资判断材料需要准确的 2026 年 5
              月融资工具、完全稀释后的所有权、期权池、优先股堆叠、债务和项目融资义务，以及任何投资者附函。还需要月度收入桥、订单储备和已签客户管线、按硬件和软件组件拆分的毛利率假设、部署正常运行时间、安全事故，以及在经过筛选的演示之外测量的
              sim-to-real 表现。可比数据必须按商业模式标准化：Humanoid Index 混合了私人融资、上市公司、收购和子公司，而 Morningstar ETF 持仓是上市零部件和工业公司，并非 Sudu
              的直接同行。ManiSkill 记录了仿真吞吐量和 sim-to-real 工具，但该能力不是 Sudu 生产表现的证据。论点失效触发器包括以明显更低的条款融资、无法证明付费的重复部署，或无法填补上述证据缺口。
            claimRefs:
              - CV003
              - CV009
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据建议
            body: 跟踪而非买入。报道中的融资具有意义，但指定证据无法证明当前价格、稀释条款、收入分母或可重复的商业表现。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: callout
            title: 论点失效触发器
            body: 更低价格的融资、重复部署失败，或无法提供可审计的现场可靠性和所有权数据，都会破坏其可投资性论点。
            calloutType: risk
            claimRefs:
              - CV003
              - CV010
              - CV012
