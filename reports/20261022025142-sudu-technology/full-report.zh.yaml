        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              当前最有力的财务事实是据报 2026 年 5 月融资事件，参与者列有 GL Ventures、BlueRun、Tencent's investment arm、Ant Group、CATL、Alibaba 和
              IDG Capital。来源称证券为可转换优先股，但金额字段格式错误，因此这里不将其视为已验证的 $500
              million。记录未披露投后估值、现金余额、烧钱率、现金跑道、债务、清算优先权、资金用途或下一轮触发条件。因此融资依赖无法量化：没有现金流量表和部署计划，就无法把该轮融资换算为现金跑道月数。

              行业资本充足但筛选严格。保留的 2026 年概览称，2025 年全球机器人初创企业融资额为 $13.8 billion，并描述资本正集中于拥有部署、企业合作和可防御软件的公司。这些是市场背景观察，不是 Sudu
              指标。财务结论是继续研究：融资事件可能提供建设能力，但金额未经核实，且缺少收入、利润率、现金和合同证据，无法可信地评估回报或偿付能力。优先尽调包括从融资交割到当前现金的核对桥接表、按职能拆分的月度烧钱、已承诺资本开支、债务和优先股条款，以及已签署的商业义务。
