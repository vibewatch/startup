      - ["GB/T 20867.1-2024 industrial-robot safety requirements", "China", "Medium", "High", "Unknown", "Medium-to-high for industrial use", "Verify applicable product scope, conformity testing, safety case, and deployment acceptance records"]
    notes: "The first two rows are grounded in the Data Security Law; the third is grounded in the national industrial-robot safety standard. Sudu-specific compliance and certification evidence was not present in the assigned sources."
    enumerationScope:
      coverage: partial
      basis: "Public Chinese data-security law and industrial-robot safety requirements relevant to embodied-AI deployments; not a complete legal inventory."
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Simulation-to-real performance degrades in unmodeled environments", "Medium", "High", "Unknown", "High", "No public Sudu production uptime, task-success, or incident series"]
      - ["Compressed deployment schedule causes integration, safety, or warranty failures", "Medium", "High", "Unknown", "High", "No disclosed rollout gates, acceptance criteria, or field-service data"]
      - ["Robot data or model pipeline fails required security controls", "Medium", "High", "Unknown", "High", "No public data classification, access-control, or incident-response evidence"]
      - ["Manufacturing and component quality cannot scale with demand", "Medium", "High", "Unknown", "Medium-to-high", "No disclosed yield, supplier concentration, or capacity metrics"]
    notes: "Likelihood and severity are diligence ratings based on the cited operating and regulatory context, not observed Sudu incident rates. Unknown mitigation maturity is intentional where the pool contains no company control evidence."
    claimRefs: [CR006, CR007, CR008, CR009, CR015, CR016]
  - id: TR003
    title: Partner, dependency, and financial risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - ["Capital providers and preferred financing", "Financial and strategic investors", "Terms, dilution, preferences, or follow-on availability constrain strategic flexibility", "High", "Review executed financing documents and cash forecast", "High", "Cash runway, covenant headroom, next-round timing"]
      - ["Robot ecosystem components and integrators", "Actuators, sensors, compute, and integrators", "Single-source disruption or integration incompatibility delays deployment", "High", "Build approved-vendor and second-source map", "Medium-to-high", "Supplier concentration, lead times, field-failure rate"]
      - ["Enterprise and public-sector deployment channels", "Factories, logistics, healthcare, and emergency-response users", "Pilot evidence does not convert into accepted production deployments", "High", "Track paid production deployments and renewal/expansion evidence", "High", "Paid deployments, acceptance milestones, repeat orders"]
      - ["Regulated data and cross-border operations", "Customers, cloud, and overseas counterparties", "Transfer restrictions or security incident blocks a deployment", "High", "Document data-flow controls and jurisdiction-specific contracts", "High", "Exceptions, incidents, approvals, and customer security reviews"]
    notes: "The pool supports the financing announcement and sector ecosystem context but does not identify Sudu's counterparties, supplier concentration, customer concentration, or contract terms; those are explicit diligence gaps."
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
