callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Obtain the data-governance package, industrial safety/conformity evidence, production reliability series, dependency map, and executed financing documents before treating the reported financing or sector deployment targets as de-risking evidence.
    claimRefs: [CR003, CR005, CR008, CR010, CR014]
  - calloutType: recommendation
    title: Thesis-break triggers
    body: Reassess the thesis if a material data-security or safety nonconformity is identified, if production task success or uptime fails agreed thresholds, if financing terms create an unmodeled preference or runway shortfall, or if a key supplier or customer represents an unmitigated concentration.
    claimRefs: [CR004, CR008, CR010, CR013]
