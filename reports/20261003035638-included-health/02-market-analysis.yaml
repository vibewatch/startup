chapter:
  number: 2
  title: "Market Analysis"
  summary: "Included Health addresses employer-sponsored care navigation and virtual care, and its 2026 plan launch expands the boundary toward integrated plan and network design for large self-insured purchasers. Cost pressure and employer interest support demand, but the assigned evidence does not disclose category revenue, pricing, or a defensible monetizable TAM/SAM/SOM."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Status-Quo Alternatives"
    body: >-
      Included Health competes for healthcare-benefit budgets rather than the whole value of U.S.
      medical claims. Its evidenced scope includes benefits and claims support, care navigation,
      virtual primary, urgent and mental-health care, specialist opinions, and coordination into
      in-person care. The January 2026 alternative-plan design and subsequent Included Health Plans
      launch extend that scope toward provider-network and plan design for large self-insured
      employers. For sizing purposes, this chapter includes purchaser spending on those services and
      excludes hospital ownership, pharmaceutical spend, fully insured underwriting risk, Medicare-
      centered provider risk, and direct-to-consumer care not purchased through a sponsoring
      organization. Status-quo substitutes include legacy insurer-led plan designs, separate
      navigation and telehealth point solutions, internal benefits teams, and conventional
      fee-for-service care. Independent coverage describes the employee-benefits field as crowded,
      making vendor consolidation a possible demand driver but not proof of rapid switching.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM008"
      - "CM009"
      - "CM016"
    tableRefs:
      - "TM001"
  - id: "sizing-and-adoption"
    title: "Evidence-Constrained Sizing and Adoption"
    body: >-
      The strongest top-down population proxy in the assigned evidence is the 160 million Americans
      insured through employers, but that population is not a revenue TAM and includes people whose
      sponsors may never buy an integrated navigation or plan product. Demand pressure is clearer:
      Healthcare Dive reported a 6.7% employer benefit-cost increase forecast for 2026 and cited
      another estimate around 9%. Adoption indicators are directionally supportive but not directly
      interchangeable. Mercer figures reported by Healthcare Dive say nearly one-third of employers
      offer or plan a nontraditional medical plan for 2027 and another 38% are considering one,
      whereas Included Health says nearly 41% are considering or planning alternative-plan features.
      The denominator, feature definition, and issuer differ, so combining those percentages into a
      SAM would create false precision. Included Health's reported reach of more than 300 organizations
      and tens of millions of members demonstrates distribution, not current market share or revenue.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM010"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption-path"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      Large self-insured employers are the clearest near-term buyers: benefits and finance leaders
      sponsor the purchase, the employer funds care, and employees and dependents use the service.
      Health plans, public purchasers, and union programs are additional organizational channels,
      although the assigned evidence does not identify their precise budget lines or approval owners.
      The product can enter as navigation or virtual care and broaden toward integrated plan design,
      but each expansion changes the buying case from convenience to measurable total-cost and quality
      accountability. Walmart and CalPERS illustrate the scale and outcome orientation of enterprise
      deployments; their company-reported results should not be generalized into a market-wide ROI.
      Firefly adds an integrated-plan capability and a reported 20,000-person base, while the combined
      proposition aims to substitute for traditional plan arrangements rather than merely add another
      point solution.
    claimRefs:
      - "CM002"
      - "CM009"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-diligence"
    title: "Growth Drivers, Constraints, and Valuation Relevance"
    body: >-
      Rising benefit costs, concentrated high-cost populations, and purchaser interest in
      nontraditional designs create a credible adoption motive. Included Health says roughly
      three-quarters of commercial-population costs come from 10% of employees, supporting the logic
      for personalized navigation and coordinated primary care. Constraints are equally material:
      independent sources call the market crowded or fiercely competitive, the company has not
      disclosed current pricing or category revenue in the assigned evidence, and large contracts
      require measurable outcomes at scale. Two Built In pages repeat useful CalPERS scale figures,
      but both explicitly say their content is LLM-generated and not definitive; those figures are
      therefore weak triangulation rather than an independent benchmark. Valuation should reward the
      broader addressable workflow only after diligence establishes renewal behavior, unit economics,
      independently measured cost savings, and the revenue contribution of plan administration
      versus navigation and care delivery.
    claimRefs:
      - "CM004"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM016"
