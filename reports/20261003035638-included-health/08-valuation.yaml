callouts:
  - calloutType: "recommendation"
    title: "Investment Stance: Research-More Under Stretched Valuation Marks"
    body: "We assign Included Health a research-more stance with high risk rating. While the company's strategic move into alternative health plan design via Firefly Health and its massive CalPERS partnership showcase undeniable commercial traction, the presence of $464 million in at-risk performance guarantees alongside zero audited financial disclosure creates an asymmetric risk profile. Until audited GAAP financials and verifiable retention metrics are available, private secondary valuation marks cannot be confirmed."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV012"
      - "CV016"
