      - number: '5.4'
        title: 云基础设施、数据安全与替代方案系统集成
        blocks:
          - type: paragraph
            body: >-
              Included Health 的技术栈主要部署在 Amazon Web Services（AWS）云端，同时战略性评估 Google Cloud
              Platform（GCP）。底层基础设施通过基础设施即代码（Terraform）、容器编排与自动化 CI/CD
              流水线进行管理，严格执行零信任安全管控，防止受保护健康信息（PHI）未经授权外泄。技术安全措施涵盖基于角色的访问控制、即时（JIT）管理权限调配和全量日志审计，以维持严格的 HIPAA 合规要求。前端研发团队使用
              TypeScript、React 及模块化组件架构开发高响应、高可访问性的 Web 与移动端应用；后端微服务则对接电子健康病历（EHR）、外部支付方参保资格系统与药品福利管理机构（PBM）。2026
              年，Included Health 拓展平台路线图，推出依托 All-Included-Care 平台并借力 Firefly Health 收购赋能的 Included Health
              Plans——面向大型自保雇主的替代性健康险方案设计。此次升级整合了定额共付优先的保险架构、精选医疗网络与 AI 原生初级诊疗协同，为该平台在 2027 保险年度向大型企业客户全面商业推广打下基础。
