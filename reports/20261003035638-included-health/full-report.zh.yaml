      - number: '2.2'
        title: 受限证据下的市场规模测算与采用率
        blocks:
          - type: paragraph
            body: >-
              现有证据中最明确的自上而下人群基准，是由雇主担保参保的 160 million 美国人；但这部分人群并不等同于收入
              TAM，其中不少群体的雇主可能根本不会采购整合型导航或方案产品。需求端的成本压力更为明朗：Healthcare Dive 报道称，2026 年雇主福利成本增幅预测为 6.7%，并援引了另一项约 9%
              的估算。采用率指标在方向上构成支撑，但彼此之间不能直接等同。Healthcare Dive 援引 Mercer 数据称，近三分之一雇主已在提供或计划在 2027 年推出非传统医疗计划，另有 38%
              处于考虑阶段；而 Included Health 则称有近 41% 的雇主正考虑或规划替代性方案功能。各方统计口径的分母、功能定义与发布主体各异，强行将这些百分比拼凑为 SAM 会导致虚假精度。Included
              Health 披露覆盖 300 多家机构及数千万会员，这只能说明渠道分销能力，无法证明其实际市场份额或当前收入。
            claimRefs:
