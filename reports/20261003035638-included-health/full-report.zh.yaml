companyProfile:
  summary: >-
    Included Health
    是一家企业级数字健康公司，面向雇主、健康险计划和公共采购方，整合医疗导航、权益倡导、虚拟诊疗与新兴替代性方案设计。公司将自身定位为会员获取保险保障协助、虚拟诊疗、线下转诊和医疗协调的统一切入点；2026
    年上线的新产品表明，其业务正从单一单点方案向健康险计划及医疗网络设计全面延伸。公开证据证实公司具备可观的客户触达和运营规模，但无法支撑经审计的收入、利润率、估值、股权结构或董事会治理情况。
  productSummary: 整合型医疗导航、权益倡导、虚拟初级诊疗与急诊、专家二诊意见、福利支持，以及替代性健康险方案设计。
