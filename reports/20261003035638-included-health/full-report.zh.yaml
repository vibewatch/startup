      - number: '6.4'
        title: 客户留存韧性、集中度与服务边界限制
        blocks:
          - type: paragraph
            body: >-
              公开材料未披露净收入留存率（NRR）、总收入留存率（GRR）、客户流失率、续约分群、细分客群合同期限、前几大客户收入占比或渠道集中度。尽管公司展示了庞大的触达规模，这些关键信息缺失导致无法形成站得住脚的留存韧性或集中度判断。其法律条款也对宏大的业务宣传施加了约束：并非所有用户均具备享受全部虚拟诊疗服务的资格，且公司明确不保证网站功能完全无中断或零差错。这些属于常规合同免责条款，不能当作系统宕机或部署失败的证据。因此，在将数百万覆盖人群或知名企业合作直接定性为稳固的商业采纳之前，尽调必须逐户核实参保资格、实际使用率、续约状况以及账户创收表现。
