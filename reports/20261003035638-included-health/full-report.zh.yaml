      - number: '2.4'
        title: 增长驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              福利成本上涨、高额医疗支出人群高度集中，加上采购方对非传统方案设计的兴趣，构成了可信的采购采纳动因。Included Health 称，商业保险人群中约四分之三的医疗支出集中在 10%
              的员工身上，这强化了个性化就医导航与协同初级诊疗的商业逻辑。制约瓶颈同样突出：独立第三方来源直言该市场赛道拥挤且竞争极为激烈，现有材料中公司未披露当前定价或分类业务收入，且大型合同在大规模落地时必须交付可量化的成效。Built
              In 的两个网页重申了具有参考价值的 CalPERS
              规模数据，但均明确标明内容由大语言模型（LLM）生成且非最终定论；因此这些数据只能充当弱交叉验证，无法作为独立的基准数据。只有在尽调确认了续约行为、单位经济模型、经独立测算的医疗成本节省金额，以及方案管理相比导航与诊疗交付的实际收入贡献之后，估值才能对更广泛的可触达工作流给予溢价。
            claimRefs:
