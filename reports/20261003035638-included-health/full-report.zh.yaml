  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局架构、分类法与替代方案
        blocks:
          - type: paragraph
            body: >-
              围绕 Included Health
              的竞争格局处于员工健康导航、虚拟临床诊疗交付与替代性健康险方案设计的交叉地带。企业买方（主要是自保雇主、健康险机构和公共采购方）在五个不同类别中评估替代选择：临床护理导航商、虚拟诊疗与初级诊疗平台、支付方嵌入式导航套件、单点方案聚合商以及企业内部福利运营。Accolade、Quantum
              Health、Rightway Healthcare 与 Health Advocate
              等临床导航竞品称其主打高触感权益倡导、管家式预约排程和理赔协助，旨在压降医疗费用增速并消除参保员工的行政困扰。与此同时，Transcarent、Healthee 及 Garner Health
              等虚拟优先同行则将数字前台与虚拟诊所、自费分摊激励相结合，在实际就医发生前引导患者分流。


              与此同时，占主导地位的全美主流医疗承保机构与第三方管理机构（TPA）既是关键分销渠道，也是根深蒂固的现状替代者。承保机构常将专有健康管理与数字导航工具直接打包进核心纯行政服务（ASO）协议中，对第三方独立剥离方案形成强大的经济惯性阻力。此外，自保雇主还会评估自建方案，宁可依赖内部
              HR 福利团队、保险公司标准护士热线以及基础员工援助计划（EAP），也不愿外包给专业供应商。替代性方案设计的兴起进一步推高了竞争壁垒：Included Health 不再仅扮演附加导航插件，而是借助
              All-Included-Care 平台、Alternative Plan Design 方案以及拟收购的 Firefly Health，全面升级为完整的健康险替代方案，直接正面迎战传统支付方 ASO
              产品以及颠覆性数字健康险方案设计。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
          - type: table
            tableRef: TP001
