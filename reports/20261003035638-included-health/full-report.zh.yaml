        title: 业务规模与采用率信号
        blocks:
          - type: paragraph
            body: >-
              公开的规模披露多为孤立指标，并未形成可对标的时间序列。Included Health 及其合作伙伴发布的材料称在全美服务数百万用户，公司官网首页展示了 4.9/5
              的会员评分，但未见披露样本量或评估方法。Landbase 另外报道有 107 家认证企业用户，但页面将该数据标注为 2026 年，同时又注明数据更新于 2025 年 8 月 17
