    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Included Health 构建了覆盖线上线下诊疗、医疗机构导航、福利支持、账单协调以及临床协同的统一切入点。当前整合模式并非起步于从零搭建的原生平台，而是源自 2021 年 Grand Rounds
              Health 与 Doctor On Demand 的合并。商业落地路径是企业采购、会员使用的福利模式：雇主和健康险机构提供福利，参保会员则使用 App
              与专属护理团队。公司官方宣传材料称，平台在全美覆盖数百万会员，服务超过 300 家雇主、健康险机构及公共部门机构。这些口径属于公司自行披露的规模数据，未经过独立的客户或使用率指标审计。
