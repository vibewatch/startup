              - CR012
              - CR015
      - number: '7.3'
        title: 外部依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Included Health 的健康险方案模式高度依赖雇主、健康险机构、独立执业医疗集团、技术供应商、线下实体合作方以及专科诊疗平台。其隐私政策要求与供应商签署商业伙伴协议，而商业方案说明书则依靠
              Firefly 和实名专科机构来交付线下实体与重症诊疗。相比之下，公开财务透明度严重滞后：Caplight 公开页面列出了历史融资轮次，但略去了具体金额与估值，其备案文件亦需特殊权限方可查阅。Built In 由
              AI 生成的网页提及 CalPERS 高达 $464 million
              的绩效保证风险池，但现有材料中缺乏一手原始合同来证实该商业条款。因此，累计融资额不能简单等同于可用现金，会计口径或公司自宣的盈利声明也不能直接作为现金跑道的佐证。
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR010
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR011
