  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              Included Health 的隐私政策表明其合规边界极其宽泛：公司在通过独立执业医疗机构服务会员的同时，需处理身份标识、福利资格、理赔信息、临床病历、沟通记录与技术使用日志。这种架构使其在
              HIPAA、各州隐私法规、医师执业规范以及供应商监督上面临多重监管风险。隐私政策列举了商业伙伴协议（BAA）、数据加密、访问权限控制、审计、员工培训以及数据泄露通知等风险缓解措施，但这些均属公司自述，缺乏独立的内部控制测试验证。政策中亦坦承没有任何系统能做到绝对安全。因此，残留风险并非管控缺位，而是现有公开证据无法验证这些管控手段的实际运行有效性、供应商覆盖广度以及各州的落地执行状况。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.2'
        title: 运营交付与医疗质量执行风险
        blocks:
          - type: paragraph
            body: >-
              2028 年健康险方案的推出，将执行半径大幅拓展至医疗导航与虚拟诊疗之外。披露的业务模式融合了方案管理、就医导流、1,000 多名虚拟医生、2,000 多家 Firefly Nearby
              合作机构以及多家专科供应商。业务链条拉长固然可加强对就医路径的把控，但也成倍增加了转接交接环节、SLA 依赖度、资质审核要求及系统集成节点。一份信源评级较低、由 AI 生成的 Built In
              摘要提到，CalPERS
              初期落地存在等待时间过长和就医受阻等摩擦；该信号在方向上偏负面，但证据力度不足以证实发生频率或持续周期。同一证据集还提到历经裁员后人员编制更为精简，因此在评估大规模落地交付质量前，必须获取接诊容量、响应时长及临床升级机制的详实数据。
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
