      - number: '5.5'
        title: 图表
        blocks:
          - type: callout
            title: 联邦多智能体架构驱动的就医导航范式革新
            body: >-
              Included Health 借助 LangGraph 与 Deep Agents 落地 Dot
              超图，化解了数字医疗软件的核心矛盾：既要提供高度个性化的临床就医导航，又不能牺牲系统架构的扩展性。通过将就医路径解耦为虚拟文件系统纳管的模块化技能，各独立产品团队得以自主迭代保险核验、接诊或预约排程逻辑，同时确保统一的对外交流语气与连贯的对话状态。
            calloutType: insight
            claimRefs:
              - CE004
              - CE006
          - type: callout
            title: 保障临床准确性的持久人机协同防线
            body: >-
              不同于存在医疗幻觉风险的消费级生成式 AI 聊天机器人，Dot 将人工临床复核直接嵌入图执行环节。系统具备暂停工作流、将疑难对话无缝升级转接给人工护理专员，并根据临床标注队列校验决策的能力，这使 Included
              Health 达成了超过 95% 的临床一致率与超过 99% 的高危情况识别率。
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: 健康险方案中的底层集成与数据边界复杂度
            body: >-
              随着 Included Health 扩大其 Included Health Plans 替代方案规模，技术风险点已从对话式 AI 转向企业级系统集成。纳管核心行政流程处理、EDI 实时参保资格数据流、第三方
              EHR 数据同步以及横跨 AWS 与 GCP 的多云安全防护，带来了显著的运营延迟，且面临外部数据交换所中断冲击的潜在风险。
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE014
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户与付费方客群划分
        blocks:
          - type: paragraph
            body: >-
              Included Health
              的公开商业触角主要走企业采购、会员使用的福利模式：雇主、健康险机构和其他保险采购方出资采买服务，参保员工、会员及合资格家属享受服务。按公司口径，就医指导、理赔与账单协调、线上线下诊疗以及专科支持包装为报销福利，而非标准意义上的直接面向消费者产品。其
              2026 年 1
              月公布的方案进一步新增了针对大型自保雇主的专属产品，核心聚焦初级诊疗与精选医疗网络。公开资料并未披露各细分业务收入、合同金额、买方集中度或清晰的付费方占比，因此尚无法量化雇主与健康险机构之间的相对经济权重。
            claimRefs:
              - CU001
