      - number: '3.3'
        title: 定价架构、产品打包与总体拥有成本
        blocks:
          - type: paragraph
            body: >-
              企业医疗导航与虚拟诊疗的商业模式围绕按会员每月（PMPM）或按员工每月（PEPM）的订阅费展开，通常与风险挂钩的绩效保证条款绑定。Included Health 将其平台打包为模块化档位——包括 Included
              Navigation、Included Care Clinic、All-Included Care 以及 Alternative Plan Design——行业预估 PEPM 区间一般落在 $2 至
              $10，具体取决于模块深度与临床人员配置规模。然而，Included Health 并未公布标准化价目表，要求针对每个雇主客户开展定制 RFP 报价与精算建模。Accolade、Quantum Health 与
              Health Advocate 等主要对手同样采取这种仅限询价的定价机制，导致采购环境不透明，总体拥有成本（TCO）极易受隐性实施成本影响。


              站在企业买方视角，真实的 TCO 远超基础软件和权益倡导订阅费。高摩擦变量包括复杂的承保机构资格与理赔文件集成、会员激活推广、内部 HR 变革管理，以及持续的 TPA 协同。导航赛道面临的核心商业挑战在于 ROI
              归因：要证明供应商干预直接遏制了医疗支出增长的主张，而非随机理赔波动的自然结果，必须依赖复杂的精算审计。切换成本居高不下：更换在用导航平台可能在年度开放投保期引发混乱，导致数字入口品牌认知混淆，若医疗网络或理赔协调团队调整，还可能引起员工不满。高昂的切换壁垒保护了现有供应商免遭迅速替代，但也在
              Included Health 试图撬动传统承保工具或既有竞品时拉长了销售周期。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
