  - id: FE001
    title: Included Health 技术架构图
    type: stack
    summary: 分层呈现 Included Health 技术架构，涵盖客户端交互层、智能体 AI 编排、临床治理、企业级微服务及安全云基础设施。
    data:
      layers:
        - label: 客户端体验层
          detail: 响应式、无障碍会员触点，统一提供导医与远程医疗接入。
          modules:
            - React & TypeScript Web 端
            - iOS & Android 移动端
            - 会员门户与行动中心
        - label: 智能体 AI 与导医层
          detail: 采用联邦多智能体路由架构，协调专业医疗导医工作流。
          modules:
            - Dot Supergraph (LangGraph)
            - Deep Agents 框架
            - Skills 能力注册表
        - label: 临床安全与治理层
          detail: 配备持续的人在回路监督、安全护栏及自动化评估流水线。
          modules:
            - 人工 Care Advocate 转接
            - LangSmith 标注队列
            - 模拟评估与红旗风险门禁
        - label: 企业服务与集成层
          detail: 核心医疗微服务，自述连接医疗服务方网络、理赔数据与临床病历。
          modules:
            - Doctor On Demand 临床医疗集团
            - 支付方参保资格与 EDI 集成
            - EHR 与 4,000+ 专科医生连接器
        - label: 安全云基础设施层
          detail: 符合 HIPAA 标准的自动化零信任云底座，支撑数据安全与规模化扩展。
          modules:
            - Amazon Web Services (AWS) 核心
            - Terraform 基础设施即代码
            - JIT 授权与 PHI 管控
        - label: 数据仓库与运营层
          detail: 运营数据流水线，支撑数据科学指标分析、审计日志记录与报表输出。
          modules:
            - 云端分析数据仓库
            - 临床标签导出流水线
            - 运营健康度看板
    approximationNotes: null
