              - CP004
              - CP008
              - CP010
      - number: '3.2'
        title: 竞品画像、规模与相对能力对标
        blocks:
          - type: paragraph
            body: >-
              对主流医疗导航与虚拟诊疗竞品的横向评估显示，各家在运营模式、融资规模及临床深度取舍上差异显著。Grand Rounds 的临床决策科学与 Doctor On Demand 覆盖全美的虚拟医生执业网络相结合，赋予了
              Included Health 独特的平台版图。该整合架构让 Included Health 能够在配备导航协调员的同时，提供 24/7 全天候
              虚拟急诊、初级诊疗、行为健康咨询以及专家二次诊疗意见（EMO）。相比之下，行业公开表述显示 Quantum Health 和 Health Advocate
              等纯导航厂商严重依赖人工护理协调员、护士呼叫中心和理赔数据流，普遍缺乏自有的全美医疗团队来直接交付长期初级诊疗。


              Accolade 等竞品虽然拥有广泛的企业合作关系和虚拟初级诊疗能力，但在公开评价渠道中持续面临利润率承压与客户满意度滑坡。Rightway Healthcare 和 Transcarent
              等新入局者注重现代化数字用户体验，捆绑药品福利管理（PBM）导航或专科手术打包服务，但覆盖人群规模较小，或面临多品牌收购整合难题。独立供应商 RFP 对标数据表明，尽管 Included Health
              功能覆盖面广（健康导航能力评分 4.2/5.0），但由于公开定价透明度不足、实施复杂度高，且精选雇主推荐信与公开消费者评价分歧严重，其在导航备选平台中的综合评分处于后四分之一区间（在 13 家平台中排名第
              11）。在 Comparably 追踪的员工满意度对比中，Included Health 在 CEO 评分、职场文化与净推荐值上均优于直接竞品，但企业买方仍需权衡内部文化数据与真实的会员支持体验。
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
