              实名客户维度的证据参差不齐。Landbase 商业数据集的样本中列出了 Charles Schwab、Moderna 与 Alameda Health
              System，但未证实具体的合同范围、实际投产状态、续约情况或实施成效。Included Health 新闻中心收录了 2024 年 6 月与 CalPERS
