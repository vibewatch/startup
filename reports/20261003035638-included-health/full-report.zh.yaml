      - number: '8.2'
        title: 资本结构、历史融资轮次与价格发现
        blocks:
          - type: paragraph
            body: >-
              Included Health 的历史股权融资体现出可观的风投支持，但当前估值发现依然严重受限。公司最近一次重大一级市场融资为 2020 年 9 月的 Series E 优先股轮次，确立了 $1.13
              billion 的投后估值基准；私募追踪平台报道称，累计融资金额在 $328 million 至 $529.32 million 之间。随后的结构性重组——包括 Grand Rounds 与 Doctor On
              Demand 合并以及对旧版 Included Health 的整合——扩大了业务范围，却未提供公开 cap-table 透明度，亦无经审计的每股估值基准。二级市场上，价格指引依然割裂。历史交易平台记录显示
              2026 年 9 月 NPM 指示性股价为 $1.66，但交易缺乏流动性且未经公司披露核实；与此同时，Forge 等平台的主要交易活动依然有限，缺少活跃的撮合交易价格。在缺少有效 S-1 注册文件或正式 IPO
              时间表的情况下，私募股权估值基准依然锚定历史轮次，而非经审计的当年财务业绩。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
