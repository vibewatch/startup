  - id: FU001
    title: 据报道的客户旅程与专科转诊扩张闭环
    type: journey-map
    summary: 梳理有出处支撑的流转路径：从雇主或健康险接入，经导医服务延伸至 Carrum 专科转诊；该路径并不代表经过实测的转化率或留存率。
    data:
      nodes:
        - id: buyer-arrangement
          label: 采购方开通接入权益
          detail: 雇主、健康险计划或其他采购方将 Included Health 作为福利提供。
          touchpoints:
            - Employer-sponsored medical plan
            - Health-plan benefit
        - id: member-eligibility
          label: 会员确认参保资格
          detail: 符合条件的会员及家属通过所享福利激活使用权限。
          touchpoints:
            - Benefit eligibility
            - Account activation
        - id: guidance-and-care
          label: 会员寻求指导或就医
          detail: 公司称该服务涵盖就医指导、账单与理赔协助，以及远程或线下就医通道。
          touchpoints:
            - Care Team
            - Virtual and in-person care
        - id: primary-care-entry
          label: 初级保健切入
          detail: 备选方案围绕健康咨询与协同全科初级保健搭建。
          touchpoints:
            - Well-being consult
            - Care coordination
        - id: specialty-identification
          label: 识别专科就医需求
          detail: 系统规则称初级诊疗问诊、导医触点、应用内行为及理赔数据均可触发 Carrum 转诊。
          touchpoints:
            - Clinical and navigation signals
            - Centers of Excellence referral
        - id: treatment-and-return
          label: 专科诊疗与后续回归
          detail: Carrum 提供专科诊疗，并将会员转回 Included Health 接受长期随访支持。
          touchpoints:
            - Specialty treatment
            - Longitudinal handoff
    approximationNotes: 该流转序列系综合公司、合作伙伴及独立报道提炼的定性路径；未披露各阶段转化率、流转耗时或会员留存率。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU009
