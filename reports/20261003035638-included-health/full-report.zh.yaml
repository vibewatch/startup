  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与会员服务交付模式
        blocks:
          - type: paragraph
            body: >-
              Included Health 面向自保企业雇主、健康险机构和公共采购方，运营整合型就医导航与虚拟诊疗交付平台。公司并未让会员穿梭于零散的单点工具之间，而是围绕一体化会员 App
              和就医指导枢纽组织服务交付。该产品涵盖五大核心功能模块：针对突发病症提供 24/7 全天候虚拟急诊；配套长期慢病管理的专属虚拟初级诊疗；行为健康心理咨询与辅导；连接全美 4,000
              多位专科专家的二次诊疗意见（EMO）；以及医疗导航、福利协调与就医账单处理。在会员服务入口处，平台整合行政审核与就医问诊，让员工及家属能在统一切入点解决保险覆盖疑问、核实自付免赔额、预约挂号或寻求医疗建议。当需要线下实体诊疗时，具体服务由下属专业医疗集团——尤其是
              Doctor On Demand Professionals,
              P.C.——负责交付，从而在技术平台与医疗执业之间建立合规区隔。这种整合交付模式旨在消除就医导航阻滞，避免不必要的急诊就医，并引导会员优先选择优质、高性价比的网络内医生。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
