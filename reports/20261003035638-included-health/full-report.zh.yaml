              - CR014
      - number: '7.4'
        title: 残留风险与投资逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >-
              投资评估的核心问题在于，Included Health 能否在大规模落地中，将公司自述的方案成本削减和就医协同成效转化为经得起独立度量的真实业绩。公开材料中最强的风险缓解措施多属结构性举措：引入医生复核的
              AI、安全内控、灵活的方案配置以及分布式医疗网络。但这些都无法替代经审计的成效数据、合同级服务指标或外部安全认证。若后续尽调无法证实其总体医疗成本测算方法论、重大上线交付中 SLA
              违约频发、出现重大隐私泄露或医疗事故，或者绩效保证金额超出其已证实的流动性承受能力，投资逻辑即应按下暂停键。由于现有反向搜索材料未发现具体的监管执法案件，本章将法律合规事件状态记录为待决，而非断言不存在任何合规事件。
            claimRefs:
              - CR002
              - CR007
              - CR012
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR007
