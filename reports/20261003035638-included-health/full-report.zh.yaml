  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Included Health
              争夺的是企业医疗福利预算，而非美国医疗理赔的全部金额。所获证据表明，其业务范围覆盖福利与理赔支持、就医导航、虚拟初级诊疗、急诊与心理健康咨询、专科二诊意见，以及线下就医协同。2026 年 1
              月上线的替代性方案设计以及后续推出的 Included Health
              Plans，将业务边界进一步拓展至针对大型自保雇主的医疗网络与方案设计。在市场规模测算中，本章统计采购方在上述服务中的支出，剔除医院资产持有、药品开支、全额投保承保风险、以 Medicare
              为中心的医疗机构风险，以及未经赞助机构采购的直接面向消费者诊疗。现状替代选择包括传统保险公司主导的方案设计、独立的导航与远程医疗单点产品、企业内部福利团队，以及常规按服务付费诊疗。独立行业报道称员工福利赛道拥挤，供应商整合或能驱动采购需求，但不足以证明客户会快速切换方案。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM016
