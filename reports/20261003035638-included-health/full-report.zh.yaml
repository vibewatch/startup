              - CE012
      - number: '5.2'
        title: 智能体 AI 架构：Dot 超图与多智能体编排
        blocks:
          - type: paragraph
            body: >-
              驱动 Included Health 各数字触点对话交互的核心技术引擎是 Dot——一款 AI 医疗对话向导。以往数字医疗导航依赖静态决策树，将复杂细微的就医需求强行简化为刻板问卷。为突破瓶颈，Included
              Health 基于 LangGraph 与 Deep Agents 重构导航平台，采用了联邦多智能体架构。处于拓扑中心的是 Dot
              超图编排层，作为事务交互、保单查询和临床导航的中央对话路由。围绕该路由的是由独立研发团队维护的领域子图与子工作流，涵盖急诊分诊、初级诊疗预约、专科医生匹配和行为健康。各项能力封装在虚拟文件系统存储的 Deep
              Agent
              技能注册表中，采用渐进式披露机制：智能体先行读取精简技能摘要，仅在实际调用时加载详细的临床规则与参保资格参数。共享文件系统在各子智能体之间同步对话摘要与完整上下文历史，确保会员在不同诊疗场景流转时语调一致，避免重复盘问。在实际生产环境中，该架构带动会话互动率提升
              75%、临床评审审计的分诊一致率超过 95%，以及高危医疗紧急状况识别率超过 99%。
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.3'
        title: 临床治理、人机协同整合与安全护栏
        blocks:
          - type: paragraph
            body: >-
              在容错率极低的医疗环境中部署自主对话智能体，必须建立严苛的临床安全护栏与顺畅的人机协同机制。Included Health 并未把人工介入视作边缘偶发异常，而是将其作为架构核心设计约束。借助 LangGraph
              的持久化执行引擎，Dot
              能完整保留对话状态并支持无时限暂停。一旦智能体遇到对话语义歧义、临床不确定性或高危预警症状，图执行便会暂停，并将对话无缝转接给人工会员护理专员或临床分诊专家。更为关键的是，人工护理专员协助智能体打通阻滞节点后，工作流可在完整保留多轮对话历史的前提下恢复执行。在安全评估与持续模型调优中，Included
              Health 引入 LangSmith 标注队列，由医疗团队持续审查抽样对话并打标签，核验分诊建议合理性并确认应急护栏正常起效。架构迁移与 Prompt
              调优在正式上线前，均用模拟患者就诊路径的多轮用户仿真评测套件验证。此外，法律与服务条款明确界定，非临床导航与二次诊疗意见均属于参考性质，不构成正式医患关系，进一步收紧了数字交互的安全边界。
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
