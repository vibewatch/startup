              - CV012
      - number: '8.3'
        title: 情景分析、同行估值倍数与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              评估 Included Health 需建立情景模型，权衡替代性健康计划采纳进展与执行风险的差异化走向。在乐观情景下，自保雇主快速采纳 Included Health Plans，且公司在 CalPERS
              履约担保下取得无瑕表现，可释放强劲营收增长，支撑其以媲美成熟数字医疗领军企业的溢价倍数推进
              IPO。在基准情景下，导航业务平稳增长与替代计划的温和采纳维系了企业运营可行性，但受制于雇主采购周期，倍数扩张较为温和。在悲观情景下，大规模上线交付中的客户服务摩擦，或未能实现临床控费节省，可能触发严厉的履约担保罚款，侵蚀流动性并引发
              down-round 估值重置。对比导航与初级诊疗平台同行——包括 Quantum Health、Transcarent 和 apree health——表明企业价值取决于经过验证的临床 ROI
              与可持续的毛留存率。潜在投资人部署资金前必须确立明确的尽调要点：经审计的 GAAP 利润表、标杆客户的分群净收入留存率，以及针对风险履约合同经核准的准备金。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示图表
        blocks:
          - type: callout
            title: 投资立场：偏高估值基准下维持深入研究评级
            body: >-
              我们给予 Included Health 深入研究（research-more）立场与高风险评级。虽然公司借由 Firefly Health 进军替代性健康计划设计，并拿下体量庞大的 CalPERS
              合作，展现出确凿的商业落地动能；但高达 $464 million 的风险履约担保，伴随未经审计的财务披露彻底空白，形成了不对称的风险特征。在取得经审计的 GAAP
              财务报表与可验证的留存指标前，私募二级市场的估值基准仍无法确证。
            calloutType: recommendation
            claimRefs:
              - CV003
