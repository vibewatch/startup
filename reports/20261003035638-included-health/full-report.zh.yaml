      - number: '4.2'
        title: 变现机制与风险共担合同敞口
        blocks:
          - type: paragraph
            body: >-
              Included Health 商业协议的经济效益在不同客群和合同类型间差异显著。常规企业合同通常对数字导航、权益倡导和虚拟诊所访问采用 PEPM
              模式，雇主按覆盖人数支付固定月费，与实际就诊频率无关。相比之下，标杆企业与公共部门合作项目包含大额绩效保证条款。该模式的典型范例是 CalPERS 与 Blue Shield of California 及
              Included Health 签订的多年期合同：该合作覆盖约 400,000 名 PPO 会员，附带 $464 million
              风险自担绩效保证条款。在这些协议下，收入能否全额确认取决于是否达到严格的质量指标与医疗费用增幅控制目标。若就医导航未能兑现清晰可见的总体医疗成本节省，或发生运营瓶颈，服务费扣留或违约罚金追偿将直接冲击实际入账营收。
            claimRefs:
