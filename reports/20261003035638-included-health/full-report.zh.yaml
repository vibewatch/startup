      - number: '2.3'
        title: 买方、用户、付费方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              大型自保雇主是近期最明确的买方群体：福利与财务主管发起采购，雇主为医疗买单，员工及家属享受服务。健康险机构、公共采购方和工会项目是补充渠道，但现有材料未明确其具体预算列支科目与审批决策人。产品切入点通常是医疗导航或虚拟诊疗，随后向整合式方案设计拓展；但每一次延伸，都会把采购决策逻辑从追求员工便利性转向对总体成本与医疗质量的可量化问责。Walmart
              与 CalPERS 的案例显示大型企业部署的规模与成效导向，但两家公司自报的结果不能直接外推为整个市场的普遍 ROI。Firefly 补充了整合方案能力并带来据称 20,000
              人的用户基数，合并后的业务主张旨在替代传统健康险方案架构，而不仅是叠加另一个单点工具。
            claimRefs:
              - CM002
              - CM009
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
