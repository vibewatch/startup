              - CR016
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 不可依据二手摘要评估绩效保证风险池
            body: >-
              两份由 AI 生成的 Built In 网页援引了约 400,000 名 CalPERS PPO 会员与 $464 million 风险自担绩效保证。在缺乏原始合同文本、统计分母、支付结算机制以及
              Included Health 实际承担敞口比例的情况下，该数字仅属尽调线索，不可作为已定量的确定性负债。
