callouts:
  - calloutType: "insight"
    title: "The Convergence of Navigation and Alternative Plan Design"
    body: >-
      Health navigation vendors face diminishing returns from selling standalone advocacy overlays as employers push to consolidate vendor sprawl. Included Health's introduction of Alternative Plan Designs and its strategic acquisition of Firefly Health indicate that competitive dominance requires capturing the underlying health plan administration and primary care foundation, effectively challenging legacy commercial health plan models directly.
    claimRefs:
      - "CP003"
      - "CP007"
      - "CP011"
  - calloutType: "risk"
    title: "Disparities Between Enterprise Case Studies and Public Member Reviews"
    body: >-
      While employer-facing RFP assessments and marketing materials praise Included Health's care coordination, public consumer review platforms reflect pronounced member dissatisfaction concerning billing disputes, delayed eligibility file synchronization, and unresolved claims. This disconnect represents a tangible procurement hazard, as unmanaged employee friction directly undermines enterprise benefits ROI and renewal durability.
    claimRefs:
      - "CP008"
      - "CP012"
      - "CP014"
