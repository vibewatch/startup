          tone: neutral
          claimRefs: [CO014, CO015]
        - label: "September 2026 — Dot expansion"
          date: "2026-09-17"
          detail: "A paid company release announced expanded Dot navigation, benefits, cost, and human-support capabilities."
          tone: positive
          claimRefs: [CO010, CO011]
        - label: "2027 plan year — Planned broader availability"
          date: "2027"
          detail: "The company said its alternative plan design would become more broadly available to large employers and other purchasers."
          tone: neutral
          claimRefs: [CO013]
    approximationNotes: "Dates and status follow the cited source language; the 2022–2024 workforce items are low-reliability third-party summaries, and planned 2027 availability is not an observed launch."
    claimRefs: [CO002, CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: risk
    title: Financial and governance disclosure is the gating issue
    body: >-
      Product breadth and operating scale are visible, but the assigned evidence
      does not establish current revenue, ARR, margins, funding, valuation, debt,
      cash, cap-table ownership, or board composition. Those omissions prevent a
      financeable assessment of enterprise value and control.
    claimRefs: [CO005, CO006, CO011]
