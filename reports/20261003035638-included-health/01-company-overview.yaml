      missingEvidence: "Current revenue, ARR, growth, gross margin, EBITDA, free cash flow, and segment economics."
      whyItMatters: "Operating scale cannot be translated into growth quality, profitability, burn, or valuation support without audited period-specific financials."
      diligencePath: "Obtain audited historical statements, current management accounts, cohort revenue, contribution margin, and a revenue-to-cash reconciliation."
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: missing-source
