artifact: company-overview
slug: included-health
runDate: 2026-10-03
company:
  name: Included Health
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Included Health presents itself as an integrated virtual and in-person care,
    navigation, advocacy, and benefits platform serving millions through more than
    300 employer, health-plan, and public-sector relationships. Its 2026 launches
    and pending Firefly Health acquisition broaden the model, while current
    valuation, capital structure, revenue, total headcount, and board composition
    remain unsupported by the assigned public evidence.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      Included Health describes a single access point for virtual and in-person
      care, provider navigation, benefits support, billing advocacy, and clinical
      coordination. The current company traces its integrated model to the 2021
      combination of Grand Rounds Health and Doctor On Demand, rather than to a
      newly founded greenfield platform. Its commercial route is primarily
      business-to-business-to-consumer: employers and health plans provide the
      benefit, while members use the app and care teams. Company materials say
      the platform reaches millions nationwide and works with more than 300
      employers, health plans, and public-sector groups. Those are company-issued
      scale claims, not independently audited customer or utilization measures.
    claimRefs: [CO001, CO002, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-and-dependence
    title: Leadership coverage and founder dependence
    body: >-
      Co-founder Owen Tripp remains chief executive, creating continuity but also
      visible key-person dependence around strategy and external positioning.
      The published executive roster covers clinical, financial, operating,
      legal, and people functions through Ami Parekh, Mark Flakne, Nupur
      Srivastava, Rob Guenthner, and Jim O'Gorman. Product announcements also put
      Parekh and Srivastava in prominent operating roles, suggesting that clinical
      governance and technology execution are distributed beyond the CEO. The
      assigned evidence does not identify a complete board, voting rights, or
      investor representatives, so governance independence and succession depth
      cannot be assessed from the public roster alone.
    claimRefs: [CO003, CO004, CO008, CO010, CO012]
    tableRefs: [TO002]
  - id: scale-capital-and-stakeholders
    title: Scale signals, capital opacity, and stakeholders
    body: >-
      Public scale signals are operational rather than financial. Included Health
      reports millions of people served, more than 300 organizational
      relationships, and a 4.9-out-of-5 member rating; its September 2026 Dot
      release further cites more than 1,000 employed clinicians and roughly 500
      member care advocates. These figures have different denominators and should
      not be combined into a workforce, customer, or revenue proxy. No assigned
      source substantiates current revenue, ARR, funding raised, valuation, debt,
      secondary pricing, or cash available. Investor underwriting therefore
      requires management financials, a current capitalization table, financing
      documents, and a bridge from eligible lives to active utilization and paid
      contract economics.
    claimRefs: [CO005, CO006, CO007, CO011]
    tableRefs: [TO003]
  - id: milestones-and-current-direction
    title: Milestones and current direction
    body: >-
      The 2026 sequence points toward deeper control of care selection and plan
      design: an alternative plan design debuted in January, Provider Connect
      followed in May, a definitive Firefly Health acquisition agreement was
      announced in July, and Dot enhancements were announced in September.
      Included Health said the Firefly transaction was expected to close in the
      third quarter of 2026 subject to customary regulatory review; the assigned
      evidence does not confirm closing, so it remains pending here. Separately,
      Built In's explicitly AI-generated candidate summary reports sub-6%
      workforce reductions in July 2022 and January 2024. That adverse signal is
      useful for diligence direction but too weak to establish causes, exact
      employee counts, or current workforce stability.
    claimRefs: [CO008, CO009, CO010, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
