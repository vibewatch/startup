      topic: governance
      missingEvidence: "Complete board roster, committee structure, voting rights, investor directors, observer rights, and executive succession plans."
      whyItMatters: "The public executive roster does not establish oversight independence, control allocation, or resilience to key-person loss."
      diligencePath: "Request the charter, bylaws, board and committee lists, voting agreements, recent board minutes, and succession documentation."
      relatedTableRefs: [TO002, TO003]
