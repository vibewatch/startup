        - label: "May 2026 — Provider Connect"
          date: "2026-05-12"
          detail: "The company unveiled Provider Connect as a quality- and cost-guided provider-navigation experience."
          tone: positive
          claimRefs: [CO008, CO009]
        - label: "July 2026 — Firefly agreement"
