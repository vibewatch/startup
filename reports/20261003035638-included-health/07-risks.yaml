company:
  name: "Included Health"
chapter:
  number: 7
  title: "Risks"
  summary: "The largest disclosed risks sit at the intersection of health-plan execution, sensitive-data handling, and dependency on provider and specialty-care networks. Public evidence describes mitigations, but independent validation of security controls, contract performance, financial capacity, and adverse legal history remains limited."
sections:
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: "Included Health's privacy policy shows a broad compliance perimeter: the company handles identifiers, benefit eligibility, claims, clinical records, communications, and technical usage data, while serving members through independently owned professional practices. That structure creates exposure across HIPAA, state privacy rules, professional-practice requirements, and vendor oversight. The policy describes business-associate agreements, encryption, access controls, audits, training, and breach notification as mitigations, but these are company assertions rather than independent control tests. The policy also concedes that no system is completely secure. Accordingly, the residual risk is not that controls are absent; it is that their operating effectiveness, vendor coverage, and state-by-state implementation cannot be verified from the assigned public evidence."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR001"
  - id: "operational-and-quality-execution"
    title: "Operational and quality execution"
    body: "The 2028 health-plan launch materially expands execution scope beyond navigation and virtual care. The disclosed model combines plan administration, clinical steerage, more than 1,000 virtual clinicians, over 2,000 Firefly Nearby partners, and multiple specialty vendors. This breadth can improve control over care pathways, but it also multiplies handoffs, service-level dependencies, credentialing demands, and integration points. A low-reputation, AI-generated Built In summary reports early CalPERS rollout friction involving hold times and access issues; that signal is directionally adverse but not strong enough to establish incidence or duration. The same evidence set reports leaner staffing after prior workforce reductions, making capacity, response-time, and clinical escalation data essential before underwriting scaled rollout quality."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "dependencies-and-financial-model"
    title: "Dependencies and financial-model risk"
    body: "Included Health's plan model depends on employers, health plans, independently owned medical groups, technology vendors, in-person partners, and specialty-care platforms. The privacy policy requires business-associate agreements for vendors, while the commercial plan description relies on Firefly and named specialty providers for physical and complex care. Public financial visibility is much weaker: Caplight's accessible page lists historical rounds but omits amounts and valuations, and its filing records require access. Built In's AI-generated pages reference a $464 million CalPERS performance-guarantee pool, but no assigned primary contract confirms the economics. Funding raised therefore cannot be treated as cash available, and an accounting or profitability claim cannot be treated as evidence of runway."
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "residual-risk-and-kill-criteria"
    title: "Residual risk and thesis-break criteria"
    body: "The central underwriting question is whether Included Health can convert company-reported plan savings and coordinated-care claims into independently measured performance at scale. The strongest public mitigations are structural: clinician-in-the-loop AI, security controls, flexible plan configurations, and distributed provider networks. None substitutes for audited outcomes, contract-level service metrics, or external security assurance. The thesis should be paused if diligence cannot substantiate total-cost-of-care methodology, if service-level failures persist through major launches, if material privacy or clinical incidents emerge, or if performance guarantees exceed demonstrated liquidity. Because no assigned adverse search result identified a specific enforcement matter, this chapter records legal-incident status as unresolved rather than claiming that no incident exists."
    claimRefs:
      - "CR002"
      - "CR007"
      - "CR012"
      - "CR013"
      - "CR016"
    figureRefs:
      - "FR001"
