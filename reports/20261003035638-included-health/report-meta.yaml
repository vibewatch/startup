companyProfile:
  summary: >-
    Included Health is an enterprise digital health company that combines navigation, advocacy, virtual care, and
    emerging alternative-plan design for employers, health plans, and public purchasers. The company presents itself as
    a single access point for members to get coverage help, virtual care, in-person referrals, and care coordination,
    and its 2026 launches suggest a broader move from point solution toward plan and network design. Public evidence
    supports meaningful customer reach and operating scale, but not audited revenue, margins, valuation, cap-table
    ownership, or board governance.
  productSummary: >-
    Integrated healthcare navigation, advocacy, virtual primary and urgent care, specialty opinions, benefits support,
    and alternative health plan design.
  customerFocus: Large self-insured employers, health plans, and public-sector purchasers
  businessModel: >-
    Recurring enterprise PEPM or PMPM fees, virtual-care and advocacy services, and at-risk or plan-design contracts
    tied to outcomes
  stage: late-stage private
  fundingStatus: >-
    Private company with historical venture financing and no current audited public disclosure of revenue, valuation, or
    capital structure
