callouts:
  - calloutType: "insight"
    title: "Federated Multi-Agent Architecture as a Navigation Paradigm Shift"
    body: "Included Health's implementation of the Dot supergraph using LangGraph and Deep Agents addresses a fundamental tension in digital health software: delivering hyper-personalized clinical navigation without sacrificing architectural scalability. By decomposing care pathways into modular skills managed via a virtual filesystem, independent product teams can update coverage, intake, or scheduling logic autonomously while preserving a cohesive member voice and shared conversational state."
    claimRefs:
      - "CE004"
      - "CE006"
  - calloutType: "strength"
    title: "Durable Human-in-the-Loop Safeguards for Clinical Accuracy"
    body: "Unlike consumer generative AI chatbots that risk medical hallucination, Dot embeds human clinical oversight directly into graph execution. The system's ability to pause execution, seamlessly escalate uncertain conversations to human care advocates, and validate decisions against clinical annotation queues enables Included Health to achieve over 95% clinical agreement and over 99% high-risk situation detection."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
  - calloutType: "risk"
    title: "Infrastructure Integration and Data Boundary Complexities in Health Plans"
    body: "As Included Health scales its Included Health Plans alternative plan design, technical risk shifts from conversational AI toward enterprise systems integration. Managing core administrative processing, real-time EDI eligibility feeds, third-party EHR synchronization, and multi-cloud security across AWS and GCP introduces substantial operational latency and vulnerability to external clearinghouse disruptions."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE014"
