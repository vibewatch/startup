  title: "Product & Technology"
  summary: "Included Health delivers an all-in-one healthcare navigation and virtual care platform, integrating virtual primary care, urgent care, behavioral health, specialty care navigation, and alternative plan designs. The technology architecture centers on Dot, a federated multi-agent conversational system built on LangGraph and Deep Agents with continuous clinical oversight, running across AWS cloud infrastructure with stringent HIPAA compliance and EHR integrations."
sections:
  - id: "product-definition-and-service-delivery"
    title: "Product Definition and Member Service Delivery Model"
    body: "Included Health operates an integrated healthcare navigation and virtual care delivery platform designed for self-insured enterprise employers, health plans, and public purchasers. Rather than routing members through disparate point solutions, the company organizes its service delivery around an all-in-one member application and care guidance hub. The product spans five core functional capabilities: 24/7 virtual urgent care for acute ailments; dedicated virtual primary care with longitudinal disease management; behavioral health therapy and coaching; expert medical second opinions (EMO) connecting members to over 4,000 national specialists; and healthcare navigation, benefits advocacy, and medical billing resolution. At the member entry point, the platform unifies administrative and clinical intake, allowing employees and their families to resolve health coverage questions, verify deductibles, schedule appointments, or seek clinical advice from a single interface. When direct clinical care is required, services are delivered through affiliated professional medical groups—specifically Doctor On Demand Professionals, P.C.—ensuring appropriate regulatory separation between the technology platform and medical practice. This integrated delivery model aims to eliminate healthcare navigation friction, prevent avoidable emergency room visits, and optimize member utilization toward high-quality, cost-effective in-network providers."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "agentic-ai-architecture-and-dot-supergraph"
    title: "Agentic AI Architecture: The Dot Supergraph and Multi-Agent Orchestration"
    body: "The core technological engine driving conversational interaction across Included Health's digital surface is Dot, an AI-powered conversational healthcare guide. Historically, digital healthcare navigation relied on static decision trees that flattened complex, nuanced medical requests into rigid questionnaires. To overcome these limitations, Included Health re-architected its navigation platform using a federated multi-agent architecture built on LangGraph and Deep Agents. At the center of this topology sits the Dot supergraph, an orchestration layer that functions as the primary conversational router for transactional interactions, coverage inquiries, and clinical navigation. Surrounding the router are domain-specific subgraphs and sub-workflows managed by independent engineering teams, spanning urgent care intake, primary care scheduling, specialist discovery, and behavioral health. Capabilities are modularized into a Deep Agent skills capability registry stored in a virtual filesystem, which uses progressive disclosure: agents inspect compact skill summaries up front and load detailed clinical rules and eligibility parameters only upon invocation. A shared filesystem passes conversation summaries and full dialogue history between sub-agents, ensuring consistent tone and eliminating repetitive questioning when members transition between care domains. In production, this architecture achieved a 75% lift in chat engagement, over 95% clinical routing agreement from clinical review audits, and over 99% identification of high-risk medical situations."
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
    figureRefs:
      - "FE001"
  - id: "clinical-governance-human-in-the-loop-safety"
    title: "Clinical Governance, Human-in-the-Loop Integration, and Safety Guardrails"
    body: "Operating an autonomous conversational agent in a high-stakes healthcare environment necessitates strict clinical safety guardrails and seamless human integration. Included Health treats human handoff not as an edge-case exception, but as a core architectural design constraint. Leveraging LangGraph's durable execution engine, Dot maintains full dialogue state and supports indefinite execution pauses. Whenever the agent encounters conversational ambiguity, clinical uncertainty, or high-risk red-flag symptoms, it pauses the graph and routes the session to a live human member care advocate or clinical triage specialist. Crucially, the human care advocate assists the agent in unblocking the workflow, after which execution can resume with full historical context preserved across multi-turn interactions. For safety evaluation and ongoing model refinement, Included Health deploys LangSmith annotation queues where clinical teams continuously inspect and label sampled conversations, verifying whether triage recommendations were sound and ensuring emergency guardrails functioned as designed. Architectural migrations and prompt updates are validated against multi-turn user simulation evaluation suites using synthetic patient journeys before deployment to production. Furthermore, legal and operational terms explicitly clarify that non-clinical navigation and second-opinion services are provisional and do not establish a formal physician-patient relationship, reinforcing safety boundaries across digital interactions."
    claimRefs:
      - "CE005"
      - "CE007"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "enterprise-infrastructure-security-and-roadmap"
    title: "Cloud Infrastructure, Data Security, and Alternative Plan Integration"
    body: "Included Health's technical stack is deployed primarily across Amazon Web Services (AWS) cloud environments, with strategic consideration for Google Cloud Platform (GCP). The infrastructure is managed using infrastructure-as-code (Terraform), container orchestration, and automated CI/CD pipelines designed to enforce zero-trust security controls and prevent unauthorized exfiltration of Protected Health Information (PHI). Technical security controls encompass role-based access management, just-in-time (JIT) administrative provisioning, and comprehensive log auditing to maintain strict HIPAA compliance. On the frontend, engineering teams develop responsive, accessible web and mobile applications using TypeScript, React, and modular component architectures. On the backend, microservices interface with electronic health records (EHRs), external payer eligibility systems, and pharmacy benefit managers (PBMs). In 2026, Included Health expanded its platform roadmap by launching Included Health Plans, an alternative health plan design for large self-insured employers built on its All-Included-Care platform and bolstered by the acquisition of Firefly Health. This expansion integrates copay-first plan structures, curated provider networks, and AI-native primary care coordination, positioning the platform for broad commercial rollout across enterprise accounts for the 2027 plan year."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
