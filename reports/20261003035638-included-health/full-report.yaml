      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Double-Edged Sword of At-Risk Performance Contracts
            body: >-
              Included Health's expansion into massive risk-bearing arrangements, exemplified by the $464 million in
              performance guarantees under the CalPERS contract, positions the company to capture upside from health
              plan modernization. However, these at-risk guarantees fundamentally transform its financial risk profile
              from pure-play SaaS-like PEPM stability to operational insurance-adjacent execution risk.
            calloutType: insight
            claimRefs:
              - CI005
              - CI007
          - type: callout
            title: Opaque Private Valuation and Metric Disclosure Deficit
            body: >-
              Without verified ARR, gross margin splits, or balance sheet reserves, underwriters must treat reported
              profitability with caution. Margin gains achieved through successive sub-6% workforce reductions indicate
              disciplined expense management but leave open questions regarding whether margin expansion is driven by
              structural software leverage or operational belt-tightening.
            calloutType: risk
            claimRefs:
