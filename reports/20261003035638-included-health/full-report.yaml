        title: Evidence-Constrained Sizing and Adoption
        blocks:
          - type: paragraph
            body: >-
              The strongest top-down population proxy in the assigned evidence is the 160 million Americans insured
              through employers, but that population is not a revenue TAM and includes people whose sponsors may never
              buy an integrated navigation or plan product. Demand pressure is clearer: Healthcare Dive reported a 6.7%
              employer benefit-cost increase forecast for 2026 and cited another estimate around 9%. Adoption indicators
              are directionally supportive but not directly interchangeable. Mercer figures reported by Healthcare Dive
              say nearly one-third of employers offer or plan a nontraditional medical plan for 2027 and another 38% are
              considering one, whereas Included Health says nearly 41% are considering or planning alternative-plan
              features. The denominator, feature definition, and issuer differ, so combining those percentages into a
              SAM would create false precision. Included Health's reported reach of more than 300 organizations and tens
              of millions of members demonstrates distribution, not current market share or revenue.
