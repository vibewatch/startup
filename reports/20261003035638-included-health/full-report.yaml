  - id: TV002
    title: Core Thesis and Anti-Thesis Investment Drivers
    columns:
      - Investment Vector
      - Thesis Driver (Bullish)
      - Anti-Thesis Risk (Bearish)
      - Thesis-Break Indicator
    rows:
      - - Product & Plan Model
        - Comprehensive navigation combined with Firefly Health virtual-first plan design.
        - High administrative complexity and slower enterprise adoption cycles.
        - Employer plan enrollment below projections for plan year 2027.
      - - Contract Scale & Risk
        - 400,000 CalPERS PPO members demonstrate tier-one institutional credibility.
        - $464M in at-risk performance guarantees threatens liquidity if targets miss.
        - Material performance guarantee clawbacks or contract termination.
      - - Operating Efficiency
        - Achieved operational profitability by end of 2023 with lean team execution.
        - Margin gains driven by sub-6% layoffs rather than recurring operating leverage.
        - Escalating operating expenses or core talent attrition in clinical delivery.
