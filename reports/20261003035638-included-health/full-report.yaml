      - number: '7.2'
        title: Operational and quality execution
        blocks:
          - type: paragraph
            body: >-
              The 2028 health-plan launch materially expands execution scope beyond navigation and virtual care. The
              disclosed model combines plan administration, clinical steerage, more than 1,000 virtual clinicians, over
              2,000 Firefly Nearby partners, and multiple specialty vendors. This breadth can improve control over care
              pathways, but it also multiplies handoffs, service-level dependencies, credentialing demands, and
              integration points. A low-reputation, AI-generated Built In summary reports early CalPERS rollout friction
              involving hold times and access issues; that signal is directionally adverse but not strong enough to
              establish incidence or duration. The same evidence set reports leaner staffing after prior workforce
              reductions, making capacity, response-time, and clinical escalation data essential before underwriting
              scaled rollout quality.
            claimRefs:
              - CR001
              - CR003
