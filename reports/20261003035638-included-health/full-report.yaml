  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Included Health competes for healthcare-benefit budgets rather than the whole value of U.S. medical
              claims. Its evidenced scope includes benefits and claims support, care navigation, virtual primary, urgent
              and mental-health care, specialist opinions, and coordination into in-person care. The January 2026
              alternative-plan design and subsequent Included Health Plans launch extend that scope toward
              provider-network and plan design for large self-insured employers. For sizing purposes, this chapter
              includes purchaser spending on those services and excludes hospital ownership, pharmaceutical spend, fully
              insured underwriting risk, Medicare- centered provider risk, and direct-to-consumer care not purchased
              through a sponsoring organization. Status-quo substitutes include legacy insurer-led plan designs,
              separate navigation and telehealth point solutions, internal benefits teams, and conventional
              fee-for-service care. Independent coverage describes the employee-benefits field as crowded, making vendor
              consolidation a possible demand driver but not proof of rapid switching.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM016
