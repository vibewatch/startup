      - number: '7.4'
        title: Residual risk and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The central underwriting question is whether Included Health can convert company-reported plan savings and
              coordinated-care claims into independently measured performance at scale. The strongest public mitigations
              are structural: clinician-in-the-loop AI, security controls, flexible plan configurations, and distributed
              provider networks. None substitutes for audited outcomes, contract-level service metrics, or external
              security assurance. The thesis should be paused if diligence cannot substantiate total-cost-of-care
              methodology, if service-level failures persist through major launches, if material privacy or clinical
              incidents emerge, or if performance guarantees exceed demonstrated liquidity. Because no assigned adverse
              search result identified a specific enforcement matter, this chapter records legal-incident status as
              unresolved rather than claiming that no incident exists.
            claimRefs:
