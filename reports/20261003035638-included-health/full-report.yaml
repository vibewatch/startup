      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Rising benefit costs, concentrated high-cost populations, and purchaser interest in nontraditional designs
              create a credible adoption motive. Included Health says roughly three-quarters of commercial-population
              costs come from 10% of employees, supporting the logic for personalized navigation and coordinated primary
              care. Constraints are equally material: independent sources call the market crowded or fiercely
              competitive, the company has not disclosed current pricing or category revenue in the assigned evidence,
              and large contracts require measurable outcomes at scale. Two Built In pages repeat useful CalPERS scale
              figures, but both explicitly say their content is LLM-generated and not definitive; those figures are
              therefore weak triangulation rather than an independent benchmark. Valuation should reward the broader
              addressable workflow only after diligence establishes renewal behavior, unit economics, independently
              measured cost savings, and the revenue contribution of plan administration versus navigation and care
              delivery.
