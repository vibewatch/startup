  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Architecture, Taxonomy, and Alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Included Health sits at the contested intersection of employee
              health navigation, virtual clinical care delivery, and alternative health plan design. Enterprise buyers,
              predominantly self-insured employers, health plans, and public purchasers, evaluate alternatives across
              five distinct categories: clinical care navigators, virtual care and primary care platforms,
              payer-embedded navigation suites, point-solution aggregators, and internal benefits operations. Clinical
              navigation competitors such as Accolade, Quantum Health, Rightway Healthcare, and Health Advocate
              emphasize high-touch advocacy, concierge scheduling, and claims resolution to lower medical trend and
              eliminate administrative confusion for covered workforces. Meanwhile, virtual-first peers like
              Transcarent, Healthee, and Garner Health combine digital front doors with virtual clinics and
              out-of-pocket incentives to guide patient steerage before utilization occurs.


              In parallel, dominant national medical carriers and third-party administrators (TPAs) represent both key
              distribution channels and entrenched status-quo substitutes. Carriers frequently bundle proprietary care
              management and digital navigation tools directly into core administrative services only (ASO) agreements,
              creating strong economic inertia against third-party carve-out solutions. Furthermore, self-insured
              employers evaluate internal build options, relying on internal HR benefits teams, standard carrier nurse
              lines, and basic employee assistance programs (EAPs) rather than contracting specialized vendors. The rise
              of alternative plan designs has elevated the competitive stakes: rather than acting merely as an add-on
              navigation overlay, Included Health is expanding into a full health plan alternative through its
              All-Included-Care platform, Alternative Plan Design programs, and the planned acquisition of Firefly
              Health, positioning the firm into direct head-to-head competition with both incumbent payer ASO offerings
              and disruptive digital health plan designs.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP010
      - number: '3.2'
        title: Competitor Profiles, Scale, and Relative Capability Benchmarks
        blocks:
          - type: paragraph
            body: >-
              A comparative assessment across primary healthcare navigation and virtual care competitors highlights
              distinct operational models, funding scale, and trade-offs in clinical depth. Included Health holds a
              distinctive platform footprint resulting from the combination of Grand Rounds' clinical decision science
              and Doctor On Demand's nationwide virtual physician practice. This integrated footprint enables Included
              Health to offer 24/7 virtual urgent care, primary care, behavioral health, and expert medical opinions
              (EMO) alongside navigation advocates. In contrast, pure-play navigators like Quantum Health and Health
              Advocate rely heavily on human care coordinators, nurse call centers, and claims data feeds, typically
              lacking an owned, nationwide medical group to directly deliver longitudinal primary care.


              Competitors such as Accolade feature broad enterprise relationships and virtual primary care capabilities,
              but face ongoing margin and customer satisfaction pressures across public review forums. Newer market
              entrants including Rightway Healthcare and Transcarent emphasize modern digital user experiences and
              bundled pharmacy benefits management (PBM) navigation or surgery bundles, yet operate with smaller covered
              populations or multi-brand acquisition complexities. Independent vendor RFP benchmark data reveals that
              while Included Health demonstrates high feature breadth (rated 4.2 out of 5.0 for health navigation
              capabilities), its composite score among navigation alternatives ranks in the bottom quartile (#11 of 13
              platforms) due to sparse public pricing transparency, implementation complexity, and sharp divergence
              between curated employer testimonials and public consumer reviews. In employee sentiment comparisons
              tracked on Comparably, Included Health ranks favorably against immediate peers in CEO rating, workplace
              culture, and net promoter scores, though enterprise buyers must reconcile internal culture metrics with
              real-world member support experiences.
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
              - CP012
      - number: '3.3'
        title: Pricing Structures, Packaging, and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercial structures in enterprise healthcare navigation and virtual care center around
              per-member-per-month (PMPM) or per-employee-per-month (PEPM) subscription fees, frequently combined with
              at-risk performance guarantees. Included Health packages its platform into modular tiers—including
              Included Navigation, Included Care Clinic, All-Included Care, and Alternative Plan Design—with estimated
              industry PEPM ranges typically falling between $2 and $10 depending on module depth and clinical staffing
              scope. However, Included Health does not publish standardized rate cards, requiring bespoke RFP quoting
              and actuarial modeling for each employer account. This quote-only pricing dynamic is shared by primary
              rivals such as Accolade, Quantum Health, and Health Advocate, creating opaque procurement environments
              where total cost of ownership (TCO) is heavily influenced by hidden implementation expenses.


              For enterprise buyers, the true TCO extends well beyond baseline software and advocacy subscription fees.
              High-friction variables include complex carrier eligibility and claims file integrations, member
              activation campaigns, internal HR change management, and ongoing TPA coordination. A significant
              commercial challenge across the navigation category is ROI attribution: proving that vendor intervention
              directly bent medical cost trends rather than reflecting random claim volatility requires sophisticated
              actuarial audits. Switching costs remain exceptionally high: replacing an incumbent navigation platform
              risks disruption during annual open enrollment, confusion over digital front-door branding, and potential
              employee frustration if provider networks or claims advocacy teams shift. These high switching hurdles
              protect incumbent vendors against rapid displacement, yet also lengthen sales cycles for Included Health
              when attempting to unseat established carrier tools or entrenched competitors.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability, Displacement Hazards, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Included Health's long-term competitive durability relies on the defensibility of its data-driven provider
              quality matching algorithms, its curated network of over 4,000 specialist second-opinion experts, and its
              proprietary All-Included-Care technology infrastructure. Furthermore, the company is fortifying its moat
              through proprietary AI innovations, including its Dot conversational agent and Provider Connect navigation
              engine, which operate under strict Zero Data Retention and enterprise HIPAA/BAA safeguards. By moving
              deeper into risk-bearing Alternative Plan Designs and integrating Firefly Health's clinically integrated
              network, Included Health seeks to escape software commoditization and capture broader plan administrative
              spend.


              Nevertheless, the company faces severe displacement threats and significant adverse evidence. National
              health insurance carriers (such as UnitedHealthcare, Elevance, and Cigna) are aggressively enhancing their
              native navigation apps and virtual care partnerships, leveraging existing distribution power to discount
              or bundle navigation for self-insured clients. Simultaneously, public review platforms expose critical
              operational vulnerabilities: member reviews on Trustpilot and consumer directories repeatedly document
              persistent billing disputes, denied reimbursements, delayed insurance eligibility synchronizations, and
              unresponsive customer support. Furthermore, while employer case studies highlight fast virtual access,
              consumer reviewers frequently express skepticism toward navigation value when referrals to local
              specialists still require substantial self-service. If technical integration delays and customer service
              bottlenecks persist during large employer rollouts, Included Health risks member churn, consultant
              downgrades, and contract renegotiation pressures.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP008
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Convergence of Navigation and Alternative Plan Design
            body: >-
              Health navigation vendors face diminishing returns from selling standalone advocacy overlays as employers
              push to consolidate vendor sprawl. Included Health's introduction of Alternative Plan Designs and its
              strategic acquisition of Firefly Health indicate that competitive dominance requires capturing the
              underlying health plan administration and primary care foundation, effectively challenging legacy
              commercial health plan models directly.
            calloutType: insight
            claimRefs:
              - CP003
              - CP007
              - CP011
          - type: callout
            title: Disparities Between Enterprise Case Studies and Public Member Reviews
            body: >-
              While employer-facing RFP assessments and marketing materials praise Included Health's care coordination,
              public consumer review platforms reflect pronounced member dissatisfaction concerning billing disputes,
              delayed eligibility file synchronization, and unresolved claims. This disconnect represents a tangible
              procurement hazard, as unmanaged employee friction directly undermines enterprise benefits ROI and renewal
              durability.
            calloutType: risk
            claimRefs:
              - CP008
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Architecture and Revenue Streams
        blocks:
          - type: paragraph
            body: >-
              Included Health generates commercial revenue by contracting directly with self-insured enterprise
              employers, health plans, labor unions, and public sector purchasers. The legacy navigation and virtual
              care offerings are structured around per-employee-per-month (PEPM) subscription fees, creating recurring
              baseline cash flow tied to covered headcount. Beyond standard recurring benefit administration fees, the
              company has expanded aggressively into outcomes-linked shared savings and alternative plan design.
              Commercial contracts increasingly feature performance guarantees tied to clinical quality targets, member
              steering to high-tier network physicians, and medical trend reduction. With the acquisition of Firefly
              Health and the rollout of Included Health Plans, the business model introduces integrated copay-first
              alternative plan designs, shifting monetization toward broader enterprise health benefit administration
              and deeper value-based risk sharing across virtual and in-person care.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
