      - number: '6.3'
        title: Named Proof and Expansion Mechanics
        blocks:
          - type: paragraph
            body: >-
              Named-customer proof is uneven. Landbase's commercial dataset lists Charles Schwab, Moderna, and Alameda
              Health System among its displayed sample, but it does not establish contract scope, production status,
              renewal, or outcomes. Included Health's newsroom records a June 2024 CalPERS partnership announcement,
              although the reviewed listing supplies no deployment details. The freshest expansion evidence is the
              August 2026 Carrum partnership: partner and independent reporting agree that Carrum's Centers of
              Excellence will be embedded in Included Health's alternative plan, with specialty needs identified through
              care and data touchpoints and members returned to Included Health after treatment. That documents an
              expansion mechanism, not measured adoption or realized savings.
