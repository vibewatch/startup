      - number: '6.2'
        title: Scale and Adoption Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest scale disclosures are indicators rather than a comparable adoption series. Included Health
              and partner-issued materials describe nationwide service to millions of people, while the company homepage
              displays a 4.9-out-of-5 member rating without a visible sample size or methodology. Landbase separately
              reports 107 verified company users, but the page labels the figure as 2026 while also stating that its
              data was updated on August 17, 2025. These measures use different populations and vintages: eligible or
              served people, a commercial account list, a self-published satisfaction score, and plan availability. None
              reveals activation, monthly active use, repeat care, or account-level utilization.
