  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Included Health's privacy policy shows a broad compliance perimeter: the company handles identifiers,
              benefit eligibility, claims, clinical records, communications, and technical usage data, while serving
              members through independently owned professional practices. That structure creates exposure across HIPAA,
              state privacy rules, professional-practice requirements, and vendor oversight. The policy describes
              business-associate agreements, encryption, access controls, audits, training, and breach notification as
              mitigations, but these are company assertions rather than independent control tests. The policy also
              concedes that no system is completely secure. Accordingly, the residual risk is not that controls are
              absent; it is that their operating effectiveness, vendor coverage, and state-by-state implementation
              cannot be verified from the assigned public evidence.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
