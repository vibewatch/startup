      - number: '7.3'
        title: Dependencies and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Included Health's plan model depends on employers, health plans, independently owned medical groups,
              technology vendors, in-person partners, and specialty-care platforms. The privacy policy requires
              business-associate agreements for vendors, while the commercial plan description relies on Firefly and
              named specialty providers for physical and complex care. Public financial visibility is much weaker:
              Caplight's accessible page lists historical rounds but omits amounts and valuations, and its filing
              records require access. Built In's AI-generated pages reference a $464 million CalPERS
              performance-guarantee pool, but no assigned primary contract confirms the economics. Funding raised
              therefore cannot be treated as cash available, and an accounting or profitability claim cannot be treated
              as evidence of runway.
