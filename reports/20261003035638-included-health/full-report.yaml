        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite the guarantee pool from secondary summaries
            body: >-
              Two AI-generated Built In pages cite approximately 400,000 CalPERS PPO members and $464 million in at-risk
              performance guarantees. Without the contract, denominator, payment mechanics, and Included Health's share
              of exposure, that figure is a diligence lead rather than a quantified liability.
            calloutType: risk
            claimRefs:
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish thesis for Included Health centers on its evolution from a legacy navigation vendor into a
              comprehensive healthcare delivery and alternative health plan platform. By pairing longitudinal virtual
              primary care with in-person navigation and the proprietary Dot AI assistant, Included Health addresses
              employer demand for predictable healthcare trend and clinical quality. Marquee contract wins, including
              the CalPERS partnership covering approximately 400,000 PPO members backed by $464 million in performance
              guarantees, demonstrate substantial enterprise scale. Furthermore, strategic capability expansion via the
              acquisition of Firefly Health adds virtual-first health plan infrastructure and administrative services
              only capabilities. Conversely, the anti-thesis underscores that clinical navigation and alternative health
              plan administration impose substantial execution complexity and downside risk. Managing $464 million in
              performance guarantees exposes the operating model to severe underwriting penalties if clinical quality or
              total cost of care targets fall short. Furthermore, reported margin expansion has coincided with repeated
              workforce reductions under 6%, raising concern that bottom-line improvements stem primarily from overhead
              trimming rather than high-margin organic operating leverage.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: Capital Structure, Prior Rounds, and Pricing Discovery
        blocks:
          - type: paragraph
            body: >-
              Included Health's historical equity financing reflects substantial venture backing, but contemporary
              valuation discovery remains severely constrained. The company's last major primary funding event was a
              Series E preferred round in September 2020 that established a post-money valuation mark of $1.13 billion,
              with cumulative funding reported across private tracking platforms at $328 million to $529.32 million.
              Subsequent structural combinations, including the merger of Grand Rounds and Doctor On Demand alongside
              the integration of legacy Included Health, transformed operating scope without providing public cap-table
              transparency or audited per-share valuation marks. On secondary marketplaces, pricing indications remain
              fragmented. Historical trade platforms recorded an indicative NPM share price of $1.66 in September 2026,
              yet trade volume is illiquid and unvetted by company disclosures, while primary trading activity on
              platforms like Forge remains limited without an active matched trading price. In the absence of an active
              S-1 registration or formal IPO schedule, the private equity mark remains anchored to historical rounds
              rather than audited current-year financial performance.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV012
      - number: '8.3'
        title: Scenario Analysis, Peer Multiples, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Included Health requires scenario-based modeling that accounts for differing outcomes in
              alternative health plan adoption and execution risks. Under a bull scenario, rapid uptake of Included
              Health Plans by self-insured employers and flawless performance under CalPERS guarantees could unlock
              strong top-line growth and justify an IPO at premium multiples comparable to scaled digital healthcare
              leaders. Under the base case, steady navigation growth and modest plan adoption maintain enterprise
              viability but yield moderate multiple expansion given employer procurement cycles. In the bear scenario,
              customer service friction during large rollouts or failures to achieve clinical savings could trigger
              severe performance guarantee penalties, eroding liquidity and prompting a down-round valuation reset. Peer
              comparisons across navigation and primary care platforms—including Quantum Health, Transcarent, and apree
              health—demonstrate that enterprise value hinges upon verified clinical ROI and sustainable gross
              retention. Prospective investors must condition capital deployment on explicit diligence asks: audited
              GAAP income statements, cohort-level net revenue retention for marquee accounts, and verified underwriting
              reserves for at-risk performance contracts.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Research-More Under Stretched Valuation Marks'
            body: >-
              We assign Included Health a research-more stance with high risk rating. While the company's strategic move
              into alternative health plan design via Firefly Health and its massive CalPERS partnership showcase
              undeniable commercial traction, the presence of $464 million in at-risk performance guarantees alongside
              zero audited financial disclosure creates an asymmetric risk profile. Until audited GAAP financials and
              verifiable retention metrics are available, private secondary valuation marks cannot be confirmed.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV016
