      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Large self-insured employers are the clearest near-term buyers: benefits and finance leaders sponsor the
              purchase, the employer funds care, and employees and dependents use the service. Health plans, public
              purchasers, and union programs are additional organizational channels, although the assigned evidence does
              not identify their precise budget lines or approval owners. The product can enter as navigation or virtual
              care and broaden toward integrated plan design, but each expansion changes the buying case from
              convenience to measurable total-cost and quality accountability. Walmart and CalPERS illustrate the scale
              and outcome orientation of enterprise deployments; their company-reported results should not be
              generalized into a market-wide ROI. Firefly adds an integrated-plan capability and a reported
              20,000-person base, while the combined proposition aims to substitute for traditional plan arrangements
              rather than merely add another point solution.
