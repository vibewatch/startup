  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Included Health describes a single access point for virtual and in-person care, provider navigation,
              benefits support, billing advocacy, and clinical coordination. The current company traces its integrated
              model to the 2021 combination of Grand Rounds Health and Doctor On Demand, rather than to a newly founded
              greenfield platform. Its commercial route is primarily business-to-business-to-consumer: employers and
              health plans provide the benefit, while members use the app and care teams. Company materials say the
              platform reaches millions nationwide and works with more than 300 employers, health plans, and
              public-sector groups. Those are company-issued scale claims, not independently audited customer or
              utilization measures.
