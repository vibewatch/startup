  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario Case
      - Operating & Growth Assumptions
      - Valuation & Multiple Trajectory
      - Key Risk Factors
      - Probability Signal
    rows:
      - - Bull Case
        - Included Health Plans scales across self-insured employers; CalPERS hits quality targets.
        - Multiple expands toward upper-quartile digital health comps (>3.0x revenue); IPO window opens.
        - Regulatory delays in health plan licensing; competitor replication of AI navigation.
        - Moderate (25%)
      - - Base Case
        - Steady core navigation retention; Firefly integration delivers incremental plan adoption.
        - Valuation holds at parity with Series E mark ($1.1B - $1.5B); moderate growth.
        - Lengthening enterprise sales cycles; customer hesitation regarding plan switching.
        - High (55%)
      - - Bear Case
        - Service disruptions occur during CalPERS rollout; performance guarantee penalties trigger.
        - Steep multiple compression; secondary price collapse below $1.00; restructuring needed.
        - Substantial cash clawbacks under $464M at-risk contracts; buyer churn.
        - Moderate (20%)
    notes: >-
      Scenario weights and multiple expectations represent qualitative synthesis; absence of audited revenue precludes
      DCF modeling.
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
