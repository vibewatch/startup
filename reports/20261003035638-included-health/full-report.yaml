      - number: '5.2'
        title: 'Agentic AI Architecture: The Dot Supergraph and Multi-Agent Orchestration'
        blocks:
          - type: paragraph
            body: >-
              The core technological engine driving conversational interaction across Included Health's digital surface
              is Dot, an AI-powered conversational healthcare guide. Historically, digital healthcare navigation relied
              on static decision trees that flattened complex, nuanced medical requests into rigid questionnaires. To
              overcome these limitations, Included Health re-architected its navigation platform using a federated
              multi-agent architecture built on LangGraph and Deep Agents. At the center of this topology sits the Dot
              supergraph, an orchestration layer that functions as the primary conversational router for transactional
              interactions, coverage inquiries, and clinical navigation. Surrounding the router are domain-specific
              subgraphs and sub-workflows managed by independent engineering teams, spanning urgent care intake, primary
              care scheduling, specialist discovery, and behavioral health. Capabilities are modularized into a Deep
              Agent skills capability registry stored in a virtual filesystem, which uses progressive disclosure: agents
              inspect compact skill summaries up front and load detailed clinical rules and eligibility parameters only
              upon invocation. A shared filesystem passes conversation summaries and full dialogue history between
              sub-agents, ensuring consistent tone and eliminating repetitive questioning when members transition
              between care domains. In production, this architecture achieved a 75% lift in chat engagement, over 95%
              clinical routing agreement from clinical review audits, and over 99% identification of high-risk medical
              situations.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.3'
        title: Clinical Governance, Human-in-the-Loop Integration, and Safety Guardrails
        blocks:
          - type: paragraph
            body: >-
              Operating an autonomous conversational agent in a high-stakes healthcare environment necessitates strict
              clinical safety guardrails and seamless human integration. Included Health treats human handoff not as an
              edge-case exception, but as a core architectural design constraint. Leveraging LangGraph's durable
              execution engine, Dot maintains full dialogue state and supports indefinite execution pauses. Whenever the
              agent encounters conversational ambiguity, clinical uncertainty, or high-risk red-flag symptoms, it pauses
              the graph and routes the session to a live human member care advocate or clinical triage specialist.
              Crucially, the human care advocate assists the agent in unblocking the workflow, after which execution can
              resume with full historical context preserved across multi-turn interactions. For safety evaluation and
              ongoing model refinement, Included Health deploys LangSmith annotation queues where clinical teams
              continuously inspect and label sampled conversations, verifying whether triage recommendations were sound
              and ensuring emergency guardrails functioned as designed. Architectural migrations and prompt updates are
              validated against multi-turn user simulation evaluation suites using synthetic patient journeys before
              deployment to production. Furthermore, legal and operational terms explicitly clarify that non-clinical
              navigation and second-opinion services are provisional and do not establish a formal physician-patient
              relationship, reinforcing safety boundaries across digital interactions.
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE011
      - number: '5.4'
        title: Cloud Infrastructure, Data Security, and Alternative Plan Integration
        blocks:
          - type: paragraph
            body: >-
              Included Health's technical stack is deployed primarily across Amazon Web Services (AWS) cloud
              environments, with strategic consideration for Google Cloud Platform (GCP). The infrastructure is managed
              using infrastructure-as-code (Terraform), container orchestration, and automated CI/CD pipelines designed
              to enforce zero-trust security controls and prevent unauthorized exfiltration of Protected Health
              Information (PHI). Technical security controls encompass role-based access management, just-in-time (JIT)
              administrative provisioning, and comprehensive log auditing to maintain strict HIPAA compliance. On the
              frontend, engineering teams develop responsive, accessible web and mobile applications using TypeScript,
              React, and modular component architectures. On the backend, microservices interface with electronic health
              records (EHRs), external payer eligibility systems, and pharmacy benefit managers (PBMs). In 2026,
              Included Health expanded its platform roadmap by launching Included Health Plans, an alternative health
              plan design for large self-insured employers built on its All-Included-Care platform and bolstered by the
              acquisition of Firefly Health. This expansion integrates copay-first plan structures, curated provider
              networks, and AI-native primary care coordination, positioning the platform for broad commercial rollout
              across enterprise accounts for the 2027 plan year.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Federated Multi-Agent Architecture as a Navigation Paradigm Shift
            body: >-
              Included Health's implementation of the Dot supergraph using LangGraph and Deep Agents addresses a
              fundamental tension in digital health software: delivering hyper-personalized clinical navigation without
              sacrificing architectural scalability. By decomposing care pathways into modular skills managed via a
              virtual filesystem, independent product teams can update coverage, intake, or scheduling logic
              autonomously while preserving a cohesive member voice and shared conversational state.
            calloutType: insight
            claimRefs:
              - CE004
              - CE006
          - type: callout
            title: Durable Human-in-the-Loop Safeguards for Clinical Accuracy
            body: >-
              Unlike consumer generative AI chatbots that risk medical hallucination, Dot embeds human clinical
              oversight directly into graph execution. The system's ability to pause execution, seamlessly escalate
              uncertain conversations to human care advocates, and validate decisions against clinical annotation queues
              enables Included Health to achieve over 95% clinical agreement and over 99% high-risk situation detection.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: Infrastructure Integration and Data Boundary Complexities in Health Plans
            body: >-
              As Included Health scales its Included Health Plans alternative plan design, technical risk shifts from
              conversational AI toward enterprise systems integration. Managing core administrative processing,
              real-time EDI eligibility feeds, third-party EHR synchronization, and multi-cloud security across AWS and
              GCP introduces substantial operational latency and vulnerability to external clearinghouse disruptions.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, User, and Payer Segments
        blocks:
          - type: paragraph
            body: >-
              Included Health's public commercial surface is primarily business-to-business-to-consumer: employers,
              health plans, and other insurance purchasers arrange access, while enrolled employees, members, and
              qualifying dependents use the service. The company presents care guidance, claims and billing help,
              virtual and in-person care, and specialty support as a covered benefit rather than a uniformly
              direct-to-consumer product. Its January 2026 plan announcement adds a large self-insured-employer offer
              centered on primary care and a curated provider network. Public sources do not disclose segment revenue,
              contract values, buyer concentration, or a consistent payer split, so the relative economic importance of
              employers versus health plans cannot be quantified.
