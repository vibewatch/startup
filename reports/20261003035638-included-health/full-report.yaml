      - number: '6.4'
        title: Durability, Concentration, and Service Limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose net or gross revenue retention, logo churn, renewal cohorts, contract
              duration by segment, top-customer revenue share, or channel concentration. Those omissions prevent a
              defensible durability or concentration judgment despite visible reach. The legal terms also narrow what
              broad service messaging proves: not every user is eligible for all virtual-care services, and the company
              does not warrant that site functions will be uninterrupted or error-free. These are contractual
              limitations, not evidence of an outage or failed deployment. Diligence should therefore reconcile
              eligibility, active use, renewals, and revenue by account before treating millions of people or named
              organizations as durable commercial adoption.
