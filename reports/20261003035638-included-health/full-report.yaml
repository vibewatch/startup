  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Member Service Delivery Model
        blocks:
          - type: paragraph
            body: >-
              Included Health operates an integrated healthcare navigation and virtual care delivery platform designed
              for self-insured enterprise employers, health plans, and public purchasers. Rather than routing members
              through disparate point solutions, the company organizes its service delivery around an all-in-one member
              application and care guidance hub. The product spans five core functional capabilities: 24/7 virtual
              urgent care for acute ailments; dedicated virtual primary care with longitudinal disease management;
              behavioral health therapy and coaching; expert medical second opinions (EMO) connecting members to over
              4,000 national specialists; and healthcare navigation, benefits advocacy, and medical billing resolution.
              At the member entry point, the platform unifies administrative and clinical intake, allowing employees and
              their families to resolve health coverage questions, verify deductibles, schedule appointments, or seek
              clinical advice from a single interface. When direct clinical care is required, services are delivered
              through affiliated professional medical groups—specifically Doctor On Demand Professionals, P.C.—ensuring
              appropriate regulatory separation between the technology platform and medical practice. This integrated
              delivery model aims to eliminate healthcare navigation friction, prevent avoidable emergency room visits,
              and optimize member utilization toward high-quality, cost-effective in-network providers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
