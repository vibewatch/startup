evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Current capitalization table, financing history, investor ownership, debt, secondary transactions, and cash
      balance.
    whyItMatters: >-
      Without ownership and financing detail, control, dilution, liquidation preference, and available-capital risk
      cannot be assessed.
    diligencePath: >-
      Request the fully diluted cap table, financing documents, debt agreements, latest 409A, recent secondary data, and
      current cash statement from management.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Current revenue, ARR, growth, gross margin, EBITDA, free cash flow, and segment economics.
    whyItMatters: >-
      Operating scale cannot be translated into growth quality, profitability, burn, or valuation support without
      audited period-specific financials.
    diligencePath: >-
      Obtain audited historical statements, current management accounts, cohort revenue, contribution margin, and a
      revenue-to-cash reconciliation.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board roster, committee structure, voting rights, investor directors, observer rights, and executive
      succession plans.
    whyItMatters: >-
      The public executive roster does not establish oversight independence, control allocation, or resilience to
      key-person loss.
    diligencePath: >-
      Request the charter, bylaws, board and committee lists, voting agreements, recent board minutes, and succession
      documentation.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: identity
    missingEvidence: Primary support for the original founding date, legal headquarters, and current office footprint.
    whyItMatters: >-
      The assigned evidence establishes the 2021 combination and San Francisco operating identity but not the full legal
      chronology.
    diligencePath: Review incorporation records, foreign qualifications, leases, and the corporate entity chart.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Exhaustive investor, board, executive, client, and acquisition-counterparty stakeholder enumeration.
    whyItMatters: >-
      The sample map cannot reveal ownership concentration, related-party influence, customer concentration, or
      integration control.
    diligencePath: >-
      Reconcile the cap table, board materials, top-customer schedule, organization chart, and Firefly transaction
      documents.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: acquisition-status
    missingEvidence: >-
      Confirmation that the Firefly Health acquisition closed, including final timing, consideration, financing, and
      regulatory conditions.
    whyItMatters: >-
      A signed agreement does not establish ownership, integration, or the balance-sheet impact of a completed
      transaction.
    diligencePath: Request the executed closing set and search regulator and company notices for a post-closing announcement.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Category revenue, Included Health pricing, exact eligible purchaser counts, and revenue split across navigation,
      care delivery, and plan administration.
    whyItMatters: >-
      Covered lives and adoption intent cannot be translated into a monetizable TAM, SAM, SOM, or market share without
      prices and eligible-buyer denominators.
    diligencePath: >-
      Request segment revenue, contracted PEPM or administrative-fee ranges, customer mix, and a bottoms-up
      eligible-employer count from management.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-roi
    missingEvidence: >-
      Independent study materials for the Walmart, CalPERS, and Firefly cost and quality outcomes, including cohorts,
      benchmarks, exclusions, and observation periods.
    whyItMatters: >-
      Company-described savings and performance guarantees do not establish repeatable ROI across the broader buyer
      population.
    diligencePath: >-
      Obtain study protocols, claims-based outcome files, purchaser attestations, and renewal decisions for
      representative large contracts.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: adoption-intent
    missingEvidence: >-
      Original survey instruments and denominators behind the nearly one-third, 38%, and nearly 41% employer adoption
      figures.
    whyItMatters: Differently defined intent measures cannot support a single adoption rate or SAM conversion assumption.
    diligencePath: >-
      Review the underlying Mercer survey and the source used in Included Health's release, then normalize population,
      question wording, and plan-year basis.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Official vendor PEPM and PMPM rate cards, module-specific pricing tiers, and implementation fee schedules across
      Included Health and primary competitors.
    whyItMatters: >-
      Without published pricing schedules, buyers and analysts must rely on estimated ranges ($2-$10 PEPM) that obscure
      true margin realization and competitive pricing pressure.
    diligencePath: Obtain blinded enterprise RFP bid compilations, consultant fee surveys, or customer contracts under NDA.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: member-retention-metrics
    missingEvidence: >-
      Audited logo churn, gross revenue retention (GRR), net revenue retention (NRR), and multi-year renewal rates for
      enterprise navigation accounts.
    whyItMatters: >-
      Prevents independent verification of whether member billing and support friction translates into enterprise
      customer churn or contract downsizing.
    diligencePath: Review vendor customer success audit reports, CFO financial presentations, or audited renewal statistics.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited GAAP income statement, balance sheet, and segment gross margin reporting.
    whyItMatters: >-
      Without audited figures, gross margin durability, clinician utilization costs, and true EBITDA quality cannot be
      confirmed.
    diligencePath: Obtain confidential offering memorandum, audited GAAP financials, and detailed management accounts under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Current NRR, GRR, logo churn, renewal rates, contract duration, and account-level expansion by customer cohort.
    whyItMatters: Reach and named-account indicators cannot establish whether customers renew, expand, or contract over time.
    diligencePath: >-
      Request three years of customer and revenue cohort waterfalls, renewal schedules, churn reasons, and module
      expansion by buyer segment.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer and top-ten revenue shares, covered-life concentration, and revenue mix across employers, health
      plans, public purchasers, and partners.
    whyItMatters: >-
      The economic exposure to any named customer or distribution channel cannot be quantified from public reach
      disclosures.
    diligencePath: >-
      Obtain customer-level ARR or revenue, covered lives, contract term, renewal date, and channel attribution for the
      largest twenty accounts.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A current customer census with contract scope, production status, covered lives, utilization, outcomes, and
      renewal status.
    whyItMatters: >-
      A commercial vendor list and company announcement index do not distinguish active production deployments from
      stale, partial, or historical relationships.
    diligencePath: >-
      Reconcile the public names against management's customer roster and validate a stratified sample directly with
      customer references.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register completeness
    missingEvidence: A complete search of federal and state court, regulator, licensing-board, and breach-notification records.
    whyItMatters: >-
      The assigned adverse query returned no retained result, which cannot establish the absence of litigation,
      enforcement, breaches, or license issues.
    diligencePath: >-
      Run counsel-led searches across PACER, state courts, HHS OCR, state attorneys general, medical boards, and breach
      registries.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: security and AI control effectiveness
    missingEvidence: >-
      Independent assurance over privacy controls, model accuracy, clinical escalation, bias testing, and incident
      response.
    whyItMatters: Company policy and product descriptions establish intended controls but not their operating effectiveness.
    diligencePath: >-
      Obtain SOC 2 and penetration-test reports, model cards, clinical safety evaluations, incident logs, and
      remediation evidence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: health-plan economics and liquidity
    missingEvidence: >-
      Audited savings calculations, contract-level guarantee mechanics, current cash, debt, burn, working capital, and
      loss-allocation terms.
    whyItMatters: >-
      Funding history does not establish cash available, and secondary guarantee figures do not establish Included
      Health's actual downside.
    diligencePath: >-
      Review audited financials, bank and debt schedules, board forecasts, plan contracts, guarantee waterfalls, and
      cohort-level claims reconciliations.
    relatedQuestionRefs:
      - QR007
      - QR010
    relatedTableRefs:
      - TR003
  - type: access-blocked
    severity: minor
    topic: syndicated launch release
    missingEvidence: Substantive body text from the Fidelity-hosted Business Wire release allocated as a net-new source.
    whyItMatters: >-
      The successful retrieval returned a JavaScript shell, so the page cannot independently support plan-launch or
      acquisition details.
    diligencePath: >-
      Use the already retained HIT Consultant and official newsroom evidence for current claims; treat the Fidelity URL
      as access-limited provenance only.
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited GAAP income statement, balance sheet, and annual recurring revenue disclosure for Included Health.
    whyItMatters: >-
      Without audited revenue and margin data, valuation multiples cannot be reliably benchmarked against public
      healthcare comps.
    diligencePath: Request confidential disclosure schedule and audited financial statements under NDA.
    relatedQuestionRefs:
      - QV001
      - QV006
  - type: missing-source
    severity: material
    topic: secondary-liquidity
    missingEvidence: Comprehensive private secondary transaction volume and verified order-book depth for Included Health stock.
    whyItMatters: >-
      Isolated platform price quotes lack verifiable trade volume, preventing clear discovery of current market clearing
      price.
    diligencePath: Engage institutional private secondary brokers to audit completed transaction volume and cap table transfer logs.
    relatedQuestionRefs:
      - QV002
