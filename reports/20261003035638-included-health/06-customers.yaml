chapter:
  number: 6
  title: "Customers"
  summary: "Included Health is distributed through employers and health plans to covered members, with fresh evidence of a large-employer plan launch and a Carrum specialty-care integration. Public proof supports broad reach and several named organizations, but current retention, renewal, utilization, contract-value, and concentration data remain unavailable."
sections:
  - id: "buyer-user-and-payer-segments"
    title: "Buyer, User, and Payer Segments"
    body: "Included Health's public commercial surface is primarily business-to-business-to-consumer: employers, health plans, and other insurance purchasers arrange access, while enrolled employees, members, and qualifying dependents use the service. The company presents care guidance, claims and billing help, virtual and in-person care, and specialty support as a covered benefit rather than a uniformly direct-to-consumer product. Its January 2026 plan announcement adds a large self-insured-employer offer centered on primary care and a curated provider network. Public sources do not disclose segment revenue, contract values, buyer concentration, or a consistent payer split, so the relative economic importance of employers versus health plans cannot be quantified."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "scale-and-adoption-signals"
    title: "Scale and Adoption Signals"
    body: "The strongest scale disclosures are indicators rather than a comparable adoption series. Included Health and partner-issued materials describe nationwide service to millions of people, while the company homepage displays a 4.9-out-of-5 member rating without a visible sample size or methodology. Landbase separately reports 107 verified company users, but the page labels the figure as 2026 while also stating that its data was updated on August 17, 2025. These measures use different populations and vintages: eligible or served people, a commercial account list, a self-published satisfaction score, and plan availability. None reveals activation, monthly active use, repeat care, or account-level utilization."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-expansion"
    title: "Named Proof and Expansion Mechanics"
    body: "Named-customer proof is uneven. Landbase's commercial dataset lists Charles Schwab, Moderna, and Alameda Health System among its displayed sample, but it does not establish contract scope, production status, renewal, or outcomes. Included Health's newsroom records a June 2024 CalPERS partnership announcement, although the reviewed listing supplies no deployment details. The freshest expansion evidence is the August 2026 Carrum partnership: partner and independent reporting agree that Carrum's Centers of Excellence will be embedded in Included Health's alternative plan, with specialty needs identified through care and data touchpoints and members returned to Included Health after treatment. That documents an expansion mechanism, not measured adoption or realized savings."
    claimRefs:
      - "CU006"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU013"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "durability-and-concentration-gaps"
    title: "Durability, Concentration, and Service Limits"
    body: "Public evidence does not disclose net or gross revenue retention, logo churn, renewal cohorts, contract duration by segment, top-customer revenue share, or channel concentration. Those omissions prevent a defensible durability or concentration judgment despite visible reach. The legal terms also narrow what broad service messaging proves: not every user is eligible for all virtual-care services, and the company does not warrant that site functions will be uninterrupted or error-free. These are contractual limitations, not evidence of an outage or failed deployment. Diligence should therefore reconcile eligibility, active use, renewals, and revenue by account before treating millions of people or named organizations as durable commercial adoption."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU014"
      - "CU015"
callouts:
  - calloutType: "risk"
    title: "Reach is not retention"
    body: "The disclosed scale signals describe people served, a vendor-estimated company list, and a self-published rating; they do not disclose renewal, cohort retention, utilization, or customer concentration."
    claimRefs:
