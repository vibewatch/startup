evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited or independently verified revenue, ARR, and net revenue retention figures for Deepgram.
    whyItMatters: >-
      Without ARR or revenue figures, it is impossible to assess valuation multiples, growth rate, or unit economics
      rigorously.
    diligencePath: Request audited financials or NDA data room access during diligence process.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Precise employee headcount and departmental breakdown for engineering, sales, and support.
    whyItMatters: >-
      Headcount is a proxy for burn rate, execution capacity, and CAC efficiency that cannot be assessed without the
      data.
    diligencePath: Check LinkedIn headcount estimate; request org chart during diligence.
    relatedQuestionRefs:
      - QO012
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Full board composition, governance rights, and liquidation preference structure from the Series C term sheet.
    whyItMatters: Investor rights and board control affect investment return scenarios and founder alignment.
    diligencePath: Request cap table and governance documents from company during diligence.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: enterprise-customers
    missingEvidence: Independent verification of 400+ vs 450+ enterprise customer count discrepancy between January and February 2025.
    whyItMatters: Inconsistent reporting may indicate different counting methodologies or trial vs. paying customer definitions.
    diligencePath: Ask for cohort-level customer data and definition of enterprise customer threshold.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Detailed records of service outages, customer complaints, regulatory inquiries, or litigation involving Deepgram
      as of 2026.
    whyItMatters: Adverse operational events can affect enterprise contracts, renewals, and regulatory standing.
    diligencePath: >-
      Review status.deepgram.com incident history; check PACER and court records for Deepgram litigation; request
      customer reference checks.
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: minor
    topic: investors
    missingEvidence: >-
      Full investor list with share classes, board seats, pro-rata rights, and liquidation preferences for all investors
      in the stakeholder map.
    whyItMatters: Board control and investor economics directly affect founder and employee return outcomes.
    diligencePath: Request cap table, governance agreements, and board observer rights letters from company during diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Additional pre-2022 milestone details including seed round amount, Series A details if any, and early enterprise
      customer wins.
    whyItMatters: Milestone chronology completeness supports calibrating founder execution and product-market fit timing.
    diligencePath: Review early YC batch documentation, Crunchbase history, and LinkedIn for early hires and customers.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: >-
      Published market share estimates for the STT API sub-market by vendor (Deepgram vs. Google vs. AWS vs. AssemblyAI
      vs. Speechmatics).
    whyItMatters: >-
      Without share data, it is impossible to assess Deepgram's actual position and competitive distance from
      hyperscalers.
    diligencePath: Commission or obtain IDC/Gartner/Forrester report specifically covering voice AI API market share by vendor.
    relatedQuestionRefs:
      - QM015
      - QM021
  - type: missing-source
    severity: minor
    topic: contact-center-segment
    missingEvidence: Contact center STT sub-market size as a discrete segment of Deepgram's SAM.
    whyItMatters: >-
      Contact center is likely Deepgram's largest enterprise vertical; sizing it enables revenue concentration risk
      assessment.
    diligencePath: >-
      Obtain contact center AI market sizing from Gartner, IDC, or Salesforce/Forrester reports; estimate Deepgram's
      capture rate.
    relatedQuestionRefs:
      - QM025
      - QM016
  - type: stale
    severity: minor
    topic: multilingual
    missingEvidence: >-
      Current benchmark data for Deepgram's multilingual STT accuracy against ElevenLabs Scribe v2 and Google Chirp 3
      across APAC and EMEA languages as of June 2026.
    whyItMatters: If Deepgram lags in multilingual accuracy, its European and APAC expansion narrative is at risk.
    diligencePath: Run independent benchmark tests across 10+ languages using standardized test sets; compare FutureAGI benchmarks.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: ISV-platform-segment
    missingEvidence: >-
      Volume data on the ISV/platform tier (Vapi, Kore.ai, Granola) as a share of Deepgram's total API call volume and
      revenue.
    whyItMatters: Concentration risk in the ISV tier could make Deepgram vulnerable to platform-level defection.
    diligencePath: Request revenue disaggregation by customer tier from Deepgram during diligence.
    relatedQuestionRefs:
      - QM017
      - QM018
  - type: missing-source
    severity: minor
    topic: market-share
    missingEvidence: Evidence for or against Deepgram's self-description as the number-one STT API by market share or volume.
    whyItMatters: The claim is unverified by independent sources; it drives investor expectations.
    diligencePath: Request API call volume comparisons from FutureAGI, IDC, or Gartner; compare developer community metrics.
    relatedQuestionRefs:
      - QM020
  - type: missing-source
    severity: material
    topic: competitive-win-rate
    missingEvidence: Deepgram's win rate in competitive evaluations against AWS, Google, and Azure at enterprise accounts.
    whyItMatters: >-
      Win rate is a leading indicator of sales efficiency and competitive moat durability; without it, the competitive
      advantage thesis rests entirely on benchmark data.
    diligencePath: Request CRM data and reference customer interviews during due diligence; ask for win/loss reports.
    relatedQuestionRefs:
      - QP019
  - type: missing-source
    severity: minor
    topic: security-certifications
    missingEvidence: Deepgram's published security certifications (SOC 2 Type II, ISO 27001, FedRAMP) and their current status.
    whyItMatters: Enterprise and government buyers require certification evidence that hyperscaler competitors routinely provide.
    diligencePath: Request security whitepaper and certification status from Deepgram; check trust center page.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: future-entrants
    missingEvidence: >-
      Publicly announced voice AI roadmaps from Anthropic, Meta, and Mistral that would indicate imminent competitive
      entry.
    whyItMatters: Foundation model labs entering voice could rapidly commoditize Deepgram's model-layer moat.
    diligencePath: >-
      Monitor public blog posts, research publications, and API announcements from Anthropic, Meta, Mistral through
      2026.
    relatedQuestionRefs:
      - QP018
  - type: missing-source
    severity: critical
    topic: ARR-gross-margin
    missingEvidence: Deepgram's ARR, quarterly revenue, gross margin, and net revenue retention.
    whyItMatters: >-
      Without ARR, the $1.3B valuation cannot be assessed on a revenue multiple basis; without gross margin, the cost
      structure and scalability thesis cannot be underwritten.
    diligencePath: Request financial package (P&L, MRR cohort, gross margin bridge) from Deepgram CFO during formal diligence.
    relatedQuestionRefs:
      - QI015
  - type: missing-source
    severity: material
    topic: cost-structure-breakdown
    missingEvidence: Deepgram's cost structure split between compute/inference COGS, R&D, and sales and marketing.
    whyItMatters: >-
      AI infrastructure companies face high compute COGS; without a cost breakdown, operating leverage and gross margin
      trajectory cannot be assessed.
    diligencePath: Request detailed P&L with COGS breakdown by product line; benchmark against API infrastructure comps.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: cash-flow-burn-rate
    missingEvidence: Deepgram's monthly burn rate and cash runway post-Series C with growth investments underway.
    whyItMatters: >-
      The company disclosed cash-flow positive at end of 2024, but growth investments (OfOne, Voice AI Hub,
      partnerships) may increase burn; actual post-C burn rate is unknown.
    diligencePath: Request monthly cash flow statement for Q1-Q2 2026; reconcile against stated use of funds.
    relatedQuestionRefs:
      - QI019
  - type: missing-source
    severity: material
    topic: enterprise-churn-NRR
    missingEvidence: Enterprise NRR, gross retention, and churn rate for the 400+ enterprise cohort.
    whyItMatters: >-
      The enterprise traction figure could be gross adds; a high churn rate would fundamentally change the ARR
      trajectory and moat durability thesis.
    diligencePath: Request cohort retention analysis by vintage year; interview 5–10 reference enterprise customers.
    relatedQuestionRefs:
      - QI027
  - type: missing-source
    severity: minor
    topic: compute-cost-per-minute
    missingEvidence: Deepgram's fully loaded compute cost per minute of Nova-3 and Flux inference.
    whyItMatters: >-
      Real-time AI inference at sub-300ms latency is compute-intensive; gross margin depends heavily on hardware
      efficiency per inference minute.
    diligencePath: Model compute cost from GPU utilization data or request COGS schedule during diligence.
    relatedQuestionRefs:
      - QI010
  - type: missing-source
    severity: minor
    topic: OfOne-financials
    missingEvidence: OfOne acquisition price, revenue contribution, and unit economics.
    whyItMatters: >-
      Vertical SaaS acquisition integration risk must be assessed; if OfOne is primarily a capability buy, it increases
      burn without near-term revenue contribution.
    diligencePath: Request OfOne P&L and integration plan; assess restaurant vertical revenue pipeline.
    relatedQuestionRefs:
      - QI026
