callouts:
  - calloutType: strength
    title: End-to-End Architecture + Patent Portfolio = Structural Technical Moat
    body: >
      Deepgram's end-to-end deep learning approach (versus pipeline-based ASR) and hardware-efficient
      inference, protected by US patents 12,380,880 and 12,334,075, create a structural technical moat.
      These patents enable Deepgram to serve inference at lower compute cost per minute than transformer
      models repurposed from general-purpose LLMs, giving Deepgram's pricing advantage a defensible
      technical basis beyond just scale.
    claimRefs:
      - CE010
      - CE011

  - calloutType: risk
    title: Security Certifications Gap — No Public SOC 2 Type II or FedRAMP Disclosure
    body: >
      As of June 2026, Deepgram's public website does not list SOC 2 Type II, ISO 27001, or FedRAMP
      certifications. Enterprise and government buyers increasingly require these for procurement approvals.
      Hyperscaler competitors (AWS, Azure, Google) hold all three, and Speechmatics explicitly markets
      GDPR and compliance posture. This gap may slow enterprise sales cycles in regulated verticals.
    claimRefs:
      - CE016
      - CE017

