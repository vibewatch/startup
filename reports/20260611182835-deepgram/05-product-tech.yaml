company:
  name: Deepgram
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Deepgram's product stack comprises four voice AI building blocks: Nova-3 (batch and streaming STT,
    highest accuracy among hosted APIs at 5.26% WER per May 2026 FutureAGI benchmarks), Flux (real-time
    streaming STT optimized for end-of-speech detection in voice agents, sub-300ms), Aura-2 (neural TTS
    for voice agent responses), and the Voice Agent API (unified STT+TTS+LLM orchestration). The technology
    foundation is an end-to-end deep learning architecture trained on proprietary audio data — structurally
    different from pipeline-based ASR and protected by US patents 12,380,880 and 12,334,075. Deepgram's
    differentiation layers include domain fine-tuning, on-premises deployment, hardware-efficient inference,
    and the Saga OS voice agent orchestration platform. Trust posture includes HIPAA BAA, data non-retention
    modes, and cloud/on-prem deployment flexibility.

sections:
  - id: product-definition
    title: Product Definition and Customer Workflow
    body: >
      Deepgram positions itself as the real-time voice AI API infrastructure layer for developers and enterprises
      building voice-native applications. Its products integrate into three primary customer workflows:
      (1) Live conversation and voice agent workflow: developers embed the Voice Agent API to create low-latency
      conversational agents for customer service, sales, restaurant ordering, and support automation.
      The agent listens via the Flux STT model (optimized for end-of-speech detection at <300ms), processes
      the transcript via an integrated LLM (user-configurable), and responds via the Aura-2 TTS model,
      all within a single WebSocket API session without multi-vendor stitching.
      (2) Batch transcription and intelligence workflow: enterprises (legal, healthcare, media, compliance)
      send recorded audio to Nova-3 STT via REST API for post-call analytics, subtitle generation, and
      medical documentation. Nova-3 supports speaker diarization, intelligent formatting, topic detection,
      and redaction. (3) On-premises regulated-enterprise workflow: government, defense, and financial services
      customers deploy Deepgram's STT/TTS models on their own infrastructure, with full API parity to the
      cloud offering and zero audio data leaving the network perimeter.

      Each of these workflows is served by distinct model SKUs with different pricing, latency profiles, and
      feature sets, giving enterprise buyers a clear upgrade path from developer experimentation to production-grade
      deployment. The $200 free developer credit and PAYG pricing minimize friction for new developer adoption
      via product-led growth.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002

  - id: product-architecture
    title: Technical Architecture and Platform Components
    body: >
      Deepgram's core technology is an end-to-end (E2E) deep learning architecture for automatic speech
      recognition (ASR), contrasting with traditional pipeline ASR (acoustic model + language model +
      decoder). The E2E approach trains a single neural network to map raw audio waveforms directly to
      text, enabling both higher accuracy and hardware-efficient inference. This architecture is protected
      by two US patents: US 12,380,880 (end-to-end ASR with transformer architecture) and US 12,334,075
      (hardware-efficient ASR). The patents describe systems that achieve competitive WER with significantly
      lower compute requirements per inference minute, which is the basis for Deepgram's pricing advantage
      versus hyperscalers.

      The Nova-3 model (released February 2025) is optimized for batch and streaming STT across 9 audio
      domains and 45+ languages, with domain-specific models (medical, finance, legal, automotive, conversational).
      Flux is a purpose-built conversational speech recognition model optimized for end-of-speech (EOS)
      detection in real-time agent contexts, achieving sub-300ms latency from speech end to transcript
      delivery — critical for voice agent responsiveness. Aura-2 is Deepgram's second-generation neural
      TTS model, delivering low-latency, natural-sounding voice synthesis for agent responses.
      The Voice Agent API (GA June 2025) abstracts all three models plus LLM orchestration into a single
      WebSocket-based API, eliminating the latency compounding of multi-hop STT→LLM→TTS stacks.

      Deepgram's 3-factor automated domain adaptation allows enterprise customers to customize models for
      proprietary vocabulary through a semi-automated fine-tuning pipeline. Customer audio corpora can be
      submitted for domain adaptation without manual model architecture changes. This is the primary mechanism
      for the "data flywheel" moat — customers who fine-tune their models on proprietary vertical data
      (medical, legal, QSR) accumulate switching costs in the form of adapted model weights.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003

  - id: deployment-and-trust
    title: Deployment, Integration, Compliance, and Roadmap
    body: >
      Deepgram offers three deployment modes: (1) Cloud API — managed SaaS via deepgram.com APIs with
      WebSocket and REST endpoints; (2) Self-hosted — Docker/Kubernetes container deployment in customer
      AWS, GCP, or Azure environments; (3) On-premises — full air-gap capable deployment in customer
      data centers with no external API calls. The self-hosted and on-premises models have full API parity
      with the cloud offering, enabling regulated enterprises to migrate from cloud to on-prem without
      SDK changes.

      Integration surface includes: REST API (batch transcription), WebSocket API (streaming STT and Voice
      Agent), SDKs (Python, JavaScript/TypeScript, Go, .NET, Ruby, PHP), CLI, and an MCP Server for AI
      coding tools. Status monitoring is available at status.deepgram.com; the publicly disclosed historical
      uptime shows two incidents in 2024 with sub-4-hour resolution. HIPAA Business Associate Agreements
      are available for all tiers. The pricing page states HIPAA compliance as a feature of all paid plans.
      Deepgram's data privacy policy supports zero-retention mode (audio not stored post-transcription) for
      sensitive workloads.

      Roadmap indicators from blog posts and product announcements suggest: multilingual Flux model
      (Flux Multilingual announced in June 2026), expanding domain-specific Nova-3 models, expanded Saga OS
      voice agent operating system capabilities, and OfOne restaurant AI integration. The IBM watsonx and
      AWS SCA partnerships imply co-development of voice agent use cases for enterprise customers, which
      may accelerate regulated-industry product features (healthcare, financial services). The Powered by
      Deepgram program certifies ISV partners building on Deepgram infrastructure.
    claimRefs:
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
    tableRefs:
      - TE004
      - TE005
    figureRefs:
      - FE004

