- id: named-customer-proof
  title: Named Customer Proof and Reference Quality
  body: 'The strongest named customer proof in this run is concentrated in three deployments with substantive workflow detail: NASA, UpdateAI, and Nytro.AI. NASA is the clearest enterprise-grade reference because the case study explains the procurement contest, the deployment problem, four separate use cases, and quantified transcription outcomes on difficult audio. UpdateAI and Nytro.AI are different kinds of proof: both are embedded software vendors rather than end enterprises, but each explicitly states that Deepgram sits in the production backend of its product and each describes why alternative providers lost on accuracy, latency, or reliability. That makes them stronger than a generic logo wall and more relevant to Deepgram''s ISV-led revenue motion.


    Other names require more caution. The built-with landing page lists additional ecosystem builders, and NetworkWorld reports Jack in the Box using Deepgram-backed voice ordering, but those references do not match the documentation quality of NASA, UpdateAI, or Nytro.AI in this run. The practical conclusion is that Deepgram has credible named proof, but public proof density is still narrower than the headline enterprise-customer figure. Logos should therefore be treated as directionally useful, while only the best-documented deployments should anchor underwriting on production maturity.'
