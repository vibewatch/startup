company:
  name: Deepgram
chapter:
  number: 6
  title: Customers
  summary: 'Deepgram shows real but uneven customer proof: the company publicly claims 400+ enterprise customers and 200,000+ developers, while the strongest named, use-case-specific evidence in this run comes from NASA, UpdateAI, and Nytro.AI. Customer acquisition appears to span self-serve developers, embedded ISVs, and enterprise/channel sales through AWS, IBM, and telephony integrations, but retention, concentration, contract length, and segmented customer-count disclosure remain materially under-documented.'
sections:
- id: customer-base-and-adoption
  title: Customer Base Segmentation and Adoption Surface
  body: 'Deepgram''s public customer evidence points to a multi-layered base rather than a single homogeneous account pool. The broadest top-of-funnel is developer-led: company materials repeatedly cite 200,000+ developers building with the platform, while enterprise-facing materials separately reference 400+ enterprise customers and hundreds of enterprise deployments. Those two figures should not be conflated. The developer number describes product-led reach; the enterprise count describes paying or contracted organizations at a different level of commercial maturity. Public materials further separate three GTM lanes: direct enterprise buyers using voice AI internally, technology ISVs embedding Deepgram in their own products, and partner-mediated enterprise motion through AWS and IBM.


    Segment evidence is strongest by workload. Contact centers, conversational-AI builders, healthcare operators, and media platforms each get dedicated solution pages, while the AWS and Amazon Connect materials show how contact-center and regulated buyers can procure or deploy without treating Deepgram as a greenfield ML project. The Twilio reference architecture reinforces that telephony builders can adopt Deepgram inside existing call flows. What remains missing is a segmentation breakout by geography, company size, ACV band, or revenue contribution. That means customer-count claims are useful for scale framing but still weak for underwriting mix quality or concentration. That missing segmentation also obscures pricing power and vertical concentration.'
