  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: More named deployments with two-source support, especially in healthcare, contact center, and restaurant verticals.
    whyItMatters: Public named proof is narrower than the headline enterprise count, so the investor still lacks a diversified reference set across key segments.
    diligencePath: Request 10 named customer references with deployment status, spend, renewal history, and use-case outcomes; prioritize healthcare and contact-center references.
