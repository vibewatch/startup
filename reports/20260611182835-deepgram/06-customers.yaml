- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / friction
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Voice Agent API upsell
    - Higher share of wallet depends on reliability and orchestration quality
    - SpeechTechMag, conversational-AI page, Twilio workflow
    - Can move accounts from raw STT into full speech-to-speech platform spend
    - Ask for attach rate from STT-only accounts into Voice Agent API
  - - AWS procurement and Amazon Connect
    - Partner/channel dependence; Connect path currently hosted-only
    - AWS partner page plus Amazon Connect docs
    - Can shorten procurement and deployment cycles in contact centers, but may skew revenue toward channel-led accounts
    - Request AWS-sourced ARR, hosted-vs-self-hosted mix, and Connect pipeline conversion
  - - IBM watsonx route
    - Partner-mediated pipeline may concentrate enterprise access through IBM
    - IBM newsroom announcement
    - Opens additional enterprise buying centers and regulated workflows
    - Request co-sell pipeline, closed-won mix, and revenue-share economics
  - - Twilio / telephony ecosystem
    - Reference-build adoption may not equal long-term production retention
    - Twilio blog and Deepgram Twilio build guide
    - Improves developer acquisition and telephony use-case relevance
    - Request count of production telephony workloads and churn by telephony segment
  - - Regulated vertical expansion
    - Privacy, consent, and vendor-control scrutiny can slow adoption
    - Goodwin privacy analysis plus healthcare page
    - Material for healthcare, customer-service recordings, and sensitive conversations
    - Review BAAs, consent UX, retention settings, and audit artifacts in diligence
  - - Public proof concentration
    - Only a few richly documented named deployments are public
    - NASA, UpdateAI, and Nytro.AI case studies dominate public proof
    - Headline enterprise count is broader than current public reference depth
    - Request 10 reference customers across segments with renewal and spend history
  notes: 'This table separates expansion logic from concentration risk: the same channels that accelerate GTM can also concentrate distribution or hide retention issues if partner-sourced economics are not disclosed.'
