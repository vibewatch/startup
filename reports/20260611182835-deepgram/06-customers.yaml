callouts:
- calloutType: strength
  title: Deepgram has multiple customer-entry motions, not just one sales channel
  body: 'The public evidence supports a blended GTM model: PLG developer entry, embedded-ISV adoption, direct enterprise sales, AWS procurement, IBM enterprise distribution, and telephony integrations. That mix reduces dependence on a single acquisition path and helps explain why the developer count is much larger than the named-reference set.'
  claimRefs:
  - CU006
  - CU011
  - CU012
  - CU013
  - CU033
  - CU036
- calloutType: risk
  title: Durability is the biggest public-data gap in the customer story
  body: Deepgram can show adoption and named proof, but it still cannot publicly show the portfolio durability behind those numbers. Without NRR, GRR, churn, contract length, concentration, and partner-sourced ARR, the investor must assume real customer quality from testimonials and usage scale instead of from hard retention math.
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU030
