- id: durability-expansion-and-risks
  title: Durability, Expansion Paths, and Concentration Risks
  body: 'Deepgram''s public materials are much stronger on adoption and product breadth than on durability. No reviewed source disclosed NRR, GRR, churn, contract length, or top-customer concentration, so customer quality cannot be inferred from the 400+ enterprise headline alone. The best positive durability signals are testimonial rather than financial: UpdateAI and Nytro.AI both describe Deepgram as foundational in their products, and independent review aggregation on PeerSpot highlights speed, accuracy, low latency, and cost. But the same review aggregation also surfaces language-coverage, live-transcription stability, speaker-identification, and concurrency concerns, which means satisfaction is not uniformly one-way.


    Expansion logic is nevertheless clear. Deepgram can land through STT and grow into TTS, analytics, and the Voice Agent API; it can also expand commercially through AWS procurement, Amazon Connect, IBM watsonx distribution, and Twilio-based telephony workflows. The risk is that public proof on renewals and concentration has not kept pace with that broader platform story. RFP.wiki''s procurement note explicitly tells buyers to stress-test reliability, observability, rollback, and pricing realism, while Goodwin''s privacy analysis shows why regulated customers may demand stronger consent, retention, and vendor-control evidence before scaling usage. Because Deepgram''s Amazon Connect path currently supports hosted customers only, even channel expansion is not yet deployment-neutral across all customer types.'
