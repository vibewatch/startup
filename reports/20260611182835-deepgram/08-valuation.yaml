chapter:
  number: 8
  title: Valuation
  summary: 'Deepgram''s January 2026 Series C set a real market anchor at a $1.3 billion valuation, and the company can point to cash-flow positivity, 1,300+ organizations on its APIs, 200,000+ developers, and strategic investors including Twilio and ServiceNow Ventures. But public sources still do not disclose ARR, gross margin, retention, or financing terms, so the most defensible call is price-sensitive rather than promotional: the current mark looks plausible but not clearly cheap, supporting a track recommendation with a broad base range around $1.2 billion-$1.8 billion and a higher diligence bar before underwriting upside.'
sections:
- id: price-anchor-and-what-public-evidence-does-and-does-not-prove
  title: Price anchor and what public evidence does and does not prove
  body: 'Deepgram does have a hard valuation datapoint: on 13 January 2026 the company announced a $130 million Series C at a $1.3 billion valuation, and multiple outlets repeated the same round size and valuation. That matters because it turns this chapter from a pure hypothetical into an assessment of whether the currently known price is supportable. The financing also included strategic names such as Twilio, ServiceNow Ventures, SAP, and Citi Ventures, which gives the round more signaling value than a purely financial syndicate. Management separately told TechCrunch that Deepgram was cash-flow positive in the prior year and did not need to raise defensively. Those are meaningful positives, especially for an AI infrastructure company that operates in a compute-intensive category. The problem is that the public record still stops short of the denominator investors need. Deepgram has disclosed adoption and usage signals, but it has not publicly disclosed ARR, gross margin, net revenue retention,
    or cap-table terms. That leaves the $1.3 billion mark plausible, but still under-explained in public.'
