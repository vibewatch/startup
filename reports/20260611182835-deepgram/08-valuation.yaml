- id: scenario-ranges-and-the-investment-call
  title: Scenario ranges and the investment call
  body: 'Because Deepgram has not publicly disclosed ARR, the cleanest way to test the $1.3 billion mark is to ask what revenue base would make it reasonable. On simple math, the current valuation implies roughly 13x ARR at $100 million of revenue, 8.7x at $150 million, 6.5x at $200 million, 5.2x at $250 million, and 4.3x at $300 million. That creates a clear decision framework. If Deepgram is materially below roughly $150 million of ARR, the current mark starts to look stretched for a company that still faces pricing pressure from hyperscalers and model vendors. If the company is closer to $200 million-$250 million of ARR with durable cash-flow positivity and credible gross margins, the valuation becomes easier to defend. If ARR is above $250 million and partner-led scale is proving out, then the bull case can support materially higher value. Public evidence today does not tell us which of those states is true, so the disciplined call is track, not buy: the current mark sits inside a plausible
    base range, but not far enough below it to create obvious margin of safety.'
