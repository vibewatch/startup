- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - Core assumptions
  - Main failure mode
  rows:
  - - Bear
    - 30%
    - $0.9B-$1.2B
    - ARR is closer to ~$100M-$150M, margin quality is weaker than hoped, or compliance friction slows enterprise expansion.
    - The current $1.3B mark turns out to embed too much optimism for the disclosed fundamentals.
  - - Base
    - 50%
    - $1.2B-$1.8B
    - Cash-flow positivity is real, ARR plausibly lands around ~$150M-$250M, and strategic partners support distribution.
    - Public evidence remains directionally positive but still not strong enough to prove deep undervaluation.
  - - Bull
    - 20%
    - $1.8B-$2.6B
    - ARR proves to be $250M+, gross margins hold up, and partner-led scale makes Deepgram a foundational voice layer.
    - Without those files, the bull case remains a conditional upside case rather than a present underwriting fact.
  - - Decision implication
    - —
    - Current mark inside base case
    - Track the company and diligence the denominator before paying up for upside.
    - Do not promote the case to buy on category growth alone.
  notes: These are scenario ranges, not a false-precision DCF; they exist to show how the call changes as hidden financial inputs move.
