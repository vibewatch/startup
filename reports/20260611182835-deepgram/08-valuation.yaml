  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-disclosure
    missingEvidence: Board-approved ARR, recognized revenue, and segment mix for 2024-2026.
    whyItMatters: Without the revenue denominator, investors cannot tell whether the current $1.3B mark is 4x, 8x, or 13x recurring revenue.
    diligencePath: Request monthly management reporting, board materials, and finance-model outputs that bridge customer counts to actual revenue.
  - type: private-evidence-only
    severity: material
    topic: margin-and-retention
    missingEvidence: Gross margin, NRR, gross retention, and cohort-level expansion/churn for core enterprise accounts.
    whyItMatters: Cash-flow positivity is more valuable if it comes from durable gross profit rather than temporary spending restraint or concentrated customer wins.
    diligencePath: Review cohort dashboards, unit-economics files, and product-level margin analysis with finance and revenue-operations owners.
  - type: private-evidence-only
    severity: material
    topic: series-c-terms
    missingEvidence: Liquidation preferences, ratchets, governance rights, and side-letter economics from the January 2026 round.
    whyItMatters: Headline valuation can materially overstate new-money economics when private financing terms are investor-protective.
    diligencePath: Have counsel review the financing documents, cap table, and investor-rights materials before underwriting the round.
  - type: missing-source
    severity: material
    topic: concentration-and-channel-mix
    missingEvidence: Top-customer, top-partner, and direct-versus-channel revenue concentration plus renewal dependence.
    whyItMatters: Strategic-investor signaling does not equal diversified revenue quality if one partner, customer, or channel drives too much of the economics.
    diligencePath: Request concentration tables, pipeline attribution, and partner-sourced ARR reporting.
