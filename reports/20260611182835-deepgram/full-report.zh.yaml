        blocks:
          - type: callout
            title: 端到端架构 + 专利组合 = 结构性技术护城河
            body: >
              Deepgram 的端到端深度学习方法（相对流水线式 ASR）和硬件高效推理，由美国专利 12,380,880 和 12,334,075 保护，形成结构性技术护城河。这些专利让 Deepgram 能以低于从通用
              LLM 改造而来的 transformer 模型的每分钟计算成本提供推理，使其定价优势不只是来自规模，而有可防守的技术基础。
