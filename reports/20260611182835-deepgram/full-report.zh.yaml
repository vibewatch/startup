      - number: '7.2'
        title: 运营与依赖暴露
        blocks:
          - type: paragraph
            body: >-
              买方能够有意识地选择架构时，Deepgram 的公开缓释叙事最有力。公司提供托管、专用、自托管和客户云部署模式，也提供 EU endpoint，以及通过
              Connect、SageMaker、Bedrock、Marketplace 和类似 PrivateLink 的连接方式走 AWS 原生路径。这些选项重要，是因为底层暴露就在文档里。Deepgram
              的速率限制按套餐和项目约束并发；公司明确禁止通过拆分项目绕过上限。EU endpoint 有助于区域内处理，但并非每个模型或托管提供商路径在当地表现都一样，文档称托管提供商侧目前只有 OpenAI 通过 EU
              基础设施路由。Amazon Connect 支持目前也仅限托管，这意味着对于要求自托管的买方，最容易接入联络中心的路径还不是部署中立的。


              这直接引出依赖风险。AWS 不只是云场地；它同时是采购路径、部署表面和模型编排层。IBM 扩大了企业分销，但也带来新的渠道依赖。Twilio
              公布的架构说明，一个生产级语音智能体很快就会变成多供应商链条，电话、语音、推理和合成分别落在不同提供商手里。Deepgram
              可以用自托管或专用部署缓释一部分风险，但公司自己的部署文档也说明，自托管会把基础设施、备份和可用性责任推向客户。实际结果是，公司可以通过外部化控制降低部分隐私和主权风险，但如果客户自运营表现不佳，Deepgram
              仍会承担有意义的品牌和支持暴露。因此，本章对运营的判断不是 Deepgram 缺少缓释手段；而是这些缓释手段往往是在用一种暴露换另一种暴露。
