  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分
        blocks:
          - type: paragraph
            body: >
              Deepgram 服务的市场是语音 AI 基础设施的 B2B API 市场，具体包括以开发者 API 和企业 SDK
              交付的实时语音转文本（STT）、文本转语音（TTS）和语音智能体编排。这个市场位于更广义的语音与语音识别软件市场之内，后者还包括设备内置的消费者助手（Siri、Alexa、Google
              Assistant）、专有企业电话系统（Cisco、Genesys）和开源自托管模型（Whisper、NVIDIA Canary）。Deepgram 的 API
              业务不覆盖消费者助手层和端侧硬件，也不覆盖传统本地电话平台。

              市场可按买家类型（企业 vs. 开发者 / SMB）、部署模式（云 API vs. 自托管）、使用场景（实时转写、联络中心、语音智能体、会议、无障碍）和地域（北美、APAC、EMEA）切分。2025
              年北美是最大区域，约占更广义市场的 34–35%。APAC 是增长最快的细分。Deepgram 的核心买家，要么是正在构建语音应用的公司里的开发者或技术负责人（开发者层），要么是为联络中心、医疗或合规流程采购语音
              AI 基础设施的企业技术高管（企业层）。
            claimRefs:
