  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 隐私、安全、伙伴和定价风险如何传导到采用、利润率和估值结果。
    data:
      nodes:
        - id: bipa
          label: BIPA / 生物识别同意风险
          detail: 伊利诺伊声纹与会议机器人敞口可能拖慢部署，或带来赔偿要求。
          type: risk
        - id: hipaa
          label: HIPAA 规则收紧
          detail: 更具规定性的业务伙伴控制会增加合规成本和销售摩擦。
          type: risk
        - id: dep
          label: 伙伴与托管服务商依赖
          detail: AWS、IBM、Twilio、OpenAI 和 marketplace 路径扩大触达，但也增加耦合。
          type: risk
        - id: price
          label: 开源与超大规模云厂商压力
          detail: Whisper、NVIDIA 和超大规模云厂商可能重置价格和控制权预期。
          type: risk
        - id: adoption
          label: 客户采用与扩张
          detail: 受监管买方和架构师可能延迟上线，或缩小上线范围。
          type: outcome
        - id: margin
          label: 毛利率与支持负载
          detail: 定制部署、合规工作和价格应对可能抬高交付成本。
          type: outcome
        - id: retention
          label: 留存与伙伴耐久性
          detail: 用量计费合同和伙伴链条会放大不满风险。
          type: outcome
        - id: valuation
