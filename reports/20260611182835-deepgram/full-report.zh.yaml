        - 30%
        - $0.9B-$1.2B
        - ARR 更接近 ~$100M-$150M，利润率质量弱于预期，或合规摩擦拖慢企业扩张。
        - 当前 $1.3B 估值最终证明对已披露基本面的乐观预期过高。
      - - 基准
        - 50%
        - $1.2B-$1.8B
        - 现金流为正确实成立，ARR 合理落在约 ~$150M-$250M，战略伙伴支撑分销。
        - 公开证据方向上积极，但仍不足以证明深度低估。
      - - 牛
        - 20%
        - $1.8B-$2.6B
        - ARR 被证明达到 $250M+，毛利率守得住，伙伴驱动的规模让 Deepgram 成为基础语音层。
        - 缺少这些文件时，牛市情景仍只是有条件的上行情景，而不是当前承销事实。
      - - 决策含义
        - —
        - 当前估值位于基准情景内
        - 跟踪公司，并在为上行支付溢价前尽调分母。
        - 不要仅凭赛道增长就把案例上调为买入。
    notes: 这些是情景区间，不是假装精确的 DCF；它们用来说明隐藏财务输入变化时，投资判断会如何改变。
