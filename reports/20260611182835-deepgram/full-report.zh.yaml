      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 生物识别 / BIPA 风险
        - 类声纹工作流的同意和留存控制仍不清楚
        - 尽调中无法给出产品级 Illinois 同意流程、留存计划或赔偿答案
        - 暂停承销 Illinois 占比高的部署，或把它们从预测中剔除
      - - HIPAA / 医疗合规执行
        - 缺少 Security Rule 准备材料
        - 没有现行 BAA 模板、没有商业伙伴审计证据，或没有拟议规则差异的路线图
        - 将医疗扩张视为推测，而不是已锁定增长
      - - 可靠性和规模
        - 公开或尽调观察到的产能姿态变弱
        - 反复限流、未达并发承诺，或没有可信 uptime 报告
        - 下调增长假设，并要求更强 SLA 和可观测性证据
      - - 伙伴依赖
        - 单一渠道或提供商变得过于关键
        - AWS、IBM 或电话 / LLM 伙伴路径成为大部分企业赢单的门槛
        - 应用集中度折价，并要求替代路径证明
      - - 价格和架构竞争
        - 开源或超大云厂商替代方案挤压商业杠杆
        - 赢单 / 输单数据显示，客户主要因为控制或价格选择自托管或超大云厂商栈
        - 下调利润率和留存假设
      - - 披露质量
        - 核心承销数据到尽调后期仍不公开
        - 头部客户组合、伙伴收入占比、正常运行时间指标和法律风险立场仍不可得
        - 除非私下尽调补上缺口，否则升级为 no-go
    notes: 否决标准是绑定上述风险的可监控尽调触发项，并非预测这些阈值已经被突破。
