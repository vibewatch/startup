            title: 价格纪律比品类热情更重要
            body: 在 $1.3B 估值下，Deepgram 不需要是一家差公司，也可能成为一个平庸入口。缺失的问题不是语音 AI 是否真实，而是 Deepgram 的私有收入和利润率画像，能否证明今天付这个价格合理。
            calloutType: recommendation
