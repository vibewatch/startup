      - number: '8.2'
        title: 市场顺风、同业参照与披露缺口
        blocks:
          - type: paragraph
            body: >-
              独立市场报告仍然支持一个判断：语音 AI 基础设施正在被构建成一个庞大且增长中的品类。语音转文本 API、语音识别和对话式 AI
              报告都指向两位数增长，并预计到本十年末市场扩张到数十亿美元规模。私营和公开同业也显示，投资人愿意给这个品类出钱：ElevenLabs 在 2025 年 1 月达到 $3.3 billion
              估值，AssemblyAI 又融资 $50 million，并称现在服务高生产负载；SoundHound、Five9、NICE 和 Twilio
              的公开市值也说明，上市语音或通信相邻平台仍能获得有意义的企业价值。但这些可比公司只是框架工具，不是证明。Twilio 和 NICE 是业务宽得多的软件公司；Five9
              更接近应用层联络中心软件，而非模型基础设施；SoundHound 已上市，受到严格审视；ElevenLabs 的创作者和 TTS 组合更强；AssemblyAI
              在已抓取来源中没有公开披露估值。因此，这组可比公司说明该品类可以支撑十亿美元级结果，但本身不能证明 Deepgram 当前估值有吸引力。
