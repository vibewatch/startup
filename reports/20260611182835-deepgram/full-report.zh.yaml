chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与起源故事
        blocks:
          - type: paragraph
            body: >
              Deepgram, Inc. 于 2015 年注册成立，创始人为 Scott Stephenson、Noah Shutty 和 Adam
              Sypniewski。这三位物理学家原本在做地下暗物质探测实验，后来发现处理放射性衰变信号的波形分析技术也能用于语音音频。三位联合创始人在中国一处地下约两英里的研究设施工作时，自制探测器，用 GPU 和 FPGA
              在模拟波形上训练神经网络，并用音频记录整理他们想检索和分析的研究内容。市场上没有足够好用的语音识别 API 能满足这个需求，他们于是自建端到端深度学习方案，并转向将其商业化为 Deepgram。

              Deepgram 参加了 Y Combinator 2016 年冬季批次，早期开发者社区和企业引荐都从那里起步。公司总部位于加利福尼亚州旧金山，采用 remote-first 组织形态，员工分布在美国 20+
              个州和 5+ 个国家，并将自己定位为一家基础 AI 公司，核心使命是用语音促成人机交互。它的一句话商业模式是：以 API-first、按使用量计费的方式，提供自研实时语音 AI
              模型（语音转文本、文本转语音和语音智能体），并支持云端、自托管和本地部署。
