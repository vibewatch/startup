      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              CEO 兼联合创始人 Scott Stephenson 拥有 University of Michigan 粒子物理博士学位，曾在那里从事暗物质探测器博士后研究，之后离开并共同创立
              Deepgram。他是公司最主要的公开发声者和战略决策者。联合创始人 Noah Shutty 和联合创始人 Adam Sypniewski 都参与了 Deepgram 早期深度学习架构建设；Sypniewski
              现任 CTO。创始团队共同的物理学背景，是 Deepgram 品牌叙事和技术差异化的核心——从第一性原理做端到端深度学习，而不是走规则驱动或混合式路线。

              董事会包括领投方 AVP（普通合伙人 Elizabeth de Saint-Aignan）以及 Madrona、In-Q-Tel 等主要回投投资者的代表。In-Q-Tel 自更早轮次以来持续参与，说明政府 /
              情报体系对 Deepgram 的转写准确率和本地部署能力感兴趣。公司对 Scott Stephenson 的关键人依赖是真实风险：所有公开公告、新闻稿和重大伙伴沟通中，他都是唯一被点名的高管；截至 2026 年
              6 月，公司未公开披露任何 COO、CFO 或 President。
