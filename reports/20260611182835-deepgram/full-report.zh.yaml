  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              Deepgram 的头部风险，不在于已经爆出某个单一事件，而在于三件事叠在一起：受监管数据暴露、平台依赖，以及执行面铺得太宽。法律风险最核心的部分，并不是已审阅材料里出现了 Deepgram 相关诉讼；而是
              Illinois BIPA 明确把声纹视为生物识别标识，同时当前法律评论认为，AI 会议记录、说话人归因、归档转录文本，正是如今最容易引来集体诉讼关注的工作流。Deepgram
              销售转录、语音智能体和医疗工作流，涉及说话人身份与留存。一旦客户实施中在通知、同意、留存、删除控制上不够严密，却收集或推断类似声纹的数据，公司的风险画像就会明显变化。


              第二大风险是医疗与安全控制能否执行到位。Deepgram 给出的缓释手段有可信度——SOC 2、HIPAA 姿态、按需提供 BAA、RBAC、备份和事件响应——但 HHS 拟议的 HIPAA Security
              Rule 会把业务伙伴的运营门槛抬高，比泛泛的信任叙事更具规定性、更可测试，也更依赖文档。第三是依赖风险：AWS 在采购、部署和托管模型路径中反复出现；IBM
              是新的渠道放大器；参考语音智能体栈也可能在一个循环里依赖多个外部供应商。第四是开源语音模型和超大规模云厂商带来的竞争与经济压力。第五是执行风险：公司试图在公开披露深度跟上之前，同时扩展
              STT、TTS、语音智能体、医疗和渠道动作。因此，这是一组真实、可排序、可监测的风险，但目前并未锚定在已记录的 Deepgram 特定案件事件上。
