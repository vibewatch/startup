      - number: '2.2'
        title: 市场规模与增长驱动
        blocks:
          - type: paragraph
            body: >
              三个独立测算口径都指向一个规模大、增长快的市场。The Business Research Company 估计，全球 speech-to-text API 市场 2025 年规模为 $4.55
              billion，并以 18.2% CAGR 增至 2030 年 $10.46 billion。Coherent Market Insights 估计，更广义的语音与语音识别市场（包括设备内置消费者助手）2026
              年为 $26.5 billion，并以 23.6% CAGR 增至 2033 年 $116.9 billion。Deepgram CEO 自称，面向要求极高准确率和最低延迟的苛刻环境，语音 AI 智能体拥有
              $50 billion 可服务市场——这正是 Deepgram 声称瞄准的利基。

              主要增长驱动包括：（1）企业联络中心迁移到云端和 AI 自动化，降低单通电话成本；（2）agentic AI 浪潮要求 AI 电话智能体具备实时、低延迟语音处理；（3）越来越多开发者平台嵌入
              voice-first UX；（4）医疗和金融服务合规场景需要准确转写；（5）多语言企业扩张带来 45+ 种语言覆盖需求。增长约束包括：hyperscaler 将 STT
              作为捆绑功能，以零或近零边际成本商品化；非延迟敏感工作负载的开发者转向开源 Whisper；数据主权监管限制跨境处理。
