            body: >
              AWS Transcribe 标准价格为 $0.024/min，批量为 $0.015/min，具备 HIPAA eligibility，并原生集成 AWS 生态。它是深度绑定 AWS
              企业的默认选择，但在基准测试中，实时准确率和延迟落后于 Deepgram。Google Cloud Speech-to-Text（Chirp 3）支持 125+ 种语言，并提供医疗和电话通话变体，标准价格为每
