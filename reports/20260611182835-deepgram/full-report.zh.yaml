      - number: '6.2'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >-
              本轮最强的具名客户证明集中在三个有实质工作流细节的部署：NASA、UpdateAI 和 Nytro.AI。NASA
              是最清晰的企业级参考，因为案例研究解释了采购竞赛、部署问题、四个独立使用场景，以及困难音频上的量化转写结果。UpdateAI 和 Nytro.AI
              提供的是另一类证明：两者都是嵌入式软件厂商，而非终端企业，但都明确表示 Deepgram 位于其产品的生产后端，并说明替代供应商为何在准确率、延迟或可靠性上落败。这让它们比泛泛的 logo wall
              更强，也更贴近 Deepgram 的 ISV 驱动收入路径。


              其他名称需要更谨慎对待。built-with 落地页列出了更多生态构建者，NetworkWorld 也报道 Jack in the Box 使用由 Deepgram 支撑的语音点单，但这些参考在本轮中没有达到
              NASA、UpdateAI 或 Nytro.AI 的文档质量。实际结论是：Deepgram 有可信的具名证明，但公开证明密度仍窄于企业客户数量标题。因此，logo
              应被视为方向性有用；只有文档最充分的部署，才适合支撑对生产成熟度的承销判断。
