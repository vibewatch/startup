  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与采用面
        blocks:
          - type: paragraph
            body: >-
              Deepgram 的公开客户证据指向一个多层客户基础，而不是单一同质账户池。最宽的漏斗顶部由开发者驱动：公司材料反复提到 200,000+ 名开发者使用平台，而面向企业的材料又单独提到 400+
              家企业客户和数百个企业部署。这两个数字不能混同。开发者数字描述的是 product-led 覆盖面；企业数量描述的是商业成熟度不同的付费或签约组织。公开材料还把 GTM 分成三条路径：直接服务内部使用语音 AI
              的企业买家、把 Deepgram 嵌入自身产品的技术 ISV，以及通过 AWS 和 IBM 触达企业的伙伴中介模式。


              按工作负载看，分层证据最强。联络中心、对话式 AI 构建者、医疗运营方和媒体平台各有专门解决方案页；AWS 和 Amazon Connect 材料则展示了联络中心和受监管买家如何在不把 Deepgram 当成绿地
              ML 项目的情况下采购或部署。Twilio 参考架构进一步证明，电话系统构建者可以在既有通话流中采用 Deepgram。缺失的是按地域、公司规模、ACV
              区间或收入贡献拆分的分层。因此，客户数量口径有助于判断规模，但对承销客户组合质量或集中度仍然较弱。缺失的分层也遮蔽了定价权和垂直集中度。
