      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Deepgram 的核心变现是 API 层按使用量定价，覆盖四条产品线。语音转文本（STT）：Nova-3 流式价格为 $0.0048/min，Flux（为实时语音智能体优化）为
              $0.0077/min；两者都适用于 Pay-As-You-Go 档位，无最低消费，注册赠送 $200 免费额度。文本转语音（TTS）：Aura-2 价格为每 1,000 字符 $0.015。Voice
              Agent API：$4.50/hour，把 STT、TTS 和 LLM 编排合入统一实时 API，于 2025 年 6 月宣布 general availability。Growth plan（预付额度）起价
              $4,000+/year，相比 PAYG 约节省 20%，并包含更高并发上限。企业账户获得定制定价、专属支持、本地部署选项和 SLA 承诺。企业层收入几乎肯定是绝对金额最大的收入来源，但 PAYG
              开发者收入与企业合同的结构占比未公开披露。Deepgram 的 OfOne QSR 垂直（餐厅 drive-thru 语音点单）可能采用收入分成或按门店订阅模式，为 API 业务叠加一层垂直 SaaS。

