      - number: '8.3'
        title: 情景区间与投资判断
        blocks:
          - type: paragraph
            body: >-
              Deepgram 没有公开披露 ARR，检验 $1.3 billion 标记最干净的方法，是反推怎样的收入基数才合理。按简单计算，当前估值在收入 $100 million 时约等于 13x ARR，在 $150
              million 时为 8.7x，在 $200 million 时为 6.5x，在 $250 million 时为 5.2x，在 $300 million 时为 4.3x。这给出了清晰的决策框架。如果
              Deepgram 的 ARR 明显低于约 $150 million，面对超大规模云厂商和模型供应商带来的价格压力，当前估值就开始显得偏紧。如果公司 ARR 更接近 $200 million–$250
              million，并且现金流为正能够持续、毛利率可信，估值就更容易辩护。如果 ARR 高于 $250
              million，且合作伙伴驱动的规模化正在跑通，乐观情景就能支撑明显更高的价值。今天的公开证据无法说明公司处在哪个状态，所以更纪律化的结论是观察，而不是买入：当前标记落在一个合理基准区间内，但低于该区间的幅度还不足以形成明显安全边际。
