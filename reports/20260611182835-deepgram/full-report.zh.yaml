  - id: TV005
    title: 投资逻辑破坏与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 未达门槛
        - 经验证 ARR 显著低于约 $150M。
        - 当前估值开始意味着一家仍未上市的基础设施公司倍数偏高。
        - 重切到悲观区间，或放弃本轮。
      - - 毛利率不及预期
        - 利润率显著低于规模化 API 平台应有水平。
        - 现金流转正的韧性下降，上行倍数支撑变弱。
        - 下调公允区间，并要求更强的价格保护。
      - - 留存偏弱
        - NRR、总留存率或企业续约数据显示扩张韧性有限。
        - 即便客户数看起来健康，平台故事的质量也会下降。
        - 降低确信度，把牵引指标视为比公开表象更嘈杂。
      - - 优先股堆叠对投资人不友好
        - 清算优先权、反稀释条款或治理条款扭曲表面估值。
        - 名义 $1.3B 估值高估了真实的新资金经济性。
        - 暂停、重定价，或要求结构化进入。
      - - 合规摩擦上升
        - 隐私、生物识别或窃听监管控制显著拖慢受监管企业采用。
        - 品类增长无法干净转化为 Deepgram 的收入质量。
        - 下调乐观情景权重，并重新评估渠道假设。
      - - 合作伙伴转化停滞
        - 战略合作伙伴没有带来可衡量的 ARR 杠杆。
        - 分发价值仍停留在叙事层面，而不是盈利驱动。
        - 即便技术基准仍强，也把判断维持在观察。
    notes: 这些是估值触发项，不是泛泛风险：每一项都可能直接推翻当前进入价格。
    claimRefs:
