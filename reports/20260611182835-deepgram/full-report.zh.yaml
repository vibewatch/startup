      - number: '8.4'
        title: 投资逻辑破裂点、退出准备度与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              剩下的工作直接且关键。按这轮价格买入的人，需要核验分行业 ARR、毛利率、留存、客户集中度，以及 Series C
              实际优先股堆叠。没有这些文件，反向逻辑仍然太强：一家公司可以现金流为正、技术可信、战略相关，但入场价格仍可能让新钱上行空间有限。合规背景也值得纳入定价。Goodwin 2026 年关于 AI 转录工具的说明强调了
              BIPA、窃听、留存和特权风险；如果供应商和客户没有妥善处理同意与存储，这些风险会拖慢企业采用，或提高治理成本。这不会击穿 Deepgram
              故事，但会抬高尽调门槛。退出准备度更像是再融资一轮私募或保留战略选择权，而不是近期 IPO，因为公开同业披露的运营细节远多于今天的
              Deepgram。在这些数据缺口关闭之前，正确姿态是跟踪具体投资逻辑破裂触发点，并维持观察建议。
