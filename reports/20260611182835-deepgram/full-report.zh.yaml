      - number: '1.3'
        title: 融资历史、估值与投资者基础
        blocks:
          - type: paragraph
            body: >
              Deepgram 多轮融资累计超过 $215 million。公司参加了 Y Combinator（W2016），随后完成种子轮，并于 2022 年完成 $72 million Series
              B，估值未披露。2026 年 1 月 13 日，Deepgram 宣布以 $1.3 billion 估值完成 $130 million Series C，进入独角兽行列；本轮由 AVP 领投，AVP
              是一家独立全球投资平台，聚焦欧洲和北美高增长科技公司。

              Series C 的投资者基础明显广且具战略性。所有主要既有投资者都继续跟投，包括 Alkeon、In-Q-Tel、Madrona、Tiger、Wing、Y Combinator，以及 BlackRock
              管理的基金和账户。新增财务投资者包括 Alumni Ventures 和 Princeville Capital。战略公司投资者包括 Twilio、ServiceNow Ventures、SAP 和 Citi
              Ventures——它们都能带来 go-to-market 和分销杠杆。学术投资者包括 University of Michigan 和 Columbia University，并与更早进入的 Stanford
              University 形成学术投资人阵容。CEO Scott Stephenson 表示，公司 2024 年现金流为正，被接触时并未主动寻求融资，但选择募资以加速国际扩张和产品投入。Series C 也为收购
              OfOne 和在旧金山开设新的 Voice AI Collaboration Hub 提供资金。
