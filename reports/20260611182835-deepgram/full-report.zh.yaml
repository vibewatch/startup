  - id: TV002
    title: 正方 / 反方观点表
    columns:
      - 论点
      - 正方
      - 反方
      - 什么会改变判断
    rows:
      - - 融资质量
        - 2026 年真实融资轮给出新的 $1.3B 锚点，财团中有战略投资者。
        - 当公开财务披露仍偏薄时，新价格并不证明入场价划算。
        - 董事会层面的收入和毛利率文件，会澄清本轮价格是公允还是慷慨。
      - - 运营质量
        - 管理层称，公司进入 2025 年时现金流为正。
        - 现金流为正本身不能揭示 ARR 规模、利润率韧性或留存质量。
        - 经验证的现金流桥接和单位经济模型会强化承销。
      - - 商业牵引力
        - Deepgram 已披露其 API 覆盖 1,300+ 个组织、200,000+ 名开发者和 400+ 个企业客户。
        - 这些指标显示触达，但没有揭示每个客户群组变现出多少收入。
        - 分段 ARR 和企业 ACV 数据会把活跃度转成价值。
      - - 赛道动能
        - 独立市场报告和私营同行显示，语音 AI 仍是资金充足的增长赛道。
        - 赛道增长由多个竞争者共享，并不保证 Deepgram 抓住溢价经济性。
        - 净留存和伙伴渠道转化会显示 Deepgram 是否在经济层面取胜，而不只是技术层面。
      - - 竞争姿态
        - Deepgram 主张自己在延迟、成本和部署灵活性上胜过主要对手。
        - 这些说法来自 Deepgram 营销页面，单独不足以支撑估值。
        - 与商业转化绑定的独立基准测试，会让这种优势更可投。
      - - 建议
        - 以当前阶段看，公司足够可信，值得密切跟踪。
        - 公开记录仍留下太多不确定性，不足以给出看多承销结论。
        - 只有私下财务证据补上分母缺口，建议才会改变。
    notes: 反方主要针对披露和入场价格，而不是质疑 Deepgram 是否是一家有真实需求的真实公司。
