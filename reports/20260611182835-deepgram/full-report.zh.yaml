      - number: '4.3'
        title: 资本充足性、成本结构与财务结论
        blocks:
          - type: paragraph
            body: >
              Deepgram 披露累计融资为 $215M+，其中 2026 年 1 月融资 $130M。公司进入 2025 年时现金流为正，因此 $130M Series C 主要是增长资本，而不是生存资金，这会显著改变对
              burn-rate 的假设。Series C 后，$130M 进入一家现金流为正的公司，即使没有收入增长，按当前规模有效 runway 也可能为 4+ 年；但公司明确要加速增长投入（伙伴计划、收购整合、voice
              AI hub），意味着近期经营费用会上升。

              语音 AI API 公司的成本结构主要包括：（1）计算 / 推理成本（用于模型服务的 GPU 集群——高 capex 或云 COGS）；（2）研发（模型训练、研究团队）；（3）销售与营销（PLG +
              企业直销）；（4）G&A。Deepgram 的自托管和本地部署选项能降低其为本地客户承担的服务成本（成本转移给客户），同时保留许可收入。规模化云 API 交付的 AI 基础设施运营商，毛利率通常在
              50–70%；但早期或成长期玩家常因 GPU 超额配置而更低。Deepgram 未披露毛利率。未见公开债务或项目融资义务。

              财务结论：Deepgram 的公开财务画像符合一家 Series B/C 阶段 API 平台，且具备真实 product-market
              fit（现金流为正、使用量增长、企业采用）。主要承销风险是未披露毛利率（计算成本暴露）、企业合同流失率和净收入留存——这些都没有公开数据。它们构成下一阶段可执行尽调请求。
