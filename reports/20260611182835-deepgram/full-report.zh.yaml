        - 基于 Transformer 的语言模型，用于具备上下文感知的 STT
        - 专利 US 12,380,880；无需重构流水线即可做领域适配
      - - 硬件高效推理
        - 用于模型服务的专有潜在空间压缩
        - 专利 US 12,334,075；可在通用硬件上跑出有竞争力的定价和本地部署
      - - Flux EOS 检测
        - 面向语音结束检测的专用对话语音模型
        - 语音代理延迟低于 300ms；不是通用 STT 模型
