  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格锚点，以及公开证据能证明什么、不能证明什么
        blocks:
          - type: paragraph
            body: >-
              Deepgram 确实有一个硬估值数据点：2026 年 1 月 13 日，公司宣布以 $1.3 billion 估值完成 $130 million Series
              C，多家媒体也重复了同样的轮次规模和估值。这一点重要，因为本章不再是纯假设，而是在评估当前已知价格是否站得住。这轮融资还包括 Twilio、ServiceNow Ventures、SAP、Citi
              Ventures 等战略方，比纯财务投资人组成的辛迪加更有信号价值。管理层另行告诉 TechCrunch，Deepgram 前一年现金流为正，并不是为了防守性补钱。对于一家处在算力密集品类的 AI
              基础设施公司，这些都是有意义的正面因素。问题是，公开记录仍未给出投资人需要的分母。Deepgram 披露了采用和使用信号，但没有公开披露 ARR、毛利率、净收入留存或股权结构条款。因此，$1.3 billion
              标记看起来合理，但公开解释仍然不够充分。
