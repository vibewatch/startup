  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              语音 AI API 的竞争格局可分为四层。第一层（hyperscaler）：AWS Transcribe、Google Cloud Speech-to-Text（Chirp 3）和 Azure Speech
              Services 与各自云生态捆绑。它们的主要优势是无缝 IAM、账单集成、合规认证，以及在既有云原生客户眼中的近零边际成本。它们靠便利性和分销竞争，而不是技术领先。第二层（纯 API
              厂商）：AssemblyAI、Speechmatics、ElevenLabs（Scribe）和 Rev.ai 是面向开发者的竞争对手。AssemblyAI
              在转写智能（情感、主题、实体抽取）上领先；Speechmatics 在受监管行业的本地部署（55+ 种语言）上领先；ElevenLabs Scribe v2 在多语言实时准确率上领先。第三层（全栈 LLM
              平台）：OpenAI 的 GPT-Realtime API（$32/1M tokens input audio）把 STT 与 LLM
              推理打包，对希望单一供应商的语音智能体构建者构成竞争威胁。第四层（开源）：OpenAI Whisper 和 NVIDIA Canary Qwen 2.5B 是可免费自托管的模型，争夺批量、非延迟关键工作负载。

              Deepgram 最清晰的竞争优势在实时语音智能体基础设施：Flux 可实现低于 300ms 的端点检测延迟，Nova-3 拿到最高批量 WER（5.26%），统一 Voice Agent API 消除了
              STT+TTS+LLM 拼接负担。截至 2026 年 5 月，尚无竞争对手能在实时智能体工作负载上同时匹配 Deepgram 的准确率、延迟和统一编排。
