      - number: '5.2'
        title: 技术架构与平台组件
        blocks:
          - type: paragraph
            body: >
              Deepgram 的核心技术是用于自动语音识别（ASR）的端到端（E2E）深度学习架构，与传统流水线 ASR（声学模型 + 语言模型 + 解码器）形成对比。E2E
              方法训练单个神经网络，将原始音频波形直接映射为文本，同时提高准确率和硬件推理效率。这一架构由两项美国专利保护：US 12,380,880（带 transformer 架构的端到端 ASR）和 US
              12,334,075（硬件高效 ASR）。专利描述的系统能以每分钟推理显著更低的算力要求实现有竞争力的 WER，这是 Deepgram 相比 hyperscaler 具备定价优势的基础。

              Nova-3 模型（2025 年 2 月发布）针对 9 个音频领域和 45+ 种语言的批量及流式 STT 优化，并提供领域专用模型（医疗、金融、法律、汽车、对话）。Flux
              是专为对话式语音识别打造的模型，针对实时智能体场景的语音结束（EOS）检测优化，可在语音结束到转写交付之间实现低于 300ms 的延迟——这对语音智能体响应至关重要。Aura-2 是 Deepgram 第二代神经
              TTS 模型，为智能体响应提供低延迟、自然的语音合成。Voice Agent API（2025 年 6 月 GA）把三类模型和 LLM 编排抽象进单个基于 WebSocket 的 API，消除了多跳
              STT→LLM→TTS 栈带来的延迟叠加。

              Deepgram 的 3-factor 自动领域适配，让企业客户能通过半自动微调流水线，为专有词汇定制模型。客户音频语料可提交做领域适配，无需手工修改模型架构。这是「data
              flywheel」护城河的主要机制——客户把模型微调到专有垂直数据（医疗、法律、QSR）上，会以适配模型权重的形式积累切换成本。
