  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              Deepgram 将自己定位为实时语音 AI API 基础设施层，服务构建 voice-native 应用的开发者和企业。其产品嵌入三类核心客户工作流：（1）实时对话和语音智能体工作流：开发者嵌入 Voice
              Agent API，为客服、销售、餐厅点单和支持自动化创建低延迟对话智能体。智能体通过 Flux STT 模型聆听（针对 <300ms 的语音结束检测优化），通过集成 LLM（用户可配置）处理转写，再通过
              Aura-2 TTS 模型响应，全程在单个 WebSocket API 会话中完成，不需要多供应商拼接。（2）批量转写和智能分析工作流：企业（法律、医疗、媒体、合规）通过 REST API 将录音发送给
              Nova-3 STT，用于通话后分析、字幕生成和医疗文档。Nova-3 支持说话人分离、智能格式化、主题检测和脱敏。（3）本地部署的受监管企业工作流：政府、国防和金融服务客户在自有基础设施上部署 Deepgram
              的 STT/TTS 模型，与云产品保持完整 API parity，音频数据不离开网络边界。

              每类工作流都由不同模型 SKU 支撑，价格、延迟曲线和功能集不同，让企业买家能从开发者实验清晰升级到生产级部署。$200 免费开发者额度和 PAYG 定价，借助 product-led growth
              降低了新开发者采用门槛。
