      - number: '2.4'
        title: 增长驱动、约束与护城河动态
        blocks:
          - type: paragraph
            body: >
              Deepgram 的可服务市场增长快于整体云软件市场，但三项结构性约束限制了捕获率。第一，hyperscaler 补贴定价：AWS Transcribe、Google Cloud Speech-to-Text 和
              Azure Speech 都原生嵌入各自云生态，价格低到 Deepgram 无法在规模化后长期低于它们。使用 AWS-native 技术栈的客户可能即便牺牲一些准确率，也会优先选择
              Transcribe，以简化账单、合规和供应商管理。第二，开源替代：Whisper 和 NVIDIA Canary Qwen 2.5B 对批量、非实时场景提供足够准确率（5.63% WER），且 API
              成本为零。Deepgram 在这一层的护城河只有延迟和微调速度；这对实时语音智能体非常重要，但对会议转写并不重要。第三，多语言缺口：非英语市场需要实时转写时，ElevenLabs Scribe v2
              目前在基准上领先；Deepgram 国际扩张时，这是一项结构性风险。

