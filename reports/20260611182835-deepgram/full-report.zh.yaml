companyProfile:
  summary: >-
    Deepgram 是一家总部位于旧金山的语音 AI 基础设施公司，由 Scott Stephenson、Noah Shutty 和 Adam Sypniewski 于 2015
    年创立。公司没有包装第三方开源模型，而是围绕自研端到端深度学习搭建语音栈；如今销售一整套 API 层平台，覆盖语音转文本、文本转语音、音频智能和实时语音智能体编排。公开证据显示商业牵引已具规模：400+ 家企业客户、200,000+
    名开发者、超过 1,300 个组织基于 Deepgram API 构建应用，并通过 AWS、IBM 和 Twilio 打开战略渠道。Deepgram 2026 年 1 月的 Series C 将公司估值推至 $1.3
    billion，并为后续产品扩张、收购餐饮公司 OfOne 以及渠道建设提供资金。主要承销缺口不在于产品是否真实，而在于未披露的 ARR、毛利率和留存能否支撑当前估值。
