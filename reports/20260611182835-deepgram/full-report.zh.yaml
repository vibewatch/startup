      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Deepgram 的买家版图分为三层。第一层是开发者 / 初创公司层（200,000+ 名开发者使用免费计划或 pay-as-you-go）：这些用户通常是小团队的技术决策者，会通过文档、沙盒和每分钟价格基准评估
              API。预算归属工程团队或个人创始人。第二层是企业层（400–450 个组织）：买家通常是中端市场到 Fortune 500 公司的 VP of Engineering、CTO 或 IT
              采购负责人。采购通过年度企业合同完成，并谈判量价。垂直行业包括联络中心、医疗、金融服务、餐饮连锁（收购 OfOne 后）以及政府 / 情报（由 In-Q-Tel 信号体现）。第三层是平台 / ISV
              层：Vapi、Kore.ai 和 Granola 等公司把 Deepgram 嵌入为基础设施组件，再作为自身产品的一部分转售。这一层用量高、价格敏感度较强，并贡献了不成比例的 API 调用量。

              企业买家的采用路径遵循开发者驱动的 PLG：开发者先在免费计划中评估 API，做出原型，推动 IT 采购，最后转为企业合同。这种自下而上的扩张，在结构上类似 Twilio、Stripe
              和其他开发者基础设施公司。付款方分层也与规模一致：开发者刷信用卡，企业按年度发票付款，ISV 谈判量价折扣。
