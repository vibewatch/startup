  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 与收入桥
        - 董事会批准的 2024–2026 ARR、确认收入和分部结构。
        - 这是判断 $1.3B 究竟保守、合理还是偏高的分母。
        - CFO 材料、董事会材料和月度管理报告。
      - - 毛利率与推理成本
        - 按产品划分的毛利率、算力负担、托管组合和合作伙伴经济性。
        - 如果毛利率结构性强，现金流转正更有韧性。
        - 财务和基础设施审查，要求队列或产品级成本明细。
      - - 留存与扩张
        - 总留存率、NRR、企业扩张和主要队列流失。
        - 只有扩张和续约强，较高客户数才更值钱。
        - 收入运营仪表盘和队列分析。
      - - Series C 条款
        - 清算优先权、按比例认购权、治理安排和任何 side-letter 保护。
        - 表面估值可能显著高估新投资人的有效经济性。
        - 律师审查融资文件和股权结构表。
      - - 集中度与渠道结构
        - 头部客户、头部合作伙伴以及直营对渠道收入集中度。
        - 只有转化为多元且持久的收入，战略合作伙伴信号才有用。
        - 客户集中度分析和合作伙伴 pipeline 审查。
      - - 合规控制
        - 同意流程、留存政策、生物识别保护和受监管行业部署控制。
        - 治理摩擦会拖慢企业扩张，并削弱估值支撑。
        - 结合法律、隐私和产品尽调，核对部署足迹。
    notes: 这些是最低限度的尽调要求；只有满足它们，才可能在当前价格下把建议从观察推向买入。
    claimRefs:
