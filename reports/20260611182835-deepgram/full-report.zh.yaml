              种语言。Rev.ai 提供 pay-as-you-go 模式和免费 5 小时评估档。OpenAI Whisper 开源且可自托管；GPT-Realtime-2 高端实时 API 价格为 $32/1M audio
              input tokens。

              ElevenLabs Scribe v2 Realtime 按 FutureAGI 基准，在 30 种语言上实现约 150ms 延迟，价格为 $0.22–$0.48/hour，目前领先多语言实时 STT。这是
