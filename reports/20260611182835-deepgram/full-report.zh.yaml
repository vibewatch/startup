  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Deepgram（标的）
        - 2026 年 1 月私募轮
        - 估值 $1.3B；融资 $130M
        - 本章的直接价格锚点。
        - 公开记录仍缺少 ARR、毛利率、NRR 和优先权条款。
      - - SoundHound AI
        - 2026 年 6 月公开市值
        - 市值 $3.02B
        - 抓取样本中最接近的上市纯语音 AI 框架可比公司。
        - 这是一家上市公司，带有收购、季度审视和不同风险画像，和一家私有 API 平台不一样。
      - - Twilio
        - 2026 年 6 月公开市值
        - 市值 $31.33B
        - 有战略和分发参考价值，因为 Twilio 也投资了 Deepgram。
        - 相比 Deepgram，业务覆盖的 CPaaS、数据和客户互动平台要宽得多。
      - - Five9
        - 2026 年 6 月公开市值
        - 市值 $1.59B
        - 绝对股权价值接近 Deepgram 的应用层联络中心软件锚点。
        - 它更像工作流软件，而不是基础语音模型厂商。
      - - NICE
        - 2026 年 6 月公开市值
        - 市值 $5.14B
        - 企业 CX 和分析基准，可参照规模化语音邻近软件价值。
        - 成熟大型软件组合让它更像上限参照，不是直接同业。
      - - ElevenLabs
        - 2025 年 1 月私募轮
        - 估值 $3.3B；$180M Series C
        - 高增长私有音频 AI 基准，说明品类投资人愿意支持高溢价语音平台。
        - 创作者 / TTS / 消费者业务占比更重，估值也比 Deepgram 的轮次早一年。
      - - AssemblyAI
        - 私募融资状态
        - $50M Series C；累计融资 $115M；估值未披露
        - 直接语音 API 同业，具备有意义的生产规模和强客户信号。
        - 抓取来源没有披露估值，因此它是战略同业，不是干净的价格可比对象。
    notes: 本表完整覆盖本章使用的可比对象；每一行都列出明确局限，因为无论上市还是私有同业，都没有一个能和 Deepgram 完全一一对应。
