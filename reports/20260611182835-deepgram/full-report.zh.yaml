      - number: '6.3'
        title: 耐久性、扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Deepgram 的公开材料在采用和产品宽度上远强于耐久性。已审阅来源没有披露 NRR、GRR、流失、合同期限或头部客户集中度，因此不能仅凭 400+
              家企业这一标题推断客户质量。最好的正面耐久性信号来自证言，而不是财务：UpdateAI 和 Nytro.AI 都称 Deepgram 是其产品的基础，PeerSpot
              的独立评价聚合也强调速度、准确率、低延迟和成本。但同一评价聚合也暴露出语言覆盖、实时转写稳定性、说话人识别和并发问题，说明满意度并非单向一致。


              扩张逻辑仍然清晰。Deepgram 可以从 STT 落地，再扩展到 TTS、分析和 Voice Agent API；也能通过 AWS 采购、Amazon Connect、IBM watsonx 分销和
              Twilio 电话工作流扩大商业覆盖。风险在于，续约和集中度的公开证明没有跟上更宽的平台叙事。RFP.wiki 的采购说明明确建议买家压力测试可靠性、可观测性、回滚和定价现实性；Goodwin
              的隐私分析则说明，受监管客户在扩大使用前，为什么可能要求更强的同意、留存和供应商控制证据。由于 Deepgram 的 Amazon Connect 路径目前只支持 hosted
              customers，即便渠道扩张，也尚未对所有客户类型做到部署中立。
