      - number: '5.3'
        title: 部署、集成、合规与路线图
        blocks:
          - type: paragraph
            body: >
              Deepgram 提供三种部署模式：（1）Cloud API——通过 deepgram.com API 以托管 SaaS 方式提供，支持 WebSocket 和 REST
              端点；（2）Self-hosted——在客户 AWS、GCP 或 Azure 环境中用 Docker/Kubernetes 容器部署；（3）On-premises——可完全 air-gap
              部署在客户数据中心，不发起外部 API 调用。自托管和本地模型与云产品保持完整 API parity，使受监管企业能从云迁移到本地而无需修改 SDK。

              集成面包括：REST API（批量转写）、WebSocket API（流式 STT 和 Voice
              Agent）、SDK（Python、JavaScript/TypeScript、Go、.NET、Ruby、PHP）、CLI，以及面向 AI 编码工具的 MCP Server。状态监控位于
              status.deepgram.com；公开披露的历史 uptime 显示 2024 年有两次事故，均在 4 小时内解决。所有档位均可签 HIPAA Business Associate
              Agreements。定价页将 HIPAA 合规列为所有付费计划功能。Deepgram 数据隐私政策支持敏感工作负载的零留存模式（转写后不存储音频）。

              博客和产品公告释放的路线图信号包括：多语言 Flux 模型（Flux Multilingual 于 2026 年 6 月宣布）、扩展领域专用 Nova-3 模型、扩展 Saga OS 语音智能体操作系统能力，以及
              OfOne 餐饮 AI 集成。IBM watsonx 和 AWS SCA 伙伴关系意味着双方可能为企业客户共同开发语音智能体场景，这会加速受监管行业产品功能（医疗、金融服务）。Powered by
              Deepgram 计划认证基于 Deepgram 基础设施构建的 ISV 伙伴。
