- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Biometric / BIPA exposure
    - Consent and retention controls for voiceprint-like workflows remain unclear
    - No product-level Illinois consent flow, retention schedule, or indemnity answer
      during diligence
    - Pause underwriting for Illinois-heavy deployments or carve them out from forecast
  - - HIPAA / healthcare compliance execution
    - Security-rule readiness artifacts are missing
    - No current BAA template, no business-associate audit evidence, or no roadmap
      for proposed rule deltas
    - Treat healthcare expansion as speculative rather than committed growth
  - - Reliability and scale
    - Public or diligence-observed capacity posture weakens
    - Repeated throttling, missed concurrency commitments, or no credible uptime reporting
    - Haircut growth assumptions and require stronger SLA and observability evidence
  - - Partner dependency
    - A single channel or provider becomes too critical
    - AWS, IBM, or telephony / LLM partner path becomes gating for a large share of
      enterprise wins
    - Apply concentration discount and require alternative-path proof
  - - Price and architecture competition
    - Open-source or hyperscaler alternatives compress commercial leverage
    - Win-loss data shows customers choosing self-hosted or hyperscaler stacks mainly
      on control or price
    - Re-rate margin and retention assumptions downward
  - - Disclosure quality
    - Core underwriting data stays private late in diligence
    - Top-customer mix, partner revenue share, uptime metrics, and legal-risk posture
      remain unavailable
    - Escalate to a no-go unless private diligence closes the gap
  notes: Kill criteria are monitorable diligence triggers tied to the cited risks,
    not predictions that the thresholds have already been breached.
