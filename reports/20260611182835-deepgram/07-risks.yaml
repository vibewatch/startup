- id: operational-and-dependency-exposures
  title: Operational and Dependency Exposures
  body: 'Deepgram’s public mitigation story is strongest when a buyer can choose architecture
    deliberately. The company offers hosted, dedicated, self-hosted, and customer-cloud
    deployment patterns, plus an EU endpoint and AWS-native routes through Connect,
    SageMaker, Bedrock, Marketplace, and PrivateLink-style connectivity. Those options
    matter because the underlying exposures are visible in the docs themselves. Deepgram’s
    rate limits constrain concurrency by plan and by project; the company explicitly
    prohibits project-splitting to bypass caps. The EU endpoint helps with regional
    processing, but not every model or managed-provider path behaves the same way
    there, and the docs say only OpenAI is presently routed through EU infrastructure
    on the managed-provider side. Amazon Connect support is also hosted-only today,
    which means the easiest contact-center integration path is not yet deployment-neutral
    for buyers that require self-hosting.


    That leads directly into dependency risk. AWS is not just a cloud venue; it is
    a procurement route, deployment surface, and model-orchestration layer. IBM expands
    enterprise distribution but introduces channel reliance of its own. Twilio’s published
    architecture shows how quickly a production voice agent can become a multi-vendor
    chain where telephony, speech, reasoning, and synthesis each sit with different
    providers. Deepgram can partially mitigate that with self-hosted or dedicated
    deployments, but its own deployment docs say self-hosting shifts infrastructure,
    backup, and uptime responsibility toward the customer. In practice, that means
    the company can lower some privacy and sovereignty risk by externalizing control,
    while still keeping meaningful brand and support exposure if customer-run operations
    underperform. The chapter’s operational verdict is therefore not that Deepgram
    lacks mitigations; it is that its mitigations often trade one exposure for another.'
  claimRefs:
  - CR017
  - CR018
  - CR019
