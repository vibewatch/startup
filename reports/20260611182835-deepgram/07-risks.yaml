  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: A complete Deepgram-specific inventory of litigation, enforcement,
      consent tooling, retention schedules, and jurisdiction-specific biometric controls.
    whyItMatters: The chapter can rank exposure categories, but public sources do
      not show whether Deepgram has productized controls that fully neutralize those
      statutes in production.
    diligencePath: Request policy documents, product screenshots, contract language,
      and counsel memos covering Illinois, healthcare, and cross-border voice workflows.
    relatedQuestionRefs:
    - QR004
    - QR026
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: uptime-and-scale-metrics
    missingEvidence: Audited uptime, error budget, throttling history, concurrency
      utilization, and incident postmortem detail by major product line.
    whyItMatters: Rate limits and reliability promises are public, but underwriters
      still cannot test whether operating performance matches the enterprise narrative
      at scale.
    diligencePath: Obtain SLA reports, status history exports, major-incident reviews,
      and product-level capacity planning metrics.
    relatedQuestionRefs:
    - QR022
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration-and-channel-mix
    missingEvidence: Top-customer concentration, partner-sourced revenue share, AWS-linked
      procurement share, IBM channel contribution, and renewal metrics.
    whyItMatters: The public record shows meaningful partner leverage but not whether
      one route or customer cohort dominates the commercial outcome.
    diligencePath: Request cohort revenue tables, top-10 customer exposure, channel
      attribution, and renewal or expansion data by segment.
    relatedQuestionRefs:
    - QR023
    - QR028
    - QR030
    - QR024
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: healthcare-readiness
    missingEvidence: Current healthcare-specific security attestations, updated BAA
      language, annual verification evidence, and customer-ready control mappings
      against the proposed HIPAA rule.
    whyItMatters: Healthcare can be a high-value vertical, but the underwriting case
      weakens materially if the company cannot show operational readiness beyond marketing
      claims.
    diligencePath: Ask for healthcare customer references, compliance mappings, penetration-test
      summaries, and named owners for remediation against the proposed rule.
    relatedQuestionRefs:
    - QR006
    - QR025
    - QR030
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: material
    topic: execution-readiness
    missingEvidence: Org design, implementation staffing, QA coverage, and support-load
      data showing Deepgram can scale STT, TTS, healthcare, and voice-agent programs
      simultaneously.
    whyItMatters: Rapid product and channel expansion can look strong in marketing
      before the organization proves it can support regulated buyers and complex integrations
      at the same time.
    diligencePath: Request org charts, implementation headcount, support ratios, escalation
      metrics, and release-quality reviews by major product line.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR004
