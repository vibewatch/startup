- id: residual-exposure-and-kill-criteria
  title: Residual Exposure, Mitigations, and Kill Criteria
  body: 'The underwriting question is not whether Deepgram has a credible product
    or even a credible mitigation toolkit; public evidence supports both. The question
    is whether those mitigations are mature enough, repeatable enough, and documented
    enough for the most sensitive buyers before competition and regulation compress
    the company’s room to learn. Open-source speech models and hyperscaler stacks
    already offer buyers a control narrative, even when Deepgram still wins on latency
    or specific hosted benchmarks. Adjacent public-company filings from Twilio and
    SoundHound reinforce that privacy controls, deployment flexibility, open-source
    governance, and third-party service quality are not fringe concerns; they are
    recurring platform risks in the category. MarketsandMarkets and AssemblyAI also
    show why this matters now: the market is growing fast, adoption is broadening,
    and QA, governance, and compliance are becoming core differentiators rather than
    afterthoughts.


    That leaves residual exposure squarely in disclosure and proof quality. Public
    sources still do not show customer concentration, partner-sourced revenue share,
    audited uptime metrics, or Deepgram-specific biometric indemnity posture. Those
    omissions do not negate the company’s strengths, but they do prevent a clean downgrade
    of residual exposure to low. The investable path is therefore conditional. If
    diligence confirms productized consent controls for Illinois-sensitive workflows,
    healthcare-ready documentation that matches the proposed HIPAA bar, and credible
    proof that partner or architecture dependence is not hiding concentration risk,
    the current risk set looks manageable. If those points stay private or vague,
    then the correct investment response is not optimism by default; it is a narrower
    scope, heavier discounting, or a stop condition. The kill criteria in this chapter
    are designed exactly for that boundary.'
