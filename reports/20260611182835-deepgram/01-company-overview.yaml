callouts:
  - calloutType: strength
    title: Physics Founders with First-Principles AI Advantage
    body: >
      All three co-founders are physicists whose prior work in waveform analysis and neural network-based
      signal processing for dark matter detection directly transferred to building end-to-end deep learning
      STT from scratch. This is a genuine founder-market fit that produced proprietary model architecture
      rather than fine-tuned third-party models.
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO008

  - calloutType: strength
    title: Cashflow Positive Before Series C
    body: >
      CEO Scott Stephenson confirmed cashflow positivity in 2024 prior to the Series C raise, indicating
      sustainable unit economics at the time of fundraising. This is an unusual and favorable signal for
      a pre-IPO voice AI infrastructure company competing against hyperscaler subsidized products.
    claimRefs:
      - CO025

  - calloutType: risk
    title: Key-Person Concentration in CEO
    body: >
      All public communications, partnership announcements, and strategic narratives flow through Scott
      Stephenson. No COO, CFO, or President has been publicly named, creating a material key-person risk
      if Stephenson were to depart, become incapacitated, or be involved in a reputational event.
    claimRefs:
      - CO011
      - CO012

  - calloutType: risk
    title: Revenue and Headcount Undisclosed
    body: >
      Deepgram has not publicly disclosed revenue, ARR, or precise headcount. This limits independent
      validation of growth trajectory and cost structure, and creates an evidence gap for valuation analysis.
    claimRefs:
      - CO030

