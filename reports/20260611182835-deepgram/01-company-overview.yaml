company:
  name: Deepgram
chapter:
  number: 1
  title: Company Overview
  summary: >
    Deepgram is a San Francisco-based, research-driven foundational AI company that builds a real-time voice AI platform
    for developers and enterprises. Founded in 2015 by former nuclear/particle physicists Scott Stephenson, Noah Shutty,
    and Adam Sypniewski, it raised a $130 million Series C at a $1.3 billion valuation in January 2026, led by AVP, bringing
    total funding to over $215 million. The company serves 200,000+ developers and 400+ enterprise customers, achieved
    cashflow positivity in 2024, and expanded its addressable market via the acquisition of restaurant voice AI platform OfOne.

sections:
  - id: identity-and-origin
    title: Identity, Founding, and Origin Story
    body: >
      Deepgram, Inc. was incorporated and founded in 2015 by Scott Stephenson, Noah Shutty, and Adam Sypniewski—three
      physicists who were working on underground dark matter detection experiments when they discovered that the waveform
      analysis techniques used to process radioactive decay signals could be applied to speech audio. Working roughly two
      miles underground at a research facility in China, the co-founders built custom detectors, trained neural networks
      on analog waveforms using GPUs and FPGAs, and documented their work with audio recordings they wanted to search
      and analyze. Finding no adequate speech recognition API to serve that need, they built their own end-to-end deep
      learning solution and pivoted to commercializing it as Deepgram.

      Deepgram went through Y Combinator's Winter 2016 batch, which seeded its early developer community and provided
      initial enterprise introductions. The company is headquartered in San Francisco, California, operates as a
      remote-first organization distributed across 20+ US states and 5+ countries, and positions itself as a foundational
      AI company whose core mission is enabling human-machine interactions through voice. Its one-line business model is:
      API-first, usage-based access to proprietary real-time voice AI models (speech-to-text, text-to-speech, and voice
      agents) with cloud, self-hosted, and on-premises deployment options.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO001

  - id: founders-and-leadership
    title: Founders, Leadership, and Governance
    body: >
      CEO and Co-Founder Scott Stephenson holds a PhD in particle physics from the University of Michigan, where he
      conducted postdoctoral research on dark matter detectors before leaving to co-found Deepgram. He is the primary
      public voice and strategic decision-maker at the company. Co-Founder Noah Shutty and Co-Founder Adam Sypniewski
      both contributed to Deepgram's early deep-learning architecture; Sypniewski serves as CTO. The founding team's
      shared physics background is central to Deepgram's brand narrative and technical differentiation—end-to-end deep
      learning from first principles rather than rule-based or hybrid approaches.

      The board includes representation from lead investor AVP (General Partner Elizabeth de Saint-Aignan) and major
      returning investors Madrona and In-Q-Tel, among others. In-Q-Tel's participation since an earlier round signals
      government/intelligence community interest in Deepgram's transcription accuracy and on-premises deployment
      capability. Key-person dependence on Scott Stephenson is real: he is the sole named executive in all public
      announcements, press releases, and major partnership communications, and no named COO, CFO, or President has
      been publicly disclosed as of June 2026.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO002

  - id: funding-and-investors
    title: Funding History, Valuation, and Investor Base
    body: >
      Deepgram has raised over $215 million in total funding across multiple rounds. The company went through Y Combinator
      (W2016), raised a seed round, then completed a $72 million Series B in 2022 at an undisclosed valuation. On January 13,
      2026, Deepgram announced its $130 million Series C at a $1.3 billion valuation—achieving unicorn status—led by AVP,
      an independent global investment platform focused on high-growth technology companies in Europe and North America.

      The Series C attracted a notably broad and strategic investor base. All major existing investors rejoined, including
      Alkeon, In-Q-Tel, Madrona, Tiger, Wing, Y Combinator, and funds and accounts managed by BlackRock. New financial
      investors included Alumni Ventures and Princeville Capital. Strategic corporate investors included Twilio, ServiceNow
      Ventures, SAP, and Citi Ventures—all representing go-to-market and distribution leverage. Academic investors included
      the University of Michigan and Columbia University, joining earlier academic investors Stanford University. CEO Scott
      Stephenson stated the company was cashflow positive in 2024 and was not actively seeking capital when approached, but
      chose to raise to accelerate international expansion and product investment. The Series C also funded the acquisition
      of OfOne and the opening of a new Voice AI Collaboration Hub in San Francisco.
    claimRefs:
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
    tableRefs:
      - TO003

  - id: scale-and-milestones
    title: Business Scale and Milestone Chronology
    body: >
      Deepgram's public scale indicators as of early 2026 include 200,000+ developers building on its APIs, 400+
      enterprise customers (per January 2025 announcement), and the processing of over 50,000 years of audio and more
      than 1 trillion words to date. The company reported 3.3× annual usage growth across the prior four years (reported
      January 2025). Revenue and ARR figures have not been publicly disclosed, but Stephenson confirmed cashflow
      positivity in 2024, implying a healthy cost structure relative to revenue at that point.

      Key milestones span founding (2015), YC batch (W2016), dark-matter-to-speech pivot, Series B (2022), Nova-3
      launch (February 2025), Voice Agent API GA (June 2025), AWS Strategic Collaboration Agreement (August 2025),
      Series C and OfOne acquisition (January 2026), and IBM watsonx Orchestrate partnership (February 2026). The
      company also articulated an ambition to "pass the Audio Turing Test at scale in 2026," signaling continued
      investment in naturalness and accuracy at the frontier. Material adverse events include a product outage history
      visible on status.deepgram.com and competition pressure from hyperscaler STT products at lower price points.
    claimRefs:
      - CO021
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
    tableRefs:
      - TO004
    figureRefs:
      - FO001
      - FO002
      - FO003

