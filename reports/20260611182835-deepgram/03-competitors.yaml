callouts:
  - calloutType: strength
    title: Deepgram Leads Real-Time Voice Agent Benchmarks
    body: >
      Per FutureAGI's independent May 2026 benchmark guide, Deepgram Flux + Nova-3 is the top recommendation for
      voice agent workloads (lowest end-to-speech latency and sub-300ms streaming). This is the fastest-growing
      use case in voice AI and Deepgram's primary competitive moat as of the report date.
    claimRefs:
      - CP005
      - CP006

  - calloutType: risk
    title: ElevenLabs Scribe Leads Multilingual Real-Time Benchmark
    body: >
      ElevenLabs Scribe v2 Realtime achieves ~150ms latency across 30 languages and 93.5% FLEURS accuracy (May 2026),
      surpassing Deepgram in the multilingual real-time segment. For Deepgram's planned European and APAC expansion,
      this is a material competitive gap that may require dedicated multilingual model investment.
    claimRefs:
      - CP012

  - calloutType: risk
    title: OpenAI GPT-Realtime as Consolidation Risk
    body: >
      OpenAI's GPT-Realtime API bundles voice interaction with LLM reasoning in a single API call, creating a
      consolidation risk for voice agent builders who prefer to reduce vendor count. If OpenAI improves latency
      and pricing on its realtime voice offering, it could displace Deepgram's Voice Agent API tier.
    claimRefs:
      - CP004

