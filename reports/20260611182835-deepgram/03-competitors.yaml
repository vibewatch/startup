  claims:
    - id: CP001
      statement: >
        Deepgram's competitive landscape includes four tiers: hyperscalers (AWS, Google, Azure), pure-play API vendors
        (AssemblyAI, Speechmatics, ElevenLabs, Rev.ai), full-stack LLM platforms (OpenAI GPT-Realtime),
        and open-source models (Whisper, NVIDIA Canary).
      type: inferred
      topic: competitive-landscape
      sourceRefs: [SP001, SP012]
      confidence: high
      freshness: current
      answersQuestionRefs: [QP001]

    - id: CP002
      statement: Hyperscalers (AWS, Google, Azure) compete primarily on distribution and cloud bundling rather than technical leadership in real-time accuracy or latency.
      type: inferred
      topic: competitive-landscape
      sourceRefs: [SP001, SP006, SP007]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QP005]

    - id: CP003
      statement: Open-source Whisper (OpenAI) is a free self-hosted STT model competing with Deepgram for batch, non-latency-critical developer workloads; it achieves competitive accuracy but cannot match Deepgram's real-time latency as a hosted API.
      type: third-party-reported
      topic: competitive-landscape
      sourceRefs: [SP001, SP004]
      confidence: high
      freshness: current
      answersQuestionRefs: [QP006]

    - id: CP004
      statement: OpenAI's GPT-Realtime API ($32/1M audio tokens input) poses a platform consolidation risk for voice agent builders who prefer a single provider for LLM and voice, potentially displacing Deepgram's Voice Agent API tier.
      type: inferred
      topic: competitive-threat
      sourceRefs: [SP004, SP022]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QP010]

    - id: CP005
      statement: Deepgram Nova-3 achieved the lowest WER (5.26%) among hosted STT APIs on FutureAGI's independent benchmark across 9 audio domains (May 2026), ahead of AssemblyAI Universal-3 (~5.5%) and OpenAI GPT-4o (~8.9%).
