callouts:
  - calloutType: strength
    title: Cash-Flow Positive at End of 2024 — Rare for AI Infrastructure Stage
    body: >
      Deepgram disclosed it was cash-flow positive at end of 2024, entering the Series C from a position of
      operational self-sufficiency. This is unusual for an AI infrastructure company at this stage and implies
      either high gross margins, lean operating structure, or both. It substantially lowers the execution risk
      associated with the $130M raise relative to a burn-dependent company raising for survival.
    claimRefs:
      - CI008
      - CI015

  - calloutType: risk
    title: No Public ARR, Gross Margin, or NRR — Underwriting Blocked Without Private Financials
    body: >
      Deepgram has disclosed no ARR, gross margin, net revenue retention, CAC, or payback period. While the
      traction metrics (400+ enterprise, 200K+ developers, 3.3× growth) are directionally positive, none of
      them substitute for the financial inputs needed to underwrite the $1.3B valuation or assess capital
      adequacy beyond the present raise. Full financial diligence is blocked until private financials are shared.
    claimRefs:
      - CI027
      - CI028
      - CI029

