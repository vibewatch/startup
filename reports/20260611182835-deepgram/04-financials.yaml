company:
  name: Deepgram
chapter:
  number: 4
  title: Financials and Capital
  summary: >
    Deepgram operates a usage-based revenue model across four product lines — STT (Nova-3, Flux), TTS (Aura-2),
    Voice Agent API, and enterprise contracts — with a prepaid growth tier. Deepgram reported it was cash-flow
    positive at end of 2024, raised $130M Series C at $1.3B valuation in January 2026 (total $215M+), and has
    publicly disclosed 400+ enterprise customers, 200,000+ developers, 3.3× annual usage growth, and over 1
    trillion words transcribed. No ARR, gross margin, or burn rate has been publicly disclosed. Based on public
    pricing and usage data, Deepgram's revenue quality is high (recurring, usage-based), but underwriting requires
    accessing private financial metrics that define capital adequacy and near-term runway.

sections:
  - id: revenue-model
    title: Revenue Model and Pricing Architecture
    body: >
      Deepgram's core monetization is usage-based pricing at the API layer, covering four product lines.
      Speech-to-text (STT): Nova-3 streams at $0.0048/min and Flux (optimized for real-time voice agents) at
      $0.0077/min; both prices apply to the Pay-As-You-Go tier with no minimums and a $200 free credit on signup.
      Text-to-speech (TTS): Aura-2 is priced at $0.015 per 1,000 characters. Voice Agent API: $4.50 per hour,
      combining STT, TTS, and LLM orchestration in a unified real-time API, announced at general availability in
      June 2025. A Growth plan (prepaid credits) at $4,000+/year saves approximately 20% versus PAYG and includes
      higher concurrency limits. Enterprise accounts receive custom pricing, dedicated support, on-premises
      deployment options, and SLA commitments. Revenue from the enterprise tier is almost certainly the largest
      absolute revenue contributor, though the mix between PAYG developer revenue and enterprise contracts is not
      publicly disclosed. Deepgram's OfOne QSR vertical (restaurant drive-thru voice ordering) likely operates
      under a revenue-share or per-location subscription model, adding a vertical SaaS layer to the API business.

      The AWS Strategic Collaboration Agreement (SCA, August 2025) and IBM watsonx Orchestrate partnership
      (February 2026) add a co-sell channel that may carry different economics — likely embedded pricing at
      partner-negotiated rates rather than public API PAYG rates — shifting margin dynamics. Twilio's participation
      as a strategic investor in the Series C hints at a deeper commercial integration that could create a
      distribution-linked revenue stream.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
      - FI002

  - id: traction-and-growth
    title: Public Traction Metrics and Financial Scale
    body: >
      Deepgram closed 2024 cash-flow positive — a notable operational milestone for a Series B-stage company
      in an AI infrastructure sector known for heavy compute spending. As of January 2025, Deepgram had 400+
      enterprise customers and 200,000+ active developers building on the platform. Usage growth was 3.3×
      annualized over the prior four years. Cumulative platform metrics as of early 2025 included more than
      50,000 years of audio processed and over one trillion words transcribed, both materially larger than
      comparable disclosures from pure-play peers at equivalent funding stages.

      No ARR or revenue figure has been publicly disclosed. Based on public pricing and traction data, a
      back-of-envelope estimate of ARR would require assumptions about ARPU per developer (likely $50–$500/yr
      PAYG) and enterprise deal sizes (likely $100K–$1M+ per enterprise per year). With 400+ enterprise customers
      at a blended ACV of $200K (conservative estimate), the enterprise revenue alone would approximate $80M
      ARR; developer PAYG revenue on top of that likely adds $10–$30M ARR depending on usage concentration.
      These are estimates only and not derived from undisclosed financials.

      The Series C term sheet and press release note the round will fund the OfOne acquisition integration, a
      new Voice AI Collaboration Hub in San Francisco, an expanded patent portfolio, and the "Powered by Deepgram"
      partner program. These are growth investments, not turnaround spending, consistent with the cash-flow
      positive baseline.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
    figureRefs:
      - FI003

  - id: capital-structure
    title: Capital Adequacy, Cost Structure, and Financial Verdict
    body: >
      Deepgram's cumulative disclosed funding is $215M+ across all rounds, with $130M raised in January 2026.
      As a cash-flow positive company entering 2025, the $130M Series C is primarily a growth capital raise rather
      than a survival lifeline, which changes the burn-rate assumption materially. Post-Series C, with $130M
      entering a cash-flow-positive company, the effective runway is likely 4+ years at current scale even without
      revenue growth, though the company's stated intention to accelerate growth investments (partner program,
      acquisition integration, voice AI hub) implies elevated near-term operating expenses.

      Cost structure for a voice AI API company is primarily: (1) compute/inference costs (GPU clusters for model
      serving — high capex or cloud COGS); (2) R&D (model training, research team); (3) sales and marketing (PLG +
      enterprise direct sales); (4) G&A. Deepgram's self-hosted and on-premises deployment option reduces
      Deepgram's own serving costs for on-prem customers (shifting costs to the customer) while retaining
      licensing revenue. Gross margin for cloud API-delivered AI infrastructure typically runs 50–70% for
      scaled operators, though early or growth-stage players often run lower due to GPU over-provisioning.
      Deepgram has not disclosed gross margin. No public debt or project finance obligations are known.

      Financial verdict: Deepgram's public financial picture is consistent with a Series B/C-stage API platform
      with genuine product-market fit (cash-flow positive, usage growth, enterprise adoption). The primary
      underwriting risks are undisclosed gross margin (compute cost exposure), enterprise contract churn rate,
      and net revenue retention — none of which are publicly available. These constitute actionable due diligence
      requests for the next phase.
    claimRefs:
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
    tableRefs:
      - TI004
      - TI005
    figureRefs:
      - FI004

