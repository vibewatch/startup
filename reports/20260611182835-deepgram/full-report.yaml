  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Deepgram lands through developers and reference builds, then expands through enterprise controls and partner
      channels.
    data:
      items:
        - label: 'Stage 1: Discovery'
          detail: Developer or product team finds Deepgram through docs, free credit, case studies, or partner ecosystems.
        - label: 'Stage 2: Prototype'
          detail: Team tests STT/TTS with a sample app, Twilio build, or Amazon Connect configuration.
        - label: 'Stage 3: Embedded workflow'
          detail: Deepgram becomes the transcription or voice layer inside an ISV or enterprise workflow.
        - label: 'Stage 4: Security / compliance fit'
          detail: >-
            Buyer chooses cloud, dedicated, or self-hosted path and validates privacy, retention, and procurement
            controls.
        - label: 'Stage 5: Partner-assisted procurement'
          detail: AWS, IBM, or telephony partners help move the account into broader enterprise buying processes.
        - label: 'Stage 6: Platform expansion'
          detail: Account grows from transcription into analytics, TTS, or full Voice Agent API orchestration.
