      - number: '3.2'
        title: Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              AWS Transcribe is priced at $0.024/min for standard and $0.015/min for batch, with HIPAA eligibility and
              native AWS ecosystem integration. It is the default choice for AWS-committed enterprises but lags on
              real-time accuracy and latency relative to Deepgram in benchmark tests. Google Cloud Speech-to-Text (Chirp
              3) supports 125+ languages with medical and phone call variants, priced at $16 per 1,000 minutes for
              standard. Azure Speech supports 100+ languages with Custom Speech fine-tuning at $1/hour standard.
              AssemblyAI Universal-2 is priced at $0.15/hr and Universal-3 Pro at $0.21/hr with exceptional multilingual
              accuracy and built-in transcript intelligence. Speechmatics starts at $0.24/hr for 50 concurrent sessions
              with on-premises options and 56+ languages. Rev.ai offers a pay-as-you-go model with a free 5-hour
              evaluation tier. OpenAI Whisper is open-source and self-hosted; GPT-Realtime-2 is $32/1M audio input
              tokens for the premium real-time API.

              ElevenLabs Scribe v2 Realtime delivers ~150ms latency across 30 languages at $0.22–$0.48/hour per
              FutureAGI benchmarks, currently leading multilingual real-time STT. This is Deepgram's most direct
              competitive threat in the international expansion narrative. OpenAI's GPT-Realtime-Whisper offers
              streaming at $0.034/min, providing an OpenAI-native alternative to Deepgram for voice agent builders
              already using GPT models.
