      - number: '5.3'
        title: Deployment, Integration, Compliance, and Roadmap
        blocks:
          - type: paragraph
            body: >
              Deepgram offers three deployment modes: (1) Cloud API — managed SaaS via deepgram.com APIs with WebSocket
              and REST endpoints; (2) Self-hosted — Docker/Kubernetes container deployment in customer AWS, GCP, or
              Azure environments; (3) On-premises — full air-gap capable deployment in customer data centers with no
              external API calls. The self-hosted and on-premises models have full API parity with the cloud offering,
              enabling regulated enterprises to migrate from cloud to on-prem without SDK changes.

              Integration surface includes: REST API (batch transcription), WebSocket API (streaming STT and Voice
              Agent), SDKs (Python, JavaScript/TypeScript, Go, .NET, Ruby, PHP), CLI, and an MCP Server for AI coding
              tools. Status monitoring is available at status.deepgram.com; the publicly disclosed historical uptime
              shows two incidents in 2024 with sub-4-hour resolution. HIPAA Business Associate Agreements are available
              for all tiers. The pricing page states HIPAA compliance as a feature of all paid plans. Deepgram's data
              privacy policy supports zero-retention mode (audio not stored post-transcription) for sensitive workloads.

              Roadmap indicators from blog posts and product announcements suggest: multilingual Flux model (Flux
              Multilingual announced in June 2026), expanding domain-specific Nova-3 models, expanded Saga OS voice
              agent operating system capabilities, and OfOne restaurant AI integration. The IBM watsonx and AWS SCA
              partnerships imply co-development of voice agent use cases for enterprise customers, which may accelerate
