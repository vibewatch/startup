      - number: '5.2'
        title: Technical Architecture and Platform Components
        blocks:
          - type: paragraph
            body: >
              Deepgram's core technology is an end-to-end (E2E) deep learning architecture for automatic speech
              recognition (ASR), contrasting with traditional pipeline ASR (acoustic model + language model + decoder).
              The E2E approach trains a single neural network to map raw audio waveforms directly to text, enabling both
              higher accuracy and hardware-efficient inference. This architecture is protected by two US patents: US
              12,380,880 (end-to-end ASR with transformer architecture) and US 12,334,075 (hardware-efficient ASR). The
              patents describe systems that achieve competitive WER with significantly lower compute requirements per
              inference minute, which is the basis for Deepgram's pricing advantage versus hyperscalers.

              The Nova-3 model (released February 2025) is optimized for batch and streaming STT across 9 audio domains
              and 45+ languages, with domain-specific models (medical, finance, legal, automotive, conversational). Flux
              is a purpose-built conversational speech recognition model optimized for end-of-speech (EOS) detection in
              real-time agent contexts, achieving sub-300ms latency from speech end to transcript delivery — critical
              for voice agent responsiveness. Aura-2 is Deepgram's second-generation neural TTS model, delivering
              low-latency, natural-sounding voice synthesis for agent responses. The Voice Agent API (GA June 2025)
              abstracts all three models plus LLM orchestration into a single WebSocket-based API, eliminating the
              latency compounding of multi-hop STT→LLM→TTS stacks.

              Deepgram's 3-factor automated domain adaptation allows enterprise customers to customize models for
              proprietary vocabulary through a semi-automated fine-tuning pipeline. Customer audio corpora can be
              submitted for domain adaptation without manual model architecture changes. This is the primary mechanism
              for the "data flywheel" moat — customers who fine-tune their models on proprietary vertical data (medical,
              legal, QSR) accumulate switching costs in the form of adapted model weights.
