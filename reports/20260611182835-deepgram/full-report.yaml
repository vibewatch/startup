              Deepgram's cumulative disclosed funding is $215M+ across all rounds, with $130M raised in January 2026. As
              a cash-flow positive company entering 2025, the $130M Series C is primarily a growth capital raise rather
              than a survival lifeline, which changes the burn-rate assumption materially. Post-Series C, with $130M
              entering a cash-flow-positive company, the effective runway is likely 4+ years at current scale even
              without revenue growth, though the company's stated intention to accelerate growth investments (partner
              program, acquisition integration, voice AI hub) implies elevated near-term operating expenses.

              Cost structure for a voice AI API company is primarily: (1) compute/inference costs (GPU clusters for
              model serving — high capex or cloud COGS); (2) R&D (model training, research team); (3) sales and
              marketing (PLG + enterprise direct sales); (4) G&A. Deepgram's self-hosted and on-premises deployment
              option reduces Deepgram's own serving costs for on-prem customers (shifting costs to the customer) while
              retaining licensing revenue. Gross margin for cloud API-delivered AI infrastructure typically runs 50–70%
              for scaled operators, though early or growth-stage players often run lower due to GPU over-provisioning.
              Deepgram has not disclosed gross margin. No public debt or project finance obligations are known.

              Financial verdict: Deepgram's public financial picture is consistent with a Series B/C-stage API platform
              with genuine product-market fit (cash-flow positive, usage growth, enterprise adoption). The primary
              underwriting risks are undisclosed gross margin (compute cost exposure), enterprise contract churn rate,
