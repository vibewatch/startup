          overstates commercial conversion.
      - - Current valuation anchor
        - $1.3B Series C valuation in January 2026
        - Use this as the reference price; do not replace it with invented fair-value precision.
      - - Valuation stance
        - Plausible but not clearly cheap
        - The mark can fit a good outcome, but public evidence does not yet show a clear bargain.
      - - Upgrade condition
        - Verified ARR, gross margin, and retention support the implied multiple
        - A move toward buy requires private financial evidence, not just more product marketing or category enthusiasm.
      - - Likely exit path
        - Later private round or strategic optionality before IPO-style readiness
        - Public peers disclose far more financial detail than Deepgram currently does.
    notes: >-
      This table is explicitly price-sensitive: it evaluates the investability of the current $1.3B mark, not the
      general quality of the company.
