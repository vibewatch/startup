      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Deepgram's buyer landscape separates into three tiers. First, the developer/startup tier (200,000+
              developers on the free plan or pay-as-you-go): these users are typically technical decision-makers at
              small teams who evaluate APIs through documentation, sandbox, and price-per-minute benchmarks. Budget
              ownership here sits with engineering or an individual founder. Second, the enterprise tier (400–450
              organizations): buyers are typically VPs of Engineering, CTOs, or IT procurement leads at mid-market to
              Fortune 500 companies. Purchase is through annual enterprise contracts with negotiated volume pricing.
              Verticals include contact centers, healthcare, financial services, restaurant chains (post-OfOne
              acquisition), and government/intelligence (via In-Q-Tel signal). Third, the platform/ISV tier: companies
              like Vapi, Kore.ai, and Granola that embed Deepgram as an infrastructure component and resell it as part
              of their own product. This tier is high-volume, relatively price-sensitive, and drives a disproportionate
              share of API call volume.

              The adoption path for enterprise buyers follows a developer-led PLG motion: a developer evaluates the API
              on the free plan, builds a prototype, champions procurement to IT, and converts to an enterprise contract.
              This bottom-up expansion is structurally similar to Twilio, Stripe, and other developer infrastructure
              companies. Payer segmentation aligns with size: developers pay credit card; enterprises pay invoiced
              annual; ISVs negotiate volume discounts.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
