companyProfile:
  summary: >-
    Deepgram is a San Francisco-based voice AI infrastructure company founded in 2015 by Scott Stephenson, Noah Shutty,
    and Adam Sypniewski. The company built its speech stack around proprietary end-to-end deep learning rather than
    wrapping third-party open-source models, and now sells a full API-layer platform spanning speech-to-text,
    text-to-speech, audio intelligence, and real-time voice-agent orchestration. Public evidence shows meaningful
    commercial traction: 400+ enterprise customers, 200,000+ developers, over 1,300 organizations building on Deepgram
    APIs, and strategic channels through AWS, IBM, and Twilio. Deepgram’s January 2026 Series C valued the company at
    $1.3 billion and funded further product expansion, the OfOne restaurant acquisition, and channel buildout. The main
    underwriting gap is not whether the product is real; it is whether undisclosed ARR, gross margin, and retention
    justify the current mark.
