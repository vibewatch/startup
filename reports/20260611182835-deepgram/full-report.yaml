        - id: n3
          label: Named production proof
          detail: NASA, UpdateAI, and Nytro.AI provide real workflow evidence beyond logos.
        - id: n4
          label: Procurement channel
          detail: AWS commit drawdown and IBM partnership give enterprise buying paths.
        - id: n5
          label: Deployment choice
          detail: Cloud, dedicated, or self-hosted models support different compliance needs.
        - id: n6
          label: Platform expansion
          detail: Accounts can add analytics, TTS, and Voice Agent API after the first STT use case.
