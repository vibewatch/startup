  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Map
        blocks:
          - type: paragraph
            body: >-
              Deepgram’s top risks are concentrated less in a single known blow-up and more in the combination of
              regulated-data exposure, platform dependency, and execution breadth. The most material legal risk is not
              an evidenced Deepgram lawsuit in the reviewed record; it is the fact that Illinois BIPA explicitly treats
              voiceprints as biometric identifiers and that current legal commentary says AI note-takers, speaker
              attribution, and archived transcripts are exactly the kinds of workflows now drawing class-action
              attention. Because Deepgram sells transcription, voice-agent, and healthcare workflows where speaker
              identity and retention matter, the company’s risk profile is sensitive to whether customer implementations
              collect or infer voiceprint-like data without airtight notice, consent, retention, and deletion controls.


              The second-ranked risk is healthcare and security-control execution. Deepgram presents credible
              mitigations — SOC 2, HIPAA posture, BAAs on request, RBAC, backups, and incident response — but HHS’s
              proposed HIPAA Security Rule would raise the operating bar for business associates in ways that are more
              prescriptive, more testable, and more document-heavy than generic trust-language alone. Third comes
              dependency risk: AWS shows up repeatedly across procurement, deployment, and managed model paths; IBM is a
              new channel amplifier; and reference voice-agent stacks can depend on multiple external vendors in one
              loop. Fourth is competitive and economic pressure from open-source speech models and hyperscalers. Fifth
              is execution risk from trying to scale across STT, TTS, voice agents, healthcare, and channel motion
              before public disclosure depth catches up. The result is a risk stack that is real, ranked, and
              monitorable, but not presently anchored on a documented Deepgram-specific case event.
