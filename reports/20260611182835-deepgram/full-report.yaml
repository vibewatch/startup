              - CM021
              - CM022
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Voice Agent API Shifts Deepgram from Commodity to Platform
            body: >
              The launch of Voice Agent API at $4.50/hr positions Deepgram above the commodity STT/TTS layer and into
              the platform-orchestration tier. If agent API adoption grows faster than raw STT, Deepgram can achieve
              higher ACV, better retention, and structural insulation from open-source displacement—the key strategic
              move in this market.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
          - type: callout
            title: Hyperscaler Commoditization Is the Primary Market Risk
            body: >
              AWS, Google, and Azure collectively have the capital, distribution, and cloud-bundling leverage to
              undercut Deepgram's pricing and default customers into their own STT products. This is the primary
              structural threat to Deepgram's market position and is partially mitigated by accuracy differentiation and
              the AWS SCA.
            calloutType: risk
            claimRefs:
              - CM018
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The competitive landscape for voice AI APIs can be organized into four tiers. Tier 1 (hyperscalers): AWS
              Transcribe, Google Cloud Speech-to-Text (Chirp 3), and Azure Speech Services are bundled with their
              respective cloud ecosystems. Their primary advantage is seamless IAM, billing integration, compliance
              certifications, and near-zero perceived marginal cost for existing cloud-native customers. They compete on
              convenience and distribution, not technical leadership. Tier 2 (pure-play API vendors): AssemblyAI,
              Speechmatics, ElevenLabs (Scribe), and Rev.ai are developer-focused competitors. AssemblyAI leads in
              transcript intelligence (sentiment, topics, entity extraction); Speechmatics leads in on-premises
              regulated-industry deployments (55+ languages); ElevenLabs Scribe v2 leads in multilingual real-time
              accuracy. Tier 3 (full-stack LLM platforms): OpenAI's GPT-Realtime API ($32/1M tokens input audio) bundles
              STT with LLM reasoning, posing a competitive threat for voice agent builders who want a single provider.
              Tier 4 (open source): OpenAI Whisper and NVIDIA Canary Qwen 2.5B are free self-hostable models that
              compete for batch, non-latency-critical workloads.

              Deepgram's clearest competitive advantage is in real-time voice agent infrastructure: sub-300ms latency
              with Flux for end-of-speech detection, Nova-3 for highest batch WER (5.26%), and a unified Voice Agent API
              that eliminates the STT+TTS+LLM stitching burden. No competitor as of May 2026 matches Deepgram's
              combination of accuracy, latency, and unified orchestration for real-time agentic workloads.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
