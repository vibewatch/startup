              support, on-premises deployment options, and SLA commitments. Revenue from the enterprise tier is almost
              certainly the largest absolute revenue contributor, though the mix between PAYG developer revenue and
              enterprise contracts is not publicly disclosed. Deepgram's OfOne QSR vertical (restaurant drive-thru voice
              ordering) likely operates under a revenue-share or per-location subscription model, adding a vertical SaaS
