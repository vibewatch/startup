      - number: '8.4'
        title: Thesis-breaks, exit readiness, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The remaining work is straightforward and consequential. A buyer of this round price needs verified ARR by
              segment, gross margin, retention, customer concentration, and the actual Series C preference stack.
              Without those files, the anti-thesis remains too powerful: a company can be cash-flow positive,
              technically credible, and strategically relevant while still leaving new money with limited upside at the
              entry price. The compliance backdrop is also worth pricing in. Goodwin's 2026 note on AI transcription
              tools highlights BIPA, wiretap, retention, and privilege risks that can slow enterprise adoption or
              increase governance cost if vendors and customers do not handle consent and storage properly. That does
              not break the Deepgram story, but it does raise the diligence threshold. Exit readiness looks more like
              another private round or strategic optionality than a near-term IPO, because public peers disclose
              substantially more operating detail than Deepgram does today. Until those data gaps close, the right
              posture is to monitor specific thesis-break triggers and keep the recommendation at track.
            claimRefs:
