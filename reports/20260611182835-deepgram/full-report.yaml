      - CR022
      - CR023
      - CR025
      - CR027
      - CR041
      - CR042
  - id: FR004
    title: Residual exposure by risk cluster
    type: bar
    layout: wide
    summary: >-
      Relative residual exposure across the main Deepgram underwriting risk clusters after considering current public
      mitigations.
    data:
      items:
        - label: Privacy / biometric
          value: 9
          detail: BIPA, consent, retention, and voiceprint exposure remain the highest residual cluster.
        - label: Security / healthcare compliance
          value: 8
          detail: HIPAA, auditability, and control-documentation depth remain material.
        - label: Partner / platform dependency
          value: 7
          detail: AWS, IBM, telephony, and managed-model routing add coupling risk.
        - label: Reliability / scale
          value: 6
          detail: Rate limits, hosted-path constraints, and partial regionality raise execution work.
        - label: Pricing / architecture competition
          value: 8
          detail: Open-source and hyperscaler offerings can compress price and control narratives.
    approximationNotes: >-
      Scores are analyst synthesis on a 1-10 residual-exposure scale derived from cited sources; they are not
      company-reported metrics.
    claimRefs:
      - CR040
      - CR044
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      A real financing anchor and strategic proof support interest, but missing financial denominator data stops the
      call at track.
    data:
      nodes:
        - id: A
          label: $1.3B Series C
          detail: January 2026 financing created a real valuation anchor.
          tone: neutral
        - id: B
          label: Cash-flow positive claim
          detail: Management said Deepgram was cash-flow positive entering 2025.
          tone: positive
        - id: C
          label: Traction signals
          detail: 1,300+ organizations, 200,000+ developers, and 400+ enterprise customers indicate real adoption.
          tone: positive
        - id: D
          label: Large market backdrop
          detail: Voice AI categories are growing quickly across speech APIs and conversational AI.
          tone: positive
        - id: E
          label: Comparable support
          detail: Peers show the category can sustain billion-dollar outcomes.
          tone: neutral
        - id: F
          label: Hidden denominator
          detail: ARR, gross margin, NRR, and financing terms are not public.
          tone: risk
        - id: G
          label: Track
          detail: The mark looks plausible, but not clearly cheap enough for a buy call.
          tone: risk
      edges:
        - from: A
          to: B
          label: anchors
        - from: B
          to: C
          label: supports
        - from: C
          to: D
          label: fits
        - from: D
          to: E
          label: frames
        - from: E
          to: F
          label: still requires
        - from: F
          to: G
          label: therefore
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV010
      - CV020
      - CV025
      - CV041
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The same $1.3B valuation looks stretched or reasonable depending on what ARR denominator diligence uncovers.
    data:
      items:
        - label: $100M ARR
          value: 13
          detail: Implied ARR multiple if Deepgram is only at low-nine-figure scale.
          tone: risk
        - label: $150M ARR
          value: 8.7
          detail: Still premium for a private company with undisclosed margins and retention.
          tone: risk
        - label: $200M ARR
          value: 6.5
          detail: Closer to a defensible high-growth software multiple.
          tone: neutral
        - label: $250M ARR
          value: 5.2
          detail: Easier to support if cash-flow positivity and partner leverage are durable.
          tone: positive
        - label: $300M ARR
          value: 4.3
          detail: Would make the current mark look far more comfortable.
          tone: positive
    approximationNotes: Values are simple implied valuation-to-ARR math using the current $1.3B mark, not disclosed Deepgram ARR.
    claimRefs:
      - CV026
      - CV027
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Current valuation sits inside the base case, but the evidence gap prevents a stronger recommendation.
    data:
      items:
        - label: Bear fair value
          low: 0.9
          mid: 1.05
          high: 1.2
          displayValue: $0.9B-$1.2B
          detail: Lower ARR or weaker margins make the current mark look stretched.
          tone: risk
        - label: Base fair value
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: Current evidence supports plausibility, not deep discount.
          tone: neutral
        - label: Bull fair value
          low: 1.8
          mid: 2.2
          high: 2.6
          displayValue: $1.8B-$2.6B
          detail: Requires materially stronger private revenue and margin proof.
          tone: positive
        - label: Current reference mark
          low: 1.3
          mid: 1.3
          high: 1.3
          displayValue: $1.3B
          detail: January 2026 Series C reference price.
          tone: neutral
    approximationNotes: Ranges are scenario judgments anchored to public evidence and simple multiple sensitivity, not a full DCF.
    claimRefs:
      - CV001
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      The evidence package is strong enough to keep Deepgram live, but incomplete for conviction underwriting at the
      current price.
    data:
      items:
        - label: Latest valuation
          value: $1.3B
          detail: Fresh January 2026 financing anchor.
          tone: neutral
        - label: Total disclosed funding
          value: $215M+
          detail: Meaningful capital base with strategic investors in the latest round.
          tone: positive
        - label: Customer footprint
          value: 1,300+ orgs / 400+ enterprises
          detail: Shows broad commercial surface area, even if monetization is still undisclosed.
          tone: positive
        - label: Category growth
          value: 18%-20%+ CAGR
          detail: Independent market reports support a real secular tailwind.
          tone: positive
        - label: Comp anchor band
          value: $1.59B-$31.33B public caps
          detail: Public comps prove the category can command value but are imperfect analogs.
          tone: neutral
        - label: Disclosure quality
          value: Incomplete
          detail: ARR, gross margin, NRR, and financing terms remain private.
          tone: risk
        - label: Recommendation
          value: Track
          detail: Follow closely, but wait for denominator proof before underwriting upside.
          tone: risk
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV010
      - CV020
      - CV025
      - CV046
