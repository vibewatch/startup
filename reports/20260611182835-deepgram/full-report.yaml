chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Origin Story
        blocks:
          - type: paragraph
            body: >
              Deepgram, Inc. was incorporated and founded in 2015 by Scott Stephenson, Noah Shutty, and Adam
              Sypniewski—three physicists who were working on underground dark matter detection experiments when they
              discovered that the waveform analysis techniques used to process radioactive decay signals could be
              applied to speech audio. Working roughly two miles underground at a research facility in China, the
              co-founders built custom detectors, trained neural networks on analog waveforms using GPUs and FPGAs, and
              documented their work with audio recordings they wanted to search and analyze. Finding no adequate speech
              recognition API to serve that need, they built their own end-to-end deep learning solution and pivoted to
              commercializing it as Deepgram.

              Deepgram went through Y Combinator's Winter 2016 batch, which seeded its early developer community and
              provided initial enterprise introductions. The company is headquartered in San Francisco, California,
              operates as a remote-first organization distributed across 20+ US states and 5+ countries, and positions
              itself as a foundational AI company whose core mission is enabling human-machine interactions through
              voice. Its one-line business model is: API-first, usage-based access to proprietary real-time voice AI
              models (speech-to-text, text-to-speech, and voice agents) with cloud, self-hosted, and on-premises
              deployment options.
