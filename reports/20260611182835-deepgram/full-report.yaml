      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              CEO and Co-Founder Scott Stephenson holds a PhD in particle physics from the University of Michigan, where
              he conducted postdoctoral research on dark matter detectors before leaving to co-found Deepgram. He is the
              primary public voice and strategic decision-maker at the company. Co-Founder Noah Shutty and Co-Founder
              Adam Sypniewski both contributed to Deepgram's early deep-learning architecture; Sypniewski serves as CTO.
              The founding team's shared physics background is central to Deepgram's brand narrative and technical
              differentiation—end-to-end deep learning from first principles rather than rule-based or hybrid
              approaches.

              The board includes representation from lead investor AVP (General Partner Elizabeth de Saint-Aignan) and
              major returning investors Madrona and In-Q-Tel, among others. In-Q-Tel's participation since an earlier
              round signals government/intelligence community interest in Deepgram's transcription accuracy and
              on-premises deployment capability. Key-person dependence on Scott Stephenson is real: he is the sole named
              executive in all public announcements, press releases, and major partnership communications, and no named
              COO, CFO, or President has been publicly disclosed as of June 2026.
