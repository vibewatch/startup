  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price anchor and what public evidence does and does not prove
        blocks:
          - type: paragraph
            body: >-
              Deepgram does have a hard valuation datapoint: on 13 January 2026 the company announced a $130 million
              Series C at a $1.3 billion valuation, and multiple outlets repeated the same round size and valuation.
              That matters because it turns this chapter from a pure hypothetical into an assessment of whether the
              currently known price is supportable. The financing also included strategic names such as Twilio,
              ServiceNow Ventures, SAP, and Citi Ventures, which gives the round more signaling value than a purely
              financial syndicate. Management separately told TechCrunch that Deepgram was cash-flow positive in the
              prior year and did not need to raise defensively. Those are meaningful positives, especially for an AI
              infrastructure company that operates in a compute-intensive category. The problem is that the public
              record still stops short of the denominator investors need. Deepgram has disclosed adoption and usage
              signals, but it has not publicly disclosed ARR, gross margin, net revenue retention, or cap-table terms.
              That leaves the $1.3 billion mark plausible, but still under-explained in public.
            claimRefs:
