      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline matters more than category enthusiasm
            body: >-
              At $1.3B, Deepgram does not need to be a bad company to be a mediocre entry. The missing question is not
              whether voice AI is real; it is whether Deepgram's private revenue and margin profile justify paying this
              price today.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV025
              - CV041
              - CV046
          - type: callout
            title: Regulatory and privacy frictions are multiple risks, not just operating nuisances
            body: >-
              If consent, retention, biometric, or wiretap controls slow adoption in regulated accounts, the consequence
              is not merely operational complexity; it can compress the commercial velocity that the current valuation
              implicitly assumes.
            calloutType: risk
            claimRefs:
              - CV031
