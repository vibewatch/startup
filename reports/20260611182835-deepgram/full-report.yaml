  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Component
      - Description
      - Differentiator
    rows:
      - - E2E deep learning ASR core
        - Single neural network maps raw audio → text; no pipeline decomposition
        - Lower compute per inference minute vs. traditional pipeline ASR; enables Deepgram's pricing advantage
      - - Transformer architecture (Nova-3)
        - Transformer-based language model for context-aware STT
        - Patent US 12,380,880; enables domain adaptation without pipeline re-engineering
      - - Hardware-efficient inference
        - Proprietary latent-space compression for model serving
        - Patent US 12,334,075; enables competitive pricing and on-prem deployment on commodity hardware
      - - Flux EOS detection
        - Dedicated conversational speech model for end-of-speech detection
        - Sub-300ms latency for voice agents; not a general-purpose STT model
      - - 3-factor domain adaptation
        - Automated fine-tuning pipeline accepting customer audio corpora
        - No manual ML engineering required; creates customer-specific adapted models
      - - WebSocket streaming API
        - Low-latency bidirectional streaming for real-time transcription and TTS
        - Single persistent connection reduces round-trip latency vs. REST polling
      - - Aura-2 neural TTS
        - Low-latency neural text-to-speech for voice agent response synthesis
        - Integrated in Voice Agent API; eliminates TTS vendor stitching latency
    notes: >
      Patent details from Google Patents (US12380880, US12334075). Architecture descriptions based on company
      documentation and Deepgram developer docs. Latency figures from FutureAGI May 2026 benchmarks.
