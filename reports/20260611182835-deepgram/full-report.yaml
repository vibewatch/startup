      - number: '2.4'
        title: Growth Drivers, Constraints, and Moat Dynamics
        blocks:
          - type: paragraph
            body: >
              Deepgram's addressable market is expanding faster than the overall cloud software market, but three
              structural constraints limit capture rate. First, hyperscaler subsidized pricing: AWS Transcribe, Google
              Cloud Speech-to-Text, and Azure Speech are all natively embedded in their respective cloud ecosystems at
              prices Deepgram cannot sustainably undercut at scale. Customers with AWS-native stacks may prefer
              Transcribe despite lower accuracy to simplify billing, compliance, and vendor management. Second,
              open-source displacement: Whisper and NVIDIA Canary Qwen 2.5B provide adequate accuracy (5.63% WER) for
              batch non-real-time use cases at zero API cost. Deepgram's moat in this layer is only latency and
              fine-tuning speed, which matter intensely for real-time voice agents but not for meeting transcription.
              Third, multilingual gaps: for non-English markets requiring real-time transcription, ElevenLabs Scribe v2
              currently leads benchmarks, which is a structural risk as Deepgram expands internationally.

              Growth tailwinds include: (1) the Voice Agent API as a higher-value, stickier product than raw STT; (2)
              the OfOne acquisition opening a QSR vertical with high containment rates; (3) IBM and AWS as distribution
              channels to regulated enterprise buyers who would not have self-sourced Deepgram; and (4) the agentic AI
              wave driving exponential call volume as businesses replace human agents with AI ones.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
          - type: table
            tableRef: TM004
            claimRefs:
