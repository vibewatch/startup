  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Segments
        blocks:
          - type: paragraph
            body: >
              Deepgram's served market is the B2B API market for voice AI infrastructure, specifically real-time
              speech-to-text (STT), text-to-speech (TTS), and voice agent orchestration delivered as developer APIs and
              enterprise SDKs. This sits within the broader voice and speech recognition software market, which also
              includes device-embedded consumer assistants (Siri, Alexa, Google Assistant), proprietary enterprise
              telephony (Cisco, Genesys), and open-source self-hosted models (Whisper, NVIDIA Canary). Deepgram's API
              business excludes the consumer assistant layer and on-device hardware segment, as well as legacy
              on-premises telephony platforms.

              The market is segmented by buyer type (enterprise vs. developer/SMB), deployment model (cloud API vs.
              self-hosted), use case (real-time transcription, contact center, voice agents, meetings, accessibility),
              and geography (North America, APAC, EMEA). North America was the largest region in 2025, representing
              approximately 34–35% of the broader market. APAC is the fastest-growing segment. Deepgram's core buyer is
              the developer or technical lead at a company building a voice-enabled application (developer tier) or the
              enterprise technology executive procuring voice AI infrastructure for contact center, healthcare, or
              compliance workflows (enterprise tier).
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing and Growth Drivers
        blocks:
          - type: paragraph
            body: >
              Three independent sizing lenses converge on a large and rapidly growing market. The Business Research
              Company estimates the global speech-to-text API market at $4.55 billion in 2025, growing at 18.2% CAGR to
              $10.46 billion by 2030. Coherent Market Insights estimates the broader voice and speech recognition market
              (including device-embedded consumer assistants) at $26.5 billion in 2026, growing at 23.6% CAGR to $116.9
              billion by 2033. Deepgram's own CEO cited a $50 billion addressable market for voice AI agents
              specifically in demanding environments with exceptional accuracy and lowest-latency
              requirements—Deepgram's stated target niche.

              Key growth drivers include: (1) enterprise contact center migration to cloud and AI automation, reducing
              cost-per-call; (2) the agentic AI wave requiring real-time, low-latency voice processing for AI phone
              agents; (3) proliferation of developer platforms embedding voice-first UX; (4) healthcare and financial
              services compliance use cases requiring accurate transcription; and (5) multilingual enterprise expansion
              creating demand for 45+ language coverage. Growth constraints include hyperscaler commoditization of STT
              at zero or near-zero marginal cost as a bundled feature, developer churn to open-source Whisper for
              non-latency-critical workloads, and data-sovereignty regulation limiting cross-border processing.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
