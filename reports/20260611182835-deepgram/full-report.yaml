  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How privacy, security, partner, and pricing risks propagate into adoption, margin, and valuation outcomes.
    data:
      nodes:
        - id: bipa
          label: BIPA / biometric consent risk
          detail: Illinois voiceprint and meeting-bot exposure can stall deployments or add indemnity demands.
          type: risk
        - id: hipaa
          label: HIPAA rule tightening
          detail: More prescriptive business-associate controls increase compliance cost and sales friction.
          type: risk
        - id: dep
          label: Partner and managed-provider dependency
          detail: AWS, IBM, Twilio, OpenAI, and marketplace paths improve reach but add coupling.
          type: risk
        - id: price
          label: Open-source and hyperscaler pressure
          detail: Whisper, NVIDIA, and hyperscalers can reset price and control expectations.
          type: risk
        - id: adoption
          label: Customer adoption and expansion
          detail: Regulated buyers and architects may delay or narrow rollout.
          type: outcome
        - id: margin
          label: Gross margin and support load
          detail: Custom deployment, compliance work, and price response can raise delivery cost.
          type: outcome
        - id: retention
          label: Retention and partner durability
          detail: Usage-based contracts and partner chains amplify dissatisfaction risk.
          type: outcome
        - id: valuation
          label: Valuation support
          detail: Residual risk and disclosure gaps compress confidence in durable enterprise quality.
          type: outcome
      edges:
        - from: bipa
          to: adoption
        - from: hipaa
          to: adoption
        - from: hipaa
          to: margin
        - from: dep
          to: adoption
        - from: dep
          to: retention
        - from: price
          to: margin
        - from: price
          to: valuation
        - from: adoption
          to: valuation
        - from: margin
          to: valuation
        - from: retention
          to: valuation
    claimRefs:
      - CR012
      - CR025
      - CR028
      - CR032
      - CR035
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Visible platform dependencies underneath Deepgram’s regulated and enterprise voice-AI motion.
    data:
      nodes:
        - id: aws
          label: AWS ecosystem
          detail: Marketplace, Connect, SageMaker, Bedrock, PrivateLink, and GPU instances are prominent paths.
          type: dependency
        - id: ibm
          label: IBM watsonx
          detail: IBM is a channel and embedded distribution path.
          type: dependency
        - id: telephony
          label: Telephony / comms partners
          detail: Reference stacks can run through Twilio and other external communications layers.
          type: dependency
        - id: openai
          label: Managed LLM providers
          detail: OpenAI is explicitly supported in EU regional routing today; others lag.
          type: dependency
        - id: hosted
