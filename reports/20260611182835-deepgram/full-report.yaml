  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Financing quality
        - A real 2026 round set a fresh $1.3B anchor with strategic investors in the syndicate.
        - A fresh price does not prove a good entry price when public financial disclosure is still thin.
        - Board-level revenue and gross-margin files would clarify whether the round was fair or generous.
      - - Operational quality
        - Management said the company was cash-flow positive entering 2025.
        - Cash-flow positivity alone does not reveal ARR scale, margin durability, or retention quality.
        - Verified cash-flow bridge and unit economics would strengthen underwriting.
      - - Commercial traction
        - >-
          Deepgram has disclosed 1,300+ organizations on its APIs plus 200,000+ developers and 400+ enterprise
          customers.
        - Those metrics show reach, but they do not reveal how much revenue is monetized per customer cohort.
        - Segmented ARR and enterprise ACV data would convert activity into value.
      - - Category momentum
        - Independent market reports and private peers show voice AI remains a well-funded growth category.
        - Category growth is shared by multiple competitors and does not guarantee Deepgram captures premium economics.
        - >-
          Net retention and partner-channel conversion would show whether Deepgram is winning economically, not just
          technically.
      - - Competitive posture
        - Deepgram argues it beats major rivals on latency, cost, and deployment flexibility.
        - Those claims come from Deepgram marketing pages and are not sufficient on their own to justify the valuation.
        - Independent benchmarks tied to commercial conversion would make the edge more investable.
      - - Recommendation
        - The company is credible enough to follow closely at the current stage.
        - The public record still leaves too much uncertainty for a bullish underwriting call.
        - The recommendation moves only when private financial proof closes the denominator gap.
    notes: >-
      The anti-thesis is mainly about disclosure and entry price, not about whether Deepgram is a real company with real
      demand.
