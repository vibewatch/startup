  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR misses the hurdle
        - Verified ARR is materially below ~$150M.
        - The current mark starts to imply a stretched multiple for a still-private infrastructure company.
        - Re-cut toward the bear range or walk away from the round.
      - - Gross margin disappoints
        - Margins are materially lower than expected for a scaled API platform.
        - Cash-flow positivity becomes less durable and upside multiple support weakens.
        - Lower the fair range and demand stronger price protection.
      - - Retention is weak
        - NRR, gross retention, or enterprise renewal data show limited expansion durability.
        - The platform story loses quality even if customer counts look healthy.
        - Reduce conviction and treat traction metrics as noisier than they appear publicly.
      - - Preference stack is investor-unfriendly
        - Liquidation preferences, ratchets, or governance terms distort the headline valuation.
        - The nominal $1.3B mark overstates true new-money economics.
        - Pause, reprice, or demand a structured entry.
      - - Compliance friction rises
        - Privacy, biometric, or wiretap controls materially slow regulated-enterprise adoption.
        - Category growth does not translate cleanly into Deepgram revenue quality.
        - Cut bull-case weighting and reassess channel assumptions.
      - - Partner conversion stalls
        - Strategic partners do not produce measurable ARR leverage.
        - Distribution value remains a narrative rather than an earnings driver.
        - Keep the call at track even if technical benchmarks stay strong.
    notes: 'These are valuation triggers rather than generic risks: each one can directly invalidate the current entry price.'
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV047
      - CV049
      - CV051
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR and revenue bridge
        - Board-approved 2024-2026 ARR, recognized revenue, and segment mix.
        - This is the denominator that determines whether $1.3B is conservative, fair, or stretched.
        - CFO package, board deck, and monthly management reporting.
      - - Gross margin and inference cost
        - Gross margin by product, compute burden, hosting mix, and partner economics.
        - Cash-flow positivity is more durable if gross margins are structurally strong.
        - Finance and infrastructure review with cohort- or product-level cost detail.
      - - Retention and expansion
        - Gross retention, NRR, enterprise expansion, and churn by major cohort.
        - High customer counts are much more valuable when expansion and renewals are strong.
        - Revenue-operations dashboards and cohort analysis.
      - - Series C terms
        - Liquidation preferences, pro-rata rights, governance, and any side-letter protections.
        - Headline valuation can materially overstate effective economics for new investors.
        - Counsel review of financing docs and cap table.
      - - Concentration and channel mix
        - Top-customer, top-partner, and direct-versus-channel revenue concentration.
        - Strategic partner signaling is helpful only if it translates into diversified durable revenue.
        - Customer concentration analysis and partner pipeline review.
      - - Compliance controls
        - Consent flows, retention policy, biometric safeguards, and regulated-industry deployment controls.
        - Governance friction can slow enterprise scaling and reduce valuation support.
        - Legal, privacy, and product diligence aligned to deployment footprints.
    notes: >-
      These are the minimum diligence asks required to move the recommendation from track toward buy at the current
      price.
    claimRefs:
      - CV025
      - CV031
      - CV047
      - CV048
      - CV051
      - CV052
