      - number: '1.3'
        title: Funding History, Valuation, and Investor Base
        blocks:
          - type: paragraph
            body: >
              Deepgram has raised over $215 million in total funding across multiple rounds. The company went through Y
              Combinator (W2016), raised a seed round, then completed a $72 million Series B in 2022 at an undisclosed
              valuation. On January 13, 2026, Deepgram announced its $130 million Series C at a $1.3 billion
              valuation—achieving unicorn status—led by AVP, an independent global investment platform focused on
              high-growth technology companies in Europe and North America.

              The Series C attracted a notably broad and strategic investor base. All major existing investors rejoined,
              including Alkeon, In-Q-Tel, Madrona, Tiger, Wing, Y Combinator, and funds and accounts managed by
              BlackRock. New financial investors included Alumni Ventures and Princeville Capital. Strategic corporate
              investors included Twilio, ServiceNow Ventures, SAP, and Citi Ventures—all representing go-to-market and
              distribution leverage. Academic investors included the University of Michigan and Columbia University,
              joining earlier academic investors Stanford University. CEO Scott Stephenson stated the company was
              cashflow positive in 2024 and was not actively seeking capital when approached, but chose to raise to
              accelerate international expansion and product investment. The Series C also funded the acquisition of
              OfOne and the opening of a new Voice AI Collaboration Hub in San Francisco.
