  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >
              Deepgram positions itself as the real-time voice AI API infrastructure layer for developers and
              enterprises building voice-native applications. Its products integrate into three primary customer
              workflows: (1) Live conversation and voice agent workflow: developers embed the Voice Agent API to create
              low-latency conversational agents for customer service, sales, restaurant ordering, and support
              automation. The agent listens via the Flux STT model (optimized for end-of-speech detection at <300ms),
              processes the transcript via an integrated LLM (user-configurable), and responds via the Aura-2 TTS model,
              all within a single WebSocket API session without multi-vendor stitching. (2) Batch transcription and
              intelligence workflow: enterprises (legal, healthcare, media, compliance) send recorded audio to Nova-3
              STT via REST API for post-call analytics, subtitle generation, and medical documentation. Nova-3 supports
              speaker diarization, intelligent formatting, topic detection, and redaction. (3) On-premises
              regulated-enterprise workflow: government, defense, and financial services customers deploy Deepgram's
              STT/TTS models on their own infrastructure, with full API parity to the cloud offering and zero audio data
              leaving the network perimeter.

              Each of these workflows is served by distinct model SKUs with different pricing, latency profiles, and
              feature sets, giving enterprise buyers a clear upgrade path from developer experimentation to
              production-grade deployment. The $200 free developer credit and PAYG pricing minimize friction for new
              developer adoption via product-led growth.
            claimRefs:
