callouts:
  - calloutType: insight
    title: Voice Agent API Shifts Deepgram from Commodity to Platform
    body: >
      The launch of Voice Agent API at $4.50/hr positions Deepgram above the commodity STT/TTS layer and into the
      platform-orchestration tier. If agent API adoption grows faster than raw STT, Deepgram can achieve higher ACV,
      better retention, and structural insulation from open-source displacement—the key strategic move in this market.
    claimRefs:
      - CM009
      - CM010

  - calloutType: risk
    title: Hyperscaler Commoditization Is the Primary Market Risk
    body: >
      AWS, Google, and Azure collectively have the capital, distribution, and cloud-bundling leverage to undercut
      Deepgram's pricing and default customers into their own STT products. This is the primary structural threat
      to Deepgram's market position and is partially mitigated by accuracy differentiation and the AWS SCA.
    claimRefs:
      - CM018
      - CM019

