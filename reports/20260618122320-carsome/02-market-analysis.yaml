- id: market-drivers-headwinds
  title: Market Drivers and Headwinds
  body: 'The main tailwinds are affordability, urbanization, digitization, and financing formalization. When new-car prices,

    quotas, or fuel-policy changes squeeze budgets, used cars become the more accessible ownership path; Carsome''s own

    2025 commentary on Malaysia''s fuel-subsidy rationalization is consistent with that effect. Digital platforms also

    benefit from secular trust transfer: buyers increasingly value standardized inspection, warranty, and financing more

    than pure price discovery. But headwinds are real and market-specific. Thailand''s tight credit conditions and roughly

    30% loan approval rate can slow inventory turnover even when consumer demand exists. EV mix shift adds another layer

    of uncertainty. Singapore evidence shows used EVs can take far longer to resell and can depreciate much faster than

    internal-combustion vehicles, implying battery-health transparency and residual-value management will become more

    important as EV supply enters the regional secondary market. Finally, trust remains a live operating issue. Public

    disputes over reviews and consumer perception show that even formal players are still trying to repair a historically

    opaque category. Carsome is exposed to all of these forces, but it is better positioned than a pure listing site

    because its operating model captures value when compliance, inspection quality, and ancillary services matter.'
