callouts:
- calloutType: strength
  title: Large market, low formal concentration
  body: 'The organized used-car opportunity is still early. Even after years of platform investment, offline dealers hold most

    share and the top five digital players collectively control only a single-digit slice of the total market. That leaves

    room for Carsome to keep taking share by packaging trust, inspection, financing, and warranty into a repeatable

    operating system.'
  claimRefs:
  - CM011
  - CM012
  - CM014
  - CM021
- calloutType: risk
  title: EV residuals and Thai credit can both slow conversion
  body: 'Two near-term headwinds matter more than generic competition. First, used-EV price discovery is still immature, with

    Singapore evidence showing far steeper depreciation and much longer resale periods than ICE vehicles. Second, Thailand

    remains financing-constrained, so even willing buyers can fail to convert when loan approvals are scarce.'
  claimRefs:
  - CM039
  - CM040
  - CM042
- calloutType: insight
  title: Regulation is becoming a distribution moat
  body: 'Malaysia''s inspection liberalization, Singapore''s transparent COE and consumer-law regime, and Thailand and

    Indonesia''s rising fintech and platform-compliance requirements all point the same way: better-governed operators are

    being rewarded. Carsome is more likely to benefit from this shift than a pure listing marketplace because it already

    operates inside inspection, documentation, and ancillary-service workflows.'
  claimRefs:
  - CM025
  - CM026
  - CM028
  - CM035
  - CM038
