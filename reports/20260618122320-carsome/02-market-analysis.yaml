  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: regional-market-size
    missingEvidence: A single reconciled methodology that explains why public Southeast Asia used-car market estimates range from roughly USD 18 billion to more than USD 74 billion by 2026.
    whyItMatters: Valuation and market-share math can look radically different depending on which boundary and methodology is chosen.
    diligencePath: Ask management for the internal market-sizing model by country, channel, and monetization layer, then reconcile it against at least two external analyst definitions.
    relatedQuestionRefs:
    - QM003
    - QM026
  - type: private-evidence-only
    severity: material
    topic: carsome-share
    missingEvidence: Country-level Carsome share, digital transaction mix, financed take rate, and certified-vehicle attachment by Malaysia, Indonesia, Thailand, and Singapore.
    whyItMatters: Without country-level operating data, public sources cannot precisely quantify Carsome's current SOM or digital penetration by market.
    diligencePath: Request market-share, units-sold, gross-margin, and ancillary-attachment disclosures by country for the last 8 quarters.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM001
    - TM002
  - type: access-blocked
    severity: minor
    topic: regulatory-primary-sources
    missingEvidence: Fully accessible direct BNM and MAS fintech-policy pages, which returned minimal or maintenance content during fetch.
    whyItMatters: Secondary summaries can describe regulatory posture, but direct policy text is preferable when diligence turns to licensing or technology-risk obligations.
    diligencePath: Re-fetch the primary regulator pages manually or via PDF endpoints before relying on exact rule wording in investment memos.
    relatedQuestionRefs:
    - QM025
