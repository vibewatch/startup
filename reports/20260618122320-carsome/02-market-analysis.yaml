chapter:
  number: 2
  title: Market Analysis
  summary: Carsome operates in a large but still fragmented Southeast Asian used-car market where published TAM estimates vary widely by methodology. The durable investment point is less the headline market number and more the structural shift from informal, cash-led transactions toward organized, financed, and trust-heavy channels in Malaysia, Indonesia, Thailand, and Singapore. Carsome is positioned in that formalizing layer, but Thai credit stress, EV residual uncertainty, and incomplete public market-share data remain important diligence constraints.
sections:
- id: sea-market-overview-tam
  title: Southeast Asia Used Car Market Overview and TAM
  body: 'Carsome operates in a market that is both large and definition-sensitive. The broadest boundary is the Southeast

    Asian used-passenger-vehicle market across dealer, marketplace, auction, and private-sale channels, excluding new

    cars, motorcycles, and most adjacent service revenue. Within that boundary, published TAM estimates diverge sharply.

    Mordor Intelligence projects USD 74.33 billion in 2026 and USD 102.37 billion by 2031, while Credence Research and

    GMI publish materially lower ranges and MarkWide publishes a higher-growth path. The practical lesson is not to pick

    a single heroic number; it is to separate total regional TAM from Carsome''s serviceable four-country footprint and

    then from the smaller organized, digital, and financed subset that Carsome can realistically win. Using the more

    conservative country-lens anchored on Credence''s 2024 regional total and Indonesia''s explicit 38% share produces a

    directional four-country footprint of roughly USD 31.6 billion in 2024, rising into the mid-USD-30 billions by 2026.

    That approach is better suited for Carsome than a headline regional TAM because Carsome only operates in Malaysia,

    Indonesia, Thailand, and Singapore and monetizes quality assurance, inspection, financing, and trust rather than the

    entire informal market.'
  claimRefs:
