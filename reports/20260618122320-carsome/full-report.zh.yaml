      - number: '6.2'
        title: 客户牵引力与交易量指标
        blocks:
          - type: paragraph
            body: >-
              Carsome 公开披露的客户牵引指标足以证明其品类相关性，尽管还达不到上市公司同业披露的颗粒度。卖家端最清楚的里程碑，是公司在 2020 年庆祝第 100,000 位卖家； 这说明 C2B
              获取引擎在后来扭亏之前已跑出有意义的密度。更广义的交易爬坡也可信：Carsome 称 2022 年和 2023 年各卖出超过 150,000 辆车， 2024 年成立以来累计售出车辆突破 500,000 辆，仅
              2024 年二季度就交易约 35,000 辆。这些指标意味着 Carsome 已按区域规模运营， 而不是一个小众本地市场。


              iCar Asia 整合后，受众规模也明显扩大。Carsome 2023 年融资公告称，集团通过内容和媒体生态拥有超过 1,500 万月活用户；后续披露又称数字月活用户较 2022 年增长 20%， 超过
              1,800 万。这里的区别很关键：1,800 万不是交易客户数，但显示了一个大型、持续回访的发现漏斗。同时，Carsome 称其与 50 多个城市的 13,000 多家经销商合作，
              让批发侧的流动性深于纯分类信息模式。获客效率方面，公司披露截至 2024 年一季度 CAC 下降 37%，说明平台扩大时，生态交叉销售和品牌流量在改善需求质量， 而不是要求营销支出按比例上升。
