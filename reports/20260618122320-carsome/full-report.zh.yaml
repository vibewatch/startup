  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与市场进入
        blocks:
          - type: paragraph
            body: >-
              理解 Carsome 的客户基础，不能只看单一零售客群，而要看一个相互咬合的四边生态。供给端，最早的 C2B 卖家群体仍是底座： 消费者在线预约检测，把车开到检测中心，拿到车况报告，再选择现场报价，或让经销商通过
              Carsome 的批发渠道竞价。需求端， B2C 零售买家通过 Carsome Certified 进入，公司主打 360 度车辆展示、固定价格、试驾、融资支持和端到端文件办理。第三类是二手车经销商，
              他们既是批发拍卖里的流动性提供者，也是经销商融资客户。第四类是 CARSOME Capital 覆盖的融资客户，既包括零售借款人，也包括使用营运资金授信的经销商。


              这组分层很重要，因为 Carsome 的 go-to-market 不是单纯成交撮合。公司想把整个车主旅程变现：发现、检测、竞价、零售购买、融资、保险、 保养，以及之后的转售。收购 iCar Asia
              后，内容、研究、车源和交易层被接到一起，漏斗顶部更宽；MyGarage 和售后功能则把关系延伸到首次销售之后。
              公开材料反复把客户体验定义为信任问题，并用检测标准化、价格透明和集成服务来解决。这个定位有可信度，因为 Carsome 的产品页、公司时间线和融资材料都指向同一套模型：
              一个卖家获取引擎，先供给批发和零售市场，再靠附带金融产品和购后互动加深关系。
