  - id: TR004
    title: 关键人物与治理风险
    columns:
      - 风险因素
      - 细节
      - 影响
      - 依赖
      - 缓解措施
    rows:
      - - CEO / 创始人集中度
        - 在 Carsome 的公告、访谈和整合评论中，Eric Cheng 是最主要的公开高管声音。
        - 战略、文化和融资依赖集中在一位领导者身上。
        - 高
        - 尽调中测试董事会深度、授权运营者和继任计划。
      - - 公开继任可见度有限
        - 外部能看到组织图，但开放公开来源不容易看到详细管理层映射。
        - 外部投资者更难评估管理梯队强度，或压力下的连续性。
        - 中高
        - 要求提供当前组织图、业务单元负责人和紧急继任计划。
      - - 整合治理
        - iCar Asia、WapCar、Carlist.my、Carmudi 和 Cartimes 扩大了需要协调监督的系统和品牌数量。
        - 治理薄弱可能带来成本重复、客户体验不一致和事件解决变慢。
        - 高
        - 要求整合路线图、KPI 负责人和平台理顺里程碑。
      - - 披露治理
        - Carsome 的正面盈利叙事尚未配上达到申报级别的公开财务透明度。
        - 可能推高投资者折现率，并让债务或 IPO 准备更复杂。
        - 高
        - 要求经审计财务包、EBITDA 桥接，以及契约 / 流动性排期。
    notes: 治理风险上升，不是因为已证实发生崩坏，而是因为 Carsome 当前运营复杂度已经超过稀疏公开管理梯队披露所能充分解释的范围。
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR044
  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 服务质量恶化
        - 退款 SLA 违约或投诉强度上升
        - 退款经常超过公布时限，或卖家打款延迟反复出现
        - 暂停增长假设；升级运营尽调和营运资本复核。
      - - 披露质量没有改善
        - 调整后 EBITDA 到法定利润之间没有经审计桥表
        - 管理层仍无法提供现金流、收入确认口径和债务期限表细节
        - 维持估值折价，避免套用公开市场式可比公司。
      - - 受监管金融控制缺口
        - BNM / KAF / RMiT 控制缺陷、准备延迟或不利合规发现
        - 任何证据显示 Carsome 相邻的受监管活动缺乏成熟治理或供应商控制
        - 下调金融相邻业务上行空间，扩大法律尽调范围。
      - - 地域集中度恶化
        - Malaysia / Singapore 承担利润，而 Indonesia / Thailand 仍结构性疲弱
        - 核心市场之外连续两个期间走弱，且没有纠偏后的生产率提升
        - 下调区域扩张价值，把多国足迹视为复杂度，而不是护城河。
      - - EV 库存错定价
        - 二手 EV 周转时间和降价幅度明显超过 ICE 基准
        - EV 库存要多花数月才能出清，或电池标准争议上升
        - 收紧库存假设，并下调毛利预期。
      - - 竞争性流动性流失
        - Carro 或经销商渠道反复以更高出价 / 更快周转取胜
        - 卖家获取经济性恶化，或经销商参与度下降
        - 降低护城河信心，并压力测试 CAC / GPU 假设。
    notes: 这些是可监测的论点失效触发器，不是预测；每一项都用于在公开证据或尽调证据恶化时迫使投资人作出决定。
    claimRefs:
      - CR003
      - CR011
      - CR012
      - CR020
