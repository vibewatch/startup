          description: Carsome 检测车辆，生成车况报告，并建立报价或竞价路径
        - id: offer-bidding
          label: 报价或车商竞价
          description: 卖家直接接受报价，或让 13,000+ 车商网络竞价
        - id: refurbishment
          label: 翻新 / 认证
          description: 入选车辆进入 Carsome Certified Lab，完成翻新和信任包装
        - id: buyer-discovery
          label: 买家发现
          description: 零售买家浏览车源信息，可看到 360 度视图、检测报告和透明定价
        - id: test-drive-order
          label: 试驾 / 下单
          description: 买家在线或到展厅预约，支付订单费用，并确认购买意向
        - id: financing-paperwork
          label: 金融和文书
          description: Carsome 或 CARSOME Capital 处理贷款申请、所有权转移、保险和文件
        - id: delivery-aftercare
          label: 交付和售后
          description: 车辆交付或自提；保修、MyGarage、服务预约、估值和之后的再销售，让关系持续活跃
    claimRefs:
      - CU002
      - CU004
      - CU018
      - CU019
      - CU020
      - CU021
  - id: FU002
    title: 客户分群拆解
    type: bar
    summary: 按面向客户的分群估算收入结构，并以 Carsome 披露的 2022 年零售贡献 35%，以及管理层称批发交易仍主导交易毛利、附加变现正在扩张为锚。
    approximationNotes: 只有 35% 的零售份额有直接披露。批发与附加业务之间的剩余拆分，是分析师基于交易毛利评论和后续金融重点作出的综合判断，不是公司发布的分部 P&L。
    data:
      items:
        - label: B2B 批发车商
          value: 45
        - label: B2C 零售（Carsome Certified）
          value: 35
        - label: 金融 / 保险 / 售后
          value: 20
    claimRefs:
