      - number: '7.4'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              Carsome 的监管负担已从车辆过户合规，扩展到更高要求的金融服务和跨境治理界面。最重要的叠加层是 Bank Negara Malaysia。Carsome 是 KAF 牵头数字银行财团的一员，
              即便还没追问最终有多少金融活动会落入受监管实体，技术风险、韧性和董事会监督的门槛已经被抬高。2025 年 11 月 RMiT 修订尤其相关，
              因为围绕它的法律和技术评论强调更强的网络控制、供应商治理、欺诈管理、韧性指标，在某些情况下还扩大到非银行参与者。马来西亚的汽车交易规则也重要： 指定检测运营商必须满足资本、MySIKAP 集成和 ISO
              要求，所有权转移则要求生物识别验证和通过检测。马来西亚之外，Carsome 的跨境合规负担上升， 因为印度尼西亚把金融科技监管拆分在 Bank Indonesia 和 OJK
              之间，新加坡和泰国的消费者保护基线也不同。风险并不是今天存在某个已知执法行动； 风险在于，Carsome 在四个市场混合二手车交易、融资、数据和数字银行相邻业务时，合规复杂度会复合上升。
