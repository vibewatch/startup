      - number: '1.4'
        title: 运营规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              从运营看，Carsome 的公开披露指向有意义的区域规模，单位经济也在改善。公司称 2022 年和 2023 年各售出 150,000 辆车，2024 年累计售车突破 500,000 辆，仅 2Q2024
              就交易约 35,000 辆。 财务上，2024 年似乎是拐点。Carsome 报告成立以来首次全年盈利，收入约 $305M，调整后 EBITDA 为 $10.5M，GPU 增长 25%，CAC 下降
              37%。这一正向势头延续到 2025 年，管理层报告一季度调整后 EBITDA 为 $4.3M，全年为 $23M，同时毛利达到 $142M。 技术栈也变得更明确。独立报道将 2025 年 Google Cloud
              迁移与 BigQuery、Vertex AI 和 Looker 绑定，支撑 AI 定价、分析和联络中心自动化。因此，里程碑模式很一致：Carsome 从地理扩张和融资积累，转向流程工业化、盈利纪律和生态变现。
