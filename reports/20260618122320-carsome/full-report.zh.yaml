    title: 风险热力图
    type: matrix
    layout: wide
    summary: Carsome 剩余严重度最高的风险，集中在运营一致性、披露质量、竞争性流动性以及受监管金融邻近地带，而不是简单缺少需求。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 运营服务质量漂移
