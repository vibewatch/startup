        blocks:
          - type: paragraph
            body: >-
              本章最强的财务证据，是 Carsome 盈利能力的阶梯式改善。第一个运营盈利标记出现在 2023 年，首次季度 EBITDA 转正披露来自 1Q2024，FY2024 以 US$10.5M 调整后 EBITDA
              收官，FY2025 又翻倍以上至 US$23M。 公开披露反复把这一转向归因于单位经济，而不是单纯的头部销量。GPU 在 2023 年增长 48%，FY2024 增长 25%，1Q2025 同比增长
              24%，FY2025 全年增长 22%。管理层将改善归因于更强的车辆利润率、定价优化、附加服务变现提升，以及翻新和物流成本下降。 CAC 到 FY2024 下降
              37%，这一点重要，因为相对独立二手车经销商，Carsome 的综合媒体、零售和融资生态似乎降低了需求获取成本。因此，利润率故事是可信的：Carsome
              不再只靠车价差，最好的公开披露显示，一个生态正在尝试把规模转成更高的单车毛利。
