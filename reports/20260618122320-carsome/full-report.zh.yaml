      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景分析是合适框架，因为 Carsome 夹在一个旧私募标记和可能的未来上市之间。牛市情景要求 FY2026 EBITDA 再次约翻倍，附带业务组合继续扩大， Bursa
              或其他交易所因品类领导地位给予溢价，且没有新轮融资迫使价格重置。在这种情况下，US$2.5 billion 以上的 IPO 或战略结果是可能的。 基准情景假设 US$1.7 billion 标记大体维持；如果
              Carsome 连续拿出更多盈利季度，并让投资人愿意承销一个区域生态，而不仅是二手车交易商， 估值也许会小幅上探至 US$2.0
              billion。熊市情景更严厉但现实：如果公开市场可比仍低迷、私募投资人要求陈旧估值折扣，或 IPO 延后且增长放缓， Carsome 价值可能更接近 US$1.0 billion 至 US$1.4
              billion。关键洞察是，只要增长稳定，Carsome 按收入看并不明显高估； 但相对于当前 EBITDA 和披露质量，它仍显得有溢价。因此，基准情景贴着旧标记走，而不是假设估值干净上台阶。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV030
              - CV032
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV003
            claimRefs:
