  - id: FU004
    title: 客户证据矩阵
    type: matrix
    summary: 按变现深度、留存信号和当前风险，映射 Carsome 各主要客户群的公开证据质量。
    data:
      columns:
        - 证据质量
        - 变现深度
        - 留存信号
        - 主要风险
      rows:
        - label: 卖车用户
          values:
            - 中
            - 间接 / 基础性
            - 中
