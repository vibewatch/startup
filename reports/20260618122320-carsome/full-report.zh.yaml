      - number: '4.3'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              Carsome 的资本结构反映出一段漫长转型：从风投资金驱动增长，转向更分层的资本栈，其中包括战略股权、银行额度和风险债。Tracxn 重构出 17 轮约 US$838M 融资；CB Insights 显示 17
              次融资合计 US$695.22M，差异可能来自各数据库如何纳入债务、延展轮或未披露金额。 大体时间线仍一致：种子轮和 Series A 支撑早期扩张；Series B 和 C
              资助区域扩张和最初的融资相邻业务；2021 和 2022 年带来最大规模后期股权注入；2023 年 6 月新增 US$200M 轮和 EvolutionX 风险债；2024 年 7 月新增 US$21.4M
              AmBank 轮；2024 年 9 月新增 RM200M 融资合作；2025 年 7 月新增 US$15M HSBC 传统债务额度；2026 年 3 月由 HKIC 领投、Gobi 和 Asia Partners
              参投，带来超过 US$30M 新战略轮。 这种资本可得性降低了近期偿付能力担忧，但也意味着 Carsome 即便盈利转向后，仍有有意义的融资依赖和杠杆敞口。
