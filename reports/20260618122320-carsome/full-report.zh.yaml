      - number: '3.4'
        title: 竞争威胁与脆弱点
        blocks:
          - type: paragraph
            body: >-
              Carsome 的优势有意义，但并非不可攻破。第一重威胁是 Carro 持续的资本获取能力和区域野心。Tracxn、Dealroom、Reuters 和 Carro 自身 2025
              年公告合在一起，呈现出一个仍在融资、年交易超过 100,000 辆车、并准备可能在 2026 年赴美 IPO 的对手。 第二，卖家流动性可以多平台投放。Paultan 的比较不能证明 Carro 总是赢，但它证明
              Carsome 不能假设每一次都能拿到最高出价或最深经销商响应。第三，二手车品类正转向融资、保险和 EV 残值管理。Moladin 转向借贷、Carro 明确推日本
              PHEV，都说明下一层竞争可能更围绕信贷、承保和电池风险信心，而不只是线索生成。 第四，Carsome 仍有声誉执行风险：myTukar
              评价激励争议不打破投资论点，但提醒人们，一旦营销行为或服务一致性滑坡，信任优势会被侵蚀。最后，不应把 OLX Autos
              退场误读为永久松绑。它移除了一个激进对手，但也说明，当销量增长跑在利润纪律前面时，这个品类在运营上会多么惩罚性。
