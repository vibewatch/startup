      - number: '7.5'
        title: 宏观与结构性风险
        blocks:
          - type: paragraph
            body: >-
              Carsome 的宏观风险，最好理解为转化风险，而不是简单的销量预测问题。平价二手车需求可以保持韧性，但融资转化可能恶化、库存可能老化， 或买家可能转向不同动力总成。Eric Cheng 2024 年 12
              月的评论把这一点说清楚：马来西亚燃油补贴合理化可能把需求导向更省油的车辆； 泰国信贷紧、家庭债务高、贷款批准率约 30%，即便买家兴趣存在，也可能压住市场增长。地域集中让宏观暴露更尖锐，因为 Carsome
              最好的结果仍来自马来西亚和新加坡， 而印度尼西亚和泰国被描述为较弱或更不均衡。EV 转型又增加一层结构性不确定性。CNA 对新加坡的报道显示，二手 EV 折旧可能远快于 ICE 车辆，
              转售时间也显著更长；Carsome 泰国团队也承认，电池标准、OEM 协调和融资支持仍需建立。这些事实不推翻投资论点，但意味着 Carsome 下一段增长对信贷条件、 能源政策变化和残值错定价高度敏感。
