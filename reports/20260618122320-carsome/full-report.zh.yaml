      - number: '6.4'
        title: 负面客户信号
        blocks:
          - type: paragraph
            body: >-
              负面客户证据并不推翻 Carsome 的需求叙事，但说明服务质量并非处处优秀。最显眼的投诉集中在退款延迟。Paultan 报道称，许多客户在社交媒体投诉预约费退款超过一个月， 尽管 Carsome FAQ
              写明时间线为 14 个工作日。同一报道还提到更早的卖家投诉：通常三小时的付款流程因系统问题拖到三天以上。Carsome 后来回应称， 过去六周 98%
              的退款已按时完成，并把少数延迟归因于交易激增、文件不完整和行政摩擦。这个回应降低了系统性崩塌的概率，但仍确认至少一部分客户旅程存在运营压力。


              另外两个下行信号值得投资人关注。第一，Marketing-Interactive 报道 MyTukar 公开指称 Carsome 激励五星评价，并引用信后情绪数据，显示线上品牌情绪急剧恶化。
              即便指控来自竞争对手，也说明这个品类的信任仍很脆弱。第二，2025 年 UniMAP 对 Carsome Certified Lab 的案例研究发现，约 30% 车辆因初检漏掉缺陷而需要返工；
              客户调查显示总体满意度为 75%，但 20% 不满意，主要与外观问题相关。换句话说，Carsome 的 NPS 和品牌定位可能方向上很强，
              但独立负面记录仍指向响应时间、检测一致性和评价治理风险，尽调中应直接测试。
