      - CR022
      - CR023
      - CR025
      - CR033
      - CR043
      - CR044
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据支持的含义
    rows:
      - - 建议
        - 继续研究
        - 业务质量真实存在，但价格还没有便宜到足以抵消披露缺口。
      - - 信心
        - 中
        - 公开证据显示运营进展方向较强，但还达不到估值级披露完整度。
      - - 风险评级
        - 高
        - 后期私募流动性差、陈旧估值标记风险和调整后 EBITDA 不透明仍然重要。
      - - 估值立场
        - 合理到偏高
        - 收入可以支撑估值标记，但 EBITDA 和公开市场可比公司并没有让它显得便宜。
      - - 决策含义
        - 等折价或更好披露
        - 新一轮定价融资、IPO 申报或经审计盈利桥表，都会明显提高可承销性。
    notes: 该建议仅基于公开证据，并把 2022 年 1 月估值视为最后已知定价锚点，而不是当前报价市场价格。
    claimRefs:
      - CV002
      - CV018
      - CV028
      - CV030
      - CV032
      - CV042
      - CV045
  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 类型
      - 什么会改变判断
    rows:
      - - Carsome 已证明自己能在继续扩大辅助收入的同时实现并维持盈利。
        - 正向论点
        - 法定利润或现金流披露与调整后 EBITDA 出现重大背离。
      - - 如果增长和辅助业务占比继续改善，US$1.7B 估值标记在收入口径上仍可辩护。
        - 正向论点
        - 新一轮定价融资或 IPO 反馈把公司定价显著压到 5x 收入以下。
      - - Bursa 或其他上市地点，可能会奖励 Carsome 的区域品牌、本地投资人熟悉度和改善中的纪律性。
        - 正向论点
        - IPO 窗口继续关闭，或管理层把时间推到 2027 年之后。
      - - 2022 年估值标记已经陈旧，也没有通过广泛一级融资被透明重新验证。
        - 反向论点
        - 新一轮由领投方定价的融资或 IPO 申报重新确认估值。
      - - 调整后 EBITDA 仍由管理层定义，The Edge 也指出 2024 年调整项没有披露。
        - 反向论点
        - Carsome 发布调整后 EBITDA 到法定净利润和现金流的经审计桥表。
      - - 私募市场流动性差，意味着如果沿用持平估值，后期投资人可能拿不到足够上行空间。
        - 反向论点
        - 入场价明显低于历史估值标记，或退出可见度改善。
    notes: 核心张力很简单：Carsome 现在运营可信度更高，但估值证据还没有达到公开市场需要的干净程度。
    claimRefs:
      - CV006
      - CV009
      - CV017
      - CV020
      - CV021
      - CV022
      - CV032
      - CV042
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 估值区间（US$B）
      - 关键风险 / 概率信号
    rows:
      - - 牛市
        - FY2026 EBITDA 再次大致翻倍；辅助业务加深；IPO 窗口打开；没有下调融资信号。
        - 2.5-3.2
        - 需要公开市场给予溢价，并且利润持续扩张；概率较低。
      - - 基准
        - US$1.7B 估值标记大体守住；再有几个盈利季度支撑上市准备；披露小幅改善。
        - 1.7-2.0
        - 最符合当前证据组；中等概率。
      - - 熊市
        - IPO 推迟；公开可比公司估值仍低迷；私募投资人要求对陈旧估值打折，或出现下调融资。
        - 1.0-1.4
        - 宏观或披露条件恶化时最可能出现；后期入场者下行空间明显。
    notes: 区间只基于公开证据，按企业价值思路推演；没有详细建模未披露的清算优先权结构。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV030
