  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接竞争对手与市场地图
        blocks:
          - type: paragraph
            body: >-
              Carsome 所竞争的二手车市场，最重要的事实不是数字玩家存在，而是它们相对线下长尾仍然很小。Mordor 称线下经销商 2025 年仍持有 61.24% 份额；Global Market Insights 称
              2024 年前五大数字平台合计仅占 7%，Carro 单独占 4.7%。 这意味着 Carsome 同时打两场仗：一场是与 Carro、Moladin
              等组织化同行的直接竞争；另一场是与仍主导客户行为的传统经销商、分类信息和非正式交易竞争。在组织化群体中，Carro 是最清晰的区域标杆，因为它在多个亚太市场结合 C2B 车源、B2C 零售、融资、保险和售后。
              Moladin 的重要性来自另一点：它更聚焦印度尼西亚，且越来越以融资为导向；即便没有 Carsome 的四国运营深度，它仍与区域最大国家市场相关。OLX Autos
              现在是收缩而非扩张威胁，但其退出印度尼西亚仍有战略参考价值，因为它显示规模化工业化二手车运营有多难。
              间接看，Mudah、Carlist、经销商车场和传统分类信息栈仍很强，因为它们仍掌握发现入口和卖家注意力，即使不端到端控制履约。
