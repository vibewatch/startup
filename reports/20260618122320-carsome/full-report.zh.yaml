          - type: callout
            title: EV 残值和泰国信贷都会拖慢转化
            body: 两个近期逆风比泛泛竞争更重要。第一，二手 EV 价格发现仍不成熟，新加坡证据显示，其折旧远陡于 ICE 车辆，转售周期也长得多。第二，泰国仍受融资约束，贷款批准稀缺时，即使有意愿的买家也可能无法成交。
