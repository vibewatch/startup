    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Carsome 是一家东南亚综合二手车平台，2015
              年创立于马来西亚，目前总部位于雪兰莪八打灵再也。公司官方材料对模式的描述很一致：从消费者车源获取开始，经过检测和可选经销商竞价，再靠批发、认证零售、融资、保险和售后服务变现库存。 关键在于，Carsome
              不是单纯的分类信息平台，也不是单渠道车商；它搭了一个闭环运营系统，试图控制交易、整备和用车生命周期中更多环节。公开规模指标支撑这一定位：50 多个城市超过 80 个中心、网络内超过 13,000
              家经销商、平台累计记录超过 1,800 万次出价。 目前最强的消费者承诺落在 Carsome Certified 里，公司宣传 175 点检测、1 年质保和 14 天退款保证。合在一起看，Carsome
              试图把数字流动性、线下运营和信任保障装进一个区域二手车平台。
