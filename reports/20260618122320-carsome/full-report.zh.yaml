      - number: '6.5'
        title: 客户集中度与地域组合
        blocks:
          - type: paragraph
            body: >-
              Carsome 的客户集中风险看起来更多来自地域和渠道，而不是某个已披露企业客户。公开材料反复指向马来西亚是核心运营市场，新加坡是第二强利润池； 印度尼西亚和泰国则被描述为较弱或波动更大。FY2025
              评论称，尽管区域市场条件走软，盈利增长由马来西亚和新加坡带动；2026 年一季度新闻稿也重申，
              马来西亚和新加坡继续展现运营强度，而印度尼西亚和泰国仍不均衡。因此，客户基础在足迹上区域多元，但仍集中在两个质量更高的市场。


              渠道组合同样关键。最清楚的披露拆分来自 2023 年融资公告，管理层称区域零售线 Carsome Certified 贡献了 2022 年收入的 35%。
              这意味着当时约三分之二收入仍来自批发交易和其他生态业务线，且那还是后续融资和售后增长之前。管理层还称，2023 年一季度超过 80% 的交易毛利仍来自交易利润率； 这支持一个判断：Carsome
              提升客户质量的速度，快于其彻底分散收入质量的速度。缺失的是 cohort 层面披露：没有公开的复购率、单客收入， 或按市场划分的 logo 留存表。因此，最有支撑的结论是 Carsome
              的客户质量已实质改善，但投资人仍必须用 NPS、CAC、GPU、融资表现和市场评论等代理指标， 推断集中度、留存和变现质量。
