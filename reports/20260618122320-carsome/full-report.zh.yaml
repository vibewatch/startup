      - number: '5.3'
        title: 技术护城河与数据优势
        blocks:
          - type: paragraph
            body: >-
              Carsome 最可信的技术护城河，是它拥有汽车交易多阶段数据，而不是公开记录中的专有算法栈。2021 年，公司描述了一个专门的数据卓越中心，负责数据工程、BI、分析和基于 ML/AI
              的创新，并明确把定价优化和库存支持系统与拍卖和市场数据连接。 到 2024 年，公司和 TechNode 将盈利改善与 AI 驱动定价引擎，以及建立在超过 500,000
              笔受管交易和挂牌、媒体资产洞察之上的承保能力绑定。关键在于，Carsome 的数据池不只来自已完成销售；它还包括检测、拍卖行为、零售库存、融资需求和需求侧媒体流量。 iCar Asia
              收购进一步扩大了这一数据面，带来 Carlist 和 WapCar；iCar Asia
              公司网站仍宣称拥有数百万月用户、大量挂牌和经销商线索。因此，公开来源支持一个真实反馈循环：内容发现、定价、经销商流动性、融资和翻新决策相互喂养。 缺口在于，公开材料没有披露 AVM
              的具体特征架构、基准误差率，也没有说明一旦竞争对手整合类似云工具，护城河还有多少能保持耐久。Carsome 的护城河最强处在交易数据广度和工作流整合，而不是可见的独特公开软件资产。
