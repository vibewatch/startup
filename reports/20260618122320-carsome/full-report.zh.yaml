  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承销判断的影响
      - 精确尽调路径
    rows:
      - - 当前现金与现金可支撑期限
        - 无法判断 FY2025 盈利之后，Carsome 能靠自有资金支撑库存、信贷增长或扩张多久。
        - 索取资金报告，覆盖不受限现金、循环贷款余量、月度现金消耗和 18 个月预测。
      - - 收入口径桥表
        - 无法按同口径比较 2021、2022、2024 年及数据库收入指标。
        - 索取审计损益表，并要求管理层调节数据库和新闻稿使用的每一个公开收入数字。
      - - 调整后 EBITDA 调节表
        - 无法把管理层盈利说法转成法定盈利质量，也无法与上市同业比较。
        - 索取调整后 EBITDA 到 EBIT、净利润和经营现金流的桥表。
      - - 债务到期和契约时间表
        - 无法判断再融资风险，或合作银行授信是否带有限制性条款。
        - 索取逐笔授信时间表，列明到期日、定价、抵押品、契约和续约条件。
      - - 按实体划分的外汇敏感性
        - 无法量化 MYR、IDR、SGD 和 THB 波动如何影响合并 USD 口径。
        - 索取法人实体层面的收入、成本和债务币种结构，以及对冲政策。
    notes: 尽管 EBITDA 动能转正，这些关键披露缺口仍妨碍形成公开市场式承销结论。
