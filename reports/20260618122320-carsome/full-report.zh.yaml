      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Carsome 的融资历史显示，公司从 2015 年种子资金一路走到 2026 年的多轮后期延展和债务额度。Tracxn 记录显示，公司 17 轮累计融资约 $838M，早期投资方包括
              IdeaRiverRun、500 Durians、Spiral Ventures、Gobi Partners 和 Burda，之后股东表转向更大型机构，如 65 Equity Partners、SeaTown
              Holdings、Qatar Investment Authority、MediaTek，以及后来的 AmBank、HSBC 和 HKIC。 最耐用的估值锚点仍是 2022 年 1 月 Series E，当时
              Carsome 据报达到 $1.7B 估值。之后披露的融资更像增量补给，而非颠覆性融资：2023 年 $200M Series E 延展、2024 年 $21.4M AmBank 轮、2025 年 $15M
              HSBC 债务额度，以及 2026 年 3 月由 HKIC 领投、Gobi 和 Asia Partners 参投的超过 $30M Series F。
              这一组合意味着，公司融资目标从追逐全新高速增长阶段，转向支撑盈利和生态扩张，同时仍避免释放公开下调估值信号。
