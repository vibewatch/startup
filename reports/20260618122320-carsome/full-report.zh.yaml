      - number: '3.2'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              竞争分野不在于谁有网站，而在于谁控制交易关键步骤。Carsome 相比分类信息和经销商车场最强的差异，是把检测、文档、竞价、零售认证、融资和售后放进同一套栈。175 点检测、1 年质保和 14
              天退款保证，把信任做成产品，而不只是营销主张。 Carro 与同样的全栈野心高度重叠，并且在某些卖家流动性场景中可能更强；Paultan 的并排测试显示，Carro
              吸引了更多经销商，也拿到更高出价。Moladin 的竞争方式不同：其官方界面强调经销商融资和综合汽车金融生态，说明它是从融资轨道向内打，而不是从广泛区域消费者品牌向外扩。 Mudah
              和更广泛的分类信息层仍重要，因为它们以低成本汇聚大量挂牌和卖家意向，但通常不会掌握检测标准，也不会吃到融资和售后等下游经济性。iCar Asia
              在这一比较中有战略意义，因为它通过内容、挂牌、经销商线索和广告库存给 Carsome 另一条分销和发现渠道，纯交易型对手难以完全匹配。
