      - number: '4.4'
        title: CARSOME Capital 与附加金融服务
        blocks:
          - type: paragraph
            body: >-
              附加金融服务似乎是 Carsome 区别于低利润车辆倒卖模式的核心杠杆。管理层已明确表示，融资、保险、售后和平台服务是下一段利润扩张来源。 2023 年，Carsome 称单车附加收入增长超过
              80%，CARSOME Capital 收入增长超过 80%，税前利润同比增长两倍，同时该业务实现连续第二年净盈利。到 2024 年末，公司正借助新银行合作扩大经销商和消费者融资；The Star 也报道零售
              NPL 低于 2%、批发 NPL 为 0.1%，如果这些数字能维持，说明承保有纪律。 公开产品界面支撑这一策略：CARSOME Capital 提供最长 108 个月的消费者融资，以及最高可达车辆价值
              80%、月利率低至 1% 的经销商融资。Eric Cheng 2024 年访谈补上战略背景：附加产品仍只占总收入约 20%，如果 Carsome 能在扩大附着率的同时保持信贷质量稳定，上行空间仍有意义。
