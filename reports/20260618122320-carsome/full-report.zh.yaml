      - CR011
      - CR020
      - CR025
      - CR032
      - CR041
      - CR044
  - id: FR003
    title: 竞争威胁时间线
    type: timeline
    layout: wide
    summary: 竞争和品类事件时间线显示，Carsome 的风险画像从 2022 年的整合压力，转向 2026 年的 EV、流动性和资本市场竞争。
    data:
      items:
        - label: 裁员 + APP Reset
          value: 2022-09
          detail: Carsome 裁员，加速 iCar 和 WapCar 整合，并强力转向盈利。
          tone: negative
        - label: 退款 / 打款投诉
          value: 2023-05
          detail: 客户摩擦信号显示，重组期间流程压力可能外溢。
          tone: negative
        - label: myTukar 信任争议
          value: 2024-04
          detail: 围绕激励五星评价的公开指控，再次说明二手车信任多么脆弱。
          tone: negative
        - label: Carro IPO 声量
          value: 2025-08
          detail: Reuters / ST 称 Carro 目标是在 2026 年以超过 US$3 billion 估值赴美 IPO，区域竞争压力仍高。
          tone: negative
        - label: 二手 EV 残值显性化
          value: 2025-2026
          detail: CNA 和 Bangkok Post 报道显示，EV 转售更慢，电池 / 金融标准仍未解决。
          tone: warning
        - label: 二级市场 EV 执行
          value: '2026'
          detail: Carsome 称将有更多 EV 进入二级市场，检测、翻新、零售和金融环节的执行都必须更锐利。
          tone: warning
    claimRefs:
      - CR001
      - CR003
      - CR025
      - CR028
      - CR031
      - CR022
      - CR023
      - CR024
      - CR043
