  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营与质量风险
        blocks:
          - type: paragraph
            body: >-
              Carsome 的运营风险已不再是理论问题，因为公开记录已经显示，当流程复杂度跑在控制之前会发生什么。2022 年 9 月的加速盈利计划， 把裁员、自动化，以及 iCar 和 WapCar
              的整合打包成一次执行重置；这意味着管理层一边降成本，一边把多个品牌、流程和技术栈缝在一起。 2023 年退款和卖家付款投诉说明，这些压力不只员工看得到，客户也感受到了。质量控制是另一个具体暴露点：2025 年
              UniMAP 案例研究发现， 抽样 Carsome Certified Lab 车辆中约 30% 因初检漏掉缺陷而需要返工，不满仍集中在外观。这个问题重要，因为 Carsome 的品牌承诺依赖标准化检测、
              翻新和信任。iCar Asia 整合带来的上行空间真实存在，但它也把运营界面扩展到内容、车源、批发流动性、零售履约和售后，服务一致性和管理纵深因此成为首要监控风险。
