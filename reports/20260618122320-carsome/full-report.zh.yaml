      - number: '6.3'
        title: 客户满意度与质量指标
        blocks:
          - type: paragraph
            body: >-
              作为二手车平台，Carsome 披露的顶层满意度指标异常强。2023 年 6 月融资公告中，公司称截至 2023 年一季度，Carsome Certified 的 NPS 为 77， 批发业务 NPS 为
              75。到 2024 年 5 月盈利公告时，Carsome 称零售 NPS 从 77 提升至 83，批发 NPS 升至 76。如果这些数字口径一致， 它们同时指向强客户价值主张和零售执行的真实进步。Carsome
              Certified 周围的信任组合能解释这一点。Carsome 马来西亚产品页强调 175 点检测、专业翻新、 360 度影像、无隐藏费用、一年质保和 14
              天退款保证；购买流程又加入融资、文件支持、交付和售后协助。


              留存和互动证据比 NPS 标题数字薄，但仍有有意义的信号。MyGarage 于 2023 年作为客户体验枢纽推出，被描述为实时估值、保养预约、销售检测、保险提醒，
              以及一键转售或维修的入口。购车后，客户因此有理由重新进入生态，而不是只把 Carsome 当作一次性市场。CARSOME Capital 又加了一层粘性： 零售买家可获得最长 108
              个月融资，经销商可获得最高为车辆价值 80% 的库存融资。对一家私营公司而言，信用质量披露也相对强：The Star 报道， 2024 年末零售 NPL 低于 2%，批发 NPL 为
              0.1%。主要保留意见在一致性。Carsome 自有区域页面并未在每个市场给出完全相同的买家承诺， 一份外部 2025 年质量控制案例研究仍在翻新流程中发现了有意义的返工和外观不满。
