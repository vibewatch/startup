      - number: '2.3'
        title: 客户分层与数字化采纳
        blocks:
          - type: paragraph
            body: >-
              区域需求并不均质。追求性价比的家庭仍支撑销量，但购买标准会随收入、道路条件和融资可得性变化。网约车和车队相邻买家在印度尼西亚和泰国尤其重要，价格可负担的轿车与掀背车支撑城市营运场景，嵌入式融资则能释放首次购车。
              家庭买家越来越偏好
              SUV，因为在许多市场，离地间隙、车内空间和乡村道路适配性，比传统轿车经济性更重要。认证库存能拿溢价，因为买家是在花钱降低信息不对称：当事故和里程数据无法在区域内稳定迁移时，保修、标准化检测、透明维修记录和翻新更重要。
              因此，平台能把线上发现和线下保障配在一起时，数字化采纳最强。Carsome
              的模式与这种行为匹配，因为它变现的是检测、信任、附加金融和售后信心，而不只是分类信息流量。买家支付意愿在城市、时间受限和使用信贷的人群中最强，在纯价格驱动的非正式交易中明显更弱。
