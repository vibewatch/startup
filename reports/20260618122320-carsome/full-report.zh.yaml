      - number: '3.5'
        title: Carsome vs Carro：正面对比
        blocks:
          - type: paragraph
            body: >-
              Carsome 和 Carro 是本章中唯二明确像区域全栈冠军的竞争者，而不是单国或单步骤运营商。两者都始于 2015 年，都把交易轨道与融资和附加服务结合起来，规模也都大到管理层开始谈最终公开市场结果。
              差异在于优势落点。Carsome 在东南亚交易密度、检测标准化、经销商网络广度，以及收购 iCar Asia 后的内容触达上似乎更强。它也通过 Carsome Certified、NPS 提升至 83，以及
              Carsome Capital 和附加服务改善盈利的公开证据，讲出了更明确的信任叙事。 相比之下，Carro 更像资本市场和扩张层面的尖锐威胁。Reuters 称其目标是在 2026 年以超过 US$3B 估值
              IPO；Carro 自身公告称其在七个市场年交易超过 100,000 台，并正押注 AI、金融科技、保险、售后和 EV 相邻需求。 Paultan 的卖方测试是有用提醒：即便 Carsome 整体更大，Carro
              仍能赢下具体本地流动性竞争。净判断是，Carsome 的优势可能在信任、基础设施和承保上更耐久；Carro 在资本获取、区域选择权和激进产品相邻扩张上仍更危险。
