      - number: '4.5'
        title: 财务风险与注意事项
        blocks:
          - type: paragraph
            body: >-
              本章下行情形的重点，不是 Carsome 是否有真实业务，而是公开披露仍无法让投资人干净承保。第一，调整后 EBITDA 是管理层定义指标；Carsome 未公开其与法定利润的调节表，也未在 2024 和
              2025 年盈利公告中披露完整损益表、现金流量表或当前资产负债表快照。 第二，二手车零售库存重、营运资本占用高，因此盈利仍可能受持有损失、库存周转变慢和融资收紧冲击。第三，外汇折算重要，因为 Carsome
              运营横跨 MYR、IDR、SGD 和 THB，而多数投资人口径用 USD。 第四，利润集中度似乎在马来西亚和新加坡最强，尽管 FY2025 评论承认区域市场偏弱。最后，2022
              年裁员和后续退款投诉说明，Carsome 过去的烧钱和流程压力是真实的。合在一起看，Carsome 现在具备融资能力，运营也已改善，但披露质量还不足以支撑公开市场式确定性。
