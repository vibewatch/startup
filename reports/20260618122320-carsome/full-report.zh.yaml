      - number: '2.4'
        title: 监管环境
        blocks:
          - type: paragraph
            body: >-
              监管在这个市场不是边缘问题；它直接塑造信任、过户速度和融资经济性。马来西亚是 Carsome 近期最显性的相关市场，因为 MOT 放开了 Puspakom 垄断之外的过户检测，并将 Carsome Academy
              列为四家新运营方之一。 这给 Carsome 打开了更靠近交易控制点的路径，但也带来资本、系统集成和认证要求。新加坡在光谱另一端：COE 制度和配额系统让二手车经济高度透明，也让成本结构性偏高；CPFTA
              则给买家在不公平做法和不合格商品上提供更清晰的法定底线。 泰国框架重要，是因为数字借贷、虚拟银行和平台验证规则同时收紧，这会抬高合规成本，也会奖励治理更好的运营商。印度尼西亚仍是人口带来的最大上行市场，但监管由
              OJK 和 Bank Indonesia 分割，让二手车金融科技和支付流程更复杂。 四国共同方向是：能规模化处理牌照、AML、KYC、文档和平台验证的正式运营商更受益。
