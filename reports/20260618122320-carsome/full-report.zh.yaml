    Carsome Capital 融资与保险；以及（5）Carsome Service Centers 售后服务。
  customerFocus: 私家车卖家（C2B）、寻找质量认证车辆的二手车买家（B2C），以及 13,000+ 家经销商网络（B2B 批发）。次级客群：通过 Carsome Capital 获取汽车融资的客户。
