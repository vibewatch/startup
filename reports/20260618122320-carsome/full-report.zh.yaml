      - number: '7.2'
        title: 财务与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              Carsome 的财务风险位于披露质量、杠杆叠加和营运资金强度的交叉点。积极事实是，Carsome 在 2024 年实现了报告口径调整后 EBITDA 盈利， 并在 FY2025
              进一步改善。承销难点在于，公开披露仍落后于标题叙事。The Edge 指出，Carsome 没有披露 FY2024 调整后 EBITDA 如何得出，
              也没有在盈利声明中提供更完整的收入或法定口径桥接。历史下行证据也真实存在：一份基于审计报告的二级分析引用了 2021 年约 US$114 million 的经营现金消耗。
              与此同时，资本栈随时间变得更分层：在股权融资之上，叠加了 2021 年传统债务、2023 年 venture debt、2024 年营运资金授信，以及 2025 年 HSBC 设施。 因为 Carsome
              持有二手车库存，并同时为零售买家和经销商提供融资，定价、周转速度、信用质量或残值假设中的小错误，都可能直接传导成流动性和利润率压力。 外汇又加一层风险，因为 Carsome 横跨 MYR、IDR、SGD 和
              THB 运营，而许多投资人用 USD 概括业务。
