      - number: '3.3'
        title: Carsome 的竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Carsome 的护城河来自线下基础设施、数据、品牌和嵌入式金融服务的相互作用，而不是某个单点功能。第一，检测和认证重要，因为这个品类信任仍弱，它们能压缩信息不对称；Carsome 的 175 点流程和
              Certified 承诺给了公司一套可复制标准，传统经销商往往很难稳定匹配。 第二，网络护城河真实存在。Carsome 称其在 50 多个城市拥有超过 80 个中心和 13,000
              多家经销商，带来库存吞吐、地理便利和 B2B 流动性。第三，公司现在拥有有意义的生态杠杆：iCar Asia 贡献内容、经销商广告和线索生成，Carsome 自身披露也显示整合后数字月活用户超过 1,800 万。
              第四，Carsome Capital 重要，因为它把交易数据转成融资经济性。管理层称，该业务成为集团最早盈利的实体之一，2023 年收入增长超过 80%，承保建立在超过 500,000
              笔受管交易之上。最后，规模已经足够可见，具备战略意义。集团累计售车突破 500,000 辆，近年维持 150,000+ 年销量，并报告利润率改善和 EBITDA
              转正；这些因素合在一起，让轻资本复制者更难取代平台。
