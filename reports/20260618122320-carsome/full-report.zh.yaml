  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入历史与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              理解 Carsome 的收入轨迹，最好把它看成硬里程碑与披露缺口的混合，而不是干净的经审计时间序列。公开记录支持公司在 2021 年和 2022 年大幅放量，但不同来源似乎并不使用同一收入口径。 Carsome
              2023 年 6 月融资公告称，2022 年收入增长 250% 至 US$1.5B，Carsome Certified 贡献总收入的 35%；而基于审计报告的二手分析引用 2021 年收入
              US$655.9M、当年毛利 US$35.9M。 后续公开数据库又增加一层复杂性：GetLatka 列出 2024 年收入 US$305M，而 Carsome 自身 2Q2024 公告称单季收入就超过
              US$310M。这个错配强烈暗示，部分来源混用了净收入、更宽口径收入或数据库标准化规则。 方向上清晰的是，Carsome
              已从交易密集型二手车平台，成长为多线生态：车辆销售仍锚定销量，但融资、保险、售后和平台服务对毛利质量越来越重要。
