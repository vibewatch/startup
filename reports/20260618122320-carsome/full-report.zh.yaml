  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 风格对七个估值相关维度按 1-5 分打分，5 分最强。
    approximationNotes: 分数是作者仅基于公开证据作出的判断，反映估值承销性，而不只是产品质量。
    data:
      items:
        - label: 盈利证据
