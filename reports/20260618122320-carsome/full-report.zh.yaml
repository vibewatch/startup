      - number: '5.5'
        title: 技术风险与质量挑战
        blocks:
          - type: paragraph
            body: >-
              Carsome 的主要产品和技术风险是集中度、复杂性和执行质量。第一，2025 年云迁移让 Google Cloud 成为核心运营、数据管道和 AI
              工具更中心的依赖。迁移可能提升速度并降低成本，但也抬高了围绕单一超大规模云厂商和单一实施伙伴的集中风险。 第二，Carsome
              生态已经足够宽，集成风险真实存在。公司必须协调检测中心、翻新设施、经销商流动性、融资伙伴、从 iCar Asia 继承的内容 / 媒体资产，以及多个面向用户的
              app。公开来源证明了业务广度，但没有暴露内部集成架构、可靠性目标，或把收购门户与 Carsome 交易系统合并时的变更管理负担。 第三，质量控制仍像是有意义的运营风险。2025 年一项独立 ASET 关于
              Carsome Certified Lab 的案例研究发现，约 30% 车辆因初始漏检缺陷而需要返工，尤其是外观缺陷，并把更彻底的 QC 与更高满意度联系起来。这并不否定 Certified Lab
              模式，但说明标准化还没有完全解决。 最后，声誉和合规纪律重要，因为信任是 Carsome 模式的核心；2024 年评价激励争议显示，增长活动可以多快削弱客户满意度信号的可信度。合在一起，这些风险让 Carsome
              的技术故事可投，但并不省心。
