            title: 市场大，正式集中度低
            body: 组织化二手车机会仍处早期。即使平台投资多年，线下经销商仍占多数份额，前五大数字玩家合计也只控制个位数的总市场。这给 Carsome 留出空间，继续用信任、检测、融资和保修打包成可复制运营系统来拿份额。
