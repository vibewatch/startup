  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最近已知估值与历史
        blocks:
          - type: paragraph
            body: >-
              Carsome 最清楚的估值锚仍是 2022 年 1 月 Series E。当时 Tracxn 以及 Reuters 转述的报道把公司估值定在 US$1.7 billion， 该轮 US$300 million
              由 65 Equity Partners、SeaTown 和 QIA 领投。这个标记重要，因为它仍是公开记录中唯一被广泛引用的定价估值。 此后，公司继续融资，但后续轮次没有清楚重置标题数字。Tracxn
              显示，2023 年 Series E 延展轮为 US$200 million，2024 年 AmBank 轮为 US$21.4 million， 2025 年 HSBC 债务设施为 US$15
              million，2026 年 3 月由 HKIC、Gobi 和 Asia Partners 领投的 Series F 超过 US$30 million。 这些后续披露均未发布新的 post-money
              价值。因此，投资人应把 US$1.7 billion 视为最近已知的定价标记，而不是 2026 年市场出清事实。 额外细节在稀释数学：如果 US$1.7 billion 是 pre-money 口径，US$300
              million 轮意味着约 21% 新股权；如果是 post-money，稀释接近 18%。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV018
              - CV033
              - CV034
              - CV038
          - type: table
            tableRef: TV002
