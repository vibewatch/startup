              - CV043
              - CV044
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV028
              - CV030
              - CV032
              - CV043
      - number: '8.5'
        title: 估值风险与保留意见
        blocks:
          - type: paragraph
            body: >-
              给 Carsome 标题估值打折的主因，不是业务缺乏实质，而是估值证据比运营进展更薄。第一，2024 年和 2025 年盈利公告强调调整后 EBITDA， 但公司没有发布公开调节表，把它桥接到法定盈利或经审计的
              GAAP 式财务包。The Edge 批评得很明确：2024 年调整后 EBITDA 数字没有披露底层调整， 也省略了更完整的收入细节。第二，US$1.7 billion 标记是在友好得多的 2022
              年风险投资市场定下的。此后，更广义的汽车和科技倍数已压缩， 许多私营独角兽标记需要更大折扣才能让二级或 IPO 买家出清。第三，2026 年 3 月被描述为与 AI、供应链协作和大中华连接相关的战略轮，
              不是一次广泛重新定价事件。最后，Carsome 仍是私营且流动性差，投资人不应把上一轮价格当成连续报价的公开市场数字。正确立场是： 公司可投，但必须带着真实私募折扣，并对任何四年没有透明再验证的标记保持足够怀疑。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV025
              - CV030
