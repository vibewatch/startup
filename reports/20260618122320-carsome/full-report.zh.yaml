        - label: 竞争
          value: 4
        - label: 宏观 / 市场
          value: 4
        - label: 治理 / 关键人
          value: 3
    approximationNotes: 数值代表本章最终风险登记中保留的不同重大风险簇数量，不是概率分布。
    claimRefs:
