companyProfile:
  summary: >-
    Carsome Group Inc 是东南亚最大的综合汽车电商平台，2015 年由 Eric Cheng 和 Teoh Jiun Ee 创立于马来西亚吉隆坡。 公司跑的是全栈 C2B 到 B2C 模型：通过 175
    点检测直接向消费者收购二手车，在 Carsome Certified Labs 翻新，再卖给个人买家和 13,000+ 家合作经销商网络。 Carsome 业务覆盖马来西亚、印度尼西亚、泰国、新加坡和菲律宾，成立以来已售出超过
    500,000 辆汽车；2024 年首次实现全年调整后 EBITDA 盈利（$10.5M），FY2025 达到 $23M。 公司正准备 IPO，Bursa Malaysia 可能是上市地点。
