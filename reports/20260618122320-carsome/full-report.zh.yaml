      - number: '1.5'
        title: 负面事件与风险因素
        blocks:
          - type: paragraph
            body: >-
              主要负面证据并不动摇 Carsome 的存在性或核心市场地位，但会限定其执行质量和治理韧性。2022 年 9 月，公司宣布加速盈利计划，其中包括影响约 10% 员工的裁员，管理层也放弃薪资。 之后，2023
              年出现关于退款缓慢和付款延迟的公开客户投诉，说明成本重置后内部流程承压。公开材料还没有解决几个问题：董事会监督深度、后续债务设施的具体经济条款和契约，以及某些覆盖范围表述（如菲律宾提及）的运营状态。
              最后，本章证据包中几个可能重要的下行数据点来源仍不充分，包括有关激励五星评价的指控，以及 2025
              年翻新返工案例研究。这些问题不推翻更广泛的盈利转向，但意味着投资人不应只依赖公司的信任叙事，而应测试服务质量、投诉解决和检测一致性。
