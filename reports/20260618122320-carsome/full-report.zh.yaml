      - number: '5.2'
        title: 技术栈与 AI 能力
        blocks:
          - type: paragraph
            body: >-
              Carsome 公开技术记录中，最强证据围绕 2025 年整合到 Google Cloud。多个来源描述 Carsome 从多云设置迁移到统一的 Google Cloud 运营模型，核心包括用于数据仓库的
              BigQuery、用于商业智能的 Looker、用于激活的 Google Marketing Platform，以及用于 ML 和生成式 AI 场景的 Vertex AI。
              这一架构直接绑定核心运营流程，而不是泛泛的数字化转型故事。Carsome 和独立行业媒体都描述了一套定价引擎，使用车型、车龄、里程和其他输入预测现实车价；一套照片分析系统，能遮蔽车牌号并加快检测处理；以及用
              BigQuery 加 Vertex AI Agent Builder 搭出的语义搜索层，在团队之间浮现企业知识。 云迁移也意在提升软件开发速度：把运营应用和数据库迁到共同栈上，并使用 Google
              Security Command Center 加内置访问控制来做威胁检测和响应。Carsome 还增加了生成式 AI 联络中心能力，给客户互动打分并为坐席建议绩效改进，说明公司试图把 AI
              从定价推向服务质量和内部知识检索。 这比典型创业公司 AI 标签更实在，尽管公开证据仍没有展示模型准确率基准、运行时间 SLO 或详细架构图。
