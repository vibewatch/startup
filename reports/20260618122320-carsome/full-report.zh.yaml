      - number: '8.3'
        title: IPO 路径与退出情景
        blocks:
          - type: paragraph
            body: >-
              Carsome 最可信的价格发现路径是 IPO，但管理层和投资人仍在平衡上市地点、流动性和时点。Eric Cheng 告诉 Vulcan Post，公司目标是在未来 12 至 24 个月上市， Bursa
              Malaysia 略占优势，内部准备度取决于上市后能掌控接下来三个盈利结果。这一表述很重要，因为它显示 Carsome 把持续盈利，而不是单一年份盈利， 视为讲好 IPO 级故事的门槛。News24 转述
              Reuters 的采访语气相近：Carsome 已准备好 IPO，但并不急，并且如果其他交易所流动性和投资人认可度更强， 仍对双重上市保持开放。The Edge 2025
              年末特写补上一条结构性保留意见。本地投资人可能更理解品牌，也更能耐受季度波动； 但 Bursa 历来偏好盈利能力和可预测性，可能限制风险投资式科技倍数进入公开市场的力度。实际看，Bursa
              像是更干净的第一上市地点， 但除非 Carsome 带着更多盈利季度和更严密披露入场，否则它未必给出最慷慨的标题估值。
            claimRefs:
