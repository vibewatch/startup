      - number: '7.3'
        title: 竞争威胁
        blocks:
          - type: paragraph
            body: >-
              Carsome 的竞争风险不只是有对手存在，而是多类竞争者同时攻击栈的不同部分。Carro 是最清楚的有组织威胁，因为它仍有规模、新资本、可能的 2026 年 IPO 路径， 以及明确的 EV 和 PHEV
              相邻战略。Paultan 的卖家对比是一个有用预警：在本地流动性竞争中，Carsome 不能假设自己永远能拿到最佳报价或最深经销商响应。
              传统经销商的危险来自另一处。即便平台建设多年，线下经销商仍控制东南亚大部分二手车交易量，所以 Carsome 必须比存量玩家“足够数字化以守住份额”的速度更快，
              把信任和融资工业化。融资侧翼也打开着。Carsome 的附带上行依赖 Carsome Capital，但如今为 Carsome 提供资金的银行，也能加深自身汽车金融分销。 最后，EV
              转型是双刃剑：它创造产品机会，也引入残值、电池标准和融资不确定性；这些不确定性可能奖励行动更快的对手，或惩罚错估组合迁移的库存持有者。
