      - number: '2.5'
        title: 市场驱动因素与逆风
        blocks:
          - type: paragraph
            body: >-
              主要顺风是可负担性、城市化、数字化和融资正规化。当新车价格、配额或燃油政策变化挤压预算时，二手车会成为更容易获得的拥车路径；Carsome 2025 年对马来西亚燃油补贴合理化的评论，与这一效果一致。
              数字平台也受益于长期的信任迁移：买家越来越看重标准化检测、保修和融资，而不只是价格发现。但逆风真实存在，而且因市场而异。泰国信贷环境偏紧、贷款批准率约 30%，即使消费者有需求，也会拖慢库存周转。 EV
              结构变化又增加了一层不确定性。新加坡证据显示，二手 EV 转售周期可能远长于燃油车，折旧也可能快得多，这意味着随着 EV 供给进入区域二级市场，电池健康透明度和残值管理会更重要。
              最后，信任仍是活的运营问题。关于评价和消费者认知的公开争议显示，即便正式玩家也还在修复一个历史上不透明的品类。Carsome
              暴露在所有这些力量之下，但其运营模型在合规、检测质量和附加服务重要时能捕捉价值，因此位置强于纯挂牌网站。
