  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品供给与客户旅程
        blocks:
          - type: paragraph
            body: >-
              Carsome 的核心产品已不再是单一拍卖网站。公开产品界面如今覆盖消费者 app、卖家检测流程、经销商竞价工具、Carsome Certified 零售库存、融资支持、售后服务和翻新运营。 对消费者来说，app
              和网站支持浏览认证库存、查看检测报告、预约试驾、估算月供，并在卖车时获得即时估值信号。MyGarage 把旅程延伸到购车后：存储车辆详情、显示估计价值、提醒路税和保险续期，并让用户预约保养。
              在供给获取上，Carsome 把卖家流程与检测和竞价紧密连接：卖家预约检测，车辆经过 175 点流程检查，之后 Carsome 可将车辆导入经销商竞价，或导入自有认证零售 / 翻新路径。 CARagent
              将有代理协助的工作流数字化，让外勤代理预约、监控实时出价、查看 175 点报告并追踪当日佣金。在经销商侧，Carsome 将轻量级 CARdealer app
              与更完整的经销商仪表盘结合，展示市场挂牌、里程、地点、检测报告、竞价、支付和提款融资。结果是一条刻意整合的 C2B 到 B2B/B2C 产品旅程，而不是狭窄分类信息模式。
