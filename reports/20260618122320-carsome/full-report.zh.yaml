      - number: '1.2'
        title: 创始、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是 Carsome 最清晰的治理优势之一，但也带来集中度风险。Eric Cheng 仍是联合创始人、集团 CEO 和董事长，从公司创立、成长为独角兽到后来推动盈利，战略连续性都在他手里。
              另一位联合创始人 Teoh Jiun Ee 已不再负责一线运营，但仍留在生态内担任 Carsome Academy CEO，此前曾任 COO 和 CBDO。因此，2024 年 3
              月的领导层调整更像是加深管理梯队，而不是替换创始人。 Eric Chan 加入担任集团总裁兼 COO，Aaron Kee 转任集团首席商务官，Kjetil Rohde Jakobsen 继续担任集团
              CTO，Juliet Zhu 从总裁转为顾问。这一过渡说明，管理层意识到 2022–2023 年重置之后需要更深的运营能力。
              但公开披露在正式董事会构成、委员会结构和投资人治理权利上，比高管头衔薄得多；后续尽调应核实，在创始人圈层之外，谁控制资本配置、风险决策和继任规划。
