  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标 / 估值
      - 与 Carsome 的相关性
      - 关键限制
    rows:
      - - Carvana
        - 公开可比公司
        - 截至 2026-06-18，Multiples.vc 显示约 2.0x EV/revenue、约 18.4x EV/EBITDA
        - 展示一家规模化公开数字汽车平台在披露达到公开市场标准后可以交易到什么水平。
        - 规模大得多、流动性更强，也比 Carsome 波动大得多。
      - - CARS24
        - 私募融资
        - 2021 年 9 月 US$450M 融资对应 US$1.84B 估值
        - 对带金融相邻业务的 C2B/B2C 二手车平台，是有用的私募市场参照。
        - India 是不同市场，而且该估值标记早于 2026 年环境。
      - - Carro
        - 私募可比公司 / IPO 标记
        - 2025-2026 年 IPO 目标估值为 US$3B+ 至 US$3.8B
        - 最接近的 Southeast Asia 区域同行，具备资本市场可选性。
        - IPO 目标不等于已获市场认可的估值。
      - - Carsome
        - 私募估值标记
        - 2022 年 1 月最后已知定价估值 US$1.7B
        - 本章复核的锚点。
        - 截至运行日已四年；没有被透明刷新。
      - - 汽车行业基准组
        - 行业基准
        - 2026 年基准强调调整后 EBITDA 纪律，广义行业收入筛选倍数也低于周期高点私募市场
        - 可用来校验 2022 年式独角兽倍数是否仍适合 2026 年。
        - 行业均值和 M&A 指南并不完全适配市场平台-金融科技混合体。
    notes: 没有一个可比对象能完全匹配 Carsome 的 Southeast Asia 二手车市场平台加金融生态。把这张表用作三角校验，而不是单一答案模型。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the main public and private valuation references surfaced in 2021-2026 public evidence for digital
        used-car platforms and automotive platform benchmarks; excludes non-public secondary marks and private board
        materials.
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV016
      - CV017
      - CV020
  - id: TV005
    title: 论点失效与否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 传导到投资论点
      - 行动含义
    rows:
      - - 下调融资或新一轮一级融资低于 US$1.7B
        - 任何新一轮由领投方定价且低于历史估值标记的融资
        - 确认 2022 年锚点对当前市场来说过高。
        - 立即重新承销；不要依赖陈旧账面价值。
      - - 没有利润动能的 IPO 延迟
        - 尽管公司声称盈利，到 2027 年仍没有可信上市路径
        - 削弱公开市场很快会接受溢价倍数的判断。
        - 转向熊市区间，直到退出可见度改善。
      - - 法定利润显著低于调整后 EBITDA
        - 经审计桥表显示现金转化弱或加回项激进
        - 降低对 EBITDA 支撑估值的信心。
        - 下调估值倍数，并要求更大折价。
      - - 辅助业务扩张停滞
        - 辅助业务仍卡在约收入 ~20%，附加销售增长疲弱
        - 削弱相对纯二手车零售的溢价生态叙事。
        - 把收入倍数假设下调到接近行业均值。
      - - 宏观融资挤压
        - 库存或经销商融资流动性明显收紧
        - 抬高库存重模式下的营运资本风险。
        - 偏向基准到熊市区间，并缩短持有假设。
    notes: 这些触发器是从公开证据推导出的投资人决策规则，不是管理层指引。
    claimRefs:
      - CV020
      - CV025
      - CV031
      - CV036
      - CV044
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - 未找到包含完整利润表、现金流量表和资产负债表的公开经审计文件包
        - 没有经审计报表，DCF 和盈利质量工作都会停留在浅层。
        - 公司 / IPO 申报 / 直接尽调资料室请求。
      - - 调整后 EBITDA 调节表
        - 没有公开桥表把调整后 EBITDA 调到法定 EBIT 或净利润
        - 这是检验 Carsome 是否配得上溢价倍数的最干净测试。
        - 财务团队披露或招股书。
      - - 股权结构和清算优先权
        - 公开资料隐藏部分投资人，也没有披露优先权条款
        - 清算优先权会实质改变普通股结果。
        - 法律尽调、条款清单或 IPO 招股书。
      - - 当前现金、债务到期和融资额度契约
        - 公开材料讨论了融资额度，但没有完整资金库细节
        - 库存重的公司可能看似盈利，却背着隐藏融资风险。
        - 资金库时间表和贷款人文件。
      - - 真实 2026 年估值证据
        - 没有广泛的由领投方定价融资或公开发行刷新 2022 年估值标记
        - 投资人需要当前能清算市场的定价点，而不只是历史账面价值。
        - 新一轮融资、二级招标或 IPO 簿记反馈。
    notes: 这些要求是在把历史估值视为可操作证据而不是轶事之前，必须拿到的最低材料包。
    claimRefs:
      - CV018
      - CV020
      - CV037
      - CV038
      - CV039
      - CV045
