  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 东南亚二手车市场概览与 TAM
        blocks:
          - type: paragraph
            body: >-
              Carsome 所处市场规模大，但边界定义会显著改变结论。最宽口径是东南亚二手乘用车市场，覆盖经销商、市场平台、拍卖和私人交易渠道，排除新车、摩托车和大部分相邻服务收入。在这一边界内，公开 TAM 估算差异很大。
              Mordor Intelligence 预计 2026 年为 USD 74.33B，2031 年达到 USD 102.37B；Credence Research 和 GMI 给出的区间明显更低，MarkWide
              则给出更高增长路径。实用结论不是挑一个英雄式数字，而是把区域总 TAM、Carsome 可服务的四国足迹，以及更小的组织化、数字化、金融化子集分开看。 以 Credence 的 2024
              年区域总量和印度尼西亚明确的 38% 份额为锚，用更保守的国家视角测算，四国足迹 2024 年方向性规模约 USD 31.6B，到 2026 年升至 USD 30B 中段。 对 Carsome
              来说，这种方法比头部区域 TAM 更合适，因为 Carsome 只在马来西亚、印度尼西亚、泰国和新加坡运营，变现的是质保、检测、融资和信任，而不是整个非正式市场。
