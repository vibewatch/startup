              - CV027
      - number: '8.2'
        title: 估值倍数与可比分析
        blocks:
          - type: paragraph
            body: >-
              检验 US$1.7 billion 锚点，最简单的方法是对照收入和调整后 EBITDA。GetLatka 公开资料把 FY2024 收入放在约 US$305 million， Carsome 官方 FY2024
              声明披露调整后 EBITDA 为 US$10.5 million。以此为基础，旧估值意味着约 5.6x 收入和约 162x EBITDA。
              收入口径要求不低，但对一个具备融资和附带上行的区域市场平台并不荒唐；EBITDA 口径明显偏贵。FY2025 改善了叙事，因为 Carsome 将调整后 EBITDA 翻倍至 US$23 million，
              隐含倍数降至约 74x。如果 FY2026 EBITDA 再翻倍至约 US$46 million，同一企业价值会压缩至约 37x。可比筛选给出双向信号。 Multiples.vc 显示，截至 2026 年 6 月
              18 日，Carvana 约为 2.0x EV/revenue 和 18.4x EV/EBITDA；CompaniesMarketCap 则显示， 公开市场价值可以多快地从一个周期切到另一个周期。私营同业仍支持
              Carsome 作为独角兽 cohort 的相关性：CARS24 于 2021 年按 US$1.84 billion 融资， Carro 在 2025 至 2026 年仍围绕 US$3 billion 以上
              IPO 目标被讨论。结论是，Carsome 更能守住收入标记，而不是 EBITDA 标记。
            claimRefs:
              - CV005
              - CV006
