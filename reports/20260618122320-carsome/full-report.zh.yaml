      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 收入说合理；EBITDA 说仍有溢价
            body: 考虑到收入规模和附带业务上行，Carsome 的 US$1.7B 标记并非明显不理性，但按当前 EBITDA 和披露质量看仍有溢价。正确承销立场是合理，而不是便宜。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV026
              - CV027
              - CV032
          - type: callout
            title: 最大估值缺口不是增长，而是价格发现
            body: Carsome 很可能配得上继续做独角兽，但公开记录仍缺少新定价轮、经审计法定盈利和透明调整桥接。因此，2022 年标记是参考点，不是当前公允价值证明。
            calloutType: risk
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV034
