  - id: FR002
    title: 风险类别拆解
    type: bar
    layout: standard
    summary: 运营、财务和监管风险占据投资论点关键下行风险的最大部分，因为它们会同时打击信任、流动性和转化。
    data:
      items:
        - label: 运营 / 质量
