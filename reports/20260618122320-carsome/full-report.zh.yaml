    title: 负面事件时间线
    columns:
      - 日期
      - 事件
      - 类别
      - 影响
      - 公司回应
      - 当前状态
    rows:
      - - 2022-09
        - Carsome 推出加速盈利计划，裁员影响少于 10% 员工，同时整合 iCar 和 WapCar。
        - 运营 / 人员
        - 整合期间显露成本压力和执行压缩。
        - 高管团队放弃薪资；遣散和自动化也是计划一部分。
        - 事件已关闭；作为执行压力先例仍然相关。
      - - 2023-05
        - Paultan 记录了超过一个月的退款延迟，并把它们与此前运营和付款投诉相连。
        - 客户 / 运营
        - 削弱了交易完成和财务流程可靠性的信任。
        - Carsome 称近期退款 98% 按时完成，并承诺自助服务和付款自动化。
        - 仍需监测；该事件仍是流程控制的实时警讯。
      - - 2024-04
        - myTukar 公开指控 Carsome 激励五星评论，并称之后情绪急剧恶化。
        - 声誉 / 竞争
        - 在本就对可信度敏感的品类里，引发信任治理问题。
        - 本章语料未保留详细公开反驳。
        - 声誉包袱未消；单独看不打破投资判断，但关系到信任耐久度。
      - - 2025-03
        - The Edge 指出，Carsome 的 FY2024 调整后 EBITDA 公告缺少调节明细，也省略了更完整的收入披露。
        - 财务披露
        - 限制外部对盈利质量和公开市场可比性的信心。
        - Carsome 强调利润率和成本纪律，但在此处覆盖的声明中没有发布缺失的桥接。
        - 披露缺口仍未关闭。
      - - 2025-06
        - UniMAP 案例研究发现，约 30% 的 Carsome Certified Lab 车辆需要返工，不满意集中在外观。
        - 质量 / 运营
        - 暗示翻新质量正在改善，但一致性仍不足，足以留下品牌风险。
        - 研究旁未保留公司直接回应。
        - 仍是运营尽调议题。
      - - 2026-01 起
        - Carsome 和市场消息称，更多 EV 将进入二级市场，但残值信心和电池标准仍不成熟。
        - 市场 / 库存
        - 给新品类库存带来定价、周转和融资风险。
        - Carsome Thailand 称正推进电池标准、OEM 连接和融资方案。
        - 新兴风险；可能增长而非消失。
    notes: 时间线聚焦本章保留、最影响决策的公开负面信号，而不是每一条小投诉或媒体提及。
