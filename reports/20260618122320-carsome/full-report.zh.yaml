          - type: callout
            title: 用硬性否决条件，而不是柔性安慰叙事
            body: 本章的论点破裂触发条件很直接：服务质量问题再次爆发、任何与 Carsome 金融相邻业务相关的监管失误、核心市场集中度恶化， 或有证据显示 EV 和信贷变化拉伸库存与融资纪律的速度快于管理层适应速度。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR006
              - CR020
              - CR021
              - CR022
              - CR023
              - CR032
              - CR033
              - CR043
