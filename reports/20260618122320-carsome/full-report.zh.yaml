      - number: '5.4'
        title: 平台开发与创新
        blocks:
          - type: paragraph
            body: >-
              公开证据中的产品开发模式偏进化，而不是炫技。Carsome 持续围绕车主旅程加模块，而不是宣布孤立点功能。消费者 app 已从浏览和卖车支持，扩展到 MyGarage、保养、融资发现和购车后车主提醒。
              合作伙伴集成也指向同一方向：2025 年 Petronas AutoExpert 合作通过 Carsome app 和网站增加服务预约和新检测点；KAF Digital Bank
              获批则暗示，公司长期有意围绕汽车交易深化嵌入式金融。 运营侧，公司明确表示，2026
              年重点不是头部独立产品发布，而是把检测、翻新、零售和融资之间的协同做得更紧。这符合一家从不惜代价扩张转向流程优化的公司。Carsome Certified Lab、Carsome Academy、消费者
              app、CARagent 和经销商工具都符合这一模式：它们是增量系统组件，目标是提高吞吐、质量控制和客户信心。 上行在于，Carsome 似乎能交付实用工作流改进。下行在于，公开发布节奏仍很薄，尤其是
              CARdealer 和 CARagent；外部观察者难以衡量迭代速度、版本深度或上线后可靠性。
