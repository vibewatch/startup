      - number: '2.2'
        title: 市场结构与竞争动态
        blocks:
          - type: paragraph
            body: >-
              即便数字平台在拿份额，市场结构仍然碎片化。Mordor 的 2025 年渠道结构显示，线下经销商仍占 61.24% 市场份额，组织化提供商仅占
              44.74%；正式渠道在增长，但仍要面对规模更大的非正式车场、路边卖家和点对点交易长尾。 融资渗透同样不足：融资交易仅占 2025 年份额的
              31.55%，给嵌入信贷、保修和验证能力的平台留下了从现金交易中拿份额的空间。竞争集中度低。GMI 称 2024 年前五大平台合计仅占 7%，Carro 为 4.7%；所以 Carsome
              竞争的阶段是早期正规化，而不是赢家通吃。 Carsome
              的优势在于四国足迹内的检测、翻新和附加服务深度，但公开卖家对比证据显示，它并非在每一条挂牌中都拥有一致更强的流动性。结果是，一个规模、信任和融资都重要的市场，同时仍由本地执行和渠道物理规律决定，多个组织化赢家可以与稳固的非正式基础并存。
