  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Competitors and Market Map
        blocks:
          - type: paragraph
            body: >-
              Carsome competes in a used-car market where the most important fact is not that digital players exist, but
              that they are still small relative to the offline long tail. Mordor says offline dealers still held 61.24%
              share in 2025, while Global Market Insights says the top five digital platforms collectively held only 7%
              share in 2024 and that Carro alone represented 4.7%. That means Carsome is fighting two battles at once: a
              direct battle against organized peers such as Carro and Moladin, and a broader battle against traditional
              dealers, classifieds, and informal transactions that still dominate customer behavior. In the organized
              cohort, Carro is the clearest regional benchmark because it combines C2B sourcing, B2C retail, financing,
              insurance, and aftersales across multiple Asia-Pacific markets. Moladin matters for a different reason: it
              is more Indonesia-centered and increasingly financing-led, which makes it relevant in the region's biggest
              country market even without matching Carsome's four-country operational depth. OLX Autos is now a
              retrenching rather than expanding threat, but its Indonesian exit is still strategically useful because it
              shows how hard it is to industrialize used-car operations at scale. Indirectly, Mudah, Carlist, dealer
              lots, and the legacy classifieds stack remain powerful because they still own discovery and seller
              attention even when they do not control fulfillment end to end.
