  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Southeast Asia Used Car Market Overview and TAM
        blocks:
          - type: paragraph
            body: >-
              Carsome operates in a market that is both large and definition-sensitive. The broadest boundary is the
              Southeast

              Asian used-passenger-vehicle market across dealer, marketplace, auction, and private-sale channels,
              excluding new

              cars, motorcycles, and most adjacent service revenue. Within that boundary, published TAM estimates
              diverge sharply.

              Mordor Intelligence projects USD 74.33 billion in 2026 and USD 102.37 billion by 2031, while Credence
              Research and

              GMI publish materially lower ranges and MarkWide publishes a higher-growth path. The practical lesson is
              not to pick

              a single heroic number; it is to separate total regional TAM from Carsome's serviceable four-country
              footprint and

              then from the smaller organized, digital, and financed subset that Carsome can realistically win. Using
              the more

              conservative country-lens anchored on Credence's 2024 regional total and Indonesia's explicit 38% share
              produces a

              directional four-country footprint of roughly USD 31.6 billion in 2024, rising into the mid-USD-30
              billions by 2026.

              That approach is better suited for Carsome than a headline regional TAM because Carsome only operates in
              Malaysia,

              Indonesia, Thailand, and Singapore and monetizes quality assurance, inspection, financing, and trust
              rather than the

              entire informal market.
            claimRefs:
