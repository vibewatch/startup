      items:
        - date: 2015-08
          label: Founded
          detail: Carsome starts in Malaysia with seed backing from IdeaRiverRun and 500 Durians.
          tone: positive
        - date: 2017-06
          label: Regional expansion
          detail: Indonesia and Thailand expansion aligns with Series A2 capital.
          tone: positive
        - date: 2019-12
          label: Carsome Capital era
          detail: Series C and financing-arm build-out deepen the ecosystem model.
          tone: positive
        - date: 2020-01
          label: Certified retail launch
          detail: Carsome expands from wholesale into the B2C buying journey.
          tone: positive
