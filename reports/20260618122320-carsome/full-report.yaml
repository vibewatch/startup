companyProfile:
  summary: >-
    Carsome Group Inc is Southeast Asia's largest integrated car e-commerce platform, founded in 2015 in Kuala Lumpur,
    Malaysia by Eric Cheng and Teoh Jiun Ee. The company operates a full-stack C2B-to-B2C model: it buys used cars
    directly from consumers via a 175-point inspection process, reconditions them through its Carsome Certified Labs,
    and resells them to individual buyers and a dealer network of 13,000+ partners. With operations across Malaysia,
    Indonesia, Thailand, Singapore, and the Philippines, and over 500,000 cars sold since founding, Carsome achieved its
    first full-year adjusted EBITDA profitability ($10.5M) in 2024, followed by $23M in FY2025. The company is preparing
    for an IPO, with Bursa Malaysia as a likely listing venue.
  foundedDate: '2015-01-01'
  founders:
