      - number: '6.4'
        title: Adverse Customer Signals
        blocks:
          - type: paragraph
            body: >-
              The adverse customer evidence does not invalidate Carsome's demand story, but it does show that service
              quality is not uniformly excellent. The most visible complaint cluster centered on refund delays. Paultan
              reported that many customers complained on social media about booking-fee refunds taking more than a month
              even though Carsome's FAQ cited a 14-working-day timeline. The same report referenced earlier seller
              complaints in which a typical three-hour payment process extended to more than three days because of
              system problems. Carsome later responded that 98% of refunds had been fulfilled on time over the prior six
              weeks, while attributing the delayed minority to transaction spikes, incomplete documentation, and
              administrative friction. That response lowers the probability of a systemic collapse, but it still
              confirms operational strain in at least a subset of customer journeys.


              Two other downside signals deserve investor attention. First, Marketing-Interactive reported MyTukar's
              public allegation that Carsome incentivized five-star reviews, with cited post-letter sentiment data
              showing a sharp deterioration in online brand sentiment. Even if the allegation came from a competitor, it
              points to how fragile trust remains in the category. Second, the 2025 UniMAP case study of Carsome
              Certified Lab found about 30% of vehicles required rework because defects were initially missed, while
              customer surveys showed 75% overall satisfaction but 20% dissatisfaction tied mainly to aesthetic issues.
              In other words, Carsome's NPS and brand positioning may be directionally strong, yet the independent
              adverse record still points to response-time, inspection-consistency, and review-governance risks that
              should be tested directly in diligence.
