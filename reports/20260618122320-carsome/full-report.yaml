      - number: '6.2'
        title: Customer Traction and Volume Metrics
        blocks:
          - type: paragraph
            body: >-
              Carsome's public customer traction markers are strong enough to establish category relevance even if they
              fall short of a public-company cohort disclosure standard. The clearest milestone on the seller side is
              the company's celebration of its 100,000th seller in 2020, which shows the C2B acquisition engine reached
              meaningful density well before the later profitability turn. The broader transaction ramp is also
              credible: Carsome says it sold more than 150,000 cars in both 2022 and 2023, crossed 500,000 cars sold
              since inception in 2024, and traded about 35,000 vehicles in 2Q2024 alone. Those markers imply Carsome is
              operating at regional scale rather than as a niche local marketplace.


              Audience scale also expanded meaningfully after the iCar Asia integration. Carsome's 2023 financing
              announcement said the group had more than 15 million monthly active users through its content and media
              ecosystem, and later disclosures said digital monthly active users grew 20% from 2022 to over 18 million.
              That is an important distinction: the 18 million figure is not a transacting-customer count, but it does
              show a large recurring discovery funnel. At the same time, Carsome says it works with more than 13,000
              dealers across 50-plus cities, which gives the wholesale side deeper liquidity than a pure classifieds
              model. On acquisition efficiency, the company disclosed a 37% reduction in CAC by Q1 2024, suggesting that
              ecosystem cross-sell and brand traffic are improving demand quality instead of requiring proportionally
              higher marketing spend as the platform grows.
