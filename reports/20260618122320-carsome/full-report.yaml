      - number: '8.4'
        title: Bull, Base, and Bear Case Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the right frame because Carsome sits between an old private mark and a possible
              future listing. The bull case requires that FY2026 EBITDA roughly doubles again, ancillary mix keeps
              expanding, Bursa or another exchange rewards the company with a premium for category leadership, and no
              new round forces a price reset. In that world, a US$2.5 billion-plus IPO or strategic outcome is
              plausible. The base case assumes the US$1.7 billion mark broadly holds, perhaps edging to US$2.0 billion
              if Carsome strings together more profitable quarters and investors become comfortable underwriting a
              regional ecosystem instead of only a used-car trader. The bear case is more punishing but realistic: if
              public market comps remain subdued, private investors demand a stale-mark discount, or an IPO slips while
              growth slows, Carsome could be worth closer to US$1.0 billion to US$1.4 billion. The key insight is that
              Carsome is not obviously overvalued on revenue if growth is stable, but it still looks premium relative to
              current EBITDA and disclosure quality. That is why the base case hugs the old mark instead of assuming a
              clean step-up.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV030
              - CV032
              - CV034
              - CV035
              - CV036
