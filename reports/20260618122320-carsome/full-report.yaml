      - number: '7.2'
        title: Financial and Capital Structure Risks
        blocks:
          - type: paragraph
            body: >-
              Carsome's financial risk sits at the intersection of disclosure quality, leverage layering, and
              working-capital intensity. The positive fact is that Carsome reached reported adjusted EBITDA
              profitability in 2024 and improved it further in FY2025. The underwriting problem is that public
              disclosure still lags the headline narrative. The Edge noted that Carsome did not disclose how FY2024
              adjusted EBITDA was derived and did not provide a fuller revenue or statutory bridge in the profitability
              statement. Historical downside evidence is also real: an audited-report-derived secondary analysis cited
              roughly US$114 million of operating cash burn in 2021. Meanwhile the capital stack has become more layered
              over time, with 2021 conventional debt, 2023 venture debt, 2024 working-capital lines, and a 2025 HSBC
              facility on top of equity financing. Because Carsome holds used-car inventory and finances both retail
              buyers and dealers, even small errors in pricing, turn speed, credit quality, or residual-value
              assumptions can transmit directly into liquidity and margin pressure. FX adds another layer because
              Carsome operates across MYR, IDR, SGD, and THB while many investors summarize the business in USD.
