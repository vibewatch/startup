              WapCar, while the iCar Asia corporate site still claims millions of monthly users, large listing volumes,
              and dealer leads. Public sources therefore support a real feedback loop between content discovery,
              pricing, dealer liquidity, financing, and reconditioning decisions. The gap is that public materials do
              not disclose the exact AVM feature schema, benchmark error rates, or how much of the moat remains durable
              once competitors consolidate similar cloud tooling. Carsome's moat looks strongest in transactional data
