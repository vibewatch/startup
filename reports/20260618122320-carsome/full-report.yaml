      - number: '5.5'
        title: Technology Risks and Quality Challenges
        blocks:
          - type: paragraph
            body: >-
              Carsome's main product and technology risks are concentration, complexity, and execution quality. First,
              the 2025 cloud move makes Google Cloud a more central dependency for core operations, data pipelines, and
              AI tooling. The migration likely improves speed and cost, but it also raises concentration risk around one
              hyperscaler and one implementation partner. Second, Carsome's ecosystem has become broad enough that
              integration risk is real. The company has to coordinate inspection centers, refurbishment facilities,
              dealer liquidity, financing partners, content/media properties inherited from iCar Asia, and multiple
              user-facing apps. Public sources prove the business breadth, but they do not expose the internal
              integration architecture, reliability targets, or the change-management burden of combining acquired
              portals with Carsome's transaction systems. Third, quality control still looks like a meaningful
              operational risk. An independent 2025 ASET case study on Carsome Certified Lab found roughly 30% of
              vehicles required rework because of initially missed defects, especially aesthetic ones, and tied better
              QC thoroughness to higher satisfaction. That does not invalidate the Certified Lab model, but it does show
              that standardization is not yet fully solved. Finally, reputational and compliance discipline matters
              because trust is central to Carsome's model; the 2024 review-incentive controversy shows how quickly a
              growth campaign can undermine the credibility of customer-satisfaction signals. Together, these risks make
              Carsome's tech story investable but not low-maintenance.
