  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Last Known Valuation and History
        blocks:
          - type: paragraph
            body: >-
              Carsome's clearest valuation anchor is still the January 2022 Series E, when Tracxn and Reuters-relayed
              reporting pegged the company at US$1.7 billion after a US$300 million round led by 65 Equity Partners,
              SeaTown, and QIA. That mark matters because it remains the only widely cited priced valuation in the
              public record. Since then, the company has continued raising capital, but later rounds have not clearly
              reset the headline number. Tracxn shows a US$200 million 2023 Series E extension, a US$21.4 million 2024
              AmBank round, a US$15 million 2025 HSBC debt facility, and a more than US$30 million March 2026 Series F
              led by HKIC, Gobi, and Asia Partners. None of those later disclosures published a new post-money value. As
              a result, investors should treat US$1.7 billion as the last known priced mark, not as a 2026
              market-clearing fact. The extra nuance is dilution math: if the US$1.7 billion figure was a pre-money
              reference, the US$300 million round implied about 21% new equity; if it was post-money, dilution would
              have been closer to 18%.
            claimRefs:
