      - number: '7.4'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Carsome's regulatory burden has widened from vehicle-transfer compliance into a more demanding
              financial-services and cross-border governance surface. The most important overlay is Bank Negara
              Malaysia. Carsome is part of the KAF-led digital-bank consortium, which raises the bar on technology risk,
              resilience, and board oversight even before one asks how much financial activity will ultimately sit
              inside regulated entities. The November 2025 RMiT revision is especially relevant because the legal and
              technical commentary around it emphasizes stronger cyber controls, vendor governance, fraud management,
              resilience metrics, and in some cases broader applicability to non-bank participants. Malaysia's
              automotive transaction rules matter too: appointed inspection operators must meet capitalization, MySIKAP
              integration, and ISO requirements, while ownership transfers require biometric verification and passed
              inspections. Outside Malaysia, Carsome's cross-border compliance load rises because Indonesia splits
              fintech supervision between Bank Indonesia and OJK, and consumer-protection baselines differ across
              Singapore and Thailand. The risk is not one known enforcement action today; it is that compliance
              complexity compounds as Carsome mixes used-car transactions, financing, data, and digital-bank adjacency
              across four markets.
