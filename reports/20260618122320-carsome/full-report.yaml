              million raised across 17 rounds, while CB Insights shows US$695.22 million across 17 fundings, a
              difference that likely reflects what each database includes as debt, extensions, or undisclosed amounts.
              The broad chronology is still consistent: seed and Series A rounds financed early expansion; Series B and
