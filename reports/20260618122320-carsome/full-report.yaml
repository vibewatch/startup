      - number: '2.3'
        title: Customer Segmentation and Digital Adoption
        blocks:
          - type: paragraph
            body: >-
              Demand is not homogeneous across the region. Value-seeking households still anchor volume, but their
              purchase

              criteria vary by income, road conditions, and financing access. Ride-hailing and fleet-adjacent buyers are
              an

              especially important segment in Indonesia and Thailand, where affordable sedans and hatchbacks support
              urban earning

              use cases and where embedded financing can unlock first-time ownership. Family buyers increasingly prefer
              SUVs because

              ride height, cabin space, and rural-road compatibility matter more than traditional sedan economics in
              many markets.

              Certified inventory commands a premium because buyers are paying to reduce information asymmetry:
              warranties,

              standardized inspections, transparent service history, and reconditioning matter more when accident and
              mileage data

              are not consistently portable across the region. Digital adoption is therefore strongest when the platform
              can pair

              online discovery with offline assurance. Carsome's model is well aligned with this behavior because it
              monetizes

              inspection, trust, ancillary finance, and after-sale confidence rather than simply classifieds traffic.
              The buyer

              willingness-to-pay story is strongest in urban, time-constrained, and credit-using segments, and
              materially weaker in

              purely price-led informal transactions.
            claimRefs:
              - CM013
              - CM017
