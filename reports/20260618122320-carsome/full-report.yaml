      - number: '7.3'
        title: Competitive Threats
        blocks:
          - type: paragraph
            body: >-
              The competitive risk to Carsome is not just that rivals exist, but that multiple competitor types attack
              different parts of the stack at once. Carro is the clearest organized threat because it still has scale,
              fresh capital, a possible 2026 IPO path, and an explicit EV- and PHEV-adjacent strategy. Paultan's seller
              comparison is a useful warning signal: Carsome cannot assume it will always win the best bid or deepest
              dealer response in local liquidity contests. Traditional dealers remain dangerous for a different reason.
              Even after years of platform build-out, offline dealers still control most used-car volume in Southeast
              Asia, so Carsome must industrialize trust and financing faster than incumbents can digitize just enough to
              defend share. The financing flank is also open. Carsome's ancillary upside depends on Carsome Capital, yet
              the same banks now funding Carsome can also deepen their own automotive-finance distribution. Finally, EV
              transition is double-edged: it creates product opportunity, but it also introduces residual-value,
              battery-standard, and financing uncertainty that could reward faster-moving rivals or punish inventory
              holders that misprice the mix shift.
