      - number: '2.4'
        title: Regulatory Environment
        blocks:
          - type: paragraph
            body: >-
              Regulation is not a side issue in this market; it directly shapes trust, transfer speed, and financing
              economics.

              Malaysia is the most visibly relevant near-term market for Carsome because MOT has liberalized
              change-of-ownership

              inspections beyond the Puspakom monopoly and named Carsome Academy among the four new operators. That
              opens a path

              for Carsome to sit closer to the transaction-control point, though it also comes with capital,
              systems-integration,

              and accreditation requirements. Singapore sits at the other end of the spectrum: the COE regime and quota
              system make

              used-car economics highly transparent but also structurally expensive, while CPFTA gives buyers a clearer
              statutory

              baseline for unfair practices and non-conforming goods. Thailand's framework matters because digital
              lending, virtual

              banking, and platform verification rules are tightening simultaneously, which should raise compliance
              costs but also

              reward better-governed operators. Indonesia remains the deepest upside market by population, but
              regulatory oversight

              is split between OJK and Bank Indonesia, making used-car fintech and payment workflows more complex.
              Across all four

              countries, the direction of travel favors formal operators that can handle licensing, AML, KYC,
              documentation, and

              platform verification at scale.
