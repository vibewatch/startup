            body: >-
              The strongest financial evidence in the chapter is Carsome's stepwise improvement in profitability. The
              first operational profitability marker appeared in 2023, the first quarterly EBITDA-positive disclosure
              came in 1Q2024, FY2024 closed with US$10.5 million of adjusted EBITDA, and FY2025 more than doubled that
              figure to US$23 million. Public disclosures repeatedly attribute the turn to unit economics rather than to
              headline volume alone. GPU grew 48% in 2023, 25% in FY2024, 24% year on year in 1Q2025, and 22% for FY2025
              overall. Management ties that improvement to stronger vehicle margins, pricing optimization, greater
              monetization of ancillary services, and lower refurbishment and logistics costs. CAC fell 37% by FY2024,
              which matters because Carsome's integrated media, retail, and financing ecosystem appears to lower the
              cost of demand capture relative to a stand-alone used-car dealer. The margin story is therefore plausible:
              Carsome is no longer relying only on metal spread, and its best public disclosures show an ecosystem
