      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue says fair; EBITDA says still premium
            body: >-
              Carsome's US$1.7B mark is not obviously irrational once revenue scale and ancillary upside are considered,
              but it still looks premium on current EBITDA and disclosure quality. The right underwriting stance is fair
              rather than cheap.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV026
              - CV027
              - CV032
          - type: callout
            title: The biggest valuation gap is not growth, it is price discovery
            body: >-
              Carsome may well deserve to remain a unicorn, but the public record still lacks a fresh priced round,
              audited statutory earnings, and transparent adjustment bridges. That makes the 2022 mark a reference
              point, not proof of current fair value.
            calloutType: risk
            claimRefs:
              - CV018
