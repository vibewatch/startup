              than as a clean audited time series. The public record supports a large scale-up into 2021 and 2022, but
              not every source appears to use the same revenue basis. Carsome's June 2023 financing announcement said
              2022 revenue grew 250% to US$1.5 billion and that Carsome Certified contributed 35% of total revenue,
              while audited-report-derived secondary analysis cited US$655.9 million of 2021 revenue and US$35.9 million
              of gross profit for that year. Later public databases add another wrinkle: GetLatka lists US$305 million
              of 2024 revenue, even though Carsome's own 2Q2024 release said quarterly revenue alone exceeded US$310
              million. That mismatch strongly suggests some sources are mixing net revenue, broader top line, or
              database normalization rules. What is directionally clear is that Carsome has grown from a
              transaction-heavy used-car platform into a multi-line ecosystem where vehicle sales still anchor volume,
