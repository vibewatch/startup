      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Carsome's funding history shows a long private-market build from seed capital in 2015 to multiple
              late-stage extensions and debt lines by 2026. Tracxn records roughly 838 million dollars raised across 17
              rounds, with early backing from IdeaRiverRun, 500 Durians, Spiral Ventures, Gobi Partners, and Burda
              before the cap table shifted toward larger institutional names such as 65 Equity Partners, SeaTown
              Holdings, Qatar Investment Authority, MediaTek, and later AmBank, HSBC, and HKIC. The most durable
              valuation marker remains the January 2022 Series E, when Carsome reached a reported 1.7 billion dollar
              valuation. Later disclosed financings appear more incremental than transformational: a 200 million dollar
              2023 Series E extension, a 21.4 million dollar 2024 AmBank round, a 15 million dollar 2025 HSBC debt
              facility, and a more than 30 million dollar Series F in March 2026 led by HKIC with Gobi and Asia
              Partners. This mix implies the company has been financing toward profitability and ecosystem expansion
              rather than toward a brand-new hypergrowth phase, while still avoiding a public down-round signal.
