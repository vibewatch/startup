      - number: '8.3'
        title: IPO Pathway and Exit Scenarios
        blocks:
          - type: paragraph
            body: >-
              Carsome's most credible path to price discovery is an IPO, but management and investors are still
              balancing venue, liquidity, and timing. Eric Cheng told Vulcan Post that the company was targeting a
              listing in the next 12 to 24 months, that Bursa Malaysia had a slight edge, and that internal readiness
              depended on having control over the next three earnings results after listing. That framing is important
              because it shows Carsome sees sustained profitability, not just one profitable year, as the gating item
              for an IPO-quality story. News24's Reuters-relayed interview struck a similar tone: Carsome was ready for
              an IPO but not in a rush and remained open to dual-listing if exchange liquidity and investor appreciation
              were stronger elsewhere. The Edge's late-2025 feature adds a structural caveat. Local investors may
              understand the brand better and be more patient through quarter-to-quarter volatility, but Bursa's
              historical preference for profitability and predictability can limit how aggressively venture-style tech
              multiples travel into public markets. In practice, Bursa looks like the cleaner first venue, but it may
              not deliver the most generous headline valuation unless Carsome enters with several more profitable
              quarters and tighter disclosure.
            claimRefs:
