      - number: '6.5'
        title: Customer Concentration and Geographic Mix
        blocks:
          - type: paragraph
            body: >-
              Carsome's customer concentration risk appears to be geographic and channel-based rather than tied to one
              disclosed enterprise account. Public materials repeatedly point to Malaysia as the core operating market
              and to Singapore as the second-strongest profit pool, while Indonesia and Thailand are described as softer
              or more variable. FY2025 commentary said profitable growth was led by Malaysia and Singapore despite
              softer regional market conditions, and the Q1 2026 release repeated that Malaysia and Singapore continued
              to show operational strength while Indonesia and Thailand remained uneven. That makes the customer base
              regionally diversified in footprint but still concentrated in two higher-quality markets.


              Channel mix also matters. The clearest disclosed split is from the 2023 financing announcement, where
              management said the regional retail line Carsome Certified contributed 35% of 2022 revenue. That implies
              roughly two-thirds of revenue still came from wholesale transactions and other ecosystem lines at that
              point, even before later financing and aftersales growth. Management also said more than 80% of trade
              margin in Q1 2023 still came from transaction margins, which supports the view that Carsome is improving
              customer quality faster than it is fully diversifying revenue quality. What remains missing is
              cohort-level disclosure: there is no public repeat-purchase rate, revenue per customer, or logo-retention
              table by market. As a result, the best-supported conclusion is that Carsome's customer quality has
              improved materially, but investors still have to infer concentration, retention, and monetization quality
              from proxy metrics such as NPS, CAC, GPU, financing performance, and market commentary.
            claimRefs:
              - CU023
              - CU024
              - CU025
              - CU026
              - CU037
