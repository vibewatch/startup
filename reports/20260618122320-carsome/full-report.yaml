      - number: '3.3'
        title: Carsome's Competitive Moats
        blocks:
          - type: paragraph
            body: >-
              Carsome's moat is built from the interaction of physical infrastructure, data, brand, and embedded
              financial services rather than from any single feature. First, inspection and certification matter because
              they compress information asymmetry in a category where trust is still weak; Carsome's 175-point process
              and Certified promise give the company a repeatable standard that traditional dealers often cannot match
              consistently. Second, the network moat is real. Carsome says it has more than 80 centers across 50-plus
              cities and more than 13,000 dealers, which creates inventory throughput, geographic convenience, and B2B
              liquidity. Third, the company now has meaningful ecosystem leverage: iCar Asia contributes content, dealer
              advertising, and lead generation, while Carsome's own disclosures show digital monthly active users above
              18 million after the integration. Fourth, Carsome Capital matters because it converts transaction data
              into financing economics. Management says the business became one of the group's earliest profitable
              entities, with revenue up more than 80% in 2023 and underwriting built on more than 500,000 managed
              transactions. Finally, scale is now visible enough to matter strategically. The group crossed 500,000 cars
              sold, maintained 150,000-plus annual sales in recent years, and reported improving margins and positive
              EBITDA, which together make the platform harder to displace with a lightly capitalized copycat.
