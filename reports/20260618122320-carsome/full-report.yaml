  productSummary: >-
    An integrated automotive e-commerce platform offering: (1) C2B used-car buying with 175-point digital inspection and
    instant pricing; (2) Carsome Certified reconditioning and retail (1-year warranty, 14-day money-back guarantee); (3)
    B2B wholesale dealer auctions; (4) Carsome Capital for consumer and dealer financing and insurance; and (5)
    aftersales services through Carsome Service Centers.
  customerFocus: >-
    Private car sellers (C2B), used car buyers seeking quality-certified vehicles (B2C), and a 13,000+ dealer network
    (B2B wholesale). Secondary: car financing customers through Carsome Capital.
  businessModel: >-
    Revenue from vehicle transaction spreads (buy-low/sell-high after reconditioning), dealer wholesale commissions, and
