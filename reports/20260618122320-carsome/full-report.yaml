        - Confirms that the 2022 anchor was too high for current markets.
        - Re-underwrite immediately; do not rely on stale carrying value.
      - - IPO delay without profit momentum
        - No credible listing path by 2027 despite profitability claims
        - Weakens the argument that public markets will clear a premium multiple soon.
        - Shift to bear-case range until exit visibility improves.
      - - Statutory earnings materially below adjusted EBITDA
        - Audited bridge shows weak cash conversion or aggressive add-backs
        - Reduces confidence in EBITDA-based valuation support.
        - Cut valuation multiple and require a bigger discount.
      - - Ancillary expansion stalls
        - Ancillaries remain stuck near ~20% of revenue with weak attach growth
        - Undercuts the premium ecosystem narrative versus pure used-car retail.
        - Lower revenue-multiple assumptions toward sector averages.
      - - Macro financing squeeze
        - Inventory or dealer-financing liquidity tightens materially
        - Raises working-capital risk in an inventory-heavy model.
        - Favor base-to-bear range and shorten hold assumptions.
