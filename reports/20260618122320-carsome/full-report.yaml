      - number: '3.4'
        title: Competitive Threats and Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Carsome's advantages are meaningful, but they are not unassailable. The first threat is Carro's sustained
              capital access and regional ambition. Tracxn, Dealroom, Reuters, and Carro's own 2025 announcement
              together show a competitor that still raises fresh money, transacts over 100,000 vehicles annually, and is
              preparing for a possible 2026 US IPO. The second threat is that seller liquidity can be multi-homed.
              Paultan's comparison does not prove Carro always wins, but it does prove that Carsome cannot assume the
              highest bid or deepest dealer response in every case. Third, the used-car category is shifting toward
              financing, insurance, and EV residual-value management. Moladin's pivot toward lending and Carro's
              explicit push into Japanese PHEVs suggest that the next competitive layer may center more on credit,
              underwriting, and battery-risk confidence than on lead generation alone. Fourth, Carsome still carries
              reputational execution risk: the myTukar review-incentive controversy is not thesis-breaking, but it is a
              reminder that trust advantages can erode if marketing behavior or service consistency slips. Finally, OLX
              Autos' retreat should not be misread as permanent relief. It removes one aggressive rival, but it also
              demonstrates how operationally punishing this category can be when volume growth outruns margin
              discipline.
