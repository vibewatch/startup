      - number: '2.2'
        title: Market Structure and Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              The market remains structurally fragmented even as digital platforms gain share. Mordor's 2025 channel mix
              shows

              offline dealers still holding 61.24% of market share, while organized providers account for only 44.74%,
              meaning the

              formal channel is growing but still competes against a much larger long tail of informal lots, curbside
              sellers, and

              peer-to-peer transactions. Financing is similarly underpenetrated: financed transactions represent just
              31.55% of

              2025 share, which leaves room for platforms with embedded credit, warranty, and verification to take share
              from cash

              transactions. Competitive concentration is low. GMI says the top five platforms together held only 7%
              share in 2024,

              with Carro at 4.7%, so Carsome is competing in an early formalization phase rather than a winner-take-all
              market.

              Carsome's advantage is service depth across inspection, refurbishment, and ancillaries in its four-country
              footprint,

              but evidence from public seller comparisons shows liquidity is not uniformly superior in every listing.
              The result is

              a market where scale, trust, and financing matter, but where local execution and channel physics still
              leave plenty

              of room for multiple organized winners alongside a durable informal base.
