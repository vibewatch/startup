  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Carsome is a Southeast Asian integrated used-car platform founded in 2015 in Malaysia and now
              headquartered in Petaling Jaya, Selangor. Official company materials consistently describe a model that
              starts with consumer vehicle sourcing, passes through inspection and optional dealer bidding, and then
              monetizes inventory through wholesale, certified retail, financing, insurance, and aftersales services.
              That matters because Carsome is not just a classifieds marketplace or a single-channel dealer; it has
              built a closed-loop operating system intended to control more of the transaction, refurbishment, and
              ownership lifecycle. Public scale markers support that positioning, including more than 80 centers across
              50-plus cities, over 13,000 dealers in the network, and more than 18 million bids recorded on the
              platform. The strongest current consumer promise sits inside Carsome Certified, where the company
              advertises a 175-point inspection process, a one-year warranty, and a 14-day money-back guarantee.
              Together, those elements show a business trying to combine digital liquidity, physical operations, and
              trust guarantees into one regional used-car platform.
