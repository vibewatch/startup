  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              Carsome's customer base is best understood as a connected four-sided ecosystem rather than as a single
              retail audience. On the supply side, the original C2B seller segment remains foundational: consumers book
              inspections online, bring vehicles to an inspection center, receive a condition report, and then either
              take an on-the-spot offer or allow dealer bidding through Carsome's wholesale channel. On the demand side,
              retail B2C buyers engage through Carsome Certified, where the company emphasizes 360-degree listing views,
              fixed pricing, test drives, financing support, and end-to-end paperwork handling. A third segment consists
              of used-car dealers, who matter both as liquidity providers in wholesale auctions and as customers for
              dealer financing. The fourth segment is the financing customer base served by CARSOME Capital, which spans
              both retail borrowers and dealers using working-capital facilities.


              This segmentation matters because Carsome's go-to-market is not purely transactional. The company is
              trying to monetize the full ownership journey: discovery, inspection, bidding, retail purchase, financing,
              insurance, service, and later resale. The iCar Asia acquisition broadened the top of funnel by connecting
              content, research, listings, and transaction layers, while MyGarage and aftersales features extend the
              relationship beyond the initial sale. Public materials consistently frame customer experience as a trust
              problem to be solved through inspection standardization, pricing transparency, and integrated service.
              That positioning is credible because Carsome's product pages, corporate timeline, and financing materials
              all point to the same model: a seller-acquisition engine feeding a wholesale and retail marketplace, then
              deepened by ancillary financial products and post-purchase engagement.
