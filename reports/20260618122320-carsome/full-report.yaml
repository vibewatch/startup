        - Maintain valuation discount and avoid public-market style comparables.
      - - Regulated-finance control gap
        - BNM / KAF / RMiT control deficiency, delayed readiness, or adverse compliance finding
        - Any evidence Carsome-adjacent regulated activity lacks mature governance or vendor controls
        - Re-rate finance-adjacency upside downward and widen legal diligence.
      - - Geographic concentration worsens
        - Malaysia / Singapore carry profits while Indonesia / Thailand stay structurally weak
        - Two consecutive periods of weakness outside core markets without corrective productivity gains
        - Lower regional expansion value and treat multi-country footprint as complexity, not moat.
      - - EV inventory mispricing
