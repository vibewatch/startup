callouts:
- calloutType: strength
  title: Trust features appear to convert into customer advocacy
  body: Carsome is unusual among private used-car platforms in disclosing both retail and wholesale NPS, and the disclosed direction is positive. The combination of 175-point inspection, 1-year warranty, 14-day money-back guarantee, digital 360-degree listing views, and MyGarage-based aftercare creates a coherent trust stack that helps explain why retail NPS reportedly moved from 77 to 83 while CAC fell 37%.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU018
  - CU019
  - CU020
- calloutType: risk
  title: Operational consistency still lags the headline narrative
  body: The same public record that supports Carsome's traction also surfaces service-quality friction. Refund delays, seller payout complaints, review-incentive allegations, and a 30% rework rate in a 2025 quality-control case study all point to execution inconsistency. Geographic quality is also likely uneven because management repeatedly describes Malaysia and Singapore as strongest while Indonesia and Thailand remain softer or more variable.
  claimRefs:
  - CU024
  - CU027
  - CU029
  - CU030
  - CU032
  - CU033
  - CU036
