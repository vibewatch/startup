  - type: missing-source
    severity: major
    topic: repeat purchase and revenue per customer
    missingEvidence: Carsome does not publicly disclose repeat-buyer rate, repeat-seller rate, revenue per customer, or cohort retention by market.
    whyItMatters: These are the cleanest measures of demand durability and customer quality; proxy metrics such as NPS and CAC cannot fully substitute for cohort economics.
    diligencePath: Request cohort retention and ARPU-style reporting by retail buyer, seller, dealer, and financing customer segment, broken out by Malaysia, Singapore, Indonesia, and Thailand.
