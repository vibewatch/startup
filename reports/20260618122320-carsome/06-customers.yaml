- id: customer-satisfaction-and-quality-indicators
  title: Customer Satisfaction and Quality Indicators
  body: 'Carsome has disclosed unusually strong top-line satisfaction markers for a used-car platform. In the June 2023 financing round announcement, the company said Carsome Certified held an NPS of 77 and the wholesale business an NPS of 75 as of Q1 2023. By the May 2024 profitability announcement, Carsome said retail NPS had improved from 77 to 83 and wholesale NPS had risen to 76. If those figures are measured consistently, they imply both a strong customer-value proposition and real progress in retail execution. The trust package around Carsome Certified helps explain why. Carsome''s Malaysian product pages emphasize a 175-point inspection, professional refurbishment, 360-degree imagery, no hidden fees, a one-year warranty, and a 14-day money-back guarantee, while the buying flow adds financing, paperwork support, delivery, and post-sales assistance.


    Retention and engagement evidence is thinner than the headline NPS numbers, but there are meaningful signals. MyGarage was launched in 2023 as a customer experience hub and is described as a place for real-time valuations, service bookings, sales inspections, insurance reminders, and one-tap resale or servicing. That matters because it creates a reason for customers to re-enter the ecosystem after purchase instead of treating Carsome as a one-off marketplace. CARSOME Capital adds another stickiness layer by giving retail buyers financing of up to 108 months and giving dealers inventory financing up to 80% of vehicle value. Credit quality disclosures are also relatively strong for a private company: The Star reported retail NPL below 2% and wholesale NPL at 0.1% in late 2024. The main caveat is consistency. Carsome''s own regional pages do not present identical buyer promises in every market, and an external 2025 quality-control case study still found meaningful rework and aesthetic dissatisfaction
    in the refurbishment process.'
  claimRefs:
