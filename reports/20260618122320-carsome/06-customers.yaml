  - type: missing-source
    severity: major
    topic: named-customer-proof-table completeness
    missingEvidence: Carsome does not publish a named enterprise-style customer logo list by revenue tier, so TU005 relies on segment-level proof rather than a full named-customer roster.
    whyItMatters: Without a disclosed list of top buyers, dealers, financing counterparties, or repeat sellers, concentration and retention cannot be underwritten with public-markets precision.
    diligencePath: Request top customer, top dealer, and financing attach-rate breakdowns by market; pair those with repeat-purchase and repeat-seller cohort tables.
