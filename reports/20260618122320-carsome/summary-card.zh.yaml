  topStrengths:
    - 市场领导地位：按交易量计为东南亚最大二手车平台（每年 150K+ 辆，自成立以来 500K+ 辆）
    - 先发护城河：175 点 Carsome Certified 品牌、13,000+ 经销商网络，以及覆盖 50+ 城市的 80+ 线下中心
    - 盈利路径已验证：FY2024 调整后 EBITDA $10.5M → FY2025 $23M；GPU 同比增长 25%+
    - 技术差异化：AI 定价引擎（200+ 数据点、500K+ 笔交易），并接入 Google Cloud + Vertex AI
    - 附加收入还有空间：Carsome Capital 增长很快；金融和保险仍约占收入 20%，低于 Carvana 的 50%
    - 投资者背书强：QIA、65 Equity、SeaTown、Gobi、HKIC——机构阵容深
  topRisks:
    - 估值偏旧：$1.7B 标记来自 2022 年 1 月泡沫期；此后没有公开重定价；4+ 年未做股权估值刷新
    - 只披露调整后 EBITDA——没有经审计 GAAP P&L；真实盈利能力和债务服务覆盖率未披露
    - 库存与汇率风险：持有会贬值的 ICE 车辆；以 USD 报告时暴露于 MYR/IDR/THB
    - Carro 以及银行支持的平台进入汽车金融，带来竞争压力
    - 翻新质量缺口：2025 年案例研究提到约 30% 车辆返工率，退款 / 服务投诉也有记录
    - IPO 时间不确定：取决于连续 3+ 个盈利季度；FY2025 印尼 / 泰国市场偏弱
  unresolvedGaps:
    - 经审计 GAAP 财务报表未公开；调整后 EBITDA 调节表未披露
    - 按地区拆分的收入（Malaysia、Indonesia、Thailand、Singapore）未公开
    - Carsome Capital 完整资产负债表、2023 年之后 NPL 趋势和资金成本结构不可得
    - 截至 2026 年 6 月，IPO 时间表和上市交易所仍未确认
    - 创始人和关键投资者的 cap table 与准确持股比例未披露
