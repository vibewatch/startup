chapter:
  number: 5
  letter: E
  title: Product & Technology
  summary: Carsome has evolved from a used-car listing and auction intermediary into a multi-surface automotive platform that spans consumer buying and selling, dealer liquidity, refurbishment, financing, aftersales, and content. Public evidence supports a real data-and-AI stack built on BigQuery, Vertex AI, Looker, and workflow automation, but the same evidence also shows dependence on Google Cloud, uneven public disclosure of reliability metrics, and quality variance inside the Certified Lab process.
sections:
- id: core-product-offering-and-customer-journey
  title: Core Product Offering and Customer Journey
  body: 'Carsome''s core product is no longer a single auction site. The public product surface now spans a consumer app, seller inspection flow, dealer bidding tools, Carsome Certified retail inventory, financing support, aftersales services, and refurbishment operations. For consumers, the app and website support browsing certified inventory, reviewing inspection reports, booking test drives, estimating monthly payments, and getting instant valuation signals when selling a car. MyGarage extends that journey after purchase by storing vehicle details, showing estimated value, reminding users about road-tax and insurance renewals, and letting them book servicing. For supply acquisition, Carsome keeps the seller workflow tightly connected to inspection and bidding: sellers book an inspection, the vehicle is checked using a 175-point process, and then Carsome can route the car either into dealer bidding or into its own certified retail/refurbishment path. CARagent digitizes the agent-assisted
    version of that workflow by letting field agents book appointments, monitor live bids, view 175-point reports, and track same-day commissions. On the dealer side, Carsome combines the lightweight CARdealer app with a fuller dealer dashboard that exposes marketplace listings, mileage, location, inspection reports, bidding, payment, and drawdown financing. The result is a deliberately integrated C2B-to-B2B/B2C product journey rather than a narrow classifieds model.'
