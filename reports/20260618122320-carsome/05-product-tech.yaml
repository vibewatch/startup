- id: technology-stack-and-ai-capabilities
  title: Technology Stack and AI Capabilities
  body: The public technology record is strongest around Carsome's 2025 consolidation onto Google Cloud. Multiple sources describe Carsome as moving from a multicloud setup to a unified Google Cloud operating model built around BigQuery for warehousing, Looker for business intelligence, Google Marketing Platform for activation, and Vertex AI for ML and generative-AI use cases. That architecture is tied directly to core operating workflows rather than to a generic digital-transformation story. Carsome and independent trade press both describe a pricing engine that uses model, age, mileage, and other inputs to predict realistic car values, a photo-analysis system that masks plate numbers while speeding inspection handling, and a semantic-search layer built with BigQuery plus Vertex AI Agent Builder to surface enterprise knowledge across teams. The cloud move is also meant to strengthen software development velocity by moving operational applications and databases onto a common stack and by
    using Google Security Command Center plus built-in access controls for threat detection and response. Carsome has added a gen-AI contact-center capability that scores customer interactions and suggests performance improvements for agents, showing that the company is trying to push AI beyond pricing into service quality and internal knowledge retrieval. This is more substantive than a typical startup AI label, although public evidence still stops short of showing model accuracy benchmarks, uptime SLOs, or detailed architecture diagrams.
