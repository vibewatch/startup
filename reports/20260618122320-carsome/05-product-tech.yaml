  evidenceGaps:
  - type: missing-source
    severity: material
    topic: avm-transparency
    missingEvidence: A public technical note or benchmark that documents the exact AVM feature set, calibration approach, and pricing error rates.
    whyItMatters: Carsome's moat narrative leans heavily on pricing intelligence, but public sources in this run stop at broad descriptions and do not verify the exact depth or accuracy of the model.
    diligencePath: Request internal product or risk documentation on pricing-model inputs, holdout accuracy, override rates, and how EV depreciation is being added to the model.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: cloud-reliability-security
    missingEvidence: Independent uptime, incident-history, or security-certification evidence for Carsome's consolidated cloud and customer-facing apps.
    whyItMatters: Google Cloud tooling and Security Command Center are named publicly, but outside investors still cannot verify operational resilience, incident discipline, or audit depth from the source set alone.
    diligencePath: Ask management for incident logs, uptime dashboards, penetration-test summaries, audit reports, and the post-migration operating model with Searce.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: post-acquisition-integration
    missingEvidence: Architecture-level disclosure of how iCar Asia properties, Carsome transaction systems, and data pipelines are integrated or still segmented.
    whyItMatters: Integration complexity is a core risk to release velocity, analytics consistency, and customer experience, especially as Carsome uses content/media assets as part of its moat story.
    diligencePath: Request platform-integration roadmaps, data-governance diagrams, and KPI ownership for Carlist/WapCar/Carsome cross-sell flows.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: app-release-visibility
    missingEvidence: A public changelog, release notes archive, or developer documentation for the consumer, agent, and dealer apps.
    whyItMatters: Public app-store surfaces prove the apps exist, but they do not make release cadence, roadmap scope, or reliability improvements legible to outside diligence teams.
    diligencePath: Ask product leadership for release calendars, defect backlogs, app analytics, and a map of which workflows still require human handoffs outside the apps.
    relatedQuestionRefs:
    - QE025
