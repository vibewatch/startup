callouts:
- calloutType: recommendation
  title: Revenue says fair; EBITDA says still premium
  body: Carsome's US$1.7B mark is not obviously irrational once revenue scale and ancillary upside are considered, but it still looks premium on current EBITDA and disclosure quality. The right underwriting stance is fair rather than cheap.
  claimRefs:
