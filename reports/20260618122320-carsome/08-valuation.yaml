- calloutType: risk
  title: The biggest valuation gap is not growth, it is price discovery
  body: Carsome may well deserve to remain a unicorn, but the public record still lacks a fresh priced round, audited statutory earnings, and transparent adjustment bridges. That makes the 2022 mark a reference point, not proof of current fair value.
