- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type
  - Metric / valuation
  - Relevance to Carsome
  - Key limitation
  rows:
  - - Carvana
    - Public comp
    - ~2.0x EV/revenue and ~18.4x EV/EBITDA on 2026-06-18 per Multiples.vc
    - Shows what a scaled public digital auto platform can trade at once disclosure is public-market grade.
    - Far larger, more liquid, and much more volatile than Carsome.
  - - CARS24
    - Private round
    - US$1.84B valuation on a US$450M round in Sep 2021
    - Useful private-market analog for a C2B/B2C used-car platform with financing adjacency.
    - India is a different market and the mark predates the 2026 environment.
  - - Carro
    - Private comp / IPO marker
    - US$3B+ to US$3.8B IPO ambition in 2025-2026
    - Closest Southeast Asian regional peer with capital-markets optionality.
    - An IPO ambition is not the same as a cleared valuation.
  - - Carsome
    - Private mark
    - US$1.7B last known priced valuation from Jan 2022
    - Anchor under review in this chapter.
    - Four years old by run date; not transparently refreshed.
  - - Automotive benchmark set
    - Sector benchmark
    - 2026 benchmarks emphasize adjusted EBITDA discipline and lower broad-sector revenue screens than peak-cycle private markets
    - Useful for sanity-checking whether a 2022-style unicorn multiple still belongs in 2026.
    - Sector averages and M&A guides are imperfect fits for a marketplace-fintech hybrid.
  notes: No single comp fully matches Carsome's Southeast Asian used-car marketplace plus financing ecosystem. Use the table as triangulation, not as a single-answer model.
  enumerationScope:
    coverage: partial
    basis: Covers the main public and private valuation references surfaced in 2021-2026 public evidence for digital used-car platforms and automotive platform benchmarks; excludes non-public secondary marks and private board materials.
