company:
  name: Carsome
chapter:
  number: 8
  letter: V
  title: Valuation
  summary: Carsome's last disclosed priced valuation remains US$1.7 billion from the January 2022 Series E. That mark is still defensible on a revenue lens but remains expensive on EBITDA and has not been re-cleared by a fresh lead-priced round through June 2026. Using FY2024 revenue of roughly US$305 million, FY2025 adjusted EBITDA of US$23 million, comparable platform comps, and Bursa-versus-overseas exit dynamics, the most supportable 2026 view is a base case of US$1.7 billion to US$2.0 billion, a bull case above US$2.5 billion, and a bear case of US$1.0 billion to US$1.4 billion. Investability is fair rather than obviously cheap because illiquidity, opaque EBITDA adjustments, and a 2022-vintage mark still require a private-market discount.
sections:
- id: last-known-valuation-and-history
  title: Last Known Valuation and History
  body: 'Carsome''s clearest valuation anchor is still the January 2022 Series E, when Tracxn and Reuters-relayed reporting pegged the company at US$1.7 billion after a US$300 million round led by 65 Equity Partners, SeaTown, and QIA. That mark matters because it remains the only widely cited priced valuation in the public record. Since then, the company has continued raising capital, but later rounds have not clearly reset the headline number. Tracxn shows a US$200 million 2023 Series E extension, a US$21.4 million 2024 AmBank round, a US$15 million 2025 HSBC debt facility, and a more than US$30 million March 2026 Series F led by HKIC, Gobi, and Asia Partners. None of those later disclosures published a new post-money value. As a result, investors should treat US$1.7 billion as the last known priced mark, not as a 2026 market-clearing fact. The extra nuance is dilution math: if the US$1.7 billion figure was a pre-money reference, the US$300 million round implied about 21% new equity; if
    it was post-money, dilution would have been closer to 18%.'
