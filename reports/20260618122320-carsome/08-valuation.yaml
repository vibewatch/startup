- id: valuation-multiples-and-comparable-analysis
  title: Valuation Multiples and Comparable Analysis
  body: 'The simplest way to test the US$1.7 billion anchor is against revenue and adjusted EBITDA. GetLatka''s public profile puts FY2024 revenue at roughly US$305 million, while Carsome''s official FY2024 statement disclosed US$10.5 million of adjusted EBITDA. On that base, the legacy valuation implies about 5.6x revenue and about 162x EBITDA. The revenue lens is demanding but not absurd for a regional marketplace with financing and ancillary upside; the EBITDA lens is clearly rich. FY2025 helps the story because Carsome doubled adjusted EBITDA to US$23 million, which brings the implied multiple down to about 74x. If FY2026 EBITDA doubled again to roughly US$46 million, the same enterprise value would compress to roughly 37x. Comparable screens point both ways. Multiples.vc showed Carvana at about 2.0x EV/revenue and 18.4x EV/EBITDA on 18 June 2026, while CompaniesMarketCap showed how quickly public market values can move from one cycle to another. Private peers still support Carsome''s
    relevance as a unicorn cohort: CARS24 raised at US$1.84 billion in 2021 and Carro was still being discussed around a US$3 billion-plus IPO ambition in 2025 to 2026. The conclusion is that Carsome can defend its revenue mark better than its EBITDA mark.'
