- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Type
  - What would change the view
  rows:
  - - Carsome has proven it can reach and sustain profitability while still growing ancillary revenues.
    - thesis
    - Statutory earnings or cash-flow disclosure materially diverges from adjusted EBITDA.
  - - The US$1.7B mark is still defendable on a revenue basis if growth and ancillary mix keep improving.
    - thesis
    - A new priced round or IPO feedback prices the company materially below 5x revenue.
  - - Bursa or another listing venue could reward Carsome's regional brand, local investor familiarity, and improving discipline.
    - thesis
    - IPO windows remain shut or management pushes timing beyond 2027.
  - - The 2022 mark is stale and has not been transparently revalidated by a broad primary round.
    - anti-thesis
    - A fresh lead-priced round or IPO filing reconfirms the valuation.
  - - Adjusted EBITDA remains management-defined, and The Edge highlighted that the 2024 adjustments were not disclosed.
    - anti-thesis
    - Carsome publishes an audited bridge from adjusted EBITDA to statutory net income and cash flow.
  - - Private-market illiquidity means late investors may not earn enough upside from a flat carry-forward valuation.
    - anti-thesis
    - Entry price moves materially below the legacy mark or exit visibility improves.
  notes: 'The core tension is simple: Carsome now looks operationally credible, but the valuation evidence is not yet public-market clean.'
