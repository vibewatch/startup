  - CV031
  - CV036
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financial statements
    - No public audited package with full income statement, cash flow, and balance sheet was located
    - Without audited statements, DCF and earnings-quality work stay shallow.
    - Company / IPO filing / direct diligence room request.
  - - Adjusted EBITDA reconciliation
    - No public bridge from adjusted EBITDA to statutory EBIT or net income
    - This is the cleanest test of whether Carsome deserves a premium multiple.
    - Finance team disclosure or prospectus.
  - - Cap table and preference stack
    - Public profiles hide some investors and no preference terms are disclosed
    - Liquidation preferences can materially alter common-equity outcomes.
    - Legal diligence, term sheets, or IPO prospectus.
  - - Current cash, debt maturities, and facility covenants
    - Public materials discuss financing lines but not full treasury detail
    - Inventory-heavy businesses can look profitable while carrying hidden funding risk.
    - Treasury schedule and lender documents.
  - - True 2026 valuation evidence
    - No broad lead-priced round or public offering refreshed the 2022 mark
    - Investors need a current market-clearing datapoint, not only historical carry values.
    - Fresh round, secondary tender, or IPO book-build feedback.
  notes: These asks are the minimum package needed before treating the legacy valuation as actionable rather than anecdotal.
