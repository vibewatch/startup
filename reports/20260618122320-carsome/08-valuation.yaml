- id: valuation-risks-and-caveats
  title: Valuation Risks and Caveats
  body: The main reason to haircut Carsome's headline valuation is not that the business lacks substance; it is that the valuation evidence is thinner than the operating progress. First, the 2024 and 2025 profitability releases emphasize adjusted EBITDA, but the company has not published a public reconciliation to statutory earnings or an audited GAAP-style financial package. The Edge made that criticism explicit when it noted that the 2024 adjusted EBITDA figure did not disclose the underlying adjustments and omitted fuller revenue detail. Second, the US$1.7 billion mark was set in the far friendlier 2022 venture market. Since then, broader automotive and technology multiples have compressed, and many private unicorn marks have needed larger discounts to clear secondary or IPO buyers. Third, March 2026 was described as a strategic round tied to AI, supply-chain collaboration, and Greater China connectivity, not a broad-based repricing event. Finally, Carsome remains private and illiquid,
    so investors should not treat the last round price like a continuously quoted public-market number. The right stance is that the company is investable, but only with a real private discount and a healthy skepticism toward any mark that has gone four years without transparent revalidation.
