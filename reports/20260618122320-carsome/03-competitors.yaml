chapter:
  number: 3
  letter: P
  title: Competitors
  summary: 'Carsome competes from a stronger position than most Southeast Asian used-car platforms because it combines physical operations, trust tooling, financing, and post-iCar distribution into one stack. The direct regional threat is Carro, which remains well-funded, geographically broader, and increasingly EV- and fintech-oriented. Moladin matters in Indonesia as a financing-led specialist, while OLX Autos now matters more as a warning about category difficulty than as an active aggressor. The deeper truth is that Carsome''s biggest rival is still fragmentation: traditional dealers and classifieds continue to control much of seller attention and transaction volume. Carsome''s sustainable advantages appear strongest in certification, dealer-network density, underwriting data, and ecosystem breadth; its more vulnerable advantages are local liquidity, marketing trust, and any area where sellers can easily multi-home across rival channels.'
sections:
- id: direct-competitors-market-map
  title: Direct Competitors and Market Map
  body: 'Carsome competes in a used-car market where the most important fact is not that digital players exist, but that they are still small relative to the offline long tail. Mordor says offline dealers still held 61.24% share in 2025, while Global Market Insights says the top five digital platforms collectively held only 7% share in 2024 and that Carro alone represented 4.7%. That means Carsome is fighting two battles at once: a direct battle against organized peers such as Carro and Moladin, and a broader battle against traditional dealers, classifieds, and informal transactions that still dominate customer behavior. In the organized cohort, Carro is the clearest regional benchmark because it combines C2B sourcing, B2C retail, financing, insurance, and aftersales across multiple Asia-Pacific markets. Moladin matters for a different reason: it is more Indonesia-centered and increasingly financing-led, which makes it relevant in the region''s biggest country market even without matching
    Carsome''s four-country operational depth. OLX Autos is now a retrenching rather than expanding threat, but its Indonesian exit is still strategically useful because it shows how hard it is to industrialize used-car operations at scale. Indirectly, Mudah, Carlist, dealer lots, and the legacy classifieds stack remain powerful because they still own discovery and seller attention even when they do not control fulfillment end to end.'
