callouts:
- calloutType: strength
  title: Carsome has more than a listings moat
  body: Carsome is hardest to displace where trust, underwriting, and post-sale control matter. The combination of inspection standards, dealer-network depth, Carsome Capital, and iCar-linked distribution means rivals must replicate both software and physical operations, not just website traffic.
  claimRefs:
  - CP003
  - CP007
  - CP010
  - CP011
  - CP036
  - CP046
- calloutType: risk
  title: Carro is the cleanest organized threat
  body: Carro is not just another dealer marketplace. It still raises fresh capital, is preparing for a possible 2026 IPO, transacts more than 100,000 vehicles annually, and can win specific sell-side liquidity contests. That makes it the most credible rival to compress Carsome's margin and growth narrative.
  claimRefs:
  - CP013
  - CP014
  - CP015
  - CP016
