- id: feature-capability-comparison
  title: Feature and Capability Comparison
  body: 'The competitive split is less about who has a website and more about who controls the critical steps of the transaction. Carsome''s strongest distinction versus classifieds and dealer lots is that it owns inspection, documentation, bidding, retail certification, financing, and aftersales in one stack. The 175-point inspection, one-year warranty, and 14-day money-back guarantee turn trust into a product rather than a marketing claim. Carro overlaps heavily on the same full-stack ambition and may be stronger in some seller-liquidity scenarios, as shown by Paultan''s side-by-side test where Carro attracted more dealers and a higher bid. Moladin competes differently: its official surface emphasizes dealer financing and an integrated automotive-finance ecosystem, which suggests it is fighting from the financing rail inward rather than from a broad regional consumer brand outward. Mudah and the broader classifieds layer still matter because they aggregate large volumes of listings and
    seller intent at low cost, but they generally stop short of owning inspection standards or the downstream economics of financing and aftersales. iCar Asia is strategically important inside this comparison because it gives Carsome a separate distribution and discovery channel through content, listings, dealer leads, and advertising inventory that pure transaction rivals do not fully match.'
