  - CP043
- calloutType: insight
  title: The real enemy is still fragmentation
  body: Even if Carsome out-executes Carro, the larger strategic challenge remains the fragmented long tail of dealers and informal transactions. Organized players are still single-digit winners inside a market where offline channels dominate and consumers often multi-home across sellers, dealers, and classifieds.
