- id: carsome-vs-carro-head-to-head
  title: 'Carsome vs Carro: Head-to-Head'
  body: 'Carsome and Carro are the only two competitors in this chapter that clearly look like regional full-stack champions rather than single-country or single-step operators. Both started in 2015, both combine transaction rails with financing and ancillary services, and both are large enough that management now talks about eventual public-market outcomes. The difference is where the edge sits. Carsome appears stronger on Southeast Asian transaction density, inspection standardization, dealer-network breadth, and integrated content reach after iCar Asia. It also has a more explicit trust narrative through Carsome Certified, an NPS uplift to 83, and public proof that Carsome Capital and ancillary services are improving profitability. Carro, by contrast, looks like the sharper capital-markets and expansion threat. Reuters says it is targeting a 2026 IPO above a US$3 billion valuation, while Carro''s own release says it transacts over 100,000 units a year across seven markets and is leaning
    into AI, fintech, insurance, aftersales, and EV-adjacent demand. The Paultan sell-side test is a useful caution: even if Carsome is larger overall, Carro can still win specific local liquidity contests. The net judgment is that Carsome''s advantages are probably more durable in trust, infrastructure, and underwriting, while Carro remains more dangerous in capital access, regional optionality, and aggressive product adjacency.'
