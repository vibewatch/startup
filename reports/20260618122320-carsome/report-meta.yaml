companyProfile:
  summary: "Carsome Group Inc is Southeast Asia's largest integrated car e-commerce platform, founded in 2015 in Kuala Lumpur, Malaysia by Eric Cheng and Teoh Jiun Ee. The company operates a full-stack C2B-to-B2C model: it buys used cars directly from consumers via a 175-point inspection process, reconditions them through its Carsome Certified Labs, and resells them to individual buyers and a dealer network of 13,000+ partners. With operations across Malaysia, Indonesia, Thailand, Singapore, and the Philippines, and over 500,000 cars sold since founding, Carsome achieved its first full-year adjusted EBITDA profitability ($10.5M) in 2024, followed by $23M in FY2025. The company is preparing for an IPO, with Bursa Malaysia as a likely listing venue."
  foundedDate: "2015-01-01"
  founders:
    - name: "Eric Cheng"
      role: "Co-Founder, Group CEO & Chairman"
      background: "Entrepreneur and technologist who co-founded Carsome in 2015 and has led the company from seed to unicorn status."
      claimRefs: ["CO012"]
    - name: "Teoh Jiun Ee"
      role: "Co-Founder, CEO of Carsome Academy"
      background: "Co-founder with background in digital media; served as COO and CBDO before transitioning to lead Carsome Academy."
      claimRefs: ["CO013"]
  foundingLocation: "Kuala Lumpur, Malaysia"
  headquarters: "Petaling Jaya, Selangor, Malaysia"
  productSummary: "An integrated automotive e-commerce platform offering: (1) C2B used-car buying with 175-point digital inspection and instant pricing; (2) Carsome Certified reconditioning and retail (1-year warranty, 14-day money-back guarantee); (3) B2B wholesale dealer auctions; (4) Carsome Capital for consumer and dealer financing and insurance; and (5) aftersales services through Carsome Service Centers."
  customerFocus: "Private car sellers (C2B), used car buyers seeking quality-certified vehicles (B2C), and a 13,000+ dealer network (B2B wholesale). Secondary: car financing customers through Carsome Capital."
  businessModel: "Revenue from vehicle transaction spreads (buy-low/sell-high after reconditioning), dealer wholesale commissions, and growing ancillary streams including financing origination fees, insurance, aftersales services (targeting 50% ancillary share over time, currently ~20%)."
  stage: "Series F / Late-Stage Private (pre-IPO)"
  fundingStatus: "Raised over $838M across 17 rounds (Seed 2015 through Series F March 2026). Last valuation $1.7B set at January 2022 Series E. Most recent round: $30M Series F (March 2026) from HKIC, Gobi Partners, and Asia Partners."
  disclosureProfile: "private-disclosed"
  claimRefs: ["CO001", "CO002", "CO003", "CO018", "CO020", "CO026", "CO030"]

