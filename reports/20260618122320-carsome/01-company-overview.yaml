  - id: operational-scale-milestones
    title: Operational Scale and Milestones
    body: >-
      Operationally, Carsome's public disclosures point to meaningful regional scale with improving unit economics. The company says it sold 150,000 cars in both 2022 and 2023, crossed 500,000 cumulative cars sold in 2024, and traded roughly 35,000 vehicles in 2Q2024 alone. Financially, 2024 appears to have been the break point. Carsome reported its first full year of profitability since inception, with about 305 million dollars of revenue, 10.5 million dollars of adjusted EBITDA, 25 percent GPU growth, and a 37 percent reduction in CAC. The positive momentum continued into 2025, when management reported 4.3 million dollars of adjusted EBITDA in the first quarter and 23 million dollars for the full fiscal year, alongside 142 million dollars of gross profit. The technology stack is also becoming more explicit. Independent reporting tied the 2025 Google Cloud migration to BigQuery, Vertex AI, and Looker, supporting AI pricing, analytics, and contact-center automation. The milestone pattern is therefore consistent: Carsome moved from geographic rollout and funding accumulation into process industrialization, profitability discipline, and ecosystem monetization.
