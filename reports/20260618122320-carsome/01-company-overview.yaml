    title: Integrated model is the strategic differentiator
    body: Carsome's clearest edge is its attempt to own sourcing, inspection, reconditioning, wholesale liquidity, certified retail, and ancillary monetization rather than functioning as only a listings marketplace.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO042
  - calloutType: insight
    title: 2024 is the key inflection year
    body: The combination of first quarterly profitability, 500,000 cumulative cars sold, and later confirmation of full-year EBITDA positivity makes 2024 the strongest public proof point that Carsome's cost reset translated into operating leverage.
    claimRefs:
