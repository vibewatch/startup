  - id: adverse-events-risk-factors
    title: Adverse Events and Risk Factors
    body: >-
      The main adverse evidence does not undermine Carsome's existence or core market position, but it does qualify execution quality and governance resilience. In September 2022, the company announced an accelerated profitability plan that included layoffs affecting about 10 percent of staff, with management also forgoing salaries. That episode was followed by public customer complaints in 2023 about slow refunds and delayed payments, which suggests internal process strain after the cost reset. Public materials also leave unresolved issues around the depth of board oversight, the exact economics and covenants of later debt facilities, and the operating status of some footprint claims such as the Philippines mention. Finally, several potentially important downside data points remain imperfectly sourced in this chapter's evidence pack, including allegations about incentivized five-star reviews and a 2025 reconditioning rework case study. Those topics do not invalidate the broader profitability turn, but they do mean investors should test service quality, complaint resolution, and inspection consistency rather than relying only on the company's trust messaging.
    claimRefs:
