      - FO002
  - id: founding-leadership-governance
    title: Founding, Leadership, and Governance
    body: >-
      Founder continuity is one of Carsome's clearest governance strengths, but it also creates concentration risk. Eric Cheng remains co-founder, Group CEO, and Chairman, preserving strategic continuity from the company's founding through unicorn scale and the later profitability push. Teoh Jiun Ee, the other co-founder, no longer runs frontline operations but remains inside the ecosystem as CEO of Carsome Academy after previously serving as COO and CBDO. The March 2024 leadership changes are therefore best read as bench expansion rather than founder replacement. Eric Chan joined as Group President and COO, Aaron Kee moved into the Group Chief Business Officer role, Kjetil Rohde Jakobsen remained Group CTO, and Juliet Zhu shifted from President to Advisor. That transition suggests management recognized the need for deeper operating capacity after the 2022-2023 reset. Still, public disclosure is thinner on formal board composition, committee structure, and investor governance rights than on executive titles, so later diligence should verify who controls capital allocation, risk decisions, and succession planning beyond the founder circle.
    claimRefs:
