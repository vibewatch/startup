      "id": "macro-and-structural-risks",
      "title": "Macro and Structural Risks",
      "body": "Macro risk for Carsome is best understood as conversion risk rather than as a simple volume forecast problem. Demand for affordable used cars can stay resilient while financing conversion deteriorates, inventory ages, or buyers shift toward different powertrains. Eric Cheng's December 2024 comments make that clear: fuel-subsidy rationalization in Malaysia can redirect demand toward more fuel-efficient vehicles, while Thailand's tight credit, high household debt, and roughly 30% loan approval rates can choke market growth even when buyer interest exists. Geographic concentration sharpens that macro exposure because Carsome's best results still come from Malaysia and Singapore, while Indonesia and Thailand are described as softer or more uneven. The EV transition adds another structural uncertainty. CNA's reporting on Singapore suggests used EVs can depreciate much faster than ICE vehicles and take materially longer to resell, while Carsome's Thailand team has acknowledged that battery standards, OEM coordination, and financing support still need to be developed. Those facts do not invalidate the thesis, but they do mean Carsome remains highly sensitive to credit conditions, energy-policy shifts, and residual-value mispricing in the next leg of growth.",
