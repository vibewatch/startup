    {
      "id": "operational-and-quality-risks",
      "title": "Operational and Quality Risks",
      "body": "Carsome's operational risk is no longer theoretical because the public record already shows what happens when process complexity outruns controls. The September 2022 accelerated profitability plan bundled layoffs, automation, and the integration of iCar and WapCar into one execution reset, which meant management was trying to cut cost while simultaneously stitching together multiple brands, workflows, and tech stacks. Refund and seller-payment complaints in 2023 showed that these strains were visible to customers, not just employees. Quality control is another concrete exposure: the 2025 UniMAP case study found about 30% of sampled Carsome Certified Lab vehicles required rework because defects were initially missed, and dissatisfaction still clustered around aesthetics. That matters because Carsome's brand promise depends on standardized inspection, refurbishment, and trust. The integration upside from iCar Asia is real, but it also expands operational surface area across content, listings, wholesale liquidity, retail fulfillment, and aftersales, making service consistency and management depth the first risks to monitor.",
