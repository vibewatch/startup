  "chapter": {
    "number": 7,
    "letter": "R",
    "title": "Risks",
    "summary": "Carsome's most material risks are not about whether used-car demand exists, but whether the company can maintain trust, liquidity, and control as it scales a multi-country, inventory-heavy, finance-adjacent operating model. The public evidence shows real execution strain in refunds, layoffs, integration, and reconditioning quality; meaningful disclosure gaps around adjusted EBITDA and debt layering; strong competitive pressure from Carro and the dealer long tail; and a rising regulatory burden through BNM-linked finance adjacency, RMiT, and cross-border compliance. The investment case therefore remains viable but conditional: Carsome looks fundable and operationally improved, yet still vulnerable to service-quality slips, residual-value mistakes, and governance or compliance complexity that can compound quickly."
  },
