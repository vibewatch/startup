- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current cash and runway
    - Cannot determine how long Carsome can self-fund inventory, lending growth, or expansion after FY2025 profitability.
    - Request treasury report with unrestricted cash, revolver headroom, monthly burn, and 18-month forecast.
  - - Revenue-definition bridge
    - Cannot compare 2021, 2022, 2024, and database revenue markers on a like-for-like basis.
    - Request audited income statements plus management reconciliation for every public revenue number used in databases and releases.
  - - Adjusted EBITDA reconciliation
    - Cannot translate management profitability claims into statutory earnings quality or compare to public peers.
    - Request bridge from adjusted EBITDA to EBIT, net income, and operating cash flow.
  - - Debt maturity and covenant schedule
    - Cannot judge refinancing risk or whether partner-bank facilities carry restrictive terms.
    - Request facility-by-facility schedule with maturity, pricing, collateral, covenant, and renewal conditions.
  - - FX sensitivity by entity
    - Cannot quantify how MYR, IDR, SGD, and THB swings affect consolidated USD shorthand.
    - Request legal-entity level revenue, cost, and debt currency mix plus hedging policy.
  notes: These are the key missing disclosures preventing a public-markets style underwriting conclusion despite positive EBITDA momentum.
