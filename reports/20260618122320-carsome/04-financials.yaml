callouts:
- calloutType: insight
  title: Ancillaries are the margin lever
  body: Carsome's public disclosures repeatedly frame financing, insurance, aftersales, and platform monetization as the reason GPU can keep rising even when regional used-car demand is softer. The 2024-2025 profitability story looks much stronger if ancillary attach rates keep expanding than if Carsome must depend only on metal spread.
  claimRefs:
  - CI004
  - CI023
  - CI037
  - CI046
  - CI053
- calloutType: risk
  title: Profitability is ahead of disclosure quality
  body: Carsome has crossed the threshold into reported adjusted EBITDA profitability, but outside investors still lack a public reconciliation to statutory earnings, a current cash balance, runway data, and a clearly harmonized revenue basis across sources. That gap is the main reason this chapter stops short of a clean underwriting endorsement.
  claimRefs:
  - CI030
  - CI044
  - CI045
  - CI049
