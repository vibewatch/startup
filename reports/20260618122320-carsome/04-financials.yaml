- id: carsome-capital-and-ancillary-financial-services
  title: CARSOME Capital and Ancillary Financial Services
  body: 'Ancillary financial services appear to be the core lever separating Carsome from a low-margin vehicle-flipping model. Management has been explicit that financing, insurance, aftersales, and platform services are the next leg of profit expansion. In 2023, Carsome said ancillary income per unit grew more than 80%, CARSOME Capital revenue rose more than 80%, and profit before tax tripled year on year while the business posted its second consecutive year of net profitability. By late 2024, the company was using new bank partnerships to scale dealer and consumer financing; The Star also reported retail NPL below 2% and wholesale NPL at 0.1%, which points to disciplined underwriting if the figures are sustained. The public product surface supports that strategy: CARSOME Capital offers consumer financing up to 108 months and dealer financing up to 80% of vehicle value with interest as low as 1% per month. Eric Cheng''s 2024 interview adds the strategic context: ancillary products were
    still only around 20% of total revenue, leaving meaningful upside if Carsome can keep credit quality stable while widening attach rates.'
