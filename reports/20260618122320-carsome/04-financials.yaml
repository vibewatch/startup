- id: financial-risks-and-caveats
  title: Financial Risks and Caveats
  body: The chapter's downside case is less about whether Carsome has a real business and more about what public disclosure still does not let investors underwrite cleanly. First, adjusted EBITDA is a management-defined measure; Carsome has not published a public reconciliation to statutory earnings, nor has it disclosed a full P&L, cash-flow statement, or current balance-sheet snapshot in the 2024 and 2025 profitability releases. Second, used-car retail remains inventory-heavy and working-capital intensive, so profitability can still be vulnerable to holding losses, slower inventory turns, and financing tightness. Third, FX translation matters because Carsome operates across MYR, IDR, SGD, and THB while most investor shorthand is in USD. Fourth, profit concentration appears strongest in Malaysia and Singapore even as FY2025 commentary acknowledged softer regional markets. Finally, the 2022 layoffs and the later refund complaints show that Carsome's previous burn and process strain were
    real. Taken together, Carsome now looks financeable and operationally improved, but not yet disclosure-grade enough for public-market style certainty.
