chapter:
  number: 4
  letter: I
  title: Financials
  summary: Carsome's financial story is credible but unevenly disclosed. The best-supported facts show a decisive profitability turn from December 2023 into FY2024 and FY2025, improving GPU and ancillary contribution, and continued access to equity and debt capital through 2026. The underwriting caveat is that public revenue bases are not fully harmonized, adjusted EBITDA is not reconciled to statutory earnings, and current cash and runway remain private.
sections:
- id: revenue-history-and-growth-trajectory
  title: Revenue History and Growth Trajectory
  body: 'Carsome''s revenue trajectory is best understood as a mix of hard milestones and disclosure gaps rather than as a clean audited time series. The public record supports a large scale-up into 2021 and 2022, but not every source appears to use the same revenue basis. Carsome''s June 2023 financing announcement said 2022 revenue grew 250% to US$1.5 billion and that Carsome Certified contributed 35% of total revenue, while audited-report-derived secondary analysis cited US$655.9 million of 2021 revenue and US$35.9 million of gross profit for that year. Later public databases add another wrinkle: GetLatka lists US$305 million of 2024 revenue, even though Carsome''s own 2Q2024 release said quarterly revenue alone exceeded US$310 million. That mismatch strongly suggests some sources are mixing net revenue, broader top line, or database normalization rules. What is directionally clear is that Carsome has grown from a transaction-heavy used-car platform into a multi-line ecosystem where vehicle
    sales still anchor volume, but financing, insurance, aftersales, and platform services increasingly matter to gross profit quality.'
