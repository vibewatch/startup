- id: capital-structure-and-funding-history
  title: Capital Structure and Funding History
  body: 'Carsome''s capital structure reflects a long transition from venture-funded growth into a more layered stack that now includes strategic equity, bank lines, and venture debt. Tracxn reconstructs roughly US$838 million raised across 17 rounds, while CB Insights shows US$695.22 million across 17 fundings, a difference that likely reflects what each database includes as debt, extensions, or undisclosed amounts. The broad chronology is still consistent: seed and Series A rounds financed early expansion; Series B and C funded regional scaling and the first financing adjacencies; 2021 and 2022 brought the largest late-stage equity infusions; June 2023 added a US$200 million round plus EvolutionX venture debt; July 2024 added a US$21.4 million AmBank round; September 2024 added RM200 million of financing partnerships; July 2025 added a US$15 million HSBC conventional debt facility; and March 2026 brought a new strategic round of more than US$30 million led by HKIC with Gobi and Asia Partners.
    This capital availability lowers near-term solvency concern, but it also means Carsome still carries meaningful financing dependency and leverage exposure even after the profitability turn.'
