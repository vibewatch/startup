  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current unrestricted cash balance, monthly cash burn, and covenant-adjusted runway by quarter.
    whyItMatters: Public profitability headlines cannot answer whether Carsome can self-fund inventory, lending growth, and expansion without another external raise.
    diligencePath: Request the latest board pack or treasury summary with cash, facility headroom, maturities, and 18-month cash forecast.
    relatedQuestionRefs:
    - QI014
    - QI026
  - type: conflicting-data
    severity: material
    topic: revenue-definition
    missingEvidence: A reconciled revenue bridge that explains whether public figures refer to net revenue, gross transaction value, quarterly revenue, or database-normalized top line.
    whyItMatters: Valuation multiples and margin quality are distorted if different sources are using inconsistent revenue definitions.
    diligencePath: Request audited 2021-2025 income statements plus management reconciliation for all public revenue figures cited in databases and press releases.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI021
    relatedTableRefs:
    - TI001
  - type: missing-source
    severity: material
    topic: fx-and-balance-sheet-sensitivity
    missingEvidence: Currency exposure tables, hedging policy, debt maturity ladder, and secured-versus-unsecured facility detail.
    whyItMatters: FX and leverage could materially change free cash generation even if adjusted EBITDA remains positive.
    diligencePath: Request treasury and risk-management memos with legal-entity cash balances, currency mix, and facility covenants.
    relatedQuestionRefs:
    - QI012
    - QI022
