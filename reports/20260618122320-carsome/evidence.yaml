evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gaps
    missingEvidence: >-
      Current board composition, investor rights, ownership percentages, and debt covenant detail for late-stage and
      debt facilities.
    whyItMatters: >-
      Control rights and covenant pressure can materially change downside protection, fundraising flexibility, and
      founder autonomy.
    diligencePath: Request the latest cap table, board observer matrix, and principal debt documents during management diligence.
    relatedQuestionRefs:
      - QO012
      - QO016
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: footprint-ambiguity
    missingEvidence: >-
      Operational proof of whether the Philippines is a full operating market, a lighter commercial presence, or only a
      marketing mention.
    whyItMatters: >-
      Regional expansion claims affect market-size assumptions, execution complexity, and the credibility of
      footprint-based scale narratives.
    diligencePath: >-
      Ask management for country-by-country revenue, center count, and employee distribution, then reconcile against
      local market materials.
    relatedQuestionRefs:
      - QO002
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: service-quality-uncertainty
    missingEvidence: >-
      Accessible primary evidence for the alleged incentivized review episode and the cited 2025 reconditioning rework
      case study.
    whyItMatters: >-
      If substantiated, these issues would weaken confidence in inspection quality, complaint handling, and reported
      trust signals.
    diligencePath: >-
      Pull direct complaint records, workshop QA reports, and customer-service metrics from management or fresh external
      sources before underwriting service quality claims.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: regional-market-size
    missingEvidence: >-
      A single reconciled methodology that explains why public Southeast Asia used-car market estimates range from
      roughly USD 18 billion to more than USD 74 billion by 2026.
    whyItMatters: >-
      Valuation and market-share math can look radically different depending on which boundary and methodology is
      chosen.
    diligencePath: >-
      Ask management for the internal market-sizing model by country, channel, and monetization layer, then reconcile it
      against at least two external analyst definitions.
    relatedQuestionRefs:
      - QM003
      - QM026
  - type: private-evidence-only
    severity: material
    topic: carsome-share
    missingEvidence: >-
      Country-level Carsome share, digital transaction mix, financed take rate, and certified-vehicle attachment by
      Malaysia, Indonesia, Thailand, and Singapore.
    whyItMatters: >-
      Without country-level operating data, public sources cannot precisely quantify Carsome's current SOM or digital
      penetration by market.
    diligencePath: >-
      Request market-share, units-sold, gross-margin, and ancillary-attachment disclosures by country for the last 8
      quarters.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM001
      - TM002
  - type: access-blocked
    severity: minor
    topic: regulatory-primary-sources
    missingEvidence: >-
      Fully accessible direct BNM and MAS fintech-policy pages, which returned minimal or maintenance content during
      fetch.
    whyItMatters: >-
      Secondary summaries can describe regulatory posture, but direct policy text is preferable when diligence turns to
      licensing or technology-risk obligations.
    diligencePath: >-
      Re-fetch the primary regulator pages manually or via PDF endpoints before relying on exact rule wording in
      investment memos.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: exact-platform-market-share
    missingEvidence: >-
      A third-party audited 2026 market-share split for Carsome, Carro, Moladin, and the remaining organized digital
      players by country and channel.
    whyItMatters: >-
      The chapter can establish relative leadership and fragmentation, but not an exact audited Carsome-versus-Carro
      share gap.
    diligencePath: >-
      Request internal country-level transaction-share decks from Carsome management or a paid analyst cut with
      methodology notes.
    relatedQuestionRefs:
      - QP026
  - type: access-blocked
    severity: minor
    topic: legacy-frontier-indonesia-lineage
    missingEvidence: >-
      A clean public primary record tracing Frontier Auto's Indonesian lineage into later OLX Autos operations and
      current post-wind-down status.
    whyItMatters: >-
      The strategic conclusion on OLX retreat is still sound, but the exact corporate continuity is only partially
      reconstructable from retained public pages.
    diligencePath: >-
      Pull archived corporate announcements or local legal-entity filings to map the Indonesia asset chain more
      precisely.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current unrestricted cash balance, monthly cash burn, and covenant-adjusted runway by quarter.
    whyItMatters: >-
      Public profitability headlines cannot answer whether Carsome can self-fund inventory, lending growth, and
      expansion without another external raise.
    diligencePath: >-
      Request the latest board pack or treasury summary with cash, facility headroom, maturities, and 18-month cash
      forecast.
    relatedQuestionRefs:
      - QI014
      - QI026
  - type: conflicting-data
    severity: material
    topic: revenue-definition
    missingEvidence: >-
      A reconciled revenue bridge that explains whether public figures refer to net revenue, gross transaction value,
      quarterly revenue, or database-normalized top line.
    whyItMatters: >-
      Valuation multiples and margin quality are distorted if different sources are using inconsistent revenue
      definitions.
    diligencePath: >-
      Request audited 2021-2025 income statements plus management reconciliation for all public revenue figures cited in
      databases and press releases.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI021
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: fx-and-balance-sheet-sensitivity
    missingEvidence: Currency exposure tables, hedging policy, debt maturity ladder, and secured-versus-unsecured facility detail.
    whyItMatters: FX and leverage could materially change free cash generation even if adjusted EBITDA remains positive.
    diligencePath: Request treasury and risk-management memos with legal-entity cash balances, currency mix, and facility covenants.
    relatedQuestionRefs:
      - QI012
      - QI022
  - type: missing-source
    severity: material
    topic: avm-transparency
    missingEvidence: >-
      A public technical note or benchmark that documents the exact AVM feature set, calibration approach, and pricing
      error rates.
    whyItMatters: >-
      Carsome's moat narrative leans heavily on pricing intelligence, but public sources in this run stop at broad
      descriptions and do not verify the exact depth or accuracy of the model.
    diligencePath: >-
      Request internal product or risk documentation on pricing-model inputs, holdout accuracy, override rates, and how
      EV depreciation is being added to the model.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: cloud-reliability-security
    missingEvidence: >-
      Independent uptime, incident-history, or security-certification evidence for Carsome's consolidated cloud and
      customer-facing apps.
    whyItMatters: >-
      Google Cloud tooling and Security Command Center are named publicly, but outside investors still cannot verify
      operational resilience, incident discipline, or audit depth from the source set alone.
    diligencePath: >-
      Ask management for incident logs, uptime dashboards, penetration-test summaries, audit reports, and the
      post-migration operating model with Searce.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: material
    topic: post-acquisition-integration
    missingEvidence: >-
      Architecture-level disclosure of how iCar Asia properties, Carsome transaction systems, and data pipelines are
      integrated or still segmented.
    whyItMatters: >-
      Integration complexity is a core risk to release velocity, analytics consistency, and customer experience,
      especially as Carsome uses content/media assets as part of its moat story.
    diligencePath: >-
      Request platform-integration roadmaps, data-governance diagrams, and KPI ownership for Carlist/WapCar/Carsome
      cross-sell flows.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: minor
    topic: app-release-visibility
    missingEvidence: A public changelog, release notes archive, or developer documentation for the consumer, agent, and dealer apps.
    whyItMatters: >-
      Public app-store surfaces prove the apps exist, but they do not make release cadence, roadmap scope, or
      reliability improvements legible to outside diligence teams.
    diligencePath: >-
      Ask product leadership for release calendars, defect backlogs, app analytics, and a map of which workflows still
      require human handoffs outside the apps.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: major
    topic: named-customer-proof-table completeness
    missingEvidence: >-
      Carsome does not publish a named enterprise-style customer logo list by revenue tier, so TU005 relies on
      segment-level proof rather than a full named-customer roster.
    whyItMatters: >-
      Without a disclosed list of top buyers, dealers, financing counterparties, or repeat sellers, concentration and
      retention cannot be underwritten with public-markets precision.
    diligencePath: >-
      Request top customer, top dealer, and financing attach-rate breakdowns by market; pair those with repeat-purchase
      and repeat-seller cohort tables.
    relatedQuestionRefs:
      - QU001
      - QU025
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: major
    topic: repeat purchase and revenue per customer
    missingEvidence: >-
      Carsome does not publicly disclose repeat-buyer rate, repeat-seller rate, revenue per customer, or cohort
      retention by market.
    whyItMatters: >-
      These are the cleanest measures of demand durability and customer quality; proxy metrics such as NPS and CAC
      cannot fully substitute for cohort economics.
    diligencePath: >-
      Request cohort retention and ARPU-style reporting by retail buyer, seller, dealer, and financing customer segment,
      broken out by Malaysia, Singapore, Indonesia, and Thailand.
    relatedQuestionRefs:
      - QU025
    relatedTableRefs:
      - TU003
      - TU004
      - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table boundary
    missingEvidence: >-
      Direct public valuation marks are not available for every regional used-car platform or for every private
      secondary transaction relevant to Carsome.
    whyItMatters: >-
      The comparable table is necessarily partial, so it should be read as triangulation rather than a complete universe
      of private-market marks.
    diligencePath: >-
      Expand the set with subscription-only private-market databases, secondary tender data, or banker books if a live
      financing or IPO process starts.
    relatedQuestionRefs:
      - QV009
      - QV012
    relatedTableRefs:
      - TV004
