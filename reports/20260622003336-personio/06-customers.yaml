figures:
  - id: FU001
    title: Personio Customer Segments and Acquisition Journey
    type: journey-map
    layout: wide
    summary: >
      Maps the seven-stage journey from awareness to renewal for Personio's SME HR buyer,
      highlighting key actors, decision criteria, and retention drivers at each stage.
    data:
      nodes:
        - id: aware
          label: "Awareness"
          description: "HR manager discovers Personio via G2/Capterra comparison sites, partner referrals, or Personio outreach"
        - id: evaluate
          label: "Evaluation"
          description: "Evaluates pricing (per-employee model), GDPR compliance, German payroll depth; compares to BambooHR/HiBob"
        - id: purchase
          label: "Purchase"
          description: "Annual/multi-year contract signed; pricing not publicly listed but per-employee-per-month SaaS model"
        - id: onboard
          label: "Onboarding"
          description: "~2-month implementation: data migration, payroll configuration, org chart, absence-type setup"
        - id: adopt
          label: "Adoption"
          description: "Full-suite use: core HR, ATS (9,000 customers), payroll DE/UK/IE, workflows, self-service portal"
        - id: expand
          label: "Expansion"
          description: "Cross-sells surveys, performance mgmt, compensation, AI recruiting (Aurio); headcount growth drives ACV"
        - id: renew
          label: "Renewal"
          description: "85% plan-to-renew (SoftwareReviews); high switching cost from centralised data, payroll history, workflow configs"
    approximationNotes: >
      Journey stages and actor labels are inferred from review platform descriptions,
      company materials, and Sifted/TechCrunch journalism; no internal conversion funnel
      data is publicly available.
    claimRefs:
      - CU020
      - CU021
      - CU026
      - CU031

