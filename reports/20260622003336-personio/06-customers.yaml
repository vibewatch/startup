  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: >
        Disclosed NRR (net revenue retention) and GRR (gross revenue retention) figures,
        or equivalent cohort-level retention data segmented by customer size band and
        geography. No public filing, investor presentation, or press release contains
        these metrics.
      whyItMatters: >
        Without NRR/GRR, it is impossible to determine whether Personio's 16,000-customer
        base is expanding or contracting in revenue terms. The SoftwareReviews 85%
        plan-to-renew proxy is a methodologically different metric and materially affects
        the durability scoring for this chapter.
      diligencePath: >
        Request investor data room access; ask for cohort retention tables in any Series F
        or IPO preparation materials; cross-reference with German Bundesanzeiger future
        filings for revenue trajectory.
      relatedQuestionRefs:
        - QU009

    - type: stale
      severity: material
      topic: customer-count
      missingEvidence: >
        An updated customer count for mid-2025 or a 2026 disclosure beyond the April 2026
        Aurio announcement figure of 16,000. The most recent public figure is ~8 weeks old
        at the time of this report; the trajectory to the next milestone is unconfirmed.
      whyItMatters: >
        If Personio's growth has decelerated (post-Series E, post-headcount-reduction),
        the trajectory from 16,000 toward a potential 20,000+ target would be unclear and
        could affect growth-rate assumptions in valuation models.
      diligencePath: >
        Monitor Personio press releases and German company filings (Bundesanzeiger);
        query CEO communications at HR tech conferences (HR Tech World, Unleash) in H2 2026.
      relatedQuestionRefs:
        - QU015

    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >
        A comprehensive customer reference list with deployment use cases, go-live dates,
        and quantified business outcomes (time-to-hire reduction, HR cost savings, error
        rates). Personio does not publish audited case studies with verifiable ROI metrics.
      whyItMatters: >
        The current named-customer evidence is limited to product listing descriptions
        and technology-tracking databases; no customer has provided independently
        verifiable outcomes. This limits the quality of proof-point evidence available
        to a potential investor or acquirer assessing customer value delivery.
      diligencePath: >
        Request Personio's customer reference program contacts; review customer talks at
        HR tech conferences; seek procurement portal mentions in EU public sector.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: review-segmentation
      missingEvidence: >
        Customer satisfaction metrics segmented by company size (SMB vs. mid-market),
        geography (Germany vs. non-Germany), and tenure (first-year vs. multi-year).
        All current review data is aggregated across the entire customer base.
      whyItMatters: >
        Size-segmented satisfaction could reveal whether the recent mid-market push
        is cannibalising SMB satisfaction or whether new larger customers have different
        churn profiles. Geo-segmentation would validate the Germany-profitable / rest-of-
        Europe-investment-mode hypothesis.
      diligencePath: >
        Request G2/Capterra filter exports or segment-specific review breakdowns;
        ask Personio investor relations for a cohort NPS by segment.
      relatedQuestionRefs:
        - QU027

acknowledgedWarnings:
  - dimension: figureType
    reason: >
      No time-series cohort retention data exists for Personio; NRR, GRR, and cohort
      renewal curves are unresolved evidence gaps (see evidenceGaps block). Substituting
      the planned cohort figure with an additional table (TU006) covering adoption signal
      quality is intentional and documented. The three produced figure types (journey-map,
      funnel, matrix) cover the other three planned figure types.
