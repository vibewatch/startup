chapter:
  number: 6
  title: Customers
  summary: >
    Personio serves approximately 16,000 SME customers as of April 2026, nearly tripling from
    ~5,000 in 2021, with Germany as its primary market and 70+ countries represented. The ICP
    is a European white-collar business with 10–2,000 employees; mid-market momentum (200–2,000
    employees) is accelerating per CEO statements. Named proof points include Premier Inn,
    Futurice, and Spendesk in production, but no publicly disclosed NRR or cohort retention
    data. Platform review signals (G2 4.4/5 on 776 reviews; SoftwareReviews 85% plan-to-renew)
    suggest solid near-term retention, offset by a serious May 2026 payroll-migration complaint
    and pricing-increase dissatisfaction reported on UK Trustpilot and GetApp.

sections:
  - id: customer-base-segmentation
    title: Customer Base, ICP & Segmentation
    body: >
      Personio's ideal customer profile is a European small-to-medium enterprise with 10–2,000
      employees operating predominantly white-collar workflows. Company materials consistently
      describe this range; Invgate and SourceForge listing data confirm it. The Enlyft
      technology-tracking dataset shows 50–200 employees as the most common user-company
      size in its sample of 9,286 tracked deployments, implying SMB customers constitute the
      majority of the installed base by count, while CEO Hanno Renner has described
      growing momentum in the 200–2,000 employee (mid-market) cohort in a 2024 Sifted interview.
      Germany is Personio's dominant market, where it has achieved profitability as a country;
      the UK and Ireland are the next tier, anchored by the company's Dublin support hub and
      native payroll support (post-2024 UK launch). Barcelona and Amsterdam offices indicate
      meaningful Southern and Western European footprints. Across 70+ countries, Germany
      remains the primary revenue concentration.

      By industry, the Enlyft dataset shows IT and Services at approximately 12% of the
      tracked install base; GetApp reviewer distribution shows IT and Services at 15%,
      Computer Software at 11%, and Financial Services at 7% of reviewers. These figures
      reflect the tech-sector dominance typical of early SaaS adoption curves in Europe.
      Healthcare, retail, and manufacturing/logistics verticals are underrepresented in
      published customer references, indicating a potential expansion surface. The primary
      buyer persona is the HR manager or director; employees are secondary users via the
      self-service portal; and finance teams consume payroll and reporting outputs. Personio's
      integration ecosystem of 268+ partners (Partnerbase data) enables it to slot into
      existing tech stacks, lowering switching friction for prospects using tools like Slack,
      Microsoft Azure, DATEV, or Salesforce.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU021
      - CU041
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory-named-proof
    title: Adoption Trajectory & Named Customer Proof
    body: >
      Personio's documented growth trajectory spans from approximately 100 customers at seed
      stage (2016) through ~5,000 in 2021, crossing 10,000 in May 2023, reaching 12,000 by
      mid-2024 (Sifted interview with CEO), and reaching 16,000 as of April 2026 per the
      Aurio acquisition press release and confirmatory Munich Startup reporting. This
      multi-source progression implies a compound annual growth rate of approximately 30–35%
      since 2021, consistent with the CEO's publicly stated "high double-digit" revenue growth
      language. The recruiting module is used by 9,000 of the 16,000 total customers
      (56% penetration), and the payroll application is growing at 80% per year with 1,500+
      customers — both signals of expanding per-customer module depth.

      Named customer references in production include Premier Inn (UK hospitality, full HR
      operations), Futurice (Finnish technology consultancy), and Spendesk (French fintech
      spend management), all cited in Slashdot and SourceForge product listings. Capterra UK
      lists Statista (German data analytics), Teufel (consumer audio electronics), and Turck
      (industrial automation) as active users. Enlyft's technology-deployment dataset further
      identifies Grover (Berlin-based electronics rental) and Chargebee (subscription billing
      SaaS) as confirmed Personio deployments. These examples span technology, hospitality,
      fintech, data, consumer goods, and industrial verticals, supporting the company's claim
      of cross-sector applicability, though the public list skews toward technology-adjacent
      firms. Average implementation time per G2 metadata is approximately two months,
      consistent with Personio's targeting of HR-led, non-IT-heavy deployment processes.
      Personio's 268 ecosystem integration partners (Partnerbase) reinforce adoption by
      reducing migration friction from incumbent point tools.
    claimRefs:
      - CU011
      - CU012
