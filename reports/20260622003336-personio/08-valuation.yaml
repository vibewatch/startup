  - id: exit-readiness-diligence-asks
    title: Exit Readiness & Final Diligence Asks
    body: >
      Personio's exit pathway is constrained by its $8.5 billion mark. An IPO at the reference
      price would require public investors to accept 26–40× ARR at a time when comparably
      positioned public companies trade at 6–8×. There is no evidence Personio has filed an
      S-1 or equivalent, and management has not communicated a public timeline. CEO Hanno Renner
      has not publicly set an IPO target since the 2022 raise. Secondary market activity
      in pre-IPO shares is limited; Forge Global reports HiBob pre-IPO activity as a reference
      data point but notes that secondary trading in European private HR-tech remains thin and
      prices are often stale reflections of the last primary round. An M&A exit is more plausible
      but requires a buyer to accept a haircut from $8.5 billion: SAP, Oracle, or a large PE
      fund could acquire Personio at $2–4 billion (our base-to-bull range) but would resist
      paying the 2022 reference. The April 2026 profitability milestone, if confirmed as
      operating profitability rather than accounting-definition profitability, materially reduces
      urgency on exit timing. Seven critical diligence items remain open: ARR and growth rate
      (undisclosed), gross margin (not public), NRR (not public), cap table and liquidation
      preference stack (private), secondary market clearing price (thin market), EU AI Act
      conformity roadmap for Aurio-powered features (not published), and statutory accounts via
      Bundesanzeiger (18+ month lag). Until at least ARR and NRR are disclosed, independent
      underwriting of the $8.5 billion mark is structurally impossible.
