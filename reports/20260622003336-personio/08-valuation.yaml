  - id: scenario-analysis
    title: Bull / Base / Bear Scenario Analysis
    body: >
      Three valuation scenarios are constructed using different ARR assumptions, growth
      trajectories, and applicable EV/ARR multiples. All ARR figures are estimated; Personio
      does not publicly disclose financial metrics. The methodology: 16,000 customers multiplied
      by estimated average annual contract values, cross-checked against comparable HRIS pricing
      and the company's quoted per-employee pricing range of roughly €2–8 per employee per month
      for a 50–500 employee customer base. Currency conversion uses EUR/USD of 1.07.
      Bear case: ARR €180 million ($193 million), growth 8–10% annually — consistent with
      customer-count plateauing and declining ACV under competitive pressure from Rippling and
      HiBob. Applied multiple 5× (below public comps for slow growth and opacity discount).
      Implied EV: $0.97 billion — an 89% down-round from $8.5 billion. Bull case: ARR €320
      million ($342 million), growth 20–25% annually — consistent with mid-market
      acceleration confirmed by CEO comments, successful Aurio AI upsell, and payroll module
      expansion. Applied multiple 12× (top-quartile private SaaS with premium for European
      HRtech leadership and AI narrative). Implied EV: $4.1 billion — a 52% discount to $8.5B
      reference. Base case: ARR €250 million ($268 million), growth 15% annually — consistent
      with modest organic expansion and stable churn. Applied multiple 8× (in line with mid-tier
      public HR-tech comps). Implied EV: $2.14 billion — a 75% discount to $8.5B reference.
      Even the bull case produces a 52% down-round from the 2022 reference. For the $8.5 billion
      to be fair value, Personio would need ARR of at least €600 million at a 12× multiple — more
      than double the high-end estimate — or ARR of €710 million at an 8× multiple. Neither
      is consistent with any available evidence as of June 2026.
