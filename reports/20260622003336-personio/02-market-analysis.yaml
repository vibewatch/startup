  - id: buyer-segmentation-icp
    title: Buyer Segmentation & ICP
    body: >
      Personio's ideal customer profile is the European company with 10–2,000 employees that lacks a
      dedicated HRIS and is replacing manual, fragmented HR processes. InvGate product documentation
      confirms the stated ICP of 10–5,000 employees, while Enlyft market intelligence shows that the
      median Personio customer operates in Germany, employs 50–200 people, and generates USD 1M–10M
      in annual revenue — consistent with the classic Series A–B technology scale-up or established
      mid-market professional services firm. The customer base is most concentrated in Information
      Technology and Services (12% of customers by Enlyft) and Computer Software (8%), sectors with
      high digital maturity, European compliance exposure, and rapid headcount fluctuation that
      makes manual HR unsustainable. Buyer behaviour analysis across 7,500+ businesses (SoftwareFinder
      2026 report) confirms that SMBs account for 80% of HR software demand by volume, with payroll
      (46% of feature requests) and compliance (31%) as the dominant purchase triggers — aligning
      precisely with Personio's product architecture. The primary budget owner is typically the CFO
      or HR Director in companies with a dedicated finance function, shifting to the Founder/CEO in
      micro-SMBs below 50 employees. The adoption trigger differs by segment: micro-SMBs buy when
      payroll errors become unmanageable or a compliance audit is triggered; scale-ups buy at a funding
      round when investors or new executives demand professional HR systems; mid-market companies buy to
      consolidate point solutions following a restructuring or ERP migration. Personio's partner ecosystem
      of approximately 268 integration partners (Partnerbase) and a certified channel partner network
      covering DACH, UK, Spain, and the Netherlands extends geographic reach without requiring direct
      sales coverage everywhere. The primary distribution model is inbound digital plus inside sales
      for the core 50–500 employee segment, complemented by partner-led sourcing for multi-country
      deployments and larger enterprise deals. Switching cost research indicates that scalability
      limitations (58%) and pricing (23.5%) are the dominant reasons SMBs leave HR software vendors,
      creating both a growth opportunity for Personio among platform-constrained incumbents and a
      retention risk if pricing escalates ahead of perceived value growth.
