    - type: private-evidence-only
      severity: material
      topic: SAM-SOM-precision
      missingEvidence: "Personio's disclosed SAM, SOM, or market penetration rate within its European SMB ICP (10–2,000 employees); DACH versus rest-of-Europe customer concentration breakdown."
      whyItMatters: "Without Personio-disclosed ICP sizing data, the SAM/SOM pyramid is estimative and any revenue multiple benchmarking against comparable public companies is incomplete. Investors cannot derive an organic growth ceiling independently."
      diligencePath: "Request commercial data room from Personio including customer count by country, segment, and module; ask CFO Birgit Haderer for forward ARR model with SAM/SOM assumptions."
      relatedQuestionRefs:
        - QM005
        - QM024
        - QM002

    - type: conflicting-data
      severity: material
      topic: market-sizing-methodology
      missingEvidence: "Reconciled methodology between analyst TAM estimates (USD 4.8B software-only vs. USD 10.91B services-inclusive); DACH sub-market sizing; independent bottom-up SMB count vs. analyst top-down estimates."
      whyItMatters: "The 2× divergence in TAM headlines affects the growth story materially: a USD 4.8B market with 7% CAGR implies a different competitive intensity and revenue ceiling than a USD 10.9B market with 10% CAGR."
      diligencePath: "Commission an independent bottom-up market sizing using Eurostat enterprise data (by size class and sector) combined with per-employee HR software pricing benchmarks to derive a consistent SMB HRIS SAM for Europe."
      relatedTableRefs:
