callouts:
  - calloutType: "risk"
    title: "Valuation Mark-to-Market: The $8.5B Reference Is Unsupported by 2026 SaaS Multiples"
    body: "At any ARR estimate within the analyst consensus range of €150–300M and applying 2025–2026 European SaaS median multiples of 6–10×, Personio's implied enterprise value is approximately €900M–3B — a 65–90% discount to the $8.5B reference. Investors who marked to the 2022 valuation face structural impairment risk in any secondary or primary transaction."
    claimRefs:
      - CR001
      - CR002
      - CR035
      - CR036
  - calloutType: "risk"
    title: "EU AI Act Obligation Is Active: Personio Deploys High-Risk AI Without Published Conformity Assessment"
    body: "EU Regulation 2024/1689 applied to high-risk AI system providers from August 2026. Personio's AI-powered recruiting (including Aurio), performance analytics, and AI-assisted workflows fall squarely within the Annex III employment-management high-risk category. No conformity assessment, EU AI Office registration, or technical documentation has been published as of June 2026. This constitutes a regulatory non-compliance risk that market-regulating authorities in Germany, the UK ICO, and the EU AI Office may escalate."
    claimRefs:
      - CR007
      - CR008
      - CR037
      - CR038
      - CR039
