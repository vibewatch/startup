    title: "Key Diligence Asks Before Any Investment Decision"
    body: "Priority diligence items are: (1) Full financial disclosure — trailing-8-quarter ARR, NRR, gross margin, and burn rate by segment and geography. (2) EU AI Act conformity assessment and compliance roadmap for all AI-enabled features. (3) GDPR data-processing-agreement and sub-processor list. (4) DATEV SLA, RTO/RPO, and June 2026 outage root-cause post-mortem. (5) Payroll accuracy SLA and incident history for Payroll DE and Payroll UK. (6) Updated cap table and investor rights provisions post-Series E-2."
