  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: win-rate-competitive
      missingEvidence: >
        Personio's win-rate versus HiBob, Factorial, and BambooHR in the European SMB segment;
        no vendor publishes competitive displacement or win/loss data publicly.
      whyItMatters: >
        Without win-rate or churn-by-competitor data, it is impossible to verify whether Personio's
        European regulatory depth and all-in-one positioning actually translates to durable competitive
        wins in contested deals, or whether the narrative reflects marketing positioning rather than
        purchasing outcomes.
      diligencePath: >
        Request Personio's internal win/loss reporting by named competitor for the past 8 quarters;
        triangulate against HiBob and Factorial reference customer counts and growth rates.
      relatedQuestionRefs:
        - QP026

    - type: missing-source
      severity: material
      topic: Rippling-EU-expansion
      missingEvidence: >
        Specific Rippling EU data-centre locations, GDPR compliance certifications, and the extent
        of its European customer base and partner network as of 2026.
      whyItMatters: >
        Rippling is the US-born competitor most structurally capable of displacing Personio at scale
        due to its unified HR-IT-payroll architecture; understanding the pace and depth of its EU
        expansion is critical to assessing the timeline of displacement risk.
      diligencePath: >
        Review Rippling's EU regulatory filings (GDPR Article 30 records), EU data-centre certifications,
        and publicly announced European customer wins; interview European HR buyers currently evaluating
        both platforms.
      relatedQuestionRefs:
        - QP015

    - type: missing-source
      severity: material
      topic: win-loss-by-segment
      missingEvidence: >
        Comparative win/loss rates by company size (50-200, 200-500, 500+ employees) between Personio
        and HiBob, which has a partially overlapping mid-market target.
      whyItMatters: >
        If HiBob is winning deals in the 200-500 employee bracket at a disproportionate rate, it signals
        that Personio's positioning is under pressure exactly where ticket sizes are highest within its ICP.
      diligencePath: >
        Request deal-level win/loss analytics from Personio's CRM for HiBob competitive deals by ARR size
        band; supplement with independent buyer reference calls.
      relatedQuestionRefs:
        - QP022

    - type: private-evidence-only
      severity: minor
      topic: pricing-opacity
      missingEvidence: >
        Actual realised per-seat or per-module pricing for Personio and its direct competitors (HiBob,
        Factorial); no vendor publishes list prices publicly.
      whyItMatters: >
        Pricing opacity makes it impossible to assess whether Personio is priced at a premium, at parity,
        or at a discount relative to HiBob and Factorial — a key input for win-rate analysis and for
        evaluating the risk of a pricing-led competitive attack.
      diligencePath: >
        Obtain Personio's internal price book, standard contract terms, and realised ARR-per-seat data;
        compare against any available HiBob or Factorial pricing obtained through reference buyers.
      relatedQuestionRefs:
        - QP025
