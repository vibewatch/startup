  - id: FE001
    title: Personio 产品架构：功能模块栈
    type: stack
    layout: standard
    summary: |
      功能模块栈展示 Personio 的 HR 平台如何从底层基础设施与安全，向上叠加核心 HRIS 数据层、功能型 HR 模块和高级能力模块。
