      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >
              Personio 有据可查的增长轨迹，从种子阶段（2016 年）约 100 家客户，增长到 2021 年约 5,000 家，2023 年 5 月突破 10,000 家，2024 年中达到 12,000 家（CEO
              接受 Sifted 访谈），再到 2026 年 4 月根据 Aurio 收购新闻稿和 Munich Startup 佐证报道达到 16,000 家。这条多来源进展线意味着自 2021 年以来复合年增长率约
              30–35%，与 CEO 公开表述的「高双位数」收入增长一致。Recruiting 模块由 16,000 家总客户中的 9,000 家使用（渗透率 56%），payroll 应用以每年 80% 增长、客户超过
              1,500 家 —— 两者都说明单客户模块深度正在扩大。

              已投产的具名客户包括 Premier Inn（英国酒店业，全套 HR 运营）、Futurice（芬兰技术咨询）和 Spendesk（法国 fintech 支出管理），均见于 Slashdot 和
              SourceForge 产品列表。Capterra UK 列出 Statista（德国数据分析）、Teufel（消费音频电子）和 Turck（工业自动化）为活跃用户。Enlyft 的技术部署数据集还识别出
              Grover（柏林电子产品租赁）和 Chargebee（订阅计费 SaaS）为已确认 Personio
              部署。这些案例覆盖技术、酒店、fintech、数据、消费品和工业垂直，支撑公司关于跨行业适用性的主张；但公开名单仍偏向科技相邻公司。G2 元数据显示，平均实施时间约两个月，符合 Personio 针对 HR
              主导、IT 负担较轻部署流程的定位。Personio 的 268 个生态集成伙伴（Partnerbase）通过降低从既有点工具迁移的摩擦来强化采用。
