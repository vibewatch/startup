      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              2016 年至 2025 年，Personio 在八轮已披露融资中累计获得约 $772 million 资本。公司在接受外部种子轮前已自举到近 100 家客户；2016 年从 Picus Capital 和
              Global Founders Capital（GFC）获得约 $2.3M 种子轮。此后融资节奏加速：Northzone 领投 Series A（$12M，2017 年）、Index Ventures 领投
              Series B（$40M，2019 年）、Accel 与 Lightspeed 领投 Series C（$75M，2020 年 1 月，估值约 $500M）、Index 领投 Series
              D（$125M，2021 年 1 月），并以 $1.7 billion 估值跻身独角兽。Greenoaks Capital Partners 随后成为主要机构锚定投资方，2021 年 10 月领投 $270M
              Series E，使 Personio 估值达到 $6.3B；2022 年 6 月又完成 $200M 第二批融资，确立当前最后已知估值 $8.5 billion。Personio Foundation 于
              2021 年设立，持有公司 1% 股权（成立时估值约 $85M）。2025 年 6 月，公司完成约 $25.9M 的小规模延伸融资。截至 2026 年 6 月前十二个月，公司未宣布新的外部融资；2026 年 4
              月的盈利公告意味着近期对外部资本依赖下降。所有投资方的股权比例均未公开披露；完整 cap table 是重要尽调缺口。
