      - CR009
      - CR016
      - CR018
      - CR045
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 判断
      - 理由
    rows:
      - - 投资建议
        - 回避
        - 以 $8.5B 进入，意味着估算 ARR 的 26–40×；当前市场没有任何合理倍数能支撑这个价格
      - - 置信度
        - 中
        - 估值算术很扎实；但 ARR 不透明，实际 ARR 可能偏离估算
      - - 风险评级
        - 高
        - 下轮降估值风险 52–89%；财务不透明，无法独立验证；监管和竞争压力在加速
      - - 估值立场
        - 昂贵
        - 截至 2026 年 6 月，参考价格比可比上市和私营 HR-tech 倍数高 3–5×
      - - 决策含义
        - 跟踪重定价
        - IPO 申报、新一轮 primary 融资低于 $4B，或确认 ARR ≥ €600M 且保持高增长时，再重新评估
    notes: 判断基于 2026 年 6 月数据；理由中使用的 ARR 为估算值（方法：16,000 家客户 × €15,625 混合 ACV = €250M；见情景表）。建议只反映入场价格纪律——业务质量另行评级。
