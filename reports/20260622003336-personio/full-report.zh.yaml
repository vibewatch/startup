      - number: '4.2'
        title: 估值轨迹与资本历史
        blocks:
          - type: paragraph
            body: >
              Personio 的资本形成横跨约十年，2016 年至 2025 年八轮已披露股权融资合计约 $772 million。最近一次 primary raise 是 2022 年 6 月由 Greenoaks
              Capital Partners 领投的 $200 million Series E-2，将最后确认估值定在 $8.5 billion。此前 2021 年两轮融资——2021 年 10 月 $270
              million Series E、估值 $6.3 billion，以及 2021 年 1 月 $125 million Series D、估值 $1.7 billion——让 Personio
              在不到十二个月内从独角兽迅速扩张为超级独角兽。2020 年 1 月 Series C（$75 million，估值约 $500 million）由 Accel 和 Lightspeed 共同领投。2022 年 6
              月至 2026 年 6 月这四年间，公司没有宣布新的 primary financing round，这是自 2018 年 Series B 以来最长的融资空窗期。这种缺席要么与强劲有机现金生成一致——2026
              年 4 月盈利公告提供佐证——要么说明公司在 SaaS 倍数压缩期间有意避免以等于或低于 $8.5 billion 参考估值融资。估值四年停滞，叠加欧洲科技倍数普遍压缩，若公司需要新的 primary
              raise，就存在合理的 down-round 风险。Greenoaks Capital Partners、Index Ventures、Accel、Northzone、Lightspeed 和 Meritech
              Capital 是主要机构投资方。
