      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 估值锚结构性缺乏支撑
            body: >
              Personio 的 $8.5 billion 参考估值是 2022 年峰值遗留。所有可得 2026 年基准 —— 公开可比 6–8× ARR，私有可比视增长为 4.5–16× —— 都指向 $1–4
              billion 的公允价值。2025 年 6 月 $25.9 million flat extension 确认，市场四年来没有向上重估公司。即便在最乐观情景下，按参考价入场也结构性不利。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV040
          - type: callout
            title: 等待重新定价事件；$8.5B 估值下回避
            body: >
              Personio 是一家高质量欧洲 HR-tech 公司，但价格错了。建议是在 $8.5 billion 估值下 AVOID。重新评估的可操作触发条件是新的 primary raise、二级市场清算价格，或
              IPO filing，将市场验证估值定在 $4 billion 以下，并披露 ARR、NRR 和毛利率。
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV040
              - CV043
              - CV044
          - type: callout
            title: 盈利里程碑降低退出紧迫性，但不解决倍数问题
            body: >
              2026 年 4 月首次季度盈利公告是结构性正面信号 —— 它移除了近期被迫以困境价格融资的风险。但在当前隐含 ARR 下，盈利不能证明 $8.5 billion 内嵌的 26–40×
              倍数合理；它只是给公司更多时间，让重新定价不必立刻发生。盈利公司可以等待更合适的时点，这是创始人的战略优势，但不会改善新投资人按参考价入场的经济性。
            calloutType: insight
