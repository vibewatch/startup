      - number: '4.5'
        title: 财务不透明与尽调阻断点
        blocks:
          - type: paragraph
            body: >
              Personio 的财务不透明是全面的，也代表了无需近期监管披露的 late-stage 欧洲私有 SaaS 公司。五个重要证据缺口包括：（1）当前 ARR
              和收入轨迹；没有它们，就无法独立评估增长率、估值倍数和收入质量；（2）毛利率和 COGS 拆解，这是判断订阅盈利可持续性所需；（3）按 cohort 划分的 net revenue
              retention，这是扩张与流失动态的首要指标，也是最强的前瞻 ARR 预测因子；（4）cap table 和 Series E-2 后所有权结构，用于建模稀释、waterfall
              机制，以及任何退出情景下的回报门槛；（5）2026 年 4 月盈利里程碑的精确定义，其范围可能从 operating income positive 到 GAAP EBITDA 再到 free-cash-flow
              positive，对资本强度含义差异很大。Personio SE 依德国法律需向 Bundesanzeiger（联邦公报）提交年度账目，但中型公司豁免可能限制公开文件颗粒度。尽调 data room
              应包括过去八个季度按 cohort 和 segment 拆分的 ARR、带毛利率和职能级 opex 的 income statement、按客户规模带划分的 NRR、按部门划分的员工数，以及包含
              liquidation preferences 的 fully diluted capitalization table。
