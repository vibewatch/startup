      - number: '2.3'
        title: 买方分层与 ICP
        blocks:
          - type: paragraph
            body: >
              Personio 的理想客户画像是 10–2,000 名员工、缺乏专用 HRIS、正在替换手工且碎片化 HR 流程的欧洲公司。InvGate 产品文档确认其声明的 ICP 为 10–5,000
              名员工；Enlyft 市场情报显示，Personio 客户中位数位于德国，雇用 50–200 人，年收入 USD 1M–10M，这与典型 Series A–B 科技扩张公司或成熟 mid-market
              专业服务公司一致。客户群最集中在 Information Technology and Services（Enlyft 显示占客户 12%）和 Computer
              Software（8%）行业，这些行业数字成熟度高、暴露于欧洲合规要求、员工规模波动快，使手工 HR 难以持续。SoftwareFinder 2026 报告对 7,500+ 家企业的买方行为分析确认，SMB
              按数量占 HR software 需求的 80%，薪资（46% 功能请求）和合规（31%）是主导采购触发因素——与 Personio 产品架构高度吻合。主要预算负责人通常是有专职财务职能公司的 CFO 或 HR
              Director；在 50 人以下的微型 SMB 中，则转向 Founder/CEO。采用触发点因细分市场而异：微型 SMB 在薪资错误变得难以管理或触发合规审计时购买；scale-up
              在融资轮中，因投资者或新高管要求专业 HR 系统而购买；mid-market 公司在重组或 ERP 迁移后，为整合点状方案而购买。Personio 约 268 个集成合作伙伴（Partnerbase）组成的
              partner ecosystem，以及覆盖 DACH、英国、西班牙和荷兰的认证 channel partner 网络，扩大了地理触达，而不要求处处铺设直销覆盖。主要分销模式是面向核心 50–500 人板块的
              inbound digital 加 inside sales，并由合作伙伴牵头获取多国部署和更大企业交易。转换成本研究显示，扩展性限制（58%）和定价（23.5%）是 SMB 离开 HR software
              供应商的主因；这既为 Personio 从平台受限的 incumbent 中抢增长创造机会，也意味着若定价涨幅跑在感知价值增长前面，会带来留存风险。
