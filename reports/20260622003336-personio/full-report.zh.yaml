companyProfile:
  summary: >
    Personio 是一家总部位于慕尼黑的云端 HR SaaS 公司，2015 年 8 月由 Hanno Renner、Jonas Rieke、Roman Schumacher 和 Arseniy Vershinin
    创立，四人均为慕尼黑工业大学 Center for Digital Technology and Management（CDTM）校友。公司把平台定位为面向欧洲 SMB、覆盖 10–2,000 名员工的「People
    Operating System」，用一个订阅产品整合 HR 管理、招聘、薪资、工时追踪和绩效管理。GDPR 原生架构、获认证的德国薪资处理能力，以及深度 EU 劳动法合规能力，构成公司对抗美国总部竞品的结构性护城河。截至 2026
    年 4 月，Personio 服务约 16,000 家客户，员工约 2,000 人，并实现首个盈利季度。最近一次披露估值为 2022 年 6 月 Series E-2 的 $8.5 billion；此后四年没有确认新的
    primary round，公司也不公开披露 ARR、毛利率或 NRR。
