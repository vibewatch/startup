        - 多系统 HR 架构拖慢整合；集成成本压制加售
        - 审查 Personio 面向中端客户的连接器深度，相比 SAP/Oracle ERP 如何
      - - GDPR 2025 改革：第 30 条门槛提高至 750 名员工
        - 约束 / 混合
        - 2025–2026
        - 削弱微型 SMB 因合规恐惧而采购的触发点；可能放缓 <250 人细分的紧迫感
        - GDPR 改革宣布后，监测 2026 年上半年 SMB 采用率变化
