  - id: TV005
    title: 论点失效与否决触发器
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 以 $8.5B 或更高估值完成 primary 融资
        - 新机构领投方以 ≥$8.5B 进入，并披露 ARR ≥ €600M
        - 将验证当前估值；迫使重新评估空头情景概率
        - 重启尽调；评估新投资者尽调是否支撑已披露指标
      - - 确认 ARR 超过 €600M
        - 公司发布或自愿披露 ARR ≥ €600M，并附审计师证明
        - 隐含倍数会落入可辩护的 12–14× 区间；论点从回避转为跟踪
        - 上调至跟踪；用披露的增长率和 NRR 重建情景模型
      - - 低于 $4B 的 down-round primary 融资
        - 新 primary 融资披露 post-money 估值 < $4B
        - 确认空头到基准情景；提供已验证价格锚；二级市场打开
        - 按披露价格评估入场；检查 cap table 中优先权堆叠的影响
      - - IPO 申报（S-1 或等同文件）
        - 公开申报披露 ARR、NRR、毛利率和增长率
        - 移除不透明折价；允许直接做可比分析
        - 对照可比公司建模 IPO 价格；评估 IPO 折价（通常比 IPO 前私募标记低 20–30%）
      - - 年度 gross customer churn 超过 15%
        - 行业调研、评论平台数据或披露确认 gross churn
        - 下调基于客户数的 ARR 估算；空头情景概率上升
        - 无条件转为回避；重新评估 TAM 防御论点
      - - EU AI Act 不合规执法行动
        - CNIL/BNetzA 或跨境 DPA 对 Personio 的 AI 招聘或绩效功能采取正式行动
        - 重大监管责任；产品重构成本；核心市场声誉受损
        - 转为回避；标记 EU 所有 HR-tech AI 项目的监管风险
    notes: 触发器仅供参考；均不构成有约束力的投资建议。行动含义是尽调步骤，不是交易建议。
    claimRefs:
      - CV033
      - CV036
      - CV037
      - CV038
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径 / 负责人
    rows:
      - - ARR 和增长率
        - Personio 未公开披露 ARR、收入或 YoY 增长率
        - 任何估值框架都绕不开；当前估算横跨 €180–350M（2×+ 区间）
        - 在 data room 索取；Bundesanzeiger 提交后，对照法定账目交叉核验
      - - 净收入留存（NRR）
        - NRR 未披露；没有可用 proxy
        - 决定已安装客户基础是在扩张还是收缩；若 NRR 低于 100%，$8.5B 估值直接失格
        - Data-room NRR cohort 分析；交叉核验 G2 / Trustpilot 评论情绪趋势
      - - 毛利率
        - 未披露；SaaS 毛利率基准显示 HRIS 约 60–80%，但 payroll 拖累可能更低
        - 毛利率低于 60% 会进一步压缩可实现 ARR 倍数 20–30%
        - 在 data room 索取；从法定账目中的员工数和基础设施成本分摊推断
      - - 清算优先权与 Cap Table
        - 优先权堆叠和总清算优先权未披露；8 轮融资带有不同领投条款
        - 多层清算优先权在下行情景中可能完全抹掉普通股价值
        - Data room 提供完整 cap table 和 waterfall model；检查 Series E 和 E-2 条款清单
      - - 二级市场出清价格
        - 没有公开可得的二级交易价格；Forge Global 显示 HiBob 作为基准的市场活跃度为「limited」
        - 若存在二级交易，可提供最贴近当前市场的估值锚
        - 接洽 Forge、Nasdaq Private Market 或 Hiive，获取 Personio 股票可用买卖报价数据
      - - Aurio AI 合规路线图
        - 未发布 Aurio 驱动招聘功能的 EU AI Act 合格评定或 ALTAI 自评
        - Annex III 下的高风险 AI 分类可能触发合规义务，影响产品上线节奏
        - 索取 Aurio 功能集的内部 EU AI Act 合规路线图和 GDPR DPIA
      - - 法定财务账目
        - 按 German HGB 提交至 Bundesanzeiger 的账目通常滞后 18+ 个月；FY2024 账目可能是最新可得数据
        - 唯一独立审计财务数据；对收入 / 成本验证至关重要
        - 监控 Bundesanzeiger 的 FY2025 申报；聘请德国法证会计公司解读 HGB 账目
    notes: 这些尽调问题是独立承销 $8.5B 参考估值所需的最低要求。仅靠公开来源，目前没有一项能解决。
    claimRefs:
      - CV009
      - CV010
