        - from: personio
          to: remote
          label: EOR 服务
        - from: personio
          to: aurio
          label: AI 招聘层
        - from: personio
          to: xero-sage
          label: 非德国薪资执行
        - from: personio
          to: iso-cert
          label: 安全认证
