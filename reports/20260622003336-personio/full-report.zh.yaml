  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Personio 参与欧洲云端 Human Resource Management Software（HRMS）和 Human Capital
              Management（HCM）平台市场竞争，该类别把员工管理、薪资、人才获取、工时考勤和绩效管理统一到一个订阅平台上。市场边界排除服务约 2,000–5,000 名员工以上组织的大企业套件（Workday、SAP
              SuccessFactors、Oracle HCM）、不提供自助软件的独立薪资服务机构和 HR Business Process Outsourcing（BPO）服务、传统本地部署 ERP HR 模块，以及独立
              Learning Management Systems 或生物识别打卡硬件等单模块专业供应商。欧洲 SMB 的现状替代方案是一套碎片化组合：电子表格、纸质人事档案，以及彼此割裂的薪资、费用管理和
              applicant tracking 点状方案；对任何处理特殊类别员工数据的雇主而言，这种配置已被证明不符合 GDPR Article 30 记录保存义务。相邻市场包括云身份管理（Okta、Microsoft
              Entra ID）、Learning Management Systems、Employee Engagement 平台和 workforce planning 工具——Personio 通过 200+
              集成生态连接这些系统，而不是直接竞争。SMB 买家的核心价值主张是消除碎片化工具，转向一个覆盖全部员工数据的单一记录系统；Personio 平台文档确认，该系统支持 18+ 种语言，可在 27 个 EU
              成员国部署，无需本地 IT 基础设施。相较只在北美辖区原生支持薪资的美国竞品，这种多国本地化深度形成结构性护城河。在这一边界内，最大可触达子板块是拥有 50–500
              名员工的欧洲科技、专业服务和知识工作雇主；这类公司通常刚设立专职 HR 职能，需要快速替换 Excel 流程。
