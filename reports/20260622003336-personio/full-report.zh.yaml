  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与模块架构
        blocks:
          - type: paragraph
            body: >
              Personio 把平台组织成一套「People Operating System」—— 面向 10–5,000 名员工的欧洲 SMB，覆盖员工全生命周期的一体化 HR 套件。核心 HRIS
              模块托住平台底座，提供数字员工档案、组织管理、带电子签名的文档存储、休假跟踪和可配置工作流。底座之上是若干专用模块：Payroll（德国原生薪资，ITSG 认证，截至 2026 年 4 月客户超过 1,500
              家，年增速 80%；面向英国、爱尔兰和其他 80 多个国家提供预处理薪资和文件导出集成）；Recruiting（申请人跟踪、向 1,000 多个招聘网站多站发布、面试排程、智能排程链接；9,000
              家客户使用该模块）；Performance & Development（评审周期、360 度反馈、OKR）；Surveys（借助集中员工数据和预置模板跑员工敬业度调研）；Compensation
              Management（2023 年推出）；Whistleblowing（符合 EU Directive 2023/970 的匿名举报渠道）；Conversations（AI 驱动的 HR 中央收件箱）；以及由
              Remote.com 支撑的 Employer of Record（无需本地实体即可在 100 多个国家全球用工）。Mobile App 提供员工自助服务。2026 年 4 月收购 Aurio
              后，Personio 把一层 AI 接入 Recruiting 模块，目标是自动化候选人寻源、筛选和优先级排序，同时保留人工最终决策。Compensation
              Management、Surveys、Whistleblowing 和 Conversations 都是较新的补充（2023–2025 年），代表 Personio 正从纯 HRIS
              管理向相邻的人力运营工作流扩张。
