        title: 客户基础、ICP 与分层
        blocks:
          - type: paragraph
            body: >
              Personio 的理想客户画像是欧洲中小企业，员工规模 10–2,000 人，以白领工作流为主。公司材料一直这样描述；Invgate 和 SourceForge 的列表数据也验证了这一范围。Enlyft
              技术跟踪数据集在 9,286 个跟踪部署样本中显示，50–200 人公司是最常见用户规模，说明按安装基数计，SMB 客户构成已安装基础的大多数；同时，CEO Hanno Renner 在 2024 年
              Sifted 访谈中称，200–2,000 人（中端市场）客群势头增强。德国是 Personio 的主导市场，公司在该国已实现盈利；英国和爱尔兰是下一梯队，由 Dublin 支持中心和原生 payroll
              支持（2024 年英国上线后）支撑。Barcelona 和 Amsterdam 办公室说明其在南欧和西欧也有实质足迹。覆盖 70 多个国家，但德国仍是主要收入集中地。

              按行业看，Enlyft 数据集显示 IT and Services 约占跟踪安装基础的 12%；GetApp 评论者分布显示 IT and Services 占 15%，Computer Software 占
              11%，Financial Services 占 7%。这些数字反映了欧洲早期 SaaS 采用曲线中典型的科技行业主导。Healthcare、retail、manufacturing/logistics
              垂直在公开客户引用中代表性不足，说明存在潜在扩张空间。主要买方画像是 HR 经理或总监；员工通过自助门户成为次级用户；财务团队消费 payroll 和 reporting 输出。Personio 拥有 268+
              个生态集成伙伴（Partnerbase 数据），能嵌入既有技术栈，降低正在使用 Slack、Microsoft Azure、DATEV 或 Salesforce 等工具的潜在客户的切换摩擦。
