      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Personio 的退出路径受 $8.5 billion 标记约束。若按参考价 IPO，公开市场投资人必须在可比公开公司交易于 6–8× ARR 时接受 26–40× ARR。没有证据显示 Personio
              已提交 S-1 或同等文件，管理层也未沟通公开时间表。CEO Hanno Renner 自 2022 年融资以来没有公开设定 IPO 目标。Pre-IPO 股份二级市场活动有限；Forge Global 将
              HiBob pre-IPO 活动作为参考数据点，但也指出欧洲私有 HR-tech 的二级交易仍然稀薄，价格常常是上一轮 primary round 的滞后映射。M&A 退出更可行，但需要买方接受相对 $8.5
              billion 的折价：SAP、Oracle 或大型 PE 基金可能以 $2–4 billion（我们的基准到牛市区间）收购 Personio，但会抵制支付 2022 年参考价。2026 年 4
              月盈利里程碑若被确认为 operating profitability 而非会计定义盈利，将显著降低退出时点压力。七项关键尽调问题仍未解决：ARR 和增长率（未披露）、毛利率（未公开）、NRR（未公开）、cap
              table 和 liquidation preference stack（私有）、二级市场清算价格（市场稀薄）、Aurio 驱动功能的 EU AI Act 合规路线图（未发布）、以及通过
              Bundesanzeiger 获取的法定账目（滞后 18+ 个月）。至少在 ARR 和 NRR 披露前，独立承销 $8.5 billion 标记在结构上不可能。
