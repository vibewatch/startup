      - number: '7.3'
        title: 运营、竞争与执行风险
        blocks:
          - type: paragraph
            body: >-
              Personio 的运营风险由两个结构性依赖锚定 —— DATEV 和 Remote.com。两者都能在 Personio 自身工程质量之外独立损害核心产品功能。DATEV 依赖最尖锐：一次始于 2026 年 6
              月 3 日的集成故障，截至 6 月 22 日仍未解决，德国 eAU（电子病假单）工作流被打断，影响 1,500 多家 Payroll DE 客户，连续至少 19 天。6 月 16 日另一次 payroll
              模块访问失败，以及 6 月 18 日提醒模块故障，显示 payroll 技术栈存在更广泛的可靠性成熟度缺口。Personio 的 Employer of Record 合作伙伴 Remote.com
              同时也是正在建设自身 HRIS 能力的直接竞争对手，在最具战略重要性的伙伴关系之一中形成结构性利益冲突。竞争层面，Rippling 在 G2 上有 20,318 条评论，而 Personio 只有 776
              条，反映美国起家的全球 HR 平台在欧洲销售周期中拥有品牌认知和产品成熟度差距。HiBob 已融资 $150M+，并在欧洲中端市场加速；Workday 和 SAP SuccessFactors 也在延伸 SMB
              层级。2026 年 1 月纽约裁员 —— 逆转 2023 年美国办公室开张 —— 说明北美扩张叙事已经停滞。多年 headcount reduction 周期，以及 Glassdoor 上关于管理层不稳定和
              IPO 战略不清晰的负面评论，进一步放大人员风险。2026 年 6 月 German Trustpilot 评论记录了客户对强制、未经请求产品更新的投诉，这些更新破坏了既有配置；合同也极度僵硬 ——
              至少一家公司被迫为未使用软件支付 12 个月费用，且没有特殊解约安排。SoftwareReviews 给 Personio 6.0/10，并将缺乏透明度和服务效果较弱列为结构性负面。最后，2026 年 4 月
              Aurio AI 收购引入了并购后整合风险和 EU AI Act 合规义务，这些在交易前并不在范围内。
