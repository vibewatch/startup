          label: 自动转换候选人记录
        - from: onboard
          to: admin
          label: 员工上线
        - from: admin
          to: payroll
          label: 工时 / 缺勤数据流入薪资
        - from: admin
          to: performance
          label: 员工数据驱动评审周期
        - from: performance
          to: admin
          label: 薪酬决策更新薪资记录
        - from: admin
          to: offboard
          label: 离职触发
