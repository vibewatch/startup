  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与盯市
        blocks:
          - type: paragraph
            body: >
              Personio 的 $8.5 billion 估值锁定在 2022 年 6 月 Series E-2。这是一轮由 Greenoaks Capital Partners 领投的 $200 million 融资，较
              2021 年 10 月 Series E 收盘时的 $6.3 billion 上调 35%。而 $6.3 billion 本身又较 2021 年 1 月 Series D 的 $1.7 billion 上调
              270%，把四年峰值到峰值的涨幅压缩进 21 个月。2022 年 6 月以来没有新的 primary financing，这是 Personio 融资史上最长的干旱期。2025 年 6 月，Personio 完成
              $25.9 million follow-on extension —— 规模只是此前几轮的一小部分 —— 估值参考仍为未变的 $8.5 billion。这次 extension
              规模很小且没有估值上调，说明当前市场环境下机构投资人并不愿意把公司重新定价到更高。盯市分析指出问题所在。进入 2026 年，公开 SaaS 公司企业价值 / ARR 中位数为 6–7×，低于 2021 年末记录的
              18.6× 峰值。SaaS Capital Index 证明，这次修正不是短期波动，而是向基本面的结构性重置。私有 SaaS 公司相对公开同业持续折价 30–50%，现实退出区间为 3–7×
              ARR，lower-middle market 中位数约 4.5×。NRR 超过 120%、Rule of 40 超过 50 的 top-quartile 私有公司可达到 7–12× ARR，最优秀的可超过
              12×。Personio 估计 ARR 为 €200–300 million（由约 16,000 家客户乘以估计年均合同价值 €12,500–18,750 推导 —— 标记为估计，未公开披露），在 $8.5
              billion 标记下隐含 EV/ARR 为 26–40×。即使用当前任何基准中最慷慨的一端 —— 给欧洲市场领导者和 AI 叙事 15× 溢价倍数 —— 公允价值也不超过 $5.6 billion；按现实的
              8× base-case 倍数，公允价值为 $2.1–2.6 billion，较参考价低 69–75%。
