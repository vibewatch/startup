      - number: '5.4'
        title: AI 战略、产品成熟度与约束
        blocks:
          - type: paragraph
            body: >
              Personio 的 AI 战略以 2026 年 4 月收购 Aurio 为锚点。Aurio 是慕尼黑 AI 初创公司，专注招聘自动化。Aurio 团队加入 Personio
              的产品、工程和设计部门，任务是自动化寻源和筛选：AI 识别相关候选人画像，评估并排序进入的申请，但最终招聘决定仍由人来做。短期集成路径很强 —— Personio 已有 9,000 家 recruiting
              客户，可以直接承接采用。到 2026 年 6 月，AI recruiting 模块定价尚未披露。除 Aurio 外，Personio 还推出了 AI 驱动的 Conversations 收件箱，用来集中处理 HR
              问询；CEO Hanno Renner 2024 年披露的产品路线图也显示，2024 年下半年及之后会推出更多 AI 能力，但未说明具体功能。各模块成熟度不一：Core HRIS 和 German Payroll
              最成熟（合规逻辑最深、客户基数最高）；Recruiting 使用率高（9,000 家客户），但反复集成事件暴露实施复杂度；Performance & Development 在 G2
              上持续获得好评，但企业级评审者认为它「仍在开发中」；Compensation Management、Surveys、Whistleblowing 较新（2023
              年），缺少同等深度的客户验证。实施复杂度是一个负面信号：G2 评论提到加载慢、工作流自定义僵硬；Capterra 用户指出兼职 / 全职混合用工场景下 UX 复杂，以及报告的 30%+
              涨价；SoftwareReviews 数据显示推荐可能性只有 68%，低于品类中位数。平台明确瞄准 10–5,000 人公司，缺少面向轮班制或小时工的高级劳动力管理功能，形成结构性产品天花板。
