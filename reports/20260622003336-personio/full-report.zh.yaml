  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Personio 的主要收入引擎是按员工数按月收费的 SaaS 订阅，采用定制报价模式销售。官方定价页确认不公布标价；所有合同都需要直接销售接触。来自 hr.software
              和可比平台的第三方评价数据提示，SMB 客户典型月费大约为每员工 €2–8，多国、更大规模和企业合同则单独谈判，且很可能收取溢价。核心 HRIS
              模块覆盖员工数据管理、数字人事档案、缺勤追踪和基础工作流；薪资、绩效管理、分析和招聘等 add-on 模块同时扩展产品范围和单账户平均收入。Personio 的次要收入流是通过招聘网站进行
              multi-posting——招聘模块集成超过 1,000 个外部招聘网站，发布费用转嫁给客户或打包给客户。2026 年 4 月收购慕尼黑 AI 招聘初创 Aurio，预示即将推出高阶 AI
              招聘能力，Personio 尚未公开为其定价。模块化是主要 ARPU 扩张机制：既有客户附加薪资、绩效或 AI 招聘模块，会产生显著更高的年度合同价值。核心订阅的收入确认较为直接——欧洲 SMB SaaS
              通常按月或按年预付——但招聘网站收入确认可能取决于费用按 gross 还是扣除网站收费后的 net 计入，这一区分尚未公开披露。
