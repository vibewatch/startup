      - - EU AI Act 不合规
        - 2026 年四季度前未提交合格评定；AI 功能未在 EU AI 数据库注册
        - 监管机构对 Personio AI 功能发出执法通知
        - 重大执行风险；可能需要下线功能或高成本整改
      - - DATEV 集成永久受损
        - DATEV 宣布 API 弃用或监管变化，移除 DATEV 集成路径
        - Personio German Payroll 失去 DATEV 记账同步或 eAU 合规能力
        - German Payroll DE 增长论点破裂；需要平台重构或退出市场
      - - 薪资故障导致客户流失加速
        - 净收入留存低于 90%（推断）；Trustpilot/G2 上薪资投诉量明显上升
        - 确认薪资模块 NRR 低于 90% 或 NPS 下降超过 15 分
        - 触发流失风险重评；可能需要重构定价 / SLA
    notes: 否决标准是从风险登记表推导出的投资人视角分析阈值；Personio 未披露任何内部风险阈值或客户 SLA 承诺。
    claimRefs:
