        title: 图表证据
        blocks:
          - type: callout
            title: 偏向供应商的合同条款制造留存与声誉张力
            body: >
              一条独立 SoftwareReviews 客户评价称 Personio 合同「偏向供应商」、客户支持难以联系，并把功能集归类为「Commodity
              Features」。这一负面信号重要，因为它暗示合同锁定虽然保住客户，却可能形成声誉拖累；在买方看过这些评价的交易中，Personio 相对 HiBob 和 Factorial
              的竞争定位会受损。尽调应检查因合同不满导致的流失，与竞争性替代导致的流失各占多少。
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP043
          - type: callout
            title: 普遍定价不透明显示市场尚未商品化
            body: >
              领先的欧洲 SMB HRIS 供应商——Personio、HiBob、Factorial——都不公开透明的按席位定价；企业级 SAP HCM 和 Workday
              也不公开。这种普遍不透明说明市场尚未转向自助式、产品驱动采购。它通过销售周期摩擦和定价不透明利好
              incumbent，但也意味着任何提供透明包装的供应商，都可能扰动该类别的分销动态。买家目前必须先与每家供应商销售团队接触，才能形成可比较的 total-cost-of-ownership 视图。
            calloutType: insight
            claimRefs:
              - CP011
              - CP035
              - CP036
              - CP040
              - CP046
          - type: callout
            title: 欧洲 GDPR 原生架构是耐久结构性优势
            body: >
              Personio 的数据架构从创立之初就为欧洲监管环境而建——GDPR Article 30 记录保存、多国薪资税务逻辑和 EU 数据驻留，都是设计时约束，而非后来补丁。相较 BambooHR（EU
              数据仅在爱尔兰）和 Rippling（EU 扩张仍处早期）等美国起家竞品，这形成了有意义的结构性优势；后者必须事后加合规层。SAP HCM 具备可比的合规深度，但定价和实施复杂度是企业级水平，对 Personio
              50–500 人 ICP 基本无关。
