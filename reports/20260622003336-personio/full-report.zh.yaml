      - number: '4.3'
        title: 单位经济与效率代理指标
        blocks:
          - type: paragraph
            body: >
              Personio 不公开披露毛利率、net revenue retention、获客成本、回本周期或客户 lifetime value——这属于私有 SaaS
              的标准不透明，使独立承销只能依赖基准和代理指标。Personio 这一规模的欧洲 B2B SaaS 公司通常毛利率在 65–80% 区间；以软件订阅交付为主的模式（云基础设施带来低 COGS，加上人工
              customer success）与该区间上半段一致。Sifted 2024 年一篇画像指出，Personio 已实现显著 ARR 增长但拒绝披露数字；分析聚合机构 Contrary Research
              估计，年度经常性收入处于数亿欧元低到中位区间。考虑客户数从 2023 年约 10,000 家增长到 2026 年 16,000 家，以及定价推动的 ARPU 扩张，2025–2026 年 run rate 可能在
              €150–300 million 区间。欧洲 mid-market HRIS 的 net revenue retention 通常为 105–120%；没有披露流失和扩张数据，Personio 的 NRR
              无法独立确认。截至 2026 年中约 2,000 名员工，相对于估算 ARR，意味着 ARR-per-FTE 代理值为 €75,000–€150,000，符合一家规模化并接近盈利的 SaaS 公司。一个 200
              人 SMB 客户若按每席每月 €2–8 计费，年度合同价值约为 €5,000 至 €19,000，意味着核心客户的 mid-market ACV 约为 €8,000–€14,000。COGS
              由云基础设施、薪资处理技术、customer success 人员，以及 Aurio 之后的 AI 模型服务成本驱动。
