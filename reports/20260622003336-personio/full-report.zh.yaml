      - number: '3.2'
        title: 直接同行分析——HiBob、Factorial 与 BambooHR
        blocks:
          - type: paragraph
            body: >
              HiBob 的 Bob 平台被营销为面向成长型 mid-market 公司的全球 HR 和 people-experience 平台。HiBob 自有网站显示，Bob 在 2,335 条 G2 评价中评分
              4.5/5，在 177 条 Capterra 评价中评分 4.7/5；公司还展示了 G2 授予的「#1 Best Global Solution — Core HR 2026」称号。平台提供 100
              个或更多集成，横跨薪资与福利、ERP、生产力和协作类别。公开客户证言显示，HiBob 客户包括 Computer Software、Automotive 和 Online Marketing 行业、员工
              201–500 人的公司，说明其甜蜜点更偏 mid-market，而非入门 SMB。HiBob 在 200–500 人区间上沿与 Personio 重叠，但在 Personio 相对不占优的 500–2,000
              人 mid-market 中竞争更激进。GetApp 的 Personio vs. HiBob 对比页提供来自聚合用户评价的并列功能评分；Personio 自己针对 HiBob 的比较页则强调欧洲 GDPR
              原生设计和全流程 all-in-one 覆盖作为差异化。两家公司都不公开透明的按席位定价。Factorial 创立于巴塞罗那，主要在南欧和西欧运营，按最近披露数字声称服务超过 16,000
              家公司。Factorial 定价页不列按席位或按层级费率，而是描述为完全定制、基于报价。公司声称十个客户中有九个给 onboarding 五星评价，且自动化将客户工作时长减少
              60%；这些均为公司自述指标，缺乏独立佐证。Factorial 移动应用在 Google Play 和 App Store 获约 30,000 名用户评分 4.7。Factorial 在 50–500 人 SMB
              区间的下半段与 Personio 直接竞争，并在西班牙和南欧等 Personio 品牌较弱市场尤其有优势。Personio 对 Factorial
              的比较页强调更广的欧洲国家覆盖和更深的薪资本地化，作为主要优势。BambooHR 是总部位于美国的 HRIS 平台，其 EU 客户数据托管在爱尔兰，以满足欧洲数据合规要求。平台采用 Zero Trust
              安全模型，每年接受第三方 SOC II 审计，支持 SAML 身份联合，并每年进行渗透测试。BambooHR 将自己定位为 HR 软件方案，而非 PEO 或 HR
              外包商。其北美市场集中度和美国优先的薪资路线图，使 Personio 在欧洲采购场景中拥有结构性优势，因为原生欧洲大陆薪资集成是硬性要求。
