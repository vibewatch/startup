      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              公开 HR-tech 和 payroll SaaS 倍数提供最透明的定价锚。行业风向标 Workday（WDAY）报告 FY2026（截至 2026 年 1 月 31 日）总收入 $9.6
              billion、订阅收入 $8.8 billion，12 个月 forward subscription backlog 为 $8.8 billion。以进入 2026 年约 $53 billion
              的市值计算，Workday 约按 6.0× NTM subscription ARR 交易；其溢价来自主导企业市场地位、1 万多家客户基础和强平台锁定。Paylocity（PCTY）是客户规模画像上最接近
              Personio 的 SMB payroll 和 HR 平台，凭借 20%+ 收入增长和持续 Rule of 40 超额表现，EV/ARR 达 7–8×。Ceridian/Dayforce 增速较慢，交易在
              6–7×；Paychex 因收入结构更偏传统和服务，交易在 5–6×。私有同业中，Rippling 2026 年 3 月年化收入达到 $1 billion，同比增长 78%，并在 2025 年 5 月
              Series G 中估值 $16.8 billion —— 隐含约 16.8× ARR，溢价来自三位数历史增长和横跨 HR、IT、fintech 的独特复合产品战略。HiBob 是 Personio
              最直接的欧洲中端市场同业，最近一轮融资估值 $2.45 billion，追加融资后 2026 年初估计约 $2.66 billion —— 对一家更早规模和成长阶段的公司，约隐含 10–15× 估计
              ARR。Factorial HR 2025 年完成 Series C，估值未披露，说明投资人仍愿意投欧洲 HR-tech，但支票规模小于 2021–2022 年周期。可比集合得出的结论一致：Personio 的
              $8.5 billion 参考价隐含 EV/ARR 26–40×，是公开可比区间的三到五倍，也约为最高增长私有同业 Rippling（78% YoY 增长）倍数的两倍。若要让 $8.5 billion 合理，公司
              ARR 需超过 €600 million（按 12× 倍数），这意味着从当前估计区间出现史无前例的加速，而没有任何公开证据佐证。
