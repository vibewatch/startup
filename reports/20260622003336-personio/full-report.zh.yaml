      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Personio 为 16,000 多家 SME 客户、超过 100 万名员工处理敏感个人数据 —— 包括病假记录中的健康信息和 payroll 中的财务数据。这一数据足迹让公司处在 General Data
              Protection Regulation 下最高风险层级。截至 2026 年 6 月，欧盟和 EEA 的 GDPR 执法机构已发布 3,194 起被跟踪执法行动，罚款总额超过 €6.31
              billion；European Data Protection Board 自身指南规定，数据处理方的严重违规最高可被处以全球年营业额 4% 的罚款。尚无公开记录显示 Personio 遭 GDPR
              调查，但在这种执法强度下，没有执法历史不等于合规保证。EU AI Act（Regulation 2024/1689）带来另一层监管风险，而 Personio
              的公开沟通尚未充分承认。该法案将用于就业、员工管理和自雇准入的 AI 系统 —— 包括 AI 辅助招聘、绩效评估和劳动力监控 —— 归为 Annex III
              下的高风险系统，触发合格评定要求、风险管理和数据治理文档义务，以及强制注册。Personio 在 2025–2026 年推出多项 AI 功能，并于 2026 年 4 月收购 Aurio 以加速 AI
              驱动招聘；两项部署都没有伴随公开的 EU AI Act 合规路线图。另一个义务来自 EU Directive 2023/970 薪酬透明度，要求 100 名以上员工的雇主从 2026
              年起报告性别薪酬差距数据，迫使 HR 软件供应商构建或更新 pay-gap reporting 功能。Payroll 侧，2026 年 5 月一条 UK Trustpilot 评论记录了 Personio
              payroll 迁移导致德国税务文件（Lohnsteuerbescheinigung）数据错误，并持续超过两个月未解决 —— 这是核心受监管工作流中的数据完整性和合规失败记录。
