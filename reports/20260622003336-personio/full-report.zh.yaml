  - id: FV004
    title: 投资 KPI——IC 六维评分
    type: kpi
    layout: standard
    summary: |
      从市场地位、业务验证、竞争护城河、单位经济、风险评级和估值吸引力六个维度给出可供 IC 使用的 0–10 分评分；尽管市场基本面强，估值拖累仍把整体分数拉到 4.5/10。
    data:
      items:
        - label: 市场地位
          value: 8
          context: 欧洲 SMB HR-tech 领导者；16,000 家客户；主导 DACH
        - label: 业务验证
          value: 6
          context: 首个盈利季度；客户增长强；ARR 不透明
        - label: 竞争护城河
          value: 6
          context: HRIS 数据锁定深；薪资模块粘性强；Rippling 和 HiBob 正在追近
        - label: 单位经济
          value: 3
          context: ARR、毛利率、NRR 完全未披露；无法独立验证
        - label: 风险评级
          value: 3
          context: 下调估值风险 52–89%；EU AI Act；GDPR 敞口；DATEV 中断
        - label: 估值吸引力
          value: 1
          context: $8.5B 隐含 26–40× ARR 估算；高出可比倍数 3–5×；牛情景也达不到参考价
    approximationNotes: |
      分数是作者基于截至 2026 年 6 月收集证据作出的定性评估。每个维度按 1–10 分打分（10 = 最好）。整体综合分不是简单平均；估值吸引力是拥有否决权的维度。
    claimRefs:
      - CV001
      - CV006
      - CV009
      - CV032
      - CV040
      - CV041
