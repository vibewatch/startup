  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Personio 的竞争场域分为四个不同层级，每一层都带来不同的替代或间接压力。第一层是直接的欧洲和全球 SMB HRIS 同行，包括 HiBob——一个面向 mid-market 公司的全球化
              people-experience 平台，以及 Factorial——一家总部位于巴塞罗那、服务欧洲 16,000 多家公司、在西班牙和南欧优势最强的 HRIS。第二层由美国起家的 HRIS
              平台构成，它们已为欧洲买家做适配：BambooHR 将 EU 客户数据存放在爱尔兰，并持有 SOC II 认证，但产品路线图仍以美国为先；Rippling 将 HR、IT 和薪资统一到一个 workforce
              management 系统，并正在美国以外扩张。第三层涵盖企业级 incumbent——SAP SuccessFactors 和 Workday——其典型部署从 500
              名或更多员工起步，复杂度和定价结构排除了多数 SMB。第四层是相邻而非直接竞争：Remote 和 Deel 专注 employer-of-record 基础设施和面向国际分布式员工的全球薪资，只在跨境薪资管理上与
              Personio 重叠。Personio 50–500 人的欧洲 SMB ICP 主要位于第一层与第二层之间的战场。Sage HR 和 Workable
              等英国、爱尔兰区域玩家在特定国家市场进一步增加碎片化，但没有在欧洲大陆取代 Personio。竞争地图指向一个以欧洲监管熟练度为主要资格门槛的市场；对那些后来才补 EU
              合规、而不是从原始数据架构中嵌入合规的美国平台而言，这造成结构性劣势。
