  - id: FE002
    title: Personio 客户工作流：核心 HR 流程中的 HR 管理员操作流
    type: flow
    layout: standard
    summary: |
      运营流程展示欧洲 SMB 的 HR 管理员如何使用 Personio 管理员工从入职到绩效评审的生命周期，也说明平台声称能把过去割裂的工作流统一到单一记录系统中。
    data:
      nodes:
        - id: hire
          label: 新员工录用决定
          description: 招聘人员在 Recruiting 模块中关闭候选人流程；记录直接转为员工档案 — 无需重新录入
        - id: onboard
          label: 入职工作流
          description: 自动触发入职任务；数字 offer letter + 电子签名；通过工作流自动化触发 IT 配置；激活 SSO 账户
        - id: admin
          label: 日常 HR 管理
          description: 员工自助提交缺勤申请、记录工时、访问文档；经理通过工作流审批；组织架构图自动更新
        - id: payroll
          label: 薪资处理（德国）
          description: Personio Payroll DE 按 ITSG 认证的德国规则计算薪资；导出 DATEV 用于记账；非德国国家则导出预备薪资数据
        - id: performance
          label: 绩效评审周期
          description: 可配置评审周期；360 反馈；跟踪 OKR；结果连接到 Compensation Management 模块用于薪资评审
        - id: offboard
          label: 离职
          description: 离职工作流自动化；文档归档；触发访问权限撤销；最终薪资计算
      edges:
        - from: hire
