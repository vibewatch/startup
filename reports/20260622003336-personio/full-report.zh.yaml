      - number: '1.4'
        title: 规模指标与运营
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Personio 的运营版图覆盖八座城市：慕尼黑（总部）、柏林、伦敦、都柏林、阿姆斯特丹、巴塞罗那、马德里和纽约；最近一次公开员工数为 2024 年中约 2,000 人。公司未披露 2026
              年精确员工数；第三方估算从约 1,700 人到超过 2,100 人不等，反映了 2024 年两轮重组和 2026 年 1 月通过 WARN Act 文件削减 47 名纽约员工的影响。客户牵引力截至 2026 年
              4 月约为 16,000 家企业，其中仅招聘模块就被 9,000 个账户采用。Personio 最新的原生模块 payroll 同比增长约 80%，服务超过 1,500
              家客户，显示既有客户群内部的产品驱动扩张。根据 Sifted 引用的公司文件，FY2022 收入为 €94.7M；公司不披露当前 ARR 或收入 run rate，第三方对 2026
              年的估算具有推测性且未经确认。2025 年，公司入选 Forbes Cloud 100 第 69 位，提供了独立第三方对规模和市场可信度的信号。$8.5B 估值仍是 2022 年 6
              月以来最后一个公开锚定数字；2025 年延伸融资或此后任何时期均未确认上调或下调估值。
