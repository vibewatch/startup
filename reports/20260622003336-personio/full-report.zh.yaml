      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Personio 的高管团队由创始四人组 Hanno Renner（CEO）、Jonas Rieke（COO）、Roman Schumacher 和 Arseniy
              Vershinin，加上一批主要来自美国科技公司的资深运营者组成。Renner 自公司创立以来一直担任 CEO，是最清晰的关键人物集中风险；若其离任，将显著冲击产品战略、投资者关系和文化。Rieke 作为 COO
              与另一位联合创始人形成运营连续性，但董事会尚未公布正式继任计划。一个与尽调相关的差异值得注意：Wikipedia 将 Ignaz Forstmeier 而非 Jonas Rieke
              列为原始联合创始人之一，这与公司沟通和多数媒体来源列名 Rieke 相冲突，需要直接澄清。CFO 由 Birgit Haderer 担任；Maria Angelidou-Smith 自 2022 年 11 月起以
              CPTO 身份负责产品和工程，这一关键招聘被认为把产品与工程统一到单一问责结构下。Naman Khan 2023 年 10 月从 Salesforce 和 Dropbox 加入，担任首任 CMO；Lenke
              Taylor 2024 年 2 月从 Twitch 加入，担任 CPO。2025 年，Cloudflare CFO Thomas Seifert 加入董事会，独立董事监督扩大，也在潜在 IPO
              窗口前补入公开市场财务经验。Hanno Renner 也是活跃天使投资人，个人投资 16 笔，并担任 Accel scout，因此带来轻微利益冲突监测事项。除 Seifert
              外，董事会构成尚未完全披露，构成需要尽调的治理信息缺口。
