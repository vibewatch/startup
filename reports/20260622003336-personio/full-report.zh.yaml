      layers:
        - id: infra
          label: 云基础设施
          detail: AWS 欧盟数据中心；静态数据 AES-256；传输中 TLS 1.2+；多租户 SaaS；每周维护窗口为 CEST 周二 22:00–00:00
        - id: security
          label: 安全与合规层
          detail: ISO 27001；ISO 27017:2015；GDPR by design；ITSG（德国薪资）；RBAC；SSO（Entra ID、Okta、Google）；2FA；Trust Center
        - id: core-hris
          label: 核心 HRIS — 员工与组织数据
          detail: 数字员工档案；组织管理；文档与电子签名；缺勤与工时管理；薪酬管理；分析与报表；主页与收件箱
        - id: functional-modules
          label: 功能型 HR 模块
          detail: 德国薪资（ITSG 认证）；预备薪资（通过集成覆盖 80+ 个国家）；招聘（ATS + 1,000+ 个招聘网站）；绩效与发展；薪酬管理；调研；举报
        - id: advanced-capabilities
          label: 高级 / 合作伙伴能力
          detail: AI 招聘（Aurio — 截至 2026 年 6 月正在集成）；名义雇主（Remote.com — 100+ 个国家）；Conversations（AI 驱动的 HR 收件箱）
