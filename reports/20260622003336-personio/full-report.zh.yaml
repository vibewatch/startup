      - number: '6.3'
        title: 留存、切换摩擦、负面证据与缺口
        blocks:
          - type: paragraph
            body: >
              Personio 没有公开披露净收入留存（NRR）或总收入留存（GRR），这是评估投资耐久性时最重要的证据缺口。现有最佳代理指标是 SoftwareReviews 的「Plan to Renew」为
              85%，大致符合欧洲中端市场 HRIS 的品类正常总续约率。同一数据集显示，Likeliness to Recommend 只有 68%，Satisfaction of Cost Relative to
              Value 为 61%，两者都低于典型 B2B SaaS 基准，说明留存可能更多来自价格不敏感和切换成本，而非忠诚度。Capterra 平台记录 Customer Service 评分
              4.5/5，是其四个被衡量维度中最高的一项，说明支持质量是留存杠杆。

              结构性切换成本强化留存：员工主数据、payroll 历史、文档档案和多年工作流配置深度集中，迁移到竞争平台成本很高。一名 UK Trustpilot 用户描述曾在三家不同公司实施
              Personio，这是独立观察到的重复采用信号。不过，2026 年 5 月一条负面的 UK Trustpilot 评论描述了严重的 payroll
              迁移失败：德国官方税务文件（Lohnsteuerbescheinigung）数据错误，客户提供详细分析后仍两个月未解决。Personio 的公开回应承认 payroll
              支持响应时间不足，并称正在推进补救措施。GetApp 评论者也提到定价上涨、新功能模块额外收费和反复技术 bug。SoftwareReviews 将 Personio
              某些合同条款归类为偏供应商、退出困难，这既是留存机制，也是竞争招标中买方的风险信号。NRR、GRR、流失曲线或 cohort 级留存数据均未披露，使 16,000 家客户基础的耐久性无法达到投资人所需置信度。
