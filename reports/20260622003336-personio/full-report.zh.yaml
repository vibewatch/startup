      - number: '2.2'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >
              分析师对欧洲 HR technology 市场的估算趋同于 2025 年 USD 4.8–4.9 billion 区间（按软件平台口径：IMARC Group 为 USD
              4.83B；MarketDataForecast 为 USD 4.81B），并预计到 2034 年 CAGR 约 7.3–7.6%。若纳入薪资服务机构、HR 咨询和 BPO，广口径估算显著更高：Future
              Market Insights 将 2025 年欧洲 Payroll and HR Solutions 市场定为 USD 10.91B，并预计到 2035 年 CAGR 为 9.6%。方法口径分歧——仅软件
              vs. 包含服务——使直接比较不可靠，也为精确推导 SAM 留下重要证据缺口。按 IMARC Group 细分，SMB 板块（少于 1,000 名员工的公司）在 2025 年约占欧洲 HR technology
              市场价值的 40%，意味着仅软件 SMB 子市场约为 USD 1.9 billion。Mordor Intelligence 预计 SME 增速将快于大企业，2026–2031 年 CAGR 约
              9.3%，驱动力来自云采用加速、监管要求和疫情后数字 HR 工作流常态化。全球基准提供补充背景：DataInsightsMarket 估计，全球 HRIS software 市场 2025 年为 USD 25
              billion，到 2033 年 CAGR 为 10%；若口径一致，欧洲约占全球 HRIS 支出的 19–20%。西欧（德国、法国、荷兰）采用成熟度领先；南欧和东欧（西班牙、意大利、波兰、捷克共和国）增长最快，由
              SME 数字化和政府数字化转型激励推动。德国是 Personio 最大单一国家市场，原因包括其起源地、复杂薪资监管，以及 Personio 获 ITSG 认证的原生德国薪资模块。Eurostat 2022
              年数据给出结构性背景：EU 约有 32.3 million 家企业，其中 99% 为微型和小型企业（50 人以下），0.8%（约 240,000 家）为中型企业（50–249 人）。Personio
              10–2,000 人的实际 ICP 覆盖这 240,000 多家中型企业中的绝大多数，以及一部分规模较大的小企业，构成一个在 HR 软件上仍显著数字化不足的结构性需求池。
