      - number: '5.2'
        title: 平台架构与集成生态
        blocks:
          - type: paragraph
            body: >
              Personio 是托管在 AWS 欧盟数据中心的多租户云 SaaS，完全通过浏览器交付（无需客户端安装），并配有 Mobile App。技术架构细节没有公开披露，但 REST API
              文档（developer.personio.de）显示，其 v1/v2 端点覆盖 Employee、Attendance、Absence、Recruiting、Custom Reports 和
              Webhooks。认证使用按账户生成的 client_id/client_secret 凭证对；Webhooks 在 30–60 秒内最多重试 3 次。API 禁止通过 CORS
              从浏览器端直接调用，要求服务器端集成。关键 API 约束包括：GET Employee 端点不提供薪资数据（固定薪资 100% 和小时工资除外）；无法通过 API
              创建自定义属性；员工历史值或计划值不会返回（只返回当前值）。集成生态覆盖 200 多家 marketplace 合作伙伴，G2 上有 170 个经验证集成；身份提供商包括 Microsoft Entra
              ID、Okta 和通过 OpenID Connect/OAuth 2.0 接入的 Google SSO。重要薪资执行集成包括面向英国 / 爱尔兰的 Xero 和 Sage，以及面向德国记账工作流的 DATEV
              集成。产品合作伙伴计划要求通过 Personio 的技术质量检查，且仅限服务 SMB 的欧洲市场 SaaS 提供商。开发者社区信号偏弱但仍活跃 —— 官方 personio/api-docs GitHub 仓库有
              31 个 star，第三方 at-gmbh/personio-py Python 客户端有 27 个 star，说明生态参与度有限，还谈不上广泛的平台开发者社区势能。
