      - number: '5.3'
        title: 安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >
              Personio 的信息安全底座由 ISO 27001 认证（每年经独立审计续证）和 ISO 27017:2015（云专项安全控制）支撑。所有静态数据通过 AWS KMS 用 AES-256 加密，覆盖 S3
              存储、生产数据库和备份；传输中数据使用 TLS 1.2+ 和 HSTS。认证支持邮箱 / 密码、可选 2FA，以及通过 OpenID Connect/OAuth 2.0 接入的 SSO（Microsoft
              Entra ID、Okta、Google）。基于角色的访问控制（RBAC）和可自定义密码策略，让企业管理员可以做细粒度控制。德国 Payroll 获 ITSG 认证，满足社保机构的数据交换要求。Trust
              Center（trust.personio.com）记录了 ISO 27001 计划和 GDPR by design 原则。一个明显安全缺口是：Personio 没有公开确认 SOC 2 Type II 认证
              —— hr.software 和 outsail.co 都把它列为买方需核验事项。托管服务商使用 SOC 1 和 SOC 2 认证数据中心（AWS EU），但这不等同于 Personio 自身出具 SOC 2
              审计报告。公开状态页（status.personio.de）的可靠性证据显示，2026 年 6 月多次发生重复性事件：影响德国 eAU（电子病假单）的 DATEV 集成故障自 6 月 5 日起仍在持续；6 月
              16 日 Payroll 模块无法访问（当天解决）；6 月 18 日提醒模块反复故障（已解决）；6 月 8 日和 15 日 Recruiting 邮件集成失败（均已解决）。每周维护窗口（周二
              22:00–00:00 CEST）会可预期地影响平台可用性，但计划外事件频率显示，集成层可靠性 —— 尤其是 payroll 和 DATEV —— 对德国企业买方需要更高强度尽调。
