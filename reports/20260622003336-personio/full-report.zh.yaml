      - number: '4.4'
        title: 资本充足性与负面融资信号
        blocks:
          - type: paragraph
            body: >
              Personio 最近一次披露的流动性事件是 2022 年 6 月 Series E-2（$200 million），此后没有公开发布资产负债表或现金头寸更新。估算 2022 年中至 2026
              年初之间累计消耗的运营现金具有推测性：约 2,000 名员工，欧洲科技薪酬平均约 €50,000–€80,000/年，加上云基础设施、销售营销和 R&D 支出，2022–2024
              年在走上盈利路径前，年度总现金流出很可能在 $60 million 至 $120 million 区间。2026 年 4 月盈利季度，叠加没有任何新融资，显示 Personio
              可能已达到运营现金中性或更好，不过新闻稿没有说明盈利的精确定义。2026 年 1 月 WARN Act 文件覆盖 47 个纽约岗位，约占全球员工数 2.4%；Teamblind 讨论提到 2023–2024
              年此前多轮裁减，这与公司在走向盈利同时持续执行降本计划相一致。2026 年 4 月 Aurio 收购未披露财务条款，但其与盈利公告同步，意味着公司有现金做 bolt-on M&A。Personio
              融资结构完全基于股权；没有披露或独立记录任何 venture debt、credit facilities 或 project-finance 义务。八轮股权融资后，cap table
              承担显著机构稀释，具体持股比例未披露。
