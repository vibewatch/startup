    approximationNotes: >
      客户数（约 16,000）和平均员工规模（约 200）来自 Personio 沟通和第三方资料。按员工月费（€2–8）为分析师估计。ARR 区间基于 Contrary Research 和 Sifted 的二手数据。毛利区间套用
      65–80% 的 SaaS 基准。没有财务报表确认这些数字。
