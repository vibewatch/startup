        - $8.8B（FY2026 订阅收入）
        - ~6.0×
        - 行业风向标；企业级；10-K 提供 NTM ARR backlog 数据
        - Personio 规模约小 30×，且聚焦 SMB；预期增长率更低
      - - Paylocity (PCTY)
