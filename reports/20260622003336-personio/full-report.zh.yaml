        - id: personio
          label: Personio 平台
          description: 核心 HR SaaS；中心节点；所有依赖都汇入产品交付
        - id: aws
          label: AWS EU（云基础设施）
          description: 主要计算 / 存储 / 数据库提供商；AES-256 KMS；存在单一 hyperscaler 依赖风险
        - id: datev
          label: DATEV（德国记账集成）
          description: 对德国 Payroll DE 记账导出至关重要；截至 2026 年 6 月 5–22 日仍有活跃故障，影响 eAU 工作流
        - id: itsg
          label: ITSG 认证机构（德国薪资）
          description: 德国社保数据交换需要的监管认证；必须每年维护
        - id: remote
          label: Remote.com（EOR 合作）
          description: 支撑 100+ 个国家的名义雇主服务；依赖第三方法律实体；SLA 和成本条款未披露
        - id: aurio
          label: Aurio AI 层（2026 年 4 月之后）
