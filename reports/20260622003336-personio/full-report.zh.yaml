      - CE004
      - CE005
  - id: FE003
    title: Personio 关键依赖地图：主要供应商、合作伙伴与监管方
    type: dag
    layout: wide
    summary: |
      有向无环图展示 Personio 的关键外部依赖：云基础设施、监管机构、集成伙伴和 AI 能力，以及每项依赖给产品连续性带来的风险。
    data:
