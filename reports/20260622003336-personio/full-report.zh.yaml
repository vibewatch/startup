chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Personio SE 是一家总部位于德国慕尼黑的欧洲云端 SaaS 公司，提供一体化 HR 平台，服务欧洲及国际市场的中小企业（SMB）。公司 2015 年由慕尼黑工业大学 Center for Digital
              Technology and Management（CDTM）的四名校友创立，以「People Operating
              System」作为品牌定位，用一个订阅产品统一员工数据管理、人才获取、薪资、工时追踪和绩效管理。对欧洲买家而言，Personio 的核心差异点是为 EU
              劳动与数据保护要求量身打造的原生合规架构，包括德国认证薪资处理；按 Global Payroll Complexity Index，德国拥有全球第二复杂的薪资规则。商业模式是按员工数按月收取 SaaS
              订阅费，并对企业客户采用报价制；招聘网站 multi-posting 集成提供第二收入来源。2023 年，Personio 将法律形式从德国 GmbH 转为 Societas
              Europaea（SE），此举降低跨境 EU 运营难度，也为未来上市铺好基础治理结构。公司的 Trust Center 记录了面向企业买家的持续 GDPR 合规和相关安全认证。第三方集成现已超过 100
              个连接应用，客户可把 Personio 保持为单一记录系统，同时接入专业薪资处理商、学习管理和身份提供商。
