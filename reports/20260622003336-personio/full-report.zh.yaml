      - number: '1.5'
        title: 里程碑与战略事件
        blocks:
          - type: paragraph
            body: >
              Personio 十一年发展轨迹呈现出稳定模式：产品驱动的地域扩张，间以补强型收购。2015 年在慕尼黑创立后，公司先在德语区快速获取客户，随后于马德里（2019 年）、伦敦和都柏林（2020
              年）、阿姆斯特丹（2021 年）、柏林和巴塞罗那（2022 年）、纽约（2023 年）开设国际办公室。收购主要补齐能力缺口：Rollbox（西班牙，2019 年）带来本地薪资专业能力；Back（德国，2022
              年）贡献工作流自动化和员工体验工具；Aurio（慕尼黑，2026 年 4 月）把 agentic recruiting AI 直接带入平台，用于自动化候选人搜寻和筛选，同时保留由人类做最终招聘决定。2026 年
              4 月，公司宣布历史上首个盈利季度，标志战略拐点——Renner 明确表示，公司现在可用持续业务现金流自筹创新，而非依赖外部资本周期，这降低了潜在 IPO 前的关键再融资风险。负面事件包括 2026 年 1 月
              WARN Act 裁员 47 名纽约员工，这是 2024 年两轮重组后最可见的一次缩减；Glassdoor 上 440 多条评价给出约 3.2–3.3/5 分，也反映员工情绪混杂。Personio
              Foundation 持有公司 1% 股份，提供声誉锚点，但也会在未来任何流动性事件中成为股权结构的小型考量。
