  topStrengths:
    - European HR-tech category leader with ~16,000 SMB customers, GDPR-native architecture, and certified German payroll that structurally disadvantages US-headquartered competitors
    - First profitable quarter (April 2026) demonstrates sustainable unit economics and removes near-term forced-capital-raise risk
    - 9,000-customer recruiting base provides direct upsell leverage for the AI-powered Aurio layer; active product investment despite funding silence
    - Deep EU labour-law and data-residency compliance moat is a structural entry barrier for non-European HR platforms
  topRisks:
    - "$8.5B 2022 valuation implies 26–40× EV/ARR — 3–5× above 2026 European SaaS comparable multiples of 6–10×; fair-value range on available estimates is $1–4B"
    - No public disclosure of ARR, gross margin, NRR, or burn rate prevents independent financial underwriting and limits diligence precision
    - EU AI Act Annex III high-risk classification for AI-powered recruiting and performance tools without any published conformity assessment or registration as of June 2026
    - DACH revenue concentration (≈50–60% of customers) and native payroll limited to Germany, UK, and Ireland constrain geographic expansion economics
  unresolvedGaps:
    - ARR, gross margin, net revenue retention, and burn rate remain undisclosed; fair-value range for the $8.5B anchor cannot be independently stress-tested
    - EU AI Act conformity assessment, technical documentation, and EU AI Office registration for Aurio-powered and AI-assisted features not yet published
    - Cap table details, investor rights provisions, secondary market clearing price, and board composition beyond Thomas Seifert are not publicly available
