companyProfile:
  summary: >
    Personio is a Munich-headquartered cloud-based HR SaaS company founded in August 2015
    by Hanno Renner, Jonas Rieke, Roman Schumacher, and Arseniy Vershinin — four alumni of
    the Center for Digital Technology and Management (CDTM) at TU Munich. The company
    positions its platform as the "People Operating System" for European SMBs with 10–2,000
    employees, combining HR administration, recruiting, payroll, time tracking, and
    performance management in a single subscription product. A GDPR-native architecture,
    certified German payroll processing, and deep EU labour-law compliance capabilities
    form the company's structural moat against US-headquartered entrants. As of April 2026
    Personio serves approximately 16,000 customers, employs roughly 2,000 people, and
    reached its first profitable quarter. The last disclosed valuation of $8.5 billion dates
    from the June 2022 Series E-2; no new primary round has been confirmed in the four years
    since, and the company does not publicly disclose ARR, gross margin, or NRR.
