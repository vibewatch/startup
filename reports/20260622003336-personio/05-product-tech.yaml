  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: internal-architecture
      missingEvidence: >
        Personio's internal software stack — programming languages, database engine (relational vs. NoSQL),
        frontend framework, CI/CD tooling, microservices vs. monolith architecture, caching layers, and
        uptime SLA commitments — is not publicly disclosed. The developer portal covers API surface only.
      whyItMatters: >
        Architecture depth matters for scalability assessment, vendor lock-in risk, and technical due
        diligence on whether the platform can support Personio's stated goal of serving mid-market
        customers with more complex HR data and workflow requirements.
      diligencePath: >
        Request a technical architecture overview from Personio's engineering leadership (CPTO Maria
        Angelidou-Smith); ask for: infrastructure diagram, language/framework choices, data model
        overview, uptime SLA terms, and DR/failover architecture documentation.
      relatedQuestionRefs:
        - QE022
        - QE026

    - type: private-evidence-only
      severity: material
      topic: Aurio-AI-spec
      missingEvidence: >
        Personio has not disclosed the Aurio AI model architecture, training data sources, fairness
        audit, pricing for the AI recruiting module, or a feature-complete specification. No public
        roadmap, beta program, or general availability date has been announced as of June 2026.
      whyItMatters: >
        The AI recruiting module is positioned as Personio's primary differentiator for 2026;
        without a feature spec or pricing, it is impossible to assess whether the Aurio integration
        will command a meaningful price premium, drive module attach, or compete credibly with
        dedicated AI-native ATS tools (e.g., Beamery, Eightfold).
      diligencePath: >
        Request Aurio integration roadmap, model provenance and fairness framework, EU AI Act
        compliance plan, pilot customer feedback, and planned go-to-market timeline from the
        product team.
      relatedQuestionRefs:
        - QE008

    - type: missing-source
      severity: material
      topic: DATEV-outage-resolution
      missingEvidence: >
        No public resolution timeline or root-cause analysis has been published for the ongoing
        DATEV eAU integration outage active since June 5, 2026 — as of June 22, 2026 (17 days).
        Personio's status page notes it is "waiting for DATEV to address the issue."
      whyItMatters: >
        German payroll compliance depends on reliable eAU exchange; a prolonged DATEV outage exposes
        Personio's customers to German social security compliance gaps and signals that third-party
        dependency risk in the payroll stack is non-trivial.
      diligencePath: >
        Request the root cause analysis and DATEV SLA terms from Personio; ask whether Personio has
        contractual recourse against DATEV for outage duration and customer impact; review the DATEV
        integration SLA in any enterprise customer contract template.
      relatedQuestionRefs:
        - QE006
        - QE023

    - type: private-evidence-only
      severity: minor
      topic: SOC2-certification
      missingEvidence: >
        Personio has not publicly confirmed whether it holds a SOC 2 Type II audit report covering
        the application layer (not just the hosting providers). The trust center cites ISO 27001 and
        GDPR; two independent review sources flag SOC 2 as unverified.
      whyItMatters: >
        SOC 2 Type II is increasingly required by US-headquartered enterprise customers and large
        European financial services companies as a vendor security prerequisite; absence of confirmation
        is a sales friction point for upmarket expansion.
      diligencePath: >
        Request the most recent SOC 2 Type II audit report from Personio security team; if it does not
        exist, ask about the roadmap for obtaining certification and the expected timeline.
      relatedQuestionRefs:
        - QE005

    - type: enumeration-incomplete
      severity: minor
      topic: product-module-completeness
      missingEvidence: >
        The full product module list is reconstructed from status page, API docs, and third-party
        reviews; Personio does not publish a canonical, versioned product module registry. New modules
        may have been launched in H2 2025–H1 2026 without public announcement beyond the status page.
      whyItMatters: >
        Buyers and analysts may be unaware of newer modules (e.g., Conversations AI inbox, AI
        document processing) that could affect product positioning and competitive comparison.
      diligencePath: >
        Request the complete current product catalog from Personio's product team; ask for module-level
        pricing, attach rates, and launch dates.
      relatedTableRefs:
        - TE001
      relatedQuestionRefs:
        - QE026

    - type: missing-source
      severity: minor
      topic: competitive-differentiation
      missingEvidence: >
