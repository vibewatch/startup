chapter:
  number: 5
  title: Product & Technology
  summary: >
    Personio delivers a cloud-based HR platform with 20+ distinct modules spanning core HRIS,
    payroll (native Germany/UK/Ireland; ITSG-certified), recruiting, performance, surveys,
    compensation management, whistleblowing, and employer-of-record (EOR) via Remote.com.
    The April 2026 acquisition of Munich AI startup Aurio adds candidate-matching and
    screening automation into the recruiting module, targeting Personio's 9,000 existing
    recruiting customers. The platform is hosted on AWS EU data centers, ISO 27001 and
    ISO 27017:2015 certified, and GDPR-compliant by design. A REST API with six endpoint
    groups and an open partner marketplace of 200+ integrations provide extensibility.
    Key technical constraints include: no native final payroll execution outside Germany/UK/Ireland
    (relies on Xero, Sage, and third parties); no salary data via the GET Employee API endpoint;
    no SOC 2 certification confirmed; and an ongoing DATEV integration outage since June 5,
    2026 that affects German eAU (electronic sick-note) workflows. Multiple smaller incidents
    in June 2026 signal a reliability maturity gap in the payroll and recruiting modules
    relative to the core HRIS surface.

sections:
  - id: product-suite-modules
    title: Product Suite & Module Architecture
    body: >
      Personio's platform is organized into a "People Operating System" — a unified HR
      suite designed to cover the full employee lifecycle for European SMBs with 10–5,000
      employees. The core HRIS module anchors the platform and provides digital employee
      files, organizational management, document storage with e-signature, absence tracking,
      and configurable workflows. Built atop this core are purpose-built modules: Payroll
      (native German payroll, ITSG-certified, growing 80% per year with 1,500+ customers as
      of April 2026; preliminary payroll and file-export integrations for UK, Ireland, and
      80+ other countries); Recruiting (applicant tracking, job-board multi-posting to 1,000+
      boards, interview scheduling, smart scheduling links; 9,000 customers use this module);
      Performance & Development (review cycles, 360-degree feedback, OKRs); Surveys
      (engagement surveys using centralized employee data and pre-built templates); Compensation
      Management (launched 2023); Whistleblowing (EU Directive 2023/970 compliant anonymous
      reporting channel); Conversations (AI-powered central inbox for HR); and Employer of
      Record powered by Remote.com (global hiring in 100+ countries without local entities).
      A Mobile App provides employee self-service. The April 2026 Aurio acquisition integrated
      an AI layer into the Recruiting module, targeting automated candidate sourcing, screening,
      and prioritization — with human final-decision preserved. Compensation Management, Surveys,
      Whistleblowing, and Conversations are newer additions (2023–2025) and represent Personio's
      expansion beyond pure HRIS administration into adjacent people-operations workflows.
