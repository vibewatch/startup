  - id: security-compliance-reliability
    title: Security, Compliance & Reliability
    body: >
      Personio's information security posture is anchored by ISO 27001 certification (renewed
      annually by independent audit) and ISO 27017:2015 (cloud-specific security controls).
      All data at rest is encrypted with AES-256 via AWS KMS for S3 storage, production
      databases, and backups; data in transit uses TLS 1.2+ with HSTS. Authentication supports
      email/password, optional 2FA, and SSO via OpenID Connect/OAuth 2.0 (Microsoft Entra ID,
      Okta, Google). Role-based access control (RBAC) and customizable password policies give
      enterprise administrators fine-grained controls. German Payroll is ITSG-certified,
      satisfying social security authority data exchange requirements. The Trust Center
      (trust.personio.com) documents the ISO 27001 program and GDPR compliance by design
      principles. A notable security gap: Personio does not publicly confirm SOC 2 Type II
      certification — hr.software and outsail.co flag this as a buyer verification item.
      The hosting providers use SOC 1 and SOC 2 certified data centers (AWS EU), but that
      is not the same as a Personio-issued SOC 2 audit report. Reliability evidence from the
      public status page (status.personio.de) reveals multiple recurring incidents in June 2026:
      a DATEV integration outage affecting German eAU (electronic sick-notes) ongoing since
      June 5; a Payroll module access failure on June 16 (resolved same day); a recurring
      reminders module outage on June 18 (resolved); and Recruiting email integration failures
      on June 8 and 15 (both resolved). Weekly maintenance windows (Tuesday 22:00–00:00 CEST)
      affect platform availability predictably, but the frequency of unplanned incidents
      suggests integration-layer reliability — particularly for payroll and DATEV — warrants
      heightened diligence for German enterprise buyers.
