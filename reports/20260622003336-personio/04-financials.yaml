company:
  name: Personio

chapter:
  number: 4
  title: Financials
  summary: >
    Personio operates a per-employee monthly SaaS subscription model with secondary revenue
    from job-board multi-posting integrations and a nascent AI recruiting module following the
    April 2026 Aurio acquisition. The company has raised approximately $772 million across eight
    rounds through 2025, with its last disclosed valuation of $8.5 billion established in June
    2022. An April 2026 announcement confirmed Personio's first-ever profitable quarter, though
    the profitability definition was not disclosed. Key financial metrics — ARR, gross margin,
    NRR, CAC, and burn rate — remain entirely private. The January 2026 WARN Act layoff of 47
    New York employees and a four-year absence of new primary funding are the most visible
    adverse financial signals. Valuation stasis since 2022 creates material down-round risk if
    a new primary raise is required, though the April 2026 profitability milestone reduces the
    near-term urgency.

sections:
  - id: revenue-model-pricing
    title: Revenue Model & Pricing Architecture
    body: >
      Personio's primary revenue engine is a per-employee per-month SaaS subscription sold on
      a custom, quote-based model. The official pricing page confirms that list prices are not
      published; all contracts require a direct sales engagement. Third-party review data from
      hr.software and comparable platforms suggest typical per-employee monthly rates in the
      roughly €2–8 range for SMB customers, with multi-country, larger, and enterprise contracts
      negotiated separately and likely commanding a premium. The core HRIS module covers employee
      data management, digital personnel records, absence tracking, and basic workflows; add-on
      modules for payroll, performance management, analytics, and recruiting extend both product
      scope and average revenue per account. Personio's secondary revenue stream is multi-posting
      via job boards — the recruiting module integrates with more than 1,000 external job boards,
      with posting fees passed through to or bundled for customers. The April 2026 acquisition of
      Munich-based AI recruiting startup Aurio signals a forthcoming premium AI recruiting
      capability, which Personio has not yet priced publicly. Modularity is the principal ARPU
      expansion mechanism: existing customers who attach payroll, performance, or AI recruiting
      modules generate materially higher annual contract value. Revenue recognition is
      straightforward for the core subscription — monthly or annual prepay is standard in
      European SMB SaaS — but job-board revenue recognition may differ based on whether fees are
      gross or net of board charges, a distinction not publicly disclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
