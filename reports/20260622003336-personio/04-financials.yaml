  - id: valuation-funding-history
    title: Valuation Trajectory & Capital History
    body: >
      Personio's capital formation spans approximately a decade and totals around $772 million
      in disclosed equity across eight rounds from 2016 through 2025. The most recent primary
      raise — a $200 million Series E-2 in June 2022 led by Greenoaks Capital Partners — set
      the last confirmed valuation at $8.5 billion. Two prior 2021 rounds — a $270 million
      Series E at $6.3 billion (October 2021) and a $125 million Series D at $1.7 billion
      (January 2021) — established Personio's rapid pre-money expansion from unicorn to
      super-unicorn status in under twelve months. The January 2020 Series C ($75 million at
      approximately $500 million) was co-led by Accel and Lightspeed. No new primary financing
      round has been announced in the four years from June 2022 to June 2026, which represents
      the longest dry period since Personio's Series B in 2018. This absence is consistent with
      either strong organic cash generation — evidenced by the April 2026 profitability
      announcement — or a deliberate avoidance of raising at or below the $8.5 billion reference
      valuation during a period of SaaS multiple compression. Valuation stasis over four years,
      combined with broad European tech multiple compression, creates plausible down-round risk
      if a new primary raise is required. Greenoaks Capital Partners, Index Ventures, Accel,
      Northzone, Lightspeed, and Meritech Capital are the primary institutional investors.
    claimRefs:
