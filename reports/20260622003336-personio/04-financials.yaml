    title: "Revenue Model Bridge: Customer Base to Gross Profit"
    type: flow
    layout: standard
    summary: >
      Conceptual flow showing how Personio's customer base converts into ARR and estimated gross
      profit through the per-employee subscription mechanism.
    approximationNotes: >
      Customer count (~16,000) and average employee size (~200) are from Personio communications
      and third-party profiles. Per-employee monthly rate (€2–8) is an analyst estimate. ARR
      range is based on Contrary Research and Sifted secondary data. Gross profit range applies
      a 65–80% SaaS benchmark. No financial statement confirms these figures.
    data:
      nodes:
        - {id: "customers", label: "~16,000 Customers", description: "European SMBs; avg ~200 employees each = ~3.2M total employee seats"}
        - {id: "arpu", label: "Per-Employee Contract (€2–8/emp/mo)", description: "Quote-based SaaS subscription; no published list price; add-on modules increase realized ARPU"}
        - {id: "arr", label: "Estimated ARR (~€150–300M)", description: "Analyst estimate range; exact ARR not disclosed by Personio; growth trajectory confirmed by Sifted 2024"}
