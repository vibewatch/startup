  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR-revenue
      missingEvidence: >
        Personio's current ARR and revenue trajectory from 2022 through 2026; no financial figure
        has been publicly disclosed since the company confirmed significant growth in a 2024 Sifted
        interview. Analyst estimates range from €150 million to €300 million but are unverified.
      whyItMatters: >
        Without ARR, no valuation multiple, growth rate, or revenue quality assessment is possible.
        The $8.5 billion valuation anchors to a 2022 data point; the gap between that anchor and
        current ARR determines whether the multiple is stretched, fair, or attractive — a binary
        diligence outcome.
      diligencePath: >
        Request trailing-8-quarter ARR by customer segment (micro-SMB, SMB, mid-market) and
        geography (DACH, UK, Southern Europe, other) from CFO Birgit Haderer; cross-check against
        billing system export and audited management accounts.
      relatedQuestionRefs:
        - QI002

    - type: private-evidence-only
      severity: material
      topic: CAC-payback
      missingEvidence: >
        Personio's Customer Acquisition Cost by channel (inbound, outbound, partner), blended
        payback period, and sales efficiency ratio (new ARR per S&M dollar). No proxy or
        third-party estimate exists beyond general European B2B SaaS benchmarks.
      whyItMatters: >
        Sales efficiency is a primary driver of capital intensity in SaaS; without CAC and
        payback data, it is impossible to judge whether the April 2026 profitability milestone
        reflects sustainable operating leverage or a temporary headcount-reduction effect.
      diligencePath: >
        Request S&M expense breakdown by channel, new ARR booked per quarter by segment, and
        sales cycle length data from the last 8 quarters; triangulate with partner and channel
        revenue share terms.
      relatedQuestionRefs:
        - QI008

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >
        Personio's actual gross margin and COGS decomposition by category (cloud infrastructure,
        payroll processing, customer success headcount, professional services, post-Aurio AI
        serving costs). No public financial statement is available.
      whyItMatters: >
        Gross margin is the ceiling on long-run EBITDA and the primary metric for assessing
        whether the April 2026 profitability milestone is structurally durable or requires
        continued headcount suppression to sustain.
      diligencePath: >
        Request P&L statement with COGS broken out by infrastructure, CS, payroll-engine, and
        other; ask for reconciliation between GAAP and any non-GAAP profitability adjustments.
      relatedQuestionRefs:
        - QI007
        - QI010

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >
        Personio's fully diluted capitalization table, including all investor ownership stakes
        post-Series E-2, ESOP pool size, any secondary transfers, and liquidation preference
        stack structure. No public registry filing provides this level of detail.
      whyItMatters: >
        Cap table structure determines return thresholds, control provisions, and waterfall
        mechanics for any exit scenario. Without it, no meaningful exit scenario analysis or
        founder/management alignment assessment is possible.
      diligencePath: >
        Request the fully diluted cap table from Hanno Renner or board secretary; cross-check
        against registered share capital at the German commercial registry (Handelsregister) to
        validate total share count.
      relatedQuestionRefs:
        - QI007
        - QI010
