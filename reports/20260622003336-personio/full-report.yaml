      - number: '1.3'
        title: Funding History & Investors
        blocks:
          - type: paragraph
            body: >
              Personio has raised approximately $772 million in disclosed capital across eight rounds spanning 2016
              through 2025. The company bootstrapped to nearly 100 customers before accepting a seed round of
              approximately $2.3M in 2016 from Picus Capital and Global Founders Capital (GFC). The financing trajectory
              accelerated through a Northzone-led Series A ($12M, 2017), an Index Ventures-led Series B ($40M, 2019), an
              Accel- and Lightspeed-led Series C ($75M, January 2020, ~$500M valuation), and an Index-led Series D
              ($125M, January 2021) that delivered unicorn status at a $1.7 billion valuation. Greenoaks Capital
              Partners emerged as the lead institutional anchor with a $270M Series E closing in October 2021 that
              valued Personio at $6.3B, followed by a $200M second tranche in June 2022 that established the current
              last-known valuation of $8.5 billion. The Personio Foundation was established in 2021, holding 1% of
              company equity (valued at roughly $85M at formation). A small extension round of approximately $25.9M was
              completed in June 2025. No new external funding round was announced in the twelve months to June 2026, and
              the April 2026 profitability announcement signals reduced near-term dependence on external capital. Equity
              stakes across all investors remain undisclosed publicly; the full cap table is a material diligence gap.
