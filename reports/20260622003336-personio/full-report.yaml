  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model & Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Personio's primary revenue engine is a per-employee per-month SaaS subscription sold on a custom,
              quote-based model. The official pricing page confirms that list prices are not published; all contracts
              require a direct sales engagement. Third-party review data from hr.software and comparable platforms
              suggest typical per-employee monthly rates in the roughly €2–8 range for SMB customers, with
              multi-country, larger, and enterprise contracts negotiated separately and likely commanding a premium. The
              core HRIS module covers employee data management, digital personnel records, absence tracking, and basic
              workflows; add-on modules for payroll, performance management, analytics, and recruiting extend both
              product scope and average revenue per account. Personio's secondary revenue stream is multi-posting via
              job boards — the recruiting module integrates with more than 1,000 external job boards, with posting fees
              passed through to or bundled for customers. The April 2026 acquisition of Munich-based AI recruiting
              startup Aurio signals a forthcoming premium AI recruiting capability, which Personio has not yet priced
              publicly. Modularity is the principal ARPU expansion mechanism: existing customers who attach payroll,
              performance, or AI recruiting modules generate materially higher annual contract value. Revenue
              recognition is straightforward for the core subscription — monthly or annual prepay is standard in
              European SMB SaaS — but job-board revenue recognition may differ based on whether fees are gross or net of
              board charges, a distinction not publicly disclosed.
            claimRefs:
