  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context & Mark-to-Market
        blocks:
          - type: paragraph
            body: >
              Personio's $8.5 billion valuation was locked in during the June 2022 Series E-2, a $200 million round led
              by Greenoaks Capital Partners that represented a 35% uplift from the $6.3 billion set at the October 2021
              Series E close. That $6.3 billion was itself a 270% step-up from the $1.7 billion established at the
              January 2021 Series D, compressing the entire four-year peak-to-peak run into twenty-one months. No new
              primary financing has followed since June 2022, making the four-year gap the longest dry period in
              Personio's funding history. In June 2025 Personio completed a $25.9 million follow-on extension — a
              fraction of its prior rounds — at the same unchanged $8.5 billion reference valuation. The minimal size of
              this extension and the absence of any valuation uplift signal that institutional investors have not been
              willing to re-price the company higher in the current market environment. Mark-to-market analysis anchors
              the problem. Public SaaS companies entered 2026 trading at median enterprise-value-to-ARR multiples of
              6–7×, down from the 18.6× peak recorded in late 2021. The SaaS Capital Index confirms the correction was
              not a blip but a structural reset to fundamentals. Private SaaS companies trade at a persistent 30–50%
              discount to public peers, with the realistic exit range 3–7× ARR and a median around 4.5× for the
              lower-middle market. Top-quartile private companies with NRR above 120% and Rule of 40 above 50 can reach
              7–12× ARR, and the very best close above 12×. Personio's estimated ARR of €200–300 million (derived from
              approximately 16,000 customers at an estimated average contract value of €12,500–18,750 per year — marked
              as estimated, no public disclosure exists) implies an EV/ARR of 26–40× at the $8.5 billion mark. Even
              using the most generous end of any current benchmark — a 15× premium multiple for a European market leader
              with AI narrative — fair value does not exceed $5.6 billion; at a realistic 8× base-case multiple, fair
              value is $2.1–2.6 billion, or 69–75% below the reference price.
