      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Vendor-Favouring Contract Terms Create Retention-Reputation Tension
            body: >
              An independent SoftwareReviews customer review described Personio's contract as "vendor-favouring" with
              difficult-to-reach customer support, and categorised the feature set as "Commodity Features." This adverse
              signal is material because it suggests that contract lock-in, while retaining customers, may be generating
              reputational drag that undermines competitive positioning against HiBob and Factorial in deals where the
              buyer has seen these reviews. Diligence should examine churn attributable to contract dissatisfaction
              versus competitive displacement.
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP043
          - type: callout
            title: Universal Pricing Opacity Signals Pre-Commoditisation Market Dynamics
            body: >
              None of the leading European SMB HRIS vendors — Personio, HiBob, or Factorial — publish transparent
              per-seat pricing, and neither do SAP HCM or Workday at the enterprise tier. This universal opacity
              suggests that the market has not yet transitioned to self-serve, product-led purchasing. It benefits
              incumbents through sales-cycle friction and pricing opacity, but also means any vendor offering
              transparent packaging could disrupt the category's distribution dynamics. Buyers currently must engage
              sales teams at every vendor before forming a comparative total-cost-of-ownership view.
            calloutType: insight
            claimRefs:
              - CP011
              - CP035
              - CP036
              - CP040
              - CP046
          - type: callout
            title: European GDPR-Native Architecture Is a Durable Structural Advantage
            body: >
              Personio's data architecture was built from inception for the European regulatory environment — with GDPR
              Article 30 record-keeping, multi-country payroll tax logic, and EU data-residency as design-time
              constraints rather than retrofit features. This creates a meaningful structural advantage over US-born
              competitors like BambooHR (EU data in Ireland only) and Rippling (EU expansion still nascent), which must
              add compliance layers retroactively. SAP HCM has comparable compliance depth but at enterprise pricing and
              implementation complexity that makes it irrelevant to Personio's 50-500 employee ICP.
            calloutType: strength
            claimRefs:
              - CP044
              - CP045
              - CP012
