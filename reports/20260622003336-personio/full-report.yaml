      - number: '2.2'
        title: Market Sizing & Growth
        blocks:
          - type: paragraph
            body: >
              Analyst estimates for the European HR technology market converge on a 2025 value in the range of USD
              4.8–4.9 billion when scoped to software platforms (IMARC Group: USD 4.83B; MarketDataForecast: USD 4.81B),
              with a CAGR of roughly 7.3–7.6% projected through 2034. Broader scope estimates that include payroll
              bureau services, HR consulting, and BPO reach substantially higher values: Future Market Insights sizes
              the European Payroll and HR Solutions market at USD 10.91B in 2025 with a 9.6% CAGR to 2035. The
              methodological divergence — software-only versus services-inclusive — makes direct comparison unreliable
              and represents a material evidence gap for precise SAM derivation. The SMB segment (companies with fewer
              than 1,000 employees) accounts for approximately 40% of the European HR technology market by value as of
              2025 per IMARC Group segmentation, implying a software-only SMB sub-market of approximately USD 1.9
              billion. SMEs are expected to grow faster than large enterprises, at a projected CAGR of approximately
              9.3% from 2026 to 2031 per Mordor Intelligence, driven by accelerating cloud adoption, regulatory
              mandates, and the post-pandemic normalisation of digital HR workflows. Global benchmarks provide
              complementary context: the global HRIS software market is estimated at USD 25 billion in 2025 with a 10%
              CAGR through 2033 (DataInsightsMarket), implying Europe represents approximately 19–20% of global HRIS
              spend when scoped consistently. Western Europe (Germany, France, Netherlands) leads adoption maturity;
              Southern and Eastern Europe (Spain, Italy, Poland, Czech Republic) are the fastest-growing sub-regions
              driven by SME digitisation and government digital-transformation incentives. Germany is the single largest
              national market for Personio given its origin, regulatory payroll complexity, and Personio's ITSG-
              certified native German payroll module. Eurostat 2022 data establishes the structural backdrop: the EU had
              approximately 32.3 million enterprises, of which 99% were micro and small (under 50 employees) and 0.8%
              (approximately 240,000) were medium-sized (50–249 employees). Personio's practical ICP of 10–2,000
              employees covers the vast majority of this 240,000-plus medium enterprise population plus a portion of
              larger small enterprises, representing a structural demand pool that remains significantly under-digitised
              in HR software.
