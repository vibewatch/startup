      - number: '5.2'
        title: Platform Architecture & Integration Ecosystem
        blocks:
          - type: paragraph
            body: >
              Personio is a multi-tenant cloud SaaS application hosted on AWS EU data centers, delivered entirely via
              browser (no client-side install) with a companion Mobile App. The technical architecture is not publicly
              disclosed in detail, but the REST API documentation (developer.personio.de) reveals a v1/v2 endpoint
              structure covering Employee, Attendance, Absence, Recruiting, Custom Reports, and Webhooks. Authentication
              uses client_id/client_secret credential pairs generated per account; Webhooks support a limited 3-retry
              mechanism over 30–60 seconds. The API prohibits browser-side direct calls via CORS, requiring server-side
              integrations. Key API constraints: no salary data available via the GET Employee endpoint (except fixed
              salary 100% and hourly wage); custom attribute creation is not possible via API; and employee
              historical/scheduled values are not returned (current value only). The integration ecosystem spans 200+
              partners in the marketplace, with 170 verified integrations on G2; identity providers include Microsoft
              Entra ID, Okta, and Google SSO via OpenID Connect/OAuth 2.0. Notable payroll execution integrations
              include Xero and Sage for UK/Ireland and the DATEV integration for German bookkeeping workflows. The
              product partnership program requires a technical quality check by Personio and is restricted to
              European-market SaaS providers serving SMBs. Developer community signal is modest — the official
              personio/api-docs GitHub repo has 31 stars; the third-party at-gmbh/personio-py client (Python) has 27
              stars — indicating limited but active developer ecosystem engagement rather than broad platform developer
              community momentum.
