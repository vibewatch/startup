      - number: '1.2'
        title: Leadership & Governance
        blocks:
          - type: paragraph
            body: >
              Personio's executive team combines the founding quartet — Hanno Renner (CEO), Jonas Rieke (COO), Roman
              Schumacher, and Arseniy Vershinin — with a cadre of experienced operators recruited largely from US
              technology companies. Renner has served as CEO since inception, making him the clearest key-person
              concentration risk; his departure would materially disrupt product strategy, investor relations, and
              culture. Rieke's role as COO provides operational continuity as the co-founder counterpart, though the
              board has not published formal succession plans. A diligence-relevant discrepancy exists: Wikipedia lists
              Ignaz Forstmeier rather than Jonas Rieke as one of the original co-founders, conflicting with company
              communications and most press sources that name Rieke — this warrants direct clarification. The CFO seat
              is held by Birgit Haderer, with Maria Angelidou-Smith overseeing product and engineering as CPTO since
              November 2022 — a key hire credited with unifying product and engineering under a single accountability
              structure. Naman Khan joined as first CMO in October 2023 from Salesforce and Dropbox, and Lenke Taylor
              joined as CPO in February 2024 from Twitch. Independent board oversight expanded in 2025 when Cloudflare
              CFO Thomas Seifert joined the board, adding public-market financial expertise ahead of a potential IPO
              window. Hanno Renner is also an active angel investor with 16 personal investments and serves as an Accel
              scout, which raises minor conflict-of-interest monitoring considerations. Board composition beyond Seifert
              is not fully disclosed, representing a governance information gap requiring diligence.
