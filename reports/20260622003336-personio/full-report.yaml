  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base, ICP & Segmentation
        blocks:
          - type: paragraph
            body: >
              Personio's ideal customer profile is a European small-to-medium enterprise with 10–2,000 employees
              operating predominantly white-collar workflows. Company materials consistently describe this range;
              Invgate and SourceForge listing data confirm it. The Enlyft technology-tracking dataset shows 50–200
              employees as the most common user-company size in its sample of 9,286 tracked deployments, implying SMB
              customers constitute the majority of the installed base by count, while CEO Hanno Renner has described
              growing momentum in the 200–2,000 employee (mid-market) cohort in a 2024 Sifted interview. Germany is
              Personio's dominant market, where it has achieved profitability as a country; the UK and Ireland are the
              next tier, anchored by the company's Dublin support hub and native payroll support (post-2024 UK launch).
              Barcelona and Amsterdam offices indicate meaningful Southern and Western European footprints. Across 70+
              countries, Germany remains the primary revenue concentration.

              By industry, the Enlyft dataset shows IT and Services at approximately 12% of the tracked install base;
              GetApp reviewer distribution shows IT and Services at 15%, Computer Software at 11%, and Financial
              Services at 7% of reviewers. These figures reflect the tech-sector dominance typical of early SaaS
              adoption curves in Europe. Healthcare, retail, and manufacturing/logistics verticals are underrepresented
              in published customer references, indicating a potential expansion surface. The primary buyer persona is
              the HR manager or director; employees are secondary users via the self-service portal; and finance teams
              consume payroll and reporting outputs. Personio's integration ecosystem of 268+ partners (Partnerbase
              data) enables it to slot into existing tech stacks, lowering switching friction for prospects using tools
              like Slack, Microsoft Azure, DATEV, or Salesforce.
