              - CO042
          - type: callout
            title: Stale $8.5B Valuation and US Workforce Reduction Signal Retrenchment
            body: >
              Personio's last disclosed valuation of $8.5B dates from June 2022, and no new primary round has been
              announced since. Combined with the WARN Act layoff of 47 New York employees in January 2026 and two
              restructuring waves in 2024, the company appears to be scaling back its US commercial ambitions. Key
              diligence questions remain open: the current implied valuation is unknown, the US strategy beyond talent
              sourcing is unclear, and the Glassdoor rating of 3.2–3.3/5 signals mixed internal culture.
