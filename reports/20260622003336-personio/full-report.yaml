      - number: '4.3'
        title: Unit Economics & Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Personio does not publicly disclose gross margin, net revenue retention, customer acquisition cost,
              payback period, or customer lifetime value — the standard private-SaaS opacity that makes independent
              underwriting reliant on benchmarks and proxies. European B2B SaaS companies at Personio's scale typically
              operate gross margins in the 65–80% range; the predominantly software subscription delivery model (low
              COGS from cloud infrastructure plus human customer success) is consistent with the upper portion of this
              range. A 2024 Sifted profile noted Personio had achieved significant ARR growth but declined to disclose
              figures; analyst aggregator Contrary Research estimates annual recurring revenue in the low-to-mid
              hundreds of millions of euros, with 2025-2026 run rate potentially in the €150–300 million range given
              customer growth from approximately 10,000 in 2023 to 16,000 in 2026 and pricing-led ARPU expansion. Net
              revenue retention for European mid-market HRIS typically runs 105–120%; without disclosed churn and
              expansion data, Personio's NRR cannot be independently confirmed. Headcount of approximately 2,000
              employees as of mid-2026, relative to estimated ARR, implies an ARR-per-FTE proxy of €75,000–€150,000 —
              consistent with a SaaS company at scale approaching profitability. Annual contract values for a
              200-employee SMB customer at €2–8 per seat per month range from approximately €5,000 to €19,000,
              suggesting a mid-market ACV of approximately €8,000–€14,000 for core customers. COGS are driven by cloud
              infrastructure, payroll processing technology, customer success headcount, and, post-Aurio, AI model
              serving costs.
            claimRefs:
