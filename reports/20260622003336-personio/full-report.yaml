chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & Business Model
        blocks:
          - type: paragraph
            body: >
              Personio SE is a European cloud-based SaaS company headquartered in Munich, Germany, offering an
              integrated HR platform that serves small and mid-sized businesses (SMBs) across Europe and
              internationally. Founded in 2015 by four alumni of the Center for Digital Technology and Management (CDTM)
              at the Technical University of Munich, the company operates under the "People Operating System" brand
              positioning — unifying employee data management, talent acquisition, payroll, time tracking, and
              performance management in a single subscription product. Personio's core differentiator for European
              buyers is its native compliance architecture tailored to EU labour and data-protection requirements,
              including certified payroll processing in Germany, the country with the world's second-most-complex
              payroll rules per the Global Payroll Complexity Index. The business model is a per-employee monthly SaaS
              subscription with quote-based enterprise pricing; job-board multi-posting integrations provide a secondary
              revenue stream. Personio converted its legal form from a German GmbH to a Societas Europaea (SE) in 2023,
              a move that eases cross-border EU operations and lays the foundational governance structure for a future
              public listing. The company's Trust Center documents ongoing GDPR compliance and relevant security
              certifications for enterprise buyers. Third-party integrations now exceed 100 connected apps, enabling
              customers to keep Personio as a single system of record while connecting specialist payroll processors,
              learning management, and identity providers.
            claimRefs:
