      - number: '8.2'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >
              Public HR-tech and payroll SaaS multiples provide the most transparent pricing anchor. Workday (WDAY), the
              sector bellwether, reported FY2026 (ended January 31, 2026) total revenue of $9.6 billion and subscription
              revenue of $8.8 billion, with a 12-month forward subscription backlog of $8.8 billion. At a market
              capitalisation of approximately $53 billion entering 2026, Workday trades at roughly 6.0× NTM subscription
              ARR — a premium attributable to its dominant enterprise market position, 10,000-plus customer base, and
              strong platform lock-in. Paylocity (PCTY), the SMB payroll and HR platform most analogous to Personio in
              customer size profile, commands 7–8× EV/ARR on the back of 20%+ revenue growth and consistent Rule of 40
              outperformance. Ceridian/Dayforce trades at 6–7× on slower growth, and Paychex at 5–6× reflecting a more
              legacy, services-heavy revenue mix. Among private peers, Rippling reached $1 billion in annualised revenue
              in March 2026 growing 78% year-over-year and is valued at $16.8 billion from its May 2025 Series G —
              implying approximately 16.8× ARR, a premium reflecting triple-digit historical growth and a unique
              compound-product strategy spanning HR, IT, and fintech. HiBob, Personio's most direct European mid-market
              peer, last raised at a $2.45 billion valuation and is estimated at approximately $2.66 billion in early
              2026 after additional financing — implying roughly 10–15× estimated ARR for a company at an earlier scale
              and growth stage. Factorial HR completed a Series C in 2025 at an undisclosed valuation, signalling
              continued investor appetite for European HR-tech but at smaller cheque sizes than the 2021–2022 vintage.
              The consistent conclusion across the comparable set is that Personio's $8.5 billion reference price embeds
              an EV/ARR multiple of 26–40× — three to five times above the comparable public range, and roughly double
              what the highest-growth private peer (Rippling) commands at 78% YoY growth. For Personio's multiple to be
              justified at 8.5 billion, the company would need ARR north of €600 million (at 12× multiple), a figure
              that would require unprecedented acceleration from the current estimated range without any corroborating
              public evidence.
