  - id: TV005
    title: Thesis-Break & Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Primary funding round at or above $8.5B
        - New institutional lead investor at ≥$8.5B with disclosed ARR ≥ €600M
        - Would validate current mark; forces re-evaluation of bear case probability
        - Re-initiate diligence; assess whether new-investor due diligence supports disclosed metrics
      - - Confirmed ARR above €600M
        - Company publishes or voluntarily discloses ARR ≥ €600M with auditor attestation
        - Would bring implied multiple into a defensible 12–14× range; thesis shifts from Avoid to Track
        - Upgrade to Track; remodel scenarios with disclosed growth rate and NRR
      - - Down-round primary raise below $4B
        - New primary raise with disclosed post-money valuation < $4B
        - Confirms bear-to-base case; provides verified price anchor; secondary market opens up
        - Evaluate entry at disclosed price; check cap table for preference overhang impact
      - - IPO filing (S-1 or equivalent)
        - Public filing that discloses ARR, NRR, gross margin, and growth rate
        - Removes opacity discount; allows direct comparable analysis
        - Model IPO price vs. comps; assess IPO discount (typically 20–30% below pre-IPO private mark)
      - - Material customer churn above 15% gross annually
        - Gross churn confirmed by industry surveys, review-platform data, or disclosed
        - Invalidates customer-count-based ARR estimate downward; bear case probability rises
        - Move to Avoid unconditionally; reassess TAM protection thesis
      - - EU AI Act non-compliance enforcement action
        - Formal CNIL/BNetzA or cross-border DPA action against Personio's AI recruiting or performance features
        - Material regulatory liability; product redesign cost; reputational damage in core market
        - Move to Avoid; flag regulatory risk for all HR-tech AI plays in EU
    notes: >-
      Triggers are advisory; none constitute binding investment advice. Action implications are diligence steps, not
      transaction recommendations.
    claimRefs:
      - CV033
      - CV036
      - CV037
      - CV038
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Diligence Path / Owner
    rows:
      - - ARR and Growth Rate
        - Personio has not disclosed ARR, revenue, or YoY growth rate publicly
        - Central to any valuation framework; current estimate spans €180–350M (2×+ range)
        - Request in data room; cross-check against statutory accounts via Bundesanzeiger once filed
      - - Net Revenue Retention (NRR)
        - NRR not disclosed; no proxy available
        - Determines whether the installed base is expanding or contracting; sub-100% NRR at $8.5B is disqualifying
        - Data-room NRR cohort analysis; cross-check G2 / Trustpilot review sentiment trends
      - - Gross Margin
        - Not disclosed; SaaS gross margin benchmarks suggest 60–80% for HRIS, but payroll drag could be lower
        - A gross margin below 60% would compress achievable ARR multiples further by 20–30%
        - Request in data room; infer from headcount and infrastructure cost allocation in statutory accounts
      - - Liquidation Preference & Cap Table
        - Preference stack and total liquidation preference undisclosed; 8 rounds with various lead terms
        - Multi-layer liquidation preferences can eliminate common equity value entirely in downside scenarios
        - Full cap table and waterfall model in data room; check term sheets from Series E and E-2
      - - Secondary Market Clearing Price
        - >-
          No publicly available secondary trade price; Forge Global shows 'limited' market activity for HiBob as a
          benchmark
        - Secondary trades (if any) provide the most current market-derived valuation anchor
        - Engage Forge, Nasdaq Private Market, or Hiive for any available bid/ask data on Personio shares
      - - Aurio AI Conformity Roadmap
        - No EU AI Act conformity assessment or ALTAI self-assessment published for Aurio-powered recruiting features
        - >-
          High-risk AI classification under Annex III could trigger conformity obligations affecting product launch
          timing
        - Request internal EU AI Act compliance roadmap and GDPR DPIA for Aurio feature set
      - - Statutory Financial Accounts
        - >-
          German HGB accounts submitted to Bundesanzeiger typically with 18+ month lag; FY2024 accounts may be the
          latest available
        - Only independent audited financial data available; critical for revenue/cost verification
        - Monitor Bundesanzeiger for FY2025 filing; engage German forensic accounting firm to interpret HGB accounts
    notes: >-
      Diligence asks represent the minimum required to enable independent underwriting of the $8.5 billion reference
      valuation. None are currently resolvable from public sources alone.
    claimRefs:
      - CV009
      - CV010
