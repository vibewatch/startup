      - number: '7.2'
        title: Regulatory, Legal & Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Personio processes sensitive personal data — including health information embedded in sick-leave records
              and financial data in payroll — for more than one million employees across 16,000+ SME customers. This
              data footprint places the company in the highest-risk tier under the General Data Protection Regulation.
              As of June 2026, GDPR enforcement authorities across the EU and EEA have issued 3,194 tracked enforcement
              actions totalling over €6.31 billion in fines; the European Data Protection Board's own guidelines
              establish that serious violations by a data processor can attract penalties up to 4% of global annual
              turnover. No GDPR investigation against Personio has been publicly documented, but the absence of
              enforcement history is not a compliance guarantee in a regulatory environment of this intensity. The EU AI
              Act (Regulation 2024/1689) creates an additional layer of regulatory risk that has not yet been fully
              acknowledged in Personio's public communications. The Act classifies AI systems used in employment, worker
              management, and access to self-employment — including AI-assisted recruiting, performance evaluation, and
              workforce monitoring — as high-risk systems under Annex III, triggering conformity assessment
              requirements, risk management and data governance documentation obligations, and mandatory registration.
              Personio launched multiple AI features in 2025–2026 and acquired Aurio in April 2026 to accelerate
              AI-powered recruiting; neither deployment has been accompanied by a published EU AI Act conformity
              roadmap. A separate obligation under EU Directive 2023/970 on pay transparency requires employers with
              100+ employees to report gender pay gap data from 2026, compelling HR software vendors to build or update
              pay-gap reporting features. On the payroll side, a May 2026 UK Trustpilot review documented a Personio
              payroll migration resulting in incorrect data in German tax documents (Lohnsteuerbescheinigung) that
              remained unresolved for more than two months — a documented data integrity and compliance failure in a
              core regulated workflow.
