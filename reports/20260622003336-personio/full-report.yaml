      - number: '6.3'
        title: Retention, Switching Friction, Adverse Evidence & Gaps
        blocks:
          - type: paragraph
            body: >
              Personio does not publicly disclose net revenue retention (NRR) or gross revenue retention (GRR),
              representing the most material evidence gap for investor durability assessment. The best available proxy
              is SoftwareReviews' "Plan to Renew" metric at 85%, which aligns with a gross renewal rate near category
              norms for European mid-market HRIS. The same dataset shows only 68% Likeliness to Recommend and 61%
              Satisfaction of Cost Relative to Value — both below typical B2B SaaS benchmarks — suggesting retention may
              be more price-inelastic than loyalty-driven. The Capterra platform records a 4.5/5 rating on Customer
              Service, the highest of its four measured dimensions, indicating support quality as a retention lever.

              Retention is reinforced by structural switching costs: deep centralisation of employee master data,
              payroll history, document archives, and multi-year workflow configurations makes migration to a competing
              platform expensive. A user on UK Trustpilot described implementing Personio across three separate
              companies — an independently observed repeat adoption signal. However, an adverse UK Trustpilot review
              filed in May 2026 describes a serious payroll-migration failure: incorrect data in official German tax
              documents (Lohnsteuerbescheinigung) that remained unresolved for two months despite detailed analysis
              provided by the customer. Personio's public response acknowledged payroll support response-time
              deficiencies and described remediation initiatives under way. GetApp reviewers also note rising pricing
              with extra costs for new feature modules and recurring technical bugs. SoftwareReviews categorises certain
              Personio contract terms as vendor-favouring with difficult exit provisions, which acts simultaneously as a
              retention mechanism and a risk signal for buyers in competitive tender situations. The absence of
              disclosed NRR, GRR, churn curves, or cohort-level retention data leaves durability of the 16,000-customer
              base unverified at the required investor confidence level.
