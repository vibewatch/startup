      - number: '4.5'
        title: Financial Opacity & Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Personio's financial opacity is comprehensive and representative of a late-stage private European SaaS
              company with no near-term regulatory disclosure obligation. The five material evidence gaps are: (1)
              current ARR and revenue trajectory, without which growth rate, valuation multiple, and revenue quality
              cannot be independently assessed; (2) gross margin and COGS decomposition, required to judge subscription
              profitability sustainability; (3) net revenue retention by cohort, the primary indicator of expansion
              versus churn dynamics and the strongest forward ARR predictor; (4) the cap table and post-Series-E-2
              ownership structure, needed to model dilution, waterfall mechanics, and return thresholds for any exit
              scenario; and (5) the precise definition of the April 2026 profitability milestone, which could range from
              operating income-positive to GAAP EBITDA to free-cash-flow-positive with materially different implications
              for capital intensity. Personio SE is required under German law to file annual accounts with the
              Bundesanzeiger (federal gazette), but mid-size company exemptions can limit the granularity of public
              filings. A diligence data room should include trailing-eight-quarter ARR by cohort and segment, income
              statement with gross margin and function-level opex, NRR by customer size band, headcount by department,
              and a fully diluted capitalization table with liquidation preferences.
