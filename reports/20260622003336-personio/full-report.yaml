      - number: '1.4'
        title: Scale Metrics & Operations
        blocks:
          - type: paragraph
            body: >
              Personio's operating footprint as of mid-2026 spans eight cities — Munich (HQ), Berlin, London, Dublin,
              Amsterdam, Barcelona, Madrid, and New York — with headcount last publicly reported at approximately 2,000
              as of mid-2024. The company has not disclosed a precise 2026 headcount figure; third-party estimates range
              from roughly 1,700 to over 2,100, reflecting two rounds of restructuring in 2024 and the January 2026
              reduction of 47 New York employees via WARN Act filing. Customer traction stands at approximately 16,000
              businesses as of April 2026, with the recruiting module alone adopted by 9,000 of those accounts. Payroll,
              Personio's newest native module, grew approximately 80% year-over-year and serves more than 1,500
              customers, demonstrating product-led expansion within the existing base. Revenue was €94.7M in FY2022 per
              company filings cited by Sifted; the company does not disclose current ARR or revenue run rate, and
              third-party estimates for 2026 are speculative and unconfirmed. The company achieved Forbes Cloud 100
              recognition at position 69 in 2025, providing an independent third-party signal of scale and market
              credibility. Valuation at $8.5B remains the last publicly anchored figure from June 2022; no mark-up or
              mark-down is confirmed for the 2025 extension round or any subsequent period.
