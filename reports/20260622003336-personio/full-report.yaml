      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: First Profitable Quarter with Self-Financed AI Roadmap
            body: >
              Personio's April 2026 announcement of its first profitable quarter signals a strategic inflection from
              growth-at-cost to sustainable, self-financed innovation. CEO Hanno Renner explicitly stated the company
              can now fund its innovations from ongoing business cash flows, reducing dependence on external capital
              cycles and meaningfully de-risking the runway to a potential IPO. The simultaneous acquisition of Aurio
              demonstrates the company can fund tuck-in AI capability deals from operating resources, validating the
              business model's long-term economics.
            calloutType: strength
            claimRefs:
              - CO043
