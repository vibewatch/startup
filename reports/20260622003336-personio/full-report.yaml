              SAP SuccessFactors are extending SMB tiers. The January 2026 New York layoffs — reversing the 2023 US
              office opening — indicate that the North American expansion thesis has stalled. People risks are
              compounded by multi-year headcount reduction cycles and Glassdoor adverse commentary on management
              instability and unclear IPO strategy. German Trustpilot reviews in June 2026 document customer complaints
