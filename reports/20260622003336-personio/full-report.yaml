      - number: '1.5'
        title: Milestones & Strategic Events
        blocks:
          - type: paragraph
            body: >
              Personio's eleven-year arc reflects a consistent pattern of product-led geographic expansion punctuated by
              tuck-in acquisitions. The founding in Munich in 2015 was followed by rapid customer acquisition in
              German-speaking markets before international offices opened in Madrid (2019), London and Dublin (2020),
              Amsterdam (2021), Berlin and Barcelona (2022), and New York (2023). Acquisitions have targeted capability
              gaps: Rollbox (Spain, 2019) added local payroll expertise; Back (Germany, 2022) contributed workflow
              automation and employee experience tooling; and Aurio (Munich, April 2026) brings agentic recruiting AI
              directly into the platform for automated candidate sourcing and screening while keeping final hiring
              decisions human-led. The April 2026 announcement of the company's first-ever profitable quarter marks a
              strategic inflection — Renner has explicitly stated the company can now self-finance innovation rather
              than relying on external capital cycles, which reduces key refinancing risk ahead of a potential IPO.
              Adverse events include the January 2026 WARN Act layoff of 47 New York employees, the most visible
              reduction following two restructuring waves in 2024, and ongoing mixed employee sentiment reflected in
              Glassdoor scores of approximately 3.2–3.3 out of 5 from over 440 reviews. The Personio Foundation, holding
              1% of company shares, provides a reputational anchor but also a minor consideration for equity structure
              at any future liquidity event.
