      - number: '4.4'
        title: Capital Adequacy & Adverse Financing Signals
        blocks:
          - type: paragraph
            body: >
              Personio's most recent disclosed liquidity event was the June 2022 Series E-2 ($200 million), and no
              balance sheet or cash-position update has been publicly released since. Estimating the cumulative
              operating cash consumed between mid-2022 and early 2026 is speculative: with approximately 2,000 employees
              averaging European tech compensation of roughly €50,000–€80,000 per annum plus cloud infrastructure, sales
              and marketing spend, and R&D, the total annual cash outflow likely ranged from $60 million to $120 million
              in 2022–2024 before the path to profitability began. The April 2026 profitable quarter, combined with the
              absence of any new fundraise, signals that Personio may have reached operating cash neutrality or better,
              though the exact definition of profitability was not specified in the press release. The January 2026 WARN
              Act filing covering 47 New York positions — representing approximately 2.4% of global headcount — and
              Teamblind discussions referencing prior multi-round reductions in 2023–2024 are consistent with a
              sustained cost-reduction program executed in parallel with the path to profitability. The Aurio
              acquisition in April 2026 was executed without disclosing financial terms, but its concurrence with the
              profitability announcement implies available cash for bolt-on M&A. Personio's financing structure is
              entirely equity-based; no venture debt, credit facilities, or project-finance obligations have been
              disclosed or independently documented. The cap table carries significant institutional dilution after
              eight equity rounds, with specific ownership percentages undisclosed.
