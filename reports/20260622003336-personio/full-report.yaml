  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite & Module Architecture
        blocks:
          - type: paragraph
            body: >
              Personio's platform is organized into a "People Operating System" — a unified HR suite designed to cover
              the full employee lifecycle for European SMBs with 10–5,000 employees. The core HRIS module anchors the
              platform and provides digital employee files, organizational management, document storage with
              e-signature, absence tracking, and configurable workflows. Built atop this core are purpose-built modules:
              Payroll (native German payroll, ITSG-certified, growing 80% per year with 1,500+ customers as of April
              2026; preliminary payroll and file-export integrations for UK, Ireland, and 80+ other countries);
              Recruiting (applicant tracking, job-board multi-posting to 1,000+ boards, interview scheduling, smart
              scheduling links; 9,000 customers use this module); Performance & Development (review cycles, 360-degree
              feedback, OKRs); Surveys (engagement surveys using centralized employee data and pre-built templates);
              Compensation Management (launched 2023); Whistleblowing (EU Directive 2023/970 compliant anonymous
              reporting channel); Conversations (AI-powered central inbox for HR); and Employer of Record powered by
              Remote.com (global hiring in 100+ countries without local entities). A Mobile App provides employee
              self-service. The April 2026 Aurio acquisition integrated an AI layer into the Recruiting module,
              targeting automated candidate sourcing, screening, and prioritization — with human final-decision
              preserved. Compensation Management, Surveys, Whistleblowing, and Conversations are newer additions
              (2023–2025) and represent Personio's expansion beyond pure HRIS administration into adjacent
              people-operations workflows.
