  name: Personio

chapter:
  number: 1
  title: Company Overview
  summary: >
    Personio is a Munich-headquartered cloud-based HR SaaS unicorn founded in 2015 by
    Hanno Renner (CEO), Jonas Rieke (COO), Roman Schumacher, and Arseniy Vershinin,
    targeting European SMBs with 10–2,000 employees. As of June 2026 the company serves
    approximately 16,000 customers, employs roughly 2,000 staff across eight global
    offices, and carries a last-disclosed valuation of $8.5 billion from its June 2022
    Series E-2. Personio reached its first profitable quarter in April 2026 and expanded
    its AI capabilities through the acquisition of Munich recruiting-AI startup Aurio,
    while also executing a 47-person WARN Act reduction of its New York workforce in
    January 2026 — an adverse signal of US market retrenchment.

sections:
  - id: identity-business-model
    title: Identity & Business Model
    body: >
      Personio SE is a European cloud-based SaaS company headquartered in Munich, Germany,
      offering an integrated HR platform that serves small and mid-sized businesses (SMBs)
      across Europe and internationally. Founded in 2015 by four alumni of the Center for
      Digital Technology and Management (CDTM) at the Technical University of Munich, the
      company operates under the "People Operating System" brand positioning — unifying
      employee data management, talent acquisition, payroll, time tracking, and performance
      management in a single subscription product. Personio's core differentiator for
      European buyers is its native compliance architecture tailored to EU labour and
      data-protection requirements, including certified payroll processing in Germany, the
      country with the world's second-most-complex payroll rules per the Global Payroll
      Complexity Index. The business model is a per-employee monthly SaaS subscription
      with quote-based enterprise pricing; job-board multi-posting integrations provide a
      secondary revenue stream. Personio converted its legal form from a German GmbH to a
      Societas Europaea (SE) in 2023, a move that eases cross-border EU operations and
      lays the foundational governance structure for a future public listing. The company's
      Trust Center documents ongoing GDPR compliance and relevant security certifications
      for enterprise buyers. Third-party integrations now exceed 100 connected apps,
      enabling customers to keep Personio as a single system of record while connecting
      specialist payroll processors, learning management, and identity providers.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    figureRefs:
      - FO002

  - id: leadership-governance
    title: Leadership & Governance
    body: >
      Personio's executive team combines the founding quartet — Hanno Renner (CEO), Jonas
      Rieke (COO), Roman Schumacher, and Arseniy Vershinin — with a cadre of experienced
      operators recruited largely from US technology companies. Renner has served as CEO
      since inception, making him the clearest key-person concentration risk; his departure
      would materially disrupt product strategy, investor relations, and culture. Rieke's
      role as COO provides operational continuity as the co-founder counterpart, though the
      board has not published formal succession plans. A diligence-relevant discrepancy
      exists: Wikipedia lists Ignaz Forstmeier rather than Jonas Rieke as one of the
      original co-founders, conflicting with company communications and most press sources
      that name Rieke — this warrants direct clarification. The CFO seat is held by Birgit
      Haderer, with Maria Angelidou-Smith overseeing product and engineering as CPTO since
      November 2022 — a key hire credited with unifying product and engineering under a
      single accountability structure. Naman Khan joined as first CMO in October 2023 from
      Salesforce and Dropbox, and Lenke Taylor joined as CPO in February 2024 from Twitch.
      Independent board oversight expanded in 2025 when Cloudflare CFO Thomas Seifert joined
      the board, adding public-market financial expertise ahead of a potential IPO window.
      Hanno Renner is also an active angel investor with 16 personal investments and serves
      as an Accel scout, which raises minor conflict-of-interest monitoring considerations.
      Board composition beyond Seifert is not fully disclosed, representing a governance
      information gap requiring diligence.
