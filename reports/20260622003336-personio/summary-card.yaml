summary:
  headline: >-
    Personio is the established European HR-tech category leader with strong EU compliance moats, but the $8.5B 2022
    valuation is structurally unsupported by 2026 SaaS multiples and opaque financials preclude confident underwriting.
  overallScore: 6
  recommendation: track
