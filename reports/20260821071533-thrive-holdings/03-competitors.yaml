  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-retention
    missingEvidence: Comparative win-loss data for acquisition targets, customer retention, and post-close margin uplift versus incumbents and software substitutes.
    whyItMatters: Public positioning is rich, but underwriting moat durability requires evidence that Thrive wins and retains better than rivals after integration.
    diligencePath: Request seller-pipeline conversion data, customer-retention cohorts, and post-close productivity or gross-margin deltas by arm.
    relatedQuestionRefs:
    - QP016
    - QP020
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: pricing-opacity
