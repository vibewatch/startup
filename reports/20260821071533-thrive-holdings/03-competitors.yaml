  title: Competitor profile table
  notes: >-
    Public profile depth varies widely. Scale signals are often self-reported and should be treated as directional unless
    independently verified.
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Current (reference arm)
    - AI-enabled accounting platform
    - Nearly 30 partner firms, 2,000+ employees, $500M+ annual revenue per company statements
    - Independent accounting firms and SMB clients needing higher-end advisory
    - Local-brand retention, shared services, embedded OpenAI-linked Tax AI
    - Reference business is part of Thrive rather than an external competitor
  - - Aprio
    - National accounting / advisory incumbent
    - Inc. 5000 mention and alliance expansion in 2026 newsroom disclosures
    - Middle-market companies and firms wanting broad advisory coverage
    - Large advisory breadth and public AI-investment posture
    - Public pages here do not disclose pricing or exact platform economics
  - - CBIZ
    - Public mult-line incumbent
    - Claims top-10 accounting scale nationally plus broad benefits and insurance reach
    - Businesses wanting integrated accounting, tax, advisory, benefits, and technology
    - Public-company brand, cross-sell reach, and national market footprint
    - Less evidence in fetched pages for holdco-style local-brand retention
  - - EisnerAmper
    - National accounting / outsourcing incumbent
    - 475+ partners and 4,700+ colleagues on homepage
    - Midmarket, government, and complex advisory buyers
    - Accounting, tax, outsourcing, advisory, and technology/AI coverage
    - Limited public pricing or conversion data in retained evidence
  - - Pilot
    - Software-enabled bookkeeping and CFO substitute
    - 3,500+ startups and small businesses per official homepage
    - Startups and small businesses wanting finance operations without selling control
    - Transparent packaging, dedicated teams, CFO and tax add-ons, AI assistance
    - Skews toward smaller buyers than acquired local accounting firms
  - - QuickBooks
    - Software ecosystem substitute
    - Large SMB distribution via accounting, payroll, payments, and expert support ecosystem
    - SMBs and independent accountants modernizing without acquisition
    - Integrated Accounting AI, payroll, payments, and human experts
    - Software-led model is shallower than full firm ownership or complex advisory
  - - Dataprise
    - National MSP incumbent
    - 400+ certified engineers and predictable per-user plans
    - Mid-sized businesses outsourcing IT, cloud, security, and compliance
    - AI-enabled delivery, scalable support, broad managed-service coverage
    - Exact customer counts, retention, and contract terms are not public here
  - - Corsica / Thrive NextGen / NexusTek / Ntiva
    - MSP peer set
    - Public signals include 1,000+ clients at Corsica and 2,500+ customers at Thrive NextGen
    - Midmarket and SMB buyers outsourcing IT and cybersecurity
    - Security-first, cloud, automation, and consultative managed services
    - Public differentiation is convergent and pricing mostly quote-based
