- id: TP004
  title: Moat durability / competitive risk register
  notes: Severity is an analyst judgment based on the retained public evidence.
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Local-brand retention plus permanent capital is differentiated
    - Independent firms may adopt AI tooling without selling control
    - High
    - Request seller-pipeline conversion data and win/loss reasons versus staying independent
  - - Embedded AI and OpenAI proximity create product edge
    - AI features may commoditize across incumbents and software vendors
    - High
    - Ask for measurable post-close productivity and margin uplift versus non-platform peers
  - - MSP roll-up scale improves service delivery
    - Security-first incumbents already market similar automation and compliance bundles
    - High
    - Benchmark contract renewals, SLA performance, and gross margin against top MSP peers
  - - Cross-platform breadth across accounting and IT is hard to copy
    - Conglomerate complexity can dilute operating focus and confuse positioning
    - Medium
    - Clarify whether customers buy a coherent platform or separate services brands
  - - Seller supply and relationships are a durable sourcing advantage
    - National incumbents and software tools can reduce the urgency to sell
    - Medium
    - Review target-firm referral funnels, time-to-close, and competitive bid dynamics
