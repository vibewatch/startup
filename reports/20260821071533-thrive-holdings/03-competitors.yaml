- id: TP003
  title: Pricing / packaging comparison
  notes: >-
    Exact enterprise contract values are mostly undisclosed. Unknown means no reliable public price was retained in the
    fetched pages for this chapter.
  columns:
  - Competitor
  - Public price / unit
  - Contract model
  - Included capabilities
  - Unknowns / implication
  rows:
  - - Thrive / Current + Shield
    - Unknown
    - Acquisition plus ongoing service / shared-platform economics
    - Local-firm ownership transition, shared services, AI workflow tooling
    - Sales-led and M&A-led model makes quick apples-to-apples price comparison impossible
  - - Pilot
    - Bookkeeping from $99/month; CFO services from $1,750/month; tax plans from $1,000+/year
    - Subscription / service bundle
    - Bookkeeping, tax, CFO support, AI answers, dedicated team
    - Transparent entry points increase price pressure at the low end
  - - QuickBooks
    - No reliable full-service bookkeeping bundle price retained in this chapter
    - Software subscription with add-on expert services
    - Accounting AI, payroll, payments, bookkeeping assistance, integrations
    - Massive distribution can win even when services pricing is only partially transparent
  - - Dataprise
    - Predictable per-user pricing disclosed conceptually, exact figures unknown
    - Managed-service contract
    - IT management, cybersecurity, compliance, cloud support
    - Quote-based detail limits direct margin comparison but supports enterprise packaging
  - - Corsica
    - Flat-fee / all-inclusive pricing language, exact figures unknown
    - Managed-service contract
    - Managed IT, security, remediation guarantee, data integration
    - Bundled-security message can compress commodity MSP pricing
  - - Aprio / CBIZ / EisnerAmper
    - Unknown
    - Project, retainer, or advisory-scope pricing
    - Accounting, tax, advisory, outsourcing, technology services
    - Customized pricing protects margin opacity and reduces easy comparison for buyers
  - - Thrive NextGen / Ntiva / NexusTek
    - Unknown
    - Managed-service contract
    - Managed IT, cloud, automation, security, support
    - Quote-driven contracting is standard, which weakens public benchmarking but not enterprise competitiveness
