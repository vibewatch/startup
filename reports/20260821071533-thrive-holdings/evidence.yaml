evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A board list, committee map, or governance memo explaining voting control and oversight structure.
    whyItMatters: >-
      A $12 billion private platform with sparse governance disclosure is hard to underwrite for control, succession,
      and investor-rights risk.
    diligencePath: Request an org chart, board observer list, and shareholder-rights summary from management or lead investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Consolidated revenue, ARR, gross margin, cash-flow, and leverage data for Thrive Holdings itself.
    whyItMatters: >-
      Headline valuation and capital raised are public, but underwriting requires economics and unit-level performance,
      not just operating anecdotes.
    diligencePath: >-
      Obtain holdco financials, platform-level P&Ls, and lender or board materials covering profitability and cash
      conversion.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: minor
    topic: openai-partnership
    missingEvidence: Stake size, milestone ratchets, service-pricing terms, and exclusivity conditions in the OpenAI agreement.
    whyItMatters: >-
      The strategic partnership appears central to the model, and economics matter for dilution, incentives, and
      dependency risk.
    diligencePath: Review the governing commercial agreement and cap-table notes for the OpenAI transaction.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: minor
    topic: leadership-identity
    missingEvidence: >-
      A primary-source leadership page or filing that exhaustively names the founding team and clarifies whether Michael
      Tannenbaum has any role.
    whyItMatters: >-
      Public founder attribution is sparse enough that user-provided context and retained public sources do not fully
      align.
    diligencePath: >-
      Request a current executive roster, formation history memo, and press-contact confirmation of founder and
      management roles.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: >-
      A clean U.S. SMB-only market-size model for AI-enabled accounting and managed IT rollups, ideally with segmented
      spend by firm size and service line.
    whyItMatters: >-
      Broad sector size alone does not indicate how much of the market Thrive can realistically buy, integrate, and
      monetize.
    diligencePath: >-
      Request management’s internal market model and compare it with acquired-firm geography, service mix, and seller
      pipeline data.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: state-regulatory-fragmentation
    missingEvidence: A state-by-state map of CPA ownership, APS, and attest constraints relevant to Current platform roll-ups.
    whyItMatters: Capturability in accounting depends on legal structure and independence rules, not just seller supply.
    diligencePath: >-
      Build a jurisdiction matrix with counsel covering ownership limits, attest restrictions, and required licensed
      control.
    relatedQuestionRefs:
      - QM008
      - QM025
  - type: private-evidence-only
    severity: material
    topic: conversion-economics
    missingEvidence: >-
      Actual win rates, post-acquisition productivity deltas, churn, and margin uplift by workflow for accounting and
      MSP targets.
    whyItMatters: Market size matters less than repeatable conversion and margin-expansion economics once firms join the platform.
    diligencePath: >-
      Request cohort analysis from Current and Shield showing pre/post-close revenue retention, throughput, and
      gross-margin changes.
    relatedQuestionRefs:
      - QM020
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size-scope
    missingEvidence: >-
      Scope-normalized market estimates that separate U.S. accounting services, U.S. SMB MSP spend, and broader global
      outsourcing categories.
    whyItMatters: >-
      Current public estimates mix different geographies, definitions, and time windows, which can overstate or
      understate comparability.
    diligencePath: >-
      Normalize all third-party market studies to one geography, service taxonomy, and year before using them in
      valuation work.
    relatedQuestionRefs:
      - QM014
      - QM024
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-retention
    missingEvidence: >-
      Comparative win-loss data for acquisition targets, customer retention, and post-close margin uplift versus
      incumbents and software substitutes.
    whyItMatters: >-
      Public positioning is rich, but underwriting moat durability requires evidence that Thrive wins and retains better
      than rivals after integration.
    diligencePath: >-
      Request seller-pipeline conversion data, customer-retention cohorts, and post-close productivity or gross-margin
      deltas by arm.
    relatedQuestionRefs:
      - QP016
      - QP020
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public contract-rate detail for most accounting incumbents and MSP peers, including discounting, minimum terms,
      and implementation fees.
    whyItMatters: >-
      Pricing opacity makes it hard to judge whether Thrive competes on premium positioning, lower total cost, or
      bundled value.
    diligencePath: Collect competitor proposals from channel checks and compare them with management’s reported win/loss rationale.
    relatedQuestionRefs:
      - QP015
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: feature-depth
    missingEvidence: >-
      Independent third-party benchmarks on AI quality, service responsiveness, security outcomes, and implementation
      depth across the profiled competitor set.
    whyItMatters: >-
      Official pages are useful for positioning, but they do not settle whether Thrive’s platform actually performs
      better than mature incumbents.
    diligencePath: >-
      Run customer reference calls, security diligence, and secret-shop proposal requests across accounting and MSP
      categories.
    relatedQuestionRefs:
      - QP022
      - QP024
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: consolidated-financials
    missingEvidence: >-
      Audited consolidated revenue, gross margin, operating income, EBITDA, and cash-flow statements for Thrive Holdings
      and each operating arm.
    whyItMatters: >-
      Public scale signals are strong, but valuation underwriting still depends on actual economics rather than platform
      anecdotes and capital raised.
    diligencePath: >-
      Request the last twelve months of consolidated financials plus separate Current, Shield, and central-platform
      management accounts.
    relatedQuestionRefs:
      - QI009
      - QI013
      - QI021
      - QI023
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: acquisition-economics
    missingEvidence: >-
      Purchase multiples, contingent earnouts, debt or seller-note obligations, integration costs, and payback periods
      for Current and Shield acquisitions.
    whyItMatters: >-
