  rows:
  - - SMB accounting compliance
    - Tax prep, bookkeeping, payroll, close, review, basic advisory
    - ERP software licenses, banking products, legal services
    - Owner, CFO, controller, managing partner
    - Current targets workflow-heavy trusted-service work rather than selling software alone.
  - - Assurance / audit adjacent accounting
    - Audit support, attest workflow prep, documentation, research, review support
    - Direct sale of audit software or pure consulting detached from a firm
    - Managing partner, audit leader, CFO / audit committee indirectly
    - High-value but more regulation-constrained because sign-off and independence rules matter.
  - - Managed IT core services
    - Help desk, endpoint, infrastructure, cloud ops, backup, DR, security operations
    - Hardware resale, pure VAR margins, one-off project consulting
    - Owner, COO, CFO, IT leader
    - Shield sits in recurring operational spend with sticky workflows.
  - - Compliance-heavy IT services
    - Security monitoring, vCISO, governance, regulated-industry support
    - Pure software subscriptions or internal-only compliance tooling
    - CFO, COO, CIO, compliance lead
    - Compliance complexity makes outsourcing more durable and supports AI-assisted operations.
  - - Status-quo substitutes
    - Internal finance staff, internal IT teams, local CPAs and MSPs, offshore prep, point software vendors
    - N/A
    - Existing buyers already spend here
    - Thrive competes against existing trusted relationships and in-house habits as much as against direct roll-up peers.
  notes: The boundary is intentionally services-led; adjacent software and hardware spend is excluded unless it changes the service workflow being underwritten.
