company:
  name: Thrive Holdings
chapter:
  number: 2
  title: Market Analysis
  summary: 'Thrive is not chasing a generic AI TAM; it is targeting accounting and managed IT service categories where trust, workflow complexity, labor scarcity, and fragmented local ownership make whole-firm
    acquisition more valuable than software resale. Public sources support a very large outer demand pool—accounting and IT services together sit in the hundreds of billions of annual spend, while the global
    managed-services market alone is already in the high hundreds of billions—but they do not support a clean public SAM for AI-enabled rollups of local professional-services firms. The investable conclusion
    is therefore directional rather than precise: the addressable market is large enough, but capturability depends on regulatory structure, seller willingness, workflow redesign success, and the pace at
    which AI shifts service delivery from labor hours toward advisory and higher-value execution.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'The right market boundary for Thrive is narrower than “enterprise AI” and broader than any single vertical software category. Official Thrive materials repeatedly say the company starts in accounting
    and IT services because both are large, mission-critical, and still dominated by repetitive, workflow-heavy work. That implies a services-spend frame, not a software-spend frame. For accounting, the
    relevant pool includes tax preparation, bookkeeping, payroll, audit, assurance, and advisory work performed by local and regional firms or internal finance teams. For IT, it includes managed infrastructure,
    help desk, endpoint, security, backup, disaster recovery, and cloud operations work performed by MSPs, co-managed providers, or internal teams. The status quo is therefore fragmented and relationship-based:
    local CPA firms, local MSPs, in-house finance staff, internal IT departments, offshored back-office support, and point software vendors all compete to solve slices of the same problems. Thrive’s roll-up
    logic only works if owning the whole workflow is more valuable than selling another tool into that stack, which is why substitute analysis matters as much as topline TAM rhetoric.'
  claimRefs:
