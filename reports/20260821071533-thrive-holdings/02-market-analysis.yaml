- id: accounting-services-demand-fragmentation-and-ai-readiness
  title: Accounting Services Demand, Fragmentation, and AI Readiness
  body: 'The accounting side of Thrive’s market looks attractive because demand is structurally persistent while supply is constrained. BLS data show 1.58 million accountant and auditor jobs in 2024 and
    124,200 annual openings projected through 2034, while pipeline and trade sources say candidate inflows, degree completions, and retirement dynamics remain under pressure. That labor scarcity is paired
    with a service model that is ripe for automation but not for full disintermediation. BLS, CPA.com, Wolters Kluwer, and Thrive’s own materials all point to the same pattern: repetitive preparation, documentation,
    reconciliation, and research work can be automated or accelerated, but trust, review, sign-off, and advisory judgment remain human-accountable. This is the economic gap Thrive is trying to exploit.
    Reuters and Forbes show that the market is also fragmented enough to buy: Crete planned more than $500 million of acquisitions in 2025, and Thrive later told Forbes it could commit $1 billion to the
    accounting roll-up. Accounting Today, AICPA, and PCAOB sources add an important caveat: capital can flow into firms, but alternative practice structures and independence rules mean not every revenue
    dollar inside public accounting is equally capturable by an outside owner.'
  claimRefs:
