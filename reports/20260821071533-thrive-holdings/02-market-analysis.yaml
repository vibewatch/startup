- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - CPA pipeline shortage
    - driver
    - Current
    - Scarce labor raises willingness to automate and consolidate.
    - Request hiring, retention, and utilization data from Current firms.
  - - Retirement and succession pressure
    - driver
    - Current to medium-term
    - Creates seller supply for local accounting firms.
    - Map partner-age distribution and succession timelines in target markets.
  - - Cybersecurity and compliance complexity
    - driver
    - Current
    - Pushes SMBs toward outsourced managed services and security layers.
    - Quantify cross-sell rates for security/compliance products in Shield.
  - - AI workflow productivity
    - driver
    - Current
    - Supports margin expansion without matching headcount growth.
    - Test measured before/after productivity metrics by workflow and client type.
  - - Trust-based switching costs
    - constraint
    - Current
    - Slows buyer conversion and limits software-only substitutes.
    - Measure churn, retention, and referral rates after acquisition.
  - - APS / independence rules
    - constraint
    - Current
    - Limits capturability of some accounting revenue pools and ownership structures.
    - Review state-by-state attest restrictions and APS architecture.
  - - Skills and data-quality gaps
    - constraint
    - Current
    - Can stall AI deployment even when buyers want change.
    - Assess training completion, data cleanliness, and governance readiness.
  - - MSP commoditization pressure
    - constraint
    - Current to medium-term
    - Can compress pricing and weaken differentiation if AI tools become table stakes.
    - Review gross-margin durability, win/loss reasons, and pricing discipline.
  notes: Rows mix structural growth drivers with capture constraints because both matter more than raw TAM when evaluating a roll-up strategy.
