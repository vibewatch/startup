  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Thrive\u2019s risk profile is defined less by funding scarcity than by legal-structure complexity, integration load, and talent dependence. The most material downside is in the accounting arm: state CPA ownership rules, APS governance requirements, and tightening AICPA/NASBA/PCAOB attention could constrain what structures and client relationships are permissible as Current scales. The second major risk is operational correlation\u2014Thrive is standardizing AI tools and operating playbooks across 70-plus businesses, which can raise efficiency but also create multi-firm failure modes if rollout quality slips. The third is human concentration: the model depends on scarce leaders, partner-firm operators, accountants, and embedded engineers who translate AI into regulated workflows. Public mitigants exist, but they are process claims rather than outcome disclosure."
  },
  "sections": [
    {
      "id": "regulatory-and-independence-risk",
      "title": "Regulatory and Independence Risk",
      "body": "The accounting side of Thrive carries the most structurally distinctive risk because CPA firm ownership, attest independence, and active-participation rules are not optional design choices. NASBA\u2019s 2025 white paper says most states still require majority CPA ownership of firms and active nonlicensee participation, with two jurisdictions requiring full CPA ownership. California\u2019s statute requires majority licensed ownership, more than half of equity and voting rights, material participation by nonlicensee owners, and a CPA with ultimate responsibility for each attest or compilation engagement. Washington similarly requires majority licensee ownership and board registration plus ethics-course passage for resident nonlicensee owners. Those rules do not prohibit private capital, but they do force it into alternative-practice structures in which attest work stays inside CPA-controlled entities and nonattest economics sit elsewhere under administrative-service agreements. That structure introduces a second-order risk: as AICPA and state regulators revisit APS guidance for PE-backed firms, the compliance surface can expand after the deal is already done. Winston Taylor\u2019s summary of the AICPA exposure draft is especially notable because it describes broader network-firm treatment, portfolio-company conflicts, and upstream-entity prohibitions for controlling investors. For Thrive, the key issue is not whether the model can exist; it clearly can. The issue is whether a national roll-up can keep scaling without legal, branding, or client-conflict friction narrowing the feasible target pool or forcing costly workarounds.",
