      - number: '7.3'
        title: Technology and Partner Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Thrive’s technical edge also creates dependency risk. OpenAI is not an incidental vendor here; it is an
              equity holder and an embedded collaborator. That is strategically powerful, but it means the model depends
              on a frontier-lab relationship whose commercial terms, exclusivity, and long-run economics are not public.
              Shield’s leadership also makes clear that the market itself is shifting. Jim Siders describes MSP
              economics as moving away from stable seat-based pricing toward usage and outcomes, while hyperscalers
              bundle AI directly into the stack and erode the value of standalone tools. That means Shield is trying to
              modernize MSPs precisely as the historical revenue model becomes less defensible. On the accounting side,
              CPA.com’s 2025 report is similarly useful because it argues the profession must move at the speed of
              confidence rather than capability; AI needs human review loops and governance, not just adoption speed.
              These points all push in the same direction: Thrive is exposed not only to classic vendor and cyber risk,
              but also to model-risk, platform-risk, and commercialization-risk. If OpenAI access changes, if shared
              tooling underperforms, if hyperscaler bundling accelerates, or if regulators demand more explicit
              controls, Thrive may need to spend heavily just to preserve current economics rather than expand them.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
          - type: table
            tableRef: TR003
