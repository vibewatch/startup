      - number: '3.3'
        title: Managed IT Competition and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Shield faces a faster-moving and more operationally crowded field than Current. Dataprise, Ntiva,
              NexusTek, Corsica, and Thrive NextGen all market some mix of managed IT, cybersecurity, cloud, automation,
              compliance, and around-the-clock support. Several frame themselves around proactive or AI-enabled delivery
              rather than generic help desk labor, which means Shield is not entering an unsophisticated field.
              Dataprise says it is one of the nation’s largest MSPs with more than 400 certified engineers and
              predictable per-user pricing. Corsica emphasizes flat-fee support, bundled security, and a service
              guarantee. Thrive NextGen markets 2,500-plus customers, 900-plus technical certifications, and a
              ServiceNow-powered platform. These are meaningful distribution and trust signals even if their exact
              economics are private. The implication for Thrive is that MSP differentiation may depend less on owning
              many small firms and more on whether the combined platform can actually deliver measurably better
              automation, security, and compliance outcomes than already-scaled incumbents. Public positioning across
              the MSP set also looks convergent, which raises commoditization risk if customer buying criteria collapse
              into response time, bundled security, and total contract cost.
            claimRefs:
