      - number: '7.4'
        title: People, Talent, and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              The most underrated risk is human concentration. Public capital disclosure is rich, but public governance
              disclosure is not: outside reporting highlights Joshua Kushner, Anuj Mehndiratta, Kareem Zaki, Jim Siders,
              and operating executives like Steve Stagner, but the broader bench, board design, and decision rights
              remain thinly described. That matters because Thrive’s strategy depends on judgment-rich work, not simple
              software reselling. The local partner leaders, senior accountants, MSP technicians, and embedded engineers
              are all critical to maintaining service quality while workflows change. Shield’s own messaging emphasizes
              preserving founder-led businesses and local operators, which is strategically sensible but also a reminder
              that retention is core to the thesis. If acquired-firm leaders depart, Thrive does not just lose managers;
              it can lose tacit customer context, referral networks, and the practitioner knowledge its AI systems are
              supposed to codify. Talent supply is also a macro risk. Accounting’s labor pipeline remains strained,
              while AI changes entry-level training and increases the premium on mid-to-senior staff who can exercise
              judgment. On the technical side, Thrive is effectively trying to deploy rare, domain-aware engineering
              talent across dozens of businesses. That is powerful when it works, but difficult to scale without
              dilution of quality or culture.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
