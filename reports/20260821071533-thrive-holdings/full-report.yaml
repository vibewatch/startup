    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The typical Thrive customer path begins with a local firm joining the platform, then moves through workflow
      deployment, downstream client delivery, and expansion.
    approximationNotes: >-
      The path generalizes public examples from both the accounting and MSP arms rather than reproducing a single
      documented company playbook.
    data:
      items:
        - label: Local firm joins platform
          actor: Partner-firm owner or seller
          touchpoints:
            - M&A or partnership
            - local brand preserved
            - platform onboarding
          painpoint: A local firm wants capital and operating leverage without losing trusted customer relationships.
          opportunity: Thrive can win by offering infrastructure and AI support while preserving frontline trust.
        - label: Teams adopt workflow tooling
          actor: Practitioners, reviewers, technicians, and back office
          touchpoints:
            - training
            - workflow change
            - shared services
          painpoint: Staff must absorb new systems without harming customer response times.
          opportunity: Embedded tools can improve consistency and lower manual work if rollout quality is high.
        - label: Service is delivered to downstream clients
          actor: SMB owner, finance lead, or IT stakeholder
          touchpoints:
            - tax/advisory work
            - help desk
            - security/compliance
          painpoint: Customers care about reliability and relationship continuity more than platform branding.
          opportunity: Better workflows can shorten response times and expand service breadth.
        - label: Trust is tested during change
          actor: Customer relationship owner
          touchpoints:
            - issue resolution
            - billing
            - advisory conversations
          painpoint: Any degradation in speed, accuracy, or empathy can damage sticky local relationships.
          opportunity: Visible service improvements create proof that the platform is additive, not disruptive.
        - label: Account expands
          actor: Client sponsor and partner-firm leadership
          touchpoints:
            - more services
            - advisory upsell
            - cybersecurity or continuity add-ons
          painpoint: Expansion stalls if AI gains are internal only and do not translate into client value.
          opportunity: Freed capacity can support more advisory, security, and strategic work inside existing accounts.
        - label: Platform repeats the loop
          actor: Thrive operating team
          touchpoints:
            - new acquisitions
            - playbook reuse
            - reference selling
          painpoint: Every additional rollout increases correlated customer-experience risk.
          opportunity: If the model works, each proof point can accelerate the next partner-firm sale and client expansion motion.
