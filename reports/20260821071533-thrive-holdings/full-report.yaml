      - number: '8.4'
        title: Why the Mark Is Still Demanding
        blocks:
          - type: paragraph
            body: >-
              Even if one accepts a premium revenue multiple, the current mark still asks investors to look through
              several unresolved variables. Public sources do not disclose consolidated EBITDA, arm-level gross margin,
              free-cash-flow conversion, cap-table preferences, or a dilution waterfall following the round. The
              accounting arm also carries APS, independence, and multi-state licensing complexity that makes revenue
              quality more conditional than a simple headline number suggests. Meanwhile, Shield’s own leadership says
              AI bundling and outcome-based pricing are changing MSP economics, which means part of today’s valuation is
              underwriting a business-model transition as well as a roll-up. These uncertainties matter because public
              markets usually compress professional-services multiples when margin structure, integration durability, or
              regulatory flexibility are unclear. Thrive’s elite backers and product proof justify some premium, but
              they do not remove the need for a valuation discount relative to pure software or infrastructure-AI
              stories. Said differently: the company-quality argument is strong enough to keep Thrive on the list, but
              the price-quality argument is not yet strong enough to erase the risk discount investors should demand.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV033
              - CV034
              - CV035
              - CV038
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV023
              - CV025
              - CV026
              - CV038
              - CV040
              - CV041
      - number: '8.5'
        title: Decision Path and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The main question is not whether Thrive has built something real. It has. The question is what private
              evidence would make the announced mark feel deserved rather than merely financeable. First, management
              needs to prove the revenue denominator with an arm-level bridge from historical standalone firm revenue to
              consolidated 2026 run rate. Second, it needs to show revenue quality through customer retention, client
              concentration, partner-leader retention, and margin stack by arm. Third, it needs to show that the
              accounting structure scales legally by providing a state-by-state APS/ASA and independence memo. Fourth,
              it needs to show that AI is not just saving labor hours but improving durable economics—higher retention,
              higher advisory attach, better SLA performance, or greater technician productivity that customers are
              willing to pay for. If those packages are strong, the announced mark can move from demanding to
              defensible. If they are weak or incomplete, the current valuation should be treated as full and
              potentially vulnerable to multiple compression once private enthusiasm meets public-market style scrutiny.
            claimRefs:
              - CV032
              - CV037
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV022
              - CV023
              - CV032
              - CV040
              - CV041
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: This is more a price-discipline question than a reality question
            body: >-
              Thrive looks materially more real than a narrative-only AI roll-up. The harder question is whether today’s
              mark already prices in too much future execution.
            calloutType: insight
            claimRefs:
              - CV007
              - CV018
              - CV019
              - CV042
