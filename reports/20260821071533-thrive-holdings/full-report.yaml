      - number: '4.3'
        title: Cost Structure, Unit Economics, and Working-Capital Drivers
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence suggests Thrive’s cost structure remains deeply operational. The accounting
              and MSP businesses it acquires are labor-intensive before automation, and public-company filings from CBIZ
              show what that usually means in practice: personnel costs dominate operating expenses, working capital
              depends on receivables and timing, and acquisitions introduce contingent payments, integration work, and
              debt capacity questions. Shield’s case studies add a Thrive-specific twist. Revenue-assurance work,
              automated billing, collections tooling, and ticket triage all imply that some of the economic upside comes
              from operational discipline rather than just topline growth. AI can help by shifting repetitive work off
              humans, but the margin equation is not automatically favorable. Thrive still has to pay engineers,
              operators, cloud and model costs, integration teams, finance staff, and potentially quality-of-earnings
              and legal costs attached to acquisitions. The most important unresolved financial question is therefore
              not whether AI is useful; public evidence already suggests it is. It is whether the productivity gains
              stay inside gross profit or are competed away through lower pricing, service expansion, or
              acquisition-induced complexity.
