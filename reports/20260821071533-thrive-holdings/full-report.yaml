      - number: '3.4'
        title: Moat Durability, Switching Costs, and Adverse Risks
        blocks:
          - type: paragraph
            body: >-
              The most durable part of Thrive’s strategy is not a single product feature; it is the combination of
              seller sourcing, capital, shared operations, local-relationship retention, and embedded workflow software.
              That bundle creates real switching cost once a firm has sold in and moved core processes, data, staffing,
              and client expectations onto the platform. But the moat is far from absolute. Multi-homing is feasible at
              the tool layer because accounting firms can adopt QuickBooks, Pilot-style workflows, or specialized AI
              products while remaining independent, and MSP buyers can rebid support contracts among scaled providers
              with comparable cloud and security language. Public evidence is also uneven on pricing, implementation
              outcomes, and customer retention for most private peers, which means the clearest public moat signals
              remain narrative rather than audited economics. The highest-conviction adverse questions are whether
              Thrive can keep winning acquisition targets before incumbents respond, whether AI productivity becomes
              table stakes across the industry, and whether national accounting and MSP brands can match enough of the
              experience without the integration burden of 70-plus acquisitions. In other words, Thrive’s moat appears
              real but execution-heavy, and it is most exposed where independent firms or standardized software can
              deliver “good enough” modernization.
            claimRefs:
              - CP014
              - CP016
