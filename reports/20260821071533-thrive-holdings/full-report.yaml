  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Thrive is narrower than “enterprise AI” and broader than any single vertical
              software category. Official Thrive materials repeatedly say the company starts in accounting and IT
              services because both are large, mission-critical, and still dominated by repetitive, workflow-heavy work.
              That implies a services-spend frame, not a software-spend frame. For accounting, the relevant pool
              includes tax preparation, bookkeeping, payroll, audit, assurance, and advisory work performed by local and
              regional firms or internal finance teams. For IT, it includes managed infrastructure, help desk, endpoint,
              security, backup, disaster recovery, and cloud operations work performed by MSPs, co-managed providers, or
              internal teams. The status quo is therefore fragmented and relationship-based: local CPA firms, local
              MSPs, in-house finance staff, internal IT departments, offshored back-office support, and point software
              vendors all compete to solve slices of the same problems. Thrive’s roll-up logic only works if owning the
              whole workflow is more valuable than selling another tool into that stack, which is why substitute
              analysis matters as much as topline TAM rhetoric.
            claimRefs:
