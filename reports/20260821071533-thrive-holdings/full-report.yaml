companyProfile:
  summary: >-
    Thrive Holdings is a New York-based, 2025-launched permanent-capital platform that acquires and operates
    professional-services businesses while embedding shared services and frontier-AI workflows. Its first two arms are
    Current in accounting and Shield in IT services, and public evidence now supports real operating scale: Current
    officially disclosed more than $500 million of annual revenue in June 2026, while Shield disclosed more than $100
    million of 2025 annual revenue and more than 1,500 customers. The underwriting question is no longer whether the
    business is real; it is whether margins, retention, regulatory scalability, and cap-table economics justify the
    current $12 billion private mark.
