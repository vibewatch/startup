  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Independence Risk
        blocks:
          - type: paragraph
            body: >-
              The accounting side of Thrive carries the most structurally distinctive risk because CPA firm ownership,
              attest independence, and active-participation rules are not optional design choices. NASBA’s 2025 white
              paper says most states still require majority CPA ownership of firms and active nonlicensee participation,
              with two jurisdictions requiring full CPA ownership. California’s statute requires majority licensed
              ownership, more than half of equity and voting rights, material participation by nonlicensee owners, and a
              CPA with ultimate responsibility for each attest or compilation engagement. Washington similarly requires
              majority licensee ownership and board registration plus ethics-course passage for resident nonlicensee
              owners. Those rules do not prohibit private capital, but they do force it into alternative-practice
              structures in which attest work stays inside CPA-controlled entities and nonattest economics sit elsewhere
              under administrative-service agreements. That structure introduces a second-order risk: as AICPA and state
              regulators revisit APS guidance for PE-backed firms, the compliance surface can expand after the deal is
              already done. Winston Taylor’s summary of the AICPA exposure draft is especially notable because it
              describes broader network-firm treatment, portfolio-company conflicts, and upstream-entity prohibitions
              for controlling investors. For Thrive, the key issue is not whether the model can exist; it clearly can.
              The issue is whether a national roll-up can keep scaling without legal, branding, or client-conflict
              friction narrowing the feasible target pool or forcing costly workarounds.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
