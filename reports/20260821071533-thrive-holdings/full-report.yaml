            body: >-
              Thrive does not appear to sell one monolithic software SKU. Instead, it owns service businesses and layers
              technology into their workflows. On the accounting side, the clearest public module is TaxAI, a
              self-improving tax agent built with OpenAI and Codex alongside practitioners in Current’s network. On the
              IT-services side, Shield describes Sentinel and Spectre as internal AI products for ticket triage and
              resolution, while newer engineering interviews describe Forge as an AI operating system deployed across
              partner MSPs. Public disclosures also point to a fourth module family that is still earlier-stage:
              built-environment regulatory tooling for permitting, certification, documentation, and compliance
              workflows. In customer terms, the product is therefore not “buy our AI app”; it is “let us modernize the
              work your service business already does.” That distinction matters because maturity should be judged by
              workflow adoption, repeatability, and human trust inside service delivery rather than by traditional
