  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: real scale and AI proof support a premium, but missing denominator and
      risk data block a full-throated buy call.
    approximationNotes: The flow compresses decision logic rather than modeling a full investment memo.
    data:
      nodes:
        - id: scale
          label: Real scale
          description: Current and Shield disclose meaningful revenue and operating breadth
        - id: proof
          label: Product proof
          description: Current and Shield both show live AI workflow evidence
        - id: premium
          label: Premium justified
          description: Thrive deserves more than a plain vanilla services multiple
        - id: gaps
          label: Key gaps remain
          description: Margins, retention, cap table, and regulatory detail are still thin
        - id: full
          label: Mark is full
          description: $12B sits near upper-base / lower-bull on public evidence
        - id: track
          label: Track / diligence-forward
          description: Require a private KPI package before underwriting the round at face value
      edges:
        - from: scale
          to: premium
          label: supports premium
        - from: proof
          to: premium
          label: adds credibility
        - from: premium
          to: full
          label: but does not erase price discipline
        - from: gaps
          to: full
          label: prevents clean fair-value conclusion
        - from: full
          to: track
          label: sets current recommendation
        - from: gaps
          to: track
          label: requires more diligence
