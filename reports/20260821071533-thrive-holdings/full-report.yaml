  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation conclusion is that Thrive is interesting but expensive. The announced $12 billion
              mark is not obviously irrational because public evidence now supports meaningful operating scale, real
              product adoption, and a stronger revenue base than a naive back-of-the-envelope might imply. Current’s own
              June 2026 rebrand said it already had more than $500 million in annual revenue, almost 30 firms, and more
              than 2,000 employees, while Shield later disclosed more than $100 million of 2025 annual revenue and over
              1,500 customers. That means Thrive is not being valued as a pre-revenue AI dream. But the market is still
              asking investors to pay a very large premium to public professional-services comparables while offering
              only limited public disclosure on margins, churn, customer concentration, and cap-table structure. The
              right posture is therefore conditional: keep the company in the investable set, but require private
              evidence that the revenue denominator is high enough and the economics durable enough to justify a
              multiple public markets rarely award to human-intensive service businesses. In committee language, this is
              a track / diligence-forward call, not a high-conviction “buy the round at face value” call.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV018
