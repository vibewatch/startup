      - number: '8.2'
        title: Revenue Denominator and Multiple Math
        blocks:
          - type: paragraph
            body: >-
              Most of the valuation debate comes down to which revenue denominator one believes. The user-supplied
              heuristic—50 accounting firms at roughly $5 million each plus 20 MSPs at roughly $10 million each—implies
              about $450 million of revenue and therefore an implied multiple near 26.7x at the announced mark. Public
              evidence, however, points to a higher floor. Current’s official rebrand disclosed more than $500 million
              of annual revenue in June 2026 when the platform still described itself as almost 30 firms. Two months
              later, TechCrunch described Current as more than 50 firms with 2,000-plus professionals, which suggests
              the June revenue snapshot is likely stale relative to the August platform footprint. Shield separately
              disclosed more than $100 million in annual revenue for 2025. That already puts a public lower bound above
              $600 million before giving any value to later Current expansion or the newly announced third platform. At
              $600 million, the announced valuation equates to about 20x revenue; at $750 million it falls to about 16x.
              Those are still demanding multiples, but they are materially less extreme than the heuristic case and help
              explain why the round could clear without being obviously disconnected from operating reality.
            claimRefs:
              - CV004
