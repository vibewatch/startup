      - number: '7.2'
        title: Integration, Operational, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              The next major risk is simply the burden of coordinating a very large service platform. Public sources
              already place Thrive above 70 businesses, with Current at more than 50 accounting firms and Shield around
              20 IT services companies. That is enough scale for integration to become a portfolio-management problem,
              not just a deal-by-deal exercise. The public analog that matters most here is CBIZ’s disclosures around
              integrating Marcum’s attest business assets, ASA relationships, cybersecurity risk, and employee-retention
              pressure. Those filings repeatedly show how service-business integrations can create inconsistent
              controls, distract management, raise independence conflicts, and trigger revenue leakage if client or
              employee continuity breaks. Thrive’s model adds a correlated-technology layer on top: it is not merely
              buying firms, it is also pushing shared AI products and operating systems into those firms. If those tools
              improve speed and quality, the upside is significant. If they produce service errors, rollout fatigue, or
              control drift, many local relationships could be stressed at the same time. This matters more in
              accounting and MSPs than in commodity services because both categories depend heavily on trust,
              continuity, and the belief that the provider understands the client’s specific workflows. Public evidence
              supports the upside case, but the downside case is still underreported because no retained source
              disclosed centralized post-acquisition churn, service-quality, or incident-rate metrics.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
