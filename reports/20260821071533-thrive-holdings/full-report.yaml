      - number: '1.4'
        title: Milestones and Critical Flags
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows unusually fast organizational construction. Thrive launched publicly in April
              2025, pushed capital into Crete’s accounting roll-up in June 2025, added OpenAI as an owner and operating
              partner in December 2025, capitalized Shield with a dedicated $100 million round in February 2026,
              published a detailed Tax AI product case study in May 2026, articulated the "Long Humans" doctrine in June
              2026, and then raised more than $2 billion in August 2026 while opening a third platform around the
              technical and regulatory work required for physical infrastructure. Those are real milestones, but they do
              not fully de-risk the model. Forbes explicitly notes that AI roll-up hype has often outrun operating
              reality, while Reuters highlights that accounting remains labor constrained and that returns from
              AI-enabled roll-ups will take time to prove. The central diligence posture after chapter one is therefore
              two-sided: Thrive has far more real deployment evidence than a generic AI holding-company narrative, but
              it still lacks the public economics, governance detail, and audited operating metrics needed for a clean
              underwrite at a $12 billion valuation.
