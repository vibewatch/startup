chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Ownership Model
        blocks:
          - type: paragraph
            body: >-
              The official Thrive Holdings materials consistently frame the company as a New York-based holding company
              that buys, owns, and operates established services businesses in critical industries rather than selling
              software from the outside. The strongest official language comes from the launch post, the about page, and
              the "Long Humans" essay, which collectively describe a permanent-capital structure, a long-term or "hold
              forever" horizon, and a bias toward controlling or majority ownership while keeping local operators and
              brands in place. Independent coverage sharpens that message by comparing the model to Berkshire-style
              permanent ownership rather than a standard private-equity flip. That distinction matters for every later
              diligence chapter: the value proposition is not just AI tooling, but ownership of the workflow, data,
              practitioner incentives, and change-management process inside acquired firms. Public sources also agree on
              the initial sector focus—accounting and IT services—while official messaging argues that these sectors are
              large, fragmented, trust-driven, and full of repetitive operational work that can be redesigned around AI.
