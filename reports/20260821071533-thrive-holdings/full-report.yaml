            body: >-
              The retained sources point to a consistent operating architecture across Current and Shield. First, Thrive
              and OpenAI supply a forward-deployed engineering layer that works alongside domain practitioners. Second,
              partner-firm workflows, data, and local operating knowledge provide the context that makes the systems
              useful. Third, the products are deployed into live workflows—tax preparation, ticket triage,
