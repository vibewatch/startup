  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Thrive’s public revenue model looks much closer to an owner-operator services platform than to a classic
              software company. Official materials repeatedly say the company owns and operates accounting and IT
              services businesses, then embeds AI and shared operational tooling into those workflows. That means the
              primary revenue streams are still service contracts—tax, accounting, advisory, managed IT, cloud,
              cybersecurity, and related recurring client work—rather than standalone SaaS subscriptions. The AI layer
              matters because it may lift throughput, create higher-value advisory time, improve ticket resolution, and
              standardize back-office execution, but none of the retained public sources demonstrate that Thrive sells
              those internal products as independent software lines. Public pricing is therefore sparse. In contrast
              with substitutes like Pilot and QuickBooks, Thrive’s monetization appears to sit inside firm-level
              contracts, acquisition economics, and shared-services capture. That creates upside if AI expands capacity
              without proportional headcount growth, but it also means investors cannot judge realized pricing or
              contribution margin from published list prices.
