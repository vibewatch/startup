  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Thrive’s competitive landscape is best understood as four overlapping buyer alternatives rather than a
              single list of venture-backed peers. First, there are acquisition-backed accounting platforms such as
              Current itself and other consolidators or alliances that promise local-brand retention with shared
              services and technology. Second, there are scaled incumbents such as Aprio, CBIZ, and EisnerAmper that
              already sell advisory breadth, technology services, outsourcing, and brand trust without asking customers
              or practitioners to bet on a new holdco structure. Third, Shield competes with national managed-service
              providers including Ntiva, Dataprise, NexusTek, Corsica, and Thrive NextGen that bundle cybersecurity,
              cloud, support, and compliance as ongoing service contracts. Fourth, software-led substitutes such as
              Pilot and QuickBooks let smaller buyers modernize bookkeeping and finance operations without selling a
              firm or adopting a full acquisition platform. This matters because Thrive is simultaneously competing for
              end clients, acquisition targets, and practitioner loyalty. A rival does not need to match the whole
              holdco model to slow growth; it only needs to make the status quo, internal build, or a cheaper
              software-plus-services option feel good enough.
