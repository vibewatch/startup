      - number: '2.4'
        title: Growth Drivers, Constraints, and Capturability
        blocks:
          - type: paragraph
            body: >-
              The case for Thrive rests on several reinforcing drivers: labor shortages in accounting, customer demand
              for faster and more advisory-oriented service, rising cybersecurity and compliance obligations in IT, and
              the willingness of older owners to sell local firms into better-capitalized platforms. AI strengthens the
              thesis because it raises capacity and service consistency without requiring one-to-one headcount growth,
              and because both sectors contain high-volume tasks where better data handling and workflow design matter.
              But public evidence also shows why the addressable market is harder to capture than a raw size figure
              suggests. Deloitte and Wolters Kluwer emphasize skills gaps, governance immaturity, and the need to
              redesign processes rather than merely buying tools. PCAOB and AICPA materials show that accounting
              ownership structures carry regulatory friction. MSP Global shows growing commoditization fear among
              providers, which can compress margins even in a rising market. The net result is that Thrive’s practical
              SAM is the subset of accounting and MSP firms that are fragmented, seller-ready, regulation-compatible,
              technologically modernizable, and culturally willing to accept deep workflow change. That is still large
              enough to matter, but it is much smaller than the broad services TAM implied by headline sector spend.
