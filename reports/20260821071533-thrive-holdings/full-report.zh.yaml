      - number: '2.4'
        title: 增长驱动、约束与可捕获性
        blocks:
          - type: paragraph
            body: >-
              Thrive 的逻辑靠几股力量互相加强：会计劳动力短缺、客户想要更快且更偏咨询的服务、IT 侧网络安全和合规义务上升，以及老一代业主愿意把本地公司卖给资本更充足的平台。AI
              强化了这条逻辑，因为它能在不按人头一比一增长的情况下提高产能和服务一致性；两个行业也都有大量高频任务，数据处理和工作流设计越好，价值越大。但公开证据也解释了为什么可触达市场比原始规模数字更难捕获。Deloitte
              和 Wolters Kluwer 强调技能缺口、治理不成熟，以及重做流程的必要性，而不是只买工具。PCAOB 和 AICPA 材料显示，会计所有权结构带有监管摩擦。MSP Global
              显示，供应商越来越担心商品化，即使市场增长，利润率也可能被压缩。净结果是：Thrive 的实际 SAM，是会计和 MSP
              公司中的一个子集——碎片化、卖方准备出售、监管相容、技术上可改造、文化上愿意接受深度工作流变化。这个子集仍足够大，但远小于头部行业支出暗示的广义服务 TAM。
