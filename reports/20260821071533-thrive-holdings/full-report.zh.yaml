  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    notes: 估值争议不在于 Thrive 是否值得关注，而在于溢价是否已经嵌入了过多未来执行。
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Thrive 已经是真正成规模的运营平台，而不是一个概念
        - 可信收入桥若显示 August 2026 收入运行率显著高于公开 $600M 下限，投资逻辑会更强
      - - Current 和 Shield 都有 AI 证据，支撑其相对普通 roll-up 的溢价
        - 业务线层面的留存、毛利率和增购数据能说明这笔溢价应大还是小
      - - 顶级支持方和 OpenAI 支持降低融资和信号风险
        - 股权结构表和优先权披露能说明，上行空间实际有多少落到新投资者手里
      - - 上市专业服务可比公司交易倍数低得多
        - 若能证明利润率像软件一样扩张，或客户经济性异常耐久，估值差距会收窄
      - - 在证明相反之前，监管和整合复杂度足以支撑折价
        - 详尽的 APS / ASA / 独立性备忘录，加上交割后队列指标，会降低折价
