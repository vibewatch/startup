  - id: TR005
    title: 风险缓释与叫停标准表
    notes: 最好的监控计划应基于触发条件，因为公开披露仍缺少集中化风险 KPI。
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管 / 独立性挤压
        - 与 APS / 投资者关系绑定的客户冲突或标的失格
        - 多笔交易或现有客户因同一结构性原因变得不可行
        - 重做估值、缩窄标的范围，并在继续 M&A 前升级法律尽调
      - - 整合质量漂移
        - 分批上线后，服务事故、错过申报或客户投诉增加
        - 跨公司异常反复出现且未被快速控制
        - 暂停新部署，先集中补救，再做更多收购
      - - 合伙人领导层流失
        - 创始人 / 资深本地运营者在交易完成后 12-24 个月内离开
        - 早期队列流失率显著高于计划
        - 在证明相反之前，将留任经济性和文化契合视为失效
      - - AI / 定价模型压力
        - 成果定价压力上升，但实际增购或利润率扩张滞后
        - 尽管有产品采用叙事，收入质量仍转弱
        - 下调倍数假设，并要求提供业务线层面的单位经济性
    claimRefs:
