      - number: '5.3'
        title: 差异化、开发者信号与路线图
        blocks:
          - type: paragraph
            body: >-
              Thrive 的主要产品差异化不在于拥有前沿模型，而在于嵌入式部署、本地工作流上下文，以及跨许多被收购企业的组合学习。多次 Shield
              访谈明确说，公司在内部建设技术，产品想法直接来自技术人员和运营者，随后才考虑更广泛的产品化。这让路线图高度运营化：先做帮助台分诊，再扩展到更多工单类别、入职 / 离职、项目运营、客户分析、AI
              咨询，最终走向基于结果或由运营者创建的解决方案。本章的开发者信号是间接的，但仍有用。Thrive 会计业务臂公开把 TaxAI 的自我改进循环归功于 Codex，OpenAI 的 Codex
              公告解释了正在商业化的安全、迭代式编码智能体工作流，openai/codex 的公开 GitHub 仓库也显示，技术栈里至少一个赋能工具有真实开源接触面。这不等于 Thrive
              自有开发者生态，但支持一个判断：Thrive 建在活跃开发者工具之上，而不是完全黑盒的供应商 API。
