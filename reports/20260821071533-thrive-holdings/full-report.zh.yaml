      - number: '7.2'
        title: 整合、运营与质量风险
        blocks:
          - type: paragraph
            body: >-
              下一个主要风险很简单：协调一个超大型服务平台的负担。公开来源已经显示 Thrive 超过 70 家企业，其中 Current 超过 50 家会计事务所，Shield 约 20 家 IT
              服务公司。这个规模足以让整合变成组合管理问题，而不是逐笔交易执行。这里最重要的公开类比是 CBIZ 围绕整合 Marcum 鉴证业务资产、ASA
              关系、网络安全风险和员工留存压力的披露。这些文件反复显示，服务企业整合可能制造控制不一致、分散管理层注意力、抬高独立性冲突，并在客户或员工连续性断裂时触发收入流失。Thrive
              模式在上面又叠加了一层关联技术：它不只是买公司，还把共享 AI 产品和操作系统推入这些公司。如果这些工具提升速度和质量，上行很大。如果它们制造服务错误、上线疲劳或控制漂移，许多本地关系可能同时承压。在会计和
              MSP
              中，这一点比在商品化服务里更重要，因为两个品类都高度依赖信任、连续性，以及供应商理解客户特定工作流这一信念。公开证据支撑上行情景，但下行情景仍披露不足，因为本次没有纳入任何披露集中化收购后流失、服务质量或事故率指标的来源。
