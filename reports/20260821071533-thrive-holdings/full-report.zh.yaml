      - number: '1.4'
        title: 里程碑与关键风险信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Thrive 的组织搭建速度异常快。公司 2025 年 4 月公开启动，2025 年 6 月向 Crete 的会计整合注资，2025 年 12 月引入 OpenAI 作为股东和运营伙伴，2026
              年 2 月用一轮专门的 $100 million 融资资本化 Shield，2026 年 5 月发布详细 Tax AI 产品案例，2026 年 6 月阐述 “Long Humans” 理念，随后在 2026 年
              8 月融资超过 $2 billion，并围绕实体基础设施所需的技术和监管工作开启第三个平台。这些都是真实里程碑，但并没有完全降低模式风险。Forbes 明确指出，AI
              整合平台的热度常常跑在运营现实前面；Reuters 则强调，会计行业仍受劳动力约束，AI 驱动整合的回报还需要时间证明。因此，第一章之后的核心尽调立场是双向的：相比普通 AI 控股公司叙事，Thrive
              有多得多的真实部署证据；但要在 $12 billion 估值上做出干净承销，它仍缺少公开经济性、治理细节和经审计的运营指标。
