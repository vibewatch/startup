  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Thrive 典型客户路径从本地公司加入平台开始，然后经历工作流部署、下游客户交付和扩张。
    approximationNotes: 该路径概括了会计和 MSP 两条业务线的公开案例，而不是复现一家公司的成文打法。
    data:
      items:
        - label: 本地公司加入平台
          actor: 合作伙伴公司所有者或卖方
          touchpoints:
            - M&A 或合作
            - 保留本地品牌
            - 平台接入
          painpoint: A local firm wants capital and operating leverage without losing trusted customer relationships.
          opportunity: Thrive can win by offering infrastructure and AI support while preserving frontline trust.
        - label: 团队采用工作流工具
          actor: 从业者、复核人员、技术员和后台
          touchpoints:
            - 培训
            - 工作流变革
            - 共享服务
          painpoint: Staff must absorb new systems without harming customer response times.
          opportunity: Embedded tools can improve consistency and lower manual work if rollout quality is high.
        - label: 向下游客户交付服务
          actor: SMB 业主、财务负责人或 IT 相关负责人
          touchpoints:
            - 税务 / 咨询工作
            - 服务台
            - 安全 / 合规
          painpoint: Customers care about reliability and relationship continuity more than platform branding.
          opportunity: Better workflows can shorten response times and expand service breadth.
        - label: 变革中检验信任
          actor: 客户关系负责人
          touchpoints:
            - 问题解决
            - 账单
            - 咨询对话
          painpoint: Any degradation in speed, accuracy, or empathy can damage sticky local relationships.
          opportunity: Visible service improvements create proof that the platform is additive, not disruptive.
        - label: 账户扩张
          actor: 客户发起人和合作伙伴公司管理层
          touchpoints:
            - 更多服务
            - 咨询增购
            - 网络安全或连续性附加服务
          painpoint: Expansion stalls if AI gains are internal only and do not translate into client value.
          opportunity: Freed capacity can support more advisory, security, and strategic work inside existing accounts.
        - label: 平台重复循环
          actor: Thrive 运营团队
          touchpoints:
            - 新收购
            - 打法复用
            - 案例背书销售
          painpoint: Every additional rollout increases correlated customer-experience risk.
          opportunity: If the model works, each proof point can accelerate the next partner-firm sale and client expansion motion.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU010
      - CU029
      - CU032
      - CU033
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据从广泛平台触达逐步收窄到一组更小、具名且接近生产质量的证据点。
    approximationNotes: 只有后期阶段接近字面数量；漏斗中段混合了公开公司主张和已审查合作伙伴页面。
    data:
      items:
        - label: 持有 / 运营业务
          value: 70
          unit: businesses
        - label: 公开描述的 Current 公司 + Shield 公司
          value: 59
          unit: firms
        - label: 已披露的 Shield 下游客户
          value: 1500
          unit: customers
        - label: 已审查的具名合作伙伴公司档案
          value: 16
          unit: profiles
        - label: 带有直接成果或客户证言的具名证据样本
          value: 8
          unit: examples
    claimRefs:
      - CU011
      - CU012
      - CU014
      - CU015
      - CU018
      - CU019
      - CU020
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 会计侧证据更窄、更围绕工作流；MSP 侧证据更广，也更富客户证言。
    approximationNotes: 强、中、弱衡量公开证据深度，而非经济重要性。
    data:
      columns:
        - 会计侧证据
        - MSP 侧证据
        - 主要局限
      rows:
        - label: 具名终端客户深度
          values:
            - 中
            - 强
            - 会计侧具名下游客户引用更少
        - label: 成果具体度
          values:
            - 中
            - 强
            - 多数证据更侧重工作流收获，而非收入或留存
        - label: 留存可见度
          values:
            - 弱
            - 中
            - 两条业务线都未披露统一口径的流失或队列指标
        - label: 地理 / 垂直领域多样性
          values:
            - 中
            - 强
            - MSP 合作伙伴页面披露的本地市场细节多于 Current 公开信息
        - label: 采购 / 买方清晰度
          values:
            - 中
            - 强
            - 下游客户买方画像仍靠推断，而非集中披露
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU017
      - CU018
      - CU019
      - CU036
      - CU037
