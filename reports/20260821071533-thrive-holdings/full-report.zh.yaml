  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Thrive 看起来并不销售一个单体软件 SKU。它拥有服务企业，再把技术叠进这些企业的工作流。会计侧，最清晰的公开模块是 TaxAI：一个与 OpenAI 和 Codex 一起、在 Current
              网络从业者身边打造的自我改进税务智能体。IT 服务侧，Shield 将 Sentinel 和 Spectre 描述为用于工单分诊和解决的内部 AI 产品；更新的工程访谈又把 Forge 描述为部署在合作 MSP
              之间的 AI 操作系统。公开披露还指向第四组模块家族，阶段更早：面向许可、认证、文档和合规工作流的建成环境监管工具。用客户的话说，产品不是“买我们的 AI
              应用”，而是“让我们把你的服务企业已经在做的工作现代化”。这一区分重要，因为成熟度不应按传统企业软件席位数衡量，而应看服务交付内部的工作流采用、可重复性和人类信任。
