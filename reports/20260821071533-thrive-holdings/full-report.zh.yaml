  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Thrive 的正确市场边界，比“企业 AI”窄，也比任何单一垂直软件品类宽。Thrive 官方材料反复说，公司从会计和 IT
              服务切入，因为两个行业规模大、任务关键，且仍由重复、工作流密集型工作主导。这意味着应按服务支出看市场，而不是按软件支出看。会计侧，相关池子包括本地和区域事务所或企业内部财务团队承担的报税、记账、薪资、审计、鉴证和咨询工作。IT
              侧，则包括 MSP、共同管理服务商或内部团队承担的托管基础设施、帮助台、终端、安全、备份、灾难恢复和云运维工作。因此，现状是碎片化、关系驱动的：本地 CPA 事务所、本地 MSP、内部财务人员、内部 IT
              部门、离岸后台支持和点状软件供应商都在争夺同一批问题的不同切片。只有当拥有完整工作流比向这套技术栈再卖一个工具更有价值时，Thrive 的整合逻辑才成立；因此，替代品分析和顶层 TAM 叙事同样重要。
