  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >-
              Thrive 通过分层服务平台模式服务客户，而不是单一直销 SaaS 漏斗。第一层是加入 Current 或 Shield
              的事务所，它们实际上购买资本、运营支持和嵌入式技术，同时保留本地品牌。第二层是这些事务所已经服务的下游终端客户：个人、SMB、非营利组织、医疗机构、法律事务所、能源公司、金融服务客户、房地产运营商，以及其他外包会计或
              IT 工作的组织。公开来源尤其支持 MSP 侧有很广的垂直覆盖。Shield
              合作伙伴页面描述的客户分布在医疗、法律、建筑、能源、金融服务、制造、非营利、房地产、建筑设计、酒店和专业服务等行业。会计侧，Thrive
              自身材料强调本地信任和咨询连续性的价值，这意味着即使运营平台变成全国性，客户关系仍留在本地。这张客户图谱很重要，因为 Thrive
              收购的不只是收入流；它继承的是高度依赖信任的关系，其耐久性取决于在工作流变化中守住服务质量。
