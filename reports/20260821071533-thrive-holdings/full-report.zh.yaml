      - number: '2.2'
        title: 会计服务需求、碎片化与 AI 准备度
        blocks:
          - type: paragraph
            body: >-
              Thrive 市场的会计侧很有吸引力，因为需求结构性持续，而供给受限。BLS 数据显示，2024 年会计师和审计师岗位为 1.58 million 个，至 2034 年预计每年有 124,200
              个职位空缺；人才管道和行业来源则称，候选人流入、学位完成数和退休动态仍承压。劳动力稀缺对应的服务模式，适合自动化，但不适合被完全去中介化。BLS、CPA.com、Wolters Kluwer 和 Thrive
              自身材料都指向同一模式：重复的准备、文档、对账和研究工作可以自动化或加速，但信任、复核、签字和咨询判断仍要由人负责。这正是 Thrive 想撬动的经济缺口。Reuters 和 Forbes
              表明，这个市场也足够碎片化，足以通过收购切入：Crete 计划在 2025 年完成超过 $500 million 收购，Thrive 后来告诉 Forbes，它可向会计整合投入 $1
              billion。Accounting Today、AICPA 和 PCAOB 来源又加上一条重要限定：资本可以流入事务所，但替代执业结构和独立性规则意味着，公共会计里的每一美元收入，并非都能被外部所有者同等捕获。
