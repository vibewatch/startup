        title: 图表
        blocks:
          - type: callout
            title: 最难的风险不是短期风险，而是结构性风险
            body: Thrive 看起来资金充足。更实质的风险在于，它能否让一个全国性 AI 整合并购平台同时守住法律合规、本地信任，并让人员规模跟得上。
