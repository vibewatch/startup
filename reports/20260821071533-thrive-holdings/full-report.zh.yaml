      - number: '8.4'
        title: 为什么当前估值仍然很高
        blocks:
          - type: paragraph
            body: >-
              即便接受溢价收入倍数，当前估值仍要求投资者穿透几个未解变量。公开来源没有披露合并 EBITDA、各业务臂毛利率、自由现金流转化、股权结构优先权，或本轮之后的稀释瀑布。会计业务臂还背负
              APS、独立性和多州执照复杂性，让收入质量比简单标题数字更有条件。与此同时，Shield 自家管理层称，AI 打包和按结果定价正在改变 MSP
              经济性，这意味着今天估值的一部分不仅是在承销整合并购，也是在承销商业模式转型。这些不确定性很重要，因为当利润结构、整合耐久度或监管灵活性不清晰时，公开市场通常会压缩专业服务倍数。Thrive
              的顶级背书和产品验证可以支撑一定溢价，但不足以取消相对纯软件或基础设施 AI 故事应有的估值折扣。换句话说，公司质量论据强到足以让 Thrive 留在名单里，但价格质量论据还没强到足以抹掉投资者应要求的风险折扣。
