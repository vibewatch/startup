      - number: '7.4'
        title: 人员、人才与治理风险
        blocks:
          - type: paragraph
            body: >-
              最容易被低估的风险，是人高度集中。公开资本披露很充足，但公开治理披露并不充分：外部报道提到 Joshua Kushner、Anuj Mehndiratta、Kareem Zaki、Jim Siders，以及
              Steve Stagner 这类运营高管，但更大范围的人才梯队、董事会设计和决策权仍然描述很薄。这个问题很关键，因为 Thrive
              的策略靠高判断力工作驱动，而不是简单转卖软件。地方合伙人负责人、资深会计师、MSP 技术员和嵌入式工程师，都决定了工作流调整时服务质量能否守住。Shield
              自己的表述强调保留创始人主导的业务和本地运营者；这在战略上合理，也提醒我们，留任本身就是投资逻辑核心。若被收购公司的负责人离开，Thrive 失去的不只是经理人；还可能丢掉默会的客户语境、转介绍网络，以及其 AI
              系统本该沉淀的实操知识。人才供给也是宏观风险。会计行业的人才管道仍然吃紧，而 AI 改变初级岗位训练方式，也抬高了能做判断的中高阶员工溢价。技术侧，Thrive
              实际上是在尝试把稀缺、懂行业的工程人才铺到几十家公司里。跑通时很有威力，但若不稀释质量或文化，规模化很难。
