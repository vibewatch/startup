              主要客户上行来自模式两层的先落地、再扩张。Thrive 可以增加更多合作事务所，加深每家事务所内部的工作流采用，并帮助这些事务所向现有下游客户销售更多服务。公开证据已经以小样本展示了这种动态：TaxAI
              似乎把会计师从重复工作中解放出来，腾出更多咨询工作和新客户产能；Shield 则称产品部署为技术人员打开更多咨询式工作空间。但集中度和采购风险仍然重要。多个 MSP
