      - number: '3.3'
        title: 托管 IT 竞争与分发能力
        blocks:
          - type: paragraph
            body: >-
              相比 Current，Shield 面对的市场变化更快，运营上也更拥挤。Dataprise、Ntiva、NexusTek、Corsica 和 Thrive NextGen 都在营销某种组合：托管
              IT、网络安全、云、自动化、合规和全天候支持。多家公司把自己定位为主动式或 AI 驱动交付，而不是普通帮助台人力，这意味着 Shield 进入的不是一个低成熟度市场。Dataprise 称自己是美国最大的 MSP
              之一，拥有 400 多名认证工程师，并提供可预测的按用户定价。Corsica 强调固定费率支持、打包安全和服务保证。Thrive NextGen 营销 2,500 多家客户、900 多项技术认证，以及由
              ServiceNow 驱动的平台。即便具体经济性是私有的，这些仍是有意义的分发和信任信号。对 Thrive 的含义是，MSP
              差异化可能不那么取决于拥有许多小公司，而更取决于合并平台能否真正交付可衡量更好的自动化、安全和合规结果，超过已经规模化的既有玩家。整个 MSP
              群体的公开定位也趋同；如果客户购买标准收敛到响应时间、打包安全和合同总成本，商品化风险就会上升。
