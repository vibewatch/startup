      - number: '1.3'
        title: 领导层、资本与治理
        blocks:
          - type: paragraph
            body: >-
              融资是 Thrive 叙事里最清晰的一部分。Thrive 与 Kirkland 的官方披露，加上独立报道，都指向 2026 年 8 月一轮超过 $2 billion、估值 $12 billion
              的融资，投资方包括 D1 Capital Partners、Altimeter Capital 和 SoftBank Group；成立以来累计融资因此超过 $3 billion。此前的战略拐点发生在 2025 年
              12 月：OpenAI 宣布入股，并把研究、产品和工程团队嵌入 Thrive 组合公司。公开领导层披露比资本披露薄得多。OpenAI 和 CNBC 的官方材料明确引用 Joshua Kushner，并称其为
              Thrive Capital 和 Thrive Holdings 的 CEO 及创始人；TechCrunch 与后续 Shield 材料则把 Anuj Mehndiratta 和 Kareem Zaki
              识别为创始团队成员。Seedtable 将 Joshua Kushner、Mehndiratta 和 Zaki
              列为可见的高管核心。公开记录没有给出完整董事会图谱、投票控制说明或详细治理架构。这种不对称很重要：公司已经按超大轮私人平台完成资本化，但领导层披露仍像一家刚启动的特殊目的载体。
