  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Thrive 剩余风险集中在法律 / 独立性、整合质量和人才连续性，而不是简单的资金可得性。
    approximationNotes: 单元格反映截至 2026-08-21 基于公开证据综合出的判断，而非公司内部评分。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: APS / 独立性冲突
          values:
            - 中高
            - 高
            - 早期至中期
            - 高
        - label: 整合 / 控制漂移
          values:
            - 高
            - 高
            - 早期
            - 高
        - label: 合伙人负责人流失
          values:
            - 中高
            - 高
            - 早期
            - 高
        - label: 网络安全 / 供应商事件
          values:
            - 中高
            - 高
            - 中期
            - 中高
        - label: AI 定价压缩
          values:
            - 中
            - 中高
            - 早期
            - 中高
    claimRefs:
      - CR010
      - CR014
      - CR016
      - CR021
      - CR028
      - CR032
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最危险的下行情景，是合规或推广失败先引发人员流失、客户信任受损和收入压力，最后压缩估值。
    data:
      nodes:
        - id: reg
          label: 监管 / 独立性问题
        - id: integration
          label: 整合或推广失败
        - id: talent
          label: 负责人 / 从业者流失
        - id: trust
          label: 客户信任受损
        - id: revenue
          label: 收入质量承压
        - id: margin
          label: 利润率 / 补救负担
        - id: valuation
          label: 估值信心
        - id: targets
          label: 标的池收缩
      edges:
        - from: reg
          to: targets
          label: 可行交易或客户组合变少
        - from: reg
          to: revenue
          label: 冲突可能终止或限制服务
        - from: integration
          to: talent
          label: 变革疲劳和本地扰动
        - from: integration
          to: trust
          label: 服务质量下滑会被客户感知
        - from: talent
          to: trust
          label: 本地关系和隐性知识流失
        - from: trust
          to: revenue
          label: 留存下降、增购变弱、新客户赢单变慢
        - from: integration
          to: margin
          label: 补救、返工和支持成本
        - from: revenue
          to: valuation
          label: 增长与持久性倍数被压缩
        - from: margin
          to: valuation
          label: 经济性转弱会压低信心
        - from: targets
          to: valuation
          label: 整合并购跑道看起来变短
    claimRefs:
      - CR036
      - CR037
      - CR038
      - CR039
      - CR041
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Thrive 要让商业模式保持合规且具备经济吸引力，依赖少数监管方、战略伙伴和运营者群体。
    data:
      nodes:
        - id: thrive
          label: Thrive 平台
        - id: openai
          label: OpenAI
        - id: stateboards
          label: 州级委员会 / 执照规则
        - id: aicpa
          label: AICPA / NASBA / PCAOB
        - id: operators
          label: 本地合伙人负责人
        - id: accountants
          label: 资深会计师
        - id: engineers
          label: 嵌入团队工程师
        - id: vendors
          label: 软件 / 云供应商
        - id: investors
          label: 资本提供方
      edges:
        - from: openai
          to: thrive
          label: 模型、团队、战略 AI 杠杆
        - from: stateboards
          to: thrive
          label: 事务所所有权和许可约束
        - from: aicpa
          to: thrive
          label: 独立性和 APS 标准
        - from: operators
          to: thrive
          label: 本地信任和执行连续性
        - from: accountants
          to: thrive
          label: 受监管工作交付
        - from: engineers
          to: thrive
          label: 工具部署和迭代
        - from: vendors
          to: thrive
          label: 工作流和安全基础设施
        - from: investors
          to: thrive
          label: 资本节奏和回报预期
    claimRefs:
      - CR001
      - CR002
      - CR019
      - CR025
      - CR029
      - CR031
      - CR034
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 真实规模和 AI 证据支撑溢价，但缺失的分母与风险数据挡住了明确买入结论。
    approximationNotes: 该流程压缩决策逻辑，而非完整投资备忘录模型。
    data:
      nodes:
        - id: scale
          label: 真实规模
          description: Current 和 Shield 披露了有意义的收入和运营广度
        - id: proof
          label: 产品证明
          description: Current 和 Shield 都展示了上线运行的 AI 工作流证据
        - id: premium
          label: 溢价有理由
          description: Thrive 应获得高于普通服务业的倍数
        - id: gaps
          label: 关键缺口仍在
          description: 利润率、留存、股权结构表和监管细节仍薄
        - id: full
          label: 估值已打满
          description: $12B 接近公开证据下基准情景上沿 / 乐观情景下沿
        - id: track
          label: 观察 / 尽调优先
          description: 按票面估值评估本轮前，需要非公开 KPI 包
      edges:
        - from: scale
          to: premium
          label: 支撑溢价
        - from: proof
          to: premium
          label: 增加可信度
        - from: premium
          to: full
          label: 但不能取消价格纪律
        - from: gaps
          to: full
          label: 阻止得出清晰公允价值结论
        - from: full
          to: track
          label: 形成当前推荐
        - from: gaps
          to: track
          label: 需要更多尽调
    claimRefs:
      - CV007
      - CV018
      - CV019
      - CV020
      - CV024
      - CV030
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 所宣布估值取决于相信哪个收入分母，观感会截然不同。
    approximationNotes: 条形显示在固定 $12B 名义估值下隐含的估值 / 收入倍数。
    data:
      items:
        - label: $450M 收入经验估算
          value: 26.7
        - label: $600M 公开下限
          value: 20
        - label: $750M 更强 2026 收入运行率
          value: 16
        - label: $900M 激进上行情景
          value: 13.3
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支撑的区间很宽，但重心仍没有指向显然便宜的入场价。
    approximationNotes: 区间以十亿美元为单位，反映企业价值口径的判断带，而非精确交易定价模型。
    data:
      items:
        - label: 悲观情景
          low: 6
          mid: 7
          high: 8
        - label: 基准情景
          low: 9
          mid: 10.5
          high: 12
        - label: 乐观情景
          low: 13
          mid: 14.5
          high: 16
        - label: 已宣布估值
          low: 12
          mid: 12
          high: 12
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 投委会式记分卡：业务质量真实，但估值透明度和风险调整后定价仍弱于战略兴奋点。
    approximationNotes: 分数是 1-10 的公开证据判断，不是管理层提供的 KPI。
    data:
      items:
        - label: 收入规模
          value: 8
          detail: 公开证据支持相当规模的运营基础
        - label: AI 落地证明
          value: 7
          detail: 两条业务线都有实质性工作流部署证据
        - label: 市场 / 碎片化顺风
          value: 8
          detail: 会计和 MSP 品类规模大且分散
        - label: 收入可见度
          value: 6
          detail: 足以推断下限，不足以精确投资测算
        - label: 利润率可见度
          value: 2
          detail: 没有公开到业务线层面的盈利能力或现金转化数据
        - label: 监管 / 整合风险
          value: 4
          detail: 结构和队列更清楚之前，应保留有意义折价
        - label: 当前投委会就绪度
          value: 5
          detail: 值得观察，但不明显便宜
    claimRefs:
      - CV007
      - CV018
      - CV022
      - CV023
      - CV031
      - CV042
