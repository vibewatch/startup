      - number: '8.5'
        title: 决策路径与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              核心问题不是 Thrive 是否已经做出了真实业务。它做出来了。问题是，什么私人证据能让已宣布估值显得配得上，而不只是融资市场给得起。第一，管理层需要用各业务臂桥表证明收入分母，从历史单体事务所收入走到 2026
              年合并运行率。第二，需要用客户留存、客户集中度、合伙人负责人留任，以及各业务臂利润率结构证明收入质量。第三，需要提交逐州 APS/ASA 与独立性备忘录，证明会计架构能合法扩张。第四，需要证明 AI
              不只是节省工时，而是在改善耐久经济性——更高留存、更高咨询附加率、更好 SLA
              表现，或客户愿意付费的更高技术员生产率。若这些材料强，已宣布估值可以从昂贵变为可以辩护。若材料薄弱或不完整，当前估值应视为充分定价，并且一旦私人市场热情遇到类似公开市场的审视，可能会受到倍数压缩。
