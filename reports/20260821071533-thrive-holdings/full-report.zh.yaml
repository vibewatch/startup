      - number: '3.2'
        title: 会计平台对手与软件替代品
        blocks:
          - type: paragraph
            body: >-
              会计侧是竞争格局里战略意义最大的部分，因为 Thrive 的公开叙事围绕 Current 和 AI 驱动的事务所所有权展开。Current 自称在保留本地领导层、品牌和股权的同时叠加共享服务和专门打造的
              AI；Reuters、CPA Practice Advisor 和 Forbes 也都强化了这一点：它是传统短周期私募股权之外的长期持有方案。这个模式有差异化，但并非没有竞争。Aprio、CBIZ 和
              EisnerAmper 都在营销广泛的会计、税务、咨询、外包和技术能力；买家如果想要复杂咨询支持，而不改变所有权，这些供给已经够用。与此同时，Pilot 和 QuickBooks 用透明或半透明包装、AI
              辅助工作流和人工复核攻击低端与中端市场。它们的替代风险不在于能立刻取代大型本地会计事务所，而在于能让独立事务所和 SMB
              客户自己变得更高效，从而降低出售给平台的必要性。因此，反向解读很有分量：当事务所业主把传承、资本、招聘和工作流工具作为一个组合来定价时，Thrive 的会计逻辑会赢；当 AI
              工具足够好，本地事务所无需让出控制权也能现代化时，这条逻辑就会变弱。
