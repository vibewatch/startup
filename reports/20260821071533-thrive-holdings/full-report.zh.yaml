        - 中
        - 高
        - 如果收入已明显高于 $600M，该估值要求很高，但并非荒谬
        - 不要按表面接受已公布估值；必须拿到覆盖收入桥、利润率、留存、股权结构表和监管结构的非公开 KPI 包
