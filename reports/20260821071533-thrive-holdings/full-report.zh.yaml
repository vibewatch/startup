  summary: >-
    Thrive Holdings 总部在纽约，2025 年启动，是一家永久资本平台，收购并运营专业服务企业，同时嵌入共享服务和前沿 AI 工作流。最先落地的两个业务臂是会计领域的 Current 和 IT 服务领域的
    Shield；公开证据已经能支撑真实运营规模：Current 于 2026 年 6 月正式披露年收入超过 $500 million，Shield 则披露 2025 年年收入超过 $100 million、客户超过 1,500
