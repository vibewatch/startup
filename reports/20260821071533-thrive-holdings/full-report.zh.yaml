      - number: '2.3'
        title: 托管 IT 服务需求与外包逻辑
        blocks:
          - type: paragraph
            body: >-
              托管 IT 服务给出的是另一种互补需求曲线。这个品类受 CPA 特定牌照规则的牵制更少，却被网络风险、云蔓延、终端复杂度、合规需求，以及 SMB 买家无法内部配置 24/7 专家能力共同拉动。NMS 和
              Sagiss 对品类的定义很宽——托管基础设施、网络、终端、云、安全、备份、灾难恢复和服务台——同时提醒，市场估计会随是否纳入更广义外包品类而变化。即便范围有差异，外部边界显然很大：Sagiss 引用 2026
              年 $424 billion 的市场估计，MSP Global 则引用从 2023 年 $278 billion 增至 2028 年 $532 billion 的路径。买家层面的采用也已主流化。Sagiss
              称，76% 的 SMEs 已经至少在部分 IT 职能上使用 MSP，57% 的 IT 团队表示 MSP 合作提高了有效性。Shield 2026 年 2 月的披露说明这为什么对 Thrive
              重要：一个平台在后续扩张报道前，已经实现超过 $100 million 收入，服务 1,500 多家客户，并与 9 家公司合作。更难的问题不是有没有需求，而是随着
              AI、网络安全和商品化压力重塑品类，多少利润池还能保持差异化。
