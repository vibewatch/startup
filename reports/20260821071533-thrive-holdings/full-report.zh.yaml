  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与变现机制
        blocks:
          - type: paragraph
            body: >-
              Thrive 的公开收入模式更像所有者兼运营者的服务平台，而不是典型软件公司。官方材料反复说，公司拥有并运营会计和 IT 服务企业，然后把 AI
              和共享运营工具嵌入这些工作流。这意味着主要收入流仍是服务合同——税务、会计、咨询、托管 IT、云、网络安全，以及相关经常性客户工作——而不是独立 SaaS 订阅。AI
              层重要，因为它可能提高吞吐量、创造更高价值的咨询时间、改善工单解决，并标准化后台执行；但本次纳入的公开来源没有证明 Thrive 把这些内部产品作为独立软件线销售。因此，公开定价很稀疏。与
              Pilot、QuickBooks 等替代品不同，Thrive 的变现似乎嵌在事务所层面的合同、收购经济性和共享服务捕获里。如果 AI
              能在不按比例增加人头的情况下扩大产能，这会带来上行；但这也意味着，投资者无法通过公布价目表判断已实现定价或贡献利润率。
