  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              最清晰的估值结论是：Thrive 有看点，但价格昂贵。已宣布的 $12 billion 估值并非明显不理性，因为公开证据如今支持有意义的经营规模、真实的产品采用，以及比粗略估算更强的收入基础。Current 在
              2026 年 6 月的更名公告称，其年收入已超过 $500 million，拥有近 30 家事务所和 2,000 多名员工；Shield 后来披露 2025 年年收入超过 $100 million、客户超过
              1,500 家。这意味着市场并不是把 Thrive 当作还没有收入的 AI
              梦想来估值。但市场仍要求投资者相对上市专业服务可比公司支付很高溢价，同时只给出有限的公开披露，尤其是利润率、流失、客户集中度和股权结构。因此正确姿态应是有条件的：把公司留在可投资名单里，但要求私人材料证明收入分母足够高、经济性足够耐久，足以支撑一个公开市场很少给予人工密集型服务企业的倍数。用投委会语言，这是跟踪
              / 尽调前置的判断，不是高确信度“按表面估值买这一轮”。
            claimRefs:
              - CV001
