        title: 信任、安全性、安全防护与技术缺口
        blocks:
          - type: paragraph
            body: >-
              公开信任信号方向为正，但仍不完整。本次纳入的来源反复强调，Thrive 的系统由专家参与构建，自治程度逐步提高，模糊工作仍交给人。Shield 领导层强调护栏、上下文和分阶段建立信任；Thrive
              的建成环境表述也明确说，AI 不会取代现场工作或专业签字。这些产品直觉是健康的。但它们不能替代技术尽调。公开来源没有提供足够细节，说明 TaxAI、Sentinel、Spectre 或 Forge
              的审计轨迹、数据隔离规则、模型回退、隐私控制、回滚流程、事故历史或认证范围。即便 OpenAI Codex 这类赋能工具的信任证据，主要说明的也是 OpenAI 自己的安全执行设计，而不是 Thrive
