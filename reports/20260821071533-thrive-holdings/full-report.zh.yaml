      - number: '8.2'
        title: 收入分母与倍数测算
        blocks:
          - type: paragraph
            body: >-
              估值争议大多落在：应相信哪个收入分母。用户给出的启发式假设——50 家会计事务所各约 $5 million，加上 20 家 MSP 各约 $10 million——意味着约 $450 million
              收入，按已宣布估值计算隐含倍数接近 26.7x。不过公开证据指向更高的底部。Current 官方更名公告披露，2026 年 6 月平台还称自己接近 30 家事务所时，年收入已超过 $500
              million。两个月后，TechCrunch 描述 Current 已有 50 多家事务所、2,000 多名专业人员，这说明 6 月收入快照相对 8 月平台足迹很可能已经滞后。Shield 另行披露 2025
              年年收入超过 $100 million。即便不给后续 Current 扩张或新宣布的第三平台任何价值，公开下限已经高于 $600 million。按 $600 million 计，已宣布估值约等于 20x
              收入；按 $750 million 计，则降至约 16x。这些倍数仍然很高，但比启发式情形温和得多，也解释了为什么这一轮能完成，而不至于明显脱离经营现实。
