  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与所有权模式
        blocks:
          - type: paragraph
            body: >-
              Thrive Holdings 官方材料始终把公司定义为纽约控股公司：它收购、拥有并运营关键行业里的成熟服务企业，而不是从外部卖软件。最强的官方表述来自发布文章、关于页面和 “Long Humans”
              文章：结构上是永久资本，时间尺度是长期持有甚至“永久持有”，偏好控制权或多数股权，同时保留本地经营者和品牌。独立报道进一步把这个模式和 Berkshire
              式永久持有相比，而不是标准私募股权的短期翻转。这一区分会影响后续每一章尽调：价值主张不只是 AI
              工具，而是把被收购企业内部的工作流、数据、从业者激励和变革管理过程一并握在手里。公开资料也一致指向最初的行业重心——会计和 IT 服务；官方叙事认为这些行业规模大、碎片化、依赖信任，且充满可围绕 AI
              重构的重复运营工作。
