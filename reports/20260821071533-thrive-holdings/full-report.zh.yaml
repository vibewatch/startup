      - number: '1.2'
        title: 平台、产品与运营规模
        blocks:
          - type: paragraph
            body: >-
              到 2026 年 8 月，Thrive 披露的运营数据已经足以证明，这个模式远不止概念稿。官方融资公告称，公司拥有并运营 70 多家企业，已经服务数万客户。独立报道把这些资产归入两个垂直平台：会计领域的
              Current 和 IT 服务领域的 Shield。公开材料中 Current 规模更大，截至 2026 年 8 月已收购 50 多家会计事务所、拥有 2,000 多名专业人员；更早围绕 Crete 和 Tax
              AI 推出的组合报道，则展示了 Thrive 如何先在真实工作流里测试产品，再全国扩展。Shield 提供了第二个验证点：Shield 与同步报道的媒体在 2026 年 2 月的公告称，平台 2025
              年年收入已超过 $100 million，与 9 家 IT 服务公司合作，客户超过 1,500 家；后续报道又把平台推向约 20 家公司。由此形成的公开运营图景在财务上仍不完整，但已经明显强过“零收入 AI
              套壳”的叙事。
