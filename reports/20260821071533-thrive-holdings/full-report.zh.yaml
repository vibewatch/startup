  - id: TV004
    title: 可比估值表
    notes: 这是一个精选可比集，结合了直接私有类比对象和公开估值锚点；不是穷尽式行业筛选。
    enumerationScope:
      coverage: sample
      basis: >-
        Selected to span direct platform analogs (Current, Shield, Ntiva), public valuation anchors (CBIZ, Huron), and
        incumbent accounting scale (RSM). Public market values and private platform disclosures are not perfectly
        comparable.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Current
        - 官方 June 2026 收入和员工数快照
        - 私有；年收入 >$500M，近 30 家公司，2,000+ 名员工
        - Thrive 内部直接的会计业务线类比
        - 该收入点早于后来 50+ 家公司的披露，且没有独立估值标记
      - - Shield
        - 官方 2025 收入和 2026 客户覆盖
        - 私有；2025 年收入 >$100M，1.5k+ 客户，9 家合作伙伴
        - Thrive 内部直接的 IT 服务业务线类比
        - 无独立估值、利润率或合同质量披露
      - - CBIZ
        - 公开市值 / TTM 收入
        - ~1.1x 收入（约 $2.98B 市值 / $2.76B TTM 收入）
        - 具有 ASA / 独立性敞口的上市专业服务可比公司
        - 成熟、上市、低增长公司；并未以 AI 原生 roll-up 对外营销
      - - Huron Consulting
        - 公开市值 / TTM 收入
        - ~1.5x 收入（约 $2.58B 市值 / $1.74B TTM 收入）
        - 上市科技赋能咨询 / 专业服务可比公司
        - 不是会计 APS 结构，也不是直接 MSP roll-up
      - - RSM 跨大西洋合伙
        - FY2026 收入规模
        - $5.0B 收入，无公开市值
        - 现有会计行业规模参照
        - 汇总多个独立法律实体，不能提供直接估值锚点
      - - Ntiva / PSP
        - 战略性 roll-up 状态
        - 私有；收购驱动的 MSP 整合平台，没有公开估值或收入标记
        - Shield 式逻辑的私有 MSP 平台类比
        - 估值不透明限制了其直接倍数基准价值
    claimRefs:
      - CV004
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV039
  - id: TV005
    title: 投资逻辑失效与叫停触发因素表
    notes: 选择这些触发因素，是因为它们会迫使溢价倍数叙事快速重置。
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入分母不及预期
        - 非公开运行率数据接近或低于较低启发式情景
        - 溢价倍数看起来比当前叙事暗示的极端得多
        - 将估值工作重置到悲观情景区间，并把本轮视为满价
      - - 监管 / 独立性摩擦升级
        - 重要标的或客户与 APS / 投资者关系在结构上不兼容
        - roll-up 跑道和交叉销售经济性收缩
        - 应用更大折价，并在推进前要求更严密的法律备忘录
      - - 合伙人领导层或客户留存转弱
        - 早期队列在上线后出现较高运营者流失或客户流失
        - 本地信任复利逻辑失效
        - 将 Thrive 重新定义为成本沉重的整合项目，而不是耐久平台
      - - AI 经济性未能转化为定价权
        - 生产率提升没有体现在利润率、增购或客户结果中
        - AI 溢价向服务业可比公司估值逻辑坍缩
        - 将倍数假设压向上市可比公司区间
      - - 股权结构表 / 稀释意外
        - 优先权悬挂或治理条款显著削减普通股上行
        - 本轮公开口径不再反映真实投资者经济性
        - 在瀑布分析后重新计算回报区间
    claimRefs:
      - CV023
      - CV025
      - CV026
      - CV038
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调要求表
    notes: 这是把叙事丰富的机会转成可投资承销文件所需的最低材料包。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合并收入桥
        - 按业务线、收购队列和备考贡献拆分的 2024-2026 月度与季度收入
        - 决定每个倍数和情景的分母
        - CFO / 财务尽调包
      - - 利润率质量
        - 按业务线拆分的毛利率、贡献利润率、EBITDA 和现金转换
        - 决定 Thrive 应获得服务增强型还是软件式估值待遇
        - 财务 + Controller 审查
      - - 留存与集中度
        - 客户留存、头部客户敞口、合伙人领导层留存，以及 SLA / 质量指标
        - 证明本地信任能否扛住平台标准化
        - RevOps + 运营尽调
      - - 监管结构
        - 各州 APS / ASA / 许可地图，加独立性备忘录
        - 说明会计业务线能否在没有隐藏摩擦的情况下合法扩展
        - 外部法律顾问 + 内部合规
      - - 股权结构表和优先权
        - 完全稀释后所有权、优先权、附函、治理权利和瀑布
        - 将公开口径估值转化为实际预期投资者回报
        - 法律 + 财务尽调
    claimRefs:
      - CV022
      - CV023
      - CV032
      - CV040
      - CV041
