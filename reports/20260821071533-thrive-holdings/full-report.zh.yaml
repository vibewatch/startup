  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              理解 Thrive 的竞争格局，最好把它看成四类相互重叠的买家替代方案，而不是一串风投支持的同行名单。第一类是收购驱动的会计平台，例如 Current
              本身，以及其他整合者或联盟，它们承诺在保留本地品牌的同时提供共享服务和技术。第二类是 Aprio、CBIZ、EisnerAmper
              等规模化既有玩家；它们已经销售咨询广度、技术服务、外包和品牌信任，不需要客户或从业者下注新的控股公司结构。第三类，Shield 与全国性托管服务提供商竞争，包括
              Ntiva、Dataprise、NexusTek、Corsica 和 Thrive NextGen；这些公司把网络安全、云、支持和合规打包成持续服务合同。第四类是 Pilot 和 QuickBooks
              等软件主导的替代品，让较小买家无需出售公司或采用完整收购平台，也能现代化记账和财务运营。这一点重要，因为 Thrive
              同时在争夺终端客户、收购标的和从业者忠诚。竞争对手不必复制整个控股公司模式就能拖慢增长；只要让现状、内部自建或更便宜的软件加服务方案显得足够好即可。
