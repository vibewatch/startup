  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与独立性风险
        blocks:
          - type: paragraph
            body: >-
              Thrive 的会计侧带有最具结构特征的风险，因为 CPA 事务所所有权、鉴证独立性和积极参与规则不是可选设计。NASBA 2025 年白皮书称，多数州仍要求事务所由 CPA
              持有多数股权，并要求无证所有者积极参与；还有两个司法辖区要求 100% CPA 持有。加州法规要求多数持牌人所有权、超过半数的股权和投票权、无证所有者实质参与，并由一名 CPA
              对每项鉴证或汇编业务承担最终责任。华盛顿州同样要求多数持牌人所有权、董事会注册，以及常住无证所有者通过伦理课程。这些规则并不禁止私人资本，但会迫使资本进入替代执业结构：鉴证工作留在 CPA
              控制实体内，非鉴证经济性则通过行政服务协议放在其他地方。这种结构引入了二阶风险：随着 AICPA 和州监管机构重新审视面向 PE 支持事务所的 APS 指引，交易完成后合规暴露面可能继续扩大。Winston
              Taylor 对 AICPA 征求意见稿的总结尤其值得注意，因为它描述了更广泛的网络事务所处理、组合公司冲突，以及对控制投资者上游实体的禁止。对 Thrive
              而言，关键问题不是这个模式能否存在；它显然可以。问题在于，全国性整合能否继续扩张，而不会因法律、品牌或客户冲突摩擦缩小可行标的池，或被迫采用昂贵绕行方案。
