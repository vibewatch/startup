      - number: '3.4'
        title: 护城河耐久性、切换成本与反向风险
        blocks:
          - type: paragraph
            body: >-
              Thrive
              战略中最耐久的部分不是单一产品功能，而是卖方获取、资本、共享运营、本地关系保留和嵌入式工作流软件的组合。一旦一家公司出售进来，并把核心流程、数据、人员配置和客户预期迁移到平台上，这套组合确实会形成切换成本。但护城河远非绝对。工具层可以多归属：会计事务所可以采用
              QuickBooks、Pilot 式工作流或专门 AI 产品，同时保持独立；MSP
              买家也可以在云和安全表述相近的规模化服务商之间重新招标支持合同。大多数私有同行在定价、实施结果和客户留存上的公开证据也不均衡，因此最清晰的公开护城河信号仍是叙事，而不是经审计的经济性。最高置信度的反向问题是：Thrive
              能否在既有玩家反应前持续赢得收购标的；AI 生产力会不会变成全行业标配；全国性会计和 MSP 品牌能否在不背负 70 多笔收购整合负担的情况下，复制足够多的体验。换句话说，Thrive
              的护城河看起来真实，但高度依赖执行；在独立事务所或标准化软件可以交付“足够好”现代化的地方，它最脆弱。
