  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: 这些区间是基于公开证据的投资测算带，不是谈判出来的交易估值。
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观情景
        - 收入质量更像高端服务而不是软件；监管和整合风险保持高位；几乎没有利润率扩张证据
        - $6B-$8B 可支撑区间，意味着已公布估值走在证据前面
        - APS 摩擦、合伙人流失、MSP 定价压缩、利润率披露薄弱
        - 如果非公开 KPI 没有实质改善，则可能发生
      - - 基准情景
        - 公开的 $600M+ 收入下限真实存在；增长仍强；AI 提高生产率并改善部分留存，但经济性尚未完全软件化
        - $9B-$12B 区间，已公布估值接近上沿
        - 执行仍好，但利润率、流失率和股权结构表的证据缺口仍在
        - 在当前公开证据下最有支撑
      - - 乐观情景
        - 收入更接近 $750M-$900M 或更高；AI 推动真实的顾问 / MSP 扩张和利润率提升；监管结构可顺畅扩展
        - $13B-$16B 区间，使本轮成为继续复利的合理入口
        - 需要异常强的留存、利润率和法律扩展证据
        - 只有非公开尽调明显强于公开披露时才可信
    claimRefs:
