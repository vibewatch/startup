        blocks:
          - type: paragraph
            body: >-
              公开业务进展证据远好于公开盈利证据。Thrive 2026 年 8 月公告称，它拥有并运营 70 多家企业，已经服务数万客户。TechCrunch、Wowtale、Ventureburn 和 ECM Source
              都把 Current 描述为会计业务臂，拥有 50 多家事务所和 2,000 多名专业人员；Shield 官方材料则称，IT 服务平台 2025 年年收入超过 $100 million，并通过 9 家合作公司服务
              1,500 多家客户。Current 的收入信号也有意义：Reuters 在 2025 年中报道称年收入超过 $300 million，后续行业报道又把平台收入放在 $500 million
              以上。这些数据点支撑一个判断：Thrive 不是收入前 AI 实验。不过，它们没有给出干净的合并控股公司收入数字，因为平台收入、控股公司收入和统计性第三方估计可能指向不同实体。IncFact 的 $10
              million 到 $100 million 收入区间，可作为外部控股公司式启发指标，但它与已披露的运营业务臂规模冲突，不应误当作合并平台收入。
