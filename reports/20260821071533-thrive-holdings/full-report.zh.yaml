      - number: '8.3'
        title: 可比公司视角与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比公司分析在这里主要是纪律工具。CBIZ 和 Huron 展示了公开市场会给已有规模、有技术赋能、具备真实收入和成熟披露的专业服务公司什么价格。2026 年 8 月，CBIZ 的市值约 $2.98
              billion，TTM 收入约 $2.76 billion，约为 1.1x 收入。Huron 市值约 $2.58 billion，TTM 收入约 $1.74 billion，约为 1.5x 收入。这些都远低于
              Thrive 的隐含区间。RSM 和 Ntiva 在战略上更相关，但数值帮助较小：RSM 的跨大西洋合伙组织报告 FY2026 收入 $5.0 billion，却没有公开市值；Ntiva 及其 PSP
              赞助方展示了与 Shield 相同的碎片化 + 收购逻辑，但既未公开估值，也未公开收入。坦率地看，Thrive 必须按混合逻辑估值：一部分是专业服务平台，一部分是 AI
              赋能的复利引擎，一部分是未来平台扩张的私人期权。这个混合逻辑可以支撑相对 CBIZ 或 Huron 的溢价，但不能让公司无限豁免倍数纪律。基于公开证据，可支撑区间最好用情景表达，而不是给一个“公允价值”点。
