    title: 投资建议摘要表
    notes: 该建议仅基于公开证据，因此更强调价格纪律，而不是押注激进承销假设。
    columns:
      - 投资建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
