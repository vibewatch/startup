- id: TI004
  title: "Capital adequacy table"
  notes: Public financing facts are current to 2026-08-21; cash, burn, runway, and debt remain undisclosed.
  columns:
  - Capital item
  - Public value / status
  - Confidence
  - Interpretation
  - Diligence ask
  rows:
  - - Latest round
    - Over $2B in August 2026
    - High
    - Fresh primary capital gives Thrive meaningful operating flexibility
    - Confirm net proceeds after fees, any secondary component, and investor rights
  - - Headline valuation
    - $12B
    - High
    - Strong signal of investor confidence, not proof of revenue quality
    - Clarify post-money vs pre-money, preference stack, and governance rights
  - - Total raised
    - More than $3B since inception
    - High
    - Indicates exceptional access to capital for continued acquisition and buildout
    - Reconcile cumulative primary proceeds by round and investor cohort
  - - Cash on hand
    - null
    - Low
    - Cannot assess runway or immediate financing pressure
    - Provide close-date cash, latest month-end cash, and restricted cash balances
  - - Monthly burn / free cash flow
    - null
    - Low
    - Essential to test whether acquisitions and AI build are self-funding or cash absorptive
    - Provide trailing twelve-month cash burn and monthly free-cash-flow bridge
  - - Debt / contingent obligations
    - null
    - Low
    - Public sources do not show holdco leverage, cloud commitments, or acquisition earnouts
    - Provide debt facilities, seller notes, earnouts, lease obligations, and committed vendor spend
  - - Planned use of new funds
    - Scale accounting and IT platforms and launch built-environment regulatory platform
    - High
    - Capital will likely be spread across M&A, engineering, and platform expansion
    - Provide use-of-proceeds schedule by arm, hiring, acquisitions, and product investment
