tables:
- id: TI001
  title: "Revenue streams table"
  notes: Revenue streams are inferred from company operations and partner disclosures; Thrive does not publicly disclose consolidated revenue mix.
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Accounting service revenue
    - Tax, bookkeeping, audit, CAS, and advisory work delivered by Current partner firms
    - Client engagement / project / recurring service contract
    - Public operating scale supported; exact consolidated mix undisclosed
    - 'Moderate: strong platform evidence, weak mix disclosure'
    - Request arm-level revenue mix by tax, audit, advisory, bookkeeping, and recurring client cohorts
  - - Managed IT revenue
    - Recurring MSP contracts, support, cloud, security, and project work delivered by Shield partners
    - Managed-service contract / monthly recurring service / project fees
    - Shield says it exceeded $100M annual revenue in 2025
    - 'Moderate: official platform figure, limited breakdown'
    - Request recurring versus project mix, gross margin, and contract duration by partner company
  - - Shared-services capture
    - Billing, collections, finance, reporting, revenue assurance, and central back-office support
    - Cost savings plus possible internal transfer economics
    - Clearly described operationally, not monetized publicly as a separate line
    - 'Low: mechanism visible, economics private'
    - Show internal chargebacks, cost savings, and post-close SG&A leverage by platform
  - - AI productivity monetization
    - Capacity creation from TaxAI, Sentinel, Spectre, and workflow automation
    - Throughput, margin lift, or advisory upsell rather than explicit software license
    - Public productivity anecdotes exist; realized financial capture is undisclosed
    - 'Low: outcome signals exist, monetization path inferred'
    - Quantify revenue per professional, tickets per engineer, and pre/post-close margin improvement
  - - Future compliance / permitting revenue
    - Third platform for regulatory work in the built environment
    - Service revenue and possibly workflow tooling
    - Newly announced growth vector with no disclosed revenue yet
    - 'Low: strategy clear, commercial evidence early'
    - Provide initial customer pipeline, pricing model, and staffing plan for the new platform
  - - Acquisition-sourced expansion
    - New firms add revenue immediately and expand the platform footprint
    - M&A consideration converted into acquired recurring revenue base
    - Core to current and shield platform growth strategy
    - 'Moderate: strategy clear, acquisition economics private'
    - Provide purchase multiples, earnouts, integration payback, and revenue-retention cohorts
