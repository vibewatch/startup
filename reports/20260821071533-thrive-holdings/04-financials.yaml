- id: TI002
  title: "Pricing / monetization table"
  notes: Public list pricing is scarce for Thrive itself; comparison rows show where substitutes publish cleaner price anchors.
  columns:
  - Price / unit / contract
  - List or observed value
  - Source status
  - Unknowns
  - Implication
  rows:
  - - Thrive / Current platform pricing
    - Unknown
    - No public list pricing retained
    - Client fee schedules, discounting, realization, service-line mix
    - Revenue quality cannot be inferred from public pages alone
  - - Shield contract pricing
    - Unknown, though contracts are described as long-term partnership arrangements
    - Official positioning only
    - Recurring minimums, project mix, SLA penalties, margin by service category
    - Sales-led contracting can hide strong unit economics or weak ones
  - - Shield ownership model
    - Shield says it typically acquires 60% to 90% of partner equity while keeping operators in place
    - Official/press summary
    - Purchase multiples, contingent consideration, hold periods
    - M&A economics matter as much as customer pricing
  - - Pilot service pricing
    - Bookkeeping from $99/month; CFO services from $1,750/month; tax packages from $1,000+/year
    - Official pricing page
    - Realized discounts, attach rates, cohort margin
    - Transparent low-end alternatives can anchor SMB willingness to pay
  - - QuickBooks ecosystem pricing
    - No full Thrive-comparable bundled price retained in this chapter
    - Official product positioning only
    - Bundled software plus expert-service realization
    - Distribution power may matter more than comparable pricing transparency
  - - CBIZ and national-advisory pricing
    - Unknown
    - Public filings and pages describe service mix, not client rate cards
    - Hourly, fixed-fee, retainer, audit independence, and technology-service pricing
    - Larger incumbents preserve pricing opacity while still competing on breadth
