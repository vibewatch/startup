- id: TI005
  title: "Public financial gaps table"
  notes: This table separates what public sources show from what an investor still needs to underwrite valuation and margin durability.
  columns:
  - Missing private metric
  - Public proxy available
  - Impact
  - Exact diligence path
  rows:
  - - Consolidated revenue mix
    - Current and Shield operating metrics plus holdco fundraising
    - Cannot judge recurring quality or segment concentration
    - Management revenue bridge by service line, arm, geography, and client concentration
  - - Gross margin and contribution margin
    - AI productivity anecdotes and comp cost categories
    - Cannot tell whether automation translates into real profit
    - Gross-margin waterfall by arm including labor, cloud/model, support, and shared-services costs
  - - Cash balance, burn, and runway
    - Very large recent financing round
    - Cannot assess next-round dependency or downside protection
    - Monthly cash-flow statement and runway plan with stress scenarios
  - - Acquisition economics
    - Public evidence of rapid M&A and partner retention
    - Purchase multiples and payback are unknown
    - Deal-level cohort analysis, earnouts, and integration cost by acquired company
  - - Retention and revenue quality
    - Tens of thousands of customers and 1,500+ Shield customers are public
    - Logo count does not replace GRR, NRR, churn, or concentration data
    - Contract-level renewal, churn, expansion, and top-customer exposure analysis
  - - AI build cost and monetization capture
    - TaxAI, Sentinel, Spectre, and embedded engineering are visible publicly
    - No proof yet of direct margin capture or software monetization
    - Quantify engineering spend, model/vendor costs, and realized margin uplift from AI products
