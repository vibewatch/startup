    - Likely dominant expense category
    - Medium
    - Services consolidators often live or die by utilization, salaries, and retention
    - Show compensation as % of revenue by arm and by central platform functions
  - - Working-capital volatility
    - Material but undisclosed
    - Medium
    - Receivables, payroll timing, contingent consideration, and seasonal tax cycles can strain cash
    - Provide monthly AR aging, payroll cycle exposure, and contingent-payment schedule
