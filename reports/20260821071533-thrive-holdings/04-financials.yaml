- id: capital-adequacy-financing-dependency-and-verdict
  title: "Capital Adequacy, Financing Dependency, and Financial Verdict"
  body: >-
    Thrive’s financing position is simultaneously impressive and under-disclosed. The company raised more than $2 billion at
    a $12 billion valuation in August 2026 and says total capital raised now exceeds $3 billion. That gives it real flexibility
    to keep acquiring firms, deepen the engineering build, and launch a third platform in regulatory and permitting work for
    the built environment. Yet headline funding does not answer capital adequacy. No retained source disclosed cash on hand,
    monthly burn, debt facilities, preferred terms, acquisition earnout obligations, or a runway plan. Services consolidators
    can absorb large amounts of cash into integration, working capital, contingent consideration, and platform overhead before
    AI productivity shows up in free cash flow. The financial verdict is therefore constructive on scale and fresh capital,
    but still blocked on underwriting. The next step is not another narrative round-up of the fundraise; it is a monthly bridge
    tying arm-level revenue, gross margin, working capital, AI build costs, and acquisition obligations into a cash-use plan.
  claimRefs:
  - CI014
  - CI015
  - CI020
  - CI031
  - CI033
