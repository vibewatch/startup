    "number": 6,
    "title": "Customers",
    "summary": "Thrive\u2019s customer picture is two-layered. Its direct buyers are partner firms that sell into the platform for capital, workflow tooling, and operating support; its downstream users are SMBs and regulated midmarket clients served by those accounting and MSP firms. Public evidence supports meaningful breadth\u2014Current spans 50-plus accounting firms and 2,000-plus professionals, while Shield says its platform serves more than 1,500 customers across partner MSPs. But customer-quality disclosure is still uneven: named proof exists through partner case studies, vertical pages, and testimonials, while retention, concentration, and contract-duration data remain largely private."
  },
  "sections": [
    {
      "id": "customer-base-and-segmentation",
      "title": "Customer Base and Segmentation",
      "body": "Thrive serves customers through a layered service-platform model rather than a single direct SaaS funnel. At the first layer are the firms that join Current or Shield and effectively buy capital, operating support, and embedded technology while preserving local brands. At the second layer are the downstream end customers those firms already serve: individuals, SMBs, nonprofits, healthcare groups, legal practices, energy companies, financial-services clients, real-estate operators, and other organizations that outsource accounting or IT work. Public sources support especially broad vertical exposure on the MSP side. Shield partner pages describe customers in healthcare, legal, construction, energy, financial services, manufacturing, nonprofits, real estate, architecture, hospitality, and professional services. On the accounting side, Thrive\u2019s own materials stress the value of local trust and advisory continuity, which implies that the client relationship remains local even as the operating platform becomes national. This customer map matters because Thrive is not only acquiring revenue streams; it is inheriting trust-heavy relationships whose durability depends on preserving service quality during workflow change.",
