    {
      "id": "durability-retention-and-satisfaction-signals",
      "title": "Durability, Retention, and Satisfaction Signals",
      "body": "Retention and customer durability are where public disclosure gets much thinner. No retained source disclosed GRR, NRR, churn, renewal rates, or average contract length for either Current or Shield. Instead, the public record offers weaker but still useful durability proxies. BoxIT says one customer has worked with the firm for nearly 20 years. Exigent says many customers have worked with it for over a decade, including its very first customer. NetAscendant\u2019s testimonials reference multi-year daily engagement, and Christo IT advertises more than 99% customer satisfaction. These are not substitutes for hard cohort data, but they do suggest that at least some partner companies operate in sticky, relationship-driven segments where trust and continuity matter. That is directionally positive for Thrive because long-tenured local relationships are exactly the kind of asset the platform is trying to preserve and modernize. The adverse read is that the most important durability data remain private; without centralized churn, concentration, or cohort tracking, investors cannot tell whether customer trust survives once platform-wide AI and operating changes scale beyond early success stories.",
