    {
      "id": "expansion-and-concentration-risks",
      "title": "Expansion and Concentration Risks",
      "body": "The main customer upside is land-and-expand across both layers of the model. Thrive can add more partner firms, deepen workflow adoption inside each firm, and help those firms sell more services to existing downstream clients. Public evidence already shows that dynamic in miniature: TaxAI appears to free accountants for more advisory work and new-client capacity, while Shield says product deployments open room for more consultative technician work. But concentration and procurement risks remain meaningful. Several MSP partner pages focus on regulated or verticalized customer groups such as healthcare, finance, legal, energy, and nonprofit organizations, which can make sales sticky but also expose the platform to vertical shocks or localized churn. In addition, public sources still do not disclose top-customer concentration, geographic concentration, or customer overlap across partner companies. That means the investable customer conclusion is constructive but incomplete: Thrive clearly has real customer reach and named proof of production usage, yet the platform still needs centralized retention and concentration reporting before customer quality can be underwritten with confidence.",
