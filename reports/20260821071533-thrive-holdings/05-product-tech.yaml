- id: TE002
  title: "Workflow / use-case table"
  notes: Benefits are public workflow claims or directional effects, not audited customer case-study ROI across the full platform.
  columns:
  - User job
  - Current workflow
  - Thrive solution
  - Measurable benefit
  - Limitation
  rows:
  - - Prepare complex tax returns
    - Manual prep, review, and iterative correction
    - TaxAI with Codex-driven self-improving loop
    - 7,000+ returns processed; 98% accuracy; 30%+ prep-time reduction
    - Need detail on exception handling and reviewer override
  - - Route and triage MSP tickets
    - Human assignment and prioritization queues
    - Sentinel triage and context routing
    - Handles categories that represent 60%+ of ticket volume
    - Need precision/recall and customer-impact metrics
  - - Resolve repetitive MSP tickets
    - Engineer-led repetitive tasks
    - Spectre and Forge autonomy / automation workflows
    - Median time-to-resolution cut by over half for several tasks
    - Need incident and rollback evidence
  - - Onboard or offboard users
    - Multi-step coordination across systems and people
    - Forge-managed workflows with staged autonomy
    - Faster execution and more technician time for higher-value work
    - Need cross-system integration map
  - - Improve billing and reconciliation
    - Manual month-end and collections tasks
    - Shield workflow automation with operations teams
    - Roughly 80% of IronOrbit invoices now flow straight through
    - Need replicability beyond one partner case
