- id: TE003
  title: "Technology / operating architecture table"
  notes: Architecture is reconstructed from public descriptions of forward-deployed engineering and live workflow deployment.
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Frontier-model layer
    - Provides core generative capability and agent tooling
    - OpenAI partnership and Codex-linked tooling
    - Partner concentration and model-policy dependence
  - - Embedded engineering layer
    - Maps workflows, builds integrations, and iterates products inside firms
    - Thrive / Shield engineering talent and operator access
    - Execution bottlenecks if deployment talent is scarce
  - - Partner workflow data layer
    - Supplies context, tacit knowledge, and ticket / tax patterns
    - Access to live business processes and firm-specific systems
    - Data quality, privacy, and tenancy complexity
  - - Human review and escalation layer
    - Keeps experts in the loop for ambiguous or higher-risk work
    - Technician, operator, or practitioner trust
    - Human workload can remain high if automation underperforms
  - - Portfolio-learning layer
    - Turns one deployment into faster future deployments
    - Cross-company pattern extraction without losing local nuance
    - Over-generalization or weak transfer between firms and verticals
