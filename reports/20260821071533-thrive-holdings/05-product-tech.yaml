- id: TE004
  title: "Trust / quality / compliance table"
  notes: This chapter found more public narrative on trust-building than on formal controls.
  columns:
  - Control / metric
  - Status
  - Scope
  - Gap
  rows:
  - - Human sign-off
    - Explicitly retained in public narratives
    - Tax, MSP, and built-environment workflows
    - Need exact approval thresholds and override logs
  - - Gradual autonomy
    - Explicitly described for Forge deployments
    - MSP ticket and workflow automation
    - Need maturity stages and rollback criteria
  - - Secure execution / logs
    - Publicly described for OpenAI Codex, not fully for Thrive implementation
    - Enabling development tooling
    - Need Thrive-specific audit trails and environment controls
  - - Data privacy and segmentation
    - Not clearly disclosed
    - Customer, partner, and workflow data
    - Need data-boundary, retention, and access-control documentation
  - - Certifications / control reports
    - Not clearly disclosed at Thrive or Shield product level in retained sources
    - Product, platform, and service delivery
    - Need SOC 2, privacy, security, or equivalent control evidence
