  title: "Product module / asset matrix"
  notes: Module status is based on retained public evidence, not a private product roadmap audit.
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - TaxAI
    - Current accountants and reviewers
    - Live in production with measured return volume and accuracy claims
    - Built alongside practitioners; self-improving loop tied to production failures
    - Need auditability, override rules, and economics by workflow
  - - Sentinel
    - MSP support engineers
    - Live on Shield platform
    - Triages repetitive tickets at scale inside partner workflows
    - Need false-positive, escalation, and SLA data
  - - Spectre
    - MSP engineers and operators
    - Live on Shield platform
    - Orchestrates agents that resolve specific ticket categories on engineers’ behalf
    - Need reliability, rollback, and scope-boundary evidence
  - - Forge
    - Shield partner MSPs
    - Live and expanding across partner companies
    - AI operating system that learns across deployments and supports majority-ticket handling
    - Need architecture detail, tenancy model, and security documentation
  - - Built-environment regulatory platform
    - Permitting, inspection, compliance, and infrastructure operators
    - Newly announced / early
    - Applies the same embedded-workflow model to regulatory bottlenecks
    - Need concrete modules, launch customers, and roadmap milestones
