  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A board list, committee map, or governance memo explaining voting control and oversight structure.
    whyItMatters: A $12 billion private platform with sparse governance disclosure is hard to underwrite for control, succession, and investor-rights risk.
    diligencePath: Request an org chart, board observer list, and shareholder-rights summary from management or lead investors.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Consolidated revenue, ARR, gross margin, cash-flow, and leverage data for Thrive Holdings itself.
    whyItMatters: Headline valuation and capital raised are public, but underwriting requires economics and unit-level performance, not just operating anecdotes.
    diligencePath: Obtain holdco financials, platform-level P&Ls, and lender or board materials covering profitability and cash conversion.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: minor
    topic: openai-partnership
    missingEvidence: Stake size, milestone ratchets, service-pricing terms, and exclusivity conditions in the OpenAI agreement.
    whyItMatters: The strategic partnership appears central to the model, and economics matter for dilution, incentives, and dependency risk.
    diligencePath: Review the governing commercial agreement and cap-table notes for the OpenAI transaction.
