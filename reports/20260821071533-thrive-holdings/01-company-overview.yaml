- id: leadership-capital-and-governance
  title: Leadership, Capital, and Governance
  body: Capital formation is one of the clearest parts of the Thrive story. Official Thrive and Kirkland disclosures, plus independent reporting, align on an August 2026 financing of more than $2 billion
    at a $12 billion valuation from D1 Capital Partners, Altimeter Capital, and SoftBank Group, taking total capital raised since inception above $3 billion. The prior strategic inflection was December
    2025, when OpenAI announced that it was taking an ownership stake and embedding research, product, and engineering teams inside Thrive portfolio companies. Public leadership disclosure is thinner than
    capital disclosure. Official OpenAI and CNBC materials explicitly quote Joshua Kushner as CEO and founder of Thrive Capital and Thrive Holdings, while TechCrunch and later Shield materials identify
    Anuj Mehndiratta and Kareem Zaki as members of the founding team. Seedtable lists Joshua Kushner plus Mehndiratta and Zaki as the visible executive nucleus. What the public record does not provide is
    a full board map, voting-control explanation, or detailed governance architecture. That asymmetry is important because the company is already capitalized like a mega-round private platform, yet still
    discloses leadership more like a recently launched special-purpose vehicle.
  claimRefs:
