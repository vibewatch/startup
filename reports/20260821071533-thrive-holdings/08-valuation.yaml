    {
      "id": "why-the-mark-is-demanding",
      "title": "Why the Mark Is Still Demanding",
      "body": "Even if one accepts a premium revenue multiple, the current mark still asks investors to look through several unresolved variables. Public sources do not disclose consolidated EBITDA, arm-level gross margin, free-cash-flow conversion, cap-table preferences, or a dilution waterfall following the round. The accounting arm also carries APS, independence, and multi-state licensing complexity that makes revenue quality more conditional than a simple headline number suggests. Meanwhile, Shield\u2019s own leadership says AI bundling and outcome-based pricing are changing MSP economics, which means part of today\u2019s valuation is underwriting a business-model transition as well as a roll-up. These uncertainties matter because public markets usually compress professional-services multiples when margin structure, integration durability, or regulatory flexibility are unclear. Thrive\u2019s elite backers and product proof justify some premium, but they do not remove the need for a valuation discount relative to pure software or infrastructure-AI stories. Said differently: the company-quality argument is strong enough to keep Thrive on the list, but the price-quality argument is not yet strong enough to erase the risk discount investors should demand.",
