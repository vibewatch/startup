    {
      "id": "comparable-lens-and-scenario-range",
      "title": "Comparable Lens and Scenario Range",
      "body": "Comparable analysis is useful here mainly as a discipline tool. CBIZ and Huron show what public markets pay for scaled, tech-enabled professional-services businesses with real revenue and mature reporting. In August 2026, CBIZ sat around $2.98 billion of market cap on about $2.76 billion of TTM revenue\u2014roughly 1.1x revenue. Huron sat around $2.58 billion on about $1.74 billion of TTM revenue\u2014roughly 1.5x revenue. Those are nowhere near Thrive\u2019s implied band. RSM and Ntiva are more strategically relevant but less helpful numerically: RSM\u2019s transatlantic partnership reports $5.0 billion of FY2026 revenue yet offers no public market cap, while Ntiva and its PSP sponsor illustrate the same fragmentation-and-acquisition logic as Shield but disclose neither valuation nor revenue publicly. The honest reading is that Thrive must be valued on a hybrid logic: partly as a professional-services platform, partly as an AI-enabled compounding engine, and partly as a private option on future platform expansion. That hybrid logic can justify a premium to CBIZ or Huron, but it does not grant an unlimited exception from comp discipline. On public evidence, the supportable range is best expressed as scenarios rather than a single \u201cfair value\u201d point.",
