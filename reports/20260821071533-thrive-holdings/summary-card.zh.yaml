    - Thrive 要在一大组关系驱动的服务公司中统一工具和流程，整合风险与本地经营者留存风险仍高。
    - 在合并利润率、留存和股权经济性未公开前，$12B 估值仍意味着相对上市专业服务可比公司的大幅溢价。
  unresolvedGaps:
