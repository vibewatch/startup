  topStrengths:
    - 公开证据已支撑两大核心业务的真实规模，包括 Current 年收入超过 $500M、Shield 年收入超过 $100M。
    - Thrive 看起来有真实工作流级 AI 证据，而不只是演示材料：会计场景已有 Tax AI 采用，Shield 也有在线 AI 工单产品。
    - 顶级资本支持和 OpenAI 伙伴关系降低融资风险，也给服务平台形态的 Thrive 带来少见战略杠杆。
  topRisks:
