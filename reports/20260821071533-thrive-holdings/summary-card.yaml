  topStrengths:
    - >-
      Public evidence now supports real scale across both core arms, including Current at more than $500M annual revenue
      and Shield at more than $100M of annual revenue.
    - >-
      Thrive appears to have genuine workflow-level AI proof rather than slideware, with public evidence of Tax AI
      adoption in accounting and live AI ticket products in Shield.
    - >-
      Elite capital support and the OpenAI partnership reduce financing risk and give Thrive unusual strategic leverage
      for a services platform.
  topRisks:
    - >-
      The accounting arm faces real APS, independence, and multi-state licensing complexity that can narrow target
      eligibility or create client conflicts as the platform scales.
    - >-
      Integration and local-operator retention risk remain high because Thrive is standardizing tools and processes
      across a large portfolio of relationship-driven service firms.
    - >-
      The $12B mark still implies a very large premium to public professional-services comps without public disclosure
      on consolidated margin, retention, or cap-table economics.
  unresolvedGaps:
    - >-
      A full consolidated 2024-2026 revenue bridge with arm-level gross margin, EBITDA, and cash-conversion metrics is
      not public.
    - >-
      Customer retention, client concentration, partner-leader retention, and post-acquisition cohort data remain the
      primary blockers to underwriting revenue quality.
    - The post-round cap table, preference stack, and state-by-state APS / ASA structure are not publicly disclosed.
