  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Service Definition and Product Stack
        blocks:
          - type: paragraph
            body: >-
              Neo presents itself as a knowledge-led, technology-powered wealth and asset management platform for family
              offices, institutions, corporates, and ultra-high-net-worth or high-net-worth clients. Public materials
              show that the customer proposition is intentionally split across multiple regulated entities rather than
              marketed as a single omnibus product. Neo Wealth Partners handles advisory and distribution; Neo Wealth
              Management exposes execution surfaces such as broking, depository participation, and investment advisory;
              Neo Alternative Asset Managers houses PMS plus Cat II, Cat III, and GIFT City alternatives; and NeoFinity
              is positioned as a separate fintech and payments arm. This matters because Neo's service definition is
              workflow-centric: advise, distribute, execute, manufacture alternatives, and then keep the client inside
              the same brand family. The group also frames family-office work as infrastructure-heavy and institutional
              in nature, not just portfolio construction. That breadth is a real commercial differentiator, but it also
              means diligence must track which legal entity owns each activity, complaint channel, and regulatory
              perimeter before assuming a seamless product experience.
