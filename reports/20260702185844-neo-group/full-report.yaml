  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and regulatory shells
        blocks:
          - type: paragraph
            body: >-
              The right market for Neo is not “Indian savings” and not even the entire retail investment market. The
              practical boundary is organized private wealth for HNI, UHNI and family-office clients: fee-bearing
              advice, portfolio construction, product distribution, alternatives access, estate and succession work, and
              other high-touch services wrapped through registrations such as investment adviser, portfolio manager and
              alternative-investment-fund structures. Public company pages from 360 ONE, Nuvama, Motilal Oswal, Julius
              Baer and DBS also show that the commercial job goes well beyond security selection. Buyers often expect
              treasury support, philanthropy, lending, cross-border access or family governance help. That breadth
              matters because it explains why Neo can look like a wealthtech, a private-bank substitute and a
              family-office enabler at the same time. It also explains what should be excluded from market sizing:
              self-directed deposits, mass-retail broking, and other savings pools that do not yet pay for organized
              advice.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
