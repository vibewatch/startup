        title: Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Neo Group is a fast-growing, multi-entity Indian wealth and asset-management platform operating under at
              least six distinct SEBI- and IFSCA-regulated legal entities, spanning investment advisory, portfolio
              management, stock broking, Category III AIF, a GIFT City IFSC fund-management branch, and a
              fintech/payments arm. This chapter ranks risk severity across five domains — regulatory/legal,
              operational/quality/security, partner/dependency, people/execution, and financial/model — and finds three
              risks warrant the closest monitoring: a documented May 2025 IFSCA enforcement warning against Neo Asset
              Management's IFSC branch whose full legal basis remains unverified; a complete absence of any public
              group-level revenue, EBITDA, or cash-burn disclosure despite a March 2026 unicorn-level (₹10,000 crore
              pre-money) valuation from TVS Capital; and a capital-funded senior-banker hiring spree that both drives
              growth and exposes Neo to poaching by competitors using the same partnership-style pay tactics.
              Lower-severity but still material risks include inconsistent third-party AUM data across public
              aggregators and unresolved founder/executive succession planning. The risk heatmap (Figure FR001)
              positions these items by qualitative likelihood and severity for investment-committee review.
