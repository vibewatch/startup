  - id: TV005
    title: Thesis Break And Kill Triggers Table
    columns:
      - Trigger
      - Description
      - Signal To Watch
    rows:
      - - Regulatory escalation
        - >-
          The May 2025 IFSCA warning to Neo Asset Management's IFSC branch converts into a formal enforcement action or
          licence restriction.
        - IFSCA or SEBI enforcement orders naming Neo Group entities.
      - - Revenue disclosure failure
        - >-
          Neo continues withholding FY24-FY26 revenue/profit data through a subsequent raise, filing threshold, or
          listing process.
        - Absence of audited financials in future funding-round press coverage or regulatory filings.
      - - Down round
        - >-
          The next financing event prices below the Rs 10,000 crore pre-money mark implied by the March 2026 TVS Capital
          round.
        - Reported pre-money valuation in the next disclosed funding announcement.
      - - Advisor attrition
        - >-
          Senior wealth advisors exit to Kotak, Motilal Oswal, 360 ONE, Julius Baer, or DBS amid intensified
          private-banking hiring competition.
        - Public reporting of senior-hire departures or Citywire-style hiring-spree coverage naming Neo Group.
      - - AUM/ARR AUM growth stalls
        - >-
          Client-asset or ARR AUM growth decelerates materially below the sector's roughly 18% CAGR trajectory Bernstein
          projects.
        - Growth rates disclosed in subsequent funding announcements or press coverage.
      - - PMS data integrity
        - Persistent, unreconciled discrepancies continue across third-party PMS AUM reporting for Neo Asset Management.
        - >-
          Convergence (or continued divergence) of ipoplatform.com, hniportfolio.com, and Business Today PMS AUM
          figures.
