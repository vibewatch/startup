      - number: '2.5'
        title: What public evidence still cannot isolate
        blocks:
          - type: paragraph
            body: >-
              The main diligence risk is false precision. Public sources show a wealthy and formalizing market, but they
              do not isolate Neo’s true SOM. There is no clean public census of Indian family offices, no reliable
              public split between advice-only, PMS, AIF and broader family-office fee pools, and no public conversion
              curve from emerging affluent investors into paying private-wealth clients. Even the best numbers mix
              fundamentally different lenses: HNWI headcount, UHNW city concentration, liquid-financial wealth,
              managed-investment stock and total household financial assets. Those are all useful, but they answer
              different questions. The best next-step diligence is therefore internal: Neo’s city-level client mix, RM
              productivity, share of wallet by wrapper, migration from self-managed or private-bank incumbents, and
              segment-level attachment of alternatives, estate planning and cross-border products. Until those are
              disclosed, the chapter should frame Neo’s market as attractive and multi-layered, not as one precise
              multiple-ready TAM sentence.
            claimRefs:
              - CM039
              - CM040
              - CM041
