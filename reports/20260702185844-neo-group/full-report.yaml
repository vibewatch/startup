      - number: '2.3'
        title: Buyer, user, payer and adoption path
        blocks:
          - type: paragraph
            body: >-
              The organized Indian private-wealth market is segmented more by decision context than by simple income
              bands. At the top end, business-owning UHNI principals and family leaders are usually the economic buyers,
              while CFO-like family members, CIOs, finance teams or trusted advisers become daily users. In the HNI and
              emerging-affluent tiers, the buyer may still be the principal, but the users are more often relationship
              managers, app users and advisers coordinating across products. Nuvama, Motilal, Julius Baer and DBS all
              show that the payer can also be a family office, corporate treasury, NRI principal or internationally
              booked structure rather than an individual retail account. Adoption typically starts when wealth creation,
              liquidity events or cross-border complexity overwhelm self-management. The market is also shifting
              generationally: EY, Nexdigm and Capgemini all point to a rising affluent cohort that expects digital
              access and personalization, while Hubbis argues the relationship only endures when advisers listen before
              they distribute.
