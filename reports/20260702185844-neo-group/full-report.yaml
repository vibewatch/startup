            body: >-
              Investors should track a small set of monitorable triggers rather than relying on Neo Group's disclosed
              mitigations alone, since most mitigations described in this chapter (compliance functions,
              partnership-style pay, diversified exchange memberships) are asserted rather than independently verified.
              The clearest thesis-break triggers are: a second IFSCA or SEBI enforcement action within 18 months of the
              May 2025 GIFT City warning; failure to close an expected institutional funding round within 12 months of
              the March 2026 TVS Capital close, given Neo's demonstrated reliance on frequent capital infusions;
              material attrition among the 2024-2026 hiring cohort of senior bankers; continued absence of audited
