companyProfile:
  summary: >-
    Neo Group is a Mumbai-based private wealth and alternative-assets platform that combines advisory, broking,
    depository, PMS, Cat II and Cat III AIF, and GIFT City fund-management wrappers under one brand family. The company
    positions itself as a premium, knowledge-led, technology-powered partner for family offices, UHNIs, HNIs,
    institutions, and corporates, and public evidence shows it scaled quickly from a 2021 launch into a unicorn-marking
    PE round in March 2026.
