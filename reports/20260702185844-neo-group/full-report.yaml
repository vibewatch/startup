        title: Traction proxies and unit-economics signal quality
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction proxies are not audited revenue numbers but scale markers and team counts.
              In August 2024, ET said Neo had nearly ₹35,000 crore in wealth assets, more than ₹6,000 crore in
              alternatives, and roughly 1,200 clients. By March 2026, ET and FinTech BizNews shifted to broader platform
              language—roughly ₹1 lakh crore of client assets and roughly ₹50,000 crore of ARR AUM—while the later
              Shajikumar appointment coverage separately cited more than ₹40,000 crore in wealth assets, ₹11,500 crore
              in alternatives, and more than 600 professionals overall. Those numbers are directionally supportive: the
              platform is growing, the alternative-asset arm appears to be scaling quickly, and the advisor bench is
              visibly expanding.


              The caution is that the public record becomes much weaker when the analysis drops from platform-level
              headlines to product-level operating evidence. Business Today, HNI Portfolio, and IPOPlatform all purport
              to describe Neo PMS at roughly the same time, yet one shows ₹5,275.22 crore of AUM, another shows
              ₹1,908.87 crore and 216 active clients, and another shows ₹0 crore and 0 clients. That spread is too large
              to ignore. It means every client-size, fee-yield, or product-penetration estimate has to be treated as
              provisional until management supplies a reconciled ledger.
