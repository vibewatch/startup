      - number: '1.3'
        title: Funding history, scale progression, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Neo’s financing arc is now well established. August 2024 coverage from The Economic Times, Moneycontrol,
              and BusinessLine says the company raised ₹400 crore from MUFG Bank and Euclidean Capital with Peak XV also
              participating, taking the equity base to roughly ₹1,000 crore. Those same reports framed Neo as a
              fast-growing private platform with nearly ₹35,000 crore of wealth assets, more than ₹6,000 crore of
              alternative assets, and roughly 1,200 clients. By March 2026, the next funding step was much larger and
              more consequential: retained coverage from ET, VCCircle, FinTech BizNews, and Entrepreneur India all
              reported a ₹500 crore TVS Capital round at a ₹10,000 crore pre-money valuation. That consistency is
              important because it directly contradicts the INR 440 crore figure in the user brief; none of the reviewed
              sources support that lower number.


              The newer 2026 scale markers also show that Neo is no longer describing itself purely through advisory
              AUA. ET and FinTech BizNews shift to broader platform metrics such as roughly ₹1 lakh crore of client
              assets and roughly ₹50,000 crore of ARR AUM, while the Shajikumar appointment coverage separately cites
              more than ₹40,000 crore in wealth assets and ₹11,500 crore in alternatives. The combination suggests a
              platform that is broadening faster than its old wealth-only metrics can capture, even if the public
              disclosures are still not reconciled line by line. Investors, customers, and regulators all matter in that
              transition, so later diligence needs to focus as much on rights, concentration, and cross-entity economics
              as on round size alone.
