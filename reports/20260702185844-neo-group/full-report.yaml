    rows:
      - - Neo Group
        - Premium wealthtech / organized wealth challenger
        - ₹35,000 Cr AUA and >₹6,000 Cr alts AUM in 2024; official PMS and AIF wrappers
        - Premium Indian consumers, HNI/UHNI, alternatives seekers
        - Digital-first execution with premium positioning
