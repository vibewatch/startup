  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue rails and regulated wrapper mix
        blocks:
          - type: paragraph
            body: >-
              Neo’s public surfaces make one thing clear: this is not a single-fee advisory business. Neo Wealth
              Management lists broking, depository-participant, investment-advisory, and research capabilities. Neo
              Wealth Partners adds another advisory and distribution entity that explicitly mentions mutual funds, PMS,
              and AIF products. Neo Asset Management then layers on PMS, Category II and Category III AIFs, and an IFSC
              fund-management entity. In other words, the platform appears able to monetise execution, advisory,
              distribution, managed accounts, and alternatives manufacturing from overlapping affluent client
              relationships.


              The problem is that public disclosure of realised monetisation is far thinner than public disclosure of
              wrappers. HNI Portfolio gives one usable PMS fee anchor—1% fixed plus variable profit sharing and a ₹50
              lakh minimum ticket—but Neo’s own official surfaces do not publish equivalent management-fee,
              advisory-fee, or carry schedules. That means the financial analyst can map how activity should convert
              into fee pools, but cannot yet see which rail dominates gross profit or whether the alternatives business
              is already margin-accretive relative to the wealth arm.
