            body: >-
              Neo's expansion logic is straightforward: it can deepen a relationship from wealth advice and execution
              into product distribution, PMS, alternatives, private credit, and cross-border/GIFT City structures.
              Competitor disclosures from Anand Rathi, Motilal Oswal, and DBS show that upper-end wealth players compete
              on advisor density, hybrid digital-human servicing, succession support, and trusted multi-product breadth;
