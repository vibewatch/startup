      - number: '1.2'
        title: Leadership bench, governance signals, and regulatory footprint
        blocks:
          - type: paragraph
            body: >-
              The leadership story is one of Neo’s strongest positives. Public bios surface a founder set and senior
              bench with backgrounds spanning Edelweiss, Macquarie, ICICI, Goldman Sachs, Kotak Institutional Equities,
              Motilal Oswal, Nuvama, 360 ONE, Barclays, and Deutsche. Nitin Jain anchors the overall platform, Varun
              Bajpai brings senior institutional and capital-markets experience, Hemant Daga and Puneet Jain lead the
              alternatives effort, Riyaz Ladiwala adds operating and reporting infrastructure, and Shajikumar Devakar
              broadens the wealth-management franchise after arriving from 360 ONE. This is precisely the sort of résumé
              density a high-end wealth platform would want to signal to both clients and investors.


              The governance surface is more mixed. Neo does publish meaningful licence and registration detail across
              its entities: Neo Wealth Management lists stock-broking, depository-participant, investment-adviser, and
              research-analyst permissions; Neo Wealth Partners lists its own investment-adviser and distribution
              credentials; Neo Asset Management lists PMS, AIF, and IFSC registrations. That breadth confirms the group
              is genuinely multi-wrapper. But the public record still lacks a full board roster, committee structure, or
              a clean entity-ownership diagram tying all licences back to the holding company. The result is a company
              that is transparent on commercial permissions but still sparse on formal governance disclosure.
            claimRefs:
