        title: Exhibits
        blocks:
          - type: callout
            title: The right TAM is layered, not singular
            body: >-
              Neo can be framed through HNWI counts, UHNW counts, liquid wealth, managed-investment stock or household
              financial assets, but those are nested lenses rather than interchangeable TAMs.
            calloutType: insight
            claimRefs:
              - CM014
              - CM017
              - CM018
              - CM040
          - type: callout
            title: Trust and succession remain the hardest adoption bottlenecks
            body: >-
              Public evidence repeatedly shows that Indian wealth demand is real, but client capture still turns on
              trust, governance maturity and underpenetrated succession planning rather than on product breadth alone.
            calloutType: risk
