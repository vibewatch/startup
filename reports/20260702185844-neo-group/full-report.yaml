              (stock-broking INZ000306537 with NSE/BSE/MCX membership and CDSL/NSDL depository-participant
              registration), and a GIFT City IFSC branch (IFSCA Fund Management Entity FSCA/FME/II/2023-24/084). Each of
              the underlying SEBI regulations (Portfolio Managers 2020, Investment Advisers 2013, Alternative Investment
              Funds 2012) was amended within the past year, meaning Neo's compliance obligations are a moving target.
              Most materially, IFSCA's own document portal shows a press release dated 07/05/2025 titled 'IFSCA issues
              warning to Neo Asset Management Private Limited (IFSC Branch)'; a TaxGuru legal-commentary headline
              suggests the issue relates to 'personnel presence' at the branch, but neither the full IFSCA order nor
              independent legal analysis could be retrieved to confirm the precise compliance failure or remedial status
              — this is recorded as a material evidence gap. Separately, Neo Group publicly disclosed in September 2025
              that fraudulent WhatsApp/Telegram groups were misusing its brand for unauthorised trading schemes,
              directing affected investors to its own grievance channel, SEBI's SCORES portal, the Online Dispute
              Resolution mechanism, and the national cybercrime portal/1930 helpline. Operating six-plus licensed
              entities multiplies the surface area for any single compliance lapse to become material. Table TR001 ranks
