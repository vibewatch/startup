      - number: '3.2'
        title: Capability, distribution and trust posture
        blocks:
          - type: paragraph
            body: >-
              The main competitors differ less on whether they can offer investments and more on how they package trust,
              distribution and service density. 360 ONE sells a full stack: advisory, discretionary mandates,
              distribution, alternatives, lending, treasury and estate planning. Nuvama pushes an integrated platform
              across products, advisory, capital-market access and technology. Anand Rathi emphasizes a CFO-like,
              data-backed RM relationship. Motilal leans on open architecture, Hurun-family credibility and
              family-governance support. Julius Baer and DBS are not likely to win by domestic branch scale, but by
              boutique prestige, ratings, booking-centre access and legacy-planning capability. Neo’s potential edge is
              digital fluency and premium positioning, yet the incumbents already occupy most of the trust anchors
              wealthy Indian families care about: long operating histories, recognizable regulatory wrappers, large RM
              benches, and visible institutional or listed-company governance. That makes feature parity alone
              insufficient. Neo must prove a better experience or sharper alignment, not just another product shelf.
