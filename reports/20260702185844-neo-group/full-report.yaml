            body: >-
              Neo Group was founded in October 2021 by Nitin Jain (Chairman & Managing Director), who previously built a
              platform managing over USD 40 billion in client assets, alongside co-founders Varun Bajpai (25+ years,
              ex-Macquarie Country Head), Hemant Daga (ex-CEO of Edelweiss Asset Management, built a USD 4 billion
