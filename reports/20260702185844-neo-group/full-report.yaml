        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Six developments would break this chapter's already-cautious thesis: formal escalation of the IFSCA
              warning against Neo Asset Management's IFSC branch; continued withholding of FY24-FY26 revenue and profit
              data through a future raise or filing threshold; a next-round valuation below the Rs 10,000 crore
              pre-money mark set in March 2026; senior-advisor attrition to incumbent private banks amid an intensifying
              hiring market that Citywire has already framed as a competitive threat; a material deceleration in AUM or
              ARR AUM growth versus the sector's roughly 18% projected CAGR; and continued, unreconciled divergence
              across third-party PMS AUM trackers for Neo Asset Management. Closing this chapter's most material
              evidence gaps would require obtaining audited or management-prepared FY24-FY26 financials, the TVS Capital
              round's term sheet or shareholders' agreement, direct confirmation of IFSCA remediation status, a
              reconciliation of the conflicting PMS AUM figures, advisor headcount and attrition trend data,
              client-concentration metrics, clarity on how alternative-assets AUM is treated within the headline Rs 1
              lakh crore client-asset figure, and any concrete exit-path precedent. Until these asks are closed, this
              chapter treats Neo Group's valuation as directionally supported by growth and investor quality, but not
              yet independently verifiable at the multiple implied by the March 2026 round.
