      - - Product
        - >-
          Neo blends wealth, alternative-asset and family-office advisory under roughly 150 senior advisors and 600+
          professionals.
        - >-
          No independent audit confirms the disclosed AUM/ARR AUM figures; they are self-reported alongside funding
          announcements.
      - - Customers
        - >-
          Neo serves roughly 1,200+ HNI/UHNI/family-office clients across about Rs 1 lakh crore in disclosed client
          assets.
        - >-
          Indian family-office institutionalisation has broadly outpaced governance maturity, per independent
          commentary.
      - - Financials
        - Neo's FY23 revenue grew nine-fold to Rs 65 crore with a narrowing loss, per Entrackr.
        - No FY24-FY26 revenue, margin, or profitability figures have been disclosed for Neo Group.
      - - Competition / capital
        - >-
          Backed by MUFG, Peak XV, Euclidean Capital, and now TVS Capital, signalling tier-1 capital and governance
          diligence.
        - >-
          360 ONE, Nuvama, Anand Rathi, Motilal Oswal, Kotak, Julius Baer, and DBS all compete for the same UHNI wallet
          with far deeper disclosure.
      - - Risk & governance
        - Diversifying across wealth, asset management, and alternatives spreads Neo's revenue-concentration risk.
        - >-
          IFSCA issued a formal warning to Neo Asset Management's IFSC branch in May 2025 with no confirmed public
          resolution.
    notes: >-
      Paired thesis/anti-thesis signals synthesised from the funding, comparable-company, sector, and regulatory
      evidence in this chapter's sources.
