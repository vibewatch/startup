      - number: '1.4'
        title: Milestones, controls, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record supports the view that Neo has been building capabilities in parallel rather than
              merely stacking funding rounds. The public chronology shows early alternative-investment and PMS
              registrations, a 2023 Peak XV round, a 2024 MUFG-Euclidean round, a public note about consolidated
              portfolio reporting, and then a 2026 TVS round with explicit governance language. That sequence is
              consistent with a company trying to institutionalise both product manufacturing and reporting before fully
              scaling its UHNI franchise. The talent narrative also fits that chronology: Shajikumar Devakar’s arrival
              as co-founder and wealth CEO in 2026 looks like a deliberate strengthening of the operating bench rather
              than a random title change.


              The negative signals are real but still bounded. Moneycontrol said Neo was seeking an NBFC licence in late
              2024, but the reviewed pack never confirms whether that path was approved or launched. More importantly,
              IFSCA published a May 2025 warning notice for Neo Asset Management’s IFSC branch, yet the retained
              evidence does not explain the underlying issue or whether it was remediated. Neo’s own September 2025
              fraud caution notice is different in character—it shows growing brand visibility and the need for investor
              protection, not necessarily misconduct by the company—but it still belongs in the risk register. The right
              conclusion is that Neo’s story remains investable and coherent, but it is not disclosure-complete enough
              to waive follow-up on governance, regulatory controls, or audited economics.
