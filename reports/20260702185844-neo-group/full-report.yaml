              share. The only public recurring-use proxy is the March 2026 statement that about ₹50,000 crore of AUM is
              annualised recurring-revenue AUM, which suggests repeat relationships matter economically but does not
              show whether renewal quality is broad-based or concentrated in a small number of large families or
              advisers. Industry context points both ways. On the positive side, upper-end Indian wealth relationships
              are increasingly built around governance, succession, tax, reporting discipline, and trusted advisory
              continuity, all of which can be sticky when the adviser is embedded. On the negative side, the same
              industry sources stress that trust is hard to build and easy to lose, and Neo's own evidence set still
              lacks public cohorts, named reference customers, and concentration schedules. The right interpretation is
              not that retention is weak; it is that public materials prove growth and positioning better than they
              prove stickiness.
