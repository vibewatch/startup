      - number: '4.3'
        title: Capital adequacy and peer benchmark context
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the clearest part of Neo’s financial profile. The 2024 MUFG-Euclidean round took the
              company’s equity base to around ₹1,000 crore, and the March 2026 TVS Capital round added another ₹500
              crore at a ₹10,000 crore pre-money valuation. That gives Neo real equity backing and reduces the chance of
              an immediate emergency fundraise. It does not, however, replace a full capital-adequacy view. The reviewed
              public sources do not disclose holding-company cash, debt facilities, regulatory-capital buffers, or a
              runway plan. Moneycontrol’s note that Neo was seeking an NBFC licence is also financially important
              because securities-backed lending would change the risk profile from fee-led intermediation toward
              balance-sheet exposure.


              Public peers show what better disclosure looks like. 360 ONE, Nuvama, and Anand Rathi all publish revenue,
              profit, AUM, and return metrics that let investors test the conversion of client assets or ARR AUM into
              earnings. Neo publishes none of those audited outputs. The peer set therefore helps frame what is missing:
              if Neo wants a public-market-style valuation narrative, it eventually needs public-market-style unit
              economics, fee-yield, and margin evidence.
