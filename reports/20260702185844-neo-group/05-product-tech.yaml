  evidenceGaps:
  - type: missing-source
    severity: material
    topic: neofinity-integration-gap
    missingEvidence: Direct product documentation showing whether NeoFinity is integrated into Neo Wealth onboarding, cash management, payments, or household reporting workflows.
    whyItMatters: Without direct evidence of workflow integration, NeoFinity could be a marketing-adjacent optionality play rather than a meaningful technology lever for core wealth clients.
    diligencePath: Request product demo flows and systems diagrams that show customer identity, wallet, cash-transfer, and reporting touchpoints between NeoFinity and the core wealth entities.
    relatedQuestionRefs:
    - QE013
  - type: access-blocked
    severity: material
    topic: ifsc-warning-remediation
    missingEvidence: Full underlying IFSCA warning text, breach description, and remediation closure evidence for the Neo Asset Management IFSC branch.
    whyItMatters: The existence of a regulatory warning is visible, but diligence cannot yet determine whether the issue was procedural, operational, or conduct-related or whether it has been fully closed.
    diligencePath: Obtain the original IFSCA warning order or company response letter and confirm current branch status directly with management and, if needed, the regulator.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: public-tech-surface-gap
    missingEvidence: Public API references, uptime history, integration docs, dashboard screenshots, or technical trust documents for Neo Wealth and NeoFinity.
    whyItMatters: Neo positions as technology-powered, but the public evidence set does not let an investor assess integration depth, software maturity, or reliability posture.
    diligencePath: Request a product data room with architecture diagrams, external integration references, support runbooks, and any public/private trust documentation covering client-facing platforms.
    relatedQuestionRefs:
    - QE021
    - QE024
  - type: conflicting-data
    severity: material
    topic: pms-scale-verification
    missingEvidence: Single authoritative statement of Neo PMS AUM, client count, strategy count, and minimum-ticket information as of the current reporting period.
    whyItMatters: Third-party directories disagree sharply enough that the public market may misunderstand the true scale and maturity of Neo's PMS franchise.
    diligencePath: Request the latest manager-approved PMS factsheet or regulator-filed disclosure package and reconcile it against Business Today and HNI Portfolio data.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
