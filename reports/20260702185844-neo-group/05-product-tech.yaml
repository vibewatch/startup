    - Institutional-grade bespoke advice, infrastructure, and specialized access
    - Public language stresses resilience, predictability, and uplifted portfolio performance
    - No public evidence on reporting stack or service-level metrics
  - - Private-wealth onboarding
    - Prospect chooses service lane and begins relationship-led discovery
    - Contact form routes into wealth management, family office services, or Neo products
    - Signals segmentation before product pitch
