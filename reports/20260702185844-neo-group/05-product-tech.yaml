  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Key Dependency
  - Risk
  rows:
  - - Neo Wealth Partners
    - Advice and product-distribution surface
    - SEBI IA registration, BASL, AMFI, internal compliance
