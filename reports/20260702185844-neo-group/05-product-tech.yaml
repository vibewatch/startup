company:
  name: Neo Group
chapter:
  number: 5
  title: Product & Technology
  summary: 'Neo''s public product stack is less a single app than a regulated service mesh: Neo Wealth Partners covers advisory and distribution, Neo Wealth Management covers broking and depository rails, Neo Alternative Asset Managers manufactures PMS/Cat II/Cat III and GIFT City alternatives, and NeoFinity extends the brand into mobile-first fintech. The strongest disclosed differentiation is breadth across family-office advice, execution, and alternates rather than deep public software documentation. Main diligence risks are thin public technical disclosure, inconsistent third-party PMS operating data, and an only partially visible IFSCA warning trail around the IFSC branch.'
sections:
- id: service-definition-and-product-stack
  title: Service Definition and Product Stack
  body: 'Neo presents itself as a knowledge-led, technology-powered wealth and asset management platform for family offices, institutions, corporates, and ultra-high-net-worth or high-net-worth clients. Public materials show that the customer proposition is intentionally split across multiple regulated entities rather than marketed as a single omnibus product. Neo Wealth Partners handles advisory and distribution; Neo Wealth Management exposes execution surfaces such as broking, depository participation, and investment advisory; Neo Alternative Asset Managers houses PMS plus Cat II, Cat III, and GIFT City alternatives; and NeoFinity is positioned as a separate fintech and payments arm. This matters because Neo''s service definition is workflow-centric: advise, distribute, execute, manufacture alternatives, and then keep the client inside the same brand family. The group also frames family-office work as infrastructure-heavy and institutional in nature, not just portfolio construction. That
    breadth is a real commercial differentiator, but it also means diligence must track which legal entity owns each activity, complaint channel, and regulatory perimeter before assuming a seamless product experience.'
  claimRefs:
