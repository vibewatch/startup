- id: wealth-workflow-and-client-delivery
  title: Neo Wealth Workflow and Client Delivery
  body: The public Neo Wealth workflow starts with segmentation and routing. Prospects can choose wealth management, family office services, or investment in Neo products, while the Neo Wealth front-end separately advertises equities, mutual funds, IPOs, and bonds. Under the hood, the workflow appears to break into two regulated lanes. Neo Wealth Partners states that it offers investment advisory plus distribution of mutual funds, PMS, and AIFs, while Neo Wealth Management states that it offers broking, depository participant services, and investment advisory. That split suggests a model where discretionary client engagement, product selection, and distribution can sit alongside an execution stack tied to exchange and depository memberships. Client service is reinforced by recurring publications, named compliance contacts, mandatory disclosure references, and formal grievance mailboxes rather than a purely app-led self-service loop. The model looks intentionally premium and relationship-manager
    led, with digital surfaces supporting discovery and execution. What is not yet public is the degree of systems integration between those layers, including whether the wealth and broking surfaces share onboarding, reporting, or household-level data views.
  claimRefs:
