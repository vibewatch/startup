- id: alternatives-engine-and-dependencies
  title: Alternatives Engine and Dependency Architecture
  body: 'Neo''s alternatives stack is unusually explicit for a private wealth platform. The Neo Alternative Asset Managers surface brings together a SEBI-registered PMS, a Cat II AIF shelf including private credit and infrastructure-income products, a Cat III platform with two named funds, and an IFSCA-regulated GIFT City branch. That architecture fits the broader Indian wealth trend toward managed products such as PMS, AIFs, and private credit as affluent money shifts away from purely traditional savings instruments. It also creates operational dependency on multiple regulators and market infrastructures at once: SEBI for PMS, advisers, and AIF rules; exchanges and depositories for the execution layer; SCORES for complaint escalation; and IFSCA for IFSC activity. The public product map is therefore broad, but the external observability of performance and scale is weak. Third-party PMS directories disagree sharply on Neo''s AUM, client count, and strategy count, which means external data
    should be treated as directional only. The public record also shows an IFSCA warning involving the IFSC branch, but the cached evidence does not expose enough detail to assess remediation quality.'
