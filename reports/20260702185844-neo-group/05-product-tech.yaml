callouts:
- calloutType: strength
  title: Breadth Across Advice, Execution, and Alternatives
  body: 'Neo''s strongest publicly verifiable edge is structural breadth: advisory and distribution through Neo Wealth Partners, execution through Neo Wealth Management, alternatives manufacturing through Neo Asset, and a fintech adjacency through NeoFinity. That architecture can support higher wallet share with sophisticated clients if the back-end entity handoffs are truly integrated.'
  claimRefs:
  - CE005
  - CE007
  - CE010
  - CE022
  - CE032
- calloutType: risk
  title: Thin Public Technical Disclosure
  body: The evidence pack shows strong regulatory and operating disclosures but almost no public API, uptime, or deep integration documentation for Neo Wealth or NeoFinity. For a company positioned as technology-powered, diligence still needs direct product demos and architecture walkthroughs before underwriting automation or software moat claims.
  claimRefs:
  - CE023
  - CE025
  - CE038
  - CE040
- calloutType: risk
  title: Alternatives Data and IFSC Oversight Need Direct Verification
  body: Neo's public alternatives shelf is broad, but third-party PMS data conflicts materially and the cached IFSCA evidence only proves a warning existed, not how it was closed. That makes manager-supplied AUM, client, and remediation evidence mandatory before treating the alternatives business as cleanly de-risked.
  claimRefs:
  - CE033
  - CE034
  - CE035
  - CE036
- calloutType: insight
  title: Technology Story Is Operating-Model First, Developer-Platform Second
  body: Neo's public tech narrative is anchored in operating efficiency, mobile-first experience, and leadership credibility rather than in open developer assets. That can still be commercially valuable in private wealth, but it means differentiation currently rests more on service design and regulated product coverage than on externally inspectable software infrastructure.
  claimRefs:
  - CE025
  - CE028
  - CE029
  - CE030
  - CE040
tables:
- id: TE001
  title: Neo Product Module / Asset Matrix
  columns:
  - Module / Asset
  - Primary User
  - Status / Maturity
  - Differentiation
  - Diligence Gap
  rows:
  - - Neo Wealth Partners (advisory + distribution)
    - Family offices, HNI/UHNI clients
    - Live; regulated disclosure surface public
    - Combines SEBI IA plus distribution of mutual funds, PMS, and AIFs
    - Need proof of how advisory and distribution are separated in practice
  - - Neo Wealth Management (broking + DP + advisory)
    - Execution-oriented wealth clients
    - Live; front-end product menu public
    - Puts equities, IPOs, bonds, and mutual-fund access next to broking and DP rails
    - Need household-level reporting and onboarding workflow demo
  - - PMS platform
    - Clients seeking managed listed-market mandates
    - Live; PMS registration public
    - Direct onboarding, disclosure, complaint data, and investor-charter links visible
    - Public AUM/client figures conflict across third-party directories
  - - Cat II AIF shelf
    - Accredited alternative-investment clients
    - Live; multiple named funds public
    - Includes special credit, infra income, income plus, and radiance vehicles
    - No public product-level performance pack in evidence set
  - - Private credit
    - Yield-seeking sophisticated investors
    - Live as a named product page
    - Signals off-public-markets credit capability inside the broader alternatives stack
    - Need underwriting process and loss-history evidence
  - - NIIOF / infra-income strategy
    - Clients seeking infrastructure income exposure
    - Live as a named product page
    - Shows alternatives menu extends beyond generic equity/fund wrappers
    - Need asset mix, tenor, and liquidity profile
  - - Cat III AIF
    - Sophisticated strategy allocators
    - Live; two named funds public
    - Adds hedge-like or treasury-plus strategies under a separate trust structure
    - Need mandate detail and realized track record
  - - GIFT City IFSC branch
    - Cross-border or IFSC-eligible allocators
    - Live; registration displayed
    - Extends alternatives platform beyond domestic SEBI perimeter
    - Need full context and remediation evidence for 2025 warning
  - - NeoFinity fintech arm
    - Mobile-first retail or mass-affluent users
    - Live marketing site public
    - Expands brand beyond classic private-wealth channels
    - Direct linkage to core Neo wealth workflows is not publicly documented
  notes: Rows cover the product and entity surfaces explicitly disclosed in the evidence pack as of 2026-07-02; they do not assume undocumented internal products or integration layers.
