      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              组织化印度私人财富市场，与其说按简单收入档分层，不如说按决策情境分层。最高端，企业主型 UHNI 本人和家族领袖通常是经济买方，CFO 式家族成员、CIO、财务团队或可信顾问则成为日常用户。在 HNI
              和新兴富裕层，买方仍可能是本人，但用户更常是跨产品协调的 RM、应用用户和顾问。Nuvama、Motilal、Julius Baer 和 DBS 都显示，付款方也可能是家族办公室、企业资金部门、NRI
              本人或国际记账结构，而不是个人零售账户。采用通常始于财富创造、流动性事件或跨境复杂度压过自我管理能力。市场也在代际切换：EY、Nexdigm 和 Capgemini
              都指向一个期待数字化访问和个性化服务的新增富裕群体；Hubbis 则认为，只有顾问先倾听、再分销，关系才能延续。
