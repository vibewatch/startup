            body: >-
              主要竞争者的差异不在于能否提供投资产品，而在于如何包装信任、分销和服务密度。360 ONE 卖的是全栈：咨询、全权委托、分销、另类资产、借贷、资金管理和遗产规划。Nuvama
              则推动横跨产品、咨询、资本市场准入和技术的一体化平台。Anand Rathi 强调 CFO 式、数据支撑的 RM 关系。Motilal 倚靠开放架构、Hurun 家族可信度和家族治理支持。Julius Baer
