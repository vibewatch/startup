      - number: '7.5'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 于 2021 年 10 月由 Nitin Jain（董事长兼董事总经理）创立，他此前搭建过管理超过 USD 40 billion 客户资产的平台；共同创始人还包括 Varun
              Bajpai（25 年以上经验，前 Macquarie 印度区负责人）、Hemant Daga（前 Edelweiss Asset Management CEO，曾搭建 USD 4 billion
              另类资产平台）、 Puneet Jain（CIO，前 Goldman Sachs，在 25 笔以上不良债务交易中部署 USD 1 billion
              以上）。这组机构履历集中度是优势，但公开资料没有披露这四位高管中任何一人的继任计划， 也没有回应他们同时离任的风险。Shajikumar Devakar 在 360 ONE Wealth 及其他私人银行工作 22
              年后，于 2025 年 5 月左右出任 Neo Wealth Management 联合创始人兼 CEO；截至 2026 年中报告日，其任期不足两年，带有近期高管任命常见的整合风险。最尖锐的是，资本驱动的招聘潮让
              Neo 能用合伙制薪酬吸引资深客户经理， 同时也制造流失风险：EY 的财富科技研究发现，行业内下一代客户流失率约为上一代的 4 倍；没有 Neo 特定数据能证明新招银行家或其客户账簿被稳定留住。表 TR004
              按严重程度排列这些执行风险。
