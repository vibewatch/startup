      - number: '1.3'
        title: 融资历史、规模推进与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Neo 的融资路径已经相当清楚。The Economic Times、Moneycontrol 和 BusinessLine 在 2024 年 8 月的报道称，公司从 MUFG Bank 和 Euclidean
              Capital 融到 ₹400 crore，Peak XV 也参与其中，使股本基础达到约 ₹1,000 crore。同一批报道把 Neo 描述为一家快速增长的私营平台，拥有近 ₹35,000 crore
              财富资产、超过 ₹6,000 crore 另类资产以及约 1,200 名客户。到 2026 年 3 月，下一步融资规模更大、影响也更重：ET、VCCircle、FinTech BizNews 和
              Entrepreneur India 的留存报道均称，TVS Capital 以 ₹10,000 crore 投前估值投资 ₹500 crore。这种一致性很重要，因为它直接否定了用户简报中的 INR 440
              crore 数字；本次复核的来源都不支持那个较低金额。


              更新的 2026 年规模指标还显示，Neo 已不再只用咨询 AUA 描述自己。ET 和 FinTech BizNews 转向更宽的平台指标，比如约 ₹1 lakh crore 客户资产和约 ₹50,000
              crore ARR AUM；Shajikumar 任命报道则另行提到超过 ₹40,000 crore 财富资产和 ₹11,500 crore
              另类资产。组合起来看，平台扩张速度已经超过旧有仅财富业务指标能够捕捉的范围，尽管公开披露仍未逐行对齐。在这种转变中，投资者、客户和监管者都重要，所以后续尽调不能只盯轮次规模，也要同等关注权利、集中度和跨实体经济性。
