      - number: '8.4'
        title: 情景与估值敏感性
        blocks:
          - type: paragraph
            body: >-
              由于 Neo Group 未披露 FY23 之后收入，本章构建一个清晰标注的作者估算，而不是把任何精确倍数当作事实。将已披露 FY23 收入基数 Rs 65 crore 乘以 2024 年 8 月至 2026 年
              3 月 Neo 已披露客户 / 咨询资产基础约 2.9x 的增长，得到 FY26 收入大致 Rs 150-300 crore 的宽区间。相对于 TVS Capital 轮约 Rs 10,500 crore
              投后估值， 该区间隐含约 35x-70x EV / revenue 倍数；对比之下，作者基于 Nuvama 与 360 ONE WAM 已披露 FY26 收入、PAT 和追踪 P/E 计算出的 EV /
              revenue 区间分别约 8.7x-16.4x。基准情景下，Neo Group 下一次融资估值维持在 Rs 10,000 crore 附近，符合其近期 19 个月两轮融资节奏。牛市情景假设更广泛板块按
              Bernstein 约 18% 的十年期 AUM CAGR 预测重估，且 Neo 最终披露与同业可比的盈利能力，从而支撑未来轮次或上市时的显著更高估值。熊市情景假设增长放缓、IFSCA
              警告升级，或未来披露显示收入远低于作者估算区间下沿； 任一情形都可能相对于 Rs 10,000 crore 投前标记形成降价轮。
            claimRefs:
              - CV051
