      - number: '8.7'
        title: 图表证据
        blocks:
          - type: callout
            title: 两轮融资中的一线投资者银团
            body: >-
              MUFG Bank、Peak XV Partners、Euclidean Capital 以及如今的 TVS Capital 均已投资 Neo
              Group，为其增长叙事增加尽调可信度，尽管公司自身财务披露仍然很薄。
            calloutType: strength
            claimRefs:
              - CV005
              - CV008
          - type: callout
            title: FY23 之后收入和利润率未披露
            body: 本章中 Neo Group 的每一个估值倍数都建立在作者估算收入区间之上，因为证据包没有找到 FY24-FY26 收入、利润率或利润数字。
            calloutType: risk
            claimRefs:
              - CV050
              - CV013
          - type: callout
            title: IFSCA 警告未解决
            body: IFSCA 2025 年 5 月对 Neo Asset Management IFSC 分支的警告，在证据包中没有确认的公开整改；如果升级，将直接触发破题。
            calloutType: risk
            claimRefs:
              - CV040
              - CV041
          - type: callout
            title: 估值倍数是作者估算，不是披露事实
            body: 由于 Neo Group 收入未披露，本章的 EV / revenue 与 EV / ARR-AUM 对比建立在清晰标注的宽作者估算收入区间之上，而不是编造出的精确倍数。
            calloutType: assumption
            claimRefs:
              - CV051
              - CV052
              - CV053
          - type: callout
            title: 板块顺风真实存在，但分析师定价仍谨慎
            body: Bernstein 预计印度专业财富管理机构未来十年 AUM CAGR 约 18%，支撑结构性牛市论点；但 Citi 也单独建议投资者，即使对其最看好的上市标的，也应等待更好的入场点。
            calloutType: insight
            claimRefs:
              - CV032
              - CV033
