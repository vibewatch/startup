              公开的 Neo Wealth 工作流从分层和分流开始。潜在客户可以选择财富管理、家族办公室服务或投资 Neo 产品，而 Neo Wealth 前端又单独展示股票、共同基金、IPO
              和债券。底层看，工作流似乎拆成两条受监管通道。Neo Wealth Partners 表示提供投资咨询，并分销共同基金、PMS 和 AIF；Neo Wealth Management
              则表示提供经纪、存管参与人服务和投资咨询。这个拆分暗示一种模型：自主性较强的客户互动、产品选择和分销，可以与绑定交易所和存管会员资格的执行栈并行。客户服务不是纯应用
              驱动的自助闭环，而是由定期出版物、具名合规联系人、强制披露引用和正式投诉邮箱来增强。模型看上去刻意走高端、RM
              主导路线，数字界面支持发现和执行。尚未公开的是这些层之间的系统整合程度，包括财富和经纪界面是否共享开户、报告或家庭层面的数据视图。
