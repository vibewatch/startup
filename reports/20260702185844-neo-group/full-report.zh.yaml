        - Bernstein 预计，印度专业财富管理机构 AUM 将在未来十年从约 $300bn 扩至 $1.6tn。
        - Citi 提醒，即便对其首选标的，市场也可能低估了近期业务逆风。
      - - 产品
        - Neo 把财富、另类资产和家族办公室顾问业务捏在一起，由约 150 名高级顾问和 600+ 名专业人员支撑。
        - 没有独立审计确认已披露的 AUM / ARR AUM 数字；这些数字伴随融资公告由公司自报。
      - - 客户
        - Neo 服务约 1,200+ 名 HNI / UHNI / 家族办公室客户，对应披露客户资产约 Rs 1 lakh crore。
        - 独立评论显示，印度家族办公室机构化整体跑在治理成熟度前面。
      - - 财务
        - 据 Entrackr，Neo FY23 收入增长 9 倍至 Rs 65 crore，亏损收窄。
        - Neo Group 未披露 FY24-FY26 收入、利润率或盈利能力数字。
      - - 竞争 / 资本
        - MUFG、Peak XV、Euclidean Capital 以及最新的 TVS Capital 背书，释放一级资本和治理尽调信号。
        - 360 ONE、Nuvama、Anand Rathi、Motilal Oswal、Kotak、Julius Baer 和 DBS 都在争夺同一批 UHNI 钱包，且披露深度远高于 Neo。
      - - 风险与治理
        - 财富、资产管理和另类业务多线分散，降低 Neo 的收入集中风险。
        - IFSCA 于 2025 年 5 月向 Neo Asset Management 的 IFSC 分支机构发出正式警告，尚无公开确认的解决结果。
    notes: 成对的论点 / 反论点信号综合自本章来源中的融资、可比公司、行业和监管证据。
