      - number: '2.5'
        title: 公开证据仍无法切出的部分
        blocks:
          - type: paragraph
            body: >-
              主要尽调风险是假精确。公开来源显示，这是一个富裕且正在正规化的市场，但它们切不出 Neo 的真实 SOM。印度家族办公室没有干净的公开普查，纯咨询、PMS、AIF
              和更广家族办公室费用池之间也没有可靠的公开拆分，更没有从新兴富裕投资者转化为付费私人财富客户的公开曲线。即便最好的数字也混合了根本不同的口径：HNWI 人数、UHNW
              城市集中度、流动金融财富、管理型投资存量和家庭金融资产总量。这些都有用，但回答的是不同问题。因此，最好的下一步尽调必须来自内部：Neo 的城市级客户结构、RM
              生产率、按载体划分的钱包份额、从自我管理或私人银行既有机构迁移的情况，以及另类资产、遗产规划和跨境产品在各细分客群的附着率。在这些披露前，本章应把 Neo
              的市场描述为有吸引力且多层次，而不是一句可以直接套倍数的精确 TAM。
