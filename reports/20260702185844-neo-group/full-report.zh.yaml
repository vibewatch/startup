      - number: '1.2'
        title: 领导层厚度、治理信号与监管足迹
        blocks:
          - type: paragraph
            body: >-
              领导层是 Neo 最强的正面因素之一。公开履历显示，创始人与高管团队背景横跨 Edelweiss、Macquarie、ICICI、Goldman Sachs、Kotak Institutional
              Equities、Motilal Oswal、Nuvama、360 ONE、Barclays 和 Deutsche。Nitin Jain 统领整体平台，Varun Bajpai
              带来资深机构和资本市场经验，Hemant Daga 与 Puneet Jain 牵头另类资产业务，Riyaz Ladiwala 补上运营和报告基础设施，Shajikumar Devakar 则在从 360 ONE
              加入后扩展财富管理业务。高端财富平台需要同时向客户和投资者释放的，正是这种履历密度。


              治理层面的公开信息更参差。Neo 确实披露了各实体的重要牌照和注册细节：Neo Wealth Management 列出股票经纪、存管参与人、投资顾问和研究分析师权限；Neo Wealth Partners
              列出自身投资顾问和分销资质；Neo Asset Management 列出 PMS、AIF 和 IFSC
              注册。这种宽度确认集团确实拥有多种监管载体。但公开记录仍缺完整董事名单、委员会结构，也缺一张把所有牌照清楚连回控股公司的实体所有权图。因此，Neo 在商业许可上透明，但在正式治理披露上仍偏稀疏。
