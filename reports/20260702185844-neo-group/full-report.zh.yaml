              500 crore，同时披露约 Rs 1,00,000 crore 总客户资产和 Rs 50,000 crore ARR AUM。Hindu BusinessLine 称，截至 2024 年轮次，累计股权资本约
              $104 million（约 Rs 1,000 crore）。
              证据包没有记录这两轮之间单独定价的融资事件，尽管没有证据并不等于不存在。任何潜在投资者的进入纪律都应明确纳入这些事实：这些头部数字来自融资公告中的自报口径；未能查阅列明投后所有权、清算优先权或反稀释条款的条款清单或股东协议；
              Neo Group 还表示计划将高管团队从约 40 人扩至约 100 名专业人员，这本身带有执行和成本吸收风险。
