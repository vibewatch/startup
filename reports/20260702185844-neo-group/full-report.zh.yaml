      - number: '8.3'
        title: 融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              Neo Group 已披露融资史显示，其约 19 个月内完成两轮融资：2024 年 8 月由 MUFG Bank 与 Euclidean Capital 领投 Rs 400 crore，当时公司报告近 Rs
