        title: 牵引代理指标与单位经济信号质量
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引代理指标不是审计收入数字，而是规模标记和团队人数。2024 年 8 月，ET 称 Neo 拥有近 ₹35,000 crore 财富资产、超过 ₹6,000 crore 另类资产以及约 1,200
              名客户。到 2026 年 3 月，ET 和 FinTech BizNews 转向更宽的平台语言——约 ₹1 lakh crore 客户资产和约 ₹50,000 crore ARR AUM——后续
              Shajikumar 任命报道又单独提到超过 ₹40,000 crore 财富资产、₹11,500 crore 另类资产以及整体超过 600
              名专业人员。这些数字在方向上是支持性的：平台在增长，另类资产部门似乎在快速扩张，顾问队伍也明显变大。


              谨慎点在于，当分析从平台级标题下沉到产品级运营证据时，公开记录明显变弱。Business Today、HNI Portfolio 和 IPOPlatform 都声称在差不多同一时期描述 Neo PMS，但一个显示
              AUM 为 ₹5,275.22 crore，另一个显示 ₹1,908.87 crore 和 216 名活跃客户，还有一个显示 ₹0 crore 和 0
              名客户。这个差距太大，不能忽略。它意味着，在管理层提供对账后的台账之前，所有客户规模、费率收益或产品渗透估计都只能先按临时口径处理。
