  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Neo Group 是一家快速增长、多实体的印度财富与资产管理平台，至少通过六个不同的 SEBI 和 IFSCA 监管法律实体运营，覆盖投资咨询、组合管理、股票经纪、Category III AIF、GIFT
              City IFSC 基金管理分支，以及金融科技 / 支付部门。本章把风险严重性排在五个领域：监管 / 法律、运营 / 质量 / 安全、合作伙伴 / 依赖、人员 / 执行，以及财务 /
              模型；其中三类风险最需要贴近监控：2025 年 5 月 IFSCA 针对 Neo Asset Management IFSC 分支的执法警告已经有记录，但完整法律依据仍未核实；尽管 TVS Capital 在
              2026 年 3 月给出独角兽级（₹10,000 crore 投前）估值，集团层面收入、EBITDA 或现金消耗仍完全没有公开披露；资本支持下的资深银行家招聘潮一方面驱动增长，另一方面也让 Neo
              暴露在竞争对手用同样合伙人式 薪酬策略挖人的风险下。严重性较低但仍重要的风险包括公开聚合器之间第三方 AUM 数据不一致，以及创始人 / 高管接班规划未解决。风险热力图（Figure
              FR001）按定性可能性和严重性摆放这些项目，供投委会复核。
