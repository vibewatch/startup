      - number: '8.5'
        title: 可比公司集合
        blocks:
          - type: paragraph
            body: >-
              可比集合由三家上市的印度纯财富管理机构和四家私人银行在位者组成。360 ONE WAM 报告 FY26 总 AUM 为 Rs 6,74,492 crore、ARR AUM 为 Rs 3,11,940 crore、
              收入 Rs 3,144 crore、PAT Rs 1,225 crore，交易价格约为追踪盈利 42x，而五年中位数为 32.7x。PAG 控股的 Nuvama Wealth Management 报告 FY26
              客户资产超过 Rs 4.5 trillion，覆盖 4,750 多个 UHNI 家庭，收入 Rs 3,122 crore、经营 PAT Rs 1,049 crore、ROE 28.1%，交易价格约为追踪盈利
              26x。Anand Rathi Wealth 报告 FY26 收入 Rs 1,198 crore、PAT Rs 386 crore、AUM 超过 Rs 1,00,000 crore、ROE 46.7%；但
              Bernstein 仅给予 Market-Perform，指出市场挂钩债券贡献其过半收入， 是风险和估值顾虑。Motilal Oswal Private Wealth、Kotak Private
              Banking、Julius Baer India 与 DBS Private Bank 作为披露较少的在位竞争参照补足集合，
              而非一一对应的公开可比公司，因为它们均未单独报告财富部门财务。这个混合可比集合横跨差异很大的披露制度和资产负债表结构，限制了与 Neo Group 的严格倍数可比性；此处将其视为部分、示意性样本，
              而非印度财富管理机构的完整名录。
            claimRefs:
