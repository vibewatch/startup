      - number: '8.6'
        title: 破题触发器与最终尽调事项
        blocks:
          - type: paragraph
            body: >-
              六类进展会打破本章本已谨慎的论点：IFSCA 对 Neo Asset Management IFSC 分支的警告正式升级；到未来融资或申报门槛时仍继续不披露 FY24-FY26 收入和利润数据； 下一轮估值低于
              2026 年 3 月设定的 Rs 10,000 crore 投前标记；在 Citywire 已将招聘市场加剧视作竞争威胁的背景下，资深顾问流向在位私人银行；AUM 或 ARR AUM 增速相对行业约 18% 预测
              CAGR 显著放缓；以及第三方 PMS AUM 追踪器对 Neo Asset Management 的数据继续存在未调和分歧。要关闭本章最重大的证据缺口，需要取得经审计或管理层编制的 FY24-FY26
              财务、TVS Capital 轮条款清单或股东协议、IFSCA 整改状态的直接确认、冲突 PMS AUM 数字的调节表、顾问人数与流失趋势数据、客户集中度指标、 关于另类资产 AUM 如何纳入头部 Rs 1
              lakh crore 客户资产数字的清晰口径，以及任何具体退出路径先例。在这些事项关闭前，本章认为 Neo Group 估值在方向上受到增长和投资者质量支撑， 但尚不能在 2026 年 3
              月轮次隐含倍数上被独立验证。
