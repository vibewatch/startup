  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 已观察影响
      - 当前公开替代项
      - 严重性
      - 确切尽调路径
    rows:
      - - 经审计收入和 EBITDA
        - 没有这些数据，估值无法绑定盈利质量
        - 收入质量判断只能停留在方向性
        - 360 ONE、Nuvama 和 Anand Rathi 的同业披露
        - 阻断性
        - 索取经审计 FY2024–FY2026 损益表和管理层桥
      - - 按通道拆分的分部结构
        - 需要弄清经纪、顾问、PMS 还是另类资产在驱动毛利
        - ARR AUM 无法直接换算成收入结构
        - 官方产品页只展示载体
        - 重大
        - 按产品、客户分部和实体索取收入
      - - 实际费率收益率 / 留存 bps
        - 决定经常性收入质量和估值倍数支撑
        - 无法把 Neo 与 360 ONE 披露的 78 bps 做干净对比
        - 只有 ARR AUM 标题数
        - 重大
        - 索取费率收益率历史、留存 bps 和净新增资金流
      - - PMS / AIF AUM 对账
        - 公开目录互相冲突，削弱对产品层规模的信心
        - 外部数据库给出的 PMS AUM 从 ₹0 crore 到 ₹5,275.22 crore 不等
        - Business Today、HNI Portfolio 和 IPOPlatform 交叉验证
        - 重大
        - 索取计划层 AUM，并附最新监管申报或管理人声明
      - - 现金、债务和资金续航期
        - 用于判断融资依赖和下行情境韧性
        - 即便股权背书很强，资本充足性判断仍不完整
        - 只有股权融资标题数
        - 阻断性
        - 索取资金报表、债务明细和 12–18 个月资金续航计划
      - - IFSCA 警示详情及结案
        - IFSC 业务潜在控制问题无法量化
        - 监管悬而未决的评估只能停留在定性
        - 仅有警示通知存在的证据
        - 重大
        - 索取完整通知、回复、整改记录，以及如有则提供结案证明
      - - 客户集中度与流失
        - 高端财富业务即使 AUM 很大，客户也可能高度集中
        - 平均单客规模只是粗略代理指标，可能遮住集中度风险
        - 2024 年 ET 报道给出的约 1,200 名客户数
        - 重大
        - 索取前 10 大客户占比、客户年限曲线，以及季度总流失 / 净流失
    notes: 每一行都是具体尽调卡点，而不是泛泛资料请求。章节可以解释 Neo 的收入模式，但还无法验证盈利能力或韧性。
