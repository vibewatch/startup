      - number: '4.3'
        title: 资本充足性与同业基准背景
        blocks:
          - type: paragraph
            body: >-
              资本形成是 Neo 财务画像中最清楚的部分。2024 年 MUFG-Euclidean 轮把公司股本基础带到约 ₹1,000 crore，2026 年 3 月 TVS Capital 轮又以 ₹10,000
              crore 投前估值增加 ₹500 crore。这给 Neo
              带来真实股本支撑，也降低了立即紧急融资的概率。不过，这不能替代完整的资本充足性视图。本次复核的公开来源没有披露控股公司现金、债务额度、监管资本缓冲或续航计划。Moneycontrol 提到 Neo 正在寻求
              NBFC 牌照，这一点在财务上也很重要，因为证券担保贷款会把风险画像从收费中介推向资产负债表敞口。


              公开同业展示了更好披露应是什么样。360 ONE、Nuvama 和 Anand Rathi 都发布收入、利润、AUM 和回报指标，让投资者可以测试客户资产或 ARR AUM 向盈利的转化。Neo
              没有发布任何这类审计输出。因此，同业集合帮助界定缺口：如果 Neo 想讲一个公开市场式估值故事，最终就需要公开市场式的单位经济、费率收益和利润率证据。
