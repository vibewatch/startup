      - number: '4.4'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论比披露包更好，而不是披露包支撑出更强结论。Neo 几乎肯定拥有多条变现轨道、可信的资本支持者，以及足以在印度私人财富市场占据一席之地的客户规模。但公司仍要求外部投资者靠信任补太多空白：没有审计收入，没有
              EBITDA，没有现金，没有资金续航，没有对账后的产品级 AUM，没有实际费率收益历史，也没有公开解释 IFSC 警告的解决情况。这些不是装饰性遗漏，而是判断 ₹10,000 crore
              投前估值究竟反映耐久经济性，还是仅仅反映增长赛道里强市场定位所需的核心指标。


              因此，结论应谨慎但不负面。Neo 在战略上位置不错，商业面较宽，结构上也贴合印度财富增长的有利顺风。但从财务承销角度看，它仍受披露限制。下一份尽调包必须回答：ARR AUM
              中有多少转化为实际经常性收入，另类资产业务对利润率贡献多少，PMS 和 AIF 数据能否干净对齐，以及下一阶段扩张背后有多少流动性。
