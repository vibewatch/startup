      - number: '7.7'
        title: 缓释、监测与终止标准
        blocks:
          - type: paragraph
            body: >-
              投资者应跟踪一小组可监测触发器，而不能只依赖 Neo Group 已披露的缓释措施；本章所述大多数缓释（合规职能、合伙制薪酬、多元化交易所会员资格）只是公司主张，尚未被独立验证。 最清晰的破题触发器包括：在
              2025 年 5 月 GIFT City 警告后的 18 个月内，出现第二次 IFSCA 或 SEBI 执法行动；鉴于 Neo 已表现出对频繁注资的依赖， 在 2026 年 3 月 TVS Capital
              交割后的 12 个月内未能完成预期机构融资；2024-2026 年招聘队列中资深银行家出现重大流失；下一次融资或退出事件时仍没有集团层面经审计财务； 以及创始高管 Nitin Jain、Varun
              Bajpai、Hemant Daga 或 Puneet Jain 中任何一人计划外离任且未披露继任者。Neo Group 更广泛的风险传导链条， 是监管和人才竞争压力穿过投资者 /
              客户信任与利润率，进一步传导到融资依赖，并最终影响估值支撑（图 FR002）；由于资本强度和融资依赖位于链条中心，持续获得机构资本是当前增长与估值论证中最承重的假设。 表 TR006
              给出持续监测的具体触发器和阈值。
