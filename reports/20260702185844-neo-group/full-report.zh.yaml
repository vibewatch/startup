    summary: Neo 的客户旅程似乎先按细分客群建立信任，再进入受监管开户流程；关系加深后，产品覆盖继续扩张。
    data:
      nodes:
        - id: target-segment
          label: 目标客群
          detail: 家族办公室、私人财富客户、机构、企业以及 HNI/UHNI 投资者，分别从不同价值主张进入。
        - id: trust-formation
          label: 信任建立
          detail: 潜在客户会看透明度、顾问质量、保密性，以及 Neo 理念是否贴合其长期需求。
        - id: discovery
          label: 发现路径
          detail: 入站路径分流到 Wealth Management、Family Office Services 或 Invest in Neo Products，说明线索捕获按客群区分。
        - id: regulated-onboarding
          label: 受监管开户
          detail: KYC、产品适配性、投诉披露和特定实体注册共同决定账户如何开立。
        - id: core-mandate
          label: 核心委托
          detail: 根据客户需求，关系会落在咨询、经纪、分销或首个另类产品上。
        - id: cross-sell
          label: 交叉销售 / 深化
          detail: Neo 可以把同一客户关系延伸到 PMS、AIF、私人信贷、报告和跨境架构。
        - id: renew-expand
          label: 续约 / 扩张
          detail: 长期价值取决于顾问连续性、信任，以及产品广度能否转化为稳定钱包份额。
    approximationNotes: 这条旅程来自官方客群页面、联系入口和监管 / 产品页面推断，而不是 Neo 已发布的销售流程图。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU011
      - CU027
      - CU033
      - CU046
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 采用流程比数字漏斗更站得住脚：公开证据能支持连续采用阶段，却不足以给出可靠的阶段转化率。
    data:
      nodes:
        - id: segment-interest
          label: 客群兴趣
          detail: Neo 公开面向家族办公室、私人财富、机构、企业和 HNI 另类投资者。
        - id: advisory-conversation
          label: 咨询对话
          detail: 潜在客户通过内容、介绍或直接联系流程互动，这些流程按财富、家族办公室或产品需求定制。
        - id: entity-selection
          label: 实体选择
          detail: 根据委托需求，客户关系在财富、分销、PMS、AIF 或 GIFT 架构之间选择。
        - id: go-live
          label: 上线
          detail: 披露的资产和顾问数量说明平台已具备有意义规模，并非只停留在试点阶段。
        - id: wallet-expansion
          label: 钱包份额扩张
          detail: 另类产品、报告和产品分销的广度，让同一客户关系内的钱包份额增长成为可能。
        - id: retention-test
          label: 留存检验
          detail: 续约环节公开证据变薄，因为缺少分期队列、流失率和集中度披露。
      edges:
        - from: segment-interest
          to: advisory-conversation
          label: 客群专属主张
        - from: advisory-conversation
          to: entity-selection
          label: 需求与适配性
        - from: entity-selection
          to: go-live
          label: KYC / 开户
        - from: go-live
          to: wallet-expansion
          label: 更广产品入口
        - from: wallet-expansion
          to: retention-test
          label: 续约与顾问连续性
    approximationNotes: 该流程只反映公开材料支持的阶段逻辑；已审阅来源中，Neo 未披露线索到出资、开户或追加销售的转化率。
    claimRefs:
      - CU004
      - CU008
      - CU009
      - CU027
      - CU028
      - CU033
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: Neo 的公开客户证明在客群定向和平台广度上最强，在具体部署规模上参差不齐，在具名终端客户和留存可见度上最弱。
    data:
      columns:
        - 证据具体度
        - 规模可见度
        - 留存可见度
      rows:
        - label: 家族办公室客群页面
          values:
            - 高
            - 中
            - 低
        - label: UHNI/HNI 财富管理文案
          values:
            - 中
            - 中
            - 低
        - label: 独立 PMS 门户
          values:
            - 中
            - 中
            - 低
        - label: 机构 / 企业定向
          values:
            - 中
            - 低
            - 低
        - label: 具名终端客户引用
          values:
            - 低
            - 低
            - 低
    approximationNotes: 矩阵值判断的是已审阅公开文件的证据质量，不评价 Neo 的实际客户结果。
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU020
  - id: FU004
    title: 留存 / 重复使用队列
    type: cohort
    layout: wide
    summary: 未找到公开的按时间分桶留存队列，因此本图改为给公开证明层中的重复使用证据打分。
    data:
      columns:
        - 客群定向
        - 活跃产品证明
        - 留存可见度
      rows:
        - label: 官方客群页面
          values:
            - 100
            - 55
            - 10
        - label: 监管 / 开户页面
          values:
            - 75
            - 80
            - 20
        - label: 独立 PMS 门户
          values:
            - 40
            - 70
            - 20
        - label: 具名终端客户引用
          values:
            - 0
            - 0
            - 0
    approximationNotes: 这是按公开证明存在比例打分的证据深度队列，并非收入、客户标识或资产留存队列。
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU023
      - CU050
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: Neo Group 主要风险项按可能性和严重度定位的定性热力图。
    data:
      columns:
        - 低严重度
        - 中严重度
        - 高严重度
      rows:
        - label: 低可能性
          values:
            - 交易所 / 存管会员资格暂停
            - AMFI/BASL 未续期
            - 融资时间线披露含混
        - label: 中可能性
          values:
            - 营销内容来源疑虑
            - 创始人 / 高管离任
            - 新任 CEO 整合
        - label: 高可能性
          values:
            - 集团盈利能力未披露
            - IFSCA / GIFT City 执法
            - 资深银行家流失
    approximationNotes: 定性热力图；位置是分析师基于五张风险登记表中的严重度评级作出的评估，不是量化评分模型。
    claimRefs:
      - CR007
      - CR034
      - CR022
      - CR023
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Neo Group 的监管、运营和人才风险如何传导到利润率、融资和估值结果。
    data:
      nodes:
        - id: regulatory
          label: 监管 / IFSCA 执法
          detail: IFSCA 警告和多实体合规面抬高执法和牌照风险。
          tone: warning
        - id: dataQuality
          label: 数据质量 / 运营缺口
          detail: 第三方 AUM 数据不一致，安全姿态也未披露，降低了尽调信心。
          tone: warning
        - id: talent
          label: 人才战 / 招聘潮
          detail: 新资本支撑的合伙人式薪酬，让资深银行家的争夺更激烈。
          tone: warning
        - id: trust
          label: 投资者 / 客户信任
          detail: 监管和数据质量缺口压低机构和客户信心。
          tone: warning
        - id: margin
          label: 利润率压力
          detail: 全行业合规负担和人才成本通胀挤压财富管理机构利润率。
          tone: negative
        - id: financing
          label: 融资依赖
          detail: 高资本强度让 Neo 依赖连续的机构融资轮。
          tone: negative
        - id: growth
          label: AUM 增长韧性
          detail: 增长取决于能否留住新招资深银行家，以及 HNWI 财富周期顺风能否延续。
          tone: warning
        - id: valuation
          label: 估值风险
          detail: 2026 年 3 月的独角兽级估值没有任何已披露盈利指标支撑。
          tone: negative
      edges:
        - from: regulatory
          to: trust
        - from: dataQuality
          to: trust
        - from: talent
          to: margin
        - from: talent
          to: growth
        - from: trust
          to: growth
        - from: margin
          to: financing
        - from: financing
          to: valuation
        - from: growth
          to: valuation
        - from: regulatory
          to: financing
    approximationNotes: 传导路径由分析师根据本章的主张和风险登记表推断；没有可用的公司披露风险模型来验证该流程。
    claimRefs:
      - CR007
      - CR022
      - CR036
      - CR034
      - CR033
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Neo Group 在资本、监管和基础设施上的关键依赖。
    data:
      nodes:
        - id: capital
          label: 机构资本提供方
          detail: MUFG Bank、Euclidean Capital、Peak XV Partners、Crystal Investment Advisors、TVS Capital 等投资方。
          tone: warning
        - id: sebi
          label: SEBI 注册
          detail: PMS、投资顾问、Category III AIF、股票经纪和 DP 注册。
          tone: neutral
        - id: ifsca
          label: IFSCA / GIFT City 分支机构
          detail: 基金管理实体注册；受一份有记录的 2025 年 5 月警告约束。
          tone: warning
        - id: exchanges
          label: 交易所与存管机构
          detail: NSE、BSE、MCX 会员资格；CDSL 和 NSDL 存管参与人注册。
          tone: neutral
        - id: rta
          label: KFintech (RTA)
          detail: Category III AIF 投资者服务的注册及过户代理机构。
          tone: neutral
        - id: amfi
          label: AMFI / BASL
          detail: 共同基金分销和经纪协会会员资格。
          tone: neutral
        - id: talentPool
          label: 资深银行家人才池
          detail: 最近靠合伙人式薪酬招入；可能被竞争对手挖走。
          tone: warning
        - id: operatingEntities
          label: Neo Group 运营实体
          detail: 覆盖财富、资产管理、经纪和金融科技的六个以上受监管法律实体。
          tone: neutral
      edges:
        - from: capital
          to: operatingEntities
        - from: sebi
          to: operatingEntities
        - from: ifsca
          to: operatingEntities
        - from: exchanges
          to: operatingEntities
        - from: rta
          to: operatingEntities
        - from: amfi
          to: operatingEntities
        - from: talentPool
          to: operatingEntities
    approximationNotes: 依赖结构汇总自 Neo Group 自有监管通知和实体页面；内部共享服务或合同依赖细节未公开披露。
    claimRefs:
      - CR019
      - CR003
      - CR020
      - CR021
      - CR005
      - CR023
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 已披露增长、可比公司倍数和未解决缺口如何合并成该章的「跟踪 / 继续研究」建议。
    data:
      nodes:
        - id: n1
          label: 已披露 AUM/ARR AUM 增长 + 一线投资方联盟
          detail: 2024 年以来两轮融资估值上升；投资方包括 MUFG、Peak XV、Euclidean、TVS Capital
        - id: n2
          label: FY23 以来收入和利润率未披露
          detail: 证据包中未找到 FY24-FY26 损益表
        - id: n3
          label: 上市同业倍数高但已披露
          detail: 360 ONE 基于经审计 FY26 结果约 42x P/E，Nuvama 约 26x P/E
        - id: n4
          label: 监管和数据质量警讯
          detail: 2025 年 5 月 IFSCA 警告；第三方 PMS AUM 报告不一致
        - id: n5
          label: 作者估算的 EV/Revenue 和 EV/ARR-AUM 高于同业区间
          detail: 估算 EV/Revenue 约 35x-70x，而上市同业约 9x-16x
        - id: n6
          label: 建议：跟踪 / 继续研究；以信息披露作为入场条件
          detail: 信心中等，风险评级中高，估值立场偏高
      edges:
        - from: n1
          to: n3
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: 流程把多因素判断简化为六个节点；完整推理见建议摘要和投资论点表。
    claimRefs:
      - CV001
      - CV005
      - CV050
      - CV023
      - CV027
      - CV040
      - CV047
      - CV052
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Neo Group 的作者估算倍数与上市可比公司的已披露倍数对照。
    data:
      items:
        - label: Neo Group（估算，低端收入 Rs 150cr）
          value: 70
          detail: 以 Rs 10,500cr 投后估值除以作者估算 FY26 收入区间低端，得到隐含 EV/Revenue
          tone: risk
        - label: Neo Group（估算，高端收入 Rs 300cr）
          value: 35
          detail: 以 Rs 10,500cr 投后估值除以作者估算 FY26 收入区间高端，得到隐含 EV/Revenue
          tone: risk
        - label: 360 ONE WAM（滚动 P/E）
          value: 42
          detail: Financial Express：滚动收益约 42x，对比 5 年中位数 32.7x
          tone: neutral
        - label: 360 ONE WAM（隐含 EV/Revenue）
          value: 16.4
          detail: 作者计算：PAT x P/E，再除以 FY26 收入
          tone: neutral
        - label: Nuvama Wealth Management（滚动 P/E）
          value: 26
          detail: Financial Express：滚动收益约 26x
          tone: neutral
        - label: Nuvama Wealth Management（隐含 EV/Revenue）
          value: 8.7
          detail: 作者计算：运营 PAT x P/E，再除以 FY26 收入
          tone: neutral
    approximationNotes: Neo Group 柱状条基于作者估算收入区间，而非已披露财务数据；同业 EV/Revenue 数字由作者根据已披露 PAT、P/E 和收入推导，并非公司报告倍数。
    claimRefs:
      - CV052
      - CV023
      - CV027
      - CV022
      - CV026
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: Neo Group 下一轮估值的牛市 / 基准 / 熊市区间，并列展示作者估算的 FY26 收入带。
    data:
      items:
        - label: 悲观情形：下一轮估值
          low: 6000
          high: 9000
          mid: 7500
          detail: 相对于 2026 年 3 月 Rs 10,000cr 投前估值标记，增长放缓、监管升级或收入低于预期
          tone: negative
        - label: 基准情形：下一轮估值
          low: 10000
          high: 13000
          mid: 11500
          detail: AUM/ARR AUM 增长延续 2024-2026 年类似节奏
          tone: neutral
        - label: 乐观情形：下一轮估值
          low: 15000
          high: 22000
          mid: 18000
          detail: 行业估值向 Bernstein 提出的十年 AUM 增长情形重估，且 Neo 披露可与同业比较的盈利能力
          tone: positive
        - label: 作者估算 FY26 收入
          low: 150
          high: 300
          mid: 220
          detail: 用披露的 FY23 收入（Rs 65cr）按已披露客户 / 咨询资产 2024-2026 年观察到的增长放大推算；因没有中期披露，区间较宽
          tone: opportunity
    approximationNotes: 所有区间（单位 Rs crore）都是作者判断，锚定已披露融资历史和估算收入区间，并非公司指引或正式 DCF。
    claimRefs:
      - CV055
      - CV032
      - CV051
      - CV001
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 支撑估值观点的核心披露和估算数据。
    data:
      items:
        - label: 2026 年投前估值
          value: Rs 10,000 cr
          detail: TVS Capital 轮，2026 年 3 月
          tone: neutral
        - label: 2026 年融资规模
          value: Rs 500 cr
          detail: 由 TVS Capital 领投
          tone: neutral
        - label: 已披露 ARR AUM
          value: Rs 50,000 cr
          detail: 随 2026 年 3 月融资轮披露
          tone: positive
        - label: 已披露客户资产总额
          value: Rs 1,00,000 cr
          detail: 随 2026 年 3 月融资轮披露
          tone: positive
        - label: 2024 年咨询资产
          value: Rs 35,000 cr
          detail: 2024 年 8 月 MUFG 领投轮披露
          tone: neutral
        - label: 资深财富顾问
          value: ~150
          detail: 根据 2026 年 3 月披露
          tone: neutral
        - label: FY23 已披露收入
          value: Rs 65 cr
          detail: 最后一项已披露集团收入数据（Entrackr）
          tone: risk
        - label: 作者估算 FY26 收入区间
          value: Rs 150-300 cr
          detail: 仅为估算；非公司披露
          tone: risk
    approximationNotes: KPI 数值结合已披露数字和一项明确标注的作者估算（FY26 收入区间）。
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV003
      - CV013
