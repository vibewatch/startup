            body: >-
              Neo 的公开客户地图，比零售财富应用或单一产品经纪商更宽。官方客群页面明确点名家族办公室、私人财富客户、机构、企业，以及成熟的 UHNI/HNI 客户。家族办公室 语言很重要，因为 Neo
              没有把这类客户描述成普通富裕家庭，而是描述成准机构客户，需要专业基础设施、定制投资框架、灵活性和全天候服务。按买方、用户、付款方拆分，指向的是家族负责人、家族办公室
              CIO/CFO、企业主办公室或资金部门负责人作为买方和付款方，家族负责人及其运营团队则日常使用报告、咨询和执行支持。公开实体栈也说明这种分层为什么有商业意义：Neo
              能围绕同一关系提供财富咨询、经纪、存管服务、产品分销、PMS、AIF、私人信贷和 GIFT City 结构。原始联系页面进一步证明这是刻意的获客设计：它展示 12
              个线下地点分组，并为财富管理、家族办公室服务和投资 Neo 产品设置独立咨询路径。
