      - number: '7.6'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的财务模型重资本、且财务披露不透明。公开报道记录了 2024 年 8 月至 2026 年 3 月之间至少 5 次融资事件：2024 年 8 月由 MUFG Bank / Euclidean
              Capital 领投的约 ₹400 crore（$47.6-48 million）融资（Moneycontrol 另有一篇 2024 年 12 月关于看似相关融资的文章，但无法与 8 月报道干净对齐）； 2025
              年 2 月以约 $640 million 估值完成约 $20 million 融资；2025 年 8 月与 11 月的后续轮次，其中一轮由 Crystal Investment Advisors 领投； 以及
              2026 年 3 月 TVS Capital 以 ₹10,000 crore（约 $1.08 billion）投前估值投资 ₹500 crore（$53 million），使 Neo 成为独角兽，并由 9
              家以上独立媒体交叉印证。 已披露的 AUM / 客户资产数字同样大幅跃升——从约 ₹51,500 crore（财富加另类资产，约 2025 年 5 月报道）到约 ₹1 lakh crore 客户资产（2026 年
              3 月报道）——作为增长叙事可以成立， 但没有对齐到一个单一、合并、经审计数字。Neo Alternative Asset Managers 还运营私募信贷和困境债策略（Neo Dynamic Strategy
              Fund、Neo Treasury Plus Fund）， 天然带有信用质量和 NAV 损失敞口，而公开披露没有拆分。已审阅来源均未披露 Neo Group 合并收入、EBITDA 或现金消耗；EY
              财富科技研究还记录了刚性成本结构、合规负担和人才竞争带来的行业性利润率压缩， 这正好作用于 Neo 的多牌照、高招聘模型。表 TR005 详列这些风险。
