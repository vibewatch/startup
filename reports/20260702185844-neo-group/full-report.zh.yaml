      - number: '2.2'
        title: 多视角规模与集中度
        blocks:
          - type: paragraph
            body: >-
              印度私人财富机会很大，但前提是先说清口径。Knight Frank 给出的是人口口径：2024 年 85,698 名 HNWI、2026 年 19,877 名 UHNWI，且两类人群仍在增长。Bernstein
              给出的是流动财富口径：约 300 万个超富家庭持有 $2.7 trillion 流动金融财富，其中很大一部分仍由自己管理或由非组织化渠道服务。EY 给出的是更宽的资产池口径：超过 $1 trillion 的
              HNI/UHNI 池、管理型投资从 FY2022 的 $1.7 trillion 增至 FY2027 的 $3.9 trillion，以及家庭金融资产到 2028 年达到 $6
              trillion。这些不是可以互换的 TAM。它们是层层嵌套的边界，从 Neo 能直接追逐的狭窄人口，扩展到支撑整个行业的更广金融化背景。集中度同样关键：Mumbai 一城就占印度超富人群的 35.4%，前 1%
              家庭控制约 60% 总财富，所以触达密度和全国总量一样重要。
