  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的投资逻辑站在结构性顺风上：Bernstein 估算，印度专业财富管理机构 AUM 将在未来十年从约 $300 billion 增至 $1.6 trillion；叠加公司自身增长故事：
              已披露客户资产从 2024 年 8 月约 Rs 35,000 crore 咨询资产，增长到 2026 年 3 月 TVS Capital 轮时约 Rs 1,00,000 crore 总客户资产和 Rs
              50,000 crore ARR AUM； 背后银团如今包括 MUFG Bank、Peak XV Partners、Euclidean Capital 与 TVS Capital。Neo 约 150
              名资深财富顾问和 600 多名专业人员，说明公司确实在针对庞大的 UHNI、家族办公室和机构客户基础做扩张。反论点同样具体：Neo Group 自 FY23 单一数据点（Rs 65 crore 收入、亏损收窄至
              Rs 3.6 crore）之后，未披露集团层面收入、利润率或盈利数据， 因此本章所有头部 AUM 与 ARR AUM 数字都是公司自报，而非经审计数字。披露缺口之上，还叠加了 2025 年 5 月 IFSCA 对
              Neo Asset Management IFSC 分支的警告且未确认公开整改， 以及同一 Neo Asset Management 业务在第三方 PMS AUM
              数据中出现重大不一致。与此同时，资本充足、透明度高得多的上市同业（360 ONE WAM、Nuvama、Anand Rathi） 和私人银行在位者（Motilal Oswal、Kotak、Julius
              Baer、DBS）都在争夺同一钱包；印度家族办公室治理成熟度也被普遍描述为落后于快速机构化进程。
