      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长的公开论据相当扎实。财富创造仍来自企业利润、IPO、股市参与、数字化开户轨道，以及储蓄逐步迁移到管理型投资。Capgemini 还给出更长期的结构性顺风：全球 $83.5 trillion
              大规模财富传承；Kotak 和 Hubbis 则显示，印度家庭越来越重视传承、治理和下一代参与。但采用约束同样是结构性的。信任积累很慢，产品导向销售可能一把毁掉信任，许多富裕家庭仍未运行机构化家族办公室
              流程。传承服务渗透不足，家族办公室的定义仍模糊，迁移或跨境需求又抬高监管和服务复杂度。对 Neo
              的实际含义是，市场增长本身不保证捕获。胜出的平台必须把数字便利、顾问质量、可信载体、密集城市覆盖，以及足以替代自我管理或碎片化非正式建议的产品宽度结合起来。
