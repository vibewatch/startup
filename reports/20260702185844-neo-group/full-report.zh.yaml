        title: Neo 对阵组织化既有玩家
        blocks:
          - type: paragraph
            body: >-
              Neo 自身公开披露和融资报道把它定位为拥有多种载体的高端财富平台，而不是纯消费者投资应用。The Economic Times 和 Business Standard 都在 2024 年把 Neo 的财富
              AUA 放在约 ₹35,000 crore，另类资产 AUM 超过 ₹6,000 crore；其官方页面则展示经纪、投资咨询、PMS 和 AIF 结构。这有意义，但与上市的本土既有机构相比仍小得多。360 ONE
              报告 FY26 AUM 为 ₹6.74 lakh crore，客户家族超过 8,500 个。Nuvama 将客户资产表述为 ₹4.5-plus trillion，并有 1,250 名 RM。Anand Rathi
              和 Motilal 在绝对规模上小于 360 ONE 或 Nuvama，但仍分别运营约 ₹1 lakh crore 和 ₹1.96 lakh crore。竞争含义很清楚：Neo
              不是进入空白市场。它攻击的是一个既有规模玩家已经把深 RM 覆盖与多载体产品宽度结合起来的领域。
