      - number: '8.2'
        title: 建议、置信度与风险评级
        blocks:
          - type: paragraph
            body: >-
              本章建议是跟踪 Neo Group 并继续研究，而不是直接承销 2026 年 3 月条款。对该建议的置信度为中等：支撑来自多家媒体对 2024 年 8 月和 2026 年 3 月两轮融资及头部 AUM
              数字的一致印证； 抵消因素是这些数字完全由公司自报，唯一披露的损益数据点停留在 FY23。风险评级为中高，反映出强劲行业顺风与公司特定监管敞口（尚未解决的 IFSCA
              警告）、竞争日益激烈的资深银行家招聘市场中的人才留存风险、 以及独立追踪平台暴露的 PMS 数据质量问题。估值立场偏紧：作者估算 EV / revenue 倍数约 35x-70x，EV / ARR-AUM 比率约
              0.21x，均高于 360 ONE WAM 与 Nuvama 已披露 FY26 财务所隐含的可比区间；但底层 Neo Group
              收入数字本身是估算，而非披露事实。此处不主张目标回报、持有期或退出路径，因为证据包中没有找到 Neo Group 特定的公开二级交易或上市窗口。
