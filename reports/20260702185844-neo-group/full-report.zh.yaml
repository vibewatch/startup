              和私人信贷等管理型产品迁移的大趋势，因为富裕资金正从纯传统储蓄工具转出。它也让运营同时依赖多个监管者和市场基础设施：SEBI 监管 PMS、顾问和 AIF 规则；交易所和存管机构支撑执行层；SCORES
              负责投诉升级；IFSCA 负责 IFSC 活动。因此，公开产品地图很宽，但外部对业绩和规模的可观察性很弱。第三方 PMS 目录对 Neo 的
              AUM、客户数和策略数量分歧很大，所以外部数据只能作为方向性信息。公开记录还显示 IFSC 分支涉及一项 IFSCA 警告，但缓存证据没有给出足够细节来评估整改质量。
