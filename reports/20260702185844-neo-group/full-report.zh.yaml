  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入轨道与监管载体组合
        blocks:
          - type: paragraph
            body: >-
              Neo 的公开界面说清了一件事：这不是单一收费咨询业务。Neo Wealth Management 列出经纪、存管参与人、投资咨询和研究能力。Neo Wealth Partners
              又增加了一个咨询和分销实体，明确提到共同基金、PMS 和 AIF 产品。Neo Asset Management 再叠加 PMS、Category II 和 Category III AIF，以及一个 IFSC
              基金管理实体。换句话说，平台似乎能在重叠的富裕客户关系中，通过执行、咨询、分销、管理账户和另类资产制造来变现。


              问题在于，公开披露对实际变现的透明度远低于对载体的披露。HNI Portfolio 给出一个可用的 PMS 费率锚点——1% 固定费加可变利润分享，以及 ₹50 lakh 最低投资门槛——但 Neo
              自己的官方界面没有发布等价的管理费、咨询费或业绩分成安排。因此，财务分析师能画出活动应如何转化为费用池，却还看不到哪条收入轨道主导毛利，也看不到另类资产业务相对财富业务是否已经提升利润率。
