      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的增长模型依赖一组集中的外部关系。自 2024 年 8 月以来，其机构资本基础来自少数重复和新增投资者——Peak XV Partners、MUFG Bank、 Euclidean
              Capital、Crystal Investment Advisors 与 TVS Capital——覆盖至少 5 次融资事件，而不是一个宽基银团。因此，任一投资者退出或未来融资失败，
              都可能限制增长资金。GIFT City 离岸基金管理业务完全依赖 IFSCA 牌照，而该牌照已经收到一项有记录的警告。Category III AIF 的基金行政外包给 KFin
              Technologies，这是一家单一具名登记与过户代理；共同基金分销则依赖 AMFI 与 BASL 注册持续有效。最尖锐的是，Citywire Asia 报道称，Neo 面向资深私人银行家的快速招聘，
              靠新增资本和合伙制薪酬模型支撑——同样的机制让 Neo 能从现有私人银行挖人，也可能让竞争对手轻易把人才从 Neo 挖回去，尤其当未来融资延迟，或竞争对手给出更高合伙权益时。 表 TR003 和依赖关系图（图
              FR003）概括这些通道。
