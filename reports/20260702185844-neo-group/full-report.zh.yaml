      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的运营风险主要落在数据质量不一致和技术控制披露不足，而非已经确认的事故。公开 PMS 聚合平台对同一实体给出明显冲突的数据： IPOPlatform 将 Neo Asset
              Management Private Limited 列为 ₹0 crore AUM、0 名客户，而 Business Today 列示为一个计划下 ₹5,275.22
              crore——这种差异说明公开第三方财富管理数据整体不可靠，也意味着任何来自聚合平台的单一 AUM 数字都不应被视为 Neo 的权威口径。 另一个小但未解决的内容准确性问题是，第三方营销页面
              HNIPortfolio 将 “QGLP” 投资理念标签归于 Neo Asset PMS，但没有独立出处验证。 NeoFinity 作为 Neo Group
              的支付与金融科技部门，官网未披露独立安全认证、审计结果或事故历史，技术风险画像仍不透明。Neo 需要在 6 个以上独立持牌实体 （PMS、IA、经纪、AIF、GIFT City
              分支、金融科技）之间协调合规与运营，这本身就是运营复杂性风险，而已审阅公开披露没有正面回应。表 TR002 详列这些失效模式。
