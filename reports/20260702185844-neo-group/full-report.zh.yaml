      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Neo Group 的受监管实体持有四类 SEBI 牌照和一个 IFSCA 牌照的有效注册：Neo Wealth Partners（投资顾问 INA000017958、BASL 会员、AMFI
              ARN118471）、Neo Alternative Asset Managers（投资组合管理人 INP000007641，2022 年 11 月起永久有效）、Neo Alternatives
              Investment Trust（Category III AIF IN/AIF3/21-22/1001，2022 年 2 月起永久有效）、Neo Wealth Management（股票经纪
              INZ000306537，具备 NSE / BSE / MCX 会员资格及 CDSL / NSDL 存管参与人注册），以及 GIFT City IFSC 分支（IFSCA Fund Management
              Entity FSCA/FME/II/2023-24/084）。底层 SEBI 规则（Portfolio Managers 2020、Investment Advisers 2013、Alternative
              Investment Funds 2012）过去一年均有修订，Neo 的合规义务仍是移动靶。最关键的是， IFSCA 自身文件门户显示，2025-05-07 有一份题为 “IFSCA issues warning
              to Neo Asset Management Private Limited (IFSC Branch)” 的新闻稿；TaxGuru 法律评论标题暗示问题与该分支的 “personnel presence”
              有关，但未能取得 IFSCA 完整命令或独立法律分析来确认具体违规点或整改状态——这被记为重大证据缺口。另据 Neo Group 2025 年 9 月公开披露， 有欺诈性 WhatsApp / Telegram
              群组冒用其品牌开展未经授权的交易计划，公司引导受影响投资者转向自身投诉渠道、SEBI 的 SCORES 门户、在线争议解决机制，以及全国网络犯罪门户 / 1930 热线。运营 6
              个以上持牌实体，会放大任何单一合规失误演变为重大事件的风险。 表 TR001 按严重程度排列这些事项。
