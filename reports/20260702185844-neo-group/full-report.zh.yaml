  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 服务定义与产品栈
        blocks:
          - type: paragraph
            body: >-
              Neo 把自己呈现为一个面向家族办公室、机构、企业以及 UHNW/HNW 客户的知识驱动、技术赋能财富与资产管理平台。公开材料显示，客户主张刻意分散在多个受监管实体中，而不是包装成一个单一的一揽子产品。Neo
              Wealth Partners 负责咨询和分销；Neo Wealth Management 暴露经纪、存管参与和投资咨询等执行界面；Neo Alternative Asset Managers 承载
              PMS、Cat II、Cat III 和 GIFT City 另类资产；NeoFinity 则被定位为独立金融科技和支付部门。这很重要，因为 Neo
              的服务定义以工作流为中心：咨询、分销、执行、制造另类资产，然后把客户留在同一品牌家族里。集团还把家族办公室工作描述为重基础设施、机构化的事务，而不只是组合构建。这种宽度是真实的商业差异点，但也意味着尽调必须先追踪每项活动、投诉渠道和监管边界分别归属哪个法律实体，再假设产品体验是无缝的。
