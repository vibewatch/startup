chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、价值主张与平台边界
        blocks:
          - type: paragraph
            body: >-
              Neo 的官方界面对公司想成为什么说得异常清楚，尽管审计经营指标仍偏少。首页把 Neo 定位为印度领先的财富与资产管理平台，随后立刻把集团拆成财富管理、资产管理、Neo Wealth Partners 和
              NeoFinity。目标客群也很明确：家族办公室、私人财富客户、机构和企业。这种宽度很重要，因为 Neo 不是把自己讲成单一 RM
              精品机构，而是一个多实体平台，覆盖执行、分销、产品制造，并最终延伸到支付邻接业务。


              客户主张也有鲜明风格。Neo 的 Why Neo 和 Who We Serve 页面反复强调机构级定制方案、透明度，以及大型印度家族办公室越来越像机构一样运作。财富管理页面则把话术 收紧成更具体的说法：面向成熟
              HNI 和 UHNI 客户，由知识驱动、技术赋能的咨询模型。再加上公开和私募市场、全球投资、另类资产以及自有技术层的明确表述，公开记录支撑的公司身份不是大众金融科技 分销，而是高接触咨询加产品准入。
