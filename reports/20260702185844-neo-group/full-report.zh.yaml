      - number: '1.4'
        title: 里程碑、控制与负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支持这样一个判断：Neo 一直在并行搭能力，而不是只堆融资轮。公开时间线显示，公司早期取得另类投资和 PMS 注册，2023 年获得 Peak XV 轮，2024 年完成 MUFG-Euclidean
              轮，随后发布关于合并组合报告的公开说明，并在 2026 年完成带有明确治理表述的 TVS 轮。这个顺序符合一家企业在全面扩张 UHNI
              业务之前，先把产品制造和报告能力机构化的路径。人才叙事也吻合这条时间线：Shajikumar Devakar 2026 年以联合创始人兼财富业务 CEO 身份加入，更像是有意增强运营班底，而不是随机的头衔变化。


              负面信号真实存在，但边界仍然可控。Moneycontrol 称 Neo 在 2024 年末寻求 NBFC 牌照，但本次复核的材料并未确认该路径是否获批或启动。更重要的是，IFSCA 在 2025 年 5 月对
              Neo Asset Management 的 IFSC 分支发布警告通知，但留存证据没有解释底层问题，也没有说明是否已经整改。Neo 自己在 2025 年 9
              月发布的反欺诈警示性质不同——它显示品牌可见度上升、需要保护投资者，并不必然代表公司存在不当行为——但仍应进入风险登记。合理结论是：Neo
              的故事仍具可投资性且逻辑连贯，但披露还没有完整到可以免除对治理、监管控制或审计经济性的跟进。
