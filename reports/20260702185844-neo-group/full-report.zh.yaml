        title: 替代品与现状惯性
        blocks:
          - type: paragraph
            body: >-
              只列公司名的竞争地图会漏掉现状惯性。Bernstein 明确说，印度富裕家庭财富中有很大一部分仍由自己管理，或由非组织化渠道处理。Hubbis 还指出，许多家族办公室
              仍在演进，运作方式往往更像成熟的私人银行关系，而不是完全机构化的投资平台。这对 Neo 很重要，因为很大一部分竞争会发生在客户正式把 360 ONE 或 Nuvama
              拉来比选之前。替代品可能是家族自己的财务办公室、可信的本地顾问、企业主 的银行关系，或一个用上市股权敞口、共同基金和选择性另类资产拼出的部分自助方案。Kotak 的公开调查显示，企业主型、进取型投资者主导
              ultra-HNI 池，这进一步说明现状惯性可以很强。因此，Neo 要替代的不只是对手，还有习惯：自我管理、碎片化外部专家，以及客户已经信任的旧关系。
