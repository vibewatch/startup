company:
  name: Neo Group
chapter:
  number: 7
  title: Risks
  summary: >-
    Neo Group operates six-plus SEBI- and IFSCA-regulated entities and carries a documented but only partly disclosed May 2025 IFSCA enforcement warning against its GIFT City branch, a capital-funded
    senior-banker hiring spree that cuts both ways on talent risk, and a complete absence of group-level profitability disclosure despite a March 2026 unicorn-level TVS Capital valuation. Inconsistent
    third-party AUM data, unresolved founder-succession planning, and industry-wide margin-compression pressure round out the top risks; monitorable triggers center on further IFSCA/SEBI action,
    financing continuity, senior-banker attrition, and financial-disclosure opacity.
sections:
  - id: overview-and-severity-ranking
    title: Overview and Severity Ranking
    body: >-
      Neo Group is a fast-growing, multi-entity Indian wealth and asset-management platform operating under at least six distinct SEBI- and IFSCA-regulated legal entities, spanning investment
      advisory, portfolio management, stock broking, Category III AIF, a GIFT City IFSC fund-management branch, and a fintech/payments arm. This chapter ranks risk severity across five domains —
      regulatory/legal, operational/quality/security, partner/dependency, people/execution, and financial/model — and finds three risks warrant the closest monitoring: a documented May 2025 IFSCA
      enforcement warning against Neo Asset Management's IFSC branch whose full legal basis remains unverified; a complete absence of any public group-level revenue, EBITDA, or cash-burn disclosure
      despite a March 2026 unicorn-level (₹10,000 crore pre-money) valuation from TVS Capital; and a capital-funded senior-banker hiring spree that both drives growth and exposes Neo to poaching by
      competitors using the same partnership-style pay tactics. Lower-severity but still material risks include inconsistent third-party AUM data across public aggregators and unresolved
      founder/executive succession planning. The risk heatmap (Figure FR001) positions these items by qualitative likelihood and severity for investment-committee review.
    claimRefs:
      - CR007
      - CR034
      - CR006
      - CR022
      - CR033
    figureRefs:
      - FR001
  - id: regulatory-and-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      Neo Group's regulated entities carry active registrations across four SEBI licence categories and one IFSCA licence: Neo Wealth Partners (Investment Adviser INA000017958, BASL member, AMFI
      ARN118471), Neo Alternative Asset Managers (Portfolio Manager INP000007641, perpetual since Nov 2022), Neo Alternatives Investment Trust (Category III AIF IN/AIF3/21-22/1001, perpetual since Feb
      2022), Neo Wealth Management (stock-broking INZ000306537 with NSE/BSE/MCX membership and CDSL/NSDL depository-participant registration), and a GIFT City IFSC branch (IFSCA Fund Management Entity
      FSCA/FME/II/2023-24/084). Each of the underlying SEBI regulations (Portfolio Managers 2020, Investment Advisers 2013, Alternative Investment Funds 2012) was amended within the past year, meaning
      Neo's compliance obligations are a moving target. Most materially, IFSCA's own document portal shows a press release dated 07/05/2025 titled 'IFSCA issues warning to Neo Asset Management Private
      Limited (IFSC Branch)'; a TaxGuru legal-commentary headline suggests the issue relates to 'personnel presence' at the branch, but neither the full IFSCA order nor independent legal analysis
      could be retrieved to confirm the precise compliance failure or remedial status — this is recorded as a material evidence gap. Separately, Neo Group publicly disclosed in September 2025 that
      fraudulent WhatsApp/Telegram groups were misusing its brand for unauthorised trading schemes, directing affected investors to its own grievance channel, SEBI's SCORES portal, the Online Dispute
      Resolution mechanism, and the national cybercrime portal/1930 helpline. Operating six-plus licensed entities multiplies the surface area for any single compliance lapse to become material. Table
      TR001 ranks these items by severity.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR001
  - id: operational-quality-security-risk
    title: Operational, Quality, and Security Risk
    body: >-
      Operational risk at Neo Group centres on data-quality inconsistency and undisclosed technology controls rather than any confirmed incident. Public PMS aggregators report starkly conflicting
      figures for the same entity: IPOPlatform lists Neo Asset Management Private Limited at ₹0 crore AUM across 0 clients, while Business Today lists ₹5,275.22 crore across one scheme — a discrepancy
      that illustrates the unreliability of public third-party wealth-management data generally, and means no single AUM figure sourced from an aggregator should be treated as authoritative for Neo
      specifically. Separately, a third-party marketing page (HNIPortfolio) attributes a 'QGLP' investment-philosophy label to Neo Asset PMS without independent verification of provenance, raising a
      minor but unresolved content-accuracy question. NeoFinity, Neo Group's payments and fintech arm, discloses no independent security certification, audit result, or incident history on its own
      site, leaving its technology risk profile opaque. Coordinating compliance and operations across six-plus separately licensed entities (PMS, IA, broking, AIF, GIFT City branch, fintech) is itself
      an operational-complexity risk that is not addressed in any public disclosure reviewed. Table TR002 details these failure modes.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR006
    tableRefs:
      - TR002
  - id: partner-and-dependency-risk
    title: Partner and Dependency Risk
    body: >-
      Neo Group's growth model depends on a concentrated set of external relationships. Its institutional capital base draws from a small number of repeat and new investors — Peak XV Partners, MUFG
      Bank, Euclidean Capital, Crystal Investment Advisors, and TVS Capital — across at least five funding events since August 2024, rather than a broad syndicate, so any single investor's withdrawal
      or a failed future round could constrain growth capital. Its GIFT City offshore fund-management activity depends entirely on the IFSCA licence that has already drawn one documented warning. Fund
      administration for the Category III AIF is outsourced to KFin Technologies, a single named registrar and transfer agent, and mutual-fund distribution depends on continued AMFI and BASL
      registration. Most acutely, Citywire Asia reports that Neo's rapid hiring drive for senior private bankers is funded by fresh capital and a partnership-style pay model — the same dynamic that
      let Neo poach talent from incumbent private banks could just as easily let competitors poach it back from Neo, especially if a future funding round is delayed or a competitor offers a richer
      partnership stake. Table TR003 and the dependency map (Figure FR003) summarise these channels.
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
    tableRefs:
      - TR003
    figureRefs:
      - FR003
  - id: people-and-execution-risk
    title: People and Execution Risk
    body: >-
      Neo Group was founded in October 2021 by Nitin Jain (Chairman & Managing Director), who previously built a platform managing over USD 40 billion in client assets, alongside co-founders Varun
      Bajpai (25+ years, ex-Macquarie Country Head), Hemant Daga (ex-CEO of Edelweiss Asset Management, built a USD 4 billion alternatives platform), and Puneet Jain (CIO, ex-Goldman Sachs, USD 1
      billion+ deployed across 25+ distressed-debt transactions). This concentration of institutional pedigree is a strength, but no public succession plan is disclosed for any of these four
      executives, and their simultaneous departure risk is unaddressed. Shajikumar Devakar, appointed Co-Founder and CEO of Neo Wealth Management around May 2025 after 22 years at 360 ONE Wealth and
      other private banks, has under two years of tenure as of the mid-2026 run date, carrying integration risk typical of a recent senior appointment. Most acutely, the same capital-funded hiring
      spree that lets Neo attract senior relationship managers via partnership-style pay also creates attrition risk: EY's wealthtech research finds industry-wide next-generation client attrition
      running roughly four times higher than prior generations, and there is no Neo-specific data confirming that its newly hired bankers, or their client books, are durably retained. Table TR004
      ranks these execution risks by severity.
    claimRefs:
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
    tableRefs:
      - TR004
  - id: financial-and-model-risk
    title: Financial and Model Risk
    body: >-
      Neo Group's financial model is capital-intensive and financially opaque. Public reporting documents at least five funding events between August 2024 and March 2026 — an ~₹400 crore ($47.6-48
      million) MUFG Bank/Euclidean Capital round (Aug 2024, with a Moneycontrol article on an apparently related raise dated Dec 2024 that does not cleanly reconcile with the August reporting), a ~$20
      million round at an ~$640 million valuation (Feb 2025), further rounds in August and November 2025 including one led by Crystal Investment Advisors, and a ₹500 crore ($53 million) TVS Capital
      round at a ₹10,000 crore (~$1.08 billion) pre-money valuation that made Neo a unicorn (Mar 2026, corroborated by nine-plus independent outlets). Disclosed AUM/client-asset figures also show a
      large jump — from ~₹51,500 crore (wealth plus alternatives, reported ~May 2025) to ~₹1 lakh crore in client assets (reported Mar 2026) — that is plausible as growth but is not reconciled to a
      single consolidated, audited figure. Neo Alternative Asset Managers additionally runs private-credit and distressed-debt strategies (Neo Dynamic Strategy Fund, Neo Treasury Plus Fund) that
      inherently carry credit-quality and NAV-loss exposure not broken out in any public disclosure. No source reviewed discloses Neo Group's consolidated revenue, EBITDA, or cash-burn figures, and
      EY's wealthtech research documents industry-wide margin compression from rigid cost structures, compliance burden, and talent competition that directly applies to Neo's multi-license,
      high-hiring model. Table TR005 details these risks.
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
    tableRefs:
      - TR005
  - id: mitigation-monitoring-and-kill-criteria
    title: Mitigations, Monitoring, and Kill Criteria
    body: >-
      Investors should track a small set of monitorable triggers rather than relying on Neo Group's disclosed mitigations alone, since most mitigations described in this chapter (compliance functions,
      partnership-style pay, diversified exchange memberships) are asserted rather than independently verified. The clearest thesis-break triggers are: a second IFSCA or SEBI enforcement action within
      18 months of the May 2025 GIFT City warning; failure to close an expected institutional funding round within 12 months of the March 2026 TVS Capital close, given Neo's demonstrated reliance on
      frequent capital infusions; material attrition among the 2024-2026 hiring cohort of senior bankers; continued absence of audited group-level financials at the next funding or exit event; and any
      unplanned departure of founder-executives Nitin Jain, Varun Bajpai, Hemant Daga, or Puneet Jain without a disclosed successor. Neo Group's broader risk transmission runs from regulatory and
      talent-competition pressure through investor/client trust and margin into financing dependence and ultimately valuation support (Figure FR002); because capital intensity and financing dependence
      sit at the centre of that chain, continued access to institutional capital is the single most load-bearing assumption in the current growth and valuation thesis. Table TR006 sets out concrete
      triggers and thresholds for ongoing monitoring.
    claimRefs:
      - CR040
      - CR041
      - CR034
      - CR010
    tableRefs:
      - TR006
    figureRefs:
      - FR002
