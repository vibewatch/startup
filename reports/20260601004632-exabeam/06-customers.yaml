      "id": "named-customer-evidence-and-use-cases",
      "title": "Named Customer Evidence and Use Cases",
      "body": "Named customer proof is the strongest part of Exabeam's customer story because several case studies provide enough operational detail to distinguish real production use from passive logo placement. Dayforce describes a global 24/7 SOC moving from a legacy SIEM to New-Scale Fusion and cutting investigations from hours or days to minutes while reducing false positives. NTT DATA shows a multinational IT-services buyer choosing Exabeam over multiple alternatives for pricing model, UEBA, support coverage, and multi-tenant compatibility, then rolling out more than 50 use cases. SA Power Networks, Port of Antwerp-Bruges, and Konoike Transport demonstrate fit in critical infrastructure and logistics settings where small security teams needed better correlation, automation, and faster response. BRAC Bank and Wellington College show legacy LogRhythm proof in regulated banking and education, while Grant Thornton highlights a service-provider and mid-market enablement motion. The lighter-weight 2024-2025 press-release references to BECU, ICAEW, ilionx, and Extreme Networks matter less for quantified outcomes, but they do show the combined company still has willing public references across multiple customer archetypes.",
