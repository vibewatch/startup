    "title": "Customers",
    "summary": "Exabeam's retained public customer proof is broad enough to show real enterprise adoption, but not transparent enough to fully underwrite retention quality or concentration. The current customer-story archive exposes roughly 35 public story URLs and the chapter's retained proof set spans HR software, banks, utilities, ports, education, healthcare, logistics, consulting, and global IT services across North America, Europe, APAC, and South Asia. The strongest production evidence comes from detailed case studies such as Dayforce, NTT DATA, SA Power Networks, Port of Antwerp-Bruges, Konoike Transport, BRAC Bank, Wellington College, and Grant Thornton, while 2024-2025 press materials add lighter-weight reference quotes from BECU, ICAEW, ilionx, and Extreme Networks. Independent review surfaces are directionally positive on analytics, interface, and ROI, but adverse on tuning, documentation, regional support, and pricing complexity. Exact customer count, NRR, GRR, churn, and top-account concentration remain undisclosed."
