    {
      "id": "customer-adoption-trajectory",
      "title": "Customer Adoption Trajectory",
      "body": "Public customer proof suggests a long-lived installed base that spans both legacy LogRhythm deployments and newer Exabeam cloud or AI-led upsell motions. The earliest retained proof in this chapter runs back to Wellington College's 2017 tendering process and NTT DATA's 2018 proof of concept followed by a 2019 production rollout. By 2021, SA Power Networks and Port of Antwerp-Bruges were already describing operational improvements from Exabeam SIEM, and both stories explicitly tie adoption to alert-noise reduction for lean teams. Konoike Transport shows that the company was still winning new production deployments in 2023-2024, not just maintaining old logos. The 2024 merger press release matters because it shows named reference customers willing to endorse the combined company at the moment of platform integration risk. The 2025 Nova release then shows a next-stage adoption path: existing accounts such as ilionx and Extreme Networks were not just retained, but willing to publicly discuss AI-agent features and roadmap responsiveness. That sequence supports a continuity-plus-expansion thesis, even though total cohort counts remain private.",
