    {
      "id": "customer-concentration-and-retention-risks",
      "title": "Customer Concentration and Retention Risks",
      "body": "The biggest weakness in Exabeam's public customer record is not lack of logos; it is lack of economic retention disclosure. There is no public NRR, GRR, churn, renewal-rate, cohort, or top-customer concentration disclosure in the retained materials, so durability has to be inferred from deployment depth, workflow embedding, and reference quality. That inference is directionally favorable: many reference customers are large enterprises or regulated operators that integrate SIEM deeply into SOC workflows, use-case libraries, compliance reporting, and investigation routines. Those integrations create moderate-to-high switching costs, especially where the platform acts as a single pane of glass or where teams have already tuned detections and response workflows. But the adverse review evidence shows why those switching costs are not absolute. If customers experience high false positives, migration disruption, documentation gaps, or weak regional support, renewal friction can rise sharply. Concentration risk also looks plausible because the public proof mix is dominated by large, operationally complex institutions that likely carry materially larger contract values than the median account. The diligence ask is therefore straightforward: retention and concentration data by legacy cohort, product mix, and customer size.",
