      "id": "customer-base-overview",
      "title": "Customer Base Overview",
      "body": "The most supportable way to describe Exabeam's customer base is through public proof density rather than an exact account count. The currently accessible Exabeam customer archive exposes roughly 35 story URLs, and the retained set reviewed for this chapter covers large enterprises, regulated institutions, and operationally complex organizations rather than small businesses. Visible proof spans Dayforce in HR software, NTT DATA in global IT services, SA Power Networks in regulated utilities, Port of Antwerp-Bruges in critical infrastructure, BRAC Bank in financial services, Wellington College in education, Grant Thornton in advisory services, Konoike Transport in logistics, and an anonymized U.S. healthcare organization. The 2024 merger and 2025 Nova materials add newer customer-reference quotes from Dayforce, BECU, ICAEW, ilionx, and Extreme Networks, which strengthens continuity evidence across the combined Exabeam-LogRhythm estate. What public evidence does not reveal is just as important: Exabeam does not disclose exact customer count, vertical ARR mix, geographic revenue mix, or the share of the base still running legacy LogRhythm versus new-scale Exabeam modules. The result is clear breadth, but incomplete economic visibility.",
