    {
      "id": "kill-criteria-and-mitigation-framework",
      "title": "Kill Criteria and Mitigation Framework",
      "body": "The right way to underwrite Exabeam is to separate visible mitigants from still-unproven assumptions. Public mitigants exist: Exabeam advertises region-specific hosting, 24-7 cloud-operations monitoring, customer status pages, explicit uptime targets, continued self-hosted release cadence, and privacy controls such as masking, retention settings, and encryption. Those are positive inputs, but they do not answer the most important diligence questions. What matters now is whether management can show hard evidence that legacy-customer churn is contained, migration choices are genuinely voluntary rather than coerced by roadmap entropy, regional support is staffed to product complexity, and Nova or MCP rollout is being governed with the same rigor as any other privileged interface. The thesis should be treated as broken if AI governance changes materially restrict behavior-analytics use, if legacy-base churn rises above a tolerable threshold, if Microsoft pushes bundling economics further down-market, or if sponsor behavior indicates a liquidity-driven exit before integration quality is proven. In other words, mitigation should be judged by measurable operating evidence, not by roadmap language alone. The company can still be attractive, but only if investors demand monitoring discipline that is as specific as the product claims themselves.",
