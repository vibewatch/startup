    {
      "id": "milestones",
      "title": "Key Milestones",
      "body": "The milestone record is unusually important for Exabeam because the company\u2019s current form is the result of both organic product development and the 2024 combination with LogRhythm. Publicly visible events start with founding in 2013 and a multiyear financing ladder that carried the company into unicorn territory by 2021. The defining corporate event is the July 17, 2024 completion of the Exabeam-LogRhythm merger, which SecurityWeek described as the completion of the combination and the unveiling of the new company under the Exabeam name. After the merger, the public narrative shifts toward platform consolidation and AI. The July 2025 Nova launch added six AI agents and reported faster investigations within 90 days, and the 2026 blog still shows both new-scale Exabeam and LogRhythm-branded products, implying integration is still strategic work rather than finished history. That chronology matters because it frames both upside from broader scale and execution risk from portfolio and brand integration.",
