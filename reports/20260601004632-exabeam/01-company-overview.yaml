    {
      "id": "key-metrics",
      "title": "Cover Metrics and Business Model",
      "body": "The public metric set for Exabeam is good enough to sketch company scale but not good enough to underwrite performance. Crunchbase places the employee band at 501-1000 and tags the company as a unicorn, while the company claims 1,000-plus third-party integrations, named customers across multiple industries, and trust markers that include ISO 27001 and SOC 2 Type II. The partner program design is also notable: Exabeam says its APEX model uses competency-based tiers without revenue minimums, which can help channel recruitment after the merger. Product breadth has expanded in visible ways through Nova, Advisor Agent, and agent-behavior analytics for non-human identities. Still, the gaps are material. Exabeam does not publicly disclose revenue, ARR, gross margins, or aggregate customer counts, and adverse review surfaces raise recurring questions about pricing, support coverage, false positives, and on-prem integration friction. In short, the public record supports platform relevance and go-to-market breadth more clearly than financial quality or operating consistency.",
