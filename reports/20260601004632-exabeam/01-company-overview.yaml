    "title": "Company Overview",
    "summary": "Exabeam is a 2013-founded private security operations vendor whose current identity is defined by the July 2024 merger with LogRhythm. Public evidence supports a broad post-merger platform, long venture funding history, sponsor backing from Thoma Bravo, and visible AI roadmap expansion, but revenue, ARR, governance detail, and full integration progress remain materially opaque."
  },
  "sections": [
    {
      "id": "identity-and-founding",
      "title": "Identity and Founding",
      "body": "Exabeam is a private cybersecurity company founded in 2013 in Foster City, California, and its retained public materials still anchor the brand around analytics-driven security operations rather than a narrow legacy SIEM description. The company explains that the name combines the idea of an exabyte of machine data with a beam of light used to find meaningful patterns, which is a concise articulation of its original value proposition. Founders Nir Polak, Sylvain Gil, and Barry Shteiman brought prior cybersecurity experience into that thesis. The 2024 LogRhythm merger materially changed the company\u2019s shape: Exabeam now presents itself as the combined business, with Foster City and Broomfield both relevant to headquarters identity. In 2026 the public product surface spans New-Scale Fusion, New-Scale SIEM, New-Scale Analytics, legacy LogRhythm-branded modules, UEBA, and a broader AI-led security operations narrative, making the company easier to classify as a merged security operations platform than as a single-point product vendor.",
