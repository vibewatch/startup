      "id": "leadership-and-governance",
      "title": "Leadership and Governance",
      "body": "Leadership is one of the most important moving pieces in the current Exabeam story because the company\u2019s public face changed after the LogRhythm merger closed. Merger-close materials in July 2024 identified Christopher O'Malley as CEO and Peter Harteveld as Chief Value Creation Officer, while the July 2025 Nova launch release still carried Chris O'Malley as CEO. By the retained 2026 company and leadership pages, Peter Harteveld is now CEO and is described as having helped unite Exabeam and LogRhythm in 2024 after previously serving as Chief Revenue Officer. The current bench publicly listed by Exabeam includes Kish Dill, Mike Byron, Joanne Wong, Steve Wilson, Kiley LePage, Matt Sarafian, and David Kennedy. That is enough to show a reasonably complete executive team, but not enough to fully map board composition, voting rights, succession planning, or post-merger governance mechanics. The result is a mixed picture: operating leadership is visible, but governance transparency remains materially thinner than the combined company\u2019s scale would suggest.",
