      "title": "Channel leverage helps distribution but obscures net price realization",
      "body": "APEX partner incentives are clearly designed to widen distribution without forcing public list pricing. That can lower direct CAC, but it also means outside investors cannot infer realized net revenue or margin from any published price cue.",
