    {
      "id": "financial-gaps-and-private-company-opacity",
      "title": "Financial Gaps and Private Company Opacity",
      "body": "The core financial risk is not that Exabeam lacks a business model; it is that the public record is too thin to verify the quality of that model. There is no public revenue, ARR, gross margin, NRR, CAC payback, customer concentration, or audited cash data. SEC-visible history is limited to exempt-offering style filings rather than public-company reporting. Private-market databases disagree on how to label the latest financing history and current mark, while even deal coverage names advisors but omits transaction value. Review sites help with pricing color but cannot substitute for cohort data or renewal metrics. That means the investment committee can support a directional view — enterprise subscription software with credible sponsor backing, mixed deployment economics, and real cost discipline — but not a clean underwriting case. The missing items are specific and actionable: monthly ARR bridge, gross-margin split by cloud versus self-managed, cash and debt schedule, customer cohort retention, and post-merger contract migration terms.",
