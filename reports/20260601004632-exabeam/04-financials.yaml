        "CI003",
        "CI004",
        "CI033"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Opacity is the real financial blocker, not lack of a visible business model",
      "body": "The public source pack is enough to support a directional view on Exabeam’s revenue mechanism and sponsor-backed capital access. It is not enough to validate ARR, gross margin, debt, or post-merger dilution, which is why the remaining diligence asks are all investor-grade financial controls and reporting items.",
