    {
      "id": "capital-adequacy-and-runway",
      "title": "Capital Adequacy and Runway",
      "body": "There is no public cash balance or monthly burn disclosure, so runway has to be inferred from capital access and management behavior rather than calculated directly. On the positive side, Exabeam already raised a large Series F, remains backed by a large PE sponsor, and merged with another sponsor-owned asset instead of pursuing a visible emergency raise. Product-roadmap language and partner-program investment also imply the company is still funding R&D and go-to-market. On the negative side, the 2023 layoffs are unambiguous evidence of cost pressure, and the 2024 merger disclosures withheld purchase price, leverage, and cash-use details. Blue Owl's current materials matter because Owl Rock led the 2021 round and Blue Owl explicitly presents itself as a debt-and-equity capital provider to private software companies. That makes the capital stack more complex than simple common-equity math and supports a view that Exabeam is adequately capitalized but not transparent enough to underwrite runway with precision.",
