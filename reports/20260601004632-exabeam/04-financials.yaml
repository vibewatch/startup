      "id": "funding-history-and-capital-stack",
      "title": "Funding History and Capital Stack",
      "body": "The public capital history is enough to establish direction even if it is not complete enough to reconstruct a fully reliable cap table. Live coverage confirms early venture financing in 2014 and 2015, a visible late-stage Series D and Series E in 2018 and 2019, and a $200 million Series F at a $2.4 billion valuation in 2021. Crunchbase still shows a later venture funding event in December 2021, while Thoma Bravo's portfolio pages say it invested in both Exabeam and LogRhythm in 2018 before merging the two assets in 2024. PitchBook now labels Exabeam's latest deal type as Buyout/LBO, which is the clearest signal that the company should be analyzed as sponsor-controlled rather than as a straightforward venture-backed independent. That matters because ownership concentration, any undisclosed preferred terms, and any structured capital layered in by sponsor-aligned lenders will shape exit proceeds more than headline product momentum alone.",
