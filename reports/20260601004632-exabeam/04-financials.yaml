    "number": 4,
    "title": "Financials",
    "summary": "Exabeam has a credible enterprise subscription security-operations model and remains supportable as a going concern on public evidence, but the investability question is constrained by sponsor-controlled merger economics and unusually thin disclosure. The strongest facts are the $200 million Series F at a $2.4 billion valuation and the October 2023 20% workforce reduction; the weakest area is everything investors would normally use to underwrite revenue quality, margin, cash, and dilution."
