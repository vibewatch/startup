    {
      "id": "trust-compliance-and-security-architecture",
      "title": "Trust, Compliance, and Security Architecture",
      "body": "Exabeam's public trust surface is unusually detailed for a private security vendor and is one of the more credible parts of the chapter. The company discloses role-based access control, data masking, tenant isolation, retention policies, audit trails, encryption at rest and in transit, and region-specific cloud endpoints. For Nova specifically, Exabeam says prompt data is encrypted, not cloud-cached, and not used to train foundation models. The company also publishes API-key hygiene guidance, including least-privilege scopes, one-key-per-use-case discipline, and annual rotation minimums. On the compliance side, Exabeam lists ISO 27001, 27017, and 27018, SOC 2 Type II, IRAP Protected, GDPR measures, and Data Privacy Framework participation. Service commitments are also explicit, with 99.9% monthly data-upload availability and 99.5% product-access availability. The trust story is therefore strong at the control-and-certification layer, but investors should distinguish platform security posture from product-efficacy proof: these disclosures support procurement and regulated adoption, yet they do not prove low false-positive rates, easy deployments, or successful migration outcomes across the combined Exabeam and LogRhythm installed base.",
