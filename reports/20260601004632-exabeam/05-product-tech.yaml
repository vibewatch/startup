    "number": 5,
    "title": "Product & Technology",
    "summary": "Exabeam's product story is credible because the company can show a real cloud-native platform, a still-supported self-managed heritage line, and a behavior-led operating model that extends into AI-agent monitoring and board-level reporting. The main diligence risk is not missing features but whether the New-Scale and LogRhythm code tracks can be rationalized fast enough to deliver migration proof, lower tuning burden, and turn Nova's early productivity claims into repeatable installed-base outcomes."
  },
  "sections": [
    {
      "id": "product-portfolio-and-architecture",
      "title": "Product Portfolio and Architecture",
      "body": "Exabeam now sells two clearly differentiated operating models under one commercial umbrella. The cloud-native side centers on New-Scale Fusion, which bundles SIEM, behavioral analytics, automation, and Nova-driven investigation into a modular SaaS platform. The self-managed side preserves LogRhythm SIEM, LogRhythm Intelligence, and NetMon for buyers that still need on-premises control, predictable appliance-style operations, or a slower migration path. Public materials do not hide that split; instead, they market it as optionality. The architecture story is strongest where customers want open ingestion, multi-vendor coexistence, and a phased modernization path rather than a forced rip-and-replace. Underneath that pitch, Exabeam repeatedly emphasizes CIM-based normalization, shared cloud-native apps such as collectors, search, reporting, and service health, and a behavior-led layer that enriches detections with risk, timelines, and entity context. That combination makes the portfolio coherent from a buyer perspective even though it still spans two major product families and two delivery motions.",
