    {
      "id": "ai-and-automation-stack",
      "title": "AI and Automation Stack",
      "body": "Exabeam's 2025\u20132026 product narrative is increasingly organized around Nova and Agent Behavior Analytics. Nova is not sold as a single assistant; current public pages describe a six-agent system spanning investigation, threat scoring, analyst assistance, search, visualization, and advisor functions, while the July 2025 launch positioned Advisor Agent as a CISO-facing planning and board-communication surface. That matters because Outcomes Navigator and Advisor together convert telemetry, ATT&CK coverage, and gap analysis into executive-ready output, extending the product beyond analyst productivity into governance and budget justification. ABA is the second major pillar. Exabeam is trying to move early on monitoring non-human identities and AI agents by baselining agent activity, generating machine-built timelines, and adding detections for misuse, compromise, and policy violations across platforms like ChatGPT, Copilot, and Gemini. The April 2026 update pushed that story further with OWASP Agentic Top 10 coverage, expanded AI log-source support, Nova Global Search, and automated response actions. The architectural risk is that this stack now depends not just on detection content but on quality parsers, clean entity context, safe prompt handling, and defensible governance of AI-generated recommendations.",
