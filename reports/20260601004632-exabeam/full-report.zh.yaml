  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 认证
      - 状态
      - 范围 / 机制
      - 重要性
      - 未决尽调事项
    rows:
      - - SOC 2 Type II 和 ISO 系列
        - 公开列示
        - 信任页面列出 SOC 2 Type II 以及 ISO 27001、27017、27018
        - 支撑受监管行业或企业客户的采购
        - 需要报告日期和范围边界，不能只看徽章级披露
      - - 隐私和传输框架
        - 公开列示
        - GDPR 措施，以及参与 EU-U.S.、UK 和 Swiss Data Privacy Framework
        - 有助于跨境数据处理和隐私审查
        - 需要当前法律团队审查传输机制和子处理方覆盖范围
      - - 产品内隐私控制
        - 公开描述
        - RBAC、租户隔离、数据遮蔽、留存控制、审计轨迹
        - 降低误访问风险，并支持最小权限
        - 需要实盘账户里的默认运营设置证据和管理员易用性证明
      - - 加密与韧性
        - 公开描述
        - 传输中 TLS、静态加密、99.9% 上传和 99.5% 访问 SLA、AZ 冗余
        - 增强常态在线 SOC 工作流对平台的信任
        - 需要事件历史，以及实际正常运行率相对 SLA 目标的达成情况
      - - Nova AI 防护栏
        - 公开描述
        - 加密提示、不做云端缓存、不用客户数据训练模型、尽可能区域内处理
        - 回应采购对安全运营中使用生成式 AI 的顾虑
        - 需要模型风险文档、红队结果和覆盖 / 升级控制
      - - API 治理
        - 公开文档化
        - 每个订阅 10 个密钥、最小权限指引、至少每年轮换、推荐使用密钥库
        - 改善机器到机器访问卫生
        - 需要证明客户能集中强制轮换并审查密钥使用
      - - 审计配合
        - 合同语言已公开
        - 客户数据政策提到会协助 DPIA、事件和第三方审计证据
        - 有助于企业安全和法务审查周期
        - 需要标准响应时间和尽调证据包样例
    notes: 状态仅反映公开披露；本章没有独立复核认证证书文件或审计报告。
