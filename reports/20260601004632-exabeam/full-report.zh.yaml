        - 推进管理层尽调或结构化合作，而不是盲目股权投资测算
        - 关键问题不是 Exabeam 是否重要，而是当前价格是否有并购后经济性支撑。
        - 如果公司寻求高端估值标记，却拿不出高端留存和迁移证据，应退出。
