    columns:
      - 维度
      - 评估
      - 公开证据依据
      - 上调 / 下调含义
    rows:
      - - 建议
        - 有条件正面
        - 产品和战略相关性真实存在，但价格支撑不完整、控股方不透明，意味着接触必须以尽调为先。
        - 只有在留存、云迁移、Microsoft 暴露和控制条款验证后才上调。
      - - 置信度
        - 中
        - 外部估值和市场证据足以搭起决策框架，但当前 ARR 和 NRR 仍未披露。
        - 如果管理层不给队列经济性，则下降；如果资料室指标印证迁移逻辑，则上升。
      - - 风险评级
        - 高
        - 尽管产品实力较强，整合执行、Microsoft 价格压力以及控股方退出 / 控制动态仍带来真实下行风险。
        - 只有当流失保持低位、控股方结构对新资本足够干净时才改善。
      - - 估值立场
        - 取决于证据；仅在低 $1B 区间才算合理
        - 2026 年软件倍数远低于 2021 年峰值，公开证据更支持约 $1.0-$1.5B EV，而不是历史独角兽估值标记。
        - 若增长和留存没有高端水平，超过该区间就偏高。
