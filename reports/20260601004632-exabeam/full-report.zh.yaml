  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 典型 Exabeam 企业客户路径：从意识到问题，到部署和扩展；依据保留的客户案例和引用语。
    data:
      items:
        - label: 触发
          detail: 客户通常从 SIEM 疲劳、警报过载、合规压力，或对传统工具 / MSSP 覆盖不满开始。
          touchpoints:
            - 传统 SIEM 续约或替换周期
            - 需要减少人工分诊和误报
            - 银行、公用事业、医疗和教育领域的监管或韧性压力
        - label: 评估
          detail: 客户围绕 UEBA、易用性、定价模型和支持覆盖，发起 RFP、概念验证或结构化厂商比较。
          touchpoints:
            - Dayforce 云 SIEM 现代化 RFP
            - NTT DATA 概念验证和竞品比较
            - Wellington College 招标流程
        - label: 部署
          detail: 初始上线围绕日志接入、时间线关联、用例激活，以及碎片化环境中的可见性展开。
          touchpoints:
            - NTT DATA 的 50+ 个用例
            - Port of Antwerp-Bruges 的单一视图可见性
            - SA Power Networks 的 Smart Timeline 工作流
        - label: 运营落地
          detail: 工作流和自动化调好之后，客户强调调查更快、优先级更清楚、分析师苦活更少。
          touchpoints:
            - Dayforce 调查时间降到分钟级
            - Konoike 将监控负载转入 SOC 团队
            - BRAC Bank 报告 MTTD 和 MTTR 降低
        - label: 扩展
          detail: 扩展似乎来自更深的用例覆盖、更广的数据摄取、合作伙伴主导的下游部署，或 AI/Nova 模块采用。
          touchpoints:
            - ilionx 和 Extreme Networks 的 Nova 参考案例
            - Grant Thornton 下游客户实施
            - 存量 LogRhythm 客户群可用于迁移和增购
    approximationNotes: 该图综合留存客户故事中反复出现的阶段，而不是公司披露的销售漏斗文件。顺序和触点有证据支撑，但并不穷尽。
