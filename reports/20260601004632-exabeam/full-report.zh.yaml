      - 买方 / 付款方
      - 为什么影响 Exabeam
    rows:
      - - 核心 SIEM 平台
        - 安全日志采集、关联、检测、调查工作台、案件管理和安全数据留存
        - 不含 SecOps 工作流的通用 IT 可观测性或应用日志
        - CISO / 安全运营 VP
        - Exabeam 必须切入的锚定预算线
      - - UEBA / 行为分析
        - 用户、实体和智能体行为基线、内部风险检测、凭证滥用分析
        - 通用 IAM 报告或 HR 分析
        - SOC 负责人 / 检测工程经理
        - Exabeam 的核心差异点，不是可选附加模块
      - - SOAR / 响应自动化
        - 响应剧本、编排、富化，以及从调查到响应的自动化
        - 与安全事件无关的通用工作流自动化
        - IR 负责人 / SecOps 经理
        - 重要，因为主要竞争对手把自动化与 SIEM 捆绑
      - - XDR / 安全数据邻近领域
        - 跨域遥测、统一安全数据、威胁上下文，以及与 SecOps 绑定的响应工作流
        - 没有共享安全工作流的独立终端或网络工具
        - 平台安全架构师
        - 重要，因为竞争对手用融合来替代专业厂商
      - - MDR / 服务及内部自建替代
        - 用来替代更多软件席位的托管检测叠加层和内部工程
        - 没有经常性监控平台的纯咨询支出
        - CISO / 采购 / MSSP 负责人
        - 代表可能延后或缩窄软件收入捕获的替代路径
    notes: 边界逻辑纳入买方通常会在同一 SecOps 平台决策中评估的支出，并排除通用非安全工具，除非它们直接绑定监控和响应结果。
