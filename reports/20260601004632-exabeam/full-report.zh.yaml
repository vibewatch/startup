  headquarters: Foster City, California, USA
  productSummary: >-
    Exabeam 销售 New-Scale Fusion 平台（云原生 SIEM + UEBA + SOAR）、Nova 多智能体 AI 套件（六个自主安全智能体，包括 Nova Advisor、Nova Triage 和 Nova
    Detective）、LogRhythm SIEM（企业自管理版本）以及 Exabeam Nova for Analysts。产品通过企业直销和 APEX 渠道合作伙伴计划销售。
  customerFocus: 面向金融服务、政府和公共部门、关键基础设施、医疗健康、专业服务等中大型企业；主要买方是员工数 1,000+ 组织中的 CISO 和 SOC 管理者。
