              领导层是当前 Exabeam 故事里最重要的变量之一，因为 LogRhythm 合并完成后，公司对外面孔已经变化。2024 年 7 月合并完成材料把 Christopher O'Malley 列为 CEO，把
              Peter Harteveld 列为首席价值创造官；2025 年 7 月 Nova 发布稿仍显示 Chris O'Malley 为 CEO。到了公司保留下来的 2026 年公司和领导层页面，Peter
              Harteveld 已是 CEO，并被描述为曾在担任首席营收官后帮助 Exabeam 和 LogRhythm 于 2024 年完成整合。Exabeam 目前公开列出的管理层还包括 Kish Dill、Mike
              Byron、Joanne Wong、Steve Wilson、Kiley LePage、Matt Sarafian 和 David
              Kennedy。这足以说明公司有一套相对完整的高管团队，但不足以完整还原董事会构成、投票权、接班安排或合并后治理机制。因此，图景是混合的：运营领导层可见，但治理透明度明显低于合并后公司规模应有的水平。
