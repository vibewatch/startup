      - number: '5.3'
        title: AI 与自动化栈
        blocks:
          - type: paragraph
            body: >-
              Exabeam 的 2025–2026 年产品叙事越来越围绕 Nova 和 Agent Behavior Analytics 组织。Nova
              不是作为单一助手销售；当前公开页面把它描述为六智能体系统，覆盖调查、威胁评分、分析师辅助、搜索、可视化和顾问功能，而 2025 年 7 月发布时则把 Advisor Agent 定位为面向 CISO
              的规划和董事会沟通界面。这很重要，因为 Outcomes Navigator 和 Advisor 一起把遥测、ATT&CK 覆盖和缺口分析转成可供高管使用的输出，把产品从分析师生产力延伸到治理和预算论证。ABA
              是第二个主要支柱。Exabeam 试图抢先监控非人类身份和 AI 智能体：为智能体活动建立基线，生成机器构建的时间线，并在 ChatGPT、Copilot 和 Gemini
              等平台上增加对误用、被攻陷和策略违规的检测。2026 年 4 月更新进一步推进这个故事，加入 OWASP Agentic Top 10 覆盖、扩展 AI 日志源支持、Nova Global Search
              和自动化响应动作。架构风险在于，这套栈现在不只依赖检测内容，还依赖高质量解析器、干净的实体上下文、安全的提示处理，以及对 AI 生成建议的可辩护治理。
