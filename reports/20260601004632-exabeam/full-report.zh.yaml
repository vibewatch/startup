      - number: '5.4'
        title: 信任、合规与安全架构
        blocks:
          - type: paragraph
            body: >-
              对一家私营安全厂商来说，Exabeam 的公开信任界面异常详细，也是本章更可信的部分之一。公司披露了基于角色的访问控制、数据脱敏、租户隔离、留存政策、审计轨迹、静态和传输中加密，以及特定区域云端点。专门针对
              Nova，Exabeam 称提示数据会加密、不会在云端缓存，也不会用于训练基础模型。公司还发布 API 密钥卫生指南，包括最小权限范围、每个用例一把密钥的纪律，以及至少每年轮换。合规方面，Exabeam 列出
              ISO 27001、27017 和 27018、SOC 2 Type II、IRAP Protected、GDPR 措施，以及参与 Data Privacy
              Framework。服务承诺也很明确：月度数据上传可用性 99.9%，产品访问可用性
              99.5%。因此，信任叙事在控制和认证层面很强；但投资者应区分平台安全姿态和产品有效性证明：这些披露支持采购和受监管行业采用，却不能证明低误报率、易部署，或合并后 Exabeam 与 LogRhythm
              装机基础迁移成功。
