      - number: '7.4'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              竞争压力正从上方和下方同时加强。来自上方，Microsoft 仍是最重要的战略威胁，因为竞争不是简单的产品对产品，而是平台对预算。多份独立 报告称，FTC 正在审查 Microsoft
              是否借助生产力、云、身份和网络安全领域的捆绑、授权和生态包装削弱竞争对手；ProPublica 还专门报道称， 免费或捆绑升级帮助把联邦用户转化为付费 Microsoft 安全客户，并挤掉了现有供应商。这对
              Exabeam 很重要，因为当安全支出被打包进更大的 企业协议时，即便产品差异化不错，也可能被采购杠杆淹没。来自下方，Wazuh 公开把自己营销为零成本 SIEM/XDR 平台，并提供托管云选项，
              从而强化开源价格伞。Exabeam 自己的增强叙事利弊相伴：它可以与 Microsoft Sentinel 共存，但也可能把公司锁进更窄的增强角色，而不是 完整控制平面。叠加其上的是发起方风险。CFO
              报道显示，私募股权持有期正在拉长，流动性压力仍高；网络安全 M&A 报道也不断提醒市场，战略
              替代路径仍然活跃。这意味着定价压力、平台竞争和退出时点相互绑定，而不是彼此独立。如果市场环境奖励捆绑套件或发起方流动性，而不是有节奏的 整合，Exabeam 的估值叙事可能快速压缩。
