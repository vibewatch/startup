chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              Exabeam 是一家私营网络安全公司，2013 年创立于加州 Foster City；公司保留下来的公开材料仍把品牌锚在分析驱动的安全运营上，而不是狭义的传统 SIEM。公司解释称，Exabeam 这个名字把
              exabyte 级机器数据和用于发现有意义模式的一束光结合起来，简洁概括了最初的价值主张。创始人 Nir Polak、Sylvain Gil 和 Barry Shteiman
              把此前的网络安全经验带进这套逻辑。2024 年 LogRhythm 合并实质性改变了公司形态：Exabeam 现在以合并后的业务示人，Foster City 和 Broomfield 都构成总部身份的一部分。到
              2026 年，公开产品界面覆盖 New-Scale Fusion、New-Scale SIEM、New-Scale Analytics、LogRhythm 品牌的传统模块、UEBA，以及更广的 AI
              驱动安全运营叙事。因此，把 Exabeam 归为合并后的安全运营平台，比归为单点产品供应商更准确。
