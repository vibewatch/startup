      - number: '8.6'
        title: 展项
        blocks:
          - type: callout
            title: 条件性正面是尽调判断，不是盲目买入
            body: |
              Exabeam 足够可信，值得推进，但只能在入场纪律下推进。公司有真实平台、可见 AI 差异化和发起方支持的规模；公开层面尚缺的，是支撑 2026 年 软件溢价倍数所需的留存和迁移证据。
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV026
              - CV035
              - CV044
          - type: callout
            title: Microsoft 是最清晰的压缩风险
            body: >
              Microsoft 当前 Sentinel 定价模型说明，Exabeam 不能只依赖品类增长。免费关键日志摄取、大额承诺折扣和更广泛的平台捆绑，即便在 Exabeam 产品质量扎实时，也会压缩独立 SIEM
              定价。
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV038
          - type: callout
            title: ARR 区间是承保假设，不是已披露事实
            body: |
              情景模型只有在明确承认不确定性时才有用。公开来源仍未披露当前 ARR，因此 $200-$300M 区间是决策工具，必须在投入资本前用公司数据替换。
            calloutType: assumption
            claimRefs:
              - CV010
              - CV039
              - CV040
