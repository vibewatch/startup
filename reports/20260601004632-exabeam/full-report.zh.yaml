      - number: '4.5'
        title: 财务缺口与私营公司不透明度
        blocks:
          - type: paragraph
            body: >-
              核心财务风险不是 Exabeam 没有商业模式，而是公开记录太薄，无法验证这个模式的质量。没有公开收入、ARR、毛利率、NRR、CAC 回本周期、客户集中度或经审计现金数据。SEC
              可见历史仅限于豁免发行式文件，而不是上市公司报告。私募市场数据库对最新融资历史和当前标记的标签并不一致；即便交易报道点名了顾问，也没有披露交易价值。评论网站能提供定价侧面信息，但不能替代队列数据或续约指标。这意味着投委会可以支持一个方向性判断——企业订阅软件、可信
              PE 支持、混合部署经济，以及真实成本纪律——但不能形成干净的承销案例。缺失项具体且可操作：月度 ARR bridge、云与自管理拆分的毛利率、现金和债务明细、客户队列留存，以及合并后合同迁移条款。
