      - 交付模式
      - 关键能力
      - 目标买方 / 操作者
      - 公开成熟度信号
      - 尽调缺口
    rows:
      - - New-Scale Fusion
        - 云原生 SaaS
        - 集成 SIEM + UEBA + 自动化 + Nova 层
        - 正在现代化混合环境的企业 SOC 团队
        - 核心平台页面，加定期季度 / 90 天更新
        - 需要既有环境迁移和留存的证据
      - - New-Scale SIEM
        - 云原生 SaaS
        - 高速搜索、关联规则、Threat Center、仪表板
        - 需要现代 SIEM 工作流的分析师和工程师
        - 搜索 / TDIR 功能有深入文档
        - 需要搜索经济性和规模化调优工作量的独立证据
      - - New-Scale Analytics
        - 云原生附加模块或叠加层
        - 行为基线、动态风险评分、UEBA、AI 智能体分析
        - 为既有 SIEM 或数据湖增强能力的团队
        - 明确定位为叠加层或独立分析层
        - 需要客户证据验证精准度、误报降低和调优负担
      - - Exabeam Nova
        - 云原生 AI 层
        - 调查、评分、助手、搜索、可视化和顾问智能体
        - 寻求工作流提速的分析师和安全负责人
        - 公开产品和新闻材料描述了六个协同智能体
        - 各页面命名不一致；需要路线图厘清长期智能体分类体系
      - - Outcomes Navigator
        - 云原生应用
        - 用例覆盖、ATT&CK 映射、合规态势、高管报告
        - CISO、SecOps 经理和项目负责人
        - 当前材料中直接绑定 Advisor 和覆盖分析
        - 需要证据证明生成报告会实质改变支出或控制结果
      - - NetMon
        - 混合环境中的硬件设备 / 软件组件
        - 深度数据包分析、SmartCapture、网络可见性、共享上下文
        - 希望在 SIEM 旁补充数据包上下文的团队
        - 定位为 LogRhythm 与 New-Scale 都可复用的数据源
        - 需要厘清附加率，以及 NetMon 长期是否仍具战略性
      - - LogRhythm SIEM
        - 自托管 / 本地部署
        - 高完整性数据采集、1,100+ 规则、嵌入式 SOAR、仪表板
        - 需要自托管控制的已安装客户
        - 2026 年仍获得具名平台更新
        - 需要看清与云原生路线图之间的功能等同性缺口
      - - LogRhythm Intelligence
        - 自托管附加模块
