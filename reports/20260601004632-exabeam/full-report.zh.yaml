      - number: '6.4'
        title: 客户满意度与反向信号
        blocks:
          - type: paragraph
            body: >-
              独立评论层面呈现出矛盾但总体正面的图景。PeerSpot 评论者反复称赞 Exabeam 的界面、分析能力、会话时间线、UEBA、自动化和 ROI， 这与多份官方案例研究里的产品收益相互印证。不过，同一批
              PeerSpot 评论也是本章最重要的不利信号：评论者提到基线带来的误报、 调优负担、文档缺口、API 摩擦、区域支持慢或不均衡，以及定价有时显得昂贵或复杂。TrustRadius
              至少进一步说明，买方把该产品看作一套 灵活的 SIEM+XDR 平台，可在本地或云端部署；这也解释了为什么公开证明同时覆盖传统自管理环境和更新的云原生环境。Gartner 和 G2
              具备方向性参考价值，因为它们显示 Exabeam 已进入主流企业评论版图，但公开实时页面访问限制较多，精确的公开评分说法应谨慎看待。
              实际上，本章最有支撑的结论是：客户满意度真实存在，但并不顺滑；成败似乎对调优、实施质量和支持覆盖高度敏感。
