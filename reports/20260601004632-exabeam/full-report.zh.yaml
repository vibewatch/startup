        title: 技术风险与路线图
        blocks:
          - type: paragraph
            body: >-
              主要产品风险不是缺少功能速度；公开证据实际上显示两条产品线都在活跃发布。更难的问题是合并后产品组合内部的整合风险。Exabeam 想保留自管理连续性，为 LogRhythm
              时代客户维持季度发布，同时把云原生平台推为长期基础。这在商业上合理，但技术上意味着两条主要轨道、不同部署机制和持续迁移工作，而不是今天已经拥有完全统一的代码库。用户评论证据强化了这个担忧：PeerSpot
              评论者赞赏时间线、分析和自动化，但仍提到基线带来的误报、API
              工作文档不均衡、部分地区支持缓慢，以及部署会随数据量和集成复杂度从几天拉长到几个月。因此，路线图在功能交付上可信，但在迁移执行上证据较弱。下一步尽调不是再看一个演示，而是要看队列证据：有多少 LogRhythm
              客户成功采用 New-Scale 或 Nova，迁移需要多久，以及生产调优后误报和分析师工作量是否真的下降。
