      - number: '7.2'
        title: 运营与执行风险
        blocks:
          - type: paragraph
            body: >-
              核心运营问题是，Exabeam 能否整合两套产品传统，同时不让客户困惑，也不把工程和支持资源拉得过长。合并完成公告明确描述了一家由云原生 Exabeam 资产和 LogRhythm
              自管理数据摄取资产构成的合并公司；产品页面和战略文章则显示，公司仍在支持自托管 LogRhythm SIEM、 通过 LogRhythm Intelligence 做 AI 增强，并最终迁入 New-Scale
              平台。这种广泛选择对客户友好，但运营成本也高。它要求并行路线图 有纪律，包装清晰，前线话术一致，并且在本地、混合和云原生环境里都有支持能力。公开材料显示，公司已有有意义的全球足迹，并在 APAC 和 MEA
              设有办公室，但同行反馈仍指出区域支持不稳定、部分市场响应慢、大规模部署有摩擦。领导层交接又加了一层风险：Christopher O'Malley 主导合并完成，而 Pete Harteveld
              现在把下一阶段框定为更紧的执行、伙伴协同和有纪律的可靠性。这很合理，但也意味着投资者实际承保的是
              一项文化与整合计划，而不只是功能路线图。如果迁移队列停滞，或交接期间服务质量下降，客户留存可能比表面产品动能暗示的更快恶化。
