  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Exabeam 已经不再身处清晰的独立 SIEM 品类。证据集显示出四类实际竞争者：以 Microsoft Sentinel 为首的打包云平台；以 Splunk Enterprise Security 和 IBM
              QRadar 为首的传统或既有企业栈；以 Palo Alto Cortex XSIAM 和 CrowdStrike Falcon Next-Gen SIEM 为首的 XDR 主导整合方案；以及
              Rapid7、Securonix、Sumo Logic、SentinelOne 和 Elastic
              等云原生专门厂商。买方越来越在同一次预算动作里比较检测质量、自动化、成本控制和第一方遥测访问，而不是把日志管理和更广 SOC 结果拆开。这个市场结构重要，因为 Exabeam
              的获胜理由不同于多数平台巨头：当客户想要行为驱动分析和更快工作流，又不想马上替换所有现有数据或安全控制时，它最有优势。问题在于，最大的竞争对手正用打包、平台宽度和原生生态分发，减少买方开展纯粹逐功能 SIEM
              比拼的频率。
