      - number: '7.5'
        title: 否决条件与缓释框架
        blocks:
          - type: paragraph
            body: >-
              承保 Exabeam 的正确方式，是把可见缓释因素和仍未证实的假设分开。公开缓释因素确实存在：Exabeam 宣传区域专属托管、7x24 云运营监控、
              客户状态页、明确的正常运行时间目标、持续的自托管版本节奏，以及脱敏、留存设置和加密等隐私控制。这些都是正面输入，但不能回答最重要的尽调
              问题。现在关键在于，管理层能否拿出硬证据证明：存量客户流失受控；迁移选择确实出于自愿，而不是被路线图失序逼迫；区域支持人员配置能跟上产品 复杂度；Nova 或 MCP
              推出时，治理严谨度与任何其他特权接口一样高。如果 AI 治理变化实质性限制行为分析使用，如果存量客户流失超过可容忍 阈值，如果 Microsoft
              把捆绑经济性进一步下压到中低端市场，或如果发起方行为显示整合质量尚未验证就要为流动性而退出，那么投资论点应视为
              破裂。换句话说，缓释应靠可衡量的运营证据来判断，而不能只看路线图语言。公司仍可能具备吸引力，但前提是投资者要求的监控纪律与产品主张本身 一样具体。
