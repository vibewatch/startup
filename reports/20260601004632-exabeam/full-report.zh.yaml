  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与可比组
        blocks:
          - type: paragraph
            body: >
              Exabeam 有足够外部参照来搭建有纪律的估值框架，但披露不足以支撑伪精确。硬锚点包括：2021 年 6 月 Series F 轮的 $2.4 billion 估值、 2024 年 7 月完成
              LogRhythm 合并、2023 年 5 月 Forge 二级市场给出的 $2.65 billion 标记，以及合并经济性、当前 ARR、NRR 和杠杆从未
              公开披露。这个组合很重要：公司显然已经达到独角兽规模，但合并后的实体现在必须按发起方控制的整合故事来承保，而不是按干净的风险投资支持型 独立公司来承保。


              最合适的可比组是混合的。Cisco 以 $28 billion 收购 Splunk，证明拥有真实分销和产品广度的规模化安全数据平台仍能让战略买方付高价。 相比之下，Sumo Logic 以 $1.7
              billion 私有化是警示信号：SIEM 邻近资产可能失去公开市场支持，并在私募股权所有权下被重新定价。 Devo 2022 年 $2 billion 融资说明，云原生安全分析仍有资本可拿，但当前 2026
              年软件市场环境远比 2021 年收紧。Software Equity Group 1Q26 给出的 EV/TTM 收入中位数 3.6x、Eqvista 记录的 2021 年 41.48x 峰值和 2023 年
              4.38x 谷底，以及 ValueAddVC 2025 年给出的 中等增长 SaaS 约 3-7x 指引，才是合适的估值护栏。因此，Exabeam
              应按当前执行质量和发起方退出现实来估值，而不是按上一次头条式独角兽轮次 来估值。
