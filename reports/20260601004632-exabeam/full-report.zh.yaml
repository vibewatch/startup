  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础概览
        blocks:
          - type: paragraph
            body: >-
              描述 Exabeam 客户基础时，最站得住脚的方法是看公开证明密度，而不是精确账户数。目前可访问的 Exabeam 客户档案暴露约 35 个案例
              URL；本章留存样本覆盖大型企业、受监管机构和运营复杂组织，而不是小企业。可见证明横跨 HR 软件里的 Dayforce、全球 IT 服务的 NTT DATA、受监管公用事业的 SA Power
              Networks、关键基础设施中的 Port of Antwerp-Bruges、金融服务中的 BRAC Bank、教育领域的 Wellington College、咨询服务中的 Grant
              Thornton、物流里的 Konoike Transport，以及一家匿名美国医疗机构。2024 年合并和 2025 年 Nova 材料又加入 Dayforce、BECU、ICAEW、ilionx 和
              Extreme Networks 等较新的客户引用，增强了合并后 Exabeam-LogRhythm 资产的连续性证据。公开证据没有揭示的内容同样重要：Exabeam 不披露精确客户数、垂直 ARR
              结构、地域收入结构，或仍在运行传统 LogRhythm 与新一代 Exabeam 模块的客户占比。结论是，覆盖面清晰，但经济可见性不完整。
