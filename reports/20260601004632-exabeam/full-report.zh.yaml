  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与架构
        blocks:
          - type: paragraph
            body: >-
              Exabeam 现在在同一个商业伞下销售两套清晰区分的运营模式。云原生一侧以 New-Scale Fusion 为中心，把 SIEM、行为分析、自动化和 Nova 驱动的调查打包进模块化 SaaS
              平台。自管理一侧保留 LogRhythm SIEM、LogRhythm Intelligence 和
              NetMon，服务仍需要本地控制、可预测设备式运营或更慢迁移路径的买方。公开材料并不掩盖这种分裂，而是把它营销为可选性。客户想要开放摄取、多厂商共存和分阶段现代化路径，而不是被迫推倒重来时，这套架构叙事最强。在这层话术下面，Exabeam
              反复强调基于 CIM 的标准化、采集器、搜索、报告和服务健康等共享云原生应用，以及用风险、时间线和实体上下文丰富检测的行为驱动层。这个组合从买方视角看是连贯的，尽管它仍横跨两个主要产品家族和两种交付动作。
