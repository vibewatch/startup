      - number: '2.3'
        title: 买方分层与预算归属
        blocks:
          - type: paragraph
            body: >-
              Exabeam 最匹配的不是所有有日志的企业，而是确实有 SOC 问题要解决的那一部分。Exabeam
              和第三方市场研究中的公开分层反复指向大型企业、受监管行业、政府环境，以及越来越多需要跨混合基础设施做集中监控的中高端中型企业。日常用户是分析师、检测工程师、事件响应人员和安全架构师，但预算通常由
              CISO、安全运营 VP 或中央安全组织掌控。NIST 的风险管理框架和 ISC2 的治理研究都支持一个判断：网络安全平台越来越需要高管和董事会层面的理由，而不只是技术团队背书。Exabeam Nova 明确面向
              SOC 领导层定位，也强化了这个模式。实际含义是，买方动作既取决于治理、人员压力和工作流成熟度，也取决于原始威胁量。
