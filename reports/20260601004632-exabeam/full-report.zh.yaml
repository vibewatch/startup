      - number: '2.5'
        title: 市场风险与反向信号
        blocks:
          - type: paragraph
            body: >-
              最清晰的反向信号是，Exabeam 所在市场的重心正在转向打包平台。Microsoft Sentinel 已经营销内置 SIEM、SOAR、UEBA、威胁情报和安全数据湖；CrowdStrike 用针对传统
              SIEM 的激进经济替代叙事销售；Palo Alto 把 XSIAM 定位成全面升级 SIEM 的 AI 驱动 SOC 平台；IBM QRadar
              仍在营销既有厂商的广度和集成深度。Elastic、Splunk、Securonix、Varonis 和 Sumo Logic
              都强化了同一模式：买方越来越用整合、分析师生产力、自动化和跨域上下文来判断平台，而不只看传统关联逻辑。这不会抹掉 Exabeam 的相关性，因为它的增强和行为分析定位确实成立；但估值不应假设独立 SIEM
              市场结构干净存在。风险来自类别收敛叠加超大规模云厂商和 XDR 主导的打包，其中 Microsoft 是最明显的替代威胁。
