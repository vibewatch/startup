              - CV024
              - CV028
              - CV033
              - CV044
              - CV045
      - number: '8.3'
        title: 悲观情景与不利信号
        blocks:
          - type: paragraph
            body: >
              悲观情景从竞争开始，以资本结构收尾。Microsoft Sentinel 已不只是功能性竞争对手；Microsoft 当前定价页面强调关键日志的每日免费摄取、 相比即用即付最高可省 52% 的承诺层级，以及与
              Security Copilot 和 Microsoft 资产相连的更广泛 AI 优先安全叙事。这种捆绑压力会侵蚀 独立 SIEM 的定价能力，尤其是在买方已经围绕 Microsoft
              身份、终端或云工具标准化时。Cisco 吸收 Splunk 又在高端带来另一股大型平台压力， 而 Exabeam 仍必须说服客户穿过合并后的产品选择完成迁移，同时不触发流失。


              也存在直接的不利运营信号。PeerSpot 评论者描述了集成缺口、高误报、UI 效率问题和复杂的定价感受；TechTarget 的通用 SIEM 实施指南则提醒 投资者，部署周期可能达到 90
              天或更久，成本可达数十万美元，需要专家配置，并产生压倒性的告警量。BankInfoSecurity 关于 Exabeam 2023 年 裁员的报道凸显，公司在合并前已经不得不收紧成本基础。最重要的是，Sumo
              Logic 提供了警示性先例：一家拥有公开市场通道的真实云分析供应商， 最终仍以 $1.7 billion 被私有化。Exabeam
              可以跑出更好的路径，但前提是合并后实体证明迁移耐久性，并避免在倍数压缩市场里被按又一个成熟 日志管理资产来估值。
            claimRefs:
              - CV011
              - CV013
              - CV026
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV038
          - type: table
            tableRef: TV005
