      - number: '8.4'
        title: 情景分析与价格敏感性
        blocks:
          - type: paragraph
            body: >
              情景模型应被视为价格纪律工具，而不是声称当前 Exabeam ARR 已公开。公开证据仍未披露当前 ARR、NRR、毛利率或合并杠杆，因此唯一站得住的 做法，是建模一个明确的承保区间，再用倍数测试。本文使用
              $200-$300 million ARR 区间作为工作假设，因为公开来源显示，公司规模大到足以按 独角兽估值融资，复杂度高到需要发起方支持的整合，同时又过于不透明，无法精确承保收入。$225 million
              中点是把软件倍数证据转化为决策区间的 最简单方式。


              在这个中点上，4x 收入意味着约 $0.9 billion EV，5x 意味着约 $1.1 billion，6x 意味着约 $1.35 billion，7x 意味着约 $1.6 billion。
              这些数字与更广泛证据组相吻合。8-12% 有机增长、部分 Nova 驱动的追加销售和中等迁移摩擦构成的基准情景，支撑约 $1.0-$1.5 billion EV， 匹配用户目标区间和当前中个位数软件倍数现实。超过
              $1.8 billion 的乐观情景需要溢价留存、清晰云迁移，以及强到足以把 Exabeam 拉向 安全 / 数据异常值而非 SaaS 中位数的 AI 变现能力。如果 Microsoft
              压缩、迁移延迟或发起方退出紧迫性迫使资产进入低增长或私有化式定价， 低于 $1.0 billion 的悲观情景就变得合理。
