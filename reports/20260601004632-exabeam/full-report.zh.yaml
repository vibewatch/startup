  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险图谱
        blocks:
          - type: paragraph
            body: >-
              监管暴露真实存在，因为 Exabeam 的核心价值主张依赖摄取、关联并分析用户、资产和工作流遥测，而这些数据可能包含员工行为信号、访问数据和 其他个人信息。Exabeam
              公开披露的控制措施有分量：公司强调数据脱敏、基于角色的访问控制、留存控制、加密、与 GDPR 对齐的处理， 以及覆盖北美、欧洲、中东和 APAC 的区域托管端点。这些控制能降风险，但不能消除风险。GDPR
              仍把个人数据自动化处理视为基本权利问题， ICO 就业指导明确把员工监控和生物识别使用绑定到数据保护义务，加州隐私法也对敏感个人信息施加通知、留存和服务提供商义务。监管栈正在扩宽， 而不是收窄：FTC
              已明确表示，现有反欺骗法没有 AI 豁免；EU AI Act 对高风险 AI 用途施加风险管理和上市后监测义务；SEC 网络披露规则 也在提高上市公司买方的运营期待。这个组合带来双面风险：Exabeam
              可以受益于合规驱动的需求，但如果营销中的 AI 结果与受治理、可审计的行为 之间出现缺口，2026 年受到的审视会比以往更强。
