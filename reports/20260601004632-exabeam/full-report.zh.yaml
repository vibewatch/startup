          - type: callout
            title: 不透明度才是真正财务阻碍，不是缺少可见商业模式
            body: 公开来源包足以支持对 Exabeam 收入机制和 PE 支持下资本获取能力的方向性判断，但不足以验证 ARR、毛利率、债务或合并后稀释。因此，剩余尽调问题都落在投资级财务控制和报告项上。
