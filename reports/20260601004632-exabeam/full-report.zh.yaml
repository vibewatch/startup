      - number: '8.2'
        title: 投资论点（乐观情景）
        blocks:
          - type: paragraph
            body: >
              乐观情景不是 Exabeam 便宜，而是如果 AI 与迁移故事被证明耐久，合并后公司可能仍被战略低估。Exabeam Nova 现在包含六个专用智能体； 管理层称它是唯一带有面向 CISO 的战略智能体的智能体式
              AI 系统；公司还称，发布后 90 天内用户调查速度提升 5 倍。配套产品叙事具备商业 意义，因为合并后的公司不只是卖通用日志。它试图把 Exabeam 与 LogRhythm
              的合并资产重新定位成一个差异化安全运营平台，覆盖云原生工作流、 自管理连续性、UEBA 和智能体行为分析。


              装机基数论点也有可信度。Exabeam 仍在营销横跨数百家供应商和产品的集成，早期渠道报道还曾在合并前就把公司与 400 多个伙伴和 500 多项
              技术集成绑定起来。当客户不想推倒重建安全栈时，这种生态深度很重要。监管顺风让产品故事更可投资：SEC 网络披露规则和 DORA 都提高了董事会 可见事件报告、运营韧性和证据丰富的安全运营的重要性。如果
              Exabeam 能把这些顺风转化为 New-Scale 云迁移、受监管账户内更高扩张，以及高于 商品化 SIEM 水平的留存，它有理由拿到更接近高质量安全 /
              数据基础设施公司的溢价倍数，而不是软件篮子的中位数。这是条件性正面观点的基础。
