              公开资本历史足以建立方向感，即便还不足以重建完全可靠的股权结构表。现存报道确认了 2014 和 2015 年早期风险融资、2018 和 2019 年可见的后期 Series D 和 Series E，以及
              2021 年以 $2.4B 估值完成的 $200M Series F。Crunchbase 仍显示 2021 年 12 月还有一笔更晚的风险融资事件；Thoma Bravo 的投资组合页面则称，它在 2018
              年投资了 Exabeam 和 LogRhythm，并在 2024 年合并了这两项资产。PitchBook 现在把 Exabeam 最新交易类型标为 Buyout/LBO，这是最清晰的信号：分析公司时应把它视为由
              PE 支持方控制，而不是普通的风投支持独立公司。这很重要，因为所有权集中度、任何未披露的优先条款，以及任何由 PE 支持方关联贷款方叠加的结构化资本，对退出收益的影响都会超过标题级产品动能。
