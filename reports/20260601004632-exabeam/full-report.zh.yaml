      - number: '8.5'
        title: 投资建议与尽调条件
        blocks:
          - type: paragraph
            body: >
              正确判断是条件性正面。Exabeam 有正当的产品和战略理由：发起方支持、合并后的装机基数、可信的 AI 定位、监管顺风，以及足够的品类重要性，
              都值得认真接触。但这些优势都没有消除核心估值问题。公司仍过于不透明，不能像干净的公开 SaaS 可比公司那样承保；2026 年软件市场也不再仅
              因叙事奖励后期安全厂商。因此，投资建议质量与尽调质量不可分割。只有当公司能证明合并后平台正在留住客户、把客户迁向 New-Scale 云工作流， 并能抵御 Microsoft
              主导的定价压力时，投资者或战略伙伴才应继续推进。


              四个闸门条件很直接。第一，确认合并后毛留存或 logo 留存明显高于 85%；否则装机基数论点比表面更弱。第二，验证当前 New-Scale 云原生客户数、 迁移节奏和扩张动作；否则 Nova
              和云叙事更像战略语言，而不是经济成果。第三，绘制现有客户群内的 Microsoft Sentinel 暴露，包括客户是把 Sentinel 当作共用
              SIEM、成本锚点，还是主动替代威胁。第四，尽调发起方栈——控制权、退出窗口、债务和稀释风险——因为 Thoma Bravo 及相关
              资本提供方即便在运营改善时也能塑造股权结果。如果这些检查为正面，且隐含入场估值接近 $1.0-$1.5 billion 区间而不是历史标记，Exabeam 值得
              主动追求。否则，它仍是一项高质量资产，但承保基础偏紧。
            claimRefs:
              - CV033
              - CV035
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
