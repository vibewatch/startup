      - number: '2.2'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >-
              公开 SIEM 市场估算在增长方向上大体一致，但对当前规模的判断差异很大；尽调备忘录因此应该保留多重视角，而不是假装只有一个标准 TAM。留存来源给出的近期起始年份规模从约 $4.7B 到 $12.56B
              不等，远期预测从约 $14.0B 到 $33.69B 不等，多数公开 CAGR 假设仍落在低双位数到中双位数区间。差距最好用类别边界解释：有些发布方只看核心 SIEM，另一些则隐含纳入更广的云、分析或现代化层。对
              Exabeam 来说，实际问题不是最宽的公开标题数字，而是买方想要 SIEM 加 UEBA、自动化和多厂商可见性的那部分支出池。按这个视角，粗略的 $10-15B TAM、$4-6B SAM 和
              $0.5-1.0B SOM，比单一膨胀的全球数字更有决策价值。
