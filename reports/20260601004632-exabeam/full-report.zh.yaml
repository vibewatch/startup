            title: 渠道杠杆有助分发，但遮蔽净价实现
            body: APEX 合作伙伴激励显然是为了扩大分发，同时不强制公开标价。它可能降低直接 CAC，但也意味着外部投资者无法从任何公开价格线索推断实际净收入或利润率。
            calloutType: insight
