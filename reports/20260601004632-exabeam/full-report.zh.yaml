      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              从留存证据看，安全运营工具的需求逻辑很容易理解。Verizon 的 2026 DBIR 称，漏洞利用已超过凭证盗取，成为首要初始访问路径；勒索软件仍然普遍，第三方暴露也在上升。IBM 的数据泄露研究补上了硬美元
              ROI 论据，CISA 和 NIST 则在优先级、治理、韧性和安全内建预期上制造政策压力。与此同时，劳动力约束持续把买方推向自动化、AI
              辅助和行为驱动的降噪。不过，同一组力量也制造采用摩擦。与传统系统集成仍然很难，实施和维护仍然昂贵，熟练操作人员也稀缺。这就是 Exabeam
              的增强叙事重要的原因：先叠在现有工具之上分阶段推进，可能比立刻推倒重来更容易被采购接受，即便长期平台整合仍可能是买方终点。
