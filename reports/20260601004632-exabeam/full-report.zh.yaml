        - 捆绑平台会试图阻止第二个控制平面进入账户
        - 中高
        - 衡量 Microsoft、Splunk 和 QRadar 客户中的附加率，以及叠加部署后的留存
      - - 云端 + 自托管的灵活性
        - 合并后的产品组合能服务尚未准备全面迁移到 SaaS 的客户
        - 单一平台对手会主张，混合产品组合会制造技术债、拖慢创新
        - 中
        - 审查迁移漏斗、产品整合里程碑，以及既有 LogRhythm 客户队列的 NRR
      - - 集成与解析器资产
        - 广泛的解析器覆盖能降低多厂商环境的接入摩擦
        - Microsoft、Palo Alto 和 CrowdStrike 能把第一方数据做得比任何中立解析层更易用
        - 中
