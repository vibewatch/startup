  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开运营闭环从数据接入开始，随后进入检测、分析师调查、自动化动作和高管基准评估。
    data:
      nodes:
        - id: onboard
          label: 接入数据源
          detail: 通过采集器、API、syslog 或 NetMon 连接现有云端、本地、身份、网络或 AI 平台日志。
          tone: neutral
        - id: normalize
          label: 用 CIM 规范化
          detail: 解析器和 CIM 标准化传入事件，并暴露摄取质量诊断。
          tone: neutral
        - id: detect
          label: 检测并评分
          detail: 关联规则、威胁情报、UEBA 和 ABA 生成警报、风险评分和可疑时间线。
          tone: positive
        - id: investigate
          label: 在 Threat Center 和 Nova 中调查
          detail: Threat Center、Nova 智能体和搜索拼出上下文、总结案件并回答分析师问题。
          tone: positive
        - id: respond
          label: 自动化或响应
          detail: 处置剧本、ServiceNow 动作、通用登出和引导式决策推动案件走向遏制和修复。
          tone: positive
        - id: benchmark
          label: 基准评估与报告
          detail: Outcomes Navigator 和 Advisor 将检测映射回 ATT&CK、用例、合规和高管报告。
          tone: neutral
      edges:
        - from: onboard
          to: normalize
          label: 解析并映射
        - from: normalize
          to: detect
          label: 评分并关联
        - from: detect
          to: investigate
          label: 排序并总结
        - from: investigate
          to: respond
          label: 批准动作
        - from: respond
          to: benchmark
          label: 衡量覆盖与价值
