      - - Nova 与可提交董事会的 AI 报告
        - 让 Exabeam 在管理层沟通和工作流效率议题中拉开差异
        - 大厂对手能很快复制 AI 助手、摘要和报告外壳
        - 中低
        - 测试 Nova 功能能否相较现有工具，可量化提升分析师效率和高管采用率
      - - 捆绑导致 TAM 压缩
