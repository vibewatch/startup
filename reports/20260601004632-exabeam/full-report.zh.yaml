  - id: TV005
    title: 投资逻辑破裂触发点与尽调问题
    columns:
      - 触发点 / 问题
      - 监测信号
      - 为何重要
      - 行动含义
    rows:
      - - 合并后留存跌破阈值
        - 总留存或客户数留存低于 85%
        - 存量客户与迁移逻辑会立刻走弱。
        - 除非价格大幅重设，否则转为中性 / 回避。
      - - New-Scale 迁移停滞
        - 云原生新增客户少，或迁移队列表现弱
        - AI 差异化可能存在，但未必转化成经济质量。
        - 不要按溢价倍数建模。
      - - Microsoft 替代风险高
        - 核心账户把 Sentinel 用作主动替代品或价格锚
        - Exabeam 独立定价力和增购路径受损。
        - 把情景模型压向 3x-4x 收入。
      - - 财务赞助方结构苛刻
        - 控制权、债务或退出时点条款吃掉基准情景上行
        - 即便运营改善，股权回报也可能不达预期。
        - 优先考虑合作或商业合作，而非股权。
      - - 一线仍看得到整合摩擦
        - 用户评价证据、支持问题或迁移延误持续存在
        - 合并后公司可能需要比模型假设更久才能释放协同。
        - 把公司归入增速更慢的估值桶。
    notes: 这些是决策触发点，不是泛泛风险；每一项都直接连到估值支撑。
    claimRefs:
      - CV028
      - CV030
      - CV032
      - CV033
      - CV038
      - CV045
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 桥接
        - 当前合并 ARR、云端占比，以及 New-Scale 与旧有环境之间的迁移组合
        - 要把情景区间转成真正的投资测算，这项必不可少。
        - CFO / 财务数据室
      - - 留存质量
        - 按原 Exabeam 与 LogRhythm 队列拆分的总留存、客户数留存和 NRR
        - 帮助投资者判断存量客户逻辑是真的，还是纸面上看起来黏性高。
        - 财务加客户成功尽调
      - - Microsoft 重叠分析
        - 已使用 Sentinel、Copilot 或打包 Microsoft 安全工具的账户占比
        - 决定存量客户中的定价压力和替代风险。
        - CRO / 一线架构评审
      - - New-Scale 客户牵引
        - 云原生客户数、迁移节奏和 Nova 附加率
        - 把 AI 叙事与真实产品驱动扩张经济性拆开。
        - 产品与收入运营尽调
      - - 财务赞助方与债务条款
        - 股权结构表、控制权、债务契约和计划退出窗口
        - 如果结构不利，即便收入增长，新投资者也可能亏。
        - 法律与董事会材料审阅
    notes: 如果管理层拿不出这套材料，建议就不应高于有条件正面。
    claimRefs:
      - CV033
      - CV039
      - CV041
      - CV044
      - CV045
