  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >-
              Exabeam 销售的是安全运营软件，而不是广告、市场撮合或交易型产品。公开产品和合并材料显示，公司既有云原生 New-Scale Fusion 平台，也继续保留自管理 LogRhythm
              SIEM，因此变现混合了经常性软件订阅、部分传统续约、支持和迁移经济。公开定价仍是企业级、按报价给出。评论证据称，合同可以围绕用户数或 gigabits/day
              摄取量组织；合作伙伴计划则为渠道伙伴提供报备折扣、可预测利润率、返利和无收入门槛入门。这种组合有利于触达和合作伙伴动力，但不利于外部承销，因为留存来源没有披露标准标价、实际折扣瀑布，或从净价到毛利率的清晰桥接。最佳公开解读是：企业订阅
              ARR，渠道辅助分发，并附带一定实施 / 支持，而不是干净的自助式 SaaS 动作。
