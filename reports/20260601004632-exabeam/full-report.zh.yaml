      - number: '5.2'
        title: 关键能力与技术差异化
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的最强差异化，不是泛泛的“AI SIEM”，而是 Exabeam 把行为驱动分析、开放摄取和既有环境增强组合在一起。New-Scale SIEM 强调快速搜索、集中式 TDIR
              和自定义规则编写；New-Scale Analytics 增加行为基线和动态风险评分；Attack Surface Insights 构建带上下文的实体画像；Outcomes Navigator
              试图把原始遥测覆盖转成用例和 ATT&CK 可见性，方便安全领导者在内部为投入辩护。解析器和集成资产重要，因为在异构 SOC
              中，客户不想统一到单一遥测源，它能降低上线摩擦。公开开发者资产也强化了开放主题：Exabeam 记录区域 API，发布密钥管理指南，在 GitHub 上维护公开 CIM 库，并可扩展进 MCP
              式工作流。问题在于，开放性不再独特。IBM 也营销深度集成广度，Elastic 则营销更统一的开放平台和联邦搜索。因此，Exabeam
              的护城河不在于“有集成”，而在于行为智能、实体上下文和中立部署灵活性如何一起发挥作用。
