  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Exabeam 面向的不是狭窄的日志管理小众市场；它卖进的是安全运营采购场景，SIEM、行为分析、自动化和响应工作流越来越被一起评估。Exabeam 自己的公开界面同时使用
              SIEM、UEBA、SOAR、TDIR、AI 和合规语言，Microsoft、Splunk、Elastic 等竞争对手也把多个工作流打包进一个平台。这意味着该市场边界应包括买方视作同一个 SecOps
              平台决策的集中式安全日志、关联分析、调查、工单管理、UEBA 和安全响应自动化。通用可观测性、应用性能工具和商品化 IT 日志不应纳入，除非这些系统明确连接到安全监控和事件响应结果。对尽调而言，这个边界重要，因为
              Exabeam 的差异化在增强、行为分析和工作流加速，而不只是原始数据留存。
