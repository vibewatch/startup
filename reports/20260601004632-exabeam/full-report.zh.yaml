companyProfile:
  summary: >-
    Exabeam 是一家总部位于加州 Foster City 的网络安全公司，专注 AI 驱动的安全信息与事件管理（SIEM）以及用户和实体行为分析（UEBA）。公司成立于 2013 年，并在 2024 年 7 月完成与
    LogRhythm 的转型式合并，组成全球最大的独立 SIEM 提供商。Exabeam 的云原生 New-Scale Fusion 平台和 Nova 多智能体 AI 系统提供行为基线、动态风险评分，以及覆盖 1,000+
    个集成的自主调查工作流。合并后的公司服务全球 600+ 家客户，金融服务、政府和关键基础设施占比较高。Thoma Bravo 和 Francisco Partners 是主要私募股权支持方。
  foundedDate: '2013-01-01'
  founders:
