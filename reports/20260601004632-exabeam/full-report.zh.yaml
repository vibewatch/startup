      - number: '6.5'
        title: 客户集中度与留存风险
        blocks:
          - type: paragraph
            body: >-
              Exabeam 公开客户记录最大的短板不是缺少 logo，而是缺少经济留存披露。保留材料没有公开 NRR、GRR、流失率、续约率、队列或头部客户
              集中度，因此耐久性只能从部署深度、工作流嵌入程度和客户引用质量来推断。这个推断方向上偏正面：许多可引用客户都是大型企业或受监管 运营方，会把 SIEM 深度接入 SOC
              工作流、用例库、合规报告和调查流程。这些集成带来中高转换成本，尤其是在平台充当单一控制台，
              或团队已经调好检测与响应工作流时。但负面评论也说明，这些转换成本并非绝对。如果客户遇到高误报、迁移扰动、文档缺口或区域支持薄弱，
              续约摩擦会快速上升。客户集中度风险也看起来合理，因为公开证明组合由大型、运营复杂的机构主导，这些客户的合同价值很可能显著高于中位账户。 因此，尽调诉求很直接：按存量队列、产品组合和客户规模拆分留存与集中度数据。
