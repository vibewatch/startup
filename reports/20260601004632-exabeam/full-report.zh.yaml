  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the clearest public or officially disclosed valuation anchors relevant to Exabeam's SIEM /
        security-analytics positioning plus current software-market valuation ranges. It is not exhaustive because many
        private SIEM vendors do not disclose both valuation and operating scale.
    columns:
      - 可比公司 / 可比项
      - 指标 / 状态
      - 倍数或估值标记
      - 相关性
      - 局限
    rows:
      - - Exabeam（Series F 轮，2021）
        - $200M 成长期融资
        - $2.4B 估值
        - Exabeam 本身最后一个干净的公司融资锚点。
        - 该定价形成于软件估值倍数远高于 2026 年的环境。
      - - Exabeam（Forge 老股交易标记，2023）
        - Series F-1 / 老股交易式标记
        - $2.65B 估值
        - 说明即便在 2024 年合并前，私募市场标记仍高于 2021 年轮次。
        - 老股市场标记不等同于已披露的运营价值标记。
      - - Splunk / Cisco（2024）
        - 战略收购
        - 股权价值 $28B；$157/share
        - 证明大型战略买家仍愿为品类领先的安全数据平台付费。
        - Splunk 是规模化上市资产，披露远多于 Exabeam。
      - - Sumo Logic / Francisco Partners（2023）
        - 上市公司私有化收购
        - 股权价值约 $1.7B；$12.05/share
        - 对失去公开市场支撑的日志分析资产，这是一个下行情景警示。
        - 上市公司私有化定价不能直接套成私募轮次倍数。
      - - Devo（Series F 轮，2022）
        - 成长期融资
        - $2.0B 估值；累计融资 >$500M
        - 可作为云原生 SecOps 私有公司同业参照。
        - 官方来源未披露当前收入或交易倍数。
      - - 上市 B2B SaaS 中位数（SEG 1Q26）
        - 107 家公司指数中位数
        - 3.6x EV/TTM 收入
        - 在 2026 年条件下，这是晚期软件公司最好的广义市场估值底线。
        - 跨行业中位数会低估增长顶尖的优质安全资产。
    notes: 本表用于框定不同估值制度，不意味着 Exabeam 应该完全按其中任何一行交易。
