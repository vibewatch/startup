        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              Exabeam 的资本历史显示，这家公司早在 2024 年合并之前，就已经靠一长串私募融资爬坡扩大规模。Crunchbase 记录了 2014 年 Series A 到 2021 年 Series F，以及
              2021 年稍后的一个风险融资轮；Thoma Bravo 则称其从 2018 年开始投资。公开顺序很关键，因为它说明支持来自多轮机构风投和成长型投资者，而不是一次机会主义融资。历史投资方包括 Norwest
              Venture Partners、Icon Ventures、Cisco Investments、Lightspeed Venture Partners、Sapphire Ventures 和 Owl Rock
              Capital。最强的公开独立估值锚，是 2021 年 Series F 阶段约 $2.4B
              的数字。同样重要的是不透明之处：留存的公开证据没有披露当前收入、ARR、债务条款、所有权比例、清算优先权或合并后控制权。尽调因此只能确认 Exabeam 资金充足且有 PE
              支持，却无法说明合并后实体内部的经济权益或治理权今天如何分配。
