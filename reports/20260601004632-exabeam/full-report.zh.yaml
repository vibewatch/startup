      - number: '7.3'
        title: 技术与产品风险
        blocks:
          - type: paragraph
            body: >-
              Exabeam 的产品覆盖面正在扩张，既带来差异化，也带来技术风险。Nova 现在营销六个独立智能体，并把智能体式自动化定位为威胁检测、
              调查和高管可视化的核心组成。同时，公司运营着一套横跨数百家供应商、数千个解析器、多种云来源和行为模型的集成资产，目标是减少误报。
              这种广度对客户有用，但也带来解析器维护负担、调优复杂度，以及更多漂移并损害分析师信任的触点。独立评论层面在这里很重要，因为它与产品架构
              方向一致：用户称赞易用性和分析能力，但仍抱怨误报、基线、文档和补丁相关不稳定。新的 MCP 层是最清晰的新兴风险。Exabeam 自己的 MCP 材料承认，这些端点是进入敏感系统的特权访问路径；更广泛的 MCP
              规范警告任意数据访问和代码执行风险；外部研究人员则展示了自主 智能体如何泄露凭证、外传数据，或被提示注入操纵。含义很直接：智能体式工作流可能提高生产率，但也会扩大权限、日志和模型治理错误的
              爆炸半径。因此，产品路线图里的技术风险与信任和治理风险不可分割。
