    type: flow
    layout: wide
    summary: Exabeam 的推荐取决于真实平台差异化能否顶住倍数压缩和赞助方不透明。
    data:
      nodes:
        - id: n1
          label: PE 支持的合并平台
          detail: Exabeam 加 LogRhythm 是一个真实整合后的 SIEM / UEBA 资产，装机基础关联度有意义。
        - id: n2
          label: AI 差异化
          detail: 如果客户采用并扩展，Nova、ABA 和工作流自动化可以撑起一条有溢价可能的路径。
        - id: n3
          label: 监管顺风
          detail: SEC 网络安全规则和 DORA 抬高了对董事会可见、证据丰富的安全运营需求。
        - id: n4
          label: 竞争压缩
          detail: Microsoft Sentinel 定价和 Cisco/Splunk 规模挤压独立 SIEM 经济性。
        - id: n5
          label: 经济性不透明
          detail: 当前 ARR、NRR、杠杆和赞助方分配瀑布仍未披露。
        - id: n6
          label: 有条件正面
          detail: 只有尽调确认留存、迁移和交易结构可支撑低位 $1B 到中位 $1B 的估值区间，才推进接触。
      edges:
        - from: n1
          to: n2
          label: 创造上行潜力
        - from: n2
          to: n3
          label: 合规需求强化
        - from: n3
          to: n6
          label: 支撑继续接触
        - from: n4
          to: n6
          label: 限制价格
        - from: n5
          to: n6
          label: 阻挡无条件买入
    claimRefs:
      - CV004
      - CV021
      - CV026
      - CV028
      - CV033
      - CV044
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以 $225M ARR 中点计算，退出倍数的小幅变化就会让 Exabeam 价值波动数亿美元。
    data:
      items:
        - label: 3.0x EV / 收入
          value: 675
          detail: 成熟软件 / 受压 SIEM 的悲观结果。
          tone: negative
        - label: 4.0x EV / 收入
          value: 900
          detail: 严谨 2026 年承销区间的下沿。
          tone: warning
        - label: 5.0x EV / 收入
          value: 1125
          detail: 中等增长下，基础情景的私有软件式结果。
          tone: neutral
        - label: 6.0x EV / 收入
          value: 1350
          detail: 如果迁移和 AI 增购被证明可持续，基础情景更强。
          tone: positive
        - label: 7.0x EV / 收入
          value: 1575
          detail: 仍未回到 2021 年式亢奋的溢价结果。
          tone: positive
    approximationNotes: 数值单位为百万美元，仅用 $225M ARR 中点做敏感性分析。该图不声称公司披露了收入。
    claimRefs:
      - CV018
      - CV019
      - CV037
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 区间很宽，因为估值支撑更多取决于留存和迁移证据，而不是公司质地叙事本身。
    data:
      items:
        - label: 熊市情景
          low: 500
          mid: 700
          high: 900
          note: 倍数压缩叠加迁移摩擦，把 Exabeam 推向受压软件定价。
        - label: 基础情景
          low: 1000
          mid: 1200
          high: 1500
          note: 中等增长、适度 Nova 增购和可接受留存，支撑可承销区间。
        - label: 牛市情景
          low: 1700
          mid: 1900
          high: 2100
          note: 高质量留存、New-Scale 牵引力和强 AI 货币化，足以支持安全数据资产的异常值待遇。
    approximationNotes: 数值单位为百万美元，反映情景端点，不是观察到的公允价值。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Exabeam 在战略相关性和产品差异化上得分较高，但估值支撑和证据质量较弱。
    data:
      items:
        - label: 市场顺风
          value: 4/5
          detail: 合规、事件响应和复杂混合环境仍支撑 SIEM 需求。
          tone: positive
        - label: 产品差异化
          value: 4/5
          detail: Nova、ABA 和 UEBA 深度构成了有一定分量的差异化叙事。
          tone: positive
        - label: 装机基础杠杆
          value: 4/5
          detail: 合并后的客户资产给了 Exabeam 真实的迁移和交叉销售切面。
          tone: positive
        - label: 竞争压力
          value: 2/5
          detail: Microsoft 捆绑以及 Cisco/Splunk 规模，是严肃的定价和采购威胁。
          tone: warning
        - label: 估值支撑
          value: 2/5
          detail: 公开证据支持继续接触，但缺少额外证明时，支撑不了高溢价后期估值。
          tone: negative
        - label: 证据质量
          value: 2/5
          detail: 外部标记存在，但当前 ARR、NRR、杠杆和赞助方条款仍未披露。
          tone: negative
    approximationNotes: 评分是作者综合留存证据集后的判断，用于投资委员会讨论，不是机械估值模型。
    claimRefs:
      - CV021
      - CV024
      - CV028
      - CV033
      - CV044
      - CV045
