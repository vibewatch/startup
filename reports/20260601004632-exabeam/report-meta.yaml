  foundingLocation: Foster City, California, USA
  headquarters: Foster City, California, USA
  productSummary: >-
    Exabeam sells the New-Scale Fusion platform (cloud-native SIEM + UEBA +
    SOAR), the Nova multi-agent AI suite (six autonomous security agents
    including Nova Advisor, Nova Triage, and Nova Detective), the LogRhythm
    SIEM (self-managed enterprise), and Exabeam Nova for Analysts. Products are
    sold via direct enterprise sales and an APEX channel-partner program.
  customerFocus: >-
    Mid-to-large enterprises in financial services, government and public sector,
    critical infrastructure, healthcare, and professional services; primary buyers
    are CISOs and SOC managers at organizations with 1,000+ employees.
  businessModel: >-
    Subscription SaaS (New-Scale cloud) and term-license (LogRhythm self-managed),
    priced per data volume (GB/day) or per user, with professional services and
    managed detection & response add-ons.
