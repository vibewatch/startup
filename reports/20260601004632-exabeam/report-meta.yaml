companyProfile:
  summary: >-
    Exabeam is a cybersecurity company headquartered in Foster City, California,
    specializing in AI-driven security information and event management (SIEM)
    and user and entity behavior analytics (UEBA). Founded in 2013, the company
    completed a transformative merger with LogRhythm in July 2024 to form the
    world's largest independent SIEM provider. Exabeam's cloud-native New-Scale
    Fusion platform and the Nova multi-agent AI system deliver behavioral
    baselining, dynamic risk scoring, and autonomous investigation workflows
    across 1,000+ integrations. The combined company serves 600+ customers
    globally, with concentration in financial services, government, and
    critical infrastructure. Thoma Bravo and Francisco Partners are the primary
    private equity sponsors.
  foundedDate: '2013-01-01'
  founders:
