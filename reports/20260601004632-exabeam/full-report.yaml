      - number: '7.3'
        title: Technology and Product Risks
        blocks:
          - type: paragraph
            body: >-
              Exabeam's product surface is expanding in ways that create both differentiation and technical risk. Nova
              now markets six separate agents and positions agentic automation as a core part of threat detection,
              investigation, and executive visibility. At the same time, the company operates an integration estate
              spanning hundreds of vendors, thousands of parsers, multiple cloud sources, and behavioral models designed
              to reduce false alarms. That breadth is useful for customers, but it creates parser-maintenance burden,
              tuning complexity, and more places where drift can degrade analyst trust. The independent review surface
              matters here because it is directionally consistent with the product architecture: users praise usability
              and analytics, yet they still complain about false positives, baselining, documentation, and patch-related
              instability. The new MCP layer is the clearest emerging risk. Exabeam's own MCP materials acknowledge that
              these endpoints are privileged access paths into sensitive systems, while the broader MCP specification
              warns about arbitrary data access and code execution, and outside researchers show how autonomous agents
              can leak credentials, exfiltrate data, or be manipulated through prompt injection. The implication is
              straightforward: agentic workflows may improve productivity, but they also expand the blast radius of
              permissioning, logging, and model-governance mistakes. That makes technology risk inseparable from trust
              and governance risk in the product roadmap.
