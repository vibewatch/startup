  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Exabeam no longer competes in a clean standalone-SIEM category. The evidence set shows four practical
              rival classes: bundled cloud platforms led by Microsoft Sentinel; legacy or incumbent enterprise stacks
              led by Splunk Enterprise Security and IBM QRadar; XDR-led consolidation plays led by Palo Alto Cortex
              XSIAM and CrowdStrike Falcon Next-Gen SIEM; and cloud-native specialists such as Rapid7, Securonix, Sumo
              Logic, SentinelOne, and Elastic. Buyers increasingly compare detection quality, automation, cost control,
              and first-party telemetry access in the same budget motion rather than separating log management from
              broader SOC outcomes. That market structure matters because Exabeam wins for a different reason than most
              platform giants: it is strongest when a customer wants behavior-led analytics and faster workflows without
              immediately replacing every existing data or security control. The problem is that the largest competitors
              are using bundling, platform breadth, and native ecosystem distribution to reduce how often buyers run a
              pure feature-by-feature SIEM bake-off at all.
