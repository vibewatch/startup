  - id: TV005
    title: Thesis-break triggers and diligence asks
    columns:
      - Trigger / ask
      - Monitoring signal
      - Why it matters
      - Action implication
    rows:
      - - Post-merger retention below threshold
        - Gross or logo retention below 85%
        - The installed-base and migration thesis weakens immediately.
        - Move to neutral / avoid unless price resets materially.
      - - New-Scale migration stalls
        - Low cloud-native customer adds or weak migration cohorts
        - AI differentiation may exist without translating into economic quality.
        - Do not underwrite premium multiples.
      - - Microsoft displacement risk is high
        - Sentinel used as active replacement or price anchor in core accounts
        - Exabeam's standalone pricing power and upsell path are impaired.
        - Shift scenario model toward 3x-4x revenue.
      - - Sponsor structure is onerous
        - Control, debt, or exit-timing terms absorb base-case upside
        - Equity outcome can disappoint even if operations improve.
        - Prefer partnership or commercial engagement over equity.
      - - Integration friction remains visible in the field
        - Review evidence, support issues, or migration delays persist
        - The combined company may need longer than modeled to unlock synergies.
        - Push the company into a slower-growth valuation bucket.
    notes: These are decision triggers rather than generic risks; each one links directly to valuation support.
    claimRefs:
      - CV028
      - CV030
      - CV032
      - CV033
      - CV038
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR bridge
        - Current combined ARR, cloud mix, and migration mix between New-Scale and legacy estates
        - Required to convert scenario ranges into a real underwriting case.
        - CFO / finance data room
      - - Retention quality
        - Gross retention, logo retention, and NRR by legacy Exabeam vs. LogRhythm cohorts
        - Tells investors whether the installed-base thesis is real or merely sticky on paper.
        - Finance plus customer-success diligence
      - - Microsoft overlap analysis
        - Share of accounts already using Sentinel, Copilot, or bundled Microsoft security tools
        - Determines pricing pressure and displacement risk inside the installed base.
        - CRO / field-architecture review
      - - New-Scale customer traction
        - Count of cloud-native customers, migration cadence, and Nova attach rates
        - Separates AI narrative from actual product-led expansion economics.
        - Product and revenue-operations diligence
      - - Sponsor and debt terms
        - Cap table, control rights, debt covenants, and planned exit horizon
        - New investors can lose even if revenue grows if the structure is unfavorable.
        - Legal and board-material review
    notes: If management cannot produce this package, the recommendation should not move above conditional-positive.
    claimRefs:
      - CV033
      - CV039
      - CV041
      - CV044
      - CV045
