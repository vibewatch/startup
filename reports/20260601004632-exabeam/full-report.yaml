          - type: callout
            title: Microsoft is the cleanest compression risk
            body: >
              Microsoft's current Sentinel pricing model shows why Exabeam cannot rely on category growth alone. Free
              key-log ingestion, large commitment discounts, and broader platform bundling can compress standalone SIEM
              pricing even if Exabeam's product quality is solid.
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV038
          - type: callout
            title: The ARR range is an underwriting assumption, not disclosed fact
            body: >
              The scenario model works only because it makes its uncertainty explicit. Public sources still do not
              disclose current ARR, so the $200-$300M range is a decision tool that must be replaced with company data
              before capital is committed.
            calloutType: assumption
