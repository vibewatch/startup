      - number: '2.2'
        title: Market Sizing and Growth
        blocks:
          - type: paragraph
            body: >-
              Public SIEM market estimates are directionally consistent on growth but materially inconsistent on current
              size, which is exactly why a diligence memo should preserve multiple lenses instead of pretending there is
              one canonical TAM. The retained sources range from about $4.7 billion to $12.56 billion for recent
              starting years and from roughly $14.0 billion to $33.69 billion for outer-year forecasts, with most
              published CAGR assumptions still landing in the low-double- to mid-teen range. The spread is best
              explained by category-boundary differences: some publishers keep to core SIEM, while others implicitly
              fold in broader cloud, analytics, or modernization layers. For Exabeam, the practical question is not the
              widest published headline but the spend pool where buyers want SIEM plus UEBA, automation, and
              multi-vendor visibility. On that lens, a rough $10-15 billion TAM, $4-6 billion SAM, and $0.5-1.0 billion
              SOM are more decision-useful than a single inflated global number.
