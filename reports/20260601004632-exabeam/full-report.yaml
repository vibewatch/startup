chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Founding
        blocks:
          - type: paragraph
            body: >-
              Exabeam is a private cybersecurity company founded in 2013 in Foster City, California, and its retained
              public materials still anchor the brand around analytics-driven security operations rather than a narrow
              legacy SIEM description. The company explains that the name combines the idea of an exabyte of machine
              data with a beam of light used to find meaningful patterns, which is a concise articulation of its
              original value proposition. Founders Nir Polak, Sylvain Gil, and Barry Shteiman brought prior
              cybersecurity experience into that thesis. The 2024 LogRhythm merger materially changed the company’s
              shape: Exabeam now presents itself as the combined business, with Foster City and Broomfield both relevant
              to headquarters identity. In 2026 the public product surface spans New-Scale Fusion, New-Scale SIEM,
              New-Scale Analytics, legacy LogRhythm-branded modules, UEBA, and a broader AI-led security operations
              narrative, making the company easier to classify as a merged security operations platform than as a
              single-point product vendor.
