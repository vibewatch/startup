      - number: '3.4'
        title: Moat Analysis
        blocks:
          - type: paragraph
            body: >-
              Exabeam’s moat is real, but it is narrower than a simple ‘AI SIEM’ pitch implies. The most defensible
              pieces are its long-standing behavior-analytics orientation, its ability to augment incumbent SIEM
              environments instead of forcing immediate replacement, and its merged deployment flexibility across
              cloud-native and self-hosted product lines. The parser estate and open-integration posture also matter
              because they reduce migration friction and help Exabeam win in heterogeneous environments where platform
              vendors prefer customers to standardize on first-party data. Trust and compliance signals are competitive,
              but not unique. The weaker part of the moat is durability. Large rivals can quickly imitate AI assistants,
              case summaries, and reporting wrappers, while Microsoft, Palo Alto, CrowdStrike, and Cisco-Splunk can
              bundle adjacent controls into a broader platform contract. The biggest unresolved question is whether the
              combined Exabeam and LogRhythm portfolio is becoming a unified control plane fast enough to create
              switching costs, or whether it mainly preserves installed base while more integrated rivals move faster.
