      - number: '2.5'
        title: Market Risks and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal is that Exabeam competes in a market where the center of gravity is moving
              toward bundled platforms. Microsoft Sentinel already markets built-in SIEM, SOAR, UEBA, threat
              intelligence, and a security data lake; CrowdStrike sells aggressive economic displacement against legacy
              SIEM; Palo Alto pitches XSIAM as the AI-driven SOC platform that upgrades SIEM entirely; and IBM QRadar
              still markets incumbent breadth and integration depth. Elastic, Splunk, Securonix, Varonis, and Sumo Logic
              all reinforce the same pattern: buyers are increasingly judging platforms on consolidation, analyst
              productivity, automation, and cross-domain context, not only on traditional correlation logic. That does
              not erase Exabeam’s relevance, because its augmentation and behavior-analytics position is real, but it
              does mean valuation should not assume a clean standalone-SIEM market structure. The risk is category
              convergence plus hyperscaler and XDR-led bundling, with Microsoft as the most obvious displacement threat.
