      - number: '8.3'
        title: Bear Case and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              The bear case starts with competition and ends with capital structure. Microsoft Sentinel is no longer
              just a functional competitor; Microsoft's current pricing page emphasizes free daily ingestion for key
              logs, commitment tiers that can save up to 52% over pay-as-you-go, and a broader AI-first security
              narrative connected to Security Copilot and the Microsoft estate. That kind of bundle pressure can erode
              standalone SIEM pricing power, especially where the buyer already standardizes on Microsoft identity,
              endpoint, or cloud tooling. Cisco's absorption of Splunk adds another large-platform pressure source on
              the high end, while Exabeam still must convince customers to migrate through post-merger product choices
              without triggering attrition.


              There are also direct adverse operating signals. PeerSpot reviewers describe integration gaps, high false
              positives, UI inefficiencies, and mixed pricing sentiment, while TechTarget's generic SIEM implementation
              guidance reminds investors that deployment cycles can run 90 days or more, cost hundreds of thousands of
              dollars, demand expert staffing, and generate overwhelming alert volumes. BankInfoSecurity's report on
              Exabeam's 2023 layoff round underscores that the company already had to tighten its cost base before the
              merger. Most importantly, Sumo Logic provides a cautionary precedent: a real cloud analytics vendor with
              public-market access still ended up taken private for $1.7 billion. Exabeam could outperform that path,
              but only if the merged entity proves migration durability and avoids being valued as another mature
              log-management asset in a compressed-multiple market.
