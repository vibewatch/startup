      - number: '7.2'
        title: Operational and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The core operational question is whether Exabeam can integrate two product heritages without confusing
              customers or stretching engineering and support resources. The merger close announcement explicitly
              describes a combined company built from cloud-native Exabeam assets and LogRhythm's self-managed
              data-ingestion estate, while product pages and strategy posts show the company still supporting
              self-hosted LogRhythm SIEM, AI augmentation via LogRhythm Intelligence, and eventual migration into the
              New-Scale platform. That broad optionality is customer-friendly, but it is also operationally expensive.
              It requires parallel roadmap discipline, clear packaging, consistent field messaging, and support
              competence across on-prem, hybrid, and cloud-native environments. Public materials show meaningful global
              footprint and office presence in APAC and MEA, yet peer feedback still flags regional support
              inconsistency, slow response in some markets, and deployment friction at scale. Leadership transition adds
              another layer: Christopher O'Malley led the merger close, while Pete Harteveld now frames the next phase
              around tighter execution, partner alignment, and disciplined reliability. That is sensible, but it also
              means investors are effectively underwriting a culture-and-integration program, not merely a feature
              roadmap. If migration cohorts stall or service quality degrades during this handoff, customer retention
              could deteriorate faster than headline product momentum suggests.
