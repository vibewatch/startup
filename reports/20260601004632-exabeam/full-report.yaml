        - Persistent price-led displacement into mid-market or cost-sensitive enterprise accounts
        - Lower growth and margin expectations unless Exabeam proves premium conversion
        - Augmentation positioning and workflow differentiation
      - - Cloud or platform reliability event
        - Status incidents, ingestion outages, or prolonged query degradation
        - Material multi-region outage or repeated SLA misses
        - Tighten downside case and demand root-cause remediation before adding exposure
        - 24-7 cloud ops monitoring and published availability targets
