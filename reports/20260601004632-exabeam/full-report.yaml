            body: >-
              Public evidence does not support a clean ARR, CAC, or margin model, so the right approach is to separate
              what is observable from what is only estimable. Exabeam's 2023 restructuring note explicitly targeted
              operational efficiency, financial health, and COGS reduction, while outside coverage quantified the cut at
              roughly 20% of staff. Those are classic signals of a software company tightening gross-margin and
              operating-expense discipline before a major capital event. Pricing reviews suggest Exabeam can command
              enterprise budgets and flexible contract structures, but they also show that realized pricing depends on
              negotiated scope, data volume, and channel discounts. The result is a business that probably has
              software-like gross margins on the cloud platform, but not with the simplicity of a pure-seat SaaS vendor
              because self-hosted continuity, migration work, and merger integration all muddy the read. A broad public
