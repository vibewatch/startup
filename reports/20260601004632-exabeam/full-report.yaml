              Exabeam’s capital history shows a company that scaled through a long private-financing ladder well before
              the 2024 merger. Crunchbase records rounds from Series A in 2014 through Series F in 2021 plus a venture
              round later in 2021, while Thoma Bravo says it invested starting in 2018. The public sequence matters
              because it shows repeated support from institutional venture and growth investors rather than a single
              opportunistic round. The historical ladder includes Norwest Venture Partners, Icon Ventures, Cisco
              Investments, Lightspeed Venture Partners, Sapphire Ventures, and Owl Rock Capital. The strongest public
              standalone valuation anchor is the approximately $2.4 billion figure associated with the 2021 Series F
              period. What remains opaque is equally important: retained public evidence does not disclose current
              revenue, ARR, debt terms, ownership percentages, liquidation preferences, or post-merger control rights.
              Diligence can therefore establish that Exabeam is well financed and sponsor-backed, but not how economics
