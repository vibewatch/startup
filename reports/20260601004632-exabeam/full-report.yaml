      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case for security operations tooling is easy to understand from the retained evidence.
              Verizon’s 2026 DBIR says vulnerability exploitation has overtaken credential theft as the top initial
              access path, ransomware remains pervasive, and third-party exposures are rising. IBM’s breach research
              adds a hard-dollar ROI case, while CISA and NIST create policy pressure around prioritization, governance,
              resilience, and secure-by-design expectations. At the same time, labor constraints keep pushing buyers
              toward automation, AI assistance, and behavior-driven noise reduction. Those same forces create adoption
              friction, however. Integration with legacy systems is still hard, implementation and maintenance remain
              expensive, and skilled operators are scarce. That is why Exabeam’s augmentation message matters: a phased
              overlay on top of existing tooling can be easier to buy than an immediate rip-and-replace, even though
              long-term platform consolidation may still be the buyer’s destination.
