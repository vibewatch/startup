        title: Revenue Model and Pricing Structure
        blocks:
          - type: paragraph
            body: >-
              Exabeam sells security-operations software rather than an advertising, marketplace, or transactional
              product. Public product and merger materials show a cloud-native New-Scale Fusion platform plus continuing
              self-managed LogRhythm SIEM continuity, so monetization mixes recurring software subscriptions with some
              legacy renewal, support, and migration economics. Public pricing remains enterprise and quote-based.
              Review evidence says contracts can be structured around user count or gigabits-per-day ingestion, while
              the partner program adds deal-registration discounts, predictable margins, rebates, and no-revenue-minimum
              onboarding for channel partners. That combination is good for reach and partner motivation, but it is bad
              for outside underwriting because no retained source reveals a standard list price, realized discount
              waterfall, or clean net-price-to-gross-margin bridge. The best public read is enterprise subscription ARR
              with partner-assisted distribution and some implementation/support attachment, not a clean self-serve SaaS
              motion.
