    rows:
      - - Recommendation
        - Conditional-positive
        - >-
          Real product and strategic relevance, but incomplete price support and sponsor-opacity mean engagement must
          stay diligence-led.
        - Upgrade only after retention, cloud migration, Microsoft exposure, and control terms are verified.
      - - Confidence
        - Medium
        - >-
          Enough external valuation and market evidence exists to frame a decision, but current ARR and NRR are still
          undisclosed.
        - Falls if management withholds cohort economics; rises if data-room metrics corroborate the migration thesis.
      - - Risk rating
        - High
        - >-
          Integration execution, Microsoft price pressure, and sponsor exit/control dynamics create real downside
          despite product strength.
        - Improves only if attrition stays low and sponsor structure proves clean for new capital.
      - - Valuation stance
        - Evidence-sensitive; fair only in low-$1B range
        - >-
          2026 software multiples are far below 2021 peaks, and public evidence supports roughly $1.0-$1.5B EV more than
          legacy unicorn marks.
        - Becomes stretched above that range unless growth and retention look premium.
      - - Decision implication
        - Proceed to management diligence or structured partnership, not blind-equity underwriting
        - >-
