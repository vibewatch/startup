      - number: '2.3'
        title: Buyer Segmentation and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The strongest fit for Exabeam is not every enterprise with logs; it is the subset with a real SOC problem
              to solve. Public segmentation across Exabeam and third-party market studies repeatedly points to large
              enterprises, regulated industries, government environments, and increasingly upper mid-market
              organizations that need centralized monitoring across hybrid infrastructure. The day-to-day users are
              analysts, detection engineers, incident responders, and security architects, but the budget is usually
              controlled by the CISO, VP of Security Operations, or a central security organization. NIST’s
              risk-management framing and ISC2’s governance research both support the idea that cyber platforms
              increasingly need executive and board-level justification rather than only technical sponsorship. Exabeam
              Nova’s explicit positioning toward SOC leadership reinforces that pattern. The practical implication is
              that buyer motion depends as much on governance, staffing pain, and workflow maturity as it does on raw
              threat volume.
