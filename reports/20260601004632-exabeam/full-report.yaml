      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional-positive is a diligence call, not a blind buy call
            body: >
              Exabeam is credible enough to pursue, but only with entry discipline. The company has a real platform,
              visible AI differentiation, and sponsor-backed scale; what it does not yet have in public is the retention
              and migration evidence required to justify a premium 2026 software multiple.
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV026
              - CV035
