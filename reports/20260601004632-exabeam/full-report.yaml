        title: Technical Risks and Roadmap
        blocks:
          - type: paragraph
            body: >-
              The main product risk is not lack of feature velocity; public evidence actually suggests active release
              motion across both product lines. The harder issue is integration risk inside the combined portfolio.
              Exabeam wants to preserve self-managed continuity, keep quarterly launches for LogRhythm-era customers,
              and simultaneously push the cloud-native platform as the long-run foundation. That is commercially
              sensible, but technically it implies two major tracks, distinct deployment mechanics, and ongoing
              migration work rather than a fully unified code base today. User-review evidence strengthens that concern:
              PeerSpot reviewers praise timelines, analytics, and automation, yet still cite false positives from
              baselining, uneven documentation for API work, slow support in some regions, and deployments that can
              stretch from days to months depending on data volume and integration complexity. The roadmap therefore
              looks credible on feature delivery but less proven on transition execution. The next diligence step is not
              another demo; it is cohort evidence on how many LogRhythm customers are adopting New-Scale or Nova
              successfully, how long migrations take, and whether false positives and analyst effort actually fall after
              tuning in production.
