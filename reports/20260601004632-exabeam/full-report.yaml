  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Exabeam does not sell into a narrow log-management niche; it sells into a security operations buying
              motion where SIEM, behavior analytics, automation, and response workflows are increasingly evaluated
              together. Exabeam’s own public surface combines SIEM, UEBA, SOAR, TDIR, AI, and compliance language, while
              Microsoft, Splunk, Elastic, and other competitors similarly package multiple workflows in one platform.
              That means the relevant market boundary should include centralized security logging, correlation,
              investigation, case management, UEBA, and security-response automation that buyers treat as part of the
              same SecOps platform decision. It should exclude generic observability, application performance tooling,
              and commodity IT logging unless those systems are explicitly attached to security monitoring and
              incident-response outcomes. For diligence, that boundary matters because Exabeam’s differentiation sits in
              augmentation, behavior analytics, and workflow acceleration, not just raw data retention.
            claimRefs:
