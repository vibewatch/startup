  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is real because Exabeam's core value proposition depends on ingesting, correlating,
              and analyzing user, asset, and workflow telemetry that can contain employee behavioral signals, access
              data, and other personal information. Exabeam's public controls are meaningful: the company highlights
              data masking, role-based access control, retention controls, encryption, GDPR-aligned processing, and
              region-specific hosting endpoints across North America, Europe, the Middle East, and APAC. Those controls
              reduce risk, but they do not eliminate it. GDPR still treats automated processing of personal data as a
              fundamental-right issue, ICO employment guidance explicitly ties worker monitoring and biometric use to
              data-protection obligations, and California privacy law imposes notice, retention, and service-provider
              obligations around sensitive personal information. The regulatory stack is widening rather than narrowing:
              the FTC has made clear there is no AI exemption from existing deception law, the EU AI Act imposes
              risk-management and post-market-monitoring duties for high-risk AI uses, and the SEC cyber-disclosure rule
              is raising operational expectations among public-company buyers. That combination creates a two-sided
              risk: Exabeam can benefit from compliance-driven demand, but any gap between marketed AI outcomes and
              governed, auditable behavior will be scrutinized more aggressively in 2026 than in prior years.
            claimRefs:
