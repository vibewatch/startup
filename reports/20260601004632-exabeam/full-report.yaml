companyProfile:
  summary: >-
    Exabeam is a cybersecurity company headquartered in Foster City, California, specializing in AI-driven security
    information and event management (SIEM) and user and entity behavior analytics (UEBA). Founded in 2013, the company
    completed a transformative merger with LogRhythm in July 2024 to form the world's largest independent SIEM provider.
    Exabeam's cloud-native New-Scale Fusion platform and the Nova multi-agent AI system deliver behavioral baselining,
    dynamic risk scoring, and autonomous investigation workflows across 1,000+ integrations. The combined company serves
    600+ customers globally, with concentration in financial services, government, and critical infrastructure. Thoma
    Bravo and Francisco Partners are the primary private equity sponsors.
  foundedDate: '2013-01-01'
  founders:
    - name: Nir Polak
      role: Co-Founder & original CEO
      background: Security industry veteran; later transitioned to advisor role post-Series F.
      claimRefs:
        - CO003
    - name: Sylvain Gil
      role: Co-Founder & VP Products
      background: Security analytics and UEBA product architect.
      claimRefs:
        - CO003
    - name: Barry Shteiman
      role: Co-Founder & VP Research
      background: Cybersecurity researcher and threat intelligence specialist.
      claimRefs:
        - CO003
  foundingLocation: Foster City, California, USA
  headquarters: Foster City, California, USA
  productSummary: >-
    Exabeam sells the New-Scale Fusion platform (cloud-native SIEM + UEBA + SOAR), the Nova multi-agent AI suite (six
    autonomous security agents including Nova Advisor, Nova Triage, and Nova Detective), the LogRhythm SIEM
    (self-managed enterprise), and Exabeam Nova for Analysts. Products are sold via direct enterprise sales and an APEX
    channel-partner program.
  customerFocus: >-
    Mid-to-large enterprises in financial services, government and public sector, critical infrastructure, healthcare,
    and professional services; primary buyers are CISOs and SOC managers at organizations with 1,000+ employees.
  businessModel: >-
    Subscription SaaS (New-Scale cloud) and term-license (LogRhythm self-managed), priced per data volume (GB/day) or
    per user, with professional services and managed detection & response add-ons.
  stage: Growth — PE-backed post-merger
  fundingStatus: >-
    Last disclosed round: $200M Series F (June 2021, led by Owl Rock Capital) at a $2.4B valuation. Total raised ~$393M.
    Currently owned by Thoma Bravo (Exabeam legacy) and Francisco Partners (LogRhythm legacy); no new institutional
    round since the merger.
