- id: SV004
  title: Scenario Analysis and Price Sensitivity
  body: |
    The scenario model should be treated as a price-discipline tool, not as a claim that current Exabeam ARR is publicly known. Public evidence still does not disclose current ARR, NRR, gross margin, or merger leverage, so the only defensible approach is to model an explicit underwriting range and then test multiples against it. This chapter uses a $200-$300 million ARR range as a working assumption because public sources point to a company large enough to have raised at unicorn valuations, complex enough to require sponsor-backed consolidation, and still too opaque for exact revenue underwriting. The midpoint of $225 million is the easiest way to translate software-multiple evidence into a decision band.

    At that midpoint, 4x revenue implies roughly $0.9 billion EV, 5x implies about $1.1 billion, 6x implies about $1.35 billion, and 7x implies about $1.6 billion. Those numbers line up with the broader evidence set. A base case of 8-12% organic growth, some Nova-led upsell, and moderate migration friction supports about $1.0-$1.5 billion EV, matching the user's target range and the current reality of mid-single-digit software multiples. A bull case above $1.8 billion requires premium retention, clear cloud migration, and AI monetization strong enough to pull Exabeam toward security/data outliers rather than median SaaS. A bear case below $1.0 billion becomes plausible if Microsoft compression, migration delays, or sponsor exit urgency force the asset into slow-growth or take-private-style pricing.
