- id: SV005
  title: Recommendation and Diligence Conditions
  body: |
    The correct call is conditional-positive. Exabeam has a legitimate product and strategic case: sponsor support, a combined installed base, credible AI positioning, regulatory tailwinds, and enough category relevance to justify serious engagement. But none of those strengths eliminate the central valuation problem. The company is still too opaque to underwrite like a clean public-SaaS comp, and the 2026 software market no longer rewards late-stage security vendors for narrative alone. That makes recommendation quality inseparable from diligence quality. Investors or strategic partners should proceed only if the company can prove that the merged platform is retaining customers, migrating them toward New-Scale cloud workflows, and defending itself against Microsoft-led pricing pressure.

    The four gating conditions are straightforward. First, confirm that post-merger gross or logo retention is comfortably above 85%; otherwise the installed-base thesis is weaker than it looks. Second, validate the current New-Scale cloud-native customer count, migration cadence, and expansion motion; without that, Nova and cloud messaging remain more strategic than economic. Third, map Microsoft Sentinel exposure inside the existing customer base, including whether customers use Sentinel as a co-SIEM, a cost anchor, or an active displacement threat. Fourth, diligence the sponsor stack — control rights, exit horizon, debt, and dilution risk — because Thoma Bravo and related capital providers can shape equity outcomes even if operations improve. If those checks are positive and the implied entry valuation is near the $1.0-$1.5 billion band rather than legacy marks, Exabeam merits active pursuit. If not, it remains a high-quality asset with a stretched underwriting case.
