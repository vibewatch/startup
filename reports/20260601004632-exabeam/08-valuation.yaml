callouts:
- calloutType: recommendation
  title: Conditional-positive is a diligence call, not a blind buy call
  body: |
    Exabeam is credible enough to pursue, but only with entry discipline. The company has a real platform, visible AI differentiation, and sponsor-backed scale; what it does not yet have in public is the retention and migration evidence required to justify a premium 2026 software multiple.
  claimRefs:
  - CV021
  - CV026
  - CV035
  - CV044
- calloutType: risk
  title: Microsoft is the cleanest compression risk
  body: |
    Microsoft's current Sentinel pricing model shows why Exabeam cannot rely on category growth alone. Free key-log ingestion, large commitment discounts, and broader platform bundling can compress standalone SIEM pricing even if Exabeam's product quality is solid.
  claimRefs:
  - CV028
  - CV029
  - CV038
- calloutType: assumption
  title: The ARR range is an underwriting assumption, not disclosed fact
  body: |
    The scenario model works only because it makes its uncertainty explicit. Public sources still do not disclose current ARR, so the $200-$300M range is a decision tool that must be replaced with company data before capital is committed.
