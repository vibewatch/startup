chapter:
  number: 8
  title: Valuation & Recommendation
  summary: Exabeam is credible enough to merit continued investment or partnership engagement, but not on a price-insensitive basis. Public evidence supports a conditional-positive recommendation only if post-merger retention, New-Scale cloud migration, Microsoft displacement risk, and sponsor exit/control terms all check out; under reasonable 2026 software-multiple discipline, the defensible enterprise-value band is closer to roughly $1.0-$1.5 billion than to legacy 2021-style marks.
sections:
- id: SV001
  title: Valuation Framework and Comparable Set
  body: |
    Exabeam has enough external reference points to build a disciplined valuation frame, but not enough disclosure to support false precision. The hard anchors are the June 2021 Series F round at a $2.4 billion valuation, the July 2024 completion of the LogRhythm merger, the May 2023 Forge secondary marker at $2.65 billion, and the fact that merger economics, current ARR, NRR, and leverage were never publicly disclosed. That combination matters: the company clearly reached unicorn scale, yet the post-merger entity now has to be underwritten as a sponsor-controlled consolidation story rather than as a clean venture-backed stand-alone.

    The best comparable set is mixed. Cisco's $28 billion acquisition of Splunk proves scaled strategic buyers still pay up for security-data platforms with real distribution and product breadth. Sumo Logic's $1.7 billion take-private, by contrast, is the cautionary signal: SIEM-adjacent assets can lose public-market support and end up repriced under private-equity ownership. Devo's $2 billion 2022 funding round shows there is still capital for cloud-native security analytics, but current 2026 software-market conditions are far tighter than 2021. Software Equity Group's 1Q26 median EV/TTM revenue multiple of 3.6x, Eqvista's record of a 41.48x 2021 peak followed by a 4.38x 2023 trough, and ValueAddVC's 2025 guidance of roughly 3-7x for mid-growth SaaS are the right valuation guardrails. Exabeam therefore deserves to be valued off current execution quality and sponsor-exit realism, not off its last headline unicorn round.
