- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the clearest public or officially disclosed valuation anchors relevant to Exabeam's SIEM / security-analytics positioning plus current software-market valuation ranges. It is not exhaustive because many private SIEM vendors do not disclose both valuation and operating scale.
  columns:
  - Comparable
  - Metric / status
  - Multiple or valuation mark
  - Relevance
  - Limitation
  rows:
  - - Exabeam (Series F, 2021)
    - $200M growth round
    - $2.4B valuation
    - Last clean company financing anchor for Exabeam itself.
    - Set in a much richer software-multiple environment than 2026.
  - - Exabeam (Forge secondary marker, 2023)
    - Series F-1 / secondary-style marker
    - $2.65B valuation
    - Shows private-market marks held above the 2021 round even before the 2024 merger.
    - Secondary-market markers are not the same as a disclosed operating-value mark.
  - - Splunk / Cisco (2024)
    - Strategic takeout
    - $28B equity value; $157/share
    - Proves large strategics still pay for category-leading security-data platforms.
    - Splunk was a scaled public asset with far more disclosure than Exabeam.
  - - Sumo Logic / Francisco Partners (2023)
    - Public-to-private takeout
    - ~$1.7B equity value; $12.05/share
    - Cautionary downside precedent for log-analytics assets that lose public-market support.
    - Public-company take-private pricing is not a direct private-round multiple.
  - - Devo (Series F, 2022)
    - Growth round
    - $2.0B valuation; >$500M capital raised
    - Useful private cloud-native SecOps peer reference.
    - Official source does not disclose current revenue or trading multiple.
  - - Median public B2B SaaS (SEG 1Q26)
    - 107-company index median
    - 3.6x EV/TTM revenue
    - Best broad-market valuation floor for late-stage software under 2026 conditions.
    - Cross-sector median understates premium security assets with elite growth.
  notes: This table is designed to bracket valuation regimes, not imply that Exabeam should trade exactly like any single row.
