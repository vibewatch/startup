- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR bridge
    - Current combined ARR, cloud mix, and migration mix between New-Scale and legacy estates
    - Required to convert scenario ranges into a real underwriting case.
    - CFO / finance data room
  - - Retention quality
    - Gross retention, logo retention, and NRR by legacy Exabeam vs. LogRhythm cohorts
    - Tells investors whether the installed-base thesis is real or merely sticky on paper.
    - Finance plus customer-success diligence
  - - Microsoft overlap analysis
    - Share of accounts already using Sentinel, Copilot, or bundled Microsoft security tools
    - Determines pricing pressure and displacement risk inside the installed base.
    - CRO / field-architecture review
  - - New-Scale customer traction
    - Count of cloud-native customers, migration cadence, and Nova attach rates
    - Separates AI narrative from actual product-led expansion economics.
    - Product and revenue-operations diligence
  - - Sponsor and debt terms
    - Cap table, control rights, debt covenants, and planned exit horizon
    - New investors can lose even if revenue grows if the structure is unfavorable.
    - Legal and board-material review
  notes: If management cannot produce this package, the recommendation should not move above conditional-positive.
