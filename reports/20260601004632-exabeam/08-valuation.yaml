  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: TV004 comparable coverage
    missingEvidence: Public valuation marks for additional direct SIEM peers such as current Stellar Cyber, newer LogPoint ownership valuation, and other private SIEM transactions with disclosed revenue context
    whyItMatters: The comparable table intentionally brackets the market with the clearest disclosed anchors, but the private-peer set remains thin and makes it harder to place Exabeam precisely inside the current SIEM spectrum.
    diligencePath: Track new funding, secondary-market, or M&A disclosures for private SIEM vendors; supplement TV004 with additional rows once usable public marks appear.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV016
  - type: private-evidence-only
    severity: blocking
    topic: retention
    missingEvidence: Post-merger gross retention, logo retention, and NRR by cohort for legacy Exabeam and LogRhythm customers
    whyItMatters: The installed-base migration thesis only works if the merged entity is actually retaining and expanding customers at healthy levels; without that proof, premium valuation assumptions are speculative.
    diligencePath: Request cohort retention tables and board metrics from the data room; separate New-Scale versus self-managed cohorts.
    relatedQuestionRefs:
    - QV032
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-cloud-migration
    missingEvidence: Current combined ARR, New-Scale cloud-native customer count, migration cadence, and Nova attach-rate data
    whyItMatters: The chapter's valuation range depends on a scenario ARR band because public sources do not disclose current revenue quality or cloud migration traction.
    diligencePath: Request current ARR bridge, cloud mix, and customer migration reporting from finance and revenue operations.
    relatedQuestionRefs:
    - QV033
