- id: TV005
  title: Thesis-break triggers and diligence asks
  columns:
  - Trigger / ask
  - Monitoring signal
  - Why it matters
  - Action implication
  rows:
  - - Post-merger retention below threshold
    - Gross or logo retention below 85%
    - The installed-base and migration thesis weakens immediately.
    - Move to neutral / avoid unless price resets materially.
  - - New-Scale migration stalls
    - Low cloud-native customer adds or weak migration cohorts
    - AI differentiation may exist without translating into economic quality.
    - Do not underwrite premium multiples.
  - - Microsoft displacement risk is high
    - Sentinel used as active replacement or price anchor in core accounts
    - Exabeam's standalone pricing power and upsell path are impaired.
    - Shift scenario model toward 3x-4x revenue.
  - - Sponsor structure is onerous
    - Control, debt, or exit-timing terms absorb base-case upside
    - Equity outcome can disappoint even if operations improve.
    - Prefer partnership or commercial engagement over equity.
  - - Integration friction remains visible in the field
    - Review evidence, support issues, or migration delays persist
    - The combined company may need longer than modeled to unlock synergies.
    - Push the company into a slower-growth valuation bucket.
  notes: These are decision triggers rather than generic risks; each one links directly to valuation support.
  claimRefs:
