evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Current ARR, revenue, gross margin, growth rate, and cash-generation metrics for the combined company are not
      publicly disclosed.
    whyItMatters: >-
      Without current financial metrics, it is difficult to judge growth quality, merger synergy realization, or the
      durability of the combined platform economics.
    diligencePath: >-
      Request management accounts, board materials, or sponsor presentation data covering revenue mix, margin profile,
      and synergy tracking.
    relatedQuestionRefs:
      - QO016
      - QO028
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      A full board roster, committee structure, and CEO-transition rationale are not publicly disclosed in retained
      materials.
    whyItMatters: >-
      Governance visibility is necessary to assess succession discipline, sponsor oversight, and how post-merger
      accountability is actually structured.
    diligencePath: >-
      Request the board list, governance summary, and any CEO-transition memo or management-structure update from the
      company or sponsor.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Public sources do not disclose current ownership percentages, preference terms, or merger-era economic outcomes
      for major investors.
    whyItMatters: >-
      Cap-table economics affect control, downside protection, dilution history, and sponsor incentives in any future
      exit scenario.
    diligencePath: Request the current cap table, financing term summaries, and any merger-related rollover or secondary disclosures.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO014
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: milestone-table
    missingEvidence: >-
      Retained public sources do not provide a fully explicit roadmap for product, branding, and platform unification
      after the merger.
    whyItMatters: >-
      Integration completeness is central to execution risk, product rationalization, and sales-message clarity in the
      combined company.
    diligencePath: >-
      Request an integration roadmap with retired modules, migration milestones, customer migration progress, and
      remaining brand-transition work.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: competitive-share
    missingEvidence: >-
      Public win-rate data, displacement statistics, or credible market-share tables specific to Exabeam versus
      Microsoft, CrowdStrike, Splunk, or IBM.
    whyItMatters: >-
      Without share or win-rate evidence, market-position claims stay directional and could overstate Exabeam’s
      practical capture potential.
    diligencePath: >-
      Ask management for competitive battle-card data, pipeline conversion by competitor, and third-party analyst share
      snapshots under NDA.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: pricing-acv
    missingEvidence: Segment-level pricing, contract duration, ingestion economics, and average contract value for Exabeam deployments.
    whyItMatters: >-
      Pricing model and ACV are necessary to translate TAM into realistic revenue capture and to compare Exabeam against
      bundled competitors.
    diligencePath: >-
      Request price books, recent proposal examples, and cohort-level ACV or ARR by customer segment and deployment
      model.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: government-penetration
    missingEvidence: >-
      Current public evidence isolating Exabeam federal, defense, or broader government penetration and procurement
      posture.
    whyItMatters: >-
      Government is a named target segment, but market attractiveness differs materially if procurement access or
      certifications are weaker than peers.
    diligencePath: Request public-sector customer references, authorization details, and pipeline data by government sub-segment.
    relatedQuestionRefs:
      - QM026
  - type: conflicting-data
    severity: minor
    topic: market-sizing-variance
    missingEvidence: >-
      A single transparent external model that reconciles why public SIEM market estimates differ so widely on base-year
      and forecast values.
    whyItMatters: >-
      The wide spread does not invalidate growth, but it does reduce confidence in any single headline TAM used for
      valuation narratives.
    diligencePath: >-
      Obtain full analyst reports or expert calls that expose category boundary choices, geography splits, and treatment
      of adjacent workflows.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Actual enterprise quotes, discount ladders, ingest volumes, and renewal uplifts for Exabeam and the main competing
      platforms.
    whyItMatters: >-
      Public pricing pages reveal mechanics but not realized ASP, negotiated discounting, or whether Exabeam can defend
      price against bundled or asset-based alternatives.
    diligencePath: >-
      Request anonymized customer proposals, renewal histories, and head-to-head pricing comparisons by segment and
      deployment size.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: portfolio-integration
    missingEvidence: Install-base mix, product migration funnel, and NRR by legacy LogRhythm versus New-Scale cohorts.
    whyItMatters: >-
      Without migration evidence, it is hard to know whether flexible deployment is a durable moat or just an interim
      integration burden that slows roadmap clarity.
    diligencePath: >-
      Request product-roadmap milestones, cohort retention, and account-level migration data for combined Exabeam and
      LogRhythm customers.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: market-share-disclosure
    missingEvidence: >-
      Public or privately shared revenue, ARR, customer-count, and market-share evidence for Exabeam after the LogRhythm
      merger.
    whyItMatters: >-
      Public positioning does not prove whether Exabeam is gaining competitive momentum or merely preserving legacy
      installed base while larger platform vendors expand.
    diligencePath: >-
      Request board materials, investor updates, sales cohort bridges, and third-party competitive win-rate studies tied
      to the post-merger period.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: bundle-driven-displacement
    missingEvidence: >-
      Account-level win-loss data against Microsoft, Palo Alto, CrowdStrike, and Cisco-Splunk in renewal, consolidation,
