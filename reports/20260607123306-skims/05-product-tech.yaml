callouts:
  - calloutType: risk
    title: "Quality Consistency Is a Structural Vulnerability"
    body: >
      SKIMS's 3.5/5 Trustpilot rating from 7,000+ reviews, combined with recurring complaints
      about sizing inconsistency and stitching failures, indicates quality control at manufacturing
      partners is not yet at the level the premium pricing implies. This creates both a returns-cost
      headwind and a brand-damage risk at scale — particularly if the brand expands to 40+ stores
      and new categories where quality problems become more visible.
    claimRefs:
      - CE025
      - CE026
      - CE027

  - calloutType: risk
    title: "NikeSKIMS Launch Delay Signals Execution Risk at Scale"
    body: >
      The NikeSKIMS debut slipped six months from spring to September 2025, attributed to needing
      additional time to finalize product readiness. This is a leading indicator of the execution
      complexity that simultaneous expansion across 22+ stores, international markets, beauty/fragrance,
      and the JV creates. Investors should pressure-test operational capacity before assuming the
      $1B+ net-sales milestone is achieved with margin discipline.
    claimRefs:
      - CE021
      - CE022

  - calloutType: insight
    title: "11M Restock Subscribers Is a Durable First-Party Data Moat"
    body: >
      More than 11 million consumers have opted in to SKIMS product drop alerts, representing a
      scalable owned-marketing channel that reduces paid-social acquisition dependency. As
      third-party cookies deprecate and social platforms raise CPMs, this list becomes an
      increasingly valuable competitive asset — provided SKIMS maintains TCPA compliance and
      list hygiene.
    claimRefs:
      - CE014
      - CE015

