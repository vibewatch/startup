  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: supply-chain
      missingEvidence: >
        Supplier names, manufacturing countries, factory-audit results, and fiber-content
        compliance documentation (FTC TFPIA).
      whyItMatters: >
        Without knowing SKIMS's manufacturing partner list, investors cannot assess geographic
        concentration risk, labor-standard exposure, or quality-control program rigor.
      diligencePath: >
        Request supplier disclosure schedule, factory audit reports, and FTC Textile Act compliance
        records in the IPO S-1 due-diligence process or investor data room.
      relatedQuestionRefs:
        - QE017

    - type: private-evidence-only
      severity: material
      topic: ecommerce-stack
      missingEvidence: >
        Confirmed e-commerce platform vendor (Shopify, Salesforce Commerce, custom), OMS system,
        and technology infrastructure supporting $1B+ revenue channel.
      whyItMatters: >
        Platform concentration, vendor lock-in, or tech-debt could represent both operational risk
        and an IPO red flag; undisclosed tech stack complicates pre-IPO DD.
      diligencePath: >
        Request technology vendor list, contracts, and redundancy/SLA documentation.
      relatedQuestionRefs:
        - QE005
        - QE022

    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >
        SKIMS has no public GitHub repository, developer API, or practitioner community (e.g. Discord,
        Slack, Stack Overflow tags). LinkedIn company page and careers postings are the closest proxy
        for technology hiring signal. No engineering blog or public tech talks were located.
      whyItMatters: >
        Inability to assess SKIMS's internal engineering capability is a diligence limitation;
        the company's operational scale ($1B+ revenue, 18+ stores, 11M subscriber marketing platform)
        requires substantial engineering investment that cannot be independently verified.
      diligencePath: >
        Request headcount breakdown by function, engineering team size, key technology vendors,
        and a system architecture overview in the investor data room.
      relatedQuestionRefs:
        - QE005
        - QE023

    - type: private-evidence-only
      severity: material
      topic: quality-metrics
      missingEvidence: >
        SKIMS has not disclosed return rates by product category, defect rates, or NPS/CSAT scores
        beyond the public Trustpilot data.
      whyItMatters: >
        Quality-driven returns are a gross-margin headwind; without precise return rates, the
        $6 return-fee revenue offset and total returns cost cannot be modeled.
      diligencePath: >
        Request return rate by category, defect/exchange rate, customer service cost per return,
        and CSAT/NPS from the SKIMS management team.
      relatedQuestionRefs:
        - QE019

    - type: private-evidence-only
      severity: minor
      topic: NikeSKIMS-IP
      missingEvidence: >
        Terms of the NikeSKIMS joint venture — including IP allocation, exclusivity, royalties,
        revenue share, and termination rights — are not publicly available.
      whyItMatters: >
        If the JV is terminable or if Nike retains most IP, the NikeSKIMS contribution to
        SKIMS's long-term value could be lower than the collaboration's marketing profile implies.
      diligencePath: >
        Request the NikeSKIMS JV agreement or a summary of key commercial terms in the data room.
      relatedQuestionRefs:
        - QE012

    - type: missing-source
      severity: minor
      topic: fabric-certifications
      missingEvidence: >
        No OEKO-TEX, GOTS, or other third-party fabric certification has been located for any
        SKIMS product line on the company's website or in press materials.
      whyItMatters: >
        Absence of certifications limits SKIMS's sustainability positioning and exposes it to
        greenwashing risk if marketing copy implies fabric safety without third-party verification.
      diligencePath: >
        Request fabric composition and certification status per product line from SKIMS management.

