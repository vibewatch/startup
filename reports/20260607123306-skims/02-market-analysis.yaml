callouts:
  - calloutType: risk
    title: Conflicting Market Size Estimates Undermine TAM-Based Valuation
    body: >
      Grand View Research and Mordor Intelligence disagree on the 2024 global shapewear market
      base by 14% ($370M) and project CAGR outcomes 3.1 percentage points apart, yielding a
      $1.17 billion spread in 2030 forecasts. Any investor model anchoring SKIMS' valuation to
      a single analyst estimate is building on a contested base. The most defensible approach
      is to use the shapewear market as a floor, bound it with the broader intimate apparel
      frame, and stress-test projections against both the low and high CAGR scenarios.
    claimRefs: [CM034, CM035]

  - calloutType: strength
    title: Inclusive Sizing as a Structural TAM Expander
    body: >
      SKIMS' XS-to-5X size architecture captures a buyer pool that traditional shapewear
      incumbents have systematically under-served. By offering the broadest standardized size
      range in the premium intimate apparel tier, SKIMS converts a demographic constraint into
      a competitive moat. This is not replicable overnight by legacy brands whose supply
      chains, fit models, and wholesale assortments are built around standard sizing.
    claimRefs: [CM013, CM015, CM016]

  - calloutType: insight
    title: DTC-to-Physical Pivot Signals Maturing Phase
    body: >
      SKIMS' stated goal of becoming "predominantly physical" signals that the brand has
      extracted what it can from the DTC growth phase and is now building the distribution
      infrastructure for a larger, wholesale-plus-retail business model. This trajectory
      mirrors the arc of Lululemon and Warby Parker. The 15-store base as of early 2026
      is still sub-scale versus the stated ambition, and the coming 12–18 months of
      new-store performance data will be a critical signal for whether physical economics
      match the DTC model.
    claimRefs: [CM019, CM020, CM021]

  - calloutType: assumption
    title: Men's Segment Traction Assumed Based on Qualitative Press; No SKIMS Revenue Data
    body: >
      Multiple trade sources (Forbes, VogueBusiness) characterize SKIMS menswear as gaining
      traction faster than expected, but no quantitative revenue or units-sold data has been
      published. This analysis assumes the men's segment is material but does not treat it
      as a verified primary revenue driver. Any model relying on men's revenue contribution
      as a core growth assumption should be flagged as unverified.
    claimRefs: [CM026, CM016]

