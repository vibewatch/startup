      - number: '5.4'
        title: NikeSKIMS 合资与运动服饰架构
        blocks:
          - type: paragraph
            body: >
              NikeSKIMS 于 2024 年 3 月正式宣布，是 SKIMS 最重要的产品架构扩张。合资项目把 Nike 的性能面料 IP（Dri-FIT、 压缩和排湿技术）与 SKIMS
              的尺码理念、美学设计语言和包容性色号方法结合起来。首发系列原定 2025 年春季，后推迟到 2025 年 9 月，上市时覆盖 7 个系列和 58 个款型，并通过 Nike.com、SKIMS.com
              和精选零售渠道分销。2026 年春季系列把产品线扩展到 65+ 个款型，增加配饰（袜子、腰包、训练手套），并推出两款鞋履——NikeSKIMS Rift Satin 和 Rift
              Mesh——把合资项目延伸成从头到脚的运动服饰套装，并借助 Nike 在欧洲、中东、Australia 和 Korea 的基础设施做国际分销。

              NikeSKIMS 的产品架构横跨四个面料平台：Studio Stretch（柔软如黄油的 Dri-FIT、轻度压缩）、Matte（顺滑塑形、 中度压缩）、Airy（透气分层 Dri-FIT）和
              Shine（利落速干）。每个平台对应从运动性能到生活方式的不同场景。 这种多平台结构，让合资项目能在健身房、工作室和生活方式场景中，与 Lululemon、Alo Yoga 和 Gymshark 竞争。

              六个月上市延迟提示执行风险集中在 Nike 制造供应链与 SKIMS 设计 / 质量标准的交界处。SKIMS 在国际市场扩张 NikeSKIMS，同时推进 22+ 家美国门店和新品类（计划 2026 年推出美妆
              / 香氛），类似瓶颈的运营风险面会扩大。 合资项目也制造新的 IP 复杂性：NikeSKIMS 品牌产品与独立 SKIMS 产品之间，专利、商标和设计权如何分配并不清楚。
