      - number: '2.6'
        title: 估计之间的矛盾与规模测算缺口
        blocks:
          - type: paragraph
            body: >
              本次市场分析中最可落地的尽调发现，是分析机构之间无法调和的分歧。仅看塑身衣，GVR 与 Mordor Intelligence 对 2024 年基数的估计相差 $370 million——差幅 14%——对
              2030 年的预测相差 $1.17 billion。运动休闲方面，GVR 与 VMR 对 2024 年基数相差 $25 billion。这些机构都没有公布可调和的方法论，品类纳入边界也没有透明定义。


              这些分歧影响 SKIMS 的估值，因为投资者常见做法是把某个市场份额百分比套到 TAM 数字上；采用哪个 TAM，会给出截然不同的结果。占 $2.73B 纯塑身衣市场 10%，对应 $273M 收入；同样占
              $16.2B 贴身服饰市场 10%，对应 $1.62B。投资者材料经常挑选最有利的口径。SKIMS
              更诚实的规模测算路径，是以窄口径塑身衣市场作为地板，叠加来自家居服和基础款的相邻收入（单独估计），并承认任何运动休闲口径 TAM 都包含体量是 SKIMS 50–200x 的竞争者。


              其他缺口包括：（1）没有 SKIMS DTC 与批发收入拆分的公开数据，渠道组合建模只能推测；（2）没有可靠独立估计，把美国大码贴身服饰市场单独量化为美元规模；（3）没有公开的 SKIMS COGS
              或毛利率数据，无法扎实测算投入成本敏感性。这些缺口对私营公司来说是结构性的，只有招股书或管理层直接披露才能解决。
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM040
              - CM039
      - number: '2.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 相互冲突的市场规模估计削弱 TAM 估值锚
            body: >
              Grand View Research 与 Mordor Intelligence 对 2024 年全球塑身衣市场基数的判断相差 14%（$370M），并给出相差 3.1 个百分点的 CAGR 结果，导致
              2030 年预测差距达到 $1.17 billion。任何把 SKIMS
              估值锚定在单一分析师估计上的投资者模型，都是建在有争议的基数上。更站得住脚的做法，是把塑身衣市场当作地板，用更宽的贴身服饰口径设边界，并用低、高 CAGR 两种情景对预测做压力测试。
            calloutType: risk
            claimRefs:
              - CM034
              - CM035
          - type: callout
            title: 包容尺码是结构性 TAM 扩展器
            body: >
              SKIMS 的 XS 到 5X 尺码架构捕捉到传统塑身衣既有玩家长期服务不足的买方池。通过在高端贴身服饰层级提供最宽的标准化尺码范围，SKIMS
              把人口结构约束转化为竞争护城河。传统品牌的供应链、试衣模型和批发货盘都围绕标准尺码搭建，无法一夜之间复制这一点。
            calloutType: strength
            claimRefs:
              - CM013
              - CM015
              - CM016
          - type: callout
            title: 从 DTC 转向实体，说明品牌进入成熟阶段
            body: >
              SKIMS 提出的「以实体为主」目标，表明品牌已经从 DTC 增长期榨取了能榨取的价值，现在开始为更大的批发加零售商业模式搭建分销基础设施。这一路径类似 Lululemon 和 Warby Parker
              的发展弧线。截至 2026 年初的 15 家门店基数，相比其目标仍未成规模；未来 12–18 个月新店表现数据，将是判断实体经济性是否匹配 DTC 模型的关键信号。
            calloutType: insight
            claimRefs:
              - CM019
              - CM020
              - CM021
          - type: callout
            title: 男装细分牵引基于定性媒体报道；没有 SKIMS 收入数据
            body: >
              多个行业来源（Forbes、VogueBusiness）把 SKIMS
              男装描述为获得快于预期的牵引，但没有定量收入或售出件数数据公开。本分析假设男装细分已经重要，但不把它视为已验证的主要收入驱动因素。任何把男装收入贡献作为核心增长假设的模型，都应标记为未经验证。
            calloutType: assumption
            claimRefs:
              - CM026
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >
              SKIMS 同时参与三个重叠战场：（1）塑身衣，Spanx 是稳固既有玩家，Layer Zero / Costco 自有品牌产品代表商品化威胁；（2）贴身服饰 / 内衣，Victoria's
              Secret（NYSE: VSXY）在门店数和品牌认知上占优，Savage X Fenty 和 Aerie 则以包容性和文化相关性挑战；（3）运动服，Lululemon（$10.6B 收入，2024
              财年）掌控高端地带，而 2025 年 9 月与 Nike 联合启动的 NikeSkims 现在把 SKIMS 放进了合法运动服竞争者的位置。


              既有玩家集群（Victoria's Secret、Spanx、Wacoal、Hanesbrands）控制大部分百货货架空间，并受益于几十年的批发关系。Victoria's Secret 在贴身服饰中的市场份额于
              2013 年达到美国市场约三分之一的峰值，此后因品牌争议、运动休闲转向和身体积极挑战者品牌崛起而明显下滑。Spanx 目前由 Blackstone 以 $1.2 billion 估值控股，仍是塑身衣领域最接近
              SKIMS 的品类可比对象，但缺少同等名人引力，尺码范围也更窄（XS–3X，对比 SKIMS 的 XS–5X）。


              DTC 挑战者（Savage X Fenty、ThirdLove、Aerie 的数字渠道）共享 SKIMS 的尺码包容定位，但品牌架构不同：Savage X Fenty 主要是内衣，更重度依赖 Rihanna
              的娱乐人格；ThirdLove 由合身技术驱动（半杯尺码、FitFinder 测验），业务规模小得多（累计融资约 $68M，没有报告过独角兽估值）；Aerie 是上市公司 American Eagle
              Outfitters（2023 财年收入 $5.26B）的子品牌，拥有 175+ 家独立门店和成熟零售资产。Lululemon 既是相邻竞争者，也是战略标杆——其社区驱动的高端品牌和 $10.6B
              收入基数，展示了赢下高端运动休闲后的长期上行空间。


              相邻替代品包括 Walmart、Target、Amazon 和现在 Costco 上的低价大众市场选项，以及通过 TikTok Shop 和快时尚零售商销售的无品牌「平替」。2026 年 2 月 Layer
              Zero（由 32 Degrees 创始人推出）以 Costco 定价销售类似 SKIMS 的塑身衣，是具体的商品化信号：核心塑身衣待完成任务可以用 SKIMS 价格的一小部分满足，而全品类包容性改善也削弱了
              SKIMS 单靠这一维度形成的差异化。
