              Savage X Fenty 于 2023 年 6 月更换创始人 CEO Rihanna，就 VIP 订阅计划相关的消费者保护诉讼支付 $1.2M 和解，并未执行外界广泛报道的 $3B
              IPO。这条轨迹——创始人退居二线、法律风险暴露、流动性延迟——代表名人创始人贴身服饰品牌在规模化前未能建立机构化管理深度时，可能走向的一条反向路径。SKIMS 的联合创始人结构（Kim
