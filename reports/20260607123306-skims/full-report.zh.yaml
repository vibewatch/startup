        title: 击穿逻辑的尽调要求与 IC 门槛
        blocks:
          - type: paragraph
            body: >-
              下一阶段尽调应明确以击穿投资逻辑为目标。第一项要求是 2024–2026
              年经审计财务，涵盖收入、毛利率、EBITDA、自由现金流、库存、退货和渠道经济性。第二项是股权结构经济性：清算优先权、参与型优先股条款、投资者附函、期权池、老股交易和预期 IPO
              稀释。第三项是媒体报道之外的客户证据：复购、队列留存、退货率、NPS、门店四墙经济性和批发售罄率。第四项是执行风险：2026
              年工资诉讼法律准备金、供应链合规、劳动实践、质量控制指标和国际零售资本开支。如果任何尽调线索显示增长放缓、毛利率压缩、复购疲弱，或治理条款把下行风险转给普通股东，建议应从继续研究转为回避。反过来，经审计证据若能证明公司有盈利性的
              $1 billion+ 规模、强队列和干净优先权，则可在纪律性入场价格下支持观察至买入。
