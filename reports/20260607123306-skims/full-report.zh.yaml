  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2025 年净销售额超过 $1B；2026 年继续保持高端增长；零售和 NikeSkims 有利润地规模化
        - 按高端 5x-7x 销售额口径，对应 $7B-$10B 区间
        - 执行必须跨过零售、劳动和客户服务问题
        - 需要经审计的增长和利润率证明
      - - 基准
        - 增长放缓，但品牌仍保持高端定位并盈利
        - 按 3.5x-4.5x 销售额口径，对应 $4B-$6B 区间
        - 上一轮估值留下的近期上行空间有限
        - 与当前公开证据最一致
      - - 悲观
        - 增长放缓，门店稀释利润率，投诉或工资诉讼恶化
        - 按 2x-3x 销售额口径，对应 $2B-$3.5B 区间
        - 降估值融资或 IPO 延迟风险
        - 由队列疲弱或毛利率压缩触发
      - - 上行期权
        - 美妆和运动服饰增加收入且不发生蚕食
        - 可能在服装倍数之外增加战略溢价
        - 经济性和合作伙伴分成尚未验证
        - 只有 NikeSkims 和美妆收入披露后才能确认
      - - 下行底部
        - 品牌仍有价值，但上市可比公司降估值
        - 战略收购方估值受服装同行倍数封顶
        - 私募优先权可能先保护后期投资人
        - 需要股权结构瀑布模型复核
    notes: 情景区间是估计的销售倍数框架，不是经审计的 DCF 输出。
