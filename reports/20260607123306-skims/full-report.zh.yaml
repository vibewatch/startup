              在对 SKIMS 做任何成长期投资前，尽调应确认：(1) 品牌授权 IP 结构和 Kardashian 合同义务；(2) 供应链原产国披露和 UFLPA 合规证明；(3) SB 657 供应链披露发布情况；(4)
              FTC 网红项目合规审查；(5) CFO 身份和 IPO 前审计流程；(6) NikeSkims 合同期限、最低承诺和续约条款；(7) 当前客流水平下自营门店的单位经济模型。
