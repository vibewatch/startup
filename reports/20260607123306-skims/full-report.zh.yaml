              Victoria's Secret 在贴身服饰中的市场份额于 2013 年达到美国市场约三分之一的峰值。它未能适应尺码包容和运动休闲转向，创造出空白地带，让 SKIMS 和 Aerie 都在 2010
              年代末快速增长。VS 收入仍在下滑（2025 财年降至 $2.27B，远低于 $7B+ 峰值），确认这场颠覆具有持续性，而不是正在反转。
