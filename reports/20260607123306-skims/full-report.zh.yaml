      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 集中的关键人风险：Kim Kardashian
            body: >-
              SKIMS 的品牌资产、获客经济性和文化相关性高度锚定在 Kim Kardashian 的个人平台上。Kardashian 拥有 354 million Instagram 粉丝和 72 million X
              粉丝，事实上承担主要营销渠道，相比传统服饰品牌显著降低付费获客成本。任何重大声誉事件、健康问题，或社交媒体互动下降，都可能结构性削弱品牌需求生成能力，并迫使公司投入昂贵的替代营销。SKIMS
              在全球开设实体门店后，这一风险会进一步加重，因为门店客流需要持续的品牌认知，而不能依赖单一代言人。
            calloutType: risk
            claimRefs:
              - CO036
              - CO052
          - type: callout
            title: $5 Billion 估值，六年跑出：执行速度
            body: >-
              从 DTC 塑身衣发布起算，六年后达到 $5 billion 私募市场估值，表现异常突出。SKIMS 从 2020 年约 $145 million 收入增长到 2025 年预计超过 $1 billion——五年约
              7x——同时 2023 年估计净利润达到 $190 million，仍保持盈利。品牌已从单一塑身衣 SKU 家族成功扩展为多品类服饰平台，获得 Goldman Sachs 及其他顶级机构投资者支持，并拿下与
              Nike 的联名合作。收入增长、盈利（公司声称）、品类扩张和蓝筹投资者信心叠加起来，构成一家六年历史私营品牌的强执行记录。
