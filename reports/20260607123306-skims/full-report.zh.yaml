      - number: '8.3'
        title: 当前估值背景与公开可比视角
        blocks:
          - type: paragraph
            body: >-
              $5 billion 融资把 SKIMS 定义为后期品牌服装资产，而不是 VC 软件公司。Sacra 称该估值约等于 2025 年预计销售额的 5x；Reuters/US News 报道 PitchBook
              评论认为，Goldman 领投融资强化了 IPO 叙事。公开可比公司给出的信号更冷。Nike 和 Lululemon 的市场数据页面显示，其市销率或估值比率远低于 SKIMS 隐含倍数；On 和
              Birkenstock 仍保有溢价估值，是因为投资者愿意为更快增长和更强品牌定价权买单。SEC 申报记录和公司投资者页面确认，这些同业都是有经审计披露的上市公司，因此其较低倍数比私募融资标题更有参考价值。合理的
              SKIMS 入场框架应三角校准三把尺：成熟服装按 2x 至 3x 销售额，高质量高端生活方式品牌按 3x 至 4x，只有经审计的 2025–2026 年增长、毛利率和零售坪效支撑品类定义型 IPO 故事时，才给
