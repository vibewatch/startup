chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              SKIMS（法律实体为 SKIMS BODY, INC.）是一家总部位于 Los Angeles 的私营服饰公司，由 Kim Kardashian 和 Jens Grede 于 2019 年创立。品牌最初以
              “Kimono Intimates” 名义发布，但在 2019 年中因文化挪用争议迅速改名为
              “SKIMS”。官方使命把它描述为一个「解决方案导向的品牌，创造下一代内衣、家居服和塑身衣」，并通过「为每一种身体提供解决方案」树立新标准。


              产品覆盖女装塑身衣、内衣、家居服、泳装、睡衣、男装（2023 年 8 月推出），以及通过 NikeSkims 合资项目切入的运动服和运动性能服饰。尺码从 XXS 到 5X；每个产品家族提供 10
              多种肤色系配色。定价处在可负担高端区间，多数单品为 $30–$100。


              商业模式是数字优先的 DTC，主要通过 skims.com 变现，同时在 Nordstrom、Selfridges、Harrods、Galeries Lafayette
              以及全球其他高端百货的批发业务增长。公司提出的战略转向是走向「以实体零售为主」，资金来自 2025 年 11 月 Series D。品牌在贴身衣物、塑身衣、家居服，并且越来越多地在运动服市场竞争，对手包括
              Spanx、Victoria's Secret、Savage X Fenty、Lululemon 和 Nike（同时也通过 NikeSkims 与 Nike 合作）。截至 2026
              年中，公司仍为私营公司，没有公开经审计财务报表。
