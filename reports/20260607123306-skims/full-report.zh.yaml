      - number: '1.3'
        title: 融资历史与投资者版图
        blocks:
          - type: paragraph
            body: >
              SKIMS 自创立以来已在多轮私募融资中累计筹集约 $956 million，每一轮融资都反映收入增长和战略野心扩大。公司在 2021 年底由 Wellington Management 领投融资后估值达到
              $3.2 billion。随后在 2023 年 1 月以 $4 billion 估值融资，并在 2023 年 7 月再次以同样的 $4 billion 估值完成约 $330 million 的 Series
              C；2023 年 7 月这一轮伴随向 SEC 提交的保密 IPO 注册文件，但上市最终没有推进。


              2025 年 11 月，SKIMS 完成 Series D：融资 $225 million，投后估值 $5 billion，由 Goldman Sachs Alternatives 领投，BDT & MSD
              Partners 关联基金参投。本轮融资于 2025 年 11 月 12 日通过 Goldman Sachs 发布的官方新闻稿宣布。Goldman Sachs Alternatives 全球混合资本负责人
              Beat Cabiallavetta，以及 BDT & MSD 总裁兼联席 CIO Greg Olafson 均公开表态支持这笔投资。


              估值 $5 billion 的 SKIMS 已超过 Victoria's Secret 与 Under Armour 的合计市值；这个品牌只有六年历史，对比很醒目。Series D 对应的远期收入倍数约为
              5x，基于预计超过 $1 billion 的 2025 年净销售额。早期投资者队列包括 Wellington Management、Greenoaks Capital、Lone Pine
              Capital（Stephen Mandel）、D1 Capital Partners（Daniel Sundheim）和 Thrive Capital（Josh Kushner）。SKIMS 的 CEO
              Jens Grede 曾表示公司「配得上」上市；市场普遍认为 Series D 会推迟潜在 IPO，因为它消除了近期进入公开资本市场的压力。
