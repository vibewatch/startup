            title: 投资逻辑击穿触发点——Kim Kardashian 与品牌脱钩
            body: >-
              SKIMS 最严重的单一情景，是 Kim Kardashian 与品牌出现实质且持续的脱钩——无论原因是个人丑闻、健康事件、合同终止，还是竞争品牌发布。SKIMS 尚未建立足以在 Kardashian
              不积极参与时仍守住高端定位的独立品牌身份。投资者在按完整 $5 billion 估值投资前，应要求披露品牌授权 IP 结构、Kardashian 持股、合同锁定条款，以及任何品牌独立路线图。
