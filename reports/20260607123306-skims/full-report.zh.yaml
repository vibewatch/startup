      - number: '4.3'
        title: 资本充足性、融资历程与零售资本开支管线
        blocks:
          - type: paragraph
            body: >-
              SKIMS 于 2025 年 11 月完成 $225 million Series D 股权融资，由 Goldman Sachs Alternatives 领投，BDT & MSD Partners
              关联基金参投，公司估值达到 $5 billion。此前公司在 2023 年 7 月完成 $270 million Series C，由 Wellington Management 领投，估值 $4
              billion。所有轮次累计融资现在约 $956 million，投资人阵容包括 Goldman Sachs Alternatives、BDT & MSD Partners、Wellington
              Management、Greenoaks Capital、Lone Pine Capital、D1 Capital Partners 和 Thrive Capital 等一线机构。 Goldman Sachs
              新闻稿明确把 Series D 资金用途指向实体零售扩张、国际增长和产品品类创新——这意味着短期内资金更多投向资本开支， 而不是补强资产负债表。

              实体零售转向是最重要的前瞻资本承诺。截至 2025 年 11 月，SKIMS 运营 18 家美国自营门店和 2 家墨西哥加盟门店； 首家美国永久门店已于 2024 年在 Washington D.C.
              开业。London Regent Street 旗舰店位于原 Ted Baker 单元，面积 12,000 sq ft，签有 10 年 Crown Estate 租约，计划 2026 年夏季开业，装修成本会很高。
              Dubai Mall of the Emirates 门店已于 2025 年 12 月开业，香港和 Seoul 门店也已宣布。根据 UK Companies House，SKIMS UK
              INTERNATIONAL LTD 于 2024 年 11 月专门为支持 EMEA 扩张而设立。公司还聘任了专职 EMEA President（Robin Gendron），并在建立首个 EMEA
              区域仓库；这些投入进一步抬高了近期成本基数。

              尽管融资记录强劲，SKIMS 没有公开披露合并现金余额、月度烧钱速度、现金跑道、循环信贷额度或营运资本状况。盈利说法如果属实—— 即 2023 年 $190M 净利润准确——说明 SKIMS
              可能具备内部造血能力，但快速开店节奏也意味着新增资本需求仍然偏高。 旗舰位置的实体零售装修通常为每平方英尺 $300–$800；仅 12,000 sq ft 的 Regent Street 门店，
              在铺货前就可能需要 $3.6M–$9.6M 装修资本。没有经审计财务报表时，资本充足性只能从融资时间和投资人质量推断， 不能从已披露流动性判断。
