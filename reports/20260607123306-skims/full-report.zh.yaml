      - number: '7.5'
        title: 财务、估值与宏观风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 仍是私人公司，未披露经审计财务。2025 年 11 月融资由 Goldman Sachs Alternatives 领投，BDT & MSD Partners 参与，融资 $225
              million，对应估值 $5 billion。公司预计 2025 财年净销售额超过 $1 billion。以约 $1 billion 收入支撑 $5 billion 估值，SKIMS 定价约为 ~5×
              EV/Revenue——不便宜；但只要 SKIMS 守住高端品牌定位，Nike
              合作又能带来可观运动品类收入，这个倍数仍可辩护。问题是，市场已要求公司持续以足以支撑公开市场预期的速度增长。一旦收入不及预期、品牌热度降温，或非必需消费股风险资产重新定价，SKIMS 可能被迫下调估值，IPO
              定价也可能低于当前私募估值。

              宏观逆风是结构性风险。塑身衣和高端贴身衣物都是可选消费，消费者支出下行时会被挤压。U.S. Census Bureau 的 Monthly Retail Trade
              数据显示，服装和配饰零售销售属于周期性最强的品类。关税不确定性——包括美国可能对从越南、中国或其他亚洲制造中心进口的服装加征关税——如果 SKIMS 无法吸收或转嫁成本上涨，就会压缩毛利率。品牌的高端定价（每件
              $20–$100+）能为适度关税转嫁留出缓冲；但大幅加税要么牺牲利润率，要么明显提价，并在大众高端细分市场的高价位段触发需求弹性风险。

              SKIMS 未公开披露治理架构、审计委员会构成、Kardashian 与 SKIMS 之间的关联方安排或债务工具。这是高增长私人公司的常态，但也意味着投资者无法在 IPO
              前独立核验财务状况、高管薪酬安排或资本结构。IPO 前若出现降价融资、重大财务重述，或披露此前未公开的关联方交易，投资者信心可能大幅受损。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
