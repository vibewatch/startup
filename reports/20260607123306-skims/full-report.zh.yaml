      - number: '7.6'
        title: 客户服务、退货与运营风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 对美国境内退货收取 $6 退货运费；只有客户下载 SKIMS 应用并加入 SKIMS Rewards 计划，退货才免费。30
              天退货窗口和收费结构已在评论论坛中引发消费者摩擦。SmartCustomer 显示，SKIMS 在 42 条评论中平均仅 1.4
              星，最常见投诉是客服响应慢和退货费带来的意外。评论者提到面料廉价、版型差、支持渠道无效以及重新上架费。虽然经验证评论的绝对数量不大，但负面情绪集中在退货和服务体验上，高端定位品牌尤其不能忽视。服装获客成本高；糟糕的购后体验会推高流失，并侵蚀高端品牌依赖的口碑推荐优势。

              SKIMS 的实体零售扩张——从 2024 年开出的首家永久 D.C. 门店，到 2025 年 11 月融资公告时的 18 家美国自营门店和 2 家
              墨西哥加盟店——带来运营复杂度：租约义务、库存规划、员工招聘和店内体验标准。品牌过去主要在线上运营，并用受控的限量上新节奏；实体零售增加固定成本承诺，也削弱运营弹性。通过 Lane Crawford
              和本地伙伴进入香港与首尔（据 WWD），又叠加了外国司法辖区的劳动法、海关和配送复杂度。SKIMS Privacy Policy
              在加州和国际数据隐私框架下收集大量个人数据（购买历史、浏览行为、设备标识符、营销同意）；数据泄露或 CCPA 执法都可能带来监管罚款和消费者信任受损。
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
