  - id: TI005
    title: 公开财务缺口：缺失指标、影响与尽调路径
    columns:
      - 缺失指标
      - 对承销的影响
      - 尽调路径
    rows:
      - - 经审计 P&L（收入、COGS、毛利率、运营费用、净利润）
        - 无法验证毛利率、盈利能力或成本结构说法
        - 要求提供 FY2023 和 FY2024 经审计或审阅财务报表。
      - - 渠道级收入拆分（DTC / 批发 / 实体零售）
        - 无法评估利润率组合、资本配置效率或渠道风险集中度
        - 要求提供分部收入 P&L，并按渠道列出贡献利润率。
      - - 在手现金和烧钱速度
        - 无法评估资本充足性，或零售扩张资本开支的现金跑道
        - 要求提供季度现金流量表和交割日资金余额。
      - - NikeSkims JV 经济性（收入分成、利润率分成、库存所有权）
        - 无法估值 JV 贡献，或估计 Nike 侧经济性流失
        - 要求提供 JV 协议、收入确认政策和分配给 SKIMS 的收入。
      - - SKKN by Kim 收购条款
        - 无法评估进入美妆品类的成本或利润影响
        - 要求提供交易价值、承接负债和美妆分部备考 P&L。
      - - 退货率和扣除退货后的净收入
        - 消费者围绕退货有投诉，真实净收入或利润率就无法判断
        - 要求提供从总收入到净收入的桥接，并按品类和渠道列出退货率。
      - - 分渠道营销支出
        - 无法计算混合 CAC、回本周期或营销效率
        - 要求提供年度分渠道营销费用和归因收入。
      - - 按队列的获客成本和 LTV
        - 无法评估 LTV/CAC 比，或识别自然触达成熟后的恶化
        - 要求提供 2019 年至今按获客队列划分的 CAC 和 12/24 个月 LTV。
      - - 自有零售店级 P&L
        - 无法评估实体零售扩张的四墙盈利能力
        - 要求提供 3+ 家成熟门店的店级收入、租金占用、人工和 EBITDA。
    notes: >-
      本表所有项目均为截至 2026-06-07 公开来源缺失的信息。SKIMS Body, Inc. 是美国私营公司，不受 SEC
      披露要求约束。这类披露缺失对该阶段私营服装公司属常态，但除了已确认的收入轨迹和融资历史外，它会实质性限制所有财务维度的承销置信度。
