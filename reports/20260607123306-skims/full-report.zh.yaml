      - number: '1.4'
        title: 规模指标、零售版图与分销
        blocks:
          - type: paragraph
            body: >
              SKIMS 不公布经审计财务报表。下述收入和盈利数字来自第三方分析师估计及公司发布的表述，应视为未经验证。Sacra 估计 2023 年收入为 $750 million（较 2022 年 $500
              million、2020 年 $145 million，约同比增长 50%）。CEO Jens Grede 公开宣布 2023 年净利润估计为 $190 million。公司预计 2025 年净销售额超过 $1
              billion，这一数字见于官方 Series D 新闻稿。以 $5 billion 的 Series D 估值计，隐含远期收入倍数约为 5x。员工数和毛利率未公开披露。


              截至 2025 年 11 月 Series D 公告，SKIMS 运营 18 家美国自营零售门店，并在 Mexico 有 2 家加盟店。美国门店包括 New York、Los
              Angeles、Georgetown、Aventura、Austin、Houston、Atlanta、Boca Raton、Paramus、Las Vegas、Bloomington、Palo
              Alto、Tysons 等。测试快闪店后，首家永久门店于 2024 年在 Washington, D.C. 开业。Chicago Gold Coast 旗舰店（6,500 sq ft，两层，位于 Rush
              Street）于 2026 年 2 月开业。首家 Middle East 门店于 2025 年 12 月通过加盟伙伴 Al Tayer Insignia 在 Dubai 的 Mall of the
              Emirates 开业。London Regent Street 旗舰店面积 12,000 sq ft（在 245–247 Regent Street 与 Crown Estate 签 10 年租约），计划于
              2026 年夏季开业。


              线上方面，Sacra 估计 skims.com 在 2024 年产生约 $527 million 的商品交易总额，40% 的网站流量来自美国以外。超过 11 million 名消费者已注册 SKIMS
              产品补货提醒。零售合作伙伴包括 Nordstrom（带品牌快闪店）、英国的 Selfridges 和 Harrods、Paris 的 Galeries Lafayette，以及覆盖
              Finland、Estonia、Latvia 的 Stockmann。Trustpilot 的客户满意度数据显示，SKIMS 评分为
              3.5/5，等级为「一般」；围绕客服、退款延迟，以及在可负担价位下的质量不一致，投诉反复出现。
