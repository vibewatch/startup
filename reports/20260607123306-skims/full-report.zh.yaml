      - number: '1.5'
        title: 里程碑、合作伙伴与反向事件
        blocks:
          - type: paragraph
            body: >
              SKIMS 从 2019 年发布到六年内成为 $5 billion 品牌，背后是一条密集的事件时间线。关键节点包括 2019 年从 Kimono Intimates 被迫更名（反向事件）、2021 年和 2023
              年连续融资、2023 年 7 月保密 IPO 申报（后来放弃），以及 2025 年 11 月 Series D。


              战略合作一直是增长加速的核心。2023 年 7 月与 NBA、WNBA 和 USA Basketball 达成多年协议，成为官方内衣合作伙伴，为品牌带来大众体育曝光。影响范围更大的，是 2025 年 2 月宣布
              NikeSkims——被描述为 Nike 第一次与外部伙伴共同创造一个全新品牌——以及 2025 年 9 月发布（首个系列数小时内售罄），这代表 SKIMS 结构性扩张到 $450+ billion
              的全球运动服市场。2026 年春季 NikeSkims 系列通过 Nike 在 Europe、Middle East、Australia 和 Korea 的分销网络进行全球扩展。2025 年 3 月收购 SKKN
              by Kim（来自 Kardashian 以及 Coty 的 20% 持股），让 SKIMS 得以在 2026 年扩展到美妆、护肤和香氛。


              反向事件和风险信号包括：（1）2019 年 Kimono 品牌争议，需要立即改名；（2）NikeSkims 美国发布因产品准备度问题从 2025 年春季推迟到 2025 年 9
              月，说明快速品类扩张中的执行风险；（3）Trustpilot 上持续的客服投诉（3.5/5）；（4）没有公开财务披露，造成治理不透明；（5）品牌深度依赖 Kim Kardashian
              的个人触达——任何影响她的重大声誉事件，都可能显著损害 SKIMS 的获客经济性和品牌定位。
