  - id: TV005
    title: 投资逻辑破裂与红线触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入不及预期
        - 2025 年净销售额显著低于 $1B，或 2026 年增速低于高端同行
        - 削弱 5x 销售额估值
        - 除非入场价格重置，否则转为回避
      - - 利润率压缩
        - 毛利率或 EBITDA 利润率低于高端 DTC 预期
        - 零售和库存成本吃掉品牌溢价
        - 要求更低倍数和恢复计划
      - - 队列疲弱
        - 复购、退货率或 NPS 恶化
        - 名人需求可能不持久
        - 暂停，直到客户数据干净
      - - 法律升级
        - 2026 年工资诉讼获准集体诉讼，或暴露系统性劳动问题
        - 增加成本、管理分心和 IPO 风险
        - 要求法律准备金和整改证明
      - - 合作伙伴不及预期
        - NikeSkims 表现不佳，或经济性稀释利润率
        - 关键增长邻近品类走弱
        - 从估值中剔除上行期权
      - - 股权结构负担
        - 优先权或老股交易将下行风险集中到新投资人之外
        - 回报不对称性恶化
        - 除非条款重置，否则拒绝
    notes: 触发项设计为价格敏感型投资决策前的尽调闸门。
