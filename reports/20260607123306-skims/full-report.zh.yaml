  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线架构
        blocks:
          - type: paragraph
            body: >
              SKIMS 横跨六个商业产品品类，每个品类瞄准不同穿搭场景。起家品类是塑身衣，覆盖塑形连体衣、短裤、三角裤、 高腰打底裤和收腰款。内衣与胸罩把可触达市场扩展到日常贴身衣物，推出无钢圈
              bralette、按下围和罩杯划分的有钢圈款（30A–46H）， 以及棉质罗纹基础款。居家服包括柔软连衣裙、连帽衫、运动裤、上衣和最畅销的 Soft Lounge 系列。男装于 2022 年推出，覆盖男士内裤、T
              恤和居家基础款。泳装在 2021 年进入，包含连体和分体款、罩衫和比基尼套装。

              第六个、也是战略上最重要的品类是 NikeSKIMS，这是 SKIMS 与 Nike 的合资项目，2024 年 3 月宣布、2025 年 9 月上市。首批产品横跨 7 个系列、58 个款型，使用 Nike
              Dri-FIT 和自有面料技术；2026 年春季发售增加 65+ 个款型、配饰和两款鞋类 SKU（NikeSKIMS Rift Satin 与 Rift Mesh），首次把 SKIMS 延伸到功能性运动服和鞋履。
              截至 2025 年 11 月，SKIMS 还运营 18 家美国自营零售门店，并在扩张国际足迹，包括首个中东门店（Dubai， 2025 年 12 月）和计划于 2026 年夏季开业、面积 12,000 sq.
              ft. 的 London 旗舰店。

              每个品类成熟度不同：塑身衣和居家服最成熟，SKU 深度更足；泳装、男装和 NikeSKIMS 联名线更年轻，款式更窄， 可见的售罄数据也更少。
