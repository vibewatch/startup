  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 关键人物与治理风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 由 Kim Kardashian 共同创立，且公开身份是 Chief Creative Officer。品牌的 Instagram 粉丝量、
              赢得媒体覆盖和消费者向往价值，都离不开她的个人名人效应。Wikipedia 记录她是全球粉丝最多的个人之一，也是 Kardashian-Jenner 商业帝国的核心驱动力。Sacra 估计，Kardashian
              每个季度都通过社交媒体帖子、电视露面和编辑报道，为 SKIMS 贡献了相当大比例的赢得媒体价值；这种集中度很难用同等成本的付费营销复制。Kardashian 的任何声誉损害，几乎都会立刻转化为 SKIMS
              的品牌敞口。

              SEC 于 2022 年 10 月对 Kardashian 采取执法行动——她在 Instagram 推广 EthereumMax 加密代币时未披露 $250,000 推广费，最终以 $1.26 million
              和解——证明她的公开行为会制造监管责任和头条风险。SEC 命令要求她配合一项持续调查， 并禁止她在三年内推广加密资产证券；该限制已于 2025 年 10 月到期，但为 FTC 和 SEC
              更广泛审查网红披露树立了先例。FTC 2023 年修订的 Endorsement Guides 明确要求，名人背书产品推广必须披露重大关联关系， 这为 SKIMS 自身营销设置了持续合规义务。

              治理不透明进一步放大关键人物风险。SKIMS 没有公布经审计财务报表、董事会构成或继任计划。UK Companies House 文件确认了 SKIMS UK International
              的子公司结构，但母公司的所有权、治理安排和关联方交易仍未披露。公司没有公开独立董事会、 没有披露 COO 继任路径，也没有宣布领导梯队来降低创始人依赖。CEO Jens Grede 的运营层面公众可见度低于
              Kardashian 的公众存在感，这意味着一旦 Kardashian 后退，品牌可信度会面临实质风险。
            claimRefs:
