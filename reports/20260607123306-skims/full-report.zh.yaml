      - number: '7.2'
        title: 品牌、声誉与监管风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 经历过多次声誉争议仍存活下来，但每一次都暴露了品牌资产与制度化防御之间的落差。2019 年品牌最初命名为
              “Kimono”——这个名称立刻引发日本媒体、政府官员和消费者倡导者关于文化挪用的反弹，迫使产品发货前改名为 SKIMS。
              该事件说明，品牌身份部分建立在缺少充分防护的文化借用上，命名和创意决策由创始人直觉主导，而不是制度化审查。

              2024 年英国事件中，一辆运载 SKIMS 货物的卡车被发现夹带一批可卡因，引发英国小报和地方新闻报道， 抬高了供应链完整性担忧。尽管 SKIMS
              被认定为货主而非走私行动参与者，该事件仍说明，品牌会暴露于第三方物流不当行为， 且即便没有责任也可能产生负面报道。

              FTC 的 Endorsement Guides 要求所有赞助社交内容清晰、显著披露重大关联。SKIMS 高度依赖网红营销和名人种草； 鉴于创始人本人已经因未披露付费推广被 SEC 指控，品牌执法风险不低。未来若
              FTC 调查未披露的 SKIMS 网红付款， 可能带来民事罚金和声誉损害。消费者评论聚合器（SmartCustomer、Sitejabber）显示 SKIMS 面向客户的评分明显低于品类平均，
              部分原因是退货费用和质量投诉；这些问题会形成负面社交媒体反馈循环，削弱品牌向往感。
            claimRefs:
