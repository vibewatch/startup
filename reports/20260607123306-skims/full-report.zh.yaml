      - number: '4.2'
        title: 单位经济、利润率结构与营销效率
        blocks:
          - type: paragraph
            body: >-
              分析师估计 SKIMS 毛利率为 50–62%，这符合高端 DTC 服装的经济模型：公司直接掌握电商渠道， 生产相对轻资产，定价高于大众塑身衣但还没到奢侈品层级。Sacra 的研究记录了 CEO Jens
              Grede 公开声称 2023 年净利润约 $190 million；若以 $750 million 收入计算，净利率约 25%——如果得到核实，成长阶段服装品牌能达到这个水平非常罕见。FashionBI
              还引用经行业专家审阅的内部预测： 2023 年调整后 EBITDA 率高于 23%，同期收入增长 58%，当年 Q1 收入同比跳升 76%。

              Kim Kardashian 的 360 million+ Instagram 粉丝，以及稀缺发售带来的赢得媒体曝光，把获客成本压得低于传统服装巨头。 Latterly 的行业估计显示，2025 年 SKIMS
              在偏重功能性的客户中复购率约 38%；Burda Luxury 则称首购后 15 个月内整体客户留存率为 14%。只要定价守得住，这些数字支持较耐久的客户终身价值。不过也有几项警示： 客户评论记录的 $15
              退货补货费，说明公司在用降低摩擦以外的方式管理退货，可能压低新客首购转化。SmartCustomer 数据显示，截至 2026 年中，42 条评论的平均评分只有 1.4 星，反复抱怨尺码不准、材料质量配不上价格、
              客服响应慢；如果感知中的高端定价与实际体验之间的质量缺口扩大，全价售罄会遇到阻力。

              NikeSkims 合作带来一个尚未公开量化的新毛利变量。SKIMS 与 Nike 之间的合资结构、版税经济性和利润分成均未披露。 SKIMS 转向实体零售后，租金、人工和库存管理成本都会高于 DTC
              电商；除非零售渠道达到与线上业务相当的售罄率， 毛利率可能被压缩。
