              没有直接塑身衣竞争者能同时拥有 Kim Kardashian 的 272M+ Instagram 粉丝、多年 NBA / Olympics 合作组合，以及奢侈品牌联名历史（Fendi、D&G、The North
              Face）。NikeSkims 于 2025 年 9 月发布，又加入 Nike 的全球运动可信度，形成复合护城河；既有玩家要复制，可能需要多年时间和数亿美元合作支出。
