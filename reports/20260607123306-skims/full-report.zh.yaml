      - number: '2.3'
        title: 买方细分与包容尺码需求
        blocks:
          - type: paragraph
            body: >
              SKIMS 的主要买方是约 18–45 岁女性，购买修饰身形或日常基础贴身衣物，愿意接受中高端价格点（每件 $30–$100）。品牌的 XS 到 5X
              尺码架构，显示其有意捕捉历史上服务不足的大码和曲线身材消费者；这类消费者占美国女性的重要比例，却长期未被传统塑身衣玩家充分服务。Grand View Research 指出，女性细分贡献 93.8%
              的塑身衣收入，而男性细分是增长最快的子品类——SKIMS 正通过男装系列切入这一开口。


              男性买方是正在成形的次级细分。SKIMS 于 2023 年推出男装，并报告该品类牵引快于预期。Forbes 关于 2026 年 Chicago 旗舰店的报道指出，SKIMS
              现在覆盖「女性和男性」客户细分，男装获得的牵引「快于部分分析师预期」。这一细分位于男性基础款和压缩服饰地带，过去由 Fruit of the Loom、Jockey、Calvin Klein 等品牌占据。


              预算归属和付款画像：女性购买中，SKIMS
              面向既是买方也是付款方的直接消费者，转化漏斗较短，但需要建立对尺码和合身度的信任。贴身服饰的线上退货率较高（由于合身不确定性，相比硬商品结构性更高），因此复购经济性关键取决于首单合身满意度。SKIMS
              官网直接提供尺码指南，这是降低合身焦虑的功能工具；Rewards 计划的免费退货权益则是留存机制。


              国际上，SKIMS 的买方画像正在延伸到 Europe 和 Middle East。Forbes 报道了 2025 年面向欧洲的领导层招聘；Chicago 旗舰店则是一个测试案例，用来观察 SKIMS
              的实体零售能否在人口结构密度高的市场匹配其数字渠道转化效率。包容尺码价值主张似乎在全球都有共鸣，因为 Asia Pacific 地区预计到 2030 年在塑身衣和贴身服饰两个品类中都将实现最快 CAGR。
