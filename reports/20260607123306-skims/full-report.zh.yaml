      - number: '2.4'
        title: DTC 主导与批发扩张
        blocks:
          - type: paragraph
            body: >
              SKIMS 于 2019 年以 DTC 电商业务起步，主要收入渠道仍是自有网站 skims.com。DTC 模式带来完整定价控制、客户数据所有权和快速库存迭代——在测试男装或限量 drop
              等新品类时，这些都是关键优势。US Census 数据显示，非门店零售（主要是电商）在服装和配饰中已获得大量份额，至少到 2020 年代中期都为 DTC 权重较高的服饰品牌提供结构性顺风。


              规模扩大后，SKIMS 选择性进入批发。主要批发合作伙伴包括 Nordstrom 和 Saks Fifth Avenue。Forbes 对 Chicago 旗舰店的报道把 SKIMS
              的分销方法描述为「克制」——选择性合作，同时严控定价和陈列。这不同于那些过早过度铺开批发、最终丢掉价格完整性的品牌；2010 年代许多名人时尚品牌都走过这条警示路径。


              公司的实体零售策略增加了第三个渠道。截至 2026 年初，SKIMS 运营 15 家门店，旗舰店位于 Los Angeles、New York 和 Chicago，并计划在 Mexico 和 Dubai
              增开门店。CEO 曾表示，公司长期目标是变得「以实体为主」——一个 DTC 出生的品牌做出这种再定位，很大胆。实体零售提供合身咨询能力、品牌剧场，以及一类线上渠道只能部分捕捉的消费者行为数据。


              渠道组合之所以影响市场分析，是因为每个渠道都有不同的获客成本（CAC）、退货率和毛利率画像。批发通常毛利率较低（品牌通常以 MSRP 的 50% 或更低卖给渠道），但 CAC
              也较低。实体零售固定成本高，但转化和客单价更强。DTC 电商渠道利润率最好，却暴露于退货成本和越来越昂贵的数字营销之下。SKIMS 分散渠道组合后，混合经济性会变化，利润率可能被压缩，但整体规模和品牌认知会改善。
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM028
      - number: '2.5'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              塑身衣和贴身服饰市场的增长驱动因素已经有充分记录。社交媒体和名人背书是最重要的需求催化剂——SKIMS 起源于 Kim Kardashian 的品牌，因此天然能变现这一动态。Grand View Research
              明确把社交媒体影响列为塑身衣行业关键增长驱动因素。面料技术（吸湿排汗、压缩面料、智能纺织品）把塑身衣从特定场合的基础内衣扩展到日常贴身服饰，拓宽购买场景和频次。身体积极运动去除了大码和塑身衣使用的污名，扩大了买方池。


              运动休闲常态化——在非运动场景穿着运动或修饰身形服装的文化转变——是宏观顺风。运动休闲市场预计到 2032–33 年以 9.9% CAGR（GVR）或 7.8% CAGR（VMR）增长。NikeSKIMS
              这样的高曝光合作，把 SKIMS 的触达延伸到运动性能消费者；如果只靠塑身衣品牌身份，这部分消费者本来无法覆盖。


              采用约束也真实存在。贴身服饰较高的线上退货率，给任何 DTC 品牌都带来结构性成本逆风。SKIMS 用 $6 退货费（针对非 Rewards 会员）、Final Sale 标记和 Rewards
              计划激励，把退货用户引向店铺积分而非退款。棉花和合成纤维投入成本在 2022–2024 年波动较大（COVID 后供应链和大宗商品价格冲击）；2025–2026
              年部分正常化带来一些缓解，但原材料定价的残余不确定性仍继续压迫所有贴身服饰生产商的毛利率。


              贴身服饰的切换成本很低：消费者不像 SaaS 客户那样被锁进某个品牌。SKIMS 的主要留存机制是审美身份、尺码范围领先、名人关联和 Rewards 计划。名人依赖本身也是采用约束：品牌资产部分取决于 Kim
              Kardashian 持续的公众地位，形成外部且难以对冲的关键人风险。
