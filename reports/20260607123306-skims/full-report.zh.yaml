      - number: '7.4'
        title: 合作伙伴与交易对手依赖风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 最可见的合作是 NikeSkims，这是一项由 Nike, Inc. 与 SKIMS 在 2024 年 7 月宣布的运动服饰合作。 Nike.com/NikeSKIMS 和 About Nike
              新闻室确认了该合作。WWD 标签报道记录了 2025 年末和 2026 年初连续的 NikeSkims 发售，包括首款运动鞋（Air Rift Mesh）和 2026 年 2 月 Paris
              快闪店。该合作在结构上重要， 因为它把 SKIMS 延伸到公司自身很难可信切入的运动和鞋履品类。不过，这也制造了实质交易对手依赖：Nike 的战略优先级、
              品牌姿态或财务状况，都可能改变合作范围、持续时间或营销投入。Nike 在 2024–2025 年自身收入下滑和品牌热度挑战， 增加了这一依赖的风险。

              SKIMS 也是 NBA、WNBA、Team USA 和 U.S. Paralympic Team 的官方内衣合作伙伴。这些合作提供文化合法性和进入体育受众的通道，
              但它们都是需要续约、重新谈判或可能被取消的合同安排。一场牵连 SKIMS 品牌关联的高调 NBA 或 WNBA 行为争议， 可能带来不想要的品牌邻近风险。

              通过 Nordstrom 做批发分销提供规模和触达，但也把销售风险集中到一个 SKIMS 无法完全控制的渠道。Nordstrom
              自身战略决策（私募股权收购、门店精简）以及任何批发协议条款，会决定货架空间分配。Goldman Sachs Alternatives 领投 2025 年 11 月 Series D，在未来 IPO
              进程前对公司治理形成机构投资人影响力；如果机构投资人对消费品牌 IPO 的兴趣降温，可能把 SKIMS 推向不利的上市窗口。
