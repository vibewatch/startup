  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类架构
        blocks:
          - type: paragraph
            body: >
              SKIMS 同时竞争四个相互重叠的服饰细分市场：塑身衣、贴身服饰（内裤、文胸、家居服）、运动休闲服，以及通过 2024 年 NikeSKIMS
              合作切入的运动性能服饰。最窄口径是纯塑身衣市场，聚焦用来压缩、塑形或平滑身形轮廓的贴身内衣子品类。更宽的口径包括全部贴身服饰（文胸、内裤、塑身衣、睡衣）和运动休闲，后者把运动功能和休闲时尚混在一起。


              SKIMS 的现状替代品包括传统百货品牌（Spanx、Wacoal、Hanesbrands、Jockey）和快时尚贴身衣物品牌（Victoria's Secret、Aerie）。在家居服和基础款层级，主要替代品是
              Walmart 或 Target 的通用标签内衣，以及 American Eagle/Aerie、Calvin Klein 的中端产品。运动服领域的既有玩家是 Lululemon、Nike 和
              Adidas。SKIMS 高于大众市场、低于超奢区间，占据可负担高端层级。


              扩大 SKIMS SAM 的相邻品类包括大码和扩展尺码服饰（历史上服务不足）、男性基础款和男士塑身衣（快速增长的子细分），以及运动性能贴身服饰（NikeSKIMS
              向量）。每个相邻品类都有不同买方画像、分销规范和利润率结构。市场边界对估值很重要，因为把 SKIMS 定义为「塑身衣」意味着 $2–3B TAM，而定义为「贴身服饰 + 运动休闲」则意味着大一个数量级的 TAM。
