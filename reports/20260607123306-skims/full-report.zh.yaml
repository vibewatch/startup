  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与渠道组合
        blocks:
          - type: paragraph
            body: >-
              SKIMS 通过三个主要渠道产生收入：经由 skims.com 的直接面向消费者电商、在高端零售合作伙伴处的批发铺货（Nordstrom、Saks Fifth
              Avenue、Net-a-Porter、Selfridges 和 Stockmann），以及不断增长的实体零售网络，其首家永久门店于 2024 年开业。DTC 渠道历史上一直是收入引擎——公司运行 drop
              驱动的稀缺模式，制造售罄和补货等待名单；截至 2025 年 11 月融资公告，已有超过 11 million 名客户注册补货提醒。Sacra 估计，单是 skims.com 平台就在 2024 年产生约 $527
              million 商品交易总额。公司 2023 年全年净收入 $750 million（较 2022 年 $500 million 同比增长 50%）以及 2025 年净销售额迈向超过 $1 billion
              的轨迹，支撑了投资者对当前估值的信心。

              产品线多元化显著扩大了收入表面。核心塑身衣和内衣货盘（主要定价每件 $30–$100，部分高端单品最高 $180）仍是主要需求驱动因素，现在又叠加家居服、泳装，以及 2023
              年底推出的男装品类。NikeSkims 运动服合资项目——2025 年 9 月以 58+ 个廓形亮相，现在已延伸到鞋履——通过 Nike.com 和 Nike 零售门店增加了额外渠道，实质上在不要求 SKIMS
              自有资本开支的情况下扩大分销。即将推出的美妆和香氛线（通过从 Coty 收购 SKKN by Kim，以及任命新的美妆与香氛执行副总裁）将从 2026 年开始增加另一条收入流，尽管 Coty
              股权收购的财务条款未公开披露。批发和实体零售渠道提供品牌可信度和新客获取，但渠道层级的收入拆分、抽成率和各收入流毛利率均未公开披露，精确收入组合仍是开放的尽调变量。
