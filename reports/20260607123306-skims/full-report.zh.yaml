      - number: '5.2'
        title: 面料、材料与尺码体系
        blocks:
          - type: paragraph
            body: >
              SKIMS 把核心技术描述为“以解决方案为导向”的面料工程——内裤可拉伸到两倍尺寸，塑身衣能压缩并抚平线条但不勒肉， 胸罩则围绕特定廓形效果设计（缩胸、聚拢、深
              V、无肩带）。公司的关键品牌主张是“第二层皮肤”拉伸技术，设计目标是贴合身体轮廓。 skims.com 未公开披露独立认证（OEKO-TEX Standard 100 或同等认证），每个 SKU
              的面料成分也没有突出展示； 关注可持续采购和产品宣称的投资人，会把它视为材料尽调缺口。

              尺码体系是竞争差异点。塑身衣和内衣覆盖 XXS 到 4X（腰围 00–28，并覆盖臀围尺码），部分品类提供 5X。 胸罩覆盖 30–46 下围和 A–H 罩杯，并提供 UK/AUS、EU、IT、FR、JP
              的国际换算。SKIMS 在官网提供自有 Bra Calculator，并为每类产品配备独立试穿指南。指南里的测量指令很细：下胸围与上胸围测量、罩杯溢出检查、肩带勒痕判断——
              说明公司有意降低因尺码选择不当导致的退货。即便如此，Trustpilot 评论和客户反馈仍频繁提到不同产品线之间尺码不一致， 说明制造执行并不总是匹配尺码规格。

              色号多样性——每件商品 9+ 个肤色色号——是 SKIMS 的基础品牌差异点，使其占据了 Spanx 和 Victoria's Secret 未覆盖的需求。不过，跨生产批次保持颜色一致，是公司面临的标准运营挑战。
