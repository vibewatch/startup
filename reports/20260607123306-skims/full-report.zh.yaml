      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              SKIMS 有两位联合创始人仍在一线领导。Kim Kardashian 担任联合创始人兼首席创意官（CCO），负责产品开发和品牌创意策略。据报道，她拥有 354 million Instagram 粉丝和 72
              million X 粉丝，社交媒体触达因此成为核心获客渠道。她的联合创始人 Jens Grede 担任首席执行官（CEO）。Grede 曾共同创办创意机构 Bureau Betak 和牛仔品牌
              Frame，既有相关时尚行业经验，也承担运营和投资者关系职责。


              在创始双人组之外，SKIMS 正在补齐高管团队，以支撑快速国际扩张。2025 年 8 月，公司任命 Robin Gendron 为首任 EMEA 总裁，这是一个新设职位。Gendron 带来在 Michael
              Kors 的 11 年经验（最近任 EMEA 总裁），职责覆盖 London 和 Dubai 的独立门店、首个 EMEA 区域仓，以及 skims.com 在欧洲市场的本地化。另一路线上，包容性美妆品牌 Ami
              Colé 创始人 Diarrha N'Diaye-Mbaye 被任命为美妆与香氛执行副总裁，负责搭建 SKIMS 美妆与香氛垂类；该垂类预计在收购 Skkn by Kim 后于 2026 年推出。


              公司治理不透明。SKIMS 是私营公司，不向 SEC 申报，也不披露董事会构成或财务审计。公开信息中没有独立董事名单。所有重大战略公告都来自公司新闻稿，或 Kim Kardashian、Jens Grede
              的媒体表述。潜在投资者和交易对手会因此遇到重大尽调限制。品牌资产集中在 Kim Kardashian 本人身上，也构成已有充分记录的关键人风险。
