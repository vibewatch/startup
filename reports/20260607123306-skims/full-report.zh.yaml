  - id: TI003
    title: 单位经济性：指标、可得数值、置信度和尽调要求
    columns:
      - 指标
      - 可得估计或数值
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 毛利率
        - 50–62%（分析师估计；网络共识显示 2025 年“接近 62%”）
        - 低 — 估计值；无审计披露
        - 决定实体零售转向和批发业务的经济性
        - 按渠道和产品品类提供经审计毛利率。
      - - EBITDA 利润率（调整后）
        - '>23%（FashionBI 称为 2023 年内部预测）'
        - 低 — 内部预测；未审计
        - 显示增长能否自我供血，还是依赖外部资本
        - 提供全年调整后和报告 EBITDA，并列出调整项。
      - - 净利润率
        - ~25%（由 CEO 在 $750M 收入上的 $190M 净利润说法推算）
        - 低 — 公司声称；未独立验证
        - 高净利润率将确认资本效率，并降低烧钱风险
        - 提供经审计 P&L，列出收入、COGS、运营费用和净利润。
      - - 获客成本（CAC）
        - 未公开披露；分析师评论称因创始人杠杆而低于行业水平
        - Unknown
        - 自然触达成熟、付费媒体扩张后，CAC 有上升风险
        - 按年份和渠道（付费社媒、邮件、影响者、自然）提供混合 CAC。
      - - 客户留存率
        - 首次购买后 15 个月内留存 14%（Burda Luxury）
        - 低-中 — 第三方估计
        - 留存率低会让 LTV 相对行业基准承压
        - 提供 12 个月和 24 个月队列留存曲线。
      - - 客户终身价值（LTV）
        - 未公开披露
        - Unknown
        - LTV 相对 CAC 决定获客模型的可持续性
        - 按获客队列和渠道提供 LTV/CAC。
      - - 复购率
        - 注重功能的客户中约 38%（分析师估计，2025 年）
        - 低 — 估计值；特定细分
        - 特定细分指标可能高估整体复购率
        - 提供所有客户队列的混合复购率。
      - - 平均订单价值（AOV）
        - 未公开披露；由 $30–$100 产品区间和 $527M GMV 隐含
        - Unknown
        - AOV 推动营销效率和退货经济性
        - 按渠道和产品品类提供 AOV。
      - - 退货率
        - 未披露；DTC 退货收取 $15 补货费
        - 未知 — 客户评价数据释放反向信号
        - 高退货率压缩净收入和利润率；尺码准确性是投诉驱动
        - 提供总收入、按品类划分的退货率，以及实际确认的净收入。
      - - 营销支出
        - 2025 年估计 $120M（分析师估计）
        - 低 — 分析师估计；未验证
        - 营销费用 / 收入比决定回本周期和 CAC 轨迹
        - 提供经验证的营销支出占净收入百分比，以及渠道拆分。
    notes: >-
      除标价外，所有财务指标均为分析师估计或公司声称，并非来自经审计财务报表。SKIMS 是私营公司，不在美国提交公开财务报表。14% 留存数据来自 Burda Luxury 评论，引用行业跟踪。$190M 净利润说法归因于
      Sacra 报道的 CEO Jens Grede。“未知”置信度表示重大缺口。
    claimRefs:
