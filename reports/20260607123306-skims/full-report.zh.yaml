companyProfile:
  summary: >-
    SKIMS 是一家总部位于 Los Angeles 的私营服饰与生活方式公司，2019 年以解决方案导向的塑身衣主张起步，随后扩展到内衣、家居服、泳装、男装、美妆相邻品类和运动性能服饰。公司把 Kim Kardashian
    的受众触达和品牌热度，与 Jens Grede 的时尚运营经验、DTC 优先的商业模式、不断扩大的批发分销，以及越来越重要的自营零售版图结合起来。公开证据支撑其规模已经跑出来——包括 2025 年 11 月以 $5 billion
