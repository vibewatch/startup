          - type: callout
            title: 实体零售转向带来不可逆的固定成本敞口
            body: >-
              SKIMS 已公开承诺成为一家“以实体门店为主的业务”，签下 Regent Street 10 年、12,000 sq ft 租约， 还在 Dubai、Chicago 和 LA Sunset Strip
              签下更多旗舰店租约。高端旗舰店每平方英尺 $300–$800 的装修成本， 意味着单店就是数百万美元级承诺。没有披露门店级 P&L 或成熟门店的四墙 EBITDA，投资人无法把实体零售单店经济模型与最初推动盈利的
              DTC 回报做压力测试。
