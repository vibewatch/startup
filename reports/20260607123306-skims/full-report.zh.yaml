      - number: '3.2'
        title: 竞争者画像与能力
        blocks:
          - type: paragraph
            body: >
              Victoria's Secret 按收入和门店数看是最大的单一竞争者。该品牌在 2025 财年通过 1,420 个网点和 31,000 名员工创造 $2.27 billion 收入。2021 年 8 月从 L
              Brands 分拆为独立 NYSE 上市公司（VSXY）后，VS 推动包容性再品牌化——聘请 Megan Rapinoe、Priyanka Chopra 和 Naomi Osaka 担任 “VS
              Collective” 大使，并任命 Hillary Super（前 Anthropologie CEO，也曾短暂担任 Savage X Fenty CEO）为自己的 CEO。尽管有这些动作，VS
              收入已从此前峰值下滑，并自 2019 年以来关闭数百家门店。规模让它拥有巨大的批发议价能力和广告触达，但相对于 SKIMS，它的 DTC 能力仍不充分。


              Spanx 以 $64–$148 的产品定价主导高端塑身衣，品牌历史比 SKIMS 早近 20 年。Blackstone 于 2021 年 10 月以 $1.2 billion
              估值收购多数股权，带来全女性董事会和更多资本，但 Spanx 仍是相对小型的运营体（约 250 名员工），估计收入 $400 million。其尺码范围到 3X 截止，而 SKIMS 到 5X；它的名人 /
              KOL 影响力局限在植入产品和赠礼，而不是创始人身份锚点。2024 年 2 月 Spanx 在 London 地铁站投放品牌活动，显示其国际扩张野心。


              Savage X Fenty（2018 年创立）复制了 SKIMS 的名人创始人、尺码包容蓝图，但聚焦内衣而非塑身衣。它于 2022 年 1 月以据报道 $1 billion 估值完成 $125 million
              Series C，到 2023 年中开设 7 家零售门店，并在 2023 年 6 月 Rihanna 退任执行董事长时任命 Hillary Super 为 CEO。公司曾就涉嫌误导性 VIP 订阅做法与
              California 当局达成 $1.2 million 消费者保护诉讼和解——任何依赖循环会员计划的品牌都要把它当作模式风险。2022 年初报道的 $3 billion IPO 探索计划没有完成。


              Aerie（American Eagle Outfitters）是最成熟的包容定位竞争者，并拥有线下触达。其 #AerieREAL 活动（不修图、多元模特）早于 SKIMS，在 Gen-Z 消费者中建立了
              Aerie 的品牌认知。Aerie 拥有 175+ 家独立门店，以及 $5.26B 母公司的完整物流基础设施，因此可以提供远低于 SKIMS 的定价（文胸 $24–$44，内裤
              $14–$30），同时仍主张身体积极品牌地带。


              Lululemon（$10.6B 收入，2024 财年，767 家门店）是相邻竞争者，其高端运动文胸和紧身裤与 SKIMS 的运动服推进越来越重叠。NikeSkims 合资项目于 2025 年 9
              月发布，直接挑战 Lululemon 的核心客户。2025 年 6 月，Lululemon 起诉 Costco 侵犯知识产权——这说明即便最强的高端运动休闲品牌，也会面对大众零售商带来的商品化压力。


              ThirdLove（2013 年创立，累计融资约 $68M）是领先的 DTC 合身科技文胸品牌，2021 年被 NPD Group 列为美国线上贴身服饰第三名。半杯尺码创新和 FitFinder
              算法构成真实产品差异化。Wacoal（1949 年创立，Tokyo TSE 上市）代表高端百货文胸既有玩家，拥有合身专家、深厚 Nordstrom / Bloomingdale's
              关系，以及多个子品牌（b.tempt'd、Elomi、Freya）。大众市场塑身衣既有玩家 Hanesbrands 被 Gildan 以约 $2.2B 的交易收购，并于 2025 年交割，未来战略方向变得不确定。
