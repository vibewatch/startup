              的包容性尺码范围，刻意把可触达受众扩展到窄尺码竞争对手之外； Good Housekeeping Institute 在受控测试中确认了该完整范围内的产品可得性。第二个快速增长的细分是男性：
              男士内裤、居家服和基础款品类于 2023 年 8 月推出，并借助 NikeSkims 合作以及品牌 NBA、WNBA、NFL 官方合作伙伴身份积极推广。地域上，客户基础以美国为中心——公司运营 18
