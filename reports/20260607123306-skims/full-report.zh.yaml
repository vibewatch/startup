      - number: '2.2'
        title: 市场规模：相互竞争的估计与多视角 TAM
        blocks:
          - type: paragraph
            body: >
              SKIMS 最细颗粒度的可服务市场是塑身衣。Grand View Research 将 2024 年全球塑身衣市场定为 USD 2.73 billion，并预计以 8.0% CAGR 增长到 2030 年的
              USD 4.32 billion。Mordor Intelligence 对同一 2024 年基数的估计为 USD 2.36 billion——低约 14%——并给出更谨慎的 4.91% CAGR，对应 2030
              年 USD 3.15 billion。两份预测在起始基数相差约 $370 million 的情况下，对 2030 年结果给出 USD 1.17 billion
              的差距。两家公司都没有公布可调和这些差异的方法论，也都未经过独立审计。


              更宽的贴身服饰口径由 Verified Market Research 衡量，2025 年全球贴身服饰市场价值 USD 16.20 billion，以 6.5% CAGR 扩张到 2033 年的 USD
              28.40 billion。这个口径覆盖文胸、内裤、睡衣、塑身衣和保暖衣物——也就是 SKIMS 非运动产品线的完整范围。


              最宽且仍合理的口径是运动休闲，SKIMS 通过自有运动服线和 NikeSKIMS 合作参与竞争。Grand View Research 将 2025 年运动休闲市场定为 USD 422.04 billion，并以
              9.9% CAGR 增长到 2033 年的 USD 892.48 billion。Verified Market Research 对同一市场的估计为 2024 年 USD 447.7 billion，并以
              7.8% CAGR 增长到 2032 年的 USD 773.32 billion——基数相差约 USD 25 billion，CAGR 相差 2.1 个百分点。三种规模口径之间的矛盾记录在 Table TM002
              中，也解释了为什么任何单一 TAM 引用都带有很高不确定性。


              做实际尽调时，SKIMS 的 SAM 可以用现有地理触达（以美国为主，英国、欧洲、中东增长）和真实产品组合来约束。US Census 数据确认，服装和配饰的非门店（电商）零售占总服装支出的比例仍在上升，这强化了
              SKIMS 这类 DTC 权重较高品牌的结构性顺风。
