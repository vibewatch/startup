          - type: callout
            title: 客服和退货摩擦提示 DTC 留存风险
            body: >-
              SmartCustomer 评论数据显示，42 条评论平均评分为 1.4 星；已记录的抱怨包括 $15 DTC 补货费、尺码指导不准、 $30–$100 价位下材料质量低于预期，以及客服不响应。首购后 15
              个月内 14% 的客户留存率，明显低于一家声称毛利率超过 50% 的 DTC 品牌为支撑高端 LTV/CAC 比率所需的水平。这些信号合起来，要求对退货率、退货后净收入和混合队列 LTV 做深度尽调。
