      - number: '8.4'
        title: 乐观、基准与悲观结果
        blocks:
          - type: paragraph
            body: >-
              情景分析应从可观察收入规模出发，而不是从创始人名气出发。乐观情景假设 SKIMS 2025 年净销售额超过 $1
              billion，并借助国际门店、NikeSkims、男装和美妆以溢价速度复合增长，同时在没有重大服务或劳工问题的情况下守住服装利润率。如果公开市场投资者给予 On/Birkenstock 式增长倍数，该情景可支撑
              $7 billion 至 $10 billion 的 IPO 区间估值。基准情景假设 SKIMS 消化门店成本和更宽 SKU 复杂度后增长放缓；按 3.5x 至 4.5x
              销售额观察，已披露私募估值大体合理，但安全边际有限。悲观情景假设公开市场投资者把公司视为一家有服务投诉、披露薄弱和零售执行风险的可选服装公司；按 2x 至 3x
              销售额，上一轮私募估值下行空间明显。在经审计财务弥合当前证据缺口前，权重应保持保守。
