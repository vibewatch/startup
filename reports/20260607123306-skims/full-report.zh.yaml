    title: 收入流：机制、状态与尽调要求
    columns:
      - 收入流
      - 机制
      - 单位或公开代理指标
      - 当前状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - DTC 电商（skims.com）
        - 通过自有网站和 App 做全价与补货销售；上新驱动稀缺模式
        - 2024 年 skims.com GMV 约 $527M；补货提醒注册 11M+
        - 主要收入渠道；已确认是主导驱动
        - 高质量 — 全额毛利、自有客户数据、补货纪律
        - 披露净收入与 GMV 的差异、退货率，以及扣除退货成本后的净收入。
      - - 批发 — 高端零售商
        - 进入 Nordstrom、Saks、Net-a-Porter、Selfridges、Stockmann 等精选渠道
        - 合作已公开确认；无销量或售罄数据
        - 覆盖美国、英国、欧洲、北欧市场
        - 毛利率低于 DTC；承担品牌建设角色
        - 提供批发收入、售罄率，以及降价 / 退货敞口。
      - - 实体零售 — 自有门店
        - 美国和海外的公司自营旗舰店及标准零售店型
