        title: 投资建议、价格纪律与最终立场
        blocks:
          - type: paragraph
            body: >-
              在据报道 $5 billion 价格下，投资立场是继续研究，置信度中、风险高、估值偏高。放在私人服装公司里，正面案例异常强：Goldman Sachs Alternatives 领投 2025 年 11
              月融资，Reuters 转发报道称该轮以 $5 billion 估值融资 $225 million，公司称 2025 年净销售额有望超过 $1
              billion。这意味着在未调整优先权、稀释、库存资本、零售扩张成本或公开市场倍数压缩前，前瞻销售倍数约 5.0x。问题不在公司质量，而在入场时的证据质量。SKIMS
              尚未公布经审计合并财务、渠道层面利润率、队列留存、库存周转或股权结构表中的优先权条款，而公开运动服和服装同业估值已明显下修。要给出买入建议，要么需要审计证据证明其增长和盈利能力显著高于公开同业，要么入场价格更接近
              3.0x 至 4.0x 销售倍数区间。
