      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑在于 SKIMS 能把创始人主导的塑身衣品牌，扩成一个具备品类延展、全球触达和伙伴杠杆的规模化生活方式平台。公司和媒体来源支持其从塑身衣扩至内衣、居家服、服装、运动服和美妆；NikeSkims
              则给了品牌制度化分销和产品开发伙伴，这是许多名人品牌拿不到的资源。反向逻辑同样重大：SKIMS 仍是私人公司，披露有选择性；一旦公司开始运营门店、加盟、批发关系、库存风险和更宽 SKU
              组合，品牌热度未必能转化为公开市场耐久性。客户评论来源和一份 2026 年工资诉讼报道，又给服务质量和劳动执行打上反向信号。因此最关键判断是：SKIMS 值得像 On 或 Birkenstock
              那样享有高增长溢价倍数，还是会像 Nike、Lululemon、FIGS、Victoria's Secret、American Eagle 或 Hanesbrands 一样被压到服装倍数。按 $5
              billion，投资者已经在为高端执行买单。
