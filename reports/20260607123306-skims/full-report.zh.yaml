      - number: '5.5'
        title: 质量、退货与客户体验
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，SKIMS 在 Trustpilot 上基于 7,042 条评论得分 3.5/5，被标为“一般”， 低于高端定位品牌通常应达到的水平。Trustpilot 的 AI
              生成评论摘要列出主要正面点（塑身衣舒适、配送快、客服响应快）， 也列出主要负面点：首次洗涤后走线失败，部分产品线材料偏薄或做工廉价，胸罩和内衣品类之间尺码不一致，以及 AI 驱动客服在复杂问题上被认为没有帮助。

              退货系统对现金退款收取 $6 美国境内运费，仅对店铺积分或 SKIMS app 忠诚度会员免除。标记为 Final Sale 的商品不可退。 30
              天退货窗口符合行业标准，但费用结构制造了摩擦：Trustpilot 评论者明确提到，当尺码不一致且客户买前无法试穿时， 这笔费用会阻止复购。服装 DTC 品牌缺少线下试穿入口时，这就是结构性张力。

              客服投诉包括访客结账缺少订单确认（导致无法发起退货）、响应时间长，以及旗舰店零售员工培训不足。SKIMS 扩张到 22+ 家门店时，这些运营问题说明电商（订单管理）、CRM 和店内 POS
              系统之间的技术集成需要投入。公开记录中没有找到 FTC 或 CFPB 针对 SKIMS 的执法行动；品牌的营销合规敞口主要围绕 SMS opt-in 管理和产品宣称证明。
