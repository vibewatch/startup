  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - 2024-2026 年收入、利润率、EBITDA、现金流、库存
        - 确认 5x 销售额估值是否站得住
        - 要求提供经审计报表和月度管理账
      - - 渠道经济性
        - DTC、批发、门店、加盟、NikeSkims、美妆利润率
        - 扩张组合可能稀释盈利能力
        - CFO 数据室和渠道拆桥
      - - 客户队列
        - 按品类划分的复购、退货、NPS、CAC、LTV
        - 判断创始人带动需求之外的耐久性
        - 要求导出队列数据并提供独立调研
      - - 股权结构表
        - 优先权、清算堆叠、老股交易、期权池
        - 决定实际入场经济性
        - 律师牵头的瀑布模型和条款复核
      - - 零售生产率
        - 门店单店贡献、资本开支、回本周期、客流
        - 零售转向是融资用途核心
        - 复核队列 P&L 和租约
      - - 风险整改
        - 劳动诉讼应对、投诉趋势、合规计划
        - IPO 准备度和下行风险都需要
        - 法律备忘录和运营 KPI 复核
    notes: 每一项要求都咬住一个投资逻辑破裂触发项；数据缺失应降低建议评级，而不是诱导虚假精确。
