      - number: '5.3'
        title: 商务技术栈与上新节奏
        blocks:
          - type: paragraph
            body: >
              SKIMS 是一家 DTC 优先品牌，主要收入渠道是 skims.com，同时由 Nordstrom、Selfridges 等批发合作伙伴和不断扩大的自营零售网络补充。 官网运行邮件收集和 SMS
              营销项目（短信发送 SKIMS 至 68805），用于产品发售通知；超过 11 million 消费者已注册补货提醒， 形成大规模、已授权的自有媒体受众，降低获客成本对付费社交广告的依赖。SMS 项目受 TCPA
              opt-in 同意机制和 CAN-SPAM 合规约束，SKIMS 隐私政策也可公开访问。

              SKIMS 的上新节奏围绕高频限量发售和补货组织，而不是传统季节性系列。街头服饰和球鞋品牌已经证明这种打法有效： 它靠稀缺信号制造紧迫感、带来重复站点访问，并放大社交媒体传播。Sacra 数据显示，超过 11
              million 消费者注册了产品补货提醒， 说明公司在转化速度上有结构性需求优势。

              SKIMS app 提供额外互动入口，为加入 SKIMS Rewards 的 app 会员提供免费退货处理；这既是轻量忠诚度机制， 也把 app 内购买体验与仅网页购买区分开。电商技术栈未公开披露；网站行为和
              URL 结构与现代 headless 或基于 Shopify 的 DTC 架构一致，但 SKIMS 没有确认。已有一项专门证据缺口记录缺少经确认的技术栈数据。
