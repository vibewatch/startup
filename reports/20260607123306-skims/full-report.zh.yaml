      - number: '7.3'
        title: 供应链、劳工与合规风险
        blocks:
          - type: paragraph
            body: >-
              SKIMS 不公开披露制造合作伙伴、原产国或供应商审计方法。公司从 DTC 塑身衣品牌快速扩展为多品类全球零售商，
              覆盖男装、运动服和美妆，供应商基础随之扩大，但公开可见的供应链治理没有同步增强。California Transparency in Supply Chains Act（SB 657）要求总部或运营在
              California、全球年总收入超过 $100 million 的零售商披露五个领域的供应链尽调工作： 验证、审计、认证、内部问责和培训。SKIMS
              已越过该法所指收入门槛，必须在官网发布供应链披露。研究期间未在 SKIMS.com 找到具体供应链披露文件；如果确有缺口，将构成合规缺陷。

              Uyghur Forced Labor Prevention Act（UFLPA）于 2021 年 12 月签署、2022 年 6 月生效，设定可反驳推定：
              全部或部分在中国新疆制造的商品被视为使用强迫劳动，因此禁止进口。CBP 正积极执行 UFLPA Entity List。来自中国的服装和纺织品采购—— 尤其是棉花和氨纶供应链——天然带有 UFLPA
              审查风险。如果 SKIMS 从任何新疆邻近中国工厂或 UFLPA Entity List 上的实体采购，货物可能被扣留或排除，造成库存中断和声誉伤害。DOL 的 FLSA 管理仓库和履约中心劳工，CFPB
              投诉数据库记录消费者金融产品问题；两者都构成持续监管监测义务。SKIMS 仓库、18 家美国门店、国际加盟门店和第三方物流供应商的劳工合规， 也需要按 FLSA 加班和最低工资要求主动监测。
