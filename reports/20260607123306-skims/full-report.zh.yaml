  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 投资逻辑证据
      - 反向逻辑证据
      - 何种证据会改变观点
    rows:
      - - 规模
        - SKIMS 预计 2025 年净销售额超过 $1B
        - 未发布经审计财务或收入拆桥
        - 经审计 2025 年收入和 2026 年至今订单
      - - 品牌
        - 极强的自然媒体拉动
        - 名人集中度带来公开市场关键人风险
        - 不依赖创始人营销活动的复购
      - - 品类扩张
        - NikeSkims、男装、服装和美妆扩大 TAM
        - 邻近品类扩张可能稀释聚焦度和利润率
        - 按品类划分的 SKU 毛利率和售罄率
      - - 零售
        - 融资款指定用于门店和国际增长
        - 门店增加租赁占用、人工、库存和资本开支风险
        - 按队列划分的单店贡献利润率
      - - IPO 期权
        - PitchBook 分析师称 SKIMS 是可信的未来 IPO 候选
        - 消费品 IPO 窗口和服装倍数仍波动
        - 承销商反馈和准备度材料包
      - - 客户体验
        - 高端品牌形象仍在多轮营销中可见
        - 评论来源提示服务和质量问题
        - 独立 NPS 和投诉解决趋势
    notes: 论点配对使用证实与反证来源，避免投委会备忘录单边叙事。
