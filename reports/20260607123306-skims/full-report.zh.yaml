      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: 收入轨迹与投资人验证过的增长叙事
            body: >-
              SKIMS 从首个完整年度（2020 年）的 $145M 增长到 2023 年的 $750M，CAGR 为 37%；根据 Goldman Sachs 领投的 Series D 公告，2025 年净销售额有望超过
              $1 billion。据报道公司已盈利，估计 EBITDA 率超过 23%，2023 年净利润约 $190M。Goldman Sachs、BDT & MSD、Wellington
              Management、Greenoaks 等投资人基础，为这条财务轨迹增加了机构可信度。
            calloutType: strength
            claimRefs:
              - CI002
              - CI003
