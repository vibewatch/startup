chapter:
  number: 6
  title: Customers
  summary: >
    SKIMS commands a loyal DTC women's consumer base in the 18–45 demographic, reinforced by
    size-inclusive positioning (XXS–4X), celebrity visibility, and a growing omnichannel retail
    footprint. The brand launched a men's category in 2023, secured official underwear-partner
    status with the NBA, WNBA, and NFL, and opened its first permanent retail stores in 2024,
    expanding toward 18 owned U.S. locations plus two Mexico franchises by mid-2026 alongside
    new Asian flagship entries. Wholesale proof is established at Nordstrom, Selfridges,
    Net-A-Porter, and SSENSE. Review sentiment is decidedly mixed: Trustpilot rates SKIMS
    "Average" at 3.5/5 with recurring customer-service and delivery complaints, while
    independent lab tests affirm product efficacy. No publicly disclosed NRR, GRR, or cohort
    retention data exists; concentration risk around Kim Kardashian's personal brand remains
    the principal customer-durability concern.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Base Profile
    body: >
      SKIMS's core customer is a brand-aware woman aged 18–45 who discovers the product through
      social media, celebrity endorsement, or editorial coverage and purchases primarily via the
      DTC e-commerce channel. The brand's size-inclusive range—XXS through 4X across underwear,
      shapewear, loungewear, and swim—deliberately widens the addressable audience beyond
      narrow-fit competitors, and the Good Housekeeping Institute confirmed product availability
      across this full range during controlled testing. A secondary and fast-growing segment is
      men: the men's underwear, loungewear, and basics category launched in August 2023 and is
      actively promoted through the NikeSkims collaboration and through the brand's NBA, WNBA,
      and NFL official-partner status. Geographically, the customer base is U.S.-centric—the
      company operates 18 owned U.S. stores and two Mexico franchise units—but international
      acquisition is accelerating through luxury wholesale (Selfridges UK, SSENSE Canada/EU,
      Net-A-Porter global) and planned first-party Asian stores in Hong Kong and Seoul. A fourth
      identifiable segment is the celebrity-follower cluster: consumers whose brand loyalty is
      explicitly tied to Kim Kardashian's personal platform, representing both a rapid-acquisition
      engine and a structural concentration risk.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU001

  - id: adoption-trajectory
    title: Adoption Trajectory and Channel Growth
    body: >
      SKIMS's adoption curve tracks a classic DTC-to-omnichannel transition. Founded in 2019,
      the brand exceeded $500 million in reported revenues by 2022 and targets more than $1 billion
      in net sales in 2026, validated by the Goldman Sachs–led $225 million Series D at a $5 billion
      valuation announced in November 2025. Physical retail is the current growth vector: the brand
      opened its first permanent store in Washington D.C. in January 2024 and has since scaled to
      18 owned U.S. locations. Management publicly declared the aim of becoming "a predominantly
      physical business over the next several years." Wholesale deepened in parallel; NikeSkims at
      The Corner—a dedicated shop-in-shop—opened at Nordstrom's New York flagship in February 2026,
      and new Hong Kong and Seoul stores were announced for 2026 in partnership with Lane Crawford
      and local operators. The men's category, launched August 2023, has grown its SKU count
      through NikeSkims and NBA/WNBA/NFL co-marketing. No customer-count, conversion-rate, or
      category-level revenue split has been publicly disclosed.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
    tableRefs:
      - TU002

  - id: named-customer-proof
    title: Named Customer Proof
    body: >
      SKIMS has established verified wholesale proof across premium and luxury retail channels.
      Nordstrom has carried the brand since at least 2022, and the NikeSkims at The Corner
      shop-in-shop at the New York flagship (February 2026) demonstrates deepened placement.
      UK luxury department store Selfridges stocks the full SKIMS range online and in-store.
      Net-A-Porter, the Richemont-owned luxury e-tailer, positions SKIMS as a "cult status"
      brand sold globally. SSENSE, the Montreal-based luxury platform, carries the women's
      SS26 collection and frames the brand as founded by "media mogul Kim Kardashian." In
      the institutional channel, SKIMS became the official underwear partner of the NBA, WNBA,
      and NFL in 2023—a partnership designed to validate product performance credentials and
      extend visibility to male consumers. The brand was also designated the official outfitter
      for Team USA at the Paris 2024 Olympics, generating significant earned media. Each of
      these partnerships constitutes a named, verifiable customer or distribution proof-point,
      though outcome data (sell-through rates, repeat wholesale orders, contract renewals) is
      not publicly available.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
