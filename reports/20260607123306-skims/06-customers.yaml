  - id: review-sentiment
    title: Review Sentiment and Product Experience
    body: >
      Consumer review signals are decidedly mixed and represent one of the more significant
      reputational risks for customer retention. Trustpilot rates SKIMS "Average" at 3.5 out of
      5 stars as of early 2026, with recurring themes of non-responsive customer service, delivery
      failures, and protracted refund disputes. SmartCustomer, aggregating 42 independent reviews,
      assigns only 1.4 out of 5 stars, with reviewers citing cheap fabric quality, ill-fitting
      products, and customer service unavailability. Specific complaints include a $15 restocking
      fee on shapewear returns, lack of timely support, and refunds not processed for returned
      items. In contrast, independent editorial reviews are more favorable: Good Housekeeping's
      Textiles Lab tested core products in stretch-recovery, washing durability, and consumer-wear
      trials, finding the Seamless Sculpt Bodysuit and Fits Everybody Thong among top performers,
      though noting the bodysuit is "too tight for all-day wear." NYT Wirecutter found the Seamless
      Sculpt Bodysuit "the most dramatically waist-cinching" in category but polarizing—testers
      either loved it or called it "torture"—and recommended sizing up. The divergence between
      lab-and-editor positivity and customer-community negativity is consistent with a brand that
      executes product well but has underinvested in post-purchase service infrastructure.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
    tableRefs:
