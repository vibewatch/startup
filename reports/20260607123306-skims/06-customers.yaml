  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention metrics
      missingEvidence: "NRR, GRR, cohort-level churn, and repeat-purchase rate data segmented by women's, men's, and DTC vs. wholesale."
      whyItMatters: "Without retention data, the sustainability of the $5B valuation and long-term revenue durability cannot be assessed against DTC apparel comparables."
      diligencePath: "Request 24-month DTC cohort curves from management during formal diligence. Cross-reference with SKIMS Rewards membership count and tier retention data."
      relatedQuestionRefs: [QU001, QU002, QU006]

    - type: private-evidence-only
      severity: material
      topic: DTC vs wholesale revenue split
      missingEvidence: "Channel-level revenue breakdown showing DTC e-commerce, owned retail stores, and wholesale as percentage of total net sales."
      whyItMatters: "The shift to physical retail changes the margin and capital profile materially; without the current baseline split the directional claim cannot be evaluated."
      diligencePath: "Request channel-level P&L or at minimum channel revenue percentages from management in diligence."
      relatedQuestionRefs: [QU003]

    - type: private-evidence-only
      severity: material
      topic: men's category scale
      missingEvidence: "Men's category revenue as a percentage of total SKIMS revenue and SKU count trend since August 2023 launch."
      whyItMatters: "Men's is described as a strategic priority; its actual scale relative to the core women's business determines whether the segment expansion is financially meaningful."
      diligencePath: "Request men's revenue as % of total in diligence; cross-reference NikeSkims revenue attribution if disclosed."
      relatedQuestionRefs: [QU013, QU019]

    - type: private-evidence-only
      severity: material
      topic: customer acquisition cost and unit economics
      missingEvidence: "CAC by channel (social/DTC, wholesale, physical retail), LTV, AOV, and blended marketing efficiency ratio."
      whyItMatters: "At $5B valuation, understanding unit economics is required to model the path to profitability against physical retail scaling costs."
      diligencePath: "Request LTV/CAC by cohort and channel in formal diligence. Compare to Lululemon and Victoria's Secret disclosed metrics."
      relatedQuestionRefs: [QU017, QU023]

    - type: enumeration-incomplete
      severity: minor
      topic: wholesale accounts
      missingEvidence: "Comprehensive list of all active wholesale accounts globally including regional boutiques, department stores, and e-tailers beyond the four named tier-1 partners."
      whyItMatters: "Understanding wholesale account concentration reveals dependency risk if any single wholesale partner underperforms."
      diligencePath: "Request wholesale account list and top-10 wholesale partner revenue concentration from management."
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]

