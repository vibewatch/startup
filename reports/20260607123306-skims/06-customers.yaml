callouts:
  - calloutType: risk
    title: Kim Kardashian Concentration Risk
    body: >
      All major SKIMS product launches, institutional partnerships, and wholesale
      negotiations are visibly tied to Kim Kardashian's personal platform and creative
      direction. No secondary brand ambassador or creative anchor exists at comparable
      scale. A significant adverse personal PR event or disengagement by Kardashian
      would materially impair brand equity and customer acquisition. This risk is
      partially mitigated by the NikeSkims collaboration (Nike's corporate halo) and
      institutional partnerships (NBA/WNBA/NFL), but the brand has not yet demonstrated
      independence from its founder's celebrity.
    claimRefs:
      - CU041
      - CU042
      - CU043

  - calloutType: insight
    title: Review Sentiment Gap Signals Ops Underinvestment
    body: >
      The contrast between favorable independent lab reviews (Good Housekeeping, NYT
      Wirecutter) and poor customer-service reviews (Trustpilot 3.5/5, SmartCustomer 1.4/5)
      is consistent with a brand that prioritizes product development and marketing over
      post-purchase infrastructure. As SKIMS scales physical retail and international
      operations, this gap becomes a compounding churn risk that the SKIMS Rewards loyalty
      app alone cannot fully address.
    claimRefs:
      - CU027
      - CU028
      - CU031
      - CU032
      - CU033

  - calloutType: recommendation
    title: Request Cohort and Segment Retention Data in Diligence
    body: >
      SKIMS discloses no NRR, GRR, cohort churn, repeat-purchase rate, or average order
      value. An investor diligence process must require management to provide at least 24
      months of DTC cohort curves segmented by women's, men's, and first-purchase category.
      Without this data, the sustainability of the $5 billion valuation cannot be adequately
      assessed against comparable DTC apparel peers.
    claimRefs:
      - CU036
      - CU037
      - CU044

