  - id: unit-economics-and-margin-structure
    title: Unit economics, margin structure, and marketing efficiency
    body: >-
      Gross margins for SKIMS are estimated by analysts at 50–62%, consistent with premium DTC apparel economics and supported by a direct ownership of the e-commerce channel, relatively asset-light production, and price points that sit above mass-market shapewear without reaching luxury-tier. Sacra's research notes CEO Jens Grede's publicly stated claim of approximately $190 million in net profit for 2023, which implies a net margin around 25% on $750 million in revenue — a remarkably high figure for a growth-stage apparel brand if verified. FashionBI additionally cites internal projections reviewed by industry experts pointing to an adjusted EBITDA margin above 23% for 2023, alongside 58% revenue growth and a 76% year-over-year revenue jump in Q1 of that year.

      Customer acquisition cost is held lower than traditional apparel incumbents by Kim Kardashian's 360 million+ Instagram followers and the earned media generated by scarcity-driven drops. Industry estimates from Latterly place SKIMS's repeat-purchase rate among performance-focused customers at approximately 38% in 2025, while Burda Luxury reports an overall customer retention rate of 14% within 15 months of first purchase — figures that support durable lifetime value if pricing holds. However, several cautions apply: the $15 restocking fee on returns (documented in customer reviews) signals a friction-minimisation strategy that may suppress first-purchase conversion among new customers. Review platform data from SmartCustomer shows a 1.4-star average across 42 reviews as of mid-2026, with recurrent complaints about sizing accuracy, material quality relative to price, and customer service responsiveness — a signal that full-price sell-through could face headwinds if the quality gap between perceived premium pricing and delivered experience widens.

      The NikeSkims partnership introduces a new margin variable that is not publicly quantified. The joint venture structure, royalty economics, and profit-share split between SKIMS and Nike are undisclosed. As SKIMS pivots toward physical retail — which carries higher occupancy, labor, and inventory-management costs than DTC e-commerce — gross margin could compress unless the retail channel achieves comparable sell-through rates to the online business.
