  - id: capital-adequacy-and-financing
    title: Capital adequacy, funding history, and retail capex pipeline
    body: >-
      SKIMS completed a $225 million Series D equity round in November 2025, led by Goldman Sachs Alternatives with participation from BDT & MSD Partners' affiliated funds, placing the company's valuation at $5 billion. This followed a $270 million Series C in July 2023 led by Wellington Management at a $4 billion valuation. Total capital raised across all rounds now stands at approximately $956 million, with a blue-chip investor roster including Goldman Sachs Alternatives, BDT & MSD Partners, Wellington Management, Greenoaks Capital, Lone Pine Capital, D1 Capital Partners, and Thrive Capital. The Goldman Sachs press release explicitly earmarked Series D proceeds for physical retail expansion, international growth, and product category innovation — a capital-use profile that signals significant near-term capex rather than balance sheet strengthening.

      The physical retail pivot represents the most material forward capital commitment. SKIMS operated 18 US-owned retail locations plus two Mexico franchise doors as of November 2025, with its first permanent US door having opened in Washington D.C. in 2024. The London Regent Street flagship — a 12,000 sq ft space in the former Ted Baker unit under a 10-year Crown Estate lease — is slated for summer 2026 at significant build-out cost. A Dubai Mall of the Emirates store opened December 2025, and additional Hong Kong and Seoul locations have been announced. SKIMS UK INTERNATIONAL LTD was incorporated in November 2024 specifically to support the EMEA expansion, per UK Companies House. The company has also hired a dedicated EMEA President (Robin Gendron) and is establishing a first regional EMEA warehouse, investments that further load the near-term cost base.

      Despite the strong fundraising record, no public disclosure exists for consolidated cash on hand, monthly cash burn, runway, revolving credit facilities, or working capital position. The profitability claim — if the $190M net profit figure for 2023 is accurate — suggests SKIMS may be internally cash generative, but the rapid store-opening pace suggests incremental capital requirements remain elevated. Physical retail build-outs typically run $300–$800 per square foot in flagship locations; a 12,000 sq ft Regent Street store alone could require $3.6M–$9.6M in fit-out capital before inventory. Without audited financials, capital adequacy must be inferred from fundraising recency and investor quality, not from disclosed liquidity.
