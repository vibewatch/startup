callouts:
  - calloutType: strength
    title: Revenue trajectory and investor-validated growth story
    body: >-
      SKIMS grew from $145M in its first full year (2020) to $750M in 2023 — a 37% CAGR — and is on track to exceed $1 billion in 2025 net sales per the Goldman Sachs-led Series D announcement. The company is reportedly profitable with an estimated 23%+ EBITDA margin and ~$190M net profit in 2023. The investor base (Goldman Sachs, BDT & MSD, Wellington Management, Greenoaks) adds institutional credibility to the financial trajectory.
    claimRefs:
      - CI002
      - CI003
      - CI013
      - CI014
      - CI025

  - calloutType: risk
    title: Physical-retail pivot creates irreversible fixed-cost exposure
    body: >-
      SKIMS has publicly committed to becoming a "predominantly physical business," signing a 10-year, 12,000 sq ft Regent Street lease plus additional flagship leases in Dubai, Chicago, and LA Sunset Strip. Premium flagship leases at $300–$800/sq ft build-out cost represent multi-million-dollar commitments per location. Without disclosed store-level P&L or four-wall EBITDA for mature locations, investors cannot stress-test the physical-retail unit economics against the DTC returns that originally drove profitability.
    claimRefs:
      - CI030
      - CI031
      - CI032
      - CI033
      - CI040
      - CI042

  - calloutType: risk
    title: Customer service and returns friction signal DTC retention risk
    body: >-
      SmartCustomer review data shows a 1.4-star average rating across 42 reviews, with documented complaints about a $15 DTC restocking fee, inaccurate sizing guidance, below-expectation material quality relative to the $30–$100 price point, and unresponsive customer service. The stated 14% customer retention rate within 15 months is materially below what a DTC brand with claimed 50%+ gross margins would need to achieve premium LTV/CAC ratios. These signals collectively warrant deep diligence on return rates, net revenue after returns, and blended cohort LTV.
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI024

  - calloutType: insight
    title: Valuation multiple is premium but defensible if growth sustains
    body: >-
      At $5B valuation on roughly $1B in 2025 expected net revenue, SKIMS trades at ~5x forward sales — elevated vs public apparel peers (Hanesbrands 0.7x, PVH 0.5x) but significantly below Lululemon at peak (~9x). The multiple is defensible only if the 37% CAGR holds into 2026–2028 and gross margins are confirmed above 55%. If revenue growth moderates to 20% or margins compress from the physical-retail pivot, the implied 2027 multiple would look stretched against public-market comps.
    claimRefs:
      - CI036
      - CI037
      - CI038
      - CI043
      - CI044

  - calloutType: assumption
    title: Profitability claims rely on unaudited, company-attributed reporting
    body: >-
      The most cited positive financial signal for SKIMS — $190M net profit in 2023 — is attributed to CEO Jens Grede and reported by Sacra, not derived from audited financial statements. As a private US company, SKIMS faces no mandatory public disclosure obligation. Investors and analysts should treat all margin and profitability figures as company-claimed estimates pending independent verification of the full P&L.
    claimRefs:
      - CI015
      - CI046

