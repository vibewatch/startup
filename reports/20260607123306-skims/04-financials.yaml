  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Audited P&L for FY2023 and FY2024, including gross revenue, COGS, gross margin, operating expenses by line, and GAAP net income.
      whyItMatters: >-
        All margin and profitability figures are analyst-estimated or company-claimed. Without audited financials, investors cannot verify the $190M net profit claim, the 50–62% gross margin estimate, or the 23%+ EBITDA margin, and cannot underwrite capital adequacy for the aggressive retail expansion.
      diligencePath: Request audited or CPA-reviewed financial statements from management under NDA as part of the due-diligence process.
      relatedQuestionRefs:
        - QI002
        - QI003
        - QI008
      relatedTableRefs:
        - TI003
        - TI005

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Consolidated balance sheet showing cash and equivalents, revolving credit facilities, aggregate lease liabilities, and working capital position as of the most recent quarter.
      whyItMatters: >-
        The physical-retail pivot to 18+ US stores and planned flagships in London, Dubai, Seoul, Hong Kong, and other markets creates substantial fixed-cost obligations. Without a balance-sheet view, runway cannot be assessed and the adequacy of the $225M Series D for the stated expansion program cannot be independently verified.
      diligencePath: Request unaudited quarterly cash flow statements and treasury position, plus a schedule of lease obligations by location.
      relatedQuestionRefs:
        - QI011
        - QI010
        - QI015
      relatedTableRefs:
