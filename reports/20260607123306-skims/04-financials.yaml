  - id: TI005
    title: Public financial gaps — missing metrics, impact, and diligence path
    columns:
      - Missing metric
      - Impact on underwriting
      - Diligence path
    rows:
      - - Audited P&L (revenue, COGS, gross margin, operating expenses, net income)
        - Cannot verify gross margin, profitability, or cost structure claims
        - Request audited or reviewed financial statements for FY2023 and FY2024.
      - - Channel-level revenue breakdown (DTC vs wholesale vs physical retail)
        - Cannot assess margin mix, capital allocation efficiency, or channel risk concentration
        - Request segmented revenue P&L with contribution margin by channel.
      - - Cash on hand and burn rate
        - Cannot assess capital adequacy or runway for retail-expansion capex
        - Request quarterly cash flow statements and treasury balance as of close.
      - - NikeSkims JV economics (revenue share, margin split, inventory ownership)
        - Cannot value the JV contribution or estimate Nike-side economics leakage
        - Require JV agreement, revenue-recognition policy, and SKIMS-allocated income.
      - - SKKN by Kim acquisition terms
        - Cannot assess cost of beauty-category entry or earnings impact
        - Request deal value, acquired liabilities, and pro forma P&L for beauty segment.
      - - Return rate and net revenue after returns
        - Cannot determine true net revenue or margin given consumer complaints about returns
        - Request gross-to-net revenue bridge with return rate by category and channel.
      - - Marketing spend by channel
        - Cannot compute blended CAC, payback period, or marketing efficiency
        - Request annual marketing expense by channel with attributed revenue.
      - - Customer acquisition cost and LTV by cohort
        - Cannot assess LTV/CAC ratio or identify deterioration as organic reach matures
        - Request CAC and 12/24-month LTV by acquisition cohort from 2019 to present.
      - - Store-level P&L for owned retail
        - Cannot assess four-wall profitability of physical-retail expansion
        - Request store-level revenue, occupancy, labor, and EBITDA for 3+ mature locations.
    notes: >-
      All items in this table represent information absent from public sources as of 2026-06-07. SKIMS Body, Inc. is a private US company not subject to SEC disclosure requirements. The absence of these disclosures is standard for private apparel companies at this stage but materially limits underwriting confidence on all financial dimensions except confirmed revenue trajectory and funding history.
