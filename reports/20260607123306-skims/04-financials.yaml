tables:
  - id: TI001
    title: Revenue streams — mechanism, status, and diligence ask
    columns:
      - Stream
      - Mechanism
      - Unit or public proxy
      - Current status
      - Revenue quality read
      - Diligence ask
    rows:
      - - DTC e-commerce (skims.com)
        - Full-price and restock sales via owned website and app; drop-driven scarcity model
        - ~$527M GMV on skims.com in 2024; 11M+ restock alert signups
        - Primary revenue channel; confirmed the dominant driver
        - High quality — full margin, owned customer data, restock discipline
        - Disclose net revenue vs GMV, return rate, and net revenue after return costs.
      - - Wholesale — premium retailers
        - Curated placement at Nordstrom, Saks, Net-a-Porter, Selfridges, Stockmann
        - Publicly confirmed partnerships; no volume or sell-through data
        - Active across US, UK, Europe, Nordic markets
        - Lower gross margin than DTC; brand-building role
        - Provide wholesale revenue, sell-through rates, and markdown/return exposure.
      - - Physical retail — owned stores
        - Company-owned flagship and standard retail formats in US and internationally
        - 18 US stores + 2 Mexico franchise as of Nov 2025; London (summer 2026), Dubai (Dec 2025)
        - Rapid expansion; first US permanent door opened 2024
        - Early-stage; capex-heavy; store-level economics not disclosed
        - Provide average sales per sq ft, four-wall EBITDA, and payback period per format.
      - - NikeSkims activewear
        - Co-branded joint venture distributed via Nike.com, SKIMS.com, and Nike retail
        - Debuted Sept 2025; 65+ silhouettes; Spring '26 expansion; sold out within hours
        - Commercially active and growing
        - Revenue recognition and margin split with Nike are not disclosed
        - Disclose SKIMS revenue share, royalty structure, and inventory ownership in JV.
      - - Beauty and fragrance (pipeline)
        - SKKN by Kim acquisition from Coty; new EVP Beauty & Fragrance appointed
        - Products slated for 2026 launch; acquisition terms undisclosed
        - Pre-revenue for SKIMS
        - Potentially margin-dilutive at launch given new-category overhead
        - Provide Coty deal economics, beauty brand revenue prior to acquisition, and launch P&L.
    notes: >-
      DTC GMV from Sacra analyst estimate for 2024; wholesale and NikeSkims revenue splits are not publicly disclosed. Store counts from Goldman Sachs official press release, November 2025. Beauty category economics are not yet available. "Revenue quality read" reflects publicly available channel context, not verified margin data.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI010
      - CI011

