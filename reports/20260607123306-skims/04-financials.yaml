  - id: TI003
    title: Unit economics — metric, available value, confidence, and diligence ask
    columns:
      - Metric
      - Available estimate or value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Gross margin
        - 50–62% (analyst estimate; "near 62%" for 2025 per web consensus)
        - Low — estimated; no audited disclosure
        - Determines economics of the physical-retail pivot and wholesale economics
        - Provide audited gross margin by channel and product category.
      - - EBITDA margin (adjusted)
        - ">23% (2023 internal projection per FashionBI)"
        - Low — internal projection; not audited
        - Indicates whether growth is self-funding or reliant on external capital
        - Provide full-year adjusted and reported EBITDA with adjustments listed.
      - - Net margin
        - "~25% implied by CEO's $190M net profit claim on $750M revenue"
        - Low — company-claimed; not independently verified
        - High net margin would confirm capital efficiency and reduce burn risk
        - Provide audited P&L with revenue, COGS, operating expenses, and net income.
      - - Customer acquisition cost (CAC)
        - Not publicly disclosed; analyst commentary cites lower-than-industry due to founder leverage
        - Unknown
        - CAC escalation risk as organic reach matures and paid media scales
        - Provide blended CAC by channel (paid social, email, influencer, organic) by year.
      - - Customer retention rate
        - 14% retention within 15 months of first purchase (Burda Luxury)
        - Low-medium — third-party estimate
        - Low retention rate raises LTV concern relative to industry norms
        - Provide 12-month and 24-month cohort retention curves.
      - - Customer LTV
        - Not publicly disclosed
        - Unknown
        - LTV relative to CAC determines sustainability of the acquisition model
        - Provide LTV/CAC by acquisition cohort and channel.
      - - Repeat purchase rate
        - "~38% among performance-focused customers (analyst estimate, 2025)"
        - Low — estimated; segment-specific
        - Segment-specific metric may overstate blended repeat rate
        - Provide blended repeat purchase rate across all customer cohorts.
      - - Average order value (AOV)
        - Not publicly disclosed; implied by $30–$100 product range and $527M GMV
        - Unknown
        - AOV drives marketing efficiency and return economics
        - Provide AOV by channel and product category.
      - - Return rate
        - Not disclosed; $15 restocking fee applied to DTC returns
        - Unknown — adverse signals from customer review data
        - High return rates compress net revenue and margin; sizing accuracy is a complaint driver
        - Provide gross revenue, return rate by category, and net revenue realized.
      - - Marketing spend
        - "$120M estimated for 2025 (analyst estimate)"
        - Low — analyst estimate; not verified
        - Marketing-to-revenue ratio determines payback period and CAC trajectory
        - Provide verified marketing spend as % of net revenue and channel breakdown.
    notes: >-
      All financial metrics except list pricing are analyst-estimated or company-claimed and not derived from audited financial statements. SKIMS is a private company and does not file public financial statements in the US. The 14% retention figure is from Burda Luxury commentary citing industry tracking. The $190M net profit claim is attributed to CEO Jens Grede as reported by Sacra. "Unknown" confidence entries represent material gaps.
