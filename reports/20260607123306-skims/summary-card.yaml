summary:
  headline: >-
    SKIMS has reached real global brand scale and category relevance, but the current $5 billion private valuation
    already prices in continued hypergrowth while audited financials, governance detail, and celebrity-concentration
    risk remain unresolved.
  overallScore: 6.3
