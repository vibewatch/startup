evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: profitability
    missingEvidence: Independently audited income statement confirming SKIMS net profit margin and revenue figures
    whyItMatters: >-
      Revenue and profit data are based on Sacra analyst estimates and CEO statements only; no audited financials are
      public, making valuation multiple and growth-rate analysis dependent on unverified figures
    diligencePath: >-
      Request audited financials under NDA as part of any institutional due-diligence engagement; cross-reference tax
      filings or regulatory disclosures if available in any jurisdiction
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: SKIMS board of directors composition, investor governance rights, and ownership cap table
    whyItMatters: >-
      No public board disclosure limits understanding of fiduciary oversight, investor control provisions, or
      drag-along/tag-along rights that would affect an acquirer or IPO investor
    diligencePath: >-
      Request board constitution and shareholder agreement under NDA; review any SEC filings post-IPO registration if
      the company re-files
  - type: missing-source
    severity: material
    topic: jens-grede-background
    missingEvidence: >-
      Detailed public biography of Jens Grede covering his exact founding role and operational track record at Bureau
      Betak and Frame
    whyItMatters: >-
      Grede's prior management experience directly affects confidence in SKIMS' operational execution capability during
      rapid global scaling
    diligencePath: >-
      Review LinkedIn profile, Bureau Betak company history, and Frame revenue disclosures; seek board or investor
      references from prior ventures
    relatedQuestionRefs:
      - QO021
  - type: enumeration-incomplete
    severity: minor
    topic: investor-ownership-stakes
    missingEvidence: Individual ownership percentages, governance rights, and board representation for each SKIMS investor
    whyItMatters: >-
      Without stake sizes and control provisions it is impossible to model dilution impact, founder-control status, or
      alignment of incentives between Goldman Sachs, earlier investors, and founders
    diligencePath: Request cap table and shareholders agreement from SKIMS management or lead counsel under NDA
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Exact dates and amounts for SKIMS' pre-2021 funding events, sub-rounds within the 2023 Series C, and product
      launch cadence 2019-2021
    whyItMatters: >-
      Gaps in early milestones make it difficult to assess the speed and capital efficiency of SKIMS' formative growth
      phase
    diligencePath: >-
      Review archived press releases, Crunchbase funding history, and Wayback Machine captures of skims.com from
      2019-2021
    relatedTableRefs:
      - TO004
    relatedQuestionRefs:
      - QO029
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Total employee headcount and departmental breakdown for SKIMS as of 2025-2026
    whyItMatters: >-
      Headcount data is essential for assessing operational leverage, per-employee revenue benchmarking against DTC
      peers, and cost-structure during the brick-and-mortar pivot
    diligencePath: >-
      Review LinkedIn headcount data, job-posting patterns on skims.com/careers, and management commentary in media
      profiles
  - type: missing-source
    severity: material
    topic: DTC-vs-wholesale-revenue-split
    missingEvidence: >-
      SKIMS has not disclosed its DTC-to-wholesale revenue split. An S-1 or direct management disclosure would resolve
      this.
    whyItMatters: Channel mix materially affects CAC, return rates, gross margin, and growth trajectory modeling.
    diligencePath: Request channel-level revenue split from SKIMS management or await IPO filing.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: minor
    topic: plus-size-intimate-apparel-standalone-TAM
    missingEvidence: >-
      No independent analyst has published a standalone US plus-size intimate apparel market dollar estimate separable
      from the broader intimate apparel frame.
    whyItMatters: >-
      The plus-size sizing proposition is central to SKIMS' brand differentiation; quantifying its size would sharpen
      TAM attribution.
    diligencePath: >-
      Commission or locate a trade association study from AAFA or a specialty market research firm with extended-size
      apparel coverage.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: SKIMS-gross-margin-input-cost-sensitivity
    missingEvidence: >-
      SKIMS has not disclosed COGS, gross margin, or raw-material sourcing mix. No public proxy data is available for
      precisely its product mix.
    whyItMatters: >-
      Input cost volatility (cotton, synthetics) can significantly compress margins; without gross margin data,
      sensitivity analysis is speculative.
    diligencePath: >-
      Request SKIMS CFO-level disclosure of gross margin and material sourcing split; benchmark against public comps
      Hanesbrands, PVH, and lululemon.
    relatedQuestionRefs:
      - QM027
  - type: stale
    severity: minor
    topic: celebrity-brand-market-saturation-metrics
    missingEvidence: >-
      Quantitative consumer survey data on celebrity-brand fatigue in intimate apparel is not available as of June 2026
      from public sources.
    whyItMatters: >-
      Saturation risk is cited qualitatively in trade press but has not been validated with consumer purchase-intent
      data.
    diligencePath: >-
      Commission a consumer survey or obtain NRF / Circana consumer sentiment data on celebrity brand purchase drivers
      for 2025–2026.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: skims-revenue
    missingEvidence: >-
      Audited or management-disclosed SKIMS revenue breakdown by category (shapewear vs. intimates vs. activewear),
      gross margin, and EBITDA for FY2024 and FY2025.
    whyItMatters: >-
      Revenue mix drives valuation methodology; a $5B valuation implies a ~5x revenue multiple on ~$1B net sales, which
      requires category-level margin justification.
    diligencePath: >-
      Request detailed P&L from SKIMS management in a diligence data room; cross-check against any S-1 or IPO filing if
      SKIMS has progressed toward a public offering by mid-2026.
    relatedQuestionRefs:
      - QP007
      - QP010
  - type: stale
    severity: material
    topic: spanx-revenue
    missingEvidence: >-
      Spanx's current annual revenue and EBITDA for FY2025 or FY2026; the $400M estimate from Wikipedia is from pre-2021
      Forbes reporting and is likely outdated.
    whyItMatters: >-
      A stale Spanx revenue figure makes any SKIMS/Spanx revenue comparison imprecise; Blackstone's post-2021 capital
      investment may have grown the business materially.
    diligencePath: >-
      Contact Blackstone investor relations or search for any Blackstone portfolio company disclosures referencing Spanx
      FY2024/2025 revenue.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: savage-x-fenty-funding
    missingEvidence: >-
      Savage X Fenty's most recent round (any 2023, 2024, or 2025 funding), current valuation, and whether the reported
      $3B IPO target remains active or has been abandoned.
    whyItMatters: >-
      Savage X Fenty's financial trajectory is the clearest comparable for a celebrity-founded intimates brand at scale;
      knowing its current state informs SKIMS' strategic risk assessment.
    diligencePath: >-
      Check Crunchbase, PitchBook, and LVMH investor disclosures for any post-2022 Savage X Fenty funding; search press
      for any 2025-2026 IPO or M&A activity.
    relatedQuestionRefs:
      - QP010
      - QP020
  - type: missing-source
    severity: minor
    topic: skims-product-quality
    missingEvidence: >-
      Independent consumer review aggregators (Trustpilot, Reddit, RetailMeNot) showing SKIMS vs. Spanx product quality
      ratings, return rates, and sizing complaints over a 12-month period.
    whyItMatters: >-
      Product quality and sizing accuracy are key repeat-purchase drivers; adverse consumer sentiment could erode the
      brand moat faster than competitor moves.
    diligencePath: >-
      Pull consumer ratings from Nordstrom product pages, Reddit r/Skims, and independent review platforms; request
      SKIMS' NPS and return rate data in diligence.
    relatedQuestionRefs:
      - QP018
  - type: enumeration-incomplete
    severity: minor
    topic: market-share
    missingEvidence: >-
      US market share data specifically for the shapewear sub-category (not overall lingerie) broken down by brand,
      showing SKIMS' captured share versus Spanx and VS shapewear.
    whyItMatters: >-
      Shapewear-specific share data would confirm or challenge the narrative that SKIMS has overtaken Spanx in shapewear
      and is on a path to category leadership.
    diligencePath: Source NPD Group or Circana retail panel data for US women's shapewear market share by brand for FY2023-2025.
    relatedTableRefs:
      - TP001
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited P&L for FY2023 and FY2024, including gross revenue, COGS, gross margin, operating expenses by line, and
      GAAP net income.
    whyItMatters: >-
      All margin and profitability figures are analyst-estimated or company-claimed. Without audited financials,
      investors cannot verify the $190M net profit claim, the 50–62% gross margin estimate, or the 23%+ EBITDA margin,
      and cannot underwrite capital adequacy for the aggressive retail expansion.
    diligencePath: >-
      Request audited or CPA-reviewed financial statements from management under NDA as part of the due-diligence
      process.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Consolidated balance sheet showing cash and equivalents, revolving credit facilities, aggregate lease liabilities,
      and working capital position as of the most recent quarter.
    whyItMatters: >-
      The physical-retail pivot to 18+ US stores and planned flagships in London, Dubai, Seoul, Hong Kong, and other
      markets creates substantial fixed-cost obligations. Without a balance-sheet view, runway cannot be assessed and
      the adequacy of the $225M Series D for the stated expansion program cannot be independently verified.
    diligencePath: >-
      Request unaudited quarterly cash flow statements and treasury position, plus a schedule of lease obligations by
      location.
    relatedQuestionRefs:
      - QI011
      - QI010
      - QI015
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: channel-revenue-split
    missingEvidence: >-
      Revenue breakdown by channel (DTC e-commerce, wholesale, owned physical retail, NikeSkims JV) with associated
      contribution margins.
    whyItMatters: >-
      DTC, wholesale, and physical retail carry materially different margin profiles. Without channel-level data, the
      blended gross margin estimate (50–62%) cannot be decomposed, and the impact of the retail pivot on consolidated
      margins cannot be modeled.
    diligencePath: >-
      Request management accounts with segmented revenue and contribution margin by channel for at least two fiscal
      years.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: nikeskims-jv-economics
    missingEvidence: >-
      NikeSkims joint venture P&L, revenue recognition policy, inventory ownership, and SKIMS-allocated net income or
      royalty.
    whyItMatters: >-
      NikeSkims is a marquee commercial program with growing distribution; its contribution to SKIMS revenue and margin
      is wholly opaque. Revenue recognition between partners could inflate or deflate SKIMS's gross revenue depending on
      whether it records gross or net.
    diligencePath: >-
      Request the JV agreement and any side-letter economics; request SKIMS-specific P&L allocation from the Nike
      relationship.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: material
    topic: store-level-economics
    missingEvidence: >-
      Four-wall EBITDA, revenue per square foot, and payback period for at least three mature SKIMS physical-retail
      locations.
    whyItMatters: >-
