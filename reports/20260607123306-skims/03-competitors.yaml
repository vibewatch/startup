callouts:
  - calloutType: strength
    title: Celebrity Brand Moat Is Currently Unmatched in Shapewear
    body: >
      No direct shapewear competitor combines Kim Kardashian's 272M+ Instagram following, a multiyear NBA/Olympics
      partnership suite, and a luxury-brand collaboration history (Fendi, D&G, The North Face). The NikeSkims
      launch in September 2025 adds Nike's global athletic credibility, creating a compound moat that would take
      incumbents years and hundreds of millions in partnership spend to replicate.
    claimRefs: [CP025, CP026, CP034]

  - calloutType: risk
    title: Commoditization Risk Is Accelerating in 2026
    body: >
      The February 2026 entry of Layer Zero shapewear at Costco — explicitly positioned as a "Skims-like" product at
      lower prices — is the clearest evidence yet that the category's functional job-to-be-done is being commoditized.
      Combined with size-inclusivity improvements across Aerie, VS, and Spanx, SKIMS' ability to extract a
      sustained price premium depends primarily on brand equity rather than product differentiation.
    claimRefs: [CP037, CP027, CP028, CP035]

  - calloutType: risk
    title: Savage X Fenty's Leadership Instability Is an Adjacent Cautionary Signal
    body: >
      Savage X Fenty replaced founder-CEO Rihanna in June 2023, settled a $1.2M consumer-protection lawsuit over its
      VIP subscription program, and did not execute the widely reported $3B IPO. This trajectory — founder step-back,
      legal exposure, delayed liquidity — represents one plausible adverse path for celebrity-founder intimates brands
      that fail to develop institutional management depth before scaling. SKIMS' co-founder structure (Kim Kardashian,
      Jens Grede, Emma Grede) and its professional management team provide more institutional depth than Savage X Fenty had.
    claimRefs: [CP010, CP011, CP012, CP013, CP038]

  - calloutType: insight
    title: Victoria's Secret's Decline Created the Market Opening SKIMS Exploited
    body: >
      Victoria's Secret's market share in intimate apparel peaked at approximately one-third of the US market in 2013.
      Its failure to adapt to size inclusivity and the athleisure shift created the white space that allowed both
      SKIMS and Aerie to grow rapidly in the late 2010s. VS's ongoing revenue decline (to $2.27B in fiscal 2025,
      well below its $7B+ peak) confirms the permanence of the disruption, not its reversal.
    claimRefs: [CP007, CP008, CP009, CP035]

