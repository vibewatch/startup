figures:
  - id: FP001
    title: Competitive Positioning Map — Shapewear / Intimates
    type: quadrant
    layout: standard
    summary: >
      Plots nine major competitors on two ordinal axes: size inclusivity (1=limited sizing, 5=broadest range) and
      brand/cultural equity (1=institutional/utility, 5=pop-culture icon). SKIMS and Savage X Fenty occupy
      the high-equity, high-inclusivity quadrant; Victoria's Secret and Spanx sit in the high-equity,
      moderate-inclusivity quadrant; ThirdLove and Wacoal are high-inclusivity but lower brand equity;
      Hanesbrands is low on both axes.
    data:
      points:
        - label: "SKIMS"
          x: 5
          y: 5
          detail: "XS–5X range; Kim Kardashian 272M+ Instagram; NBA/Olympics partnerships; NikeSkims"
          tone: positive
        - label: "Savage X Fenty"
          x: 5
          y: 4
          detail: "32A–46H+ range; Rihanna brand equity; DTC-first with 7 retail stores"
          tone: positive
        - label: "Victoria's Secret"
          x: 3
          y: 4
          detail: "Expanding to broader sizes; VS Collective celebrities; 1,420 stores but declining share"
          tone: warning
        - label: "Aerie"
          x: 4
          y: 3
          detail: "#AerieREAL no-retouch campaign; 175+ stores; community-driven positioning"
          tone: neutral
        - label: "Spanx"
          x: 3
          y: 3
          detail: "XS–3X range; pioneer brand; Blackstone-backed; limited celebrity anchor"
          tone: neutral
        - label: "ThirdLove"
          x: 5
          y: 2
          detail: "30AA–46H half-cup sizes; FitFinder algorithm; DTC-only; smaller scale"
          tone: neutral
        - label: "Lululemon"
          x: 2
          y: 3
          detail: "Premium activewear overlap; limited size range in intimates; $10.6B revenue"
          tone: warning
        - label: "Wacoal"
          x: 4
          y: 2
          detail: "Multiple full-figure sub-brands; dept-store channel focus; limited brand cachet"
          tone: neutral
        - label: "Hanesbrands/Gildan"
          x: 2
          y: 1
          detail: "Mass-market basics; acquired by Gildan 2025; no fashion brand positioning"
          tone: neutral
    approximationNotes: >
      Axes are ordinal (1–5). x-axis = size inclusivity range (1=XS-XL only, 5=XXS-5X or 30A-54K+).
      y-axis = brand/cultural equity (1=utility/institutional, 5=pop-culture icon).
      Scores are evidence-backed analyst assessments; size scores based on stated ranges on official brand websites
      as of June 2026; brand equity scores synthesize social following, celebrity founder presence, and media coverage.
    claimRefs: [CP001, CP004, CP010, CP014, CP017, CP019, CP022, CP032, CP037]

