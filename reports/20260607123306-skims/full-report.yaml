    SKIMS is a Los Angeles-based private apparel and lifestyle company launched in 2019 around a solutions-oriented
    shapewear proposition and then expanded into underwear, loungewear, swimwear, menswear, beauty adjacency, and
    performance apparel. The company combines Kim Kardashian’s audience reach and brand heat with Jens Grede’s fashion
