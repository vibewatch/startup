  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Base Profile
        blocks:
          - type: paragraph
            body: >
              SKIMS's core customer is a brand-aware woman aged 18–45 who discovers the product through social media,
              celebrity endorsement, or editorial coverage and purchases primarily via the DTC e-commerce channel. The
              brand's size-inclusive range—XXS through 4X across underwear, shapewear, loungewear, and swim—deliberately
              widens the addressable audience beyond narrow-fit competitors, and the Good Housekeeping Institute
              confirmed product availability across this full range during controlled testing. A secondary and
              fast-growing segment is men: the men's underwear, loungewear, and basics category launched in August 2023
              and is actively promoted through the NikeSkims collaboration and through the brand's NBA, WNBA, and NFL
              official-partner status. Geographically, the customer base is U.S.-centric—the company operates 18 owned
              U.S. stores and two Mexico franchise units—but international acquisition is accelerating through luxury
              wholesale (Selfridges UK, SSENSE Canada/EU, Net-A-Porter global) and planned first-party Asian stores in
              Hong Kong and Seoul. A fourth identifiable segment is the celebrity-follower cluster: consumers whose
              brand loyalty is explicitly tied to Kim Kardashian's personal platform, representing both a
              rapid-acquisition engine and a structural concentration risk.
