      - number: '7.3'
        title: Supply Chain, Labor, and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              SKIMS does not publicly disclose its manufacturing partners, country of origin, or supplier audit
              methodology. The company's rapid scale-up from a direct-to-consumer shapewear brand to a multi-category
              global retailer with menswear, activewear, and beauty has expanded the supplier base without a
              corresponding increase in publicly visible supply-chain governance. The California Transparency in Supply
              Chains Act (SB 657) mandates that California-based retailers with annual worldwide gross receipts
              exceeding $100 million disclose supply-chain due-diligence efforts in five areas: verification, audits,
              certification, internal accountability, and training. SKIMS has crossed the revenue threshold referenced
              in this law and is required to publish supply-chain disclosures on its website. No specific supply-chain
              disclosure document was located on SKIMS.com during research; a gap here would constitute a compliance
              deficiency.

              The Uyghur Forced Labor Prevention Act (UFLPA), signed December 2021 and effective June 2022, creates a
              rebuttable presumption that goods manufactured wholly or in part in Xinjiang, China are made with forced
              labor and are therefore importation-prohibited. CBP actively enforces the UFLPA Entity List. Apparel and
              textile sourcing from China — particularly cotton and elastane supply chains — carries inherent UFLPA
              scrutiny risk. If SKIMS sources from any Xinjiang-adjacent Chinese mills or entities on the UFLPA Entity
              List, shipments could be detained or excluded, causing inventory disruption and reputational harm. The
              DOL's FLSA governs warehouse and fulfillment-center labor, and the CFPB complaint database records
              consumer financial product issues; both represent standing regulatory monitoring obligations. Labor
              compliance in SKIMS's warehouses (18 U.S. stores, international franchise locations) and third-party
              logistics providers also needs active monitoring under FLSA overtime and minimum wage requirements.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
          - type: table
            tableRef: TR002
            claimRefs: []
      - number: '7.4'
        title: Partner and Counterparty Dependence Risk
        blocks:
          - type: paragraph
            body: >-
              SKIMS's most visible partnership is NikeSkims, announced in July 2024 as an activewear collaboration
              between Nike, Inc. and SKIMS. Nike.com/NikeSKIMS and the About Nike newsroom confirm the collaboration.
              WWD tag coverage documents sequential NikeSkims drops in late 2025 and early 2026, including a first-ever
              sneaker (Air Rift Mesh) and a Paris pop-up in February 2026. The collaboration is structurally important
              because it extends SKIMS into the athletics and footwear categories that it could not credibly occupy
              organically. However, this creates a material counterparty dependency: Nike's strategic priorities, brand
              posture, or financial condition could alter the scope, duration, or marketing commitment to the
              partnership. Nike's own declining revenue and brand-heat challenges in 2024–2025 add risk to this
              dependency.

              SKIMS is also the official underwear partner of the NBA, WNBA, Team USA, and the U.S. Paralympic Team.
              These partnerships provide cultural legitimacy and access to sports audiences, but they are contractual
              agreements subject to renewal, renegotiation, or cancellation. A high-profile NBA or WNBA conduct
              controversy that implicates SKIMS brand association could generate undesired brand adjacency risk.

              Wholesale distribution through Nordstrom provides scale and reach but concentrates sales risk in a channel
              that SKIMS does not fully control. Nordstrom's own strategic decisions (private equity buyout, store
              rationalization) and terms of any wholesale agreement govern shelf space allocation. Goldman Sachs
              Alternatives led the November 2025 Series D round, creating institutional investor influence over
              corporate governance in the run-up to any future IPO process; a cooling in institutional appetite for
              consumer-brand IPOs could pressure SKIMS toward an unfavorable listing window.
            claimRefs:
              - CR020
              - CR021
