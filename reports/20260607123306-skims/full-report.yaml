      - number: '1.4'
        title: Scale Metrics, Retail Footprint, and Distribution
        blocks:
          - type: paragraph
            body: |
              SKIMS does not publish audited financial statements. Revenue and profitability figures
              below draw on third-party analyst estimates and company-issued statements and should be
              treated as unverified. Sacra estimates 2023 revenue at $750 million (approximately 50%
              year-over-year growth from $500 million in 2022 and $145 million in 2020). CEO Jens Grede
              publicly announced an estimated $190 million net profit for 2023. The company expects to
              exceed $1 billion in net sales in 2025, a figure cited in the official Series D press
              release. The implied forward revenue multiple at the $5 billion Series D valuation is
              approximately 5x. Headcount and gross margins are not publicly disclosed.

              As of the Series D announcement in November 2025, SKIMS operated 18 owned U.S. retail
              stores and 2 franchise locations in Mexico. U.S. locations include New York, Los Angeles,
              Georgetown, Aventura, Austin, Houston, Atlanta, Boca Raton, Paramus, Las Vegas, Bloomington,
              Palo Alto, and Tysons, among others. The first permanent store opened in Washington, D.C.
              in 2024 after testing the market with pop-up shops. The Chicago Gold Coast flagship (6,500
              sq ft, two floors, on Rush Street) opened in February 2026. An inaugural Middle East store
              at Mall of the Emirates in Dubai opened in December 2025 via franchise partner Al Tayer
              Insignia. A 12,000 sq ft London Regent Street flagship (10-year Crown Estate lease at
              245–247 Regent Street) is scheduled to open in summer 2026.

              Online, Sacra estimates skims.com generated approximately $527 million in gross merchandise
              value in 2024, with 40% of site traffic originating outside the United States. More than
              11 million consumers have signed up for SKIMS product restock alerts. Retail partnerships
              include Nordstrom (with branded pop-up shops), Selfridges and Harrods in the UK, Galeries
              Lafayette in Paris, and Stockmann across Finland, Estonia, and Latvia. Customer-satisfaction
              data from Trustpilot rates SKIMS "Average" at 3.5 out of 5, with recurring complaints
              about customer service, refund delays, and quality inconsistencies at the brand's
              accessible price points.
