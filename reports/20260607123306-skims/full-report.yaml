      - number: '7.2'
        title: Brand, Reputation, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              SKIMS has survived multiple reputational controversies, but each one exposed the gap between brand equity
              and institutional defensibility. The 2019 launch was originally titled "Kimono" — a name that prompted
              immediate backlash for cultural appropriation from Japanese media, government officials, and consumer
              advocates and forced a rebranding to SKIMS before the product shipped. The incident demonstrated that the
              brand's identity rests partly on cultural borrowing with limited safeguards, and that founder instinct
              rather than institutional review governs naming and creative decisions.

              A 2024 UK incident — in which a lorry carrying SKIMS shipments was found to contain a cocaine consignment
              — generated coverage in British tabloids and local news, raising supply chain integrity concerns. While
              SKIMS was identified as the cargo owner and not a participant in the smuggling operation, the episode
              illustrates the brand's exposure to third-party logistics misconduct and its potential to generate adverse
              press regardless of culpability.

              The FTC's Endorsement Guides require clear and conspicuous disclosure of material connections in all
              sponsored social content. SKIMS relies heavily on influencer marketing and celebrity seeding, and the
              brand's exposure to enforcement risk is non-trivial given that its founder herself was already charged by
              the SEC for undisclosed paid promotion. A future FTC investigation targeting undisclosed SKIMS influencer
              payments could carry civil penalties and reputational damage. Consumer review aggregators (SmartCustomer,
              Sitejabber) show SKIMS customer-facing scores well below category averages, partly driven by complaints
              about return fees and quality, which create an adverse social media feedback loop that undercuts brand
              aspiration.
            claimRefs:
              - CR008
              - CR009
              - CR010
