      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |
              SKIMS has two co-founders in active leadership. Kim Kardashian serves as Co-Founder and
              Chief Creative Officer (CCO), directing product development and brand creative strategy.
              Her role leverages a reported 354 million Instagram followers and 72 million X followers,
              making her social-media reach a core customer-acquisition channel. Jens Grede, her
              co-founder, serves as Chief Executive Officer (CEO). Grede previously co-founded the
              creative agency Bureau Betak and the denim brand Frame, giving him relevant fashion
              industry experience alongside operations and investor relations responsibilities.

              Beyond the founding pair, SKIMS has been building out its senior leadership team to
              support rapid international expansion. In August 2025 the company appointed Robin Gendron
              as its first President, EMEA, a newly created role. Gendron brought 11 years at Michael
              Kors (most recently as EMEA President) to a mandate encompassing standalone stores in
              London and Dubai, a first EMEA regional warehouse, and localization of skims.com for
              European markets. Separately, Diarrha N'Diaye-Mbaye—founder of inclusive beauty brand
              Ami Colé—was named EVP Beauty and Fragrance, charged with building a SKIMS beauty
              and fragrance vertical expected to launch in 2026 following the acquisition of Skkn by Kim.

              Corporate governance is opaque. SKIMS is private and does not file with the SEC or
              disclose board composition or financial audits. No independent board members are publicly
              named. All major strategic announcements flow through company press releases or media
              statements by Kim Kardashian or Jens Grede. This creates a significant due-diligence
              limitation for prospective investors and counterparties. The concentration of brand
              equity in Kim Kardashian personally represents a well-documented key-person risk.
            claimRefs:
