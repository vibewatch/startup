          - type: callout
            title: Inclusive Sizing as a Structural TAM Expander
            body: >
              SKIMS' XS-to-5X size architecture captures a buyer pool that traditional shapewear incumbents have
              systematically under-served. By offering the broadest standardized size range in the premium intimate
              apparel tier, SKIMS converts a demographic constraint into a competitive moat. This is not replicable
              overnight by legacy brands whose supply chains, fit models, and wholesale assortments are built around
              standard sizing.
            calloutType: strength
            claimRefs:
              - CM013
              - CM015
              - CM016
          - type: callout
            title: DTC-to-Physical Pivot Signals Maturing Phase
            body: >
              SKIMS' stated goal of becoming "predominantly physical" signals that the brand has extracted what it can
              from the DTC growth phase and is now building the distribution infrastructure for a larger,
              wholesale-plus-retail business model. This trajectory mirrors the arc of Lululemon and Warby Parker. The
              15-store base as of early 2026 is still sub-scale versus the stated ambition, and the coming 12–18 months
              of new-store performance data will be a critical signal for whether physical economics match the DTC
              model.
            calloutType: insight
