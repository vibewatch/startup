  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Key-Person and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              SKIMS was co-founded and is publicly identified by Kim Kardashian as Chief Creative Officer. The brand's
              Instagram following, earned-media coverage, and consumer aspirational value are inseparable from her
              personal celebrity. Wikipedia records her as one of the most-followed individuals globally and a central
              driver of the Kardashian-Jenner business empire. Sacra estimates that Kardashian personally generates a
              material share of SKIMS's earned-media value in each quarter through social-media posts, television
              appearances, and editorial coverage — a level of concentration that would be difficult to replicate with
              paid marketing at comparable cost. Any reputational damage to Kardashian translates almost immediately
              into brand exposure for SKIMS.

              The SEC's October 2022 enforcement action against Kardashian — a $1.26 million settlement for touting the
              EthereumMax crypto token on Instagram without disclosing a $250,000 promotional payment — demonstrates
              that her public conduct creates regulatory liability and headline risk. The SEC order required her to
              cooperate with an ongoing investigation and barred her from promoting crypto asset securities for three
              years, a restriction that expired in October 2025 but that set a precedent for FTC and SEC scrutiny of
              influencer disclosures broadly. The FTC's 2023-revised Endorsement Guides explicitly require material
              connection disclosures across celebrity-backed product promotions, creating a standing compliance
              obligation for SKIMS's own marketing.

              Governance opacity compounds key-person risk. SKIMS has not published audited financial statements, board
              composition, or succession plans. UK Companies House filings for SKIMS UK International confirm a
              subsidiary structure, but the parent company's ownership, governance arrangements, and related-party
              transactions remain undisclosed. There is no public independent board, no disclosed COO succession path,
              and no announced leadership pipeline to reduce founder dependency. CEO Jens Grede's operational profile is
              lower than Kardashian's public presence, meaning that in a scenario where Kardashian steps back, brand
              credibility is at material risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
