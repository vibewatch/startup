  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              SKIMS competes across three overlapping battlegrounds: (1) shapewear, where Spanx is the entrenched
              incumbent and Layer Zero/Costco private-label products represent the commoditization threat; (2)
              intimates/lingerie, where Victoria's Secret (NYSE: VSXY) dominates on store count and brand awareness
              while Savage X Fenty and Aerie challenge on inclusivity and cultural relevance; and (3) activewear, where
              Lululemon ($10.6B revenue, fiscal 2024) commands premium territory and NikeSkims — a joint operation with
              Nike launched September 2025 — now positions SKIMS as a legitimate activewear contender.


              The incumbent cluster (Victoria's Secret, Spanx, Wacoal, Hanesbrands) controls the majority of
              department-store shelf space and benefited from decades of wholesale relationships. Victoria's Secret's
              market share in intimate apparel peaked at approximately one-third of the US market in 2013 and has eroded
              meaningfully since, pressured by brand controversies, the athleisure shift, and the rise of body-positive
              challenger brands. Spanx, now majority-owned by Blackstone at a $1.2 billion valuation, remains the
              closest category analogue to SKIMS in shapewear but lacks comparable celebrity gravity and has a narrower
              size range (XS–3X vs. SKIMS XS–5X). 


              DTC challengers (Savage X Fenty, ThirdLove, Aerie's digital channel) share SKIMS' size-inclusivity
              positioning but diverge in brand architecture: Savage X Fenty is primarily lingerie and leans heavily into
              Rihanna's entertainment persona; ThirdLove is fit-technology driven (half-cup sizes, FitFinder quiz) and
              is a much smaller business (~$68M total raised, no reported unicorn valuation); Aerie is a sub-brand of
              the publicly traded American Eagle Outfitters ($5.26B revenue in fiscal 2023) with 175+ standalone stores
              and an established retail estate. Lululemon serves as both an adjacent competitor and a strategic
              benchmark — its community-driven premium brand and $10.6B revenue base demonstrate the long-run upside of
              winning in premium athleisure.


              Adjacent substitutes include value-priced mass-market options available at Walmart, Target, Amazon, and
              now Costco, as well as unbranded "dupes" sold through TikTok Shop and fast-fashion retailers. The February
              2026 launch of Layer Zero (by the founder of 32 Degrees) offering Skims-like shapewear at Costco pricing
              represents a concrete commoditization signal: the core shapewear job-to-be-done can be fulfilled at a
              fraction of SKIMS' price point, and category-wide inclusivity improvements reduce SKIMS' differentiation
              on that dimension alone.
