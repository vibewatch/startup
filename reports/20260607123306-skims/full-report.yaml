      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Concentrated Key-Person Risk: Kim Kardashian'
            body: >-
              SKIMS' brand equity, customer acquisition economics, and cultural relevance are heavily anchored to Kim
              Kardashian's personal platform. With 354 million Instagram followers and 72 million X followers,
              Kardashian functions as the primary marketing channel, significantly reducing paid customer-acquisition
              costs compared with traditional apparel brands. Any material reputational event, health issue, or
              reduction in her social-media engagement could structurally impair the brand's demand generation and
              require costly alternative marketing investment. This risk intensifies as SKIMS opens physical stores
              globally where foot traffic depends on sustained brand awareness independent of any single spokesperson.
            calloutType: risk
            claimRefs:
              - CO036
              - CO052
          - type: callout
            title: '$5 Billion Valuation in Six Years: Execution Velocity'
            body: >-
              Reaching a $5 billion private-market valuation six years after a DTC shapewear launch is exceptional.
              SKIMS grew from approximately $145 million in 2020 revenue to a projected $1 billion-plus in 2025—a
              roughly 7x increase in five years—while remaining profitable at an estimated $190 million net income in
              2023. The brand has successfully broadened from a single shapewear SKU family to a multi-category apparel
              platform, secured institutional backing from Goldman Sachs and other top-tier investors, and landed a
              co-branding partnership with Nike. This combination of revenue growth, profitability (company-claimed),
              category expansion, and blue-chip investor confidence constitutes a strong execution track record for a
              six-year-old privately held brand.
            calloutType: strength
            claimRefs:
              - CO009
              - CO013
              - CO015
              - CO017
