      - number: '2.2'
        title: 'Market Sizing: Competing Estimates and Multi-Lens TAM'
        blocks:
          - type: paragraph
            body: >
              The most granular addressable market for SKIMS is shapewear. Grand View Research pegged the global
              shapewear market at USD 2.73 billion in 2024 and projected 8.0% CAGR to USD 4.32 billion by 2030. Mordor
              Intelligence estimated the same 2024 base at USD 2.36 billion— roughly 14% lower—with a more cautious
              4.91% CAGR that yields USD 3.15 billion by 2030. The two forecasts produce a USD 1.17 billion spread in
              2030 outcomes from a roughly $370 million difference in the starting base. Neither firm publishes a
              methodology that reconciles these differences, and neither has been independently audited.


              A broader intimate apparel frame, as measured by Verified Market Research, values the global intimate
              apparel market at USD 16.20 billion in 2025, expanding to USD 28.40 billion by 2033 at a 6.5% CAGR. This
              frame encompasses bras, panties, sleepwear, shapewear, and thermal clothing—the full sweep of SKIMS'
              non-athletic product line.


              The widest reasonable frame is athleisure, where SKIMS competes via its activewear lines and the NikeSKIMS
              collab. Grand View Research placed the athleisure market at USD 422.04 billion in 2025, growing at 9.9%
              CAGR to USD 892.48 billion by 2033. Verified Market Research placed the same market at USD 447.7 billion
              in 2024, growing at 7.8% CAGR to USD 773.32 billion by 2032—a gap of roughly USD 25 billion in base and
              2.1 percentage points in CAGR. The contradictions across all three sizing frames are documented in Table
              TM002 and underscore why any single TAM reference carries substantial uncertainty.


              For practical diligence, SKIMS' SAM can be bounded by its existing geographic reach (predominantly US,
              growing in UK, Europe, Middle East) and its actual product mix. US Census data confirms that non-store
              (e-commerce) retail for clothing and accessories continues to grow as a share of total apparel spend,
              reinforcing the structural tailwind for DTC-heavy brands like SKIMS.
