      - number: '2.6'
        title: Contradictions Across Estimates and Sizing Gaps
        blocks:
          - type: paragraph
            body: >
              The most actionable diligence finding from this market analysis is the irreconcilable disagreement among
              analyst firms. On shapewear alone, the GVR and Mordor Intelligence 2024 base estimates differ by $370
              million—a 14% spread—and their 2030 forecasts diverge by $1.17 billion. On athleisure, GVR and VMR differ
              by $25 billion on the 2024 base. None of these firms publishes a reconcilable methodology, and their
              category-inclusion boundaries are not transparently defined.


              This matters for SKIMS' valuation because the common investor practice of applying a market-share
              percentage to a TAM figure produces very different outcomes depending on which TAM is used. A 10% share of
              the $2.73B shapewear-only market yields $273M in revenue; the same share of the $16.2B intimate apparel
              market yields $1.62B. Investor decks frequently cherry-pick the most favorable frame. The honest sizing
              path for SKIMS is to use the narrow shapewear base as a floor, add adjacent revenue from loungewear and
              basics (separately estimated), and acknowledge that any athleisure-frame TAM includes competitors 50–200x
              SKIMS' size.


              Additional gaps include: (1) no public data on SKIMS' DTC-to-wholesale revenue split, making channel-mix
              modeling speculative; (2) no reliable independent estimate of the US plus-size intimate apparel market as
              a standalone dollar figure; (3) no public SKIMS COGS or gross margin data to ground input-cost sensitivity
              analysis. These gaps are structural for a private company and would only be resolved via a prospectus or
              direct management disclosure.
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM040
              - CM039
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Conflicting Market Size Estimates Undermine TAM-Based Valuation
            body: >
              Grand View Research and Mordor Intelligence disagree on the 2024 global shapewear market base by 14%
              ($370M) and project CAGR outcomes 3.1 percentage points apart, yielding a $1.17 billion spread in 2030
              forecasts. Any investor model anchoring SKIMS' valuation to a single analyst estimate is building on a
              contested base. The most defensible approach is to use the shapewear market as a floor, bound it with the
              broader intimate apparel frame, and stress-test projections against both the low and high CAGR scenarios.
            calloutType: risk
            claimRefs:
              - CM034
