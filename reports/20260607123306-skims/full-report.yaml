              The $5 billion round frames SKIMS as a late-stage branded-apparel asset rather than a venture software
              company. Sacra states that the valuation implies roughly 5x projected 2025 sales, and Reuters/US News
              reports PitchBook commentary that the Goldman-led round strengthens the IPO case. Public comparables are
              sobering. Nike and Lululemon market-data pages show much lower price-to-sales or ratio levels than SKIMS
