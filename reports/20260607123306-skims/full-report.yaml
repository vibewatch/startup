  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and channel mix
        blocks:
          - type: paragraph
            body: >-
              SKIMS generates revenue across three primary channels: direct-to-consumer e-commerce via skims.com,
              wholesale placements at premium retail partners (Nordstrom, Saks Fifth Avenue, Net-a-Porter, Selfridges,
              and Stockmann), and a growing physical-retail network that opened its first permanent door in 2024. The
              DTC channel has historically been the revenue engine — the company operates a drop-driven scarcity model
              that generates sell-outs and restock waitlists, with more than 11 million customers signed up for restock
              alerts as of the Nov 2025 funding announcement. Sacra estimates the skims.com platform generated
              approximately $527 million in gross merchandise value in 2024 alone. The company's full-year 2023 net
              revenue of $750 million (50% year-over-year growth from $500 million in 2022) and its trajectory toward
              surpassing $1 billion in net sales in 2025 underpin investor confidence at the current valuation.

              Product-line diversification has expanded the revenue surface meaningfully. The core shapewear and
              underwear assortment (priced predominantly at $30–$100 per item, with some premium pieces up to $180)
              remains the primary demand driver, now augmented by loungewear, swimwear, and a menswear category launched
              in late 2023. The NikeSkims activewear joint venture — debuted in September 2025 across 58+ silhouettes
              and now spanning footwear — adds an additional channel through Nike.com and Nike retail locations,
              effectively expanding distribution without requiring SKIMS-owned capital expenditure. A forthcoming beauty
              and fragrance line (via the acquisition of SKKN by Kim from Coty and the appointment of a new EVP Beauty &
              Fragrance) will add another revenue stream beginning in 2026, though financial terms of the Coty stake
              acquisition were not disclosed publicly. The wholesale and physical-retail channels provide brand
              credibility and new-customer acquisition, but channel-level revenue breakdowns, take rates, and gross
              margin by stream are not publicly disclosed, making the precise revenue mix an open diligence variable.
