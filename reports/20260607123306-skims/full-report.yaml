  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Architecture
        blocks:
          - type: paragraph
            body: >
              SKIMS competes across four overlapping apparel segments: shapewear, intimate apparel (underwear, bras,
              loungewear), activewear, and—through its 2024 NikeSKIMS collaboration— performance athleticwear. The
              narrowest frame is the pure shapewear market, a sub-segment focused on body-contouring undergarments that
              compress, shape, or smooth the silhouette. Broader frames include all intimate apparel (bras, panties,
              shapewear, sleepwear) and athleisure, which blurs athletic function with casual fashion.


              The status-quo substitutes for SKIMS are traditional department store brands (Spanx, Wacoal, Hanesbrands,
              Jockey) and fast-fashion intimates (Victoria's Secret, Aerie). In the loungewear and basics tier, primary
              alternatives are generic-label underwear at Walmart or Target and mid-market offerings from American
              Eagle/Aerie and Calvin Klein. For activewear, Lululemon, Nike, and Adidas are incumbents. SKIMS sits above
              the mass market but below ultra-luxury, occupying a premium-accessible tier.


              Category adjacencies that expand SKIMS' SAM include plus-size and extended-size apparel (historically
              underserved), men's basics and shapewear (a fast-growing sub-segment), and performance bodywear (the
              NikeSKIMS vector). Each adjacency carries different buyer profiles, distribution norms, and margin
              structures. The market boundary matters for valuation because framing SKIMS as "shapewear" implies a $2–3B
              TAM, while framing it as "intimates + athleisure" implies a TAM an order of magnitude larger.
            claimRefs:
              - CM039
              - CM014
              - CM016
              - CM018
              - CM027
          - type: table
            tableRef: TM001
            claimRefs:
