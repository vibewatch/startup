              growth and stronger brand pricing power. SEC submission feeds and company investor pages confirm that
              these peers are public filers with audited disclosures, making their lower multiples more informative than
              private-round headlines. A fair SKIMS entry framework should therefore triangulate three lenses: 2x to 3x
