      - number: '1.5'
        title: Milestones, Partnerships, and Adverse Events
        blocks:
          - type: paragraph
            body: |
              SKIMS' trajectory from 2019 launch to $5 billion brand in six years is underscored by
              a dense event chronology. Key milestones include the forced 2019 rebrand from Kimono
              Intimates (adverse), back-to-back funding events in 2021 and 2023, a confidential IPO
              filing in July 2023 (later abandoned), and the November 2025 Series D.

              Strategic partnerships have been central to growth acceleration. The July 2023 multi-year
              agreement with the NBA, WNBA, and USA Basketball as official underwear partner provided
              mass-market sports exposure. Far larger in scope, the February 2025 announcement of
              NikeSkims—described as the first time Nike has co-created an entirely new brand with an
              external partner—and the September 2025 launch (initial collection sold out within hours)
              represent a structural expansion into the $450+ billion global activewear market. The
              spring 2026 NikeSkims collection extended globally via Nike's distribution network across
              Europe, the Middle East, Australia, and Korea. The March 2025 acquisition of SKKN by Kim
              (from Kardashian and Coty's 20% stake) positions SKIMS to expand into beauty, skincare,
              and fragrance in 2026.

              Adverse events and risk flags include: (1) the 2019 Kimono brand controversy requiring
              immediate rebrand; (2) the NikeSkims U.S. launch delayed from spring 2025 to September
              2025 due to product-readiness issues, illustrating execution risk during rapid category
              expansion; (3) persistent customer service complaints on Trustpilot (3.5/5); (4) no
              public financial disclosures, creating governance opacity; and (5) deep brand dependency
              on Kim Kardashian's personal reach—any major reputational event affecting her could
              materially impair SKIMS' customer acquisition economics and brand positioning.
