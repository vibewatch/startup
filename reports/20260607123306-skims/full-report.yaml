  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Key-person (Kardashian) risk
        - Social media engagement rate; press tone index; SKIMS website traffic
        - >-
          >30% sustained drop in Kardashian follower engagement for 90+ days; or major personal scandal with media cycle
          >2 weeks
        - Pause capital deployment; reassess brand-independence trajectory; require brand-license audit
      - - SEC / FTC regulatory escalation
        - FTC enforcement press releases; SEC EDGAR filings mentioning SKIMS or Kardashian
        - FTC formal investigation opened or SEC formal order issued against SKIMS or Kardashian personally
        - Immediate legal review; assess penalty exposure; pause influencer campaigns
      - - NikeSkims partnership disruption
        - Nike quarterly earnings commentary on collaboration revenue and KPIs
        - Nike announces wind-down, scope reduction, or non-renewal of NikeSkims collaboration
        - Downgrade athletics-category revenue forecast; reassess total addressable market
      - - Valuation down-round signal
        - SKIMS funding announcements; secondary-market transaction data; Goldman Sachs commentary
        - New equity round priced below $5B valuation; or IPO S-1 filed with revenue below $900M
        - Reassess investment thesis; mark valuation down; await IPO pricing for market clearing
      - - UFLPA supply-chain enforcement
        - CBP UFLPA detention statistics; trade press; SKIMS customs filing notices
        - CBP detention or exclusion of SKIMS shipment under UFLPA or WRO
        - Assess sourcing-country exposure; require supplier attestation; monitor inventory disruption
      - - Customer service deterioration
        - Consumer review platform scores (SmartCustomer, Sitejabber, BBB complaint count)
        - SKIMS review score falls below 2.0 stars on major platform or BBB complaint volume exceeds 500/year
        - Require management commentary on service investment; assess churn and repeat-purchase metrics
      - - Macro demand downturn
        - U.S. Census Monthly Retail Trade (apparel and accessories category); consumer confidence index
        - Apparel retail sales growth below 0% YoY for two consecutive quarters in 2026
        - Downgrade revenue-growth assumptions; stress-test IPO valuation models at lower multiples
      - - Physical-retail over-expansion
        - SKIMS store-opening announcements; lease obligation disclosures in any future S-1
        - Store count exceeds 40 in 12 months without disclosed unit-economics breakeven target
        - Require store-level economics disclosure; assess lease-liability drag on free cash flow
    notes: >-
      Thresholds are indicative diligence triggers, not contractual or regulatory definitions. All monitoring indicators
      rely on publicly available data sources; internal metrics are not disclosed by SKIMS.
