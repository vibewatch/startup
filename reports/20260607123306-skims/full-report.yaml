      - number: '5.5'
        title: Quality, Returns, and Customer Experience
        blocks:
          - type: paragraph
            body: >
              SKIMS has a Trustpilot score of 3.5/5 from 7,042 reviews as of June 2026, an "Average" designation that
              sits below what premium-positioned brands typically achieve. The AI-generated review summary from
              Trustpilot identifies key positives (comfortable shapewear, fast delivery, responsive customer service)
              and key negatives: stitching failures after the first wash, thin or cheaply constructed materials in some
              product lines, sizing inconsistency across bra and underwear categories, and AI-driven customer service
              being perceived as unhelpful for complex issues.

              The returns system imposes a $6 domestic shipping fee for cash refunds, waived only for store credit or
              SKIMS app loyalty members. Products marked Final Sale cannot be returned. The 30-day return window is
              industry-standard but the fee structure creates friction: Trustpilot reviewers specifically cite the fee
              as a deterrent to repurchase, particularly when sizing is inconsistent and customers cannot try before
              they buy. This is a structural tension in the DTC model for apparel brands without physical try-on access.

              Customer service complaints include missing order confirmations for guest checkouts (making returns
              impossible to initiate), extended response times, and retail staff training gaps at flagship stores. These
              operational issues suggest that technology integration between e-commerce (order management), CRM, and
              in-store POS systems requires investment as SKIMS scales to 22+ stores. No FTC or CFPB enforcement actions
              against SKIMS have been located in public records; the brand's marketing compliance exposure is primarily
              around SMS opt-in management and product claim substantiation.
            claimRefs:
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
