      - number: '5.4'
        title: NikeSKIMS Joint Venture and Activewear Architecture
        blocks:
          - type: paragraph
            body: >
              NikeSKIMS, formally announced March 2024, represents SKIMS's most significant product architecture
              expansion. The joint venture combines Nike's performance-fabric IP (Dri-FIT, compression, and
              moisture-management technologies) with SKIMS's sizing philosophy, aesthetic design language, and
              inclusive-shade approach. The debut collection, delayed from a spring 2025 target to September 2025,
              launched across 7 collections and 58 silhouettes distributed via Nike.com, SKIMS.com, and select retail.
              The Spring 2026 collection expanded the line to 65+ silhouettes, added accessories (socks, waist packs,
              training gloves), and introduced two footwear styles — NikeSKIMS Rift Satin and Rift Mesh — extending the
              JV into a head-to-toe activewear suite with international distribution through Nike's infrastructure
              across Europe, the Middle East, Australia, and Korea.

              The product architecture of NikeSKIMS spans four fabric platforms: Studio Stretch (buttery-soft Dri-FIT,
              light compression), Matte (smooth sculpting with mid-level compression), Airy (breathable layered
              Dri-FIT), and Shine (sleek quick-dry). Each platform addresses a distinct performance-to- lifestyle
              occasion. This multi-platform structure allows the JV to compete across gym, studio, and lifestyle
              contexts that Lululemon, Alo Yoga, and Gymshark occupy.

              The six-month launch delay signals execution risk at the intersection of Nike's manufacturing supply chain
              and SKIMS's design/quality standards. As SKIMS scales NikeSKIMS internationally alongside 22+ U.S. stores
              and new product categories (beauty/fragrance planned for 2026), the operational surface for similar
              bottlenecks grows. The JV also creates a new IP complexity: it is unclear how patents, trademarks, and
              design rights between NikeSKIMS-branded products and standalone SKIMS products are allocated.
