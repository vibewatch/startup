      - number: '5.2'
        title: Fabric, Materials, and Sizing System
        blocks:
          - type: paragraph
            body: >
              SKIMS describes its core technology as "solutions-oriented" fabric engineering — underwear that stretches
              to twice its size, shapewear that compresses and smooths without digging in, and bras engineered for
              specific silhouette outcomes (minimizer, push-up, plunge, strapless). The company's key branding claim is
              "second-skin" stretch technology, designed to conform to body contour. No independent certifications
              (OEKO-TEX Standard 100 or equivalent) are publicly disclosed on skims.com, and fabric composition per SKU
              is not prominently surfaced, creating a material diligence gap for investors concerned about sustainable
              sourcing and product claims.

              The sizing system is a competitive differentiator. Shapewear and underwear run XXS through 4X (waist
              00–28, hips included), with 5X available in some categories. Bras span 30–46 band and A–H cup, with
              international conversions for UK/AUS, EU, IT, FR, and JP. SKIMS offers a proprietary Bra Calculator on its
              website and separate fit guides for each product type. The guide's granular measurement instructions —
              underband vs. overbust measurement, cup overflow checks, strap-dig heuristics — indicate a deliberate
              effort to reduce returns driven by poor-fit selection. Despite this, Trustpilot reviews and customer
              feedback frequently cite sizing inconsistency across product lines, suggesting the manufacturing execution
              does not always match the sizing spec.

              Shade diversity — 9+ skin-tone options per item — is a foundational brand differentiator enabling SKIMS to
              occupy underserved demand that Spanx and Victoria's Secret did not address. However, maintaining color
              consistency across manufacturing runs is a standard operational challenge for the company.
