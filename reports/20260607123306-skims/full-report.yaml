      - number: '5.3'
        title: Commerce Stack and Launch Cadence
        blocks:
          - type: paragraph
            body: >
              SKIMS is a DTC-first brand whose primary revenue channel is skims.com, complemented by wholesale
              partnerships with Nordstrom and Selfridges and a growing owned retail network. The website operates an
              email capture and SMS marketing program (text SKIMS to 68805) for product drop notifications; over 11
              million consumers have signed up for restock alerts, providing a large, opted-in owned-media audience that
              reduces customer-acquisition-cost dependency on paid social advertising. The SMS program is governed by
              TCPA opt-in consent mechanics and CAN-SPAM compliance, and the SKIMS privacy policy is publicly
              accessible.

              SKIMS's launch cadence is organized around frequent limited-edition drops and restocks rather than
              traditional seasonal collections. This approach — used successfully by streetwear and sneaker brands —
              generates urgency, repeat site traffic, and social-media amplification through scarcity signals. Sacra
              data suggests more than 11 million consumers have signed up for product restock alerts, indicating a
              structural demand advantage in conversion velocity.

              The SKIMS app provides an incremental engagement surface, offering free return processing for app members
              enrolled in SKIMS Rewards, which serves as a lightweight loyalty mechanism and differentiates the
              paid-digital experience from web-only purchasing. The e-commerce technology stack is not publicly
              disclosed; the site behavior and URL structure are consistent with modern headless or Shopify-based DTC
              architectures, but SKIMS has not confirmed this. A dedicated evidence gap documents the absence of
              confirmed tech stack data.
