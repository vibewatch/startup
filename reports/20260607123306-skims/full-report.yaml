      - number: '6.5'
        title: Retention, Loyalty, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              SKIMS does not publicly disclose net revenue retention, gross retention, cohort churn, or average order
              value metrics. The primary observable retention mechanism is the SKIMS Rewards loyalty program, accessible
              via the brand's mobile app, which offers free return shipping as its headline benefit (domestic returns
              otherwise incur a $6 fee, creating a meaningful economic incentive to join). A 30-day return window is
              standard. The DTC digital channel enables repeat purchase measurement, but no such data is shared
              externally. The brand's concentration risk is elevated: Kim Kardashian serves as both founder and Chief
              Creative Officer, and all major product launches, wholesale partnerships, and institutional deals are
              closely tied to her personal brand. The NBA and NikeSkims partnerships partially mitigate this by
              attaching the brand to institutional sports and a tier-1 corporate collaborator, but dissolution of either
              relationship would materially affect male-segment acquisition. A separate risk is the entry of lower-cost
              shapewear clones marketed as "SKIMS dupes," documented in the NYT Wirecutter review as actively
              challenging SKIMS's positioning among price-sensitive consumers. Geographic concentration in the U.S. is a
              risk being actively addressed through the 2026 Asia openings, Selfridges and Net-A-Porter wholesale in
              Europe, and the broader international growth mandate in the Goldman Sachs Series D investment thesis.
