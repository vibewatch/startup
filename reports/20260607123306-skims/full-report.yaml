  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product-Line Architecture
        blocks:
          - type: paragraph
            body: >
              SKIMS operates across six commercial product categories, each targeting a distinct wardrobe occasion. The
              founding category — shapewear — covers sculpting bodysuits, shorts, briefs, high-waisted leggings, and
              waist-cinching styles. Underwear and bras expanded the addressable market to everyday intimates, launching
              wireless bralettes, underwire styles in band-and-cup sizing (30A–46H), and cotton-rib basics. Loungewear
              encompasses soft dresses, hoodies, sweatpants, tops, and the best-selling Soft Lounge line. Menswear —
              launched in 2022 — covers underwear, tees, and loungewear basics for men. Swimwear entered in 2021 with
              one- and two-piece styles, cover-ups, and bikini sets.

              The sixth and most strategically significant category is NikeSKIMS, a joint venture with Nike announced in
              March 2024 and launched in September 2025. The initial offering spanned 7 collections and 58 silhouettes
              using Nike Dri-FIT and proprietary fabric technologies; the Spring 2026 drop added 65+ silhouettes,
              accessories, and two footwear SKUs (NikeSKIMS Rift Satin and Rift Mesh), extending SKIMS into functional
              performance apparel and footwear for the first time. As of November 2025, SKIMS also operated 18 owned
              U.S. retail stores and a growing international footprint including a first Middle East location (Dubai,
              December 2025) and a 12,000 sq. ft. London flagship planned for summer 2026.

              Each category has a distinct maturity profile: shapewear and loungewear are the most developed with deep
              SKU ranges, while swim, mens, and the NikeSKIMS co-branded line are younger with narrower assortments and
              less visible sell-through data.
            claimRefs:
