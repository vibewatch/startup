        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-Break Trigger — Kim Kardashian Brand Disassociation
            body: >-
              The single highest-severity scenario for SKIMS is a material and sustained disassociation between Kim
              Kardashian and the brand — whether through personal scandal, health event, contractual termination, or
              competitor brand launch. SKIMS has not built a brand identity independent of Kardashian to a degree that
              would allow it to sustain premium positioning without her active participation. Investors should require
              disclosure of the brand-license IP structure, Kardashian's equity stake, contractual lock-up provisions,
