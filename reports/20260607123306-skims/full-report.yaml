chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: |
              SKIMS (legal entity SKIMS BODY, INC.) is a Los Angeles-based private apparel company
              founded in 2019 by Kim Kardashian and Jens Grede. The brand launched under the "Kimono
              Intimates" name but pivoted to "SKIMS" following an immediate cultural-appropriation
              backlash in mid-2019. Its official mission statement describes a "solutions-oriented
              brand creating the next generation of underwear, loungewear and shapewear" that sets
              "new standards by providing solutions for every body."

              Products span women's shapewear, underwear, loungewear, swimwear, sleepwear, menswear
              (launched August 2023), and—via the NikeSkims joint venture—activewear and performance
              apparel. Sizes run XXS to 5X; colorways include over 10 skin-tone shades per product
              family. Pricing is positioned as premium-accessible, with most items at $30–$100.

              The business model is digital-first DTC, monetised primarily through skims.com, with
              growing wholesale at Nordstrom, Selfridges, Harrods, Galeries Lafayette, and other
              premium department stores globally. A stated strategic pivot toward "predominantly
              physical retail" is being funded by the November 2025 Series D proceeds. The brand
              competes in the intimates, shapewear, loungewear, and—increasingly—activewear markets
              against Spanx, Victoria's Secret, Savage X Fenty, Lululemon, and Nike (while also
              partnering with Nike through NikeSkims). As of mid-2026 it remains a private company
              with no publicly audited financial statements.
