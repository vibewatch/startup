      - number: '7.5'
        title: Financial, Valuation, and Macro Risk
        blocks:
          - type: paragraph
            body: >-
              SKIMS is private with no disclosed audited financials. Its November 2025 funding round valued the company
              at $5 billion on $225 million raised, led by Goldman Sachs Alternatives with BDT & MSD Partners
              participating. The company projects exceeding $1 billion in net sales in fiscal 2025. At a $5 billion
              valuation against ~$1 billion revenue, SKIMS is priced at a ~5× EV/Revenue multiple — steep but defensible
              if SKIMS can sustain premium-brand positioning and its Nike collaboration delivers meaningful
              athletic-category revenue. However, this multiple requires continued growth at a pace that justifies
              public-market expectations. A revenue shortfall, a deterioration in brand heat, or a risk-asset repricing
              in consumer discretionary equities could force a down-round or suppress IPO pricing below the current
              private valuation mark.

              Macroeconomic headwinds represent a structural risk. Shapewear and premium intimate apparel are
              discretionary purchases that compress in consumer-spending downturns. The U.S. Census Bureau's Monthly
              Retail Trade data shows that clothing and accessories retail sales are among the most cyclical categories.
              Tariff uncertainty — including potential U.S. tariffs on apparel imported from Vietnam, China, or other
              Asian manufacturing hubs — could compress gross margins if SKIMS cannot absorb or pass through cost
              increases. The brand's premium pricing ($20–$100+ per item) provides some buffer against moderate tariff
              pass-through, but a large tariff increase would require either margin sacrifice or meaningful price
              increases that risk demand elasticity at the high end of the mass-premium segment.

              SKIMS has disclosed no public information about governance structures, audit committee composition,
              related-party arrangements between Kardashian and SKIMS, or debt facilities. This governance opacity is
              the standard condition for high-growth private companies, but it means investors cannot independently
              verify the financial condition, officer compensation arrangements, or capital structure ahead of any IPO.
              A pre-IPO down-round, a material financial restatement, or the disclosure of undisclosed related-party
              transactions could significantly impair investor confidence.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
          - type: table
            tableRef: TR005
            claimRefs: []
      - number: '7.6'
        title: Customer Service, Returns, and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              SKIMS charges a $6 return shipping fee on domestic returns unless the customer downloads the SKIMS app and
              joins the SKIMS Rewards program, in which case returns are free. The 30-day return window and fee
              structure generate consumer friction documented in review forums. SmartCustomer shows SKIMS at a 1.4-star
              average from 42 reviews, with the most frequent complaints about customer service responsiveness and
              return-fee surprises. Reviewers cite cheap fabric, poor fit, unhelpful support channels, and restocking
              fees. While the absolute count of verified reviews is not large, the concentration of negative sentiment
              on return and service experience is notable for a premium-positioned brand. Customer acquisition costs are
              high in apparel; poor post-purchase experience increases churn and erodes the word-of-mouth referral
              advantage that premium brands depend on.

              SKIMS's brick-and-mortar expansion — from its first permanent D.C. store opened in 2024 to 18 U.S. owned
              stores and two Mexico franchise locations as of the November 2025 funding announcement — introduces
              operational complexity: lease obligations, inventory planning, staff hiring, and in-store experience
              standards. The brand historically operated primarily online with controlled drop launches; physical retail
              adds fixed cost commitments and reduces operational flexibility. International expansion into Hong Kong
              and Seoul (via Lane Crawford and a local partner, per WWD) introduces foreign jurisdiction employment law,
              customs, and distribution complexity. The SKIMS Privacy Policy collects substantial personal data
              (purchase history, browsing behavior, device identifiers, marketing consent) under California and
              international data privacy frameworks; a data breach or CCPA enforcement action could generate regulatory
              penalty and consumer trust damage.
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
