      - number: '2.3'
        title: Buyer Segmentation and Inclusive Sizing Demand
        blocks:
          - type: paragraph
            body: >
              SKIMS' primary buyer is a woman aged roughly 18–45, purchasing body-contouring or everyday basic
              intimates, with a propensity for mid-premium price points ($30–$100 per item). The brand's XS-to-5X size
              architecture signals a deliberate strategy to capture historically underserved plus-size and curvy
              consumers, who represent a significant share of US women but have been poorly served by traditional
              shapewear players. Grand View Research notes that the female segment accounts for 93.8% of shapewear
              revenue, while the male segment is the fastest-growing sub-category—an opening SKIMS is now addressing
              through its menswear collection.


              The male buyer is an emerging secondary segment. SKIMS launched menswear in 2023 and has reported
              faster-than-expected traction in this category. Forbes reporting on the 2026 Chicago flagship notes that
              SKIMS now "spans women and men" as customer segments, with menswear gaining traction "faster than some
              analysts anticipated." This segment sits in men's basics and compression-wear territory previously owned
              by brands like Fruit of the Loom, Jockey, and Calvin Klein.


              Budget ownership and payer profile: for women's purchases, SKIMS targets the direct consumer who is both
              buyer and payer, making the conversion funnel short but requiring trust in sizing and fit. The high online
              return rate for intimate apparel (structurally elevated versus hard goods due to fit uncertainty) means
              that repeat-purchase economics depend critically on first-order fit satisfaction. The SKIMS size guide,
              available directly on skims.com, is a functional tool to reduce fit anxiety, and the Rewards program's
              free-return benefit is a retention mechanism.


              Internationally, SKIMS' buyer profile is being extended into Europe and the Middle East. Forbes reported a
              Europe-specific leadership hire in 2025, and the Chicago flagship serves as a test case for whether SKIMS'
              physical retail can match its digital conversion efficiencies in high-demographic-density markets. The
              inclusive sizing value proposition appears to resonate globally, as the Asia Pacific region is projected
              to show the fastest category CAGR for both shapewear and intimate apparel through 2030.
            claimRefs:
              - CM006
              - CM013
              - CM014
              - CM015
