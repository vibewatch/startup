              Kim Kardashian's 2022 SEC settlement for undisclosed crypto promotion establishes a precedent of
              inadequate disclosure discipline that the FTC could cite in any future influencer-marketing investigation
              involving SKIMS. Until SKIMS publicly documents a comprehensive influencer compliance program with legal
