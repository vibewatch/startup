company:
  name: SKIMS
chapter:
  number: 8
  title: Valuation
  summary: 'SKIMS is a high-quality but price-sensitive private consumer-brand opportunity: the $5 billion valuation is defensible only if the company sustains roughly $1 billion-plus net sales, preserves premium margins, and converts retail, NikeSkims, and international expansion into durable public-market growth. The recommendation is research-more rather than buy because public evidence supports brand momentum and credible IPO optionality but does not yet prove audited revenue, margin, channel economics, cap-table terms, or post-retail cash conversion.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation, price discipline, and final stance
  body: 'The investment stance is research-more at the reported $5 billion price, with medium confidence, high risk, and a stretched valuation stance. The positive case is unusually strong for a private apparel company: Goldman Sachs Alternatives led a November 2025 financing, Reuters-republished coverage says the round raised $225 million at a $5 billion valuation, and the company said it is on track to exceed $1 billion in 2025 net sales. That implies roughly 5.0x forward sales before any adjustment for preferences, dilution, inventory capital, retail build-out cost, or public-market multiple compression. The problem is not company quality; it is evidence quality at entry. SKIMS has not published audited consolidated financials, channel-level margins, cohort retention, inventory turns, or cap-table preference terms, while public activewear and apparel peers have de-rated sharply. A buy recommendation would require either audited proof that growth and profitability are materially above
    public peers, or an entry price closer to a 3.0x to 4.0x sales range.'
  claimRefs:
