- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financials
    - 2024-2026 revenue, margin, EBITDA, cash flow, inventory
    - Confirms whether 5x sales is justified
    - Request audited statements and monthly management accounts
  - - Channel economics
    - DTC, wholesale, store, franchise, NikeSkims, beauty margins
    - Expansion mix could dilute profitability
    - CFO data room and channel bridge
  - - Customer cohorts
    - Repeat purchase, returns, NPS, CAC, LTV by category
    - Determines durability beyond founder-led demand
    - Ask for cohort exports and independent survey
  - - Cap table
    - Preferences, liquidation stack, secondaries, option pool
    - Determines actual entry economics
    - Counsel-led waterfall and term review
  - - Retail productivity
    - Store four-wall contribution, capex, payback, traffic
    - Retail pivot is central use of proceeds
    - Review cohort P&Ls and leases
  - - Risk remediation
    - Labor suit response, complaint trend, compliance program
    - Needed for IPO readiness and downside risk
    - Legal memo and operating KPI review
  notes: Every ask ties to a thesis-break trigger; absence of data should lower recommendation rather than invite false precision.
