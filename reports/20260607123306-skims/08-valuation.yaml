- id: thesis-break-diligence-asks
  title: Thesis-break diligence asks and IC gating
  body: 'The next diligence phase should be explicitly thesis-breaking. The first ask is audited 2024-2026 financials with revenue, gross margin, EBITDA, free cash flow, inventory, returns, and channel economics. The second is cap-table economics: liquidation preferences, participating preferred terms, investor side letters, option pool, secondary activity, and expected IPO dilution. The third is customer proof beyond press coverage: repeat purchase, cohort retention, return rates, NPS, store four-wall economics, and wholesale sell-through. The fourth is execution risk: legal reserve for the 2026 wage suit, supply-chain compliance, labor practices, quality-control metrics, and international retail capex. If any of these diligence streams show slowing growth, gross-margin compression, weak repeat purchase, or governance terms that shift downside to common shareholders, the recommendation should move from research-more to avoid. Conversely, audited proof of profitable $1 billion-plus scale,
    strong cohorts, and clean preferences would support a track-to-buy stance at disciplined entry pricing.'
