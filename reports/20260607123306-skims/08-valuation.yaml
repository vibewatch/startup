- id: bull-base-bear-outcomes
  title: Bull, base, and bear outcomes
  body: Scenario work should start from observable revenue scale rather than founder celebrity. The bull case assumes SKIMS exceeds $1 billion in 2025 net sales, compounds at a premium rate through international stores, NikeSkims, menswear, and beauty, and sustains apparel margins without major service or labor issues. That case can support a $7 billion to $10 billion IPO-range valuation if public investors apply an On/Birkenstock-style growth multiple. The base case assumes growth moderates as SKIMS absorbs store costs and broader SKU complexity; at a 3.5x to 4.5x sales lens, the reported private valuation is broadly fair but offers limited margin of safety. The bear case assumes public investors treat the company as a discretionary apparel name with service complaints, weak disclosure, and retail execution risk; at 2x to 3x sales, downside to the last private mark is meaningful. The weighting should stay conservative until audited financials close the current evidence gap.
  claimRefs:
