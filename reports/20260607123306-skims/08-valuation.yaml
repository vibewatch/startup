- id: TV005
  title: Thesis-break and red-line triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue miss
    - 2025 net sales materially below $1B or 2026 growth below premium peers
    - Undercuts 5x sales valuation
    - Move to avoid unless entry price resets
  - - Margin compression
    - Gross margin or EBITDA margin falls below premium DTC expectations
    - Retail and inventory costs consume brand premium
    - Require lower multiple and recovery plan
  - - Cohort weakness
    - Repeat purchase, return rate, or NPS deteriorates
    - Celebrity demand may not be durable
    - Pause until customer data is clean
  - - Legal escalation
    - 2026 wage suit becomes class-certified or reveals systemic labor issues
    - Adds cost, distraction, and IPO risk
    - Require legal reserve and remediation proof
  - - Partner disappointment
    - NikeSkims underperforms or economics are margin-dilutive
    - Key growth adjacency weakens
    - Remove upside option from valuation
  - - Cap-table overhang
    - Preferences or secondaries concentrate downside away from new investors
    - Return asymmetry worsens
    - Reject unless terms reset
  notes: Triggers are designed as diligence gates before a price-sensitive investment decision.
