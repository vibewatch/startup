- id: thesis-and-antithesis
  title: Investment thesis and anti-thesis
  body: 'The thesis rests on SKIMS turning a founder-led shapewear brand into a scaled lifestyle platform with evidence of product adjacency, global reach, and partner leverage. Company and media sources support the expansion from shapewear into underwear, loungewear, apparel, activewear, and beauty, while NikeSkims gives the brand an institutional distribution and product-development partner that many celebrity brands never secure. The anti-thesis is equally material: SKIMS is still private, disclosure is selective, and brand heat may not translate into public-market durability once the company operates stores, franchises, wholesale relationships, inventory risk, and a wider SKU base. Customer-review sources and a 2026 wage-suit report add disconfirming signals about service quality and labor execution. The most important judgment is therefore whether SKIMS deserves a premium growth multiple like On or Birkenstock, or a compressed apparel multiple like Nike, Lululemon, FIGS, Victoria''s
    Secret, American Eagle, or Hanesbrands. At $5 billion, investors are already paying for premium execution.'
  claimRefs:
