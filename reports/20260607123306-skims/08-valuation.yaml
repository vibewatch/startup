  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2024-2026 consolidated financial statements, including revenue, gross margin, EBITDA, free cash flow, inventory, and channel detail.
    whyItMatters: Without audited economics, the $5 billion valuation cannot be tied to verified profitability or cash conversion.
    diligencePath: Request audited statements, management accounts, quality-of-earnings work, and channel margin schedules in the data room.
    relatedQuestionRefs:
    - QV022
    - QV020
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Liquidation preferences, participation rights, side letters, secondary sales, option-pool sizing, and expected IPO dilution.
    whyItMatters: Private-round headline valuation can overstate new-money return if preferences or dilution shift downside away from late investors.
    diligencePath: Run a counsel-led cap-table waterfall under bear, base, and bull exit values before any term-sheet decision.
    relatedQuestionRefs:
    - QV021
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: retail-productivity
    missingEvidence: Store-level capex, traffic, conversion, four-wall contribution margin, payback, and inventory productivity by opening cohort.
    whyItMatters: The Goldman-led financing is tied to store expansion, so weak four-wall economics would break the use-of-proceeds thesis.
    diligencePath: Review store cohort P&Ls, lease abstracts, and post-opening KPI dashboards for every permanent retail location.
    relatedQuestionRefs:
    - QV023
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: conflicting-data
    severity: material
    topic: customer-experience
    missingEvidence: Independent customer cohort, returns, complaint-resolution, and NPS data that reconciles premium brand momentum with adverse review sources.
    whyItMatters: Public review complaints could be noise or an early warning of quality and service issues that would hurt public-market valuation.
    diligencePath: Commission a customer survey and compare internal support tickets, return reasons, review trends, and repurchase cohorts.
    relatedQuestionRefs:
    - QV011
    - QV024
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable valuation sample coverage
    missingEvidence: A broader live public-company screen with every relevant apparel, intimates, footwear, beauty, and consumer lifestyle comp as of the final IC date.
    whyItMatters: TV004 is intentionally a representative sample; a full banker-style comp set could refine the multiple range before pricing.
    diligencePath: Refresh market-data exports for the full peer universe and reconcile EV, net debt, revenue, and growth rates immediately before IC.
    relatedQuestionRefs:
    - QV012
    - QV013
    - QV014
    relatedTableRefs:
    - TV004
