- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - 2025 net sales exceed $1B; 2026 growth remains premium; retail and NikeSkims scale profitably
    - $7B-$10B range at premium 5x-7x sales lens
    - Execution must clear retail, labor, and customer-service issues
    - Requires audited growth and margin proof
  - - Base
    - Growth moderates but brand remains premium and profitable
    - $4B-$6B range at 3.5x-4.5x sales lens
    - Last round leaves limited near-term upside
    - Most consistent with public evidence today
  - - Bear
    - Growth slows, stores dilute margin, complaints or wage suit worsen
    - $2B-$3.5B range at 2x-3x sales lens
    - Down-round or IPO delay risk
    - Triggered by weak cohorts or gross-margin compression
  - - Upside option
    - Beauty and activewear add revenue without cannibalization
    - Could add strategic premium beyond apparel multiple
    - Unproven economics and partner split
    - Only after NikeSkims and beauty revenue disclosure
  - - Downside floor
    - Brand remains valuable but public comps de-rate
    - Strategic acquirer valuation capped by apparel peer multiples
    - Private preferences may protect late investors first
    - Requires cap-table waterfall review
  notes: Scenario ranges are estimated sales-multiple frameworks, not audited DCF outputs.
