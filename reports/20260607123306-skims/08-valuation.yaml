- id: valuation-context-and-comps
  title: Current valuation context and public-comp lens
  body: 'The $5 billion round frames SKIMS as a late-stage branded-apparel asset rather than a venture software company. Sacra states that the valuation implies roughly 5x projected 2025 sales, and Reuters/US News reports PitchBook commentary that the Goldman-led round strengthens the IPO case. Public comparables are sobering. Nike and Lululemon market-data pages show much lower price-to-sales or ratio levels than SKIMS implied multiple, while On and Birkenstock retain premium valuations because investors underwrite faster growth and stronger brand pricing power. SEC submission feeds and company investor pages confirm that these peers are public filers with audited disclosures, making their lower multiples more informative than private-round headlines. A fair SKIMS entry framework should therefore triangulate three lenses: 2x to 3x sales for mature apparel, 3x to 4x sales for high-quality premium lifestyle brands, and 5x-plus only if audited 2025-2026 growth, gross margin, and retail productivity
    substantiate a category-defining IPO story.'
