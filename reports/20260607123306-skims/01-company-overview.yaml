  evidenceGaps:
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "profitability"
      missingEvidence: "Independently audited income statement confirming SKIMS net profit margin and revenue figures"
      whyItMatters: "Revenue and profit data are based on Sacra analyst estimates and CEO statements only; no audited financials are public, making valuation multiple and growth-rate analysis dependent on unverified figures"
      diligencePath: "Request audited financials under NDA as part of any institutional due-diligence engagement; cross-reference tax filings or regulatory disclosures if available in any jurisdiction"
      relatedQuestionRefs:
        - QO009

    - type: "private-evidence-only"
      severity: "material"
      topic: "governance"
      missingEvidence: "SKIMS board of directors composition, investor governance rights, and ownership cap table"
      whyItMatters: "No public board disclosure limits understanding of fiduciary oversight, investor control provisions, or drag-along/tag-along rights that would affect an acquirer or IPO investor"
      diligencePath: "Request board constitution and shareholder agreement under NDA; review any SEC filings post-IPO registration if the company re-files"

    - type: "missing-source"
      severity: "material"
      topic: "jens-grede-background"
      missingEvidence: "Detailed public biography of Jens Grede covering his exact founding role and operational track record at Bureau Betak and Frame"
      whyItMatters: "Grede's prior management experience directly affects confidence in SKIMS' operational execution capability during rapid global scaling"
      diligencePath: "Review LinkedIn profile, Bureau Betak company history, and Frame revenue disclosures; seek board or investor references from prior ventures"
      relatedQuestionRefs:
