  - id: funding-history-and-investor-landscape
    title: "Funding History and Investor Landscape"
    body: |
      SKIMS has raised approximately $956 million across multiple private funding rounds since
      founding, with each successive raise reflecting both revenue growth and expanding strategic
      ambitions. The company reached a $3.2 billion valuation in late 2021 following a raise led
      by Wellington Management. It then raised at a $4 billion valuation in January 2023 and
      again in July 2023 when it closed a Series C of approximately $330 million at the same
      $4 billion mark; the July 2023 round was accompanied by a confidential IPO registration
      filed with the SEC, though the listing never proceeded.

      In November 2025 SKIMS closed its Series D: $225 million at a $5 billion post-money
      valuation, led by Goldman Sachs Alternatives with participation from BDT & MSD Partners
      affiliated funds. The round was announced on November 12, 2025 via an official press
      release issued through Goldman Sachs. Beat Cabiallavetta (Global Head of Hybrid Capital,
      Goldman Sachs Alternatives) and Greg Olafson (President and Co-CIO, BDT & MSD) both
      made public statements endorsing the investment.

      At $5 billion, SKIMS is valued at more than Victoria's Secret and Under Armour combined,
      a striking comparison for a brand only six years old. The Series D implies roughly 5x
      forward revenue on projected 2025 net sales above $1 billion. Earlier investor cohorts
      include Wellington Management, Greenoaks Capital, Lone Pine Capital (Stephen Mandel),
      D1 Capital Partners (Daniel Sundheim), and Thrive Capital (Josh Kushner). SKIMS' CEO
      Jens Grede has stated the company "deserves" to be public; the Series D is widely expected
      to delay a potential IPO, as it removes immediate pressure to access public capital markets.
