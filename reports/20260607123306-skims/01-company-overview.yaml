    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "investor-ownership-stakes"
      missingEvidence: "Individual ownership percentages, governance rights, and board representation for each SKIMS investor"
      whyItMatters: "Without stake sizes and control provisions it is impossible to model dilution impact, founder-control status, or alignment of incentives between Goldman Sachs, earlier investors, and founders"
