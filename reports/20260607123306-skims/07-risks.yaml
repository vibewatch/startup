        - Medium
        - Low – no public QC audit or testing protocol disclosed
        - Brand-premium erosion; return volume cost
        - No third-party quality testing results or fabric-composition certifications located
      - - Supply chain disruption (sourcing concentration in Asia)
        - Medium – dependent on undisclosed Asian manufacturers
        - High
