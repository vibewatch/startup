callouts:
  - calloutType: risk
    title: Thesis-Break Trigger — Kim Kardashian Brand Disassociation
    body: >-
      The single highest-severity scenario for SKIMS is a material and sustained disassociation
      between Kim Kardashian and the brand — whether through personal scandal, health event,
      contractual termination, or competitor brand launch. SKIMS has not built a brand identity
      independent of Kardashian to a degree that would allow it to sustain premium positioning
      without her active participation. Investors should require disclosure of the brand-license
      IP structure, Kardashian's equity stake, contractual lock-up provisions, and any brand-
      independence road map before underwriting the full $5 billion valuation.
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR007

  - calloutType: risk
    title: SEC and FTC Regulatory Overhang
    body: >-
      Kim Kardashian's 2022 SEC settlement for undisclosed crypto promotion establishes a
      precedent of inadequate disclosure discipline that the FTC could cite in any future
      influencer-marketing investigation involving SKIMS. Until SKIMS publicly documents
      a comprehensive influencer compliance program with legal sign-off, the regulatory overhang
      from Kardashian's personal enforcement history remains a material risk.
    claimRefs:
      - CR003
      - CR010
      - CR011

  - calloutType: recommendation
    title: Priority Diligence Asks
    body: >-
      Before any growth-stage investment in SKIMS, diligence should confirm: (1) brand-license IP
      structure and Kardashian contractual obligations; (2) supply-chain country-of-origin
      disclosure and UFLPA compliance attestations; (3) SB 657 supply-chain disclosure
      publication; (4) FTC influencer-program compliance review; (5) CFO identity and
      pre-IPO audit process; (6) NikeSkims contract term, minimums, and renewal provisions;
      and (7) unit economics for owned stores at current traffic levels.
    claimRefs:
      - CR001
      - CR016
      - CR018
      - CR025
      - CR032

