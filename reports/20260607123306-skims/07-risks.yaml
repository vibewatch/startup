        - Confirm brand-license terms, duration, and assignability independent of Kardashian's personal status
      - - Jens Grede (CEO)
        - Operational execution leader; lower public profile than Kardashian
        - Low – no CEO-departure signals identified
        - High
        - Experienced executive background in fashion (Frame co-founder); succession planning needed
        - Assess CEO employment contract, equity alignment, and succession plan
      - - Design and product leadership
        - Undisclosed leadership team; dependency on founder creative direction
        - Medium – limited public visibility into product design bench
        - Medium
        - Build design leadership talent beneath CCO level
        - Identify and assess depth of product-design leadership team below Kardashian
      - - Supply chain and operations leadership
        - Rapid scale-up to 18+ stores and international; execution risk high
        - Medium – fast physical-retail build-out is operationally demanding
        - High
