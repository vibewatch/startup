        - Medium
        - Low – no disclosed store-level economics or lease terms
        - Lease-obligation drag if store traffic underperforms; working capital pressure
        - No store-level revenue, traffic, or conversion metrics publicly available
    notes: >-
      Likelihood and severity are qualitative estimates based on consumer review data, regulatory frameworks,
      and comparable apparel brand operating risks. Mitigation maturity is assessed against publicly available
