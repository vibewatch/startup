  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: supply chain supplier list
      missingEvidence: >-
        Tier-1 and tier-2 supplier names, countries of origin, and UFLPA compliance attestations
        for SKIMS's manufacturing base.
      whyItMatters: >-
        Without supplier transparency, UFLPA risk, forced-labor compliance, and CA SB 657
        compliance cannot be independently assessed. A CBP detention event could cause material
        revenue disruption.
      diligencePath: >-
        Request supplier list and UFLPA due-diligence documentation in investor diligence;
        review CA AG supply-chain disclosure or request it from legal counsel.
      relatedQuestionRefs:
        - QR005
        - QR006
        - QR007
      relatedTableRefs:
        - TR001
        - TR002

    - type: private-evidence-only
      severity: blocking
      topic: brand-license IP structure
      missingEvidence: >-
        Terms, duration, assignability, and compensation structure of Kardashian's brand-license
        and IP agreement with SKIMS, including lock-up and succession provisions.
      whyItMatters: >-
        Without this, investors cannot assess key-person risk independently; any transaction
        or IPO prospectus would require this disclosure, and its absence is the primary governance
        gap.
      diligencePath: >-
        Request brand-license agreement from SKIMS management in diligence; require disclosure
        in any S-1 prospectus; seek legal review of IP assignability.
      relatedQuestionRefs:
        - QR001
        - QR020
      relatedTableRefs:
        - TR004

    - type: private-evidence-only
      severity: material
      topic: NikeSkims contract terms
      missingEvidence: >-
        Term length, minimum commitment, renewal conditions, and revenue share for the NikeSkims
        collaboration agreement.
      whyItMatters: >-
        NikeSkims is SKIMS's primary route to athletics and footwear; unknown contract terms make
        it impossible to assess duration of this revenue and brand-heat contribution.
      diligencePath: >-
        Request NikeSkims collaboration agreement in diligence; cross-reference Nike's
        quarterly earnings commentary on collaboration revenue.
      relatedQuestionRefs:
        - QR008
        - QR009
      relatedTableRefs:
        - TR003

    - type: private-evidence-only
      severity: material
      topic: store-level unit economics
      missingEvidence: >-
        Revenue per store, traffic, conversion, and lease-obligation data for SKIMS's 18+ U.S.
        owned stores.
      whyItMatters: >-
        Store expansion is SKIMS's stated next phase; without unit economics, working-capital
        and fixed-cost drag cannot be modeled and operational risk cannot be assessed.
      diligencePath: >-
        Request store-level P&L data in diligence; compare to comparable DTC-to-physical
        conversion experiences (Warby Parker, Allbirds) as proxies.
      relatedQuestionRefs:
        - QR013
        - QR028
      relatedTableRefs:
        - TR002

    - type: stale
      severity: minor
      topic: consumer review data freshness
      missingEvidence: >-
        Verified 2026 consumer review counts and NPS data across major platforms (BBB, Trustpilot,
        Google Reviews) for SKIMS.
      whyItMatters: >-
        Current review data is drawn from aggregators with limited verified-review counts (42 on
        SmartCustomer); a larger sample would improve confidence in the customer-satisfaction
        risk assessment.
      diligencePath: >-
        Request NPS, CSAT, and repeat-purchase rate data from SKIMS management in diligence;
        monitor Trustpilot and BBB for new verified reviews.
      relatedQuestionRefs:
        - QR014
        - QR019

    - type: private-evidence-only
      severity: material
      topic: NikeSkims revenue contribution
      missingEvidence: >-
        Revenue or brand-value attribution for NikeSkims versus core SKIMS revenue,
        and unit economics per NikeSkims SKU.
      whyItMatters: >-
        Without NikeSkims revenue data, it is impossible to assess how exposed SKIMS's
        growth trajectory is to this single collaboration's performance.
      diligencePath: >-
        Request NikeSkims revenue contribution in diligence; cross-reference Nike quarterly
        earnings commentary for collaboration metrics.
      relatedQuestionRefs:
        - QR009

    - type: private-evidence-only
      severity: material
      topic: burn rate and runway
      missingEvidence: >-
        SKIMS burn rate, operating cash flow, and post-Series-D runway duration.
      whyItMatters: >-
        Without burn-rate data, financial model risk and capital adequacy cannot be assessed
        independently; this is a prerequisite for any IPO or growth-investment analysis.
      diligencePath: >-
        Request management accounts and cash-flow projections in diligence; require
        pre-IPO audited financials for any public listing.
      relatedQuestionRefs:
        - QR011

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TR002 (Operational / quality / security risk register) and TR005 (Mitigation and kill criteria table)
      contain qualitative risk assessments that are not derived from a single primary-source fact per cell;
      they are analytical synthesis tables rather than pure factual snapshots, and notes are provided
      accordingly. The tableNotes warning is acknowledged for TR002 and TR005 because their notes
      accurately describe the estimation and qualitative basis of each row.
