companyProfile:
  summary: >-
    K2 Space is a Torrance-based private satellite manufacturer founded in 2022 by brothers Karan and Neel Kunjur. The
    company sells large, high-power Mega Class satellite buses for commercial, defense, and scientific missions across
    LEO, MEO, GEO, and cislunar regimes, pairing vertically integrated manufacturing with a mission thesis centered on
    fewer, more capable spacecraft. Public evidence now includes a scaled Torrance factory, the Gravitas mission, a
    disclosed SES constellation order, and a July 2026 Series D, but the operating picture is still incomplete because
    management financials and cap-table terms are not public.
