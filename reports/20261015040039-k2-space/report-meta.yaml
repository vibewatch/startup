  topStrengths:
    - Differentiated high-power Mega Class architecture with real on-orbit and mission proof points.
    - Meaningful commercial and government demand signals, including SES and the Gravitas program.
    - Rapidly scaled capital access and manufacturing footprint that can support a bigger production thesis.
  topRisks:
    - Public revenue, margin, burn, runway, and cap-table disclosure remain incomplete.
    - Valuation appears to have moved faster than independently disclosed operating economics.
    - First-flight and repeat-delivery execution still determine whether the hardware thesis compounds.
  unresolvedGaps:
    - Audited or management financials showing current revenue, gross margin, burn, and cash runway.
    - Cap table, preference stack, option pool, and investor rights from the current and prior rounds.
    - Customer-by-customer backlog breakdown, milestone schedule, cancellation rights, and payment timing.
    - Independent confirmation of repeatable on-orbit performance and follow-on commercial conversion.
