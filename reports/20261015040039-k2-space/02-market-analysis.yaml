callouts:
  - calloutType: insight
    title: The market case is really a mission-economics case
    body: K2's public market narrative is strongest where fewer high-power satellites can replace a much larger LEO constellation or a more expensive bespoke high-orbit spacecraft, not where a generic space-industry TAM is large.
    claimRefs: [CM002, CM003, CM014]
  - calloutType: risk
    title: Public market evidence is still proxy-heavy
    body: The retained sources show meaningful contract and product signals, but they do not yet disclose a defendable public TAM, budget-owner map, or reconciled performance basis for all headline specifications.
    claimRefs: [CM010, CM012, CM013]
