  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Public TAM, SAM, or SOM model with segment definitions, spend basis, and geographic scope for the buyer classes K2 is actually targeting.
      whyItMatters: Without a bottoms-up segment-spend model, market size remains proxy-based and is easy to overstate in valuation work.
      diligencePath: Request K2's internal market model, named pipeline by segment, and any board or investor materials that break spend by orbit, mission class, and buyer type.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002, TM003]
    - type: conflicting-data
      severity: material
      topic: performance-envelope
