evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Current board composition, observer rights, committee structure, and full executive roster beyond the founders.
    whyItMatters: Founder-led execution is clear, but governance quality cannot be assessed from public materials alone.
    diligencePath: Request the current board deck, cap table governance summary, and leadership org chart from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: capital-totals
    missingEvidence: >-
      Primary financing documents or investor-confirmed round table that reconciles total capital raised, valuation, and
      instrument mix across Series C and Series D.
    whyItMatters: Current valuation and dilution analysis depend on whether cumulative capital is below $1B or already above it.
    diligencePath: >-
      Obtain the financing timeline directly from management or lead investors, including preferred terms and any debt
      or secondary proceeds.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited or management-certified revenue, backlog conversion, gross margin, customer count, and cash runway
      metrics.
    whyItMatters: >-
      The business looks well funded, but the current source pack does not show whether contracts are converting into
      durable operating economics.
    diligencePath: >-
      Request the current board package or monthly operating review with revenue, backlog, margin, burn, and cash
      metrics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Complete cap table, board observer list, and named commercial customer roster beyond the publicly disclosed
      investors and government counterparties.
    whyItMatters: The stakeholder map is only a public sample, so control dynamics and concentration risk may be understated.
    diligencePath: Collect the cap table, investor rights matrix, and top-customer list during management diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Public TAM, SAM, or SOM model with segment definitions, spend basis, and geographic scope for the buyer classes K2
      is actually targeting.
    whyItMatters: >-
      Without a bottoms-up segment-spend model, market size remains proxy-based and is easy to overstate in valuation
      work.
    diligencePath: >-
      Request K2's internal market model, named pipeline by segment, and any board or investor materials that break
      spend by orbit, mission class, and buyer type.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: performance-envelope
    missingEvidence: >-
      Official data sheet or ICD reconciling whether the relevant public figure is more than 20 kW of payload power, 20
      kW versus 2 kW, or up to 30 kW of peak payload power.
    whyItMatters: >-
      Power rating is central to both market boundary and pricing logic, so inconsistent public numbers can distort
      adoption and valuation assumptions.
    diligencePath: >-
      Obtain the current Mega Class data sheet, confirm whether each figure refers to payload power, total platform
      power, or peak power, and align all downstream models to one basis.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: demand
    missingEvidence: >-
      Backlog composition, cancellation terms, payment milestones, and repeat-order evidence behind the reported
      signed-contract total.
    whyItMatters: >-
      Signed contract value is only a strong market signal if it converts into repeatable revenue, factory utilization,
      and customer expansion.
    diligencePath: >-
      Request customer-by-customer backlog detail, booked-versus-option split, and any proof of renewals or follow-on
      orders tied to the disclosed contract base.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Independent public pricing, packaging, and capability disclosures for named rival satellite-bus vendors serving
      similar MEO/GEO or high-power missions.
    whyItMatters: >-
      Without like-for-like rival disclosures, the pricing table remains a class comparison rather than a benchmarked
      peer matrix.
    diligencePath: >-
      Retain competitor pricing pages, datasheets, security/compliance pages, and product documentation from direct
      rival bus vendors and incumbents.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: direct-peer-proof
    missingEvidence: >-
      Independent sources naming direct K2 alternatives with product scope, customer segment, and contract evidence
      instead of broad directory groupings.
    whyItMatters: >-
      The chapter can identify architecture substitutes today, but cannot cleanly separate direct peers from adjacent
      entrants with the assigned evidence alone.
    diligencePath: >-
      Collect independent reviews, procurement records, customer case studies, and direct product pages for named
      large-bus and multi-orbit competitors.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      SES order economics, Gravitas milestone terms, cancellation rights, and any public renewal or backlog conversion
      data.
    whyItMatters: >-
      Contract logos improve trust, but underwriting competitive durability still depends on whether those wins convert
      into repeatable economics.
    diligencePath: >-
      Request customer contract summaries, milestone schedules, backlog disclosures, and management commentary on
      realized pricing and follow-on demand.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: blocking
    topic: profitability-and-runway
    missingEvidence: >-
      Audited or management financials showing current revenue, gross margin, burn, cash balance, runway, and capex
      plan.
    whyItMatters: >-
      Without these inputs, investors cannot determine whether backlog converts into acceptable hardware margins before
      another financing event.
    diligencePath: Request board or lender reporting, monthly cash bridge, and segment-level gross-margin disclosures.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-backlog-quality
    missingEvidence: Customer-level backlog, cancellation rights, milestone schedules, discounts, and realized ASPs by bus or mission.
    whyItMatters: >-
      Signed contract headlines and public list pricing do not establish revenue quality, conversion timing, or customer
      concentration.
    diligencePath: >-
      Request top-customer contracts, booking-to-billing roll-forward, and price-waterfall analysis for the last four
      quarters.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: minor
    topic: total-capital-reconciliation
    missingEvidence: A reconciled round-by-round financing ledger net of secondaries, debt, and non-dilutive funding.
    whyItMatters: Public funding tallies differ, which can distort assumptions about cash available for factory scale-up.
    diligencePath: Request a financing ledger that ties each round, investor, gross proceeds, fees, and current unrestricted cash.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository, package, engineering talk, practitioner forum, or recruiting artifact that exposes software,
      integration, or developer-surface maturity.
    whyItMatters: >-
      The chapter brief explicitly asks for trust and technical-risk evidence, and the assigned pool contains no open
      developer or practitioner telemetry to test how much of the stack is observable outside management-controlled
      materials.
    diligencePath: >-
      Request public or customer-shareable engineering artifacts such as API docs, release notes, integration guides,
      conference talks, or recruiting packets that describe tooling and support responsibilities.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: technical-documentation-gap
    missingEvidence: >-
      Datasheet, interface control document, subsystem qualification results, and customer integration materials for
      Mega Class.
    whyItMatters: >-
      Without those materials, diligence cannot independently test payload accommodation, interfaces, redundancy
      assumptions, or operational limits beyond marketing and directory summaries.
    diligencePath: >-
      Obtain the latest Mega Class datasheet, ICD, and qualification package from K2 under NDA and reconcile them
      against the public specification claims used in this chapter.
    relatedQuestionRefs:
      - QE003
      - QE006
  - type: missing-source
    severity: material
    topic: mission-maturity
    missingEvidence: >-
      Independent reporting or customer disclosure on GRAVITAS orbit-raise results, payload performance, and post-launch
      reliability.
    whyItMatters: >-
      The platform's underwriting case depends on turning component-level and first-mission proof into repeatable
      customer evidence, especially for higher-orbit deployment claims.
    diligencePath: >-
      Request mission reports, customer references, and telemetry summaries from GRAVITAS and compare them with the
      planned Trinity and Giga roadmap assumptions.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Segment-level renewals, churn, NRR, GRR, contract term length, and cohort behavior.
    whyItMatters: Without durability metrics, backlog cannot be translated into recurring revenue quality or customer stickiness.
    diligencePath: Request a cohort retention deck by customer segment plus top 10 contract durations and renewal outcomes.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue or backlog concentration and channel dependence by named program.
    whyItMatters: >-
