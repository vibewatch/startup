company:
  name: K2 Space
chapter:
  number: 1
  title: Company Overview
  summary: K2 Space has progressed from a 2022 founding into a late-stage satellite manufacturer with a differentiated high-power bus thesis, a 180,000-square-foot Torrance factory, and increasingly visible government and commercial demand. The source pack supports strong evidence for platform ambition and fundraising momentum, but board governance, audited financials, customer concentration, and even cumulative capital totals still rely on incomplete or conflicting third-party disclosures.
sections:
- id: identity-platform
  title: Identity and platform thesis
  body: 'K2 Space presents itself as a builder of large, high-power satellite platforms rather than another small-satellite bus vendor. Official product surfaces describe platforms engineered for LEO, MEO, GEO, and cislunar or deep-space missions, while third-party profiles consistently place the company in Torrance and date the founding to 2022. The product proposition is explicit: use larger buses, higher power, and more payload mass to reach missions that smaller constellation-class spacecraft cannot serve economically. The strongest supported ground truth for later chapters is therefore identity plus architecture ambition, not revenue scale or market share.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: leadership-governance
  title: Leadership concentration and governance disclosure
  body: 'The retained pack identifies the company as founder-led by brothers Karan and Neel Kunjur, with Karan serving as CEO and Neel as CTO. That gives K2 a coherent founding narrative tied to product and technical execution, but it also concentrates product, fundraising, and mission credibility in a narrow team. The same public pack is notably thin on formal governance: it does not disclose board composition, observer rights, or independent oversight. For diligence purposes, this chapter can support a founder-led operating model with meaningful key-person dependence, but it cannot clear governance diligence beyond that threshold.'
  claimRefs:
  - CO014
  - CO015
  tableRefs:
  - TO002
- id: capital-scale-milestones
  title: Funding history, operating scale, and milestone cadence
  body: K2's growth story is easier to evidence than its financial quality. Payload reported $195 million in funding after a NewSpace Capital investment and linked that capital to a 180,000-square-foot California facility and a 100-satellite annual capacity target. SatNews then reported a $110 million Series B and more than $50 million in contracts, while NewSpaceTracker and Indexed.vc describe follow-on Series C and Series D financings that move cumulative capital into a roughly $944.5 million to $1 billion-plus band. Those directories also imply a sharp step-up in valuation and workforce scale, but because the current source pack lacks primary financing documents and audited company financials, capital totals, valuation, and headcount should be treated as recently reported rather than fully verified.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  tableRefs:
  - TO003
  figureRefs:
  - FO001
- id: execution-risks
  title: Current status and visible execution risks
  body: 'The current mission stack shows real progress but still leaves the valuation case dependent on execution. Official pages list Heritage as a successful January 2025 subsystem demonstration and Gravitas as operational on orbit after a March 2026 mission, while Starpath and NewSpaceTracker frame the Space Force-backed Gravitas program as a proof point for LEO-to-MEO operations and mixed commercial or national-security payloads. Even so, the adverse source in the pack keeps the risk framing grounded: future value depends on repeated mission delivery, customer adoption, manufacturing scale, competition, and access to capital. Put differently, K2 now has stronger public proof of ambition and program traction than it did in the prior report, but not yet enough transparent operating disclosure to make the current private valuation self-validating.'
  claimRefs:
  - CO005
  - CO009
  - CO010
  - CO012
  - CO013
  - CO016
