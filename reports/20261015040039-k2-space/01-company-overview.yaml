      tone: positive
      claimRefs:
      - CO001
    - date: '2024-01-01'
      label: Scaled facility and hardware heritage
      detail: By 2024, K2 had scaled from 25 to 90 employees, expanded to a 180,000-square-foot facility, and completed a first in-space subsystem demonstration.
      tone: positive
