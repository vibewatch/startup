      tone: positive
      claimRefs:
      - CO005
    - date: '2025-02-13'
      label: Series B and first in-space demonstration publicized
      detail: SatNews reports a $110M Series B, $180M cumulative equity, and more than $50M in contracts.
      tone: positive
      claimRefs:
      - CO008
    - date: '2025-12-13'
      label: Series C raises valuation expectations
      detail: NewSpaceTracker summarizes a $250M Series C at a $3B valuation and says total funding passed $450M.
