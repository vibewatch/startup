    columns:
      - 论点
      - 支持证据
      - 哪些情况会改变判断
    rows:
      - - 正论：资本获取
        - K2 披露以 $6.8B 估值完成 $500M Series D，此前以 $3B 估值完成 $250M Series C；公开来源估计累计融资约 $1B。
        - 私人财务数据若显示新增资本正在转化为持久收入和利润率，将强化乐观情景。
      - - 正论：差异化能力
        - 独立产品摘要称 Mega 平台功率约为 20-30 kW，并具备 LEO 到 MEO 升轨能力，明显高于典型星座级功率水平。
        - 公开数据表或客户支持的性能证据，能让投资者更容易把这种差异化能力纳入判断。
      - - 反论：价格跑在披露前面
        - 合同总额和融资规模已公开，但收入、毛利率、现金消耗、资金续航和清算条款仍未披露。
        - 经审计或管理层财务数据，加上条款清单细节，可降低上一轮估值高估内在价值的风险。
      - - 反论：执行仍最重要
        - 载荷资料和其他外部摘要都认为，价值创造取决于首飞成功、订单储备转化和工厂利用率。
        - 持续的在轨表现，以及已交付卫星转化为确认收入，会降低下行风险。
    notes: 支持证据仅概括本章保留的证据集；指定证据池中没有可靠的公开可比公司倍数，因此本表聚焦投资判断论据及会改变判断的缺失证据。
