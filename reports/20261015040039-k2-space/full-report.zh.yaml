            - 更少发射次数，更快部署至高轨
        - label: 控制与生存能力
          detail: 公开描述强调抗辐射能力和冗余控制系统，而不是商品化小卫星航电配置。
          modules:
            - 抗辐射架构
            - 冗余航电
            - 飞行计算机、反作用轮、嵌入式航电和飞行软件的在轨应用履历
          outputs:
            - 更适合严苛轨道环境
        - label: 生产系统
          detail: K2 的产品承诺既取决于卫星设计，也取决于工厂吞吐量和垂直整合。
          modules:
            - 公开目录显示垂直整合度为 85%
            - 180,000 sq ft 的 Torrance 工厂
            - 年产 100 颗卫星的目标
          outputs:
            - 可能形成制造杠杆，但也伴随规模化风险
        - label: 有效载荷集成
          detail: 客户有效载荷能否承载，取决于指定证据中尚未公开的接口和配套资料。
          modules:
            - 有效载荷甲板和功率分配
            - 任务专用机械及数据接口
            - 供应商提供的数据表和 ICD
          outputs:
            - 集成前仍需开展私下技术尽调
        - label: 资格认证与运营
          detail: 公开证明由组件飞行履历和地面推进测试组成，并非完整的已发布资格认证记录。
          modules:
            - 组件级在轨启动
            - 推进器全功率热试车
            - GRAVITAS 集成任务
          outputs:
            - 初步降低风险，但没有公开的舰队级可靠性统计
    approximationNotes: 具体功率、整合比例和吞吐量数据来自公开资料和公司材料，而非经审计的技术披露。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE009
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: K2 的客户推进路径从政府资助的验证开始，经过探路者任务，走向标志性星座订单，但重复采购尚未得到证明。
    data:
      items:
        - label: 政府研发切入
          actor: 空军和太空军创新采购方
          touchpoints:
            - Phase I 和 Phase II SBIR 或 STTR 奖项
            - 早期子系统和总线开发合同
        - label: 探路者任务打包
          actor: K2 和政府有效载荷赞助方
          touchpoints:
            - STRATFI 支持的 Gravitas 任务
            - 搭载式有效载荷集成和任务认证
        - label: 在轨证明点
          actor: 国家安全有效载荷用户
          touchpoints:
            - Gravitas 搭载客户有效载荷
            - LEO 至 MEO 的任务表现成为销售资产
        - label: 商业锚定客户
          actor: SES
          touchpoints:
            - 首批 28 条总线的 meoSphere 订单
            - 网络规模铺开前先交付探路者批次
        - label: 扩张项目
          actor: 太空军项目和国防团队
          touchpoints:
            - Enterprise Space Terminal 及其他任务项目
            - 若平台执行力保持，国防领域将更广泛采用
        - label: 可重复性测试
          actor: 未来客户和投资者
          touchpoints:
            - 持续交付至 2029 年及以后
            - 续约、集中度和客户满意度证明仍然缺失
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU007
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险主要集中在首次飞行执行、推进系统证明，以及少数可见交易对手的客户集中度上。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: Gravitas 首次飞行执行
          note: 任务时间表公开地从原计划的 2026 年 2 月推迟至 2026 年 3 月下旬目标。
          values:
            - label: 高
              note: 公开排期变动使发射时间仍然是现实风险。
            - label: 高
              note: 首次任务旨在降低平台风险，并验证面向客户的承诺。
            - label: 中
              note: 已开展资格认证工作，但指定证据仍缺乏在轨证明。
            - label: 高
              note: 一次失败或重大延误会同时冲击技术、客户和融资叙事。
        - label: 升轨推进可靠性
          note: 20 kW 推进堆栈是 K2 进入 MEO 论点的核心。
          values:
            - label: 中
              note: 公开描述称该系统对任务至关重要，但在此尚未得到独立的在轨验证。
            - label: 高
              note: 升轨失败会削弱整个多轨道价值主张。
            - label: 中
              note: K2 公开宣传自研推进系统，但指定样本缺乏详细的资格认证资料。
            - label: 高
              note: 在 Gravitas 端到端证明该堆栈之前，剩余暴露仍维持高位。
        - label: 政府 / 标杆客户集中度
          note: 可见需求仍由太空军利益相关方和少数已点名的商业项目支撑。
          values:
            - label: 中
              note: 即使完整管线更大，当前公开证明仍显示集中度较高。
            - label: 高
              note: 后续需求延迟或疲弱会拖慢工厂利用率和定价权。
            - label: 低-中
              note: 公开缓释措施主要是未来多元化，而非已有证据支持的广度。
            - label: 高
              note: 在重复订单扩展到头部关系之外前，下行风险仍然显著。
        - label: 资本密集度 / 稀释
          note: 在经常性收入完全清晰前扩张卫星和设施，可能迫使公司继续融资。
          values:
            - label: 中
              note: 风险取决于任务证明转化为现金回款型积压订单的速度。
            - label: 高
              note: 即使技术进展持续，稀释或更紧的融资条款也会侵蚀回报。
            - label: 低-中
              note: 公开缓释措施主要是持续成功募资，而非已披露的自我融资能力。
            - label: 高
              note: 在烧钱速度、现金跑道和合同现金时点仍未披露时，剩余暴露持续存在。
        - label: 合同 / 现金时点不透明
          note: 公开授标公告没有披露里程碑付款、验收测试或终止权。
          values:
            - label: 中
              note: 指定证据集已经存在不透明性。
            - label: 中-高
              note: 未知的现金时点可能扭曲营运资金需求和已报告积压订单的质量。
            - label: 低
              note: 公开渠道未发现除奖项本身之外的缓释措施。
            - label: 高
              note: 在审阅底层合同机制之前，剩余暴露维持高位。
        - label: 独立验证缺口
          note: 公开证据仍缺少数据表 / ICD，以及可见产品页面的买家评价。
          values:
            - label: 中
              note: 缺口可能很快弥合，但在当前指定样本中仍然可见。
            - label: 中
              note: 独立验证不足，增加了每项技术和客户主张的尽调负担。
            - label: 低
              note: 当前公开缓释仅限于供应商控制的页面或摘要页面。
            - label: 中-高
              note: 只有详细的技术和客户验证到位后，剩余暴露才会下降。
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据指向一家能力强、资金充足的平台公司，但最新价格仍取决于尚未披露的执行情况和私下经济数据。
    data:
      nodes:
        - id: financing
          label: 融资升级
          value: $3.0B Series C -> $6.8B Series D
          note: 观察到的私募估值在一轮融资内大幅重估。
        - id: proof
          label: 证明正在增强
          value: Gravitas launch + signed demand
          note: 到 2026 年，公开证据已超越纯概念层面的主张。
        - id: differentiation
          label: 产品差异化
          value: ~20-30 kW Mega platform
          note: 外部产品摘要支持其异常高的功率和升轨能力。
        - id: missing-economics
          label: 经济数据缺失
          value: Revenue, margin, burn, runway, terms undisclosed
          tone: warning
          note: 公开记录仍缺少评估每股价值所需的核心投资判断输入。
        - id: execution
          label: 依赖执行
          value: Backlog conversion + utilization + delivery
          tone: warning
          note: 外部评论仍将价值实现视为取决于执行。
        - id: recommendation
          label: 当前判断
          value: Track / do not chase price
          tone: warning
          note: 只有经济数据和运营证明追上估值时，才上调评级。
      edges:
        - from: financing
          to: proof
          label: 更高估值意味着更高的证明要求
        - from: proof
          to: differentiation
          label: 技术野心解释了投资者的兴趣
        - from: differentiation
          to: missing-economics
          label: 仅有能力不足以支撑价格判断
        - from: missing-economics
          to: execution
          label: 剩余价值取决于交付
        - from: execution
          to: recommendation
          label: 在证明累积之前，价格纪律保持严格
    approximationNotes: 该流程是定性的，反映因果投资判断逻辑，而非量化估值模型。
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV013
      - CV014
