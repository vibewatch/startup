      - number: '1.3'
        title: 融资历史、运营规模与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              K2 的增长故事比财务质量更容易获得证据。Payload 报道 NewSpace Capital 投资后融资 $195 million，并将这笔资金与一座 180,000-square-foot 的加州工厂及每年
              100 颗卫星的产能目标联系起来。随后 SatNews 报道了 $110 million 的 Series B 和超过 $50 million 的合同；NewSpaceTracker 与 Indexed.vc
              则描述了后续 Series C 和 Series D 融资，使累计资本进入约 $944.5 million 至 $1 billion-plus
              的区间。这些目录还暗示估值和员工规模大幅上升，但当前资料包缺少主要融资文件和经审计的公司财务数据，因此资本总额、估值和员工数只能视为近期报道，尚未完全核实。
