              在指定来源中，K2 的公开切入点始终一致：相比典型星座级卫星，载荷质量、功率和轨道灵活性明显更高，同时公开报价叙事远低于传统大型卫星项目。同一批资料也说明了买方为何会认真看待这一比较，而不只把它当营销：K2 拥有
