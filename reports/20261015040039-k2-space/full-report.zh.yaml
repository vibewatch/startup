  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >
              留存证据支持这样一个市场边界：采购高功率卫星平台，用于需要比标准星座级小卫星更大载荷质量、更高机载功率和更强轨道灵活性的任务。各来源反复把 K2 放在商业通信、国家安全、民用政府和科学任务周围，覆盖
              LEO、MEO 和
              GEO，而不是某一个狭窄任务细分领域。纳入的支出因此是航天器平台及其任务所需的硬件栈；不纳入的包括发射服务、仅载荷采购、下游分析，以及不随平台架构变化的软件层。主要的现状替代方案是用更多卫星完成同一任务的小型
              LEO 星座，以及成本更高、但在能力、成本、周期和制造假设上不同的传统 GEO 或 MEO 航天器。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM014
      - number: '2.2'
        title: 受证据约束的规模评估
        blocks:
          - type: paragraph
            body: >
              公开证据没有为 K2 提供清晰的 TAM、SAM 和 SOM
              模型。可支撑的规模判断来自一些决定该产品类别能否获得采用的技术和商业代理指标：载荷功率、载荷质量、升轨能力、平台参考价格、计划工厂吞吐量和早期合同量。Payload 的报道尤其重要，因为它把市场切入点描述为
              MEO 的星座经济性：K2 认为，部分场景可以用明显少于可比 LEO 设计的卫星数量实现全球覆盖。这些数字本身不等于市场规模，但界定了 K2 的价值主张可能达到内部 ROI
              门槛的买方群体。实际结论是，在管理层提供自下而上的销售管线或分部支出模型之前，任何估值模型都应把公开市场规模主张视为方向性信息。
