      - number: '5.4'
        title: 控制缺口与技术投资风险
        blocks:
          - type: paragraph
            body: >
              投资判断的难点不是理解 K2 的野心，而是检验其架构和可靠性故事目前有多少可以由外部独立观察。一页公开产品页面明确写着没有公开数据表，并要求买方向供应商索取数据表或
              ICD；指定资料池也没有公开状态页、安全/合规文件，或开放的开发者和从业者遥测。独立评论还指出典型的航空航天扩产问题：如何从少量卫星和首次任务，转向可重复、质量受控的生产，同时不牺牲交付、成本或在轨可靠性。这些缺失材料并不否定产品逻辑，但让技术尽调仍高度依赖管理层资料。
