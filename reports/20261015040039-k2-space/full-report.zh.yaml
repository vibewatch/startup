      - number: '4.3'
        title: 投资判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，K2 像一家资本密集型航空航天制造商，市场拉力明显，但收入质量的证明仍不完整。公开记录对公开报价、已签需求、生产野心和融资节奏的披露，远强于对实际
              ASP、毛利率、客户集中度、营运资金需求、资本开支、烧钱或现金跑道的披露。这种不平衡不否定机会；它意味着任何投资判断仍取决于私下尽调材料，说明合同积压能多快转化为交付的平台，以及工厂利用率能否在下一次融资前带来可接受的硬件利润率。
            claimRefs:
              - CI007
              - CI009
              - CI012
              - CI014
              - CI015
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              K2 的产品不是狭窄的子系统，而是可复用的卫星平台，旨在让客户从小卫星的取舍转向数量更少但能力更强的航天器。第三方产品资料把 Mega Class
              描述为面向商业、科学和国家安全任务的多轨道平台，差异化来自更高的载荷质量、更高的功率，以及先搭载进入
              LEO、再自行升入更高轨道的能力。放到客户工作流里，这一点很重要：价值主张并不只是“更大的卫星”，而是为需要更多功率、更强抗辐射能力或更多机载处理能力、且传统星座级平台在同等价格下无法满足的运营商，提供减少发射次数的基础设施。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE010
              - CE015
