          - type: paragraph
            body: >-
              现有证据显示，成本结构主要由制造扩产、垂直整合、推进和电源硬件、测试基础设施以及交付执行主导，而不是低边际成本的软件经济性。公开来源把近期融资直接与工厂建设、供应链、招聘和组件内制联系起来；产品描述则强调垂直整合的硬件栈，以及最终实现年产
              100 颗卫星的目标。这也解释了当前投资判断的难点：关键不再是发现顶线需求，而是判断 K2 能否在重复在轨表现得到证明之前完成工业化，同时不出现利润率下滑、进度延误或新的资金需求。
