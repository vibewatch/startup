            body: >
              K2 已从单一产品公告推进到公开披露的产品家族和任务序列，但成熟度并不均衡。GRAVITAS 是当前验证载体，获得 Space Force STRATFI 奖项支持，并被描述为首个搭载多个载荷的完整 Mega
              Class 任务。除此之外，公开资料把 Trinity 列为下一轮任务，把 Giga Class 列为面向重型运载火箭的长期扩展路径。这说明 K2
              正试图把一套平台架构变成制造平台，服务多个轨道环境和载荷类别。风险在于，路线图的广度已经领先于对可重复在轨表现的广泛独立验证。
