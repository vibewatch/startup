companyProfile:
  summary: >-
    K2 Space 是一家总部位于 Torrance、成立于 2022 年的私人卫星制造商，由兄弟 Karan 和 Neel Kunjur 创办。公司面向商业、国防和科学任务，在 LEO、MEO、GEO
    及地月轨道等轨道环境销售大型高功率 Mega Class 卫星平台；其制造模式高度垂直整合，任务理念则是用更少、能力更强的航天器完成任务。如今公开证据已包括扩建后的 Torrance 工厂、Gravitas 任务、已披露的 SES
    星座订单，以及 2026 年 7 月的 Series D；但管理层财务数据和股权结构条款尚未公开，运营全貌仍不完整。
