              指定资料池支持一个相当具体的架构故事。公开描述一致指向垂直整合的硬件栈：K2 自制关键组件，并在同一平台中组合抗辐射航电、冗余控制系统和高功率电推进。最有力的验证点仍来自公司自身：K2
              称其首次演示任务为飞控计算机、反作用轮、嵌入式航电和飞行软件积累了飞行验证，并称 20 kW
              霍尔推力器已经完成满功率热试车。这比泛泛的营销文案具体得多，但仍属于舰队化生产前的证据，而不是跨客户和跨任务反复运行的历史。
