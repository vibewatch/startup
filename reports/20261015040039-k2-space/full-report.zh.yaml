            body: >-
              融资背景足以让 K2 保持可投资性，但还不足以把 Series D 估值变成一笔由公开证据支持的便宜交易。K2 称 Series C 的完成建立在 $500 million 已签合同之上；Series D
              披露则把这一数字推高到超过 $1 billion，同时累计融资也超过 $1 billion。独立总结大体认可融资规模和 2026 年 3 月 Gravitas
              发射，这说明公司的故事不只是幻灯片和招聘动能。即便如此，最清晰的独立下行信号仍是：外部观察者把估值上行视为取决于执行、客户采用和成功交付。在收入、毛利率或现金流尚未披露的情况下，最干净的公开投资判断方法仍是以已观察到的融资价格为锚，建立里程碑驱动的情景区间，而不是套用可比公司倍数。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 尽调阻塞点与论点破坏
        blocks:
          - type: paragraph
            body: >-
              剩余阻塞点不在于 K2 是否有野心，而在于当前价格是否已经透支了太多未来成功。第三方产品摘要支持 Mega
              平台在其细分领域能力异常强的判断，但其中一份摘要同时称目前没有公开数据表，使外部人士无法仅凭公开材料检验性能假设、子系统成熟度或客户适配性。更重要的是，公司尚未公开收入、利润率、烧钱、现金跑道、股权结构或优先权层级等细节，无法把已签合同和融资转化为每股经济性。如果首次飞行验证、积压变现或工厂利用率在披露缺口弥合前出现滑坡，投资逻辑就会失效。
            claimRefs:
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪，不追高
            body: K2 在战略上重要性上升、验证也越来越多，但在没有私下财务和合同质量尽调之前，公开证据仍不足以支持按 Series D 估值追入。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV013
              - CV016
          - type: callout
            title: 反向论点聚焦转化，而非认知度
            body: 核心下行风险不是 K2 缺少资本或野心，而是已签需求和技术里程碑可能无法足够快地转化为收入和有吸引力的融资条款，从而支撑 $6.8 billion 的价格。
            calloutType: risk
            claimRefs:
              - CV007
              - CV014
              - CV016
          - type: callout
            title: 最干净的升级触发点是证据，而非叙事
            body: 要升级为可投资标的，需要私下财务披露、合同经济性，以及客户或任务证据，缩小 K2 的战略故事与可投资现金创造能力之间的差距。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV011
              - CV013
