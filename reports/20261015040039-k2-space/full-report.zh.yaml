chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台论点
        blocks:
          - type: paragraph
            body: >-
              K2 Space 将自己定位为大型高功率卫星平台制造商，而不是又一家小卫星平台供应商。官方产品页面称其平台面向 LEO、MEO、GEO 以及地月轨道或深空任务；第三方资料也一致将公司所在地写为
              Torrance，并将成立年份定为 2022
              年。产品主张很明确：用更大的平台、更高的功率和更多的载荷质量，服务小型星座级航天器无法以经济方式完成的任务。因此，后续章节最有力的事实基础是公司身份和架构野心，而不是收入规模或市场份额。
