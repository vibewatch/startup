    - name: Neel Kunjur
      role: 联合创始人兼 CTO
      claimRefs:
        - CO014
  headquarters: Torrance, California
  productSummary: 面向商业、民用和国家安全任务、覆盖多个轨道环境的高功率 Mega Class 卫星平台及相关航天器平台。
  customerFocus: 商业卫星运营商、美国政府和国防项目，以及需要较高载荷功率和质量的科学或基础设施任务。
  businessModel: 通过销售卫星平台获得硬件收入和任务项目收入，同时承接客户出资的演示任务及集成工作量较大的任务合同。
