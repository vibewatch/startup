        blocks:
          - type: paragraph
            body: >-
              现有来源池指向的是一个宽泛的竞争场，而不是一份整齐的直接点名对手清单。K2 的定位一端明确针对大规模部署的 LEO
              方案，另一端则针对成本高得多的传统高能力卫星。这个框架很关键，因为买方可以用多种方式解决同一任务：接受小卫星的功率和载荷限制，购买更昂贵的传统大型卫星架构，委托定制项目，或等待新一代重型运载时代的平台成熟。公开创业公司目录进一步扩大了竞争范围，把
              K2 与大量太空基础设施公司归在一起。这有助于判断哪些公司可能争夺客户信任和人才，但噪声太大，单凭目录无法形成精确的直接同业名单。
