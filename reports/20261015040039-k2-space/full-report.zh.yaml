      - number: '1.2'
        title: 领导层集中与治理披露
        blocks:
          - type: paragraph
            body: >-
              留存资料显示，公司由兄弟 Karan 和 Neel Kunjur 共同创办，Karan 任 CEO，Neel 任 CTO。这让 K2
              的创始故事与产品及技术执行紧密相连，但也把产品、融资和任务可信度集中在一个规模很小的团队中。同一批公开资料对正式治理披露明显不足：没有披露董事会构成、观察员权利或独立监督。就尽调而言，本章可以支持“创始人主导、对关键人物依赖度较高”的运营模式判断，但无法据此将治理尽调推进到更高结论。
