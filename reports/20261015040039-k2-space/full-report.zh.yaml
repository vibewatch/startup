      - number: '3.3'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              让 K2 有吸引力的同一批证据，也定义了其被替代的风险。Aviation Week
              明确指出，这一论点依赖更低的重型运载发射成本；而更广泛的行业多年来一直围绕更小卫星优化。如果重型运载经济性不及预期，现有大型平台供应商压低价格，或小卫星架构继续缩小性能差距，K2
              的中间位置就更难守住。公开证据也仍不对称：资料池中关于 K2 自身产品的陈述很多，但关于点名竞争对手的定价、打包方式和合同条款，数据少且不一致。因此，护城河主张应视为合理但尚未独立对照完整同业集合验证。
