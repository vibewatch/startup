      - CV007
      - CV009
      - CV011
      - CV013
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Gravitas 及后续任务验证集成系统，同时 SES、国防和其他订单储备转化为可见收入和工厂负荷。
        - 要维持或超过 $6.8B 估值，必须证明 K2 能以可接受利润率和有限稀释将超过 $1B 的已签需求变现。
        - 尽管有技术证据，收入转化或制造执行仍然落后。
        - 可能发生，但公开来源证据仍然稀薄。
      - - 基准
        - K2 持续融资并赢得业务，但公开证据仍更多证明需求信号和产品野心，而非单位经济性。
        - $3B-$6.8B 区间仍是最有依据的公开范围，因为它锚定已观察到的私人市场估值，而非无支撑的收入倍数。
        - 财务不透明使外部投资者无法区分高质量执行和高溢价叙事。
        - 与当前证据集最一致。
      - - 悲观
        - 在 K2 证明工厂利用率和收入实现可重复之前，飞行表现、订单储备质量或融资条款令人失望。
        - 如果市场开始依据延迟的验证和更苛刻的融资条款，而非增长预期为 K2 定价，估值跌破 $3B Series C 水平就变得可能。
        - 下轮融资风险、倍数压缩或优先权悬垂，会叠加普通的航空航天执行风险。
        - 如果公开证据停滞，这是关键下行路径。
    notes: 估值区间是与已观察融资估值和里程碑证据挂钩的情景锚点，不是精确公允价值估计；本章缺少更严谨投资判断所需的公开收入、利润率和股权表数据。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV013
