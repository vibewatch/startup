      - number: '2.3'
        title: 买方、采用路径与约束
        blocks:
          - type: paragraph
            body: >
              来源指向四类买方：商业网络运营商、国家安全任务、民用或科学项目，以及需要更高能力平台的其他星座运营商。无论哪一类，用户都不是泛泛的“太空”客户，而是要在“用更多小平台”与“让每个节点拥有更高功率和更大载荷、从而减少卫星数量”之间做选择的任务团队。留存证据中的采用驱动因素相当一致：更低的发射成本假设、部分
              MEO 架构减少卫星数量的吸引力、更高的载荷功率、抗辐射能力，以及 K2
              对垂直整合和量产的承诺。约束同样清楚：公开材料没有披露具体预算归属或采购步骤；重复订单的独立证据仍有限；价值逻辑取决于制造规模、任务执行和在轨表现，而不只是融资。
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM012
              - CM014
      - number: '2.4'
        title: 矛盾与待补尽调缺口
        blocks:
          - type: paragraph
            body: >
              留存来源保留了重要矛盾，没有靠猜测强行统一。公开产品摘要对载荷功率的数字并不一致：一个来源称超过 20 kW，另一个给出 20 kW 对 2 kW 的比较，还有一个列出最高 30 kW
              的峰值载荷功率。这更可能是测量口径问题，而不是证明某个数字必然错误；但它仍很重要，因为市场规模、定价权和任务可行性都取决于买方实际购买的性能口径。同样重要的是，现有资料池没有披露公开 TAM、SAM 或
              SOM、分部级支出模型，或按买方类别列出的预算负责人。因此，本章以明确的证据缺口收尾，而不是给出虚假的精确市场模型。
            claimRefs:
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场逻辑本质上是任务经济性逻辑
            body: K2 的公开市场叙事最有力的地方，是更少的高功率卫星能够替代规模大得多的 LEO 星座，或更昂贵的定制高轨航天器；它并不是建立在泛泛的太空行业 TAM 足够大之上。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM014
          - type: callout
            title: 公开市场证据仍高度依赖代理指标
            body: 留存来源展示了有意义的合同和产品信号，但尚未披露可辩护的公开 TAM、预算负责人地图，或能统一所有核心规格的性能口径。
            calloutType: risk
            claimRefs:
              - CM010
