figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of the main architecture classes competing for the same job, using the assigned
      evidence to score capability headroom and public affordability/deployment accessibility.
    data:
      xAxis:
        label: Capability / orbit headroom (ordinal)
        min: 1
        max: 5
        lowLabel: narrow
        highLabel: broad
        description: Higher values reflect more public evidence for power, payload, and orbit flexibility.
        scale: 1-5 ordinal synthesis
      yAxis:
        label: Public affordability / deployment accessibility (ordinal)
        min: 1
        max: 5
        lowLabel: custom / expensive
        highLabel: easier public affordability narrative
        description: Higher values reflect lower public price claims and easier deployment narratives in retained sources.
        scale: 1-5 ordinal synthesis
      points:
        - label: K2 Space
          x: 4
          y: 3
          note: Claimed to bridge higher-capability missions and a lower public price point.
          claimRefs: [CP003, CP005, CP007, CP009, CP010]
        - label: Smallsat status quo
          x: 2
          y: 4
          note: Prevailing market direction with easier proliferation, but tighter SWaP limits.
          claimRefs: [CP005, CP006]
        - label: Traditional large satellites
          x: 4
          y: 1
          note: Highest public capability benchmark in the assigned pool, but also the most expensive.
          claimRefs: [CP005]
        - label: Prime-led custom build
          x: 5
          y: 1
          note: Maximum tailoring, with the lowest public standardization and the highest diligence burden.
          claimRefs: [CP014]
        - label: Heavy-lift-era entrants
          x: 4
          y: 2
          note: Could match K2's ambition if heavy-lift economics and adjacent space capital converge.
          claimRefs: [CP004, CP015]
        - label: Public private-peer set
          x: 3
          y: 2
          note: Open-web peer directories are useful for context but too noisy for a clean direct-comp scorecard.
          claimRefs: [CP015, CP016]
    approximationNotes: >-
      Coordinates are analyst-authored ordinal synthesis from the retained evidence, not vendor-
      published benchmark scores; they rank classes against each other rather than measure market
      share or conversion.
    claimRefs: [CP004, CP005, CP006, CP007, CP009, CP010, CP014, CP015, CP016]
callouts:
  - calloutType: insight
    title: K2's real rival is the architecture choice
    body: >-
      The cleanest public comparison is not K2 versus one disclosed named peer; it is K2 versus
      the buyer's choice between smallsat proliferation, legacy large buses, and bespoke builds.
    claimRefs: [CP003, CP005, CP006, CP013, CP016]
  - calloutType: risk
    title: Public moat evidence is still thinner than the marketing wedge
    body: >-
      The assigned pool gives enough evidence to see K2's wedge, but not enough independent
      named-peer pricing and contract detail to treat that wedge as fully benchmarked.
    claimRefs: [CP004, CP010, CP015, CP016]
