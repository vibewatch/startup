  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The residual risk stack is dominated by first-flight execution, propulsion proof, and concentration around a few
      visible counterparties.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Gravitas first-flight execution
          note: Mission timing moved publicly from February 2026 planning to a late-March 2026 target.
          values:
            - label: High
              note: Public schedule movement kept launch timing live risk.
            - label: High
              note: The first mission is meant to de-risk the platform and validate customer-facing promises.
            - label: Medium
              note: Qualification work exists, but assigned evidence still lacked on-orbit proof.
            - label: High
              note: A failure or major delay would hit technical, customer, and financing narratives at once.
        - label: Orbit-raise propulsion reliability
          note: The 20 kW propulsion stack is central to K2's MEO access thesis.
          values:
            - label: Medium
              note: The system is publicly described as mission-critical but not yet independently verified in orbit here.
            - label: High
              note: Orbit-raise failure weakens the entire multi-orbit value proposition.
            - label: Medium
              note: >-
                K2 publicizes in-house propulsion development, but the assigned pool lacks detailed qualification
                artifacts.
            - label: High
              note: Residual exposure stays high until Gravitas proves the stack end to end.
        - label: Government / flagship-customer concentration
          note: Visible demand is still anchored by Space Force stakeholders and a small set of named commercial programs.
          values:
            - label: Medium
              note: Concentration is visible in current public proof even if the full pipeline is larger.
            - label: High
              note: Delayed or weak follow-on demand would slow factory utilization and pricing power.
            - label: Low-Medium
              note: Public mitigants are mostly future diversification rather than already-evidenced breadth.
            - label: High
              note: The downside remains meaningful until repeat orders broaden beyond headline relationships.
        - label: Capital intensity / dilution
          note: Scaling satellites and facilities ahead of fully visible recurring revenue can force more financing.
          values:
            - label: Medium
              note: The risk depends on how quickly mission proof converts into cash-paying backlog.
            - label: High
              note: Dilution or tighter financing terms can erode return even if technical progress continues.
            - label: Low-Medium
              note: Public mitigation is mostly continued fundraising success rather than disclosed self-funding capacity.
            - label: High
              note: Residual exposure persists while burn, runway, and contract cash timing remain undisclosed.
        - label: Contract / cash-timing opacity
          note: The public award announcement does not disclose milestone payments, acceptance tests, or termination rights.
          values:
            - label: Medium
              note: Opacity is already present in the assigned evidence set.
            - label: Medium-High
              note: Unknown cash timing can distort working-capital needs and reported backlog quality.
            - label: Low
              note: No public mitigation was surfaced beyond the existence of the award itself.
            - label: High
              note: Residual exposure stays high until the underlying contract mechanics are reviewed.
        - label: Independent validation gap
          note: Public evidence still lacks a datasheet / ICD and buyer reviews for the visible product pages.
          values:
            - label: Medium
              note: The gap may close quickly, but it remained visible in the current assigned pool.
            - label: Medium
              note: Thin independent validation raises diligence burden on every technical and customer claim.
            - label: Low
              note: The current public mitigation is limited to supplier-controlled or summary pages.
            - label: Medium-High
              note: Residual exposure falls only after detailed technical and customer validation arrives.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence points to a capable, well-financed platform company, but the latest price still depends on
      execution and private economics that are not yet disclosed.
    data:
      nodes:
        - id: financing
          label: Financing step-up
          value: $3.0B Series C -> $6.8B Series D
          note: Observed private marks re-rated sharply within one funding cycle.
        - id: proof
          label: Proof is improving
          value: Gravitas launch + signed demand
          note: Public evidence moved beyond concept-only claims by 2026.
        - id: differentiation
          label: Product differentiation
          value: ~20-30 kW Mega platform
          note: Outside product summaries support unusually high power and orbit-raise capability.
        - id: missing-economics
          label: Missing economics
          value: Revenue, margin, burn, runway, terms undisclosed
          tone: warning
          note: The public record still lacks the core underwriting inputs for per-share value.
        - id: execution
          label: Execution dependency
          value: Backlog conversion + utilization + delivery
          tone: warning
          note: Outside commentary still treats value realization as contingent on execution.
        - id: recommendation
          label: Current call
          value: Track / do not chase price
          tone: warning
          note: Upgrade only if economics and operational proof catch up to valuation.
      edges:
        - from: financing
          to: proof
          label: Higher mark implies stronger proof expectations
        - from: proof
          to: differentiation
          label: Technical ambition explains investor interest
        - from: differentiation
          to: missing-economics
          label: Capability alone is not enough to underwrite price
        - from: missing-economics
          to: execution
          label: Remaining value depends on delivery
        - from: execution
          to: recommendation
          label: Price discipline stays strict until proof compounds
    approximationNotes: The flow is qualitative and reflects causal underwriting logic rather than a quantified valuation model.
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV013
      - CV014
