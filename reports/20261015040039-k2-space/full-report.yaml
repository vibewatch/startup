      - number: '5.3'
        title: Deployment maturity, roadmap, and product-line breadth
        blocks:
          - type: paragraph
            body: >
              K2 has progressed beyond a single product announcement into a disclosed product family and mission
              sequence, but the maturity profile is uneven. GRAVITAS is the current proof vehicle, backed by a Space
              Force STRATFI award and described as the first full Mega Class mission carrying multiple payloads. Beyond
              that, public profiles cite Trinity as the next campaign and Giga Class as the longer-horizon expansion
              path for heavy-lift launchers. The implication is that K2 is trying to turn one bus architecture into a
              manufacturing platform that can serve multiple orbital regimes and payload classes. The risk is that
              roadmap breadth now extends ahead of broad independent proof of repeatable on-orbit performance.
            claimRefs:
              - CE007
              - CE008
              - CE014
      - number: '5.4'
        title: Control gaps and technical underwriting risks
        blocks:
          - type: paragraph
            body: >
              The underwriting challenge is not understanding K2's ambition; it is testing how much of the architecture
              and reliability story is independently observable today. A public product page explicitly says there is no
              public datasheet and asks buyers to request the datasheet or ICD from the supplier, while the assigned
              pool contains no public status page, security/compliance documentation, or open developer or practitioner
              telemetry. Independent commentary also flags the classic aerospace scale-up problem: moving from a handful
              of satellites and first missions to repeatable, quality-controlled production without slipping delivery,
              costs, or in-orbit reliability. Those missing artifacts do not invalidate the product thesis, but they do
              keep technical diligence dependent on management materials.
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: More concrete than a concept deck
            body: >
              K2's technical story has progressed from ambition to subsystem and mission evidence: the pool includes
              component-level in-space heritage, a full-power thruster hot-fire, a named first mission, and a scaled
              factory narrative.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE014
          - type: callout
            title: Public diligence still depends heavily on management-controlled evidence
            body: >
              The strongest validation artifacts in the assigned pool are still company-issued or directory-derived, and
              the absence of a public datasheet, ICD, security/status material, or developer/practitioner telemetry
              limits independent technical underwriting.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
