      - number: '5.2'
        title: Architecture, manufacturing model, and current proof points
        blocks:
          - type: paragraph
            body: >
              The assigned pool supports a reasonably specific architecture story. Public descriptions consistently
              point to a vertically integrated hardware stack, with K2 building critical components in house and pairing
              radiation-tolerant avionics, redundant control systems, and high-power electric propulsion in one
              platform. The strongest proof point is still company-issued: K2 says its first demonstration mission gave
              flight heritage to the flight computer, reaction wheel, embedded avionics, and flight software, and that
              the 20 kW Hall thruster has already been hot-fired at full power. That is more concrete than generic
              marketing copy, but it remains pre-fleet evidence rather than repeated operational history across
              customers and missions.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE013
