  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is real but still narrow
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports two paying-buyer surfaces for K2 today: commercial satellite operators and U.S.
              defense or government programs. The strongest commercial proof is SES, which independent reporting
              describes as an initial 28-bus commitment with a potential path toward roughly 100 spacecraft, while K2's
              broader platform directories consistently frame Mega Class as a standard bus meant to support multiple
              orbital and mission profiles rather than a bespoke one-off build. On the government side, the clearest
              proof comes from SBIR/STTR award history, the Space Force-backed Gravitas mission, and later program
              participation cited in secondary profiles. That is enough to show credible demand from both commercial and
              public-sector buyers, but not enough to show a broad, diversified installed base yet.
