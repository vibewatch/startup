chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform thesis
        blocks:
          - type: paragraph
            body: >-
              K2 Space presents itself as a builder of large, high-power satellite platforms rather than another
              small-satellite bus vendor. Official product surfaces describe platforms engineered for LEO, MEO, GEO, and
              cislunar or deep-space missions, while third-party profiles consistently place the company in Torrance and
              date the founding to 2022. The product proposition is explicit: use larger buses, higher power, and more
              payload mass to reach missions that smaller constellation-class spacecraft cannot serve economically. The
              strongest supported ground truth for later chapters is therefore identity plus architecture ambition, not
              revenue scale or market share.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership concentration and governance disclosure
        blocks:
          - type: paragraph
            body: >-
              The retained pack identifies the company as founder-led by brothers Karan and Neel Kunjur, with Karan
              serving as CEO and Neel as CTO. That gives K2 a coherent founding narrative tied to product and technical
              execution, but it also concentrates product, fundraising, and mission credibility in a narrow team. The
              same public pack is notably thin on formal governance: it does not disclose board composition, observer
              rights, or independent oversight. For diligence purposes, this chapter can support a founder-led operating
              model with meaningful key-person dependence, but it cannot clear governance diligence beyond that
              threshold.
            claimRefs:
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO014
              - CO015
      - number: '1.3'
        title: Funding history, operating scale, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              K2's growth story is easier to evidence than its financial quality. Payload reported $195 million in
              funding after a NewSpace Capital investment and linked that capital to a 180,000-square-foot California
              facility and a 100-satellite annual capacity target. SatNews then reported a $110 million Series B and
              more than $50 million in contracts, while NewSpaceTracker and Indexed.vc describe follow-on Series C and
              Series D financings that move cumulative capital into a roughly $944.5 million to $1 billion-plus band.
              Those directories also imply a sharp step-up in valuation and workforce scale, but because the current
              source pack lacks primary financing documents and audited company financials, capital totals, valuation,
              and headcount should be treated as recently reported rather than fully verified.
            claimRefs:
