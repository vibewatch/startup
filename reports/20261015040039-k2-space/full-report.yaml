      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, K2 looks like a capital-intensive aerospace manufacturer with meaningful market pull but
              still-incomplete proof of revenue quality. The public record is much stronger on list pricing, signed
              demand, production ambition, and fundraising cadence than on realized ASPs, gross margin, customer
              concentration, working-capital requirements, capex, burn, or runway. That imbalance does not negate the
              opportunity; it means any underwriting case still depends on private diligence materials showing how
              quickly contract backlog can convert into delivered buses and whether factory utilization can produce
              acceptable hardware margins before the next financing event.
            claimRefs:
              - CI007
              - CI009
              - CI012
