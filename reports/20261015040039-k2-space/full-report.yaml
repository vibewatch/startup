              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >
              K2's product is not a narrow subsystem but a reusable satellite-bus platform meant to move customers from
              small-satellite tradeoffs toward fewer, more capable spacecraft. Across third-party product profiles, Mega
              Class is described as a multi-orbit bus for commercial, science, and national-security missions, with the
              differentiation framed around higher payload mass, higher power, and the ability to ride-share into LEO
              before raising itself into higher orbits. That matters in customer workflow terms because the value
              proposition is not merely "bigger satellite"; it is lower launch-count infrastructure for operators that
              need more power, more radiation tolerance, or more onboard processing than conventional
              constellation-class platforms can provide at equivalent price points.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE010
              - CE015
