  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >
              The retained evidence supports a market boundary centered on procurement of high-power satellite buses for
              missions that need more payload mass, onboard power, and orbital flexibility than a standard
              constellation-class smallsat can provide. Across the sources, K2 is repeatedly positioned around
              commercial communications, national security, civil government, and scientific missions spanning LEO, MEO,
              and GEO rather than a single narrow mission niche. That means the included spend is the spacecraft
              platform and its mission-enabling hardware stack; excluded spend includes launch services, payload-only
              procurement, downstream analytics, and generic software layers that do not move with the bus architecture
              itself. The main status-quo substitutes are smaller LEO constellations that solve the job with many more
              satellites, and traditional higher-cost GEO or MEO spacecraft that deliver capability but with different
              cost, schedule, and manufacturing assumptions.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing lens
        blocks:
          - type: paragraph
            body: >
              Public evidence does not provide a clean TAM, SAM, and SOM model for K2. Instead, the supportable sizing
              lens comes from technical and commercial proxies that determine whether this product category can win
              adoption: payload power, payload mass, orbit-raising capability, indicative bus price, planned factory
              throughput, and early contract volume. Payload's reporting is especially important because it frames the
              market wedge as constellation economics in MEO, where K2 argues some use cases can achieve global coverage
              with materially fewer satellites than a comparable LEO design. Those figures do not equal market size on
              their own, but they do define the subset of buyers for whom K2's value proposition could clear internal
              ROI thresholds. The practical conclusion is that any valuation model should treat public market size
              claims as directional until management provides a bottoms-up pipeline or segment-spend model.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM011
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM013
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >
              The sources point to four buyer clusters: commercial network operators, national-security missions, civil
              or scientific programs, and other constellation operators needing more capable buses. In each case, the
              user is not a generic "space" customer but a mission team choosing between more satellites with smaller
              buses and fewer satellites with more power and payload on each node. Adoption drivers are consistent
              across the retained evidence: lower launch-cost assumptions, the appeal of fewer satellites for some MEO
              architectures, higher payload power, radiation tolerance, and K2's promise of vertical integration and
              mass production. Constraints are just as clear. Public materials do not disclose precise budget ownership
              or procurement steps, independent proof of repeat orders is still limited, and the value case depends on
              manufacturing scale, mission execution, and on-orbit performance rather than on fundraising alone.
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM012
              - CM014
      - number: '2.4'
        title: Contradictions and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >
              The retained sources preserve important contradictions rather than resolving them by guesswork. Public
              product summaries are not numerically aligned on payload power, with one source describing more than 20 kW
              of payload power, another presenting a 20 kW versus 2 kW comparison, and another listing up to 30 kW of
              peak payload power. That is likely a measurement-basis problem rather than proof that one number is false,
              but it still matters because market size, pricing power, and mission feasibility all hinge on which
              performance basis the buyer is actually purchasing. Just as importantly, the assigned pool does not
              disclose a public TAM, SAM, or SOM; a segment-level spend model; or named budget owners by buyer class.
              This chapter therefore closes with explicit evidence gaps rather than a false-precision market model.
            claimRefs:
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market case is really a mission-economics case
            body: >-
              K2's public market narrative is strongest where fewer high-power satellites can replace a much larger LEO
              constellation or a more expensive bespoke high-orbit spacecraft, not where a generic space-industry TAM is
              large.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM014
          - type: callout
            title: Public market evidence is still proxy-heavy
            body: >-
              The retained sources show meaningful contract and product signals, but they do not yet disclose a
              defendable public TAM, budget-owner map, or reconciled performance basis for all headline specifications.
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer-set definition
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool points to a broad competitive field rather than a tidy list of direct named
              rivals. K2's own positioning is explicitly against proliferated LEO options on one side and much more
              expensive traditional high-capability satellites on the other. That framing matters because it means
              buyers can solve the same job in several ways: accept smallsat power and payload limits, buy a more
              expensive legacy large-satellite architecture, commission a custom program, or wait for newer
              heavy-lift-era platforms to mature. Public startup directories widen the field even further by grouping K2
              with a broad set of space-infrastructure companies, which is directionally useful for understanding who
              may compete for customer trust and talent, but too noisy to serve as a precise direct-peer list by itself.
