      - number: '1.4'
        title: Current status and visible execution risks
        blocks:
          - type: paragraph
            body: >-
              The current mission stack shows real progress but still leaves the valuation case dependent on execution.
              Official pages list Heritage as a successful January 2025 subsystem demonstration and Gravitas as
              operational on orbit after a March 2026 mission, while Starpath and NewSpaceTracker frame the Space
              Force-backed Gravitas program as a proof point for LEO-to-MEO operations and mixed commercial or
              national-security payloads. Even so, the adverse source in the pack keeps the risk framing grounded:
              future value depends on repeated mission delivery, customer adoption, manufacturing scale, competition,
              and access to capital. Put differently, K2 now has stronger public proof of ambition and program traction
              than it did in the prior report, but not yet enough transparent operating disclosure to make the current
              private valuation self-validating.
            claimRefs:
              - CO005
