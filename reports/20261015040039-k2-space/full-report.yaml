  - id: FE001
    title: Validated architecture stack and remaining proof gaps
    type: stack
    summary: >-
      Public evidence supports a layered bus architecture, but independent proof thins as the stack moves from component
      claims to repeatable fleet operations.
    data:
      layers:
        - label: Mission envelope
          detail: Mega Class is positioned as a reusable bus for payload-heavy missions across multiple orbital regimes.
          modules:
            - Up to 3,000 kg payload mass
            - Up to 30 kW peak payload power
            - LEO / MEO / GEO mission scope
          outputs:
            - Higher-capability commercial and national-security missions
        - label: Mobility and power
          detail: Propulsion and power are the core technical wedge behind K2's orbit-raise and launch-density thesis.
          modules:
            - 20 kW krypton Hall-effect thruster
            - LEO-to-MEO raise in under 90 days
            - Ten-bus stackable deployment model
          outputs:
            - Fewer launches and faster deployment into higher orbits
        - label: Control and survivability
          detail: >-
            Public descriptions emphasize radiation tolerance and redundant control systems rather than a commodity
            smallsat avionics profile.
          modules:
            - Radiation-tolerant architectures
            - Redundant avionics
            - In-space heritage for flight computer, reaction wheel, embedded avionics, and flight software
          outputs:
            - Better fit for harsher orbital regimes
        - label: Production system
          detail: K2's product promise depends on factory throughput and vertical integration as much as on satellite design.
          modules:
            - 85% vertically integrated profile in public directories
            - 180,000 sq ft Torrance factory
            - Target of 100 satellites per year
          outputs:
            - Potential manufacturing leverage, but also scale-up risk
        - label: Payload integration
          detail: >-
            Customer payload accommodation depends on interfaces and support artifacts that are not public in the
            assigned evidence.
          modules:
            - Payload deck and power allocation
            - Mission-specific mechanical and data interfaces
            - Supplier-provided datasheet and ICD
          outputs:
            - Private technical diligence remains necessary before integration
        - label: Qualification and operations
          detail: >-
            Public proof combines component flight heritage and a ground propulsion test rather than a complete
            published qualification record.
          modules:
            - Component-level in-space activation
            - Full-power thruster hot-fire
            - GRAVITAS integrated mission
          outputs:
            - Initial de-risking without public fleet-level reliability statistics
    approximationNotes: >-
      Specific power, integration share, and throughput figures come from public profiles and company materials rather
      than audited technical disclosure.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE009
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      K2's customer motion runs from government-funded validation to pathfinder missions, then into marquee
      constellation orders and still-unproven repeat procurement.
    data:
      items:
        - label: Government R&D entry
          actor: Air Force and Space Force innovation buyers
          touchpoints:
            - Phase I and Phase II SBIR or STTR awards
            - Early subsystem and bus development contracts
        - label: Pathfinder mission packaging
          actor: K2 and government payload sponsors
          touchpoints:
            - STRATFI-backed Gravitas mission
            - Hosted payload integration and mission qualification
        - label: On-orbit proof point
          actor: National security payload users
          touchpoints:
            - Gravitas carries customer payloads
            - LEO-to-MEO mission performance becomes a sales asset
        - label: Commercial anchor account
          actor: SES
          touchpoints:
            - Initial 28-bus meoSphere order
            - Pathfinder deliveries before network-scale rollout
        - label: Expansion programs
          actor: Space Force programs and defense teams
          touchpoints:
            - Enterprise Space Terminal and other mission programs
            - Broader defense adoption if platform execution holds
        - label: Repeatability test
          actor: Future customers and investors
          touchpoints:
            - Delivery cadence into 2029 and beyond
            - Renewal, concentration, and customer-satisfaction proof still missing
