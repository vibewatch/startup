  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              K2's public commercial story is a hardware and mission-delivery model, not a recurring software
              subscription. The company and third-party profiles consistently describe Mega Class as a high-power
              satellite bus sold into commercial and national-security missions, with public list-price anchors around
              $15 million per bus and a public contract pipeline that is still being converted from demonstrations into
              deliveries. The clearest public traction markers are the $60 million Gravitas mission, more than $1
              billion of reported signed contracts, and a third-party estimated revenue figure near $48.8 million, but
              none of the reviewed sources disclose how much of that traction is recognized revenue versus milestone
              backlog, customer-funded development, or forward purchase commitments.
