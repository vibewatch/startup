      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The same evidence that makes K2 interesting also defines the displacement risk. Aviation Week's framing is
              explicit that the thesis leans on lower heavy-lift launch costs, while the broader industry has spent
              years optimizing around smaller satellites. If heavy-lift economics slip, if incumbent large-bus vendors
              compress price, or if smallsat architectures keep closing the performance gap, K2's middle position
              becomes harder to defend. Public evidence is also still asymmetrical: the assigned pool provides many
              statements about K2's own product and only thin, inconsistent data on named rival pricing, packaging, and
              contract terms. That means moat claims should be read as plausible but not yet independently benchmarked
              against a fully disclosed peer set.
            claimRefs:
              - CP004
              - CP006
              - CP009
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: K2's real rival is the architecture choice
            body: >-
              The cleanest public comparison is not K2 versus one disclosed named peer; it is K2 versus the buyer's
              choice between smallsat proliferation, legacy large buses, and bespoke builds.
            calloutType: insight
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP013
              - CP016
          - type: callout
            title: Public moat evidence is still thinner than the marketing wedge
            body: >-
              The assigned pool gives enough evidence to see K2's wedge, but not enough independent named-peer pricing
              and contract detail to treat that wedge as fully benchmarked.
            calloutType: risk
