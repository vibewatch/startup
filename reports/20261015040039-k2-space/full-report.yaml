      - number: '6.2'
        title: Adoption trajectory is backlog-led and demonstration-led
        blocks:
          - type: paragraph
            body: >-
              K2's adoption curve is visible, but it is still better evidenced through awards, pathfinders, and
              announced backlog than through recurring service or renewal metrics. SBIR.gov shows a fast ramp in
              government-funded programs starting in 2023, the 2024 STRATFI announcement ties Gravitas to a $60 million
              Space Force-backed mission, and independent 2026 coverage ties SES to K2's first large commercial
              constellation order. Venture Atlas then layers on a broader claim of more than $1 billion in signed
              commercial and government contracts. The connective logic is plausible: early R&D awards become
              demonstration missions, then marquee commercial and defense wins. The remaining execution gap is whether
              those wins convert into steady deliveries before 2029 and into repeat procurement after initial
              pathfinders.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU007
              - CU011
              - CU012
      - number: '6.3'
        title: Durability and concentration remain the open questions
        blocks:
          - type: paragraph
            body: >-
              The public record is notably thinner on retention, expansion after first delivery, and concentration. None
              of the reviewed sources disclose NRR, GRR, churn, contract length, cohort behavior, or a customer-count
              denominator, and the public proof set is heavily concentrated around SES plus a small number of U.S.
              government or defense programs. Even the available marketplace evidence is mixed: NewSpace Market lists no
              buyer reviews yet, while Augustus Wealth explicitly frames future value as contingent on execution,
              adoption, and successful delivery rather than on funding headlines alone. That leaves the customer story
              investable only as a backlog-and-execution thesis, not yet as a demonstrated recurring-revenue or
              diversified installed-base thesis.
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial and defense demand both show up in named form
            body: >-
              SES, Space Force-backed missions, and SBIR/STTR award history collectively show that K2 is not relying on
              anonymous logo slides for its customer narrative.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU005
          - type: callout
            title: Durability is still unproven in public
            body: >-
              Public sources show contracts and missions, but not renewals, cohorts, NRR, or a disclosed top-customer
              mix, so concentration and repeatability remain diligence items.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Within the assigned public evidence pool, K2 still looks like a company whose downside is concentrated in
              one proving event. Gravitas is presented as the mission that will validate LEO and MEO operations,
              exercise the 20 kW orbit-raise stack, and turn the company's pricing and performance promises into proof
              points, which means a slip or underperforming first flight would hit technical credibility, customer
              conversion, and financing leverage at the same time. Public reporting also showed a moving launch window
              from a February 2026 mission plan to a late-March 2026 target, reinforcing that schedule execution
              remained live risk rather than a cleared milestone. Beyond first flight, K2 still depends on a small set
              of visible government and flagship-commercial relationships, while public evidence on compliance, contract
              structure, and repeat-order quality remains thin.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
      - number: '7.2'
        title: Regulatory and contract risk
        blocks:
          - type: paragraph
            body: >-
              The clearest legal and regulatory risk is not a public enforcement event; it is missing evidence around
              what the company must satisfy to turn defense-adjacent mission work into repeatable revenue. K2's own
              announcement says Gravitas is backed by multiple Department of the Air Force stakeholders and will carry
              national security payloads, but the assigned public pool does not establish the underlying export-control,
              mission-assurance, cyber, or customer-security approvals that would normally matter for this class of
              work. The same gap applies to contract economics: the existence of a $60 million award is public, but
              milestone payments, acceptance tests, cancellation rights, and cash-timing mechanics are not. That keeps
              residual exposure high until diligence moves from press-level evidence to primary documents.
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR014
              - CR015
      - number: '7.3'
        title: Operational and technical risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, K2 is trying to prove several hard things at once: a vertically integrated hardware model,
              a first on-orbit demonstration, and a propulsion system positioned as central to the LEO-to-MEO value
              proposition. Public sources say 75% of components are built in-house, including reaction wheels, flight
              computers, and solar arrays, and that the company is developing a 20 kW electric propulsion stack for
              rapid orbit raise. Those choices can improve control and unit economics, but they also enlarge the
              internal execution surface: manufacturing yield, test throughput, propulsion reliability, and
              radiation-hard performance all need to work before the platform is meaningfully de-risked. Publicly
              available product pages still lack a datasheet or ICD, so outside investors cannot independently verify
              the detailed reliability assumptions behind the ambition.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.4'
        title: Dependency and financing risk
        blocks:
          - type: paragraph
            body: >-
              K2's dependency map remains concentrated. The visible government side is anchored by Space Force and
              broader Air Force participation around Gravitas, while the visible commercial side still leans heavily on
              flagship proof points such as SES collaboration and a reported signed-contract backlog rather than a
              broad, publicly evidenced base of repeat operating customers. The first mission is also linked to a Falcon
              9 launch schedule, so launch-provider delay can postpone technical proof even if the spacecraft itself is
              ready. Financially, Augustus Wealth's summary captures the key model risk: valuation and equity upside
              still depend on execution, customer adoption, and successful delivery, while future funding can dilute
              existing holders if the company has to keep scaling ahead of fully visible recurring revenue.
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR011
      - number: '7.5'
        title: Kill criteria and diligence
        blocks:
          - type: paragraph
            body: >-
              The most useful diligence posture is to convert these risks into explicit pass-fail tests. The thesis
              materially weakens if K2 cannot show a completed launch, successful orbit raise, and stable on-orbit
              power/performance from Gravitas within a timeframe that still preserves customer momentum. It also weakens
              if follow-on demand remains concentrated in one or two government or flagship-commercial programs rather
              than converting into repeatable backlog with disclosed payment and acceptance terms. Before underwriting a
              fresh step-up in valuation, diligence should require the contract pack behind the $60 million award,
              technical qualification artifacts for propulsion and radiation tolerance, and enough customer evidence to
              distinguish signed intent from durable factory utilization.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A failed or materially delayed Gravitas launch-and-orbit-raise sequence would break the current public
              thesis that K2 can deliver MEO-class performance at an approximately $15 million per-bus price before
              scaling production.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
          - type: callout
            title: Minimum diligence package before underwriting
            body: >-
              Before a fresh valuation step-up is underwritten, diligence should clear the contract structure behind the
              $60 million award, the propulsion / radiation qualification package, and whether headline customer proof
              translates into repeat orders rather than one-off flagship programs.
            calloutType: assumption
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The latest public financing mark moved far faster than the publicly disclosed operating proof. K2's own
              releases show a jump from a $3.0 billion Series C in December 2025 to a $6.8 billion Series D in July
              2026, while outside databases and profiles mainly corroborate capital raised, contract volume, and
              platform ambition rather than realized revenue or margins. That makes valuation judgment price-sensitive
              rather than company-quality-only: public evidence supports that K2 is building toward a strategically
              important class of high-power buses, but it does not yet support paying through the last round without
              deeper diligence on contract conversion, burn, and liquidation economics. The right current call is track,
              with an upgrade only if operational proof and economics catch up to the mark.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV011
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.2'
        title: Scenario underwriting and financing context
        blocks:
          - type: paragraph
            body: >-
              The financing context is strong enough to keep K2 investable, but not strong enough to turn the Series D
              valuation into a public-evidence bargain. K2 said the Series C followed $500 million in signed contracts,
              and the Series D disclosure pushed that figure above $1 billion alongside cumulative funding above $1
              billion. Independent summaries broadly line up with the funding scale and the March 2026 Gravitas launch,
              which means the company now has more than slideware and hiring momentum behind the story. Even so, the
              clearest independent downside signal is that outside observers still frame valuation upside as contingent
              on execution, customer adoption, and successful delivery. Without disclosed revenue, gross margin, or cash
              flow, the cleanest public underwriting method is still a milestone-based scenario range anchored to
              observed financing marks instead of a comps-based multiple.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Diligence blockers and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The remaining blockers are less about whether K2 has ambition and more about whether the existing price
              already discounts too much future success. Third-party product summaries support the view that the Mega
              platform is unusually capable for its segment, but one of those same summaries also says there is no
              public datasheet yet, leaving outsiders unable to pressure-test performance assumptions, subsystem
              maturity, or customer-specific fit from public material alone. More importantly, the company has not
              publicly provided the revenue, margin, burn, cash runway, cap-table, or preference-stack detail needed to
              translate signed contracts and fundraising into per-share economics. The thesis breaks if first-flight
              proof, backlog monetization, or factory utilization slip before that disclosure gap closes.
            claimRefs:
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not chase
            body: >-
              K2 looks strategically relevant and increasingly validated, but public evidence still does not justify
              paying through the Series D mark without private financial and contract-quality diligence.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV013
              - CV016
          - type: callout
            title: Anti-thesis centers on conversion, not awareness
            body: >-
              The core downside is not that K2 lacks capital or ambition; it is that signed demand and technical
              milestones may not convert into revenue and attractive financing terms fast enough to support a $6.8
              billion price.
            calloutType: risk
            claimRefs:
              - CV007
              - CV014
              - CV016
          - type: callout
            title: The cleanest upgrade trigger is evidence, not narrative
            body: >-
              An investable upgrade needs private financial disclosure, contract economics, and customer or mission
              proof that narrow the gap between K2's strategic story and its underwritten cash generation.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV011
              - CV013
