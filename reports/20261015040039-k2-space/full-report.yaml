        title: Capability, pricing, and trust signals
        blocks:
          - type: paragraph
            body: >-
              K2's public wedge is consistent across the assigned sources: materially more payload mass, power, and
              orbit flexibility than typical constellation-class satellites, paired with a list-price narrative far
              below legacy large-satellite programs. The same pool also shows why buyers would take the comparison
              seriously instead of treating it as marketing alone. K2 has a Space Force-backed Gravitas mission,
              disclosed commercial and government payloads, a 30-satellite SES order cited by NewSpaceTracker, and
              public claims of factory throughput that aim at repeatable manufacturing rather than one-off spacecraft.
              Those signals do not prove realized unit economics or margin, but they do show that K2 is trying to move
              the debate from concept to procurement option.
