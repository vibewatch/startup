      - number: '4.2'
        title: Cost structure and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a cost structure dominated by manufacturing scale-up, vertical
              integration, propulsion and power hardware, test infrastructure, and delivery execution rather than by
              low-marginal-cost software economics. Public sources tie recent fundraising directly to factory build-out,
              supply chain, hiring, and bringing components in-house, while product descriptions emphasize a vertically
              integrated hardware stack and a target of eventually producing 100 satellites per year. That framing helps
              explain why the current underwriting burden is less about top-line demand discovery and more about whether
              K2 can industrialize without margin slippage, schedule misses, or fresh capital needs before repeat
              in-orbit performance is proven.
            claimRefs:
