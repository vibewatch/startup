  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Segment-level renewals, churn, NRR, GRR, contract term length, and cohort behavior.
      whyItMatters: Without durability metrics, backlog cannot be translated into recurring revenue quality or customer stickiness.
      diligencePath: Request a cohort retention deck by customer segment plus top 10 contract durations and renewal outcomes.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue or backlog concentration and channel dependence by named program.
      whyItMatters: The public customer story appears concentrated, but the exact exposure cannot be sized from announced programs alone.
      diligencePath: Request a backlog waterfall by customer, milestone, cancellation rights, and expected delivery year.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU002, TU003]
    - type: missing-source
      severity: material
      topic: customer-proof-depth
      missingEvidence: Independent customer references with production outcomes, procurement records, or post-deployment operating metrics.
      whyItMatters: Signed contracts and company-issued mission announcements are weaker proof of durable adoption than live operating references.
      diligencePath: Obtain at least three named customer references or procurement documents covering one commercial and two government programs.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU003]
