    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - SBIR / STTR award cadence
        - 4 Phase I awards, 7 Phase II awards, $28.8M total awarded
        - Accessed 2026-10-15; awards from 2023-2025 shown on profile
        - SBIR.gov company portfolio
        - Medium
        - Government demand existed before large commercial announcements
        - Share of total revenue and portion tied to end customers vs development funding
      - - Gravitas government-backed demand
        - $60M contract-backed mission carrying multiple National Security payloads
        - "2024-12-19"
        - PR Newswire release
        - Medium
        - Converts development work into a named mission with real payload users
        - Number of paying payload customers and follow-on commitments
      - - Commercial anchor order
        - Initial SES order for 28 buses; long-term commitment described as around 100 spacecraft
        - "2026-03-24"
        - Space Intel Report
        - Medium
        - Shows demand can move from demos to constellation-scale backlog
        - Unit economics, delivery cadence, and cancellation protections
      - - Signed contract base
        - More than $1B in signed government and commercial contracts
        - 2026-07 to 2026-08 disclosures cited by Venture Atlas
        - Venture Atlas company profile
        - Medium
        - Customer interest is materially larger than a single pilot program
        - How much is firm backlog, how much is funded, and how concentrated it is
    notes: >-
      This table mixes award, mission, and backlog signals because K2 does not publish a
      clean customer-count or recurring-revenue time series.
    claimRefs: [CU002, CU004, CU005, CU007, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - SES
        - Commercial satellite operator
        - meoSphere MEO broadband constellation
        - Pre-delivery production backlog with pathfinders before full network deployment
        - Independent reporting says SES bought 28 buses and sees a path toward roughly 100 spacecraft
        - No disclosed renewal, cancellation, or delivered-in-service metrics yet
      - - U.S. Space Force / SpaceWERX
        - Government / defense
        - Gravitas mission and proliferated MEO demonstration
        - Pathfinder / demonstration
        - $60M mission-backed proof that K2 can attract government payload demand and launch support
        - Mission success is not the same as repeat procurement or fleet-scale adoption
      - - National security payload users on Gravitas
        - Government payload customers
        - Hosted payload demonstration on K2-owned spacecraft
        - Pilot / demonstration
        - Public sources say Gravitas carried customer or National Security payloads
        - Customer names, contract values, and follow-on orders are not public
    notes: >-
      Enumeration is partial and limited to named public proofs available in the assigned
      pool; logos without deployment context were excluded.
    enumerationScope:
      coverage: partial
      basis: >-
        Named customer proof drawn from public sources in the assigned pool covering the most
        visible commercial and government programs as of the 2026-10-15 run date.
    claimRefs: [CU002, CU003, CU005, CU007, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      K2's customer motion runs from government-funded validation to pathfinder missions,
      then into marquee constellation orders and still-unproven repeat procurement.
    data:
      items:
        - label: Government R&D entry
          actor: Air Force and Space Force innovation buyers
          touchpoints:
            - Phase I and Phase II SBIR or STTR awards
            - Early subsystem and bus development contracts
        - label: Pathfinder mission packaging
          actor: K2 and government payload sponsors
          touchpoints:
            - STRATFI-backed Gravitas mission
            - Hosted payload integration and mission qualification
        - label: On-orbit proof point
          actor: National security payload users
          touchpoints:
            - Gravitas carries customer payloads
            - LEO-to-MEO mission performance becomes a sales asset
        - label: Commercial anchor account
          actor: SES
          touchpoints:
            - Initial 28-bus meoSphere order
            - Pathfinder deliveries before network-scale rollout
        - label: Expansion programs
          actor: Space Force programs and defense teams
          touchpoints:
            - Enterprise Space Terminal and other mission programs
            - Broader defense adoption if platform execution holds
        - label: Repeatability test
          actor: Future customers and investors
          touchpoints:
            - Delivery cadence into 2029 and beyond
            - Renewal, concentration, and customer-satisfaction proof still missing
    claimRefs: [CU002, CU003, CU005, CU007, CU011, CU013]
