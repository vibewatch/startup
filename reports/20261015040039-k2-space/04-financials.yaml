      nodes:
        - id: signed-demand
          label: Signed contracts
          value: ">$1B book"
          note: Government and commercial contracts reported publicly
        - id: demo-contract
          label: Gravitas program
          value: "$60M"
          note: Government funds, SBIR matching, and private funds support first mission
        - id: bus-offer
          label: Mega Class offer
          value: "~$15M list price"
          note: Public list anchor, not realized ASP
        - id: production-ramp
          label: Factory ramp
          value: "180,000 sq ft / 100 per year target"
          note: Industrialization step before repeat deliveries are proven
        - id: delivered-hardware
          label: Delivered satellites
          value: Public cadence undisclosed
          note: Recognition timing and milestone structure are not disclosed
        - id: cash-conversion
          label: Gross profit and runway
          value: Not disclosed
          note: Margin, burn, and cash adequacy remain diligence blockers
