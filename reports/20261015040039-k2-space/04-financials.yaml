  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: profitability-and-runway
      missingEvidence: Audited or management financials showing current revenue, gross margin, burn, cash balance, runway, and capex plan.
      whyItMatters: Without these inputs, investors cannot determine whether backlog converts into acceptable hardware margins before another financing event.
      diligencePath: Request board or lender reporting, monthly cash bridge, and segment-level gross-margin disclosures.
      relatedQuestionRefs: [QI004, QI006, QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-and-backlog-quality
      missingEvidence: Customer-level backlog, cancellation rights, milestone schedules, discounts, and realized ASPs by bus or mission.
      whyItMatters: Signed contract headlines and public list pricing do not establish revenue quality, conversion timing, or customer concentration.
      diligencePath: Request top-customer contracts, booking-to-billing roll-forward, and price-waterfall analysis for the last four quarters.
      relatedQuestionRefs: [QI001, QI003, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: conflicting-data
      severity: minor
      topic: total-capital-reconciliation
      missingEvidence: A reconciled round-by-round financing ledger net of secondaries, debt, and non-dilutive funding.
      whyItMatters: Public funding tallies differ, which can distort assumptions about cash available for factory scale-up.
      diligencePath: Request a financing ledger that ties each round, investor, gross proceeds, fees, and current unrestricted cash.
      relatedQuestionRefs: [QI006]
