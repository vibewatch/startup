        - from: demo-contract
          to: bus-offer
        - from: bus-offer
          to: production-ramp
        - from: production-ramp
          to: delivered-hardware
        - from: delivered-hardware
          to: cash-conversion
    claimRefs: [CI002, CI004, CI007, CI011, CI014, CI015]
