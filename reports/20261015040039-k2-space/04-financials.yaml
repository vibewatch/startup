company:
  name: K2 Space
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a hardware-led revenue model built around large satellite buses,
    milestone-backed customer programs, and a factory ramp that still requires heavy external
    capital. The strongest disclosed datapoints are list pricing, contract book, and production
    ambition; realized revenue quality, margin, and runway remain largely undisclosed.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      K2's public commercial story is a hardware and mission-delivery model, not a recurring
      software subscription. The company and third-party profiles consistently describe Mega Class
      as a high-power satellite bus sold into commercial and national-security missions, with
      public list-price anchors around $15 million per bus and a public contract pipeline that is
      still being converted from demonstrations into deliveries. The clearest public traction
      markers are the $60 million Gravitas mission, more than $1 billion of reported signed
      contracts, and a third-party estimated revenue figure near $48.8 million, but none of the
      reviewed sources disclose how much of that traction is recognized revenue versus milestone
      backlog, customer-funded development, or forward purchase commitments.
    claimRefs: [CI001, CI002, CI004, CI007, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-capital-intensity
    title: Cost structure and capital intensity
    body: >-
      The available evidence points to a cost structure dominated by manufacturing scale-up,
      vertical integration, propulsion and power hardware, test infrastructure, and delivery
      execution rather than by low-marginal-cost software economics. Public sources tie recent
      fundraising directly to factory build-out, supply chain, hiring, and bringing components
      in-house, while product descriptions emphasize a vertically integrated hardware stack and a
      target of eventually producing 100 satellites per year. That framing helps explain why the
      current underwriting burden is less about top-line demand discovery and more about whether
      K2 can industrialize without margin slippage, schedule misses, or fresh capital needs before
      repeat in-orbit performance is proven.
    claimRefs: [CI006, CI008, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: underwriting-verdict-and-diligence-blockers
    title: Underwriting verdict and diligence blockers
    body: >-
      Financially, K2 looks like a capital-intensive aerospace manufacturer with meaningful market
      pull but still-incomplete proof of revenue quality. The public record is much stronger on
      list pricing, signed demand, production ambition, and fundraising cadence than on realized
      ASPs, gross margin, customer concentration, working-capital requirements, capex, burn, or
      runway. That imbalance does not negate the opportunity; it means any underwriting case still
      depends on private diligence materials showing how quickly contract backlog can convert into
      delivered buses and whether factory utilization can produce acceptable hardware margins
      before the next financing event.
    claimRefs: [CI007, CI009, CI012, CI014, CI015]
