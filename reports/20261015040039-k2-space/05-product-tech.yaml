      - ["20 kW krypton Hall-effect propulsion", "Enable self-raising missions from LEO into MEO and sustain multi-orbit positioning", "Thruster performance, power handling, and endurance under flight conditions", "Public hot-fire evidence exists, but public lifetime and degradation data do not"]
      - ["Vertical integration / in-house manufacturing", "Compress supplier handoffs and align design with factory throughput", "Factory ramp, component yield, and internal quality systems", "Scaling production can expose schedule and quality bottlenecks"]
      - ["Program roadmap (Gravitas -> Trinity -> Giga)", "Turn one bus concept into a multi-product platform family", "Mission execution, heavy-lift availability, and customer conversion", "Roadmap breadth can outpace independently verified operational maturity"]
    notes: This table focuses on how the platform is supposed to work operationally; it does not imply public proof of every subsystem claim.
    claimRefs: [CE003, CE004, CE005, CE008, CE009, CE011, CE013, CE014]
figures:
  - id: FE001
    title: Validated architecture stack and remaining proof gaps
    type: stack
    summary: Public evidence supports a layered bus architecture, but independent proof thins as the stack moves from component claims to repeatable fleet operations.
    data:
      layers:
        - label: Mission envelope
          detail: Mega Class is positioned as a reusable bus for payload-heavy missions across multiple orbital regimes.
          modules:
            - Up to 3,000 kg payload mass
            - Up to 30 kW peak payload power
            - LEO / MEO / GEO mission scope
          outputs:
            - Higher-capability commercial and national-security missions
        - label: Mobility and power
          detail: Propulsion and power are the core technical wedge behind K2's orbit-raise and launch-density thesis.
          modules:
            - 20 kW krypton Hall-effect thruster
            - LEO-to-MEO raise in under 90 days
            - Ten-bus stackable deployment model
          outputs:
            - Fewer launches and faster deployment into higher orbits
        - label: Control and survivability
          detail: Public descriptions emphasize radiation tolerance and redundant control systems rather than a commodity smallsat avionics profile.
          modules:
            - Radiation-tolerant architectures
            - Redundant avionics
            - In-space heritage for flight computer, reaction wheel, embedded avionics, and flight software
          outputs:
            - Better fit for harsher orbital regimes
        - label: Production system
          detail: K2's product promise depends on factory throughput and vertical integration as much as on satellite design.
          modules:
            - 85% vertically integrated profile in public directories
            - 180,000 sq ft Torrance factory
            - Target of 100 satellites per year
          outputs:
            - Potential manufacturing leverage, but also scale-up risk
        - label: Payload integration
          detail: Customer payload accommodation depends on interfaces and support artifacts that are not public in the assigned evidence.
          modules:
            - Payload deck and power allocation
            - Mission-specific mechanical and data interfaces
            - Supplier-provided datasheet and ICD
          outputs:
            - Private technical diligence remains necessary before integration
        - label: Qualification and operations
          detail: Public proof combines component flight heritage and a ground propulsion test rather than a complete published qualification record.
          modules:
            - Component-level in-space activation
            - Full-power thruster hot-fire
            - GRAVITAS integrated mission
          outputs:
            - Initial de-risking without public fleet-level reliability statistics
    approximationNotes: Specific power, integration share, and throughput figures come from public profiles and company materials rather than audited technical disclosure.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE009, CE013]
callouts:
  - calloutType: strength
    title: More concrete than a concept deck
    body: >
      K2's technical story has progressed from ambition to subsystem and mission evidence:
      the pool includes component-level in-space heritage, a full-power thruster hot-fire,
      a named first mission, and a scaled factory narrative.
    claimRefs: [CE004, CE005, CE009, CE014]
  - calloutType: risk
    title: Public diligence still depends heavily on management-controlled evidence
    body: >
      The strongest validation artifacts in the assigned pool are still company-issued or
      directory-derived, and the absence of a public datasheet, ICD, security/status
      material, or developer/practitioner telemetry limits independent technical
      underwriting.
    claimRefs: [CE011, CE012, CE013]
