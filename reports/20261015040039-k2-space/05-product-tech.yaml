      - ["Reach MEO without dedicated insertion architecture", "Operators usually trade launch cost against orbit-raise complexity and payload fuel burden", "20 kW electric propulsion designed for LEO-to-MEO raise", "Public descriptions cite orbit raise in under 90 days", "No independent end-to-end mission report yet in pool"]
      - ["Scale constellations with fewer launches", "Higher-orbit constellations can require many launches and long deployment windows", "Stackable deployment model plus self-raising buses", "Company says up to ten buses per launch vehicle and 4x more deployed satellites per launch", "Launch-density economics rely on execution of first customer missions"]
