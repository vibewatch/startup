company:
  name: K2 Space
chapter:
  number: 5
  title: Product & Technology
  summary: K2 Space is selling a high-power, multi-orbit satellite bus strategy anchored on Mega Class, with public evidence of propulsion testing, component-level flight heritage, and a scaled factory buildout rather than only slideware. The product thesis is differentiated, but most technical proof still comes from company or aggregator surfaces, with limited public ICD/security material and no open developer/practitioner telemetry in the assigned pool.
sections:
  - id: product-thesis
    title: Product definition and customer workflow
    body: >
      K2's product is not a narrow subsystem but a reusable satellite-bus platform meant
      to move customers from small-satellite tradeoffs toward fewer, more capable
      spacecraft. Across third-party product profiles, Mega Class is described as a
      multi-orbit bus for commercial, science, and national-security missions, with the
      differentiation framed around higher payload mass, higher power, and the ability to
      ride-share into LEO before raising itself into higher orbits. That matters in
      customer workflow terms because the value proposition is not merely "bigger
      satellite"; it is lower launch-count infrastructure for operators that need more
      power, more radiation tolerance, or more onboard processing than conventional
      constellation-class platforms can provide at equivalent price points.
    claimRefs: [CE001, CE002, CE006, CE010, CE015]
    tableRefs: [TE001, TE002]
  - id: architecture-proof
    title: Architecture, manufacturing model, and current proof points
    body: >
      The assigned pool supports a reasonably specific architecture story. Public
      descriptions consistently point to a vertically integrated hardware stack, with
      K2 building critical components in house and pairing radiation-tolerant avionics,
      redundant control systems, and high-power electric propulsion in one platform.
      The strongest proof point is still company-issued: K2 says its first demonstration
      mission gave flight heritage to the flight computer, reaction wheel, embedded
      avionics, and flight software, and that the 20 kW Hall thruster has already been
      hot-fired at full power. That is more concrete than generic marketing copy, but it
      remains pre-fleet evidence rather than repeated operational history across
      customers and missions.
    claimRefs: [CE003, CE004, CE005, CE009, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-maturity
    title: Deployment maturity, roadmap, and product-line breadth
    body: >
      K2 has progressed beyond a single product announcement into a disclosed product
      family and mission sequence, but the maturity profile is uneven. GRAVITAS is the
      current proof vehicle, backed by a Space Force STRATFI award and described as the
      first full Mega Class mission carrying multiple payloads. Beyond that, public
      profiles cite Trinity as the next campaign and Giga Class as the longer-horizon
      expansion path for heavy-lift launchers. The implication is that K2 is trying to
      turn one bus architecture into a manufacturing platform that can serve multiple
      orbital regimes and payload classes. The risk is that roadmap breadth now extends
      ahead of broad independent proof of repeatable on-orbit performance.
    claimRefs: [CE007, CE008, CE014]
  - id: diligence-risks
    title: Control gaps and technical underwriting risks
    body: >
      The underwriting challenge is not understanding K2's ambition; it is testing how
      much of the architecture and reliability story is independently observable today.
      A public product page explicitly says there is no public datasheet and asks buyers
      to request the datasheet or ICD from the supplier, while the assigned pool contains
      no public status page, security/compliance documentation, or open developer or
      practitioner telemetry. Independent commentary also flags the classic aerospace
      scale-up problem: moving from a handful of satellites and first missions to
      repeatable, quality-controlled production without slipping delivery, costs, or
      in-orbit reliability. Those missing artifacts do not invalidate the product thesis,
      but they do keep technical diligence dependent on management materials.
    claimRefs: [CE011, CE012, CE013]
