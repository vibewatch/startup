      severity: material
      topic: developer-signal
      missingEvidence: Public repository, package, engineering talk, practitioner forum, or recruiting artifact that exposes software, integration, or developer-surface maturity.
      whyItMatters: The chapter brief explicitly asks for trust and technical-risk evidence, and the assigned pool contains no open developer or practitioner telemetry to test how much of the stack is observable outside management-controlled materials.
      diligencePath: Request public or customer-shareable engineering artifacts such as API docs, release notes, integration guides, conference talks, or recruiting packets that describe tooling and support responsibilities.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: technical-documentation-gap
      missingEvidence: Datasheet, interface control document, subsystem qualification results, and customer integration materials for Mega Class.
      whyItMatters: Without those materials, diligence cannot independently test payload accommodation, interfaces, redundancy assumptions, or operational limits beyond marketing and directory summaries.
      diligencePath: Obtain the latest Mega Class datasheet, ICD, and qualification package from K2 under NDA and reconcile them against the public specification claims used in this chapter.
      relatedQuestionRefs: [QE003, QE006]
    - type: missing-source
      severity: material
      topic: mission-maturity
      missingEvidence: Independent reporting or customer disclosure on GRAVITAS orbit-raise results, payload performance, and post-launch reliability.
      whyItMatters: The platform's underwriting case depends on turning component-level and first-mission proof into repeatable customer evidence, especially for higher-orbit deployment claims.
      diligencePath: Request mission reports, customer references, and telemetry summaries from GRAVITAS and compare them with the planned Trinity and Giga roadmap assumptions.
      relatedQuestionRefs: [QE004, QE007]
