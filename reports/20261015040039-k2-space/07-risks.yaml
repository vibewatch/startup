figures:
  - id: "FR001"
    title: "Risk heatmap"
    type: "matrix"
    summary: >-
      The residual risk stack is dominated by first-flight execution, propulsion proof,
      and concentration around a few visible counterparties.
    data:
      columns:
        - "Likelihood"
        - "Impact"
        - "Mitigation maturity"
        - "Residual exposure"
      rows:
        - label: "Gravitas first-flight execution"
          note: "Mission timing moved publicly from February 2026 planning to a late-March 2026 target."
          values:
            - { label: "High", note: "Public schedule movement kept launch timing live risk." }
            - { label: "High", note: "The first mission is meant to de-risk the platform and validate customer-facing promises." }
            - { label: "Medium", note: "Qualification work exists, but assigned evidence still lacked on-orbit proof." }
            - { label: "High", note: "A failure or major delay would hit technical, customer, and financing narratives at once." }
        - label: "Orbit-raise propulsion reliability"
          note: "The 20 kW propulsion stack is central to K2's MEO access thesis."
          values:
            - { label: "Medium", note: "The system is publicly described as mission-critical but not yet independently verified in orbit here." }
            - { label: "High", note: "Orbit-raise failure weakens the entire multi-orbit value proposition." }
            - { label: "Medium", note: "K2 publicizes in-house propulsion development, but the assigned pool lacks detailed qualification artifacts." }
            - { label: "High", note: "Residual exposure stays high until Gravitas proves the stack end to end." }
        - label: "Government / flagship-customer concentration"
          note: "Visible demand is still anchored by Space Force stakeholders and a small set of named commercial programs."
          values:
            - { label: "Medium", note: "Concentration is visible in current public proof even if the full pipeline is larger." }
            - { label: "High", note: "Delayed or weak follow-on demand would slow factory utilization and pricing power." }
            - { label: "Low-Medium", note: "Public mitigants are mostly future diversification rather than already-evidenced breadth." }
            - { label: "High", note: "The downside remains meaningful until repeat orders broaden beyond headline relationships." }
        - label: "Capital intensity / dilution"
          note: "Scaling satellites and facilities ahead of fully visible recurring revenue can force more financing."
          values:
            - { label: "Medium", note: "The risk depends on how quickly mission proof converts into cash-paying backlog." }
            - { label: "High", note: "Dilution or tighter financing terms can erode return even if technical progress continues." }
            - { label: "Low-Medium", note: "Public mitigation is mostly continued fundraising success rather than disclosed self-funding capacity." }
            - { label: "High", note: "Residual exposure persists while burn, runway, and contract cash timing remain undisclosed." }
        - label: "Contract / cash-timing opacity"
          note: "The public award announcement does not disclose milestone payments, acceptance tests, or termination rights."
          values:
            - { label: "Medium", note: "Opacity is already present in the assigned evidence set." }
            - { label: "Medium-High", note: "Unknown cash timing can distort working-capital needs and reported backlog quality." }
            - { label: "Low", note: "No public mitigation was surfaced beyond the existence of the award itself." }
            - { label: "High", note: "Residual exposure stays high until the underlying contract mechanics are reviewed." }
        - label: "Independent validation gap"
          note: "Public evidence still lacks a datasheet / ICD and buyer reviews for the visible product pages."
          values:
            - { label: "Medium", note: "The gap may close quickly, but it remained visible in the current assigned pool." }
            - { label: "Medium", note: "Thin independent validation raises diligence burden on every technical and customer claim." }
            - { label: "Low", note: "The current public mitigation is limited to supplier-controlled or summary pages." }
            - { label: "Medium-High", note: "Residual exposure falls only after detailed technical and customer validation arrives." }
    claimRefs: ["CR003", "CR004", "CR006", "CR007", "CR010", "CR011"]
callouts:
  - calloutType: "risk"
    title: "Primary thesis-break trigger"
    body: >-
      A failed or materially delayed Gravitas launch-and-orbit-raise sequence would break
      the current public thesis that K2 can deliver MEO-class performance at an
      approximately $15 million per-bus price before scaling production.
    claimRefs: ["CR003", "CR004", "CR006", "CR007"]
  - calloutType: "assumption"
    title: "Minimum diligence package before underwriting"
    body: >-
      Before a fresh valuation step-up is underwritten, diligence should clear the
      contract structure behind the $60 million award, the propulsion / radiation
      qualification package, and whether headline customer proof translates into repeat
      orders rather than one-off flagship programs.
    claimRefs: ["CR001", "CR006", "CR010", "CR011", "CR014", "CR015"]
