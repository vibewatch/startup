company:
  name: "K2 Space"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    K2 Space's downside is concentrated in execution rather than concept: public evidence
    still ties proof of the Mega Class thesis, the orbit-raise architecture, and the
    ~$15 million per-bus promise to the first Gravitas mission. The assigned public pool
    also leaves material diligence gaps around government-contract terms, compliance
    posture, repeat-customer depth, and financing durability, so risk ranking depends on
    whether flagship announcements convert into repeatable on-orbit deliveries.
sections:
  - id: "ranked-risk-overview"
    title: "Ranked risk overview"
    body: >-
      Within the assigned public evidence pool, K2 still looks like a company whose
      downside is concentrated in one proving event. Gravitas is presented as the mission
      that will validate LEO and MEO operations, exercise the 20 kW orbit-raise stack,
      and turn the company's pricing and performance promises into proof points, which
      means a slip or underperforming first flight would hit technical credibility,
      customer conversion, and financing leverage at the same time. Public reporting also
      showed a moving launch window from a February 2026 mission plan to a late-March
      2026 target, reinforcing that schedule execution remained live risk rather than a
      cleared milestone. Beyond first flight, K2 still depends on a small set of visible
      government and flagship-commercial relationships, while public evidence on
      compliance, contract structure, and repeat-order quality remains thin.
    claimRefs: ["CR002", "CR003", "CR004", "CR006", "CR007", "CR010", "CR011"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-contract-risk"
    title: "Regulatory and contract risk"
    body: >-
      The clearest legal and regulatory risk is not a public enforcement event; it is
      missing evidence around what the company must satisfy to turn defense-adjacent
      mission work into repeatable revenue. K2's own announcement says Gravitas is backed
      by multiple Department of the Air Force stakeholders and will carry national
      security payloads, but the assigned public pool does not establish the underlying
      export-control, mission-assurance, cyber, or customer-security approvals that would
      normally matter for this class of work. The same gap applies to contract economics:
      the existence of a $60 million award is public, but milestone payments, acceptance
      tests, cancellation rights, and cash-timing mechanics are not. That keeps residual
      exposure high until diligence moves from press-level evidence to primary documents.
    claimRefs: ["CR001", "CR004", "CR008", "CR014", "CR015"]
    tableRefs: ["TR001"]
  - id: "operational-and-technical-risk"
    title: "Operational and technical risk"
    body: >-
      Operationally, K2 is trying to prove several hard things at once: a vertically
      integrated hardware model, a first on-orbit demonstration, and a propulsion system
      positioned as central to the LEO-to-MEO value proposition. Public sources say 75%
      of components are built in-house, including reaction wheels, flight computers, and
      solar arrays, and that the company is developing a 20 kW electric propulsion stack
      for rapid orbit raise. Those choices can improve control and unit economics, but
      they also enlarge the internal execution surface: manufacturing yield, test
      throughput, propulsion reliability, and radiation-hard performance all need to work
      before the platform is meaningfully de-risked. Publicly available product pages
      still lack a datasheet or ICD, so outside investors cannot independently verify the
      detailed reliability assumptions behind the ambition.
    claimRefs: ["CR002", "CR004", "CR005", "CR006", "CR007", "CR008", "CR012", "CR013"]
    tableRefs: ["TR002"]
  - id: "dependency-and-financing-risk"
    title: "Dependency and financing risk"
    body: >-
      K2's dependency map remains concentrated. The visible government side is anchored by
      Space Force and broader Air Force participation around Gravitas, while the visible
      commercial side still leans heavily on flagship proof points such as SES
      collaboration and a reported signed-contract backlog rather than a broad, publicly
      evidenced base of repeat operating customers. The first mission is also linked to a
      Falcon 9 launch schedule, so launch-provider delay can postpone technical proof even
      if the spacecraft itself is ready. Financially, Augustus Wealth's summary captures
      the key model risk: valuation and equity upside still depend on execution, customer
      adoption, and successful delivery, while future funding can dilute existing holders
      if the company has to keep scaling ahead of fully visible recurring revenue.
    claimRefs: ["CR001", "CR003", "CR010", "CR011"]
    tableRefs: ["TR003"]
  - id: "kill-criteria-and-diligence"
    title: "Kill criteria and diligence"
    body: >-
      The most useful diligence posture is to convert these risks into explicit
      pass-fail tests. The thesis materially weakens if K2 cannot show a completed launch,
      successful orbit raise, and stable on-orbit power/performance from Gravitas within a
      timeframe that still preserves customer momentum. It also weakens if follow-on demand
      remains concentrated in one or two government or flagship-commercial programs rather
      than converting into repeatable backlog with disclosed payment and acceptance terms.
      Before underwriting a fresh step-up in valuation, diligence should require the
      contract pack behind the $60 million award, technical qualification artifacts for
      propulsion and radiation tolerance, and enough customer evidence to distinguish
      signed intent from durable factory utilization.
    claimRefs: ["CR001", "CR004", "CR006", "CR007", "CR010", "CR011", "CR014", "CR015"]
