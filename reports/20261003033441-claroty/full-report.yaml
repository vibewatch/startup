      - number: '4.2'
        title: Pricing Structure and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Claroty employs a closed enterprise pricing structure where list prices are not publicly published,
              requiring custom commercial quotes based on asset density, protocol coverage, and deployment topology. The
              monetization architecture packages core asset discovery and inventory with premium add-on modules such as
              vulnerability and risk management (VRM), the AI-powered CPS Library, and Secure Remote Access (SRA). While
              headline software license agreements frequently reach multi-million dollar annual commitments among large
              global accounts, realized pricing reflects aggressive volume discounting for enterprise-wide rollouts
              across Fortune 100 enterprises. In secondary markets, transaction pricing has mirrored late-stage
              institutional rounds, with Claroty commanding an implied valuation of $3 billion following its January
              2026 Series F. That valuation marks an expansion of roughly 80% over 2024 pricing, corresponding to an
              implied revenue multiple of 15.0x against estimated $200 million revenue.
