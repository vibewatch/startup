  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Lens
      - Argument
      - Evidence
      - What Would Change the View
    rows:
      - - 'Thesis: demand'
        - Persistent cyber-physical exposure creates a durable need for protection.
        - Facilities Dive reported Claroty research on widespread known vulnerabilities in building-management devices.
        - The view weakens if budgets or deployments fail to convert into durable subscription revenue.
      - - 'Thesis: adoption'
        - Fortune 100 adoption suggests the platform can sell into complex enterprises.
        - Claroty reported working with 24 Fortune 100 organizations in January 2026.
        - The view strengthens with independently verified renewals, expansion, and customer concentration data.
      - - 'Anti-thesis: economics'
        - Recognition and financing do not establish attractive unit economics.
        - The retained financing reports omit current ARR, growth, gross margin, net retention, burn, and runway.
        - Audited high-quality recurring growth and a credible cash-generation path would reduce this concern.
      - - 'Anti-thesis: capitalization'
        - A large, multi-round capital base may leave common-equity outcomes sensitive to senior terms.
        - Tracxn reports $882 million raised across eight rounds, while public sources omit the preference waterfall.
        - A clean cap table, standard preferences, and limited debt would materially improve the downside case.
    notes: >-
      The demand and adoption case uses company claims and independent reporting; the anti-thesis explicitly identifies
      operating and capitalization evidence that is unavailable publicly.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
      - CV016
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Required Assumptions
      - Valuation and Return Logic
      - Key Risks or Triggers
      - Probability Signal
    rows:
      - - Bull
        - >-
          Verified durable growth, strong retention and gross margin, cash-generation visibility, and no material senior
          preference overhang.
        - Apply a current peer multiple only to audited current ARR; no public range is supportable now.
        - Fails if quality of growth or the preference waterfall is weaker than represented.
        - Not quantified; required inputs are private.
      - - Base
        - >-
          Adequate recurring growth, credible profitability path, stable customer retention, and standard financing
          terms.
        - Anchor entry to verified current metrics and directly comparable public-company or M&A evidence.
        - Reprice if the estimated financing value is not the common-equity post-money mark.
        - Not quantified; comparable and operating data are missing.
      - - Bear
        - >-
          Growth or retention slows, cash needs persist, senior terms absorb proceeds, or public-market access remains
          closed.
        - >-
          Model the common-equity waterfall under lower exit values after debt and preferences; do not infer a range
          from funding raised.
        - Down-round financing, delayed exit, or preference-driven impairment.
        - Not quantified; downside terms require the cap table.
    notes: >-
      This is a conditional framework, not a forecast. Numeric valuation ranges, probabilities, and target returns are
      intentionally withheld because current operating data, peer multiples, and security terms are unavailable.
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV014
      - CV015
