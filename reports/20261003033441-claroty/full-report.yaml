  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance Mandates and Federal Governance
        blocks:
          - type: paragraph
            body: >-
              Claroty's market expansion is tightly coupled to federal cybersecurity mandates and critical
              infrastructure compliance frameworks [CR005]. As cyber-physical systems (CPS) face accelerating
              geopolitical threats, regulatory bodies have shifted from voluntary guidelines to strict compliance
              requirements including CISA emergency directives, NIST guidance, and Department of Defense Cybersecurity
              Maturity Model Certification (CMMC) requirements [CR002, CR005]. Claroty xDome and Continuous Threat
              Detection (CTD) provide configuration controls and logging necessary to comply with federal requirements
              such as FISMA, supported by STIG-hardened configuration management baselines [CR005, CR008]. However,
              achieving and sustaining compliance across public sector accounts introduces continuous audit risk and
              extensive verification demands [CR002, CR005]. While federal agencies report that 100% launched new CPS
              security initiatives in the past year, only 36% have achieved full asset visibility and over 60% face
              internal CPS skill shortages, leaving implementation and compliance timelines vulnerable to customer-side
              operational bottlenecks [CR005]. Failure of customers to establish rigorous evidence paths or verify
              automated compliance mappings can result in regulatory scrutiny and false compliance assurance [CR002].
            claimRefs:
              - CR002
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR008
      - number: '7.2'
        title: Operational Exposure, Vulnerability Backlog, and Agentic AI Governance
        blocks:
          - type: paragraph
            body: >-
              Operational security risks in CPS environments differ fundamentally from corporate IT because disruptions
              can shut down factory lines, municipal water systems, or clinical healthcare workflows [CR002, CR003].
              Proprietary research from Claroty's Team82 analyzing over 125,000 operational technology (OT) assets
              revealed that 3.7% of all OT assets are insecurely connected to the public internet, and 13% of critical
              engineering workstations (EWS) and human-machine interfaces (HMIs) harbor insecure direct internet
              connections [CR003, CR004]. More acutely, 36% of those internet-connected EWS and HMIs contain at least
              one confirmed Known Exploited Vulnerability (KEV), creating severe initial access and lateral movement
              exposure [CR003, CR004]. Because industrial controllers often cannot be patched without taking entire
              production facilities offline, operators must rely heavily on network segmentation and secure remote
              access as compensating controls [CR001, CR003]. Furthermore, Claroty's recent introduction of Claire—a
              CPS-native AI security agent—and the xDome Model Context Protocol (MCP) Server introduces emerging
              operational and software supply chain risks [CR002]. Independent diligence highlights that deploying
              agentic AI in mission-critical OT environments carries failure modes including unsafe remediation
              recommendations, tool-permission sprawl, prompt injection via imported asset notes, and degraded telemetry
              behavior [CR002]. OT security governance dictates that buyers must enforce read-only validation, strict
              change-window adherence, and mandatory human-in-the-loop approvals before allowing automated remediation
              actions [CR002].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Channel Concentration, Commercial Dependencies, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Claroty's commercial scale relies heavily on an indirect go-to-market model through channel aggregators,
              cloud hyperscalers, and original equipment manufacturer (OEM) alliances [CR005, CR006, CR007]. In the
              public sector, Claroty distributes through Carahsoft as its master government aggregator under NASPO
              ValuePoint contracts, creating operational and counterparty dependency on Carahsoft's federal reseller
              apparatus [CR005]. On the technology and product development side, Claroty partners with Rockwell
              Automation and Schneider Electric—both strategic investors—for initiatives like the CPS Library, as well
              as AWS for cloud-hosted xDome infrastructure [CR001, CR006, CR007]. Cloud-managed xDome deployments
              introduce third-party cloud availability risks and operational friction for highly segmented air-gapped
              plants [CR006]. Crucially, while Claroty disclosed reaching $100M+ in ARR in 2023 and completed a $150M
              Series F round in January 2026, the company keeps its current ARR, renewal rates, gross margins, cash
              burn, vertical revenue mix, and customer concentration metrics private [CR007, CR008]. These undisclosed
              metrics create significant financial underwrite uncertainty for prospective late-stage and pre-IPO
              investors [CR007].
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Air-Gap Fallacy and Unpatchable KEV Exposures
            body: >-
              Operational technology teams historically relied on air-gapping to protect industrial networks, but
              Claroty's own research reveals that 13% of critical workstations and HMIs have active internet
              connections, with over a third hosting confirmed known exploited vulnerabilities. Because industrial
              uptime constraints prevent active patching, organizations must treat network isolation and zero trust
              remote access as essential compensating controls.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: Mandate Human-in-the-Loop Guardrails for Agentic AI
            body: >-
              Prospective buyers evaluating Claroty Claire or similar CPS-native AI security agents must enforce
              read-only validation during onboarding and reject autonomous remediation writes to industrial control
              networks. Critical physical environments require formal change advisory board approvals and alignment with
              maintenance windows before any automated reconfiguration is authorized.
            calloutType: recommendation
            claimRefs:
              - CR002
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Claroty has both a durable demand backdrop and evidence of enterprise
              adoption. The company reported working with 24 Fortune 100 organizations in the January 2026 financing
              announcement, while Facilities Dive's account of Claroty research described widespread known
              vulnerabilities in building-management devices. Those facts support the need for cyber-physical-systems
              protection, but they do not establish Claroty's renewal economics or market share. The anti-thesis is
              therefore evidence-driven rather than categorical: the latest financing materials omit current ARR,
              growth, gross margin, net retention, burn, and runway. Claroty's Cloud 100 recognition is a positive
              signal, yet the supporting page is company-issued and discloses the ranking methodology rather than
              Claroty's underlying scores. Product relevance and customer logos should not substitute for audited
              operating quality.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Claroty announced a $150 million Series F led by Golub Growth in January 2026, with up to $50 million of
              participation from existing investors. The company reported an 80% valuation increase from its March 2024
              financing but did not disclose the absolute value. CTech estimated the resulting value at approximately $3
              billion and reported that roughly $30 million to $40 million of the transaction was secondary; both
              figures should be verified in transaction documents. Tracxn reports $882 million raised across eight
              rounds, including a $400 million Series E at a $2 billion post-money valuation in 2021, but cumulative
              funding is not cash available today. The public record also does not disclose liquidation preferences,
              ownership, debt balances, or fully diluted capitalization. Entry discipline should therefore be based on a
              verified common-equity waterfall, not the headline financing estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Scenarios, Exit Readiness, and Diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support numeric bull, base, or bear valuation ranges. The only usable anchors in
              the assigned evidence are Claroty's own historical financing marks, an independent approximately $3
              billion estimate, and a stale company-reported 2023 ARR milestone above $100 million; combining those
              different dates into a current revenue multiple would be misleading. The scenario framework is therefore
              conditional. A bull case requires verified durable growth, strong retention and margins, cash-generation
              visibility, and a clean preference stack. A base case requires adequate growth and a credible
              profitability path at an entry price supported by current metrics and genuine peer benchmarks. A bear case
              is triggered by weak retention, cash needs, senior preference overhang, or a closed IPO window. Management
              discussed an IPO aspiration and near-term profitability, but also tied timing to market conditions. Final
              diligence must obtain audited financials, cohort retention, the cap table and waterfall, debt terms, and
              directly comparable public-company or M&A evidence.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research more. The financing event is credible, but neither the estimated headline value nor the
              historical ARR milestone supports a current entry multiple without period-matched operating data.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
          - type: callout
            title: Funding is not cash or common-equity value
            body: >-
              The reported cumulative funding total spans multiple years and securities, and part of the latest
              transaction was reported as secondary. Cash available and common-equity proceeds therefore require
              separate verification.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV013
              - CV016
