  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The addressable market for cyber-physical systems (CPS) security encompasses software, hardware
              appliances, and services deployed to discover, monitor, assess, and defend operational technology (OT),
              industrial control systems (ICS), the Internet of Medical Things (IoMT), and smart building management
              systems (BMS). Unlike traditional information technology (IT) security, which prioritizes data
              confidentiality across servers and endpoints, CPS security is governed by availability, physical safety,
              and operational resilience across fragile controllers, sensors, and actuators that cannot tolerate active
              scanning or unplanned downtime. Included addressable spend covers passive and safe-active network
              monitoring, continuous threat exposure management, secure remote access (SRA) for internal and third-party
              technicians, and specialized CPS threat intelligence. Excluded from this core boundary are standard
              enterprise IT endpoint protection platforms (EDR), generic cloud security posture management (CSPM),
              identity and access management (IAM) directory services, and broad physical facility security controls.
              Within this landscape, Claroty defines its addressable scope around the Extended Internet of Things
              (XIoT), explicitly unifying classic manufacturing shop-floor automation with clinical healthcare devices
              and commercial infrastructure.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
      - number: '2.2'
        title: Market Sizing, TAM/SAM/SOM Breakdown, and Growth Lenses
        blocks:
          - type: paragraph
            body: >-
              Independent market research from MarketsAndMarkets sizes the worldwide operational technology security
              market at $23.54 billion in 2025, climbing to $27.39 billion in 2026 at an annual expansion rate of
              roughly 16%. In parallel, long-range tracking from ABI Research pegs the broader critical infrastructure
              OT/ICS security market at $12.75 billion in 2023, charting an expansion trajectory toward $21.60 billion
              by 2028. Sizing the serviceable available market (SAM) requires segmenting spend by delivery and product
              type: on-premises hardware and software installations still accounted for 70.42% of category spending in
              2025 according to Mordor Intelligence, while pure software solutions commanded 62.34% of total vendor
              revenues relative to consulting and integration services. Claroty's serviceable addressable opportunity
              sits squarely at the intersection of commercial platform software and enterprise hybrid deployments across
              high-threat verticals. Serviceable obtainable market (SOM) capture is directly constrained by incumbent
              automation contracts, procurement fragmentation between IT and plant engineering, and multi-vendor
              bake-offs against specialized peers such as Dragos and Nozomi Networks.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
