            title: Secondary Liquidity Component Signals Late-Stage Realization
            body: >-
              The inclusion of a $30M to $40M secondary transaction within the $150M Series F round provides liquidity
              to founders and early shareholders prior to an IPO, underscoring that late-stage underwriters must
              scrutinize valuation step-ups against actual balance sheet cash addition versus liquidity cashing out.
            calloutType: risk
