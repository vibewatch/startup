              Claroty completed a $150 million Series F financing round in January 2026 led by Golub Growth, an
              affiliate of Golub Capital, with additional confirmed participation from existing syndicate investors of
              up to $50 million [CO006]. The transaction included an estimated secondary component of $30 million to $40
