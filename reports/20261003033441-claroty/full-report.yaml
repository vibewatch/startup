      - number: '2.3'
        title: Buyer Segmentation, Governance Friction, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Purchasing authority for cyber-physical security sits at a historically tense organizational intersection
              between corporate Chief Information Security Officers (CISOs) and operational plant engineering managers.
              While enterprise CISOs and VP of Security Operations titles increasingly control the formal capital
              budget, Operational Technology directors and Chief Operating Officers maintain functional veto power over
              any tool that risks interrupting continuous production line availability. Adoption paths typically begin
              when a security audit, regulatory inspection, or sector-specific cyber alert prompts a proof-of-concept
              (POC) at a single high-profile plant, water treatment facility, or hospital campus. Enterprise procurement
              commonly requires vendors to demonstrate frictionless coexistence with legacy supervisory control and data
              acquisition (SCADA) networks without requiring hardware-heavy architecture changes. Once passive
              visibility is established, budget allocations expand from initial asset discovery into recurring
              operational licenses for vulnerability management, micro-segmentation modeling, and privileged remote
              session access.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
