  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Portfolio and Core Capabilities
        blocks:
          - type: paragraph
            body: >-
              The Claroty Platform provides a purpose-built security solution engineered for environments where
              cyber-physical systems (CPS) directly govern physical processes, operational safety, and patient care.
              Claroty delivers its capabilities through two primary deployment paradigms: Claroty xDome, a modular SaaS
              platform designed for rapid cloud time-to-value, and Claroty Continuous Threat Detection (CTD), an
              on-premise solution delivering comprehensive network visibility and controls for air-gapped or strictly
              regulated industrial sites. Across both footprints, the platform integrates five foundational capability
              pillars: deep asset discovery and inventory, automated exposure management, network policy modeling and
              protection, secure interactive remote access, and real-time threat detection. In healthcare and clinical
              environments, Claroty xDome for Healthcare incorporates technology acquired from Medigate to secure
              Internet of Medical Things (IoMT) devices alongside building management systems (BMS) and operational
              technology (OT). Furthermore, the portfolio incorporates the CPS Library, an artificial intelligence
              catalog co-developed with automation leaders Schneider Electric and Rockwell Automation to standardize and
              track operational asset specifications with high precision.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
