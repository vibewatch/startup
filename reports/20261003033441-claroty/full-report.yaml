      - number: '6.2'
        title: Adoption Trajectory, Enterprise Scale, and Strategic Channel Expansion
        blocks:
          - type: paragraph
            body: >-
              Claroty's commercial adoption has scaled from early industrial pilot deployments into enterprise-wide
              standardization across Fortune 100 conglomerates and multinational asset owners. Between 2020 and 2023,
              the company grew its active customer count by over 300%, driving annual recurring revenue past $100
              million in 2023. By early 2026, following its $150 million Series F financing, Claroty confirmed active
              commercial deployments with 24 of the Fortune 100 organizations, up from 20% in early 2024. Adoption
              velocity is significantly amplified by go-to-market alliances with major industrial automation original
              equipment manufacturers (OEMs), including Schneider Electric, Rockwell Automation, and Siemens, who serve
              simultaneously as strategic investors, technology integration partners, and distribution channels.
              Additionally, managed security service providers (MSSPs) including IBM, NTT Data, and eSentire incorporate
              Claroty into ongoing security operations center workflows. However, while aggregate customer growth
              metrics demonstrate accelerating enterprise penetration, Claroty does not publicly disclose absolute
              paying customer counts, customer cohort trajectories, or average annual contract value, requiring
              independent diligence on true deployment depth.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
