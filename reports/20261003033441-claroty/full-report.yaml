      - number: '4.3'
        title: Unit Economics and Margin Structure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Claroty's underlying unit economics reveals notable disclosure gaps typical of late-stage
              venture-backed infrastructure software firms. Key operating metrics—including gross margin percentages,
              Net Revenue Retention (NRR), Customer Acquisition Cost (CAC), and payback duration—remain confidential
              private metrics that are withheld from public statements. However, structural proxies indicate a gross
              margin profile governed by the hybrid nature of industrial OT deployments. On-premise deployments require
              initial network appliance configuration and high-touch professional services, which typically yield lower
              gross margins than pure multi-tenant cloud software. Conversely, expansion into the SaaS-native xDome
              architecture provides a pathway toward higher gross margins as software telemetry scales without dedicated
              hardware. Headcount data indicating approximately 750 to 859 employees suggests revenue per employee of
              $230,000 to $265,000, illustrating steady progress toward public SaaS operational efficiency benchmarks.
            claimRefs:
