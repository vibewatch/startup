      - number: '5.2'
        title: Operating Architecture, Integrations, and Data Engine
        blocks:
          - type: paragraph
            body: >-
              Claroty’s technical backbone is structured around non-disruptive data collection, distributed stream
              processing, and high-performance relational storage. Because cyber-physical systems cannot tolerate
              intrusive active scanning that risks operational disruptions or device reboots, Claroty employs five
              complementary discovery mechanisms: passive network monitoring via deep packet inspection, safe low-impact
              queries calibrated for fragile controllers, lightweight Claroty Edge collectors, engineering project file
              analysis (including PLC logic files), and ecosystem enrichment pulling from existing CMMS, CMDB, and
              biomedical inventories. For cloud-hosted xDome environments running on Amazon Web Services, Claroty
              deployed Amazon Aurora PostgreSQL with Aurora Optimized Reads on NVMe SSD storage and Aurora I/O-Optimized
              configurations. This architectural enhancement resolved write bottlenecks and temporary storage saturation
              caused by multi-attribute querying across millions of asset records, reducing complex dashboard API query
              latency from over 30 seconds to under one second while lowering database infrastructure costs by 50%.
              Third-party ecosystem integrations, including Elastic Agent and Datadog Marketplace modules, ingest
              normalized alert, event, and vulnerability streams via REST APIs to support SOC workflows.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE011
              - CE013
      - number: '5.3'
        title: Technical Differentiation, Threat Research, and Trust Controls
        blocks:
          - type: paragraph
            body: >-
              Claroty’s primary technical defensibility originates from its specialized CPS domain models and
              proprietary threat intelligence engine, Team82. Operating dedicated CPS testing laboratories, Team82 has
              discovered and responsibly disclosed over 650 vulnerabilities across industrial control systems, medical
              devices, and building automation protocols. Rather than relying exclusively on generic Common
              Vulnerability Scoring System (CVSS) metrics, Claroty calculates dynamic risk scores incorporating Known
              Exploited Vulnerabilities (KEVs), active ransomware campaign linkage, network exposure, and clinical or
              operational criticality. Because legacy medical and OT assets operate across 10-to-15-year lifecycles
              where direct firmware patching is unfeasible or delayed by FDA re-certification rules, Claroty generates
              compensating control profiles and network policy recommendations. These policies are enforced via
              bidirectional API integrations with microsegmentation platforms such as Elisity, Cisco Identity Services
              Engine (ISE), switches, and firewalls. For enterprise and government procurement trust, Claroty maintains
              an externally verified Trust Center documenting compliance with ISO 27001, ISO 27701, SOC 2 Type 2, GDPR,
              and HIPAA, alongside STIG-hardened configuration management controls supporting federal FISMA mandates.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Non-Disruptive Discovery Calibrated for Sensitive Operational Environments
            body: >-
              Claroty’s deployment of five complementary discovery methods—specifically passive deep packet inspection,
              safe low-impact queries, and project file parsing—allows organizations to achieve exhaustive visibility
              across fragile OT and IoMT networks without triggering device lockups, reboots, or patient safety
              incidents.
            calloutType: strength
            claimRefs:
              - CE001
              - CE007
          - type: callout
            title: Dependency on External Enforcement Fabric for Compensating Controls
            body: >-
              Because Claroty operates primarily as an intelligence, visibility, and policy recommendation platform,
              physical network isolation of vulnerable legacy systems relies entirely on third-party network
              controllers, switches, firewalls, and microsegmentation partners. A breakdown in downstream API
              orchestration leaves identified exposures unmitigated.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation by Buyer, Vertical, and Operational Environment
        blocks:
          - type: paragraph
            body: >-
              Claroty segments its customer base across four primary operating environments comprising the Extended
              Internet of Things (XIoT): industrial automation and operational technology (OT), healthcare Internet of
              Medical Things (IoMT), commercial facilities, and the public sector. Purchasing decisions involve distinct
              buyer and payer dynamics across these verticals. In industrial manufacturing, energy, and utilities, Chief
              Information Security Officers (CISOs) and Vice Presidents of Security Operations act as primary budget
              holders, but plant managers and Operational Technology directors retain veto authority to protect
              continuous production availability. In healthcare systems, Chief Information Officers and biomedical
              engineering leads partner with IT security to safeguard connected clinical equipment and patient
              monitoring devices. Across commercial infrastructure, real estate and building management teams procure
              exposure management for environmental control systems. In the public sector and defense agencies, Claroty
              targets federal civilian and intelligence infrastructure through specialized partnerships and
              certifications. Enterprise contracts are characterized by multi-site deployments that scale with the total
              number of connected assets and physical facilities monitored across hybrid architectures.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
          - type: table
            tableRef: TU001
