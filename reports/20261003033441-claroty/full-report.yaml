      - number: '6.3'
        title: Named Customer Proof, Strategic Investor Deployments, and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Claroty's customer reference base is closely linked to its ecosystem of strategic corporate backers and
              mission-critical asset operators. Industrial leaders such as BMW Group, through its venture arm BMW i
              Ventures, invested in Claroty to secure connected manufacturing operations and protect automotive assembly
              facilities against operational disruption. Similarly, automation leaders Rockwell Automation and Schneider
              Electric have embedded Claroty's continuous monitoring capabilities into joint customer deployments and
              co-developed the Claroty CPS Library to standardize device visibility. In the public sector, Claroty
              expanded federal and defense presence by appointing former U.S. Air Force leadership, partnering with
              Carahsoft to reach state, local, and educational (SLED) agencies, and integrating with Mission IT and
              Parsons' SealingTech to access the U.S. Intelligence Community and defense operational networks. While
              these strategic deployments validate enterprise-grade production readiness and rigorous security
              compliance, independent verification of individual commercial account satisfaction and renewal history
              remains constrained by widespread non-disclosure agreements across sensitive critical infrastructure
              operators.
            claimRefs:
              - CU009
              - CU010
