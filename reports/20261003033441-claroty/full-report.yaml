      - number: '3.3'
        title: Commercial Models, Pricing Opacity, and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercial procurement across the CPS protection category is characterized by extreme quote-based opacity,
              with no universal public price lists available from major vendors. Claroty licenses its platform through
              annual subscription or perpetual tiers scaling by protected asset volume, site count, and modular add-ons.
              While AWS Marketplace private listings for Claroty xDome indicate annual entry tiers starting around
              $100,000 for Essential packages and climbing past $1,200,000 for Advanced multi-site enterprise
              deployments with bundled engineering services, total cost of ownership (TCO) extends substantially beyond
              base software licensing. Enterprise buyers routinely incur significant auxiliary costs for professional
              deployment services across segmented OT enclaves, specialized hardware sensors, and complex API
              integrations into SIEM, SOAR, and NAC infrastructure. Furthermore, baseline tuning for OT anomaly
              detection introduces temporary alert noise that demands dedicated analyst bandwidth before reaching
              steady-state operations. A crucial commercial differentiator is first-party Secure Remote Access (SRA):
              Claroty provides native xDome Secure Access with credential vaulting, session recording, and asset-scoped
              least-privilege controls, whereas Nozomi Networks and Dragos rely on third-party remote access
              integrations, requiring buyers to negotiate separate software licensing.
            claimRefs:
              - CP003
              - CP011
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat Durability, Platform Expansion, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Claroty's competitive moat rests upon deep protocol parsing intellectual property, an extensive library of
              industrial communication protocols, and strategic distribution lock-in through global automation giants
              Rockwell Automation and Schneider Electric. These automation leaders not only participated as equity
              investors but actively bundle Claroty's Continuous Threat Detection (CTD) and xDome platforms into their
              managed cybersecurity service offerings. Switching costs are reinforced once an enterprise embeds
              Claroty's asset taxonomy into corporate ServiceNow CMDBs and establishes automated firewall segmentation
              rules based on Claroty Virtual Zones. Nevertheless, Claroty faces intensifying displacement and margin
              pressure on two fronts. First, Dragos has expanded aggressively beyond passive detection into active
              remediation via its Phosphorus acquisition—automating firmware updates, credential rotation, and
              configuration hardening—while acquiring runZero and NetRise in September 2026 to add device exposure
              management and firmware software bill of materials (SBOM) analysis. Second, Armis continues to capture
              enterprise-wide deals where CISOs prioritize broad visibility across mixed campus, healthcare, and IT
              networks over specialized Purdue Level 1/2 controller inspection. If industrial security spending
              consolidates under corporate IT budgets, Claroty risks commoditization unless it sustains clear protocol
              depth and expands automated remediation.
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP012
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Project File Advantage: Reaching What the SPAN Port Misses'
            body: >-
              In OT cybersecurity bake-offs, passive SPAN-only proofs-of-concept conceal a critical blind spot: network
              sniffing cannot see assets communicating over unrouted serial links, controllers inside isolated
              backplanes, or devices powered off during maintenance. Claroty's AppDB engine parses engineering project
              and backup configuration files directly, unlocking complete asset inventories for quiet or air-gapped
              devices without active scanning.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 'Segmentation Fallacy: Visibility Tools Recommend, But Do Not Enforce'
            body: >-
              Enterprise buyers frequently conflate OT visibility platforms with network enforcement. Claroty, Nozomi,
              and Dragos map Purdue zones and generate recommended micro-segmentation policies, but they do not enforce
              them inline. Actual policy enforcement requires separate firewall, switch, and NAC infrastructure,
              introducing substantial post-purchase implementation and coordination overhead.
            calloutType: risk
            claimRefs:
              - CP008
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Streams
        blocks:
          - type: paragraph
            body: >-
              Claroty operates an enterprise B2B cybersecurity model centered on recurring software subscriptions for
              cyber-physical systems protection across critical infrastructure, healthcare, and industrial operational
              technology networks. Commercial monetization occurs predominantly via annualized subscriptions priced
              according to the scale of monitored assets and physical facilities, delivered through the cloud-native
              Claroty xDome platform or on-premise Continuous Threat Detection (CTD) software. The company achieved a
              major commercial milestone by surpassing $100 million in annual recurring revenue during 2023, driven by
              rapid customer expansion across heavily regulated sectors. Third-party market intelligence indicates
              top-line revenue reached approximately $200 million by January 2026. Claroty's revenue quality benefits
              from multi-year enterprise commitments, high contract renewal rates, and deep integration with strategic
              industrial automation partners including Rockwell Automation, Schneider Electric, and Siemens.
            claimRefs:
