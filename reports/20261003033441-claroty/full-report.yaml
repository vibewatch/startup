              - CM011
              - CM014
      - number: '2.4'
        title: Growth Drivers, Regulatory Mandates, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Category adoption is accelerating under the dual pressure of targeted nation-state cyber campaigns and
              escalating government regulatory mandates. In 2026, multi-agency advisories from CISA, the FBI, NSA,
              Department of Energy, and Environmental Protection Agency documented extensive Iranian-affiliated cyber
              targeting of programmable logic controllers (PLCs), remote terminal units (RTUs), and human-machine
              interface (HMI) displays at U.S. water and energy utilities. These operational threats coincide with
              stringent compliance enforcement, including NERC CIP audit standards for bulk electric power, TSA security
              directives for oil and gas pipelines, and the European Union's NIS2 directive covering essential operators
              across healthcare, water, and manufacturing. However, several friction factors temper conversion velocity:
              industrial operators face severe shortages of dual-skilled IT/OT personnel, legacy controller
              architectures often remain in active service for decades past original support windows, and many plant
              operators harbor deep skepticism toward cloud telemetry uplinks, sustaining high demand for hybrid and
              strictly on-premises architectures.
            claimRefs:
              - CM003
              - CM007
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Architecture Shift: Point Solutions Yield to Unified CPS Platforms'
            body: >-
              Enterprise buyers are rapidly moving away from fragmented point tools toward unified platforms. Gartner
              estimates that by 2027, 75% of security teams will have on-boarded at least five distinct tools to manage
              cyber-physical systems security, driving up deployment complexity and total cost of ownership. Vendors
              capable of consolidating asset discovery, network protection, vulnerability management, and secure remote
              access into a single hybrid platform hold a substantial advantage in winning multi-year enterprise
              standardization contracts.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM015
          - type: callout
            title: Procurement Drag from IT/OT Organizational Bifurcation
            body: >-
              Despite high-profile regulatory mandates and urgent threat advisories, sales cycles for cyber-physical
              security platforms frequently extend from nine to twelve months. This friction stems from persistent
              governance silos between corporate IT security teams who control funding and plant operations teams who
              fear operational downtime. Vendors that fail to deliver frictionless passive discovery without requiring
              production hardware disruption face prolonged deployment stalls.
            calloutType: risk
            claimRefs:
              - CM002
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Architectural Split, Direct Peers, and Adjacencies'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape in cyber-physical systems (CPS) security divides along a fundamental
              architectural axis: deep packet inspection (DPI) platforms versus cross-estate asset intelligence engines.
              Claroty, Nozomi Networks, and Dragos operate primarily as DPI-first platforms whose physical or virtual
              sensors sit on mirrored network traffic via SPAN or TAP ports, dissecting industrial protocols locally to
              construct asset inventories, establish behavioral baselines, and detect anomalous commands. In contrast,
              Armis Centrix positions DPI as only one telemetry stream among dozens, relying primarily on API
              integrations across enterprise switches, firewalls, wireless controllers, Network Access Control (NAC),
              Endpoint Detection and Response (EDR), and Configuration Management Databases (CMDBs). This structural
              difference dictates enterprise fit: Armis delivers superior out-of-the-box visibility across blended
              enterprise IT, IoT, and clinical medical environments (IoMT), whereas Claroty, Nozomi, and Dragos provide
              documented visibility and forensic parsing at Purdue Model Levels 1 and 2 (controllers, remote terminal
              units, and safety instrumented systems). Beyond direct peers, the market includes industrial automation
              incumbents such as Rockwell Automation and Schneider Electric—who act simultaneously as strategic
              distribution partners and equity backers—alongside legacy IT security incumbents attempting to extend
              network access control into operational plants.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
