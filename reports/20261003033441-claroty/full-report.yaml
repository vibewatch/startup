        title: Corporate Identity, Founding History, and Leadership Structure
        blocks:
          - type: paragraph
            body: >-
              Claroty was founded in October 2014 as the second cybersecurity startup incubated by the Team8 foundry,
              launched by co-founders Amir Zilberstein (initial CEO), Galina Antova (Chief Business Development
              Officer), and Benny Porat (Chief Technology Officer) [CO001]. The company maintains headquarters in New
              York City with substantial research and engineering operations in Tel Aviv-Yafo, Israel, alongside
              regional presences across North America, Europe, Asia-Pacific, and Latin America [CO002]. Operating
              leadership is headed by Chief Executive Officer Yaniv Vardi, supported by a governance board including
              NightDragon Founder Dave DeWalt [CO003]. Functional executive appointments include former Ford Motor
              Company AI Chief Gil Gur Arie as Chief Product Officer and retired U.S. Air Force Colonel Jen Sovada
              leading public sector growth [CO004]. Total reported global headcount spans between 700 and 809 personnel
              across 27 countries, reflecting sustained global expansion [CO005].
