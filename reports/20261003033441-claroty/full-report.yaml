      - number: '6.4'
        title: Retention Durability, Land-and-Expand Mechanics, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Customer expansion within Claroty accounts follows a land-and-expand trajectory that typically begins with
              passive network monitoring and asset discovery across a single production plant, hospital campus, or data
              center. Once baseline asset visibility is established, customer accounts expand into recurring software
              modules covering exposure management, network protection, vulnerability and risk management (VRM), and
              secure remote access (SRA). However, customer retention and expansion face measurable structural
              headwinds. First, security leaders managing cyber-physical systems programs report organizational friction
              stemming from unclear operational ownership between corporate IT teams and plant engineering staff,
              insufficient specialized skills, and the absence of standardized maturity models. Second, enterprise
              procurement cycles commonly extend over several quarters due to stringent testing requirements on live
              production networks. Third, because Claroty is privately held, key customer durability metrics such as net
              revenue retention (NRR), gross revenue retention (GRR), logo churn, and customer concentration among top
              accounts are not publicly reported, representing a critical area for prospective investor diligence.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong Enterprise Moat Driven by Fortune 100 Penetration and Automation OEM Alliances
            body: >-
              Claroty's commercial position is reinforced by its entrenched presence across 24 of the Fortune 100
              organizations and deep go-to-market distribution partnerships with Schneider Electric, Rockwell
              Automation, and Siemens. Because these automation vendors design, install, and service the physical
              controllers that run global industrial plants, their joint commercial alignment with Claroty creates high
              barriers to entry for competing cybersecurity vendors.
            calloutType: strength
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
          - type: callout
            title: IT/OT Organizational Friction and Lack of Public Retention Disclosures
            body: >-
              Enterprise sales cycles in cyber-physical security remain vulnerable to organizational friction between
              corporate IT security teams and operational plant engineers who fear network downtime. Furthermore, as a
              private venture-backed company, Claroty does not publicly disclose net revenue retention (NRR), customer
              cohort churn rates, or top-customer revenue concentration, leaving investors dependent on private
              diligence to verify long-term renewal durability.
            calloutType: risk
            claimRefs:
              - CU002
