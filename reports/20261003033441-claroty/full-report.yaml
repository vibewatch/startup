  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Research more
        - >-
          Financing access and enterprise adoption are visible, but current operating economics and security terms are
          not.
        - Do not price or approve an investment before audited financial and capitalization diligence.
      - - Confidence
        - Medium on financing facts; low on value
        - >-
          The round size and reported valuation growth are corroborated, while the approximately $3 billion value is a
          media estimate.
        - Treat the headline value as a diligence lead rather than a confirmed post-money valuation.
      - - Risk rating
        - High underwriting risk
        - >-
          Current ARR, margins, retention, burn, debt balances, ownership, and preferences are not disclosed in the
          retained evidence.
        - Require a downside waterfall and cash-runway bridge before assessing common-equity protection.
      - - Valuation stance
        - Not underwritable from public data
        - >-
          The only public ARR milestone is from 2023 and cannot be paired with a 2026 estimated value as if periods
          matched.
        - Set entry discipline from current metrics, verified peer multiples, and security seniority.
    notes: >-
      Assessments distinguish announced financing, third-party estimates, historical ARR, and missing private-company
      terms; no target return or current revenue multiple is asserted.
