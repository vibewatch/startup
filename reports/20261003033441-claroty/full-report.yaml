      - number: '4.4'
        title: Capital Adequacy, Burn Dynamics, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Claroty's capital adequacy was substantially strengthened in January 2026 through a $150 million Series F
              financing round led by Golub Growth, complemented by up to $50 million in additional investor
              participation. This transaction brought cumulative funding to approximately $882 million across equity
              rounds and strategic credit agreements, following an earlier $100 million growth round in March 2024.
              Leadership has indicated that the company expects to reach profitability in the near term while actively
              preparing for an initial public offering as market windows permit. Nonetheless, prospective investors must
              underwrite several structural caveats. The Series F round incorporated a secondary liquidity component of
              $30 million to $40 million, enabling early stakeholders to take liquidity off the table. Furthermore,
              absence of audited disclosures regarding current monthly burn rates, remaining cash reserves, and
              liquidation preferences leaves downside protection uncertain. Validating exact preference structures and
              forward cash runway remains a critical diligence priority before underwriting late-stage equity
              participation.
            claimRefs:
