      - number: '3.2'
        title: Telemetry Architecture, Forensic Depth, and Protocol Parsing Differentiation
        blocks:
          - type: paragraph
            body: >-
              Evaluating CPS protection platforms requires analyzing how telemetry is gathered when passive network
              sniffing reaches its physical limits. While passive monitoring avoids operational disruption, it cannot
              inspect traffic contained entirely inside a programmable logic controller (PLC) backplane, unrouted serial
              links between field devices, or direct point-to-point engineering connections. To penetrate these blind
              spots, vendors deploy secondary collection mechanisms with distinct risk profiles. Claroty utilizes Safe
              Active Queries, sending native-protocol requests engineered to mirror standard engineering workstation
              communications, alongside its proprietary AppDB engine that directly parses offline PLC and SCADA project
              configuration files—reaching air-gapped, powered-down, or silent controllers. Nozomi Networks pairs
              passive collection with optional Smart Polling and host-based Nozomi Arc endpoint sensors, whereas Dragos
              utilizes lightweight software collectors and edge containers. In threat detection, Claroty deploys five
              parallel detection engines (anomaly detection, security behaviors, SNORT/YARA known threats, operational
              configuration changes, and custom rules). Dragos distinguishes itself through adversary-focused threat
              behavior analytics mapped directly to MITRE ATT&CK for ICS and backed by first-party incident response
              playbooks. However, Dragos has also closed the anomaly detection gap by introducing baseline learning
              modes, while all four vendors integrate with perimeter firewalls and switches to recommend segmentation
              policies rather than executing inline blocking directly.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
