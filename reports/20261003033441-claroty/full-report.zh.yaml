  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 必要假设
      - 估值与回报逻辑
      - 关键风险或触发因素
      - 概率信号
    rows:
      - - 乐观
        - 经核实的持久增长、强劲的留存率与毛利率、明确的造血可见度，且无重大高级清算优先权压顶。
        - 仅能对经审计的当前 ARR 应用当前可比公司估值倍数；目前尚无公开数据能够支撑估值区间。
        - 若增长质量或优先清算分配瀑布弱于所陈述的情况，该情景失效。
        - 未予量化；所需输入数据属于未公开信息。
      - - 基准
        - 具备充分的经常性增长、可信的盈利路径、稳定的客户留存率及标准的融资条款。
        - 以经核实的当前指标及直接可比的上市公司或并购证据作为入场定价锚点。
        - 若估算的融资估值并非普通股投后估值，则需重新定价。
        - 未予量化；缺失可比公司与营运数据。
      - - 悲观
        - 增速或留存放缓、持续需要现金补血、优先条款吞噬退出收益，或公开市场上市窗口持续关闭。
        - 在扣除债务与优先权后的较低退出估值下测算普通股分配瀑布；切勿依据已筹资金额推断估值区间。
        - 降估值融资、退出推迟，或由优先权导致的权益减值。
        - 未予量化；下行条款需依据股权结构表测算。
    notes: 本框架属于条件性分析，而非预测。由于当前营运数据、可比公司估值倍数及证券条款均无法获取，有意未提供数字估值区间、概率及目标回报率。
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
