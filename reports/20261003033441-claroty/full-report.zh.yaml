      - number: '2.3'
        title: 买方画像、治理冲突与采购动态
        blocks:
          - type: paragraph
            body: >-
              网络物理安全的采购决策权长期处于企业首席信息安全官（CISO）与工厂运营工程经理的博弈焦点。尽管企业 CISO 和安全运营副总裁日益掌控正式的资本预算，但 OT
              总监和首席运营官对任何可能威胁生产线连续可用性的工具保留实际否决权。客户落地通常始于安全审计、合规检查或行业性网络预警，促使客户在单个重点工厂、水处理设施或医院院区启动概念验证（PoC）。企业采购普遍要求安全厂商证明自身能与老旧
              SCADA 网络平滑共存，且无需重构硬件架构。一旦建立起被动监控可见性，预算便会从最初的资产发现扩展至漏洞管理、微隔离策略建模以及特权远程会话访问等经常性运营授权许可。
