        blocks:
          - type: paragraph
            body: >-
              Claroty 的核心技术壁垒源自专有的 CPS 领域模型及自研威胁情报引擎 Team82。Team82 拥有专属的 CPS 测试实验室，已在工业控制系统、医疗设备和楼宇自动化协议中发现并负责任地披露了超过
              650 个漏洞。Claroty 并非单一依赖通用的通用漏洞评分系统（CVSS）指标，而是结合已知被利用漏洞（KEV）、活跃勒索软件关联、网络暴露面以及临床或运营关键性，动态计算综合风险分值。鉴于传统医疗与 OT
              资产的服役周期长达 10 至 15 年，直接打固件补丁往往难以推行或受阻于 FDA 重新认证流程，Claroty 提供补偿性控制方案与网络策略建议。这些策略通过双向 API 对接 Elisity、Cisco
              Identity Services Engine（ISE）、交换机及防火墙等微隔离平台落地执行。为满足企业与政府采购的信任要求，Claroty 设有经外部审计的 Trust Center，证明其符合 ISO
              27001、ISO 27701、SOC 2 Type 2、GDPR 及 HIPAA 规范，并具备支持联邦 FISMA 合规要求的 STIG 加固配置管理能力。
