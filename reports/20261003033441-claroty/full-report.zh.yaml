  - id: FU001
    title: 客户旅程地图：CPS 安全采纳与扩张
    type: journey-map
    summary: 企业客户多阶段采纳生命周期，从初始风险触发、被动资产可视性，一直延伸至全面的多模块零信任扩张。
    data:
      items:
        - label: 阶段 1：威胁触发与合规审计
          summary: >-
            Critical infrastructure security alerts, ransomware incidents on physical operations, or NIS2/NERC-CIP
            compliance audits trigger executive demand for OT visibility.
          touchpoints:
            - CISO 高管威胁简报
            - 法规合规差距评估
            - 第三方网络保险审计
          note: IT 安全部门发起评估；工厂运维团队要求证明部署不会干扰生产。
        - label: 阶段 2：被动发现概念验证（PoC）
          summary: >-
            Claroty deploys passive network monitoring across a pilot facility or hospital campus to map cyber-physical
            assets without active network scanning.
          touchpoints:
            - 安装 Claroty Continuous Threat Detection（CTD）硬件设备
            - 接入 Claroty xDome 云端遥测
            - 生成资产发现与库存盘点基线
          note: 向厂长及临床工程团队证实非侵入式运维安全性。
        - label: 阶段 3：生产环境上线与资产基线建立
          summary: >-
            Customer approves production contract across multiple production plants or regional healthcare facilities,
            utilizing the Claroty CPS Library for asset classification.
          touchpoints:
            - 多站点企业许可协议
            - 集成 CPS Library 自动化资产目录
            - 与 CrowdStrike、ServiceNow 及企业 SIEM 集成
          note: 在数十万台 XIoT 设备上建立基础运行可视性。
        - label: 阶段 4：模块化平台扩张
          summary: >-
            Customer expands license beyond basic visibility into vulnerability and risk management (VRM),
            micro-segmentation, and zero-trust Secure Remote Access (SRA).
          touchpoints:
            - 面向外部 OEM 技术人员推广 xDome Secure Access
            - 启用符合 STIG 加固标准的配置合规能力
            - 漏洞优先级排序与自动化缓解工作流
          note: 提升单客年经常性收入，巩固平台的长期防御壁垒。
        - label: 阶段 5：企业级标准化与合作伙伴治理
          summary: >-
            Enterprise standardizes Claroty as the corporate CPS security backbone managed via OEM partners like
            Rockwell Automation or MSSP partners like IBM.
          touchpoints:
            - 全球多年期企业级标准化合同
            - MSSP 持续监控与 SOC 告警升级
            - 协同落地工业零信任架构
          note: 最大化切换成本；在全球财富 100 强客户中实现顶格的留存持久度。
        - label: 阶段 6：持续保障与 AI 智能体集成
          summary: >-
            Customer deploys autonomous AI agents like Claire alongside ongoing vulnerability prioritization to maintain
            real-time cyber resilience across evolving physical infrastructure.
          touchpoints:
            - 部署 Claroty Claire AI 安全智能体
            - 自动化 CPS 风险削减遥测
            - 高管风险汇报与审计核验
          note: 支撑长期扩张，并在分布式全球站点落地持续资产防御。
    approximationNotes: 生命周期阶段建模提炼自 Claroty 客户案例研究及合作伙伴分销流程中沉淀的企业采购旅程。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU009
      - CU010
      - CU014
      - CU015
