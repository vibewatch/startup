      - number: '6.4'
        title: 留存韧性、增购拓客机制与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Claroty
              客户内部的增购拓展遵循典型的滚雪球路径：通常始于单家制造工厂、医院院区或数据中心的被动网络监控与资产发现；一旦建立基础资产可见性，客户便会扩购经常性软件模块，覆盖暴露面管理、网络防护、漏洞与风险管理（VRM）以及安全远程访问（SRA）。然而，客户留存与增购仍面临切实的结构性阻力：其一，掌管网络物理系统项目的安全负责人普遍反映存在组织协同摩擦，主因是企业
              IT 团队与工厂工程人员权责界限模糊、专业技能储备不足且缺乏标准化的成熟度评估模型；其二，由于在线生产网络测试要求严苛，企业采购周期常拖延数个季度；其三，鉴于 Claroty
              属于未上市私有公司，净留存率（NRR）、总留存率（GRR）、客户流失率及头部客户集中度等衡量客户韧性的核心指标均未公开披露，构成了潜在投资人必须审慎尽调的关键领域。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 财富 100 强高渗透率与自动化 OEM 联盟构筑坚实壁垒
            body: >-
              Claroty 在 24 家财富 100 强（Fortune 100）企业的深度渗透，以及与 Schneider Electric、Rockwell Automation、Siemens
              的紧密渠道分销合作，巩固了其商业地位。鉴于这些自动化厂商负责设计、安装和维护运行全球工业设施的物理控制器，它们与 Claroty 的商业联合为同类网络安全竞品筑起了极高的准入门槛。
            calloutType: strength
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
          - type: callout
            title: IT/OT 组织协同阻力与留存数据缺乏公开披露
            body: >-
              网络物理安全的企业销售周期极易受挫于组织协同阻力：总部 IT 安全团队与担忧生产停机的工厂运维工程师之间存在认知鸿沟。此外，作为一家由风投支持的未上市初创企业，Claroty
              未公开披露净留存率（NRR）、客户队列流失率或头部客户收入集中度，投资人验证其长期续约韧性只能依赖私下尽调。
            calloutType: risk
