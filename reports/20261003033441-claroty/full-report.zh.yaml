  - id: FE001
    title: Claroty CPS 防护平台架构技术栈
    type: stack
    summary: Claroty 平台逻辑架构分层，展示从物理资产遥测到云端分析及执行集成的端到端数据流。
    data:
      layers:
        - label: 生态集成与安全运营层
          detail: 双向 REST API 连接器，集成 SIEM/SOAR（Elastic、Datadog）、NAC（Cisco ISE）及微隔离执行引擎（Elisity）。
        - label: 分析、风险评分与策略建模层
          detail: Claroty xDome 与 CTD 分析引擎，基于 CISA KEV、勒索软件关联及自动化分段规则计算动态风险评分。
        - label: 高吞吐存储与核心查询基础设施
          detail: Amazon Aurora PostgreSQL 基于 NVMe SSD 上的 Aurora Optimized Reads 与 Aurora I/O-Optimized 集群，支持亚秒级延迟的多属性资产筛选。
        - label: 威胁研究与规格情报引擎
          detail: 涵盖 650+ 已披露漏洞的 Team82 威胁研究库，以及与 Schneider Electric 和 Rockwell Automation 联合开发的 AI 驱动 CPS Library。
        - label: 多模式 CPS 资产发现与遥测层
          detail: 五种无干扰发现机制：被动 DPI、安全查询、Claroty Edge 轻量级采集器、工程文件分析及生态富化。
        - label: 网络物理系统（CPS）环境层
          detail: 目标物理网络涵盖营运技术（OT/ICS）、医疗物联网（IoMT）、楼宇自动化系统（BAS）及企业物联网（IoT）。
    approximationNotes: 概念架构模型来源于 Claroty 平台技术规格、AWS 技术白皮书及合作伙伴集成文档。
