      - number: '3.3'
        title: 商业模式、定价不透明度与总拥有成本
        blocks:
          - type: paragraph
            body: >-
              CPS 防护品类的商业采购呈现极度依赖单笔报价的特点，主流厂商均无公开的统一价格表。Claroty 的平台授权采用按年订阅或永久许可模式，收费随受保护资产规模、站点数量及模块化增购组件阶梯式递增。尽管 AWS
              Marketplace 针对 Claroty xDome 的私有报价显示，Essential 基础版入门年费约 $100,000，而捆绑工程服务的 Advanced 多站点大型企业部署年费超过
              $1,200,000，但总拥有成本（TCO）远高于基础软件许可费用。企业买方往往还需承担显著的额外支出，包括在隔离 OT 区域内的专业部署服务、专用硬件传感器，以及对接 SIEM、SOAR 和 NAC
              基础设施的复杂 API 集成。此外，OT 异常检测的基线调优在达到稳态运行前会产生阶段性告警噪音，占用专门的分析师精力。一个关键的商业差异化点在于原生安全远程访问（SRA）：Claroty 提供原生的 xDome
              Secure Access，具备凭据保险库、会话录制和按资产细粒度划分的最小特权控制；而 Nozomi Networks 和 Dragos 则依赖第三方远程访问集成，买方需另行谈判软件授权。
            claimRefs:
