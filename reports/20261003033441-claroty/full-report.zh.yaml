  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              网络物理系统（CPS）安全的目标市场涵盖用于发现、监控、评估和防御运营技术（OT）、工业控制系统（ICS）、医疗物联网（IoMT）与智能楼宇管理系统（BMS）的软件、硬件设备及专业服务。传统的 IT
              安全侧重于保障服务器与终端的数据机密性，CPS
              安全则优先考虑脆弱控制器、传感器与执行器的可用性、人身物理安全及运行韧性——这些设备无法承受主动式网络扫描或意外停机。纳入该目标市场的支出包括：被动及安全的主动网络监控、持续威胁暴露面管理、面向内部与第三方技术人员的安全远程访问（SRA），以及专用的
              CPS 威胁情报。该核心边界之外的支出则包括标准企业 IT 终端防护平台（EDR）、通用云安全态势管理（CSPM）、身份与访问管理（IAM）目录服务以及常规物理安防设施控制。在这一市场格局中，Claroty
              将其业务范围界定为扩展物联网（XIoT），将传统的车间制造自动化与临床医疗设备、商业楼宇基础设施整合在同一架构之下。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
      - number: '2.2'
        title: 市场规模测算、TAM/SAM/SOM 拆分与增长视角
        blocks:
          - type: paragraph
            body: >-
              第三方机构 MarketsAndMarkets 的研究显示，全球运营技术安全市场规模在 2025 年为 $23.54 billion，2026 年预计攀升至 $27.39 billion，年增速约
              16%。与此同时，ABI Research 的长期跟踪数据显示，范围更广的关键基础设施 OT/ICS 安全市场在 2023 年为 $12.75 billion，预计到 2028 年将扩张至 $21.60
              billion。测算可服务市场（SAM）需要按交付与产品类型对支出进行细分：据 Mordor Intelligence 统计，2025 年本地硬件与软件部署仍占该品类支出的
              70.42%；而在咨询与集成服务之外，纯软件方案贡献了厂商总收入的 62.34%。Claroty
              的可服务市场机遇正处于商业化平台软件与高威胁垂直行业混合部署的交汇点。至于可获取市场（SOM）的份额争夺，则直接受到既有自动化合同、IT 与工厂工程部门之间的采购割裂，以及与 Dragos、Nozomi
              Networks 等专业同行的多方选型竞标所制约。
            claimRefs:
              - CM005
