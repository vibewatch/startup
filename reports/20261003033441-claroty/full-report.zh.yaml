  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规要求与联邦治理
        blocks:
          - type: paragraph
            body: >-
              Claroty 的市场扩张高度绑定联邦网络安全指令与关键基础设施合规框架 [CR005]。伴随网络物理系统（CPS）面临的地缘政治威胁加剧，监管机构已从自愿性指引转向强制性合规要求，包括 CISA
              紧急指令、NIST 指南以及美国国防部网络安全成熟度模型认证（CMMC）规范 [CR002, CR005]。Claroty xDome 和 Continuous Threat Detection（CTD）通过
              STIG 加固的配置管理基准，提供满足 FISMA 等联邦合规所必需的配置控制与日志审计能力 [CR005, CR008]。然而，在公共部门客户中实现并维持合规带来了持续的审计风险与繁重的验证要求 [CR002,
              CR005]。据联邦机构报告，过去一年内 100% 的机构启动了新的 CPS 安全项目，但仅有 36% 实现了全量资产可见性，超过 60% 遭遇内部 CPS
              技能短缺，导致项目落地与合规周期极易受阻于客户侧的执行瓶颈 [CR005]。若客户未能建立严格的举证路径或无法校验自动化合规映射，可能招致监管审查并带来虚假的合规安全感 [CR002]。
            claimRefs:
              - CR002
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR008
      - number: '7.2'
        title: 运营暴露面、漏洞积压与智能体 AI 治理
        blocks:
          - type: paragraph
            body: >-
              CPS 环境中的运行安全风险与传统企业 IT 存在本质差异，因为业务中断可能直接导致产线停摆、市政水务瘫痪或医疗救治受阻 [CR002, CR003]。Claroty 旗下 Team82 对超过 125,000
              项运营技术（OT）资产的研究表明，3.7% 的 OT 资产存在不安全的公网连接，13% 的关键工程师工作站（EWS）与人机界面（HMI）存在不安全的直接互联网接入 [CR003,
              CR004]。更严峻的是，在这些连接公网的 EWS 和 HMI 中，有 36% 至少包含一个已确认的已知被利用漏洞（KEV），形成了极高危的初始入侵通道与横向移动暴露面 [CR003,
              CR004]。由于工业控制器往往在不停产的前提下无法热修复打补丁，运维人员必须高度依赖网络隔离与安全远程访问等补偿性控制手段 [CR001, CR003]。此外，Claroty 近期推出的 CPS 原生 AI
              安全智能体 Claire 及 xDome 架构下的模型上下文协议（MCP）服务器，引入了新型运维与软件供应链风险 [CR002]。独立尽调表明，在关键任务 OT 环境中部署智能体 AI
              存在诸多失效模式，包括危险的修复处置建议、工具权限泛滥、导入资产备注带来的提示词注入，以及遥测解析性能衰退 [CR002]。OT
              安全治理要求买方在启用自动化修复动作前，必须强制执行只读校验、严格遵守变更窗口，并引入人机协同（Human-in-the-Loop）审批机制 [CR002]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
