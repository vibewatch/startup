      - number: '6.3'
        title: 标杆客户实证、战略投资方落地与客户评价质量
        blocks:
          - type: paragraph
            body: >-
              Claroty 的标杆案例与其战略投资方生态及关键基础设施运营方紧密交织。工业龙头宝马集团（BMW Group）通过旗下风投机构 BMW i Ventures 投资
              Claroty，以守护联网制造业务并保护汽车总装厂免受停机干扰。自动化巨头 Rockwell Automation 与 Schneider Electric 同样将 Claroty
              的持续监控能力嵌入联合客户交付中，并共同研发 Claroty CPS Library 以标准化设备可见性。在公共部门，Claroty 任命前美国空军将领拓展联邦与国防业务，携手 Carahsoft
              触达州、地方及教育（SLED）机构，并对接 Mission IT 与 Parsons 旗下 SealingTech
              切入美国情报界和国防作战网络。尽管这些标杆部署印证了企业级投产能力与严苛的安全合规性，但由于关键基础设施运营方普遍签署了保密协议，外部独立核实商业客户的满意度与续约记录仍受到客观制约。
