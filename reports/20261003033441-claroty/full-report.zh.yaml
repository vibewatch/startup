            body: >-
              Claroty 将其客户群按扩展物联网（XIoT）的 4
              大核心运行环境进行细分：工业自动化与运营技术（OT）、医疗物联网（IoMT）、商业设施以及公共部门。各垂直行业的采购决策机制与预算主体各异。在工业制造、能源和公用事业领域，首席信息安全官（CISO）与安全运营副总裁掌握主要预算，但工厂经理和
              OT 总监拥有否决权，以确保生产连续可用；在医疗系统中，首席信息官与生物医学工程主管协同 IT
              安全部门共同守护联网临床设备及患者监护仪器；在商业地产领域，楼宇管理团队针对环境控制系统采购暴露面管理方案；在公共部门和国防机构中，Claroty
              则借助专项合作伙伴与资质认证主攻联邦民事及情报基础设施。企业合同通常覆盖多个站点，费用会随混合架构监控的联网资产总量和物理设施数量增加而上升。
