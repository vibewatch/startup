        blocks:
          - type: paragraph
            body: >-
              Claroty 成立于 2014 年 10 月，是 Team8 孵化器培育的第二家网络安全初创企业，由联合创始人 Amir Zilberstein（首任 CEO）、Galina Antova（首席业务拓展官）和
              Benny Porat（首席技术官）共同创立 [CO001]。公司总部位于纽约，在以色列特拉维夫-雅法设有核心研发与工程中心，并在北美、欧洲、亚太和拉美设立了区域分支机构 [CO002]。日常经营管理由首席执行官
              Yaniv Vardi 主持，董事会成员包括 NightDragon 创始人 Dave DeWalt [CO003]。在高管团队配置上，前 Ford Motor Company AI 负责人 Gil Gur
              Arie 出任首席产品官，美国空军退役上校 Jen Sovada 负责统领公共部门业务增长 [CO004]。据报道，公司目前在 27 个国家拥有 700 至 809 名员工，业务持续向全球扩张 [CO005]。
