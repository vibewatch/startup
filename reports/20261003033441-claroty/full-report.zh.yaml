  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 视角
      - 论点
      - 证据
      - 何种情况会改变观点
    rows:
      - - 投资逻辑：需求
        - 持续存在的网络物理安全敞口带来了持久的防护需求。
        - Facilities Dive 报道了 Claroty 针对楼宇管理设备中广泛存在的已知漏洞的研究。
        - 若预算或部署未能转化为持久的订阅收入，该观点将动摇。
      - - 投资逻辑：采纳
        - 财富 100 强企业的采纳表明该平台具备向复杂大型企业销售的能力。
        - 据 Claroty 报道，公司在 2026 年 1 月与 24 家 Fortune 100 强企业展开合作。
        - 若能获得经独立核实的续约、增购及客户集中度数据，该观点将进一步强化。
      - - 反向逻辑：经济模型
        - 行业认可与融资并不能证明单客经济模型具备吸引力。
        - 保留的融资报道未披露当前 ARR、增速、毛利率、净留存率、烧钱速度与现金跑道。
        - 经审计的高质量经常性增长及可信的造血路径将缓解这一担忧。
      - - 反向逻辑：资本结构
        - 规模庞大且历经多轮的资本基础，可能使普通股的回报结果对优先条款高度敏感。
        - 据 Tracxn 报道，公司在 8 轮融资中累计募集 $882 million，而公开来源未披露优先清算分配瀑布。
        - 干净的股权结构表、标准的优先股条款以及有限的债务，将实质性改善下行情景。
    notes: 需求与采纳逻辑采用了公司口径与独立报道；反向逻辑则明确指出了公开层面无法获取的营运与资本结构证据。
