              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 渠道集中度、商业依赖与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Claroty 的商业规模高度倚重通过渠道分销商、超大规模云厂商和原始设备制造商（OEM）联盟构建的间接销售模式 [CR005, CR006, CR007]。在公共部门，Claroty 依托 Carahsoft
              作为政府总代理，通过 NASPO ValuePoint 合同分销，形成了对 Carahsoft 联邦转售体系的运营与交易对手依赖 [CR005]。在技术与产品研发端，Claroty 与战略投资方 Rockwell
              Automation、Schneider Electric 合作开发 CPS Library 等项目，并基于 AWS 搭建云端托管的 xDome 基础设施 [CR001, CR006, CR007]。云端托管的
              xDome 部署带来了第三方云可用性风险，也对高度物理隔离的工业现场造成实施摩擦 [CR006]。至关重要的是，尽管 Claroty 披露在 2023 年实现了 $100M+ ARR，并在 2026 年 1
              月完成了 $150M 的 Series F 轮融资，但当前 ARR、续约率、毛利率、烧钱速度、各行业收入结构以及客户集中度指标均未对外公开 [CR007, CR008]。这些未披露数据为潜在的后期及
              Pre-IPO 投资人带来了显著的财务投资评估不确定性 [CR007]。
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: 展品
        blocks:
          - type: callout
            title: 物理隔离的幻觉与无法热修复的 KEV 暴露面
            body: >-
              以往 OT 团队主要靠物理隔离防护工业网络，但 Claroty 自身研究显示，13% 的关键工作站与 HMI
              存在活跃互联网连接，超过三分之一带有已确认被利用的已知漏洞。受制于工业设备连续运行要求，团队往往无法主动打补丁，因此必须把网络隔离与零信任远程访问作为关键补偿控制措施。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: 智能体 AI 必须设置人机协同护栏
            body: >-
              潜在买方在评估 Claroty Claire 或类似 CPS 原生 AI
              安全智能体时，必须在接入期强制执行只读验证，严禁向工控网络写入自主修复指令。关键物理环境在授权任何自动化重新配置之前，必须取得变更顾问委员会正式批准，并严格对齐检修停机窗口。
            calloutType: recommendation
            claimRefs:
              - CR002
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑在于 Claroty 兼具持久的需求背景与大客户采购落地证据：公司在 2026 年 1 月融资公告中披露服务 24 家 Fortune 100 企业，Facilities Dive 对 Claroty
              研究的报道也指明楼宇自控设备普遍存在已知漏洞。这些事实支撑了网络物理系统（CPS）防护的必要性，却无法坐实 Claroty
              的续约经济模型与市场份额。反向逻辑因此立足于证据本身而非全盘否定：最新融资材料并未披露当前 ARR、增速、毛利率、净留存率、烧钱速度与现金跑道。Claroty 入选 Cloud 100
              虽是积极信号，但对应支撑页面由公司发布，只披露了排榜方法论而未公布 Claroty 的具体得分。产品契合度与客户 Logo 无法替代经审计的经营质量。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
