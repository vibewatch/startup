      - number: '2.4'
        title: 增长驱动因素、监管合规要求与落地制约
        blocks:
          - type: paragraph
            body: >-
              在国家级网络攻击与政府监管强化的双重推动下，该品类的企业采纳显著提速。2026 年，来自
              CISA、FBI、NSA、美国能源部和环境保护署的多部门联合预警指出，伊朗关联黑客大范围针对美国水务和能源公用事业机构的可编程逻辑控制器（PLC）、远方终端单元（RTU）和人机界面（HMI）发起网络攻击。与此类现实威胁并行的还有日益严苛的合规审查，包括针对大电网的
              NERC CIP 审计标准、针对油气管道的 TSA 安全指令，以及欧盟面向医疗、水务和制造业关键运营实体的 NIS2 指令。但多重现实阻力减缓了采购转化节奏：工业运营方严重缺乏兼具 IT 与 OT
              技能的复合型人才，老旧控制器架构往往超出设计使用年限数十年仍在线运行，许多工厂管理者对云端遥测回传心存疑虑，使得市场对混合部署及纯本地部署架构保持强烈需求。
            claimRefs:
              - CM003
              - CM007
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 架构演进：单点工具让位于一体化 CPS 平台
            body: >-
              企业买方正从零散的单点工具加速转向统一平台。Gartner 预计，到 2027 年，75% 的安全团队将引入至少 5
              种不同工具来管理网络物理系统安全，推高部署复杂度与总拥有成本。能够将资产发现、网络防护、漏洞管理和安全远程访问整合至单一混合平台的厂商，在争夺企业多年期标准化大单中占据显著优势。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM015
          - type: callout
            title: IT/OT 组织割裂导致的采购阻力
            body: >-
              尽管合规要求严苛且威胁预警频发，网络物理安全平台的销售周期仍常拖延 9 至 12 个月。这种阻力根源于组织内部的治理壁垒：掌握资金的总部 IT
              安全团队与担忧停机风险的工厂运营团队诉求不一。若安全厂商无法在不干扰生产硬件的前提下实现平滑的被动资产发现，将面临漫长的部署停滞。
            calloutType: risk
