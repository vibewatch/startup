              Claroty 平台专为网络物理系统（CPS）直接掌控实体工业流程、生产安全与患者看护的环境打造。公司主要通过两种形态交付能力：旨在快速实现云端价值的模块化 SaaS 平台 Claroty
              xDome，以及为物理隔离或受严格监管工业现场提供全方位网络可见性与管控的本地部署方案 Claroty Continuous Threat
              Detection（CTD）。无论何种部署形态，该平台均整合了五大核心支柱：深度资产发现与清点、自动化暴露面管理、网络策略建模与防护、安全交互式远程访问，以及实时威胁检测。在医疗临床环境中，Claroty
              xDome for Healthcare 融合收购 Medigate 所得的技术，协同保护医疗物联网（IoMT）设备、楼宇管理系统（BMS）及运营技术（OT）。此外，该产品线还纳入了与自动化巨头
              Schneider Electric 及 Rockwell Automation 联合研发的 AI 资产目录 CPS Library，能够高精度标准化并追踪运营资产规格。
