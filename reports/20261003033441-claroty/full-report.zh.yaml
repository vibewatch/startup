  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：架构分野、直接竞品与相邻生态
        blocks:
          - type: paragraph
            body: >-
              网络物理系统（CPS）安全市场的竞争格局沿一条核心架构路线分化：深度数据包检测（DPI）平台与跨资产情报引擎的分野。Claroty、Nozomi Networks 和 Dragos 主要作为 DPI
              优先型平台运作，其实体或虚拟传感器通过 SPAN 或 TAP 镜像端口接入网络流量，在本地解析工业协议，以此构建资产清单、建立行为基线并检测异常指令。相比之下，Armis Centrix 仅将 DPI
              视为数十种遥测数据流之一，主要依赖企业交换机、防火墙、无线控制器、网络准入控制（NAC）、终端检测与响应（EDR）及配置管理数据库（CMDB）的 API 集成。这种架构差异决定了客户选型：Armis 在
              IT、IoT 和临床医疗（IoMT）混合环境中具备更优秀的开箱即用可见性；而 Claroty、Nozomi 和 Dragos 则在普渡模型（Purdue Model）第 1 层和第 2
              层（控制器、远方终端单元及安全仪表系统）提供经过充分验证的可见性与取证解析能力。在直接竞品之外，该市场还包括 Rockwell Automation 和 Schneider Electric
              等工业自动化巨头（它们既是战略分销渠道又是股权投资方），以及试图将网络准入控制延伸至工业现场的传统 IT 安全厂商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
      - number: '3.2'
        title: 遥测架构、取证深度与协议解析差异化
        blocks:
          - type: paragraph
            body: >-
              评估 CPS
              防护平台需要考察当被动网络监听达到物理极限时遥测数据的采集手段。被动监控虽能避免业务中断，却无法探查完全局限在可编程逻辑控制器（PLC）背板内部的流量、现场设备之间未路由的串口连接，或点对点的工程师直连通信。为消除这些盲区，各厂商采用了风险特征各异的辅助采集机制。Claroty
              采用 Safe Active Queries，发送模拟标准工程师工作站通信的原生协议请求，同时依托独创的 AppDB 引擎直接解析离线 PLC 和 SCADA
              工程配置文件——借此覆盖物理隔离、关机或静默状态的控制器。Nozomi Networks 将被动采集与可选的 Smart Polling 以及基于主机的 Nozomi Arc 终端传感器结合；Dragos
              则采用轻量级软件采集器与边缘容器。在威胁检测领域，Claroty 部署了 5 套并行检测引擎（异常检测、安全行为、SNORT/YARA 已知威胁、运营配置变更与自定义规则）。Dragos 的优势在于紧密结合
              MITRE ATT&CK for ICS 的对手威胁行为分析，并辅以第一方应急响应预案支持。不过 Dragos
