            body: >-
              Claroty 的技术底层围绕非侵入式数据采集、分布式流处理以及高性能关系型存储构建。鉴于网络物理系统无法耐受可能导致业务中断或设备重启的主动扫描，Claroty 采用了 5
              种互补的资产发现机制：通过深度数据包检测进行被动网络监控、针对脆弱控制器校准的安全低影响查询、轻量级 Claroty Edge 采集器、工程项目文件分析（包括 PLC 逻辑文件），以及调用既有 CMMS、CMDB
              和生物医学设备资产库的生态数据补全。针对运行在 Amazon Web Services 上的云端 xDome 环境，Claroty 部署了配置 NVMe SSD 存储上 Aurora Optimized
              Reads 以及 Aurora I/O-Optimized 的 Amazon Aurora PostgreSQL。该架构优化解决了数百万条资产记录多属性查询引发的写入瓶颈与临时存储饱和问题，将复杂仪表盘 API
              查询延迟从超过 30 秒压缩至 1 秒以内，同时将数据库基础设施成本降低了 50%。面向第三方生态集成，Elastic Agent 和 Datadog Marketplace 等模块通过 REST API
              摄入标准化告警、事件与漏洞数据流，有力支撑 SOC 运营流程。
