companyProfile:
  summary: >-
    Claroty 是一家专注于网络物理系统（CPS）防护的未上市网络安全公司，业务覆盖运营技术（OT）、工业控制系统（ICS）、医疗物联网（IoMT）以及商业楼宇环境。旗下 xDome 与 Continuous Threat
    Detection 产品服务于各类企业级客户，在不干扰脆弱生产或临床系统的前提下，提供被动资产发现、暴露面管理、威胁检测和安全远程访问。公司拥有广泛的企业级落地与战略级 OEM 及渠道合作，但仍未公开披露当前
    ARR、毛利率、留存率及现金消耗等核心经营指标。
