      - number: '3.4'
        title: 护城河韧性、平台扩张与被替换风险
        blocks:
          - type: paragraph
            body: >-
              Claroty 的竞争护城河依托于深厚的协议解析知识产权、庞大的工业通信协议库，以及与全球自动化巨头 Rockwell Automation 和 Schneider Electric
              建立的排他性渠道分销绑定。这两家自动化龙头不仅是其股权投资方，还将 Claroty 的 Continuous Threat Detection（CTD）和 xDome
              平台深度打包进自家的托管网络安全服务。当客户将 Claroty 的资产分类体系嵌入企业级 ServiceNow CMDB，并基于 Claroty Virtual Zones
              建立自动化防火墙隔离策略时，客户转换成本进一步筑牢。然而，Claroty 也面临两重替代与毛利挤压风险：其一，Dragos 凭借对 Phosphorus
              的收购，从被动检测大举进军主动修复——实现了固件更新、凭据轮换和配置加固的自动化，并在 2026 年 9 月收购 runZero 与
              NetRise，补齐设备暴露面管理与固件软件物料清单（SBOM）分析能力；其二，在 CISO 优先考虑覆盖园区、医疗及 IT 混合网络整体可见性、而非深究普渡模型 1/2 层专业控制器检查的场景中，Armis
              持续拿下企业级大单。一旦工业安全支出被收归企业 IT 预算统筹，Claroty 若不能保持协议深度并拓展自动化处置能力，将面临产品被平庸化替代的风险。
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP012
              - CP014
              - CP016
      - number: '3.5'
        title: 展品
        blocks:
          - type: callout
            title: 工程文件解析优势：覆盖 SPAN 端口遗漏的死角
            body: >-
              在 OT 网络安全选型竞标中，仅靠被动 SPAN 镜像的概念验证隐藏着重大盲区：网络监听无法探查通过未路由串口通信的资产、孤立背板内的控制器，或维护期间关机的设备。Claroty 的 AppDB
              引擎直接解析工程项目与备份配置文件，无需主动扫描即可梳理出静默或物理隔离设备的完整资产清单。
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 网络隔离的误区：可见性工具仅能提供建议，无法直接执行阻断
            body: >-
              企业买方常将 OT 可见性平台与网络执行能力混为一谈。Claroty、Nozomi 和 Dragos
              虽然能梳理普渡模型网络区域并生成微隔离策略建议，但均无法直接串行执行阻断。实际策略落地依然仰赖独立的防火墙、交换机和 NAC 基础设施，带来可观的后期实施与跨部门协调成本。
            calloutType: risk
            claimRefs:
              - CP008
              - CP014
