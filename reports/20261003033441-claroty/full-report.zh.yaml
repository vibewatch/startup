      - number: '8.3'
        title: 情景假设、退出准备度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支撑乐观、基准或悲观情景的定量估值区间。所获证据中唯一可用的参考锚点，只有 Claroty 自身历史融资标杆、第三方给出的约 $3B 预估，以及公司此前公布但已显陈旧的 2023 年突破 $100M
              ARR
              里程碑；把这些不同时间点的数据拼凑为当前的收入倍数极具误导性。因此，情景分析只能设定前置条件：乐观情景必须建立在经证实的可持续增长、强劲留存与利润率、可见的造血能力以及清晰的优先股堆叠之上；基准情景要求增长平稳、盈利路径可信，且入场估值有当期经营指标与真实同业基准背书；悲观情景则会因留存走弱、出现资金缺口、高位优先股压顶或
              IPO 窗口关闭而触发。管理层虽表达了 IPO 愿景与近期盈利意图，但也强调具体时机视市场行情而定。最终尽调必须调取审计后财报、队列留存、股权结构表与瀑布流底稿、负债条款，以及直接可比的上市公司或并购证据。
