      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Claroty 于 2026 年 1 月宣布完成由 Golub Growth 领投的 $150M Series F 轮融资，现有投资方跟投最高达 $50M。公司披露本轮估值较 2024 年 3 月融资增长
              80%，但未公开绝对数值。CTech 估计本轮投后估值约为 $3B，并报道称交易中约有 $30M 至 $40M 属于老股交易；这两项数字均须以交易底稿为准予以核实。Tracxn 数据显示公司历经 8
              轮融资累计筹集 $882M，其中包括 2021 年投后估值 $2B 的 $400M Series E
              轮，但累计融资额并不等同于当前可用现金。公开信息同样未披露清算优先权、持股比例、负债余额或完全稀释股本。因此，投资入场纪律必须建立在经核验的普通股瀑布流模型上，而非新闻头条里的估值估算。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV013
              - CV016
