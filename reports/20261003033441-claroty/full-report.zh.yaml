      - number: '6.2'
        title: 落地轨迹、企业规模与战略渠道拓展
        blocks:
          - type: paragraph
            body: >-
              Claroty 的商业落地已从早期的工业试点演变为跨国企业与财富 100 强（Fortune 100）集团的全面标准化采购。2020 年至 2023 年间，公司活跃客户数量增长超过 300%，推动年经常性收入在
              2023 年跨越 $100 million 大关。到 2026 年初完成 $150 million Series F 轮融资后，Claroty 确认已在 24 家财富 100 强企业中实现正式商用部署，高于
              2024 年初的 20%。其销售拓展得到了工业自动化原始设备制造商（OEM）巨头的有力支撑，包括 Schneider Electric、Rockwell Automation 和
              Siemens——它们既是战略投资方，也是技术集成伙伴与核心分销渠道。此外，IBM、NTT Data 和 eSentire 等托管安全服务商（MSSP）也将 Claroty
              深度整合入其日常安全运营中心（SOC）流程。然而，尽管整体客户增长数据反映出加速渗透，但 Claroty 未公开披露绝对付费客户数、客户留存队列轨迹或平均客单价（ACV），真实部署深度仍需独立尽调核实。
