  - id: FV001
    title: 建议推导逻辑
    type: flow
    summary: 该建议依序从已验证的市场需求与企业采纳，穿过融资证据，最终落脚到未解决的投资判断输入项。
    data:
      nodes:
        - id: need
          label: 市场需求
          detail: 已知网络物理漏洞支撑持久的安全需求。
        - id: adoption
          label: 企业采纳
          detail: Claroty 报告称与 24 家 Fortune 100 强企业建立合作关系。
        - id: financing
          label: 融资渠道
          detail: 2026 年 1 月由 Golub Growth 领投的 $150 million Series F 轮融资。
        - id: price
          label: 定价不确定性
          detail: 公司报告称估值增长 80%，但未披露绝对估值金额。
        - id: economics
          label: 营运数据缺口
          detail: 当前 ARR、增速、毛利率、留存率、烧钱速度及现金跑道依然无法获取。
        - id: exit
          label: 退出选择权
          detail: 管理层表达了 IPO 意向，具体时间取决于市场行情。
        - id: decision
          label: 继续研究
          detail: 在定价前，先核实经审计的指标、可比公司数据及普通股分配瀑布。
    approximationNotes: 仅为定性顺序逻辑；节点先后顺序不代表量化的转化率、概率或价值。
