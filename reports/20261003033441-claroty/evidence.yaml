evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Current 2025-2026 Annual Recurring Revenue (ARR), net revenue retention (NRR), gross margin %, and GAAP operating
      profitability numbers.
    whyItMatters: >-
      Without post-2023 revenue metrics, underwriting Claroty's $3.0B valuation and pre-IPO multiple requires relying on
      unverified estimates.
    diligencePath: Obtain confidential offering memorandum or audited financial statements during pre-IPO investor diligence.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Detailed Series F preferred share term sheet detailing liquidation preferences, dividend covenants, and secondary
      share transaction discount.
    whyItMatters: >-
      Secondary sales of $30M-$40M at an undisclosed discount may indicate common stock valuation is materially lower
      than headline preferred valuation.
    diligencePath: Review certificate of incorporation and investor rights agreements for Series F preference stack seniority.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Full list of board observer seats and non-executive directors representing early venture syndicates.
    whyItMatters: >-
      Clarifies governance control balance between founding partners, growth investors, and strategic industrial
      corporate venture arms.
    diligencePath: Verify Israeli corporate registrar filings and corporate governance charters.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: som-quantification
    missingEvidence: >-
      Audited segment revenue breakdown and contract-level pipeline data detailing Claroty's exact addressable SOM
      capture across target industrial sub-sectors.
    whyItMatters: >-
      Without audited segment disclosures, Claroty's immediate serviceable obtainable market can only be modeled through
      top-down analyst estimates rather than empirical contract volume.
    diligencePath: >-
      Review Claroty's confidential investor presentation, confidential S-1 pre-IPO filing disclosures, or underwriter
      market sizing models during pre-IPO diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-packaging
    missingEvidence: >-
      Audited enterprise price book, module-by-module discounting matrix, and average contract values (ACVs) for Claroty
      CTD and xDome across multi-site industrial deployments.
    whyItMatters: >-
      Without public list pricing, enterprise buyers and underwriting analysts cannot verify gross margin durability,
      unit pricing expansion curves, or precise competitor price differentials.
    diligencePath: >-
      Obtain redacted commercial customer proposals, distributor price schedules from Arrow/CDW, and AWS Marketplace
      private offer contracts under non-disclosure agreements.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margins, Net Revenue Retention (NRR), and Customer Acquisition Cost (CAC) payback periods across
      on-premise CTD vs cloud xDome deployments.
    whyItMatters: >-
      Without segmented gross margins and expansion dynamics, underwriting cannot verify whether operating scale will
      deliver profitable unit economics or if service delivery costs compress gross margins.
    diligencePath: >-
      Request confidential SaaS retention cohorts, hosting and sensor deployment expense breakdowns, and GTM sales
      efficiency schedules under non-disclosure agreement.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Full liquidation preference waterfall, exact cash balance post-Series F, and current net monthly burn rate.
    whyItMatters: >-
      The presence of secondary liquidation components ($30-40M) and senior preferred classes could impair common equity
      returns in downstream exit scenarios if growth slows before an IPO.
    diligencePath: >-
      Examine capitalization table, charter amendments, debt facility covenants with AB Private Credit / SVB, and
      forward 24-month pro-forma operating cash forecasts.
  - type: private-evidence-only
    severity: material
    topic: packet-saturation-resilience
    missingEvidence: >-
      Quantitative packet drop thresholds and buffer saturation benchmarks for Claroty Edge collectors during sustained
      peak industrial network bursts.
    whyItMatters: >-
      High packet loss during operational spikes could lead to transient blind spots in asset inventory and delayed
      alert generation.
    diligencePath: >-
      Request customer laboratory stress test reports and collector hardware sizing guidelines directly from Claroty
      solutions engineering.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: cps-library-coverage
    missingEvidence: >-
      Empirical catalog coverage metrics for the AI-powered CPS Library across Tier-2 and legacy automation component
      manufacturers.
    whyItMatters: >-
      Determines whether Claroty requires extensive manual parsing when deployed in heterogeneous brownfield facilities
      with non-standard PLCs.
    diligencePath: >-
      Interview OT systems integrators and review sample asset extraction fidelity reports for multi-vendor industrial
