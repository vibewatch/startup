callouts:
  - calloutType: "insight"
    title: "The Project File Advantage: Reaching What the SPAN Port Misses"
    body: "In OT cybersecurity bake-offs, passive SPAN-only proofs-of-concept conceal a critical blind spot: network sniffing cannot see assets communicating over unrouted serial links, controllers inside isolated backplanes, or devices powered off during maintenance. Claroty's AppDB engine parses engineering project and backup configuration files directly, unlocking complete asset inventories for quiet or air-gapped devices without active scanning."
    claimRefs:
      - "CP005"
      - "CP006"
  - calloutType: "risk"
    title: "Segmentation Fallacy: Visibility Tools Recommend, But Do Not Enforce"
    body: "Enterprise buyers frequently conflate OT visibility platforms with network enforcement. Claroty, Nozomi, and Dragos map Purdue zones and generate recommended micro-segmentation policies, but they do not enforce them inline. Actual policy enforcement requires separate firewall, switch, and NAC infrastructure, introducing substantial post-purchase implementation and coordination overhead."
    claimRefs:
      - "CP008"
      - "CP014"
