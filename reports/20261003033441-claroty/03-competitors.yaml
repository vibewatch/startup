chapter:
  number: 3
  title: "Competitors"
  summary: "Claroty competes in the cyber-physical systems (CPS) and operational technology (OT) security market against deep packet inspection specialists Nozomi Networks and Dragos, as well as broader asset intelligence platform Armis. Claroty differentiates through its native project-file parsing engine (AppDB) and integrated first-party secure remote access (xDome Secure Access), while facing platform expansion from Dragos into automated remediation and Armis into cross-enterprise IT/IoT/IoMT visibility."
sections:
  - id: "competitive-landscape-segmentation"
    title: "Competitive Landscape: Architectural Split, Direct Peers, and Adjacencies"
    body: "The competitive landscape in cyber-physical systems (CPS) security divides along a fundamental architectural axis: deep packet inspection (DPI) platforms versus cross-estate asset intelligence engines. Claroty, Nozomi Networks, and Dragos operate primarily as DPI-first platforms whose physical or virtual sensors sit on mirrored network traffic via SPAN or TAP ports, dissecting industrial protocols locally to construct asset inventories, establish behavioral baselines, and detect anomalous commands. In contrast, Armis Centrix positions DPI as only one telemetry stream among dozens, relying primarily on API integrations across enterprise switches, firewalls, wireless controllers, Network Access Control (NAC), Endpoint Detection and Response (EDR), and Configuration Management Databases (CMDBs). This structural difference dictates enterprise fit: Armis delivers superior out-of-the-box visibility across blended enterprise IT, IoT, and clinical medical environments (IoMT), whereas Claroty, Nozomi, and Dragos provide documented visibility and forensic parsing at Purdue Model Levels 1 and 2 (controllers, remote terminal units, and safety instrumented systems). Beyond direct peers, the market includes industrial automation incumbents such as Rockwell Automation and Schneider Electric—who act simultaneously as strategic distribution partners and equity backers—alongside legacy IT security incumbents attempting to extend network access control into operational plants."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP008"
      - "CP012"
    tableRefs:
      - "TP001"
  - id: "capability-differentiation-collection"
    title: "Telemetry Architecture, Forensic Depth, and Protocol Parsing Differentiation"
    body: "Evaluating CPS protection platforms requires analyzing how telemetry is gathered when passive network sniffing reaches its physical limits. While passive monitoring avoids operational disruption, it cannot inspect traffic contained entirely inside a programmable logic controller (PLC) backplane, unrouted serial links between field devices, or direct point-to-point engineering connections. To penetrate these blind spots, vendors deploy secondary collection mechanisms with distinct risk profiles. Claroty utilizes Safe Active Queries, sending native-protocol requests engineered to mirror standard engineering workstation communications, alongside its proprietary AppDB engine that directly parses offline PLC and SCADA project configuration files—reaching air-gapped, powered-down, or silent controllers. Nozomi Networks pairs passive collection with optional Smart Polling and host-based Nozomi Arc endpoint sensors, whereas Dragos utilizes lightweight software collectors and edge containers. In threat detection, Claroty deploys five parallel detection engines (anomaly detection, security behaviors, SNORT/YARA known threats, operational configuration changes, and custom rules). Dragos distinguishes itself through adversary-focused threat behavior analytics mapped directly to MITRE ATT&CK for ICS and backed by first-party incident response playbooks. However, Dragos has also closed the anomaly detection gap by introducing baseline learning modes, while all four vendors integrate with perimeter firewalls and switches to recommend segmentation policies rather than executing inline blocking directly."
    claimRefs:
      - "CP002"
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP016"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-commercial-packaging"
    title: "Commercial Models, Pricing Opacity, and Total Cost of Ownership"
    body: "Commercial procurement across the CPS protection category is characterized by extreme quote-based opacity, with no universal public price lists available from major vendors. Claroty licenses its platform through annual subscription or perpetual tiers scaling by protected asset volume, site count, and modular add-ons. While AWS Marketplace private listings for Claroty xDome indicate annual entry tiers starting around $100,000 for Essential packages and climbing past $1,200,000 for Advanced multi-site enterprise deployments with bundled engineering services, total cost of ownership (TCO) extends substantially beyond base software licensing. Enterprise buyers routinely incur significant auxiliary costs for professional deployment services across segmented OT enclaves, specialized hardware sensors, and complex API integrations into SIEM, SOAR, and NAC infrastructure. Furthermore, baseline tuning for OT anomaly detection introduces temporary alert noise that demands dedicated analyst bandwidth before reaching steady-state operations. A crucial commercial differentiator is first-party Secure Remote Access (SRA): Claroty provides native xDome Secure Access with credential vaulting, session recording, and asset-scoped least-privilege controls, whereas Nozomi Networks and Dragos rely on third-party remote access integrations, requiring buyers to negotiate separate software licensing."
    claimRefs:
      - "CP003"
      - "CP011"
      - "CP013"
      - "CP014"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moats-switching-costs-displacement"
    title: "Moat Durability, Platform Expansion, and Displacement Risks"
    body: "Claroty's competitive moat rests upon deep protocol parsing intellectual property, an extensive library of industrial communication protocols, and strategic distribution lock-in through global automation giants Rockwell Automation and Schneider Electric. These automation leaders not only participated as equity investors but actively bundle Claroty's Continuous Threat Detection (CTD) and xDome platforms into their managed cybersecurity service offerings. Switching costs are reinforced once an enterprise embeds Claroty's asset taxonomy into corporate ServiceNow CMDBs and establishes automated firewall segmentation rules based on Claroty Virtual Zones. Nevertheless, Claroty faces intensifying displacement and margin pressure on two fronts. First, Dragos has expanded aggressively beyond passive detection into active remediation via its Phosphorus acquisition—automating firmware updates, credential rotation, and configuration hardening—while acquiring runZero and NetRise in September 2026 to add device exposure management and firmware software bill of materials (SBOM) analysis. Second, Armis continues to capture enterprise-wide deals where CISOs prioritize broad visibility across mixed campus, healthcare, and IT networks over specialized Purdue Level 1/2 controller inspection. If industrial security spending consolidates under corporate IT budgets, Claroty risks commoditization unless it sustains clear protocol depth and expands automated remediation."
    claimRefs:
      - "CP004"
      - "CP008"
      - "CP010"
      - "CP012"
      - "CP014"
      - "CP016"
