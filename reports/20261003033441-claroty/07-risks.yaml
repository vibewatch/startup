callouts:
  - calloutType: "risk"
    title: "The Air-Gap Fallacy and Unpatchable KEV Exposures"
    body: "Operational technology teams historically relied on air-gapping to protect industrial networks, but Claroty's own research reveals that 13% of critical workstations and HMIs have active internet connections, with over a third hosting confirmed known exploited vulnerabilities. Because industrial uptime constraints prevent active patching, organizations must treat network isolation and zero trust remote access as essential compensating controls."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
  - calloutType: "recommendation"
    title: "Mandate Human-in-the-Loop Guardrails for Agentic AI"
    body: "Prospective buyers evaluating Claroty Claire or similar CPS-native AI security agents must enforce read-only validation during onboarding and reject autonomous remediation writes to industrial control networks. Critical physical environments require formal change advisory board approvals and alignment with maintenance windows before any automated reconfiguration is authorized."
    claimRefs:
      - "CR002"
