chapter:
  number: 7
  title: "Risks"
  summary: "Claroty's operational risk centers on the friction of securing legacy, unpatchable cyber-physical assets and governing privileged remote sessions without causing industrial downtime. Downside exposure is driven by partner distribution dependencies, AI agent governance boundaries in mission-critical environments, and severe non-disclosure of core operating metrics such as ARR, gross margin, and customer concentration."
sections:
  - id: "regulatory-legal-risk"
    title: "Regulatory Compliance Mandates and Federal Governance"
    body: "Claroty's market expansion is tightly coupled to federal cybersecurity mandates and critical infrastructure compliance frameworks [CR005]. As cyber-physical systems (CPS) face accelerating geopolitical threats, regulatory bodies have shifted from voluntary guidelines to strict compliance requirements including CISA emergency directives, NIST guidance, and Department of Defense Cybersecurity Maturity Model Certification (CMMC) requirements [CR002, CR005]. Claroty xDome and Continuous Threat Detection (CTD) provide configuration controls and logging necessary to comply with federal requirements such as FISMA, supported by STIG-hardened configuration management baselines [CR005, CR008]. However, achieving and sustaining compliance across public sector accounts introduces continuous audit risk and extensive verification demands [CR002, CR005]. While federal agencies report that 100% launched new CPS security initiatives in the past year, only 36% have achieved full asset visibility and over 60% face internal CPS skill shortages, leaving implementation and compliance timelines vulnerable to customer-side operational bottlenecks [CR005]. Failure of customers to establish rigorous evidence paths or verify automated compliance mappings can result in regulatory scrutiny and false compliance assurance [CR002]."
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR008"
    tableRefs:
      - "TR001"
  - id: "operational-quality-security-risk"
    title: "Operational Exposure, Vulnerability Backlog, and Agentic AI Governance"
    body: "Operational security risks in CPS environments differ fundamentally from corporate IT because disruptions can shut down factory lines, municipal water systems, or clinical healthcare workflows [CR002, CR003]. Proprietary research from Claroty's Team82 analyzing over 125,000 operational technology (OT) assets revealed that 3.7% of all OT assets are insecurely connected to the public internet, and 13% of critical engineering workstations (EWS) and human-machine interfaces (HMIs) harbor insecure direct internet connections [CR003, CR004]. More acutely, 36% of those internet-connected EWS and HMIs contain at least one confirmed Known Exploited Vulnerability (KEV), creating severe initial access and lateral movement exposure [CR003, CR004]. Because industrial controllers often cannot be patched without taking entire production facilities offline, operators must rely heavily on network segmentation and secure remote access as compensating controls [CR001, CR003]. Furthermore, Claroty's recent introduction of Claire—a CPS-native AI security agent—and the xDome Model Context Protocol (MCP) Server introduces emerging operational and software supply chain risks [CR002]. Independent diligence highlights that deploying agentic AI in mission-critical OT environments carries failure modes including unsafe remediation recommendations, tool-permission sprawl, prompt injection via imported asset notes, and degraded telemetry behavior [CR002]. OT security governance dictates that buyers must enforce read-only validation, strict change-window adherence, and mandatory human-in-the-loop approvals before allowing automated remediation actions [CR002]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-customer-dependency-risk"
    title: "Channel Concentration, Commercial Dependencies, and Diligence Gaps"
    body: "Claroty's commercial scale relies heavily on an indirect go-to-market model through channel aggregators, cloud hyperscalers, and original equipment manufacturer (OEM) alliances [CR005, CR006, CR007]. In the public sector, Claroty distributes through Carahsoft as its master government aggregator under NASPO ValuePoint contracts, creating operational and counterparty dependency on Carahsoft's federal reseller apparatus [CR005]. On the technology and product development side, Claroty partners with Rockwell Automation and Schneider Electric—both strategic investors—for initiatives like the CPS Library, as well as AWS for cloud-hosted xDome infrastructure [CR001, CR006, CR007]. Cloud-managed xDome deployments introduce third-party cloud availability risks and operational friction for highly segmented air-gapped plants [CR006]. Crucially, while Claroty disclosed reaching $100M+ in ARR in 2023 and completed a $150M Series F round in January 2026, the company keeps its current ARR, renewal rates, gross margins, cash burn, vertical revenue mix, and customer concentration metrics private [CR007, CR008]. These undisclosed metrics create significant financial underwrite uncertainty for prospective late-stage and pre-IPO investors [CR007]."
    claimRefs:
      - "CR001"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR003"
