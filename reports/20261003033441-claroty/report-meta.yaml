companyProfile:
  summary: >-
    Claroty is a private cybersecurity company focused on cyber-physical systems protection across operational
    technology, industrial control systems, healthcare IoMT, and commercial building environments. Its xDome and
    Continuous Threat Detection products serve enterprises that need passive asset discovery, exposure management,
    threat detection, and secure remote access without disrupting fragile production or clinical systems. The business
    has broad enterprise adoption and strategic OEM/channel partnerships, but it still withholds core operating metrics
    such as current ARR, gross margin, retention, and cash burn.
