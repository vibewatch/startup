    title: "Non-Disruptive Discovery Calibrated for Sensitive Operational Environments"
    body: "Claroty’s deployment of five complementary discovery methods—specifically passive deep packet inspection, safe low-impact queries, and project file parsing—allows organizations to achieve exhaustive visibility across fragile OT and IoMT networks without triggering device lockups, reboots, or patient safety incidents."
    claimRefs:
      - "CE001"
      - "CE007"
  - calloutType: "risk"
    title: "Dependency on External Enforcement Fabric for Compensating Controls"
    body: "Because Claroty operates primarily as an intelligence, visibility, and policy recommendation platform, physical network isolation of vulnerable legacy systems relies entirely on third-party network controllers, switches, firewalls, and microsegmentation partners. A breakdown in downstream API orchestration leaves identified exposures unmitigated."
    claimRefs:
      - "CE008"
      - "CE011"
      - "CE014"
