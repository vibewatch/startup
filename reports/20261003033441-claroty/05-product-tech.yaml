chapter:
  number: 5
  title: "Product & Technology"
  summary: "Claroty delivers an integrated cyber-physical systems (CPS) security platform spanning cloud-native Claroty xDome and on-premise Continuous Threat Detection (CTD), unifying discovery across five non-disruptive methods with exposure management, network segmentation, and secure access. The architecture integrates AWS Aurora and Elastic for high-throughput operational querying, while research from Team82 supplies proprietary vulnerability intelligence across critical infrastructure and healthcare environments."
sections:
  - id: "platform-portfolio-and-capabilities"
    title: "Platform Portfolio and Core Capabilities"
    body: "The Claroty Platform provides a purpose-built security solution engineered for environments where cyber-physical systems (CPS) directly govern physical processes, operational safety, and patient care. Claroty delivers its capabilities through two primary deployment paradigms: Claroty xDome, a modular SaaS platform designed for rapid cloud time-to-value, and Claroty Continuous Threat Detection (CTD), an on-premise solution delivering comprehensive network visibility and controls for air-gapped or strictly regulated industrial sites. Across both footprints, the platform integrates five foundational capability pillars: deep asset discovery and inventory, automated exposure management, network policy modeling and protection, secure interactive remote access, and real-time threat detection. In healthcare and clinical environments, Claroty xDome for Healthcare incorporates technology acquired from Medigate to secure Internet of Medical Things (IoMT) devices alongside building management systems (BMS) and operational technology (OT). Furthermore, the portfolio incorporates the CPS Library, an artificial intelligence catalog co-developed with automation leaders Schneider Electric and Rockwell Automation to standardize and track operational asset specifications with high precision."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "architecture-and-data-engine"
    title: "Operating Architecture, Integrations, and Data Engine"
    body: "Claroty’s technical backbone is structured around non-disruptive data collection, distributed stream processing, and high-performance relational storage. Because cyber-physical systems cannot tolerate intrusive active scanning that risks operational disruptions or device reboots, Claroty employs five complementary discovery mechanisms: passive network monitoring via deep packet inspection, safe low-impact queries calibrated for fragile controllers, lightweight Claroty Edge collectors, engineering project file analysis (including PLC logic files), and ecosystem enrichment pulling from existing CMMS, CMDB, and biomedical inventories. For cloud-hosted xDome environments running on Amazon Web Services, Claroty deployed Amazon Aurora PostgreSQL with Aurora Optimized Reads on NVMe SSD storage and Aurora I/O-Optimized configurations. This architectural enhancement resolved write bottlenecks and temporary storage saturation caused by multi-attribute querying across millions of asset records, reducing complex dashboard API query latency from over 30 seconds to under one second while lowering database infrastructure costs by 50%. Third-party ecosystem integrations, including Elastic Agent and Datadog Marketplace modules, ingest normalized alert, event, and vulnerability streams via REST APIs to support SOC workflows."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "differentiation-security-and-trust"
    title: "Technical Differentiation, Threat Research, and Trust Controls"
    body: "Claroty’s primary technical defensibility originates from its specialized CPS domain models and proprietary threat intelligence engine, Team82. Operating dedicated CPS testing laboratories, Team82 has discovered and responsibly disclosed over 650 vulnerabilities across industrial control systems, medical devices, and building automation protocols. Rather than relying exclusively on generic Common Vulnerability Scoring System (CVSS) metrics, Claroty calculates dynamic risk scores incorporating Known Exploited Vulnerabilities (KEVs), active ransomware campaign linkage, network exposure, and clinical or operational criticality. Because legacy medical and OT assets operate across 10-to-15-year lifecycles where direct firmware patching is unfeasible or delayed by FDA re-certification rules, Claroty generates compensating control profiles and network policy recommendations. These policies are enforced via bidirectional API integrations with microsegmentation platforms such as Elisity, Cisco Identity Services Engine (ISE), switches, and firewalls. For enterprise and government procurement trust, Claroty maintains an externally verified Trust Center documenting compliance with ISO 27001, ISO 27701, SOC 2 Type 2, GDPR, and HIPAA, alongside STIG-hardened configuration management controls supporting federal FISMA mandates."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
