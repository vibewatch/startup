chapter:
  number: 2
  title: "Market Analysis"
  summary: "Claroty operates across the cyber-physical systems (CPS) and operational technology (OT) security market, valued at $27.39 billion in 2026 and growing at roughly 16% annually amid rising nation-state attacks on critical infrastructure. Market spend is shifting from single-purpose, on-premises network monitoring appliances toward comprehensive hybrid platforms that span industrial control systems, healthcare IoT, and secure remote access."
sections:
  - id: "market-boundary-scope"
    title: "Market Boundary, Category Definitions, and Included Spend"
    body: "The addressable market for cyber-physical systems (CPS) security encompasses software, hardware appliances, and services deployed to discover, monitor, assess, and defend operational technology (OT), industrial control systems (ICS), the Internet of Medical Things (IoMT), and smart building management systems (BMS). Unlike traditional information technology (IT) security, which prioritizes data confidentiality across servers and endpoints, CPS security is governed by availability, physical safety, and operational resilience across fragile controllers, sensors, and actuators that cannot tolerate active scanning or unplanned downtime. Included addressable spend covers passive and safe-active network monitoring, continuous threat exposure management, secure remote access (SRA) for internal and third-party technicians, and specialized CPS threat intelligence. Excluded from this core boundary are standard enterprise IT endpoint protection platforms (EDR), generic cloud security posture management (CSPM), identity and access management (IAM) directory services, and broad physical facility security controls. Within this landscape, Claroty defines its addressable scope around the Extended Internet of Things (XIoT), explicitly unifying classic manufacturing shop-floor automation with clinical healthcare devices and commercial infrastructure."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM008"
    tableRefs:
      - "TM001"
  - id: "market-sizing-dynamics"
    title: "Market Sizing, TAM/SAM/SOM Breakdown, and Growth Lenses"
    body: "Independent market research from MarketsAndMarkets sizes the worldwide operational technology security market at $23.54 billion in 2025, climbing to $27.39 billion in 2026 at an annual expansion rate of roughly 16%. In parallel, long-range tracking from ABI Research pegs the broader critical infrastructure OT/ICS security market at $12.75 billion in 2023, charting an expansion trajectory toward $21.60 billion by 2028. Sizing the serviceable available market (SAM) requires segmenting spend by delivery and product type: on-premises hardware and software installations still accounted for 70.42% of category spending in 2025 according to Mordor Intelligence, while pure software solutions commanded 62.34% of total vendor revenues relative to consulting and integration services. Claroty's serviceable addressable opportunity sits squarely at the intersection of commercial platform software and enterprise hybrid deployments across high-threat verticals. Serviceable obtainable market (SOM) capture is directly constrained by incumbent automation contracts, procurement fragmentation between IT and plant engineering, and multi-vendor bake-offs against specialized peers such as Dragos and Nozomi Networks."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM012"
      - "CM013"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-segmentation-procurement"
    title: "Buyer Segmentation, Governance Friction, and Procurement Dynamics"
    body: "Purchasing authority for cyber-physical security sits at a historically tense organizational intersection between corporate Chief Information Security Officers (CISOs) and operational plant engineering managers. While enterprise CISOs and VP of Security Operations titles increasingly control the formal capital budget, Operational Technology directors and Chief Operating Officers maintain functional veto power over any tool that risks interrupting continuous production line availability. Adoption paths typically begin when a security audit, regulatory inspection, or sector-specific cyber alert prompts a proof-of-concept (POC) at a single high-profile plant, water treatment facility, or hospital campus. Enterprise procurement commonly requires vendors to demonstrate frictionless coexistence with legacy supervisory control and data acquisition (SCADA) networks without requiring hardware-heavy architecture changes. Once passive visibility is established, budget allocations expand from initial asset discovery into recurring operational licenses for vulnerability management, micro-segmentation modeling, and privileged remote session access."
    claimRefs:
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "growth-drivers-adoption-constraints"
    title: "Growth Drivers, Regulatory Mandates, and Adoption Constraints"
    body: "Category adoption is accelerating under the dual pressure of targeted nation-state cyber campaigns and escalating government regulatory mandates. In 2026, multi-agency advisories from CISA, the FBI, NSA, Department of Energy, and Environmental Protection Agency documented extensive Iranian-affiliated cyber targeting of programmable logic controllers (PLCs), remote terminal units (RTUs), and human-machine interface (HMI) displays at U.S. water and energy utilities. These operational threats coincide with stringent compliance enforcement, including NERC CIP audit standards for bulk electric power, TSA security directives for oil and gas pipelines, and the European Union's NIS2 directive covering essential operators across healthcare, water, and manufacturing. However, several friction factors temper conversion velocity: industrial operators face severe shortages of dual-skilled IT/OT personnel, legacy controller architectures often remain in active service for decades past original support windows, and many plant operators harbor deep skepticism toward cloud telemetry uplinks, sustaining high demand for hybrid and strictly on-premises architectures."
    claimRefs:
      - "CM003"
      - "CM007"
      - "CM010"
      - "CM014"
      - "CM015"
      - "CM016"
