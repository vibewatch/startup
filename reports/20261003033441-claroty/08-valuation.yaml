company:
  name: "Claroty"
chapter:
  number: 8
  title: "Valuation"
  summary: "Claroty's January 2026 Series F and reported valuation step-up show continued financing access, but the company did not publish an absolute valuation and an independent report's approximately $3 billion estimate is not a disclosed transaction mark. The appropriate stance is research-more: current ARR, margins, cash generation, cap-table terms, and comparable multiples are all needed before a price or return can be underwritten."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The investable thesis is that Claroty has both a durable demand backdrop and evidence of enterprise adoption. The company reported working with 24 Fortune 100 organizations in the January 2026 financing announcement, while Facilities Dive's account of Claroty research described widespread known vulnerabilities in building-management devices. Those facts support the need for cyber-physical-systems protection, but they do not establish Claroty's renewal economics or market share. The anti-thesis is therefore evidence-driven rather than categorical: the latest financing materials omit current ARR, growth, gross margin, net retention, burn, and runway. Claroty's Cloud 100 recognition is a positive signal, yet the supporting page is company-issued and discloses the ranking methodology rather than Claroty's underlying scores. Product relevance and customer logos should not substitute for audited operating quality."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "financing-and-entry-discipline"
    title: "Financing Context and Entry Discipline"
    body: "Claroty announced a $150 million Series F led by Golub Growth in January 2026, with up to $50 million of participation from existing investors. The company reported an 80% valuation increase from its March 2024 financing but did not disclose the absolute value. CTech estimated the resulting value at approximately $3 billion and reported that roughly $30 million to $40 million of the transaction was secondary; both figures should be verified in transaction documents. Tracxn reports $882 million raised across eight rounds, including a $400 million Series E at a $2 billion post-money valuation in 2021, but cumulative funding is not cash available today. The public record also does not disclose liquidation preferences, ownership, debt balances, or fully diluted capitalization. Entry discipline should therefore be based on a verified common-equity waterfall, not the headline financing estimate."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenarios-exit-and-diligence"
    title: "Scenarios, Exit Readiness, and Diligence"
    body: "Public evidence does not support numeric bull, base, or bear valuation ranges. The only usable anchors in the assigned evidence are Claroty's own historical financing marks, an independent approximately $3 billion estimate, and a stale company-reported 2023 ARR milestone above $100 million; combining those different dates into a current revenue multiple would be misleading. The scenario framework is therefore conditional. A bull case requires verified durable growth, strong retention and margins, cash-generation visibility, and a clean preference stack. A base case requires adequate growth and a credible profitability path at an entry price supported by current metrics and genuine peer benchmarks. A bear case is triggered by weak retention, cash needs, senior preference overhang, or a closed IPO window. Management discussed an IPO aspiration and near-term profitability, but also tied timing to market conditions. Final diligence must obtain audited financials, cohort retention, the cap table and waterfall, debt terms, and directly comparable public-company or M&A evidence."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV006"
      - "CV008"
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs: []
tables:
  - id: "TV001"
    title: "Recommendation Summary"
    columns:
      - "Dimension"
      - "Assessment"
      - "Evidence Basis"
      - "Decision Implication"
    rows:
      - - "Recommendation"
        - "Research more"
        - "Financing access and enterprise adoption are visible, but current operating economics and security terms are not."
        - "Do not price or approve an investment before audited financial and capitalization diligence."
      - - "Confidence"
        - "Medium on financing facts; low on value"
        - "The round size and reported valuation growth are corroborated, while the approximately $3 billion value is a media estimate."
        - "Treat the headline value as a diligence lead rather than a confirmed post-money valuation."
      - - "Risk rating"
        - "High underwriting risk"
        - "Current ARR, margins, retention, burn, debt balances, ownership, and preferences are not disclosed in the retained evidence."
        - "Require a downside waterfall and cash-runway bridge before assessing common-equity protection."
      - - "Valuation stance"
        - "Not underwritable from public data"
        - "The only public ARR milestone is from 2023 and cannot be paired with a 2026 estimated value as if periods matched."
        - "Set entry discipline from current metrics, verified peer multiples, and security seniority."
    notes: "Assessments distinguish announced financing, third-party estimates, historical ARR, and missing private-company terms; no target return or current revenue multiple is asserted."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV006"
      - "CV012"
      - "CV016"
  - id: "TV002"
    title: "Thesis and Anti-Thesis"
    columns:
      - "Lens"
      - "Argument"
      - "Evidence"
      - "What Would Change the View"
    rows:
      - - "Thesis: demand"
        - "Persistent cyber-physical exposure creates a durable need for protection."
        - "Facilities Dive reported Claroty research on widespread known vulnerabilities in building-management devices."
        - "The view weakens if budgets or deployments fail to convert into durable subscription revenue."
      - - "Thesis: adoption"
        - "Fortune 100 adoption suggests the platform can sell into complex enterprises."
        - "Claroty reported working with 24 Fortune 100 organizations in January 2026."
        - "The view strengthens with independently verified renewals, expansion, and customer concentration data."
      - - "Anti-thesis: economics"
        - "Recognition and financing do not establish attractive unit economics."
        - "The retained financing reports omit current ARR, growth, gross margin, net retention, burn, and runway."
        - "Audited high-quality recurring growth and a credible cash-generation path would reduce this concern."
      - - "Anti-thesis: capitalization"
        - "A large, multi-round capital base may leave common-equity outcomes sensitive to senior terms."
        - "Tracxn reports $882 million raised across eight rounds, while public sources omit the preference waterfall."
        - "A clean cap table, standard preferences, and limited debt would materially improve the downside case."
    notes: "The demand and adoption case uses company claims and independent reporting; the anti-thesis explicitly identifies operating and capitalization evidence that is unavailable publicly."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV010"
      - "CV011"
      - "CV013"
      - "CV016"
  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Required Assumptions"
      - "Valuation and Return Logic"
      - "Key Risks or Triggers"
      - "Probability Signal"
    rows:
      - - "Bull"
        - "Verified durable growth, strong retention and gross margin, cash-generation visibility, and no material senior preference overhang."
        - "Apply a current peer multiple only to audited current ARR; no public range is supportable now."
        - "Fails if quality of growth or the preference waterfall is weaker than represented."
        - "Not quantified; required inputs are private."
      - - "Base"
        - "Adequate recurring growth, credible profitability path, stable customer retention, and standard financing terms."
        - "Anchor entry to verified current metrics and directly comparable public-company or M&A evidence."
        - "Reprice if the estimated financing value is not the common-equity post-money mark."
        - "Not quantified; comparable and operating data are missing."
      - - "Bear"
        - "Growth or retention slows, cash needs persist, senior terms absorb proceeds, or public-market access remains closed."
        - "Model the common-equity waterfall under lower exit values after debt and preferences; do not infer a range from funding raised."
        - "Down-round financing, delayed exit, or preference-driven impairment."
        - "Not quantified; downside terms require the cap table."
    notes: "This is a conditional framework, not a forecast. Numeric valuation ranges, probabilities, and target returns are intentionally withheld because current operating data, peer multiples, and security terms are unavailable."
    claimRefs:
      - "CV003"
      - "CV006"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
      - "CV016"
