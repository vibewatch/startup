chapter:
  number: 6
  title: "Customers"
  summary: "Claroty protects cyber-physical systems across industrial, healthcare, commercial, and public sector environments, securing mission-critical infrastructure for hundreds of organizations across thousands of operational sites globally. Customer traction is anchored by large enterprise accounts, including 24 of the Fortune 100 and key public sector agencies, though private company status leaves renewal cohorts, net retention rates, and customer concentration undisclosed."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation by Buyer, Vertical, and Operational Environment"
    body: "Claroty segments its customer base across four primary operating environments comprising the Extended Internet of Things (XIoT): industrial automation and operational technology (OT), healthcare Internet of Medical Things (IoMT), commercial facilities, and the public sector. Purchasing decisions involve distinct buyer and payer dynamics across these verticals. In industrial manufacturing, energy, and utilities, Chief Information Security Officers (CISOs) and Vice Presidents of Security Operations act as primary budget holders, but plant managers and Operational Technology directors retain veto authority to protect continuous production availability. In healthcare systems, Chief Information Officers and biomedical engineering leads partner with IT security to safeguard connected clinical equipment and patient monitoring devices. Across commercial infrastructure, real estate and building management teams procure exposure management for environmental control systems. In the public sector and defense agencies, Claroty targets federal civilian and intelligence infrastructure through specialized partnerships and certifications. Enterprise contracts are characterized by multi-site deployments that scale with the total number of connected assets and physical facilities monitored across hybrid architectures."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU009"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-scale"
    title: "Adoption Trajectory, Enterprise Scale, and Strategic Channel Expansion"
    body: "Claroty's commercial adoption has scaled from early industrial pilot deployments into enterprise-wide standardization across Fortune 100 conglomerates and multinational asset owners. Between 2020 and 2023, the company grew its active customer count by over 300%, driving annual recurring revenue past $100 million in 2023. By early 2026, following its $150 million Series F financing, Claroty confirmed active commercial deployments with 24 of the Fortune 100 organizations, up from 20% in early 2024. Adoption velocity is significantly amplified by go-to-market alliances with major industrial automation original equipment manufacturers (OEMs), including Schneider Electric, Rockwell Automation, and Siemens, who serve simultaneously as strategic investors, technology integration partners, and distribution channels. Additionally, managed security service providers (MSSPs) including IBM, NTT Data, and eSentire incorporate Claroty into ongoing security operations center workflows. However, while aggregate customer growth metrics demonstrate accelerating enterprise penetration, Claroty does not publicly disclose absolute paying customer counts, customer cohort trajectories, or average annual contract value, requiring independent diligence on true deployment depth."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU013"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-partnerships"
    title: "Named Customer Proof, Strategic Investor Deployments, and Reference Quality"
    body: "Claroty's customer reference base is closely linked to its ecosystem of strategic corporate backers and mission-critical asset operators. Industrial leaders such as BMW Group, through its venture arm BMW i Ventures, invested in Claroty to secure connected manufacturing operations and protect automotive assembly facilities against operational disruption. Similarly, automation leaders Rockwell Automation and Schneider Electric have embedded Claroty's continuous monitoring capabilities into joint customer deployments and co-developed the Claroty CPS Library to standardize device visibility. In the public sector, Claroty expanded federal and defense presence by appointing former U.S. Air Force leadership, partnering with Carahsoft to reach state, local, and educational (SLED) agencies, and integrating with Mission IT and Parsons' SealingTech to access the U.S. Intelligence Community and defense operational networks. While these strategic deployments validate enterprise-grade production readiness and rigorous security compliance, independent verification of individual commercial account satisfaction and renewal history remains constrained by widespread non-disclosure agreements across sensitive critical infrastructure operators."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-friction"
    title: "Retention Durability, Land-and-Expand Mechanics, and Procurement Friction"
    body: "Customer expansion within Claroty accounts follows a land-and-expand trajectory that typically begins with passive network monitoring and asset discovery across a single production plant, hospital campus, or data center. Once baseline asset visibility is established, customer accounts expand into recurring software modules covering exposure management, network protection, vulnerability and risk management (VRM), and secure remote access (SRA). However, customer retention and expansion face measurable structural headwinds. First, security leaders managing cyber-physical systems programs report organizational friction stemming from unclear operational ownership between corporate IT teams and plant engineering staff, insufficient specialized skills, and the absence of standardized maturity models. Second, enterprise procurement cycles commonly extend over several quarters due to stringent testing requirements on live production networks. Third, because Claroty is privately held, key customer durability metrics such as net revenue retention (NRR), gross revenue retention (GRR), logo churn, and customer concentration among top accounts are not publicly reported, representing a critical area for prospective investor diligence."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU015"
      - "CU016"
