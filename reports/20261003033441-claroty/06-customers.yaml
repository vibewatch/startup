      - "CU015"
callouts:
  - calloutType: "strength"
    title: "Strong Enterprise Moat Driven by Fortune 100 Penetration and Automation OEM Alliances"
    body: "Claroty's commercial position is reinforced by its entrenched presence across 24 of the Fortune 100 organizations and deep go-to-market distribution partnerships with Schneider Electric, Rockwell Automation, and Siemens. Because these automation vendors design, install, and service the physical controllers that run global industrial plants, their joint commercial alignment with Claroty creates high barriers to entry for competing cybersecurity vendors."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU011"
  - calloutType: "risk"
    title: "IT/OT Organizational Friction and Lack of Public Retention Disclosures"
    body: "Enterprise sales cycles in cyber-physical security remain vulnerable to organizational friction between corporate IT security teams and operational plant engineers who fear network downtime. Furthermore, as a private venture-backed company, Claroty does not publicly disclose net revenue retention (NRR), customer cohort churn rates, or top-customer revenue concentration, leaving investors dependent on private diligence to verify long-term renewal durability."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU015"
      - "CU016"
