figures:
  - id: "FU001"
    title: "Customer Journey Map: CPS Security Adoption and Expansion"
    type: "journey-map"
    summary: "Multi-stage enterprise customer adoption lifecycle from initial risk trigger through passive asset visibility to comprehensive multi-module zero-trust expansion."
    data:
      items:
        - label: "Stage 1: Threat Trigger & Regulatory Audit"
          summary: "Critical infrastructure security alerts, ransomware incidents on physical operations, or NIS2/NERC-CIP compliance audits trigger executive demand for OT visibility."
          touchpoints:
            - "Executive CISO threat briefing"
            - "Regulatory compliance gap assessment"
            - "Third-party cyber insurance audit"
          note: "IT security initiates evaluation; plant operations demands proof of non-disruptive deployment."
        - label: "Stage 2: Passive Discovery Proof-of-Concept"
          summary: "Claroty deploys passive network monitoring across a pilot facility or hospital campus to map cyber-physical assets without active network scanning."
          touchpoints:
            - "Claroty Continuous Threat Detection (CTD) appliance installation"
            - "Claroty xDome cloud telemetry connection"
            - "Asset discovery and inventory baseline generation"
          note: "Proves non-intrusive operational safety to plant managers and clinical engineering teams."
        - label: "Stage 3: Production Rollout & Asset Baselining"
          summary: "Customer approves production contract across multiple production plants or regional healthcare facilities, utilizing the Claroty CPS Library for asset classification."
          touchpoints:
            - "Multi-site enterprise license agreement"
            - "CPS Library automated asset catalog integration"
            - "Integration with CrowdStrike, ServiceNow, and enterprise SIEM"
          note: "Establishes foundational operational visibility across hundreds of thousands of XIoT devices."
        - label: "Stage 4: Modular Platform Expansion"
          summary: "Customer expands license beyond basic visibility into vulnerability and risk management (VRM), micro-segmentation, and zero-trust Secure Remote Access (SRA)."
          touchpoints:
            - "xDome Secure Access rollout for external OEM technicians"
            - "STIG-hardened configuration compliance activation"
            - "Vulnerability prioritization and automated mitigation workflows"
          note: "Increases annual recurring revenue per account and solidifies long-term platform defensibility."
        - label: "Stage 5: Enterprise Standardization & Partner Governance"
          summary: "Enterprise standardizes Claroty as the corporate CPS security backbone managed via OEM partners like Rockwell Automation or MSSP partners like IBM."
          touchpoints:
            - "Global multi-year enterprise standardization contract"
            - "MSSP continuous monitoring and SOC escalation"
            - "Coordinated industrial zero-trust architecture enforcement"
          note: "Maximizes switching costs; top-tier retention durability across global Fortune 100 accounts."
        - label: "Stage 6: Continuous Assurance & AI Agent Integration"
          summary: "Customer deploys autonomous AI agents like Claire alongside ongoing vulnerability prioritization to maintain real-time cyber resilience across evolving physical infrastructure."
          touchpoints:
            - "Claroty Claire AI security agent deployment"
            - "Automated CPS risk reduction telemetry"
            - "Executive risk reporting and audit verification"
          note: "Sustains long-term expansion and operationalizes continuous asset defense across distributed global sites."
    approximationNotes: "Lifecycle stages model the observed enterprise purchasing journey documented across Claroty customer case studies and partner distribution workflows."
    claimRefs:
