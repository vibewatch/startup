    title: "Secondary Liquidity Component Signals Late-Stage Realization"
    body: "The inclusion of a $30M to $40M secondary transaction within the $150M Series F round provides liquidity to founders and early shareholders prior to an IPO, underscoring that late-stage underwriters must scrutinize valuation step-ups against actual balance sheet cash addition versus liquidity cashing out."
    claimRefs:
      - "CI005"
      - "CI012"
  - calloutType: "insight"
    title: "Enterprise Concentration in Fortune 100 Anchors Contract Durability"
    body: "Claroty's expansion to 24 of the Fortune 100 organizations establishes substantial enterprise account stickiness, as cyber-physical security platforms face prohibitive switching barriers once deeply integrated into industrial control systems and operational networks."
    claimRefs:
      - "CI009"
