chapter:
  number: 1
  title: "Company Overview"
  summary: "Claroty is a cyber-physical systems (CPS) protection vendor securing mission-critical operational technology (OT), industrial control systems (ICS), and healthcare Extended IoT (XIoT) environments. Founded in 2014 by Amir Zilberstein, Galina Antova, and Benny Porat via Team8, the company closed a $150 million Series F financing in January 2026 led by Golub Growth with confirmed participation up to $50 million, achieving an 80% valuation step-up to approximately $3 billion."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Founding History, and Leadership Structure"
    body: "Claroty was founded in October 2014 as the second cybersecurity startup incubated by the Team8 foundry, launched by co-founders Amir Zilberstein (initial CEO), Galina Antova (Chief Business Development Officer), and Benny Porat (Chief Technology Officer) [CO001]. The company maintains headquarters in New York City with substantial research and engineering operations in Tel Aviv-Yafo, Israel, alongside regional presences across North America, Europe, Asia-Pacific, and Latin America [CO002]. Operating leadership is headed by Chief Executive Officer Yaniv Vardi, supported by a governance board including NightDragon Founder Dave DeWalt [CO003]. Functional executive appointments include former Ford Motor Company AI Chief Gil Gur Arie as Chief Product Officer and retired U.S. Air Force Colonel Jen Sovada leading public sector growth [CO004]. Total reported global headcount spans between 700 and 809 personnel across 27 countries, reflecting sustained global expansion [CO005]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-scale"
    title: "Capitalization Trajectory, Series F Financing, and Scale Metrics"
    body: "Claroty completed a $150 million Series F financing round in January 2026 led by Golub Growth, an affiliate of Golub Capital, with additional confirmed participation from existing syndicate investors of up to $50 million [CO006]. The transaction included an estimated secondary component of $30 million to $40 million and represented an 80% increase in valuation over its March 2024 strategic growth round, reaching an estimated $3.0 billion post-money valuation [CO007]. Lifetime funding totals approximately $882 million to $890 million across equity and credit facilities, including strategic backing from automation vendors Rockwell Automation, Siemens, Schneider Electric, and BMW i Ventures [CO008]. On operating scale, Claroty surpassed $100 million in Annual Recurring Revenue (ARR) during calendar year 2023, while current ARR run-rate, gross margins, and cash burn remain non-public diligence gaps [CO009]. The enterprise customer roster exceeds 1,000 organizations globally, encompassing 24 Fortune 100 industrial, energy, and healthcare enterprises [CO010]."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "evolution-milestones"
    title: "Platform Evolution, Strategic Milestones, and Enterprise Exposure"
    body: "Claroty's operating trajectory spans ten years of cyber-physical systems protection, advancing from early industrial network visibility into an integrated XIoT platform [CO011]. A defining strategic milestone was the January 2022 acquisition of Medigate, which nearly doubled company scale and laid the architectural foundation for its flagship cloud SaaS product, Claroty xDome [CO012]. Product innovation accelerated in 2025 and 2026 with the introduction of the CPS Library, an AI-powered asset catalog developed in partnership with Schneider Electric and Rockwell Automation [CO013]. Core operational and market risks persist around secondary liquidation discounts, lack of audited current financials prior to an anticipated initial public offering, and governance dependencies across sovereign critical infrastructure procurement [CO014]."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
