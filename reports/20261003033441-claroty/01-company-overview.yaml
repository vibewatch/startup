    title: "Strategic Transition from OT Niche to Comprehensive XIoT Platform"
    body: "Claroty's growth trajectory underscores an evolution from isolated operational technology (OT) intrusion detection to a unified cyber-physical systems (CPS) posture encompassing medical IoMT and commercial IoT, catalyzed by its 2021 Medigate acquisition [CO012]."
    claimRefs:
