      - "CO012"
  - calloutType: "risk"
    title: "Capital Structure Opacity and Liquidity Underwriting Risks"
    body: "While Claroty achieved a headline $3.0 billion valuation step-up in January 2026, the absence of publicly disclosed liquidation preference seniority, secondary share transaction discounts ($30M-$40M tranche), and post-2023 ARR figures prevents conclusive underwriting of common equity value [CO007, CO014]."
