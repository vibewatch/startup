company:
  name: "Keenon Robotics"
chapter:
  number: 6
  title: "Customers"
  summary: "KEENON Robotics has achieved commercial service robotics leadership with over 100,000 cumulative unit shipments across 600+ cities in more than 60 countries, powered by a flexible Robot-as-a-Service leasing model and top market share in commercial delivery. High-profile customer deployments across global hotel chains, multi-unit catering franchises, and retail hypermarkets validate core indoor automation demand, while pending U.S. patent litigation and complete opacity surrounding net revenue retention and cohort churn present material diligence uncertainties."
sections:
  - id: "customer-segmentation-and-commercial-demand"
    title: "Customer Base Segmentation and Demand Drivers"
    body: "KEENON Robotics serves commercial enterprise and SMB clients across five distinct service verticals: catering and restaurants, hospitality and hotels, retail supermarkets, healthcare facilities, and specialized commercial venues such as automotive dealerships. Frontline commercial buyers—predominantly franchise restaurant owners, hotel general managers, and retail operations directors—face structural labor headwinds characterized by rising wage inflation, high staff turnover, and persistent peak-hour shortages. In high-density dining and lodging environments, operators evaluate robotic automation across four pragmatic hurdles rather than novelty form factors: functional role execution, operational reliability, environmental safety among crowded pedestrians, and clear return on investment. KEENON addresses capital expenditure barriers through a Robot-as-a-Service (RaaS) leasing framework, enabling SMB restaurants and hospitality operators to deploy DINERBOT and BUTLERBOT units for approximately RMB 3,000 per month on one- to two-year commitments, substituting predictable operating expenditure for unbudgeted upfront hardware purchases."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "deployment-scale-and-adoption-trajectory"
    title: "Deployment Scale and Adoption Trajectory"
    body: "With cumulative global shipments exceeding 100,000 units across more than 60 countries and 600 cities, KEENON has established an operational scale advantage over emerging embodied AI startups. Market intelligence from IDC confirms KEENON's commercial delivery leadership, attributing to the firm a 29.8% global market share in commercial delivery robotics and a dominant 40.4% share in the food delivery sub-segment. Furthermore, among Chinese catering robot exporters, KEENON captured a 44.8% share of export revenue, demonstrating international sales execution beyond its domestic base. Over a 16-year development trajectory, KEENON evolved from basic restaurant runners to integrated multi-scenario deployments combining DINERBOT food servers, BUTLERBOT room-delivery couriers, and KLEENBOT floor scrubbers under unified fleet management. At recent industry showcases including WRC 2026 and WAIC 2026, the company demonstrated its next-generation KOM 3.0 foundation model coordinating wheeled humanoid units alongside specialized service robots, illustrating an adoption roadmap aimed at expanding account utility."
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-production-outcomes"
    title: "Named Customer Proof and Operational Case Studies"
    body: "Documented customer case studies provide concrete proof of production-grade operational integration across diverse service scenarios. In South Korea, buffet chain QooQoo deployed an eight-unit fleet of DINERBOT T9 delivery robots at its Guro premium location, handling non-stop food delivery and empty tray clearing during peak dining periods, directly reducing front-of-house transit bottlenecks and staff fatigue. In international hospitality, luxury hotel chains including Hilton, Sheraton, and Shangri-La operate KEENON butler fleets; field metrics indicate a three-robot deployment can generate over RMB 300,000 in annual operational expenditure savings per site by taking over night-shift room service and amenities courier runs. In Auckland, New Zealand, the M Social luxury hotel introduced the BUTLERBOT W3 (locally named 'H.A.R.I') with automated elevator IoT integration for 24-hour contactless deliveries. In retail, European hypermarket group E.Leclerc introduced the DINERBOT T10 in Ljubljana, Slovenia, leveraging interactive displays for promotional broadcasting and mobile product sampling."
    claimRefs:
      - "CU003"
      - "CU006"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "durability-channel-dependencies-and-risks"
    title: "Customer Durability, Channel Dependencies, and Concentration Risks"
    body: "Despite extensive deployment figures, customer retention durability and expansion mechanics remain partially opaque. KEENON has not publicly disclosed cohort-based net revenue retention (NRR), gross renewal rates, or unit churn figures, leaving investors unable to verify whether 100,000 cumulative shipments reflect a permanently expanding recurring base or rapid replacement cycles in turnover-heavy restaurant environments. Crucially, KEENON relies heavily on third-party regional distributor networks, value-added resellers, and corporate channel alliances like SoftBank Robotics to drive international distribution and deliver local maintenance. This indirect go-to-market structure exposes the company to distributor concentration and margin sharing. Furthermore, overseas customer expansion faces emerging legal friction: in July 2025, Arbor Systems LLC filed a patent infringement complaint against KEENON Robotics in the Eastern District of Texas, with active service proceedings persisting into August 2026. This ongoing intellectual property dispute represents a tangible risk of customer procurement hesitation, potential exclusion orders, or royalty burdens in the strategic U.S. market."
    claimRefs:
      - "CU004"
      - "CU012"
      - "CU013"
      - "CU014"
