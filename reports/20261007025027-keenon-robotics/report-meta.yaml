  topStrengths:
    - Large deployment footprint with 100,000+ shipped robots across 60+ countries.
    - Broad product portfolio spanning delivery, hospitality, cleaning, heavy-load, and humanoid workflows.
    - Visible commercial traction and recognized leadership in indoor service robotics categories.
  topRisks:
    - Audited financial statements, gross margin, cash balance, and runway remain undisclosed.
    - Active U.S. patent infringement litigation could raise legal cost and distribution risk.
    - Revenue and valuation proxies conflict, making public market marks unreliable.
    - The five-year funding drought since 2021 leaves liquidity and follow-on financing unclear.
  unresolvedGaps:
    - Audited FY2024-FY2026 financial statements, including gross margin, EBITDA, and cash burn.
    - Current liquidity bridge, debt schedule, and runway estimate.
    - RaaS mix, renewal, churn, and retention metrics by customer cohort.
    - Verified current valuation mark from the lead investor or a new primary financing round.
    - Outcome and economic impact of the Arbor Systems patent litigation.
    - Compliance evidence for PIPL, DSL, GDPR, and HIPAA-sensitive deployments.
