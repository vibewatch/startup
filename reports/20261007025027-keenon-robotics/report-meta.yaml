companyProfile:
  summary: >-
    Keenon Robotics is a Shanghai-based commercial service robotics company founded in 2010. It sells indoor delivery,
    hospitality, cleaning, and heavy-load robots, and it is also pushing into embodied AI and humanoid form factors.
    Public evidence points to large deployment scale and broad international reach, but the company remains financially
    opaque.
