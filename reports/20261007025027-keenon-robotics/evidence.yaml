evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited statutory income statement, gross margin breakdown, EBITDA, and balance sheet cash reserves.
    whyItMatters: >-
      Essential to evaluate organic profitability, gross margins, cash burn rate, and capital runway in the absence of
      equity financing since 2021.
    diligencePath: >-
      Obtain Chinese statutory filings (SAIC/AMR credit records) or audited financial reports provided during
      confidential investor diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: executive-biographies
    missingEvidence: Official management biographies, board composition, and formal key-person governance charters.
    whyItMatters: >-
      Necessary to assess executive retention, functional leadership coverage, and key-person risk surrounding core
      technical leadership.
    diligencePath: Request company corporate governance package, executive bios, and board minutes via diligence dataroom.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-cap-table
    missingEvidence: >-
      Complete cap table, exact equity shareholding breakdown, liquidation preferences, and SoftBank Vision Fund 2 side
      letters.
    whyItMatters: >-
      Essential to quantify minority investor protections, control rights, and potential liquidation waterfall
      overhangs.
    diligencePath: Inspect company cap table register and investor agreements in virtual dataroom.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: contract-renewals-and-churn
    missingEvidence: >-
      Audited client retention, annual churn rates, and contract renewal percentages for commercial dining and
      hospitality deployments.
    whyItMatters: >-
      Without retention and net revenue retention figures, recurring software and maintenance revenue quality cannot be
      differentiated from one-off hardware sales.
    diligencePath: Request customer cohort retention schedules and fleet utilization logs under NDA from KEENON management.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: tam-segmentation-transparency
    missingEvidence: >-
      Independent bottom-up TAM modeling isolating service robotics software and maintenance subscription ARR from gross
      hardware sales.
    whyItMatters: >-
      Public market estimates conflate capital hardware purchases with recurring automation service contracts, obscuring
      margin durability.
    diligencePath: >-
      Obtain detailed customer contract breakdowns showing initial hardware pricing versus ongoing SaaS and maintenance
      fees.
  - type: access-blocked
    severity: minor
    topic: litigation-exposure-scale
    missingEvidence: >-
      Unredacted damages demand and potential licensing royalty exposure in the Eastern District of Texas patent
      infringement suit.
    whyItMatters: >-
      Damages claims or potential preliminary injunction threats could restrict product distribution and partner
      recruitment in the U.S. market.
    diligencePath: Monitor docket filings in case 2:25-cv-00678 for plaintiff damages disclosures and claim construction rulings.
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level renewal, multi-homing, fleet migration, integration, and decommissioning evidence across Keenon and
      direct peers.
    whyItMatters: >-
      Without customer behavior and migration costs, product breadth cannot be translated into durable retention or
      pricing power.
    diligencePath: >-
      Interview reference customers using mixed fleets and obtain renewal cohorts, integration maps, migration
      timelines, and decommissioning costs.
    relatedQuestionRefs:
      - QP006
  - type: enumeration-incomplete
    severity: material
    topic: status-quo-substitutes
    missingEvidence: Comparable economics for manual service, conventional carts, internal development, and likely adjacent entrants.
    whyItMatters: >-
      A vendor-only peer set can overstate the addressable competitive advantage and omit the buyer's lowest-cost
      alternatives.
    diligencePath: >-
      Build a buyer-level total-cost model from labor, equipment, integration, maintenance, utilization, and support
      data for each alternative class.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Current transaction-level prices, RaaS terms, discounts, maintenance, and support packages for Keenon and direct
      peers.
    whyItMatters: List-price headlines cannot establish realized pricing, buyer ROI, or gross margin implications.
    diligencePath: >-
      Obtain dated distributor quotes and executed customer contracts normalized by model, geography, service level, and
      term.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: patent-litigation
    missingEvidence: >-
      Patent-by-patent claim analysis, responsive pleadings, asserted-product mapping, damages theories, and counsel's
      probability-weighted exposure estimate.
    whyItMatters: Docket existence establishes procedural risk but not infringement, damages, or likely product restrictions.
    diligencePath: >-
      Have U.S. patent counsel review the complaint, asserted patents, service status, responsive filings, and product
      mapping before investment approval.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: >-
      Current list prices, realized net prices, discounts, contract terms, and revenue recognition by SKU, service,
      geography, and channel.
    whyItMatters: >-
      Without pricing and contract evidence, revenue quality, concentration, discounting, and recurring mix cannot be
      underwritten.
    diligencePath: Request current price books, a representative contract sample, invoice extracts, and a list-to-net revenue bridge.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Audited statements, unrestricted cash, monthly burn, debt, working-capital schedules, capex, and a board-approved
      runway plan.
    whyItMatters: Historical funding raised cannot establish current liquidity, solvency, financing need, or dilution risk.
    diligencePath: >-
      Obtain audited financials and management accounts, then reconcile cash from the 2021 financing through the run
      date.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      Primary-source reconciliation of the $139 million 2025 estimate and $797.1 million unspecified-period profile
      value.
    whyItMatters: The unresolved difference prevents a defensible revenue baseline or valuation multiple.
    diligencePath: Request audited entity-level revenue by period, currency, business line, and accounting standard.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public SDK, API specification, package registry, open repository, technical forum, or independent practitioner
      benchmark for Keenon's software and integrations.
    whyItMatters: >-
      The retained practitioner signal comes from an integration partner, so extensibility, release cadence, and
      third-party implementation burden cannot be independently tested.
    diligencePath: >-
      Request SDK and API documentation, release history, integration references, and a supervised technical workshop
      with an unaffiliated system integrator.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: reliability-and-security
    missingEvidence: >-
      Fleet uptime, mean time between failures, intervention rates, incident history, penetration-test scope, safety
      certificates, and GDPR certification records.
    whyItMatters: >-
      Vendor specifications and partner statements describe controls and service commitments but do not establish
      production reliability, cybersecurity effectiveness, or certification coverage.
    diligencePath: >-
      Review field telemetry, support tickets, security audits, certificate identifiers, incident logs, and customer
      acceptance tests under NDA.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: material
    topic: patent-litigation
    missingEvidence: >-
      The complaint exhibits, asserted patent claims, Keenon's response, and any subsequent merits or settlement
      disposition.
    whyItMatters: >-
      A docketed complaint establishes an allegation but cannot establish infringement, likely exposure, product scope,
      or financial liability.
    diligencePath: >-
      Obtain the complaint and exhibits from the court record, map asserted claims to product components, and request
      counsel's current case assessment.
