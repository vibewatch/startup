  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer adoption lifecycle for KEENON Robotics from initial RaaS trial to multi-robot cross-scenario
      fleet deployment.
    data:
      items:
        - label: 1. Pain Point Identification
          stage: Initial Pain Point Identification
          actor: Enterprise Restaurant & Hotel Operations
          touchpoints:
            - Peak-hour labor shortages
            - Rising service wage costs
            - High employee turnover
          description: >-
            Operators experience severe frontline staffing constraints in repetitive food delivery and room transport
            tasks.
        - label: 2. Low-Capex RaaS Pilot
          stage: Low-Capex RaaS Pilot Evaluation
          actor: Store Manager & Procurement
          touchpoints:
            - Monthly RaaS leasing inquiry (~RMB 3,000/mo)
            - On-site navigation mapping survey
            - 1-2 unit trial deployment
          description: >-
            Customers evaluate functional suitability, obstacle avoidance safety, and payback timeline under low upfront
            risk.
        - label: 3. Workflow Integration
          stage: Production Workflow Integration
          actor: Frontline Staff & IT Operations
          touchpoints:
            - Staff interaction training
            - Elevator IoT integration (E-Box)
            - Automated dispatch configuration
          description: Robots transition into routine daily shifts handling peak meal distribution and contactless guest delivery.
        - label: 4. Fleet Densification
          stage: Fleet Densification & Multi-Robot Collaboration
          actor: Regional Operations Director
          touchpoints:
            - Fleet scaling to 3-8 units per location
            - Multi-robot dispatch optimization
            - Annual OPEX savings tracking (~300,000 RMB)
          description: Proven store-level ROI prompts dense fleet deployment across single high-volume properties.
        - label: 5. Multi-Scenario Expansion
          stage: Cross-Scenario Vertical Expansion
          actor: Corporate Enterprise Account
          touchpoints:
            - Introducing KLEENBOT commercial cleaning
            - Deploying DINERBOT T10 advertising screens
            - S100 back-of-house logistics
          description: >-
            Enterprise accounts expand from single-use catering delivery to combined cleaning, marketing, and heavy
            courier workflows.
        - label: 6. Embodied AI Frontier Pilot
          stage: Embodied AI & Humanoid Frontier Pilot
          actor: Innovation Lead & Executive Sponsor
          touchpoints:
