            title: Capitalization Horizon and Funding Drought
            body: >-
              Although Keenon Robotics commands industry-leading shipment scale and significant market share in catering
              service robots, the company has operated without announced primary equity funding since its September 2021
              Series D round. Given the capital intensity of global hardware deployment, the absence of fresh capital
              disclosures raises questions regarding operational cash runway and organic profitability [CO007] [CO011].
