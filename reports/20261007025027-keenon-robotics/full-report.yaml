      - number: '1.2'
        title: Capitalization History, Ownership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics reached an implied $1B unicorn valuation during its $200M Series D financing round in
              2021, which featured primary backing from SoftBank Vision Fund 2 alongside a global strategic distribution
              and commercial partnership with SoftBank Robotics [CO007] [CO008]. Independent third-party aggregators
              capture total lifetime venture funding between $200M and $244M across financing rounds, while older
              private equity registry baselines recorded historic equity tranches of $28.4M earlier in the corporate
              lifecycle [CO009]. SoftBank founder Masayoshi Son publicly endorsed Keenon's robotic platforms for
              worldwide commercial expansion [CO008]. However, formal executive roster disclosures remain incomplete in
              public aggregators, creating significant governance and key-person information deficits [CO010].
              Furthermore, external corporate databases track active enterprise monitoring but report zero published
              balance sheet, cash flow, or income statement filings, underscoring total financial reporting opacity
              [CO011].
