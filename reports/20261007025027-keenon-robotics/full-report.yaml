      - number: '1.3'
        title: Market Traction, Scale Estimates, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Industry analysts from IDC ranked Keenon Robotics as the top provider in China's commercial catering
              service robotics market with a 60.4% market share in 2022, alongside capturing 44.8% of export revenue
              share among Chinese catering delivery robot manufacturers in 2023 [CO012]. Independent market aggregators
              estimated 2025 annual revenue at approximately $139M ARR with an estimated headcount of 1,000 employees as
              of late 2025 and 2026, though audited financial statements verifying top-line revenue, gross margins, and
              operating cash burn remain entirely undisclosed [CO013] [CO014]. Operating in international markets has
              simultaneously introduced material legal and IP friction. On July 2, 2025, non-practicing entity Arbor
              Systems LLC initiated federal patent infringement litigation against Keenon Robotics Co., Ltd. in the U.S.
              District Court for the Eastern District of Texas (Case No. 2:25-cv-00678) alleging infringement of U.S.
              Patent No. 10,309,438 ('Smart IoT toy') [CO015]. Magistrate Judge Roy S. Payne issued an order regarding
              formal service on August 8, 2026, followed by Arbor Systems LLC filing supplemental proof of service on
              August 21, 2026, confirming active adversarial legal proceedings in the United States [CO016].
