chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Commercial Scope
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics Co., Ltd. was established in 2010 and is headquartered in Shanghai, China, maintaining
              principal offices at 11th Floor, No. 56, No. 1000 Jinhai Road, Pudong New Area, Shanghai [CO001] [CO002].
              Operating as an embodied AI service robotics provider, Keenon has shipped over 100,000 units globally and
              deployed robotic fleets across more than 60 countries and 15 distinct scenario categories, including
              catering, hospitality, healthcare, and retail [CO003]. The company operates international hubs across key
              jurisdictions including the United States, the Netherlands, Japan, South Korea, and Hong Kong S.A.R.
              [CO004]. Its commercial model spans indoor autonomous delivery robots (DINERBOT and BUTLERBOT series),
              industrial cleaning platforms (KLEENBOT series), heavy-load logistics couriers (KEENON S100), and
              next-generation embodied AI prototypes including the XMAN-R1 humanoid robot [CO005]. Despite widespread
              commercial distribution, detailed corporate disclosures remain tightly restricted, with statutory
              capitalization and revenue metrics largely opaque to external investors [CO006].
