              - CP004
              - CP005
              - CP010
      - number: '3.2'
        title: Capability, scale, and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              A third-party brand profile reports that Keenon has about 40% of the global food delivery robot market,
              more than 100,000 deployed service robots, and presence in more than 70 countries. The same profile
              describes a portfolio spanning DinerBot restaurant delivery and Kleenbot cleaning products. These figures
              indicate a possible scale and breadth advantage, but they are not corroborated here by a filing, customer
              census, or independent market-share study. GetLatka separately reports $139 million of revenue and a $1
              billion valuation, without a measurement period or disclosed methodology; neither figure is treated as
              ARR, current valuation, or verified financial performance. The fetched commercial comparison pages do not
              provide enough usable model-level pricing or contract detail to compare total cost of ownership.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: Distribution, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Product breadth may help Keenon sell multiple robot types into a shared account, but the assigned evidence
              does not establish that breadth creates durable lock-in. No retained source supplies reseller margins,
              channel exclusivity, support-level agreements, integration depth, fleet-management migration costs,
              renewal rates, or evidence that customers cannot multi-home across vendors. The comparison sources
              therefore support a category map, not a performance benchmark or moat conclusion. Keenon's reported 2026
              expansion into a humanoid and an autonomous lawn mower could widen its addressable workflows, but it could
              also increase execution complexity. Underwriting should treat installed-base scale and portfolio breadth
              as hypotheses to test against customer references and contract data rather than as demonstrated pricing
              power.
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Adverse evidence and investment implications
        blocks:
          - type: paragraph
            body: >-
              U.S. docket sources record a patent-infringement complaint filed against Keenon in the Eastern District of
              Texas on July 2, 2025, followed by service-related activity in August 2026. A complaint is an allegation,
              not a finding of infringement, and the assigned evidence does not establish merits, damages exposure,
              settlement probability, or product-specific impact. Even so, the live proceeding is relevant to
              competitive durability because intellectual-property disputes can affect product roadmaps, distribution
              confidence, and legal cost. The investment view is therefore conditional: Keenon appears broader and
              possibly larger than several named restaurant peers, but evidence quality is insufficient to conclude that
              the company has a durable cost, technology, channel, or switching-cost moat.
            claimRefs:
              - CP002
              - CP006
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat breadth as a diligence hypothesis, not a proven moat
            body: >-
              Prioritize comparable customer references, current transaction-level pricing, fleet migration evidence,
              channel economics, and counsel review of the patent matter before underwriting durable differentiation.
            calloutType: recommendation
            claimRefs:
              - CP006
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue evidence is directionally useful, not underwritable
        blocks:
          - type: paragraph
            body: >-
              The clearest public description of Keenon's monetization is a third-party business-model page that calls
              direct robot sales the primary stream and also lists RaaS subscriptions, cloud fleet-management licensing,
              maintenance, spare parts, customization, and enterprise deals. This supports a hybrid
              hardware-and-services model, but not the contribution, contract duration, renewal rate, or gross margin of
              any stream. Company-issued material reports more than 100,000 units shipped across more than 60 countries,
              which indicates manufacturing and distribution reach but is a cumulative shipment measure rather than
              current-period revenue, installed active fleet, utilization, or recurring revenue. Public top-line figures
              are not reconcilable: GetLatka labels $139 million as estimated 2025 annual revenue, while two AskCyborg
              pages display $797.1 million without a stated fiscal period or audited reconciliation. Neither figure
              should be treated as ARR, and the difference is too large to use either as a valuation anchor without
              source documentation.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI008
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
      - number: '4.2'
        title: Channel breadth expands reach while obscuring economics
        blocks:
          - type: paragraph
            body: >-
              The available business-model evidence describes both direct enterprise sales and an international
              distributor network, while Keenon's presentation claims engineers in more than 12 regions, rapid support
              response, and warranties of up to 48 months. Those operating commitments imply meaningful deployment and
              after-sales work, but the evidence does not show who bears installation, warranty, inventory, receivables,
              or field-service costs under distributor contracts. The same third-party model identifies manufacturing,
              research and development, cloud infrastructure, regulatory compliance, sales, and support as cost
              categories. That is a credible cost map, not a quantified cost structure. No public CAC, sales-cycle,
              payback, channel take-rate, bill-of-materials cost, warranty reserve, working-capital cycle, or capex
              schedule appears in the assigned evidence. Consequently, apparent global scale cannot be translated into
              sales efficiency or contribution margin, and list versus realized pricing remains an explicit diligence
              gap rather than an estimate.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI006
              - CI008
              - CI015
      - number: '4.3'
        title: Historical funding does not establish current liquidity
        blocks:
          - type: paragraph
            body: >-
              GetLatka reports $200 million raised in a 2021 Series D and a $1 billion valuation, while a separate
              private- company registry places its latest valuation at $1 billion in December 2021. These are historical
              financing markers, not evidence of cash available on October 7, 2026. The assigned sources provide no
              audited balance sheet, cash-flow statement, debt schedule, monthly burn, runway, receivables aging,
              inventory position, restricted cash, or next-round trigger. AInvest explicitly notes that the private
              company does not publish a full profit-and-loss statement and frames the business as still exposed to a
              low-margin hardware trap. Funding raised must therefore remain separate from cash on hand and accounting
              profitability. A current capital- adequacy view requires a bridge from the last financing through
              operating cash use, capex, working capital, debt, and any undisclosed subsequent financing; none can be
              derived responsibly from the public pool.
            claimRefs:
              - CI007
              - CI010
              - CI011
              - CI012
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: 'Financial verdict: evidence supports commercial activity, not a margin thesis'
        blocks:
          - type: paragraph
            body: >-
              The investable interpretation is narrower than the commercial narrative. Keenon appears to have several
              potential revenue levers and substantial cumulative shipment reach, but public evidence does not establish
              revenue quality, recurring mix, retention, pricing power, gross margin, or free-cash-flow conversion. The
              divergence between the $139 million estimate and $797.1 million profile figure is itself a warning about
              private-company data quality. Legal records add a contingent-cost diligence item: Arbor Systems filed a
              patent infringement complaint in July 2025, and docket mirrors show service-related activity in August
              2026, but the assigned evidence provides no damages estimate or outcome. The underwriting posture is
              therefore information-constrained: require audited statements, revenue recognition and cohort schedules,
              channel contracts, unit-level contribution economics, and a current liquidity plan before assigning a
              revenue multiple or concluding that recurring software and service income can offset hardware, support,
              and working-capital intensity.
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite to either public revenue figure
            body: >-
              The $139 million value is explicitly an estimate, while the $797.1 million profile value has no stated
              period or audited reconciliation in the fetched text. Neither is ARR, and neither supports a revenue
              multiple without primary financial records.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI009
          - type: callout
            title: Make liquidity and margin evidence a diligence condition
            body: >-
              Require audited statements, revenue-stream mix, SKU and channel gross margins, working-capital schedules,
              debt obligations, and a current cash-to-runway bridge before reaching a valuation or capital-adequacy
              conclusion.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI012
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio Organized Around Commercial Workflows
        blocks:
          - type: paragraph
            body: >-
              Keenon's public portfolio is organized around repetitive indoor work rather than a single general-purpose
              platform. Company material maps DINERBOT and BUTLERBOT units to restaurant and hotel delivery, KLEENBOT
              units to commercial cleaning, and S-series units to material transport; reseller material also lists XMAN
              humanoids and the KEENMOW mower. The clearest directly specified asset in the assigned evidence is the
              S300: Keenon claims a 300 kg payload, a lifting platform, and support for loop, direct, multi-point, and
              transport modes. The breadth creates cross-sell potential, but buyers still need model-level field
              reliability, realized labor savings, and lifecycle-cost data before treating portfolio breadth as proven
              operating leverage.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
