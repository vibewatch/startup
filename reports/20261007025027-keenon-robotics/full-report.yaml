              - CE010
              - CE012
              - CE013
      - number: '5.3'
        title: Deployment, Integration, and Support Maturity
        blocks:
          - type: paragraph
            body: >-
              Deployment evidence is partner-led and should be read as early commercialization proof rather than a
              completed rollout. YY Group reported that select-client pilots had begun in Singapore and Malaysia, with
              its technicians responsible for integration and with both on-demand and capital-ownership models
              contemplated. Keenon separately claims that S300 setup can be reduced from a traditional
              three-to-six-month process to one day without magnetic tape or QR-code changes. The company brochure also
              advertises 30-minute online response, four-hour solutions, and warranties of up to 48 months. Those are
              useful service commitments, but the evidence does not provide uptime, mean time between failures,
              first-time-fix rates, or pilot-to-production conversion.
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation, Trust Controls, and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              Keenon's differentiation thesis is a full workflow stack: specialized hardware, local autonomy, venue
              integration, fleet management, and local channel support. GreatRobot, an explicitly identified technology
              partner, describes cloud fleet and task management plus onboarding and customization, providing a
              practitioner-channel signal but not an independent benchmark. Trust evidence is similarly
              issuer-dependent: Keenon's brochure says Keenon Cloud earned GDPR certification in 2023, while GreatRobot
              says the products it offers comply with EU safety standards. Neither source supplies certificates or audit
              scope. Separately, court records show that Arbor Systems filed a patent-infringement complaint in July
              2025; the filing is an allegation, not a finding, and the retained docket evidence does not resolve merits
              or outcome.
            claimRefs:
              - CE009
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The product is a workflow system, not only a mobile chassis
            body: >-
              The retained evidence describes value across task configuration, local autonomy, fleet software, partner
              integration, and support. That system scope can create deployment know-how, but public sources do not
              quantify switching costs or software economics.
            calloutType: insight
            claimRefs:
              - CE006
              - CE010
              - CE012
              - CE013
          - type: callout
            title: Trust evidence remains issuer-controlled
            body: >-
              GDPR and EU safety statements are company or partner claims without certificates or audit scopes in the
              assigned pool. The patent complaint is independently documented, but it is an allegation and does not
              establish infringement or liability.
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics serves commercial enterprise and SMB clients across five distinct service verticals:
              catering and restaurants, hospitality and hotels, retail supermarkets, healthcare facilities, and
              specialized commercial venues such as automotive dealerships. Frontline commercial buyers—predominantly
              franchise restaurant owners, hotel general managers, and retail operations directors—face structural labor
              headwinds characterized by rising wage inflation, high staff turnover, and persistent peak-hour shortages.
              In high-density dining and lodging environments, operators evaluate robotic automation across four
              pragmatic hurdles rather than novelty form factors: functional role execution, operational reliability,
              environmental safety among crowded pedestrians, and clear return on investment. KEENON addresses capital
              expenditure barriers through a Robot-as-a-Service (RaaS) leasing framework, enabling SMB restaurants and
              hospitality operators to deploy DINERBOT and BUTLERBOT units for approximately RMB 3,000 per month on one-
              to two-year commitments, substituting predictable operating expenditure for unbudgeted upfront hardware
              purchases.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Deployment Scale and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              With cumulative global shipments exceeding 100,000 units across more than 60 countries and 600 cities,
              KEENON has established an operational scale advantage over emerging embodied AI startups. Market
              intelligence from IDC confirms KEENON's commercial delivery leadership, attributing to the firm a 29.8%
              global market share in commercial delivery robotics and a dominant 40.4% share in the food delivery
              sub-segment. Furthermore, among Chinese catering robot exporters, KEENON captured a 44.8% share of export
              revenue, demonstrating international sales execution beyond its domestic base. Over a 16-year development
              trajectory, KEENON evolved from basic restaurant runners to integrated multi-scenario deployments
              combining DINERBOT food servers, BUTLERBOT room-delivery couriers, and KLEENBOT floor scrubbers under
              unified fleet management. At recent industry showcases including WRC 2026 and WAIC 2026, the company
              demonstrated its next-generation KOM 3.0 foundation model coordinating wheeled humanoid units alongside
              specialized service robots, illustrating an adoption roadmap aimed at expanding account utility.
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU011
      - number: '6.3'
        title: Named Customer Proof and Operational Case Studies
        blocks:
          - type: paragraph
            body: >-
              Documented customer case studies provide concrete proof of production-grade operational integration across
              diverse service scenarios. In South Korea, buffet chain QooQoo deployed an eight-unit fleet of DINERBOT T9
              delivery robots at its Guro premium location, handling non-stop food delivery and empty tray clearing
              during peak dining periods, directly reducing front-of-house transit bottlenecks and staff fatigue. In
              international hospitality, luxury hotel chains including Hilton, Sheraton, and Shangri-La operate KEENON
              butler fleets; field metrics indicate a three-robot deployment can generate over RMB 300,000 in annual
              operational expenditure savings per site by taking over night-shift room service and amenities courier
              runs. In Auckland, New Zealand, the M Social luxury hotel introduced the BUTLERBOT W3 (locally named
              'H.A.R.I') with automated elevator IoT integration for 24-hour contactless deliveries. In retail, European
              hypermarket group E.Leclerc introduced the DINERBOT T10 in Ljubljana, Slovenia, leveraging interactive
              displays for promotional broadcasting and mobile product sampling.
            claimRefs:
              - CU003
              - CU006
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU006
              - CU009
              - CU010
      - number: '6.4'
        title: Customer Durability, Channel Dependencies, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite extensive deployment figures, customer retention durability and expansion mechanics remain
              partially opaque. KEENON has not publicly disclosed cohort-based net revenue retention (NRR), gross
              renewal rates, or unit churn figures, leaving investors unable to verify whether 100,000 cumulative
              shipments reflect a permanently expanding recurring base or rapid replacement cycles in turnover-heavy
              restaurant environments. Crucially, KEENON relies heavily on third-party regional distributor networks,
              value-added resellers, and corporate channel alliances like SoftBank Robotics to drive international
              distribution and deliver local maintenance. This indirect go-to-market structure exposes the company to
              distributor concentration and margin sharing. Furthermore, overseas customer expansion faces emerging
              legal friction: in July 2025, Arbor Systems LLC filed a patent infringement complaint against KEENON
              Robotics in the Eastern District of Texas, with active service proceedings persisting into August 2026.
              This ongoing intellectual property dispute represents a tangible risk of customer procurement hesitation,
              potential exclusion orders, or royalty burdens in the strategic U.S. market.
            claimRefs:
              - CU004
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: First-Mover Fleet Scale and Distribution Footprint
            body: >-
              With more than 100,000 units shipped across 600+ cities in 60+ countries and a 29.8% global commercial
              delivery share, KEENON possesses unmatched operational field data and channel infrastructure that newer
              embodied AI competitors cannot quickly duplicate.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
          - type: callout
            title: Retention Opacity and Overseas Patent Vulnerability
            body: >-
              The complete absence of audited retention or churn metrics combined with active U.S. patent infringement
              litigation (Arbor Systems v. KEENON Robotics) creates substantial uncertainty regarding the durability of
              international RaaS cash flows and potential customer procurement friction.
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Intellectual Property Exposure in Western Jurisdictions
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics operates under active legal scrutiny in the United States, evidenced by federal patent
              litigation initiated in the Eastern District of Texas (Arbor Systems LLC v. KEENON Robotics Co., Ltd.,
              Case No. 2:25-cv-00678). Filed in July 2025 before Chief District Judge Rodney Gilstrap and Magistrate
              Judge Roy S. Payne, the lawsuit alleges direct and induced infringement of US Patent No. 10,309,438
              ('Smart IoT toy'). Active docket entries demonstrate ongoing judicial enforcement, including court orders
              regarding formal service in August 2026. This action highlights substantive exposure for KEENON's US
              operations and commercial hardware portfolio—spanning Dinerbot, Butlerbot, and Kleenbot product lines—to
              prospective infringement damages, preliminary injunctions, or port-of-entry exclusion orders under Section
              337. Furthermore, operating as a Chinese robotics vendor deploying sensor-laden platforms with LiDAR,
              stereo cameras, and IoT telemetry across North American and European facilities creates severe regulatory
              headwinds. As municipal, state, and federal bodies escalate restrictions on foreign connected devices,
              absence of audited compliance frameworks like PIPL, DSL, GDPR, or HIPAA represents a material barrier to
              hospital and government facility procurement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Operational Reliability, Supply Chain Dependencies, and Hardware Traps
        blocks:
          - type: paragraph
            body: >-
              From an operational perspective, KEENON is structurally vulnerable to supply chain disruptions and
              component dependencies that threaten its commercial scalability. The company's advanced robotic units,
              particularly the XMAN-L1 bipedal humanoid featuring 100 TOPS edge computing and 132 N·m peak knee torque,
              rely heavily on advanced AI silicon accelerators and specialized actuation motors. If advanced compute
              chips face tightening US export controls or trade sanctions, KEENON's hardware roadmap could suffer severe
              production delays or forced architectural redesigns. In parallel, independent industry diligence
              underscores that commercial service robotics vendors operate under perpetual hardware margin compression.
              Without proprietary foundational AI models or exclusive navigation algorithms, hardware components such as
              LiDAR, depth sensors, and chassis mechanics face rapid commoditisation from low-cost domestic competitors.
              Moving into complex humanoid platforms also introduces high operational warranty risk and unproven field
              reliability compared to mature indoor delivery platforms.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Distribution Counterparty Dependencies, Dilution Overhang, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              KEENON's global market penetration relies predominantly on regional third-party distributors and
              non-exclusive commercial alliances, such as AIBotics and Cannibble Food-Tech in Israel and SGP Purchasing
              Partner Network alongside E-Pro Bot in Canada. While enabling asset-light market entry, this indirect
              model dilutes gross margins, separates KEENON from direct enterprise customer relationships, and exposes
              service continuity to distributor insolvency or operational failure. Moreover, KEENON has recorded no
              publicly announced equity financing rounds since its $200M Series D led by SoftBank Vision Fund 2 in
              September 2021. With estimated annual revenues around $139M and an unconfirmed workforce exceeding 1,000
              employees across 60 to 70 countries, cash burn and capital adequacy remain completely unverified due to
              total absence of audited public financial disclosures. Defensible diligence kill criteria require
              continuous monitoring of US patent trial outcomes, potential distributor payment defaults, export control
              designations, and capital exhaustion signals before underwriting further expansion.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pending US Patent Infringement Litigation in Eastern District of Texas
            body: >-
              The active lawsuit filed by Arbor Systems LLC against KEENON Robotics Co., Ltd. in the Eastern District of
              Texas (Case 2:25-cv-00678) poses significant financial and operational jeopardy. Alleging infringement of
              US Patent No. 10,309,438 ('Smart IoT toy'), the complaint targets KEENON's core commercial products. If
              plaintiff secures an injunction or substantial damage award, KEENON's expansion in the US market could be
              severely restricted.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Prolonged Funding Hiatus and Financial Disclosure Black Hole
            body: >-
              KEENON has announced no equity funding since its $200M Series D round led by SoftBank Vision Fund 2 in
              September 2021. With estimated annual revenues of $139M and an operating presence spanning over 60
              countries and 1,000 employees, the company has operated without audited financial disclosure or verified
              capital adequacy metrics for five years, representing a material due diligence barrier for late-stage
              investors.
            calloutType: insight
            claimRefs:
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Capitalization Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Keenon Robotics Co., Ltd. as an investment candidate requires balancing its undeniable hardware
              deployment scale against acute corporate opacity and capital-structure stagnation. Keenon entered the
              global robotics spotlight in 2021 upon securing a $200 million Series D financing round led by SoftBank
              Vision Fund 2 alongside a global distribution alliance with SoftBank Robotics, establishing an implied
              post-money valuation of $1.0 billion [CV001] [CV002]. Operating from its corporate headquarters in
              Shanghai, Keenon has expanded its commercial footprint across more than 60 countries, deploying multi-form
              robotic platforms across catering (DINERBOT), hospitality room delivery (BUTLERBOT), industrial cleaning
              (KLEENBOT), and heavy logistics (S100), cumulative shipments surpassing 100,000 units globally [CV003]
              [CV004] [CV005]. Furthermore, Keenon has sought to leapfrog traditional rule-based robotics by launching
              its proprietary embodied AI model KOM 2.0 (KEENON Operator Model 2.0)—a vision-language-action (VLA)
              architecture integrating the K-Mind thinking system and K-Act motion system with K-Infinity contextual
              learning—alongside humanoid prototypes such as the XMAN-R1 and XMAN-L1 [CV006] [CV007].


              Despite these commercial and architectural milestones, the investment anti-thesis is defined by severe
              information asymmetries and structural valuation overhangs. Keenon has executed no publicly recorded
              primary equity financing rounds since its September 2021 Series D, resulting in a five-year funding hiatus
              during which global macroeconomic liquidity contracted and venture growth multiples compressed drastically
              [CV001] [CV008]. External technology tracking databases like GetLatka estimate Keenon's 2025 annual
              revenue at approximately $139 million ARR with an operating workforce around 1,000 employees [CV009]
              [CV010]. However, audited financial statements—including GAAP/IFRS balance sheets, gross margins, EBITDA,
              operating cash burn, and debt facilities—remain completely undisclosed to public markets [CV008]. While
              business platform profiles have tracked historic capitalization tranches, commercial directories provide
              no visibility into current cash reserves [CV011]. Without verified gross margins or recurring software
              take-rates, applying peak-cycle enterprise valuation marks creates immense down-round vulnerability
              [CV012].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Comparable Multiples, Downside Catalysts, and Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              Constructing a robust valuation framework for Keenon is complicated by the bifurcated nature of commercial
              robotics, where public equity peers trade at wide valuation dispersions based on liquidity and recurring
              software composition. Pure-play Western robotic delivery and hospitality platforms trade at divergent
              multiples, ranging from speculative high multiples on nascent revenue to depressed micro-cap valuations
              for low-growth hardware vendors. Concurrently, high-volume consumer home-cleaning peers like Roborock
              demonstrate that massive hardware shipments alone do not command enterprise software multiples without
              sustained profitability and market independence. For Keenon, applying a normalized enterprise
              value-to-revenue multiple between 4.0x and 7.0x against GetLatka's estimated $139 million revenue run-rate
              yields an implied baseline valuation band of $556 million to $973 million, centering below the historic
              $1.0 billion peak mark set during the 2021 venture cycle [CV001] [CV009] [CV012].


              Scenario modeling illustrates substantial dispersion across bull, base, and bear outcomes. Under the bull
              case (20% probability), Keenon successfully monetizes its KOM 2.0 VLA software architecture, converts
              pilot enterprise accounts into high-margin recurring RaaS subscription fleets, and achieves $200M+ in
              top-line revenue, supporting an enterprise valuation between $1.2B and $1.6B upon an international IPO
              filing in Hong Kong or Singapore [CV006] [CV013]. In the base case (55% probability), Keenon maintains
              moderate hardware expansion across EMEA and APAC, sustaining $140M to $170M in revenue at 30–40%
              hardware-centric gross margins, yielding a fair-value valuation between $700M and $950M [CV009] [CV012].
              In the bear case (25% probability), intensifying domestic hardware commoditization, extended capital
              drought, and adverse U.S. legal rulings trigger an acute down-round, compressing valuation to $350M–$550M
              (2.5x–3.5x revenue) [CV012] [CV014].


              Adverse legal proceedings represent an immediate downside catalyst. On July 2, 2025, Arbor Systems LLC
              filed a formal patent infringement lawsuit against Keenon Robotics Co., Ltd. in the U.S. District Court
              for the Eastern District of Texas (Case No. 2:25-cv-00678) asserting U.S. Patent No. 10,309,438 ('Smart
              IoT toy') [CV014] [CV015]. Magistrate Judge Roy S. Payne issued an order regarding service on August 8,
              2026, followed by Arbor Systems LLC filing supplemental proof of service on August 21, 2026, confirming
              active litigation progress [CV016]. An adverse verdict, injunction, or tariff exclusion could impair
              Keenon's commercial hardware distribution across North American hotel and restaurant accounts [CV014]
              [CV016].
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
              - CV016
      - number: '8.3'
        title: Exit Readiness, Institutional Stance, and Diligence Directives
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Keenon Robotics demonstrates mixed exit readiness. The
              primary structural advantage favoring an eventual liquidity event is its unrivaled market footprint:
              commanding over 100,000 cumulative unit shipments, established distribution hubs across the U.S.,
              Netherlands, Japan, South Korea, and Hong Kong, and tier-one backing from SoftBank Vision Fund 2 [CV001]
              [CV003] [CV004]. Given SoftBank's typical 5-to-7 year fund lifecycle, shareholder pressure for a liquidity
              event or strategic recapitalization is escalating. However, public listing readiness remains critically
              compromised by total financial reporting opacity, the lack of audited cash flow statements, and
              geopolitical friction surrounding Chinese-headquartered autonomous systems operating in Western commercial
              environments [CV008] [CV011]. A domestic Chinese listing or a Hong Kong IPO represents the most plausible
              public liquidity avenue, whereas a Western listing faces stringent foreign compliance hurdles.


              Consequently, the overall investment recommendation is designated as 'track' (research-more), with an
              'unknown' valuation stance and a 'high' risk rating. Institutional capital must refrain from pricing
              secondary transactions or equity participation until four mandatory diligence gates are cleared: (1)
              delivery of audited balance sheets, cash flow schedules, and gross margin reconciliations for FY2024
              through FY2026; (2) verification of cash runway and debt facilities to rule out near-term insolvency; (3)
              independent legal assessment of the Arbor Systems patent infringement exposure in the Eastern District of
              Texas; and (4) breakdown of recurring RaaS subscription revenue versus one-off distributor hardware
              shipments [CV008] [CV011] [CV014] [CV016].
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Anchoring Dilemma
            body: >-
              Keenon's $1.0B post-money valuation was established in September 2021 during an unprecedented venture
              capital boom. With peer multiples down 40% to 60% since 2021 and no new public equity rounds announced in
              five years, institutional investors cannot treat the $1.0B unicorn figure as an active mark, but rather as
              a historical ceiling subject to severe down-round risk [CV001] [CV008] [CV012].
            calloutType: insight
            claimRefs:
              - CV001
              - CV008
              - CV012
          - type: callout
            title: Intellectual Property Litigation Vulnerability
            body: >-
              The patent infringement lawsuit filed by Arbor Systems LLC in the Eastern District of Texas
              (2:25-cv-00678) creates tangible downside risk for Keenon's U.S. revenue pipeline. If the plaintiff
              secures injunctive relief or substantial licensing royalties, Keenon's American distributor partnerships
              could face severe commercial and financial disruption [CV014] [CV015] [CV016].
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
              - CV016
