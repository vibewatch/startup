              ongoing intellectual property vulnerability in the key U.S. market. With formal service proceedings active
              as of August 2026, the dispute could impose defense expenses, licensing demands, or commercial
              distribution headwinds for Keenon's American operating subsidiaries [CO015] [CO016].
