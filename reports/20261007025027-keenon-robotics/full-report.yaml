              - CE004
              - CE011
              - CE012
      - number: '5.2'
        title: Autonomy Stack and System Dependencies
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture combines sensing, on-device decision-making, motion control, and venue
              integration. Keenon's S300 page says LiDAR SLAM and stereo vision are fused for obstacle avoidance and
              route replanning, while path planning and task execution can continue without a central controller or
              external Wi-Fi or 5G. A company brochure adds multi-camera fusion, NeRF-based reconstruction,
              dynamic-environment perception, and motion control to the claimed technology stack. These disclosures
              support a coherent architecture map, not an independent performance benchmark: latency, localization
              error, intervention frequency, cybersecurity controls, and behavior under reflective, crowded, or
              degraded-sensor conditions are not quantified in the retained evidence.
            claimRefs:
              - CE005
              - CE006
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
          - type: figure
