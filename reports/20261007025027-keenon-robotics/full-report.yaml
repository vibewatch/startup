  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial service robotics market occupies a specialized segment of autonomous systems distinct from
              fixed industrial automation and warehouse automated guided vehicles. The addressable domain encompasses
              indoor service environments—primarily full-service and quick-service dining establishments, hotels,
              healthcare institutions, and commercial real estate facilities—where mobile robots execute front-of-house
              meal delivery, bussing, amenity transport, and commercial floor care. Included expenditures comprise robot
              hardware capital purchases, Robot-as-a-Service (RaaS) subscription leases, cloud dispatch fleet management
              software, and on-site maintenance contracts. Excluded spend includes custom manufacturing conveyors,
              exterior delivery drones, and non-mobile kitchen automation equipment. Status-quo alternatives remain
              heavily dominated by human manual labor, static serving carts, and legacy contracted cleaning crews. As
              labor costs rise and restaurant turnover accelerates, commercial operators evaluate automated delivery
              units as direct labor substitutes capable of stabilizing table-turn cycles during peak operational rush
              periods.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing, Forecast Horizons, and Growth Trajectories
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for commercial indoor robotics requires disaggregating macro automation
              projections into practical commercial catering and hospitality spending envelopes. Global forecasts
              published jointly by Boston Consulting Group (BCG) and the International Federation of Robotics (IFR)
              project the aggregate global robotics market to reach $161 billion by 2030, expanding at a 20.0% compound
              annual growth rate from a $40 billion baseline in 2020. Professional service robotics represents the
              fastest-growing macro segment within this total, forecast to grow from $10 billion in 2020 to $90 billion
              by 2030 at a 24.6% compound annual growth rate, capturing 55.9% of total worldwide robotics volume. Within
              this broader category, commercial catering delivery and hospitality automation represents a specialized,
              high-density niche. In China, KEENON achieved market dominance by capturing a 60.4% market share in
              catering service robots in 2022 per IDC data, while also leading Chinese manufacturers with a 44.8% share
              of catering robot export revenues in 2023 across an export market tracked by IDC at over $60.1 million.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics across commercial service robotics vary significantly by customer operating model,
              facility density, and balance-sheet capacity. In dining and catering environments, the primary economic
              buyer is typically a franchise owner, regional franchisee group, or general manager operating against
              localized store labor budgets. Adoption is triggered by severe waitstaff shortages, rising minimum wages,
              and the imperative to increase table turnover rates during concentrated dining hours. In full-service
              hotels and lodging properties, property general managers and vice presidents of guest operations control
              purchasing under operational capital budgets, motivated by 24/7 amenity delivery needs and contactless
              service expectations. Commercial cleaning deployments in shopping malls and transit hubs are driven by
              facility managers aiming to lower per-square-meter janitorial costs. Across all segments, decentralized
              procurement requires scalable distributor partnerships, local maintenance depots, and multilingual
              operational interfaces to support multi-unit enterprise rollout.
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and IP Litigation Risks
        blocks:
          - type: paragraph
            body: >-
              Adoption velocity in commercial service robotics is governed by compelling operational ROI balanced
              against physical environment constraints, customer capital intensity, and intellectual property litigation
              headwinds. The core growth driver remains the acute labor shortage across hospitality and retail services
              globally, where autonomous units relieve staff from repetitive hauling tasks and allow human workers to
              focus on guest communication and food preparation. However, structural constraints persist: narrow
              restaurant aisles, multi-floor transit barriers requiring elevator IoT integration, and inconsistent Wi-Fi
              connectivity frequently impede seamless fleet deployment. Furthermore, expansion into lucrative Western
              markets faces legal friction. On July 2, 2025, Arbor Systems LLC initiated patent infringement litigation
              against KEENON Robotics in the U.S. District Court for the Eastern District of Texas, asserting U.S.
              Patent No. 10,309,438. In August 2026, Magistrate Judge Roy S. Payne entered formal service orders in the
              matter, highlighting ongoing defense overhead, potential cross-border IP exposure, and compliance
              frictions as KEENON scales international operations.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Catering Market Consolidation and Global Export Positioning
            body: >-
              KEENON Robotics has established decisive scale leadership in commercial catering automation, securing
              60.4% market share in China in 2022 and capturing 44.8% of Chinese catering robot export revenues in 2023
              per IDC data. This domestic volume base provides hardware cost advantages and manufacturing economies that
              support aggressive pricing in international expansion.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM010
          - type: callout
            title: U.S. Market Intellectual Property Litigation Headwinds
            body: >-
              The patent infringement lawsuit filed by Arbor Systems LLC against KEENON in the Eastern District of Texas
              (Case 2:25-cv-00678) regarding U.S. Patent No. 10,309,438 underscores legal and operational friction in
              North American market penetration. Ongoing defense requirements, service procedural motions in August
              2026, and potential damage claims create commercial uncertainty for U.S. distribution channels.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The assigned 2026 alternative list is broad rather than a clean peer set. It identifies Bear Robotics,
              Pudu Robotics, and Richtech Robotics as the closest restaurant or hospitality service-robot alternatives,
              while Miso Robotics automates a narrower kitchen workflow. It also includes consumer-cleaning companies
              Roborock and Ecovacs, warehouse-AMR provider Geek+, and humanoid or general-robotics vendors such as
              Unitree. Those adjacencies matter because they represent potential technology or distribution entrants,
              but the source does not demonstrate that they currently compete for the same budgets. Manual service,
              conventional carts, and internal development remain buyer alternatives in principle; the assigned pool
              contains no measured cost or adoption evidence for them, so they are treated as unresolved rather than
              scored as proven competitors.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
