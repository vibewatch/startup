  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current Designation
      - Evidence Base & Primary Driver
      - Decision Implication
    rows:
      - - Recommendation
        - Track / Research-More
        - >-
          Extensive commercial deployment scale (100k+ robots shipped) offset by complete audited financial opacity and
          funding silence since 2021.
        - >-
          Withhold fresh equity capital and secondary purchases until certified management accounts and cash burn
          schedules are inspected.
      - - Confidence Level
        - Medium
        - >-
          High confidence in physical shipment scale and legal exposure; low confidence in revenue quality, unit
          economics, and liquidity runway.
        - >-
          Limit underwriting models to range-based scenario planning rather than point-estimate DCF or premium exit
          multiples.
      - - Risk Rating
        - High
        - >-
          Compounding risks across capital exhaustion, private valuation down-round pressure, active EDTX patent
          litigation, and hardware commoditization.
        - >-
          Require downside liquidation preference protections, non-dilution covenants, and IP indemnity guarantees in
          any future financing term sheet.
      - - Valuation Stance
        - Unknown
        - >-
          No verified post-money benchmark since the $1.0B Series D in 2021; third-party ARR estimates ($139M) imply
          severe multiple compression.
        - >-
          Decline anchoring to historic unicorn marks; price any secondary entry at an asset-backed discount to trailing
          hardware multiples.
      - - Target Horizon & Liquidity
        - 24 - 36 Months (HKEX / Strategic M&A)
        - >-
          SoftBank Vision Fund 2 exit window maturing; Hong Kong equity offering or strategic acquisition by an
          industrial automation conglomerate.
        - >-
          Monitor HKEX listing rule amendments, international distributor cash collections, and cross-border tech
          listing precedent.
    notes: >-
      Recommendation and confidence ratings reflect synthesis of corporate disclosures, estimated ARR benchmarks, and
      active court records.
