  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions & Operating Drivers
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          KOM 2.0 VLA model achieves commercial adoption; fleet expands past 150,000 units; RaaS revenue mix reaches
          40%; ARR scales to $220M+.
        - >-
          $1.2B - $1.6B valuation (5.5x - 7.5x ARR); successful Hong Kong or Singapore IPO within 18 months delivering
          positive returns to Series D holders.
        - >-
          Western regulatory sanctions restricting LiDAR/sensor data; humanoid commercialization delays; multiple
          contraction across tech IPOs.
        - 20% (Constrained by lack of fresh funding signals and continued financial opacity)
      - - Base Case
        - >-
          Hardware deployments expand steadily across APAC/EMEA; annual revenue stabilizes at $140M - $170M; RaaS
          remains under 20% of revenue.
        - >-
          $700M - $950M valuation (4.5x - 6.0x revenue); strategic growth recapitalization or M&A transaction with an
          industrial facility giant.
        - >-
          Ongoing hardware margin compression; distributor channel inventory buildup; lingering valuation overhang from
          2021 peak mark.
        - 55% (Reflects verified commercial distribution scale tempered by hardware business realities)
      - - Bear Case
        - >-
          Capital exhaustion forces emergency bridge round; US patent litigation results in injunction; revenue
          stagnates or declines below $110M.
        - >-
          $350M - $550M valuation (2.5x - 3.5x revenue); heavy down-round diluting common shareholders and triggering
          liquidation preferences.
        - >-
          Adverse judgment in Arbor Systems patent suit; Western customer bans on Chinese IoT devices; debt default or
          liquidity crunch.
        - 25% (Elevated by five-year funding hiatus and active legal exposure in EDTX)
    notes: >-
      Scenario valuations model enterprise value as a function of verified shipment footprint, third-party revenue
      estimates, and peer multiple ranges.
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
