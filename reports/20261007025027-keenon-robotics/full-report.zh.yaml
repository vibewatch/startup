  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从全球机器人市场逐层缩小到可触达的商用室内餐饮和酒店自动化市场机会。
    data:
      items:
        - label: 全球机器人总市场（2030）
          value: $161B
          detail: BCG / IFR 对工业、物流和服务机器人汇总的全球市场预测，CAGR 为 20%。
        - label: 专业服务机器人（2030）
          value: $90B
          detail: BCG / IFR 对专业服务机器人的预测，该市场占机器人总市场的 55.9%，CAGR 为 24.6%。
        - label: 餐饮与酒店商用服务机器人
          value: $5B-$10B
          detail: 估算主要区域市场的全球餐饮和酒店配送、清洁自动化支出。
        - label: 中国商用餐饮服务机器人（SAM）
          value: $500M-$1B
          detail: 中国国内商用餐饮服务机器人市场；据 IDC 2022 年数据，KEENON 占 60.4% 市场份额。
        - label: 中国餐饮配送机器人出口市场
          value: $60.1M+ (2023)
          detail: IDC 跟踪的 2023 年中国制造商出口收入，KEENON 占 44.8% 出口份额。
        - label: 受约束 SOM（可现实捕获的覆盖范围）
          value: $100M-$200M
          detail: 短期可触达部署量受餐厅资本开支、劳动力替代的单位经济效益和 IP 诉讼边界制约。
    approximationNotes: 预测综合 BCG、IFR 和 IDC 数据；下层代表根据硬件单价和部署渗透率假设推导出的可触达细分市场。
    claimRefs:
      - CM004
      - CM005
      - CM007
      - CM010
  - id: FP001
    title: 竞争定位图——工作流重叠度与产品组合广度
