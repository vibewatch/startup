  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: KEENON Robotics 从首次 RaaS 试用到多机器人跨场景车队部署的端到端客户采用生命周期。
    data:
      items:
        - label: 1. 痛点识别
          stage: 初始痛点识别
          actor: 企业餐厅与酒店运营
          touchpoints:
            - 高峰时段劳动力短缺
            - 服务工资成本上升
            - 员工流失率高
          description: 运营方在重复性的餐食配送和客房运输任务中面临严重的一线人手约束。
        - label: 2. 低资本开支 RaaS 试点
          stage: 低资本开支 RaaS 试点评估
          actor: 门店经理与采购
          touchpoints:
            - 每月 RaaS 租赁咨询（~RMB 3,000/mo）
            - 现场导航建图调研
            - 1-2 台试点部署
          description: 客户在前期风险较低的情况下，评估功能适配性、避障安全性和回本周期。
        - label: 3. 工作流集成
          stage: 生产工作流集成
          actor: 一线员工与 IT 运营
          touchpoints:
            - 员工交互培训
            - 电梯 IoT 集成（E-Box）
            - 自动调度配置
          description: 机器人进入日常班次，负责高峰时段餐食分发和无接触客房配送。
        - label: 4. 车队加密
          stage: 车队加密与多机器人协作
          actor: 区域运营总监
          touchpoints:
            - 每个地点扩展至 3-8 台
            - 多机器人调度优化
            - 跟踪年度 OPEX 节省（~300,000 RMB）
          description: 已验证的门店级 ROI 推动单个高客流物业密集部署车队。
        - label: 5. 多场景扩张
          stage: 跨场景垂直扩张
          actor: 企业客户账户
          touchpoints:
            - 引入 KLEENBOT 商用清洁
            - 部署 DINERBOT T10 广告屏
            - S100 后台物流
          description: 企业客户从单一餐饮配送扩展到清洁、营销和重载快递组合工作流。
        - label: 6. 具身 AI 前沿试点
          stage: 具身 AI 与人形机器人前沿试点
          actor: 创新负责人和高管赞助人
          touchpoints:
            - WAIC / WRC 行业演示
            - KOM 3.0 VLA 多步骤任务评估
            - XMAN 人形礼宾机器人试用
          description: 部分客户探索面向特定角色的新一代人形机器人，以承接非标准客户服务任务。
    approximationNotes: 客户旅程阶段综合已发布案例、定价结构和管理层战略披露得出。
    claimRefs:
      - CU002
      - CU004
      - CU006
      - CU011
