  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 西方司法辖区的法律与知识产权风险
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 正在美国接受法律审查，证据是德州东区发起的联邦专利诉讼（Arbor Systems LLC v. KEENON Robotics Co., Ltd.，案件编号
              2:25-cv-00678）。诉讼于 2025 年 7 月在 Chief District Judge Rodney Gilstrap 和 Magistrate Judge Roy S. Payne
              面前提起，指控直接和诱导侵犯美国专利第 10,309,438 号（“Smart IoT toy”）。2026 年 8 月关于正式送达的法院命令等案卷记录，显示司法程序仍在推进。该诉讼使 KEENON 的美国业务和
              Dinerbot、Butlerbot、Kleenbot 商业硬件产品线面临潜在侵权损害赔偿、初步禁令或 Section 337 入境排除令的实质风险。此外，作为一家中国机器人供应商，KEENON
              在北美和欧洲设施部署搭载 LiDAR、双目摄像头和 IoT 遥测的传感器密集型平台，面临严重监管压力。随着市、州和联邦机构加强对外国联网设备的限制，缺乏 PIPL、DSL、GDPR 或 HIPAA
              等经审计合规框架，会成为医院和政府设施采购的重大障碍。
