        - 客户遥测数据证明任务可自主完成，KOM 2.0 软件许可证已付费续约，并有企业级人形机器人部署。
      - - 资本结构与估值支撑
        - SoftBank Vision Fund 2 领投的 $200M Series D 轮将投后估值锚定在 $1.0B，证明其企业级背景。
        - 自 2021 年 9 月起融资中断五年；2021 年高峰倍数已失效，严重下轮融资风险陡增。
        - 确认一轮无瑕疵的成长融资，或 SoftBank 经审计的 NAV 估值仍维持或超过 $1.0B。
      - - 法律与知识产权态势
        - 具备扎实的国内制造 know-how，以及覆盖服务机器人导航和底盘工程的防御性全球 IP 组合。
        - 美国专利侵权诉讼正在进行（Arbor Systems LLC v. Keenon，2:25-cv-00678），威胁北美核心分销。
        - Arbor Systems 专利主张被有实质终局效力地驳回、取得有利的不侵权裁决，或达成 de minimis 交叉许可和解。
    notes: 正题与反题综合比较已核实的商业运营优势，以及尚未解决的财务和知识产权风险。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV008
      - CV012
      - CV014
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设与运营驱动因素
      - 估值与回报逻辑
      - 主要风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - KOM 2.0 VLA 模型实现商业化采用；车队规模超过 150,000 台；RaaS 收入占比达到 40%；ARR 达到 $220M+。
        - $1.2B - $1.6B 估值（ARR 的 5.5x - 7.5x）；18 个月内在香港或新加坡成功 IPO，为 Series D 持有人带来正回报。
        - 西方监管制裁限制 LiDAR / 传感器数据；人形机器人商业化延迟；科技 IPO 整体倍数收缩。
        - 20%（受新增融资信号缺失和财务持续不透明制约）
      - - 基准情景
        - 硬件部署在 APAC / EMEA 稳步扩张；年度收入稳定在 $140M - $170M；RaaS 占收入仍低于 20%。
        - $700M - $950M 估值（收入的 4.5x - 6.0x）；与工业设施巨头进行战略成长型资本重组或并购交易。
        - 硬件利润率持续压缩；分销商渠道库存堆积；2021 年峰值估值留下的压力仍在。
        - 55%（反映已核实的商业分销规模，但已考虑硬件业务的现实）
      - - 悲观情景
        - 资本耗尽，迫使公司紧急进行过桥融资；美国专利诉讼导致禁令；收入停滞或降至 $110M 以下。
        - $350M - $550M 估值（收入的 2.5x - 3.5x）；大幅下轮融资稀释普通股股东并触发清算优先权。
        - Arbor Systems 专利诉讼不利判决；西方客户禁用中国 IoT 设备；债务违约或流动性紧缩。
        - 25%（五年融资中断及 EDTX 在审法律风险推高该概率）
    notes: 情景估值以已核实的出货覆盖范围、第三方收入估算和可比公司倍数区间为基础，测算企业价值。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
      - CV012
      - CV014
      - CV016
