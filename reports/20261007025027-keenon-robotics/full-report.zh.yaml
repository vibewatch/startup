            body: >-
              公开资料中对 Keenon 变现方式最清晰的描述来自第三方商业模式页面：直接销售机器人是主要收入来源，同时还有 RaaS
              订阅、云端机队管理许可、维护、备件、定制和企业交易。这支持硬件加服务的混合模式，但无法说明任何收入流的贡献、合同期限、续约率或毛利率。公司材料称已在 60 多个国家出货超过 100,000
              台，这说明制造和分销触达，但它是累计出货量，不等于当前期间收入、活跃装机机队、利用率或经常性收入。公开收入数据无法对账：GetLatka 将 1.39 亿美元标为 2025 年预估年收入，而 AskCyborg
              的两个页面显示 7.971 亿美元，却未说明财年或提供经审计对账。两项数字都不应视为 ARR；在没有原始资料前，差异过大，无法用任一数字作为估值锚点。
