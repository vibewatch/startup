      - number: '1.3'
        title: 市场表现、规模估算与法律风险
        blocks:
          - type: paragraph
            body: >-
              IDC 行业分析师将 Keenon Robotics 评为 2022 年中国商用餐饮服务机器人市场的头部供应商，市场份额为 60.4%；2023 年，Keenon 还占中国餐饮配送机器人制造商出口收入份额的
              44.8% [CO012]。独立市场聚合平台估算其 2025 年年收入约为 $139M ARR，并估计截至 2025 年末和 2026 年员工人数为 1,000
              人，但能够核实收入、毛利率和经营现金消耗的经审计财务报表完全未披露 [CO013] [CO014]。国际市场运营也带来了实质性的法律与 IP 摩擦。2025 年 7 月 2 日，非执业实体 Arbor
              Systems LLC 在美国德州东区联邦地区法院对 Keenon Robotics Co., Ltd. 发起专利侵权诉讼（案件编号 2:25-cv-00678），指控其侵犯美国专利第 10,309,438
              号（“Smart IoT toy”）[CO015]。Magistrate Judge Roy S. Payne 于 2026 年 8 月 8 日就正式送达签发命令，随后 Arbor Systems LLC 于
              2026 年 8 月 21 日提交补充送达证明，确认美国境内的对抗性法律程序仍在进行 [CO016]。
