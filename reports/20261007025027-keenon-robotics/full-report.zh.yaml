  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与需求驱动
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 服务五类不同商业服务垂直领域的企业和 SMB
              客户：餐饮与餐厅、酒店服务与酒店、零售超市、医疗设施，以及汽车经销商等专业商业场所。一线商业买方主要是加盟餐厅店主、酒店总经理和零售运营负责人，他们面临工资通胀上升、员工流动率高及高峰时段持续缺工等结构性劳动力压力。在高密度餐饮和住宿环境中，运营方评估机器人自动化，关注的不是新奇形态，而是四个实际门槛：功能是否跑得通、运营是否可靠、拥挤行人环境下是否安全，以及投资回报是否清晰。KEENON
              通过 Robot-as-a-Service（RaaS）租赁框架降低资本开支门槛，让 SMB 餐厅和酒店运营方以每月约 RMB 3,000、1 至 2 年承诺部署 DINERBOT 和
              BUTLERBOT，用可预测的运营支出替代未预算的前期硬件采购。
            claimRefs:
