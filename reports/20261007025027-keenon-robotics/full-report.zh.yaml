  - id: FI001
    title: 收入到毛利的证据桥
    type: flow
    summary: 公开证据识别出可能的变现路径和成本类别，但收入组合、定价和毛利仍无法量化。
    data:
      nodes:
        - id: customer-contract
          label: 客户合同
          description: 直接企业客户或经分销商撮合的路径；公开合同条款不可得
        - id: equipment-sale
          label: 设备销售
          description: 根据第三方商业模式页面，这是主要收入流
        - id: raas
          label: RaaS 订阅
          description: 公开列出的月度替代方案；采用率、期限和资产所有权不可得
        - id: service-addons
          label: 软件、服务和零部件
          description: 列出的经常性收入或与装机基数挂钩的收入流；附加率不可得
        - id: reported-revenue
          label: 已披露收入
          description: 公开数字存在冲突：2025 年估算值为 $139M，而未指明期间的资料页数值为 $797.1M
        - id: manufacturing-costs
          label: 制造与库存
          description: 已识别成本类别，但物料清单和营运资金数据不可得
        - id: operating-costs
          label: 研发、云、合规、销售和支持
          description: 已识别成本类别，但没有公开分配或服务成本数据
        - id: gross-profit
          label: 毛利与现金转化
          description: 缺少收入组合、实际定价、COGS、营运资金和资本开支，无法推导
      edges:
        - from: customer-contract
          to: equipment-sale
          label: 购买路径
        - from: customer-contract
          to: raas
          label: 订阅路径
        - from: customer-contract
          to: service-addons
          label: 附加销售路径
        - from: equipment-sale
          to: reported-revenue
        - from: raas
          to: reported-revenue
        - from: service-addons
          to: reported-revenue
        - from: reported-revenue
          to: gross-profit
        - from: manufacturing-costs
          to: gross-profit
        - from: operating-costs
          to: gross-profit
    approximationNotes: 仅为概念性桥接；由于指定证据中没有公开这些数量，节点宽度和边的顺序不代表收入组合、转化率或利润率。
