            title: 德州东区待决的美国专利侵权诉讼
            body: >-
              Arbor Systems LLC 在德州东区对 KEENON Robotics Co., Ltd. 提起的诉讼（案件 2:25-cv-00678）带来显著财务和运营风险。诉状指控侵犯美国专利第
              10,309,438 号（“Smart IoT toy”），目标涉及 KEENON 核心商业产品。若原告获得禁令或高额损害赔偿，KEENON 在美国市场的扩张可能受到严重限制。
            calloutType: risk
