              - CM010
      - number: '2.3'
        title: 买方分层、预算归属与采用经济性
        blocks:
          - type: paragraph
            body: >-
              商用服务机器人的采购动力，会随客户运营模式、设施密度和资产负债表能力显著变化。在餐饮环境中，主要经济买方通常是特许经营店主、区域加盟商集团或负责本地门店人工预算的总经理。严重的服务员短缺、最低工资上涨，以及高峰用餐时段提升翻台率的压力，会直接触发采用。在全服务酒店和住宿物业中，物业总经理及宾客运营副总裁在运营资本预算下掌握采购，核心动机是满足全天候设施用品配送和非接触式服务预期。商场和交通枢纽的商业清洁部署，则由设施经理推动，以降低每平方米保洁成本。所有细分市场的分散采购都需要可扩展的分销商合作、本地维护站点和多语言运营界面，才能支持多门店企业落地。
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与 IP 诉讼风险
        blocks:
          - type: paragraph
            body: >-
              商用服务机器人采用速度，取决于有吸引力的运营 ROI
              能否抵消物理环境约束、客户资本强度和知识产权诉讼压力。全球酒店服务与零售服务业的严重劳动力短缺仍是核心增长驱动：自主设备可替员工完成重复搬运，让人力转向宾客沟通和备餐。但结构性限制依然存在，包括餐厅通道狭窄、需要电梯
              IoT 集成的跨楼层通行障碍，以及不稳定的 Wi-Fi 连接，这些因素经常阻碍机队顺畅部署。进入利润丰厚的西方市场也面临法律摩擦。2025 年 7 月 2 日，Arbor Systems LLC
              在美国德州东区联邦地区法院对 KEENON Robotics 发起专利侵权诉讼，主张其侵犯美国专利第 10,309,438 号。2026 年 8 月，Magistrate Judge Roy S. Payne
              就该案签发正式送达命令，凸显持续的辩护成本、跨境 IP 风险和 KEENON 扩张国际运营时的合规摩擦。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 餐饮市场整合与全球出口定位
            body: >-
              KEENON Robotics 已在商业餐饮自动化领域建立明确的规模领先地位：2022 年在中国市场份额为 60.4%，2023 年占中国餐饮机器人出口收入的 44.8%，均据 IDC
              数据。国内规模基础带来硬件成本优势和制造规模效应，支持其在国际扩张中采取激进定价。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM010
          - type: callout
            title: 美国市场知识产权诉讼压力
            body: >-
              Arbor Systems LLC 在德州东区对 KEENON 提起的专利侵权诉讼（案件 2:25-cv-00678），涉及美国专利第 10,309,438
              号，凸显其进入北美市场时的法律和运营摩擦。持续的辩护要求、2026 年 8 月的送达程序动议及潜在损害赔偿主张，都会给美国分销渠道带来商业不确定性。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              2026 年指定的替代方案名单覆盖面广，并非干净的同业可比组。名单将 Bear Robotics、Pudu Robotics 和 Richtech Robotics
              列为最接近的餐厅或酒店服务机器人替代者；Miso Robotics 则自动化更窄的厨房流程。名单还包括消费清洁公司 Roborock 和 Ecovacs、仓储 AMR 供应商 Geek+，以及 Unitree
              等人形或通用机器人厂商。这些相邻领域值得关注，因为它们可能成为技术或分销进入者，但来源没有证明它们当前争夺同一预算。原则上，人工服务、传统餐车和内部研发也都是买方替代方案；不过指定资料池没有对其成本或采用情况的量化证据，因此只能视为未解决问题，不能作为已证实竞争者评分。
            claimRefs:
