          - type: callout
            title: 美国专利侵权风险
            body: >-
              Arbor Systems LLC 在德州东区发起的诉讼（2:25-cv-00678）显示，公司在关键美国市场面临持续的知识产权风险。截至 2026 年 8 月，正式送达程序仍在推进；该争议可能给 Keenon
              的美国运营子公司带来辩护费用、许可要求或商业分销阻力 [CO015] [CO016]。
            calloutType: risk
            claimRefs:
