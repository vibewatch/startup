            body: >-
              已记录的客户案例为多种服务场景下达到生产级运营集成提供了具体证明。在韩国，自助餐连锁 QooQoo 在其 Guro 高端门店部署了 8 台 DINERBOT T9
              配送机器人，在用餐高峰持续送餐并清理空托盘，直接减少前厅通行瓶颈和员工疲劳。在国际酒店服务领域，Hilton、Sheraton 和 Shangri-La 等豪华酒店连锁运营 KEENON
