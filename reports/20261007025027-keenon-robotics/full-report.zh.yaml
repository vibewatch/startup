      - number: '1.2'
        title: 资本化历史、股权与治理结构
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics 在 2021 年的 Series D 融资中达到隐含 $1B 独角兽估值；该轮融资规模为 $200M，主要由 SoftBank Vision Fund 2 支持，并与
              SoftBank Robotics 建立全球战略分销及商业合作关系 [CO007] [CO008]。独立第三方聚合平台统计其历轮融资累计风险投资额为 $200M 至
              $244M，而较早的私募股权登记基线记录显示，公司发展早期曾有 $28.4M 的历史股权分批融资 [CO009]。SoftBank 创始人 Masayoshi Son 曾公开支持 Keenon
              的机器人平台拓展全球商业市场 [CO008]。但公开聚合平台披露的正式高管名单仍不完整，治理和关键人物信息存在明显缺口
              [CO010]。此外，外部公司数据库持续跟踪企业，但显示其没有公开发布的资产负债表、现金流量表或损益表，凸显财务报告完全不透明 [CO011]。
            claimRefs:
