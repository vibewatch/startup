      - number: '7.3'
        title: 分销交易对手依赖、稀释悬置与终止标准
        blocks:
          - type: paragraph
            body: >-
              KEENON 的全球市场渗透主要依赖区域第三方分销商和非排他商业联盟，例如以色列的 AIBotics、Cannibble Food-Tech，以及加拿大的 SGP Purchasing Partner
              Network 和 E-Pro Bot。这种间接模式有助于轻资产进入市场，却会稀释毛利、拉远 KEENON 与直接企业客户的关系，并让服务连续性暴露于分销商资不抵债或运营失败。KEENON 自 2021 年 9
              月 SoftBank Vision Fund 2 领投的 2 亿美元 Series D 后，没有公开宣布新的股权融资轮次。公司年收入估计约 1.39 亿美元，在 60 至 70 个国家拥有超过 1,000
              名但未获确认的员工；由于完全缺乏公开经审计财务披露，现金消耗和资本充足性仍完全未经验证。在继续判断扩张是否值得投资之前，应持续监控美国专利审判结果、分销商潜在付款违约、出口管制指定及资本耗尽信号，形成可辩护的尽调终止标准。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
