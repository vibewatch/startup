              W3（当地命名为 “H.A.R.I”），并集成自动电梯 IoT，实现全天候非接触配送。在零售领域，欧洲大卖场集团 E.Leclerc 在斯洛文尼亚卢布尔雅那引入 DINERBOT
              T10，利用交互式显示屏进行促销播报和移动产品试用。
