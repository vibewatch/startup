  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              商用服务机器人市场属于自主系统中的专业细分，与固定式工业自动化及仓储自动导引车不同。可服务市场覆盖室内服务场景，主要包括全服务和快餐餐厅、酒店、医疗机构及商业地产设施；移动机器人在这些场景执行前厅送餐、收台、设施用品运输和商业地面清洁。纳入支出包括机器人硬件资本采购、Robot-as-a-Service（RaaS）订阅租赁、云端调度机队管理软件及现场维护合同；不纳入定制制造输送线、室外配送无人机和非移动式厨房自动化设备。现状替代方案仍高度依赖人工劳动、固定餐车和传统外包清洁团队。随着人工成本上升、餐厅人员流动加快，商业运营方开始评估自动配送设备，将其作为直接人工替代，用于在高峰运营时段稳定翻台节奏。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模、预测周期与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              评估商用室内机器人可服务市场，需要把宏观自动化预测拆解为实际的商业餐饮和酒店服务支出。Boston Consulting Group（BCG）与 International Federation of
              Robotics（IFR）联合发布的全球预测显示，全球机器人市场到 2030 年将达到 $161 billion；该市场以 2020 年的 $40 billion 为基数，复合年增长率为 20.0%。
              专业服务机器人是其中增长最快的宏观板块，预计将从 2020 年的 $10 billion 增长到 2030 年的 $90 billion，复合年增长率为 24.6%，占全球机器人总量的
              55.9%。在这一大类中，商业餐饮配送和酒店自动化是一个高密度的专业细分。根据 IDC 数据，KEENON 在中国 2022 年餐饮服务机器人市场取得 60.4% 份额，同时在 2023
              年中国厂商餐饮机器人出口收入中占 44.8%；IDC 跟踪的出口市场规模超过 $60.1 million。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
