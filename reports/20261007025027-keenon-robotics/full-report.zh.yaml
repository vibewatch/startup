          - type: callout
            title: 资本化展望与融资干旱
            body: >-
              Keenon Robotics 在餐饮服务机器人领域拥有行业领先的出货规模和显著市场份额，但自 2021 年 9 月 Series D
              以来，公司一直没有宣布新的一级股权融资。全球硬件部署资本密集度高，缺乏新资本披露，因此引发对经营现金跑道和内生盈利能力的疑问 [CO007] [CO011]。
            calloutType: insight
            claimRefs:
