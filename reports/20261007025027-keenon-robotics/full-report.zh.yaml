      - number: '7.2'
        title: 运营可靠性、供应链依赖与硬件陷阱
        blocks:
          - type: paragraph
            body: >-
              从运营角度看，KEENON 在结构上容易受到供应链中断和零部件依赖影响，进而限制商业规模化。公司的先进机器人，尤其是配备 100 TOPS 边缘计算和 132 N·m 峰值膝关节扭矩的 XMAN-L1
              双足人形机器人，高度依赖先进 AI 芯片加速器和专用执行电机。如果先进计算芯片面临更严格的美国出口管制或贸易制裁，KEENON
              的硬件路线可能遭遇严重生产延误或被迫重做架构。同时，独立行业尽调表明，商用服务机器人供应商长期承受硬件毛利率压缩。没有专有基础 AI
              模型或独家导航算法，LiDAR、深度传感器和底盘机械等硬件组件会受到低成本国内竞争者快速商品化冲击。进入复杂人形平台也会带来较高的运营保修风险；与成熟的室内配送平台相比，其现场可靠性尚未得到证明。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
