          - type: callout
            title: 融资长期停滞与财务披露黑洞
            body: >-
              KEENON 自 2021 年 9 月 SoftBank Vision Fund 2 领投的 2 亿美元 Series D 以来，没有宣布新的股权融资。公司年收入估计为 1.39 亿美元，业务覆盖 60
              多个国家并拥有 1,000 名员工；在过去五年，公司一直没有经审计的财务披露或已验证的资本充足性指标，这对后期投资者构成重大尽调障碍。
            calloutType: insight
