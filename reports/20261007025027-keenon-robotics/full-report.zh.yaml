      - number: '3.3'
        title: 分销、锁定效应与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              产品广度可能帮助 Keenon
              向同一客户账户销售多种机器人，但指定证据没有证明广度能带来持久锁定。现有来源没有提供经销商利润、渠道排他性、支持等级协议、集成深度、机队管理迁移成本、续约率，或客户无法多供应商采购的证据。因此，对比来源只能支撑品类地图，不能支撑业绩基准或护城河结论。Keenon
              据报 2026 年拓展人形机器人和自主割草机，可能扩大可服务工作流，也可能增加执行复杂度。投资判断应把装机基数规模和产品广度当作待用客户引荐和合同数据验证的假设，而不是已经证明的定价权。
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: 反向证据与投资含义
        blocks:
          - type: paragraph
            body: >-
              美国案卷来源记录，2025 年 7 月 2 日有人在德州东区对 Keenon 提起专利侵权诉讼，随后 2026 年 8
              月出现与送达相关的活动。诉状只是指控，不是侵权认定；指定证据也没有证明实体胜负、损害赔偿风险、和解概率或具体产品影响。即便如此，诉讼仍在进行会影响竞争持久性，因为知识产权争议可能改变产品路线、分销信心和法律成本。因此，投资观点只能是有条件的：Keenon
              看起来比若干被点名的餐厅同业更广、规模可能也更大，但证据质量不足以证明公司拥有持久的成本、技术、渠道或切换成本护城河。
            claimRefs:
