            body: >-
              KEENON 累计在 60 多个国家、600 个城市出货超过 100,000 台，已相对新兴具身 AI 初创公司形成运营规模优势。IDC 市场情报确认 KEENON 在商业配送领域领先，称其在商业配送机器人中拥有
              29.8% 的全球市场份额，在食品配送子领域拥有 40.4% 的主导份额。此外，在中国餐饮机器人出口商中，KEENON 占出口收入的 44.8%，显示其国际销售执行力已超出国内基础。经过 16
              年发展，KEENON 从基础餐厅送餐机器人演进到多场景集成部署，将 DINERBOT 送餐机器人、BUTLERBOT 客房配送机器人和 KLEENBOT 地面清洁机器人纳入统一机队管理。在 WRC
              2026、WAIC 2026 等近期行业展会上，公司展示了下一代 KOM 3.0 基础模型，让轮式人形设备与专业服务机器人协同运行，体现出扩大单一客户账户效用的采用路线。
