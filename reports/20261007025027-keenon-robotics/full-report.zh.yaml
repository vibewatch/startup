        title: 能力、规模与定价证据
        blocks:
          - type: paragraph
            body: >-
              一份第三方品牌资料称，Keenon 约占全球食品配送机器人市场的 40%，已部署超过 100,000 台服务机器人，业务覆盖 70 多个国家。该资料还介绍了覆盖餐厅配送 DinerBot 和清洁产品
              Kleenbot 的产品组合。这些数字可能意味着规模和广度优势，但本报告没有用备案、客户普查或独立市场份额研究予以交叉验证。GetLatka 另报收入 1.39 亿美元和估值 10
              亿美元，但未说明计量期间或方法；两项数字均不视为 ARR、当前估值或已验证的财务表现。已获取的商业对比页面没有足够可用的型号级定价或合同细节，无法比较总拥有成本。
