    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业范围
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics Co., Ltd. 成立于 2010 年，总部位于中国上海，主要办公地址为上海市浦东新区金海路 1000 号 56 号 11 层 [CO001] [CO002]。Keenon
              作为具身 AI 服务机器人供应商，已在全球出货超过 100,000 台，并在 60 多个国家、15 类不同场景部署机器人机队，涵盖餐饮、酒店服务、医疗和零售
              [CO003]。公司在美国、荷兰、日本、韩国和香港特别行政区等关键司法辖区设有国际枢纽 [CO004]。其商业模式覆盖室内自主配送机器人（DINERBOT 和 BUTLERBOT
              系列）、工业清洁平台（KLEENBOT 系列）、重载物流配送机器人（KEENON S100），以及 XMAN-R1 人形机器人等新一代具身 AI 原型机
              [CO005]。尽管商业分销广泛，详细公司披露仍受到严格限制，法定资本和收入指标对外部投资者基本不透明 [CO006]。
