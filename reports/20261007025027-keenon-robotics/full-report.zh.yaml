            body: >-
              尽管部署数据广泛，客户留存持久性和扩张机制仍部分不透明。KEENON 没有公开披露按客户群体计算的净收入留存（NRR）、总体续约率或设备流失数据，投资者无法验证累计出货 100,000
              台究竟代表持续扩大的经常性基础，还是餐厅高人员流动环境中的快速替换周期。更关键的是，KEENON 高度依赖第三方区域分销网络、增值经销商和 SoftBank Robotics
              等企业渠道联盟来推动国际分销并提供本地维护。这种间接上市结构使公司面临分销商集中度和利润分成风险。此外，海外客户扩张正面临新的法律摩擦：2025 年 7 月，Arbor Systems LLC 在德州东区对
              KEENON Robotics 提起专利侵权诉讼，送达程序持续至 2026 年 8 月。该知识产权争议在美国这一战略市场带来了客户采购犹豫、潜在排除令或特许权使用费负担的实际风险。
