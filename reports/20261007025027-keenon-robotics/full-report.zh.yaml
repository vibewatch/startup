      - number: '8.3'
        title: 退出准备度、机构立场与尽调指令
        blocks:
          - type: paragraph
            body: >-
              从机构投资评估角度看，Keenon Robotics 的退出准备度参差不齐。支撑未来流动性事件的首要结构性优势，是其无可匹敌的市场覆盖：累计出货量超过 100,000
              台，在美国、荷兰、日本、韩国和香港设有成熟的分销枢纽，并获得 SoftBank Vision Fund 2 的一线资本支持 [CV001] [CV003] [CV004]。鉴于 SoftBank 通常采用 5 至
              7
              年的基金生命周期，股东要求实现流动性事件或进行战略性资本重组的压力正在上升。然而，财务报告完全不透明、缺少经审计的现金流量表，以及总部位于中国的自主系统在西方商业环境运营所面临的地缘政治摩擦，严重削弱了其上市准备度
              [CV008] [CV011]。在中国境内上市或赴港 IPO，是最可行的公开市场流动性路径；西方市场上市则要面对严格的外国合规门槛。


              因此，整体投资建议定为“track”（research-more），估值判断为“unknown”，风险评级为“high”。在以下四项强制尽调关口通过前，机构资本不得为二级交易或股权参与定价：（1）提供
              FY2024 至 FY2026 经审计的资产负债表、现金流明细和毛利率勾稽表；（2）核实现金续航和债务融资额度，排除近期资不抵债风险；（3）对 Arbor Systems
              在美国得克萨斯东区提出的专利侵权风险进行独立法律评估；（4）拆分经常性 RaaS 订阅收入与分销商一次性硬件出货收入 [CV008] [CV011] [CV014] [CV016]。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 估值锚定困境
            body: >-
              Keenon 的 $1.0B 投后估值是在 2021 年 9 月、风险投资空前繁荣期间确定的。自 2021 年以来，同业估值倍数已下跌 40% 至
              60%，且五年内没有宣布新的公开股权融资轮次。因此，机构投资者不能把 $1.0B 独角兽估值视为当前有效的估值标记，而应将其视为面临严重下轮融资风险的历史上限 [CV001] [CV008] [CV012]。
            calloutType: insight
            claimRefs:
              - CV001
              - CV008
              - CV012
          - type: callout
            title: 知识产权诉讼脆弱性
            body: >-
              Arbor Systems LLC 在美国得克萨斯东区提起的专利侵权诉讼（2:25-cv-00678），给 Keenon 的美国收入管线带来实质性下行风险。如果原告取得禁令救济或获得大额许可费，Keenon
              的美国分销商合作关系可能遭遇严重的商业和财务冲击 [CV014] [CV015] [CV016]。
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
              - CV016
