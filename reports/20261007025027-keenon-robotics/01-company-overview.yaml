callouts:
  - calloutType: "insight"
    title: "Capitalization Horizon and Funding Drought"
    body: "Although Keenon Robotics commands industry-leading shipment scale and significant market share in catering service robots, the company has operated without announced primary equity funding since its September 2021 Series D round. Given the capital intensity of global hardware deployment, the absence of fresh capital disclosures raises questions regarding operational cash runway and organic profitability [CO007] [CO011]."
    claimRefs:
      - "CO007"
      - "CO011"
  - calloutType: "risk"
    title: "U.S. Patent Infringement Exposure"
    body: "Active litigation initiated by Arbor Systems LLC in the Eastern District of Texas (2:25-cv-00678) presents ongoing intellectual property vulnerability in the key U.S. market. With formal service proceedings active as of August 2026, the dispute could impose defense expenses, licensing demands, or commercial distribution headwinds for Keenon's American operating subsidiaries [CO015] [CO016]."
    claimRefs:
      - "CO015"
      - "CO016"
