figures:
  - id: "FI001"
    title: "Revenue-to-gross-profit evidence bridge"
    type: "flow"
    summary: "The public evidence identifies possible monetization routes and cost buckets but leaves mix, pricing, and gross profit unquantified."
    data:
      nodes:
        - id: "customer-contract"
          label: "Customer contract"
          description: "Direct enterprise or distributor-mediated route; public contract terms unavailable"
        - id: "equipment-sale"
          label: "Equipment sale"
          description: "Primary stream according to the third-party business-model page"
        - id: "raas"
          label: "RaaS subscription"
          description: "Monthly alternative listed publicly; adoption, term, and asset ownership unavailable"
        - id: "service-addons"
          label: "Software, service, and parts"
          description: "Listed recurring or installed-base-linked streams; attach rates unavailable"
        - id: "reported-revenue"
          label: "Reported revenue"
          description: "Public figures conflict between a $139M 2025 estimate and a $797.1M unspecified-period profile value"
        - id: "manufacturing-costs"
          label: "Manufacturing and inventory"
          description: "Cost category identified, but bill of materials and working-capital data unavailable"
        - id: "operating-costs"
          label: "R&D, cloud, compliance, sales, and support"
          description: "Cost categories identified, but no public allocation or service-cost data"
        - id: "gross-profit"
          label: "Gross profit and cash conversion"
          description: "Not derivable without revenue mix, realized pricing, COGS, working capital, and capex"
      edges:
        - from: "customer-contract"
          to: "equipment-sale"
          label: "purchase route"
        - from: "customer-contract"
          to: "raas"
          label: "subscription route"
        - from: "customer-contract"
          to: "service-addons"
          label: "add-on route"
        - from: "equipment-sale"
          to: "reported-revenue"
        - from: "raas"
          to: "reported-revenue"
        - from: "service-addons"
          to: "reported-revenue"
        - from: "reported-revenue"
          to: "gross-profit"
        - from: "manufacturing-costs"
          to: "gross-profit"
        - from: "operating-costs"
          to: "gross-profit"
    approximationNotes: "Conceptual bridge only; node widths and edge order do not represent revenue mix, conversion rates, or margin because those quantities are not public in the assigned evidence."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI008"
      - "CI015"
