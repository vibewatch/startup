company:
  name: "Keenon Robotics"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a multi-stream model led by robot sales, with possible RaaS, software, service, and accessory revenue, but it does not disclose mix, realized pricing, margins, or cash generation. The only public top-line figures in the assigned evidence are conflicting third-party reports, so audited financials and a current liquidity bridge remain prerequisites to underwriting."
sections:
  - id: "revenue-quality"
    title: "Revenue evidence is directionally useful, not underwritable"
    body: >-
      The clearest public description of Keenon's monetization is a third-party business-model page that calls
      direct robot sales the primary stream and also lists RaaS subscriptions, cloud fleet-management licensing,
      maintenance, spare parts, customization, and enterprise deals. This supports a hybrid hardware-and-services
      model, but not the contribution, contract duration, renewal rate, or gross margin of any stream. Company-issued
      material reports more than 100,000 units shipped across more than 60 countries, which indicates manufacturing
      and distribution reach but is a cumulative shipment measure rather than current-period revenue, installed
      active fleet, utilization, or recurring revenue. Public top-line figures are not reconcilable: GetLatka labels
      $139 million as estimated 2025 annual revenue, while two AskCyborg pages display $797.1 million without a stated
      fiscal period or audited reconciliation. Neither figure should be treated as ARR, and the difference is too
      large to use either as a valuation anchor without source documentation.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
      - "CI006"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "go-to-market-and-cost-base"
    title: "Channel breadth expands reach while obscuring economics"
    body: >-
      The available business-model evidence describes both direct enterprise sales and an international distributor
      network, while Keenon's presentation claims engineers in more than 12 regions, rapid support response, and
      warranties of up to 48 months. Those operating commitments imply meaningful deployment and after-sales work,
      but the evidence does not show who bears installation, warranty, inventory, receivables, or field-service
      costs under distributor contracts. The same third-party model identifies manufacturing, research and
      development, cloud infrastructure, regulatory compliance, sales, and support as cost categories. That is a
      credible cost map, not a quantified cost structure. No public CAC, sales-cycle, payback, channel take-rate,
      bill-of-materials cost, warranty reserve, working-capital cycle, or capex schedule appears in the assigned
      evidence. Consequently, apparent global scale cannot be translated into sales efficiency or contribution
      margin, and list versus realized pricing remains an explicit diligence gap rather than an estimate.
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI015"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy"
    title: "Historical funding does not establish current liquidity"
    body: >-
      GetLatka reports $200 million raised in a 2021 Series D and a $1 billion valuation, while a separate private-
      company registry places its latest valuation at $1 billion in December 2021. These are historical financing
      markers, not evidence of cash available on October 7, 2026. The assigned sources provide no audited balance
      sheet, cash-flow statement, debt schedule, monthly burn, runway, receivables aging, inventory position,
      restricted cash, or next-round trigger. AInvest explicitly notes that the private company does not publish a
      full profit-and-loss statement and frames the business as still exposed to a low-margin hardware trap. Funding
      raised must therefore remain separate from cash on hand and accounting profitability. A current capital-
      adequacy view requires a bridge from the last financing through operating cash use, capex, working capital,
      debt, and any undisclosed subsequent financing; none can be derived responsibly from the public pool.
    claimRefs:
      - "CI007"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial verdict: evidence supports commercial activity, not a margin thesis"
    body: >-
      The investable interpretation is narrower than the commercial narrative. Keenon appears to have several
      potential revenue levers and substantial cumulative shipment reach, but public evidence does not establish
      revenue quality, recurring mix, retention, pricing power, gross margin, or free-cash-flow conversion. The
      divergence between the $139 million estimate and $797.1 million profile figure is itself a warning about
      private-company data quality. Legal records add a contingent-cost diligence item: Arbor Systems filed a patent
      infringement complaint in July 2025, and docket mirrors show service-related activity in August 2026, but the
      assigned evidence provides no damages estimate or outcome. The underwriting posture is therefore
      information-constrained: require audited statements, revenue recognition and cohort schedules, channel
      contracts, unit-level contribution economics, and a current liquidity plan before assigning a revenue multiple
      or concluding that recurring software and service income can offset hardware, support, and working-capital
      intensity.
    claimRefs:
      - "CI009"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
