company:
  name: "Keenon Robotics"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Keenon sells a broad service-robot portfolio for delivery, cleaning, hotel, and heavy-load workflows, with product materials describing a sensor-fusion autonomy stack and local/offline control. Public evidence is strongest for product specifications and partner-led deployment, while independent reliability, security, certification, and developer-surface evidence remains thin; a 2025 patent complaint adds unresolved IP risk without establishing liability."
sections:
  - id: "portfolio-and-workflows"
    title: "Portfolio Organized Around Commercial Workflows"
    body: "Keenon's public portfolio is organized around repetitive indoor work rather than a single general-purpose platform. Company material maps DINERBOT and BUTLERBOT units to restaurant and hotel delivery, KLEENBOT units to commercial cleaning, and S-series units to material transport; reseller material also lists XMAN humanoids and the KEENMOW mower. The clearest directly specified asset in the assigned evidence is the S300: Keenon claims a 300 kg payload, a lifting platform, and support for loop, direct, multi-point, and transport modes. The breadth creates cross-sell potential, but buyers still need model-level field reliability, realized labor savings, and lifecycle-cost data before treating portfolio breadth as proven operating leverage."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "autonomy-and-system-architecture"
    title: "Autonomy Stack and System Dependencies"
    body: "The disclosed architecture combines sensing, on-device decision-making, motion control, and venue integration. Keenon's S300 page says LiDAR SLAM and stereo vision are fused for obstacle avoidance and route replanning, while path planning and task execution can continue without a central controller or external Wi-Fi or 5G. A company brochure adds multi-camera fusion, NeRF-based reconstruction, dynamic-environment perception, and motion control to the claimed technology stack. These disclosures support a coherent architecture map, not an independent performance benchmark: latency, localization error, intervention frequency, cybersecurity controls, and behavior under reflective, crowded, or degraded-sensor conditions are not quantified in the retained evidence."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-and-support"
    title: "Deployment, Integration, and Support Maturity"
    body: "Deployment evidence is partner-led and should be read as early commercialization proof rather than a completed rollout. YY Group reported that select-client pilots had begun in Singapore and Malaysia, with its technicians responsible for integration and with both on-demand and capital-ownership models contemplated. Keenon separately claims that S300 setup can be reduced from a traditional three-to-six-month process to one day without magnetic tape or QR-code changes. The company brochure also advertises 30-minute online response, four-hour solutions, and warranties of up to 48 months. Those are useful service commitments, but the evidence does not provide uptime, mean time between failures, first-time-fix rates, or pilot-to-production conversion."
    claimRefs:
      - "CE007"
      - "CE010"
      - "CE011"
      - "CE012"
  - id: "differentiation-trust-and-risk"
    title: "Differentiation, Trust Controls, and Technical Risk"
    body: "Keenon's differentiation thesis is a full workflow stack: specialized hardware, local autonomy, venue integration, fleet management, and local channel support. GreatRobot, an explicitly identified technology partner, describes cloud fleet and task management plus onboarding and customization, providing a practitioner-channel signal but not an independent benchmark. Trust evidence is similarly issuer-dependent: Keenon's brochure says Keenon Cloud earned GDPR certification in 2023, while GreatRobot says the products it offers comply with EU safety standards. Neither source supplies certificates or audit scope. Separately, court records show that Arbor Systems filed a patent-infringement complaint in July 2025; the filing is an allegation, not a finding, and the retained docket evidence does not resolve merits or outcome."
    claimRefs:
      - "CE009"
      - "CE013"
      - "CE014"
