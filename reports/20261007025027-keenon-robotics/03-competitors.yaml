company:
  name: Keenon Robotics
chapter:
  number: 3
  title: Competitors
  summary: >-
    The assigned evidence places Keenon among direct restaurant and hospitality robot
    peers such as Bear Robotics, Pudu Robotics, and Richtech Robotics, while also
    showing adjacent pressure from kitchen, consumer-cleaning, warehouse, and humanoid
    robotics vendors. Keenon's reported product breadth and scale are potentially
    differentiating, but the available comparisons do not establish pricing, channel
    economics, switching costs, or independently benchmarked performance, and an active
    U.S. patent case adds a separate execution risk.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and buyer alternatives
    body: >-
      The assigned 2026 alternative list is broad rather than a clean peer set. It
      identifies Bear Robotics, Pudu Robotics, and Richtech Robotics as the closest
      restaurant or hospitality service-robot alternatives, while Miso Robotics
      automates a narrower kitchen workflow. It also includes consumer-cleaning
      companies Roborock and Ecovacs, warehouse-AMR provider Geek+, and humanoid or
      general-robotics vendors such as Unitree. Those adjacencies matter because they
      represent potential technology or distribution entrants, but the source does not
      demonstrate that they currently compete for the same budgets. Manual service,
      conventional carts, and internal development remain buyer alternatives in
      principle; the assigned pool contains no measured cost or adoption evidence for
      them, so they are treated as unresolved rather than scored as proven competitors.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-scale-and-pricing
    title: Capability, scale, and pricing evidence
    body: >-
      A third-party brand profile reports that Keenon has about 40% of the global food
      delivery robot market, more than 100,000 deployed service robots, and presence in
      more than 70 countries. The same profile describes a portfolio spanning DinerBot
      restaurant delivery and Kleenbot cleaning products. These figures indicate a
      possible scale and breadth advantage, but they are not corroborated here by a
      filing, customer census, or independent market-share study. GetLatka separately
      reports $139 million of revenue and a $1 billion valuation, without a measurement
      period or disclosed methodology; neither figure is treated as ARR, current
      valuation, or verified financial performance. The fetched commercial comparison
      pages do not provide enough usable model-level pricing or contract detail to
      compare total cost of ownership.
    claimRefs: [CP006, CP007, CP008, CP009, CP011, CP012, CP013, CP014]
    tableRefs: [TP002, TP003]
  - id: distribution-lock-in-and-moat
    title: Distribution, lock-in, and moat durability
    body: >-
      Product breadth may help Keenon sell multiple robot types into a shared account,
      but the assigned evidence does not establish that breadth creates durable lock-in.
      No retained source supplies reseller margins, channel exclusivity, support-level
      agreements, integration depth, fleet-management migration costs, renewal rates,
      or evidence that customers cannot multi-home across vendors. The comparison
      sources therefore support a category map, not a performance benchmark or moat
      conclusion. Keenon's reported 2026 expansion into a humanoid and an autonomous
      lawn mower could widen its addressable workflows, but it could also increase
      execution complexity. Underwriting should treat installed-base scale and portfolio
      breadth as hypotheses to test against customer references and contract data rather
      than as demonstrated pricing power.
    claimRefs: [CP006, CP009, CP010, CP014, CP015]
  - id: adverse-evidence-and-implications
    title: Adverse evidence and investment implications
    body: >-
      U.S. docket sources record a patent-infringement complaint filed against Keenon in
      the Eastern District of Texas on July 2, 2025, followed by service-related activity
      in August 2026. A complaint is an allegation, not a finding of infringement, and
      the assigned evidence does not establish merits, damages exposure, settlement
      probability, or product-specific impact. Even so, the live proceeding is relevant
      to competitive durability because intellectual-property disputes can affect
      product roadmaps, distribution confidence, and legal cost. The investment view is
      therefore conditional: Keenon appears broader and possibly larger than several
      named restaurant peers, but evidence quality is insufficient to conclude that the
      company has a durable cost, technology, channel, or switching-cost moat.
    claimRefs: [CP002, CP006, CP010, CP015, CP016]
