figures:
  - id: FP001
    title: Competitive positioning map — workflow overlap versus portfolio breadth
    type: quadrant
    summary: >-
      Ordinal analyst coding separates same-workflow restaurant peers from adjacent
      automation companies while showing Keenon's reported portfolio breadth.
    data:
      points:
        - label: Keenon Robotics
          x: 5
          y: 5
          detail: Same-job service robotics with reported delivery, cleaning, humanoid, and lawn products.
        - label: Bear Robotics
          x: 5
          y: 2
          detail: Same restaurant serving, bussing, and food-running workflow; broader scope not evidenced.
        - label: Pudu Robotics
          x: 5
          y: 4
          detail: Same commercial delivery and cleaning categories with hospitality overlap.
        - label: Richtech Robotics
          x: 4
          y: 3
          detail: Hospitality, food-service, and retail task overlap at category level.
        - label: Miso Robotics
          x: 3
          y: 2
          detail: Adjacent restaurant budget with kitchen rather than delivery automation.
        - label: Consumer cleaning vendors
          x: 1
          y: 3
          detail: Roborock and Ecovacs are adjacent cleaning-robot entrants, not proven direct peers.
    approximationNotes: >-
      Both axes use analyst-assigned ordinal scores from 1 to 5, not measured market
      data: x is same-workflow overlap and y is described portfolio breadth. Scores are
      based only on category and product descriptions in the retained sources and do
      not represent performance, market share, or valuation.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP010]
callouts:
  - calloutType: recommendation
    title: Treat breadth as a diligence hypothesis, not a proven moat
    body: >-
      Prioritize comparable customer references, current transaction-level pricing,
      fleet migration evidence, channel economics, and counsel review of the patent
      matter before underwriting durable differentiation.
    claimRefs: [CP006, CP014, CP015, CP016]
