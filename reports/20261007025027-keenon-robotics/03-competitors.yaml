  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: >-
        Customer-level renewal, multi-homing, fleet migration, integration, and
        decommissioning evidence across Keenon and direct peers.
      whyItMatters: >-
        Without customer behavior and migration costs, product breadth cannot be
        translated into durable retention or pricing power.
      diligencePath: >-
        Interview reference customers using mixed fleets and obtain renewal cohorts,
        integration maps, migration timelines, and decommissioning costs.
      relatedQuestionRefs: [QP006]
    - type: enumeration-incomplete
      severity: material
      topic: status-quo-substitutes
      missingEvidence: >-
        Comparable economics for manual service, conventional carts, internal
        development, and likely adjacent entrants.
      whyItMatters: >-
        A vendor-only peer set can overstate the addressable competitive advantage and
        omit the buyer's lowest-cost alternatives.
      diligencePath: >-
        Build a buyer-level total-cost model from labor, equipment, integration,
        maintenance, utilization, and support data for each alternative class.
      relatedQuestionRefs: [QP010]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: pricing-gap
      missingEvidence: >-
        Current transaction-level prices, RaaS terms, discounts, maintenance, and
        support packages for Keenon and direct peers.
      whyItMatters: >-
        List-price headlines cannot establish realized pricing, buyer ROI, or gross
        margin implications.
      diligencePath: >-
        Obtain dated distributor quotes and executed customer contracts normalized by
        model, geography, service level, and term.
      relatedQuestionRefs: [QP004, QP005]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: patent-litigation
      missingEvidence: >-
        Patent-by-patent claim analysis, responsive pleadings, asserted-product mapping,
        damages theories, and counsel's probability-weighted exposure estimate.
      whyItMatters: >-
        Docket existence establishes procedural risk but not infringement, damages, or
        likely product restrictions.
      diligencePath: >-
        Have U.S. patent counsel review the complaint, asserted patents, service status,
        responsive filings, and product mapping before investment approval.
      relatedQuestionRefs: [QP007]
