callouts:
  - calloutType: "insight"
    title: "Valuation Anchoring Dilemma"
    body: "Keenon's $1.0B post-money valuation was established in September 2021 during an unprecedented venture capital boom. With peer multiples down 40% to 60% since 2021 and no new public equity rounds announced in five years, institutional investors cannot treat the $1.0B unicorn figure as an active mark, but rather as a historical ceiling subject to severe down-round risk [CV001] [CV008] [CV012]."
    claimRefs:
      - "CV001"
      - "CV008"
      - "CV012"
  - calloutType: "risk"
    title: "Intellectual Property Litigation Vulnerability"
    body: "The patent infringement lawsuit filed by Arbor Systems LLC in the Eastern District of Texas (2:25-cv-00678) creates tangible downside risk for Keenon's U.S. revenue pipeline. If the plaintiff secures injunctive relief or substantial licensing royalties, Keenon's American distributor partnerships could face severe commercial and financial disruption [CV014] [CV015] [CV016]."
    claimRefs:
      - "CV014"
      - "CV015"
      - "CV016"
