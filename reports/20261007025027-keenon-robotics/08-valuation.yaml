    figureRefs:
      - "FV001"
  - id: "exit-readiness-and-diligence-path"
    title: "Exit Readiness, Institutional Stance, and Diligence Directives"
    body: "From an institutional underwriting perspective, Keenon Robotics demonstrates mixed exit readiness. The primary structural advantage favoring an eventual liquidity event is its unrivaled market footprint: commanding over 100,000 cumulative unit shipments, established distribution hubs across the U.S., Netherlands, Japan, South Korea, and Hong Kong, and tier-one backing from SoftBank Vision Fund 2 [CV001] [CV003] [CV004]. Given SoftBank's typical 5-to-7 year fund lifecycle, shareholder pressure for a liquidity event or strategic recapitalization is escalating. However, public listing readiness remains critically compromised by total financial reporting opacity, the lack of audited cash flow statements, and geopolitical friction surrounding Chinese-headquartered autonomous systems operating in Western commercial environments [CV008] [CV011]. A domestic Chinese listing or a Hong Kong IPO represents the most plausible public liquidity avenue, whereas a Western listing faces stringent foreign compliance hurdles.\n\nConsequently, the overall investment recommendation is designated as 'track' (research-more), with an 'unknown' valuation stance and a 'high' risk rating. Institutional capital must refrain from pricing secondary transactions or equity participation until four mandatory diligence gates are cleared: (1) delivery of audited balance sheets, cash flow schedules, and gross margin reconciliations for FY2024 through FY2026; (2) verification of cash runway and debt facilities to rule out near-term insolvency; (3) independent legal assessment of the Arbor Systems patent infringement exposure in the Eastern District of Texas; and (4) breakdown of recurring RaaS subscription revenue versus one-off distributor hardware shipments [CV008] [CV011] [CV014] [CV016]."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV008"
      - "CV011"
      - "CV014"
      - "CV016"
