  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Investment Pillar"
      - "Thesis Argument"
      - "Anti-Thesis Counter-Argument"
      - "What Would Change the View"
    rows:
      - - "Market Scale & Leadership"
        - "Uncontested global shipment leadership with over 100,000 commercial robots deployed across 60+ countries and key global hubs."
        - "Low switching costs and rapid hardware commoditization by rival Chinese and Asian robotic manufacturers eroding pricing power."
        - "Demonstrated multi-year fleet contract renewals, expansion of recurring RaaS take-rates, and certified gross margins exceeding 50%."
      - - "Embodied AI & Software Innovation"
        - "Proprietary KOM 2.0 VLA architecture and XMAN humanoid series position Keenon to capture high-margin software automation workflows."
        - "Humanoid and VLA models remain early-stage marketing demonstrations without verified enterprise revenue contribution or gross margin uplift."
        - "Customer telemetry demonstrating autonomous task completion, paid KOM 2.0 software license renewals, and enterprise humanoid deployments."
      - - "Capitalization & Valuation Support"
        - "Anchored by a $200M Series D led by SoftBank Vision Fund 2 at a $1.0B post-money valuation, validating enterprise pedigree."
        - "Five-year funding hiatus since September 2021; peak 2021 multiples are obsolete, creating acute risk of a severe down-round."
        - "Confirmation of a clean growth financing round or audited NAV mark from SoftBank maintaining or exceeding the $1.0B valuation."
      - - "Legal & Intellectual Property Posture"
        - "Strong domestic manufacturing know-how and defensive global IP portfolio covering service robot navigation and chassis engineering."
        - "Active patent infringement litigation in the U.S. (Arbor Systems LLC v. Keenon, 2:25-cv-00678) threatening core North American distribution."
        - "Dismissal with prejudice of Arbor Systems patent claims, a favorable non-infringement ruling, or a de minimis cross-licensing settlement."
    notes: "Thesis and anti-thesis synthesis weighs verified commercial operational strengths against unresolved financial and intellectual property risks."
