- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty or resource
  - Role
  - Concentration evidence
  - Failure scenario / severity
  - Mitigation and residual exposure
  rows:
  - - Transaction and sponsor support
    - KKR
    - Capital provider and backer of combined-company growth
    - $410 million 2022 funding disclosed; current cash availability and leverage not disclosed
    - Strategy, financing, or exit priorities diverge / high
    - Request cap table, debt, liquidity, board rights, budget, and sponsor exit expectations
  - - Merger completion and integration
    - Synack
    - Adds talent, continuous validation, platform capabilities, and customers
    - Definitive merger announced; closing was conditional
    - Close delay or integration underperformance / high
    - Require closing evidence, synergy ownership, retention plan, and integration scorecard
  - - Specialist delivery capacity
    - Offensive-security professionals
    - Human judgment, validation, and engagement delivery
    - Public metrics are differently dated and do not show utilization
    - Attrition or demand spikes lengthen delivery / high
    - Review bench depth, attrition, subcontractor use, utilization, and capacity forecast
  - - Workflow ecosystem
    - Jira, ServiceNow, AWS, Qualys, scanners, CMDBs, and ticketing systems
    - Procurement, data exchange, and remediation workflow integration
    - Numerous integrations disclosed; dependency shares are not public
    - Connector change or outage impairs workflow / medium
    - Review API ownership, support SLAs, compatibility testing, and fallback export paths
  notes: The sources identify dependency mechanisms but do not disclose revenue concentration, integration usage shares, current
    liquidity, or contractual protections; those values remain explicit gaps.
