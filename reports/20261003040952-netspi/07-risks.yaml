  rows:
  - - Synack merger closing approvals
    - United States and any other applicable review jurisdictions
    - Announced September 2, 2026; expected October close remained conditional
    - Pending event / high impact if delayed or blocked
    - Company promised continuity and said KKR would support the combined growth plan
    - Obtain closing certificate, approval list, conditions, integration plan, and customer communications
  - - Privacy and customer-data obligations
    - Customer-dependent; potentially GDPR, HIPAA, and sector regimes
    - NetSPI describes sensitive vendor data flows generally; company-specific controls were not retained
    - Unknown likelihood / high impact if controls fail
    - Public guidance advocates independent, continuous testing and transparent reporting
    - Review DPA, subprocessors, data flows, insurance, audit reports, and incident-response records
  - - Security and resilience obligations
    - Customer-dependent; potentially PCI DSS, DORA, and NIS2
    - Public guidance names these frameworks; applicability and assurance scope remain unverified
    - Unknown likelihood / medium-to-high commercial impact
    - NetSPI markets standards-aligned testing and continuous validation
    - Inspect certification scope, exceptions, regulator correspondence, and contractual liability caps
  notes: Sample of material legal and regulatory diligence issues surfaced by the assigned sources; likelihood labels are
    directional analyst assessments, and no retained source establishes a NetSPI violation.
  enumerationScope:
