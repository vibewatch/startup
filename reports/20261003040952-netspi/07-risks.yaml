    - High for time-sensitive customers
    - Training and expanded combined talent bench are described
    - Track utilization, time-to-start, time-to-report, retest queue, and senior-tester attrition
  - - Multi-module platform integration creates workflow or reporting friction
    - PTaaS, ASM, BAS, and multiple third-party integrations are being unified
    - Medium
    - Medium-to-high
    - Unified platform and telemetry architecture are disclosed
    - Track connector defects, release incidents, adoption by module, and remediation backlog
  - - AI-driven threat and testing change outpaces product controls
    - Company commentary expects more AI-enabled social engineering and promotes AI testing research
    - Medium
    - Medium
    - Active research and AI-assisted platform development are visible
    - Track benchmark performance, false negatives, expert review rates, and customer loss reasons
