- id: TI002
  title: Pricing and go-to-market evidence
  columns:
  - Commercial element
  - Public evidence
  - What is not established
  - Underwriting implication
  - Diligence ask
  rows:
  - - Public rate card
    - Comparison publisher reports no published SKU pricing
    - List prices, realized prices, and discount levels
    - Public evidence cannot establish pricing power
    - Obtain SKU catalog and invoice-level net pricing
  - - Contract structure
    - Custom enterprise contracts, annual PTaaS, and one-time projects are reported
    - Minimum term, included hours, overages, and cancellation rights
    - Revenue recurrence cannot be inferred from product labels
    - Review representative contracts and revenue-recognition memos
  - - Land and expand
    - Company release quotes one customer expanding from penetration testing
    - Conversion rate, attach rate, expansion ARR, and NRR
    - Anecdotal expansion supports a hypothesis, not a cohort conclusion
    - Provide product-level cohort and cross-sell data
  - - Sales efficiency
    - No CAC, payback, sales-cycle, or quota-productivity metric retained
    - Acquisition efficiency and capacity constraints
    - No public basis for a sales-efficiency benchmark
    - Provide fully loaded CAC, payback, pipeline conversion, and rep ramp
  notes: The RFP.wiki comparison is adverse pricing-transparency evidence, not an independent benchmark; all quantitative
    commercial terms remain unknown.
