- id: TI003
  title: Unit economics and capital-adequacy ledger
  columns:
  - Metric
  - Public value
  - Confidence
  - Why it matters
  - Specific diligence request
  rows:
  - - Historical revenue growth
    - Fivefold over five years; >50% organic in 2021; 61% in 2022 to date
    - Medium; company-originated and historical
    - Shows prior momentum, not current scale or durability
    - Provide audited annual revenue from 2021 through 2026 and bridge organic versus acquired growth
  - - Gross margin
    - null
    - Unavailable
    - Determines whether automation offsets specialist delivery cost
    - Provide GAAP gross margin and COGS split for labor, hosting, contractors, and retesting
  - - CAC payback and NRR
    - null
    - Unavailable
    - Tests sales efficiency and recurring revenue quality
    - Provide segment CAC, payback, GRR, NRR, logo churn, and expansion ARR
  - - Cumulative funding raised
    - $500 million reported by October 2022
    - High for historical amount; not current cash
    - Shows sponsor support but cannot establish runway
    - Provide current cash, debt, preferred terms, recapitalization flows, burn, and runway
  notes: Null means the assigned public evidence contains no supportable value; cumulative funding raised must not be interpreted
    as cash available after the 2022 recapitalization.
