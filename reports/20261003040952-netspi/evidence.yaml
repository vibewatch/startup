evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete executive directory and organizational hierarchy below the C-suite, including divisional SVPs and
      regional managing directors.
    whyItMatters: >-
      Identifies functional bench depth, succession planning resilience, and operational management coverage across
      global delivery hubs.
    diligencePath: Request confidential management organizational chart and executive compensation roster during sponsor diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements confirming revenue breakdown, gross margin percentage, Net Revenue Retention (NRR),
      and operating cash flow.
    whyItMatters: >-
      Essential for verifying financial resilience, unit economics, and recurring subscription margin profiles prior to
      final valuation.
    diligencePath: >-
      Request confidential sell-side financial package or audited management reporting under non-disclosure agreement
      during formal diligence.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Independent, boundary-matched market estimates or sufficient bottom-up inputs for TAM, SAM, and SOM.
    whyItMatters: >-
      Without consistent geography, category, period, and methodology, company growth and customer reach cannot be
      converted into market size or obtainable share.
    diligencePath: >-
      Obtain current analyst market studies and triangulate them against target-account counts, product eligibility,
      geography, and pricing.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Current contract values, pricing, sales-cycle length, win rates, renewal, cross-sell, and revenue mix by product,
      geography, and buyer segment.
    whyItMatters: >-
      These inputs determine whether enterprise demand converts into a serviceable market and whether the platform can
      capture it profitably.
    diligencePath: >-
      Request management cohort data, bookings and renewal schedules, product attach rates, capacity utilization, and
      anonymized contract distributions.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM004
    relatedTableRefs:
      - TM002
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segmentation
    missingEvidence: A complete buyer and payer map validated across industries, company sizes, and regions.
    whyItMatters: >-
      Reviewer roles show workflow participation but do not establish purchase authority, budget source, or segment
      prevalence.
    diligencePath: Interview customers and review CRM opportunity roles, procurement records, and segment-specific sales materials.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: current-traction
    missingEvidence: >-
      Audited 2023-2026 revenue, ARR where contractually appropriate, organic growth, revenue mix, and customer-cohort
      schedules.
    whyItMatters: Historical 2021-2022 growth cannot establish current scale, revenue quality, or durability.
    diligencePath: >-
      Obtain audited financial statements, monthly recurring-revenue bridges, and product and service revenue schedules
      from management.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by delivery type, tester utilization, CAC, CAC payback, GRR, NRR, logo churn, and contribution
      margin.
    whyItMatters: >-
      These metrics determine whether platform leverage offsets expert-delivery costs and whether recurring contracts
      compound efficiently.
    diligencePath: >-
      Review cost-center P&Ls, delivery-capacity data, invoice cohorts, renewal schedules, and sales-efficiency
      reporting.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, free cash flow, debt, covenants, preferred terms, recapitalization proceeds retained
      by the company, and forward runway.
    whyItMatters: Funding raised in 2022 does not establish present liquidity or financing dependence.
    diligencePath: >-
      Obtain the current balance sheet, cash-flow statement, debt agreements, capitalization table, and a monthly runway
      forecast.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: platform-assurance
    missingEvidence: >-
      Independent uptime history, contractual SLA performance, production resilience design, tenant-isolation evidence,
      and a current platform control or certification inventory.
    whyItMatters: >-
      Customers place sensitive vulnerability and engagement data in the platform, so reliability and security
      assurances materially affect operational and concentration risk.
    diligencePath: >-
      Request the current security package, subprocessor list, architecture and data-flow diagrams, penetration-test
      summary, SOC reports or equivalent controls evidence, and 24-month incident and SLA history.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: automation-and-capacity
    missingEvidence: >-
      Module-level usage, automated versus human finding contribution, engagement turnaround distributions, tester
      utilization, and renewal outcomes for the unified platform.
    whyItMatters: >-
      These measures determine whether breadth translates into scalable software economics and durable customer outcomes
      rather than service-delivery complexity.
    diligencePath: >-
      Obtain product telemetry and cohort data by module, including active usage, findings validated, retest cycle time,
      delivery capacity, and renewal or expansion outcomes.
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract duration, cohort expansion, and top-customer revenue share with
      consistent periods and denominators.
    whyItMatters: >-
      Without cohort durability and concentration data, public segment breadth cannot establish recurring revenue
      quality or downside exposure.
    diligencePath: >-
      Request management's customer cohort schedules, renewal bridge, contract-duration distribution, and top-10 revenue
      concentration table for the latest twelve months.
    relatedQuestionRefs:
      - QU004
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A dated customer roster that distinguishes pilots, production deployments, active platform users, and lapsed
      relationships, with outcomes for each named account.
    whyItMatters: Cohort claims and logos cannot establish deployment quality, current usage, retention, or referenceability.
    diligencePath: >-
      Obtain the customer reference list and validate a sample through direct calls covering deployment scope, realized
      outcomes, renewal status, and expansion history.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: >-
      Verified NPS or CSAT results with survey date, respondent count, response rate, population, and customer-segment
      breakdown.
    whyItMatters: Small directory review samples cannot be generalized into customer satisfaction or retention.
    diligencePath: >-
      Request the latest customer survey instrument and raw response summary, then reconcile results with renewal and
      churn cohorts.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: regulatory-exposure
    missingEvidence: >-
      Primary regulator records, court dockets, certification scopes, security audit reports, incident notices, status
      history, and contractual liability terms specific to NetSPI.
    whyItMatters: >-
      Without primary records, the frequency and severity of legal, compliance, privacy, security, and
      service-continuity exposure cannot be underwritten.
    diligencePath: >-
      Obtain management's litigation and incident schedules, run regulator and court searches by legal entity, inspect
      SOC and ISO reports with exceptions, review the DPA and subprocessors, and reconcile status-page history to
      customer SLA credits.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Current audited revenue, recurring-revenue mix, gross margin, EBITDA, cash, debt, burn, working capital,
      retention, pricing realization, and customer concentration.
    whyItMatters: >-
      Historical funding and growth claims do not establish current liquidity, profitability, cash availability, revenue
      quality, or downside protection.
    diligencePath: >-
      Review audited statements, monthly management accounts, cash and debt schedules, cohort retention, contract-level
      pricing, pipeline conversion, and top-customer revenue with merger pro formas.
  - type: private-evidence-only
    severity: material
    topic: merger
    missingEvidence: >-
      Transaction closing evidence, integration milestones, synergy ownership, product migration plan, retention
      packages, and customer-continuity performance.
    whyItMatters: >-
      The merger is the leading near-term execution risk, but the announcement provides intent rather than proof of
      close or integration performance.
    diligencePath: >-
      Confirm legal close, inspect the integration management office scorecard, compare pre- and post-close SLA and
      retention metrics, and interview major customers and delivery leaders.
  - type: private-evidence-only
    severity: material
    topic: talent-capacity
    missingEvidence: >-
      Current tester headcount, seniority mix, utilization, attrition, subcontractor reliance, engagement backlog,
      time-to-start, time-to-report, retest cycle, and quality escape rate.
    whyItMatters: >-
      A human-delivered model can differentiate finding quality while also making growth and service levels sensitive to
      scarce specialist capacity.
    diligencePath: >-
      Obtain monthly workforce and delivery dashboards, reconcile capacity to bookings and backlog, and test retention
      and productivity assumptions by region and assessment type.
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A dated, business-model-matched set of public-company, private financing, and M&A valuation multiples with
      consistent revenue and margin definitions.
    whyItMatters: Without comparable valuation evidence, a numeric enterprise-value range would be false precision.
    diligencePath: >-
      Build a transaction and trading-comparable set after management provides normalized recurring revenue, services
      revenue, growth, and margin metrics.
    relatedQuestionRefs:
      - QV005
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted ownership, debt, liquidation preferences, transaction consideration, and dilution from the proposed
      Synack combination.
    whyItMatters: These terms determine value attributable to a new investor and can materially change downside and exit proceeds.
    diligencePath: Review the definitive merger agreement, capitalization table, debt schedule, and preference waterfall under NDA.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited stand-alone and pro forma revenue, recurring-revenue mix, gross margin, retention, customer concentration,
      cash, and normalized profitability.
    whyItMatters: The missing metrics prevent verification of quality, durability, and a model-appropriate valuation multiple.
    diligencePath: >-
      Obtain audited financial statements, cohort schedules, revenue-quality analysis, and a pro forma merger bridge
      from management and the sponsor.
