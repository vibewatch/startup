companyProfile:
  summary: >-
    NetSPI is a Minneapolis-based offensive cybersecurity company founded in 2001 and backed by KKR growth capital. Its
    core offer combines PTaaS, attack surface management, and breach and attack simulation with specialist human
    delivery, giving it a strong enterprise position across regulated industries and large technology buyers. The
    company agreed in September 2026 to merge with Synack, creating a larger combined offensive-security platform, but
    public evidence still leaves current revenue quality, margins, retention, and valuation opaque.
