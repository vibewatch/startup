- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Perspective
  - Evidence-based argument
  - What would change the view
  rows:
  - - 'Thesis: sponsor capacity'
    - KKR led the $90 million 2021 round and announced a further $410 million investment in 2022.
    - Unexpected sponsor withdrawal, restrictive senior claims, or evidence that the capital did not support the operating
      company.
  - - 'Thesis: historical growth'
    - The 2022 issuer release claimed fivefold revenue growth over five years and 61% growth in 2022 year to date.
    - Audited statements that fail to reconcile the claimed period, denominator, or organic growth.
  - - 'Thesis: platform breadth'
    - The 2024 issuer release described one platform spanning PTaaS, ASM, and BAS.
    - Evidence of limited cross-sell, low product adoption, or services delivery remaining operationally fragmented.
  - - 'Thesis: strategic scale'
    - The merger issuers described the combined company as having more than $200 million in revenue.
    - A failed closing or audited pro forma revenue materially below the issuer claim.
  - - 'Anti-thesis: no market-clearing price'
    - Forge displayed no price or post-money valuation and characterized activity as limited in July 2025.
    - A recent arm's-length secondary transaction, priced financing, or disclosed merger consideration.
  - - 'Anti-thesis: opaque economics'
    - Public materials do not provide audited margins, recurring-revenue mix, retention, debt, or preference terms.
    - A reconciled diligence package showing durable retention, attractive normalized margins, and an acceptable preference
      stack.
  notes: Company-issued growth, platform, and merger statements are not treated as independently verified operating results;
    Forge data is dated July 2025.
