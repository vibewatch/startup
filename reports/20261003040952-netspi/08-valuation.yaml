  evidenceGaps:
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: A dated, business-model-matched set of public-company, private financing, and M&A valuation multiples
      with consistent revenue and margin definitions.
    whyItMatters: Without comparable valuation evidence, a numeric enterprise-value range would be false precision.
    diligencePath: Build a transaction and trading-comparable set after management provides normalized recurring revenue,
      services revenue, growth, and margin metrics.
    relatedQuestionRefs:
    - QV005
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Fully diluted ownership, debt, liquidation preferences, transaction consideration, and dilution from
      the proposed Synack combination.
    whyItMatters: These terms determine value attributable to a new investor and can materially change downside and exit proceeds.
    diligencePath: Review the definitive merger agreement, capitalization table, debt schedule, and preference waterfall under
      NDA.
    relatedQuestionRefs:
    - QV007
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: Audited stand-alone and pro forma revenue, recurring-revenue mix, gross margin, retention, customer concentration,
      cash, and normalized profitability.
    whyItMatters: The missing metrics prevent verification of quality, durability, and a model-appropriate valuation multiple.
    diligencePath: Obtain audited financial statements, cohort schedules, revenue-quality analysis, and a pro forma merger
      bridge from management and the sponsor.
