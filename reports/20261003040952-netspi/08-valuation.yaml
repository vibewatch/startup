company:
  name: NetSPI
chapter:
  number: 8
  title: Valuation
  summary: NetSPI has documented sponsor backing and announced scale, including $90 million of growth funding in 2021, a further
    $410 million KKR investment in 2022, and a pending Synack combination described by the issuers as exceeding $200 million
    of revenue. Public evidence does not disclose a current equity value, transaction consideration, audited economics, or
    usable secondary price, so the appropriate stance is research-more rather than a precise valuation.
sections:
- id: financing-and-price-evidence
  title: Financing history is visible; present price is not
  body: 'NetSPI''s financing history demonstrates access to substantial growth capital but does not establish a current valuation.
    Goodwin, NetSPI, and SecurityWeek each documented the $90 million KKR-led round in 2021, while Crunchbase News and a NetSPI-issued
    release documented KKR''s additional $410 million investment in 2022 and the recapitalization of Sunstone Partners. Those
    amounts are financing flows, not an enterprise-value mark or cash balance. The assigned secondary-market evidence is also
    thin: Forge''s July 2025 page displayed no price or post-money valuation and characterized market activity as limited.
    Accordingly, public evidence supports sponsor capacity and historical capital formation, but it does not support a defensible
    entry price, target return, or precise valuation range as of the run date.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-and-anti-thesis
  title: Scale and platform breadth must be weighed against evidence quality
  body: 'The positive case rests on capital access, historical growth claims, a broader platform, and the announced Synack
    combination. NetSPI''s 2024 company release described a unified platform spanning penetration testing as a service, attack
    surface management, and breach and attack simulation, and said the platform drew on more than 250 pentesters and more
    than 20,000 engagements. The anti-thesis is equally important: those operating figures are company-issued, the 2022 growth
    figures are historical, and the transaction announcement provides combined revenue but not consideration, ownership, margins,
    retention, or stand-alone contribution. The merger therefore improves potential strategic scale while simultaneously making
    clean underwriting harder until closing, integration, and pro forma economics are verified.'
  claimRefs:
  - CV004
  - CV005
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  tableRefs:
  - TV002
- id: scenarios-and-entry-discipline
  title: Scenario logic should use diligence thresholds, not invented multiples
  body: 'The available pool cannot support numeric bull, base, or bear valuation ranges because it lacks current audited revenue,
    gross margin, recurring-revenue mix, retention, debt, cash, preference terms, transaction consideration, and a directly
    comparable public or private transaction set. A bull outcome requires the Synack transaction to close, the combined revenue
    claim to reconcile to audited statements, and integration to create measurable growth or margin benefits. The base case
    assumes closing and continuity but with uncertain synergy realization, while the bear case captures delay, failed closing,
    customer or talent disruption, and private-market illiquidity. Entry discipline should therefore be expressed as evidence
    conditions: do not underwrite a price until enterprise value, fully diluted ownership, preferences, and normalized operating
    metrics can be tested against a relevant comparable set.'
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  tableRefs:
  - TV003
- id: exit-readiness-and-final-asks
  title: The pending merger is a strategic milestone, not yet a liquidity event
  body: NetSPI and Synack announced a definitive merger agreement on September 2, 2026, with closing expected in October 2026
    subject to customary conditions and regulatory approvals. The announcement is relevant to exit readiness because it indicates
    sponsor-supported consolidation and a larger operating platform, but it neither confirms that closing occurred nor provides
    an investor liquidity price. The absence of a displayed Forge price further limits evidence of a realizable secondary
    exit. Final diligence should obtain the signed transaction economics, closing status, pro forma capitalization, debt and
    preference stack, audited revenue bridge, recurring-revenue and services mix, gross margin, retention, customer concentration,
    and an evidence-matched comparable set. A failed or materially delayed closing, unexplained revenue reconciliation, or
    unacceptable preference overhang would break the current thesis.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
