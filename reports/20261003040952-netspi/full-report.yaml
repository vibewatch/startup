  - id: FM001
    title: Evidence hierarchy for serviceable-market diligence
    type: pyramid
    summary: >-
      Six layers separate the addressable category boundary from company reach and the still unquantified obtainable
      market, preventing company metrics from being presented as TAM.
    data:
      items:
        - label: Broad category boundary
          value: PTaaS + ASM + BAS
          detail: Defined product boundary; broad cybersecurity spend is excluded.
        - label: Enterprise buyer universe
          value: Not quantified
          detail: Relevant buyers are security, application-security, product-security, compliance, and IT leaders.
        - label: Serviceable target accounts
          value: Not quantified
          detail: Requires geography, minimum contract value, technical fit, and account-count filters.
        - label: Demonstrated vertical reach
          value: 9 of top 10 U.S. banks
          detail: Company-issued 2025 claim; does not disclose spend or retention.
        - label: Delivery and adoption proof
          value: 501-1,000 employees; 13 G2 reviews
          detail: Different third-party proxies with non-comparable denominators.
        - label: Obtainable share
          value: Not disclosed
          detail: Requires current revenue, capacity, win rate, renewal, expansion, and pricing evidence.
    approximationNotes: >-
      This is a qualitative evidence hierarchy, not a proportional market-size pyramid; values use different units and
      no geometric area encodes magnitude.
