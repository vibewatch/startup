              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
              - CO013
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Implication of the Synack Merger
            body: >-
              The September 2026 merger between NetSPI and Synack represents a major consolidation in the offensive
              cybersecurity sector. Combining NetSPI's consultant-led PTaaS methodology with Synack's crowdsourced red
              team and agentic AI pentesting creates a combined platform of over $200 million in revenue, positioned to
              challenge legacy vulnerability scanners and fully autonomous penetration testing startups.
            calloutType: insight
            claimRefs:
              - CO005
              - CO007
          - type: callout
            title: Pricing Transparency and Private Valuation Opacity
            body: >-
              NetSPI relies on custom statement-of-work enterprise engagements and AWS Marketplace private offers rather
              than published catalog pricing, creating extended budget cycles for enterprise buyers. Under KKR's private
              equity control, exact gross margins, net retention, and operating profitability remain undisclosed,
              requiring diligence teams to verify unit economics directly via confidential management disclosures.
            calloutType: risk
            claimRefs:
