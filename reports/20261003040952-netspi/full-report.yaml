  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Merger closes; reported combined revenue reconciles; integration produces measurable growth or margin
          benefits; customer and talent retention remain strong.
        - >-
          Numeric range withheld until audited pro forma metrics and transaction terms permit an evidence-matched
          multiple and ownership return model.
        - Overpaying for unverified synergies; integration complexity; issuer-reported metrics do not reconcile.
        - Closing confirmation plus audited growth, margin, and retention improvement would increase likelihood.
      - - Base
        - >-
          Merger closes and operations remain stable, but synergy timing and software-versus-services economics remain
          uncertain.
        - >-
          Use a diligence-derived range only after normalizing revenue mix, debt, preferences, dilution, and relevant
          comparable metrics.
        - Slower integration; limited multiple expansion; continued secondary-market illiquidity.
        - Stable customer retention and a credible integration plan without verified margin expansion support this case.
      - - Bear
        - >-
          Closing is delayed or fails, integration disrupts customers or talent, growth decelerates, or sponsor terms
          subordinate new capital.
        - >-
          Assume material downside to any unsupported sponsor mark; do not assign a precise floor without debt,
          liquidation, and cash data.
        - Failed closing; revenue shortfall; preference overhang; no liquid exit; services-related margin pressure.
        - >-
          Regulatory delay, adverse closing updates, revenue reconciliation gaps, or unfavorable preference terms would
          increase likelihood.
    notes: >-
      Scenario outputs are qualitative because the assigned evidence does not provide the inputs needed for defensible
      valuation or return ranges.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
