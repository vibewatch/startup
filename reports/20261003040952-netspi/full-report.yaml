        - The merger issuers described the combined company as having more than $200 million in revenue.
        - A failed closing or audited pro forma revenue materially below the issuer claim.
      - - 'Anti-thesis: no market-clearing price'
        - Forge displayed no price or post-money valuation and characterized activity as limited in July 2025.
        - A recent arm's-length secondary transaction, priced financing, or disclosed merger consideration.
      - - 'Anti-thesis: opaque economics'
        - Public materials do not provide audited margins, recurring-revenue mix, retention, debt, or preference terms.
        - >-
          A reconciled diligence package showing durable retention, attractive normalized margins, and an acceptable
          preference stack.
    notes: >-
      Company-issued growth, platform, and merger statements are not treated as independently verified operating
      results; Forge data is dated July 2025.
    claimRefs:
      - CV001
      - CV003
      - CV004
