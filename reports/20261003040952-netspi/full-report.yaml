      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a buying committee rather than a single user. G2 reviewers identify
              application-security engineers, IT managers, compliance officers, fractional technology leaders, and
              enterprise practitioners as users or evaluators; the economic buyer is more likely a CISO or
              security-budget owner, but the assigned evidence does not establish budget ownership by segment. Adoption
              commonly begins with scoped penetration testing, then expands into a shared dashboard for findings,
              communication, retesting, and remediation tracking. One reviewer described easy initial setup and close
              coordination with testers, while G2 displayed implementation time below one month. These observations
              suggest that workflow integration and expert access can lower adoption friction, but the small review base
              does not support a population-wide conversion or implementation claim. Procurement economics remain opaque
              because pricing is custom and no retained source provides average contract value, sales-cycle length,
              renewal, or attach rates.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by cloud-first architectures, accelerated development, expanding attack surfaces,
              third-party integrations, AI-enabled threats, and the need to move from periodic assessments toward
              continuous testing. NetSPI's CEO also described customer pressure to rationalize security stacks,
              eliminate shelfware, and favor integrated tools that produce measurable outcomes. That supports a
              platform-consolidation thesis, but it also raises the bar: each module must outperform or integrate
              convincingly with specialist alternatives. User evidence supplies concrete friction. One 2026 reviewer
              called new features immature and noted that customer administrators could not add engagement users without
              NetSPI assistance; other reviews cited limited export or integration functionality, unclear device
              mapping, and interface navigation that could be streamlined. These constraints can slow expansion even
              when initial service delivery is strong. Valuation should therefore reward recurring workflow adoption
              only after management substantiates retention, cross-sell, utilization, pricing, and margin evidence
              rather than capitalizing broad cybersecurity spend or company-issued growth claims as TAM.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size remains unproven
            body: >-
              The retained corpus supports category relevance and enterprise adoption but not a standalone TAM, SAM, or
              SOM. Funding, employee count, customer penetration, review ratings, and historical company growth must
              remain separate proxies.
            calloutType: risk
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: callout
            title: Adoption value is workflow-level
            body: >-
              The strongest buyer evidence concerns tester collaboration, centralized findings, remediation tracking,
              and integration into existing security workflows rather than a generic desire for more vulnerability
              alerts.
            calloutType: insight
            claimRefs:
