              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than cybersecurity as a whole. NetSPI's own product boundary combines
              Penetration Testing as a Service (PTaaS), attack surface management (ASM), and breach and attack
              simulation (BAS), with vulnerability prioritization and remediation workflow connecting those activities.
              Included spend therefore covers externally delivered penetration testing, continuous exposure discovery,
              validation, and attack simulation where a buyer wants technology plus specialist human testing. Broad
              endpoint, identity, SIEM, generic vulnerability-scanning, and incident-response spend should be excluded
              unless it directly replaces those workflows. Status-quo substitutes include annual consulting projects,
              internal red teams, scanner-led vulnerability programs, disconnected point tools, and deferring
              remediation. NetSPI's current technical feed also spans autonomous pentesting, cloud privilege escalation,
              attack-path mapping, and social-engineering assessment, showing relevant adjacencies without proving that
              all adjacent security spend is addressable.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
              - CM016
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a directly comparable TAM, SAM, and SOM for the defined
              PTaaS-plus-ASM-plus-BAS boundary. The usable lenses are therefore proxies, not additive market estimates.
              Historical company growth indicates demand captured by NetSPI: its 2022 release reported five-fold revenue
              growth over five years, more than 50 percent organic revenue growth in 2021, and 61 percent growth in 2022
              to date. Company-reported penetration of nine of the top ten U.S. banks and a third-party profile
              describing 501-1,000 employees indicate enterprise-scale delivery, while G2's 13-review sample provides
              only a narrow adoption signal. The $410 million KKR growth investment funded innovation, hiring,
              expansion, and recapitalization; it is neither revenue nor available cash and is not a market-size
              measure. A bottom-up SAM and SOM still require current contract values, renewal data, target-account
              counts, service capacity, and segment mix.
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM011
