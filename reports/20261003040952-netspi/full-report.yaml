  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Directional impact, likelihood, and mitigation maturity for the four leading evidence-backed risk mechanisms;
      ratings are analytical, not company-reported probabilities.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
      rows:
        - id: merger-integration
          label: Merger integration
          note: Conditional close and post-close execution
          values:
            - label: Medium
              note: Conditional close and integration work create a live execution period
              tone: warning
            - label: High
              note: Service disruption or close delay could affect the core thesis
              tone: risk
            - label: Emerging
              note: Public evidence is a stated continuity commitment, not measured performance
              tone: warning
        - id: talent-capacity
          label: Specialist talent capacity
          note: Human-delivered quality creates capacity sensitivity
          values:
            - label: Medium
              note: Historical evidence identifies scarce offensive-security talent
              tone: warning
            - label: High
              note: Capacity pressure can affect delivery time and service quality
              tone: risk
            - label: Developing
              note: Training and a larger combined talent bench are described
              tone: warning
        - id: platform-complexity
          label: Platform and integration complexity
          note: Multi-module and third-party workflow dependencies
          values:
            - label: Medium
              note: PTaaS, ASM, BAS, and third-party connectors expand the change surface
              tone: warning
            - label: Medium
              note: Connector or release problems could impede customer workflows
              tone: warning
            - label: Developing
              note: A unified platform and telemetry architecture are disclosed
              tone: warning
        - id: commercial-opacity
          label: Commercial and financial opacity
          note: Pricing, margins, cash, retention, and concentration are not publicly resolved
          values:
            - label: High
              note: Missing private financial and commercial data is a present diligence condition
              tone: risk
            - label: Medium
              note: The gap can change price discipline and downside assessment
              tone: warning
            - label: Diligence-only
              note: Data-room review is required to close the gap
              tone: neutral
        - id: regulatory-evidence
          label: Regulatory and incident evidence
          note: Public company-specific primary records were not retained
          values:
            - label: Unknown
              note: The assigned evidence cannot establish event frequency
              tone: neutral
            - label: High
              note: A material violation or incident could affect trust and regulated customers
              tone: risk
            - label: Diligence-only
              note: Primary legal, audit, certification, and incident records are required
              tone: neutral
        - id: ai-threat-change
          label: AI-driven threat and testing change
          note: Threat evolution raises both customer demand and execution requirements
          values:
            - label: Medium
              note: Company commentary expects increased AI-enabled social engineering
              tone: warning
            - label: Medium
              note: Product controls and expert workflows must keep pace
              tone: warning
            - label: Developing
              note: Current technical research and AI-assisted product work are visible
              tone: warning
