  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Segmentation
        blocks:
          - type: paragraph
            body: >-
              The enterprise offensive security market encompasses distinct delivery architectures ranging from managed
              programmatic platforms to boutique consulting partnerships, autonomous testing tools, and embedded
              DevSecOps pipelines. NetSPI anchors its market positioning as an enterprise Penetration Testing as a
              Service (PTaaS) platform, delivering multi-scope program consolidation across cloud, network, hardware,
              mainframe, and modern AI architectures [CP001]. In contrast to pure-play professional services
              consultancies or developer-oriented automated scanners, NetSPI emphasizes a unified operating model
              combining software telemetry with an employed global delivery bench [CP002, CP003]. Primary direct peers
              in enterprise offensive security include Bishop Fox, which pairs specialized adversary simulation with its
              managed Cosmos attack surface platform, and emerging hybrid PTaaS providers such as Stingrai, which
              combine autonomous agents with human penetration testers [CP004, CP005]. In adjacent software categories,
              automated Application Security Testing (AST) vendors like Checkmarx focus on CI/CD integration and
              developer workflow automation, representing an alternative or complementary budget allocation for
              enterprise buyers [CP006].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.2'
        title: Competitor Profiles & Strategic Differentiation
        blocks:
          - type: paragraph
            body: >-
              Enterprise offensive security vendors exhibit divergent strategic directions, capital structures, and
              delivery focus areas across the threat lifecycle. NetSPI differentiates through delivery breadth and
              programmatic scale, fielding over 350 in-house penetration testers across global delivery centers in the
              United States, Canada, the United Kingdom, and India [CP002, CP007]. This scale enables NetSPI to support
              specialized, highly regulated testing domains—such as financial mainframe systems (z/OS, CICS/IMS), ATM
              networks, and medical devices—that boutique firms and automated scanners cannot readily address [CP001,
              CP007]. Bishop Fox, backed by $129M in growth funding, emphasizes adversarial depth, premier Fortune 100
              penetration, and offensive research output, using its Cosmos platform for continuous perimeter attack
              surface testing [CP004, CP008]. Meanwhile, automated and developer-centric AST vendors like Checkmarx
              maintain extensive developer ecosystem integrations across SAST, SCA, and API security, though enterprise
              reviews cite elevated false-positive triage overhead and complex configuration compared to verified human
              testing [CP006, CP009]. Specialized red team readiness and threat intelligence remain core operational
              disciplines across the competitive set [CP010].
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: Commercial Models, Pricing Transparency & Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial procurement structures in offensive security diverge sharply between quote-only custom
              enterprise contracts and transparent modular subscriptions. NetSPI does not publish list rate cards or
              public SKU pricing on its primary corporate domain, conducting procurement via custom statement-of-work
              (SOW) negotiations and AWS Marketplace private offers [CP011]. Third-party procurement datasets indicate
              annual enterprise spend ranges from $35,000 for mid-market project scopes to between $150,000 and
              $250,000+ for comprehensive continuous PTaaS portfolios, with specialized high-assurance FedRAMP 3PAO
              assessments frequently commanding $15,000 to $40,000+ per engagement [CP012]. While Bishop Fox similarly
              relies on custom enterprise scoping, emerging hybrid challengers like Stingrai utilize publicly published
              package pricing for web application testing [CP013]. Checkmarx One publishes modular starter SKUs on AWS
              Marketplace while quoting full enterprise deployments [CP014]. NetSPI's switching costs are anchored in
              workflow embedding, historical vulnerability trending, and IT ticketing integrations (Jira, ServiceNow)
              across its Resolve-derived platform [CP003, CP015]. However, pricing opacity and extended enterprise sales
              cycles remain recurring buyer friction points across procurement datasets [CP011, CP016].
            claimRefs:
              - CP003
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Program Scale & Architecture Breadth
            body: >-
              NetSPI's combination of 350+ employed in-house penetration testers, KKR financial backing, and capability
              depth across specialized environments like mainframe (z/OS) and medical hardware provides a moat against
              both boutique consultants and purely automated AST platforms.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: Pricing Transparency & Sales Friction in Mid-Market
            body: >-
              NetSPI's quote-only commercial posture and reliance on annual programmatic commitments create evaluation
              friction for mid-market and cloud-native buyers compared to transparent, developer-first security tools
              and hybrid competitors publishing upfront rate cards.
            calloutType: risk
            claimRefs:
              - CP011
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue architecture: recurring platform plus expert delivery'
        blocks:
          - type: paragraph
            body: >-
              NetSPI is best underwritten as a technology-enabled security-services business rather than as pure
              software. Independent market data labels the revenue model as services and subscription, while company
              materials place Penetration Testing as a Service, Attack Surface Management, and Breach and Attack
              Simulation on one platform. That combination creates several monetization paths: recurring program access,
              scoped testing engagements, and expansion into additional modules. A company-issued customer quotation
              says Lenovo began with penetration testing and expanded the relationship, which supports a land-and-expand
              hypothesis but does not quantify attach rates, renewal rates, or revenue mix. No retained source separates
              software revenue from expert-delivery revenue, so neither recurring revenue quality nor accounting
              recognition can be measured from public evidence.
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI011
              - CI013
      - number: '4.2'
        title: Pricing opacity limits sales-efficiency analysis
        blocks:
          - type: paragraph
            body: >-
              The only retained pricing evidence is a comparison publisher's report that NetSPI uses custom enterprise
              contracts rather than published SKU pricing. It describes one-time tests, annual PTaaS subscriptions, and
              platform modules, but it is neither a NetSPI rate card nor an independent procurement benchmark; no
              numerical price should be inferred from it. Custom scoping is consistent with a direct enterprise motion
              and can accommodate application count, testing cadence, specialist work, and platform scope, yet the
              public record provides no sales-cycle, quota productivity, customer-acquisition cost, payback, discount,
              minimum commitment, or channel-economics data. The financial implication is therefore directional:
              cross-sell may increase account value, while bespoke scoping and expert capacity may lengthen sales and
              delivery cycles. Contract samples and cohort data are required to test either view.
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI013
              - CI015
      - number: '4.3'
        title: Human delivery is both differentiation and a margin variable
        blocks:
          - type: paragraph
            body: >-
              The operating model combines software telemetry with a substantial specialist workforce. NetSPI reported
              more than 400 offensive-security professionals in 2022; its 2024 platform release referred to more than
              250 global pentesters and over 20,000 engagements. Those figures use different populations and dates and
              must not be treated as a headcount trend. They do establish that expert labor remains central to delivery
              even as automation and accumulated engagement telemetry can improve consistency. Gross margin should
              therefore depend on tester utilization, compensation, delivery mix, retesting obligations, platform
              hosting, and automation leverage. None is quantified in the assigned evidence. Current official content
              about autonomous-pentesting benchmarking indicates continued technical activity, but it does not disclose
              R&D expense, productivity gains, or monetization.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
      - number: '4.4'
        title: Historical funding is not evidence of current runway
        blocks:
          - type: paragraph
            body: >-
              NetSPI announced $410 million of new funding in October 2022, with stated uses including technology,
              hiring, global expansion, and recapitalizing Sunstone Partners. Public sources reported $500 million of
              cumulative funding by that date and historical revenue growth of fivefold over five years, more than 50
              percent organic growth in 2021, and 61 percent growth in 2022 through the announcement date. These are
              historical, largely company-originated traction claims; they are not current revenue or ARR, and a
              recapitalization means funding raised cannot be read as cash retained by the company. The assigned public
              record supplies no current cash balance, burn, runway, leverage, debt covenants, audited revenue, gross
              margin, CAC/payback, or NRR. The financial verdict is consequently conditional: sponsor backing and prior
              growth are positives, but revenue quality, margin scalability, and capital adequacy cannot be underwritten
              until management data is obtained.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple expansion paths exist inside one platform
            body: >-
              PTaaS, ASM, and BAS create a plausible path from an initial testing engagement to a broader recurring
              program, but public evidence does not quantify conversion or retention.
            calloutType: strength
            claimRefs:
              - CI002
              - CI012
              - CI013
          - type: callout
            title: The underwriting variables are private
            body: >-
              Current revenue, mix, gross margin, retention, cash, burn, runway, and debt obligations are absent from
              the assigned public evidence, preventing a defensible profitability or capital-adequacy conclusion.
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              NetSPI is best understood as a hybrid delivery system rather than a stand-alone scanner. Its public
              platform combines expert-led penetration testing with software that coordinates engagements, exposes
              findings, tracks remediation, supports retesting, and preserves proof of exploit. A customer review
              retained through AWS Marketplace corroborates this workflow from the user side, including collaboration
              with testers and remediation tracking. The model can improve finding context relative to unattended
              scanning, but its value depends on both software execution and human delivery capacity. That coupling is a
              product strength for complex assurance work and a scalability dependency that should be tested during
              diligence rather than treated as pure software automation.
            claimRefs:
              - CE001
              - CE002
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE012
      - number: '5.2'
        title: Module map and maturity signals
        blocks:
          - type: paragraph
            body: >-
              The portfolio spans Penetration Testing as a Service, External Attack Surface Management, Cyber Asset
              Attack Surface Management, and Breach and Attack Simulation. EASM is the clearest example of explicit
              packaging: Lite emphasizes automated asset discovery, Standard adds expert exposure validation, and Plus
              adds continuous EASM-powered external penetration testing. The breadth creates cross-sell and
              unified-workflow potential, but public evidence does not establish equal maturity across every module. A
              2026 customer review specifically described newer features as immature and identified an administrative
              dependency for adding users to engagements. Product diligence should therefore separate established PTaaS
              workflows from recently introduced or acquired surfaces instead of assigning one maturity label to the
              full suite.
            claimRefs:
              - CE001
              - CE006
              - CE009
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE009
              - CE012
      - number: '5.3'
        title: Architecture, deployment, and integration model
        blocks:
          - type: paragraph
            body: >-
              A company-issued engineering job specification provides the most concrete public architecture signal. It
              names Java with Spring Boot, C#, Python, and Go on the backend; React and TypeScript on the frontend; AWS
              services including ECS, Fargate, Aurora PostgreSQL, Lambda, S3, and Secrets Manager; PostgreSQL, Redis,
              and Kafka for data and messaging; Temporal for distributed workflows; and Terraform, GitHub Actions, and
              Docker for delivery. This is credible evidence of technologies in use, not a verified production topology
              or proof of reliability. Official product material also lists connections across asset, identity,
              vulnerability, and ticketing systems, including Jira and ServiceNow, while an MCP service is presented as
              an agentic access path to validated vulnerability context.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE013
      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              NetSPI's defensible technical position appears to rest on the combination of practitioner expertise,
              accumulated engagement context, workflow software, and an active offensive-security research surface. The
              official site highlights EchoBench as a human-calibrated benchmark for autonomous web-application
              pentesting, while current platform material describes detective-control simulation packs and agentic
              integrations. These are useful innovation signals, but they do not substitute for independent benchmarks
              of detection accuracy, uptime, or service-level performance. Third-party analysis reports no prominent
              public uptime or SLA figures and characterizes the developer experience as portal-centric rather than
              deeply embedded in IDEs. NetSPI's own 2026 threat commentary also frames AI-enabled social engineering as
              an increasing trust and safety concern; buyers should ask how those risks are incorporated into product
              controls, testing procedures, and internal assurance.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Human validation is part of the product
            body: >-
              Customer evidence supports a workflow in which findings, remediation, retesting, and tester collaboration
              live together; this is more than a scanner-results portal, but it also makes delivery operations part of
              product performance.
            calloutType: strength
            claimRefs:
              - CE002
              - CE008
          - type: callout
            title: Public assurance evidence trails product breadth
            body: >-
              The allocated evidence does not provide independently verified uptime, SLA performance, production
              architecture, or a complete control and certification inventory for the unified platform.
            calloutType: risk
            claimRefs:
              - CE003
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Segments, Buyers, and Use Cases
        blocks:
          - type: paragraph
            body: >-
              NetSPI's disclosed customer footprint is concentrated in large enterprises with complex attack surfaces. A
              2024 company-issued release claimed relationships with nine of the top ten U.S. banks, four of the top
              five leading cloud providers, four of the five largest healthcare companies, and seven of the top ten U.S.
              retailers and e-commerce companies. Investor Ten Eleven Ventures separately described nine of the top ten
              banks, three of the five largest healthcare companies, leading cloud providers, and many Fortune 500
              companies. These are cohort claims rather than an auditable customer list: the sources do not identify
              most logos, contract values, active-account denominators, or the split between project work and recurring
              platform use. The clearest user is the enterprise security team, while the precise economic buyer, payer,
              procurement channel, and revenue contribution by vertical remain private.
            claimRefs:
              - CU001
              - CU002
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
      - number: '6.2'
        title: Adoption Scale and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports substantial cumulative delivery scale but not a clean active-customer trajectory.
              Ten Eleven Ventures reported more than one million assets tested and four million unique vulnerabilities
              found, while NetSPI's 2024 release cited more than 20,000 engagements and 250-plus global pentesters. A
              2022 company release also reported five-fold revenue growth over five years, more than 50 percent organic
              growth in 2021, and 61 percent growth in 2022 to date. Those metrics use different units and periods, so
              they are presented as separate indicators rather than a conversion funnel. Lenovo is the strongest
              assigned reference: its product security executive said the relationship began with penetration testing
              and expanded into pre-release vulnerability discovery, operational attack surface management, and exposure
              insights. The assigned corpus does not quantify Lenovo's outcome, contract size, or renewal history.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU005
      - number: '6.3'
        title: Durability, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              NetSPI's product design supplies a plausible land-and-expand mechanism, but public evidence stops short of
              proving retention. The unified platform combines PTaaS, attack surface management, and breach and attack
              simulation; the 2026 experience adds self-service scheduling, progress tracking, remediation visibility,
              and executive reporting. That architecture can support expansion from a scoped test into a broader
              continuous program, as Lenovo's quoted relationship illustrates. Demand signals are also visible: a NetSPI
              field CISO reported that more than seventy CISOs discussed AI-enabled deception, and company research
              describes worsening cloud visibility and expanding API and AI attack surfaces. However, no assigned source
              reports NRR, GRR, churn, renewal rates, contract length, cohort retention, or top-customer revenue
              concentration. A competitor-comparison publisher reports strong but limited review samples and no
              independently verified NPS, so satisfaction evidence should not be treated as a durability metric.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: A credible named expansion reference
            body: >-
              Lenovo's customer quote describes movement from penetration testing into pre-release discovery,
              operational attack surface management, and exposure insights, providing stronger expansion evidence than
              an unaffiliated logo alone.
            calloutType: strength
            claimRefs:
              - CU005
          - type: callout
            title: Retention and concentration remain unverified
            body: >-
              Strong cohort claims and limited review-site ratings cannot substitute for NRR, GRR, churn, renewal
              cohorts, contract duration, or top-customer revenue share.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The September 2026 Synack agreement moves integration risk to the top of the register: the parties
              describe a combined business with more than $200 million in revenue, but closing was still subject to
              customary conditions and regulatory approvals, and the announcement separately promised continuity for
              customers, partners, and employees. That combination makes service continuity, platform integration,
              talent retention, and close timing the key near-term monitoring set rather than settled outcomes. A second
              tier of risk follows from NetSPI's human-delivered model. Historical reporting tied growth to a large
              offensive-security workforce, while a third-party comparison says human validation improves finding
              quality but introduces turnaround-time exposure. Public evidence supports these risk mechanisms; it does
              not quantify current capacity utilization, backlog, renewal exposure, or integration progress.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR008
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The only transaction-specific regulatory fact in the allocated evidence is that the Synack merger remained
              subject to regulatory approvals and other closing conditions when announced. NetSPI's own third-party-risk
              guidance also emphasizes that vendors can handle personally identifiable information, financial records,
              and intellectual property, and that customer obligations may span GDPR, HIPAA, PCI DSS, DORA, and NIS2.
              Those statements identify the consequence surface, not proof of a NetSPI violation. No retained regulator
              record, court docket, incident notice, DPA, certification inventory, or historical status-page dataset
              establishes NetSPI's company-specific posture. The investment implication is therefore a material
              verification requirement: legal representations, security-control evidence, and merger approvals should be
              reviewed directly before underwriting low regulatory or incident risk.
            claimRefs:
              - CR001
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
      - number: '7.3'
        title: Operating and dependency risk
        blocks:
          - type: paragraph
            body: >-
              NetSPI has broadened from penetration testing into a unified PTaaS, attack-surface-management, and
              breach-and-attack-simulation platform, with disclosed integrations to Jira, ServiceNow, AWS, Qualys,
              scanners, CMDBs, and ticketing systems. This breadth can deepen customer workflows, but it also increases
              integration, release-management, and third-party compatibility obligations. The company cited telemetry
              from more than 250 pentesters and more than 20,000 engagements in May 2024, while older independent
              reporting described talent scarcity and a workforce of 400 offensive-security professionals. These
              differently dated measures are not a current headcount series. They instead show why specialist
              availability, tester productivity, lead time, and remediation backlog should be monitored together,
              especially through the Synack integration and as AI-assisted testing changes service expectations.
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Financial model risk and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The 2022 financing record is evidence of sponsor support, not evidence of cash currently available. NetSPI
              and KKR said the $410 million transaction would fund technology, hiring, geographic expansion,
              acquisitions, and a recapitalization of Sunstone Partners; company-issued materials also reported
              five-fold revenue growth over five years and strong 2021-to-2022 growth. Those historical growth figures
              do not establish current recurring revenue, margins, burn, leverage, or cash conversion. Commercial
              transparency is also limited: the retained comparison describes custom enterprise contracts, unpublished
              list pricing, and premium pricing and lead times. Thesis-break triggers should therefore include delayed
              merger close, customer-facing service deterioration, sustained tester backlog, failure to integrate core
              workflows, or diligence evidence showing weak retention, margin, liquidity, or concentration relative to
              the investment case.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert missing incident evidence into a clean record
            body: >-
              The assigned public-source pool did not provide a company-specific regulator finding, lawsuit, breach
              notice, outage history, or status-page SLA series. Underwriting should treat those items as unverified and
              request primary evidence rather than infer that no event occurred.
            calloutType: risk
            claimRefs:
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing history is visible; present price is not
        blocks:
          - type: paragraph
            body: >-
              NetSPI's financing history demonstrates access to substantial growth capital but does not establish a
              current valuation. Goodwin, NetSPI, and SecurityWeek each documented the $90 million KKR-led round in
              2021, while Crunchbase News and a NetSPI-issued release documented KKR's additional $410 million
              investment in 2022 and the recapitalization of Sunstone Partners. Those amounts are financing flows, not
              an enterprise-value mark or cash balance. The assigned secondary-market evidence is also thin: Forge's
              July 2025 page displayed no price or post-money valuation and characterized market activity as limited.
              Accordingly, public evidence supports sponsor capacity and historical capital formation, but it does not
              support a defensible entry price, target return, or precise valuation range as of the run date.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Scale and platform breadth must be weighed against evidence quality
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on capital access, historical growth claims, a broader platform, and the announced
              Synack combination. NetSPI's 2024 company release described a unified platform spanning penetration
              testing as a service, attack surface management, and breach and attack simulation, and said the platform
              drew on more than 250 pentesters and more than 20,000 engagements. The anti-thesis is equally important:
              those operating figures are company-issued, the 2022 growth figures are historical, and the transaction
              announcement provides combined revenue but not consideration, ownership, margins, retention, or
              stand-alone contribution. The merger therefore improves potential strategic scale while simultaneously
              making clean underwriting harder until closing, integration, and pro forma economics are verified.
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Scenario logic should use diligence thresholds, not invented multiples
        blocks:
          - type: paragraph
            body: >-
              The available pool cannot support numeric bull, base, or bear valuation ranges because it lacks current
              audited revenue, gross margin, recurring-revenue mix, retention, debt, cash, preference terms, transaction
              consideration, and a directly comparable public or private transaction set. A bull outcome requires the
              Synack transaction to close, the combined revenue claim to reconcile to audited statements, and
              integration to create measurable growth or margin benefits. The base case assumes closing and continuity
              but with uncertain synergy realization, while the bear case captures delay, failed closing, customer or
              talent disruption, and private-market illiquidity. Entry discipline should therefore be expressed as
              evidence conditions: do not underwrite a price until enterprise value, fully diluted ownership,
              preferences, and normalized operating metrics can be tested against a relevant comparable set.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: The pending merger is a strategic milestone, not yet a liquidity event
        blocks:
          - type: paragraph
            body: >-
              NetSPI and Synack announced a definitive merger agreement on September 2, 2026, with closing expected in
              October 2026 subject to customary conditions and regulatory approvals. The announcement is relevant to
              exit readiness because it indicates sponsor-supported consolidation and a larger operating platform, but
              it neither confirms that closing occurred nor provides an investor liquidity price. The absence of a
              displayed Forge price further limits evidence of a realizable secondary exit. Final diligence should
              obtain the signed transaction economics, closing status, pro forma capitalization, debt and preference
              stack, audited revenue bridge, recurring-revenue and services mix, gross margin, retention, customer
              concentration, and an evidence-matched comparable set. A failed or materially delayed closing, unexplained
              revenue reconciliation, or unacceptable preference overhang would break the current thesis.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse capital raised with valuation
            body: >-
              The $90 million and $410 million amounts document growth financing, while the assigned sources do not
              disclose a current enterprise value, equity value, cash balance, or investor return basis. Price
              discipline therefore requires transaction documents and audited financials rather than a multiple inferred
              from funding.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV009
              - CV016
