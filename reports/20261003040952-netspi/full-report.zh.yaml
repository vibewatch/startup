  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 从有据可查的投资方注资与宣称规模出发，穿透估值与交割层面的证据缺口，最终推导至「继续研究」的投资决策。
    data:
      nodes:
        - label: 历史注资规模
          detail: 2021 年的 $90 million 与 2022 年的 $410 million 均为融资金额，并不代表公司估值。
        - label: 历史增长信号
          detail: 发行方披露的 5 年 五倍营收增长及 2022 年年内迄今 61% 的增速，仍需结合当前数据进行核对勾稽。
        - label: 平台布局信号
          detail: 发行方在 2024 年提及已打造覆盖 PTaaS、ASM 及 BAS 的统一平台。
        - label: 并购交易信号
          detail: 宣布与 Synack 达成合并协议，发行方口径下的合并年营收超过 $200 million。
        - label: 核心证据缺口
          detail: 缺乏当前价格、经审计的经济模型、交易对价、股权比例、负债或优先股堆叠。
        - label: 最终决策
          detail: 继续研究；仅在核实上述缺失变量后，方可设定价格与回报门槛。
    approximationNotes: 仅为有序定性逻辑；融资与营收数据未被折算为隐含估值。
