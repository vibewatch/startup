  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险排序与评估
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月达成的 Synack 合并协议使整合风险跃居风险清单首位：双方宣称合并后整体营收将超过 $200
              million，但交易交割仍取决于惯常成交条件和反垄断等监管审批，公告中亦承诺维护客户、合作伙伴与员工的业务延续性。上述现状意味着服务连续性、平台技术融合、核心人才留存以及交割时间节点，构成了近期必须重点跟踪的关键变量，而非既成事实。第二梯队风险源于
              NetSPI
              依赖人工交付的业务模式。历史报道将公司增长归功于庞大的攻防安全专业团队，而第三方横向评测指出，人工核实验证虽能提升漏洞研判质量，却不可避免地拉长了响应交付周期。公开证据证实了上述风险机制的存在，但未能具体量化当期产能利用率、待处理积压订单、续约敞口风险或并购整合实际进展。
            claimRefs:
              - CR001
              - CR002
