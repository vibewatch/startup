              ARR；其中又包含资本重组，因此融资额不能视为公司留存的现金。现有公开记录没有提供当前现金余额、烧钱速度、现金跑道、财务杠杆、债务契约、经审计收入、毛利率、CAC /
              回本周期或净留存率（NRR）。财务结论只能是有条件的：机构支持与历史增长是积极信号，但拿到管理层数据之前，还无法评估收入质量、利润率扩张能力与资本充足性。
