  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场细分
        blocks:
          - type: paragraph
            body: >-
              企业级攻防安全市场涵盖截然不同的交付架构，从托管式平台到精品咨询机构、自动化测试工具乃至嵌入式 DevSecOps 流水线皆有分布。NetSPI
              将自身定位为企业级渗透测试即服务（PTaaS）平台，针对云、网络、硬件、大型机以及现代 AI 架构提供跨业务范围的综合测试方案 [CP001]。与纯专业服务咨询公司或面向开发者的自动化扫描工具不同，NetSPI
              主打统一运营模型，将软件遥测数据与专职全球交付团队融为一体 [CP002, CP003]。在企业级攻防安全赛道，主要直接竞品包括将专业对抗模拟与自研托管式 Cosmos 攻击面平台相结合的 Bishop
              Fox，以及 Stingrai 等将自主智能体与人工渗透测试员深度融合的新兴混合型 PTaaS 厂商 [CP004, CP005]。在相邻软件领域，以 Checkmarx
              为代表的自动化应用安全测试（AST）厂商专注于 CI/CD 集成与开发者工作流自动化，构成企业采购方的替代选项或补充预算分配 [CP006]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.2'
        title: 竞品画像与战略差异化
        blocks:
          - type: paragraph
            body: >-
              面对整个威胁生命周期，企业级攻防安全厂商在战略方向、资本结构和交付侧重点上存在明显分化。NetSPI 的差异化优势在于交付广度与规模化能力，在美国、加拿大、英国和印度的全球交付中心布局了超过 350
              名全职内部渗透测试专家 [CP002, CP007]。这一规模助力 NetSPI 覆盖高度监管的专业测试场景（如金融大型机系统 z/OS、CICS/IMS，ATM
              网络及医疗设备），而精品咨询机构和自动化扫描器难以有效覆盖此类复杂环境 [CP001, CP007]。获 $129M 成长资本支持的 Bishop Fox 则主打深度对抗、顶尖 Fortune 100
              客户渗透率以及攻防前沿研究成果，依托 Cosmos 平台提供持续的外网暴露面测试 [CP004, CP008]。与此同时，Checkmarx 等以开发者为核心的自动化 AST 厂商在 SAST、SCA 与 API
              安全领域构筑了广泛的开发生态集成，但企业用户反馈其误报筛选成本高昂，且配置复杂度显著高于经过人工核实的测试方案 [CP006, CP009]。专业红队实战能力与威胁情报依然是所有主要竞品的核心基本盘
              [CP010]。
