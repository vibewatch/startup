      - number: '7.4'
        title: 财务模型风险与投资逻辑破坏触发项
        blocks:
          - type: paragraph
            body: >-
              2022 年的融资记录能证明机构股东支持，却不能证明公司当前有多少可用现金。NetSPI 与 KKR 当时称，这笔 $410 million 交易将用于技术投入、人才招聘、地域扩张、收购以及对 Sunstone
              Partners 进行资本重组；公司材料还披露收入五年增长五倍，2021 至 2022
              年增长强劲。但这些历史增速无法说明当前的经常性收入、利润率、烧钱速度、财务杠杆或现金转化能力。商业透明度也有限：留存的竞品对比材料显示，公司采用定制企业合同，不公布公开价目表，且定价较高、交付周期较长。因此，可能打破投资逻辑的信号包括：合并交割延迟、客户服务恶化、测试人员积压持续、核心工作流整合失败，或尽调发现留存率、利润率、流动性及客户集中度明显弱于投资假设。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
      - number: '7.5'
        title: 支撑图表
        blocks:
          - type: callout
            title: 切勿将安全事件证据缺失等同于合规记录无暇
            body: 留存的公开信息池中未见针对该公司的监管处罚裁定、诉讼案件、数据泄露通报、系统宕机历史或状态页 SLA 序列。投资评估应将上述项目视作“尚未验证”，并主动索取一手底稿凭据，切不可凭此假定从未发生任何风险事件。
            calloutType: risk
