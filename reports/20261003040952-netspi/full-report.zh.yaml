      - number: '3.3'
        title: 商业模式、定价透明度与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              攻防安全领域的商业采购模式分歧鲜明：一类是全定制的询价式大客户合同，另一类则是透明的模块化订阅。NetSPI 未在其官方网站公布公开刊例价或 SKU 目录价，而是通过定制工作说明书（SOW）商务谈判和 AWS
              Marketplace 专属要约推进交易 [CP011]。第三方采购数据表明，企业客户年均支出差异显著，中型市场单项目范围约 $35,000，而全面的持续性 PTaaS 组合年费达 $150,000 至
              $250,000+，专业高合规 FedRAMP 3PAO 评估单次客单价通常在 $15,000 至 $40,000+ [CP012]。Bishop Fox 同样侧重定制化企业范围界定，但 Stingrai
              等新兴混合型竞争对手针对 Web 应用测试推出了明码标价的套餐 [CP013]。Checkmarx One 则在 AWS Marketplace 发布模块化入门级 SKU，针对完整企业级部署另外单独报价
              [CP014]。NetSPI 的客户切换成本主要来自工作流嵌入深度、历史漏洞趋势沉淀以及基于 Resolve 架构与 IT 工单系统（Jira、ServiceNow）的深度对接 [CP003,
              CP015]。然而，定价不透明和冗长的企业级销售周期依然是采购数据集中频繁出现的阻碍因素 [CP011, CP016]。
