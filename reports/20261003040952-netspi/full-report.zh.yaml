  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入结构：订阅制平台叠加专家交付
        blocks:
          - type: paragraph
            body: >-
              将 NetSPI
              视为技术驱动的安全服务企业进行投资评估更为恰当，而非视作纯软件厂商。第三方市场数据将其商业模式归类为服务与订阅，而官方宣传材料则将渗透测试即服务、攻击面管理与入侵与攻击模拟整合在同一平台之上。这种组合衍生出多元变现路径：持续性平台权限费、按范围付费的专项测试，以及加购其他模块带来的扩单。公司官方引用的客户评价称
              Lenovo
              最初采购的是渗透测试，随后逐步扩大合作，这印证了“低门槛切入再扩张（Land-and-Expand）”的假设，但并未量化模块加购率、续约率或收入构成。现有材料均未将软件收入与专家交付收入进行拆分，因此无法从公开证据中评估其经常性收入质量与会计确认方式。
