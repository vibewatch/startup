  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品功能与客户工作流
        blocks:
          - type: paragraph
            body: >-
              将 NetSPI 定位为混合交付系统远比视作独立扫描器更为准确。其公开平台将专家主导的渗透测试与软件调度能力相结合，协同管理项目周期、呈现漏洞发现、跟踪修复进程、支持复测并保留漏洞利用验证（PoE）。AWS
              Marketplace
              留存的用户评价从实际使用角度印证了这一工作流，包括与测试专家的协同配合以及修复跟踪闭环。相较于无人值守的自动化扫描，该模式能提供更具业务上下文的漏洞细节，但其商业价值同时取决于软件成熟度与人工交付产能。这种紧密绑定在处理复杂安全审计时是一大产品优势，但在规模化扩张时则成为产能瓶颈，尽调中应深入核实其实际交付能力，而不可将其等同于纯软件自动化。
            claimRefs:
              - CE001
              - CE002
