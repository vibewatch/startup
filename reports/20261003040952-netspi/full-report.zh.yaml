            body: 留存材料证实了该赛道的业务关联度与企业采纳情况，但无法单独推导 TAM、SAM 或 SOM。融资金额、员工规模、客户渗透率、评测评分以及历史业绩增速，必须作为相互独立的参考指标审视。
            calloutType: risk
            claimRefs:
