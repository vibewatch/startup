            body: >-
              该业务模式将软件遥测能力与庞大的专业团队紧密结合。NetSPI 披露其在 2022 年拥有超过 400 名攻防安全专家；而在 2024 年的平台发布材料中，其提及全球 250 多名渗透测试人员与累计逾
              20,000
              次项目交付。鉴于两组统计口径与时间节点不同，不可将其解读为人员规模走势。这些数据确凿表明，尽管自动化与历次交付沉淀的遥测数据有助于提升服务一致性，专家人力依然是交付核心。因此，毛利率受制于测试人员产能利用率、薪酬水平、交付结构、复测承诺义务、平台托管开销以及自动化杠杆效应。所赋证据对上述要素均未予量化。官方近期发布的自主渗透测试基准说明其技术研发持续推进，但并未披露研发支出、人效增益或商业化变现成效。
