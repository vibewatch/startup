              Docker。这能够可信地反映其实际采用的技术栈，但不能直接证明生产环境的网络拓扑或系统高可用性。官方产品资料还列举了与资产、身份、漏洞及工单系统的广泛连接，包括 Jira 与 ServiceNow，并提供
