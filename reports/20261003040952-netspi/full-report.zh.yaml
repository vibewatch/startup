              - CM011
              - CM016
      - number: '2.3'
        title: 采购方、使用者、买单人与采纳路径
        blocks:
          - type: paragraph
            body: >-
              现有证据表明采购决策来自联合采购委员会，而非单一使用者。G2 用户评价显示，实际使用者或评估者包括应用安全工程师、IT 经理、合规主管、外聘技术负责人及企业安全从业人员；经济买单人大概率是 CISO
              或安全预算持有者，但留存材料未能确立不同细分客群的预算归属。采纳路径通常始于特定范围的渗透测试，随后延伸至共享看板，用于问题同步、沟通协同、复测验证与修复追踪。有用户反馈初始部署便捷且能与测试人员紧密配合，G2
              亦显示其实施周期在一个月以内。这些反馈表明，工作流整合与触达专家的便利性有助于降低采纳阻力；但评测样本较小，不足以支撑全客群转化率或实施效率的泛化主张。由于定价高度定制，且无公开材料提供平均合同价值（ACV）、销售周期长度、续约率或模块加购率，整体采购经济模型仍不透明。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
