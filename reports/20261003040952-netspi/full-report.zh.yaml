      - number: '1.2'
        title: 管理团队、公司治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              NetSPI 由首席执行官 Aaron Shilts 掌舵。在其带领下，公司完成了多次机构资本重组与战略平台收购，包括将 Silent Break Security
              收入麾下。公司技术与运营团队主打专业对抗模拟、企业级威胁情报以及 AI 赋能的测试工作流。治理架构牢牢绑定控股成长型股权投资方 KKR：后者于 2021 年 5 月首次入股，并在 2022 年 10 月追加投资
              $410 million。运营管理层囊括 Field CISO Nabil Hannan 等技术高管，负责对接大型企业安全决策层，研讨对抗手段与新兴生成式 AI
              社会工程学攻击路径。针对关键人依赖风险，公司依托全球超过 400 名专业安全人员构成的攻防团队、KKR 科技成长基金派驻的董事会监督，以及内部 NetSPI University 认证体系培养的人才储备提供对冲。
            claimRefs:
              - CO003
              - CO006
              - CO008
              - CO012
