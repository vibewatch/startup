              官方发布的技术招聘启事提供了关于系统架构最清晰的公开信号。后端采用 Java（搭配 Spring Boot）、C#、Python 和 Go；前端基于 React 与 TypeScript；云服务广泛采用 AWS
              系列组件，包括 ECS、Fargate、Aurora PostgreSQL、Lambda、S3 与 Secrets Manager；数据与消息层依托 PostgreSQL、Redis 和
