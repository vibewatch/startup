      - number: '5.2'
        title: 模块图谱与成熟度指标
        blocks:
          - type: paragraph
            body: >-
              产品矩阵涵盖渗透测试即服务（PTaaS）、外部攻击面管理（EASM）、网络资产攻击面管理（CAASM）以及入侵与攻击模拟（BAS）。EASM 呈现出最为清晰的分层产品包装：Lite
              侧重自动化资产发现，Standard 增加了专家暴露面核实，Plus 则接入了由 EASM 驱动的持续外部渗透测试。完整的产品广度具备交叉销售与统一工作流的潜力，但公开证据表明各模块成熟度参差不齐。一位 2026
              年的用户评价明确指出新功能尚不成熟，并提到添加项目成员时存在必须依赖官方支持的管理瓶颈。因此，产品尽调应将沉淀成熟的 PTaaS 工作流与近期推出或收购的新业务线剥离开来，避免对整套套件赋予单一的成熟度定论。
