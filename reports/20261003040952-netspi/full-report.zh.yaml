      - number: '1.4'
        title: 运营规模、客群覆盖与核心里程碑
        blocks:
          - type: paragraph
            body: >-
              NetSPI 拥有由蓝筹企业构成的客群，业务横跨强监管商业领域与公共机构。在与 Synack 交易之前，NetSPI 便服务了美国前 10 大银行中的 9 家、前 5 大医疗公司中的 3 家以及主流云厂商，并在
              2022 年录得 61% 的内生收入增长。2026 年 9 月与 Synack 宣布合并后，客户覆盖进一步延伸至头部云基础设施厂商、顶级美国金融机构、MAMAA 科技巨头、Fortune 100
              企业及美国联邦机构。依托双方近 40 年合并运营历程与累计 13 million 攻防测试工时，NetSPI 推动行业从周期性年度渗透测试向持续性攻防测试与智能体漏洞分诊演进。外部独立评测指出，NetSPI
              客单价偏高且需求界定周期较长，而私募股权控股结构也限制了外界对其精确单客经济模型的审视。
            claimRefs:
              - CO005
              - CO007
              - CO010
              - CO013
              - CO016
