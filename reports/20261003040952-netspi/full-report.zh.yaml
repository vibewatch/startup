      - number: '1.5'
        title: 支撑图表
        blocks:
          - type: callout
            title: Synack 合并案的战略意涵
            body: >-
              2026 年 9 月 NetSPI 与 Synack 的合并标志着攻防网络安全领域的重大整合。NetSPI 以咨询顾问为主导的 PTaaS 方法论与 Synack 经审核的众包红队及智能体 AI
              渗透测试强强联合，打造出营收超 $200 million 的综合平台，直接向传统漏洞扫描工具与纯全自动渗透测试初创公司发起挑战。
            calloutType: insight
            claimRefs:
