      - number: '7.2'
        title: 监管合规与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              现有材料中关于该笔交易确切的监管事实，仅限于公告披露时 Synack 合并案仍须满足惯常监管审批与其他交割条件。NetSPI
              自行发布的第三方风险指引亦强调，供应商可能接触个人可识别信息（PII）、财务记录及知识产权，客户合规义务可能涉及 GDPR、HIPAA、PCI DSS、DORA 与 NIS2
              等多项法规。这些陈述仅界定了潜在合规影响范围，绝非 NetSPI 存在违规行为的凭证。现有材料中未见关于 NetSPI
              的监管处罚记录、诉讼卷宗、安全事件通报、数据处理协议（DPA）、认证资质明细或历史系统状态页可用性数据。因此，该结论转化为重要的尽调核查要求：在下调对监管或安全事件风险的预估之前，必须直接审阅其法定陈述与保证、安全控制凭证以及反垄断并购批文。
            claimRefs:
              - CR001
              - CR004
          - type: table
            tableRef: TR001
