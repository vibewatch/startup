chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与战略演进
        blocks:
          - type: paragraph
            body: >-
              NetSPI 于 2001 年 3
              月在明尼苏达州明尼阿波利斯成立，是一家专注于攻防对抗的网络安全平台，提供企业级渗透测试、攻击面管理（ASM）以及入侵与攻击模拟（BAS）。公司开创了渗透测试即服务（PTaaS）交付架构，借助自研 Resolve
              平台把专家安全能力与专有工作流自动化融为一体。经历二十余年发展，NetSPI 从一家区域性技术咨询机构演进为跨国攻防安全供应商，在美国、加拿大、英国和印度均设有专业测试中心。2026 年 9 月，NetSPI 与
              Synack 宣布达成最终合并协议，将 NetSPI 经验丰富的专职测试人员与 Synack 经过严格审核的众包安全社区及智能体 AI 技术深度结合，组建起合并年收入超过 $200 million
              的综合性攻防网络安全平台。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
              - CO014
