      - number: '7.3'
        title: 运营与外部依赖风险
        blocks:
          - type: paragraph
            body: >-
              NetSPI 已从单纯的渗透测试拓展为集 PTaaS、攻击面管理与入侵与攻击模拟于一体的综合平台，公开披露了与 Jira、ServiceNow、AWS、Qualys、多款扫描器、CMDB
              及工单系统的集成。这种功能广度能深化客户工作流绑定，却也显著加重了系统集成、版本发布管理以及第三方兼容性保障负担。公司在 2024 年 5 月援引了来自 250 多名渗透测试人员和逾 20,000
              次交付的遥测数据，而早期独立报道曾提及安全人才稀缺以及由 400
              名攻防专业人员构成的团队。由于统计节点各异，这些数据无法构成连贯的员工规模序列。它们反倒说明了为何必须同步监测专家供给、测试人效、交付前置期以及修复积压问题，尤其在消化 Synack 并购整合以及 AI
              辅助测试重塑行业服务预期的关键时期。
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
