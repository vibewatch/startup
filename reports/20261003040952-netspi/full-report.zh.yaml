      - number: '1.3'
        title: 资本结构、股权归属与资方战略
        blocks:
          - type: paragraph
            body: >-
              NetSPI 的股权演进经历三个清晰的资本阶段：早期自筹资金的咨询业务扩张、2017 年 4 月 Sunstone Partners 注入的首轮机构成长资本，以及 KKR 借由科技成长战略取得控股权。2021 年
              5 月，KKR 联手网络安全专业投资机构 Ten Eleven Ventures 完成 $90 million 初始成长轮融资。2022 年 10 月，KKR 追加 $410 million
              成长资金，促使累计融资总额达到 $500 million，并支持 Sunstone Partners 完成全额机构退出。重组完成后，Dealroom 估算 NetSPI 的私募企业价值达到 $1.6
              billion。该资本架构持续支撑海外人才招募、Resolve 与 AttackSim 平台技术投入，并推动一系列战略并购，最终促成 2026 年 9 月与 Synack
              的合并。商业采购与交易数据库显示客户年均开支在 $35,000 至 $250,000+ 之间，但鉴于公司未上市，经审计的收入、毛利率及净留存率指标均未对外公开披露。
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
              - CO015
