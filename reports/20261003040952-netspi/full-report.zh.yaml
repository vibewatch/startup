  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 视角
      - 基于证据的论点
      - 改变观点的触发条件
    rows:
      - - 论点：投资方实力
        - KKR 领投了 2021 年的 $90 million 轮次，并在 2022 年宣布追加投资 $410 million。
        - 投资方意外退出、限制性优先求偿主张，或有证据表明该笔资金未用于支持实体运营。
      - - 论点：历史增长
        - 发行方 2022 年官方公告称，公司 5 年内营收增长 五倍，且 2022 年年内迄今增长 61%。
        - 经审计报表无法勾稽所称区间、分母或内生增长。
      - - 论点：平台广度
        - 发行方 2024 年官方公告称，其单一平台横跨 PTaaS、ASM 及 BAS。
        - 有证据表明交叉销售有限、产品采用率低，或服务交付在运营上仍处于割裂状态。
      - - 论点：战略规模
        - 合并双方发行方称，合并后公司年营收超过 $200 million。
        - 交割失败，或经审计的备考营收实质性低于发行方自述。
      - - 反向逻辑：缺乏市场出清价格
        - Forge 显示其暂无价格或投后估值，并指出截至 2025 年 7 月交易活跃度有限。
        - 近期完成的独立第三方老股交易、定价融资，或披露了具体合并对价。
      - - 反向逻辑：商业经济模型不透明
        - 公开材料未提供经审计的利润率、经常性收入结构、留存率、负债或优先权条款。
        - 提供一套可勾稽核对的尽调资料，展示出稳健的留存率、具备吸引力的常态化利润率以及可接受的优先股堆叠。
    notes: 公司发布的增长、平台及合并声明不视作经独立验证的经营业绩；Forge 数据截至 2025 年 7 月。
