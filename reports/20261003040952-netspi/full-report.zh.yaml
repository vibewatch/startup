  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 并购完成交割；所报道的合并收入完成勾稽；整合带来可衡量的增长或利润率改善；客户与核心人才留存保持稳固。
        - 暂不提供量化区间，直至经审计的备考财务指标与交易条款能够支撑具备证据对应的估值倍数与股权回报模型。
        - 为未经证实的协同效应支付过高对价；整合复杂度高；发行方披露指标无法勾稽。
        - 交割确认，加上经审计的增长、利润率及留存率改善，将提高该情景的发生概率。
      - - 基准
        - 并购完成交割且经营保持平稳，但协同效应显现时点以及软件与专业服务的经济模型划分仍存在不确定性。
        - 仅在对收入结构、债务、优先权、稀释比例及相关可比指标进行常态化调整后，方可采用尽调推导区间。
        - 整合节奏放缓；估值倍数扩张空间有限；二级市场流动性持续匮乏。
        - 客户留存保持稳定、整合方案可信但未见经证实的利润率扩张，支撑该基准情景。
      - - 悲观
        - 交割延迟或失败、整合冲击客户或人才队伍、增长失速，或投资方条款使新资金处于劣后地位。
        - 对缺乏依据的投资方估值标记假定存在实质性下行空间；在掌握债务、清算及现金数据前，不设定具体估值底线。
        - 交割失败；营收不及预期；优先权负担沉重；缺乏流动性退出通道；专业服务带来的利润率承压。
        - 监管审批延误、负面交割进展、营收勾稽出现缺口，或不利的优先权条款，将提高该情景的发生概率。
    notes: 各情景推演结论均为定性判断，所分配证据未提供构建合理估值或回报区间所需的输入变量。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
