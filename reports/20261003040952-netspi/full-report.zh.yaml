        blocks:
          - type: paragraph
            body: >-
              NetSPI 与 Synack 于 2026 年 9 月 2 日宣布达成最终合并协议，预计在满足惯常成交条件并获得监管批准后于 2026 年 10
              月完成交割。该公告之所以对研判退出就绪度具备参考意义，在于其展现了资方主导的行业整合及更大的运营平台规模；但它既无法证实交割已经完成，亦未提供任何针对投资方的流动性定价。Forge
              平台未披露挂牌价格，进一步反映缺乏可变现的二级老股退出参照。最终尽调工作应调取签署的正式交易财务条款、交割状态、备考股权结构表、债务与优先股堆叠、经审计收入调节表、经常性收入与服务收入配比、毛利率、留存率、客户集中度以及经证据比对的可比标的组。交易失败或严重延期交割、收入勾稽无法合理解释，或不可接受的优先股悬顶风险，均将直接推翻当前的投资逻辑。
