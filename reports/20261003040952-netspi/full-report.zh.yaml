      - number: '8.3'
        title: 情景推演应依托尽调门槛，而非杜撰估值倍数
        blocks:
          - type: paragraph
            body: >-
              现有材料无法支撑定量测算乐观、基准或悲观情景下的估值区间，根本原因在于缺乏当期经审计收入、毛利率、经常性收入占比、留存率、负债、现金储备、优先股条款、交易对价以及具备直接可比性的上市或非上市对标案例。乐观情景的前提是
              Synack
              交易顺利交割，合并营收宣称能与审计后报表勾稽一致，且业务整合催生可量化的增长或利润率增益；基准情景假定交易交割且业务平稳过渡，但协同效应释放存在不确定性；悲观情景则涵盖交割延期、交易流产、客户流失或人才流失，以及非公开市场流动性折价。因此，入场定价纪律应表现为前置证据门槛：在企业价值、完全稀释后股权比例、清算优先权以及经调整运营指标能够与可比标的充分比对之前，切勿盲目给出定价结论。
