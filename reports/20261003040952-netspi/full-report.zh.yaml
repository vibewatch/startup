            body: >-
              NetSPI 于 2022 年 10 月宣布获得 $410 million 新融资，称资金将用于技术研发、人才招聘、全球扩张以及对 Sunstone Partners
              进行资本重组。公开信息显示，截至当时公司累计融资达到 $500 million；公司还披露，收入五年增长五倍，2021 年内生收入增速超过 50%，2022 年截至公告日增长
