            body: >-
              NetSPI 的融资历程展现了其获取庞大成长资本的能力，但无法确立其当前估值。Goodwin、NetSPI 及 SecurityWeek 均记载了 2021 年由 KKR 领投的 $90 million
              融资；Crunchbase News 与 NetSPI 官方公告则记录了 2022 年 KKR 追加的 $410 million 投资以及针对 Sunstone Partners
              的资本重组。这些数值代表融资资金流向，并非企业价值公允估值（Enterprise Value）或账面现金余额。现有二级老股交易证据同样匮乏：Forge 平台 2025 年 7
              月的页面未显示任何交易价格或投后估值，并称市场流动性极为有限。因此，公开证据虽然佐证了机构资方的实力与历史资本沉淀，但截至评估基准日，并不足以支撑推导出合理的入场估值、目标回报率或精确的估值区间。
