          - type: callout
            title: 定价透明度不足与私募估值不透明
            body: >-
              NetSPI 采用定制工作说明书（SOW）与 AWS Marketplace 专属要约推进企业采购，并未公开标准刊例价，导致企业采购预算审批周期拉长。在 KKR
              的控股管理下，公司确切毛利率、净留存率及运营盈利能力均未对外披露，尽调团队须直接索取管理层保密文件方能核实其单客经济模型。
            calloutType: risk
            claimRefs:
              - CO013
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              该目标市场远小于泛网络安全市场。NetSPI
              自身产品边界圈定在渗透测试即服务（PTaaS）、攻击面管理（ASM）与入侵与攻击模拟（BAS），并由漏洞优先级排序与修复工作流串联起上述环节。因此，有效市场支出仅涵盖外部交付的渗透测试、持续暴露面发现、有效性验证以及采购方既要技术工具又要专业人工介入的攻击模拟。泛终端、身份认证、SIEM、常规漏洞扫描以及应急响应等预算均应剔除，除非其实际替代了上述工作流。现状下的替代方案包括年度咨询项目、内部红队、扫描器主导的漏洞方案、割裂的单点工具以及延后修复。NetSPI
              目前披露的技术演进涵盖自主渗透测试、云权限提权、攻击路径测绘与社会工程学评估，呈现出相关延展性，但这并不意味着所有相邻安全支出皆可归入其可触达市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
              - CM016
      - number: '2.2'
        title: 市场空间测算：避免虚假精确度
        blocks:
          - type: paragraph
            body: >-
              现有公开材料中未见针对 PTaaS+ASM+BAS 这一明确边界且具直接可比性的 TAM、SAM 与 SOM 测算。因此，可行的评估口径只能依赖替代指标，而非做简单的市场规模加总。公司历史增速说明 NetSPI
              确实捕获到了这部分需求：其 2022 年公告披露五年间收入增长五倍，2021 年内生收入增速超 50%，2022 年截至披露日增长 61%。公司称其覆盖美国前 10 大银行中的 9 家，第三方档案显示员工规模为
              501 至 1,000 人，这些数据印证了企业级交付能力；G2 仅有 13 条评价，能提供的采用信号很有限。KKR 注入的 $410 million
              成长资金用于研发创新、人才招聘、业务扩张与资本重组，既不是营业收入，也不是可用现金，更不能衡量市场规模。自下而上测算 SAM 与 SOM，仍需获取当前合同金额、续约数据、目标客户数、服务产能及客群结构。
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
