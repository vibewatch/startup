              企业。这些数据属于客群宣称而非可供审计的正式客户名册：公开渠道未披露绝大多数企业名称、合同金额、活跃账户基数，亦未拆解单次项目与平台经常性订阅的比例。最明确的系统使用者是企业安全团队，而确切的经济买单人、预算归属、采购渠道以及分行业收入贡献依然属于非公开信息。
