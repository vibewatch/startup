  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract duration, cohort expansion, and top-customer revenue share
      with consistent periods and denominators.
    whyItMatters: Without cohort durability and concentration data, public segment breadth cannot establish recurring revenue
      quality or downside exposure.
    diligencePath: Request management's customer cohort schedules, renewal bridge, contract-duration distribution, and top-10
      revenue concentration table for the latest twelve months.
    relatedQuestionRefs:
    - QU004
    - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A dated customer roster that distinguishes pilots, production deployments, active platform users, and
      lapsed relationships, with outcomes for each named account.
    whyItMatters: Cohort claims and logos cannot establish deployment quality, current usage, retention, or referenceability.
    diligencePath: Obtain the customer reference list and validate a sample through direct calls covering deployment scope,
      realized outcomes, renewal status, and expansion history.
    relatedQuestionRefs:
    - QU003
    - QU008
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: Verified NPS or CSAT results with survey date, respondent count, response rate, population, and customer-segment
      breakdown.
    whyItMatters: Small directory review samples cannot be generalized into customer satisfaction or retention.
    diligencePath: Request the latest customer survey instrument and raw response summary, then reconcile results with renewal
      and churn cohorts.
    relatedQuestionRefs:
    - QU004
