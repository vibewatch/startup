company:
  name: NetSPI
chapter:
  number: 6
  title: Customers
  summary: 'NetSPI''s public customer proof is strongest at the enterprise-segment level: company-issued materials cite deep
    penetration in banking, cloud, healthcare, and retail, while Lenovo provides the only named deployment in the assigned
    evidence. Historical engagement scale and a 2026 product redesign suggest repeat-use infrastructure, but retention, contract
    duration, revenue concentration, and verified customer outcomes remain undisclosed.'
sections:
- id: segments-and-buyers
  title: Enterprise Segments, Buyers, and Use Cases
  body: 'NetSPI''s disclosed customer footprint is concentrated in large enterprises with complex attack surfaces. A 2024
    company-issued release claimed relationships with nine of the top ten U.S. banks, four of the top five leading cloud providers,
    four of the five largest healthcare companies, and seven of the top ten U.S. retailers and e-commerce companies. Investor
    Ten Eleven Ventures separately described nine of the top ten banks, three of the five largest healthcare companies, leading
    cloud providers, and many Fortune 500 companies. These are cohort claims rather than an auditable customer list: the sources
    do not identify most logos, contract values, active-account denominators, or the split between project work and recurring
    platform use. The clearest user is the enterprise security team, while the precise economic buyer, payer, procurement
    channel, and revenue contribution by vertical remain private.'
  claimRefs:
  - CU001
  - CU002
  - CU006
  tableRefs:
  - TU001
- id: adoption-and-reference-proof
  title: Adoption Scale and Reference Quality
  body: 'Public evidence supports substantial cumulative delivery scale but not a clean active-customer trajectory. Ten Eleven
    Ventures reported more than one million assets tested and four million unique vulnerabilities found, while NetSPI''s 2024
    release cited more than 20,000 engagements and 250-plus global pentesters. A 2022 company release also reported five-fold
    revenue growth over five years, more than 50 percent organic growth in 2021, and 61 percent growth in 2022 to date. Those
    metrics use different units and periods, so they are presented as separate indicators rather than a conversion funnel.
    Lenovo is the strongest assigned reference: its product security executive said the relationship began with penetration
    testing and expanded into pre-release vulnerability discovery, operational attack surface management, and exposure insights.
    The assigned corpus does not quantify Lenovo''s outcome, contract size, or renewal history.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU008
  - CU009
  - CU010
  - CU011
  tableRefs:
  - TU002
  - TU003
- id: durability-expansion-and-risk
  title: Durability, Expansion, and Concentration Risk
  body: 'NetSPI''s product design supplies a plausible land-and-expand mechanism, but public evidence stops short of proving
    retention. The unified platform combines PTaaS, attack surface management, and breach and attack simulation; the 2026
    experience adds self-service scheduling, progress tracking, remediation visibility, and executive reporting. That architecture
    can support expansion from a scoped test into a broader continuous program, as Lenovo''s quoted relationship illustrates.
    Demand signals are also visible: a NetSPI field CISO reported that more than seventy CISOs discussed AI-enabled deception,
    and company research describes worsening cloud visibility and expanding API and AI attack surfaces. However, no assigned
    source reports NRR, GRR, churn, renewal rates, contract length, cohort retention, or top-customer revenue concentration.
    A competitor-comparison publisher reports strong but limited review samples and no independently verified NPS, so satisfaction
    evidence should not be treated as a durability metric.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  figureRefs:
  - FU001
