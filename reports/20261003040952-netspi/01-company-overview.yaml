company:
  name: NetSPI
chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2001 and headquartered in Minneapolis, NetSPI is an enterprise offensive cybersecurity leader specializing
    in Penetration Testing as a Service (PTaaS), attack surface management (ASM), and breach and attack simulation (BAS).
    Backed by over $500 million in growth funding from KKR and Ten Eleven Ventures, NetSPI agreed in September 2026 to merge
    with continuous security validation provider Synack, creating a combined platform operating at well over $200 million
    in revenue.
sections:
- id: corporate-identity-and-evolution
  title: Corporate Identity and Strategic Evolution
  body: Founded in March 2001 in Minneapolis, Minnesota, NetSPI operates as a pure-play offensive cybersecurity platform delivering
    enterprise penetration testing, attack surface management (ASM), and breach and attack simulation (BAS). The company pioneered
    the Penetration Testing as a Service (PTaaS) delivery framework, coupling human security expertise with proprietary workflow
    automation through its Resolve platform. Over more than two decades, NetSPI evolved from a regional technical consulting
    practice into an international offensive security provider with specialized testing centers across the United States,
    Canada, the United Kingdom, and India. In September 2026, NetSPI and Synack announced a definitive merger agreement to
    unite NetSPI's deep bench of offensive testers with Synack's vetted crowd-security community and agentic AI technology,
    establishing a combined offensive cybersecurity platform exceeding $200 million in aggregate revenue.
  claimRefs:
  - CO001
  - CO002
  - CO005
  - CO007
  - CO014
  tableRefs:
  - TO001
- id: executive-leadership-and-governance
  title: Executive Leadership, Governance, and Key-Person Dependency
  body: NetSPI is led by Chief Executive Officer Aaron Shilts, who has guided the organization through consecutive institutional
    recapitalizations and strategic platform acquisitions, including the purchase of Silent Break Security. The firm's technical
    and operational leadership emphasizes specialized adversary simulation, enterprise threat intelligence, and AI-enabled
    testing workflows. Governance is closely anchored by majority growth equity sponsor KKR, which first invested in May 2021
    and committed an additional $410 million in October 2022. Operating leadership includes technical executives such as Field
    CISO Nabil Hannan, who interfaces with enterprise security leaders on adversary methods and emerging generative AI social
    engineering vectors. Key-person dependency is mitigated by an offensive workforce exceeding 400 security professionals
    globally, institutional board oversight from KKR's Technology Growth practice, and deep bench depth reinforced through
    the internal NetSPI University certification program.
  claimRefs:
  - CO003
  - CO006
  - CO008
  - CO012
  tableRefs:
  - TO002
- id: capitalization-and-stakeholder-structure
  title: Capitalization Structure, Ownership, and Sponsor Strategy
  body: 'NetSPI''s ownership history reflects three distinct capital phases: bootstrapped consulting expansion, initial institutional
    growth backing by Sunstone Partners in April 2017, and majority control by KKR via its Technology Growth strategy. In
    May 2021, KKR and cybersecurity specialist investor Ten Eleven Ventures invested an initial $90 million growth round.
    In October 2022, KKR committed $410 million in new growth funding, bringing lifetime capital raised to $500 million and
    enabling Sunstone Partners to complete a full institutional exit. Dealroom estimated NetSPI''s private enterprise value
    at $1.6 billion following this recapitalization. The capital structure has funded international talent acquisition, technical
    platform investments across Resolve and AttackSim, and strategic corporate combinations culminating in the September 2026
    merger with Synack. While commercial procurement and deal databases indicate annual customer spending between $35,000
    and $250,000+, private ownership precludes public disclosure of audited revenue, gross margin, and net retention metrics.'
  claimRefs:
  - CO004
  - CO009
  - CO010
  - CO011
  - CO015
  tableRefs:
  - TO003
- id: strategic-milestones-and-market-scale
  title: Operating Scale, Customer Reach, and Corporate Milestones
  body: NetSPI serves a blue-chip enterprise customer base spanning regulated commercial industries and public-sector institutions.
    Prior to the Synack transaction, NetSPI protected nine of the top 10 U.S. banks, three of the top five healthcare companies,
    and major cloud providers, reaching 61 percent organic revenue growth in 2022. The September 2026 merger with Synack expands
    this reach across top cloud infrastructure providers, top U.S. financial institutions, MAMAA tech giants, Fortune 100
    corporations, and U.S. federal agencies. Across nearly 40 years of combined operating history and 13 million offensive
    testing hours, NetSPI has navigated industry transitions from static annual penetration tests toward continuous offensive
    testing and agentic vulnerability triaging. External independent comparisons note that NetSPI commands premium contract
    pricing and lengthy scoping cycles, while private equity ownership limits visibility into precise unit economics.
  claimRefs:
  - CO005
  - CO007
  - CO010
  - CO013
  - CO016
