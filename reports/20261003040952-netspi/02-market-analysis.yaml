      - [Attack surface management, "External and internal asset visibility, exposure discovery, correlation, and prioritization", "Generic asset inventory or scanners without testing and remediation workflow", "Security operations or exposure-management owner", "Core platform component and expansion path"]
      - [Breach and attack simulation, "Controlled validation of defensive effectiveness and attack paths", "Unrelated endpoint, identity, SIEM, and incident-response tooling", "Security validation, red-team, or security-operations budget", "Core platform component but not evidence that all validation spend is serviceable"]
      - [Status quo and adjacent substitutes, "Annual consulting, internal testing, scanner-led programs, or disconnected point tools when used for the same job", "The remainder of broad cybersecurity spend", "Enterprise security leadership and procurement", "Constrains adoption and prevents a broad cybersecurity TAM assumption"]
    notes: "Boundary is analyst-defined from NetSPI-issued product descriptions and buyer evidence; it is not a publisher market taxonomy or quantitative market estimate."
    claimRefs: [CM001, CM002, CM003, CM015, CM016]
  - id: TM002
