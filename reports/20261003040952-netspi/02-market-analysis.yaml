    notes: "Values are non-additive proxies with different periods and denominators; null TAM/SAM/SOM is intentional pending independent market data and company operating evidence."
    claimRefs: [CM004, CM005, CM010, CM011, CM012, CM013]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns: [Segment, Buyer or payer, Primary user, Workflow, Adoption trigger, Evidence limitation]
    rows:
      - [Large enterprise application security, "CISO or application-security budget owner", "Application Security Engineer", "Scope test, collaborate with testers, triage findings, retest", "Need broader coverage and remediation coordination", "Role and workflow appear in one 2026 G2 review; payer is inferred"]
      - [Enterprise security and infrastructure, "CISO or central security budget", "IT manager and security team", "Manage testing history, reports, findings, and team communication", "Replace fragmented project records and improve visibility", "User role is evidenced; budget ownership and segment economics are not"]
      - [Compliance-led organizations, "Compliance or risk budget with security sponsorship", "Compliance officer", "Commission and evidence security assessments", "Audit, assurance, or control-validation requirement", "A reviewer role supports participation, not purchase authority"]
      - [Mid-market technology businesses, "CTO or security budget", "Fractional CTO or technical leader", "Coordinate scoped testing and consolidate project artifacts", "External expertise where internal security depth is limited", "One small-business review; no segment pricing or win rate"]
      - [Mature global enterprises, "CISO and procurement", "Product-security, DevSecOps, and red-team practitioners", "Expand from pentesting into ASM, BAS, and integrated remediation", "Continuous coverage, cloud complexity, and stack consolidation", "NetSPI-issued positioning supports the path; attach and renewal rates are private"]
    notes: "Representative buyer map based on named reviewer roles and company-issued workflow descriptions; payer assignments are analytical inferences requiring management validation."
    claimRefs: [CM001, CM003, CM006, CM007, CM015]
figures:
  - id: FM001
    title: Evidence hierarchy for serviceable-market diligence
    type: pyramid
    summary: >-
      Six layers separate the addressable category boundary from company reach and the still
      unquantified obtainable market, preventing company metrics from being presented as TAM.
    data:
      items:
        - label: Broad category boundary
          value: "PTaaS + ASM + BAS"
          detail: "Defined product boundary; broad cybersecurity spend is excluded."
        - label: Enterprise buyer universe
          value: "Not quantified"
          detail: "Relevant buyers are security, application-security, product-security, compliance, and IT leaders."
        - label: Serviceable target accounts
          value: "Not quantified"
          detail: "Requires geography, minimum contract value, technical fit, and account-count filters."
        - label: Demonstrated vertical reach
          value: "9 of top 10 U.S. banks"
          detail: "Company-issued 2025 claim; does not disclose spend or retention."
        - label: Delivery and adoption proof
          value: "501-1,000 employees; 13 G2 reviews"
          detail: "Different third-party proxies with non-comparable denominators."
        - label: Obtainable share
          value: "Not disclosed"
          detail: "Requires current revenue, capacity, win rate, renewal, expansion, and pricing evidence."
    approximationNotes: "This is a qualitative evidence hierarchy, not a proportional market-size pyramid; values use different units and no geometric area encodes magnitude."
    claimRefs: [CM001, CM004, CM010, CM011, CM016]
callouts:
  - calloutType: risk
    title: Market size remains unproven
    body: >-
      The retained corpus supports category relevance and enterprise adoption but not a
      standalone TAM, SAM, or SOM. Funding, employee count, customer penetration, review
      ratings, and historical company growth must remain separate proxies.
    claimRefs: [CM004, CM010, CM011, CM012, CM013, CM014]
  - calloutType: insight
    title: Adoption value is workflow-level
    body: >-
      The strongest buyer evidence concerns tester collaboration, centralized findings,
      remediation tracking, and integration into existing security workflows rather than a
      generic desire for more vulnerability alerts.
    claimRefs: [CM007, CM009, CM015]
