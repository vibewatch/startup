      - [Historical organic growth, "2021 and 2022 year-to-date", ">50% in 2021; 61% in 2022 YTD", "Company growth rate", Medium, "Company-issued; not current and not market CAGR"]
      - [Enterprise penetration, "2025 company statement", "90% of the top 10 U.S. banks", "Presence in one high-value buyer segment", Medium, "Company-issued; denominator is only ten banks and spend is undisclosed"]
      - [Review-platform adoption signal, "13 G2 reviews visible in the 2026 archived page", "4.9/5 rating; implementation shown as <1 month", "Small-sample satisfaction and implementation proxy", Low, "Self-selected review sample; not a conversion, retention, or market-size measure"]
