        - Product and deployment proof exists, but current valuation inputs do not.
        - Do not issue a buy call from the assigned public evidence.
      - - Confidence
        - Medium-low
        - Scale is partner-supported; monetization and financing economics are undisclosed.
        - Require a finance-quality data room before increasing conviction.
      - - Risk rating
        - High
        - Price, dilution, preference, retention, and cash-generation risks cannot be quantified.
        - Demand downside protection and explicit thesis-break terms.
      - - Valuation stance
        - Indeterminate
        - No current Securonix equity value or reliable operating denominator is disclosed.
        - Do not infer valuation from the 2022 financing amount.
      - - Entry discipline
        - No numeric range supportable
        - Public comp multiples span a wide range and are not a private-company price.
        - Set a range only after audited metrics, net debt, and fully diluted ownership are known.
    notes: >-
      The table distinguishes financing raised from valuation and marks unavailable metrics as gaps; it does not convert
      public-company multiples into a Securonix price.
