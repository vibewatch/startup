              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top kill criterion
            body: >-
              Stop the investment case if reference customers or compliance teams confirm that Securonix's
              vendor-operated control plane cannot satisfy the target segment's isolation, sovereignty, or
              incident-disclosure requirements without bespoke contractual workarounds.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
          - type: callout
            title: Commercial diligence trigger
            body: >-
              Do not underwrite vendor ROI claims until management can show real telemetry-tiering behavior, negotiated
              overage protections, and objective proof that AI-priced 'analyst productivity' reductions survive customer
              production use.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR013
          - type: callout
            title: What would reduce residual risk
            body: >-
              Residual severity would come down if Securonix can provide recent reference calls, support MTTR evidence,
              clean post-ThreatQuotient integration metrics, and a stable leadership operating cadence under the current
              CEO.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports continued diligence, not a purchase decision. Multiple company, partner, and
              independent profile sources consistently describe an integrated cloud SIEM platform, while the AWS partner
              case provides concrete operating-scale and cost-performance signals. Those facts establish product
              substance, but they do not establish equity value. Security Stack reports a more-than-$1 billion growth
              investment led by Vista in 2022; that is financing history, not a current valuation, current cash balance,
              or price available to a new investor. The assigned evidence also lacks current revenue, ARR, margins,
              retention, cash flow, net debt, share count, and liquidation preferences. Public cybersecurity multiples
              therefore supply only a cautionary reference: the recommendation remains research more / track, confidence
              is medium-low, risk is high, and the valuation stance is indeterminate pending private diligence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
