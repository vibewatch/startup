chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Securonix is consistently described across company-controlled and third-party profiles as a cloud-native
              security operations platform built around Unified Defense SIEM, combining SIEM, UEBA, SOAR, threat
              intelligence, and TDIR workflows. Public identity signals are directionally consistent but not perfectly
              clean: current retained profiles all place the company in North Texas, yet Security Stack and LinkedIn
              point to Plano while TechBag states Addison. Scale evidence is also directional rather than audited.
              LinkedIn and Security Stack support only a 501-1,000 employee band, while the AWS modernization case study
              is the strongest public scale proxy on the customer side, stating that the platform protects over 300
              global enterprises and processes more than 78 million security events per second. The deployment model
              remains cloud-centric: Securonix offers BYO-AWS flexibility for customer data placement, but retained
              evidence does not support a true air-gapped or on-premises control plane.
