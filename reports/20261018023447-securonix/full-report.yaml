  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Enterprise scale converts into durable recurring growth; technical efficiency reaches margins; financing terms
          are clean.
        - Valuation range unavailable until audited ARR, margins, net debt, and ownership are disclosed.
        - >-
          Supported only if private data show strong growth, retention, cash conversion, and limited preference
          overhang.
        - Technical gains fail to convert into customer expansion or cash generation.
      - - Base
        - The platform remains relevant and scaled, but disclosure and monetization evidence stay incomplete.
        - >-
          Valuation range unavailable; require a material private-company discount to any selected public comp after
          denominator verification.
        - Best aligned with the current mixed evidence quality and missing financial packet.
        - Entry pricing assumes premium public multiples without comparable disclosure or free cash flow.
      - - Bear
        - >-
          Growth or retention disappoints, leverage or preferences subordinate new capital, or AI positioning does not
          improve economics.
        - No entry value is supportable; wait for repricing or decline the investment.
        - Triggered by weak cohorts, high burn, concentrated customers, or an unfavorable liquidation waterfall.
        - A down round, covenant stress, or preference stack absorbs common-equity upside.
    notes: >-
      Scenario ranges are explicitly unavailable because current Securonix revenue, ARR, cash flow, net debt, share
      count, and financing preferences are not disclosed in the assigned evidence.
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV011
