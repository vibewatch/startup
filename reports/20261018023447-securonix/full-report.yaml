            title: Capital adequacy remains a diligence blocker
            body: >-
              Securonix appears scaled and well funded historically, yet none of the retained public sources disclose
              the current cash balance, burn, runway, debt obligations, or customer concentration metrics that would
              make the private-company capital story investable.
            calloutType: risk
            claimRefs:
