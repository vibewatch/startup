      - number: '5.3'
        title: Maturity, controls, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Securonix’s public maturity case is strongest where the evidence is operationally concrete: AWS reports
              99.99% availability across modernized Spark workloads, while Help Net Security describes governance
              features such as human approval, auditability, reversibility, and separation of duties around Agentic
              Mesh. Those are useful proof points, but they do not close the most important product-tech diligence
              questions. The retained set does not independently verify current certifications, exact connector breadth,
              false-positive performance, or a meaningful public developer/practitioner surface comparable to open
              tooling ecosystems. For regulated buyers, the investment question is therefore not whether Securonix has
              feature breadth, but whether its cloud operating model and claimed controls match the buyer’s residency,
              assurance, and implementation requirements.
            claimRefs:
              - CE004
              - CE008
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments skew toward enterprise SOCs and MSSPs
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently place Securonix in security-operations budgets rather than in broad IT
              or line-of-business software spend. Securonix's own positioning emphasizes MTTR, board-visible ROI, and
              threat-response outcomes, while third-party sources describe the platform as a cloud-native SIEM used by
              enterprise security teams and by MSSPs running multi-tenant services. That combination matters because it
              suggests the product wins where a buyer can justify an operational platform decision, not where a smaller
              team wants a light monitoring tool. Public evidence for named paying accounts is thin, but the
              segmentation signal itself is strong and consistent across official, partner, and review surfaces.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU008
              - CU013
          - type: table
