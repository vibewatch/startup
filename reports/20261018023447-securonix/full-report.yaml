  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Public company and market-facing sources now describe Securonix as more than a standalone SIEM SKU. The
              current packaging centers on Unified Defense SIEM, which the company says combines SIEM, UEBA, SOAR, TIP,
              and TDIR in one cloud-native platform, with Agentic AI layered on top for triage, investigation, and
              response work. The product story is therefore a workflow claim: collect telemetry, enrich and prioritize
              detections, orchestrate investigations, and reduce analyst effort rather than simply warehouse logs.
              Channel evidence also matters because the platform is sold into large enterprise SOC environments and is
              still delivered through MSSP/MDR partners, which affects deployment depth, operating expectations, and
