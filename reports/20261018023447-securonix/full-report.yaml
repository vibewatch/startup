      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most visible target accounts are large enterprise SOCs and managed security service providers rather
              than small teams buying a single alerting tool. The user is the operational security team - analysts,
              detection engineers, and incident responders - but the economic buyer is more likely the CISO or SOC
              leadership because the promise is lower response time, lower data-handling cost, and better board-facing
              control. Securonix's own messaging ties the purchase to response-time improvement, analyst productivity,
              data-pipeline flexibility, and outcome-based pricing, which suggests adoption is triggered when the buyer
              is trying to retire a fragmented SIEM-plus-point-tools environment or justify a cloud migration without
              losing threat-context depth. MSSPs appear as a distinct segment because multi-tenancy, customer density,
              and operational scalability are repeatedly emphasized in the retained evidence.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM009
