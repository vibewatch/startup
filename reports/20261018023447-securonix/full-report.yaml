  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitution
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than legacy log management and narrower than the entire cybersecurity
              stack. Across Securonix's homepage, product page, LinkedIn profile, and an independent vendor directory,
              the company is described as a cloud-native or unified defense platform that bundles SIEM, UEBA, SOAR,
              threat intelligence, and related detection and response workflows into one operating surface. That means
              the included spend is the control plane for security operations: telemetry ingestion, analytics,
              behavioral detection, contextual enrichment, response orchestration, and data-routing economics. The
              excluded spend is everything that remains a separate system of record or point defense, including endpoint
              tools, network appliances, generic observability, and standalone IT workflow tools. The status-quo
              substitute is therefore not one competitor but a fragmented SOC stack and the manual labor needed to
              stitch it together.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and demand lenses
        blocks:
          - type: paragraph
            body: >-
              This source set does not give a clean public TAM/SAM/SOM estimate for cloud SIEM or unified defense
              platforms, so the usable sizing evidence is proxy-based. On the demand side, Verizon says the 2026 DBIR
              analyzes thousands of incidents globally and that phishing, stolen credentials, software-vulnerability
              exploitation, and ransomware remain frequent breach causes, while CISA's KEV catalog showed 1,748 results
              on the accessed page and explicitly tells organizations to use the catalog in vulnerability-prioritization
              programs. On the served-market side, AWS says Securonix protects over 300 global enterprises, processes
              more than 78 million security events per second, and runs more than 40 EKS clusters that each support
              20-50 customers and over 10,000 concurrent Spark jobs. Vista's 2021 growth investment announcement adds
              historical demand validation, but it should be treated as a dated strategic signal, not a current
              market-size estimate.
            claimRefs:
              - CM006
