      - number: '1.3'
        title: Capital History, Strategic Milestones, and Unresolved Public Gaps
        blocks:
          - type: paragraph
            body: >-
              The clearest capitalization fact in the retained pool is not a full financing history but a single major
              marker: Security Stack says Securonix received a Vista Equity Partners-led growth investment of more than
              $1 billion in 2022, supporting a privately held, PE-backed profile without fixing today's valuation or
              ownership split. Security Stack also says Securonix acquired threat intelligence vendor ThreatQuotient in
              June 2025, while the product and partner sources together show a multi-year platform arc from the 2021
              Jupiter release to the 2023 Unified Defense SIEM relaunch, a 2024-initiated AWS modernization program, and
              a February 2026 Agentic AI commercialization push around Sam and Agentic Mesh. The biggest remaining gaps
              are economic and governance, not identity. Retained sources still do not disclose current valuation,
              audited revenue or ARR, precise logo count, board seats, debt or credit facilities, or liquidation terms.
              Those omissions materially limit any downstream ownership, dilution, or cash-efficiency judgment.
