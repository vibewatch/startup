  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: |-
              Public evidence is consistent that Securonix sells a cloud-native security operations platform
              centered on Unified Defense SIEM, with enterprise security teams and managed security service
              providers as the primary buyer set. The monetization picture is directionally clear but
              operationally opaque. Official surfaces emphasize the bundled value proposition - SIEM, UEBA,
              SOAR, threat intelligence, automation, and optional managed-response style capabilities - but
              do not publish a standard price card. Third-party surfaces fill some of that gap with
              directional evidence rather than a reliable contract schedule: MSP Tools points buyers back to
              the official site for current pricing and notes a free trial, AWS Marketplace reviewers
              describe pricing as reasonable relative to Splunk and Exabeam, and one reviewer reports an
              EPS-based licensing construct in the $50-$60 per EPS range for that deployment context.

              TechBag adds a different and more current pricing frame, describing GB/day metering with a
              capacity band, hybrid commitment, pay-as-you-go usage, and negotiated overages, plus a newer
              AI-agent SKU priced on measured analyst productivity rather than seats or data volume. That
              mix suggests revenue quality is tied to custom enterprise packaging rather than a simple
              published catalog. It likely supports larger account values and expansion levers, but it also
              means outside investors cannot infer realized ASPs, discounting, or renewal uplift from public
              list pricing alone. The core question is not whether Securonix charges for value; it is that
              public evidence does not show which meter dominates bookings, whether legacy EPS contracts are
              still common, or how much mix shift the new AI and data-routing products can generate.
            claimRefs:
