  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >
              The first underwriting risk is deployment-model fit, not product breadth. TechBag's 2026 write-up says
              Securonix still has no air-gapped or on-premises option, and its description of BYO-AWS/BYO-Snowflake
              aligns with Securonix's older BYO-AWS announcement that kept the core application under vendor operation.
              That matters because the same 2026 risk environment still features actively exploited vulnerabilities and
              tighter disclosure expectations, so buyers in highly regulated environments may want more direct control
              than Securonix's architecture allows. The second risk is operational friction: an adverse competitor
              explainer cites support, query, integration, and log-collector issues, while Securonix's own 2021 release
              shows it has had to invest in onboarding automation and ingestion visibility to reduce implementation
              pain. The third risk is commercial and execution volatility: Securonix is mixing telemetry-metered
              pricing, new AI-product pricing, PE-backed ownership, a recent acquisition, and a third CEO in two years,
              which is enough change to require hard diligence before treating the current roadmap as stable.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory and deployment-fit risk
        blocks:
          - type: paragraph
            body: >
              Securonix does have trust signals, but they do not erase architecture-fit risk. BitLyft says the cloud
              platform carries SOC 2 Type 2, ISO 27001:2013, and HITRUST CSF certifications, which is useful evidence
              that the company has invested in security and privacy controls. The harder question is whether that
              control set is enough for buyers that require stricter isolation, sovereign-control, or
              incident-disclosure mechanics. TechBag says there is still no air-gapped option, and its current
              control-plane description matches the older BYO-AWS release that left the core SIEM application on
              Securonix's own AWS account. That narrows the addressable set for customers whose policy requires vendor
              separation to extend beyond data residency. The chapter's legal/regulatory diligence should therefore
              focus less on generic compliance badges and more on deployment exceptions, incident-reporting workflows,
              and whether Securonix can satisfy contract language for highly regulated environments without bespoke
              concessions.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
