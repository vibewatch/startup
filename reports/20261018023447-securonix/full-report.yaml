      - number: '3.2'
        title: Where Securonix differentiates
        blocks:
          - type: paragraph
            body: >-
              Retained evidence supports a consistent product-shape story even when it does not fully settle the
              commercial story. Independent and company-linked sources agree that Securonix is selling a unified
              platform that combines SIEM, UEBA, SOAR, and threat intelligence, and they repeatedly highlight always-hot
              retention, a Snowflake-based data layer, and large connector breadth. Those attributes make the product
              easier to position against incumbents that still force explicit trade-offs between analytics coverage,
              storage cost, and response tooling. Security Stack also adds concrete trust and compliance signals — SOC 2
              Type II, HITRUST, and a GDPR program — which help explain why Securonix can credibly pursue
              large-enterprise and MSSP workloads rather than only departmental deployments.


              AWS’s architecture write-up matters because it turns marketing language into operating evidence. A system
              spanning more than 40 EKS clusters, 10,000 concurrent Spark jobs, and 99.99% availability across Spark
              workloads is not proof of customer love, but it is proof that Securonix has built for large-scale managed
              operations. Relative to Splunk, Microsoft, or Rapid7, the public moat in this pool is not a unique
              competitor list — everyone has credible alternatives — but an integrated workflow plus scale narrative
              that is still distinct enough to win accounts that prioritize hot-retention search, behavior analytics,
              and managed-service execution over pure bundle convenience.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The main competitive risk is that Securonix’s strongest architecture claims sit beside messy public
              commercial signals. PeerSpot says Microsoft wins attention with better ecosystem integration, more
              mindshare, and packaging that often rides broader Microsoft 365 contracts, which is exactly the kind of
              incumbent response that can neutralize a technically richer challenger. On the Securonix side, public
              sources disagree on whether pricing is GB/day or user-based and whether deployment really extends to
              on-premises or whether BYO variants still leave the control plane in Securonix’s cloud. Those conflicts do
              not disprove the product; they do reduce confidence that a buyer will experience the commercial model the
              same way across segments.


              There is also real adverse evidence on execution. PeerSpot says Securonix still needs better UX, simpler
              analytics/visualization, and cleaner integrations, while Kandi Brian notes practitioner feedback that
              large multi-tenant MSSP environments can become operationally complex. That combination suggests the moat
              is durable only where customers value depth and integrated workflow enough to tolerate onboarding and
              operating complexity. If Microsoft, Splunk, or other incumbents keep narrowing the feature gap while
              preserving distribution leverage or clearer packaging, Securonix’s differentiation could compress faster
              than the product roadmap implies.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Best fit is the buyer escaping fragmented SOC tooling
            body: >-
              Securonix looks strongest where the incumbent is an expensive mix of tools and delayed historical search,
              not where the buyer already gets acceptable coverage inside a Microsoft or Splunk-centered estate.
            calloutType: insight
