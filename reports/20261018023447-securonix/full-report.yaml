              - CU003
              - CU005
              - CU007
              - CU008
      - number: '6.2'
        title: Production-use evidence is stronger than named-logo disclosure
        blocks:
          - type: paragraph
            body: >-
              The best public proof that Securonix is running in production comes from operating-scale and
              customer-review evidence rather than from polished logo pages. AWS says Securonix is protecting more than
              300 global enterprises, processes more than 78 million security events per second, and migrated hundreds
              of enterprise customers with minimal disruption during its infrastructure modernization. TrustRadius
              reviews add direct, first-person descriptions of live usage across enterprise and MSSP environments,
              including log monitoring, threat detection, posture management, and commercial monitoring services. What
              is still missing is a robust named-reference set: most retained customer proof is anonymous or
              segment-level, so production deployment is supportable but customer identity and revenue importance are
              not.
            claimRefs:
              - CU004
              - CU005
