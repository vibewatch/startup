              - CV003
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on product breadth, enterprise deployment, and a plausible efficiency path. Securonix,
              partner, and profile sources describe SIEM, UEBA, SOAR, and threat intelligence in one platform. AWS
              reports more than 300 global enterprises, over 78 million security events per second, and an approximate
              30% cost-performance improvement from the EKS modernization. IBM's 2026 discussion of controls for agentic
              identities also supports the relevance of Securonix's AI-security positioning. The anti-thesis is evidence
              quality and monetization: the larger customer-count and ROI figures remain company-originated or
              partner-mediated, and no audited financial evidence connects technical performance to recurring revenue,
              retention, or free cash flow. Strong technology can still produce weak minority-investor returns if entry
              price, leverage, dilution, or preferences are unfavorable.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
      - number: '8.3'
        title: Financing, comparables, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The only retained Securonix financing marker is Security Stack's report of a growth investment exceeding
              $1 billion in 2022, alongside the 2025 ThreatQuotient acquisition. Neither item reveals the current
              enterprise value, equity value, cash available, debt load, or preference waterfall. TIKR's public-company
              data illustrate why a private-company haircut and explicit downside protection matter: it reports
              CrowdStrike at 18.76x NTM EV/Revenues, Palo Alto Networks at 11.27x, and a 4.03x peer-software median.
              These are reference points rather than a Securonix valuation range because the denominator needed for a
              multiple is missing. Bull, base, and bear cases must therefore remain conditional. Each case has an
              unavailable numeric range and a diligence trigger rather than a fabricated price target or return
              estimate.
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a target return, hold period, or exit-value calculation. Exit readiness
              depends first on a finance-quality data room: audited revenue and ARR, cohort retention, gross and
              operating margins, cash conversion, debt, and a fully diluted capitalization table. Commercial diligence
              must then reconcile Startup Defense's repetition of Securonix's more-than-one-thousand-team claim with the
              AWS partner case's more specific statement that the platform protects over 300 global enterprises. These
              denominators may describe different populations and should not be combined. The thesis breaks if verified
              growth is slowing, retention is weak, leverage or preferences absorb the equity upside, or the entry price
              assumes a public-leader multiple without public-leader disclosure and cash generation. A credible exit
              plan also requires evidence of likely strategic buyers or IPO readiness, neither of which appears in the
              assigned source set.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Continue diligence, but do not issue a buy recommendation or target return until current operating
              metrics, net debt, fully diluted ownership, and preference terms establish both the valuation numerator
              and denominator.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              Decline or wait for repricing if verified growth and retention do not support the proposed multiple, or if
              leverage, dilution, or preferences capture the upside before new minority capital.
            calloutType: risk
            claimRefs:
              - CV013
              - CV015
              - CV016
