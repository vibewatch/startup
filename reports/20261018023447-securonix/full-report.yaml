      - number: '2.4'
        title: Growth drivers, adoption constraints, and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are structural rather than cyclical: breach activity remains broad,
              exploited-vulnerability backlogs keep growing, and security teams are under pressure to unify detection
              with response while preserving evidence for boards and regulators. Securonix also leans into regulation as
              part of the buying narrative by explicitly naming SEC, GDPR, and DORA pressure alongside the need for
              faster disclosure and stronger third-party oversight. The constraints are just as important. Migration is
              not trivial: Securonix's own market-education material contrasts modern SIEM with legacy vendor lock-in
              and manual rule tuning, while AWS describes a 14-month modernization program just to re-architect core
              Spark workloads. That makes switching cost, trust in AI-guided workflows, and data-economics proof central
              to adoption timing. The biggest unresolved gap is still the absence of an independent, current public
              market model that isolates spend by geography, customer size, and bundle component.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Third-party comparison surfaces do not frame Securonix as a niche point tool; they place it in a broad
              SOC-modernization set. TrustRadius lists Splunk Enterprise, Splunk Enterprise Security, Microsoft
              Sentinel, IBM QRadar SIEM, Datadog, Splunk Cloud Platform, LevelBlue USM Anywhere, and Rapid7 InsightIDR
              as alternatives, which means buyers compare Securonix against both incumbent SIEM suites and adjacent
              XDR-style products rather than only against behavior-analytics specialists. That breadth matters because
              budget owners can solve the same job with a bundled Microsoft path, a classic SIEM incumbent, a lighter
              mid-market platform, or a fragmented internal stack stitched together from separate SIEM, SOAR, UEBA, and
              TIP tools.


              The status-quo substitute is also unusually important here. Securonix’s own positioning repeatedly attacks
              disconnected SIEM, SOAR, UEBA, and TIP estates as slow, siloed, and costly, so one real competitor is not
              a named vendor but the buyer’s existing collection of tools and workflows. In practice, Securonix seems
              strongest when the customer wants one cloud-native control plane for detection, investigation, response,
              and threat intelligence, and weaker when the account is already anchored to a dominant platform bundle or
              has reasons to preserve a best-of-breed stack.
            claimRefs:
              - CP005
              - CP006
              - CP007
