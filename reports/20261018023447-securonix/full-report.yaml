              - CR002
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.3'
        title: Operational reliability and security-execution risk
        blocks:
          - type: paragraph
            body: >
              The retained adverse evidence does not show a public catastrophe, but it does show recurring
              implementation and operating friction that can raise customer-acquisition cost and renewal risk. Exabeam's
              2026 explainer attributes to user feedback a mix of slow support response, difficult query creation,
              integration work, troubleshooting limits, and intermittent log-collector problems. That does not prove
              systematic failure, but it is directionally consistent with Securonix's own emphasis on data-onboarding
              automation, Activity Monitor, and content-as-a-service in the Jupiter release — features vendors usually
              prioritize when deployment, ingestion, and content freshness are operational pain points. The macro threat
              environment raises the bar further: CISA's KEV catalog and Verizon's 2026 DBIR both imply that detection
              vendors have to keep pace with fast-moving exploited vulnerabilities, credential misuse, and ransomware
              patterns. The operational question for diligence is whether Securonix's content, support, and platform
              engineering keep customers ahead of that pace without requiring unusually heavy internal tuning.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Commercial and execution risk
        blocks:
          - type: paragraph
            body: >
              The commercial model is promising but easy to underwrite incorrectly. TechBag says Securonix prices the
              core platform on GB per day and warns that overages default to 120 percent of the base rate if the
              contract does not reset them, while LinkedIn says the company now combines outcome-based pricing with
              claims of up to 50 percent storage and compute savings. Those claims may be true in tuned environments,
              but they create diligence risk because they depend on correct telemetry tiering, disciplined customer
              configuration, and credible measurement of "analyst productivity" when Sam is sold on that basis.
              Execution risk is amplified by sponsor ownership and leadership churn. SecurityStack says Vista led more
              than $1 billion of growth investment and that Securonix acquired ThreatQuotient in 2025; TechBag adds that
              Toby Weiss became CEO in June 2026 and is the company's third CEO in two years. None of that is fatal, but
              it does mean the investment case should break if management cannot show stable roadmap ownership, clean
              post-acquisition integration, and referenceable proof that pricing outcomes survive real-world telemetry
              growth.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
