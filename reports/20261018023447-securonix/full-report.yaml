      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: |-
              Public evidence confirms a scaled operating footprint and continuing infrastructure investment,
              but it is not enough to underwrite liquidity. The historical round chronology is addressed in
              Company Overview; it is not a substitute for current evidence on cash, debt, or financing
              needs. The retained financial set does not disclose the current cash balance, debt load, burn
              rate, covenant structure, or next-round trigger. Those omissions prevent a defensible runway
              calculation and leave investors unable to determine whether product expansion and support
              obligations can be funded internally.

              The financial verdict is therefore conditional. Revenue quality appears better than a pure
              single-product log-ingestion story because Securonix has multiple monetization levers - core
              SIEM subscription, data-tier controls, deployment variants, managed-response style services,
              and new AI productivity pricing - and it serves large enterprise environments. Margin path is
              plausible given the AWS efficiency gains and BYO deployment options, but still unproven
              because public disclosures do not reveal gross margin, net retention, customer concentration,
              or actual renewal economics. TechBag's note that the company is on its third CEO in two years
              adds execution risk at the same time disclosure remains thin. For diligence, management must
              provide current ARR or revenue, gross and operating margins, cash and burn, contract mix, and
              concentration metrics before the capital story becomes underwritable.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI014
              - CI015
