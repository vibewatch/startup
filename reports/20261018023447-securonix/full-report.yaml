      - number: '6.3'
        title: Durability is under-documented while implementation friction is visible
        blocks:
          - type: paragraph
            body: >-
              Public customer-quality signals are directionally positive but incomplete for underwriting durability.
              PeerSpot reports a 96 percent willingness-to-recommend rate for Securonix's reviewers, yet the same page
              says Microsoft Sentinel is favored in the comparison, and user feedback highlights higher setup cost, a
              steeper learning curve, and weaker multi-cloud support. TrustRadius reviews add similar warnings around
              legacy-system integration, parsing mismatches, RBAC complexity, and reporting gaps. The combination
              supports a view that Securonix can land in sophisticated environments that value scale and analytics, but
              that expansion and renewal quality cannot be proven from public NRR, GRR, churn, contract-length, or
              concentration disclosures in the retained set.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
