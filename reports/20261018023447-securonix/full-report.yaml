      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: |-
              The strongest public unit-economics evidence comes from infrastructure and deployment details,
              not from disclosed financial statements. AWS and Securonix describe a platform protecting over
              300 global enterprises and processing more than 78 million security events per second, with a
              Spark environment modernized onto more than 40 Amazon EKS clusters, over 10,000 concurrent
              jobs, and 5,000-6,000 EC2 instances. Those details imply meaningful cloud-compute and data
              pipeline costs, which makes pricing architecture and data-tier management central to gross
              margin. The same AWS case study reports approximately 30% cost-performance improvement and
              3-5% operating-efficiency benefit after modernization, which is a positive signal for margin
              leverage if customer growth continues.
              Public buyer feedback is more mixed on realized economics. Reviewers describe the product as
              Public buyer feedback is more mixed on realized economics. Reviewers describe the product as
              scalable and comparatively affordable, but they also call out integration effort, log-parsing
              and query-stability problems, premium support dependence, and a roughly year-long
              value-realization period in at least one account.
              Meanwhile, Securonix's own product positioning stresses pricing predictability, flexible
              deployment, content-as-a-service, and BYO-AWS architecture, all of which are best read as
              gross-margin levers rather than proof of margin outcomes. The business may have attractive
              operating leverage once scale is reached, but public evidence is still missing the decisive
              metrics: realized gross margin, services mix, retention, support burden, and expansion rates.
            claimRefs:
