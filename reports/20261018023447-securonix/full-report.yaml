      - number: '1.2'
        title: Leadership Visibility, Governance Opacity, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Publicly retained evidence exposes leadership transition risk more clearly than it exposes governance
              detail. The April 2023 Unified Defense SIEM launch was fronted by then-Chief Executive Officer Nayaki
              Nayyar, while TechBag says Toby Weiss became chief executive in June 2026 and characterizes him as the
              company's third CEO in two years. That cadence suggests a real diligence need around operating continuity,
              board sponsorship, and decision rights even though product direction appears broadly consistent. Retained
              sources also surface named technical leaders rather than a full executive roster: Tanuj Gulati appears as
              CTO in the 2021 Jupiter release and Sanjeev Kishore Yarnapati appears as Director of Infrastructure
              Engineering in the AWS case study. The result is moderate-to-high key-person dependence: the company shows
              enough technical bench to support execution, but not enough public governance disclosure to underwrite
              board composition, succession planning, or control dynamics from open sources alone.
            claimRefs:
              - CO007
              - CO011
              - CO012
