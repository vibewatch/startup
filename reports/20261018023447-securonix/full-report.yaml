      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence supports real production use in complex environments
            body: >-
              AWS-scale telemetry plus first-person review commentary make it credible that Securonix is operating in
              live enterprise and MSSP settings, not just in pilot evaluations.
            calloutType: strength
            claimRefs:
              - CU003
