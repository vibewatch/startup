  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests Securonix converts customer telemetry and usage into recurring platform revenue through
      metered SIEM contracts, optional deployment choices, and newer AI or service add-ons rather than through a single
      transparent list-price catalog.
    data:
      nodes:
        - id: telemetry
          label: Customer telemetry and identities
          note: >-
            AWS says security data flows from customer environments, and Securonix positions the product for large
            enterprise SOCs and MSSPs.
        - id: meter
          label: Contract meter
          note: >-
            Public evidence points to EPS-based pricing in some accounts and GB/day bands in newer channel commentary;
            list price is not public.
        - id: core
          label: Core Unified Defense SIEM
          note: Core platform bundles SIEM, UEBA, SOAR, and threat intelligence.
        - id: options
          label: Add-on value layers
          note: Sam AI productivity pricing and Data Pipeline Manager expand monetization and cost-control paths.
        - id: deployment
          label: Deployment and cost allocation
          note: >-
            BYO AWS keeps the core app on Securonix while ingestion, processing, and storage can sit in the customer's
            AWS account.
        - id: renewal
          label: Renewal and margin outcome
          note: >-
            AWS reports ~30% cost-performance improvement, but public sources still do not disclose gross margin, NRR,
            or customer concentration.
      edges:
        - from: telemetry
          to: meter
          label: Security data creates billable scale
        - from: meter
          to: core
          label: Metered contract buys the core platform
        - from: core
          to: options
          label: Buyers can add services and AI layers
        - from: core
          to: deployment
          label: Deployment choice shifts who bears infrastructure cost
        - from: deployment
          to: renewal
          label: Cost structure and ROI shape renewals and margin
    approximationNotes: >-
      This is a qualitative revenue bridge from retained public evidence, not a quantified waterfall of reported
      dollars.
