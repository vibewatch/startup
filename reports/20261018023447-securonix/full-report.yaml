  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Integrated platform breadth
        - Company, partner, and profile sources consistently describe SIEM, UEBA, SOAR, and threat intelligence.
        - Independent customer references must verify deployment quality and renewal behavior.
      - - Thesis
        - Enterprise operating scale
        - AWS reports over 300 global enterprises and more than 78 million security events per second.
        - Audited recurring revenue and gross-margin data must show that scale monetizes.
      - - Anti-thesis
        - Commercial outcomes are mostly issuer claims
        - >-
          The up-to-50% cost reduction, 50% analyst-efficiency improvement, and up-to-60% response-time reduction come
          from Securonix's LinkedIn profile.
        - Customer-level measurements and cohort data would raise confidence.
      - - Anti-thesis
        - Equity economics are opaque
        - Current valuation, net debt, dilution, and preferences are absent from the assigned evidence.
        - A clean cap table, debt schedule, and liquidation waterfall could remove the blocker.
    notes: >-
      Evidence classifications reflect the content issuer: company LinkedIn and syndicated releases remain
      company-issued, while the AWS case remains partner evidence.
