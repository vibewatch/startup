company:
  name: Securonix
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a cloud-SIEM revenue model with enterprise-scale throughput, but not
    a clean underwriting model. Securonix shows multiple monetization signals - usage-based
    SIEM pricing, optional AI and service layers, and deployment choices that shift infrastructure
    cost between vendor and customer - while core underwriting inputs such as ARR, gross margin,
    burn, runway, and customer concentration remain undisclosed.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing visibility
    body: |-
      Public evidence is consistent that Securonix sells a cloud-native security operations platform
      centered on Unified Defense SIEM, with enterprise security teams and managed security service
      providers as the primary buyer set. The monetization picture is directionally clear but
      operationally opaque. Official surfaces emphasize the bundled value proposition - SIEM, UEBA,
      SOAR, threat intelligence, automation, and optional managed-response style capabilities - but
      do not publish a standard price card. Third-party surfaces fill some of that gap with
      directional evidence rather than a reliable contract schedule: MSP Tools points buyers back to
      the official site for current pricing and notes a free trial, AWS Marketplace reviewers
      describe pricing as reasonable relative to Splunk and Exabeam, and one reviewer reports an
      EPS-based licensing construct in the $50-$60 per EPS range for that deployment context.

      TechBag adds a different and more current pricing frame, describing GB/day metering with a
      capacity band, hybrid commitment, pay-as-you-go usage, and negotiated overages, plus a newer
      AI-agent SKU priced on measured analyst productivity rather than seats or data volume. That
      mix suggests revenue quality is tied to custom enterprise packaging rather than a simple
      published catalog. It likely supports larger account values and expansion levers, but it also
      means outside investors cannot infer realized ASPs, discounting, or renewal uplift from public
      list pricing alone. The core question is not whether Securonix charges for value; it is that
      public evidence does not show which meter dominates bookings, whether legacy EPS contracts are
      still common, or how much mix shift the new AI and data-routing products can generate.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics proxies
    body: |-
      The strongest public unit-economics evidence comes from infrastructure and deployment details,
      not from disclosed financial statements. AWS and Securonix describe a platform protecting over
      300 global enterprises and processing more than 78 million security events per second, with a
      Spark environment modernized onto more than 40 Amazon EKS clusters, over 10,000 concurrent
      jobs, and 5,000-6,000 EC2 instances. Those details imply meaningful cloud-compute and data
      pipeline costs, which makes pricing architecture and data-tier management central to gross
      margin. The same AWS case study reports approximately 30% cost-performance improvement and
      3-5% operating-efficiency benefit after modernization, which is a positive signal for margin
      leverage if customer growth continues.
      Public buyer feedback is more mixed on realized economics. Reviewers describe the product as
      Public buyer feedback is more mixed on realized economics. Reviewers describe the product as
      scalable and comparatively affordable, but they also call out integration effort, log-parsing
      and query-stability problems, premium support dependence, and a roughly year-long
      value-realization period in at least one account.
      Meanwhile, Securonix's own product positioning stresses pricing predictability, flexible
      deployment, content-as-a-service, and BYO-AWS architecture, all of which are best read as
      gross-margin levers rather than proof of margin outcomes. The business may have attractive
      operating leverage once scale is reached, but public evidence is still missing the decisive
      metrics: realized gross margin, services mix, retention, support burden, and expansion rates.
    claimRefs: [CI003, CI004, CI007, CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: |-
      Public evidence confirms a scaled operating footprint and continuing infrastructure investment,
      but it is not enough to underwrite liquidity. The historical round chronology is addressed in
      Company Overview; it is not a substitute for current evidence on cash, debt, or financing
      needs. The retained financial set does not disclose the current cash balance, debt load, burn
      rate, covenant structure, or next-round trigger. Those omissions prevent a defensible runway
      calculation and leave investors unable to determine whether product expansion and support
      obligations can be funded internally.

      The financial verdict is therefore conditional. Revenue quality appears better than a pure
      single-product log-ingestion story because Securonix has multiple monetization levers - core
      SIEM subscription, data-tier controls, deployment variants, managed-response style services,
      and new AI productivity pricing - and it serves large enterprise environments. Margin path is
      plausible given the AWS efficiency gains and BYO deployment options, but still unproven
      because public disclosures do not reveal gross margin, net retention, customer concentration,
      or actual renewal economics. TechBag's note that the company is on its third CEO in two years
      adds execution risk at the same time disclosure remains thin. For diligence, management must
      provide current ARR or revenue, gross and operating margins, cash and burn, contract mix, and
      concentration metrics before the capital story becomes underwritable.
    claimRefs: [CI005, CI006, CI011, CI014, CI015]
