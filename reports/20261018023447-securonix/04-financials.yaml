    rows:
      - ["Enterprise customer scale", "300+ global enterprises", "Medium", "Shows Securonix sells into environments large enough to sustain enterprise support and infrastructure spend", "Confirm current paying-customer count, MSSP mix, and revenue concentration"]
      - ["Operational scale", "78M+ security events/sec; 10,000+ Spark jobs; 5,000-6,000 EC2 instances", "Medium", "Indicates significant cloud compute and data-processing cost base", "Provide COGS split across compute, storage, support, and third-party software"]
      - ["Cost-efficiency improvement", "~30% cost-performance improvement; 3-5% operating-efficiency gain", "Medium", "Supports a plausible gross-margin expansion path if scale holds", "Show pre/post modernization unit cost and current gross margin"]
      - ["Value realization / payback", "At least ~1 year in one reviewer account", "Low", "Suggests sales claims may take time to convert into buyer ROI and stable renewals", "Provide deployment-to-value time, renewal rates, and payback by segment"]
      - ["Implementation and support burden", "Integration, log-parsing, and query-stability issues appear in user reviews", "Low", "Customer-specific integration work and support escalation can raise delivery cost and renewal risk", "Provide implementation hours, support cost per account, escalation rates, and premium-support attach"]
      - ["Current ARR / revenue / gross margin / NRR", null, "Low", "These are the core underwriting metrics and they remain undisclosed in retained public sources", "Disclose current ARR or revenue, gross margin, NRR, and cohort retention by vintage"]
    notes: "Null means no retained public source disclosed the metric; reviewer anecdotes are directional only and should not be treated as audited unit-economics evidence."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests Securonix converts customer telemetry and usage into recurring
      platform revenue through metered SIEM contracts, optional deployment choices, and newer AI or
      service add-ons rather than through a single transparent list-price catalog.
    data:
      nodes:
        - id: telemetry
          label: Customer telemetry and identities
          note: "AWS says security data flows from customer environments, and Securonix positions the product for large enterprise SOCs and MSSPs."
        - id: meter
          label: Contract meter
          note: "Public evidence points to EPS-based pricing in some accounts and GB/day bands in newer channel commentary; list price is not public."
        - id: core
          label: Core Unified Defense SIEM
          note: "Core platform bundles SIEM, UEBA, SOAR, and threat intelligence."
        - id: options
          label: Add-on value layers
          note: "Sam AI productivity pricing and Data Pipeline Manager expand monetization and cost-control paths."
        - id: deployment
          label: Deployment and cost allocation
          note: "BYO AWS keeps the core app on Securonix while ingestion, processing, and storage can sit in the customer's AWS account."
        - id: renewal
          label: Renewal and margin outcome
          note: "AWS reports ~30% cost-performance improvement, but public sources still do not disclose gross margin, NRR, or customer concentration."
      edges:
        - from: telemetry
          to: meter
          label: Security data creates billable scale
        - from: meter
          to: core
          label: Metered contract buys the core platform
        - from: core
          to: options
          label: Buyers can add services and AI layers
        - from: core
          to: deployment
          label: Deployment choice shifts who bears infrastructure cost
        - from: deployment
          to: renewal
          label: Cost structure and ROI shape renewals and margin
    approximationNotes: "This is a qualitative revenue bridge from retained public evidence, not a quantified waterfall of reported dollars."
    claimRefs: [CI001, CI004, CI005, CI006, CI008, CI011, CI016]
callouts:
  - calloutType: insight
    title: Public pricing is directional, not underwritable
    body: >-
      The retained set suggests multiple contract meters - EPS, GB/day, free-trial-led funnel, and
      productivity-based AI pricing - but not the realized contract mix, discounting, or renewal
      uplift needed to model revenue quality with confidence.
    claimRefs: [CI002, CI004, CI005, CI006]
  - calloutType: risk
    title: Capital adequacy remains a diligence blocker
    body: >-
      Securonix appears scaled and well funded historically, yet none of the retained public sources
      disclose the current cash balance, burn, runway, debt obligations, or customer concentration
      metrics that would make the private-company capital story investable.
    claimRefs: [CI014]
