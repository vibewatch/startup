  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current cash balance, burn rate, runway, debt or credit facilities, and any financing covenants."
      whyItMatters: "Without current liquidity data, an investor cannot underwrite whether Securonix can fund product investment, support, and post-acquisition integration without another financing event."
      diligencePath: "Request the latest board package or management KPI deck with monthly cash, burn, debt, and runway, plus any lender covenants and next-round planning assumptions."
      relatedQuestionRefs: [QI007]
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: "Executed customer contracts or pricing waterfalls showing whether legacy EPS, GB/day, or AI-productivity meters dominate realized ARR."
      whyItMatters: "Public packaging signals are inconsistent, so revenue quality, gross margin, and expansion mechanics cannot be modeled from public pages alone."
      diligencePath: "Obtain redacted order forms, renewal quotes, and product-attach data for the top customer cohorts and MSSP partners."
      relatedQuestionRefs: [QI002, QI003]
      relatedTableRefs: [TI002]
    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: "Current ARR or revenue, gross margin, NRR, services mix, customer concentration, and renewal cohorts."
      whyItMatters: "These metrics determine whether the business has durable recurring economics or a heavier service-and-support burden than product positioning implies."
      diligencePath: "Request audited or board-approved financial statements plus cohort retention and concentration reports segmented by enterprise, MSSP, and geography."
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI001, TI003]
