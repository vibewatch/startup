    title: Evidence supports real production use in complex environments
    body: AWS-scale telemetry plus first-person review commentary make it credible that Securonix is operating in live enterprise and MSSP settings, not just in pilot evaluations.
    claimRefs: [CU003, CU004, CU005, CU008]
  - calloutType: risk
    title: Retention quality is still a diligence gap
    body: External users report value, but public evidence still does not disclose renewal behavior, contraction, top-account concentration, or partner-channel dependence.
    claimRefs: [CU010, CU011, CU012]
