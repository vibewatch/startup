company:
  name: Securonix
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to Securonix selling primarily to enterprise security teams and MSSPs,
    with AWS describing a deployment footprint serving more than 300 global enterprises and a
    multi-tenant estate that supports 20-50 customers per cluster. The proof of production use is
    real but skewed toward partner-authored scale evidence and anonymous review-platform testimony;
    the retained set adds one historical named beta reference, while retention and concentration
    metrics remain undisclosed.
sections:
  - id: customer-segments
    title: Customer segments skew toward enterprise SOCs and MSSPs
    body: >-
      The retained sources consistently place Securonix in security-operations budgets rather than
      in broad IT or line-of-business software spend. Securonix's own positioning emphasizes MTTR,
      board-visible ROI, and threat-response outcomes, while third-party sources describe the
      platform as a cloud-native SIEM used by enterprise security teams and by MSSPs running
      multi-tenant services. That combination matters because it suggests the product wins where a
      buyer can justify an operational platform decision, not where a smaller team wants a light
      monitoring tool. Public evidence for named paying accounts is thin, but the segmentation
      signal itself is strong and consistent across official, partner, and review surfaces.
    claimRefs: [CU001, CU002, CU003, CU007, CU008, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: production-proof
    title: Production-use evidence is stronger than named-logo disclosure
    body: >-
      The best public proof that Securonix is running in production comes from operating-scale and
      customer-review evidence rather than from polished logo pages. AWS says Securonix is
      protecting more than 300 global enterprises, processes more than 78 million security events
      per second, and migrated hundreds of enterprise customers with minimal disruption during its
      infrastructure modernization. TrustRadius reviews add direct, first-person descriptions of
      live usage across enterprise and MSSP environments, including log monitoring, threat
      detection, posture management, and commercial monitoring services. What is still missing is a
      robust named-reference set: most retained customer proof is anonymous or segment-level, so
      production deployment is supportable but customer identity and revenue importance are not.
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU012, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-friction
    title: Durability is under-documented while implementation friction is visible
    body: >-
      Public customer-quality signals are directionally positive but incomplete for underwriting
      durability. PeerSpot reports a 96 percent willingness-to-recommend rate for Securonix's
      reviewers, yet the same page says Microsoft Sentinel is favored in the comparison, and user
      feedback highlights higher setup cost, a steeper learning curve, and weaker multi-cloud
      support. TrustRadius reviews add similar warnings around legacy-system integration, parsing
      mismatches, RBAC complexity, and reporting gaps. The combination supports a view that
      Securonix can land in sophisticated environments that value scale and analytics, but that
      expansion and renewal quality cannot be proven from public NRR, GRR, churn, contract-length,
      or concentration disclosures in the retained set.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
