evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-revenue-disclosure
    missingEvidence: Current valuation, audited revenue or ARR, gross margin, burn, debt facilities, and capitalization terms.
    whyItMatters: >-
      Without current economics and capital-structure detail, the report cannot underwrite dilution, runway, or minority
      return outcomes.
    diligencePath: >-
      Request the latest board deck or audited financial package, current cap table, debt schedule, and any financing
      term sheets.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance-coverage
    missingEvidence: Full current executive roster, founder biographies, board composition, committee structure, and succession plan.
    whyItMatters: Leadership continuity and board control affect execution quality, accountability, and sponsor influence.
    diligencePath: Obtain an org chart, board observer list, committee charters, and biographies for founders and current executives.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-and-counterparty-coverage
    missingEvidence: Exact ownership percentages, customer concentration, partner contract terms, and acquisition integration metrics.
    whyItMatters: >-
      The stakeholder map is hypothesis-generating only until the economic and contractual weights behind each party are
      known.
    diligencePath: >-
      Request cap-table summaries, top-customer revenue concentration, partner agreements, and ThreatQuotient
      integration scorecards.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: exact-customer-scale
    missingEvidence: Exact paying-logo count, MSSP mix, retention metrics, and customer concentration data.
    whyItMatters: The AWS case confirms large scale but does not answer commercial durability or dependence on a few large accounts.
    diligencePath: Request customer cohorting, top-20 account revenue share, gross retention, net retention, and churn history.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent 2026 market-size work that isolates SIEM or security-analytics spend by geography, enterprise segment,
      and bundled workflow.
    whyItMatters: >-
      Without that split, valuation work must use demand proxies and served-scale signals instead of a defensible public
      TAM or SAM.
    diligencePath: >-
      Obtain current analyst-market-data or public-company disclosures that break out security-operations software spend
      and cloud-SIEM subsegments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Public procurement or customer budget evidence showing who signs and funds purchases across enterprise SOCs and
      MSSPs.
    whyItMatters: >-
      Buyer and payer roles are currently inferred from positioning language rather than documented purchasing
      authority.
    diligencePath: >-
      Retain customer case studies, RFPs, or public procurement records that name budget owner, deployment scope, and
      commercial trigger.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: deployment-flexibility
    missingEvidence: >-
      Primary product or contract documentation that cleanly defines whether any customer-hosted, on-premises, or
      air-gapped control-plane option exists today.
    whyItMatters: >-
      Deployment control is a decisive buying criterion against incumbents and can change the set of accounts where
      Securonix is even eligible.
    diligencePath: >-
      Request current solution-architecture documentation and a sales-engineering walkthrough that distinguishes BYO
      data residency from actual control-plane hosting choices.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: pricing-model
    missingEvidence: >-
      A current list-price, realized-price, or contract redline example that reconciles GB/day, user-based, and
      productivity-minute pricing across product packages.
    whyItMatters: >-
      Without a reconciled meter, any TCO comparison versus Microsoft, Splunk, or adjacent platforms is too fragile for
      underwriting.
    diligencePath: >-
      Collect current quote decks, example order forms, and at least one recent customer reference describing the actual
      billing metric used in production.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-by-segment
    missingEvidence: >-
      Segmented win-loss data showing where Securonix displaces Microsoft, Splunk, or status-quo internal stacks and
      where it loses on bundle economics or control requirements.
    whyItMatters: >-
      Competitive durability depends on whether Securonix wins often enough in its claimed sweet spots to offset
      incumbent ecosystem power.
    diligencePath: >-
      Request recent win-loss summaries by segment, including named reasons for losses tied to deployment, pricing, or
      usability.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, burn rate, runway, debt or credit facilities, and any financing covenants.
    whyItMatters: >-
      Without current liquidity data, an investor cannot underwrite whether Securonix can fund product investment,
      support, and post-acquisition integration without another financing event.
    diligencePath: >-
      Request the latest board package or management KPI deck with monthly cash, burn, debt, and runway, plus any lender
      covenants and next-round planning assumptions.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Executed customer contracts or pricing waterfalls showing whether legacy EPS, GB/day, or AI-productivity meters
      dominate realized ARR.
    whyItMatters: >-
      Public packaging signals are inconsistent, so revenue quality, gross margin, and expansion mechanics cannot be
      modeled from public pages alone.
    diligencePath: >-
      Obtain redacted order forms, renewal quotes, and product-attach data for the top customer cohorts and MSSP
      partners.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Current ARR or revenue, gross margin, NRR, services mix, customer concentration, and renewal cohorts.
    whyItMatters: >-
      These metrics determine whether the business has durable recurring economics or a heavier service-and-support
      burden than product positioning implies.
    diligencePath: >-
      Request audited or board-approved financial statements plus cohort retention and concentration reports segmented
      by enterprise, MSSP, and geography.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: compliance-controls
    missingEvidence: Current SOC 2, ISO, FedRAMP, or equivalent trust-center attestations tied to the platform.
    whyItMatters: Regulated buyers need independently verifiable assurance evidence, not just product-control narratives.
    diligencePath: Request the current trust package, audit letters, and security architecture review during diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: practitioner-signal
    missingEvidence: >-
      Public developer or practitioner signals such as repos, package metrics, forum traffic, public API usage, or other
      community proxies.
    whyItMatters: >-
      Without external practitioner evidence, it is harder to judge implementation depth, ecosystem health, and operator
      sentiment beyond vendor or partner narratives.
    diligencePath: >-
      Ask for customer-reference interviews, integration-community artifacts, and product-operations references from
      implementation partners.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: integration-breadth
    missingEvidence: Current independently verifiable connector count, supported-source matrix, and ATT&CK coverage map.
    whyItMatters: >-
      Integration depth and detection coverage drive deployment effort, false-negative risk, and total cost of
      ownership.
    diligencePath: Request the current integration catalog, detection-content matrix, and ATT&CK-mapping exports in diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public NRR, GRR, churn, renewal-rate, and contract-length metrics for the current installed base.
    whyItMatters: Without durability metrics, the customer story cannot distinguish broad deployment from sticky recurring revenue.
    diligencePath: >-
      Request board or lender materials with renewal cohorts, gross and net retention, contract terms, and top-20
      renewal history.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, channel-partner dependence, and segment-level ARR mix.
    whyItMatters: Concentration can change downside risk materially even when overall deployment breadth looks healthy.
    diligencePath: >-
      Request a current customer concentration schedule showing top accounts, partner-originated ARR, and any
      single-customer dependency thresholds.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Named production references or public case studies that tie customer identity to live deployment scope and
      outcomes.
    whyItMatters: Anonymous reviews confirm use but do not reveal which logos matter strategically or financially.
    diligencePath: >-
      Ask management for three reference calls spanning a large enterprise, an MSSP, and a recent expansion account,
      plus permissioned deployment summaries.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: litigation-regulatory-visibility
    missingEvidence: >-
      A current public or management-provided inventory of litigation, enforcement, sanctions, and material regulatory
      correspondence involving Securonix.
    whyItMatters: >-
      The assigned public pool does not prove a clean legal record, so underwriting cannot distinguish 'no issue' from
      'no retained evidence.'
    diligencePath: >-
      Request legal schedule, outside-counsel letter, regulatory questionnaire, and disclosure of any unresolved claims
      or notices.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Actual telemetry growth curves, overage incidence, tiering behavior, and post-implementation support load by
      customer cohort.
    whyItMatters: >-
      Metered pricing and AI-product claims can look attractive in marketing but destroy ROI if customer data routing or
      support demand is worse than forecast.
    diligencePath: >-
      Review contracted overage terms, customer usage curves, renewal cohorts, and three recent reference calls with
      similar data volumes.
  - type: missing-source
    severity: material
    topic: platform-incident-history
    missingEvidence: >-
      Independent evidence on recent Securonix outages, tenant-isolation issues, or customer-visible incident
      postmortems.
    whyItMatters: >-
      Operational diligence is incomplete without proof that platform resilience and support quality hold up under
      real-world failure conditions.
    diligencePath: >-
      Request the last 12 months of sev-1/sev-2 incidents, RCA summaries, support MTTR metrics, and customer references
      focused on outage handling.
  - type: private-evidence-only
    severity: material
    topic: valuation-inputs
    missingEvidence: Current revenue and ARR, growth, gross and operating margins, retention cohorts, cash flow, cash, and net debt.
    whyItMatters: These metrics provide the denominator and cash-generation evidence needed for a valuation range and target return.
    diligencePath: >-
      Obtain audited financial statements, the latest board KPI pack, debt schedules, and bank statements, then
      reconcile every metric to management's operating model.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fully diluted capitalization, Vista ownership and control, liquidation preferences, option dilution, acquisition
      consideration, and any secondary or recapitalization terms.
    whyItMatters: >-
      Enterprise value can translate into weak minority-equity returns when leverage, dilution, or preferences absorb
      proceeds.
    diligencePath: >-
      Review the cap table, charter, investor-rights agreements, debt documents, acquisition documents, and a
      management-certified liquidation waterfall.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: commercial-validation
    missingEvidence: >-
      Independent customer evidence on logo count, customer concentration, renewal cohorts, realized cost savings, and
      response-time improvements.
    whyItMatters: >-
      Company and partner claims do not establish that technical performance converts into durable retention and cash
      generation.
    diligencePath: >-
      Conduct reference calls selected from the customer ledger and reconcile contracts, invoices, renewals, and
      measured pre/post deployment outcomes.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Evidence of strategic-buyer interest, IPO readiness, audited-control maturity, or a board-approved exit plan and
      timing.
    whyItMatters: Without a credible exit path, neither hold period nor target return can be supported.
    diligencePath: >-
      Review board materials, banker engagement letters, audit history, control reports, and buyer or public-readiness
      workstreams.
    relatedQuestionRefs:
      - QV007
      - QV008
