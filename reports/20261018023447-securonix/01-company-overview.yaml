  rows:
  - - Vista Equity Partners
    - Lead growth-equity sponsor
    - Security Stack says Vista led a growth investment of more than $1B in 2022, making it the clearest named financial stakeholder in retained evidence.
    - Request ownership percentage, board seats, protective provisions, liquidation stack, and any secondary liquidity terms.
  - - ThreatQuotient
    - Acquired threat-intelligence asset
    - Security Stack says Securonix acquired ThreatQuotient in June 2025, implying product-integration and IP execution risk.
    - Verify purchase terms, integration milestones, earn-outs, retained talent, and IP encumbrances.
  - - Amazon Web Services
    - Infrastructure and modernization partner
    - 'AWS underpins the strongest public scale case: 40+ EKS clusters, 10,000+ Spark jobs, and 99.99% availability.'
    - Test cloud concentration risk, shared-security boundaries, discount structure, and migration portability.
  - - Snowflake
    - Data-cloud ecosystem partner
    - The 2023 Unified Defense SIEM launch tied 365 days of hot searchable data and product packaging to Snowflake.
    - Verify dependency depth, pass-through economics, switching friction, and roadmap coupling.
  - - Enterprise security teams and MSSPs
    - Core customer cohort
    - Security Stack says Securonix serves enterprise security teams and MSSPs, while AWS cites 300+ global enterprises protected.
    - Request exact logo count, concentration, MSSP mix, gross retention, NRR, and large-customer renewal history.
  notes: Stakeholder visibility is adequate for hypothesis generation but not for ownership underwriting. The retained pool names ecosystem dependencies and counterparties without exposing cap-table detail or customer concentration.
