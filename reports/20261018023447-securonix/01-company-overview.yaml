- id: TO003
  title: Stakeholder or investor map
  enumerationScope:
    coverage: sample
    basis: Sample of material financial, platform, and ecosystem stakeholders named in retained sources; exact cap-table and contractual terms are not public in the assigned pool.
  columns:
  - Stakeholder
