company:
  name: Securonix
chapter:
  number: 1
  title: Company Overview
  summary: Securonix remains a privately held North Texas cloud-SIEM vendor whose public identity now centers on Unified Defense SIEM, AI-assisted SOC workflows, and board-ready compliance reporting. Retained evidence supports enterprise-scale infrastructure and a material 2022 Vista-led capital event, but current valuation, audited revenue, exact customer count, board composition, and debt terms remain undisclosed.
sections:
- id: identity-scale-and-delivery
  title: Identity, Product Scope, and Operating Footprint
  body: 'Securonix is consistently described across company-controlled and third-party profiles as a cloud-native security operations platform built around Unified Defense SIEM, combining SIEM, UEBA, SOAR, threat intelligence, and TDIR workflows. Public identity signals are directionally consistent but not perfectly clean: current retained profiles all place the company in North Texas, yet Security Stack and LinkedIn point to Plano while TechBag states Addison. Scale evidence is also directional rather than audited. LinkedIn and Security Stack support only a 501-1,000 employee band, while the AWS modernization case study is the strongest public scale proxy on the customer side, stating that the platform protects over 300 global enterprises and processes more than 78 million security events per second. The deployment model remains cloud-centric: Securonix offers BYO-AWS flexibility for customer data placement, but retained evidence does not support a true air-gapped or on-premises control
    plane.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO009
  - CO010
  - CO014
  - CO016
  tableRefs:
  - TO001
- id: leadership-governance-and-key-person-risk
  title: Leadership Visibility, Governance Opacity, and Key-Person Dependence
  body: 'Publicly retained evidence exposes leadership transition risk more clearly than it exposes governance detail. The April 2023 Unified Defense SIEM launch was fronted by then-Chief Executive Officer Nayaki Nayyar, while TechBag says Toby Weiss became chief executive in June 2026 and characterizes him as the company''s third CEO in two years. That cadence suggests a real diligence need around operating continuity, board sponsorship, and decision rights even though product direction appears broadly consistent. Retained sources also surface named technical leaders rather than a full executive roster: Tanuj Gulati appears as CTO in the 2021 Jupiter release and Sanjeev Kishore Yarnapati appears as Director of Infrastructure Engineering in the AWS case study. The result is moderate-to-high key-person dependence: the company shows enough technical bench to support execution, but not enough public governance disclosure to underwrite board composition, succession planning, or control dynamics
    from open sources alone.'
  claimRefs:
  - CO007
  - CO011
  - CO012
  tableRefs:
  - TO002
- id: capital-history-milestones-and-public-gaps
  title: Capital History, Strategic Milestones, and Unresolved Public Gaps
  body: 'The clearest capitalization fact in the retained pool is not a full financing history but a single major marker: Security Stack says Securonix received a Vista Equity Partners-led growth investment of more than $1 billion in 2022, supporting a privately held, PE-backed profile without fixing today''s valuation or ownership split. Security Stack also says Securonix acquired threat intelligence vendor ThreatQuotient in June 2025, while the product and partner sources together show a multi-year platform arc from the 2021 Jupiter release to the 2023 Unified Defense SIEM relaunch, a 2024-initiated AWS modernization program, and a February 2026 Agentic AI commercialization push around Sam and Agentic Mesh. The biggest remaining gaps are economic and governance, not identity. Retained sources still do not disclose current valuation, audited revenue or ARR, precise logo count, board seats, debt or credit facilities, or liquidation terms. Those omissions materially limit any downstream ownership,
    dilution, or cash-efficiency judgment.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO010
  - CO013
  - CO015
  - CO016
  tableRefs:
  - TO003
  figureRefs:
  - FO001
