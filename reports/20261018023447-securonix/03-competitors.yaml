    - Unknown in retained evidence; TrustRadius only says Splunk ES is analytics-driven SIEM at scale.
    - Rapid7 is described as combined XDR + SIEM; QRadar is only described generically as SIEM.
  - - Hot historical search / retention posture
    - Yes; retained sources repeatedly cite 365 days of always-hot searchable data.
    - Unknown in retained evidence.
    - Unknown in retained evidence.
    - Status-quo tool stacks are described as fragmented rather than retention-optimized.
  - - Integration breadth / connector story
    - Yes; public sources cite more than 500 connectors and over 750 data sources.
    - Yes on ecosystem fit; PeerSpot emphasizes seamless Microsoft integration.
    - Unknown in retained evidence.
    - TrustRadius competitor listings do not add comparable connector counts for Rapid7, QRadar, or LevelBlue.
  - - Trust / compliance posture
    - Publicly evidenced with SOC 2 Type II, HITRUST, and a GDPR program.
    - Unknown in retained evidence.
    - Unknown in retained evidence.
    - No comparable compliance detail is available for listed alternatives in the retained pool.
  - - Public AI / automation narrative
    - Yes; EON, Sam, Agentic Mesh, and Autonomous Threat Sweeper are repeatedly surfaced.
    - Yes on advanced threat intelligence, but retained evidence is less explicit on a unified agentic workflow.
