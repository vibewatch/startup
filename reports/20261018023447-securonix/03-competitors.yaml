  - - Deployment flexibility and control
    - Mixed; BYO variants exist, but public sources conflict on whether the control plane ever leaves Securonix cloud hosting.
    - Yes for public and hybrid cloud in PeerSpot.
    - Partial; Splunk Cloud is managed, but the retained pool does not establish the full deployment spectrum.
    - Status-quo internal stacks can preserve local control, which is why air-gap or residency buyers may keep them longer.
