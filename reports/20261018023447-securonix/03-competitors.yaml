tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor class
  - Examples in retained sources
  - Public positioning evidence
  - Likely target segment
  - Differentiation vs Securonix
  - Limitation / open issue
  rows:
  - - Incumbent ecosystem suite
    - Microsoft Defender for Identity; Microsoft Sentinel
    - 'PeerSpot ranks Microsoft #1 in ITDR with 9.5% mindshare; TrustRadius lists Microsoft Sentinel as a Securonix alternative.'
    - Microsoft-standardized enterprises and hybrid-cloud SOCs
    - Bundle leverage, ecosystem integration, and broad threat-intelligence posture.
    - Retained sources do not show Microsoft matching Securonix on hot-retention architecture; packaging can still be costly outside existing Microsoft spend.
  - - Classic enterprise SIEM incumbent
    - Splunk Enterprise Security; Splunk Cloud Platform
    - TrustRadius lists both; Splunk ES is described as analytics-driven SIEM at scale and Splunk Cloud as a managed data platform service.
    - Large enterprises that want analytics depth and managed deployment options
    - Strong incumbent brand and analytics orientation.
    - Retained pool does not show a direct Securonix win-rate, only that Splunk remains a default enterprise comparison point.
  - - Classic enterprise SIEM incumbent
    - IBM Security QRadar SIEM
    - TrustRadius lists QRadar as a direct alternative.
    - Enterprises buying established SIEM workflows
    - Incumbent familiarity and established SIEM category presence.
    - Retained sources provide little fresh differentiation detail, which itself suggests QRadar competes more on installed-base inertia than on public innovation signals in this pool.
  - - Adjacent XDR / mid-market path
    - Rapid7 InsightIDR; LevelBlue USM Anywhere
    - TrustRadius describes InsightIDR as combined XDR and SIEM and LevelBlue as threat detection plus incident response and compliance management.
    - Mid-market teams and buyers seeking simpler consolidation
    - Can satisfy the same detection-and-response job with potentially lighter operating overhead.
    - Retained evidence does not quantify whether these platforms scale to the same multi-tenant or hot-retention profile as Securonix.
  - - Status-quo substitute
    - Fragmented SIEM + SOAR + UEBA + TIP stack; internal build around existing tools
    - Securonix’s official materials explicitly attack disconnected tools as siloed, costly, and slow.
    - Enterprises with sunk-cost tooling and strong internal engineering capacity
    - Keeps existing vendor contracts and operational habits intact.
    - Fragmentation is exactly the pain Securonix is trying to monetize, so this substitute is often the real budget incumbent even when no named competitor wins.
  notes: Rows summarize how retained public surfaces frame the competitive set; they are not a market-share ranking or win-rate study.
