  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: deployment-flexibility
    missingEvidence: Primary product or contract documentation that cleanly defines whether any customer-hosted, on-premises, or air-gapped control-plane option exists today.
    whyItMatters: Deployment control is a decisive buying criterion against incumbents and can change the set of accounts where Securonix is even eligible.
    diligencePath: Request current solution-architecture documentation and a sales-engineering walkthrough that distinguishes BYO data residency from actual control-plane hosting choices.
    relatedQuestionRefs:
    - QP003
  - type: missing-source
    severity: material
    topic: pricing-model
    missingEvidence: A current list-price, realized-price, or contract redline example that reconciles GB/day, user-based, and productivity-minute pricing across product packages.
    whyItMatters: Without a reconciled meter, any TCO comparison versus Microsoft, Splunk, or adjacent platforms is too fragile for underwriting.
    diligencePath: Collect current quote decks, example order forms, and at least one recent customer reference describing the actual billing metric used in production.
    relatedQuestionRefs:
    - QP009
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-by-segment
    missingEvidence: Segmented win-loss data showing where Securonix displaces Microsoft, Splunk, or status-quo internal stacks and where it loses on bundle economics or control requirements.
    whyItMatters: Competitive durability depends on whether Securonix wins often enough in its claimed sweet spots to offset incumbent ecosystem power.
    diligencePath: Request recent win-loss summaries by segment, including named reasons for losses tied to deployment, pricing, or usability.
    relatedQuestionRefs:
    - QP005
    - QP009
    relatedTableRefs:
    - TP001
