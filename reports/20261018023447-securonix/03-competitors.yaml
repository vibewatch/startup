- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Path
  - Public pricing signal
  - Commercial unit / contract model
  - Included capability or caveat
  - Implication
  rows:
  - - Securonix core platform (TechBag view)
    - Pricing disclosed directionally.
    - GB/day capacity band with hybrid commitment, pay-as-you-go, and negotiated overages.
    - Data Pipeline Manager tiers are presented as the control lever for total cost.
    - Favors buyers who can actively classify and tier telemetry before committing volume.
  - - Securonix core platform (PeerSpot view)
    - Pricing disclosed directionally but conflicts with other sources.
    - PeerSpot says pricing is based on number of users rather than data volume.
    - Comparison page frames ROI around reduced infrastructure needs and operational efficiency.
    - Commercial diligence must reconcile whether the true binding meter is users, data volume, or a segment-specific combination.
  - - Securonix Sam / Agentic Mesh
    - Novel public pricing signal.
    - Minutes of AI-performed analyst work rather than seats or data volume.
    - Adds incremental automation upside but makes ROI dependent on how analyst-equivalent work is audited.
    - Creates a new budget conversation that incumbents may not yet force, but it also adds measurement risk.
  - - Microsoft ecosystem path
    - Bundle economics are publicly visible at a high level.
    - Often attached to broader Microsoft 365 packages.
    - Can be attractive for organizations already standardized on Microsoft services.
    - Bundle leverage can offset feature gaps because procurement friction is lower.
  - - Splunk / other classic alternatives
    - Not disclosed in retained pool.
    - Unknown in retained sources.
    - TrustRadius establishes them as alternatives but does not provide comparable public package detail here.
    - Lack of apples-to-apples commercial evidence is itself a diligence gap before underwriting relative win rates.
  notes: This table preserves conflicting public descriptions rather than forcing a single normalized pricing model.
