    - label: Fragmented status-quo stack
      x: 2
      y: 1
      tone: risk
      detail: Separate SIEM, SOAR, UEBA, and TIP tools remain a substitute because they preserve sunk costs, but Securonix argues they create silos and slower investigations.
      note: Ordinal synthesis from CP004 and section analysis.
