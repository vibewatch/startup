      - Limitation
    rows:
      - [Ingest and normalize telemetry, "Collect data from endpoints, applications, networks, VPNs, servers, and cloud apps", "Data onboarding automation plus Data Pipeline Manager", "Lower manual onboarding effort and steer data to lower-cost tiers when full analytics is unnecessary", "Exact current connector count and source-specific effort are not independently verified in retained evidence"]
      - [Triage alerts and investigate context, "Prioritize alerts, enrich entities, and decide which cases merit analyst time", "Unified Defense SIEM, UEBA, contextual enrichment, and Sam", "Faster investigation with context and AI-assisted summaries instead of manual swivel-chair workflows", "Retained evidence does not disclose precision/recall or false-positive benchmarks"]
      - [Hunt emerging threats, "Search raw data and look for new indicators without waiting for legacy correlation content", "Intelligent Live Channel, Threat Labs content, and autonomous threat hunting", "Current or historical material says customers can search live raw data and receive updated threat content", "No retained independent proof of current customer utilization or efficacy by threat type"]
      - [Coordinate response across teams or tenants, "Move from detection to case creation, response guidance, and multi-tenant action", "SOAR, multi-tenant response, and Agentic Mesh governance", "Quicker response preparation with policy-bound, reviewable actions", "Customer-side playbook depth and default approval settings remain diligence questions"]
    notes: >-
      Benefits reflect public claims and should not be read as independently verified outcome
      rates; null-like limitations mark where the retained evidence stops short of proof.
    claimRefs: [CE003, CE004, CE005, CE009, CE010, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Public maturity signal
      - Risk / diligence ask
    rows:
      - [Custom publishers, "Move security data out of customer environments", "Customer source configuration and Securonix ingest path", "AWS describes data flowing from customer environments through custom publishers", "Need source-type coverage list, deployment effort, and failure-handling details"]
      - [Apache Kafka, "Carry event streams before analytics processing", "AWS-managed or customer-aligned cloud infrastructure", "Explicitly named in the 2026 AWS architecture write-up", "Ask for tenant isolation, replay strategy, and incident back-pressure behavior"]
      - [Spark on Amazon EKS, "Run real-time analytics and shared processing jobs", "Amazon EKS, EC2, Karpenter, and Kubeflow Spark Operator", "40+ clusters, 20-50 customers each, and 10,000+ concurrent jobs per AWS", "Verify noisy-neighbor controls, failover design, and region strategy"]
      - [Snowflake data layer, "Support hot searchable security data and long retention claims", "Snowflake plus AWS underpinnings", "LinkedIn and TechBag both describe a Snowflake- and AWS-based architecture", "Validate cost scaling and data-sovereignty implications by tenant profile"]
      - [Agentic Mesh on Bedrock AgentCore, "Coordinate AI agents across detection, investigation, response, and reporting", "Amazon Bedrock AgentCore and Securonix policy layer", "Help Net Security says the layer is explainable, auditable, and reversible", "Need model-governance review, prompt/data-handling controls, and approval-chain evidence"]
    notes: >-
      Architecture layers combine company, partner, and independent descriptions; they show
      disclosed dependencies rather than a complete vendor-verified reference architecture.
    claimRefs: [CE005, CE006, CE007, CE008, CE011, CE012, CE013, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Publicly disclosed operating stack from customer telemetry through governed AI and cost controls.
    data:
      layers:
        - label: Data sources
          detail: Customer environments generate security telemetry and entity context.
          modules:
            - Endpoints, applications, network devices, servers, VPNs, and cloud apps
            - Customer environments and tenant-specific data sources
          outputs:
            - Telemetry requiring collection and normalization
        - label: Ingestion and streaming
          detail: Vendor-managed and customer-aligned ingestion path before analytics execution.
          modules:
            - Custom publishers
            - Apache Kafka
          outputs:
            - Event streams prepared for real-time analytics
        - label: Processing fabric
          detail: Shared cloud compute for high-volume analytics workloads.
          modules:
            - Spark on Amazon EKS
            - Karpenter and Amazon EC2
            - Kubeflow Spark Operator
          outputs:
            - Scaled analytics jobs across multi-customer clusters
        - label: Analytics and content
          detail: Core SIEM, behavior analytics, and continuously updated detection content.
          modules:
            - Unified Defense SIEM
            - UEBA and contextual enrichment
            - Threat Labs content and live search
          outputs:
            - Detections, investigations, and case signals
        - label: AI orchestration
          detail: Governed AI assistance layered into SOC workflows.
          modules:
            - Sam AI SOC Analyst
            - Agentic Mesh
            - SOAR and response guidance
          outputs:
            - Triage, investigation support, and response preparation
        - label: Economics and governance
          detail: Controls for telemetry cost, approvals, and deployment fit.
          modules:
            - Data Pipeline Manager
            - Human-in-the-loop oversight
            - BYO AWS versus vendor-operated control plane choices
          outputs:
            - Cost routing, policy enforcement, and residency decisions
    approximationNotes: >-
      Architectural layers synthesize multiple public descriptions and are directional rather
      than a complete vendor-published reference diagram.
    claimRefs: [CE006, CE011, CE012, CE014]
