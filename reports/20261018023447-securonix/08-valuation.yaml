schemaVersion: report-v2
artifact: valuation
slug: securonix
runDate: 2026-10-18
company:
  name: Securonix
chapter:
  number: 8
  title: Valuation
  summary: >-
    Securonix has credible evidence of enterprise-scale product deployment and
    technical cost improvement, but the assigned public evidence does not disclose
    current revenue, ARR, cash flow, net debt, equity value, or preference terms.
    The recommendation is therefore research more / track, with no supportable
    numeric entry range until management supplies a current financial and cap-table
    package.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The evidence supports continued diligence, not a purchase decision. Multiple
      company, partner, and independent profile sources consistently describe an
      integrated cloud SIEM platform, while the AWS partner case provides concrete
      operating-scale and cost-performance signals. Those facts establish product
      substance, but they do not establish equity value. Security Stack reports a
      more-than-$1 billion growth investment led by Vista in 2022; that is financing
      history, not a current valuation, current cash balance, or price available to
      a new investor. The assigned evidence also lacks current revenue, ARR, margins,
      retention, cash flow, net debt, share count, and liquidation preferences.
      Public cybersecurity multiples therefore supply only a cautionary reference:
      the recommendation remains research more / track, confidence is medium-low,
      risk is high, and the valuation stance is indeterminate pending private
      diligence.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on product breadth, enterprise deployment, and a plausible
      efficiency path. Securonix, partner, and profile sources describe SIEM, UEBA,
      SOAR, and threat intelligence in one platform. AWS reports more than 300
      global enterprises, over 78 million security events per second, and an
      approximate 30% cost-performance improvement from the EKS modernization.
      IBM's 2026 discussion of controls for agentic identities also supports the
      relevance of Securonix's AI-security positioning. The anti-thesis is evidence
      quality and monetization: the larger customer-count and ROI figures remain
      company-originated or partner-mediated, and no audited financial evidence
      connects technical performance to recurring revenue, retention, or free cash
      flow. Strong technology can still produce weak minority-investor returns if
      entry price, leverage, dilution, or preferences are unfavorable.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV014
      - CV015
    tableRefs:
      - TV002
  - id: financing-comparables-and-scenarios
    title: Financing, comparables, and scenarios
    body: >-
      The only retained Securonix financing marker is Security Stack's report of a
      growth investment exceeding $1 billion in 2022, alongside the 2025
      ThreatQuotient acquisition. Neither item reveals the current enterprise value,
      equity value, cash available, debt load, or preference waterfall. TIKR's
      public-company data illustrate why a private-company haircut and explicit
      downside protection matter: it reports CrowdStrike at 18.76x NTM
      EV/Revenues, Palo Alto Networks at 11.27x, and a 4.03x peer-software median.
      These are reference points rather than a Securonix valuation range because the
      denominator needed for a multiple is missing. Bull, base, and bear cases must
      therefore remain conditional. Each case has an unavailable numeric range and
      a diligence trigger rather than a fabricated price target or return estimate.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence
    body: >-
      Public evidence does not support a target return, hold period, or exit-value
      calculation. Exit readiness depends first on a finance-quality data room:
      audited revenue and ARR, cohort retention, gross and operating margins, cash
      conversion, debt, and a fully diluted capitalization table. Commercial
      diligence must then reconcile Startup Defense's repetition of Securonix's
      more-than-one-thousand-team claim with the AWS partner case's more specific
      statement that the platform protects over 300 global enterprises. These
      denominators may describe different populations and should not be combined.
      The thesis breaks if verified growth is slowing, retention is weak, leverage
      or preferences absorb the equity upside, or the entry price assumes a
      public-leader multiple without public-leader disclosure and cash generation.
      A credible exit plan also requires evidence of likely strategic buyers or IPO
      readiness, neither of which appears in the assigned source set.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV008
      - CV013
      - CV015
      - CV016
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision dimension
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, "Research more / track", "Product and deployment proof exists, but current valuation inputs do not.", "Do not issue a buy call from the assigned public evidence."]
      - [Confidence, "Medium-low", "Scale is partner-supported; monetization and financing economics are undisclosed.", "Require a finance-quality data room before increasing conviction."]
      - [Risk rating, High, "Price, dilution, preference, retention, and cash-generation risks cannot be quantified.", "Demand downside protection and explicit thesis-break terms."]
      - [Valuation stance, Indeterminate, "No current Securonix equity value or reliable operating denominator is disclosed.", "Do not infer valuation from the 2022 financing amount."]
      - [Entry discipline, "No numeric range supportable", "Public comp multiples span a wide range and are not a private-company price.", "Set a range only after audited metrics, net debt, and fully diluted ownership are known."]
    notes: >-
      The table distinguishes financing raised from valuation and marks unavailable
      metrics as gaps; it does not convert public-company multiples into a
      Securonix price.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - [Thesis, "Integrated platform breadth", "Company, partner, and profile sources consistently describe SIEM, UEBA, SOAR, and threat intelligence.", "Independent customer references must verify deployment quality and renewal behavior."]
      - [Thesis, "Enterprise operating scale", "AWS reports over 300 global enterprises and more than 78 million security events per second.", "Audited recurring revenue and gross-margin data must show that scale monetizes."]
      - [Anti-thesis, "Commercial outcomes are mostly issuer claims", "The up-to-50% cost reduction, 50% analyst-efficiency improvement, and up-to-60% response-time reduction come from Securonix's LinkedIn profile.", "Customer-level measurements and cohort data would raise confidence."]
      - [Anti-thesis, "Equity economics are opaque", "Current valuation, net debt, dilution, and preferences are absent from the assigned evidence.", "A clean cap table, debt schedule, and liquidation waterfall could remove the blocker."]
    notes: >-
      Evidence classifications reflect the content issuer: company LinkedIn and
      syndicated releases remain company-issued, while the AWS case remains partner
      evidence.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Enterprise scale converts into durable recurring growth; technical efficiency reaches margins; financing terms are clean.", "Valuation range unavailable until audited ARR, margins, net debt, and ownership are disclosed.", "Supported only if private data show strong growth, retention, cash conversion, and limited preference overhang.", "Technical gains fail to convert into customer expansion or cash generation."]
      - [Base, "The platform remains relevant and scaled, but disclosure and monetization evidence stay incomplete.", "Valuation range unavailable; require a material private-company discount to any selected public comp after denominator verification.", "Best aligned with the current mixed evidence quality and missing financial packet.", "Entry pricing assumes premium public multiples without comparable disclosure or free cash flow."]
      - [Bear, "Growth or retention disappoints, leverage or preferences subordinate new capital, or AI positioning does not improve economics.", "No entry value is supportable; wait for repricing or decline the investment.", "Triggered by weak cohorts, high burn, concentrated customers, or an unfavorable liquidation waterfall.", "A down round, covenant stress, or preference stack absorbs common-equity upside."]
    notes: >-
      Scenario ranges are explicitly unavailable because current Securonix revenue,
      ARR, cash flow, net debt, share count, and financing preferences are not
      disclosed in the assigned evidence.
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Product proof advances Securonix into diligence, while missing financial and
      ownership evidence prevents a priced investment recommendation.
    data:
      nodes:
        - id: product-proof
          label: Integrated product proof
          detail: "SIEM, UEBA, SOAR, and threat intelligence are consistently described across the retained evidence."
        - id: scale-proof
          label: Partner-supported scale
          detail: "AWS reports over 300 enterprises and more than 78 million security events per second."
        - id: efficiency-proof
          label: Technical efficiency
          detail: "AWS reports an approximate 30% cost-performance improvement from the EKS modernization."
        - id: monetization-gap
          label: Monetization gap
          detail: "Current ARR, retention, margins, and cash flow are not disclosed in the assigned evidence."
        - id: ownership-gap
          label: Ownership gap
          detail: "Net debt, dilution, and liquidation preferences are not disclosed."
        - id: decision
          label: Research more / track
          detail: "No numeric entry range is supportable until the missing denominators and financing terms are verified."
    approximationNotes: >-
      This is a qualitative decision chain, not a value bridge; the evidence does
      not support a numeric enterprise- or equity-value calculation.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV014
      - CV015
      - CV016
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Continue diligence, but do not issue a buy recommendation or target return
      until current operating metrics, net debt, fully diluted ownership, and
      preference terms establish both the valuation numerator and denominator.
    claimRefs:
      - CV014
      - CV015
      - CV016
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Decline or wait for repricing if verified growth and retention do not support
      the proposed multiple, or if leverage, dilution, or preferences capture the
      upside before new minority capital.
    claimRefs:
      - CV013
      - CV015
      - CV016
