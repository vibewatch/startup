  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-inputs
      missingEvidence: Current revenue and ARR, growth, gross and operating margins, retention cohorts, cash flow, cash, and net debt.
      whyItMatters: These metrics provide the denominator and cash-generation evidence needed for a valuation range and target return.
      diligencePath: Obtain audited financial statements, the latest board KPI pack, debt schedules, and bank statements, then reconcile every metric to management's operating model.
      relatedQuestionRefs:
        - QV001
        - QV002
        - QV007
      relatedTableRefs:
        - TV001
        - TV003
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Fully diluted capitalization, Vista ownership and control, liquidation preferences, option dilution, acquisition consideration, and any secondary or recapitalization terms.
      whyItMatters: Enterprise value can translate into weak minority-equity returns when leverage, dilution, or preferences absorb proceeds.
      diligencePath: Review the cap table, charter, investor-rights agreements, debt documents, acquisition documents, and a management-certified liquidation waterfall.
      relatedQuestionRefs:
        - QV001
        - QV002
        - QV008
      relatedTableRefs:
        - TV001
        - TV003
    - type: missing-source
      severity: material
      topic: commercial-validation
      missingEvidence: Independent customer evidence on logo count, customer concentration, renewal cohorts, realized cost savings, and response-time improvements.
      whyItMatters: Company and partner claims do not establish that technical performance converts into durable retention and cash generation.
      diligencePath: Conduct reference calls selected from the customer ledger and reconcile contracts, invoices, renewals, and measured pre/post deployment outcomes.
      relatedQuestionRefs:
        - QV003
        - QV008
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Evidence of strategic-buyer interest, IPO readiness, audited-control maturity, or a board-approved exit plan and timing.
      whyItMatters: Without a credible exit path, neither hold period nor target return can be supported.
      diligencePath: Review board materials, banker engagement letters, audit history, control reports, and buyer or public-readiness workstreams.
      relatedQuestionRefs:
        - QV007
        - QV008
