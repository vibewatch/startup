      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最显眼的目标账户是大型企业 SOC 和托管安全服务提供商，而不是购买单一告警工具的小团队。用户是运营安全团队——分析师、检测工程师和事件响应人员；但经济买方更可能是 CISO 或 SOC
              负责人，因为产品承诺是缩短响应时间、降低数据处理成本并改善面向董事会的控制。Securonix 自己的宣传将购买与响应速度、分析师生产力、数据管道灵活性和结果导向定价绑定；买方只有在想淘汰碎片化 SIEM
              加点式工具环境，或在不牺牲威胁上下文深度的前提下推动云迁移时，才会采用。保留资料反复强调多租户、客户密度和运营可扩展性，说明 MSSP 是一个独立细分市场。
            claimRefs:
              - CM002
