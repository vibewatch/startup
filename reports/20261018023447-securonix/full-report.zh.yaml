  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 部署适配度和运营复杂度是最高的剩余暴露，定价以及执行 / 治理风险紧随其后。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 剩余暴露
      rows:
        - label: 部署模式 / 监管适配风险
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 认证和 BYO 数据本地化有所帮助，但无法满足硬隔离买方。
            - label: 高
              tone: high
        - label: 运营复杂度 / 支持风险
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 虽有自动化和内容服务，但用户报告的不良摩擦仍然存在。
            - label: 高
              tone: high
        - label: 定价 / 遥测超额用量风险
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 如果遥测分层得当且合同谈判严格，DPM 可以提供帮助。
            - label: 中高
              tone: high
        - label: 领导层 / AI 商业化风险
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低中
              tone: medium
              note: 赞助方支持和更广的平台有所帮助，但领导层和产品包装仍在变化。
            - label: 中
              tone: medium
        - label: 内容新鲜度 / 漏洞响应风险
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 缓解效果取决于威胁内容和狩猎逻辑针对新 KEV 项目的更新速度。
            - label: 中
              tone: medium
        - label: 收购后整合风险
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 低中
              tone: medium
              note: 资本和更广的平台有所帮助，但保留的公开来源中没有整合证据。
            - label: 中
              tone: medium
    approximationNotes: 定性矩阵综合了保留来源证据；单元格标签是与引证论断相联系的序数判断，不是统计概率。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 产品证据足以让 Securonix 进入尽调，但缺少财务和所有权证据，无法给出带价格的投资建议。
    data:
      nodes:
        - id: product-proof
          label: 一体化产品证据
          detail: 保留证据始终将产品描述为涵盖 SIEM、UEBA、SOAR 和威胁情报。
        - id: scale-proof
          label: 合作伙伴支持的规模
          detail: AWS 报告称其服务超过 300 家企业，每秒处理超过 7,800 万个安全事件。
        - id: efficiency-proof
          label: 技术效率
          detail: AWS 报告称 EKS 现代化带来约 30% 的成本效能提升。
        - id: monetization-gap
          label: 变现缺口
          detail: 分配到的证据没有披露当前 ARR、留存、利润率和现金流。
        - id: ownership-gap
          label: 所有权缺口
          detail: 尚未披露净债务、稀释和清算优先权。
        - id: decision
          label: 继续研究 / 跟踪
          detail: 在核实缺失的分母和融资条款前，无法支持数值入场区间。
    approximationNotes: 这是定性决策链，而不是价值桥接；证据不支持数值化的企业价值或股权价值计算。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV014
      - CV015
      - CV016
