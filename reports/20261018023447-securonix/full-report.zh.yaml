            body: 在管理层展示真实的遥测分层行为、协商后的超额费用保护，以及 AI 定价的“分析师生产力”下降在客户生产环境中仍成立的客观证明之前，不要将厂商 ROI 主张纳入投资判断。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR013
          - type: callout
            title: 降低剩余风险的条件
            body: 如果 Securonix 能提供近期参考客户电话、支持 MTTR 证据、ThreatQuotient 收购后的干净整合指标，以及当前 CEO 领导下稳定的运营节奏，剩余风险严重度会下降。
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持继续尽调，而不是做出购买决定。多家公司、合作伙伴和独立简介资料一致将其描述为整合式云 SIEM 平台；AWS
              合作伙伴案例则提供了具体的运营规模和成本性能信号。这些事实确立了产品实质，但没有确立股权价值。Security Stack 报道 Vista 于 2022 年领投一笔超过 $1 billion
              的成长投资；这是融资历史，不是当前估值、当前现金余额或新投资者可获得的价格。分配到的证据还缺少当前收入、ARR、利润率、留存、现金流、净债务、股份数和清算优先权。因此，公开网络安全公司倍数只能作为谨慎参考：建议仍为继续研究
              / 跟踪，信心中低，风险高，估值立场在私有尽调完成前不确定。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
