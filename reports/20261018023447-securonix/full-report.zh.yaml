      - number: '4.3'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              公开证据确认了有规模的运营足迹和持续的基础设施投入，但不足以评估流动性。历史轮次时间线已在公司概览中说明；它不能替代现金、债务或融资需求的当前证据。保留的财务资料没有披露当前现金余额、债务负担、烧钱率、契约结构或下一轮融资触发点。这些遗漏使可靠的现金跑道计算无法成立，投资者也无法判断产品扩张和支持义务能否靠内部资金承担。


              因此，财务判断仍是有条件的。Securonix 不只是单一产品的日志接入业务，因为它拥有多项变现杠杆——核心 SIEM 订阅、数据分层控制、部署变体、托管响应类服务和新的 AI
              生产力定价——并服务大型企业环境，因此收入质量看起来优于单一产品故事。考虑到 AWS 效率提升和 BYO
              部署选项，利润率路径合理但尚未得到证明，因为公开披露没有显示毛利率、净留存、客户集中度或实际续约经济性。TechBag 提到公司两年内已有第三位
              CEO，在披露仍然稀薄的同时增加了执行风险。尽调阶段，管理层必须提供当前 ARR 或收入、毛利率和运营利润率、现金与烧钱、合同组合及集中度指标，资本故事才具备可评估性。
            claimRefs:
