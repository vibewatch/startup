figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开证据显示，公司在多年间从扩展云原生 SIEM 功能，发展到 Unified Defense SIEM、大规模基础设施现代化，以及新领导层下的 AI 辅助 SOC 叙事。
    data:
      items:
        - date: '2008'
          label: 在得克萨斯州成立
          detail: 公开简介将 Securonix 的成立时间追溯至 2008 年，并将其当前总部布局定位在得克萨斯州北部。
          tone: neutral
          claimRefs:
            - CO002
            - CO003
        - date: '2021-04-20'
          label: Jupiter 版本增加 BYO AWS 选项
          detail: Securonix 的 Jupiter 版本增加了 BYO-AWS 部署模式，同时将核心 SIEM 应用服务保留在 Securonix 的 AWS 账户中。
          tone: positive
          claimRefs:
            - CO014
        - date: '2022'
          label: 披露 Vista 主导的成长资本
          detail: Security Stack 称，Securonix 获得了 Vista Equity Partners 主导的超过 $1 billion 成长投资。
          tone: positive
          claimRefs:
            - CO005
        - date: '2023-04-19'
          label: Unified Defense SIEM 发布
          detail: 时任 CEO Nayaki Nayyar 推出了 Unified Defense SIEM，提供 365 天可热检索数据和统一的 TDIR 体验。
          tone: positive
          claimRefs:
            - CO007
        - date: '2024'
          label: 可靠性审查触发现代化项目
          detail: 2024 年初的一次 EMR 升级暴露出可靠性问题，随后开展了为期 14 个月的 AWS 现代化工作。
          tone: neutral
          claimRefs:
            - CO010
        - date: 2025-06
          label: 收购 ThreatQuotient
          detail: Security Stack 称，Securonix 于 2025 年 6 月收购了威胁情报厂商 ThreatQuotient。
          tone: positive
          claimRefs:
            - CO006
        - date: 2026-02
          label: 推出 Sam 和 Agentic Mesh
          detail: TechBag 称，Securonix 于 2026 年 2 月推出了 AI SOC Analyst Sam 和 Agentic Mesh。
          tone: positive
          claimRefs:
            - CO013
        - date: 2026-06
          label: Toby Weiss 出任 CEO
          detail: TechBag 称，Toby Weiss 于 2026 年 6 月出任 CEO，这是该公司两年内第三次更换 CEO。
          tone: risk
