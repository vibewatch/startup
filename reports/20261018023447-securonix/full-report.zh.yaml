  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于保留来源的序数评分显示，Securonix 在有公开证据支持的广度上最强，而 Microsoft 在生态杠杆和捆绑能力上领先。
    data:
      xAxis:
        label: 生态 / 分销杠杆（序数 1-5）
        min: 1
        max: 5
        lowLabel: Narrower channel / incumbent leverage
        highLabel: Stronger bundle / ecosystem pull
      yAxis:
        label: 有公开证据支持的一体化检测广度（序数 1-5）
        min: 1
        max: 5
        lowLabel: Narrower or weakly evidenced breadth
        highLabel: Broader workflow evidenced in retained sources
      points:
        - label: Securonix
          x: 3
          'y': 5
          tone: opportunity
          detail: 统一 SIEM+UEBA+SOAR+TIP、365 天热数据和大量连接器，但捆绑拉动力弱于 Microsoft。
          note: 基于 CP001-CP004 的序数综合。
        - label: Microsoft 生态路径
          x: 5
          'y': 4
          tone: neutral
          detail: PeerSpot 显示其 ITDR 排名第一、份额为 9.5%，并具备无缝生态集成和 M365 打包杠杆。
          note: 基于 CP007-CP008 的序数综合。
        - label: Splunk 路径
          x: 4
          'y': 4
          tone: neutral
          detail: TrustRadius 将 Splunk Enterprise、Splunk Enterprise Security 和 Splunk Cloud 列为直接替代品；ES 依靠分析能力实现规模化。
          note: 基于 CP005 的序数综合。
        - label: Rapid7 InsightIDR 路径
          x: 3
          'y': 3
          tone: neutral
          detail: TrustRadius 将 InsightIDR 定位为面向中型公司的 XDR 与 SIEM 组合方案。
          note: 基于 CP006 的序数综合。
        - label: IBM QRadar 路径
          x: 2
          'y': 2
          tone: neutral
          detail: QRadar 是现有 SIEM 替代方案，但保留来源提供的新近差异化细节少于 Securonix、Microsoft 或 Splunk。
          note: 基于 CP005 的序数综合。
        - label: 分散的现状技术栈
          x: 2
          'y': 1
          tone: risk
          detail: 分散的 SIEM、SOAR、UEBA 和 TIP 工具仍是替代方案，因为它们能保留沉没成本；但 Securonix 认为，这会造成孤岛并拖慢调查。
          note: 基于 CP004 和章节分析的序数综合。
    approximationNotes: 坐标轴是分析师依据保留证据编制的序数评分，不是实测基准。
