  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据表明，Securonix 通过按量计费的 SIEM 合同、可选部署方式以及较新的 AI 或服务附加项，将客户遥测和用量转化为平台经常性收入，而不是依靠单一透明的目录价目表。
    data:
      nodes:
        - id: telemetry
          label: 客户遥测和身份
          note: AWS 称安全数据来自客户环境，Securonix 则将产品定位于大型企业 SOC 和 MSSP。
        - id: meter
          label: 合同计量器
          note: 公开证据显示，部分账户按 EPS 定价，较新的渠道评论则提到 GB/天档位；目录价未公开。
        - id: core
          label: 核心 Unified Defense SIEM
          note: 核心平台捆绑 SIEM、UEBA、SOAR 和威胁情报。
        - id: options
          label: 附加价值层
          note: Sam AI 生产力定价和 Data Pipeline Manager 拓展了变现与成本控制路径。
        - id: deployment
          label: 部署和成本分配
          note: BYO AWS 让核心应用留在 Securonix 一侧，同时允许摄取、处理和存储位于客户的 AWS 账户中。
        - id: renewal
          label: 续约和利润率结果
          note: AWS 报告称成本效能提升约 30%，但公开来源仍未披露毛利率、NRR 或客户集中度。
      edges:
        - from: telemetry
          to: meter
          label: 安全数据创造可计费规模
        - from: meter
          to: core
          label: 按量计费合同购买核心平台
        - from: core
          to: options
          label: 买方可以增加服务和 AI 层
        - from: core
          to: deployment
          label: 部署选择改变基础设施成本由谁承担
        - from: deployment
          to: renewal
          label: 成本结构和 ROI 影响续约与利润率
    approximationNotes: 这是基于保留公开证据的定性收入桥接，不是已报告金额的量化瀑布。
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
      - CI008
      - CI011
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从客户遥测到受治理 AI 和成本控制的公开运营技术栈。
    data:
      layers:
        - label: 数据源
          detail: 客户环境生成安全遥测和实体上下文。
          modules:
            - 终端、应用、网络设备、服务器、VPN 和云应用
            - 客户环境和特定租户数据源
          outputs:
            - 需要采集和标准化的遥测
        - label: 摄取和流式传输
          detail: 在执行分析前，由厂商管理并与客户环境衔接的摄取路径。
          modules:
            - 自定义发布器
            - Apache Kafka
          outputs:
            - 为实时分析准备的事件流
        - label: 处理层
          detail: 面向高容量分析工作负载的共享云计算资源。
          modules:
            - Amazon EKS 上的 Spark
            - Karpenter 和 Amazon EC2
            - Kubeflow Spark Operator
          outputs:
            - 跨多客户集群运行的规模化分析作业
        - label: 分析和内容
          detail: 核心 SIEM、行为分析以及持续更新的检测内容。
          modules:
            - Unified Defense SIEM
            - UEBA 和上下文增强
            - Threat Labs 内容和实时搜索
          outputs:
            - 检测、调查和案件信号
        - label: AI 编排
          detail: 嵌入 SOC 工作流且受治理的 AI 辅助。
          modules:
            - Sam AI SOC Analyst
            - Agentic Mesh
            - SOAR 和响应指导
          outputs:
            - 分诊、调查支持和响应准备
        - label: 经济性和治理
          detail: 控制遥测成本、审批和部署适配度。
          modules:
            - Data Pipeline Manager
            - 人在回路监督
            - BYO AWS 与厂商运营控制平面的选择
          outputs:
            - 成本路由、政策执行和数据驻留决策
    approximationNotes: 架构层综合了多份公开描述，具有方向性，并非厂商发布的完整参考图。
    claimRefs:
      - CE006
      - CE011
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Securonix 的公开客户证据勾勒出一条从企业 SIEM 替换，到多租户运营和高管报告工作流的路径。
    data:
      items:
        - label: 寻找企业 SIEM 替代方案
          actor: CISO / 安全运营买方
          stage: 评估
          tone: neutral
          touchpoints:
            - 董事会可见的 ROI 和 MTTR 降低
            - 云原生 SIEM 替代方案候选名单
        - label: 采集器和摄取部署
          actor: 安全工程团队
          stage: 部署
          tone: neutral
          touchpoints:
            - 靠近日志源的远程摄取器
            - 缓冲和本地硬件规模设计
        - label: SOC 检测与响应运营
          actor: SOC 分析师和威胁猎人
          stage: 活跃使用
          tone: positive
          touchpoints:
            - 近实时可见性
            - UEBA、威胁模型和剧本
        - label: 多租户托管服务交付
          actor: MSSP 监控团队
          stage: 运营规模化
          tone: positive
          touchpoints:
            - 商业监控和告警服务
            - 共享客户环境
        - label: 平台现代化与迁移
          actor: 平台和基础设施团队
          stage: 扩张
          tone: positive
          touchpoints:
            - 40+ 个集群，每个集群覆盖 20-50 个客户
            - 数百家企业客户完成迁移
        - label: 面向高管和审计的威胁验证
          actor: SOC 负责人和高管
          stage: 工作流扩展
          tone: neutral
          touchpoints:
