  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据一致表明，Securonix 销售以 Unified Defense SIEM
              为核心的云原生安全运营平台，主要买方是企业安全团队和托管安全服务提供商。变现图景方向清晰，但运营层面不透明。官方页面强调打包价值主张——SIEM、UEBA、SOAR、威胁情报、自动化和可选的托管响应能力——却没有公布标准价目表。第三方页面只用方向性证据填补部分缺口，无法提供可靠的合同日程：MSP
              Tools 将买方引回官网查询当前价格，并提到免费试用；AWS Marketplace 评论者认为相较 Splunk 和 Exabeam，价格合理；一名评论者称，在其部署场景中，许可按 EPS 计费，约为每
              EPS $50-$60。


              TechBag 给出了不同且更新的定价框架：按 GB/day 计量，配合容量档位、混合承诺、按需付费和协商超额费用；另有较新的 AI agent
