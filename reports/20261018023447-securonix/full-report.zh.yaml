  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场比传统日志管理更宽，但比整个网络安全栈更窄。在 Securonix 官网、产品页、LinkedIn 简介和独立厂商目录中，公司都被描述为云原生或统一防御平台，将
              SIEM、UEBA、SOAR、威胁情报及相关检测和响应工作流打包到一个操作界面中。因此，纳入的支出是安全运营的控制平面：遥测接入、分析、行为检测、上下文增强、响应编排和数据路由经济性。排除的支出则属于独立系统记录或点式防御，包括端点工具、网络设备、通用可观测性工具和独立
              IT 工作流工具。由此，现状替代方案不是某一个竞争者，而是一套碎片化 SOC 栈以及把它们拼起来所需的人工劳动。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模与需求视角
        blocks:
          - type: paragraph
            body: >-
              这组来源没有给出云 SIEM 或统一防御平台清晰的公开 TAM/SAM/SOM 估算，因此可用的规模证据只能依靠代理指标。需求侧，Verizon 称 2026 DBIR
              分析了全球数千起事件，钓鱼、凭证被盗、软件漏洞利用和勒索软件仍是常见入侵原因；CISA 的 KEV 目录在访问页面上显示 1,748 条结果，并明确要求组织在漏洞优先级项目中使用该目录。服务市场侧，AWS 称
              Securonix 保护超过 300 家全球企业，每秒处理超过 78 million 个安全事件，并运行超过 40 个 EKS 集群，每个集群支持 20-50 个客户和超过 10,000 个并发 Spark
              作业。Vista 2021 年成长投资公告提供了历史需求验证，但应视为有日期的战略信号，而非当前市场规模估计。
