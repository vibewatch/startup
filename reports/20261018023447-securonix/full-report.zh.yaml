        - 在披露经审计 ARR、利润率、净债务和持股情况前，无法确定估值区间。
        - 只有私有数据证明增长强劲、留存稳健、现金转化良好且优先权负担有限时，才支持该情景。
        - 技术提升无法转化为客户扩张或现金创造。
      - - 基准
        - 平台仍具相关性并已形成规模，但披露和变现证据依然不完整。
        - 无法确定估值区间；验证分母后，要求相对于选定公开可比公司的估值有明显私营公司折价。
