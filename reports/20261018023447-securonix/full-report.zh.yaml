              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持目标回报、持有期或退出价值计算。退出准备度首先取决于达到财务质量的数据室：经审计收入和 ARR、队列留存、毛利和运营利润率、现金转化、债务以及完全摊薄资本表。商业尽调还必须调和 Startup
              Defense 重复 Securonix“超过一千人的团队”主张与 AWS 合作伙伴案例更具体的“平台保护超过 300
              家全球企业”表述。这些分母可能对应不同群体，不能合并。如果经核实的增长放缓、留存疲弱、杠杆或优先权吞噬股权上行空间，或入场价格在缺少公开龙头披露和现金生成的情况下假设了龙头倍数，投资论点就会失效。可信的退出计划还需要可能的战略买方或
              IPO 准备度证据，而分配的来源集合中没有这类证据。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 继续尽调，但在当前运营指标、净债务、完全摊薄持股和优先权条款同时确立估值分子与分母之前，不要给出买入建议或目标回报。
            calloutType: recommendation
