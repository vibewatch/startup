            body: >-
              公司自有资料和第三方简介始终将 Securonix 描述为一家云原生安全运营平台，以 Unified Defense SIEM 为核心，整合 SIEM、UEBA、SOAR、威胁情报和 TDIR
              工作流。公开身份信号大体一致，但并不完全干净：当前保留的简介都把公司放在北德州，Security Stack 和 LinkedIn 指向 Plano，而 TechBag 写的是
              Addison。规模证据同样只是方向性信号，并非审计结果。LinkedIn 和 Security Stack 只支持 501-1,000 名员工这一档；在客户侧，AWS
              现代化案例是最强的公开规模代理，称该平台保护超过 300 家全球企业、每秒处理超过 78 million 个安全事件。部署模式仍以云为中心：Securonix 允许客户通过 BYO-AWS
              安排数据位置，但保留证据不足以证明其拥有真正的物理隔离或本地控制平面。
