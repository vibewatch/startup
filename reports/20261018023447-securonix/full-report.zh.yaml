      - number: '4.2'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开单位经济性证据来自基础设施和部署细节，而不是披露的财务报表。AWS 和 Securonix 描述的平台保护超过 300 家全球企业，每秒处理超过 78 million 个安全事件；其 Spark
              环境已现代化到超过 40 个 Amazon EKS 集群、超过 10,000 个并发作业和 5,000-6,000 个 EC2
              实例。这些细节意味着云计算和数据管道成本不低，因此定价架构和数据分层管理直接关系到毛利率。AWS 同一案例称，现代化后成本性能提升约 30%，运营效率改善 3-5%；如果客户继续增长，这是利润率杠杆的积极信号。

              公开买方反馈对实际经济性更为复杂。评论者认为产品可扩展且相对可负担，但也提到集成工作、日志解析和查询稳定性问题、对高级支持的依赖，以及至少一个账户大约一年才能实现价值。

              同时，Securonix 自己的产品定位强调定价可预测性、灵活部署、内容即服务和 BYO-AWS
              架构；这些更适合解读为提升毛利率的杠杆，而不是毛利率已经改善的证明。业务达到规模后或许拥有吸引力的运营杠杆，但公开证据仍缺少决定性指标：实际毛利率、服务收入占比、留存、支持负担和扩张率。
