      - - 相邻 XDR / 中端市场路径
        - Rapid7 InsightIDR；LevelBlue USM Anywhere
        - TrustRadius 将 InsightIDR 描述为 XDR 与 SIEM 的组合，将 LevelBlue 描述为威胁检测、事件响应及合规管理的组合。
        - 寻求更简单整合方案的中端市场团队和买方
        - 可能以更轻的运营负担完成同样的检测与响应工作。
        - 现有证据没有量化这些平台能否达到 Securonix 同等的多租户或热数据保留能力。
      - - 现状替代方案
        - 碎片化 SIEM + SOAR + UEBA + TIP 技术栈；围绕现有工具内部构建
