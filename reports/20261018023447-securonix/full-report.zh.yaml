              - CV008
              - CV014
              - CV015
      - number: '8.3'
        title: 融资、可比公司与情景
        blocks:
          - type: paragraph
            body: >-
              保留的 Securonix 融资标记只有 Security Stack 关于 2022 年超过 $1 billion 成长投资的报道，以及 2025 年收购
              ThreatQuotient。两者都没有披露当前企业价值、股权价值、可用现金、债务负担或优先权瀑布。TIKR 的上市公司数据说明了私营公司折价和明确下行保护为何重要：其数据显示 CrowdStrike 的 NTM
              EV/Revenues 为 18.76x，Palo Alto Networks 为 11.27x，可比软件中位数为 4.03x。这些只是参考点，不能构成 Securonix
              的估值区间，因为倍数所需分母缺失。因此，乐观、基准和悲观情景都必须保留条件性。每个情景都只有不可用的数值区间和尽调触发点，而不是编造的目标价格或回报估计。
            claimRefs:
