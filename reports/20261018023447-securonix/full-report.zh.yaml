              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在产品广度、企业部署和可信的效率路径上。Securonix、合作伙伴和简介资料都描述了一个整合 SIEM、UEBA、SOAR 和威胁情报的平台。AWS 报告超过 300 家全球企业、每秒超过 78
              million 个安全事件，以及 EKS 现代化带来的约 30% 成本性能提升。IBM 2026 年关于 agentic 身份控制的讨论，也支持 Securonix AI
              安全定位的相关性。反论点则是证据质量和变现：更大的客户数量和 ROI
              数据仍来自公司或合作伙伴，且没有经审计财务证据把技术表现与经常性收入、留存或自由现金流连起来。即使技术很强，如果入场价格、杠杆、稀释或优先权不利，也可能给少数股东带来糟糕回报。
            claimRefs:
              - CV002
