      - number: '2.4'
        title: 增长驱动、采用约束与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动来自结构性因素，而非周期因素：入侵活动仍很广泛，被利用漏洞的积压持续增长，安全团队既要统一检测与响应，也要为董事会和监管机构保留证据。Securonix 还把监管写进购买叙事，明确提到
              SEC、GDPR 和 DORA 的压力，以及更快披露和更强第三方监督的要求。约束同样重要。迁移并不简单：Securonix 自己的市场教育材料把现代 SIEM 与传统厂商锁定和手工规则调优作对比；AWS
              则描述了一个仅为重构核心 Spark 工作负载就耗时 14 个月的现代化项目。因此，切换成本、对 AI
              引导工作流的信任以及数据经济性证明，都会决定采用时点。最大的未解缺口仍是缺少独立且最新的公开市场模型，按地域、客户规模和产品包组件拆分支出。
            claimRefs:
              - CM005
              - CM006
              - CM007
