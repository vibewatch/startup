        blocks:
          - type: paragraph
            body: >-
              公开保留证据更清楚地暴露了管理层变动风险，而不是治理细节。2023 年 4 月 Unified Defense SIEM 发布时，由时任 CEO Nayaki Nayyar 出面；TechBag 称 Toby
              Weiss 于 2026 年 6 月出任 CEO，并将其描述为公司两年内的第三位
              CEO。这一节奏意味着运营连续性、董事会支持和决策权值得重点尽调，尽管产品方向大体稳定。保留资料还显示了若干技术负责人，但没有完整高管名单：2021 年 Jupiter 发布中 Tanuj Gulati 以
              CTO 身份出现，AWS 案例中 Sanjeev Kishore Yarnapati
              以基础设施工程总监身份出现。整体而言，关键人物依赖度中高：公司拥有足以支持执行的技术班底，但公开治理披露不足，无法仅靠公开来源判断董事会构成、继任规划或控制权动态。
