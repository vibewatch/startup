  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: employment-hero-pricing
      missingEvidence: Stable plan-level list-price cells from the live Employment Hero pricing surface.
      whyItMatters: >-
        Without citable plan prices, the chapter can assess pricing transparency but cannot quantify how much
        cheaper or more expensive Employment Hero is than transparent peers.
      diligencePath: >-
        Open the live pricing page in a browser session, capture current plan tiles, or request the current AU
        quote card from sales.
      relatedQuestionRefs:
        - QP024
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: hibob-pricing
      missingEvidence: An official public HiBob list-price page or archived price sheet.
      whyItMatters: >-
        HiBob is a meaningful people-core rival, but without list pricing the comparison stays structural
        rather than quantifying entry economics.
      diligencePath: >-
        Search HiBob sales materials, archived pricing pages, or obtain a current quote sheet for the
        Australia-relevant package.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: minor
      topic: employment-innovations-pricing
      missingEvidence: >-
        Current standalone public pricing or proposal examples for Employment Innovations payroll and HR
        services.
      whyItMatters: >-
        Employment Innovations is a credible local substitute, but quote-only pricing limits precise
        comparison of service-led substitution versus software-led adoption.
      diligencePath: Request a current proposal, quote sheet, or demo pricing summary from Employment Innovations.
      relatedQuestionRefs:
        - QP026
      relatedTableRefs:
        - TP003
