  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence-backed rationale
      - Mitigation / diligence ask
    rows:
      - - All-in-one Australian employment OS
        - Buyers can still combine Xero payroll, HR software, and outsourced payroll help
        - High
        - >-
          Xero and Employment Innovations together show how a stitched local stack can replace enough of the
          workflow for many SMEs
        - >-
          Request attach-rate and churn data for customers using payroll + HR + recruiting + HeroForce
          together
      - - HeroForce managed employment layer
        - Global EOR suites such as Deel also sell legal-employment infrastructure
        - High
        - >-
          Employment Hero and Deel both market legal infrastructure for global hiring, reducing the uniqueness
          of the EOR-style wedge
        - Review win-loss data by domestic versus multi-country account
      - - Partner-led distribution
        - >-
          Rivals have larger or structurally stronger ecosystems in accounting, HR tech, or enterprise
          services
        - High
        - >-
          Xero, BambooHR, Rippling, and Workday all show meaningful ecosystem leverage that can reroute buyer
          attention before Employment Hero gets to demo depth
        - Measure sourced pipeline and retention by partner channel versus direct sales
      - - Workflow breadth drives switching costs
        - Rippling, HiBob, and Deel are broad enough that buyers can multi-home or replace modules selectively
        - Medium
        - >-
          Retained rival pages show converging breadth across payroll, HR, integrations, and global workflows
          rather than isolated point solutions
        - >-
          Request customer cohort data showing how many modules are adopted per account and which combinations
          are most durable
      - - Category trust and execution
        - Support or implementation gaps would erode the benefit of bundle breadth
        - Medium
        - >-
          Trustpilot sentiment is constructive overall, but payroll and onboarding execution still have to
          stay strong for stickiness to hold
        - Review NPS or support-time data segmented by implementation and payroll complexity
      - - Competitive conduct stays rational
        - The Rippling-Deel espionage fight shows category tactics can become aggressive and legally messy
        - Medium
        - >-
          Adverse reporting and legal commentary suggest some competitive moats are being contested through
          rapid intelligence gathering and litigation, not just product differentiation
        - Track legal spillover, feature-copy cycles, and any customer concern about vendor governance
    notes: >-
      Severity reflects likely pressure on Employment Hero’s competitive position rather than certainty of
      loss. Several risks are modular-substitution risks, not full-platform replacement risks.
