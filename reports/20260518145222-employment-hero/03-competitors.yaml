tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / channel signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Employment Hero
        - Reference company
        - 350k+ customers; 470+ Australian partners; strategic reach to 2.5M employees
        - >-
          Australia-led SMEs and growing organisations that want payroll, HR, recruitment, benefits, and
          managed employment support
        - >-
          Local payroll/compliance breadth, partner-led distribution, and HeroForce-managed employment in one
          brand
        - >-
          Retained official evidence confirms plans and enterprise quoting, but not stable public list-price
          cells
      - - Deel
        - Direct global employment suite
        - >-
          Homepage says 40,000+ companies; partner page says 35,000+ companies; 100+ countries of
          infrastructure claimed
        - Cross-border teams prioritising EOR, payroll, compliance, and worker-type coverage
        - Transparent starting EOR pricing plus global compliance, HR, IT, and integration breadth
        - >-
          Official scale signal is internally inconsistent across retained pages, and global scope may be
          broader than many local SME buyers need
      - - Rippling
        - Direct broad workforce suite
        - Partner ecosystem says 20,000+ growing companies
        - Companies wanting one system across HR, payroll, IT, finance, and global operations
        - One-system breadth across HR, payroll, IT, and finance with modular add-ons
        - Required core platform and quote-led packaging can make direct entry-price comparisons harder
      - - HiBob
        - People-core HR hub
        - 5,000+ companies and 1,230,200 people on platform
        - >-
          Midmarket and scaling companies that want modern people operations with payroll and finance
          adjacency
        - All-in-one people platform with native US/UK payroll and Payroll Hub integrations
        - >-
          Retained official pages support payroll adjacency, but not an Australia-first payroll or
          managed-service wedge
      - - BambooHR
        - HR core substitute
        - 33,000+ growth-minded customers; 140+ integrations
        - SMBs that want HR, payroll, and benefits without a broader employment OS
        - Per-employee monthly pricing, automatic volume discounts, and a mature HR-tech marketplace
        - >-
          Less evidence of recruitment, benefits-marketplace depth, and Australia-specific employment
          infrastructure than Employment Hero
      - - Xero
        - Accounting-led payroll substitute
        - 4.9 million customers; 250,000+ accountants and bookkeepers in partner program
        - Small businesses anchored on accounting workflows and accountant channels
        - Strong accountant distribution plus Australian STP-compliant payroll and app ecosystem
        - >-
          Official retained pages evidence payroll and integrations, not a full HR, recruitment, and benefits
          operating system
      - - Employment Innovations
        - Local outsourced payroll / HR substitute
        - Trusted by over 1000+ customers; serves thousands of Australian businesses each year
        - Australia-led employers that prefer outsourced payroll or advisory-heavy support
        - Local payroll and HR service depth, plus Employment Hero-powered HR software
        - Acts partly as a service layer and channel-adjacent route rather than a distinct software moat
      - - Gusto
        - Transparent SMB payroll benchmark
        - 500,000+ SMBs
        - US SMB payroll and HR buyers; used here mainly as a transparency benchmark
        - Clear payroll plan structure and simple payroll/benefits positioning
        - Retained official pages do not evidence Australian payroll compliance or broader employment-OS scope
      - - ADP
        - Incumbent payroll / HCM suite
        - 1.1M clients; 1 in 6 U.S. workers paid; 75 years in market
        - Larger businesses needing payroll, HCM, outsourcing, and multi-country coverage
        - Massive installed-base trust and products from small-business payroll to global payroll
        - >-
          Public posture is enterprise-scale and services-heavy, not obviously tailored to Employment Hero’s
          core SME wedge
      - - Workday
        - Incumbent enterprise platform
        - Marketplace and built-on platform target thousands of customers
        - Midmarket and enterprise buyers standardising HR, finance, IT, and payroll
        - Broad enterprise stack plus partner-built apps and services ecosystem
        - >-
          More enterprise-oriented buying motion and heavier deployment profile than a typical Employment Hero
          customer
    notes: >-
      Scale cells use only retained public signals from the fetched URLs; where exact public pricing was not
      recoverable, the row explicitly notes quote-led or unclear pricing rather than estimating it.
