  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor
      - Public pricing posture
      - Packaging / unit
      - Channel or ecosystem leverage
      - Implication
    rows:
      - - Employment Hero
        - Public plan family exists, but retained pricing text did not surface stable per-seat list prices
        - Multi-plan employment platform plus tailored enterprise pricing on request
        - >-
          470+ Australian partners; referral commissions from 10% in year one; strategic reach into 350,000
          businesses
        - Breadth and channel matter, but comparison shopping is harder than on transparent rival pages
      - - Deel
        - Transparent
        - $599 per employee per month for EOR starting tier; additional country and worker-type tiers
        - Partner page and integrations position Deel as a global operating layer
        - >-
          Direct rival for cross-border hiring buyers and the clearest public price anchor in global
          employment
      - - Rippling
        - Structurally clear but still quote-led
        - Required core platform plus mostly per-employee-per-month module pricing and some base fees
        - Partners can reach 20,000+ growing companies
        - >-
          Bundling can increase switching cost after adoption, but pre-sale price discovery is weaker than
          Deel or Gusto
      - - BambooHR
        - Quote-led with clear charging model
        - Per employee per month with automatic volume discounts
        - Marketplace and partner programs target 33,000+ customers and 140+ integrations
        - >-
          Strong HR-core substitute for cost-aware buyers who do not need HeroForce or broad local payroll
          services
      - - Xero
        - >-
          Transparent accounting pricing plus payroll value proposition inside the small-business accounting
          stack
        - Accounting-led platform with Australian payroll and app-store extensions
        - 250,000+ accountants/bookkeepers and 4.9 million customers
        - Powerful for accountant-led SMB buying motions even though it is not a full employment OS
      - - Employment Innovations
        - Standalone public service price not retained in this run
        - Managed payroll, HR, and Employment Hero-powered HR software
        - Local service relationship can displace or complement software-only buying
        - >-
          Useful substitute when buyers want outsourced local support rather than a software-led
          transformation
      - - Gusto
        - Transparent
        - Clearly segmented contractor-only and payroll tiers with public plan structure
        - Mostly direct digital SMB motion
        - >-
          Acts as a clean benchmark for what transparent SMB payroll packaging looks like, even if geography
          differs
      - - ADP / Workday
        - Quote-led
        - Broader payroll / HCM / enterprise platform packaging
        - Large installed-base, service, and marketplace ecosystems
        - >-
          Incumbent power is real, but the buying motion is heavier and less transparent than payroll-first
          challengers
    notes: >-
      This table compares public pricing posture and packaging logic, not realized discounts or contract
      terms. “Not retained” means the fetched public evidence did not yield a stable, citable price cell for
      this run.
