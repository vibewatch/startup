    - Scale above 350,000 businesses, 30%+ growth, >A$300M ARR, and monetization breadth across payroll, HR, EOR, and employee-fintech
      justify a private premium.
    - Audited revenue quality, better margin evidence, and cleaner Canada execution would strengthen the premium case.
  - - Anti-thesis
    - Current mark still depends on thin disclosure, Canada drag, review-source friction, and contract structures that look
      more conservative than pure software.
    - If public or private diligence reveals weaker economics, structured cap-table overhang, or slower growth, the recommendation
      should move down.
  notes: The anti-thesis is about evidence quality and downside protection, not denial that the company has real scale.
