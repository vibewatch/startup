- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Growth slows before cleaner disclosure arrives
    - Sustained slowdown below the current 30%+ narrative without compensating margin proof
    - Premium multiple loses support quickly against public payroll and HCM comps.
    - Do not underwrite the current mark as attractive.
  - - Canada remains a capital sink
    - No credible local path to profitability after continued investment
    - Expansion optionality turns into margin drag.
    - Reduce upside case and treat Canada as a discount factor.
  - - EOR / contract risk proves harsher than expected
    - Partner allocation, liability caps, or advance-funding terms materially weaken customer protection
    - Hybrid service economics deserve a lower multiple than pure software.
    - Re-underwrite using lower public-comp analogues.
  - - Cap-table or disclosure surprise
    - Preference stack, ratchets, or missing audited economics are materially worse than assumed
    - Headline valuation no longer reflects true common-equity economics.
    - Pause process until waterfall and revenue quality are clear.
  notes: Kill triggers are framed around measurable underwriting failures, not generic “watch this” warnings.
  claimRefs:
