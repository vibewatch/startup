- id: thesis-and-anti-thesis
  title: The thesis is scale and breadth; the anti-thesis is disclosure, Canada drag, and premium dependence
  body: The pro-valuation case is straightforward. Employment Hero appears to be building a broad employment operating system
    rather than a single payroll point solution. The company’s own scale disclosures, Sacra’s ARPU and monetization framing,
    and the Humi acquisition all support a story in which payroll, HR, recruitment, employee-facing fintech, and EOR expand
    the number of ways the company can grow wallet share. The anti-thesis is just as important. Canada is still not profitable
    on its own, the EOR layer appears contractually more conservative than pure software, and public review sources continue
    to surface support, pricing, and implementation friction. Most importantly, the disclosure gap versus public comps remains
    large. Public buyers can read SEC or investor materials for ADP, Paychex, Paycom, Workday, or Xero; they cannot do the
    same for Employment Hero’s margins, cap table, or reserve posture. That means the premium still rests on trust more than
    proof.
