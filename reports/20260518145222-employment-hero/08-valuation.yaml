- id: diligence-gates-and-thesis-breaks
  title: What still blocks underwriting and what would change the view
  body: 'The key remaining question is not whether Employment Hero is interesting. It is whether the current entry price offers
    enough reward for the disclosure and execution gaps still visible in public. The indispensable diligence asks are basic:
    reconcile the revenue bridge between third-party 2025 estimates and the company’s 2026 ARR claim, show gross margin and
    free-cash-flow quality, clarify net retention and module attach, and disclose the real cap-table economics of the current
    mark. Those items matter because the current valuation case is exquisitely sensitive to even small changes in growth,
    margin, and downside protection. The public record also leaves investors unable to separate ordinary software gross margin
    from any lower-margin services, partner, or payroll-funding exposure, which is exactly the sort of mix question that can
    make a seemingly fair headline multiple turn expensive very quickly. If management can evidence resilient 30%+ growth,
    improving profitability, and clean contractual or cap-table structure, the call can move toward track. If growth slows
    before those proofs arrive, or if Canada and EOR execution remain capital-intensive longer than expected, the premium
    should compress quickly toward public-software precedent.'
