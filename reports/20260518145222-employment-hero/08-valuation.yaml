    - Much larger and lower-growth than Employment Hero.
  - - Paycom
    - EV / sales; payroll + HCM software
    - ≈3.3x-3.4x EV / sales
    - Useful software-led midmarket comparator.
    - Narrower product surface and public-market discipline.
  - - Employment Hero (implied)
    - valuation / ARR
    - ≈7.3x on >A$300M ARR or ≈8.8x on >A$250M ARR
    - Frames the premium investors are underwriting for private growth and breadth.
    - Relies on private-market price discovery and company-claimed current ARR.
