- id: public-comps-and-range
  title: Public HCM comps put discipline around the premium and bound the valuation range
  body: Comparable context is not perfect, but it is still essential. Across Multiples.vc and Stock Analysis, the most relevant
    public payroll and HCM comps mostly sit in a band from roughly 3x to 6.5x enterprise value to revenue, with Dayforce and
    Paychex near the upper end and Workday, Paycom, and ADP below that. Against that backdrop, Employment Hero’s implied sub-7.3x
    multiple on official ARR, or about 8.8x on KKR’s older ARR anchor, is clearly above public precedent but not absurd for
    a faster-growing private asset with broader platform optionality. That does not make it cheap. It means the current price
    probably lives in the upper half of a supportable public-evidence range rather than outside it entirely. The public record
    therefore supports a wide range around the current mark, not conviction that investors are being paid for the uncertainty.
