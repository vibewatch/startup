  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Revenue bridge
    - Audited ARR and revenue bridge from 2025 estimates to the 2026 official ARR statement
    - Current multiple support changes materially depending on the true revenue anchor.
    - Request CFO bridge, board materials, and auditor-reviewed definitions.
  - - Margin quality
    - Gross margin, EBITDA, free cash flow, and product-level mix
    - A premium multiple is far easier to defend if the business already behaves like scaled software.
    - Obtain management reporting pack or product-family economics.
  - - Retention and attach
    - Net revenue retention, logo retention, attach by cohort, and churn by product family
    - Breadth only deserves a premium if cross-sell and retention are real.
    - Request cohort analysis by customer size and geography.
  - - Cap-table economics
    - Liquidation preferences, participation, ratchets, and employee tender mechanics
    - Headline valuation may overstate common-equity economics.
    - Review financing docs and waterfall analysis.
  - - Canada unit economics
    - Local revenue, margin, CAC, payback, and break-even plan
    - Canada is both the clearest upside option and the clearest drag risk in public sources.
    - Request country P&L and operating KPI pack.
  - - EOR partner and liability structure
    - Country-level partner map, indemnities, reserve policy, and payroll-funding mechanics
    - Hybrid service exposure can justify a discount versus pure SaaS.
    - Request Global Teams legal-entity matrix, partner roster, and claims history.
  notes: These items are the minimum needed to move from a public-evidence view to an investable underwriting view.
