companyProfile:
  summary: Employment Hero is a Sydney-founded private employment-software company that sells an AI-powered Employment Operating System spanning hiring, HR, payroll, benefits, employee-financial-wellbeing features, and selected managed employment services. Public evidence supports broad SMB scale, with more than 350,000 businesses, more than 2.5 million employees managed, ARR above A$300 million, and a February 2026 secondary transaction that implied roughly A$2.2 billion of valuation. The company looks strategically relevant in SMB employment infrastructure, but public underwriting evidence remains incomplete on margins, retention, cap-table economics, and current headcount.
