  title: Customers
summary: 'Employment Hero’s public customer record is convincing on adoption reality: numerous named production accounts, strong admin-efficiency outcomes, and a visible partner channel. The gaps are on durability quality and concentration. Public sources show satisfaction and real usage, but they do not provide suite-wide retention cohorts, churn, or revenue concentration data.'
sections:
- id: S601
  title: 'Customer mix: proof is broadest across SMB and mid-market employers with distributed operations'
  body: 'Employment Hero’s public customer evidence is meaningfully broader than a logo wall, but it still skews toward the operating patterns where the product is most differentiated. The case-study hub spans retail, hospitality, defence contracting, NFP/community services, IT services, legal services, healthcare, childcare, and multi-country employer-of-record workflows. The partner directory and resource hub add another angle: the company is not serving one narrow vertical, because advisors, payroll implementers, and HR consultants across six countries are packaging the software into many SMB operating contexts. The most convincing named stories cluster around buyers with manual onboarding, fragmented HR/payroll systems, compliance-heavy admin, or geographically distributed teams. That suggests the product resonates when operational complexity is high relative to company size. Public scale numbers should still be handled carefully. Current company-authored pages cite hundreds of thousands
    of businesses and millions of users, while some third-party directories still show materially older figures. So the right conclusion is that adoption is broad and real, but denominator precision remains uneven outside current official copy. In diligence terms, Employment Hero looks like a genuine cross-vertical SMB platform, yet one whose public customer-count narrative still needs reconciliation across current and legacy publisher surfaces. That is especially relevant for later chapter work on financials and market share, because a business can have broad anecdotal proof and still leave investors uncertain about the exact denominator behind terms like customers, organisations, users, and active employers.'
  claimRefs:
  - CU001
  - CU002
  - CU013
  - CU014
  - CU015
  - CU017
  - CU027
  - CU028
  - CU030
  - CU043
