    - Positive
    - Merchantwise and case-study hub show EOR/global-employment adoption
    - Request country-level volume, gross margin, and partner model
  - - Advisor / referral channel dependence
    - Mixed
    - 470+ AU partners, partner directory, affiliate programs, and PartnerStack presence
