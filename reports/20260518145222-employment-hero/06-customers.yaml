  - Gap
  rows:
  - - Domestic SMB employers
    - Owner, HR lead, payroll admin / employee
    - Core HR, payroll, onboarding, leave, compliance
    - ROI pages and partner copy frame Employment Hero around SME admin pain
    - No public segment revenue split
  - - Multi-site retail / hospitality operators
    - HR manager, store manager, payroll / frontline employee
    - High-volume onboarding, recruitment, leave, payroll, mobile self-service
    - Jo Mercer and Alchemy show 27 locations / 9 venues respectively
    - No public retention by sub-vertical
  - - Compliance-sensitive not-for-profits and service organisations
    - People-and-culture leader / staff and managers
    - Digital HR documents, onboarding controls, audit readiness
    - UMFC and case-study index show NFP uptake with quantified savings
    - No public public-sector win rate or churn
  - - IT and professional-services SMBs
    - Head of People / managers and employees
    - Integrated HR + payroll + recruitment + performance
    - Sentrian shows long-term use; Merchantwise shows international coordination
    - Enterprise-scale penetration still under-disclosed
  - - International employment buyers
    - HR lead / globally distributed employees
    - HeroForce / EOR contracts, onboarding, visibility, compliance
    - Merchantwise and other HeroForce stories show eight-country usage
    - Country-by-country volume not public
  - - Advisor / partner-led customers
    - Accountant, bookkeeper, payroll advisor, consultant / end employer
    - Resold or referred HR/payroll implementation and support
    - 470+ AU partners and six-country directory show indirect route to market
    - Channel share and partner-sourced ARR absent
  summary: Public proof is strongest where Employment Hero reduces employment administration for SMBs or distributed employers with real complexity.
