  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Suite-wide NRR, GRR, churn, and true retention cohorts
    missingEvidence: The retained public set contains review scores and isolated long-lived accounts, but no suite-wide renewal, churn, or cohort tables.
    whyItMatters: Durability quality cannot be underwritten on named wins alone; investors need cohort behavior by segment, geography, and module mix.
    diligencePath: Request logo churn, gross retention, net revenue retention, renewal rates, and cohort data split by geography and product set.
    relatedQuestionRefs:
    - QU018
    - QU025
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Top-customer, channel, and partner concentration
    missingEvidence: No retained source quantified revenue concentration, partner-sourced ARR share, or dependence on any marketplace or referral channel.
    whyItMatters: A partner-heavy SMB distribution model can look attractive until concentration, discounting, or support burden is measured explicitly.
    diligencePath: Request revenue by top 10 customers, channel mix, partner contribution to pipeline/ARR, and renewal by acquisition source.
    relatedQuestionRefs:
    - QU020
    - QU025
    - QU026
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: Implementation quality and support-performance metrics
    missingEvidence: Review sites show repeated complaints, but the retained public evidence does not include first-response time, resolution time, implementation duration, or escalation statistics.
    whyItMatters: Support burden and rollout friction can materially affect durability even if customer acquisition is healthy.
    diligencePath: Request support SLA adherence, ticket backlog trends, implementation-time distributions, and cancellation reasons.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: Exhaustive named-customer enumeration
    missingEvidence: The public case-study hub contains many more names than could be fully corroborated in the retained source set for this chapter.
    whyItMatters: A fuller enumeration could improve confidence in vertical breadth and freshness across the catalog.
    diligencePath: Expand the enumeration with additional direct customer stories, customer-owned references, and procurement-style records.
    relatedQuestionRefs:
    - QU001
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: Reconciled customer-count history across official and third-party surfaces
    missingEvidence: Retained directories and review pages cite materially different customer totals across years.
    whyItMatters: Without a reconciled active-account definition, public scale claims are directionally useful but not precision-grade.
    diligencePath: Request management’s current active-customer definition and historical bridge from older published totals to current totals.
    relatedQuestionRefs:
    - QU003
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
