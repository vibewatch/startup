  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: >-
          Product definition and module map: Employment Hero is selling an employment operating system, not a single
          payroll tool
        blocks:
          - type: paragraph
            body: >-
              Employment Hero’s own product surface makes the positioning clear: the company is trying to own the full
              employment workflow for SMBs, not merely bolt HR features onto payroll. The main products page presents
              Employment OS as one system spanning Hiring, HR, Payroll, and Benefits, then expands that bundle into
              concrete modules such as applicant tracking, onboarding, employee management, offboarding, analytics, HR
              advisory, implementation services, earned-wage access, and Employer of Record services. The operating idea
              is that employee data, approvals, leave, timesheets, payroll, and engagement all live in one place, which
              matters because it reduces handoffs between point tools and makes packaged self-service features more
              valuable. Public evidence is strong that the breadth is real, especially for recruitment, HR records,
              payroll automation, benefits, and partner integrations. What remains less transparent is module attach,
              customer mix by SKU, and the boundary between software-only functionality and higher-touch service layers
              such as managed payroll or HeroForce global employment support.
