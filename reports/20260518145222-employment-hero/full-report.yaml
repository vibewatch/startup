    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Employment Hero’s public identity is no longer that of a narrow payroll vendor. The homepage and products
              catalog both frame the company as an Employment Operating System that combines hiring, HR, payroll, and
              benefits, while the homepage also highlights HeroForce as a more managed “done for you” layer for
              employers that want operational help rather than software alone. That matters because it places the
              business in a wider SMB workflow category with multiple monetisation surfaces and a stronger claim to
              strategic relevance than point payroll software. Public scale markers also appear consistently enough to
              anchor the chapter: the homepage says the platform is trusted by 350k+ customers, the February 2025 ARR
              milestone says 350,000 businesses managing two million employees were already on the platform, and the
              February 2026 stake-sale announcement lifts that to more than 350,000 businesses and 2.5 million employees
              managed worldwide. Sydney remains the safest HQ anchor, but the best direct evidence is still a
              third-party company profile rather than a registry filing, so the legal-entity and HQ evidence is
              directionally strong rather than perfect.
