      - number: '6.3'
        title: >-
          Durability, expansion, and risk: partner reach is visible, but support friction and concentration remain
          under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The expansion logic is visible even without private cohort data. Official stories regularly move from core
              HR/payroll into recruitment, mobile self-service, performance workflows, or HeroForce global employment.
              The channel also matters: Employment Hero says it has more than 470 Australian referral partners, a
              structured tiering model, a public partner directory across six countries, and an affiliate program with
              demo-bounty economics. That is good evidence that advisors and payroll specialists can act as demand
              multipliers. The risk side is equally visible. Trustpilot, G2, Software Advice, Xero App Store, and
              editorial reviews all show satisfaction and real use, but they also converge on implementation/setup
              friction, slower support or cancellation handling, reporting limitations, and occasional product bugs. The
              Xero marketplace is especially adverse because its score is far lower than the main review portals and
              includes overbilling and integration-failure complaints. Public concentration disclosure is still absent,
              and channel-share economics are only partially visible. So the customer verdict is positive on adoption
              reality and cross-sell logic, but still incomplete on retention quality, concentration, and support
              scalability. Investors can get comfortable that customers exist and derive value; they cannot yet get
              equally comfortable on the durability and support-efficiency math that sits underneath those wins. The gap
              is manageable, but it changes the burden of proof: management must supply retention, concentration, and
              service-quality operating data rather than relying on case studies and review sentiment alone.
