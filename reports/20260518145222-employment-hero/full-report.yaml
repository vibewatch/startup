        - label: 'Price anchor: ≈A$2.2B secondary in February 2026'
        - label: 'Disclosure gap: no public margin, cap-table, or audited revenue bridge'
        - label: 'Execution drag: Canada still needs proof and EOR contracts look conservative'
        - label: 'Recommendation: research-more at current price; require cleaner proof or lower entry'
