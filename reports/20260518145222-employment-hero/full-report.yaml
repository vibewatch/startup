      - number: '2.3'
        title: Buyer, user, and payer motion is cross-functional
        blocks:
          - type: paragraph
            body: >-
              Employment Hero’s buyer map starts with a workflow pain point, but the decision rarely stays inside one
              function. The company markets to SMEs and growing organisations, and both product copy and review evidence
              show HR and payroll teams as the usual first sponsor because they own onboarding, payslips, leave, and
              core employee records. Finance becomes a gatekeeper because payroll taxes, super, PAYE, and reporting
              accuracy sit inside broader control obligations, while recruiting managers care when job-board
              distribution and applicant workflow are part of the deployment. Employees matter as active users too:
              self-service, mobile app access, and benefits are part of the package, which changes the product from a
              back-office admin tool into a daily-use system. The resulting adoption path differs by segment. A micro
              employer may begin with an owner or accountant replacing manual payroll. A growing SME is more likely to
              start with people ops or a payroll lead, then pull in finance. A multi-country buyer adds legal and
              compliance review because HeroForce and EOR-like services change who employs the worker of record. That
              cross-functional motion helps explain why Employment Hero’s market is a workflow shell spanning payroll,
              recruitment, compliance, and employment administration rather than a single budget line.
