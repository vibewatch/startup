      - number: '3.2'
        title: Pricing, packaging, and ecosystem leverage
        blocks:
          - type: paragraph
            body: >-
              The most important commercial distinction is transparency versus bundling. Employment Hero clearly sells a
              multi-plan product family, but the retained official material in this run did not surface stable
              plan-level price cells, so buyers still have to infer a lot of the commercial story from demos and quote
              flows. By contrast, Deel publishes starting EOR pricing, Gusto publishes explicit payroll tiers, and
              Rippling at least states the structural rule that every product sits on top of a required core platform.
              That difference matters because payroll and HR buyers often build shortlists by normalizing the first
              visible price anchor, not by waiting for a consultative sales process. Ecosystem leverage complicates the
              comparison further. Employment Hero says it has 470+ Australian partners and can expose strategic allies
              to 350,000 businesses and 2.5 million employees, which is meaningful for an SME-led channel motion. But
              Xero’s accountant network is far larger, BambooHR already sells into 33,000+ marketplace-connected
              customers, Rippling offers partners exposure to 20,000+ companies, and Workday markets a formal
              marketplace and partner-built application layer for thousands of customers. The result is that Employment
              Hero has a real channel asset, but it competes against rivals whose ecosystems are larger either in
              accounting distribution, HR-tech integrations, or enterprise services. Pricing opacity therefore matters
              twice: it makes direct comparison harder and gives ecosystem-heavy rivals more room to frame the decision
              around their own entry points.
