  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays research-more because the current mark is plausible but not fully underwritten
        blocks:
          - type: paragraph
            body: >-
              Employment Hero does not look obviously overvalued in the sense of being disconnected from scale, but the
              public record still falls short of a buy-grade underwriting case. The strongest anchor is the February
              2026 secondary transaction that Startup Daily said implied about A$2.2 billion. That price is not
              happening in a vacuum. Employment Hero itself says ARR has surpassed A$300 million, growth remains above
              30 percent, and the platform already supports more than 350,000 businesses, more than 2.5 million
              employees, and over A$120 billion in annual payments. Those are real premium-quality signals. The problem
              is that price discovery is still private, current disclosure is thin, and the same public record still
              leaves major gaps on cap-table terms, audited margins, and the persistence of profitability. That is
              enough for a research-more call at the current mark, not enough for a buy.
            claimRefs:
              - CV001
