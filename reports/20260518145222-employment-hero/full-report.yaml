  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing posture, and monetisation breadth
        blocks:
          - type: paragraph
            body: >-
              Employment Hero’s public surfaces show a platform that sells across the employment workflow rather than
              around one payroll SKU. The official pricing, solutions, and products pages organise the offer around
              hiring, HR, payroll, benefits, and HeroForce, while the product catalog adds employer-of-record services,
              the Work superapp, and earned wage access. That structure implies a layered revenue model: recurring
              software seats, premium workflow modules, cross-border compliance services, and employee-side
              financial-wellbeing features. The pricing signal is more ambiguous. Officially, the company still routes
              buyers through product and demo flows rather than disclosing a clean list price schedule, which suggests a
              sales-led packaging strategy. Independent pricing pages give direction but not certainty: TrustRadius
              shows five plans running roughly A$6-A$27 per employee per month with an A$80 minimum spend, while People
              Managing People says buyers often need a demo and that richer tiers or global support move into custom
              pricing. The safest interpretation is that list-price anchors exist, but actual monetisation depends on
              module mix, geography, and negotiated service scope.
