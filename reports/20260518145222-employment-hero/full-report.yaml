      - number: '2.4'
        title: Compliance and digitisation support demand, but trust and pricing opacity still matter
        blocks:
          - type: paragraph
            body: >-
              The demand case for Employment Hero is strongest where compliance, digitisation, and labour complexity
              meet. STP in Australia, payday filing in New Zealand, and PAYE plus FPS reporting in the UK all push
              employers toward software or bureau-grade processes that can file accurately on each payday. UK policy
              work adds a second tailwind: governments increasingly see SME digital adoption as a route to lower admin
              burden and higher productivity. But the same public evidence also shows why the market will not convert
              cleanly or instantly. UK research says SMEs still need personalised support, and the taskforce highlights
              time, cash, and know-how gaps. Historical ABS data points the same way in Australia, where cloud uptake
              rises with size and limited knowledge can still slow adoption. Employment Hero-specific frictions are
              visible too. Review platforms surface setup, reporting, and payroll-support complaints; the status page
              records a May 2026 HR outage; and the Seek litigation makes recruitment-adjacent trust a live diligence
              issue even if it does not weaken payroll regulation itself. Pricing is another constraint. Public review
              sites disagree on visible entry pricing but agree the product is modular and quote-led. For valuation,
              that means underwriting adoption from compliance pain and substitute replacement, while discounting for
              support risk, trust noise, and the absence of public attach-rate or geography-mix disclosures.
