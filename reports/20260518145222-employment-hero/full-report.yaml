  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Stack view of Employment Hero’s public product architecture: an employment data core supports packaged workflows,
      integration surfaces, and trust layers across the lifecycle.
    data:
      layers:
        - label: Lifecycle acquisition layer
          detail: >-
            Hiring, ATS, SmartMatch, talent search, and onboarding tools pull candidate and new-hire workflows into the
            platform.
        - label: Core employment system
          detail: >-
            Employee records, leave, timesheets, payroll, HR documents, policies, and analytics sit in the central
            Employment OS data model.
        - label: Engagement and self-service layer
          detail: >-
            Benefits, Work app, earned-wage access, notifications, and employee self-service extend usage beyond
            administrator-only workflows.
        - label: Connectivity layer
          detail: >-
            Packaged integrations, REST API, OAuth, webhooks, and partner-led implementation connect Employment Hero to
            external payroll, finance, and workforce tools.
        - label: Assurance layer
          detail: >-
            Trust centre, security controls, and public status reporting provide buyer-facing trust and operational
            visibility.
    approximationNotes: null
