      - number: '7.2'
        title: >-
          Operational reliability and data handling are mission-critical because payroll and employee records are
          involved
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a meaningful mitigation stack, but it also shows why buyers should still treat
              reliability and privacy incidents as top-tier risks. Employment Hero’s help material describes AWS-based
              hosting, TLS, logging, DDoS mitigation, daily backups, and an average monthly uptime figure of 99 percent,
              while the Trust Centre now exposes a broader set of security and compliance artifacts. Those are genuine
              positives. The problem is that the same public record still shows a platform outage in May 2026, gated
              access to the most diligence-useful reports, and no public incident-rate or service-credit data. The
              privacy side is similarly two-sided. Fair Work and ATO guidance treat employee payroll, tax, super,
              banking, and cloud-stored data as especially sensitive, and Employment Hero’s own privacy policy confirms
              the platform touches exactly those data classes. In a system where payroll accuracy and employee access
              matter on deadlines, a resolved incident does not become immaterial simply because it was eventually
              fixed.
