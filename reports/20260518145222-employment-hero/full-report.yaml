  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Payroll, privacy, and partner law create the deepest residual risk stack
        blocks:
          - type: paragraph
            body: >-
              Employment Hero is not just selling ordinary workflow software; it is automating payroll, recruitment,
              employee records, and cross-border employment inside jurisdictions where mistakes carry regulatory, legal,
              and customer-trust consequences. The strongest public evidence on this point is mundane rather than
              dramatic. Employment Hero itself says 2026 brings major legal changes for employers, while ATO and Fair
              Work material makes clear that STP, payday super, underpayment enforcement, and privacy handling are live
              operational obligations rather than static rules. The SEEK dispute also matters even though the parties
              settled. The case ended with API access restored, but only subject to terms, which confirms that
              third-party platform access can move from convenience to legal and commercial dependency. The privacy
              layer is equally material because Employment Hero’s own policy covers payroll, tax, super, ID, biometrics,
              EOR, and recruitment flows. That means the downside is not just a fine; it is a product whose most
              valuable workflows sit squarely inside changing payroll, privacy, and partner-governance regimes.
