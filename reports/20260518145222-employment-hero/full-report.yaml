        title: >-
          Operating model: packaged integrations and a plan-gated developer surface connect the suite to external
          systems
        blocks:
          - type: paragraph
            body: >-
              The public technical story is strongest at the application and workflow layer. Employment Hero exposes a
              documented REST/JSON API at api.employmenthero.com, uses OAuth 2.0 bearer-token access with refresh
              tokens, documents breaking-change versioning, and explicitly describes regional behavior for AU, MY, SG,
              NZ, UK, and CA payroll contexts. The April 2026 help article is especially useful because it shows the API
              has moved beyond read-only access into read/write endpoints for employee lifecycle events, leave, and
              timesheets. That materially improves the integration story, but there is a commercial caveat: custom API
              access is only available on upper plans, so smaller customers are pushed toward packaged connectors or
              partner-led implementations rather than bespoke integrations. The integrations directory plus Xero and
              QuickBooks landing pages show why that matters. Employment Hero is not closed; it supports one-click
              accounting sync, leave and timesheet propagation, and employee self-service data flows into third-party
              finance systems. Developer-signal sources reinforce that external builders are using the surface, though
              the open-source ecosystem is still modest relative to larger horizontal SaaS platforms.
