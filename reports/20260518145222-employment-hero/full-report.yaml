      - number: '1.2'
        title: Founders, leadership bench, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The founder story is well anchored. Employment Hero’s About page says Ben Thompson founded the company
              with Dave Tong in 2014, and it still positions Thompson as the public face of the business. Third-party
              company profiles expand that picture by naming Tong as CPTO plus a broader bench that includes CFO Rob
              Paterson, CRO Kevin Rawlings, and several general managers and chiefs of staff. That creates a usable
              public picture of functional coverage even though a full board roster remains elusive. Governance is
              therefore better evidenced at the executive level than at the board level. The strongest current caution
              is that public controversy is concentrated around the founder-CEO. SmartCompany documented Thompson’s feud
              with Hostplus, while the SEEK litigation exposed how dependent Employment Hero’s hiring and distribution
              flows could become on strategic relationships. Taken together, the company looks founder-led with a
              meaningful operating bench, but not yet transparently governed enough from public sources to settle
              questions about board control, investor rights, or post-KKR governance changes.
