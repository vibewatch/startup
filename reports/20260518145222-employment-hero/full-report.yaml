  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Employment Hero’s top risks transmit through a few common channels: regulatory failure, partner breakage, or
      outage pressure flows into customer trust, remediation cost, and valuation support.
    data:
      nodes:
        - id: reg
          label: Payroll / privacy regulation
          detail: Changing payroll rules and sensitive employee-data handling raise product and operations burden.
          tone: warning
        - id: partner
          label: API / EOR partner dependence
          detail: Job-board access and local-partner execution remain external points of failure.
          tone: warning
        - id: ops
          label: Outage / support fragility
          detail: Platform incidents and slow support hit payroll-critical trust.
          tone: warning
        - id: trust
          label: Customer trust and renewal
          detail: Mission-critical buyers expand only if payroll and data handling feel dependable.
          tone: warning
        - id: cost
          label: Remediation and compliance cost
          detail: Support load, legal work, and local execution can compress margins.
          tone: negative
        - id: valuation
          label: Valuation support
          detail: Higher residual risk lowers willingness to pay for a private premium.
          tone: negative
      edges:
        - from: reg
          to: ops
        - from: reg
          to: cost
        - from: partner
          to: ops
        - from: partner
          to: trust
        - from: ops
          to: trust
        - from: ops
          to: cost
        - from: trust
          to: valuation
        - from: cost
          to: valuation
    approximationNotes: The graph is qualitative; it encodes direction of pressure rather than event probability or magnitude.
    claimRefs:
      - CR016
      - CR024
      - CR030
      - CR035
      - CR041
      - CR043
      - CR046
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Dependency risk spans job-board access, cloud and identity infrastructure, accounting integrations, EOR partners,
      and the Canada operating platform; several nodes can disrupt payroll or growth without any one being the sole
      failure point.
    data:
      nodes:
        - id: seek
          label: Recruitment / job-board access
          detail: Customer workflow can rely on third-party posting integrations.
          tone: warning
        - id: cloud
          label: AWS and security stack
          detail: Core infrastructure, identity, and recovery posture sit on a shared technical base.
          tone: warning
        - id: integrations
          label: Accounting and comms integrations
          detail: Journal export, calendar sync, and workflow automation depend on connected tools.
          tone: warning
        - id: partners
          label: EOR local entities / partners
          detail: Cross-border employment depends on partner execution and contract structure.
          tone: warning
        - id: canada
          label: Canada operating platform
          detail: Humi integration creates upside but still needs scale and profitability.
          tone: warning
        - id: core
          label: Employment Hero operating core
          detail: Unified payroll, HR, recruitment, and employee-data platform.
          tone: positive
        - id: customer
          label: Customer-critical outcomes
          detail: Payroll accuracy, onboarding, employee access, and renewals.
          tone: warning
      edges:
        - from: seek
          to: core
        - from: cloud
          to: core
        - from: integrations
          to: core
        - from: partners
          to: core
        - from: canada
          to: core
        - from: core
          to: customer
        - from: seek
          to: customer
        - from: partners
          to: customer
    approximationNotes: This is a qualitative dependency map, not a spend-weighted vendor architecture diagram.
    claimRefs:
