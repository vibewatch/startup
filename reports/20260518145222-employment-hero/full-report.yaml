  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      The model combines software economics with payroll, compliance, support, and employee-money workflows that can all
      pressure gross margin or working capital differently.
    data:
      columns:
        - label: Gross margin pressure
        - label: Working-capital exposure
        - label: Why it matters
      rows:
        - label: Payroll operations
          values:
            - Medium
            - Low to medium
            - Automation helps, but compliance and local support still create service cost.
        - label: Employer of Record
          values:
            - High
            - Medium
            - Cross-border compliance, local hiring, and entity management are labour intensive.
        - label: Work app + earned wage access
          values:
            - Medium
            - Medium
            - Employee-money features can add support load and payment-timing complexity.
        - label: AI and product expansion
          values:
            - Medium
