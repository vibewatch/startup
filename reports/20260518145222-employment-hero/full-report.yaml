      - number: '4.2'
        title: Public traction, efficiency proxies, and cost-structure signals
        blocks:
          - type: paragraph
            body: >-
              Public traction indicators are unusually strong for a private SMB software company. Employment Hero itself
              said it crossed A$250 million annualised ARR in February 2025, A$300 million ARR by October 2025, and more
              than A$30 million of new ARR in the first half of 2025, all while moving into EBITDA-positive territory.
              The company now cites more than 350,000 businesses, 2.5 million employees managed, and over A$120 billion
              in annual payments. Those markers make the platform look large enough to matter in payroll and employment
              infrastructure. The caution is that the model likely carries more operational weight than a pure HRIS.
              Official payroll pages advertise automation, while the EOR page promises compliant hiring in 180 countries
              and the Work app layers wages, savings, and benefits into the product. The 2026 super report reinforces
              the compliance intensity by documenting payroll-administration friction and weak employer readiness for
              Payday Super. Third-party proxies are useful but noisy: G2 shows two-month implementation and support
              complaints, Unify suggests a sizable sales-and-support organisation, and GetLatka points to 144
              quota-carrying reps. Taken together, the public evidence supports scale and product breadth, but not a
              clean margin profile.
