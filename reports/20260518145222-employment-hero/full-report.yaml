      - number: '4.3'
        title: Capital adequacy, funding dependency, and what still blocks underwriting
        blocks:
          - type: paragraph
            body: >-
              The best public case for capital adequacy is indirect but still meaningful. The company’s own Series F
              announcement says disclosed lifetime capital raised exceeded A$650 million, the KKR and Business Wire
              releases show a new strategic investor buying in from SEEK while SEEK remains material, and Startup Daily
              says the secondary transaction implied a A$2.2 billion valuation that was 19% above the June 2024 mark.
              Official ARR releases also matter because they frame the company as scaling into profitability rather than
              raising to plug a near-term hole. Even so, no retained public source discloses current cash on hand,
              monthly burn, runway, gross margin, or retention. SEEK’s filings are still useful because they establish
              the Growth Fund structure behind the selldown, but they do not give Employment Hero operating metrics.
              That leaves the financial verdict mixed but investable: the revenue engine appears broad and the company
              still attracts high-quality capital, yet true underwriting still stalls on absent private metrics for
              liquidity, gross profit, retention, and realised pricing discipline. The practical implication is that
              Employment Hero now looks financeable but not fully underwriteable from public sources alone. Investors
              can see demand, valuation support, and some evidence of margin progression, yet they still cannot model
              downside protection, covenant pressure, or steady-state free cash flow. That is why the capital-adequacy
              question remains half-answered: the company appears able to attract sophisticated shareholders, but
              outside investors still need treasury, retention, and gross-margin detail before treating the public
              record as sufficient for investment-committee approval.
