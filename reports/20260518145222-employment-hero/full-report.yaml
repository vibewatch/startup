      - number: '3.3'
        title: Moat durability, switching costs, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Employment Hero’s strongest moat claim is the combination of local compliance depth, partner distribution,
              and managed employment infrastructure in one brand. That package can create real switching friction when a
              customer already runs Australian payroll, HR admin, recruiting, employee benefits, and partner workflows
              inside the same environment. Trustpilot’s aggregate review summary also suggests users value streamlined
              payroll and onboarding support, which supports the idea that the product can become operationally
              embedded. But the moat is not cleanly durable. First, the most contested front is global employment and
              adjacent automation, where Deel, Rippling, HiBob-style HR hubs, and Remote-style global HRIS comparisons
              all push buyers toward broader cross-border suites. Second, the category is highly modular: Xero plus
              accountants, outsourced payroll firms like Employment Innovations, or point HR tools can replace enough of
              the workflow to keep Employment Hero from owning the whole stack. Third, the global-suite leaders
              themselves show signs of fast-moving feature and competitive pressure. Deel’s own official pages do not
              even present a perfectly consistent company-count signal, and the Rippling-Deel espionage fight reported
              by HR Brew and framed in legal terms by National Law Review shows how aggressively vendors are trying to
              defend or accelerate position. The takeaway is that Employment Hero has a credible local and partner-led
              wedge, but its moat depends on execution, switching costs, and bundled workflow value more than on any
              structurally closed category.
