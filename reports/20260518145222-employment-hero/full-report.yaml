      - CR009
      - CR030
      - CR033
      - CR035
      - CR039
      - CR045
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation remains cautious because meaningful scale and breadth still meet thin disclosure and a
      private-market premium.
    data:
      nodes:
