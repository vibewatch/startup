      - number: '6.2'
        title: Named customer proof is strong on production use and admin ROI, but weaker on cohort durability
        blocks:
          - type: paragraph
            body: >-
              Employment Hero clears the named-customer-proof bar because retained sources go beyond vague testimonials.
              NORSTA says payroll processing fell from several days to under 30 minutes, while self-service removed the
              need for an admin assistant. UMFC describes 100% digital HR documents and fewer missed workflow steps
              across a 120-plus-staff not-for-profit. Merchantwise shows HeroForce being used for 160-plus employees
              across eight countries, with contracts issued in one to two days. Alchemy Saunas quantifies a major
              screening-time improvement during rapid venue expansion. Other direct stories extend the pattern: Jo
              Mercer uses the platform across 27 locations and roughly 300 staff with onboarding in about 10 minutes per
              person; Sigma says it saves at least 10 hours a week on onboarding-related work; Sentrian says it has used
              Employment Hero since 2019 and now runs payroll reconciliation as a one-click process. Those are concrete
              production signals. They are also diverse enough to show that Employment Hero is being used to run
              day-to-day employment workflows, not just pilot projects or marketing showcases. What is missing is a
              broad public retention dataset. The public record offers isolated durability points and large review
              volumes, but no suite-wide NRR, GRR, churn, or cohort tables. In other words, the chapter can confidently
              establish production adoption and proof-of-value, but it still cannot translate those wins into a
              portfolio-style durability statement for the overall installed base.
