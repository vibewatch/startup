    type: flow
    layout: wide
    summary: Publicly evidenced workflow from candidate discovery to payroll, self-service, and finance sync.
    data:
      nodes:
        - id: n1
          label: Find talent
          detail: Employer starts with ATS, SmartMatch, or other hiring tools inside Employment Hero.
        - id: n2
          label: Digitally onboard hire
          detail: Contracts, details capture, compliance steps, and approvals move into one workflow.
        - id: n3
          label: Run HR and payroll
          detail: Employee data, leave, timesheets, and payroll processing operate from the same system of record.
        - id: n4
          label: Employee self-service
          detail: Employees use the Work app and portal for leave, bank details, payslips, and other admin actions.
        - id: n5
          label: Sync external systems
          detail: Xero, QuickBooks, and custom API integrations push or pull data into finance or adjacent systems.
        - id: n6
