      - number: '2.2'
        title: Official business-count shells show a large market, but not a clean SAM
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing evidence for Employment Hero is employer-count shell data, not a vendor-style
              TAM. In Australia, ABS counted 994,178 employing businesses at June 2025 inside a much broader universe of
              2.73 million actively trading businesses, and it separately shows 688,870 businesses with one to four
              employees. In New Zealand, Stats NZ counted 612,420 enterprises at February 2024, but 73% had no paid
              employees; that implies only about 165,000 enterprises with paid employees, and even that is an agent-side
              estimate rather than a published official employer count. In the UK, DBT’s wider business population
              release puts SMEs at 5.682 million, while ONS counted 2.725 million VAT or PAYE registered businesses.
              Those are all useful shells, but they are not the same denominator. Australia publishes employing
              businesses, New Zealand publishes all enterprises plus an employee-share disclosure, and the UK splits
              registered employers from a broader business estimate that includes unregistered firms. The right
              conclusion is that Employment Hero sells into a large, multi-country employer base, but no retained public
              source cleanly converts those shells into an Employment Hero-specific SAM or SOM across software-only
              buyers versus HeroForce-style managed employment.
