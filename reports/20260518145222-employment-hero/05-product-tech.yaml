- id: S503
  title: 'Trust, security, and reliability: transparency is real, but the deepest artefacts remain gated'
  body: 'Employment Hero’s trust posture is more visible than that of many private SMB software vendors. The company runs a public trust portal, upgraded in August 2025, where buyers can browse security, privacy, and compliance information without logging in. That same update makes an important diligence distinction: the portal is public, but the highest-value artefacts such as ISO 27001, ISO 27017, ISO 27018, SOC 2 reports, penetration-test summaries, and sanitised policies generally require access requests and often an NDA. The help-centre security pages add practical controls including SSO, passkeys, two-factor authentication, privacy/GDPR material, and security-measure articles. Reliability evidence is mixed in a healthy way: the official status surface and independent outage aggregation make incidents visible rather than hiding them, but they also show that the platform has experienced HR outages, payroll-sync issues, and API 503 events in the retained 2025-2026 window. So the conclusion
    is not that the platform lacks trust maturity; it is that Employment Hero gives investors enough public assurance to believe the control plane exists, but not enough unrestricted detail to complete deep enterprise-grade diligence without direct access.'
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
