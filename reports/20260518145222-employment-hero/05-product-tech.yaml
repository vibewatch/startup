  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Low-level service topology, data residency, and disaster-recovery design
    missingEvidence: Retained public sources describe product workflows, regional API behavior, and security posture, but not control-plane/data-plane boundaries, hosting regions, RTO/RPO, or service-to-service topology.
    whyItMatters: Those details determine whether enterprise uptime, isolation, and privacy claims are underwriting-grade rather than marketing-grade.
    diligencePath: Request the security architecture brief, regional hosting map, DR summary, and engineering review of service boundaries.
    relatedQuestionRefs:
    - QE011
    - QE016
    - QE025
    - QE026
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: Module attach, deployment effort, and realized value by SKU
    missingEvidence: No retained public source discloses attach rates, rollout duration, seat penetration, or net expansion by recruitment, payroll, HR, benefits, or HeroForce modules.
    whyItMatters: The investment case depends on whether suite breadth translates into durable multi-module adoption rather than a large menu with uneven take-up.
    diligencePath: Ask management for recent cohort attach, implementation timelines, migration effort, and module-by-segment adoption data.
    relatedQuestionRefs:
    - QE001
    - QE005
    - QE019
    - QE026
    relatedTableRefs:
    - TE001
    - TE002
  - type: missing-source
    severity: material
    topic: Formal SLA terms, detailed postmortems, and incident-response metrics
    missingEvidence: The public status surface shows incidents, but the retained set does not include formal SLA language, postmortem depth, or response/resolution metrics.
    whyItMatters: Reliability diligence needs contractual promises and operational performance, not only incident visibility.
    diligencePath: Request standard enterprise SLA schedules, major-incident postmortems, and recent reliability KPIs.
    relatedQuestionRefs:
    - QE021
    - QE023
    - QE024
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: Public webhook retry semantics and partner-operational details
    missingEvidence: Retained public sources confirm webhooks exist but do not specify retry policy, signing approach, or delivery guarantees.
    whyItMatters: Event-driven integrations can look stronger on paper than in production if delivery and replay semantics are underspecified.
    diligencePath: Obtain webhook developer documentation and partner implementation guidance.
    relatedQuestionRefs:
    - QE014
    - QE026
    relatedTableRefs:
    - TE003
