  title: Product & Technology
summary: 'Employment Hero’s public product record supports a real employment operating-system thesis: broad workflow coverage, genuine integration and API surfaces, clear release velocity, and a meaningful trust portal. The gaps are not about whether a product exists; they are about how deeply buyers can underwrite low-level architecture, module economics, and reliability commitments without direct access.'
sections:
- id: S501
  title: 'Product definition and module map: Employment Hero is selling an employment operating system, not a single payroll tool'
  body: 'Employment Hero’s own product surface makes the positioning clear: the company is trying to own the full employment workflow for SMBs, not merely bolt HR features onto payroll. The main products page presents Employment OS as one system spanning Hiring, HR, Payroll, and Benefits, then expands that bundle into concrete modules such as applicant tracking, onboarding, employee management, offboarding, analytics, HR advisory, implementation services, earned-wage access, and Employer of Record services. The operating idea is that employee data, approvals, leave, timesheets, payroll, and engagement all live in one place, which matters because it reduces handoffs between point tools and makes packaged self-service features more valuable. Public evidence is strong that the breadth is real, especially for recruitment, HR records, payroll automation, benefits, and partner integrations. What remains less transparent is module attach, customer mix by SKU, and the boundary between software-only
    functionality and higher-touch service layers such as managed payroll or HeroForce global employment support.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE024
  - CE050
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: S502
  title: 'Operating model: packaged integrations and a plan-gated developer surface connect the suite to external systems'
  body: 'The public technical story is strongest at the application and workflow layer. Employment Hero exposes a documented REST/JSON API at api.employmenthero.com, uses OAuth 2.0 bearer-token access with refresh tokens, documents breaking-change versioning, and explicitly describes regional behavior for AU, MY, SG, NZ, UK, and CA payroll contexts. The April 2026 help article is especially useful because it shows the API has moved beyond read-only access into read/write endpoints for employee lifecycle events, leave, and timesheets. That materially improves the integration story, but there is a commercial caveat: custom API access is only available on upper plans, so smaller customers are pushed toward packaged connectors or partner-led implementations rather than bespoke integrations. The integrations directory plus Xero and QuickBooks landing pages show why that matters. Employment Hero is not closed; it supports one-click accounting sync, leave and timesheet propagation, and employee
    self-service data flows into third-party finance systems. Developer-signal sources reinforce that external builders are using the surface, though the open-source ecosystem is still modest relative to larger horizontal SaaS platforms.'
  claimRefs:
