- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Hiring / ATS / SmartMatch
    - SMB owner, recruiter, hiring manager
    - Live and heavily marketed
    - Combines ATS, onboarding, salary insights, AI candidate matching, and talent sourcing inside the same suite
    - No public conversion or attach data for recruitment products
  - - Core HR
    - HR admin, manager, employee
    - Live and broad
    - Single employee record, leave, performance, documents, analytics, and advisory tie-ins
    - No public admin-seat or usage penetration data by feature
  - - Managed payroll
    - Payroll admin, finance, operator
    - Live and mature
    - AI-assisted payroll, expert oversight, anomaly handling, awards/STP/compliance messaging
    - Service margin, staffing model, and SLA terms remain private
  - - Benefits / engagement / self-service
    - Employee and manager
    - Live and expanding
    - Benefits, EWA, EAP, Work app self-service, company feed, and notifications linked to payroll/HR data
    - Public benefits attach and take-rate data unavailable
  - - HeroForce / EOR
    - International employer and HR lead
    - Live but less transparent
    - Global hiring and compliant contracts extend the suite beyond domestic HR/payroll
    - Country coverage, local-entity model, and unit economics are not fully public
  - - Integrations directory
    - Admin, finance, partner
    - Live and broad
    - Packaged connectors across payroll, HR, accounting, and workforce workflows reduce custom build needs
    - No public connector usage or failure-rate data
  - - Developer portal / API / webhooks
    - Developer, implementation partner
    - Real but plan-gated
    - REST API, OAuth, regional data behavior, write endpoints, and webhooks enable custom workflows
    - Upper-tier plan gating limits accessibility for smaller customers
  - - Trust centre / status surface
    - Security reviewer, procurement, admin
    - Live and public
    - Trust portal, status page, and gated certificates improve diligence visibility versus opaque peers
    - Deepest trust artefacts still require access requests and NDA
  summary: Public module evidence supports a real multi-product suite with both packaged and higher-touch layers, though commercial attach and service economics remain undisclosed.
