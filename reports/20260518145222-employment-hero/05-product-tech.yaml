- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Employment Hero solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find and shortlist candidates
    - SMBs juggle job boards, candidate comms, and manual screening
    - ATS plus SmartMatch and improved hiring tools centralize discovery and referrals
    - Official stories and launch materials show faster matching and less manual screening
    - No public funnel conversion data
  - - Onboard a new employee
    - Manual forms, mailed packs, and duplicate data entry slow setup
    - Digital onboarding, self-service details capture, contracts, and app-based actions
    - Official customer stories show onboarding time falling to minutes per hire
    - Implementation effort by customer size not public
  - - Run payroll with fewer errors
    - Payroll depends on fragmented pre-payroll data and compliance work
    - Managed payroll plus AI automation centralizes timesheets, leave, and approval data
    - Company says businesses can reduce core employment admin cost materially
    - No public error-rate baseline or SLA
  - - Sync HR/payroll with accounting
    - Double entry between HR and finance creates reconciliation drag
    - Xero and QuickBooks connectors push payroll, leave, and timesheet data through one-click sync
    - Official pages describe fewer manual handoffs and better finance visibility
    - Connector depth beyond listed use cases is not public
  - - Build custom data flows
    - Packaged integration may not fit bespoke software stack
    - OAuth API, write endpoints, regional fields, and webhooks enable custom integration
    - Read/write support broadened in April 2026
    - Requires higher plan tiers and customer-owned development
  - - Hire internationally
    - Different EOR tools and local vendors create duplicate systems
    - HeroForce keeps international hiring inside the main platform experience
    - Public stories show faster contract issuance and one-platform visibility
    - Country coverage, partner model, and economics are still opaque
  - - Manage employee self-service
    - Bank changes, leave, and HR admin otherwise route through HR or payroll teams
    - Work app and employee portal let employees update details and receive notifications
    - Official stories and product pages tie this to admin reduction and engagement
    - Mobile feature depth across all regions is not fully disclosed
  summary: Employment Hero’s best-evidenced use cases are admin reduction, faster onboarding, payroll control, and integrated HR-to-finance workflows.
