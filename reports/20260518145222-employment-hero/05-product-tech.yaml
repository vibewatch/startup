- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Employment OS data layer
    - Holds employee, leave, onboarding, payroll, and engagement records in one system
    - Core application platform
    - No public schema or service-boundary detail
  - - REST API
    - Programmatic access to organisations, employees, timesheets, and related workflows
    - OAuth, developer portal, higher-tier plan access
    - Rate limits and lifecycle support may constrain heavy custom use
  - - OAuth / token service
    - Controls app registration, auth code flow, bearer access, and refresh
    - Developer portal and auth server
    - 15-minute access tokens increase integration discipline requirements
  - - Regional field model
    - Maps payroll/employee behavior to AU, MY, SG, NZ, UK, and CA contexts
    - Employee work-location configuration
    - Data-residency and locale edge cases are not fully public
  - - Webhooks
    - Supports event-driven integrations from the developer portal
    - Application registration and customer configuration
    - Public retry semantics and delivery guarantees were not retained
  - - Packaged integrations
    - One-click accounting and payroll sync with Xero/QuickBooks and others
    - Third-party APIs and connector maintenance
    - Connector breakage or depth is not transparently quantified
  - - Managed payroll service layer
    - Combines software automation with expert oversight
    - Payroll specialists, compliance knowledge, and platform data
    - Service economics and staffing ratios are private
  - - Trust and status surfaces
    - Expose compliance artefacts, security posture, and incidents
    - Public portal plus gated documents
    - Public evidence is adequate for screening, not full enterprise diligence
  summary: 'The public architecture picture is workflow-centric: one data system, one integration surface, and higher-touch payroll/EOR layers wrapped around it.'
