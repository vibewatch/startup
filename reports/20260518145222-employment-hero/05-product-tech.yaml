- id: S504
  title: 'Maturity and roadmap: strong release cadence and AI expansion are visible, while low-level architecture still is not'
  body: Employment Hero’s 2024-2026 external narrative is about velocity and widening scope. Public materials point to AI embedded in payroll, HR advice, and recruitment; a May 2025 release bundle touching workflows, hiring, compensation, benefits, reporting, mobile self-service, and payroll security; a January 2025 Humi acquisition that extended the Canadian footprint; and 2025 commentary around profitability, 900 product updates in a year, and UK acceleration. The KKR transaction materials are notable because they describe the company as a cloud-native comprehensive suite and connect product breadth directly to international expansion. At the same time, the roadmap signal is still much stronger than the disclosed systems architecture. Investors can verify that Employment Hero ships often, sells multiple adjacent modules, and is investing in AI and global reach. They still cannot verify service topology, data-residency implementation details, private uptime commitments, or how adoption
    splits across recruitment, payroll, HR, benefits, and HeroForce. That leaves the product verdict positive on breadth and motion, but still dependent on management diligence for the last mile of technical underwriting.
