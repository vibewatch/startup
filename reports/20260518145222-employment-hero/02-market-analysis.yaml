      label: HR or payroll sponsor
      detail: The initial sponsor defines the workflow problem and evaluates integrated HR plus payroll options.
      tone: neutral
    - id: n3
      label: Finance and compliance review
      detail: Payroll accuracy, tax, pensions, and reporting obligations pull finance into the decision.
      tone: warning
    - id: n4
      label: Recruiting workflow or job-board need
      detail: Hiring-heavy accounts care about applicant flow, job distribution, and onboarding linkage.
      tone: neutral
    - id: n5
