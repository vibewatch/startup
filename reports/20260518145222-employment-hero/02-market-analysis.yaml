tables:
- id: TM001
  title: Market definition and substitute stack
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - status-quo substitute
  - implication
  rows:
  - - Core employment OS
    - HR records, payroll, onboarding, leave, employee self-service, benefits, and recruitment workflow
    - ERP, general ledger, and broad accounting systems
    - HR or payroll sponsor with finance sign-off
    - Point HRIS plus payroll plus spreadsheets or email
    - This is the primary wedge where Employment Hero sells one employment workflow rather than one narrow module.
  - - HeroForce / managed employment
    - Employer of Record-style legal infrastructure, contracts, payroll, and compliance for local or global hires
    - Traditional staffing agency revenue and full legal outsourcing not tied to software
    - COO, people ops, or founder with legal or compliance input
    - Local entity setup, pure EOR vendor, or outsourced employment admin
    - Managed employment expands reachable spend beyond software-only buyers.
  - - Recruitment and applicant workflow
    - Job distribution, applicant tracking, candidate movement, and hiring workflow
    - General advertising spend and standalone staffing marketplace economics
    - Hiring manager or talent lead
    - Direct job-board posting, recruiters, or standalone ATS tools
    - Recruitment adjacency matters because API or job-board access can affect product value.
  - - SMB payroll core
    - Pay runs, tax withholding, super or pensions, payslips, and payday reporting
    - Generic accounting without payroll execution
    - Payroll lead, office manager, or finance owner
    - Accountant, payroll bureau, Xero, MYOB, or spreadsheet-led process
    - Payroll remains the most compliance-forced anchor product.
  - - Employee experience layer
    - Mobile app, benefits, earned wage access, learning, and engagement surfaces
    - Standalone consumer fintech or insurer economics
    - HR or people team; employees are active users
    - Point perk app or separate communications tools
    - Useful adjacency that can deepen stickiness but should not be counted as an unlimited standalone TAM.
  - - Composite SMB stack
    - A multi-tool operating stack that together covers hiring, payroll, compliance, and employee admin
    - A fictional one-vendor baseline
    - Multiple owners across HR, finance, recruiting, and external advisors
    - Accountant or bureau plus payroll software plus recruiting tools
    - Employment Hero usually competes against a bundle of substitutes, not one like-for-like product.
  notes: >-
    Boundary logic is workflow-based: included spend touches the employee record, payroll, hiring, or managed employment process; excluded spend sits outside that workflow shell.
