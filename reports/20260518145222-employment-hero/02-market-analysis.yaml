- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - evidence
  rows:
  - - Australia STP and payroll record rules
    - driver
    - current
    - Push employers away from manual payroll into software or bureau-grade processes
    - ATO STP rules plus Xero's guidance that spreadsheets do not satisfy reporting requirements
  - - New Zealand payday filing
    - driver
    - current
    - Makes payroll-software workflow more compelling, especially after the electronic filing threshold is crossed
    - IRD says payroll software can file directly and electronic filing becomes mandatory above threshold
  - - UK PAYE and FPS reporting
    - driver
    - current
    - Supports software adoption because reporting is tied to each payday and penalties apply for lateness
    - HMRC PAYE, running payroll, and employer guide sources
  - - SME admin reduction and productivity narrative
    - driver
    - current to medium-term
    - Digital adoption messaging supports integrated payroll and HR tools when buyers want less admin burden
    - UK SME digital adoption taskforce and related research
  - - Time, cash, know-how, and support gaps
    - constraint
    - current
    - Slows conversion, especially in smaller firms without internal HR or IT specialists
    - UK adoption research and historical ABS evidence on cloud-knowledge limits
  - - Quote-led modular pricing
    - constraint
    - current
    - Makes outside-in ROI work harder because public entry price and packaging are inconsistent
    - TrustRadius and SelectHub disagree on visible starting price
  - - Implementation and support quality
    - constraint
    - current
    - Weak support can delay go-live or reduce willingness to expand beyond core modules
    - Trustpilot, G2, and Software Advice complaints
  - - Outage and integration trust issues
    - constraint
    - current
    - Status incidents and the Seek dispute can lengthen diligence for recruitment-adjacent use cases
    - Status page plus SmartCompany and Startup Daily reporting
  notes: The table separates structural demand drivers from company-specific frictions so the market case does not hide execution risk.
