- id: FM004
  title: Substitute-to-suite migration path
  type: flow
  layout: wide
  summary: >-
    Employment Hero most often replaces a layered SMB stack rather than a single incumbent. Buyers typically move from manual or bureau-led processes into software, then into broader workflow consolidation.
  data:
    nodes:
    - id: m1
      label: Spreadsheet or manual payroll
      detail: Founders or admins run payroll manually and carry high error risk.
      tone: warning
    - id: m2
      label: Accountant or payroll bureau
      detail: External experts provide compliance help but keep payroll outside one daily workflow system.
      tone: neutral
    - id: m3
      label: Standalone payroll software
      detail: Tools like payroll-only products solve filing and calculations but not the full employment workflow.
      tone: neutral
    - id: m4
      label: Integrated HR plus payroll
      detail: Growing SMEs want onboarding, leave, payroll, and employee records in one environment.
      tone: positive
    - id: m5
      label: Recruitment and managed employment overlay
      detail: Hiring workflow and HeroForce-style services widen the scope beyond payroll alone.
      tone: positive
    - id: m6
      label: Employment OS consolidation
      detail: A broader suite wins when buyers want one employment workflow across multiple user groups.
      tone: positive
    edges:
    - from: m1
      to: m2
    - from: m2
      to: m3
    - from: m3
      to: m4
    - from: m4
      to: m5
    - from: m5
      to: m6
  approximationNotes: >-
    The path is conceptual rather than linear in every account, but each node is supported by public substitute evidence or product-scope evidence.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
