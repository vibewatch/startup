company:
  name: Employment Hero
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Employment Hero sells into a large but definition-sensitive employment software shell where payroll compliance, hiring workflow, and managed global employment overlap. Official business counts across Australia, New Zealand, and the UK support a substantial employer base, but public definitions, pricing, and module-mix data remain too inconsistent to justify a precise SAM or SOM, so diligence should underwrite demand through compliance pain, substitute replacement, and cross-functional buyer motion rather than a single TAM figure.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: >-
    Employment Hero’s market is best framed as an employment workflow layer for SMEs and growing organisations, not as the whole ERP, accounting, or staffing universe. The company’s own homepage bundles hiring, HR, payroll, employee experience, benefits, and managed employment infrastructure under one Employment OS, and HeroForce adds Employer-of-Record style legal infrastructure for local, global, and on-demand hiring. That expands the included spend beyond pay runs into onboarding, compliance documents, recruitment workflow, employee self-service, and cross-border employment administration. It still leaves material spend outside the boundary: general ledger software, full ERP suites, specialist accounting platforms, and pure staffing or recruiting agencies are adjacent but not equivalent. The real competition is often a substitute stack rather than a single rival: spreadsheets, accountants, payroll bureaus, standalone payroll products, and point HR or recruiting tools. Xero’s payroll guide
    explicitly frames software, service providers, and accountants as live options, while its warning that spreadsheets fail STP requirements shows why compliance is a forcing function. MYOB’s segmentation and the ATO product register reinforce the same point: Employment Hero wins or loses against a fragmented SMB operating stack, not just another payroll SKU.
  claimRefs:
