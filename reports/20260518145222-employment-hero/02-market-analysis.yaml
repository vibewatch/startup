- id: TM005
  title: Sizing and adoption diligence gaps
  columns:
  - gap
  - current public state
  - why it matters
  - exact diligence path
  rows:
  - - Clean software-only versus HeroForce SAM
    - Public sources show employer shells but not the split between software-only buyers and managed-employment buyers.
    - Valuation can overstate the reachable market if both are blended into one TAM.
    - Request pipeline and customer splits by software-only, HeroForce, and hybrid accounts by geography.
  - - Module attach rates and expansion order
    - No retained source discloses which payroll customers add HR, recruitment, benefits, or managed employment next.
    - Cross-sell is central to the Employment OS thesis and to LTV assumptions.
    - Request attach-rate cohorts, module order of operations, and expansion revenue by customer size.
  - - Public pricing and packaging precision
    - Review pages disagree on visible starting price and the official site still routes buyers to quote-led discovery.
    - Opaque packaging weakens outside-in ROI and payback analysis.
    - Request current rate cards, minimum spends, onboarding fees, and discounting rules by package and geography.
  - - Geography and reliability mix
    - Public evidence does not show country revenue mix, payroll-only versus recruitment-heavy cohorts, or incident frequency by product line.
    - Trust and uptime matter more when the product runs payroll or mission-critical hiring workflow.
    - Request country revenue mix, outage history by product, and churn or delay data tied to service incidents or integration issues.
  notes: >-
    These are the highest-value remaining diligence asks because they directly change SAM confidence, expansion math, and risk-adjusted underwriting.
  claimRefs:
  - CM025
  - CM048
  - CM050
