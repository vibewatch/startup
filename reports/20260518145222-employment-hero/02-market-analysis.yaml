  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      A current official rate card or sales-approved packaging sheet that shows entry price, minimum spend, onboarding fees, and module packaging by geography.
    whyItMatters: Contradictory review-site pricing is enough to show opacity, but not enough to underwrite payback or affordability by segment.
    diligencePath: Request current pricing cards, implementation fees, and discount rules for software-only versus HeroForce-led deals in each core region.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: sam-som-segmentation
    missingEvidence: Customer counts and revenue split by software-only, HeroForce, geography, and starting module.
    whyItMatters: Without that segmentation, a public employer-count shell cannot be converted into a credible software SAM or SOM.
    diligencePath: Request management segmentation by starting module, country, service model, and current expansion stage.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM005
  - type: missing-source
    severity: material
    topic: attach-rates
    missingEvidence: Module attach-rate data that shows how often payroll buyers add recruitment, benefits, employee app, or HeroForce services.
    whyItMatters: The Employment OS thesis relies on cross-sell depth, and that changes lifetime value and market sizing.
    diligencePath: Request attach-rate cohorts, module adoption sequences, and gross retention or expansion by cohort.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM005
  - type: missing-source
    severity: minor
    topic: product-reliability-mix
    missingEvidence: Historical uptime and incident counts by module and geography, plus customer-delay or churn impact from outages or integration disputes.
    whyItMatters: >-
      Public status data shows incidents, but not whether reliability or integration risk changes close rates in payroll versus recruitment-led deals.
    diligencePath: Request internal incident logs by product line and any pipeline or renewal analysis tied to uptime or integration issues.
    relatedQuestionRefs:
    - QM018
    - QM019
    relatedTableRefs:
    - TM005
