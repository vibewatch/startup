  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-contract-protection
    missingEvidence: Current customer contract pack showing SLAs, service credits, indemnities, and liability carve-outs.
    whyItMatters: Residual downside changes materially if customers have strong remedies when payroll-critical failures occur.
    diligencePath: Request current master services agreement, enterprise order form, DPA, and any payroll-specific SLA addenda.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: partner-country-allocation
    missingEvidence: Country-by-country map of owned entities versus third-party EOR partners and escalation ownership.
    whyItMatters: The public EOR story is not specific enough to price partner, compliance, or termination risk by country.
    diligencePath: Request legal-entity map, partner roster, indemnity matrix, and exception history for Global Teams.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: incident-metrics
    missingEvidence: Incident-rate, payroll-error, ticket-aging, and customer-credit metrics for the last 12 months.
    whyItMatters: A single status-page incident does not show whether reliability risk is episodic or structurally recurring.
    diligencePath: Request monthly incident review deck, Sev1/Sev2 counts, payroll cutoff misses, and support SLA attainment.
    relatedQuestionRefs:
    - QR030
  - type: private-evidence-only
    severity: material
    topic: canada-unit-economics
    missingEvidence: Canada revenue, gross margin, cohort retention, and break-even timeline since the Humi acquisition.
    whyItMatters: Canada is simultaneously the clearest expansion upside and the clearest operating-drag risk in public reporting.
    diligencePath: Request Canada P&L, ARR bridge, customer cohorts, and management KPI pack for the post-acquisition market.
    relatedQuestionRefs:
    - QR020
    - QR021
  - type: access-blocked
    severity: minor
    topic: security-artifacts
    missingEvidence: Actual SOC reports, ISO certificates, and penetration-test summaries behind the Trust Centre request
      flow.
    whyItMatters: The public portal confirms that artifacts exist, but not their scope, vintage, findings, or exceptions.
    diligencePath: Execute NDA and obtain Trust Centre document bundle including the latest audits and remediation summaries.
    relatedQuestionRefs:
    - QR024
