  - FR002
- id: dependencies-and-execution
  title: Dependency and execution risk transmit through integrations, EOR delivery, and Canada expansion
  body: Employment Hero’s breadth is strategically attractive, but it also widens the number of ways execution can go wrong.
    The integrations directory shows dependence on accounting, payroll, communications, and recruitment systems; the review
    corpus shows that when implementation, reporting, or support slows down, customers feel the pain in precisely the workflows
    that should be most trusted. The EOR layer adds another dependency stack. Employsome’s 2026 review describes a model that
    blends owned entities with local partners, requires payroll funding in advance, and caps liability, which is standard
    enough to be believable but still adverse from a customer-risk perspective. Canada shows the same pattern at market level.
    Humi added local scale and product depth, but BetaKit reports that Canada is not yet profitable on its own and may require
    years of continued investment. That leaves investors underwriting not just software demand, but a portfolio of integrations,
    partner execution, cultural integration, and local-market operating leverage that is still being proven.
