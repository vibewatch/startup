- id: mitigations-and-kill-criteria
  title: Mitigations are visible, but the most important kill criteria still depend on private diligence
  body: 'The right read on Employment Hero is not that controls are absent. The company has visible security content, published
    status transparency, active legal and product-policy pages, and a clearer Trust Centre than many private peers. Those
    signals reduce the odds that risk is unmanaged. They do not answer the questions that matter most to downside protection:
    what SLAs and indemnities actually look like, how often payroll-critical incidents occur, which partner countries rely
    on third parties, or how much capital Canada and EOR expansion still consume before reaching durable profitability. That
    is why the thesis-break triggers need to stay explicit. Repeated deadline-affecting outages, failure to operationalize
    payday super, renewed job-board/API conflict, or evidence that partner and support structures cannot absorb global execution
    complexity would all make the current risk posture materially worse. Until private diligence closes those gaps, the public
    record supports caution rather than complacency.'
