- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Payroll-rule execution
    - Payday-super rollout quality
    - Production defects, customer overrides, or material support spikes after 1 July 2026
    - Re-rate compliance and churn risk higher until remediation metrics are available.
  - - Platform reliability
    - Payroll or platform incident cadence
    - Two deadline-affecting outages in a quarter or one outage with visible payroll miss
    - Treat reliability as thesis-breaking for mission-critical workflow adoption.
  - - Privacy and security posture
    - Breach or regulator contact
    - Any notifiable breach, regulator inquiry, or material adverse disclosure against employee-data handling
    - Escalate legal, remediation-cost, and trust assumptions immediately.
  - - Partner / API dependence
    - Recruitment or partner access
    - Loss or material restriction of a core job-board or EOR partner path
    - Assume higher implementation friction and lower attach-rate durability.
  - - Canada execution
    - Local profitability and scale
    - No path to break-even despite ongoing investment and market-entry time
    - Treat Canada as margin drag rather than valuation upside.
  - - Contract protection
    - SLA / indemnity evidence
    - Management cannot provide acceptable service-credit, indemnity, or partner-allocation terms
    - Do not underwrite downside as if contractual remedies are strong.
  notes: Triggers are framed so later diligence can test them objectively against contract, support, and operating data.
