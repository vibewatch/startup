chapter:
  number: 4
  title: Financials
  summary: 'Employment Hero monetises a broad employment workflow stack rather than a single payroll product, with official pages spanning hiring, HR, payroll, employer-of-record, earned wage access, benefits, and managed services. The strongest public traction markers are A$250 million ARR by February 2025, A$300 million ARR by October 2025, 350,000+ businesses, 2.5 million+ employees managed, and more than A$120 billion of annual payments facilitated. The underwriting limit is not demand but opacity: public sources still do not disclose cash on hand, burn, gross margin, retention, or realised pricing by module.'
sections:
- id: revenue-model-pricing-and-monetisation
  title: Revenue model, pricing posture, and monetisation breadth
  body: 'Employment Hero’s public surfaces show a platform that sells across the employment workflow rather than around one payroll SKU. The official pricing, solutions, and products pages organise the offer around hiring, HR, payroll, benefits, and HeroForce, while the product catalog adds employer-of-record services, the Work superapp, and earned wage access. That structure implies a layered revenue model: recurring software seats, premium workflow modules, cross-border compliance services, and employee-side financial-wellbeing features. The pricing signal is more ambiguous. Officially, the company still routes buyers through product and demo flows rather than disclosing a clean list price schedule, which suggests a sales-led packaging strategy. Independent pricing pages give direction but not certainty: TrustRadius shows five plans running roughly A$6-A$27 per employee per month with an A$80 minimum spend, while People Managing People says buyers often need a demo and that richer tiers
    or global support move into custom pricing. The safest interpretation is that list-price anchors exist, but actual monetisation depends on module mix, geography, and negotiated service scope.'
