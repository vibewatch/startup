- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Current public substitute
  - Why substitute is insufficient
  - Next diligence step
  rows:
  - - Cash balance
    - Cannot size liquidity buffer or covenant risk
    - ARR and EBITDA-positive commentary
    - Growth and EBITDA signals do not show cash burn or working capital needs
    - Obtain latest balance sheet and treasury memo
  - - Monthly burn and runway
    - Cannot test downside survival or acquisition appetite
    - No direct public substitute
    - Stake-sale and valuation data say little about ongoing cash use
    - Obtain monthly actual-versus-plan cash flow and hiring plan
  - - Gross margin by stream
    - Cannot judge software quality versus service intensity
    - Payroll automation claims and EOR breadth
    - Automation benefits do not reveal labour or payments cost to serve
    - Obtain gross margin by software, payroll ops, EOR, and Work features
  - - Retention / NRR / churn
    - Cannot evaluate land-and-expand durability
    - Business-count growth and ARR milestones
    - Top-line growth can mask weak retention or discounting
    - Obtain cohort analysis by segment and module
  - - Realized ASP and discounts
    - Cannot reconcile list pricing with actual revenue quality
    - TrustRadius and People Managing People price snapshots
    - Third-party list-price or tier summaries do not show negotiated contracts
    - Review recent order forms, price books, and discount approvals
  notes: These are the key blockers that remain after exhausting accessible public sources; the diligence path is specific because generic follow-up would not clear underwriting risk.
