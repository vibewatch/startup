  - - Rob Paterson
    - CFO
    - HRD profile lists Paterson as CFO.
    - Financial-leadership coverage is publicly visible even though private-company disclosures remain thin.
    - Public sources name the executive but not treasury, audit, or investor-reporting detail.
  - - Kevin Rawlings
    - CRO
    - HRD profile lists Rawlings as CRO.
    - Signals dedicated go-to-market leadership as the business scales internationally.
    - No public disclosure of sales-efficiency metrics or quota productivity.
  - - Zara Tonkin
    - Chief of Staff
    - HRD profile lists Tonkin among key people.
    - Shows a broader executive bench around the founders.
    - Board composition and independent-director evidence remain absent from retained public sources.
