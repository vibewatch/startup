- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Public evidence
  - Current importance
  - Diligence ask
  rows:
  - - TCV
    - Lead investor in Series F
    - Official October 2023 Series F announcement names TCV as lead.
    - Anchors the biggest disclosed primary round and valuation step into late-stage territory.
    - Request exact ownership, preference stack, and any pro-rata rights after 2025 secondary trading.
  - - SEEK / SEEK Growth Fund
    - Strategic and financial investor; partial seller to KKR
    - Official Series F, KKR release, and Startup Daily all place SEEK in the cap table and KKR transaction.
    - Still material after partial selldown; also the counterparty in the API dispute.
    - Request current residual stake, governance rights, and commercial agreements after the dispute.
  - - KKR
    - 2025 secondary buyer
    - KKR and Business Wire announced a stake acquisition from SEEK in February 2025.
    - Introduces a new large-cap private-equity owner and strategic partner.
    - Confirm board rights, information rights, and any follow-on capital commitments.
  - - Insight Partners
    - Existing investor
    - Official Series F announcement says Insight participated.
    - Signals continuity from global growth investors.
    - Request ownership percentage and whether Insight participated in later secondary liquidity.
  - - AirTree
    - Early and follow-on investor
    - Official Series F and later press references keep AirTree in the investor set.
    - Important as a long-duration Australian venture backer close to the founder.
    - Request whether AirTree remains on the board or holds protective rights.
  - - OneVentures
    - Early investor and continuing backer
    - Official Series F announcement and later coverage continue to name OneVentures.
    - Useful signal that early money stayed involved deep into scale-up.
    - Request realized liquidity and current fully diluted ownership.
  notes: Public evidence identifies the major backers but does not disclose the current fully diluted cap table or the exact June 2024 financing mark.
