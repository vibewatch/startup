- id: milestones-disputes-and-diligence-gaps
  title: Milestones of record, disputes, and diligence gaps
  body: The milestone record supports a company that kept expanding product breadth and geographic reach while also accumulating governance friction. Public sources let us trace a 2014 founding, a 2017 ANZ partnership, the 2023 Series F, the 2023 Swag scale launch, the 2024 release cadence highlighted by 900 product releases, the January 2025 Humi acquisition, the February 2025 A$250 million ARR milestone, the July 2025 SEEK API lawsuit, the October 2025 A$300 million ARR milestone, and the February 2026 SEEK selldown process. The adverse record matters because it is not a one-off article. SmartCompany and Startup Daily both covered the SEEK API dispute, SmartCompany separately documented the Hostplus feud, and customer-review surfaces still show real but non-thesis-breaking support friction. The main diligence blocker is therefore not whether Employment Hero has momentum—it clearly does—but whether private materials would confirm a cleaner governance picture, reconcile headcount, and bridge
    the exact June 2024 valuation step to the KKR deal with primary documents rather than secondary reporting.
