company:
  name: Employment Hero
chapter:
  number: 1
  title: Company Overview
  summary: Employment Hero is a Sydney-founded SMB employment-software company that now markets an AI-powered Employment Operating System across HR, payroll, recruitment, benefits, and employee-financial-wellbeing workflows. Public evidence is strongest on the 2014 founding, the A$263 million 2023 Series F, the KKR and SEEK transaction that implied a A$2.2 billion valuation, and current company scale claims of 350,000+ businesses and 2.5 million+ employees managed. The main remaining blind spots are exact board composition, a registry-backed current legal-entity profile, and a canonical current employee count.
sections:
- id: identity-platform-footprint
  title: Identity, platform scope, and operating footprint
  body: 'Employment Hero’s public identity is no longer that of a narrow payroll vendor. The homepage and products catalog both frame the company as an Employment Operating System that combines hiring, HR, payroll, and benefits, while the homepage also highlights HeroForce as a more managed “done for you” layer for employers that want operational help rather than software alone. That matters because it places the business in a wider SMB workflow category with multiple monetisation surfaces and a stronger claim to strategic relevance than point payroll software. Public scale markers also appear consistently enough to anchor the chapter: the homepage says the platform is trusted by 350k+ customers, the February 2025 ARR milestone says 350,000 businesses managing two million employees were already on the platform, and the February 2026 stake-sale announcement lifts that to more than 350,000 businesses and 2.5 million employees managed worldwide. Sydney remains the safest HQ anchor, but the
    best direct evidence is still a third-party company profile rather than a registry filing, so the legal-entity and HQ evidence is directionally strong rather than perfect.'
  claimRefs:
