- id: capital-history-investors-and-scale
  title: Capital history, investor base, and scale milestones
  body: 'Employment Hero’s public financing history is most concrete around the 2023 Series F and the 2025 KKR transaction. The official Series F announcement states that the company raised A$263 million led by TCV, took lifetime capital raised above A$650 million, and reached a valuation just shy of A$2 billion. It also names Insight Partners, AirTree, SEEK, and OneVentures as participating backers, which is enough to sketch a durable investor base. The KKR and SEEK transaction then provides the next capital marker: KKR agreed to buy a stake from SEEK, SEEK remained a material investor, Startup Daily reported that A$95 million of stock changed hands, and the implied valuation was A$2.2 billion, up 19% from June 2024. Public ARR disclosures reinforce the scaling story around those financing markers. Employment Hero moved from the February 2025 A$250 million ARR milestone to more than A$300 million ARR by October 2025, and the 2026 stake-sale release says growth remained above 30% with expanding
    margins. That is a strong late-stage growth profile even if the exact June 2024 mark and fully diluted cap table remain undisclosed.'
