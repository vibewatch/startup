    - Still the central strategic narrator for product, growth, and capital-market messaging.
    - High key-person concentration; also central to public disputes with SEEK and Hostplus.
  - - Dave Tong
    - Co-founder, CPTO
    - Official About page and HRD profile both place Tong in product and technology leadership.
