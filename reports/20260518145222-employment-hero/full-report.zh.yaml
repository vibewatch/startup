      - - Rippling
        - 结构清晰，但仍由报价驱动
        - 必购核心平台，加上多数按员工按月计费的模块定价和部分基础费用
        - 伙伴可触达 20,000+ 家成长型公司
        - 打包会在采用后提高切换成本，但售前价格发现弱于 Deel 或 Gusto
      - - BambooHR
        - 报价驱动，但计费模型清楚
        - 按员工按月计费，自动量级折扣
        - 市场和伙伴计划面向 33,000+ 客户和 140+ 个集成
        - 对不需要 HeroForce 或宽本地薪资服务的成本敏感买方，是强 HR 核心替代品
      - - Xero
        - 透明会计定价，加上嵌在小企业会计栈中的薪资价值主张
        - 会计驱动平台，带澳大利亚薪资和应用商店扩展
        - 250,000+ 会计师 / 记账员和 4.9 million 客户
        - 虽然不是完整雇佣 OS，但在会计师驱动的中小企业购买流程中很强
      - - Employment Innovations
        - 本次未留存独立公开服务价格
        - 托管薪资、HR，以及由 Employment Hero 驱动的 HR 软件
        - 本地服务关系既可能替代纯软件购买，也可能形成补充
        - 买方想要本地外包支持，而不是软件驱动转型时，它是有用替代品
      - - Gusto
        - 透明
        - 公开套餐结构清楚，承包商专用和薪资层级分明
        - 主要是直接数字化中小企业动线
        - 即便地域不同，也能作为透明中小企业薪资打包方式的干净标杆
      - - ADP / Workday
        - 报价驱动
        - 更宽的薪资 / HCM / 企业平台打包
        - 庞大存量客户、服务和市场生态
        - 存量巨头力量真实存在，但购买流程更重、透明度低于薪资优先挑战者
    notes: 本表对比公开定价姿态和打包逻辑，不比较实际折扣或合同条款。“未留存”表示抓取到的公开证据没有为本次分析提供稳定、可引用的价格单元。
