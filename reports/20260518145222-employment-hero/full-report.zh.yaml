  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的公开身份已不再是狭义薪资厂商。官网首页和产品目录都把公司定义为雇佣操作系统，把招聘、HR、薪资和福利组合在一起；首页还突出 HeroForce
              这一更托管的代办式层，服务那些需要运营帮助而不只是软件的雇主。这一点重要，因为它把公司放进更宽的中小企业工作流类别，变现触点更多，也比单点薪资软件更有资格主张战略意义。公开规模标记也足够一致，能为本章定锚：首页称平台获得
              350k+ 客户信任，2025 年 2 月 ARR 里程碑称已有 350,000 家企业、2 million 名员工在平台上，2026 年 2 月售股公告则提升到全球超过 350,000 家企业、2.5
              million 名被管理员工。Sydney 仍是最稳妥的总部锚点，但最好的直接证据仍是第三方公司档案而不是注册文件，因此法律实体和总部证据方向上强，但还不完美。
