              Employment Hero 的公开界面显示，它围绕雇佣工作流销售平台，而不是围绕单一薪资 SKU。官方定价、解决方案和产品页面把产品组织在招聘、HR、薪资、福利和 HeroForce
              周围，产品目录又加入名义雇主服务、Work
              超级应用和薪资预支。这一结构意味着分层收入模型：经常性软件席位、高级工作流模块、跨境合规服务，以及面向员工侧的财务健康功能。定价信号更含糊。官方上，公司仍把买方导向产品和演示流程，而不是披露干净的标价表，这表明包装策略由销售主导。独立定价页面提供方向但不给确定性：TrustRadius
              显示五个套餐约为每名员工每月 A$6-A$27，并有 A$80 最低消费；People Managing People
              则称买方通常需要演示，且更高层级或全球支持会进入定制定价。最稳妥的解读是，标价锚存在，但实际变现取决于模块组合、地域和谈判后的服务范围。
