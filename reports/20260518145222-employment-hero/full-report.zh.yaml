        blocks:
          - type: paragraph
            body: >-
              公开证据显示出有意义的缓释栈，但也说明买方仍应把可靠性和隐私事故视为最高层级风险。Employment Hero 帮助材料描述了基于 AWS 的托管、TLS、日志、DDoS 缓释、每日备份和 99%
              的平均月度正常运行时间；Trust Centre 现在也暴露出更宽的一组安全与合规材料。这些是真正的正面因素。问题在于，同一公开记录仍显示 2026 年 5
              月发生过平台宕机，最有尽调价值的报告需要门控访问，也没有公开事故率或服务抵扣数据。隐私侧同样有两面性。Fair Work 和 ATO
              指引把员工薪资、税务、super、银行和云端存储数据视为尤其敏感；Employment Hero
              自己的隐私政策也确认平台触达的正是这些数据类别。在薪资准确性和员工访问都受截止时间约束的系统里，一个已解决事故不会因为最后修好了就变得不重要。
