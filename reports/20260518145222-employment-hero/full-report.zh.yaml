      - number: '3.3'
        title: 护城河耐久性、切换成本与负面证据
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 最强的护城河主张，是把本地合规深度、合作伙伴分发和托管式雇佣基础设施放进同一个品牌。当客户已经在同一环境里运行澳大利亚薪资、HR
              管理、招聘、员工福利和合作伙伴工作流时，这套组合确实能制造切换摩擦。Trustpilot
              的汇总评价也显示，用户看重更顺畅的薪资和入职支持，这支撑了产品能够嵌入运营的判断。但这条护城河并不干净耐久。第一，竞争最激烈的前线是全球雇佣和相邻自动化，Deel、Rippling、HiBob 式 HR Hub
              以及 Remote 式全球 HRIS 对比，都在把买方推向更宽的跨境套件。第二，品类高度模块化：Xero 加会计师、Employment Innovations 这类外包薪资公司，或单点 HR
              工具，都能替换足够多的工作流，阻止 Employment Hero 拿下整个栈。第三，全球套件领导者自身也显示出功能和竞争压力高速变化。Deel 官方页面甚至没有给出完全一致的公司数量信号；HR Brew
              报道、National Law Review 以法律语言框定的 Rippling-Deel 间谍战，则显示厂商在多么激进地防守或加速自身位置。结论是，Employment Hero
              有可信的本地和合作伙伴主导切入点，但护城河更多依赖执行、切换成本和捆绑工作流价值，而不是任何结构性封闭品类。
