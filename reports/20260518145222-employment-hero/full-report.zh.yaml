      - number: '6.3'
        title: 耐久性、扩张与风险：合作伙伴触达可见，但支持摩擦和集中度仍披露不足
        blocks:
          - type: paragraph
            body: >-
              即便没有私有队列数据，扩张逻辑也能看见。官方故事经常从核心 HR / 薪资延伸到招聘、移动自助服务、绩效工作流或 HeroForce 全球雇佣。渠道同样重要：Employment Hero 称自己有超过 470
              名澳大利亚推荐合作伙伴、结构化分层模型、覆盖六个国家的公开合作伙伴目录，以及带演示奖励机制的联盟计划。这是顾问和薪资专家可以放大需求的良好证据。风险侧同样清楚。Trustpilot、G2、Software
              Advice、Xero App Store 和编辑评测都显示满意度和真实使用，但也在实施 / 设置摩擦、支持或取消处理较慢、报告限制和偶发产品缺陷上收敛。Xero
              市场尤其负面，因为其评分远低于主流评价门户，并包含超额收费和集成失败投诉。公开集中度披露仍缺席，渠道分成经济性也只部分可见。因此，客户结论在采用真实性和交叉销售逻辑上为正，但在留存质量、集中度和支持可扩展性上仍不完整。投资人可以相信客户存在并获得价值；但对这些成功底下的耐久性和支持效率数学，还不能同样安心。缺口可管理，但它改变了举证责任：管理层必须提供留存、集中度和服务质量运营数据，而不能只依靠案例研究和评价情绪。
