      - number: '3.2'
        title: 定价、包装与生态杠杆
        blocks:
          - type: paragraph
            body: >-
              最重要的商业差异，是透明度与捆绑。Employment Hero 明确销售多套餐产品族，但本轮保留的官方材料没有呈现稳定的套餐级价格单元，因此买方仍要从演示和报价流程里推断大量商业信息。相比之下，Deel 公布
              EOR 起价，Gusto 公布明确薪资层级，Rippling 至少说明结构性规则：每个产品都建立在必需的核心平台之上。这个差异重要，因为薪资和 HR
              买方经常先把最早可见价格锚归一化，再建立候选名单，而不是等待顾问式销售流程。生态杠杆让比较更复杂。Employment Hero 称自己有 470+ 澳大利亚合作伙伴，并能让战略盟友触达 350,000 家企业和
              2.5 million 名员工，这对以中小企业为主的渠道动线有意义。但 Xero 的会计师网络大得多，BambooHR 已卖进 33,000+ 个连接市场的客户，Rippling 为合作伙伴提供 20,000+
              家公司的触达，Workday 则面向数千客户营销正式市场和合作伙伴构建的应用层。结果是，Employment Hero 拥有真实渠道资产，但对手生态在会计分发、HR-tech
              集成或企业服务上更大。定价不透明因此有双重影响：它让直接比较更难，也给生态更重的对手更多空间，把决策框在自己的入口周围。
