            body: >-
              Employment Hero 自己的产品界面把定位讲得很清楚：公司试图拥有中小企业的完整雇佣工作流，而不只是把 HR 功能螺栓式接到薪资上。主产品页把 Employment OS
              呈现为一个横跨招聘、HR、薪资和福利的系统，再把这套组合展开为具体模块，包括申请人跟踪、入职、员工管理、离职、分析、HR
              咨询、实施服务、薪资预支和名义雇主服务。运营想法是，员工数据、审批、休假、工时表、薪资和敬业度都待在同一处；这很重要，因为它减少单点工具之间的交接，也让打包的自助服务功能更有价值。公开证据强烈表明，这种宽度是真实的，尤其体现在招聘、HR
              记录、薪资自动化、福利和合作伙伴集成上。较不透明的是模块附加率、按 SKU 划分的客户组合，以及纯软件功能与托管薪资或 HeroForce 全球雇佣支持等更高接触服务层之间的边界。
