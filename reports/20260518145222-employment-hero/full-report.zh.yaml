  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的市场更适合被定义为面向中小企业和成长型组织的雇佣工作流层，而不是整个 ERP、会计或用工服务宇宙。公司自己的首页把招聘、HR、薪资、员工体验、福利和托管式雇佣基础设施打包进一个
              Employment OS，HeroForce
              又为本地、全球和按需招聘加入类名义雇主法律基础设施。这让纳入范围的支出从发薪延伸到入职、合规文件、招聘工作流、员工自助服务和跨境雇佣管理。边界之外仍有大量支出：总账软件、完整 ERP
              套件、专业会计平台，以及纯用工或招聘机构都相邻但不等同。真正的竞争往往是一套替代栈，而不是单一对手：电子表格、会计师、薪资外包机构、独立薪资产品，以及单点 HR 或招聘工具。Xero
              的薪资指南明确把软件、服务商和会计师列为可选项；它同时警告电子表格无法满足 STP 要求，显示合规正是迫使转型的力量。MYOB 的分层和 ATO 产品登记册也强化了同一点：Employment Hero
              赢输的对象是碎片化的中小企业运营栈，而不只是另一款薪资 SKU。
