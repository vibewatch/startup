      - number: '2.3'
        title: 买方、用户与付款决策横跨多个职能
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的买方地图从工作流痛点开始，但决策很少停留在单一职能内。公司面向中小企业和成长型组织营销，产品文案和评价证据都显示，HR
              与薪资团队通常是最早的发起人，因为他们负责入职、工资单、休假和核心员工记录。财务会成为守门人，因为薪资税、super、PAYE
              和报告准确性都落在更宽的控制义务里；当职位板分发和申请人工作流进入部署范围时，招聘经理也会在意。员工同样是活跃用户：自助服务、移动 App
              访问和福利都是套件一部分，这把产品从后台管理工具变成日常使用系统。因此，各细分市场的采用路径不同。微型雇主可能从业主或会计师替换手工薪资开始。成长型中小企业更可能由人力运营或薪资负责人起步，再把财务拉进来。多国买方会增加法务和合规审查，因为
              HeroForce 与类 EOR 服务会改变谁是员工记录中的雇主。这种跨职能动线解释了为什么 Employment Hero 的市场是一层横跨薪资、招聘、合规和雇佣管理的工作流外壳，而不是单一预算科目。
