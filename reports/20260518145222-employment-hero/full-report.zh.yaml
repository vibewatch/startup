  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代类别
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 面对的不是一个整齐的同业组。作为一家聚焦中小企业的厂商，它自己的定位很宽：公司营销的是由 AI 驱动的雇佣操作系统，覆盖薪资、HR、招聘、福利、集成，以及用于 180+ 国家招聘的
              HeroForce 托管式雇佣基础设施。这个宽度意味着，最接近的直接重叠来自同样主打全合一雇佣控制平面的厂商。Deel 和 Rippling 是最清晰的直接套件对手，因为两者公开网站都把薪资和 HR
              与更宽的工作流或管理界面结合；HiBob 则更像是以人员核心系统为中心，并向薪资和财务相邻领域竞争。替代集合一样重要。Xero 可以为澳大利亚小企业锚定会计主导的薪资栈，BambooHR
              可以在不试图成为澳大利亚优先的薪资操作系统时拿下人员核心 HR，Employment Innovations 则能把本地薪资和 HR 作为托管服务外包出去，甚至转售由 Employment Hero
              驱动的软件。Gusto 作为本地薪资既有厂商的意义较弱，更多是透明度基准；ADP 和 Workday
              仍有影响，因为装机基础规模、多国薪资能力和生态触达仍能把较大买方拉向既有套件。实际采购中，买方不只是在软件品牌之间选择，而是在捆绑式雇佣 OS、全球 EOR / 薪资套件、人员核心 HR
              中枢，以及由会计师和外包薪资帮助拼起来的本地栈之间选择。
