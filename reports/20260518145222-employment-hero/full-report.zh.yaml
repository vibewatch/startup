        title: 创始人、领导班底与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人故事证据扎实。Employment Hero 的 About 页面称 Ben Thompson 与 Dave Tong 在 2014 年共同创立公司，并且仍把 Thompson
              放在公司公众面孔的位置。第三方公司档案补充了这张图：Tong 是 CPTO，团队还包括 CFO Rob Paterson、CRO Kevin
              Rawlings，以及多位总经理和幕僚长。即便完整董事会名单仍难取得，这也足以勾勒出职能覆盖。因此，公开证据对高管层的刻画强于董事会层面。当前最需要警惕的是，公开争议集中在创始人 CEO
              身上。SmartCompany 记录了 Thompson 与 Hostplus 的争执，SEEK 诉讼则暴露出 Employment Hero
              的招聘和分发流可能在多大程度上依赖战略关系。合在一起看，公司是创始人主导，并有一支有意义的运营班底；但仅靠公开来源，还不足以透明到解决董事会控制权、投资人权利或 KKR 进入后治理变化等问题。
