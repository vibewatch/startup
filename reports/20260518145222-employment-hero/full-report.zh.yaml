      - number: '6.2'
        title: 具名客户证据在生产使用和管理 ROI 上强，但在队列耐久性上弱
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 达到了具名客户证据门槛，因为保留来源不止于模糊推荐语。NORSTA 称薪资处理从几天降到 30 分钟以内，自助服务也消除了对行政助理的需求。UMFC 描述了一家 120
              多名员工的非营利组织实现 100% 数字化 HR 文件，并减少工作流步骤遗漏。Merchantwise 显示 HeroForce 被用于八个国家 160 多名员工，合同在一到两天内发出。Alchemy
              Saunas 量化了快速扩张场馆时筛选时间的大幅改善。其他直接故事延续了这一模式：Jo Mercer 在 27 个地点、约 300 名员工中使用平台，每人入职约 10 分钟；Sigma 称每周在入职工作上至少节省
              10 小时；Sentrian 称自 2019 年起使用 Employment Hero，现在把薪资对账跑成一键流程。这些都是具体的生产信号。它们也足够多样，显示 Employment Hero
              被用于运行日常雇佣工作流，而不只是试点项目或营销展示。缺失的是广泛的公开留存数据集。公开记录提供了孤立的耐久性点和大量评价，但没有全套件范围的
              NRR、GRR、流失率或队列表。换句话说，本章可以有信心地确立生产采用和价值证明，但仍无法把这些胜利转译为整体装机基础的投资组合式耐久性判断。
