      - number: '8.3'
        title: 公开 HCM 可比公司给溢价定下纪律，并框定估值区间
        blocks:
          - type: paragraph
            body: >-
              可比公司语境并不完美，但仍然不可少。Multiples.vc 和 Stock Analysis 的数据里，最相关的上市薪资与 HCM 可比公司，企业价值 / 收入倍数大多落在约 3x 到
              6.5x，Dayforce 和 Paychex 靠近上沿，Workday、Paycom 和 ADP 低一些。在这个参照系下，Employment Hero 按官方 ARR 推算的低于 7.3x 倍数，或按 KKR
              较早 ARR 锚点约 8.8x
              的倍数，明显高过上市先例；但若资产增长更快、平台选择权更宽，这个倍数并不离谱。这不说明便宜。更准确地说，当前价格大概处在公开证据可支撑区间的上半段，而不是完全跑出区间。公开记录因此支持围绕当前估值给出较宽区间，而不支持确信投资者已经因不确定性获得足够补偿。
