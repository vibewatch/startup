      - number: '7.4'
        title: 缓释措施可见，但最重要的否决条件仍取决于私有尽调
        blocks:
          - type: paragraph
            body: >-
              对 Employment Hero 的正确解读，不是公司没有控制。公司有可见的安全内容、公开状态透明度、活跃的法律和产品政策页面，以及比许多私营同业更清晰的 Trust
              Centre。这些信号降低了风险无人管理的概率。它们没有回答对下行保护最重要的问题：SLA 和赔偿实际长什么样，薪资关键事故发生频率如何，哪些合作伙伴国家依赖第三方，加拿大和 EOR
              扩张还要消耗多少资本才能达到可持续盈利。这就是为什么击穿投资逻辑的触发条件必须保持明确。反复影响截止时间的宕机、未能落地 Payday Super、再次出现职位板 / API
              冲突，或出现证据表明合作伙伴和支持结构无法吸收全球执行复杂度，都会让当前风险姿态显著恶化。在私有尽调补齐这些缺口之前，公开记录支持谨慎，而不是自满。
