        - 全球招聘和合规合同把套件从本土 HR / 薪资延伸出去
        - 国家覆盖、本地实体模型和单位经济性没有完全公开
      - - 集成目录
        - 管理员、财务、合作伙伴
        - 已上线，覆盖广
        - 薪资、HR、会计和劳动力工作流的打包连接器，降低定制开发需求
        - 没有公开连接器使用量或故障率数据
      - - 开发者门户 / API / webhooks
        - 开发者、实施合作伙伴
        - 真实存在，但受方案层级限制
        - REST API、OAuth、区域数据行为、写入端点和 webhooks 支持定制工作流
        - 高阶方案门槛限制小客户可用性
      - - 信任中心 / 状态界面
        - 安全审核者、采购、管理员
