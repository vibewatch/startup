      - number: '4.3'
        title: 资本充足性、融资依赖与仍阻碍承销的事项
        blocks:
          - type: paragraph
            body: >-
              资本充足性的最佳公开证据是间接的，但仍有意义。公司自己的 Series F 公告称已披露累计融资超过 A$650 million；KKR 和 Business Wire 新闻稿显示，一位新战略投资人从 SEEK
              手中买入股份，而 SEEK 仍是重要股东；Startup Daily 称老股交易隐含 A$2.2 billion 估值，较 2024 年 6 月高 19%。官方 ARR
              新闻稿也重要，因为它们把公司描绘成正在迈向盈利的规模化公司，而不是为了填补短期缺口而融资。即便如此，没有保留的公开来源披露当前现金、月度烧钱、跑道、毛利率或留存。SEEK 文件仍有用，因为它确认了减持背后的
              Growth Fund 结构，但不给 Employment Hero
              的运营指标。这让财务结论呈现混合但可投资的状态：收入引擎看起来宽，公司仍能吸引高质量资本，但真正承销仍卡在缺少流动性、毛利、留存和实际定价纪律等私有指标上。实际含义是，Employment Hero
              现在看起来能融资，但仅靠公开来源还无法完全承销。投资人能看到需求、估值支持和部分利润率改善证据，却仍无法建模下行保护、契约压力或稳态自由现金流。因此，资本充足性问题只回答了一半：公司似乎能吸引成熟股东，但外部投资人仍需要资金管理、留存和毛利率细节，才能把公开记录视为足以通过投资委员会。
