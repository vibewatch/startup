  - id: TV005
    title: 投资逻辑失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 在披露更干净前增长放缓
        - 持续低于当前 30%+ 增长叙事，且没有利润率证据补偿
        - 对照公开薪资和 HCM 可比公司，溢价倍数会很快失去支撑。
        - 不要把当前估值按有吸引力来做投资假设。
      - - 加拿大仍是资本黑洞
        - 持续投入后，本地仍没有可信盈利路径
        - 扩张可选性变成利润率拖累。
        - 下调上行情景，把加拿大视为折价因素。
      - - EOR / 合同风险比预期更严苛
        - 合作伙伴分配、责任上限或预先供资条款显著削弱客户保护
        - 混合服务经济性应给出低于纯软件的倍数。
        - 用更低的公开市场可比对象重新测算。
      - - 股权结构表或披露意外
        - 优先股堆叠、棘轮条款，或缺失的经审计经济性显著差于假设
        - 名义估值不再反映普通股真实经济性。
        - 暂停流程，直到分配瀑布和收入质量清楚。
    notes: 否决触发因素围绕可衡量的投资假设失效设定，而不是泛泛的“关注一下”提醒。
