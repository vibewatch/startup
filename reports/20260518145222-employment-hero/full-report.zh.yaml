  - id: TV006
    title: 最终尽调资料请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥接
        - 经审计 ARR，以及从 2025 年估计值到 2026 年官方 ARR 声明的收入桥接
        - 当前倍数支撑会随真实收入锚点大幅变化。
        - 索取 CFO 桥接、董事会材料和审计师审阅的定义。
      - - 利润率质量
        - 毛利率、EBITDA、自由现金流和产品级组合
        - 如果业务已经表现得像规模化软件，溢价倍数就更容易守住。
        - 获取管理层报告包或产品族经济性。
      - - 留存与附加销售
        - 净收入留存、Logo 留存、按队列划分的附加率，以及按产品族划分的流失
        - 只有交叉销售和留存真实存在，产品宽度才值得溢价。
        - 索取按客户规模和地区划分的队列分析。
      - - 股权结构表经济性
        - 清算优先权、参与权、棘轮条款和员工要约出售机制
        - 名义估值可能高估普通股经济性。
        - 审查融资文件和分配瀑布分析。
      - - 加拿大单位经济性
        - 本地收入、利润率、CAC、回本周期和收支平衡计划
        - 在公开来源中，加拿大既是最清晰的上行选项，也是最清晰的拖累风险。
        - 索取国家级 P&L 和运营 KPI 包。
      - - EOR 合作伙伴与责任结构
        - 逐国合作伙伴地图、赔偿条款、准备金政策和薪资供资机制
        - 混合服务敞口可以支撑相对纯 SaaS 的折价。
        - 索取 Global Teams 法律实体矩阵、合作伙伴名册和索赔历史。
    notes: 这些材料是把公共证据视角推进到可投资承销视角所需的最低信息。
    claimRefs:
      - CV024
      - CV025
      - CV031
      - CV040
      - CV041
