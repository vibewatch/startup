  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 薪资、隐私和合作伙伴法律构成最深的残余风险栈
        blocks:
          - type: paragraph
            body: >-
              Employment Hero
              销售的不只是普通工作流软件；它在多个司法辖区内自动化薪资、招聘、员工记录和跨境雇佣，而这些地方的错误会带来监管、法律和客户信任后果。关于这一点，最强的公开证据并不戏剧化，而是日常化。Employment Hero
              自己称 2026 年会给雇主带来重大法律变化；ATO 和 Fair Work 材料则清楚显示，STP、Payday Super、欠薪执法和隐私处理都是活的运营义务，而不是静态规则。SEEK
              纠纷即便已经和解也很重要。案件以 API 访问恢复告终，但恢复受条款约束，这确认了第三方平台访问会从便利变成法律和商业依赖。隐私层同样关键，因为 Employment Hero
              自身政策覆盖薪资、税务、super、ID、生物识别、EOR 和招聘流。也就是说，下行不只是一张罚单；公司最有价值的工作流正落在不断变化的薪资、隐私和合作伙伴治理制度里。
