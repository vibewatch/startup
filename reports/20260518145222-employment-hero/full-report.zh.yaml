  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议维持继续研究，因为当前估值看似合理，但尚未完成充分承销
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 并不像与规模脱节那样明显高估，但公开记录仍不足以支撑买入级承销。最强锚点是 2026 年 2 月老股交易，Startup Daily 称其隐含约 A$2.2 billion
              估值。这个价格并非凭空发生。Employment Hero 自己称 ARR 已超过 A$300 million，增速仍高于 30%，平台已经支持超过 350,000 家企业、超过 2.5 million
              名员工，以及每年超过 A$120 billion
              的支付额。这些都是真正的优质溢价信号。问题是，价格发现仍在私下进行，当前披露很薄，同一公开记录仍在股权结构条款、经审计利润率和盈利持续性上留下重大缺口。这足以在当前估值下给出继续研究，而不足以给出买入。
