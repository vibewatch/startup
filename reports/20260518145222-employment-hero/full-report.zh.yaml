      - number: '8.4'
        title: 仍卡住投资判断的事项，以及什么会改变看法
        blocks:
          - type: paragraph
            body: >-
              剩下的核心问题不是 Employment Hero 是否有吸引力，而是当前入场价格能否为公开记录里仍看得到的信息披露和执行缺口提供足够回报。不可少的尽调问题很基础：对齐第三方 2025 年收入估计与公司 2026
              年 ARR
              口径之间的收入桥；拿出毛利率和自由现金流质量；说清净留存率和模块挂载；披露当前估值标记背后的真实股权结构经济性。这些问题重要，因为当前估值逻辑对增长、利润率和下行保护的微小变化都极其敏感。公开记录也让投资者无法区分常规软件毛利率，以及任何毛利更低的服务、合作伙伴或薪资资金敞口；这种业务组合问题，正是能让看似合理的表面倍数很快变贵的地方。若管理层能拿出证据证明增长稳在
              30%+、盈利能力改善，且合同或股权结构清晰，判断可以转向观察。若在证据出现前增长放缓，或加拿大和 EOR 执行比预期更久地消耗资本，溢价应快速压缩，回到上市软件先例附近。
