      - number: '8.2'
        title: 投资逻辑是规模和宽度；反向逻辑是披露、加拿大拖累与溢价依赖
        blocks:
          - type: paragraph
            body: >-
              支持估值的逻辑很直接。Employment Hero 看起来是在搭建宽广的雇佣操作系统，而不是单一薪资点解决方案。公司自己的规模披露、Sacra 的 ARPU 与变现框架，以及 Humi
              收购，都支持这样一个故事：薪资、HR、招聘、面向员工的金融科技和 EOR，会扩大公司增长钱包份额的方式。反向逻辑同样重要。加拿大自身尚未盈利，EOR
              层在合同上似乎比纯软件更保守，公开评价来源持续暴露支持、定价和实施摩擦。最重要的是，相比公开可比公司，披露缺口仍然很大。公开市场买方可以阅读 ADP、Paychex、Paycom、Workday 或 Xero 的
              SEC 或投资人材料；他们无法用同样方式阅读 Employment Hero 的利润率、股权结构或储备姿态。这意味着溢价仍更多建立在信任上，而不是证据上。
