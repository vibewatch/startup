companyProfile:
  summary: >-
    Employment Hero 是一家创立于 Sydney 的私营雇佣软件公司，销售由 AI 驱动的雇佣操作系统，覆盖招聘、HR、薪资、福利、员工财务健康功能，以及部分托管雇佣服务。公开证据支持其已具备广泛的中小企业规模：服务超过
    350,000 家企业，管理超过 2.5 million 名员工，ARR 超过 A$300 million；2026 年 2 月的老股交易隐含估值约 A$2.2
    billion。公司在中小企业雇佣基础设施中具备战略意义，但公开承销证据在利润率、留存、股权结构经济性和当前员工数上仍不完整。
