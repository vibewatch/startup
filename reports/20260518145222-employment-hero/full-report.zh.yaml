            body: >-
              Employment Hero 的公开融资历史，在 2023 年 Series F 和 2025 年 KKR 交易上最具体。官方 Series F 公告称，公司由 TCV 领投融资 A$263
              million，累计融资超过 A$650 million，估值略低于 A$2 billion。公告还点名 Insight Partners、AirTree、SEEK 和 OneVentures
              参与，足以勾勒出稳定的投资人基础。KKR 与 SEEK 交易随后给出下一枚资本标记：KKR 同意从 SEEK 手中买入股份，SEEK 仍保留重要投资人地位；Startup Daily 报道称交易股票金额为
              A$95 million，隐含估值 A$2.2 billion，较 2024 年 6 月高 19%。公开 ARR 披露进一步强化了围绕这些融资标记的增长故事。Employment Hero 从 2025 年 2
              月 A$250 million ARR 里程碑，推进到 2025 年 10 月超过 A$300 million ARR；2026 年售股公告称增速仍高于 30%，利润率也在扩张。即便 2024 年 6
              月的准确估值和完全稀释股权结构仍未披露，这已经是很强的后期增长画像。
