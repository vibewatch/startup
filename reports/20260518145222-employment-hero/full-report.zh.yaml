  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合：证据最广泛落在运营分散的中小企业和中型雇主
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的公开客户证据明显不止 Logo 墙，但仍偏向产品差异化最强的运营模式。案例研究中心覆盖零售、酒店餐饮、国防承包、非营利 / 社区服务、IT
              服务、法律服务、医疗、托育和多国名义雇主工作流。合作伙伴目录和资源中心又提供另一个角度：公司并不服务单一狭窄垂直，因为六个国家的顾问、薪资实施方和 HR
              顾问正在把这套软件打包进许多中小企业运营语境。最有说服力的具名故事集中在有手工入职、碎片化 HR /
              薪资系统、合规密集管理，或地域分散团队的买方身上。这表明，当运营复杂度相对公司规模偏高时，产品更能产生共鸣。公开规模数字仍要谨慎处理。当前公司自有页面引用数十万家企业和数百万用户，但部分第三方目录仍显示明显更旧的数据。因此，合理结论是采用广泛且真实，但在当前官方文案之外，分母精度仍不均衡。按尽调语言说，Employment
              Hero 看起来是真正的跨垂直中小企业平台，但其公开客户数量叙事仍需要在当前和历史发布方界面之间校准。后续财务和市场份额章节尤其需要这一点，因为一家企业可以有广泛的轶事证据，却仍让投资人无法确定
              customers、organisations、users 和 active employers 这些词背后的准确分母。
