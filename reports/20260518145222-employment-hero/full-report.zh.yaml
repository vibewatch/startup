              里程碑记录支持这样一家公司：产品宽度和地域触达持续扩张，同时也积累了治理摩擦。公开来源可以串起 2014 年创立、2017 年 ANZ 合作、2023 年 Series F、2023 年 Swag
              规模化发布、2024 年由 900 次产品发布凸显的发布节奏、2025 年 1 月收购 Humi、2025 年 2 月 A$250 million ARR 里程碑、2025 年 7 月 SEEK API
              诉讼、2025 年 10 月 A$300 million ARR 里程碑，以及 2026 年 2 月 SEEK 减持流程。负面记录重要，因为它不是一篇孤立报道。SmartCompany 和 Startup
              Daily 都报道了 SEEK API 纠纷，SmartCompany 还单独记录了 Hostplus 争执，客户评价平台也仍能看到真实但不击穿投资逻辑的支持摩擦。因此，主要尽调阻塞点不是 Employment
              Hero 有没有动能——它显然有——而是私有材料能否确认更干净的治理图景、对齐员工数，并用一手文件而非二手报道，把 2024 年 6 月估值台阶与 KKR 交易接上。
