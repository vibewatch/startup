      - number: '2.2'
        title: 官方企业数量口径显示市场很大，但没有干净的 SAM
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 最强的公开市场规模证据，是雇主数量口径，而不是厂商式 TAM。澳大利亚方面，ABS 在 2025 年 6 月统计到 994,178 家雇佣员工的企业，而更宽的活跃经营企业总数为
              2.73 million；ABS 还单列了 688,870 家拥有一到四名员工的企业。新西兰方面，Stats NZ 在 2024 年 2 月统计到 612,420 家企业，但 73%
              没有付薪员工；这意味着有付薪员工的企业只有约 165,000 家，而且这也只是分析端估算，并非官方公布的雇主数。英国方面，DBT 更宽口径的企业人口报告给出 5.682 million 家中小企业，而 ONS
              统计到 2.725 million 家 VAT 或 PAYE
              注册企业。这些口径都有用，但分母并不相同。澳大利亚公布雇佣员工的企业，新西兰公布所有企业加员工占比披露，英国则把注册雇主与包含未注册公司的更宽企业估算拆开。合理结论是，Employment Hero
              面向庞大的多国雇主基础销售，但没有保留的公开来源能把这些口径干净换算成 Employment Hero 专属的 SAM 或 SOM，尤其无法拆开纯软件买家与 HeroForce 式托管雇佣。
