  - id: TM005
    title: 规模测算和采用尽调缺口
    columns:
      - 缺口
      - 当前公开状态
      - 重要性
      - 具体尽调路径
    rows:
      - - 纯软件与 HeroForce SAM 的边界
        - 公开来源能看到雇主壳结构，但看不到纯软件买方与托管雇佣买方的拆分。
        - 如果把两者并入一个 TAM，估值可能夸大可触达市场。
        - 按地区索取纯软件、HeroForce 和混合账户的销售管线与客户拆分。
      - - 模块附加率和扩展顺序
        - 留存来源没有披露薪资客户接下来会追加 HR、招聘、福利还是托管雇佣。
        - 交叉销售是雇佣 OS 逻辑和 LTV 假设的核心。
        - 索取附加率队列、模块采用顺序，以及按客户规模拆分的扩展收入。
      - - 公开定价和打包精度
        - 评测页对可见起售价说法不一，官网仍把买方导向报价驱动的需求发现。
        - 打包方式不透明，削弱外部 ROI 和回本分析。
        - 索取当前价目表、最低消费、上线费，以及按套餐和地区拆分的折扣规则。
      - - 地区和可靠性组合
        - 公开证据没有显示国家收入结构、纯薪资与偏招聘队列的占比，或按产品线拆分的事故频率。
        - 产品承载薪资或关键招聘工作流时，信任和在线率权重更高。
        - 索取国家收入结构、按产品拆分的宕机历史，以及与服务事件或集成问题挂钩的流失 / 延迟数据。
    notes: 这些是剩余尽调中价值最高的问题，因为它们会直接改变 SAM 置信度、扩展测算和风险调整后的投资判断。
    claimRefs:
      - CM025
      - CM048
      - CM050
  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 渠道信号
      - 目标客群
