  - id: TM001
    title: 市场定义与替代栈
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 现状替代方案
      - 含义
    rows:
      - - 核心就业运营系统
        - HR 记录、薪资、入职、休假、员工自助、福利和招聘工作流
        - ERP、总账和宽口径会计系统
        - HR 或薪资负责人，需财务签字
        - 单点 HRIS 加薪资，再加表格或邮件
        - 这是 Employment Hero 的主要切入点：卖的是一套就业工作流，而不是单个窄模块。
      - - HeroForce / 托管雇佣
        - 类似 EOR 的法律基础设施、合同、薪资和合规，服务本地或全球雇员
        - 传统人力中介收入，以及未绑定软件的完整法律外包
        - COO、人事运营或创始人，并有法律或合规输入
        - 本地实体设立、纯 EOR 供应商或外包雇佣管理
        - 托管雇佣把可触达支出从纯软件买方外扩。
      - - 招聘与申请人工作流
        - 职位分发、申请人跟踪、候选人流转和招聘工作流
        - 一般广告支出和独立招聘市场平台经济
        - 招聘经理或人才负责人
        - 直接发布招聘网站、招聘顾问或独立 ATS 工具
        - 招聘相邻业务重要，因为 API 或招聘网站访问会影响产品价值。
      - - SMB 薪资核心
        - 发薪、预扣税、super 或养老金、工资单和发薪日申报
        - 不执行薪资的通用会计
        - 薪资负责人、办公室经理或财务负责人
        - 会计师、薪资服务机构、Xero、MYOB 或表格驱动流程
        - 薪资仍是合规压力最强的锚定产品。
      - - 员工体验层
        - 移动应用、福利、已赚薪资访问、学习和参与界面
        - 独立消费者金融科技或保险公司经济性
        - HR 或人事团队；员工是活跃用户
        - 单点福利应用或独立沟通工具
        - 相邻层有用，可以加深粘性，但不应计作无限大的独立 TAM。
      - - 组合型 SMB 技术栈
        - 由多工具组成的运营栈，合起来覆盖招聘、薪资、合规和员工管理
        - 虚构的单供应商基线
        - HR、财务、招聘和外部顾问中的多个负责人
        - 会计师或薪资服务机构，加薪资软件和招聘工具
        - Employment Hero 通常面对的是一组替代品，而不是一个一一对应的产品。
    notes: 边界逻辑按工作流划定：纳入支出触及员工记录、薪资、招聘或托管雇佣流程；排除支出位于这套工作流外壳之外。
