      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 薪资规则执行
        - payday super 推出质量
        - 2026 年 7 月 1 日后出现生产缺陷、客户人工覆盖或重大支持量激增
        - 在补救指标可用前，上调合规和流失风险评级。
      - - 平台可靠性
        - 薪资或平台事故频率
        - 单季度两次影响截止期限的宕机，或一次造成明显薪资漏发的宕机
        - 将可靠性视为关键任务工作流采用的投资逻辑破坏因素。
      - - 隐私与安全态势
        - 泄露或监管接触
        - 任何需通报泄露、监管问询，或关于员工数据处理的重大不利披露
        - 立即上调法律、补救成本和信任假设。
      - - 合作伙伴 / API 依赖
        - 招聘或合作伙伴访问
        - 核心招聘网站或 EOR 合作伙伴路径丧失或受到重大限制
        - 假设实施摩擦更高，附加率可持续性更低。
      - - 加拿大执行
        - 本地盈利能力和规模
        - 持续投入并经历市场进入期后，仍看不到收支平衡路径
        - 将加拿大视为利润率拖累，而非估值上行因素。
      - - 合同保护
        - SLA / 赔偿证据
        - 管理层无法提供可接受的服务抵扣、赔偿或合作伙伴分配条款
        - 评估下行风险时，不要假设合同救济很强。
