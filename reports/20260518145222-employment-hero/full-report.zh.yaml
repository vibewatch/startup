      - number: '2.4'
        title: 合规和数字化支撑需求，但信任与定价不透明仍重要
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 的需求逻辑，在合规、数字化和劳动力复杂度交汇处最强。澳大利亚 STP、新西兰发薪日申报、英国 PAYE 加 FPS
              报告，都把雇主推向软件或外包机构级流程，以便在每个发薪日准确申报。英国政策工作又提供第二重顺风：政府越来越把中小企业数字化采用视作降低行政负担、提高生产率的路径。但同一组公开证据也说明，市场不会干净或立刻转化。英国研究称，中小企业仍需要个性化支持；工作组也指出时间、现金和实操知识缺口。澳大利亚历史
              ABS 数据指向同样方向：云采用率随规模上升，知识不足仍会拖慢采用。Employment Hero 自身摩擦也看得见。评价平台出现设置、报告和薪资支持投诉；状态页记录了 2026 年 5 月 HR 宕机；Seek
              诉讼让招聘相邻信任成为活的尽调议题，即便它并不削弱薪资监管本身。定价也是约束。公开评价网站对可见入门价格意见不一，但都同意产品模块化，并以报价为导向。估值时，应该从合规痛点和替代栈替换来承销采用，同时对支持风险、信任噪声，以及缺少公开附加率或地域结构披露打折。
