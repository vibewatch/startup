          - type: paragraph
            body: >-
              相比许多私营中小企业软件厂商，Employment Hero 的信任姿态更可见。公司运营一个公共信任门户，并在 2025 年 8
              月升级，买方无需登录就能浏览安全、隐私和合规信息。同一次更新也给尽调划出重要边界：门户是公开的，但 ISO 27001、ISO 27017、ISO 27018、SOC 2
              报告、渗透测试摘要和脱敏政策等高价值材料，通常需要申请访问，且常常需要 NDA。帮助中心的安全页面补充了实际控制，包括 SSO、passkeys、双因素认证、隐私 / GDPR
              材料和安全措施文章。可靠性证据呈健康的两面性：官方状态页面和独立宕机聚合让事故可见，而不是把它们藏起来；但这些证据也显示，在本轮保留的 2025-2026 窗口内，平台经历过 HR 宕机、薪资同步问题和 API
              503 事件。因此，结论不是平台缺乏信任成熟度；而是 Employment Hero 给了投资人足够公开保证，可以相信控制平面存在，但在没有直接访问的情况下，还没有足够不受限制的细节完成深度企业级尽调。
