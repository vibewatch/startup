    rows:
      - - Employment Hero
        - 参照公司
        - 350k+ 客户；470+ 澳大利亚合作伙伴；战略触达 2.5M 名员工
        - 以澳大利亚为主、希望获得薪资、HR、招聘、福利和托管雇佣支持的中小企业及成长型组织
        - 本地薪资 / 合规覆盖、伙伴驱动分发，以及 HeroForce 托管雇佣都放在一个品牌下
        - 留存官方证据确认套餐和企业报价，但没有确认稳定的公开标价单元
      - - Deel
        - 直接全球雇佣套件
        - 首页称 40,000+ 家公司；合作伙伴页称 35,000+ 家公司；声称拥有覆盖 100+ 个国家的基础设施
        - 优先考虑 EOR、薪资、合规和用工类型覆盖的跨境团队
        - 透明的 EOR 起售价，加上全球合规、HR、IT 和集成覆盖
        - 留存官方页面的规模信号内部不一致；全球范围也可能宽过许多本地中小企业买方的实际需要
      - - Rippling
        - 直接宽口径劳动力套件
        - 伙伴生态称覆盖 20,000+ 家成长型公司
        - 希望用一个系统覆盖 HR、薪资、IT、财务和全球运营的公司
        - 一个系统横跨 HR、薪资、IT 和财务，并可模块化加购
        - 必须先购买核心平台且以报价驱动打包，会让直接比较入门价格更难
      - - HiBob
        - 人员核心 HR 中枢
        - 5,000+ 家公司，平台覆盖 1,230,200 人
        - 希望用现代员工运营并兼顾薪资和财务连接的中型及扩张期公司
        - 一体化人员平台，带原生美国 / 英国薪资和 Payroll Hub 集成
        - 留存官方页面支撑薪资邻接，但不支撑澳大利亚优先的薪资或托管服务切口
      - - BambooHR
        - HR 核心替代品
        - 33,000+ 家增长导向客户；140+ 个集成
        - 需要 HR、薪资和福利，但不需要更宽雇佣 OS 的中小企业
        - 按员工按月定价、自动量级折扣和成熟 HR 科技市场
        - 与 Employment Hero 相比，招聘、福利市场深度和澳大利亚特定雇佣基础设施证据更少
      - - Xero
        - 会计驱动的薪资替代品
        - 4.9 million 客户；合作伙伴计划中有 250,000+ 名会计师和记账员
        - 依托会计工作流和会计师渠道的小企业
        - 强会计师分发，加上符合澳大利亚 STP 的薪资和应用生态
        - 留存官方页面证明薪资和集成，但不证明完整的 HR、招聘和福利运营系统
      - - Employment Innovations
        - 本地外包薪资 / HR 替代品
        - 受 1000+ 客户信任；每年服务数千家澳大利亚企业
        - 偏好外包薪资或重咨询支持、以澳大利亚为主的雇主
        - 本地薪资和 HR 服务深度，加上由 Employment Hero 驱动的 HR 软件
        - 更像服务层和邻近渠道路径，而不是清晰的软件护城河
      - - Gusto
        - 透明中小企业薪资标杆
        - 500,000+ 家中小企业
        - 美国中小企业薪资和 HR 买方；此处主要作为透明度标杆
        - 清晰的薪资套餐结构和简单的薪资 / 福利定位
        - 留存官方页面没有证明澳大利亚薪资合规或更宽的雇佣 OS 覆盖
      - - ADP
        - 存量薪资 / HCM 套件
        - 1.1M 客户；支付 1/6 美国劳动者薪资；在市场中已有 75 年
        - 需要薪资、HCM、外包和多国家覆盖的大型企业
        - 庞大存量客户带来的信任，从小企业薪资到全球薪资的产品线
        - 公开姿态偏企业级、服务较重，并不明显贴合 Employment Hero 的核心中小企业切口
      - - Workday
        - 存量企业平台
        - Marketplace 和基于其构建的平台面向数千家客户
        - 正在标准化 HR、财务、IT 和薪资的中型及企业级买方
        - 宽企业级技术栈，加上伙伴构建应用和服务生态
        - 购买流程更偏企业级，部署也比典型 Employment Hero 客户更重
    notes: 规模单元仅使用从抓取 URL 留存的公开信号；无法恢复精确公开定价时，行内明确写明报价驱动或价格不清，而不是估算。
