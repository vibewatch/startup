        - 已上线且成熟
        - AI 辅助薪资发放、专家监督、异常处理、award 工资规则 / STP / 合规提示
        - 服务毛利、人员配置模型和 SLA 条款仍未公开
      - - 福利 / 互动 / 自助服务
        - 员工和经理
        - 已上线，仍在扩展
        - 福利、EWA、EAP、Work 应用自助服务、公司动态流和通知，与薪资 / HR 数据打通
        - 福利附加购买率和抽成率没有公开数据
      - - HeroForce / EOR
        - 国际雇主和 HR 负责人
