      - number: '5.4'
        title: 成熟度与路线图：强发布节奏和 AI 扩张可见，底层架构仍不可见
        blocks:
          - type: paragraph
            body: >-
              Employment Hero 2024-2026 年的外部叙事，是速度和范围扩大。公开材料指向嵌入薪资、HR 咨询和招聘的 AI；2025 年 5
              月一组覆盖工作流、招聘、薪酬、福利、报告、移动自助服务和薪资安全的发布；2025 年 1 月收购 Humi 以扩展加拿大足迹；以及围绕盈利、全年 900 次产品更新和英国加速的 2025 年评论。KKR
              交易材料值得注意，因为它把公司描述为云原生综合套件，并把产品宽度直接连接到国际扩张。与此同时，路线图信号仍远强于已披露的系统架构。投资人可以验证 Employment Hero 发货频繁、销售多个相邻模块，并在
              AI 和全球触达上投资。他们仍无法验证服务拓扑、数据驻留实施细节、私有正常运行时间承诺，或招聘、薪资、HR、福利和 HeroForce
              的采用如何拆分。这让产品结论在宽度和动能上偏正面，但最后一公里技术承销仍依赖管理层尽调。
