evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: >-
      A current public board roster or governance document naming directors, independent members, and any KKR or SEEK
      board rights.
    whyItMatters: Governance and control rights remain important for key-person risk and future refreshes.
    diligencePath: >-
      Search investor decks, registry filings, or direct media responses for board names and post-KKR governance
      changes.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: legal-entity-hq
    missingEvidence: >-
      A registry extract or corporate filing that confirms the current legal entity name, headquarters address, and
      filing status.
    whyItMatters: >-
      Third-party company pages point to Sydney, but a registry-backed legal source would tighten diligence-grade
      identity evidence.
    diligencePath: >-
      Pull ASIC, ABR, or Companies House extracts for Employment Hero entities and match them to the current operating
      site.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: june-2024-valuation
    missingEvidence: >-
      A primary document that shows the exact June 2024 financing mark, the primary versus secondary split, and the
      cap-table effect before the 2025 KKR deal.
    whyItMatters: >-
      Public coverage only says the 2025 KKR deal was 19% above June 2024, which is directionally useful but not precise
      enough for capital-history underwriting.
    diligencePath: >-
      Request board materials, shareholder letters, or audited investor reports that bridge the June 2024 mark to the
      2025 KKR transaction.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: >-
      A current company-confirmed employee count that reconciles third-party profiles showing roughly 1,200+ versus 1.7K
      staff.
    whyItMatters: Headcount is a key operating-scale signal and the public range is too wide to treat as canonical.
    diligencePath: Request a current org-wide headcount by geography and function from management or a board pack.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      A fuller dated chronology covering private financing paperwork, every product launch, and any undisclosed
      governance or partnership milestones behind TO004.
    whyItMatters: >-
      The milestone table is intentionally partial and needs an explicit caveat so later chapters do not over-read it as
      a complete corporate chronology.
    diligencePath: >-
      Request the internal board-approved timeline of financings, launches, acquisitions, partnerships, and disputes,
      then reconcile it against TO004 before final publication.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      A current official rate card or sales-approved packaging sheet that shows entry price, minimum spend, onboarding
      fees, and module packaging by geography.
    whyItMatters: >-
      Contradictory review-site pricing is enough to show opacity, but not enough to underwrite payback or affordability
      by segment.
    diligencePath: >-
      Request current pricing cards, implementation fees, and discount rules for software-only versus HeroForce-led
      deals in each core region.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: sam-som-segmentation
    missingEvidence: Customer counts and revenue split by software-only, HeroForce, geography, and starting module.
    whyItMatters: Without that segmentation, a public employer-count shell cannot be converted into a credible software SAM or SOM.
    diligencePath: Request management segmentation by starting module, country, service model, and current expansion stage.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM005
  - type: missing-source
    severity: material
    topic: attach-rates
    missingEvidence: >-
      Module attach-rate data that shows how often payroll buyers add recruitment, benefits, employee app, or HeroForce
      services.
    whyItMatters: The Employment OS thesis relies on cross-sell depth, and that changes lifetime value and market sizing.
    diligencePath: Request attach-rate cohorts, module adoption sequences, and gross retention or expansion by cohort.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM005
  - type: missing-source
    severity: minor
    topic: product-reliability-mix
    missingEvidence: >-
      Historical uptime and incident counts by module and geography, plus customer-delay or churn impact from outages or
      integration disputes.
    whyItMatters: >-
      Public status data shows incidents, but not whether reliability or integration risk changes close rates in payroll
      versus recruitment-led deals.
    diligencePath: >-
      Request internal incident logs by product line and any pipeline or renewal analysis tied to uptime or integration
      issues.
    relatedQuestionRefs:
      - QM018
      - QM019
    relatedTableRefs:
      - TM005
  - type: access-blocked
    severity: material
    topic: employment-hero-pricing
    missingEvidence: Stable plan-level list-price cells from the live Employment Hero pricing surface.
    whyItMatters: >-
      Without citable plan prices, the chapter can assess pricing transparency but cannot quantify how much cheaper or
      more expensive Employment Hero is than transparent peers.
    diligencePath: >-
      Open the live pricing page in a browser session, capture current plan tiles, or request the current AU quote card
      from sales.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: hibob-pricing
    missingEvidence: An official public HiBob list-price page or archived price sheet.
    whyItMatters: >-
      HiBob is a meaningful people-core rival, but without list pricing the comparison stays structural rather than
      quantifying entry economics.
    diligencePath: >-
      Search HiBob sales materials, archived pricing pages, or obtain a current quote sheet for the Australia-relevant
      package.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: employment-innovations-pricing
    missingEvidence: Current standalone public pricing or proposal examples for Employment Innovations payroll and HR services.
    whyItMatters: >-
      Employment Innovations is a credible local substitute, but quote-only pricing limits precise comparison of
      service-led substitution versus software-led adoption.
    diligencePath: Request a current proposal, quote sheet, or demo pricing summary from Employment Innovations.
    relatedQuestionRefs:
      - QP026
