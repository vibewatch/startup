company:
  name: "CADDi"
chapter:
  number: 1
  title: "Company Overview"
  summary: "CADDi is a Tokyo- and Chicago-headquartered manufacturing AI data platform founded in 2017 by Yushiro Kato and Aki Kobashi that raised a $114 million Series D in September 2026 at a $1.2 billion valuation, achieving unicorn status while pivoting entirely from custom parts procurement to enterprise software across 22 countries."
sections:
  - id: "identity-mission-and-scale"
    title: "Corporate Identity, Mission, and Global Scale"
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"
    body: >
      CADDi was founded in Tokyo in 2017 with an overarching mission to unleash the potential of manufacturing by
      overcoming the physical and data bottlenecks inherent to industrial supply chains. To support its rapid
      transpacific expansion and better serve Western industrial manufacturers, the company established a dual
      headquarters structure across Chicago, Illinois, and Tokyo, Japan. Over nine years of disciplined execution,
      CADDi has scaled its global enterprise footprint across 22 countries, serving heavy industrial machinery,
      automotive, and semiconductor equipment clients. Its primary software offerings have achieved rapid adoption,
      currently deployed by more than 50 percent of discrete manufacturers listed in Japan's Nikkei 225 index.
      To support this multi-regional software customer base, CADDi's global workforce has expanded to more than
      910 full-time employees worldwide, establishing specialized local sales, customer success, and solutions
      architecture teams across North America and Asia.
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance"
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO012"
    tableRefs:
      - "TO002"
    body: >
      CADDi's leadership combines deep management consulting rigor in industrial supply chains with elite Silicon
      Valley hardware and software product engineering experience. Co-founder and Chief Executive Officer Yushiro Kato
      previously managed manufacturing procurement optimization projects at McKinsey & Company, providing the operational
      foundation and commercial relationships that initiated the company's early growth. Co-founder and Chief Technology
      Officer Aki Kobashi earned undergraduate and master's degrees in electrical engineering from Stanford University,
      developed large-scale satellite image-processing systems in the U.S. aerospace sector, and led product engineering
      initiatives at Apple for flagship consumer hardware including iPhone and AirPods. Executive management is further
      strengthened by Chief Financial Officer Ryota Haga, who oversees global capitalization and institutional investor
      syndicates, and VP of Engineering Chris Cope, who manages distributed software engineering across North America and
      Japan. While key-person dependency on Kato and Kobashi remains substantial, executive hires in Chicago provide
      increasing operational autonomy.
  - id: "capitalization-and-investor-structure"
    title: "Capitalization, Valuation, and Stakeholder Governance"
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
    body: >
      CADDi has demonstrated consistent access to tier-one global growth capital, progressing through disciplined
      equity financing rounds that culminated in unicorn status. In September 2026, the company entered into definitive
      agreements for a $114 million Series D round at a post-money valuation of $1.2 billion, representing a significant
      step-up from its March 2025 Series C extension led by Atomico at a $470 million valuation. The Series D brought
      CADDi's cumulative lifetime equity financing to $234 million. The syndicate reflects a well-balanced composition of
      returning global venture partners—including Atomico, Globis Capital Partners, and JPS Growth Investment—and premier
      new strategic and financial institutions such as Moore Strategic Ventures, Coreline Ventures, Salesforce Ventures,
      and Toyota Motor Corp.'s Woven Capital. This investor base provides strong institutional validation and governance
      oversight as CADDi accelerates its North American market penetration.
  - id: "platform-evolution-and-strategic-risks"
    title: "Platform Evolution, Product Relaunch, and Strategic Risks"
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
    body: >
      Between 2017 and 2024, CADDi operated CADDi Manufacturing, an asset-backed custom parts procurement service with
      partner factories and inspection centers across four countries. Recognizing that sustainable industry transformation
      required software infrastructure rather than physical brokering, CADDi formally discontinued all parts supply in July
      2024 to become a pure-play AI platform. In August 2026, the company completed a ground-up platform relaunch spanning
      four integrated layers: Data Layer, Semantic Layer, Discovery & Agents (CADDi Explorer and CADDi Agent), and domain
      Workflow Products. Despite these technical advances, external risks remain pronounced. Industry critics emphasize that
      CADDi continues to withhold audited ARR and margins, leaving its $1.2 billion valuation dependent on narrative growth.
      Furthermore, established product lifecycle management (PLM) incumbents such as Siemens, SAP, and Dassault Systemes
      represent severe bundling threats, while separate startups using the Caddi moniker in wealth management create minor
      brand disambiguation overhead.
