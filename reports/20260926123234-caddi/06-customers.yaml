chapter:
  number: 6
  title: "Customers"
  summary: "CADDi's manufacturing AI data platform has achieved proven enterprise adoption across Tier-1 automotive, heavy machinery, and precision fabrication leaders including Neaton Auto Products and Amerequip. Customers report dramatic 40% to 70% drawing search time savings and 75% RFQ workflow penetration, though long-term durability is counterbalanced by withheld retention metrics and impending competitive bundling from incumbent PLM suites."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Base Segmentation and Target Profiles"
    body: "CADDi targets discrete manufacturing enterprises operating in complex, document-intensive industrial verticals where engineering designs, procurement histories, and quality records have accumulated in disparate silos over decades. The core buyer personas consist of Vice Presidents of Design Engineering, Directors of Procurement, and Heads of Quality Control at Tier-1 automotive suppliers, industrial equipment original equipment manufacturers (OEMs), and high-precision contract fabricators. These organizations typically manage tens of thousands to over one million technical drawings, CAD files, and legacy bills of materials across ERP systems like SAP or Infor LX alongside legacy network file servers. CADDi delivers value across this customer base through two interconnected channels: its core software application, CADDi Drawer (evolving to CADDi Explorer and domain workflow tools), and CADDi Manufacturing, an asset-light supply chain procurement service that guarantees component quality, delivery, and pricing. While the broader enterprise automation market also encompasses workflow solutions targeting back-office process mining, CADDi's primary defensibility stems from its proprietary geometric and semantic understanding of heavy industrial manufacturing assets."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
      - "CU011"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-metrics"
    title: "Adoption Trajectory and Usage Acceleration"
    body: "Adoption of CADDi's data platform typically initiates with acute departmental pain points—specifically the substantial engineering labor lost to manually searching for legacy drawings, verifying part revisions, and matching customer RFQ requests against historical quotations. Once deployed, usage exhibits rapid bottom-up expansion as daily time savings become evident across adjacent plant operations. At Tier-1 automotive supplier Neaton Auto Products Manufacturing, initial deployment began with 30 users and organically scaled by 183% to reach 85 active accounts within weeks as quality control and procurement teams integrated the platform into their daily routines. Similarly, among high-precision metal and plastic fabricators, tooling estimators have integrated CADDi into approximately 75% of total RFQ volume. Drawing search times consistently drop from upwards of 30 minutes down to one to two minutes, representing an efficiency improvement exceeding 70% to 96%. This operational stickiness transforms CADDi from an experimental search tool into mission-critical plant infrastructure, accelerating bid velocity and preventing costly component duplication."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-production-evidence"
    title: "Named Customer Proof and Operational Outcomes"
    body: "Publicly documented production deployments provide concrete proof of CADDi's operational viability across North American and Japanese manufacturing sites. At Amerequip Corporation, an American OEM designing and manufacturing custom equipment and hydraulics for global clients such as John Deere, Caterpillar, and Oshkosh Corporation, engineering and quality leaders utilized CADDi Drawer to unify drawings, customer specifications, and ERP records. Amerequip's teams eliminated cumbersome network drive navigation and leveraged keyword and similarity searches to identify identical parts already in inventory, actively avoiding unnecessary purchase orders and duplicate tooling costs. At Neaton Auto Products Manufacturing in Eaton, Ohio, engineers centralized more than 140,000 engineering and quality documents, cutting drawing lookup durations by 40% to 70% and accelerating quality assurance root-cause investigation times by 50%. Across Japan, CADDi serves established industrial corporations including Hitachi, Subaru, and Kawasaki, with reported penetration exceeding half of Japan's top 100 manufacturing enterprises."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Account Retention, Expansion Mechanics, and Concentration Risks"
    body: "Despite remarkable qualitative milestones and customer enthusiasm, evaluating CADDi's commercial durability reveals critical diligence gaps. CADDi currently withholds audited gross revenue retention (GRR), net revenue retention (NRR), and annual churn figures, requiring investors and enterprise partners to rely on top-line growth narratives rather than audited cohort waterfalls. To secure account durability, CADDi recruits dedicated customer success leadership in North America specifically tasked with establishing post-sales playbooks and optimizing NRR targets across complex, multi-stakeholder industrial sales cycles. Furthermore, CADDi faces long-term retention threats from incumbent software giants. Major computer-aided design, product lifecycle management (PLM), and ERP providers—most notably Siemens, SAP, and Dassault Systèmes—possess established vendor relationships across the global manufacturing landscape and can bundle AI-driven drawing search into existing enterprise contracts by 2027. If North American land-and-expand motions stall, CADDi risks seeing customer data teams attempt internal data lakehouse replication rather than renewing proprietary platform subscriptions."
    claimRefs:
      - "CU009"
      - "CU012"
      - "CU013"
