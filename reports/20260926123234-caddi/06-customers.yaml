callouts:
  - calloutType: "insight"
    title: "The Power of High-Frequency Daily Engineering Workflows"
    body: "CADDi's fastest land-and-expand trajectory occurs when software solves acute friction in daily high-frequency tasks—such as finding legacy engineering prints during RFQ quotation or quality defect investigation. At Neaton Auto Products and precision manufacturing clients, cutting search times from 30 minutes to under two minutes created immediate user trust, propelling seat adoption from 30 initial users to 85 active accounts (+183%) and securing 75% of total RFQ volume without heavy top-down IT mandate."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU008"
  - calloutType: "risk"
    title: "Durability Risks in Enterprise Expansion and Information Gaps"
    body: "While CADDi demonstrates strong qualitative case study proof across Tier-1 automotive and machinery makers, quantitative retention data remains heavily guarded. The company does not publicly disclose gross or net revenue retention, logo churn, or customer concentration. Furthermore, major PLM and ERP incumbents such as Siemens and SAP are aggressively integrating native visual similarity and drawing search into their core platforms, creating severe long-term renewal headwinds unless CADDi cements deep, multi-department workflow integrations."
    claimRefs:
      - "CU009"
      - "CU012"
      - "CU013"
