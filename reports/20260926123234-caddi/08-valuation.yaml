chapter:
  number: 8
  title: "Valuation"
  summary: "CADDi secured $114 million in Series D financing at a $1.2 billion post-money valuation in September 2026, more than doubling its March 2025 mark. While proprietary drawing-parsing AI and adoption among over half of Japan's top 100 manufacturers validate the technology, undisclosed ARR and high customer-success service intensity warrant a stretched valuation stance and a disciplined track recommendation."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis and Recommendation Framework"
    body: "CADDi presents a compelling yet complex investment profile at the convergence of industrial manufacturing and enterprise artificial intelligence. The primary investment thesis rests on CADDi's demonstrated ability to overcome what management terms the physical bottleneck: the persistent gap between generative software capabilities and factory-floor execution. Unlike horizontal foundation models that cannot reliably parse complex two-dimensional technical drawings or three-dimensional CAD geometries, CADDi has engineered proprietary domain-specific vision models paired with general-purpose LLMs for textual documentation. This technical differentiation is reinforced by significant enterprise market penetration across Japan, where more than half of the country's top one hundred manufacturing enterprises utilize the platform. However, the investment recommendation is tempered by valuation discipline. Closing a $114 million Series D at a $1.2 billion valuation prices the business as a premier unicorn without public verification of annualized recurring revenue or software gross margins. Consequently, the appropriate institutional stance is Track / Research-More, withholding formal capital commitments until unit economics and commercial traction in Western markets can be independently corroborated."
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
    claimRefs:
      - "CV016"
      - "CV002"
      - "CV003"
      - "CV007"
      - "CV013"
      - "CV014"
      - "CV015"
  - id: "market-opportunity-and-thesis-drivers"
    title: "Pillar Evaluation: Core Thesis and Anti-Thesis"
    body: "Evaluating CADDi requires balancing powerful operational tailwinds against substantial execution vulnerabilities. On the thesis side, the company has successfully evolved from its origins in procurement deduplication through CADDi Drawer into a comprehensive Manufacturing AI Data Platform comprising CADDi Explorer, CADDi Agent, and six workflow products. The backing of top-tier strategic and financial institutions, including Atomico, Woven Capital (Toyota), Coreline Ventures, and Salesforce Ventures, provides substantial commercial credibility and ecosystem access. Conversely, the anti-thesis centers on organizational and market risks. CADDi employs over one hundred customer success professionals, outnumbering its sales team, to facilitate intensive change management within customer facilities. This high service intensity highlights the friction of altering decades-old manufacturing behaviors and threatens to dilute pure software margins into tech-enabled services economics. Furthermore, horizontal foundation model developers or legacy CAD/PLM incumbents like Autodesk, Siemens, or Dassault Systèmes could eventually release competing geometry-reasoning agents, eroding CADDi's technical pricing power."
    tableRefs:
      - "TV002"
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV008"
  - id: "valuation-scenarios-and-financing-context"
    title: "Financing Context and Valuation Scenario Analysis"
    body: "CADDi's capital history illustrates rapid valuation expansion across multiple venture cycles. In March 2025, the company secured a $38 million Series C extension at a $470 million valuation alongside $30 million in bank debt. Just eighteen months later in September 2026, the company agreed to definitive terms for $114 million in Series D capital at a $1.2 billion valuation, raising cumulative equity funding to $234 million. At approximately 5.1 times cumulative equity raised, the valuation reflects high investor confidence in future cash flow generation. Dealroom's venture benchmark places the round in the top tier by capital scale but ranks it around the 38th percentile against quantitative performance metrics, largely reflecting management's refusal to disclose revenue or account counts. Across three-year scenario modeling, the Bull Case projects expansion to a $2.5B to $3.0B valuation driven by successful North American enterprise adoption. The Base Case anticipates stable consolidation between $1.2B and $1.5B anchored in the Japanese enterprise core, while the Bear Case models multiple compression to $500M to $700M if international expansion stalls."
    tableRefs:
      - "TV003"
    claimRefs:
      - "CV016"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
  - id: "exit-readiness-and-diligence-path"
    title: "Exit Readiness, Thesis-Break Triggers, and Diligence Asks"
    body: "With global headcount reaching approximately 900 employees and dual operational headquarters established in Chicago and Tokyo, CADDi is structurally preparing for long-term liquidity via initial public offering or strategic acquisition. A public listing on the Tokyo Stock Exchange or a dual-listing in the United States represents the most plausible liquidity pathway, supported by major Japanese financial backers like Globis and JPS Growth. Strategic acquisition by enterprise software giants such as Salesforce, enterprise industrial conglomerates like Toyota, or engineering software platforms also remains viable. Nevertheless, potential investors must monitor specific thesis-break triggers before entry: any down-round or flat extension below $1.2 billion, executive departures among co-founders Yushiro Kato and Aki Kobashi, or stagnation in North American customer acquisitions. Confirmatory diligence must prioritize unredacted financial audits, customer cohort retention bridges, and detailed cap-table liquidation preferences across preference classes."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV013"
      - "CV014"
