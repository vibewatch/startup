      - number: '7.5'
        title: Financial Profile, Debt Commitments, and Monitoring Triggers
        blocks:
          - type: paragraph
            body: >-
              CADDi's capitalization history reflects substantial capital consumption to establish its software
              foundation, having raised $234 million in equity funding alongside a $30 million long-term bank debt
              facility from Mizuho and syndication partners secured during its March 2025 Series C extension. While
              CADDi completed a $114 million Series D round in September 2026 valuing the entity at $1.2 billion, the
              company does not publicly disclose standalone software Annual Recurring Revenue (ARR), gross churn, or Net
              Revenue Retention (NRR). This metric opacity leaves investors reliant on top-line expansion narratives
              rather than audited SaaS unit economics. For institutional investors, core thesis-break triggers include:
              failure of North American enterprise contracts to renew at historical Japanese net retention levels,
              aggressive PLM incumbent bundling that slows new logo velocity below 40% annually, or operational debt
              service stress if enterprise software cash flows fail to outpace high-cost U.S. commercial expansion burn.
            claimRefs:
