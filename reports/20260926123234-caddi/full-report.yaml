  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Profiles
        blocks:
          - type: paragraph
            body: >-
              CADDi targets discrete manufacturing enterprises operating in complex, document-intensive industrial
              verticals where engineering designs, procurement histories, and quality records have accumulated in
              disparate silos over decades. The core buyer personas consist of Vice Presidents of Design Engineering,
              Directors of Procurement, and Heads of Quality Control at Tier-1 automotive suppliers, industrial
              equipment original equipment manufacturers (OEMs), and high-precision contract fabricators. These
              organizations typically manage tens of thousands to over one million technical drawings, CAD files, and
              legacy bills of materials across ERP systems like SAP or Infor LX alongside legacy network file servers.
              CADDi delivers value across this customer base through two interconnected channels: its core software
              application, CADDi Drawer (evolving to CADDi Explorer and domain workflow tools), and CADDi Manufacturing,
              an asset-light supply chain procurement service that guarantees component quality, delivery, and pricing.
              While the broader enterprise automation market also encompasses workflow solutions targeting back-office
              process mining, CADDi's primary defensibility stems from its proprietary geometric and semantic
              understanding of heavy industrial manufacturing assets.
            claimRefs:
              - CU001
              - CU002
