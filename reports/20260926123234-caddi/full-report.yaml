          phase: Evaluation & Proof of Concept
          description: >-
            Engineering and estimating teams struggle with fragmented prints, shared drive sprawl, and mismatched
            customer part numbers.
          touchpoints: Sales engineering RFQ review, pilot drawing upload, initial similarity search benchmarking
        - label: Departmental Point Deployment
          phase: Onboarding & Initial Launch
          description: >-
            CADDi Drawer is deployed to 20-30 core design engineers or tooling estimators to ingest 100k+ historical
            prints.
          touchpoints: Single-department onboarding, ERP/PLM metadata ingestion, weekly customer success check-ins
        - label: Immediate Operational Payoff
          phase: Early Value Realization
          description: >-
            Users achieve 40% to 70% drawing search time reductions and drop quoting turnaround from 30 minutes to under
            2 minutes.
          touchpoints: Daily RFQ workflows, engineering peer referrals, measurable search time savings
        - label: Cross-Functional Organic Expansion
          phase: Seat & Persona Expansion
          description: >-
