      - number: '7.2'
        title: Regulatory Compliance, ITAR Controls, and Legal Mandates
        blocks:
          - type: paragraph
            body: >-
              As CADDi accelerates adoption among tier-one automotive, heavy machinery, and aerospace manufacturers,
              regulatory exposure becomes a critical determinant of enterprise sales velocity. In August 2026, CADDi
              introduced ITAR-compliant capabilities within its CADDi Drawer software platform to support aerospace and
              defense contractors handling technical data regulated by the U.S. Department of State Directorate of
              Defense Trade Controls (DDTC). This deployment necessitates rigorous U.S. data residency,
              cryptographically enforced access controls, and compartmentalized cloud environments to prevent
              unauthorized foreign national access. Furthermore, CADDi's multinational footprint—spanning operations in
              Japan, the United States, Vietnam, and Thailand, with customers in more than 20 countries—exposes the
              business to divergent cross-border data transfer rules, labor regulations, and export restrictions.
              Compliance failures in defense procurement or unauthorized access to proprietary defense CAD designs could
              trigger severe statutory penalties, contractor debarment, and catastrophic reputational damage.
            claimRefs:
              - CR001
