      - number: '7.3'
        title: Operational Reliability, Model Accuracy, and Workforce Scaling
        blocks:
          - type: paragraph
            body: >-
              CADDi's technical value proposition relies on its proprietary AI model, optical character recognition
              (OCR), and geometric similarity search algorithms to ingest and structure engineering drawings. However,
              discrete manufacturing clients frequently operate with legacy IT systems and archived engineering
              repositories created 30 to 40 years ago, containing non-standard drafting symbols, manual annotations, and
              low-resolution scans. Inaccurate dimensional extraction or misclassified geometric tolerances can
              propagate downstream errors into parts procurement, supplier bidding, and assembly lines, creating
              customer dispute liabilities. Operationally, CADDi faces organizational scaling friction stemming from
              geographic concentration: approximately 77% of its profiled global team remains based in Japan, while its
              primary growth focus centers on the United States. Expanding enterprise sales in Chicago requires
              specialized bilingual growth leaders capable of coordinating complex GTM motions between Japanese
              engineering leadership and U.S. manufacturing executives amidst tightening technical talent markets.
