  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for CADDi sits at the intersection of discrete manufacturing engineering data
              utilization, computer-aided design (CAD) archive management, and procurement value analysis/value
              engineering (VAVE). Rather than competing as a core 3D CAD design authoring package or replacing
              enterprise resource planning (ERP) platforms, the platform operates as an overlay intelligence layer. It
              structures and normalizes historical 2D drawings, 3D models, bills of materials (BOMs), and purchase
              histories that are currently fragmented across disparate corporate repositories. Included spend
              encompasses software licenses for geometric similarity search, technical drawing optical character
              recognition (OCR), automated request for quotation (RFQ) component costing, and parts reuse discovery
              across operating divisions. Spend explicitly excluded from this boundary comprises physical contract
              manufacturing procurement costs, generative 3D CAD modeling design software, and generalized enterprise
              document storage suites. In typical manufacturing plants, status-quo substitutes consist of manual folder
              searches, legacy product data management (PDM) or product lifecycle management (PLM) archives that lack
              cross-facility geometric indexing, and institutional memory stored exclusively in the minds of veteran
              engineers. Consequently, discrete manufacturers routinely procure near-identical components from multiple
              suppliers at wildly varying unit prices simply because procurement and engineering personnel cannot easily
              locate what has already been designed and approved.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
      - number: '2.2'
        title: 'Market Sizing Lenses: Drawing Volumes, Account Tiers, and SaaS ARR'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable market requires examining discrete manufacturing assets across multiple
              empirical lenses rather than relying on a single broad top-down projection. At the enterprise tier,
              discrete equipment manufacturers maintain massive drawing estates; for example, single engineered-to-order
              packaging machinery OEMs manage between 30,000 and 45,000 configuration options, resulting in historical
              archives exceeding 750,000 engineering drawings. Across industrial projects, a standard single-plant
              optimization deployment regularly ingests more than 10,000 technical drawings to establish component
              baselines. From a commercial software perspective, CADDi transitioned from its initial manufacturing
              marketplace network model in 2022 to an enterprise SaaS platform, reaching $70 million in annual recurring
              revenue (ARR) across more than 180 enterprise customers in Japan within two years. Customer penetration
              data reveals that over 50% of Japan's 100 largest discrete manufacturers have deployed the software across
              operating divisions. However, an independent third-party market sizing specifically isolating AI drawing
              data intelligence from the broader $20B+ PLM and CAD software market remains an open diligence gap.
              Furthermore, global supply chain volatility and evolving tariff regimes are intensifying demand across
              international manufacturing hubs, compelling multinational OEMs to quantify drawing-level supply chain
              exposures across facilities in the Americas, Europe, and Asia.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Enterprise purchasing of manufacturing data intelligence software is driven by a clear multi-persona
              buying committee within discrete manufacturing corporations. The primary economic buyers and budget owners
              are Vice Presidents of Procurement, Heads of Engineering, and Chief Information Officers (CIOs) who seek
              to stem margin erosion and eliminate duplicate part proliferations. Day-to-day tactical users diverge
              across two operational functions: mechanical design engineers seeking to identify and reuse existing
              components during the drafting phase, and quotation specialists tasked with evaluating incoming customer
              RFQs against historical cost and manufacturing feasibility models. In engineered-to-order (ETO) and
              configured-to-order (CTO) machinery verticals, adoption is triggered by acute competitive pressures to
              slash quotation turnaround cycles and capture high-margin aftermarket replacement part orders. In
              precision tooling and advanced materials manufacturing, quotation turnaround speed directly dictates
              customer win rates, prompting engineering leaders to replace multi-folder manual searches with sub-second
              geometric similarity queries that surface existing tooling and estimation models.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Drivers, Implementation Bottlenecks, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption velocity is strongly accelerated by structural macro tailwinds across the industrial sector.
              Foremost among these is an acute engineering demographic cliff: experienced mechanical engineers and
              machinists are retiring en masse, taking decades of tacit institutional knowledge with them and leaving
              manufacturers vulnerable to repetitive design errors. In addition, intensifying supply chain friction and
              cross-border tariffs require sourcing executives to quickly renegotiate component supplier terms based on
              granular part-level cost insights. Conversely, material adoption constraints center on organizational
              change management and software integration depth. Altering legacy engineering habits—where drafting new
              components is often perceived as faster than searching fragmented archives—demands sustained corporate
              change management programs that vendor-led customer success teams must actively shepherd. On a technical
              level, enterprise user reviews repeatedly highlight a lack of robust, bidirectional API integrations with
              internal legacy databases and custom ERP workflows, forcing customers to rely on fragile manual
              workarounds. Finally, verifiable contract renewal rates and net revenue retention (NRR) outside CADDi's
              core Japanese customer base remain undisclosed, representing a material diligence gap as the platform
              expands into Western markets.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Tacit Knowledge Crisis as an Enterprise Demand Catalyst
            body: >-
              The retirement of senior manufacturing engineers combined with persistent manufacturing labor shortages
              creates an acute operational vulnerability for industrial OEMs. Because decades of design rationale and
              part sourcing decisions remain locked in legacy 2D drawings and retiring workers' memory, enterprises
              adopt CADDi to transform unstructured engineering archives into reusable, searchable digital assets.
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
          - type: callout
            title: Integration Workarounds and Change Management Constraints
            body: >-
              Enterprise adoption is constrained by two critical headwinds: organizational inertia requiring design and
              sourcing teams to alter established habits, and the current absence of native bidirectional API
              integrations with internal legacy systems. When software forces engineers into manual data bridges between
              CADDi and internal tools, platform ROI and seat expansion velocity face friction.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Categories
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for CADDi spans direct manufacturing intelligence providers, established Product
              Lifecycle Management (PLM) incumbents, horizontal cloud storage tools, and entrenched manual workflows.
              Third-party software aggregators such as Krowdbase classify broad document management systems like
              Microsoft SharePoint, Box, and ONLYOFFICE Docs as notable alternatives to CADDi Drawer. However,
              horizontal storage platforms treat engineering drawings merely as unindexed binary blobs, lacking native
              geometric computer vision, part dimension parsing, and supplier cost linkages. In response, CADDi has
              raised $234 million in total funding—most recently securing a $114 million Series D round at a $1.2
              billion valuation in September 2026—to scale its specialized data platform across global manufacturing
              hubs. To consolidate its enterprise position, the company is actively refining its brand architecture and
              messaging to educate procurement leaders on why generic office software cannot resolve
              multi-million-dollar supply chain inefficiencies.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
