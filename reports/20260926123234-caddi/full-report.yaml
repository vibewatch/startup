  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              CADDi presents a compelling yet complex investment profile at the convergence of industrial manufacturing
              and enterprise artificial intelligence. The primary investment thesis rests on CADDi's demonstrated
              ability to overcome what management terms the physical bottleneck: the persistent gap between generative
              software capabilities and factory-floor execution. Unlike horizontal foundation models that cannot
              reliably parse complex two-dimensional technical drawings or three-dimensional CAD geometries, CADDi has
              engineered proprietary domain-specific vision models paired with general-purpose LLMs for textual
              documentation. This technical differentiation is reinforced by significant enterprise market penetration
              across Japan, where more than half of the country's top one hundred manufacturing enterprises utilize the
              platform. However, the investment recommendation is tempered by valuation discipline. Closing a $114
              million Series D at a $1.2 billion valuation prices the business as a premier unicorn without public
              verification of annualized recurring revenue or software gross margins. Consequently, the appropriate
              institutional stance is Track / Research-More, withholding formal capital commitments until unit economics
              and commercial traction in Western markets can be independently corroborated.
            claimRefs:
              - CV016
              - CV002
              - CV003
              - CV007
              - CV013
