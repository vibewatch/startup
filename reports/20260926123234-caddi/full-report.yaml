            title: 'Thesis-Break Vulnerability: Incumbent PLM Bundling Without Institutional Lock-In'
            body: >-
              Unlike pharmaceutical compliance software where regulatory mandates force document retention on dedicated
              platforms, CADDi relies entirely on workflow-accumulated switching costs; if major PLM vendors bundle
              native AI similarity search into core enterprise agreements, CADDi faces acute displacement risk unless it
              rapidly deploys its expanded application suite.
