      - number: '4.2'
        title: Go-To-Market Economics and Service-Delivery Cost Burden
        blocks:
          - type: paragraph
            body: >-
              CADDi's commercial expansion strategy relies on a high-touch enterprise sales and deployment model that
              differs substantially from low-friction enterprise software. Because industrial manufacturers face
              deep-seated organizational inertia and complex legacy drawing repositories, customer adoption requires
              hands-on change management. Consequently, CADDi maintains more than 100 customer success personnel,
              outnumbering its pure sales force, and has aggressively expanded hiring of forward-deployed engineers to
              operationalize deployments on-site. Total corporate headcount reached approximately 900 employees in
              September 2026, marking a 50% expansion from 600 staffers in early 2025. In the United States, CADDi's
              dual headquarters in Chicago is actively recruiting senior go-to-market leaders with base compensation
              packages ranging from $100,000 to $170,000 plus performance bonuses. This labor-intensive delivery
              structure imposes substantial ongoing payroll obligations, depressing blended gross margins and
              introducing operating leverage risks if software annual recurring revenue growth lags headcount expansion.
            claimRefs:
              - CI007
              - CI008
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
