              - CV012
      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              With global headcount reaching approximately 900 employees and dual operational headquarters established
              in Chicago and Tokyo, CADDi is structurally preparing for long-term liquidity via initial public offering
              or strategic acquisition. A public listing on the Tokyo Stock Exchange or a dual-listing in the United
              States represents the most plausible liquidity pathway, supported by major Japanese financial backers like
              Globis and JPS Growth. Strategic acquisition by enterprise software giants such as Salesforce, enterprise
              industrial conglomerates like Toyota, or engineering software platforms also remains viable. Nevertheless,
              potential investors must monitor specific thesis-break triggers before entry: any down-round or flat
              extension below $1.2 billion, executive departures among co-founders Yushiro Kato and Aki Kobashi, or
              stagnation in North American customer acquisitions. Confirmatory diligence must prioritize unredacted
              financial audits, customer cohort retention bridges, and detailed cap-table liquidation preferences across
              preference classes.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Private Metric Verification'
            body: >-
              CADDi demonstrates notable vertical technical defensibility and elite corporate backing, but the $1.2
              billion valuation prices in sustained hypergrowth without audited public verification of ARR scale, net
              retention, or gross margins. Diligence teams should treat CADDi as a premier tracking asset while
              demanding unit-economic transparency before capital commitment.
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV002
              - CV007
          - type: callout
            title: Operational Overhead and Change Management Friction
            body: >-
              With customer success staff exceeding sales and more than 100 dedicated implementation personnel, CADDi
              operates an engineering-heavy delivery model necessary to overcome factory-floor adoption resistance.
              Prospective investors must evaluate whether this service-intensive posture dilutes software gross margins
              as international expansion accelerates.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV014
