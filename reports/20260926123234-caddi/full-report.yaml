            generation.
          touchpoints: Quality assurance sheet linking, supplier cost comparison, user count expanding by 150%+ to 80+ seats
        - label: Workflow Integration & Lock-In
          phase: Enterprise Standardization
          description: CADDi Quote and workflow products become standard operating infrastructure, handling over 75% of RFQ volume.
          touchpoints: CADDi Quote module activation, supplier quote negotiation, multi-plant software rollout
        - label: Commercial Governance & Renewal
          phase: Account Durability & Scale
