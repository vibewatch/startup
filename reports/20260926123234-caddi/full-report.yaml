      - number: '6.3'
        title: Named Customer Proof and Operational Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly documented production deployments provide concrete proof of CADDi's operational viability across
              North American and Japanese manufacturing sites. At Amerequip Corporation, an American OEM designing and
              manufacturing custom equipment and hydraulics for global clients such as John Deere, Caterpillar, and
              Oshkosh Corporation, engineering and quality leaders utilized CADDi Drawer to unify drawings, customer
              specifications, and ERP records. Amerequip's teams eliminated cumbersome network drive navigation and
              leveraged keyword and similarity searches to identify identical parts already in inventory, actively
              avoiding unnecessary purchase orders and duplicate tooling costs. At Neaton Auto Products Manufacturing in
              Eaton, Ohio, engineers centralized more than 140,000 engineering and quality documents, cutting drawing
              lookup durations by 40% to 70% and accelerating quality assurance root-cause investigation times by 50%.
              Across Japan, CADDi serves established industrial corporations including Hitachi, Subaru, and Kawasaki,
              with reported penetration exceeding half of Japan's top 100 manufacturing enterprises.
