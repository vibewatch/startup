        title: Exhibits
        blocks:
          - type: callout
            title: Transforming Static Engineering Drawings into Dynamic Knowledge Assets
            body: >-
              CADDi's core architectural contribution is treating 2D engineering drawings as structured data rather than
              static visual artifacts. By combining deep-learning OCR with patented shape similarity algorithms, the
              platform bridges historical paper archives and modern enterprise resource planning systems.
            calloutType: insight
