              - CI010
              - CI012
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Debt Obligations
        blocks:
          - type: paragraph
            body: >-
              Following its $114 million Series D financing round in September 2026, CADDi has raised a cumulative $234
              million in equity capital. The latest financing values the business at $1.2 billion post-money,
              representing a 2.5x multiple expansion over its $470 million valuation in March 2025. In addition to
              equity financing, CADDi secured $30 million in long-term debt facilities from Mizuho Bank and other
              leading financial institutions during its Series C extension. The capital influx provides substantial
              balance-sheet liquidity to fund four designated operational priorities: proprietary AI model development
              tailored to industrial CAD geometry, platform scaling, North American geographic expansion, and high-cost
              technical recruitment. While this funding gives CADDi an estimated runway exceeding 24 months under
              current headcount levels, the business remains structurally dependent on external capital markets or
              significant gross margin expansion until recurring software revenue covers corporate operating burn.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
      - number: '4.4'
        title: Financial Verdict, Revenue Quality, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence standpoint, CADDi represents an ambitious but financially opaque
              market-expansion asset. The company's ability to command a $1.2 billion valuation from premier global and
              strategic investors, including Toyota's Woven Capital and Salesforce Ventures, reflects strong market
              validation for vertical AI in industrial data infrastructure. However, independent market observers and
              secondary trackers note that CADDi's valuation multiple rests entirely on uncorroborated growth narratives
              rather than auditable financial fundamentals. Because management withholds audited revenue run rates, net
              revenue retention rates, and gross margin profiles, investors cannot ascertain whether the business is
              scaling high-margin recurring software or subsidizing revenue through low-margin parts brokerage and
              professional services. Resolving these private-metric gaps through confidential disclosures is a
              prerequisite for underwriting CADDi's long-term capital efficiency.
            claimRefs:
              - CI004
              - CI010
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue Opacity and Valuation Multiples
            body: >-
              While CADDi achieved a $1.2 billion valuation in its Series D, management continues to withhold verified
              software revenue and customer counts. Underwriters must treat growth claims as unverified narratives until
              audited financial statements and recurring subscription retention metrics are provided.
            calloutType: risk
            claimRefs:
              - CI004
              - CI010
          - type: callout
            title: Services-Heavy Deployment Profile
            body: >-
              With over 100 customer success personnel and forward-deployed engineers across a 900-person organization,
              CADDi's operational model resembles high-touch enterprise deployment rather than frictionless SaaS. This
              delivery model risks depressing blended gross margins and lengthening payback periods.
            calloutType: insight
            claimRefs:
              - CI007
              - CI008
