            title: Durability Risks in Enterprise Expansion and Information Gaps
            body: >-
              While CADDi demonstrates strong qualitative case study proof across Tier-1 automotive and machinery
              makers, quantitative retention data remains heavily guarded. The company does not publicly disclose gross
              or net revenue retention, logo churn, or customer concentration. Furthermore, major PLM and ERP incumbents
              such as Siemens and SAP are aggressively integrating native visual similarity and drawing search into
              their core platforms, creating severe long-term renewal headwinds unless CADDi cements deep,
              multi-department workflow integrations.
            calloutType: risk
