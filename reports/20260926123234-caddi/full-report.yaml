      - number: '6.4'
        title: Account Retention, Expansion Mechanics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite remarkable qualitative milestones and customer enthusiasm, evaluating CADDi's commercial
              durability reveals critical diligence gaps. CADDi currently withholds audited gross revenue retention
              (GRR), net revenue retention (NRR), and annual churn figures, requiring investors and enterprise partners
              to rely on top-line growth narratives rather than audited cohort waterfalls. To secure account durability,
              CADDi recruits dedicated customer success leadership in North America specifically tasked with
              establishing post-sales playbooks and optimizing NRR targets across complex, multi-stakeholder industrial
              sales cycles. Furthermore, CADDi faces long-term retention threats from incumbent software giants. Major
              computer-aided design, product lifecycle management (PLM), and ERP providers—most notably Siemens, SAP,
              and Dassault Systèmes—possess established vendor relationships across the global manufacturing landscape
              and can bundle AI-driven drawing search into existing enterprise contracts by 2027. If North American
              land-and-expand motions stall, CADDi risks seeing customer data teams attempt internal data lakehouse
              replication rather than renewing proprietary platform subscriptions.
            claimRefs:
              - CU009
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Power of High-Frequency Daily Engineering Workflows
            body: >-
              CADDi's fastest land-and-expand trajectory occurs when software solves acute friction in daily
              high-frequency tasks—such as finding legacy engineering prints during RFQ quotation or quality defect
              investigation. At Neaton Auto Products and precision manufacturing clients, cutting search times from 30
              minutes to under two minutes created immediate user trust, propelling seat adoption from 30 initial users
              to 85 active accounts (+183%) and securing 75% of total RFQ volume without heavy top-down IT mandate.
