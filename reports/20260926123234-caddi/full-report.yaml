      - number: '8.3'
        title: Financing Context and Valuation Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              CADDi's capital history illustrates rapid valuation expansion across multiple venture cycles. In March
              2025, the company secured a $38 million Series C extension at a $470 million valuation alongside $30
              million in bank debt. Just eighteen months later in September 2026, the company agreed to definitive terms
              for $114 million in Series D capital at a $1.2 billion valuation, raising cumulative equity funding to
              $234 million. At approximately 5.1 times cumulative equity raised, the valuation reflects high investor
              confidence in future cash flow generation. Dealroom's venture benchmark places the round in the top tier
              by capital scale but ranks it around the 38th percentile against quantitative performance metrics, largely
              reflecting management's refusal to disclose revenue or account counts. Across three-year scenario
              modeling, the Bull Case projects expansion to a $2.5B to $3.0B valuation driven by successful North
              American enterprise adoption. The Base Case anticipates stable consolidation between $1.2B and $1.5B
              anchored in the Japanese enterprise core, while the Bear Case models multiple compression to $500M to
              $700M if international expansion stalls.
            claimRefs:
              - CV016
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
