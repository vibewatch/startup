  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis
      - Anti-Thesis
      - Thesis-Break / View-Change Trigger
    rows:
      - - Proprietary Data Moat
        - >-
          Proprietary AI models parse 2D engineering drawings and 3D CAD files where general-purpose LLMs fail, creating
          technical defensibility.
        - >-
          Horizontal foundation models could develop native multimodal geometry reasoning or CAD software incumbents
          could close the gap.
        - Foundation LLM parity on complex multi-view engineering drawings without vertical fine-tuning.
      - - Enterprise Expansion
        - >-
          Platform adoption in over half of Japan top 100 manufacturers establishes enterprise validation and supply
          chain network effects.
        - >-
          Expansion beyond Japan faces entrenched legacy ERP/PLM integrations, diverse supplier standards, and complex
          local change management.
        - Failure to scale North American revenue or excessive sales cycles exceeding 12 months.
      - - Product Platformization
        - >-
          Transition from point solution (CADDi Drawer/Explorer) to multi-workflow data platform and autonomous CADDi
          Agent expands ACV and TAM.
        - >-
          High customer success headcount (100+ CS staff exceeding sales) signals high service intensity and potential
          SaaS margin drag.
        - Gross margins falling below 65% due to forward-deployed engineering and bespoke integration costs.
      - - Capitalization & Syndicate
        - >-
          Backed by tier-1 global investors including Atomico, Woven Capital (Toyota), Coreline, and Salesforce
          Ventures, providing $234M total funding.
        - >-
          Rapid valuation doubling to $1.2B in 18 months without disclosed revenue creates downside multiple compression
          risk in a tightening venture environment.
        - Down-round financing or down-trending secondary transaction values below $1.0B.
    notes: Key investment drivers and corresponding downside vulnerabilities evaluated against primary Diligence findings.
