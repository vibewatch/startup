      - number: '3.2'
        title: Technical Differentiation and Drawing Intelligence
        blocks:
          - type: paragraph
            body: >-
              CADDi's core architectural differentiation resides in its patented similarity search engine, which
              transforms unstructured legacy drawing archives into relational enterprise assets. For typical industrial
              customers managing projects with more than 10,000 individual technical drawings, historical procurement
              data is frequently trapped across disparate PDF folders and on-premise repositories. While traditional PLM
              systems like Siemens Teamcenter and PTC Windchill govern CAD revision lifecycles, they typically isolate
              technical specifications within engineering departments. CADDi extracts geometric contours, dimensional
              tolerances, and textual title blocks from 2D drawings to enable instant similarity searches that expose
              historical pricing inconsistencies across suppliers. In late 2026, CADDi unveiled CADDi Explorer and the
              autonomous CADDi Agent to expand beyond isolated similarity retrieval into automated cross-departmental
              decision execution.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: Pricing Models, Packaging, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Evaluating commercial software trade-offs requires comparing CADDi's enterprise packaging against
              incumbent and substitute pricing structures. Third-party reviews from Stork.AI note that automated
              back-office tools often deploy freemium models for single users alongside custom quotes for team
              collaboration. CADDi Drawer and Explorer are marketed as custom enterprise annual subscriptions tailored
              to drawing archive volumes and corporate user scale. Unlike generic document tools like SharePoint, which
              carry transparent per-seat monthly SaaS fees, CADDi's enterprise pricing and multi-year maintenance
              commitments remain privately negotiated. This commercial opacity requires enterprise procurement teams to
              perform rigorous upfront ROI modeling, justifying contract expenditure through quantified supplier
              consolidation and reduced redundant engineering drafting hours.
            claimRefs:
              - CP002
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP010
              - CP014
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Incumbent Response
        blocks:
          - type: paragraph
            body: >-
              CADDi's long-term competitive durability depends on data network effects and integration lock-in across
              enterprise value chains. Industrial conglomerates including Hitachi, Kawasaki, Subaru, and Tokyo Electron
              have embedded CADDi into core sourcing operations, creating significant switching costs once millions of
              legacy parts and vendor quotes are mapped into its semantic data layer. Because integrating legacy ERP
              databases and historical drawings requires substantial organizational lift, customers are disinclined to
              multi-home across competing platforms. Nonetheless, CADDi faces persistent commoditization risks if major
              PLM incumbents develop native AI similarity search or if internal engineering teams build lightweight
              computer vision scripts. Sustaining differentiation requires CADDi to continuously enrich its semantic
              layer with real-time supplier execution telemetry rather than relying solely on static drawing retrieval.
            claimRefs:
              - CP006
              - CP009
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Incumbent PLM Feature Expansion
            body: >-
              Established engineering software incumbents such as Siemens and PTC maintain deeply entrenched enterprise
              relationships and could introduce native geometric similarity search to close differentiation gaps.
            calloutType: risk
            claimRefs:
              - CP006
              - CP011
          - type: callout
            title: Drawing Intelligence as Procurement Insertion Point
            body: >-
              By solving drawing similarity search across historical archives of 10,000+ technical drawings per project,
              CADDi establishes an operational beachhead that connects engineering specifications directly to
              procurement cost optimization.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              CADDi monetizes through a multi-tier commercial model that combines annual software subscriptions for its
              Manufacturing AI Data Platform with transaction fees generated by physical procurement services. The core
              software suite, anchored by CADDi Explorer (formerly CADDi Drawer) and newly launched specialized workflow
              modules such as CADDi Quote and Design Review, is sold on recurring enterprise contracts. In parallel,
              CADDi continues to operate its legacy supply-chain execution business, where it captures margin by
              brokering custom parts procurement across its manufacturing network. While management highlights rapid
              adoption among Japan's largest manufacturers and claims that top-line sales are more than doubling year
              over year, the company refuses to disclose absolute revenue, ARR, or software-versus-services revenue mix.
              Official list pricing remains entirely bespoke and undisclosed, with realized deal sizes negotiated based
              on drawing database volume, seat licensing, and enterprise integration scope. Demonstrating quantifiable
              procurement savings, such as an industrial machinery client reducing parts costs by 30%, remains central
              to CADDi's enterprise value proposition.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
