            title: Strategic Transition from Procurement Marketplace to Pure-Play AI Platform
            body: >-
              CADDi's decision in July 2024 to discontinue its physical custom-parts supply business and focus entirely
              on software eliminated working capital intensity and supply chain inventory risk, successfully
              repositioning the company as a pure-play enterprise AI data platform.
