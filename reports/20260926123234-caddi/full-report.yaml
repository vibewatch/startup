      - number: '5.3'
        title: Four-Layer Architecture, Core Tech Stack, and Deployment Model
        blocks:
          - type: paragraph
            body: >-
              The CADDi platform operates across four integrated functional tiers: an Ingestion and Analysis Data Layer,
              a Context and Relationships Semantic Layer, a Discovery & Agents Intelligence Layer, and an Execution
              Workflow Layer. The underlying engineering implementation combines modern web application frameworks and
              systems programming languages, with solutions architects and systems engineers authoring production
              pipelines in Python, TypeScript, and Rust alongside SQL orchestration. The infrastructure is deployed as
              containerized Docker workloads managed via continuous integration and deployment pipelines across major
              commercial cloud providers, including Amazon Web Services, Google Cloud Platform, and Microsoft Azure. To
              support enterprise customers operating in defense-adjacent industrial sectors, CADDi maintains strict
              security controls, including International Traffic in Arms Regulations (ITAR) personnel eligibility
              requirements for United States solutions delivery. The engineering organization incorporates structured
              technical architecture assessments into its talent acquisition process, evaluating candidate trade-offs
              across database schemas, cloud infrastructure, and data pipeline reliability to support high-throughput
              industrial analytics.
