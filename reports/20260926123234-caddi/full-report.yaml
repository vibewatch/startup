      - number: '6.2'
        title: Adoption Trajectory and Usage Acceleration
        blocks:
          - type: paragraph
            body: >-
              Adoption of CADDi's data platform typically initiates with acute departmental pain points—specifically the
              substantial engineering labor lost to manually searching for legacy drawings, verifying part revisions,
              and matching customer RFQ requests against historical quotations. Once deployed, usage exhibits rapid
              bottom-up expansion as daily time savings become evident across adjacent plant operations. At Tier-1
              automotive supplier Neaton Auto Products Manufacturing, initial deployment began with 30 users and
              organically scaled by 183% to reach 85 active accounts within weeks as quality control and procurement
              teams integrated the platform into their daily routines. Similarly, among high-precision metal and plastic
              fabricators, tooling estimators have integrated CADDi into approximately 75% of total RFQ volume. Drawing
              search times consistently drop from upwards of 30 minutes down to one to two minutes, representing an
              efficiency improvement exceeding 70% to 96%. This operational stickiness transforms CADDi from an
              experimental search tool into mission-critical plant infrastructure, accelerating bid velocity and
              preventing costly component duplication.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
