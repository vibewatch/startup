  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Platform Evolution
        blocks:
          - type: paragraph
            body: >-
              CADDi structures its commercial offerings around a vertically integrated software suite designed to unlock
              decades of tacit engineering knowledge embedded in manufacturing drawings and bills of materials. The
              company's flagship product, CADDi Drawer, originally evolved from internal operational software built to
              support its physical parts manufacturing business, where engineering teams struggled to navigate
              fragmented drawing servers and retiring workforce expertise. Rather than functioning as a generic document
              repository, the application provides an intelligent search environment that indexes mechanical drawings,
              assemblies, and cross-referenced part numbers. In August 2026, CADDi unveiled its next-generation platform
              architecture, introducing CADDi Explorer as the successor discovery engine to Drawer, alongside CADDi
              Agent, an autonomous artificial intelligence agent that evaluates manufacturing data and executes
              operational decisions within customer operating constraints. The platform is further augmented by six
              domain-specific Workflow Products tailored to distinct functions across design engineering, procurement,
              and quality management. However, product management and engineering teams face significant complexity in
              standardizing software workflows across heterogeneous industrial environments, where drawing standards,
              CAD formats, and user personas vary widely.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
      - number: '5.2'
        title: Manufacturing Workflows, Design Reuse, and Cost Optimization
        blocks:
          - type: paragraph
            body: >-
              Industrial manufacturing enterprises deploy CADDi to resolve critical data bottlenecks across design for
              manufacturability (DFM), procurement sourcing, and quality assurance workflows. In typical high-mix
              discrete manufacturing environments, finding an existing component or verifying engineering specifications
              requires multi-step manual navigation across disconnected enterprise resource planning (ERP) databases,
              shared network folders, and physical blueprint cabinets. CADDi resolves this friction by deploying optical
              character recognition (OCR) capable of extracting text and annotations from legacy 2D blueprints, scanned
              PDFs, and handwritten notes, paired with patented geometric similarity algorithms that retrieve past parts
              based on shape. By surfacing identical or functionally interchangeable components across historical
              archives, the platform enables engineers to front-load manufacturability reviews and avoid duplicate
              tooling. In procurement, buyers leverage geometric clustering to identify cost discrepancies across
              similar components, facilitating Value Analysis/Value Engineering (VAVE) and supplier negotiations.
              Nevertheless, workflow efficiency remains tightly bounded by initial data quality; if ingested drawing
              libraries contain severe scan degradation, labeling inconsistencies, or erroneous dimensions, these
              defects propagate directly into downstream recommendations.
