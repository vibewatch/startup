      - number: '8.2'
        title: 'Pillar Evaluation: Core Thesis and Anti-Thesis'
        blocks:
          - type: paragraph
            body: >-
              Evaluating CADDi requires balancing powerful operational tailwinds against substantial execution
              vulnerabilities. On the thesis side, the company has successfully evolved from its origins in procurement
              deduplication through CADDi Drawer into a comprehensive Manufacturing AI Data Platform comprising CADDi
              Explorer, CADDi Agent, and six workflow products. The backing of top-tier strategic and financial
              institutions, including Atomico, Woven Capital (Toyota), Coreline Ventures, and Salesforce Ventures,
              provides substantial commercial credibility and ecosystem access. Conversely, the anti-thesis centers on
              organizational and market risks. CADDi employs over one hundred customer success professionals,
              outnumbering its sales team, to facilitate intensive change management within customer facilities. This
              high service intensity highlights the friction of altering decades-old manufacturing behaviors and
              threatens to dilute pure software margins into tech-enabled services economics. Furthermore, horizontal
              foundation model developers or legacy CAD/PLM incumbents like Autodesk, Siemens, or Dassault Systèmes
              could eventually release competing geometry-reasoning agents, eroding CADDi's technical pricing power.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
