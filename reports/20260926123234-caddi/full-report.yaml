      - number: '5.4'
        title: Technical Differentiation, Compliance Controls, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              CADDi's primary technological moat rests on its domain-specific AI models tailored to mechanical drawings,
              where general-purpose large language models and horizontal search engines fail to interpret orthographic
              projections, geometric dimensioning, and tolerance callouts. The company's patented similarity search
              technology allows engineers to identify relevant historical components from rough sketches or 2D outlines
              without requiring clean CAD models or pre-existing metadata tags. On the regulatory and compliance front,
              CADDi's adherence to ITAR workforce screening protocols establishes a defensible procurement qualification
              for major North American original equipment manufacturers. However, technical diligence reveals notable
              operational risks: the platform lacks publicly verified, third-party audited benchmarks regarding OCR
              error rates on low-quality drawings, vector index query latency at multi-million drawing scale, and
              cross-system synchronization latency with legacy on-premise ERP databases. Enterprise deployments also
              encounter substantial onboarding friction, requiring dedicated solutions architects and intensive data
              mapping before customers can realize automated workflow benefits.
            claimRefs:
              - CE005
