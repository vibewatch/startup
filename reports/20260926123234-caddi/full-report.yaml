      - number: '7.4'
        title: Incumbent PLM Bundling, Ecosystem Dependencies, and Network Effects
        blocks:
          - type: paragraph
            body: >-
              CADDi's strategic durability is vulnerable to counter-positioning by global engineering software giants
              such as Siemens, SAP, Dassault Systèmes, and PTC. These incumbents control core enterprise Product
              Lifecycle Management (PLM) and CAD systems, maintaining decades-long master service agreements and deep
              procurement relationships. By 2027, PLM platform vendors can bundle native AI drawing retrieval and
              similarity search into existing software licenses, potentially neutralizing CADDi's point-solution value
              proposition. Unlike enterprise platforms with multi-sided network effects, CADDi operates on closed
              corporate datasets without cross-company drawing sharing due to strict intellectual property firewalls.
              Consequently, customer switching costs do not accrue on day one; instead, they build gradually through
              accumulated usage. While CADDi positions itself as a complementary shared intelligence layer rather than a
              direct replacement for PLM and ERP backbones, enterprise IT departments under budget scrutiny may favor
              native PLM extensions over third-party software subscriptions.
            claimRefs:
