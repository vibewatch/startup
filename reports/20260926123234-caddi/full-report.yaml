  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Taxonomy and Evaluative Heatmap
        blocks:
          - type: paragraph
            body: >-
              CADDi's corporate transition from a tech-enabled parts procurement brokerage to an enterprise AI data
              platform alters its risk profile across multiple operational and strategic vectors. Following its
              September 2026 Series D funding round of $114 million at a $1.2 billion valuation, the company faces
              elevated market expectations and execution hurdles as it expands across North America. Key risks cluster
              across four critical domains: structural platform competition from entrenched PLM suites, complex
              multi-jurisdictional regulatory compliance including U.S. defense export controls, technological precision
              limitations in processing legacy engineering drawings, and corporate governance opacity surrounding
              standalone software retention metrics. Because CADDi does not benefit from mandatory regulatory filing
              requirements that protect vertical software peers, its customer retention depends entirely on accumulating
              proprietary drawing intelligence and deeply embedding into enterprise workflows before legacy CAD
              incumbents deploy bundled AI alternatives.
            claimRefs:
              - CR002
              - CR003
