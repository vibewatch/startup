evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-financials-and-burn
    missingEvidence: Audited annual recurring revenue (ARR), gross margin profile, and current net cash burn rate.
    whyItMatters: >-
      Without verified ARR and margins, CADDi's $1.2 billion valuation multiple cannot be independently benchmarked
      against enterprise software peers.
    diligencePath: >-
      Request confidential financial disclosure pack, GAAP revenue breakdown between software subscriptions and legacy
      services, and FY2026/FY2027 budget forecast.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-cap-table-ownership
    missingEvidence: >-
