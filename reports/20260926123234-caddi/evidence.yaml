      prior investors.
    whyItMatters: >-
      Assessing founder governance control versus institutional investor preference overhang is required to evaluate
      common shareholder equity value.
    diligencePath: Review certified cap table, articles of incorporation, and voting agreements during confirmatory legal diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
