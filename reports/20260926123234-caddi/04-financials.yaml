company:
  name: "CADDi"
chapter:
  number: 4
  title: "Financials"
  summary: "CADDi operates a hybrid software-and-services model transitioning toward enterprise SaaS, capitalized by a $114 million Series D round in September 2026 at a $1.2 billion valuation. While the company claims over 100% annual sales growth and customer penetration across 22 countries, management withholds audited revenue, ARR, and gross margins, creating underwriting dependency on uncorroborated growth narratives. Heavy operational overhead from 900 employees, including over 100 customer success and forward-deployed engineers, represents a material fixed cost burden that dilutes pure-play software unit economics."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Monetization Architecture"
    body: "CADDi monetizes through a multi-tier commercial model that combines annual software subscriptions for its Manufacturing AI Data Platform with transaction fees generated by physical procurement services. The core software suite, anchored by CADDi Explorer (formerly CADDi Drawer) and newly launched specialized workflow modules such as CADDi Quote and Design Review, is sold on recurring enterprise contracts. In parallel, CADDi continues to operate its legacy supply-chain execution business, where it captures margin by brokering custom parts procurement across its manufacturing network. While management highlights rapid adoption among Japan's largest manufacturers and claims that top-line sales are more than doubling year over year, the company refuses to disclose absolute revenue, ARR, or software-versus-services revenue mix. Official list pricing remains entirely bespoke and undisclosed, with realized deal sizes negotiated based on drawing database volume, seat licensing, and enterprise integration scope. Demonstrating quantifiable procurement savings, such as an industrial machinery client reducing parts costs by 30%, remains central to CADDi's enterprise value proposition."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "go-to-market-and-cost-structure"
    title: "Go-To-Market Economics and Service-Delivery Cost Burden"
    body: "CADDi's commercial expansion strategy relies on a high-touch enterprise sales and deployment model that differs substantially from low-friction enterprise software. Because industrial manufacturers face deep-seated organizational inertia and complex legacy drawing repositories, customer adoption requires hands-on change management. Consequently, CADDi maintains more than 100 customer success personnel, outnumbering its pure sales force, and has aggressively expanded hiring of forward-deployed engineers to operationalize deployments on-site. Total corporate headcount reached approximately 900 employees in September 2026, marking a 50% expansion from 600 staffers in early 2025. In the United States, CADDi's dual headquarters in Chicago is actively recruiting senior go-to-market leaders with base compensation packages ranging from $100,000 to $170,000 plus performance bonuses. This labor-intensive delivery structure imposes substantial ongoing payroll obligations, depressing blended gross margins and introducing operating leverage risks if software annual recurring revenue growth lags headcount expansion."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "capital-adequacy-and-financing-profile"
    title: "Capital Adequacy, Financing Dependency, and Debt Obligations"
    body: "Following its $114 million Series D financing round in September 2026, CADDi has raised a cumulative $234 million in equity capital. The latest financing values the business at $1.2 billion post-money, representing a 2.5x multiple expansion over its $470 million valuation in March 2025. In addition to equity financing, CADDi secured $30 million in long-term debt facilities from Mizuho Bank and other leading financial institutions during its Series C extension. The capital influx provides substantial balance-sheet liquidity to fund four designated operational priorities: proprietary AI model development tailored to industrial CAD geometry, platform scaling, North American geographic expansion, and high-cost technical recruitment. While this funding gives CADDi an estimated runway exceeding 24 months under current headcount levels, the business remains structurally dependent on external capital markets or significant gross margin expansion until recurring software revenue covers corporate operating burn."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI009"
    tableRefs: []
    figureRefs: []
  - id: "financial-verdict-and-underwriting-blockers"
    title: "Financial Verdict, Revenue Quality, and Diligence Blockers"
    body: "From an institutional diligence standpoint, CADDi represents an ambitious but financially opaque market-expansion asset. The company's ability to command a $1.2 billion valuation from premier global and strategic investors, including Toyota's Woven Capital and Salesforce Ventures, reflects strong market validation for vertical AI in industrial data infrastructure. However, independent market observers and secondary trackers note that CADDi's valuation multiple rests entirely on uncorroborated growth narratives rather than auditable financial fundamentals. Because management withholds audited revenue run rates, net revenue retention rates, and gross margin profiles, investors cannot ascertain whether the business is scaling high-margin recurring software or subsidizing revenue through low-margin parts brokerage and professional services. Resolving these private-metric gaps through confidential disclosures is a prerequisite for underwriting CADDi's long-term capital efficiency."
    claimRefs:
      - "CI004"
      - "CI010"
      - "CI014"
    tableRefs: []
    figureRefs: []
