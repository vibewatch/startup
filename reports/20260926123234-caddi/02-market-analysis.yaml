callouts:
  - calloutType: "insight"
    title: "The Tacit Knowledge Crisis as an Enterprise Demand Catalyst"
    body: "The retirement of senior manufacturing engineers combined with persistent manufacturing labor shortages creates an acute operational vulnerability for industrial OEMs. Because decades of design rationale and part sourcing decisions remain locked in legacy 2D drawings and retiring workers' memory, enterprises adopt CADDi to transform unstructured engineering archives into reusable, searchable digital assets."
    claimRefs:
      - "CM004"
      - "CM012"
  - calloutType: "risk"
    title: "Integration Workarounds and Change Management Constraints"
    body: "Enterprise adoption is constrained by two critical headwinds: organizational inertia requiring design and sourcing teams to alter established habits, and the current absence of native bidirectional API integrations with internal legacy systems. When software forces engineers into manual data bridges between CADDi and internal tools, platform ROI and seat expansion velocity face friction."
    claimRefs:
      - "CM014"
      - "CM015"
