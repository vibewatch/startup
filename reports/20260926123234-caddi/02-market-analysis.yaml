  title: "Market Analysis"
  summary: "CADDi addresses a multi-billion dollar discrete manufacturing data utilization market focused on unlocking value from unstructured legacy drawings, CAD files, and ERP records. The company targets enterprise VPs of Procurement and Heads of Engineering across high-mix low-volume equipment, precision tooling, and automotive sectors, scaling to over 180 enterprise accounts and $70 million in ARR while navigating enterprise change management and integration constraints."
sections:
  - id: "market-boundary-and-spend"
    title: "Market Boundary, Included Spend, and Status-Quo Substitutes"
    body: "The addressable market for CADDi sits at the intersection of discrete manufacturing engineering data utilization, computer-aided design (CAD) archive management, and procurement value analysis/value engineering (VAVE). Rather than competing as a core 3D CAD design authoring package or replacing enterprise resource planning (ERP) platforms, the platform operates as an overlay intelligence layer. It structures and normalizes historical 2D drawings, 3D models, bills of materials (BOMs), and purchase histories that are currently fragmented across disparate corporate repositories. Included spend encompasses software licenses for geometric similarity search, technical drawing optical character recognition (OCR), automated request for quotation (RFQ) component costing, and parts reuse discovery across operating divisions. Spend explicitly excluded from this boundary comprises physical contract manufacturing procurement costs, generative 3D CAD modeling design software, and generalized enterprise document storage suites. In typical manufacturing plants, status-quo substitutes consist of manual folder searches, legacy product data management (PDM) or product lifecycle management (PLM) archives that lack cross-facility geometric indexing, and institutional memory stored exclusively in the minds of veteran engineers. Consequently, discrete manufacturers routinely procure near-identical components from multiple suppliers at wildly varying unit prices simply because procurement and engineering personnel cannot easily locate what has already been designed and approved."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
    tableRefs:
      - "TM001"
  - id: "market-sizing-and-drawing-scale"
    title: "Market Sizing Lenses: Drawing Volumes, Account Tiers, and SaaS ARR"
    body: "Evaluating the total addressable market requires examining discrete manufacturing assets across multiple empirical lenses rather than relying on a single broad top-down projection. At the enterprise tier, discrete equipment manufacturers maintain massive drawing estates; for example, single engineered-to-order packaging machinery OEMs manage between 30,000 and 45,000 configuration options, resulting in historical archives exceeding 750,000 engineering drawings. Across industrial projects, a standard single-plant optimization deployment regularly ingests more than 10,000 technical drawings to establish component baselines. From a commercial software perspective, CADDi transitioned from its initial manufacturing marketplace network model in 2022 to an enterprise SaaS platform, reaching $70 million in annual recurring revenue (ARR) across more than 180 enterprise customers in Japan within two years. Customer penetration data reveals that over 50% of Japan's 100 largest discrete manufacturers have deployed the software across operating divisions. However, an independent third-party market sizing specifically isolating AI drawing data intelligence from the broader $20B+ PLM and CAD software market remains an open diligence gap. Furthermore, global supply chain volatility and evolving tariff regimes are intensifying demand across international manufacturing hubs, compelling multinational OEMs to quantify drawing-level supply chain exposures across facilities in the Americas, Europe, and Asia."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM013"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-segmentation-and-workflows"
    title: "Buyer Segmentation, Budget Ownership, and Adoption Pathways"
    body: "Enterprise purchasing of manufacturing data intelligence software is driven by a clear multi-persona buying committee within discrete manufacturing corporations. The primary economic buyers and budget owners are Vice Presidents of Procurement, Heads of Engineering, and Chief Information Officers (CIOs) who seek to stem margin erosion and eliminate duplicate part proliferations. Day-to-day tactical users diverge across two operational functions: mechanical design engineers seeking to identify and reuse existing components during the drafting phase, and quotation specialists tasked with evaluating incoming customer RFQs against historical cost and manufacturing feasibility models. In engineered-to-order (ETO) and configured-to-order (CTO) machinery verticals, adoption is triggered by acute competitive pressures to slash quotation turnaround cycles and capture high-margin aftermarket replacement part orders. In precision tooling and advanced materials manufacturing, quotation turnaround speed directly dictates customer win rates, prompting engineering leaders to replace multi-folder manual searches with sub-second geometric similarity queries that surface existing tooling and estimation models."
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM011"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-gaps"
    title: "Growth Drivers, Implementation Bottlenecks, and Diligence Gaps"
    body: "Adoption velocity is strongly accelerated by structural macro tailwinds across the industrial sector. Foremost among these is an acute engineering demographic cliff: experienced mechanical engineers and machinists are retiring en masse, taking decades of tacit institutional knowledge with them and leaving manufacturers vulnerable to repetitive design errors. In addition, intensifying supply chain friction and cross-border tariffs require sourcing executives to quickly renegotiate component supplier terms based on granular part-level cost insights. Conversely, material adoption constraints center on organizational change management and software integration depth. Altering legacy engineering habits—where drafting new components is often perceived as faster than searching fragmented archives—demands sustained corporate change management programs that vendor-led customer success teams must actively shepherd. On a technical level, enterprise user reviews repeatedly highlight a lack of robust, bidirectional API integrations with internal legacy databases and custom ERP workflows, forcing customers to rely on fragile manual workarounds. Finally, verifiable contract renewal rates and net revenue retention (NRR) outside CADDi's core Japanese customer base remain undisclosed, representing a material diligence gap as the platform expands into Western markets."
    claimRefs:
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
