      - number: '6.4'
        title: 客户留存、增购机制与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管客户定性反馈与落地热情显著，评估 CADDi 的商业持续性仍暴露出关键尽调盲区。CADDi
              目前未公开经审计的总收入留存率（GRR）、净收入留存率（NRR）以及年度客户流失率，导致投资者与企业合作伙伴只能依赖营业总收入增长叙事，而无法获取经审计的同客群留存瀑布图（cohort
              waterfall）。为稳固客户留存，CADDi 在北美招募专属客户成功主管，专门负责在涉及多方利益相关方的复杂工业销售周期中建立售后服务手册并优化 NRR 目标。此外，CADDi
              面临来自传统软件巨头的长期续约威胁。主要的 CAD、PLM 与 ERP 供应商——尤其是 Siemens、SAP 及 Dassault Systèmes——在全球制造业中保有深厚的客户合作关系，完全可能在
              2027 年前将 AI 图纸检索功能捆绑进既有企业合同。一旦北美市场的“拓客与增购”（land-and-expand）策略遇阻，客户数据团队可能会尝试利用企业内部数据湖仓自建平替，而非续订该软件平台。
            claimRefs:
              - CU009
              - CU012
              - CU013
      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 日常高频工程工作流的撬动效应
            body: >-
              CADDi 最快实现客单扩张的突破口，在于解决日常高频业务中的痛点——例如 RFQ 报价或质量缺陷调查时查找历史工程图纸。在 Neaton Auto Products 及精密制造客户中，将查图时间从 30
              分钟压缩至两分钟以内迅速赢得了用户信任，在无需 IT 部门强势自上而下施压的情况下，推动席位规模从最初的 30 名用户跃升至 85 个活跃账户（增幅 183%），并覆盖了 75% 的 RFQ 业务量。
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
          - type: callout
            title: 企业扩张持续性风险与信息不对称
            body: >-
              尽管 CADDi 在一级汽车零部件与机械制造巨头中展现出充实的定性案例，但定量留存数据依然秘而不宣。公司尚未公开总收入或净收入留存率、客户流失率及客户集中度。此外，Siemens、SAP 等 PLM 和 ERP
              传统巨头正积极将原生视觉相似度与图纸检索融入其核心平台；除非 CADDi 能深度融入多部门业务流，否则长远来看将面临严峻的续约阻力。
            calloutType: risk
            claimRefs:
              - CU009
              - CU012
              - CU013
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 风险分类与综合研判热力图
        blocks:
          - type: paragraph
            body: >-
              CADDi 从技术型零部件采购撮合商转向企业级 AI 数据平台，改变了其运营与战略风险。2026 年 9 月以 $1.2 billion 估值完成 $114 million Series D
              轮融资后，公司拓展北美市场也面临更高预期和执行压力。主要风险有四类：老牌 PLM
              套件带来的结构性竞争、包括美国国防出口管制在内的跨境合规要求、处理历史工程图纸时的技术精度，以及独立软件留存指标不透明带来的治理风险。CADDi
              无法像部分垂直软件同行那样，受益于强制监管申报要求带来的保护；客户留存因此取决于 CADDi 能否在传统 CAD 巨头推出捆绑 AI 功能前，持续积累专有图纸智能并深度嵌入企业工作流。
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR014
