chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、使命与全球布局
        blocks:
          - type: paragraph
            body: >
              CADDi 于 2017
              年在东京创立，核心使命旨在打破工业供应链固有的物理与数据瓶颈，释放制造业潜能。为推进跨太平洋业务扩张并深度服务西方工业制造商，公司设立伊利诺伊州芝加哥与日本东京双总部架构。历经九年稳健运营，CADDi
              将全球企业级业务拓展至 22 个国家，覆盖重型工业机械、汽车及半导体设备客户。              旗下核心软件产品迅速获客；日本 Nikkei 225 成分股中的离散制造企业，已有超过 50%
              部署该软件。为服务跨区域客户，CADDi 将全球全职员工扩充至 910 余人，并在北美和亚洲组建本地销售、客户成功及解决方案架构团队。
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
      - number: '1.2'
        title: 创始人、高管团队与治理架构
        blocks:
          - type: paragraph
            body: >
              CADDi 领导层兼具工业供应链管理咨询专长与硅谷软硬件工程经验。联合创始人兼 CEO Yushiro Kato 曾就职于 McKinsey & Company
              主导制造业采购优化项目，为公司早期发展奠定运营基础与商业网络。联合创始人兼 CTO Aki Kobashi 拥有 Stanford University
              电气工程学士及硕士学位，曾在美国航空航天领域研发大规模卫星图像处理系统，并在 Apple 负责 iPhone、AirPods 等旗舰消费硬件的产品工程研发。高管团队还包括首席财务官 Ryota
              Haga（统筹全球资本运作与机构投资者银团）以及工程副总裁 Chris Cope（主管北美与日本的分布式软件工程）。尽管团队对 Kato 与 Kobashi
              的关键人物依赖依然显著，但芝加哥高管团队的组建正赋予公司更强的日常运营自主权。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: 资本结构、估值演进与股东治理
        blocks:
          - type: paragraph
            body: >
              CADDi 持续获取全球一线成长期资本支持，通过多轮股权融资跨入独角兽行列。2026 年 9 月，公司就 $114 million Series D 轮融资签署具有约束力的协议，投后估值达 $1.2
              billion，较 2025 年 3 月由 Atomico 领投、估值 $470 million 的 Series C 轮追加投资显著跃升。Series D 轮使 CADDi 累计股权融资金额达 $234
              million。本轮投资团结构均衡，既有 Atomico、Globis Capital Partners 及 JPS Growth Investment 等全球老股东持续跟投，又引入了 Moore
              Strategic Ventures、Coreline Ventures、Salesforce Ventures 以及 Toyota Motor 旗下的 Woven Capital 等顶尖战略与财务投资机构。在
              CADDi 加速拓展北美市场之际，优质股东背景带来强有力的机构背书与治理监督。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
