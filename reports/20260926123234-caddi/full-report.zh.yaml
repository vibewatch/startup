              CADDi 的商业拓展策略依赖重度介入的企业销售与交付模式，与低摩擦的企业级软件截然不同。鉴于工业制造商面临根深蒂固的组织惯性与庞杂的历史图纸库，推动客户落地必须配合深度的现场变革管理。因此，CADDi 组建了
              100 余人的客户成功团队，人数超过纯销售人员，并大力扩招现场交付工程师（forward-deployed engineers）驻场推进系统部署。2026 年 9 月，公司全球总员工数达约 900 人，较
