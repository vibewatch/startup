  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、覆盖支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              CADDi 的目标市场处于离散制造工程数据利用、计算机辅助设计（CAD）归档管理以及采购价值分析 / 价值工程（VAVE）的交汇处。该平台并非核心 3D CAD
              设计制图软件的竞争对手，亦不取代企业资源计划（ERP）平台，而是作为一层叠加的智能层运作。它对目前分散在不同企业存储库中的历史 2D 图纸、3D
              模型、物料清单（BOM）以及采购记录进行结构化与标准化。覆盖支出包括几何相似性检索、工程图纸光学字符识别（OCR）、自动询价（RFQ）零部件成本核算以及跨业务部门零部件复用发现的软件许可费用。明确排除在外的支出涵盖实体代工采购成本、生成式
              3D CAD
              建模设计软件以及通用企业文档存储套件。在典型制造工厂中，现状替代方案主要包括人工文件夹检索、缺乏跨工厂几何索引的传统产品数据管理（PDM）或产品生命周期管理（PLM）归档，以及仅储存于资深工程师大脑中的隐性经验。因此，离散制造企业经常因为采购与工程人员无法便捷查阅既有已审批设计，而从不同供应商处以悬殊单价重复采购几乎完全相同的零部件。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
      - number: '2.2'
        title: 市场规模测算视角：图纸体量、客群层级与 SaaS ARR
        blocks:
          - type: paragraph
            body: >-
              评估潜在市场总额（TAM）需要从多个实证视角审视离散制造业资产，而非依赖单一宽泛的自上而下预测。大型企业里，离散设备制造商保有体量庞大的图纸资产；例如，单一按单工程制造（ETO）包装机械原始设备制造商（OEM）管理的配置选项介于
              30,000 至 45,000 种，由此积累的历史工程图纸档案超过 750,000 份。在工业项目中，单厂优化部署通常需要导入 10,000 余份工程图纸以建立零部件基准。从商用软件维度来看，CADDi 于
              2022 年由最初的制造业撮合网络模式转型为企业级 SaaS 平台，两年内在日本签约 180 余家企业客户，年经常性收入（ARR）达到 $70 million。客户渗透数据显示，日本前 100
              大离散制造企业中已有超 50% 在各业务部门部署该软件。然而，将 AI 图纸数据智能从规模逾 $20B 的更广泛 PLM 及 CAD
              软件市场中剥离出来的独立第三方市场测算，仍属待补充的尽调空白。此外，全球供应链波动与关税政策演变正在推高跨国制造中心的软件需求，促使跨国 OEM 必须量化美洲、欧洲与亚洲各工厂的图纸级供应链风险敞口。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
      - number: '2.3'
        title: 买方画像细分、预算归属与落地路径
        blocks:
          - type: paragraph
            body: >-
              制造数据智能软件的企业采购由离散制造企业内部清晰的多元决策委员会驱动。主要经济买方与预算负责人为采购副总裁、工程主管及首席信息官（CIO），其核心诉求在于遏制利润率下滑并杜绝重复零部件泛滥。日常操作端用户则分化为两大职能：机械设计工程师力求在出图阶段检索并复用既有零部件，报价专员则负责根据历史成本与制造可行性模型评估客户发来的询价单（RFQ）。在按单工程制造（ETO）与按单配置制造（CTO）机械垂直领域，压缩报价周期、抢占高毛利售后备件订单的紧迫竞争压力成为软件落地的触发因素。在精密模具与先进材料制造领域，报价响应速度直接决定客户中标率，促使工程负责人以亚秒级几何相似性查询取代繁琐的多文件夹人工翻找，快速调取既有模具与估算模型。
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动因素、实施瓶颈与尽调缺失
        blocks:
          - type: paragraph
            body: >-
              工业领域多股宏观趋势正加快产品采用。最突出的是工程人才断层：资深机械工程师与机械师成批退休，几十年积累的隐性知识随之流失，制造商也更容易重复犯设计错误。供应链摩擦加剧、跨境关税变化，还迫使采购负责人依据零件级成本信息迅速重谈供应商条款。另一方面，组织变革和软件集成仍是主要阻力。工程师往往觉得重画零件比翻找分散档案更快；要扭转这一习惯，企业必须持续推动变革，并由厂商客户成功团队协助落地。企业用户也多次指出，平台缺少与内部旧数据库及定制
              ERP 工作流之间稳定、双向的 API 集成，迫使客户依赖脆弱的人工桥接。最后，CADDi 在核心日本客群之外可验证的续约率与净收入留存率（NRR）仍未披露，构成平台向西方市场扩张中不可忽视的尽调空白。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 隐性认知流失危机成为企业采购催化剂
            body: >-
              资深制造工程师退休与制造业持续用工短缺叠加，给工业 OEM 造成显著运营隐患。数十年积累的设计依据与零部件采购决策被困于传统 2D 图纸和退休员工记忆中，促使企业采用 CADDi
              将非结构化工程档案转化为可复用、可检索的数字化资产。
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
          - type: callout
            title: 系统集成过渡方案与变革管理阻力
            body: >-
              企业深度应用受到两大阻力制约：一是组织惯性要求设计与寻源团队改变既有工作习惯；二是目前缺乏与内部旧系统的原生双向 API 集成。若软件迫使工程师在 CADDi
              与内部工具间进行人工数据搬运，平台投资回报率与席位扩容速度均会遭遇摩擦。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景与替代品类别
        blocks:
          - type: paragraph
            body: >-
              CADDi 所处的竞争格局涵盖垂直制造智能服务商、传统产品生命周期管理（PLM）巨头、通用云存储工具以及根深蒂固的人工工作流。Krowdbase 等第三方软件聚合平台将 Microsoft
              SharePoint、Box、ONLYOFFICE Docs 等通用文档管理系统列为 CADDi Drawer
              的主要替代品。然而，通用存储平台仅将工程图纸视作未建立索引的二进制文件块，缺乏原生几何计算机视觉、零部件尺寸解析以及供应商成本关联能力。为此，CADDi 累计融资达 $234 million——最近一轮为
              2026 年 9 月以 $1.2 billion 估值完成的 $114 million Series D
              轮融资——用于在全球制造枢纽拓展专属数据平台。为巩固企业级市场地位，公司正积极优化品牌架构与市场宣传，向采购主管阐明通用办公软件为何无法解决数百万美元规模的供应链效率损耗。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP013
