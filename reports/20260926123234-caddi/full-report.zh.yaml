        title: 产品矩阵与平台演进
        blocks:
          - type: paragraph
            body: >-
              CADDi 围绕垂直一体化软件套件构建商业产品体系，旨在盘活沉淀在制造图纸与物料清单中数十年的工程隐性经验。公司旗舰产品 CADDi Drawer
              最初脱胎于支撑其实体零部件制造业务的内部运营软件；彼时工程团队疲于应付零散的图纸服务器与老员工退休带来的人才断层。该系统并非通用文档库，而是构建了一个智能检索环境，对机械图纸、装配体及交叉引用的零件编号建立索引。2026
              年 8 月，CADDi 推出下一代平台架构，发布作为 Drawer 升级版本的检索发现引擎 CADDi Explorer，并推出自主人工智能智能体 CADDi
              Agent，能够在客户设定的运营边界内评估制造数据并执行业务决策。平台还辅以六款针对设计工程、采购及质量管理不同职能定制的垂直领域工作流产品（Workflow Products）。然而，在图纸标准、CAD
              格式及用户角色千差万别的异构工业环境中，产品管理与工程团队在标准化软件工作流上面临巨大的复杂度。
