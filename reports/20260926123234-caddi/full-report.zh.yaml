  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议框架
        blocks:
          - type: paragraph
            body: >-
              工业制造与企业级人工智能交汇处，CADDi 展现出吸引力与复杂性并存的投资特征。核心投资逻辑在于，CADDi
              证实自身有能力突破管理层所谓的「物理瓶颈」，也就是生成式软件能力与工厂车间落地之间的长期鸿沟。通用基础模型无法稳定解析复杂二维工程图纸或三维 CAD 几何体，CADDi 则自研行业专用视觉模型，搭配通用 LLM
              处理文本图纸。这种技术差异化得到日本本土企业级渗透率的强力支撑，日本前 100 大制造企业超半数采用该平台。然而，估值纪律要求保持审慎。公司以 $1.2 billion 估值拿下 $114 million
              Series D 融资，在缺乏 ARR 规模或软件毛利率公开验证的前提下，估值已达顶级独角兽水平。因此，机构投资者宜采取 Track / Research-More
              观察立场，暂缓正式出资，等待单位经济模型与欧美市场商业拓展成果得到独立证实。
