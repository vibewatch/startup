      - number: '6.3'
        title: 标杆客户实证与落地运营成效
        blocks:
          - type: paragraph
            body: >-
              公开记载的实际生产部署为 CADDi 在北美与日本制造厂区的运营可行性提供了坚实佐证。美国 OEM 厂商 Amerequip Corporation 为 John Deere、Caterpillar 及
              Oshkosh Corporation 等全球客户设计并制造定制设备与液压系统；其工程与质量负责人借助 CADDi Drawer 打通图纸、客户技术规范与 ERP 记录。Amerequip
              团队告别了繁琐的共享网络磁盘翻找，利用关键词与相似性检索迅速识别库存中已有的完全相同零部件，有效规避不必要的采购订单与重复开模成本。在俄亥俄州伊顿的 Neaton Auto Products
              Manufacturing，工程师集中归档了 140,000 余份工程与质量技术文件，图纸查阅工时缩减 40% 至 70%，质量保证根因调查提速 50%。在日本本土，CADDi 服务于
              Hitachi、Subaru 及 Kawasaki 等老牌工业企业，据报道在日本前 100 大制造企业中的渗透率已过半。
