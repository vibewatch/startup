              CADDi 展现出突出的垂直技术防御壁垒与顶尖企业背书，但 $1.2 billion 估值预先透支了持续高增长预期，且缺乏经审计公开核实的 ARR 规模、净留存率或毛利率指标支撑。尽调团队应将 CADDi
              视作重点观察标的，出资前必须要求提供透明的单位经济模型数据。
