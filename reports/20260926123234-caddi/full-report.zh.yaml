      - number: '5.3'
        title: 四层技术架构、核心技术栈与部署模式
        blocks:
          - type: paragraph
            body: >-
              CADDi 平台依托四大集成功能层级运行：数据摄入与分析的数据层（Data Layer）、上下文与关系的语义层（Semantic Layer）、发现与智能体的智能层（Discovery & Agents
              Layer）以及执行层面的工作流层（Workflow Layer）。底层工程实现融合现代 Web 应用框架与系统级编程语言，解决方案架构师与系统工程师采用 Python、TypeScript、Rust 配合
              SQL 编排编写生产流水线。基础设施以容器化 Docker 工作负载形态部署，依托持续集成与交付流水线托管于 Amazon Web Services、Google Cloud Platform、Microsoft
              Azure 等主流公有云厂商。为服务国防工业领域企业客户，CADDi
              执行严格的安全控制标准，美国团队解决方案交付严格遵循《国际武器贸易条例》（ITAR）人员资质审查规定。工程团队在人才招聘中引入结构化技术架构考核，评估候选人在数据库架构设计、云基础设施与数据管道高可用性等维度的权衡决策能力，以支撑高吞吐量工业级分析。
