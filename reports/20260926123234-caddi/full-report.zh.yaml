      - number: '8.3'
        title: 融资历程与估值情景推演
        blocks:
          - type: paragraph
            body: >-
              CADDi 的融资历程呈现出跨多轮周期的快速估值扩张。2025 年 3 月，公司以 $470 million 估值敲定 $38 million Series C 延期融资，同时借入 $30 million
              银行贷款。仅 18 个月后的 2026 年 9 月，公司达成以 $1.2 billion 估值引入 $114 million Series D 融资的确定协议，推动累计股权融资额升至 $234
              million。按累计股权融资额计算，当前估值约为其五点一倍，反映出投资人对其未来现金流产出寄予厚望。按 Dealroom 创投对标指标衡量，该轮融资在资金规模上处于第一梯队，但在量化业绩分位数上仅列第 38
              百分位左右，很大程度上折射出管理层拒绝公开营收和客户数量的现状。三年情景建模显示：乐观情景下，北美大客户顺利落地带动估值增至 $2.5B 至 $3.0B；基准情景下，依托日本本土核心客群稳固在 $1.2B 至
              $1.5B 之间；悲观情景下，一旦国际扩张受阻，估值倍数承压压缩至 $500M 至 $700M。
