      - number: '5.4'
        title: 技术差异化、合规管控与尽调风险
        blocks:
          - type: paragraph
            body: >-
              CADDi 的主要技术壁垒建立在专为机械工程图纸定制的领域专用 AI 模型之上；通用大语言模型与通用搜索引擎难以准确解析正投影视图、几何尺寸及形位公差标注。公司拥有专利的相似性检索技术让工程师仅凭草图或 2D
              轮廓即可锁定既有零部件，无需依赖规整的 3D CAD 模型或预先打好的元数据标签。在监管与合规端，CADDi 遵循 ITAR 人员准入审查协议，为服务北美大型 OEM
              构筑了有力的采购资质准入门槛。然而，技术尽调显示出显著的运营风险：针对低质量图纸的 OCR 错误率、数百万级图纸体量下的向量索引查询延迟，以及与本地部署旧 ERP
              数据库的跨系统同步延迟，平台均未见公开验证的第三方审计基准。此外，企业级部署面临繁重的上线摩擦，客户需在专属解决方案架构师协助下完成深度数据映射，方能实现自动化工作流收益。
