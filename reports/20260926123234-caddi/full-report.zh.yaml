  - id: FV001
    title: 投资建议逻辑推导
    type: flow
    summary: 决策链路，将企业级客户验证、融资规模、组织变革开销及估值透明度缺失连接至“观察”评级。
    data:
      nodes:
        - id: node-proof
          label: 企业壁垒与客户验证
          detail: 日本前 100 大制造企业中超过 50% 部署；自研图纸 AI
          tone: positive
        - id: node-scale
          label: 资本储备与业绩增长
          detail: $114M Series D 轮融资，估值 $1.2B；累计融资 $234M；销售额同比翻倍
          tone: positive
        - id: node-risk
          label: 结构性执行风险
          detail: 客户成功团队开销高昂（100+ 人）；海外拓展与组织变革阻力
          tone: warning
        - id: node-valuation
          label: 估值与信息透明度缺口
          detail: 估值 $1.2B 且未披露 ARR 和利润率；Dealroom 基准排在第 38 百分位
          tone: negative
        - id: node-stance
          label: 估值立场：偏高
          detail: 溢价倍数默认未来执行近乎完美；入场安全边际狭窄
          tone: neutral
        - id: node-recommendation
          label: 投资建议：观察 / 继续研究
          detail: 资金投入前须确认经审计损益表、客户队列留存率以及美国拓展成效
          tone: neutral
      edges:
        - from: node-proof
          to: node-stance
          label: 技术验证
        - from: node-scale
          to: node-stance
          label: 资金背书
        - from: node-risk
          to: node-stance
          label: 利润率拖累
        - from: node-valuation
          to: node-stance
          label: 估值溢价
        - from: node-stance
          to: node-recommendation
          label: 尽调前置条件
    approximationNotes: 逻辑梳理，阐释自研技术防御壁垒与入场估值纪律之间的权衡。
