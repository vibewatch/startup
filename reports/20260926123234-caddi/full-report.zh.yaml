        - 估值维持在 $1.2B-$1.5B（1.0x-1.25x，保本或微幅收益），反映出稳固的本土壁垒与冗长的海外销售周期并存。
        - 本土制造业客群续约率保持稳定，但海外大客户转化周期拉长抵消了部分增速。
        - 50%
      - - 悲观情景
        - 海外大客户渗透遇阻；传统 CAD/PLM 厂商推出原生图纸智能工具；重交付的 CS 模式压缩 SaaS 利润率。
        - 估值下调至 $500M-$700M 进行流血轮融资或折价资产出售（相较 Series D 估值缩水 ~40%-60%）。
        - 非日本客户出现流失，或未能将重度服务交付转化为标准化的纯软件模式。
        - 25%
    notes: 基于现有市场与资本结构指标，针对 24-36 个月投资周期的估值情景推演矩阵。
