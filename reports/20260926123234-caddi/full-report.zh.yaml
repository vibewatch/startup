      - number: '8.2'
        title: 核心支柱评估：看多与看空逻辑
        blocks:
          - type: paragraph
            body: >-
              评估 CADDi，需要权衡强劲的运营顺风与重大的执行风险。看多逻辑在于，公司从 CADDi Drawer 的采购去重工具起步，逐步拓展为涵盖 CADDi Explorer、CADDi Agent 及 6
              款工作流产品的全套制造 AI 数据平台（Manufacturing AI Data Platform）。Atomico、Woven Capital（丰田）、Coreline Ventures 以及
              Salesforce Ventures 等头部战略与财务机构注资，赋予其极高的商业信誉与生态资源。反观空方逻辑，风险主要集中在组织架构与市场竞争。CADDi 拥有 100
              多名客户成功人员，人数超过销售团队，专职驻厂推行深入的变革管理。极高的交付服务密度印证了改变制造企业数十年固有习惯的阻力，也可能把高毛利纯软件业务拉低成科技赋能服务业模式。不仅如此，通用基础模型厂商或
              Autodesk、Siemens、Dassault Systèmes 等传统 CAD/PLM 巨头若推出具备几何推理能力的竞品智能体，也可能逐步蚕食 CADDi 的技术溢价。
