  - number: 6
    title: 客群分析
    sections:
      - number: '6.1'
        title: 客群画像细分与目标企业定位
        blocks:
          - type: paragraph
            body: >-
              CADDi
              重点服务复杂且文档密集的离散制造企业，此类客户在数十年的运营中积累了大量彼此割裂的工程设计、采购历史与质量记录。核心买方画像涵盖一级汽车零部件供应商（Tier-1）、工业设备原始设备制造商（OEM）以及高精密度外协加工厂的设计工程副总裁、采购总监及质量控制负责人。此类企业通常在
              SAP、Infor LX 等 ERP 系统以及传统网络文件服务器中管理着数万至逾百万份工程图纸、CAD 文件与历史物料清单。CADDi 通过两大互补渠道向客群创造价值：一是核心软件应用 CADDi
              Drawer（正演变为 CADDi Explorer 及垂直工作流工具）；二是保障零部件质量、交期与价格的轻资产供应链采购服务 CADDi
              Manufacturing。尽管更宽泛的企业自动化市场还包含面向后台流程挖掘的工作流方案，但 CADDi 的核心竞争壁垒源于其对重工业制造资产专属的几何与语义解析能力。
