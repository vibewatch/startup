          touchpoints: Single-department onboarding, ERP/PLM metadata ingestion, weekly customer success check-ins
        - label: 显著的即时业务收益
          phase: 早期价值兑现
          description: 用户实现图纸检索耗时缩减 40% 至 70%，报价周转时间由 30 分钟压缩至 2 分钟以内。
          touchpoints: Daily RFQ workflows, engineering peer referrals, measurable search time savings
        - label: 跨部门自发扩展
          phase: 席位与角色扩展
          description: 质检与采购团队引入该平台，用于缺陷归因分析与成本价目表生成。
          touchpoints: Quality assurance sheet linking, supplier cost comparison, user count expanding by 150%+ to 80+ seats
        - label: 工作流深度集成与锁定效应
          phase: 企业级标准化推广
          description: CADDi Quote 与工作流产品成为标准作业基础设施，承载超过 75% 的 RFQ 业务量。
          touchpoints: CADDi Quote module activation, supplier quote negotiation, multi-plant software rollout
        - label: 商业化治理与续约
          phase: 账户长周期价值与规模化
          description: 大客户谈判签署主服务协议（MSA），由专属客户成功团队跟进，聚焦 NRR 目标与多年期续约。
          touchpoints: Executive business reviews, cloud MSA execution, enterprise-wide expansion planning
    approximationNotes: 各阶段与触点综合自 Neaton、Amerequip 及工业精密制造企业的公开客户落地案例。
