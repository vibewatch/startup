      - number: '7.4'
        title: 传统 PLM 巨头捆绑策略、生态依赖与网络效应
        blocks:
          - type: paragraph
            body: >-
              CADDi 的长期战略壁垒极易受到 Siemens、SAP、Dassault Systèmes 以及 PTC 等全球工程软件巨头反制策略的冲击。这些巨头牢牢掌控着企业核心的产品生命周期管理（PLM）与 CAD
              系统，维系着数十年的主服务协议与深厚的采购关系。PLM 厂商有能力在 2027 年前将原生 AI 图纸检索和相似性匹配直接打包进现有软件许可，从而削弱 CADDi
              单点解决方案的价值主张。不同于具备多边网络效应的企业级平台，鉴于严格的知识产权隔离墙，CADDi
              运行在封闭的企业专有数据集之上，无法实现跨企业图纸互通。因此，客户迁移成本并非在第一天自然形成，而是随着使用时长逐步沉淀。尽管 CADDi 将自身定位为协同共享的智能增强层而非直接替代 PLM 与 ERP
              底座，但在预算收紧的背景下，企业 IT 部门往往更倾向于选用 PLM 原生扩展模块，而非单独采购第三方软件订阅。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR013
      - number: '7.5'
        title: 财务状况、债务承诺与监测触发项
        blocks:
          - type: paragraph
            body: >-
              CADDi 为搭建软件底层耗资巨大。2025 年 3 月 Series C 延期融资时，公司除拿下 Mizuho 牵头银团提供的 $30 million 长期银行授信外，股权融资累计筹集 $234
              million。2026 年 9 月，CADDi 以 $1.2 billion 估值完成 $114 million Series D
              轮融资，但未公开披露独立软件的年经常性收入（ARR）、总流失率或净留存率（NRR）。核心指标不透明迫使投资者依仗收入扩张叙事，而非经审计的 SaaS
              单位经济模型。机构投资者判定逻辑破损的核心触发点包括：北美企业客户续约未达日本本土历史净留存水平；传统 PLM 巨头激进捆绑使得年度新客户增速跌破
              40%；企业软件现金流无法覆盖美国市场高昂的商业化烧钱开支，诱发偿债压力。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR014
