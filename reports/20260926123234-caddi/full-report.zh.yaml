      - 逻辑破局与观点转变触发条件
    rows:
      - - 自研数据护城河
        - 自研 AI 模型能够解析通用大语言模型无法处理的 2D 工程图纸与 3D CAD 文件，构建起技术防御壁垒。
        - 通用基础模型可能具备原生多模态几何推理能力，或传统 CAD 软件厂商可能缩小技术差距。
        - 基础大语言模型无需垂直领域微调即可在复杂多视图工程图纸解析上达到同等水平。
      - - 企业级客户拓展
        - 日本前 100 大制造商中超过半数采用该平台，形成企业级背书与供应链网络效应。
        - 出海日本以外市场面临根深蒂固的老旧 ERP/PLM 系统集成困难、供应商标准繁杂以及本地变革管理阻力。
        - 北美市场收入未能起量，或销售周期拉长超过 12 个月。
      - - 产品平台化
        - 从单点工具（CADDi Drawer/Explorer）迈向多工作流数据平台及自主式 CADDi Agent，拓宽了 ACV 与 TAM 空间。
        - 客户成功团队规模庞大（100+ 名 CS 人员，人数超过销售），反映服务交付重度，可能拖累 SaaS 利润率。
        - 因前线部署工程师（FDE）与定制集成成本导致毛利率跌破 65%。
      - - 资本结构与投资阵容
        - 获顶级全球投资者支持，包括 Atomico、Woven Capital（Toyota）、Coreline 与 Salesforce Ventures，累计融资达 $234M。
        - 在未披露收入的情况下，估值于 18 个月内翻倍至 $1.2B，在风投资本收紧周期下面临估值倍数压缩的下行情景风险。
        - 出现流血轮融资，或老股交易价格持续走低并跌破 $1.0B。
    notes: 对照关键尽调结论评估的核心投资驱动因素与下行脆弱点。
