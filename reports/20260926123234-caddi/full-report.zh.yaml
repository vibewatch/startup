      - number: '3.2'
        title: 技术差异化与图纸智能解析
        blocks:
          - type: paragraph
            body: >-
              CADDi 核心架构的差异化优势源于获得专利的相似性检索算法引擎，该引擎将非结构化的历史图纸档案转化为关联企业资产。典型工业客户手头一个项目常涉及 10,000 余份独立工程图纸，历史采购数据往往被困在互不连通的
              PDF 文件夹与本地服务器中。尽管 Siemens Teamcenter、PTC Windchill 等传统 PLM 系统能够管理 CAD 版本迭代周期，但通常将技术规格孤立在工程部门内部。CADDi 从 2D
              图纸中提取几何轮廓、尺寸公差以及标题栏文本，支持瞬时相似性检索，揭示不同供应商的历史定价偏差。2026 年底，CADDi 推出 CADDi Explorer 与自主智能体 CADDi
              Agent，推动业务从单一相似性检索拓展至跨部门自动化决策执行。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: 定价模式、产品组合与采购考量
        blocks:
          - type: paragraph
            body: >-
              评估商业软件的取舍，需比较 CADDi 的企业级产品组合与传统产品、替代方案的定价。Stork.AI 的第三方评测指出，自动化后台工具通常为个人用户提供免费增值模式，团队协作则采用定制报价。CADDi
              Drawer 与 Explorer 按企业年度订阅销售，价格依图纸库体量和用户规模定制。SharePoint 等通用文档工具按席位按月收费，价格透明；CADDi
              则需私下协商企业定价和多年维护承诺。条款不透明，采购团队必须提前严格测算 ROI，量化整合供应商和减少重复绘图带来的收益，才能证明这笔支出划算。
