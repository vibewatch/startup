      - number: '1.4'
        title: 平台演进、产品重构与战略风险
        blocks:
          - type: paragraph
            body: >
              2017 年至 2024 年间，CADDi 曾运营重资产定制零部件采购服务 CADDi
              Manufacturing，在四个国家布局合作工厂与质检中心。意识到推动制造业转型需要依靠软件基础设施而非实体撮合中介，CADDi 于 2024 年 7 月正式停止全部零部件供应业务，转型为纯粹的 AI
              软件平台。2026 年 8 月，公司完成底层平台架构的全面重构，形成四大集成层级：数据层（Data Layer）、语义层（Semantic Layer）、发现与智能体层（Discovery & Agents，含
              CADDi Explorer 与 CADDi Agent）以及垂直领域工作流产品（Workflow Products）。尽管技术演进显著，外部风险依然突出。业内质疑指出，CADDi 仍未公开经审计的 ARR
              及利润率数据，其 $1.2 billion 估值较大程度依托业务前景叙事。此外，Siemens、SAP、Dassault Systèmes
              等传统产品生命周期管理（PLM）巨头具备强大的产品捆绑销售威胁；财富管理领域同名初创企业 Caddi 也带来轻微的品牌辨识干扰。
            claimRefs:
