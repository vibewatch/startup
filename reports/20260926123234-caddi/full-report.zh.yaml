      - number: '3.4'
        title: 护城河壁垒、迁移成本与传统巨头反制
        blocks:
          - type: paragraph
            body: >-
              CADDi 的长期竞争力取决于数据网络效应，以及与企业价值链的深度集成。Hitachi、Kawasaki、Subaru 和 Tokyo Electron 等工业集团已将 CADDi
              嵌入核心寻源业务；数百万历史零部件和供应商报价一旦映射进其语义数据层，迁移成本就会显著上升。整合旧 ERP 数据库与历史图纸需要大量组织投入，客户因此不愿同时使用多个竞品平台。尽管如此，若主流 PLM
              巨头开发出原生 AI 相似性检索功能，或客户内部工程团队自建轻量级计算机视觉脚本，CADDi 将面临持续的产品平庸化风险。维持差异化要求 CADDi
              持续以实时供应商履约数据充实其语义层，而非单纯依赖静态图纸检索。
            claimRefs:
              - CP006
              - CP009
              - CP011
              - CP012
