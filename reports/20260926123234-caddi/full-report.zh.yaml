            body: >-
              CADDi 全球员工人数约 900 人，并在芝加哥和东京设立双运营总部，从组织架构上筹划首次公开募股（IPO）或战略并购等长期退出路径。在 Globis、JPS Growth
              等日本主力金融机构支持下，东京证券交易所挂牌上市或赴美双重上市是最具可行性的退出路径。Salesforce
              等企业软件巨头、丰田等工业财团或工程软件平台发起战略收购，同样是一条可行通路。即便如此，潜在投资人在入场前须严密盯防各项逻辑破损点：估值低于 $1.2 billion
              的任何折价轮（down-round）或平价延期融资、联合创始人 Yushiro Kato 与 Aki Kobashi
              等高管离职，或是北美获客陷入停滞。排他确认性尽调必须优先索取未经删节的财务审计报告、客户留存队列明细，以及跨优先股层级的完整股权结构表清算优先权条款。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 图表与附录
        blocks:
