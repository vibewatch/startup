            body: >-
              从机构尽调视角看，CADDi 是一项进取但财务透明度不足的市场扩张投资。Toyota 旗下 Woven Capital、Salesforce Ventures 等全球顶尖战略与财务投资者愿以 $1.2
              billion 估值投资，说明市场认可工业数据基础设施中的垂直 AI。但独立市场观察机构和二级市场追踪平台指出，CADDi
              的估值倍数完全建立在未经证实的增长叙事上，缺少经审计的财务基本面支撑。管理层不披露经审计的收入运行率、净收入留存率（NRR）和毛利率，投资者便无法判断公司是在扩大高毛利经常性软件业务，还是靠低毛利的零部件撮合与专业服务支撑收入。要判断
