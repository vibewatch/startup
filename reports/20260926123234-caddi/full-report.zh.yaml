      - number: '7.2'
        title: 监管合规、ITAR 出口管制与法律风险
        blocks:
          - type: paragraph
            body: >-
              CADDi 加速渗透一级汽车零部件、重型机械与航空航天制造业之际，监管合规成为左右销售推进周期的关键因素。2026 年 8 月，CADDi 在其 CADDi Drawer 软件平台中上线符合 ITAR
              标准的合规功能，以支持航空航天与国防承包商处理受美国国务院国防贸易管制局（DDTC）监管的技术数据。该项业务必须实行严格的美国本土数据驻留、加密权限访问控制以及物理隔离的云环境，防范外籍人员违规访问。此外，CADDi
              的跨国运营版图覆盖日本、美国、越南与泰国，客户遍及 20 多个国家，令其面临互有差异的跨境数据传输法规、用工政策及出口管制约束。国防采购合规疏漏或涉密国防 CAD
              图纸泄露，可能引发巨额法定罚款、取消承包商资格以及灾难性的商誉毁损。
            claimRefs:
              - CR001
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR015
      - number: '7.3'
        title: 系统运行可靠性、模型准确度与团队扩张瓶颈
        blocks:
          - type: paragraph
            body: >-
              CADDi 的技术价值依托自研 AI 模型、光学字符识别（OCR）与几何相似性检索算法来录入并结构化工程图纸。然而，离散制造客户往往沿用数十年前建立的旧 IT
              系统与工程归档库，充斥着非标制图符号、手写批注与低清晰度扫描件。尺寸提取偏差或形位公差分类错误可能向下游传导，导致零部件采购、供应商竞标及装配线作业出错，引发客户索赔纠纷。在日常运营中，CADDi
              面临团队地域分布不均带来的组织扩张瓶颈：根据公开画像统计，全球团队约 77%
              仍驻扎在日本，而核心增长重心已转向美国。在技术人才争夺激烈的背景下，芝加哥企业级销售团队的组建亟需兼通双语的复合型增长管理人才，以协调日本技术工程团队与美国制造高管间复杂的 GTM 落地协同。
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR008
