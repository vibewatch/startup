      - number: '5.2'
        title: 制造工作流、设计复用与成本优化
        blocks:
          - type: paragraph
            body: >-
              工业制造企业通过部署
              CADDi，化解面向制造的设计（DFM）、采购寻源以及质量保证工作流中的核心数据堵点。在典型的多品种小批量离散制造场景中，查找既有零部件或核验工程技术规范，需要跨越孤立的企业资源计划（ERP）数据库、共享网络文件夹与实体图纸档案柜进行繁琐的人工核对。CADDi
              借助能够从传统 2D 蓝图、扫描 PDF
              及手写批注中提取文本与标注的光学字符识别（OCR）技术，结合基于形状检索历史零部件的专利几何相似性算法，消除了这一操作痛点。通过在历史档案中检索出完全相同或功能可替代的零部件，平台协助工程师前置开展可制造性评审，避免重复开模。在采购端，买方利用几何聚类识别相似零部件的成本差异，赋能价值分析
              / 价值工程（VAVE）与供应商商务谈判。尽管如此，工作流效率仍严格受制于原始数据质量；若导入的图纸库存在严重的扫描褪色、命名标注不一或尺寸标注错误，这些缺陷将直接传导至下游推荐结果中。
