      - number: '6.2'
        title: 使用渗透轨迹与日常黏性跃升
        blocks:
          - type: paragraph
            body: >-
              CADDi
              数据平台的落地通常始于具体的部门痛点——尤其是人工检索历史图纸、核对零部件版本以及针对客户询价单（RFQ）比对历史报价所损耗的大量工程工时。一旦完成部署，随着日常工时节约在相邻车间流程中逐步显现，软件使用呈现迅速的自下而上渗透。在一级汽车零部件供应商
              Neaton Auto Products Manufacturing，最初部署时有 30 名用户；质检与采购团队将平台融入日常工作后，数周内活跃账户自然增长 183%，达到 85
              个。同样，在精密金属与塑料加工制造企业中，模具估价专员已在约 75% 的 RFQ 业务中采用 CADDi。图纸检索时间从原先的 30 余分钟普遍缩减至一到两分钟，效率提升超过 70% 至 96%。这种业务黏性促使
              CADDi 从一款试验性检索工具升格为厂区不可或缺的关键基础设施，在加快投标响应速度的同时避免高昂的零部件重复开发成本。
            claimRefs:
              - CU002
              - CU003
              - CU004
