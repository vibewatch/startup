      relatedQuestionRefs: [QO020]
      relatedTableRefs: [TO004]

    - type: private-evidence-only
      severity: minor
      topic: funding
      missingEvidence: >-
        The precise designation of ZaiNar's February 2026 round (Series A, B, Angel, or growth
        equity) is not stated by the company. Different data aggregators apply conflicting labels.
      whyItMatters: >-
        Round designation affects inference about investor rights, protective provisions,
