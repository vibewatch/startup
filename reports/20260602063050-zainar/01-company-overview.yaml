  - id: funding-capital
    title: Funding History, Valuation, and Capital Structure
    body: |
      ZaiNar's earliest documented external funding event was a seed round from Alchemist
      Accelerator — Silicon Valley's premier enterprise-focused startup accelerator — in
      September 2018. The dollar amount of this seed was not disclosed; graduation from
      Alchemist typically involves a small tranche of accelerator capital plus access to a
      network of enterprise customers and investors. The svinvestclub.com profile references
      approximately 46 total investors in ZaiNar per PitchBook, suggesting substantial angel
      and early institutional activity during the 2018–2025 stealth period. Specific round
      amounts and valuations for pre-2026 rounds (other than the September 2021 episode
      described below) are not publicly corroborated.

      AI Market Watch cites a September 2021 "Series A" of $11.7 million; this figure has
      not been independently confirmed in a primary source (press release, SEC filing, or
      investor announcement) and should be treated as medium-confidence secondary data.
      The TechCrunch author bio for Daniel Jacker mentions "Future Ventures, Softbank,
      AME Cloud, Samsung" as ZaiNar backers, implying strategic investors (SoftBank, Samsung)
      participated at some point during the stealth period, but neither SoftBank nor Samsung
      is named in the February 2026 press release.

      On February 19, 2026, ZaiNar announced that it had raised more than $100 million,
      reaching a valuation exceeding $1 billion. The announcement described this as the
      culmination of nine years of funding, not necessarily as a single discrete round.
      Named investors in connection with the 2026 announcement include: Steve Jurvetson
      (Future Ventures), Jerry Yang (AME Cloud Ventures), Tom Gruber (Siri co-founder),
      Jaan Tallinn (Metaplanet Holdings / founding engineer of Skype), and Nicholas Pritzker
      (Tao Capital). Dr. Andreas Weigend (former Chief Scientist at Amazon) is described as
      an advisor and investor. Tracxn labeled the February 2026 event as an "Angel" round,
      while svinvestclub.com labeled it "Series A" — neither label aligns with the company's
      own press release, which uses no round-series designation. The absence of a formal
      round label and the compressed timeline of the stealth emergence introduce ambiguity
      about whether the $100M represents the full lifetime raised or the most recent
      tranche.

      The stated valuation of "more than $1 billion" is disclosed only as a floor — no
      precise post-money valuation has been disclosed. No secondary share sales, convertible
      notes, debt facilities, or credit lines have been publicly referenced. Revenue, ARR,
      gross margin, and burn rate are all undisclosed. There is no indication of public
      market activity or a planned IPO as of the run date.
