      diligencePath: >-
        Request a term sheet or financing summary from management; check SEC Form D for
        any exempt offering filings associated with the round.
      relatedQuestionRefs: [QO026]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: minor
      topic: competitive-positioning
      missingEvidence: >-
        No independent comparative analysis of ZaiNar's patent portfolio versus direct
        competitors such as NextNav, Skyhook, or Quuppa has been publicly published.
        The relative scale, scope, and claim breadth of ZaiNar's 90 issued patents versus
        competitor IP portfolios is unknown.
      whyItMatters: >-
        Patent portfolio strength relative to competitors determines defensibility of
        ZaiNar's IP moat. If competitors hold overlapping or superior positioning claims,
        ZaiNar's differentiation and freedom-to-operate could be materially narrowed.
      diligencePath: >-
        Engage a patent analytics firm (e.g., Derwent, Innography, or PatSnap) to compare
        ZaiNar's patent portfolio against NextNav, Skyhook, and other 5G/WiFi positioning
        vendors on citation counts, claim breadth, and forward citations.
      relatedQuestionRefs: [QO023]
