  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: >-
        Individual round amounts and valuations for ZaiNar's pre-2026 stealth financing rounds
        (other than the September 2018 Alchemist seed and the unconfirmed 2021 $11.7M from
        AI Market Watch) are not publicly available.
      whyItMatters: >-
        Without a detailed funding history, it is impossible to assess dilution trajectory,
        prior investor rights, or whether the February 2026 announcement represents a new
        primary round or a disclosure of cumulative historical funding.
      diligencePath: >-
        Request a detailed capitalization table and summary of all funding rounds from ZaiNar
        directly; cross-check against SEC Form D filings (exempt offerings) and PitchBook/Crunchbase
        for any un-paywalled disclosures.
      relatedQuestionRefs: [QO006, QO026, QO027]
      relatedTableRefs: [TO003]

    - type: private-evidence-only
      severity: material
      topic: commercial-traction
      missingEvidence: >-
        No named enterprise or carrier customer has been publicly identified. The binding vs.
        non-binding split within the $450M+ contracts and MOUs figure is unknown.
      whyItMatters: >-
        Non-binding MOUs carry no revenue guarantee and are routinely used in enterprise tech
        to signal pipeline without confirming closed business. If the $450M+ is predominantly
        MOUs, the near-term revenue outlook is materially different from binding contracted
        revenue.
      diligencePath: >-
        Request a breakdown of contracts vs. MOUs with counterparty names (subject to NDA),
        contract duration, payment terms, and commencement dates. Request revenue and backlog
        figures from management.
      relatedQuestionRefs: [QO009, QO013, QO020]
      relatedTableRefs: [TO004]

    - type: missing-source
      severity: material
      topic: headcount
      missingEvidence: >-
        Current headcount (June 2026) is unknown. Tracxn shows only 35 employees as of
        December 2024, which is inconsistent with claimed multi-continent deployments and
        $450M+ in contracts/MOUs.
      whyItMatters: >-
        A 35-person team would be extraordinarily lean to support active commercial deployments
        across healthcare, construction, and industrial verticals on multiple continents.
        Either headcount is materially understated, or the claimed deployment breadth overstates
        operational scale.
      diligencePath: >-
        Request a current organizational chart and payroll headcount from management.
        Cross-check LinkedIn headcount and employee growth trend.
      relatedQuestionRefs: [QO010, QO021]
      relatedTableRefs: [TO001]

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Full board of directors composition — including independent directors, investor-appointed
        seats, and any compensation, audit, or nominating committee structure — is undisclosed.
      whyItMatters: >-
        Board composition and governance quality directly affect investor protection, executive
        accountability, and strategic decision-making oversight, all of which matter for a
        company that has taken $100M+ from named investors.
      diligencePath: >-
        Request board composition, investor rights agreement summary, and voting rights details
        from ZaiNar management. Check Delaware secretary of state filings for any corporate
        governance documents.
      relatedQuestionRefs: [QO001]

    - type: private-evidence-only
      severity: minor
      topic: identity
      missingEvidence: >-
        ZaiNar's founding year is reported as 2017 in the company's press release and 2016 in
        Tracxn, Silicon Valley Invest Club, and other aggregators. The discrepancy remains
        unresolved without a primary incorporation document.
      whyItMatters: >-
        A one-year difference in founding date affects the "nine years of stealth" claim and
        the patent priority date narrative. It is a minor factual inconsistency but affects
        milestone dating precision.
      diligencePath: >-
        Review Delaware (or relevant state) articles of incorporation filing date for Zainar, Inc.
      relatedQuestionRefs: [QO012]

    - type: missing-source
      severity: material
      topic: partnerships
      missingEvidence: >-
        No named telecommunications carrier partner has been publicly announced despite the
        company's February 2026 statement that "major carrier and enterprise partnerships [are]
        to be announced in the coming weeks."
      whyItMatters: >-
        ZaiNar's core go-to-market thesis depends on carrier adoption to monetize 5G positioning
        as a network service. Absence of a named carrier partner four months after the stealth
        emergence is a material signal about the pace of carrier negotiations and potential
        barriers to commercialization.
      diligencePath: >-
        Monitor ZaiNar press releases and news from major US/EU/APAC telecom operators for
        any positioning technology partner announcements. Request pipeline detail and MOU
