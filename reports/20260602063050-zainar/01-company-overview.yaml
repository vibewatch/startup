chapter:
  number: 1
  title: Company Overview
  summary: >-
    ZaiNar, Inc. (Belmont, CA; founded 2017) emerged from nine years of stealth on February 19,
    2026, announcing it had raised more than $100 million at a unicorn valuation exceeding $1 billion.
    The company's patented platform achieves sub-nanosecond time synchronization across existing 5G
    and WiFi wireless networks, enabling sub-meter 3D positioning without new hardware — positioning
    ZaiNar as the "foundation layer of Physical AI." Named investors include Steve Jurvetson
    (Future Ventures, SpaceX board member), Jerry Yang (AME Cloud Ventures), Tom Gruber (Siri
    co-founder), Jaan Tallinn (Skype founding engineer), and Nicholas Pritzker (Tao Capital).
    With 100+ patents filed (90 issued, zero rejections) and $450M+ in contracts and MOUs,
    ZaiNar claims commercial deployments across healthcare, construction, industrial, and smart-city
    verticals on multiple continents. Revenue, detailed headcount, named carrier partners, and
    board composition beyond Steve Jurvetson remain undisclosed.

sections:
  - id: identity-overview
    title: Identity, Product, and Business Model
    body: |
      ZaiNar, Inc. (zainartech.com) is a deep-technology company headquartered at 2 Davis Drive,
      Belmont, California, founded in 2017 (certain data aggregators cite 2016; see evidence gaps).
      After nine years of entirely silent R&D, the company emerged publicly on February 19, 2026,
      announcing it had raised more than $100 million at a valuation exceeding $1 billion —
      achieving unicorn status without a single public press release during its founding period.

      ZaiNar's core innovation is sub-nanosecond time synchronization distributed across existing
      wireless network infrastructure. Because radio waves travel at approximately 30 centimeters
      per nanosecond, achieving synchronization at the sub-nanosecond level translates directly
      into sub-meter three-dimensional positioning accuracy — indoors, outdoors, through walls,
      and around corners. The platform operates entirely on existing 5G, WiFi, and private cellular
      infrastructure already deployed globally, requiring no additional hardware on devices or base
      stations, no proprietary beacons, and no additional battery drain. It is protocol-agnostic
      and claims compatibility with 3GPP Release 16 5G-NR.

      The company markets its offering under the brand "ZPS" (ZaiNar Positioning System), a suite
      encompassing a 5G positioning solution, a WiFi positioning system, a real-time 3D asset
      tracking platform, and a network time synchronization infrastructure layer. A dedicated
      "Zero" model was subsequently announced, targeting WiFi networks specifically. ZaiNar frames
      its commercial proposition as the spatial data foundation that Physical AI — intelligent
      systems that operate in the physical world — requires for real-time coordination and training.

      The business model is B2B: the company licenses or sells its positioning technology to
      telecommunications carriers (to monetize existing 5G infrastructure) and to enterprises
      across healthcare, construction, logistics, industrial operations, smart cities, and defense.
      Its network-side approach — using Sounding Reference Signals (SRS) rather than dedicated
      Positioning Reference Signals (PRS) — bypasses smartphone OS-level restrictions (Apple iOS
      and Google Android both deny PRS access by default except for E911), giving carriers direct
      access to sub-10cm location data on every connected device without OEM cooperation. No
      specific carrier names, pricing tiers, or revenue figures have been disclosed as of the
      June 2026 run date. The company registered its legal entity as "Zainar, Inc." in the
      United States.
