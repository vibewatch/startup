      - number: '2.5'
        title: 尽调缺口与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              最大分析陷阱，是把相邻市场 TAM 混同为 ZaiNar 专属需求。公开数字清楚证明 RTLS 和室内定位是重要市场，但没有隔离出会从一家创业公司购买网络侧 5G 和 Wi-Fi
              定位的那一小块。即使偏乐观的第三方报道，也大多重复 ZaiNar 的 Physical AI 叙事，而没有独立量化一个可直接捕获的市场。广义 RTLS 数字因此适合作背景，不适合直接当作估值分母。


              三个尽调缺口仍然重要。第一，公开来源没有透露定价，因此 SOM
              无法从真实平均交易规模建模。第二，公司仍未公开点名它所称正在推进的运营商和企业合作伙伴，因此管线质量只得到部分验证。第三，买方归属按细分场景而异，并非普遍统一，这会提高销售落地复杂度，也让销售周期更难泛化。审慎读法是，ZaiNar
              面向真实且增长中的需求，但公开证据只支持受限的市场规模测算，不应被用来夸大近期收入捕获。
            claimRefs:
