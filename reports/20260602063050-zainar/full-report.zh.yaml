      - number: '7.4'
        title: 伙伴、依赖与竞争性打包风险
        blocks:
          - type: paragraph
            body: >-
              最重要的依赖仍是网络所有者。ZaiNar 的卖点在一种情况下最强：它能把已安装的 5G 或 Wi-Fi 基础设施变成新的感知层，且不需要大量新增硬件。但这个优势只有在运营商、专网所有者或企业 IT
              团队允许集成、投入商业资源并为生产部署背书时才会变现。今天的公开证据显示这种依赖真实存在，而证明仍偏薄：ZaiNar 承诺过重大运营商公告，但审阅来源仍没有具名运营商伙伴。


              同时，既有厂商已经控制了大部分购买界面。Nokia 私有无线业务、Cisco Spaces 和 HPE Aruba
              都展示了位置或位置相关价值如何被打包进更宽的网络项目，并带上支持、服务、采购信任和既有账户覆盖。Cisco 自己的资产跟踪产品仍使用 BLE 标签，这正是 ZaiNar
              想避免的硬件负担。但这也说明风险：如果方案来自买家已经信任的网络运营和支持供应商，买家可能接受一定新增硬件或部署成本。因此，竞争压力并不要求既有厂商完美匹配
              ZaiNar。它们只需要“足够好”，同时降低供应商风险。


              依赖地图还穿过标准时点、伙伴合规和资本。Ericsson 的 Release 18 摘要显示，定位能力在标准层仍在演进。EPAM 指出，电信运营商必须选择能够跟上隐私和安全规则的伙伴。如果 ZaiNar
              的证明周期比预期更长，这些伙伴和合规依赖可能在公司披露单位经济模型前，先转化为融资压力。
