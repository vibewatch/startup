      - number: '8.5'
        title: 能把结论从观察推向可投资的最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              好消息是，核心尽调阻断项具体且可知。这个案例不需要投资人做不可能的宏观预测；他们需要更好的运营资料包。公司可以通过拿出合同质量桥、开票和收入桥、软件与服务的毛利率拆分、具名客户和运营商参考，以及股权结构摘要，显著改善估值支撑。这些要求直接回答当前迫使分析落在情景区间、而非更紧估值框架中的开放问题。


              什么会改变观点？如果一套干净材料显示 $450 million
              标题中的大部分有约束力且可变现，早期部署能转化为经常性收入，并且部署经济性仍以软件为主，建议会很快上调。价格重置也可能改变答案，即便披露仍不完美，因为当前问题不是 ZaiNar
              是否有意思，而是入场倍数是否已经假设了过多证明。


              在这两个变化发生之前，最诚实的结论是有纪律的耐心。ZaiNar 未来可能远超 $1B 价值，但当前公开证据不足以让外部投资人认定，公司以当前公允价值口径已经值这么多。
