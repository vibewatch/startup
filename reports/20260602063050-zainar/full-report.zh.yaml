      - number: '2.2'
        title: TAM、SAM 与证据约束下的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 的公开市场规模必须按区间处理，而不是单一数字。最宽的相邻市场是 RTLS 和室内定位，但公开估算差异很大：Mordor 估计 2025 年 RTLS 为 USD 7.13
              billion，Global Growth 估计室内定位为 USD 12.38 billion，TBRC 估计 RTLS 为 USD 14.82 billion。远期预测差异更大，从 2031 年 USD
              25.81 billion 到 2030 年 USD 53.26 billion 不等。这些数字在方向上有用，因为它们确认买方已经为位置可视化真实花钱；但它们不能直接比较，因为边界、年份和方法论都混在一起。


              最站得住脚的公开 SAM 视角更窄。MarketsandMarkets 将制造和汽车 RTLS 在 2025 年的规模测算为仅 USD 1.19 billion。这个口径有用，因为 ZaiNar
              已点名工业、物流和建筑用例，而在复杂场地里增强棕地 5G 或 Wi-Fi 尤其可信。医疗也很重要：Mordor 称其为最大 RTLS
              垂直行业，其他报告则把需求与患者安全、资产利用率和报销挂钩。公开证据没有给出网络侧 5G 或 Wi-Fi 定位的独立市场规模，因此任何 ZaiNar 专属 SAM 或 SOM
              都必须保持受限且低置信度。正确读法是，ZaiNar 卖进的是一个真实市场族群，但它自己可直接捕获的分母仍未在公开资料中被证明。
