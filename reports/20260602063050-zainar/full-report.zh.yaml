        - 轻硬件定位可能比许多 RTLS 替代方案带来更好的经济性。
        - 市场报告仍显示 RTLS 领域有显著硬件负担。
        - 如果证据显示规模化部署仍以软件为主，就能验证毛利溢价。
      - - 反向逻辑
        - 公司估值可能跑在商业证据前面。
        - 没有公开收入、毛利率或烧钱速度披露，也没有公开拆分合同与 MOU。
        - 清晰的开票 / 收入桥接会削弱这一反对意见。
      - - 反向逻辑
        - 既有厂商已经占住采购界面。
        - Cisco、HPE Aruba、Qualcomm、Zebra、Quuppa 和 Humatics 都显示出相邻或直接竞争。
        - 具名运营商或渠道胜利会降低分销折价。
      - - 反向逻辑
        - 如果证据不到位，下一轮可能重新定价。
        - NextNav 表明，即便能进入公开市场，定位基础设施仍可能保持资本密集。
        - 下次融资前，如果能看到订单储备转成收入，议价能力会改善。
    notes: 支撑与反向支撑都相对价格展开，而不是泛泛讨论公司质量。
