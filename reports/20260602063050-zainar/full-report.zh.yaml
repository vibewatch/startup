          value: 300
          detail: 一旦分发和续约有可引用案例，EV 支撑会明显抬升。
          tone: positive
        - label: 软件毛利率证据
          value: 250
          detail: 更干净、软件占比更高的毛利率画像会收窄折价。
          tone: positive
        - label: 服务 / 硬件负担
