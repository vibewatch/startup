      - number: '5.3'
        title: 部署、成熟度、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 已经走得比纯实验室概念更远，但公开记录仍不足以证明它是证据充分的生产平台。最强的成熟度标记是时间线和专利组合。经过九年隐身 R&D 后，公司于 2026 年 2 月公开亮相，宣布融资和部署；随后在
              2026 年 3 月宣布 5G 定位产品商业可用。围绕 Zero 的二级报道暗示，同一论点延伸到了 Wi-Fi 专用场景。这个序列足以说明这里有产品故事和发布节奏，而不只是科学项目。


              较弱的是运营证明。公司没有发布具名运营商客户、供应商认证的集成文件、公开支持手册、状态页、可靠性指标或服务级别承诺。因此，部署故事用例丰富，但运营方证据稀疏。对尽调来说，正确的成熟度标签是“带叙事证据的商业化中”，而不是“已在规模上完成运营基准验证”。可能的支持模型也需要较重服务介入。存量基础设施上的位置层仍要求每个站点做
              RF 调优、网络配置、工作流集成，以及隐私或政策设置。医院、工厂和园区尤其如此：多径、干扰和布局变化会侵蚀准确性，即便底层算法本身可靠。


              路线图一部分可见，一部分不透明。公开可见里程碑包括隐身 R&D、2026 年 2 月亮相、2026 年 3 月 5G 商业发布，以及 Wi-Fi Zero 叙事。Release 18 的标准进展通过
              RedCap、带宽聚合、低功耗高精度定位和
              sidelink，扩展了中期可服务范围。仍缺的是投资人通常想看的前向运营细节：具名运营商铺开、支持节奏、认证路线图、集成伙伴和可复用参考部署。在这些出现前，路线图信心应放在标准和专利轨迹上，而不是放在完整披露的发布计划上。
