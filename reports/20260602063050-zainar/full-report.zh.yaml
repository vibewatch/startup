      - number: '1.4'
        title: 规模、商业牵引力与里程碑
        blocks:
          - type: paragraph
            body: |
              ZaiNar 的知识产权位置，是公开记录中最具体、可量化的事实之一。
              截至 2026 年 2 月新闻稿，公司已提交 100 多项专利，90 项已授权，且 0 次驳回。
              Justia 的专利搜索结果确认，多项授权专利归属于 “ZaiNar, Inc.”，
              覆盖资产追踪、资产分组、错误恢复，以及基于相位的时间同步方法和系统。
              PlainPatent 记录同样确认该专利组合存在。公司自己把成熟 RF 工程领域的
              100% 授权率描述为统计异常，独立来源没有反驳这一说法。

              商业侧，ZaiNar 称截至 2026 年 2 月亮相时，已拿下超过 $450 million 的
              合同和谅解备忘录（MOU）。这是一个显眼数字，但证据强度有限：$450M 把有约束力合同
              和无约束力 MOU 混在一起，两个类别都没有单独量化，也没有公开具名任何企业或运营商客户。
              公司在同一份新闻稿中称，“主要运营商和企业合作伙伴关系将在未来几周公布”——
              但截至 2026 年 6 月运行日期，公开来源没有发现具名运营商伙伴公告。这个缺口很重要。

              公司 2026 年 2 月新闻材料称，产品已在多个大洲的医疗（定位医院医疗设备）、
              建筑（让工人远离危险区域）、工业 / 物流（协调自动化运营）场景商业部署。
              “Zero” 模型新闻稿又补充了厘米级分辨率的 WiFi 专用定位。第二份约 2026 年 3 月 4 日的
              新闻稿宣布 5G 定位技术可商用，在 CBRS Band 48、20 MHz 带宽下展示 10cm 以下精度，
              读取距离为 1.5 km。

              国际扩张的证据，是 ZaiNar 开设 Tokyo 办公室，并入选 Tokyo Metropolitan Government 的
              GX Innovation Program；这一点见公司官网。截至运行日期，这是唯一被具体具名的国际合作
              或政府项目。

              员工数是显著缺口：Tracxn 显示，截至 2024 年 12 月 31 日，Zainar, Inc. 法人实体有
              35 名员工。对于一家声称在多个大洲部署、拥有 $450M+ 合同的公司，这个团队极其精简。
              Craft.co 资料最多列出 7 名具名高管 / 员工；一手来源没有组织架构图或更广泛员工数。
              声称的商业规模与可观察员工数之间的差距，需要进一步尽调。
