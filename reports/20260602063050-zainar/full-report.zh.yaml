      - number: '7.5'
        title: 财务、人员与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              财务风险不太像今天已经明显陷入困境，而更像公开证据不足以支撑后期承销。ZaiNar 已融资超过 $100 million，并声称商业动能可观，但仍不披露价格、收入、毛利率、烧钱速度或积压订单
              转化。投资人因此无法测试公司是在打造软件占比高、高毛利的平台，还是服务占比高、回本更慢的集成业务。Capgemini 和 Aexus 都指向漫长、多利益相关方的企业和电信采购动作；NextNav
              的公开文件提醒我们，位置基础设施即便技术故事可信后，也可能长期吃资本。


              执行风险也不低。Tracxn 的员工数信号和 Craft 有限的公开领导层名单，相对于公司描述的部署宽度显得偏轻。公开材料仍没有披露 CFO、VP Sales 或明确具名的合规负责人。Equilar 和
              TechCrunch 进一步显示，Daniel Jacker 是可见的高管重心。这在早期市场进入阶段可能是优势，但当公司看起来需要更多制度化深度时，也造成关键人集中。


              缓解路径很直接，即便答案目前仍是私有的。管理层可以通过拿出具名伙伴参考、合同质量桥、试点转生产的 可靠性指标、当前组织深度，以及 12
              个月现金和毛利率视图，迅速清掉本章大部分问题。投资逻辑破裂触发点同样清楚。如果具名伙伴证明持续缺席，如果 $450 million
              标题数字仍无法拆解，或如果生产精度和利润率在下一轮融资周期前仍不可审计，投资案应从“高上行但有条件”下调为“以当前价格看过于不透明”。
