          - type: callout
            title: 上行来自沉没基础设施之上的软件型经济性
            body: 如果 ZaiNar 能让部署主要由软件、分析和 API 驱动，其利润率结构可能显著优于锚点加标签的 RTLS 既有厂商。这是最核心的财务乐观逻辑。
            calloutType: insight
            claimRefs:
              - CI001
