  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 联网设备无线电发射（5G SRS / 其他上行信号、Wi-Fi 流量）
        - 提供网络可观测的可测量信号事件
        - 需要活跃联网设备和可用无线电几何
        - 流量模式、调度和弱信号条件可能降低测量质量
      - - 时间同步底座
        - 让时钟对齐到足以使到达时间和相位估计有意义
        - 需要基础设施层面的稳定时钟、校准和漂移管理
        - 任何定时误差都会直接拉低定位精度
      - - gNB / TRP / AP 侧测量采集
        - 从已安装网络采集时间、角度或相位观测
        - 取决于基站和 AP 能力、点位，以及对测量路径的访问
        - 厂商异构和缺失接口会阻断可移植性
      - - 位置计算 / 类 LMF 引擎
        - 把多路测量融合为位置估计和置信输出
        - 需要同步输入、带宽上下文和过滤逻辑
        - 算法质量本身无法弥补差测量或缺失几何
      - - 工作流与 API 层
        - 把坐标转为告警、可视化、自动化和运营商产品
        - 依赖客户系统、权限和应用逻辑
        - 缺少强集成时，位置数据会变成闲置资产
      - - 隐私 / 政策 / 审计控制
        - 限制谁能在什么条件下看到哪些位置数据
        - 依赖企业政策、用户权限和电信合规
        - 未授权追踪或过度留存会带来法律和声誉风险
      - - 实施与支持动作
        - RF 勘测、调优、部署、监控和问题分诊
        - 依赖熟练现场工程和伙伴协调
        - 高接触交付可能侵蚀软件毛利，并放慢规模化
    notes: 本表混合了已验证的标准概念和推断的 ZaiNar 运营步骤，因为公司尚未发布正式架构图。
