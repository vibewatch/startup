      - number: '5.4'
        title: 差异化、IP 与关键依赖
        blocks:
          - type: paragraph
            body: >-
              护城河逻辑真实但有条件。如果 ZaiNar 能稳定从沉没的 5G 和 Wi-Fi 基础设施中提取高精度位置，它就击中了 RTLS 最顽固的痛点：安装和校准负担。独立市场基准说明了为什么这重要。RTLS
              很大一部分仍依赖硬件，标签、锚点、读取器和网关主导部署设计，专用部署成本会迅速上升。在这个背景下，一个软件主导的叠加层把现有无线电变成空间基础设施，即便还不讨论绝对精度，战略上也有吸引力。这是 ZaiNar
              最干净的差异化。


              第二个护城河元素是专利组合。独立专利来源显示，公司围绕同步、到达时间估计、多载波相位定位、多径时间戳、时钟校准和资产工作流建立了覆盖。这一范围说明防御性落在测量和系统层，而不只是应用层。它也为 ZaiNar
              如何跨 5G 和 Wi-Fi 同时保留共用核心提供了合理解释。不过，专利本身不能消除依赖风险。架构高度依赖运营商或专网集成、合适的无线电几何关系、足够的 AP 或 gNB
              密度，以及标准和供应商实现的演进。产品越依赖同步的网络侧测量，就越会继承真实 RF 环境的杂乱。


              这是关键的反向视角。产品的差异化恰恰来自复用他人已经拥有的基础设施。但这种复用也带来对运营商、企业网络团队和每个现场物理环境的依赖。多径、遮挡、非视距条件、布点不佳或配置不足，都可能压缩优势。商业因素也会压缩优势：未具名的运营商伙伴、缺席的互操作性披露，以及封闭的外部工程界面，让外界很难判断系统跨供应商迁移能力。正确尽调结论是，ZaiNar
              大概率有有意义的产品切口和真实 IP，但其最强主张仍取决于伙伴集成质量和 RF 现实，而不是只取决于专利。
