  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与公开模块图
        blocks:
          - type: paragraph
            body: >-
              按客户工作流看，ZaiNar 卖的是网络侧位置层，不是消费者 app，也不是经典标签加锚点套件。公司公开材料称，现有 5G 和 Wi-Fi
              基础设施可以变成感知系统，持续推导联网设备、资产或员工的位置，再把空间上下文送进企业和运营商工作流。医院里任务是找设备；建筑工地是感知危险区域；工业现场是协调机器与工人；运营商场景则是把已部署无线基础设施中的位置能力变现。这个定义很重要，因为只有当位置成为运营输入，而不只是更漂亮的地图时，产品才有价值。


              可见的模块图比宣传口径窄，但仍然自洽。公开信息中可以识别出同步与授时核心、5G 定位层、Wi-Fi/Zero 定位层，以及资产跟踪、安全自动化、自主协调等工作流级应用。5G 产品最具体：ZaiNar
              声称已商业可用，可从连接信号中做网络侧感知，且用户设备不需要安装软件。Wi-Fi 一侧的公开证据成熟度更低：Zero 出现在二级报道中，而 Wi-Fi Alliance 基准展示的是主流基础设施主导的 Wi-Fi
              定位通常能交付什么。务实判断是，ZaiNar 更像一个共用同步与定位栈，前端接入不同无线制式，而不是一堆彼此独立的 SKU。


              有两个细微点需要强调。第一，“设备无需软件”不等于“系统无需集成”；网络侧定位仍依赖测量采集、授时分发、运营商或企业网络配置，以及工作流集成。第二，“无需新增硬件”是一个商业主张，意思是避免专用的通用位置基础设施，并不证明每一次部署或每个工作流都能避免所有补充资产或现场工作。专利组合同时覆盖纯定位方法和资产标签工作流方法，也说明真实产品线比最短营销话术更宽、更有条件。
