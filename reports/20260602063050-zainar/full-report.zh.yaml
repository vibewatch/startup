  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 的公开材料支持的是软件主导的变现逻辑，而不是已量化的收入基础。公司描述的是一个定位层：它把既有 5G 和 Wi-Fi 基础设施变成感知系统，不需要新硬件；2026 年 2
              月融资公告则称公司正与全球运营商和企业伙伴加速部署。这些披露，加上围绕 Zero 的二手报道，让几条变现路径变得可信：向运营商销售授权或网络软件、面向医院和工业场地的企业软件订阅、部署或集成服务、API
              或数据平台费用，以及在买方仍需要附着设备或网关工作流时，可能由合作伙伴主导的标签或覆盖层收入。


              问题在于，这些路径没有一条在公开资料中有价格。已审阅来源没有披露公开标价、实际成交价、合同期限、平均交易规模、ARR 或已确认收入。相反，ZaiNar 对外宣传的是合同和谅解备忘录合计超过 $450
              million。这个标题对需求方向有利，但不足以做收入确认分析。IFRS 15 将收入建立在客户合同和履约义务完成之上，而 ZaiNar
              的披露混合了有约束力和无约束力工具，并省略可执行性、付款条款和时间安排。因此，正确的财务读法应保守：需求信号已验证，但收入质量未验证。管理层在拆分有约束力积压订单与
              MOU，并说明合同如何转化为开票和收入之前，$450 million 数字应被视为管线或预订背景，而不是收入证据。
