  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：观察，保持价格敏感，不要仅凭公开证据承销标题估值
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 在大市场中有可信存在理由。前文支持一个真实产品切口：如果公司能把现有 5G 和 Wi-Fi 变成无需新增硬件的亚米级定位，它就击中了 RTLS 最大采用摩擦之一。市场背景也有建设性。Mordor 和
              TBRC 都显示，随着工业自动化、医疗、物流和自主系统项目需要更好的位置数据，RTLS 品类在快速增长。这足以值得关注。


              但这不足以支撑盲目以 $1B-plus 进入。核心承销问题与财务、客户和风险章节一致：ZaiNar 披露了估值标题和“合同加 MOU”标题，却没有披露已确认收入、ARR、毛利率、烧钱速度、积压订单
              转化或股权结构条款。公司可能早期且优秀，但公开投资人无法判断这个故事是在变成软件平台、重服务部署业务，还是仍处于收入前的商业化押注。Stanford 的 MOU 指引和 IFRS 15
              在这里不是技术细节；它们正是 $450 million 标题不能被当作收入质量证明的原因。


              因此，正确判断是有条件的。公开证据支持接触，不支持在当前价格上形成确信。建议：观察 / 继续研究。置信度：中。风险评级：高。估值立场：基于当前证据偏高；只有下一层尽调证明有约束力
              积压订单、具名客户和软件占比高的毛利率时，才可能撑住。以披露的标题估值看，下行情景的不对称性仍主导基准情景。
