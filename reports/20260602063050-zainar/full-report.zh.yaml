      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 最强的公开差异化在于能力打包，而不是位置智能是否存在。公司材料称，既有 5G 和 Wi-Fi 基础设施即可提供亚米级或 10cm
              以下定位，不需要新硬件、设备制造商配合或额外电池消耗。已审阅集合中的大多数既有供应商，通过更重的技术栈解决同样的运营任务：标签、读写器、BLE 信标、UWB
              锚点、定制模块或集成传感器。Quuppa、Ubisense、Inpixon、Impinj 和 Qorvo 在当前工作流广度上，都有比 ZaiNar 更强的公开证据，但也意味着更多硬件依赖。Cisco Spaces
              和 HPE Aruba 是最清晰的基础设施切入相邻玩家，因为它们已经使用已部署 Wi-Fi 基础设施；但即便如此，它们在许多用例中仍依赖 BLE 标签或 Wi-Fi 遥测，且当前公开宣传的精度明显低于
              ZaiNar 的主张。


              定价远不如能力透明。在已审阅的 ZaiNar、Quuppa、Cisco Spaces、Qorvo、Humatics、HPE Aruba 和多数企业 RTLS
              供应商中，公开包装几乎都是报价制或合作伙伴中介模式，而非自助式公开标价。除非管理层能证明部署规模下交付的总拥有成本，否则任何“比既有 RTLS 更便宜”的简单说法都站不稳。GTM
              不对称更清晰：Zebra、Cisco、HPE、Qualcomm 和 Nokia 已经在大型渠道、运营商或企业采购流程内部；Impinj 和 Qorvo 控制关键组件生态；Quuppa
              有明确合作伙伴网络。ZaiNar 技术上可能优雅，但它进入的市场里，通往预算的既有路径往往从已经销售网络、标签、读写器或工作流软件的供应商开始。
