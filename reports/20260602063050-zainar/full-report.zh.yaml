  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - $450M 口径大部分偏 MOU；具名运营商或客户证据仍缺席；部署仍偏集成。
        - 估计 EV $0.25B-$0.6B；在 $1B 入场且稀释前，意味着约 0.3-0.6x 总价值。
        - 降价轮、优先权包袱、服务占比重的毛利结构，以及无法形成客户背书。
        - 如果尽调无法验证具约束力订单储备或经常性收入，概率就具有实质性。
      - - 基准
        - 订单储备中有一部分具实质约束力；首批具名部署转化；业务是软件加显著服务的混合体。
        - 估计 EV $0.8B-$1.4B；在 $1B 入场且稀释前，意味着约 0.8-1.4x 总价值。
        - 长销售周期、毛利率模糊和既有厂商捆绑限制上行。
        - 今天公开数据下最可信的情景。
      - - 乐观
        - 具名运营商或渠道证据出现；客户续约；毛利率证明业务以软件为主；市场把 ZaiNar 视为稀缺基础设施软件。
        - 估计 EV $2.0B-$3.5B；在 $1B 入场且稀释前，意味着约 2.0-3.5x 总价值。
        - 执行失误、隐私摩擦，或硬件与服务占比爬升，会侵蚀溢价。
        - 需要通过多道尽调闸门，才能给予较高权重。
    notes: 区间是推断性的情景括号，不是精确 DCF 或经审计的收入倍数模型。
    claimRefs:
      - CV017
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
