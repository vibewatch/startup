        - 未公开披露
        - 定位软件 / 网络叠加层
        - 标价、实际成交价和硬件假设未知
        - 买方 ROI 说法有合理性，但目前无法用公开成本基准验证
      - - Cisco Spaces
        - 许可证 / 云平台 + 按需标签 / 合作伙伴应用
        - 平台、分析、资产追踪、API、合作伙伴应用
        - 未显示公开标价；产品包深度随用例变化
        - Cisco 可打包进既有网络关系，销售更宽的办公场所 / 运营结果
      - - HPE Aruba
        - 按报价销售企业网络
        - 在 AP、Central、BLE、Wi-Fi FTM 之上叠加位置服务
        - 无公开标价
        - Aruba 可把定位做成网络更新的追加销售，而非独立采购
      - - Nokia
        - 项目制专用无线 / 工业解决方案销售
        - 连接、集成、托管服务、工业数字化
        - 定位很少单独拆出价格
        - 位置能力可打包进大得多的专用无线预算
      - - Quuppa
        - 按报价 / 合作伙伴主导
        - BLE RTLS 软件 + 标签 + 合作伙伴生态
        - 无公开标价
        - 与 ZaiNar 对比必须用交付后部署成本，而非标价
      - - Impinj
        - 通过合作伙伴销售组件 + 平台
        - RFID 芯片、读写器、平台、服务
        - 读写器 / 标签经济性随合作伙伴和部署而变
        - 在 RFID 单位经济性已成立的单品级追踪场景很强
      - - Inpixon
        - 企业按报价
        - RTLS、流程应用、分析、AI、集成
        - 无公开标价
        - 当流程软件而不只是坐标驱动采购时，可能胜出
      - - Qorvo
        - 组件 / 模块按报价
        - UWB IC、软件、模块、参考设计
        - 无公开标价；OEM 和合作伙伴经济性主导
        - 作为赋能栈，可压低下游 UWB 对手的组件成本
      - - Humatics
        - 企业按报价
        - 高精度定位解决方案
        - 无公开定价
        - 可能卖给狭窄高价值流程；在这些场景，精度比平台广度更重要
    notes: 公开定价大多不透明。审阅的大多数供应商采用联系销售团队或合作伙伴主导打包， 因此比较聚焦产品包结构和采购动作，而非明确标价。
