      - number: '4.4'
        title: 公开牵引力、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开层面有商业牵引力，但承销所需的财务输入不存在。ZaiNar 已披露累计融资超过 $100 million、估值超过 $1 billion、提交专利逾 100 项且 90
              项已授权，并已在多个垂直行业和大陆部署。Tracxn 还显示，其 2024 年底只有 35 名员工，到 2026 年 4 月为 50
              名；相对于运营商集成和跨洲企业部署暗示的商业野心，运营底盘仍然偏轻。缺失项比已披露项更关键：手头现金、月度烧钱、债务、资本开支、积压订单账龄、DSO、回款和已确认收入均未披露。


              可比的上市定位公司进一步凸显缺口。NextNav 2024 年年报称，其收入仍然有限，主要依靠债务和股权融资，录得 $101.9 million 净亏损，2024 年经营性现金流出 $38.0
              million，年末现金及有价证券 $80.1 million，并仍预期未来需要股权或债务支持。ZaiNar 不是
              NextNav，但比较有用：两者都处在有技术深度且商业化复杂的位置基础设施赛道。在这个背景下，累计融资超过 $100 million 不会天然显得过高；如果运营商和企业铺开需要长期试点、集成工作和持续
              R&D，甚至可能偏保守。但资本充足性不能只靠融资历史承销。管理层披露烧钱速度，并把 积压订单转化为透明开票额和收入之前，从分析意义看，公司仍依赖外部融资，即便实践中未必马上缺现金。
