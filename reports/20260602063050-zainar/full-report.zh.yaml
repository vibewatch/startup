        - 扩张驱动 + 渠道依赖
        - 如果运营商把 ZaiNar 嵌进更大的产品包，规模化可能提速
        - 索取直接与间接预订额拆分，以及头部合作伙伴贡献
      - - 解决方案打包预期
        - 执行风险
        - 客户可能要应用、分析、服务和支持，而不只是坐标
        - 索取软件与服务毛利率，以及合作伙伴交付模型
      - - 头部客户集中
        - 集中度风险
        - 如果交易对手不多，少数灯塔客户可能撑起 $450M 口径
