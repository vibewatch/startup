              最容易取得的公开市场数字，把硬件占比高的 RTLS、室内定位和多种无线技术捆在一起。ZaiNar 可能受益于这个品类增长，但没有公开来源隔离出它真正试图变现的网络侧切口。因此，投资人应把广义 TAM
              当作背景，而不是近期收入分母。
