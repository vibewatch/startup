      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              技术上可信的架构版本从授时开始，而不是地图软件。ZaiNar 的公开论点是，无线电波每纳秒大约传播 30
              厘米，因此如果网络中的时钟能在亚纳秒粒度上对齐，到达时间和相位测量就足以支撑亚米级甚至厘米级定位。这个逻辑与 5G 标准路径和公司专利组合方向一致。独立技术来源显示，NR 定位已经覆盖下行 PRS、上行
              SRS、TDoA、AoA、RTT，以及 Release 18 中的载波相位增强。公司的具体切入口，是强调网络侧使用连接信号，而不是走手机控制的 PRS 路径。


              这个差别很关键。在标准框架中，PRS 是 gNB 向 UE 发送的下行定位参考信号，而 SRS 是 UE 发送、网络测量的上行探测参考信号。OpenAirInterface
              文档和其他技术来源显示，这些路径实现方式不同，控制面成熟度也不同。ZaiNar 的营销语言更像 SRS 权重更高、由网络计算的模型：如果设备本来就必须发射连接信号，网络就能估计时间、角度或相位，不必等待 app
              权限或 OEM API。这相对设备侧或以 app 为中心的位置栈是一个真实概念优势。但它没有消灭硬工程。高精度网络侧定位仍依赖同步的 gNB 或
              AP、表现良好的测量窗口、合适带宽、良好几何关系，以及能把测量融合成稳定估计的位置管理层。


              因此运营模型大致是：联网设备发出普通无线电信号；已安装网络捕捉时间或相位观测；同步与定位引擎把这些测量归一化；API 或工作流软件再把坐标转化为告警、可见性或协调动作。在 Wi-Fi 上，公开基准仍明显弱于
              ZaiNar 的承诺：Wi-Fi Alliance 谈的是米级室内位置，Android 的 Wi-Fi RTT 文档描述的是 1-2 米结果，并明确要求设备、AP、权限和前台 app。这一差距正是 ZaiNar
              的 Wi-Fi 主张有意思的原因；也正是直接技术基准出现之前，需要谨慎解读的原因。
