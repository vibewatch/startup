      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 模式复杂且高接触。在运营商侧，ZaiNar 实际上在销售承载业务结果的网络软件：让运营商从沉没 5G 资产中抽取更多价值，并可能在公司声称定位价值可超过连接本身的地方实现变现。在企业侧，Cisco
              和 HPE 等相邻供应商把位置能力打包进更宽的智慧空间、资产追踪和分析方案，方案包含入门配置、支持、API 和采购选项沟通，而不是自助结账。这一点很重要，因为它说明即使核心产品以软件为主，ZaiNar
              也不太可能呈现快速、轻量的 SaaS 销售动作。


              外部代理指标指向同一方向。Capgemini 的 2026 年电信调查称，65% 的 B2B 买方认为电信采购流程过于复杂，68% 希望获得集成方案，61% 对集成型方案的售后支持不满。Optifai 认为
              B2B SaaS 周期中位数为 84 天，$100K 以上企业交易需要 90-180+ 天；Aexus 则认为，涉及基础设施变更和多个部门的企业软件通常需要 9-18 个月或更久。这些数字不是 ZaiNar
              指标，但方向上有用。它们意味着跨季度试点、安全审查、采购和售后赋能成本。公开数据没有披露 ZaiNar 客户名称、续约、转化率、销售员工数或营销支出，因此
              CAC、回本周期和销售生产率都无法建模。最多只能说，这看起来像一个长周期的运营商与企业基础设施销售，而不是短周期产品驱动动作。
