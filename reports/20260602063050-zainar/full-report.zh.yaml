      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              几股力量正在明确推动这个品类前进。广义 RTLS 来源强调数字孪生、工业自动化、仓库可视化、医院安全工作流和自主导航。MarketsandMarkets 特别把制造业需求与
              AGV、工人和在制品追踪联系起来。Ericsson 的 Release 18 摘要显示，高级 5G 定位在标准层继续成熟；Wi-Fi Alliance 和 ZaiNar
              也都强化了同一个吸引力：使用买方已经运营的基础设施，而不是另铺一套只为定位服务的硬件。


              反向约束同样重要。Mordor 明确把隐私和网络安全列为增长拖累，Nature 则详细列出攻击面：欺骗、干扰、恶意干扰和未经授权追踪。Cambridge
              补充说，室内环境仍然困难，因为多径、遮挡和环境变化会拉低性能，并增加混合系统需求。成本和集成也是真约束。Mordor 称，一个 100,000-square-foot 工厂的基础设施支出可能超过 USD
              150,000，校准不佳会摧毁承诺精度；Global Growth 则提到互操作性和硬件兼容问题。因此，采用逻辑不是“市场大 +
              精度更好”这么简单。买方确实想要更好的空间感知，但仍需要证明经济性、隐私治理、集成路径和校准负担能在自己的场地里跑通。
