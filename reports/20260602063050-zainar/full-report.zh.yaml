      - number: '5.5'
        title: 信任、安全、信息安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              一个把无线电基础设施变成位置传感器的产品，会同时继承定位系统的机会和风险画像。好消息是，公开基准已经展示了一些重视隐私的模式。Wi-Fi Alliance 描述了无需单独基础设施的客户端相对 Wi-Fi
              Location，Android 的 Wi-Fi RTT 模型则把测距结果留在请求设备上，同时施加前台和权限约束。这些例子重要，因为它们说明位置产品可以围绕数据最小化和权限边界设计。不过，ZaiNar
              的网络侧模型把价值移向网络运营商或企业控制器。这对运营商有战略吸引力，但也提高了政策、同意、留存、访问控制和可审计性的要求。


              威胁模型并不轻。独立的室内定位系统综述把欺骗、干扰、恶意扰动、未经授权的跟踪和隐私泄露列为核心风险。这些对 ZaiNar 不是抽象问题；任何承诺在室内、室外和无 GPS
              环境中提供高保真空间感知的系统，都会天然面对这些风险。此外，面向电信的商业化处在 FCC
              监管、州隐私规则和更广泛数据治理义务之内。如果运营商用位置创造新产品，它们也会继承围绕用户权利、伙伴合规，以及多少数据必须匿名化或留在本地的问题。


              最大的信任缺口是披露，而不是概念。审阅到的公开证据没有显示 ZaiNar 的安全认证、隐私架构、渗透测试结果、公开 SLA，或 SOC 2、ISO 27001、HIPAA
              映射、运营商级运营承诺等受监管行业证明。缺席不证明薄弱，但意味着当前信任只能从品类逻辑承销，而不能从公司特定控制承销。对投资人和企业买家来说，这是典型的尽调分裂：技术想法可能很强，但信任栈仍需要直接证据。
