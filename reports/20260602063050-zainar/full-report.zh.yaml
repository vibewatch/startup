  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序与承销框架
        blocks:
          - type: paragraph
            body: >-
              风险栈异常耦合。最醒目的商业证明点——超过 $450 million 的合同和 MOU——也是最大的承销弱点，因为公司尚未公开拆分有约束力
              积压订单和更软性的意向表达，尚未具名交易对手，也未展示转化为已开票收入。于是，订单质量风险被推到首位。第二和第三项风险紧密相连：商业化似乎依赖运营商和网络所有者合作，而美国电信和隐私规则把位置数据视为敏感且越来越可执行。如果
              ZaiNar 判断正确，运营商会获得强大的新产品层；如果隐私控制或伙伴治理失效，同一渠道也会变成卡住增长的瓶颈。


              下一组风险是技术。公开材料对厘米级或亚米级精度、抗欺骗韧性和广泛部署就绪度提出了雄心勃勃的主张，但独立证据基础仍主要停留在品类层面，而不是 ZaiNar 特定层面。Nature、Cambridge、NIST 和
              CISA 都说明，室内 RF 系统为什么仍暴露在多径、干扰、伪基站行为、蓄意干扰和安全关键故障模式下。这些都不能证伪 ZaiNar；但意味着公司还没有在公开尽调中赢得“默认运营商级和安全级”的假设。


              最后排序的风险是竞争、财务和组织。Cisco、Nokia 和 HPE 已经把捆绑的网络和位置相关项目卖给类似账户。电信和企业基础设施销售周期很长，而 ZaiNar
              仍不披露价格、收入、毛利率、烧钱速度和交易对手集中度。公开可见的领导层深度也偏薄，和跨洲部署所暗示的规模不匹配。因此，正确投资姿态是有条件，而非直接否定：如果具名伙伴证明、可执行
              积压订单和可复用现场表现到位，上行真实存在；如果这些证明在下一轮融资周期中仍不透明，投资逻辑会迅速破裂。
