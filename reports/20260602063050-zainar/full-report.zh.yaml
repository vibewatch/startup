  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接竞争者、既有巨头、相邻玩家与现状替代
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 面对的不是一个整齐的同业集合。直接可比组是一小批试图从既有连接基础设施或相邻软件层抽取位置智能的供应商：Qualcomm 的地面定位服务、Nokia 私有无线、Cisco Spaces 和 HPE
              Aruba 位置服务，都在营销某种搭在现有网络资产上的位置感知服务，而不是要求完整建设专用锚点网络。这些公司与 ZaiNar 并不相同——Cisco 和 HPE 很大程度依赖 Wi-Fi 和 BLE
              遥测，Nokia 卖的是比定位更宽的私有无线项目，Qualcomm 则似乎把地面定位放进更大的 IoT 和连接技术栈——但它们重要，因为它们攻击的是同一个棕地升级预算故事。


              更大的既有巨头集合是经典 RTLS：Zebra、Impinj、Quuppa、Ubisense、Inpixon 和
              Humatics。它们解决重叠任务——资产可视化、工作流自动化、安全、堆场管理、预测性维护和工业协同——但硬件哲学通常不同。Quuppa 强调基于 Bluetooth 的
              RTLS，配套标签、算法和合作伙伴生态；Ubisense 销售 SmartSpace，结合 UWB、BLE 和具备 GPS 能力的标签及传感器；Impinj 是 RAIN RFID 既有巨头；Qorvo
              通过芯片、软件、模块和合作伙伴工具支持 UWB 微定位；Humatics 则面向工业自动化和铁路，主打亚毫米级微定位。现状替代更宽：室外 GPS、摄像头和计算机视觉、机器人里的 SLAM 和 LiDAR、BLE
              或 RFID 信标，以及人工查找与核对流程。战略含义是，ZaiNar 的差异化并不主要来自抽象的“室内定位”，而来自它声称买方可用自己已经拥有的基础设施取得显著更好的定位，而无需重建标签 + 锚点系统。
