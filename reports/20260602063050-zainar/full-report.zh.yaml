      - number: '4.3'
        title: 成本结构、毛利驱动因素与营运资本
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 的结构性吸引力很明显：如果公司真的复用既有 5G 和 Wi-Fi 基础设施，并主要销售软件加分析，就有可能避开定义许多 RTLS 的硬件毛利拖累。Mordor 称，2025 年硬件仍占 RTLS
              收入的 39.13%，即便软件增长更快；TBRC 也仍然把品类收入分为硬件、软件和服务。这些行业结构支持 ZaiNar 相对 UWB 或 RFID 重型替代方案的乐观利润率逻辑。


              但公开证据也说明，实际毛利率为什么可能低于纯软件想象。硬件重型 RTLS 部署在一个 100,000-square-foot 工厂可能超过 $150,000，主动 UWB 标签单价可能为 $25-45；如果
              ZaiNar 的无需新硬件主张能在生产中成立，经济性会很有力量。与此同时，Cisco 和 HPE 都显示，真实企业位置部署会连同入门配置、分析、支持、BLE 或 Wi-Fi
              采集设备，以及打包后的运营工作流一起销售。Cisco 自己的资产追踪产品仍涉及 BLE 标签或 Wi-Fi 设备，并声称通过提升利用率实现节省；HPE 则强调 AP 布点、制图和专家参与。这意味着 ZaiNar
              的毛利路径取决于它必须自己承担多少交付技术栈。公开来源没有披露其服务占比、实施人力、应收账款结构、递延收入或资本开支，因此营运资本强度仍不透明。审慎观点是，毛利率可能有吸引力，但前提是部署保持软件主导，且试点转入生产时服务负担不会膨胀。
