    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调追问
    rows:
      - - 工业 4.0、数字孪生和智能工厂自动化
        - 正向
        - 当前活跃
        - 支撑工业 RTLS 支出，也让存量网络升级更有意义
        - 索取能证明吞吐量或可追溯性改善可量化的案例
      - - 医疗安全和流程经济性
        - 正向
        - 当前活跃
        - 医院仍是 RTLS 大型垂直市场，可用安全和质量结果解释预算
        - 追问实地部署中哪些医院指标最先改善
      - - 3GPP Release 18 定位成熟度
        - 正向
        - 2024–2026 年以后
        - 提升高级 5G 定位功能和 RedCap 支持的技术就绪度
        - 确认哪些 ZaiNar 功能依赖标准化层，哪些依赖专有层
      - - 不增硬件的存量部署论点
        - 正向
        - 近期
        - 如果现有网络确实够用，可缩短价值兑现周期
        - 核实实践中仍需新增锚点、校准或设备改动的频率
      - - 隐私和电信监管
        - 反向
        - 当前活跃
        - 即便技术可行，运营商变现仍可能受州级和行业隐私限制
        - 按部署类型索取法律依据和同意模型
      - - 安全威胁：欺骗、干扰、未经授权追踪
        - 反向
        - 结构性
        - 加重关键任务部署的信任和合规负担
        - 审查安全架构和对抗测试结果
      - - 前期部署和校准成本
        - 反向
        - 近期
        - 即便 ROI 故事很强，也会拖慢存量场景采用
        - 获取完整部署物料清单和重新校准要求
      - - 互操作性和流程集成
        - 反向
        - 近期
        - 即便精度不错，集成差也会让试点扩张到全面铺开时卡住
        - 索取与 ERP、MES、数字孪生和医院 IT 系统对接的参考架构
    notes: 时间判断为定性。核心问题不是有没有需求，而是 ZaiNar 能否比既有 RTLS 替代方案更快跨过隐私、 集成和经济性门槛。
