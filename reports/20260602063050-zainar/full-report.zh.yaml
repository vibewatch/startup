      - number: '7.2'
        title: 法律、监管与隐私风险
        blocks:
          - type: paragraph
            body: >-
              ZaiNar
              的法律与监管风险，不在于已经发现针对公司的公开执法行动；而在于它最有希望的规模化路径穿过一个监管很严的品类。公司希望运营商和企业从网络参与本身生成的位置数据中创造价值。在美国，运营商持有的位置数据落在 CPNI
              框架内，FCC 指引明确把活跃移动设备的位置列为受保护信息。EPIC 对 2024 年运营商罚没令和 2025 年上诉裁决的回顾显示，法院和监管机构仍愿意把订户位置数据视为敏感且受法律保护。FTC 的
              InMarket 行动显示，广告技术一侧也有同样审查：精确位置数据会触发对销售、许可、定向投放、留存和同意流程的限制。


              这很重要，因为 ZaiNar 的渠道策略似乎依赖伙伴。如果运营商、集成商或数据处理伙伴是商业化落地 路径，糟糕的同意设计或薄弱的下游监督会反向传导为发布延误、合同摩擦或声誉损害。2024 年 FTC/FCC
              MOU 进一步说明，管辖权是多头共享，而不是单一监管线。这是可管理风险，不是自动失败，但它显著抬高了尽调门槛。


              订单质量问题与隐私并列，是另一项顶层法律担忧。Stanford 的 MOU 指引并非专门评论 ZaiNar，但它有用地提醒：MOU 往往是不具约束力的初步工具。由于 ZaiNar 公开把合同和 MOU
              合并成一个标题数字，投资人还无法区分可执行 积压订单和战略信号。估值超过 $1B 时，这种模糊尤其重要，因为商业证明本该比纯技术承诺承担更大权重。
