      - number: '8.3'
        title: 牛市、基准和熊市情景应锚定证明转化，而不是虚假精确
        blocks:
          - type: paragraph
            body: >-
              由于 ZaiNar 没有公开披露收入，精确的收入倍数模型制造的噪音会多于洞见。更好的框架是按里程碑加权：哪些证据能支撑溢价，哪些证据能让公司维持在当前估值附近，哪些证据会迫使重置？乐观情景假设 ZaiNar
              把宣称的商业动能转化为具名经常性客户，让交付栈主要保持软件和分析形态，而不是服务和伙伴硬件，并借运营商或战略渠道做分发。若如此，数十亿美元结果是可信的，因为公司开始像稀缺基础设施软件，而不是小众位置厂商。


              基准情景更保守。它假设部分积压订单 真实且有约束力，部分部署会转化，公司证明了足够客户价值以维持战略兴趣，但利润率仍混合、销售周期仍长。这个情景可以支撑接近当前私人估值的水平，但以 $1B-plus
              入场几乎没有容错。悲观情景更简单：如果 MOU 占比高的 解读占主导，如果具名证明继续延后，或如果模型转向服务占比高，当前溢价会很快压缩。


              可比公司组强化了同一点。NextNav 是最接近的上市位置基础设施类比，仍然在收入有限、亏损明显的情况下对应数十亿美元市值。Impinj、Zebra 和 Qorvo 展示了更宽披露规模的样子。Quuppa 和
              Humatics 则显示，私有直接同行可以在技术上相关，却远未接近 ZaiNar 对外披露的标题估值。结论偏保守：$1B-plus 并不荒唐，但目前也没有可比公司支撑。
