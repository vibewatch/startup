  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 可比理由
      - 局限
    rows:
      - - ZaiNar
        - 私募融资估值锚
        - '>$1B 估值；>$100M 融资；披露 >$450M 合同+MOU'
        - 标的公司和当前价格锚
        - 没有公开收入、毛利率或订单储备质量披露
      - - NextNav
        - 公开市场定位基础设施基准
        - ~$2.71-$2.72B 市值；~2.86B EV；2024 监管文件显示收入有限且亏损较大
        - 最接近的公开定位基础设施可比对象
        - 上市稀缺性和完整监管文件让它比 ZaiNar 更干净、更透明
      - - Impinj
        - 公开资产可视化 / 识别基础设施
        - ~$4.34-$4.35B 市值；~4.48B EV；Craft FY2025 收入 ~361.1M
        - 对工业可视化预算和估值纪律有参考意义
        - RFID 经济性和披露成熟度领先于 ZaiNar
      - - Qorvo
        - 上市 RF / UWB 使能厂商
        - 约 $8.79-$8.80B 市值；约 9.19B EV
        - 可参照定位使能栈和组件经济性
        - 半导体模式不是软件平台模式
      - - Zebra
        - 上市资产可视化老牌厂商
        - 约 $11.90-$11.91B 市值；约 14.64B EV
        - 终端市场和企业买方有重叠
        - 硬件 / 软件产品组合远比 ZaiNar 宽
      - - Quuppa
        - 未上市 RTLS 同业
        - 据 Craft，融资约 23.7M，装机系统和伙伴基础较广
        - 直接 RTLS 部署同业
        - 当前估值未公开，BLE 标签模式不同
      - - Humatics
        - 未上市微定位同业
        - 据 Craft，融资约 80.2M，聚焦工业精密定位
        - 直接精密定位同业
        - 细分赛道更窄，当前估值未公开
    notes: 上市公司估值取自分析师 / 市场数据页面在 2026 年 6 月 1–2 日的快照；未上市同业对应行使用公开融资信息作为背景， 而不是当前 EV。
