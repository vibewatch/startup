              - CI041
          - type: callout
            title: 收入质量显形前，运营商和企业销售复杂度会先消耗资本
            body: 外部电信和企业基准指向漫长、委员会驱动的采购周期、集成工作量和售后支持负担。没有烧钱速度和积压订单 转化数据，这些因素让当前资本充足性无法评估。
