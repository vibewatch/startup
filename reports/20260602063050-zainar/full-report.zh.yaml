  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的影响
      - 行动含义
    rows:
      - - 具名证明仍缺位
        - 到下一轮融资周期仍没有具名运营商或复购客户背书
        - 高溢价分销逻辑走弱，可背书性仍未验证
        - 下调估值判断，避免按对外标称价格入场
      - - 在手订单质量仍不透明
        - 管理层无法区分合同与 MOU，或无法展示在手订单到开票额的转化
        - 商业证明仍偏信号，不偏变现
        - 把 $450M 对外口径视为无法支撑投资测算，并预期价格被压缩
      - - 服务 / 硬件蔓延
        - 部署需要大量伙伴硬件、校准或专业服务
        - 类软件毛利逻辑破裂
        - 采用更低的基础设施或集成倍数
      - - 可靠性 / 合规摩擦
        - 现场可靠性或隐私控制比当前叙事更难落地
        - 商业扩张放慢，客户采用风险上升
        - 提高风险折扣，收紧尽调门槛
      - - 融资杠杆恶化
        - 经常性收入显现前就启动下一轮融资
        - 降价融资或优先股堆叠风险从抽象变成眼前风险
        - 回避，或要求惩罚性结构保护
    notes: 这些触发项都能持续监测，本章因此可直接用作投委会决策清单。
    claimRefs:
      - CV018
      - CV019
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 在手订单质量
        - 按头部合同列出的清单，区分有约束力合同与 MOU，并列明终止和付款条款
        - 这是当前估值支撑中最能改变判断的变量
        - 管理层和法务；检查前十大合同文件和收入确认备忘录
      - - 收入转化
        - 开票额到收入的桥接、ARR 定义，以及从试点到生产的队列转化
        - 需要用它把商业叙事变成可支撑投资测算的经济性
        - 财务；索取过去四个季度的月度桥接表
      - - 毛利结构
        - 按软件、服务和任何伙伴硬件附加拆分的毛利率
        - 决定 ZaiNar 应拿软件溢价还是服务折价
        - 财务和运营；索取分部毛利资料包
      - - 股权结构表
        - 清算优先瀑布、棘轮条款、期权池、债务或优先级证券
        - 没有结构条款，基准情景回报无法判断
        - CFO 和律师；审阅融资文件和瀑布模型
      - - 客户证明
        - 具名运营商或客户背书、续约历史和部署 KPI
        - 验证分销、可背书性和真实环境可靠性
        - GTM；开展客户背调电话，检查续约数据
      - - 运营质量
        - 可靠性、校准负担、安全控制和隐私治理材料包
        - 溢价倍数取决于可重复的生产环境表现
        - 产品和合规；检查 KPI 仪表盘、事故和控制设计
    notes: 这些问题按最能改变估值判断的因素排序，不按通用尽调完整性排序。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV043
