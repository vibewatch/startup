        - label: 精度与工作流试点
          description: 客户在真实 RF 条件下测试定位质量是否足够支撑医疗设备、工人安全、自动化或资产可见性。
        - label: 集成与治理审查
          description: 项目要成为运营上可信的系统之前，安全、隐私、权限和工作流集成都会接受审查。
        - label: 采购与打包
          description: 买方选择方案是直销、运营商主导还是合作伙伴主导，并评估服务、支持和商业条款。
        - label: 生产部署
          description: 系统在某个场地或项目中为实时工作流启用，但公开来源没有说明有多少客户走到这一阶段。
        - label: 扩张与续约
          description: 只有 ROI 坐实后，账户才可能扩到更多资产、场地和工作流；公开数据尚未显示 ZaiNar 是否已规模化走到这里。
