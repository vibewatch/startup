  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 市场真实、产品切口也成立，但证据质量和价格支撑仍跟不上叙事，因此投资建议只能带条件。
    data:
      nodes:
        - id: n1
          label: RTLS 市场顺风
          type: driver
          detail: 品类快速增长，足以支撑关注度。
        - id: n2
          label: 存量网络技术切口
          type: strength
          detail: 不加新硬件、直接利用现有 5G / Wi-Fi 做定位，是核心上行空间。
        - id: n3
          label: 收入质量缺口
          type: risk
          detail: 没有公开收入，也没有可约束的积压订单桥接。
        - id: n4
          label: 可比公司现实
          type: risk
          detail: 上市可比公司披露更充分、规模也大得多。
        - id: n5
          label: 当前估值 $1B+
          type: decision
          detail: 高价需要同等级证据。
        - id: n6
          label: 观察 / 继续研究
          type: outcome
          detail: 保持跟踪，但守住价格纪律和尽调闸门。
      edges:
