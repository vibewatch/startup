  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁付费、谁使用，以及产品落在何处
        blocks:
          - type: paragraph
            body: >-
              即便公开记录不能支撑一个成熟客户名单，它仍支持一张相当自洽的买方地图。ZaiNar 始终围绕存量 5G 和 Wi-Fi
              资产来描述产品，而不是围绕消费设备或单一用途标签。这把可能付费方从终端用户推向现有网络的账户所有者：想获得新可变现网络能力的运营商、已经管理园区或工业现场的企业运营方，以及掌控智慧城市或任务项目的公共部门买家。日常用户因细分市场而异——医院运营团队、现场主管、工业员工、市政运营方或运营商产品团队——但共同线索是，ZaiNar
              被卖作一种让现有连接更值钱的基础设施。同一证据也暗示存在服务层。相近的企业定位厂商强调购买选项、导入、分析和专家参与，这说明只要 ZaiNar
              需要接入运营工作流，而不只是演示定位准确性，系统集成商或部署伙伴就会重要。国防和无 GPS 用例拓宽了长期买方地图，但目前更适合理解为潜在客户类别，而不是公开证明的付费客户。
