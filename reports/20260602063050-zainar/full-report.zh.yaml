      - number: '6.4'
        title: 扩张潜力、集中度风险与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              ZaiNar 确实有一个可信的“先落地、再扩张”
              故事。如果客户能把现有网络基础设施转化为可信空间感知，下一步很自然：增加更多资产、更多工作流、更多站点，也可能在同一网络基础之上增加更多应用。相近厂商证明这类动作有预算。Nokia
              提到数百个企业私有无线客户；Cisco、Zebra、Quuppa 和 Ubisense
              则显示，制造、医疗、汽车、航空航天和物流买家已经为位置驱动的运营问题付费。风险在于，这个品类的扩张很少像干净的自助式软件增购。Cisco 和 HPE 销售的是套件、app、支持和解决方案包，这意味着 ZaiNar
              可能需要渠道伙伴、部署服务或更宽的工作流包装，才能赢得更大预算。这又引出两个未解的集中度问题。第一，公司没有披露 $450 million
              标题数字背后有多少交易对手，因此头部客户集中度可能很低，也可能高度集中在少数灯塔账户。第二，渠道依赖不透明：早期规模可能来自运营商、公共项目或集成商，而不是多元化直销基础。管理层披露头部账户组合、伙伴组合和铺开队列之前，扩张可信但还无法承销。
