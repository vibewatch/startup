      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: |
              ZaiNar 最早有记录的外部融资事件，是 2018 年 9 月来自 Alchemist Accelerator 的种子轮——
              这是硅谷头部企业服务创业加速器。该种子轮金额未披露；从 Alchemist 毕业通常意味着
              一小笔加速器资金，以及接入企业客户和投资人网络。svinvestclub.com 资料援引 PitchBook，
              称 ZaiNar 约有 46 名投资人，说明 2018–2025 年隐身期内有大量天使和早期机构参与。
              2026 年以前各轮的具体金额和估值（下文所述 2021 年 9 月事件除外）没有公开资料佐证。

              AI Market Watch 提到 2021 年 9 月有一笔 $11.7 million 的 “Series A”；
              该数字尚未在一手来源（新闻稿、SEC 文件或投资人公告）中得到独立确认，
              应作为中等置信度的二手数据处理。Daniel Jacker 的 TechCrunch 作者简介提到
              “Future Ventures、Softbank、AME Cloud、Samsung” 是 ZaiNar 支持方，
              暗示战略投资人（SoftBank、Samsung）曾在隐身期某个阶段参与，
              但 2026 年 2 月新闻稿没有点名 SoftBank 或 Samsung。

              2026 年 2 月 19 日，ZaiNar 宣布累计融资超过 $100 million，
              估值超过 $1 billion。公告把这描述为 9 年融资积累的结果，
              不一定是一笔单独轮次。与 2026 年公告有关的具名投资人包括：
              Steve Jurvetson（Future Ventures）、Jerry Yang（AME Cloud Ventures）、
              Tom Gruber（Siri 联合创始人）、Jaan Tallinn（Metaplanet Holdings / Skype 创始工程师），
              以及 Nicholas Pritzker（Tao Capital）。Dr. Andreas Weigend（Amazon 前首席科学家）
              被描述为顾问和投资人。Tracxn 将 2026 年 2 月事件标为 “Angel” 轮，
              svinvestclub.com 则标为 “Series A”——两个标签都与公司自己的新闻稿不一致，
              后者没有使用任何轮次序列名称。没有正式轮次标签，再加上隐身后集中亮相的压缩时间线，
              让 $100M 究竟代表公司生命周期累计融资，还是最近一笔资金，变得不清晰。

              “超过 $1 billion” 的估值只披露为下限，没有公布精确投后估值。
              公开资料没有提到老股交易、可转债、债务融资安排或授信额度。
              收入、ARR、毛利率和烧钱速度全部未披露。截至运行日期，没有迹象显示公司有公开市场活动或计划 IPO。
