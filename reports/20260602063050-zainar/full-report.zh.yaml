      - number: '3.4'
        title: 切换成本、多栖部署、分销与供应入口
        blocks:
          - type: paragraph
            body: >-
              这个品类确实存在切换成本，但它出现的时间比单纯技术对比暗示的更晚。第一单通常是试点，买方仍愿意比较多套技术栈。锁定效应开始于位置数据接入
              MES、ERP、WMS、医院运营系统、堆场工作流、安全告警、数字孪生或运营商产品之后。Quuppa 强调开放 API 和广泛技术生态；Cisco Spaces 强调
              API、合作伙伴应用和基于地图的工作流；Inpixon 销售与 ERP 和 MES 流程的直接集成；Impinj
              强调围绕其平台构建的合作伙伴生态。这些例子说明，持久切换成本不只是无线电层，而是围绕该层建立的下游工作流逻辑、运营仪表盘、告警、合作伙伴集成和再培训。


              同一逻辑也让多套系统并行很常见。企业可以用 RFID 做单品级库存，用 BLE 或 Wi-Fi 做园区资产，用 UWB 做高精度工业单元，用 GPS
              或计算机视觉跑其他工作流。公开来源没有显示一个赢者通吃的技术栈；相反，市场会按环境、精度要求、工作流和已安装基础设施分裂。这有利于
              ZaiNar，因为买方可以在不拆掉每套其他定位系统的情况下采用软件覆盖层；但它也削弱护城河耐久度，因为买方可以把 ZaiNar
              放在既有系统旁边试用，而不是整体替换。分销和供应入口随后变成决定性因素。Cisco、HPE、Nokia、Qualcomm、Zebra、Impinj 和 Qorvo
              已经控制采购入口面的关键部分——AP、私有无线、芯片、读写器、标签和企业账户——而 ZaiNar 仍缺少公开具名的运营商胜利，无法证明同等渠道杠杆。
