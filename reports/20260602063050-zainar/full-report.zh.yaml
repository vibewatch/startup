      - number: '6.3'
        title: 留存、重复使用与耐久性
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录最弱的地方。审阅来源没有披露净收入留存、总留存、流失率、合同期限、续约率、重复站点扩张或客户满意度评分。也没有具名客户证言或公开队列披露，让外部投资人区分一个有前景的首次安装和一个耐久的经常性账户。最好的可得证据是间接的。Capgemini
              显示，企业电信买家在集成解决方案中已经遭遇明显复杂度和普通的售后支持；Optifai 和 Aexus 基准则显示，大型企业或基础设施交易有漫长、委员会驱动的采购周期。Nature
              对室内定位隐私和欺骗风险的综述增加了第二层摩擦：即便准确性有吸引力，信任、权限和治理仍会拖慢铺开或续约。这些代理证据不能证明 ZaiNar
              有留存问题，但说明不应仅因技术切口有意思就假定耐久性。正确立场是不可知：没有公开证据显示留存差，也没有公开证据显示留存强。对尽调来说，这意味着留存不是弱，而是未知。
