      - - 存量 Wi-Fi 定位升级
        - 面向定位、地理围栏和资产可视化的存量 Wi-Fi 软件化升级
        - 不复用 Wi-Fi 的全新专用标签-锚点网络
        - 企业 IT、运营、医院园区
        - 支撑 Zero 和低摩擦部署经济性
      - - 现状替代方案
        - GPS、摄像头、LiDAR、SLAM、UWB、RFID、BLE、混合 RTLS
        - 无——这些是替代方案，不属于 ZaiNar 收入范围
        - 随场地和工作流而变
        - 边界逻辑关键：ZaiNar 必须替换既有工作流或基础设施选择
