      - number: '3.5'
        title: 护城河耐久度与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              乐观护城河逻辑很直接。如果 ZaiNar 真的能在既有 5G 和 Wi-Fi 上交付网络侧亚米级定位，不新增硬件、不依赖 OEM，并拥有专利密集的时间同步技术栈，它就能攻击 RTLS
              采用中最大的痛点：安装和校准负担。这个切口在棕地运营商、园区、医疗和工业场地尤其有吸引力，因为买方已经运营网络基础设施，却抗拒再加一层专用定位覆盖。在这种情景下，ZaiNar 的护城河来自
              IP、部署经济性和跨协议灵活性的罕见组合。


              反向证据同样重要。Quuppa 已经展示扎实的工业 ROI 指标和全球合作伙伴基础。Cisco Spaces 宣传在已部署基础设施之上实现 9 trillion 次位置更新和 99.9% 正常运行时间。Nokia
              称已有 850 多个企业私有无线部署，早期采用者 ROI 为正。Qualcomm 和 Skyhook 表明，地面 Wi-Fi
              与蜂窝定位并不是尚未被触碰的创业公司切口；它已经在一家拥有大得多芯片、专利和运营商触达能力公司的路线图上。硬件重的既有供应商也在继续改进：Qorvo 和 Humatics 等 UWB 供应商推进高精度，而
              Impinj、Zebra、Ubisense 和 Inpixon 销售的是完整工作流结果，不只是原始坐标。冷静结论是，ZaiNar
              可能确有真实产品差异化，但公开证据尚不足以证明护城河耐久。它仍取决于能否证明轻硬件架构在真实部署中足够可靠，足以压过更大既有巨头的分销、信任和打包能力。
