      - number: '3.2'
        title: 竞争者画像与细分场景适配
        blocks:
          - type: paragraph
            body: >-
              最相关的非上市直接和相邻同业表明，ZaiNar 并不是唯一在销售“少些部署混乱也能拿到精度”的公司，但底层取舍差异很大。Quuppa 是成熟的 Bluetooth RTLS 专家，二手资料称融资约 USD
              23.7 million，已部署 2,000 套系统，拥有 170 个合作伙伴；它强调亚米级 BLE 追踪、开放 API 和工业 ROI 案例。Humatics 是精度更高的微定位公司，二手资料称融资约 USD
              80.2 million，产品故事围绕面向自动化、机器人和铁路的亚毫米级定位。Inpixon 按上市公司体量看小于大型既有巨头，但明确把 RTLS、工作流应用、数字孪生和面向工厂、仓库、矿山及供应链的智能体 AI
              打包。Ubisense 在工业场景仍有相关性，因为它把 SmartSpace 软件与支持 UWB、BLE 和 GPS 的标签及传感器结合，用于物流、装配、堆场和交通运输工作流。


              上市公司既有巨头带来的是另一类威胁：分销能力和采购信任。Zebra 把联网一线、资产可视化和自动化方案卖进制造、物流、医疗和零售账户，这些也是 ZaiNar 想争取预算的地方。Impinj 控制广泛的 RAIN
              RFID 平台和庞大合作伙伴网络；Qorvo 提供 UWB 芯片、模块、软件和参考设计，供给许多下游微定位厂商；Qualcomm 和 Nokia 可以把定位吸收到大得多的电信和芯片业务中；Cisco / HPE
              则能把已部署 AP 和园区网络覆盖转成定位平台。尽调的关键问题因此不只是 ZaiNar
              是否有更尖锐的技术主张，而是这个主张是否尖锐到足以压过买方对既有可信供应商的偏好——这些供应商已经覆盖网络、标签、合规、支持和长期路线图风险。
