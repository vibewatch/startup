  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - ZaiNar
        - 直接 / 软件主导的网络定位
        - 私营；已披露融资 $100M+、估值 $1B+；收入和客户数未披露
        - 运营商、专用 5G、医疗、工业、物流、智慧城市
        - 公司称在现有 5G 和 Wi-Fi 上无需新增硬件即可实现亚米级或 10cm 以下定位
        - 具名运营商客户、定价和生产规模验证仍未披露
      - - Qualcomm TPS + Skyhook 技术传承
        - 直接 / 电信原生进入者
        - Qualcomm 公开规模：FY2025 收入 $44.3B（Craft）；Craft 称 Skyhook 为其子公司
        - IoT、蜂窝、Wi-Fi、地面定位
        - 既有芯片、专利和运营商触达；明确的地面定位服务
        - 公开功能深度不如公司规模本身有说服力；审阅材料中的服务细节稀疏
      - - Nokia 专用无线
        - 直接 / 潜在进入者
        - Nokia 公开规模：FY2025 收入 €19.9B；Craft 记载 730 个专用无线客户， 官网披露 850+ 个企业客户
        - 工业专用无线、物流、制造、关键任务场地
        - 可把定位打包进更广的专用无线和工业数字化项目
        - 定位是更大产品组合的一部分，不是纯定位切入点
      - - Cisco Spaces
        - 直接 / 相邻存量基础设施
        - 依托装机基础规模的企业软件平台；已公开 9T 次位置更新和 99.9% 可用性
        - 园区、医院、制造、办公室、场馆
        - 把 Cisco 硬件变成传感器；API、合作伙伴应用、3D 地图、资产追踪、分析
        - 许多用例仍依赖 BLE 标签或 Wi-Fi 遥测，公开精度低于 ZaiNar 声称水平
      - - HPE Aruba Networking
        - 直接 / 相邻存量基础设施
        - 上市企业网络既有厂商；作为业务单元，融资不适用
        - 园区 Wi-Fi、寻路、资产追踪、客户互动
        - Wi-Fi FTM、BLE、自定位 AP、通过现有网络覆盖做位置分析
        - 定位嵌在宽网络套件里，不太可能作为独立高精度切入点出售
      - - Quuppa
        - 既有 RTLS / BLE
        - 私营；Craft 报告融资 $23.7M、2K 套系统、170 个合作伙伴
        - 工业 4.0、物流、医疗、公共空间
        - 蓝牙 RTLS，开放 API、合作伙伴生态和已验证 ROI 案例
        - 需要 BLE 标签 / 基础设施，不攻击运营商手机定位
      - - Ubisense
        - 既有 RTLS / UWB 主导工业
        - 审阅的一手来源中，规模 / 融资未清晰公开
        - 汽车、航空航天、公共交通、物流、制造
        - SmartSpace 软件，加 UWB、BLE、GPS 和标签，服务工业流程
        - 比 ZaiNar 更重硬件，集中在工业流程环境
      - - Impinj
        - 既有 RTLS / RFID
        - 上市；Craft 报告 FY2025 收入 $361.1M
        - 零售、供应链、医疗、制造
        - RAIN RFID 平台，叠加广泛合作伙伴网络和单品级可视化
        - 需要标签 / 读写器，在 RFID 单位经济性已经成立的场景最强
      - - Inpixon
        - 既有 RTLS / 工业流程平台
        - 上市但规模小：Craft 报告 FY2025 收入 $22.5M、市值约 $10.2M
        - 工厂、仓库、矿山、供应链
        - RTLS 加流程分析、AI，并集成进工业运营
        - 财务火力弱于更大既有厂商，仍依赖硬件和集成
      - - Humatics
        - 相邻高精度替代方案
        - 私营；Craft 报告累计融资 $80.2M
        - 自动化、机器人、铁路和公共交通
        - 亚毫米定位和预测性维护定位栈
        - 行业聚焦更窄，且可能采用专用系统部署模式
      - - Qorvo / Decawave 技术传承
        - 相邻组件生态
        - 上市；Craft 报告 FY2026 收入 $3.7B
        - UWB OEM、工业、消费、汽车
        - 厘米级精度 UWB IC、软件、模块、参考设计、合作伙伴路径
        - 更多是赋能层，而非完整流程平台；仍强化 UWB 竞争
    notes: 覆盖直接竞争者、既有厂商、相邻替代者和潜在进入者的代表性样本；私营公司融资和规模数字来自 Craft（二手来源），应谨慎看待。
