        - 没有位置工作流的连接支出、消费地图、纯 GNSS 设备收入
        - 企业运营、医疗 IT、物流、制造、安全预算
        - 可作为 TAM 背景，但对 ZaiNar 专项测算太宽
      - - 室内定位 / 园区可视化
        - 智能楼宇、医院、零售、物流和园区室内定位软件及分析
        - 仅户外车队远程信息处理和导航应用
        - 设施运营、医院运营、企业 IT
        - 契合点在于 ZaiNar 将 Wi-Fi 和专网升级面向园区定位
      - - 网络侧 5G 定位叠加层
        - 把公网或专网 5G 转成定位服务的软件和授时层
        - 通用 RAN 资本开支和仅连接订阅
        - 运营商产品团队或企业专网所有者
