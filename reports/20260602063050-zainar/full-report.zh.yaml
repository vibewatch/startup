      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              已验证的财务正面因素更偏战略，而不是数字。ZaiNar 看起来拥有可信的软件型价值主张、真实需求叙事，所在品类也有吸引力：如果“无需新增硬件”的主张在规模化实施中站得住，存量基础设施部署就能为买家创造可观
              ROI。可能的变现菜单不止一个 SKU：运营商软件、企业订阅、分析、服务，以及可能的数据平台或叠加层收入都说得通。如果管理层证明大部分价值落在软件和分析上，最终毛利率画像可能有吸引力。


              但现有公开记录不足以承销。公司未披露价格、收入、ARR、毛利率、流失率、烧钱速度、现金、积压订单 转化或客户集中度；它把合同与 MOU
              混在一起；所在品类又有销售周期长、隐私风险、电信监管摩擦和不低的部署复杂度。核心阻断项不是缺愿景，而是缺财务证据。因此，投资人今天应把 ZaiNar
              视为有前景但仍不透明的基础设施公司。下一步尽调应直接测试收入质量和资本充足性：合同可执行性、队列开票、实施强度和现金跑道。拿不到这些之前，正确的财务结论是：有意思，但仅凭公开数据还无法承销。
