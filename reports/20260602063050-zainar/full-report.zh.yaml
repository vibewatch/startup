      - number: '7.3'
        title: 技术验证、运营可靠性与安全风险
        blocks:
          - type: paragraph
            body: >-
              主要技术风险不是 ZaiNar 的架构不可能，而是公开证明仍落后于主张宽度。公司称自己能用现有 5G 和 Wi-Fi 交付网络侧定位，实现亚米级或低于 10 厘米的精度，并在相对 GPS、摄像头和专用信标
              时具备韧性优势。独立品类来源支持存量基础设施定位有价值这一直觉，但也显示生产可靠性有多难。Cambridge 强调动态室内环境中准确性、可扩展性和成本之间长期存在权衡；Nature
              列举欺骗、蓄意干扰和未经授权跟踪风险。NIST 的 LTE 安全指南又给出运营商级警告：伪基站可能造成隐私泄露、拒绝服务，甚至急救服务中断；抗干扰保护仍是活跃研究领域。


              这不意味着 ZaiNar 会在真实 RF 条件下失败。它意味着举证责任仍在前方。ZaiNar
              自己的发布材料把医疗、建筑和自主运营中的安全导向用例放在台前。一旦定位进入工人地理围栏、医疗设备查找或协同机器运动，误报和漏报就不再是表面 KPI 失误，而会变成运营事件或责任事件。OSHA
              的机器人指南强调，许多伤害发生在非常规设置、维护和测试期间——这些正是定位和安全控制会被拉扯的复杂环境。


              承销后果很清楚：管理层展示具名部署的正常运行时间、校准负担、可靠性指标和安全控制之前，技术风险应被视为商业化风险，而不是孤立工程风险。它会直接流向续约、毛利率、可引用性，以及运营商是否足够信任产品、敢把它推到自己的客户面前。
