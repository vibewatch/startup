      - number: '6.2'
        title: 采用轨迹与具名客户证明质量
        blocks:
          - type: paragraph
            body: >-
              公开采用证据足以说明 ZaiNar 已经越过纯概念阶段，但不足以说明客户基础披露充分。公司现在使用商业语言——已部署并在运行、5G 定位商业可用，以及超过 $450 million
              的合同和谅解备忘录。独立文章和资料网站大体重复同一行业清单和用例，这增强了信心：这不是网站上一段孤立的漂亮话。证据质量仍然关键。合同加 MOU
              的标题数字混合了可执行和不可执行工具，因此不等同于具名生产客户。同样，医疗、建筑、智慧城市和工业部署被反复提到，说明主题一致，但没有说明哪些账户已付费、哪些是试点、哪些已经从第一个站点扩张。公开材料中最具体的具名信号，是入选
              Tokyo Metropolitan Government
              项目；它有用，因为当下且官方，但仍弱于一份展示付费、上线部署并量化结果的案例研究。因此，纪律化读法是把宣称的用例和具名证明分开：采用看起来可信且很可能真实，但公开客户披露仍明显偏薄。
