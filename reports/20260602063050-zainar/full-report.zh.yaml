      - - 公共项目依赖
        - 集中度 / 时点风险
        - 公共部门中标有价值，但速度更慢，受预算周期和政治时点约束
        - 索取公共与私营买方的管线拆分及各自成交率
      - - 集成商依赖
        - 渠道风险
        - 如果集成商掌握实施，ZaiNar 对账户的直接控制和续约可见度可能更弱
        - 索取具名集成商名单、转售条款和续约归属
