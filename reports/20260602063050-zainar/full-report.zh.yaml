      - number: '8.4'
        title: 退出准备度、潜在收购方和会打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持近期 IPO 姿态。ZaiNar
              没有公开经审计财务、没有披露经常性收入基础，也没有一组公开的具名客户或队列，让外部投资人测试续约质量。这不排除强劲的私人市场结果。但它意味着未来几年更干净的退出路径更可能是战略出售、结构化后期轮，或折价老股交易，而不是直接
              IPO。


              潜在战略方并不神秘。Cisco、HPE Aruba、Qualcomm、Zebra，以及部分工业、国防或电信基础设施玩家，都触及同一工作流的几个环节：位置、连接、运营可见性和边缘协调。如果 ZaiNar
              真的以这些玩家难以复制的方式解决网络侧定位，它会成为有吸引力的补强型或能力型收购标的。如果不能，同一批公司会限制它的定价权，因为买家可以继续从可信既有厂商采购。


              投资逻辑破裂触发点因此很具体。如果下一轮融资周期仍缺少具名运营商和客户证明，如果管理层仍无法拆分有约束力合同和
              MOU，或如果部署被证明是服务介入重、硬件辅助，而不是软件主导，溢价就应压缩。这些不是表面失误。它们会直接摧毁投资人今天愿意支付高于普通 RTLS 或工业软件估值的理由。
