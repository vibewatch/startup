      - number: '1.5'
        title: 证据展示
        blocks:
          - type: callout
            title: MOU 膨胀风险——$450M+ 合同 vs. 已具名客户
            body: >-
              ZaiNar 标题中的“超过 $450 million 合同和谅解备忘录”把有约束力和无约束力工具混在一起，没有拆分。公开资料没有具名任何企业客户、运营商或合同交易对手。2026 年 2
              月新闻稿同时称“主要运营商和企业合作伙伴关系将在未来几周公布”——但截至 2026 年 6 月运行日期，这类公告并未出现。大额汇总 MOU
              数字与缺席的具名客户并存，是早期深科技公司常见模式；在照单全收前，必须独立核验合同约束力、付款条款和转化率。
            calloutType: risk
            claimRefs:
              - CO034
              - CO035
              - CO043
          - type: callout
            title: 网络定位中的安全与隐私风险
            body: >-
              Nature（Scientific Reports）2025 年发表的一项同行评审综述指出，ZaiNar
              所部署类型的室内定位系统存在重大的安全与隐私威胁，包括欺骗、干扰和未经授权追踪。具体而言，研究强调了注入虚假时间数据的信号欺骗攻击、降低系统可用性的干扰攻击，以及未经授权收集位置流造成的数据隐私违规。对于运营商级部署，这些风险尤其尖锐：所有联网设备——包括个人智能手机——都在网络层被
              10cm 以下精度追踪，且无需逐设备取得用户同意。ZaiNar 尚未发布针对这些威胁路径的安全架构文档、合规框架或隐私政策。
            calloutType: risk
            claimRefs:
              - CO044
          - type: callout
            title: CEO 关键人集中风险
            body: >-
              Daniel Jacker 是 ZaiNar 唯一具名的公开发言人、融资牵头人和战略决策者。公司没有公开识别 CFO、销售副总裁或第二梯队高管。Jacker 还保有活跃外部风投角色（Magic City
              种子基金联合创始人兼 GP）。CTO（Philip
              Kratz）没有公开记录的背景或专利归属，使技术领导力评估变得困难。外部能见度和内部权力集中在单一个人身上，构成实质性关键人风险，尤其在公司从隐身期走向运营商商业化扩张时更是如此。
            calloutType: insight
            claimRefs:
              - CO014
              - CO018
              - CO019
              - CO020
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 ZaiNar 按通用电信基础设施供应商来测算。公开证据把它放在一个更窄但仍然异质的市场簇里：RTLS、室内定位，以及叠加在既有 5G 和 Wi-Fi 基础设施上的地面网络侧定位。TBRC 对广义 RTLS
              的定义包括硬件、软件和服务，技术横跨 RFID、Wi-Fi、UWB、BLE、超声、红外和 GPS。Global Growth
              的室内定位摘要边界略有不同，核心围绕智慧建筑、位置分析、资产追踪、医疗、零售和物流。ZaiNar 自身定位更窄：用既有连接信号，而不是专用标签 + 锚点网络，提供软件和时间同步智能。


              最相关的替代方案不是单一供应商类别。公司材料明确把 GPS、摄像头或计算机视觉、UWB 信标系统定义为要击败的现状；Wi-Fi Alliance 和学术综述则显示，买方仍会根据环境在
              Wi-Fi、BLE、RFID、UWB、LiDAR、SLAM 和混合技术栈之间选择。这意味着，只要买方想要更精确、摩擦更低的空间感知，ZaiNar 都可能争取预算，但它不会自动吃下整个 RTLS
              技术栈。在棕地场地里，最锋利的替代论点不是对抗所有 RTLS 支出，而是对抗既有系统常常要求的专用硬件、校准和工作流摩擦。
