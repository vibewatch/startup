      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: |
              ZaiNar 由 Daniel Jacker（CEO）和 Philip Kratz（CTO）联合创办，
              Alex Hooshmand 也在公司数据聚合平台中被列为联合创始人。
              一些数据来源提到过第四位联合创始人，但一手新闻材料没有逐一具名。

              Daniel Jacker（CEO）拥有 Stanford University MBA，并自称连续创业者，
              有成功退出和风险投资经历。可查过往职业包括创办 The 3D Printing Company
              （CEO，约 2010–2013 年）；搭建并领导 Accenture 的 3D Printing Strategy 实践，
              服务 Fortune 100 和政府客户，主题包括新兴供应链技术（3D 打印、IoT、无人机）；
              2016 年在 Foundation Capital 担任风险投资暑期助理；
              以及 2016 年获得 Lightbank Venture Capital MBA Fellowship。他还是 Magic City
              的联合创始人和普通合伙人，这是一只聚焦 Stanford GSB 相关创业公司的种子基金——
              也是仍在延续的外部职责。Equilar 资料显示，截至 2021 年 10 月，
              他是 Zainar Inc. 董事会成员，佐证其持续担任执行角色。
              Jacker 是主要公开发言人，也是 ZaiNar 融资和商业发布的门面。

              Philip Kratz（CTO、联合创始人）的公开可见度明显低得多。
              没有详细传记来源独立说明他的学术或职业背景。Craft.co、Tracxn 和
              Silicon Valley Invest Club 资料均一致列出其联合创始人身份和 CTO 头衔，
              但没有一手来源深入披露其技术背景或早期专利。

              根据 Craft.co，Eric Wilson 是 ZaiNar 硬件副总裁。他的角色说明其负责硬件集成、
              天线和 RF 系统设计。公开资料没有传记信息。

              Nishant Batra（Nokia 前 CTO）以董事会顾问身份加入，这一点来自公司
              “5G Killer App” 新闻稿。该新闻稿中他的引语明确表示，他加入是因为市场机会规模，
              暗示这段顾问关系始于 2026 年初。Steve Jurvetson（Future Ventures、SpaceX 董事）
              是新闻材料中唯一具名的董事会成员（不只是投资人）。完整董事会组成——包括是否有
              独立董事、投资人委派席位、审计或薪酬委员会结构——尚未公开披露。
              这给尽调留下了实质性治理不透明。

              Daniel Jacker 同时承担外部职责（Magic City 种子基金、多项创业公司顾问角色），
              且没有公开记录显示公司已有第二梯队高管团队（CFO、CMO、销售副总裁），
              这构成可衡量的关键人集中风险。截至运行日期，没有公布管理层变动、离职或高管新增。
