chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: |
              ZaiNar, Inc.（zainartech.com）是一家深科技公司，总部位于 California 州 Belmont 的 2 Davis Drive，
              成立于 2017 年（部分数据聚合平台写作 2016 年；见证据缺口）。
              公司经历 9 年完全静默研发后，于 2026 年 2 月 19 日公开亮相，
              宣布累计融资超过 $100 million、估值超过 $1 billion——
              在创立期没有发布过一篇公开新闻稿的情况下跨过独角兽门槛。

              ZaiNar 的核心创新，是把亚纳秒级时间同步分布到既有无线网络基础设施上。
              无线电波每纳秒大约传播 30 厘米，因此同步精度做到亚纳秒，
              就能直接换算成亚米级三维定位精度——室内、室外、穿墙、
              绕角都覆盖。平台完全运行在全球已部署的既有 5G、WiFi 和私有蜂窝
              基础设施上，不要求设备或基站新增硬件，不要专有信标，
              也不增加电池消耗。平台不绑定协议，并称兼容 3GPP Release 16 5G-NR。

              公司用 “ZPS”（ZaiNar Positioning System）品牌销售这套产品，
              覆盖 5G 定位方案、WiFi 定位系统、实时 3D 资产追踪平台，
              以及网络时间同步基础设施层。之后公司又发布面向 WiFi 网络的
              专用 “Zero” 模型。ZaiNar 把商业主张包装为 Physical AI 所需的
              空间数据底座——也就是在物理世界运行的智能系统进行实时协同和训练所需的基础。

              商业模式是 B2B：公司向电信运营商（用于变现既有 5G 基础设施）
              以及医疗、建筑、物流、工业运营、智慧城市和国防企业授权或销售定位技术。
              它的网络侧路线使用探测参考信号（SRS），而不是专用定位参考信号（PRS），
              因而绕开智能手机 OS 层限制（Apple iOS 和 Google Android 默认都拒绝 PRS 访问，
              E911 除外），让运营商无需 OEM 配合就能直接获得每台联网设备的
              10cm 以下位置数据。截至 2026 年 6 月运行日期，公司未披露具体运营商名称、
              定价层级或收入数字。公司在美国注册的法律实体名称为 “Zainar, Inc.”。
