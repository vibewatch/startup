      - number: '2.3'
        title: 买方、用户、付款方与预算归属
        blocks:
          - type: paragraph
            body: >-
              买方地图很碎，因为 ZaiNar 的价值主张横跨网络基础设施和运营工作流软件。在公网场景，可能的经济买方是希望用新位置服务变现已部署 5G 资产的运营商产品、RAN 或企业解决方案团队。ZaiNar
              自己的论点是，Apple 和 Google 卡住 PRS 访问，导致运营商即便已投入数十亿美元建设 5G，也无法变现手机定位；如果这个论点在实践中成立，预算逻辑更像网络软件增购，而不是传统 RTLS 硬件刷新。


              到企业内部，故事会变。工业部署可能卖给工厂运营、OT、自动化或供应链负责人，因为 ROI 围绕吞吐量、工人安全、WIP 可视化和数字孪生展开。医疗园区部署可能落在医院运营、IT 和生物医学工程团队，因为公开
              RTLS 文献把支出与设备查找时间、员工安全、感染控制和质量挂钩报销联系起来。智慧城市和公共部门用例最不标准化：它们可能由创新、交通或公共安全预算支付，但公开证据尚未显示 ZaiNar
              类项目有一个可复用的预算归属方。这种碎片化对尽调很重要，因为它在扩大潜在需求面的同时，也抬高了销售复杂度。
