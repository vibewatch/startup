- id: adoption-proof
  title: Adoption trajectory and named-customer proof quality
  body: 'There is enough public adoption evidence to say ZaiNar is past pure concept stage, but not enough to say the customer base is well disclosed. The company now speaks in commercial language—deployed and operating today, commercial availability for 5G positioning, and more than $450 million in contracts and memoranda of understanding. Independent articles and profile sites broadly repeat the same sector list and use cases, which increases confidence that the story is not a one-off website flourish. Still, the quality of proof matters. The contracts-and-MOUs headline blends enforceable and non-enforceable instruments, so it is not the same thing as named production customers. Likewise, recurring mention of healthcare, construction, smart-city, and industrial deployments shows thematic consistency, but it does not reveal which accounts are paid, which are pilots, and which have expanded beyond the first site. The most concrete named signal in the public materials is Tokyo Metropolitan
    Government program selection, which is useful because it is current and official, yet still weaker than a case study showing a paid, live deployment with quantified outcomes. The disciplined reading is therefore to separate claimed use cases from named proof: adoption looks plausible and probably real, but public customer disclosure remains notably thin.'
