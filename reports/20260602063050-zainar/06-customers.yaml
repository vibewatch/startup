- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - Add more sites on same network estate
    - Expansion driver
    - Brownfield reuse can raise software value without rebuilding infrastructure
    - Request site-expansion cohorts and time from first site to second site
  - - Add more assets and workflows
    - Expansion driver
    - Location layer can spread from one workflow into safety, utilization, automation, and analytics
    - Request attach-rate by workflow after first deployment
  - - Carrier distribution or OEM-style channel
    - Expansion driver + channel dependency
    - Could accelerate scale if operators embed ZaiNar into broader offerings
    - Request direct vs indirect bookings split and top-partner contribution
  - - Solution-bundle expectation
    - Execution risk
    - Customers may expect apps, analytics, services, and support rather than coordinates alone
    - Request gross-margin by software vs services and partner delivery model
  - - Top-customer concentration
    - Concentration risk
    - A few lighthouse accounts could dominate the $450M headline if counterparties are few
    - Request top-1, top-5, and top-10 customer share by bookings and ARR
  - - Public-program dependence
    - Concentration / timing risk
    - Public-sector wins can be valuable but slower, budget-cycled, and politically timed
    - Request pipeline split by public vs private buyers and associated close rates
  - - Integrator dependence
    - Channel risk
    - If integrators own implementation, ZaiNar may have weaker direct account control and renewal visibility
    - Request named integrator roster, resale terms, and renewal ownership
  notes: All impacts are qualitative because ZaiNar does not disclose customer-count, ARR, or top-account mix. The table intentionally separates plausible expansion logic from concentration unknowns.
