figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Illustrative account journey from brownfield-fit discovery to pilot, procurement, deployment, and later expansion, showing why ZaiNar likely sells through long-cycle infrastructure motions.
  approximationNotes: Stages are evidence-backed but not quantified. ZaiNar has not published stage conversion rates or customer counts.
  data:
    items:
    - label: Brownfield fit identified
      description: Carrier, campus, or industrial buyer realizes an existing 5G or Wi-Fi footprint could become a sensing layer instead of a sunk cost.
    - label: Accuracy and workflow pilot
      description: Customer tests whether location quality is good enough for medical devices, worker safety, automation, or asset visibility under real RF conditions.
    - label: Integration and governance review
      description: Security, privacy, permissions, and workflow integration are reviewed before the project can become operationally trusted.
    - label: Procurement and packaging
      description: Buyer chooses whether the offer is direct, carrier-led, or partner-led and evaluates services, support, and commercial terms.
    - label: Production deployment
      description: System is turned on for live workflows in a site or program, but public sources do not reveal how many customers reach this stage.
    - label: Expansion and renewal
      description: Only after ROI is real can the account grow to more assets, sites, and workflows; public data does not reveal whether ZaiNar is here yet at scale.
