- id: durability
  title: Retention, repeat usage, and durability
  body: 'Durability is where the public record weakens most. None of the reviewed sources disclose net revenue retention, gross retention, churn, contract term, renewal rate, repeat site expansion, or customer-satisfaction scores. There are also no named customer testimonials or public cohort disclosures that would let an outside investor distinguish a promising first installation from a durable recurring account. The best available evidence is indirect. Capgemini shows that enterprise telecom buyers already experience meaningful complexity and mediocre post-sales support in integrated solutions, while Optifai and Aexus benchmarks indicate long committee-driven buying cycles for larger enterprise or infrastructure deals. Nature''s review of indoor-location privacy and spoofing risks adds a second friction layer: even where accuracy is compelling, trust, permissions, and governance can slow rollout or renewal. Those proxies do not prove ZaiNar has a retention problem, but they do show why
    durability should not be assumed simply because the technology wedge is interesting. The correct stance is agnostic: there is no public evidence of bad retention, but there is also no public evidence of strong retention. For diligence, that means retention is not weak—it is unknown.'
