callouts:
- calloutType: risk
  title: Public customer disclosure is materially thinner than the commercial headline
  body: ZaiNar has enough evidence to support a real buyer map and some real deployment activity, but not enough public proof to underwrite named-logo quality. The strongest adoption signal is still a mix of contracts, MOUs, and cross-sector deployment claims without named carrier, hospital, or industrial references.
  claimRefs:
  - CU011
  - CU012
  - CU015
  - CU016
  - CU018
  - CU037
  - CU038
- calloutType: insight
  title: The strongest customer thesis is brownfield monetization of networks already in place
  body: What makes ZaiNar commercially interesting is not simply higher precision. It is the argument that carriers and enterprise operators can turn sunk 5G and Wi-Fi capex into a location layer. That makes the most plausible buyers the owners of existing network estates, not net-new hardware programs.
  claimRefs:
  - CU002
  - CU003
  - CU006
  - CU028
  - CU031
  - CU032
- calloutType: risk
  title: Expansion may depend as much on bundling and channels as on raw positioning accuracy
  body: Adjacent incumbents do not market location as a simple point feature. They sell packages, apps, analytics, services, and operational outcomes. If ZaiNar needs similar bundling to expand, channel structure and services intensity may matter as much as technical precision.
  claimRefs:
  - CU008
  - CU029
  - CU030
  - CU035
  - CU039
acknowledgedWarnings:
- dimension: figureType
  reason: The planned retention cohort would require time-series retention percentages that ZaiNar does not publicly disclose. TU004 and TU006 preserve the durability gap explicitly and are more truthful than inventing a sparse or fabricated cohort figure.
- dimension: unverifiedSource
  reason: Several auxiliary benchmark and competitor URLs were inspected directly during this drafting pass rather than via fetch-url. They are used only for qualitative market-shape context, while core company-critical claims still rest on cached company, news, and filing sources.
