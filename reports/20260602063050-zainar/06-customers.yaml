  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-references
    missingEvidence: Named customer references for at least one carrier, one healthcare operator, and one industrial operator, each with deployment status and business owner.
    whyItMatters: Without named references, investors cannot distinguish real production adoption from promising but still thin launch-period marketing.
    diligencePath: Request three customer references with logo permission, deployment scope, go-live date, and a reference-call path.
    relatedQuestionRefs:
    - QU007
    - QU011
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, logo retention, renewal timing, contract term, and repeat-site expansion cohorts.
    whyItMatters: Customer durability cannot be underwritten from technical claims alone; repeat economics are what separate a promising deployment from a durable business.
    diligencePath: Request customer cohort tables by segment, including renewals, expansions, downgrades, and churn reasons.
    relatedQuestionRefs:
    - QU014
    - QU015
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-channel-mix
    missingEvidence: Top-customer share, top-partner share, direct versus indirect bookings, and the count of counterparties behind the contracts-and-MOUs headline.
    whyItMatters: A few lighthouse accounts or channel partners can make reported demand look impressive while still leaving the revenue base concentrated and fragile.
    diligencePath: Request top-1/top-5/top-10 customer concentration, partner concentration, and bookings mix by channel.
    relatedQuestionRefs:
    - QU023
    - QU024
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: pilot-versus-production-outcomes
    missingEvidence: Customer-by-customer status showing whether each disclosed deployment is a pilot, paid production, or multi-site rollout, plus one quantified KPI outcome.
    whyItMatters: The core customer question is not merely whether ZaiNar can demo the technology, but whether it converts evaluations into repeatable operational deployments.
    diligencePath: Request a deployment ledger listing account name, vertical, start date, pilot/production status, and the first quantified operational outcome.
    relatedQuestionRefs:
    - QU011
    - QU012
    relatedTableRefs:
    - TU002
    - TU003
