- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative use case
  - Public evidence quality
  - Strategic value / main gap
  rows:
  - - Carriers / network operators
    - 'Buyer: carrier product / RAN; user: enterprise subscribers and operator product teams; payer: network-product P&L'
    - Monetize existing 5G footprint with terrestrial positioning and location APIs
    - Medium on archetype, low on named logos
    - High strategic value if carrier distribution is real; no named carrier customer disclosed
  - - Enterprise operators (healthcare)
    - 'Buyer: hospital operations / IT / biomedical; user: care teams and facilities; payer: operations or capex budget'
    - Find mobile medical devices and improve operational coordination
    - Medium on use case, low on named proof
    - Compelling ROI narrative, but no named hospital reference or renewal data
  - - Enterprise operators (industrial / construction / logistics)
    - 'Buyer: site operations / OT; user: workers, supervisors, robots; payer: program or site budget'
    - Worker-safety zones, equipment tracking, yard and workflow visibility
    - Medium on use case, low on named proof
    - Strong fit with brownfield networks; no site-count, rollout, or logo disclosure
  - - System integrators / deployment partners
    - 'Buyer: partner or prime contractor; user: customer deployment teams; payer: bundled program budget'
    - Integrate location into workflow apps, analytics, and services
    - Low direct proof, medium adjacent evidence
    - Likely important for scale, but no public integrator roster is named
  - - Smart-city / public-sector buyers
    - 'Buyer: innovation office / transport or municipal agency; user: field teams and operators; payer: public program or grant budget'
    - Traffic, infrastructure, or public-space visibility
    - Named proof exists only at program-selection level
    - Tokyo program is useful signal, but not a disclosed recurring contract or KPI case study
  - - Defense / GPS-denied prospects
    - 'Buyer: mission owner or defense program office; user: operators in contested environments; payer: program budget'
    - Terrestrial backup where GPS is jammed or spoofed
    - Low proof, mostly prospect framing
    - Potentially high-value niche, but no named defense customer is disclosed
  notes: Rows distinguish payer, user, and buyer because ZaiNar appears to sell into infrastructure budgets while serving operational users; gaps preserve the absence of named logos.
