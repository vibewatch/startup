chapter:
  number: 6
  title: Customers
  summary: 'ZaiNar appears to be aimed at carrier, enterprise-operator, and public-sector accounts that want location from existing network infrastructure, and there is enough public evidence to believe real commercial conversations and some deployments exist. But public customer disclosure is thin: the clearest named proof is Tokyo Metropolitan Government program selection, while most other customer evidence is company-claimed vertical deployment and a contracts-plus-MOUs headline without named carrier, hospital, or industrial logos, leaving retention, expansion, and concentration largely unresolved.'
sections:
- id: buyer-map
  title: Who pays, who uses, and where the product fits
  body: 'The public record supports a fairly coherent buyer map even though it does not support a mature customer roster. ZaiNar consistently frames the product around brownfield 5G and Wi-Fi estates rather than around consumer devices or single-purpose tags. That pushes the likely payer away from end users and toward the account owners of existing networks: carriers that want a new monetizable network capability, enterprise operators that already manage campuses or industrial sites, and public-sector buyers that control smart-city or mission programs. The day-to-day users differ by segment—hospital operations teams, site supervisors, industrial staff, municipal operators, or carrier product teams—but the common thread is that ZaiNar is being sold as infrastructure that makes existing connectivity more valuable. The same evidence also implies a services layer. Adjacent enterprise-location vendors emphasize purchase options, onboarding, analytics, and expert engagement, which suggests system
    integrators or deployment partners will matter wherever ZaiNar has to connect into operational workflows rather than merely demonstrate location accuracy. Defense and GPS-denied use cases widen the long-term buyer map, but they are still better read as prospect categories than as publicly proven paying customers.'
