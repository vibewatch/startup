  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Backlog quality
    - Top-contract schedule separating binding contracts from MOUs plus termination and payment terms
    - This is the single biggest swing factor in current valuation support
    - Management and legal; inspect top ten instruments and revenue-recognition memo
  - - Revenue conversion
    - Billings-to-revenue bridge, ARR definition, and cohort conversion from pilot to production
    - Needed to move from commercial narrative to underwritable economics
    - Finance; request monthly bridge for the last four quarters
  - - Margin structure
    - Gross margin by software, services, and any partner-hardware attach
    - Determines whether ZaiNar deserves a software premium or a services discount
    - Finance and operations; request segment margin pack
  - - Cap table
    - Preference waterfall, ratchets, option pool, debt, or senior securities
    - Base-case returns are unknowable without structure terms
    - CFO and counsel; review financing docs and waterfall model
  - - Customer proof
    - Named carrier or customer references, renewal history, and deployment KPIs
    - Validates distribution, referenceability, and real-world reliability
    - GTM; run reference calls and inspect renewal data
  - - Operational quality
    - Reliability, calibration burden, security controls, and privacy-governance package
    - A premium multiple depends on repeatable production performance
    - Product and compliance; inspect KPI dashboard, incidents, and control design
  notes: These asks are prioritized by what would most change the valuation call rather than by generic diligence completeness.
