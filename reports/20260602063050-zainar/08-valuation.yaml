- id: exit-readiness-and-thesis-breaks
  title: Exit readiness, likely acquirers, and the triggers that would break the thesis
  body: 'Public evidence does not support a near-term IPO posture. ZaiNar has no public audited financials, no disclosed recurring-revenue base, and no public set of named customers or cohorts that would let outside investors test renewal quality. That does not rule out strong private outcomes. It does mean the cleaner exit paths over the next few years are more likely to be a strategic sale, a structured late-stage round, or a discounted secondary rather than a straightforward IPO.


    The likely strategic set is not mysterious. Cisco, HPE Aruba, Qualcomm, Zebra, and selected industrial, defense, or telecom infrastructure players all touch pieces of the same workflow: location, connectivity, operational visibility, and edge coordination. If ZaiNar genuinely solves network-side positioning in a way those players cannot easily replicate, it becomes an attractive tuck-in or capability acquisition. If not, those same firms cap its pricing power because buyers can keep purchasing from trusted incumbents.


    Thesis-break triggers are therefore concrete. If the next financing cycle still lacks named carrier and customer proof, if management still cannot split binding contracts from MOUs, or if deployments prove high-touch and hardware-assisted rather than software-led, the premium should compress. Those are not cosmetic misses. They directly destroy the reasons an investor would pay above a normal RTLS or industrial-software valuation today.'
