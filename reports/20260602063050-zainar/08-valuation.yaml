  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-opacity
    missingEvidence: Cap-table summary showing liquidation preferences, participation rights, ratchets, option pool, and any senior instruments above common or new money.
    whyItMatters: A $1B-plus headline is not decision-useful if preference overhang can wipe out base-case returns for a new investor.
    diligencePath: Request the latest financing documents, cap-table waterfall, and counsel summary before any pricing discussion.
    relatedQuestionRefs:
    - QV008
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-proof
    missingEvidence: A revenue bridge with ACV, billings, gross margin by software versus services, and any partner-hardware attach rate.
    whyItMatters: The valuation stance flips materially depending on whether ZaiNar is software-heavy or integration-heavy.
    diligencePath: Request management reporting on recognized revenue, billings, gross margin, and implementation labor for the last four quarters.
    relatedQuestionRefs:
    - QV019
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audited or board-reviewed financial statements, named customer references, and evidence of repeatable renewals or expansion.
    whyItMatters: Without those items, IPO readiness and near-term exit optionality remain only partially supported.
    diligencePath: Request audited financial package, reference calls with named customers, and cohort expansion history.
    relatedQuestionRefs:
    - QV026
  - type: enumeration-incomplete
    severity: material
    topic: private-comparable-valuations
    missingEvidence: Current private valuation marks for Quuppa, Humatics, and other direct RTLS peers are not publicly available on a like-for-like basis.
    whyItMatters: The comparable table can bracket public and funding context, but it cannot fully normalize private-market pricing for direct peers.
    diligencePath: Use secondary market quotes, banker comps, or management-provided competitor fundraising intelligence under NDA.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV009
    - QV015
  - type: private-evidence-only
    severity: blocking
    topic: backlog-quality
    missingEvidence: Top-contract schedule showing which parts of the $450M headline are binding contracts, which are MOUs, and how each instrument converts to billings.
    whyItMatters: The single biggest swing factor in valuation support is whether commercial proof is enforceable demand or mainly signaling.
    diligencePath: Inspect the top ten instruments, revenue-recognition memo, and monthly backlog-to-billings conversion pack.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV021
    - QV022
