- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bear
    - Much of the $450M headline is MOU-heavy; named carrier or customer proof stays absent; deployments stay integration-heavy.
    - Estimated EV $0.25B-$0.6B; implies roughly 0.3-0.6x gross value at a $1B entry before dilution.
    - Down round, preference overhang, services-heavy margins, and referenceability failure.
    - Material if diligence cannot verify binding backlog or recurring revenue.
  - - Base
    - A meaningful subset of backlog is binding; first named deployments convert; the business mixes software with meaningful services.
    - Estimated EV $0.8B-$1.4B; implies roughly 0.8-1.4x gross value at a $1B entry before dilution.
    - Long sales cycles, margin ambiguity, and incumbent bundling cap upside.
    - Most plausible public-data case today.
  - - Bull
    - Named carrier or channel proof emerges; customers renew; gross margins prove software-heavy; the market treats ZaiNar as scarce infrastructure software.
    - Estimated EV $2.0B-$3.5B; implies roughly 2.0-3.5x gross value at a $1B entry before dilution.
    - Execution misses, privacy friction, or hardware and services creep undermine the premium.
    - Needs multiple diligence gates to clear before it can be weighted heavily.
  notes: Ranges are inferred scenario brackets, not a precise DCF or audited revenue-multiple model.
