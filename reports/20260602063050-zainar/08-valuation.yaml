- id: scenario-analysis-and-comps
  title: Bull, base, and bear scenarios anchored to proof conversion rather than false precision
  body: 'Because ZaiNar does not publicly disclose revenue, a precise revenue-multiple model would create more noise than insight. The better framework is milestone-weighted: what evidence would justify a premium, what evidence would keep the company near the current mark, and what evidence would force a reset? The bull case assumes ZaiNar turns claimed commercial momentum into named recurring customers, keeps the delivery stack mostly software and analytics rather than services and partner hardware, and leverages carrier or strategic channels into distribution. In that case, a multi-billion-dollar outcome is plausible because the company begins to resemble scarce infrastructure software rather than a niche location vendor.


    The base case is more conservative. It assumes some of the backlog is real and binding, some deployments convert, and the company proves enough customer value to preserve strategic interest, but margins remain mixed and sales cycles stay long. That scenario can justify something near the current private mark, but it does not offer much room for error at a $1B-plus entry. The bear case is simpler: if the MOU-heavy interpretation dominates, if named proof continues to slip, or if the model turns services-heavy, the current premium compresses quickly.


    The comparable set sharpens the same point. NextNav is the closest public location-infrastructure analog and still pairs a multi-billion-dollar market cap with limited revenue and meaningful losses. Impinj, Zebra, and Qorvo show what broader disclosed scale looks like. Quuppa and Humatics show that private direct peers can be technically relevant without commanding anything close to ZaiNar''s publicized headline. The conclusion is conservative: $1B-plus is not absurd, but it is not presently comparable-backed either.'
