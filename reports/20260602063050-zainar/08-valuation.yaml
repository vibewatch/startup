- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Named proof still absent
    - No named carrier or recurring customer references by the next financing cycle
    - Premium distribution thesis weakens and referenceability remains unproven
    - Mark down valuation view and avoid paying the headline price
  - - Backlog quality still opaque
    - Management cannot split contracts from MOUs or show backlog-to-billings conversion
    - Commercial proof remains signaling-heavy rather than monetization-heavy
    - Treat the $450M headline as non-underwritable and expect price compression
  - - Services / hardware creep
    - Deployments require significant partner hardware, calibration, or professional services
    - Software-like margin thesis breaks
    - Apply lower infrastructure or integration multiples
  - - Reliability / compliance friction
    - Field reliability or privacy controls prove harder than the current story implies
    - Commercial scale slows and customer adoption risk rises
    - Increase risk discount and tighten diligence gates
  - - Financing leverage worsens
    - The next round is raised before recurring revenue is visible
    - Down-round or preference-stack risk moves from abstract to active
    - Avoid or demand punitive structure protections
  notes: Triggers are intentionally monitorable so the chapter can function as an investment-committee decision checklist.
