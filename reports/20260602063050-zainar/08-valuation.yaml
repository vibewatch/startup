- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - lens
  - core argument
  - what supports it today
  - what would change the view
  rows:
  - - Thesis
    - ZaiNar may turn sunk 5G and Wi-Fi infrastructure into premium positioning software.
    - Company claims, brownfield economics, and RTLS market growth support a real wedge.
    - Named recurring customers, binding backlog, and software-led gross margin proof would strengthen it.
  - - Thesis
    - Hardware-light positioning could create better economics than many RTLS alternatives.
    - Market reports still show meaningful hardware burden across RTLS.
    - Evidence that deployments stay software-heavy at scale would validate the margin premium.
  - - Anti-thesis
    - The company may be priced ahead of commercial evidence.
    - No public revenue, margin, or burn disclosure and no public contracts-versus-MOUs split.
    - A clean billings/revenue bridge would weaken this objection.
  - - Anti-thesis
    - Incumbents already occupy the buying surface.
    - Cisco, HPE Aruba, Qualcomm, Zebra, Quuppa, and Humatics all show adjacent or direct competition.
    - Named carrier or channel wins would reduce the distribution discount.
  - - Anti-thesis
    - The next round could reprice if proof does not arrive.
    - NextNav shows that location infrastructure can stay capital-intensive despite public-market access.
    - Visible conversion of backlog into revenue before the next raise would improve leverage.
  notes: Supports and anti-supports are framed relative to price, not as a generic quality debate.
