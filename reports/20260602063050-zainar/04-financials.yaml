  - - API / data platform
    - Expose location context into ERP, digital-twin, or workflow apps
    - API fees / platform seat / data usage
    - Inferred from Zero API-stack language and analytics-style adjacent packaging
    - Low-to-medium evidence quality
    - Ask for API product roadmap, pricing metric, and attach rate
  - - Tag / overlay partner revenue
    - Partner tags, sensors, or overlays where customers still want attached devices or gateways
    - Per tag / hardware resale / bundle
    - Not verified for ZaiNar; adjacent vendors commonly combine software with BLE tags or Wi-Fi devices
    - Low evidence quality
    - Ask whether any deployments require partner hardware, resale margin, or gateway bundles
