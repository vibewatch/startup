company:
  name: ZaiNar
chapter:
  number: 4
  title: Financials
  summary: ZaiNar’s public story supports a software-led revenue model layered onto existing 5G and Wi-Fi, but not a current underwriting model. The company has disclosed funding, patents, vertical deployments, and a $450M headline spanning contracts plus MOUs, yet it has not disclosed price, revenue, margin, or burn. The investable question is therefore not whether monetization is imaginable—it is whether revenue quality, capital intensity, and runway can be proven before the next financing decision.
sections:
- id: revenue-model-recognition
  title: Revenue Model, Pricing, and Recognition
  body: |-
    ZaiNar’s public materials support a software-led monetization thesis, not a quantified revenue base. The company describes a positioning layer that turns existing 5G and Wi-Fi infrastructure into a sensing system without new hardware, while the February 2026 funding announcement says the company is accelerating deployment with carrier and enterprise partners globally. Those disclosures, plus secondary reporting around Zero, make several monetization paths plausible: carrier licensing or network software sold to operators, enterprise software subscriptions for hospitals and industrial sites, deployment or integration services, API or data-platform fees, and possibly partner-led tag or overlay revenue where buyers still want attached devices or gateway workflows.

    The problem is that none of those paths are priced in public. No reviewed source disclosed list price, realized price, contract term, average deal size, ARR, or recognized revenue. Instead, ZaiNar publicizes more than $450 million in combined contracts and memoranda of understanding. That headline is directionally positive for demand, but it is not enough for recognition analysis. IFRS 15 centers revenue on contracts with customers and the satisfaction of performance obligations, while ZaiNar’s disclosure blends binding and non-binding instruments and omits enforceability, payment terms, and timing. The right financial read is therefore conservative: verified demand signal, but not verified revenue quality. Until management separates binding backlog from MOUs and shows how contracts convert into billings and revenue, the $450 million figure should be treated as pipeline or bookings context rather than revenue evidence.
