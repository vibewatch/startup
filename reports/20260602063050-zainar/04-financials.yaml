- id: gtm-sales-efficiency
  title: Go-to-Market Motion and Sales-Efficiency Proxies
  body: |-
    The public GTM pattern is complex and high-touch. On the carrier side, ZaiNar is implicitly selling outcome-bearing network software: a way for operators to extract more value from sunk 5G assets and potentially monetize location where the company claims positioning can be worth more than connectivity itself. On the enterprise side, adjacent vendors like Cisco and HPE package location into broader smart-space, asset-tracking, and analytics offers that include onboarding, support, APIs, and purchase-option conversations rather than self-serve checkouts. That matters because it suggests ZaiNar is unlikely to behave like a fast, lightweight SaaS motion even if the core product is software-led.

    External proxies point the same way. Capgemini’s 2026 telco survey says 65% of B2B buyers find the telecom buying process too complex, 68% want integrated solutions, and 61% are unhappy with post-sales support for integrated offerings. Optifai puts median B2B SaaS cycle length at 84 days and enterprise deals above $100K at 90-180+ days, while Aexus argues enterprise software with infrastructure change and multiple departments often takes 9-18 months or longer. Those figures are not ZaiNar metrics, but they are directionally useful. They imply multi-quarter pilots, security review, procurement, and post-sale enablement costs. Publicly available data does not disclose ZaiNar customer names, renewals, conversion rates, sales headcount, or marketing spend, so CAC, payback, and sales productivity remain unmodelable. The best one can say is that this looks like a carrier-and-enterprise infrastructure sale with long-cycle economics, not a short-cycle product-led motion.
