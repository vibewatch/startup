  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: pricing-gap
    missingEvidence: Customer contracts or pricing schedules showing list price, realized price, contract term, and revenue-recognition treatment.
    whyItMatters: Without price and contract structure, ARR, backlog quality, and gross-margin underwriting remain speculative.
    diligencePath: Request executed customer agreements, price books, and a cohort of booked-to-billed examples by channel.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI012
    - QI013
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-gaps
    missingEvidence: Current cash balance, monthly burn, capex plan, debt obligations, and management runway forecast.
    whyItMatters: Capital adequacy and next-round timing cannot be assessed from lifetime funding alone.
    diligencePath: Request monthly management accounts, cash waterfall, board budget, debt schedule, and hiring plan.
    relatedQuestionRefs:
    - QI017
    - QI021
    - QI022
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: mou-quality
    missingEvidence: A breakdown of the $450M headline into binding contracts, non-binding MOUs, timing, cancellation rights, and booked revenue.
    whyItMatters: The distinction determines whether the figure reflects revenue visibility or only pipeline signaling.
    diligencePath: Obtain the pipeline ledger, top-counterparty agreements, and booked-vs-unbooked reconciliation.
    relatedQuestionRefs:
    - QI006
    - QI012
    relatedTableRefs:
    - TI001
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: services-capacity
    missingEvidence: Deployment headcount, channel mix, implementation timelines, and service gross-margin by customer segment.
    whyItMatters: Without delivery-capacity evidence, software-margin assumptions may understate service intensity and working-capital drag.
    diligencePath: Request implementation org chart, SOW templates, utilization metrics, and service margin by deployment type.
    relatedQuestionRefs:
    - QI004
    - QI019
    relatedTableRefs:
    - TI001
    - TI003
  - type: missing-source
    severity: material
    topic: renewal-and-retention
    missingEvidence: Named paying customers, renewal rates, net retention, and pilot-to-production conversion data.
    whyItMatters: Revenue quality depends on repeatability and renewal, not only on technical claims or MOUs.
    diligencePath: Request customer cohort data, logo list with ARR, renewal history, and pipeline conversion by stage.
    relatedQuestionRefs:
    - QI012
    - QI018
    - QI026
    relatedTableRefs:
    - TI005
