  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      A real market and product wedge flows into a conditional recommendation because proof quality and price support
      still lag the narrative.
    data:
      nodes:
        - id: n1
          label: RTLS market tailwind
          type: driver
          detail: Rapid category growth supports attention.
        - id: n2
          label: Brownfield tech wedge
          type: strength
          detail: Existing 5G / Wi-Fi positioning without new hardware is the core upside.
        - id: n3
          label: Revenue-quality gap
          type: risk
          detail: No public revenue or binding-backlog bridge.
        - id: n4
          label: Comparable reality
          type: risk
          detail: Public comps have far more disclosure and scale.
        - id: n5
          label: $1B+ current mark
          type: decision
          detail: Premium price requires premium proof.
        - id: n6
          label: Track / research-more
          type: outcome
          detail: Stay engaged, but keep price discipline and diligence gates.
      edges:
        - from: n1
          to: n2
          label: supports upside
        - from: n2
          to: n5
          label: can justify premium only if verified
        - from: n3
          to: n5
          label: cuts support now
        - from: n4
          to: n5
          label: caps clean fair value today
        - from: n5
          to: n6
          label: current answer
