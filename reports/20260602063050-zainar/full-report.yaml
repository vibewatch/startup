      - number: '4.4'
        title: Public Traction, Capital Adequacy, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Public traction exists, but the financial inputs required for underwriting do not. ZaiNar has disclosed
              more than $100 million of financing at a valuation above $1 billion, more than 100 patents filed with 90
              issued, and deployments across multiple verticals and continents. Tracxn also shows only 35 employees at
              the end of 2024 and 50 by April 2026, which suggests a still-lean operating base relative to the
              commercial ambitions implied by carrier integration and multi-continent enterprise deployment. What is
              missing is more important than what is present: cash on hand, monthly burn, debt, capex, backlog aging,
              DSO, collections, and recognized revenue are all undisclosed.


              A comparable public positioning company underscores the gap. NextNav’s 2024 annual report says it has
              generated only limited revenue, relied primarily on debt and equity financings, posted a $101.9 million
              net loss, used $38.0 million of operating cash in 2024, and ended the year with $80.1 million of cash and
              marketable securities while still expecting future equity or debt support. ZaiNar is not NextNav, but the
              comparison is useful because both sit in location infrastructure with technical depth and
              commercialization complexity. Against that backdrop, $100 million-plus of lifetime funding does not
              automatically look excessive; it may even be conservative if carrier and enterprise rollouts require long
              pilots, integration work, and continued R&D. But capital adequacy cannot be underwritten from funding
              history alone. Until management discloses burn and converts backlog into transparent billings and revenue,
              the company remains financing-dependent in the analytical sense even if it is not immediately
              cash-constrained in practice.
