    summary: >-
      Process map for how ZaiNar likely moves from buyer interest to scaled rollout, highlighting where named proof
      currently drops out of the public record.
    approximationNotes: This is a stage map, not a quantified conversion funnel. Public sources disclose no stage-level conversion data.
