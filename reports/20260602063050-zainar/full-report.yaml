      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |
              ZaiNar was co-founded by Daniel Jacker (CEO) and Philip Kratz (CTO), with Alex Hooshmand
              also listed as a co-founder in company data aggregators. A fourth co-founder identity has
              been referenced in some data sources but is not individually named in primary press materials.

              Daniel Jacker (CEO) holds an MBA from Stanford University and describes himself as a serial
              entrepreneur with successful exits and venture capital experience. His documented prior career
              includes founding The 3D Printing Company (CEO, approximately 2010–2013); building and leading
              Accenture's 3D Printing Strategy practice, serving Fortune 100 and government clients on
              emerging supply chain technologies (3D printing, IoT, drones); a Venture Capital Summer
              Associate role at Foundation Capital (2016); and a Lightbank Venture Capital MBA Fellowship
              (2016). He is also a co-founder and general partner of Magic City, a seed fund focused on
              Stanford GSB-affiliated startups — an ongoing outside commitment. His Equilar profile lists
              him as a board member of Zainar Inc. as of October 2021, corroborating his continued executive
              role. Jacker serves as the primary public spokesperson and is the face of ZaiNar's fundraising
              and commercial launch.

              Philip Kratz (CTO, co-founder) has a significantly lower public profile. No detailed
              biographical source independently describes his academic or professional background. His
              co-founder designation and CTO title appear consistently across Craft.co, Tracxn, and the
              Silicon Valley Invest Club profile, but no primary source provides depth on his technical
              background or prior patents.

              Eric Wilson is listed as Vice President of Hardware at ZaiNar per Craft.co. His role
              indicates leadership of hardware integration, antenna, and RF system design. No biographical
              information is publicly available.

              Nishant Batra (former CTO, Nokia) joined as a Board Advisor, as disclosed in the company's
              "5G Killer App" press release. His quote in that release explicitly stated he joined due to
              the size of the market opportunity, suggesting an advisory relationship initiated in early 2026.
              Steve Jurvetson (Future Ventures, SpaceX board) is the sole named board member (not merely
              investor) identified in press materials. Full board composition — including any independent
              directors, investor-appointed seats, audit or compensation committee structures — has not
              been publicly disclosed. This creates material governance opacity for diligence purposes.

              Daniel Jacker's concurrent outside commitments (Magic City seed fund, multiple startup
              advisor roles) and the absence of a documented second-tier executive team (CFO, CMO, VP Sales)
              represent measurable key-person concentration risk. No leadership changes, departures, or
              executive additions have been announced as of the run date.
