      - number: '3.4'
        title: Switching Costs, Multi-Homing, Distribution, and Supply Access
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this category are real, but they arise later in the adoption cycle than a raw
              technology comparison suggests. The first sale is often a pilot where buyers are still willing to compare
              multiple stacks. The lock-in begins once location data is connected into MES, ERP, WMS, hospital
              operations systems, yard workflows, safety alerts, digital twins, or carrier products. Quuppa highlights
              open APIs and a broad technology ecosystem; Cisco Spaces emphasizes APIs, partner apps, and map-based
              workflows; Inpixon sells direct integration into ERP and MES processes; and Impinj stresses a partner
              ecosystem built around its platform. Those examples imply that the durable switching cost is not only the
              radio layer. It is the downstream workflow logic, operational dashboards, alerting, partner integrations,
              and retraining built around that layer.


              That same logic makes multi-homing common. Enterprises can use RFID for item-level inventory, BLE or Wi-Fi
              for campus assets, UWB for a high-precision industrial cell, and GPS or computer vision for other
              workflows. Public sources do not show a winner-take-all stack. Instead, they show a market that fragments
              by environment, precision requirement, workflow, and installed infrastructure. This helps ZaiNar because
              buyers may adopt a software overlay without ripping out every other location system. But it also hurts
              moat durability because buyers can trial ZaiNar beside incumbent systems rather than replacing them
              wholesale. Distribution and supply access then become decisive. Cisco, HPE, Nokia, Qualcomm, Zebra,
              Impinj, and Qorvo already control major pieces of the procurement surface — APs, private wireless, chips,
              readers, tags, and enterprise accounts — while ZaiNar still lacks publicly named carrier wins that would
              demonstrate equivalent channel leverage.
            claimRefs:
              - CP012
              - CP016
              - CP024
              - CP025
              - CP027
              - CP030
