    rows:
      - - ZaiNar
        - Direct / software-led network positioning
        - Private; $100M+ raised and $1B+ valuation disclosed; revenue and customer count undisclosed
        - Carriers, private 5G, healthcare, industrial, logistics, smart city
        - Claims sub-meter or sub-10cm positioning on existing 5G and Wi-Fi without new hardware
        - Named carrier wins, pricing, and production-scale proof remain undisclosed
      - - Qualcomm TPS + Skyhook legacy
        - Direct / telecom-native entrant
        - 'Qualcomm public scale: $44.3B FY2025 revenue (Craft); Skyhook is a subsidiary per Craft'
        - IoT, cellular, Wi-Fi, terrestrial positioning
        - Existing silicon, patent, and carrier reach; explicit terrestrial positioning service
        - Public feature depth is thinner than broad corporate scale; service details are sparse in reviewed materials
      - - Nokia private wireless
        - Direct / likely entrant
        - >-
          Nokia public scale: €19.9B FY2025 revenue; 730 private wireless customers in Craft and 850+ enterprise
          customers on official page
        - Industrial private wireless, logistics, manufacturing, mission-critical sites
        - Can bundle location into broader private-wireless and industrial-digitalization programs
        - Positioning is part of a broader portfolio, not a pure-play location wedge
      - - Cisco Spaces
        - Direct / adjacent brownfield infrastructure
        - Enterprise software platform at installed-base scale; 9T location updates and 99.9% uptime publicized
        - Campus, hospitals, manufacturing, offices, venues
        - Turns Cisco hardware into sensors; APIs, partner apps, 3D maps, asset tracking, analytics
        - Many use cases still rely on BLE tags or Wi-Fi telemetry and public precision is lower than ZaiNar claims
      - - HPE Aruba Networking
        - Direct / adjacent brownfield infrastructure
        - Public enterprise-network incumbent; funding not relevant as a business unit
        - Campus Wi-Fi, wayfinding, asset tracking, customer engagement
        - Wi-Fi FTM, BLE, self-locating APs, location analytics through existing network footprint
        - Location sits inside a broad networking suite and is unlikely to be sold as a standalone high-precision wedge
      - - Quuppa
        - Incumbent RTLS / BLE
        - Private; Craft reports $23.7M funding, 2K systems, and 170 partners
        - Industry 4.0, logistics, healthcare, public spaces
        - Bluetooth RTLS with open APIs, partner ecosystem, and proven ROI case studies
        - Requires BLE tags / infrastructure and does not attack carrier handset positioning
      - - Ubisense
        - Incumbent RTLS / UWB-led industrial
        - Scale/funding not clearly public in reviewed primary sources
        - Automotive, aerospace, transit, logistics, manufacturing
        - SmartSpace software plus UWB, BLE, GPS, and tags for industrial workflows
        - More hardware-heavy than ZaiNar and concentrated in industrial process environments
      - - Impinj
        - Incumbent RTLS / RFID
        - Public; Craft reports $361.1M FY2025 revenue
        - Retail, supply chain, healthcare, manufacturing
        - RAIN RFID platform plus broad partner network and item-level visibility
        - Requires tags/readers and is strongest where RFID unit economics already work
      - - Inpixon
        - Incumbent RTLS / industrial workflow platform
        - 'Public but small: Craft reports $22.5M FY2025 revenue and ~$10.2M market cap'
        - Factories, warehouses, mines, supply chains
        - RTLS plus workflow analytics, AI, and integration into industrial operations
        - Less financial firepower than larger incumbents and still hardware- and integration-dependent
      - - Humatics
        - Adjacent high-precision substitute
        - Private; Craft reports $80.2M total funding
        - Automation, robotics, rail and transit
        - Sub-millimeter positioning and predictive-maintenance positioning stack
        - Narrower sector focus and likely dedicated-system deployment model
      - - Qorvo / Decawave heritage
        - Adjacent component ecosystem
        - Public; Craft reports $3.7B FY2026 revenue
        - UWB OEMs, industrial, consumer, automotive
        - Centimeter-accuracy UWB ICs, software, modules, reference designs, partner path
        - Mostly an enabling layer rather than a full workflow platform; still reinforces UWB competition
