  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct, Incumbent, Adjacent, and Status-Quo Alternatives'
        blocks:
          - type: paragraph
            body: >-
              ZaiNar is not competing against one neat peer set. The direct comparison set is the small group of vendors
              trying to extract location intelligence from existing connectivity infrastructure or adjacent software
              layers: Qualcomm's terrestrial positioning service, Nokia private wireless, Cisco Spaces, and HPE Aruba
              location services all market some version of location-aware services that ride on current network assets
              rather than requiring a full dedicated anchor estate. Those companies are not identical to ZaiNar — Cisco
              and HPE lean heavily on Wi-Fi and BLE telemetry, Nokia sells private-wireless programs more broadly than
              positioning alone, and Qualcomm appears to frame terrestrial positioning as part of a larger IoT and
              connectivity stack — but they matter because they attack the same brownfield-upgrade budget story.


              The larger incumbent set is classic RTLS: Zebra, Impinj, Quuppa, Ubisense, Inpixon, and Humatics. They
              solve overlapping jobs — asset visibility, workflow automation, safety, yard management, predictive
              maintenance, and industrial coordination — but usually with a different hardware philosophy. Quuppa
              emphasizes Bluetooth-based RTLS with tags, algorithms, and a partner ecosystem; Ubisense sells SmartSpace
              with UWB, BLE, and GPS-capable tags and sensors; Impinj is the RAIN RFID incumbent; Qorvo enables UWB
              micro-location through chips, software, modules, and partner tooling; and Humatics targets sub-millimeter
              micro-location for industrial automation and rail. The status quo is broader still: GPS outdoors, cameras
              and computer vision, SLAM and LiDAR in robotics, BLE or RFID beacons, and manual search-and-check
              workflows. The strategic implication is that ZaiNar is differentiated less by ‘indoor location’ in the
              abstract than by a claim that buyers can get materially better positioning from infrastructure they
              already own, without a new tag-and-anchor rebuild.
