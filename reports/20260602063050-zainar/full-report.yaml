      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The technically credible version of the architecture starts with timing, not with map software. ZaiNar's
              public thesis is that radio waves travel roughly 30 centimeters per nanosecond, so if clocks across a
              network can be aligned at sub-nanosecond granularity, then arrival-time and phase measurements become
              useful enough for sub-meter or even centimeter-class positioning. That logic is directionally consistent
              with the 5G standards path and with the company's patent portfolio. Independent technical sources show
              that NR positioning already spans downlink PRS, uplink SRS, TDoA, AoA, RTT, and in Release 18
              carrier-phase enhancements. The company's specific wedge is to emphasize network-side use of connectivity
              signals rather than a handset-controlled PRS path.


              That distinction matters. In the standard framing, PRS is a downlink positioning reference signal
              transmitted by gNBs to UEs, while SRS is an uplink sounding reference signal transmitted by the UE and
              measured by the network. OpenAirInterface documentation and other technical sources show that these paths
              are implemented differently and have different control-plane maturity. ZaiNar's marketing language lines
              up with an SRS-heavy, network-computed model: if the device already has to transmit connectivity signals,
              the network can estimate timing, angle, or phase without waiting for app permissions or OEM APIs. That is
              a real conceptual advantage over device-side or app-centric location stacks. But it does not eliminate
              hard engineering. High-accuracy network-side positioning still depends on synchronized gNBs or APs,
              well-behaved measurement windows, suitable bandwidth, good geometry, and a location-management layer that
              fuses measurements into stable estimates.


              The operating model therefore looks like this: connected devices emit ordinary radio signals; the
              installed network captures timing or phase observations; a synchronization and location engine normalizes
              those measurements; and APIs or workflow software turn coordinates into alerts, visibility, or
              coordination actions. On Wi-Fi, public baselines remain meaningfully weaker than ZaiNar's promise: Wi-Fi
              Alliance talks about meter-level indoor location, while Android's Wi-Fi RTT documentation describes 1-2
              meter results with explicit device, AP, permission, and foreground-app requirements. That gap is why
              ZaiNar's Wi-Fi claims are interesting. It is also why they should be read cautiously until a direct
              technical benchmark appears.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE021
              - CE022
              - CE034
