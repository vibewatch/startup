      - number: '7.2'
        title: Legal, Regulatory, and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              ZaiNar’s legal and regulatory risk is not that a public enforcement action has already been found against
              the company; it is that its most promising route to scale runs through a tightly governed category. The
              company wants carriers and enterprises to derive value from location data generated by network
              participation itself. In the United States, carrier-held location data sits inside the CPNI framework, and
              FCC guidance explicitly includes the location of an active mobile device as protected information. EPIC’s
              review of 2024 carrier forfeiture orders and 2025 appellate decisions suggests courts and regulators
              remain willing to treat subscriber location data as sensitive and legally protected. The FTC’s InMarket
              action shows the same scrutiny on the ad-tech side: precise location data can trigger restrictions on
              sale, licensing, targeting, retention, and consent flows.


              That matters because ZaiNar’s channel strategy appears partner-dependent. If carriers, integrators, or
              data-processing partners are the route to market, poor consent design or weak downstream oversight can
              transmit back into launch delays, contract friction, or reputational damage. The 2024 FTC/FCC MOU
              reinforces that jurisdiction is shared rather than simple. This is manageable risk, not automatic failure,
              but it raises the diligence bar materially.


              The booking-quality issue sits beside privacy as the other top legal concern. Stanford’s MOU guidance is
              not a comment on ZaiNar specifically, but it is a useful reminder that MOUs are often nonbinding
              preliminary instruments. Because ZaiNar publicly combines contracts and MOUs into one headline number,
              investors cannot yet distinguish enforceable backlog from strategic signaling. That ambiguity is
              especially important at a $1B-plus valuation where commercial proof is supposed to carry more weight than
              pure technical promise.
