      - number: '8.5'
        title: Final diligence asks that would move the call from track to investable
        blocks:
          - type: paragraph
            body: >-
              The good news is that the core diligence blockers are specific and knowable. This is not a case where
              investors need impossible macro prediction; they need a better operating packet. The company can
              materially improve its valuation support by producing a contract-quality bridge, a billings and revenue
              bridge, a software-versus-services gross-margin split, named customer and carrier references, and a
              cap-table summary. Those asks directly answer the open questions that currently force the analysis into
              scenario ranges instead of a tighter valuation framework.


              What would change the view? A clean package showing that most of the $450 million headline is binding and
              monetizable, that early deployments convert into recurring revenue, and that deployment economics remain
              software-heavy would move the recommendation upward quickly. A price reset could also change the answer
              even if disclosure remains imperfect, because the current issue is not whether ZaiNar is interesting. It
              is whether the entry multiple already assumes too much proof.


              Until one of those two changes happens, the most honest conclusion is disciplined patience. ZaiNar may yet
              become worth much more than $1B, but current public evidence does not let an outside investor conclude
              that the company is already worth that much on a present-fair-value basis.
            claimRefs:
              - CV025
