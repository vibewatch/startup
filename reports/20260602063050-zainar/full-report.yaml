      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: MOU Inflation Risk — $450M+ Contracts vs. Named Customers
            body: >-
              ZaiNar's headline figure of "more than $450 million in contracts and memoranda of understanding" blends
              binding and non-binding instruments without disaggregating them. No named enterprise customer, carrier, or
              contract counterparty has been publicly identified. The February 2026 press release simultaneously
              described "major carrier and enterprise partnerships to be announced in the coming weeks" — yet as of the
              June 2026 run date, no such announcement has appeared. This pattern — large aggregate MOU figures combined
              with absent named customers — is common in early-stage deep-tech companies and warrants independent
              verification of contract binding status, payment terms, and conversion rates before accepting the figure
              at face value.
            calloutType: risk
            claimRefs:
              - CO034
              - CO035
              - CO043
          - type: callout
            title: Security and Privacy Risks in Network-Based Positioning
            body: >-
              A 2025 peer-reviewed survey published in Nature (Scientific Reports) identifies spoofing, jamming, and
              unauthorized tracking as material security and privacy threats in indoor localization systems of the type
              ZaiNar deploys. Specifically, the study highlights signal spoofing attacks that inject false timing data,
              jamming attacks that degrade system availability, and data-privacy violations through unauthorized
              collection of location streams. These risks are particularly acute for carrier-grade deployments where
              sub-10cm precision tracking of all connected devices — including personal smartphones — occurs at the
              network level without per-device user consent. ZaiNar has not published security architecture
              documentation, compliance frameworks, or privacy policies addressing these threat vectors.
            calloutType: risk
            claimRefs:
              - CO044
          - type: callout
            title: Key-Person Concentration in CEO
            body: >-
              Daniel Jacker is ZaiNar's sole named public spokesperson, capital-raiser, and strategic decision-maker. No
              CFO, VP of Sales, or second-tier executives have been publicly identified. Jacker also maintains an active
              outside venture role (Magic City seed fund co-founder and GP). The CTO (Philip Kratz) has no publicly
              documented background or patent attribution, making technical leadership assessment difficult. This
              concentration of external visibility and internal authority in a single individual represents material
              key-person risk, particularly as the company scales past stealth into carrier commercialization.
            calloutType: insight
            claimRefs:
              - CO014
              - CO018
              - CO019
