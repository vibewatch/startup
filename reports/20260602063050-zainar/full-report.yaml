  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              ZaiNar should not be sized as a generic telecom-infrastructure vendor. The public evidence places it in a
              narrower but still heterogeneous cluster: RTLS, indoor positioning, and terrestrial network-side
              positioning layered onto existing 5G and Wi-Fi infrastructure. Broad RTLS definitions from TBRC include
              hardware, software, and services across RFID, Wi-Fi, UWB, BLE, ultrasound, infrared, and GPS.
              Indoor-positioning summaries from Global Growth use a slightly different boundary centered on smart
              buildings, location analytics, asset tracking, healthcare, retail, and logistics. ZaiNar's own positioning
              is narrower still: software and timing intelligence that uses existing connectivity signals rather than a
              dedicated tag-and-anchor network.


              The most relevant substitutes are not one single vendor class. Company materials explicitly frame GPS,
              cameras or computer vision, and UWB beacon systems as the status quo to beat, while Wi-Fi Alliance and
              academic reviews show that buyers still choose among Wi-Fi, BLE, RFID, UWB, LiDAR, SLAM, and hybrid stacks
              based on the environment. That means ZaiNar competes for budget wherever a buyer wants more precise and
              lower-friction spatial awareness, but it does not automatically capture the whole RTLS stack. In
              brownfield sites, the sharpest substitution argument is not against all RTLS spend; it is against the
              dedicated hardware, calibration, and workflow friction that incumbent systems often require.
            claimRefs:
              - CM001
