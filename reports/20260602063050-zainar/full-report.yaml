  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      ZaiNar scores well on market and technical wedge, but weakly on economics visibility, exit readiness, and current
      valuation attractiveness.
    data:
      items:
        - label: Market opportunity
          value: 8
          note: Large and growing RTLS / automation tailwind is well supported.
        - label: Technical wedge
          value: 8
          note: Brownfield network-side positioning is differentiated if it works in production.
        - label: Customer proof
          value: 4
          note: Use cases are plausible, but named recurring references remain scarce.
        - label: Economics visibility
          value: 2
          note: No public revenue, gross margin, burn, or backlog-conversion disclosure.
        - label: Regulatory readiness
          value: 4
          note: Location-data governance is manageable but increases diligence burden.
        - label: Exit readiness
          value: 3
          note: Near-term IPO case is weak on public evidence; strategic routes are more plausible.
        - label: Valuation attractiveness
          value: 3
          note: Current headline price assumes more proof than public sources currently show.
    approximationNotes: >-
      Scores are qualitative 1-10 judgments based on public evidence as of 2026-06-02 and are intended for
      investment-committee prioritization only.
