            title: Broad RTLS TAM Can Easily Overstate ZaiNar's Real Capture Window
            body: >-
              The most accessible public market figures bundle together hardware-heavy RTLS, indoor-positioning, and
              multiple wireless technologies. ZaiNar may benefit from that category growth, but no public source
              isolates the specific network-side wedge it is actually trying to monetize. Investors should therefore
              treat broad TAM as context rather than near-term revenue denominator.
