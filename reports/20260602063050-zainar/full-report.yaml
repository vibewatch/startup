  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track, stay price-sensitive, and do not underwrite the headline mark on public evidence alone'
        blocks:
          - type: paragraph
            body: >-
              ZaiNar has a credible reason to exist in a large market. Prior chapters support a real product wedge: if
              the company can turn existing 5G and Wi-Fi into sub-meter positioning without new hardware, it attacks one
              of RTLS's biggest adoption frictions. The market backdrop is also constructive. Mordor and TBRC both show
              an RTLS category growing rapidly as industrial automation, healthcare, logistics, and autonomy programs
              demand better location data. That is enough to justify attention.


              It is not enough to justify a blind $1B-plus entry. The central underwriting problem is unchanged from the
              financials, customers, and risks chapters: ZaiNar discloses a valuation headline and a contracts-plus-MOUs
              headline, but not recognized revenue, ARR, gross margin, burn, backlog conversion, or cap-table terms. The
              company may be early and excellent, but public investors cannot tell whether the story is becoming a
              software platform, a high-touch deployment business, or a still-pre-revenue commercialization bet.
              Stanford's MOU guidance and IFRS 15 are not technicalities here; they are the reason the $450 million
              headline cannot be treated as revenue-quality proof.


              The right call is therefore conditional. Public evidence supports engagement, not conviction at the
              current price. Recommendation: track / research-more. Confidence: medium. Risk rating: high. Valuation
              stance: stretched on current evidence, potentially supportable only if the next diligence layer proves
              binding backlog, named customers, and software-heavy margins. At the disclosed headline mark, downside
              asymmetry still dominates the base case.
            claimRefs:
              - CV001
              - CV002
