      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Working Capital
        blocks:
          - type: paragraph
            body: >-
              The structural attraction in ZaiNar is obvious: if the company truly reuses existing 5G and Wi-Fi
              infrastructure and sells mostly software plus analytics, it could avoid the hardware gross-margin drag
              that defines much of RTLS. Mordor says hardware still represented 39.13% of RTLS revenue in 2025 even as
              software grew faster, while TBRC still segments category revenue across hardware, software, and services.
              Those industry shapes support a bullish margin thesis for ZaiNar relative to UWB- or RFID-heavy
              alternatives.


              But the public evidence also shows why realized margins may land below the pure-software dream.
              Hardware-heavy RTLS deployments can exceed $150,000 for a 100,000-square-foot plant, and active UWB tags
              can cost $25-45 each, which makes ZaiNar’s no-new-hardware pitch economically powerful if it holds in
              production. At the same time, Cisco and HPE both show that real enterprise location deployments are sold
              with onboarding, analytics, support, BLE or Wi-Fi instrumentation, and packaged operational workflows.
              Cisco’s own asset-tracking product still involves BLE tags or Wi-Fi devices and claims savings through
              better utilization, while HPE emphasizes AP placement, mapping, and expert engagement. That means ZaiNar’s
              margin path depends on how much of the delivery stack it must own. Public sources do not disclose its
              services mix, implementation labor, receivables profile, deferred revenue, or capex, so working-capital
              intensity is still opaque. The prudent view is that gross margins could be attractive, but only if
              deployment stays software-dominant and service load does not swell as pilots move into production.
            claimRefs:
              - CI011
              - CI012
              - CI017
              - CI018
              - CI019
              - CI020
              - CI021
              - CI022
