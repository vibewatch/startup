    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: The biggest valuation swings come from proof-quality variables rather than from marginal TAM optimism.
    data:
      items:
        - label: Binding backlog bridge
          value: 450
          detail: >-
            Approximate EV swing in USD millions versus base midpoint if management proves most of the headline is
            binding and monetizable.
          tone: positive
        - label: Named carrier or customer proof
          value: 300
          detail: EV support rises materially if distribution and renewals become referenceable.
          tone: positive
        - label: Software gross-margin proof
          value: 250
          detail: A cleaner software-heavy margin profile would narrow the discount.
          tone: positive
        - label: Services / hardware burden
          value: -300
          detail: If deployments are integration-heavy, the premium multiple compresses.
          tone: negative
        - label: Preference / dilution overhang
          value: -200
          detail: Unknown structure terms can materially reduce new-money value capture.
          tone: negative
        - label: Exit multiple recovery
          value: 250
          detail: A stronger public-market window helps only after operational proof is visible.
          tone: warning
    approximationNotes: >-
      Values are rough sensitivity magnitudes around the base-case midpoint, not additive model outputs or audited
      valuation deltas.
