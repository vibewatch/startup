      - number: '3.3'
        title: Capability, Pricing, and Go-to-Market Comparison
        blocks:
          - type: paragraph
            body: >-
              ZaiNar's strongest public differentiation is capability packaging, not raw existence of location
              intelligence. Its materials claim sub-meter or sub-10cm positioning from existing 5G and Wi-Fi
              infrastructure without new hardware, without device-maker cooperation, and without extra battery drain.
              Most incumbents in the reviewed set solve the same operational jobs through a heavier stack: tags,
              readers, BLE beacons, UWB anchors, custom modules, or integrated sensors. Quuppa, Ubisense, Inpixon,
              Impinj, and Qorvo each offer stronger public evidence of today's workflow breadth than ZaiNar does, but
              they also imply more hardware dependency. Cisco Spaces and HPE Aruba are the clearest infrastructure-led
              adjacencies because they already use installed Wi-Fi infrastructure, yet even they rely on BLE tags or
              Wi-Fi telemetry for many use cases and currently advertise materially lower public precision than ZaiNar
              claims.


              Pricing is much less transparent than capability. Across ZaiNar, Quuppa, Cisco Spaces, Qorvo, Humatics,
              HPE Aruba, and most enterprise RTLS vendors reviewed, the public packaging is overwhelmingly quote-based
              or partner-mediated, not self-serve list pricing. That weakens any simplistic cheaper-than-incumbent-RTLS
              claim unless management can prove delivered total cost of ownership at deployment scale. The go-to-market
              asymmetry is clearer: Zebra, Cisco, HPE, Qualcomm, and Nokia already sit inside large channel, carrier, or
              enterprise procurement motions; Impinj and Qorvo control critical component ecosystems; and Quuppa has an
              explicit partner network. ZaiNar may be technically elegant, but it is entering a market where the
              incumbent route to budget often starts with the vendor already selling the network, tags, readers, or
              workflow software.
