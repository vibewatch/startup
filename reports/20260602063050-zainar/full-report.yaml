      - number: '7.3'
        title: Technical Verification, Operational Reliability, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              The main technical risk is not that ZaiNar’s architecture is impossible; it is that public proof still
              trails the breadth of the claims. The company says it can deliver network-side positioning from existing
              5G and Wi-Fi, with sub-meter or sub-10cm accuracy and resilience advantages over GPS, cameras, and
              dedicated beacons. Independent category sources support the intuition that brownfield positioning is
              valuable, but they also show how hard production reliability is. Cambridge highlights the persistent
              trade-off between accuracy, scalability, and cost in dynamic indoor environments, while Nature catalogs
              spoofing, jamming, and unauthorized-tracking risk. NIST’s LTE security guide adds a carrier-grade warning:
              rogue base stations can cause privacy compromise, denial of service, and even emergency-service
              disruption, and jamming protection remains an active area of research.


              This does not mean ZaiNar will fail under real RF conditions. It does mean the burden of proof is still
              ahead. ZaiNar’s own launch materials frame safety-oriented use cases in healthcare, construction, and
              autonomous operations. Once localization sits inside worker geofencing, medical-device finding, or
              coordinated machine motion, false positives and false negatives stop being cosmetic KPI misses and become
              operational or liability events. OSHA’s robotics guidance underscores that many injuries occur during
              non-routine setup, maintenance, and testing — exactly the messy environments where localization and safety
              controls can be stressed.


              The underwriting consequence is clear: until management can show named deployments with uptime,
              calibration burden, reliability metrics, and security controls, technical risk should be treated as a
              commercialization risk, not as an isolated engineering risk. It flows directly into renewals, margin,
              referenceability, and whether carriers trust the product enough to put it in front of their own customers.
            claimRefs:
