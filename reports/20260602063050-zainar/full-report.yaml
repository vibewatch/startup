      - number: '5.3'
        title: Deployment, Maturity, Support, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              ZaiNar is farther along than a pure lab concept, but the public record still falls short of a fully
              evidenced production platform. The strongest maturity markers are the chronology and the patent estate.
              After nine years of stealth R&D, the company emerged publicly in February 2026, announced funding and
              deployments, then in March 2026 announced commercial availability for its 5G positioning product.
              Secondary coverage around Zero suggests a Wi-Fi-specific extension of the same thesis. This sequence is
              enough to say there is a product story and launch cadence, not just a science project.


              The weaker part is operational proof. The company has not published named carrier customers,
              vendor-certified integration documents, public support manuals, status pages, reliability metrics, or
              service-level commitments. The deployment story is therefore use-case rich but operator sparse. For
              diligence, that means the right maturity label is "commercializing with narrative evidence" rather than
              "operationally benchmarked at scale." The likely support model is also high-touch. A brownfield location
              layer still requires RF tuning, network configuration, workflow integration, and privacy or policy setup
              at each site. That is especially true in hospitals, factories, and campuses where multipath, interference,
              and layout changes can erode accuracy even when the underlying algorithms are sound.


              The roadmap is partly visible and partly opaque. Publicly visible milestones include stealth R&D, the
              February 2026 emergence, the March 2026 5G commercial launch, and the Wi-Fi Zero narrative. Standards
              progress in Release 18 expands the medium-term addressable scope through RedCap, bandwidth aggregation,
              low-power high-accuracy positioning, and sidelink. What remains missing are the forward operating details
              investors normally want: named carrier rollouts, support cadence, certification roadmap, integration
              partners, and repeatable reference deployments. Until those appear, roadmap confidence should sit with the
              standards and patent trajectory, not with a fully disclosed release plan.
