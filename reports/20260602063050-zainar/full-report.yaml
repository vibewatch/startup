      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for ZaiNar must be treated as a range, not a single number. The broadest adjacent
              markets are RTLS and indoor positioning, but the public estimates vary widely: Mordor puts RTLS at USD
              7.13 billion in 2025, Global Growth puts indoor positioning at USD 12.38 billion, and TBRC puts RTLS at
              USD 14.82 billion. Forward estimates diverge even more, from USD 25.81 billion in 2031 to USD 53.26
              billion in 2030. These numbers are directionally useful because they confirm that buyers already spend
              real money on location visibility, but they are not directly comparable because they mix different
              boundaries, years, and methodologies.


              The most defensible public SAM lens is narrower. MarketsandMarkets sizes manufacturing and automotive RTLS
              at just USD 1.19 billion in 2025, which is useful because ZaiNar has named industrial, logistics, and
              construction use cases and because brownfield 5G or Wi-Fi augmentation is especially plausible in complex
              sites. Healthcare is also material: Mordor calls it the largest RTLS vertical, and other reports tie
              demand to patient safety, asset utilization, and reimbursement. What public evidence does not provide is a
              standalone market size for network-side 5G or Wi-Fi positioning, so any ZaiNar-specific SAM or SOM must
              remain constrained and low confidence. The right interpretation is that ZaiNar sells into a real market
              family, but its own capture-ready denominator is still unproven in public.
