          label: Use-case interest
          type: stage
          detail: Buyer sees potential in healthcare asset finding, worker safety, or network-derived positioning.
        - id: f3
          label: Pilot / proof zone
          type: stage
          detail: Accuracy, governance, and integration are tested in a constrained environment.
        - id: f4
          label: Commercial package
          type: stage
          detail: Direct sale, carrier channel, or partner-led solution is negotiated.
        - id: f5
          label: Production site or program
          type: outcome
          detail: Live operational use begins, but public sources rarely identify the account.
        - id: f6
          label: Multi-site / multi-workflow expansion
          type: outcome
          detail: The key growth stage remains publicly unproven for ZaiNar.
