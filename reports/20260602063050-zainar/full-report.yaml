  - id: FE001
    title: ZaiNar Product Architecture Map
    type: stack
    data:
      layers:
        - label: Workflow outcomes layer
          detail: >-
            Asset finding, safety geofencing, autonomous coordination, and carrier location products consume the final
            location feed.
        - label: Application / API layer
          detail: Customer logic, alerts, and operational software convert coordinates into actions rather than maps alone.
        - label: Location computation layer
          detail: A central engine fuses timing, phase, or angle observations into position estimates and confidence outputs.
        - label: Measurement layer
          detail: >-
            Network measurements are taken from uplink or downlink radio events such as SRS-, PRS-, timing-, or
            Wi-Fi-derived observations.
        - label: Synchronization layer
          detail: >-
            Sub-nanosecond clock alignment is the enabling mechanism because radio waves travel about 30 cm per
            nanosecond.
        - label: Installed infrastructure layer
          detail: >-
            Existing gNBs, TRPs, APs, and private or public wireless networks are reused as the physical sensing
            substrate.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE021
      - CE034
