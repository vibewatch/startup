  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Connected-device radio emissions (5G SRS / other uplink signals, Wi-Fi traffic)
        - Provide the measurable signal events that the network observes
        - Requires active connected devices and usable radio geometry
        - Traffic patterns, scheduling, and weak signal conditions may reduce measurement quality
      - - Time synchronization fabric
        - Align clocks tightly enough that arrival-time and phase estimates are meaningful
        - Requires stable clocking, calibration, and drift management across infrastructure
        - Any timing error directly degrades localization accuracy
      - - Measurement capture at gNBs / TRPs / APs
        - Collect timing, angle, or phase observations from the installed network
        - Depends on base-station and AP capabilities, placement, and access to measurement paths
        - Vendor heterogeneity and missing hooks can block portability
      - - Location computation / LMF-like engine
        - Fuse measurements into position estimates and confidence outputs
        - Needs synchronized inputs, bandwidth context, and filtering logic
        - Algorithm quality alone cannot overcome poor measurements or missing geometry
      - - Workflow and API layer
        - Turn coordinates into alerts, visibility, automation, and carrier products
        - Depends on customer systems, permissions, and application logic
        - Without strong integration, location data becomes shelfware
      - - Privacy / policy / audit controls
        - Constrain who can see what location data and under which conditions
        - Depends on enterprise policy, user rights, and telecom compliance
        - Unauthorized tracking or over-retention creates legal and reputational risk
      - - Implementation and support motion
        - RF survey, tuning, deployment, monitoring, and issue triage
        - Depends on skilled field engineering and partner coordination
        - High-touch delivery could erode software margin and slow scale
    notes: >-
      This table mixes verified standards concepts with inferred ZaiNar operating steps because the company has not
      published a formal architecture diagram.
