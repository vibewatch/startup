      - number: '1.4'
        title: Scale, Commercial Traction, and Milestones
        blocks:
          - type: paragraph
            body: |
              ZaiNar's intellectual property position is among the most concrete quantifiable facts
              in the public record. As of the February 2026 press release, the company had filed
              more than 100 patents and had 90 issued with zero rejections. Patent search results on
              Justia confirm multiple granted patents assigned to "ZaiNar, Inc." covering methods
              and systems for asset tracking, asset grouping, and error recovery, as well as
              phase-based time synchronization. PlainPatent records similarly confirm the patent
              portfolio's existence. The company itself characterizes a 100% allowance rate as
              a statistical anomaly in the mature radio-frequency engineering field, and this
              claim is not disputed by independent sources.

              On the commercial side, ZaiNar claims to have secured more than $450 million in
              contracts and memoranda of understanding (MOUs) as of the February 2026 emergence.
              This is a notable figure, but its evidentiary strength is limited: the $450M figure
              blends binding contracts and non-binding MOUs, neither category is individually
              quantified, and no named enterprise or carrier customer has been publicly identified.
              The company stated in the same press release that "major carrier and enterprise
              partnerships [are] to be announced in the coming weeks" — but as of the June 2026
              run date, no named carrier partner announcement has been found in public sources.
              This gap is material.

              The company's February 2026 press materials assert commercial deployment across
              healthcare (locating medical devices in hospitals), construction (freeing workers
              from hazard zones), and industrial/logistics (coordinating autonomous operations),
              on multiple continents. The "Zero" model press release adds WiFi-specific
              positioning at centimeter resolution. A second press release, dated approximately
              March 4, 2026, announced commercial availability of 5G positioning technology
              demonstrating sub-10cm accuracy on CBRS Band 48 with 20 MHz bandwidth and a
              1.5 km read range.

              International expansion is evidenced by ZaiNar opening a Tokyo office and being
              selected for the Tokyo Metropolitan Government's GX Innovation Program, as noted
              on the company's homepage. This is the only specifically named international
              partnership or government program as of the run date.

              Headcount is a significant gap: Tracxn shows the Zainar, Inc. legal entity with
              35 employees as of December 31, 2024. This is extremely lean for a company
              claiming deployments across multiple continents and $450M+ in contracts. The
              Craft.co profile lists seven named executives/employees at most; no organizational
              chart or broader headcount figure appears in primary sources. The disparity between
              the claimed commercial scale and the observable headcount warrants additional
              diligence.
