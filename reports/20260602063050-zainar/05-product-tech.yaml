  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Synchronization and timing core
    - Carrier RAN / enterprise network engineering
    - Implied by patents and core messaging; not separately productized in public
    - Sub-nanosecond synchronization is the enabling layer that makes network-side sensing plausible
    - Request architectural docs showing how timing is distributed, monitored, and recovered under drift or failure
  - - 5G positioning engine
    - Carrier product teams, private 5G operators, industrial network owners
    - Publicly launched in March 2026; commercially claimed, independently benchmarked only at category level
    - Uses connectivity signals rather than relying solely on handset-controlled positioning paths; claims low-bandwidth viability
    - Request named deployments, vendor compatibility list, and independent field benchmarks for CBRS and non-CBRS bands
  - - Wi-Fi / Zero overlay
    - Campus IT, hospitals, factories, logistics sites
    - Secondary-public only; maturity lower than 5G product in public evidence
    - Brownfield Wi-Fi reuse could be cheaper than dedicated RTLS if claims hold
    - Request official Zero documentation, AP requirements, and side-by-side accuracy tests versus Wi-Fi RTT and Wi-Fi Location baselines
  - - Workflow applications (asset finding, safety, autonomy)
    - Operations teams, hospital ops, industrial OT, construction safety
    - Use cases are described, but packaged application boundaries are not fully disclosed
    - Value is framed as turning coordinates into operational workflows, not raw maps alone
    - Request SKU map, user interfaces, APIs, and proof of measurable outcomes by vertical
  - - Patent estate
    - Management, enterprise buyers, strategic partners
    - High and concrete; multiple issued patents and granted portfolio visibility
    - Coverage spans synchronization, localization inference, multipath handling, and asset workflows
    - Request full patent family map, claim chart against product modules, and freedom-to-operate analysis
  - - Integration and support tooling
    - Carrier engineering, enterprise IT, implementation partners
    - Operationally required but publicly under-documented
    - Potentially creates switching costs once workflows are embedded in customer systems
    - Request deployment playbooks, support staffing model, and named system integrator or RAN partner references
  notes: Module boundaries are inferred from the public narrative because ZaiNar has not published a canonical SKU sheet.
