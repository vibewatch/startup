- id: FE003
  title: Critical Dependency Map
  type: dag
  data:
    nodes:
    - id: d1
      label: Carrier / private-network integration
      detail: Base-station and network-team cooperation are needed to operationalize measurement access and rollout.
      type: dependency
    - id: d2
      label: RF conditions and site geometry
      detail: Multipath, NLOS, obstruction, interference, and AP or gNB placement shape achievable accuracy.
      type: dependency
    - id: d3
      label: Standards evolution
      detail: Release 18 expands capabilities, but vendor implementation maturity still matters.
      type: dependency
    - id: d4
      label: Synchronization quality
      detail: Any drift or calibration error directly degrades location accuracy.
      type: dependency
    - id: d5
      label: Privacy and telecom compliance
      detail: Carrier monetization and enterprise tracking require lawful policy, retention, and access controls.
      type: dependency
    - id: d6
      label: Workflow integration
      detail: ROI depends on embedding location into operational systems rather than exposing raw coordinates only.
      type: dependency
    - id: d7
      label: Patent and algorithm estate
      detail: IP protects the timing and localization core but does not remove deployment risk.
      type: dependency
    - id: d8
      label: ZaiNar spatial platform
      detail: Integrated timing, measurement, and workflow stack marketed across 5G and Wi-Fi.
