- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy-preserving Wi-Fi baseline
    - Verified at category level
    - Wi-Fi Alliance and Android RTT show privacy-aware ranging patterns and permission boundaries
    - No public ZaiNar privacy architecture explains what equivalent controls exist in its network-side model
  - - Security threat model for localization
    - Verified at category level
    - Independent reviews identify spoofing, jamming, interference, and unauthorized tracking as core risks
    - No public ZaiNar disclosure explains mitigation controls, resilience testing, or adversarial assumptions
  - - Telecom regulatory fit
    - Verified at category level
    - FCC, state privacy, FTC, and partner-governance rules shape carrier-facing location services in the US
    - No public filing or product note shows how ZaiNar packages location in a compliant operator workflow
  - - Public security certifications
    - Not publicly found
    - Would normally include SOC 2, ISO 27001, or regulated-environment attestations
    - Absence of public trust-center style evidence limits buyer diligence
  - - Operational quality metrics
    - Not publicly found
    - Would include uptime, latency, support SLAs, and deployment QA procedures
    - No public metrics show whether claimed accuracy is stable over time in live sites
  - - Data minimization / retention policy
    - Not publicly found
    - Critical for any worker, patient, or handset location product
    - No public retention, anonymization, or auditability policy was identified in reviewed materials
  notes: Statuses distinguish category-level evidence from company-specific disclosure.
  claimRefs:
  - CE014
  - CE024
  - CE025
  - CE030
  - CE035
