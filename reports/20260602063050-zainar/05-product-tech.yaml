    topic: 3gpp-positioning-stack
    statement: 3GPP Release 16 established DL-TDoA, DL-AoD, UL-TDoA, UL-AoA, multi-RTT and related NR positioning methods, while Release 18 adds carrier-phase positioning, RedCap support, bandwidth aggregation, low-power high-accuracy positioning, and sidelink positioning.
