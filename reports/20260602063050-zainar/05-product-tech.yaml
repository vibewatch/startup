sections:
- id: product-definition-and-module-map
  title: Product Definition and Public Module Map
  body: 'In customer-workflow terms, ZaiNar is selling a network-side location layer, not a consumer app and not a classic tag-and-anchor kit. The company''s public materials say existing 5G and Wi-Fi infrastructure can be turned into a sensing system that continuously derives where connected devices, assets, or workers are, then feeds that spatial context into enterprise and carrier workflows. In hospitals the job is finding equipment; in construction it is hazard-zone awareness; in industrial sites it is coordinating machines and workers; in carrier settings it is monetizing location from already-deployed radio infrastructure. That definition matters because the product is only valuable if location becomes operational input, not just a prettier map.


    The visible module map is narrower than the rhetoric but still coherent. Publicly, one can identify a synchronization and timing core, a 5G positioning layer, a Wi-Fi/Zero positioning layer, and workflow-level applications such as asset tracking, safety automation, and autonomous coordination. The 5G product is the most concrete: ZaiNar claims commercial availability, network-side sensing from connectivity signals, and no required software on user devices. The Wi-Fi side is less mature in public evidence: Zero is described in secondary coverage, and Wi-Fi Alliance baselines show what mainstream infrastructure-led Wi-Fi location normally delivers. The practical read is that ZaiNar is best understood as a common synchronization-and-localization stack with different radio front doors rather than as many independent SKUs.


    Two nuances deserve emphasis. First, "no device software" is not the same as "no system integration"; network-side location still depends on measurement collection, timing distribution, carrier or enterprise network configuration, and workflow integration. Second, "no new hardware" is a commercial claim about avoiding dedicated universal location infrastructure, not proof that every deployment or workflow can avoid all supplemental assets or site work. The patent estate includes both pure localization methods and asset-tag workflow methods, which reinforces that the real product line is broader and more conditional than the shortest marketing phrase suggests.'
  claimRefs:
