  - id: CE006
    type: third-party-reported
    topic: prs-vs-srs
    statement: In standard NR positioning, PRS is a downlink positioning reference signal sent from gNBs to UEs, whereas SRS is an uplink sounding reference signal transmitted by the UE and measured by the network for channel estimation and positioning.
    sourceRefs:
    - SE011
    - SE019
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE004
    - QE008
  - id: CE007
    type: third-party-reported
    topic: implementation-maturity
    statement: OpenAirInterface documentation shows PRS support is still limited to phy-test mode in that stack while periodic SRS can run in standalone and phy-test modes, illustrating that different positioning paths carry different implementation maturity and control-plane requirements.
