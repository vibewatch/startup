- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Industry 4.0, digital twins, and smart-factory automation
    - Positive
    - Active now
    - Supports industrial RTLS spend and makes brownfield network upgrades more relevant
    - Request case studies showing measurable throughput or traceability improvements
  - - Healthcare safety and workflow economics
    - Positive
    - Active now
    - Hospitals remain a large RTLS vertical and can justify spend through safety and quality outcomes
    - Ask which hospital metrics improve first in live deployments
  - - 3GPP Release 18 positioning maturity
    - Positive
    - 2024–2026 onward
    - Improves technical readiness for advanced 5G positioning features and RedCap support
    - Confirm which ZaiNar features rely on standardized versus proprietary layers
  - - No-added-hardware brownfield deployment thesis
    - Positive
    - Near term
    - Can shorten time-to-value if existing networks truly suffice
    - Verify how often new anchors, calibration, or device changes are still required in practice
  - - Privacy and telecom regulation
    - Adverse
    - Active now
    - Operator monetization may face state and sectoral privacy limits even if technology works
    - Ask for legal basis and consent model by deployment type
  - - 'Security threats: spoofing, jamming, unauthorized tracking'
    - Adverse
    - Structural
    - Raises trust and compliance burden for mission-critical deployments
    - Review security architecture and adversarial-testing results
  - - Upfront deployment and calibration cost
    - Adverse
    - Near term
    - Can slow brownfield adoption despite strong ROI narratives
    - Obtain full deployment bill of materials and recalibration requirements
  - - Interoperability and workflow integration
    - Adverse
    - Near term
    - Poor integration can kill expansion from pilot to rollout even when accuracy is good
    - Ask for reference architectures with ERP, MES, digital-twin, and hospital IT systems
  notes: Timing is qualitative. The main question is not whether demand exists, but whether ZaiNar clears privacy, integration, and economic hurdles faster than incumbent RTLS alternatives.
