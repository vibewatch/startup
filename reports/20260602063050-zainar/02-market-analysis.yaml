- id: drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: |-
    Several forces are clearly pushing the category forward. Broad RTLS sources highlight digital twins, industrial automation, warehouse visibility, hospital safety workflows, and autonomous navigation. MarketsandMarkets specifically connects manufacturing demand to AGV, worker, and work-in-progress tracking. Ericsson's Release 18 summary shows that advanced 5G positioning continues to mature at the standards layer, while Wi-Fi Alliance and ZaiNar both reinforce the appeal of using infrastructure that buyers already operate rather than rolling out separate location-only hardware.

    The counterweights are equally important. Mordor explicitly identifies privacy and cyber-security as growth drags, and Nature details the attack surface: spoofing, jamming, malicious interference, and unauthorized tracking. Cambridge adds that indoor environments remain difficult because multipath, obstruction, and environmental change degrade performance and increase the need for hybrid systems. Cost and integration are also real constraints. Mordor says a 100,000-square-foot plant can exceed USD 150,000 in infrastructure spend and that poor calibration can destroy promised accuracy, while Global Growth cites interoperability and hardware-compatibility issues. So the adoption story is not simply large market plus better accuracy. It is buyers wanting better spatial awareness while still needing proof that the economics, privacy posture, integration path, and calibration burden work in their own sites.
