- id: buyer-user-payer
  title: Buyer, User, Payer, and Budget Ownership
  body: |-
    The buyer map is fragmented because ZaiNar's value proposition crosses network infrastructure and operational workflow software. On public networks, the likely economic buyer is a carrier product, RAN, or enterprise-solutions team that wants to monetize installed 5G assets with new location services. ZaiNar's own argument is that Apple and Google gate PRS access, leaving operators unable to monetize handset positioning even after investing billions in 5G; if that argument holds in practice, the budget case resembles a network-software upsell, not a traditional RTLS hardware refresh.

    Inside enterprises, the story changes. Industrial deployments likely sell through plant operations, OT, automation, or supply-chain leaders because ROI is framed around throughput, worker safety, WIP visibility, and digital twins. Healthcare campus deployments likely sit with hospital operations, IT, and biomedical engineering because the public RTLS literature ties spending to device search time, staff safety, infection control, and quality-linked reimbursement. Smart-city and public-sector use cases are the least standardized: they may be paid through innovation, transport, or public-safety budgets, but public evidence does not yet show one repeatable budget owner for ZaiNar-like projects. That fragmentation matters for diligence because it raises sales complexity even while it broadens the surface area of possible demand.
