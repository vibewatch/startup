- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance
  rows:
  - - Broad RTLS
    - Hardware, software, and services for real-time tracking across RFID, Wi-Fi, UWB, BLE, IR, GPS, and related stacks
    - Connectivity spend with no location workflow, consumer maps, and pure GNSS device revenue
    - Enterprise operations, healthcare IT, logistics, manufacturing, security budgets
    - Useful TAM context but too broad for ZaiNar-specific sizing
  - - Indoor positioning / campus visibility
    - Smart-building, hospital, retail, logistics, and campus indoor-location software and analytics
    - Outdoor-only fleet telematics and navigation apps
    - Facility operations, hospital operations, corporate IT
    - Relevant because ZaiNar positions Wi-Fi and private-network upgrades for campuses
  - - Network-side 5G positioning overlays
    - Software and timing layers that turn public or private 5G into a location service
    - Generic RAN capex and connectivity-only subscriptions
    - Carrier product or enterprise private-network owner
    - Closest conceptual fit to ZaiNar, but no public standalone market size
  - - Brownfield Wi-Fi positioning upgrades
    - Software-led upgrades to installed Wi-Fi for location, geofencing, and asset visibility
    - New dedicated tag-and-anchor networks where Wi-Fi is not reused
    - Enterprise IT, operations, hospital campuses
    - Relevant for Zero and lower-friction deployment economics
  - - Status-quo substitutes
    - GPS, cameras, LiDAR, SLAM, UWB, RFID, BLE, hybrid RTLS
    - None — these are alternatives rather than in-scope ZaiNar revenue
    - Varies by site and workflow
    - Critical to boundary logic because ZaiNar must displace an existing workflow or infrastructure choice
  notes: The boundary moves from broad RTLS to the narrower network-side positioning wedge. ZaiNar-specific sizing should exclude generic connectivity revenue and most consumer location spend even though analysts often bundle adjacent technologies together.
