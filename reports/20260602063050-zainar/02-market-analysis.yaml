callouts:
- calloutType: risk
  title: Broad RTLS TAM Can Easily Overstate ZaiNar's Real Capture Window
  body: The most accessible public market figures bundle together hardware-heavy RTLS, indoor-positioning, and multiple wireless technologies. ZaiNar may benefit from that category growth, but no public source isolates the specific network-side wedge it is actually trying to monetize. Investors should therefore treat broad TAM as context rather than near-term revenue denominator.
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM037
  - CM038
  - CM039
- calloutType: insight
  title: The Strongest Buyer Thesis Is Brownfield Monetization of Existing Networks
  body: ZaiNar's most differentiated claim is not simply higher precision. It is that existing 5G and Wi-Fi footprints can become location infrastructure without a separate tag-and-anchor rebuild. If that holds in live production, the company can sell into budgets that are already trying to extract more value from sunk network capex.
  claimRefs:
  - CM020
  - CM023
  - CM024
  - CM028
  - CM036
