- id: diligence-gaps
  title: Diligence Gaps and Contradictory Estimates
  body: |-
    The biggest analytical trap is to confuse adjacent-market TAM with ZaiNar-specific demand. The public numbers clearly establish that RTLS and indoor positioning are significant markets, but they do not isolate the slice that would buy network-side 5G and Wi-Fi positioning from a startup. Even bullish third-party coverage largely repeats ZaiNar's Physical AI framing without independently quantifying a capture-ready market. That makes broad RTLS numbers useful as context, not as a direct valuation denominator.

    Three diligence gaps remain material. First, public sources do not reveal pricing, so SOM cannot be modeled from real average deal size. Second, the company has still not publicly named the carrier and enterprise partners it says are in motion, so pipeline quality is only partially verified. Third, buyer ownership is segment-specific rather than universal, which raises go-to-market complexity and makes the sales cycle harder to generalize. The prudent read is that ZaiNar addresses a real and growing need, but public evidence supports only constrained market sizing and should not be used to overstate near-term revenue capture.
