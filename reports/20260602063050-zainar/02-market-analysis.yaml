  evidenceGaps:
  - type: missing-source
    severity: material
    topic: network-side-market-size
    missingEvidence: A public analyst dataset that isolates standalone network-side 5G or Wi-Fi positioning software and services.
    whyItMatters: Without a category-specific denominator, TAM and SAM remain proxy ranges built from adjacent RTLS and indoor-positioning markets.
    diligencePath: Request analyst decks or customer pipeline analysis from management that split network-side positioning from broader RTLS categories.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: som-quantification
    missingEvidence: Named customers, contract values, pricing model, and deployment counts needed to derive a realistic SOM.
    whyItMatters: SOM determines near-term revenue potential and prevents investors from mistaking broad RTLS TAM for capture-ready ZaiNar revenue.
    diligencePath: Ask for customer cohort data, signed commercial contracts, average deal size, and current deployed-site count by vertical.
    relatedQuestionRefs:
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-estimate-divergence
    missingEvidence: Comparable analyst methodologies that normalize category boundary, forecast horizon, and included technologies.
    whyItMatters: The currently available public estimates vary by more than 2x in 2025 and by even more in forward years, which can distort valuation narratives.
    diligencePath: Normalize each provider to a common year and category definition or obtain the underlying methodologies directly.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: partner-disclosure
    missingEvidence: Named carrier and enterprise design partners with deployment scope, geography, and use case.
    whyItMatters: Unnamed partners make it impossible to test whether the buyer map is real or merely indicative pipeline marketing.
    diligencePath: Request customer references, pilot scope documents, and reference calls for at least one telco and one enterprise account.
    relatedQuestionRefs:
    - QM026
  - type: access-blocked
    severity: minor
    topic: analyst-methodology
    missingEvidence: Detailed assumptions behind summary-level market models, especially for segment splits and growth-rate calculations.
    whyItMatters: Public summary pages provide directional market shape but not the bottoms-up assumptions needed for investment-grade sizing.
    diligencePath: Obtain the paid analyst reports or request management's purchased copies and underlying model assumptions.
    relatedQuestionRefs:
    - QM007
    - QM008
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
