  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: booking-quality
    missingEvidence: Executed contract schedule that separates binding contracts, pilots, and nonbinding MOUs by counterparty, amount, term, and conversion timing.
    whyItMatters: The headline $450 million figure is the single largest commercial proof point, but it is not yet underwritable backlog.
    diligencePath: Request the signed pipeline ledger, top ten counterparties, and monthly conversion bridge from announced backlog to billed revenue.
    relatedQuestionRefs:
    - QR020
    - QR023
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: carrier-partners
    missingEvidence: Named carrier and enterprise partner references with scope, geography, and production-vs-pilot status.
    whyItMatters: Carrier dependence is central to the bull case, yet the channel proof is still largely unnamed.
    diligencePath: Ask management for the first named carrier launch, supporting contract summary, and a partner reference call.
    relatedQuestionRefs:
    - QR003
    - QR016
    - QR023
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: deployment-reliability
    missingEvidence: Site-level reliability metrics, false-positive and false-negative rates, uptime, calibration burden, and any safety incident log for live deployments.
    whyItMatters: Technical verification and safety risk cannot be cleared from public marketing claims alone.
    diligencePath: Review pilot scorecards, SLA reports, red-team results, and customer deployment postmortems.
    relatedQuestionRefs:
    - QR012
    - QR014
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: undisclosed-economics
    missingEvidence: Current price sheet, ACV distribution, gross margin by deployment type, burn, cash, and backlog-to-revenue conversion data.
    whyItMatters: Valuation support and financing risk cannot be judged without unit economics and runway.
    diligencePath: Request board reporting pack, cohort billings, implementation cost detail, and 12-month cash forecast.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR032
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: organizational-depth
    missingEvidence: Current organizational chart, hiring plan, quota-carrying sales leadership, safety/compliance ownership, and customer-success staffing.
    whyItMatters: Execution risk is amplified if a lean public team is supporting regulated carrier and enterprise deployments.
    diligencePath: Request org chart, open req list, and leadership interviews across engineering, sales, delivery, and compliance.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR026
    relatedTableRefs:
    - TR004
