- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Booking-quality ambiguity
    - Binding backlog disclosure
    - Management cannot split the $450M headline into signed contracts, pilots, and MOUs before the next financing discussion.
    - Mark the commercial proof point as non-underwritable and haircut valuation support materially.
  - - Carrier dependency
    - Named partner conversion
    - No named carrier or enterprise lighthouse account with scope and production status is disclosed within the next proof cycle.
    - Downgrade the channel thesis and assume slower direct-sales motion.
  - - Privacy / regulatory scrutiny
    - Data-rights clearance
    - A major pilot depends on location resale, sensitive targeting, or unclear consent flows.
    - Pause commercialization until legal basis, retention limits, and audit controls are documented.
  - - Technical verification gap
    - Field reliability evidence
    - Management cannot provide uptime, calibration burden, and error-rate data from live sites.
    - Treat accuracy claims as aspirational marketing rather than referenceable proof.
  - - RF integrity risk
    - Security hardening evidence
    - No test results exist for jamming, interference, rogue-network, or fail-safe behavior in target environments.
    - Assume safety-sensitive and carrier-grade use cases remain pre-underwriting.
  - - Competitive bundling
    - Win-rate or displacement proof
    - Pipeline loses repeatedly to Cisco, Nokia, HPE, or similar bundles on procurement-risk grounds.
    - Reframe moat as niche or feature-led rather than category-defining.
  - - Undisclosed economics
    - Unit-economics disclosure
    - No ACV, gross-margin, burn, or backlog-conversion data is shared under NDA.
    - Do not underwrite a software-platform margin profile at current valuation.
  - - Key-person / org depth
    - Leadership and staffing depth
    - No CFO / VP Sales / compliance owner is installed despite expanding deployments.
    - Escalate execution-risk discount and ask for board-backed hiring milestones.
  notes: Triggers are intentionally monitorable so the chapter can be used as a diligence checklist rather than a descriptive risk memo only.
