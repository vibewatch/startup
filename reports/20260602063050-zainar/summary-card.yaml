  topStrengths:
    - >-
      Patent-backed network-side positioning architecture that claims sub-meter 3D localization from existing 5G and
      Wi-Fi without new hardware, a potentially meaningful deployment and TCO advantage if it holds in production.
    - >-
      More than 100 filed patents with 90 issued and zero rejections provide unusually concrete IP depth for a private
      spatial-intelligence startup.
    - >-
      Public demand signals are non-trivial: ZaiNar disclosed more than $100M raised, a $1B-plus valuation headline, and
      more than $450M in contracts plus MOUs spanning multiple verticals and geographies.
  topRisks:
    - >-
      The $450M headline mixes contracts and MOUs without counterparty, enforceability, or conversion detail, so backlog
      quality and revenue quality remain ununderwritable.
    - >-
      No named carrier partner or named enterprise customer beyond Tokyo program proof is public by the run date,
      weakening referenceability and channel validation.
    - >-
      Privacy, security, and field-reliability risks remain material because network-derived location data is sensitive
      and independent evidence does not yet prove ZaiNar's anti-spoofing and operational claims at deployment grade.
    - >-
      Revenue, gross margin, burn, cash, retention, concentration, and cap-table terms remain undisclosed, creating
      financing and dilution risk if proof conversion slips.
  unresolvedGaps:
    - >-
      Split the $450M headline into binding contracts versus non-binding MOUs, with counterparties, termination rights,
      timing, and expected billings conversion.
    - >-
      Provide named carrier and enterprise references, or at minimum anonymized production cohorts with deployment
      scale, uptime, and renewal evidence.
    - >-
      Show software versus services versus any partner-hardware gross-margin mix, plus current burn, cash runway, and
      pricing / ACV by channel.
    - >-
      Clarify top-account concentration, partner mix, and whether system integrators or carriers control most commercial
      distribution.
