callouts:
  - calloutType: "risk"
    title: "Severe Customer Concentration and Counterparty Circularity"
    body: "Etched's commercial credibility rests heavily on a single named customer deployment: Jane Street. Because Jane Street is also a major early investor and the lead sponsor of Etched's $700M Series D round at a $21B valuation, its endorsement does not represent an independent, arms-length market signal. Prospective investors must treat customer concentration as a critical diligence blocker until multiple unaffiliated enterprise buyers validate the hardware."
    claimRefs:
      - "CU006"
      - "CU012"
      - "CU013"
  - calloutType: "insight"
    title: "Contract Backlog Execution vs Revenue Recognition"
    body: "Etched's reported $1B+ in signed customer contracts cannot be equated with recognized revenue or software ARR. Hardware infrastructure procurement carries significant execution risks, including TSMC wafer yields, HBM3E memory packaging bottlenecks, and customer acceptance testing. Without transparent milestone schedules, these contracts remain vulnerable to delivery delays or cancellation."
    claimRefs:
      - "CU007"
      - "CU010"
      - "CU014"

