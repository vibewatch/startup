  title: "Customers"
  summary: "Etched's customer footprint has transitioned from speculative design partnerships to a single confirmed live production deployment at quantitative trading firm Jane Street, alongside a company-reported pipeline of over $1B in signed commercial contracts across AI labs and cloud providers. However, broad commercial adoption remains highly concentrated and unproven at scale, with zero independent customer benchmarks published and key production metrics undisclosed."
sections:
  - id: "customer-segmentation-and-target-profiles"
    title: "Customer Base Segmentation and Target Demand Profiles"
    body: "Etched segments its commercial customer opportunity across three distinct high-volume inference tiers: latency-critical financial institutions, frontier foundational AI model developers, and scale-out cloud service providers. In financial services, quantitative trading firms and market makers require deterministic, microsecond-scale execution where lower inference latency translates directly into monetary trading edge and risk management advantage. Foundational AI labs represent the highest token volume tier, operating sustained autoregressive decoding workloads across mixture-of-experts architectures such as DeepSeek, Qwen, and Llama, where per-token electricity costs and memory-bandwidth bottlenecks dominate operating expenses. Cloud infrastructure providers and specialized AI hosters form the third key segment, seeking hardware alternatives to Nvidia's merchant GPU monopoly to expand data-center capacity within fixed power and thermal envelopes. While Etched originally marketed its Sohu chip as a specialized accelerator dedicated exclusively to transformer models, the company has expanded its target architecture messaging to accommodate broader frontier models, non-transformer sequence designs, and multi-trillion parameter sparse MoE workloads. The strategic value across all three buyer segments centers on reducing the total cost of ownership per million tokens generated, yet commercial procurement cycles remain gated by whether Etched's proprietary software and compilation stack can seamlessly integrate into production serving infrastructure without requiring extensive custom kernel development."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory, Hardware Bring-Up, and Named Production Proof"
    body: "Etched's customer adoption trajectory achieved a critical engineering and operational milestone following its emergence from stealth on June 30, 2026, when it announced working first-pass A0 silicon fabricated on TSMC's 4nm (N4P) node alongside more than $1B in signed customer contracts. In July 2026, Etched executed its first physical hardware delivery by shipping an operational rack-scale inference system to quantitative trading firm Jane Street, which validated the system within its proprietary data-center environment and reported running real production workloads. According to technical documentation and industry reports, Etched demonstrated a 44-day bring-up window from receiving initial test silicon to running active inference workloads, and validated a claimed 700-nanosecond inter-chip communication latency via its proprietary interconnect—substantially faster than conventional GPU interconnect hops. However, public verification of commercial adoption beyond this initial strategic installation remains virtually non-existent. Although the company reports over $1B in signed customer commitments, no customer names outside of Jane Street have been publicly identified, nor have binding delivery schedules, advance cash deposits, or cancellation provisions been disclosed. Industry analysts caution that these contract figures represent conditional procurement agreements contingent upon successful volume manufacturing, thermal reliability, and customer workload acceptance rather than recognized GAAP revenue."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"

  - id: "concentration-risks-and-commercial-durability"
    title: "Counterparty Concentration, Channel Friction, and Commercial Durability"
    body: "The primary commercial risk facing Etched's go-to-market durability is extreme customer and stakeholder concentration, exacerbated by counterparty circularity between capital providers and customer references. Jane Street serves simultaneously as an early shareholder, a lead investor anchoring the August 2026 $700M funding round at a $21B valuation, and the sole confirmed enterprise customer operating a live rack in production. While Jane Street's technical evaluation confirms that Etched's silicon functions in a demanding trading environment, its dual status as lead financier and reference customer introduces material underwriting bias, as its commercial endorsement cannot be evaluated as an arms-length third-party procurement decision. Furthermore, Etched's business model centers on direct capital equipment sales of full server racks rather than sticky multi-year cloud SaaS contracts, exposing the company to lumpy purchase cycles and intense procurement friction. Enterprise and cloud buyers evaluating Etched must navigate the risk of architectural lock-in, unproven long-term field reliability, and the software switching costs associated with migrating away from Nvidia's deeply entrenched CUDA ecosystem. Independent commentators and hardware analysts note that while Etched claims its 8-chip server can match the throughput of 160 Nvidia H100 GPUs on specific benchmarks, the lack of audited MLPerf benchmark submissions or multi-tenant cloud deployments leaves real-world customer durability, retention, and gross margins unverified."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"

