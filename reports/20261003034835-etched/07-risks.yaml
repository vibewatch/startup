chapter:
  number: 7
  title: Risks
  summary: 'Etched faces existential technology and execution risks centered on its single-architecture bet: hardwiring transformer attention into 4nm ASICs leaves zero architectural flexibility if models shift toward state-space or hybrid architectures, while pre-volume commercialization depends on unverified performance claims and tight allocations of TSMC foundry capacity and scarce HBM3E memory.'
sections:
- id: architectural-lockin-and-technology-obsolescence
  title: Architectural Lock-In and Technology Obsolescence
  body: 'Etched''s commercial proposition hinges on an architectural all-or-nothing bet: by hardwiring transformer attention and matrix multiplication directly into fixed-function ASIC silicon, the Sohu processor sacrifices general-purpose flexibility to maximize throughput and power efficiency. While this design reportedly delivers substantial speedups over general-purpose GPUs on standard transformer models like Llama-70B, it renders the hardware structurally incapable of running alternative architectures without fabricating a replacement chip from scratch. As research labs actively develop sub-quadratic models, state-space architectures such as Mamba, and hybrid SSM-transformer variants to circumvent transformer quadratic scaling costs, any paradigm shift toward non-transformer models represents an existential threat to Etched''s product line. Furthermore, specialized ASICs require custom compilation layers and bespoke software tooling, creating significant developer adoption friction
    compared to the entrenched, mature NVIDIA CUDA and open-source vLLM software ecosystem. Hardware teardowns indicate that Sohu''s projected 500,000 token-per-second throughput is physically bounded to short-context evaluation windows with aggressive batch sizes, leaving long-context performance and KV-cache scaling vulnerable to memory bandwidth bottlenecks.'
  claimRefs:
  - CR003
  - CR004
  - CR010
  - CR014
  figureRefs:
  - FR001
- id: silicon-bringup-manufacturing-and-hbm-supply-chain
  title: Silicon Bring-Up, Manufacturing, and Supply Chain Concentration
  body: Although Etched announced first-pass A0 silicon on TSMC's 4nm N4P node in mid-2026, the company has not yet demonstrated commercial hardware delivery at volume scale. Independent semiconductor analyses emphasize that all published performance benchmarks originate entirely from company-modeled simulations and lab measurements, with Sohu conspicuously absent from standardized MLPerf inference benchmark evaluations. Moving from single-chip lab bring-up to high-density, multi-chip rack deployments exposes the company to severe operational failure modes, including complex thermal dissipation requirements, power delivery tolerances, and high-speed board interconnect integrity. Crucially, each Sohu chip requires 144 GB of high-bandwidth memory (HBM3E), entering a severely constrained global packaging and memory market where memory producers allocate approximately 90% of dedicated HBM output to NVIDIA. While TSMC-linked VentureTech Alliance's strategic equity investment provides essential
    foundry alignment for 4nm wafer access and advanced CoWoS packaging capacity, Etched remains acutely exposed to industry-wide HBM supply squeezes and packaging yield volatility.
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR002
  - TR003
- id: regulatory-legal-and-capital-structure-exposure
  title: Regulatory, Legal, and Capital Structure Exposure
  body: From a regulatory and legal perspective, Etched operates in an increasingly scrutinized cross-border semiconductor landscape. Advanced AI accelerators face stringent United States Bureau of Industry and Security (BIS) export administration regulations and potential compute-threshold restrictions that limit deployment in non-aligned international markets, restricting Etched's addressable cloud customer base. Additionally, competing against well-funded incumbents with extensive patent portfolios creates ongoing exposure to microarchitecture patent assertion and trade secret claims, requiring rigorous freedom-to-operate validation for Etched's proprietary attention circuitry. On the balance sheet and governance side, Etched raised approximately $500 million in late 2025 at a $5 billion valuation, subsequently engaging in dual-tranche funding discussions at $10 billion and $20 billion marks prior to commercial shipping. Its capital structure incorporates Series B and Series C preferred
    share classes with 1.0x non-participating liquidation preferences and a 6.0% cumulative dividend rate. At speculative private market valuations exceeding $5 billion, this preferred capital structure creates significant downside overhang for common shareholders and employees if production delays force down-round financings or compressed exit valuations.
  claimRefs:
  - CR001
  - CR002
  - CR009
  tableRefs:
  - TR001
- id: commercialization-timeline-and-kill-criteria
  title: Commercialization Timeline, Contract Concentration, and Diligence Path
  body: 'Etched''s forward milestones center on converting pre-order commitments into verified, revenue-generating production shipments. While the company claims over $1 billion in signed customer contracts, these commitments predominantly represent conditional pre-orders from cloud and AI platform providers rather than non-cancellable recognized revenue. To service this pipeline, Etched expanded its headcount to more than 400 personnel across San Jose and Taiwan, heavily scaling its hardware engineering, design verification, and systems integration teams. The primary kill criteria for Etched''s investment thesis include: failure to ship initial customer-validated racks by late 2026, measurable performance degradation or unresolvable silicon errata under long-context frontier workloads, rapid commercial adoption of non-transformer architectures by leading foundation model labs, or customer pre-order cancellations following delivery timeline slippage. Diligence must focus on auditing master
    service agreements for pre-order cancellation provisions, verifying third-party audited MLPerf benchmarks on physical production silicon, and confirming guaranteed HBM3E supply allocations from memory fabrication partners.'
  claimRefs:
  - CR011
  - CR012
  - CR013
