chapter:
  number: 5
  title: "Product & Technology"
  summary: "Etched has advanced Sohu from a transformer-only ASIC concept to company-reported first-pass N4P silicon and customer validation of a rack-scale inference system. The technical thesis is specific and potentially valuable, but benchmark comparability, volume-production readiness, software accessibility, and trust controls remain insufficiently evidenced in public."
sections:
  - id: "product-scope-and-maturity"
    title: "Product scope and maturity"
    body: |
      Sohu is an inference ASIC rather than a general-purpose training accelerator: independent coverage describes a design that hardwires recurring transformer operations and trades workload flexibility for higher utilization. The public product surface has moved beyond the 2024 concept-stage description. In June 2026, Etched said it had achieved first-pass A0 silicon on TSMC N4P, was validating a rack-scale product with customers, and was ramping production. That is meaningful maturity progress, but it is still issuer-reported. A July 2026 independent account said the chip had not yet been commercially validated at scale or independently benchmarked. Product underwriting should therefore distinguish working silicon and customer validation from qualified volume shipments, sustained availability, or independently proven production performance.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE009"
      - "CE015"
    tableRefs:
      - "TE001"
  - id: "workflow-and-architecture"
    title: "Inference workflow and architecture"
    body: |
      The product is designed around the two main serving phases, prompt prefill and autoregressive decode, at rack scale. TechCrunch reported that Etched removes hardware and software paths unnecessary to transformer inference. A separate technical analysis of Etched patent applications interprets the design as pairing a systolic array for regular matrix operations with a distinct attention circuit and dedicated memory paths for model weights and the KV cache. That is a plausible mechanism for improving utilization, but it is an analyst interpretation rather than a published production schematic. The latest company release also says deployed systems run DeepSeek, Qwen, Mamba, and Llama. Support for that broader model set may indicate more adaptability than the original transformer-only positioning, but compatibility breadth, compiler constraints, and operator-level coverage are not publicly demonstrated here.
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "performance-and-differentiation"
    title: "Performance thesis and differentiation"
    body: |
      Etched's differentiation is workload specialization, not a generally comparable compute platform. One current profile repeats a headline result of more than 500,000 tokens per second on Llama-70B for an eight-chip Sohu server versus 23,000 tokens per second for eight H100s, but it does not provide an independent test protocol. An independent technical review finds a 10x to 20x advantage physically plausible at high batch sizes and short contexts, while arguing that the advantage should narrow at low batch sizes or long contexts because weight movement and KV-cache capacity become binding. RCR likewise reports that independent benchmarks remain absent. The defensible conclusion is that Sohu may be a high-throughput serving engine under selected workload conditions; latency, long-context behavior, model quality parity, power, and total-cost superiority are still open validation items.
    claimRefs:
      - "CE001"
      - "CE008"
      - "CE009"
      - "CE013"
  - id: "deployment-dependencies-and-controls"
    title: "Deployment dependencies and controls"
    body: |
      Etched follows a fabless model and relies on TSMC for advanced-node production, while the company says it has added a Taiwan factory plus in-house data-center, test-house, and NPI prototyping capabilities. A developer-hosted supply analysis argues that HBM availability can make speed-to-volume materially slower than speed-to-silicon; that estimate is not supplier-confirmed, but it identifies the correct diligence surface: binding wafer, packaging, and memory allocations rather than financing alone. An archived hardware-practitioner discussion also shows unresolved concern about architecture obsolescence and the gap between prototype evidence and a durable ASIC platform. No reviewed public evidence establishes security certifications, reliability SLOs, incident history, privacy controls, quality-system certifications, yield, or field-failure performance. Their absence from public evidence is a diligence gap, not proof that the controls do not exist.
    claimRefs:
      - "CE002"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
