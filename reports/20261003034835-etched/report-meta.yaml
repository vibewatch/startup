summary:
  headline: >-
    Etched now has working silicon, a first named customer, and a reported $21B private-market valuation, but the thesis
    still rests on unverified benchmarks, undisclosed revenue, and a brittle transformer-only architecture.
  overallScore: 5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: expensive
  keyMetrics:
