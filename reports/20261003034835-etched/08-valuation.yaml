        - id: decision
          label: Research more
          detail: Verify commercial conversion and terms before underwriting the reported valuation.
          tone: neutral
    approximationNotes: >-
      Ordered decision sequence only; it does not imply conversion rates,
      probabilities, or a quantitative valuation.
    claimRefs: [CV009, CV010, CV011, CV007, CV008, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      The company may be stronger than its earlier public profile, but the
      reported $21 billion price cannot be supported from public operating data.
      Continue diligence; do not substitute funding momentum for valuation proof.
    claimRefs: [CV001, CV008, CV011, CV016]
  - calloutType: risk
    title: Thesis-break test
    body: >-
      Stop underwriting if the first rack does not lead to repeat volume
      deliveries, signed contracts fail to convert into recognized revenue, or
      architecture changes force a major redesign before scale.
    claimRefs: [CV010, CV011, CV012, CV014]
