  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing-terms
      missingEvidence: >-
        Fully diluted capitalization, option-pool treatment, round-by-round
        ownership, liquidation preferences, participation rights, debt, and
        current secondary pricing.
      whyItMatters: >-
        Headline post-money valuation does not determine an investor's entry
        economics, dilution, downside protection, or achievable return.
      diligencePath: >-
        Obtain the current cap table, charter, financing documents, side letters,
        debt schedule, option plan, and recent secondary transaction records;
        reconcile them to every financing cash flow.
      relatedQuestionRefs: [QV009]
    - type: private-evidence-only
      severity: blocking
      topic: operating-economics
      missingEvidence: >-
        Recognized revenue, backlog conversion, gross margin, cash burn, working
        capital, production yield, customer concentration, and contract
        cancellation terms.
      whyItMatters: >-
        These inputs are required to distinguish signed demand from economic
        revenue and to model valuation, capital needs, and downside.
      diligencePath: >-
        Review audited or management financials, customer contracts, shipment
        and acceptance records, manufacturing invoices, yield reports, cash
        statements, and a board-approved operating plan.
      relatedQuestionRefs: [QV003, QV004, QV006, QV008]
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: >-
        Independent rack-level benchmarks, reliability results, repeat-customer
        deployments, and price-per-token evidence across representative
        workloads.
      whyItMatters: >-
        Working silicon and one reported delivery do not establish repeatable
        performance, customer value, or exit readiness.
      diligencePath: >-
        Commission third-party benchmark and reliability testing, interview
        authorized customers, and compare acceptance results with contract
        specifications and competitive systems.
      relatedQuestionRefs: [QV006, QV007, QV008, QV010]
