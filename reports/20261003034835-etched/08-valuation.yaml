schemaVersion: "report-v2"
artifact: valuation
slug: etched
runDate: 2026-10-03
company:
  name: Etched
chapter:
  number: 8
  title: Valuation
  summary: >-
    Etched's reported financing mark reached $21 billion after a $700 million
    Series D, but public evidence does not disclose revenue, margins, unit
    economics, preference terms, or fully diluted ownership. The appropriate
    stance is research-more: the working-silicon and first-customer signals are
    meaningful, while price support still depends on private diligence.
sections:
  - id: recommendation
    title: Recommendation and investment posture
    body: >-
      The recommendation is research-more, with high underwriting risk and an
      expensive-to-unsupported public valuation stance. WOWTALE reported a $700
      million Series D at a $21 billion valuation in August 2026, more than
      double the reported $10.3 billion Series C mark one month earlier. That
      price acceleration coincided with better operating proof: Etched says it
      has working A0 silicon, more than $1 billion in signed contracts, and a
      rack in customer hands. Yet the assigned public evidence provides no
      revenue, profitability, unit-economics, or recognized-revenue denominator.
      A new investment therefore cannot be underwritten to a target return or
      defensible multiple without primary diligence on commercial conversion,
      economics, and terms. The evidence supports continued diligence, not a
      price-insensitive endorsement.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV001]
  - id: financing-and-price
    title: Financing context and entry discipline
    body: >-
      The financing record shows both momentum and a material comparability
      problem. Etched stated on June 30 that it had raised $800 million; a later
      directory reported $925 million after the July Series C, while post-Series
      D sources report roughly $1.7 billion. These figures have different
      cut-off dates and round definitions and should not be treated as a single
      stable total. More importantly, funding raised is not cash available and
      signed contracts are not recognized revenue. The cap table, liquidation
      preferences, option-pool treatment, investor ownership, and secondary
      pricing are absent from the assigned evidence. Entry discipline should
      therefore be milestone- and terms-based: require reconciliation of every
      round, a fully diluted capitalization table, contract quality, and audited
      operating metrics before translating the $21 billion headline into an
      investable price.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV016]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear cases
    body: >-
      The scenario spread is driven by proof, not by an invented revenue
      forecast. The bull case requires the reported first customer delivery to
      become repeatable volume shipments, the contract book to convert into
      recognized revenue, and independently supported cost and performance
      economics. The base case assumes working silicon and customer interest
      are real but that ramp timing, margins, and revenue conversion remain
      uncertain; this supports observation rather than underwriting the latest
      mark. The bear case combines production or validation slippage,
      non-conversion of signed demand, architecture obsolescence, and a valuation
      reset. No numerical probability or fair-value range is supportable from
      the assigned public evidence because the core revenue, margin, dilution,
      and preference inputs are missing.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: comparables-and-exit
    title: Comparables, exit readiness, and final diligence
    body: >-
      The available comparable set is directional rather than valuation-grade.
      One market-data directory lists Arm, Astera Labs, and Ambarella IPO
      price-to-sales ratios near 26x, 25x, and 6x, respectively, but it also
      states that Etched has no disclosed revenue denominator. Those public
      companies differ in scale, product breadth, liquidity, and operating
      history, so their IPO multiples cannot produce an Etched fair value.
      Exit readiness likewise depends on demonstrated volume shipment,
      recognized revenue, repeat customers, independently measured performance,
      and a finance function able to disclose margins and cash needs. The
      reported first Jane Street rack is progress, not proof of a repeatable
      commercial system. Thesis-break triggers are failed customer acceptance,
      prolonged production slippage, weak contract conversion, or an
      architecture shift that forces a costly redesign.
    claimRefs: [CV007, CV011, CV012, CV014, CV015]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Decision implication]
    rows:
      - [Recommendation, Research more, "Do not underwrite a new entry until operating metrics and financing terms are verified."]
      - [Confidence, Medium on direction; low on price support, "Evidence supports caution but not a precise fair value."]
      - [Risk rating, High, "Commercial ramp, architecture, manufacturing, and financing terms can each impair returns."]
      - [Valuation stance, Expensive / unsupported by public operating data, "The reported $21B mark lacks a public revenue or margin denominator."]
      - [Target return and hold period, Not supportable from public evidence, "Model only after entry price, preferences, dilution, revenue, margins, and exit assumptions are supplied."]
    notes: >-
      Assessments use reported financing marks and public operating disclosures;
      missing private terms and financial metrics are shown as diligence gaps,
      not estimated.
    claimRefs: [CV001, CV007, CV008, CV011, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence signal, What would change the view]
    rows:
      - [Thesis, Working-silicon execution, "A0 silicon returned from TSMC N4P and entered customer validation.", "Independent rack-level performance, reliability, and yield data would strengthen the case."]
      - [Thesis, Commercial pull, "The company reports more than $1B in signed contracts and a first Jane Street rack.", "Repeat deliveries, recognized revenue, and customer references would convert demand into proof."]
      - [Anti-thesis, Price outran disclosure, "The mark reportedly rose from $10.3B to $21B in about one month without public revenue or margins.", "Audited revenue, gross margin, backlog conversion, and cash-use data could support the price."]
      - [Anti-thesis, Architecture and ramp concentration, "Independent reviews flag absent benchmarks, limited volume proof, and redesign risk if model architectures shift.", "Broad workload support, independent benchmarks, and sustained volume shipments would reduce the risk."]
    notes: >-
      Company-issued demand and validation statements are distinguished from
      independent reporting; signed contracts are not treated as revenue.
    claimRefs: [CV002, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Volume shipments follow the first rack; contracts convert to revenue; independent economics validate the product.", "A premium could be supportable only after revenue growth, margins, dilution, and exit multiples are evidenced; no public range is supportable today.", "Repeat customers, recognized revenue, stable yields, and third-party benchmarks.", "Customer acceptance or production ramp fails."]
      - [Base, "Working silicon and customer interest persist, but revenue conversion, margins, and ramp timing remain undisclosed.", "The latest private mark is not independently underwritable; wait for primary metrics or materially better terms.", "Additional deliveries occur, but financial disclosure remains incomplete.", "Valuation stays high while commercial evidence advances slowly."]
      - [Bear, "Contracts do not convert, production slips, performance claims disappoint, or architecture shifts require redesign.", "A sharp reset is plausible because the reported mark embeds success before public operating proof; no precise floor is defensible.", "No repeat delivery, no independent benchmark, or renewed financing at weaker terms.", "Missed acceptance milestones, cash-intensive ramp, or forced chip redesign."]
    notes: >-
      Scenario labels are qualitative. Numerical probabilities, valuation ranges,
      and target returns are intentionally withheld because public revenue,
      margins, cash needs, preferences, and fully diluted ownership are missing.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV016]
