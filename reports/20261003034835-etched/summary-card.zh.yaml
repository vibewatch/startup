  topStrengths:
    - 基于 TSMC N4P 工艺的可运行 A0 芯片成型，加上首个实名客户落地，表明 Etched 已经跨过最艰难的概念验证门槛，至少已部分进入硬件验证阶段。
    - 融资渠道依然极强，据报道金额达 $700M 的 Series D 轮融资与 $21B 估值，显示出投资人对 transformer 专用 ASIC 这一投资逻辑的强烈追捧。
    - 公司仍具备清晰的产品切入点：只要工作负载假设成立，把 transformer 推理直接硬连线固化到芯片中，就能建立起实在的时延与吞吐量优势。
  topRisks:
    - 架构锁定的风险关乎生死：一旦前沿工作负载转向状态空间或混合模型，Etched 可能需要从头重做一款新芯片。
    - 公开证据仍缺乏独立验证的基准测试、披露的收入数据，以及据报道客户合同的验收情况。
    - $21B 估值留下的容错空间极小，一旦交付节奏拖延，几乎无法承受执行偏差、股权结构稀释或下调估值融资（down-round）。
    - 制造环节、HBM 供应与晶圆代工产能高度集中，且难以通过公开证据予以验证。
  unresolvedGaps:
    - 关于量产芯片的独立基准测试、可靠性结果与可复现工作负载数据，目前均未公开披露。
    - 已确认收入、合同转化率与单客经济模型仍未披露，估值因而无法锚定在公开的经营业绩上。
    - 在据报道的 $21B 估值水平下，完全稀释后的资本结构、清算优先权以及老股交易定价均未公开。
    - TSMC 产能、HBM3E 分配及其它制造承诺尚未披露足够细节，无法精确构建供应风险模型。
    - 若模型架构偏好发生转移，纯 transformer 芯片设计的生命周期韧性究竟如何，目前仍悬而未决。
