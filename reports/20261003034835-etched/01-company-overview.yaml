callouts:
  - calloutType: "insight"
    title: "The Architecture Bet: Hardwired Transformer Silicon vs. Programmable Flexibility"
    body: "Etched has built its corporate identity on an uncompromising technological hypothesis: that transformer attention mechanisms will remain the permanent foundation of generative AI inference. By hardcoding matrix multiplication, softmax, and layer normalization into TSMC 4nm silicon, Etched eliminates GPU instruction decoding overhead. However, this creates an existential vulnerability: if state-space models (SSMs) or novel non-attention architectures eclipse transformers, Sohu cannot be reprogrammed."
    claimRefs:
      - "CO009"
      - "CO011"
      - "CO012"
  - calloutType: "risk"
    title: "Verification Deficit: Claimed Superiority vs. Independent Validation"
    body: "While Etched has raised $800M and reported $1B in customer purchase orders, zero third-party benchmark validations or MLPerf audit submissions exist as of October 2026. Management's claims of 500,000 tokens/sec on Llama 70B rely on narrow high-batch regimes. Until production hardware ships to neutral data centers and undergoes verifiable audit, headline throughput multiples must be treated as company-stated ambitions rather than established engineering facts."
    claimRefs:
      - "CO010"
      - "CO013"
      - "CO014"
