chapter:
  number: 1
  title: "Company Overview"
  summary: "Etched is an AI hardware company developing custom inference systems centered on its homegrown Sohu transformer ASIC manufactured on TSMC's 4nm node. Across 2024–2026, the company scaled from stealth to a reported $10.3B Series C valuation led by Sequoia, reporting $800M in cumulative financing and $1B in customer contracts while racing to validate first-pass silicon against incumbent GPU architectures."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Operating Model"
    body: "Etched was founded in 2022 by Harvard dropouts and Thiel Fellows Gavin Uberti, Chris Zhu, and Robert Wachen, joined by former Cypress Semiconductor CTO Mark Ross. The enterprise is incorporated in Delaware and operates its headquarters, NPI prototyping lab, data center, and test house at 3155 Olsen Drive in San Jose, California, supplemented by a manufacturing facility in Taiwan and an additional 10MW facility in Milpitas. Etched has scaled its engineering organization from approximately 35 personnel in mid-2024 to more than 400 engineers recruited from NVIDIA, Google TPUs, Broadcom, SK Hynix, and TSMC. The company's business model centers on commercializing full-stack frontier inference systems—integrating custom ASICs, rack infrastructure, proprietary low-latency interconnects, and specialized software stacks—to fulfill customer contracts rather than retailing standalone merchant accelerator cards."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
      - "TO002"
  - id: "capitalization-and-stakeholder-structure"
    title: "Capitalization Trajectory, Valuation, and Stakeholder Governance"
    body: "Etched's capitalization history illustrates rapid expansion alongside the broader generative AI infrastructure investment cycle. After raising an initial seed financing of approximately $5.4M in 2023 and a $120M Series A in June 2024 co-led by Primary Venture Partners and Positive Sum Ventures, the company secured a $500M financing in December 2025 at a $5.0B post-money valuation led by Stripes. In July 2026, Etched finalized a $300M Series C financing led by Sequoia Capital at a $10.3B valuation, bringing total venture equity capital to approximately $800M. Strategic alignment with major semiconductor and algorithmic stakeholders is cemented by equity participation from VentureTech Alliance (a TSMC-affiliated fund), memory supplier SK Hynix, and quantitative market makers including Jane Street, Hudson River Trading, Jump Trading, and Two Sigma. Later secondary market indicators and uncorroborated September 2026 private reports have cited valuations reaching $21B on $1.7B total claimed capital, though transaction covenants, liquidation preferences, and formal institutional confirmations for amounts exceeding $10.3B remain unverified private estimates."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "hardware-milestones-and-validation-realities"
    title: "Silicon Milestones, Performance Claims, and Verification Gaps"
    body: "Etched achieved first-pass (A0) silicon validation on TSMC's N4P 4nm fabrication process in early 2026 for its Sohu ASIC, which incorporates 144GB of HBM3E memory and a reticle-limit die size. The company asserts that Sohu achieves more than 500,000 tokens per second on Llama 70B within an 8-chip server chassis, claiming a 20x throughput improvement over an 8x NVIDIA H100 system through hardwired transformer operations, Low Voltage Inference (LVI), and Cluster Scale Memory (CSM). While management has announced over $1B in signed customer purchase agreements and initial rack-scale hardware deployments scheduled for customer delivery, independent benchmarking verification remains a critical operational bottleneck. Independent technical audits highlight that Etched has not submitted results to standardized benchmark consortia such as MLPerf Inference v5.1 or v6.0, leaving peak TFLOPS, thermal design power (TDP), sustained long-context throughput, and general pricing unverified outside internal company-reported demonstrations."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
