chapter:
  number: 4
  title: "Financials"
  summary: "Etched has company-reported contracts exceeding $1 billion and one independently reported customer delivery, but neither figure establishes recognized revenue, recurring revenue, or profitable unit economics. The company has raised substantial capital for its production ramp, yet current cash, burn, runway, pricing, gross margin, and manufacturing yields remain private diligence blockers."
sections:
  - id: "revenue-model"
    title: "Revenue Model and Monetization"
    body: "Public evidence supports a hardware-led revenue model rather than a conventional subscription model. Multiples describes Etched as expecting revenue from chips, accelerator cards, racks, and associated computing systems, while the company-issued June update describes a rack-scale system and more than $1 billion in signed customer contracts. No retained source discloses public list prices, realized prices, discount schedules, contract duration, or a recurring software fee. The underwriting implication is therefore narrow: Etched appears positioned to earn primarily product revenue, but the mix among components, full racks, software, and services cannot yet be quantified. Contract value should not be treated as annual recurring revenue or current sales."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "commercial-conversion"
    title: "Commercial Traction and Revenue Conversion"
    body: "The strongest public commercial evidence is a progression from company-reported contracts to a first delivered rack. Etched announced more than $1 billion in signed customer contracts and working silicon in June 2026; later reporting says Jane Street tested the hardware and received the first customer rack. Those milestones reduce technical and delivery uncertainty, but they do not disclose invoicing, acceptance terms, shipment cadence, or recognized revenue. Jane Street also led the latest financing and was an existing investor, so its purchase and investment are correlated signals rather than independent confirmation from separate counterparties. Public evidence does not yet establish repeat orders, a second named deployment, customer concentration, sales-cycle length, CAC, or payback."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI008"
      - "CI012"
  - id: "costs-and-unit-economics"
    title: "Cost Structure and Unit-Economics Gaps"
    body: "Etched sells a system that combines processors, memory, interconnects, cooling, and software, so economic performance depends on the full rack rather than chip performance alone. The company says it has begun production, established a Taiwan factory, and built a data center, test house, and prototyping lab in San Jose. CNBC separately framed the chief executive's plan as investing very heavily in additional capacity over the next year. These disclosures indicate a meaningful production and systems-integration burden, but they do not reveal wafer yield, component allocation, rack failure rates, working-capital requirements, cost per system, gross margin, or warranty exposure. Without those inputs, neither contribution margin nor a credible scale-economics bridge can be underwritten."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy"
    title: "Capital Adequacy and Financial Verdict"
    body: "The financing record demonstrates access to capital, not the amount of cash currently available. Multiples reports $1.6 billion raised across six rounds, while multiple sources report a $700 million financing at a $21 billion valuation in August 2026. That funding can support production and deployment, but public sources do not disclose current cash, monthly burn, capex commitments, debt, project-finance obligations, customer deposits, or the timing of collections. The financial verdict is therefore mixed: commercial commitments and a delivered rack support a credible path to revenue, while revenue quality, margin, and runway remain unverified. Underwriting should remain contingent on audited financials, contract schedules, repeat unaffiliated demand, and a bottom-up manufacturing cost model."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
