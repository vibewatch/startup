      - number: '4.2'
        title: Commercial Traction and Revenue Conversion
        blocks:
          - type: paragraph
            body: >-
              The strongest public commercial evidence is a progression from company-reported contracts to a first
              delivered rack. Etched announced more than $1 billion in signed customer contracts and working silicon in
              June 2026; later reporting says Jane Street tested the hardware and received the first customer rack.
              Those milestones reduce technical and delivery uncertainty, but they do not disclose invoicing, acceptance
              terms, shipment cadence, or recognized revenue. Jane Street also led the latest financing and was an
              existing investor, so its purchase and investment are correlated signals rather than independent
              confirmation from separate counterparties. Public evidence does not yet establish repeat orders, a second
              named deployment, customer concentration, sales-cycle length, CAC, or payback.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
              - CI012
      - number: '4.3'
        title: Cost Structure and Unit-Economics Gaps
        blocks:
          - type: paragraph
            body: >-
              Etched sells a system that combines processors, memory, interconnects, cooling, and software, so economic
              performance depends on the full rack rather than chip performance alone. The company says it has begun
              production, established a Taiwan factory, and built a data center, test house, and prototyping lab in San
              Jose. CNBC separately framed the chief executive's plan as investing very heavily in additional capacity
              over the next year. These disclosures indicate a meaningful production and systems-integration burden, but
              they do not reveal wafer yield, component allocation, rack failure rates, working-capital requirements,
              cost per system, gross margin, or warranty exposure. Without those inputs, neither contribution margin nor
              a credible scale-economics bridge can be underwritten.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
              - CI014
