              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proof has not caught up with product scope
            body: >-
              Working silicon and customer validation are credible milestones, but independent workload benchmarks,
              production reliability, and public trust controls remain the gating evidence for technical underwriting.
            calloutType: risk
            claimRefs:
              - CE004
              - CE009
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Demand Profiles
        blocks:
          - type: paragraph
            body: >-
              Etched segments its commercial customer opportunity across three distinct high-volume inference tiers:
              latency-critical financial institutions, frontier foundational AI model developers, and scale-out cloud
              service providers. In financial services, quantitative trading firms and market makers require
              deterministic, microsecond-scale execution where lower inference latency translates directly into monetary
              trading edge and risk management advantage. Foundational AI labs represent the highest token volume tier,
              operating sustained autoregressive decoding workloads across mixture-of-experts architectures such as
              DeepSeek, Qwen, and Llama, where per-token electricity costs and memory-bandwidth bottlenecks dominate
              operating expenses. Cloud infrastructure providers and specialized AI hosters form the third key segment,
              seeking hardware alternatives to Nvidia's merchant GPU monopoly to expand data-center capacity within
              fixed power and thermal envelopes. While Etched originally marketed its Sohu chip as a specialized
              accelerator dedicated exclusively to transformer models, the company has expanded its target architecture
              messaging to accommodate broader frontier models, non-transformer sequence designs, and multi-trillion
              parameter sparse MoE workloads. The strategic value across all three buyer segments centers on reducing
              the total cost of ownership per million tokens generated, yet commercial procurement cycles remain gated
              by whether Etched's proprietary software and compilation stack can seamlessly integrate into production
              serving infrastructure without requiring extensive custom kernel development.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
