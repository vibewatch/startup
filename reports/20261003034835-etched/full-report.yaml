      - - Lead Customer Deployment & Revenue Realization
        - Unannounced Cloud / Platform Customers
        - Anchor Purchasers
        - High Pre-order Concentration
        - Customer cancels pre-orders if hardware delivery slips or fails SLAs
        - High
        - Over $1B in signed customer contracts across multiple tier-1 AI platforms
        - Contracts are booked reservations contingent upon hardware acceptance
