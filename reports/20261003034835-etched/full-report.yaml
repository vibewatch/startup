      - number: '7.3'
        title: Regulatory, Legal, and Capital Structure Exposure
        blocks:
          - type: paragraph
            body: >-
              From a regulatory and legal perspective, Etched operates in an increasingly scrutinized cross-border
              semiconductor landscape. Advanced AI accelerators face stringent United States Bureau of Industry and
              Security (BIS) export administration regulations and potential compute-threshold restrictions that limit
              deployment in non-aligned international markets, restricting Etched's addressable cloud customer base.
              Additionally, competing against well-funded incumbents with extensive patent portfolios creates ongoing
              exposure to microarchitecture patent assertion and trade secret claims, requiring rigorous
              freedom-to-operate validation for Etched's proprietary attention circuitry. On the balance sheet and
              governance side, Etched raised approximately $500 million in late 2025 at a $5 billion valuation,
              subsequently engaging in dual-tranche funding discussions at $10 billion and $20 billion marks prior to
              commercial shipping. Its capital structure incorporates Series B and Series C preferred share classes with
              1.0x non-participating liquidation preferences and a 6.0% cumulative dividend rate. At speculative private
              market valuations exceeding $5 billion, this preferred capital structure creates significant downside
              overhang for common shareholders and employees if production delays force down-round financings or
              compressed exit valuations.
            claimRefs:
              - CR001
              - CR002
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
      - number: '7.4'
        title: Commercialization Timeline, Contract Concentration, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Etched's forward milestones center on converting pre-order commitments into verified, revenue-generating
              production shipments. While the company claims over $1 billion in signed customer contracts, these
              commitments predominantly represent conditional pre-orders from cloud and AI platform providers rather
              than non-cancellable recognized revenue. To service this pipeline, Etched expanded its headcount to more
              than 400 personnel across San Jose and Taiwan, heavily scaling its hardware engineering, design
              verification, and systems integration teams. The primary kill criteria for Etched's investment thesis
              include: failure to ship initial customer-validated racks by late 2026, measurable performance degradation
              or unresolvable silicon errata under long-context frontier workloads, rapid commercial adoption of
              non-transformer architectures by leading foundation model labs, or customer pre-order cancellations
              following delivery timeline slippage. Diligence must focus on auditing master service agreements for
              pre-order cancellation provisions, verifying third-party audited MLPerf benchmarks on physical production
              silicon, and confirming guaranteed HBM3E supply allocations from memory fabrication partners.
            claimRefs:
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Architecture Lock-In Trap
            body: >-
              Hardwiring transformer attention into fixed-function silicon delivers exceptional specialized throughput
              but creates existential vulnerability: if non-transformer architectures like state-space models capture
              frontier AI workloads, Sohu cannot pivot without an estimated three-year chip respin.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
          - type: callout
            title: Benchmark Verification Precedes Commercial Validation
            body: >-
              Etched's reported $1B+ in customer commitments and $20B valuation negotiations rest entirely on
              self-reported performance claims without independent MLPerf verification. Diligence must confirm summer
              2026 rack deliveries before underwriting production-stage multiples.
            calloutType: insight
            claimRefs:
              - CR006
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment posture
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with high underwriting risk and an expensive-to-unsupported public
              valuation stance. WOWTALE reported a $700 million Series D at a $21 billion valuation in August 2026, more
              than double the reported $10.3 billion Series C mark one month earlier. That price acceleration coincided
              with better operating proof: Etched says it has working A0 silicon, more than $1 billion in signed
              contracts, and a rack in customer hands. Yet the assigned public evidence provides no revenue,
              profitability, unit-economics, or recognized-revenue denominator. A new investment therefore cannot be
              underwritten to a target return or defensible multiple without primary diligence on commercial conversion,
              economics, and terms. The evidence supports continued diligence, not a price-insensitive endorsement.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV011
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record shows both momentum and a material comparability problem. Etched stated on June 30
              that it had raised $800 million; a later directory reported $925 million after the July Series C, while
              post-Series D sources report roughly $1.7 billion. These figures have different cut-off dates and round
              definitions and should not be treated as a single stable total. More importantly, funding raised is not
              cash available and signed contracts are not recognized revenue. The cap table, liquidation preferences,
              option-pool treatment, investor ownership, and secondary pricing are absent from the assigned evidence.
              Entry discipline should therefore be milestone- and terms-based: require reconciliation of every round, a
              fully diluted capitalization table, contract quality, and audited operating metrics before translating the
              $21 billion headline into an investable price.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is driven by proof, not by an invented revenue forecast. The bull case requires the
              reported first customer delivery to become repeatable volume shipments, the contract book to convert into
              recognized revenue, and independently supported cost and performance economics. The base case assumes
              working silicon and customer interest are real but that ramp timing, margins, and revenue conversion
              remain uncertain; this supports observation rather than underwriting the latest mark. The bear case
              combines production or validation slippage, non-conversion of signed demand, architecture obsolescence,
              and a valuation reset. No numerical probability or fair-value range is supportable from the assigned
              public evidence because the core revenue, margin, dilution, and preference inputs are missing.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Comparables, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The available comparable set is directional rather than valuation-grade. One market-data directory lists
              Arm, Astera Labs, and Ambarella IPO price-to-sales ratios near 26x, 25x, and 6x, respectively, but it also
              states that Etched has no disclosed revenue denominator. Those public companies differ in scale, product
              breadth, liquidity, and operating history, so their IPO multiples cannot produce an Etched fair value.
              Exit readiness likewise depends on demonstrated volume shipment, recognized revenue, repeat customers,
              independently measured performance, and a finance function able to disclose margins and cash needs. The
              reported first Jane Street rack is progress, not proof of a repeatable commercial system. Thesis-break
              triggers are failed customer acceptance, prolonged production slippage, weak contract conversion, or an
              architecture shift that forces a costly redesign.
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV007
              - CV008
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              The company may be stronger than its earlier public profile, but the reported $21 billion price cannot be
              supported from public operating data. Continue diligence; do not substitute funding momentum for valuation
              proof.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV016
          - type: callout
            title: Thesis-break test
            body: >-
              Stop underwriting if the first rack does not lead to repeat volume deliveries, signed contracts fail to
              convert into recognized revenue, or architecture changes force a major redesign before scale.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
