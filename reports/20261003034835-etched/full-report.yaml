              - CR014
      - number: '7.2'
        title: Silicon Bring-Up, Manufacturing, and Supply Chain Concentration
        blocks:
          - type: paragraph
            body: >-
              Although Etched announced first-pass A0 silicon on TSMC's 4nm N4P node in mid-2026, the company has not
              yet demonstrated commercial hardware delivery at volume scale. Independent semiconductor analyses
              emphasize that all published performance benchmarks originate entirely from company-modeled simulations
              and lab measurements, with Sohu conspicuously absent from standardized MLPerf inference benchmark
              evaluations. Moving from single-chip lab bring-up to high-density, multi-chip rack deployments exposes the
              company to severe operational failure modes, including complex thermal dissipation requirements, power
              delivery tolerances, and high-speed board interconnect integrity. Crucially, each Sohu chip requires 144
              GB of high-bandwidth memory (HBM3E), entering a severely constrained global packaging and memory market
              where memory producers allocate approximately 90% of dedicated HBM output to NVIDIA. While TSMC-linked
              VentureTech Alliance's strategic equity investment provides essential foundry alignment for 4nm wafer
              access and advanced CoWoS packaging capacity, Etched remains acutely exposed to industry-wide HBM supply
              squeezes and packaging yield volatility.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
