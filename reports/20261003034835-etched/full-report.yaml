              - CM012
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              The customer base for specialized AI inference hardware is concentrated among three primary tiers: tier-1
              hyperscalers (Amazon AWS, Microsoft Azure, Google Cloud, Meta), sovereign and specialized neocloud
              infrastructure providers (such as CoreWeave or Lambda Labs), and quantitative trading firms alongside
              frontier AI research labs with massive private compute requirements. Procurement decisions are governed by
              infrastructure engineering leadership, datacenter operations, and quantitative trading desks seeking
              microsecond-level latency advantages. Adoption cycles require rigorous proof-of-concept testing, as
              demonstrated by Jane Street's evaluation of Sohu hardware before committing capital and placing on-premise
              racks into their production datacenters. While Etched has announced over $1 billion in signed customer
              contracts and pre-committed bookings, winning broad hyperscaler procurement remains challenging because
              cloud giants are actively developing in-house custom silicon, including Google TPU, Amazon
              Inferentia/Trainium, and Meta MTIA.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Structural Growth Drivers and Critical Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of specialized inference ASICs like Sohu is propelled by severe physical and financial
              bottlenecks in datacenter operations. Standard GPU architectures face mounting power, cooling, and memory
              bandwidth constraints; industry analyses from Goldman Sachs project a 160% increase in datacenter
              electricity demand driven by AI workloads by 2030, alongside substantial cooling water consumption. Etched
              addresses these constraints by eliminating hardware blocks unnecessary for transformers, utilizing
              low-voltage prefill processing and custom cluster-scale shared memory to claim up to 10x to 20x
              throughput-per-watt efficiency gains over Nvidia H100 systems. Conversely, major adoption constraints
              include high switching costs, lack of a mature software ecosystem comparable to Nvidia CUDA, and extreme
              supply chain concentration at TSMC and HBM suppliers. Furthermore, customer commitments often depend on
              initial hardware delivery validation, leaving execution and tape-out ramp risks paramount.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Existential Single-Architecture Bet on Transformer Dominance
            body: >-
              Unlike general-purpose GPUs which can be adapted via software to arbitrary neural network architectures,
              Etched's Sohu hardwires matrix multiplication and attention patterns directly into silicon. If state-space
              models (such as Mamba), liquid neural networks, or alternative non-transformer architectures supersede
              transformers, Sohu cannot pivot, posing a severe architectural obsolescence risk.
            calloutType: risk
            claimRefs:
              - CM003
              - CM008
              - CM009
          - type: callout
            title: Datacenter Power Constraints as a Core Accelerator Driver
            body: >-
              With AI projected to drive a 160% increase in datacenter power consumption by 2030, cloud operators face
              strict physical power limits. Etched's claims of 10x to 20x throughput-per-watt efficiency gains and the
              ability for one 8-chip Sohu server to replace up to 160 Nvidia H100 GPUs make power efficiency, rather
              than pure silicon cost, the primary economic purchase driver.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Inference Accelerator Landscape and Incumbent Dynamics
        blocks:
          - type: paragraph
            body: >-
              The AI accelerator landscape is overwhelmingly dominated by NVIDIA, which commands an estimated 70% to 95%
              market share across training and inference workloads. Hyperscalers and enterprise model operators remain
              heavily dependent on NVIDIA GPUs, including the H100, B200, and upcoming B300 lines, due to their broad
              programmability, pervasive software tooling, and mature CUDA library support. In response to high
              procurement costs and extreme power requirements, hardware alternatives have emerged across three distinct
              tiers: general-purpose GPU incumbents such as NVIDIA and AMD; architecture-specialized startup processors
              including the Groq 3 LPU, Cerebras WSE-3, and SambaNova SN40L; and in-house hyperscaler ASICs including
              Google TPUs, AWS Trainium/Inferentia, and Meta MTIA. Etched positions its Sohu chip as an extreme
              application-specific integrated circuit (ASIC) that entirely eliminates general-purpose compute units to
              execute transformer attention directly in static silicon circuits. However, unlike Groq's programmable
              SRAM dataflow architecture or NVIDIA's flexible CUDA pipeline, Sohu lacks any programmability layer,
              creating an acute trade-off between claimed raw decode throughput and operational versatility.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: Architectural Trade-Offs, Memory Hierarchies, and Workload Coverage
        blocks:
          - type: paragraph
            body: >-
              Evaluating inference accelerators requires analyzing memory bandwidth, batching behavior, and workload
              compatibility rather than peak theoretical arithmetic capabilities. Autoregressive language model decoding
              is heavily memory-bandwidth bound due to continuous key-value (KV) cache retrieval from memory. NVIDIA
              GPUs tackle this bottleneck using High Bandwidth Memory (such as 80GB HBM3 on H100 SXM5 delivering 3.35
              TB/s, or expanded HBM3E on Blackwell) paired with optimized CUDA kernels like FlashAttention and
              PagedAttention. The Groq 3 LPU bypasses external DRAM entirely by embedding 500 MB of ultra-fast on-chip
              SRAM per chip to achieve 150 TB/s bandwidth, but suffers from severe capacity constraints when serving
              multi-billion-parameter models. Etched adopts an intermediate physical memory strategy, outfitting Sohu
              with 144GB of HBM3E per chip (roughly 1.8x H100 SXM5 bandwidth) while replacing programmable matrix
              multiplication cores with hardwired attention logic. This enables high decode speed at batch size 1, but
              prevents Sohu from executing non-transformer operations. Crucially, contemporary frontier models such as
              DeepSeek V4 and Qwen3-235B-A22B rely on sparse mixture-of-experts (MoE) routing, vision encoders, or
              state-space models (SSMs) that cannot execute on rigid transformer-only silicon.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP007
              - CP008
      - number: '3.3'
        title: Switching Costs, Moat Durability, and Commercial Validation Barriers
        blocks:
          - type: paragraph
            body: >-
              Adopting alternative inference hardware involves substantial switching costs, software migration risks,
              and supply-chain dependencies. NVIDIA's primary competitive moat is not merely chip performance, but an
              eighteen-year software ecosystem comprising CUDA, TensorRT-LLM, vLLM, Triton, and thousands of
              pre-optimized libraries deeply embedded in production serving infrastructures. Replacing an NVIDIA cluster
              with Sohu requires cloud operators to abandon existing orchestration pipelines and adopt Etched's
              proprietary compiler and serving tools. Furthermore, while Groq operates with NVIDIA backing and
              data-center integrations, and Tenstorrent provides open-source TT-Metal tooling, Etched remains an
              early-stage startup dependent on proprietary software and TSMC 4nm foundry allocations. Although Etched
              reported over $1 billion in signed customer contracts and initial rack deployment with anchor backer Jane
              Street following its June 2026 stealth emergence, commercial validation at production scale remains
              unproven. Without third-party audited benchmarks or published pricing schedules, enterprise buyers face
              significant economic uncertainty regarding total cost of ownership and hardware obsolescence.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Architectural Trap: Specialization vs. Frontier Model Evolution'
            body: >-
              Etched's competitive position hinges entirely on the architectural longevity of pure dense transformers.
              By burning attention mechanisms into physical silicon circuits, Sohu delivers unprecedented claimed decode
              throughput for dense transformer language models. However, the AI frontier in 2026 is rapidly pivoting
              toward sparse mixture-of-experts (MoE) architectures like DeepSeek V4 and Qwen3, state-space models
              (Mamba), and integrated diffusion/multimodal encoders. Because Sohu lacks programmable matrix compute
              units, any substantial departure from standard dense transformer attention renders the underlying ASIC
              physically obsolete, whereas NVIDIA's programmable GPU clusters adapt via software kernel updates.
            calloutType: risk
            claimRefs:
              - CP003
              - CP007
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a hardware-led revenue model rather than a conventional subscription model.
              Multiples describes Etched as expecting revenue from chips, accelerator cards, racks, and associated
              computing systems, while the company-issued June update describes a rack-scale system and more than $1
              billion in signed customer contracts. No retained source discloses public list prices, realized prices,
