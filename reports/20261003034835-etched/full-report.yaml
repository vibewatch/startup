      from 2022 to late 2026.
    data:
      items:
        - date: 2022-09
          label: Company Formation
          detail: >-
            Etched founded by Harvard dropouts Gavin Uberti, Chris Zhu, and Robert Wachen to pursue transformer-specific
            silicon.
          tone: positive
        - date: 2023-03
          label: Seed Financing
          detail: Raised approximately $5.4M seed capital led by Primary Venture Partners; team relocates to Silicon Valley.
          tone: positive
        - date: 2024-06
          label: Series A & Sohu Architecture Reveal
          detail: >-
            Closed $120M Series A co-led by Primary Venture Partners and Positive Sum; publicly unveiled Sohu
            transformer-only ASIC.
          tone: positive
        - date: 2025-12
          label: Series B Financing at $5B
          detail: Secured $500M Series B round led by Stripes at a $5.0B post-money valuation, expanding foundry partnerships.
          tone: positive
        - date: 2026-03
          label: Independent Technical Scrutiny
          detail: >-
            Industry analysis highlights unverified 500k tok/s benchmarks and absence of third-party MLPerf
            measurements.
          tone: warning
        - date: 2026-06
          label: A0 Silicon Tape-Out & $1B Bookings
          detail: >-
            Announced working A0 silicon back from TSMC N4P process, $800M cumulative funding, and $1B+ in signed
            customer contracts.
          tone: positive
        - date: 2026-07
          label: Series C Financing at $10.3B
          detail: Closed $300M Series C led by Sequoia Capital at a $10.3B valuation with headcount crossing 400 engineers.
          tone: positive
        - date: 2026-07
          label: MLPerf Omission Verified
          detail: >-
            Independent review confirms absence from MLPerf Inference v5.1 and v6.0 rosters, underscoring third-party
            verification gap.
