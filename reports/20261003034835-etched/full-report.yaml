      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The financing record demonstrates access to capital, not the amount of cash currently available. Multiples
              reports $1.6 billion raised across six rounds, while multiple sources report a $700 million financing at a
              $21 billion valuation in August 2026. That funding can support production and deployment, but public
              sources do not disclose current cash, monthly burn, capex commitments, debt, project-finance obligations,
              customer deposits, or the timing of collections. The financial verdict is therefore mixed: commercial
              commitments and a delivered rack support a credible path to revenue, while revenue quality, margin, and
              runway remain unverified. Underwriting should remain contingent on audited financials, contract schedules,
              repeat unaffiliated demand, and a bottom-up manufacturing cost model.
