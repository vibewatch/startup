  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >
              Sohu is an inference ASIC rather than a general-purpose training accelerator: independent coverage
              describes a design that hardwires recurring transformer operations and trades workload flexibility for
              higher utilization. The public product surface has moved beyond the 2024 concept-stage description. In
              June 2026, Etched said it had achieved first-pass A0 silicon on TSMC N4P, was validating a rack-scale
              product with customers, and was ramping production. That is meaningful maturity progress, but it is still
              issuer-reported. A July 2026 independent account said the chip had not yet been commercially validated at
              scale or independently benchmarked. Product underwriting should therefore distinguish working silicon and
              customer validation from qualified volume shipments, sustained availability, or independently proven
              production performance.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE009
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE009
      - number: '5.2'
        title: Inference workflow and architecture
        blocks:
          - type: paragraph
            body: >
              The product is designed around the two main serving phases, prompt prefill and autoregressive decode, at
              rack scale. TechCrunch reported that Etched removes hardware and software paths unnecessary to transformer
              inference. A separate technical analysis of Etched patent applications interprets the design as pairing a
              systolic array for regular matrix operations with a distinct attention circuit and dedicated memory paths
              for model weights and the KV cache. That is a plausible mechanism for improving utilization, but it is an
              analyst interpretation rather than a published production schematic. The latest company release also says
              deployed systems run DeepSeek, Qwen, Mamba, and Llama. Support for that broader model set may indicate
              more adaptability than the original transformer-only positioning, but compatibility breadth, compiler
              constraints, and operator-level coverage are not publicly demonstrated here.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
