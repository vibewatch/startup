      - number: '1.2'
        title: Capitalization Trajectory, Valuation, and Stakeholder Governance
        blocks:
          - type: paragraph
            body: >-
              Etched's capitalization history illustrates rapid expansion alongside the broader generative AI
              infrastructure investment cycle. After raising an initial seed financing of approximately $5.4M in 2023
              and a $120M Series A in June 2024 co-led by Primary Venture Partners and Positive Sum Ventures, the
              company secured a $500M financing in December 2025 at a $5.0B post-money valuation led by Stripes. In July
              2026, Etched finalized a $300M Series C financing led by Sequoia Capital at a $10.3B valuation, bringing
              total venture equity capital to approximately $800M. Strategic alignment with major semiconductor and
              algorithmic stakeholders is cemented by equity participation from VentureTech Alliance (a TSMC-affiliated
              fund), memory supplier SK Hynix, and quantitative market makers including Jane Street, Hudson River
              Trading, Jump Trading, and Two Sigma. Later secondary market indicators and uncorroborated September 2026
              private reports have cited valuations reaching $21B on $1.7B total claimed capital, though transaction
              covenants, liquidation preferences, and formal institutional confirmations for amounts exceeding $10.3B
              remain unverified private estimates.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Silicon Milestones, Performance Claims, and Verification Gaps
        blocks:
          - type: paragraph
            body: >-
              Etched achieved first-pass (A0) silicon validation on TSMC's N4P 4nm fabrication process in early 2026 for
              its Sohu ASIC, which incorporates 144GB of HBM3E memory and a reticle-limit die size. The company asserts
              that Sohu achieves more than 500,000 tokens per second on Llama 70B within an 8-chip server chassis,
              claiming a 20x throughput improvement over an 8x NVIDIA H100 system through hardwired transformer
              operations, Low Voltage Inference (LVI), and Cluster Scale Memory (CSM). While management has announced
              over $1B in signed customer purchase agreements and initial rack-scale hardware deployments scheduled for
              customer delivery, independent benchmarking verification remains a critical operational bottleneck.
              Independent technical audits highlight that Etched has not submitted results to standardized benchmark
              consortia such as MLPerf Inference v5.1 or v6.0, leaving peak TFLOPS, thermal design power (TDP),
              sustained long-context throughput, and general pricing unverified outside internal company-reported
              demonstrations.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
