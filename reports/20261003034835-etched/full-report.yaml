      - number: '6.2'
        title: Adoption Trajectory, Hardware Bring-Up, and Named Production Proof
        blocks:
          - type: paragraph
            body: >-
              Etched's customer adoption trajectory achieved a critical engineering and operational milestone following
              its emergence from stealth on June 30, 2026, when it announced working first-pass A0 silicon fabricated on
              TSMC's 4nm (N4P) node alongside more than $1B in signed customer contracts. In July 2026, Etched executed
              its first physical hardware delivery by shipping an operational rack-scale inference system to
              quantitative trading firm Jane Street, which validated the system within its proprietary data-center
              environment and reported running real production workloads. According to technical documentation and
              industry reports, Etched demonstrated a 44-day bring-up window from receiving initial test silicon to
              running active inference workloads, and validated a claimed 700-nanosecond inter-chip communication
              latency via its proprietary interconnect—substantially faster than conventional GPU interconnect hops.
              However, public verification of commercial adoption beyond this initial strategic installation remains
              virtually non-existent. Although the company reports over $1B in signed customer commitments, no customer
              names outside of Jane Street have been publicly identified, nor have binding delivery schedules, advance
              cash deposits, or cancellation provisions been disclosed. Industry analysts caution that these contract
              figures represent conditional procurement agreements contingent upon successful volume manufacturing,
              thermal reliability, and customer workload acceptance rather than recognized GAAP revenue.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
