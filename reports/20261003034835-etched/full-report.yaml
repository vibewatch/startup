  - id: FU001
    title: Customer Commercialization and Deployment Journey
    type: journey-map
    summary: Customer journey stages spanning initial architectural evaluation to volume rack production and fleet expansion.
    data:
      items:
        - label: 1. Architecture Evaluation
          touchpoints:
            - Developer Cloud playground testing
            - Model graph and compiler compatibility check
            - TCO and throughput simulation vs Nvidia GPUs
        - label: 2. Technical Validation & Pilot
          touchpoints:
            - Private hardware demonstrations in San Jose NPI lab
            - Initial customer test rack shipment (Jane Street)
            - In-house data-center bring-up and precision audit
        - label: 3. Commercial Contract Execution
          touchpoints:
            - Negotiation of multi-million dollar rack procurement terms
            - Conditional forward commitment signing ($1B+ pipeline)
            - Power, thermal, and facility integration planning
        - label: 4. Volume Cluster Deployment
          touchpoints:
            - Taiwan factory and Milpitas SMT line production ramp
            - Full cluster installation and liquid cooling connection
            - Production model serving across DeepSeek, Qwen, and Llama
        - label: 5. Fleet Expansion & Re-Order
          touchpoints:
            - Multi-rack scale-out for enterprise AI agent workloads
            - Long-context KV cache optimization with Cluster Scale Memory
            - Expansion into gigawatt-scale data-center infrastructure
        - label: 6. Continuous Service & Optimization
          touchpoints:
            - Firmware and runtime software updates for new model architectures
            - Hardware health monitoring and telemetry integration
            - Dedicated engineering support and warranty lifecycle management
    approximationNotes: >-
      Journey map outlines the six sequential touchpoint phases required to transition prospective inference buyers into
      expanding commercial rack customers.
