  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Do not underwrite a new entry until operating metrics and financing terms are verified.
      - - Confidence
        - Medium on direction; low on price support
        - Evidence supports caution but not a precise fair value.
      - - Risk rating
        - High
        - Commercial ramp, architecture, manufacturing, and financing terms can each impair returns.
      - - Valuation stance
        - Expensive / unsupported by public operating data
        - The reported $21B mark lacks a public revenue or margin denominator.
      - - Target return and hold period
        - Not supportable from public evidence
        - Model only after entry price, preferences, dilution, revenue, margins, and exit assumptions are supplied.
    notes: >-
      Assessments use reported financing marks and public operating disclosures; missing private terms and financial
      metrics are shown as diligence gaps, not estimated.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV011
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - Thesis
        - Working-silicon execution
        - A0 silicon returned from TSMC N4P and entered customer validation.
        - Independent rack-level performance, reliability, and yield data would strengthen the case.
      - - Thesis
        - Commercial pull
        - The company reports more than $1B in signed contracts and a first Jane Street rack.
        - Repeat deliveries, recognized revenue, and customer references would convert demand into proof.
      - - Anti-thesis
        - Price outran disclosure
        - The mark reportedly rose from $10.3B to $21B in about one month without public revenue or margins.
        - Audited revenue, gross margin, backlog conversion, and cash-use data could support the price.
      - - Anti-thesis
        - Architecture and ramp concentration
        - >-
          Independent reviews flag absent benchmarks, limited volume proof, and redesign risk if model architectures
          shift.
        - Broad workload support, independent benchmarks, and sustained volume shipments would reduce the risk.
    notes: >-
      Company-issued demand and validation statements are distinguished from independent reporting; signed contracts are
      not treated as revenue.
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Volume shipments follow the first rack; contracts convert to revenue; independent economics validate the
          product.
        - >-
          A premium could be supportable only after revenue growth, margins, dilution, and exit multiples are evidenced;
          no public range is supportable today.
        - Repeat customers, recognized revenue, stable yields, and third-party benchmarks.
        - Customer acceptance or production ramp fails.
      - - Base
        - >-
          Working silicon and customer interest persist, but revenue conversion, margins, and ramp timing remain
          undisclosed.
        - >-
          The latest private mark is not independently underwritable; wait for primary metrics or materially better
          terms.
        - Additional deliveries occur, but financial disclosure remains incomplete.
        - Valuation stays high while commercial evidence advances slowly.
      - - Bear
        - >-
          Contracts do not convert, production slips, performance claims disappoint, or architecture shifts require
          redesign.
        - >-
          A sharp reset is plausible because the reported mark embeds success before public operating proof; no precise
          floor is defensible.
        - No repeat delivery, no independent benchmark, or renewed financing at weaker terms.
        - Missed acceptance milestones, cash-intensive ramp, or forced chip redesign.
    notes: >-
      Scenario labels are qualitative. Numerical probabilities, valuation ranges, and target returns are intentionally
      withheld because public revenue, margins, cash needs, preferences, and fully diluted ownership are missing.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
