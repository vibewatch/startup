      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Architecture Bet: Hardwired Transformer Silicon vs. Programmable Flexibility'
            body: >-
              Etched has built its corporate identity on an uncompromising technological hypothesis: that transformer
              attention mechanisms will remain the permanent foundation of generative AI inference. By hardcoding matrix
              multiplication, softmax, and layer normalization into TSMC 4nm silicon, Etched eliminates GPU instruction
              decoding overhead. However, this creates an existential vulnerability: if state-space models (SSMs) or
              novel non-attention architectures eclipse transformers, Sohu cannot be reprogrammed.
            calloutType: insight
            claimRefs:
              - CO009
              - CO011
              - CO012
          - type: callout
            title: 'Verification Deficit: Claimed Superiority vs. Independent Validation'
            body: >-
              While Etched has raised $800M and reported $1B in customer purchase orders, zero third-party benchmark
              validations or MLPerf audit submissions exist as of October 2026. Management's claims of 500,000
              tokens/sec on Llama 70B rely on narrow high-batch regimes. Until production hardware ships to neutral data
              centers and undergoes verifiable audit, headline throughput multiples must be treated as company-stated
              ambitions rather than established engineering facts.
            calloutType: risk
            claimRefs:
              - CO010
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Disambiguation
        blocks:
          - type: paragraph
            body: >-
              Etched competes in the specialized semiconductor accelerator market for artificial intelligence,
              specifically targeting the datacenter inference execution tier for large-scale generative models. To
              properly size Etched's commercial opportunity, it is critical to separate this high-performance computing
              domain from unrelated industries that appear in superficial keyword searches, such as acid-etched
              architectural glass or industrial track-etched filtration membranes. The relevant market is bounded
              specifically by enterprise and hyperscale datacenter spend on dedicated AI acceleration silicon, custom
              application-specific integrated circuits (ASICs), and integrated rack-scale inference clusters. Within
              this boundary, AI compute spend divides fundamentally into model training (dominated by flexible GPU
              clusters from Nvidia and AMD) and model inference (the operational serving of trained models in production
              environments). Etched's Sohu product line deliberately excludes the training phase to optimize exclusively
              for low-latency, high-throughput transformer inference across prefill and decode stages.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing Across Multiple Analytical Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Etched's addressable market requires decomposing broad macroeconomic projections into
              verifiable, technology-constrained tiers. Macro research cited by financial platforms indicates that
              global AI infrastructure spending is forecasted to expand toward $2.52 trillion, reflecting a 44%
              year-over-year increase driven by hyperscaler datacenter buildouts. However, treating
              multi-trillion-dollar macro figures as Etched's total addressable market is analytically flawed. Hardware
              accelerators represent an estimated $100 billion to $150 billion segment within broader infrastructure,
              and datacenter inference constitutes roughly 50% to 65% of dedicated accelerator demand. Furthermore,
              Etched's serviceable market is strictly bounded by transformer-based workloads, which currently power the
              vast majority of frontier commercial applications including OpenAI ChatGPT, Anthropic Claude, and Google
              Gemini. If non-transformer model architectures such as state-space models or hybrid designs gain
              production dominance, Etched's hardwired architecture cannot pivot, rendering its addressable TAM
              vulnerable to rapid obsolescence.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
          - type: figure
            figureRef: FM001
