              - CU012
              - CU013
      - number: '6.3'
        title: Counterparty Concentration, Channel Friction, and Commercial Durability
        blocks:
          - type: paragraph
            body: >-
              The primary commercial risk facing Etched's go-to-market durability is extreme customer and stakeholder
              concentration, exacerbated by counterparty circularity between capital providers and customer references.
              Jane Street serves simultaneously as an early shareholder, a lead investor anchoring the August 2026 $700M
              funding round at a $21B valuation, and the sole confirmed enterprise customer operating a live rack in
              production. While Jane Street's technical evaluation confirms that Etched's silicon functions in a
              demanding trading environment, its dual status as lead financier and reference customer introduces
              material underwriting bias, as its commercial endorsement cannot be evaluated as an arms-length
              third-party procurement decision. Furthermore, Etched's business model centers on direct capital equipment
              sales of full server racks rather than sticky multi-year cloud SaaS contracts, exposing the company to
              lumpy purchase cycles and intense procurement friction. Enterprise and cloud buyers evaluating Etched must
              navigate the risk of architectural lock-in, unproven long-term field reliability, and the software
              switching costs associated with migrating away from Nvidia's deeply entrenched CUDA ecosystem. Independent
              commentators and hardware analysts note that while Etched claims its 8-chip server can match the
              throughput of 160 Nvidia H100 GPUs on specific benchmarks, the lack of audited MLPerf benchmark
              submissions or multi-tenant cloud deployments leaves real-world customer durability, retention, and gross
              margins unverified.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Customer Concentration and Counterparty Circularity
            body: >-
              Etched's commercial credibility rests heavily on a single named customer deployment: Jane Street. Because
              Jane Street is also a major early investor and the lead sponsor of Etched's $700M Series D round at a $21B
              valuation, its endorsement does not represent an independent, arms-length market signal. Prospective
              investors must treat customer concentration as a critical diligence blocker until multiple unaffiliated
              enterprise buyers validate the hardware.
            calloutType: risk
            claimRefs:
              - CU006
              - CU012
              - CU013
          - type: callout
            title: Contract Backlog Execution vs Revenue Recognition
            body: >-
              Etched's reported $1B+ in signed customer contracts cannot be equated with recognized revenue or software
              ARR. Hardware infrastructure procurement carries significant execution risks, including TSMC wafer yields,
              HBM3E memory packaging bottlenecks, and customer acceptance testing. Without transparent milestone
              schedules, these contracts remain vulnerable to delivery delays or cancellation.
            calloutType: insight
            claimRefs:
              - CU007
              - CU010
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Architectural Lock-In and Technology Obsolescence
        blocks:
          - type: paragraph
            body: >-
              Etched's commercial proposition hinges on an architectural all-or-nothing bet: by hardwiring transformer
              attention and matrix multiplication directly into fixed-function ASIC silicon, the Sohu processor
              sacrifices general-purpose flexibility to maximize throughput and power efficiency. While this design
              reportedly delivers substantial speedups over general-purpose GPUs on standard transformer models like
              Llama-70B, it renders the hardware structurally incapable of running alternative architectures without
              fabricating a replacement chip from scratch. As research labs actively develop sub-quadratic models,
              state-space architectures such as Mamba, and hybrid SSM-transformer variants to circumvent transformer
              quadratic scaling costs, any paradigm shift toward non-transformer models represents an existential threat
              to Etched's product line. Furthermore, specialized ASICs require custom compilation layers and bespoke
              software tooling, creating significant developer adoption friction compared to the entrenched, mature
              NVIDIA CUDA and open-source vLLM software ecosystem. Hardware teardowns indicate that Sohu's projected
              500,000 token-per-second throughput is physically bounded to short-context evaluation windows with
              aggressive batch sizes, leaving long-context performance and KV-cache scaling vulnerable to memory
              bandwidth bottlenecks.
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
