chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Etched was founded in 2022 by Harvard dropouts and Thiel Fellows Gavin Uberti, Chris Zhu, and Robert
              Wachen, joined by former Cypress Semiconductor CTO Mark Ross. The enterprise is incorporated in Delaware
              and operates its headquarters, NPI prototyping lab, data center, and test house at 3155 Olsen Drive in San
              Jose, California, supplemented by a manufacturing facility in Taiwan and an additional 10MW facility in
              Milpitas. Etched has scaled its engineering organization from approximately 35 personnel in mid-2024 to
              more than 400 engineers recruited from NVIDIA, Google TPUs, Broadcom, SK Hynix, and TSMC. The company's
              business model centers on commercializing full-stack frontier inference systems—integrating custom ASICs,
              rack infrastructure, proprietary low-latency interconnects, and specialized software stacks—to fulfill
              customer contracts rather than retailing standalone merchant accelerator cards.
            claimRefs:
