      - number: '5.3'
        title: Performance thesis and differentiation
        blocks:
          - type: paragraph
            body: >
              Etched's differentiation is workload specialization, not a generally comparable compute platform. One
              current profile repeats a headline result of more than 500,000 tokens per second on Llama-70B for an
              eight-chip Sohu server versus 23,000 tokens per second for eight H100s, but it does not provide an
              independent test protocol. An independent technical review finds a 10x to 20x advantage physically
              plausible at high batch sizes and short contexts, while arguing that the advantage should narrow at low
              batch sizes or long contexts because weight movement and KV-cache capacity become binding. RCR likewise
              reports that independent benchmarks remain absent. The defensible conclusion is that Sohu may be a
              high-throughput serving engine under selected workload conditions; latency, long-context behavior, model
              quality parity, power, and total-cost superiority are still open validation items.
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE013
      - number: '5.4'
        title: Deployment dependencies and controls
        blocks:
          - type: paragraph
            body: >
              Etched follows a fabless model and relies on TSMC for advanced-node production, while the company says it
              has added a Taiwan factory plus in-house data-center, test-house, and NPI prototyping capabilities. A
              developer-hosted supply analysis argues that HBM availability can make speed-to-volume materially slower
              than speed-to-silicon; that estimate is not supplier-confirmed, but it identifies the correct diligence
              surface: binding wafer, packaging, and memory allocations rather than financing alone. An archived
              hardware-practitioner discussion also shows unresolved concern about architecture obsolescence and the gap
              between prototype evidence and a durable ASIC platform. No reviewed public evidence establishes security
              certifications, reliability SLOs, incident history, privacy controls, quality-system certifications,
              yield, or field-failure performance. Their absence from public evidence is a diligence gap, not proof that
              the controls do not exist.
            claimRefs:
              - CE002
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
