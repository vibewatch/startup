      - CM006
      - CM007
      - CM012
  - id: FP001
    title: 竞争定位图：架构灵活性对比宣称的专用效率
    type: quadrant
    summary: 各推理加速芯片在架构可编程性与宣称的推理专用化效率上的对比评估。
    data:
      points:
        - label: NVIDIA H100
          x: 88
          'y': 65
          quadrant: 1
          description: 具备高灵活性的通用 GPU，支持通用模型并拥有成熟的 CUDA 软件栈。
        - label: NVIDIA B200
          x: 90
          'y': 80
          quadrant: 1
          description: 下一代可编程架构，具备先进的 FP4/FP8 张量计算效率。
        - label: Groq 3 LPU
          x: 55
          'y': 85
          quadrant: 2
          description: 基于 SRAM 的数据流处理器，借助定制编译器的可编程性优化延迟。
        - label: Etched Sohu
          x: 10
          'y': 95
          quadrant: 2
          description: 零可编程性的 Transformer 专用 ASIC，放弃全部灵活性以追求宣称的极高专用吞吐。
        - label: Google TPU v5e
          x: 70
          'y': 72
          quadrant: 1
          description: 超大规模云厂商矩阵加速芯片，平衡模型灵活性与云端成本效益。
        - label: AWS Trainium 2
          x: 65
          'y': 68
          quadrant: 1
          description: 超大规模云厂商自研芯片，集成于 AWS 云虚拟化环境及 Neuron SDK。
    approximationNotes: 坐标轴基于基准测试对比文献，展示架构可编程性（X 轴）与宣称的推理吞吐专用化程度（Y 轴）归一化后的定性序数评分（0-100）。
