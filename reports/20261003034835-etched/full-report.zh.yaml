            body: >
              Etched 的差异化立足于特定任务专精，而非打造全面对标的通用算力平台。一份最新资料复述了亮眼数据：在 Llama-70B 上，单台 8 卡 Sohu 服务器每秒跑出超 500,000 tokens，而 8 张
              H100 仅为 23,000 tokens；但资料并未提供独立的测试规范。一份独立技术审视认为，在高 batch 与短上下文条件下，10x 至 20x 的能效与速度优势在物理上说得通；但一旦切换至低 batch
              或长上下文，受制于权重搬运与 KV 缓存容量上限，该优势将大幅收窄。RCR 同样报道指出，独立跑分测试依然缺位。客观合理的结论是：在特定工作负载下，Sohu
              或许是一款高吞吐服务利器；但其延迟、长上下文表现、模型精度一致性、功耗及整体成本优势，依然有待进一步实测验证。
