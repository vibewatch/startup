            title: 极高的客户集中度与对手方关联闭环
            body: >-
              Etched 的商业公信力严重依赖单一具名客户 Jane Street。鉴于 Jane Street 既是早期重要投资方，又主导了按 $21B 估值推进的 $700M D
              轮融资，其背书不能代表公平交易原则下的独立市场信号。在多家无关联企业买家完成实测验证之前，潜在投资者必须将客户集中度视为关键的尽调阻碍。
            calloutType: risk
            claimRefs:
              - CU006
              - CU012
              - CU013
          - type: callout
            title: 在手订单交付履约 vs. 财务收入确认
            body: >-
              Etched 所披露的超 $1B 已签约客户合同，绝不可等同于已确认收入或软件 ARR。硬件基础设施采购面临巨大的交付履约风险，包括 TSMC 晶圆良率、HBM3E
              内存封装产能瓶颈以及客户验收测试。在缺乏透明排期节点的情况下，这些合同极易遭遇交付延期甚至取消。
            calloutType: insight
            claimRefs:
              - CU007
              - CU010
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 架构锁定与技术淘汰风险
        blocks:
          - type: paragraph
            body: >-
              Etched 的商业立足点押在一场成败在此一举的架构豪赌上：Sohu 处理器将 transformer 注意力与矩阵乘法直接硬固化进定功能 ASIC
              硅片，牺牲通用灵活性以榨取极致的吞吐量与能效。尽管据报道该设计在 Llama-70B 等标准 transformer 模型上相比通用 GPU
              展现出显著加速，但这使得硬件在物理结构上完全丧失兼容替代架构的能力，除非彻底推倒重造。当前各大研究实验室正全力探索次二次方复杂度模型、Mamba 等状态空间架构，以及混合 SSM-transformer
              变体，以破解 transformer 二次方计算成本的诅咒；任何脱离 transformer 的范式迁移都会对 Etched 的产品线构成致命打击。此外，专用 ASIC
              需要配套定制编译层与专属软件工具，相较于根深蒂固、成熟完备的 NVIDIA CUDA 与开源 vLLM 生态，给开发者带来了极高的上手门槛。硬件拆解报告显示，Sohu 预估的每秒 500,000 tokens
              吞吐量在物理上仅局限于激进 batch size 下的短上下文测试，长上下文表现与 KV 缓存扩展极易受制于内存带宽瓶颈。
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: 芯片流片、硬件制造与供应链高度集中
        blocks:
          - type: paragraph
            body: >-
              尽管 Etched 在 2026 年年中宣布基于 TSMC 4nm N4P 制程成功完成首版 A0
              流片，但公司尚未展现出规模化的商业硬件交付能力。独立半导体分析强调，目前公布的所有性能指标全数出自公司自建的模型仿真与实验室测算，Sohu 在标准化的 MLPerf
              推理基准测试中完全缺席。从单芯片实验室跑通跨越到高密度多芯片机架部署，公司暴露出极其严峻的工程隐患，涵盖复杂的散热要求、供电公差以及高频板卡互连完整性。尤为棘手的是，每颗 Sohu 芯片需消耗 144 GB
              高带宽内存（HBM3E），而当前全球封装与存储产能极度紧缺，存储原厂将约 90% 的专用 HBM 产能划拨给了 NVIDIA。虽然 TSMC 旗下的 VentureTech Alliance 的战略注资确保了
              4nm 晶圆配给与 CoWoS 先进封装产能，但 Etched 依然直接暴露在全行业 HBM 缺货潮与封装良率波动的风口浪尖上。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.3'
        title: 监管政策、法律纠纷与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              从监管与法律角度审视，Etched 身处审查日趋严苛的跨境半导体博弈格局中。先锋 AI
              加速芯片面临美国工业与安全局（BIS）严厉的出口管制条例，以及潜在的算力门槛上限，这直接限制了其在非同盟国际市场的交付，从而压缩了 Etched
              的云端目标客群。此外，与拥有深厚专利壁垒的老牌巨头同台竞技，使公司持续暴露在微架构专利侵权与商业秘密权利主张的风险之下，其自研注意力电路亟需严谨的自由实施（FTO）排查。从资产负债表与公司治理角度看，Etched
              于 2025 年底以 $5B 估值筹集了约 $500M，并在商业出货前便展开了挂钩 $10B 和 $20B 估值的两阶段融资谈判。其资本结构包含 B 轮与 C 轮优先股，附带 1.0x 非参与型清算优先权以及
              6.0% 的累积股息率。在超过 $5B 的投机性私募估值下，一旦生产延误倒逼低价融资（down-round）或压低退出估值，这种优先股架构将给普通股股东与员工带来沉重的下行清算压力。
            claimRefs:
              - CR001
              - CR002
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
      - number: '7.4'
        title: 商业化推进排期、合同集中度与后续尽调路径
        blocks:
          - type: paragraph
            body: >-
              Etched 后续的核心节点，在于将意向订单转化为经客户验收并真正创收的量产交付。公司自称坐拥超 $1B 已签约客户合同，但这主要代表来自云厂商与 AI
              平台方的附条件预定意向，并非不可撤销的确认收入。为支撑这一管线，Etched 将圣何塞与台湾的团队规模扩充至 400 余人，大幅扩建硬件工程、设计验证与系统集成力量。该投资逻辑的核心否决触发条件（kill
              criteria）包括：截至 2026 年底未能交付首批经客户验证的机架；前沿长上下文工作负载下出现明显的性能跳水或无法修复的芯片硬伤（errata）；头部基础模型实验室迅速转向非 transformer
              架构商业化；或因交付延期引发客户撤单。尽调必须锁定主服务协议（MSA）中的撤单条款审计、量产实体芯片经第三方审计的 MLPerf 成绩验证，以及存储代工伙伴确保供给的 HBM3E 产能配额。
            claimRefs:
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 专栏分析
        blocks:
          - type: callout
            title: 架构锁定陷阱
            body: >-
              把 transformer 注意力固化在固定功能芯片中固然换取了惊人的极致吞吐量，却也带来了生死存亡的脆弱性：一旦状态空间模型等非 transformer 架构攻占前沿 AI 负载，Sohu
              若想调头就得重新流片，预估需要耗费 3 年时间。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
          - type: callout
            title: 基准跑分验证先于商业规模落地
            body: Etched 据报道斩获的超 $1B 客户意向与 $20B 估值谈判，完全建立在未经独立 MLPerf 验证的自述性能之上。在将量产阶段估值倍数计入投资判断前，尽调必须首先核实 2026 年夏季的机架交付实况。
            calloutType: insight
            claimRefs:
              - CR006
              - CR012
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与立场定调
        blocks:
          - type: paragraph
            body: >-
              当前投资建议为继续研究（research-more），尽调评估风险定为“高”，公开估值定调为“昂贵至缺乏支撑”。WOWTALE 报道称，公司在 2026 年 8 月以 $21B 估值完成 $700M D
              轮融资，较一个月前报道的 $10.3B C 轮估值翻了一倍有余。估值飙升固然有更好的运营实证支撑：Etched 自述 A0 芯片已跑通、签约合同突破
              $1B，并已有真实机架交付至客户手中。然而现有公开证据完全没有提供收入、盈利能力、单体经济模型或已确认收入作为分母。在对商业转化、单位经济效益与交易条款开展一手尽调前，任何新投资都无法锚定目标回报率或站得住脚的估值倍数。现有证据支持继续深入尽调，绝非不计价格盲目追高。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV011
              - CV016
      - number: '8.2'
        title: 融资背景与投资进场纪律
        blocks:
          - type: paragraph
            body: >-
              融资履历既展现出强劲势头，也暴露了口径难以对比的实质问题。Etched 于 6 月 30 日声明已累计融资 $800M；随后有行研名录称 7 月 C 轮后融资金额达到 $925M，而 D
              轮之后的多家渠道报道称累计约
              $1.7B。这些数字统计截止日期各异，对轮次的定义也不尽相同，不可视作单一稳定的统一步调。更关键的是，融资金额绝不等于可用现金，签约合同也绝非确认收入。现有证据中，股权结构表、清算优先权、期权池处理、资方持股比例及老股交易定价通通缺席。因此，进场纪律必须牢牢锚定里程碑与具体条款：在把
              $21B 的宣传数字转化为可落地的投资对价前，必须逐轮对账、拿到完全稀释后的股权结构表，并核实合同质量与经审计的经营指标。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 乐观、基准与悲观情景推演
        blocks:
          - type: paragraph
            body: >-
              情景推演的核心取决于证据支撑，而非臆造的收入预测。乐观情景（bull
              case）要求报道的首批客户交付能够演进为可复制的规模量产、在手订单顺利转化为确认收入，并且成本与性能的经济账能获得独立实测验证。基准情景（base
              case）假定可用芯片与客户兴趣属实，但放量节奏、利润率与收入转化依然悬而未决；这支持持续跟踪观察，而非直接为最新一轮估值买单。悲观情景（bear
              case）则叠加上产线与流片延误、签约需求无法兑现、架构迅速过时以及估值大幅缩水。由于缺少收入、利润率、稀释比例及优先权等核心输入变量，现有公开证据完全无法支撑具体的概率数值或公允价值估值区间。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 对标公司、退出就绪度与终局尽调重点
        blocks:
          - type: paragraph
            body: >-
              现有的可比对标组仅具风向标参考价值，达不到精确估值的标准。一份市场数据名录列出 Arm、Astera Labs 和 Ambarella IPO 时的市销率（P/S）分别约为 26x、25x 和 6x，但也明确注明
              Etched 并未披露任何收入分母。这些上市公司在体量、产品线广度、流动性及经营历史上与 Etched 截然不同，其 IPO 估值倍数无法倒推算定 Etched
              的公允价值。同样，退出就绪度取决于经检验的量产出货、确认收入、老客户复购、经独立实测的性能，以及能够清晰披露利润率和资金需求的财务体系。报道中提到的 Jane Street
              首个机架交付固然是进展，但绝非可复制商业闭环的明证。投资逻辑的证伪触发点包括：客户验收失败、生产持续延期、合同转化疲软，或底层架构发生迁移迫使团队耗费巨资重做芯片。
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV007
              - CV008
              - CV016
      - number: '8.5'
        title: 附录图表
        blocks:
          - type: callout
            title: 估值敏感型尽调结论
            body: 公司实际表现可能强于此前公开画像，但据报道的 $21B 估值无法由公开经营数据支撑。尽调仍需推进；切勿把融资势头当成估值证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV016
          - type: callout
            title: 核心逻辑失效检验
            body: 若首套机柜未能带来后续批量交付、已签合同未能转化为确认收入，或架构调整迫使团队在规模化量产前大幅重构设计，就应停止推进投资判断。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
