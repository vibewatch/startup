      - number: '2.2'
        title: 多视角潜在市场空间（TAM）测算
        blocks:
          - type: paragraph
            body: >-
              评估 Etched 的潜在市场空间，需要将宽泛的宏观预测拆解为受技术约束的扎实层级。金融平台引述的宏观研报预计，在云厂商数据中心扩建拉动下，全球 AI 基础设施支出将增至 $2.52T，同比增长
              44%。但若把数万亿美元的宏观大数直接当成 Etched 的 TAM，在分析上站不住脚。在庞大的基础设施中，硬件加速芯片板块估计仅占 $100B 到 $150B，而数据中心推理约占专用加速芯片需求的 50% 至
              65%。再者，Etched 的可服务市场被死死框在 transformer 工作负载内，尽管目前 OpenAI ChatGPT、Anthropic Claude、Google Gemini
              等主流商业应用多基于此架构。一旦状态空间模型或混合设计等非 transformer 架构在生产中占据主导，硬连线硬件便无法掉头，其可触达 TAM 面临迅速归零的淘汰风险。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
