      - number: '2.3'
        title: 客户细分、预算归属与采纳路径
        blocks:
          - type: paragraph
            body: >-
              专用 AI 推理硬件的买方群体主要集中在三大客群：第一梯队超大规模云厂商（Amazon AWS、Microsoft Azure、Google Cloud、Meta）；主权云与专业算力云（如
              CoreWeave、Lambda Labs）；以及手握庞大自建算力需求的量化交易机构和前沿 AI
              实验室。采购决策由基础设施工程主管、数据中心运维负责人以及追求微秒级延迟优势的量化交易台共同拍板。采纳周期需要严苛的概念验证（PoC），正如 Jane Street 在注资并把机架部署进生产数据中心前，对
              Sohu 硬件展开的深度评估。尽管 Etched 宣布斩获超 $1B 已签署客户合同与预定额，但要拿下主流云厂商采购绝非易事，因头部云厂商正全力自研定制芯片，包括 Google TPU、Amazon
              Inferentia/Trainium 以及 Meta MTIA。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 结构性增长驱动力与关键采纳制约
        blocks:
          - type: paragraph
            body: >-
              数据中心面临严峻的物理与资金瓶颈，正倒逼业界采纳 Sohu 这类专用推理 ASIC。通用 GPU 架构面临与日俱增的功耗、散热及内存带宽极限；Goldman Sachs 行业分析预计，在 AI 工作负载拉动下，到
              2030 年数据中心用电需求将激增 160%，冷却用水量同样十分惊人。Etched 砍掉对 transformer 无用的硬件模块，凭借低电压 prefill 处理与定制集群级共享内存，自述相比 Nvidia
              H100 系统能跑出高达 10x 至 20x 的每瓦吞吐效率。反之，核心采纳制约在于高昂的切换成本、缺乏可匹敌 Nvidia CUDA 的成熟软件生态，以及高度集中在 TSMC 与 HBM
              供应商处的供应链风险。客户意向往往取决于首批硬件交付实测，工程执行与流片扩产风险悬在头顶。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 专栏分析
        blocks:
          - type: callout
            title: 死磕 Transformer 主导地位的单一架构豪赌
            body: >-
              通用 GPU 尚可依靠软件适配各类神经网络架构，而 Etched 的 Sohu 直接将矩阵乘法与注意力模式焊死在芯片上。一旦状态空间模型（如 Mamba）、液态神经网络或其他非 transformer
              架构取代主流地位，Sohu 硬件根本无法调头，面临极高的技术淘汰风险。
            calloutType: risk
            claimRefs:
              - CM003
              - CM008
              - CM009
          - type: callout
            title: 数据中心电力承载力极限：专用加速芯片的核心推手
            body: >-
              预计到 2030 年 AI 将推高数据中心 160% 的电力消耗，云厂商正撞上物理供电天花板。Etched 宣称其每瓦吞吐能效提升 10x 至 20x，单台 8 卡 Sohu 服务器可替代多达 160 张
              Nvidia H100 GPU；能效表现而非纯硬件造价，已成为买方最核心的经济决策动力。
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 推理加速芯片竞争版图与巨头动态
        blocks:
          - type: paragraph
            body: >-
              AI 加速芯片版图几乎被 NVIDIA 绝对统治，其在训练和推理工作负载上的预估市场份额高达 70% 至 95%。得益于高度可编程性、无处不在的软件工具链以及成熟的 CUDA
              库支持，头部云厂商与企业级模型运营方仍重度依赖 H100、B200 及后续 B300 系列等 NVIDIA GPU。面对昂贵的采购支出与苛刻的功耗需求，市场涌现出三大层级的替代选项：以 NVIDIA、AMD
              为代表的通用 GPU 守成巨头；以 Groq 3 LPU、Cerebras WSE-3、SambaNova SN40L 为代表的架构特化型初创芯片；以及包括 Google TPU、AWS
              Trainium/Inferentia、Meta MTIA 在内的云巨头自研 ASIC。Etched 将 Sohu 定位为极端的专用集成电路（ASIC），彻底剥离通用计算单元，直接在静态硅片电路上执行
              transformer 注意力运算。但不同于 Groq 的可编程 SRAM 数据流架构或 NVIDIA 灵活的 CUDA 流水线，Sohu
              完全不具备可编程层，在宣称的高解码吞吐量与实际业务灵活性之间形成了剧烈的权衡取舍。
            claimRefs:
              - CP001
              - CP002
              - CP003
