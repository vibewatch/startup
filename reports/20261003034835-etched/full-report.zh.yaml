      - number: '1.3'
        title: 芯片关键节点、性能宣称与验证缺口
        blocks:
          - type: paragraph
            body: >-
              2026 年初，Etched 的 Sohu ASIC 在 TSMC N4P 4nm 工艺上完成首版（A0）流片验证，该芯片配备 144GB HBM3E
              内存，裸片面积逼近光罩极限（reticle-limit）。公司声称，在单台 8 卡服务器机箱内，Sohu 运行 Llama 70B 时可达到每秒超过 500,000 tokens；凭借硬连线
              transformer 算子、低电压推理（LVI）与集群级内存（CSM），相比 8x NVIDIA H100 系统斩获 20x 吞吐量提升。管理层虽已宣布斩获超 $1B
              已签约客户采购意向，并排期交付首批机架级硬件，但独立跑分验证依旧是核心阻碍。独立技术审计指出，Etched 尚未向 MLPerf Inference v5.1 或 v6.0
              等标准化测试联盟提交成绩；在公司内部展示之外，其峰值 TFLOPS、热设计功耗（TDP）、长上下文持续吞吐量及实际定价均未经验证。
