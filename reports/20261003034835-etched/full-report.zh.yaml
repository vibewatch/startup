  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业身份、创立背景与运营模式
        blocks:
          - type: paragraph
            body: >-
              Etched 由哈佛辍学学生兼 Thiel 奖学金得主 Gavin Uberti、Chris Zhu 和 Robert Wachen 于 2022 年创立，前 Cypress Semiconductor CTO
              Mark Ross 随后加盟。公司注册于特拉华州，总部、NPI 原型实验室、数据中心及测试中心设在加州圣何塞 Olsen Drive 3155
              号，同时在台湾建有制造基地，并在米尔皮塔斯（Milpitas）拥有一处 10MW 的设施。Etched 的工程团队从 2024 年年中的约 35 人迅速扩张至 400 多名工程师，主要从
              NVIDIA、Google TPU 团队、Broadcom、SK Hynix 及 TSMC 引进。商业模式上，公司重点推进全栈前沿推理系统的商业化交付——集成自研
              ASIC、机架基础设施、自研低延迟互连及专用软件栈以履约客户合同，而非单卖商用加速卡。
