      - number: '1.4'
        title: 专栏分析
        blocks:
          - type: callout
            title: 架构赌注：固化 Transformer 硬件 vs. 可编程灵活性
            body: >-
              Etched 将自身立足点押在一项毫不妥协的技术假设上：认为 transformer 注意力机制将长期充当生成式 AI 推理的底层支柱。团队把矩阵乘法、softmax 和层归一化直接固化进 TSMC 4nm
              芯片，彻底甩掉 GPU 指令解码开销。但这也埋下了生死攸关的软肋：一旦状态空间模型（SSM）或新型非注意力架构超越 transformer，Sohu 硬件无法重新编程。
            calloutType: insight
            claimRefs:
              - CO009
              - CO011
              - CO012
          - type: callout
            title: 验证缺位：宣称优势 vs. 独立实测
            body: >-
              尽管 Etched 已斩获 $800M 融资并披露超 $1B 客户采购订单，但截至 2026 年 10 月，尚无任何第三方跑分验证或 MLPerf 审计送检。管理层所称在 Llama 70B 上达到的
              500,000 tokens/秒，高度依赖严苛的高 batch 条件。在量产硬件交付至中立数据中心并完成可复核审计前，公开宣传的吞吐量倍数只能视作公司自述的目标，而非既成工程事实。
