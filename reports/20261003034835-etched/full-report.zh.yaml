      - number: '5.2'
        title: 推理工作流与底层架构
        blocks:
          - type: paragraph
            body: >
              该产品在机架尺度上紧扣模型服务两大核心阶段设计——提示词预填充（prompt prefill）与自回归解码（autoregressive decode）。TechCrunch 报道称，Etched 剔除了对
              transformer 推理无用的硬件与软件冗余路径。另一份针对 Etched 专利申请的技术分析认为，该架构采用脉动阵列（systolic
              array）处理常规矩阵运算，并搭配独立的注意力硬件电路以及面向模型权重和 KV
              缓存的专用存储通路。这种设计在提升硬件利用率上逻辑自洽，但这终究属于分析师的解读，并非官方公布的量产原理图。公司最新通报亦宣称部署系统可运行 DeepSeek、Qwen、Mamba 与
              Llama。支持更广泛的模型集或许表明其适配弹性高于最初宣称的 transformer 专用定位，但兼容范围、编译器瓶颈及算子级覆盖度在此尚未获得公开证实。
