  - id: FE001
    title: Sohu 产品架构图
    type: stack
    summary: 基于公开信源梳理的概念技术栈，涵盖支持的模型图至机柜级验证。
    data:
      layers:
        - label: 支持的模型计算图
          detail: 公司列出 DeepSeek、Qwen、Mamba 和 Llama；完整的算子覆盖度尚未公开。
          items:
            - 模型架构
            - 支持的算子
        - label: 软件映射
          detail: 专用推理软件将支持的计算图映射到 ASIC；公开编译器文档尚存缺口。
          items:
            - 计算图准备
            - 执行映射
        - label: Prefill 路径
          detail: 该机柜级系统旨在处理 Prompt Prefill 工作负载。
          items:
            - Prompt 处理
            - 重矩阵计算执行
        - label: Decode 与注意力路径
          detail: 第三方专利解读显示存在独立的注意力专用电路与 KV-Cache 路径。
          items:
            - Token 解码
            - KV-Cache 访问
        - label: 芯片与内存
          detail: 公司自述的一次流片成功的 TSMC N4P 芯片依赖于先进内存与封装。
          items:
            - Sohu ASIC
            - HBM 子系统
        - label: 机柜与验证运营
          detail: Etched 披露已开展客户验证、产能爬坡，并具备内部测试与 NPI 设施。
          items:
            - 机柜级系统
            - 客户验证
