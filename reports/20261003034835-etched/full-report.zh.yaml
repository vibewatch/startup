              Sohu 是专用推理 ASIC，而非通用训练加速芯片：独立报道指出，其设计将频繁调用的 transformer 算子固化在硬件中，牺牲任务灵活性以换取更高的硬件利用率。公开披露的产品形态已脱离 2024
              年的概念阶段。2026 年 6 月，Etched 表示其基于 TSMC N4P 成功完成 A0 首版流片，正携手客户验证机架级产品，并逐步拉升产能。这固然代表了实质性的成熟度跃升，但仍属厂商自述口径。2026 年
              7 月的一份独立分析称，该芯片尚未在规模上得到商业验证，亦缺乏独立跑分。产品维度的尽调评估因而须分清界限：流片跑通和客户验证是一回事，真正通过验证的规模量产、长期可用性与经受独立实测的生产级性能则是另一回事。
