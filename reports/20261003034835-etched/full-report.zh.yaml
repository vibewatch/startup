            body: >
              Etched 采用 Fabless 无晶圆厂模式，依赖 TSMC 推进先进制程生产；公司自述已增设台湾工厂，并在圣何塞自建数据中心、测试中心及 NPI 原型开发能力。开发者社区的一份供应链分析指出，受 HBM
              供应所限，芯片从跑通走向放量（speed-to-volume）的速度会显著慢于从立项到流片（speed-to-silicon）；该预估虽未经供应商证实，却点出了真正的尽调核心：卡脖子的是晶圆、先进封装与存储产能配给，绝非仅靠融钱就能解决。硬件从业者的一场历史讨论亦流露出对架构过时风险的担忧，认为原型证据与成熟耐用的
              ASIC 平台之间尚存鸿沟。审阅的公开证据中，未见安全认证、可靠性 SLO、故障历史、隐私控制、质量体系认证、良率或现网故障率等公开记录。这些信息在公开材料中缺失属于尽调证据缺口，并不等于证明公司缺乏上述控制。
