      - number: '3.4'
        title: 专栏分析
        blocks:
          - type: callout
            title: 架构陷阱：高度特化 vs. 前沿模型演进
            body: >-
              Etched 的竞争身位完全押在纯稠密 transformer 架构的寿命上。Sohu 把注意力机制直接烧录进物理硅片电路，在稠密 transformer 语言模型上跑出了前所未有的宣称解码吞吐量。但在 2026
              年，AI 前沿正迅速转向以 DeepSeek V4 和 Qwen3 为代表的稀疏混合专家（MoE）架构、状态空间模型（Mamba）以及扩散与多模态集成编码器。Sohu
              缺乏可编程矩阵计算单元，一旦技术路线实质性偏离标准稠密 transformer 注意力机制，整颗 ASIC 硬件就会直接沦为废铁；相比之下，NVIDIA 的可编程 GPU 集群只需更新软件 kernel
              即可从容应对。
            calloutType: risk
            claimRefs:
              - CP003
              - CP007
              - CP008
