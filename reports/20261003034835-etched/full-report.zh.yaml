          value: $18B
        - label: Etched 初始已预订承诺（SOM 管线）
          value: $1B+
        - label: Jane Street 首套机柜部署（已验证 SOM）
          value: $20M
    approximationNotes: 全球 AI 支出引用二级公开文件中引述的 Gartner 预测；加速硬件与推理细分市场取自行业研究区间的中位值；Etched 管线数据采用公司披露的客户预订量。
    claimRefs:
