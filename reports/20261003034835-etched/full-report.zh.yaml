      - number: '1.2'
        title: 融资历程、估值演进与股东治理
        blocks:
          - type: paragraph
            body: >-
              Etched 的资本化历程折射出生成式 AI 基础设施投资周期下的狂飙突进。公司于 2023 年完成约 $5.4M 种子轮融资；2024 年 6 月拿下 Primary Venture Partners 与
              Positive Sum Ventures 联合领投的 $120M A 轮；2025 年 12 月完成 Stripes 领投的 $500M 融资，投后估值达 $5.0B。2026 年 7 月，Etched 完成
              Sequoia Capital 领投的 $300M C 轮融资，估值达 $10.3B，风险投资股权融资总额推至约 $800M。产业协同方面，TSMC 旗下的 VentureTech Alliance、存储巨头
              SK Hynix，以及 Jane Street、Hudson River Trading、Jump Trading、Two Sigma
              等量化做市机构均入股持股，深度绑定半导体供应链与核心算法买方。此后的老股交易信号及 2026 年 9 月未经证实的私募消息称，公司按 $1.7B 自述累计融资额计算的估值已达 $21B；但超过 $10.3B
              的交易条款、清算优先权以及正式机构确认，目前仍属未经核实的私募预估。
