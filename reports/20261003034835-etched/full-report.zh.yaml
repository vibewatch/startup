      - number: '3.2'
        title: 架构权衡、存储层级与工作负载覆盖度
        blocks:
          - type: paragraph
            body: >-
              评估推理加速芯片，关键在于分析内存带宽、batching 行为及工作负载兼容性，而非单纯比拼理论峰值算力。自回归语言模型解码需要不断从内存提取键值（KV）缓存，因而极度受制于内存带宽瓶颈。NVIDIA GPU
              依托高带宽内存（如 H100 SXM5 上带宽达 3.35 TB/s 的 80GB HBM3，或 Blackwell 上的更大容量 HBM3E），配合 FlashAttention、PagedAttention
              等深度优化的 CUDA 算子破解这一难题。Groq 3 LPU 则完全绕开外部 DRAM，每颗芯片内置 500 MB 超高速片上 SRAM 跑出 150 TB/s
              带宽，但在承载百亿级以上大参数模型时遭遇严峻容量瓶颈。Etched 采取折中物理内存路线，为每颗 Sohu 芯片配备 144GB HBM3E（带宽约达 H100 SXM5 的
              1.8x），同时以硬连线注意力逻辑替换可编程矩阵乘法核心。这使得芯片在 batch size 为 1 时跑出极高解码速度，却也彻底丧失运行非 transformer 算子的能力。尤为关键的是，DeepSeek
              V4、Qwen3-235B-A22B 等当代前沿模型高度依赖稀疏混合专家（MoE）路由、视觉编码器或状态空间模型（SSM），根本无法在这块僵化的专用芯片上运转。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP007
              - CP008
      - number: '3.3'
        title: 切换成本、护城河壁垒与商业验证门槛
        blocks:
          - type: paragraph
            body: >-
              采纳替代推理硬件面临沉重的切换成本、软件迁移风险以及供应链依赖。NVIDIA 的核心护城河远不止芯片硬件性能，而是经过 18 年沉淀、由 CUDA、TensorRT-LLM、vLLM、Triton
              及数千个预优化算法库构筑的软件生态，早已深度扎根于生产服务基础设施。若用 Sohu 替代 NVIDIA 集群，云服务商必须推翻现有的编排链路，改用 Etched 的自研编译器与服务工具。此外，Groq 拥有
              NVIDIA 背景支持与数据中心协同，Tenstorrent 则提供开源 TT-Metal 工具链，而 Etched 依然是一家依赖封闭自研软件与 TSMC 4nm 产能配给的早期初创企业。尽管 Etched 在
              2026 年 6 月结束潜行状态后，披露斩获超 $1B 签约客户合同并向核心出资方 Jane Street
              交付了首个机架，但量产规模下的商业验证尚未得到证实。在缺乏第三方审计跑分与公开价目表的情况下，企业买家在总体拥有成本（TCO）与硬件淘汰周期上面临巨大的商业不确定性。
