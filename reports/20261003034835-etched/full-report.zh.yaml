  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与概念厘清
        blocks:
          - type: paragraph
            body: >-
              Etched 角逐专用于人工智能的半导体加速芯片市场，专门主攻大语言生成式模型的数据中心推理执行层。测算 Etched
              的商业空间前，必须将该高性能计算领域与浅层关键词搜索中出现的无关行业明确剥离，如酸蚀建筑玻璃或工业核孔膜过滤等。其真实目标市场严格限定在企业与超大规模数据中心采购专用 AI 加速芯片、定制 ASIC
              以及集成机架级推理集群的支出。在这一边界内，AI 算力支出主要划分为模型训练（由 Nvidia 与 AMD 的通用 GPU 集群主导）和模型推理（生产环境下已训练模型的上线服务）。Etched 的 Sohu
              产品线主动放弃训练环节，全盘押注 prefill（提示词预填充）与 decode（自回归解码）阶段的低延迟、高吞吐 transformer 推理优化。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
