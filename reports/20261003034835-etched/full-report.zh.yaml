        - 商业化爬坡、架构、制造及融资条款均可能削弱投资回报。
      - - 估值立场
        - 偏贵 / 缺乏公开运营数据支撑
        - 据报道的 $21B 估值缺乏公开收入或毛利率分母支撑。
      - - 目标回报与持有期
        - 公开证据无法支撑
        - 仅在明确入场价格、优先清偿权、稀释比例、收入、利润率及退出假设后，方可进行模型测算。
    notes: 评估依据据报道的融资估值与公开运营披露；未公开的私募条款与财务指标均列为尽调缺口，不作预估。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV011
      - CV016
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 证据信号
      - 何种情况会改变观点
    rows:
      - - 投资逻辑
        - 芯片流片成功并落地执行
        - A0 芯片已从 TSMC N4P 工艺回片，并进入客户验证阶段。
        - 独立的机柜级性能、可靠性与良率数据将强化这一论点。
      - - 投资逻辑
        - 商业拉动
        - 公司披露已签订超过 $1B 合同，并向 Jane Street 交付首个机柜。
        - 持续复购交付、已确认收入与客户背书将把需求转化为实质证明。
      - - 反向逻辑
        - 估值跑在了披露前面
        - 据报道其估值在约一个月内从 $10.3B 飙升至 $21B，但缺乏公开收入或毛利率数据。
        - 经审计的收入、毛利率、订单转化及资金使用数据方能支撑该估值。
      - - 反向逻辑
        - 架构与产能爬坡集中度风险
        - 独立评估指出其缺乏基准测试、量产证明有限，且在模型架构转变时面临重新设计风险。
        - 广泛的工作负载支持、独立基准测试以及持续的规模化出货将降低该风险。
    notes: 公司口径的需求与验证声明与独立报道明确区分；已签合同不直接计为收入。
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行情景触发因素
    rows:
      - - 乐观
        - 首批机柜交付后顺利放量；合同转化为收入；独立的经济性指标验证了产品价值。
        - 唯有在收入增长、利润率、稀释比例及退出倍数得到证据支持后，溢价方具合理性；目前尚无公开区间可支撑。
        - 客户复购、已确认收入、良率稳定以及第三方基准测试。
        - 客户验收未通过或产能爬坡受阻。
      - - 基准
        - 芯片保持可运行状态且客户兴趣持续，但收入转化、利润率及爬坡节奏依然未公开披露。
        - 最新的私募估值无法独立计入投资判断；需等待一手运营指标或显著更优的条款。
        - 出现追加交付，但财务披露依然不完整。
        - 估值维持高位，而商业化证据推进缓慢。
      - - 悲观
        - 合同未能转化、生产交付拖延、性能声称不及预期，或模型架构转移导致芯片被迫重新设计。
        - 估值大幅回调完全可能，因据报道的估值在缺乏公开运营证据前便预支了成功预期；目前无法证明任何明确的估值底部。
        - 未见复购交付、缺乏独立基准测试，或以更差条款重启融资。
        - 错失验收里程碑、产能爬坡极度消耗现金，或芯片被迫重新设计。
    notes: 情景标签均为定性描述。因缺失公开收入、利润率、资金需求、优先清偿权及完全稀释后持股比例，故有意不提供数值化概率、估值区间及目标回报。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: Etched 公司发展与芯片研发时间线
    type: timeline
    summary: 2022 年至 2026 年底公司成立、融资轮次、芯片工程里程碑及商业化扩展事件的时间序列。
    data:
      items:
        - date: 2022-09
          label: 公司成立
          detail: 哈佛辍学生 Gavin Uberti、Chris Zhu 与 Robert Wachen 创立 Etched，专注研发专用 Transformer 芯片。
          tone: positive
        - date: 2023-03
          label: 种子轮融资
          detail: 完成由 Primary Venture Partners 领投的约 $5.4M 种子轮融资；团队迁往硅谷。
          tone: positive
        - date: 2024-06
          label: Series A 轮融资与 Sohu 架构公布
          detail: 完成由 Primary Venture Partners 与 Positive Sum 联合领投的 $120M Series A 轮融资；公开推出专用 Transformer ASIC Sohu。
          tone: positive
        - date: 2025-12
          label: 估值 $5B 的 Series B 轮融资
          detail: 完成由 Stripes 领投的 $500M Series B 轮融资，投后估值 $5.0B，进一步扩大晶圆代工合作。
          tone: positive
        - date: 2026-03
          label: 独立技术审视
          detail: 行业分析指出其 500k tok/s 基准测试未经证实，且缺乏第三方 MLPerf 测试数据。
          tone: warning
        - date: 2026-06
          label: A0 芯片流片与 $1B 预订
          detail: 宣布基于 TSMC N4P 工艺的可运行 A0 芯片顺利回片，累计融资达 $800M，已签订逾 $1B 客户合同。
          tone: positive
        - date: 2026-07
          label: 估值 $10.3B 的 Series C 轮融资
          detail: 完成由 Sequoia Capital 领投的 $300M Series C 轮融资，估值达 $10.3B，工程师团队超过 400 人。
          tone: positive
        - date: 2026-07
          label: 确认未参与 MLPerf
          detail: 独立审查证实其未列入 MLPerf Inference v5.1 和 v6.0 名单，凸显第三方验证缺口。
          tone: negative
    approximationNotes: 所有日期均对应官方公开公告或经核实的报道。未公开披露的中期融资计入已报道的累计总额中。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO006
      - CO007
      - CO009
      - CO010
      - CO011
      - CO014
  - id: FM001
    title: 专用 AI 推理硬件的目标市场规模金字塔
    type: pyramid
    summary: 市场规模拆解展示了从全球 AI 宏观支出逐层收窄至 Etched 可服务的 Transformer ASIC 细分市场的过程。
    data:
      items:
        - label: 全球 AI 支出（宏观 TAM）
          value: $2,520B
        - label: 数据中心 AI 硬件加速
          value: $135B
        - label: 数据中心推理工作负载细分
          value: $55B
