  - id: FU001
    title: 客户商业化与部署历程
    type: journey-map
    summary: 涵盖从最初架构评估到批量机柜生产及集群扩容的客户历程各阶段。
    data:
      items:
        - label: 1. 架构评估
          touchpoints:
            - Developer Cloud 演练场测试
            - 模型计算图与编译器兼容性检查
            - 对比 Nvidia GPU 的 TCO 与吞吐量模拟
        - label: 2. 技术验证与试点
          touchpoints:
            - 圣何塞 NPI 实验室的闭门硬件演示
            - 交付首套客户测试机柜（Jane Street）
            - 自建数据中心调测与精度审计
        - label: 3. 商业合同签订
          touchpoints:
            - 谈判数百万美元机柜采购条款
            - 签订附带条件的远期承诺合同（管线规模逾 $1B）
            - 电力、散热及基础设施接入规划
        - label: 4. 规模化集群部署
          touchpoints:
            - 台湾工厂与 Milpitas SMT 产线产能爬坡
            - 整集群安装与液冷连接
            - 支持 DeepSeek、Qwen 与 Llama 的生产级模型推理服务
        - label: 5. 集群扩容与复购
          touchpoints:
            - 面向企业级 AI Agent 工作负载的多机柜横向扩展
            - 借助 Cluster Scale Memory 优化长上下文 KV-Cache
            - 向吉瓦级数据中心基础设施拓展
        - label: 6. 持续服务与优化
          touchpoints:
            - 针对新模型架构的固件与运行时软件更新
            - 硬件健康监测与遥测集成
            - 专属工程支持与质保生命周期管理
    approximationNotes: 历程图概括了将潜在推理芯片买家转化为持续复购机柜客户所需的六个循序推进阶段。
