chapter:
  number: 3
  title: "Competitors"
  summary: "Etched's Sohu ASIC targets large-scale transformer inference by hard-coding attention mechanisms into silicon, challenging NVIDIA's 70% to 95% market dominance, Groq's dataflow LPUs, and hyperscaler-designed custom chips like AWS Trainium and Google TPUs. While Etched claims order-of-magnitude throughput gains and has signed over $1 billion in customer commitments, its complete lack of hardware programmability exposes buyers to severe architecture-lock-in risk across emerging mixture-of-experts and multimodal models."
sections:
  - id: "competitive-landscape"
    title: "Inference Accelerator Landscape and Incumbent Dynamics"
    body: "The AI accelerator landscape is overwhelmingly dominated by NVIDIA, which commands an estimated 70% to 95% market share across training and inference workloads. Hyperscalers and enterprise model operators remain heavily dependent on NVIDIA GPUs, including the H100, B200, and upcoming B300 lines, due to their broad programmability, pervasive software tooling, and mature CUDA library support. In response to high procurement costs and extreme power requirements, hardware alternatives have emerged across three distinct tiers: general-purpose GPU incumbents such as NVIDIA and AMD; architecture-specialized startup processors including the Groq 3 LPU, Cerebras WSE-3, and SambaNova SN40L; and in-house hyperscaler ASICs including Google TPUs, AWS Trainium/Inferentia, and Meta MTIA. Etched positions its Sohu chip as an extreme application-specific integrated circuit (ASIC) that entirely eliminates general-purpose compute units to execute transformer attention directly in static silicon circuits. However, unlike Groq's programmable SRAM dataflow architecture or NVIDIA's flexible CUDA pipeline, Sohu lacks any programmability layer, creating an acute trade-off between claimed raw decode throughput and operational versatility."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "architectural-comparisons"
    title: "Architectural Trade-Offs, Memory Hierarchies, and Workload Coverage"
    body: "Evaluating inference accelerators requires analyzing memory bandwidth, batching behavior, and workload compatibility rather than peak theoretical arithmetic capabilities. Autoregressive language model decoding is heavily memory-bandwidth bound due to continuous key-value (KV) cache retrieval from memory. NVIDIA GPUs tackle this bottleneck using High Bandwidth Memory (such as 80GB HBM3 on H100 SXM5 delivering 3.35 TB/s, or expanded HBM3E on Blackwell) paired with optimized CUDA kernels like FlashAttention and PagedAttention. The Groq 3 LPU bypasses external DRAM entirely by embedding 500 MB of ultra-fast on-chip SRAM per chip to achieve 150 TB/s bandwidth, but suffers from severe capacity constraints when serving multi-billion-parameter models. Etched adopts an intermediate physical memory strategy, outfitting Sohu with 144GB of HBM3E per chip (roughly 1.8x H100 SXM5 bandwidth) while replacing programmable matrix multiplication cores with hardwired attention logic. This enables high decode speed at batch size 1, but prevents Sohu from executing non-transformer operations. Crucially, contemporary frontier models such as DeepSeek V4 and Qwen3-235B-A22B rely on sparse mixture-of-experts (MoE) routing, vision encoders, or state-space models (SSMs) that cannot execute on rigid transformer-only silicon."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
    tableRefs:
      - "TP002"
  - id: "switching-costs-and-durability"
    title: "Switching Costs, Moat Durability, and Commercial Validation Barriers"
    body: "Adopting alternative inference hardware involves substantial switching costs, software migration risks, and supply-chain dependencies. NVIDIA's primary competitive moat is not merely chip performance, but an eighteen-year software ecosystem comprising CUDA, TensorRT-LLM, vLLM, Triton, and thousands of pre-optimized libraries deeply embedded in production serving infrastructures. Replacing an NVIDIA cluster with Sohu requires cloud operators to abandon existing orchestration pipelines and adopt Etched's proprietary compiler and serving tools. Furthermore, while Groq operates with NVIDIA backing and data-center integrations, and Tenstorrent provides open-source TT-Metal tooling, Etched remains an early-stage startup dependent on proprietary software and TSMC 4nm foundry allocations. Although Etched reported over $1 billion in signed customer contracts and initial rack deployment with anchor backer Jane Street following its June 2026 stealth emergence, commercial validation at production scale remains unproven. Without third-party audited benchmarks or published pricing schedules, enterprise buyers face significant economic uncertainty regarding total cost of ownership and hardware obsolescence."
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
      - "CP016"
