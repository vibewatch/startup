callouts:
  - calloutType: "risk"
    title: "The Architectural Trap: Specialization vs. Frontier Model Evolution"
    body: "Etched's competitive position hinges entirely on the architectural longevity of pure dense transformers. By burning attention mechanisms into physical silicon circuits, Sohu delivers unprecedented claimed decode throughput for dense transformer language models. However, the AI frontier in 2026 is rapidly pivoting toward sparse mixture-of-experts (MoE) architectures like DeepSeek V4 and Qwen3, state-space models (Mamba), and integrated diffusion/multimodal encoders. Because Sohu lacks programmable matrix compute units, any substantial departure from standard dense transformer attention renders the underlying ASIC physically obsolete, whereas NVIDIA's programmable GPU clusters adapt via software kernel updates."
    claimRefs:
      - "CP003"
      - "CP007"
      - "CP008"
