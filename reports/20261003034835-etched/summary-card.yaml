  topStrengths:
    - >-
      Working A0 silicon on TSMC N4P plus a named first customer shows Etched has crossed the hardest proof-of-concept
      hurdle and is at least partially in hardware validation.
    - >-
      Capital access remains exceptional, with a reported $700M Series D and $21B valuation signaling strong investor
      appetite for the transformer-ASIC thesis.
    - >-
      The company still has a coherent product wedge: hardwiring transformer inference into silicon can create a real
      latency and throughput advantage if the workload assumption holds.
  topRisks:
    - >-
      Architectural lock-in is still existential: if frontier workloads shift toward state-space or hybrid models,
      Etched may need a new chip from scratch.
    - >-
      Public evidence still lacks independently verified benchmarks, disclosed revenue, and acceptance data for the
      reported customer contracts.
    - >-
      The $21B valuation leaves very little margin for execution slippage, cap-table dilution, or a down-round if
      delivery timing slips.
    - Manufacturing, HBM supply, and foundry capacity remain concentrated and hard to verify from public evidence.
  unresolvedGaps:
    - >-
      Independent production-silicon benchmarks, reliability results, and repeatable workload data are still not
      publicly disclosed.
    - >-
      Recognized revenue, contract conversion, and unit economics remain undisclosed, so valuation cannot be anchored to
      public operating performance.
    - >-
      Fully diluted capitalization, liquidation preferences, and secondary pricing at the reported $21B level are not
      public.
    - >-
      TSMC capacity, HBM3E allocation, and other manufacturing commitments are not disclosed in enough detail to model
      supply risk precisely.
    - The durability of a transformer-only design if model architecture preferences shift remains unresolved.
