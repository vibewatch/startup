callouts:
  - calloutType: risk
    title: Existential Single-Architecture Bet on Transformer Dominance
    body: >-
      Unlike general-purpose GPUs which can be adapted via software to arbitrary neural network architectures, Etched's Sohu hardwires matrix multiplication and attention patterns directly into silicon. If state-space models (such as Mamba), liquid neural networks, or alternative non-transformer architectures supersede transformers, Sohu cannot pivot, posing a severe architectural obsolescence risk.
    claimRefs:
      - CM003
      - CM008
      - CM009
  - calloutType: insight
    title: Datacenter Power Constraints as a Core Accelerator Driver
    body: >-
      With AI projected to drive a 160% increase in datacenter power consumption by 2030, cloud operators face strict physical power limits. Etched's claims of 10x to 20x throughput-per-watt efficiency gains and the ability for one 8-chip Sohu server to replace up to 160 Nvidia H100 GPUs make power efficiency, rather than pure silicon cost, the primary economic purchase driver.
    claimRefs:
      - CM014
      - CM015
