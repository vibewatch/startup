- id: commerce-payments-and-expansion-layer
  title: Commerce, payments, and expansion layer
  body: |-
    Orders IO and GrubPay are what turn the ERP and AI claims into a full commercial workflow. Orders IO is marketed as the distributor-facing ordering layer, with branded mobile apps, secured customer pricing, chat, onboarding, and ERP integrations. The Spring 2026 release pushed it further toward an account-management tool by adding delivery-rule logic, upsell suggestions, tagging, and automated welcome communications. GrubPay closes the loop on settlement by supporting ACH, card acceptance, pay-by-link, QR code collection, and accounting sync. Its public materials also make the dependency picture unusually visible: payment-online references Moneris, the home page mentions Wells Fargo ISO status and developer tooling, and the POS page is explicitly built around Clover hardware. Outside the core suite, GrubMarket is widening the stack through acquisition. Procurant adds procurement, traceability, and food-safety workflows; Coast Citrus is a distributor deployment vector that now gets access to the software suite. The result is a larger addressable workflow, but also more integration and dependency risk.
