- id: trust-compliance-and-gap-assessment
  title: Trust, compliance, and gap assessment
  body: |-
    Trust and compliance are strongest where GrubMarket inherited or partnered into specialized workflows, and weakest where buyers would expect enterprise-software transparency. GrubPay publicly states PCI DSS Level 1 plus KYC and AML checks, which is more concrete than what is available for the rest of the suite. Procurant broadens the compliance story further by adding FSMA 204 traceability, quality control, and large-scale food-safety monitoring. Coast Citrus contributes operational certifications such as PrimusGFS and SMETA, but those attestations belong to the distributor operation, not the SaaS stack. On the software side, the evidence is thinner. The GrubAssist App Store page says the app collects no data, yet offers no accessibility disclosure. Public sources reviewed for this chapter do not surface a status page, uptime SLA, or incident history for the core software surfaces. Adverse sources are concentrated in the consumer marketplace rather than the B2B suite, but they still matter because they point to support and refund friction that could contaminate brand trust if enterprise workflows ever degrade in the same way.
