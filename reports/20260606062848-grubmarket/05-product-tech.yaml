  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: public module inventory
    missingEvidence: A full module-by-module catalog showing hidden admin tools, shared services, and which Farmigo or Procurant capabilities are already integrated into the rest of the suite.
    whyItMatters: The public product lineup is clearly marketing-led, so diligence cannot tell which modules drive revenue, which are internal only, or which acquisitions are still effectively stand-alone.
    diligencePath: Request a management product inventory, module adoption metrics, and an internal architecture map that distinguishes GA modules from acquired point solutions.
    relatedQuestionRefs:
    - QE002
    - QE026
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: public reliability disclosures
    missingEvidence: Public uptime metrics, incident history, named status page URLs, or contractual SLA disclosures for WholesaleWare, Orders IO, AI Orders, and GrubAssist.
    whyItMatters: Enterprise software buyers in food distribution care about uptime, fulfillment continuity, and support response times; without external reliability evidence, the diligence case leans too heavily on vendor claims.
    diligencePath: Request the last 12 months of uptime, incident postmortems, support SLA commitments, and any public or customer-only status dashboards for each major software surface.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: AI and security governance
    missingEvidence: Security architecture, data-processing agreements, model-hosting details, access-control design, and any SOC 2 or similar assurance package for GrubAssist, AI Orders, and Orders IO.
    whyItMatters: The suite now spans operational data, order automation, and payments-adjacent workflows, so AI governance and security controls are critical to underwriting enterprise adoption and regulatory resilience.
    diligencePath: Request the security packet, privacy addendum, AI governance memo, vendor list, and penetration-test or audit summaries covering the full software suite.
    relatedQuestionRefs:
    - QE015
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: cross-product integration depth
    missingEvidence: Clear public evidence showing shared identity, data model, reporting, and workflow handoffs across Farmigo, Procurant, GrubPay, Orders IO, and WholesaleWare.
    whyItMatters: Bundle breadth is the core moat claim, but investors still need to know whether acquired or adjacent products are tightly integrated or only sold side by side.
    diligencePath: Ask for demo flows and architecture diagrams showing how data moves across products, which modules share auth and billing, and what integrations remain on the roadmap.
    relatedQuestionRefs:
    - QE016
    - QE019
    - QE026
    relatedTableRefs:
    - TE003
    - TE005
