runDate: '2026-06-06'
company:
  name: GrubMarket
chapter:
  number: 5
  title: Product & Technology
  summary: |-
    GrubMarket's product stack is broader than a produce marketplace: public evidence shows a bundled platform spanning wholesale and consumer distribution, WholesaleWare ERP, GrubAssist, AI Orders, Orders IO, GrubPay, Farmigo, and newly acquired Procurant compliance assets. The strongest product signal is workflow breadth and active release cadence rather than disclosed infrastructure depth. The main diligence gaps are public reliability transparency, security assurance for the AI and ERP surfaces, and proof that acquired or adjacent products are already integrated rather than merely co-sold.
sections:
- id: product-surfaces-and-distribution
  title: Product surfaces and distribution workflows
  body: |-
    GrubMarket's product is best understood as a stack of transaction surfaces rather than a single app. The public company pages market one umbrella that spans B2B wholesale buying, consumer grocery delivery, seller storefronts, ERP software, and enterprise AI. That matters because the company is not only selling software to distributors; it is also operating marketplace and delivery flows that create first-party exposure to ordering, pricing, fulfillment, and customer-support workflows. On the legacy GrubMarket surface, consumers can buy GrubBoxes, order produce for home delivery, and shop from local sellers. On the business side, the home page pitches a wholesale network across the U.S. and Canada. Doorganics extends the delivery model into a more curated regional workflow with box selection, swap-and-shop customization, and route-based delivery days by zip code. The product surface therefore starts with commerce and logistics, then hands users into software modules such as Orders IO or AI Orders when the buyer is a distributor rather than a household shopper.
  claimRefs:
  - CE001
  - CE002
  - CE004
  - CE005
  - CE006
  - CE012
