evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      A management-approved capitalization and financing schedule that reconciles 2021 financing and cumulative funding
      totals across trackers.
    whyItMatters: Conflicting public funding totals affect dilution, investor-stack interpretation, and valuation-step-up analysis.
    diligencePath: Request cap table, financing chronology, and round-closing memos from management.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current internal headcount and org-by-function breakdown.
    whyItMatters: Public headcount proxies conflict sharply and affect operating-scale and efficiency interpretation.
    diligencePath: Request current employee count, functional mix, and post-acquisition integration headcount from finance or HR.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited 2025 and latest LTM revenue, gross margin, EBITDA, cash flow, and software-revenue mix.
    whyItMatters: Valuation underwriting is incomplete without quality-of-revenue and profitability evidence.
    diligencePath: Request audited financial statements, latest management accounts, and segment mix disclosure.
    relatedQuestionRefs:
      - QO016
      - QO025
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, investor-rights summary, and disclosure-control documentation.
    whyItMatters: The SEC event raises the bar for governance diligence and control verification.
    diligencePath: Request board deck materials, governance charter documents, and post-settlement remediation summary.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: produce-specific-sam
    missingEvidence: A credible public estimate for produce-specific wholesale software and workflow spend in the U.S.
    whyItMatters: Without it, GrubMarket’s true SAM remains a boundary exercise rather than a hard market number.
    diligencePath: Build SAM from live customers, category mix, software attach rate, and ARPA by workflow.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
      - TM005
  - type: private-evidence-only
    severity: material
    topic: compliance-demand
    missingEvidence: Pipeline data showing how much GrubMarket demand is driven by FSMA 204 or other compliance triggers.
    whyItMatters: >-
      Traceability clearly matters, but public sources do not show how much revenue opportunity it creates for
      GrubMarket specifically.
    diligencePath: Request CRM segmentation of compliance-led deals, product attach rates, and renewal behavior.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
      - TM005
  - type: stale
    severity: material
    topic: produce-market-frequency
    missingEvidence: >-
      A structured current time series for produce-specific wholesale GMV and margin pools tied to GrubMarket’s
      categories.
    whyItMatters: Headline weekly ad activity and trade coverage show volatility but do not quantify durable unit economics.
    diligencePath: Request internal category GMV, gross margin, spoilage, and geographic density by produce segment.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Customer-level ROI evidence for inventory AI, monitoring AI, traceability workflows, and Procurant integration.
    whyItMatters: Market interest in workflow automation does not prove customers will pay enough to justify software-style margins.
