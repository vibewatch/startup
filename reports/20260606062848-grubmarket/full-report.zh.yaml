  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              保留证据支持一个清晰的收入顶层逻辑：GrubMarket 已经不只是数字果蔬转售商。官方页面、Y Combinator 和 Sacra 都把它描述为 B2B 电商、ERP 软件、企业 AI
              和被收购工作流工具的混合体。Sacra 的档案在这里尤其有用，因为它把模式拆成 B2B 电商、B2C 电商和
              SaaS。这一点很重要，因为纯食品分销业务和分销加软件业务不应按同一套逻辑估值。对一家私人公司来说，公开增长叙事也异常大。TechCrunch 和 CNBC 报道称，公司 2024 年收入超过 $2
              billion，2025 年正朝大约 $2.4 billion 前进；Perishable News 则引用管理层称，公司财务底线强劲，模式可持续。

              问题在于，这些仍然是公司关联或管理层被引用的披露，而不是经审计公开报表。它们显示规模和动能，也确实有助于解释为什么市场接受 2025 年 $3.5 billion Series G 估值和 2026 年 $4.5
              billion 投前 Series H。但它们没有告诉投资人：收入中多少是低利润分销，多少是经常性软件，业务内部有多少毛利，增长又有多少来自收购。因此，公开牵引力足以框定机会，但还不足以结案。
