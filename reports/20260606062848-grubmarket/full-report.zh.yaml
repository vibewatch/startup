      - number: '5.2'
        title: ERP、AI 与运营核心
        blocks:
          - type: paragraph
            body: >-
              可观察的软件核心围绕 WholesaleWare 展开。GrubMarket 把它营销为面向批发商、分销商和发货商的垂直 ERP，覆盖库存、仓库、种植者会计、制造、人力资源和总账功能。2026
              年春季发布进一步强化了这个记录系统定位，新增自动工单、新定价控制、FIFO 批次分配、新运营报表，以及连接 Produce Alliance 和 Restaurant365 的
              EDI。围绕这个核心，还有两层任务不同的 AI。AI Orders 处理来自电子邮件、语音信箱和短信的入站订单捕获，并在同步 ERP 前保留人工审核节点。GrubAssist 是对话层：客户证明和 App
              Store 列表把它定位为语音优先助手，用于报表、制图、现金流分析和订购。因此，架构叙事是运营导向，而不是模型导向：GrubMarket 卖的是一个工作流包，从 ERP
              抽取数据，自动化订单录入，并把决策支持暴露给销售、财务和一线人员。
