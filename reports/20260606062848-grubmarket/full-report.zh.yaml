chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与真实运营模式
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 自己的当前页面，把公司定位为美国食品供应链行业的 AI 驱动技术赋能者和数字化改造者，而不是狭义的在线杂货卖家。公开运营栈横跨 B2B 电商、面向批发商和分销商的 ERP 与企业 AI
              工具、办公室和家庭配送，以及可持续发展项目。这个定位很关键，因为投资逻辑建立在 GrubMarket
              既是分销运营商、又是软件层之上：它的价值主张不只是搬运果蔬，而是把采购、库存、会计、仓库工作流和订单捕获这些分散的食品供应链环节数字化。


              公开身份标记大体一致，哪怕规模代理指标彼此打架。GrubMarket 称自己创立于 2014 年，总部在 San Francisco，服务美国和加拿大食品供应链，现在业务覆盖美国 50 个州和 70 多个国家。Y
              Combinator 档案把公司归入 Winter 2015 批次，并描述创始人 Mike Xu 自筹资金、从车库起步的经历，这与长期的创始人主导叙事相符。Sacra 和 Tracxn
              也都强化了混合模式：公司围绕 B2B 食品商业和软件搭建，而不是只做栈的一边。
