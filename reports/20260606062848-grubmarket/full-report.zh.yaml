  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 GrubMarket 实际卖进的市场
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 的合理市场边界是多层的。最宽口径上，USDA ERS 显示美国食品总支出在 2025 年达到 $2.51 trillion，其中居家食品支出 $1.10 trillion，外出食品支出
              $1.41 trillion。这个外框有用，因为 GrubMarket 触达的是食品流动，而不只是某一种零售形态。但若把它直接称为现实可服务市场，就太宽了，因为 GrubMarket
              并不会捕获全部美国食品消费。公司更直接绑定的是商贸批发、新鲜和易腐品分销，以及食品供应工作流的数字化。


              公开行业定义支持这种更窄的框定。IBISWorld 把杂货批发商定义为食品生产商和零售商之间的中间商，覆盖干货杂货、易腐食品和杂货店里的非食品品类；BLS 则把杂货及相关产品批发商放在 NAICS 4244
              下的非耐用品商贸批发商之中。GrubMarket 自身模式超过这个核心，因为它还销售软件、AI
              和合规导向工作流，但批发层仍是约束总可用市场（TAM）时最好的公开起点。结论是，广义食品支出应作为上限背景镜头；杂货批发及相关工作流数字化，才是尽调中更可执行的可服务市场（SAM）镜头。
