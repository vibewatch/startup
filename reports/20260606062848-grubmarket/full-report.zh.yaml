      - number: '3.3'
        title: 切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              护城河问题在这里变得更微妙。GrubMarket 若能把供应、订购、ERP 和被收购软件打包成一个运营层，确实似乎有真实优势。这是对 Procurant
              收购、公司官网软件定位以及合作伙伴档案最强的解释。但同一公开记录也说明，护城河不能被夸大。食品分销在结构上竞争激烈，上市分销商反复描述低利润率和价格压力，多个替代方案也允许买家拆开这套栈。客户可以从综合分销商采购产品，用
              Pepper 做数字订购或收款，用 ProducePay 或 FBN 做融资或采购透明度，同时仍然避免绑定到一个垂直整合网络。

              因此，切换成本大概率是中等，而不是绝对。当 GrubMarket 拥有围绕采购、库存、合规和供应商协同的运营工作流与数据模型时，切换成本会上升。当买家只把 GrubMarket
              看作另一条拿到批发产品的路径时，切换成本会下降。关键尽调测试不是「GrubMarket 有没有竞争对手？」——显然有——而是「相较于拼装单点最佳替代方案，GrubMarket
              的集成工作流有多常能实质降低人工、错误、损耗或采购摩擦，并因此赢单？」公开来源没有直接回答这一点，所以护城河耐久性应被视为有可能成立，但尚未完全证明。
