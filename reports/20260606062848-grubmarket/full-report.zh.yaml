      - number: '3.2'
        title: 能力、定价与分销对比
        blocks:
          - type: paragraph
            body: >-
              从能力宽度看，综合型既有巨头仍是全国性实体分销的参照点。Sysco、US Foods、UNFI 和 PFG 都描述了庞大的客户基础、宽泛的产品组合和有意义的配送覆盖。GrubMarket
              的公开差异化在别处：软件、AI，以及通过收购进入相邻工作流。保留来源支持这个区分。GrubMarket 推广 ERP 和企业 AI 工具；Procurant 增加合规、可追溯和采购工作流；Pepper
              攻击分销商后台效率；Instacart 除了市场业务，还搭起面向零售商的企业栈。换句话说，市场正在走向分销加软件的打包形态，而不是物流公司和软件供应商之间的清晰分割。

              定价证据远比能力叙事薄。Instacart Business 是最清晰的公开异类，因为它宣传无合同访问、无最低门槛、配送费规则和企业账单选项。FBN Direct
              也因明确推广透明标价而突出。相对而言，GrubMarket、综合分销商、ProducePay 和 Pepper
              大多把买家导向创建账户、演示、协商条款或关系型报价。这种不透明很重要，因为它让精确的正面价格竞争很难用公开证据验证，也降低了任何「比既有巨头更便宜」简单叙事的可信度。更稳妥的结论是，GrubMarket
              的竞争切口是更宽的工作流所有权，而不是公开证明的价格领先。
