        blocks:
          - type: paragraph
            body: >-
              做情景分析比假装轮次价格自动有效更诚实。悲观情景下，GrubMarket 开始像一家背着治理包袱的分销商：如果真实收入质量更接近管理层主张的低端，公开市场又拒绝给软件溢价，价值可能压缩至约 $1.6
              billion 到 $2.6 billion。基准情景下，投资者接受报告规模，但仍要求治理和整合折价，得到约 $3.4 billion 到 $4.5
              billion。乐观情景下，软件附加率、收购网络变现和干净的内控故事把业务推近 Instacart 式溢价，支撑约 $5.7 billion 到 $7.3 billion。这使当前 $4.5 billion
              投前估值更接近基准情景上沿，而不是明确便宜区间。最佳判断是跟踪：价格并非显然非理性，但在已审计披露完全跟上之前，它要求外部投资者先相信管理层主导的收入和 EBITDA 主张。
