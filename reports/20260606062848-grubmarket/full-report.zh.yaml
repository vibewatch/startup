      - number: '4.3'
        title: 资本充足性与融资背景
        blocks:
          - type: paragraph
            body: >-
              当前融资背景比困境融资读法更好，但透明度不足以排除资本充足性问题。公司 2025 年和 2026 年公告都把新钱描述为
              AI、收购、基础设施和全球扩张的加速资本。这符合一家公司从被认为强势的位置融资，而不是填补明显流动性漏洞的模式。Form D 历史也显示，GrubMarket 多次使用规模不小的豁免私募发行；尤其是 2022 年
              Form D，指向的融资画布比最近几轮标题数字更大。

              即便如此，公开资本栈重建仍然混乱。追踪来源对累计融资的口径相差数亿美元，保留公开来源也没有提供当前现金、月度烧钱速度、债务余额、契约条款或现金跑道。这个缺口比平时更重要，因为管理层一边宣称自我可持续盈利，一边继续为收购和软件扩张融资。没有经审计的现金和杠杆数据，公开证据最多只能说明
              GrubMarket 可能比早期创业公司有更好的融资渠道；在把公司视为明确自我供血之前，投资人仍需要直接尽调流动性。
