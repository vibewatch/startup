companyProfile:
  summary: >-
    GrubMarket 是一家总部位于 San Francisco 的食品流通和供应链软件公司，由 Mike Xu 于 2014 年创立。公司把果蔬和食品分销、以收购搭起的区域批发商网络，以及不断扩大的软件套件放在一起；软件包括
    WholesaleWare ERP、GrubAssist、Orders IO、GrubPay、Farmigo，以及新收购的 Procurant 合规和交易工作流。公开融资证据显示，公司 2025 年 3 月 Series G
    后估值超过 $3.5 billion，2026 年 2 月 Series H 的投前估值为 $4.5 billion；公开收入说法则指向 2024 年 $2.0 billion 收入、2025 年 $2.4 billion
    轨迹，并称 EBITDA 盈利。核心争议不是 GrubMarket 是否已经做出可观规模，而是当前经审计披露、整合纪律和 SEC 事件后的内控质量，是否足以支撑这个估值。
