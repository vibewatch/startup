  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与买家画像
        blocks:
          - type: paragraph
            body: >
              GrubMarket 的公开材料描述的是真正多边的客户群，而不是单一市场买家。需求侧，公司称其批发网络在美国和加拿大向杂货零售商、餐饮服务运营商、学校、政府买家、本地市场和餐厅销售。供应和软件侧，官方材料把
              WholesaleWare、Orders IO、AI Orders、GrubAssist 和 GrubPay 定位给批发商、分销商、发货商、经纪商和餐饮服务分销商；Farmigo 则面向直接向会员销售的 CSA
              农场、牧群份额项目和食品中心。更早的 GrubMarket 市场表面和区域性 Doorganics 店面显示，面向消费者的配送渠道仍与 B2B 软件动作并存。

              这种分层很重要，因为它说明 GrubMarket
              可以同时在食品供应链的多个层面变现：种植者管理、分销商运营、买家订购和下游支付。公开买家和用户画像反复围绕果蔬运营商、批发销售团队、路线和库存经理，以及需要订单准确性和客户专属定价的杂货或餐厅买家。仍然缺失的是经济分层。公开材料没有拆出软件、被收购分销子公司、直接批发商业或消费者配送各自贡献了多少收入、毛利或客户数。
