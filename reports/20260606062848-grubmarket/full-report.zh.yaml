      - number: '1.3'
        title: 融资历史、估值上台阶与公开规模标记
        blocks:
          - type: paragraph
            body: >-
              公开融资报道显示，这家公司在保持私有且只部分透明的同时，估值多次向上重定价。GrubMarket 自己 2022 年公告称，公司以超过 $2 billion 的估值融资 $120 million。随后
              TechCrunch 和 CNBC 报道，2025 年 3 月 Series G 融资 $50 million，估值超过 $3.5 billion。公司 2026 年 2 月 Series H
              公告又称进一步融资大约 $50 million，投前估值 $4.5 billion。这些都是短期内实质性的估值上台阶，也支持一种判断：投资人把 GrubMarket
              视为少数仍能在私人市场拿到高热度的大型食品供应链平台之一。


              问题在于，公开运营和资本结构标记仍很嘈杂。Sacra 估计 2023 年收入为 $2.0 billion，并描述客户覆盖 500 家杂货店、8,000 家餐厅和 2,000 个企业办公室。与此同时，Tracxn
              列出的累计融资为 $908 million，而 Sacra 报告的大约是 $569.95 million。Y Combinator 显示团队规模 4,548 人，LeadIQ
              则给出一个小得多且内部不一致的员工代理指标。这些差异不会抹掉清晰的估值上行趋势，但意味着投资人仍需要管理层级材料，来对齐融资总额、员工数和当前收入质量，然后才能把公开叙事当成可完全下注的事实。
