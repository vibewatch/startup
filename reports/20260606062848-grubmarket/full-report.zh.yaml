      - number: '7.2'
        title: 并购整合、服务和一线运营带来二阶风险
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 的并购节奏在战略上说得通，运营上却危险。公司同时买实体分销商和工作流软件：TechCrunch 称 Good Eggs 在估值严重坍塌后被收购；PR Newswire 描述
              Schoenmann Produce 带来以冷链为重心的 Houston 布局；GrubMarket/O'Melveny/The Packer 则称 Procurant
              带来采购、追溯、合规和食品安全工作流，服务广泛的零售供应商网络。组合会迅速扩大触达面，也迫使 GrubMarket 同时整合设施、冷库、车队运营、软件产品、供应商数据、客户上线和合规逻辑。


              公开运营噪音支持把它当作真实风险，而不是抽象复杂度。BBB 的投诉记录显示近期存在配送、退款和营销处理争议；OSHARecord 使用 Department of Labor 数据，报告两次检查发现 14
              项违规，其中一项为严重违规。GrubMarket
              自己的招聘页也显示，公司仍在招聘工程、软件销售、仓库打包、客服和营销岗位。这些信号不能证明系统性失灵，但说明管理层正在同时扩张多个高度依赖控制的职能。在食品分销业务里，小流程缝隙比纯软件更快外溢成服务摩擦、安全事故或合规漏项。
