      - number: '2.3'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场里的买家和用户角色很分散。独立杂货店和区域连锁关心货品可得性、价格和货架新鲜度。批发商和分销商关心库存、仓库吞吐、利润率管理、应收账款和合规。新鲜果蔬发货商和种植者关心在满足可追溯义务的同时，快速周转易腐库存。餐饮服务和机构买家仍然是下游需求信号，即便
              GrubMarket 在那些时点并不直接卖给终端消费者。也就是说，预算所有权可能落在运营、财务、采购、品类管理或合规手里，而不是一个集中式 CIO 买家。

              公开购物者数据解释了为什么采用路径仍是混合型，而不是完全数字化。FMI 报告称，54% 的杂货购物者总是在主店进行店内购物，69% 希望近距离查看果蔬，48%
              表示如果无法再亲自购物，最怀念的会是商品选择。与此同时，77% 的购物者在购物前已有数字互动，71% 在购物过程中也有数字互动。对 GrubMarket
              这类平台来说，市场采用不是用纯软件替代实体易腐品流。真正要改进的是上游采购、库存、数据和可追溯工作流，而这个市场仍高度依赖实物检查和本地运营执行。
