      - number: '6.4'
        title: 留存、重复使用与耐久性缺口
        blocks:
          - type: paragraph
            body: >
              公开耐久性证据明显弱于公开部署广度。Farmigo 把续订流程和会员留存队列视图作为软件功能推广，说明重复使用工作流对客户重要；但 GrubMarket
              没有为更广业务发布净留存率（NRR）、总留存率（GRR）、续约率、合同期限或队列留存。独立评论覆盖也很浅。旧有 GrubMarket iOS 应用在 12 个评分中为 3.0 / 5，JustUseApp
              将该应用概括为 3.0 / 5 且情绪分布严重负面；GrubAssist 评分太少，无法显示概览。SourceForge 列出 WholesaleWare 支持移动端和 API，但没有评分；Software
              Advice 评论页被安全验证挡住。

              BBB 投诉数据偏负面但噪音大。它显示过去三年有 4 起投诉，大多与配送有关，其中至少一起涉及 Southern California 市场停摆和退款摩擦。但同一页面还包含多起似乎把 GrubMarket 和
              Grubhub 混淆的投诉，这削弱了该渠道的信号质量。净结果不是证明系统性流失；它证明公开第三方耐久性证据远远落后于公司自己对客户广度的叙述。
