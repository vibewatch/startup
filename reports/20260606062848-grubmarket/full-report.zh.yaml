      - number: '2.2'
        title: 规模测算：从食品总支出下探到商贸批发现实
        blocks:
          - type: paragraph
            body: >-
              需要多个公开镜头，因为没有单一来源会发布「GrubMarket 总可用市场（TAM）」。USDA ERS 给出最宽的支出口径：2025 年美国食品总支出 $2.51 trillion，其中居家食品支出 $1.10
              trillion。ERS 还显示，2024 年典型消费者食品美元里，批发和零售贸易合计拿走 20.1 美分，批发单独拿走 6.3
              美分。这些数据有用，因为它们说明分销经济性在更大食品系统里的位置。IBISWorld 则给出最接近的直接行业镜头，估计 2026 年美国杂货批发规模为 $326.2 billion，包含 5,896
              家企业，过去五年保持增长。


              这些镜头不能相加。它们描述的是嵌套或重叠边界，而不是一组彼此独立收入堆出的单一栈。实际解释是：广义食品经济巨大，但最像 GrubMarket
              核心交易和履约活动的商贸批发细分市场小得多，也更适合投资判断。在此之上，FMI 的数字互动研究说明，商业触点仍在变化：店内杂货购物今天仍占主导，但线上杂货预计到 2028 年会显著增长。这支持把
              GrubMarket 看作一家公司，既骑在现有批发基础设施上，也受益于更长的数字化曲线，而不是一个纯软件总可用市场（TAM）。
