      - number: '2.4'
        title: 增长驱动、采用约束与未解决的规模缺口
        blocks:
          - type: paragraph
            body: >-
              最强的公开需求驱动来自全渠道杂货增长、易腐品运营周边软件需求，以及监管可追溯压力。FMI 和 NIQ 预计，到 2028 年，线上杂货相关销售将达到 $452 billion，占杂货相关销售的
              25.5%，即便门店今天仍是主渠道。GrubMarket 自己的 AI 智能体发布和 Procurant 收购，与这条轨迹相符：市场越来越奖励能把商业、ERP、库存、合规和分析统一起来的分销商与批发商。FDA 的
              FSMA 204 规则也把方向进一步压实，要求在发货、收货、加工转换和其他关键追踪事件中，更结构化地采集数据并保证记录可得。

              但这个市场并不顺滑。果蔬和易腐品类在运营上仍然混乱，买家信任仍取决于实物挑选，正在准备 FSMA 204
              的公司也持续把数据和流程复杂性描述为真实负担。公开来源在一个关键点上仍然薄弱：杂货批发支出中，究竟有多少能被分销加软件的平台现实触达，并没有一个干净且广泛可信的公开数字。这个未解决缺口并不否定市场；它只是说明，GrubMarket
              的真实可服务市场（SAM）和软件附着率仍需要自下而上的客户与利润率工作，而不是一个自上而下的标题数字。
