  - id: TU006
    title: 扩张与集中风险表
    columns:
      - 驱动因素 / 风险
      - 证据
      - 影响
      - 尽调路径
    rows:
      - - 向 Procurant 客户交叉销售
        - GrubMarket 明确称 Procurant 客户可连接 WholesaleWare、GrubAssist、Orders IO 和 GrubPay；The Packer 描述了双向交叉销售机会
        - 收购来的庞大软件客群可成为主要扩张渠道
        - 要求按产品提供交割后附加销售率、迁移账户数和向上销售管线
      - - 分销商网络迁移
        - Coast Citrus 和 Time100 的报道显示，被收购分销商可转入现代电商和 WholesaleWare 工作流
        - 扩张可通过自有运营子公司发生，不只依靠绿地销售
        - 要求提供已完成迁移的被收购子公司名单，以及其余公司的时间表
      - - 存量客户功能向上销售
        - 2026 年春季版本为新的和现有餐厅、餐饮服务、农产品批发客户增加功能
        - 支撑现有客户内的持续收入扩张
        - 要求提供 2025-2026 年版本带来的模块附加销售率和价格提升
      - - App / 工作流渠道依赖
        - Orders IO、AI Orders、GrubAssist、Farmigo 和 GrubPay 都把 GrubMarket 嵌入下单、分析和 支付工作流
        - 强工作流深度可抬高切换成本，但也把价值集中到软件采用成败上
        - 按软件、支付、运营分销和消费者渠道拆分收入
      - - 零售商集中风险
        - Coast Citrus 和 Procurant 材料反复点名 Walmart、Costco、Sam's Club、Target、Albertsons、Publix 和 Sprouts
        - 即使总集中度未披露，头部大客户敞口也可能不小
        - 要求提供前 10 大客户构成，以及按被收购网络划分的集中度
      - - 消费者服务风险
        - BBB 和 JustUseApp 显示配送、退款、沟通和 App 体验投诉
        - 运营失误会压低消费者或区域渠道的重复使用
        - 要求按地区提供投诉率、退款率和准时配送统计
      - - 独立证明缺口
        - 评价市场覆盖很薄、页面被阻断或没有评分
        - 公司自有内容之外，更难核验满意度和产品市场匹配
        - 提供客户访谈、软件市场评价计划和第三方满意度调查
      - - 渠道组合不透明
        - 公开来源未拆分直接、收购和软件衍生客户收入
        - 妨碍精确研判有机增长质量和集中度
        - 要求提供客户和收入桥，拆分有机赢单、迁移和收购
