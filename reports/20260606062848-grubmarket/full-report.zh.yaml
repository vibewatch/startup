      - number: '1.4'
        title: 里程碑、产品扩张与保留的反向线索
        blocks:
          - type: paragraph
            body: >-
              最近最强的战略模式，是 GrubMarket 把收购和垂直 AI 发布组合起来。2026 年 2 月 Series H 博文明确把新一轮融资与过去一年相连：这一年包括 Delta Fresh Produce 和
              Coast Citrus 收购、Inventory Management AI Agent 与 Reporting AI Agent 发布，以及 Procurant 收购。2026 年 1 月
              Monitoring AI Agent 发布也延续同一条 GrubAssist 叙事，强调跨已连接 ERP 和会计系统的异常检测、库存、应收账款和利润率监控。这个组合说明，GrubMarket
              正试图把护城河从分销规模拓宽到工作流软件和 AI 自动化。


              反向线索并非假设。2025 年 1 月，SEC 称 GrubMarket 向 Series D 投资人提供了不可靠的财务信息，将历史收入夸大约 $550 million，随后以停止令和 $8 million
              民事罚款达成和解。Blue Book Services、PYMNTS、SECLaw 和 Securities Docket 都复述了同一组核心事实。公司后续的治理任命和 AI /
              产品动能可能改善叙事，但无法抹掉这次执法事件。本章应得出的结论是：GrubMarket 的公开故事同时包含真实规模和产品野心，也带着真正的尽调伤痕；投资人在评估内控和披露时，仍应让这道伤痕影响权重。
