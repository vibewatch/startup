      - - 经审计 FY2024-FY2025 财务
        - 经审计损益表、现金流量表和资产负债表，并与管理层收入说法对账
        - 验证当前 1.9x-2.25x 隐含倍数是否锚定在可靠数字上
        - 索取当前经审计财务、审计师信函，以及本轮使用的收入桥接。
      - - 收入组合与利润率
        - 批发、市场平台、软件、AI 和支付的分部组合，以及毛利率披露
        - 判断 GrubMarket 应拿软件溢价，还是只能拿经销商倍数
        - 获取分部报告、队列毛利率，以及按收购队列拆分的软件附着指标。
      - - 股权结构表与优先权
        - 清算优先权、参与权、员工期权稀释，以及任何侧函
        - 如果结构带有惩罚性，报价名义估值可能高估普通股价值
        - 复核最新股权结构表、投资条款清单，以及任何投资者权利侧边安排。
      - - SEC 事件后的控制
        - 董事会材料、控制整改时间线，以及外部对财务系统的测试
        - 只有底层控制问题真正解决，治理折扣才应收窄
        - 通过直接文件开展财务、审计委员会和外部控制尽调。
      - - 收购整合证明
        - Good Eggs、Procurant、Coast Citrus、Delta Fresh 和 Schoenmann 的有机增长、交叉销售和协同指标
        - 显示并购整合是在创造价值，还是只是在制造复杂度
        - 索取收购前 / 后 KPI 跟踪，以及整合软件和客户使用的打法。
    notes: 尽调清单刻意保持简短并面向决策。这里每一项都可能实质性改变估值、建议或下行保护。
    claimRefs:
      - CV021
      - CV022
      - CV025
      - CV042
      - CV047
      - CV048
      - CV049
