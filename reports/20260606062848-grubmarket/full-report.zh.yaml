  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 要素
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 收入规模
        - 报告的 2024 年收入突破 $2.0B，使 GrubMarket 具备真实规模，也有空间相对本地经销商取得溢价。
        - 收入数字仍主要来自管理层口径，而且此前曾出现 SEC 报告问题。
        - 发布经审计 FY2024-FY2025 收入，并把过去报告系统桥接到当前控制体系。
      - - 软件层
        - AI、ERP、订购和支付产品可支撑比纯批发商更高质量的收入。
        - 投资者仍看不到软件占比、毛利率和附着率的公开披露。
        - 按软件产品披露分部收入、分部毛利率和客户采用情况。
      - - 收购引擎
        - 超过 80 笔收购带来网络密度，也为 AI 和采购工具沉淀专有数据。
        - 并购整合模式可能掩盖低有机增长，并产生需要打折的整合拖累。
        - 按队列提供有机增长、收购收入贡献和交易后利润率结果。
      - - 可比估值支撑
        - 按大约 1.9x-2.25x 收入计算，GrubMarket 低于 Instacart 式平台倍数。
        - 它仍远高于综合经销商公开可比公司，因此依赖溢价叙事。
        - 证明持久的软件 / 平台组合，真正把 GrubMarket 和食品分销同行拉开。
      - - 治理轨迹
        - 公司称 SEC 事件后已替换旧系统并升级控制。
        - SEC 案件证明投资者曾被误导一次，因此不应廉价授予信任。
        - 必须独立尽调当前控制、审计师认可度和董事会监督。
      - - 全球叙事
        - 融资材料强调国际覆盖和更广的软件机会。
        - 官方网站目前仍更像一家有全球雄心的北美运营商，而不是完全全球化平台。
        - 明确定义国际敞口究竟指法律实体、采购来源、客户，还是实际运营基础设施。
    notes: 投资逻辑和反向逻辑可以同时成立：GrubMarket 可以具备战略吸引力，同时仍因披露和治理风险需要估值折扣。
