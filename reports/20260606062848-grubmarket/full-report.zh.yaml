      - 最好的公开答案
      - 为何不完整
      - 近期尽调路径
    rows:
      - - 最宽口径市场是什么？
        - 2025 年美国食品总支出 $2.51T
        - 口径过宽，因为包含 GrubMarket 难以直接实际变现的消费支出
        - 仅作为背景上限
      - - 最接近的公开核心市场是什么？
        - 2026 年美国杂货批发行业 $326.2B
        - 漏掉围绕食品工作流的软件、AI 和合规收入池
        - 将当前客户组合映射到类似 NAICS 的渠道
      - - 面向农产品的批发软件 SAM 是多少？
        - 未保留单一可靠公开数字
        - 公开来源把商品支出、批发市场和软件叙事拆开
        - 从当前客户、品类和 ARPA 自下而上搭建 SAM
      - - 机会中有多少由合规驱动？
        - FSMA 204 显然重要，但公开支出数据有限
        - 规则清楚，但预算捕获率不清楚
        - 向管理层索取合规驱动的管线和赢率数据
      - - 需求中有多少是纯数字化，多少是混合模式？
        - 在线杂货在增长，但门店仍占主导，消费者仍想检查农产品
        - 行为数据无法直接转换为批发软件抽成率
        - 按品类、客户类型和工作流拆分采用情况
