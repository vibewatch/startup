        - 会拖慢把食品采购视为完全数字化行为的任何逻辑
        - 哪些品类真正数字优先，哪些仍由看货驱动？
      - - 交易对手碎片化与数据质量
        - 约束
        - 当前
        - 推高实施、上手和数据标准化成本
        - 每次软件部署伴随多大的服务负担？
      - - 行业竞争和薄利润
        - 约束
        - 结构性
        - 杂货批发竞争激烈，可能限制抽成率和定价权
        - 规模化后怎样的毛利率和留存结构可持续？
      - - AI 驱动的运营自动化
        - 正向
        - 当前
        - 如果 AI 工具能解决真实易腐品工作流，就能形成产品差异化
        - AI 功能中有多少是付费、已采用且有粘性的？
    notes: |-
