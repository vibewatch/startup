      - number: '8.2'
        title: 可比视角、并购溢价和治理折价
        blocks:
          - type: paragraph
            body: >-
              公开市场背景让 GrubMarket 的估值标记不至于显得明显便宜。综合食品分销商仍是低倍数生意：Sysco、US Foods、UNFI 和 Performance Food Group 按市值 /
              收入计算，交易倍数都远低于 1x 过去收入。Instacart 是更宽松的公开可比对象，因为它把食品商业与软件、广告和轻资产平台模型配在一起，但它也只在约 2.5x 过去收入交易。因此，GrubMarket
              隐含的 1.9x-2.25x 区间落在公开分销结果和公开平台结果之间，正是“混合并购整合 + 软件”故事想站的位置。问题在于，GrubMarket 还没有赚到只按平台观感定价的资格。TechCrunch
              称公司已完成 80 多起收购，Procurant 和 Schoenmann 等 2025-2026 年里程碑说明这确实可以创造软件和网络杠杆。但 SEC 2025 年针对约 $550 million
              历史收入高估的执法行动意味着，在当前已审计财务和内控可见之前，投资者应给治理折价。
