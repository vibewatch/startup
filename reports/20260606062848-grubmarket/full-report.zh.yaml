      - number: '7.4'
        title: 缓释因素、断点和投资含义
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 确实有缓释因素。公司拥有适配追溯和食品安全的软件；同业组显示这些风险是行业结构问题，并非 GrubMarket
              独有；以当前证据看，公开诉讼事项没有一项足以致命。但缓释叙事只有变成可衡量数据后才可投资。投资者需要和解后的已审计财报、可测试的内控整改叙事、Procurant 和 AI
              产品带来更高质量收入而非单纯增加复杂度的证据，以及服务和一线安全噪音没有随着公司扩张而扩大的把握。


              实际断点很直接：只要新的执法行动触及披露、食品安全或消费者实践，就应把投资假设视为受损；若雇佣或仲裁事项从孤立法律噪音变成实质不利判决模式，也一样；若 BBB
              或运营投诉不再趋稳而是上行，或管理层无法证明并购整合正在改善毛利、合规准备度和客户韧性，也一样。只有 GrubMarket 现在看起来比公开记录所证明的更可控、更可审计、更由软件驱动，上行 case 才能穿过
              SEC 伤疤。
