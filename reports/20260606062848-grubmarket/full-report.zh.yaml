      - - UNFI
        - 零售和生鲜既有企业
        - 30k 个客户网点；11k 家供应商；250k+ 个 SKU
        - 零售商、天然 / 有机、杂货、餐饮服务
        - 生鲜分销、自有品牌、零售服务
        - 最大客户集中度和自配送风险
      - - Performance Food Group
        - 全国性全品类既有企业
        - 155 个 DC；>300k 个客户网点；>250k 个产品
        - 独立和连锁餐厅，以及机构买家
        - 规模，加上增值服务和品类宽度
        - 低利润和强规模竞争
      - - Instacart
        - 数字零售平台替代者
        - Business 有 1,800+ 家零售商；Enterprise 有 2,200+ 个零售品牌
        - SMB 企业买家和零售伙伴
        - 无合约接入、履约、广告和零售商软件
