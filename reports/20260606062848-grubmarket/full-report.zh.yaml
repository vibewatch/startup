  - id: TV005
    title: 投资逻辑破坏与叫停触发器表
    columns:
      - 触发器
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 审计桥接失败
        - 经审计 FY2024-FY2025 收入或 EBITDA 显著低于管理层说法
        - 当前倍数的基础被抽掉
        - 重估到悲观情景，停止把当前轮次视为公允价值证据。
      - - 降价轮或惩罚性结构
        - 下一轮融资低于当前估值标记，或加入激进优先权
        - 表明私有市场也拒绝当前溢价
        - 锚定新价格，并从重置后的股权结构表重新承销。
      - - 并购整合停滞
        - 收购没有改善软件附着率、利润率或有机增长
        - 故事变成只有规模、没有质量
        - 按更接近分销可比公司而非平台可比公司的方式估值。
      - - 新的法律或质量问题
        - 未决诉讼、监管审查或质量事件扩大，而不是收缩
        - 延长治理折扣，并伤害退出准备度
        - 提高要求回报率，并放慢任何承销流程。
      - - 地域 / 产品说法被证明松散
        - 全球足迹或 AI 产品说法没有转化为可衡量的收入质量
        - 削弱围绕软件和覆盖面的溢价叙事
        - 下调溢价假设，并要求分部层面的证据。
      - - 资本强度上升
        - 收购融资、营运资本或合规需求消耗的现金高于预期
        - 即使收入仍大，也会压缩股权价值
        - 继续推进前，要求现金流桥接和下行情景流动性计划。
    notes: 这些是估值特定的叫停标准，不是泛泛的运营风险。任何一个触发项都可能把 GrubMarket 从基准情景上沿推入明确的悲观情景。
