  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 会计内控与监管风险是尽调主线
        blocks:
          - type: paragraph
            body: >-
              关键尽调风险不是普通创业公司波动，而是投资人财务披露中已经记录在案的可信度破口。SEC 在 2025 年 1 月 17 日的新闻稿和和解令称，GrubMarket 在 Series D 融资材料中高估
              2016-2020 年收入，金额超过 $550
              million；同一时期，公司为税务和信贷目的采用的收入数字显著更低。该命令杀伤力尤其大，因为它讲的不是一句宽泛营销表述，也不是小额记账重述；它列出一张五年工作版与修订版收入对照表、一轮募得约 $80
              million 的融资流程，以及公司直到轮次关闭后才告知 Series D 投资者这一差异。


              到 2026 年，这段历史更重要，因为 GrubMarket 同时要求市场接受其自我造血盈利表述、AI
              升级叙事，以及显著抬高的私募估值。正确的投资判断不是假定永久欺诈，而是把每一项当前收入质量和利润率主张的举证门槛大幅抬高。因此，和解后的清晰审计轨迹、有记录可查的内控整改，以及低毛利分销与更高质量软件收入之间的分部级勾稽，不是可有可无的尽调项；它们是投资前置闸门。没有这些，后续运营亮点也只能部分抵消披露留下的伤疤。
