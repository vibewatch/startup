      - number: '1.2'
        title: 领导层、治理与关键人集中
        blocks:
          - type: paragraph
            body: >-
              公开领导层画像仍然高度围绕创始人。Mike Xu 在公司官方材料、Y Combinator 档案和多轮融资公告中，仍是可见的创始人兼 CEO。与此同时，GrubMarket
              已经不再像早期创业故事暗示的那样只是「Mike Xu 一个人」。The Org 显示公司有 6 人领导团队，官方 AI 产品发布提到首席软件产品官 Genevieve Wang 和 CTO Shih-Chieh
              Tao，公司 hello 页面还展示 Carole Shandler 担任一家 GrubMarket 运营业务的总裁。更宽的管理梯队很重要，因为 GrubMarket
              现在同时管理软件、收购、易腐品运营和监管风险，规模已经远超典型风投支持的电商创业公司。


              保留来源里最明确的治理信号，是 2025 年 12 月 Jorge deNeve 出任首席法务官。GrubMarket 强调了他的 SEC 执法和 O’Melveny 背景，而 deNeve
              自身职责也被描述为治理、合规、披露和风险管理。这个任命不只是常规补一名法务：它更像 SEC 2025 年 1
              月和解后的治理加固。即便如此，公开来源仍没有披露干净、当前的董事会名单、委员会结构或投资人控制矩阵，因此关键人风险和治理不透明仍是开放尽调点。
