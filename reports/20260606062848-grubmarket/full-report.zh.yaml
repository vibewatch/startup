      - number: '3.4'
        title: 竞争结论与监测点
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个平衡结论。相较碎片化区域分销商，以及只覆盖融资或只覆盖分销商软件的窄点方案，GrubMarket
              看起来有战略差异化。它也比纯转售商更有软件故事，因为多个保留来源独立把公司描述为市场加软件平台。但证据并不支持「GrubMarket 已经摆脱商品化动态」的说法。最大的对手——Sysco 式综合分销商和
              Instacart 式数字平台——仍然在实体规模或低摩擦买家访问上，有更清楚的公开证明。

              对投资人或尽调团队来说，监测清单很直接。第一，看 GrubMarket 能否持续把收购转成更紧的操作系统，而不是更松散的并购控股摊子。第二，要赢单 /
              输单数据、分队列客户留存和软件附着率，检验工作流所有权是否真的有粘性。第三，要实际定价和毛利证据，看软件是在改善经济性，还是只是装饰一个批发核心。在这些证据出现前，最稳妥的竞争姿态是：GrubMarket
              有真实战略切口，但没有不可攻破的护城河。
