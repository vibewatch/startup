      - - Sysco
        - 综合食品分销的规模龙头
        - 市值 / 过去十二个月收入 0.44x
        - 显示大型分销业务在公开市场的定价落点
        - 相比 GrubMarket 叙事，软件可选性弱得多
        - 提醒低利润率分销结果的硬底线
      - - US Foods
        - 专注执行的大型美国餐饮服务经销商
        - 市值 / 过去十二个月收入 0.47x
        - 披露更干净的经销商可比公司
        - 仍不是软件驱动的市场平台
        - 支持纯分销倍数保持低位的判断
      - - UNFI
        - 薄利杂货批发和分销
        - 市值 / 过去十二个月收入 0.11x
        - 说明利润率和信心偏弱时，公开市场定价会多么严厉
        - 业务组合和客户画像不同于 GrubMarket
        - 治理或质量问题驱动估值压缩时的悲观情景参考
      - - Performance Food Group
        - 公开盈利能力优于 UNFI 的经销商
        - 市值 / 过去十二个月收入 0.24x
        - 在 Sysco / US Foods 与 UNFI 之间的有用中位经销商可比
        - 本质上仍先是经销商，不是市场平台加软件故事
        - 说明 GrubMarket 若要拿溢价，必须拿出真实的组合差异化
      - - Instacart
        - 具备软件、广告和较轻资产经济性的食品商务平台
        - 市值 / 过去十二个月收入 2.5x；EV/sales 2.32x
        - 软件赋能食品商务模式的最佳公开溢价可比
        - 平台利润率和披露质量明显强于 GrubMarket 已公开呈现的水平
        - 公开可比中的上沿参照，不是基准情景可比
    notes: 可比集合混合了经销商和平台类比，因为 GrubMarket 试图同时按两者估值。表格用于框定结果，不是假装存在完美可比公司。
