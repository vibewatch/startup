      - number: '6.5'
        title: 扩张路径、渠道依赖与集中度风险
        blocks:
          - type: paragraph
            body: >
              GrubMarket 的公开客户动作看起来围绕工作流深度和收购来先落地、再扩张。Procurant 提供一个庞大安装基础，GrubMarket 明确称它可以连接到
              WholesaleWare、GrubAssist、Orders IO 和 GrubPay。Coast Citrus 和 Time100 报道说明，被收购批发商和分销商可以转到 WholesaleWare
              和现代电商运营上。2026 年春季发布进一步说明，公司仍在向已安装基础卖得更深，面向现有餐厅、餐饮服务和果蔬分销商客户，在 WholesaleWare、Orders IO 和 AI Orders
              上新增功能。换句话说，当 GrubMarket 把软件、AI、订购和支付叠加到已经赢下的运营关系上时，扩张就会发生。

              集中度问题更难判断。公开材料反复提到 Walmart、Costco、Sam's Club、Target、Albertsons、Publix、Sprouts 等头部零售商，甚至提到通过被收购分销商形成的
              In-N-Out Burger
              供应关系，但从未量化少数账户占收入的比例。这制造了真实投资判断缺口：具名覆盖说明客户战略价值和大账户相关性，但投资人仍看不出一家零售商、一家分销商或一个被收购网络，是否代表了收入或毛利的过高比例。
