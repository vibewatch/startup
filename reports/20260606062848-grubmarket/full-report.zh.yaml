      - 规模 / 模式信号
      - 倍数信号
      - 重要性
      - 关键限制
      - 对 GrubMarket 的启示
    rows:
      - - GrubMarket（Series H 轮参考）
        - 私有并购整合型公司，叠加软件 / AI 食品商务平台
        - 由 $4.5B 投前估值隐含的 2025 年收入 1.9x 或 2024 年收入 2.25x
