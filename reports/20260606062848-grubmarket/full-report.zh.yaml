  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代集合
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 同时竞争于不止一个市场，因此用单一同行框架会误导。公司官方渠道和独立档案描述的是一个混合体：全国性 B2B 批发分销、面向批发商的 ERP 和 AI 软件，以及通过收购进入
              Procurant 等互补平台。真正的竞争集合至少有四层。第一层是 Sysco、US Foods、UNFI 和 Performance Food Group
              这样的全国性综合型既有巨头，它们在客户地点、采购触达和配送基础设施上有可证实规模。第二层是 Instacart 这类数字零售平台替代品，通过无合同订购降低企业买家的摩擦。第三层是 ProducePay 和 FBN
              这类贴近果蔬或融资的专业玩家，攻击具体的采购、融资和透明度痛点。第四层是 Pepper 这类软件优先的赋能方，试图不拥有实体网络也拿下分销商工作流。

              实际含义是，GrubMarket 不是在打一家标准对手；买家任务不同，替代方案也不同。杂货店或餐厅若想要宽目录和稳定配送密度，基准就是综合分销商。急需补货或小篮子企业买家，替代品可能是
              Instacart。只想把订单录入、促销和收款数字化的分销商，Pepper 是更相关的对照。看重融资和可见性的生产商或种植者，则可能通过 ProducePay 或 FBN 解决足够多工作流，从而削弱
              GrubMarket 的优势。因此，本章把竞争者类别，而不只是标识，作为真正的分析单位。
