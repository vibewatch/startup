      - number: '7.3'
        title: 同业申报显示执行滑坡时的经济下行空间
        blocks:
          - type: paragraph
            body: >-
              上市公司可比对象有用，不是因为 GrubMarket 与 Sysco、US Foods、UNFI、PFG 或 Instacart
              完全相同，而是因为它们展示了食品分销和数字杂货模型做大后的默认失败模式。Sysco、US Foods、UNFI 和 PFG 都描述了一个高度竞争、低利润率的行业：库存周转快、定价权有限、客户经常拿账期、供应商和
              GPO 关系重要，即便成本或销售的小幅冲击也会不成比例地打到利润。UNFI 的申报还显示，即便网络很大，客户集中度仍可能重要；PFG 和 Sysco 也明确提示并购整合、诉讼和召回风险。


              Instacart 的年报补上数字平台类比：市场竞争激烈，营运资本波动，收购带来网络安全暴露，并且依赖零售商、购物者和供应商之间的付款时点。GrubMarket
              可能比普通分销商有更多软件上行空间，但公开证据还没有证明其软件层在经济上已经足够主导，可以跑赢这些行业默认项。因此，2025-2026 年估值跃升对整合、利润率质量、客户集中度或营运资本纪律上的任何滑坡都很敏感。
