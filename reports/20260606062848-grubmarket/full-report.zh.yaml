      - number: '4.2'
        title: 利润率路径与单位经济性
        blocks:
          - type: paragraph
            body: >-
              最难的财务问题不是 GrubMarket 是否够大，而是这种规模的质量是否在提升。最乐观的解读是，软件和 AI 已经足够有意义，能把收入质量抬到普通成本加成型分销商之上。Procurant
              增加了合规、可追溯、采购工作流和 AI 驱动的易腐品软件。Sacra 也描述了 WholesaleWare 的经常性订阅经济性，以及电商交易的佣金经济性。如果这些软件和交易层在收入中占比越来越高，EBITDA
              盈利就会比纯批发整合商更可信。

              问题是，公开记录仍没有给出证明这一结果所需的关键结构数据。Sysco、US Foods、UNFI 和 PFG
              的食品分销文件都描述了低利润、高竞争的运营环境，受加价定价、库存、客户信用和价格压力左右。这些就是该行业的默认经济性。没有公开证据足以显示 GrubMarket
              经审计毛利率、软件占比、客户集中度或现金转换，从而证明公司已经逃离这些默认状态。因此，正确解读应是有条件的：利润率路径可能显著改善，但在公开或尽调专属证据显示报告收入中究竟有多少软件收入和毛利之前，EBITDA
              说法仍只是方向上有趣，而不是已经被充分承销。
