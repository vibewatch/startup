  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与分销工作流
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 的产品最好被理解为一组交易触点，而不是一个单一应用。公开公司页面推广的是一套伞状产品，覆盖 B2B 批发采购、消费者杂货配送、卖家店面、ERP 软件和企业
              AI。这很重要，因为公司不只是把软件卖给分销商；它也运营市场和配送流，从而直接接触订单、定价、履约和客户支持工作流。在旧有 GrubMarket 触点上，消费者可以买
              GrubBoxes、订购送货上门果蔬，也可以从本地卖家购物。企业侧，首页则推销覆盖美国和加拿大的批发网络。Doorganics
              把配送模式延伸成更精细的区域工作流，包含盒子选择、换选购物定制，以及按邮编安排的路线配送日。因此，产品触点从商业和物流起步；当买家不是家庭消费者而是分销商时，再把用户交到 Orders IO 或 AI
              Orders 等软件模块里。
