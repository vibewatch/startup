  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和当前估值标记意味着什么
        blocks:
          - type: paragraph
            body: >-
              融资背景没有歧义。GrubMarket 在 2025 年 3 月以超过 $3.5 billion 的投后估值完成约 $50 million Series G，又在 2026 年 2 月以 $4.5 billion
              投前估值完成另一笔约 $50 million Series H。管理层用两轮融资证明业务已经跨过足以支撑溢价估值的规模门槛：2024 年收入超过 $2.0 billion，2025 年轨迹为 $2.4
              billion，EBITDA 盈利，员工超过 12,000 人，业务覆盖 70 多个国家。从粗略数学看，这些主张把 Series H 放在约 2.25x 报告 2024 年收入，或约 1.9x 2025
              年收入。相对传统分销商偏高，但对于一个结合商业基础设施、软件、AI 工具和并购扩张的业务，并非显然不可能。真正的问题不是这个倍数能否抽象自洽，而是底层收入质量和利润率主张是否值得被当成投资级证据。
