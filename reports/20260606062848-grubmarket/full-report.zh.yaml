      - number: '6.2'
        title: 采用轨迹与被收购客户覆盖
        blocks:
          - type: paragraph
            body: >
              GrubMarket 最清楚的采用信号来自子公司和收购覆盖，而不是单一披露的合并客户数。Farmigo 称其自 2009 年以来服务超过 10,000 家农场，并支持从 50 名到 1,500
              多名会员的项目。Procurant 增加了横跨 14 个国家的 850 多名客户和大约 $5.5 billion 商品交易总额（GMV）；Coast Citrus
              则增加了一个服务主要杂货零售商和餐饮服务买家的全国性分销商。Digital Commerce 360、PYMNTS、The Packer 和 FinancialContent 的 2026
              年报道，把这些新增资产与 Delta Fresh 放在一起，并把 GrubMarket 呈现为一家通过软件和运营收购同时扩张的公司。

              这种广度有用，但不等于 GrubMarket
              自身有一条干净的采用轨迹。公开来源证明公司全国运营、拥有有意义的被收购客户池，并持续为现有用户发布功能；但它们没有提供逐年桥接，说明净新增客户、流失客户或已迁移被收购账户。投资人因此可以得出结论：覆盖扩张是真实的，但无法精确量化增长中有多少来自自然增长，多少由收购带动。
