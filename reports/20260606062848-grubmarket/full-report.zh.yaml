        title: 信任、合规与缺口评估
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 在继承或合作进入专业工作流的地方，信任和合规最强；在买家期待企业软件透明度的地方，则最弱。GrubPay 公开声明具备 PCI DSS Level 1，以及 KYC 和 AML
              检查，这比套件其他部分的信息更具体。Procurant 进一步扩展合规故事，加入 FSMA 204 可追溯、质量控制和大规模食品安全监控。Coast Citrus 贡献 PrimusGFS 和 SMETA
              等运营认证，但这些证明属于分销商运营，而不是 SaaS 栈。软件侧证据更薄。GrubAssist App Store
              页面称该应用不收集数据，却没有提供可访问性披露。本章审阅的公开来源没有找到核心软件触点的状态页、可用性 SLA 或事故历史。反向来源集中在消费者市场，而不是 B2B
              套件，但仍然重要，因为它们指向支持和退款摩擦；如果企业工作流有一天以同样方式退化，这类摩擦可能污染品牌信任。
