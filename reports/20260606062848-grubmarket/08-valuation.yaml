company:
  name: GrubMarket
chapter:
  number: 8
  title: Valuation
summary: 'GrubMarket''s February 2026 Series H at a $4.5 billion pre-money valuation is directionally defensible only if management''s claimed $2.0 billion 2024 revenue, $2.4 billion 2025 trajectory, and EBITDA profitability survive diligence. Public broadline distributors trade around 0.1x-0.5x trailing revenue while Instacart trades around 2.5x, leaving GrubMarket''s implied 1.9x-2.25x multiple in the middle rather than in fantasyland. But the SEC''s prior revenue-overstatement action, acquisition-heavy roll-up strategy, and thin audited disclosure keep the current mark near the top of a defensible range. Recommendation: track. Confidence: medium. Risk rating: high. Valuation stance: stretched.'
sections:
- id: financing-context-and-what-the-current-mark-implies
  title: Financing context and what the current mark implies
  body: 'The headline financing context is not ambiguous. GrubMarket raised roughly $50 million in a March 2025 Series G at a post-money valuation above $3.5 billion, then raised another roughly $50 million in a February 2026 Series H at a $4.5 billion pre-money valuation. Management used both rounds to argue that the business had already crossed scale thresholds that justify a premium valuation: more than $2.0 billion of 2024 revenue, a $2.4 billion 2025 trajectory, EBITDA profitability, more than 12,000 employees, and activity across more than 70 countries. On the raw math, those claims place the Series H at about 2.25x reported 2024 revenue or about 1.9x 2025 revenue. That is high versus traditional distributors, but it is not obviously impossible for a business that combines commerce infrastructure, software, AI tooling, and acquisition-enabled scale. The real question is not whether the multiple can be defended in the abstract; it is whether the underlying revenue quality and margin
    claims deserve to be treated as investment-grade evidence.'
