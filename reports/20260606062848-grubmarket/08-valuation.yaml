tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - What would change it
  rows:
  - - Recommendation
    - track
    - The price can be explained, but not confidently underwritten from current public evidence.
    - Upgrade only after audited financials and segment economics catch up to the financing narrative.
  - - Confidence
    - medium
    - There is enough external evidence to frame a valuation range, but the core revenue and EBITDA claims are still management-led.
    - Confidence improves if audited 2024-2025 numbers corroborate management statements.
  - - Risk rating
    - high
    - SEC history, roll-up complexity, and live legal/quality signals justify a heavier diligence burden than a typical late-stage growth round.
    - Risk falls if controls, litigation, and acquisition integration all look clean at diligence.
  - - Valuation stance
    - stretched
    - The mark sits above distributor multiples and near the top of base case, even though it remains below Instacart-like platform multiples.
    - A lower entry price or stronger audited software-margin proof would move the stance toward fair.
  - - Decision implication
    - Do diligence before underwriting
    - Current evidence supports watchlist status, not aggressive conviction at the quoted price.
    - A clean audit bridge and current cap-table terms can convert the round from optionality to investable value.
  notes: Assessment uses public evidence as of 2026-06-06. The largest uncertainty is not the arithmetic; it is whether current revenue, EBITDA, and control claims survive institutional diligence.
