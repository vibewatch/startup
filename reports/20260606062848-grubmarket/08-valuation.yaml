- id: scenario-range-and-recommendation
  title: Scenario range and recommendation
  body: 'Scenario work is more honest here than pretending the round price is self-validating. In a bear case, GrubMarket starts to look like a distributor with governance baggage: if true revenue quality is closer to the low end of management''s claims and public markets refuse to grant a software premium, the value can compress toward roughly $1.6 billion to $2.6 billion. In a base case, investors accept the reported scale but still demand a governance and integration discount, which yields about $3.4 billion to $4.5 billion. In a bull case, software attach rates, acquired-network monetization, and a clean controls story push the business closer to an Instacart-style premium, supporting roughly $5.7 billion to $7.3 billion. That puts the current $4.5 billion pre-money mark near the upper end of base case rather than in clear bargain territory. The best call is track: the price is not obviously irrational, but it asks outside investors to trust management-led revenue and EBITDA claims before
    audited disclosure fully catches up.'
