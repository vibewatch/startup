  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited FY2024 and FY2025 financial statements plus a bridge from management revenue claims to GAAP or audited figures.
    whyItMatters: The current valuation depends directly on unverified revenue and EBITDA claims, so audit-grade evidence is necessary to treat the multiple as reliable rather than promotional.
    diligencePath: Request current audited financials, auditor commentary, and the exact data room materials used in the Series H process.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, liquidation preferences, employee option pool, and any side letters or structured securities tied to the latest round.
    whyItMatters: A quoted pre-money valuation can materially overstate common-equity attractiveness if structure is investor-friendly or heavily dilutive to new money.
    diligencePath: Review the latest cap table, term sheet, investor-rights agreement, and board approvals tied to the Series H financing.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: Segment-level revenue mix, gross margins, software ARR, payments economics, and acquisition-cohort contribution.
    whyItMatters: The valuation premium over distributor comps only works if higher-quality software and platform revenue is economically meaningful rather than narrative-led.
    diligencePath: Obtain management reporting by segment and a cohort view showing software attach, gross margin, and cross-sell trends.
    relatedQuestionRefs:
    - QV026
    - QV028
    relatedTableRefs:
    - TV002
    - TV004
    - TV006
  - type: missing-source
    severity: material
    topic: acquisition-integration
    missingEvidence: Post-deal KPI tracking for Good Eggs, Procurant, Coast Citrus, Delta Fresh, and Schoenmann, including retention, synergy, and margin outcomes.
    whyItMatters: A roll-up can create value or hide value destruction; the answer materially affects both the multiple and the durability of the thesis.
    diligencePath: Request acquisition scorecards, integration dashboards, and cohort bridges separating organic growth from purchased revenue.
    relatedQuestionRefs:
    - QV006
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: governance-and-legal-overhang
    missingEvidence: Current reserve analysis, board oversight materials, and management commentary on open litigation, complaints, and compliance follow-through after the SEC case.
    whyItMatters: The governance discount can narrow only if investors can see that historical reporting problems and current legal signals are contained and monitored.
    diligencePath: Run legal diligence on open cases, review compliance committee materials, and ask management for a post-SEC controls timeline and evidence of implementation.
    relatedQuestionRefs:
    - QV010
    - QV011
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
