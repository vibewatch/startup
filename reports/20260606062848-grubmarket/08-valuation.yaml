- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited FY2024-FY2025 financials
    - Audited income statement, cash flow, and balance sheet plus reconciliation to management revenue claims
    - Validates whether the current 1.9x-2.25x implied multiple is anchored in reliable numbers
    - Request current audited financials, auditor letters, and the revenue bridge used for the round.
  - - Revenue mix and margins
    - Segment mix across wholesale, marketplace, software, AI, and payments plus gross-margin disclosure
    - Determines whether GrubMarket deserves a software premium instead of a distributor multiple
    - Obtain segment reporting, cohort gross margins, and software attach metrics by acquisition cohort.
  - - Cap table and preferences
    - Liquidation preferences, participation rights, employee option overhang, and any side letters
    - The quoted headline valuation can overstate common-equity value if structure is punitive
    - Review the latest cap table, term sheet, and any investor-rights side arrangements.
  - - Controls after the SEC case
    - Board materials, control remediation timeline, and external testing of finance systems
    - The governance discount should shrink only if the underlying control issue is actually resolved
    - Run finance, audit-committee, and external-control diligence with direct documentation.
  - - Acquisition integration proof
    - Organic growth, cross-sell, and synergy metrics for Good Eggs, Procurant, Coast Citrus, Delta Fresh, and Schoenmann
    - Shows whether the roll-up is creating value or just complexity
    - Ask for pre/post-acquisition KPI tracking and the playbook used to integrate software and customers.
  notes: The diligence list is intentionally short and decision-oriented. Every item here can materially move valuation, recommendation, or downside protection.
