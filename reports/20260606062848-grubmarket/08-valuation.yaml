- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Element
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Revenue scale
    - Crossing $2.0B of reported 2024 revenue gives GrubMarket real scale and room for a premium to local distributors.
    - The revenue figures are still mostly management-led and follow a historical SEC reporting issue.
    - Publish audited FY2024-FY2025 revenue with a bridge from past reporting systems to current controls.
  - - Software layer
    - AI, ERP, ordering, and payments products can support higher-quality revenue than a pure wholesaler.
    - Investors still lack public disclosure on software mix, gross margin, and attach rates.
    - Show segment revenue, segment gross margin, and customer adoption by software product.
  - - Acquisition engine
    - More than 80 acquisitions create network density and proprietary data for AI and procurement tools.
    - Roll-ups can mask low organic growth and create integration drag that deserves a discount.
    - Provide organic growth, acquired revenue contribution, and post-deal margin outcomes by cohort.
  - - Comparable support
    - At roughly 1.9x-2.25x revenue, GrubMarket is below Instacart-style platform multiples.
    - It is still far above broadline distributor public comps and therefore relies on a premium story.
    - Prove a durable software/platform mix that really separates GrubMarket from food distribution peers.
  - - Governance trajectory
    - The company says legacy systems were replaced and controls upgraded after the SEC matter.
    - The SEC case proves investors have already been misled once, so trust should not be granted cheaply.
    - Independent diligence on current controls, auditor comfort, and board oversight is essential.
  - - Global narrative
    - Funding materials highlight international reach and broader software opportunity.
    - The official website still reads more like a North America operator with global ambitions than a fully global platform today.
    - Define whether international exposure means legal entities, sourcing, customers, or true operating infrastructure.
  notes: 'The thesis and anti-thesis can both be true: GrubMarket can be strategically impressive while still requiring a valuation discount for disclosure and governance risk.'
