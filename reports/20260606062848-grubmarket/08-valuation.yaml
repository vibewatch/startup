- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Scale / model signal
  - Multiple signal
  - Why it matters
  - Key limitation
  - Read-through for GrubMarket
  rows:
  - - GrubMarket (Series H reference)
    - Private roll-up plus software/AI food-commerce platform
    - 1.9x 2025 revenue or 2.25x 2024 revenue implied by $4.5B pre-money
    - Current subject-company entry point
    - Underlying revenue and EBITDA remain management-led rather than audited public facts
    - Needs a premium to distributors, but not a full software halo without proof
  - - Sysco
    - Scale leader in broadline food distribution
    - 0.44x market cap / trailing revenue
    - Shows where large distribution businesses clear in public markets
    - Much less software optionality than GrubMarket narrative
    - Hard floor reminder for a low-margin distribution outcome
  - - US Foods
    - Large U.S. foodservice distributor with execution focus
    - 0.47x market cap / trailing revenue
    - Relevant distributor comp with cleaner public disclosure
    - Still not a software-led marketplace
    - Supports the view that pure distribution multiples stay low
  - - UNFI
    - Thin-margin grocery wholesale and distribution
    - 0.11x market cap / trailing revenue
    - Illustrates how harsh public pricing becomes when margins and confidence are weak
    - Business mix and customer profile differ from GrubMarket
    - Bear-case reference for governance or quality-driven compression
  - - Performance Food Group
    - Distributor with better public profitability than UNFI
    - 0.24x market cap / trailing revenue
    - Useful middle distributor comp between Sysco/US Foods and UNFI
    - Still a distributor first, not a marketplace-plus-software story
    - Shows why GrubMarket needs real mix differentiation to earn a premium
  - - Instacart
    - Food-commerce platform with software, ads, and lighter-asset economics
    - 2.5x market cap / trailing revenue; 2.32x EV/sales
    - Best public premium comp for a software-enabled food-commerce model
    - Platform margins and disclosure quality are much stronger than GrubMarket has publicly shown
    - Upper-end public analog, not a base-case comp
  notes: Comparable set mixes distributor and platform analogues because GrubMarket is trying to be valued as both. The table is meant to bracket outcomes, not pretend there is a perfect comp.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-relevant public analogues and the subject-company financing mark available as of the run date, but not every global food-commerce or software company.
