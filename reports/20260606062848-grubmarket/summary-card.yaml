summary:
  headline: >-
    GrubMarket has built a rare scaled hybrid of food distribution and vertical ERP software, but the SEC's
    revenue-overstatement settlement, acquisition-roll-up complexity, and still-thin audited disclosure make the current
    price a watchlist story rather than a buy today.
