  topStrengths:
    - National scale across all 50 U.S. states plus 70-country trading reach creates real supply density and deal flow.
    - >-
      WholesaleWare, GrubAssist, Orders IO, GrubPay, and Procurant give GrubMarket more software attach potential than a
      pure distributor.
    - >-
      The acquisition engine has expanded both physical distribution footprint and SaaS capabilities faster than most
      food-tech peers.
  topRisks:
    - >-
      The January 2025 SEC settlement over roughly $550 million of overstated historical revenue raises a real control
      and disclosure risk.
    - >-
      GrubMarket remains an acquisition-heavy roll-up in a low-margin distribution sector where integration mistakes can
      destroy value quickly.
    - >-
      The $4.5 billion 2026 valuation relies heavily on management revenue and EBITDA claims that still lack current
      audited confirmation.
  unresolvedGaps:
    - >-
      Audited FY2024 and FY2025 financial statements plus segment mix and gross-margin detail remain unavailable
      publicly.
    - >-
      Public sources do not reconcile total capital raised, customer overlap, or overlap-adjusted active-customer counts
      after recent acquisitions.
    - >-
      Cap-table terms, liquidation preferences, and any governance rights tied to the 2025-2026 rounds are not publicly
      disclosed.
    - >-
      Investors still need a post-SEC controls walkthrough and proof that legacy revenue-reporting weaknesses are fully
      remediated.
