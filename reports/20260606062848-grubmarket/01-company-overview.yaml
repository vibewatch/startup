company:
  name: GrubMarket
chapter:
  number: 1
  title: Company Overview
  summary: >-
    GrubMarket is a San Francisco-founded food-commerce and software company whose public positioning now blends

    B2B eCommerce, produce distribution, vertical ERP, and enterprise AI for the food supply chain. Public sources

    support a step-up from a $3.5 billion Series G in March 2025 to a $4.5 billion pre-money Series H in February

    2026, but they also preserve a real adverse thread: the SEC charged the company in January 2025 with giving

    Series D investors unreliable historical revenue information that overstated revenue by roughly $550 million.
sections:
- id: identity-business-model
  title: Identity, footprint, and the actual operating model
  body: >-
    GrubMarket’s own current pages frame the company as an AI-powered technology enabler and digital

    transformer of the American food supply chain industry rather than as a narrow online grocery seller.

    The public operating stack spans B2B eCommerce, ERP and enterprise AI tools for wholesalers and

    distributors, office and home delivery, and a sustainability program. That positioning matters because

    the investment case rests on GrubMarket being both a distribution operator and a software layer: its

    value proposition is not just moving produce, but digitizing procurement, inventory, accounting,

    warehouse workflows, and order capture for fragmented food-supply-chain businesses.


    Public identity markers are directionally consistent even when scale proxies diverge. GrubMarket says it

    was founded in 2014, operates out of San Francisco, serves the U.S. and Canadian food supply chain, and

    now does business in all 50 U.S. states and more than 70 countries. Y Combinator’s profile places the

    company in the Winter 2015 batch and describes founder Mike Xu’s self-funded garage start, which fits the

    long-running founder-led narrative. Sacra and Tracxn both reinforce the hybrid model description: a

    company built around B2B food commerce plus software, not just one side of the stack.
  claimRefs:
