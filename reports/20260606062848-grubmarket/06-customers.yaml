    title: "Buyer coverage spans the food chain"
    body: "Public sources connect GrubMarket to growers, distributors, grocers, restaurants, schools, government buyers, and households rather than to a single customer archetype."
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU044]
  - calloutType: insight
    title: "Workflow depth is the real product"
    body: "Orders IO, AI Orders, GrubAssist, Farmigo, and GrubPay suggest the customer relationship is built around recurring operational workflows, not just one-off online transactions."
    claimRefs: [CU009, CU011, CU012, CU013, CU014, CU042]
  - calloutType: risk
    title: "Durability proof lags deployment proof"
    body: "Named case studies are credible, but public NRR, GRR, renewal, contract, and concentration data are absent and independent reviews are sparse or mixed."
    claimRefs: [CU033, CU034, CU035, CU036, CU037, CU039, CU040]
  - calloutType: recommendation
    title: "Ask for post-acquisition customer economics"
    body: "A serious diligence process should require customer and revenue bridges for Procurant, Coast Citrus, and Delta Fresh, plus top-10 concentration, module attach rates, and renewal data by segment."
    claimRefs: [CU025, CU027, CU029, CU031, CU032, CU039, CU042]
