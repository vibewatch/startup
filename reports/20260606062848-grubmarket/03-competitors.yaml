- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Integrated wholesale + software stack
    - Customers unbundle supply, financing, and software
    - High
    - Pepper, ProducePay, and FBN each attack one layer of the workflow
    - Request software attach rates and module-level retention by cohort
  - - National sourcing reach
    - Broadliners still dwarf GrubMarket on public logistics scale
    - High
    - Sysco, US Foods, UNFI, and PFG all publish much larger networks
    - Ask for category-by-category service-level data and on-time delivery proof
  - - AI differentiation
    - Incumbents and platforms are also investing in AI and digital tooling
    - Medium-High
    - Instacart, US Foods, and Pepper all advertise digital or AI tooling
    - Request customer productivity deltas and verified labour-savings case studies
  - - Supplier access and produce specialization
    - Specialists can win produce financing, visibility, or local relationships
    - Medium
    - ProducePay and FBN show specialist wedges can coexist with distribution
    - Ask for supplier exclusivity, preferred-volume, or procurement-cost evidence
  - - Switching-cost depth
    - No-contract or transparent alternatives reduce buyer lock-in
    - Medium-High
    - Instacart Business and FBN Direct lower adoption friction materially
    - Request churn, win-back, and multi-homing data
  - - Acquisition-led breadth
    - Integration sprawl can dilute service quality or economics
    - Medium-High
    - Series G/H materials emphasise continued acquisitions and software integration
    - Request post-acquisition system consolidation and margin progression evidence
  notes: Severity reflects likely impact on moat durability rather than probability alone; each row points to a
    concrete diligence ask needed to clear the risk.
