  rows:
  - - GrubMarket
    - Integrated distributor + software
    - 2025 revenue run-rate ~$2.4B; 2026 pre-money valuation $4.5B
    - Grocers, restaurants, wholesalers, producers, institutions
    - B2B wholesale plus ERP, AI, and acquired SaaS assets
    - Realised pricing and retention proof remain opaque
  - - Sysco
    - National broadline incumbent
    - $81.4B sales base; largest global distributor by its filing
    - Restaurants, healthcare, education, lodging, foodservice
    - Procurement scale, delivery density, full-line assortment
    - Low-margin industry structure and legacy physical model
  - - US Foods
    - National broadline incumbent
    - ~250k customer locations; 70+ locations; broadline distributor
    - Restaurants and foodservice operators
    - National reach with digital tools and private brands
    - GPO pricing pressure and many adjacent competitors
  - - UNFI
    - Retail and fresh incumbent
    - 30k customer locations; 11k suppliers; 250k+ SKUs
    - Retailers, natural/organic, grocery, food service
    - Fresh distribution, private brands, retail services
    - Largest-customer concentration and self-distribution risk
  - - Performance Food Group
    - National broadline incumbent
    - 155 DCs; >300k customer locations; >250k products
    - Independent and chain restaurants plus institutional buyers
    - Scale plus value-added services and category breadth
    - Low margins and strong scale competition
  - - Instacart
    - Digital retail-platform substitute
    - 1,800+ retailers in Business; 2,200+ retail banners in Enterprise
    - SMB business buyers and retail partners
    - No-contract access, fulfillment, ads, and retailer software
    - Does not provide GrubMarket-style producer-to-buyer control
  - - ProducePay
    - Produce-finance specialist
    - Produce-specific financing, visibility, and sourcing suite
    - Growers, shippers, and produce trading partners
    - Financing and visibility wedge in perishables
    - Not a national full-line food distributor
  - - Pepper / FBN
    - Workflow and transparency adjacents
    - 90+ ERP integrations and 40x ROI claim (Pepper); 100k+ member farms and transparent pricing (FBN)
    - Independent distributors or farmers
    - Workflow automation, transparency, financing, and data tools
    - Point-solution coverage rather than integrated national distribution
  notes: Scale signals mix public filings, company disclosures, and analyst summaries; exact realised pricing and
    customer overlap remain only partially public.
