callouts:
- calloutType: strength
  title: The real wedge is the combined stack, not a single feature
  body: The strongest public case for GrubMarket is that it can bundle wholesale distribution, ERP, AI, and acquired
    SaaS workflows into one operating layer. None of ProducePay, FBN, Pepper, or Instacart replicate that exact
    combination on current public evidence.
  claimRefs:
  - CP023
  - CP036
  - CP038
  - CP043
- calloutType: risk
  title: Broadline scale and unbundling are the two moat breakers
  body: If customers can pair incumbent distribution with best-of-breed financing or software, GrubMarket’s advantage
    narrows quickly. The moat weakens most where pricing is opaque and where workflow ownership has not yet produced
    provable retention or win-rate superiority.
