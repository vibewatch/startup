  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Customer-level realised pricing, rebates, contract lengths, and software price sheets across
      GrubMarket and the closest alternatives.
    whyItMatters: Without realised price and contract data, public comparisons can only assess packaging and access
      friction, not true price competitiveness.
    diligencePath: Request sample contracts, price sheets, and procurement invoices from GrubMarket plus at least
      two win-loss accounts.
    relatedQuestionRefs:
    - QP011
    - QP012
    - QP025
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Cohort retention, module attach rates, and win-loss reasons for customers that adopt both distribution
      and software workflows.
    whyItMatters: Switching costs are central to moat durability, but the retained public sources do not quantify
      whether bundled workflow actually creates stickiness.
    diligencePath: Request churn cohorts, net retention by module, and case studies where GrubMarket displaced or
      lost to a broadliner or point solution.
    relatedQuestionRefs:
    - QP014
    - QP015
    - QP025
  - type: missing-source
    severity: minor
    topic: likely-entrants
    missingEvidence: More direct public evidence on retailer-tech, ERP, and AI entrants targeting food wholesale
      workflows beyond Instacart and Pepper.
    whyItMatters: Entrant pressure could compress software differentiation even if current direct-peer pressure
      remains manageable.
    diligencePath: Refresh searches on grocery enterprise software, ERP add-ons, and retailer operating systems
      in the next report cycle.
    relatedQuestionRefs:
