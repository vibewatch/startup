  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: post-settlement-audit-package
    missingEvidence: Audited 2025-2026 financial statements, control-remediation workpapers, and segment-level revenue / gross-margin bridge after the SEC settlement.
    whyItMatters: This is the only evidence set that can prove the disclosure problem is contained rather than merely outgrown by new fundraising headlines.
    diligencePath: Request audited statements, management letter, audit-committee materials, and revenue-recognition policy bridge for all acquired entities.
    relatedQuestionRefs:
    - QR004
    - QR024
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: legal-reserves-and-insurance
    missingEvidence: Current reserve, indemnity, and insurance coverage posture for the SEC matter, employment litigation, and arbitration-related disputes.
    whyItMatters: Public dockets show legal activity, but investors cannot size downside or collections without private defense and reserve data.
    diligencePath: Obtain outside-counsel summaries, reserve memos, D&O / EPLI / product-liability policies, and any arbitration-award collection analysis.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR007
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: service-and-safety-trends
    missingEvidence: Complaint trendline, refund-aging data, chargebacks, site-level safety metrics, and corrective-action closure cadence.
    whyItMatters: BBB and OSHA-derived signals show some public operating noise, but investors need to know whether the trend is isolated, shrinking, or widening with scale.
    diligencePath: Request 24-month complaint, refund, chargeback, lost-order, injury, OSHA-log, and site-audit dashboards by business line.
    relatedQuestionRefs:
    - QR008
    - QR009
    - QR027
    - QR029
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-working-capital
    missingEvidence: Top-customer exposure, days sales outstanding, inventory turns, payables support, and acquired-entity cash-conversion data.
    whyItMatters: Peer filings show these are the variables that determine whether a scaled distributor behaves like a software compounder or a thin-margin operator.
    diligencePath: Request customer concentration schedule, AR aging, inventory and AP by acquired entity, and monthly operating-cash-flow bridge.
