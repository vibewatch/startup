- id: TR005
  title: Mitigation and thesis-breaker table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Disclosure recidivism
    - Audited post-settlement financial package
    - No clean audited 2025-2026 statements plus segment bridge before investment decision
    - Do not underwrite current valuation; pause until disclosure package exists
  - - Integration drag
    - Acquired-business scorecard
    - No proof that Procurant / distributor integrations improve margin, retention, or compliance readiness within 2-3 quarters
    - Apply valuation haircut or walk away
  - - Service deterioration
    - Complaint and refund trend
    - BBB-style issues broaden, refund aging worsens, or discontinued-market communications recur
    - Treat customer-trust risk as compounding, not incidental
  - - Safety / regulatory slippage
    - Operational incident log
    - New OSHA-style issues, food-safety incidents, or traceability breakdowns after 2026 go-live
    - Escalate to hard diligence hold and review insurance / recall exposure
  - - Model-quality mismatch
    - Revenue-quality bridge
    - Management cannot show software / AI contribution improving faster than integration complexity and working-capital demands
    - Re-rate business toward low-margin distributor economics
  - - Adverse legal surprise
    - Court / enforcement updates
    - Materially adverse judgment, new enforcement, or repeat investor-disclosure issue
    - Treat as thesis-breaker
  notes: These are investment gates tied to observable evidence, not generic risk-management slogans.
