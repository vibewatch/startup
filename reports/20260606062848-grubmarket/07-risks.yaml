- id: dependency-and-model-risk
  title: Peer filings frame the economic downside if execution slips
  body: 'Public-company comparables are useful here not because GrubMarket is identical to Sysco, US Foods, UNFI, PFG, or Instacart, but because they show the default failure modes of food-distribution and digital-grocery models at scale. Sysco, US Foods, UNFI, and PFG all describe a highly competitive, low-margin sector where inventory turns are high, pricing power is limited, customers often receive credit, supplier and GPO relationships matter, and even modest cost or sales shocks can hit profit disproportionately. UNFI''s filing also shows how customer concentration can remain material even in a very large network, while PFG and Sysco explicitly flag acquisition integration and litigation/recall risk.


    Instacart''s annual report adds the digital-platform analogue: highly competitive markets, fluctuating working capital, acquisition-related cyber exposure, and dependence on payment timing across retailers, shoppers, and vendors. GrubMarket may have more software upside than a plain distributor, but the public evidence does not yet prove that its software layer has become economically dominant enough to outrun these sector defaults. That makes the 2025-2026 valuation step-up vulnerable to any slippage in integration, margin quality, customer concentration, or working-capital discipline.'
