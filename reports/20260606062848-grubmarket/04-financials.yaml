  - Diligence ask
  rows:
  - - B2B wholesale / marketplace
    - Food purchased by grocers, restaurants, wholesalers, and institutions through GrubMarket’s supply network
    - Product revenue / transaction volume
    - Publicly central to the business; exact audited mix undisclosed
    - Large scale but likely lower-margin than software
    - Request audited segment revenue and gross margin by distribution channel
  - - B2C delivery
    - Consumer-facing fresh-food delivery marketplace
    - Order revenue
    - Still described in analyst profiles but current audited scale not public
    - Potentially helpful for scale, unclear for margin quality
    - Request current B2C revenue contribution and profitability
  - - WholesaleWare SaaS
    - Recurring subscription for financial, inventory, ordering, and logistics workflows
    - Subscription fee
    - Publicly described; exact pricing and ARR undisclosed
    - Potentially higher-quality recurring revenue
    - Request current ARR, customer count, churn, and subscription price bands
  - - GrubAssist / enterprise AI
    - AI agents for orders, reporting, monitoring, and inventory management
    - Software subscription or module upsell
    - Publicly strategic; monetization details undisclosed
    - Could materially improve margin quality if adopted at scale
    - Request AI revenue contribution, attach rates, and renewal data
  - - Procurant SaaS / traceability
    - Procurement, compliance, and food-safety workflow software
    - Subscription / platform fees
    - Acquired asset with 850+ customers and $5.5B GMV network
    - High potential quality signal but GrubMarket mix impact not public
    - Request post-acquisition revenue, gross margin, and cross-sell adoption
  notes: Current value/status distinguishes what is publicly confirmed from what remains disclosure-light. Quality
    reflects revenue-quality expectations, not audited margin proof.
