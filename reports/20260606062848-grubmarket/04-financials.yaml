  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-current-financials
    missingEvidence: Audited FY2024 and FY2025 financial statements, including income statement, balance sheet,
      and cash-flow statement.
    whyItMatters: This is the single most important requirement for resolving revenue-quality and capital-adequacy
      uncertainty after the SEC settlement.
    diligencePath: Request the latest audited financial package, auditor letters, and management representation
      letters.
    relatedQuestionRefs:
    - QI009
    - QI021
    - QI025
  - type: private-evidence-only
    severity: material
    topic: cash-and-debt
    missingEvidence: Current unrestricted cash, debt balances, venture-debt terms, collateral, and covenant package.
    whyItMatters: Without cash and debt data, runway and financing dependency remain inference rather than analysis.
    diligencePath: Request treasury report, debt schedule, borrowing-base terms, and covenant compliance certificate.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI022
    - QI025
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-gross-margin
    missingEvidence: Segment revenue, gross margin, software ARR, and renewal metrics across wholesale, B2C, and
      SaaS layers.
    whyItMatters: This is the only way to test whether GrubMarket is structurally improving beyond commodity-distribution
      economics.
    diligencePath: Request management segment P&L, SaaS KPI dashboard, and post-Procurant integration reporting.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI019
    - QI025
  - type: conflicting-data
    severity: minor
    topic: total-capital-raised
    missingEvidence: A canonical financing chronology reconciling tracker disagreement on total capital raised.
    whyItMatters: Funding-total noise obscures dilution, preference-stack interpretation, and whether recent rounds
      are truly modest relative to history.
    diligencePath: Request signed financing chronology, cap table, and summary of primary vs secondary issuance
      by round.
    relatedQuestionRefs:
    - QI015
    - QI025
  - type: stale
    severity: material
    topic: post-settlement-control-verification
    missingEvidence: Independent evidence that the remediated controls described in 2025 company responses are functioning
      in current reporting cycles.
    whyItMatters: Management says controls improved, but external proof of sustained control quality is not public.
    diligencePath: Request control-testing memos, audit-committee minutes, and auditor commentary covering the post-remediation
      period.
    relatedQuestionRefs:
    - QI013
    - QI027
