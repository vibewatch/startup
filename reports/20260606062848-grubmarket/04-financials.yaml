- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited FY2024 and FY2025 income statement
    - Without audited topline and margin data, revenue-quality risk stays elevated
    - Obtain audited financial statements and management representation letters
  - - Current balance sheet and cash-flow statement
    - Liquidity and cash conversion cannot be assessed from EBITDA commentary alone
    - Request monthly cash-flow bridge and audited balance sheet
  - - Cash on hand and runway
    - Capital adequacy remains inferential rather than proven
    - Request treasury report and board runway pack
  - - Debt, venture debt, and covenants
    - Credit obligations may change equity risk materially
    - Request debt schedule, covenant package, and borrowing-base terms
  - - Revenue mix by wholesale vs software vs B2C
    - Core test of whether revenue quality is improving
    - Request segment revenue and gross margin detail
  - - Software ARR, renewal, and churn
    - Needed to price recurring high-quality revenue separately from volume
    - Request ARR waterfall and cohort retention metrics
  - - Post-SEC reconciliation of historical and current reporting controls
    - Necessary to restore confidence in investor-facing financial information
    - Request audit committee materials and control-remediation memos
  - - Full cap table and preference stack
    - Needed to judge how much of valuation is available to new investors
    - Request charter, side letters, preference summaries, and liquidation stack
  notes: These are not generic asks; each missing item directly affects the ability to underwrite revenue quality,
    margin durability, or capital adequacy.
