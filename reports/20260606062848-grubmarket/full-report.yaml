      - number: '4.3'
        title: Capital adequacy and financing context
        blocks:
          - type: paragraph
            body: >-
              The current funding context is better than a distressed read, but it is not transparent enough to clear
              capital adequacy. The company’s 2025 and 2026 announcements both present the new money as acceleration
              capital for AI, acquisitions, infrastructure, and global expansion. That fits the pattern of a company
              raising from perceived strength rather than trying to plug an obvious liquidity hole. The Form D history
              also shows GrubMarket has repeatedly used exempt private offerings at meaningful size, and the 2022 Form D
              in particular points to a much larger financing canvas than the most recent headline rounds alone would
              suggest.


              Even so, public capital-stack reconstruction is messy. Tracker sources disagree on total capital raised by
              hundreds of millions of dollars, and none of the retained public sources provide current cash on hand,
              monthly burn, debt balances, covenant terms, or runway. That missing information matters more than usual
              because management is simultaneously claiming self-sustaining profitability and continuing to fund
              acquisitions plus software expansion. Without audited cash and leverage data, the best that public
              evidence can say is that GrubMarket probably has better financing access than an early-stage startup and
              that investors still need direct diligence on liquidity before treating the business as clearly
              self-funded.
