  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a clear top-line thesis: GrubMarket is no longer just a digital produce
              reseller. Official pages, Y Combinator, and Sacra all describe a hybrid of B2B eCommerce, ERP software,
              enterprise AI, and acquired workflow tools. Sacra’s profile is especially useful here because it breaks
              the model into B2B eCommerce, B2C eCommerce, and SaaS. That matters because a pure food-distribution
              business and a distributor-plus-software business should not be underwritten the same way. The public
              growth narrative is also unusually large for a private company. TechCrunch and CNBC reported that revenue
              surpassed $2 billion in 2024 and that the company was on track for about $2.4 billion in 2025, while
              Perishable News quoted management describing a strong financial bottom line and a sustainable model.


              The catch is that these are still company-linked or management-quoted disclosures rather than audited
              public statements. They show scale and momentum, and they do help explain why the market accepted a $3.5
              billion Series G in 2025 and a $4.5 billion pre-money Series H in 2026. But they do not tell investors
              what share of revenue is low-margin distribution, what share is recurring software, how much gross profit
              sits inside the business, or how much of the growth is acquisition-driven. Public traction is therefore
              strong enough to frame the opportunity and too incomplete to close the case.
