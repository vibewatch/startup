  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Audit bridge fails
        - Audited FY2024-FY2025 revenue or EBITDA materially miss management claims
        - Removes the foundation for the current multiple
        - Re-rate toward bear case and stop treating the current round as fair value evidence.
      - - Down-round or punitive structure
        - Next financing is below the current mark or adds aggressive preferences
        - Signals private markets also reject the current premium
        - Anchor to the new price and re-underwrite from the reset cap table.
      - - Roll-up integration stalls
        - Acquisitions do not improve software attach, margins, or organic growth
        - Turns the story into scale without quality
        - Value the company closer to distribution comps, not platform comps.
      - - Fresh legal or quality issues
        - Open litigation, regulatory scrutiny, or quality incidents widen instead of shrinking
        - Extends the governance discount and hurts exit readiness
        - Raise required return and slow any underwriting process.
      - - Geography / product claims prove loose
        - Global-footprint or AI-product claims do not translate into measurable revenue quality
        - Weakens the premium narrative around software and reach
        - Cut premium assumptions and demand segment-level evidence.
      - - Capital intensity rises
        - Acquisition financing, working capital, or compliance needs consume more cash than expected
        - Compresses equity value even if revenue remains large
        - Require cash-flow bridge and downside liquidity plan before proceeding.
    notes: >-
      These are valuation-specific kill criteria rather than generic operating risks. Any one of them can move
      GrubMarket from upper-base-case to clear bear-case territory.
