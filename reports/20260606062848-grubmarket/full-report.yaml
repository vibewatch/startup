companyProfile:
  summary: >-
    GrubMarket is a San Francisco-based food-commerce and supply-chain software company founded in 2014 by Mike Xu. The
    business combines produce and food distribution, a large acquisition-led network of regional wholesalers, and a
    growing software suite that includes WholesaleWare ERP, GrubAssist, Orders IO, GrubPay, Farmigo, and newly acquired
    Procurant compliance and trading workflows. Public financing evidence shows a March 2025 Series G at more than a
    $3.5 billion valuation and a February 2026 Series H at a $4.5 billion pre-money valuation, while public revenue
    claims reached $2.0 billion in 2024 with a $2.4 billion 2025 trajectory and EBITDA profitability. The key debate is
    not whether GrubMarket has achieved meaningful scale, but whether current audited disclosure, integration
    discipline, and post-SEC control quality are strong enough to justify the valuation.
