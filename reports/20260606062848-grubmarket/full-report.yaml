  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Accounting-control and regulatory risk dominates the file
        blocks:
          - type: paragraph
            body: >-
              The key diligence risk is not generic startup volatility; it is a documented credibility breach in
              investor-facing financial reporting. The SEC's January 17, 2025 press release and settled order say
              GrubMarket used fundraising materials for its Series D that overstated 2016-2020 revenue by more than $550
              million while the company was also using materially lower figures for tax and credit-related purposes. The
              order is unusually damaging because it does not describe a loose marketing statement or a minor
              bookkeeping restatement. It describes a five-year working-versus-revised revenue table, a fundraising
              process that raised about $80 million, and a delay in telling Series D investors about the discrepancy
              until after the round closed.


              That history matters more in 2026 because GrubMarket is simultaneously asking the market to accept
              self-sustaining-profitability language, AI-upgrade rhetoric, and sharply higher private valuations. The
              right underwriting response is not to assume permanent fraud, but to apply a much higher burden of proof
              to every current revenue-quality and margin claim. A clean post-settlement audit trail, documented control
              remediation, and a segment-level reconciliation between low-margin distribution and higher-quality
              software revenue are therefore not nice-to-have diligence items; they are the first gating conditions for
              investment. Without them, later operating positives can only partially offset the disclosure scar.
            claimRefs:
