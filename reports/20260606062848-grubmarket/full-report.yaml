      - number: '8.2'
        title: Comparable lens, roll-up premium, and governance discount
        blocks:
          - type: paragraph
            body: >-
              Public-market context is what keeps the GrubMarket mark from looking outright cheap. Broadline food
              distributors remain low-multiple businesses: Sysco, US Foods, UNFI, and Performance Food Group all trade
              far below 1x trailing revenue on a market-cap-to-revenue basis. Instacart is the more generous public
              analogue because it pairs food commerce with software, ads, and a lighter-asset platform model, and it
              still trades around 2.5x trailing revenue. GrubMarket's 1.9x-2.25x implied range therefore sits between
              public distribution and public platform outcomes, which is exactly where a hybrid roll-up plus software
              story would want to be. The problem is that GrubMarket has not earned the right to be valued purely on
              platform optics. TechCrunch says the company has made more than 80 acquisitions, and 2025-2026 milestones
              such as Procurant and Schoenmann show why that can create real software and network leverage. But the
              SEC's 2025 enforcement action over approximately $550 million of overstated historical revenue means
              investors should attach a governance discount until current audited financials and controls are visible.
