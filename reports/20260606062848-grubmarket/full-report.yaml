      - number: '8.4'
        title: Diligence gates and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              That recommendation is explicitly evidence-sensitive. The diligence list is not abstract: investors need
              audited FY2024 and FY2025 statements, segment mix and gross margin disclosure, cap-table and
              liquidation-preference terms, and a walkthrough of how current controls differ from the legacy systems
              cited in the SEC settlement. They also need proof that GrubMarket's acquisition machine is creating
              software and cross-sell leverage rather than just piling scale onto a low-margin distribution base. The
              official website's narrower North America operating language versus funding materials' broader 70-country
              narrative reinforces the need to define exactly what international exposure means. The thesis breaks if
              GrubMarket has to raise again below the current mark, if reported revenue quality is materially weaker
              than management claimed, if acquired assets fail to deepen software monetization, or if open legal and
              quality signals widen. Until those diligence gates are cleared, the right discipline is to treat the
              current valuation as upper-end optionality, not hard proof of fair value.
