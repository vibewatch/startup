            body: >
              GrubMarket's public materials describe a genuinely multi-sided customer base rather than a single
              marketplace buyer. On the demand side, the company says its wholesale network sells across the U.S. and
              Canada to grocers, foodservice operators, schools, government buyers, local markets, and restaurants. On
              the supply and software side, its official materials position WholesaleWare, Orders IO, AI Orders,
