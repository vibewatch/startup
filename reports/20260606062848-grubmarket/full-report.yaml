      - number: '1.3'
        title: Funding history, valuation step-ups, and public scale markers
        blocks:
          - type: paragraph
            body: |-
              Public funding coverage shows a company that has repeatedly repriced upward even while remaining
              private and only partially transparent. GrubMarket’s own 2022 announcement said it raised $120 million
              at a valuation above $2 billion. TechCrunch and CNBC then reported a March 2025 Series G of $50 million
              at more than a $3.5 billion valuation. The company’s February 2026 Series H announcement described a
              further roughly $50 million raise at a $4.5 billion pre-money valuation. These are material valuation
              step-ups over a short period and support the case that investors view GrubMarket as one of the rare food
              supply-chain platforms still commanding large private-market enthusiasm.

              The catch is that public operating and capitalization markers remain noisy. Sacra estimates 2023 revenue
              at $2.0 billion and describes a customer footprint spanning 500 grocery stores, 8,000 restaurants, and
              2,000 corporate offices. Tracxn, meanwhile, lists total funding of $908 million, while Sacra reports
              roughly $569.95 million. Y Combinator shows a team size of 4,548, whereas LeadIQ surfaces a much smaller
              and internally inconsistent employee proxy. Those discrepancies do not erase the clear upward valuation
              trend, but they mean investors still need management-grade materials to reconcile funding totals,
              employee count, and current revenue quality before treating the public story as fully bankable.
