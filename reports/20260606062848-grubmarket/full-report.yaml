      - number: '2.2'
        title: 'Sizing lenses: from total food spending down to merchant-wholesale reality'
        blocks:
          - type: paragraph
            body: |-
              Multiple public lenses are required because no single source publishes "GrubMarket TAM." USDA ERS gives
              the broadest spend-based lens: $2.51 trillion of total U.S. food spending in 2025 and $1.10 trillion of
              food-at-home spending. ERS also shows that, for a typical consumer food dollar in 2024, wholesale and
              retail trade together captured 20.1 cents, with wholesale alone taking 6.3 cents. Those data points are
              useful because they show where distribution economics sit inside the broader food system. IBISWorld then
              offers the closest direct industry lens, estimating U.S. grocery wholesaling at $326.2 billion in 2026
              with 5,896 businesses and growth over the prior five years.

              These lenses should not be added together. They describe nested or overlapping boundaries rather than a
              single stack of independent revenues. The practical interpretation is that the broad food economy is huge,
              but the merchant-wholesale segment that most directly resembles GrubMarket’s core trading and fulfillment
              activity is far smaller and much more useful for underwriting. On top of that, FMI’s digital-engagement
              work suggests the commerce surface is still changing: in-store grocery remains dominant today, but online
              grocery is projected to grow meaningfully by 2028. That supports a view of GrubMarket as a platform riding
              both existing wholesale infrastructure and a longer digitization curve rather than a pure software TAM.
