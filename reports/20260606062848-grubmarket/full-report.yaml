      - number: '3.3'
        title: Switching costs and moat durability
        blocks:
          - type: paragraph
            body: >-
              The moat question is where the story gets more nuanced. GrubMarket does appear to have a real edge when it
              can bundle supply, ordering, ERP, and acquired software into one operating layer. That is the strongest
              interpretation of the Procurant acquisition and of the company’s software positioning on its own site and
              in partner profiles. But the same public record also shows why the moat should not be overstated. Food
              distribution is structurally competitive, publicly listed distributors repeatedly describe low margins and
              pricing pressure, and several alternatives let buyers unbundle the stack. A customer can source products
              from a broadliner, use Pepper for digital ordering or collections, use ProducePay or FBN for financing or
              sourcing transparency, and still avoid committing to one vertically integrated network.


              That means switching costs are probably medium, not absolute. They rise when GrubMarket owns the
              operational workflow and data model around purchasing, inventory, compliance, and supplier coordination.
              They fall when the buyer only sees GrubMarket as another route to wholesale product. The key diligence
              test is therefore not “does GrubMarket have competitors?”—it obviously does—but “how often does GrubMarket
              win because its integrated workflow meaningfully lowers labour, errors, spoilage, or purchasing friction
              versus assembling best-of-breed alternatives?” Public sources do not answer that directly, which is why
              moat durability should be treated as plausible but not fully proven.
            claimRefs:
              - CP023
