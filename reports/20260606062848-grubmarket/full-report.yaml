            body: >
              GrubMarket's public customer motion appears built around land-and-expand through workflow depth and
              acquisitions. Procurant provides a large installed base that GrubMarket explicitly says can connect to
              WholesaleWare, GrubAssist, Orders IO, and GrubPay. Coast Citrus and the Time100 coverage suggest acquired
