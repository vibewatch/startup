              while Farmigo targets CSA farms, herdshares, and food hubs that sell directly to members. The older
              GrubMarket marketplace surface and regional Doorganics storefront show that a consumer-facing delivery
              channel still exists alongside the B2B software motion.


              That segmentation matters because it implies GrubMarket can monetize multiple layers of the food supply
              chain at once: grower administration, distributor operations, buyer ordering, and downstream payments. The
              public buyer and user personas recur around produce operators, wholesale sales teams, route and inventory
              managers, and grocery or restaurant buyers who need ordering accuracy and customer-specific pricing. What
              remains missing is economic segmentation. Public materials do not break out how much revenue, gross
              profit, or customer count comes from software, acquired distribution subsidiaries, direct wholesale
