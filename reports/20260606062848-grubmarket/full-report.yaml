      - number: '6.4'
        title: Retention, repeat usage, and durability gaps
        blocks:
          - type: paragraph
            body: >
              Public durability evidence is materially weaker than public deployment breadth. Farmigo advertises renewal
              flows and member-retention cohort views as software features, which implies repeat-use workflows matter to
              its customers, but GrubMarket does not publish NRR, GRR, renewal rates, contract length, or cohort
              retention for the broader business. Independent review coverage is also shallow. The legacy GrubMarket iOS
              app shows a 3.0 out of 5 rating from 12 ratings, JustUseApp summarizes the app at 3.0 out of 5 with a
              heavily negative sentiment split, and GrubAssist has too few ratings to display an overview. SourceForge
              lists WholesaleWare as mobile and API-capable but with no ratings, while a Software Advice review page was
              blocked by security verification.


              BBB complaint data is adverse but noisy. It shows four complaints in the last three years, mostly
              delivery-related, and includes at least one complaint about a halted Southern California market and refund
              friction. But the same page also contains multiple complaints that appear to confuse GrubMarket with
              Grubhub, which weakens the signal quality of the channel. The net result is not proof of systemic churn;
              it is proof that public third-party durability evidence lags well behind the company's own account of
              customer breadth.
