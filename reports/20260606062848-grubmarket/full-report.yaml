      - number: '5.2'
        title: ERP, AI, and the operating core
        blocks:
          - type: paragraph
            body: >-
              The observable software core centers on WholesaleWare. GrubMarket markets it as a domain-specific ERP for
              wholesalers, distributors, and shippers, with inventory, warehouse, grower accounting, manufacturing, HR,
              and general ledger functions. That system-of-record claim is reinforced by the Spring 2026 release, which
              added automated work orders, new pricing controls, FIFO lot allocation, new operational reports, and EDI
              links to Produce Alliance and Restaurant365. Around that core sit two AI layers with distinct jobs. AI
              Orders handles inbound order capture across email, voicemail, and text, keeping a human review checkpoint
              before ERP sync. GrubAssist is the conversational layer: customer proof and the App Store listing position
              it as a voice-first assistant for reporting, charting, cash-flow analysis, and ordering. The architecture
              pitch is therefore operational rather than model-centric: GrubMarket is selling a workflow bundle that
              takes data from the ERP, automates order entry, and exposes decision support to sales, finance, and field
