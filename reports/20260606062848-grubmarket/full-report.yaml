  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternative set
        blocks:
          - type: paragraph
            body: >-
              GrubMarket competes in more than one market at the same time, which is why a single-peer framing is
              misleading. The official company surfaces and independent profiles describe a hybrid: national B2B
              wholesale distribution, ERP and AI software for wholesalers, and acquisition-led expansion into
              complementary platforms like Procurant. That means the real competitive set has at least four layers.
              First are national broadline incumbents such as Sysco, US Foods, UNFI, and Performance Food Group, which
              bring documented scale in customer locations, procurement reach, and delivery infrastructure. Second are
              digital retail-platform substitutes such as Instacart, which reduce friction for business buyers through
              no-contract ordering. Third are produce- or financing-adjacent specialists such as ProducePay and FBN,
              which attack specific sourcing, financing, and transparency pain points. Fourth are software-first
              enablers such as Pepper, which try to win the distributor workflow without owning the physical network.


              The practical implication is that GrubMarket is not fighting one canonical rival; it is fighting different
              alternatives depending on the buyer job. For a grocer or restaurant that wants broad catalog depth and
              dependable delivery density, the benchmark is the broadliner. For an urgent replenishment or small-basket
              business buyer, the substitute can be Instacart. For a distributor that mostly wants digitized order
              entry, promotions, and collections, Pepper is the more relevant comparison. And for producers or growers
              focused on financing and visibility, ProducePay or FBN may solve enough of the workflow to reduce
              GrubMarket’s edge. The chapter therefore treats competitor classes—not just logos—as the real unit of
              analysis.
