              Spring 2026 release reinforces that the company is still selling deeper into the installed base, with new
              functionality across WholesaleWare, Orders IO, and AI Orders for existing restaurant, foodservice, and
              produce-distributor customers. In other words, expansion seems to happen when GrubMarket layers software,
              AI, ordering, and payments onto already-won operating relationships.


              The concentration question is harder. Public materials repeatedly reference marquee retailers such as
              Walmart, Costco, Sam's Club, Target, Albertsons, Publix, Sprouts, and even an In-N-Out Burger supply link
