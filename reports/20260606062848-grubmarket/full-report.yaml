  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the current mark implies
        blocks:
          - type: paragraph
            body: >-
              The headline financing context is not ambiguous. GrubMarket raised roughly $50 million in a March 2025
              Series G at a post-money valuation above $3.5 billion, then raised another roughly $50 million in a
              February 2026 Series H at a $4.5 billion pre-money valuation. Management used both rounds to argue that
              the business had already crossed scale thresholds that justify a premium valuation: more than $2.0 billion
              of 2024 revenue, a $2.4 billion 2025 trajectory, EBITDA profitability, more than 12,000 employees, and
              activity across more than 70 countries. On the raw math, those claims place the Series H at about 2.25x
              reported 2024 revenue or about 1.9x 2025 revenue. That is high versus traditional distributors, but it is
              not obviously impossible for a business that combines commerce infrastructure, software, AI tooling, and
              acquisition-enabled scale. The real question is not whether the multiple can be defended in the abstract;
              it is whether the underlying revenue quality and margin claims deserve to be treated as investment-grade
              evidence.
            claimRefs:
