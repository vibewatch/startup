  evidenceGaps:
  - type: missing-source
    severity: material
    topic: produce-specific-sam
    missingEvidence: A credible public estimate for produce-specific wholesale software and workflow spend in the U.S.
    whyItMatters: Without it, GrubMarket’s true SAM remains a boundary exercise rather than a hard market number.
    diligencePath: Build SAM from live customers, category mix, software attach rate, and ARPA by workflow.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
    - TM005
  - type: private-evidence-only
    severity: material
    topic: compliance-demand
    missingEvidence: Pipeline data showing how much GrubMarket demand is driven by FSMA 204 or other compliance triggers.
    whyItMatters: Traceability clearly matters, but public sources do not show how much revenue opportunity it creates for GrubMarket specifically.
    diligencePath: Request CRM segmentation of compliance-led deals, product attach rates, and renewal behavior.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
    - TM005
  - type: stale
    severity: material
    topic: produce-market-frequency
    missingEvidence: A structured current time series for produce-specific wholesale GMV and margin pools tied to GrubMarket’s categories.
    whyItMatters: Headline weekly ad activity and trade coverage show volatility but do not quantify durable unit economics.
    diligencePath: Request internal category GMV, gross margin, spoilage, and geographic density by produce segment.
    relatedQuestionRefs:
    - QM017
    - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Customer-level ROI evidence for inventory AI, monitoring AI, traceability workflows, and Procurant integration.
    whyItMatters: Market interest in workflow automation does not prove customers will pay enough to justify software-style margins.
    diligencePath: Ask for case studies, cohort economics, and implementation-cost data by product module.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
