- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Omnichannel grocery growth
    - Positive
    - 2026-2028
    - Supports digital ordering and workflow software demand around grocery commerce
    - How much of GrubMarket revenue is tied to omnichannel grocery customers?
  - - FSMA 204 traceability requirements
    - Positive for software, negative for manual operators
    - Current
    - Forces better data capture, auditability, and process standardization
    - What portion of customers buy GrubMarket software for compliance reasons?
  - - Perishable inventory complexity
    - Positive for workflow tools
    - Structural
    - Makes inventory, reporting, and monitoring automation economically relevant
    - Can GrubMarket demonstrate measurable customer ROI by workflow?
  - - Buyer preference for physical produce inspection
    - Constraint
    - Structural
    - Slows any thesis that treats food buying as a fully digital behavior
    - Which categories are genuinely digital-first versus inspection-led?
  - - Fragmented counterparties and data quality
    - Constraint
    - Current
    - Raises implementation, onboarding, and data-normalization cost
    - How much services burden accompanies each software deployment?
  - - Industry competition and thin margins
    - Constraint
    - Structural
    - High competition in grocery wholesaling can limit take rates and pricing power
    - What gross-margin and retention profile is sustainable at scale?
  - - AI-enabled operational automation
    - Positive
    - Current
    - Creates product differentiation if AI tools solve real perishable workflows
    - What proportion of AI features are paid, adopted, and sticky?
  notes: >-
    GrubMarket’s market opportunity is driven as much by workflow pain and compliance pressure as by top-line

    commodity spend. Constraints remain structural rather than cyclical.
