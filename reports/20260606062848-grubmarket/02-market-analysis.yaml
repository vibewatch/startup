runDate: '2026-06-06'
company:
  name: GrubMarket
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The cleanest public boundary for GrubMarket is not the entire U.S. food economy but the overlap between

    grocery wholesaling, fresh and perishable distribution, and digitization or traceability workflows. Public

    sources put the broad food-spending pool at $2.51 trillion in 2025, food-at-home at $1.10 trillion, and the

    narrower U.S. grocery-wholesaling industry at $326.2 billion in 2026; that spread is large because the

    boundary changes materially with each lens. Market demand is supported by omnichannel grocery behavior and

    FSMA 204 traceability pressure, but adoption is constrained by perishability, fragmented counterparties,

    buyer preference for in-person selection, and limited public visibility into produce-specific software spend.
sections:
- id: market-boundary
  title: Market boundary and what GrubMarket is actually selling into
  body: >-
    The right market boundary for GrubMarket is multi-layered. At the broadest level, USDA ERS shows total

    U.S. food spending reaching $2.51 trillion in 2025, with $1.10 trillion spent on food at home and $1.41

    trillion on food away from home. That is useful as an outer envelope because GrubMarket touches food

    movement, not just one retail format. But it is too broad to call a realistic addressable market on its

    own because GrubMarket is not capturing all U.S. food consumption. The company is much more directly tied

    to merchant-wholesale, fresh and perishable distribution, and digitization of food-supply workflows.


    Public industry definitions support that narrower framing. IBISWorld defines grocery wholesalers as the

    middlemen between food producers and retailers, covering dry grocery, perishable food, and nonfood items

    found in grocery stores, while BLS places grocery and related product wholesalers inside NAICS 4244 under

    nondurable-goods merchant wholesalers. GrubMarket’s own model extends beyond that core because it also

    sells software, AI, and compliance-oriented workflows, but the wholesaling layer is still the best public

    starting point for TAM discipline. The consequence is that broad food spend should be treated as an upper

    context lens, whereas grocery wholesaling and related workflow digitization are the more actionable SAM

    lenses for diligence.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
