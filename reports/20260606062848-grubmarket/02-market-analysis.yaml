- id: drivers-constraints-and-open-gaps
  title: Growth drivers, adoption constraints, and unresolved sizing gaps
  body: >-
    The strongest public demand drivers are omnichannel grocery growth, the need for software around

    perishable operations, and regulatory traceability pressure. FMI and NIQ project online grocery-related

    sales to reach $452 billion and 25.5% of grocery-related sales by 2028, even while stores remain the main

    channel today. GrubMarket’s own AI-agent launches and Procurant acquisition line up with that trajectory:

    the market increasingly rewards distributors and wholesalers that can unify commerce, ERP, inventory,

    compliance, and analytics. FDA’s FSMA 204 rule reinforces the same direction by forcing more structured

    data capture and record availability across shipping, receiving, transformation, and other critical

    tracking events.


    But the market is not frictionless. Produce and perishable categories remain operationally messy, buyer

    trust still depends on physical selection, and companies preparing for FSMA 204 continue to describe data

    and process complexity as a real burden. Public sources are also still weak on one crucial point: there is

    no clean, widely trusted public figure for the portion of grocery-wholesale spend that is realistically

    reachable by platforms combining distribution and software. That unresolved gap does not negate the market;

    it simply means GrubMarket’s true SAM and software attach rate still need bottom-up customer and margin

    work rather than a single top-down headline.
  claimRefs:
  - CM031
  - CM032
  - CM033
  - CM034
  - CM035
  - CM036
  - CM037
  - CM038
  - CM039
