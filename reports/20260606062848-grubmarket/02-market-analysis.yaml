tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / boundary
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to GrubMarket
  rows:
  - - Total U.S. food spending
    - $2.51T in 2025 across food at home and food away from home
    - Non-food retail and non-U.S. food demand
    - Consumers, businesses, and government entities
    - Useful outer boundary only; too broad for direct TAM
  - - Food at home
    - $1.10T in 2025
    - Food-away-from-home demand and nonfood categories
    - Households and grocery-channel intermediaries
    - Closer to grocery and store-oriented demand
  - - Grocery wholesaling
    - $326.2B U.S. industry in 2026
    - Restaurants-only distribution outside grocery-wholesale definition and most pure software spend
    - Wholesalers, distributors, retailers
    - Best public core-market lens for GrubMarket trading activity
  - - Fresh produce / perishables workflows
    - Wholesale-market prices, movement, and merchandising activity
    - Stable center-store categories without produce-like perishability
    - Growers, shippers, wholesalers, grocers
    - High operational fit for GrubMarket’s produce roots and acquisitions
  - - Traceability and workflow software
    - Compliance, inventory, reporting, monitoring, and ERP workflows around physical food movement
    - General-purpose enterprise software not tied to food operations
    - Operations, compliance, finance, merchandising leaders
    - Explains why GrubMarket is more than a commodity distributor
  notes: >-
    Boundaries are intentionally nested rather than additive. The goal is to distinguish broad context from the

    narrower merchant-wholesale and workflow layers that better match GrubMarket’s model.
