- id: TM005
  title: Sizing contradictions and diligence gaps
  columns:
  - Question
  - Best public answer
  - Why it is incomplete
  - Near-term diligence path
  rows:
  - - What is the broadest market?
    - $2.51T total U.S. food spending in 2025
    - Too broad because it includes consumption GrubMarket cannot realistically monetize directly
    - Use only as contextual ceiling
  - - What is the closest public core market?
    - $326.2B U.S. grocery wholesaling industry in 2026
    - Misses software, AI, and compliance revenue pools around food workflows
    - Map current customer mix to NAICS-like channels
  - - What is the produce-specific wholesale software SAM?
    - No single robust public figure retained
    - Public sources separate commodity spend, wholesale markets, and software narratives
    - Build bottom-up SAM from current customers, categories, and ARPA
  - - How much of the opportunity is compliance-driven?
    - FSMA 204 is clearly material, but public spend data are limited
    - Rules are clear while budget capture rates are not
    - Ask management for compliance-led pipeline and win-rate data
  - - How much demand is digital-only versus hybrid?
    - Online grocery is growing, but stores still dominate and shoppers still want to inspect produce
    - Behavior data do not cleanly translate into wholesale software take rates
    - Segment adoption by category, customer type, and workflow
  notes: >-
    This table preserves the main analytical trap in the chapter: broad spend and narrow workflow TAM are not the

    same thing. A defensible GrubMarket SAM still requires management-level bottoms-up evidence.
