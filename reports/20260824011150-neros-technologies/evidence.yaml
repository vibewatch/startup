evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, investor control rights, liquidation preferences, and director list as of the Series C close.
    whyItMatters: >-
      Without governance data it is hard to assess founder control, investor influence, or downside protection that
      could shape later financing and exits.
    diligencePath: >-
      Request board list, Series B and Series C term sheets, and updated cap table directly from management or
      investors.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, operating burn, cash balance, and runway.
    whyItMatters: >-
      The company is clearly scaling, but the public record does not reveal whether scale is translating into healthy
      unit economics or repeated financing dependence.
    diligencePath: >-
      Obtain management financial package or data-room materials with monthly revenue, COGS, burn, and backlog by
      customer.
    relatedQuestionRefs:
      - QO026
  - type: conflicting-data
    severity: minor
    topic: marine-corps-order
    missingEvidence: A single authoritative public figure for the Marine Corps order's dollar value and unit count.
    whyItMatters: >-
      This contract is important as an early production proof point, and fuzzy unit economics make it harder to
      benchmark pricing and contribution margin.
    diligencePath: >-
      Seek the contracting notice, Marines budget line, or management confirmation that reconciles the official release
      with later press reporting.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: customer-mix
    missingEvidence: Precise split of deliveries between Ukraine, U.S. services, and allied countries over time.
    whyItMatters: >-
      Customer concentration and export dependence change how durable the current demand base is and whether the company
      is primarily policy-driven or battlefield-validated.
    diligencePath: Request shipment mix by geography and service branch, or obtain redacted delivery-order data by customer.
    relatedQuestionRefs:
      - QO019
  - type: stale
    severity: minor
    topic: autonomy-governance
    missingEvidence: >-
      Clear public documentation of how Archer AI and Bandit preserve human supervision and override under the latest
      2026 autonomy rules.
    whyItMatters: >-
      As Neros broadens from manual FPV to autonomy-assisted products, governance detail becomes part of procurement
      credibility and future regulatory resilience.
    diligencePath: >-
      Review technical concept-of-operations documents, safety cases, and customer evaluation reports for Archer AI and
      Bandit.
    relatedQuestionRefs:
      - QO027
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Public pricing per Archer unit, training package, software/autonomy package, and Bandit interceptor cost-per-kill.
    whyItMatters: >-
      Without pricing, the chapter can describe market size and demand direction but cannot prove gross-margin logic or
      SAM capture mechanics.
    diligencePath: Request current price lists, recent contract line items, and target gross-margin assumptions by product family.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: backlog
    missingEvidence: Committed backlog and option-exercise visibility beyond public award headlines and IDIQ ceilings.
    whyItMatters: >-
      Reachable market opportunity is only investable if there is evidence that visible demand is converting into funded
      recurring orders.
    diligencePath: Obtain backlog by customer, delivery-order cadence, renewal/option schedules, and cancellation terms.
    relatedQuestionRefs:
      - QM022
      - QM025
