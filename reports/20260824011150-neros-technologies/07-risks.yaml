chapter:
  number: 7
  title: Risks
  summary: Neros faces a severity-ranked risk stack dominated by policy dependence, industrial-scale execution, procurement-channel concentration, and limited public operating disclosure. The company is aligned with defense-drone demand, but that alignment itself creates exposure to trusted-list rules, Drone Dominance cost targets, export controls, and the challenge of filling Millennium One efficiently and safely.
sections:
- id: regulatory-legal-risks
  title: Regulatory and Legal Risk Stack
  body: 'Neros operates in a market where policy and procurement rules are not background conditions; they are part of the product. Blue UAS / DCMA qualification, foreign-component restrictions, export-control rules, and the tightening of autonomy-governance expectations all matter directly to revenue formation. The company benefits from this environment because it positions itself around secure supply and domestic or allied sourcing, but that same benefit becomes risk if the rules shift, the trusted-list pathway changes, or product features move faster than governance frameworks. The accessible public record also leaves legal-process blind spots. Relevant State Department and Federal Register pages were difficult to access at fetch time, which is itself a reminder that official rule detail is moving faster than the open-web diligence surface.


    The most important takeaway is that Neros'' regulatory moat is not a settled moat. It is a dynamic one. That is attractive when the policy tide is favorable and dangerous if it turns or becomes more demanding than management expects.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR010
  - CR011
  - CR031
  - CR035
  tableRefs:
