- id: people-execution-risks
  title: People and Execution Risks
  body: 'Neros is still visibly founder-centric, and its job openings show that the company is continuing to institutionalize functions that more mature defense suppliers already have built out. Hiring an autonomy lead, strategic finance staff, cybersecurity engineers, reliability engineers, and manufacturing-systems leaders is not a red flag by itself; it is normal for a scaling company. But it is evidence that critical functions are still being deepened while the business is already under major growth pressure. That creates a classic timing risk: expectations can outrun organizational maturity.


    The most important people risk is not one bad hire. It is whether the leadership team can build enough middle-layer operations, quality, and security capability fast enough to support factory-scale execution and more complex products. If not, the company could experience exactly the kinds of quality or delivery issues that change customer and investor sentiment quickly in defense hardware.'
  claimRefs:
  - CR015
  - CR016
  - CR027
  - CR028
  - CR029
  - CR037
  tableRefs:
  - TR004
  figureRefs: []
- id: financial-model-and-thesis-break-risks
  title: Financial-Model Risks, Residual Exposure, and Kill Criteria
  body: 'The Series C solves the near-term capital-access question better than it solves the economics question. Public evidence still does not reveal margin structure, burn, backlog quality, or customer concentration. That means the most important financial risks are model risks: fixed-cost absorption at Millennium, pricing pressure under Drone Dominance, policy-mediated procurement volatility, and the possibility that the company wins attention faster than it wins durable cash conversion. These are exactly the kinds of risks that create large outcome dispersion in defense manufacturing stories.


    The right investment posture is therefore to treat residual exposure as high until a few specific signals improve: repeated delivery orders, transparent quality performance, smoother documentation and support visibility, and evidence that low-cost scaled production is actually profitable rather than merely achievable. Without those signals, a policy change, price compression event, or operational stumble could break the thesis faster than the current narrative implies.'
  claimRefs:
