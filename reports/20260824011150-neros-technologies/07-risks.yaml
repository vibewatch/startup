  figureRefs:
  - FR001
- id: operational-quality-and-security
  title: Operational, Quality, and Security Risks
  body: 'Neros is trying to do several hard things at once: scale factory output dramatically, localize or secure more of the component stack, launch autonomy-enhanced products, and participate in procurement structures that reward low cost at high speed. Any one of those would be a major execution challenge. Together they create a high-complexity operating model. Millennium One is the clearest illustration. It could be the company''s defining asset, but it also raises the stakes around hiring, process control, yield, quality, and working capital. A factory this ambitious does not fail all at once; it fails through missed throughput, component bottlenecks, training burdens, or support weakness.


    Public cyber and privacy evidence is better than zero but still incomplete. The privacy policy shows a baseline seriousness around support-data handling and government disclosures. Yet formal public assurance artifacts remain thin relative to the defense-critical nature of the missions. The result is a company whose public trust posture looks directionally appropriate but not fully inspectable.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR020
  - CR021
  - CR022
  - CR023
  - CR034
  - CR036
  - CR037
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-and-dependency-risks
  title: Partner, Procurement, and Ecosystem Dependencies
  body: 'A large share of Neros'' risk sits outside the boundaries of its own org chart. Trusted-list administration, DLA procurement infrastructure, Army and ATEC test facilities, and broader Drone Dominance mechanics all influence whether the company can move quickly from product fit to funded fielding. That does not mean Neros lacks agency; it means its agency is mediated by institutional systems. The company also depends on secure components, payload integrations, and likely partner ecosystems to expand into adjacent mission sets. The CX2 and Kela-style stories point to a future in which mission breadth increasingly depends on external module or payload relationships.


    This dependency profile is manageable if Neros remains a favored supplier inside the ecosystem. It becomes dangerous if the ecosystem starts preferring larger or more documented alternatives. That is why domestic substitutes and public incumbents matter as risk indicators even when they are not direct like-for-like rivals.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR024
