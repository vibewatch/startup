      topic: financial-disclosure
      missingEvidence: "Audited revenue, gross margin, operating burn, cash balance, and runway."
      whyItMatters: "The company is clearly scaling, but the public record does not reveal whether scale is translating into healthy unit economics or repeated financing dependence."
      diligencePath: "Obtain management financial package or data-room materials with monthly revenue, COGS, burn, and backlog by customer."
