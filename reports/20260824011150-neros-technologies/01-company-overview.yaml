callouts:
  - calloutType: strength
    title: "Founder-market fit is unusually authentic"
    body: "Neros was built by founders with native FPV racing and electronics backgrounds rather than by legacy defense generalists. That shows up directly in the company’s emphasis on modularity, in-house radios, manufacturability, and battlefield feedback loops."
    claimRefs: [CO001, CO002, CO003, CO009]

  - calloutType: strength
    title: "Manufacturing is the core moat, not just the drone"
    body: "Project Millennium and the company’s repeated stress on secure subcomponents suggest Neros is trying to own industrial throughput as its durable advantage. If Millennium One ramps on plan, the company could become more strategically valuable as a domestic manufacturing node than as a single-product FPV vendor."
    claimRefs: [CO022, CO023, CO025, CO026, CO030]

  - calloutType: risk
    title: "Orders are real, but backlog visibility is still limited"
    body: "The Army’s $500M contract is an IDIQ ceiling, not a guaranteed purchase commitment. Public evidence proves procurement access and early delivery orders, but not a fully contracted path to the one-million-drones-per-year capacity aspiration."
    claimRefs: [CO016, CO024, CO035]

  - calloutType: risk
    title: "Autonomy governance is tightening while the product roadmap expands"
    body: "As Neros broadens from manually piloted FPV systems toward Archer AI and Bandit, the regulatory burden around human judgment, testing, and operator override is increasing. That matters because the company’s value narrative increasingly depends on autonomy-assisted warfare rather than only cheap airframes."
    claimRefs: [CO027, CO028, CO029, CO036]

