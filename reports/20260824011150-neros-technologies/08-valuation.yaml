- id: exit-paths-and-proof-points
  title: Exit Paths, IPO Readiness, and the Proof Points Required From Here
  body: 'From the current position, the most believable path is not an immediate public offering. It is another private re-rating or a structured liquidity event after more operating evidence accumulates. Public-market comparables show why. AeroVironment and Red Cat can be debated on valuation, but their investors at least have filings, revenue recognition detail, and cadence of public proof points. Neros does not yet offer that level of visibility. For an IPO case to become credible, investors would need backlog roll-forwards, customer concentration disclosure, revenue mix, gross-margin structure, burn profile, and evidence that Bandit and Archer AI are contributing more than roadmap optionality.


    A strategic sale is possible, especially if a larger defense prime or public platform values Neros'' trusted manufacturing base. Still, management behavior and current financing scale suggest the company is pursuing independence and much larger strategic ambition. That means the practical diligence task is to define milestone gates for any future mark. Those gates are concrete: delivery-order cadence under major contracts, repeat customer purchases, margin evidence, product-mix expansion, and allied revenue. If those appear quickly, the current round can age well. If they do not, the mark could begin to look more like an optimism premium than a justified step-up.'
