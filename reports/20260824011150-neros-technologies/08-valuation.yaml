- id: comparable-set-and-market-context
  title: 'Comparable Set: Direct Defense Peers First, Adjacent Deep Tech Second'
  body: 'The cleanest direct private benchmark is not a perfect one. Shield AI and Skydio operate with stronger autonomy legibility and, in Skydio''s case, public statements about hundreds of millions in revenue and improving unit economics. That makes them useful upper references for what the market will pay when software depth and operating maturity are clearer. Firestorm is useful in the opposite direction: it shows private capital still funding manufacturing-first defense stories, but at a much earlier stage and with a much smaller funding base. Public companies provide a different kind of anchor. AeroVironment''s disclosures show what mature defense-drone scale looks like in revenue and backlog. Red Cat shows a smaller public benchmark where economics are visible but still early. Together they imply that Neros deserves a premium to raw prototype narratives, but not a premium that ignores the absence of public operating numbers.


    Adjacent deep-tech rounds such as Proxima Fusion, TAE, and Tokamak Energy are contextual rather than direct comps. They matter because they show 2026 private markets still have appetite for capital-intensive industrial platforms when the category story is strong. They do not solve the defense-drone comp problem. Neros still has to be judged mainly against defense demand signals, procurement trust, and public aerospace-defense disclosure standards rather than against generic frontier-tech enthusiasm.'
