- id: valuation-drivers-and-haircuts
  title: Why the Valuation Can Work — and Why It Still Needs Heavy Haircuts
  body: 'The strongest part of the valuation case is that Neros already appears to have crossed the line from lab promise to program relevance. Army and Marine traction, Blue UAS trust signals, Drone Dominance demand, and Millennium''s factory ambition all create genuine scarcity value. A commodity framing misses this. Neros is not pitching itself as a generic airframe shop; it is pitching itself as a trusted domestic supply-and-production platform for wartime attritable drones. If that positioning is real, the option value is substantial. It could support repeat orders, allied channels, and higher-value product adjacencies.


    But those positives still need material haircuts. The Army ceiling is not backlog. Production pace is not profit. A giant factory can be a moat or a burden depending on utilization. Software-style venture multiple logic is also inappropriate because the public evidence does not show recurring software economics, audited high gross margins, or a clear installed-base monetization model. The right underwriting posture is blended and conservative: credit the company for strategic scarcity, current procurement traction, and policy tailwinds, then apply wide valuation bands because the public record remains weak on economics. That combination explains why the round can be both aggressive and still defensible. It also explains why follow-on capital should be milestone-gated rather than assumed.'
