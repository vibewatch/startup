summary:
  headline: >-
    Neros Technologies is a high-conviction defense-tech drone company that combines an explosive Series C valuation
    ($2.5B) with credible evidence of active US military deployments, genuine production scale, and strong investor
    backing from Sequoia and defense-oriented funds. The primary risks are DoD budget concentration, execution risk on
    the 1M drones/year target, and regulatory/competition exposure from larger primes. Recommend watch with active
    follow-on interest.
