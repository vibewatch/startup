            body: >-
              Shield AI is the highest-ambition strategic reference point. It has enormous capital, a large autonomy
              story through Hivemind, and more public proof across aircraft classes. But it is not trying to be a pure
              FPV attrition company. Skydio sits in a different but important adjacent lane: tactical ISR, docked
              autonomy, and workflow-heavy software for public safety and national security. Red Cat/Teal is arguably
              the clearest near-field competitor because it sells American-made, Blue-UAS tactical systems into
              overlapping trust-sensitive buyers. Firestorm is a competitive warning from another direction:
              industrial-system design may become just as important as airframe specs.


              The incumbent substitutes matter because buyers do not reset procurement history each cycle. Teledyne FLIR
              owns a strong soldier-borne ISR niche with Black Hornet. AeroVironment remains a benchmark for
              defense-drone and loitering-munition credibility at scale. Compared with this field, Neros looks younger,
              narrower, and less software-developed—but more authentically focused on attritable mass and battlefield
