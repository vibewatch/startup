  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Neros is not selling a single drone in isolation. The public materials show a workflow product made up of
              airframes, control layers, mission software or autonomy assistance, training, and a manufacturing system
              meant to keep replenishment flowing. Archer and Archer Strike are the most visible battlefield tools, but
              they are only usable in practice because they sit with Crossbow or Flatbow control layers and are
              increasingly supported by autonomy enhancements like Archer AI. Bandit extends the workflow into drone
              defense rather than just strike. This matters because the company's real customer promise is not “here is
              an aircraft,” but “here is a low-cost, secure, scalable mission loop you can train, field, and replace
              quickly.”


              That workflow framing helps reconcile why Neros keeps talking about manufacturing. For a consumable or
              attritable system, factory design and secure component availability are part of product performance. A
              customer that cannot reorder quickly, trust the supply chain, or integrate the controls into training does
              not really have a finished military product. Neros seems to understand that, which is why the product
              narrative always bleeds into process and industrial capacity.
