      - number: '2.5'
        title: Constraints, Contradictions, and What Public Data Still Cannot Prove
        blocks:
          - type: paragraph
            body: >-
              A hot market does not eliminate friction. Counter-UAS buyers still face certification, spectrum
              coordination, mitigation authority limits, privacy constraints, and real-world training burdens. Military
              procurement remains staged and procedural even when urgency is genuine. That matters because public
              excitement around drones often treats demand as immediate revenue when, in practice, it still has to move
              through testing, budget allocation, and multi-step contract vehicles. Neros also faces a market-definition
              problem of its own success: every bullish market statistic can be used to tell a large story, but many of
              those dollars sit in layers of the stack or geographies that the company cannot yet reach.


              The contradictions in the TAM data should therefore be preserved, not averaged away. They tell investors
              that the category is early, noisy, and still being defined by warfare and regulation in real time. Public
              data also leaves two commercially central questions unanswered: what Neros is actually charging per system
              or per training package, and how much committed backlog exists beyond publicly discussed orders and
              ceilings. Until those are known, the market chapter should conclude that the demand environment is strong
              and structurally improving, but that the company's precise SAM capture and monetization curve remain
              inference rather than verified fact.
