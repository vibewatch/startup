      - number: '3.3'
        title: Capability, Pricing, Distribution, and Trust Posture
        blocks:
          - type: paragraph
            body: >-
              Capability comparisons in this market are often apples-to-oranges, but a few patterns are clear. Shield AI
              leads on autonomy breadth and high-end software branding. Skydio leads on polished ISR workflows, docks,
              and software-led operations. Red Cat/Teal and Teledyne FLIR lead on crisp Blue-UAS ISR trust posture.
              Neros leads on public claims about attritable strike production velocity, domestic component control, and
              the willingness to build around replenishment economics rather than around premium drone margins. Bandit
              gives Neros a fresh opening in counter-UAS, but also drags it into a larger ecosystem where integrated
              systems vendors may have structural power.


              Pricing transparency is weak across nearly every peer that matters. Most vendors sell through quotes,
              programs, and bundles rather than through posted unit prices. That pushes competitive analysis toward
              mission fit, software integration, logistics, and support rather than list price. Distribution power still
              matters, and here Neros is not the default leader. Incumbents and better-funded rivals often have more
              reference buyers, more partner leverage, and more formal procurement pathways.
