  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Monetization, and What Is Actually Visible
        blocks:
          - type: paragraph
            body: >-
              Neros almost certainly has a multi-line revenue model, but the public evidence is much clearer on what it
              sells than on how it prices or recognizes revenue. The most visible streams are Archer-family drone
              hardware, related control systems such as Crossbow or Flatbow, training and support tied to U.S. military
              orders, and future roadmap products like Archer AI and Bandit. Public materials also imply potential
              revenue from accessories, localization or sovereign manufacturing partnerships, and component-oriented
              work as Millennium scales. Even so, the current mix looks heavily hardware-led. Every major announcement
              is framed through systems, orders, production ramps, or deployment timelines rather than through software
              ARR or recurring licenses.


              That does not mean software and services are irrelevant. In defense drone markets, training, integration,
              and support often make revenue stickier and less episodic than pure hardware sales. But the public record
              does not quantify how much of Neros' gross profit comes from those attachments. The right financial
              starting point is therefore a hardware-first defense supplier with service attachments and future autonomy
              monetization, not a pure software company wearing a drone wrapper.
