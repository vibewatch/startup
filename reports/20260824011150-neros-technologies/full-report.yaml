      - number: '1.5'
        title: Milestones, Strategic Direction, and Early Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern from 2023 through 2026 is coherent: founding and garage-stage iteration in 2023,
              initial facility opening and seed disclosure in 2024, funding acceleration and first major procurement
              validation in 2025, then industrial-scale ambition and product broadening in 2026. Each step reinforced
              the same core thesis rather than changing it. The company’s early writings and later funding announcements
              consistently return to four motifs: mass manufacturability, battlefield feedback from Ukraine, allied or
              domestic sourcing, and low-cost systems that can be purchased in the thousands rather than the dozens.

              The most strategically significant 2026 shift is that Neros is broadening from one-way strike and
              reconnaissance products into counter-UAS and multi-asset autonomy. Archer AI moves the product line closer
              to assisted autonomy in contested electromagnetic environments, while Bandit opens a path into interceptor
              economics, where the central challenge is not just flight performance but achieving a low enough
              cost-per-kill to defeat cheap incoming drones sustainably. Tectonic’s reporting on the CX2 partnership
              adds another angle: Neros is also experimenting with RF-seeking and target-location payloads that extend
              Archer into “find, fix, finish” roles for special operations buyers.

              The adverse context is not merely ethical, although that matters. Arms Control Association’s coverage of
              the Senate’s 2026 autonomous-weapons framework shows the regulatory burden around human judgment, operator
              override, and test validation is tightening rather than loosening. Separately, Dronexl’s skeptical
              treatment of the Army contract correctly highlights that an IDIQ ceiling is not a guaranteed revenue
              commitment. In other words, Neros has solved the early-stage “can anyone build this?” question more
              convincingly than it has solved the late-stage “how much of this demand is durable, contracted, and
              profitable?” question. That is still a positive company-overview outcome for a 2023 startup — but it keeps
              the case in high-growth, high-execution-risk territory rather than turning it into a settled industrial
              winner.
            claimRefs:
