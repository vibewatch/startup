      - number: '2.2'
        title: Sizing the Opportunity with Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The public market data is useful only when handled as a set of lenses rather than a single answer. StartUs
              places the military-drone market at $22.81 billion by 2030, while MarketsandMarkets places the broader
              military-drone market at $34.85 billion in 2026 and $109.22 billion by 2031. Counter-UAS estimates are
              equally dispersed: MarketsandMarkets shows a $9.17 billion market in 2026 growing to $29.70 billion in
              2031, while TheWorldData compiles a lower 2026 base and a wider long-term range. These are not necessarily
              mutually exclusive numbers; they mostly reflect different scope choices, regional assumptions, and
              inclusion of different technology layers.


              For Neros, the more decision-useful sizing lens is the budget and replenishment logic beneath the TAM.
              StartUs reports a $13.4 billion autonomy line in the FY2026 U.S. defense request, including $9.4 billion
              for unmanned and remotely operated aerial vehicles and $3.1 billion for counter-UAS. It also highlights
              Ukraine's move from 1.5 million FPV purchases in 2024 toward a planned 4.5 million in 2025. Those figures
              do not directly convert into Neros revenue, but they explain why the company believes million-unit annual
              manufacturing is a rational ambition rather than a publicity stunt. The market is behaving more like a
              munition and industrial-capacity market than a classic aircraft market.
