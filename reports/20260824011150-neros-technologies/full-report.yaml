  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and False TAM Traps
        blocks:
          - type: paragraph
            body: >-
              Neros should be analyzed inside a very specific defense market, not inside the broad civilian or even
              broad military-drone universe. The included spend is the spend that sits around attritable FPV strike and
              reconnaissance platforms, their control stations and autonomy layers, and the adjacent low-cost kinetic
              counter-UAS systems needed to stop similar threats. That is a real and expanding category, but it is still
              only a subset of what most analyst reports call the drone market. MarketsandMarkets' military-drone number
              includes small, tactical, and strategic aircraft, while counter-UAS reports include detection networks, RF
              sensing, command software, fixed-site installations, and mitigation tools. Neros does not currently span
              that full stack.


              The practical implication is that almost every headline market estimate available in public will overstate
              Neros' reachable opportunity if used without adjustment. Neros is not selling consumer drones,
              agricultural drones, cargo UAVs, or MQ-9-class systems. It also is not yet a full-spectrum counter-UAS
              prime. Bandit is strategically important because it gives Neros a position in the counter-drone market,
              but it does not make the company a provider of every sensor, effector, and control layer in that
              ecosystem. The right boundary is therefore narrower, but also more urgent: low-cost, replenishable,
              battlefield-relevant airframes and interceptors purchased in quantity by defense and allied security
              buyers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
