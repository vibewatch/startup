      - number: '7.5'
        title: Financial-Model Risks, Residual Exposure, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The Series C solves the near-term capital-access question better than it solves the economics question.
              Public evidence still does not reveal margin structure, burn, backlog quality, or customer concentration.
              That means the most important financial risks are model risks: fixed-cost absorption at Millennium,
              pricing pressure under Drone Dominance, policy-mediated procurement volatility, and the possibility that
              the company wins attention faster than it wins durable cash conversion. These are exactly the kinds of
              risks that create large outcome dispersion in defense manufacturing stories.


              The right investment posture is therefore to treat residual exposure as high until a few specific signals
              improve: repeated delivery orders, transparent quality performance, smoother documentation and support
              visibility, and evidence that low-cost scaled production is actually profitable rather than merely
              achievable. Without those signals, a policy change, price compression event, or operational stumble could
              break the thesis faster than the current narrative implies.
