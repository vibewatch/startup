      - number: '4.2'
        title: Sales Motion, Cycle Compression, and Public Traction Proxies
        blocks:
          - type: paragraph
            body: >-
              Neros' sales motion appears unusually efficient for a company founded in 2023. The path visible in public
              sources is validation through Blue UAS and DIU-style trust gates, then operator intimacy, then
              increasingly large government buying vehicles. The Army pathway is the clearest example: PBAS selection,
              then a larger IDIQ, then statements about initial orders in the thousands and the possibility of much
              larger volumes. DLA's drone marketplace and procurement-assistance infrastructure matter here because they
              reduce friction between buyer need and purchase execution. If approved systems can move from discovery to
              order in days rather than months, working capital recycles faster and the supplier can scale with less
              cash trapped in long sales cycles.


              Traction metrics are also unusually tangible compared with many defense startups. The company has public
              claims around current production rate, monthly targets, Army orders, and an aggressive 2028 output
              ambition. Those are not audited revenue numbers, but they are much better demand proxies than abstract
              pipeline language. They support the view that Neros already sits beyond the science-project stage, while
              still short of the disclosure level needed for true financial underwriting.
