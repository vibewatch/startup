            body: >-
              Neros does not publish net revenue retention, gross retention, or churn. That means customer durability
              has to be inferred from behavior rather than from SaaS-style metrics. The best evidence is repeat
              procurement logic: Army engagement progressed through multiple stages, the company is supporting operator
              competitions and workflows, and the infrastructure around Blue UAS, DCMA, DLA, and Drone Dominance is
              making repeat military adoption easier rather than harder. The UK subsidiary also suggests that management
              is trying to turn customer expansion into a sovereign-market strategy rather than relying entirely on ad
              hoc exports.


              Still, durability limits are real. We do not know which allied countries are active, which SOCOM
              components are buying, how large non-Army accounts are, or whether battlefield-driven relationships renew
              on normal program cycles. In addition, public customer evidence is so defense-heavy that budget timing and
              procurement policy are effectively retention variables. The result is a customer base that looks exciting
              and increasingly repeatable, but still under-disclosed in the ways investors normally use to prove
              resilience.
            claimRefs:
              - CU011
              - CU015
              - CU016
              - CU017
              - CU018
