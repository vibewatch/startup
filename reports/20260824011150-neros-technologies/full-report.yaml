      - number: '8.4'
        title: Exit Paths, IPO Readiness, and the Proof Points Required From Here
        blocks:
          - type: paragraph
            body: >-
              From the current position, the most believable path is not an immediate public offering. It is another
              private re-rating or a structured liquidity event after more operating evidence accumulates. Public-market
              comparables show why. AeroVironment and Red Cat can be debated on valuation, but their investors at least
              have filings, revenue recognition detail, and cadence of public proof points. Neros does not yet offer
              that level of visibility. For an IPO case to become credible, investors would need backlog roll-forwards,
              customer concentration disclosure, revenue mix, gross-margin structure, burn profile, and evidence that
              Bandit and Archer AI are contributing more than roadmap optionality.


              A strategic sale is possible, especially if a larger defense prime or public platform values Neros'
              trusted manufacturing base. Still, management behavior and current financing scale suggest the company is
              pursuing independence and much larger strategic ambition. That means the practical diligence task is to
              define milestone gates for any future mark. Those gates are concrete: delivery-order cadence under major
              contracts, repeat customer purchases, margin evidence, product-mix expansion, and allied revenue. If those
              appear quickly, the current round can age well. If they do not, the mark could begin to look more like an
              optimism premium than a justified step-up.
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV042
          - type: table
            tableRef: TV004
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV042
          - type: table
            tableRef: TV008
            claimRefs:
              - CV010
              - CV026
              - CV031
              - CV032
              - CV038
      - number: '8.5'
        title: Valuation Verdict
        blocks:
          - type: paragraph
            body: >-
              The public verdict is that Neros' valuation is bold, but not absurd. The company has more demand proof
              than a typical young hardware startup, more strategic relevance than a generic drone maker, and more
              manufacturing ambition than most private peers. Those strengths justify a substantial premium to
              early-stage industrial stories. They do not justify pretending that the economic questions are already
              solved. The company still lacks public evidence on revenue scale, gross margin durability, working-capital
              strain, backlog quality, and concentration risk. Investors should therefore resist treating the current
              round as validation that every piece of the model works. It is validation that sophisticated capital wants
              exposure to the possibility that Neros becomes a category-defining trusted supplier.


              That makes the correct stance one of disciplined optimism. If an investor can size exposure appropriately
              and demand milestone-based follow-through, the current mark can still produce a good outcome because the
              company may grow into it quickly. If an investor needs clean present-day financial comparability, the
              evidence is still too thin. The best mental model is neither commodity hardware nor mature autonomy
              software champion. It is a real-option bet on whether Neros can convert trusted access, factory scale, and
              demand urgency into durable economics before the narrative outruns the numbers.
            claimRefs:
              - CV006
              - CV029
              - CV031
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV038
              - CV039
              - CV040
