      - number: '1.3'
        title: Products, Manufacturing System, and Industrial Expansion
        blocks:
          - type: paragraph
            body: >-
              Neros’ product set expanded materially between 2024 and 2026. The early configuration centered on Archer
              and Crossbow: Archer as the core FPV platform and Crossbow as the control station. By late 2025 the Army
              PBAS package included Archer and Archer Strike variants plus Flatbow, an upgraded soldier-borne control
              system. By August 2026 the company added Archer AI — which layers terminal guidance and GPS-denied
              position hold onto the FPV architecture — and Bandit, a counter-UAS interceptor targeting Class 2 and 3
              threats including Shahed-style systems. A separate Archer Fiber collaboration with Kela also signals
              willingness to extend the platform through partnership when battlefield requirements demand alternative
              link architectures.

              The manufacturing story is at least as central as the product story. Company posts consistently emphasize
              vertical integration, domestic or allied sourcing, in-house radios, and deliberate avoidance of Chinese
              components at the chip level. Forbes, Dronexl, and company materials all frame that China-free or
              China-minimized supply chain as both a procurement differentiator and a strategic necessity. Neros argues
              that merely assembling a drone in the United States is insufficient if the critical electronics stack
              still depends on Chinese microelectronics or subassemblies. That thesis aligns with the regulatory and
              procurement environment, where DIU’s Blue UAS framework and the FCC’s 2026 national-security push
              increasingly reward transparent domestic or allied sourcing.

              Project Millennium is the clearest expression of Neros’ ambition. The company says Millennium One will
              multiply output capacity by roughly 100x from the legacy 15,000-square-foot footprint and serve not only
              as an assembly site but as a secure component-production base that could de-risk supply for other domestic
              OEMs. The ambition is extraordinary relative to the company’s age. It is also the point where narrative
              risk enters: building a million-drone-per-year factory is easier to announce than to fill with committed
              orders, qualified labor, and predictable component flows. Even so, the combination of Army demand signals,
              Ukraine-linked learning loops, and repeated capital raises suggests the manufacturing expansion is not a
              purely speculative branding exercise.
