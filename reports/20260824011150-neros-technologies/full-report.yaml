  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Neros does not compete against one clean peer set. The direct peers are tactical defense-drone vendors
              like Red Cat/Teal and, in some procurement lanes, Skydio. The strategic adjacencies include autonomy-led
              firms like Shield AI and manufacturing-led challengers like Firestorm. The substitutes include public
              incumbents such as AeroVironment and Teledyne FLIR, plus layered counter-UAS providers that Bandit will
              increasingly encounter. That mix matters because it means Neros is rarely compared on a single dimension.
              In one procurement it will be judged against trusted ISR systems; in another it will be judged against
              autonomy software narratives; in another it will be judged against low-cost interceptor economics or even
              conventional air-defense alternatives.


              The landscape is therefore best read as mission-layered. Neros is strongest where buyers care about
              attritable strike volume, rapid production scaling, and trusted domestic components. It is weaker where
              buyers want a mature installed base, highly legible enterprise software, or a broad portfolio with long
              procurement history. The competitive question is not whether Neros can beat every rival on every metric.
              It is whether it can defend a narrow but strategically important wedge before larger or better-funded
              players absorb the category.
