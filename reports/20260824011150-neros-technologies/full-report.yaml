  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Mark, Rerating Speed, and What Investors Are Actually Buying
        blocks:
          - type: paragraph
            body: >-
              Neros' August 2026 Series C is not just another increment of venture funding. At $250 million raised and a
              $2.5 billion post-money valuation, the round establishes the company as one of the most highly valued
              private defense-drone manufacturers of its age. The key point is not simply that the price is high, but
              what that price assumes. Public evidence suggests investors are underwriting three things at once:
              immediate procurement pull around Archer-family systems, the possibility that Project Millennium creates
              an unusually important U.S. drone-manufacturing node, and the optionality that Archer AI and Bandit evolve
              the company beyond a single-product FPV supplier. The speed of rerating matters. Neros moved from a
              roughly $839 million Series B in late 2025 to a $2.5 billion Series C about nine months later. That is a
              dramatic step-up for a company with limited public financial disclosure.


              The implication is that the current mark is based less on clean revenue underwriting than on belief that
              trusted domestic scale in this category will be scarce and strategically valuable. That is not
              unreasonable, but it is aggressive. The public record proves demand, policy momentum, and unusual
              execution speed; it does not yet prove margins, backlog quality, or cash efficiency. Investors are
              therefore not paying for historical reporting quality. They are paying for the right to own a company that
              could become one of the few trusted, domestic, industrial-scale drone suppliers if present demand signals
              mature into durable buying programs.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV024
              - CV038
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
      - number: '8.2'
        title: 'Comparable Set: Direct Defense Peers First, Adjacent Deep Tech Second'
        blocks:
          - type: paragraph
            body: >-
              The cleanest direct private benchmark is not a perfect one. Shield AI and Skydio operate with stronger
              autonomy legibility and, in Skydio's case, public statements about hundreds of millions in revenue and
              improving unit economics. That makes them useful upper references for what the market will pay when
              software depth and operating maturity are clearer. Firestorm is useful in the opposite direction: it shows
              private capital still funding manufacturing-first defense stories, but at a much earlier stage and with a
              much smaller funding base. Public companies provide a different kind of anchor. AeroVironment's
              disclosures show what mature defense-drone scale looks like in revenue and backlog. Red Cat shows a
              smaller public benchmark where economics are visible but still early. Together they imply that Neros
              deserves a premium to raw prototype narratives, but not a premium that ignores the absence of public
              operating numbers.


              Adjacent deep-tech rounds such as Proxima Fusion, TAE, and Tokamak Energy are contextual rather than
              direct comps. They matter because they show 2026 private markets still have appetite for capital-intensive
              industrial platforms when the category story is strong. They do not solve the defense-drone comp problem.
              Neros still has to be judged mainly against defense demand signals, procurement trust, and public
              aerospace-defense disclosure standards rather than against generic frontier-tech enthusiasm.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
