companyProfile:
  summary: >-
    Neros Technologies is a Torrance, California-based autonomous drone company that designs and manufactures AI-enabled
    unmanned aerial vehicles for US and allied military customers. Founded by CEO Soren Monroe-Anderson and a team of
    drone racing veterans turned defense engineers, Neros has grown rapidly from a startup to a $2.5 billion company in
    approximately three years by addressing the military's urgent need for affordable, mass-producible combat drones.
    Its flagship products — the Archer AI FPV combat drone and the Bandit counter-drone interceptor — are deployed by
    the US Army, Marine Corps, and SOCOM components. The company raised $250M Series C in August 2026, led by Sequoia
    Capital and the American Strategic Technology Fund, confirming its position as one of the fastest-growing
    defense-tech unicorns in the US.
