      - number: '6.5'
        title: Expansion, Concentration, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The customer base appears powerful precisely because it is concentrated. Most public proof sits within a
              small number of government and allied channels. That can be a feature when procurement tailwinds are
              strong, but it is also the clearest structural vulnerability. Public evidence does not show diversified
              commercial revenue, named allied-country breadth, or transparent customer-by-customer economics. Several
              potentially relevant pages are unavailable, rate-limited, or protected, which further limits outside
              diligence. Even the Neros team page is protected, while some third-party articles and company-linked pages
              are inaccessible.


              The right conclusion is not that the customer base is weak. It is that it is real, narrow, mission-driven,
              and still partially opaque. Expansion likely exists, especially through Drone Dominance and localized
              allied-market efforts, but the public evidence is not yet rich enough to prove how diversified or sticky
              that expansion will become. Investors should therefore treat concentration risk as central rather than
              incidental to the Neros customer thesis.
            claimRefs:
              - CU017
