            body: >-
              The public architecture points to four critical layers: the airframe and payload layer, the control layer,
              the communications and electronics layer, and the industrial layer. Archer, Archer Strike, and Bandit live
              mostly in the first layer. Crossbow and Flatbow live in the second. DIU EMI work and the anti-jam radio
              reference indicate the third layer matters materially, especially in contested-spectrum environments.
              Project Millennium and American Drone Dominance show the fourth layer—manufacturing and subcomponent
              control—is considered strategically inseparable from the rest.


              This layered architecture is why Neros looks different from a hobby-drone company or even from a premium
              ISR drone vendor. The operating model is built around repeatable low-cost supply under stress, not around
              occasional exquisite flights. The Drone Dominance materials are especially revealing here: the government
              itself is now specifying low unit cost, fast operator training, secure supply chain, and rapid delivery as
              product requirements. Neros looks natively aligned to that doctrine, which may be its single most
