      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Neros' immediate market is government-led and segmented by mission urgency more than by traditional
              commercial verticals. The Army is the clearest anchor because it has already taken Archer through Blue UAS
              and PBAS steps and then moved to an IDIQ vehicle. Marine Corps and SOCOM buyers matter because they are
              often earlier adopters of new tactics, looser organizational forms, and more expeditionary use cases.
              Allied ministries are a third buyer bucket, especially where sovereign production and trusted domestic
              supply are becoming procurement requirements instead of political preferences. That logic is visible in
              Neros' UK subsidiary, which is less a sales office than a sovereign-manufacturing signal.


              In this market, the user is rarely the payer. Operators, units, and training organizations prove the
              concept, but program offices, acquisition commands, ministries, and coalition budgets authorize the spend.
              That makes trust gates especially important. Blue UAS inclusion, EMI prototype selection, training and
              doctrine alignment, and contracting structures all function as part of the adoption path. A company can be
              technically attractive and still fail commercially if it cannot navigate those procurement steps. Neros'
              progress so far suggests it understands that path, but it also means its future market share will depend
              as much on contracting and certification execution as on drone performance.
