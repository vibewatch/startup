      - number: '4.3'
        title: Cost Structure, Working Capital, and Factory Economics
        blocks:
          - type: paragraph
            body: >-
              The cost structure is exactly what one would expect from a defense hardware company trying to localize
              production aggressively: components, batteries, payloads, final assembly labor, training and support
              labor, testing, and compliance sit on top of substantial facility investment. Project Millennium makes the
              model explicitly capital intensive. Neros is not only adding capacity; it is trying to own more of the
              subcomponent stack and to scale into a million-unit manufacturing system. That could create a powerful
              moat if utilization is high, but it also means the business will live or die on throughput, yield, and
              order cadence rather than on narrative alone.


              Working capital is therefore a central analytical lens. A fast-ramping factory needs inventory and labor
              before it gets paid, and a trusted-sourcing strategy can raise near-term cost even if it improves
              procurement eligibility over time. The financial upside is that once utilization is high, fixed costs can
              be spread over very large unit counts. The downside is that if orders disappoint or roadmap products ramp
              slowly, the same fixed-cost base can become a drag on returns and force new financing sooner than public
              excitement implies.
