      - number: '1.4'
        title: Funding History, Contract Momentum, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              Neros’ financing path has been unusually compressed. The company disclosed $10.9 million of pre-seed and
              seed financing in May 2024, followed by a $35 million Series A in March 2025, a $75 million Series B in
              November 2025, and a $250 million Series C announced in August 2026. Summing those disclosed rounds
              implies roughly $370.9 million of capital raised, which management and press coverage often round to
              roughly $371-375 million. The Series C set a $2.5 billion post-money valuation, approximately triple the
              prior mark nine months earlier according to Dronexl. Sequoia led the Series B and returned to co-lead the
              Series C alongside American Strategic Technology Fund, with participation from Interlagos, Valor Equity
              Partners, Allen & Company, Thiel Capital, Spark Capital, and Dylan Field.

              Contract momentum explains why investors were willing to move so quickly. Public evidence shows Neros
              progressing from Ukraine-linked deliveries and DIU selection in 2024-2025 to formal U.S. Army and Marine
              Corps awards by late 2025 and mid-2026. The Army story is especially important. Neros first announced PBAS
              program selection in November 2025, then later won a June 30, 2026 IDIQ contract with a ceiling of up to
              $500 million for Archer FPV systems, training, testing, and support through June 2031. GovConWire and
              JobsWithDOD say the company had already begun filling an initial Army order of thousands of drones. The
              Marine Corps also awarded a multi-million contract for Archer Strike systems and training, while official
              Series C materials say Neros has contracts with every component of SOCOM and half a dozen allied
              countries.

              The scale narrative is compelling but not fully de-risked. Dronexl reports output of about 1,200 aircraft
              per week, JobsWithDOD cites over 1,200 per week and a target of 10,000 per month by year-end 2026, and
              company materials continue to target one million drones annually by 2028. Those are strong indicators of
              demand and manufacturing progress, but they are not equivalent to audited revenue, long-term backlog, or
              guaranteed delivery-order quantities. The strongest current read is that Neros has undeniably crossed from
              prototype startup to meaningful defense supplier, while still lacking the public financial transparency
              needed to underwrite profitability or capital efficiency with confidence.
            claimRefs:
              - CO015
              - CO016
              - CO017
              - CO018
