      - number: '7.2'
        title: Operational, Quality, and Security Risks
        blocks:
          - type: paragraph
            body: >-
              Neros is trying to do several hard things at once: scale factory output dramatically, localize or secure
              more of the component stack, launch autonomy-enhanced products, and participate in procurement structures
              that reward low cost at high speed. Any one of those would be a major execution challenge. Together they
              create a high-complexity operating model. Millennium One is the clearest illustration. It could be the
              company's defining asset, but it also raises the stakes around hiring, process control, yield, quality,
              and working capital. A factory this ambitious does not fail all at once; it fails through missed
              throughput, component bottlenecks, training burdens, or support weakness.


              Public cyber and privacy evidence is better than zero but still incomplete. The privacy policy shows a
              baseline seriousness around support-data handling and government disclosures. Yet formal public assurance
              artifacts remain thin relative to the defense-critical nature of the missions. The result is a company
              whose public trust posture looks directionally appropriate but not fully inspectable.
            claimRefs:
