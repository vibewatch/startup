chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Mission
        blocks:
          - type: paragraph
            body: >-
              Neros emerged in 2023 around a very specific thesis: Western militaries had badly underestimated how
              decisive low-cost first-person-view drones would become in modern warfare, and American industry was
              structurally unprepared to build them at battlefield scale. The company was founded by Soren
              Monroe-Anderson and Olaf Hichwa, two founders whose backgrounds were unusually native to the FPV ecosystem
              rather than to the legacy defense prime world. Medium posts by Monroe-Anderson and third-party coverage
              describe both founders as teenage builders and racers who developed deep practical expertise in drone
              electronics, airframes, and operator workflows long before Neros existed. That founding story matters
              because the company’s product and factory decisions appear to be direct responses to what the founders saw
              in Ukraine: scalable manufacturing, low-cost replacement rates, resilient radios, and freedom from Chinese
              component dependency.

              The company’s geographic identity evolved quickly. Neros opened a 15,500-square-foot El Segundo facility
              in 2024, and its official homepage still describes its headquarters in El Segundo, California. But later
              company materials and third-party coverage point to a much larger South Bay expansion: Project Millennium
              describes a 250,000-square-foot “Millennium One” site in Los Angeles as the company’s new global
              headquarters, while Dronexl and JobsWithDOD place that facility in Torrance. The cleanest synthesis is
              that Neros’ operating center of gravity is now the greater South Bay Los Angeles corridor, with legacy El
              Segundo roots and a Torrance-centered industrial expansion. Across sources, the mission is consistent:
              build practical, attritable, American or allied-sourced unmanned systems at scale so the U.S. and allied
              defense base can compete with Chinese and Russian production economics.

              The current product identity already goes beyond a single expendable drone. The homepage and company
              announcements position Archer, Archer Strike, Crossbow, Flatbow, Archer AI, and Bandit as pieces of a
              broader drone-manufacturing platform, while Project Millennium frames the “ultimate product” as the
              factory itself. That framing is important for later chapters: Neros is not trying to become only a
              point-product FPV vendor, but rather a scaled industrial producer of drone systems, subcomponents, and
              eventually allied manufacturing nodes.
