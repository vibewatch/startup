      - number: '7.3'
        title: Partner, Procurement, and Ecosystem Dependencies
        blocks:
          - type: paragraph
            body: >-
              A large share of Neros' risk sits outside the boundaries of its own org chart. Trusted-list
              administration, DLA procurement infrastructure, Army and ATEC test facilities, and broader Drone Dominance
              mechanics all influence whether the company can move quickly from product fit to funded fielding. That
              does not mean Neros lacks agency; it means its agency is mediated by institutional systems. The company
              also depends on secure components, payload integrations, and likely partner ecosystems to expand into
              adjacent mission sets. The CX2 and Kela-style stories point to a future in which mission breadth
              increasingly depends on external module or payload relationships.


              This dependency profile is manageable if Neros remains a favored supplier inside the ecosystem. It becomes
              dangerous if the ecosystem starts preferring larger or more documented alternatives. That is why domestic
              substitutes and public incumbents matter as risk indicators even when they are not direct like-for-like
              rivals.
