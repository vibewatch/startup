      - number: '7.4'
        title: People and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Neros is still visibly founder-centric, and its job openings show that the company is continuing to
              institutionalize functions that more mature defense suppliers already have built out. Hiring an autonomy
              lead, strategic finance staff, cybersecurity engineers, reliability engineers, and manufacturing-systems
              leaders is not a red flag by itself; it is normal for a scaling company. But it is evidence that critical
              functions are still being deepened while the business is already under major growth pressure. That creates
              a classic timing risk: expectations can outrun organizational maturity.


              The most important people risk is not one bad hire. It is whether the leadership team can build enough
              middle-layer operations, quality, and security capability fast enough to support factory-scale execution
              and more complex products. If not, the company could experience exactly the kinds of quality or delivery
              issues that change customer and investor sentiment quickly in defense hardware.
