- id: adoption-trajectory
  title: Adoption Trajectory and Deployment Maturity
  body: 'Public adoption evidence is much stronger than mere logo collection. Neros has disclosed current production pace, future production targets, and multiple military buying events that imply demand is turning into real deployment. The strongest signal is that Army proof did not stop at a single announcement. Instead, the public sequence goes from PBAS selection to an IDIQ structure to discussion of first orders in the thousands. That pattern is consistent with a customer moving from evaluation to fielding. The Marine Corps delivery order reinforces that this is not solely an Army story, while the Ukraine contract demonstrates external battlefield pull.


    Importantly, the adoption trajectory is still better documented in units and contracts than in customer counts. We do not know how many total military accounts are active, how large each account is, or what the revenue mix looks like by customer. But in a defense-hardware business, unit throughput and program progression are arguably more important than raw account count anyway. The public record therefore supports a view that Neros has already crossed into production deployment with several high-value channels, even though the exact breadth of that installed base remains opaque.'
