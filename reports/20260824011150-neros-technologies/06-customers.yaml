chapter:
  number: 6
  title: Customers
  summary: Neros' customer proof is strongest in U.S. military and allied-defense channels, especially the Army and Marine Corps, with additional evidence for Ukraine-linked deliveries and claimed SOCOM/allied-country breadth. Public evidence supports production deployments and repeat procurement signals, but customer enumeration, retention metrics, and concentration disclosure remain thin.
sections:
- id: customer-segmentation
  title: Customer Base Segmentation by Mission, Geography, and Buyer Type
  body: 'Neros'' customer base is best segmented as a defense-procurement map rather than a conventional commercial account list. The visible segments are U.S. Army procurement, U.S. Marine Corps procurement, SOCOM-related channels, Ukraine-linked coalition demand, and allied-country defense buyers. There is no meaningful public evidence that the company has a broad commercial customer base today; the public story is overwhelmingly military and government-facing. That does not make the base weak—if anything it reflects unusually strong mission fit—but it does mean customer diversification should be judged in terms of service branch, geography, and procurement mechanism rather than in terms of commercial vertical breadth.


    Within that framework, the Army appears to be the anchor account class because it provides the clearest mix of validation, ordering velocity, and scalable potential. The Marine Corps is the next clearest proof point. SOCOM and allied-country relationships are strategically important, but their public documentation is thinner and therefore lower-quality as references. Ukraine-linked deliveries sit in between: they are real and symbolically powerful, but they run through coalition and wartime-demand channels that are harder to treat as durable recurring enterprise revenue. Overall, the segmentation story is coherent, but it is narrower and more concentrated than bullish top-line summaries imply.'
