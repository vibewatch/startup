- id: named-customer-proof
  title: Named Customer Proof and Reference Quality
  body: 'Reference quality varies materially across the visible customer set. The Army and Marine Corps are the strongest because public documents tie them to specific products, programs, and delivery structures. Those references are more useful than generic brand-name customer lists because they imply actual deployment context. Ukraine is also an important proof point, but investors should treat it as a coalition battlefield-demand signal rather than as a normal recurring-enterprise reference. The claimed SOCOM and allied-country breadth is strategically encouraging, yet still lower-grade from a diligence standpoint because the accessible public evidence is mostly company- or press-level assertion rather than contract-by-contract detail.


    This uneven proof quality matters because it shapes how much confidence can be placed in customer durability. Army and Marine references indicate true production accounts. SOCOM and allied-country claims indicate potential breadth but not transparent depth. The customer chapter should therefore preserve the distinction between named, evidenced accounts and broader claimed channel penetration. That distinction does not weaken the case; it makes it more analytically honest.'
