      - number: '7.5'
        title: 财务模型风险、剩余敞口与止损条件
        blocks:
          - type: paragraph
            body: >-
              Series C 比较好地解决了近期资本可得性问题，但没有同等程度解决经济性问题。公开证据仍没有揭示利润率结构、烧钱速度、积压订单质量或客户集中度。这意味着最重要的财务风险是模型风险：Millennium
              的固定成本吸收、Drone Dominance 下的定价压力、政策传导的采购波动，以及公司赢得关注的速度快于赢得持久现金转化的可能性。这些正是防务制造故事里会制造巨大结果分散的风险。


              因此，正确投资姿态是：在几个具体信号改善前，把剩余敞口视为高位。这些信号包括重复交付订单、透明质量表现、更顺畅的文档和支持可见度，以及低成本规模化生产确实有利润而不只是能实现的证据。缺少这些信号时，一次政策变化、价格压缩事件或运营失误，都可能比当前叙事暗示的速度更快地击穿投资逻辑。
