      - number: '8.4'
        title: 退出路径、IPO 准备度与后续必需验证点
        blocks:
          - type: paragraph
            body: >-
              从当前位置看，最可信路径不是立刻上市，而是在更多运营证据积累后再次私募重估，或发生结构化流动性事件。公开市场可比公司说明了原因。AeroVironment 和 Red Cat
              的估值可以争论，但它们的投资人至少有监管文件、收入确认细节和公开验证点节奏。Neros 还没有提供这种可见度。若要让 IPO
              叙事可信，投资人需要看到积压订单滚动、客户集中度披露、收入组合、毛利率结构、烧钱速度，以及 Bandit 和 Archer AI 贡献的不只是路线图期权价值的证据。


              战略出售也可能发生，尤其如果大型防务主承包商或上市平台看重 Neros
              的可信制造基础。不过，管理层行为和当前融资规模表明，公司追求的是独立发展和更大的战略野心。这意味着，实际尽调任务是为未来任何估值锚定定义里程碑门槛。这些门槛很具体：重大合同下的交付订单节奏、重复客户采购、利润率证据、产品组合扩张和盟国收入。如果这些信号很快出现，当前轮次会经得起时间检验。若没有，估值可能开始更像乐观溢价，而不是有依据的跃升。
