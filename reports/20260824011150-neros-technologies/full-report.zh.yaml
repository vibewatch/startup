  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按任务、地域和买方类型切分客户基础
        blocks:
          - type: paragraph
            body: >-
              Neros 的客户基础最好看作一张国防采购地图，而不是传统商业客户名单。可见细分包括美国陆军采购、美国海军陆战队采购、SOCOM
              相关渠道、乌克兰相关联盟需求，以及盟国国防买方。公开证据没有显示公司今天拥有广泛商业客户基础；公开故事压倒性地面向军方和政府。这不代表客户基础弱——恰恰相反，它反映出任务匹配异常强——但这意味着，判断客户多元化时应看军种、地域和采购机制，而不是商业垂直行业宽度。

              在这个框架内，陆军似乎是锚定客户类别，因为它提供了最清晰的验证、下单速度和可扩展潜力组合。海军陆战队是下一个最清晰的证明点。SOCOM
              和盟国关系具有战略重要性，但公开文档更薄，因此作为参考证据质量更低。乌克兰相关交付介于两者之间：它们真实且象征意义强，但运行在联盟和战时需求渠道中，更难当作持久经常性企业收入。整体来看，客户切分故事是连贯的，但比乐观的头部摘要暗示的更窄、更集中。
