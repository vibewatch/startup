      - CE019
      - CE032
      - CE033
      - CE035
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Neros 客户采用通常从紧迫任务需求起步，先进入可信采购，再走向规模化部署。
    data:
      nodes:
        - id: j1
          label: 识别任务需求
          detail: 美国陆军、海军陆战队、SOCOM 或盟国买方确认低成本无人机或 c-UAS 需求。
        - id: j2
          label: 信任与合规筛查
          detail: Blue UAS、安全供应、项目匹配度等问题得到处理。
        - id: j3
          label: 初始项目或订单
          detail: PBAS、交付订单或联盟资助批次验证匹配度。
        - id: j4
          label: 操作员训练与部署
          detail: 部队把系统接入作战流程和竞赛场景。
        - id: j5
          label: 复购订单或本地化
          detail: 规模化订单、DLA 路径或盟国扩张把客户关系做深。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU015
      - CU016
      - CU020
      - CU025
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 客户证据从广泛军事兴趣收窄到具名的规模化客户。
    data:
      items:
        - label: 广泛 Drone Dominance 需求信号
          value: 100
          unit: index
          note: 作战部队和盟友让漏斗顶部很宽。
        - label: 可信系统资质
          value: 75
          unit: index
          note: Blue UAS、DCMA 和安全供应要求会筛选供应商。
        - label: 进入项目
          value: 50
          unit: index
          note: PBAS 或类似渠道进一步收窄候选范围。
        - label: 具名量产买方
          value: 30
          unit: index
          note: 陆军、海军陆战队、乌克兰相关交付已公开可见。
        - label: 可规模化复购客户
          value: 15
          unit: index
          note: 陆军推进最清晰；更广泛复购披露仍不足。
    approximationNotes: 指数值只是序数型重点权重，不是实测转化率。
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU015
      - CU016
      - CU031
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 不同客户渠道的背书质量差异很大。
    data:
      columns:
        - 具名客户
        - 量产证据
        - 近期性
        - 规模可见度
      rows:
        - label: 美国陆军
          values:
