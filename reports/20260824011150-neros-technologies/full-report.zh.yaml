      - number: '2.4'
        title: 市场为什么如此快速前拉
        blocks:
          - type: paragraph
            body: >-
              核心增长驱动是，战场证据把多年的概念争论压缩成紧迫采购。乌克兰证明，廉价无人机能够影响伤亡率和日常战术节奏；反无人机防御也从可选的高端层，变成部队生存的前提。美国条令现在正式补课：陆军的无人机主导能力更新显示，小型无人系统正在变成标准战场装备。与此同时，美国监管环境正在收紧对外国生产无人机和关键部件的处理方式，使国内或盟国采购更有价值。这有利于
              Neros，因为它的市场进入叙事本来就建立在可信电子、垂直整合和可扩展美国生产之上。

              经济性也把市场推向同一个方向。买方越来越在意单次效果成本和单次杀伤成本，而不只是顶级性能。低成本 FPV 系统只有在也存在低成本反制方式时才说得通，所以拦截器项目和分层 c-UAS 架构正在一起增长。Neros
              切入 Bandit 的时点很合适，因为它从防御侧回应同一个不对称问题。与此同时，制造本身已经变成竞争楔子。Neros 和 Firestorm
              等同行都在讲一个故事：工业产能、本地化和从设计到交付的速度，几乎和机架一样重要。
