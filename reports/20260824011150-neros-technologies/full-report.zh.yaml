  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、现有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Neros 面对的不是一个干净的同类竞争集合。直接同行是 Red Cat/Teal 这类战术国防无人机供应商，以及在某些采购通道中的 Skydio。战略邻近公司包括 Shield AI 这类自主能力驱动公司，以及
              Firestorm 这类制造驱动挑战者。替代方案包括 AeroVironment、Teledyne FLIR 等上市现有巨头，以及 Bandit 会越来越遇到的分层反 UAS 供应商。这种组合很重要，因为它意味着
              Neros 很少只在单一维度上被比较。在一个采购项目中，它会被拿来和可信 ISR
              系统比较；在另一个项目中，它会被拿来和自主软件叙事比较；再到另一个项目，它会被放在低成本拦截器经济性，甚至传统防空替代方案旁边比较。

              因此，这个格局最好按任务层阅读。Neros 在买方重视可消耗攻击规模、快速生产扩张和可信国内部件时最强；当买方想要成熟装机基础、高可读性的企业软件或有长期采购历史的广泛组合时，它较弱。竞争问题不是 Neros
              能否在每项指标上击败所有对手，而是它能否在更大或资金更充足的玩家吸收这个品类之前，守住一个窄但战略重要的楔子。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP010
              - CP012
