  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Neros 卖的不是孤立的一架无人机。公开材料显示，它的工作流产品由机架、控制层、任务软件或自主辅助、训练，以及一个让补充持续流动的制造体系组成。Archer 和 Archer Strike
              是最显眼的战场工具，但在实践中，它们必须搭配 Crossbow 或 Flatbow 控制层使用，并且越来越受到 Archer AI 等自主增强能力支持。Bandit
              把工作流从攻击延伸到无人机防御。这一点重要，因为公司真正给客户的承诺不是“这里有一架飞机”，而是“这里有一套低成本、安全、可扩展的任务闭环，你可以训练、部署，并快速替换”。

              这种工作流框架也解释了为什么 Neros
              总在谈制造。对消耗性或可消耗系统来说，工厂设计和安全部件可得性就是产品性能的一部分。客户如果不能快速复购、信任供应链，或把控制系统整合进训练，就谈不上拥有完成态军用产品。Neros
              似乎理解这一点，所以它的产品叙事总会流向流程和工业产能。
