      - number: '1.3'
        title: 产品、制造体系与工业扩张
        blocks:
          - type: paragraph
            body: >-
              2024 年至 2026 年间，Neros 的产品组合明显扩展。早期配置以 Archer 和 Crossbow 为中心：Archer 是核心 FPV 平台，Crossbow 是控制站。到 2025 年底，陆军
              PBAS 套件已经包括 Archer 和 Archer Strike 变体，以及升级版士兵携行控制系统 Flatbow。到 2026 年 8 月，公司又加入 Archer AI——在 FPV 架构上叠加末端制导和
              GPS 受限位置保持——以及 Bandit，这是一款反 UAS 拦截器，目标是 Class 2 和 Class 3 威胁，包括 Shahed 风格系统。与 Kela 合作的 Archer Fiber
              也释放出另一个信号：当战场要求替代链路架构时，Neros 愿意通过合作扩展平台。

              制造故事至少和产品故事一样核心。公司帖子持续强调垂直整合、国内或盟国采购、自研无线电，以及在芯片层面刻意避开中国部件。Forbes、Dronexl
              和公司材料都把这种无中国或尽量少中国的供应链塑造成采购差异化因素和战略必要性。Neros 的观点是，如果关键电子堆栈仍依赖中国微电子或子组件，只是在美国组装无人机并不够。这个判断与监管和采购环境一致：DIU 的
              Blue UAS 框架，以及 FCC 在 2026 年围绕国家安全的推动，正在越来越奖励透明的国内或盟国采购。

              Project Millennium 是 Neros 野心最清晰的表达。公司称，Millennium One 会把产能从原有 15,000 平方英尺设施放大约
              100x，并且不只是装配场，而是安全子部件生产基地，未来可以为其他国内 OEM 降低供应风险。相对公司年龄，这个野心非常夸张。叙事风险也从这里进入：宣布一座年产 100
              万架无人机的工厂，比用承诺订单、合格劳动力和可预测部件流把它填满容易得多。即便如此，陆军需求信号、乌克兰相关学习闭环和反复融资结合在一起，说明这次制造扩张并不只是投机性的品牌动作。
