      - number: '2.5'
        title: 约束、矛盾与公开数据仍无法证明的事项
        blocks:
          - type: paragraph
            body: >-
              热门市场不会消除摩擦。反 UAS
              买方仍面对认证、频谱协调、压制权限限制、隐私约束和真实训练负担。即便紧迫性真实存在，军方采购仍然分阶段、讲流程。这一点重要，因为围绕无人机的公共兴奋常常把需求当成立即收入，但实际中，需求仍要穿过测试、预算分配和多步骤合同工具。Neros
              还面临一个由自身成功带来的市场定义问题：每一个乐观市场统计都能讲出一个大故事，但其中很多美元位于公司尚未触达的堆栈层或地理区域。

              因此，TAM 数据中的矛盾应被保留下来，而不是被平均抹平。它们告诉投资者，这个品类仍然早期、嘈杂，并且正在被战争和监管实时定义。公开数据还留下两个商业上核心的问题：Neros
              实际按每套系统或每个训练包收多少钱，以及在公开讨论的订单和上限之外，有多少已承诺在手订单。在这些信息明确之前，市场章节应得出的结论是，需求环境强劲且结构性改善，但公司精确的 SAM
              获取和变现曲线仍是推断，而不是已验证事实。
