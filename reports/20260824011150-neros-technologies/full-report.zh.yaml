      - number: '3.3'
        title: 能力、定价、分销与信任姿态
        blocks:
          - type: paragraph
            body: >-
              这个市场里的能力比较很难同口径展开，但几个模式很清楚。Shield AI 在自主能力广度和高端软件品牌上领先。Skydio 在打磨成熟的 ISR 工作流、停机坞和软件主导运营上领先。Red Cat/Teal 和
              Teledyne FLIR 在清晰的 Blue UAS ISR 信任姿态上领先。Neros 在关于可消耗攻击生产速度、国内部件控制，以及围绕补充经济性而不是高端无人机利润率来构建业务的公开主张上领先。Bandit
              给 Neros 打开了反 UAS 的新入口，但也把它拖入一个更大的生态，集成系统供应商可能在其中拥有结构性力量。

              几乎所有重要同行的定价透明度都很弱。多数供应商靠报价、项目和打包销售，而不是公开单价。这会把竞争分析推向任务匹配、软件集成、物流和支持，而不是价目表。分销能力仍然重要，在这一点上 Neros
              不是默认领先者。现有巨头和资金更充足的对手往往拥有更多参考买方、更强合作伙伴杠杆，以及更正式的采购路径。
