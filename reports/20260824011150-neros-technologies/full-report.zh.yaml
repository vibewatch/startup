  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高剩余风险落在政策依赖与工业规模执行交叠的地方。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 极高影响
          values:
            - 安全 / 网络事件
            - 可信名单或产能利用失败
            - —
        - label: 高影响
          values:
            - 出口管制突变
            - 自主系统治理收紧
            - Drone Dominance 成本压力
        - label: 中等影响
          values:
            - 文档不透明
            - 测试靶场瓶颈
            - 本土替代压力
    approximationNotes: 定性热力图基于当前公开证据综合得出，不是精算概率。
    claimRefs:
      - CR001
      - CR007
      - CR012
      - CR018
      - CR030
      - CR038
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 运营和政策冲击会迅速传导到采购、利润率和估值。
    data:
      nodes:
        - id: r1
          label: 政策变化
        - id: r2
          label: 可信名单准入
        - id: r3
          label: 订单流
        - id: r4
          label: 工厂利用率
        - id: r5
          label: 利润率 / 现金转化
        - id: r6
          label: 估值信心
      edges:
        - from: r1
          to: r2
          label: 改变资格
        - from: r2
          to: r3
          label: 影响采购速度
        - from: r3
          to: r4
          label: 让产能吃饱或闲置
        - from: r4
          to: r5
          label: 带动成本吸收
        - from: r5
          to: r6
          label: 改变投资者信心
    approximationNotes: 展示因果路径，不代表实测权重。
    claimRefs:
