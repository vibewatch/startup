        blocks:
          - type: paragraph
            body: >-
              Neros 没有披露净收入留存率、总留存率或流失率。这意味着客户耐久性只能从行为推断，而不能靠 SaaS 式指标证明。最好的证据是重复采购逻辑：美国陆军合作经历了多个阶段，公司在支持操作员竞赛和工作流，Blue
              UAS、DCMA、DLA 和 Drone Dominance 周边基础设施也在让军方重复采用变得更容易，而不是更难。英国子公司也说明，管理层试图把客户扩张转化为主权市场战略，而不是完全依赖临时出口。


              但耐久性的边界很真实。我们不知道哪些盟国已经活跃、哪些 SOCOM
              组成单位在采购、非陆军账户规模有多大，也不知道战场驱动的关系是否会按正常项目周期续约。另外，公开客户证据高度偏向防务，预算时间和采购政策实际都成了留存变量。结果是一个看起来令人兴奋、复购性越来越强的客户群，但它在投资人通常用来证明韧性的维度上仍披露不足。
