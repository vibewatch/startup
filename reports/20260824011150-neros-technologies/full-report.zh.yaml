companyProfile:
  summary: >-
    Neros Technologies 总部位于 Torrance, California，是一家自主无人机公司，为美国及盟国军方客户设计并制造 AI 加持的无人机。公司由 CEO Soren Monroe-Anderson
    与一群从无人机竞速转向国防工程的老手创立，约三年内从初创公司成长为估值 $2.5B 的公司，抓住的是军方对低成本、可大规模生产作战无人机的迫切需求。旗舰产品 Archer AI FPV 作战无人机和 Bandit
    反无人机拦截器已经部署到美国陆军、海军陆战队和 SOCOM 下属单位。公司在 2026 年 8 月完成由 Sequoia Capital 和 American Strategic Technology Fund 领投的 $250M
    C 轮融资，巩固了其作为美国增长最快国防科技独角兽之一的位置。
