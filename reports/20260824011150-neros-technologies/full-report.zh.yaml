      - number: '5.2'
        title: 架构、制造与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开架构指向四个关键层：机架与载荷层、控制层、通信与电子层，以及工业层。Archer、Archer Strike 和 Bandit 主要位于第一层。Crossbow 和 Flatbow 位于第二层。DIU EMI
              工作和抗干扰无线电表述说明第三层非常重要，尤其是在频谱受争夺环境中。Project Millennium 和 American Drone Dominance
              显示，第四层——制造和子部件控制——被视为与其他部分在战略上不可分割。

              这种分层架构解释了为什么 Neros 不像一家爱好者无人机公司，甚至也不像一家高端 ISR 无人机供应商。它的运营模式围绕压力下可重复、低成本供应构建，而不是偶尔做出精致飞行。Drone Dominance
              材料在这里尤其有揭示性：政府本身现在正在把低单机成本、快速操作者训练、安全供应链和快速交付写成产品要求。Neros 看起来天然贴合这套条令，这可能是它最重要的设计选择。
