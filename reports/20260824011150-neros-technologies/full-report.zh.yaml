      - number: '6.2'
        title: 采用轨迹与部署成熟度
        blocks:
          - type: paragraph
            body: >-
              公开采用证据远强于单纯客户标志罗列。Neros 已披露当前产速、未来产量目标，以及多个暗示需求正转化为真实部署的军方采购事件。最强信号是，陆军验证没有停在一次公告上。公开序列是从 PBAS 入选，到 IDIQ
              结构，再到首批数千架订单的讨论。这个模式符合客户从评估走向列装的过程。海军陆战队交付订单强化了这不只是陆军故事，而乌克兰合同证明了外部战场拉力。

              重要的是，采用轨迹在单位和合同上的记录，仍好于在客户数量上的记录。我们不知道活跃军方客户总数、每个客户规模，或按客户划分的收入结构。但在国防硬件业务里，单位吞吐和项目推进可能本来就比原始客户数量更重要。因此，公开记录支持这样一种观点：Neros
              已经通过多个高价值渠道进入生产部署阶段，尽管这个装机基础的精确广度仍不透明。
