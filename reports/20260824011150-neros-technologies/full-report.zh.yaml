      - number: '2.2'
        title: 用多重视角测算机会规模
        blocks:
          - type: paragraph
            body: >-
              公开市场数据只有在作为一组视角处理时才有用，不能被当成单一答案。StartUs 预计军用无人机市场到 2030 年达到 $22.81 billion；MarketsandMarkets
              则把更广义军用无人机市场估为 2026 年 $34.85 billion、2031 年 $109.22 billion。反 UAS 估算同样分散：MarketsandMarkets 显示，2026 年市场为
              $9.17 billion，到 2031 年增长至 $29.70 billion；TheWorldData 汇总的 2026
              年基数更低，长期区间更宽。这些数字不一定互相矛盾；它们主要反映范围选择、区域假设和纳入技术层的差异。

              对 Neros 来说，更能支持决策的规模视角，是 TAM 底下的预算和补充逻辑。StartUs 报道称，FY2026 美国国防预算申请中有一条 $13.4 billion 的自主能力预算，包括 $9.4
              billion 用于无人及远程操作航空器，$3.1 billion 用于反 UAS。它还强调，乌克兰的 FPV 采购从 2024 年 1.5 million 架，走向 2025 年计划 4.5 million
              架。这些数字不会直接转化为 Neros 收入，但它们解释了为什么公司相信年产百万级是理性的野心，而不是公关噱头。这个市场越来越像弹药和工业产能市场，而不是经典飞机市场。
