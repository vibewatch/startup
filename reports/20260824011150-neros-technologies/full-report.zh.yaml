      - number: '7.3'
        title: 合作伙伴、采购与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Neros 很大一部分风险在自身组织架构之外。可信名单管理、DLA 采购基础设施、美国陆军和 ATEC 测试设施，以及更广泛的 Drone Dominance
              机制，都会影响公司能否从产品匹配快速走到有资金支持的列装。这并不意味着 Neros
              没有能动性，而是它的能动性要经过制度系统传导。公司还依赖安全零部件、载荷集成，以及可能的合作伙伴生态，才能扩展到相邻任务集。CX2 和 Kela 式案例指向一种未来：任务宽度越来越依赖外部模块或载荷关系。


              只要 Neros 仍是生态里的受青睐供应商，这种依赖结构就可管理。如果生态开始偏好规模更大或文档更充分的替代方案，风险就会变得危险。因此，即便本土替代者和上市老牌公司不是直接一比一的对手，它们也仍是重要风险指标。
