      - number: '2.3'
        title: 买方、使用者、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Neros 的即时市场由政府牵引，按任务紧迫性切分，而不是按传统商业垂直行业切分。陆军是最清晰的锚点，因为它已经让 Archer 走过 Blue UAS 和 PBAS 环节，并推进到 IDIQ 工具。海军陆战队和
              SOCOM 买方重要，是因为它们往往更早采用新战术、更松散的组织形态和更远征化的使用场景。盟国国防部是第三类买方，尤其在主权生产和可信国内供应从政治偏好变成采购要求的地方。Neros
              的英国子公司体现了这一逻辑；它更像一个主权制造信号，而不只是销售办公室。

              在这个市场里，使用者很少就是付款方。操作者、部队和训练组织验证概念，但项目办公室、采购司令部、各国国防部和联盟预算才批准支出。这让信任门槛尤其重要。Blue UAS 纳入、EMI
              原型选择、训练和条令对齐、合同结构，都是采用路径的一部分。一家公司技术上有吸引力，但如果跑不通这些采购步骤，商业上仍会失败。Neros
              迄今的进展说明它理解这条路径，但这也意味着，未来市场份额取决于合同和认证执行，程度不亚于无人机性能。
