      - number: '8.5'
        title: 估值结论
        blocks:
          - type: paragraph
            body: >-
              公开证据给出的结论是，Neros
              的估值大胆，但并不荒唐。相比典型年轻硬件创业公司，它有更多需求证明；相比通用无人机制造商，它有更强战略相关性；相比多数私营同行，它有更大制造野心。这些优势足以支撑相对早期工业故事的显著溢价。它们不足以支撑一种假装经济性问题已经解决的叙事。公司仍缺少收入规模、毛利率耐久性、营运资本压力、积压订单质量和集中度风险方面的公开证据。因此，投资人不应把当前轮次视为模型每一块都奏效的验证。它验证的是：成熟资本希望押注
              Neros 可能成为品类定义级可信供应商。


              因此，正确态度是有纪律的乐观。如果投资人能合理控制敞口，并要求基于里程碑的后续兑现，当前估值仍可能带来好结果，因为公司可能很快长进估值里。如果投资人需要清晰的当下财务可比性，证据仍太薄。最好的心智模型既不是商品硬件，也不是成熟自主化软件冠军，而是一笔实物期权下注：Neros
              能否在叙事跑赢数字前，把可信准入、工厂规模和需求紧迫性转化为持久经济性。
