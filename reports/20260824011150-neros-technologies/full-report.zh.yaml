      - number: '4.3'
        title: 成本结构、营运资本与工厂经济性
        blocks:
          - type: paragraph
            body: >-
              Neros 的成本结构完全符合一家国防硬件公司激进推动本地化生产时的样子：部件、电池、载荷、总装人工、训练和支持人工、测试与合规，叠加大量设施投资。Project Millennium
              让这个模式明确变成资本密集型。Neros
              不只是增加产能；它还试图掌握更多子部件堆栈，并扩展到百万级制造系统。如果利用率高，这可能形成强大护城河；但也意味着，业务成败将取决于吞吐量、良率和订单节奏，而不是只靠叙事。

              因此，营运资本是核心分析视角。快速爬坡的工厂需要先投入库存和人工，才能拿到回款；可信采购策略即便长期改善采购资格，短期也可能抬高成本。财务上行空间在于，一旦利用率升高，固定成本可以摊到极大的单位数量上。下行风险在于，如果订单不及预期或路线图产品爬坡缓慢，同样的固定成本基础会拖累回报，并迫使公司比公众兴奋情绪暗示的时间更早再融资。
