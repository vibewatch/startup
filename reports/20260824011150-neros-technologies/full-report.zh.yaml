          - type: callout
            title: 订单真实存在，但在手订单可见度仍有限
            body: 陆军 $500M 合同是 IDIQ 上限，不是有保证的采购承诺。公开证据证明了采购准入和早期交付订单，但尚未证明通往年产 100 万架目标产能的完整已签约路径。
            calloutType: risk
            claimRefs:
              - CO016
              - CO024
              - CO035
          - type: callout
            title: 产品路线图扩张时，自主治理也在收紧
            body: Neros 从人工驾驶 FPV 系统拓展到 Archer AI 和 Bandit 后，围绕人类判断、测试和操作者接管的监管负担也在增加。这一点重要，因为公司的价值叙事越来越依赖自主辅助战争，而不只是廉价机架。
            calloutType: risk
            claimRefs:
              - CO027
              - CO028
              - CO029
              - CO036
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与虚假 TAM 陷阱
        blocks:
          - type: paragraph
            body: >-
              分析 Neros 时，应把它放在一个非常具体的国防市场里，而不是宽泛的民用无人机，甚至宽泛的军用无人机大盘里。应纳入的支出，是围绕可消耗 FPV
              攻击和侦察平台、它们的控制站和自主层，以及用于拦截类似威胁的邻近低成本动能反 UAS 系统的支出。这是一个真实且扩张中的品类，但它仍只是多数分析报告所称无人机市场的一个子集。MarketsandMarkets
              的军用无人机数字包括小型、战术和战略飞机，而反 UAS 报告包括探测网络、RF 感知、指挥软件、固定场址安装和压制工具。Neros 目前并未覆盖完整堆栈。

              实际含义是，如果不作调整，公开可得的几乎所有头部市场估计都会高估 Neros 可触达的机会。Neros 不卖消费无人机、农业无人机、货运 UAV 或 MQ-9 级系统。它也还不是全谱系反 UAS
              主承包商。Bandit 之所以具有战略意义，是因为它让 Neros
              在反无人机市场占住位置，但这并不意味着公司能提供该生态中每一种传感器、效应器和控制层。因此，正确边界更窄，但也更急迫：低成本、可补充、战场相关的机架和拦截器，由国防及盟国安全买方批量采购。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
