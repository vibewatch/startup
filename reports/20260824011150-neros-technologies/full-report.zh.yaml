      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Neros
              仍明显以创始人为中心，招聘岗位也显示，公司还在制度化那些更成熟防务供应商已经搭好的职能。招聘自主化负责人、战略财务人员、网络安全工程师、可靠性工程师和制造系统负责人，本身不是红旗；扩张期公司这样做很正常。但这说明，在业务已经承受重大增长压力时，关键职能仍在加深。这带来典型的时间错配风险：预期可能跑在组织成熟度前面。


              最重要的人员风险不是某个错误招聘，而是领导团队能否足够快地搭起中层运营、质量和安全能力，支撑工厂规模执行和更复杂产品。否则，公司可能遭遇防务硬件领域足以迅速改变客户和投资人情绪的质量或交付问题。
