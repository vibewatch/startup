      - number: '4.2'
        title: 销售动作、周期压缩与公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              对一家 2023 年成立的公司来说，Neros 的销售动作看起来异常高效。公开来源可见的路径是，先通过 Blue UAS 和 DIU
              式信任门槛验证，再贴近操作者，随后进入越来越大的政府采购工具。陆军路径是最清晰的例子：先入选 PBAS，再拿到更大的 IDIQ，随后出现首批数千架订单以及未来更大批量的说法。DLA
              的无人机市场和采购协助基础设施在这里很重要，因为它们降低了买方需求和采购执行之间的摩擦。如果获批系统能在数天而不是数月内从发现走到下单，营运资本周转会更快，供应商也能在更少现金困在长销售周期里的情况下扩张。

              与许多国防初创相比，Neros 的牵引力指标也异常具体。公司公开声称当前产速、月度目标、陆军订单和激进的 2028
              年产出野心。这些不是经审计收入数字，但作为需求代理指标，远好过抽象的管线语言。它们支持这样一种判断：Neros 已经越过科学项目阶段，但离真正财务承销所需的披露水平仍有距离。
