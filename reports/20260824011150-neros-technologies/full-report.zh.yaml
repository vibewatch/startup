        - label: Firestorm Series B 融资
          low: 0.082
          mid: 0.082
          high: 0.082
          unit: USD billions
          claimRefs:
            - CV015
    approximationNotes: 只展示已披露的点估值；其他同行缺少点估值，并不意味着战略价值更低。
    claimRefs:
      - CV001
      - CV004
      - CV013
      - CV014
      - CV021
  - id: FV002
    title: 估值测算 KPI
    type: kpi
    layout: standard
    summary: 需求证据和战略稀缺性很强；财务可见度和退出准备度滞后。
    data:
      items:
        - label: 需求 / 采购证据
          value: 4
          unit: /5
          detail: 陆军、海军陆战队和政策渠道都是真实公开信号
        - label: 制造可选性
          value: 4
          unit: /5
          detail: 如果利用率跟上，Millennium 可能意义重大
        - label: 财务可见度
          value: 1
          unit: /5
          detail: 收入、利润率、烧钱速度和积压订单基本仍未公开
        - label: 品类稀缺性
          value: 4
          unit: /5
          detail: 可信本土 FPV 和拦截器产能具备战略稀缺性
        - label: IPO 准备度
          value: 1
          unit: /5
          detail: 距离上市公司披露标准仍有明显距离
        - label: 估值风险
          value: 4
          unit: /5
          detail: 当前估值更依赖未来证据点，而不是已披露的当前经济性
    approximationNotes: 评分是基于公开证据的尽调判断，不是模型输出。
    claimRefs:
      - CV008
      - CV011
      - CV025
      - CV031
      - CV034
