      - number: '8.2'
        title: 可比集合：先看直接防务同行，再看相邻深科技
        blocks:
          - type: paragraph
            body: >-
              最干净的直接私营基准并不完美。Shield AI 和 Skydio 的自主化可读性更强；Skydio
              还公开表示收入达数亿美元、单位经济性在改善。当软件深度和运营成熟度更清晰时，市场愿意付多少钱，它们可以作为有用的上限参照。Firestorm
              的作用相反：它说明私募资本仍在支持制造优先的防务故事，但阶段更早、融资基础也小得多。上市公司提供另一种锚点。AeroVironment 的披露显示，成熟防务无人机规模在收入和积压订单上是什么样。Red Cat
              则提供一个较小的上市基准，经济性可见但仍偏早。放在一起，它们说明 Neros 理应相对原始原型叙事获得溢价，但不应拿到无视公开运营数字缺失的溢价。


              Proxima Fusion、TAE、Tokamak Energy 等相邻深科技融资轮更像语境，而不是直接可比。它们重要，是因为它们说明：只要品类故事足够强，2026
              私营市场仍愿意为资本密集型工业平台买单。但它们解决不了防务无人机的可比问题。Neros 仍应主要放在防务需求信号、采购信任和上市航天防务披露标准下评估，而不是拿泛化的前沿科技热情来评估。
