  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值、重估速度与投资人实际买入的东西
        blocks:
          - type: paragraph
            body: >-
              Neros 的 2026 年 8 月 Series C 不只是又一笔风险融资。该轮融资 $250M，投后估值
              $2.5B，把公司推成同龄私营防务无人机制造商中估值最高的一批。关键不只是价格高，而是这个价格默认了什么。公开证据显示，投资人同时押注三件事：Archer 系列系统周边的即时采购拉力、Project
              Millennium 可能打造一个异常重要的美国无人机制造节点，以及 Archer AI 和 Bandit 让公司从单一 FPV 供应商进化出去的期权价值。重估速度很关键。Neros 从 2025 年底约
              $839M 的 Series B，到约 9 个月后的 $2.5B Series C，估值跃升非常剧烈，而公司公开财务披露仍有限。


              因此，当前估值更多基于一种信念：这个品类中，可信的美国本土规模化供应会稀缺且具有战略价值；而不是基于干净的收入承销。这个判断并非不合理，但很激进。公开记录证明了需求、政策动能和异常执行速度；它还没有证明利润率、积压订单质量或现金效率。因此，投资人买的不是历史报告质量，而是拥有一家公司的权利：如果当下需求信号成熟为持久采购项目，它可能成为少数可信、本土、工业规模无人机供应商之一。
