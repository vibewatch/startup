      - number: '6.3'
        title: 具名客户证据与参考质量
        blocks:
          - type: paragraph
            body: >-
              可见客户集里的引用质量差异很大。美国陆军和美国海军陆战队最强，因为公开文件把它们和具体产品、项目、交付结构连在一起。这类引用比泛泛的品牌客户名单更有价值，因为它们暗示了真实部署场景。乌克兰也是重要验证点，但投资人应把它视为联盟战场需求信号，而不是正常的经常性企业客户引用。公司宣称的
              SOCOM 和盟国覆盖面在战略上令人振奋，但从尽调角度看仍低一档，因为可获得的公开证据多是公司或媒体层面的表述，而不是逐份合同的细节。


              证据质量不均很重要，因为它决定了外部能对客户耐久性建立多少信心。美国陆军和美国海军陆战队引用说明存在真实生产账户。SOCOM
              和盟国说法说明潜在覆盖面，但没有透明深度。因此，客户章节应保留具名、有证据账户与更广泛渠道渗透声明之间的区别。这个区别不会削弱投资逻辑，只会让分析更诚实。
