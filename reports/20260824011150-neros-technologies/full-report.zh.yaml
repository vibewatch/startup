      - number: '4.4'
        title: 资本充足性、剩余未知数与财务判断
        blocks:
          - type: paragraph
            body: >-
              Neros 显然已经解决了早期资本获取问题。公开证据显示，公司在种子前 / 种子、A 轮、B 轮和 C 轮累计披露融资约 $370.9 million，最新一轮明确投向 Archer AI、Bandit
              和产能扩张。对一家年轻公司来说，这是一笔庞大弹药，也解释了 Neros
              为什么能同时推进工厂建设和邻近产品。但从外部证据看，资本充足性还没有完全得到证明。公开信息中没有月度烧钱速度、现金余额、债务偿还表、在手订单滚动表或资本开支日历。因此，投资者可以说公司资金充足，但不能说公司资金使用高效。

              公开财务判断是：收入形成和市场拉力偏正面，收入质量好坏参半，利润率路径仍未解决。订单、融资和采购动能是真实的。利润率、烧钱速度和客户集中度仍不透明。仅凭公开证据，Neros
              看起来是一家高需求、高资本开支的国防制造商；如果利用率和定价跟上工业野心，其经济性可能变得优秀，反之则可能令人失望。
