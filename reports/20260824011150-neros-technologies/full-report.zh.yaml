      - number: '3.4'
        title: 护城河耐久性、锁定效应与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Neros 当前的护城河是运营型的，不是攻不破的堡垒。它来自创始人-市场匹配、可信采购、生产速度，以及与廉价大规模这一战时逻辑的对齐。这些在 2026
              年是真实优势，因为市场仍然碎片化，采购正被战场紧迫性重塑。但这些优势也会吸引竞争。如果更大的自主能力公司、上市现有巨头或主承包商支持的分层系统供应商认定低成本可消耗无人机和拦截器是战略优先项，Neros
              可能会发现，守住自己的差异化楔子成本很高。

              锁定效应也有限。买方可以在不同无人机类别之间多供应商并用，也可以混合 ISR、攻击和反 UAS 供应商。切换成本存在，但主要落在训练、工作流、备件和信任审批上，而不是永久平台锁定。这意味着 Neros
              必须持续靠响应速度和任务相关性取胜，不能只靠先发进入。好消息是，市场仍足够碎片化，专业公司仍有价值。坏消息是，碎片化往往只是暂时状态；目前也没有公开数据证明，一旦更大玩家充分反应，Neros 仍能维持持久优势。
