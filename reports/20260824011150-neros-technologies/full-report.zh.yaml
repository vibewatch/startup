chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与使命
        blocks:
          - type: paragraph
            body: >-
              Neros 在 2023 年围绕一个非常具体的判断起步：西方军队严重低估了低成本第一人称视角无人机在现代战争中的决定性作用，美国工业体系也缺乏在战场规模上制造这类无人机的结构性准备。公司由 Soren
              Monroe-Anderson 和 Olaf Hichwa 创立。两人的背景很少见，他们更接近 FPV 生态的原生参与者，而不是传统国防主承包商圈子里的人。Monroe-Anderson 的 Medium
              文章和第三方报道都把两位创始人描述为少年时期就开始搭建和竞速的人，在 Neros
              成立很久以前，就已经深度掌握无人机电子、机架和操作者工作流。这个创始故事很重要，因为公司的产品和工厂决策看起来都直接回应了创始人在乌克兰看到的需求：可扩展制造、低成本补充率、有韧性的无线电，以及摆脱中国部件依赖。

              公司的地理身份变化很快。Neros 于 2024 年在 El Segundo 开设 15,500 平方英尺设施，官网至今仍称总部位于 California 的 El
              Segundo。但后来的公司材料和第三方报道都指向一次更大的 South Bay 扩张：Project Millennium 把洛杉矶 250,000 平方英尺的 “Millennium One”
              场址称为公司的新全球总部，Dronexl 和 JobsWithDOD 则把该设施放在 Torrance。最清晰的综合判断是，Neros 的运营重心现在位于大洛杉矶 South Bay 走廊，保留 El
              Segundo 的早期根基，同时以 Torrance 为中心扩张工业产能。不同来源给出的使命一致：大规模制造实用、可消耗、美国或盟国来源的无人系统，让美国及盟国国防工业基础能够与中国和俄罗斯的生产经济性竞争。

              当前产品身份已经不止是一款可消耗无人机。官网和公司公告把 Archer、Archer Strike、Crossbow、Flatbow、Archer AI 和 Bandit
              定位为更广泛无人机制造平台的组成部分，Project Millennium 则把“终极产品”定义为工厂本身。这个表述会影响后续章节：Neros 并不只想成为单点 FPV
              产品供应商，而是想成为规模化的无人机系统、子部件乃至盟国制造节点的工业生产商。
