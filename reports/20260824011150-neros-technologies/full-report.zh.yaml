  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、变现方式与真正可见的部分
        blocks:
          - type: paragraph
            body: >-
              Neros 几乎肯定拥有多条收入线，但公开证据更能说明它卖什么，而不是如何定价或确认收入。最可见的收入来源是 Archer 系列无人机硬件、Crossbow 或 Flatbow
              等控制系统、与美国军方订单绑定的训练和支持，以及 Archer AI 和 Bandit 等未来路线图产品。公开材料还暗示，随着 Millennium
              扩张，公司可能从配件、本地化或主权制造合作、面向部件的工作中获得收入。即便如此，当前收入结构看起来仍高度硬件主导。每一条重大公告都围绕系统、订单、产能爬坡或部署时间表，而不是软件 ARR 或经常性许可。

              这并不意味着软件和服务无关紧要。在国防无人机市场，训练、集成和支持常常让收入比纯硬件销售更黏、更少受单次项目波动影响。但公开记录没有量化 Neros
              有多少毛利润来自这些附加项。因此，正确的财务起点是：一家硬件优先的国防供应商，带有服务附加和未来自主能力变现，而不是一家披着无人机外壳的纯软件公司。
