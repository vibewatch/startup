      - number: '1.4'
        title: 融资历史、合同动能与当前规模
        blocks:
          - type: paragraph
            body: >-
              Neros 的融资路径压缩得不寻常。公司在 2024 年 5 月披露 $10.9 million 种子前和种子融资，随后在 2025 年 3 月完成 $35 million A 轮，2025 年 11 月完成
              $75 million B 轮，并在 2026 年 8 月宣布 $250 million C 轮。把这些已披露轮次相加，意味着公司大约融资 $370.9 million；管理层和媒体报道通常四舍五入为约
              $371-375 million。C 轮给出的投后估值为 $2.5 billion，据 Dronexl 称，约为九个月前估值的三倍。Sequoia 领投 B 轮，并与 American Strategic
              Technology Fund 共同领投 C 轮，Interlagos、Valor Equity Partners、Allen & Company、Thiel Capital、Spark Capital 和
              Dylan Field 参投。

              合同动能解释了投资者为什么愿意这么快出手。公开证据显示，Neros 从 2024-2025 年与乌克兰相关的交付和 DIU 入选，推进到 2025 年底和 2026
              年中正式获得美国陆军与海军陆战队订单。陆军这条线尤其重要。Neros 先是在 2025 年 11 月宣布入选 PBAS 项目，随后又在 2026 年 6 月 30 日赢得一份 IDIQ 合同，合同上限最高
              $500 million，覆盖到 2031 年 6 月的 Archer FPV 系统、训练、测试和支持。GovConWire 和 JobsWithDOD
              称，公司已经开始履行首批数千架无人机的陆军订单。海军陆战队也授予一份数百万美元合同，用于 Archer Strike 系统和训练；官方 C 轮材料还称，Neros 与 SOCOM
              每个组成单位以及六个盟国签有合同。

              规模叙事很有吸引力，但风险还没有完全解除。Dronexl 报道称产量约为每周 1,200 架，JobsWithDOD 引用的数据超过每周 1,200 架，并称目标是在 2026 年底达到每月 10,000
              架；公司材料仍把 2028 年年产 100 万架作为目标。这些都是需求和制造进展的强信号，但不等同于经审计收入、长期在手订单或有保证的交付订单数量。当前最强的判断是，Neros
              无疑已经从原型初创跨入有意义的国防供应商阶段，但仍缺少支撑盈利能力或资本效率判断所需的公开财务透明度。
