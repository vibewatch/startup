      - number: '3.2'
        title: 竞争对手画像与相对优势
        blocks:
          - type: paragraph
            body: >-
              Shield AI 是野心最高的战略参照点。它资本雄厚，围绕 Hivemind 讲出庞大的自主能力故事，并且在多个飞行器类别上有更多公开证明。但它并不试图成为纯 FPV 消耗型公司。Skydio
              处在另一个不同但重要的邻近赛道：战术 ISR、停机坞自主，以及面向公共安全和国家安全的软件密集型工作流。Red Cat/Teal 可能是最清晰的近身竞争对手，因为它向重视可信度且需求重叠的买方销售美国制造、符合
              Blue UAS 的战术系统。Firestorm 则从另一个方向发出竞争警告：工业系统设计可能变得和机架规格同样重要。

              现有巨头替代方案很重要，因为买方不会在每个周期都清零采购历史。Teledyne FLIR 通过 Black Hornet 占住强势士兵携行 ISR 细分市场。AeroVironment
              仍是在规模化国防无人机和巡飞弹可信度上的标杆。与这个领域相比，Neros 更年轻、更窄，软件成熟度也更低——但它更真实地聚焦于可消耗规模和战场生产经济性。
