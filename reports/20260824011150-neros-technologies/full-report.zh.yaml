          - type: paragraph
            body: >-
              客户基础看起来强，恰恰因为它集中。大多数公开证据落在少数政府和盟国渠道里。采购顺风强时，这可以是优势；但它也是最清晰的结构性脆弱点。公开证据没有显示多元化商业收入、具名盟国覆盖面，也没有给出逐客户经济性的透明细节。几个可能重要的页面不可用、被限速或受保护，进一步限制了外部尽调。即便
              Neros 团队页也受保护，部分第三方文章和公司关联页面也无法访问。


              正确结论不是客户基础很弱，而是它真实、狭窄、任务驱动，并且仍有一部分不透明。扩张很可能存在，尤其通过 Drone Dominance
              和本地化盟国市场动作实现，但公开证据还不足以证明这种扩张最终会有多分散、粘性有多强。投资人因此应把集中度风险视为 Neros 客户投资逻辑的核心，而不是附带问题。
