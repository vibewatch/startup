      - number: '1.5'
        title: 里程碑、战略方向与早期反向背景
        blocks:
          - type: paragraph
            body: >-
              2023 年到 2026 年的里程碑节奏是连贯的：2023 年创立并在车库阶段迭代，2024 年开设初始设施并披露种子融资，2025 年融资加速并获得首个重要采购验证，2026
              年转向工业级规模野心并拓宽产品线。每一步都强化了同一个核心投资逻辑，而不是改写它。公司早期文章和后续融资公告反复回到四条主线：大规模可制造性、来自乌克兰的战场反馈、盟国或国内采购，以及能按数千架而不是数十架采购的低成本系统。

              2026 年最具战略意义的变化，是 Neros 从一次性攻击和侦察产品，扩展到反 UAS 和多资产自主能力。Archer AI 让产品线更接近受争夺电磁环境中的辅助自主，而 Bandit
              打开了进入拦截器经济性的路径；这个领域的核心挑战不只是飞行性能，而是把单次杀伤成本压到足够低，才能可持续地击败廉价来袭无人机。Tectonic 关于 CX2 合作的报道又补充了一个角度：Neros
              也在试验射频寻的和目标定位载荷，把 Archer 延伸到面向特种作战买家的“发现、锁定、终结”任务。

              反向背景不只是伦理问题，尽管伦理确实重要。Arms Control Association 对参议院 2026
              年自主武器框架的报道显示，围绕人类判断、操作者接管和测试验证的监管负担正在收紧，而不是放松。另一个层面，Dronexl 对陆军合同的怀疑性处理正确指出，IDIQ 上限不是有保证的收入承诺。换句话说，Neros
              对早期“有没有人能造出来？”这个问题的回答，远比它对后期“有多少需求是持久、已签约且可盈利？”这个问题的回答更有说服力。对一家 2023
              年成立的初创公司来说，这仍是正面的公司概况结论——但它让投资案仍处在高增长、高执行风险区间，而不是变成已经坐实的工业赢家。
