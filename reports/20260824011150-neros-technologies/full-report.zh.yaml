figures:
  - id: FO001
    title: Neros 公司里程碑时间线（2023-2026）
    type: timeline
    layout: wide
    summary: 从 Neros 2023 年创立，到 August 2026 完成 Series C 轮并推进 Millennium One 扩产的关键里程碑。
    data:
      items:
        - label: 创立
          date: '2023'
          detail: Soren Monroe-Anderson 与 Olaf Hichwa 围绕可规模化 FPV 与本土供应逻辑创立 Neros
          tone: positive
        - label: El Segundo 工厂
          date: 2024-05
          detail: 15,500 sq ft 研发与生产场地启用
          tone: positive
        - label: DIU EMI 入选
          date: 2024-08
          detail: 与 Auterion、ModalAI 一同入选，推进争夺频谱环境原型工作
          tone: positive
        - label: 乌克兰 6,000 架合同
          date: 2025-02
          detail: 国际联盟合同验证战场适配性
          tone: positive
        - label: Blue UAS / Archer
          date: 2025-02
          detail: Archer 进入 Blue UAS 流程，随后取得 ATO
          tone: positive
        - label: Series A 轮
          date: 2025-03
          detail: 融资 $35M，加速美国无人机制造
          tone: positive
        - label: 陆军 PBAS 入选
          date: 2025-11
          detail: 陆军为可消耗 FPV 项目选择 Archer 与 Flatbow 套装
          tone: positive
