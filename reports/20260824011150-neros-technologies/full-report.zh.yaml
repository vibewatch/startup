      - number: '8.3'
        title: 估值为什么能成立——以及为什么仍需大幅折价
        blocks:
          - type: paragraph
            body: >-
              估值论证中最强的一点是，Neros 看起来已经从实验室承诺跨进项目相关性。美国陆军和海军陆战队牵引、Blue UAS 信任信号、Drone Dominance 需求，以及 Millennium
              的工厂野心，共同创造了真实稀缺价值。把它当作商品化公司会错失这一点。Neros
              不是把自己包装成通用机体工厂；它把自己定位为战时可消耗无人机的可信美国本土供应与生产平台。如果这个定位真实，期权价值相当大。它可能支撑重复订单、盟国渠道和更高价值产品邻接。


              但这些正面因素仍需要实质性折价。美国陆军天花板不是积压订单。生产速度不是利润。巨型工厂究竟是护城河还是负担，取决于利用率。软件式风险投资倍数逻辑同样不合适，因为公开证据没有显示经常性软件经济性、经审计的高毛利率，或清晰的装机基础变现模型。正确承销姿态应是混合且保守的：认可公司的战略稀缺性、当前采购牵引和政策顺风，同时因为公开记录在经济性上仍薄弱而采用宽估值区间。这个组合解释了为什么本轮融资既激进、又仍可辩护；也解释了为什么后续资本应由里程碑触发，而不是默认会到位。
