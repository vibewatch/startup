  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    insight: 公开可见队列显示，陆军关系是最强的复购采购路径；其他渠道持续时间较短，或披露仍不足。
    data:
      columns:
        - 第 1 年后
        - 第 2 年后
        - 第 3 年后
      rows:
        - label: 陆军项目队列（2025 年 PBAS 起）
          values:
