  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险叠加
        blocks:
          - type: paragraph
            body: >-
              Neros 所处市场里，政策和采购规则不是背景条件，而是产品的一部分。Blue UAS / DCMA
              资质、外国零部件限制、出口管制规则，以及对自主化治理预期的收紧，都直接影响收入形成。公司受益于这种环境，因为它围绕安全供应和美国本土或盟国来源定位；但如果规则转向、可信名单路径变化，或产品功能跑得比治理框架更快，同一优势也会变成风险。可获得的公开记录还留下法律流程盲区。抓取时，相关美国国务院和
              Federal Register 页面很难访问，这本身也提醒投资人：官方规则细节移动得比开放网络尽调界面更快。


              最重要的结论是，Neros 的监管护城河不是已经定型的护城河，而是动态护城河。政策潮水有利时，它很有吸引力；一旦潮水转向，或监管要求高于管理层预期，它也会很危险。
