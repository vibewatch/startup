      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Neros
              正在同时啃几件难事：大幅放大工厂产出，本地化或确保更多零部件栈安全，推出自主化增强产品，并参与奖励低成本、高速度的采购结构。任何一件单独看都是重大执行挑战；放在一起，就形成高复杂度运营模型。Millennium
              One 是最清晰的例子。它可能成为公司的定义性资产，但也抬高了招聘、流程控制、良率、质量和营运资本的门槛。如此激进的工厂不会一次性失败；它会在吞吐量落空、零部件瓶颈、培训负担或支持薄弱中逐步失速。


              公开网络安全和隐私证据比没有强，但仍不完整。隐私政策显示，公司在支持数据处理和政府披露上有基本严肃性。不过，正式公开的保证材料相对其任务的防务关键性仍偏薄。结果是，公司公开信任姿态方向上合适，但还不能被充分检查。
