summary:
  headline: >-
    Neros Technologies 是一家高确信度国防科技无人机公司，一边承载 $2.5B Series C 的陡峭估值，一边已有可信证据显示 Archer AI 和 Bandit 正在美国军方部署，产能爬坡真实，Sequoia
    与国防导向基金背书也强。核心风险是 DoD 预算集中、1M 架 / 年目标的执行难度，以及大型主承包商带来的监管和竞争压力。建议观察，并保持积极跟投兴趣。
