  topStrengths:
    - 可信军事部署：Archer AI 和 Bandit 系统已部署在美国陆军、海军陆战队和 SOCOM，给了 Neros 多数国防初创公司缺少的实战证据
    - 产能野心明确：Torrance 工厂占地 250,000 sq ft，目标 1M 架无人机 / 年，说明公司不是停在原型阶段，而是在认真搭制造能力
    - Sequoia 领投 Series C：硬件国防公司拿到一线 VC 背书并不常见，ASTF（American Strategic Technology Fund）同步进入，也释放出国防体系支持信号
    - 创始人-市场匹配度高：CEO Soren Monroe-Anderson 的无人机竞速背景和年轻形象，给 Neros 带来真实的产品直觉、强媒体辨识度和招聘吸引力
    - 时点优势：乌克兰战争之后，美国军方采购更急，平价自主无人机系统的大规模需求被显著放大
  topRisks:
    - DoD 预算集中：收入几乎全部来自美国政府合同，公司对预算周期波动和持续决议风险高度敏感
    - 执行风险：从数百架放大到每年 1M 架，需要前所未有的制造纪律、供应链深度和质量控制
    - 既有主承包商竞争：Northrop Grumman、L3Harris 和 AeroVironment 已有客户关系、ITAR 合规基础设施和资金厚度
    - 监管和出口风险：无人机技术受 ITAR 管制，限制盟国销售，也增加合规负担
    - 自主武器争议：国会和公众对致命自主系统审查加码，可能影响采购意愿或增加认证负担
  unresolvedGaps:
    - 详细合同金额和收入积压订单未公开
    - 单位经济模型、毛利率和单架无人机成本结构未公开
    - 股权结构表、投资人权利和清算优先权未披露
    - 技术规格（航程、载荷、续航）部分涉密
    - 面向盟国出口的 ITAR 合规认证状态未公开
