companyProfile:
  summary: >-
    Neros Technologies is a Torrance, California-based autonomous drone company that designs and
    manufactures AI-enabled unmanned aerial vehicles for US and allied military customers. Founded
    by CEO Soren Monroe-Anderson and a team of drone racing veterans turned defense engineers, Neros
    has grown rapidly from a startup to a $2.5 billion company in approximately three years by
    addressing the military's urgent need for affordable, mass-producible combat drones. Its flagship
    products — the Archer AI FPV combat drone and the Bandit counter-drone interceptor — are deployed
    by the US Army, Marine Corps, and SOCOM components. The company raised $250M Series C in August
    2026, led by Sequoia Capital and the American Strategic Technology Fund, confirming its position
    as one of the fastest-growing defense-tech unicorns in the US.
  foundedDate: '2023-01-01'
  founders:
    - name: Soren Monroe-Anderson
      role: CEO & Co-Founder
      background: >-
        Former teenage drone racing champion who pivoted to defense technology. Built Neros from a
        backyard drone project to a $2.5B defense company in roughly three years.
      claimRefs:
        - CO002
        - CO003
  foundingLocation: Torrance, California, USA
  headquarters: Torrance, California, USA
  productSummary: >-
    Neros produces two primary product lines: Archer AI, an AI-guided first-person-view (FPV) combat
    drone capable of autonomous navigation and targeting in GPS-denied environments, and Bandit, a
    counter-drone interceptor designed to neutralize Shahed-class and other loitering munitions. The
    company operates a 250,000 sq ft production facility in Torrance with the stated goal of
    producing one million drones per year by 2028.
  customerFocus: >-
    US Department of Defense customers including the US Army, Marine Corps, and Special Operations
    Command (SOCOM) components. The company also sells to allied nations through FMS (Foreign Military
    Sales) channels. All revenue is government or government-adjacent.
  businessModel: >-
    Government defense contractor with unit economics tied to DoD procurement contracts. Revenue from
    volume production contracts for Archer AI and Bandit systems. The company is scaling rapidly toward
    high-volume manufacturing to reduce per-unit costs and win larger volume orders.
  stage: Series C, venture-backed private
