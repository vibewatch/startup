- id: moat-and-competitive-risk
  title: Moat Durability, Lock-In, and Adverse Competitive Evidence
  body: 'Neros'' current moat is operational, not impregnable. It comes from a combination of founder-market fit, trusted sourcing, production speed, and alignment with the wartime logic of cheap mass. Those are real advantages in 2026 because the market is still fragmented and procurement is being reshaped by battlefield urgency. But they are also advantages that can attract competition. If larger autonomy firms, public incumbents, or prime-backed layered systems providers decide that low-cost attritable drones and interceptors are strategic priorities, Neros may find that its differentiated wedge is expensive to defend.


    Lock-in is also limited. Buyers can multi-home across different drone categories, and they can mix ISR, strike, and counter-UAS vendors. Switching costs exist, but they live mostly in training, workflow, spares, and trust approvals rather than in permanent platform lock-in. That means Neros must keep winning on responsiveness and mission relevance, not just on first entry. The good news is that the market remains fragmented enough for specialists to matter. The bad news is that fragmentation is often temporary, and no public data yet proves that Neros can sustain a durable advantage once the larger field fully reacts.'
