- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters to Neros
  rows:
  - - Ukraine battlefield proof
    - Driver
    - Mass FPV usage and replenishment economics
    - Validates attritable-drone demand and compresses procurement timelines
  - - Army drone-dominance doctrine
    - Driver
    - Force-wide doctrinal rewrite around UAS
    - Turns drones into standard equipment rather than niche add-ons
  - - Foreign-drone restrictions / trusted sourcing
    - Driver
    - FCC Covered List and national-security push
    - Supports domestic-component positioning and procurement trust
  - - Low-cost kill economics
    - Driver
    - Interceptors are needed to defend against cheap drones sustainably
    - Creates rationale for Bandit and related counter-UAS programs
  - - Manufacturing throughput and capital needs
    - Constraint
    - Million-unit ambitions require factory, labor, and component resilience
    - Industrial scaling could outpace firm orders
  - - Mitigation authority / spectrum / privacy rules
    - Constraint
    - C-UAS deployments still face legal and operational gates
    - Can delay Bandit or other defense-adjacent deployments
  - - Procurement staging
    - Constraint
    - Trust gates still matter even in urgent categories
    - Revenue lags battlefield excitement
  - - Autonomy governance tightening
    - Constraint
    - Human-judgment and override expectations are rising
    - Important as Neros adds Archer AI and Bandit
  notes: Drivers are real and near-term, but so are the structural frictions that separate demand signal from actual revenue capture.
