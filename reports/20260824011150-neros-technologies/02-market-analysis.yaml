  - - Broad military drones (MarketsandMarkets)
    - $34.85B in 2026 to $109.22B in 2031
    - Small, tactical, and strategic classes across many mission types
    - Too broad to use directly as Neros TAM
  - - Broad counter-UAS (MarketsandMarkets)
    - $9.17B in 2026 to $29.70B in 2031
    - Detection, C2, mitigation, deployment variants, multiple end users
    - Helpful for Bandit adjacency, but only a partial fit
  - - Counter-drone range compilation (TheWorldData)
    - $3.88B-$4.93B in 2026; $14.5B-$36.4B later
    - Cross-analyst range with cost-exchange and budget context
    - Best used to preserve uncertainty, not force a single answer
  - - Budget line lens (DoD autonomy / unmanned / c-UAS)
    - $13.4B autonomy; $9.4B aerial; $3.1B c-UAS
    - Actual FY2026 priority spending lines
    - Best near-term proxy for addressable budget energy
  - - Replenishment lens (Ukraine FPV demand)
    - 4.5M planned FPVs in 2025
    - Consumable, repeat-purchase attrition model
    - Explains why million-unit annual throughput can be rational
  notes: This chapter intentionally uses multiple sizing lenses instead of pretending that one analyst number is precise enough for underwriting.
