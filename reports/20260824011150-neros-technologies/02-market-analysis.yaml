- id: TM001
  title: Market definition table
  columns:
  - Segment / Spend Bucket
  - Include?
  - Why it matters to Neros
  - Why included or excluded
  rows:
  - - Attritable FPV strike and reconnaissance drones
    - Included
    - Core Archer and Archer Strike wedge
    - Directly aligned with Neros products and battlefield demand
  - - Ground control, radios, and autonomy software
    - Included
    - Required to make the airframe operational in contested environments
    - Neros sells control systems and autonomy enhancements alongside aircraft
  - - Low-cost kinetic counter-UAS interceptors
    - Included
    - Bandit extends Neros into drone defense
    - Relevant because Bandit targets Class 2/3 threats and low-cost defeat economics
  - - Large tactical/strategic unmanned aircraft
    - Excluded
    - Little current product overlap
    - Analyst TAMs include aircraft classes Neros does not serve
  - - Civil/commercial inspection, agriculture, delivery drones
    - Excluded
    - Not current target customers or workflows
    - Broad drone-market reports would materially overstate reachable demand
  - - Full-stack fixed-site C-UAS networks and radar/C2 programs
    - Partial
    - Bandit touches only one layer of the stack
    - Neros lacks evidence of full detection/C2 platform coverage today
  notes: The boundary is deliberately narrower than most analyst TAMs. It focuses on the spend categories Neros currently touches or plausibly adjacent-expands into within the next 12-24 months.
