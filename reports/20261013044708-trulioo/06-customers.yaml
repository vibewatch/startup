company:
  name: Trulioo
chapter:
  number: 6
  title: Customers
  summary: Trulioo powers identity and business verification across regulated industries including banking, payments, and
    online marketplaces, serving over 450 enterprise customers globally. Real-world adoption is proven by top-tier payments
    and financial infrastructure deployments such as Nuvei, yet commercial retention metrics, net revenue retention rates,
    and customer concentration profiles remain undisclosed private diligence gaps.
sections:
- id: customer-segmentation-and-buyer-profiles
  title: Customer Segmentation & Buyer Personas
  body: Trulioo’s commercial customer base concentrates heavily within highly regulated financial services, global payments,
    cryptocurrency platforms, e-commerce networks, and digital marketplaces. Enterprise buyers typically consist of Chief
    Compliance Officers, Global Heads of Risk and Underwriting, and product engineering teams tasked with meeting stringent
    anti-money laundering and customer due diligence regulations. These enterprise organizations require unified, low-latency
    onboarding workflows capable of clearing complex Know Your Customer (KYC), Know Your Business (KYB), and ongoing sanctions
    screening requirements across multinational jurisdictions without introducing excessive user friction. Through a single
    API contract, Trulioo provides access to over 450 regional and international data sources, addressing both large-scale
    individual verification volumes and complex corporate entity structures. However, commercial pricing remains strictly
    custom-quoted, requiring direct enterprise sales engagements and developer-led API integration efforts that create high
    switching costs once production pipelines are established.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
- id: adoption-trajectory-and-deployment-scale
  title: Adoption Trajectory & Operational Deployment Scale
  body: Trulioo has expanded its operational verification footprint to cover more than 5 billion individuals and 700 million
    verifiable business entities across 195 countries. Commercial transaction volume reflects strong enterprise uptake, highlighted
    by a verified 102 percent year-over-year transaction volume increase in U.S. Know Your Business verifications following
    the rollout of automated ultimate beneficial owner resolution and unified risk scoring. The technical architecture executes
    automated verifications in under 5.2 seconds on average, utilizing machine-learning routing to optimize match rates across
    regional datasets while delivering audit-ready regulatory evidence. Enterprise buyers deploy the platform to automate
    previously manual compliance reviews, reducing onboarding review times from several days down to minutes while consolidating
    separate point solutions into a single vendor integration.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: named-deployments-and-retention-dynamics
  title: Named Customer Proof & Durability Risks
  body: Demonstrated production deployment is confirmed by enterprise customers such as global payments processor Nuvei, where
    Trulioo unifies commercial KYB entity validation with biometric document KYC to streamline merchant onboarding across
    multiple continents. Public references and platform reviews from organizations such as About-Fraud, Gappsy, and Financial
    IT corroborate that hundreds of financial technology and payment providers rely on Trulioo's Global Gateway architecture
    for multi-jurisdiction compliance. Despite these named enterprise proof points, Trulioo does not publicly disclose cohort-level
    net revenue retention (NRR), gross revenue retention (GRR), annual churn rates, or top-10 customer revenue concentration.
    While multi-year contracts and deep workflow integrations with compliance systems create substantial platform stickiness,
    the absence of audited retention numbers represents a critical diligence gap for evaluating customer durability.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU003
