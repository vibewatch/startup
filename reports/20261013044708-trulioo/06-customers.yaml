callouts:
- calloutType: insight
  title: High Switching Costs in Multi-Jurisdiction Regulated Pipelines
  body: Once an enterprise financial institution embeds Trulioo's API into its core customer onboarding architecture, switching
    costs are exceptionally high. Replacing Trulioo requires re-architecting data connections across 450 regional databases,
    re-certifying compliance with regulatory authorities such as FinCEN, FCA, and FINTRAC, and negotiating dozens of local
    vendor agreements. This operational inertia creates strong contractual durability despite the lack of public retention
    metrics.
  claimRefs:
  - CU002
  - CU004
  - CU008
- calloutType: risk
  title: Private Disclosure Barrier Around Customer Retention and Concentration
  body: Trulioo does not disclose cohort-level net revenue retention (NRR), gross revenue retention (GRR), or customer concentration
    metrics. While growth in KYB transaction volume indicates strong enterprise adoption, private diligence must obtain audited
    cohort retention and verify that top customer concentration does not pose an unmitigated commercial vulnerability.
  claimRefs:
  - CU007
  - CU012
  - CU013
