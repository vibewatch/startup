callouts:
- calloutType: recommendation
  title: Valuation Discipline and Entry Multiples
  body: Institutional investors should resist anchoring to Trulioo's 2021 peak $1.8B valuation mark. Any new investment must
    demand a sub-10x forward ARR multiple, verified audited gross margins above 60%, and clear liquidation seniority to protect
    against macro software multiple contraction.
  claimRefs:
  - CV001
  - CV003
  - CV014
- calloutType: risk
  title: Secondary Liquidity Overhang and Capital Cushion
  body: Because $244 million of the $394 million Series D round provided secondary liquidity to early shareholders rather
    than balance sheet cash, Trulioo's primary cash cushion is substantially smaller than headline funding figures suggest,
    heightening the need to verify operational cash flow breakeven.
  claimRefs:
  - CV004
  - CV005
- calloutType: insight
  title: KYB Expansion as Primary Multiple Driver
  body: Trulioo's 102% year-over-year U.S. KYB transaction growth and credit decisioning launch represent its strongest commercial
    catalysts, positioning the company to capture higher annual contract values in complex business verification where pricing
    power exceeds commoditized consumer KYC.
  claimRefs:
  - CV006
  - CV007
  - CV008
