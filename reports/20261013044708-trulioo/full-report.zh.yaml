  - id: FP001
    title: 竞争定位：数据广度 vs. 集成摩擦
    type: quadrant
    summary: 相较开发者友好型和文件专业型验证同业，Trulioo 处于数据广度高、企业复杂度高的位置。
    approximationNotes: 坐标依据有证据支持的 1-10 序数定位：数据覆盖广度（x 轴）以及平台集成便利度与摩擦（y 轴）。
    claimRefs:
      - CP001
      - CP006
      - CP012
    data:
      xAxis:
        label: 全球数据广度及覆盖（1=单一区域，10=195+ 个国家）
        min: 1
        max: 10
      yAxis:
        label: 集成简易度及价值实现时间（1=API 摩擦高，10=无代码交钥匙）
        min: 1
        max: 10
      points:
        - label: Trulioo
          x: 9.5
          'y': 4
          detail: 数据库覆盖 195 个国家（5B 人、700M 个实体），广度无可匹敌，但技术 API 集成需要 2 个月。
        - label: Sumsub
          x: 6.5
          'y': 8.5
          detail: 交钥匙一体化验证套件，价格公开，开户采用低代码方式。
        - label: Onfido
          x: 6
          'y': 7
          detail: 面向开发者的移动 SDK，支持生物识别和文件核查，集成开销适中。
        - label: Jumio
          x: 7
          'y': 5
          detail: 高交易量企业验证基础设施，集成和签约要求正式且严格。
        - label: LexisNexis Risk Solutions
          x: 8.5
          'y': 3
          detail: 传统存量数据提供商，公共记录丰富，但遗留架构笨重。
        - label: In-House Point Solutions
          x: 3
          'y': 2
          detail: 分散的多供应商技术栈，需要大量定制工程维护和供应商采购。
  - id: FI001
    title: Trulioo 收入模型及经济流转桥
    type: flow
    summary: 展示企业客户开户活动如何经过 Trulioo 验证平台转化为毛利的逐步流程。
    data:
      nodes:
        - id: client-activity
          label: 客户交易启动
          detail: 企业通过 Trulioo API 发起终端用户 KYC 或企业 KYB 开户
        - id: workflow-routing
          label: 工作流路由及验证
          detail: Trulioo 编排文件核查、数据库匹配、观察名单筛查或信贷情报
        - id: data-procurement-cost
          label: 第三方数据转付成本
          detail: Trulioo 查询外部政府登记库和征信机构，承担边际 COGS
        - id: gross-revenue
          label: 总收入计费
          detail: 客户支付平台基础订阅费及按交易量分层的交易费
        - id: gross-profit
          label: 毛利获取
          detail: 扣除数据提供商 API 费、云托管费和人工复核成本后的剩余利润
        - id: operating-reinvestment
          label: 运营再投资
          detail: 毛利用于 AI 自动化研发、企业直销及全球扩张
    approximationNotes: 展示定性经济机制；由于私有公司披露有限，具体美元贡献和毛利率均为估算。
