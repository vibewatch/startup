  - id: FE001
    title: Trulioo 平台技术架构栈
    type: stack
    summary: 六层架构栈拆解 Trulioo 的入口、工作流策略、验证引擎、数据连接器及合规基础设施。
    data:
      layers:
        - label: 入口及客户集成层
          detail: 面向客户的集成界面，以低代码和 API 方式访问身份服务。
          items:
            - label: API 直连 REST 端点
              detail: 单一令牌和统一端点，支持 43 种语言的 JSON 请求载荷
            - label: Web 及移动客户 SDK
              detail: 嵌入式采集界面，支持文件扫描、光学取景和自拍活体采集
            - label: Trulioo 管理门户
              detail: Web 应用，提供单点登录、人工复核队列及验证表现分析
        - label: 工作流编排及策略层
          detail: 可配置执行层，用于评估确定性业务逻辑和司法辖区路由。
          items:
            - label: Workflow Studio 引擎
              detail: 无代码逻辑构建器，可按条件排列查询顺序，无需修改定制代码
            - label: 动态规则执行路由器
              detail: 超时或不匹配时自动级联回退，从主要征信机构切换至次要征信机构
            - label: 风险评分归一化器
              detail: 将 60 多项欺诈信号合成为交易综合分数，自动作出通过 / 不通过决定
        - label: 核心验证及情报引擎
          detail: 由内部和合作伙伴算法处理单元评估身份凭证及风险。
          items:
            - label: 电子身份（eIDV）引擎
              detail: 2+2 个人匹配，验证姓名、出生日期、地址和国家身份号码
            - label: 文件采集及 OCR 引擎
              detail: 分析 14,000+ 个政府身份证件模板，并将光学篡改检测扩展至水电账单
            - label: 面部生物识别及已知人脸
              detail: 对照图像库进行一对多面部比对，标记重复欺诈并确认一对一活体
            - label: 企业 KYB 及 UBO 图谱构建器
              detail: 递归解包企业登记信息，将实体要素连接至最终受益所有人
        - label: 商业风险及信贷决策引擎
          detail: 在企业开户期间评估财务健康度和破产概率。
          items:
            - label: 预定义信贷规则引擎
              detail: 自动化决策树，将商业信贷参数与承保阈值匹配
            - label: 预测性风险分层
              detail: 实时评估现金流稳定性和商业破产风险
        - label: 全球数据市场及连接器网络
          detail: 外部集成网络，协调访问主权、商业及监管登记库。
          items:
            - label: 主权及消费者数据登记库
              detail: 450+ 个独立电信、政府、公用事业和征信机构数据连接器
            - label: 全球企业实体登记库
              detail: 电子连接覆盖主权商业登记库中的 700M+ 个企业实体
            - label: 制裁及 PEP 筛查数据流
              detail: 近实时监测 6,000+ 个全球观察名单和 20,000 个负面媒体来源
        - label: 审计、合规及报告层
          detail: 确保不可否认性、审计就绪和合规监管监督的基础设施。
          items:
            - label: 监管交易审计存储
              detail: 不可变日志保存验证结果、匹配代码及决策时间戳，供审计人员查阅
            - label: 合规报告及分析
              detail: 仪表板按 FinCEN、FCA 和 CySEC 框架格式化，证明 KYC/KYB 合规
            - label: 自动化整改及警报引擎
              detail: 通过 Webhook 通知客户企业所有权变更、高管转任或命中制裁名单
    approximationNotes: 层级拆解综合自 Trulioo 技术公告、专利披露及系统架构规格。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE011
      - CE013
  - id: FU001
    title: 企业客户合规采用及扩张生命周期
    type: journey-map
    summary: 展示客户从初始合规评估到全球司法辖区生产扩张的开户阶段。
    data:
      items:
        - label: 合规范围界定
          stage: Evaluation
          touchpoints:
            - 采购团队评估目标市场的 AML、KYC 和 KYB 要求
            - 根据预计年交易量协商定制合同
        - label: API 沙盒集成
          stage: Integration
          touchpoints:
            - 工程团队集成单一 REST API 并配置沙盒
            - 配置覆盖 450+ 个验证来源的机器学习路由规则
        - label: 生产上线
          stage: Deployment
          touchpoints:
            - 自动完成低于 5.2 秒的消费者身份匹配和文件活体检查
            - 为新客户自动验证 KYB 实体及受益所有权
        - label: 平台扩张
          stage: Expansion
          touchpoints:
            - 企业客户跨境扩张时增加地理覆盖模块
            - 将实时信贷决策和欺诈情报叠加到开户流程
        - label: 持续监控
          stage: Retention
          touchpoints:
            - 针对更新后的国际 AML 观察名单自动定期筛查
            - 实时监测负面媒体及政治公众人物登记库
        - label: 多实体 KYB 尽职调查
          stage: Governance
          touchpoints:
            - 从国家企业登记库调取官方注册文件
            - 自动识别和验证最终受益所有人
    approximationNotes: 旅程阶段和触点反映标准企业合规部署架构及已发布的产品工作流。
