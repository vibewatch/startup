      - number: '5.2'
        title: 核心验证模块与能力矩阵
        blocks:
          - type: paragraph
            body: >
              Trulioo 的商业能力套件分为四个主要功能模块：Person Verification (KYC)、Business Verification (KYB)、AML Watchlist & Adverse
              Media Screening，以及 Fraud & Risk Intelligence。Person Verification 模块把 2+2 电子数据匹配（在独立数据库中确认姓名、地址、出生日期和国家
              ID）与文件采集验证结合起来，可分析 43 种语言的政府签发证件。在高保障场景下，文件验证还加入自拍生物识别认证和篡改检测，覆盖水电账单、银行对账单等非身份证明材料。

              Business Verification 模块通过查询主权公司登记册，自动完成企业开户，获取正式注册证书、验证实体基本信息、识别公司高管并追踪股东层级，以定位最终受益所有人。平台把 KYB
              实体解析与对已发现自然人所有者的自动 KYC 结合到统一工作流中，将企业尽调从多个工作日压缩到自动化实时决策。2025 年末，Trulioo 又将 Credit Decisioning
              接入这一工作流，在商户和供应商开户时吸收商业信用风险及现金流指标，提供嵌入式资不抵债评分。

              AML 筛查持续覆盖开户和开户后生命周期，针对全球制裁数据库、政治公众人物 (PEP)
              名单和负面媒体来源筛查个人及实体。所有交易记录、提取的文件载荷和验证匹配代码都记录在客户门户中，并附带可审计评分，使金融机构和市场平台能在 FinCEN、FCA、FINTRAC 和 CySEC
              要求下满足监管合规标准，同时保留可辩护的运营记录。
            claimRefs:
