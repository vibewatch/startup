      - number: '6.3'
        title: 已命名客户证明与持久性风险
        blocks:
          - type: paragraph
            body: >-
              全球支付处理商 Nuvei 等企业客户已确认 Trulioo 的生产部署；Trulioo 在 Nuvei 处把商业 KYB 实体验证与生物识别文件 KYC
              统一，简化跨洲商户开户。About-Fraud、Gappsy 和 Financial IT 等机构的公开引用及平台评价也印证，数百家金融科技和支付服务商依赖 Trulioo 的 Global Gateway
              架构完成多司法辖区合规。尽管有这些具名企业证明，Trulioo 并未公开客户群层面的净收入留存 (NRR)、毛收入留存 (GRR)、年度流失率或前 10
              大客户收入集中度。多年期合同和与合规系统的深度工作流整合带来较强平台粘性，但缺少经审计的留存数字，仍是评估客户持久性的关键尽调缺口。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
