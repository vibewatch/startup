  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与交付平台
        blocks:
          - type: paragraph
            body: >
              Trulioo 运营企业级身份验证平台，通过单一技术入口编排覆盖 195 个国家的个人 (KYC) 和企业 (KYB)
              合规工作流。平台最初只是一次性身份验证机制，后来演变为端到端身份验证与合规引擎，统一电子身份验证 (eIDV)、光学文件验证、企业登记册提取、AML 观察名单监控和实时风险情报。企业可以通过 API Direct
              使用标准化 REST API，只需一个认证令牌和端点；也可以使用 Workflow Studio，这是一套低代码 / 无代码逻辑配置界面，可在无需修改定制代码的情况下，将验证请求路由到不同地区的供应商。

              核心交付栈分为五层：集成入口、工作流编排、验证引擎、数据市场连接器和审计基础设施。在入口层，客户请求通过 API Direct、移动及 Web SDK 或管理端 Trulioo Portal
              提交。Workflow Studio 充当决策路由引擎，根据司法辖区和风险等级执行确定性规则集、条件回退和多征信机构查询序列。在编排层下方，专用引擎执行不同验证方式，包括将非文件个人可识别信息 (PII)
              与政府、电信和征信数据库匹配，自动进行带光学字符识别 (OCR) 的文件验证，检测面部生物特征活体，以及拆解企业实体的最终受益所有权 (UBO)。

              数据访问由 Trulioo 专有的 Data Marketplace 中介，该市场连接超过 450 个全球和本地数据登记册及征信机构、超过 14,000 个国家身份证件模板、6,000 个全球制裁和 PEP
              观察名单，以及超过 700 million 个法人实体。这个抽象层让企业客户无需分别协商地区供应商协议和技术架构，但也带来对第三方聚合器可用性、延迟和数据新鲜度的关键系统性依赖，而这些因素横跨割裂的司法辖区。
            claimRefs:
