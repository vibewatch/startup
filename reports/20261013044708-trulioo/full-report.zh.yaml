      - - 企业验证
        - Nuvei 等大型支付和金融科技机构采用，且这些机构面临跨大洲合规要求
        - 买方整合合规供应商时，客户集中度或合同重谈风险上升
        - 披露前 10 大客户收入集中度低于平台 ARR 总额的 30%
      - - 资本化及资金续航
        - 总融资额 $477M，其中包括 $394M D 轮，为资产负债表提供资金续航，近期无需面临资金困境
        - D 轮超过 $244M 用于二级流动性而非增长资本，留下的现金缓冲更少
        - 经审计的资产负债表验证现金储备及经营现金流盈亏平衡轨迹
    notes: 将核心投资支柱与运营和结构性反论点进行对照评估。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率
      - 运营假设
      - 估值 / 倍数逻辑
      - 关键风险及下行触发因素
    rows:
      - - 乐观情景
        - 20%
        - ARR 加速超过 $220M（同比增长 35%+）；KYB 信贷决策规模化；EBITDA 利润率达到 20%
        - $2.4B 估值（远期 ARR 11.0 倍），由市场领导地位及 IPO 或一级并购退出支撑
        - 技术商品化或企业内包阻止倍数扩张
      - - 基准情景
        - 55%
        - ARR 按 15-20% 的同比增速增长至约 $175M；北美和欧洲企业采用保持稳定；现金流盈亏平衡
        - $1.4B-$1.6B 估值（远期 ARR 8.0x-9.0x），反映 2021 年倍数正常化
        - 欧洲 eIDAS 采用放缓，采购周期延长
      - - 悲观情景
        - 25%
        - ARR 增长放缓至低于 10%；数据供应商成本挤压利润率；员工人数继续下降
        - $900M-$1.1B 下轮融资（远期 ARR 5.0x-6.0x），由优先权悬置和供应商整合驱动
        - 下轮融资的清算优先权稀释普通股持有人，并引发人才流失
    notes: 概率加权情景模型纳入市场倍数及资本结构风险。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Trulioo 2011 至 2026 年公司发展中的关键企业、融资、平台及战略里程碑。
    data:
      items:
        - label: 2011 年成立
          detail: Stephen Ufford 在不列颠哥伦比亚省温哥华创立公司，开创在线身份验证。
        - label: 2014 年 UST 战略投资
          detail: 获得 UST Global 的战略企业投资，已验证身份数超过 100M。
        - label: 2017 年全球 KYB 上线
          detail: 推出 Global Business Verification，可查询政府登记库开展 AML/KYB 尽调。
        - label: 2021 年 D 轮增长融资
          detail: 完成由 TCV 领投的 $394M D 轮融资，估值 $1.75B，总融资达到 $475M。
        - label: 2023 年全球身份平台
          detail: 推出统一平台，在一份合同下整合 KYC、KYB、文件验证和 Workflow Studio。
        - label: 2023 年自动化 UBO 验证
          detail: 发布自动化 KYB/KYC 能力，在一个工作流中验证企业最终受益所有人。
        - label: 2025 年 KYA 及 Agent Payments Protocol
          detail: 推出 Know Your Agent（KYA）框架，并与 Google 合作开发 Agent Payments Protocol（AP2）。
        - label: 2025 年信贷决策上线
          detail: 将实时金融和企业信贷情报接入全球开户工作流。
    approximationNotes: 里程碑日期对应公开新闻稿和公司里程碑公告；确切日历上线日期可能反映分阶段商业推出。
    claimRefs:
      - CO001
      - CO003
      - CO012
      - CO013
