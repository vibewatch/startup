callouts:
- calloutType: risk
  title: Information Asymmetry in Private Financial Underwriting
  body: Because Trulioo remains private and has not raised primary equity capital since June 2021, financial metrics rely
    on third-party estimates ($120M to $150.6M ARR). Investors must condition valuation models on obtaining verified financial
    statements, cohort retention data, and data-provider COGS.
  claimRefs:
  - CI008
  - CI009
  - CI013
  - CI014
- calloutType: insight
  title: Capital Structure and Effective Runway
  body: Of the $394M Series D headline raise in 2021, reports indicate $244M represented secondary liquidity for early shareholders.
    Consequently, balance-sheet cash was substantially lower than the gross raise, making operational discipline and breakeven
    performance critical to avoiding dilutive down-rounds.
  claimRefs:
  - CI010
  - CI011
  - CI012
