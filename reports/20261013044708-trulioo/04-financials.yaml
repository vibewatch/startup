company:
  name: Trulioo
chapter:
  number: 4
  title: Financials
  summary: Trulioo operates a B2B SaaS model combining tiered platform subscriptions with consumption-based transaction pricing
    for global identity verification. While GetLatka estimates 2024 annual recurring revenue at $150.6 million following its
    $394 million Series D in 2021, audited gross margins, unit-level customer acquisition costs, and net revenue retention
    remain undisclosed, presenting material underwriting uncertainty.
sections:
- id: revenue-streams-and-pricing-model
  title: Revenue Streams and Commercial Monetization Mechanics
  body: Trulioo operates a hybrid B2B software-as-a-service and consumption-based business model designed to monetize identity
    verification and compliance checks across 195 countries. The commercial structure centers on a unified enterprise contract
    that grants customers programmatic access to person verification (KYC), business verification (KYB), watchlist screening,
    and recently introduced credit decisioning capabilities. Under this framework, clients typically commit to a recurring
    annual or monthly platform access fee, augmented by tiered transaction pricing that adjusts based on monthly verification
    volumes. For smaller organizations, entry-level pricing begins around $99 per month, but enterprise engagements command
    custom annual minimums where per-check rates scale down with volume commitments. While this multi-tiered architecture
    provides predictable subscription baselines and transaction upside, pricing realization varies widely by geography and
    data source complexity.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: sales-motion-and-cost-structure
  title: Go-To-Market Motion and Service-Delivery Cost Economics
  body: 'Trulioo''s go-to-market motion relies primarily on direct enterprise sales teams targeting compliance officers, risk
    executives, and product leaders in regulated verticals including fintech, banking, cryptocurrency, and digital marketplaces.
    Customer adoption expands along two vectors: geographic scaling as clients enter new international markets, and product
    cross-selling across person and business verification workflows. In late 2025, Trulioo demonstrated this expansion dynamic
    by reporting 102% year-over-year transaction growth in U.S. Know Your Business verifications, boosted by the rollout of
    credit decisioning tools. However, service delivery economics are heavily influenced by direct cost of goods sold. Trulioo
    must query more than 450 authoritative external registers and credit databases, incurring variable data-vendor fees for
    each verification. Although automated optical character recognition and machine learning have reduced processing times
    by 60% and minimized manual reviews, gross margin expansion remains capped by these underlying data pass-through costs.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI003
  figureRefs: []
- id: public-traction-vs-private-gaps
  title: Reported Scale versus Private Disclosure Limitations
  body: Evaluating Trulioo's commercial scale requires navigating substantial discrepancies between unverified public commentary
    and private operating realities. Third-party industry trackers, notably GetLatka, estimated Trulioo's annual recurring
    revenue at approximately $150.6 million as of October 2024, whereas earlier analyst estimates cited an annual revenue
    run rate of approximately $120 million. Because Trulioo operates as a privately held Canadian corporation, it has not
    published audited financial statements, certified GAAP revenues, or standard software metrics such as gross margins and
    net revenue retention. This lack of transparency obscures critical underwriting fundamentals, including whether revenue
    growth is driven by new customer logos or existing account expansion. Furthermore, customer concentration, cohort-level
    net churn, and gross retention curves remain completely opaque, leaving prospective investors reliant on unaudited proxies.
  claimRefs:
  - CI008
  - CI009
  - CI013
  - CI014
  tableRefs: []
  figureRefs: []
- id: capital-adequacy-and-verdict
  title: Capital Adequacy, Forward Runway, and Diligence Verdict
  body: Trulioo's historical capitalization culminated in a $394 million Series D round in June 2021 led by TCV at a $1.75
    billion post-money valuation, bringing total cumulative venture funding to roughly $477 million. However, public reporting
    indicates that approximately $244 million of that headline Series D consisted of secondary share sales providing liquidity
    to early investors and founders rather than primary growth capital deposited onto the balance sheet. In the intervening
    years without additional disclosed equity rounds, Trulioo's true cash burn and remaining liquidity depend heavily on whether
    management achieved operating breakeven. Without audited cash flow statements, investors cannot confirm whether Trulioo
    requires dilutive external financing over the next 18 to 24 months. Consequently, while Trulioo possesses robust enterprise
    positioning and defensible global compliance infrastructure, the four-year-stale valuation anchor and absence of audited
    unit economics mandate a cautious underwriting verdict until confirmatory private diligence is completed.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs: []
  figureRefs: []
