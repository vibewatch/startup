  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sam-som-sizing
      missingEvidence: Granular independent bottom-up transaction-volume data and average contract values to cleanly separate Trulioo-addressable SAM and captured SOM from broad top-down IAM analyst estimates.
      whyItMatters: Without primary customer spend breakdowns across identity sub-segments, sizing relies on top-down syndicated forecasts that bundle disparate verification workloads.
      diligencePath: Request customer cohort transaction volumes, ACV distributions across tier-1 fintech and marketplace accounts, and gross margin by verification endpoint.
      relatedQuestionRefs:
        - QM010
    - type: conflicting-data
      severity: minor
      topic: market-definition-growth
      missingEvidence: Audited multi-year breakdown of Trulioo revenue attributable strictly to KYB business onboarding versus commodity consumer KYC verification.
      whyItMatters: While company releases claim 1,996% cumulative U.S. KYB volume growth and 102% YoY expansion, dollar-denominated revenue contribution and retention metrics remain undisclosed.
      diligencePath: Review audited product-line revenue segmentation and net revenue retention (NRR) reports during management diligence.
      relatedQuestionRefs:
        - QM009
