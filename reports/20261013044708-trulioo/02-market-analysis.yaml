callouts:
  - calloutType: insight
    title: KYB Expansion as a Strategic Growth Engine
    body: While consumer KYC faces pricing pressure and commoditization across mature markets, enterprise KYB onboarding represents a higher-margin, stickier workflow. Trulioo reported 1,996% surge in U.S. KYB transaction volume since 2023 demonstrates commercial momentum as businesses automate complex ultimate-beneficial-owner discovery.
    claimRefs:
      - CM007
      - CM008
      - CM009
  - calloutType: risk
    title: Syndicated Market Forecasts Mask Sub-Segment Volatility
    body: Syndicated research projects a 15.1% global CAGR for identity verification, but top-down figures aggregate disparate technologies including physical biometric scanners, enterprise IAM, and basic database ping services. True software platform TAM depends heavily on regulatory enforcement rigor and cross-border compliance budgets.
    claimRefs:
      - CM001
      - CM004
      - CM013
