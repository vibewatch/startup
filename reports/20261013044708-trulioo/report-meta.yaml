companyProfile:
  summary: >-
    Trulioo is a Vancouver-based private identity-verification platform founded in 2011 that unifies KYC, KYB, AML,
    document verification, and credit decisioning workflows through a single API for regulated enterprises operating
    across 195 countries. The company monetizes through tiered subscriptions plus consumption-based transaction fees,
    serves global banks, fintechs, payments providers, and marketplaces, and has broadened its product surface from
    onboarding identity checks into continuous risk intelligence and workflow orchestration.
  foundedDate: 2011-01-01T00:00:00.000Z
