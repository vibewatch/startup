  topStrengths:
    - Broad global coverage across 195 countries with a single API and workflow layer.
    - Clear enterprise proof points, including named deployments and more than 450 customers.
    - Product breadth that now spans KYC, KYB, AML, fraud, and credit decisioning.
  topRisks:
    - The $1.75B Series D valuation anchor is four years old and still not refreshed by public secondary pricing.
    - Audited financials, gross margin, and net revenue retention remain undisclosed.
    - External data dependency and secondary-market match-rate friction can constrain unit economics and retention.
  unresolvedGaps:
    - Audited revenue, gross margin, EBITDA, and cash flow statements to replace third-party ARR estimates.
    - Cap-table detail, including liquidation preferences and anti-dilution terms, to assess downside protection.
    - Customer concentration and cohort-level net revenue retention to confirm durability of the enterprise base.
    - A board-approved 409A or independent secondary transaction to refresh the June 2021 valuation anchor.
    - Cash burn and runway confirmation to determine whether additional dilutive financing is required.
