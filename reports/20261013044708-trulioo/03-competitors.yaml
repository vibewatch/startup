        label: Global Data Breadth & Coverage (1=Single Region, 10=195+ Countries)
        min: 1
        max: 10
      yAxis:
        label: Integration Simplicity & Time to Value (1=High API Friction, 10=No-Code Turnkey)
        min: 1
        max: 10
      points:
        - label: Trulioo
          x: 9.5
          'y': 4
          detail: Unmatched 195-country database breadth (5B people, 700M entities) but requires 2-month technical API integration.
        - label: Sumsub
          x: 6.5
          'y': 8.5
          detail: Turnkey all-in-one verification suite with published pricing and low-code onboarding.
        - label: Onfido
          x: 6
          'y': 7
          detail: Developer-friendly mobile SDK for biometric and document checks with moderate integration overhead.
        - label: Jumio
          x: 7
          'y': 5
          detail: High-volume enterprise verification infrastructure with formal integration and contracting requirements.
        - label: LexisNexis Risk Solutions
          x: 8.5
          'y': 3
          detail: Legacy incumbent data provider with extensive public records but cumbersome legacy architecture.
        - label: In-House Point Solutions
          x: 3
          'y': 2
          detail: Fragmented multi-vendor stack requiring extensive custom engineering maintenance and vendor procurement.
callouts:
  - calloutType: strength
    title: Defensible Non-Documentary Data Moat
    body: Trulioo's aggregation of 450+ direct government and commercial data sources across 195 countries creates a high barrier to entry for document-first specialists, enabling rapid electronic verification without requiring friction-heavy document uploads.
    claimRefs:
      - CP001
      - CP005
  - calloutType: risk
    title: Pricing Pressure and Developer UX Vulnerability
    body: Customer feedback on G2 and BeVerified highlights premium perceived cost and a 2-month implementation timeline, exposing Trulioo to displacement by agile mid-market platforms like Sumsub in accounts prioritizing self-serve speed over global coverage depth.
    claimRefs:
      - CP009
      - CP012
