    title: 'Competitive Positioning: Data Breadth vs. Integration Friction'
    type: quadrant
    summary: Trulioo occupies a high-breadth, enterprise-complexity position relative to developer-friendly and document-specialist verification peers.
    approximationNotes: Coordinates represent evidence-backed ordinal positioning on a 1-10 scale based on data coverage breadth (x-axis) and platform integration ease vs. friction (y-axis).
