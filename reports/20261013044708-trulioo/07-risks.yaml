callouts:
  - calloutType: risk
    title: Valuation Anchor vs. Operating Metric Visibility
    body: Trulioo's $1.8B Series D valuation established in December 2021 remains unrefreshed by subsequent public transactions or disclosed 409A valuations. While GetLatka estimates 2024 revenue at $150.6M, the lack of audited financial disclosures and net revenue retention benchmarks creates substantial valuation overhang in high-cost-of-capital environments.
    claimRefs:
      - CR014
      - CR015
