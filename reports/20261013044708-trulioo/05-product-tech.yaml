  - id: TE002
    title: Enterprise Workflow and Use Case Transition Matrix
    columns:
      - User Job
      - Traditional Workflow
      - Trulioo Platform Solution
      - Measurable Efficiency Benefit
      - Technical Limitation / Friction
    rows:
      - - Cross-Border Consumer Onboarding (KYC)
        - Multi-vendor regional procurement, manual passport checks, and localized database agreements
        - Single API endpoint routing to 450+ global data sources with automated 14,000+ document liveness verification
        - Global online payment customer achieved 90%+ verification rates across government IDs while consolidating vendors
        - Incomplete identity bureau penetration in developing regions requiring fallback to physical document inspection
      - - Corporate Merchant Underwriting (KYB)
        - Manual requests for registration documents, apostilles, and manual shareholder registry parsing taking days or weeks
        - Automated registry query extracting vitals, status, officers, and UBOs directly into standardized audit records
        - U.S. KYB transaction volume surged 1,996% from 2023 to 2025 with 102% YoY growth as enterprise onboarding accelerated
        - Offshore shell jurisdictions and opaque nominee structures lack electronic registries, preventing automated UBO discovery
      - - Document Tamper Detection & Proof of Address
        - Visual inspection of uploaded utility bills and PDF statements prone to digital manipulation
        - Automated optical tamper detection verifying non-ID documents alongside identity credentials in a single pipeline
        - Early detection of fabricated documents before account creation and reduction of downstream payments chargebacks
        - High optical variability in utility bill layouts across small municipal utilities creating false-positive reject rates
      - - Synthetic Identity & Repeat Fraud Defense
        - Disconnected fraud point solutions unable to detect identity reuse across distinct onboarding attempts
        - Known Faces biometric authentication performing 1-to-many face comparison against client image library with 60+ signals
        - Financial services reference customer achieved 15% reduction in repeat fraud attempts and 12% decrease in manual reviews
        - Privacy constraints under GDPR/CCPA regarding biometric template storage and consent management across jurisdictions
      - - Regulated Ongoing AML Compliance
        - Periodic batch screening of client databases resulting in stale risk profiles and delayed enforcement
        - Real-time continuous monitoring with automated alerts on corporate structure changes, sanctions, and filings
        - Eliminates audit non-compliance risks and reduces periodic operational remediation overhead for Tier 1 compliance teams
        - Heavy notification noise requiring sophisticated client-side webhook parsing and rule filtering architectures
    notes: "Performance metrics and operational outcomes sourced from company-reported deployment results, product releases, and customer case studies."
