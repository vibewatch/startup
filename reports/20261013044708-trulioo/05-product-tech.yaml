  title: Product & Technology
  summary: Trulioo delivers global identity and business verification through an integrated platform uniting documentary KYC, electronic database matching, KYB registry automation, AML watchlist screening, and risk scoring accessible via a unified API, portal, and Workflow Studio. The technology architecture abstracts over 450 local data sources, 14,000 ID document templates, and 700 million business entities across 195 countries, though reliance on external registry aggregators, regional data vendor uptime, and opacity around developer-community adoption represent material operational diligence dependencies.
sections:
  - id: product-architecture-and-delivery
    title: Product Architecture and Delivery Platform
    body: >
      Trulioo operates an enterprise identity verification platform designed to orchestrate person (KYC) and business (KYB) compliance workflows across 195 countries through a single technical surface. Originally deployed as a point-in-time identity verification mechanism, the platform has evolved into an end-to-end identity verification and compliance engine that unites electronic identity verification (eIDV), optical document proofing, business registry extraction, AML watchlist monitoring, and real-time risk intelligence. Enterprises consume the platform either via API Direct—a standardized REST API utilizing a single authentication token and endpoint—or through Workflow Studio, a low-code/no-code logic configuration interface that routes verification requests across regional providers without requiring custom code modifications.


      The core delivery stack operates across five distinct layers: integration ingress, workflow orchestration, verification engines, data marketplace connectors, and audit infrastructure. At the ingress tier, client requests are submitted via API Direct, the mobile and web SDKs, or the administrative Trulioo Portal. Workflow Studio acts as the decision routing engine, executing deterministic rule sets, conditional fallbacks, and multi-bureau query sequencing based on jurisdiction and risk tier. Beneath orchestration, specialized engines execute distinct verification modalities, including non-documentary Personally Identifiable Information (PII) matching against government, telecommunications, and credit databases, automated document verification with optical character recognition (OCR), facial biometric liveness detection, and ultimate beneficial ownership (UBO) unwrapping for corporate entities.


      Data access is mediated by Trulioo's proprietary Data Marketplace, which aggregates connections to over 450 global and local data registries and credit bureaus, more than 14,000 national ID document templates, 6,000 global sanctions and PEP watchlists, and over 700 million legal entities. While this abstraction layer insulates enterprise clients from negotiating disparate regional vendor agreements and technical schemas, it creates critical systemic dependencies on third-party aggregator availability, latency, and data freshness across fragmented jurisdictional boundaries.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE003
    figureRefs:
      - FE001

  - id: core-modules-and-workflow-engine
    title: Core Verification Modules and Capability Matrix
    body: >
      Trulioo's commercial capability suite is partitioned into four primary functional modules: Person Verification (KYC), Business Verification (KYB), AML Watchlist & Adverse Media Screening, and Fraud & Risk Intelligence. The Person Verification module combines 2+2 electronic data matching (confirming name, address, date of birth, and national ID across independent databases) with document-capture verification capable of analyzing government-issued credentials across 43 languages. For high-assurance scenarios, document verification is augmented with selfie biometric authentication and tamper detection extended to non-ID collateral such as utility bills and bank statements.


      The Business Verification module automates corporate onboarding by querying sovereign company registries to retrieve official registration certificates, verify entity vitals, identify corporate officers, and trace shareholder hierarchies to pinpoint ultimate beneficial owners. By coupling KYB entity resolution with automated KYC on discovered natural-person owners in a unified workflow, the platform compresses corporate due diligence timelines from multiple business days down to automated real-time determinations. In late 2025, Trulioo augmented this workflow with Credit Decisioning, ingesting commercial credit risk and cash-flow indicators to provide embedded insolvency scoring during merchant and vendor onboarding.


      AML screening operates continuously across both onboarding and post-onboarding lifecycles, screening individuals and entities against global sanction databases, politically exposed person (PEP) lists, and adverse media sources. All transaction records, extracted document payloads, and verification match codes are journaled in the customer portal with auditable scoring, enabling financial institutions and marketplaces to satisfy supervisory compliance standards under FinCEN, FCA, FINTRAC, and CySEC mandates while maintaining defensible operational records.
    claimRefs:
      - CE006
      - CE007
