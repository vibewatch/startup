evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-diligence
    missingEvidence: >-
      Audited financial statements, gross margin figures, net revenue retention rates, and recent secondary transaction
      valuations.
    whyItMatters: >-
      As a late-stage private entity, unverified revenue and stale 2021 valuation benchmarks limit precise enterprise
      valuation modeling.
    diligencePath: >-
      Request confidential disclosure of audited 2024-2025 financial reports, 409A valuation appraisals, and cap table
      schedules under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: investor-capitalization
    missingEvidence: >-
      Comprehensive capitalization table detailing exact equity ownership percentages, liquidation preference ranks, and
      anti-dilution protections.
    whyItMatters: >-
      Private funding announcements disclose participating syndicate leads but withhold underlying economic terms and
      board voting thresholds.
    diligencePath: >-
      Review amended articles of incorporation and investor rights agreements provided through an institutional
      diligence data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som-sizing
    missingEvidence: >-
      Granular independent bottom-up transaction-volume data and average contract values to cleanly separate
      Trulioo-addressable SAM and captured SOM from broad top-down IAM analyst estimates.
    whyItMatters: >-
      Without primary customer spend breakdowns across identity sub-segments, sizing relies on top-down syndicated
      forecasts that bundle disparate verification workloads.
    diligencePath: >-
      Request customer cohort transaction volumes, ACV distributions across tier-1 fintech and marketplace accounts, and
      gross margin by verification endpoint.
    relatedQuestionRefs:
      - QM010
  - type: conflicting-data
    severity: minor
    topic: market-definition-growth
    missingEvidence: >-
      Audited multi-year breakdown of Trulioo revenue attributable strictly to KYB business onboarding versus commodity
      consumer KYC verification.
    whyItMatters: >-
      While company releases claim 1,996% cumulative U.S. KYB volume growth and 102% YoY expansion, dollar-denominated
      revenue contribution and retention metrics remain undisclosed.
    diligencePath: >-
      Review audited product-line revenue segmentation and net revenue retention (NRR) reports during management
      diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing-contract-terms
    missingEvidence: >-
      Audited enterprise contract rate cards, realized volume discounting tiers, and net revenue retention across
      multi-year commitments.
    whyItMatters: >-
      Public sources report entry pricing starting around $99/month, but actual enterprise economics, minimum annual
      commitments, and realized price-per-lookup are closely held commercial secrets.
