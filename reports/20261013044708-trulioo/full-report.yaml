  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance & Cross-Border Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Operating across 195 countries subjects Trulioo to an intricate and shifting web of anti-money laundering
              (AML), know-your-customer (KYC), and know-your-business (KYB) regulations. The company provides
              verification capabilities tailored to fulfill mandates enforced by FinCEN, FINRA, the UK Financial Conduct
              Authority (FCA), FINTRAC, and CySEC. Trulioo entered the anti-money laundering space in 2014 via its
              acquisition of Global Data Company and has progressively automated entity verification, including ultimate
              beneficial ownership checks within unified workflows. However, cross-border identity verification exposes
              the platform to differing jurisdictional interpretations of data residency, consumer privacy statutes such
              as GDPR and CCPA, and emerging frameworks like the European Union's Anti-Money Laundering Regulation
              (AMLR) and eIDAS 2.0. Maintaining compliance across these fragmented environments requires continuous rule
              maintenance and local legal monitoring.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
