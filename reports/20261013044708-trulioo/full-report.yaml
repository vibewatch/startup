      - number: '5.2'
        title: Core Verification Modules and Capability Matrix
        blocks:
          - type: paragraph
            body: >
              Trulioo's commercial capability suite is partitioned into four primary functional modules: Person
              Verification (KYC), Business Verification (KYB), AML Watchlist & Adverse Media Screening, and Fraud & Risk
              Intelligence. The Person Verification module combines 2+2 electronic data matching (confirming name,
              address, date of birth, and national ID across independent databases) with document-capture verification
              capable of analyzing government-issued credentials across 43 languages. For high-assurance scenarios,
              document verification is augmented with selfie biometric authentication and tamper detection extended to
              non-ID collateral such as utility bills and bank statements.


              The Business Verification module automates corporate onboarding by querying sovereign company registries
              to retrieve official registration certificates, verify entity vitals, identify corporate officers, and
              trace shareholder hierarchies to pinpoint ultimate beneficial owners. By coupling KYB entity resolution
              with automated KYC on discovered natural-person owners in a unified workflow, the platform compresses
              corporate due diligence timelines from multiple business days down to automated real-time determinations.
              In late 2025, Trulioo augmented this workflow with Credit Decisioning, ingesting commercial credit risk
              and cash-flow indicators to provide embedded insolvency scoring during merchant and vendor onboarding.


              AML screening operates continuously across both onboarding and post-onboarding lifecycles, screening
              individuals and entities against global sanction databases, politically exposed person (PEP) lists, and
              adverse media sources. All transaction records, extracted document payloads, and verification match codes
              are journaled in the customer portal with auditable scoring, enabling financial institutions and
              marketplaces to satisfy supervisory compliance standards under FinCEN, FCA, FINTRAC, and CySEC mandates
              while maintaining defensible operational records.
