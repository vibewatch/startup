  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Stale 2021 valuation ($1.75B-$1.8B) vs unverified ARR ($150.6M) and leadership turnover
        - Withhold Buy rating until audited financials and current 409A or secondary pricing are confirmed
      - - Confidence
        - Medium
        - Documented 102% KYB growth and enterprise logos offset by opaque cap-table economics
        - Size position conservatively or participate only via structured downside-protected terms
      - - Risk Rating
        - Medium
        - Headcount contraction (405 to 375), secondary liquidity overhang ($244M), and intense market competition
        - Require operational milestones on margin expansion and enterprise cohort retention
      - - Valuation Stance
        - Fair
        - Trading at ~11.6x estimated 2024 ARR based on 2021 Series D, aligned with private enterprise RegTech median
        - Entry discipline requires sub-10x forward ARR multiple in future primary funding
    notes: >-
      Recommendation framework synthesized from reported Series D terms, estimated financial performance, and governance
      shifts.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Core Thesis
      - Anti-Thesis / Risk
      - What Would Change the View
    rows:
      - - Platform Breadth
        - Global coverage across 195 countries and 5B individuals unites KYC, KYB, and AML in a single API
        - Point solutions and regional identity networks erode gross margins through third-party data dependency
        - Audit of proprietary data source contribution vs pass-through third-party broker fees
      - - KYB Momentum
        - >-
          U.S. KYB transaction growth of 102% YoY and 1,996% since 2023 demonstrates commercial inflection in business
          onboarding
        - Business verification transaction volume concentration in volatile fintech and marketplace segments
        - Confirmation of cohort net revenue retention (NRR) exceeding 120% in core enterprise accounts
      - - Enterprise Validation
        - Adoption by major payment and fintech institutions like Nuvei with multi-continent compliance mandates
        - Customer concentration or contract renegotiation risk as buyers consolidate compliance vendors
        - Disclosure of top-10 customer revenue concentration below 30% of total platform ARR
      - - Capitalization & Runway
        - Total funding of $477M including $394M Series D provides balance sheet runway without imminent distress
        - Over $244M of the Series D went to secondary liquidity rather than growth capital, leaving less cash buffer
        - Audited balance sheet verifying cash reserves and operating cash flow breakeven trajectory
    notes: Evaluation of core investment pillars against operational and structural counter-arguments.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Probability
      - Operating Assumptions
      - Valuation / Multiple Logic
      - Key Risks & Downside Triggers
    rows:
      - - Bull Case
        - 20%
        - ARR accelerates past $220M (35%+ YoY); KYB credit decisioning scales; EBITDA margins reach 20%
        - $2.4B valuation (11.0x forward ARR) supported by market leadership and IPO or Tier-1 M&A exit
        - Tech commoditization or enterprise insourcing prevents multiple expansion
      - - Base Case
        - 55%
        - ARR grows at 15-20% YoY to ~$175M; steady enterprise adoption in North America and Europe; breakeven cash flow
        - $1.4B-$1.6B valuation (8.0x-9.0x forward ARR) reflecting 2021 multiple normalization
        - Slower European eIDAS adoption and prolonged procurement cycles
      - - Bear Case
        - 25%
        - ARR growth slows below 10%; margin compression from data vendor costs; headcount continues to decline
        - $900M-$1.1B down-round (5.0x-6.0x forward ARR) driven by preference overhang and vendor consolidation
        - Down-round liquidation preferences trigger dilution of common holders and talent attrition
    notes: Probability-weighted scenario models incorporating market multiples and capital structure risks.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Key corporate, financing, platform, and strategic milestones in Trulioo's corporate evolution from 2011 to 2026.
    data:
      items:
        - label: 2011 Founding
          detail: Founded in Vancouver, BC by Stephen Ufford to pioneer online identity verification.
        - label: 2014 UST Strategic Investment
          detail: Secured strategic corporate investment from UST Global, surpassing 100M verified identities.
        - label: 2017 Global KYB Launch
          detail: Introduced Global Business Verification to query government registers for AML/KYB due diligence.
        - label: 2021 Series D Growth Financing
          detail: Closed $394M Series D round led by TCV at a $1.75B valuation, reaching $475M in total funding.
        - label: 2023 Global Identity Platform
          detail: Launched unified platform uniting KYC, KYB, document verification, and Workflow Studio under one contract.
        - label: 2023 Automated UBO Verification
          detail: Released automated KYB/KYC capabilities verifying business ultimate beneficial owners in one workflow.
        - label: 2025 KYA & Agent Payments Protocol
          detail: Launched Know Your Agent (KYA) framework and partnered with Google on the Agent Payments Protocol (AP2).
        - label: 2025 Credit Decisioning Launch
          detail: Integrated real-time financial and business credit intelligence into global onboarding workflows.
    approximationNotes: >-
      Milestone dates correspond to public press announcements and corporate milestone releases; exact calendar launch
      dates may reflect phased commercial rollouts.
