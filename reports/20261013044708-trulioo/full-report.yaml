      - number: '7.2'
        title: Operational Verification Quality, Address Resolution & Latency
        blocks:
          - type: paragraph
            body: >-
              While Trulioo advertises global coverage across billions of individuals, customer feedback reveals
              operational friction in core verification workflows. Verified compliance officers and risk operations
              managers report that match rates deteriorate substantially in secondary and emerging markets outside North
              America and Western Europe, where standardized digital identity registries are scarce. Furthermore,
              enterprise users report high false-positive rates during AML watchlist and PEP screening on common names,
              creating onerous manual review backlogs for customer onboarding teams. The verification engine also
              encounters persistent difficulty parsing non-standard address formats, rural routes, and PO boxes,
              frequently requiring iterative trial-and-error input. These operational bottlenecks elevate client
              onboarding friction and weaken overall automated pass rates, potentially driving customer churn toward
              competing vendors.
            claimRefs:
