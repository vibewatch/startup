            body: >-
              Because $244 million of the $394 million Series D round provided secondary liquidity to early shareholders
              rather than balance sheet cash, Trulioo's primary cash cushion is substantially smaller than headline
              funding figures suggest, heightening the need to verify operational cash flow breakeven.
            calloutType: risk
            claimRefs:
