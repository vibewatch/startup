  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Trulioo presents a compelling investment thesis grounded in its comprehensive global identity platform
              that unifies Know Your Customer (KYC), Know Your Business (KYB), and anti-money laundering (AML)
              compliance across 195 countries. With verified access to more than 5 billion individuals and 700 million
              business entities, the platform offers unprecedented international verification breadth through a single
              API integration. The company has demonstrated strong commercial traction in enterprise business
              onboarding, highlighted by 1,996 percent growth in U.S. KYB transaction volume since 2023 and 102 percent
              year-over-year expansion. In 2025 alone, Trulioo processed more than 20 million verification transactions
              for U.S. customers, demonstrating accelerating enterprise adoption and platform utility across payments
              and fintech marketplaces. Furthermore, product innovation around automated credit decisioning and
              continuous lifecycle monitoring extends Trulioo from episodic identity onboarding into defensible
              recurring compliance workflows.


              Conversely, the anti-thesis centers on gross margin compression, intense market competition, and capital
              structure overhang. Because Trulioo relies on over 450 external data sources to achieve its global
              coverage, significant revenue must pass through to third-party data providers, limiting gross margin
              expansion relative to pure-software infrastructure peers. Concurrently, identity verification faces
              commoditization pressures from specialized point solutions and large credit bureaus such as Experian,
              LexisNexis Risk Solutions, and TransUnion. More critically, out of the $394 million raised in Trulioo's
              June 2021 Series D funding, approximately $244 million represented secondary share liquidation rather than
              primary cash invested into the balance sheet. Following that peak, headcount contracted from 430 employees
              in early 2023 to 405 in 2024 and approximately 375 by late 2025, signaling post-peak organizational
              rationalization amidst a prolonged valuation reset.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
