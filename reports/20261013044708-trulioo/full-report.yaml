        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline and Entry Multiples
            body: >-
              Institutional investors should resist anchoring to Trulioo's 2021 peak $1.8B valuation mark. Any new
              investment must demand a sub-10x forward ARR multiple, verified audited gross margins above 60%, and clear
              liquidation seniority to protect against macro software multiple contraction.
            calloutType: recommendation
