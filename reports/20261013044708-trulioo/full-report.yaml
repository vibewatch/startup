            body: >-
              Trulioo's 102% year-over-year U.S. KYB transaction growth and credit decisioning launch represent its
              strongest commercial catalysts, positioning the company to capture higher annual contract values in
              complex business verification where pricing power exceeds commoditized consumer KYC.
            calloutType: insight
