      - number: '8.2'
        title: Recommendation and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We assign Trulioo an investment recommendation of Track with a Medium confidence rating and a Fair
              valuation stance. The company established its last disclosed private valuation benchmark at $1.75 billion
              to $1.80 billion in June 2021 during its Series D financing round led by growth equity firm TCV.
              Third-party estimates from GetLatka indicate that Trulioo generated approximately $150.6 million in
              revenue run-rate by late 2024, representing an implied valuation multiple of 11.6x to 12.0x trailing
              revenue. While this multiple is broadly consistent with private RegTech and enterprise compliance
              transaction benchmarks from the 2021-2023 cycle, it remains anchored to an unaudited revenue figure
              without verified gross margins, net revenue retention (NRR), or cash burn metrics.


              A Buy recommendation cannot be underwritten in the absence of audited financial statements, board-level
              409A common stock valuations, or verified cohort retention data. Executive leadership transitioned to
              Chief Executive Officer Vicky Bindra and Chief Product Officer Zac Cohen, initiating strategic refocusing
              toward enterprise KYB and lifecycle risk intelligence. However, until management provides transparent
              visibility into underlying unit economics and balance sheet runway, disciplined investors should track
              progress rather than commit new growth equity. Any future primary transaction must be conditioned on a
              sub-10x forward ARR entry valuation, audited financial verification, and protective liquidation preference
              covenants.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV014
          - type: table
            tableRef: TV001
