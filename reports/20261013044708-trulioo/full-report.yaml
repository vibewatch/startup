  - id: FE001
    title: Trulioo Platform Technical Architecture Stack
    type: stack
    summary: >-
      Six-layer architecture stack decomposing Trulioo's ingress, workflow policy, verification engines, data
      connectors, and compliance infrastructure.
    data:
      layers:
        - label: Ingress & Client Integration Layer
          detail: Client-facing integration surfaces providing low-code and API-based access to identity services.
          items:
            - label: API Direct REST Endpoint
              detail: Single token and unified endpoint supporting JSON request payloads across 43 languages
            - label: Web & Mobile Client SDKs
              detail: Embedded capture interfaces for document scanning, optical framing, and selfie liveness capture
            - label: Trulioo Administrative Portal
              detail: Web application providing single sign-on, manual review queues, and verification performance analytics
        - label: Workflow Orchestration & Policy Layer
          detail: Configurable execution tier that evaluates deterministic business logic and jurisdiction routing.
          items:
            - label: Workflow Studio Engine
              detail: No-code logic builder enabling conditional query sequencing without custom code modifications
            - label: Dynamic Rule Execution Router
              detail: Automated fallback cascades switching from primary to secondary bureaus upon timeout or mismatch
            - label: Risk Score Normalizer
              detail: Synthesizes over 60 fraud signals into composite transaction scores for automated pass/fail decisions
        - label: Core Verification & Intelligence Engines
          detail: In-house and partner algorithmic processing units evaluating identity credentials and risks.
          items:
            - label: Electronic Identity (eIDV) Engine
              detail: 2+2 personal matching verifying name, date of birth, address, and national identity numbers
            - label: Document Capture & OCR Engine
              detail: Analyzes 14,000+ government ID templates with optical tamper detection extended to utility bills
            - label: Facial Biometric & Known Faces
              detail: 1-to-many face comparison against image library flagging repeat fraud and confirming 1-to-1 liveness
            - label: Corporate KYB & UBO Graph Builder
              detail: Recursive corporate registry unwrapping linking entity vitals to ultimate beneficial owners
        - label: Commercial Risk & Credit Decisioning Engine
          detail: Evaluates financial health and insolvency probability during business onboarding.
          items:
            - label: Predefined Credit Rules Engine
              detail: Automated decision trees matching commercial credit parameters against underwriting thresholds
            - label: Predictive Risk Segmentation
              detail: Real-time scoring of cash-flow stability and commercial insolvency exposure
        - label: Global Data Marketplace & Connector Fabric
          detail: External integration fabric mediating access to sovereign, commercial, and supervisory registers.
          items:
            - label: Sovereign & Consumer Data Registries
              detail: 450+ independent telecommunications, government, utility, and credit bureau data connectors
            - label: Global Business Entity Registries
              detail: Electronic connections covering 700M+ corporate entities across sovereign commercial registers
            - label: Sanctions & PEP Screening Feeds
              detail: Over 6,000 global watchlists and 20,000 adverse media sources monitored in near real-time
        - label: Audit, Compliance & Reporting Tier
          detail: Infrastructure ensuring non-repudiation, audit readiness, and compliance supervisory oversight.
          items:
            - label: Regulatory Transaction Audit Store
              detail: Immutable logs preserving verification outcomes, match codes, and decision timestamps for auditors
            - label: Compliance Reporting & Analytics
              detail: Dashboards formatted to substantiate KYC/KYB compliance under FinCEN, FCA, and CySEC frameworks
            - label: Automated Remediation & Alert Engine
              detail: Webhook dispatch notifying clients of corporate ownership changes, officer transfers, or sanctions hits
    approximationNotes: >-
      Layer decomposition synthesized from Trulioo technical announcements, patent disclosures, and system architecture
      specifications.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE011
      - CE013
