      - number: '6.3'
        title: Named Customer Proof & Durability Risks
        blocks:
          - type: paragraph
            body: >-
              Demonstrated production deployment is confirmed by enterprise customers such as global payments processor
              Nuvei, where Trulioo unifies commercial KYB entity validation with biometric document KYC to streamline
              merchant onboarding across multiple continents. Public references and platform reviews from organizations
              such as About-Fraud, Gappsy, and Financial IT corroborate that hundreds of financial technology and
              payment providers rely on Trulioo's Global Gateway architecture for multi-jurisdiction compliance. Despite
