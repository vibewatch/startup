      - number: '8.3'
        title: Scenario Modeling and Downside Risks
        blocks:
          - type: paragraph
            body: >-
              Our valuation framework evaluates three probability-weighted operating and valuation scenarios across a
              36-month investment horizon. In the Bull Case (20% probability), Trulioo accelerates annual revenue growth
              above 35% through rapid enterprise adoption of credit decisioning and European eIDAS 2.0 compliance,
              achieving an ARR run-rate exceeding $220 million with 20% EBITDA margins. Under this scenario, market
              leadership justifies an enterprise valuation of $2.40 billion (approximately 11.0x forward ARR) in an
              initial public offering or strategic acquisition by a global financial technology conglomerate.


              In the Base Case (55% probability), Trulioo maintains durable but moderate revenue growth of 15% to 20%
              annually, reaching $175 million to $185 million in ARR while operating near cash flow breakeven.
              Normalizing for broader software multiple contraction since 2021, the company's valuation settles between
              $1.40 billion and $1.60 billion (8.0x to 9.0x forward ARR), resulting in flat to modest paper returns for
              Series D preferred equity holders. In the Bear Case (25% probability), revenue growth decelerates below
              10% as data provider costs compress gross margins and enterprise vendor consolidation favors broader
              security suites. Under this downside stress scenario, valuation falls to $900 million to $1.10 billion
              (5.0x to 6.0x ARR), triggering down-round dilution and activating senior liquidation preference overhang
              that could impair common and junior share classes.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
