chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Trulioo was established in 2011 and is headquartered in Vancouver, British Columbia, Canada, operating as
              an enterprise-grade digital identity platform. The company's architectural model unifies electronic Know
              Your Customer (KYC), Know Your Business (KYB), and continuous Anti-Money Laundering (AML) watchlist
              screening through a single API and commercial contract. Trulioo provides coverage across 195 countries,
              delivering access to identity proofing for more than 5 billion individuals and verification for 700
              million business entities. While Trulioo operates as a privately held venture without mandatory regulatory
              disclosures, its commercial positioning centers on simplifying regulatory compliance, combating fraud, and
              facilitating global merchant onboarding for multinational financial institutions and marketplaces.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: Executive Leadership, Governance, and Founder Evolution
        blocks:
          - type: paragraph
            body: >-
              Trulioo was co-founded by Stephen Ufford, who served as Chief Executive Officer during the company's
              foundational era and established its core electronic identity verification technology. Over subsequent
              scaling stages, the enterprise transitioned to professional executive management, navigating a leadership
              succession from Steve Munford to current Chief Executive Officer Vicky Bindra. Bindra directs the
              company's broader positioning as a risk intelligence and digital trust network, including initiatives in
              autonomous commerce. Product and operational strategy is spearheaded by Chief Product Officer Zac Cohen,
              following former product head Michael Ramsbacker, alongside Chief Technology Officer Hal Lonas leading
              distributed cloud infrastructure and predictive artificial intelligence risk models.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization Structure, Funding History, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Trulioo has accumulated approximately $475 million in total equity financing since inception, supported by
              a blue-chip syndicate of growth equity and strategic financial institutions. The company's capitalization
              is anchored by a $394 million Series D round closed in June 2021 led by TCV, with co-investment from
              Goldman Sachs, American Express, Citi Ventures, and early institutional partner Blumberg Capital. Early
              operational scaling was supported by Canadian institutional backing from BDC Venture Capital alongside
              strategic corporate investment from UST Global. While post-2021 funding was accompanied by global
              workforce expansion to approximately 430 employees, detailed capitalization rights, liquidation
              preferences, and current valuation adjustments remain unverified in the absence of secondary trading
              disclosures.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.4'
        title: Strategic Milestones, Platform Expansion, and Operational Track Record
        blocks:
          - type: paragraph
            body: >-
              Trulioo's product roadmap reflects consistent progression from identity verification toward automated
              workflow orchestration and financial risk decisioning. Landmark milestones include launching the unified
              Global Identity Platform and Workflow Studio in 2023, releasing automated beneficial ownership
              verification for KYB, and deploying credit decisioning in November 2025 to layer financial health signals
              into merchant onboarding. The company also joined Google's Agent Payments Protocol (AP2) to pioneer Know
              Your Agent (KYA) standards. However, third-party customer reviews from verified compliance operations
              managers highlight operational trade-offs, noting that while core North American identity match rates are
              strong, secondary jurisdictions and rural address formats encounter elevated manual review rates and
              inconsistent match accuracy.
            claimRefs:
              - CO009
