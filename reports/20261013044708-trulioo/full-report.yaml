              - CV013
      - number: '8.4'
        title: Comparable Benchmarking and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Industry comparable benchmarks indicate that the global identity verification market is projected by
              MarketsandMarkets to expand from $16.48 billion in 2026 to $33.36 billion by 2031 at a 15.1% compound
              annual growth rate, while Liminal estimates the total addressable market for integrated platforms will
              reach $115.9 billion by 2027. Public comparables including Experian, Equifax, TransUnion, and GB Group
              trade at median enterprise value multiples of 4.5x to 7.0x forward revenue, while private high-growth
              identity peers such as Socure, Persona, and Veriff command multiples between 8.0x and 12.0x. Trulioo's
              estimated 11.6x multiple reflects a premium that requires verification of accelerating growth and sticky
              enterprise net revenue retention.


              Before considering capital allocation, institutional investors must complete essential confirmatory
              diligence asks. First, obtain audited balance sheets and cash flow statements for 2024-2025 to verify cash
              reserves, burn rate, and runway. Second, examine detailed capitalization table schedules to evaluate
              Series D senior liquidation preferences, participation caps, and anti-dilution triggers. Third, review
              customer concentration schedules and cohort-level NRR across enterprise payment and marketplace accounts
              to confirm that high KYB transaction volume translates into durable recurring contract expansion.
              Thesis-break triggers that would prompt a downgrade to Avoid include further workforce contraction, loss
              of key tier-one financial clients, or a dilutive down-round recapitalization.
            claimRefs:
              - CV002
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
