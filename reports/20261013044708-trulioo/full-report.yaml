  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Trulioo’s commercial customer base concentrates heavily within highly regulated financial services, global
              payments, cryptocurrency platforms, e-commerce networks, and digital marketplaces. Enterprise buyers
              typically consist of Chief Compliance Officers, Global Heads of Risk and Underwriting, and product
              engineering teams tasked with meeting stringent anti-money laundering and customer due diligence
              regulations. These enterprise organizations require unified, low-latency onboarding workflows capable of
              clearing complex Know Your Customer (KYC), Know Your Business (KYB), and ongoing sanctions screening
              requirements across multinational jurisdictions without introducing excessive user friction. Through a
              single API contract, Trulioo provides access to over 450 regional and international data sources,
              addressing both large-scale individual verification volumes and complex corporate entity structures.
              However, commercial pricing remains strictly custom-quoted, requiring direct enterprise sales engagements
              and developer-led API integration efforts that create high switching costs once production pipelines are
              established.
