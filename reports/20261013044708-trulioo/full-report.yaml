        title: Financial Model Sustainability, Valuation Anchor & Downside Risk Synthesis
        blocks:
          - type: paragraph
            body: >-
              From a financial diligence perspective, Trulioo's primary risk centers on its historical valuation anchor.
              The company secured a $394 million Series D round in December 2021 at a $1.8 billion post-money valuation.
