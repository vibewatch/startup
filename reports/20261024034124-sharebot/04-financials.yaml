schemaVersion: "report-v2"
artifact: financials
slug: sharebot
runDate: 2026-10-24
company:
  name: SHAREBOT
chapter:
  number: 4
  title: Financials
  summary: SHAREBOT is pursuing a platform-led Robot-as-a-Service model, but public evidence still describes operating activity and financing rather than audited revenue, margin, cash, or customer economics. The disclosed shift from event rentals toward industrial and operational deployments could improve revenue quality, while falling daily prices and the service burden create material utilization and margin risk.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: SHAREBOT's public model is a multi-sided robot-rental and service platform rather than a disclosed subscription business. The platform connects robot manufacturers, service partners, content or solution providers, and customers, with booking, dispatch, delivery, and on-site support forming the commercial workflow. Public reporting places early demand in events, exhibitions, retail, tourism, and other short-duration deployments, while later financing communications emphasize industrial manufacturing, park operations, warehousing, logistics, and commercial services. This is a plausible path from one-off rentals toward recurring operational contracts, but the available sources do not disclose revenue by stream, contract duration, renewal, take rate, or realized gross margin. List or quoted daily prices should therefore be treated as market observations, not SHAREBOT revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: unit-economics
    title: Unit economics and cost drivers
    body: The economics appear operationally intensive. A robot deployment may require logistics, configuration, choreography or task preparation, technical support, maintenance, insurance, and recovery after damage or downtime. Public reporting describes a market in which daily rental prices have fallen sharply from earlier peaks, including low-priced basic robots and materially higher prices for advanced models or technician-supported packages. Falling prices can widen trial access, but they also compress the revenue available to cover asset depreciation, idle time, repairs, field labor, and partner economics. No source in this assigned pool provides SHAREBOT's CAC, payback, contribution margin, utilization, service cost per order, churn, or customer concentration. Those missing fields prevent a conventional SaaS-style underwriting case.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: "Public financing coverage indicates substantial investor support and a stated use of proceeds: building the RaaS system, expanding into industrial and other real-world scenarios, and improving standardized fulfillment, asset, dispatch, and supply-chain capabilities. That capital is not equivalent to cash available today, and the sources do not disclose cash on hand, burn, runway, debt, capex commitments, working capital, or the timing of the next financing trigger. The operating transition itself may require more field infrastructure and service capacity before higher-frequency contracts are proven. The financial verdict is therefore conditional: financing access appears supportive, but revenue quality, margin path, and capital sufficiency remain unverified until management supplies cohort-level operating and cash data."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: The assigned public evidence does not establish audited revenue, gross margin, cash balance, burn, runway, debt obligations, or realized unit economics.
    claimRefs: [CI008, CI012, CI013]
  - calloutType: insight
    title: Financial inflection point
    body: Moving from event-oriented rentals toward repeatable industrial and operational delivery is the key test of whether SHAREBOT can convert hardware access into durable service revenue.
    claimRefs: [CI003, CI009, CI014]
tables:
