    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value/status, Quality, Diligence ask]
    rows:
      - [Short-duration event rentals, "Robot and service deployment for events, exhibitions, performances, and promotions", "Publicly described as an early demand category; no SHAREBOT revenue disclosed", "Company/industry reporting; revenue unverified", "Provide order-level revenue, take rate, and repeat-order data"]
      - ["Retail, tourism, and commercial services", "On-site robot interaction, guidance, promotion, or customer service", "Reported use cases and expanding scenarios; no revenue mix disclosed", "Third-party reported; commercial traction not audited", "Provide customer contracts, realized pricing, and utilization by scenario"]
      - ["Industrial, park, warehousing, and logistics RaaS", "Longer-running operational deployment with dispatch and support", "Stated expansion focus after Series A/A+ financing", "Company-stated strategic direction", "Provide contract term, SLA, renewal, gross margin, and deployment ramp"]
      - ["Platform and partner services", "Dispatch, partner SaaS, global app, fulfillment, support, and ecosystem coordination", "Systems and network capabilities publicly described; monetization terms unknown", "Observed platform features; economics unverified", "Provide take-rate, partner payout, support-cost, and insurance terms"]
    notes: "Sources describe mechanisms and strategic direction, not a reconciled revenue statement. Null or undisclosed values mean the assigned public evidence does not report the metric."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Pricing signal, Amount or range, Basis, Interpretation, Diligence ask]
    rows:
      - [Basic rental, "Slightly above 200 yuan/day", "Global Times citing CCTV and market platforms", "Low-end market reference; not SHAREBOT realized revenue", "Obtain SHAREBOT invoice-level realized price and inclusions"]
      - [Advanced interactive/performance rental, "2,000-5,000 yuan/day", "Global Times market reporting", "Higher-service tier has greater nominal revenue but likely higher delivery cost", "Measure gross contribution after labor, transport, and support"]
      - [Premium package, "Nearly 100,000 yuan/day", "Xinhua description of packages with technicians and custom programming", "Package pricing may bundle labor and customization; not comparable to a robot-only day rate", "Separate equipment, technician, programming, and pass-through charges"]
      - [Price pressure, "Some daily rents fell more than 40% from peak", "Xinhua reporting on market consolidation", "Adverse signal for pricing power and asset returns", "Provide price waterfall, utilization, and cohort margin by model"]
    notes: "These are reported market or package prices, not a SHAREBOT price list or recognized revenue schedule; currency is RMB unless otherwise stated."
    claimRefs: [CI005, CI006, CI007]
  - id: TI003
    title: Unit-economics underwriting status
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Utilization, null, low, "Determines revenue per robot and depreciation absorption", "Monthly booked days and idle days by model and city"]
      - [CAC and payback, null, low, "Tests whether demand generation is economically scalable", "Customer acquisition spend, bookings, gross profit, and payback cohorts"]
      - [Gross margin, null, low, "Separates platform economics from asset and service burden", "Revenue, robot depreciation, labor, logistics, repairs, insurance, and partner payouts"]
      - ["Retention, churn, and NRR", null, low, "Tests whether the shift from events creates recurring demand", "Contract renewal, repeat order, churn, expansion, and top-customer concentration"]
      - ["Cash balance, burn, and runway", null, low, "Tests financing dependency and next-round timing", "Latest management accounts, bank cash, monthly burn, debt, and capex commitments"]
      - ["Working capital and service obligations", null, low, "Tests whether growth consumes cash before collection", "Receivables aging, deposits, inventory/robot ownership, warranties, and insurance recoveries"]
    notes: "No assigned source discloses these company-level metrics. Null values are intentional evidence gaps, not zero estimates; each row states the requested diligence evidence."
    claimRefs: [CI008, CI010, CI011, CI012, CI013]
