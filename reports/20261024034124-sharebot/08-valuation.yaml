      - ["Commercial readiness is still uneven", "Bain says most humanoid deployments remain pilots with heavy human input", "Show uptime, safety record, and customer ROI in production settings"]
      - ["Price competition can compress returns", "Chinese reporting says daily rental prices fell from about RMB10,000 to about RMB4,000 in a cited market example", "Show price realization and asset payback after depreciation"]
      - ["Private-company disclosure is not public-comp disclosure", "MarketBeat indexes recurring 2026 annual and quarterly filings for Richtech Robotics", "Provide equivalent audited accounts, capitalization, and risk disclosures under diligence"]
    notes: "Market and peer evidence is directional, not a substitute for SHAREBOT's own cohort, contract, or capitalization data."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV014]
  - id: TV003
    title: Bull / base / bear underwriting scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Repeat multi-city customers, high utilization, improving service density, and verified positive contribution margin", "Premium operating-company valuation may be supportable after a verified priced round", "Execution and safety risk remain", "Evidence insufficient to assign probability"]
      - [Base, "Event and pilot demand grows but pricing and service costs remain competitive", "Use a conservative rental or contribution-profit framework with an entry discount", "Utilization and margin may disappoint", "Most defensible interim case pending data"]
      - [Bear, "Day rates continue falling, downtime or compliance incidents rise, and working capital requires new capital", "Down-round or dilution risk; avoid underwriting a high private mark", "Commercialization and financing risk compound", "Material downside cannot be quantified publicly"]
      - ["Bull trigger", "Audited revenue and gross margin plus renewal and utilization cohorts exceed underwriting thresholds", "Re-rate only against verified cash generation and dilution terms", "Data may be selectively disclosed", Unresolved]
      - ["Base trigger", "Management supplies monthly fleet, uptime, pricing, service-cost, and customer concentration data", "Maintain research-more and stage capital", "Reporting quality and accounting policy risk", Unresolved]
      - ["Bear trigger", "Safety event, material customer loss, down round, or inability to fund fleet obligations", "Pause or reject investment", "Liquidity and reputation damage", Unresolved]
    notes: "These are underwriting scenarios, not modeled valuation estimates; no probability percentages or valuation ranges are assigned because the source pool lacks SHAREBOT financial inputs."
    claimRefs: [CV002, CV003, CV008, CV012, CV013]
