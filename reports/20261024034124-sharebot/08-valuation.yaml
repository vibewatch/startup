company:
  name: SHAREBOT
chapter:
  number: 8
  title: Valuation
  summary: Crunchbase reports a $1 billion valuation for a Pudong robot-leasing platform it calls Botshare, but the assigned evidence does not establish the legal-entity match or disclose the fundamentals and financing terms needed to underwrite that price. The evidence therefore supports research-more and treats the reported mark as stretched unless diligence closes those gaps.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      SHAREBOT should remain in research-more status. Crunchbase's May 2026 unicorn review reports that a less-than-one-year-old Pudong robot-leasing platform called Botshare raised a Series A and was valued at $1 billion, but the assigned pool does not establish that this English label maps to SHAREBOT's legal entity or that the mark remains current. The report also supplies no revenue run-rate, gross margin, utilization, cash burn, capitalization, or preference data. Entry discipline therefore matters more than the headline valuation: an investor should require legal-entity confirmation, financing documents, audited or management accounts, cohort utilization and renewal data, and a contribution-margin bridge after logistics, service, insurance, downtime, and depreciation. Conditional on entity confirmation, the $1 billion reference looks stretched rather than supported by public fundamentals; this is not evidence that demand is absent.
    claimRefs: [CV001, CV002, CV003, CV004, CV010, CV011]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that robotics adoption is expanding in Asia-Pacific, Chinese policy and industrial scale can create a large operating environment, and rental can reduce the upfront commitment for customers that need robots for short events or pilots. Market Research Future projects the Asia-Pacific robotics market from $42.33 billion in 2025 to $141.21 billion in 2035 at a 12.8% CAGR, while IFR and Chinese government reporting put China's 2024 industrial-robot stock at about or above two million units. The anti-thesis is that these are market-level indicators, not SHAREBOT cash flows. Bain and IFR describe humanoid deployments as largely pilot-stage or demonstration-led; Sohu describes falling daily rental prices and the operational burden of dispatch, tuning, repair, insurance, and recovery. CCTV's 2026 standards coverage also reports high costs, fragmented scenarios, imported-component dependence, and model-generalization constraints. The thesis changes only when SHAREBOT demonstrates durable utilization and positive contribution economics after those costs.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and diligence
    body: >-
      Scenario analysis should be expressed as underwriting gates rather than fabricated valuation points. In the bull case, repeat customers, multi-city service density, high utilization, and paid data or workflow services could support a premium to a simple equipment-rental multiple. In the base case, event-led demand grows but price competition and service costs keep margins modest, supporting a disciplined entry only after verified unit economics. In the bear case, falling day rates, hardware downtime, safety or compliance failures, and working-capital needs force a down-round or additional dilution. Comparable marks show the danger of false precision: Crunchbase reports Botshare at $1 billion after a Series A, while CompaniesMarketCap reported Serve Robotics at $0.24 billion on October 23, 2026 and down 68.08% during 2026. Richtech's indexed 10-K and 10-Q cadence also illustrates the disclosure gap between public comparables and this private-company evidence pool. None is an interchangeable benchmark, so SHAREBOT needs contract, asset, financing, and exit data before a valuation range or target return can be assigned.
    claimRefs: [CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
