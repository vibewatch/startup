schemaVersion: "report-v2"
artifact: customers
slug: sharebot
runDate: 2026-10-24
company:
  name: SHAREBOT
chapter:
  number: 6
  title: Customers
  summary: Public evidence shows SHAREBOT is acquiring demand through short-duration event, exhibition, retail, tourism, and brand-activation use cases, with booking and inquiry signals during the 2026 Spring Festival period. The evidence supports market pull and a multi-sided service model, but does not establish recurring contracts, retention, customer concentration, or named production deployments.
sections:
  - id: segments-and-demand
    title: Customer segments and demand surfaces
    body: Publicly described demand is concentrated in business-to-business and event-led use cases rather than a disclosed recurring enterprise subscription base. People’s Daily reports that more than 54 percent of Botshare orders during the Spring Festival were for New Year greetings, temple fairs, and shopping malls, while marriage proposals and parent-child activities were rising. Pandaily similarly describes demand from festive events, corporate annual meetings, and cultural-tourism activities, with orders increasing approximately 30 percent week over week during February 1–7, 2026. The AWE account adds exhibitions, malls, tourism, brand marketing, celebrations, and education as target contexts, and says customers asked how robots could support store traffic, event dissemination, brand interaction, and reception. These signals identify a broad buyer set—brands, event organizers, malls, tourism operators, and education providers—but do not disclose payer mix, contract value, or repeat behavior.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named-use proof
    body: The strongest public adoption evidence is transactional or operational rather than retention-based. People’s Daily cites more than 1,000 Botshare orders received by February 12 for the February 15–23 holiday period, with an expectation of more than 5,000 by the holiday’s end; Pandaily reports that seasonal bookings were essentially sold out a month in advance and that popular models were scheduled through mid-March. The AWE article describes jointly deployed robots listed in the platform mini-program and customer inquiries at the exhibition. These records support demand, availability pressure, and platform-mediated deployment, but they do not identify customer names, production-versus-pilot status, outcomes, renewal, or unit economics.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration unknowns
    body: Public reporting does not provide SHAREBOT’s churn, renewal, GRR, NRR, cohort retention, contract duration, or top-customer revenue share. The available evidence instead shows a seasonal demand pattern and an operating model that must coordinate equipment, local service, on-site operators, safety personnel, and customization. IT Home reports a network of more than 600 service providers across 50 core cities and a price range from 200 yuan to more than 10,000 yuan, while the AWE account describes selection, solution design, deployment, content planning, and operational support. This can lower experimentation friction for customers, but it also leaves open whether activity converts into durable recurring usage and whether platform economics depend on a small number of seasonal channels or partners.
    claimRefs: [CU009, CU010, CU011, CU012]
    calloutRefs: []
callouts:
  - calloutType: insight
    title: Demand is visible; durability is not
    body: Booking volume, holiday utilization, and customer inquiries indicate real market pull, but the retained public sources do not disclose repeat purchase, renewal, or concentration metrics.
    claimRefs: [CU005, CU006, CU011]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer or user, Observed use case, Evidence of scale or value, Gap]
    rows:
      - [Brands and exhibitors, Brand or event marketing team, Exhibition interaction and audience engagement, "AWE deployment and customer inquiries", No disclosed conversion or contract value]
      - [Malls and retail venues, Commercial property or store operator, "Traffic generation, reception, and interactive promotion", Spring Festival orders included shopping malls, No repeat-use or revenue data]
      - [Tourism and cultural venues, Tourism or cultural-program operator, Festive performances and cultural-tourism activities, "Holiday demand and bookings reported", No named venue deployment outcome]
      - [Education and family activities, Education provider or household activity organizer, "Education, science outreach, and parent-child activities", These use cases are described in retained reporting, No utilization or retention denominator]
    notes: Sources describe use-case categories and demand signals; they do not disclose a complete customer population, payer mix, contract values, or segment revenue. Null-style gaps are therefore qualitative diligence items rather than zero values.
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Period, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Botshare Spring Festival orders received, "more than 1,000", "By 2026-02-12 for 2026-02-15 to 2026-02-23 holiday", People's Daily Online, medium, Evidence of pre-holiday demand, Orders expected by period end]
      - [Botshare expected Spring Festival orders, "more than 5,000", "2026 Spring Festival holiday", People's Daily Online, medium, Indicates potential booking acceleration, Actual completed orders and cancellations]
      - [Botshare order growth, "approximately 30% week over week", "2026-02-01 to 2026-02-07", Pandaily, medium, Shows short-window momentum, Baseline order count and mix]
      - [JD self-operated robot-rental transaction volume, "more than doubled month on month", "2026-01", Pandaily, medium, Supports category-level demand growth, SHAREBOT-specific share and revenue]
    notes: The metrics come from third-party reporting and are not a consistent SHAREBOT cohort. They are directional demand indicators, not recurring-revenue or retention measures.
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or setting, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    rows:
      - [AWE2026 exhibition, Brand and exhibition, "AGIBOT X2 and Expedition A2 jointly deployed for performances and interaction", Public exhibition deployment, Audience attention and customer inquiries reported, No buyer name or paid contract disclosed]
      - [Shopping malls, Retail and property, "New Year greetings, performances, and interactive activities", Rental activity reported, "More than 54% of Botshare orders were in listed activity categories", "No named mall, outcome, or renewal disclosed"]
      - [Cultural-tourism activities, Tourism and events, Holiday performances and cultural-tourism rentals, Seasonal rental deployment, Bookings described as sold out in advance, No named customer or utilization after event]
    enumerationScope:
      coverage: sample
      basis: Publicly described 2026 event and venue use cases in the retained customer evidence pool; not a complete customer roster.
    notes: The pool contains use-case and deployment descriptions but no sufficiently detailed named-customer case studies with outcomes and renewal evidence. This table is a bounded sample, not an exhaustive enumeration.
    claimRefs: [CU001, CU002, CU003, CU006]
figures:
  - id: FU001
    title: Customer journey from trial demand to repeat-use proof
    type: journey-map
    summary: Public evidence supports a path from seasonal discovery and event booking to on-site deployment, while repeat usage and expansion remain unverified.
    data:
      items:
        - label: Discovery
          detail: Public events, exhibitions, malls, tourism, and media exposure create customer interest.
          touchpoints: [Spring Festival visibility, AWE exhibition, brand interaction]
        - label: Trial booking
          detail: Customers can rent robots for short-duration activities rather than purchase equipment.
          touchpoints: [Mini-program listing, event booking, flexible rental]
        - label: Configuration
          detail: The platform describes robot selection, solution design, content planning, and customization.
          touchpoints: [Model selection, costume and action design, scenario planning]
        - label: Delivery
          detail: Reported service includes deployment, on-site delivery, and operational support.
          touchpoints: [On-site deployment, operator support, safety personnel]
        - label: Live use
          detail: Observed contexts include exhibitions, malls, cultural tourism, celebrations, and education.
          touchpoints: [Audience interaction, performances, reception, traffic generation]
        - label: Repeat or expansion
          detail: Repeat purchase, renewal, expansion, and customer concentration are not publicly evidenced.
          touchpoints: [Retention data gap, contract-length gap, concentration gap]
    claimRefs: [CU003, CU004, CU009, CU010, CU011]
    approximationNotes: The sequence is an analytical representation of publicly described customer touchpoints; it does not imply a measured conversion funnel or retention rate.
