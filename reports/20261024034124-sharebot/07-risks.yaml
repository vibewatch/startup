schemaVersion: "report-v2"
artifact: risks
slug: sharebot
runDate: 2026-10-24
company:
  name: SHAREBOT
chapter:
  number: 7
  title: Risks
  summary: SHAREBOT's robot-leasing model is exposed to equipment damage, third-party injury, data and cybersecurity uncertainty, and execution pressure as the market scales. Public evidence shows growing insurance and service infrastructure, but does not establish the company's own loss history, controls, profitability, or concentration profile.
sections:
  - id: risk-posture
    title: Risk posture and evidence boundary
    body: >-
      SHAREBOT operates in a market where robots move through public, high-traffic,
      and varied environments rather than remaining in controlled facilities. A
      Chinese financial publication describes rental as lowering adoption barriers
      while increasing exposure to equipment damage, third-party liability, and
      data security. It also reports that robot leasing combines equipment lending
      with on-site technical operations and human interaction, making responsibility
      span the owner, operator, software, and venue. This is a structurally
      higher-control burden than a simple marketplace transaction. Public reporting
      further indicates that demand is expanding, but the evidence does not
      disclose SHAREBOT-specific incident frequency, loss ratios, insurance
      exclusions, uptime, or customer concentration. The risk conclusion is
      therefore based on operating-model exposure and sector evidence, not a claim
      that SHAREBOT has suffered an unreported incident.
    claimRefs: [CR001, CR002, CR003]
    tableRefs: [TR001]
  - id: regulatory-data
    title: Regulatory, legal, and data exposure
    body: >-
      The most material legal and regulatory uncertainty concerns safety,
      responsibility, and data governance across jurisdictions and use cases. A
      Yicai report says embodied-intelligence products lack unified international
      or industry standards and identifies compatibility, security, data
      compliance, and cross-border data-flow risks. The same report records that
      insurers are adding third-party liability and cybersecurity coverage, which
      is a mitigation signal but not proof that a platform's controls or policy
      limits are adequate. The available evidence does not confirm SHAREBOT's
      licenses, privacy notices, customer consent flows, incident response plan,
      product-safety certifications, or contract allocation of liability. These
      gaps should be treated as diligence blockers before assuming that insurance
      transfers legal or reputational exposure.
    claimRefs: [CR004, CR005, CR006]
    tableRefs: [TR002]
  - id: operations-dependencies
    title: Operational and dependency risks
    body: >-
      Reliability is a core economic risk because a rental asset that is late,
      damaged, or unavailable can lose the event and require replacement service.
      Shanghai government reporting describes engineers checking state, adjusting
      parameters, confirming interaction logic, monitoring operation, and
      responding to unexpected interaction in crowded holiday settings. It also
      reports that robots may run for more than eight hours in dense public
      environments. Separate reporting describes repair, battery, testing,
      logistics, insurance, and recovery as interlocking capabilities, and notes
      that rental prices have fallen while service quality becomes a competitive
      threshold. SHAREBOT's public evidence does not establish its own service
      levels, spare-parts availability, partner exclusivity, or economics after
      field support. The operating model therefore has both uptime risk and
      dependency risk even when demand is present.
    claimRefs: [CR007, CR008, CR009, CR010]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring, mitigations, and thesis-break triggers
    body: >-
      Available mitigations are developing at the ecosystem level: insurance
      products combine body-loss and third-party liability, repair networks are
      expanding, and platforms are described as using operations data to improve
      dispatch and risk control. These measures reduce exposure only if SHAREBOT
      can demonstrate coverage scope, claims handling, preventive maintenance,
      event-site controls, and auditable data permissions. The investment thesis
      should break if a material injury or property loss is uninsured or cannot be
      assigned promptly; if repeat failures cause cancellations or refunds; if
      insurance exclusions leave the company bearing replacement cost; if
      supplier or repair dependencies interrupt peak-season availability; or if
      regulators or customers restrict data collection. The next diligence step is
      a loss-run and incident ledger reconciled to contracts, insurance schedules,
      uptime records, and repair tickets.
    claimRefs: [CR011, CR012, CR013, CR014]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Third-party injury or property damage during public operation", "Medium", "High", "Emerging sector insurance and site operations", "High until SHAREBOT loss history and limits are verified", "Obtain incident ledger, claims history, policy wording, exclusions, and venue liability clauses."]
      - ["Data compliance and cross-border data flows", "Medium", "High", "Sector insurers and partners are researching cybersecurity coverage", "High because SHAREBOT controls are not public", "Review privacy notices, consent, retention, data maps, subprocessors, and transfer assessments."]
      - ["Unclear product-safety or liability allocation across maker, platform, operator, and venue", "Medium", "High", "Contractual allocation is not publicly evidenced", "High", "Sample customer and supplier contracts; verify certifications and indemnities by deployment."]
    notes: Public sector and insurer reporting identifies the exposure; SHAREBOT-specific legal status, insurance terms, and incident data remain unverified.
    enumerationScope:
      coverage: partial
      basis: Three highest-priority legal and regulatory exposures identified from public sector and insurer reporting available by 2026-10-24.
    claimRefs: [CR001, CR004, CR005, CR006]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Collision, fall, or component failure in a crowded venue", "Medium", "High", "On-site monitoring and insurance products are described", "High", "No SHAREBOT uptime, incident, or repair dataset is public."]
      - ["Late delivery, failed setup, or peak-season outage", "Medium", "High", "Regional repair and logistics networks are expanding", "Medium-high", "No contracted service-level or spare-parts evidence is public."]
      - ["Cybersecurity, data leakage, or unsafe software behavior", "Medium", "High", "Cybersecurity is being included in emerging insurance products", "High", "No SHAREBOT security certification, breach history, or control description is public."]
      - ["Repair and maintenance cost compression as rental prices fall", "Medium", "Medium-high", "Service capability is becoming a competitive focus", "Medium-high", "No unit economics, utilization, or warranty allocation is disclosed."]
    notes: Likelihood and severity are risk-register judgments anchored to described operating conditions; they are not SHAREBOT incident rates.
    claimRefs: [CR002, CR005, CR007, CR008, CR009, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Robot manufacturers and component suppliers, "Equipment and software providers", "Supply, firmware, or compatibility failure strands rental inventory", "High", "Multiple brands and growing repair ecosystem are reported", "High until supplier terms and substitution rates are reviewed."]
      - [Logistics and repair network, "Delivery, service, and recovery partners", "A damaged unit cannot be restored before a booked event", "High", "Repair centers and on-site service expansion are reported", "Medium-high because SHAREBOT coverage is unverified."]
      - [Insurance provider and claims process, "Property, liability, and cyber insurers", "Exclusions or slow claims force SHAREBOT to absorb losses", "High", "Specialized products and early claims examples exist in the sector", "High until policies, deductibles, and claims performance are inspected."]
    notes: Dependency rows synthesize public descriptions of robot-rental operations and insurance; counterparties specific to SHAREBOT are not disclosed.
    claimRefs: [CR008, CR009, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Public evidence places safety, data, and peak-season execution risks in the highest residual-exposure band until company controls are verified.
    data:
      columns: [Likelihood, Impact, Residual exposure]
      rows:
        - label: Public-operation injury or property damage
          values: ["Medium", "High", "High"]
        - label: Data compliance or cybersecurity failure
          values: ["Medium", "High", "High"]
        - label: Peak-season delivery or uptime failure
          values: ["Medium", "High", "Medium-high"]
        - label: Insurance exclusion or claims delay
          values: ["Medium", "High", "High"]
        - label: Supplier or repair dependency interruption
          values: ["Medium", "High", "Medium-high"]
        - label: Rental-price compression and support-cost pressure
          values: ["Medium", "Medium-high", "Medium-high"]
    claimRefs: [CR002, CR005, CR008, CR011, CR014]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: The combination of public human interaction, asset damage, and incomplete disclosure makes liability transfer and operational control the principal diligence bottleneck.
    claimRefs: [CR001, CR002, CR004]
  - calloutType: recommendation
    title: Kill-criterion package
    body: Do not underwrite scale until SHAREBOT provides reconciled incident, insurance, uptime, repair, supplier, and data-governance records for the target deployment base.
    claimRefs: [CR011, CR012, CR013, CR014]
