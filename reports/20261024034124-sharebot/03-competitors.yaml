      yAxis: "Distribution/channel power (ordinal 1-5)"
      points:
        - {label: SHAREBOT, x: 5, y: 3, note: "Reported multi-brand fleet, dispatch, partner SaaS, and cross-regional service; channel power not quantified"}
        - {label: Qingtian Rent, x: 4, y: 3, note: "Reported provider network and scenario platform; retained sources conflict on whether the name belongs to SHAREBOT or AgiBot"}
        - {label: JD.com, x: 3, y: 5, note: "Commerce, offline JD MALL, and self-operated rental channel; multi-brand orchestration less explicit"}
        - {label: Wanjiyi Rental, x: 5, y: 3, note: "Alliance and AI matching claims; operating reach and channel scale not disclosed"}
        - {label: Direct OEM route, x: 2, y: 4, note: "Supply and brand control can be strong; cross-brand orchestration is limited"}
        - {label: Internal build or status quo, x: 1, y: 2, note: "Customer controls workflow but lacks shared rental network"}
    claimRefs: [CP006, CP007, CP008, CP009, CP015]
    approximationNotes: "Scores are ordinal analyst judgments anchored to the cited capability and channel disclosures; they are not reported benchmarks, market shares, or financial estimates."
