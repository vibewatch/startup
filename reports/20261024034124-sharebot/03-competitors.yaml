artifact: competitors
slug: sharebot
runDate: 2026-10-24
company:
  name: SHAREBOT
chapter:
  number: 3
  title: Competitors
  summary: SHAREBOT is competing in a rapidly forming robot-rental and RaaS layer rather than a settled software category. The assigned evidence shows competition from JD.com, Wanjiyi, and Qingtian Rent, although Qingtian Rent is attributed inconsistently to SHAREBOT and AgiBot; falling prices, fragmented supply, and manufacturers' own channels can compress differentiation before SHAREBOT proves durable utilization or service economics.
sections:
  - id: competitive-landscape
    title: Landscape and direct alternatives
    body: >-
      SHAREBOT's direct competitive set is a platform layer that aggregates robot
      manufacturers, service providers, and customer demand. SHAREBOT says it has
      moved from display, entertainment, events, and marketing toward industrial
      manufacturing, campus operations, warehouse logistics, and commercial
      services, and reports a fleet assembled from multiple brands. Preqin describes
      the same model as robot equipment leasing, service coordination, and digital
      platform usage for B2B and B2C contracts. That creates a direct comparison
      with Qingtian Rent, Wanjiyi Rental, and JD.com's self-operated rental
      service, not only with robot OEMs. Yicai attributed Qingtian Rent to AgiBot,
      while Pandaily identified SHAREBOT with the same name. The platform was reported as
      operating in 50 cities with more than 600 service providers and over 1,000
      robots, while SHAREBOT's reporting cites deployment in more than 50 cities
      and over 1 million cumulative operating hours. These figures are issuer- or
      media-reported and are not a like-for-like measure of active utilization.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP016]
    tableRefs: [TP001]
  - id: buyer-choice-and-capabilities
    title: Buyer choice, capability, and distribution
    body: >-
      Buyers can solve the same job through several routes: a multi-brand rental
      marketplace, a manufacturer-led or OEM-linked platform, a large commerce
      channel, or direct purchase and internal operation. SHAREBOT's cited
      capabilities include partner SaaS, a global app, intelligent task dispatch,
      a skills store, robot selection, customized scenario solutions, scheduling,
      and maintenance support. Wanjiyi presents a similar ecosystem proposition,
      combining AI matching, standardized operation and maintenance, and an
      alliance of manufacturers, solution providers, finance, insurance, parks,
      and end users. JD.com has distribution power and a lower-friction rental
      offer through JD MALL, while Qingtian Rent emphasizes scenario
      packages and an expanding provider network. The evidence does not disclose
      comparable contract terms, uptime, take rates, renewal, or service-level
      performance, so the matrix marks those cells unknown rather than inferring
      a winner.
    claimRefs: [CP004, CP006, CP007, CP008, CP009, CP010, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-moat-and-risks
    title: Pricing pressure and moat durability
    body: >-
      Price is a visible competitive pressure. Independent coverage reports that
      robot rental prices fell from roughly CNY10,000 per day to just over CNY100
      for some offerings, while another report gives mainstream rates of roughly
      CNY3,000-CNY5,000 and records a Qingtian Rent package as high as CNY99,800 per
      day. These are different models, scenarios, and periods, so they should not
      be treated as one price curve. The same Yicai report identifies unstable
      pricing, seasonal demand, and incompatible interfaces as sector challenges.
      SHAREBOT's multi-brand scheduling and service network could reduce customer
      search and coordination costs, but those advantages may be copied by
      commerce platforms, OEMs, and ecosystem alliances. The strongest adverse
      conclusion is therefore not that SHAREBOT lacks a product; it is that
      commoditization and channel disintermediation could limit pricing power
      before switching costs and repeat utilization are demonstrated.
    claimRefs: [CP011, CP012, CP013, CP014, CP015]
    tableRefs: [TP003]
callouts:
  - calloutType: strength
    title: Multi-brand orchestration is the clearest differentiator
    body: SHAREBOT's reported combination of multi-brand fleet access, dispatch, partner SaaS, and scenario delivery is more defensible than a single robot model, but the evidence does not yet establish exclusive supply or repeat economics.
    claimRefs: [CP006, CP007]
  - calloutType: risk
    title: Channel owners can move upstream
    body: JD.com already combines commerce distribution, offline experience centers, and self-operated rentals, while OEM-linked platforms are expanding; this can compress the value of an independent rental intermediary.
    claimRefs: [CP008, CP009, CP015]
  - calloutType: recommendation
    title: Underwrite utilization before platform scale
    body: The next diligence step is contract-level evidence on repeat bookings, utilization, gross contribution after operators and maintenance, supplier exclusivity, and customer switching behavior.
    claimRefs: [CP004, CP011, CP014]
