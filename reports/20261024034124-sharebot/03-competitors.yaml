      - [Scenario coverage, "Events, retail, property, manufacturing, campus, logistics, commercial services", "16-plus applications; entertainment and performance focus initially", "Home, education, health care, entertainment and retail experience scenarios", "Performance, cleaning, teaching, companionship, eldercare and family use", "All offer broad scenarios; paid conversion by scenario is unknown"]
      - [Scheduling or matching, "Intelligent task dispatch and cross-regional scheduling reported", "WeChat mini-program and provider network", "Commerce and offline store channel", "AI intelligent matching", "SHAREBOT and Wanjiyi have explicit orchestration claims; comparative service levels unknown"]
      - [Operations and maintenance, "Maintenance support reported", "Service-provider network; standardized quality not demonstrated", "Operator or safety inclusion reported for some market rentals", "Standardized operation and maintenance claimed", "Operator cost, uptime, and liability allocation are open"]
      - [Pricing transparency, "Realized prices and contract terms not disclosed", "Reported CNY500 daily D1 rate to CNY99,800 package depending on scenario", "Lower-price and flexible-period offer reported; list prices not given", "No comparable prices disclosed", "Published rates are scenario-specific and not evidence of unit economics"]
      - [Trust or regulatory posture, "No assigned source discloses audited safety or compliance artifacts", "No assigned source discloses audited safety or compliance artifacts", "Large-channel brand and logistics context, but rental safety metrics absent", "Insurance and finance participants cited at launch", "Trust advantage is unproven across all platforms"]
    notes: "Cells summarize only assigned source text. Unknown or null cells indicate no comparable disclosure in the assigned pool, not that the capability is absent."
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP013, CP014]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Route, Published price or contract model, Included capability or context, Discount or unknown, Competitive implication]
    rows:
      - [SHAREBOT, "Not disclosed", "RaaS platform, dispatch, scenario delivery and maintenance support reported", "Realized price, discounting, operator costs and take rate unknown", "Cannot yet establish price premium or gross contribution"]
      - [Qingtian Rent, "About CNY500/day for D1 Ultra; up to CNY99,800/day for a two-robot sports package", "Scenario-dependent rentals through WeChat mini-program", "Prices vary by model and scenario; demand seasonality and ownership attribution are unresolved", "Wide price dispersion supports segmentation but raises commoditization risk"]
      - [JD.com, "Daily or long-term rentals described; price not disclosed", "Offline JD MALL experience and self-operated service", "Price, deposit, maintenance and operator inclusion unknown", "Channel convenience may reduce search friction and customer acquisition cost"]
      - [Robot rental market, "Roughly CNY100-plus to CNY10,000/day across reported offerings and periods", "Model, features and duration vary", "Sources use different periods and populations", "Falling entry prices can expand demand while pressuring intermediary margins"]
      - [Direct purchase or internal build, "Purchase or project contract; price not disclosed", "Customer controls asset and operating process", "Capex, staffing, maintenance and utilization economics unknown", "Status quo remains rational when utilization is high or control is critical"]
    notes: "Prices are reported snapshots from different publishers, periods, robot models, and scenarios; they are not a comparable price index. Missing values are undisclosed, not zero."
    claimRefs: [CP011, CP012, CP013, CP014, CP015]
