  - type: conflicting-data
    severity: material
    topic: traction
    missingEvidence: >-
      A reconciled dated operating KPI pack explaining differences between reported device, order, city, and
      service-provider counts.
    whyItMatters: >-
      Different publications report different fleet and network snapshots, so scale cannot be compared without dates and
