  - type: missing-source
    severity: material
    topic: safety
    missingEvidence: SHAREBOT-specific safety certification, insurance terms, privacy controls, security testing, and incident history.
    whyItMatters: >-
      Robot deployments interact with people and sensitive locations; missing controls create operational, regulatory,
      and liability uncertainty.
    diligencePath: >-
      Request certifications, risk assessments, insurance policies, data-flow maps, access-control evidence, incident
