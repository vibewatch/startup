evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, cash-flow statement, burn, runway, total raised, and customer concentration.
    whyItMatters: >-
      A reported valuation cannot be assessed against operating performance or liquidity without consistent financial
      definitions and periods.
    diligencePath: >-
      Request audited or management financial statements, KPI definitions, cohort data, and bank or debt schedules under
      NDA.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete founder, executive, board, investor, and beneficial-ownership roster.
    whyItMatters: >-
      Missing governance evidence prevents assessment of key-person dependence, control rights, related-party risk, and
      accountability.
    diligencePath: >-
      Obtain current corporate registry extracts, cap table, board minutes, committee structure, and leadership
      biographies.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: entity-identity
    missingEvidence: Primary documentation linking or distinguishing SHAREBOT, Qingtian Rent, and Botshare.
    whyItMatters: Combining financing and valuation claims across names could misstate the company’s capitalization or asset base.
    diligencePath: >-
      Match legal names, registration identifiers, websites, financing announcements, and investor disclosures before
      consolidating metrics.
    relatedQuestionRefs:
      - QO001
      - QO004
  - type: access-blocked
    severity: minor
    topic: milestone-verification
    missingEvidence: The company-specific body behind the fetched September 2026 Robothot result.
    whyItMatters: >-
      The seven-product milestone is useful context but currently has lower evidentiary confidence than a literal
      fetched article would provide.
    diligencePath: >-
      Obtain the original conference announcement or an accessible contemporaneous report that names the products and
      date.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Signed customer and operating data that isolate serviceable geography, robot category, eligible fleet capacity,
      utilization, realized daily or monthly pricing, and repeat bookings.
    whyItMatters: >-
      Without these inputs, broad robotics forecasts cannot support a company-specific SAM, SOM, revenue opportunity, or
      valuation multiple.
    diligencePath: Obtain a segment-by-segment cohort and unit-economics pack covering the latest twelve months.
    relatedQuestionRefs:
      - QM005
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Contracts or customer references identifying budget owner, workflow, deployment duration, renewal, and outcome by
      target segment.
    whyItMatters: The adoption path may remain episodic if rentals do not convert into recurring operating budgets.
    diligencePath: Sample signed contracts and renewal cohorts across events, retail, property, healthcare, and logistics.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: valuation-context
    missingEvidence: >-
      Independent confirmation reconciling public company names, funding rounds, and valuation references for
      SHAREBOT/Qingtian Rent.
    whyItMatters: Company and peer valuation signals can be confused with one another and should not be used interchangeably.
    diligencePath: Request cap-table, financing notices, and independently verifiable round documentation.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: commercial-terms
    missingEvidence: >-
      Comparable customer contracts, realized prices, take rates, gross contribution, renewal, and utilization by
      scenario for SHAREBOT and its direct platforms.
    whyItMatters: >-
      Without these denominators, reported city counts, robot counts, and operating hours do not show whether platform
      scale converts into durable contribution or switching costs.
    diligencePath: >-
      Obtain anonymized contract schedules, cohort bookings, utilization logs, service-cost data, renewal cohorts, and
      supplier commission terms.
    relatedQuestionRefs:
      - QP004
      - QP006
      - QP008
  - type: missing-source
    severity: material
    topic: trust-regulatory
    missingEvidence: Independent safety, insurance, compliance, and incident records comparing the major rental platforms.
    whyItMatters: >-
      Robot deployment in public, industrial, and care settings can shift buyer choice toward trusted operators and
      change liability economics.
    diligencePath: >-
      Request insurance certificates, safety audits, incident logs, customer references, and applicable certifications
      from SHAREBOT and named competitors.
    relatedQuestionRefs:
      - QP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A complete registry of regional robot-rental platforms, OEM direct offers, integrators, and internal-build
      alternatives in SHAREBOT's target geographies.
    whyItMatters: The assigned pool identifies several important routes but cannot establish that the landscape is exhaustive.
    diligencePath: >-
      Build a dated competitor census from procurement records, regional marketplaces, OEM channel pages, and customer
      interviews.
    relatedQuestionRefs:
      - QP001
      - QP003
  - type: conflicting-data
    severity: material
    topic: brand-identity
    missingEvidence: >-
      Corporate-registry, trademark, and contract evidence identifying the legal owner and operator of Qingtian Rent and
      the entity to which its operating metrics belong.
    whyItMatters: Misattributed platform scale would distort SHAREBOT's competitive position, traction, and implied network effects.
    diligencePath: >-
      Obtain the Chinese operating entities, trademark registrations, OEM agreements, and a management reconciliation of
      each public brand and metric.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited revenue, gross margin, utilization, CAC, payback, retention, and customer concentration by cohort.
    whyItMatters: >-
      Without these metrics, public activity and financing cannot establish revenue quality or scalable contribution
      economics.
    diligencePath: >-
      Request monthly management accounts, cohort schedules, order-level invoices, robot utilization, and customer
      concentration under NDA.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
