  - type: private-evidence-only
    severity: material
    topic: technical-maturity
    missingEvidence: >-
      SHAREBOT-specific architecture, APIs, integration documentation, uptime, deployment acceptance criteria, and
      reliability results.
    whyItMatters: >-
      The platform thesis depends on repeatable orchestration and service quality, but public scale claims cannot
      establish technical maturity.
    diligencePath: >-
      Obtain a product and engineering diligence room with architecture diagrams, release history, SLAs, uptime logs,
      incident logs, and representative deployment acceptance reports.
    relatedQuestionRefs:
