  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, runway, debt, capex, working capital, and planned financing trigger.
    whyItMatters: Funding announcements do not establish whether the company can finance asset deployment and service expansion.
    diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, capex plan, and 18-month operating forecast.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
