chapter:
  number: 1
  title: Company Overview
summary: SHAREBOT (also identified as Qingtian Rent) is described in current public reporting as a Chinese robot-leasing platform moving toward Robotics-as-a-Service. Public evidence supports a 2026 Series A/A+ financing claim and a reported 7 billion RMB valuation, but does not establish audited operating metrics, governance detail, or a complete leadership roster.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      SHAREBOT is identified in the retained reporting as Qingtian Rent and as a Chinese robot-leasing platform. The available evidence describes a transition from rental activity toward a broader Robotics-as-a-Service model, with commercial deployment across service and industrial settings rather than a single robot type. Reporting on the surrounding ecosystem indicates that leasing addresses a practical adoption problem: customers may prefer short-term access while robot products continue to iterate. That context supports the business-model direction, but it does not establish SHAREBOT's own utilization, gross margin, contract duration, renewal, or customer concentration. The company profile should therefore distinguish the reported product direction from an independently verified operating scale.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: financing-and-scale
    title: Financing, valuation, and disclosure
    body: A RobotToday briefing, explicitly crediting an original PanDaily report, says SHAREBOT completed Series A and A+ rounds, raised hundreds of millions of RMB, and was valued at 7 billion RMB. Crunchbase separately lists Botshare, described as a robot leasing and rental platform based in Pudong, as a new unicorn valued at $1 billion; the retained text does not independently prove that Botshare and SHAREBOT are the same legal entity, so the linkage remains a diligence question rather than a consolidated metric. The public record retained here does not disclose audited revenue, cash burn, runway, gross margin, total raised, or a verified employee count. These gaps materially limit confidence in valuation and financing conclusions.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: milestones-and-governance
    title: Milestones, leadership, and open diligence
    body: The evidence records a sequence from robot rental toward RaaS, a reported 2026 financing milestone, and a September 2026 ecosystem event associated with seven commercial RaaS products in the assigned search result. It also places the company within a Chinese robotics market where policy and deployment are expanding, while independent reporting cautions that many humanoid capabilities remain demonstrators or pilots. The retained source set does not identify founders, named executives, board members, or material leadership changes with sufficient corroboration. Governance, key-person dependence, related-party controls, safety audits, and legal or regulatory history therefore remain open diligence items rather than established negative findings.
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
