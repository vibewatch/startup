callouts:
  - calloutType: strength
    title: Access-oriented product thesis
    body: SHAREBOT's strongest product evidence is the attempt to make heterogeneous robots usable through leasing, delivery, local service, and scenario packaging rather than requiring customers to purchase and integrate every asset themselves.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Technical maturity remains under-disclosed
    body: Public sources describe network scale and ecosystem intent, but do not establish SHAREBOT-specific uptime, reliability, security, safety certification, integration depth, or customer outcomes.
    claimRefs: [CE008, CE013, CE014]
