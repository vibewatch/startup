  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Buyer or user, Status or maturity, Differentiation, Diligence gap]
    rows:
      - ["Robot fleet and catalog", "Businesses seeking temporary or recurring robot use", "Operating fleet disclosed; model-level inventory unavailable", "Access to multiple robot categories without ownership", "Reconcile fleet by model, location, ownership, and utilization"]
      - ["Rental and transaction platform", "Customers and leasing/service partners", "Operating concept disclosed; software controls not public", "Standardized access and fulfillment ambition", "Obtain product workflow, API, pricing, and SLA documentation"]
      - ["Deployment and local service network", "Local operators and customers", "Coverage and partner model disclosed; service outcomes unavailable", "Regional delivery and support reach", "Test response times, uptime, training, and escalation records"]
      - ["Scenario solutions", "Retail, events, education, tourism, and light industry users", "Use cases disclosed; repeatability not independently verified", "Scenario packaging beyond event-only demand", "Request deployment case files with baseline and measured outcomes"]
    notes: "Rows synthesize assigned company, partner, government, and media sources; status is not a certification, and unavailable fields identify diligence requests."
    claimRefs: [CE001, CE003, CE005, CE009]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, SHAREBOT solution, Measurable benefit, Limitation]
    rows:
      - [Run an event or promotion, Buy or hire a robot and arrange operators locally, "Rental plus delivery and operating support", "Lower upfront access barrier; no verified ROI", "Demand may remain episodic and operator-dependent"]
      - [Add in-store retail interaction, Use staff or ad-hoc equipment for promotion and delivery, "Mobile-retail partnership and standardized pop-up concepts", "Potentially repeatable customer acquisition and last-meter service", "No disclosed conversion, labor, or reliability data"]
      - [Deploy service or education robots, Source equipment and coordinate setup separately, "Multi-category catalog and partner fulfillment", "Potentially shorter procurement path", "No public deployment acceptance or integration metrics"]
      - [Operate robots across regions, Build separate supplier and maintenance relationships, "Cross-region scheduling and lifecycle ecosystem ambition", "Potential network effects from standardization", "International execution, compliance, and partner consistency unproven"]
    notes: "The table separates stated workflow benefits from unverified outcomes; no conversion, uptime, or cost savings are inferred."
    claimRefs: [CE002, CE004, CE006, CE007, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Product risk]
    rows:
      - ["Hardware and asset layer", "Supply and maintain heterogeneous robots", "Robot manufacturers and product availability", "Model variance can complicate training, safety, spares, and quality"]
      - ["Platform layer", "Match demand with assets, partners, and service options", "Transaction, scheduling, and asset data systems", "Architecture, access controls, and integration interfaces are undisclosed"]
      - ["Deployment layer", "Deliver, operate, train, and support robots", "Local providers, logistics, and trained operators", "Coverage claims may not translate into consistent service levels"]
      - ["Lifecycle layer", "Upgrade, recycle, trade, or redeploy assets", "Maintenance, insurance, resale, and compliant disposal partners", "Residual value and chain-of-custody controls are unverified"]
      - ["Data and governance layer", "Record usage, outcomes, and operational exceptions", "Customer, robot, and location data with privacy controls", "Security, privacy, retention, and incident response evidence is absent"]
      - ["Compliance and safety layer", "Validate safe deployment in real settings", "Applicable standards, tests, insurance, and local rules", "No SHAREBOT-specific certification or safety dossier was retained"]
    notes: "Architecture layers are an analytical organization of disclosed activities and policy benchmarks, not a claim that SHAREBOT has implemented each layer as an integrated technical stack."
    claimRefs: [CE006, CE008, CE011, CE013, CE014]
