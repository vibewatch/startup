company:
  name: SHAREBOT
chapter:
  number: 5
  title: Product & Technology
  summary: SHAREBOT is presented as a robotics-leasing and operating platform that combines a multi-city fleet, standardized delivery and service partners, and a planned lifecycle ecosystem. Public evidence supports the operating model and deployment ambition, but does not disclose a company-specific software architecture, reliability results, security controls, or independently validated performance.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      SHAREBOT's disclosed product is a robot-leasing service rather than a single robot
      model. Public descriptions place it between hardware suppliers and customers that
      need temporary or recurring robot deployments for events, retail, service operations,
      education, tourism, and light industry. The platform manages more than 4,000 robots
      across more than 100 cities according to a company-data report, while an earlier
      launch account described a smaller fleet and provider network; these are time- and
      scope-dependent disclosures rather than a reconciled installed-base series. The
      operating workflow appears to include selection, delivery, local operation or
      training, maintenance, and asset disposition. That workflow can lower upfront
      acquisition barriers, but the public record does not establish utilization, uptime,
      repeat deployment, or customer-level outcomes. The product therefore has a credible
      access proposition, with execution quality dependent on standardization across
      suppliers and local service providers.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture-and-maturity
    title: Operating architecture and maturity
    body: >-
      The evidence supports an operating architecture with four practical layers: a
      hardware and asset layer, a platform and transaction layer, a local deployment and
      after-sales layer, and a partner ecosystem layer. SHAREBOT says it intends to
      connect leasing, deployment, maintenance, upgrades, secondary trading, and
      cross-region scheduling, while a reported JD.com relationship for the similarly
      described RoboNow platform illustrates the kinds of logistics, maintenance,
      insurance, recycling, and data-collection capabilities required by this model. These
      descriptions are ecosystem claims, not proof that every capability is already
      owned or integrated by SHAREBOT. The company's stated expansion to 13 countries and
      partnerships for mobile retail and sale-plus-rental products indicate roadmap
      breadth, but no public API, architecture diagram, service-level agreement, failure
      statistics, or deployment acceptance criteria was found in the assigned evidence.
      Maturity is therefore strongest at the marketplace and orchestration concept level
      and unproven at technical-system level.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-dependencies
    title: Differentiation and dependencies
    body: >-
      SHAREBOT's potential differentiation is operational rather than a demonstrated
      proprietary robot breakthrough. The reported model emphasizes a standardized
      delivery network, geographic coverage, scenario-specific solutions, and partner
      coordination. Partnerships with Shanpu and Digit Robotics are described as extending
      mobile retail and sale-plus-rental offerings, with Digit responsible for research
      and production while SHAREBOT contributes platform, channels, and venue resources.
      This division suggests a capital-light ecosystem position, but it also creates
      dependence on supplier quality, partner economics, local operators, logistics, and
      the availability of suitable robots. China's 2026 national policy environment is
      pushing real-scene validation, data governance, reliability, safety functions, and
      lifecycle controls for embodied robots. That raises the bar for measurable
      deployment evidence: marketing claims about access or coverage should not be
      treated as evidence of safety certification, algorithmic advantage, or durable
      intellectual property.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-safety-and-diligence
    title: Trust, safety, and diligence priorities
    body: >-
      The assigned sources do not provide SHAREBOT-specific security documentation,
      privacy controls, incident history, insurance terms, safety certification, or
      quality-control records. Government guidance for embodied-robot deployments calls
      for real-scene testing, success-rate and efficiency evaluation, safety and
      reliability assessment, data-security and privacy safeguards, collision detection,
      force limits, emergency braking, and black-box capabilities. Those requirements are
      relevant diligence benchmarks, not evidence that SHAREBOT has implemented them.
      The key product risk is a gap between a broad network promise and the evidence needed
      to show repeatable, safe, and economically viable deployments across heterogeneous
      robot types and countries. Before underwriting product maturity, an investor should
      obtain the asset inventory by model, acceptance and uptime records, incident and
      insurance logs, partner service-level terms, data-flow and access-control diagrams,
      and evidence that customer deployments meet applicable local requirements.
    claimRefs: [CE013, CE014]
