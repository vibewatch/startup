artifact: market-analysis
slug: sharebot
runDate: 2026-10-24
company:
  name: SHAREBOT
chapter:
  number: 2
  title: Market Analysis
  summary: "SHAREBOT operates in a robotics-access market where China has unusually strong deployment momentum, but the available evidence spans the broader robotics market rather than a clean robot-leasing TAM. The investable question is therefore whether recurring service, logistics, maintenance, and data workflows can convert episodic rentals into durable utilization and budget ownership."
sections:
  - id: market-boundary
    title: Market boundary and demand context
    body: "The relevant market is robot access delivered as a service: customers rent or subscribe to humanoid, service, and other robots for defined deployments, with the provider coordinating availability, delivery, setup, maintenance, and recovery. This boundary includes event, hospitality, retail, healthcare, logistics, property, and emerging industrial use cases when the buyer pays for access or an operated outcome rather than purchasing the asset outright. It excludes robot manufacturing revenue, one-time equipment sales, general industrial automation capex, and financing that does not include operating service. The boundary matters because broad robotics statistics describe hardware deployment and technology investment, while a leasing platform monetizes utilization, service density, and workflow reliability. The evidence indicates a demand bridge from demonstrations and short events toward recurring commercial operations, but does not establish SHAREBOT's recurring revenue, utilization, or retention."
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses, not a single TAM
    body: "Available sizing is directional and uses different populations, geographies, and definitions. Market Research Future estimates the Asia-Pacific robotics market at USD 37.53 billion in 2024 and USD 42.33 billion in 2025, with a projected 12.8% CAGR through 2035; that is a broad robotics market, not RaaS revenue. IFR reports that China had an operational stock of around two million industrial robots and represented 54% of annual global installations in the World Robotics 2025 period. Statista's account of World Robotics 2026 reports 354,000 installations in China during 2025, equal to 59% of global installations. These lenses support a large underlying installed-base and adoption opportunity, but they cannot be arithmetically converted into SHAREBOT's SAM or SOM without rental penetration, service pricing, utilization, geography, and asset-mix assumptions. The most defensible current sizing conclusion is an evidence-constrained opportunity with a broad robotics ceiling and an unquantified serviceable slice."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: "Public evidence identifies event, retail, hospitality, property, healthcare, logistics, and light-industrial settings, but it does not name the contracting party or budget owner for SHAREBOT deployments. Sohu reports that short activity duration can make rental more attractive than purchasing, while also describing delivery, setup, repair, insurance, recovery, and cross-city dispatch as part of the operating burden. China policy and manufacturing scale are tailwinds: IFR says robotics is central to the 2026–2030 industrial strategy, while Global Times reports planned deployments and commercialization efforts. Constraints are equally material: IFR says humanoid capabilities in real production remain limited to demonstrators or pilots and that industrial robots are generally faster and more reliable for specialized tasks. Falling daily rental prices reported by Sohu increase trial affordability but compress platform spread, making service execution and asset utilization central to valuation. Specific buyer and payer roles in the table are therefore marked as inferred or undisclosed rather than presented as observed facts."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-implications
    title: What must be proven before sizing can support valuation
    body: "The evidence supports market pull, but not a company-specific adoption or valuation conclusion. The next diligence pass should reconcile SHAREBOT's claimed fleet availability, city coverage, fulfillment standard, and funding profile with signed customer contracts, repeat-booking cohorts, utilization by robot type, realized price per deployed day, repair and logistics cost, insurance losses, and contribution margin. It should also separate event rentals from recurring site operations and test whether each segment has a clear budget owner. Public market forecasts should be retained as context rather than treated as company revenue proxies. A defensible SOM requires a stated service geography, eligible fleet capacity, achievable utilization, price realization, and a penetration assumption supported by customer evidence; none of those company-specific inputs is sufficiently public in this pool."
    claimRefs: [CM015, CM016, CM017]
    tableRefs: []
tables:
  - id: TM001
    title: Market definition and adoption boundary
    columns: [Segment, Included spend, Excluded spend, Buyer or payer, Relevance]
    rows:
      - ["Event and experiential rental", "Robot access plus delivery/setup for bounded events", "Robot manufacturing and outright purchase", "Marketing, events, or procurement budget", "Entry use case; episodic demand and price sensitivity"]
      - ["Retail, hospitality, and property operations", "Access, deployment, monitoring, and service for customer-facing tasks", "General labor outsourcing without robot access", "Operations, facilities, or property owner", "Potential path from trial to recurring site service"]
      - ["Healthcare and care settings", "Robot access and supported deployment where permitted", "Clinical device sales and unapproved medical claims", "Facility operations or innovation budget", "Higher trust and compliance burden"]
      - ["Logistics and light industrial assistance", "Robot access, integration, maintenance, and uptime service", "Industrial robot capex and factory automation hardware sales", "Operations, manufacturing, or supply-chain budget", "Larger workflow budgets but higher integration demands"]
    notes: "Boundary is an analytical classification; the pool does not provide SHAREBOT segment revenue or a complete customer enumeration."
    claimRefs: [CM001, CM002, CM010]
  - id: TM002
    title: Sizing lenses and limitations
    columns: [Publisher, Year or period, Geography, Value, Growth metric, Methodology or scope, Confidence, Limitation]
    rows:
      - ["Market Research Future", "2024", "Asia-Pacific", "USD 37.53 billion", null, "Broad robotics market estimate", medium, "Not RaaS revenue and not SHAREBOT SAM"]
      - ["Market Research Future", "2025", "Asia-Pacific", "USD 42.33 billion", "12.8% CAGR projected 2025-2035", "Syndicated market forecast", medium, "Forecast scope includes multiple robot categories and functions"]
      - ["Market Research Future", "2035 projection", "Asia-Pacific", "USD 141.21 billion", "12.8% CAGR projected 2025-2035", "Forecast endpoint", medium, "Long-range estimate; no leasing penetration or service split"]
      - ["International Federation of Robotics", "World Robotics 2025 period", "China", "Around 2 million operational industrial robots", "54% of annual global installations", "IFR industry statistics cited in its 2026 policy release", high, "Industrial stock and installations are not rental deployments"]
      - [Statista, "2025 installations", China, "354,000 industrial robots", "59% of global installations", "World Robotics 2026 data summarized by Statista", medium, "Industrial installations are not addressable rental inventory"]
      - [Crunchbase, "May 2026 funding event", "Pudong, China", "Botshare valued at $1 billion", null, "Curated unicorn board based on priced private financing", high, "Peer valuation signal, not SHAREBOT revenue or market size"]
    notes: "Values retain each publisher's scope and units. They are not additive and no conversion from broad robotics spend to SHAREBOT TAM/SAM/SOM is made."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Buyer and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Adoption trigger]
    rows:
      - ["Events and brand activations", "Event organizer or brand, inferred from use case", "On-site teams and attendees, inferred", "Not disclosed", "Short deployment with delivery and setup", "Avoid purchasing an asset needed for only a few days"]
      - ["Retail and hospitality", "Site operator, inferred from use case", "Staff and visitors, inferred", "Not disclosed", "Greeting, guidance, promotion, or service", "Move from one-off trial toward repeat site use"]
      - ["Property and venues", "Property or venue operator, inferred", "Facilities staff and visitors, inferred", "Not disclosed", "Wayfinding, engagement, or routine assistance", "Standardize service across locations"]
      - ["Healthcare and care", "Facility operator, inferred from use case", "Staff, patients, and visitors, inferred", "Not disclosed", "Supported non-clinical interaction or logistics", "Pilot subject to trust, safety, and compliance controls"]
      - ["Logistics and light industry", "Operating company, inferred from use case", "Warehouse or production staff, inferred", "Not disclosed", "Material movement or repetitive assistance", "Demonstrate workflow reliability and operating return"]
    notes: "Buyer, user, and payer roles are analytical hypotheses grounded in the stated use cases; contracts and budget ownership remain a diligence gap."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
