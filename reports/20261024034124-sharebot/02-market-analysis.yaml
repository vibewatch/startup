callouts:
  - calloutType: insight
    title: "The market is broad, but the monetizable wedge is operational"
    body: "China's robotics deployment scale and policy support expand the possible customer base, while rental economics depend on utilization, fulfillment, maintenance, and repeat workflows rather than hardware volume alone."
    claimRefs: [CM006, CM010, CM014]
  - calloutType: risk
    title: "Do not underwrite a broad robotics forecast as SHAREBOT TAM"
    body: "The retained forecasts cover broad robotics categories and installed assets; they do not disclose rental penetration, service pricing, utilization, or SHAREBOT's share."
    claimRefs: [CM005, CM009, CM017]
