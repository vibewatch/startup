chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT is identified in the retained reporting as Qingtian Rent and as a Chinese robot-leasing platform.
              The available evidence describes a transition from rental activity toward a broader Robotics-as-a-Service
              model, with commercial deployment across service and industrial settings rather than a single robot type.
              Reporting on the surrounding ecosystem indicates that leasing addresses a practical adoption problem:
              customers may prefer short-term access while robot products continue to iterate. That context supports the
              business-model direction, but it does not establish SHAREBOT's own utilization, gross margin, contract
              duration, renewal, or customer concentration. The company profile should therefore distinguish the
              reported product direction from an independently verified operating scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
