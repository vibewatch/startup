            body: >-
              The evidence records a sequence from robot rental toward RaaS, a reported 2026 financing milestone, and a
              September 2026 ecosystem event associated with seven commercial RaaS products in the assigned search
              result. It also places the company within a Chinese robotics market where policy and deployment are
              expanding, while independent reporting cautions that many humanoid capabilities remain demonstrators or
              pilots. The retained source set does not identify founders, named executives, board members, or material
              leadership changes with sufficient corroboration. Governance, key-person dependence, related-party
