        - >-
          Repeat multi-city customers, high utilization, improving service density, and verified positive contribution
          margin
        - Premium operating-company valuation may be supportable after a verified priced round
        - Execution and safety risk remain
        - Evidence insufficient to assign probability
      - - Base
        - Event and pilot demand grows but pricing and service costs remain competitive
        - Use a conservative rental or contribution-profit framework with an entry discount
        - Utilization and margin may disappoint
        - Most defensible interim case pending data
      - - Bear
        - Day rates continue falling, downtime or compliance incidents rise, and working capital requires new capital
        - Down-round or dilution risk; avoid underwriting a high private mark
        - Commercialization and financing risk compound
        - Material downside cannot be quantified publicly
      - - Bull trigger
        - Audited revenue and gross margin plus renewal and utilization cohorts exceed underwriting thresholds
        - Re-rate only against verified cash generation and dilution terms
        - Data may be selectively disclosed
        - Unresolved
      - - Base trigger
        - Management supplies monthly fleet, uptime, pricing, service-cost, and customer concentration data
        - Maintain research-more and stage capital
        - Reporting quality and accounting policy risk
        - Unresolved
      - - Bear trigger
        - Safety event, material customer loss, down round, or inability to fund fleet obligations
        - Pause or reject investment
        - Liquidity and reputation damage
        - Unresolved
    notes: >-
      These are underwriting scenarios, not modeled valuation estimates; no probability percentages or valuation ranges
      are assigned because the source pool lacks SHAREBOT financial inputs.
