  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      A reported $1 billion private mark passes through commercialization, operating-economics, disclosure, and downside
      gates before supporting an investment.
    data:
      nodes:
        - id: market
          label: Regional robotics growth
          detail: Market Research Future projects 12.8% CAGR for Asia-Pacific robotics from 2025 to 2035.
        - id: wedge
          label: Rental adoption wedge
          detail: Chinese reporting describes short-duration robot use and service-intensive fulfillment.
        - id: proof
          label: Company proof required
          detail: Need utilization, renewal, realized pricing, service cost, and cash-flow evidence.
        - id: price
          label: Entry price discipline
          detail: Test the reported $1B mark against legal-entity identity, cap table, preferences, and dilution terms.
        - id: downside
          label: Downside triggers
          detail: >-
            Price compression, high-cost bottlenecks, downtime, safety/compliance failure, customer loss, or financing
            stress.
        - id: decision
          label: Research-more
          detail: Treat the reported mark as stretched until company-specific evidence supports it.
      edges:
        - from: market
          to: wedge
        - from: wedge
          to: proof
        - from: proof
          to: price
        - from: price
          to: downside
        - from: downside
          to: decision
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV010
      - CV012
      - CV016
