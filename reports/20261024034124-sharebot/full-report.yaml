      - number: '1.2'
        title: Financing, valuation, and disclosure
        blocks:
          - type: paragraph
            body: >-
              A RobotToday briefing, explicitly crediting an original PanDaily report, says SHAREBOT completed Series A
              and A+ rounds, raised hundreds of millions of RMB, and was valued at 7 billion RMB. Crunchbase separately
              lists Botshare, described as a robot leasing and rental platform based in Pudong, as a new unicorn valued
              at $1 billion; the retained text does not independently prove that Botshare and SHAREBOT are the same
              legal entity, so the linkage remains a diligence question rather than a consolidated metric. The public
              record retained here does not disclose audited revenue, cash burn, runway, gross margin, total raised, or
              a verified employee count. These gaps materially limit confidence in valuation and financing conclusions.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
