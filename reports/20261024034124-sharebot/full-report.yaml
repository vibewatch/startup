  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is robot access delivered as a service: customers rent or subscribe to humanoid,
              service, and other robots for defined deployments, with the provider coordinating availability, delivery,
              setup, maintenance, and recovery. This boundary includes event, hospitality, retail, healthcare,
              logistics, property, and emerging industrial use cases when the buyer pays for access or an operated
              outcome rather than purchasing the asset outright. It excludes robot manufacturing revenue, one-time
              equipment sales, general industrial automation capex, and financing that does not include operating
              service. The boundary matters because broad robotics statistics describe hardware deployment and
              technology investment, while a leasing platform monetizes utilization, service density, and workflow
              reliability. The evidence indicates a demand bridge from demonstrations and short events toward recurring
              commercial operations, but does not establish SHAREBOT's recurring revenue, utilization, or retention.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: Multiple sizing lenses, not a single TAM
        blocks:
          - type: paragraph
            body: >-
              Available sizing is directional and uses different populations, geographies, and definitions. Market
              Research Future estimates the Asia-Pacific robotics market at USD 37.53 billion in 2024 and USD 42.33
              billion in 2025, with a projected 12.8% CAGR through 2035; that is a broad robotics market, not RaaS
              revenue. IFR reports that China had an operational stock of around two million industrial robots and
              represented 54% of annual global installations in the World Robotics 2025 period. Statista's account of
              World Robotics 2026 reports 354,000 installations in China during 2025, equal to 59% of global
              installations. These lenses support a large underlying installed-base and adoption opportunity, but they
              cannot be arithmetically converted into SHAREBOT's SAM or SOM without rental penetration, service pricing,
              utilization, geography, and asset-mix assumptions. The most defensible current sizing conclusion is an
              evidence-constrained opportunity with a broad robotics ceiling and an unquantified serviceable slice.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM017
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies event, retail, hospitality, property, healthcare, logistics, and
              light-industrial settings, but it does not name the contracting party or budget owner for SHAREBOT
              deployments. Sohu reports that short activity duration can make rental more attractive than purchasing,
              while also describing delivery, setup, repair, insurance, recovery, and cross-city dispatch as part of the
              operating burden. China policy and manufacturing scale are tailwinds: IFR says robotics is central to the
              2026–2030 industrial strategy, while Global Times reports planned deployments and commercialization
              efforts. Constraints are equally material: IFR says humanoid capabilities in real production remain
              limited to demonstrators or pilots and that industrial robots are generally faster and more reliable for
              specialized tasks. Falling daily rental prices reported by Sohu increase trial affordability but compress
              platform spread, making service execution and asset utilization central to valuation. Specific buyer and
              payer roles in the table are therefore marked as inferred or undisclosed rather than presented as observed
              facts.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: What must be proven before sizing can support valuation
        blocks:
          - type: paragraph
            body: >-
              The evidence supports market pull, but not a company-specific adoption or valuation conclusion. The next
              diligence pass should reconcile SHAREBOT's claimed fleet availability, city coverage, fulfillment
              standard, and funding profile with signed customer contracts, repeat-booking cohorts, utilization by robot
              type, realized price per deployed day, repair and logistics cost, insurance losses, and contribution
              margin. It should also separate event rentals from recurring site operations and test whether each segment
              has a clear budget owner. Public market forecasts should be retained as context rather than treated as
              company revenue proxies. A defensible SOM requires a stated service geography, eligible fleet capacity,
              achievable utilization, price realization, and a penetration assumption supported by customer evidence;
              none of those company-specific inputs is sufficiently public in this pool.
            claimRefs:
              - CM015
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is broad, but the monetizable wedge is operational
            body: >-
              China's robotics deployment scale and policy support expand the possible customer base, while rental
              economics depend on utilization, fulfillment, maintenance, and repeat workflows rather than hardware
              volume alone.
            calloutType: insight
            claimRefs:
              - CM006
              - CM010
              - CM014
          - type: callout
            title: Do not underwrite a broad robotics forecast as SHAREBOT TAM
            body: >-
              The retained forecasts cover broad robotics categories and installed assets; they do not disclose rental
              penetration, service pricing, utilization, or SHAREBOT's share.
            calloutType: risk
            claimRefs:
              - CM005
              - CM009
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct alternatives
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT's direct competitive set is a platform layer that aggregates robot manufacturers, service
              providers, and customer demand. SHAREBOT says it has moved from display, entertainment, events, and
              marketing toward industrial manufacturing, campus operations, warehouse logistics, and commercial
              services, and reports a fleet assembled from multiple brands. Preqin describes the same model as robot
              equipment leasing, service coordination, and digital platform usage for B2B and B2C contracts. That
              creates a direct comparison with Qingtian Rent, Wanjiyi Rental, and JD.com's self-operated rental service,
              not only with robot OEMs. Yicai attributed Qingtian Rent to AgiBot, while Pandaily identified SHAREBOT
              with the same name. The platform was reported as operating in 50 cities with more than 600 service
              providers and over 1,000 robots, while SHAREBOT's reporting cites deployment in more than 50 cities and
              over 1 million cumulative operating hours. These figures are issuer- or media-reported and are not a
              like-for-like measure of active utilization.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.2'
        title: Buyer choice, capability, and distribution
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the same job through several routes: a multi-brand rental marketplace, a manufacturer-led
              or OEM-linked platform, a large commerce channel, or direct purchase and internal operation. SHAREBOT's
              cited capabilities include partner SaaS, a global app, intelligent task dispatch, a skills store, robot
              selection, customized scenario solutions, scheduling, and maintenance support. Wanjiyi presents a similar
              ecosystem proposition, combining AI matching, standardized operation and maintenance, and an alliance of
              manufacturers, solution providers, finance, insurance, parks, and end users. JD.com has distribution power
              and a lower-friction rental offer through JD MALL, while Qingtian Rent emphasizes scenario packages and an
              expanding provider network. The evidence does not disclose comparable contract terms, uptime, take rates,
              renewal, or service-level performance, so the matrix marks those cells unknown rather than inferring a
              winner.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
      - number: '3.3'
        title: Pricing pressure and moat durability
        blocks:
          - type: paragraph
            body: >-
              Price is a visible competitive pressure. Independent coverage reports that robot rental prices fell from
              roughly CNY10,000 per day to just over CNY100 for some offerings, while another report gives mainstream
              rates of roughly CNY3,000-CNY5,000 and records a Qingtian Rent package as high as CNY99,800 per day. These
              are different models, scenarios, and periods, so they should not be treated as one price curve. The same
              Yicai report identifies unstable pricing, seasonal demand, and incompatible interfaces as sector
              challenges. SHAREBOT's multi-brand scheduling and service network could reduce customer search and
              coordination costs, but those advantages may be copied by commerce platforms, OEMs, and ecosystem
              alliances. The strongest adverse conclusion is therefore not that SHAREBOT lacks a product; it is that
              commoditization and channel disintermediation could limit pricing power before switching costs and repeat
              utilization are demonstrated.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-brand orchestration is the clearest differentiator
            body: >-
              SHAREBOT's reported combination of multi-brand fleet access, dispatch, partner SaaS, and scenario delivery
              is more defensible than a single robot model, but the evidence does not yet establish exclusive supply or
              repeat economics.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Channel owners can move upstream
            body: >-
              JD.com already combines commerce distribution, offline experience centers, and self-operated rentals,
              while OEM-linked platforms are expanding; this can compress the value of an independent rental
              intermediary.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP015
          - type: callout
            title: Underwrite utilization before platform scale
            body: >-
              The next diligence step is contract-level evidence on repeat bookings, utilization, gross contribution
              after operators and maintenance, supplier exclusivity, and customer switching behavior.
            calloutType: recommendation
            claimRefs:
              - CP004
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT's public model is a multi-sided robot-rental and service platform rather than a disclosed
              subscription business. The platform connects robot manufacturers, service partners, content or solution
              providers, and customers, with booking, dispatch, delivery, and on-site support forming the commercial
              workflow. Public reporting places early demand in events, exhibitions, retail, tourism, and other
              short-duration deployments, while later financing communications emphasize industrial manufacturing, park
              operations, warehousing, logistics, and commercial services. This is a plausible path from one-off rentals
              toward recurring operational contracts, but the available sources do not disclose revenue by stream,
              contract duration, renewal, take rate, or realized gross margin. List or quoted daily prices should
              therefore be treated as market observations, not SHAREBOT revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
      - number: '4.2'
        title: Unit economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The economics appear operationally intensive. A robot deployment may require logistics, configuration,
              choreography or task preparation, technical support, maintenance, insurance, and recovery after damage or
              downtime. Public reporting describes a market in which daily rental prices have fallen sharply from
              earlier peaks, including low-priced basic robots and materially higher prices for advanced models or
              technician-supported packages. Falling prices can widen trial access, but they also compress the revenue
              available to cover asset depreciation, idle time, repairs, field labor, and partner economics. No source
              in this assigned pool provides SHAREBOT's CAC, payback, contribution margin, utilization, service cost per
              order, churn, or customer concentration. Those missing fields prevent a conventional SaaS-style
              underwriting case.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Public financing coverage indicates substantial investor support and a stated use of proceeds: building
              the RaaS system, expanding into industrial and other real-world scenarios, and improving standardized
              fulfillment, asset, dispatch, and supply-chain capabilities. That capital is not equivalent to cash
              available today, and the sources do not disclose cash on hand, burn, runway, debt, capex commitments,
              working capital, or the timing of the next financing trigger. The operating transition itself may require
              more field infrastructure and service capacity before higher-frequency contracts are proven. The financial
              verdict is therefore conditional: financing access appears supportive, but revenue quality, margin path,
              and capital sufficiency remain unverified until management supplies cohort-level operating and cash data.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting blocker
            body: >-
              The assigned public evidence does not establish audited revenue, gross margin, cash balance, burn, runway,
              debt obligations, or realized unit economics.
            calloutType: risk
            claimRefs:
              - CI008
              - CI012
              - CI013
          - type: callout
            title: Financial inflection point
            body: >-
              Moving from event-oriented rentals toward repeatable industrial and operational delivery is the key test
              of whether SHAREBOT can convert hardware access into durable service revenue.
            calloutType: insight
            claimRefs:
              - CI003
              - CI009
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT's disclosed product is a robot-leasing service rather than a single robot model. Public
              descriptions place it between hardware suppliers and customers that need temporary or recurring robot
              deployments for events, retail, service operations, education, tourism, and light industry. The platform
              manages more than 4,000 robots across more than 100 cities according to a company-data report, while an
              earlier launch account described a smaller fleet and provider network; these are time- and scope-dependent
              disclosures rather than a reconciled installed-base series. The operating workflow appears to include
              selection, delivery, local operation or training, maintenance, and asset disposition. That workflow can
              lower upfront acquisition barriers, but the public record does not establish utilization, uptime, repeat
              deployment, or customer-level outcomes. The product therefore has a credible access proposition, with
              execution quality dependent on standardization across suppliers and local service providers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE007
              - CE010
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an operating architecture with four practical layers: a hardware and asset layer, a
              platform and transaction layer, a local deployment and after-sales layer, and a partner ecosystem layer.
              SHAREBOT says it intends to connect leasing, deployment, maintenance, upgrades, secondary trading, and
              cross-region scheduling, while a reported JD.com relationship for the similarly described RoboNow platform
              illustrates the kinds of logistics, maintenance, insurance, recycling, and data-collection capabilities
              required by this model. These descriptions are ecosystem claims, not proof that every capability is
              already owned or integrated by SHAREBOT. The company's stated expansion to 13 countries and partnerships
              for mobile retail and sale-plus-rental products indicate roadmap breadth, but no public API, architecture
              diagram, service-level agreement, failure statistics, or deployment acceptance criteria was found in the
              assigned evidence. Maturity is therefore strongest at the marketplace and orchestration concept level and
              unproven at technical-system level.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE008
              - CE011
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE013
      - number: '5.3'
        title: Differentiation and dependencies
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT's potential differentiation is operational rather than a demonstrated proprietary robot
              breakthrough. The reported model emphasizes a standardized delivery network, geographic coverage,
              scenario-specific solutions, and partner coordination. Partnerships with Shanpu and Digit Robotics are
              described as extending mobile retail and sale-plus-rental offerings, with Digit responsible for research
              and production while SHAREBOT contributes platform, channels, and venue resources. This division suggests
              a capital-light ecosystem position, but it also creates dependence on supplier quality, partner economics,
              local operators, logistics, and the availability of suitable robots. China's 2026 national policy
              environment is pushing real-scene validation, data governance, reliability, safety functions, and
              lifecycle controls for embodied robots. That raises the bar for measurable deployment evidence: marketing
              claims about access or coverage should not be treated as evidence of safety certification, algorithmic
              advantage, or durable intellectual property.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not provide SHAREBOT-specific security documentation, privacy controls, incident
              history, insurance terms, safety certification, or quality-control records. Government guidance for
              embodied-robot deployments calls for real-scene testing, success-rate and efficiency evaluation, safety
              and reliability assessment, data-security and privacy safeguards, collision detection, force limits,
              emergency braking, and black-box capabilities. Those requirements are relevant diligence benchmarks, not
              evidence that SHAREBOT has implemented them. The key product risk is a gap between a broad network promise
              and the evidence needed to show repeatable, safe, and economically viable deployments across heterogeneous
              robot types and countries. Before underwriting product maturity, an investor should obtain the asset
              inventory by model, acceptance and uptime records, incident and insurance logs, partner service-level
              terms, data-flow and access-control diagrams, and evidence that customer deployments meet applicable local
              requirements.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Access-oriented product thesis
            body: >-
              SHAREBOT's strongest product evidence is the attempt to make heterogeneous robots usable through leasing,
              delivery, local service, and scenario packaging rather than requiring customers to purchase and integrate
              every asset themselves.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Technical maturity remains under-disclosed
            body: >-
              Public sources describe network scale and ecosystem intent, but do not establish SHAREBOT-specific uptime,
              reliability, security, safety certification, integration depth, or customer outcomes.
            calloutType: risk
            claimRefs:
              - CE008
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and demand surfaces
        blocks:
          - type: paragraph
            body: >-
              Publicly described demand is concentrated in business-to-business and event-led use cases rather than a
              disclosed recurring enterprise subscription base. People’s Daily reports that more than 54 percent of
              Botshare orders during the Spring Festival were for New Year greetings, temple fairs, and shopping malls,
              while marriage proposals and parent-child activities were rising. Pandaily similarly describes demand from
              festive events, corporate annual meetings, and cultural-tourism activities, with orders increasing
              approximately 30 percent week over week during February 1–7, 2026. The AWE account adds exhibitions,
              malls, tourism, brand marketing, celebrations, and education as target contexts, and says customers asked
              how robots could support store traffic, event dissemination, brand interaction, and reception. These
              signals identify a broad buyer set—brands, event organizers, malls, tourism operators, and education
              providers—but do not disclose payer mix, contract value, or repeat behavior.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and named-use proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is transactional or operational rather than retention-based.
              People’s Daily cites more than 1,000 Botshare orders received by February 12 for the February 15–23
              holiday period, with an expectation of more than 5,000 by the holiday’s end; Pandaily reports that
              seasonal bookings were essentially sold out a month in advance and that popular models were scheduled
              through mid-March. The AWE article describes jointly deployed robots listed in the platform mini-program
              and customer inquiries at the exhibition. These records support demand, availability pressure, and
              platform-mediated deployment, but they do not identify customer names, production-versus-pilot status,
              outcomes, renewal, or unit economics.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
      - number: '6.3'
        title: Durability, expansion, and concentration unknowns
        blocks:
          - type: paragraph
            body: >-
              Public reporting does not provide SHAREBOT’s churn, renewal, GRR, NRR, cohort retention, contract
              duration, or top-customer revenue share. The available evidence instead shows a seasonal demand pattern
              and an operating model that must coordinate equipment, local service, on-site operators, safety personnel,
              and customization. IT Home reports a network of more than 600 service providers across 50 core cities and
              a price range from 200 yuan to more than 10,000 yuan, while the AWE account describes selection, solution
              design, deployment, content planning, and operational support. This can lower experimentation friction for
              customers, but it also leaves open whether activity converts into durable recurring usage and whether
              platform economics depend on a small number of seasonal channels or partners.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is visible; durability is not
            body: >-
              Booking volume, holiday utilization, and customer inquiries indicate real market pull, but the retained
              public sources do not disclose repeat purchase, renewal, or concentration metrics.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT operates in a market where robots move through public, high-traffic, and varied environments
              rather than remaining in controlled facilities. A Chinese financial publication describes rental as
              lowering adoption barriers while increasing exposure to equipment damage, third-party liability, and data
              security. It also reports that robot leasing combines equipment lending with on-site technical operations
              and human interaction, making responsibility span the owner, operator, software, and venue. This is a
              structurally higher-control burden than a simple marketplace transaction. Public reporting further
              indicates that demand is expanding, but the evidence does not disclose SHAREBOT-specific incident
              frequency, loss ratios, insurance exclusions, uptime, or customer concentration. The risk conclusion is
              therefore based on operating-model exposure and sector evidence, not a claim that SHAREBOT has suffered an
              unreported incident.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              The most material legal and regulatory uncertainty concerns safety, responsibility, and data governance
              across jurisdictions and use cases. A Yicai report says embodied-intelligence products lack unified
              international or industry standards and identifies compatibility, security, data compliance, and
              cross-border data-flow risks. The same report records that insurers are adding third-party liability and
              cybersecurity coverage, which is a mitigation signal but not proof that a platform's controls or policy
              limits are adequate. The available evidence does not confirm SHAREBOT's licenses, privacy notices,
              customer consent flows, incident response plan, product-safety certifications, or contract allocation of
              liability. These gaps should be treated as diligence blockers before assuming that insurance transfers
              legal or reputational exposure.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Reliability is a core economic risk because a rental asset that is late, damaged, or unavailable can lose
              the event and require replacement service. Shanghai government reporting describes engineers checking
              state, adjusting parameters, confirming interaction logic, monitoring operation, and responding to
              unexpected interaction in crowded holiday settings. It also reports that robots may run for more than
              eight hours in dense public environments. Separate reporting describes repair, battery, testing,
              logistics, insurance, and recovery as interlocking capabilities, and notes that rental prices have fallen
              while service quality becomes a competitive threshold. SHAREBOT's public evidence does not establish its
              own service levels, spare-parts availability, partner exclusivity, or economics after field support. The
              operating model therefore has both uptime risk and dependency risk even when demand is present.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Available mitigations are developing at the ecosystem level: insurance products combine body-loss and
              third-party liability, repair networks are expanding, and platforms are described as using operations data
              to improve dispatch and risk control. These measures reduce exposure only if SHAREBOT can demonstrate
              coverage scope, claims handling, preventive maintenance, event-site controls, and auditable data
              permissions. The investment thesis should break if a material injury or property loss is uninsured or
              cannot be assigned promptly; if repeat failures cause cancellations or refunds; if insurance exclusions
              leave the company bearing replacement cost; if supplier or repair dependencies interrupt peak-season
              availability; or if regulators or customers restrict data collection. The next diligence step is a
              loss-run and incident ledger reconciled to contracts, insurance schedules, uptime records, and repair
              tickets.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              The combination of public human interaction, asset damage, and incomplete disclosure makes liability
              transfer and operational control the principal diligence bottleneck.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: Kill-criterion package
            body: >-
              Do not underwrite scale until SHAREBOT provides reconciled incident, insurance, uptime, repair, supplier,
              and data-governance records for the target deployment base.
            calloutType: recommendation
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              SHAREBOT should remain in research-more status. Crunchbase's May 2026 unicorn review reports that a
              less-than-one-year-old Pudong robot-leasing platform called Botshare raised a Series A and was valued at
              $1 billion, but the assigned pool does not establish that this English label maps to SHAREBOT's legal
              entity or that the mark remains current. The report also supplies no revenue run-rate, gross margin,
              utilization, cash burn, capitalization, or preference data. Entry discipline therefore matters more than
              the headline valuation: an investor should require legal-entity confirmation, financing documents, audited
              or management accounts, cohort utilization and renewal data, and a contribution-margin bridge after
              logistics, service, insurance, downtime, and depreciation. Conditional on entity confirmation, the $1
              billion reference looks stretched rather than supported by public fundamentals; this is not evidence that
              demand is absent.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that robotics adoption is expanding in Asia-Pacific, Chinese policy and industrial
              scale can create a large operating environment, and rental can reduce the upfront commitment for customers
              that need robots for short events or pilots. Market Research Future projects the Asia-Pacific robotics
              market from $42.33 billion in 2025 to $141.21 billion in 2035 at a 12.8% CAGR, while IFR and Chinese
              government reporting put China's 2024 industrial-robot stock at about or above two million units. The
              anti-thesis is that these are market-level indicators, not SHAREBOT cash flows. Bain and IFR describe
              humanoid deployments as largely pilot-stage or demonstration-led; Sohu describes falling daily rental
              prices and the operational burden of dispatch, tuning, repair, insurance, and recovery. CCTV's 2026
              standards coverage also reports high costs, fragmented scenarios, imported-component dependence, and
              model-generalization constraints. The thesis changes only when SHAREBOT demonstrates durable utilization
              and positive contribution economics after those costs.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Scenarios, comparables, and diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be expressed as underwriting gates rather than fabricated valuation points. In
              the bull case, repeat customers, multi-city service density, high utilization, and paid data or workflow
              services could support a premium to a simple equipment-rental multiple. In the base case, event-led demand
              grows but price competition and service costs keep margins modest, supporting a disciplined entry only
              after verified unit economics. In the bear case, falling day rates, hardware downtime, safety or
              compliance failures, and working-capital needs force a down-round or additional dilution. Comparable marks
              show the danger of false precision: Crunchbase reports Botshare at $1 billion after a Series A, while
              CompaniesMarketCap reported Serve Robotics at $0.24 billion on October 23, 2026 and down 68.08% during
              2026. Richtech's indexed 10-K and 10-Q cadence also illustrates the disclosure gap between public
              comparables and this private-company evidence pool. None is an interchangeable benchmark, so SHAREBOT
              needs contract, asset, financing, and exit data before a valuation range or target return can be assigned.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at the reported $1 billion mark
            body: >-
              The assigned evidence supports a real market opportunity but does not establish the legal-entity match or
              fundamentals behind the reported Botshare valuation. Treat the mark as stretched and advance only after
              financing, unit-economics, and dilution evidence is verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
          - type: callout
            title: Commercialization and financing risk
            body: >-
              Falling rental prices, pilot-stage robotics capability, service intensity, and undisclosed cash
              requirements can convert market growth into weak investor returns.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
