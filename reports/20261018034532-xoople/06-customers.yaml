  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Customer count, NRR, GRR, churn, renewal rates, contract lengths, and cohort performance by segment.
      whyItMatters: Without retention and renewal evidence, the durability of Xoople's customer base cannot be underwritten.
      diligencePath: Request cohort and renewal metrics, customer count history, and top-10 account concentration from management or customer references.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table
      missingEvidence: A disclosed roster of named production customers with deployment status, outcomes, and reference quality.
      whyItMatters: The public named proof set currently shows channels and infrastructure partners rather than end-customer deployment evidence.
      diligencePath: Ask for at least three reference customers, deployment dates, production status, and quantified outcomes.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Revenue split by channel, direct versus indirect bookings, and top-customer exposure.
      whyItMatters: The go-to-market narrative concentrates around a few counterparties, so concentration risk could be material even if gross customer count is growing.
      diligencePath: Request channel mix, reseller economics, top-customer share of ARR, and any minimum-commitment terms with ecosystem partners.
      relatedQuestionRefs: [QU005]
