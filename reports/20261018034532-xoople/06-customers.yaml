schemaVersion: report-v2
artifact: customers
slug: xoople
runDate: 2026-10-18
company:
  name: Xoople
chapter:
  number: 6
  title: Customers
  summary: >-
    Xoople's customer story is currently channel-first rather than reference-led:
    official and independent sources consistently frame the product for enterprise
    and government workflows in agriculture, infrastructure, finance, logistics,
    insurance, and resilience, but the public commercial proof is still early
    access plus named platform and infrastructure partners rather than disclosed
    production end customers. The strongest adoption signals are distribution and
    workflow embedding through Microsoft, Esri, Databricks, and KSAT, while
    customer durability remains the main unresolved diligence gap because the
    retained evidence does not disclose customer counts, renewals, or
    concentration metrics.
sections:
  - id: segment-footprint
    title: Segment footprint is broad, but the mix is still narrative rather than quantified
    body: >-
      The retained evidence points to a consistent buyer pattern: Xoople is
      positioning EarthAI for enterprise and public-sector users that already run
      complex operational workflows and need Earth data delivered inside existing
      software stacks. Official and third-party descriptions repeatedly cite
      agriculture, infrastructure, logistics, finance, insurance, and government
      use cases rather than consumer or SMB adoption. That is directionally
      credible because these categories match where Earth-observation buyers value
      risk reduction, monitoring, and decision support. What the sources do not
      provide is a quantified customer mix by geography, vertical, revenue band,
      or channel, so today's segmentation view should be treated as market intent
      and platform fit rather than demonstrated account concentration or spend by
      segment.
    claimRefs: [CU001, CU002, CU008, CU014]
    tableRefs: [TU001]
  - id: commercial-proof
    title: Commercial proof is emerging through preview access and channel embeds
    body: >-
      Public commercialization evidence has improved, but it still skews toward
      enablement rather than customer-reference proof. Xoople says its Early
      Access Program is the first step in commercializing the offering under
      private preview, while independent coverage says the platform is built on
      Azure, integrated with Microsoft's Planetary Computer Pro, and distributed
      through Microsoft and Esri. The October 2026 KSAT announcement is the
      clearest operating proof that Xoople is wiring the delivery stack for
      enterprise and government workflows that require low-latency, reliable data
      flows. Together, those signals indicate real ecosystem traction and a
      sensible land-through-channel motion, but they are not equivalent to a
      disclosed roster of production end customers or outcome-backed renewals.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU009, CU010]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-risks
    title: Durability remains unproven and partner concentration is the key customer risk
    body: >-
      The main underwriting issue is not whether Xoople can describe compelling
      sectors; it is whether those sectors convert into repeatable contracts and
      renewals. New Space Economy's sector review is explicit that Earth
      observation still struggles with pilots, proofs of concept, and renewal
      economics, and AInvest frames Xoople's development-to-commercialization
      transition around customer adoption and pricing power. That matters here
      because the public evidence clusters around a small group of strategic
      counterparties - Microsoft, Esri, Databricks, and KSAT - without disclosing
      customer counts, churn, contract lengths, or top-account exposure.
      Xoople's distribution-first model could compound quickly if those channels
      convert, but until the company or customers publish production deployments,
      the durability case stays unverified.
    claimRefs: [CU009, CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Core use case
      - Commercial proof
      - Strategic value
      - Gap
    rows:
      - - Government and public agencies
        - Government departments, emergency planners, defense or regulatory users
        - Monitoring, emergency planning, environmental enforcement, public authority workflows
        - Third-party and partner sources say Xoople is embedding into government workflows
        - Large budgets and infrastructure-style use cases fit Xoople's systems-of-record thesis
        - No named public-agency customer or contract value disclosed
      - - Agriculture and climate resilience
        - Agribusiness operators, farm services, sustainability teams
        - Crop stress, soil and water monitoring, carbon-market participation
        - Independent coverage names agriculture as a core use case
        - Frequent monitoring could create repeat usage if outcomes are proven
        - No disclosed customer count, acreage coverage, or renewal data
      - - Infrastructure and industrial operations
        - Infrastructure operators, utilities, logistics and asset owners
        - Asset monitoring, degradation detection, resilience planning
        - Official and third-party descriptions repeatedly mention infrastructure
        - High-value workflows reward latency, reliability, and integration
        - No disclosed logo-to-contract conversion or top-account concentration
      - - Financial services and insurance
        - Insurers, finance teams, risk managers
        - Climate risk pricing, disaster verification, predictive risk signals
        - Official and third-party descriptions cite finance and insurance use cases
        - Could support premium pricing if outputs improve underwriting decisions
        - No public proof yet on underwriting adoption or decision impact
    notes: >-
      Segment definitions come from official and third-party descriptions of
      stated use cases; no retained source discloses revenue mix, account counts,
      or segment-level contract values, so the table should be read as positioning
      rather than measured customer composition.
    claimRefs: [CU001, CU002, CU008, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Commercial launch stage
        - Early Access Program under private preview; described as first commercialization step
        - "2025-12-03"
        - Xoople headquarters launch release
        - Medium
        - Shows product moved from stealth/platform building into controlled customer onboarding
        - No participant count, conversion rate, or paid-vs-free disclosure
      - - Channel distribution footprint
        - Azure / Planetary Computer Pro integration plus Microsoft and Esri distribution; Databricks named as ecosystem partner
        - 2025-12-03 to 2026-04-06
        - Creative Collaboration and Xoople releases
        - Medium
        - Indicates Xoople is trying to enter existing enterprise GIS and cloud workflows before constellation deployment
        - No disclosed channel-sourced pipeline, revenue share, or active-account count
      - - Operational delivery build-out
        - KSATlite selected; Xoople and KSAT are adding sites and faster data-to-cloud endpoints
        - "2026-10-05"
        - KSAT / Xoople partnership release
        - Medium
        - Strengthens the service layer needed for enterprise-grade latency and reliability
        - No disclosed launch cadence, customer SLA, or deployment throughput
    notes: >-
      These are commercialization milestones, not cohort metrics. The retained
      evidence supports movement from preview to channel embedding and delivery
      infrastructure, but it does not provide customer-count, utilization, or
      renewal denominators.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / named counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Microsoft
        - Cloud and distribution channel
        - Azure hosting plus Planetary Computer Pro integration for enterprise geospatial workflows
        - Commercial platform integration disclosed; end-customer production usage not disclosed
        - Gives Xoople access to an existing enterprise cloud and geospatial distribution surface
        - Microsoft is a channel and platform partner, not disclosed as a paying end customer
      - - Esri
        - GIS distribution and strategic ecosystem partner
        - Distribution into GIS workflows; also reported as a prior shareholder through Esri International
        - Commercial ecosystem relationship disclosed; end-customer production usage not disclosed
        - Improves reach into established geospatial buying environments
        - Evidence supports channel alignment, not customer spend, renewal, or deployment scale
      - - KSAT
        - Infrastructure partner for data delivery
        - KSATlite ground-segment service selected to support Xoople constellation operations
        - Partnership announced for deployment and operation support
        - Adds operational capability for faster data delivery and automation
        - This is supplier/infrastructure proof rather than proof of end-customer demand
    notes: >-
      The named public proof set is partial and counterparties-led: the retained
      sources disclose platform, channel, and infrastructure partners, but not a
      public list of production end customers or outcome-backed reference accounts.
    enumerationScope:
      coverage: partial
      basis: >-
        Compiled from all successful assigned-pool sources retained in this
        chapter; these sources disclose named commercial counterparties but do not
        present an exhaustive customer roster or reference list.
    claimRefs: [CU004, CU006, CU009, CU010]
