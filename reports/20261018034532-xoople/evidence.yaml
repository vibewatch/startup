evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Exact Series B post-money valuation, ownership dilution, liquidation preferences, debt or venture-credit terms,
      and any secondary component.
    whyItMatters: Stage alone is insufficient for underwriting entry price, downside protection, and control dynamics.
    diligencePath: Request the signed Series B term sheet, post-close cap table, and any side-letter summary from lead investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Named customers, paid-vs-preview conversion, ARR or revenue run-rate, gross margin, and cohort retention after the
      planned commercial launch window.
    whyItMatters: >-
      The next diligence hinge is whether Xoople's commercialization claims have translated into durable recurring
      demand.
    diligencePath: >-
      Request a commercialization KPI pack covering booked ARR, pipeline conversion, customer logos, contract sizes, and
      renewal behavior.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board roster, independent directors, committee structure, and governance cadence after the Series B.
    whyItMatters: >-
      A founder-led, capital-intensive company needs visible oversight to assess key-person concentration and financing
      discipline.
    diligencePath: Request the current board deck cover, committee list, and director bios or governance policies.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: market-gap
    missingEvidence: Xoople-specific SAM/SOM, paying-customer counts, pricing structure, and renewal data by segment.
    whyItMatters: >-
      Without a bottoms-up commercial bridge, valuation must lean on broad category analogies rather than demonstrated
      capture.
    diligencePath: Request pipeline conversion, current contracts, pricing ladders, and cohort retention by early-access segment.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: customer-adoption
    missingEvidence: >-
      Independent customer case studies or procurement records that show repeated paid usage after pilot or early-access
      deployment.
    whyItMatters: >-
      The current public record supports market need and workflow logic more clearly than it supports repeatable
      commercial adoption.
    diligencePath: Collect named customer references, procurement notices, ROI cases, and renewal evidence from early deployments.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-visibility
    missingEvidence: >-
      Public or customer-confirmed pricing, contract minimums, and realized deployment economics for Xoople and the
      closest incumbents.
    whyItMatters: >-
      Without pricing evidence, this chapter can compare packaging posture but cannot underwrite whether Xoople's
      differentiation supports a premium or faster payback.
    diligencePath: >-
      Request current price cards, sample contracts, and at least two customer references that include deployment scope
      and commercial terms.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: proprietary-supply
    missingEvidence: >-
      A dated constellation roadmap with satellite count, first-light timing, launch cadence, and proof that the planned
      sensor quality exceeds incumbent alternatives.
    whyItMatters: >-
      Moat durability depends heavily on whether Xoople can convert a distribution-first story into a live proprietary
      data advantage.
    diligencePath: >-
      Obtain product-roadmap materials, supplier milestones, and technical benchmarks for the planned L3Harris-enabled
      constellation.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named customer deployments showing recurring production usage, retention, and buyer willingness to standardize on
      Xoople instead of incumbent EO vendors or internal build.
    whyItMatters: >-
      Workflow-embedding claims matter more if buyers have already adopted Xoople as an operational system of record
      rather than as a pilot or private preview.
    diligencePath: Request customer case studies, renewal data, and implementation evidence from Microsoft/Esri-linked deployments.
    relatedQuestionRefs:
      - QP002
      - QP003
  - type: missing-source
    severity: material
    topic: pricing-disclosure
    missingEvidence: Public list pricing, realized pricing, discount policy, and contract templates by product and channel.
    whyItMatters: Pricing opacity blocks peer comparison and prevents conversion of workflow interest into a credible revenue model.
    diligencePath: Request current price books, three anonymized signed contracts, and channel-partner commercial terms.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: operating-metrics-disclosure
    missingEvidence: ARR or revenue run rate, gross margin, CAC, payback, burn, cash balance, and runway.
    whyItMatters: >-
      These are the minimum metrics needed to judge whether commercialization can finance the underlying infrastructure
      build.
    diligencePath: Obtain monthly management accounts, board pack KPIs, and a twelve-month operating model with actual versus plan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-disclosure
    missingEvidence: Customer concentration, renewal cohorts, contract duration, and channel take rates.
    whyItMatters: Preview users do not prove durable or diversified revenue quality.
    diligencePath: Review top-customer analysis, retention cohorts, pipeline conversion, and partner revenue-share schedules.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: capital-plan
    missingEvidence: >-
      Detailed constellation budget, launch cadence, debt or project-finance obligations, and milestone-linked use of
      proceeds.
    whyItMatters: >-
      Total capital raised is not enough to test whether Xoople can reach self-sustaining commercialization before
      another round.
    diligencePath: Request capex schedule, procurement commitments, launch plan, and financing covenant summary.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
