        - Agribusiness operators, sustainability teams, and public/agri programs
        - EY and TNW both use agriculture as a reference wedge
      - - Public-sector and emergency response intelligence
        - Disaster planning, environmental enforcement, sovereign monitoring, and humanitarian response
        - Consumer navigation, general civic IT, and unrelated defense hardware
        - Governments, agencies, and mission-specific response budgets
        - New Space Economy highlights latency, sovereignty, and response as core demand drivers
