        title: 融资基础与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              来源包中最有力、且相互印证的事实是融资阶段和具名投资者群体。Xoople 2026 年 4 月公告经 Vestbee 和 Verdict/GlobalData 联合转载后进一步印证：$130M Series B
