            body: >-
              里程碑记录显示，公司正从隐身基础设施建设转向进入市场准备。Xoople 表示，截至 2025 年 12 月已完成超过 EUR135M 融资，在 Tres Cantos 建成 4,000 sqm 全球总部，启动
