  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方定义
        blocks:
          - type: paragraph
            body: >-
              留存来源把 Xoople 的可服务市场定义为可直接支持决策的地球智能层，而不是通用 AI 软件或无差异卫星硬件。Xoople 自有材料称，EarthAI 能将分散的地球数据转化为高质量、面向 AI
              的数据集，并与基础设施、金融、天气及运营数据一起查询；EY 的合作文章则称，使用场景跨行业，交付格式必须适配企业架构。这一边界意味着 Xoople 争夺的是风险、运营和规划工作流预算，而不是全部地理空间支出或全部
              AI 软件支出。

              买方证据也比“所有人都需要地球数据”更具体。公司及第三方报道反复提到农业、保险、基础设施、交通、政府和应急响应等首批工作流切入口。在这些领域，经济买方未必是实际使用数据的分析师：保险公司关心承保和理赔团队，基础设施运营商关心资产风险负责人，公共机构关心规划和响应预算。关键在于，采用取决于能否嵌入现有运营记录系统，而不是单独卖出一个分析席位。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM011
      - number: '2.2'
        title: 规模测算视角与采用顺风
        blocks:
          - type: paragraph
            body: >-
              公开市场规模对 Xoople 所处类别的描述更偏方向性，而非精确估算。TNW 称，广义地球观测市场 2025 年价值 $7.04 billion，预计 2034 年达到 $14.55 billion；New
              Space Economy 引用 EUSPA 口径，称地球观测收入将从 2024 年的 €3.5 billion 增至 2034 年的 €7.9 billion。AInvest 的口径更宽，预测 2030
              年卫星数据服务市场为 $29.6 billion。这种差异并非噪声，而是源于类别定义、货币和时间跨度不同，因此不能把任何一个数字直接当作 Xoople 的 TAM。

              更持久的看多信号来自结构变化。EY 和 Xoople 都认为，只有当地球数据以面向 AI 的地面实况形式进入企业工作流时，它才真正有用；New Space Economy 则将 2026
              年描述为从影像供给转向可直接支持决策服务的转折点。在这一背景下，Xoople 通过 Microsoft Azure、Microsoft 分发渠道和 Esri
              进行优先分发很关键，因为这能在公司拥有自己的数据供给之前降低工作流采用摩擦。因此，市场问题不是“地理空间数据够不够大”，而是“Xoople
              能否在竞争者和现有厂商之前，把广泛的地球观测需求转化为持续的工作流支出”。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.3'
        title: 约束与未解决的规模缺口
        blocks:
          - type: paragraph
            body: >-
              支持该类别的同一批来源也界定了它的约束。New Space Economy 认为，商业地球观测仍须证明续约收入、互操作性、更低延迟交付和用户采用；Xoople
              自有工程材料强调，客户买的是工作流整合和可信输出，而非原始影像。TNW 进一步指出，Xoople 的星座尚未入轨，因此当前商业产品仍依赖第三方和政府数据源。SpaceNews 另行确认，L3Harris 已同意与
              Xoople 开发卫星星座，说明上游数据战略仍是建设计划，而非已完成的运营资产。这让 Xoople 同时暴露于普通企业软件采用风险和建设差异化上游数据层的资本密集型风险。

              最大的尽调缺口不是广阔市场是否存在，而是 Xoople 能否夺取一块可防守的份额。公开来源没有披露按细分市场划分的 SAM 或 SOM、付费客户数量、Early Access
              转化率、定价基准或按工作流划分的续约行为。在缺少这些自下而上的数据点时，估值只能依靠宽泛的类别类比，以及对 Xoople 分发能力和产品路线图的信心，而不是已证明的商业渗透率。
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争者不只是“其他卫星公司”。独立 EO 市场证据显示，至少有三类成熟竞争者已经服务于相邻买方需求：Planet 和 BlackSky 等横向星座运营商，GHGSat 和 OroraTech
              等更窄的垂直领域专家，以及 Tomorrow.io 和 EarthDaily 等以分析为先、向上游延伸以锁定差异化输入的公司。Xoople 自身定位和第三方分析还增加了第四类替代方案：企业或机构继续在自己的
              GIS、云和数据科学技术栈中拼接分散的公共及商业数据源，而不是购买新平台。因此，Xoople 必须同时击败现有供应商和现状惯性，而不只是面对一组直接同业。
            claimRefs:
              - CP004
              - CP005
              - CP006
