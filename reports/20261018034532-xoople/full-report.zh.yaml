    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据确认，Xoople 于 2026 年 4 月完成 $130 million Series B，报道的累计融资目前约为 $225
              million。这足以让投资人认真看待它作为一家获得融资的欧洲地球智能竞争者，尤其是管理层已经从长期产品开发推进到 Early Access
              和商业化发布叙事。新投资人的问题在于，融资规模不等于价格支撑：审阅来源没有披露投后估值、稀释、清算优先权、ARR 或合同层面的转化数据。在这些基础信息缺失时，稳健做法是把 Xoople
              留在观察名单，而不是仅凭叙事为新一轮融资作投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与可比门槛
        blocks:
          - type: paragraph
            body: >-
              核心论点是连贯的：Xoople 卖的不是原始影像，而是旨在接入企业工作流的面向 AI 地球数据层；如今公司既有融资，也通过 VITO
              合作伙伴关系具备从科学走向商业化的可见桥梁。但反论点同样具体。独立行业证据称，商业地球观测仍面临续约收入考验；公开赢家也必须先展示有意义的规模，市场才会把这种模式视为持久。Xoople
              可能值得战略关注，但尚未发布足以让外部投资人把今天的雄心当作明天现金生成现实的商业证明。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景框架与触发因素
        blocks:
          - type: paragraph
            body: >-
              未来十二至十八个月主要是证明窗口，而不是收获窗口。乐观情景下，Xoople 将试点和私有预览转化为已披露的经常性合同，按计划完成 VITO
              从预览到发布的序列，并证明企业愿意为嵌入日常工作流的高质量地面实况付费。基准情景更慢：客户互动持续、产品栈成熟，但外部投资人仍缺少足以有信心评估高溢价轮次的硬数据。悲观情景很直接：星座资本开支继续上升、里程碑延期，而行业更广泛的续约经济问题比产品故事暗示的更难解决。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              在大额投入资本前，尽调应从“这有意思吗”转向“这能定价吗”。具体要索取当前股权结构表和 term
              sheet、能够显示试点转付费转化的已签客户漏斗、合同规模和续约行为，以及星座资本开支、发射节奏和运营依赖的项目级视图。如果管理层无法展示可信的经常性收入证明，或未来融资需求看起来可能跑赢客户采用，即使底层
              EarthAI 产品仍然出色，投资论点也应失效。在这些问题得到回答前，正确姿态是积极跟踪并严格执行价格纪律，而不是提前乐观。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 保持价格纪律
            body: Xoople 已从有意思的概念跨过门槛，成为可信候选者，但公开记录仍未达到作出有价格依据的投资决策所需的标准。
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
          - type: callout
            title: 隐藏风险是经济性证明，而不是叙事
            body: 最大的未解决问题，是资本密集型星座和数据平台能否在下一轮融资收紧投资人议价能力之前，把试点转化为可续约合同。
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
