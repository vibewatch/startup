    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 试点转化为已披露的经常性合同；VITO 公开预览在 2026 年第四季度落地，首次发射在 2027 年进行；客户愿意为更优的地面真值质量付费。
        - 只有到那时，高溢价的私人增长型定价才可能获得支持，因为证据将开始支撑差异化收入潜力，而不只是战略叙事。
        - 星座执行、发射时间和高溢价定价的采用。
        - 需要看到合同转化和超越当前公开表态的里程碑交付。
      - - 基准
        - 客户合作继续推进，平台实现商业化，但管理层继续对收入、估值和条款细节保持不公开。
        - 继续跟踪仍是合适的做法：故事原则上仍可投资，但实践中尚未能定价。
        - 转化缓慢、单位经济性不透明，以及证据出现前还需要新一轮融资。
        - 与当前公开记录最为吻合。
      - - 悲观
        - 资本开支上升，商业化延期，而更广泛的地球观测市场仍难以把技术能力转化为可续约需求。
        - 下行风险占主导，因为在模式证明能够持续创造现金之前，额外稀释或更艰难的下一轮融资可能已经到来。
        - 执行落差、利润率压缩及续约表现疲弱。
        - 只要里程碑滞后且披露仍然有限，该情景就成立。
    notes: 该情景分析采用定性方式，因为留存的公开证据没有披露当前投后估值、清算优先权或收入基数，无法据此建立可信的数值回报模型。
    claimRefs:
      - CV008
