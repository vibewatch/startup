      - number: '3.3'
        title: 价格可见度、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              留存章节证据中的公开价格透明度很低，因此本章更适合比较封装和销售姿态，而非价目表。Xoople 当前面向商业市场的是企业签约和私有预览，不是自助式价格卡；留存的竞争者证据也没有披露具名 EO
              竞争者清晰的公开价格点。因此，当前切换成本更多来自与 Microsoft、Esri 和 Databricks
              为中心的工作流整合，而非今天已经形成的数据锁定。这在战略上合理，但护城河持久性仍未充分证明。TerraWatch 警告，政府仍主导 EO 需求，可规模化的商业市场尚未验证；AInvest 和 i-SCOOP 都把
              Xoople 的下一阶段描述为相对于已控制实时星座和处理管线的运营商，向硬件迈进的资本密集型过程。
