      - - 投资论点
        - Xoople 有融资支持、面向 AI 的数据逻辑、以工作流为导向的产品定位，以及由 VITO 主导的可见商业化桥梁。
        - 只有在公司开始披露经常性合同赢单，并证明预览客户正在转化为持久的付费需求后，才应上调判断。
      - - 反论点
        - 商业地球观测仍面临续约收入考验，而 Xoople 在外部投资者看不到定价能力或现金创造证明前，就已增加高额卫星资本开支。
        - 如果管理层分享客户群留存、合同金额进展，以及星座建设可信的资本计划，反论点就会减弱。
      - - 可比门槛
        - 行业可比公司意味着，生存能力要靠可重复的收入和积压订单深度挣得，而不是只靠产品愿景。
        - 更强的判断需要能让 Xoople 更接近这一门槛的里程碑证据，而不是重复品类叙事。
