            body: >-
              证据最充分支持的差异化，不是 Xoople 已经拥有最好的实时数据供给，而是公司正试图在自有星座投入运营前，把面向 AI 的地球数据层嵌入以 Microsoft、Esri 和 Databricks
              为中心的工作流。
            calloutType: strength
