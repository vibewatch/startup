      - number: '3.2'
        title: 相对于现有厂商和专业公司的差异化论点
        blocks:
          - type: paragraph
            body: >-
              留存证据支持一个明确的差异化论点：Xoople 试图销售面向 AI 的地球数据层，在自有星座上线前先嵌入现有企业工作流。官方材料强调 EarthAI
              是可查询的数据层，能与基础设施、金融、天气和运营系统结合；i-SCOOP 报道称，EarthAI 已运行在 Microsoft Azure 上，并以 Esri 为分发伙伴。这不同于 TerraWatch
              所描述的旧式 EO 路径：许多运营商先证明能取得影像或进行定向感知，再叠加分析。代价是，现有厂商和专业公司已经掌握经过验证的上游资产或更窄的领域工作流，因此 Xoople 当前的优势是工作流嵌入和 AI
              原生封装，而不是已证明的实时专有采集优越性。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP012
              - CP016
