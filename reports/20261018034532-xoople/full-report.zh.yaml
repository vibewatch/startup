    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营基地与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Xoople 将自己定位为地球数据基础设施公司，而非纯卫星影像供应商。在官网、EarthAI 宣言和融资公告中，公司都把产品描述为物理世界变化的 AI
              就绪“记录系统”，向企业和政府工作流输送结构化、可直接支持决策的地面实况数据。指定来源还一致确认公司成立于 2019 年，并在商业化前经历了漫长的隐身建设期。管理层在 2026 年 4
              月表示，公司计划于第二季度启动商业化，私有预览用户包括政府机构和 Fortune 500 企业；但这些披露仍未确认发布已经完成，也未披露客户名称、经常性收入、部署数量或留存情况。
