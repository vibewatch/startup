  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-terms
      missingEvidence: The current post-money valuation, share price, dilution, liquidation preferences, and any participating-preference structure for the latest round.
      whyItMatters: Entry discipline and downside protection cannot be priced without understanding what security the investor is buying.
      diligencePath: Request the latest term sheet, cap table, and side-letter summary from management or lead counsel.
      relatedQuestionRefs: [QV005, QV008]
    - type: missing-source
      severity: material
      topic: commercial-traction
      missingEvidence: Signed ARR, pilot-to-paid conversion, average contract value, renewal timing, and customer concentration for the first commercialization cohort.
      whyItMatters: Valuation support depends on whether the company can translate technical proof into durable, repeatable demand.
      diligencePath: Request a cohort bridge from private preview to paid production accounts, plus current pipeline and retention reporting.
      relatedQuestionRefs: [QV003, QV004, QV008]
    - type: missing-source
      severity: material
      topic: constellation-capex
      missingEvidence: Satellite count, launch cadence, total program capex, operating cost assumptions, and contingency financing plan for the constellation rollout.
      whyItMatters: Capital intensity is the main bear-case driver and directly affects dilution risk, runway, and required return.
      diligencePath: Review the program budget, launch timetable, manufacturing partners, and board-approved financing plan for the constellation.
      relatedQuestionRefs: [QV004, QV006, QV008]
