      - Current evidence
      - What would change the view
    rows:
      - ["Investment thesis", "Xoople has funding support, an AI-ready data thesis, workflow-oriented product positioning, and a visible VITO-led commercialization bridge.", "Upgrade only if the company starts disclosing recurring contract wins and shows that preview customers are converting into durable paid demand."]
      - ["Anti-thesis", "Commercial Earth observation still faces a renewal-revenue test and Xoople is adding high satellite capex before outside investors can see pricing power or cash-generation proof.", "The anti-thesis weakens if management shares cohort retention, contract value progression, and credible capital plans for the constellation build."]
      - ["Comparable bar", "Sector comparables imply that viability is earned through repeatable revenue and backlog depth rather than product vision alone.", "A stronger view needs milestone evidence that moves Xoople closer to that bar rather than only repeating the category narrative."]
    notes: >-
      This table translates qualitative public evidence into a price-sensitivity frame;
      no public source in the retained set discloses Xoople's current valuation terms
      or audited commercial KPIs.
    claimRefs: [CV006, CV007, CV008, CV010, CV011, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Pilots convert into disclosed recurring contracts; VITO public preview lands in Q4 2026 and initial launch in 2027; customers pay for superior ground-truth quality.", "Only then could premium private-growth pricing be justified because evidence would start to support differentiated revenue potential instead of just strategic narrative.", "Constellation execution, launch timing, and premium-price adoption.", "Requires visible contract conversion and milestone delivery beyond current public rhetoric."]
      - ["Base", "Customer engagements progress and the platform commercializes, but management keeps revenue, valuation, and term details private.", "Track posture remains appropriate because the story stays investable in principle but not yet priceable in practice.", "Slow conversion, opaque unit economics, and another financing need before proof arrives.", "Best fit with the current public record."]
      - ["Bear", "Capex rises, commercialization slips, and the wider Earth-observation market keeps struggling to turn technical capability into renewing demand.", "Downside risk dominates because additional dilution or a tougher next round could arrive before the model proves durable cash generation.", "Execution slippage, margin compression, and weak renewal behavior.", "Supported whenever milestones lag while disclosure remains thin."]
    notes: >-
      Scenario logic is qualitative because retained public evidence does not disclose
      the current post-money valuation, liquidation preferences, or revenue base needed
      for a defensible numerical return model.
    claimRefs: [CV008, CV009, CV011, CV012, CV013, CV014, CV015, CV016]
