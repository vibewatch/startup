callouts:
  - calloutType: recommendation
    title: Stay price-disciplined
    body: >-
      Xoople has crossed the threshold from interesting concept to credible candidate,
      but the public record still falls short of what a priced investment decision
      requires.
    claimRefs: [CV015, CV016]
  - calloutType: risk
    title: The hidden risk is economic proof, not storytelling
    body: >-
      The biggest unresolved question is whether a capital-intensive constellation and
      data platform can convert pilots into renewing contracts before another financing
      cycle tightens investor leverage.
    claimRefs: [CV011, CV012, CV013]
