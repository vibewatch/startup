company:
  name: "Xoople"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Xoople enters late 2026 as a newly commercializing Spanish Earth-data infrastructure company: assigned official and independent sources converge on a 2019 founding, a new Tres Cantos headquarters, and a $130M April 2026 Series B that lifted disclosed funding to $225M. The public record is materially thinner on valuation, governance, and commercial KPIs, so later diligence can trust the company identity and funding stage but still cannot underwrite price, board oversight, or scaled revenue traction."
sections:
  - id: "identity-stage"
    title: "Identity, operating base, and current stage"
    body: "Xoople presents itself as an Earth-data infrastructure company rather than a pure satellite-imagery vendor. Across its homepage, EarthAI manifesto, and financing announcement, the company frames its product as an AI-ready \"system of record\" for physical change on Earth that feeds enterprise and government workflows with structured, decision-ready ground-truth data. The assigned sources also align on a 2019 founding and a long stealth build period before commercial rollout. In April 2026, management said the business planned to begin commercialization in Q2 with private-preview users that included government agencies and Fortune 500 companies, but those disclosures still stop short of confirming that launch, naming customers, or quantifying recurring revenue, deployment count, or retention."
    claimRefs: ["CO001", "CO002", "CO006", "CO008", "CO009"]
    tableRefs: ["TO001"]
  - id: "leadership-governance"
    title: "Founders, leadership, and governance visibility"
    body: "The named public leadership bench remains founder-led. El Referente identifies Fabrizio Pirondini as CEO/CTO and Alvaro Coronado as CFO, and ties both to earlier Deimos Imaging roles that matter for Xoople's mix of Earth-observation execution and financing discipline. Xoople's own materials reinforce that commercial distribution is expected to happen through existing enterprise ecosystems, highlighting Microsoft, Esri, and Databricks around the headquarters and early-access launch. That said, the assigned public sources do not disclose board composition, independent directors, committee structure, or a broader executive roster beyond the co-founders, leaving meaningful key-person and oversight concentration unresolved."
    claimRefs: ["CO010", "CO011", "CO012"]
    tableRefs: ["TO002"]
  - id: "capital-stakeholders"
    title: "Funding base and stakeholder map"
    body: "The strongest corroborated facts in the source pack are the funding stage and named investor group. Xoople's April 2026 announcement, echoed by Vestbee and Verdict/GlobalData syndication, says a $130M Series B brought total disclosed funding to $225M, with Nazca Capital, MCH, CDTI, Buenavista Equity Partners, and Endeavor Catalyst named in the round. Those sources establish stage and syndicate, but they do not disclose ownership percentages, liquidation preferences, debt facilities, or whether any secondaries were embedded in the financing. That gap matters because the business is entering commercialization after an unusually long development cycle and may still need substantial follow-on capital for constellation execution."
    claimRefs: ["CO006", "CO007", "CO014"]
    tableRefs: ["TO003"]
  - id: "milestones-risks"
    title: "Milestones and execution watchpoints"
    body: "The milestone record shows a business moving from stealth infrastructure build toward go-to-market readiness. Xoople said it had already closed more than EUR135M of financing by December 2025, opened a 4,000 sqm global headquarters in Tres Cantos, launched an Early Access Program, and then followed with the April 2026 Series B plus a stated Q2 commercialization start. Independent commentary adds the main caution: in 2026 Earth-observation providers must prove renewal-driven, workflow-level adoption rather than just technical novelty, and one capital-markets-style analysis explicitly frames Xoople's central risk as the move from a capital-intensive build into paid recurring demand. That combination makes commercial proof, not identity or fundraising, the next diligence hinge."
    claimRefs: ["CO003", "CO004", "CO005", "CO008", "CO013", "CO015", "CO016"]
    figureRefs: ["FO001"]
