  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating base, and current stage
        blocks:
          - type: paragraph
            body: >-
              Xoople presents itself as an Earth-data infrastructure company rather than a pure satellite-imagery
              vendor. Across its homepage, EarthAI manifesto, and financing announcement, the company frames its product
              as an AI-ready "system of record" for physical change on Earth that feeds enterprise and government
              workflows with structured, decision-ready ground-truth data. The assigned sources also align on a 2019
              founding and a long stealth build period before commercial rollout. In April 2026, management said the
              business planned to begin commercialization in Q2 with private-preview users that included government
              agencies and Fortune 500 companies, but those disclosures still stop short of confirming that launch,
              naming customers, or quantifying recurring revenue, deployment count, or retention.
            claimRefs:
