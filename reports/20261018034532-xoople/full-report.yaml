              associated with sensors, satellite replenishment, cloud processing, analytics, and sales coverage. The
              wider Earth observation market context is also cautionary: New Space Economy argues that the sector must
              prove customers will pay enough to cover replenishment, analytics teams, cloud costs, and sales
              operations.
