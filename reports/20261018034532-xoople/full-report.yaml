        title: Cost structure points to heavy infrastructure and processing spend
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a model with meaningful capital intensity before proven recurring revenue.
              TechCrunch reported that Xoople built its stack around government spacecraft data and cloud integrations
              while preparing its own proprietary supply, and multiple sources link the latest financing to
              constellation build-out and scaling the AI processing layer. That lowers initial data-acquisition risk
