  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer definition
        blocks:
          - type: paragraph
            body: >-
              The retained sources frame Xoople's addressable market as a decision-ready Earth intelligence layer rather
              than as generic AI software or undifferentiated satellite hardware. Xoople's own materials describe
              EarthAI as a way to turn fragmented Earth data into a high-quality, AI-ready dataset that can be queried
              alongside infrastructure, financial, weather, and operational data, while EY's collaboration write-up says
              the use cases are cross-industry and must be delivered in formats that fit enterprise architectures. That
              boundary implies Xoople is competing for budgets tied to risk, operations, and planning workflows, not for
              all geospatial spend or all AI software spend.

              Buyer evidence is also more specific than a broad "everyone needs Earth data" pitch. The company and its
              third-party coverage repeatedly cite agriculture, insurance, infrastructure, transportation, governments,
              and emergency response as the first workflow wedges. In those segments, the economic buyer is not
              necessarily the analyst who uses the data: insurers care about underwriting and claims teams,
              infrastructure operators care about asset-risk owners, and public agencies care about planning and
              response budgets. That matters because it makes adoption contingent on fitting an existing operational
              system of record rather than winning a standalone analytics seat.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM011
      - number: '2.2'
        title: Sizing lenses and adoption tailwinds
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for Xoople's category is directional rather than precise. TNW cites a broad Earth
              observation market worth $7.04 billion in 2025 and projected to reach $14.55 billion by 2034, while New
              Space Economy cites an EUSPA lens of €3.5 billion of Earth observation revenue in 2024 growing to €7.9
              billion by 2034. AInvest goes broader still with a $29.6 billion 2030 satellite data services forecast.
              The spread is not noise; it reflects different category definitions, currencies, and horizons, so none of
              the figures should be mistaken for a clean Xoople TAM.

              The more durable bullish signal is structural. EY and Xoople both argue that Earth data is becoming useful
              only when it arrives as AI-ready ground truth in enterprise workflows, and New Space Economy describes
              2026 as a shift from imagery supply toward decision-ready services. Xoople's distribution-first route
              through Microsoft Azure, Microsoft distribution, and Esri matters in that context because it reduces
              workflow adoption friction before the company owns its own data supply. The market question is therefore
              less "is geospatial data large?" and more "can Xoople turn broad Earth observation demand into recurring
              workflow spend before competitors and incumbents do?"
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.3'
        title: Constraints and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The same sources that support the category also define its constraints. New Space Economy argues that
              commercial Earth observation still has to prove renewal revenue, interoperability, lower-latency delivery,
              and user adoption, while Xoople's own engineering materials stress that customers buy workflow integration
              and trusted outputs rather than raw imagery. TNW further notes that Xoople's constellation is not yet in
              orbit, so the present commercial offer still depends on third-party and government data sources. SpaceNews
              separately confirms that L3Harris agreed to develop a satellite constellation with Xoople, reinforcing
              that the upstream data strategy remains a build program rather than a completed operating asset. That
              leaves Xoople exposed to both normal enterprise software adoption risk and the capital-intensity risk of
              building a differentiated upstream data layer.

              The largest diligence gap is not whether the broad market exists; it is whether Xoople can capture a
              defendable slice of it. Public sources do not disclose a segment-level SAM or SOM, paying-customer counts,
              conversion rates from early access, pricing benchmarks, or renewal behavior by workflow. Without those
              bottoms-up datapoints, valuation has to rely on broad category analogies and on the credibility of
              Xoople's distribution and product roadmap rather than on demonstrated commercial penetration.
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The relevant competitor set is broader than "other satellite companies." Independent EO market evidence
              shows at least three established competitor classes already serving adjacent buyer needs: horizontal
              constellation operators such as Planet and BlackSky, narrower vertical specialists such as GHGSat and
              OroraTech, and analytics-led firms such as Tomorrow.io and EarthDaily that moved upstream to secure
              differentiated inputs. Xoople's own framing and third-party analysis add a fourth substitute category:
              enterprises or agencies that keep stitching together fragmented public and commercial feeds inside their
              own GIS, cloud, and data-science stacks rather than buying a new platform. That means Xoople must beat
              both incumbent vendors and the inertia of the status quo, not just a single direct peer set.
            claimRefs:
