          label: Product thesis is credible
          detail: Xoople positions EarthAI as AI-ready ground truth embedded into enterprise workflows.
          claimRefs:
            - CV006
            - CV007
        - id: launch
          label: Commercialization has started
          detail: Early Access was launched in late 2025 and commercial operations were reported for Q2 2026.
          claimRefs:
