              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Durability remains unproven and partner concentration is the key customer risk
        blocks:
          - type: paragraph
            body: >-
              The main underwriting issue is not whether Xoople can describe compelling sectors; it is whether those
              sectors convert into repeatable contracts and renewals. New Space Economy's sector review is explicit that
              Earth observation still struggles with pilots, proofs of concept, and renewal economics, and AInvest
              frames Xoople's development-to-commercialization transition around customer adoption and pricing power.
              That matters here because the public evidence clusters around a small group of strategic counterparties -
              Microsoft, Esri, Databricks, and KSAT - without disclosing customer counts, churn, contract lengths, or
              top-account exposure. Xoople's distribution-first model could compound quickly if those channels convert,
              but until the company or customers publish production deployments, the durability case stays unverified.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top-ranked underwriting risks
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to a company that has assembled meaningful capital and strategic validation
              before proving broad commercial repeatability. FundedIQ records $130M across two disclosed rounds, while
              Verdict's syndicated coverage says the April 2026 Series B brought total funding to $225M and positioned
              Xoople to begin commercial operations only "this quarter" after seven years of development. Xoople's own
              December 2025 headquarters launch called its Early Access Program the first step in commercialization, and
              the retained chapter sources still do not disclose signed ARR, customer count, renewal rates, or gross
              margin. That combination makes commercial conversion the first kill criterion: if preview customers and
              partner-led pilots do not convert into paid, repeatable production contracts, a large financing base can
              become a sign of capital intensity rather than de-risked scale. The second ranked risk is constellation
              execution. Xoople now depends on a disclosed stack of third parties for flight operations, downlink, and
              satellite development, so slippage in any layer can delay first-light, product latency, or enterprise
              trust.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
