          - type: paragraph
            body: >-
              The retained evidence points to a consistent buyer pattern: Xoople is positioning EarthAI for enterprise
              and public-sector users that already run complex operational workflows and need Earth data delivered
              inside existing software stacks. Official and third-party descriptions repeatedly cite agriculture,
              infrastructure, logistics, finance, insurance, and government use cases rather than consumer or SMB
              adoption. That is directionally credible because these categories match where Earth-observation buyers
              value risk reduction, monitoring, and decision support. What the sources do not provide is a quantified
              customer mix by geography, vertical, revenue band, or channel, so today's segmentation view should be
              treated as market intent and platform fit rather than demonstrated account concentration or spend by
              segment.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU014
      - number: '6.2'
        title: Commercial proof is emerging through preview access and channel embeds
        blocks:
          - type: paragraph
            body: >-
              Public commercialization evidence has improved, but it still skews toward enablement rather than
              customer-reference proof. Xoople says its Early Access Program is the first step in commercializing the
              offering under private preview, while independent coverage says the platform is built on Azure, integrated
              with Microsoft's Planetary Computer Pro, and distributed through Microsoft and Esri. The October 2026 KSAT
              announcement is the clearest operating proof that Xoople is wiring the delivery stack for enterprise and
              government workflows that require low-latency, reliable data flows. Together, those signals indicate real
              ecosystem traction and a sensible land-through-channel motion, but they are not equivalent to a disclosed
              roster of production end customers or outcome-backed renewals.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
