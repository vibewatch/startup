      - number: '5.2'
        title: Architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The most concrete technical evidence comes from Xoople's own engineering description. The company says the
              stack ingests large multimodal imagery, converts it into structured variables, and uses AI models to
              produce decision-ready output that can land in the systems customers already use. Unlike many startup
              product pages, the retained materials identify actual implementation choices: Anyscale on Azure,
              CPU-to-GPU pipeline optimization, very high GPU utilization, and workload decomposition into millions of
              parallel tasks. Independent reporting broadly matches that delivery posture by describing standardized
              datasets, APIs, and existing business-tool integration instead of a standalone analyst workstation. The
              result is a credible public architecture narrative: data acquisition, model processing, and workflow
              delivery are all visible. The gap is that public documents still stop short of disclosing benchmark
              accuracy, uptime, latency, or interface documentation that would let an investor judge integration
              friction or operational reliability with precision.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
