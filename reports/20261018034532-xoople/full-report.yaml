  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Xoople is not marketing a consumer mapping product or a narrow imagery feed; it is describing a
              decision-support layer that turns Earth observation into operational input for enterprises and
              public-sector users. Across company materials and independent coverage, the consistent theme is an "Earth
              system of record" or "EarthAI" layer that combines Earth data with AI so customers can monitor physical
              change, query it with enterprise context, and act inside existing planning, risk, and response workflows.
              The use cases are broad but directionally consistent: infrastructure monitoring, supply-chain resilience,
              disaster response, agriculture, underwriting, and security-oriented planning. What is less mature is
              product packaging. Public materials still point to private preview and early-access motion rather than a
              fully evidenced, self-serve, broadly documented product surface with disclosed pricing, SLA, or
              module-level production references.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
