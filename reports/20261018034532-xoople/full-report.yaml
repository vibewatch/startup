              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: Regulatory and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a real procurement-readiness concern even though they do not show an active
              enforcement event. Xoople frames its pitch around strategic autonomy, enterprise decision workflows, and
              sectors such as infrastructure, insurance, and transportation, while New Space Economy describes privacy
              and security rules, sovereign access, interoperability, and user adoption as live 2026 Earth-observation
              issues. Yet the public materials reviewed for this chapter do not disclose product-specific licenses,
              security certifications, DPA terms, export-control posture, incident reporting commitments, or active
              litigation detail. That is not proof of a problem; it is a disclosure gap that can slow enterprise and
              public-sector procurement, especially where customers need written answers on data rights, model
              explainability, hosting, and breach response before embedding outputs into operational systems. The
              diligence gate is straightforward: obtain the actual compliance pack, contractual fallback language, and
              any regulator-facing approvals before underwriting adoption assumptions in regulated accounts.
            claimRefs:
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Operational and partner dependency risk
        blocks:
          - type: paragraph
            body: >-
              Xoople's operating model also creates execution risk well before revenue quality can be observed in the
              field. The company says its platform processes trillions of pixels, drives GPU utilization into the high
              90s, and exists to prevent users from relying on AI outputs that are "misrepresentative of reality"; that
              is a strong articulation of the technical problem, but it also highlights how much the thesis depends on
              validated, low-latency, and cost-effective production data. Operationally, the October 2026 GMV
              announcement says the constellation needs dedicated flight-operations software and that KSAT will handle
              large downlink volumes, while SpaceNews reports a separate L3Harris agreement to develop the satellite
              constellation. New Space Economy adds a sector-level warning that commercial Earth observation still faces
              a revenue test, cloud-cost pressure, and hard user-adoption hurdles. In practice, that means Xoople is
              managing not one execution curve but several: spacecraft build, mission operations, downlink, cloud
              economics, product validation, and customer workflow adoption.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR014
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The mitigating evidence is real but still incomplete. Xoople has attracted major investors, public-sector
              support, and brand-name technology partners, and it has now named counterparties for several constellation
              workstreams. Those reduce pure feasibility risk. They do not, however, answer the investor questions that
              would move this chapter from "high residual risk" to "manageable monitored risk": how much paying revenue
              exists today, what share comes from preview versus production accounts, what latency and uptime SLAs can
              the current stack support, what compliance materials close public-sector procurement, and what cash needs
              remain between the current balance sheet and a stable commercial constellation. Practical kill criteria
              are therefore monitorable: no disclosed paid-customer conversion from preview, major slips in
              GMV/KSAT/L3Harris delivery milestones, inability to evidence privacy/security readiness, or continued
              refusal to disclose unit economics after commercialization starts. If management can produce those
              materials, the risk profile improves quickly; if not, the current financing scale amplifies rather than
              absorbs execution risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof still trails financing scale
            body: >-
              The key underwriting gap is not whether investors will fund the thesis, but whether Xoople can convert
              private-preview relationships into recurring production revenue before capital intensity rises again with
              constellation deployment.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR011
          - type: callout
            title: The constellation thesis is only as strong as the dependency chain
            body: >-
              GMV, KSAT, and L3Harris are credible partners, but the current public record still implies a multi-party
              critical path with limited disclosure on fallbacks, timelines, and step-in rights.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Make compliance and unit economics explicit diligence gates
            body: >-
              Before underwriting public-sector or critical-infrastructure demand, require evidence on privacy/security
              readiness, contract structure, latency SLAs, and the cost to deliver an enterprise customer in production.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR009
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence confirms that Xoople closed a $130 million Series B in April 2026 and that reported
              cumulative funding is now about $225 million. That is enough to take the company seriously as a funded
              European Earth-intelligence contender, especially because management has already moved from long-form
              product development into Early Access and commercial launch messaging. The problem for a new investor is
              that financing scale is not the same as price support: the reviewed sources do not disclose a post-money
              valuation, dilution, liquidation preferences, ARR, or contract-level conversion data. With those basics
              missing, the disciplined call is to keep Xoople on the watchlist rather than underwrite a fresh round on
              narrative alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable bar
        blocks:
          - type: paragraph
            body: >-
              The core thesis is coherent: Xoople is not selling raw imagery, but an AI-ready Earth data layer intended
              to plug into enterprise workflows, and the company now has both financing and a visible
              science-to-commercialization bridge through the VITO partnership. That said, the anti-thesis is equally
              concrete. Independent sector evidence says commercial Earth observation still faces a renewal-revenue
              test, and public winners have had to show meaningful scale before the market treated the model as durable.
              Xoople may deserve strategic attention, but it has not yet published the commercial proof that would let
              an outsider treat today’s ambition as tomorrow’s cash-generating reality.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario framework and triggers
        blocks:
          - type: paragraph
            body: >-
              The next twelve to eighteen months are mainly a proof window, not a harvesting window. In the bull case,
              Xoople converts pilots and private previews into disclosed recurring contracts, hits the VITO
              preview-to-launch sequence, and demonstrates that enterprises will pay for higher-quality ground truth
              inside daily workflows. The base case is slower: customer engagements continue and the product stack
              matures, but external investors still lack the hard numbers needed to underwrite a premium round
              confidently. The bear case is straightforward: constellation capex keeps rising, milestones slip, and the
              broader sector’s renewal-economics problem proves harder to solve than the product story implies.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Before committing capital at size, diligence should shift from “is this interesting?” to “is this
              priceable?” That means requesting the current cap table and term sheet, a signed-customer funnel that
              shows pilot-to-paid conversion, contract size and renewal behavior, and a program-level view of
              constellation capex, launch cadence, and operational dependencies. If management cannot show credible
              recurring-revenue proof, or if future financing needs appear likely to outrun customer adoption, the
              thesis should break even if the underlying EarthAI product remains impressive. Until those asks are
              answered, the right posture is active tracking with tight price discipline rather than pre-emptive
              enthusiasm.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stay price-disciplined
            body: >-
              Xoople has crossed the threshold from interesting concept to credible candidate, but the public record
              still falls short of what a priced investment decision requires.
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
          - type: callout
            title: The hidden risk is economic proof, not storytelling
            body: >-
              The biggest unresolved question is whether a capital-intensive constellation and data platform can convert
              pilots into renewing contracts before another financing cycle tightens investor leverage.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
