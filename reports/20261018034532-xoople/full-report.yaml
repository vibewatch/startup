      - number: '3.2'
        title: Differentiation thesis versus incumbents and specialists
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a specific differentiation thesis: Xoople is trying to sell an AI-ready
              Earth data layer that sits inside existing enterprise workflows before its own constellation is live.
              Official materials emphasize EarthAI as a queryable data layer that can be combined with infrastructure,
              financial, weather, and operational systems, while i-SCOOP reports that EarthAI already runs on Microsoft
              Azure and uses Esri as a distribution partner. That is different from the older EO playbook described by
              TerraWatch, where many operators first proved access to imagery or targeted sensing and only then layered
              on analytics. The tradeoff is that incumbents and specialists already control proven upstream assets or
              narrower domain workflows, so Xoople's present advantage is workflow embedding and AI-native packaging
              rather than a demonstrated superiority in live proprietary collection.
