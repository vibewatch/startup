      - number: '3.3'
        title: Pricing visibility, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public price transparency is weak across the retained chapter evidence, so this chapter can compare
              packaging posture better than it can compare list prices. Xoople's current commercial surface points to
              enterprise contracting and private preview, not a self-serve price card, and the retained competitor
              evidence likewise does not disclose clean public price points for the named EO rivals. As a result,
              current switching costs appear to come more from integration into Microsoft, Esri, and Databricks-centered
              workflows than from data lock-in today. That is strategically sensible, but it also leaves moat durability
              partially unproven. TerraWatch warns that governments still dominate EO demand and scalable commercial
              markets remain unproven, while AInvest and i-SCOOP both frame Xoople's next phase as a capital-intensive
              move into hardware against operators that already control live constellations and processing pipelines.
            claimRefs:
