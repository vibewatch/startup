      - number: '4.4'
        title: 'Financial verdict: capital is visible, but underwriting inputs are not'
        blocks:
          - type: paragraph
            body: >-
              The public evidence is sufficient to say Xoople has assembled unusually large external financing for a
              European Earth-intelligence startup and is using that capital to push from development into
              commercialization. It is not sufficient to underwrite revenue quality, margin trajectory, or financing
              adequacy with confidence. Reviewed sources do not disclose price books, realized pricing, ARR or revenue
              run rate, gross margin, CAC, payback, burn, cash on hand, debt obligations, customer concentration, or
              renewal rates. That means the next diligence step is not another round of strategy narrative; it is a
              management data room showing signed commercial contracts, cohort economics, cost-to-serve, and the capital
              plan required to bridge from preview adoption to a self-sustaining revenue base.
