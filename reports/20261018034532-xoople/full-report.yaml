      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution-first differentiation is real
            body: >-
              The strongest supported differentiator is not that Xoople already owns the best live data supply; it is
              that the company is trying to embed an AI-ready Earth data layer inside Microsoft, Esri, and
              Databricks-centered workflows before its own constellation is operational.
