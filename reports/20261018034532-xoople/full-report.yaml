      - number: '5.3'
        title: Maturity, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The product thesis depends on two execution layers maturing in parallel. First, Xoople has to convert
              preview-stage customer engagement into repeatable production demand. Independent Earth-observation
              analysis makes clear that this sector no longer wins on sensor capability alone; buyers want
              interoperable, decision-ready services with trusted outputs and a path to budget renewal. Second, Xoople's
              differentiation narrative still relies on data advantage from a future proprietary constellation and the
              disclosed L3Harris satellite relationship, but the retained public record does not yet spell out launch
              cadence, first-light timing, or how much of the commercial promise depends on assets not yet fully
              described in market. Trust controls are also thin in public view: the chapter's reviewed sources did not
              surface named security certifications, uptime history, public API docs, or quantified model error rates.
              That does not disprove product quality, but it leaves a diligence burden exactly where enterprise buyers
              and regulated users tend to press hardest.
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Constellation timing and trust proof are still open execution tests
            body: >-
              Xoople's public story is strongest on product thesis and architecture, but diligence still turns on
              whether preview-stage workflows become repeatable enterprise products with documented trust controls and a
              de-risked sensor roadmap.
            calloutType: risk
            claimRefs:
