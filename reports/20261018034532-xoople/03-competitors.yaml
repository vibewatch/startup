    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Xoople
      - Horizontal pioneers
      - Vertical specialists
      - Internal build / fragmented feeds
    rows:
      - - AI-ready data layer
        - Designed for AI-ready Earth data and enterprise reasoning
        - Usually imagery-first in retained sources
        - Usually analytics for a narrower problem
        - Must be assembled internally from multiple feeds
      - - Live proprietary sensor layer today
        - No; future constellation remains planned
        - Yes
        - Varies by vendor; many operate targeted sensors
        - No
      - - Existing enterprise distribution partners
        - Yes; Microsoft, Esri, and Databricks
        - Not detailed in retained sources
        - Not detailed in retained sources
        - Yes; stays inside the buyer's existing stack
      - - Broad cross-industry surface-intelligence pitch
        - Yes; infrastructure, finance, agriculture, and resilience use cases
        - Yes; broad imagery markets
        - No; narrower domain workflows
        - Possible, but only with custom integration
      - - Main switching-cost basis
        - Workflow embedding now; proprietary data later if constellation ships
        - Existing data supply and processing pipelines
        - Domain workflow specialization
        - Internal ownership of tooling and data choices
      - - Public pricing in retained sources
        - Unknown / not disclosed
        - Unknown / not disclosed
        - Unknown / not disclosed
        - Internal labor and data spend, not a vendor list price
    notes: >-
      "Unknown / not disclosed" means the retained source set did not show a
      public answer; it does not imply the capability or price point does not
      exist in the market.
    claimRefs: [CP001, CP002, CP004, CP005, CP006, CP008, CP010, CP011, CP012, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer / comparator
      - Price / unit / contract model
      - Included capabilities in retained evidence
      - Discount or unknowns
      - Implication
    rows:
      - - Xoople Early Access / partner-led sale
        - Enterprise contract and private preview; no public list price retained
        - AI-ready Earth data, tailored use cases, and workflow integration
        - Discounting, minimums, and realized pricing unknown
        - Supports consultative GTM but blocks clean public benchmarking
      - - Horizontal constellation operators
        - Not disclosed in retained chapter sources
        - Broad imagery supply and live upstream infrastructure
        - Seat, API, imagery-volume, and contract terms unknown
        - Xoople must sell on integration and future data quality, not visible price leadership
      - - Vertical specialists
        - Not disclosed in retained chapter sources
        - Narrower analytics tied to specific sensing or workflow problems
        - Packaging appears use-case specific, but retained sources do not show terms
        - Specialists can win when buyers value a single problem workflow over breadth
      - - Internal build / fragmented feeds
        - Internal engineering, tooling, and data-procurement spend
        - Maximum stack control and mix-and-match sourcing
        - True TCO depends on staffing and vendor agreements outside retained evidence
        - Status quo remains credible for sophisticated buyers if Xoople's premium is unclear
    notes: >-
      This is a packaging comparison, not a validated price comparison: the
      retained sources do not publish enough list-price detail to normalize
      contract economics across vendors.
    claimRefs: [CP002, CP005, CP006, CP008, CP011, CP015]
figures:
