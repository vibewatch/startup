    title: Competitive positioning map
    type: quadrant
    summary: >-
      Xoople scores highest on current enterprise distribution in the retained
      evidence, but it sits below live constellation operators on present-day
      control of proprietary data supply.
    data:
      xAxis:
        label: Control of differentiated data supply
        min: 1
        max: 5
        low: Uses third-party or fragmented feeds
        high: Controls a live proprietary sensor layer
        description: Evidence-backed ordinal scale from retained sources
        scale: ordinal
      yAxis:
        label: Embedded enterprise distribution
        min: 1
        max: 5
        low: Specialist or bespoke adoption path
        high: Already embedded in major enterprise workflows
        description: Evidence-backed ordinal scale from retained sources
        scale: ordinal
      points:
        - label: Xoople
          x: 2
          y: 5
          claimRefs: [CP002, CP003, CP004, CP012]
        - label: Planet / BlackSky-style operators
          x: 5
          y: 3
          claimRefs: [CP005, CP008, CP009]
        - label: Airbus / ICEYE / Capella-style suppliers
          x: 5
          y: 2
          claimRefs: [CP008]
        - label: Vertical specialists
          x: 4
          y: 2
          claimRefs: [CP006]
        - label: Backward integrators
          x: 4
          y: 3
          claimRefs: [CP007]
        - label: Internal build / fragmented feeds
          x: 1
          y: 4
          claimRefs: [CP015]
    approximationNotes: >-
      Ordinal 1-5 scores reflect the retained evidence only: x ranks current
      ownership of differentiated data supply, while y ranks how directly each
      option is already embedded in enterprise workflows. These are not external
      benchmarks or implied market shares.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP008, CP012, CP015]
callouts:
  - calloutType: strength
    title: Distribution-first differentiation is real
    body: >-
      The strongest supported differentiator is not that Xoople already owns the
      best live data supply; it is that the company is trying to embed an
      AI-ready Earth data layer inside Microsoft, Esri, and Databricks-centered
      workflows before its own constellation is operational.
    claimRefs: [CP002, CP003, CP010, CP012]
  - calloutType: risk
    title: Moat durability still depends on execution, not rhetoric
    body: >-
      Incumbents already control live sensing assets and processing pipelines,
      public price transparency is thin, and independent market analysis still
      questions how large the scalable commercial EO market really is.
    claimRefs: [CP011, CP013, CP014]
