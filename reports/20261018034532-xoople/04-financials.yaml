  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-disclosure
      missingEvidence: Public list pricing, realized pricing, discount policy, and contract templates by product and channel.
      whyItMatters: Pricing opacity blocks peer comparison and prevents conversion of workflow interest into a credible revenue model.
      diligencePath: Request current price books, three anonymized signed contracts, and channel-partner commercial terms.
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: operating-metrics-disclosure
      missingEvidence: ARR or revenue run rate, gross margin, CAC, payback, burn, cash balance, and runway.
      whyItMatters: These are the minimum metrics needed to judge whether commercialization can finance the underlying infrastructure build.
      diligencePath: Obtain monthly management accounts, board pack KPIs, and a twelve-month operating model with actual versus plan.
      relatedQuestionRefs: [QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality-disclosure
      missingEvidence: Customer concentration, renewal cohorts, contract duration, and channel take rates.
      whyItMatters: Preview users do not prove durable or diversified revenue quality.
      diligencePath: Review top-customer analysis, retention cohorts, pipeline conversion, and partner revenue-share schedules.
      relatedQuestionRefs: [QI003, QI004]
      relatedTableRefs: [TI001, TI003]
    - type: missing-source
      severity: material
      topic: capital-plan
      missingEvidence: Detailed constellation budget, launch cadence, debt or project-finance obligations, and milestone-linked use of proceeds.
      whyItMatters: Total capital raised is not enough to test whether Xoople can reach self-sustaining commercialization before another round.
      diligencePath: Request capex schedule, procurement commitments, launch plan, and financing covenant summary.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
