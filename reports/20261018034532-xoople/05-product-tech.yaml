  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Named security certifications, privacy controls, uptime or status history, API authentication model, and data-governance documentation.
      whyItMatters: Enterprise and public-sector buyers will care about trust controls as much as model performance when adopting a physical-world intelligence layer.
      diligencePath: Request security architecture, certification packets, status history, and public or private API documentation from Xoople's product and security teams.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public developer-signal or practitioner proxy such as repository activity, package usage, forum discussions, implementation talks, or partner engineering references.
      whyItMatters: The public chapter can describe Xoople's architecture, but it cannot independently test whether third parties are building on or operating against the stack at meaningful depth.
      diligencePath: Ask for repository access, SDK references, implementation webinars, partner solution-architecture materials, or practitioner references that show real external technical adoption.
    - type: private-evidence-only
      severity: material
      topic: deployment-proof
      missingEvidence: Production deployment counts, reliability metrics, benchmark accuracy or error rates, and support or SLA disclosures.
      whyItMatters: Product-market fit and technical maturity are hard to underwrite when the public record stops at preview use cases and qualitative customer stories.
      diligencePath: Request cohort-level deployment metrics, customer references, incident history, and measured latency or accuracy benchmarks tied to named workflows.
      relatedTableRefs: [TE001, TE002]
