callouts:
  - calloutType: risk
    title: Commercial proof still trails financing scale
    body: >-
      The key underwriting gap is not whether investors will fund the thesis, but whether Xoople
      can convert private-preview relationships into recurring production revenue before capital
      intensity rises again with constellation deployment.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR011]
  - calloutType: risk
    title: The constellation thesis is only as strong as the dependency chain
    body: >-
      GMV, KSAT, and L3Harris are credible partners, but the current public record still implies a
      multi-party critical path with limited disclosure on fallbacks, timelines, and step-in rights.
    claimRefs: [CR006, CR007, CR008]
  - calloutType: recommendation
    title: Make compliance and unit economics explicit diligence gates
    body: >-
      Before underwriting public-sector or critical-infrastructure demand, require evidence on
      privacy/security readiness, contract structure, latency SLAs, and the cost to deliver an
      enterprise customer in production.
    claimRefs: [CR005, CR009, CR012, CR015]
