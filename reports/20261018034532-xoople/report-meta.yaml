  topStrengths:
    - >-
      Strong funding signal: the April 2026 Series B and disclosed investor syndicate confirm that Xoople has attracted
      serious capital.
    - >-
      Clear product thesis: public materials consistently describe an AI-ready Earth-data layer designed to plug into
      enterprise workflows.
    - >-
