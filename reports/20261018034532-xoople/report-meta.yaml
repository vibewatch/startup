companyProfile:
  summary: >-
    Xoople is a Spanish Earth-intelligence company building EarthAI, an AI-ready Earth-data layer intended to embed
    decision-ready geospatial insights into enterprise and government workflows. The public record confirms a 2019
    founding, a new Tres Cantos headquarters, a long stealth build, and an April 2026 Series B that lifted disclosed
    funding to about $225 million, but it still leaves valuation, governance, and commercial KPIs largely undisclosed.
  founders:
