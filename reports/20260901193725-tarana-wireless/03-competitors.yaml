  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Public list pricing is sparse for Tarana and most hardware-vendor competitors, so realized discounts and gross-margin comparisons cannot be verified from public web evidence.
    whyItMatters: Competitive outcomes in infrastructure often hinge on channel discounts, financing, and service terms rather than brochure capability.
    diligencePath: Request quote-level win/loss analysis against Cambium, Ubiquiti, Nokia, and carrier alternatives.
    relatedQuestionRefs:
    - QP015
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: minor
    topic: starlink-comparison
    missingEvidence: The fetched Starlink residential, business, and service-plan pages returned effectively unreadable JS-only text in this workflow.
    whyItMatters: Starlink is a real substitute in remote markets, but the first-party record here was insufficient for a strong price/performance comparison.
    diligencePath: Pull Starlink plan details via a JS-capable browser capture or customer invoice set.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
    - TP003
  - type: missing-source
    severity: material
    topic: head-to-head-benchmarks
    missingEvidence: No independent head-to-head field benchmark in the reviewed public set directly compares Tarana against Cambium, Ubiquiti, Mimosa, Nokia, and carrier FWA in the same terrain conditions.
    whyItMatters: Tarana’s moat narrative depends on performance under difficult real-world conditions, not just individual vendor product claims.
    diligencePath: Request third-party bake-off data segmented by terrain, spectrum band, customer density, and install complexity.
    relatedQuestionRefs:
    - QP019
    - QP022
    relatedTableRefs:
    - TP004
