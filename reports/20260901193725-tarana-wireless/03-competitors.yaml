company:
  name: Tarana Wireless
chapter:
  number: 3
  title: Competitors
  summary: 'Tarana competes across several layers at once: legacy and next-generation fixed-wireless vendors, mmWave specialists, mobile-operator FWA stacks, bundled 5G home-internet services, and fiber or satellite substitutes. Public evidence suggests Tarana is unusually differentiated on non-line-of-sight, interference-heavy, hybrid-spectrum last-mile access, but it still faces real competitive pressure from low-cost incumbent gear, operator-controlled 5G stacks, and consumer-service substitutes with transparent pricing and distribution power.'
sections:
- id: competitive-landscape-by-class
  title: Competitive landscape by class
  body: 'Tarana does not face one clean peer group. The direct comparison set includes fixed-wireless equipment vendors such as Cambium, Ubiquiti, Mimosa, and Ceragon/Siklu, all of which give operators alternatives for point-to-point, point-to-multipoint, or mmWave deployment. A second class consists of operator-oriented 5G FWA stacks such as Nokia FastMile, which are sold as part of a mobile-spectrum-centric strategy. A third class is even more disruptive for Tarana because it can bypass the vendor choice entirely: bundled home-internet services from T-Mobile and Verizon, where the end customer buys a managed service rather than infrastructure. Finally, fiber and low-earth-orbit satellite remain the status-quo or edge-case substitutes depending on density, terrain, and policy context. Tarana’s own FAQ makes clear the company sees itself as neither commodity Wi-Fi gear nor a generic 3GPP adaptation. It argues that purpose-built fixed access matters when operators need fiber-class speeds,
    interference resilience, and non-line-of-sight coverage in the same deployment. That framing is directionally credible, but buyers can still solve the broadband job in many other ways, which means Tarana’s competitor set must be analyzed by use case rather than by radio acronym alone.'
