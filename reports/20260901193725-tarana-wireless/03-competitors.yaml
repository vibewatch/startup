- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Purpose-built silicon and signal processing
    - Competitors improve commodity PTMP and 5G FWA enough for many buyers
    - medium
    - Request third-party head-to-head performance in obstructed and interference-heavy environments
  - - NLoS and difficult-terrain superiority
    - Fiber, mmWave, or carrier FWA solve simpler territories without Tarana
    - high
    - Map win rates by terrain and topology rather than aggregate bookings
  - - Hybrid licensed/unlicensed flexibility
    - State rules, spectrum availability, or operator spectrum ownership favor other architectures
    - high
    - Review customer spectrum mix and lost deals by band strategy
  - - Operator ROI narrative
    - T-Mobile and Verizon reset customer expectations around monthly service value
    - high
    - Test whether Tarana-backed operators can match service quality and total cost in consumer-facing offers
  - - Installed ecosystem momentum
    - Cambium, Ubiquiti, Mimosa, and Nokia benefit from familiarity and incremental upgrade paths
    - medium
    - Quantify sales cycles, rip-and-replace friction, and channel incentives
  - - Technical leadership pace
    - Category validation helps Tarana but also legitimizes larger incumbents and substitutes
    - medium
    - Request roadmap timing, patent map, and evidence that G2 meaningfully widens rather than merely preserves the gap
  notes: Moat durability depends on use-case concentration; Tarana is not equally differentiated in every fixed-broadband topology.
