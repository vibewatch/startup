- id: pricing-distribution-and-switching-costs
  title: Pricing, distribution power, and switching costs
  body: 'The most important competitive asymmetry is not raw throughput; it is route to market. Tarana sells infrastructure through operators, so it depends on lengthy design, spectrum, funding, and installation decisions. By contrast, T-Mobile and Verizon increasingly market home broadband as a consumer subscription with gateway hardware included, clear monthly pricing, self-installation, and multi-year price guarantees. Those offers can pressure operator demand even when Tarana has better edge-case engineering. At the hardware-vendor layer, public pricing transparency is weak: Tarana, Cambium, Ubiquiti, Mimosa, Ceragon, and Nokia largely route serious buyers to quote-led channels, which increases reseller influence and makes realized pricing opaque. Installed-base inertia also matters. Cambium and Ubiquiti benefit from years of operator familiarity, planning tools, and upgrade paths, while Nokia benefits from service-provider relationships and licensed-spectrum strategies. Tarana’s switching
    advantage is strongest when incumbents are failing to deliver consistent service in obstructed, interference-prone environments; its disadvantage is that many buyers will first attempt cheaper or more familiar gear, or will choose a mobile-operator or fiber path that eliminates Tarana from the bill of materials entirely.'
