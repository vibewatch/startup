- id: architecture-and-capability-comparison
  title: Architecture and capability comparison
  body: 'Tarana’s strongest public differentiation is architectural, not merely commercial. Its purpose-built FWA materials emphasize deep interference cancellation, spectrum reuse, and multipath processing for obstructed links, while the G2 launch adds multi-band aggregation across 3 GHz, 5 GHz, and 6 GHz, compatibility with existing G1 remote nodes, and a claim of 6.4 Gbps per sector with up to 2,048 customers per site. That is a different message from Cambium, whose ePMP and cnWave portfolios stress mature 802.11ax-derived PTMP, 60 GHz, and fixed-5G options with up to 4 Gbps class performance, subscriber caps, GPS synchronization, and beam-steering. Ubiquiti’s own help documentation is even more revealing because it shows the operational tradeoffs of lower-cost, widely deployed gear: client counts can be large on paper, but throughput and airtime are highly sensitive to weak clients, clear line of sight, alignment, and channel conditions. Mimosa and Ceragon/Siklu offer other credible
    wedges, especially for lower-cost PTP/PTMP or high-capacity mmWave backhaul. Nokia, meanwhile, competes by integrating FWA into mobile-operator spectrum, install, and service-management workflows. The result is that Tarana looks least vulnerable when the buyer needs difficult-terrain last-mile performance, and most vulnerable when the job is simple LOS transport, commodity PTMP, or a carrier-bundled 5G home service.'
