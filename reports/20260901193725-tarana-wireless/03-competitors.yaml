  rows:
  - - Cambium Networks ePMP / cnWave
    - Direct vendor
    - Public networking vendor; ePMP says millions of radios deployed over more than a decade
    - WISPs, enterprises, mixed PTMP/PTP deployments
    - Mature installed base, frequency reuse, GPS sync, 60 GHz and fixed-5G options
    - Public positioning leans heavily on LOS/PTMP and mature platform economics rather than Tarana-style NLoS claims
  - - Ubiquiti airMAX / airFiber
    - Direct vendor / low-cost incumbent
    - Large installed base implied by broad support ecosystem; zero-license positioning
    - Cost-sensitive WISPs and integrators
    - Low-cost ownership model, no subscriptions, extensive ecosystem familiarity
    - Performance is sensitive to weak-link clients, alignment, and clear LOS conditions
  - - Mimosa
    - Direct vendor
    - Founded 2012; part of Radisys since 2023
    - Rural broadband, backhaul, PTMP/PTP operators
    - Up to 3.0 Gbps PTP and 2.5 Gbps C6 positioning with case-study orientation
    - Public evidence on broad ecosystem scale is thinner than Tarana or Cambium
  - - Ceragon / Siklu
    - Adjacent direct vendor
    - Public wireless infrastructure vendor with mmWave portfolio
    - Urban, suburban, enterprise, backhaul, dense access
    - Multi-gigabit low-latency 60/70/80 GHz mmWave PtP/PtMP
    - Best fit is narrower where line of sight and dense environments dominate
  - - Nokia FastMile FWA
    - Incumbent operator stack
    - Large incumbent network vendor; ABI/market-recognition claims on page
    - Mobile operators and wholesale broadband providers
    - Integrates FWA with mobile spectrum, indoor/outdoor CPE, install apps, and service management
    - Approach assumes operator control of mobile-spectrum assets and may be less neutral than Tarana for WISPs
  - - T-Mobile Home Internet
    - Service substitute
    - National consumer service with 70 million household availability claim
    - Mass-market households
    - Transparent monthly pricing, gateway included, same-day delivery, self-install, mobile bundle discounts
    - Delivered via cellular network with speed variation and prioritization constraints
  - - Verizon 5G Home Internet
    - Service substitute
    - National 5G home-broadband service with multiple price-lock plans
    - Mass-market households
    - Transparent plan ladder, router included, price-lock guarantees, no annual contracts
    - Coverage and realized speeds depend on network conditions and plan tier
  - - Starlink
    - Edge-case substitute
    - Global satellite brand but first-party fetched pricing text is JS-limited in this workflow
    - Hyper-remote households and mobile/roaming users
    - Works where terrestrial build options are weakest
    - Public first-party comparability on price/performance was limited in the reviewed fetched text set
  notes: The table groups solutions by the job they solve, not just by whether they use wireless spectrum.
