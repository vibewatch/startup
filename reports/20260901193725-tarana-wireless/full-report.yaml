      - number: '8.2'
        title: The investment debate is strategic quality versus disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Tarana is straightforward. Product and customer chapters show that the company has a
              genuine technology wedge, meaningful operator adoption, and enough public customer proof to clear the “is
              this real?” hurdle. The latest visible marks on Forge also suggest that private investors have continued
              to ascribe large enterprise value to the business well after its 2022 unicorn round. The bearish case is
              equally straightforward. Public data on revenue quality, margins, concentration, retention, runway, and G2
              field economics remains sparse relative to the valuation levels implied by secondary platforms. In other
              words, Tarana may be a very good company and still be a poor investment at the wrong price. The chapter’s
              recommendation therefore has to be price-sensitive: late-stage private marks deserve a discount when
              liquidity is constrained, diligence access is incomplete, and some of the most important growth
              assumptions still rest on management-only information rather

              than audited or independently refreshed disclosure.
            claimRefs:
