      - number: '5.2'
        title: 'Architecture: NLoS operation, interference cancellation, and spectral efficiency are the technical core'
        blocks:
          - type: paragraph
            body: >-
              The clearest public evidence of Tarana’s differentiation sits in its technical explainers. Across its own
              blogs and product pages, the company attributes performance to distributed massive MIMO, explicit
              transmit-and-receive beamforming, and ABIC, its asynchronous burst interference cancellation system. These
              features are presented as solutions to the hardest fixed-wireless problems: obstruction, bursty
              interference from neighboring radios, and inefficient use of scarce spectrum. Tarana’s technical narrative
              is unusually specific compared with typical telecom marketing. It explains why line-of-sight assumptions
              break down in residential access, why spectral efficiency matters commercially, and why custom compute,
              custom silicon choices, and heavy signal processing can justify a higher upfront bill of materials. The
              public record does not prove all field claims universally, but it does support that Tarana’s moat is built
              around RF and PHY-layer performance rather than channel marketing,

              reseller reach, or low-cost white-label hardware.
