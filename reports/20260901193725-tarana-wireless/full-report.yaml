  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure centers on spectrum rules, certification cadence, and defensible IP
        blocks:
          - type: paragraph
            body: >-
              Tarana’s product promise is inseparable from telecom regulation. Its radios operate inside CBRS and 6 GHz
              frameworks that can change available channels, power limits, and deployment behavior through SAS and AFC
              coordination. Tarana’s own materials are explicit that DPA events, incumbent protection, and
              standard-power operating rules can all alter the practical performance envelope, which means regulatory
              risk is embedded in the product rather than sitting on the edge of the business. The customer stories add
              another layer: many flagship deployments are tied to government-funded broadband programs whose rules,
              awards, and timing affect demand shape. On the legal side, the public record highlights patents and
              grants, not lawsuits. That is encouraging but not exculpatory. It suggests that the legal risk profile is
              less about visible ongoing litigation today and more about maintaining freedom to operate, defending
              differentiated PHY-layer IP, and continuing to ship approved hardware across

              new bands and jurisdictions.
            claimRefs:
