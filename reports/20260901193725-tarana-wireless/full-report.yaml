        title: Deployment depends on spectrum rules, cloud tooling, certifications, and operator enablement
        blocks:
          - type: paragraph
            body: >-
              Tarana’s platform only works as promised when several external systems cooperate. The cloud management
              layer depends on AWS and on Tarana continuing to operate the service reliably. Spectrum operation depends
              on regulatory constructs such as CBRS grant management and 6 GHz AFC coordination, which means part of the
              product experience sits outside Tarana’s direct control. Its own materials acknowledge these constraints
              while claiming design advantages such as k=1 reuse, SAS domain proxy support, and interference elimination
              that reduce operator exposure. The FCC and FCCID records also matter because they show the cadence of
              radio certification and the transition from G1-era gear into 2025 multiband and G2 hardware. Finally, the
              practitioner surface looks curated rather than open: webinars, case-study libraries, and partner
              assistance are visible, but no public developer portal or open-source integration ecosystem was obvious in
              the reviewed set. That suggests Tarana scales through

              assisted deployment rather than self-serve developer adoption. These dependencies are material.
