      - number: '8.3'
        title: Scenario ranges matter more than direct multiple transfer from public comps
        blocks:
          - type: paragraph
            body: >-
              A direct public-comp exercise can easily mislead here. Nokia and Ericsson are far larger, broader, and
              more diversified than Tarana, while Cambium and Inseego are tiny public comparables whose market caps
              likely reflect distressed or structurally weaker positioning. That does not make the comp set useless; it
              simply means the comp set is informative as a boundary condition rather than a pricing formula. Tarana’s
              most relevant public evidence is still the combination of official financing history, secondary-market
              marks, and proof that G2 may widen the addressable deployment envelope if it works as advertised. The
              scenario approach is therefore more robust. In bull, Tarana sustains or exceeds the richest visible
              secondary marks because G2 meaningfully increases density and wallet share. In base, the company deserves
              a discount to the 2025 peak because real adoption is offset by low disclosure quality. In bear, the
              valuation compresses back toward or below the earlier unicorn range if

              liquidity, concentration, or execution risks become dominant.
            claimRefs:
