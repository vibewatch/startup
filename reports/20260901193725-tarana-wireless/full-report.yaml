      - number: '4.4'
        title: Financial verdict and the missing data that still blocks underwriting
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to conclude that Tarana is not pre-revenue theater. It appears to have
              achieved substantial hardware commercialization, attracted sophisticated capital, sustained a large
              technical workforce, and continued releasing new certified products. But the public record is not strong
              enough to conclude that the business has high-quality, scalable economics. There is no public disclosure
              of cash on hand, monthly burn, runway, gross margin, inventory position, debt, receivables quality,
              warranty exposure, customer concentration, or renewal/churn. List pricing is largely absent, so even
              commercial momentum cannot be cleanly translated into revenue quality. Secondary-market pages such as
              UpMarket, Notice, and Hiive are useful as signals that private liquidity exists, yet they also underline
              how speculative and thin the available market data can be. The best diligence posture is therefore neither
              bullish extrapolation nor categorical skepticism. Tarana likely has the capital base and revenue scale to
              continue operating and innovating, but investors still need direct management disclosure before
              underwriting margin durability, balance-sheet resilience, or the extent to which future growth depends on
              subsidies, vendor financing, or a small group of operator customers.
