      - number: '8.4'
        title: 'Recommendation: track or research more, with strict entry discipline and explicit diligence gates'
        blocks:
          - type: paragraph
            body: >-
              The final recommendation is not to reject Tarana, but to refuse false precision. The company looks
              strategically valuable and commercially real, yet the public record is still too thin to justify paying
              near the richest visible marks without a deeper management packet. Investors should insist on current
              revenue, gross margin, working-capital, customer concentration, retention, and G2 deployment-cohort data
              before anchoring to a valuation close to Forge’s 2025 high watermark. If management can close those gaps
              and confirm that G2 is expanding profitable wallet share rather than merely creating a new support burden,
              the upside case remains credible. If those gaps remain unresolved, the correct posture is patient tracking
              with a lower entry threshold that compensates for illiquidity, information asymmetry, and late-stage
              downside if the next financing or liquidity event occurs below expectation. This is therefore a
              research-more name with real upside, not a price-insensitive buy.
            claimRefs:
