  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Tarana’s public materials point to a revenue model built first around hardware shipments and deployments,
              then around software and service layers that help operators run those deployments. The company’s official
              surfaces consistently describe G1 and G2 base nodes, remote nodes, and Tarana Cloud Suite, while the G2
              release adds self-organizing-network tools and fiber/PON interoperability rather than a pure one-off
              appliance story. That suggests the company monetizes a systems stack, not a single radio SKU. Even so, the
              public record remains frustratingly incomplete on how much of revenue is hardware versus software versus
              support. Tarana does not publish list pricing, ARR, gross margin, warranty burden, or revenue-recognition
              policy. The best public revenue evidence comes from company statements made around financing events:
              management said it was on track for over $100 million of revenue in 2022 after launch, and then described
              2022 revenue as nearly $100 million in the 2023 financing announcement. Those numbers are meaningful
              because they imply Tarana crossed into real commercial scale quickly. They are still company claims,
              however, and should be treated as traction signals rather than as audited financial statements. The
              chapter’s bottom line is that Tarana clearly sells something valuable at scale, but the mix and quality of
              those dollars remain only partially visible.
