  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the problem Tarana is trying to solve
        blocks:
          - type: paragraph
            body: >-
              Tarana should be analyzed within fixed broadband infrastructure, not the broader wireless or mobile core
              market. Its public materials consistently frame the company around last-mile internet access for
              households, communities, and anchor institutions that need fiber-class service but cannot always justify
              fiber-class construction economics. That boundary includes rural digital-divide projects, high-cost
              suburban and exurban extensions, and community-owned deployments where the operator must balance speed,
              coverage, reliability, and capital intensity. It excludes purely mobile access, indoor Wi-Fi-only
              equipment, and unrelated telecom software spending. The practical substitute set is therefore not another
              radio vendor alone; it is the full menu of ways a buyer can solve the same job, including fiber, HFC, DSL,
              satellite, and legacy fixed wireless. Tarana’s own government, municipal, and tribal pages make clear that
              the buyer mix is broader than classic WISP procurement. The company is explicitly selling to private ISPs,
              municipalities, tribal communities, and grant-backed network builders that want a faster or cheaper path
              to 100/20 Mbps and above. That makes the chapter’s core market question not simply how large FWA is, but
              when a broadband owner chooses hybrid fiber-wireless architecture over fiber-only expansion.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
