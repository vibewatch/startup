      - number: '7.3'
        title: Partner, customer, and business-model risks stem from concentration opacity and guided-channel dependence
        blocks:
          - type: paragraph
            body: >-
              The public customer evidence shows real adoption, but it also reveals dependency structure. Tarana reaches
              the market through operators, integrators, and programmatic funding environments rather than through a
              self-serve developer or consumer motion. That creates leverage when flagship customers scale quickly, but
              it also creates exposure if a handful of large operators slow purchasing, dual-source, or find G2 harder
              to absorb than G1. Public case-study coverage is skewed toward highly favorable stories, while independent
              review surfaces were thin or blocked during this run. As a result, there is still no public answer to
              basic underwriting questions such as top-customer revenue concentration, renewal cadence, service attach
              to hardware install, or vendor share of wallet inside mixed-technology operators. The risk chapter
              therefore treats customer quality as proven on adoption reality but unresolved on concentration and
              durability. Program dependence compounds that issue because

              county, tribal, and national broadband funding can shift deployment timing even when technical demand
              remains healthy.
