companyProfile:
  summary: >-
    Tarana Wireless is a private broadband-infrastructure company founded in 2009 to rethink fixed wireless access.
    After more than a decade of R&D and more than $400 million of cumulative investment, the company built a
    next-generation fixed wireless access stack spanning G1 and G2 access hardware, remote nodes, and Tarana Cloud
    Suite. The product story is specific: fiber-class broadband over non-line-of-sight links using a combination of
    interference cancellation, beamforming, spectral efficiency, and multi-band spectrum operation.


    Public evidence shows that Tarana has moved well beyond the prototype stage. Official and customer-facing materials
    now point to more than 300 operator customers in 24 countries and 47 U.S. states, while case studies show production
    deployments across rural WISPs, community broadband providers, ILECs, and at least one carrier-branded broadband
    relationship. The main open questions are not whether the product exists or whether customers are real. They are
    whether Tarana’s economics, concentration, support burden, and G2 rollout quality are strong enough to justify
    late-stage private valuations near the richest visible secondary marks.
