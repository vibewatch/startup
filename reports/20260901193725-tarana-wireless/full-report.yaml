              Nextlink’s public case materials describe very fast first-month subscriber additions, a large installed
              base of base nodes and remote nodes, and a later G2 expansion already serving live customers. Watch’s
              materials show a growing tower footprint, while unWired describes tens of thousands of retail customers on
