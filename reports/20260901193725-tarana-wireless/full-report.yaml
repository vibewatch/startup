  - id: TM004
    title: Economics and substitute-technology comparison table
    columns:
      - Dimension
      - Fiber or status-quo evidence
      - ngFWA or Tarana implication
      - Source-backed signal
      - Diligence implication
    rows:
      - - Deployment cost per foot
        - FBA reports median 2025 underground fiber cost of $18/ft and aerial cost of $8/ft
        - Tarana argues radio-led last mile reduces construction intensity
        - Independent fiber costs are rising, which improves wireless relative economics
        - Need management proof that real customer projects match modeled savings
      - - Per-home cost in hard geographies
        - Tarana fiber study says representative divide projects averaged $13.9k per home
        - ngFWA is positioned as a lower-capex alternative for sparse geographies
        - Tarana’s estimate frames the high-cost wedge but is vendor-authored
        - Validate with customer projects and state-award budgets
      - - Time to deploy
        - >-
          Municipal, balanced-diet, and BEAD materials all stress months for wireless versus years for trench-heavy
          builds
        - Fast time-to-service is a core adoption driver when grant timelines are tight
        - Permitting still matters, but trenching avoidance is real
        - Need evidence on average permit-to-install cycle times
      - - Performance ceiling
        - >-
          Legacy FWA often implied 1-50 Mbps or line-of-sight limits; GSA reports 774.7 Mbps average marketed 5G FWA
          peaks
        - Tarana claims gigabit-class NLoS performance narrows the quality gap with wireline
        - Independent market data support high-performance FWA as a category, not Tarana-specific supremacy
        - Need third-party performance testing by environment
      - - Regulatory eligibility
        - BEAD reliability rules favor licensed or hybrid spectrum and can exclude unlicensed-only offers
        - Tarana benefits when buyers can use CBRS or hybrid designs
        - Policy fit is as important as radio performance
        - Need state-by-state map of where Tarana’s spectrum assumptions are competitive
      - - Competitive substitute momentum
        - CostQuest and FBA show fiber keeps expanding quickly in the U.S.
        - Tarana must win on economics and timing before fiber reaches the edge
        - Fiber is both the benchmark and a fast-moving substitute
        - Need pipeline segmentation between greenfield gaps and fiber-threatened areas
    notes: This table compares actual market decision variables rather than abstract technology marketing claims.
