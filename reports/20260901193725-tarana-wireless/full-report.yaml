      - number: '1.2'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Tarana’s public leadership evidence shows a blend of telecom scaling operators, long-horizon technical
              founders, and investor-linked board members. Basil Alwan joined as chairman and CEO in 2021 after senior
              leadership roles at Nokia and TiMetra, while co-founder and CTO Sergiu Nedevschi, co-founder and chief
              architect Dale Branlund, and co-founder and chief software architect Rabin Patra continue to anchor
              technical credibility. Sri Reddy, Carl Guardino, and other operating executives broaden the bench into
              telecom operations, sales, policy, and productization. The company’s own biographies stress experience
              from Nokia, Amazon, Ruckus, Qualcomm, Xircom, and other networking businesses, which matters because
              Tarana is commercializing a systems product that spans hardware, spectrum planning, software, and field
              execution.


              Governance disclosure is informative but incomplete. Tarana publicly notes Hubert de Pesquidoux joining
              the board in 2021, and the current about-page roster shows additional board members such as Adam
              Goldstein, Dean Manson, Dakin Sloss, Dinakar Singh, Kanu Gulati, Neil Sheridan, and Zia Huque. That
              composition implies that investor relationships are closely represented at board level, especially by
              Axon, Khosla, Prime Movers, and Digital Alpha-linked figures. The trade-off is key-person concentration:
              the public story still depends heavily on Alwan for commercialization and on the founders for technical
              differentiation, while committee structure, independence tests, and succession planning are not publicly
              disclosed. For a late-stage company with policy exposure and manufacturing complexity, that missing
              governance depth remains a real diligence ask rather than a cosmetic gap.
