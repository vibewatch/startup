  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'The buyer is the operator: Tarana sells into service-provider workflows across multiple segment types'
        blocks:
          - type: paragraph
            body: >-
              The public customer record makes Tarana’s go-to-market model clear: the company sells its ngFWA platform
              to broadband operators that then package the end service under their own brands. Those operator customers
              are not homogeneous. The reviewed set includes rural and regional WISPs such as Nextlink, Watch, unWired,
              Smart Way, and Resound; community or nonprofit broadband operators such as DigitalC; incumbent local
              exchange carriers such as CentraCom; and carrier-branded fixed-wireless service via UScellular. The use
              cases also span more than one demand environment. Some customers use Tarana to close rural coverage gaps
              and satisfy subsidy obligations quickly, while others use it to defend share against cable, fiber, or
              satellite alternatives, and still others use it to enter denser or historically harder-to-serve
              neighborhoods. That breadth is important because it shows Tarana is not limited to a single niche buyer
              persona, even if service-provider channels still remain the company’s

              overwhelming distribution path.
