      - number: '1.3'
        title: Funding history, stage, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Tarana’s capital history is clearer than its current operating economics. Official releases and
              independent market-data pages align on a $170 million round at a $1 billion valuation on March 23, 2022
              and a further $50 million up round led by Digital Alpha on September 13, 2023. Tracxn currently labels
              Tarana a Series D company with $426 million raised across eight funding rounds and 20 institutional
              investors. The disclosed syndicate mixes traditional venture and growth investors with telecom-adjacent
              strategics, including Axon Capital, Khosla Ventures, Prime Movers Lab, Digital Alpha, EchoStar, Liberty
              Global, Liberty Latin America, I Squared, and the State of Michigan. This is a stronger and more
              telecom-specialized investor roster than many vertical SaaS startups at comparable valuations.


              The strategic meaning of the 2023 round is as important as the dollars. Digital Alpha was not just a
              passive investor; Tarana’s own release says it also offered revenue-share financing to operator customers
              such as Element 8 and Wisper. That linkage suggests Tarana increasingly scales by enabling ISP capex
              rather than merely shipping radios. It also means Tarana’s commercial velocity depends partly on
              financiers and grant programs that sit outside its direct control. Public data therefore support calling
              the company late-stage and well financed, but not fully de-risked. There is still no public cap-table
              breakdown, no published debt stack, and no verified public evidence in the reviewed set for any later
              confidential IPO process or post-2023 priced round.
