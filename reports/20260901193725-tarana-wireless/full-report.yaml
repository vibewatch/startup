      - number: '7.2'
        title: >-
          Operational risk is driven by hard RF environments, installation quality, and limited public
          software-assurance disclosure
        blocks:
          - type: paragraph
            body: >-
              Tarana’s target use cases are exactly the environments where execution can fail most expensively:
              obstructed links, spectrum congestion, severe weather, long distances, sparse density, or difficult
              grant-backed builds. The public case studies show this directly. Operators that adopted Tarana often did
              so because legacy wireless had created churn, failed installs, customer complaints, or impossible
              economics. That means Tarana inherits a customer set whose expectations are high and whose tolerance for a
              botched migration is low. A practitioner troubleshooting guide reinforces the point by showing that
              healthy customer experience depends on multiple RF counters and disciplined operations, not on one
              marketing metric. The cloud layer adds another operational dependency because Tarana Cloud Suite sits on
              AWS and appears central to observability and spectrum coordination. Yet public enterprise-security
              evidence remains limited. The risk is therefore not just radio performance; it is the

              full stack of install quality, mixed-fleet support, cloud reliability, and software-assurance maturity as
              the installed base scales.
