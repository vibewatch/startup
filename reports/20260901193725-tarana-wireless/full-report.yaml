chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and deployment footprint
        blocks:
          - type: paragraph
            body: >-
              Tarana Wireless presents itself as a category creator in broadband infrastructure, not simply as another
              fixed-wireless radio vendor. The company says it was founded in 2009 to rethink fixed wireless access,
              then spent a decade of R&D and more than $400 million of cumulative investment building the
              signal-processing, custom-silicon, radio, and cloud-management stack behind what it now calls
              next-generation fixed wireless access, or ngFWA. Official pages describe a product family spanning G1 and
              G2 base nodes, remote nodes, and cloud-based network management, with the core promise of fiber-class
              broadband over non-line-of-sight links using licensed or unlicensed spectrum. That message is unusually
              consistent across Tarana’s homepage, about page, FAQ materials, and BEAD pages.


              As of the run date, Tarana’s current official positioning is also materially stronger than its older
              archived scale claims. The about page and homepage now say the platform has been embraced by more than 300
              operators in 24 countries and 47 U.S. states, while older company materials show the progression from
              190-plus providers in 2022 to 270-plus in 2023 and 200-plus in older FAQ snapshots. Public profiles from
              Tracxn and Revelio independently corroborate the 2009 founding year and Milpitas headquarters, while
              Tarana’s own materials confirm additional R&D in Pune, India. The result is a credible picture of a
              private company that has moved from deep-technology incubation into commercial scale, even though the
              public record remains thin on current financial disclosures.
