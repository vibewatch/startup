  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Visible valuation marks are real, but they come from a mix of official rounds and opaque secondary-market
          surfaces
        blocks:
          - type: paragraph
            body: >-
              Tarana’s public valuation record is meaningful but uneven. The clearest hard point remains the March 2022
              official financing that took the company above a $1 billion valuation. After that, visibility improves in
              quantity but not in quality. Forge shows a later $1.47 billion 2023 valuation point and a $1.96 billion
              Series 8 valuation in August 2025, alongside an IPO mention and confidential filing reference. Tracxn,
              UpMarket, Hiive, Notice, Legion, and other secondary surfaces all point to continued private-market
              relevance, but they differ in accessibility and methodological clarity. UpMarket is unusually explicit
              that Tarana remained private as of March 2026, that investment access is limited to accredited investors,
              and that secondary exits are subject to transfer restrictions and unpredictable timing. That makes the
              company clearly financeable and clearly interesting, but not transparently priceable. The valuation
              chapter therefore starts from a range of market signals rather than a

              single number that can be accepted at face value.
            claimRefs:
              - CV001
