evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current ARR, gross margin, profitability, burn, and cash runway are not publicly quantified in the reviewed source
      set.
    whyItMatters: >-
      These are the core underwriting metrics for a late-stage infrastructure company and materially affect valuation,
      dilution risk, and IPO readiness.
    diligencePath: >-
      Request board materials or investor update decks with current ARR, gross margin, burn, and cash balances from
      management.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      The public record does not disclose Tarana’s current cap table, debt stack, or verified details of any post-2023
      confidential financing, mezzanine, or IPO steps.
    whyItMatters: >-
      Without capital-structure detail, it is impossible to judge liquidation preferences, debt service, insider
      support, or whether the 2022 unicorn valuation still maps cleanly to current equity value.
    diligencePath: >-
      Request the latest capitalization table, debt schedule, and any 2024-2026 financing memos from management or
      existing investors.
    relatedQuestionRefs:
      - QO029
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Tarana publishes biographies for named leaders and board members but not committee structure, independence
      designations, or formal succession plans.
    whyItMatters: >-
      Governance depth matters because Tarana is now large enough that commercialization, policy exposure, and
      manufacturing execution should not rely on an opaque board process.
    diligencePath: Request board committee charters, attendance records, and a management succession plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: access-blocked
    severity: material
    topic: legal
    missingEvidence: >-
      The reviewed public litigation signal is limited to an inaccessible PacerMonitor case stub for Luterman v. Tarana
      Wireless, Inc.
    whyItMatters: >-
      Even a single employment or commercial dispute may be immaterial, but investors need the pleadings and docket
      history to judge severity, insurance coverage, and reputational risk.
    diligencePath: Pull the complaint and docket directly from PACER or ask company counsel for a litigation schedule.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-sizing
    missingEvidence: No public source isolates Tarana’s serviceable available market by geography, spectrum mix, or buyer class.
    whyItMatters: >-
      A late-stage valuation case requires knowing how much of the apparent broadband need actually matches Tarana’s
      deployment sweet spot.
    diligencePath: Request pipeline segmentation by buyer class, spectrum mode, geography, and funding source.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: state-level-award-conversion
    missingEvidence: >-
      The reviewed public set does not provide a clean state-by-state breakdown of BEAD locations that are realistically
      addressable by Tarana-compatible architectures.
    whyItMatters: Early award capture depends on state program design and challenge outcomes, not just national funding totals.
    diligencePath: Build a state-level matrix using state broadband-office awards, spectrum availability, and operator relationships.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: >-
      Public materials do not disclose how much demand comes from mainstream share-gain deployments versus grant-funded
      rural builds.
    whyItMatters: The two channels have very different sales cycles, margins, and policy risk.
    diligencePath: >-
      Ask management for bookings and pipeline mix by commercial expansion, government-funded builds, and public-sector
      networks.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
      - TM005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Public list pricing is sparse for Tarana and most hardware-vendor competitors, so realized discounts and
      gross-margin comparisons cannot be verified from public web evidence.
    whyItMatters: >-
      Competitive outcomes in infrastructure often hinge on channel discounts, financing, and service terms rather than
      brochure capability.
    diligencePath: Request quote-level win/loss analysis against Cambium, Ubiquiti, Nokia, and carrier alternatives.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: minor
    topic: starlink-comparison
    missingEvidence: >-
      The fetched Starlink residential, business, and service-plan pages returned effectively unreadable JS-only text in
      this workflow.
    whyItMatters: >-
      Starlink is a real substitute in remote markets, but the first-party record here was insufficient for a strong
      price/performance comparison.
    diligencePath: Pull Starlink plan details via a JS-capable browser capture or customer invoice set.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: head-to-head-benchmarks
    missingEvidence: >-
      No independent head-to-head field benchmark in the reviewed public set directly compares Tarana against Cambium,
      Ubiquiti, Mimosa, Nokia, and carrier FWA in the same terrain conditions.
    whyItMatters: >-
      Tarana’s moat narrative depends on performance under difficult real-world conditions, not just individual vendor
      product claims.
    diligencePath: Request third-party bake-off data segmented by terrain, spectrum band, customer density, and install complexity.
    relatedQuestionRefs:
      - QP019
      - QP022
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: No public source in the reviewed set discloses Tarana’s current cash balance, monthly burn, or runway.
    whyItMatters: >-
      A late-stage hardware business cannot be underwritten on historical raises alone because working-capital demands
      can consume cash quickly.
    diligencePath: Request current cash, 13-week cash forecast, monthly burn, runway base/downside cases, and financing triggers.
    relatedQuestionRefs:
      - QI007
      - QI018
    relatedTableRefs:
      - TI005
      - TI006
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-working-capital
    missingEvidence: >-
      Public sources do not disclose gross margin, inventory turns, DSO, payables terms, warranty reserves, or services
      burden.
    whyItMatters: These are the core metrics needed to decide whether Tarana’s growth is value creating or merely capital consuming.
    diligencePath: >-
      Request a full unit-economics and working-capital packet covering product-line gross margin, supplier
      concentration, warranty costs, and inventory aging.
    relatedQuestionRefs:
      - QI011
      - QI025
    relatedTableRefs:
      - TI004
      - TI006
  - type: stale
    severity: material
    topic: revenue-disclosure-quality
    missingEvidence: >-
      The strongest revenue datapoints are still company statements from 2022 and 2023 rather than current audited or
      near-current disclosures.
    whyItMatters: >-
      Historical traction does not answer whether growth, margins, or cash conversion improved or deteriorated into
      2025-2026.
    diligencePath: Request audited or management-certified monthly revenue, bookings, backlog, gross margin, and churn for 2024-2026.
    relatedQuestionRefs:
      - QI003
      - QI023
    relatedTableRefs:
      - TI003
      - TI004
      - TI006
  - type: missing-source
    severity: material
    topic: security-and-privacy-disclosure
    missingEvidence: >-
      No clear public security trust center, certification page, privacy-control architecture, or software-assurance
      packet surfaced in the reviewed materials.
    whyItMatters: >-
      As Tarana Cloud Suite becomes more central to operator workflows, enterprise trust posture matters alongside RF
      performance.
    diligencePath: >-
      Request security architecture, IAM model, logging and retention controls, vulnerability-management cadence, and
      any SOC 2 / ISO 27001 or equivalent evidence.
    relatedQuestionRefs:
      - QE019
      - QE025
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: manufacturing-and-supply-chain
    missingEvidence: >-
      Public sources do not identify contract manufacturers, critical component dependencies, qualification processes,
      or field failure rates by hardware family.
    whyItMatters: >-
      A hardware-led access platform can fail commercially if supply, yield, or warranty performance lags the product
      story.
    diligencePath: >-
      Request manufacturing map, key-component concentration, qualification testing results, RMA rates, and inventory /
      lead-time history for G1 and G2.
    relatedQuestionRefs:
      - QE021
      - QE025
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: minor
    topic: open-developer-surface
    missingEvidence: No public developer portal, API reference, or open-source integration surface was obvious in the reviewed set.
    whyItMatters: >-
      This limits independent verification of extensibility and suggests operator adoption relies on assisted deployment
      rather than ecosystem pull.
    diligencePath: >-
      Ask management whether Tarana intentionally uses a closed enablement model, what APIs exist for OSS/BSS
      integration, and how partner certification works.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: blocking
