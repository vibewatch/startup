  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-assurance-disclosure
    missingEvidence: No public security trust center, certification packet, or detailed software-assurance disclosure surfaced in the reviewed set.
    whyItMatters: Tarana’s control plane and cloud tooling are important enough that weak security posture would be thesis-relevant.
    diligencePath: Request security architecture, incident history, IAM model, penetration-testing cadence, and any SOC 2 / ISO evidence.
    relatedQuestionRefs:
    - QR010
    - QR024
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-retention
    missingEvidence: Public sources do not disclose top-customer exposure, renewal schedules, contract duration, or portfolio-level retention metrics.
    whyItMatters: A broad public logo set can still mask material dependence on a few operators or weak installed-base durability.
    diligencePath: Request top-10 customer exposure, node count, backlog, NRR/GRR, and renewal calendars.
    relatedQuestionRefs:
    - QR018
    - QR025
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: field-failure-and-warranty-economics
    missingEvidence: No public source discloses RMA rates, failure rates by hardware generation, truck-roll costs, or warranty reserves.
    whyItMatters: Hardware-heavy infrastructure stories can look healthy until field-failure economics erode margins and support capacity.
    diligencePath: Request hardware quality dashboard, RMA cohort history, failure root causes, and warranty-reserve methodology.
    relatedQuestionRefs:
    - QR011
    - QR019
    relatedTableRefs:
    - TR002
    - TR004
  - type: enumeration-incomplete
    severity: material
    topic: TR001 regulatory-legal risk coverage
    missingEvidence: The public-source review identifies representative top risks but is not a substitute for a full jurisdiction-by-jurisdiction legal review.
    whyItMatters: Spectrum, international, tribal, and safety obligations can vary materially by customer footprint and band plan.
    diligencePath: Commission counsel and regulatory specialists to map all active jurisdictions, licenses, and grant conditions.
    relatedQuestionRefs:
    - QR001
    - QR023
    relatedTableRefs:
    - TR001
