  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - G2 launch complexity
    - Certification or firmware readiness slips
    - Two or more customer-critical milestones slip by a quarter
    - Pause aggressive underwriting and request revised ramp plan
  - - Customer concentration opacity
    - Top-customer exposure is too high
    - Top 3 customers exceed acceptable revenue or backlog concentration
    - Re-cut downside case and require contractual detail
  - - Retention deterioration
    - Flagship operators report worsening churn or support-call load
    - Churn or complaint trend reverses in key customer cohorts
    - Downgrade installed-base durability assumptions
  - - Security assurance gap
    - No credible security architecture or certification evidence
    - Management cannot provide basic security controls, testing cadence, or incident history
    - Treat software-control-plane risk as thesis-breaking
  - - Program dependence
    - Grant-backed pipeline materially outweighs commercial pipeline
    - Commercial demand absent without subsidy timing support
    - Haircut growth and multiple assumptions
  notes: Kill criteria are designed to convert unresolved public-source gaps into explicit diligence gates.
