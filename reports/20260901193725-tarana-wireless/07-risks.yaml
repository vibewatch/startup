  - FR003
- id: mitigations-monitoring-and-kill-criteria
  title: Mitigants exist, but they must be monitored against G2 execution and hidden balance-sheet pressure
  body: 'Tarana is not a blank-sheet risk story. The company has visible mitigants: a real patent estate, operator references, certification progress, guided deployment content, and a proven first-generation product in G1. Those factors lower the probability that the business is purely promotional. But they do not answer the most investment-critical questions. The transition to G2 creates a classic scaling inflection where every hidden weakness — support staffing, supply constraints, certification lag, cloud reliability, customer concentration, or working-capital strain — can become more painful precisely because demand appears strongest. For investment purposes, the most useful framing is to separate “evidence of technology and customers” from “evidence that scale is safely manageable.” The former is public and fairly strong. The latter still needs diligence. A disciplined investor should therefore set explicit kill criteria around certification slippage, customer concentration, retention

    deterioration, security assurance, and the economics of G2 deployments versus the better-understood G1 base.'
