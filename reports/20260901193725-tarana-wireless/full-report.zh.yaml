      - number: '1.3'
        title: 融资历史、阶段和利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Tarana 的资本历史比当前经营经济性更清楚。官方新闻稿和独立市场数据页面都指向同一组事实：2022 年 3 月 23 日，公司以 $1 billion 估值完成 $170 million 融资；2023 年
              9 月 13 日又完成 Digital Alpha 领投的 $50 million 上调估值轮。Tracxn 目前把 Tarana 标为 Series D 公司，八轮融资累计 $426 million，机构投资者
              20 家。已披露的财团混合了传统风险投资、成长资本和电信产业相邻战略方，包括 Axon Capital、Khosla Ventures、Prime Movers Lab、Digital
              Alpha、EchoStar、Liberty Global、Liberty Latin America、I Squared 和 State of Michigan。相比许多估值相近的垂直 SaaS
              初创公司，这是一张更强、也更偏电信专业化的投资人名单。


              2023 年融资的战略含义不亚于金额。Digital Alpha 不只是被动投资人；Tarana 自有新闻稿称，它还向 Element 8、Wisper 等运营商客户提供收入分成融资。这个连接说明，Tarana
              越来越靠推动 ISP 资本开支来放大规模，而不只是发货无线电。它也意味着 Tarana
              的商业速度部分取决于公司直接控制之外的融资方和补贴项目。公开数据因此支持把公司称为后期且资金充足，但还不能说风险完全出清。公开记录中仍没有股权结构表拆分、没有已发布债务堆叠，也没有本次审阅集中验证到任何后续保密
              IPO 流程或 2023 年后定价轮的公开证据。
