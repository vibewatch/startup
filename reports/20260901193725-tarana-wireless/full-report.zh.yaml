        - 重做下行情景，并要求合同细节
      - - 留存恶化
        - 标杆运营商报告流失或支持电话负担恶化
        - 关键客户队列中流失或投诉趋势反转
        - 下调存量装机耐久性假设
      - - 安全保证缺口
        - 没有可信安全架构或认证证据
        - 管理层无法提供基本安全控制、测试节奏或事件历史
        - 将软件控制平面风险视为打破投资逻辑
      - - 项目依赖
        - 资助支持的销售管线显著高于商业管线
        - 没有补贴时间支撑时，商业需求缺位
        - 下调增长和倍数假设
    notes: 放弃标准旨在把未解决的公开来源缺口转成明确尽调关口。
    claimRefs:
      - CR020
      - CR027
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 观察 / 继续研究
        - 中
        - 高执行风险 + 中战略质量风险
        - 只有相对不透明后期轮估值标记打折时才有吸引力
        - 没有管理层资料室，不要追逐最高的可见老股交易估值标记
    notes: 该建议对价格敏感，因为公开证据质量落后于公司质量。
    claimRefs:
      - CV025
      - CV038
      - CV039
      - CV040
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 从干扰处理、NLoS 性能和 G2 目标看，技术护城河似乎真实存在
        - 若现场数据显示 G2 采用弱、可靠性有问题或容易被替代，则证伪
      - - 客户验证足以支撑战略相关性
        - 头部客户收入结构和留存队列会强化判断；若大客户不复购或大量双供，则削弱判断
      - - 老股交易需求意味着投资者兴趣仍在
        - 经验证的近期交易会强化判断；若平台只有过期或指示性报价，则削弱判断
      - - 披露质量不足以支撑溢价私募定价
        - 经审计或管理层认证的 2024-2026 年收入、利润率和营运资本数据会强化判断
      - - 私人老股市场的流动性存在结构性限制
        - 若 IPO 时间表或清晰收购路径变得可信，则强化判断
      - - 公开可比公司组合只能给出粗略边界，不能给出干净估值公式
        - 更好的同业组合或明确战略买家证据会强化判断
    notes: 各论点有意写成能改变判断的测试，而不是静态利弊。
    claimRefs:
      - CV016
      - CV018
      - CV024
      - CV028
      - CV032
      - CV035
      - CV036
      - CV037
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - G2 成功提高密度，标杆客户扩大钱包份额，管理层验证收入质量
        - 支撑估值接近或高于 2025 年 Forge 约 $1.96B 的高点
        - 要求执行和披露显著改善
        - 可能成立，但公开信息尚未证实
      - - 基准
        - 真实采用延续，但披露仍不完整，流动性仍受限
        - 支撑的折价区间大约在 $1B 中段，而不是峰值估值标记
        - 信息不对称和集中度让折价率维持高位
        - 最符合当前公开证据
      - - 悲观
        - G2 采用低于预期，集中度或利润率问题浮现，流动性窗口仍窄
        - 估值压回此前独角兽级叙事附近，或低于面向散户的老股交易报价屏
        - 降轮或平轮标记风险上升
        - 以现有披露无法排除
    notes: 情景区间是锚定公开估值标记的方向性范围，不是正式 DCF 输出。
    claimRefs:
