      - number: '1.2'
        title: 领导层、治理和关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Tarana 的公开领导层证据显示，公司把电信规模化运营高管、长期投入的技术创始人，以及带有投资方背景的董事放在了一起。Basil Alwan 在 Nokia 和 TiMetra 担任高级领导职务后，于 2021
              年加入并出任董事长兼 CEO；联合创始人兼 CTO Sergiu Nedevschi、联合创始人兼首席架构师 Dale Branlund，以及联合创始人兼首席软件架构师 Rabin Patra
              继续托住技术可信度。Sri Reddy、Carl Guardino 和其他运营高管则把团队能力延展到电信运营、销售、政策和产品化。公司自有履历强调来自
              Nokia、Amazon、Ruckus、Qualcomm、Xircom 和其他网络公司的经验；这一点重要，因为 Tarana 商业化的是一个横跨硬件、频谱规划、软件和现场执行的系统产品。


              治理披露有信息量，但不完整。Tarana 公开提到 Hubert de Pesquidoux 于 2021 年加入董事会；当前 About 页面名单还显示 Adam Goldstein、Dean
              Manson、Dakin Sloss、Dinakar Singh、Kanu Gulati、Neil Sheridan 和 Zia Huque 等董事。这个构成暗示，投资方关系在董事会层面被紧密代表，尤其是
              Axon、Khosla、Prime Movers 和 Digital Alpha 关联人士。代价是关键人物集中：公开叙事仍高度依赖 Alwan
              推动商业化，也依赖创始人支撑技术差异化；委员会结构、独立性测试和继任规划均未公开披露。对一家有政策敞口、制造复杂度又高的后期公司来说，缺失的治理深度是真正的尽调问题，不是表面缺口。
