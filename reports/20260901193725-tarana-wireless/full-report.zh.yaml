      - number: '5.2'
        title: 架构：NLoS 运行、干扰抵消和频谱效率是技术核心
        blocks:
          - type: paragraph
            body: >-
              Tarana 差异化最清晰的公开证据，来自它的技术解释材料。在自有博客和产品页面中，公司把性能归因于分布式 massive MIMO、显式收发波束成形，以及
              ABIC，即其异步突发干扰抵消系统。这些特性被呈现为固定无线最难问题的解决方案：遮挡、来自邻近无线电的突发干扰，以及稀缺频谱使用低效。相比典型电信营销，Tarana
              的技术叙事异常具体。它解释了为什么视距假设在住宅接入中会失灵、频谱效率为什么有商业意义，以及自定义计算、自研硅片选择和重度信号处理为何能支撑更高的前期物料清单。公开记录不能普遍证明所有现场说法，但它确实支持一个判断：Tarana
              的护城河建在 RF 和 PHY 层性能上，而不是渠道营销、经销商覆盖或低成本白标硬件上。
