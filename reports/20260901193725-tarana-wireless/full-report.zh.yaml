            body: >-
              公开客户记录把 Tarana 的进入市场模式讲得很清楚：公司把 ngFWA 平台卖给宽带运营商，后者再用自己的品牌包装终端服务。这些运营商客户并不同质。本次审阅集包括
              Nextlink、Watch、unWired、Smart Way、Resound 等农村和区域 WISP；DigitalC 等社区或非营利宽带运营商；CentraCom 等传统本地交换运营商；以及通过
              UScellular 提供的运营商品牌固定无线服务。使用场景也跨越不止一种需求环境。有些客户用 Tarana
              快速补上农村覆盖缺口、满足补贴义务；有些用它防守有线、光纤或卫星替代方案带来的份额压力；还有一些用它进入更高密度或历史上更难服务的社区。这种宽度很重要，因为它显示 Tarana
              并不局限于单一小众买方画像，即便服务提供商渠道仍是公司的压倒性分销路径。
