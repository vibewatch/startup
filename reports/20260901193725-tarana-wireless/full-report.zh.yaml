      - number: '8.3'
        title: 情景区间比直接套用上市可比倍数更重要
        blocks:
          - type: paragraph
            body: >-
              直接做上市可比公司练习，很容易在这里误导判断。Nokia 和 Ericsson 规模远大、业务更宽、也更分散；Cambium 和 Inseego
              这些小型上市可比公司的市值，则很可能反映了困境或结构性更弱的定位。可比组仍然有用，但更适合作为边界条件，而不是定价公式。Tarana 最相关的公开证据，仍然是官方融资历史、二级市场标记，以及如果 G2
              如宣传所示能跑通，可能扩大可部署场景边界的证据。因此，情景法更稳健。乐观情景下，G2 显著提高密度和钱包份额，Tarana 能维持甚至超过最高的可见二级标记。基准情景下，真实采用被低披露质量抵消，公司应相对
              2025 年峰值打折。悲观情景下，如果流动性、集中度或执行风险成为主导，估值会压缩回早期独角兽区间，甚至更低。
