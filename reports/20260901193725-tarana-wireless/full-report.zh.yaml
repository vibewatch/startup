  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可见估值标记真实存在，但来自官方轮次和不透明二级市场页面的混合信号
        blocks:
          - type: paragraph
            body: >-
              Tarana 的公开估值记录有意义，但并不均匀。最清楚的硬锚点，仍是 2022 年 3 月官方融资把公司估值推到 $1B 以上。之后，可见信息数量增加，质量却没有同步改善。Forge 显示后续一个 2023 年
              $1.47B 估值点，以及 2025 年 8 月 Series 8 的 $1.96B 估值，同时提到 IPO 和保密提交。Tracxn、UpMarket、Hiive、Notice、Legion
              和其他二级市场页面都指向 Tarana 在私募市场仍有热度，但访问性和方法透明度各不相同。UpMarket 尤其明确：截至 2026 年 3 月 Tarana
              仍为私人公司，投资机会仅限合格投资者，二级退出受转让限制约束，时间也难以预测。由此可见，公司显然能融资，也显然有吸引力，但价格并不透明。因此，估值章节从一组市场信号出发，而不是采信某一个表面数字。
            claimRefs:
              - CV001
              - CV002
