      - number: '7.3'
        title: 合作伙伴、客户和商业模式风险，来自集中度不透明和对引导式渠道的依赖
        blocks:
          - type: paragraph
            body: >-
              公开客户证据显示采用确实发生，也暴露了依赖结构。Tarana
              触达市场靠运营商、集成商和项目化资金环境，而不是自助式开发者或消费者路径。旗舰客户快速扩张时，渠道会形成杠杆；但如果少数大运营商放慢采购、引入双供应商，或发现 G2 比 G1
              更难消化，风险也会集中暴露。公开案例研究偏向高度正面的故事，独立评论渠道在本轮研究中要么有限，要么不可访问。因此，若要做基本承销判断，仍缺少公开答案：头部客户收入集中度、续约节奏、服务收入随硬件安装附着情况，以及混合技术运营商内部的供应商钱包份额。风险章节因此把客户质量拆成两层：采用真实性已经得到证明，但集中度和持久性仍未解决。项目依赖又放大了这个问题，因为县、部落和国家宽带资金即使在技术需求健康时，也会改变部署节奏。
