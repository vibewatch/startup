      - number: '4.2'
        title: 公开牵引力代理指标和员工信号
        blocks:
          - type: paragraph
            body: >-
              因为 Tarana 是私有公司，员工和部署代理指标几乎和收入说法一样重要。公司公开说法显示，运营商采用从 2022 年初超过 120 家服务提供商，上升到 2022 年末 8 个国家 190 家 ISP，再到
              2023 年 19 个国家 270 多家提供商，并在 2025 年末达到超过 300 家运营商、覆盖 20 million
              个家庭和企业。单独看，任何一个数字都不能证明高质量经常性收入；合在一起，它们强烈暗示大规模发货量和有分量的装机基础。Revelio 增加了更扎实的劳动力市场信号：截至 2026 年 3 月，全球员工约 484
              人；员工数在 2024 年下滑后恢复，工程仍是最大职能。同一来源还显示，公司仍在招聘，而不是冻结。这与一家仍在投入
              R&D、运营和进入市场，而非全面转入紧缩的公司相一致。需要谨慎的是，不同第三方数据集并不完全一致。Tracxn 给出的美国主体最新员工数低于 Revelio 的全球口径；IncFact
              的收入区间也明确只是针对私有公司的统计评估。这些都是有用的交叉验证点，但不能取代关于收入质量、积压订单、利用率或客户集中度的审计披露。
