  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品和部署足迹
        blocks:
          - type: paragraph
            body: >-
              Tarana Wireless 把自己定义为宽带基础设施的品类开创者，而不是又一家固定无线电台厂商。公司称自己 2009 年成立，为的是重新思考固定无线接入；随后花了十年 R&D 和超过 $400 million
              累计投入，搭建信号处理、自研硅片、无线电和云管理栈，并把它称为下一代固定无线接入，即 ngFWA。官方页面描述的产品族覆盖 G1/G2
              基站节点、远端节点和云端网络管理，核心承诺是用许可或免许可频谱，在非视距链路上交付光纤级宽带。这个信息在 Tarana 主页、About 页面、FAQ 材料和 BEAD 页面上异常一致。


              截至本次运行日期，Tarana 当前官方定位也明显强于旧版存档中的规模说法。About 页面和主页现在称，平台已被 24 个国家、47 个美国州超过 300 家运营商采用；旧版公司材料则显示，提供商数量从
              2022 年的 190 多家，推进到 2023 年的 270 多家，而更早 FAQ 快照为 200 多家。Tracxn 和 Revelio 的公开资料独立佐证了 2009 年创立和 Milpitas
              总部；Tarana 自有材料还确认公司在印度 Pune 设有额外 R&D。由此形成的图景可信：这家私有公司已从深科技孵化走向商业规模，只是公开记录对当前财务披露仍然很薄。
