      - number: '3.2'
        title: 架构和能力对比
        blocks:
          - type: paragraph
            body: >-
              Tarana 最强的公开差异化在架构，而不只是商业。其专用 FWA 材料强调深度干扰抵消、频谱复用，以及面向遮挡链路的多径处理；G2 发布则加入跨 3 GHz、5 GHz 和 6 GHz 的多频段聚合、与现有
              G1 远端节点兼容，并声称每扇区 6.4 Gbps、每站最高 2,048 个客户。这个信息不同于 Cambium：后者的 ePMP 和 cnWave 组合强调成熟的 802.11ax 衍生 PTMP、60 GHz
              和固定 5G 选项，性能最高到 4 Gbps 级别，并强调用户上限、GPS 同步和波束转向。Ubiquiti
              自有帮助文档更有启发，因为它展示了低成本、广泛部署设备的运营取舍：纸面客户数可以很大，但吞吐和空口时长高度受弱客户端、清晰视距、对准和信道条件影响。Mimosa 和 Ceragon/Siklu
              也有其他可信楔形机会，尤其是在低成本 PTP/PTMP 或高容量 mmWave 回传上。与此同时，Nokia 通过把 FWA
              接入移动运营商的频谱、安装和服务管理工作流来竞争。结果是，买方需要复杂地形的最后一公里性能时，Tarana 看起来最不脆弱；任务只是简单 LOS 传输、商品化 PTMP，或运营商捆绑 5G
