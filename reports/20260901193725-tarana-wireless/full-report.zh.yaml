        title: 护城河耐久性和反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Tarana 的护城河叙事成立，但并不绝对。公司围绕专用硅片、非视距性能、干扰抵消和许可 / 免许可混合运行，提出了可信的技术论证。其 FAQ
              明确表示，没有其他厂商能快速复制它正在追求的专利信号处理、自研硅片和下一代平台开发节奏的组合。即便如此，竞争环境仍有几种方式会让护城河变窄。第一，品类验证是双刃剑：Ericsson 和 GSA 显示 5G FWA
              和高性能 FWA 已成为主流；这帮助 Tarana 教育买方，也为规模更大或分销更强的替代方案背书。第二，T-Mobile 和 Verizon
              的消费服务替代品透明、定价激进，并直接触达数百万家庭。第三，mmWave、光纤甚至卫星都能切走 Tarana 并非最优适配的部分市场。最后，许多公开竞争对手页面都表明，买方可以先在
              Cambium、Ubiquiti、Nokia 或 Mimosa 生态内走渐进升级路线，再决定是否承受更具扰动性的架构变化。因此，投资人应把 Tarana
              护城河视为在困难最后一公里部署中最强，在渠道熟悉度、定价简单性或既有服务捆绑主导决策时最弱。
