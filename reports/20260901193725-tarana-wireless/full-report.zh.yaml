      - number: '3.3'
        title: 定价、分销力量和切换成本
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争不对称不是原始吞吐量，而是进入市场路径。Tarana 通过运营商销售基础设施，因此依赖漫长的设计、频谱、资金和安装决策。相比之下，T-Mobile 和 Verizon
              越来越把家庭宽带作为消费订阅来营销，包含网关硬件、清晰月费、自助安装和多年价格保证。即便 Tarana
              在边缘场景工程上更强，这些方案也会压低运营商需求。在硬件厂商层，公开定价透明度很弱：Tarana、Cambium、Ubiquiti、Mimosa、Ceragon 和 Nokia
              基本都把严肃买家导向报价渠道，这提高了经销商影响力，也让实际成交价不透明。存量安装基础的惯性也重要。Cambium 和 Ubiquiti 受益于多年运营商熟悉度、规划工具和升级路径；Nokia
              受益于服务提供商关系和许可频谱策略。Tarana 的切换优势在既有方案无法在遮挡、干扰重的环境中稳定交付服务时最强；劣势在于，许多买方会先尝试更便宜或更熟悉的设备，或选择移动运营商 / 光纤路径，把 Tarana
              从物料清单中彻底拿掉。
