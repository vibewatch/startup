      - number: '7.2'
        title: 运营风险由复杂 RF 环境、安装质量，以及有限的公开软件保障披露共同驱动
        blocks:
          - type: paragraph
            body: >-
              Tarana 的目标用例，恰好都是执行失误代价最贵的场景：链路受遮挡、频谱拥塞、恶劣天气、长距离、低密度，或 补助资金支持但落地困难的建设。公开案例研究直接说明了这一点。采用 Tarana
              的运营商，往往是因为传统无线已经带来流失、安装失败、客户投诉，或经济账根本跑不通。也就是说，Tarana
              接手的是一批预期很高、对迁移翻车容忍度很低的客户。一个面向从业者的故障排查指南也强化了这个判断：健康的客户体验靠多项 RF 计数器和严格运营支撑，而不是某个营销指标。云层又增加了一层运营依赖，因为 Tarana
              Cloud Suite 跑在 AWS
              上，而且似乎是可观测性和频谱协调的核心。可是，公开的企业安全证据仍然有限。因此风险不只是无线电性能，而是随着装机规模扩大，安装质量、混合机队支持、云可靠性和软件保障成熟度组成的整套栈。
