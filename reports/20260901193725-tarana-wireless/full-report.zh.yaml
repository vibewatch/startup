    rows:
      - - 农村数字鸿沟固定宽带
        - 面向未服务或服务不足地点的最后一公里宽带基础设施、塔站、无线电设备、回传扩展、安装和用户设备
        - 纯移动服务、仅室内 Wi-Fi，或无关电信软件预算
        - 独立 ISP / 公共资金资助方
        - Tarana BEAD 和政府材料中的核心用例
      - - 主流郊区和远郊宽带扩张
        - 用于更快进入市场或更低成本边缘扩张的光纤-无线混合网络资本开支
        - 长途核心传输、手机套餐，或企业园区网络
        - 区域 ISP / 私营运营商
        - 重要性在于，Tarana 将 ngFWA 定位为既适用于主流项目，也适用于数字鸿沟项目
      - - 市政社区连接
        - 住宅宽带，加上公共安全、公用事业、交通、监控和智能电表连接
        - 一般市政 IT 软件支出
        - 市或县政府
        - Tarana 明确提出的垂直市场，拥有不同的公共预算归属方
      - - 部落连接
        - 部落土地上的家庭宽带、核心机构和社区服务连接
        - 消费电子或仅移动覆盖
        - 部落政府 / 部落电信实体
        - Tarana 明确提出的垂直市场，与主权、偏远性和补助获取绑定
      - - 补助支持的农村宽带项目
        - BEAD、ReConnect、ARPA 和州宽带补助资助的部署预算
        - 无关企业 M&A 或频谱交易预算
        - 州、地方、部落或运营商申请方
        - 资金路径往往决定项目是否存在
      - - 现状替代方案
        - 光纤、HFC、DSL、LEO 卫星，以及用于解决同一家庭宽带任务的传统视距 FWA
        - 无关固定企业 LAN 设备
        - 由服务商 / 网络所有者面向家庭
        - Tarana 采购决策中的真实比较集
    notes: 本市场由固定宽带要完成的任务，以及触达困难地点的经济性定义，而不是由整个无线设备栈定义。
