      - number: '4.3'
        title: 资本充足性和资产负债表含义
        blocks:
          - type: paragraph
            body: >-
              Tarana 的资本历史足够大，即便当前现金余额未披露，也会对运营产生影响。官方和第三方融资来源都指向 2022 年 3 月 $170 million 融资、估值 $1 billion，以及 2023 年 9 月
              Digital Alpha 领投的 $50 million Series D。Tarana 自有材料还称，已有超过 $400 million 投入公司技术；Tracxn 目前则把总融资列为八轮 $426
              million、20 家投资人。这是一家资本密集型基础设施公司的画像，不是轻资产软件供应商。运营后果同时出现在公司叙事和申报节奏中。Tarana FAQ 明确描述，在供应链压力下制造很困难；FCC
              申报聚合器则显示，到 2025 年，公司围绕基站节点、远端节点和多频段 / G2 设备，持续获得实验授权和产品认证。这些信号意味着，公司确实需要库存、认证、实验室工作、现场支持，以及持续的硅片或硬件迭代。2023
              年 Digital Alpha 轮尤其重要，因为管理层称快速增长提高了营运资本需求，而且该投资人也在为 Tarana 客户提供资金。这可能有利于需求加速，但也意味着部分销售动能可能依赖 Tarana
              直接控制之外的融资可得性。
