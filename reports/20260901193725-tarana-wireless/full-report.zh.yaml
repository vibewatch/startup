      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              对一家基础设施初创公司来说，Tarana 的买方地图异常多元。设备的直接用户通常是 ISP 或网络运营商，但经济出资方可能是市政机构、部落政府、州宽带办公室、贷款方或联邦补贴项目。Tarana
              公开材料直接面向政府官员、市政机构和部落组织营销；USDA ReConnect
              文件则显示，公司、合作社，以及州、地方和部落政府都可申请农村宽带资金。实践中，这会形成分层采用路径。首先，宽带资产所有者识别光纤经济性或部署时间较弱的地区。接着，它拼出频谱、站址访问，以及往往还要补贴或融资包。然后，在建设网络并激活家庭前，它还必须通过
              BEAD 可靠性规则、州挑战流程或地方许可等监管或行政步骤。最终用户仍是家庭、学校、诊所或小企业，但在用户看到 CPE 很久以前，决策流程就已经是机构化、预算驱动的。这对尽调重要，因为销售效率取决于 Tarana
              能否影响项目设计、证明部署经济性，并帮助运营商跑通资金工作流，而不只是赢下一场技术比拼。
