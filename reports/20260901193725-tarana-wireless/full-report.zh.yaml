  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运营商实际购买的东西：无线电、软件，以及 ngFWA 操作系统
        blocks:
          - type: paragraph
            body: >-
              Tarana 的公开材料持续把产品描述为下一代固定无线接入平台，而不只是基站产品。商业包从物理接入层开始——G1 的基站节点和远端节点，加上更新的 G2 基站节点和
              RNm——但只有配套软件和服务一起存在，工作流才说得通。Tarana 自有材料把 Tarana Cloud Suite
              放在更宽的软件、维护、支持套餐中，这意味着部署规划、网络监控、软件更新和频谱管理都是交付系统的一部分。这对尽调重要，因为买方购买的不是商品化 Wi-Fi
              无线电，而是在采用一套垂直整合的接入架构。产品地图还显示了存量装机扩展路径：G1 是经现场验证的平台，G1x2 是软件驱动的容量扩展，G2 则是更高密度、多频段的下一步，瞄准更大、更具竞争性的宽带覆盖。
