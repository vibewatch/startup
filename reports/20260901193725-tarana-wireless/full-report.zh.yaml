            body: >-
              公开材料支持在 Tarana 栈内部划出成熟与新兴的分界。G1 已商业化多年，有多个运营商证明点，也积累了认证历史和深厚的技术内容库。G1x2 看起来像一个有意义的软件驱动延伸，在存量装机基础上提高吞吐，强化了
              Tarana 物理层架构可随时间扩展的观点。相比之下，G2
              的纸面吸引力强，也有第三方报道佐证，但真正做投资判断仍取决于真实部署证据：规模化扇区承载、城市市场塔址级密度、维护负担，以及混合设备群的兼容经济性。公司的 IP
