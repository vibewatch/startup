  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按类别划分的竞争格局
        blocks:
          - type: paragraph
            body: >-
              Tarana 面对的不是一个干净的同业组。直接可比集合包括 Cambium、Ubiquiti、Mimosa、Ceragon/Siklu 等固定无线设备厂商，它们都能给运营商提供点到点、点到多点或 mmWave
              部署替代方案。第二类是面向运营商的 5G FWA 栈，例如 Nokia FastMile；这类产品作为移动频谱中心策略的一部分销售。第三类对 Tarana
              更具颠覆性，因为它可以绕过设备厂商选择本身：T-Mobile 和 Verizon
              捆绑的家庭互联网服务，终端客户购买的是托管服务，而不是基础设施。最后，光纤和低轨卫星仍是常规或边缘场景替代，取决于密度、地形和政策语境。Tarana 自有 FAQ 明确表示，公司既不把自己看作商品化 Wi-Fi
              设备，也不是泛化的 3GPP
              改造。它主张，当运营商需要在同一次部署中同时获得光纤级速度、抗干扰能力和非视距覆盖时，专门设计的固定接入很重要。这个定位方向上可信，但买方仍可用许多其他方式解决宽带任务；因此，Tarana
              的竞争集合必须按用例分析，而不能只按无线电缩写归类。
