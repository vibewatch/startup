  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Tarana 的公开材料指向一种收入模型：先靠硬件发货和部署，再叠加帮助运营商运行部署的软件与服务层。公司官方页面持续描述 G1/G2 基站节点、远端节点和 Tarana Cloud Suite；G2
              发布则加入自组织网络工具和光纤 / PON 互操作，而不是一个纯一次性设备故事。这说明公司变现的是系统栈，不是单一无线电
              SKU。即便如此，公开记录对收入中硬件、软件、支持各占多少仍然令人不满意地不完整。Tarana
              不发布标价、ARR、毛利率、保修负担或收入确认政策。最好的公开收入证据来自融资事件前后的公司说法：管理层称，公司发布后 2022 年收入有望超过 $100 million；随后又在 2023 年融资公告中称
              2022 年收入接近 $100 million。这些数字有意义，因为它们暗示 Tarana 很快跨入真实商业规模。但它们仍是公司说法，应视为牵引信号，而不是审计财务报表。本章底线是：Tarana
              显然已经在规模上卖出有价值的东西，但这些收入的组合和质量仍只露出一部分。
