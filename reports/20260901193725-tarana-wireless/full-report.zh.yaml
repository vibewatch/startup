      - number: '8.2'
        title: 投资争议的核心，是战略质量与披露质量的拉扯
        blocks:
          - type: paragraph
            body: >-
              Tarana 的多头逻辑很直接。产品和客户章节显示，公司有真实的技术切口、有意义的运营商采用，以及足够的公开客户证明，能跨过“这是不是一门真生意”的门槛。Forge 上最新可见标记也说明，在 2022
              年独角兽轮之后很久，私募投资者仍继续给这家公司赋予较大的企业价值。空头逻辑同样直接。相对于二级平台暗示的估值水平，公开数据对收入质量、利润率、集中度、留存、现金跑道和 G2
              现场经济性的披露仍然稀疏。换句话说，Tarana
              可能是一家很好的公司，但在错误价格上仍然是糟糕投资。因此，本章建议必须对价格敏感：当流动性受限、尽调访问不完整，且若干最重要增长假设仍依赖管理层单方面信息，而不是审计或独立刷新披露时，后期私募标记应当打折。
