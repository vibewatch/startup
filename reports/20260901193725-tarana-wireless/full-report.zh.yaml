      - number: '2.4'
        title: 增长驱动、约束和证伪证据
        blocks:
          - type: paragraph
            body: >-
              Tarana 市场的乐观情景很直接：庞大的宽带需求池仍在，公共资金让政府参与最后一公里建设常态化，光纤部署成本上升，全球 FWA
              采用继续扩大。但同一批来源也说明，市场准入不会自动发生。独立光纤来源称，光纤仍在提升份额，如今覆盖超过 60% 美国家庭；这意味着 Tarana 经常要对抗一个越来越普及、也更受政治偏好的替代方案。FCC 和
              Tarana 材料还显示，监管定义很关键。在 BEAD 下，可靠性测试、频谱组合和挑战流程文件，可能决定运营商是否具备资格。许可仍是另一道隐性刹车。Broadband Breakfast 的 2026
              年报道说得很清楚：即便固定无线支持者也认为，许可证、塔址审批和州级要求是时间与成本瓶颈。最重要的是，Benton 报道 Tarana 自己的政策负责人承认，固定无线最初只拿到约 11% 的 BEAD
              合格地点，而光纤提供商约为 67%。这是本章关键反向事实：Tarana 的市场逻辑在经济性上可能正确，但如果政治、采购和技术偏好动态支持光纤优先决策，奖项转换仍可能更慢。
