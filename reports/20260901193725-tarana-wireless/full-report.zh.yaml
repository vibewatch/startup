      basis: Representative public telecom and FWA references used as boundary conditions rather than exhaustive peers.
  - id: TV005
    title: 投资逻辑破裂与放弃触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - G2 执行失手
        - 客户关键铺设或支持 KPI 明显恶化
        - 削弱密度扩张逻辑，推迟溢价重估
        - 不要按接近峰值估值标记付款；下修情景区间
      - - 客户集中度冲击
        - 头部客户敞口高于预期，或续约质量转弱
        - 存量装机耐久性价值下降
        - 要求更大折扣，或直接放弃
      - - 利润率 / 营运资本疲弱
        - 毛利率或现金转化表现显著弱于隐含水平
        - 老股交易估值标记更难成立
        - 立即切换到悲观框架
      - - 没有可信流动性路径
        - IPO 或收购路径仍模糊，同时老股交易需求转弱
        - 持有期拉长，折价率上升
        - 只有入口价格显著更低才投资
      - - 安全 / 支持状态低于预期
        - 管理层无法支撑软件保证和现场支持主张
        - 护城河质量被运营脆弱性抵消
        - 上调风险评级，重新审视投资逻辑
    notes: 触发条件把报告的主要证据缺口转成明确投资条件。
    claimRefs:
      - CV024
      - CV025
      - CV028
      - CV034
      - CV036
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入和利润率资料包
        - 2024-2026 年收入、毛利率、服务负担和订单确认
        - 判断后期轮估值标记是实至名归还是愿景定价的必要证据
        - 索取 CFO 资料包和月度队列数据
      - - 客户集中度和留存
        - 前 10 大敞口、NRR、GRR、续约日历和钱包份额
        - 需要它把客户背书转化为持久价值
        - 索取客户质量仪表盘
      - - G2 部署队列
        - 扇区利用率、附着率、故障率、支持负载和升级经济性
        - 判断 G2 是增量贡献还是会扰动现有部署
        - 要求产品运营审查，并提供队列指标
      - - 股权结构表和优先股堆叠
        - 最新轮融资条款、清算优先权、ROFR 限制和老股交易审批
        - 私营公司真实回报测算的关键依据
        - 要求提供融资文件和律师摘要
      - - 流动性和退出路径
        - IPO 准备度、潜在买方范围和时间假设
        - 用于确定持有期和折现率
        - 要求提供董事会层面的融资和退出计划
    notes: 这些是从公开来源跟踪进入定价测算前的最低要求。
    claimRefs:
      - CV024
      - CV028
      - CV033
      - CV034
      - CV038
      - CV039
