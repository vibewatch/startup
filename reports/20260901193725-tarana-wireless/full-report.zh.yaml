  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Tarana 想解决的问题
        blocks:
          - type: paragraph
            body: >-
              分析 Tarana
              应该放在固定宽带基础设施内，而不是更宽泛的无线或移动核心网市场。公司公开材料持续围绕最后一公里互联网接入展开，服务对象是需要光纤级服务、却不总能支撑光纤级建设经济性的家庭、社区和关键公共机构。这个边界包括农村数字鸿沟项目、高成本郊区和远郊延伸，以及社区自有部署；在这些场景里，运营商必须在速度、覆盖、可靠性和资本强度之间取舍。它不包括纯移动接入、仅限室内
              Wi-Fi 的设备，也不包括无关的电信软件支出。因此，实际替代方案不只是另一家无线电厂商，而是买方完成同一任务的全套路径，包括光纤、HFC、DSL、卫星和传统固定无线。Tarana
              自有的政府、市政和部落页面说得很清楚：买方结构比经典 WISP 采购更宽。公司明确卖给私营 ISP、市政机构、部落社区，以及希望更快或更便宜达到 100/20 Mbps
              及以上的补贴支持网络建设者。因此，本章核心市场问题不是 FWA 有多大，而是宽带资产所有者什么时候会选择光纤-无线混合架构，而不是只靠光纤扩张。
