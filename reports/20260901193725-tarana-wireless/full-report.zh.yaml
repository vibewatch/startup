      - number: '8.4'
        title: 建议：观察或继续研究，但入场纪律要严，并设置明确尽调关口
        blocks:
          - type: paragraph
            body: >-
              最终建议不是否定
              Tarana，而是拒绝虚假的精确。公司看上去有战略价值，商业化也真实；但公开记录仍然太薄，不足以在没有更深管理层资料包的情况下，按最高的可见标记附近付款。投资人应要求拿到最新收入、毛利率、营运资本、客户集中度、留存和
              G2 部署队列数据，再决定是否锚定接近 Forge 2025 年高点的估值。如果管理层能补齐这些缺口，并确认 G2
              在扩大有利润的钱包份额，而不只是制造新的支持负担，上行情景仍然可信。如果这些缺口仍未解决，正确姿态是耐心跟踪，并用更低入场门槛补偿非流动性、信息不对称，以及下一轮融资或流动性事件低于预期时的后期下行。因此，Tarana
              是一个有真实上行空间、但仍需继续研究的标的，不是可以不看价格买入的标的。
