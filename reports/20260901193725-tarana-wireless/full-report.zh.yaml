      - number: '1.4'
        title: 里程碑、认可和反向信号
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，Tarana 正从商业化证明走向生态管理和政策博弈。2021 年，公司仍把自己包装成突破性技术努力；到 2021 年末和 2022 年初，它已开始谈论 G1 快速采用、可覆盖 50 万户家庭、超过
              120 家服务提供商客户，以及首年收入运行率超过 $100 million。2024 年 Inc. 5000 排名和 2025 年再次入榜，强化了一个判断：公司的商业化弧线是真实的，不只是愿景。Tarana 的
              2026 年客户活动议程随后把重心从基础产品教育，转向网络 ROI、商业智能和客户筛选；这符合一家供应商帮助运营商工业化部署、而非继续试点技术时的典型动作。


              反向图景比“技术胜利”叙事更复杂。Fierce Network 和 Benton 都报道了 Carl Guardino 的承认：固定无线在早期 BEAD 结果中表现不佳，只赢得约 11% 合格地点。Total
              Telecom 另行报道 Tarana 攻击 Starlink 的 BEAD 豁免请求，凸显公司暴露在项目设计和竞争游说之下，不只是产品质量之下。公开来源也未披露当前
              ARR、毛利率、烧钱速度或完整股权结构表；本次审阅集中唯一可见的诉讼信号，是一个无法访问的 PacerMonitor 案件条目，其重要性无法仅靠公开网页证据判断。这个组合让 Tarana
              看起来令人印象深刻，但透明度仍不足以仅凭叙事做投资判断。
