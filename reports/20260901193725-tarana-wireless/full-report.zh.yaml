      - - 困难地理区域的户均成本
        - Tarana 光纤研究称，代表性数字鸿沟项目户均成本为 $13.9k
        - ngFWA 主打稀疏地区低资本开支替代方案
        - Tarana 的估算勾勒出高成本切口，但来源是厂商自己
        - 用客户项目和州级中标预算验证
      - - 部署时间
        - 市政、balanced-diet 和 BEAD 材料都强调：无线部署按月计，重开沟建设按年计
        - 补助时间线紧时，快速开通服务是核心采用驱动
        - 许可仍然要过，但避开开沟的价值是真实的
        - 需要平均从许可到安装周期的证据
      - - 性能上限
        - 传统 FWA 常意味着 1-50 Mbps 或视距限制；GSA 报告 5G FWA 宣传峰值均值为 774.7 Mbps
        - Tarana 声称，千兆级 NLoS 性能缩小了与有线网络的质量差距
        - 独立市场数据支持高性能 FWA 这一品类，不支持 Tarana 特定优势
        - 需要按环境拆分的第三方性能测试
      - - 监管资格
        - BEAD 可靠性规则偏向授权或混合频谱，可能排除仅用免授权频谱的方案
        - 买方能用 CBRS 或混合设计时，Tarana 受益
        - 政策适配和无线电性能一样重要
        - 需要逐州地图，标出 Tarana 的频谱假设在哪些州有竞争力
      - - 竞争性替代动能
        - CostQuest 和 FBA 显示，美国光纤仍在快速扩张
        - 光纤到达边缘地区前，Tarana 必须靠经济性和时间窗口赢下项目
        - 光纤既是标杆，也是移动很快的替代品
        - 需要把管线拆成绿地缺口和受光纤威胁区域
    notes: 本表比较真实市场决策变量，而不是抽象技术营销话术。
