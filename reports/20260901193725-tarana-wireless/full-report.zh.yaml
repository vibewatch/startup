      - number: '4.4'
        title: 财务结论，以及仍卡住投资判断的缺失数据
        blocks:
          - type: paragraph
            body: >-
              公开记录足以得出结论：Tarana
              不是还停在收入前的概念故事。公司似乎已经完成可观的硬件商业化、吸引成熟资本、维持大型技术员工队伍，并继续发布新的认证产品。但公开记录还不足以证明，这门生意具备高质量、可规模化的经济性。公司没有公开披露手头现金、月烧钱、现金跑道、毛利率、库存位置、债务、应收账款质量、保修风险敞口、客户集中度或续约
              / 流失。标价基本缺席，因此即便商业动能存在，也无法干净转译为收入质量。UpMarket、Notice 和 Hiive
              等二级市场页面可作为私有股票流动性存在的信号；但它们也反过来凸显，可用市场数据既薄又带有投机性。因此，最合适的尽调立场既不是乐观外推，也不是一刀切怀疑。Tarana
              可能拥有继续经营和创新所需的资本基础与收入规模，但投资人在判断毛利耐久性、资产负债表韧性，或未来增长多大程度依赖补贴、厂商融资或少数运营商客户之前，仍需要管理层直接披露。
