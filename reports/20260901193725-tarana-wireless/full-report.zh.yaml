              最终客户结论是：采用真实性为正，客户经济性不完整。Tarana
              显然已有足够具名部署，可以排除“仍处于产品前或客户前”的想法。但最强证据大多是公司策划或客户引述的材料，而不是独立组合分析。客户主页验证这些具名运营商存在，并服务真实市场，但它们不揭示 Tarana
