  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律敞口集中在频谱规则、认证节奏和可防御 IP
        blocks:
          - type: paragraph
            body: >-
              Tarana 的产品承诺离不开电信监管。其无线电运行在 CBRS 和 6 GHz 框架内，这些框架会借助 SAS 和 AFC 协调改变可用信道、功率限制和部署行为。Tarana 自有材料明确表示，DPA
              事件、现有用户保护和标准功率运行规则都可能改变实际性能边界；也就是说，监管风险内嵌在产品中，而不是停在业务边缘。客户故事又增加了一层：许多旗舰部署绑定政府资助宽带项目，其规则、授予和时间安排会影响需求形态。法律侧，公开记录突出的是专利和授权，而不是诉讼。这令人鼓舞，但不能排除风险。它说明，当前法律风险画像与其说是可见的进行中诉讼，不如说是维持自由实施空间、守住差异化
              PHY 层 IP，并在新频段和新司法辖区持续出货获批硬件。
