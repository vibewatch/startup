companyProfile:
  summary: >-
    Tarana Wireless 是一家私有宽带基础设施公司，2009 年成立，目标是重做固定无线接入。经过十多年 R&D 和超过 $400 million 的累计投入，公司搭出下一代固定无线接入栈，覆盖 G1/G2
    接入硬件、远端节点和 Tarana Cloud Suite。产品叙事很具体：借助干扰抵消、波束成形、频谱效率和多频段频谱运行，在非视距链路上交付光纤级宽带。


    公开证据显示，Tarana 已明显越过原型阶段。官方和面向客户的材料现在指向 24 个国家、47 个美国州超过 300 家运营商客户；案例研究则显示，农村
    WISP、社区宽带提供商、ILEC，以及至少一个运营商品牌宽带合作关系都已有生产部署。真正的开放问题不是产品是否存在、客户是否真实，而是 Tarana 的经济性、客户集中度、支持负担和 G2
    推出质量，是否足以支撑接近最高可见二级市场标记的后期私有估值。
  foundedDate: '2009-01-01'
  founders:
