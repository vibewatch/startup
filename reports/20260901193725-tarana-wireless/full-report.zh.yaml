      - CV020
      - CV021
      - CV029
      - CV030
      - CV031
      - CV035
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Nokia
        - 市值和报告规模
        - ~$55.59B 市值；2026 年 Q2 净销售额 €4.8bn
        - 展示成熟全球基础设施公司的规模形态
        - 多元化和规模都远超 Tarana，不能直接套用倍数
      - - Ericsson
        - 市值
        - ~$32.88B 市值
        - 可作为电信基础设施基准
        - 规模和业务组合仍与 Tarana 相距很远
      - - Inseego
        - 市值
        - ~$66.08M 市值
        - 可作为小型上市 FWA 邻近参考
        - 可能反映完全不同的产品质量和市场位置
      - - Cambium Networks
        - 市值 / 上市发行人状态
        - ~$11.32M 市值；公开 SEC 和 IR 渠道仍活跃
        - 可作上市 FWA 参考点
        - 类困境估值让直接使用倍数很危险
    notes: 该组合有意拉宽，因为没有哪家上市公司能和 Tarana 一一匹配。
