      - number: '2.2'
        title: 规模测算视角，以及替代技术的经济性
        blocks:
          - type: paragraph
            body: >-
              公开记录支持多个市场视角，但没有一个干净的 Tarana 专属总可用市场（TAM）。Tarana 自有光纤研究材料把美国机会锚定在服务不足家庭和政府支持建设上：五个州 132 个代表性项目、52,700
              户家庭，平均模型成本为每户 $13,900。Tarana 进一步推算，若只用光纤触达约 16 million 个未服务或服务不足的美国家庭，成本将超过 $200 billion，远高于 $42.45
              billion 的 BEAD 项目预算。即便这些公司撰写的估算带有方向性动机，它们也确立了 Tarana 瞄准的资本难题。独立来源验证了上位市场真实存在。Ericsson 和 GSA 都把 FWA 描述为
              2026 年的主流全球接入品类；FCC 和 CostQuest 数据则显示，即使光纤快速扩张，美国仍有实质性的接入和竞争缺口。由此可见，Tarana
              的机会既不是整个宽带市场，也不只是小众应急替代品。它位于一个经济上难啃的楔形地带：买方希望快速获得高吞吐，却不总能承担开沟、许可或逐户光纤成本。这是一个真实市场，但必须按地理、资金机制和替代经济性设边界，而不是把一个收入倍数套到全部宽带资本开支上。
