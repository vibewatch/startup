      - number: '7.4'
        title: 缓释因素存在，但必须持续盯住 G2 执行和隐藏的资产负债表压力
        blocks:
          - type: paragraph
            body: >-
              Tarana 不是一张白纸式的风险故事。公司有可见的缓释因素：真实的专利组合、运营商背书、认证进展、引导式部署内容，以及 G1
              这个已经验证的一代产品。上述因素降低了业务纯靠宣传撑起来的概率。但它们没有回答最关键的投资问题。向 G2
              过渡，是典型的规模化拐点；支持人员、供应约束、认证滞后、云可靠性、客户集中度或营运资本压力，任何隐藏弱点都会因为需求看上去最强而变得更痛。投资上最有用的框架，是把“技术和客户证据”与“规模能被安全管理的证据”分开。前者公开且相当强，后者仍需尽调。因此，纪律严明的投资人应围绕认证延误、客户集中、留存恶化、安全保障，以及
              G2 部署相对更成熟 G1 基础的经济性，设定明确的否决条件。
