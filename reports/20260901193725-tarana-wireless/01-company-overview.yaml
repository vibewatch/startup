- id: milestones-recognition-and-adverse-signals
  title: Milestones, recognition, and adverse signals
  body: |-
    The public chronology shows Tarana moving from commercialization proof toward ecosystem management and policy combat. In 2021 the company was still framing itself as a breakthrough technology effort, yet by late 2021 and early 2022 it was already talking about rapid G1 adoption, half a million households passed, more than 120 service-provider customers, and a run rate above $100 million in first-year revenue. The 2024 Inc. 5000 ranking and 2025 repeat appearance reinforce that the company’s commercialization arc has been real rather than purely aspirational. Tarana’s 2026 customer event agenda then shifts the emphasis from basic product education toward network ROI, business intelligence, and customer qualification, which is typical of a vendor trying to help operators industrialize deployment rather than pilot technology.

    The adverse picture is more nuanced than a simple technology-victory story. Fierce Network and Benton both reported Carl Guardino’s acknowledgement that fixed wireless underperformed in early BEAD results, winning only about 11% of eligible locations. Total Telecom separately reported Tarana’s attack on Starlink’s BEAD waiver requests, underscoring how exposed the company is to program design and competitive lobbying, not just product quality. Public sources also fail to disclose current ARR, gross margin, burn, or a full cap table, and the only visible litigation signal in the reviewed set is an inaccessible PacerMonitor case stub whose materiality cannot be judged from public web evidence alone. That combination makes Tarana impressive, but still not transparent enough to underwrite on narrative alone.
