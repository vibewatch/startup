  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR, gross margin, profitability, burn, and cash runway are not publicly quantified in the reviewed source set.
    whyItMatters: These are the core underwriting metrics for a late-stage infrastructure company and materially affect valuation, dilution risk, and IPO readiness.
    diligencePath: Request board materials or investor update decks with current ARR, gross margin, burn, and cash balances from management.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: The public record does not disclose Tarana’s current cap table, debt stack, or verified details of any post-2023 confidential financing, mezzanine, or IPO steps.
    whyItMatters: Without capital-structure detail, it is impossible to judge liquidation preferences, debt service, insider support, or whether the 2022 unicorn valuation still maps cleanly to current equity value.
    diligencePath: Request the latest capitalization table, debt schedule, and any 2024-2026 financing memos from management or existing investors.
    relatedQuestionRefs:
    - QO029
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Tarana publishes biographies for named leaders and board members but not committee structure, independence designations, or formal succession plans.
    whyItMatters: Governance depth matters because Tarana is now large enough that commercialization, policy exposure, and manufacturing execution should not rely on an opaque board process.
    diligencePath: Request board committee charters, attendance records, and a management succession plan.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: access-blocked
    severity: material
    topic: legal
    missingEvidence: The reviewed public litigation signal is limited to an inaccessible PacerMonitor case stub for Luterman v. Tarana Wireless, Inc.
    whyItMatters: Even a single employment or commercial dispute may be immaterial, but investors need the pleadings and docket history to judge severity, insurance coverage, and reputational risk.
    diligencePath: Pull the complaint and docket directly from PACER or ask company counsel for a litigation schedule.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO004
