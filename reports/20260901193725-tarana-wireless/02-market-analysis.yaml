tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance
  rows:
  - - Rural digital-divide fixed broadband
    - Last-mile broadband infrastructure, towers, radios, backhaul extensions, installation, and subscriber equipment for unserved or underserved locations
    - Purely mobile service, indoor Wi-Fi only, or unrelated telecom software budgets
    - Independent ISP / public-funding sponsor
    - Core use case across Tarana BEAD and government materials
  - - Mainstream suburban and exurban broadband expansion
    - Hybrid fiber-wireless network capex for faster market entry or cheaper edge expansion
    - Long-haul core transport, handset plans, or enterprise campus networking
    - Regional ISP / private operator
    - Important because Tarana positions ngFWA for mainstream as well as divide projects
  - - Municipal community connectivity
    - Residential broadband plus public-safety, utilities, traffic, surveillance, and smart-meter connectivity
    - General civic IT software spend
    - City or county government
    - Explicit Tarana vertical with distinct public budget owners
  - - Tribal connectivity
    - Household broadband, anchor institutions, and community-service connectivity on tribal lands
    - Consumer electronics or mobile-only coverage
    - Tribal government / tribal telecom entity
    - Explicit Tarana vertical tied to sovereignty, remoteness, and grant access
  - - Grant-backed rural broadband programs
    - BEAD, ReConnect, ARPA, and state broadband grant-funded deployment budgets
    - Unrelated corporate M&A or spectrum trading budgets
    - State, local, tribal, or operator applicants
    - Funding pathway often determines whether the project exists
  - - Status-quo substitutes
    - Fiber, HFC, DSL, LEO satellite, and legacy line-of-sight FWA used to solve the same household broadband job
    - Unrelated fixed-enterprise LAN gear
    - Household via service provider / network owner
    - True comparison set for Tarana procurement decisions
  notes: The relevant market is defined by the fixed-broadband job to be done and the economics of reaching hard locations, not by the entire wireless equipment stack.
