- id: buyer-user-payer-map-and-adoption-path
  title: Buyer, user, payer, and adoption path
  body: Tarana’s buyer map is unusually heterogeneous for an infrastructure startup. The immediate user of the equipment is typically an ISP or network operator, but the economic sponsor can be a municipality, tribal government, state broadband office, lender, or federal grant program. Public Tarana materials market directly to government officials, municipalities, and tribal organizations, while USDA ReConnect documents show that corporations, cooperatives, and state, local, and tribal governments can all be eligible applicants for rural broadband funding. In practice, that creates a layered adoption path. First, a broadband owner identifies a territory where fiber economics or deployment time are weak. Next, it assembles spectrum, site access, and often a subsidy or financing package. Then it must clear regulatory or administrative steps such as BEAD reliability rules, state challenge processes, or local permitting, before building the network and activating households. The end user is
    still a household, school, clinic, or small business, but the decision process is institutional and budget-driven long before a subscriber sees a CPE. That matters for diligence because sales efficiency depends on Tarana’s ability to influence program design, prove deployment economics, and help operators navigate funding workflows instead of merely winning a technical bake-off.
