- id: drivers-constraints-and-disconfirming-evidence
  title: Growth drivers, constraints, and disconfirming evidence
  body: 'The bullish case for Tarana’s market is straightforward: large broadband-need pools remain, public funding has normalized government involvement in last-mile builds, fiber deployment costs are rising, and global FWA adoption keeps broadening. But the same sources show why market access is not automatic. Fiber keeps gaining share and now reaches more than 60% of U.S. households according to independent fiber sources, which means Tarana often competes against a substitute that is becoming both more prevalent and politically favored. FCC and Tarana materials also show that regulatory definitions matter. Under BEAD, reliability tests, spectrum mix, and challenge-process documentation can determine whether an operator is eligible at all. Permitting remains another hidden throttle. Broadband Breakfast’s 2026 coverage makes clear that even fixed-wireless advocates see permits, tower approvals, and state-level requirements as time and cost bottlenecks. Most importantly, Benton reported
    Tarana’s own policy lead acknowledging that fixed wireless initially captured only about 11% of BEAD-eligible locations, versus roughly 67% for fiber providers. That is the chapter’s key adverse fact: Tarana’s market thesis may be correct in economics, yet still convert more slowly in awards if political, procurement, and technology-preference dynamics favor fiber-first decisions.'
