- id: sizing-lenses-and-substitute-economics
  title: Sizing lenses and the economics of substitute technologies
  body: 'The public record supports multiple market lenses, but not one clean Tarana-specific TAM. Tarana’s own fiber-study materials anchor the U.S. opportunity around underserved households and government-backed builds: 132 representative projects across five states, 52,700 homes, and an average modeled cost of $13,900 per home. Tarana then extrapolates a fiber-only cost above $200 billion to reach roughly 16 million unserved or underserved U.S. households, far above the $42.45 billion BEAD program budget. Even if those company-authored estimates are directionally motivated, they establish the capital problem Tarana is targeting. Independent sources validate that the outer market is real. Ericsson and GSA both describe FWA as a mainstream global access category in 2026, while FCC and CostQuest data show the U.S. still has meaningful access and competition gaps even as fiber keeps expanding quickly. The implication is that Tarana’s opportunity is neither the whole broadband market nor just
    a niche emergency substitute. It sits in the economically difficult wedge where buyers want high throughput quickly, but cannot always support trenching, permitting, or per-home fiber costs. That is a real market, but it has to be bounded by geography, funding mechanics, and substitute economics rather than by a single revenue multiple applied to all broadband capex.'
