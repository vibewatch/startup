  rows:
  - - Independent WISPs and regional ISPs
    - Network owner / operator
    - Households and SMBs
    - Operator capex plus subscriber payments and sometimes grants
    - Site selection, spectrum plan, tower build, CPE install
    - CEO / network operations / finance
    - Underserved territory where fiber is too slow or too expensive
  - - Municipal broadband projects
    - City or county government
    - Residents, public works, police, utilities, events
    - Municipal budget plus grants
    - Community planning, procurement, deployment, department activation
    - City manager / public works / broadband office
    - Economic development, public safety, and faster buildout
  - - Tribal connectivity projects
    - Tribal government or tribal telecom arm
    - Households, schools, clinics, community facilities
    - Tribal funds, federal grants, and operator budgets
    - Community consultation, terrain planning, deployment to homes and anchors
    - Tribal leadership / grant office
    - Hard-to-serve geography and need for essential services
  - - Grant-backed state programs
    - State broadband office selects or funds operator proposals
    - Households reached through funded provider
    - Federal pass-through plus state match
    - Eligibility mapping, challenge process, grant award, build verification
    - State broadband administrator
    - Closing coverage gaps under statutory timelines
  - - Hybrid fiber-wireless expansion operators
    - Regional telco or converged ISP
    - Mixed residential and business users
    - Operator capex, debt, or partner finance
    - Use fiber for trunk/backhaul and wireless for difficult last mile
    - Network strategy and finance
    - Need to expand fast without trenching every mile
  notes: The payer and the network operator are often not the same entity, which increases sales complexity but widens the reachable buyer pool.
