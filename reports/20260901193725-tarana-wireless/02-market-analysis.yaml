- id: TM005
  title: Growth drivers and constraints table
  columns:
  - Driver/constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - BEAD and other public-funding programs
    - positive
    - Current
    - Program budgets create projects that might not pencil out on private ROI alone
    - Quantify pipeline exposure by program and state
  - - Global FWA mainstreaming
    - positive
    - Current to medium term
    - Makes buyer education easier because high-performance FWA is no longer a fringe concept
    - Separate category tailwind from Tarana-specific market share
  - - Rising fiber deployment costs
    - positive
    - Current
    - Improves relative economics for wireless in sparse or difficult builds
    - Test whether operators use savings to accelerate bids or just preserve margins
  - - Permitting and administrative burden
    - negative
    - Current
    - Can slow projects even when wireless avoids trenching
    - Request average tower, zoning, and challenge-process cycle times
  - - Fiber political preference and fast substitute expansion
    - negative
    - Current to medium term
    - Tarana may lose awards or greenfield share even where economics favor wireless
    - Review competitive losses against fiber in state programs
  - - Early fixed-wireless BEAD underperformance
    - negative
    - Current
    - Suggests addressable need converts into awards more slowly than advocates expected
    - Compare management pipeline assumptions with actual awards and location counts
  - - Overbuild and reliability definitions
    - mixed
    - Current
    - Some operators can defend territory with reliable FWA, while unlicensed-only networks are exposed
    - Map customer spectrum mix and challenge eligibility
  - - Proof from first BEAD-funded household deployments
    - positive
    - Near term
    - Real live deployments can reduce buyer skepticism if performance holds
    - Gather longitudinal QoS and churn data from first deployments
  notes: The opportunity is real, but conversion depends on policy execution and substitute dynamics as much as on radio capability.
