  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Tarana’s relevant market narrows quickly from broad broadband need to the hard-to-serve wedge where funding, terrain, and time-to-build make hybrid fiber-wireless architectures attractive.
  data:
    items:
    - label: Global FWA category adoption
      detail: Ericsson and GSA both show that FWA is already mainstream across hundreds of operators and countries in 2026.
      tone: positive
    - label: U.S. broadband-need and budget shell
      detail: FCC access gaps and the $42.45B BEAD budget create a large outer market for closing service gaps.
      tone: positive
    - label: High-cost and slow-to-build territories
      detail: Tarana’s fiber-study and TCO materials focus on the sparse, difficult, or time-sensitive geographies where trenching economics are weakest.
      tone: warning
    - label: Tarana-addressable hybrid-build wedge
      detail: The real SAM is the subset of projects where licensed or hybrid spectrum, grant rules, and operator workflow all align around ngFWA.
      tone: neutral
  approximationNotes: Each layer is a different evidence-backed boundary condition rather than a single published TAM stack.
