  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-sizing
    missingEvidence: No public source isolates Tarana’s serviceable available market by geography, spectrum mix, or buyer class.
    whyItMatters: A late-stage valuation case requires knowing how much of the apparent broadband need actually matches Tarana’s deployment sweet spot.
    diligencePath: Request pipeline segmentation by buyer class, spectrum mode, geography, and funding source.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: state-level-award-conversion
    missingEvidence: The reviewed public set does not provide a clean state-by-state breakdown of BEAD locations that are realistically addressable by Tarana-compatible architectures.
    whyItMatters: Early award capture depends on state program design and challenge outcomes, not just national funding totals.
    diligencePath: Build a state-level matrix using state broadband-office awards, spectrum availability, and operator relationships.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Public materials do not disclose how much demand comes from mainstream share-gain deployments versus grant-funded rural builds.
    whyItMatters: The two channels have very different sales cycles, margins, and policy risk.
    diligencePath: Ask management for bookings and pipeline mix by commercial expansion, government-funded builds, and public-sector networks.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
    - TM005
