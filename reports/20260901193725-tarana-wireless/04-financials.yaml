  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: No public source in the reviewed set discloses Tarana’s current cash balance, monthly burn, or runway.
    whyItMatters: A late-stage hardware business cannot be underwritten on historical raises alone because working-capital demands can consume cash quickly.
    diligencePath: Request current cash, 13-week cash forecast, monthly burn, runway base/downside cases, and financing triggers.
    relatedQuestionRefs:
    - QI007
    - QI018
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-working-capital
    missingEvidence: Public sources do not disclose gross margin, inventory turns, DSO, payables terms, warranty reserves, or services burden.
    whyItMatters: These are the core metrics needed to decide whether Tarana’s growth is value creating or merely capital consuming.
    diligencePath: Request a full unit-economics and working-capital packet covering product-line gross margin, supplier concentration, warranty costs, and inventory aging.
    relatedQuestionRefs:
    - QI011
    - QI025
    relatedTableRefs:
    - TI004
    - TI006
  - type: stale
    severity: material
    topic: revenue-disclosure-quality
    missingEvidence: The strongest revenue datapoints are still company statements from 2022 and 2023 rather than current audited or near-current disclosures.
    whyItMatters: Historical traction does not answer whether growth, margins, or cash conversion improved or deteriorated into 2025-2026.
    diligencePath: Request audited or management-certified monthly revenue, bookings, backlog, gross margin, and churn for 2024-2026.
    relatedQuestionRefs:
    - QI003
    - QI023
    relatedTableRefs:
    - TI003
    - TI004
    - TI006
