- id: TI005
  title: Capital adequacy table
  columns:
  - Item
  - Value / status
  - Why it matters
  - Diligence ask
  rows:
  - - $170M Mar 2022 round at $1B valuation
    - Verified by official release and Tracxn
    - Established unicorn-scale financing before broader 2023 follow-on
    - Confirm liquidation preferences and use of proceeds remaining
  - - $50M Sep 2023 Series D led by Digital Alpha
    - Verified by official release and Tracxn
    - Extended balance-sheet capacity and supported growth plus R&D
    - Confirm current cash balance from this round and draw on any side facilities
  - - Total historical funding
    - $426M over 8 rounds per Tracxn; over $400M invested per Tarana
    - Shows late-stage capital intensity and significant backer support
    - Reconcile official cumulative capital raised with cap table and any debt
  - - Working-capital pressure
    - Management says growth created higher working capital requirements
    - Hardware growth can consume cash even when revenue rises
    - Provide inventory, receivables, payables, and build-plan detail
  - - Cash on hand and runway
    - 'null'
    - Core underwriting blocker despite strong historical fund-raising
    - Provide current cash, burn, runway, and covenant status
  - - Debt / project-finance obligations
    - 'null'
    - Could materially change risk if customer financing or inventory lines exist
    - Provide all credit facilities, guarantees, and off-balance-sheet obligations
  notes: Capital history looks strong, but present adequacy cannot be confirmed without direct cash and liability disclosure.
