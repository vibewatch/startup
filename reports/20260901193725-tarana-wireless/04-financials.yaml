tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Base-node and remote-node hardware sales
    - Operators buy access equipment for deployments
    - Per deployment / per node
    - Commercially material but undisclosed
    - Likely large share of revenue; hardware timing and working capital matter
    - Break out hardware revenue by product family and geography
  - - Tarana Cloud Suite / software management
    - Cloud management, SON tools, provisioning, monitoring
    - Per network / bundled with platform
    - Publicly visible as product layer, but revenue share undisclosed
    - Could improve stickiness, but recurring mix is unknown
    - Disclose software attachment rate and recurring revenue share
  - - Deployment support and operator enablement
    - Field design, installation support, troubleshooting, network planning
    - Services / project support
    - Present in product story but no standalone figures
    - May aid adoption but margins and scale economics are unclear
    - Provide services revenue and gross-margin profile
  - - Customer-financing enablement
    - Digital Alpha revenue-share funding helps customers expand G1 deployments
    - Financing-facilitated sales
    - Indirect monetization enabler rather than explicit revenue line
    - Can accelerate orders but may increase dependency on external financiers
    - Quantify what share of bookings involve partner financing
  - - Future platform upgrades
    - G1x2, G2, and multiband upgrades into installed base
    - Upgrade cycle
    - Visible in product releases, not in revenue disclosure
    - Potentially attractive if attach rates and upgrade pricing hold
    - Provide installed-base expansion and upgrade conversion data
  notes: The public record implies multiple monetization layers, but management does not disclose the mix between hardware, software, and services.
