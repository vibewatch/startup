- id: public-traction-and-workforce-signals
  title: Public traction proxies and workforce signals
  body: 'Because Tarana is private, workforce and deployment proxies matter almost as much as revenue statements. Public company claims show operator adoption rising from more than 120 service providers in early 2022 to 190 ISPs in eight countries in late 2022, to more than 270 providers in 19 countries in 2023, and then more than 300 operators with a 20 million-home-and-business coverage footprint by late 2025. None of these figures alone proves high-quality recurring revenue, but together they strongly suggest large shipment volumes and a nontrivial installed base. Revelio adds a more grounded labor-market signal: approximately 484 employees worldwide as of March 2026, with the workforce recovering after a dip in 2024 and engineering remaining the largest function. The same source shows hiring still active rather than frozen. That is consistent with a company still funding R&D, operations, and go-to-market rather than one that has shifted entirely into austerity. The caution is that different
    third-party datasets do not align perfectly. Tracxn lists a lower latest employee count for the main U.S. entity than Revelio reports globally, and IncFact’s revenue bracket is explicitly a statistical evaluation for a private company. These are useful triangulation points, but they do not replace audited disclosures on revenue quality, backlog, utilization, or customer concentration.'
