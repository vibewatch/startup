- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Current cash balance and runway
    - Cannot assess solvency cushion or financing urgency
    - Request current cash, monthly burn, runway scenario, and next-round triggers
  - - Gross margin by product line
    - Cannot judge whether hardware scale is economically attractive
    - Request product-line gross margins, warranty costs, and service burden
  - - Revenue mix by hardware / software / services
    - Cannot determine quality or recurrence of revenue
    - Request revenue segmentation and software attach rates
  - - Inventory and receivables metrics
    - Cannot assess working-capital drag or supply-chain stress
    - Request inventory turns, DSO, backlog, and obsolete stock reserves
  - - Customer concentration and churn / renewal
    - Cannot assess durability of revenue base
    - Request top-customer list, cohort retention, and order concentration
  - - Debt, vendor financing exposure, and guarantees
    - Cannot determine hidden leverage or obligations tied to customer financing
    - Request all facilities, guarantees, and financing side letters
  notes: The biggest blockers are not whether Tarana has revenue, but whether that revenue is profitable, durable, and cash-efficient.
