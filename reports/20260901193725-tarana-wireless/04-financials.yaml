  - CI005
  - CI006
  - CI020
- title: Capital intensity is underappreciated
  calloutType: risk
  body: Tarana’s hardware, certification, and customer-financing dynamics make it economically closer to infrastructure equipment than to pure software, which raises the bar for cash and working-capital disclosure.
