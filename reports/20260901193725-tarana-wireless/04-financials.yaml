- id: capital-adequacy-and-balance-sheet-implications
  title: Capital adequacy and balance-sheet implications
  body: Tarana’s capital history is large enough to matter operationally even if the current cash balance is undisclosed. Official and third-party funding sources align on the $170 million March 2022 round at a $1 billion valuation and a further $50 million Series D in September 2023 led by Digital Alpha. Tarana’s own materials also say over $400 million has been invested in the company’s technology, while Tracxn currently puts total funding at $426 million across eight rounds and 20 investors. That is the profile of a capital-intensive infrastructure company, not a lightweight software vendor. The operational consequence is visible in both company narrative and filing cadence. Tarana’s FAQ explicitly describes manufacturing as difficult under supply-chain pressure, while FCC filing aggregators show a steady stream of experimental authorizations and product certifications through 2025 across base nodes, remote nodes, and multiband/G2 equipment. Those signals imply a real need for inventory,
    certification, lab work, field support, and continued silicon or hardware iteration. The 2023 Digital Alpha round is especially important because management said rapid growth had increased working-capital requirements and because the investor was also funding Tarana customers. That can be positive for demand acceleration, but it also means some sales momentum may depend on financing availability outside Tarana’s direct control.
