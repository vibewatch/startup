- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Initial proof-of-performance then broader tower rollout
    - A few large operators may drive a disproportionate share of deployments
    - High if top accounts slow or dual-source
    - Request top-10 customer revenue, node count, and backlog by account
  - - G2 upgrade path inside existing customers
    - Upgrade economics may differ from first-generation install economics
    - Medium to high
    - Request attach rate from G1 to G2 and gross margin by generation
  - - County / grant-funded projects
    - Public funding cycles can front-load visible wins without proving steady demand
    - Medium
    - 'Request bookings mix: grant-backed vs purely commercial'
  - - Urban or competitive-overbuild use cases
    - Success may depend on local incumbent response and field execution
    - Medium
    - Request win/loss data versus fiber, cable, and satellite
  - - Company-curated case-study engine
    - Proof is plentiful, but independent portfolio analytics remain sparse
    - High for diligence quality
    - Request customer references chosen by geography, size, and outcome variance
  notes: The table separates visible expansion motion from still-undisclosed concentration and renewal economics.
