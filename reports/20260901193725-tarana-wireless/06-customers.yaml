chapter:
  number: 6
  title: Customers
  summary: Tarana’s paying customers are service providers, not end-consumers, and the public evidence shows real production adoption across rural WISPs, hybrid fiber-wireless operators, community broadband groups, ILECs, and at least one wireless carrier. The strongest proof is in named deployment case studies with deployment, speed, and churn anecdotes; the weakest proof is portfolio-level retention, concentration, and contract-economics disclosure.
sections:
- id: customer-segments-and-buyer-map
  title: 'The buyer is the operator: Tarana sells into service-provider workflows across multiple segment types'
  body: 'The public customer record makes Tarana’s go-to-market model clear: the company sells its ngFWA platform to broadband operators that then package the end service under their own brands. Those operator customers are not homogeneous. The reviewed set includes rural and regional WISPs such as Nextlink, Watch, unWired, Smart Way, and Resound; community or nonprofit broadband operators such as DigitalC; incumbent local exchange carriers such as CentraCom; and carrier-branded fixed-wireless service via UScellular. The use cases also span more than one demand environment. Some customers use Tarana to close rural coverage gaps and satisfy subsidy obligations quickly, while others use it to defend share against cable, fiber, or satellite alternatives, and still others use it to enter denser or historically harder-to-serve neighborhoods. That breadth is important because it shows Tarana is not limited to a single niche buyer persona, even if service-provider channels still remain the company’s

    overwhelming distribution path.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU009
