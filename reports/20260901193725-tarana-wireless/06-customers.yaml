- id: durability-satisfaction-and-expansion
  title: Durability evidence exists, but mostly as local anecdotes rather than portfolio-level retention disclosure
  body: 'Customer durability is visible in the public record, but it is unevenly measured. A few operator stories are unusually specific: AtLink discloses legacy churn and post-upgrade churn, Crowsnest ties Tarana upgrades to keeping subscribers from defecting to Starlink, DigitalC cites strong customer reviews, and unWired describes lower prices, reduced churn, and better word of mouth. These are meaningful signals because they speak directly to whether Tarana changes the operator’s retail proposition rather than merely adding a new radio. Still, they remain customer-by-customer anecdotes. No public source in the reviewed set discloses net revenue retention, gross revenue retention, renewal percentages, contract length, or attach-rate expansion across Tarana’s customer base. The result is that expansion appears real — more towers, more sectors, more upgrades, and more regions — but durability is not measured in a portfolio-quality way that an investor would normally want before underwriting

    concentration or long-term installed-base economics.'
  claimRefs:
