- title: Durability evidence is thinner than deployment evidence
  calloutType: risk
  body: Tarana’s customer pages are rich on speeds, towers, and upgrade stories but sparse on renewal, revenue concentration, or contract-value disclosure, so adoption strength should not be mistaken for fully underwritten customer quality.
