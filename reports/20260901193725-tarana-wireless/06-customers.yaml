  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: portfolio-retention-metrics
    missingEvidence: No public source in the reviewed set discloses NRR, GRR, renewal rates, cohort churn, or average contract duration across Tarana’s customer base.
    whyItMatters: Without cohort retention, it is impossible to distinguish a strong installed base from a fast-moving but brittle one.
    diligencePath: Request customer-retention dashboards by vintage, geography, and product generation, plus top-account renewal schedules.
    relatedQuestionRefs:
    - QU015
    - QU026
    relatedTableRefs:
    - TU004
    - TU006
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-share-of-wallet
    missingEvidence: The public record does not reveal top-customer revenue, node concentration, backlog by operator, or Tarana’s vendor share inside mixed-technology customers.
    whyItMatters: A broad logo set can still hide major exposure to a few operators or weak economics inside flagship accounts.
    diligencePath: Request top-10 customer exposure, product mix, backlog, expansion pipeline, and wallet-share trends for Nextlink, unWired, and other major accounts.
    relatedQuestionRefs:
    - QU021
    - QU026
    relatedTableRefs:
    - TU005
    - TU006
  - type: access-blocked
    severity: material
    topic: independent-review-surface
    missingEvidence: Independent review triangulation was limited because Gartner’s review page was blocked and customer websites rarely discuss vendor-level implementation experience.
    whyItMatters: Third-party review surfaces can surface friction, support quality, or hidden deployment issues not present in curated case studies.
    diligencePath: Request unfiltered customer references and gather neutral operator feedback from forums, conferences, and support communities with permission.
    relatedQuestionRefs:
    - QU023
    - QU024
    relatedTableRefs:
    - TU003
    - TU006
