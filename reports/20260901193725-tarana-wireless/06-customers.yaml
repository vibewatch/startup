- id: concentration-and-final-customer-verdict
  title: The proof set is real, but still heavily company-curated and thin on concentration economics
  body: 'The final customer verdict is positive on adoption reality and incomplete on customer economics. Tarana clearly has enough named deployments to dismiss the idea that it is still pre-product or pre-customer. However, most of the strongest evidence is company-curated or customer-quoted collateral, not independent portfolio analytics. Customer homepages validate that the named operators exist and serve real markets, but they do not reveal Tarana’s share of wallet, contract size, renewal structure, or gross margin contribution by account. Independent review surfaces were limited during this run, and even Gartner’s review page was access blocked. A practitioner troubleshooting post also shows that customer outcomes still depend on field execution and radio-health monitoring, not just the presence of Tarana gear. So the underwriting conclusion is that Tarana has strong public proof of customer adoption and expansion, but weak public proof on concentration, retention durability, and the
    exact

    economic value of its largest operator relationships. Price visibility is also limited.'
