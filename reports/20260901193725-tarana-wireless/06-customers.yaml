  rows:
  - - Rural / regional WISPs
    - Operator buyer and user; retail subscriber is end beneficiary
    - Nextlink, Watch, Smart Way, Resound, unWired
    - Rapid rural coverage, NLoS service, subsidy fulfillment, defense against fiber
    - Core installed-base channel for Tarana
    - No public revenue split by operator or geography
  - - Community / nonprofit broadband operators
    - Nonprofit or civic broadband provider buys and operates
    - DigitalC
    - Urban digital-inclusion deployment with consumer affordability focus
    - Shows Tarana can support city-scale equity missions, not just rural edge cases
    - No public retention cohort or ARPU data
  - - Incumbent telco / ILEC operators
    - Legacy telco buys platform to modernize service footprint
    - CentraCom
    - Upgrade DSL / older FWA footprint without trenching fiber everywhere
    - Important for brownfield modernization story
    - No contract-size disclosure
  - - Carrier-branded fixed-wireless teams
    - Wireless carrier buys and brands the retail broadband product
    - UScellular
    - Add fixed internet capacity in hard topographies
    - Shows potential beyond WISP niche
    - Public proof is still small relative to WISP channel
  - - Hybrid fiber-wireless grant operators
    - Operator blends fiber and wireless in public-funding projects
    - Nextlink, PhireLink
    - Use ngFWA where fiber-only economics fail
    - Supports BEAD / ARPA-linked expansion motion
    - Grant wins do not prove recurring share of wallet
  notes: Segments describe Tarana’s direct customers; end-user households and businesses consume the service under the operator’s own brand.
