- id: adoption-trajectory-and-production-proof
  title: Public adoption proof is strongest where Tarana provides named production deployments and scaling metrics
  body: 'Named deployment pages provide the clearest evidence that Tarana has moved well beyond lab demonstrations. Nextlink’s public case materials describe very fast first-month subscriber additions, a large installed base of base nodes and remote nodes, and a later G2 expansion already serving live customers. Watch’s materials show a growing tower footprint, while unWired describes tens of thousands of retail customers on top of Tarana-enabled expansion. DigitalC, Crowsnest, CentraCom, PhireLink, Resound, and Smart Way show that the platform is also being used by operators with very different service territories and legacy-network starting points. Importantly, most of these are described as production or scaling deployments rather than pilots. That does not make every number independently verified, but it does materially improve confidence that Tarana has genuine customer adoption and repeat deployment inside operator fleets, which is the core question for a business whose product is
    sold

    B2B2C through broadband providers.'
  claimRefs:
