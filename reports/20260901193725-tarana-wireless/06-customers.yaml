- id: TU006
  title: Public customer evidence gaps table
  columns:
  - Missing evidence
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Portfolio retention metrics (NRR, GRR, churn cohorts)
    - High
    - Without cohort data, anecdotal wins cannot be translated into installed-base durability
    - Request customer cohort deck by vintage, segment, and product generation
  - - Customer concentration and contract size
    - High
    - A hardware platform can look broadly adopted while still being exposed to a few outsized accounts
    - Request revenue, backlog, ARR-like support revenue, and node concentration by top customers
  - - Independent review surfaces
    - Medium
    - Blocked or thin third-party review surfaces limit triangulation on implementation friction
    - Obtain references not chosen by Tarana and scrape neutral community forums with permission
  - - Share of wallet inside mixed-technology operators
    - Medium
    - Named customers may use multiple vendors at once, diluting Tarana’s economics
    - Request vendor mix, replacement rate, and roadmap share inside flagship operators
  notes: These gaps are the main reasons the customer chapter concludes “real adoption, incomplete durability proof.”
