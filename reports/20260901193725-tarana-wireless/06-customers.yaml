callouts:
- title: Tarana has real production customers
  calloutType: insight
  body: 'The chapter’s public evidence clears the “is anyone really using this?” hurdle: the platform appears in scaled operator rollouts, county buildouts, carrier partnerships, and multiple second-order expansion stories.'
  claimRefs:
