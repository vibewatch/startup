  topStrengths:
    - ngFWA 技术有差异化，公开证据具体指向干扰消除、非视距（NLoS）性能和多频段产品演进。
    - 300 多家运营商客户已经真实采用，买方横跨多个细分群体，包括农村 WISP、ILEC 和社区宽带提供商。
    - 历史融资支持清晰可见，包括 2022 年独角兽轮次和后续二级市场标记，让 Tarana 仍处在后期私营公司区间。
  topRisks:
    - 当前收入质量、毛利率、现金和营运资本披露仍不足以支撑溢价私募承销。
    - 尽管 logo 和案例证据很强，客户集中度、留存耐久性和钱包份额仍未公开量化。
    - G2 过渡可以抬高上行空间，但相较已更清楚的 G1 装机基础，它也重新打开了认证、支持和执行风险。
  unresolvedGaps:
    - 公开记录中没有当前 2024-2026 年 CFO 级收入、毛利率、预订额或现金跑道资料包。
    - 股权结构表、清算优先权、优先购买权（ROFR）惯例和完全摊薄股数仍未披露。
    - 公开记录缺少组合层面的净留存率（NRR）、总留存率（GRR）、集中度和续约数据。
    - G2 部署队列仍需要关于利用率、故障率、支持负载和升级经济性的独立数据。
