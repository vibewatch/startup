- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - G2 execution misses
    - Customer-critical rollout or support KPIs deteriorate materially
    - Weakens density-expansion thesis and delays premium re-rating
    - Do not pay near peak marks; re-cut scenario ranges lower
  - - Customer concentration shock
    - Top-customer exposure is higher than expected or renewal quality weakens
    - Installed-base durability becomes less valuable
    - Demand sharper discount or walk away
  - - Margin / working-capital weakness
    - Gross margin or cash-conversion profile is materially worse than implied
    - Secondary marks become harder to defend
    - Shift to bear framing immediately
  - - No credible liquidity path
    - IPO or acquisition path remains vague while secondary demand softens
    - Hold periods lengthen and discount rates rise
    - Only invest at a materially lower entry point
  - - Security / support posture disappoints
    - Management cannot support software-assurance and field-support claims
    - Moat quality is offset by operational fragility
    - Escalate risk rating and reconsider thesis
  notes: Triggers convert the report’s major evidence gaps into explicit investment conditions.
