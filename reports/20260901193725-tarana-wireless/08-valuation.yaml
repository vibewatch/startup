  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-packet
    missingEvidence: No public source in the reviewed set provides a current 2024-2026 revenue, gross-margin, working-capital, and cash packet suitable for priced underwriting.
    whyItMatters: Without current economics, late-stage secondary marks cannot be tested against actual business quality.
    diligencePath: Request CFO-level monthly revenue, gross margin, bookings, backlog, burn, and runway materials.
    relatedQuestionRefs:
    - QV002
    - QV022
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Public sources do not disclose the latest preference stack, secondary transfer approval mechanics beyond generic platform caveats, or fully diluted share count needed to interpret per-share screens.
    whyItMatters: Return outcomes in a private company depend heavily on cap-table terms, not just enterprise-value headlines.
    diligencePath: Request cap table, latest financing docs, side letters, transfer restrictions, ROFR practice, and liquidation preferences.
    relatedQuestionRefs:
    - QV003
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: TV004 comparable valuation coverage
    missingEvidence: The comparable set is deliberately representative rather than exhaustive because no public company cleanly matches Tarana’s stage, product mix, and disclosure profile.
    whyItMatters: An overconfident peer set can falsely anchor valuation too high or too low.
    diligencePath: Build an expanded custom comp set with strategic buyers, private rounds, and model-specific analogs once management data is available.
    relatedQuestionRefs:
    - QV008
    - QV019
    relatedTableRefs:
    - TV004
  - type: access-blocked
    severity: material
    topic: independent-secondary-data-quality
    missingEvidence: Some secondary-market and review surfaces were gated or blocked, limiting verification of recent trade depth, analyst commentary, and customer sentiment.
    whyItMatters: Late-stage private valuations depend heavily on market-clearing evidence quality and liquidity context.
    diligencePath: Obtain broker quotes, verified transaction comps, and direct buyer/seller indications under NDA.
