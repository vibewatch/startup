- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue and margin packet
    - 2024-2026 revenue, gross margin, services burden, and bookings
    - Necessary to judge whether late-stage marks are earned or aspirational
    - Request CFO packet and monthly cohort data
  - - Customer concentration and retention
    - Top-10 exposure, NRR, GRR, renewal calendar, and wallet share
    - Needed to convert logo proof into durable value
    - Request customer-quality dashboard
  - - G2 deployment cohorts
    - Sector utilization, attach, failure rates, support load, and upgrade economics
    - Determines whether G2 is additive or destabilizing
    - Request product-ops review with cohort metrics
  - - Cap table and preference stack
    - Latest round terms, liquidation preferences, ROFR constraints, and secondary approvals
    - Critical for real return underwriting in a private company
    - Request financing documents and counsel summary
  - - Liquidity and exit path
    - IPO readiness, likely buyer universe, and timing assumptions
    - Needed to set holding period and discount rate
    - Request board-level financing and exit plan
  notes: These are the minimum asks required to move from public-source tracking to priced underwriting.
