- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Technology moat appears real through interference handling, NLoS performance, and G2 ambition
    - Disconfirm if field data shows weak G2 adoption, reliability issues, or easy substitution
  - - Customer proof is strong enough to support strategic relevance
    - Improve with top-customer revenue mix and retention cohorts; weaken if large customers are non-repeat or dual-source heavily
  - - Secondary-market demand implies continuing investor interest
    - Improve with verified recent transactions; weaken if platforms show only stale or indicative pricing
  - - Disclosure quality is insufficient for premium private pricing
    - Improve with audited or management-certified 2024-2026 revenue, margin, and working-capital data
  - - Liquidity is structurally limited in private secondary markets
    - Improve if IPO timeline or clear acquisition path becomes credible
  - - Public comp set provides only rough boundaries, not a clean pricing formula
    - Improve with a better peer set or explicit strategic-buyer evidence
  notes: Arguments are intentionally framed as move-the-view tests rather than static pros and cons.
