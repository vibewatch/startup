    - Scale and business mix remain far from Tarana
  - - Inseego
    - Market cap
    - ~$66.08M market cap
    - Relevant as a small public FWA-adjacent reference
    - Likely reflects very different product quality and market position
  - - Cambium Networks
    - Market cap / public issuer status
    - ~$11.32M market cap; public SEC and IR surfaces active
    - Useful as a public FWA reference point
    - Distress-like valuation makes direct multiple use hazardous
  notes: The set is intentionally broad because no public company is a clean one-for-one match for Tarana.
