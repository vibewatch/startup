- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - G2 densifies successfully, flagship customers expand wallet share, and management validates revenue quality
    - Supports valuation near or above the 2025 Forge high watermark around $1.96B
    - Requires execution and disclosure to improve materially
    - Possible but not yet proven publicly
  - - Base
    - Real adoption continues but disclosure remains partial and liquidity remains constrained
    - Supports a discounted range roughly around the mid-$1B area rather than peak marks
    - Information asymmetry and concentration keep discount rates high
    - Most consistent with current public evidence
  - - Bear
    - G2 adoption disappoints, concentration or margin issues surface, and liquidity windows remain narrow
    - Valuation compresses back toward or below prior unicorn-level framing and retail secondary screens
    - Down-round or flat-mark risk increases
    - Cannot be ruled out with present disclosure
  notes: Scenario bands are directional ranges anchored to public marks, not formal DCF outputs.
