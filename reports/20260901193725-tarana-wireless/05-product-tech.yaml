- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Tarana solution
  - Measurable benefit
  - Limitation
  rows:
  - - Rural greenfield broadband
    - Fiber too slow or too expensive; LoS is rare
    - G1 radios plus Cloud Suite planning and management
    - Faster deployment in NLoS areas with fewer sites
    - Tarana does not disclose realized install cost per passing
  - - Competitive overbuild / underserved urban pockets
    - Need high speeds without trenching everywhere
    - G2 multi-band architecture with higher sector capacity
    - Official target of 100 Mbps-1 Gbps service at higher density
    - Urban-scale proof is newer than G1 rural proof
  - - BEAD / grant-backed engineering
    - Spectrum, compliance, and economics must all pencil out
    - CBRS / 6 GHz support plus partner-led planning assistance
    - 500 Mbps+ and <10 ms claims in subsidy-oriented enablement materials
    - Grant wins do not by themselves prove steady recurring demand
  - - Ongoing operations and optimization
    - Spectrum coordination and network monitoring are operational burdens
    - Tarana Cloud Suite with SAS proxy, footprint prediction, and densification tools
    - Lower ops friction versus a purely manual RF workflow
    - No public SLA or uptime history located
  notes: Benefits reflect public claims and workflow implications, not realized operator economics.
