callouts:
- title: This is a systems company, not a commodity radio vendor
  calloutType: insight
  body: Tarana’s public product story only makes sense when hardware, cloud operations, spectrum management, and RF algorithms are evaluated together; pricing any single radio in isolation misses the value proposition and the dependency stack.
  claimRefs:
