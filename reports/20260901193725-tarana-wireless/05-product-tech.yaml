  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-and-privacy-disclosure
    missingEvidence: No clear public security trust center, certification page, privacy-control architecture, or software-assurance packet surfaced in the reviewed materials.
    whyItMatters: As Tarana Cloud Suite becomes more central to operator workflows, enterprise trust posture matters alongside RF performance.
    diligencePath: Request security architecture, IAM model, logging and retention controls, vulnerability-management cadence, and any SOC 2 / ISO 27001 or equivalent evidence.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: manufacturing-and-supply-chain
    missingEvidence: Public sources do not identify contract manufacturers, critical component dependencies, qualification processes, or field failure rates by hardware family.
    whyItMatters: A hardware-led access platform can fail commercially if supply, yield, or warranty performance lags the product story.
    diligencePath: Request manufacturing map, key-component concentration, qualification testing results, RMA rates, and inventory / lead-time history for G1 and G2.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: minor
    topic: open-developer-surface
    missingEvidence: No public developer portal, API reference, or open-source integration surface was obvious in the reviewed set.
    whyItMatters: This limits independent verification of extensibility and suggests operator adoption relies on assisted deployment rather than ecosystem pull.
    diligencePath: Ask management whether Tarana intentionally uses a closed enablement model, what APIs exist for OSS/BSS integration, and how partner certification works.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
