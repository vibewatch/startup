- id: maturity-roadmap-and-tech-verdict
  title: 'Maturity and roadmap: G1 is proven, G2 is ambitious, and diligence should separate the two'
  body: 'The public materials support a mature-versus-emerging split inside Tarana’s stack. G1 has been commercial for years, has multiple operator proof points, and has accumulated both certification history and a deep technical content library. G1x2 looks like a meaningful software-led extension that increased throughput on top of the installed base, reinforcing the idea that Tarana’s physical layer architecture can scale over time. G2, by contrast, is compelling on paper and corroborated by third-party coverage, but its practical underwriting still depends on real deployment evidence: sector loading at scale, tower-level density in urban markets, maintenance burden, and compatibility economics for mixed fleets. The company’s IP portfolio and public resources support that the underlying engineering effort is real. Even so, investors should be careful not to treat G2 launch claims as already equal in certainty to G1 operating history, especially because public trust-and-security disclosures

    remain thinner than public radio-performance disclosures. That maturity split should drive separate technical diligence checklists, support expectations, and underwriting assumptions.'
