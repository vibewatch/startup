  - - 2025-05 to 2025-06 certification cadence
    - G2 BN, 6 GHz RNv, and multiband RN filings appear in FCC records
    - Observed
    - Supports active hardware rollout into the new generation
    - FCCID / FCC.report
  - - 2025-09 launch cycle
    - G2 promoted as available now with denser-capacity targets
    - Current commercial positioning
    - Potentially opens larger-ISP and urban overbuild use cases
    - G2 page / Light Reading / Fierce
  - - 2026 current public surface
    - 150+ resources plus continuing recruiting for product capability scale-up
    - Observed current signal
    - Suggests ongoing enablement investment, though not proof of product quality
    - Resources page / Careers
