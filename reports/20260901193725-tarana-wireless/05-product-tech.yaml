- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - G1 base node (BN)
    - Wireless ISP / regional operator
    - Commercial and field-proven
    - NLoS access, interference cancellation, k=1 reuse
    - Need SKU BOM, gross margin, and failure-rate data
  - - G1 remote node (RN)
    - Subscriber premises / field install team
    - Commercial and field-proven
    - Beamformed subscriber edge for difficult links
    - Need truck-roll time, install success, and warranty data
  - - Tarana Cloud Suite
    - Network operations team
    - Commercial service layer
    - AWS-managed control plane with SAS proxy and planning tools
    - Need uptime, SLA, tenancy, and data-retention detail
  - - G1x2 software mode
    - Existing G1 operators
    - Upgrade path on installed base
    - 160 MHz / four carriers for higher aggregate throughput
    - Need adoption rate and hardware-compatibility limits
  - - G2 base node
    - Larger and denser ISPs
    - Newly available
    - 6.4 Gbps sector target and multi-band aggregation
    - Need real-world density, thermal, and MTBF data
  - - RNm multi-band remote node
    - G2 operators
    - Newly available
    - Dual-resonant multi-band design with backward compatibility
    - Need field-service and installer-training requirements
  notes: Rows separate mature G1 assets from the newer G2 family because diligence confidence differs materially between them.
