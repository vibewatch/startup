- title: Radio trust evidence is stronger than enterprise trust evidence
  calloutType: risk
  body: The public record is rich on patents, interference management, and FCC filings, but sparse on public security, privacy, and software-assurance disclosures, which matters as Tarana’s control plane becomes more central to operator workflows.
