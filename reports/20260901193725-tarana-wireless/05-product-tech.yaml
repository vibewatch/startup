- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / surface
  - Status
  - Scope
  - Evidence
  - Gap
  rows:
  - - FCC equipment authorizations
    - Visible and current
    - Radio hardware generations through 2025
    - FCC.report and FCCID records show G2 BN and multiband RN filings
    - Need grant-level reliability and recall history
  - - CBRS / AFC coordination support
    - Publicly described
    - Planning and legal operation in regulated spectrum
    - Tarana blogs and Cloud Suite materials describe SAS proxy and AFC mechanics
    - Need independent proof of failure handling during grant changes
  - - Practitioner enablement
    - Visible
    - Webinars, partner assistance, and resource library
    - CSSA sessions and case-study archive show assisted deployment model
    - Need support response metrics and certification/training throughput
  - - Patent / IP protection
    - Visible
    - Core PHY, duplexing, and NLoS methods
    - Tarana, Justia, and USPTO surfaces show broad patent coverage
    - Need freedom-to-operate review and challenge history
  - - Public security / privacy disclosure
    - Sparse in reviewed set
    - General enterprise trust signals
    - No clear public security certification center surfaced in reviewed materials
    - Request security architecture, pen-test cadence, access controls, and privacy policy set
  notes: 'Control visibility is uneven: radio-compliance evidence is public, but enterprise trust disclosure is limited.'
