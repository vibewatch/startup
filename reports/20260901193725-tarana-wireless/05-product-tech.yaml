company:
  name: Tarana Wireless
chapter:
  number: 5
  title: Product & Technology
  summary: 'Tarana sells a systems-level fixed-wireless platform rather than a single radio SKU: G1/G2 access hardware, software-mediated network operations, and spectrum-control features are packaged together to deliver fiber-class broadband in hard RF environments. The public record supports a real technical moat in interference handling, NLoS performance, and multi-band aggregation, but still leaves material diligence gaps around manufacturing, security controls, and real-world G2 maturity.'
sections:
- id: product-definition-and-module-map
  title: 'What operators actually buy: radios, software, and an operating system for ngFWA'
  body: 'Tarana’s public surface consistently describes its offer as a next-generation fixed wireless access platform, not just a base-station product. The commercial package starts with the physical access layer — base nodes and remote nodes for G1, plus the newer G2 base node and RNm — but the workflow only makes sense with accompanying software and services. Tarana’s own materials position Tarana Cloud Suite inside its broader Software, Maintenance, Support package, which means deployment planning, network monitoring, software updates, and spectrum administration are part of the delivered system. That matters in diligence because the buyer is not purchasing a commodity Wi-Fi radio; the buyer is adopting a vertically integrated access architecture. The product map also shows an installed-base expansion path: G1 as the field-proven platform, G1x2 as a software-led capacity expansion, and G2 as the denser, multi-band next step aimed at larger and more competitive broadband footprints.'
