- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Distributed massive MIMO arrays
    - Find usable paths in obstructed RF environments
    - Tarana RF design and calibration
    - Performance may vary by clutter and installer quality
  - - Closed-loop Tx/Rx beamforming
    - Optimize link quality per path and subcarrier
    - Signal-processing firmware and feedback loops
    - Public proof is technical and anecdotal, not a universal benchmark
  - - ABIC interference cancellation
    - Remove burst interference during payload transmission
    - Custom hardware plus software timing
    - If implementation drifts, crowded unlicensed deployments could degrade quickly
  - - Tarana Cloud Suite
    - Provision, monitor, analyze, and coordinate access network behavior
    - AWS plus Tarana-operated service workflows
    - Cloud outages or weak observability would hit operator trust
  - - Spectrum-control layer
    - Support SAS/AFC coordination and channel planning
    - Regulators, databases, and spectrum availability
    - Grant suspension or AFC constraints can affect usable channels
  - - Patent / IP layer
    - Protect beamforming, duplexing, and NLoS methods
    - Continued maintenance of patent portfolio
    - IP breadth does not by itself guarantee manufacturing or support execution
  notes: Architecture is public enough to describe the system layers, but not detailed enough to validate component-level cost or vendor concentration.
