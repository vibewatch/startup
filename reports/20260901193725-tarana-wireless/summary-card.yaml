  topStrengths:
    - >-
      Differentiated ngFWA technology with specific public evidence on interference cancellation, NLoS performance, and
      multi-band product evolution.
    - >-
      Real customer adoption across more than 300 operator customers and multiple buyer segments, including rural WISPs,
      ILECs, and community broadband providers.
    - >-
      Visible historical financing support, including a 2022 unicorn round and later secondary-market marks that keep
      Tarana in late-stage private-company territory.
  topRisks:
    - >-
      Current revenue quality, gross margin, cash, and working-capital disclosure remain insufficient for premium
      private underwriting.
    - >-
      Customer concentration, retention durability, and share of wallet are not publicly quantified despite strong logo
      and case-study proof.
    - >-
      The G2 transition can improve upside, but it also reopens certification, support, and execution risk relative to
      the better-understood G1 installed base.
  unresolvedGaps:
    - No current 2024-2026 CFO-grade revenue, gross-margin, bookings, or runway packet is public.
    - The cap table, liquidation preferences, ROFR practice, and fully diluted share count remain undisclosed.
    - Portfolio-level NRR, GRR, concentration, and renewal data are absent from the public record.
    - >-
      G2 deployment cohorts still need independent data on utilization, failure rates, support load, and upgrade
      economics.
