company:
  name: CAIS
chapter:
  number: 1
  title: Company Overview
  summary: CAIS is a New York-based alternative-investment operating system that pairs advisor distribution, due diligence, education, and workflow automation into a single platform for the independent wealth channel. The strongest public evidence is the July 2026 Series D at a valuation above $2 billion, the disclosed reach of more than 2,500 firms and 65,000 advisors, and the visible shift toward AI-enabled workflows; the weakest public areas are revenue transparency, board composition, and the exact economics behind platform-scale claims.
sections:
- id: identity-and-platform
  title: Identity, Mission, and What CAIS Actually Sells
  body: >-
    CAIS describes itself as the leading alternative investment platform for independent financial advisors, but the more precise framing is that it is a workflow and distribution operating system for the advisor channel. The company says it was founded in 2009 to make alternative investments more available to financial advisors and to reduce the manual friction that historically made private funds, structured products, and related workflows hard to scale outside large institutions. That framing is consistent across the homepage, the 2026 fundraising release, and multiple product articles: CAIS wants to own the pre-trade, trade, and post-trade operating layer rather than merely act as a marketplace listing page.


    Public product evidence supports that positioning. CAIS’s own technology pages say advisors and home offices can use firm-configured homepages, product menus filtered by accreditation level and minimums, CAIS IQ educational content, and product pages that bundle fund documents, disclosures, videos, and presentations. Company-authored articles further describe a single digital marketplace that connects orders, positions, capital calls, distributions, K-1s, and monitoring. In other words, the business model is not just access to alternative funds; it is a technology-and-service layer intended to make alternative allocations feel operationally closer to traditional assets for independent wealth firms.
  claimRefs:
  - CO001
  - CO002
  - CO021
  - CO031
  - CO032
  - CO034
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: leadership-and-governance
  title: Leadership Visibility, Governance Signals, and Key-Person Dependence
  body: >-
    Founder continuity is one of the clearest strengths in the public record. Matt Brown remains founder and CEO and is still the principal voice in fundraising, product philosophy, and wealth-channel positioning. Other public executives are visible, but less comprehensively than one would want for late-stage diligence. Brad Walker appears as President in the January 2026 CAIS Live release, while the May 2026 AI release identifies Kan Kotecha as CTO and Brendan Cuddihy as COO. Those disclosures show functional depth in product and go-to-market, but they still do not provide a full executive roster, a current board list, or committee structure.


    The 2026 Series D added the strongest new governance data point: Vista president David Breach joined the board, and representatives from Blue Owl, Lord Abbett, Fortress, and Carlyle became board observers. That is a material signal because it suggests both strategic validation and higher governance density from sophisticated shareholders. Even so, the public record still leaves open how much control sits with founder-management versus financial sponsors, and whether CAIS’s operating model creates conflicts between distribution incentives and advisor-first positioning. The company’s own disclosures around fees, fiduciary status, and investment risk make that a real diligence topic rather than a theoretical one.
