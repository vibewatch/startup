- id: funding-and-investor-base
  title: Funding History, Valuation Step-Up, and the Strategic Investor Mix
  body: >-
    The funding arc is unusually important because it says as much about the category as it does about the company. CAIS’s January 2022 financing brought in Apollo, Motive Partners, and Franklin Templeton at a valuation above $1 billion, while the July 2026 Series D added Vista and a broad set of strategic asset-management and financial sponsors at a valuation above $2 billion. In effect, investors are backing CAIS not only as a software platform but also as a critical distribution and workflow node for private-markets access in wealth management.


    The disclosed sequence now looks like a $50 million 2020 Series B, a $225 million 2022 Series C, and a $170 million 2026 Series D, bringing total capital raised to nearly $600 million. The investor mix matters. Apollo and Hamilton Lane validate early strategic relevance to alternative-asset managers; Vista, Blue Owl, Carlyle, Fortress, Golub, Lord Abbett, RBC, and AllianceBernstein reinforce the thesis that distribution infrastructure for alternatives has become strategically valuable to incumbents and product manufacturers. The missing piece is economic detail: public sources do not disclose ownership percentages, liquidation preferences, secondaries, or the full board/control map after the latest round.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
