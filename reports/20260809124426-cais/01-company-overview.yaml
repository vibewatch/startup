- id: milestones-and-adverse-context
  title: Milestones, Disclosure Frictions, and the Main Adverse Context
  body: >-
    The milestone picture is strong: founding in 2009, a 2022 unicorn threshold, a 2026 step-up above $2 billion, expanding custodial and workflow integrations, visible AI investment, and a scaled education franchise through CAIS Live and CAIS IQ. Historical company articles also show that marketplace breadth and network assets were growing materially before the 2026 raise, implying the recent financing is accelerating an existing curve rather than rescuing a stalled business.


    Still, the chapter should not be read as a clean all-clear. CAIS Advisors’ regulatory filing confirms the existence of a registered advisory entity and principal office, but public materials still do not disclose consolidated revenue, margins, ownership concentration, or the exact relationship between the RIA subsidiary and the broader platform economics. Company disclosures also explicitly warn that investments can be illiquid and risky, and that CAIS or its affiliates are paid fees tied to platform-facilitated private funds and strategies. That does not negate the business; it means investors should underwrite CAIS as a strategically positioned but not yet financially transparent private-market infrastructure company.
