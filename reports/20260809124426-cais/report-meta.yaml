  topStrengths:
    - Strong strategic validation from a $170M Series D led by Vista Equity Partners at a $2B+ valuation.
    - Real platform-scale signal across 2,500+ firms, 65,000+ advisors, and rapid 2026 volume / asset growth.
    - Product breadth spanning workflow, diligence, education, AI, and emerging secondary-liquidity capabilities.
    - Clear exposure to secular growth in advisor-mediated private markets.
    - Comp set suggests CAIS belongs in the conversation with serious wealth / alternatives infrastructure assets.
  topRisks:
    - Public evidence still lacks audited revenue, margin, retention, and cash-generation metrics.
    - The premium narrative depends on execution across AI, integrations, and secondaries without major control failures.
    - Cap-table and preference-stack opacity could make a fair headline valuation less attractive for new investors.
    - Public-market comparables trade at materially lower revenue multiples than strategic private transactions.
    - Any regulatory, security, or customer-stickiness setback could narrow the valuation premium quickly.
  unresolvedGaps:
    - Audited FY2025-FY2026 financial statements, including revenue by stream and margin structure.
    - Net revenue retention, gross retention, and customer / manager concentration schedules.
    - Full cap table, liquidation preferences, side letters, and any secondary mechanics tied to the latest round.
    - Implementation and support burden needed to judge whether economics are software-like or services-heavy.
    - Evidence on IPO readiness, public-company controls, and board / governance structure beyond headline investor roles.
