companyProfile:
  summary: >
    CAIS is a New York-headquartered alternatives platform founded in 2009 by Matt Brown. The company sells a workflow-led
    operating system for the pre-trade, trade, and post-trade lifecycle of alternative investments, pairing product access
    with diligence, education, and advisor-facing tooling. Its customer system spans independent RIAs, broker-dealers,
    home-office platforms, and asset managers seeking wealth-channel distribution. The July 2026 Series D at a valuation
    above $2 billion confirms meaningful market validation, but public evidence still leaves the core economic and cap-table
    questions only partially answered.
  foundedDate: '2009-01-01'
  founders:
    - name: Matt Brown
      role: Founder and CEO
      background: Founder, CEO, and principal public strategist behind CAIS's wealth-channel alternatives platform.
      claimRefs: [CO003]
  foundingLocation: New York City, New York, USA
  headquarters: New York City, New York, USA
  productSummary: >
    CAIS sells a single operating system for alternative investments spanning advisor discovery, due diligence,
    education, pre-trade workflow, transaction execution, and post-trade servicing, with newer layers for AI-assisted
    research, secondaries, and ecosystem integrations.
  customerFocus: >
    Independent RIAs, broker-dealers, home offices, and wealth platforms on the demand side; asset managers and product
    providers seeking distribution into the wealth channel on the supply side.
  businessModel: >
    CAIS and/or its affiliates disclose fees on private funds and strategies sold through the platform, while the broader
    business model also appears to include workflow, education, due-diligence, and operating-system functionality around
    alternatives.
