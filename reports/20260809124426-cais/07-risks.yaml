  - TR004
  figureRefs:
  - FR003
- id: financial-and-thesis-break
  title: Financial / Model Risk and Thesis-Break Triggers
  body: >-
    The main financial risk is opacity. Public sources do not reveal take rate, gross margin, burn, runway, renewal, or customer concentration. That makes it impossible to know whether strong growth signals are translating into durable economics or whether the business is accumulating hidden support, compliance, and implementation cost. It also means concentration risk cannot be ruled out simply because advisor counts are large.


    The right thesis-break triggers therefore sit at the boundaries where hidden risk would suddenly become visible: a regulatory finding, a meaningful security or privacy event, a delayed partner launch, evidence of poor enterprise stickiness, or clear proof that economics are less software-like than investors assume. None of these triggers has obviously tripped in public, but neither are they fully disproven. That is why the residual risk rating should remain elevated until direct diligence closes the evidence gaps. Investors should also watch whether regulatory attention intensifies faster than CAIS can evidence mature controls.


    A practical implication follows from that uncertainty: risk monitoring should not wait for a crisis. Management reporting needs to cover security posture, partner readiness, enterprise account health, and control exceptions with enough cadence that investors can detect slippage before it becomes a financing or reputation event.
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR035
  - CR036
  - CR037
  - CR038
