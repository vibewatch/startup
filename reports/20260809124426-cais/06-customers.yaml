- id: engagement-and-durability
  title: Engagement Signals Are Positive; Retention Data Is Still Missing
  body: >-
    CAIS’s public engagement surface is broader than customer counts alone. The company said CAIS Live had already hosted 50 events, engaged more than 7,600 attendees, and received average feedback of 4.8 out of 5. It also said CAIS IQ generated more than 400,000 digital engagements. FinTech Global added a company-sourced adviser Net Promoter Score of 74, more than twice a cited B2B SaaS benchmark. All of those metrics suggest a customer base that is not only registered but actively consuming product-adjacent content and community.


    Still, none of those signals substitutes for true durability evidence. The public source set does not disclose logo retention, NRR, GRR, churn, contract length, or renewal timing. Even the 65,000-advisor metric is ambiguous without a clear definition of active or fee-bearing users. The most defensible interpretation is that CAIS has strong engagement and adoption signals, but that public evidence on monetized retention remains sparse.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU017
  - CU018
  - CU025
  - CU032
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion Looks Real, but Concentration Risk Is Hard to Quantify
  body: >-
    The public record supports an expansion thesis, but mostly through workflow standardization rather than disclosed spend-per-customer. Baird’s broader rollout, the CAIS Solutions adoption signal, and the manager roster all imply that CAIS can widen within accounts once it becomes the alternatives operating layer. Education and content surfaces likely reinforce that motion by keeping advisors and home offices engaged over time. On the supply side, a wider roster of major managers supports the idea that CAIS can deepen the marketplace value proposition as the platform matures.


    The unresolved issue is concentration. A company can serve tens of thousands of advisors yet still derive a large share of revenue from a much smaller set of enterprise firms or strategic managers. Because no public source discloses revenue concentration, contract size, or manager-side economics, the best current framing is cautionary: breadth is evident, but economic diversification is not yet proven. That is why the customer verdict should be positive on adoption, cautious on durability, and unresolved on concentration.
  claimRefs:
  - CU020
  - CU023
  - CU026
