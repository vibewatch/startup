chapter:
  number: 6
  title: Customers
  summary: 'CAIS has unusually visible public customer-adoption evidence for a private wealth-tech company. The strongest proof is breadth—2,500+ firms, 65,000+ advisors, named wins such as Baird, Summit, and Harbor Group, and company-reported engagement metrics like CAIS Live attendance and an adviser NPS of 74. The weakest proof is durability economics: no public NRR, GRR, churn, renewal, or concentration disclosure exists, so the customer story is much clearer on adoption than on retention.'
sections:
- id: customer-segmentation
  title: 'Customer Base: Advisor Firms on One Side, Asset Managers on the Other'
  body: >-
    CAIS’s customer system is not one-dimensional. The clearest demand-side customers are RIAs, independent broker-dealers, and home-office-style buyers that need alternatives workflow infrastructure. The clearest supply-side customers are asset managers that want distribution into the fragmented wealth channel. Public materials also make it clear that end investors are important beneficiaries of the platform, but they are usually not the direct CAIS buyer. That distinction matters because the user, payer, and strategic value of the relationship can vary widely across segments.


    The named customer proof supports this framing. Summit Wealth Group looks like a midsize RIA-style deployment, Baird looks like a large enterprise platform centralization, and Harbor Group looks like a manager-side distribution customer. The available-on-CAIS roster further suggests that major asset managers are part of the customer ecosystem. CAIS therefore serves a two-sided market: advisor organizations consuming workflow infrastructure and product providers consuming distribution and diligence access.
  claimRefs:
  - CU001
  - CU007
  - CU015
  - CU019
  - CU024
  - CU031
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-proof
  title: Adoption Breadth and Named Proof Are the Strongest Part of the Story
  body: >-
    On adoption breadth, CAIS’s public record is strong. The company said it serves more than 2,500 firms and 65,000 advisors overseeing about $8.5 trillion in end-client assets, and it reported onboarding more than 425 new RIAs and independent broker-dealers since 2025. Independent coverage adds a second useful signal: transaction volume among existing firms reportedly grew 60% year over year in the first half of 2026, which suggests that customer value is not limited to initial logo wins.


    Named proof is also unusually good for a private platform company. Baird’s public statements describe a firmwide alternatives centralization across more than 1,300 advisors. Summit describes operational consolidation across its 34 advisors. Harbor Group frames CAIS as a distribution path into wealth after a rigorous diligence process. Those examples span enterprise wealth, RIA-style deployment, and manager-side participation. What they do not provide is a quantified ROI study or retention curve, but they are strong enough to support a production-deployment conclusion rather than a pilot-only narrative.
  claimRefs:
