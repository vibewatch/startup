- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Decision-useful sample of adjacent private, strategic, and public reference points rather than a full screened universe.
  columns:
  - Reference
  - Type
  - Scale signal
  - Value signal
  - Read-through for CAIS
  rows:
  - - CAIS (2026 Series D)
    - Private financing
    - 65k+ advisors; 2,500+ firms; 37% 3-year revenue CAGR
    - $2B+ valuation
    - Current mark is anchored in growth and strategic validation
  - - iCapital (2025 raise)
    - Private financing
    - '>$945B assets serviced; operating profitability disclosed'
    - $7.5B+ valuation
    - Upper benchmark with stronger disclosed scale and economics
  - - Addepar (2025 Series G)
    - Private financing
    - '>$7T client assets; profitability path disclosed'
    - $3.25B valuation
    - Adjacent wealth-platform benchmark above CAIS but not wildly beyond it
  - - Preqin / BlackRock
    - Strategic M&A
    - ~$240M recurring revenue; category-leading data platform
    - $3.2B acquisition value
    - Shows strategic buyers will pay premium multiples for proven private-markets infrastructure
  - - SS&C
    - Public comp
    - $6.56B revenue; mature software / services platform
    - $18.59B market cap
    - Public comp discipline stays well below premium private infrastructure marks
  - - SEI
    - Public comp
    - $2.45B revenue; wealth processing and asset-servicing exposure
    - $12.57B market cap
    - Useful upper-end public multiple among diversified wealth-tech incumbents
  - - Morningstar
    - Public comp
    - $2.57B revenue; data and wealth tooling exposure
    - $7.53B market cap
    - Demonstrates how disclosure quality and profitability anchor valuation in public markets
  notes: The table mixes private, strategic, and public references because no single comp class captures CAIS perfectly.
