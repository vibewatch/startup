company:
  name: CAIS
chapter:
  number: 8
  title: Valuation
  summary: 'CAIS looks like a real category leader in a favorable market, and the July 2026 financing is strong evidence that sophisticated investors agree. The problem is not that the $2 billion-plus valuation is obviously wrong; it is that the public record still cannot fully prove it. Private comparables such as iCapital and Addepar, the strategic Preqin transaction, and public market reference points from SS&C, SEI, and Morningstar all support a fair-to-rich framing rather than a clear bargain. The result is a constructive but disciplined call: CAIS deserves close tracking and aggressive diligence, yet public evidence alone still falls short of a clean buy recommendation at the current price.'
sections:
- id: investment-thesis
  title: Investment Thesis Versus Anti-Thesis
  body: >-
    The positive case for CAIS is straightforward. The 2026 Series D was large, strategically led, and accompanied by metrics that suggest real momentum rather than a rescue financing. CAIS reported 37% three-year organic revenue CAGR, 53% H1 2026 transaction-volume growth, 55% growth in platform assets, and continuing expansion across advisor firms, AI-enabled workflows, secondaries, and integrations. In a market where advisor-mediated alternatives adoption is still increasing, those are credible ingredients for a premium story.


    The anti-thesis is equally straightforward. The current price is being justified mostly by scale proxies, product breadth, and investor validation, not by audited unit economics. Public evidence still does not reveal the revenue base, gross margin profile, renewal behavior, or cap-table terms that would let investors decide whether CAIS is software-like enough to deserve a meaningful premium to public comps. In other words, the company may be excellent, but excellence and entry price are not the same question.
  claimRefs:
