- id: TV006
  title: Final diligence asks and thesis-break triggers
  columns:
  - Item
  - What is needed
  - Why it matters
  - Failure signal
  rows:
  - - Audited financials
    - Revenue, gross margin, EBITDA / cash burn by period
    - Core test of premium economics
    - Revenue quality materially below implied software-like model
  - - Retention and concentration
    - NRR, GRR, top customers, top managers, renewals
    - Determines durability of workflow centrality
    - Enterprise stickiness weaker than growth narrative implies
  - - Cap table and terms
    - Preferences, secondaries, board rights, side letters
    - Needed to price downside and common-equity attractiveness
    - Asymmetric protections make the headline mark less investable
  - - Implementation burden
    - Support headcount, service intensity, integration cost
    - Distinguishes software premium from services drag
    - High-touch delivery model compresses margin potential
  - - Risk events and controls
    - Any material regulatory, security, or partner disruption history
    - Protects the premium narrative from sudden repricing
    - One major adverse event can reset valuation framing quickly
  notes: These are the minimum asks required to move from track toward buy.
