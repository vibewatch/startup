- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - CAIS is building the category operating system for independent-wealth alternatives with strong growth and credible investor validation.
    - Audited financials confirming durable high-margin growth would strengthen the buy case.
  - - Advisor-channel alternatives adoption still has secular tailwind, helping CAIS compound scale.
    - Evidence that market tailwinds are slowing materially would weaken the premium argument.
  - - AI, secondaries, and workflow centralization create adjacency upside beyond simple distribution fees.
    - If those new surfaces carry high services burden or limited monetization, the premium should shrink.
  - - 'Anti-thesis: the current valuation already assumes software-like economics that are not yet publicly proven.'
    - A lower entry price or full visibility into margins, retention, and cap-table terms would offset the concern.
  notes: The anti-thesis is about underwriting proof, not about denying that CAIS is strategically relevant.
