- id: pricing-and-comps
  title: Current Pricing Context and Comparable Framing
  body: >-
    The comp set supports discipline rather than dismissal. On the private side, iCapital and Addepar show that wealth and alternatives infrastructure assets can sustain multi-billion-dollar values when distribution scale, platform breadth, and recurring economics are credible. On the strategic side, BlackRock’s purchase of Preqin at roughly $3.2 billion and a low-teens revenue multiple shows buyers will pay up for category-defining private-markets data and workflow assets.


    But public comparables still matter. SS&C, SEI, and Morningstar trade on proven revenue and profit streams at materially lower implied revenue multiples than strategic private-market deals. CAIS probably deserves some premium to those public references because its current growth is faster and scarcity is higher. Still, it should also carry a disclosure discount versus better-proven private comparables. That combination is what makes the current mark look defensible, but not obviously generous for new capital. The breadth of CAIS partner and manager relationships adds strategic texture, but it does not remove the need for discipline on price.
