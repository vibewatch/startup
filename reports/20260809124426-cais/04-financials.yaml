- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Organic revenue CAGR
    - 37% over three years
    - medium
    - Best direct growth proxy in source set
    - Request quarterly revenue history and contribution by stream
  - - Transaction-volume growth
    - 53% YoY in H1 2026
    - medium
    - Shows throughput growth but not take rate
    - Request revenue per transaction-dollar or per product family
  - - Platform-asset growth
    - 55% YoY in H1 2026
    - medium
    - Signals depth of activity but not fee capture
    - Request fee-bearing asset base versus total platform assets
  - - Customer acquisition cost / payback
    - Not public
    - low
    - Needed to judge sales efficiency
    - Request CAC, payback, and pipeline conversion by segment
  - - Gross margin / contribution margin
    - Not public
    - low
    - Determines whether CAIS scales like software or services
    - Request gross margin split for platform, feeder, and implementation work
  - - Retention / churn / NRR / GRR
    - Not public
    - low
    - Essential to test durability of enterprise deployments
    - Request logo retention, gross retention, net retention, and cohort expansion
  notes: The public unit-economics surface is dominated by growth proxies rather than true efficiency metrics.
