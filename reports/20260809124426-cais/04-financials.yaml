- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue by stream
    - Cannot separate software-like recurring revenue from transaction sensitivity
    - Request monthly revenue waterfall by stream and by customer cohort
  - - Gross margin by product
    - Cannot test whether workflow expansion improves or dilutes contribution
    - Request gross margin bridge for platform, feeder funds, and services
  - - Retention and expansion metrics
    - Cannot judge renewal durability or land-and-expand thesis
    - Request logo retention, GRR, NRR, and cohort expansion tables
  - - Cash burn and runway
    - Cannot judge financing dependency or next-round timing
    - Request current cash, monthly burn, and 18-month budget
  - - Implementation / support burden
    - Cannot determine whether enterprise wins are labor intensive
    - Request onboarding timelines, support ratios, and professional-services hours
  - - Debt / contingent obligations
    - Cannot see hidden balance-sheet risk
    - Request debt, guarantees, and litigation / reserve schedule
  notes: These are the minimum financial diligence items needed before treating CAIS as underwritten rather than merely promising.
