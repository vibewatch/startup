tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public status
  - Quality
  - Diligence ask
  rows:
  - - Platform-facilitated fund / strategy fees
    - CAIS and/or affiliates are paid when funds and strategies are sold through the platform
    - Explicitly disclosed at high level
    - Real revenue source, but economics unspecified
    - What is the take rate by product type and customer cohort?
  - - Custom feeder technology fees
    - Technology fee tied to feeder-fund AUM and complexity; low end disclosed at 5 bps
    - Partially public
    - Most concrete monetization disclosure in source set
    - How much revenue and margin does feeder technology contribute?
  - - Enterprise workflow / platform contracts
    - Likely monetization for centralization, integrations, and operating-system capabilities
    - Implied, not priced
    - Potentially sticky and software-like if renewals are strong
    - How are enterprise contracts structured—subscription, service, or volume based?
  - - Education / diligence / support layer
    - May support sales, differentiation, or bundled monetization
    - Implied, not isolated
    - Could raise conversion and retention without being a separate SKU
    - Is any of this monetized directly or only indirectly?
  - - Advisory / regulated-service economics
    - CAIS Advisors disclosures imply advisory operations alongside platform activity
    - Entity exists, economics undisclosed
    - Could add recurring oversight cost and/or fee opportunity
    - What revenue, if any, is booked directly at CAIS Advisors?
  notes: The table distinguishes observable monetization mechanics from the much larger set of unknown economics.
