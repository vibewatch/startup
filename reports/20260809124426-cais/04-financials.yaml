company:
  name: CAIS
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence on CAIS is financially suggestive but not financially complete. The strongest signals are the $170 million Series D at a $2 billion-plus valuation, the company-reported 37% three-year organic revenue CAGR, 53% transaction-volume growth, and 55% asset growth in first-half 2026. The weakest area is the actual underwriting core: no public revenue mix, margin, CAC, retention, burn, or runway data exists, so the case rests on growth proxies and on the assumption that workflow economics are software-like enough to improve with scale.'
sections:
- id: revenue-model
  title: 'Revenue Model: Clearly Multi-Stream, Not Yet Quantified'
  body: >-
    The public record supports a multi-stream revenue model rather than a single fee line. CAIS’s own disclosures state that CAIS and/or its affiliates are paid a fee for private funds and strategies sold through the platform, which supports a transaction or distribution economics layer. At the same time, the company repeatedly positions itself as workflow infrastructure spanning product discovery, due diligence, education, pre-trade, trade, and post-trade servicing. That positioning implies technology and enterprise-service monetization around the core transaction flow, even though the company does not publicly break out how much revenue comes from each layer.


    The one concrete pricing disclosure in the current source set is custom-feeder technology pricing as low as five basis points. That matters because it shows CAIS is willing to monetize specific workflow utilities directly, especially where incumbent pricing has been opaque. But it also highlights how much remains unknown. There is no public price book for the core platform, no disclosed subscription tiers, and no public take-rate math against platform assets or transaction volume. Financially, CAIS looks like a hybrid of marketplace, workflow software, and service infrastructure—but the public evidence is not detailed enough to quantify that mix.
