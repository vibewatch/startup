- id: growth-and-unit-economics
  title: Growth Proxies Are Strong; Unit Economics Are Hidden
  body: >-
    CAIS’s public traction signals are strong enough to support a growth narrative. The company reported a 37% three-year organic revenue CAGR, 53% first-half 2026 transaction-volume growth, 55% first-half platform-asset growth, and more than 425 newly onboarded RIAs and independent broker-dealers since 2025. Those numbers are directionally consistent with a market benefiting from strong category tailwinds, as Cerulli and McKinsey both argue. Baird’s enterprise deployment and the company’s claim that CAIS Solutions drew interest from advisors overseeing nearly $1 trillion in assets reinforce that demand is not limited to one-off advisor accounts.


    But these are still proxies. They do not reveal take rate, revenue-recognition policy, professional-services burden, customer retention, or margin structure. That gap matters because CAIS may scale like a software platform, a fee-heavy marketplace, or a services-assisted workflow business; each model deserves a different underwriting framework. The best public conclusion is therefore conditional: growth looks robust, yet the economics per dollar of platform activity remain largely invisible. Without cohort data or gross-margin evidence, investors cannot tell how efficiently top-line momentum converts into durable operating profit.
