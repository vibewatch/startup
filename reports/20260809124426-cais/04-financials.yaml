- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Evidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest equity financing
    - $170M Series D at >$2B valuation
    - Official press, FT Partners, and independent coverage
    - Improves capital cushion and strategic flexibility
    - Request post-close cash balance and board-approved budget
  - - Lifetime capital raised
    - Nearly $600M post-Series D
    - Official and independent coverage
    - Shows strong financing access
    - Request round-by-round primary/secondary mix and preference stack
  - - Use of funds
    - Growth, platform expansion, AI, technology, strategic opportunities
    - Independent coverage quoting company
    - Maps future spend intensity
    - Request detailed capital-allocation plan by function
  - - Cash on hand / runway
    - Not public
    - No source in current set discloses it
    - Core underwriting blocker
    - Request latest cash balance, burn, and runway sensitivity
  - - Debt / facilities / obligations
    - Not public
    - No source in current set discloses it
    - Could materially change dilution and risk
    - Request debt schedule, covenants, and off-balance-sheet obligations
  - - Compliance / security burden
    - Clearly present but not quantified
    - ADV, privacy, terms, hiring, legal commentary
    - Can absorb a meaningful share of new capital
    - Request security, compliance, and legal budget as a percent of revenue
  notes: This table intentionally centers what a financing round does not answer.
