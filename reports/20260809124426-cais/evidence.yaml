evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-visibility
    missingEvidence: >-
      Audited or management-certified revenue, gross margin, EBITDA, and free-cash-flow figures for CAIS and any RIA
      subsidiaries.
    whyItMatters: >-
      The company discloses strong growth rates and scale signals but not the absolute economics needed to underwrite
      operating leverage or valuation.
    diligencePath: >-
      Request monthly recurring and transaction-fee revenue by segment, margin bridge, and board-approved annual
      operating plan.
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: material
    topic: board-and-ownership-detail
    missingEvidence: >-
      A current full board roster, committee structure, and cap-table or preference-stack detail after the 2026 Series
      D.
    whyItMatters: >-
      Public materials identify new directors and observers but do not disclose total board composition, control
      thresholds, or investor economics.
    diligencePath: >-
      Request the latest board deck, charter package, and post-money cap table with ownership, preferences, and observer
      rights.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: advisor-activity-definition
    missingEvidence: >-
      Definitions behind firm count, advisor count, end-client assets, and transaction-volume metrics, including whether
      they represent licensed users, active users, or represented network relationships.
    whyItMatters: >-
      Scale claims are central to the equity story, but public materials do not fully define the denominator or activity
      thresholds.
    diligencePath: >-
      Obtain KPI definitions used in board reporting and reconcile 2024, 2025, and 2026 snapshots across finance and
      client service.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: ai-adoption
    missingEvidence: Adoption, retention, and productivity data for CAISey and the Claude integration across the advisor base.
    whyItMatters: >-
      AI is a major strategic narrative, but current public evidence stops at product description and limited rollout
      rather than measured usage or ROI.
    diligencePath: >-
      Request product analytics, pilot-cohort retention, and case studies showing incremental advisor adoption or
      efficiency gains.
    relatedQuestionRefs:
      - QO017
      - QO023
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-investor-coverage
    missingEvidence: >-
      A more exhaustive roster of executives, board members, and strategic investors beyond those named in public press
      releases and partner announcements.
    whyItMatters: >-
      Company overview can identify the public surface area of governance, but not the full operating bench or every
      economically important shareholder.
    diligencePath: Request management bios, board observer list, and a shareholder roll-up as part of confirmatory diligence.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      A single like-for-like market-sizing dataset that cleanly maps advisor-directed private-market assets,
      less-than-fully-liquid vehicles, and advisor-overseen client assets using the same denominator.
    whyItMatters: >-
      Cerulli, Crystal, and McKinsey use different universes and methodology, which makes point estimates directionally
      useful but not perfectly comparable.
    diligencePath: >-
      Rebuild TAM/SAM/SOM from one primary database or reconcile the methods explicitly with a finance/strategy
      workpaper.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cais-market-share
    missingEvidence: >-
      CAIS’s actual share of advisor-directed alternatives by product type, flow, active advisor, and fee-bearing
      assets.
    whyItMatters: >-
      Public scale metrics show reach but not share of wallet, active penetration, or revenue capture inside the served
      network.
    diligencePath: >-
      Request internal KPI definitions and segment-level market-share analysis by advisor cohort, structure type, and
      product family.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: buyer-budget-ownership
    missingEvidence: >-
      Quantitative data on who signs contracts, who owns alts operations budget, and who bears implementation cost at
      RIAs versus IBDs and home offices.
    whyItMatters: >-
      The buyer map is inferential from product and customer materials rather than supported by a published procurement
      study.
    diligencePath: >-
      Interview current clients across RIA, IBD, and home-office channels on purchase process and implementation
      governance.
    relatedQuestionRefs:
      - QM017
      - QM018
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: semi-liquid-performance-tradeoff
    missingEvidence: >-
      Longitudinal realized performance evidence comparing evergreen versus drawdown structures net of fees and
      liquidity management drag for advisor client cohorts.
    whyItMatters: >-
      The trade-off is conceptually clear, but public evidence is mostly structural and directional rather than
      dataset-driven.
    diligencePath: Request manager-level performance studies or build a comparative cohort across registered and private vehicles.
    relatedQuestionRefs:
      - QM019
      - QM020
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized take rates, advisor subscription fees, asset-manager distribution fees, and discounting terms for CAIS
      and peers.
    whyItMatters: >-
      Public pricing is mostly absent, so it is impossible to tell whether CAIS wins on product economics, services, or
      bundled enterprise packaging.
    diligencePath: Request anonymized contracts, realized pricing by customer cohort, and competitor pricing notes from active RFPs.
    relatedQuestionRefs:
      - QP010
      - QP016
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Win-loss data against iCapital, Crystal, internal build, and embedded alternatives workflows.
    whyItMatters: Public partner announcements show adoption but do not reveal competitive displacement or renewal strength.
    diligencePath: Review CRM win/loss notes, enterprise pipeline conversion, and renewal history by buyer segment.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: multi-homing
    missingEvidence: >-
      Customer-level evidence on whether firms use CAIS alongside other alternatives infrastructure or replace those
      systems entirely.
    whyItMatters: True switching costs determine how durable gross margins and pricing power can become.
    diligencePath: Interview current and lost enterprise accounts on which workflows remain off-platform.
    relatedQuestionRefs:
      - QP017
      - QP024
  - type: conflicting-data
    severity: minor
    topic: competitive-scale-comparability
    missingEvidence: One consistent denominator for platform scale across CAIS, iCapital, and Crystal.
    whyItMatters: >-
      Each company discloses different metrics—end-client assets, funds on platform, assets serviced, or active
      professionals—so relative scale is directionally but not perfectly comparable.
    diligencePath: Normalize disclosed metrics into an apples-to-apples scorecard before any valuation multiple is inferred.
    relatedQuestionRefs:
      - QP002
      - QP011
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Revenue by stream across distribution fees, technology fees, enterprise contracts, advisory services, and
      education-related monetization.
    whyItMatters: Without mix, growth quality and gross-margin trajectory cannot be underwritten.
    diligencePath: Request revenue waterfall by stream and cohort for the last eight quarters.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, gross margin, NRR, GRR, churn, support cost per client, and transaction take rate.
    whyItMatters: CAIS may look software-like, marketplace-like, or services-heavy depending on these hidden metrics.
    diligencePath: Request board KPI pack and cohort analysis segmented by enterprise, advisor, and asset-manager customers.
    relatedQuestionRefs:
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand, debt facilities, monthly burn, and explicit runway after the Series D.
    whyItMatters: The round size improves confidence but does not prove capital adequacy if cost structure is rising quickly.
    diligencePath: Request latest balance sheet, cash-flow statement, covenant schedule, and financing plan.
    relatedQuestionRefs:
      - QI020
      - QI021
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: minor
    topic: implementation-burden
    missingEvidence: Implementation labor intensity, service ratios, and support staffing per enterprise account.
    whyItMatters: Integrations may improve stickiness but can also hide labor-heavy delivery economics.
    diligencePath: Request onboarding timelines, professional-services attachment, and support headcount allocation by cohort.
    relatedQuestionRefs:
