- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / reason it may hold
  - Diligence ask
  rows:
  - - Workflow centralization reduces operational pain
    - Large ecosystems embed alternatives into core advisor tools
    - High
    - CAIS keeps broadening integrations and workflow depth
    - What share of activity depends on integrations competitors cannot easily replicate?
  - - Education and due diligence differentiate CAIS
    - Education can be copied or outsourced
    - Medium
    - Brand and advisor adoption may make content more trusted
    - What are usage, completion, and conversion metrics for education modules?
  - - Two-sided network of advisors and managers compounds over time
    - Multi-homing may limit network lock-in
    - High
    - Enterprise wins and manager joins suggest network effects are real but not exclusive
    - How many top accounts also use iCapital or internal alternatives tooling?
  - - Secondaries and product expansion widen moat
    - New modules may be copied faster than the core platform matures
    - Medium
    - Partnering is faster than building; can expand scope efficiently
    - What percent of revenue is expected from new modules like LODAS?
  - - Capital efficiency offsets smaller scale
    - iCapital can outspend on acquisitions and product breadth
    - High
    - Narrower focus may help CAIS prioritize independent-wealth needs
    - What win rates and renewal rates does CAIS sustain against iCapital in enterprise deals?
  - - Partner ecosystem creates channel power
    - Partners may remain nonexclusive and reversible
    - Medium
    - Open architecture may still be preferred by buyers
    - What contracts or usage data show partner relationships are sticky rather than promotional?
  notes: Severity reflects the risk to competitive durability rather than a judgment on company quality.
