  title: Competitor profile table
  columns:
  - Competitor / substitute
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - CAIS
    - Direct platform
    - '>$2B valuation; 2,500+ firms; 65,000+ advisors; ~$8.5T end-client assets'
    - Independent advisors, home offices, asset managers
    - Workflow depth, education, due diligence, enterprise operating-system framing
    - Smaller capital base than iCapital; public pricing opaque
  - - iCapital
    - Direct platform
    - '>$7.5B valuation; ~$945B assets serviced; 3,000+ firms; 114,000 active professionals'
    - Wealth managers, advisors, global enterprise buyers
    - Broader scope across alternatives, structured investments, annuities; large acquisition budget
    - Less evidence in public sources of CAIS-style advisor-education brand
  - - Crystal Capital Partners
    - Direct platform
    - Awards coverage cites >$1T collective assets managed by funds on platform and 200+ advisory-firm partnerships
    - Advisors and family offices seeking curated access
    - Conflict-free manager selection positioning
    - Public operating scale disclosures are limited and dated
  - - BlackRock Aladdin + iCapital
    - Adjacent ecosystem
    - Large incumbent portfolio ecosystem plus alternatives partner
    - Enterprise wealth platforms already using Aladdin
    - Can make alternatives native to core portfolio workflows
    - Partnership evidence does not prove full alternatives workflow coverage
  - - Envestnet + iCapital
    - Adjacent ecosystem
    - Large advisor workstation / UMA ecosystem
    - Enterprises standardizing managed-account workflows
    - Embeds alternatives into UMAs and broader advisor stack
    - Dependent on partner coordination; not a pure alternatives operating system
  - - Internal build / stitched stack
    - Status quo substitute
    - Uses existing custodians, reporting, OMS, and manual operations
    - Large firms with internal resources
    - Avoids vendor concentration and preserves policy control
    - High operational burden and fragmented user experience
  notes: The rows mix direct competitors with substitutes because buyers can solve the same job in multiple ways.
