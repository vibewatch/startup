  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized take rates, advisor subscription fees, asset-manager distribution fees, and discounting terms for CAIS and peers.
    whyItMatters: Public pricing is mostly absent, so it is impossible to tell whether CAIS wins on product economics, services, or bundled enterprise packaging.
    diligencePath: Request anonymized contracts, realized pricing by customer cohort, and competitor pricing notes from active RFPs.
    relatedQuestionRefs:
    - QP010
    - QP016
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Win-loss data against iCapital, Crystal, internal build, and embedded alternatives workflows.
    whyItMatters: Public partner announcements show adoption but do not reveal competitive displacement or renewal strength.
    diligencePath: Review CRM win/loss notes, enterprise pipeline conversion, and renewal history by buyer segment.
    relatedQuestionRefs:
    - QP023
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: multi-homing
    missingEvidence: Customer-level evidence on whether firms use CAIS alongside other alternatives infrastructure or replace those systems entirely.
    whyItMatters: True switching costs determine how durable gross margins and pricing power can become.
    diligencePath: Interview current and lost enterprise accounts on which workflows remain off-platform.
    relatedQuestionRefs:
    - QP017
    - QP024
  - type: conflicting-data
    severity: minor
    topic: competitive-scale-comparability
    missingEvidence: One consistent denominator for platform scale across CAIS, iCapital, and Crystal.
    whyItMatters: Each company discloses different metrics—end-client assets, funds on platform, assets serviced, or active professionals—so relative scale is directionally but not perfectly comparable.
    diligencePath: Normalize disclosed metrics into an apples-to-apples scorecard before any valuation multiple is inferred.
    relatedQuestionRefs:
    - QP002
    - QP011
    relatedTableRefs:
    - TP001
