- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / approach
  - Price / unit / contract model
  - What is publicly visible
  - What is not public
  - Implication
  rows:
  - - CAIS custom feeder solution
    - Technology fee as low as 5 bps depending on AUM and complexity
    - Explicit low-end technology fee and transparency positioning
    - Realized all-in costs by client cohort
    - Shows CAIS will disclose price selectively when it sees a wedge
  - - CAIS core platform
    - Enterprise / workflow relationship likely customized
    - Public materials emphasize workflow, not list pricing
    - Advisor fees, asset-manager fees, minimum commitments, discounting
    - Buyer must diligence economics directly
  - - iCapital core platform
    - Enterprise / multi-product relationship likely customized
    - Public materials emphasize platform breadth and profitability
    - List pricing, module pricing, discounting, placement economics
    - Scale advantage may not translate into lower customer price
  - - Crystal Capital
    - Conflict-free / curated-access positioning
    - Awards coverage says it does not receive manager compensation or placement fees
    - Client pricing and service fees
    - Commercial model may appeal to buyers sensitive to conflicts
  - - Internal build
    - Capex plus staff and vendor bundle costs
    - Costs show up across teams and vendors rather than one invoice
    - Full loaded labor and control burden
    - Apparent vendor savings can be offset by operational overhead
  notes: This table intentionally separates visible pricing fragments from the much larger set of unknown economics.
