- id: pricing-switching-and-partner-power
  title: Pricing Is Opaque, So Switching Costs and Partner Power Matter More
  body: >-
    The public record gives only a narrow glimpse into pricing. CAIS disclosed feeder-fund technology pricing as low as five basis points, explicitly attacking an opaque-cost area inside custom feeder structures. That disclosure is strategically interesting because it targets a pain point felt most acutely by larger firms building repeatable alternatives programs, not only by individual advisors transacting once. Outside that narrow wedge, however, pricing is largely hidden. Neither CAIS nor iCapital publishes the full economics of enterprise deployments, distribution fees, or advisor-side monetization.


    That opacity makes partner evidence unusually important. CAIS has public proof that Baird, Harbor Group, LODAS, and RedBlack see value in its stack, while iCapital has public proof from BlackRock and Envestnet that alternatives are being embedded into powerful adjacent systems. Switching costs likely live in approved-list governance, advisor training, data mapping, subscription workflow, and reporting integrations. Because those costs are hard to observe from public sources, the practical moat may be less about exclusivity and more about whether a platform becomes the least disruptive workflow layer among many systems the buyer already uses.
  claimRefs:
