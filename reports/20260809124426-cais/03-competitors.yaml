- id: moat-durability-and-displacement
  title: CAIS Has a Real Wedge, but the Moat Is Not Unassailable
  body: >-
    The bullish case is straightforward: CAIS has clear evidence of demand, enterprise adoption, asset-manager access, and continued scope expansion into secondaries, automation, and AI-assisted workflows. Those signals fit a category in which alternatives are already mainstream in advisor intent but still operationally awkward. If that pain persists, CAIS can keep compounding by serving as the connective tissue between advisors, home offices, product providers, and adjacent tools.


    The bear case is equally tangible. iCapital is larger, better funded, and already paired with heavyweight ecosystems; awards and funding coverage validate category momentum but do not prove CAIS has durable pricing power or the best renewal profile. Moreover, if custodians, portfolio systems, or large ecosystems make alternatives operationally native, CAIS’s distinctiveness could compress even while the overall market grows. The public evidence therefore supports a moderate moat rating: real differentiation today, but not enough to assume lock-in or category ownership without deeper diligence on win rates, pricing, and multi-homing behavior.
