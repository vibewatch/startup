  - FE001
  - FE002
- id: architecture-and-dependencies
  title: Architecture Looks Modular and Partner-Dependent
  body: >-
    The public record suggests a modular operating model, but not a fully transparent architecture. CAIS appears to coordinate multiple layers—advisor UX, home-office controls, diligence content, transaction workflow, reporting, AI, and now secondaries—without owning every downstream component. That is consistent with the RedBlack and LODAS partnerships, which extend the product into portfolio management and secondary liquidity without implying those capabilities were built fully in-house. It is also consistent with customer examples such as Baird and Summit, where the product is framed as a centralizing layer across fragmented systems.


    This architecture style can be a feature, not a bug: orchestration often matters more than raw infrastructure ownership in wealth-tech workflows. But it also means the dependency surface is broader. Product quality depends on partner interfaces, regulated processes, and internal configuration discipline. The strongest public evidence is therefore that CAIS is a connective control plane; the weakest is that investors still cannot see the full system diagram or quantify concentration in any single dependency.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE013
  - CE014
  - CE026
  - CE030
  - CE033
  tableRefs:
