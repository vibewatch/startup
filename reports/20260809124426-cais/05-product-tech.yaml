  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture-detail
    missingEvidence: A detailed system architecture, named cloud / data stack, and internal service boundaries for CAIS.
    whyItMatters: Without that detail, investors cannot verify scalability, vendor concentration, or incident blast radius.
    diligencePath: Request internal architecture diagrams, data-flow maps, and dependency inventories.
    relatedQuestionRefs:
    - QE008
    - QE017
    relatedTableRefs:
    - TE003
    relatedFigureRefs:
    - FE001
    - FE003
  - type: private-evidence-only
    severity: material
    topic: trust-verification
    missingEvidence: Third-party certifications, uptime / incident history, penetration-test results, and customer-facing SLAs.
    whyItMatters: Policy statements are helpful, but they do not prove reliability, resilience, or security maturity.
    diligencePath: Request SOC / ISO materials, security questionnaire answers, incident logs, and uptime reporting.
    relatedQuestionRefs:
    - QE010
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: ai-governance
    missingEvidence: How CAISey / Claude outputs are permissioned, logged, tested, and reviewed for suitability or hallucination risk.
    whyItMatters: AI can compress research friction but could create compliance or trust risk if controls are weak.
    diligencePath: Request AI governance policies, evaluation metrics, and human-review workflows.
    relatedQuestionRefs:
    - QE005
    - QE013
    - QE022
  - type: private-evidence-only
    severity: minor
    topic: module-adoption
    missingEvidence: Adoption and usage statistics by module, including which customers use Compass, RedBlack, LODAS, and discovery tools.
    whyItMatters: Breadth of product claims does not prove depth of usage or monetization.
    diligencePath: Request module-level MAUs, attach rates, rollout cohorts, and renewal impact by feature family.
    relatedQuestionRefs:
    - QE012
    - QE019
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
