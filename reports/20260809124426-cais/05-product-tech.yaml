- id: trust-and-control-surface
  title: Trust Evidence Is Real but Incomplete
  body: >-
    CAIS does publish meaningful trust and control language. The privacy policy describes firewalls, anti-virus software, encryption for data storage, automated monitoring, and automatic or semi-automatic rollover design. The terms page describes restricted areas with user credentials and additional identifiers. Together with the registered-adviser disclosure environment, those statements indicate that the company treats the platform as a controlled, monitored environment rather than as a public-content site.


    But policy statements are not the same as technical proof. The current public source set does not show a public status page, incident history, uptime statistics, external certifications, or a detailed explanation of how CAISey permissions and output governance work. That leaves a credibility gap exactly where technical diligence should be most demanding. The public evidence is enough to establish that CAIS thinks seriously about trust and compliance; it is not enough to conclude that the control surface has been independently validated to institutional standards.
  claimRefs:
  - CE016
  - CE017
  - CE018
  - CE019
  - CE029
  - CE031
  - CE032
  - CE035
  - CE036
