chapter:
  number: 2
  title: Market Analysis
  summary: 'CAIS operates inside a fast-growing but still underpenetrated slice of private markets: advisor-mediated alternatives infrastructure. The strongest evidence is that adoption intent in wealth management is already mainstream—90%+ of advisors allocate to alternatives, Cerulli sees a $2 trillion expansion opportunity in advisor-intermediated private markets, and McKinsey documents rapid growth in retail and semi-liquid structures—while the weakest evidence is a clean, like-for-like market-share denominator for any single platform.'
sections:
- id: market-boundary
  title: What Market CAIS Is Actually In
  body: >-
    The relevant market for CAIS is narrower than “all alternative investments” and broader than a simple product shelf. CAIS is not a direct-to-consumer investing app, nor is it only a feeder-fund administrator. The product pages, workflow articles, and customer proof all point to the same market definition: advisor-mediated alternatives infrastructure. That includes product discovery, due diligence materials, education, subscription workflow, post-trade servicing, reporting, and integrations across custodians and adjacent advisor systems. The economic buyer is therefore not only the end investor but also the advisory firm, home office, or asset manager that needs alternatives to fit inside a repeatable client-service process.


    This framing matters because the status-quo substitute is often not another marketplace website. It is manual operations, point solutions, or adjacent wealth-tech stacks that can increasingly absorb alternatives features. CAIS competes against those substitutes as much as it competes against another alts platform. That is why integrations and lifecycle automation appear repeatedly in company, customer, and third-party materials: if alternatives remain operationally foreign to advisor workflows, adoption stalls even when demand exists.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM030
  - CM036
  - CM038
  tableRefs:
  - TM001
- id: sizing-and-adoption
  title: Sizing the Wealth-Channel Opportunity
  body: >-
    The directional market signal is unusually strong. Cerulli says U.S. advisors already allocate about $2.2 trillion to less-than-fully-liquid private capital and that another $2 trillion could be added over the next five years. Crystal’s 2026 trend report offers a similar directional conclusion through a slightly different lens, placing advisor-directed private-market assets at roughly $1.9 trillion in 2025 and projecting $3.7 trillion by 2029, with penetration of advisor-directed assets rising from roughly 2.4% toward 3.3% by 2027. McKinsey broadens the view: retail capital flowing into alternative structures reached $204 billion in 2025, and alternative forms of capital AUM grew from about $8 trillion to $8.5 trillion that year, faster than traditional closed-end funds.


    Survey data shows why those numbers can keep compounding. Mercer and CAIS report near-universal advisor adoption, with 90% allocating to alternatives and 88% planning to increase allocations. But adoption breadth is ahead of allocation depth. Even if most advisors already “use” alternatives, the share of the typical book allocated to private markets remains relatively low, which means the remaining market expansion is as much about deeper penetration and better workflow support as it is about first-time adoption.
  claimRefs:
