tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Advisor-mediated private funds and semi-liquid alternatives
    - Private equity, private credit, hedge funds, real estate, infrastructure, BDCs, interval funds, tender funds, structured alternatives sourced through advisors
    - Pure institutional LP allocations outside advisor workflows
    - RIAs, IBDs, home offices, asset managers
    - This is CAIS’s core addressable market
  - - Workflow infrastructure for alternatives
    - Subscription processing, due diligence content, post-trade servicing, reporting, integrations, education
    - Standalone fund manufacturing without advisor workflow
    - Advisory firms and platform operators
    - Operations friction is a major adoption bottleneck
  - - Adjacent wealth-tech substitutes
    - UMA, model, rebalancing, OMS, custodian, reporting systems that embed alternatives
    - Direct-to-consumer crowdfunding and brokerage apps
    - Large wealth firms and integrated platforms
    - Substitutes can absorb parts of CAIS’s value proposition
  - - Direct-to-consumer alternatives platforms
    - Retail self-directed private-market access
    - Advisor-mediated channel
    - Retail investors themselves
    - Useful adjacency, but not CAIS’s primary market
  - - Traditional institutional private-markets distribution
    - Direct GP-to-institution relationships
    - Independent wealth-channel distribution infrastructure
    - Institutional allocators
    - CAIS wins where asset managers need scalable access to fragmented advisor channels
  notes: The table defines the market around advisor-mediated workflow and distribution rather than around every form of alternative investing.
