  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: A single like-for-like market-sizing dataset that cleanly maps advisor-directed private-market assets, less-than-fully-liquid vehicles, and advisor-overseen client assets using the same denominator.
    whyItMatters: Cerulli, Crystal, and McKinsey use different universes and methodology, which makes point estimates directionally useful but not perfectly comparable.
    diligencePath: Rebuild TAM/SAM/SOM from one primary database or reconcile the methods explicitly with a finance/strategy workpaper.
    relatedQuestionRefs:
    - QM006
    - QM007
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: cais-market-share
    missingEvidence: CAIS’s actual share of advisor-directed alternatives by product type, flow, active advisor, and fee-bearing assets.
    whyItMatters: Public scale metrics show reach but not share of wallet, active penetration, or revenue capture inside the served network.
    diligencePath: Request internal KPI definitions and segment-level market-share analysis by advisor cohort, structure type, and product family.
    relatedQuestionRefs:
    - QM023
    - QM025
  - type: private-evidence-only
    severity: minor
    topic: buyer-budget-ownership
    missingEvidence: Quantitative data on who signs contracts, who owns alts operations budget, and who bears implementation cost at RIAs versus IBDs and home offices.
    whyItMatters: The buyer map is inferential from product and customer materials rather than supported by a published procurement study.
    diligencePath: Interview current clients across RIA, IBD, and home-office channels on purchase process and implementation governance.
    relatedQuestionRefs:
    - QM017
    - QM018
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: semi-liquid-performance-tradeoff
    missingEvidence: Longitudinal realized performance evidence comparing evergreen versus drawdown structures net of fees and liquidity management drag for advisor client cohorts.
    whyItMatters: The trade-off is conceptually clear, but public evidence is mostly structural and directional rather than dataset-driven.
    diligencePath: Request manager-level performance studies or build a comparative cohort across registered and private vehicles.
    relatedQuestionRefs:
    - QM019
    - QM020
