callouts:
- calloutType: insight
  title: The market is mainstream in intent but not in depth
  body: Near-universal advisor adoption and low-single-digit penetration of advisor-directed assets can both be true at once. That combination is exactly what makes the wealth-channel alts market attractive for infrastructure providers.
  claimRefs:
  - CM004
  - CM005
  - CM010
  - CM011
- calloutType: risk
  title: Semi-liquid access is not the same as true liquidity
  body: Evergreen and interval-fund wrappers widen access, but redemption caps, proration, valuation lag, and liquidity sleeves mean the operational promise can still break under stress.
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM023
- calloutType: strength
  title: Operations is the wedge
  body: Because paperwork, reporting, and diligence remain major obstacles, platforms that solve lifecycle friction can monetize market growth without manufacturing the underlying funds.
