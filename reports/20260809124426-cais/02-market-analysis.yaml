- id: drivers-and-constraints
  title: What Is Driving Adoption—and What Still Slows It
  body: >-
    The drivers are clear and structural. Advisors need new sources of income, differentiation, and diversification in a market where public-equity concentration is high and the classic 60/40 playbook no longer feels sufficient on its own. Cerulli says managers see value-add and income demand as central growth drivers. CAIS Advisors’ own market commentary emphasizes shrinking public-market breadth, growing concentration, and the appeal of alternatives as a way to access private growth and differentiated return drivers. At the product level, evergreen and registered structures are expanding access by reducing minimums and packaging liquidity in a more wealth-friendly form.


    The frictions are just as important. CAIS’s survey data says paperwork and administrative burden remain the biggest obstacle, followed by liquidity constraints, due diligence and compliance, and fees. The structural critiques are not cosmetic: evergreen and interval-fund wrappers can improve access, but they introduce real trade-offs such as liquidity sleeves, valuation lag, capped repurchases, and possible proration in stressed periods. As a result, CAIS’s market is governed as much by operational trust and structure suitability as by headline appetite for private markets. Platforms that reduce friction without obscuring those trade-offs should keep taking share; platforms that only promise access risk becoming commoditized.
