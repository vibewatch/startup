  topStrengths:
    - Vista Equity Partners 领投 $170M Series D 轮，估值超过 $2B，给出强战略背书。
    - 覆盖 2,500+ 家机构、65,000+ 名顾问，2026 年交易量 / 资产快速增长，平台规模信号扎实。
    - 产品横跨工作流、尽调、教育、AI 和新兴二级流动性能力。
    - 清晰吃到顾问渠道推动私募市场增长的长期红利。
    - 可比公司表明，CAIS 应与严肃的财富 / 另类资产基础设施标的一起讨论。
  topRisks:
    - 公开证据仍缺审计收入、利润率、留存和现金生成指标。
    - 溢价叙事取决于 AI、集成和二级市场能力能否落地，同时不出现重大控制失误。
    - 股权结构和优先股堆叠不透明，可能让看似合理的表观估值对新投资人变得没那么划算。
    - 上市可比公司的收入倍数明显低于战略型私有交易。
    - 监管、安全或客户粘性一旦受挫，估值溢价可能很快收窄。
  unresolvedGaps:
    - FY2025-FY2026 经审计财报，包括按收入流拆分的收入和利润率结构。
    - 净收入留存（NRR）、总留存（GRR）以及客户 / 管理人集中度明细。
    - 完整股权结构表、清算优先权、附函，以及与最新轮次绑定的任何老股机制。
    - 实施和支持负担，用于判断经济性更像软件还是重服务。
    - 除头部投资人角色外，IPO 准备度、上市公司控制和董事会 / 治理结构证据。
