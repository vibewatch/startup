      - number: '1.2'
        title: Leadership Visibility, Governance Signals, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of the clearest strengths in the public record. Matt Brown remains founder and
              CEO and is still the principal voice in fundraising, product philosophy, and wealth-channel positioning.
              Other public executives are visible, but less comprehensively than one would want for late-stage
              diligence. Brad Walker appears as President in the January 2026 CAIS Live release, while the May 2026 AI
              release identifies Kan Kotecha as CTO and Brendan Cuddihy as COO. Those disclosures show functional depth
              in product and go-to-market, but they still do not provide a full executive roster, a current board list,
              or committee structure.


              The 2026 Series D added the strongest new governance data point: Vista president David Breach joined the
              board, and representatives from Blue Owl, Lord Abbett, Fortress, and Carlyle became board observers. That
              is a material signal because it suggests both strategic validation and higher governance density from
              sophisticated shareholders. Even so, the public record still leaves open how much control sits with
              founder-management versus financial sponsors, and whether CAIS’s operating model creates conflicts between
              distribution incentives and advisor-first positioning. The company’s own disclosures around fees,
              fiduciary status, and investment risk make that a real diligence topic rather than a theoretical one.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
