  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              CAIS’s advisory footprint means regulatory risk is structural, not incidental. CAIS Advisors is an
              SEC-registered adviser, so disclosure quality, books-and-records, fees, conflicts, and supervisory
              adequacy can all become examination or enforcement issues. The 2026 SEC priorities and multiple legal
              summaries consistently point to fees, conflicts, AI oversight, outsourcing, and cybersecurity as areas of
              focus. For CAIS, that matters because the platform mixes wealth workflows, sensitive data, and newer
              AI-enabled interfaces.


              The company’s own legal surfaces underscore the issue. Privacy and terms materials show a monitored,
              authenticated environment and broad disclosures around liability and data handling, but they are not
              third-party validations. The risk is therefore not just that CAIS could violate a rule; it is that the
              public evidence is insufficient to prove the control framework is already institutional-grade. The SEC’s
              standing risk-alert program reinforces that supervision is continuous, not one-and-done.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR030
              - CR031
