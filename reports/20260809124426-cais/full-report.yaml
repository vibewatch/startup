chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and What CAIS Actually Sells
        blocks:
          - type: paragraph
            body: >-
              CAIS describes itself as the leading alternative investment platform for independent financial advisors,
              but the more precise framing is that it is a workflow and distribution operating system for the advisor
              channel. The company says it was founded in 2009 to make alternative investments more available to
              financial advisors and to reduce the manual friction that historically made private funds, structured
              products, and related workflows hard to scale outside large institutions. That framing is consistent
              across the homepage, the 2026 fundraising release, and multiple product articles: CAIS wants to own the
              pre-trade, trade, and post-trade operating layer rather than merely act as a marketplace listing page.


              Public product evidence supports that positioning. CAIS’s own technology pages say advisors and home
              offices can use firm-configured homepages, product menus filtered by accreditation level and minimums,
              CAIS IQ educational content, and product pages that bundle fund documents, disclosures, videos, and
              presentations. Company-authored articles further describe a single digital marketplace that connects
              orders, positions, capital calls, distributions, K-1s, and monitoring. In other words, the business model
              is not just access to alternative funds; it is a technology-and-service layer intended to make alternative
              allocations feel operationally closer to traditional assets for independent wealth firms.
