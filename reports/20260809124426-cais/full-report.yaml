      - number: '8.3'
        title: Scenario Range, Recommendation, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario math argues for a fair-to-rich stance. A bull case can be made if CAIS converts market
              leadership into stronger disclosed economics, preserves high growth, and keeps expanding into adjacent
              workflow surfaces. A base case assumes strong but gradually normalized growth plus ongoing disclosure
              opacity; in that view, the current round sits close to fair value. The bear case is not a
              collapse-of-quality case so much as a multiple-compression and evidence-gap case: if growth slows or the
              business proves less software-like than investors assume, the premium can narrow quickly.


              That is why the right publishable recommendation is track. Public evidence is strong enough to say CAIS
              matters and likely deserves a healthy private-market valuation. It is not strong enough to conclude that
              the current entry offers a compelling margin of safety. Investors should approach the asset with
              constructive interest, but only with explicit price discipline and diligence rights.
            claimRefs:
