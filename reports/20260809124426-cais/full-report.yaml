      - number: '1.4'
        title: Scale Claims, Product Velocity, and Why the Platform Narrative Looks Credible
        blocks:
          - type: paragraph
            body: >-
              CAIS’s July 2026 release carries the headline operating metrics: more than 2,500 firms, over 65,000
              advisors, and approximately $8.5 trillion in end-client assets represented on the platform. The same
              release says first-half 2026 transaction volume grew 53% year over year and total platform assets rose
              55%, while more than 425 new RIAs and IBDs representing $1.8 trillion in assets joined since 2025. Those
              are company-reported numbers rather than independently audited KPIs, but they are directionally reinforced
              by customer proofs, event scale, and the cadence of adjacent product launches.


              What makes the story more believable than a pure marketing deck is the consistency of surrounding
              evidence. Summit Wealth Group’s public rationale for joining CAIS emphasizes due diligence, education,
              reporting, and operational simplification. Mercer-backed survey data shows advisors increasingly
              allocating to alternatives. Company release notes show a real sequence of delivered capabilities:
              interval-fund redemptions, AI-assisted AML/KYC, CAISey, expanded Compass analytics, bulk trade entry, Axos
              integration, LODAS-linked secondary functionality, and an MCP-based Claude experience. The gap is
              definitional clarity. Public materials do not fully explain how CAIS distinguishes active advisors from
              represented network users, or what revenue mix sits behind its 37% three-year organic CAGR.
