              supply-side customers are asset managers that want distribution into the fragmented wealth channel. Public
              materials also make it clear that end investors are important beneficiaries of the platform, but they are
              usually not the direct CAIS buyer. That distinction matters because the user, payer, and strategic value
              of the relationship can vary widely across segments.


