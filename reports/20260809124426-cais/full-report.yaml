companyProfile:
  summary: >
    CAIS is a New York-headquartered alternatives platform founded in 2009 by Matt Brown. The company sells a
    workflow-led operating system for the pre-trade, trade, and post-trade lifecycle of alternative investments, pairing
    product access with diligence, education, and advisor-facing tooling. Its customer system spans independent RIAs,
    broker-dealers, home-office platforms, and asset managers seeking wealth-channel distribution. The July 2026 Series
    D at a valuation above $2 billion confirms meaningful market validation, but public evidence still leaves the core
    economic and cap-table questions only partially answered.
