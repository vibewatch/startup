      - number: '7.2'
        title: Operational, Technical, and Product-Structure Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, CAIS looks like a central orchestration layer. That creates leverage, but it also creates
              concentrated failure paths. Privacy materials describe firewalls, encryption, monitoring, and rollover
              design, which is directionally positive. Yet the same public record lacks incident histories, external
              certifications, or uptime data. AI adds another layer: the Claude / CAISey workflow could become a
              differentiator, but also a source of supervisory and suitability risk if permissions, prompts, or outputs
              are poorly controlled.


              Product-structure risk matters too. CAIS’s own materials on evergreen and interval-fund trade-offs
              explicitly discuss redemption limits, proration, and valuation lag. Those exposures sit in the underlying
              products, but clients may still blame the platform if expectations are poorly managed. In that sense,
              liquidity and suitability risks can rebound onto CAIS even when it is not the asset manager.
            claimRefs:
              - CR007
              - CR008
