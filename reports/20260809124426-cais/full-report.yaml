  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis Versus Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for CAIS is straightforward. The 2026 Series D was large, strategically led, and
              accompanied by metrics that suggest real momentum rather than a rescue financing. CAIS reported 37%
              three-year organic revenue CAGR, 53% H1 2026 transaction-volume growth, 55% growth in platform assets, and
              continuing expansion across advisor firms, AI-enabled workflows, secondaries, and integrations. In a
              market where advisor-mediated alternatives adoption is still increasing, those are credible ingredients
              for a premium story.


              The anti-thesis is equally straightforward. The current price is being justified mostly by scale proxies,
              product breadth, and investor validation, not by audited unit economics. Public evidence still does not
              reveal the revenue base, gross margin profile, renewal behavior, or cap-table terms that would let
              investors decide whether CAIS is software-like enough to deserve a meaningful premium to public comps. In
              other words, the company may be excellent, but excellence and entry price are not the same question.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
