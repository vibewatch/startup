  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Set Is Wider Than Direct Platforms
        blocks:
          - type: paragraph
            body: >-
              The direct peer set starts with advisor-focused alternatives platforms such as CAIS, iCapital, and Crystal
              Capital, but that is not where the landscape ends. The real substitute set also includes embedded
              wealth-tech ecosystems—most visibly iCapital paired with BlackRock Aladdin Wealth and Envestnet—as well as
              enterprise firms that stitch together custodians, reporting systems, portfolio tools, and manual
              operations. In other words, the buyer is not choosing only among marketplace websites. The buyer is
              choosing which operating model will make alternatives usable at scale.


              That broader framing matters because CAIS’s core pitch is workflow centralization. Baird’s deployment did
              not emphasize browsing more funds; it emphasized centralizing all alternative investments on one platform,
              automating processes, and improving data management. Independent media coverage also frames category
              growth as a response to the manual paperwork, reporting, and due-diligence burden that still slows advisor
              adoption. The competitive question is therefore not merely who has the largest shelf. It is who best makes
              private-market exposure operationally native inside the wealth-management stack.
            claimRefs:
              - CP001
              - CP003
              - CP017
              - CP018
              - CP033
