      - number: '2.2'
        title: Sizing the Wealth-Channel Opportunity
        blocks:
          - type: paragraph
            body: >-
              The directional market signal is unusually strong. Cerulli says U.S. advisors already allocate about $2.2
              trillion to less-than-fully-liquid private capital and that another $2 trillion could be added over the
              next five years. Crystal’s 2026 trend report offers a similar directional conclusion through a slightly
              different lens, placing advisor-directed private-market assets at roughly $1.9 trillion in 2025 and
              projecting $3.7 trillion by 2029, with penetration of advisor-directed assets rising from roughly 2.4%
              toward 3.3% by 2027. McKinsey broadens the view: retail capital flowing into alternative structures
              reached $204 billion in 2025, and alternative forms of capital AUM grew from about $8 trillion to $8.5
              trillion that year, faster than traditional closed-end funds.


              Survey data shows why those numbers can keep compounding. Mercer and CAIS report near-universal advisor
              adoption, with 90% allocating to alternatives and 88% planning to increase allocations. But adoption
              breadth is ahead of allocation depth. Even if most advisors already “use” alternatives, the share of the
              typical book allocated to private markets remains relatively low, which means the remaining market
              expansion is as much about deeper penetration and better workflow support as it is about first-time
              adoption.
