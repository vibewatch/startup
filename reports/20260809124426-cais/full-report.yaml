              show restricted site areas, credentialing, monitoring, cookies, analytics, data sharing with service
              providers, and a posture that requires ongoing safeguards around investor and advisor information. None of
              those obligations are necessarily unusual, but they are recurring and operationally real.


              The hiring surface points in the same direction. Open roles include AI & Data Systems Engineer, Chief
              Information Security Officer, Lead Application Security Engineer, and Vice President of Liquidity
              Solutions. Read together with 2026 SEC exam-priority commentary focused on fees, conflicts, AI,
