      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              CAIS does not read as IPO-ready from public evidence alone. It reads as a rapidly scaling private platform
              whose headline validation is ahead of its disclosure quality. That is not unusual for a late-stage private
              fintech, but it matters for underwriting. Total capital raised is now large enough that preference
              structure, board rights, and any secondary mechanics could materially change the attractiveness of the
              common-equity story even if the headline valuation appears reasonable.


              The final diligence agenda is therefore clear and finite. Investors need the actual financial statements,
              line-of-business revenue mix, cohort and concentration data, implementation and support burden, and the
              full preference stack. If those materials confirm software-like economics and sticky enterprise behavior,
              the current mark could look attractive in hindsight. If they do not, the round may prove to have been more
              a statement of category enthusiasm than a compelling new-money entry point.
            claimRefs:
              - CV035
