      - number: '3.2'
        title: CAIS Wins on Workflow Depth; iCapital Wins on Scale Breadth
        blocks:
          - type: paragraph
            body: >-
              CAIS’s strongest public differentiation is its attempt to combine education, diligence, transaction
              workflow, post-trade support, and integrations inside a purpose-built independent-wealth operating system.
              Its enterprise examples—Baird on the advisor side, Harbor Group on the manager side, and RedBlack on
              portfolio operations—suggest the platform is most credible when alternatives adoption must be coordinated
              across home office, advisors, operations, and product supply. The roadmap and release notes reinforce that
              picture: CAIS keeps shipping discovery, search, integration, and automation features rather than framing
              itself as a static marketplace.


              iCapital, by contrast, looks broader and much better capitalized. Public materials describe a platform
              that spans alternatives, structured investments, and annuities, while the 2025 financing gives iCapital
              far more balance-sheet flexibility to acquire capabilities and global reach. That does not automatically
              make CAIS weaker, but it does shift the burden of proof: CAIS must show that workflow specialization and
              advisor-channel intimacy can outweigh a rival with more capital, more assets serviced, and deeper
              adjacency into enterprise ecosystems.
