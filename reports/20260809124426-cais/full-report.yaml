  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What Market CAIS Is Actually In
        blocks:
          - type: paragraph
            body: >-
              The relevant market for CAIS is narrower than “all alternative investments” and broader than a simple
              product shelf. CAIS is not a direct-to-consumer investing app, nor is it only a feeder-fund administrator.
              The product pages, workflow articles, and customer proof all point to the same market definition:
              advisor-mediated alternatives infrastructure. That includes product discovery, due diligence materials,
              education, subscription workflow, post-trade servicing, reporting, and integrations across custodians and
              adjacent advisor systems. The economic buyer is therefore not only the end investor but also the advisory
              firm, home office, or asset manager that needs alternatives to fit inside a repeatable client-service
              process.


              This framing matters because the status-quo substitute is often not another marketplace website. It is
              manual operations, point solutions, or adjacent wealth-tech stacks that can increasingly absorb
              alternatives features. CAIS competes against those substitutes as much as it competes against another alts
              platform. That is why integrations and lifecycle automation appear repeatedly in company, customer, and
              third-party materials: if alternatives remain operationally foreign to advisor workflows, adoption stalls
              even when demand exists.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM030
              - CM036
              - CM038
