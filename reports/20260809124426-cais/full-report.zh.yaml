companyProfile:
  summary: >
    CAIS 是一家总部位于纽约的另类投资平台，由 Matt Brown 于 2009 年创立。公司销售一套围绕另类投资交易前、交易和交易后全生命周期的工作流操作系统，把产品准入与尽调、教育和面向顾问的工具放在一起。它的客户体系覆盖独立
    RIA、经纪交易商、总部平台，以及希望进入财富管理渠道的资产管理人。2026 年 7 月的 Series D 轮估值超过 $2 billion，证明市场验证已经相当充分；但公开证据仍只部分回答了核心经济性和股权结构问题。
