  - id: FU004
    title: 留存 / 重复客群代理
    type: cohort
    layout: standard
    summary: 代理披露图显示，CAIS 有短周期互动信号，但没有公开的长周期续约曲线。
    approximationNotes: 这些不是真正的客户留存百分比。数值 100 表示纳入的公开来源至少对该周期或维度给出一个披露信号；0 表示没有找到这类披露。
    data:
      columns:
        - 获客证明
