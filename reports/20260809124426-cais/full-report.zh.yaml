      - CV013
      - CV015
      - CV017
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 上调建议前的证据门槛
    type: kpi
    layout: standard
    summary: 少数缺失披露决定 CAIS 能否从跟踪上调为买入。
    data:
      items:
        - label: 收入流拆分
          value: Undisclosed
          note: 需要市场型、企业型和附属收入的组合
        - label: 毛利率画像
          value: Undisclosed
          note: 溢价倍数的核心决定因素
        - label: NRR / GRR / 集中度
          value: Undisclosed
          note: 检验粘性和客户质量
        - label: 优先权结构 / 条款
