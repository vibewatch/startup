figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从创立到 2026 年，CAIS 的公开轨迹由几条线拼成：早期搭建顾问渠道基础设施、战略融资轮次、教育业务放大，以及 AI 主导的产品推进。
    data:
      items:
        - date: 2009-01
