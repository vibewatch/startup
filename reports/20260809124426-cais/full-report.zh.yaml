      - number: '1.5'
        title: 里程碑、披露摩擦与主要不利背景
        blocks:
          - type: paragraph
            body: >-
              里程碑画面很强：2009 年创立，2022 年跨过独角兽门槛，2026 年估值跃升至 $2 billion 以上，托管和工作流集成扩张，AI 投入可见，并通过 CAIS Live 和 CAIS IQ
              建成有规模的教育业务。历史公司文章还显示，市场宽度和网络资产在 2026 年融资前就已明显增长，说明最近融资是在加速既有曲线，而不是拯救停滞业务。


              但本章不应被读成完全放行。CAIS Advisors 的监管备案确认存在一个注册投资顾问实体和主要办公室，但公开材料仍没有披露合并收入、利润率、股权集中度，或 RIA
              子公司与更大平台经济性之间的确切关系。公司披露也明确提醒，投资可能缺乏流动性且有风险，CAIS 或其关联方会因平台促成的私募基金和策略收取费用。这并不否定业务；它意味着投资人应把 CAIS
              视为一家战略位置清晰、但财务透明度仍不足的私募市场基础设施公司来承销。
