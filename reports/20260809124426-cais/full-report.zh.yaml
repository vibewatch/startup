      - CR007
      - CR013
      - CR040
    approximationNotes: 单元格值是对公开证据的序位概括，不是损失模型。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 几类看似分散的风险，最终流向同样的结果：客户信任、收入质量和融资信心。
    data:
      nodes:
        - id: a
          label: AI / 网络安全 / 隐私控制风险
        - id: b
          label: 合作伙伴 / 集成风险
        - id: c
          label: 产品结构 / 适当性风险
        - id: d
          label: 客户信任
        - id: e
          label: 收入质量
        - id: f
          label: 融资 / 估值信心
      edges:
        - to: d
          from: a
        - to: d
          from: b
        - to: d
          from: c
        - to: e
          from: d
        - to: f
          from: e
    claimRefs:
      - CR011
      - CR013
      - CR018
      - CR035
      - CR038
    approximationNotes: DAG 展示风险传导逻辑，而不是事件概率。
