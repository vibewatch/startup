    title: 依赖图谱
    type: dag
    layout: wide
    summary: CAIS 最重要的外部依赖集中在受监管记录、合作伙伴模块和模型界面上。
    data:
      nodes:
        - id: d1
          label: CAIS 工作流核心
        - id: d2
          label: 记录保存供应商
        - id: d3
