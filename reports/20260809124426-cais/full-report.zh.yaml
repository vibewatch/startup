  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              CAIS 的正面逻辑很直接。2026 年 Series D 轮规模大、由战略投资者领投，并配有一组指标，更像真实动能而非救助融资。CAIS 披露了三年有机收入 CAGR 为 37%、2026 年 H1 交易量增长
              53%、平台资产增长 55%，并继续在顾问公司、AI 工作流、二级交易和集成上扩张。在顾问中介的另类投资渗透率仍在提升的市场里，这些要素足以支撑一个溢价故事。


              反向逻辑也同样直接。当前价格主要靠规模代理指标、产品广度和投资人背书支撑，而不是经审计的单位经济模型。公开证据仍未披露收入基数、毛利率画像、续约行为或股权结构条款，投资者无法判断 CAIS
              是否足够像软件公司，值得相对上市可比公司享有显著溢价。换句话说，公司可能很好，但公司质量和入场价格不是同一个问题。
