      - number: '2.2'
        title: 财富渠道机会有多大
        blocks:
          - type: paragraph
            body: >-
              方向性市场信号异常强。Cerulli 称，美国顾问已经向流动性不完全的私募资本配置约 $2.2 trillion，未来五年还可能增加 $2 trillion。Crystal 的 2026
              年趋势报告从略有不同的角度给出相似结论：顾问主导的私募市场资产在 2025 年约为 $1.9 trillion，到 2029 年预计达到 $3.7 trillion；顾问主导资产中的渗透率则从约 2.4% 升至
              2027 年约 3.3%。McKinsey 把视角拉得更宽：2025 年流入另类结构的零售资本达到 $204 billion，当年另类资本形式的 AUM 从约 $8 trillion 增至 $8.5
              trillion，增长速度快于传统封闭式基金。


              调查数据解释了这些数字为何还能复利。Mercer 和 CAIS 报告称，顾问采用几乎已经普及：90% 配置另类资产，88%
              计划提高配置。但采用广度领先于配置深度。即使多数顾问已经“使用”另类资产，典型账本配置到私募市场的比例仍相对较低；剩余市场扩张既来自更深渗透和更好工作流支持，也来自首次采用。
