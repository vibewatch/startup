            body: >-
              公开材料没有把 CAIS 呈现成单一功能。最能成立的模块地图覆盖发现、尽调内容、交易工作流、交易后监控、报告、教育和 AI 辅助。顾问和总部技术页面显示，可配置首页、SSO
              和白标等机构专属控制、按目标和合格投资者状态筛选的产品过滤器，以及管理人视频、情况说明书、披露和演示材料等内容界面。这些不是泛泛的营销口号，而是描述投资决策前、中、后的具体产品界面。


              路线图和 AI 材料进一步扩展了这个画面。CAIS 的产品发现文章指向更个性化、更有上下文的搜索；Claude / CAISey 发布称，另类投资智能应出现在顾问已经使用的系统里；公开报道又补充了作为组合构建层的
              Compass。合在一起看，这个产品更应被视为另类投资工作流编排，而不是简单市场目录。
