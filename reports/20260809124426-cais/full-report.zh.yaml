  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              CAIS 的顾问业务覆盖面决定了监管风险是结构性问题，不是偶发项。CAIS Advisors 是 SEC 注册投资顾问，因此披露质量、账簿与记录、收费、利益冲突和监督充分性，都可能进入检查或执法视野。SEC
              2026 年重点事项以及多份法律摘要反复指向收费、冲突、AI 监督、外包和网络安全。CAIS 尤其需要在意，因为平台把财富管理工作流、敏感数据和较新的 AI 界面揉在一起。


              CAIS 自身的法律披露面也把问题摆出来。隐私政策和条款材料显示，这是一个受监控、需认证的环境，并围绕责任和数据处理做了较广披露，但这些不是第三方验证。因此风险不只是 CAIS
              可能踩线；更在于公开证据不足以证明控制框架已经达到机构级。SEC 常设风险警示项目也说明，监管监督是持续的，不是一轮检查了事。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR030
