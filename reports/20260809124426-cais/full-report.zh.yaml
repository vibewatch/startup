          from: d2
        - to: d1
          from: d3
        - to: d1
          from: d4
        - to: d1
          from: d5
        - to: d1
          from: d6
    claimRefs:
      - CR002
      - CR014
      - CR015
      - CR020
      - CR033
    approximationNotes: 该图突出依赖类别，而不是网络拓扑。
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: CAIS 在公司质量上得分较高，但公开披露仍不足以支撑按当前价格给出买入建议。
    data:
      nodes:
        - id: n1
          label: 强劲战略融资轮 + 增长指标
        - id: n2
          label: 支撑较高的公司质量评分
        - id: n3
          label: 当前价格 > $2B
        - id: n4
          label: 财务 / 股权结构表披露仍不完整
        - id: n5
          label: 估值接近合理到偏贵
        - id: n6
          label: 建议 = 跟踪
      edges:
        - to: n2
          from: n1
        - to: n5
          from: n2
        - to: n5
          from: n3
        - to: n5
          from: n4
        - to: n6
          from: n5
    approximationNotes: null
    claimRefs:
