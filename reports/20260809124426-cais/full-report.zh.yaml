      - number: '2.4'
        title: 采用动力是什么，阻力还在哪里
        blocks:
          - type: paragraph
            body: >-
              驱动力清楚且结构性强。在公开股权集中度高、经典 60/40 组合本身不再足够的市场里，顾问需要新的收入来源、差异化和分散化工具。Cerulli 称，管理人把增值和收入需求视为核心增长驱动。CAIS
              Advisors
              自己的市场评论强调，公开市场宽度收缩、集中度上升，另类资产能帮助进入私募成长机会和差异化回报来源。在产品层面，常青型和注册型结构正在降低最低门槛，并用更适合财富管理的形式包装流动性，从而扩大准入。


              摩擦同样重要。CAIS
              的调查数据称，文书和行政负担仍是最大障碍，其后是流动性限制、尽调与合规、费用。结构性批评不是表面问题：常青型和间隔基金包装可以改善准入，但也带来真实取舍，例如流动性缓冲池、估值滞后、回购上限，以及压力期可能按比例兑付。因此，CAIS
              的市场既受运营信任和结构适配度约束，也受私募市场表层需求约束。能降低摩擦、又不遮蔽这些取舍的平台，应会继续拿份额；只承诺准入的平台有商品化风险。
