        blocks:
          - type: paragraph
            body: >-
              情景测算指向合理偏贵。乐观情景成立的前提是，CAIS
              能把市场领导地位转化为更强的已披露经济模型，守住高增长，并持续扩展相邻工作流表面。基准情景假设增长仍强但逐步正常化，披露不透明继续存在；在这种视角下，当前轮次接近公允价值。悲观情景并非公司质量崩塌，而是倍数压缩和证据缺口：如果增长放缓，或业务被证明不如投资者假设那样像软件，溢价会快速收窄。


              因此，可公开给出的合适建议是观察。公开证据足以说明 CAIS
              很重要，也可能配得上健康的私募市场估值。但证据还不足以断定当前入场价提供了有吸引力的安全边际。投资者可以建设性关注这项资产，但必须绑定明确的价格纪律和尽调权利。
