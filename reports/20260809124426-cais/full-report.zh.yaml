  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合比直接平台更宽
        blocks:
          - type: paragraph
            body: >-
              直接同业从面向顾问的另类投资平台开始，比如 CAIS、iCapital 和 Crystal Capital，但版图不止于此。真正的替代集合还包括嵌入式财富科技生态——最显眼的是 iCapital 搭配
              BlackRock Aladdin Wealth 和
              Envestnet——以及把托管方、报告系统、组合工具和手工运营缝在一起的企业机构。换句话说，买方不是只在几个市场网站之间选择。买方是在选择哪一种运营模式能让另类资产规模化可用。


              这个更宽的框架很重要，因为 CAIS 的核心卖点是工作流集中化。Baird
              的部署没有强调浏览更多基金，而是强调把所有另类投资集中到一个平台上、自动化流程并改进数据管理。独立媒体报道也把品类增长解读为对手工文书、报告和尽调负担的回应，这些负担仍拖慢顾问采用。竞争问题因此不只是“谁的货架最大”。问题是谁最能把私募市场敞口做成财富管理技术栈里的原生运营环节。
