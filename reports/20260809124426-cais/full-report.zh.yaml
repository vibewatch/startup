          tone: neutral
        - label: SEI 市值
          value: 12570
          detail: USD M 2026 年 8 月
          tone: neutral
        - label: SS&C 市值
          value: 18590
          detail: USD M 2026 年 8 月
          tone: neutral
    approximationNotes: 上市公司柱状值是市值；私有 / 战略柱状值是交易或融资参考值。
