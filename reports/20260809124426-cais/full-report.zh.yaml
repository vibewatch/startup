      - CV010
      - CV023
      - CV024
      - CV032
  - id: FV002
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持一个很宽但可辩护的区间，围绕当前估值标记展开，重心接近公允价值。
    data:
      items:
        - label: 熊市情景
          low: 1200
          mid: 1400
          high: 1600
          displayValue: $1.2B-$1.6B
          detail: 增长放缓，或溢价叙事破裂。
        - label: 基准情景
          low: 1900
          mid: 2150
          high: 2400
          displayValue: $1.9B-$2.4B
          detail: 质量强，但证明不完整。
        - label: 牛市情景
          low: 3000
          mid: 3300
          high: 3600
          displayValue: $3.0B-$3.6B
          detail: 经济性验证高溢价平台倍数。
        - label: 当前融资轮
          low: 2000
          mid: 2000
          high: 2000
          displayValue: '>$2.0B'
          detail: 2026 年 7 月融资参考点。
    approximationNotes: 数值为百万美元，反映投委会框架，而不是折现现金流模型。
    claimRefs:
      - CV001
      - CV028
      - CV029
      - CV030
      - CV031
