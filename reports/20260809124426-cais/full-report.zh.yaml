  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: CAIS 实际所在的市场
        blocks:
          - type: paragraph
            body: >-
              CAIS 所在市场比“所有另类投资”更窄，又比简单产品货架更宽。CAIS
              不是面向消费者的投资应用，也不只是联接基金管理人。产品页面、工作流文章和客户证明都指向同一个市场定义：由顾问主导的另类投资基础设施。它包括产品发现、尽调材料、教育、认购工作流、交易后服务、报告，以及跨托管方和相邻顾问系统的集成。因此，经济买方不只是终端投资人，也包括需要把另类资产嵌进可复制客户服务流程的顾问机构、总部或资产管理人。


              这个框架重要，因为现状替代品往往不是另一个市场网站，而是手工运营、点状方案，或能逐步吸收另类资产功能的相邻财富科技栈。CAIS
              与这些替代方案竞争的程度，不亚于与另一家另类投资平台竞争。也因此，公司、客户和第三方材料反复出现集成与生命周期自动化：如果另类资产在顾问工作流里仍显得格格不入，即使需求存在，采用也会卡住。
