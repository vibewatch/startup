      - number: '8.2'
        title: 当前定价背景与可比框架
        blocks:
          - type: paragraph
            body: >-
              可比公司集合支持的不是否定，而是纪律。私有市场里，iCapital 和 Addepar
              表明，当分销规模、平台广度和经常性经济模型可信时，财富管理和另类投资基础设施资产可以撑住数十亿美元估值。战略交易里，BlackRock 约 $3.2 billion 收购
              Preqin、收入倍数为低十几倍，说明买家愿意为定义品类的私募市场数据和工作流资产支付溢价。


              但上市可比公司仍然重要。SS&C、SEI 和 Morningstar 依靠已经验证的收入和利润流交易，其隐含收入倍数明显低于战略性私募市场交易。CAIS
              现在增长更快、稀缺性更高，可能应该相对这些上市参照享有一定溢价。即便如此，相比验证更充分的私有可比公司，CAIS 也应承受披露折价。正是这种组合，让当前估值看起来可以防守，但对新资金并不明显慷慨。CAIS
              的合作伙伴和管理人关系广度增加了战略层次，但不能取消价格纪律。
