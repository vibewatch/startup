    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最重的公开风险集中在监管控制、网络安全 / AI，以及依赖合作伙伴的工作流。
    data:
      columns:
        - 可能性
        - 严重性
        - 缓释成熟度
        - 剩余风险
      rows:
