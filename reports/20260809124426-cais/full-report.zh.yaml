            body: >-
              CAIS 的公开牵引信号足以支撑增长叙事。公司报告三年有机收入 CAGR 为 37%，2026 年上半年交易量增长 53%，平台资产增长 55%，并自 2025 年以来新接入 425 多家 RIA
              和独立经纪交易商。这些数字与 Cerulli 和 McKinsey 所说的强品类顺风方向一致。Baird 的企业部署，以及公司称 CAIS Solutions 吸引了管理近 $1 trillion
              资产的顾问兴趣，也强化了需求不只是一次性顾问账户。


              但这些仍是代理指标。它们没有揭示抽成率、收入确认政策、专业服务负担、客户留存或利润率结构。这个缺口重要，因为 CAIS
              可能像软件平台一样扩张，也可能像费用较重的市场，或像服务辅助型工作流业务；每种模型都需要不同的承销框架。因此，最稳妥的公开结论是有条件的：增长看起来强劲，但每一美元平台活动对应的经济性基本不可见。没有
              cohort 数据或毛利率证据，投资人无法判断收入动能能多高效地转化为持久经营利润。
