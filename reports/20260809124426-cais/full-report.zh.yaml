      - number: '1.4'
        title: 规模口径、产品速度，以及平台叙事为何可信
        blocks:
          - type: paragraph
            body: >-
              CAIS 2026 年 7 月公告给出了核心运营指标：超过 2,500 家机构、超过 65,000 名顾问，平台代表的终端客户资产约 $8.5 trillion。同一公告称，2026 年上半年交易量同比增长
              53%，平台资产总额增长 55%；自 2025 年以来，又有 425 多家 RIA 和 IBD 加入，代表资产 $1.8 trillion。这些是公司自报数字，不是独立审计
              KPI，但客户证明、活动规模和相邻产品发布节奏都在方向上支撑它们。


              这个故事比纯营销材料更可信，关键在于外围证据一致。Summit Wealth Group 公开解释加入 CAIS 的理由时，强调尽调、教育、报告和运营简化。Mercer
              支持的调查数据显示，顾问越来越多地配置另类资产。公司发布说明则显示一串已经交付的能力：间隔基金赎回、AI 辅助 AML/KYC、CAISey、扩展后的 Compass 分析、批量交易录入、Axos 集成、与
              LODAS 联动的二级市场功能，以及基于 MCP 的 Claude 体验。缺口在定义清晰度。公开材料没有完全解释 CAIS 如何区分活跃顾问和代表网络用户，也没有解释 37% 三年有机收入 CAGR
              背后的收入结构。
