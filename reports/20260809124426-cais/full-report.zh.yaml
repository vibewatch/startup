          - type: paragraph
            body: >-
              主要财务风险是不透明。公开来源不披露抽成率、毛利率、烧钱速度、现金跑道、续约或客户集中度。投资者因此无法判断强劲增长信号是否转化为可持续经济模型，还是业务正在积累隐藏的支持、合规和实施成本。顾问数量很大，也不能据此排除集中度风险。


              因此，真正的投资逻辑失效触发点，落在隐藏风险会突然显影的边界：监管发现、重大安全或隐私事件、合作伙伴上线延误、企业客户粘性差的证据，或明确证明经济模型不如投资者假设那样像软件。公开信息里，这些触发点没有明显触发，但也没有被完全排除。因此，在直接尽调补上证据缺口前，残余风险评级应维持偏高。投资者还应观察监管关注是否会快于
              CAIS 证明成熟控制的速度而升温。


              这个不确定性带来一个务实结论：风险监控不能等危机出现。管理层报告需要以足够频率覆盖安全态势、伙伴就绪度、企业账户健康度和控制例外，让投资者能在滑坡演变成融资或声誉事件前看见信号。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR035
              - CR036
