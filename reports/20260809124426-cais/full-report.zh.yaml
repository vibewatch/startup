              公开记录支持的是多来源收入模型，而不是单一费用线。CAIS 自己的披露称，CAIS 及 /
              或其关联方会因经平台销售的私募基金和策略收取费用，这支撑了交易或分发经济层。与此同时，公司反复把自己定位为工作流基础设施，覆盖产品发现、尽调、教育、交易前、交易和交易后服务。这个定位意味着，核心交易流之外还有技术和企业服务变现，尽管公司没有公开拆分每一层贡献多少收入。


