      - number: '1.2'
        title: 领导层可见度、治理信号与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人连续性是公开记录里最清楚的优势之一。Matt Brown 仍是创始人兼 CEO，也仍是融资、产品理念和财富渠道定位上的主要声音。其他公开高管也能看到，但对后期尽调而言还不够完整。2026 年 1 月
              CAIS Live 公告中，Brad Walker 以总裁身份出现；2026 年 5 月 AI 公告则把 Kan Kotecha 标为 CTO、Brendan Cuddihy 标为
              COO。这些披露显示产品和商业化职能有深度，但仍没有给出完整高管名单、最新董事会名单或委员会结构。


              2026 年 Series D 轮带来了最强的新治理数据点：Vista 总裁 David Breach 加入董事会，Blue Owl、Lord Abbett、Fortress 和 Carlyle
              的代表成为董事会观察员。这个信号很重要，因为它意味着战略背书，也意味着成熟股东提高了治理密度。即便如此，公开记录仍没有说明创始人管理层与财务赞助方各自掌握多少控制权，也没有说明 CAIS
              的运营模式是否会在分发激励和顾问优先定位之间制造冲突。公司自己对费用、受托身份和投资风险的披露，使这成为真实的尽调议题，而不是理论问题。
