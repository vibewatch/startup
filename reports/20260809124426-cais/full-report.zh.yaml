      - number: '1.3'
        title: 融资历史、估值跃升与战略投资人组合
        blocks:
          - type: paragraph
            body: >-
              CAIS 的融资曲线格外重要，因为它讲的不只是公司，也讲品类。2022 年 1 月融资引入 Apollo、Motive Partners 和 Franklin Templeton，估值超过 $1
              billion；2026 年 7 月 Series D 轮又加入 Vista 以及一大批战略资产管理人和财务赞助方，估值超过 $2 billion。实质上，投资人押注
              CAIS，不只是把它看成软件平台，也把它看成财富管理中私募市场准入的关键分发和工作流节点。


              目前披露的融资序列大致是：2020 年 Series B 轮 $50 million，2022 年 Series C 轮 $225 million，2026 年 Series D 轮 $170
              million，累计融资接近 $600 million。投资人组合很关键。Apollo 和 Hamilton Lane 证明早期对另类资产管理人的战略价值；Vista、Blue
              Owl、Carlyle、Fortress、Golub、Lord Abbett、RBC 和 AllianceBernstein
              进一步强化一个判断：另类资产分发基础设施对存量机构和产品制造商已经有战略价值。缺失的是经济细节：公开来源没有披露持股比例、清算优先权、二级交易，或最新一轮之后完整的董事会 / 控制权地图。
