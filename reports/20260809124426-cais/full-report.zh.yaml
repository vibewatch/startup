      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              终端投资人不是这个市场里唯一重要的客户。实际运作中，CAIS
              的买方和用户至少分成四组：单个顾问与面向客户的团队；设定批准名单和模型的总部或投资委员会负责人；承担文书负担的运营与合规人员；以及需要把产品规模化分发进碎片化财富渠道的资产管理人。Summit Wealth
              Group 的客户证明把这个模式说得很清楚：该机构采用 CAIS，不只是为了浏览私募基金，而是为了集中教育、尽调、交易和监控。这意味着采购中心远不止顾问本人。


              这也解释了为什么结果导向模型工具和核心工作流集成重要。WealthManagement 的峰会报道显示，讨论正从管理人选择转向结果和模型落地；公司材料则强调，另类资产必须进入顾问工作流，不能一直是专家例外。对较小
              RIA 而言，平台可能替代自建另类投资运营栈。对较大机构而言，平台可能是一层工作流和集成枢纽，与内部研究和政策控制并行。
