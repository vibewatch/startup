  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础：一侧是顾问机构，另一侧是资产管理人
        blocks:
          - type: paragraph
            body: >-
              CAIS 的客户体系不是单向的。需求侧最清楚的客户是
              RIA、独立经纪交易商，以及需要另类投资工作流基础设施的总部型买方。供给侧最清楚的客户是希望进入碎片化财富渠道的资产管理人。公开材料也明确显示，终端投资人是平台的重要受益者，但通常不是 CAIS
              的直接买方。这个区别重要，因为用户、付款方和关系的战略价值会因细分群体而大幅不同。


              具名客户证明支撑这个框架。Summit Wealth Group 看起来像中型 RIA 式部署，Baird 看起来像大型企业平台集中化，Harbor Group 看起来像管理人侧分发客户。CAIS
              平台可投产品名单进一步显示，主要资产管理人也是客户生态的一部分。因此，CAIS 服务的是双边市场：顾问组织使用工作流基础设施，产品提供方使用分发和尽调入口。
