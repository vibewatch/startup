    approximationNotes: 单元格值是对公开证据的序位概括，不是经审计成熟度评分。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: CAIS 通常从客户需要更好地获得另类资产切入，再靠运营嵌入和教育扩展。
    data:
      items:
        - label: 需要另类资产能力
          detail: 机构想获得更多私募市场入口，并简化工作流
          tone: neutral
        - label: 平台评估
          detail: 买方评估发现、尽调、运营和合作伙伴匹配度
          tone: neutral
        - label: 运营集中化
          detail: CAIS 成为准入、尽调和执行的工作流层
          tone: positive
        - label: 教育和重复互动
          detail: CAIS IQ、CAIS Live 和峰会活动增强采用信心
          tone: positive
        - label: 扩展循环
          detail: 更多顾问、管理人和模块进入同一运营层
          tone: positive
    claimRefs:
      - CU007
      - CU014
      - CU020
      - CU025
      - CU028
    approximationNotes: 该旅程概括需求侧顾问机构的共同路径，而不是某个具名账户的时间线。
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开客户证据从广泛的市场采用意向，延伸到具名生产部署，再走向更深的工作流嵌入。
    data:
      nodes:
        - label: 顾问对另类资产的需求
          detail: 90% 已采用，88% 有意增加
        - label: 平台触达
          detail: 2,500+ 家机构和 65,000+ 名顾问
        - label: 具名部署
          detail: Baird、Summit、Harbor
        - label: 工作流标准化
          detail: 集中式平台 + 现有客户更深使用
      edges:
        - to: Platform reach
          from: Advisor demand for alts
        - to: Named deployments
          from: Platform reach
        - to: Workflow standardization
          from: Named deployments
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU012
    approximationNotes: 这些阶段综合公司数量、调查数据和具名客户证据，而不是同一客群的字面漏斗。
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: CAIS 在部署具体性上有强公开证明，但 ROI、留存和集中度的公开证明较弱。
    data:
      columns:
