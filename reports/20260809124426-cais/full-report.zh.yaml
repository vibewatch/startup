chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命，以及 CAIS 实际在卖什么
        blocks:
          - type: paragraph
            body: >-
              CAIS 把自己描述为面向独立财务顾问的领先另类投资平台，但更准确的说法是，它是顾问渠道里的工作流与分发操作系统。公司称，CAIS 于 2009
              年创立，目的是让财务顾问更容易获得另类投资，并降低私募基金、结构化产品及配套流程过去在大型机构之外难以规模化的手工摩擦。这个定位在官网、2026 年融资公告和多篇产品文章中都一致：CAIS
              想占据交易前、交易和交易后的运营层，而不只是做一个市场列表页。


              公开产品证据支撑这一定位。CAIS 自己的技术页面称，顾问和总部可以使用按机构配置的首页、按合格投资者级别和最低门槛筛选的产品菜单、CAIS IQ
              教育内容，以及打包基金文件、披露、视频和演示材料的产品页。公司署名文章还描述了一个统一的数字市场，把订单、持仓、资本催缴、分配、K-1
              和监控连起来。换句话说，商业模式不只是给另类基金入口，而是提供一层技术与服务，让独立财富管理机构配置另类资产时，操作体验更接近传统资产。
