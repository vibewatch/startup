callouts:
  - calloutType: insight
    title: "The Counterintuitive Reliability Dividend of Automated Rightsizing"
    body: "While infrastructure engineering teams historically overprovision CPU and memory as a safety cushion to avoid application throttling, telemetry demonstrates that static overprovisioning fails to prevent crashes. Automated rightsizing eliminates Out-of-Memory evictions by dynamically identifying memory-starved workloads, proving that efficiency and system reliability compound together."
    claimRefs:
      - CM007
  - calloutType: risk
    title: "Autoscaler Replacement and the Threat of Architectural Vendor Lock-in"
    body: "Cast AI achieves deep automation by taking over the node provisioning layer and replacing native Kubernetes autoscalers. While this unlocks rapid cost reduction and automated Spot fallback, it creates structural vendor dependency: removing the platform after production deployment requires rebuilding cluster provisioning rather than modifying configuration files."
    claimRefs:
      - CM008
