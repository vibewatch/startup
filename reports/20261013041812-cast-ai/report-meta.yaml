companyProfile:
  summary: >-
    Cast AI is a cloud infrastructure automation company founded in 2019 that helps enterprises optimize Kubernetes
    workloads, rightsize compute, and orchestrate specialized GPU capacity across AWS, Azure, and Google Cloud. The
    company is headquartered in Miami with engineering operations in Vilnius, serves more than 2,100 organizations, and
    broadened its product set in January 2026 with OMNI Compute and Oracle Cloud Infrastructure partnership support.
    Public disclosures point to meaningful customer traction and a $1B+ valuation, but core operating economics remain
    private.
