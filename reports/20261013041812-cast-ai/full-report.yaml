      - number: '5.3'
        title: Product Modules, SKUs, and Tooling Integrations
        blocks:
          - type: paragraph
            body: >-
              The platform is commercialized as an integrated operational suite spanning four primary capability areas:
              autonomous cost optimization, real-time cost monitoring, container security posture management, and
              specialized AI/LLM cost optimization. The cost optimization engine focuses on container rightsizing,
              automated Spot instance management, and bin-packing algorithms that consolidate workloads onto
              cost-effective instance families. Concurrently, the monitoring module delivers granular visibility into
              CPU, GPU, memory, and storage spend across individual clusters, namespaces, and engineering teams.
              Security capabilities audit clusters continuously for configuration drift, vulnerabilities, and exposed
              attack surfaces. To ensure seamless adoption within modern DevOps workflows, Cast AI provides native
              integrations with key ecosystem tools, including Terraform for infrastructure as code, Helm for deployment
              packaging, Prometheus and Grafana for metrics visualization, and Jira for issue remediation tracking.
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE012
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
