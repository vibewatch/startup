      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The latest quantified financing evidence in this pool is a third-party report of a $108 million April 2025
              growth round and more than $190 million of total funding. That history demonstrates access to external
              capital, but funding raised is not cash available and cannot establish runway without cash, burn, debt,
              and working-capital data. Revenue quality could be attractive if annual subscriptions dominate, while
              performance-linked and compute-linked fees introduce variability tied to customer usage and verified
              savings. A competitor also argues that Cast AI lacks full cost coverage outside Kubernetes, which may
              constrain wallet share. The financial verdict is therefore promising but not underwritten: current revenue
              quality, margin path, sales efficiency, concentration, and forward capital needs require private
              diligence.
            claimRefs:
