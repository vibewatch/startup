      - number: '6.2'
        title: Adoption Trajectory and Telemetry Scale
        blocks:
          - type: paragraph
            body: >-
              Cast AI's adoption trajectory is reinforced by its proprietary telemetry engine, which continuously
              observes real-world workload signals across tens of thousands of Kubernetes clusters. The company's 2026
              State of Kubernetes Optimization Report gathered baseline telemetry across AWS, Azure, and Google Cloud
              environments, demonstrating widespread resource overprovisioning prior to automation. A key finding
              reveals that enterprise GPU capacity operates at an average utilization rate of only 5%, meaning roughly
              95% of provisioned GPU compute sits idle while generating substantial continuous cost. Concurrently,
              average CPU utilization hovered at just 8%, underscoring that conventional container scaling mechanisms
              fail to match dynamic enterprise demand. By positioning its autonomous agentic loop as an immediate
              remediation mechanism, Cast AI leverages broad cluster observation into land-and-expand sales
              conversations. High-scale enterprise deployments like Akamai illustrate this trajectory, achieving
              reported cloud expenditure reductions of 40% to 70% within days of activating automated cost analytics and
              rightsizing engines.
            claimRefs:
              - CU006
              - CU007
              - CU011
