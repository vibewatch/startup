  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational Autonomy, Autoscaler Conflicts, and Blast Radius
        blocks:
          - type: paragraph
            body: >-
              Autonomous Kubernetes optimization introduces significant operational trade-offs by shifting
              infrastructure control from human engineering teams to algorithmic policy engines. Cast AI deploys
              in-cluster agents equipped with administrative permissions to resize workloads, evict pods, and
              dynamically provision or delete cloud compute nodes. While automated rightsizing can rapidly eliminate
              idle compute, running Cast AI concurrently with external node provisioners risks unpredictable race
              conditions and conflicting scaling decisions. Furthermore, aggressive bin-packing and pod evictions can
              disrupt sensitive workloads if engineering teams fail to configure comprehensive Pod Disruption Budgets or
              if stateful applications cannot accommodate in-place container resizing. Organizations must enforce strict
              guardrails, phased rollout modes, and continuous observability to contain operational blast radius.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR010
              - CR012
