chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Leadership
        blocks:
          - type: paragraph
            body: >-
              Cast AI Group Inc. is a cloud infrastructure automation company founded in 2019 and headquartered in
              Miami, Florida, with primary European research and development operations centered in Vilnius, Lithuania.
              The business was established by serial enterprise software entrepreneurs Yuri Frayman, Laurent Gil, and
              Leon Kuperman, following their previous leadership exits at Viewdle and Zenedge. Cast AI operates as an
              autonomous performance optimization engine for cloud-native Kubernetes workloads across Amazon Web
              Services, Google Cloud Platform, and Microsoft Azure. Rather than functioning purely as an observability
              dashboard, the platform employs machine learning agents to continuously rightsize pod resources, bin-pack
              containers, and replace expensive on-demand nodes with dynamically provisioned Spot instances in real
              time. Chief Executive Officer Yuri Frayman steers executive direction and institutional fundraising,
              President Laurent Gil spearheads global partner ecosystems and commercial market expansion, and Chief
              Technology Officer Leon Kuperman directs algorithmic agent engineering. The company maintains heavy
              key-person dependency on this founding trio, whose unified technical vision and prior startup exits
              underpin both customer trust and institutional venture backing.
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO008
      - number: '1.2'
        title: Capitalization, Funding History, and Unicorn Valuation
        blocks:
          - type: paragraph
            body: >-
              Cast AI has raised over $180 million in cumulative equity capital across six documented financing rounds
              since its 2019 inception. The company announced its foundational $8 million seed round in November 2020
              backed by DNX Ventures, TA Ventures, and Florida Funders, followed by a $10 million Series A led by Cota
              Capital with Samsung Next in December 2021. Growth accelerated in 2023 with a $20 million early Series B
              round led by Creandum in March and a $35 million Series B expansion led by Vintage Investment Partners in
              November. In April 2025, Cast AI closed a $108 million Series C co-led by G2 Venture Partners and SoftBank
              Vision Fund 2 at an estimated $900 million post-money valuation. In January 2026, the company attained
              unicorn status through an undisclosed strategic investment from Pacific Alliance Ventures, the corporate
              venture arm of South Korean conglomerate Shinsegae Group, surpassing a $1 billion valuation. While this
              milestone cements Cast AI’s high-profile positioning alongside SoftBank’s AI infrastructure portfolio,
              precise financial underpinnings—including Annual Recurring Revenue run-rate, gross margins, and net
              burn—remain closely held private metrics, representing a material diligence gap.
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO006
              - CO014
