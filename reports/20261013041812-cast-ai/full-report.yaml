              them opportunity baselines rather than measured savings. Cast AI describes automated rightsizing, scaling,
              and GPU provisioning as the intervention. These facts explain a potential value bridge from underused
              compute to customer savings, but they reveal nothing about Cast AI's hosting, support, sales, or
