              - CE011
      - number: '5.2'
        title: Operating Architecture and the Predictive Cast Engine
        blocks:
          - type: paragraph
            body: >-
              The core technical foundation of Cast AI is its closed-loop control architecture and proprietary
              predictive engine. While native Kubernetes scaling primitives like Horizontal Pod Autoscaler and Vertical
              Pod Autoscaler operate on reactive threshold rules, the Cast Engine employs predictive machine learning
              models trained on telemetry from thousands of real-world enterprise clusters. A critical technical
              capability is spot instance termination forecasting, which predicts cloud provider spot evictions up to 30
              minutes in advance, orchestrating graceful pod evacuations before nodes are forcibly terminated. Beyond
              single-cluster rightsizing, the architecture extends compute elasticity through Omni Compute, connecting
              external compute and GPU capacity—such as Oracle Cloud Infrastructure's high-performance clusters—as
              native resources without requiring configuration changes. This abstraction allows workloads to execute
              across diverse multi-cloud and on-premises environments managed under unified FinOps and operational
              policies.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
              - CE012
              - CE013
