  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for autonomous Kubernetes optimization sits at the intersection of container orchestration,
              cloud infrastructure provisioning, and continuous cloud financial management. The addressable boundary
              encompasses compute spend running on managed Kubernetes services—primarily Amazon Elastic Kubernetes
              Service (EKS), Google Kubernetes Engine (GKE), and Microsoft Azure Kubernetes Service (AKS)—where dynamic
              workloads require continuous rightsizing, node provisioning, and Spot instance lifecycle management.
              Excluded from this boundary are non-containerized legacy virtual machines, unmanaged on-premises bare
              metal, and general SaaS financial management layers that focus on invoice reconciliation rather than
              autonomous infrastructure execution. In current enterprise deployments, status-quo substitutes consist
              predominantly of native open-source autoscaling components such as the Kubernetes Cluster Autoscaler,
              Horizontal Pod Autoscaler (HPA), and Karpenter, which rely heavily on manual YAML configuration and
              reactive threshold heuristics that frequently preserve conservative resource headroom.
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM008
              - CM009
              - CM012
      - number: '2.2'
        title: Market Sizing Lenses and Empirical Utilization Baselines
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for autonomous Kubernetes optimization requires grounding sizing
              estimates in empirical telemetry rather than broad top-down cloud spending aggregates. Across tens of
              thousands of production Kubernetes clusters analyzed by Cast AI, aggregate compute waste is systemic and
              worsening: average CPU utilization declined from 10% to 8% year-over-year, while memory utilization
              dropped to 20%. Concurrently, CPU overprovisioning expanded from 40% to 69% as application teams padded
              deployment resource requests to insulate themselves against throttling and out-of-memory crashes. The
              emerging wave of generative AI and machine learning workloads has intensified these inefficiencies, with
              enterprise GPU utilization averaging merely 5%, leaving 95% of scarce accelerator capacity idle amid 15%
              price increases for premium hardware instances. Consequently, the addressable opportunity represents a
              multi-billion-dollar efficiency reclaim pool across cloud-native enterprises.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
