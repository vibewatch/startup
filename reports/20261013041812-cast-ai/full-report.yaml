            title: Retention Durability and Concentration Remain Unverified
            body: >-
              While Cast AI demonstrates tangible production savings of 40% to 50% for high-profile accounts, the
              absence of public cohort retention, NRR, and customer concentration metrics obscures long-term economic
              durability.
