    title: Workflow and use-case analysis
    columns:
      - User Job
      - Current Manual Workflow
      - Cast AI Automation
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Container Resource Sizing
        - Engineers set static CPU/memory requests and limits based on peak guesswork
        - Autopilot rightsizes containers dynamically at the millicore level based on live usage
        - Eliminates 20x resource overprovisioning without degrading response latency
        - Initial configuration requires review before enabling production autonomy
      - - Node Fleet Scaling
        - Static node pools or uncoordinated Cluster Autoscaler expansions
        - Dynamic compute provisioning and aggressive bin-packing across cheapest instance types
        - Reduces compute waste; targets closing the gap toward 50% healthy utilization
        - Workload rebalancing can occasionally disrupt active connections if unmanaged
      - - Spot Instance Lifecycle
        - Manual fallback scripts risking sudden cluster capacity deficits on eviction
        - Predictive machine learning forecasts spot terminations up to 30 minutes ahead
        - Enables graceful workload draining and pre-emptive node replenishment
        - Spot availability depends on cloud provider regional spot pool capacity
      - - GPU Capacity Procurement
        - Annual reserved commitments hoard idle accelerators to hedge scarcity
        - Dynamic workload placement and fungible cross-cloud GPU provisioning via Omni Compute
        - Averages up from 5% GPU baseline utilization without requiring long lock-ins
        - Egress costs and data pipeline bottlenecks can limit cross-cloud GPU utility
    notes: >-
      Workflows and efficiency outcomes compiled from 2026 telemetry reports, G2 customer reviews, and enterprise case
      study data.
