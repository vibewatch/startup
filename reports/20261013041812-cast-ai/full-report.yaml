      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding Does Not Establish Runway
            body: >-
              Reported cumulative funding is a financing-history signal, not a substitute for current cash, net burn,
              debt obligations, working-capital needs, or a management runway forecast.
            calloutType: risk
            claimRefs:
              - CI002
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Cast AI delivers an automated cloud infrastructure optimization platform designed to eliminate resource
              waste across enterprise Kubernetes environments. In standard cloud-native workflows, engineering teams
              provision compute capacity through conservative estimates, resulting in severe overprovisioning to avoid
              performance throttling. Empirical telemetry from 23,000 enterprise clusters underscores the scale of this
              inefficiency, revealing that organizations routinely provision 20 times more GPU capacity than actively
              used, operating at roughly 5% GPU utilization and 8% CPU utilization. Cast AI alters this operational
              paradigm by deploying an in-cluster agent in minutes, beginning in a non-intrusive read-only posture
              before users activate automated closed-loop optimization. The platform continuously monitors actual
              resource consumption, rightsizing containers dynamically at the millicore level and rebalancing node
              fleets without requiring manual engineering intervention or code refactoring.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE011
