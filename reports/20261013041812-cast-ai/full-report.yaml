        title: Customer Economics and Margin Path
        blocks:
          - type: paragraph
            body: >-
              The clearest economic evidence concerns the customer's waste pool, not Cast AI's own unit economics. Cast
              AI reports average pre-automation utilization of 5% for GPUs, 8% for CPUs, and 20% for memory; Business
