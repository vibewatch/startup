        title: Exhibits
        blocks:
          - type: callout
            title: Autonomous Execution Drives High Adoption Velocity
            body: >-
              Cast AI's friction-free onboarding—requiring only a single read-only command to generate instant cost
              analytics—creates a rapid path from discovery to production deployment, as demonstrated across 2,100+
              organizations.
