chapter:
  number: 6
  title: "Customers"
  summary: "Cast AI demonstrates rapid commercial adoption with over 2,100 customer organizations and high-profile enterprise production deployments including BMW, Cisco, and Genial Investimentos. However, public disclosures focus heavily on infrastructure savings percentages rather than dollar contract values, and core SaaS durability metrics such as net revenue retention and cohort churn remain closely guarded private data."
sections:
  - id: "sec-customer-segmentation"
    title: "Customer Segmentation and Buyer Personas"
    body: "Cast AI segments its commercial customer base primarily across multi-cloud enterprise platform teams, cloud-native scale-ups, and FinOps practitioners managing large-scale Kubernetes deployments on Amazon Web Services (EKS), Google Cloud Platform (GKE), and Microsoft Azure (AKS). The primary economic buyer is typically a Vice President of Infrastructure, Head of Platform Engineering, or Director of Cloud FinOps charged with curbing volatile cloud infrastructure spending. Technical evaluation and daily operations are driven by Site Reliability Engineers (SREs) and DevOps practitioners seeking automated cluster stability and workload rightsizing without manual YAML configuration. In addition to direct sales motions targeting technology and financial services organizations, Cast AI expands its commercial reach through channel partnerships and marketplace distribution agreements with enterprise IT providers such as SoftwareOne. The platform serves over 2,100 organizations globally, addressing workloads ranging from latency-sensitive financial transaction systems to high-throughput machine learning model inference pipelines."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "sec-adoption-trajectory"
    title: "Adoption Trajectory and Telemetry Scale"
    body: "Cast AI's adoption trajectory is reinforced by its proprietary telemetry engine, which continuously observes real-world workload signals across tens of thousands of Kubernetes clusters. The company's 2026 State of Kubernetes Optimization Report gathered baseline telemetry across AWS, Azure, and Google Cloud environments, demonstrating widespread resource overprovisioning prior to automation. A key finding reveals that enterprise GPU capacity operates at an average utilization rate of only 5%, meaning roughly 95% of provisioned GPU compute sits idle while generating substantial continuous cost. Concurrently, average CPU utilization hovered at just 8%, underscoring that conventional container scaling mechanisms fail to match dynamic enterprise demand. By positioning its autonomous agentic loop as an immediate remediation mechanism, Cast AI leverages broad cluster observation into land-and-expand sales conversations. High-scale enterprise deployments like Akamai illustrate this trajectory, achieving reported cloud expenditure reductions of 40% to 70% within days of activating automated cost analytics and rightsizing engines."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "sec-named-customer-proof"
    title: "Named Enterprise Deployments and Production Outcomes"
    body: "Verified production case studies and third-party news reports confirm that Cast AI has moved beyond initial proof-of-concept testing into mission-critical enterprise environments. Major global enterprises including automotive manufacturer BMW and networking conglomerate Cisco utilize Cast AI to automate cloud cost management across complex container footprints. In the financial services vertical, Brazilian investment platform Genial Investimentos implemented Cast AI with integration partner Delfia to optimize an environment where approximately 90% of workloads run on Kubernetes. On Genial's primary production cluster, automated bin-packing and rightsizing lowered average cost per CPU from $5.88 to $5.40, achieving an overall 40% production cost reduction while preserving application availability. A secondary non-production cluster achieved an 80% reduction in CPU costs, dropping from $13.29 to $5.29 per CPU through scheduled hibernation and Spot Instance automation. These deployments validate Cast AI's claim that algorithmic optimization maintains workload resilience during continuous instance replacement."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "sec-expansion-concentration"
    title: "Expansion Mechanics, Channel Friction, and Durability Risks"
    body: "The expansion loop for Cast AI typically initiates with a frictionless, read-only cluster evaluation that exposes latent compute waste within minutes, subsequently progressing to staging automation, live production rightsizing, and specialized GPU optimization through Omni Compute. Customers such as e-commerce platform Yotpo expanded their implementations from basic cost visibility into automated Spot instance replacement, cutting cloud spend by 40% while freeing engineering teams from manual configuration cycles. Despite these operational strengths, Cast AI faces architectural and commercial headwinds. Independent competitor analyses from CloudZero highlight that Cast AI's cost allocation model remains strictly confined to Kubernetes clusters and pods, preventing organizations from attributing shared cloud expenses across multi-service data platforms like Snowflake or tracking costs by business unit, team, or customer. Furthermore, because Cast AI does not disclose cohort retention rates, gross revenue retention, or customer concentration, prospective investors cannot verify whether rapid initial cost reductions establish enduring enterprise software ARR or risk customer plateau once cloud footprints are rightsized."
    claimRefs:
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
