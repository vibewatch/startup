chapter:
  number: 1
  title: Company Overview
  summary: Cast AI is an autonomous Kubernetes cost-optimization and compute orchestration platform founded in 2019 in Miami, Florida. The company reached a $1 billion valuation in January 2026 following strategic investment from Pacific Alliance Ventures and the launch of its OMNI Compute GPU marketplace. While enterprise adoption spans over 2,100 customers, core financial metrics including ARR and gross margins remain undisclosed private data points.
sections:
  - id: corporate-identity-and-founding-history
    title: Corporate Identity, Foundation, and Leadership
    body: Cast AI Group Inc. is a cloud infrastructure automation company founded in 2019 and headquartered in Miami, Florida, with primary European research and development operations centered in Vilnius, Lithuania. The business was established by serial enterprise software entrepreneurs Yuri Frayman, Laurent Gil, and Leon Kuperman, following their previous leadership exits at Viewdle and Zenedge. Cast AI operates as an autonomous performance optimization engine for cloud-native Kubernetes workloads across Amazon Web Services, Google Cloud Platform, and Microsoft Azure. Rather than functioning purely as an observability dashboard, the platform employs machine learning agents to continuously rightsize pod resources, bin-pack containers, and replace expensive on-demand nodes with dynamically provisioned Spot instances in real time. Chief Executive Officer Yuri Frayman steers executive direction and institutional fundraising, President Laurent Gil spearheads global partner ecosystems and commercial market expansion, and Chief Technology Officer Leon Kuperman directs algorithmic agent engineering. The company maintains heavy key-person dependency on this founding trio, whose unified technical vision and prior startup exits underpin both customer trust and institutional venture backing.
    claimRefs:
      - CO001
      - CO007
      - CO008
      - CO010
    tableRefs:
      - TO002
    figureRefs: []
  - id: capitalization-and-unicorn-valuation
    title: Capitalization, Funding History, and Unicorn Valuation
    body: Cast AI has raised over $180 million in cumulative equity capital across six documented financing rounds since its 2019 inception. The company announced its foundational $8 million seed round in November 2020 backed by DNX Ventures, TA Ventures, and Florida Funders, followed by a $10 million Series A led by Cota Capital with Samsung Next in December 2021. Growth accelerated in 2023 with a $20 million early Series B round led by Creandum in March and a $35 million Series B expansion led by Vintage Investment Partners in November. In April 2025, Cast AI closed a $108 million Series C co-led by G2 Venture Partners and SoftBank Vision Fund 2 at an estimated $900 million post-money valuation. In January 2026, the company attained unicorn status through an undisclosed strategic investment from Pacific Alliance Ventures, the corporate venture arm of South Korean conglomerate Shinsegae Group, surpassing a $1 billion valuation. While this milestone cements Cast AI’s high-profile positioning alongside SoftBank’s AI infrastructure portfolio, precise financial underpinnings—including Annual Recurring Revenue run-rate, gross margins, and net burn—remain closely held private metrics, representing a material diligence gap.
    claimRefs:
      - CO002
      - CO004
      - CO005
      - CO006
      - CO014
    tableRefs:
      - TO001
      - TO003
    figureRefs: []
  - id: platform-evolution-and-omni-compute
    title: Platform Architecture, Scale Trajectory, and Milestone Evolution
    body: The platform’s operational trajectory reflects a continuous architectural expansion from basic container rightsizing into comprehensive AI compute orchestration. Between 2023 and 2024, Cast AI demonstrated rapid market traction, more than doubling its customer base to exceed 2,100 enterprise organizations including Akamai, BMW, Cisco, FICO, and Hugging Face. Simultaneous platform innovation culminated in the January 2026 general availability launch of OMNI Compute, a multi-cloud control plane that transforms external compute capacity and specialized GPU clusters into fungible Kubernetes resources without code modifications. By partnering with Oracle Cloud Infrastructure as its inaugural hyperscaler provider, OMNI Compute enables organizations running on any cloud to access OCI high-performance GPU fleets on demand. This launch directly targets systemic infrastructure inefficiency revealed by Cast AI telemetry across tens of thousands of clusters, which showed average enterprise GPU utilization hovering at just 5% and CPU utilization at 8%. By orchestrating cross-cloud GPU provisioning and automated fallback mechanisms, Cast AI aims to unlock stranded compute capacity as enterprise artificial intelligence inference workloads surge.
    claimRefs:
      - CO003
      - CO009
      - CO010
      - CO012
      - CO013
    tableRefs: []
    figureRefs:
      - FO001
  - id: commercial-scale-and-diligence-evaluation
    title: Commercial Adoption, Operational Friction, and Diligence Assessment
    body: Commercial adoption across global enterprise clients validates Cast AI’s value proposition of delivering autonomous 50% to 70% cloud infrastructure cost reductions. Unlike legacy visibility tools such as Kubecost that produce static allocation reports requiring developer intervention, Cast AI autonomously modifies cluster infrastructure to eliminate wasted spend. However, independent reviews and enterprise deployments surface notable operational considerations. Analysts at CyberNews highlight that advanced Kubernetes policy configuration requires specialized DevOps sophistication, cost reporting granularity can be constrained relative to native cloud-provider billing consoles, and pricing models may pose friction for smaller development teams. Furthermore, because Cast AI charges based on usage and realized savings, enterprise procurement teams must actively model billing exposure alongside fluctuating cloud consumption. Crucially, without verified disclosures regarding customer retention, net revenue retention, or operating cash burn, prospective stakeholders must balance Cast AI’s robust platform capabilities and blue-chip customer references against the absence of audited financial statements supporting its $1 billion valuation.
    claimRefs:
      - CO009
      - CO011
      - CO012
      - CO014
    tableRefs: []
    figureRefs: []
