callouts:
  - calloutType: risk
    title: Autonomous Control Plane Blast Radius
    body: Granting an external agent continuous rights to evict pods, select VM instances, and delete underutilized nodes concentrates significant operational blast radius into automated policy engines. Engineering organizations must mandate strict Pod Disruption Budgets, test in-place resizing, and enforce read-only monitoring before enabling live bin-packing in mission-critical production clusters.
    claimRefs:
      - CR001
      - CR002
      - CR012
