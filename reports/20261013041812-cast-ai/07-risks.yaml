  title: Risks
  summary: Evaluation of Cast AI operational autonomy and cluster blast radius, autoscaler coordination conflicts, hyperscaler platform dependencies, data compliance postures, and financial opacity.
sections:
  - id: operational-autonomy-and-resilience-risks
    title: Operational Autonomy, Autoscaler Conflicts, and Blast Radius
    body: Autonomous Kubernetes optimization introduces significant operational trade-offs by shifting infrastructure control from human engineering teams to algorithmic policy engines. Cast AI deploys in-cluster agents equipped with administrative permissions to resize workloads, evict pods, and dynamically provision or delete cloud compute nodes. While automated rightsizing can rapidly eliminate idle compute, running Cast AI concurrently with external node provisioners risks unpredictable race conditions and conflicting scaling decisions. Furthermore, aggressive bin-packing and pod evictions can disrupt sensitive workloads if engineering teams fail to configure comprehensive Pod Disruption Budgets or if stateful applications cannot accommodate in-place container resizing. Organizations must enforce strict guardrails, phased rollout modes, and continuous observability to contain operational blast radius.
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR010
      - CR012
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-compliance-and-security-governance
    title: Security Permissions, Telemetry Governance, and Compliance Posture
    body: Deploying active third-party agents directly into production Kubernetes control planes raises critical data security and regulatory governance considerations. To mitigate customer risk, Cast AI maintains an ISO 27001 certification alongside an audited SOC 2 Type II attestation, confirming external verification of its security controls. The platform asserts that its agents do not inspect or harvest sensitive application payloads, Kubernetes Secrets, or ConfigMaps, relying strictly on resource utilization metrics and cluster scheduling telemetry. Nevertheless, enterprises operating in strictly regulated jurisdictions must evaluate potential cross-border telemetry flows, enforce least-privilege role-based access control, and review tenant data retention policies before granting automated agents execution permissions.
    claimRefs:
      - CR001
      - CR007
    tableRefs:
      - TR001
  - id: platform-dependencies-and-hyperscaler-dynamics
    title: Hyperscaler Platform Dependencies and Channel Partner Dynamics
    body: Cast AI operates as a specialized automation overlay that depends entirely on hyperscaler infrastructure across Amazon Web Services, Google Cloud Platform, and Microsoft Azure. The platform queries cloud provider pricing APIs at high frequency to evaluate Spot instance availability, instance family pricing, and commitment utilization. Any breaking modifications to cloud billing APIs, rate limiting on pricing feeds, or aggressive changes to Spot eviction policies directly impact Cast AI optimization velocity. Concurrently, native hyperscaler tooling such as AWS Karpenter poses long-term disintermediation risk if cloud providers bundle advanced workload rightsizing natively, requiring Cast AI to preserve superior multi-cloud policy coordination and distributor reach through partners like SoftwareOne.
    claimRefs:
      - CR006
      - CR008
      - CR014
    tableRefs:
      - TR003
  - id: economic-model-risks-and-diligence-kill-criteria
    title: Financial Model Sustainability, Pricing Opacity, and Kill Criteria
    body: Cast AI commercial value proposition is anchored on enterprise infrastructure waste, with 2026 data indicating average GPU utilization of only 5% and CPU utilization of 8% across unoptimized clusters. However, customer sentiment highlights material pricing frictions, particularly regarding custom quote structures, small-cluster minimums, and percentage-of-savings billing mechanisms that complicate financial forecasting. A persistent diligence challenge is the complete absence of publicly disclosed annual recurring revenue, gross margins, capital burn rate, and customer cohort retention data. Investment diligence requires verifying whether high theoretical savings translate into durable software margins and establishing clear kill criteria around enterprise churn, pricing resistance, or hyperscaler platform lock-in.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR011
      - CR013
