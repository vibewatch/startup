evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics-gap
    missingEvidence: >-
      Audited Annual Recurring Revenue (ARR), revenue growth rate, gross margins, and net revenue retention (NRR) data
      for fiscal years 2025 and 2026.
    whyItMatters: >-
      Without verified ARR and margin figures, the January 2026 $1 billion post-money valuation cannot be quantitatively
      underwritten or benchmarked against public SaaS multiple peers.
    diligencePath: >-
      Request confidential management financial presentations, audited financial statements, and GAAP revenue
      reconciliations during formal due diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-coverage
    missingEvidence: >-
      Complete cap table and exact equity ownership percentages for institutional investors, founders, and employee
      option pools.
    whyItMatters: >-
      Evaluating investor control rights, voting thresholds, and potential liquidation preferences requires detailed
      share class distribution data not accessible in secondary reporting.
    diligencePath: Obtain fully diluted capitalization table and certificate of incorporation amendments from company legal counsel.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited third-party market share and standalone TAM/SAM figures for autonomous Kubernetes cost optimization
      platforms.
    whyItMatters: >-
      Without independent analyst dollar sizing, market boundaries must be bounded by proxy cloud compute waste metrics
      rather than verified vendor revenue pools.
    diligencePath: >-
      Acquire specialized Gartner or IDC cloud-native infrastructure market reports or review confidential investor deck
      market sizing disclosures.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: hyperscaler-commoditization-risk
    missingEvidence: >-
      Independent third-party benchmarks tracking enterprise displacement rates of third-party Kubernetes cost
      optimizers by native AWS Karpenter, GKE Autopilot, and Azure native rightsizing features.
    whyItMatters: >-
      If major cloud providers embed native autonomous rightsizing directly into default Kubernetes managed offerings,
      customer willingness to pay standalone third-party platform fees could compress over the medium term.
    diligencePath: >-
      Survey multi-cloud platform engineering teams to assess whether native hyperscaler feature improvements are
      slowing standalone optimizer adoption or inducing churn.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Current ARR, recognized revenue, bookings, and year-over-year revenue growth reconciled to audited financial
      statements.
    whyItMatters: The available 2025 third-party range is not current ARR and cannot establish revenue scale, quality, or momentum.
    diligencePath: >-
      Request audited 2025 financials, 2026 monthly management accounts, and an ARR-to-revenue reconciliation by product
      and contract type.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: >-
      Gross margin, NRR, gross retention, CAC payback, sales cycle, customer concentration, cash, net burn, runway,
      working-capital needs, and debt obligations.
    whyItMatters: >-
      Without these inputs, investors cannot test operating leverage, revenue durability, sales efficiency, or financing
      dependency.
    diligencePath: >-
      Request cohort retention schedules, customer-level revenue concentration, a revenue-and-COGS bridge, cash and debt
      schedules, and a monthly runway model with next-round triggers.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: predictive-model-benchmarks
    missingEvidence: >-
      Empirical benchmark data and false-positive rates for Cast AI's 30-minute spot interruption prediction model
      across cloud regions.
    whyItMatters: >-
      Determines whether enterprise production workloads can safely rely on predictive spot migration without
      experiencing unplanned downtime.
    diligencePath: >-
      Request anonymized customer telemetry logs detailing spot interruption detection lead times and migration success
      percentages.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: omni-compute-pricing-liquidity
    missingEvidence: >-
      Transparent pricing schedules, liquidity depth, and network egress overhead metrics for the Omni Compute GPU
      marketplace.
    whyItMatters: >-
      Affects whether cross-cloud GPU provisioning delivers net cost savings once inter-cloud data transfer fees are
      factored into training and inference pipelines.
    diligencePath: >-
      Review customer contracts and execute a pilot benchmarking workload latency and data egress charges under Omni
      Compute.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn cohorts across annual customer
      vintages.
    whyItMatters: >-
      Without cohort retention data, investors cannot verify whether the 40-50% cloud cost savings translate into
      durable long-term software revenue or face high churn when customer infrastructure stabilizes.
    diligencePath: >-
      Request confidential billing data or management accounts detailing net expansion rates and gross customer churn
