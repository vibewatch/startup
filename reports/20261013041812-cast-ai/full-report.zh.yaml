      - number: '3.3'
        title: 定价结构与 GTM 分销
        blocks:
          - type: paragraph
            body: >-
              云成本管理领域的商业打包，反映出供应商信心和客户 ROI 对齐程度的差异。传统企业 FinOps
              平台按固定年度平台许可收费，并随未优化云支出总额扩大；这会形成错位激励，因为客户浪费越多，供应商收入越高。现代优化平台则越来越多采用与绩效挂钩或分层的订阅定价。ProsperOps 首创纯绩效模式，收取经核验
              AWS 承诺节省额的 10% 至 15%，让客户免于前期财务风险，但范围严格限于财务折扣。

              Cast AI 采用灵活商业策略：入门级集群订阅约 $200
              /月起，高阶企业套餐则与经核验的基础设施成本下降挂钩。这种混合结构降低了中型市场工程团队的进入门槛，同时捕捉运行数百万美元计算预算的大型多集群企业部署所带来的上行空间。软件费用直接绑定已实现节省额，也使 Cast
              AI 与企业 FinOps 目标保持一致。融资与战略分销上，Cast AI 于 2026 年初从 Pacific Alliance Ventures 获得融资，估值超过 $1 billion。这笔资金加速了与
              Oracle Cloud Infrastructure 合作推出 Omni Compute，打造统一的跨云计算市场，让企业可无缝把 AI 工作负载突发调度到 Oracle GPU
              集群，从而绕开超大规模云厂商的容量约束。
