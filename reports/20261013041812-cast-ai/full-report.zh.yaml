  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              自主 Kubernetes 优化市场位于容器编排、云基础设施配置和持续云财务管理的交汇处。可服务边界涵盖运行在托管 Kubernetes 服务上的计算支出，主要包括 Amazon Elastic
              Kubernetes Service（EKS）、Google Kubernetes Engine（GKE）和 Microsoft Azure Kubernetes
              Service（AKS）；动态工作负载在这些环境中需要持续调整资源、配置节点并管理 Spot 实例生命周期。边界外包括非容器化传统虚拟机、未托管的本地裸机，以及只做发票核对而非自主基础设施执行的通用 SaaS
              财务管理层。当前企业部署中的现状替代方案，主要是 Kubernetes Cluster Autoscaler、Horizontal Pod Autoscaler（HPA）和 Karpenter
              等原生开源自动扩缩组件；它们高度依赖手工 YAML 配置和反应式阈值规则，往往保留过于保守的资源余量。
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM008
              - CM009
              - CM012
      - number: '2.2'
        title: 市场规模视角与实际利用率基线
        blocks:
          - type: paragraph
            body: >-
              评估自主 Kubernetes 优化的可服务市场，必须用实际遥测数据校准规模估算，而不能依赖宽泛的自上而下云支出总量。Cast AI 分析的数万生产 Kubernetes
              集群显示，计算浪费具有系统性且正在恶化：平均 CPU 利用率同比从 10% 降至 8%，内存利用率降至 20%。同时，CPU 过度配置从 40% 扩大到
              69%，因为应用团队为避免限流和内存不足崩溃而人为抬高部署资源请求。生成式 AI 和机器学习工作负载的兴起进一步放大了低效：企业 GPU 平均利用率仅 5%，在高端硬件实例涨价 15% 的同时，95%
              的稀缺加速器容量处于闲置状态。因此，这一机会对应云原生企业中规模达数十亿美元的效率回收池。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
