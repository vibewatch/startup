      - number: '1.2'
        title: 资本结构、融资历程与独角兽估值
        blocks:
          - type: paragraph
            body: >-
              自 2019 年成立以来，Cast AI 已在六轮有记录的融资中累计募得超过 $180 million 股权资本。公司于 2020 年 11 月宣布获得 DNX Ventures、TA Ventures 和
              Florida Funders 支持的 $8 million 种子轮；随后于 2021 年 12 月完成由 Cota Capital 领投、Samsung Next 参与的 $10 million A
              轮。2023 年增长提速：3 月由 Creandum 领投 $20 million 早期 B 轮，11 月由 Vintage Investment Partners 领投 $35 million B
              轮扩展。2025 年 4 月，Cast AI 完成由 G2 Venture Partners 和 SoftBank Vision Fund 2 共同领投的 $108 million C 轮，投后估值估计为
              $900 million。2026 年 1 月，公司获得韩国新世界集团旗下企业创投机构 Pacific Alliance Ventures 的未披露战略投资，估值超过 $1
              billion，跻身独角兽。虽然这一里程碑让 Cast AI 与 SoftBank 的 AI 基础设施组合并列于高关注位置，但收入运行率、毛利率和净现金消耗等关键财务基础仍是严密保密的私有指标，构成重大尽调缺口。
