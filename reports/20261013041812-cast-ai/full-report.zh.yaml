  - id: FV001
    title: 投资建议决策流程
    type: flow
    summary: 将企业规模信号和 GPU 优化顺风，与估值悬置及最终跟踪立场连接起来的结构化决策树。
    data:
      nodes:
        - id: scale-signal
          label: 企业规模信号
          detail: 2,100+ 个企业账户及一线客户验证（BMW、Cisco、Akamai）
        - id: market-tailwind
          label: AI 基础设施浪费顺风
          detail: 95% GPU 闲置容量及不断上升的 AI 基础设施成本，推动 CFO 层面的 FinOps 紧迫需求
        - id: product-differentiation
          label: 自主控制平面
          detail: 实时自动调整资源规格，并为多云 GPU 提供 OMNI Compute 配置
        - id: financial-opacity
          label: 财务披露不透明
          detail: ARR、净留存率及战略轮条款未披露，带来多重不确定性
        - id: valuation-overhang
          label: 估值悬压（$1.0B 标价）
          detail: 定价达到独角兽级别（$1.0B），在缺乏审计支持的情况下仍需更高收入倍数
        - id: final-recommendation
          label: 建议：持续跟踪
          detail: 跟踪 ARR 披露，寻求有纪律的二级市场或结构化进入机会
      edges:
        - from: scale-signal
          to: market-tailwind
        - from: market-tailwind
          to: product-differentiation
        - from: product-differentiation
          to: financial-opacity
        - from: financial-opacity
          to: valuation-overhang
        - from: valuation-overhang
          to: final-recommendation
    approximationNotes: 流程图呈现定性闸门顺序；不代表算法评分权重。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV010
      - CV014
