      - number: '2.3'
        title: 买方分层、用户画像与采购动态
        blocks:
          - type: paragraph
            body: >-
              自主 Kubernetes
              优化的商业采用遵循分层的企业采购路径，由不同的技术和财务利益相关方共同决定。主要技术倡导者和预算负责人通常是平台工程副总裁、云基础设施负责人或站点可靠性工程（SRE）总监，他们对应用可用性和基础设施预算治理负责。在
              AI 原生组织中，MLOps 和 AI 基础设施负责人越来越多地推动采购，以缓解严重的 GPU 可用性瓶颈，并在不牺牲推理延迟的情况下压低集群支出。技术团队优先考虑无扰动执行和与现有 GitOps
              流水线的集成；企业采购与 FinOps 团队则审视定价透明度和多云覆盖。云市场、SoftwareOne 等软件分销商等商业渠道，是加速企业签约和账单整合的重要采购路径。
            claimRefs:
              - CM007
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
