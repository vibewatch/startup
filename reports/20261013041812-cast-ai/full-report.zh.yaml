      - number: '2.4'
        title: 结构性增长驱动与关键采用约束
        blocks:
          - type: paragraph
            body: >-
              自主优化的市场动能来自强劲的结构性催化剂，但也受到明显的企业采用约束。首要加速因素是高成本 AI 加速器快速普及，以及 ARM Graviton 等替代架构结构性增长；在现代机群中，后者增速是 x86 核心的
              3.5 times。同时，自动资源调整带来反直觉的可靠性红利：它会主动为受限 Pod 增加内存，同时缩减过度配置的节点，从而消除内存不足驱逐。不过，运营摩擦和架构锁定会压制采用：Cast AI
              替换的是原生集群自动扩缩器，而不只是提供建议，因此企业平台团队要承担可观的迁移切换成本。此外，需要定制销售报价而非透明按单位定价的专有定价结构，也会在企业评估时增加预算摩擦。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自动资源调整反直觉的可靠性红利
            body: >-
              基础设施工程团队过去常把 CPU 和内存过度配置作为避免应用限流的安全垫，但遥测表明，静态过度配置并不能防止崩溃。自动资源调整会动态识别内存不足的工作负载，消除 Out-of-Memory
              驱逐，说明效率和系统可靠性可以同时提升。
            calloutType: insight
            claimRefs:
              - CM007
          - type: callout
            title: 替换自动扩缩器与架构供应商锁定风险
            body: >-
              Cast AI 接管节点配置层并替换原生 Kubernetes 自动扩缩器，从而实现深度自动化。这能快速降本并自动回退到
              Spot，但也造成结构性供应商依赖：生产部署后移除平台，需要重建集群配置，而不是修改几个配置文件。
            calloutType: risk
            claimRefs:
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分层
        blocks:
          - type: paragraph
            body: >-
              云成本优化和基础设施自动化市场呈现鲜明的架构分化，而非各供应商之间的功能同质化。管理容器化基础设施的组织面对一个碎片化生态，其中包括纯财务可视化平台、云账单承诺经纪商、专门的 Spot
              编排器和集群内自主资源调整工具。在这一格局中，Cast AI 瞄准运行异构动态工作负载的生产 Kubernetes 集群；手动资源调整无法跟上需求变化。生产环境中，未优化的 Kubernetes
              部署存在大量资源浪费，实测 CPU 平均利用率仅 8%，内存约 20%，意味着企业资产中存在显著的潜在低效。

              竞争者从完全不同的切入点处理这些浪费。ProsperOps 完全位于云账单层，借助 IAM 权限运行无代理架构，动态交易 AWS Reserved Instances 和 Savings
              Plans，但完全不触及底层 Kubernetes Pod 的过度配置。相比之下，Kubecost 以 Helm chart 部署到集群内，接入 Prometheus 指标和云账单 API，提供按命名空间和
              Pod 划分的细粒度成本分配及分摊报告。但 Kubecost 主要仍是可视化和治理工具，依赖工程团队手动查看仪表盘、提交工单和重新配置部署清单。Spot by NetApp 靠预测 Spot
              实例中断来处理工作负载执行，但重点是 Spot 生命周期管理，而非整体 Pod 调整和 GPU 分时。此外，SoftwareOne Marketplace 等企业分销渠道已成为关键采购通路，把 Cast AI
              的自动资源调整和安全扫描打包进统一的企业软件协议。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.2'
        title: 技术能力与架构差异化
        blocks:
          - type: paragraph
            body: >-
              Cast AI 的核心技术壁垒在于打通运行时 Kubernetes 工作负载遥测与自主基础设施配置之间的反馈回路。它不只是提醒工程团队存在过度配置的 Pod，而是安装主动代理，以程序方式调整 CPU
              和内存上限、通过智能装箱整合工作负载，并在 AWS、Azure 和 Google Cloud Platform 上配置优化后的计算实例。独立基准和已披露的部署数据表明，自动资源调整可消除组织约 50% 的已配置
              CPU 规模，扭转集群膨胀逐年加剧的趋势。

              不过，平台最深的技术差异化在于专用 GPU 编排能力。在企业 Kubernetes 集群中，GPU 利用率平均仅 5%，约 95% 的稀缺昂贵加速器容量处于闲置。通用自动扩缩器和传统 FinOps 工具把 GPU
              节点当作普通 CPU 实例处理；Cast AI 则整合 GPU 分时、Multi-Instance GPU（MIG）、Multi-Process Service（MPS）和 Kubernetes Dynamic
              Resource Allocation（DRA）等高级硬件共享机制。这种细粒度硬件虚拟化让多个 AI 推理工作负载安全共享物理卡，而不是为突发任务独占整块 $30,000 加速器。客户迁移的真实验证——例如
              ALLEN Digital 将七个机器学习模型从 Amazon SageMaker 迁移到 Cast AI——确认成本下降 71%，推理延迟也更低。此外，跨区域自动放置带来显著套利空间：为 A100 GPU
              工作负载选择有利云区域，可将计算成本最多降低 80%，相较当前 Spot 实例平均价格。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP009
              - CP014
              - CP015
