  - id: FE001
    title: 产品架构图
    type: stack
    summary: 以层级堆栈展示 Cast AI 平台架构，从集群遥测一路到自主执行及多云计算联邦。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE007
      - CE012
    approximationNotes: 基于技术文档和产品公告的概念性功能分层表示。
    data:
      layers:
        - label: 工作负载接入与传感层
          detail: 轻量级集群内代理实时观测 CPU、内存、GPU 和 SLO 遥测，无需修改代码。
        - label: 遥测与成本分析引擎
          detail: 汇总集群指标，评估命名空间支出、分配效率及闲置容量基准。
        - label: 预测智能核心
          detail: Cast Engine 应用启发式和 ML 模型，提前最多 30 分钟预测 Spot 中断。
        - label: 自主优化与资源调优
          detail: 自动完成毫核容器资源调优、Pod 装箱以及 Horizontal/Vertical Pod Autoscaler 的动态协调。
        - label: Omni Compute 与多云经纪层
          detail: 借助 Cast AI Anywhere，在 AWS EKS、GCP GKE、Azure AKS、OCI 和本地环境之间编排实例。
        - label: 安全与治理护栏
          detail: 执行代理式运行手册、错误配置审计、容器漏洞扫描和 FinOps 策略控制。
  - id: FU001
    title: 客户采用旅程与扩张循环
    type: journey-map
    summary: 从只读集群评估，依次推进到完整生产环境 Spot 自动化、Omni Compute GPU 扩张及企业许可。
    data:
      items:
