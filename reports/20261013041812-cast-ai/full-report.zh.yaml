      - number: '1.3'
        title: 平台架构、规模轨迹与里程碑演进
        blocks:
          - type: paragraph
            body: >-
              平台持续从基础容器资源调整扩展到完整的 AI 计算编排。2023 至 2024 年间，Cast AI 的市场势头快速增强，客户数翻倍以上，超过 2,100 家企业组织，其中包括
              Akamai、BMW、Cisco、FICO 和 Hugging Face。平台创新最终在 2026 年 1 月推出 OMNI Compute
              正式版：这是一个多云控制平面，可在不改代码的情况下，把外部计算容量和专用 GPU 集群转化为可互换的 Kubernetes 资源。OMNI Compute 首个超大规模云合作方是 Oracle Cloud
              Infrastructure，使运行在任意云上的组织都能按需调用 OCI 高性能 GPU 集群。该发布直接针对 Cast AI 对数万集群遥测后发现的系统性基础设施低效：企业 GPU 平均利用率仅约 5%，CPU
              利用率为 8%。Cast AI 通过跨云 GPU 配置和自动回退机制，试图在企业 AI 推理工作负载激增之际盘活闲置计算容量。
            claimRefs:
