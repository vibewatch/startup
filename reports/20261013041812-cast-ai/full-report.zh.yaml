      - number: '3.4'
        title: 壁垒持久性与超大规模云厂商商品化风险
        blocks:
          - type: paragraph
            body: >-
              评估 Cast AI 的竞争壁垒，必须审视结构性脆弱点以及公有云厂商激进的产品路线。首先，Cast AI 的价值主张根本上依附 Kubernetes 这一底层基座。对于运行单体传统应用、裸虚拟机、无服务器架构，或
              Databricks、SageMaker 等托管 AI 平台的组织，Cast AI
              用处很小。第三方从业者评测强调，工作负载可预测且静态的小型组织，从自主资源调整中获得的回报更低，平台的运营和财务开销因此难以证明合理。

              其次，超大规模云厂商商品化构成持续的结构性逆风。云厂商不断增强原生计算管理工具，引入 AWS Karpenter 等开源控制器，以及 GKE Autopilot、EKS Auto Mode
              等全托管环境。Karpenter 当前仍需要大量手工策略配置，也缺乏原生多云仲裁和跨云 GPU 池化；但超大规模云厂商拥有巨大的分销优势和零许可成本吸引力。如果云厂商开发出开箱即用、无摩擦的原生垂直 Pod
              自动扩缩和 GPU 分时，客户部署第三方集群内代理的意愿可能下降。此外，目前仅 2% 的 Kubernetes GPU 工作负载使用 Spot 实例，企业普遍不愿采用可抢占基础设施，也为 Cast AI 的自动
              Spot 故障转移算法设置采用障碍。Cast AI 的防线在于守住多云可互换性和供应商中立编排的技术领先，而超大规模云厂商在商业上缺乏合作的内在动力。
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
