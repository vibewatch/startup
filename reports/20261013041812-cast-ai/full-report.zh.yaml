          - type: paragraph
            body: >-
              Cast AI 的扩张循环通常从无摩擦的只读集群评估开始，几分钟内暴露潜在计算浪费，随后进入预发布自动化、生产环境实时资源调整，以及通过 Omni Compute 进行专用 GPU 优化。电商平台 Yotpo
              等客户把部署从基础成本可视化扩展到自动 Spot 实例替换，在削减云支出 40% 的同时，让工程团队摆脱手工配置。尽管运营能力强，Cast AI 仍面临架构和商业逆风。CloudZero
              的独立竞争分析指出，Cast AI 的成本分配模型严格局限于 Kubernetes 集群和 Pod，无法让组织在 Snowflake
              等多服务数据平台之间分摊共享云支出，也无法按业务单元、团队或客户追踪成本。此外，由于 Cast AI 不披露队列留存率、毛收入留存率或客户集中度，潜在投资者无法验证快速的初始降本是否能形成持久的企业软件
              ARR，亦无法排除云足迹完成资源调整后客户增长停滞的风险。
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU012
              - CU013
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自主执行带来高速采用
            body: Cast AI 的无摩擦接入只需一条只读命令即可生成即时成本分析，为从发现到生产部署铺出快速路径；2,100+ 家组织的采用证明了这一点。
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
          - type: callout
            title: 留存持久性与集中度仍未验证
            body: Cast AI 为头部客户带来 40% 至 50% 的可见生产节省，但公开队列留存、NRR 和客户集中度指标缺失，遮蔽了长期经济持久性。
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 运营自主性、自动扩缩冲突与爆炸半径
        blocks:
          - type: paragraph
            body: >-
              自主 Kubernetes 优化把基础设施控制从人工工程团队转移给算法策略引擎，带来显著运营权衡。Cast AI 在集群内部署拥有管理权限的代理，可调整工作负载、驱逐
              Pod，并动态配置或删除云计算节点。自动资源调整能快速消除闲置计算，但 Cast AI 与外部节点配置器并行运行，可能产生不可预测的竞态条件和冲突的扩缩决策。如果工程团队未配置完整的 Pod Disruption
              Budget，或有状态应用无法适应容器原地调整，激进装箱和 Pod 驱逐还可能打断敏感工作负载。组织必须执行严格护栏、分阶段上线模式和持续可观测性，控制运营爆炸半径。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR013
      - number: '7.2'
        title: 安全权限、遥测治理与合规态势
        blocks:
          - type: paragraph
            body: >-
              将主动第三方代理直接部署进生产 Kubernetes 控制平面，会带来关键的数据安全和监管治理问题。为降低客户风险，Cast AI 持有 ISO 27001 认证和经审计的 SOC 2 Type II
              鉴证，证明其安全控制经过外部验证。平台声称代理不会检查或收集敏感应用载荷、Kubernetes Secrets 或
              ConfigMaps，只依赖资源利用率指标和集群调度遥测。不过，在严格监管司法辖区运营的企业仍须评估跨境遥测流，执行最小权限的基于角色访问控制，并在授予自动代理执行权限前审查租户数据保留政策。
            claimRefs:
              - CR001
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
      - number: '7.3'
        title: 超大规模云平台依赖与渠道合作伙伴动态
        blocks:
          - type: paragraph
            body: >-
              Cast AI 是依赖 Amazon Web Services、Google Cloud Platform 和 Microsoft Azure 超大规模云基础设施的专用自动化覆盖层。平台高频查询云厂商定价
              API，评估 Spot 实例可用性、实例族价格和承诺利用率。云账单 API 的破坏性修改、价格数据源限流，或 Spot 驱逐政策大幅改变，都会直接影响 Cast AI 的优化速度。同时，AWS Karpenter
              等超大规模云原生工具带来长期去中介化风险：如果云厂商原生打包高级工作负载资源调整，Cast AI 就必须维持更强的多云策略协调能力，并通过 SoftwareOne 等伙伴保持分销触达。
            claimRefs:
              - CR006
              - CR008
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR014
      - number: '7.4'
        title: 财务模型可持续性、定价不透明与终止标准
        blocks:
          - type: paragraph
            body: >-
              Cast AI 的商业价值主张建立在企业基础设施浪费之上；2026 年数据表明，未优化集群的 GPU 平均利用率仅 5%，CPU 为
              8%。但客户反馈显示定价摩擦明显，尤其是定制报价结构、小集群最低消费，以及使财务预测复杂化的节省额百分比计费机制。持续存在的尽调难题，是年度经常性收入、毛利率、资本消耗率和客户队列留存数据完全没有公开披露。投资尽调必须验证高理论节省能否转化为持久软件利润率，并围绕企业流失、定价阻力或超大规模云平台锁定设定明确的终止标准。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR011
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自主控制平面的爆炸半径
            body: >-
              授予外部代理持续驱逐 Pod、选择虚拟机实例和删除闲置节点的权限，会把巨大的运营爆炸半径集中到自动化策略引擎中。工程组织必须规定严格的 Pod Disruption
              Budget，测试原地资源调整，并在关键生产集群启用实时装箱前强制只读监控。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >-
              我们对 Cast AI 的投资尽调给出审慎的「跟踪」建议：风险评级为中等，估值判断偏高。Cast AI 已在云基础设施优化和应用性能自动化领域展现出清晰的技术与商业势头，企业客户已超过 2,100 家，其中包括
              BMW、Cisco 和 Akamai 等知名客户。公司的 Kubernetes 自动调配和多云配置平台，直击企业云环境中的严重低效：真实集群利用率数据显示，已配置的 GPU 算力有 95% 处于闲置状态，CPU
              平均使用率仅约 8%。此外，主要超大规模云厂商近期将 Nvidia H200 实例价格上调 15%，进一步强化了 CFO 层面自主降本的紧迫性。不过，Cast AI 在 Pacific Alliance
              Ventures 于 2026 年 1 月进行战略投资后，账面投后估值已超过 $1.0 billion，但交易金额及 ARR、净收入留存率、GAAP 毛利率等经营财务指标仍未披露。在 $1.0 billion
              估值下，Cast AI 需要更高的收入倍数；若没有经审计的财务证明，公有云和 FinOps
              软件可比公司的估值并不足以支撑这一水平。因此，我们建议继续跟踪该资产，争取结构化条款或二级市场折价，而不是按当前账面估值新建股权仓位。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV010
              - CV014
      - number: '8.2'
        title: 核心论点与反证性反论点
        blocks:
          - type: paragraph
            body: >-
              Cast AI 的核心投资论点建立在三根支柱上：企业降本痛点迫切、技术具备自主性优势，以及跨云 AI 的选择权。企业因人工智能 FOMO 囤积稀缺 GPU
              资源，云基础设施预算承受巨大压力，集群因此严重超配，服务器实际 GPU 利用率往往只有 5%。第一代 FinOps 工具只能提供静态监控面板和人工工单建议；Cast AI 则直接在基础设施层自主运行，实时完成
              Pod 调配、节点装箱和动态 Spot 实例管理。OMNI Compute 的推出进一步扩大了公司的可服务市场：它建立统一控制平面，可在不同云之间配置 GPU
              算力，无需改动应用代码。反论点则指出了可能摧毁股权上行空间的关键执行和市场风险。预算疲软的企业可能选择缩减已承诺的 GPU 总容量，而不是购买专业的第三方多云编排软件。此外，AWS Karpenter、Azure
              原生工具等超大规模云厂商的原生自动扩缩容能力仍在快速提升。如果原生调度器缩小效率差距，Cast AI 的定价能力可能减弱，尤其是在多云客户流失加速或软件分销商拿走越来越多经济收益的情况下。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV012
      - number: '8.3'
        title: 融资历史与私募估值倍数
        blocks:
          - type: paragraph
            body: >-
              Cast AI 自 2019 年成立以来完成 10 轮融资，累计募资约 $272 million，持续获得顶级机构和企业投资者支持。2025 年 4 月，G2 Venture Partners 和
              SoftBank Vision Fund 2 领投 $108 million 的 Series C 轮融资，Aglaé Ventures、Creandum、Hedosophia 和 Cota Capital
              跟投，公司资本轨迹由此明显加速，估值约 $900 million。2026 年 1 月，韩国 $50 billion 零售集团 Shinsegae Group 的企业创投部门 Pacific Alliance
              Ventures 进行了一笔未披露金额的战略投资，Cast AI 的投后估值正式突破 $1.0 billion。根据 Multiples VC 的私募市场数据，Cast AI 的估值较 Series C 价格上升
              1.1x，较 2023 年 11 月 $300 million 的 Series B 估值增长超过 3.3x。管理层称公司单位经济健康、具备盈利运营能力，但 ARR
              完全没有公开披露，给分析带来很大不确定性。公有基础设施软件可比公司远期收入交易倍数约为 8x 至 12x；除非 Cast AI 的 ARR 收入运行率已超过 $80 million 至 $100
              million，否则其 $1.0 billion 估值隐含的收入倍数偏激进。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 情景估值、下行触发因素与退出准备度
        blocks:
          - type: paragraph
            body: >-
              为评估不同市场状态下的风险调整回报，我们建立乐观、基准和悲观三种运营情景。乐观情景（概率 25%）下，OMNI Compute 成为企业 AI 推理的标准独立算力层，ARR 加速超过 $80
              million，软件毛利率达到 80%+；按 18x 远期收入倍数计算，企业价值为 $1.44 billion 至 $1.80 billion，为 IPO 或被超大规模云厂商、网络巨头战略收购铺路。基准情景（概率
              50%）下，Cast AI 在核心 Kubernetes 优化流程中保持稳健增长，ARR 达到 $40 million 至 $50 million，但私募市场倍数收缩将估值限制在 $450 million 至
              $600 million，相比 $1.0 billion 的账面入场价，回报有限。悲观情景（概率 25%）下，云客户削减闲置 GPU 承诺，原生工具将基础调配能力商品化，增长停滞在 $30 million ARR
              以下，估值重置至 $180 million 至 $240 million，并触发清算优先权压力。在投资委员会重新考虑「买入」建议前，必须完成三项尽调：第一，全面核验经审计的 GAAP 财务报表，确认当前 ARR
              和毛利率；第二，取得客户群组留存数据，证明毛流失率低于 8%、NRR 高于 120%；第三，对 Series C 和战略轮的优先权结构进行法律审查。
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资建议：维持跟踪立场
            body: >-
              Cast AI 凭借 OMNI Compute 架构和 2,100+ 家企业客户，展现出清晰的技术进展和市场顺风，但在没有经审计 ARR 与毛利率披露的情况下，$1.0B
              投后估值不足以支撑有吸引力的入场判断。投资者应跟踪平台指标，并以经核实的增长经济性为资本投入前提。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV014
          - type: callout
            title: 下行压力：私募估值倍数压缩
            body: >-
              Pacific Alliance Ventures 未披露金额的战略投资将 Cast AI 估值推升至 $1.0B；若远期 ARR 低于
              $50M，公司将面临倍数压缩风险。此外，超大规模云厂商可能采取反制措施，原生调度器也可能改进，从而限制长期定价能力。
            calloutType: risk
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
