chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与领导层
        blocks:
          - type: paragraph
            body: >-
              Cast AI Group Inc. 是一家成立于 2019 年、总部位于佛罗里达州迈阿密的云基础设施自动化公司，主要欧洲研发团队位于立陶宛维尔纽斯。公司由连续创业的企业软件创业者 Yuri
              Frayman、Laurent Gil 和 Leon Kuperman 创立；三人此前分别从 Viewdle 和 Zenedge 的领导岗位退出。Cast AI 是面向 Amazon Web
              Services、Google Cloud Platform 和 Microsoft Azure 云原生 Kubernetes 工作负载的自主性能优化引擎。它并非单纯的可观测性仪表盘，而是用机器学习代理持续调整
              Pod 资源、对容器做装箱，并实时以动态配置的 Spot 实例替换昂贵的按需节点。CEO Yuri Frayman 负责公司方向和机构融资；总裁 Laurent Gil 主导全球合作伙伴生态与商业扩张；CTO
              Leon Kuperman 负责算法代理工程。公司高度依赖这三位创始人：他们一致的技术愿景和过往创业退出经历，既支撑客户信任，也支撑机构风投背书。
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO010
