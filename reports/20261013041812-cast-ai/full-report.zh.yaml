          touchpoints: Automated read-only script execution without infrastructure changes
        - label: 自动化节省审计
          stage: 发现
          detail: 分析跨集群节点、Pod 和工作负载的遥测
          touchpoints: Platform generates real-time visibility into CPU and memory waste
        - label: 启用非生产环境自动化
          stage: 试点
          detail: 在预发布环境启用自动扩缩容和定时集群休眠
          touchpoints: Validation of automated rebalancing and workload stability
        - label: 推进生产环境并编排 Spot
