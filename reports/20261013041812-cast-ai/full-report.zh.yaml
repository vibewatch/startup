  - id: TE002
    title: 工作流与用例分析
    columns:
      - 用户任务
      - 当前人工工作流
      - Cast AI 自动化
      - 可量化收益
      - 运营限制
    rows:
      - - 容器资源规格调整
        - 工程师根据峰值猜测设置静态 CPU / 内存请求和上限
        - Autopilot 根据实时用量在毫核级别动态调整容器规格
        - 在不降低响应延迟的情况下消除 20x 资源过度配置
        - 启用生产环境自主运行前需要审核初始配置
      - - 节点集群扩缩容
        - 静态节点池，或 Cluster Autoscaler 无协调的扩容
        - 在最便宜的实例类型之间动态配置算力并激进装箱
        - 减少算力浪费，目标是缩小与 50% 健康利用率之间的差距
        - 如果无人管理，工作负载重新平衡偶尔会中断活动连接
      - - Spot 实例生命周期
        - 手动回退脚本在实例被驱逐时可能造成集群算力突然不足
        - 预测性机器学习提前最多 30 分钟预测 Spot 终止
        - 支持优雅地排空工作负载并提前补充节点
        - Spot 可用性取决于云厂商各区域 Spot 资源池容量
      - - GPU 算力采购
        - 年度预留承诺为对冲稀缺性而囤积闲置加速器
        - 通过 Omni Compute 动态放置工作负载，并配置可互换的跨云 GPU
