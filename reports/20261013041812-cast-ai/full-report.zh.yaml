figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示从 2019 年成立到 2026 年独角兽估值期间的关键融资、平台架构及运营规模里程碑。
    data:
      items:
        - date: '2019'
          label: 在迈阿密成立
          detail: Yuri Frayman、Laurent Gil 和 Leon Kuperman 创立 Cast AI，解决云原生 Kubernetes 过度配置问题。
          tone: positive
        - date: 2020-11
          label: 种子轮（$8M）
          detail: 从 DNX Ventures、TA Ventures 和 Florida Funders 获得种子融资，搭建初始自动化引擎。
          tone: neutral
        - date: 2021-12
          label: A 轮（$10M）
          detail: Cota Capital 领投 A 轮，Samsung Next 和 Florida Funders 跟投，拓展多云成本优化。
          tone: positive
        - date: 2023-03
          label: B 轮早期交割（$20M）
          detail: Creandum 联合 Scale Asia Ventures 领投 $20M 轮，扩大欧洲和北美工程团队。
          tone: positive
        - date: 2023-11
          label: B 轮扩展（$35M）
          detail: Vintage Investment Partners 联合 Creandum 和 Uncorrelated Ventures 领投 $35M B 轮，加速 AI 工作负载能力建设。
          tone: positive
        - date: 2024-12
          label: 规模化 traction（2,100+ 客户）
          detail: 客户群在 2023 至 2024 年间翻了一倍以上，达到包括 BMW、Cisco 和 Akamai 在内的企业客户。
          tone: positive
        - date: 2025-04
          label: C 轮（$108M，估值 $900M）
          detail: G2 Venture Partners 和 SoftBank Vision Fund 2 联合领投 $108M C 轮，为全球扩张提供资金。
          tone: positive
        - date: 2026-01
          label: 独角兽地位与 OMNI Compute 发布
