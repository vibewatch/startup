      - CI009
      - CI010
  - id: TI003
    title: Unit Economics and Capital-Adequacy Gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Specific diligence request
    rows:
      - - Annual revenue
        - $15M-$42M for 2025
        - Medium; third-party range
        - Provides only a broad historical scale indicator
        - Audited 2025 revenue and monthly 2026 revenue bridge
      - - Customer count
        - 2,100+ companies
        - Medium; company claim
        - Indicates logo scale but not customer economics
        - Paying-logo count by ACV band and top-20 concentration
      - - Current ARR and growth
        - null
        - Unavailable
        - Required to assess recurring scale and momentum
        - Current ARR, recognized revenue, bookings, and year-over-year growth
      - - Gross margin
        - null
        - Unavailable
        - Determines scalability after hosting and service delivery
        - Revenue and COGS split by subscription, gain-share, support, and GPU products
      - - NRR and CAC payback
        - null
        - Unavailable
        - Tests retention, expansion, and sales efficiency
        - Cohort NRR, gross retention, CAC, sales cycle, and payback
      - - Cash, burn, runway, and debt
        - null
        - Unavailable
        - Funding raised cannot determine capital adequacy
        - Cash balance, monthly net burn, debt schedule, runway plan, and next-round trigger
    notes: Null means the assigned public evidence does not disclose the metric; each null has a management diligence request and must not be estimated from funding or customer counts.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI016
