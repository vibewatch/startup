        - Automated GPU instance provisioning and sharing
        - Monetization unit not publicly disclosed
        - Product capability documented; revenue contribution unknown
        - Unverified until SKU and attach-rate evidence is provided
        - SKU pricing, attach rate, GPU-related revenue, and delivery cost
    notes: Public mechanisms and ranges are reported list or market observations, not realized pricing or audited revenue mix; unknown fields require management evidence.
