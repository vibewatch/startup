schemaVersion: report-v2
artifact: financials
slug: cast-ai
runDate: '2026-10-13'
company:
  name: Cast AI
chapter:
  number: 4
  title: Financials
  summary: Public evidence indicates that Cast AI can monetize through annual subscriptions, selected savings-linked fees, and compute-linked usage pricing, but realized pricing and revenue mix are not disclosed. A third-party 2025 revenue range and the latest disclosed growth financing are directional signals only; current ARR, margins, retention, burn, runway, and customer concentration remain underwriting gaps.
sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >-
      Public evidence points to multiple commercial structures rather than one standard tariff. An independent vendor review describes annual platform subscriptions with a typical range of $50,000 to more than $1 million in annual contract value, and selected performance-linked arrangements charging 15% to 25% of verified savings. A competitor comparison separately describes usage-based pricing composed of a fixed base fee plus a per-CPU rate. These observations establish plausible billing mechanisms, not Cast AI's realized price, revenue recognition policy, discounting, contract duration, or mix. The company does not publish a current rate card in the assigned evidence, so subscription predictability and gain-share variability must be underwritten separately.
    claimRefs:
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-sales-efficiency
    title: Public Traction and Sales Efficiency Proxies
    body: >-
      Cast AI's homepage claims adoption by more than 2,100 companies, while an independent vendor review reports a broad 2025 annual revenue range of $15 million to $42 million. The latter is neither current ARR nor audited revenue and should not be treated as either. The same review says buyers typically deploy the platform in two to four weeks, which is a useful implementation-friction proxy but not evidence of sales-cycle length, CAC, conversion, or payback. Cast AI also highlights an Akamai case study claiming 40% to 70% cloud savings. That customer outcome may support willingness to pay, but it is company-curated evidence and does not establish portfolio-level retention or expansion economics.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI009
  - id: customer-economics-and-margin-path
    title: Customer Economics and Margin Path
    body: >-
      The clearest economic evidence concerns the customer's waste pool, not Cast AI's own unit economics. Cast AI reports average pre-automation utilization of 5% for GPUs, 8% for CPUs, and 20% for memory; Business Insider independently repeats the 5% GPU and 8% CPU figures and identifies a 23,000-cluster dataset. The report methodology says observations were collected before customers enabled Cast AI automation, making them opportunity baselines rather than measured savings. Cast AI describes automated rightsizing, scaling, and GPU provisioning as the intervention. These facts explain a potential value bridge from underused compute to customer savings, but they reveal nothing about Cast AI's hosting, support, sales, or service-delivery costs and therefore do not establish gross margin.
    claimRefs:
      - CI008
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy-and-verdict
    title: Capital Adequacy and Financial Verdict
    body: >-
      The latest quantified financing evidence in this pool is a third-party report of a $108 million April 2025 growth round and more than $190 million of total funding. That history demonstrates access to external capital, but funding raised is not cash available and cannot establish runway without cash, burn, debt, and working-capital data. Revenue quality could be attractive if annual subscriptions dominate, while performance-linked and compute-linked fees introduce variability tied to customer usage and verified savings. A competitor also argues that Cast AI lacks full cost coverage outside Kubernetes, which may constrain wallet share. The financial verdict is therefore promising but not underwritten: current revenue quality, margin path, sales efficiency, concentration, and forward capital needs require private diligence.
    claimRefs:
      - CI002
      - CI005
      - CI015
      - CI016
callouts:
  - calloutType: risk
    title: Funding Does Not Establish Runway
    body: >-
      Reported cumulative funding is a financing-history signal, not a substitute for current cash, net burn, debt obligations, working-capital needs, or a management runway forecast.
    claimRefs:
      - CI002
      - CI016
