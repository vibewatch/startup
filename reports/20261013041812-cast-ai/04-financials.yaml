    title: Revenue Model Bridge
    type: flow
    summary: Evidence-backed path from customer resource waste to Cast AI monetization, ending with the unresolved gross-profit step.
    data:
      nodes:
        - label: Underutilized Kubernetes estate
          detail: Reported pre-automation averages include 5% GPU, 8% CPU, and 20% memory utilization.
        - label: Workload and cost signals
          detail: Cast AI observes workload, infrastructure, cost, and service-level signals.
        - label: Automated optimization actions
          detail: Rightsizing, node scaling, Spot optimization, and GPU provisioning act on the opportunity.
        - label: Customer savings outcome
          detail: Cast AI highlights a 40%-70% cloud-savings case, but portfolio savings are not disclosed.
        - label: Contracted monetization
          detail: Reported structures include annual subscriptions, savings-linked fees, and compute-linked charges.
        - label: Revenue captured; gross profit unknown
          detail: A third party reports a broad 2025 revenue range, while revenue mix, COGS, and gross margin remain unavailable.
    approximationNotes: The flow represents supported mechanisms, not conversion rates, revenue recognition timing, or a quantified gross-profit waterfall.
    claimRefs:
      - CI001
      - CI008
      - CI013
      - CI014
      - CI016
