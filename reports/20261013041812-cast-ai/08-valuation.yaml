  - id: TV002
    title: Thesis / Anti-Thesis Matrix
    columns:
      - Angle
      - Investment Thesis Argument
      - Anti-Thesis Counter-Argument
      - What Would Change View
    rows:
      - - Market Opportunity
        - GPU waste sits at 95%, and rising AI infrastructure costs make autonomous optimization a critical CFO priority
        - Enterprises may reduce gross GPU allocation rather than buying third-party multi-cloud control planes
        - Accelerating adoption of OMNI Compute with verified GPU cost savings over 50%
      - - Product & Tech
        - Autonomous control plane goes beyond passive monitoring to real-time cluster rightsizing and multi-cloud GPU provisioning
        - Hyperscaler native tools (Karpenter, Azure Advisor) and competing startups could compress pricing power
        - Independent benchmarks demonstrating sustained 3x efficiency lead over native autoscalers
      - - Financial Performance
        - Management claims near-profitability with healthy unit economics across 2,100+ enterprise accounts
        - Actual ARR, cash burn, gross margins, and NRR remain completely private, obscuring true burn multiple
        - Disclosure of audited ARR above $45M and net revenue retention exceeding 125%
      - - Valuation Multiples
        - SoftBank, G2VP, and Pacific Alliance Ventures validated platform leadership at $1.0B valuation
        - Valuation step-up from $300M (Nov 2023) to $1B (Jan 2026) outpaced disclosed operational scale
        - Down-round protection or secondary transaction at sub-12x NTM ARR multiple
    notes: Arguments evaluate market drivers, competitive durability, private margin assumptions, and return sensitivity.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV012
  - id: TV003
    title: Bull / Base / Bear Valuation Scenarios
    columns:
      - Scenario
      - Operating & Growth Assumptions
      - Target Multiple & Valuation Logic
      - Downside Triggers & Risks
      - Probability Signal
    rows:
      - - Bull Case
        - OMNI Compute dominates cross-cloud GPU provisioning; ARR scales past $80M at 80%+ gross margin; 2,500+ accounts
        - 18x NTM ARR multiple implies $1.44B to $1.80B enterprise value; attractive IPO or hyperscaler M&A exit
        - Hyperscaler API restrictions, lock-in counter-measures, or aggressive native price matching
        - 25% (High upside optionality dependent on AI inference scale)
      - - Base Case
        - Steady expansion in core EKS/GKE optimization; ARR reaches $40M–$50M; 2,200+ customers; stable cash burn
        - 10x–12x NTM ARR multiple supports $450M to $600M fair valuation; moderate returns on common equity
        - Slower enterprise procurement cycles and competitive pressure from specialized FinOps vendors
        - 50% (Reflects current growth trajectory with private-market multiple compression)
      - - Bear Case
        - GPU hoarding bubble deflates; enterprises consolidate on native Karpenter/HPA; ARR plateaus below $30M
        - 6x–8x NTM ARR multiple results in $180M to $240M valuation; preference overhang from Series C/strategic round
        - Down-round recapitalization, customer churn, and margin erosion on marketplace transactions
        - 25% (Substantial downside risk if headline $1B valuation faces multiple contraction)
    notes: Valuation ranges model ARR estimates against public infrastructure software and private FinOps multiples.
    claimRefs:
