callouts:
  - calloutType: recommendation
    title: 'Investment Recommendation: Maintain Track Stance'
    body: Cast AI exhibits clear technical velocity and market tailwinds with its OMNI Compute architecture and 2,100+ enterprise accounts, but the $1.0B post-money valuation cannot be underwritten as an attractive entry point without audited ARR and gross margin disclosure. Investors should track platform metrics and condition capital deployment on verified growth economics.
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV014
  - calloutType: risk
    title: 'Downside Overhang: Private Valuation Multiple Compression'
    body: With a valuation step-up to $1.0B following an undisclosed strategic investment from Pacific Alliance Ventures, Cast AI faces multiple compression risk if forward ARR is below $50M. Furthermore, potential hyperscaler counter-measures or native scheduler improvements could constrain long-term pricing leverage.
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
