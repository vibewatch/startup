callouts:
  - calloutType: risk
    title: Highest residual risk is structural, not narrative
    body: >-
      LONGi Hydrogen can show scale, product-control claims, and parent funding access, but public
      evidence still places the business in an oversupplied alkaline-electrolyzer market where utilization,
      export adaptation, and pricing discipline determine whether scale becomes moat or margin trap.
    claimRefs:
      - CR002
      - CR005
      - CR006
  - calloutType: assumption
    title: The bullish case requires cleaner standalone proof
    body: >-
      The positive case strengthens materially only if audited order conversion, current site-level
      compliance, and hydrogen-specific reliability disclosures reduce the need to infer operating
      quality from parent-group systems and company product claims.
    claimRefs:
      - CR008
      - CR009
      - CR013
      - CR016
