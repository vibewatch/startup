company:
  name: LONGi Hydrogen Energy
chapter:
  number: 5
  title: Product & Technology
  summary: >
    LONGi Hydrogen's public evidence set supports a real, hardware-first alkaline
    electrolyzer platform rather than a concept-stage product story: official pages
    define the base bath and ALK Hi1, the 2023 annual report says the company
    launched a 3,000 Nm³/h single-slot unit and built 2.5GW of capacity, and
    independent articles document both a one-year steel-industry demonstration and
    a first 5MW European shipment. The main diligence gap is that the public record
    is much stronger on mechanical packaging, export compliance, and manufacturing
    scale than on software observability, third-party benchmarking, and fleet-level
    reliability telemetry.
sections:
  - id: offer-and-module-map
    title: Offer is centered on large alkaline hardware and packaged industrial solutions
    body: >
      The current public product surface describes LONGi Hydrogen as a builder of
      large-scale alkaline electrolyzer equipment and packaged industrial hydrogen
      systems, not a PEM specialist or software-first platform. The official product
      pages define two anchor offers: a base alkaline water electrolytic bath with
      up to 1,500 Nm³/h single-unit output, and the ALK Hi1 system with lower
      advertised power consumption, broader load range, and a 4-in-1 gas-liquid
      separation module. The 2023 annual report extends that story from brochure
      features to product-line expansion, stating that LONGi launched the industry's
      first 3,000 Nm³/h single-slot alkaline electrolyzer and paired it with "green
      power + green hydrogen" solutions for refining, ammonia synthesis, and
      metallurgy. External market-positioning evidence is directionally supportive
      but lighter-weight: Blackridge Research places LONGi among the largest
      electrolyzer manufacturers and lists 5,000 MW of current production capacity,
      which is useful context but not an audited benchmark.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE011, CE014]
    tableRefs: [TE001]
  - id: operating-architecture-and-deployment
    title: Architecture evidence is strongest on industrial hardware, controls, and delivery execution
    body: >
      Public evidence describes a layered, plant-level operating model. The official
      product surfaces emphasize standardized alkaline hardware, modular integration,
      three-level production/DCS/PLC controls, chain alarms, and intelligent O&M.
      Independent project evidence then shows what that architecture looks like in
      field deployment: the Changli hydrogen-rich smelting demonstration reportedly
      used two 3,000 Nm³/h ALK G systems plus power supply, gas-liquid separation,
      control, power distribution, and auxiliary systems, and SMM says the project
      had operated stably for one year after commissioning. The January 2026
      European shipment adds another maturity signal because it moves from domestic
      demonstration into export packaging, code alignment, and localized delivery
      documentation. What is still missing from the public record is a deeper view
      into software release cadence, operator telemetry, or independently disclosed
      uptime statistics, so the hardware and execution story is better evidenced
      than the observability story.
    claimRefs: [CE002, CE003, CE004, CE005, CE008, CE009, CE010, CE015]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: differentiation-compliance-and-risks
    title: Differentiation rests on alkaline scale and cost claims, but export fit and adaptability remain risks
    body: >
      LONGi's differentiation is currently framed around alkaline scale, cost, and
      manufacturability rather than around a differentiated PEM architecture or a
      visible software ecosystem. Company and project materials emphasize lower DC
      power consumption, larger single-slot form factors, modular gas-liquid
      separation, and industrial use cases such as hydrogen metallurgy. Independent
      sources, however, put important boundaries around that advantage. H2TECH says
      Chinese electrolyzer exporters still face only a modest landed-cost advantage
      once freight and tariffs are considered, and it notes that China's alkaline
      focus narrows some export-market fit. Asia Times, republishing DSET analysis,
      goes further and argues that Chinese electrolyzer scale has also produced
      overcapacity, low-efficiency risk, and limited adaptability in demanding
      operating conditions. That makes the investable question less about whether
      LONGi can ship alkaline hardware at scale and more about whether it can prove
      durable performance, standards compliance, and service quality across diverse
      international duty cycles.
    claimRefs: [CE006, CE007, CE010, CE011, CE012, CE013, CE014, CE015]
callouts:
  - calloutType: strength
    title: Real deployment proof exists beyond brochure copy
    body: >
      Public evidence goes beyond marketing pages: the 2023 annual report describes
      a 3,000 Nm³/h single-slot launch, SMM documents a one-year industrial
      demonstration, and a separate SMM article reports a first 5MW European
      shipment with named compliance standards.
    claimRefs: [CE006, CE008, CE010]
  - calloutType: risk
    title: Exportability and performance proof are still the swing diligence items
    body: >
      LONGi's public materials make a credible scale-and-cost case for alkaline
      systems, but independent sources still flag export-market standardization,
      landed-cost compression, overcapacity, and limited public telemetry as real
      constraints on defensible product advantage.
    claimRefs: [CE012, CE013, CE015]
