      - ["Hydrogen-rich blast furnace smelting", "Steel plant integrates hydrogen into blast-furnace operations", "Two 3,000 Nm³/h ALK G systems plus supporting facilities", "SMM reports one year of stable operation and 4.25 kWh/Nm³ at the Changli project", "Operational metrics come from an industry-news writeup, not audited customer disclosure"]
      - ["Refining / ammonia / metallurgy decarbonization", "Industrial user needs packaged electrolysis plus solution framing", "Annual-report-described green power + green hydrogen system solutions", "Named end markets show the product strategy is not limited to pilot rhetoric", "No public list of reference plants or conversion economics for each vertical"]
      - ["European export deployment", "Developer needs code-aligned equipment and lower integration friction", "5MW alkaline system shipped with CE/ASME/EIGA alignment and localized documentation", "Independent article shows export-readiness work already underway", "No retained public proof yet of local commissioning or steady-state operating KPIs"]
    notes: >
      Benefits are stated exactly at the denominator used by the source; absent
