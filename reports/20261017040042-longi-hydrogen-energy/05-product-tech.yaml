      - Dependency
      - Risk
    rows:
      - ["Electrolyzer cell / bath", "Core alkaline electrolysis hardware converting electricity into hydrogen", "Cell design, materials, manufacturing consistency, and power quality", "Public performance claims are mostly company-issued and need more independent validation"]
      - ["Gas-liquid separation module", "Conditions process output and packages system balance-of-plant", "4-in-1 separation design, site footprint, piping integration", "Need P&ID-level detail, redundancy philosophy, and failure-mode disclosure"]
      - ["Control / automation layer", "Coordinates production management, DCS monitoring, PLC equipment management, and alarms", "Sensors, software logic, human-machine interface, and O&M workflows", "No public API, release cadence, or live reliability telemetry in the assigned evidence set"]
      - ["Power distribution and auxiliaries", "Connects electrolysis hardware to site electrical and support systems", "Power supply, distribution gear, auxiliary systems, and project engineering", "Cross-border service, localization, and grid-quality requirements can slow deployment"]
    notes: >
      This table reconstructs the operating architecture from official product pages
      and independent project descriptions; it is specific enough for diligence
      framing but not a substitute for engineering documentation.
    claimRefs: [CE003, CE005, CE008, CE010, CE015]
