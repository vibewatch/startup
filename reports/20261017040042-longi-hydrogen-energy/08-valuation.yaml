callouts:
  - calloutType: recommendation
    title: Do not pay for leadership without price proof
    body: >-
      LONGi Hydrogen looks strategically credible, but the current public record still does not justify
      paying as though utilization, margins, and external investor pricing are already de-risked.
    claimRefs: [CV010, CV012, CV016]
  - calloutType: assumption
    title: The upside case depends on proof converting faster than price pressure
    body: >-
      A stronger call requires current audited numbers, repeat export orders, and verified operating
      performance before scale and parent backing can translate into a higher underwriting multiple.
    claimRefs: [CV002, CV009, CV012, CV015, CV016]
