      - ["Thesis", "Commercial proof is improving: >RMB100m 2023 turnover, 2.5GW built capacity, named project participation, and a first Europe shipment.", "Audited standalone revenue, margin, and repeat-order disclosure would convert traction into valuation evidence."]
      - ["Anti-thesis", "Chinese cost leadership supports demand, but it also drives industry-wide price compression and consolidation risk.", "Clear proof of utilization discipline, backlog quality, and margin resilience would soften the compression concern."]
      - ["Anti-thesis", "Project execution quality is still uncertain because under-utilization and low operating conversion are showing up in the wider electrolyser market.", "Verified uptime, efficiency, and customer-reference data from Longi systems would remove the sharpest downside objection."]
    notes: >-
      This table separates the underwriteable positives from the still-unresolved proof gaps rather than assigning unsupported numeric upside.
    claimRefs: [CV002, CV004, CV005, CV006, CV008, CV010, CV012, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Export wins convert into repeat orders; audited subsidiary numbers show healthy margin conversion; sector consolidation removes weaker rivals.", "Could justify paying for strategic scarcity, but only after hard financial and uptime proof replaces narrative optionality.", "Trade friction, delayed customer ramp, and margin erosion despite volume.", "Independent customer references, audited 2025/2026 financials, and additional Europe or Middle East wins."]
      - ["Base", "Parent support continues, domestic demand remains real, and Longi keeps technical relevance, but pricing stays competitive and disclosures stay incomplete.", "Treat as optionality rather than premium compounder exposure; require disciplined entry terms or a discount to leader-quality narratives.", "Slow conversion from awarded projects to profitable operations; governance or preference overhang remains unclear.", "Mixed order flow, modest export progress, and continued absence of a disclosed third-party valuation anchor."]
      - ["Bear", "Overcapacity and operational underperformance dominate; customers delay adoption; the business leans on parent support for longer than expected.", "Avoid paying a growth premium; only distressed or heavily protected structures would compensate for the risk.", "Down-round or preference reset, weak utilization, and standards or tariff barriers in export markets.", "More evidence of low operating conversion, price war behavior, or stalled project execution."]
    notes: >-
      Scenarios are qualitative because the assigned public evidence does not disclose a current external valuation, audited subsidiary cash-flow profile, or full cap-table terms.
    claimRefs: [CV003, CV009, CV010, CV012, CV014, CV015, CV016]
