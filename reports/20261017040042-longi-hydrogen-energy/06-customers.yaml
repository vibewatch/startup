  - calloutType: "insight"
    title: "Project wins are stronger than logo proof"
    body: "Da'an and Kuche tie LONGi to named industrial projects and concrete procurement or shipment milestones, but the evidence is still issuer-controlled and lacks customer-quoted operating outcomes."
    claimRefs: ["CU001", "CU002", "CU003"]
  - calloutType: "risk"
    title: "Do not infer retention from orders"
    body: "The assigned evidence contains no retention, renewal, repeat-purchase, or concentration metrics, while independent sources flag difficult offtake and excess manufacturing capacity."
    claimRefs: ["CU013", "CU014", "CU015"]
