chapter:
  number: 6
  title: "Customers"
  summary: "LONGi Hydrogen has credible project-scale adoption proof in Chinese refining and green-ammonia applications, followed by a disclosed first large overseas delivery and European orders in 2024. Public evidence remains transaction-oriented: it does not disclose retention, repeat-purchase, customer-count, or concentration metrics."
sections:
  - id: "segments-and-buying-motion"
    title: "Demand is concentrated in project-scale industrial buyers"
    body: |
      The evidence points to a concentrated buyer universe rather than a broad, repeatable customer base. LONGi markets alkaline electrolysis systems to chemicals, metallurgy, transportation, energy, and power users, while independent market evidence says disclosed early-mover offtake is led by chemicals, especially ammonia, followed by e-fuels and refining. The most credible buyer archetype is therefore a state-owned or large industrial project sponsor procuring an engineered hydrogen-production system for a defined plant. The expo profile broadens that positioning to global strategic partners, but it is company-supplied marketing and does not establish active customers, payer identities, or revenue mix by segment.
    claimRefs: ["CU009", "CU010", "CU012", "CU013"]
    tableRefs: ["TU001"]
  - id: "adoption-trajectory"
    title: "Awards progressed from domestic demonstrations to an initial export foothold"
    body: |
      Public milestones show a sequence from domestic project awards to overseas delivery. LONGi reported winning and shipping equipment for Sinopec Star's 10,000-ton-scale Kuche demonstration project, then disclosed a 15-system position in the Da'an green-ammonia tender. The parent company's 2023 report recorded more than RMB 100 million of turnover and 2.5 GW of production capacity, while its 2024 report said the hydrogen business delivered its first large-scale overseas project and secured major European orders. These are meaningful commercial signals, but turnover is not recurring revenue, manufacturing capacity is not utilization, and an order is not evidence of commissioning, uptime, or renewal.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU007", "CU008"]
    tableRefs: ["TU002"]
    figureRefs: ["FU001"]
  - id: "named-proof"
    title: "Named proof is strongest in China and weakest after delivery"
    body: |
      The assigned evidence identifies two Chinese project references with customer or sponsor names: Jilin Electric Power's Da'an project and Sinopec Star's Kuche project. Da'an provides the clearest procurement denominator because LONGi disclosed 15 of 39 alkaline systems, or 38.5% of that tender. Kuche is supported by two company-controlled publications that describe both the award and shipment, but neither provides operating outcomes. The 2024 export disclosure is less decision-useful because European counterparties, order values, delivery dates, commissioning status, and customer outcomes are omitted. The table is therefore a sample of disclosed proof, not an exhaustive customer list.
    claimRefs: ["CU001", "CU002", "CU003", "CU007", "CU008", "CU013"]
    tableRefs: ["TU003"]
  - id: "durability-and-concentration"
    title: "Durability and concentration remain the central customer diligence gaps"
    body: |
      No retained source reports gross or net revenue retention, churn, renewal cadence, repeat orders, contract duration, customer count, backlog aging, or top-customer concentration. That absence matters because independent sources describe a difficult demand environment: premium green-hydrogen offtake remains hard to secure, Chinese manufacturing capacity has outpaced demand, and broader deployment is constrained by cost, infrastructure readiness, regulation, and limited multiyear operating evidence. LONGi's tender wins and export milestones demonstrate access to projects, but they do not prove durable account economics. Underwriting should therefore require a customer-level contract and operating-data room rather than extrapolating retention from bid wins or manufacturing scale.
    claimRefs: ["CU013", "CU014", "CU015", "CU016"]
