  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      LONGi Hydrogen's public financial logic runs from electricity-sensitive customer economics to turnkey equipment
      sales, export delivery, and repeat project demand, with margin translation exposed to overcapacity and performance
      risk.
    data:
      nodes:
        - id: power-cost
          label: Power cost
          detail: Electricity is about 70% to 80% of hydrogen production cost
        - id: product-efficiency
          label: Product efficiency
          detail: ALK Hi1 is publicly placed at roughly 4.0-4.3 kWh/Nm³ and ALK G claims ~20% lower single-cost CAPEX
        - id: customer-economics
          label: Customer economics
          detail: Lower power use and capex support LCOH and project IRR
        - id: equipment-sale
          label: Equipment sale
          detail: LONGi Hydrogen exceeded RMB 100 million turnover in 2023 and led China alkaline-electrolyzer bid wins
        - id: delivery-commissioning
          label: Delivery and commissioning
          detail: Uzbekistan commissioning and first Europe 5MW shipment show export execution
        - id: repeat-demand
          label: Repeat demand or squeeze
          detail: Cost leadership helps wins, but overcapacity, adaptation costs, and commissioning risk can compress margins
      edges:
        - from: power-cost
          to: product-efficiency
          label: Customer pain point
        - from: product-efficiency
          to: customer-economics
          label: Better project economics
        - from: customer-economics
          to: equipment-sale
          label: Converts into bids and orders
        - from: equipment-sale
          to: delivery-commissioning
          label: Revenue realization depends on execution
        - from: delivery-commissioning
          to: repeat-demand
          label: Referenceability drives next projects
    approximationNotes: >-
      This figure is a directional operating bridge, not a quantified revenue or gross-profit waterfall; the assigned
      evidence pool does not disclose contract pricing, gross margin, or cash-conversion math.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI006
      - CI010
      - CI014
      - CI016
