      - number: '1.3'
        title: Commercial milestones and risk context
        blocks:
          - type: paragraph
            body: >-
              Commercially, the chapter can point to more than internal ambition. LONGi Hydrogen is cited as the sole
              hydrogen-equipment supplier on the Uzbekistan green-hydrogen project, and HydrogenPro said in 2026 that a
              strategic OEM agreement with LONGI gave it access to 1 GW of manufacturing capacity. That is meaningful
              external validation, but it sits inside a Chinese electrolyzer market that multiple independent sources
              describe as both cost-advantaged and overheated. Independent reporting highlights China's pricing edge and
              manufacturing dominance, yet it also flags overcapacity, expected consolidation, and efficiency or
              adaptability concerns for some Chinese alkaline systems. The practical takeaway is that LONGi Hydrogen
              appears commercially real and internationally active, but it is scaling from a home market whose
              competitive pressure can help volume while compressing economics and increasing execution risk.
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute spend
        blocks:
          - type: paragraph
            body: >-
              LONGi's public positioning points to a fairly specific market boundary rather than a generic "hydrogen
              economy" claim. Its hydrogen offer is framed around lowering the unit cost of hydrogen for industrial
              decarbonization use cases such as coal chemical, petrochemical, refining, ammonia synthesis, hydrogen
              metallurgy, transportation, and power-linked energy systems. In practice, that means the addressable spend
              for this chapter is electrolyzer systems, balance-of-plant integration, localization and certification
              work, and "green power + green hydrogen" engineering that lets an industrial sponsor produce hydrogen on
              site or within a dedicated project. It does not automatically include downstream ammonia plants, renewable
              generation ownership, hydrogen distribution infrastructure, or PEM-heavy use cases where LONGi's current
              alkaline strength is less differentiated.
            claimRefs:
              - CM001
              - CM003
              - CM014
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM014
              - CM016
          - type: table
            tableRef: TM003
