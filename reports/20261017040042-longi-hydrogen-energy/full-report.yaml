      - number: '5.2'
        title: Architecture evidence is strongest on industrial hardware, controls, and delivery execution
        blocks:
          - type: paragraph
            body: >
              Public evidence describes a layered, plant-level operating model. The official product surfaces emphasize
              standardized alkaline hardware, modular integration, three-level production/DCS/PLC controls, chain
              alarms, and intelligent O&M. Independent project evidence then shows what that architecture looks like in
              field deployment: the Changli hydrogen-rich smelting demonstration reportedly used two 3,000 Nm³/h ALK G
              systems plus power supply, gas-liquid separation, control, power distribution, and auxiliary systems, and
              SMM says the project had operated stably for one year after commissioning. The January 2026 European
              shipment adds another maturity signal because it moves from domestic demonstration into export packaging,
              code alignment, and localized delivery documentation. What is still missing from the public record is a
              deeper view into software release cadence, operator telemetry, or independently disclosed uptime
              statistics, so the hardware and execution story is better evidenced than the observability story.
            claimRefs:
