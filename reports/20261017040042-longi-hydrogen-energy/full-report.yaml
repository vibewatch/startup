      - number: '3.4'
        title: Moat durability is limited by overcapacity, PEM gaps, and likely domestic consolidation
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence matters because it cuts against any premium narrative built only on scale plans.
              Independent sources describe Chinese electrolyser manufacturing capacity as outrunning near-term demand,
              which raises the odds of price pressure and consolidation rather than durable scarcity rents. Those same
              sources also argue that Chinese exporters still face limits where buyers need PEM flexibility or export
              standards tuned to local regulatory and operating conditions. In practice, that means LONGi's moat looks
              conditional: strong enough to stay in large Chinese AWE tenders, but still exposed to commoditization at
              home and to technology- and standards-driven displacement abroad unless its compliance and application
              depth keep improving faster than peers.
            claimRefs:
              - CP009
