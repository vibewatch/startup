  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Parent support and improving commercialization matter, but execution and valuation proof still lag the narrative.
    data:
      nodes:
        - id: parent-support
          label: Parent-backed financing
          detail: 2022 loan facilities plus a 2023 RMB500m capital increase reduce immediate survival risk.
          tone: positive
        - id: cost-umbrella
          label: Chinese cost umbrella
          detail: Chinese systems still price below many non-Chinese alternatives and China remains the scale center.
          tone: positive
        - id: traction
          label: Real commercialization
          detail: '>RMB100m 2023 turnover, 2.5GW built capacity, named projects, and a first Europe shipment.'
          tone: positive
        - id: execution-risk
          label: Execution quality still uneven
          detail: Low operating conversion and under-utilization evidence mean scale is not yet equal to durable economics.
          tone: risk
        - id: price-discipline
          label: No public price anchor
          detail: The current pool still lacks a fresh outside valuation mark, full terms, and audited standalone financials.
          tone: warning
        - id: recommendation
          label: 'Recommendation: research-more'
          detail: Wait for audited proof or materially better entry terms before underwriting a premium outcome.
          tone: warning
      edges:
        - from: parent-support
          to: cost-umbrella
          label: supports scale
        - from: cost-umbrella
          to: traction
          label: helps win work
        - from: traction
          to: execution-risk
          label: still needs validation
        - from: execution-risk
          to: price-discipline
          label: compresses confidence
        - from: price-discipline
          to: recommendation
          label: sets entry bar
    claimRefs:
      - CV002
      - CV008
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
