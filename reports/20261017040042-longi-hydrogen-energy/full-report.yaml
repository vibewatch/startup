companyProfile:
  summary: >-
    LONGi Hydrogen Energy is LONGi Green Energy's hydrogen-equipment subsidiary. The public record shows the business
    was formed in 2021, operates around alkaline electrolyzers and integrated hydrogen-production systems, and has moved
    from internal development into export and partner-visible project delivery. The same record also shows persistent
    parent support and limited independent disclosure, so the company reads more like a strategically important
    operating subsidiary than a fully transparent standalone manufacturer.
