        title: LONGi's public differentiation is packaging and parent backing more than unique product exclusivity
        blocks:
          - type: paragraph
            body: >-
              LONGi's retained official materials consistently present the company as an alkaline-equipment supplier
              that tries to move one layer up the stack into modular systems, project integration, and operations. That
              is a meaningful distinction from a pure stack or skid seller, especially when buyers are trying to
              compress EPC complexity and hit schedule targets. The evidence also shows LONGi carrying explicit parent
