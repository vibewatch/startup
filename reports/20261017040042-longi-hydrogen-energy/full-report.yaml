  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: LONGi competes inside a crowded Chinese alkaline cluster, not a winner-take-all market
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a layered landscape rather than a single rival set. At the global
              incumbent layer, Thyssenkrupp Nucera and John Cockerill still show the clearest large-project delivery and
              orderbook disclosure. At the direct Chinese alkaline layer, LONGi, Peric, Sungrow, Tianjin Mainland, and
              other domestic suppliers are competing for the same utility-scale project wave. The practical status-quo
              alternative for many buyers is therefore not a proprietary incumbent stack but a broad Chinese AWE
              sourcing market where multiple vendors can credibly bid. That matters because LONGi's public proof
              supports relevance, but it does not support exclusive category ownership or obvious insulation from peer
              substitution.
