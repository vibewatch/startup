  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercialization
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to LONGi Hydrogen monetizing primarily through alkaline electrolyzer
              equipment sales and closely attached balance-of-plant, delivery, and integration services rather than
              through a disclosed recurring software or hydrogen-offtake revenue stream. LONGi's product page frames the
              offer around large standardized electrolyzer equipment, while the company's 2023 annual report says LONGi
              Hydrogen exceeded RMB 100 million of turnover and led China in winning alkaline-electrolyzer bids.
              Independent project coverage shows that this commercialization path already includes full-system supply
              packages for export projects, with four 1000 Nm³/h electrolyzers in Uzbekistan and a first 5MW Europe
              shipment in early 2026. That combination makes revenue quality more tied to project wins, acceptance
              milestones, delivery execution, and working-capital timing than to subscription-like recurring revenue.
            claimRefs:
