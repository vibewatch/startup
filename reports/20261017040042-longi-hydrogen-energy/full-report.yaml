              - CM015
              - CM016
      - number: '2.2'
        title: Sizing lenses show scale and oversupply at the same time
        blocks:
          - type: paragraph
            body: >-
              Public market lenses are large enough to justify serious diligence, but they do not support an unqualified
              "massive TAM" conclusion. VNZ said global electrolyzer deliveries reached 3.2GW in 2024 and cumulative
              installed capacity exceeded 6GW, with China alone taking 1.44GW of deliveries and leading Q1 2025 firm
              orders at 2.8GW. At the same time, GGII estimated China had already built 38GW of nominal electrolyzer
              capacity by end-2023 and could exceed 65GW by 2025, while S&P Global said 2024 manufacturing capacity
              reached 39GW/year against only 693MW of tenders in the first 10 months. The investable conclusion is that
              the market is real, but near-term supplier economics are governed by utilization and offtake conversion
              rather than by manufacturing nameplate alone.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
