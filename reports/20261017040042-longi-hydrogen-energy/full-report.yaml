      - number: '6.2'
        title: Awards progressed from domestic demonstrations to an initial export foothold
        blocks:
          - type: paragraph
            body: >
              Public milestones show a sequence from domestic project awards to overseas delivery. LONGi reported
              winning and shipping equipment for Sinopec Star's 10,000-ton-scale Kuche demonstration project, then
              disclosed a 15-system position in the Da'an green-ammonia tender. The parent company's 2023 report
              recorded more than RMB 100 million of turnover and 2.5 GW of production capacity, while its 2024 report
              said the hydrogen business delivered its first large-scale overseas project and secured major European
              orders. These are meaningful commercial signals, but turnover is not recurring revenue, manufacturing
              capacity is not utilization, and an order is not evidence of commissioning, uptime, or renewal.
