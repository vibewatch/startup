      - number: '5.3'
        title: Differentiation rests on alkaline scale and cost claims, but export fit and adaptability remain risks
        blocks:
          - type: paragraph
            body: >
              LONGi's differentiation is currently framed around alkaline scale, cost, and manufacturability rather than
              around a differentiated PEM architecture or a visible software ecosystem. Company and project materials
              emphasize lower DC power consumption, larger single-slot form factors, modular gas-liquid separation, and
              industrial use cases such as hydrogen metallurgy. Independent sources, however, put important boundaries
              around that advantage. H2TECH says Chinese electrolyzer exporters still face only a modest landed-cost
              advantage once freight and tariffs are considered, and it notes that China's alkaline focus narrows some
              export-market fit. Asia Times, republishing DSET analysis, goes further and argues that Chinese
              electrolyzer scale has also produced overcapacity, low-efficiency risk, and limited adaptability in
              demanding operating conditions. That makes the investable question less about whether LONGi can ship
              alkaline hardware at scale and more about whether it can prove durable performance, standards compliance,
              and service quality across diverse international duty cycles.
