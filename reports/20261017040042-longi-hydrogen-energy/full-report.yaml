  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Offer is centered on large alkaline hardware and packaged industrial solutions
        blocks:
          - type: paragraph
            body: >
              The current public product surface describes LONGi Hydrogen as a builder of large-scale alkaline
              electrolyzer equipment and packaged industrial hydrogen systems, not a PEM specialist or software-first
              platform. The official product pages define two anchor offers: a base alkaline water electrolytic bath
              with up to 1,500 Nm³/h single-unit output, and the ALK Hi1 system with lower advertised power consumption,
              broader load range, and a 4-in-1 gas-liquid separation module. The 2023 annual report extends that story
              from brochure features to product-line expansion, stating that LONGi launched the industry's first 3,000
              Nm³/h single-slot alkaline electrolyzer and paired it with "green power + green hydrogen" solutions for
              refining, ammonia synthesis, and metallurgy. External market-positioning evidence is directionally
              supportive but lighter-weight: Blackridge Research places LONGi among the largest electrolyzer
              manufacturers and lists 5,000 MW of current production capacity, which is useful context but not an
              audited benchmark.
            claimRefs:
