      - number: '1.2'
        title: Ownership, capital support, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The ownership and financing trail points to a business that is still governed through LONGi's parent
              infrastructure rather than disclosed like an independent venture-backed company. In 2022, LONGi guaranteed
              a RMB 500 million comprehensive credit line for LONGi Hydrogen Energy and Wuxi LONGi Hydrogen with China
              CITIC Bank Xi'an Branch, while the same disclosure said Huizhi Gongying held 8.14% of LONGi Hydrogen
              Energy and was linked to named LONGi executives and directors. In 2023, the parent said it executed a
              non-proportional capital increase into LONGi Hydrogen Energy and separately bought minority equity through
              Xi'an LONGi Green Energy Investment. Those facts support a parent-controlled-subsidiary reading, but they
              still leave valuation, post-2023 cap-table detail, and a current standalone board roster unresolved.
            claimRefs:
              - CO004
              - CO005
