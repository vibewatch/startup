      - number: '4.2'
        title: Cost structure and public unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics evidence is better on customer-side cost drivers than on LONGi Hydrogen's own
              margins. Management said electricity makes up 70% to 80% of hydrogen production cost, which is why the
              company emphasizes lower power consumption and larger-form-factor alkaline systems. Official and
              annual-report materials together place ALK Hi1 direct current consumption in roughly the 4.0-4.3 kWh/Nm³
              band and position the larger ALK G configuration as reducing single-cost CAPEX by about 20% versus two
              smaller units. Those efficiency claims matter, because independent 2025-2026 market reporting still shows
              Chinese electrolysers competing mostly on installed-cost advantage rather than on premium realized
              pricing, with export benchmark ranges materially below non-Chinese systems but still vulnerable to
              freight, tariffs, and adaptation costs.
