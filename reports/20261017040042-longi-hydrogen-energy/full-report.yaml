      - number: '3.3'
        title: The strongest pricing advantage is Chinese alkaline manufacturing as a class, not vendor-specific transparency
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is still weak at the individual-vendor level, but the class signal is clear:
              Chinese alkaline systems have a lower estimated installed-cost range than non-Chinese systems outside
              China, although freight, tariffs, local standards, and system scope narrow the comparison. LONGi benefits
              from that class advantage, yet the same evidence also implies the advantage is shareable with Peric,
              Sungrow, and other Chinese manufacturers. Public proof of overseas reach exists but remains early: LONGi
              can point to Central Asia and a January 2026 shipment of one 5MW system to Europe, while global incumbents
              still show stronger disclosed international orderbook depth.
