  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Demand is concentrated in project-scale industrial buyers
        blocks:
          - type: paragraph
            body: >
              The evidence points to a concentrated buyer universe rather than a broad, repeatable customer base. LONGi
              markets alkaline electrolysis systems to chemicals, metallurgy, transportation, energy, and power users,
              while independent market evidence says disclosed early-mover offtake is led by chemicals, especially
              ammonia, followed by e-fuels and refining. The most credible buyer archetype is therefore a state-owned or
              large industrial project sponsor procuring an engineered hydrogen-production system for a defined plant.
              The expo profile broadens that positioning to global strategic partners, but it is company-supplied
              marketing and does not establish active customers, payer identities, or revenue mix by segment.
