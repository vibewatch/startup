    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The strongest public identity signal is structural rather than promotional. LONGi said it began
              hydrogen-value-chain research in 2018 and officially established LONGi Hydrogen Energy Technology Co.,
              Ltd. on 2021-03-31 alongside its first equipment manufacturing plant in Wuxi. The 2022 LONGi annual report
              then defined LONGi Hydrogen as Xi'an LONGi Hydrogen Technology Co., Ltd. and Wuxi Hydrogen as its wholly
              owned subsidiary, which gives later chapters a workable entity map even though this source set does not
              cleanly disclose a standalone headquarters line. The operating picture is clear enough to ground the rest
              of the report: LONGi Hydrogen is an alkaline-electrolyzer and systems supplier inside the wider LONGi
              group, with manufacturing and project-delivery evidence but still limited stand-alone disclosure. 
