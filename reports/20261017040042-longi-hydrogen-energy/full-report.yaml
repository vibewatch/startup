            body: >
              The assigned evidence identifies two Chinese project references with customer or sponsor names: Jilin
              Electric Power's Da'an project and Sinopec Star's Kuche project. Da'an provides the clearest procurement
              denominator because LONGi disclosed 15 of 39 alkaline systems, or 38.5% of that tender. Kuche is supported
              by two company-controlled publications that describe both the award and shipment, but neither provides
              operating outcomes. The 2024 export disclosure is less decision-useful because European counterparties,
              order values, delivery dates, commissioning status, and customer outcomes are omitted. The table is
