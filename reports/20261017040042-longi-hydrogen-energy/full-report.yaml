            title: Real deployment proof exists beyond brochure copy
            body: >
              Public evidence goes beyond marketing pages: the 2023 annual report describes a 3,000 Nm³/h single-slot
              launch, SMM documents a one-year industrial demonstration, and a separate SMM article reports a first 5MW
              European shipment with named compliance standards.
            calloutType: strength
            claimRefs:
