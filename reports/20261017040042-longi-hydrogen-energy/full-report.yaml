  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk stack
        blocks:
          - type: paragraph
            body: |-
              The highest residual risk is not that LONGi Hydrogen lacks manufacturing ambition; it is that the
              company is scaling into a market where Chinese electrolyzer capacity already appears to exceed
              near-term demand, creating price-war conditions before durable overseas economics are proven.
              LONGi's 2023 filing itself acknowledges technical risk, cost pressure, and uncertain green-hydrogen
              demand, while independent coverage describes price competition and expected sector consolidation.
              That makes LONGi Hydrogen's company-reported 2023 scale and the 2025 plan for an Inner Mongolia
              line strategically useful but financially double-edged: more capacity can improve cost position, yet
              it also raises the threshold for utilization, order conversion, and disciplined pricing. The export
              option does not remove this pressure because freight, tariffs, and adaptation narrow the reported
              installed-cost advantage outside China.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR008
