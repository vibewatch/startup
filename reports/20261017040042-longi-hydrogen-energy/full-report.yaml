      - number: '6.4'
        title: Durability and concentration remain the central customer diligence gaps
        blocks:
          - type: paragraph
            body: >
              No retained source reports gross or net revenue retention, churn, renewal cadence, repeat orders, contract
              duration, customer count, backlog aging, or top-customer concentration. That absence matters because
              independent sources describe a difficult demand environment: premium green-hydrogen offtake remains hard
              to secure, Chinese manufacturing capacity has outpaced demand, and broader deployment is constrained by
              cost, infrastructure readiness, regulation, and limited multiyear operating evidence. LONGi's tender wins
              and export milestones demonstrate access to projects, but they do not prove durable account economics.
              Underwriting should therefore require a customer-level contract and operating-data room rather than
              extrapolating retention from bid wins or manufacturing scale.
            claimRefs:
