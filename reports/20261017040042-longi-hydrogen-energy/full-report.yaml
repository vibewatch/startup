      - number: '2.3'
        title: >-
          Adoption drivers are policy, industrial decarbonization, and certification; constraints are cost, offtake, and
          export friction
        blocks:
          - type: paragraph
            body: >-
              The best evidence for adoption is not retail enthusiasm but the combination of Chinese policy support,
              heavy-industry decarbonization demand, and larger project sizes. H2Tech cited IEA and Hydrogen Council
              data showing China has become the leading market for installed or FID electrolyzer capacity and
              manufacturing scale, while VNZ documented that 200MW-plus projects already represented 42% of 2024
              deliveries and 70% of firm orders. But the same sources flag the gating constraints: premium green
              hydrogen still struggles to secure offtakers, China's low-carbon hydrogen price remains above
              grey-hydrogen economics, and Chinese exporters face target-market limits from alkaline technology fit,
              tariffs, standards, and explicit sourcing restrictions in Europe. LONGi's January 2026 European shipment
              is therefore meaningful as a standards-validation proof point, not yet as proof of durable export volume.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: What public evidence still cannot size
        blocks:
          - type: paragraph
            body: >-
              Public sources still stop short of a clean LONGi-specific SAM or SOM. The annual reports and market
              studies show production-capacity build-out, reference projects, and industry-wide supply-demand imbalance,
              but they do not disclose current utilization, backlog quality, conversion from bid wins into shipped
              revenue, or a segmented split between China and export demand that can be tied directly to LONGi's
              installed base. That matters because the same market can look attractive at the project level and
              unattractive at the supplier margin level if price pressure and underused factories dominate. For
              valuation work, the missing proof is not another generic hydrogen CAGR; it is customer-level demand
              conversion and evidence that certified exports can compound beyond isolated lighthouse projects.
            claimRefs:
              - CM002
              - CM003
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: China is the right market center, but not yet a cleared profit pool
            body: >-
              China's delivery share, installed/FID share, and large-project concentration show where alkaline
              electrolyzer demand is maturing first, but supplier economics are still constrained by weak offtake
              conversion and capacity oversupply.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
          - type: callout
            title: Europe validates standards, not yet repeatable export volume
            body: >-
              LONGi's January 2026 Europe shipment matters because it shows certification and localization readiness,
              but one 5MW public reference is still evidence of market entry rather than evidence of broad export
              adoption.
            calloutType: risk
            claimRefs:
