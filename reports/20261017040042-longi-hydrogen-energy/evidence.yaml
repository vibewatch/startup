  - type: missing-source
    severity: material
    topic: standalone-metrics
    missingEvidence: Current standalone revenue, gross margin, cash, backlog, customer count, and headcount for LONGi Hydrogen Energy.
    whyItMatters: >-
      These are the cover metrics most likely to change the investment case, but the assigned source pack never
      discloses them directly.
    diligencePath: >-
      Request current management reporting or audited subsidiary financials and reconcile them to parent-company segment
      disclosures.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      A current standalone board roster, exact headquarters disclosure, and post-2023 cap table for LONGi Hydrogen
      Energy.
    whyItMatters: >-
      Without current governance and ownership detail, it is difficult to assess control rights, key-person dependence,
      and decision-making autonomy.
    diligencePath: Obtain subsidiary registration extracts, board resolutions, and the latest cap-table or shareholder register.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A current standalone valuation or priced external financing benchmark after the 2023 parent recapitalization.
    whyItMatters: >-
      The chapter can document capital support, but not what public or private investors would currently pay for the
      business as a separate asset.
    diligencePath: >-
      Request the latest financing materials, fairness work, or internal valuation marks tied specifically to LONGi
      Hydrogen rather than the parent.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: longi-specific-sam-som
    missingEvidence: >-
      Public segmentation of LONGi's served market by domestic versus export demand, end-use vertical, and contract
      stage.
    whyItMatters: >-
      Without a company-specific segmentation cut, public market statistics cannot be converted into a defensible LONGi
      SAM or SOM for valuation work.
    diligencePath: >-
      Request management or investor materials that break backlog and pipeline by geography, end market, and signed
      contract status.
