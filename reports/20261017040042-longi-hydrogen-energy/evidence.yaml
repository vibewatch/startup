    keyQuote: >-
      The cost of domestically produced electrolysers in the US and Europe continued to rise in 2025, allowing Chinese
      manufacturers to compete in some cases. However, China’s cost advantage remains relatively small when taking into
      account freight and tariffs, according to the IEA. Based on IEA analysis of the market in 2024, the cost of
      installing a Chinese electrolyser outside China was $1,500–2,400/kW, compared with $2,000–2,600/kW for a
      non-Chinese electrolyser. China’s focus on alkaline technologies, rather than proton-exchange-membrane versions,
      also limits its target market outside of China.
    canonical: SO006
