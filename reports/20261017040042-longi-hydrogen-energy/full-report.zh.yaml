  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 出口订单转化为复购；经审计的子公司数据体现健康的利润转化；行业整合淘汰较弱竞争者。
        - 这可能足以支撑为战略稀缺性付费，但前提是扎实的财务数据和运行时间证明取代叙事性期权。
        - 贸易摩擦、客户爬坡延迟，以及放量后利润率仍被侵蚀。
        - 独立客户背书、经审计的 2025/2026 年财务数据，以及更多欧洲或中东订单。
      - - 基准
        - 母公司支持延续，国内需求仍真实存在，LONGi 保持技术相关性，但价格仍具竞争性，披露仍不完整。
        - 将其视为期权，而非溢价复利资产；要求有纪律的入场条款，或相对头部叙事打折。
        - 已获项目转为盈利运营的速度缓慢；治理或优先权包袱仍不清晰。
        - 订单流喜忧参半、出口进展有限，且仍未披露第三方估值锚点。
      - - 悲观
        - 产能过剩与运营表现不佳占据主导；客户推迟采用；业务依赖母公司支持的时间超出预期。
        - 避免支付增长溢价；只有困境价或保护性很强的结构才能补偿风险。
        - 下轮融资或优先权重置、利用率低，以及出口市场的标准或关税壁垒。
        - 更多运营转化率低、价格战行为或项目执行停滞的证据。
    notes: 这些情景仅作定性判断，因为所分配公开证据未披露当前外部估值、经审计的子公司现金流状况或完整股权表条款。
