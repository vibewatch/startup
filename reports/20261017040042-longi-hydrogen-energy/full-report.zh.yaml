      - number: '3.4'
        title: 公开资料显示，该业务已形成商业化与项目交付基础，但独立经营、财务质量、客户持续性及出口执行仍存在披露缺口。涉及：Moat、PEM。
        blocks:
          - type: paragraph
            body: >-
              反向证据很重要，因为它削弱了仅凭规模规划建立的溢价叙事。独立来源称，中国电解槽制造产能已超过近期需求，因而更可能带来价格压力和行业整合，而不是持久的稀缺租金。相同来源还指出，当买方需要 PEM
              灵活性，或需要符合当地监管和运行条件的出口标准时，中国出口商仍受限制。实际而言，LONGi 的护城河是有条件的：它足以支持在中国大型 AWE
              招标中保持竞争力，却仍暴露于国内商品化，以及海外由技术和标准驱动的替代；除非其合规能力和应用深度能比同行更快提升。
            claimRefs:
              - CP009
              - CP011
