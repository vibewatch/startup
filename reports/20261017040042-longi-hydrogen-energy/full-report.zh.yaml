      - number: '2.2'
        title: 规模与产能过剩同时显现
        blocks:
          - type: paragraph
            body: >-
              公开市场口径足以支持严肃尽调，但不足以直接得出“超大 TAM”的结论。VNZ 称，全球电解槽交付量在 2024 年达到 3.2GW，累计装机超过 6GW；其中中国交付量为 1.44GW，并以 2.8GW 的
              2025 年第一季度确定订单领先。与此同时，GGII 估计中国截至 2023 年底已建成 38GW 名义电解槽产能，2025 年可能超过 65GW；S&P Global 则称，2024 年制造产能达到
              39GW/年，而前 10 个月招标量只有 693MW。可投资结论是：市场真实存在，但短期供应商经济性取决于产能利用率和订单转化，而不是制造名义产能本身。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
