  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在计入可见缓释措施后，按影响与可能性评估剩余风险严重度，而不是按风险提及次数排序。
    data:
      columns:
        - label: 可能性极低
        - label: 可能性低
        - label: 可能性中等
        - label: 可能性偏高
        - label: 可能性高
        - label: 可能性极高
      rows:
        - label: 高影响
          values:
            - null
            - null
            - label: 诉讼 / 事故可见性缺口
              tone: medium
              note: 公开材料未能厘清氢能子公司的产品责任或事故历史。
            - null
            - label: 出口准入挤压
              tone: high
              note: 运费、关税、标准和适配可能压缩海外项目经济性。
            - label: 产能过剩 / 价格压缩陷阱
              tone: high
              note: 在出口复购得到证明前，行业价格战可能压缩利润率。
        - label: 中影响
          values:
            - label: 站点级 EHS 证据缺口
              tone: low
              note: 集团有相关系统，但当前氢能站点的许可和审计证据有限。
            - null
            - label: 母公司资金 / 治理依赖
              tone: medium
              note: 在独立现金创造能力显现前，母公司贷款审批和关联方联系仍然重要。
            - label: 变负荷适配
              tone: medium
              note: 行业可比案例显示，间歇性输入下存在运行范围和效率风险。
            - label: 新增产能爬坡未达到利用率
              tone: high
              note: 内蒙古扩张增加了期权价值，但利用率数据未公开。
            - null
        - label: 较低影响
          values:
            - label: 补贴与 IPO 窗口波动
              tone: low
              note: 资本仍在，但政策或退出市场走弱会收窄融资选择。
            - null
            - null
            - null
            - null
            - null
    approximationNotes: 单元格位置是定性且基于证据的判断；不是违约概率模型或量化损失分布结果。
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 母公司支持和改善中的商业化很重要，但执行与估值证明仍落后于叙事。
    data:
      nodes:
        - id: parent-support
          label: 母公司支持的融资
          detail: 2022 年贷款安排加上 2023 年 RMB500m 增资，降低短期生存风险。
          tone: positive
        - id: cost-umbrella
          label: 中国成本保护伞
          detail: 中国系统的定价仍低于许多非中国替代品，中国仍是规模中心。
          tone: positive
        - id: traction
          label: 真实商业化
          detail: 2023 年营收 >RMB100m、已建产能 2.5GW、有名有姓的项目，以及首批欧洲发货。
          tone: positive
        - id: execution-risk
          label: 执行质量仍不均衡
          detail: 运营转化率低和利用率不足的证据表明，规模尚不等于持久的经济性。
          tone: risk
        - id: price-discipline
          label: 无公开价格锚点
          detail: 当前来源池仍缺少最新外部估值、完整条款和经审计的独立财务数据。
          tone: warning
        - id: recommendation
          label: 建议：继续研究
          detail: 在将溢价结果纳入投资判断前，等待经审计的证明或实质性更优的入场条款。
          tone: warning
      edges:
        - from: parent-support
          to: cost-umbrella
          label: 支持规模
        - from: cost-umbrella
          to: traction
          label: 助力赢得项目
        - from: traction
          to: execution-risk
          label: 仍需验证
        - from: execution-risk
          to: price-discipline
          label: 压低信心
        - from: price-discipline
          to: recommendation
          label: 设定入场门槛
    claimRefs:
      - CV002
      - CV008
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
