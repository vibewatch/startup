              产能，并成为中国碱性电解槽中标量最大的企业。产品规格指向工业规模，第三方追踪机构也将 Longi 列入多个长期氢能项目。最新出口证据来自公司自身、尚未经独立验证，但 2026 年 1 月发往欧洲的 5MW
              碱性系统仍说明商业化已超越国内愿景。
            claimRefs:
