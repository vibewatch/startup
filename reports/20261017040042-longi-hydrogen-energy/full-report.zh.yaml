      - number: '1.2'
        title: 所有权、资本支持与治理透明度
        blocks:
          - type: paragraph
            body: >-
              所有权和融资轨迹表明，这家公司仍由 LONGi 的母公司体系治理，而不是像独立风险投资公司那样披露。2022 年，LONGi 为 LONGi Hydrogen Energy 和 Wuxi LONGi
              Hydrogen 向 China CITIC Bank Xi'an Branch 申请的 RMB 500 million 综合授信提供担保；同一披露称，Huizhi Gongying 持有 LONGi
              Hydrogen Energy 8.14% 股权，并与多名 LONGi 高管及董事有关联。2023 年，母公司称其对 LONGi Hydrogen Energy 实施了非同比例增资，并通过 Xi'an LONGi
              Green Energy Investment 另行收购少数股权。这些事实支持“母公司控制的子公司”判断，但估值、2023 年后的股权结构细节和当前独立董事会名单仍未解决。
