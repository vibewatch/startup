  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: LONGi Hydrogen 的公开财务逻辑从对电价敏感的客户经济性，延伸到交钥匙设备销售、出口交付和项目复购需求；利润转化暴露于产能过剩和性能风险。
    data:
      nodes:
        - id: power-cost
          label: 电力成本
          detail: 电力约占制氢成本的 70% 至 80%
        - id: product-efficiency
          label: 产品效率
          detail: ALK Hi1 公开指标约为 4.0-4.3 kWh/Nm³，ALK G 声称单项 CAPEX 低约 20%
        - id: customer-economics
          label: 客户经济性
          detail: 更低的耗电量和资本开支支撑 LCOH 与项目 IRR
        - id: equipment-sale
          label: 设备销售
          detail: LONGi Hydrogen 2023 年营收超过 RMB 100 million，并领跑中国碱性电解槽投标中标
        - id: delivery-commissioning
          label: 交付与调试
          detail: 乌兹别克斯坦调试和首批欧洲 5MW 发货体现出口执行力
        - id: repeat-demand
          label: 复购需求或挤压
          detail: 成本领先有助于中标，但产能过剩、适配成本和调试风险可能压缩利润率
      edges:
        - from: power-cost
          to: product-efficiency
          label: 客户痛点
        - from: product-efficiency
          to: customer-economics
          label: 更好的项目经济性
        - from: customer-economics
          to: equipment-sale
          label: 转化为投标与订单
        - from: equipment-sale
          to: delivery-commissioning
          label: 收入兑现取决于执行
        - from: delivery-commissioning
          to: repeat-demand
          label: 项目案例背书推动后续项目
    approximationNotes: 本图是方向性的运营桥接，不是量化收入或毛利润瀑布图；所分配证据池未披露合同定价、毛利率或现金转化计算。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI006
      - CI010
      - CI014
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: |
      公开证据将 LONGi Hydrogen 描述为分层碱性系统，范围从电解硬件延伸到控制、辅助系统、出口包装和垂直解决方案。
    data:
      layers:
        - label: 电解槽单元
          detail: 1,500-3,000 Nm³/h 碱性生产核心
          modules:
            - 一级能效定位
            - 200,000 小时寿命声明
          outputs:
            - 制氢
        - label: 分离模块
          detail: 气液分离与占地优化
          modules:
            - 4-in-1 模块，4,000 Nm3/h
            - 节省 20% 占地声明
          outputs:
            - 调节后的工艺流
        - label: 控制层
          detail: 工厂控制与智能运维
          modules:
            - 生产管理
            - DCS 监控
            - PLC 设备管理
          outputs:
            - 链式报警与自动停机
        - label: 电力与辅助系统
          detail: 工业辅助系统集成
          modules:
            - 供电
            - 配电
            - 辅助系统
          outputs:
            - 打包项目系统
        - label: 出口合规包装层
          detail: 海外交付的机械安全与本地化
          modules:
            - CE PED
            - ASME
            - 参考 EIGA 的设计
          outputs:
            - 本地化交付与维护包
        - label: 垂直解决方案包
          detail: 聚焦重工业脱碳的终端市场定位
          modules:
            - 氢冶金
            - 炼化
            - 合成氨
          outputs:
            - 绿电 + 绿氢解决方案
    approximationNotes: |
      这是根据公开披露重构的架构图，不是 P&ID 或软件架构图。
    claimRefs:
      - CE003
      - CE005
      - CE008
      - CE010
      - CE014
  - id: FU001
    title: 项目驱动的客户旅程与缺失的持久性证明
    type: journey-map
    summary: LONGi 披露的旅程从工业用例验证推进到招标与交付，但运营证明和客户账户扩张基本未披露。
    data:
      nodes:
        - id: industrial-need
          label: 工业需求
          detail: 氨、炼化、冶金、能源、电力和交通应用构成目标买家群。
          value: Use-case qualification
        - id: tender
          label: 项目招标
          detail: 大型项目方通过项目专属招标采购工程化电解系统。
          value: Named domestic awards
        - id: award
          label: 系统中标
          detail: Da'an 披露了 39 套碱性系统中的 15 套，Kuche 提供了第二个具名项目案例。
          value: Award proof
        - id: delivery
          label: 设备交付
          detail: 据报道，Kuche 设备于 2022 年发运，首个大型海外项目于 2024 年交付。
          value: Delivery proof
        - id: operations
          label: 运营验证
          detail: 保留证据未披露运行时间、利用率、产氢量、验收和保修结果。
          value: Evidence gap
        - id: expansion
          label: 续约与扩张
          detail: 欧洲订单释放地域扩张信号，但复购订单、续约和留存指标均不可得。
          value: Evidence gap
    approximationNotes: 该顺序反映已披露的采购与交付里程碑；不代表实测转化率、经过的时间或经验证的客户留存。
