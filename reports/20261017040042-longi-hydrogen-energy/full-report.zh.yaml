  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业化
        blocks:
          - type: paragraph
            body: >-
              留存证据表明，LONGi Hydrogen 主要靠碱性电解槽设备销售，以及紧密附着的工艺包、交付和集成服务变现，而不是靠已披露的经常性软件收入或氢气承购收入。LONGi 产品页面强调大型标准化电解槽设备；公司
              2023 年年报称，LONGi Hydrogen 营收超过 RMB 100 million，并在中国碱性电解槽中标中领先。独立项目报道显示，这条商业化路径已经包括出口项目的全系统供货包：乌兹别克斯坦有 4 台
              1000 Nm³/h 电解槽，2026 年初又完成首批 5MW 欧洲发运。因此，收入质量更取决于项目中标、验收里程碑、交付执行和营运资金时点，而不是订阅式经常性收入。
            claimRefs:
