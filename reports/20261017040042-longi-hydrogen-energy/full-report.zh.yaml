      - number: '2.3'
        title: 采用驱动因素是政策、工业脱碳与认证；约束来自成本、承购和出口摩擦
        blocks:
          - type: paragraph
            body: >-
              最有力的采用证据不是零售端热情，而是中国政策支持、重工业脱碳需求和项目规模扩大共同作用。H2Tech 引用 IEA 与 Hydrogen Council 数据称，中国已在电解槽装机或 FID
              容量及制造规模上成为领先市场；VNZ 记录显示，200MW 以上项目已占 2024 年交付量的 42% 和确定订单的
              70%。但同一批来源也指出了关键约束：高价绿氢仍难找到承购方，中国低碳氢价格仍高于灰氢经济性；中国出口商还会受到碱性技术适配、关税、标准以及欧洲明确采购限制的影响。因此，LONGi 于 2026 年 1
              月发往欧洲的货物，是标准验证的有意义证明点，但还不能证明出口量具备持续性。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 公开证据仍无法测算的部分
        blocks:
          - type: paragraph
            body: >-
              公开来源仍无法给出干净的 LONGi 专属 SAM 或 SOM。年报和市场研究显示了产能扩张、参考项目以及全行业供需失衡，但没有披露当前利用率、订单簿质量、从中标到发货收入的转化率，也没有把中国与出口需求按
              LONGi 装机基数直接拆分。这一点很重要：如果价格压力和工厂闲置占主导，同一市场对项目方可能很有吸引力，却未必能给供应商带来好利润。估值真正缺的不是又一个泛氢能
              CAGR，而是客户需求能否转成订单，以及经认证的出口能否摆脱孤立灯塔项目、持续扩大规模的证据。
            claimRefs:
              - CM002
              - CM003
              - CM014
      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 中国是正确的市场中心，但尚未成为已验证的利润池
            body: 中国的交付份额、装机 / FID 份额和大型项目集中度，说明碱性电解槽需求首先在中国成熟；但承购转化疲弱、产能过剩仍在约束供应商经济性。
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
          - type: callout
            title: 欧洲验证了标准，但还没有验证可重复的出口规模
            body: LONGi 2026 年 1 月发往欧洲的货物证明了认证和本地化准备度，但单个 5MW 公开参考项目仍只能证明进入市场，不能证明出口已广泛采用。
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 公开资料显示，该业务已形成商业化与项目交付基础，但独立经营、财务质量、客户持续性及出口执行仍存在披露缺口。涉及：LONGi。
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，竞争格局是分层的，而不是一组单一的对手。在全球 incumbent 层，Thyssenkrupp Nucera 和 John Cockerill
              仍有最清晰的大型项目交付与订单簿披露；在中国直接碱性电解槽层，LONGi、Peric、Sungrow、Tianjin Mainland
              及其他国内供应商争夺同一轮公用事业级项目。对许多买方而言，现实替代方案不是某个专有的 incumbent 堆栈，而是一个有多家供应商可以可信投标的中国 AWE 采购市场。因此，LONGi
              的公开证据支持其市场相关性，却不足以证明其拥有品类独占地位，或能明显避免同行替代。
            claimRefs:
