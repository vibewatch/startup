      - number: '1.3'
        title: 商业里程碑与风险背景
        blocks:
          - type: paragraph
            body: >-
              从商业角度看，公开证据已超出内部规划：LONGi Hydrogen 被列为乌兹别克斯坦绿氢项目的唯一氢能设备供应商；HydrogenPro 在 2026 年表示，与 LONGI 达成的战略 OEM 协议使其可使用
              1 GW
              制造产能。这是有意义的外部验证，但它发生在一个成本有优势、同时也明显过热的中国电解槽市场中。独立报道既强调中国的价格优势和制造主导地位，也提示产能过剩、行业整合以及部分中国碱性系统在效率和适应性上的问题。实际结论是：LONGi
              Hydrogen 已具备真实商业活动并开始国际化，但其规模化仍依赖国内市场；国内竞争可以带来销量，却也会压缩经济性、提高执行风险。
            claimRefs:
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代性支出
        blocks:
          - type: paragraph
            body: >-
              LONGi
              的公开定位指向一个相对明确的市场边界，而不是泛泛的“氢能经济”说法。其氢能业务聚焦工业脱碳场景，目标是降低单位制氢成本，覆盖煤化工、石化、炼化、合成氨、氢冶金、交通和与电力相关的能源系统。就本章而言，可服务支出包括电解槽系统、工艺包集成、本地化与认证工作，以及帮助工业客户在现场或专用项目中制氢的“绿电
              + 绿氢”工程；下游氨厂、可再生能源发电资产所有权、氢气分销基础设施，以及 LONGi 当前碱性技术差异化较弱的 PEM 主导场景，则不能自动计入。
            claimRefs:
              - CM001
              - CM003
              - CM014
              - CM016
