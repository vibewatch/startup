            body: >-
              最强的公开身份信号来自公司结构，而不是宣传口径。LONGi 称其于 2018 年开始研究氢能价值链，并于 2021-03-31 正式设立 LONGi Hydrogen Energy Technology Co.,
              Ltd.，同时在无锡建设首座设备制造工厂。LONGi 2022 年年报随后将 LONGi Hydrogen 定义为 Xi'an LONGi Hydrogen Technology Co., Ltd.，并将
