      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              指定来源集没有披露 LONGi Hydrogen 的独立现金、消耗、资金续航、债务或项目融资义务，因此最好的公开融资信号仍来自母公司支持。LONGi Green Energy 2023
              年年报称，母公司年末资产负债率为 56.87%，计息负债率为 11.62%，现金储备足以维持稳定运营。这降低了氢能子公司近期资金枯竭的担忧，但不等同于子公司层面的流动性。同时，管理层此前提出的 5GW
              产能路线图、新出口认证和海外一体化交付，都意味着在投资者判断硬件毛利率能否扩张、还是会被行业过剩挤压之前，公司仍需持续投入制造规模、本地化、质保支持和营运资金。
