      - number: '3.2'
        title: 公开资料显示，该业务已形成商业化与项目交付基础，但独立经营、财务质量、客户持续性及出口执行仍存在披露缺口。涉及：LONGi。
        blocks:
          - type: paragraph
            body: >-
              LONGi 的官方材料一贯将其定位为碱性设备供应商，并试图向模块化系统、项目集成和运营服务上移一层。相较于单纯的电解槽堆或撬装设备销售，这在买方需要压缩 EPC
              复杂度、赶上项目节点时具有实际区别。证据也显示，LONGi
              获得了授信和贷款额度等明确的母公司支持，即便产品性能相近，这也可能影响投标竞争力。但公开记录没有显示硬性的锁定机制：买方似乎可以在多家中国碱性供应商之间多源采购，留存来源也没有提供能证明异常高转换成本的客户合同证据。
