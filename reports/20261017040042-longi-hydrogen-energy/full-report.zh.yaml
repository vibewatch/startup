              - CV015
      - number: '8.3'
        title: 估值为何仍可能令人失望
        blocks:
          - type: paragraph
            body: >-
              中国制造商仍受成本优势保护，但多家独立来源也描述了产能超过实际需求、行业可能整合的市场。投资者拥有的不是装机名义产能，而是实际利用率、利润率和现金转化的持久性。一份来源称，目前只有 43%
              的已交付电解槽在运行；另一份称，中国标志性的 Kuqa 项目因碱性系统难以适应波动性可再生能源输入，运行水平远低于装机容量。因此，很难把规模当作部署质量和经济性已经去风险来付费。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 情景框架与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求证明，LONGi
              的母公司支持和国内中标领先地位能够转化为经独立验证的出口经济性、重复订单和可审计的子公司财务表现。基准情景是公司保持战略相关性、继续赢得项目并受益于中国成本定位，但仍缺少支持完整行业领先溢价的数字。悲观情景是产能过剩、装置运行不佳以及贸易或标准摩擦，把公司变成利润率较低、需要母公司持续支持的制造选项。最快的改进路径是提供当前经审计的收入、毛利率、订单转化、股权结构条款和独立验证的项目运行时间证据。
            claimRefs:
              - CV002
