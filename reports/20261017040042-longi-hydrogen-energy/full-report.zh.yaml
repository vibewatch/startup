      - number: '4.2'
        title: 成本结构与公开单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              公开单位经济性证据更多反映客户侧成本驱动因素，而不是 LONGi Hydrogen 自身利润率。管理层称，电力占制氢成本的 70% 至
              80%，因此公司强调更低的耗电量和更大规格的碱性系统。官方材料与年报合并来看，ALK Hi1 的直流耗电量约为 4.0-4.3 kWh/Nm³；更大型的 ALK G 配置则主张，相比两台较小设备，可将单项成本
              CAPEX 降低约 20%。这些效率主张很重要，因为 2025-2026
              年独立市场报道仍显示，中国电解槽主要依靠装机成本优势竞争，而非获取溢价价格；出口基准区间虽然明显低于非中国系统，却仍容易受到运费、关税和适配成本侵蚀。
