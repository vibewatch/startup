      - number: '3.3'
        title: 公开资料显示，该业务已形成商业化与项目交付基础，但独立经营、财务质量、客户持续性及出口执行仍存在披露缺口。
        blocks:
          - type: paragraph
            body: >-
              单一厂商层面的公开定价透明度仍然很弱，但品类信号很清楚：中国碱性系统在中国以外的估算装机成本区间低于非中国系统，只是运费、关税、当地标准和系统范围会缩小差距。LONGi 受益于这一品类优势，但同一证据也意味着
              Peric、Sungrow 及其他中国制造商可以共享该优势。海外触达已有公开证明，但仍处于早期：LONGi 可以指向中亚项目以及 2026 年 1 月向欧洲发运的一套 5MW 系统；相比之下，全球
              incumbent 的已披露国际订单簿深度仍更强。
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP011
              - CP012
