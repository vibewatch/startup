company:
  name: LONGi Hydrogen Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a hardware-and-integration revenue model with real
    project traction, improving electrolyzer efficiency, and clear Chinese cost
    advantages in export markets. Underwriting still stalls on the same missing
    private-company disclosures as the prior refresh: no standalone revenue
    trajectory, gross margin, backlog conversion, cash burn, or contract-level
    realization data are public in the assigned evidence pool.
sections:
  - id: revenue-model
    title: Revenue model and commercialization
    body: >-
      The retained evidence points to LONGi Hydrogen monetizing primarily through
      alkaline electrolyzer equipment sales and closely attached balance-of-plant,
      delivery, and integration services rather than through a disclosed recurring
      software or hydrogen-offtake revenue stream. LONGi's product page frames the
      offer around large standardized electrolyzer equipment, while the company's
      2023 annual report says LONGi Hydrogen exceeded RMB 100 million of turnover
      and led China in winning alkaline-electrolyzer bids. Independent project
      coverage shows that this commercialization path already includes full-system
      supply packages for export projects, with four 1000 Nm³/h electrolyzers in
      Uzbekistan and a first 5MW Europe shipment in early 2026. That combination
      makes revenue quality more tied to project wins, acceptance milestones,
      delivery execution, and working-capital timing than to subscription-like
      recurring revenue.
    claimRefs: [CI001, CI004, CI013, CI014, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: cost-structure
    title: Cost structure and public unit-economics proxies
    body: >-
      Public unit-economics evidence is better on customer-side cost drivers than
      on LONGi Hydrogen's own margins. Management said electricity makes up 70% to
      80% of hydrogen production cost, which is why the company emphasizes lower
      power consumption and larger-form-factor alkaline systems. Official and
      annual-report materials together place ALK Hi1 direct current consumption in
      roughly the 4.0-4.3 kWh/Nm³ band and position the larger ALK G configuration
      as reducing single-cost CAPEX by about 20% versus two smaller units. Those
      efficiency claims matter, because independent 2025-2026 market reporting
      still shows Chinese electrolysers competing mostly on installed-cost
      advantage rather than on premium realized pricing, with export benchmark
      ranges materially below non-Chinese systems but still vulnerable to freight,
      tariffs, and adaptation costs.
    claimRefs: [CI002, CI003, CI006, CI008, CI009]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependence
    body: >-
      The assigned pool does not disclose LONGi Hydrogen's standalone cash, burn,
      runway, debt, or project-finance obligations, so the best public financing
      signal remains parent-level support. LONGi Green Energy's 2023 annual report
      says the parent ended the year with a 56.87% liability-to-asset ratio, an
      11.62% interest-bearing liability ratio, and cash reserves it described as
      sufficient for stable operation. That lowers immediate concern that the
      hydrogen subsidiary is capital-starved, but it is not equivalent to
      subsidiary-level liquidity. Meanwhile, management's earlier roadmap to 5GW
      capacity, new export certifications, and integrated overseas deliveries all
      imply continued spending on manufacturing scale, localization, warranty
      support, and working capital before investors can judge whether hardware
      gross margins expand or get compressed by industry overcapacity.
    claimRefs: [CI005, CI010, CI015, CI016]
  - id: verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The financial verdict is directionally positive on revenue mechanism and
      market positioning but incomplete for underwriting. LONGi Hydrogen has
      crossed from concept into commercial equipment shipments, won public bids,
      and competes in a Chinese supply chain that independent sources still view as
      the global cost leader. But public evidence also shows the same risks that
      can break margin translation from that scale: sector overcapacity, price
      competition, export adaptation costs, and a delivered-to-operational gap in
      the wider electrolyzer market. Without audited standalone revenue, backlog,
      customer concentration, realized ASPs, gross margin, and cash-burn data, the
      chapter can support a commercialization thesis but not a clean underwrite of
      revenue quality, margin path, or next-round capital needs.
    claimRefs: [CI004, CI008, CI010, CI011, CI012, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Electrolyzer equipment sales
        - Standardized alkaline electrolyzer systems sold into industrial green-hydrogen projects
        - MW or Nm³/h system
        - 1,200Nm3/h-3,000Nm3/h standardized ALK G range; 3,000 Nm³/h single-slot product launched
        - Supported by official product and annual-report disclosures; realized ASPs still undisclosed
        - Provide contract ASPs, acceptance milestones, warranty reserve assumptions, and cancellation rights
      - - Integrated balance-of-plant package
        - Power supply, control, gas-liquid separation, purification, and localization services sold with core equipment
        - Project package
        - Public export projects include integrated system scope in Uzbekistan and Europe
        - Good evidence for bundled scope, weak evidence for revenue split between hardware and services
        - Break out equipment, commissioning, localization, and after-sales revenue mix by project
      - - Overseas project delivery
        - Export shipment and commissioning for green-hydrogen and green-ammonia projects
        - Project / shipment
        - Uzbekistan commissioning and first Europe 5MW shipment show export commercialization
        - Valid traction signal, but backlog conversion and payment timing are still private
        - Disclose booked backlog, deposits, milestone billing schedule, and DSO by export project
      - - Bid-led domestic commercialization
        - Bid wins convert into turnkey alkaline-electrolyzer contracts for industrial customers
        - Bid / project
        - 2023 turnover exceeded RMB 100 million and LONGi Hydrogen led alkaline-electrolyzer bid wins in China
        - Public traction exists, but revenue concentration and repeat-rate evidence are missing
        - Share top customers, repeat-order rate, and bid-to-revenue conversion history
    notes: >-
      Public evidence supports hardware-plus-integration monetization; it does not
      disclose contract terms, revenue-recognition milestones, or realized gross
      margins, so "current value / status" mixes reported commercial traction with
      unanswered diligence asks.
    claimRefs: [CI001, CI004, CI013, CI014, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Item
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Chinese electrolyzer export benchmark
        - US$1,500-2,400 per kW installed outside China
        - Independent market benchmark, not a disclosed LONGi list price
        - Freight, tariffs, scope, and on-site adaptation can narrow the apparent cost gap
        - H2TECH; Green Building Africa
      - - Non-Chinese comparator benchmark
        - US$2,000-2,600 per kW installed
        - Comparator benchmark only
        - Does not reveal LONGi realized pricing or whether integration services are bundled
        - H2TECH
      - - Customer hydrogen production cost driver
        - Electricity equals about 70% to 80% of total hydrogen production cost
        - Management operating-cost statement, not a selling price
        - Depends on power sourcing, utilization, and site design
        - TaiyangNews interview
      - - Long-term green-hydrogen cost aspiration
        - Approximately US$2.00 per kilogram within 5 to 10 years
        - Management aspiration rather than current realized economics
        - Management also said subsidies are still required, so present-day realization is unsupported
        - TaiyangNews interview
    notes: >-
      The assigned pool does not contain LONGi's direct public list pricing or
      realized customer contract pricing, so this table uses retained installed-cost
      benchmarks and management cost statements as the closest public monetization
      proxies rather than presenting them as booked revenue.
    claimRefs: [CI006, CI007, CI008]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Direct current power consumption for ALK Hi1
        - 4.0-4.3 kWh/Nm³
        - High
        - Lower electricity use attacks the largest customer-side OPEX bucket and improves LCOH
        - Provide guaranteed performance curves by load range and degradation assumptions
      - - ALK G single-cost CAPEX delta
        - About 20% lower versus two 1,000 Nm3/h systems
        - Medium
        - Larger unit economics can support better project IRRs and win rates
        - Provide third-party validated installed-cost comparisons and balance-of-plant assumptions
      - - ALK G footprint delta
        - 30% footprint saving versus two 1,000 Nm3/h systems
        - Medium
        - Lower footprint can reduce site-preparation and balance-of-plant costs
        - Provide reference layouts and site-level cost impact
      - - Wider market delivered-to-operational conversion
        - 43% of delivered electrolysers currently operational
        - Medium
        - Commissioning slippage can defer revenue recognition, performance proof, and referenceability
        - Provide LONGi-specific commissioning, acceptance, and uptime data
      - - Standalone gross margin / cash burn
        - null
        - Low
        - This is the core missing input for underwriting manufacturing economics and runway
        - Provide audited subsidiary gross margin, EBITDA, operating cash flow, and cash balance
    notes: >-
      "null" means the assigned public evidence pool does not disclose the metric.
      Public unit-economics evidence is much stronger on customer cost drivers and
      product-efficiency claims than on LONGi Hydrogen's own standalone margin or
      burn profile.
    claimRefs: [CI002, CI003, CI006, CI011]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      LONGi Hydrogen's public financial logic runs from electricity-sensitive
      customer economics to turnkey equipment sales, export delivery, and repeat
      project demand, with margin translation exposed to overcapacity and
      performance risk.
    data:
      nodes:
        - id: power-cost
          label: Power cost
          detail: Electricity is about 70% to 80% of hydrogen production cost
        - id: product-efficiency
          label: Product efficiency
          detail: ALK Hi1 is publicly placed at roughly 4.0-4.3 kWh/Nm³ and ALK G claims ~20% lower single-cost CAPEX
        - id: customer-economics
          label: Customer economics
          detail: Lower power use and capex support LCOH and project IRR
        - id: equipment-sale
          label: Equipment sale
          detail: LONGi Hydrogen exceeded RMB 100 million turnover in 2023 and led China alkaline-electrolyzer bid wins
        - id: delivery-commissioning
          label: Delivery and commissioning
          detail: Uzbekistan commissioning and first Europe 5MW shipment show export execution
        - id: repeat-demand
          label: Repeat demand or squeeze
          detail: Cost leadership helps wins, but overcapacity, adaptation costs, and commissioning risk can compress margins
      edges:
        - from: power-cost
          to: product-efficiency
          label: Customer pain point
        - from: product-efficiency
          to: customer-economics
          label: Better project economics
        - from: customer-economics
          to: equipment-sale
          label: Converts into bids and orders
        - from: equipment-sale
          to: delivery-commissioning
          label: Revenue realization depends on execution
        - from: delivery-commissioning
          to: repeat-demand
          label: Referenceability drives next projects
    approximationNotes: >-
      This figure is a directional operating bridge, not a quantified revenue or
      gross-profit waterfall; the assigned evidence pool does not disclose contract
      pricing, gross margin, or cash-conversion math.
    claimRefs: [CI002, CI003, CI004, CI006, CI010, CI014, CI016]
callouts:
  - calloutType: insight
    title: Hardware-heavy monetization is clear
    body: >-
      Public disclosures consistently describe standardized electrolyzer hardware
      plus attached system integration and delivery work, which is enough to
      identify the revenue mechanism even though pricing realization and margin
      details remain private.
    claimRefs: [CI001, CI004, CI014]
  - calloutType: risk
    title: Parent liquidity does not equal subsidiary runway
    body: >-
      Parent-company balance-sheet support reduces near-term financing anxiety, but
      the underwriting gap remains the same because no retained public source
      discloses LONGi Hydrogen's own cash balance, burn rate, debt stack, or
      working-capital intensity.
    claimRefs: [CI010, CI015]
