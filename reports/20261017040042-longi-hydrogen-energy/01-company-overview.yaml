company:
  name: "LONGi Hydrogen Energy"
chapter:
  number: 1
  title: "Company Overview"
  summary: "LONGi Hydrogen Energy is a parent-controlled hydrogen-equipment subsidiary that LONGi formally stood up in 2021 after beginning hydrogen-chain research in 2018. Public evidence shows real manufacturing, export, and partner milestones plus repeated parent capital support, but the current source set still does not disclose a standalone valuation, revenue, customer count, headcount, or full board roster."
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and operating footprint"
    body: "The strongest public identity signal is structural rather than promotional. LONGi said it began hydrogen-value-chain research in 2018 and officially established LONGi Hydrogen Energy Technology Co., Ltd. on 2021-03-31 alongside its first equipment manufacturing plant in Wuxi. The 2022 LONGi annual report then defined LONGi Hydrogen as Xi'an LONGi Hydrogen Technology Co., Ltd. and Wuxi Hydrogen as its wholly owned subsidiary, which gives later chapters a workable entity map even though this source set does not cleanly disclose a standalone headquarters line. The operating picture is clear enough to ground the rest of the report: LONGi Hydrogen is an alkaline-electrolyzer and systems supplier inside the wider LONGi group, with manufacturing and project-delivery evidence but still limited stand-alone disclosure. "
    claimRefs: [CO001, CO002, CO003, CO010, CO015, CO016]
    tableRefs: [TO001, TO002]
    figureRefs: [FO001]
  - id: "ownership-capital-and-governance"
    title: "Ownership, capital support, and governance visibility"
    body: "The ownership and financing trail points to a business that is still governed through LONGi's parent infrastructure rather than disclosed like an independent venture-backed company. In 2022, LONGi guaranteed a RMB 500 million comprehensive credit line for LONGi Hydrogen Energy and Wuxi LONGi Hydrogen with China CITIC Bank Xi'an Branch, while the same disclosure said Huizhi Gongying held 8.14% of LONGi Hydrogen Energy and was linked to named LONGi executives and directors. In 2023, the parent said it executed a non-proportional capital increase into LONGi Hydrogen Energy and separately bought minority equity through Xi'an LONGi Green Energy Investment. Those facts support a parent-controlled-subsidiary reading, but they still leave valuation, post-2023 cap-table detail, and a current standalone board roster unresolved."
    claimRefs: [CO004, CO005, CO006, CO007, CO010]
    tableRefs: [TO003]
  - id: "commercial-milestones-and-risk-context"
    title: "Commercial milestones and risk context"
    body: "Commercially, the chapter can point to more than internal ambition. LONGi Hydrogen is cited as the sole hydrogen-equipment supplier on the Uzbekistan green-hydrogen project, and HydrogenPro said in 2026 that a strategic OEM agreement with LONGI gave it access to 1 GW of manufacturing capacity. That is meaningful external validation, but it sits inside a Chinese electrolyzer market that multiple independent sources describe as both cost-advantaged and overheated. Independent reporting highlights China's pricing edge and manufacturing dominance, yet it also flags overcapacity, expected consolidation, and efficiency or adaptability concerns for some Chinese alkaline systems. The practical takeaway is that LONGi Hydrogen appears commercially real and internationally active, but it is scaling from a home market whose competitive pressure can help volume while compressing economics and increasing execution risk."
    claimRefs: [CO008, CO009, CO011, CO012, CO013, CO014]
