      - Budget owner
      - Adoption trigger
    rows:
      - [Refining and coal/petrochemical hydrogen, Industrial plant owner, Operations and engineering teams, Project sponsor, Replace or green an existing hydrogen input, Plant-level capex owner, Compliance and decarbonization pressure plus hydrogen-cost reduction]
      - [Green ammonia or methanol project, Hydrogen-project developer, Project delivery and offtake teams, Platform developer or sponsor, Build electrolysis upstream of ammonia or methanol synthesis, Central project sponsor, Ability to secure long-term offtake and low-cost renewable power]
      - [Hydrogen metallurgy, Steel or metallurgy operator, Process engineering team, Industrial operator, Add green hydrogen into heavy-industry decarbonization workflow, Industrial decarbonization budget owner, Proven large-scale project economics and reliability]
      - [Export-certified EPC or industrial project, Overseas customer and technical team, Site operations and maintenance team, Project developer or EPC-led buyer, Import certified system and integrate locally, Program or project owner, Compliance with CE/PED/ASME requirements and reduced integration risk]
    notes: Buyer, payer, and budget-owner roles are synthesized from disclosed project types, supplier references, and industrial-hydrogen workflows; public sources do not provide a named procurement decision tree for each segment.
    claimRefs: [CM003, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Commercialization lens from global electrolyzer activity to LONGi's current position
    type: pyramid
    summary: Mixed lenses show a real market with strong China concentration, but they also show why LONGi still needs utilization proof rather than another generic TAM claim.
    data:
      items:
        - label: Global deliveries
          displayValue: 3.2GW in 2024
          detail: VNZ said worldwide delivered electrolyzers reached 3.2GW and cumulative installed capacity exceeded 6GW.
          claimRefs: [CM007]
        - label: China delivered market
          displayValue: 1.44GW in 2024
          detail: China absorbed nearly half of all 2024 delivered volume.
          claimRefs: [CM008]
        - label: China firm orders
          displayValue: 2.8GW by Q1 2025
          detail: China led the concentrated five-country orderbook that represented 75% of global firm orders.
          claimRefs: [CM009]
        - label: Installed or FID share
          displayValue: 65% global share
          detail: H2Tech cited IEA data showing China accounts for 65% of installed or FID electrolyzer capacity.
          claimRefs: [CM010]
        - label: China manufacturing base
          displayValue: 39GW/year in 2024
          detail: S&P Global contrasted 39GW/year of manufacturing capacity with only 693MW of tenders in the first 10 months.
          claimRefs: [CM004]
        - label: LONGi disclosed capacity
          displayValue: 2.5GW by end-2023
          detail: LONGi's 2023 annual report said the subsidiary had built 2.5GW of production capacity.
          claimRefs: [CM002]
    approximationNotes: Layers mix deliveries, orderbook, installed/FID share, and supplier capacity to show commercialization depth; they are not additive and should not be read as a mathematical TAM/SAM/SOM funnel.
    claimRefs: [CM002, CM004, CM007, CM008, CM009, CM010]
callouts:
  - calloutType: insight
    title: China is the right market center, but not yet a cleared profit pool
    body: China's delivery share, installed/FID share, and large-project concentration show where alkaline electrolyzer demand is maturing first, but supplier economics are still constrained by weak offtake conversion and capacity oversupply.
    claimRefs: [CM004, CM007, CM008, CM010, CM011, CM013]
  - calloutType: risk
    title: Europe validates standards, not yet repeatable export volume
    body: LONGi's January 2026 Europe shipment matters because it shows certification and localization readiness, but one 5MW public reference is still evidence of market entry rather than evidence of broad export adoption.
    claimRefs: [CM011, CM014]
