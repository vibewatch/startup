  - id: TM001
    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer/payer
      - Relevance
    rows:
      - [Industrial hydrogen for refining and coal/petrochemical uses, Alkaline electrolyzer systems plus balance-of-plant and integration, Downstream refinery assets and commodity feedstock economics, Refinery or industrial project sponsor, Core domestic use case called out in LONGi positioning and project references]
      - [Green ammonia and methanol projects, Electrolyzer stacks and system engineering tied to hydrogen production, Ammonia or methanol plant capex beyond hydrogen production systems, Project developer or ammonia platform sponsor, Relevant because market reports treat ammonia as a near-term offtake anchor]
      - [Hydrogen metallurgy and heavy industry decarbonization, Equipment supply for large industrial hydrogen production lines, Steel plant retrofit economics beyond electrolyzer scope, Metallurgy operator or industrial decarbonization sponsor, Important because VNZ lists Chinese industrial projects that already include LONGi as a supplier]
      - [Export-certified industrial projects, CE/PED/ASME compliant systems and localization support, Merchant hydrogen distribution and fueling infrastructure, Overseas project developer or EPC-led customer, Relevant but still early because public proof is a first 5MW Europe shipment rather than repeat volume]
    notes: Synthesized from LONGi's disclosed end-use positioning, reference projects, and independent market reports; excluded-spend column marks adjacent capex that should not be counted as LONGi addressable equipment revenue.
    claimRefs: [CM001, CM014, CM016]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year/period
      - Geography
      - Value
      - CAGR/status
      - Methodology
      - Confidence/limitation
    rows:
      - [VNZ Insights, "2024", Global, 3.2GW deliveries, Deliveries more than doubled year over year, Delivered electrolyzers to developers worldwide, Useful activity lens but not a revenue TAM for any single supplier]
      - [VNZ Insights, "2024", China, 1.44GW deliveries, Nearly half of global delivered volume, Destination share of delivered systems, Strong demand signal but not equivalent to supplier profitability]
      - [VNZ Insights, "Q1 2025", China and top five countries, 2.8GW China firm orders within 75% concentrated orderbook, Orderbook concentrated in five countries, Firm-order lens rather than installed base or recognized revenue, Good forward indicator but still pre-delivery]
      - [GGII via GaoGong Hydrogen, "End-2023", China, 38GW nominal manufacturing capacity, More than 93% alkaline share, Capacity database including planned capacity completed by end-2023, Supply-side lens only]
      - [GGII via GaoGong Hydrogen, "2025 plan", China, ">65GW planned total capacity", Planned expansion, Vendor capacity-plan aggregation, Expansion intent not equivalent to booked demand]
      - [S&P Global, "2024", China, "39GW/year capacity vs 693MW tenders in first 10 months", Severe shortage of offtakers, Manufacturing-capacity comparison to tender demand, Best public imbalance signal in the assigned pool]
      - [H2Tech citing IEA, "2025/2026 outlook", China/global, "65% of installed-or-FID capacity and nearly 60% of manufacturing capacity", China remains leading manufacturing base, Industry-capacity and policy synthesis, Useful market-share lens but not a LONGi-specific SAM]
    notes: These lenses are intentionally not collapsed into a single TAM because they mix deliveries, orderbooks, manufacturing capacity, and installed/FID share; the comparison is about market depth and bottlenecks, not additive market size.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013]
