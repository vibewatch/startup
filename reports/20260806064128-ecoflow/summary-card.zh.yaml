  topStrengths:
    - EcoFlow 已经不再只是露营电源小众品牌，而是扩成“便携 + 家庭能源”平台，产品覆盖备电、阳台光伏、RV、软件和全屋系统。
    - 零售和直销分布很容易验证：Home Depot、Best Buy、REI、Costco Next 和公司自有渠道，给了许多私营硬件品牌缺少的主流触达和信任面。
    - 创始人-市场匹配看起来真实：Bruce Wang 的电池工程背景和 EcoFlow 的产品宽度，让公司起点更像技术可信故事，而不只是 lifestyle 品牌叙事。
    - 公开用户规模和地域口径——140+ 个国家和地区、5M+ 用户——说明公司已经拿到有意义的全球品牌分布。
  topRisks:
    - 审计收入质量、毛利率、库存周转、质保成本和支持成本仍是私有信息，后期硬件公司的核心承销问题还没解开。
    - Delta Max 2000 召回是最清楚的公开负面运营事件，证明 EcoFlow 已经背上规模化硬件公司的信任、补救和客服负担。
    - 美中关税压力可能同时挤压利润率和零售竞争力，而 EcoFlow 正在更深切入高端家庭能源品类。
    - 治理、股权表权利和上市准备披露稀疏；如果美国 IPO 路径重新活跃，公开市场投资者需要更多材料。
  unresolvedGaps:
    - 2024 年审计财务和当前滚动期财务，包括毛利率、库存、质保计提和经营现金流。
    - 完整融资时间线和股权表，包括优先权、债务或供应链金融，以及任何 IPO 前重组要求。
    - 按主要 SKU 或系统类型拆分的产品系列故障率、客服工单量、召回补救完成度和质保索赔率。
    - 各渠道经济性：直销贡献利润率、零售 sell-through、退货、促销、安装商经济性和地域收入集中度。
    - 留存和扩张指标，包括复购率、软件使用、attach rate，以及从便携入口走向全屋系统的 cohort 韧性。
