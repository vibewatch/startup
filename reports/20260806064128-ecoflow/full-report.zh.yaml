  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: EcoFlow 的客户旅程分成两条：便携产品路径更快，安装型系统路径更慢；购买之后，支持和软件越来越关键。
    data:
      items:
        - label: 认知
          actor: 家庭 / 房车用户 / 房主
          touchpoints:
            - 停电担忧
            - 户外用电需求
            - 节省电费诉求
            - 零售渠道发现
          painpoint: Need affordable, trustworthy backup or energy savings
          opportunity: EcoFlow spans several need states
        - label: 评估
          actor: 买家 + 家庭
          touchpoints:
            - 官方网站
            - 零售比较
            - 阅读评价
          painpoint: Many competing brands and specs
          opportunity: Brand breadth and retailer trust help
        - label: 便携产品购买
          actor: 消费者
          touchpoints:
            - Best Buy / REI / 官网直营
          painpoint: Promo-driven comparisons
          opportunity: Low-friction entry point
        - label: 安装型系统咨询
          actor: 房主
          touchpoints:
            - 安装服务 / 家庭能源页面
          painpoint: Higher ticket and installation complexity
          opportunity: Higher LTV and deeper stickiness
        - label: 使用与监测
          actor: 家庭
          touchpoints:
            - App / 智能面板 / 会员体系
          painpoint: Support quality and learning curve
          opportunity: Daily-use engagement can deepen retention
