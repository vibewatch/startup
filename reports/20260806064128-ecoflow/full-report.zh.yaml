              - CV008
              - CV009
              - CV010
              - CV030
      - number: '8.5'
        title: 建议、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确姿态是继续研究。EcoFlow
              应进入可投资名单，因为业务战略形态有吸引力，市场背景有支撑，品牌也已显得全球化。但仅凭公开证据，还不足以给出高置信度买入，因为太多经济性和剩余风险仍留在私有信息里。新的安全事件、缺少缓释的关税冲击，或没有更好披露就推动公开市场交易，都会击穿投资逻辑。反过来，经审计财务、可靠性指标和软件
              attach 数据可以实质提高信心。在此之前，「公允而非便宜」是可防守立场。因此，任何入场价格都必须补偿披露、毛利质量，以及高端品牌故事能在多大程度上长期复利的不确定性。在披露质量改善前，任何溢价情形都应设上限。
            claimRefs:
