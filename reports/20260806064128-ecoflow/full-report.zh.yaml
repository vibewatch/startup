      - number: '7.5'
        title: 缓释成熟度、剩余暴露与击穿逻辑触发器
        blocks:
          - type: paragraph
            body: >-
              EcoFlow
              能公开证明的缓释措施是局部的，不是决定性的。公司能展示召回应对、保修披露、隐私披露、宽渠道存在和软件牵引的产品策略。尚不能公开证明的是，这些缓释在规模化后是否足够强。因此，最有用的风险输出不只是排序清单，而是一小组可监控的击穿触发器：再次发生大范围安全事件、供应缓释不足时关税压力进一步加剧、已安装系统支持口碑恶化，或在披露没有改善时迈向公开市场。每一项都会直接攻击高端品牌和生态系统投资逻辑。投资者应假设剩余暴露高于营销页面所显示的水平，直到私下可靠性、治理和支持指标补上缺口。在这些数据点私下分享前，下行情景假设应保持保守。
