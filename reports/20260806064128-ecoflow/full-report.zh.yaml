      - number: '2.2'
        title: 规模测算视角与地理楔子
        blocks:
          - type: paragraph
            body: >-
              公开市场数据方向有吸引力，但方法口径混杂。便携电源预测指向一个仍在增长的品类；SEIA、ACP 和其他储能跟踪数据则显示，住宅储能背景比几年前更强。德国是最清晰的特定地理楔子，因为 2024–2025
              年阳台太阳能从小众走向大众讨论，受益于更低摩擦和有吸引力的回本叙事。这并不意味着仅靠德国就能解释 EcoFlow
              的全部故事，但确实意味着欧洲提供了一个实用楔子：便携、储能和软件品类可以在同一个家庭里汇合。对尽调来说，关键不只是品类是否增长，而是 EcoFlow 能反复服务哪些品类，同时不丢定价权，也不压垮服务模型。
