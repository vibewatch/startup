      - number: '6.3'
        title: 留存、满意度与复购
        blocks:
          - type: paragraph
            body: >-
              留存证据是公开客户故事中最弱的一部分。App 和家庭能源栈意味着有日常互动的潜力，EcoCredits 也显示公司希望推动复购。但公开来源没有显示
              NRR、GRR、续约率，甚至没有简单复购百分比。这让投资者只能依赖代理指标：评测新近度、软件界面、会员机制，以及更宽系统可能加深粘性的直觉逻辑。这些代理指标方向有用，但不足以把留存视为已证明。广泛采用本身不能证明复购、盈利性扩张或抵御渠道压力的能力，所以这些区分直接影响客户质量承销。正因为如此，在客户章节里，证据质量至少与收入触达同样重要。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU029
              - CU033
