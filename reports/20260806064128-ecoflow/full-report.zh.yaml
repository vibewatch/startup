    和一支以电池工程为核心的团队打造。公司先靠便携储能电源跑出规模，随后扩到家庭备用电、阳台太阳能、RV、软件和全屋能源编排。公开证据能支撑其真实全球渠道触达和高端性能品牌定位，但还达不到后期承销所需的信息披露深度。
