    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              EcoFlow 对外呈现的身份，是一家 2017
              年从深圳起步的电池工程创业公司，如今已扩展成全球清洁能源硬件与软件品牌。公司不再把自己仅定位为露营供电业务。其直营网页已把产品分成全屋备用电、便携储能电源、家庭能源软件、EV
              充电和商用能源应用。TechCrunch 2018 年和 2022
              年的报道也支持同一演进：从移动电源走向更广的能源独立主张。商业模式看起来混合了面向消费者的直营销售、主流零售分销，以及面向家庭和商业应用、决策门槛更高且以安装为牵引的产品。公开证据还没有证明的是，旧有便携品类与新家庭能源栈之间的内部收入拆分。关键在于，后期硬件公司应该按治理、渠道经济性和服务义务来判断，而不只是看品牌势能或收入叙事。
