      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开定价背景很薄。最硬锚点仍是 TechCrunch 报道的 2022 年独角兽估值。近期 TMTPost 报道称 2024 年收入接近约人民币 70 亿元、美国 IPO 可能募资超过
              $300M，为市场提供了更新背景，但不是干净价格。公司清算优先权层级、股权结构控制和详细融资历史仍没有公开对账。这意味着即便战略故事有吸引力，入场纪律也必须保守。IPO
              选择权有价值，但前提是伴随披露质量跃升。因此，任何入场价格都必须补偿披露、毛利质量，以及高端品牌故事能在多大程度上长期复利的不确定性。在披露质量改善前，任何溢价情形都应设上限。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV022
              - CV035
          - type: table
            tableRef: TV001
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV038
      - number: '8.3'
        title: 牛市、基准与熊市情形框架
        blocks:
          - type: paragraph
            body: >-
              牛市情形假设 EcoFlow
              证明进军家庭能源系统和软件后，业务质量优于便携硬件可比公司所暗示的水平。基准情形假设公司仍是强高端硬件品牌，带有一些生态上行空间，但披露证据不足，无法赢得真正平台倍数。熊市情形假设商品化、关税压力和质量担忧侵蚀定价权，让品类更像促销型设备市场。今天的公开信号最符合基准情形，因为战略上行空间存在，但证据还不足以精确定价。因此，任何入场价格都必须补偿披露、毛利质量，以及高端品牌故事能在多大程度上长期复利的不确定性。在披露质量改善前，任何溢价情形都应设上限。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV031
              - CV034
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV031
          - type: figure
            figureRef: FV003
