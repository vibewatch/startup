              故事更像信号，而不是资产负债表披露。它告诉投资者资本可能重要；但没有告诉投资者资本是用于增长、流动性，还是修复资产负债表。这个区分影响估值和谈判筹码。问题在于，硬件规模如果没有透明毛利率、库存纪律和渠道经济性支撑，即使外部看收入很强，也可能毁掉价值。额外不确定性应被明确计入价格，而不是当作暂时披露不便。
