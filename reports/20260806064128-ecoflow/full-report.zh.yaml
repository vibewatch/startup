              - CR022
      - number: '7.2'
        title: 运营、质量与支持风险
        blocks:
          - type: paragraph
            body: >-
              运营风险不再只是电源能不能工作。资料集显示 EcoFlow
              必须管理固件、召回整改、保修成本、零售商评价质量，以及越来越多的安装复杂度。这一变化重要，因为每一次上移到家庭能源系统，都会抬高支持失误的成本。公开来源没有证明存在广泛可靠性问题，但确实证明公司现在承担着高端硬件和已安装系统供应商的运营义务。没有硬故障率数据，剩余暴露默认较高。投资者应假设剩余暴露高于营销页面所显示的水平，直到私下可靠性、治理和支持指标补上缺口。在这些数据点私下分享前，下行情景假设应保持保守。
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR015
              - CR016
              - CR026
