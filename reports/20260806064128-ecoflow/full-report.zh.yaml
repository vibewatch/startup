      - number: '1.4'
        title: 里程碑、产品拓展与负面历史
        blocks:
          - type: paragraph
            body: >-
              EcoFlow
              的公开时间线同时有品类扩张，也有可见的质量挫折。公司早期叙事围绕便携电源和户外用例；当前公开页面则在旧有便携板块之外，强调全屋备用电、软件定义的家庭能源和商用能源应用。这个拓展支持一个判断：EcoFlow
              希望被按生态系统公司估值，而不是按单一设备品牌估值。主要反向证据是 Delta Max 2000 召回；该事件产生了正式整改计划，并获得更广泛的消费者媒体报道。召回不能证明整个产品组合存在系统性失败，但它说明
              EcoFlow 现在承担的是规模化硬件公司的运营义务，而不是快速增长硬件品牌那种更干净的叙事。关键在于，后期硬件公司应该按治理、渠道经济性和服务义务来判断，而不只是看品牌势能或收入叙事。
