              - CR024
              - CR026
      - number: '7.3'
        title: 伙伴、供应商与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              EcoFlow 的 GTM
              触达既是优势，也是风险。零售伙伴带来发现和信任，也引入退货、促销和货架优先级风险。已安装产品在电工和服务执行上形成第二层依赖。第三层藏在供应链里：公开来源没有列出公司的关键硬件供应商，尽管成本和质量取决于它们。第四层是软件。客户一旦采用智能面板、App
              和优化功能，软件稳定性就会影响硬件价值。这些依赖节点彼此作用，并非孤立存在。投资者应假设剩余暴露高于营销页面所显示的水平，直到私下可靠性、治理和支持指标补上缺口。在这些数据点私下分享前，下行情景假设应保持保守。
