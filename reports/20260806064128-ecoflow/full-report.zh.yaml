  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反命题
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，EcoFlow
              的投资逻辑很直接：一家创始人主导的电池公司已具备真实品牌规模，正试图从高端便携电源升级为更广的消费者能源平台。产品栈宽度，以及便携备用电和住宅储能品类增长，都支持这个战略方向。反命题同样清楚：公司看起来仍更像一个战略上有意思的私有硬件品牌，而不是披露完整、高置信度的平台资产。透明度、召回风险和关税暴露都打断了干净的高端增长叙事。因此，任何入场价格都必须补偿披露、毛利质量，以及高端品牌故事能在多大程度上长期复利的不确定性。在披露质量改善前，任何溢价情形都应设上限。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
