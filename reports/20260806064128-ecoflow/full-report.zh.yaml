      - number: '7.4'
        title: 财务模型与人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              EcoFlow
              作为财务模型仍难承销，因为公开资料集缺少经审计账目、营运资本细节、支持成本披露和股权结构清晰度。这意味着关税、促销和服务复杂度必须被当作未量化的下行通道，而不是干净的行项目。人员风险也由缺失信息塑造：创始人集中度可见，但更广的治理深度不可见。报道中的
              IPO
              选项如果推进，可能解决部分披露缺口，也可能把缺口暴露得更尖锐。对尽调来说，内部指标缺失本身就是风险因素。投资者应假设剩余暴露高于营销页面所显示的水平，直到私下可靠性、治理和支持指标补上缺口。在这些数据点私下分享前，下行情景假设应保持保守。
