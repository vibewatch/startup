      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              EcoFlow
              最有吸引力的客户叙事是一条产品阶梯：便携设备作为入口，家庭能源系统、智能面板和软件随时间抬高客户价值。问题在于，公开证据没有确认这种情况实际发生的频率。渠道宽度是正面因素，但渠道结构未知。全球触达亮眼，但区域收入集中度未知。商业解决方案页面暗示存在专业客户路径，但具名证据较薄。因此，扩张故事是可信的，还没有被证明。广泛采用本身不能证明复购、盈利性扩张或抵御渠道压力的能力，所以这些区分直接影响客户质量承销。正因为如此，在客户章节里，证据质量至少与收入触达同样重要。
