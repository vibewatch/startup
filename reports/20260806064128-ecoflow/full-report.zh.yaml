      - number: '1.3'
        title: 资本基础、规模信号与商业覆盖
        blocks:
          - type: paragraph
            body: >-
              公开资本证据零散，但方向清楚。TechCrunch 记录了 2018 年 $4M 融资，后来又报道 EcoFlow 到 2022 年估值约 $1B。近期 IPO 报道显示，公司可能通过美国上市寻求超过 $300M
              资金，这意味着增长融资需求、流动性目标，或两者兼有。在经营规模上，最强公开数字仍是公司声称的触达指标：500 万以上用户、140 多个国家和地区、1,129 项专利、50 多个全球业务伙伴。TMTPost
              还给出第三方视角：2024 年收入可能接近人民币 70 亿元，但没有经审计的公开损益表，也没有对齐过的历轮融资时间表。分销宽度比财务深度更容易验证，因为 EcoFlow 明显出现在 Home Depot、Best
              Buy、REI、Costco Next 和直营渠道。关键在于，后期硬件公司应该按治理、渠道经济性和服务义务来判断，而不只是看品牌势能或收入叙事。
