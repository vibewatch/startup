              - CV031
      - number: '8.4'
        title: 可比公司集合与估值上限
        blocks:
          - type: paragraph
            body: >-
              可比公司必要，但不完美。Jackery、Bluetti 和 Anker SOLIX 都能帮助框定 EcoFlow 可能落入的结果区间，但没有一家完全匹配，因为它们在全屋深度、品牌传承或公司结构上各不相同。Goal
              Zero 和 OUPES 对下行边界的帮助大于公允价值。可比集合给出的最重要教训不是精确倍数，而是警告：如果没有更强的生态变现证据，主流同业和替代方案会限制 EcoFlow
              能主张的软件平台溢价。因此，任何入场价格都必须补偿披露、毛利质量，以及高端品牌故事能在多大程度上长期复利的不确定性。在披露质量改善前，任何溢价情形都应设上限。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV036
          - type: table
            tableRef: TV004
            claimRefs:
              - CV017
              - CV018
              - CV019
