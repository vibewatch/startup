      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              公开信息里有三项正向驱动最突出：韧性需求、户外 / 移动供电需求，以及更广泛的家庭电气化叙事。EcoFlow
              产品页也越来越强调日常节省和优化，而不只是应急备用电，这说明管理层希望市场奖励反复相关性，而不是一次性的备灾支出。反过来，最大的公开约束是关税、高端定价、安装复杂度和对信任敏感的转化。这些摩擦在高客单价品类里最关键，而
              EcoFlow 很可能想用这些品类扩张估值。换句话说，EcoFlow 的市场机会真实存在，但一旦把资本强度和执行负担算进去，可服务机会会迅速收窄。对尽调来说，关键不只是品类是否增长，而是 EcoFlow
              能反复服务哪些品类，同时不丢定价权，也不压垮服务模型。
            claimRefs:
              - CM014
