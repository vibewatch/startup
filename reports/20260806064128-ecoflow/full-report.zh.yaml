  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类重叠
        blocks:
          - type: paragraph
            body: >-
              分析师如果把 EcoFlow 映射到单一市场，最容易误读。公司自己的品类语言已经横跨便携电源、全屋备用电、家庭能源软件、EV
              充电和商用能源应用。公开证据显示，更合适的框架不是「一个电池市场」，而是一组重叠的消费者能源品类，由韧性和节省电费这一待完成任务串联。便携电源仍是最清晰的旧有品类，但家庭储能和德国式阳台太阳能也重要，因为它们抬高客单价，并增强日常使用相关性。市场边界仍应排除公用事业级储能和大多数重工业
              BESS，因为 EcoFlow 的公开产品集仍以消费者和轻商用为主。对尽调来说，关键不只是品类是否增长，而是 EcoFlow 能反复服务哪些品类，同时不丢定价权，也不压垮服务模型。
