        - 估值和风险测算的核心
        - 财务团队 / IPO 准备材料
      - - 股权结构表和优先股堆叠
        - 融资轮条款、持股比例、清算优先权
        - 决定真实入场价格和稀释风险
        - 法务 / 公司秘书
      - - 产品系列可靠性指标
        - 故障率、保修索赔、召回历史
        - 区分一次性事件和系统性质量风险
        - 运营 / 质量
      - - 渠道经济性
        - 各渠道终端动销、退货、促销支出
        - 判断零售规模是否创造价值
        - 销售财务
      - - 软件与生态附加销售
        - App MAU、面板附加销售、复购模式
        - 验证平台护城河主张
        - 产品 / 增长分析
    notes: 这些尽调问题，是把公开信息接到私有证据、从战略兴趣走向定价信念的最低门槛。
    claimRefs:
      - CV030
      - CV008
      - CV009
      - CV011
