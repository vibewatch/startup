      - number: '1.5'
        title: 关键判断与证据缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据下置信度最高的判断是，EcoFlow
              已经脱离小众状态：其渠道宽度、全球用户声称和生态营销都指向一家有规模的国际业务。第二个判断是创始人-市场匹配真实存在，并仍是核心。最大未解问题是典型后期私有公司缺口：当前员工数、经审计收入质量、确切融资历史、治理结构，以及从便携设备转向已安装家庭能源系统的经济性。就尽调而言，公司概览文件可以支撑「拥有可信硬件根基的重要全球清洁科技品牌」这一观点，但还不能支撑「完全透明的后期发行人」观点。关键在于，后期硬件公司应该按治理、渠道经济性和服务义务来判断，而不只是看品牌势能或收入叙事。
