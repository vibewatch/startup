      - number: '4.2'
        title: GTM 路径、渠道经济性与规模信号
        blocks:
          - type: paragraph
            body: >-
              EcoFlow 看起来采用混合打法。便携产品可以像消费电子一样通过零售和直营网页流转，而更大的系统很可能需要更长的顾问式路径。公司的零售宽度是真实规模信号，报道的 2024
              年收入水平和公司声称的用户足迹也是如此。但这些本身都不能证明 GTM 效率。缺失的一层是实际渠道经济性：终端动销、分渠道 CAC、退货和 attach
              rate。没有这些，规模只能被视为商业上亮眼、经济性尚未验证。问题在于，硬件规模如果没有透明毛利率、库存纪律和渠道经济性支撑，即使外部看收入很强，也可能毁掉价值。额外不确定性应被明确计入价格，而不是当作暂时披露不便。
