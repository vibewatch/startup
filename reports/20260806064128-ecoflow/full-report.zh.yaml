  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、直接同业与替代方案
        blocks:
          - type: paragraph
            body: >-
              EcoFlow 的竞争集合比简单列出电池品牌更宽。Jackery、Bluetti 和 Anker SOLIX 是最相关的直接品牌同业，因为它们在大规格便携备用电上与 EcoFlow
              竞争，也越来越进入可覆盖全屋的系统。Goal Zero 更多是传统户外品牌，OUPES 主要代表低端价格压力。同时，买方也可以用发电机，或传统安装商牵头的太阳能加储能项目，解决同一个韧性需求。这一点重要，因为
              EcoFlow 想同时销售盒装便携系统和更偏顾问式的家庭能源产品，竞争对手有时是另一个电池品牌，有时是通往备用电的完全不同路径。这些取舍决定了，当对手追平单项规格或促销强度后，EcoFlow 能否守住高端定位。
