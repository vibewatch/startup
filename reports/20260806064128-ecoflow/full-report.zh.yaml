      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              EcoFlow
              面对的是多条购买旅程，不是一条。便携产品可以靠零售和直营网页转化，因为买方、用户和付款方往往是同一个家庭或户外爱好者，而且安装负担低。家庭能源产品表现不同：买方通常仍是房主，但购买更接近家装而不是买小工具，对硬件、安装、软件和服务的信任要求更高。阳台太阳能介于两者之间，尤其在欧洲；硬件足够有意义，能节省电费，又足够简单，可以避开屋顶光伏完整
              EPC 负担。这个分层解释了为什么不同产品线的渠道策略重要性不同。对尽调来说，关键不只是品类是否增长，而是 EcoFlow 能反复服务哪些品类，同时不丢定价权，也不压垮服务模型。
