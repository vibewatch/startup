      - number: '6.5'
        title: 客户结论与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              客户结论是，触达和渠道匹配有利，但耐久性不完整。EcoFlow
              显然已有足够客户牵引力，足以在全球范围内重要；零售存在、评测和品类宽度结合起来，也让漏斗顶部可信。尚未证明的是驱动溢价价值的部分：留存、扩张、具名大客户和渠道质量经济性。因此，公司看起来像一个已有规模且真实被采用的消费者能源品牌，但还不是证据完整的客户复利引擎。广泛采用本身不能证明复购、盈利性扩张或抵御渠道压力的能力，所以这些区分直接影响客户质量承销。正因为如此，在客户章节里，证据质量至少与收入触达同样重要。
            claimRefs:
              - CU020
              - CU022
              - CU028
              - CU029
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与上市相关风险
        blocks:
          - type: paragraph
            body: >-
              随着规模扩大，EcoFlow 的公开监管暴露面也变宽。置信度最高的事项是 Delta Max 2000
              召回，因为它出现在美国正式监管行动和二级报道中。隐私和数据处理是第二个暴露面：公司发布了专门隐私页面，这有用，但证据集没有显示深入第三方认证披露。第三个暴露面是上市审查。如果 EcoFlow 推进美国
              IPO，相比当前私有公司标准，其公开透明度负担会显著上升。这些风险单独未必击穿投资逻辑，但合在一起意味着 EcoFlow
              已从产品新奇风险进入受监管品牌风险。投资者应假设剩余暴露高于营销页面所显示的水平，直到私下可靠性、治理和支持指标补上缺口。在这些数据点私下分享前，下行情景假设应保持保守。
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR022
              - CR034
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
