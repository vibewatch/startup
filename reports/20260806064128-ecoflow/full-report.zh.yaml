      - number: '2.5'
        title: 市场吸引力判断与未解缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个有利但并非无限的市场判断。EcoFlow 参与的几个品类确有动能，多品类重叠在战略上也有吸引力，因为同一个品牌可以销售韧性、节省和移动性。但公司真实 SOM
              无法靠公开数据证明，因为缺失变量都在内部：结构、各渠道 ASP、安装吞吐量，以及从入门便携产品转化到更大家庭能源系统的比例。因此，合理尽调姿态是把大市场视为支撑因素，同时在内部数据补上缺口前，把 EcoFlow
              的公司特定份额获取故事视为未证实。对尽调来说，关键不只是品类是否增长，而是 EcoFlow 能反复服务哪些品类，同时不丢定价权，也不压垮服务模型。
