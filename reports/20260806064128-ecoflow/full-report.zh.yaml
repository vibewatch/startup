      - number: '3.2'
        title: 能力、定价与功能趋同
        blocks:
          - type: paragraph
            body: >-
              EcoFlow 最清晰的公开差异化是宽度：快充便携产品、全屋备用电、智能面板、App 控制，以及 PowerStream 等面向欧洲的相邻产品。但对比报道也表明，功能差距不是无限的。Bluetti
              强攻模块化，Anker 强攻品牌化家庭备用电，Jackery 强攻易上手安装。实际结果是，高端品牌正在走向重叠的功能集合，竞争又回到促销、套装和渠道位置上。许多评测者眼里，EcoFlow
              可能仍是性能领先者，但公开证据不支持它垄断产品能力。这些取舍决定了，当对手追平单项规格或促销强度后，EcoFlow 能否守住高端定位。
