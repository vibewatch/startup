evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count with legal-entity scope and geography split.
    whyItMatters: Headcount is a common proxy for cost base, hiring intensity, and operating complexity.
    diligencePath: Request an HRIS export or investor deck KPI page covering total headcount and major geographies.
    relatedQuestionRefs:
      - QO011
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, board rights, and investor ownership percentages.
    whyItMatters: Without governance detail, later-stage control risk and preference-stack economics cannot be assessed.
    diligencePath: Request the latest cap table, board observer schedule, and shareholders agreement summary.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: A reconciled lifetime funding table including debt, credit facilities, and any supply-chain finance.
    whyItMatters: Valuation context and IPO readiness depend on knowing how much capital has already gone in and under what terms.
    diligencePath: >-
      Request a financing chronology that reconciles equity, debt, and structured facilities to the latest balance
      sheet.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: leadership-roster
    missingEvidence: A complete executive roster and board map beyond the founder-centric public profile.
    whyItMatters: Leadership quality and governance cannot be underwritten from partial founder-facing evidence alone.
    diligencePath: Request an executive roster, board list, and committee structure.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-rights
    missingEvidence: A reconciled cap table, board rights schedule, and investor control map for the stakeholder set in the chapter.
    whyItMatters: The investor and stakeholder map is only partial without ownership percentages, rights, and debt overlays.
    diligencePath: Request the latest cap table, shareholder agreements, and board-consent matrix.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: full-milestone-log
    missingEvidence: A comprehensive financing, product, and governance timeline rather than a curated milestone sample.
    whyItMatters: >-
      The milestone table is decision-useful, but it cannot establish a complete chronology for diligence without
      omissions risk.
    diligencePath: Request management chronology materials and board-approved financing history.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: Internal channel mix, install conversion, and geographic revenue splits by product family.
    whyItMatters: >-
      Without internal mix and conversion data, TAM/SAM/SOM remains a qualitative exercise instead of a financeable
      market bridge.
    diligencePath: >-
      Request a by-region, by-product revenue mix plus conversion funnel from portable entry products into home-energy
      systems.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: minor
    topic: powerstream-revenue
    missingEvidence: Specific Europe revenue contribution from PowerStream and related balcony-solar bundles.
    whyItMatters: Europe could be strategically important, but public evidence does not quantify its contribution.
    diligencePath: Request Europe revenue, margin, and attach-rate data for PowerStream and related storage products.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Sell-through, return rates, and MDF economics by major retailer and direct channel.
    whyItMatters: Competitive retail presence is useful only if it translates into efficient sell-through and acceptable returns.
    diligencePath: Request SKU-level sell-through, return rates, and gross margin by retailer and direct web.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: software-attach
    missingEvidence: Attach rates and engagement for smart-panel, app, and ecosystem products.
    whyItMatters: The moat case depends on proving EcoFlow is more than a hardware brand.
    diligencePath: Request attach, MAU, and repeat-purchase metrics for ecosystem products.
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Current cash balance, burn, and runway.
    whyItMatters: Capital adequacy cannot be judged responsibly without cash and burn data.
    diligencePath: Request latest management accounts or financing memo.
    relatedQuestionRefs:
      - QI011
      - QI012
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by channel, returns, service cost, and attach rates.
    whyItMatters: These metrics are essential to determine whether EcoFlow is a premium business or only a premium-priced one.
    diligencePath: Request audited margin schedules, return data, and cohort attach metrics.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: product-reliability
    missingEvidence: Failure rates, warranty claims, and return rates by major product family.
    whyItMatters: >-
      Installed systems and premium portable products are only as strong as their field reliability and service cost
      profile.
    diligencePath: Request product-family reliability dashboards and warranty-cost reports.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: software-engagement
    missingEvidence: Attach and engagement metrics for OASIS, app control, and smart-panel usage.
    whyItMatters: The system-level moat depends on users actually engaging with the software layer.
    diligencePath: Request MAU, feature usage, and attach rates for core software-linked products.
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Cohort retention, repeat purchase, renewal, and attach-rate data.
    whyItMatters: Customer value cannot be underwritten cleanly without durability metrics.
    diligencePath: Request cohort tables by entry product and by channel.
    relatedQuestionRefs:
      - QU025
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: Named enterprise, professional, or large-install customer case studies with quantified outcomes.
    whyItMatters: Without stronger named proof, commercial and business-customer optionality stays speculative.
    diligencePath: Request top-customer case studies and top-channel revenue concentration.
    relatedQuestionRefs:
      - QU026
    relatedTableRefs:
      - TU003
      - TU005
  - type: private-evidence-only
    severity: material
    topic: quality-metrics
    missingEvidence: Product-family failure rates, warranty-claim ratios, and support cost per installed system.
    whyItMatters: Residual risk cannot be scored confidently without knowing how often products fail and how expensive support is.
    diligencePath: Request reliability dashboards by product family and geography.
    relatedQuestionRefs:
      - QR026
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: governance-and-capital
    missingEvidence: Detailed board, cap-table, and liquidity needs information tied to any potential listing path.
    whyItMatters: People risk and capital-risk judgments remain partly speculative without governance and financing detail.
    diligencePath: Request board roster, shareholder rights summary, and IPO-preparation materials.
    relatedQuestionRefs:
      - QR021
    relatedTableRefs:
      - TR004
  - type: private-evidence-only
    severity: material
    topic: regulatory-coverage-gap
    missingEvidence: A jurisdiction-by-jurisdiction register for safety, installation, privacy, and public-listing exposure.
    whyItMatters: >-
      The public risk register is intentionally partial and cannot substitute for a full compliance map across EcoFlow's
      active markets.
    diligencePath: Request the internal compliance register and outside-counsel issue tracker.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited revenue quality, gross margin by product / channel, and support-cost structure.
    whyItMatters: Without unit economics, scenario weighting and entry pricing remain approximate rather than investable.
    diligencePath: Request audited financial statements plus channel and product-family margin schedules.
    relatedQuestionRefs:
      - QV026
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current ownership, preference stack, and liquidation rights.
    whyItMatters: A private-company valuation cannot be judged cleanly without knowing who gets paid first and how dilution works.
    diligencePath: Request full cap table and latest shareholder-rights summary.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV004
