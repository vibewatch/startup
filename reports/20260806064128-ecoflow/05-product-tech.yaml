company:
  name: EcoFlow
chapter:
  number: 5
  title: Product & Technology
  summary: EcoFlow has evolved into a multi-layer product company spanning portable stations, whole-home backup, RV systems, balcony solar, home-energy software, and EV charging. The technology and moat case is strongest when these modules are sold together and controlled through app / panel / optimization layers, but public evidence remains thinner on reliability metrics, field failure rates, and software engagement than on product breadth. The chapter verdict is therefore positive on architecture ambition and medium-confidence on execution quality.
sections:
- id: portfolio-definition
  title: Product definition, modules, and use cases
  body: EcoFlow’s public product map now spans far beyond a single portable battery line. DELTA Pro 3 still represents the company’s portable heritage, but DELTA Pro Ultra, Smart Home Panel 2, OCEAN-branded home products, PowerStream, Power Kits, and WAVE 2 show an ambition to cover the household, RV, balcony-solar, and smart-living workflow. The practical implication is that EcoFlow should be thought of as a multi-module energy-product company, not as a narrow portable-power vendor. The risk is that this wider portfolio demands more install coordination, support depth, and quality control than a pure boxed-hardware strategy. The investment case therefore depends on whether this architecture remains differentiated after installation, service, and software complexity are fully counted. That makes implementation quality just as important as the headline specification sheet.
  claimRefs:
