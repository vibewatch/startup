- id: deployment-and-support
  title: Deployment, integration, reliability, and support
  body: EcoFlow’s workflow now splits into two very different businesses. Portable products can still convert as consumer-electronics purchases, while whole-home systems increasingly resemble home-improvement projects that depend on electrical integration and after-sales support. Power Kits sit somewhere in the middle for RV and off-grid builds, and PowerStream sits in the low-friction middle ground for distributed generation. Public review surfaces make clear that support and installation quality are now part of the product verdict because the product is no longer just a box. The Delta Max 2000 recall reinforces the same point from a safety angle. The investment case therefore depends on whether this architecture remains differentiated after installation, service, and software complexity are fully counted. That makes implementation quality just as important as the headline specification sheet.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE020
  - CE021
  - CE022
  - CE032
  tableRefs:
  - TE004
- id: differentiation
  title: Differentiation, IP, and strategic direction
  body: 'EcoFlow’s strongest differentiation case is integrated breadth: portable heritage plus home-energy ambition, combined with app control, panel control, and Europe-specific distributed generation options. The patent count and X-Core language support the story, but they do not by themselves prove defensibility. What public evidence does support is that EcoFlow is trying to create a system-level brand where the parts reinforce each other. That can produce a better moat than a one-off battery box, but only if users actually adopt the software, buy adjacent products, and stay satisfied with service quality. The investment case therefore depends on whether this architecture remains differentiated after installation, service, and software complexity are fully counted. That makes implementation quality just as important as the headline specification sheet.'
  claimRefs:
  - CE024
  - CE025
  - CE029
  - CE030
  - CE031
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-and-gaps
  title: Trust, safety, privacy, and open gaps
  body: Public trust controls are visible but incomplete. EcoFlow publishes privacy and warranty surfaces and has shown recall-response behavior, which is better than no disclosure at all. But the source set does not provide a strong reliability dashboard, field failure rates, or product-family warranty-claim ratios. That is a meaningful diligence gap precisely because the company is moving into more installed and always-on products. The current technology verdict is therefore positive on breadth and ambition, but medium-confidence on operational execution because the critical failure-rate data remains private. The investment case therefore depends on whether this architecture remains differentiated after installation, service, and software complexity are fully counted. That makes implementation quality just as important as the headline specification sheet.
  claimRefs:
  - CE018
  - CE019
  - CE023
  - CE028
  - CE034
  - CE036
