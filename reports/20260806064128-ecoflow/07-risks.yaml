- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Product safety / trust
    - Second broad recall or widening of current recall
    - New major recall in core product family
    - Treat as thesis-break until root-cause and financial impact are known
  - - Tariff / margin pressure
    - Further tariff escalation or failed sourcing mitigation
    - Material cost increase not offset by price or sourcing
    - Re-underwrite margin and US growth assumptions
  - - Support / installation burden
    - Sustained negative review trend on installed systems
    - Visible deterioration in support reputation or installer issues
    - Reduce confidence in whole-home expansion thesis
  - - IPO / disclosure gap
    - Formal listing steps without stronger public transparency
    - Public filing still leaves major quality / governance gaps
    - Avoid valuation uplift for public-market optionality
  - - Software-value thesis
    - No evidence of app / optimization attach or engagement
    - Software remains marketing story only
    - Treat ecosystem moat as weak
  notes: These are monitorable public triggers designed to turn a broad risk map into actionable diligence checkpoints.
