- id: final-judgment
  title: Recommendation, exit readiness, and final diligence asks
  body: The correct public-evidence posture is research-more. EcoFlow belongs on an investable list because the strategic shape of the business is attractive, the market backdrop is supportive, and the brand already looks global. It does not yet deserve a conviction buy from public evidence because too much of the economics and residual risk remains private. A fresh safety event, a tariff shock without mitigation, or a public-market push without better disclosure would all break the thesis. Conversely, audited financials, reliability metrics, and software attach data could raise conviction materially. Until then, fair rather than cheap is the defensible stance. Any entry price therefore must compensate for uncertainty around disclosure, margin quality, and how much of the premium brand story can actually compound over time. Any premium case should therefore remain capped until disclosure quality improves.
  claimRefs:
