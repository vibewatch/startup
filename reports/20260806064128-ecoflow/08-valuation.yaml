  - - 'Anti-thesis: public economics are too opaque for tight pricing'
    - Audited financials, product-family margin, and support-cost disclosure
  - - 'Anti-thesis: recall and tariff risk can erode premium pricing'
    - Evidence of durable quality control and sourcing mitigation
  notes: The anti-thesis is driven more by transparency and execution risk than by lack of market demand.
