  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - EcoFlow proves software attach, home-energy mix expansion, and no repeat quality event
    - Multiple expands above simple hardware peer set
    - Execution complexity, tariffs, service cost
    - Would need audited evidence of premium economics
  - - Base
    - EcoFlow remains a strong premium hardware brand with some ecosystem upside
    - Valuation anchored near fair hardware-plus-brand multiple
    - Margin pressure and limited disclosure
    - Most consistent with current evidence
  - - Bear
    - Category commoditizes while tariffs and quality concerns compress price and trust
    - Multiple contracts toward lower hardware-peer range
    - Repeat recall, weak support, no software moat
    - Would be supported by worsening public adverse signals
  notes: Scenario logic is directional because public evidence cannot support a precise discounted-cash-flow or public-comps model.
