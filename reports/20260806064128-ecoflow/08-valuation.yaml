- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Repeat broad safety event
    - Second major recall or widening core-product issue
    - Breaks premium trust story
    - Move to avoid
  - - Tariff shock without mitigation
    - Material cost step-up with no sourcing response
    - Undercuts margin and price competitiveness
    - Demand higher discount or step back
  - - Public listing without better disclosure
    - Formal listing step but still weak economics transparency
    - Breaks optionality-to-quality bridge
    - Avoid paying IPO premium
  - - Software remains marketing only
    - No evidence of attach or daily-use value
    - Weakens ecosystem-moat thesis
    - Value as hardware brand only
  - - Channel weakness
    - Major retail deterioration or return issues
    - Breaks scale-quality linkage
    - Re-underwrite growth and margin assumptions
  notes: Kill triggers are designed to keep the thesis anchored to public monitorables rather than to broad sector optimism.
  claimRefs:
  - CV027
  - CV028
  - CV029
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financials
    - Income statement, margin, working capital, cash profile
    - Core to valuation and risk underwriting
    - Finance team / IPO prep materials
  - - Cap table and preference stack
    - Round terms, ownership, liquidation preferences
    - Determines real entry price and dilution risk
    - Legal / corporate secretary
  - - Product-family reliability metrics
    - Failure rates, warranty claims, recall history
    - Separates one-off event from systemic quality risk
    - Operations / quality
  - - Channel economics
    - Sell-through, returns, promo spend by channel
    - Shows whether retail scale is value-accretive
    - Sales finance
  - - Software and ecosystem attach
    - App MAU, panel attach, repeat purchase patterns
    - Tests platform-moat claim
    - Product / growth analytics
  notes: These asks are the minimum public-to-private bridge needed to move from strategic interest to priced conviction.
