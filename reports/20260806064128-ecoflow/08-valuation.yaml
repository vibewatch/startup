  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / status
  - Why relevant
  - Limitation
  - Implication
  rows:
  - - Jackery
    - Premium portable-power peer
    - Contests similar household backup budgets
    - Not a full smart-home ecosystem analog
    - Caps upside multiple for portable-only economics
  - - Bluetti
    - Modular home-backup peer
    - Closer whole-home and expandable-system overlap
    - Private and portfolio mix differs
    - Useful for feature-breadth benchmarking
  - - Anker SOLIX
    - Mainstream electronics + backup peer
    - Shows consumer-electronics brand can contest whole-home backup
    - Corporate structure and cross-subsidy differ
    - Puts pressure on premium-brand assumptions
  - - Goal Zero / OUPES
    - Legacy or budget reference points
    - Frame outdoor and low-end boundaries
    - Not strong whole-home analogs
    - Useful as downside / ceiling references
  - - EcoFlow 2022 mark
    - Historical internal valuation anchor
    - Only direct public mark in source set
    - Stale and not freshly arm’s length for 2026
    - Starting point, not today’s price
  notes: Comparable work is a sanity-check exercise here, not a precise pricing model.
