  topStrengths:
    - >-
      EcoFlow has moved beyond a niche camping-power identity into a broader portable-plus-home-energy platform with
      visible products across backup, balcony solar, RV, software, and whole-home systems.
    - >-
      Retail and direct distribution are easy to verify: Home Depot, Best Buy, REI, Costco Next, and the company's own
      channels provide mainstream reach and trust surfaces that many private hardware brands lack.
    - >-
      Founder-market fit appears genuine: Bruce Wang's battery-engineering background and EcoFlow's product breadth
      support a technically credible origin story rather than a pure lifestyle-brand narrative.
    - >-
      Public user-scale and geography claims — 5M+ users across 140+ countries and regions — suggest the company has
      already achieved meaningful global brand distribution.
  topRisks:
    - >-
      Audited revenue quality, gross margin, inventory turns, warranty cost, and support cost remain private, so the
      core underwriting question for a late-stage hardware company is still unresolved.
    - >-
      The Delta Max 2000 recall is the clearest public adverse operating event and proves EcoFlow now carries the trust,
      remediation, and support burden of a scaled hardware company.
    - >-
      US-China tariff pressure can compress margin or retail competitiveness at the same time EcoFlow is trying to
      expand deeper into premium home-energy categories.
    - >-
      Governance, cap-table rights, and listing-readiness disclosures are sparse relative to what public-market
      investors would require if a US IPO path becomes active.
  unresolvedGaps:
    - >-
      Audited 2024 and trailing current-period financial statements, including gross margin, inventory, warranty
      accruals, and operating cash flow.
    - >-
      Full funding chronology and cap table, including preference rights, debt or supply-chain finance, and any pre-IPO
      restructuring requirements.
    - >-
      Product-family failure rates, support-ticket volumes, recall remediation completion, and warranty-claim ratios by
      major SKU or system type.
    - >-
      Channel economics by route to market: direct contribution margin, retail sell-through, returns, promotions,
      installer economics, and geographic revenue concentration.
    - >-
      Retention and expansion metrics such as repeat purchase rates, software engagement, attach rates, and cohort
      durability from portable entry points into whole-home systems.
