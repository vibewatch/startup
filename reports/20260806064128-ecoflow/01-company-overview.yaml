company:
  name: EcoFlow
chapter:
  number: 1
  title: Company Overview
  summary: EcoFlow is a Shenzhen-founded 2017 battery-engineering company that has expanded from portable power into whole-home and business energy systems. Public evidence strongly supports founder-market fit, broad retail reach, and large company-claimed scale metrics, but not a clean public read on headcount, audited revenue quality, or the full cap table. The clearest adverse event is the Delta Max 2000 recall, while the clearest upside signal is continuing IPO reporting around a potential US raise.
sections:
- id: identity-business-model
  title: Identity, founding, and business model
  body: EcoFlow’s public identity is that of a 2017 battery-engineering startup from Shenzhen that has broadened into a global clean-energy hardware and software brand. The company no longer presents itself as only a camping-power business. Its own surfaces now group the offer into whole-home backup, portable power stations, home-energy software, EV charging, and business energy applications. TechCrunch’s 2018 and 2022 coverage supports the same evolution from mobile power to a wider energy-independence proposition. The commercial model appears to blend direct-to-consumer sales, mainstream retail distribution, and higher-consideration installation-led products for homes and business applications. What public evidence does not yet prove is the internal revenue split between the legacy portable category and the newer home-energy stack. That distinction matters because a late-stage hardware company should be judged on governance, channel economics, and service obligations, not just on brand
    momentum or top-line storytelling.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO014
  - CO018
  - CO033
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance
  title: Leadership, founder-market fit, and governance visibility
  body: Founder-market fit is stronger than governance transparency. Bruce Wang / Lei Wang is consistently described across CKGSB, PolyU, CNBC Events, and investor materials as a battery specialist with DJI roots, which helps explain why EcoFlow was able to build credibility in portable batteries before expanding into more complex energy products. Public evidence also supports continuity of the founder story rather than recent leadership churn. However, this same source set does not reveal a detailed board roster, committee architecture, or cap-table control structure. That leaves a meaningful governance diligence gap precisely because the company may be nearing a public-market transaction and because post-recall quality management will matter more at larger scale. That distinction matters because a late-stage hardware company should be judged on governance, channel economics, and service obligations, not just on brand momentum or top-line storytelling.
  claimRefs:
  - CO010
  - CO011
  - CO020
  - CO031
  - CO032
  tableRefs:
  - TO002
- id: capital-scale-footprint
  title: Capital base, scale signals, and commercial footprint
  body: 'Public capital evidence is fragmentary but directionally clear. TechCrunch documented a $4 million 2018 round and later reported that EcoFlow had reached roughly a $1 billion valuation by 2022. More recent IPO reporting suggests the company may seek more than $300 million from a US listing, which implies either a growth-financing need, a liquidity objective, or both. On operating scale, the strongest public numbers remain company-claimed reach metrics: 5 million-plus users, 140-plus countries and regions, 1,129 patents, and 50-plus global business partners. TMTPost adds a third-party view that 2024 revenue may have approached RMB 7 billion, but there is no audited public income statement or reconciled lifetime financing schedule. Distribution breadth is easier to verify than financial depth because EcoFlow is visibly present across Home Depot, Best Buy, REI, Costco Next, and direct channels. That distinction matters because a late-stage hardware company should be judged on governance,
    channel economics, and service obligations, not just on brand momentum or top-line storytelling.'
