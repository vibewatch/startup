chapter:
  number: 3
  title: Competitors
  summary: EcoFlow competes from a strong premium position against Jackery, Bluetti, and Anker SOLIX, with Goal Zero as a legacy outdoor peer and OUPES as budget pressure. Its best moat argument is the combination of retail breadth, software-linked whole-home products, and category overlap across portable backup and home energy, but public comparison coverage also shows fast feature convergence and persistent pricing pressure. The right conclusion is that EcoFlow is competitively strong, not competitively protected.
sections:
- id: landscape
  title: Landscape, direct peers, and substitutes
  body: EcoFlow’s competitive set is broader than a simple list of battery brands. Jackery, Bluetti, and Anker SOLIX are the most relevant direct branded peers because they contest EcoFlow in large-format portable backup and increasingly in whole-home-capable systems. Goal Zero matters more as a legacy outdoor brand, while OUPES matters mainly as low-end price pressure. At the same time, buyers can solve the same resilience job with generators or with traditional installer-led solar-and-storage projects. That matters because EcoFlow wants to sell both boxed portable systems and more consultative home-energy products, which means the competitor is sometimes another battery brand and sometimes a completely different path to backup power. Those trade-offs determine whether EcoFlow can preserve premium positioning once rivals match individual specs or promotional intensity.
