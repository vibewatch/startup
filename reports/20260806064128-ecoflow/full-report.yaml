  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category overlap
        blocks:
          - type: paragraph
            body: >-
              EcoFlow is easiest to misread when analysts map it onto a single market. The company’s own category
              language already spans portable power, whole-home backup, home-energy software, EV charging, and business
              energy applications. Public evidence suggests the right framing is not “one battery market” but a stack of
              overlapping consumer-energy categories linked by the resilience and bill-savings job to be done. Portable
              power remains the most legible legacy category, but home storage and Germany-style balcony solar matter
              because they lift ticket size and daily-usage relevance. The market boundary should still exclude
              utility-scale storage and most heavy-industrial BESS because EcoFlow’s public product set remains consumer
              and light-commercial. For diligence, the key is not only whether the category grows, but which parts of
              the category EcoFlow can serve repeatedly without losing pricing power or overwhelming its service model.
            claimRefs:
