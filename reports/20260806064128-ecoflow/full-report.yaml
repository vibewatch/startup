        title: Product definition, modules, and use cases
        blocks:
          - type: paragraph
            body: >-
              EcoFlow’s public product map now spans far beyond a single portable battery line. DELTA Pro 3 still
              represents the company’s portable heritage, but DELTA Pro Ultra, Smart Home Panel 2, OCEAN-branded home
              products, PowerStream, Power Kits, and WAVE 2 show an ambition to cover the household, RV, balcony-solar,
              and smart-living workflow. The practical implication is that EcoFlow should be thought of as a
              multi-module energy-product company, not as a narrow portable-power vendor. The risk is that this wider
              portfolio demands more install coordination, support depth, and quality control than a pure boxed-hardware
              strategy. The investment case therefore depends on whether this architecture remains differentiated after
