  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and listing-related risks
        blocks:
          - type: paragraph
            body: >-
              EcoFlow’s public regulatory surface has widened with scale. The strongest high-confidence item is the
              Delta Max 2000 recall because it is visible in a formal US regulator action and in secondary coverage.
              Privacy and data handling are the second surface: the company publishes a dedicated privacy page, which is
              useful, but the evidence set does not show deep third-party certification disclosure. A third surface is
              listing scrutiny. If EcoFlow pursues a US IPO, its public transparency burden would rise meaningfully
              relative to the current private-company standard. None of these risks necessarily break the thesis alone,
              but together they mean EcoFlow has graduated from product novelty risk into regulated-brand risk.
              Investors should assume residual exposure is higher than the marketing surface suggests until private
              reliability, governance, and support metrics close these gaps. Until those datapoints are shared
              privately, downside assumptions should stay conservative.
