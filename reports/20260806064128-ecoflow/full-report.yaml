      - number: '1.5'
        title: Key judgments and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence judgment from public evidence is that EcoFlow has escaped niche status: its channel
              breadth, global-user claim, and ecosystem marketing all point to a scaled international business. The
              second is that founder-market fit is real and remains central. The biggest unresolved issues are classic
              late-stage private-company gaps: current headcount, audited revenue quality, exact financing history,
              governance structure, and the economics of the shift from portable devices into installed home-energy
              systems. For diligence purposes, the company-overview file can support an “important global clean-tech
              brand with credible hardware roots” view, but not a “fully transparent late-stage issuer” view. That
              distinction matters because a late-stage hardware company should be judged on governance, channel
              economics, and service obligations, not just on brand momentum or top-line storytelling.
