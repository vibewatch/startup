      - number: '8.4'
        title: Comparable set and valuation limits
        blocks:
          - type: paragraph
            body: >-
              Comparables are necessary but imperfect. Jackery, Bluetti, and Anker SOLIX all help frame the range of
              outcomes EcoFlow could live inside, but none is a perfect match because each differs on whole-home depth,
              brand heritage, or corporate structure. Goal Zero and OUPES help more with downside boundaries than with
              fair value. The most important lesson from the comparable set is not an exact multiple but a warning:
              mainstream peers and substitutes cap how much of a software-platform premium EcoFlow can claim without
              stronger evidence of ecosystem monetization. Any entry price therefore must compensate for uncertainty
