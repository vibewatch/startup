      - number: '4.2'
        title: GTM motion, channel economics, and scale signals
        blocks:
          - type: paragraph
            body: >-
              EcoFlow appears to run a blended motion. Portable products can move like consumer electronics through
              retail and direct web, while larger systems likely require a longer consultative path. The company’s
              retail breadth is a real scale signal, as is the reported 2024 revenue level and the company-claimed user
              footprint. But none of those prove GTM efficiency by themselves. The missing layer is realized channel
              economics: sell-through, CAC by channel, returns, and attach rates. Without those, scale has to be treated
              as commercially impressive but economically unverified. That matters because hardware scale without
              transparent gross margin, inventory discipline, and channel economics can destroy value even when revenue
              appears strong from the outside. That extra uncertainty should be priced in explicitly rather than treated
              as a temporary disclosure inconvenience.
