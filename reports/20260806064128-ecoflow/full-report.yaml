  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, direct peers, and substitutes
        blocks:
          - type: paragraph
            body: >-
              EcoFlow’s competitive set is broader than a simple list of battery brands. Jackery, Bluetti, and Anker
              SOLIX are the most relevant direct branded peers because they contest EcoFlow in large-format portable
              backup and increasingly in whole-home-capable systems. Goal Zero matters more as a legacy outdoor brand,
              while OUPES matters mainly as low-end price pressure. At the same time, buyers can solve the same
              resilience job with generators or with traditional installer-led solar-and-storage projects. That matters
              because EcoFlow wants to sell both boxed portable systems and more consultative home-energy products,
              which means the competitor is sometimes another battery brand and sometimes a completely different path to
              backup power. Those trade-offs determine whether EcoFlow can preserve premium positioning once rivals
              match individual specs or promotional intensity.
