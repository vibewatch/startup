      - number: '5.5'
        title: Trust, safety, privacy, and open gaps
        blocks:
          - type: paragraph
            body: >-
              Public trust controls are visible but incomplete. EcoFlow publishes privacy and warranty surfaces and has
              shown recall-response behavior, which is better than no disclosure at all. But the source set does not
