      - number: '4.3'
        title: Cost structure, gross-margin drivers, and working capital
        blocks:
          - type: paragraph
            body: >-
              The visible cost structure is exactly what one would expect from a premium hardware company: battery and
              power-electronics cost, logistics, retail economics, tariffs, and rising service complexity in installed
              systems. Tariffs are especially important because they can raise landed cost across a China-linked supply
              chain while the company simultaneously faces promotional pressure from peers. Installed systems likely
              improve ticket size but also raise support and execution burden. That means gross margin could improve or
              degrade depending on service efficiency — a variable public sources do not disclose. That matters because
              hardware scale without transparent gross margin, inventory discipline, and channel economics can destroy
              value even when revenue appears strong from the outside. That extra uncertainty should be priced in
