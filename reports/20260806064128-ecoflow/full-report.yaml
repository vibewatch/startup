  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The public-evidence investment thesis for EcoFlow is straightforward: a founder-led battery company with
              real brand scale is trying to graduate from premium portable power into a broader consumer-energy
              platform. That strategic direction is supported by the breadth of the product stack and by category growth
              in both portable backup and residential storage. The anti-thesis is equally clear: the company still looks
              more like a strategically interesting private hardware brand than like a fully disclosed, high-conviction
              platform asset. Transparency, recall risk, and tariff exposure all interrupt the clean premium-growth
              narrative. Any entry price therefore must compensate for uncertainty around disclosure, margin quality,
              and how much of the premium brand story can actually compound over time. Any premium case should therefore
              remain capped until disclosure quality improves.
