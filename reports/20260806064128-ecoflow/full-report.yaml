      - number: '1.4'
        title: Milestones, product broadening, and adverse history
        blocks:
          - type: paragraph
            body: >-
              EcoFlow’s public chronology is notable for both category expansion and a visible quality setback. The
              company’s early narrative centered on portable power and outdoor use cases; current public pages emphasize
              whole-home backup, software-defined home energy, and business energy applications alongside the legacy
              portable segment. That broadening supports the thesis that EcoFlow wants to be valued as an ecosystem
              company rather than as a single-device brand. The main counterweight is the Delta Max 2000 recall, which
              generated an official remediation program and wider consumer-press coverage. The recall does not prove
              systemic failure across the product portfolio, but it does show that EcoFlow now carries the operational
              obligations of a scaled hardware company rather than the cleaner narrative of a fast-growing gadget brand.
              That distinction matters because a late-stage hardware company should be judged on governance, channel
              economics, and service obligations, not just on brand momentum or top-line storytelling.
