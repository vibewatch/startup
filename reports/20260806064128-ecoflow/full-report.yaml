      - number: '1.3'
        title: Capital base, scale signals, and commercial footprint
        blocks:
          - type: paragraph
            body: >-
              Public capital evidence is fragmentary but directionally clear. TechCrunch documented a $4 million 2018
              round and later reported that EcoFlow had reached roughly a $1 billion valuation by 2022. More recent IPO
              reporting suggests the company may seek more than $300 million from a US listing, which implies either a
              growth-financing need, a liquidity objective, or both. On operating scale, the strongest public numbers
              remain company-claimed reach metrics: 5 million-plus users, 140-plus countries and regions, 1,129 patents,
              and 50-plus global business partners. TMTPost adds a third-party view that 2024 revenue may have
              approached RMB 7 billion, but there is no audited public income statement or reconciled lifetime financing
              schedule. Distribution breadth is easier to verify than financial depth because EcoFlow is visibly present
              across Home Depot, Best Buy, REI, Costco Next, and direct channels. That distinction matters because a
              late-stage hardware company should be judged on governance, channel economics, and service obligations,
              not just on brand momentum or top-line storytelling.
