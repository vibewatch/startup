        title: Operational, quality, and support risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk is no longer only about whether a power station works. The source set suggests EcoFlow
              must manage firmware, recall remediation, warranty cost, retailer review quality, and, increasingly,
              installation complexity. That shift matters because every move upmarket into home-energy systems raises
              the cost of a support miss. Public sources do not prove a broad reliability problem, but they do prove
              that the company now bears the operational obligations of a premium hardware and installed-systems vendor.
              Without hard failure-rate data, residual exposure remains high by default. Investors should assume
              residual exposure is higher than the marketing surface suggests until private reliability, governance, and
              support metrics close these gaps. Until those datapoints are shared privately, downside assumptions should
