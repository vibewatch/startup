  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and geography
        blocks:
          - type: paragraph
            body: >-
              Publicly, EcoFlow’s customer base is best understood as a layered consumer-energy audience: households
              needing backup, RV and off-grid users needing mobility, homeowners considering larger systems, and a
              thinner but visible small-business or field-power segment. The company’s about page supports global reach
              but not a precise geography mix. The most useful customer conclusion is therefore not a region split, but
              that EcoFlow has expanded from a niche mobile-power buyer into a broader set of resilience and
              bill-savings customers. Wide adoption alone does not prove repeat behavior, profitable expansion, or
              resilience to channel pressure, so these distinctions matter directly for underwriting customer quality.
              This is why proof quality matters at least as much as top-line reach in the customer chapter.
