      - number: '8.3'
        title: Bull, base, and bear case framing
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes EcoFlow proves that the move into home-energy systems and software creates a better
              business than portable-hardware comparables imply. The base case assumes the company remains a strong
              premium hardware brand with some ecosystem upside, but not enough disclosed evidence to earn a true
              platform multiple. The bear case assumes commoditization, tariff pressure, and quality concerns erode
              pricing power and make the category look more like a promotional device market. Today’s public signals are
              most consistent with the base case because strategic upside exists, but the evidence to price it tightly
              does not. Any entry price therefore must compensate for uncertainty around disclosure, margin quality, and
              how much of the premium brand story can actually compound over time. Any premium case should therefore
