      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Three positive drivers stand out publicly: resilience demand, outdoor/mobile power demand, and the wider
              household electrification narrative. EcoFlow’s product pages also increasingly emphasize daily savings and
              optimization, not just emergency backup, which suggests management wants the market to reward recurring
              relevance instead of one-off preparedness spending. Against that, the largest public constraints are
              tariffs, premium pricing, installation complexity, and trust-sensitive conversion. These frictions matter
              most in the higher-ticket categories that EcoFlow likely wants to use for valuation expansion. In other
              words, EcoFlow’s market opportunity is real, but the serviceable opportunity narrows quickly once capital
              intensity and execution burden enter the picture. For diligence, the key is not only whether the category
              grows, but which parts of the category EcoFlow can serve repeatedly without losing pricing power or
              overwhelming its service model.
