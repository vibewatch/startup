  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing, and monetization
        blocks:
          - type: paragraph
            body: >-
              Public sources make EcoFlow’s revenue streams easy to describe but hard to size precisely. Device
              hardware, accessories, panels, and integrated systems are clearly monetized; software and optimization are
              clearly part of the story, but not yet clearly a standalone revenue line. Pricing visibility is stronger
              than realized-economics visibility because official pages openly display premium product prices. That is
              good enough to prove positioning, but not enough to prove revenue quality after promotions, rebates, or
              channel discounts. That matters because hardware scale without transparent gross margin, inventory
              discipline, and channel economics can destroy value even when revenue appears strong from the outside.
              That extra uncertainty should be priced in explicitly rather than treated as a temporary disclosure
              inconvenience.
