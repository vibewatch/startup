      - number: '1.2'
        title: Leadership, founder-market fit, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is stronger than governance transparency. Bruce Wang / Lei Wang is consistently
              described across CKGSB, PolyU, CNBC Events, and investor materials as a battery specialist with DJI roots,
              which helps explain why EcoFlow was able to build credibility in portable batteries before expanding into
              more complex energy products. Public evidence also supports continuity of the founder story rather than
              recent leadership churn. However, this same source set does not reveal a detailed board roster, committee
              architecture, or cap-table control structure. That leaves a meaningful governance diligence gap precisely
              because the company may be nearing a public-market transaction and because post-recall quality management
              will matter more at larger scale. That distinction matters because a late-stage hardware company should be
              judged on governance, channel economics, and service obligations, not just on brand momentum or top-line
              storytelling.
