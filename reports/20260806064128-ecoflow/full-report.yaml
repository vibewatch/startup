      - number: '3.5'
        title: Competitive verdict and gaps
        blocks:
          - type: paragraph
            body: >-
              The competitive verdict is favorable but disciplined. EcoFlow looks better positioned than a budget
              follower and more strategically ambitious than a pure outdoor-power brand. It also benefits from credible
              retail distribution and a wider whole-home story than many portable-only peers. The anti-thesis is that
              much of the category is still hardware-like: features converge, channels can shift, and pricing remains
              promotional. Public sources therefore support a view that EcoFlow has a real competitive edge, but not a
              fully proven moat. The missing evidence is internal: channel economics, return rates by product family,
              attach rates for software and accessories, and sell-through by region. Those trade-offs determine whether
              EcoFlow can preserve premium positioning once rivals match individual specs or promotional intensity.
            claimRefs:
