chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and business model
        blocks:
          - type: paragraph
            body: >-
              EcoFlow’s public identity is that of a 2017 battery-engineering startup from Shenzhen that has broadened
              into a global clean-energy hardware and software brand. The company no longer presents itself as only a
              camping-power business. Its own surfaces now group the offer into whole-home backup, portable power
              stations, home-energy software, EV charging, and business energy applications. TechCrunch’s 2018 and 2022
              coverage supports the same evolution from mobile power to a wider energy-independence proposition. The
              commercial model appears to blend direct-to-consumer sales, mainstream retail distribution, and
              higher-consideration installation-led products for homes and business applications. What public evidence
              does not yet prove is the internal revenue split between the legacy portable category and the newer
              home-energy stack. That distinction matters because a late-stage hardware company should be judged on
              governance, channel economics, and service obligations, not just on brand momentum or top-line
              storytelling.
