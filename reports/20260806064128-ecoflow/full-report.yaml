      - number: '3.4'
        title: Moat durability and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              The deepest tension in the competitive picture is that EcoFlow’s biggest opportunity — moving up into
              home-energy systems — is also where execution burden rises. The ecosystem can create a moat, but only if
              service quality, installation, software usefulness, and product reliability all hold up. In simple
              portable hardware, the moat is much thinner because peers can close spec gaps and win with pricing.
              PowerStream offers a Europe-specific wedge, and the smart-home stack offers a richer moat argument than
              camping gear alone, yet public evidence still points to a company with differentiated positioning rather
              than unassailable defensibility. For underwriting, EcoFlow should be treated as competitively strong but
              still exposed to fast follower pressure. Those trade-offs determine whether EcoFlow can preserve premium
              positioning once rivals match individual specs or promotional intensity.
            claimRefs:
