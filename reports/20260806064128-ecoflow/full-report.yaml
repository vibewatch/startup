            body: >-
              Public pricing context is thin. The best hard anchor remains the 2022 unicorn valuation reported by
              TechCrunch. Recent TMTPost reporting that 2024 revenue approached roughly RMB 7 billion and that a US IPO
              might raise more than $300 million gives the market a fresher context, but not a clean price. There is
              still no public reconciliation of the company’s preference stack, cap-table control, or detailed financing
              history. That means entry discipline has to be conservative even if the strategic story is attractive. IPO
              optionality has value, but only if it comes with a step-up in disclosure quality. Any entry price
              therefore must compensate for uncertainty around disclosure, margin quality, and how much of the premium
              brand story can actually compound over time. Any premium case should therefore remain capped until
