      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The capital picture is the weakest part of the public financial story. Recent press reporting around a
              potential US IPO suggests EcoFlow may want more than $300 million of additional capital, but there is no
              reliable public read on current cash, burn, runway, or debt obligations. The IPO story therefore functions
              more as a signal than as a balance-sheet disclosure. It tells an investor that capital could matter; it
              does not tell the investor whether capital is needed for growth, liquidity, or balance-sheet repair. That
              distinction matters for valuation and negotiating leverage. That matters because hardware scale without
              transparent gross margin, inventory discipline, and channel economics can destroy value even when revenue
              appears strong from the outside. That extra uncertainty should be priced in explicitly rather than treated
              as a temporary disclosure inconvenience.
