companyProfile:
  summary: >-
    EcoFlow is a 2017 Shenzhen-founded battery and energy-systems company built by founder Bruce Wang /
    Lei Wang and a battery-engineering-led team. The company scaled first through portable power stations,
    then broadened into home backup, balcony-solar, RV, software, and whole-home energy orchestration.
    Public evidence supports real global channel reach and a premium-performance brand position, but not
    the kind of disclosure depth expected for late-stage underwriting.
  foundedDate: '2017-01-01'
  founders:
    - name: Bruce Wang / Lei Wang
      role: Founder and CEO
      background: >-
        Former DJI battery engineering leader; publicly positioned as the technical and strategic face of
        EcoFlow's expansion from portable batteries into broader home-energy systems.
      claimRefs: [CO010]
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    Core products include DELTA and RIVER portable power stations, Smart Home Panel 2, OASIS energy
    management, PowerStream balcony-solar products, Power Kits for RV/off-grid use, and OCEAN whole-home
    energy systems including battery, panel, and EV-charging surfaces.
  customerFocus: >-
    Consumer households needing backup or bill savings, RV and off-grid users, Europe-facing balcony-solar
    adopters, and a smaller but visible business / field-power segment.
  businessModel: >-
    Hardware-led revenue through direct e-commerce, scaled retail channels, and more consultative installed
    home-energy sales, with software and ecosystem features intended to improve retention and raise customer
    value over time.
  stage: late-stage private
  fundingStatus: >-
    Publicly evidenced funding anchors include a $4M 2018 round and a roughly $1B 2022 valuation report;
    newer press reporting indicates EcoFlow has explored a US IPO that could raise more than $300M. The
    full cap table, preference stack, and debt facilities are not publicly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO008, CO010, CO017, CO033, CV004, CO015, CO016]
summary:
  headline: >-
    EcoFlow is a real scaled energy-hardware brand with premium category breadth and global reach, but the
    lack of audited economics means a late-stage entry cannot be cleanly underwritten from public evidence.
