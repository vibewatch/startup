- id: judgment-and-gaps
  title: Judgment on market attractiveness and open gaps
  body: 'Public evidence supports a favorable but not unlimited market view. EcoFlow participates in several categories with genuine momentum, and that multi-category overlap is strategically attractive because the same brand can sell resilience, savings, and mobility. But the company’s true SOM cannot be proven from public data because the missing variables are internal: mix, ASP by channel, installation throughput, and conversion from entry portable products into larger home-energy systems. The right diligence posture is therefore to treat the broad markets as supportive, while treating EcoFlow’s company-specific capture story as unproven until internal data closes the gap. For diligence, the key is not only whether the category grows, but which parts of the category EcoFlow can serve repeatedly without losing pricing power or overwhelming its service model.'
