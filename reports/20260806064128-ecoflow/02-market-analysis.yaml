  rows:
  - - Portable power stations
    - Device sales, accessories, portable solar panels
    - Utility-scale storage, generators, commercial BESS
    - Consumer / household / small business
    - Legacy growth engine and largest broad-audience category
  - - Whole-home backup / home battery
    - Installed backup systems, control panels, home battery packs
    - Full rooftop-solar EPC revenue not tied to EcoFlow hardware
    - Homeowner / household budget
    - Higher-ticket category that can expand ASP and recurring service
  - - Balcony solar + storage
    - Plug-in solar, microinverter, small battery kit spend
    - Conventional rooftop solar EPC
    - Apartment or small-home resident / household
    - Important Europe adjacency that lowers installation friction
  - - Business and off-grid mobile energy
    - Light-commercial backup, vans, RVs, field work
    - Heavy industrial backup and utility applications
    - Small business / fleet owner
    - Useful brand extension but not the whole market story
  - - Software / optimization layer
    - Energy management, app control, VPP value capture
    - Standalone enterprise EMS
    - Homeowner embedded in hardware purchase
    - Still bundled with hardware rather than a standalone software TAM
  notes: The public market boundary must stay narrower than generic global energy storage. EcoFlow’s relevant categories are consumer and light-commercial systems that blend resilience, electrification, and bill savings.
