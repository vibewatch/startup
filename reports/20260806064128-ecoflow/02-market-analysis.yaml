- id: sizing-lenses
  title: Sizing lenses and geography
  body: The public market data is directionally attractive but methodologically mixed. Portable-power forecasts point to a still-growing category, while SEIA, ACP, and other storage trackers show a broader residential-storage backdrop that is stronger than a few years ago. Germany stands out as the clearest geographically specific wedge because balcony solar moved from niche to mass-discussion status in 2024–2025, helped by lower friction and a compelling payback narrative. That does not mean Germany alone can explain the whole EcoFlow story, but it does mean Europe offers a practical wedge where portable, storage, and software categories can converge in a single household. For diligence, the key is not only whether the category grows, but which parts of the category EcoFlow can serve repeatedly without losing pricing power or overwhelming its service model.
