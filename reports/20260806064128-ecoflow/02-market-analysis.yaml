company:
  name: EcoFlow
chapter:
  number: 2
  title: Market Analysis
  summary: 'EcoFlow sits across three attractive but distinct markets: portable backup power, residential/home backup storage, and Europe’s growing balcony-solar-plus-storage adjacency. Public market data is directionally favorable, with especially strong signals from residential storage and Germany’s balcony-solar boom, but EcoFlow’s true serviceable share remains unproven because mix, install conversion, and channel-level economics are private. The key analytical takeaway is that the market is large enough and structurally healthy enough to support EcoFlow, but not so frictionless that category growth guarantees company-level capture.'
sections:
- id: market-boundary
  title: Market boundary and category overlap
  body: EcoFlow is easiest to misread when analysts map it onto a single market. The company’s own category language already spans portable power, whole-home backup, home-energy software, EV charging, and business energy applications. Public evidence suggests the right framing is not “one battery market” but a stack of overlapping consumer-energy categories linked by the resilience and bill-savings job to be done. Portable power remains the most legible legacy category, but home storage and Germany-style balcony solar matter because they lift ticket size and daily-usage relevance. The market boundary should still exclude utility-scale storage and most heavy-industrial BESS because EcoFlow’s public product set remains consumer and light-commercial. For diligence, the key is not only whether the category grows, but which parts of the category EcoFlow can serve repeatedly without losing pricing power or overwhelming its service model.
  claimRefs:
  - CM001
  - CM002
  - CM033
  - CM025
  - CM031
