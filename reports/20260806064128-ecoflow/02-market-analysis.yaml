- id: buyers-and-adoption
  title: Buyers, users, payers, and adoption path
  body: 'EcoFlow sells into several buyer journeys, not one. Portable products can convert through retail and direct web because the buyer, user, and payer are often the same household or outdoor enthusiast and the install burden is low. Home-energy products behave differently: the buyer is still usually a homeowner, but the purchase is closer to home improvement than gadget shopping and requires higher trust in hardware, installation, software, and service. Balcony solar sits in between, especially in Europe, because the hardware is meaningful enough to save on bills but simple enough to avoid the full EPC burden of rooftop solar. This segmentation explains why channel strategy matters differently across product lines. For diligence, the key is not only whether the category grows, but which parts of the category EcoFlow can serve repeatedly without losing pricing power or overwhelming its service model.'
  claimRefs:
  - CM010
