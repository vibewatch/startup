evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited statutory income statements, gross profit margins, GAAP net loss figures, and operational monthly cash
      burn post-Series E.
    whyItMatters: >-
      Pennylane claims to be approaching operational profitability with >$115M ARR, but lacking gross margin and cash
      burn disclosures prevents independent verification of true SaaS unit economics and runway.
    diligencePath: >-
      Request audited annual financial statements, management accounts, and cohort gross margin breakdowns directly from
      company CFO during private diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Complete cap table detailing equity percentage ownership, liquidation preferences, and angel investor stakes
      across all 7 funding rounds.
    whyItMatters: >-
      Table TO003 captures major institutional co-leads (sample coverage) but omits early angel syndicates, secondary
      transfers, and specific liquidation preferences.
    diligencePath: >-
      Obtain fully diluted cap table and investor rights agreements from Pennylane legal counsel during confirmatory
      diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
