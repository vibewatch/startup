  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Sector & Scale
      - Deployment Scope
      - Production vs Pilot
      - Operational Outcome
      - Implementation Limitations & Risks
    rows:
      - - BDO Rhône-Alpes
        - Professional Services (1,600 employees, $182M rev)
        - Deployed Pennylane Plateforme for general ledger, AP/AR, and financial close
        - Production (2023 rollout)
        - Modernized client servicing for 700 collaborators and 12,000 client dossiers
        - Staged migration required documented pilot groups and accounting process alignment
      - - Planity
        - Professional Services / SaaS (100 employees, $38M rev)
        - Consolidated finance operations, general ledger, AP/AR, billing, and bank reconciliation
        - Production (2019 rollout)
        - Automated bookkeeping workflows and standardized month-end close procedures
        - Required chart of accounts mapping and exportable reporting pipelines
      - - Goodflair France
        - Insurance (30 employees, $5M rev)
        - ERP Financial deployment centralizing bookkeeping, cash flow monitoring, and reimbursement
        - Production (2024 rollout)
        - API integration with CRM cut manual accounting entries roughly in half
        - Ongoing dependency on continuous API sync and custom endpoint maintenance
      - - Make It Count France
        - Professional Services (10 employees, $1M rev)
        - Day-to-day bookkeeping, invoice issuance, and continuous treasury monitoring
        - Production (2020 rollout)
        - Eliminated manual month-end bookkeeping routines and gained daily cash visibility
        - Operational scope restricted to founder-level workflows and basic treasury
    notes: Case studies and deployment details sourced from enterprise applications buyer tracking and vendor reference databases.
    enumerationScope:
      coverage: sample
      basis: Documented enterprise deployments with verified corporate profiles, headcount, revenue, and implementation year in technographic records.
