callouts:
  - calloutType: strength
    title: Dual-Channel Network Flywheel
    body: >-
      Pennylane's distribution architecture creates a powerful negative-CAC flywheel where chartered accountants act as non-salaried sales ambassadors, migrating entire client rosters onto the platform to prepare for French e-invoicing mandates.
    claimRefs:
      - CU001
      - CU002
      - CU006
  - calloutType: risk
    title: Unaudited Cohort Retention and Micro-SME Exposure
    body: >-
      While headline customer counts exceed 800,000 businesses, Pennylane does not publish Net Revenue Retention or churn cohorts. High structural mortality among French micro-enterprises presents ongoing churn risk if accounting practices fail to enforce active software usage.
    claimRefs:
      - CU003
      - CU012
      - CU014
