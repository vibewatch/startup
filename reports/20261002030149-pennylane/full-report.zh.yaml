  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 欧洲会计与财务管理竞争格局
        blocks:
          - type: paragraph
            body: >-
              欧洲中小企业会计与财务管理软件市场长期受困于严重的国别割裂，本地化税则、监管报送规范及会计科目表惯例阻碍了跨国软件巨头建立全欧范围的垄断优势 (CP001)。在法国本土，竞争格局主要由三股力量构成：Cegid 和
              Sage 等老牌会计核算软件厂商；Qonto 等主打数字商业账户与费用支出管理的相邻金融科技平台；以及 Xero、Intuit QuickBooks 等国际云端会计服务商
              (CP002)。历史上，会计师事务所与企业客户依赖脱节的电子表格、手工扫描凭证和定期银行对账单传递财务记录，导致极大的业务摩擦与数据滞后 (CP003)。Pennylane
              改变了这一流程，将自身定位为打通银行数据、费用管理、发票开具以及专业记账核算的统一财务操作系统，整合于单一协同操作界面 (CP004)。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
