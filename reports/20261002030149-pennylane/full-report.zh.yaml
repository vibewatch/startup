      - number: '2.2'
        title: 目标市场规模测算与扩张空间
        blocks:
          - type: paragraph
            body: >
              评估 Pennylane 的市场机遇，需要厘清法国本土核心市场与德国等次级欧洲大陆扩张区域之间的差异。在法国本土，目标受众生态包含约 12,000 家专业会计师事务所，以及超过 150
              万家寻求高效记账与法定合规的中小企业。向更广阔的欧洲大陆腹地扩张将潜在目标客户池扩充至数百万家新增中小企业，但欧洲各国的会计基础设施高度碎片化，受到不同国家税制、法定会计科目表惯例以及彼此独立的国家电子发票法规制约。市场规模测算方法必须细分自助型中小企业、会计师推荐的企业账户以及面向大型多实体层级客户的不同
              ARPU 画像，避免简单推算单一的全球企业级 SaaS TAM。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方客群细分与双边分发机制
        blocks:
          - type: paragraph
            body: >
              Pennylane 市场战略的核心特征在于其双边分发模式，该模式改变了传统 B2B SaaS
              的客户获取经济模型。在平台运营初期，直接获客的中小企业占早期新增客户绝大多数，但分发重心迅速转向具备高杠杆推荐与采纳能力的会计师事务所。会计事务所充当主要业务关卡，面向其服务的全部企业客户部署事务所 API
              与协作总账基础设施。这种机制形成了自发传播效应：执业注册会计师强制要求或主动推荐中小企业客户使用
              Pennylane，完成自动化收据采集、实时银行对账及电子发票交付。相比直接面向中小企业的纯金融科技竞品，这种网络结构大幅压低了获客成本（CAC），并提升了净留存率。
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 监管催化因素与跨境落地壁垒
        blocks:
          - type: paragraph
            body: >
              推动 Pennylane 在欧洲持续扩张的核心长期增长驱动力，是强制电子发票法规的分阶段落地。在法国，定于 2026 年 9
              月落地的电子发票法规从法律上强制要求企业经由备案注册的合作伙伴去物质化平台或公共门户交换结构化电子发票（如
              Factur-X）。尽管法定合规节点加速了平台普及并促使会计师尽早采纳，但显著的结构性制约因素拖慢了跨国推进节奏。欧洲大陆各国的会计体系具有极强的本地化特征：各国税法差异、定制化银行对接标准、根深蒂固的本土老牌竞争对手，以及参差不齐的电子发票推行时间表（如德国延后至
              2027 年和 2028 年分步实施），均对直接复制单一平台模式构成了实质性壁垒。
            claimRefs:
              - CM005
              - CM008
              - CM013
              - CM014
              - CM015
              - CM016
