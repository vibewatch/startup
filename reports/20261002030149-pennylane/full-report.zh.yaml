  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从监管合规准入与合作伙伴认证，到多层级金融业务扩张的端到端客户旅程。
    data:
      items:
        - label: 阶段 1：合规准入
          stage: 合规准入
          touchpoints:
            - 电子发票强制令认知（2025 年 12 月 11 日获得 PDP 批准）
            - 免费微型版注册或会计师事务所整体客户迁移
            - 入门问卷调查与 Pennylane 学院入学注册
          outcomes:
            - Basic invoice centralization and tax compliance
        - label: 阶段 2：会计作业
          stage: 会计作业
          touchpoints:
            - 与 Qonto、Stripe 及传统银行的银行流水对接集成
            - 自动化采购单据收集与收据匹配
            - 与认证会计师事务所协同完成月末结账
          outcomes:
            - Reduced manual admin overhead and daily cash position visibility
        - label: 阶段 3：价值扩张
          stage: 价值扩张
          touchpoints:
            - 通过 Swan 采纳 Pro Account 内嵌式银行业务
            - 分级企业卡推行（Go、Plus、Max）
            - 通过 Owen 为差旅与高价值 SaaS 支出提供内嵌式卡片保险
          outcomes:
            - 4x spend uplift on premium cards and increased platform ARPU
        - label: 阶段 4：生态集成
          stage: 生态集成
          touchpoints:
            - Silae 薪资集成与 API 互联
            - CRM 数据同步（Goodflair 减少半数手工录入）
            - 随时可供审计的报告与标准化会计科目表
          outcomes:
            - Unified enterprise ERP Financial system of record
        - label: 阶段 5：合作伙伴赋能
          stage: 合作伙伴赋能
          touchpoints:
            - 面向特许会计师的培训师培训（TTT）学院课程
            - 面向会计师事务所员工的明日事务所（Cabinet de demain）学院
            - Pennylane pour l'Éducation 大学课程集成
          outcomes:
            - Scalable non-salaried distributor network across 6,000 firms
        - label: 阶段 6：拥护与留存
          stage: 拥护与留存
          touchpoints:
            - 领英（LinkedIn）专业证书分享（30% 分享率）
            - 会计师事务所之间的自然同行推荐
            - 为 2027 年 9 月强制推行中小企业电子发票开具做准备
          outcomes:
            - Deep operational lock-in and reduced customer acquisition costs
    approximationNotes: 客户旅程阶段与接触点跃迁综合自已发布的合作伙伴案例研究及平台部署指南。
    claimRefs:
