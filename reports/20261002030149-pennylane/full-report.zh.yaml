      - number: '1.2'
        title: 股本演变历史、融资历程与估值跃升
        blocks:
          - type: paragraph
            body: >-
              Pennylane 自成立以来，在七轮机构融资中累计筹集 $394M 至 $446M 股权资金。2026 年 1 月，公司完成由 TCV 和 Blackstone Growth 联合领投的
              €175M（$204M–$207M）Series E 融资，现有投资者 Sequoia Capital、DST Global、CapitalG 和 Meritech Capital Partners
              跟投。该轮交易将 Pennylane 投后估值推高至 $4.25B–$4.3B（€3.6B），较 2025 年 4 月由 Meritech、CapitalG 和 Sequoia 领投的
              €75M（$82M–$85M）Series D 追加轮所获 $2.16B–$2.3B 估值大约翻倍。尽管非公开可比数据与交易汇总显示 ARR 已突破 $115M 且隐含乘数达 37.0x，但毛利率、GAAP
              净利润以及实际经营性现金烧钱速度等关键财务指标仍未公开披露，构成尚未解决的尽调盲区。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
              - CO014
