      - number: '1.3'
        title: 业务规模、战略里程碑与合规风险敞口
        blocks:
          - type: paragraph
            body: >-
              Pennylane 的合作会计师事务所从 2022 年初的 300 家迅速扩张，到 2026 年初已突破 6,000 家会计事务所和 800,000 家企业客户，内部员工规模超过 1,000 至 1,200
              人。法国定于 2026 年生效的企业间强制电子发票法案为公司的战略增长提供有力支撑，Pennylane 早在 2024 年就已正式获得支持 Factur-X 标准的合作伙伴去物质化平台（PDP /
              Plateforme de Dématérialisation Partenaire）资质认证。2025 年 11 月，Pennylane 启动进军德国市场的跨国扩张步伐，此前还于 2024 年 10
              月收购了柏林集成初创企业 Billy。然而，对法定合规时间表的重度依赖、分布在欧洲各核心城市的庞大团队薪酬开支，以及 CEO 个人高度集中的治理权力，带来了关键人物和执行风险，值得持续保持追踪。
