  - id: FE001
    title: Pennylane 一体化产品与运营架构体系
    type: stack
    summary: Pennylane 4 合 1 财务操作系统可视化架构模型，展示从外部数据接入到协同会计应用的分层依赖关系。
    data:
      layers:
        - label: 应用与协同层
          detail: 面向中小企业与特许会计师事务所的双边 Web 界面，支持共享访问记账、财务报告及现金流仪表盘。
          modules:
            - 中小企业管理仪表盘
            - 会计师作业工作台
        - label: 财务控制与智能层
          detail: 自动化 OCR 收据提取、交易对账规则，以及即将推出的用于日记账解读的生成式 AI 财务副驾驶。
          modules:
            - 自动化对账引擎
            - 生成式 AI 财务副驾驶
        - label: 监管合规与开票层
          detail: 用于 Factur-X 电子发票的认证合作伙伴非物质化平台（PDP），在 2026 年法国强制令生效前确保自动化税务合规。
          modules:
            - Factur-X 格式化引擎
            - PDP 安全非物质化门户
        - label: 内嵌式银行与支付层
          detail: 具备牌照资质的银行即服务（BaaS）集成，发行万事达卡（Mastercard）企业支付卡与专属商业账户。
          modules:
            - Swan BaaS 账户系统
            - Mastercard 企业卡交易通道
        - label: 数据接入与集成层
          detail: 连接第三方数据源的原生连接器与外部 REST API，包括银行对账单源、云存储与计费平台。
          modules:
            - Stripe 计费同步器
            - Dropbox 收据采集器
        - label: 核心企业持久化层
          detail: 自研云端 SaaS 多租户数据库集群，维护隔离的客户总账与审计记录。
          modules:
            - 复式记账总账
            - 财税审计轨迹保险库
    approximationNotes: 基于经核实的功能模块与基础设施集成的逻辑架构示意。
    claimRefs:
