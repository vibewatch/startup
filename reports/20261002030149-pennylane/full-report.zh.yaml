            body: >
              公开财务进展表明公司在欧洲大陆取得了高速商业落地，截至 2026 年初，平台活跃企业客户已突破 800,000 家，合作会计师事务所超过 6,000 家，年经常性收入（ARR）超过 $115M。相较 2025 年
              4 月公布的 350,000 家企业、4,500 家会计师事务所和 €100M 年末 ARR
              目标，当前数据展现出强劲的加速度。尽管这些宏观里程碑亮眼且据报道达成了经营性盈利，私募股权与风险投资团队仍面临显著的可见度障碍。标准 SaaS
              业务指标——诸如净留存率（NRR）、毛利率、客户终身价值（LTV）以及分群流失率——均未见公开披露。特别是微型中小企业客群（1–9
              名员工）的流失动态构成实质性风险敞口，鉴于小微企业破产率较高，若无大型企业端用量扩张加以弥补，长远来看可能稀释整体净留存表现。
