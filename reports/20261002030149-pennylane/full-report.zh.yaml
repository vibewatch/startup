      - number: '8.2'
        title: 反面逻辑与估值倍数考量
        blocks:
          - type: paragraph
            body: >
              反面逻辑主要聚焦于畸高的估值倍数与过度的地域集中。上市云端会计对标标的（如 Xero）远期市销率普遍在 8x 至 12x 区间，Sage 和 Cegid 等传统老牌厂商估值倍数更低；Pennylane 高达
              25x–30x 的 ARR 乘数，计入了在全欧范围内无懈可击的扩张预期以及对法国电子发票改革红利的充分变现。然而，法国电子发票法规要到 2026 年底才强制要求中小企业全面铺开，而 2025
              年底试水的德国业务直面成熟的本土软件生态，且德国法定电子发票强制节点已推迟至 2028 年。尽管历经七轮融资后累计募资额已达 $394M 至
              $442M，但未经证实的毛利率以及净留存率披露的缺失，使测算下行风险保护变得极为棘手。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
