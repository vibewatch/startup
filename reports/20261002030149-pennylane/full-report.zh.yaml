  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像细分与双边买方机制
        blocks:
          - type: paragraph
            body: >-
              Pennylane
              运行独特的双渠道分发模式，连接两大相互依存的客户群体：执业会计师事务所（experts-comptables）与中小微企业（SME/VSE）。尽管商业化早期依赖小微企业自主线上注册，平台随后完成了向事务所主导分发的决定性战略转型。在早期扩张阶段，联合创始人兼
              CEO Arthur Waller 指出，自主注册渠道从占新客获取的 90% 迅速下降，短短九个月内，由会计师事务所引流的新客占比飙升至 81%。截至 2026 年，客户底座涵盖超过 800,000
              家商业企业与逾 6,000 家执业会计师事务所，重度集中于法国本土，并在德国初步建立立足点。企业技术栈追踪显示，已部署客户跨度极大，从 Make It Count France 等 10 人的专业服务机构，到
              BDO Rhône-Alpes 等数千人规模的大型机构（后者借助平台为其 700 名员工及约 12,000 个客户卷宗升级了客户服务体系）。价格带设置契合了这一广泛跨度：公开价格表以面向免征增值税小微企业的 0
              欧元免费版起步（限单用户、年开票量 1,200 张且不含协同记账功能），梯次覆盖 Starter（7 欧元）、Basique（14 欧元）、Essentiel（24 欧元），乃至面向个体工商户含会计模块的
              Premium 版（不含税每月 79 欧元），面向中小企业的多用户套餐价格则介于每月 149 至 298 欧元之间。
            claimRefs:
