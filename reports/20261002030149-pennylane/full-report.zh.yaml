  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 协同财务架构与中小企业-会计师统一工作流
        blocks:
          - type: paragraph
            body: >-
              Pennylane 将自身产品定义为一体化财务操作系统，消除中小企业日常运营与会计核算生产之间的割裂。历史上，欧洲会计工作流依赖脱节的桌面端或云端独立软件（如 Cegid 和
              Sage），迫使事务所与客户通过电子表格、纸质发票和邮件附件低效传递数据。Pennylane
              消除了这类摩擦，打造线上协同界面，让会计师事务所与企业客户在同一个统一总账底层上实时协作。平台集成了四大核心功能支柱：商业发票与自动化账单、费用管理与收据汇总、配备企业支付卡的商业银行账户，以及全流程记账核算。通过同
              Dropbox、Stripe 及银行 API 等第三方数据源建立直接集成，银行流水与交易收据原件可直接汇入对账工作流。这种双边架构改变了软件交付逻辑：Pennylane
              不再是单纯的事后行政记账软件，而是演化为企业负责人的日常业务中枢，以及执业注册会计师的高效自动化生产环境。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
