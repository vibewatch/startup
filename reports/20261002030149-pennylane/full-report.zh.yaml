figures:
  - id: FO001
    title: Pennylane 战略演进与公司发展里程碑时间线
    type: timeline
    summary: 2020 年至 2026 年间涵盖公司成立、融资扩张、产品发布、并购及监管 PDP 认证的历史里程碑。
    data:
      items:
        - date: 2020-01
          label: 公司成立
          detail: Pennylane 由 Arthur Waller、Alexandre Roquoplo、Felix Blossier 和 Edouard Mascré 于巴黎创立。
          tone: positive
        - date: 2020-05
          label: 种子轮融资
          detail: 完成由 Global Founders Capital 领投，Partech 和 Kima Ventures 参投的 $4M 种子轮融资。
          tone: positive
        - date: 2021-01
          label: A 轮融资
          detail: 完成由 Hedosophia 领投的 $18M 融资，Sequoia Capital 加入股东名册。
          tone: positive
        - date: 2022-01
          label: B 轮融资与双渠道转型
          detail: 完成由 Sequoia 领投的 $57M（€50M）融资；将分销重心转向由会计师主导的准入（占客户的 81%）。
          tone: positive
        - date: 2024-02
          label: C 轮独角兽里程碑
          detail: 完成由 Sequoia 和 DST Global 领投的 $43.1M 融资，跻身估值 $1.08B 的独角兽行列。
          tone: positive
        - date: 2024-09
          label: 治理宪章与 PDP 资质
          detail: 注册为认证电子发票平台（PDP），并将创始人控制权宪章向执达员归档。
          tone: neutral
        - date: 2024-10
          label: 收购 Billy
          detail: 收购总部位于柏林的无代码 SaaS 集成平台 Billy，加速工作流连接性。
          tone: neutral
        - date: 2025-04
          label: D 轮融资
          detail: 以 $2.16B 估值完成由 Meritech、CapitalG 和 Sequoia 联合领投的 €75M（$82M–$85M）融资。
          tone: positive
        - date: 2025-11
          label: 进军德国市场
          detail: 正式在德国启动商业运营，以复制会计师双渠道分销模式。
          tone: neutral
        - date: 2026-01
          label: E 轮成长轮融资
          detail: 以 $4.25B–$4.3B 估值完成由 TCV 和 Blackstone Growth 领投的 €175M（$204M–$207M）融资。
          tone: positive
    approximationNotes: 日期代表公开公告日或公司注册申报日；财务估值反映约定的投后轮次条款。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO006
