      - number: '3.3'
        title: 分发飞轮、转换成本与政策防御壁垒
        blocks:
          - type: paragraph
            body: >-
              Pennylane 的核心竞争壁垒源于其分发模式从早期的直接获客转型为会计师带动的病毒式自传播飞轮。平台运营初期，90% 的客户来自直接获客渠道；而在随后的九个月内，超过 81%
              的新增客户转为由会计事务所主动推荐其服务的中小企业客户构成 (CP009)。截至 2026 年，法国本土及扩张区域已有超过 6,000 家会计师事务所和 800,000 家中小企业使用该平台
              (CP010)。这种双边采纳机制构筑了极高的转换门槛：会计事务所一旦将名下全部企业客户与内部审计工作流迁移至 Pennylane，更换平台将引发波及数百家企业客户的协同迁移阵痛 (CP011)。此外，定于
              2026 年 9 月生效的法国强制电子发票改革，对不合规或适配迟缓的竞争对手构成了坚固的政策性准入壁垒 (CP012)。Pennylane 具备官方资质认证的合作伙伴去物质化平台（PDP）基础设施与对
              Factur-X 格式的原生支持，为公司建立起阻隔升级乏力老牌厂商的合规防线 (CP013)。
            claimRefs:
              - CP009
