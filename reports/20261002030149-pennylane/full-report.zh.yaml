      - number: '3.2'
        title: 直接竞品画像、规模与差异化特征
        blocks:
          - type: paragraph
            body: >-
              剖析直接竞品与相邻替代方案，可清晰看出各方在目标客群、系统集成架构与分发渠道上的战略分歧。Cegid 和 Sage
              在法国执业会计师事务所中渗透极深，但底层架构历史上依赖分散的桌面端或托管软件，缺乏实时客户协同能力 (CP005)。与之相对，Qonto
              在中小企业商业账户与支出卡市场斩获强劲份额，却无法为执业注册会计师提供原生的全流程会计核算与法定税务报送支持 (CP006)。国际巨头 Xero 和 Intuit QuickBooks
              虽在英语区国家占据主导，但因欧洲大陆独特的法定会计惯例与本地监管准则而在跨国落地时受阻 (CP007)。独立执业会计师事务所明确选择基于 Pennylane
              搭建工作流，兼顾企业财务全局可见度与底层原生记账核算能力 (CP008)。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
