          - type: callout
            title: 未经审计的分群留存与小微企业风险敞口
            body: 尽管名义客户总量突破 800,000 家企业，Pennylane 并未公开净留存率（NRR）或分群流失数据。法国小微企业偏高的自然淘汰率构成了持续的流失隐患，需仰赖会计师事务所有效督导企业保持高频软件活跃度。
