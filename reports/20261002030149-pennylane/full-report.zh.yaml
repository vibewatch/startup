      - number: '8.3'
        title: 情景分析与尽调框架
        blocks:
          - type: paragraph
            body: >
              我们的情景分析模型根据跨国交叉销售速度与合规变现节奏构建了乐观、基准和悲观三种走势。乐观情景下，800,000 家企业的迅速渗透叠加刷卡 POS 机的成功铺设，将驱动 2027 年 ARR 突破 €250M，支撑
              €4.5B 退出估值。悲观情景下，德国拓客成本激增叠加法国中小企业转化失速，将迫使估值倍数回落至 10x ARR 附近，令后期进入的资本承受下行亏损。后续尽调的首要任务是穿透核验分群净留存率、POS
              刷卡机的真实边际贡献率以及 Series E 融资后的烧钱速度走势，方能审慎评估老股转让或增资入局的合理性。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资委员会决策建议
            body: >-
              对 Pennylane 维持审慎「追踪观察」评级。虽然年经常性收入（ARR）达到半人马量级且据称实现盈亏平衡是突出的经营成果，但 €3.5B
              的估值几乎不留任何倍数扩张空间。在考虑建仓前，应等待德国单客经济模型与电子发票变现经过审计后的数据验证。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
          - type: callout
            title: 估值倍数收缩带来的下行风险
            body: >-
              若宏观逆风或欧洲企业级软件采购降温导致估值倍数向公开市场会计 SaaS 均值（8–12 倍）靠拢，除非 ARR 增速能持续保持在 40% 以上，否则 Pennylane 可能面临 50% 至 65%
              的估值回撤修正。
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
              - CV015
