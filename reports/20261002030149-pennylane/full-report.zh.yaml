  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与混合商业化机制
        blocks:
          - type: paragraph
            body: >
              Pennylane
              的商业化引擎融合了软件经常性订阅与基于用量的嵌入式金融服务，构建出在会计平台双边同时捕获价值的多元变现模式。软件订阅上，公司向会计师事务所授权核算生产工具收取订阅费，并向中小企业收取覆盖现金流监控、开票及费用报销等协作财务管理模块的费用。这一订阅基本盘由金融科技变现机制进一步增厚，包括经由
              Swan 等合作伙伴发行企业支付卡、收取支付处理费以及分成刷卡手续费（interchange）。此外，Pennylane 取得的合作伙伴去物质化平台（PDP）资质，使其能够在 Factur-X
              标准下对高并发结构化发票流转实现规模化变现。然而，鉴于 Pennylane 仍属法国非上市企业，纯 SaaS
              经常性收入与交易型刷卡手续费或支付业务量之间的精确分部构成在公开披露中依然成谜，给投资判断中的收入质量评估造成了信息真空。
