      - number: '5.2'
        title: 合作伙伴去物质化平台（PDP）基础设施与合规卡位
        blocks:
          - type: paragraph
            body: >-
              Pennylane 最核心的技术与竞争差异化壁垒，是专为法国 2026 年 9
              月实施的企业间强制电子发票改革自主研发的合作伙伴去物质化平台（PDP）基础设施。在法国电子发票法规要求下，企业间（B2B）交易必须经由具备认证资质的 PDP
              平台或国家公共门户流转，确保税务报送自动化与税法合规。Pennylane 原生支持包含 Factur-X
              在内的结构化格式，使得中小企业与会计师事务所能够在其核心会计工作流中直接收发完全合规的电子发票。在四合一产品矩阵的商业银行与支付板块，Pennylane 集成了法国银行即服务（BaaS）提供商 Swan
              的嵌入式银行基础设施，用以发行万事达企业支付卡并开设专用 IBAN 商业账户。将发票无纸化流转、支付执行与会计对账整合进互操作 API 架构，Pennylane 构建了极高的替换门槛，在 800,000 家企业与
              6,000 家会计师事务所中筑起坚实的合规护城河。
