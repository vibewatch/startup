      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 核心双重转型窗口：ACPR 牌照获取与电子发票推行
            body: >-
              Pennylane 在 2026–2027 年间的风险特征主要由两项同步开展的结构性转型主导：以合作伙伴去物质化平台（PDP）身份全面承接法国 2026 年 9
              月强制推行的企业间电子发票改革，同时构建内部金融犯罪合规团队，争取在 2027 年初将 30k–40k 个商业账户从 Swan 平稳迁移至自主获得的 ACPR 支付与融资牌照底座上 [CR001, CR002,
              CR007]。
