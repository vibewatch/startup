chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司基本信息、公司治理与双边运营模式
        blocks:
          - type: paragraph
            body: >-
              Pennylane SAS 成立于 2020 年 1 月，总部位于法国巴黎 Jules Lefebvre 街 2-4
              号，运营一体化云端会计与财务操作系统。平台连接中小企业（SME）与执业注册会计师，将电子发票、应付账款、费用管理、现金流监控以及会计核算集中于统一的共享数据库。Pennylane 由 Arthur
              Waller（CEO）、Alexandre Roquoplo、Felix Blossier 和 Edouard Mascré 在此前联合创业后共同创立。公司治理受 2024 年 9
              月经司法执达员公证的正式承诺章程约束，依法确保创始团队与员工拥有多数投票表决权，防范产品路线图受外部第三方干预，并杜绝面向合作会计师事务所的单方面擅自涨价。
            claimRefs:
