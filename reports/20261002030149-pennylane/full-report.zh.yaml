        title: 图表
        blocks:
          - type: callout
            title: 双边分发护城河
            body: >
              Pennylane 的分发机制颠覆了标准 B2B SaaS
              的客户获取逻辑。为会计师事务所配备现代协同生产工具，平台将具备高信任度的会计师转化为零边际获客成本（CAC）的引流渠道，直接将成千上万家中小企业客户引入生态圈。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM010
