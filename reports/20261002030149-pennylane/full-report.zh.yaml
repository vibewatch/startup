          - type: callout
            title: 跨境监管碎片化制约
            body: |
              不同于美英 SaaS 模式只需微调即可直接跨国落地的企业级软件市场，欧洲大陆会计体系受到各国税务机关、差异化会计科目表惯例以及非同步电子发票推行周期的层层割裂，直接制约了短期的跨地域扩张速度。
            calloutType: risk
            claimRefs:
              - CM004
