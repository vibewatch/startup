      - number: '7.2'
        title: 业务可扩展性、系统迁移与信息安全风险
        blocks:
          - type: paragraph
            body: >-
              业务层面的核心挑战集中于更严反金融犯罪标准下的客户数据迁移与高并发入驻审核 [CR002]。按照规划，Pennylane 须将数万个存量商业账户从 Swan 迁移至 Pennylane Financial
              Services，同时搭建第一道防线的金融合规团队，以便在系统上线时具备每月承接约 10,000 家新增企业审核入驻的能力
              [CR002]。在高并发下执行严格的企业尽调（KYB）审查且不损害入驻转化率，构成了关键的业务摩擦点
              [CR002]。此外，系统底层的高可用性至关重要：作为打通发票、支付与记账的一体化财务中枢，任何服务宕机或数据同步延迟都将直接阻碍中小企业的现金流可见度与月末关账进程 [CR004, CR007]。在与
              Payhawk 等外部费用管理平台对接时，日益攀升的交易规模、持卡人员泛滥以及跨国多币种增值税处理的复杂性，一旦遭遇数据预记账错误或税务归集差错，极易迅速造成对账拥堵 [CR004]。
            claimRefs:
              - CR002
              - CR004
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
      - number: '7.3'
        title: 交易对手方、渠道伙伴与会计生态依赖
        blocks:
          - type: paragraph
            body: >-
              Pennylane 的分发网络与技术底座高度依赖上游银行通道、外部软件集成和核心分发渠道 [CR001, CR005]。基础设施端，在 2027 年过渡完成前，公司严重依赖 Swan 提供的底层 BaaS
              牌照、账户托管与支付清算通道 [CR001, CR002]，同时依托 Stripe 支撑账单扣费，依赖 Dropbox 摄取单据文档
              [CR005]。分发渠道端，公司的竞争防御纵深与低成本获客能力深度系于执业会计师事务所，超过 4,500 至 6,000 家会计事务所向其服务的企业客户主动推荐并深度应用该系统 [CR005, CR007,
              CR008]。为防止渠道伙伴产生被盘剥的顾虑，Pennylane 创始人于 2024 年 9 月备案了承诺章程，依法确保创始人保留多数投票权与商业自主权 [CR007,
              CR008]。然而，地域单一性依然突出，法国本土贡献了绝大部分业务体量，向德国与比荷卢经济联盟的跨国推进则面临本地化合规、行业竞争和工作流适配等多重阻力 [CR004, CR008]。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
