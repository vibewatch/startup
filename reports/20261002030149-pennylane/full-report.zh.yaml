      - number: '4.2'
        title: 市场拓展经济模型与分发杠杆
        blocks:
          - type: paragraph
            body: >
              Pennylane 财务模型决定性的经济优势，在于其颠覆传统企业级 SaaS 获客成本动态的双边渠道分发体系。Pennylane
              并未依赖开支高昂的直销团队或密集的数字广告投放，而是以认证执业会计师事务所为核心获客通道。在平台运营初期，中小企业自主注册虽占新进账户的约 90%，但转介网络迅速显效，超过 81%
              的新增中小企业客户转由会计师推荐直接导入。由于单家会计事务所通常能带动数十乃至数百家企业客户入驻平台，Pennylane
              充分享受了持续压低获客成本（CAC）的复合网络效应，其单位获客成本远低于独立面向中小企业的同类软件竞品。管理层口径指出，更低的获客成本使公司得以将约 75%
              的日常运营成本分配至研发领域，在维持高强度产品迭代速率的同时，先于行业普遍预期达成了经营性盈亏平衡。
            claimRefs:
