  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管政策与金融牌照架构风险敞口
        blocks:
          - type: paragraph
            body: >-
              随着业务从核心会计 SaaS 延伸至受监管金融服务领域，Pennylane 在法国及整个欧洲直面严格的监管审查 [CR001]。历史上，公司依托与 Swan 合作的嵌入式银行即服务（BaaS）架构，托管运营了约
              30,000 至 40,000 个商业账户 [CR001, CR002]。为自主掌控支付流水并开展信贷业务，Pennylane 已向法国审慎监管与决议局（ACPR）提交支付机构（Établissement de
              paiement）与融资公司（Société de financement）牌照申请，计划于 2027 年初将新客户迁入自营技术底座 [CR001,
              CR002]。该自建合规工程要求公司遵循严苛的合规标准，包括反洗钱/反恐怖融资（AML/CTF）政策、最终受益所有人（UBO）穿透核验、政要人员（PEP）与制裁名单筛查，以及高频交易监控
              [CR002]。与此同时，定于 2026 年 9 月生效的法国企业间强制电子发票改革，要求公司作为合作伙伴去物质化平台（PDP）保持持续合规并确保高可用性运营 [CR006,
              CR007]。监管部门的任何审查摩擦或牌照审批延误，都将制约后续产品规划落地，迫使其继续受制于第三方银行通道 [CR001, CR003]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
