  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构范畴
        blocks:
          - type: paragraph
            body: >
              欧洲中小企业财务软件市场在历史上长期割裂为两类工具：执业会计师使用的专业客户端会计核算套件，以及企业负责人使用的前台业务工具。在法国等传统软件生态中，Cegid 和 Sage
              等老牌厂商在总账记账、税务申报和法定资产负债表生成领域建立了稳固的桌面端和托管部署基础。与此相对，中小企业主要依靠零散的单点工具、电子表格导出或本地化开票软件，导致企业内部管理层与外部咨询事务所之间频繁出现结构性摩擦、每月录入瓶颈以及对账延迟。Pennylane
              重新定义了这道边界，提供将专业会计核算与合作伙伴去物质化平台合规要求，同日常企业财务管理、商业账户及发票工作流直接打通的一体化双边架构。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: figure
