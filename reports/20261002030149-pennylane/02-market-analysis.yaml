callouts:
  - calloutType: insight
    title: Dual-Sided Distribution Moat
    body: >
      Pennylane's distribution mechanics invert standard B2B SaaS customer acquisition. By equipping accounting firms with modern collaborative production tools, the platform leverages accountants as a high-trust, zero-marginal-CAC acquisition channel that introduces thousands of SME clients directly into the ecosystem.
    claimRefs:
      - CM003
      - CM006
      - CM010
      - CM011
  - calloutType: risk
    title: Cross-Border Regulatory Fragmentation
    body: >
      Unlike enterprise software markets where US or UK SaaS models translate across borders with minimal modification, continental European accounting is fragmented by national tax authorities, divergent chart-of-accounts conventions, and asynchronous electronic invoicing timetables that limit immediate geographic expansion velocity.
    claimRefs:
      - CM004
      - CM008
      - CM013
      - CM014
