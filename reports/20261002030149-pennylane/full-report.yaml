        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Channel Network Flywheel
            body: >-
              Pennylane's distribution architecture creates a powerful negative-CAC flywheel where chartered accountants
              act as non-salaried sales ambassadors, migrating entire client rosters onto the platform to prepare for
              French e-invoicing mandates.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU006
          - type: callout
            title: Unaudited Cohort Retention and Micro-SME Exposure
            body: >-
              While headline customer counts exceed 800,000 businesses, Pennylane does not publish Net Revenue Retention
              or churn cohorts. High structural mortality among French micro-enterprises presents ongoing churn risk if
              accounting practices fail to enforce active software usage.
            calloutType: risk
            claimRefs:
              - CU003
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Licensing Architecture Exposure
        blocks:
          - type: paragraph
            body: >-
              Pennylane operates under substantial regulatory oversight in France and across Europe as it scales from
              core accounting SaaS into regulated financial services [CR001]. Historically, the company has operated
              approximately 30,000 to 40,000 business accounts under an embedded Banking-as-a-Service (BaaS)
              architecture partnered with Swan [CR001, CR002]. To internalize payment flows and credit offerings,
              Pennylane has initiated applications for Établissement de paiement (payment institution) and Société de
              financement licenses under ACPR oversight, targeting new customer onboarding on its proprietary stack by
              early 2027 [CR001, CR002]. This greenfield regulatory project exposes the firm to rigorous compliance
              standards, including AML/CTF policies, beneficial ownership verification (UBO), politically exposed
              persons (PEP) and sanctions screening, and transaction monitoring [CR002]. Simultaneously, France's
              mandatory electronic invoicing reform coming into force in September 2026 requires continuous compliance
              and high-availability operations as a Partner Dematerialisation Platform (PDP) [CR006, CR007]. Any
              supervisory friction or licensing delays would constrain product roadmap rollout and force continued
              reliance on third-party banking rails [CR001, CR003].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
