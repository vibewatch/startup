      - number: '5.2'
        title: Partner Dematerialisation Platform (PDP) Infrastructure and Regulatory Positioning
        blocks:
          - type: paragraph
            body: >-
              A foundational technological and competitive differentiator for Pennylane is its proprietary Partner
              Dematerialisation Platform (PDP) infrastructure, built specifically for the French national electronic
              invoicing reform mandated for September 2026. Under French electronic invoicing mandates,
              business-to-business transactions must transit through certified PDP platforms or the national public
              portal to ensure automated tax reporting and fiscal compliance. Pennylane developed native support for
              structured formats including Factur-X, allowing small enterprises and accounting firms to send and receive
              legally compliant electronic invoices directly within their core accounting workflow. To power the
              transactional banking and payment pillar of its 4-in-1 suite, Pennylane integrates embedded banking
              infrastructure via French Banking-as-a-Service provider Swan, which issues Mastercard corporate payment
              cards and dedicated IBAN business accounts. By unifying invoice dematerialization, payment execution, and
              accounting reconciliation into an interoperable API architecture, Pennylane creates substantial switching
              friction and secures defensible compliance moats across 800,000 businesses and 6,000 accounting practices.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
