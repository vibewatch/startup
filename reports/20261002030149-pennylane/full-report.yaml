              Because Pennylane achieved operational profitability ahead of schedule while maintaining a 1,000-person
              headcount, the fresh capital is largely earmarked for aggressive R&D investments, including generative AI
              accounting co-pilots, deeper verticalization, and cross-border expansion into Germany. Although forward
