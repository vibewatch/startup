      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Sided Network Effects from Accounting Firm Workflow Integration
            body: >-
              Pennylane's primary competitive and distribution strength stems from its collaborative software model. By
              transforming accounting firms into distributors who bring their entire SME portfolios onto the platform,
              Pennylane achieves high acquisition efficiency and deep operational lock-in.
            calloutType: strength
            claimRefs:
              - CE003
              - CE005
              - CE011
          - type: callout
            title: Regulatory Implementation and Single-BaaS Dependency Exposure
            body: >-
              Pennylane's accelerated growth heavily relies on the execution of France's September 2026 e-invoicing
              mandate and its embedded banking partnership with Swan. Any regulatory postponement or technical
              disruptions in third-party BaaS infrastructure represent material operational dependencies.
            calloutType: risk
            claimRefs:
              - CE006
