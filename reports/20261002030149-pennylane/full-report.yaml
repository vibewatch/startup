  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Dual-Sided Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Pennylane operates a distinct dual-channel distribution model that bridges two interdependent customer
              constituencies: accounting firms (experts-comptables) and small-to-medium enterprises (SMEs/VSEs). While
              early commercialization relied on direct self-serve inbound from micro-businesses, the platform underwent
              a decisive structural pivot toward firm-led distribution. In its early scaling phase, co-founder and CEO
              Arthur Waller noted that direct inbound shifted from 90% of client acquisition to accounting firms
              accounting for 81% of new client acquisition within nine months. By 2026, the customer base spans over
              800,000 commercial businesses and more than 6,000 chartered accounting practices, heavily concentrated in
              France with early footholds in Germany. Enterprise technographic tracking shows deployed clients ranging
              from 10-person professional services firms like Make It Count France up to multi-thousand employee
              organizations such as BDO Rhône-Alpes, which modernized client servicing across 700 collaborators and
              approximately 12,000 client dossiers. Pricing segmentation reflects this wide aperture: public pricing
              grids begin at a EUR 0 Free plan for VAT-exempt micro-businesses (capped at one user and 1,200 invoices
              annually without collaborative accounting features), scaling through Starter (EUR 7), Basique (EUR 14),
              Essentiel (EUR 24), up to Premium with the accounting module at EUR 79 excl. VAT per month for
              self-employed entities, while small-business multi-user grids reach EUR 149 to EUR 298 per month.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU010
      - number: '6.2'
        title: Adoption Trajectory and the Customer Education Flywheel
        blocks:
          - type: paragraph
            body: >-
              The platform's adoption trajectory has been propelled by impending regulatory compliance deadlines,
              notably the French mandatory electronic invoicing reform that took effect for invoice reception across all
              VAT-liable entities on 1 September 2026. Pennylane attained registered Partner Dematerialisation Platform
              (PDP / plateforme agréée) status from the French tax authority with registration issued on 11 December
              2025, transforming core accounting compliance into an acquisition and retention magnet. To support
              high-velocity onboarding across hundreds of thousands of users without overwhelming human support
              infrastructure, Pennylane deployed customer education via LearnWorlds, establishing Pennylane Academy. The
              academy currently serves 82,000 registered users, 14,000 active learners, and has awarded 3,600
              certifications, achieving an 8.6/10 customer satisfaction (CSAT) rating. Crucially, 30% of certified users
              showcase their credentials on professional networks like LinkedIn, transforming certification programs
              into organic marketing assets and enabling a scalable train-the-trainer model where chartered accountants
              train their own SME clients.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
