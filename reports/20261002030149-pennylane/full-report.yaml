  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer journey from regulatory onboarding and partner certification to multi-tier financial
      expansion.
    data:
      items:
        - label: 'Phase 1: Compliance Onboarding'
          stage: Compliance Onboarding
          touchpoints:
            - E-invoicing mandate awareness (PDP approval on 11 Dec 2025)
            - Free micro-tier signup or firm portfolio migration
            - Orientation questionnaire and Pennylane Academy enrollment
          outcomes:
            - Basic invoice centralization and tax compliance
        - label: 'Phase 2: Accounting Production'
          stage: Accounting Production
          touchpoints:
            - Bank feed integration with Qonto, Stripe, and traditional banks
            - Automated purchase document collection and receipt matching
            - Collaborative month-end close with certified accounting firm
          outcomes:
            - Reduced manual admin overhead and daily cash position visibility
        - label: 'Phase 3: Value Expansion'
          stage: Value Expansion
          touchpoints:
            - Pro Account embedded banking adoption via Swan
            - Tiered corporate card rollout (Go, Plus, Max)
            - Embedded card insurance via Owen for travel and high-value SaaS spend
          outcomes:
            - 4x spend uplift on premium cards and increased platform ARPU
        - label: 'Phase 4: Ecosystem Integration'
          stage: Ecosystem Integration
          touchpoints:
            - Silae payroll integration and API connectivity
            - CRM data synchronization (Goodflair half-entry reduction)
            - Audit-ready reporting and standardized chart of accounts
          outcomes:
            - Unified enterprise ERP Financial system of record
        - label: 'Phase 5: Partner Enablement'
          stage: Partner Enablement
          touchpoints:
            - Train-the-trainer academy courses for chartered accountants
            - Cabinet de demain academy for accounting firm associates
            - Pennylane pour l'Éducation university curriculum integration
          outcomes:
            - Scalable non-salaried distributor network across 6,000 firms
        - label: 'Phase 6: Advocacy & Retention'
          stage: Advocacy & Retention
          touchpoints:
            - LinkedIn professional credential sharing (30% share rate)
            - Organic peer referrals across accounting practices
            - Preparation for September 2027 mandatory SME e-invoicing issuance
          outcomes:
            - Deep operational lock-in and reduced customer acquisition costs
    approximationNotes: >-
      Journey stages and touchpoint transitions synthesized from published partner case studies and platform deployment
