      - number: '4.4'
        title: Capital Adequacy, Cash Runway, and Capital Intensity
        blocks:
          - type: paragraph
            body: >
              Following its €175 million ($204 million) Series E financing round closed in early 2026 led by TCV and
              Blackstone Growth, Pennylane exhibits strong capital adequacy with no immediate financing dependency.
              Total equity capital raised stands at approximately $394 million across its corporate lifecycle,
              supporting a post-money valuation of $4.25 billion (€3.6 billion). CEO Arthur Waller noted that the
