        title: Public Scale Trajectory Versus Private Metric Opacity
        blocks:
          - type: paragraph
            body: >
              Public financial traction indicates rapid commercial adoption across continental Europe, highlighted by
              the platform surpassing 800,000 active businesses, 6,000 accounting practices, and $115 million in annual
              recurring revenue as of early 2026. This performance marks substantial acceleration from April 2025
              milestones of 350,000 businesses, 4,500 accounting firms, and targeted year-end ARR thresholds of €100
