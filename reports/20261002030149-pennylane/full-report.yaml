figures:
  - id: FO001
    title: Pennylane Strategic Evolution and Corporate Milestone Timeline
    type: timeline
    summary: >-
      Chronological milestones spanning company incorporation, funding expansions, product launches, acquisitions, and
      regulatory PDP certification from 2020 through 2026.
    data:
      items:
        - date: 2020-01
          label: Company Incorporation
          detail: Pennylane founded in Paris by Arthur Waller, Alexandre Roquoplo, Felix Blossier, and Edouard Mascré.
          tone: positive
        - date: 2020-05
          label: Seed Financing
          detail: Closed $4M seed funding led by Global Founders Capital with Partech and Kima Ventures.
          tone: positive
        - date: 2021-01
          label: Series A Round
          detail: Raised $18M led by Hedosophia with Sequoia Capital joining the shareholder register.
          tone: positive
        - date: 2022-01
          label: Series B & Dual-Channel Shift
          detail: Secured $57M (€50M) led by Sequoia; pivoted distribution to accountant-led onboarding (81% of clients).
          tone: positive
        - date: 2024-02
          label: Series C Unicorn Milestone
          detail: Raised $43.1M led by Sequoia and DST Global, achieving unicorn valuation of $1.08B.
          tone: positive
        - date: 2024-09
          label: Governance Charter & PDP Status
          detail: Registered as Authorised Electronic Invoicing Platform (PDP) and filed founder control charter with bailiff.
          tone: neutral
        - date: 2024-10
          label: Billy Acquisition
          detail: Acquired Berlin-based no-code SaaS integration platform Billy to accelerate workflow connectivity.
          tone: neutral
        - date: 2025-04
          label: Series D Round
          detail: Raised €75M ($82M–$85M) co-led by Meritech, CapitalG, and Sequoia at a $2.16B valuation.
          tone: positive
        - date: 2025-11
          label: German Market Entry
          detail: Officially launched commercial operations in Germany to replicate dual-channel accounting distribution.
          tone: neutral
        - date: 2026-01
          label: Series E Growth Round
          detail: Secured €175M ($204M–$207M) led by TCV and Blackstone Growth at a $4.25B–$4.3B valuation.
          tone: positive
    approximationNotes: >-
