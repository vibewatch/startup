  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Collaborative Financial Architecture and Unified SME-Accountant Workflows
        blocks:
          - type: paragraph
            body: >-
              Pennylane defines its product as an integrated financial operating system engineered to eliminate the
              operational fragmentation between small-to-medium enterprise management and accounting production.
              Historically, European accounting workflows relied on disconnected desktop or cloud packages such as Cegid
              and Sage, which forced firms and clients to exchange spreadsheets, paper invoices, and manual email
              attachments. Pennylane overcomes this friction by functioning as an online collaborative interface where
              accounting firms and their business clients interact directly on the same unified ledger. The platform
              centralizes four primary functional pillars: commercial invoicing and automated billing, expense
              management and receipt aggregation, business bank accounts with corporate payment cards, and full-cycle
              bookkeeping production. By establishing direct integrations with third-party data providers including
              Dropbox, Stripe, and banking APIs, bank statements and raw transaction receipts automatically flow into
              the reconcilation workflow. This two-sided architecture fundamentally changes the software delivery model:
              rather than functioning purely as administrative recording software, Pennylane acts as a daily operational
              control center for business owners and an automated production environment for certified chartered
              accountants.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
