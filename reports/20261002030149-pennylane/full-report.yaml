chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Governance, and Dual-Sided Operating Model
        blocks:
          - type: paragraph
            body: >-
              Founded in January 2020 and headquartered at 2-4 rue Jules Lefebvre in Paris, France, Pennylane SAS
              operates a unified cloud accounting and financial operating system. The platform bridges small and
              medium-sized enterprises (SMEs) with certified public accountants, centralizing electronic invoicing,
              accounts payable, expense management, cash-flow monitoring, and accounting production into a single shared
              database. Pennylane was co-founded by Arthur Waller (CEO), Alexandre Roquoplo, Felix Blossier, and Edouard
              Mascré, following their previous entrepreneurial venture. Governance is defined by a formal charter of
              commitment filed with a judicial officer (bailiff) in September 2024, legally guaranteeing that the
              founders and employees maintain majority voting control, protect the product roadmap from third-party
              pressure, and prevent unsolicited fee hikes for accounting partners.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
