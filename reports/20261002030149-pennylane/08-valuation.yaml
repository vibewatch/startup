callouts:
  - calloutType: recommendation
    title: Investment Committee Recommendation
    body: Maintain a disciplined 'track' stance on Pennylane. While reaching centaur scale with reported breakeven is a standout operational achievement, the €3.5B valuation leaves no room for multiple expansion. Wait for audited proof of German unit economics and e-invoicing monetization before considering entry.
    claimRefs:
      - CV001
      - CV002
      - CV005
  - calloutType: risk
    title: Downside Risk from Multiple Compression
    body: If macroeconomic headwinds or slowing European enterprise software spending contract multiples toward public accounting SaaS averages (8-12x), Pennylane could face a 50% to 65% valuation repricing unless ARR growth sustains above 40%.
    claimRefs:
      - CV007
      - CV013
      - CV015
