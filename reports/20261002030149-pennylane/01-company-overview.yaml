callouts:
  - calloutType: "risk"
    title: "Governance Concentration and Founder Majority Voting Charter"
    body: "Pennylane's September 2024 governance charter filed with a bailiff legally protects founder control and promises no price hikes for accounting firms. While this insulates accounting partnerships from private equity extractivism, it severely limits outside investor recourse and board governance checks should operational missteps occur."
    claimRefs:
      - "CO004"
      - "CO013"
  - calloutType: "insight"
    title: "Regulatory Tailwinds vs. Valuation Multiple Expansion"
    body: "Pennylane's valuation surged to $4.25B–$4.3B ahead of France's mandatory September 2026 electronic invoicing rollout. At a self-reported $115M ARR run rate, the implied 37x multiple prices in near-frictionless market capture, exposing late-stage investors to valuation compression if enterprise adoption or German expansion lags."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO011"
      - "CO012"
