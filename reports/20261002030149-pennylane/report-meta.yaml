companyProfile:
  summary: >-
    Pennylane is a Paris-based financial operating system that centralizes bookkeeping, invoicing, payments, cards, cash
    flow, and electronic invoicing compliance for SMEs and accounting firms. The company was founded in 2020 by Arthur
    Waller, Alexandre Roquoplo, Felix Blossier, and Edouard Mascré, and it has scaled through a dual-channel
    distribution model that relies heavily on chartered accountants as a customer-acquisition lever.
