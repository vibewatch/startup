  topStrengths:
    - Accountant-led distribution gives Pennylane a structurally efficient customer-acquisition engine.
    - The company benefits from France's e-invoicing mandate and a broad PDP/compliance position.
    - Product breadth across accounting, payments, cards, and cash flow supports cross-sell and retention.
  topRisks:
    - The valuation implies a demanding revenue multiple that depends on sustained growth.
    - Gross margin, NRR, and cohort churn remain undisclosed, limiting underwriting visibility.
    - Germany expansion and broader international execution still need proof at scale.
  unresolvedGaps:
    - Gross margin and contribution margin are still not publicly disclosed.
    - Net Revenue Retention and micro-SME churn dynamics remain opaque.
    - German revenue traction and timing to meaningful ARR contribution are still uncertain.
    - Burn rate, runway, and succession depth are not publicly documented.
