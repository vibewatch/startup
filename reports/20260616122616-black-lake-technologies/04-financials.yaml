- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - current public substitute
  - exact diligence path
  rows:
  - - Audited revenue, ARR, and bookings
    - Cannot test whether >60% growth is off a meaningful recurring base or a project-heavy base
    - Company-claimed growth and older recruiting-page milestones only
    - Request 24 months of monthly recurring revenue, services revenue, bookings, and audited annual statements.
  - - Gross margin and services-delivery cost
    - Cannot judge scalability or whether profitability is software-like versus labor-assisted
    - Implementation-time proxies and SaaS positioning only
    - Request product-level and company-level gross margin with software/services/partner splits.
  - - Cash on hand, burn, and runway
    - Cannot underwrite solvency, next-round timing, or downside buffer despite the D round
    - Funding round size and stated use of proceeds only
    - Request treasury report, monthly burn bridge, covenant summary, and downside runway cases.
  - - Revenue mix by SME packages, enterprise subscriptions, services, and AI agents
    - Cannot see whether growth is driven by scalable recurring software or high-touch deployment work
    - Product segmentation and pricing logic only
    - Request segment P&L, ACV by segment, and attach rate of AI agents to legacy products.
  - - Realized pricing, discounting, retention, and NRR
    - List pricing alone does not show revenue quality or expansion efficiency
    - Official list price for SME product and qualitative enterprise pricing model
    - Request top-50 contract extract with list price, net price, term, renewal status, and expansion history.
  - - Customer concentration and receivables quality
    - A few large accounts or slow collections could materially change risk despite broad factory-count marketing
    - Named-case studies and broad factory counts only
    - Request top-20 customers by ARR, share of revenue, gross margin, renewal dates, and DSO by cohort.
  - - Litigation economics and reserves
    - Potential legal cash leakage is unknowable even though registry pages show hearing notices and litigation relations
    - Aiqicha summary counts only
    - Request case list, claimed amounts, reserves, insurance, and management’s probability-weighted exposure view.
  notes: This table intentionally emphasizes what public evidence does not disclose. The chapter’s core conclusion is that Black Lake has enough public traction to merit diligence, but not enough disclosure to complete financial underwriting.
