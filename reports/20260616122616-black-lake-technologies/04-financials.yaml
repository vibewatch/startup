- id: TI004
  title: Capital adequacy table
  columns:
  - metric
  - public value / status
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Latest financing round
    - Near RMB1bn Series D in April 2026
    - High
    - Confirms continued access to external capital and investor appetite for the industrial-AI thesis
    - Provide signed close memo, primary versus secondary split, and exact proceeds received by the company.
  - - Latest valuation
    - '>RMB7bn post-money / ~$1.3bn Crunchbase translation'
    - Medium
    - Sets the dilution and valuation anchor for future rounds, but exact share count and FX basis are absent
    - Provide post-money share count, fully diluted capitalization, and valuation method used in investor materials.
  - - Round chronology
    - Public sources say the D round was the sixth financing after angel, A, A+, B, and C
    - Medium
    - Supports the maturity of the financing history but not the exact cumulative cash-in number
    - Provide round-by-round cash raised, lead investor, security type, and ownership dilution.
  - - Cumulative capital before D
    - 'Not reconciled: official / recruiting surfaces and database pages do not align cleanly'
    - Low
    - A stale capital ledger distorts dilution, ownership, and runway modeling
    - Provide a reconciled lifetime capital table including FX basis and whether venture debt or other facilities are included.
  - - Use of proceeds
    - Industrial AI rollout and global expansion
    - Medium
    - Useful because it points to likely future cash uses in R&D, deployment, and overseas GTM
    - Provide 24-month operating plan and budget split across R&D, commercial, services, and overseas expansion.
  - - Cash on hand / monthly burn / runway
    - null
    - Low
    - This is the central capital-adequacy test and it is entirely absent from the public record
    - Provide month-end cash, net burn, gross burn, runway, and downside runway under slower growth.
  - - Debt / project-finance obligations / contingent liabilities
    - No debt schedule disclosed; Aiqicha surfaces litigation and hearing notices but not exposure values
    - Low
    - Hidden obligations can materially change effective runway and downside protection
    - Provide debt schedule, lease obligations, guarantees, litigation reserve, and insurance coverage.
  notes: Public sources prove financing access and intended use of proceeds, but they do not prove runway. Cash, burn, debt, and contingent-liability disclosure are the critical missing pieces.
