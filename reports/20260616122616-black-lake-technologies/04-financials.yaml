- id: financial-verdict
  title: Financial verdict on revenue quality, margins, and blockers
  body: |-
    Black Lake’s financial story is stronger than its formal disclosure standard. The public record proves that customers exist across both SME and larger-factory motions, that at least one product has explicit annual SaaS pricing, and that investors were still willing to fund the company at an above-RMB7 billion valuation in 2026. It also supports a credible thesis that AI agents could deepen monetization over time by tying price to customer labor savings instead of just seats and modules. Those are real positives for revenue quality.

    The problem is that nearly every underwriting question that sits beneath those positives remains unanswered in public. There is no audited topline, no ARR, no gross margin bridge, no churn or NRR, no CAC/payback, no segment mix between enterprise and SME, and no disclosed cash/burn/runway frame. The company’s profitability claim may be true, but public evidence does not yet show whether that profitability is durable, software-like, or dependent on implementation intensity that will rise again during global expansion and AI rollout.

    My financial conclusion is therefore cautious but not negative. Black Lake appears to have genuine commercial traction, concrete list pricing, and fundraising credibility. It does not yet have a public evidence set strong enough for clean underwriting on revenue quality, margin path, or capital sufficiency. The next diligence step should not be another narrative interview; it should be a data room pack with revenue by segment, gross margin by software versus services, cash runway, debt and contingent liabilities, and cohort retention by product line.
