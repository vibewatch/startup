  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, and covenant package.
    whyItMatters: The D round proves financing access but not whether Black Lake can fund AI rollout and global expansion without another near-term raise.
    diligencePath: Request a treasury pack with month-end cash, gross and net burn, debt schedule, covenant summary, and downside runway cases.
    relatedQuestionRefs:
    - QI017
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Gross margin, services margin, CAC, payback, churn, and net revenue retention by product segment.
    whyItMatters: These metrics determine whether Black Lake’s profitability is durable software economics or a temporary mix outcome.
    diligencePath: Request cohort retention, CAC payback, margin bridge, and software-versus-services P&L by SME, enterprise, and AI-agent products.
    relatedQuestionRefs:
    - QI018
    - QI020
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: material
    topic: capital-ledger
    missingEvidence: A reconciled lifetime capital table including round size, investor, security type, FX basis, and any venture debt or non-equity facilities.
    whyItMatters: Current public sources disagree on cumulative capital, which weakens dilution and ownership modeling.
    diligencePath: Obtain the internal financing ledger and match each round to shareholder registers and closing documentation.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: segment-mix
    missingEvidence: Revenue mix across SME packages, enterprise subscriptions, implementation/services, and AI agents.
    whyItMatters: Without segment mix, an investor cannot determine how much of growth is recurring and scalable versus labor-assisted.
    diligencePath: Request segment-level revenue, bookings, gross margin, and customer counts for the last eight quarters.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI001
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: Realized pricing, discount schedules, contract terms, and renewal/expansion behavior.
    whyItMatters: List pricing overstates revenue quality if realized pricing is heavily discounted or renewal rates are weak.
    diligencePath: Review the top-50 contracts for list price, net price, term length, renewal status, and AI-agent upsell attachment.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: minor
    topic: legal-risk
    missingEvidence: Case-level litigation facts, claimed amounts, reserve treatment, and insurance recovery assumptions.
    whyItMatters: Registry counts alone do not show whether legal exposure is immaterial noise or a meaningful cash drain.
    diligencePath: Request a legal schedule that maps every public notice to claimed amount, status, reserve, and expected resolution path.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
