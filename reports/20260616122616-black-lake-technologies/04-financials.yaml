- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: |-
    Black Lake does not look capital-constrained in the narrow sense of market access. The April 2026 D round is heavily corroborated across independent outlets, and the reported post-money valuation above RMB7 billion signals that external capital still assigns strategic value to the company’s industrial-AI positioning. Sources are also consistent about the round’s intended use: accelerate AI deployment in real manufacturing workflows and fund global expansion. Those uses are logical for the business, but they also imply ongoing cash demands in R&D, implementation, partner enablement, and overseas commercial buildout.

    The harder question is whether the round makes Black Lake adequately capitalized, and public evidence cannot answer that. The company does not disclose cash on hand, monthly burn, runway, debt, leasing commitments, or covenant structure in any reviewed source. Even the lifetime capital ledger is messy: official and recruiting surfaces describe pre-D cumulative financing in different ways, while CB Insights still showed a much lower total-raised figure at fetch time. That may reflect stale databases, FX conversion, or partial round coverage, but the point for diligence is the same: the public capital stack cannot yet be plugged directly into dilution or runway modeling.

    There is also at least some adverse signal around contingent liabilities. Aiqicha surfaces one court notice, 15 hearing notices, and five litigation relationships, yet none of the reviewed sources quantify economic exposure, reserves, or insurance recovery. Combined with the absence of debt and cash disclosure, that means the D round proves financing access, not capital adequacy. Until management provides a current cash bridge and obligations schedule, Black Lake should be treated as financeable but still opaque on runway.
