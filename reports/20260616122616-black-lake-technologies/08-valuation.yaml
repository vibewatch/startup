- id: TV004
  title: Comparable valuation table
  layout: wide
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - PTC
    - Q2'26 ARR $2.36bn; market cap $13.26bn
    - ~5.6x ARR
    - Mature industrial software benchmark with meaningful recurring revenue and profitability.
    - Broader product set and more mature installed base than Black Lake.
  - - Autodesk
    - Apr-2026 revenue $1.93bn; market cap $41.93bn
    - ~5.4x annualized quarterly revenue
    - Large design-software anchor for software scarcity and recurring revenue quality.
    - Far larger and more global than Black Lake; not a factory-ops pure play.
  - - Procore
    - Q1-2026 revenue $359m; market cap $6.39bn
    - ~4.4x annualized quarterly revenue
    - Useful vertical-workflow SaaS benchmark with strong RPO disclosure.
    - Construction workflow is adjacent, not direct manufacturing execution.
  - - Plex / Rockwell transaction
    - Strategic sale to Rockwell
    - Acquired for $2.22bn cash
    - Direct manufacturing-software M&A precedent showing strategic value for cloud-native factory platforms.
    - Revenue base and transaction multiple were not fully disclosed.
  - - Tulip
    - Series D private round; 1,000+ sites in 45 countries
    - $1.3bn valuation
    - AI-native manufacturing workflow private comp with clearer global scale disclosure.
    - Private round, not a public-clearing valuation; financial detail still limited.
  - - Augury
    - Series E private round
    - '>$1bn valuation on $180m raise'
    - Adjacent industrial-AI comp proving investor appetite for industrial intelligence assets.
    - Machine-health category is adjacent rather than directly cloud-MES.
  notes: 'Coverage is partial: the table mixes public, private, and strategic references because no single comp set cleanly matches Black Lake''s stage, geography, and product scope.'
  enumerationScope:
    coverage: partial
    basis: Includes the clearest public, private, and strategic software references fetched in this run for manufacturing workflow and adjacent industrial-AI valuation framing.
