- id: TV002
  title: Thesis / anti-thesis table
  layout: wide
  columns:
  - Argument
  - Evidence base
  - What would change the view
  rows:
  - - 'THESIS: Black Lake appears to lead a real cloud-MES niche'
    - Near-40,000 factory scale, 52.7% niche-share claims, and multi-product manufacturing workflow coverage create genuine platform value.
    - Confidence rises if management reconciles customer-count definitions and shares independent IDC methodology plus audited financial detail.
  - - 'THESIS: Industrial AI can expand value above the base MES story'
    - Coverage on AI agents, global expansion, and workflow automation suggests the company is trying to monetize decision support, not just digitize records.
    - View strengthens if AI attach rate, pricing, and ROI are disclosed by cohort or customer segment.
  - - 'ANTI-THESIS: Public proof is still weaker than the valuation headline'
    - The open-web record repeats profitability and share claims but omits the current revenue base, margins, and retention needed to defend the mark.
    - View improves only when current ARR or revenue and gross-margin quality are disclosed.
  - - 'ANTI-THESIS: Black Lake may still skew toward lighter deployments than premium enterprise software'
    - External comparison coverage says the product is strongest in quicker SMB cloud deployments and weaker in highly complex large-factory contexts.
    - View improves if large-enterprise ACV, deployment depth, and expansion evidence contradict the lightweight-deployment framing.
  notes: Arguments are framed around what would move the underwriting call, not around static company-quality slogans.
