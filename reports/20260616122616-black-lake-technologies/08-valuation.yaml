- id: TV005
  title: Thesis-break and kill triggers table
  layout: standard
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof
    - Current revenue turns out to be far below the level needed to support even the low end of base-case valuation
    - Would make the >RMB7bn mark look like a public-comp dislocation rather than justified scarcity pricing
    - Re-cut to bear case or walk away from the current process
  - - Retention / gross margin quality
    - NRR, logo retention, or gross margin are materially below what premium software pricing assumes
    - Would show that reported profitability and scale do not translate into durable software economics
    - Require a much lower entry price or stop
  - - Enterprise-fit ceiling
    - Large-factory ACV expansion is weak and the product remains concentrated in lighter deployments
    - Would cap upside and reduce the relevance of premium manufacturing-platform analogs
    - Shift from platform thesis to lightweight-tool thesis
  - - Funding-window reset
    - Next financing is flat or down despite the 2026 AI narrative
    - Would validate public-multiple-compression risk and compress exit optionality
    - Treat the current valuation as too demanding
  - - Disclosure behavior
    - Management still withholds KPI and cap-table detail in a serious process
    - Would confirm that the information asymmetry is structural, not temporary
    - Do not progress beyond watchlist status
  notes: Kill triggers are designed to be monitorable and valuation-linked rather than generic operating risks.
  claimRefs:
  - CV027
  - CV039
  - CV043
  - CV044
- id: TV006
  title: Final diligence asks table
  layout: wide
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue / ARR
    - Latest monthly ARR, LTM revenue, and bridge from 2025 to 2026 growth
    - Needed to convert the >RMB7bn mark into an actual revenue multiple rather than a headline.
    - Management finance pack; CFO or investor materials
  - - Gross margin and services mix
    - Software gross margin, implementation burden, and contribution margin by product line
    - Separates true software leverage from services-heavy growth.
    - Finance data room plus cohort analysis
  - - Retention quality
    - NRR, gross retention, logo retention, churn by customer segment
    - Determines whether public-comp multiples are even directionally relevant.
    - Board pack or sales-ops retention dashboard
  - - AI monetization
    - Attach rate, pricing, renewal behavior, and ROI for agent modules
    - Tests whether the AI narrative increases ACV or is mostly positioning.
    - Product analytics plus customer reference calls
  - - Cap table and preferences
    - Post-Series-D ownership, liquidation preferences, ratchets, and employee dilution
    - Without this, enterprise-value scenarios cannot be converted into equity outcomes.
    - Legal counsel and cap-table export
  - - Geography and enterprise mix
    - Revenue by country, vertical, and ACV band; enterprise vs SMB concentration
    - Shows whether the company is really moving upmarket and global or mainly extending its domestic core.
    - Revops segmentation export and regional sales review
  notes: Each ask is directly valuation-relevant and tied to a decision that would change the recommendation, confidence, or acceptable entry price.
  claimRefs:
  - CV041
  - CV042
  - CV043
