- id: scenario-range-and-multiple-sensitivity
  title: Scenario range and multiple sensitivity
  body: |-
    The comparable set argues for caution on entry price rather than skepticism on the category. PTC, Autodesk, and Procore all trade in roughly mid-single-digit revenue-equivalent bands in June 2026, and all three show meaningful market-cap compression versus 2025. Strategic and private references are richer than that—Rockwell paid $2.22 billion for Plex, while Tulip and Augury both sustained unicorn valuations in adjacent manufacturing and industrial-AI categories—but those cases came with clearer scale or strategic-asset framing than Black Lake has disclosed publicly.

    That is why a scenario model is more honest than a point estimate. At RMB7 billion post-money, the implied multiple is extremely sensitive to the hidden revenue denominator. If current revenue is only a few hundred million RMB, the price looks stretched relative to public comps; if revenue is already well into the upper hundreds of millions with credible profitability and retention, the same price can look fair. The evidence supports a wide band, not precision.
  claimRefs:
