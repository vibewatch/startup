  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-base
    missingEvidence: Current ARR or revenue, with bridge to the >60% growth claim and a clear definition of what is counted.
    whyItMatters: Without the revenue denominator, the >RMB7bn post-money valuation cannot be classified as fair or stretched with confidence.
    diligencePath: Request a CFO KPI pack with monthly ARR, LTM revenue, customer segmentation, and reconciliation to the April 2026 financing deck.
    relatedQuestionRefs:
    - QV021
  - type: private-evidence-only
    severity: material
    topic: unit-economics-quality
    missingEvidence: Gross margin, NRR, logo retention, services mix, and cohort expansion metrics.
    whyItMatters: Public comps assume durable software economics; those metrics determine whether Black Lake deserves any premium to the listed peer band.
    diligencePath: Obtain board or investor materials showing gross margin and retention by product line and customer cohort.
    relatedQuestionRefs:
    - QV025
  - type: missing-source
    severity: material
    topic: idc-methodology
    missingEvidence: The underlying IDC report or methodology that supports the repeated 52.7% share claim.
    whyItMatters: A repeated secondary citation is useful narrative proof, but not enough to underwrite market leadership with high confidence.
    diligencePath: Request the IDC report excerpt, methodology note, or licensed analyst brief that defines the addressable niche and measurement period.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Post-Series-D ownership, liquidation preferences, ratchets, and employee-option dilution.
    whyItMatters: Enterprise-value scenarios are not useful to investors if preference or leverage structures absorb a large share of exit proceeds.
    diligencePath: Review the updated cap table, financing documents, and any side-letter protections from the 2026 round.
    relatedQuestionRefs:
    - QV022
    - QV030
  - type: private-evidence-only
    severity: material
    topic: ai-monetization
    missingEvidence: Agent attach rates, pricing, renewal behavior, and customer ROI segmentation.
    whyItMatters: The AI narrative only improves valuation if it changes contract value, retention, or strategic scarcity in measurable ways.
    diligencePath: Ask product, finance, and customer-success teams for AI module penetration, usage, pricing, and reference-customer outcomes.
    relatedQuestionRefs:
    - QV006
    - QV023
  - type: conflicting-data
    severity: minor
    topic: customer-count-definition
    missingEvidence: A reconciled definition of customer, factory, site, and active account across domestic and overseas deployments.
    whyItMatters: The difference between roughly 32,000 and roughly 40,000 deployments changes confidence in scale-based valuation arguments.
    diligencePath: Request a current customer and factory count by definition, region, and paid-vs-active status.
    relatedQuestionRefs:
    - QV004
