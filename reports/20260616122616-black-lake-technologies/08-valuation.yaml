- id: TV003
  title: Bull / base / bear scenario table
  layout: wide
  columns:
  - Scenario
  - Revenue proof assumption
  - Public-comp / private-comp lens
  - Indicative valuation range
  - Probability signal
  - Key risks
  rows:
  - - Bear
    - Current revenue remains in the low hundreds of millions RMB and retention or margins are mediocre.
    - Public comps dominate; market pays closer to compressed 2026 listed software bands than to private-unicorn scarcity.
    - RMB4.0bn-RMB5.5bn
    - Live risk if the hidden revenue denominator is too small or growth cools before the next financing.
    - Down round, slower enterprise expansion, or weak unit economics.
  - - Base
    - Revenue is in the mid-hundreds of millions RMB, profitability is real, and AI monetization is emerging but not yet fully proven.
    - Blend of public mid-single-digit comp discipline plus a modest private-company premium for category position.
    - RMB6.0bn-RMB8.0bn
    - Most plausible public-only range, but still low-confidence without current KPI disclosure.
    - Customer-count definition drift, opaque cap table, and uncertain AI attach rates.
  - - Bull
    - Revenue is in the upper hundreds of millions RMB, retention and gross margin are strong, and AI modules deepen ACV.
    - Private industrial-software scarcity and strategic value matter more than compressed public multiples.
    - RMB8.5bn-RMB10.5bn
    - Requires a data-room-quality disclosure package, not just more headline storytelling.
    - Execution on upmarket expansion and proof that AI contributes real commercial uplift.
  notes: Ranges are scenario enterprise-value-style frames tied to evidence gaps and public comp bands, not precise equity-value forecasts.
