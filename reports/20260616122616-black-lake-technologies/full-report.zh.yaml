      - number: '1.4'
        title: 里程碑、覆盖范围与早期风险信号
        blocks:
          - type: paragraph
            body: >-
              记录中最强的战略主线，是 Black Lake 从协同 SaaS 转向工业 AI。故事从工厂现场工作流协同起步，经由 Small Work Order 等快速部署产品演进，到 2023-2026 年被明确包装为
              AI 原生制造操作系统，配有报价、拆单、排产、生产和质量等工业 agent。这一转变并非纯营销话术：2026 年独立报道描述了具体 agent 类别、规模化任务量，以及管理层对中国制造业可能从低软件渗透直接跃迁到
              agent 驱动决策支持的判断。

                      地理野心也可见，但仍更像叙事而非经审计事实。公开资料提到 Singapore、Indonesia 和 Vietnam；Baidu 英文资料进一步称业务覆盖 12 个国家；China Daily 和界面则描述海外兴趣和出行增加。因此，公司更适合被描述为早期国际化，而非局限国内。

                      风险信号存在，但停留在摘要层。爱企查和 Baidu 资料页显示开庭公告、诉讼关系和股权冻结线索，但手头没有公开来源证明制裁、破产程序或产品召回事件。因此，不利结论需要细分：烟雾足以支持案卷级追踪，但披露实质不足以单独构成第一章级法律悬置红旗。
