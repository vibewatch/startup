              蜜雪和农夫尤其关键，因为它们说明 Black Lake 接入的是链主供应体系，而不只是孤立工厂。Black Lake
              自身材料把蜜雪放在服务庞大加盟网络的饮品供应链运营商位置；农夫则被描述为多水源、多工厂的饮料运营商，协调、计划响应和可追溯性与原始吞吐量同样重要。证据的局限也同样关键：几乎所有证据都由公司筛选。公开具名部署显然存在，但离开公司自己的客户故事，外部仍很少看到合同规模、续约时间或逐模块扩张的独立细节。
