      - number: '8.4'
        title: 最终尽调与否决触发器
        blocks:
          - type: paragraph
            body: >-
              最后的承保工作很直接，虽然不容易。投资人需要当前 KPI 包，而不是更多品类故事：当前 ARR 或收入、毛利率、留存、AI attach rate、地域组合，以及 Series D
              后股权结构表，其中包括任何优先权或下行保护条款。没有这些项目，建议无法上调，因为主要不确定性在估值质量，而不是产品认知。


              该论点也有清晰断点。如果留存或毛利率偏弱，如果收入远低于标题估值暗示的水平，或者公司仍更适合较小型云 MES 部署，而不是高 ACV
              企业项目，那么当前价格就过于苛刻。反过来，若公司转向上市公司式透明度，会显著提升信心。在那之前，Black Lake 应进入高优先级尽调观察名单，而不是立即投资队列。
