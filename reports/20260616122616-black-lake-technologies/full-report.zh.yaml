        title: 情景区间与倍数敏感性
        blocks:
          - type: paragraph
            body: >-
              可比公司集合支持的结论，是进入价格要谨慎，而不是质疑品类。2026 年 6 月，PTC、Autodesk 和 Procore 大致都在中个位数收入等价倍数区间交易，且三者相较 2025
              年都有明显市值压缩。战略和私募参照更高——Rockwell 以 $2.22 billion 收购 Plex，Tulip 和 Augury 也在相邻制造业和工业 AI
              品类维持独角兽估值——但这些案例公开披露的规模或战略资产属性都比 Black Lake 更清楚。


              因此，情景模型比点估值更诚实。在 RMB7 billion
              投后估值下，隐含倍数对隐藏收入分母极其敏感。如果当前收入只有几亿元人民币，相对公开可比公司价格就显得拉伸；如果收入已经进入数亿元高段，并且盈利能力和留存可信，同样价格可以看起来合理。证据支持的是宽区间，不是精确值。
