      - - AI agent 准确性风险
        - 频繁人工 override、客户投诉或高成本决策错误的证据
        - Override 率或错误损失明显高于管理层叙事
        - 将 agent moat 主张视为未证实，并下调采用假设
      - - SME 周期性需求风险
        - PMI 或客户数据显示 SMB 制造需求持续走弱
        - SMB 转化、流失或 seat 压缩连续两个或更多季度恶化
        - 重置 base-case 增长和回本预期
      - - 海外扩张风险
        - 每进入一个新国家都需要定制法律或数据传输工作，而不是可复制流程
        - 国家 launch 反复依赖紧急签证、定制托管或临时法律补丁
        - 压低扩张溢价，并要求更强的本地控制框架
