        - 新披露的诉讼程序或监管问询
        - 任何影响生产或跨境处理的重大索赔、禁令或数据治理问询
        - 暂停 underwriting，直到法律顾问量化责任和补救方案
      - - 私营公司披露风险
        - 数据室无法把收入、盈利能力、客户数和留存与公开叙事对齐
