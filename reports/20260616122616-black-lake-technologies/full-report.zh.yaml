  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: 五层堆栈概括 Black Lake 公开材料中描述的制造软件、数据、集成和 AI 界面。
    data:
      layers:
        - label: 第 1 层 — 工厂执行应用
