    agent，在生产、质量、仓储、排产和供应链协同中自动化工作流决策。
  customerFocus: 中国及越来越多海外制造商，覆盖从中小车间到复杂多工厂企业，行业包括食品饮料、汽车零部件、工业设备、电子、化工、医药及其他制造垂直领域。
