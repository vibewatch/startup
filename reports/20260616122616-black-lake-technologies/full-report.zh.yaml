  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与披露风险
        blocks:
          - type: paragraph
            body: >-
              Black Lake 最站得住脚的公开风险栈，要从公司和第三方法律来源的明文表述看起。小工单隐私声明、用户协议和法律声明圈出了很宽的数据治理边界：个人和业务数据可以被收集，经 OPENAPI
              接入的业务数据可用于模型训练和优化，跨境传输被纳入考虑，公开材料还声明不保证及时性和完整性，并限制责任。在此之上，爱企查显示仍有诉讼和开庭公告信号，但细节不足，外部无法判断严重程度。对投资人来说，承保问题不只是「公司今天是否违规」，而是「一家正营销
              AI-native 和海外扩张雄心的私营公司，背着多少合规、责任和披露不确定性」。风险被进一步放大，因为本轮最乐观的增长、盈利、估值和客户数指标，仍来自媒体或公司关联披露，而不是经申报审计的财务数据。
