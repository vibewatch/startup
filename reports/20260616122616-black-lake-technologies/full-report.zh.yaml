  - id: TV002
    title: Thesis / anti-thesis 表
    layout: wide
    columns:
      - 论点
      - 证据基础
      - 什么会改变判断
    rows:
      - - THESIS：Black Lake 看起来领先一个真实的云 MES 细分市场
        - 近 40,000 家工厂的规模、52.7% 细分份额主张，以及多产品制造工作流覆盖，构成真实平台价值。
        - 若管理层能对齐客户数口径，并分享独立 IDC 方法论及经审计财务细节，置信度会上升。
      - - THESIS：工业 AI 可把价值扩到基础 MES 故事之上
        - 围绕 AI agents、全球扩张和工作流自动化的覆盖显示，公司试图把决策支持货币化，而不只是把记录数字化。
        - 若按 cohort 或客户细分披露 AI attach rate、定价和 ROI，判断会更强。
      - - ANTI-THESIS：公开证据仍弱于估值 headline
        - 公开网络记录反复提及盈利能力和份额主张，却缺少支撑标记所需的当前收入基数、利润率和留存。
        - 只有披露当前 ARR 或收入及毛利率质量，判断才会改善。
      - - ANTI-THESIS：Black Lake 可能仍偏向轻量部署，而非 premium enterprise software
        - 外部对比覆盖称，产品在更快的 SMB 云部署里最强，在高度复杂的大型工厂场景里较弱。
        - 若大型企业 ACV、部署深度和扩张证据能反驳轻量部署框架，判断会改善。
    notes: 这些论点围绕什么会改变 underwriting 判断，而不是静态的公司质量口号。
