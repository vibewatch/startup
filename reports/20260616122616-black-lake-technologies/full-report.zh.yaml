companyProfile:
  summary: >-
    Black Lake Technologies 是一家总部位于上海的工业软件公司，成立于 2016 年，已从云端制造协同演进为其所称的 AI 原生制造操作系统。核心产品栈包括面向大型多工厂的 Black Lake
    Intelligent Manufacturing、面向小型高混合度制造商的 Black Lake Small Work Order、供应链协同工作流，以及较新的工业 AI agent
    层，覆盖报价、拆单、排产、生产和质量决策。公开资料充分支持其真实客户采用、快速部署的云定位和 2026 年 4 月大额 Series D，但财务质量、治理细节和经核对运营指标仍留下重大披露缺口。
