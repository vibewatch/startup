  - id: TI003
    title: 单位经济表
    columns:
      - 指标
      - 数值 / null
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 收入增长
        - '>60% YoY（公司披露）'
        - 中
        - 释放真实商业动能信号，但绝对收入基数未披露，因此无法归一化判断增长质量
        - 提供 2024 至 2026 年月度或季度收入，并标明经常性收入与服务组合。
      - - 盈利状态
        - 全面盈利（公司披露）
        - 中
        - 这是关键质量标记，但没有经营利润率或现金流细节，不能证明软件经济性可持续
        - 提供过去 12 个月 EBITDA、经营现金流和调整后自由现金流。
      - - 毛利率 %
        - null
        - 低
        - 判断 Black Lake 更像软件平台还是人力密集实施业务的核心测试
        - 提供合并毛利率，并拆分软件、服务、伙伴交付工作和 AI agent 用量。
      - - CAC 回收月数
        - null
        - 低
        - 用来判断销售效率，以及新业务收回获客支出需要多久
        - 提供混合 CAC、分细分市场 CAC，并按 SME 套餐、企业和 AI agent 追加销售拆分回收期。
      - - NRR / churn
        - null
        - 低
        - 留存对收入质量的决定性，远高于一次性融资头条
        - 提供过去八个季度的总留存、净收入留存和 logo 流失。
      - - 部署强度代理指标
        - 企业 4–6 周 vs SME 2–5 天
        - 中
        - 实施周期是公开信息里判断支持负担和各细分市场服务强度的最佳代理指标
        - 按 cohort 提供平均实施工时、伙伴使用率和上线时间。
      - - 员工数代理指标
        - 500+ 员工、200+ 技术人员（招聘页说法）
        - 低
        - 粗略指示成本基础和研发负担，但不是当前经审计员工数
        - 提供当前 FTE 数、全负荷薪酬，并拆分研发、服务、销售和 G&A。
    notes: 多数单位经济字段仍为 null，因为 Black Lake 未公开披露利润率、留存、CAC 或现金流指标。非 null 行是公司声称的牵引力或运营代理指标，不是经审计经济性。
