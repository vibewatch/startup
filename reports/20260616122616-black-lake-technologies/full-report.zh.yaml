      - number: '2.2'
        title: 中国规模测算视角与需求背景
        blocks:
          - type: paragraph
            body: >-
              最有决策价值的规模测算视角，是公开的中国 MES 市场，而不是泛泛而谈的“工业软件” TAM。IDC 2024 年市场读数显示，中国 MES 解决方案市场为 RMB15.91 billion，其中软件
              RMB6.29 billion，公有云 SaaS MES 为 RMB1.005 billion。这几层很重要，因为它们同时显示机会与约束：Black Lake
              在一个真实且增长的软件品类中竞争，但公有云切片仍远小于服务加软件的完整池子。因此，公司承销逻辑不应依赖宣称一个巨大的理论市场，而应看它能否在部署偏好转向云原生、跨工厂协同和 AI 增强工作流时拿份额。


              中国的宏观采用背景足够支撑这种迁移。CAICT 称，截至 2025 年底，89.6% 的规模以上工业企业已经开展数字化转型，设备数字化率达到 57.7%。汽车、造船和电子行业数字化最深，全国基础设施也在扩张：超过
              30,000 家基础级智能工厂、超过 1,200 家先进级智能工厂、超过 230 家卓越级智能工厂，以及覆盖全部 41 个工业大类的全国 5G+工业互联网。NBS
              关于联网设备、工业机器人和增材制造的数据强化同一个判断：中国制造业已经不再争论数字化是否重要，而是在选择哪些软件层、交付模式和 AI 功能能最快带来运营回报。
