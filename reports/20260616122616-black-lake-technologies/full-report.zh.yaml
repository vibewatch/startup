  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              从商业叙事看，Black Lake 值得投；但从价格已经可承保的投资决策看，还不够。2026 年 4 月这一轮融资真实存在，新钱规模得到大致交叉印证，投后估值超过 RMB7 billion，也与 Tencent
              和 Crunchbase 报道中的独角兽叙事一致。同一组来源还称，公司已经盈利，收入同比增长超过 60%。这些要素足以支撑工业软件公司的高溢价私募估值。


              问题是，公开网络记录止步于标题。公开来源没有披露当前收入基数、毛利率、净留存或股权结构条款，投资人无法把 RMB7 billion 价格转换成真正经过风险调整的回报情景。这个缺口太大，不能轻描淡写带过，因为
              2026 年 6 月公开软件倍数并不宽松。因此有纪律的结论是继续研究：Black Lake 也许配得上强估值，但以现有证据，当前价格还不能称为有吸引力。
            claimRefs:
              - CV001
