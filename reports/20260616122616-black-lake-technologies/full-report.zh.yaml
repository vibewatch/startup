chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Black Lake Technologies 将自己定位为一家创立于上海的工业软件公司，围绕云端制造协同搭建业务。官方材料中，公司始终把 2016 年作为身份锚点；不过，一个已知运营公司的实体登记记录始于
              2017 年。这个差异不推翻运营叙事，但后续尽调应区分品牌历史和法律实体历史，不能把两者当作同一事实。

                      如今的产品栈已经足够支撑双层市场进入叙事。Black Lake Intelligent Manufacturing 面向需要跨车间、跨工厂协同的大型工厂；Black Lake Small Work Order 则被包装成面向小型、变化更大的制造商的轻量入口产品。两者都主打云原生、快速部署，且成本明显低于传统 MES 上线。这一定位很关键，因为它解释了 Black Lake 如何同时宣称拥有大型知名客户和极宽的长尾工厂覆盖。

                      同一组资料也暴露了一个核心尽调注意点：Black Lake 的公开规模说法方向上很强，但数字并不一致。不同页面称其服务 4,000+、32,000+、34,000+ 或近 40,000 家工厂或客户。正确做法不是平均这些数字，而是把 Black Lake 视为已经明确规模化，同时在估值工作使用任何单一客户数量前，要求公司提供经核对的 KPI 包。
