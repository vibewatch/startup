        - label: 第 4 层 — 集成与生态
          detail: 标准 openAPI、ERP / OA / 数据采集连接、一站式登录、生态伙伴，以及公开 Java SDK / GitHub 界面。
        - label: 第 5 层 — 工业 AI 运行层
