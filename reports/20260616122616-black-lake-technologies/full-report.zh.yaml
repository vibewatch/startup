      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Black Lake 2026 年 4 月 Series D 得到多家独立新闻来源充分支持：公司融资近 RMB1 billion，投后估值超过 RMB7 billion，也因此进入 Crunchbase 4
              月榜单的独角兽叙事。财新提供了最具体的投资人披露，点名五家参与方，并称本轮是公司第六次融资。围绕本轮的资金用途叙事也一致：管理层称资金将加速工业 AI 落地和全球扩张。

                      不一致的是累计融资历史。较早官方材料称公司到 C 轮时已融资近 RMB1 billion，而 CB Insights 在抓取时仍显示总融资仅 $108.53 million。这些数字或许可通过数据库滞后、汇率折算，或对未披露中间轮次处理不同来解释，但公开记录没有替读者完成核对。

                      尽调上，正确解读是 Black Lake 看不到融资渠道问题，但公开融资台账不够干净，不能直接塞进所有权或稀释模型。Series D 后股权结构表仍是必需索取项。
