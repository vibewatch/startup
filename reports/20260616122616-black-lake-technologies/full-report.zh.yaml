  - id: TI004
    title: 资本充足性表
    columns:
      - 指标
      - 公开值 / 状态
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 最新融资轮
        - 2026 年 4 月近 RMB1bn Series D
        - 高
        - 证实公司仍能获得外部资本，也说明投资者仍愿意押注工业 AI 逻辑
        - 提供已签署的交割备忘录、一级与二级交易拆分，以及公司实际收到的精确款项。
      - - 最新估值
        - '>RMB7bn post-money / ~$1.3bn Crunchbase 折算'
        - 中
        - 为后续融资锚定稀释和估值，但准确股数和汇率口径缺失
        - 提供投后股数、完全稀释股本，以及投资人材料采用的估值方法。
      - - 融资轮次脉络
        - 公开来源称 D 轮是继天使轮、A 轮、A+ 轮、B 轮、C 轮后的第六次融资
        - 中
        - 能支撑融资历史的成熟度，但不能证明累计到账现金的准确数
        - 提供逐轮融资到账额、领投方、证券类型和所有权稀释。
      - - D 轮前累计资本
        - 未对齐：官方 / 招聘页面与数据库页面无法干净匹配
        - 低
        - 资本台账过时，会扭曲稀释、所有权和 runway 建模
        - 提供一张对齐后的公司成立以来资本表，列明汇率口径，以及是否纳入风险债或其他融资工具。
      - - 募资用途
        - 工业 AI 推广和全球扩张
        - 中
        - 有用，因为它指向未来现金很可能投向 R&D、部署和海外 GTM
        - 提供 24 个月经营计划，并按 R&D、商业化、服务和海外扩张拆分预算。
      - - 账面现金 / 月度 burn / runway
        - null
        - 低
        - 这是资本充足性的核心测试，但公开记录完全缺失
        - 提供月末现金、净 burn、总 burn、runway，以及增长放缓下的下行 runway。
      - - 债务 / 项目融资义务 / 或有负债
        - 未披露债务明细；Aiqicha 显示诉讼和开庭公告，但没有风险敞口金额
        - 低
        - 隐性义务可能实质改变有效 runway 和下行保护
        - 提供债务明细、租赁义务、担保、诉讼准备金和保险覆盖。
    notes: 公开来源能证明公司拿得到融资，也能说明募资用途，但不能证明 runway。现金、burn、债务和或有负债披露是最关键的缺口。
    enumerationScope:
      coverage: partial
      basis: >-
        Includes every capital-adequacy field named in the chapter brief that is either publicly disclosed or explicitly
        absent in the reviewed source set.
    claimRefs:
