      - number: '5.3'
        title: 部署成熟度、客户证明与路线图方向
        blocks:
          - type: paragraph
            body: >-
              Black Lake 的公开部署证明强于许多工业 AI startup，因为它能指向具名工厂上线，而不只是 AI demo。官方材料称 Intelligent Manufacturing
              可以在四到六周上线，Small Work Order 约两到五天上线；Yada、蒙牛、立白和农夫山泉等案例显示，产品触达计划、生产、质量、设备和跨工厂协同。Yada 案例对产品尽调尤其有用，因为它详细描述了
              SCADA 与 ERP 集成、受 SOP 约束的生产步骤、数字记录、追溯和设备质量分析。立白和蒙牛则把证明延伸到以工单为中心的编排、包装、仓储、设备连接和质量数字化叙事。


              公开结果证据仍多由公司挑选，但足够具体，可以勾勒成熟度。Black Lake 发布了工作流和成果说法，例如节省 7,000 人时、交付率从 50% 提升到 90%、废品率低于
              1%，以及农夫山泉的大型多工厂效率提升。独立来源强化了公司不再只是协同 SaaS 厂商的判断：2026 年报道集中在工业 AI agent、近 RMB1 billion D 轮、盈利，以及扩张到 12
              个国家。这表明路线图正在向 AI 原生制造操作系统移动，并叠加在已经部署的执行覆盖之上。主要注意点是客户数量和市场份额指标在各来源间漂移，因此仍需直接尽调带日期的指标定义。
