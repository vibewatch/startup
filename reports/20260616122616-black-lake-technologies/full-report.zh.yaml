  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              Black Lake 的相关市场不是整个自动化栈。产品证据显示，它的软件切入口围绕制造执行、协同和数据可见性，服务那些需要更快计划、更好追溯，以及跨工厂或供应链更紧密协同的工厂。因此，直接相关的支出池包括 MES
              软件、云制造协同，以及质量、仓储、设备和供应商协同等相邻工作流软件；不包括自动化硬件、机器人 capex 或通用 ERP 会计模块，即便这些系统也触达同一批工厂工作流。


              替代品集合很关键，因为 Black Lake 的取胜叙事，是把自己放在传统本地部署 MES 和 ERP
              重实施模式的对立面，而不是与“完全不用软件”竞争。官方材料反复强调云部署、快速上线、较低前期成本和移动端可用性。大企业产品承诺多工厂标准化和 API 驱动集成，Small Work Order
              则面向仍依赖表格、聊天工具、滞后报表或僵硬遗留软件的 SME，主打更轻、更快、成本更低。读懂市场的关键就在这里：Black Lake
              争夺的是比完整智能工厂栈更窄、但更可执行的软件预算，同时仍受益于更广的数字化和工业 AI 顺风。
