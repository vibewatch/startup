      - number: '1.2'
        title: 创始人、管理层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO 周宇翔是 Black Lake 最清晰的公开面孔。多份传记资料称，他在 Dartmouth
              学习计算机科学，曾在投行从事工业交易，早期做过一个数据密集型制造创业项目但未成功，之后在工厂一线停留并重建 Black Lake。这一路径有战略意义：Black Lake
              当前产品哲学明确拒绝抽象复制工业软件，而是从真实制造现场发现狭窄、工作流级痛点。

                      周宇翔之外的治理可见度更弱。爱企查披露了上海黑湖科技有限公司的董事名单，足以证明公司已不再是一人创始人空壳，但不足以支撑对实际控制权的判断。公开材料没有解释董事会委员会、投资人席位、否决权，或 2026 年 Series D 后创始人经济权益。因此，市场能观察到的信息与投资人判断治理质量所需信息之间仍有明显尽调缺口。

                      因此，管理层叙事在创始人与市场匹配上很强，在正式治理透明度上偏弱。对一家中国后期私营软件公司来说，这并不少见，但仍应视为真实承销缺口，不能默认无碍。
