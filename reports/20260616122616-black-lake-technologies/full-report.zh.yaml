      - number: '8.2'
        title: 市场证明与可比背景
        blocks:
          - type: paragraph
            body: >-
              Black Lake 的估值故事背后确有真实运营证明。2026 年 4 月至 6 月多篇文章反复提到近 40,000 家工厂覆盖、中国云端生产管理细分市场 52.7% 份额说法，以及从云 MES 转向工业 AI
              agents 的拐点。官方产品页支持一个判断：公司拥有多产品栈，而不是单一轻量工具；AI 叙事也绑定报价、排产、生产和质量等真实工作流，而不是泛化的 copiloting 层。


              即便如此，竞争背景是混合的，不是一边倒。最强的外部对比文章仍把 Black Lake 总体排在鼎捷和 Siemens 之后，并特别提醒，Black Lake 最强的是更快的 SMB
              云端部署，而不是最复杂的大型工厂环境。这对估值很重要，因为除非管理层能证明 AI 和企业版把公司更快拉向上游，否则平均合同价值扩张可能受限。
