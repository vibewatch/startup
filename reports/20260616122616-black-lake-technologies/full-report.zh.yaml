      - number: '4.3'
        title: 资本充足度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从市场准入这个狭义角度看，Black Lake 不像资本受限。2026 年 4 月 D 轮得到独立媒体广泛交叉印证，报道中投后估值超过 RMB7 billion，说明外部资本仍给公司的工业 AI
              定位赋予战略价值。各来源也一致描述本轮用途：加速 AI 在真实制造工作流中的部署，并支持全球扩张。这些用途对业务合理，但也意味着 R&D、实施、伙伴赋能和海外商业团队建设仍会持续消耗现金。


              更难的问题是，本轮是否让 Black Lake 资本充足；公开证据回答不了。公司没有在任何经审阅来源中披露在手现金、月度 burn、runway、债务、租赁承诺或 covenant
              结构。即便生命周期融资台账也很混乱：官方和招聘界面对 D 轮前累计融资有不同表述，CB Insights
              在抓取时仍显示低得多的总融资额。这可能反映数据库滞后、汇率换算或轮次覆盖不完整，但尽调要点相同：公开资本栈尚不能直接放进稀释或 runway 模型。


              或有负债也至少有一些不利信号。爱企查显示 1 条法院公告、15 条开庭公告和 5 条诉讼关系，但经审阅来源都没有量化经济风险敞口、准备金或保险回收。再叠加债务和现金披露缺失，D
              轮证明的是融资能力，不是资本充足。管理层提供当前现金 bridge 和义务清单之前，应把 Black Lake 视为可融资，但 runway 仍不透明。
