  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以工厂工作流定义的产品表面
        blocks:
          - type: paragraph
            body: >-
              Black Lake 公开可见的产品表面，围绕两个区分清晰的工厂操作系统搭建。Black Lake Intelligent Manufacturing
              面向需要多角色、多工厂、且常常连接供应链执行的大型组织；Black Lake Small Work Order
              面向需要更快设置、更轻培训和订单驱动执行的小型工厂。两个产品表面都持续围绕计划、生产管理、仓储、质量、设备和追溯定位，而不是一个狭窄仪表盘或数据分析
              SKU。产品文档和公司资料反复强调，软件要把实时生产数据转成工作流协同，而不只是把纸面流程数字化。


              对大型工厂，最强公开证据来自 Intelligent Manufacturing 页面和公司深度介绍：它们描述了 50 多个业务 app、灵活模块组合，以及以浏览器为先的 SaaS
              表面，包含数据报表、工厂建模、排产和库存管理。对小型工厂，Small Work Order 把工作流向前延伸到报价、接单、采购和下游履约。它也保留了升级到更重 Intelligent Manufacturing
              栈的可见路径，说明产品分层依据的是组织复杂度，而不是完全独立的代码库。2026 年排名式白皮书还引入第三条线 Black Lake Light
              Manufacturing，但该线公开资料远少于另外两条，仍是尽调事项。
