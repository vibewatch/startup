        blocks:
          - type: paragraph
            body: >-
              公开材料能证明的是扩张逻辑，不是留存数学。立白从试点到全工厂的表述、农夫的多工厂协同、雅达的集团级管理故事，以及蜜雪从单工厂到多工厂再到上下游协同的叙事，都指向一种先落地再扩张的路径：Black Lake
              试图成为跨工厂、跨供应节点的运营中间件。Alibaba Marketplace 的客户证言也露出中型市场和 SME 路径：替换僵硬的传统 MES
              或电子表格，先快速拿到可视化收益，再在较短验证期后扩大使用。定性上这有价值，因为它说明扩张如果发生，更可能按站点和工作流推进，而不只是按席位推进。


              短板在于耐久性证据。公开资料没有 NRR、GRR、logo 流失、平均合同期限、续约率或客户满意度序列，投资人无法把一次性灯塔胜利和可复利的存量客户区分开。SME 路径也不是软件意义上的自助式销售；Black
