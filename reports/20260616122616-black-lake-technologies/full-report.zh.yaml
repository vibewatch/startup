      - CI014
      - CI015
      - CI016
      - CI017
      - CI027
      - CI028
  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销判断的影响
      - 当前公开替代证据
      - 精确尽调路径
    rows:
      - - 经审计收入、ARR 和 bookings
        - 无法测试 >60% 增长来自有意义的经常性基础，还是项目型业务占比很高的基础
        - 只有公司声称的增长和较早招聘页面里程碑
        - 索取 24 个月月度经常性收入、服务收入、bookings，以及经审计年度报表。
      - - 毛利率和服务交付成本
        - 无法判断规模化能力，也无法判断盈利形态更像软件还是靠人力辅助
        - 只有实施周期代理指标和 SaaS 定位
        - 索取产品层面和公司层面毛利率，并拆分软件 / 服务 / 合作伙伴。
      - - 账面现金、burn 和 runway
        - 即使完成 D 轮，也无法承销偿付能力、下一轮融资时点或下行缓冲
        - 只有融资轮规模和披露的募资用途
        - 索取资金报告、月度 burn 桥、约束性条款摘要和下行 runway 情景。
      - - SME 套餐、企业订阅、服务和 AI agents 的收入结构
        - 无法看清增长是由可规模化的经常性软件驱动，还是由高接触部署工作驱动
        - 只有产品分层和定价逻辑
        - 索取分部 P&L、各分部 ACV，以及 AI agents 对老产品的附加率。
      - - 实际价格、折扣、留存和 NRR
        - 标价本身不能说明收入质量或扩张效率
        - 只有 SME 产品官方标价和企业端定性定价模型
        - 索取前 50 大合同摘录，包括标价、净价、期限、续约状态和扩张历史。
      - - 客户集中度和应收账款质量
        - 即使有广泛工厂数量营销，少数大客户或回款慢也可能实质改变风险
        - 只有具名案例研究和宽泛工厂数
        - 索取按 ARR 排名前 20 的客户、收入占比、毛利率、续约日期，以及按 cohort 的 DSO。
      - - 诉讼经济影响和准备金
        - 尽管登记页面显示开庭公告和诉讼关系，潜在法律现金流出仍无法判断
        - 只有 Aiqicha 汇总数量
        - 索取案件清单、索赔金额、准备金、保险，以及管理层按概率加权的风险敞口判断。
    notes: 本表刻意强调公开证据没有披露的内容。本章核心结论是，Black Lake 的公开牵引力足以支持进入尽调，但披露不足以完成财务承销。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Enumerates the material financial, capital, pricing, and contingent-liability gaps that remain after reviewing
        the full retained source set for this chapter.
