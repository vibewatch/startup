  - id: TV006
    title: 最终 diligence 要求表
    layout: wide
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或 diligence 路径
    rows:
      - - 当前收入 / ARR
        - 最新月度 ARR、LTM 收入，以及从 2025 到 2026 增长的 bridge
        - 需要它把 >RMB7bn 标记转成实际收入倍数，而不是 headline。
        - 管理层财务包；CFO 或投资者材料
      - - 毛利率和服务组合
        - 软件毛利率、实施负担，以及按产品线划分的贡献利润率
        - 把真正的软件 leverage 和服务偏重型增长分开。
        - 财务数据室加 cohort 分析
      - - 留存质量
        - NRR、gross retention、logo retention、按客户细分划分的 churn
        - 决定公开可比公司倍数是否哪怕只有方向性相关。
        - 董事会材料或 sales-ops 留存 dashboard
      - - AI 货币化
        - Agent 模块的 attach rate、定价、续约行为和 ROI
        - 检验 AI 叙事是在提升 ACV，还是主要用于 positioning。
        - 产品分析加客户 reference calls
      - - Cap table 与 preferences
        - Series D 后所有权、清算优先权、ratchets 和员工稀释
        - 没有这些，enterprise-value 情景无法转换为股权结果。
        - 法律顾问和 cap table 导出
