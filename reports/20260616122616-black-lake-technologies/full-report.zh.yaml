      - number: '4.2'
        title: 增长、盈利与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开记录中支撑最强的财务标题，是 Black Lake 称其已经跨过一个重要商业化门槛。多家 2026 年 4 月媒体重复同一条管理层说法：收入同比增长超过 60%，公司全面盈利，工业 AI
              已在报价、拆单、排产和质量等真实工作流中规模化。新浪、CNFin/Xinhua、腾讯、财新、36Kr
              及其他媒体反复出现这一说法，使其不能被忽视，但它仍是公司披露的经营表述，而非经审计财务披露。手头没有来源把盈利说法转换为经营利润率、EBITDA、自由现金流、ARR 或收入基数。


              这个区别是财务质量的核心问题。公开来源让人容易相信 Black Lake 有客户，也有可花费的定价权，但没有显示盈利来自成熟软件毛利、异常低的销售和营销支出、伙伴辅助交付，还是某个时点服务与项目 mix
              较有利。即便规模指标，分母也会漂移：官方和准官方界面引用约 30,000、32,000、34,000 或近 40,000 家工厂或制造企业，市场份额说法也随年份和引用品类在 42.7% 与 52.7% 之间移动。


              因此，现有单位经济信号只是代理指标，不是答案。企业产品四到六周实施表述，意味着导入工作量明显高于 SME 产品两到五天上线。招聘页的 500+ 员工和 200+
              技术人员说法显示固定成本基础不小，界面关于定价转向的评论则暗示 Black Lake 相信 AI agent 能比经典 seat 定价更直接捕获价值。这些方向性信号可信，但不能替代毛利率、留存率、CAC
              payback 或分层收入 mix。
