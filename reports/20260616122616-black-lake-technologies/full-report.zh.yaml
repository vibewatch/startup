      - number: '6.4'
        title: 集中度与尽调风险
        blocks:
          - type: paragraph
            body: >-
              最大客户风险不在于 Black Lake 缺少具名证据，而在于这些证据异常集中于融资叙事天然会强调的客户类型。公开案例明显偏向食品、饮料、日化 FMCG
              以及其他供应链密集型运营商；在这些场景里，计划速度、可追溯性和多工厂协同都更显眼，也更容易营销。这不等于业务真的集中在那里，但如果投资人不按行业、产品和客户规模拆收入，公开证据集可能会高估相邻垂直行业的牵引力。客户规模也有同样偏斜：公司可以描述一个很大的装机基础，但具名证据仍主要来自灯塔企业，再加上一层很薄的泛
              SME 证言。


              采购尽调还有另一个角度。爱企查开庭公告等公开法律表面记录，不能证明客户受损或部署失败，但企业采购团队，尤其是受监管或上市客户，仍可能要求管理层解释。再叠加公开续约指标缺失和口径漂移，客户质量就不能只靠 logo
              承保。尽调路径很直接：要求公司提供可勾稽的客户 KPI 桥、头部客户集中度、分 cohort 留存，以及按企业客户和 SME 拆开的客户访谈包，而不是把一个汇总客户数当成持久需求的证明。
