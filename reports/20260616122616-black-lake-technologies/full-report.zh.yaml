  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层与装机基础轨迹
        blocks:
          - type: paragraph
            body: >-
              Black Lake 的公开客户故事，其实是一个标签下的两门生意。更重的 Smart Manufacturing 产品面向多工厂或运营复杂的制造商，这些客户关注跨站点计划、追溯、质量、设备和供应链同步。更轻的
              Mini Worksheet 路径面向较小型工厂，它们需要快速部署、工单可见性、库存纪律和车间报工，但不想做传统 MES 项目。这种切分很重要，因为它意味着不同买方、不同销售路径，也很可能意味着完全不同的 ACV
              和留存行为，即便公司只报告一个汇总客户总数。


              公开规模指标方向上很强，但分析上很乱。Black Lake 主页文案仍指向 4,000+ 家制造企业，较长公司资料提高到 32,000+ 家企业和中国及东南亚近 30,000 家工厂，World Economic
              Forum 资料称全球近 40,000 家工厂，2026 年公司撰写的市场文章又把数字推到 40,000+ 家工厂且增长
              40%。这些数字并非无用；它们确实显示公司已远超试点阶段。但它们并非同一分母，因此正确承销动作是把轨迹视为覆盖广度证明，同时明确拒绝在管理层桥接 enterprise、factory、site 和
              paying-customer 定义前，把任何单一公开客户数当作干净 KPI。
