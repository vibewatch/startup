  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Black Lake 的公开收入模式足以证明真实变现，但不足以建模实际合同经济性。官方产品页面把公司拆成更重的企业路径和更轻的 SME 路径：Black Lake Intelligent
              Manufacturing 面向更大型、多工厂、供应链较重的工厂；Black Lake Small Work Order
              则服务希望更快部署、降低前期支出的较小型高混合度制造商。这种分层在财务上很重要，因为公开证据指向两类路径在交付强度上明显不同，平均合同价值也可能不同。


              在 SME 层，公司如今给出了少见具体的标价。官方 2026 年 4 月定价说明称，Small Work Order 专业版定价为每年 RMB10,800，包含 50 个账号，额外账号每年
              RMB140；旗舰版定价为每年 RMB18,800，并增加采购、销售、质量和 PDA 工作流。同一来源还称产品仅以 SaaS
              形式销售，按年收费，不卖永久许可。这比泛泛的“联系销售”页面更有证明力，但仍是标价，不是实际成交价。


              到企业层和 AI 层，公开可见度急剧下降。官方制造页面称 Black Lake 按用户和模块采用年度订阅定价，并把首年成本定位为传统买断系统的大约五分之一，但不发布企业价目表。界面补充了一个重要变现细节：管理层称
              AI agent 费用会按相关工人大约一个月工资来定价，而不是简单按 seat 数。这表明 Black Lake 试图从经典 SaaS 包装转向混合模式，包含包费、账号扩张、模块增购和基于劳动力价值的 AI
              定价。投资人真正需要的部分仍缺失：实际合同价值、折扣、附加率、续约条款，以及软件与服务收入 mix。
