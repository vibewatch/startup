      - number: '3.2'
        title: 能力宽度、包装方式与真实买方重叠
        blocks:
          - type: paragraph
            body: >-
              Black Lake 与竞争对手确有重叠，但并不对称。相对 Siemens、SAP 和 Plex，重叠最强的是追溯、工厂执行、排产、质量和多系统集成。差异在包装：这些既有厂商把执行描述为广义 MOM
              或智能制造控制平面的一部分，并在标准、劳动力编排、企业分析、数字孪生和受监管工作流上有更强公开表述。Black Lake 的公开页面则更强调预置 app、云原生交付、API
              连接，以及面向中国制造商的实用多工厂或供应商协同。这让 Black Lake 看起来运营上更轻、更可适配，但在合规和企业治理细节上公开表述也更少。


              相对 Tulip，竞争在架构和买方心理上更接近。两家公司都销售云原生、可配置、API 连接的制造软件，带有 AI 或无代码角度，并承诺比传统 MES 更快实施。不过，Tulip
              在公开包装上明显更透明：它发布按界面计价、受监管行业附加模块，以及通过 AWS 和 Microsoft 呈现的伙伴 / 分销信号。Black Lake 仍主要通过相对说法披露经济性，比如低于传统 MES
              的成本和快速部署窗口。这足以支撑价值叙事，但还不足以让外部人像对 Tulip、Odoo、Katana 或 MRPeasy 那样精确对标标价经济性。


              竞争栈最低端也有战略意义，因为它会塑造买方预期。Odoo、Katana 和 MRPeasy 都告诉制造商，他们可以替代表格、手工订单跟踪和割裂库存工作流，而不用接受传统一年期 MES
              项目。对中小工厂来说，这些工具锚定了真实外部选项。Black Lake 的 Small Work Order
              在中国工作流语言和上下游协同上仍更贴近制造场景，但公开证据显示，采购压力仍会来自明确的月度软件价格和快速启动承诺，而不只是全球工业既有厂商。
