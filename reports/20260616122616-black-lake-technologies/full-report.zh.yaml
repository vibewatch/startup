  - id: TV003
    title: Bull / base / bear 情景表
    layout: wide
    columns:
      - 情景
      - 收入证明假设
      - 公开可比 / 私募可比视角
      - 指示性估值区间
      - 概率信号
      - 关键风险
    rows:
      - - Bear
        - 当前收入仍处在数亿元人民币低段，留存或利润率一般。
        - 公开可比公司主导估值；市场更接近压缩后的 2026 年上市软件公司区间，而不是私募独角兽稀缺性。
        - 估值区间 RMB4.0bn-RMB5.5bn
        - 若隐藏的收入 denominator 太小，或下一轮融资前增长降温，就是现实风险。
        - Down round、企业扩张放慢，或单位经济性偏弱。
      - - Base
        - 收入处在数亿元人民币中段，盈利能力真实，AI 货币化正在出现但尚未完全证实。
        - 公开市场中个位数倍数纪律，加上品类地位带来的适度私营公司溢价。
        - 估值区间 RMB6.0bn-RMB8.0bn
        - 这是仅基于公开信息最可信的区间，但没有当前 KPI 披露时置信度仍低。
        - 客户数口径漂移、cap table 不透明、AI attach rate 不确定。
      - - Bull
        - 收入处在数亿元人民币高段，留存和毛利率强，AI 模块加深 ACV。
        - 私营工业软件稀缺性和战略价值，比压缩后的公开市场倍数更重要。
        - 估值区间 RMB8.5bn-RMB10.5bn
        - 需要数据室级别披露包，而不只是更多 headline storytelling。
        - 向高端市场扩张的执行，以及 AI 确实贡献商业 uplift 的证明。
    notes: 这些区间是与证据缺口和公开可比公司估值带挂钩的 scenario enterprise-value-style 框架，不是精确的 equity-value 预测。
