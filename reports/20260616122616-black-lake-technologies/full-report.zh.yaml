      - number: '2.3'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Black Lake 实际上卖给两类买方路径。第一类是由 Black Lake Intelligent Manufacturing
              服务的大型工厂或集团工厂路径。这里的经济问题是跨厂标准化、多角色工作流控制，以及在不拖成长定制项目的情况下连接生产、仓储、质量、设备和供应商数据。立白、蒙牛和 Yada
              案例都符合这一逻辑：买方试图连接多个系统或多个站点，更在意透明度、可追溯性和协同执行，而不是简单的数字清单。因此，预算所有者可能由工厂或运营负责人和 IT
              或数字化转型团队共同承担，因为上线成功同时依赖工作流所有权和系统集成。


              第二类路径，是 Small Work Order 服务的 SME
              与高混合度制造切入口。该产品明确为小型工厂设计，这些工厂面临订单波动、非标作业、库存滞后和流程透明度弱等问题。更快部署和订阅定价降低了采用门槛，开放 API 又把升级到更重 MES
              需求的路径留出来，而不是形成硬产品断崖。战略上，这让 Black Lake 既能服务想要多工厂控制的自上而下买方，也能服务首先想要更快履约的自下而上买方。放到市场里，公司卖的不是一个无差别 MES
              产品；它按组织成熟度、工作流复杂度和价值兑现周期预期做分层。
