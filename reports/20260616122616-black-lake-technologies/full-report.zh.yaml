  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流 / 痛点
      - Black Lake 方案
      - 可衡量收益
      - 限制
    rows:
      - - 大型工厂生产计划员
        - 多工厂计划和实时进度分散在 ERP、表格、聊天和人工报告里
        - Intelligent Manufacturing 用一层 SaaS 打通计划、生产、仓库、质量和设备数据
        - 官方材料声称多工厂可视、计划响应更快、实时同步
        - 没有公开基准按模块拆解计划员效率提升
      - - SME 老板或车间负责人
        - 订单、采购、生产、库存和财务分开记录，且信息滞后
        - Small Work Order 把工作流围绕订单履约组织起来，并提高跨部门任务可见性
        - 官网示例声称报表和订单进度查询速度大幅提高
        - 公开证据逐案呈现，且由公司筛选
      - - 质量 / 追溯经理
        - 纸质记录和非标准表单让根因分析变慢
        - SOP 卡点的数字记录和一物一码追溯连接工艺、物料与成品数据
        - Yada 等案例描述了统一数字记录和追溯改善
        - 保存期限、审计日志和受监管记录控制未公开
      - - 链主或集团制造商的运营负责人
        - 上游供应商和多工厂必须围绕快速变化的需求协同
        - 云端协作从单一工厂延伸到上下游伙伴
        - Nongfu 和 Liby 案例语言指向更快响应、更少人工交接和更好资源使用
        - 缺少供应商接入时间或合作伙伴流失的硬证据
      - - 启用 AI 的工厂里的估价员 / 排程员
        - 资深员工手工拆单、报价并确定工单优先级
        - AI agents 在数据平台之上自动化拆单、生成报价和排程决策
        - 第三方报道称拆单降到分钟级，报价更快且响应率更高
        - agent 在大规模部署下的表现没有公开独立验证
    notes: 收益来自公开案例研究和公司筛选样本中的报告结果；它们说明方向，不是覆盖客户群的受控基准。
