  - id: TV005
    title: Thesis-break 与 kill triggers 表
    layout: standard
    columns:
      - 触发项
      - 阈值
      - 对 thesis 的传导
      - 行动含义
    rows:
      - - 收入证明
        - 当前收入远低于支撑 base-case 估值低端所需水平
        - 会让 >RMB7bn 标记看起来像公开可比估值错位，而不是有合理稀缺性定价
        - 重切到 bear case，或退出当前流程
      - - 留存 / 毛利率质量
        - NRR、logo retention 或毛利率明显低于 premium software pricing 的假设
        - 会说明已报告的盈利能力和规模无法转化为耐久的软件经济性
        - 要求大幅降低入场价，或停止
      - - 企业适配天花板
        - 大型工厂 ACV 扩张弱，产品仍集中在较轻部署
        - 会封顶上行空间，并降低 premium manufacturing-platform 类比的相关性
        - 从平台 thesis 转向轻量工具 thesis
      - - 融资窗口重置
        - 尽管有 2026 年 AI 叙事，下一轮融资仍持平或下行
        - 会验证公开市场倍数压缩风险，并压缩退出 optionality
        - 将当前估值视为要求过高
      - - 披露行为
        - 在严肃流程中，管理层仍不提供 KPI 和 cap table 细节
        - 会确认信息不对称是结构性的，不是暂时性的
        - 不要推进到 watchlist 之外
    notes: Kill triggers 设计成可监控且与估值挂钩，而不是泛泛的运营风险。
