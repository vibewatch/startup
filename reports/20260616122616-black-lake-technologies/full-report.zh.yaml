        - 重大客户 rollout 中，go-live 延迟或集成失败集中出现
        - Reference check 或部署 cohort 反复出现 ERP / 设备 / API 集成升级处理
        - 将服务产能和合作伙伴治理列为门槛型 diligence 项
    notes: Kill criteria 面向 IC 使用：每个触发项都应是管理层能在 diligence 中衡量或记录的东西，而不是模糊的情绪测试。
