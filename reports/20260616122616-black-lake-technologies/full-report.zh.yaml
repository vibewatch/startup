      - number: '3.3'
        title: 护城河耐久性、本土压力与仍缺失的证据
        blocks:
          - type: paragraph
            body: >-
              Black Lake 护城河最强的公开证据仍是运营证据，而不是财务证据。其产品材料反复强调快速部署、较低前期软件成本、模块化 API，以及覆盖大型工厂和小型高混合度制造商的中国本地工厂工作流契合度。相对
              Siemens、SAP 和 Plex，这是真实差异化；后者经审阅的公开页面更像企业控制塔套件。也正因如此，Black Lake 才有可能在重型全球 MOM 软件和通用 SMB
              库存工具之间占据一条可防守的中间车道。


              问题在于，中间车道只有在买方真的留在那里时才耐久。公开证据显示 Black Lake
              面临两个有意义的挤压风险。第一，鼎捷和赛意从中国内部进攻，拥有更广本地实施历史、上市公司信任信号和宽客户覆盖。第二，Tulip、Odoo、Katana 和 MRPeasy
              向买方展示，现代制造软件可以用更清晰的公开价格、更快的自助或引导式导入来购买。这意味着 Black Lake 的护城河可能在工作流和本地化上强于公开商业透明度。


              最大证据缺口是中立输赢数据。本章找到了许多产品和包装信号，但几乎没有独立公开证据显示 Black Lake 在具名评估中稳定击败或输给 Siemens、SAP、Tulip、鼎捷、赛意或轻量 MRP
              替代品。因此，竞争结论应保持克制：Black Lake 有可信且有证据支撑的细分位置，但公开来源尚未证明这一位置已被更高转换成本、续约经济性或对资金最充足替代方案的可重复替换锁定。
