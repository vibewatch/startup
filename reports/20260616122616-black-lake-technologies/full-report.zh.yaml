  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局分层与 Black Lake 的定位缝隙
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一个清晰的竞争分层，而不是一个无差别的“MES 市场”。在重量级一端，Siemens Opcenter、SAP Digital Manufacturing 和 Rockwell 的 Plex
              都把制造执行作为更广制造运营栈中的一层，与计划、质量、分析、自动化和企业系统相连。当买方已经处在 Siemens 自动化、SAP ERP 或 Rockwell/Plex
              质量与工厂系统中时，这些供应商就具备相关性，因为执行软件会成为更大记录系统决策的一部分，而不是独立工作流采购。


              在轻量一端，Odoo、Katana 和 MRPeasy 围绕库存、订单、采购和车间报工打包制造功能，价格在线透明，上手更容易。Tulip 介于两者之间：它比通用 SMB MRP 工具更聚焦
              MES，但仍出售云原生、可组合、基于 app 的运营软件，且有明确包装和伙伴主导部署。Black Lake 自己的双产品切分契合这一市场形态。Intelligent Manufacturing
              面向需要计划、质量、仓储和跨工厂协同的大型或多工厂，Small Work Order 则为高混合度中国 SME 设计，这类买方更在意快速上线、低学习成本和订单中心协同。


              中国本土对手与全球品牌同样重要。鼎捷和赛意都销售覆盖 MES、计划、质量并具备行业实施深度的广义制造软件套件，战略上比英文品牌露出的第一印象更接近 Black Lake 的中国核心机会。含义是，Black
              Lake 并不是在防守一个垄断品类。它守的是中间位置：比通用 ERP/MRP 工具更懂工厂，比经典重量级既有厂商更敏捷、更贴合本地，同时承受来自本土套件的压力，后者能凭更久渠道历史和中国企业信任发起进攻。
