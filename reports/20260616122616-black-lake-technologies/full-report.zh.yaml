          note: 开始更像稀缺性溢价，而不是泡沫倍数。
        - label: RMB600m 收入
          value: 11.7
          note: 若 AI 变现真实，接近可辩护的私募溢价。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 隐藏收入基数决定大部分估值不确定性，因此给出宽情景带比点估计更诚实。
    approximationNotes: 区间是以 RMB billions 计的指示性投后估值情景，不是承诺退出结果，也不是扣除优先权后的股权价值。
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV036
      - CV039
    data:
      items:
        - label: 熊市情景
          low: 4
          mid: 4.75
          high: 5.5
          unit: RMB bn
          note: 上市可比公司纪律占主导，增长证据令人失望。
        - label: 基准情景
          low: 6
          mid: 7
          high: 8
          unit: RMB bn
          note: 若隐藏收入基数和利润率扎实，当前估值标记大致合理。
        - label: 牛市情景
          low: 8.5
          mid: 9.5
          high: 10.5
          unit: RMB bn
          note: 需要强留存、高利润率软件经济性和可信的 AI 变现。
        - label: 当前披露估值标记
          low: 7
          mid: 7
          high: 7
          unit: RMB bn
          note: Tencent 及相关报道把当前投后估值锚定在 RMB7bn 以上。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Black Lake 在品类动能和活动证据上得分不错，但估值清晰度和证据完整度明显更弱。
    approximationNotes: 分数是基于证据集得出的 IC 风格 10 分制定性评级，不是管理层提供的 KPI。
    claimRefs:
      - CV006
      - CV008
      - CV015
      - CV027
      - CV040
      - CV042
    data:
      items:
        - label: 市场位置
          value: 8
          unit: /10
          note: 细分份额和客户规模说法很强，尽管尚未完全独立验证。
        - label: 产品 / AI 可选性
          value: 8
          unit: /10
          note: AI 工作流叙事足够具体，值得纳入判断。
        - label: 经济性可见度
          value: 3
          unit: /10
          note: 公司声称已盈利，但收入、毛利率和留存仍未公开。
        - label: 估值清晰度
          value: 2
          unit: /10
          note: 当前价格可见；分母和股权结构不可见。
        - label: 风险调整后上行
          value: 5
          unit: /10
          note: 存在合理上行空间，但高度依赖未披露指标。
        - label: 证据质量
          value: 4
          unit: /10
          note: 融资锚点不错；承销输入仍不完整。
