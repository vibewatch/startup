        - 仅在 2026 白皮书中提及
        - 暗示在完整 MES 与 SME 工单工具之间存在中间产品层
        - 除一个排名式来源外，公开功能级文档稀疏
      - - 数据 / 分析层（报表 + MI + 大数据栈）
        - 工厂经理、质量团队、运营分析师
        - 案例和产品文档声称已在生产中使用
