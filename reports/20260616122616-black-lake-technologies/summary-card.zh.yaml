  topRisks:
    - 当前收入、ARR、毛利率、留存和客户集中度均未披露，2026 年 4 月估值很难承销
    - 公开运营指标在不同来源之间冲突，尤其是客户数、市场份额口径、员工数和累计融资
    - 作为后期私营公司，治理和股权结构透明度有限，没有公开的 Series D 后所有权、董事会控制或优先股堆叠细节
