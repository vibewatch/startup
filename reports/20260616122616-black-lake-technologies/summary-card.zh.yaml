  topStrengths:
    - 云原生 MES 与协同栈已有证据显示部署快、实施成本更低，并能从中小企业到大型工厂做多层产品包装
    - 2025-2026 年反复出现的证据显示市场采用面较广，包括据称接近 40,000 家工厂 / 客户，以及跨多个行业的大型具名制造商
