- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Five-layer stack of Black Lake's manufacturing software, data, integration, and AI surfaces as described in public materials.
  data:
    layers:
    - label: Layer 1 — Factory execution apps
      detail: Production management, planning and scheduling, inventory, quality, equipment, and shopfloor reporting across Intelligent Manufacturing and Small Work Order.
    - label: Layer 2 — Workflow and configuration
      detail: Low-code forms, permissions, SOP gating, configurable logic, and order-fulfillment workflow design for different factory scenarios.
    - label: Layer 3 — Data and analytics
      detail: Factory modeling, data reports, MI analytics, and a Flink + StarRocks data stack for second-level collection and large-scale analysis.
    - label: Layer 4 — Integration and ecosystem
      detail: Standard openAPI, ERP/OA/data-capture connectivity, one-stop login, ecosystem partners, and a public Java SDK / GitHub surface.
    - label: Layer 5 — Industrial AI operating layer
      detail: Workflow customization, system-integration agents, code-generation support, and industrial AI agents for split order, quoting, scheduling, and quality decisions.
