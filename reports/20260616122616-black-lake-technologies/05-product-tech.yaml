company:
  name: Black Lake Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Black Lake Technologies sells a cloud-native manufacturing execution and collaboration stack whose strongest documented products are Black Lake Intelligent Manufacturing for larger multi-plant operations and Black Lake Small Work Order for SME factories. Public materials show real workflow depth in planning, production, quality, equipment, inventory, traceability, and integration, plus a visible but partially gated developer surface built around openAPI artifacts, GitHub repositories, and a Java SDK. The key diligence tension is that Black Lake's AI-native roadmap and market leadership claims look credible enough to matter, but reliability transparency, full API inspectability, and independent validation of AI-agent performance remain meaningfully thinner than the product ambition.
sections:
- id: product-surface
  title: Product surface in factory workflow terms
  body: 'Black Lake''s publicly visible product surface is built around two clearly differentiated operating systems for factories. Black Lake Intelligent Manufacturing targets larger organizations that need multi-role, multi-plant, and often supply-chain-connected execution, while Black Lake Small Work Order addresses smaller factories that need faster setup, lighter training, and order-driven execution. Across the two surfaces, the company consistently positions itself around planning, production management, warehousing, quality, equipment, and traceability instead of a narrow dashboard or analytics SKU. The product documentation and company profile repeatedly stress that the software is meant to turn live production data into workflow coordination, not just digitize paperwork.


    For large factories, the strongest public evidence is the Intelligent Manufacturing page and company deep dive: they describe more than 50 business apps, flexible module combination, and a browser-first SaaS surface with data reports, factory modeling, scheduling, and inventory management. For smaller factories, Small Work Order extends the workflow backward into quoting, order intake, procurement, and downstream fulfillment. It also keeps a visible upgrade path into the heavier Intelligent Manufacturing stack, which suggests product segmentation by organizational complexity rather than by a totally separate code base. The 2026 ranking-style white paper also introduces a third line, Black Lake Light Manufacturing, but that line is much less documented than the other two and remains a diligence item.'
