- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Black Lake Intelligent Manufacturing
    - Large and upper-mid manufacturing plants; group operations
    - Commercially deployed; deepest public product surface
    - Cloud-native multi-role execution stack with multi-plant coordination and configurable modules
    - Public docs do not break out reference architecture by industry or deployment tier
  - - Black Lake Small Work Order
    - SME factory owners, planners, workshop supervisors
    - Commercially deployed; fastest-start product
    - Order-fulfillment-centric workflow, low training burden, rapid go-live, mobile-first operations
    - Pricing model, support SLA, and data-migration tooling detail remain light
  - - Black Lake Light Manufacturing
    - Likely mid-market / lighter-weight digitalization use cases
    - Mentioned in 2026 white paper only
    - Suggests a middle product tier between full MES and SME work-order tooling
    - Public feature-level documentation is sparse outside one ranking-style source
  - - Data / analytics layer (reports + MI + big-data stack)
    - Plant managers, quality, operations analysts
    - Production use claimed in cases and product docs
    - Flink + StarRocks stack, second-level analytics, equipment and line alerts
    - No externally validated benchmark on throughput, latency, or ML governance
  - - AI-agent suite
    - Planners, estimators, schedulers, QA leaders
    - Scaling; 2023 R&D start and 2026 commercialization push
    - Targets decision-heavy steps such as split order, quoting, scheduling, and quality
    - Independent audit of agent accuracy and exception handling is unavailable
  - - Open platform / SDK surface
    - Customer IT, integrators, ecosystem partners
    - Public artifacts exist but full docs are gated
    - OpenAPI, Java SDK, and structured doc tree support systems integration
    - Anonymous inspection of the complete API catalog is not available
  notes: Rows combine official product pages, public developer artifacts, and financing coverage; maturity labels distinguish clearly documented production surfaces from roadmap or partially documented assets.
