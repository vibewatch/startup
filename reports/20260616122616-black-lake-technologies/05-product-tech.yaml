- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain point
  - Black Lake solution
  - Measurable benefit
  - Limitation
  rows:
  - - Large-factory production planner
    - Multi-plant planning and live progress are fragmented across ERP, spreadsheets, chat, and manual reports
    - Intelligent Manufacturing links planning, production, warehouse, quality, and equipment data in one SaaS layer
    - Official materials claim multi-plant visibility, faster plan response, and real-time synchronization
    - No public benchmark decomposes planner productivity gains by module
  - - SME owner or workshop lead
    - Orders, procurement, production, inventory, and finance are tracked separately and late
    - Small Work Order centers the workflow on order fulfillment and cross-department task visibility
    - Site examples claim much faster reporting and order-progress lookup
    - Public evidence is case-by-case and company-selected
  - - Quality / traceability manager
    - Paper records and nonstandard forms make root-cause analysis slow
    - SOP-gated digital records and one-code traceability connect process, material, and finished goods data
    - Yada and other cases describe unified digital records and traceability improvements
    - Retention periods, audit logging, and regulated-record controls are not public
  - - Operations leader at chain-owner or group manufacturer
    - Upstream suppliers and multiple plants must coordinate around fast-changing demand
    - Cloud-based collaboration extends from one factory into upstream and downstream partners
    - Nongfu and Liby case language points to faster response, fewer manual handoffs, and better resource use
    - Hard evidence on supplier onboarding time or partner churn is absent
  - - Estimator / scheduler in AI-enabled factories
    - Experienced staff manually split orders, quote, and prioritize work
    - AI agents automate split order, quote generation, and scheduling decisions on top of the data platform
    - Third-party coverage reports minutes-level split-ordering and faster quotes with higher response rates
    - Independent verification of agent performance at fleet scale is not public
  notes: Benefits are reported outcomes from public case studies and company-selected examples; they indicate directionality, not a controlled benchmark across the customer base.
