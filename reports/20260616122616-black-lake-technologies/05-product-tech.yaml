- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - MLPS level 3
    - Displayed on Small Work Order public site
    - China network-security baseline signal for a manufacturing SaaS vendor
    - No certificate scope, validity date, or hosting-entity mapping is public on the fetched page
  - - ISO27001
    - Displayed on Small Work Order public site
    - Information-security management signal for customers evaluating governance maturity
    - Certificate number, audit scope, and recertification date are not visible in the fetched public surface
  - - National industrial-internet standards participation
    - Displayed on Small Work Order public site
    - Signals policy alignment and product-standard engagement
    - Participation does not by itself prove runtime reliability or deep security controls
  - - OpenAPI developer surface
    - Structured docs exist and a Java SDK is public
    - Supports partner and customer integration workflows
    - Anonymous access is gated; buyers still need hands-on sandbox diligence
  - - IP / product asset accumulation
    - Baidu Baike reports 58 software copyrights and 109 trademarks
    - Suggests sustained productization beyond one-off projects
    - Public records do not reveal which assets matter most to current customers
  - - Reliability / status transparency
    - No public uptime SLA or status page was found on fetched surfaces
    - Would matter for factories depending on live execution workflows
    - Needs direct diligence on incident history, disaster recovery, and change management
  notes: Compliance rows reflect visible public signals only; absence of public detail is treated as a diligence gap rather than evidence that a control does not exist.
