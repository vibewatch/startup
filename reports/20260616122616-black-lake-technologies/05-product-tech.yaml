- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Cloud-native application layer
    - Runs production, planning, inventory, and workflow applications in SaaS form
    - Containerization, Service Mesh, microservices, mainstream cloud infrastructure
    - Public material does not detail region redundancy, uptime commitments, or tenant-isolation design
  - - Configuration and low-code layer
    - Lets factories adapt forms, logic, permissions, and workflows without full custom code
    - Product configuration framework and customer implementation discipline
    - Highly flexible configuration can still create hidden complexity without strong governance
  - - Data / analytics platform
    - Collects, stores, models, and analyzes high-volume production data
    - Flink, StarRocks, factory data collection, MI analytics layer
    - No independent scale, latency, or data-quality benchmark is public
  - - Integration layer
    - Connects ERP, OA, logistics, sales, device data, and SSO surfaces
    - Standard openAPI, one-stop login, ecosystem partners, Java SDK
    - Full API breadth, auth model, and versioning policies are not anonymously inspectable
  - - AI-agent layer
    - Automates split order, quoting, scheduling, and selected decision flows
    - Historical shopfloor data, domain rules, industrial AI agents
    - Accuracy, override logic, and hallucination/failure controls are still lightly documented publicly
  - - Delivery / customer-success layer
    - Turns product modules into live multi-plant workflows on short timelines
    - Implementation experts, ecosystem partners, industry templates
    - Public evidence is strong on speed claims but light on renewal, support SLAs, or failed rollouts
  notes: This table uses only publicly visible architecture references; where documentation is silent, risks are analyst interpretations rather than company admissions.
