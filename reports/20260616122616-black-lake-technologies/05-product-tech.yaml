  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: api-transparency
    missingEvidence: A buyer-readable API catalog, authentication model, versioning policy, rate limits, and example payloads for the open platform.
    whyItMatters: Integration depth is central to Black Lake's value proposition, but the public route surface is login-gated so diligence cannot verify breadth or governance from outside.
    diligencePath: Request sandbox access plus the full OpenAPI/Markdown catalog and recent changelog from the integration team.
    relatedQuestionRefs:
    - QE005
    - QE022
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-history
    missingEvidence: Historical uptime, incident history, change-management controls, disaster-recovery design, and contractual SLA commitments.
    whyItMatters: Factories using execution software need to understand whether Black Lake behaves like mission-critical infrastructure or only like a workflow tool.
    diligencePath: Ask for status-history exports, disaster-recovery architecture, RTO/RPO commitments, and standard SLA terms.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: Independent validation of AI-agent accuracy, override rates, failure handling, and realized ROI across a broad customer sample.
    whyItMatters: The investment case increasingly depends on AI-native workflow automation, but public proof remains dominated by company-selected or financing-linked examples.
    diligencePath: Request cohort-level agent performance reports, audit logs, fallback rates, and customer references willing to discuss production use.
    relatedQuestionRefs:
    - QE024
  - type: conflicting-data
    severity: minor
    topic: metric-definitions
    missingEvidence: Dated definitions for customer count, factory count, and cloud-MES market-share metrics across 2024-2026 sources.
    whyItMatters: Black Lake clearly has scale, but the spread between 32k, 34k, and nearly 40k factories plus 42.7% versus 52.7% share changes how quickly the market story is compounding.
    diligencePath: Ask management to provide a dated KPI bridge covering active customers, factories served, and IDC methodology by year.
    relatedQuestionRefs:
    - QE008
    - QE017
    - QE021
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: light-manufacturing-line
    missingEvidence: Feature-level documentation and named deployments for the Black Lake Light Manufacturing line mentioned in the 2026 white paper.
    whyItMatters: Without direct product documentation, it is unclear whether Light Manufacturing is a separate SKU, a packaging tier, or just marketing shorthand.
    diligencePath: Request product deck, pricing sheet, and reference customers specifically for the Light Manufacturing line.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
