summary:
  headline: >-
    Black Lake appears to have real product-market fit in China's cloud manufacturing software niche and a credible
    industrial-AI upsell story, but the company still discloses too little about revenue quality, retention, and
    cap-table terms to justify an invest-now call at its April 2026 private-market valuation.
