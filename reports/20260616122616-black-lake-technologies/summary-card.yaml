  topStrengths:
    - >-
      Cloud-native MES and collaboration stack with evidence of fast deployment, lower-cost implementation, and
      multi-tier product packaging from SMEs to larger factories
    - >-
      Repeated 2025-2026 evidence of broad market adoption, including near-40,000 reported factories/customers and large
      named manufacturers across multiple sectors
    - >-
      April 2026 Series D, unicorn valuation, and profitability claims indicate capital access and commercial momentum
      rather than a speculative pre-revenue story
    - >-
      Industrial AI workflow narrative is tied to specific manufacturing decision surfaces such as quoting, scheduling,
      order splitting, production, and quality management
  topRisks:
    - >-
      Current revenue, ARR, gross margin, retention, and customer concentration remain undisclosed, making the April
      2026 valuation hard to underwrite
    - >-
      Public operating metrics conflict across sources, especially customer count, market-share framing, headcount, and
      cumulative capital raised
    - >-
      Governance and cap-table visibility are limited for a late-stage private company, with no public post-Series-D
      ownership, board-control, or preference-stack detail
    - >-
      International expansion and AI monetization are strategically attractive but still thinly evidenced in public
      sources relative to the valuation premium
  unresolvedGaps:
    - Current ARR or revenue base, gross margin, and cash-generation quality after the April 2026 Series D
    - NRR, logo churn, customer concentration, and AI attach-rate or upsell evidence by cohort
    - Post-Series-D cap table, investor rights, board seats, and any preference or downside-protection terms
    - Reconciled definitions for factories, customers, supply-chain participants, and geographic footprint
    - Independent validation of the 52.7% market-share claim and enterprise deployment depth versus large-factory peers
