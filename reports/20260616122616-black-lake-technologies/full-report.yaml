      - number: '2.4'
        title: Growth drivers, constraints, and Southeast Asia option value
        blocks:
          - type: paragraph
            body: >-
              The growth case is straightforward: policy, infrastructure, and AI are now reinforcing one another.
              China's official and quasi-official sources describe a manufacturing base that is already broadly
              digitized, still adding smart-factory capacity, and increasingly open to AI agents, predictive
              maintenance, and cross-factory data layers. That is exactly the environment where a cloud-native MES
              vendor can argue for shorter deployment cycles, lower integration friction, and a clean path from
              operational data into industrial-AI features. If IDC is right that SaaS MES is shifting from simple
              low-cost replication toward multi-factory and cross-organization coordination, Black Lake's positioning is
              directionally aligned with where the category is moving.


              The constraint case is just as important. SASAC still highlights SME hesitation, standards gaps, and weak
              security awareness. Deloitte shows that industrial-AI adoption is slowed by cost, use-case ambiguity,
              skills shortages, and data readiness. WEF and ASEAN/OECD add a similar warning: infrastructure, talent,
              and interoperability are uneven, and that unevenness is exactly what complicates regional rollout.
              Southeast Asia still matters as option value, not as a proven core. ABI, Source of Asia, Eurogroup,
              ASEAN/OECD, KAS, and BCG all support the idea that ASEAN manufacturing digitization will expand and that
              countries such as Singapore, Thailand, Malaysia, Vietnam, and Indonesia offer plausible landing zones. But
              they also imply that Black Lake's regional upside depends on country selection, partner strategy, and
              proof that its China-born operating model can travel across heterogeneous digital-maturity tiers.
