        blocks:
          - type: paragraph
            body: >-
              Black Lake’s public customer story is really two businesses under one label. The heavier Smart
              Manufacturing product is aimed at multi-plant or otherwise operationally complex manufacturers that care
              about cross-site planning, traceability, quality, equipment, and supply-chain synchronization. The lighter
              Mini Worksheet motion is aimed at smaller factories that need fast deployment, work-order visibility,
