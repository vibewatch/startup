      - number: '1.3'
        title: Funding history and capital structure
        blocks:
          - type: paragraph
            body: >-
              Black Lake's April 2026 Series D is well supported by multiple independent news sources: the company
              raised nearly RMB1 billion at a post-money valuation above RMB7 billion, which also pushed it into unicorn
              framing on Crunchbase's April list. Caixin adds the most concrete investor disclosure, naming five
              participants and noting that the round was the company's sixth financing event. The capital narrative
              attached to the round is consistent as well: management says the money will accelerate industrial-AI
              rollout and global expansion.

                      What is not consistent is cumulative capital history. Older official materials described the company as having already raised nearly RMB1 billion by the C round, while CB Insights still showed only $108.53 million total raised at fetch time. Those numbers might be reconciled through stale databases, FX translation, or different treatment of undisclosed intermediates, but the public record does not do that reconciliation for the reader.

                      For diligence purposes, the right interpretation is that Black Lake has no visible fundraising access problem, but its public financing ledger is not clean enough to plug directly into ownership or dilution modeling. A post-Series-D cap table remains a must-have request.
