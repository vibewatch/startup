  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and disclosure risks
        blocks:
          - type: paragraph
            body: >-
              Black Lake's most defensible public risk stack starts with what the company and third-party legal sources
              say in plain text. The Small Work Order privacy statement, user agreement, and legal declaration create a
              wide data-governance perimeter: personal and business data can be collected, OPENAPI-ingested business
              data can be used for model training and optimization, cross-border transfers are contemplated, and public
              materials disclaim timeliness and completeness while limiting liability. On top of that, Aiqicha shows
              live litigation and hearing-notice signals but not enough detail to judge severity from the outside. For
              an investor, the underwriting issue is less ‘is the company breaking rules today?’ than ‘how much
              compliance, liability, and disclosure uncertainty is being carried by a private company that is now
              marketing AI-native and overseas-expansion ambitions.’ The risk is amplified because the most bullish
              growth, profitability, valuation, and customer-count metrics in this run still come from media or
              company-linked disclosures rather than from filing-audited financials.
            claimRefs:
