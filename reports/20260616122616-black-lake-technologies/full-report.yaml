      - number: '7.4'
        title: People risk, expansion execution, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Founder and people risk matter here because Black Lake's public strategy, regulatory voice, and market
              narrative all route through Zhou Yuxiang while the product itself is moving into decision-heavy industrial
              AI. Aiqicha shows concentrated formal authority, China Daily shows Zhou as the visible policy-facing
              executive, and Jiemian positions the company's industrial-AI thesis largely through his interpretation of
              market structure and product evolution. At the same time, the underlying customer problem is partly a
              scarcity problem: experienced factory experts and middle-layer coordinators are hard to replace, which is
              exactly why Black Lake's agents are attractive and exactly why implementation mistakes could be expensive.
              The right underwriting response is therefore not a binary go/no-go on any single public signal. It is a
              monitored set of kill criteria around new legal proceedings, data-governance lapses, independent evidence
              of AI error, material slowdown in SME demand, and any sign that overseas rollouts require bespoke heroics
              rather than repeatable process. Until management proves repeatability, people risk and execution risk
              remain linked.
