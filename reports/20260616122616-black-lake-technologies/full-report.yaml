              because it implies different buyers, different sales motion, and likely very different ACV and retention
              behavior even if the company reports one aggregate customer total.


              Public scale metrics are directionally strong but analytically messy. Black Lake homepage copy still
              points to 4,000+ manufacturing enterprises, the longer company profile moves to 32,000+ enterprises and
              nearly 30,000 factories in China and Southeast Asia, the World Economic Forum profile says nearly 40,000
              factories globally, and 2026 company-authored market pieces push the number to 40,000+ factories with 40%
              growth. Those figures are not useless; they do show that the company is far beyond a pilot-stage vendor.
              But they are not on one denominator, so the right underwriting move is to treat the trajectory as proof of
              breadth while explicitly refusing to treat any single public customer-count line as a clean KPI until
              management bridges enterprise, factory, site, and paying-customer definitions.
