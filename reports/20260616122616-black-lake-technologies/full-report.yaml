  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute logic
        blocks:
          - type: paragraph
            body: >-
              Black Lake's relevant market is not the entire automation stack. The product evidence shows a software
              wedge centered on manufacturing execution, collaboration, and data visibility for factories that need
              faster planning, better traceability, and tighter coordination across plants or across the supply chain.
              That means the directly relevant spend pool includes MES software, cloud manufacturing collaboration, and
              adjacent workflow software for quality, warehousing, equipment, and supplier coordination; it does not
              include automation hardware, robotics capex, or generic ERP accounting modules, even though those systems
              touch the same factory workflows.


              The substitute set matters because Black Lake wins by framing itself against traditional on-premise MES
              and ERP-heavy implementation models rather than against no software at all. Its official materials
              repeatedly stress cloud deployment, rapid rollout, lower upfront cost, and mobile usability. The
              large-enterprise product promises multi-plant standardization and API-led integration, while Small Work
              Order is pitched as a lighter, faster, lower-cost route for SMEs that still live with spreadsheets,
              messaging apps, delayed reporting, or rigid legacy software. That boundary logic is the key to reading the
              market correctly: Black Lake is competing for a narrower but more actionable software budget than the full
              smart-factory stack, while still benefiting from broader digitization and industrial-AI tailwinds.
