chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, products, and operating model
        blocks:
          - type: paragraph
            body: >-
              Black Lake Technologies presents itself as a Shanghai-founded industrial software company built around
              cloud-based manufacturing collaboration. Across official materials, the company consistently anchors its
              identity in 2016, even though entity-level registration records for one known operating company begin in
              2017. That difference does not negate the operating narrative, but it does mean later diligence should
              distinguish between brand history and legal-entity history rather than treating them as interchangeable
              facts.

                      The product stack is now broad enough to support a two-tier go-to-market story. Black Lake Intelligent Manufacturing is aimed at larger factories that need cross-workshop and cross-plant coordination, while Black Lake Small Work Order is framed as a lighter entry product for smaller, more variable manufacturers. Both are marketed as cloud-native, fast to deploy, and materially cheaper than traditional MES rollouts. That positioning matters because it explains how Black Lake can claim both large named customers and a very wide long-tail factory footprint.

                      The same source set also shows a key diligence caveat: Black Lake's public scale claims are directionally strong but numerically inconsistent. Depending on the page, the company describes itself as serving 4,000+, 32,000+, 34,000+, or nearly 40,000 factories or customers. The right takeaway is not to average those numbers, but to treat Black Lake as clearly scaled while requiring a reconciled KPI pack before using any single customer-count figure in valuation work.
