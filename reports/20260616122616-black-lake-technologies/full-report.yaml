  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main downside chain runs from soft factory demand or AI/integration failure into delayed rollout, weaker
      expansion, lower trust, and financing sensitivity.
    data:
      nodes:
        - id: n1
          label: SME demand weakens
        - id: n2
          label: Integrations or AI agents underperform
        - id: n3
          label: Delayed go-lives / lower ROI
        - id: n4
          label: Churn / slower expansion
        - id: n5
          label: Weaker growth narrative
        - id: n6
          label: Financing / valuation pressure
      edges:
