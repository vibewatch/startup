companyProfile:
  summary: >-
    Black Lake Technologies is a Shanghai-based industrial software company founded in 2016 that has evolved from cloud
    manufacturing collaboration into what it now calls an AI-native manufacturing operating system. Its core product
    stack spans Black Lake Intelligent Manufacturing for larger, multi-plant factories; Black Lake Small Work Order for
    smaller, higher-mix manufacturers; supply-chain collaboration workflows; and a newer layer of industrial AI agents
    for quoting, order splitting, scheduling, production, and quality decisions. Public sources strongly support real
    customer adoption, fast-deployment cloud positioning, and a meaningful April 2026 Series D, but still leave
    investors with material disclosure gaps on financial quality, governance detail, and reconciled operating metrics.
  foundedDate: '2016-01-01'
  founders:
    - name: Zhou Yuxiang
      role: Founder and CEO
      background: Dartmouth-trained computer scientist and former investment banker focused on industrial transactions
      claimRefs:
        - CO008
        - CO009
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    Cloud-native MES and manufacturing collaboration software, led by Black Lake Intelligent Manufacturing and Black
    Lake Small Work Order, plus industrial AI agents that automate workflow decisions across production, quality,
    warehousing, scheduling, and supply-chain collaboration.
  customerFocus: >-
    Chinese and increasingly overseas manufacturers ranging from SME workshops to complex multi-plant enterprises across
    food and beverage, auto parts, industrial equipment, electronics, chemicals, pharma, and other manufacturing
    verticals.
  businessModel: >-
    Annual subscription software with modular cloud deployment, fast implementation, and an upmarket path from
    lightweight shopfloor tools toward broader enterprise manufacturing operating workflows and AI add-ons.
  stage: Series D
