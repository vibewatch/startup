  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Black Lake’s public revenue model is visible enough to prove real monetization, but not visible enough to
              model actual contract economics. Official product pages split the company into a heavier enterprise motion
              and a lighter SME motion: Black Lake Intelligent Manufacturing is framed for larger multi-plant and
              supply-chain-heavy factories, while Black Lake Small Work Order is designed for smaller, high-mix
              manufacturers that want faster deployment and lower upfront spend. That segment split matters financially
              because the public evidence points to meaningfully different delivery intensity and likely different
              average contract values across the two motions.


              For the SME layer, the company now gives unusually concrete list pricing. An official April 2026 pricing
              explainer says Small Work Order professional is priced at RMB10,800 per year with 50 included accounts and
              RMB140 per additional account per year, while the flagship package is priced at RMB18,800 per year and
              adds procurement, sales, quality, and PDA workflows. The same source also says the product is SaaS-only,
              charged annually, and not sold as a perpetual license. That is stronger evidence than a generic 'contact
              sales' page, but it is still list pricing rather than realized pricing.


              For the enterprise and AI layers, public visibility drops sharply. The official manufacturing page says
              Black Lake uses annual subscription pricing by user and module and positions first-year cost at roughly
              one-fifth of a traditional buyout system, but it does not publish enterprise rate cards. Jiemian adds an
              important monetization nuance: management says AI-agent fees are being priced against roughly one month of
              the relevant worker’s salary rather than against a simple seat count. That suggests Black Lake is trying
              to move from classic SaaS packaging toward a hybrid model of package fees, account expansion, module
              upsell, and labor-value-based AI pricing. What remains missing is the part investors actually need:
              realized contract value, discounting, attach rates, renewal terms, and software-versus-services mix.
