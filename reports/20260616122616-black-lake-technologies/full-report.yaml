      - number: '8.2'
        title: Market proof and comparable context
        blocks:
          - type: paragraph
            body: >-
              Black Lake does have real operating proof behind the valuation story. Multiple April-to-June 2026 articles
              repeat the near-40,000-factory footprint, the 52.7% share claim in China's cloud production-management
              niche, and the pivot from cloud MES into industrial AI agents. Official product pages support the idea
              that the company has a multi-product stack rather than a single lightweight tool, and the AI narrative
              appears tied to live workflows such as quoting, scheduling, production, and quality rather than to a
              generic copiloting layer.


              Even so, the competitive context is mixed rather than one-sided. The strongest external comparison piece
              still ranks Black Lake behind Dingjie and Siemens overall, and specifically warns that Black Lake is
              strongest in faster SMB cloud deployments rather than the most complex large-factory environments. That
              matters for valuation because it may limit average contract value expansion unless management can show
              that AI and enterprise editions are pulling the company upmarket faster than the public comparison pieces
              suggest.
            claimRefs:
              - CV007
