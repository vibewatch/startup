  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation is blocked by valuation-opacity risk, not by a lack of evidence that Black Lake has built a
      real business.
    approximationNotes: Decision nodes summarize qualitative underwriting logic rather than numeric model outputs.
    claimRefs:
      - CV002
      - CV006
      - CV031
      - CV032
      - CV036
    data:
      nodes:
        - id: scale
          label: Market proof
          detail: >-
            Near-40,000 factory claims, 52.7% niche-share repetition, and profitable growth headlines show real
            traction.
        - id: ai
          label: AI optionality
          detail: Industrial-AI agent adoption could raise ACV and strategic value above base MES workflows.
        - id: comps
          label: Comp discipline
          detail: >-
            Public industrial software comps in June 2026 still cluster around mid-single-digit revenue-equivalent
            bands.
        - id: opacity
          label: Missing denominator
          detail: Current revenue, retention, gross margin, and preference-stack terms remain undisclosed.
        - id: decision
          label: Research-more
          detail: Do not underwrite the >RMB7bn mark aggressively until KPI and cap-table evidence closes the gap.
      edges:
        - from: scale
          to: decision
          label: Business looks real
        - from: ai
          to: decision
          label: Upside exists
        - from: comps
          to: decision
          label: Price must clear public discipline
        - from: opacity
          to: decision
          label: Blocks buy call
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The current mark only moves into a public-comp-like range if the hidden revenue base is already much larger than
      public sources disclose.
    approximationNotes: >-
      Bars show implied revenue multiples at a fixed RMB7.0bn post-money valuation using illustrative revenue scenarios
      rather than asserted actual revenue.
    claimRefs:
      - CV020
      - CV023
      - CV026
      - CV033
      - CV034
      - CV035
    data:
      xAxis: Illustrative current revenue scenario (RMB million)
      yAxis: Implied valuation / revenue multiple at RMB7.0bn post-money
      items:
        - label: RMB250m revenue
          value: 28
          note: Looks far above June 2026 public comp bands.
        - label: RMB300m revenue
          value: 23.3
          note: Still implies a large private premium.
        - label: RMB400m revenue
          value: 17.5
          note: More plausible only if retention and margins are strong.
        - label: RMB500m revenue
          value: 14
          note: Starts to look more like a scarcity premium than a bubble multiple.
        - label: RMB600m revenue
          value: 11.7
          note: Approaches a defendable private premium if AI monetization is real.
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      A wide scenario band is more honest than a point estimate because the hidden revenue base drives most of the
      valuation uncertainty.
    approximationNotes: >-
      Ranges are indicative post-money valuation scenarios in RMB billions, not promised exit outcomes or equity values
      after preferences.
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV036
      - CV039
    data:
      items:
        - label: Bear case
          low: 4
          mid: 4.75
          high: 5.5
          unit: RMB bn
          note: Public-comp discipline dominates and growth evidence disappoints.
        - label: Base case
          low: 6
          mid: 7
          high: 8
          unit: RMB bn
          note: Current mark is roughly fair if the hidden revenue base and margins are solid.
        - label: Bull case
          low: 8.5
          mid: 9.5
          high: 10.5
          unit: RMB bn
          note: Requires strong retention, high-margin software economics, and credible AI monetization.
        - label: Current reported mark
          low: 7
          mid: 7
          high: 7
          unit: RMB bn
          note: Tencent and related coverage anchor the current post-money above RMB7bn.
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Black Lake scores well on category momentum and proof of activity, but much worse on valuation clarity and
      evidence completeness.
    approximationNotes: >-
      Scores are IC-style qualitative ratings on a 10-point scale derived from the evidence set rather than
      management-provided KPIs.
    claimRefs:
      - CV006
      - CV008
      - CV015
      - CV027
      - CV040
      - CV042
    data:
      items:
        - label: Market position
          value: 8
          unit: /10
          note: Niche-share and customer-scale claims are strong, though not fully independently verified.
        - label: Product / AI optionality
          value: 8
          unit: /10
          note: AI workflow narrative is tangible enough to matter.
        - label: Economics visibility
          value: 3
          unit: /10
          note: Profitability is claimed, but revenue, gross margin, and retention remain private.
        - label: Valuation clarity
          value: 2
          unit: /10
          note: Current price is visible; the denominator and cap table are not.
        - label: Risk-adjusted upside
          value: 5
          unit: /10
          note: There is plausible upside, but it depends heavily on undisclosed metrics.
        - label: Evidence quality
          value: 4
          unit: /10
          note: Funding anchors are good; underwriting inputs are still incomplete.
