      - number: '6.4'
        title: Concentration and diligence risks
        blocks:
          - type: paragraph
            body: >-
              The biggest customer risk is not that Black Lake lacks named proof; it is that the proof is unusually
              concentrated in the kinds of customers a fundraising narrative would naturally emphasize. Public
              references over-index to food, beverage, household FMCG, and other supply-chain-intensive operators where
              planning speed, traceability, and multi-plant coordination are visible and easy to market. That does not
              mean the business is actually concentrated there, but it does mean the public evidence set can overstate
              traction in adjacent verticals if investors do not ask for revenue by industry, product, and customer
              size. The same skew appears in customer size: the company can describe a very large installed base, but
              the named proof still comes mostly from lighthouse enterprises plus a thin layer of generic SME
              testimonials.


              There is also a procurement diligence angle. Public legal-surface records such as Aiqicha hearing notices
              do not prove customer harm or failed deployments, but they are the sort of thing an enterprise procurement
              team, especially at a regulated or listed customer, may still ask management to explain. Combined with the
              lack of public renewal metrics and the count-definition drift, that means customer quality cannot be
              underwritten from logos alone. The diligence path is straightforward: ask for a reconciled customer KPI
              bridge, top-customer concentration, cohort retention, and a reference pack split by enterprise and SME
              rather than accepting one aggregate customer count as proof of durable demand.
            claimRefs:
