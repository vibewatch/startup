      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder-CEO Zhou Yuxiang is the single most legible public face of Black Lake. Multiple biographical
              profiles say he studied computer science at Dartmouth, worked in investment banking on industrial
              transactions, failed in an earlier data-heavy manufacturing startup, and then rebuilt Black Lake after
              spending time on factory floors. That sequence is strategically important: Black Lake's current product
              philosophy explicitly rejects abstract industrial-software copying in favor of narrow, workflow-level pain
              points that were discovered in live manufacturing environments.

                      Governance visibility beyond Zhou is thinner. Aiqicha surfaces a named director roster for Shanghai Black Lake Technology Co., Ltd., which is enough to prove the company is no longer a one-founder shell, but not enough to underwrite actual control. Public materials do not explain board committees, investor seats, veto rights, or founder economics after the 2026 Series D. That leaves a meaningful diligence gap between what the market can observe and what an investor would need to judge governance quality.

                      The leadership story is therefore strong on founder-market fit and weak on formal governance transparency. That is common for a private late-stage Chinese software company, but it should still be treated as a real underwriting gap rather than assumed away.
