      - number: '8.4'
        title: Final diligence and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The final underwriting work is straightforward even if it is not easy. Investors need a current KPI pack,
              not more category storytelling: current ARR or revenue, gross margin, retention, AI attach rate, geography
              mix, and a post-Series-D cap table with any preference or downside-protection terms. Without those items,
              the recommendation cannot improve because the main uncertainty is valuation quality, not product
              awareness.


              The thesis also has clear break points. If retention or gross margin are weak, if revenue is far below
              what the headline valuation implies, or if the company remains better suited to smaller cloud-MES
              deployments than to high-ACV enterprise programs, then the current mark is too demanding. Conversely, a
              shift toward public-company-style transparency would materially upgrade confidence. Until then, Black Lake
              belongs on a high-priority diligence watchlist rather than in an invest-now queue.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
