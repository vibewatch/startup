  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Public evidence places disclosure opacity, legal/proceeding visibility, AI governance, and SME demand cyclicality
      in the highest residual-risk quadrant.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
