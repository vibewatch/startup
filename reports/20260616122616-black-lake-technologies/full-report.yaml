        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more at the current mark'
            body: >-
              Black Lake has enough market proof to stay high on the diligence list, but not enough financial disclosure
              to justify underwriting >RMB7bn aggressively today.
