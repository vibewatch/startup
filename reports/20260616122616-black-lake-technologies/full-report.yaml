  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Black Lake looks investable as a business narrative but not yet as a price-cleared underwriting decision.
              The April 2026 round is real, the new-money amount is broadly corroborated, and the post-money mark above
              RMB7 billion is consistent with unicorn framing in both Tencent and Crunchbase coverage. The same cluster
              of sources also says the company is already profitable and growing revenue more than 60% year over year.
              Those are exactly the ingredients that can justify a premium private mark in industrial software.


              The problem is that the open-web record stops at the headline. Public sources do not disclose the current
              revenue base, gross margin, net retention, or cap-table terms that would let an investor translate the
              RMB7 billion price into an actual risk-adjusted return case. That gap is too large to wave away because
              public software multiples in June 2026 are not generous. The disciplined call is therefore research-more:
              Black Lake may deserve a strong valuation, but the current mark cannot be called attractive on evidence
              now in hand.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV031
