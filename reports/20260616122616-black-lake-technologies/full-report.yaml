            - Instant developer access not available; login gates limit evaluation
        - label: Workflow depth
          values:
            - Deepest coverage across plan, production, warehouse, quality, equipment
            - Broad order-to-fulfillment coverage for SMEs
            - Focused on decision-heavy steps layered over core workflows
            - Focused on integration breadth rather than workflow execution
        - label: Public technical detail
          values:
            - 'Moderate: architecture, modules, data stack are named'
            - 'Moderate: workflow detail and API mentions are visible'
            - 'Moderate-low: outcomes and use cases visible, internal model design not public'
            - 'Moderate-low: docs exist, but full breadth and auth model are not public'
        - label: Main diligence risk
          values:
            - Reliability/SLA transparency
            - Depth of support and migration tooling
            - Independent validation of accuracy and guardrails
            - Breadth, stability, and openness of external integrations
    claimRefs:
      - CE003
      - CE005
      - CE012
      - CE015
      - CE018
      - CE040
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Maps how Black Lake appears to sell and expand across large-enterprise and SME manufacturing segments.
    data:
      items:
        - label: Large FMCG / beverage group
          detail: >-
            Group coordination pain -> first-plant or first-program proof -> cross-plant standardization -> broader
            supply-chain collaboration
        - label: Industrial multi-base manufacturer
          detail: >-
            Existing SCADA / ERP data silos -> execution and traceability rollout -> group dashboards -> vertical
            management across bases
        - label: Franchise supply-chain operator
          detail: >-
            Store or franchise demand pressure -> manufacturing coordination proof -> supplier / warehouse
            synchronization -> network expansion
        - label: SME discrete factory
          detail: >-
            Order-delay and reporting pain -> on-site demo with real process -> short-cycle SaaS deployment -> possible
            module or site expansion
        - label: Reference-driven procurement loop
          detail: >-
            Case study or live-factory reference -> solution validation -> deployment -> becomes a new reference for the
            next sale
    approximationNotes: >-
      The map synthesizes repeated patterns from public product and case materials; it is not a disclosed internal sales
      funnel.
    claimRefs:
      - CU003
      - CU019
      - CU029
      - CU030
      - CU032
      - CU041
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: Shows the public path from buyer pain to rollout and expansion for Black Lake customer programs.
    data:
      nodes:
        - id: n1
          label: Buyer pain emerges
          detail: Coordination, order-delay, traceability, or inventory problems surface
        - id: n2
          label: Reference or demo stage
          detail: Customer evaluates via case studies, same-industry references, or on-site demos
        - id: n3
          label: Initial deployment
          detail: Black Lake lands a first plant, first workflow, or first factory cohort
        - id: n4
          label: Workflow digitization
          detail: Production, quality, material, equipment, or planning flows move into live use
        - id: n5
          label: Outcome proof
          detail: Customer sees efficiency, visibility, quality, or delivery improvements
        - id: n6
          label: Expansion
          detail: Rollout broadens to more plants, more modules, or more supply-chain nodes
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: null
    claimRefs:
      - CU019
      - CU029
      - CU030
      - CU031
      - CU041
