- id: expansion-retention-and-procurement-motion
  title: Expansion, retention visibility, and procurement motion
  body: 'What public materials do show is expansion logic, not retention math. Liby’s pilot-to-all-factory language, Nongfu’s
    multi-plant coordination, Yada’s group-level management story, and Mixue’s one-factory to multi-factory to upstream-and-downstream
    collaboration narrative all point to a land-and-expand motion where Black Lake tries to become operational middleware
    across plants and supply nodes. Alibaba Marketplace testimonials also give a glimpse of a mid-market and SME motion: replace
    a rigid legacy MES or spreadsheets, get quick visibility wins, then expand usage after shorter proof periods. This is
    qualitatively helpful because it suggests that expansion, if it happens, is likely site-based and workflow-based rather
    than seat-based alone.


    The weak point is durability evidence. There is no public NRR, GRR, logo churn, average contract length, renewal rate,
    or customer-satisfaction series that would let an investor separate one-time lighthouse wins from a compounding base.
    The SME motion is also not self-serve in the software sense; Black Lake’s own 2026 materials say Mini Worksheet does not
    offer a generic online trial and instead relies on on-site demos, live-factory references, and same-industry case validation.
    That may fit manufacturing buying behavior, but it also implies a heavier field-sales and solutioning motion than the
    headline SaaS label might suggest.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
