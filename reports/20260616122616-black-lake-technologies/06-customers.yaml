- id: named-proof-and-deployment-depth
  title: Named customer proof and deployment depth
  body: 'The strongest public evidence is not the logo wall but the handful of case narratives that show workflow depth. Mengniu
    is framed as a digital-factory program tied to device and system interconnection, process transparency, digital quality
    control, finer cost control, and faster product-development cycles. Yada is the best industrial-manufacturing proof because
    the case describes a live operating environment with six production bases, nearly forty lines, existing SCADA and ERP
    infrastructure, and Black Lake being used to connect production, quality, materials, and equipment into traceable, group-manageable
    workflows. Liby adds a different shape of proof: a FMCG smart-factory program centered on work orders, packaging, warehousing,
    and distribution, with explicit pilot-to-all-factory rollout language.


    Mixue and Nongfu are especially important because they show Black Lake attached to chain-owner supply systems rather than
    only to isolated factories. Black Lake’s own materials position Mixue as a beverage-supply-chain operator serving a huge
    franchise network, while Nongfu is described as a multi-water-source, multi-plant beverage operator where coordination,
    plan response, and traceability matter as much as raw throughput. The limitation is just as important as the proof: almost
    all of this evidence is company-selected. Public named deployments clearly exist, but outside the company’s own customer
    storytelling there is still very little independent detail on contract size, renewal timing, or module-by-module expansion.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
