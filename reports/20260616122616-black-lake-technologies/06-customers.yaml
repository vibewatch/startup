- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk / expansion driver
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Food and beverage / FMCG proof concentration
    - Mixue, Nongfu, Mengniu, and Liby dominate the most specific named public stories
    - Public proof may overstate traction in other verticals if revenue is concentrated in consumer supply chains
    - Request ARR and customer counts by vertical and top-10 logos
  - - Lighthouse-account skew versus SME long tail
    - Public named proofs are mostly large enterprises while SME proof is mainly pricing plus generic testimonials
    - Aggregate customer-count claims may hide much weaker retention or lower ACV in the long tail
    - Request cohort analysis by ACV band, factory size, and product
  - - Count-definition drift
    - 4,000+ enterprises, 32,000+ enterprises, near-30,000 regional factories, near-40,000 global factories, and 40,000+ factories
      all appear publicly
    - Weakens confidence in customer KPIs used for valuation or market-share claims
    - Request a dated bridge across enterprise, site, paying, and active definitions
  - - Consultative SME sales motion
    - No online trial; field demos and case-based validation substitute for self-serve proof
    - Could lengthen CAC payback or make the SMB engine less software-like than headline SaaS framing suggests
    - Request funnel metrics from demo to paid account and first-year retention
  - - Procurement diligence friction
    - Aiqicha hearing notices plus missing renewal metrics create extra diligence questions for enterprise buyers
    - Could slow procurement or security / vendor reviews even if no customer failure is proven publicly
    - Request litigation summary, closed-case status, and customer-procurement objection log
  notes: This table focuses on revenue-quality and proof-quality risk rather than on general legal or product risk handled
    elsewhere in the report.
