  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, logo churn, and renewal-rate disclosure for Smart Manufacturing versus Mini Worksheet.
    whyItMatters: Without retention data, public customer counts and named logos do not reveal durability or whether expansion
      outweighs churn.
    diligencePath: Request customer cohorts by segment, logo churn, revenue churn, and renewal rates for the last eight quarters.
    relatedQuestionRefs:
    - QU016
    - QU023
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer ARR share, top-10 revenue concentration, and any dependence on a small number of lighthouse
      enterprise accounts.
    whyItMatters: The public proof set is lighthouse-heavy, so concentration risk could materially alter revenue quality and
      pricing power.
    diligencePath: Request customer revenue concentration tables, gross margin by top cohorts, and account-level expansion
      histories.
    relatedQuestionRefs:
    - QU017
    - QU024
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: material
    topic: customer-count-definition
    missingEvidence: A reconciled bridge among enterprise count, factory count, paying-customer count, and geography-limited
      site count.
    whyItMatters: Installed-base inflation or inconsistent denominators would distort market-share, cohort, and valuation
      assumptions.
    diligencePath: Request a dated KPI bridge showing counts by product, paying status, site, enterprise, and region.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU025
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: minor
    topic: independent-satisfaction-proof
    missingEvidence: Independent customer-review corpus, referenceability data, or customer-hosted case studies for both enterprise
      and SME segments.
    whyItMatters: Public proof is heavily company-selected, so outside reference quality is still thin relative to the claimed
      installed base.
    diligencePath: Request contactable customer references, CSAT/NPS by cohort, and links to customer-hosted case studies
      or procurement records.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: stale
    severity: minor
    topic: liby-rollout-status
    missingEvidence: Current status of Liby's post-pilot rollout and whether all-factory expansion actually happened on the
      promised timeline.
    whyItMatters: Pilot-to-rollout is one of the clearest public expansion signals, so confirming completion matters for repeatability
      claims.
    diligencePath: Ask for site-by-site Liby deployment dates, active modules, and user counts versus the 2022 rollout plan.
    relatedQuestionRefs:
    - QU009
    - QU012
    relatedTableRefs:
    - TU003
    - TU006
