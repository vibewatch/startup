- id: TU006
  title: Customer deployment / procurement motion table
  columns:
  - Motion stage
  - Enterprise path
  - SME path
  - Evidence
  - Diligence gap
  rows:
  - - Problem discovery
    - Cross-plant coordination, traceability, and supply-chain speed pain surfaces at group level
    - Order delay, inventory, cost visibility, and reporting pain at workshop level
    - Official cases plus Mini Worksheet positioning
    - Need win-rate data by use case
  - - Proof stage
    - Named pilot or first factory is used to validate workflow fit
    - On-site demo and same-industry references replace generic online trial
    - Liby pilot language; 35-city demo coverage
    - Need demo-to-pilot conversion rate
  - - Implementation
    - 4-6 week enterprise implementation claims with multi-system integration
    - 1-3 day / short-cycle deployment claims for Mini Worksheet
    - Homepage, marketplace, and 2026 articles
    - Need actual median time to value
  - - Expansion
    - Customer stories emphasize more factories, more plants, or broader supply-chain nodes
    - Potential expansion is implied by more modules or more sites, but named proof is limited
    - Liby, Nongfu, Mixue, Yada narratives
    - Need attach-rate and expansion-ARR data
  - - Renewal / reference loop
    - Public proof relies on case stories rather than disclosed renewals
    - Public proof relies on testimonials and reference visits
    - No public NRR or GRR; company-selected references dominate
    - Need renewal, referral, and referenceability metrics
  notes: The motion is reconstructed from public cases and product-positioning materials rather than from a disclosed sales-ops
    deck.
