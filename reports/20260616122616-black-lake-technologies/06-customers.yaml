    - Group COO / CIO / supply-chain lead
    - Plant managers, planners, QA, warehouse leaders
    - HQ operations or digital-transformation budget
    - Cross-plant scheduling, traceability, inventory, quality, upstream coordination
    - Named proofs include Nongfu, Mengniu, Mixue, and Liby; ACV and renewal terms stay undisclosed
  - - Large industrial / discrete manufacturers
    - Plant operations or group manufacturing leadership
    - Production, quality, equipment, engineering teams
    - Factory or group operations budget
    - SCADA / ERP-linked execution, traceability, group vertical management
    - Yada plus other case language shows workflow depth, but independent renewal proof is thin
  - - SME discrete factories
    - Owner / general manager / workshop lead
    - Workshop supervisors, planners, frontline workers
    - Annual operating budget
    - Work orders, inventory, procurement, reporting, delivery control
    - Public proof is stronger on pricing and demo motion than on named SME logos
  - - Chain-owner supply ecosystems
    - Supply-chain or manufacturing platform owner
    - Factory planners, upstream suppliers, warehouses, logistics teams
    - Anchor enterprise budget
    - Multi-factory collaboration across internal and external nodes
    - Mixue and Nongfu stories point here, but supplier-seat economics are not public
