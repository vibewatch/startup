callouts:
- calloutType: strength
  title: Black Lake's best-documented edge is the middle lane between heavy suites and generic SMB tools
  body: >-
    The source set consistently shows Black Lake selling something more factory-native than Odoo,
    Katana, or MRPeasy while remaining materially lighter, faster, and more local-fit than Siemens,
    SAP, or Plex. That middle-lane positioning is credible and repeatedly evidenced in product,
    deployment, and architecture language.
  claimRefs:
  - CP020
  - CP021
  - CP029
  - CP036
- calloutType: risk
  title: Domestic China suites look more dangerous than Black Lake's own marketing suggests
  body: >-
    Digiwin and Saiyi are not fringe alternatives. Their public materials show broad MES-adjacent
    functionality, deep local case coverage, and large installed-base or listed-company trust signals.
    If Black Lake loses deals in China, the most plausible public threat is local suite competition,
    not just SAP or Siemens.
  claimRefs:
  - CP025
  - CP026
  - CP028
  - CP032
- calloutType: insight
  title: Public pricing transparency belongs to the substitutes, not to Black Lake
  body: >-
    Tulip, Odoo, Katana, and MRPeasy all give the market cleaner public budget anchors than Black Lake
    does. That does not mean they are better products, but it does mean external buyers can benchmark
    them more easily than they can benchmark Black Lake from public materials alone.
  claimRefs:
