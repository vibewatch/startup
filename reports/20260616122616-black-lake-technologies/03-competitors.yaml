  - type: missing-source
    severity: material
    topic: neutral-win-loss
    missingEvidence: Neutral buyer references or public win-loss cases showing Black Lake beating or losing to Siemens, SAP, Tulip, Digiwin, Saiyi, or lightweight substitutes.
    whyItMatters: Without neutral win-loss evidence, displacement risk and moat durability remain inferred from overlap and packaging rather than proven by market outcomes.
