  - type: missing-source
    severity: material
    topic: renewal-and-lock-in
    missingEvidence: Renewal, expansion, module attach, and net retention evidence showing whether Black Lake's middle-lane position compounds over time.
    whyItMatters: Fast deployment is valuable, but moat durability depends on retention, expansion, and operational lock-in after go-live.
    diligencePath: Ask for cohort renewal data, multi-plant expansion rates, and attach rates for AI or supplier-collaboration modules.
