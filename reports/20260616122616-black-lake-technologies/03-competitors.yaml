figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: >-
    Ordinal positioning of ten competitors on two public-evidence-backed axes: execution breadth
    (x-axis, 1-10, from lightweight inventory/MRP tooling to full MOM suites) and deployment
    approachability (y-axis, 1-10, from heavy custom enterprise motion to fast, low-friction cloud
    rollout). Black Lake sits in the middle-high zone: broader and more factory-specific than Odoo,
    Katana, and MRPeasy, but lighter and more approachable than Siemens, SAP, and Plex.
  data:
    xAxis: Execution breadth (1=light substitute, 10=full MOM suite)
    yAxis: Deployment approachability (1=heavy quote-led rollout, 10=fast low-friction rollout)
    points:
    - label: Black Lake
      x: 8
      y: 8
      detail: Cloud-native China MES plus SME work-order stack with 2-3 day to 6-12 week deployment claims
    - label: Siemens Opcenter
      x: 10
      y: 2
      detail: Full MOM framing with PLM-automation linkage and no public list pricing
    - label: SAP Digital Manufacturing
      x: 9
      y: 3
      detail: Broad cloud MOM/MES integrated with SAP planning, logistics, and workforce stack
    - label: Tulip
      x: 7
      y: 7
      detail: Composable MES with three-month average implementation and explicit packaging
    - label: Plex
      x: 8
      y: 4
      detail: Unified cloud MES/QMS/APM platform sold as enterprise private offer
    - label: Digiwin
      x: 8
      y: 5
      detail: Broad regional ERP-MES-WMS-AIoT suite with large installed-base claims
    - label: Saiyi
      x: 8
      y: 5
      detail: iMOM heavy suite plus SME app platform for Chinese manufacturers
    - label: Odoo
      x: 6
      y: 9
      detail: Horizontal ERP with manufacturing app, public per-user pricing, and offline shop floor
    - label: Katana
      x: 5
      y: 9
      detail: Inventory-led production software with one-day to six-week onboarding language
    - label: MRPeasy
      x: 5
      y: 8
      detail: Small-manufacturer MRP with public per-user pricing and shop-floor interfaces
