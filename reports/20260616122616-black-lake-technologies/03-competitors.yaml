- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Competing threat
  - Severity
  - Evidence-backed reason
  - Mitigation / diligence ask
  rows:
  - - Fast deployment and low-friction onboarding
    - Tulip, Odoo, Katana, and MRPeasy also market fast starts and lighter deployment
    - High
    - Multiple lightweight substitutes publish explicit quick-start packaging and pricing while Black Lake only discloses relative economics
    - Request recent bake-offs and actual time-to-value by segment
  - - China-local factory workflow fit
    - Digiwin and Saiyi have longer local implementation histories and large customer footprints
    - High
    - Domestic suites pair broad manufacturing coverage with listed-company trust and named Chinese case libraries
    - Request vertical win-loss data in China by industry and factory size
  - - Broader MES depth than generic SMB tools
    - Heavy incumbents retain stronger public compliance, workforce, and analytics detail
    - Medium
    - SAP, Siemens, and Plex disclose deeper enterprise-control and regulated-workflow language than Black Lake public pages do
    - Probe regulated deployments, validation artefacts, and quality/compliance references
  - - AI-native positioning and modular apps
    - Tulip and Saiyi also frame AI/no-code/app-based operating models
    - Medium
    - Cloud-native configurability is no longer unique in public marketing across the competitor set
    - Request proof that AI modules improve conversion, renewal, or module expansion
  - - Public commercial value story
    - Black Lake publishes less explicit list pricing than lighter substitutes
    - Medium
    - Tulip, Odoo, Katana, and MRPeasy provide stronger public budget anchors for procurement teams
    - Request anonymized quotes, services burden, and realized payback by customer cohort
  - - Perceived execution credibility
    - No neutral public win-loss or churn dataset confirms Black Lake displacement versus named rivals
    - High
    - Public evidence proves overlap and niche fit, but not repeatable competitive win rates
    - Ask for top 20 recent evaluated deals, losses, renewal rates, and expansion cohorts
  notes: Severity reflects analyst judgment from the public source set rather than disclosed pipeline-loss data; this table is designed to show where Black Lake's moat is evidenced, where it is only asserted, and what diligence item would close each gap.
