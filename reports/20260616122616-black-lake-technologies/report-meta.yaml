  productSummary: >-
    Cloud-native MES and manufacturing collaboration software, led by Black Lake Intelligent
    Manufacturing and Black Lake Small Work Order, plus industrial AI agents that automate
    workflow decisions across production, quality, warehousing, scheduling, and supply-chain
    collaboration.
  customerFocus: >-
    Chinese and increasingly overseas manufacturers ranging from SME workshops to complex
    multi-plant enterprises across food and beverage, auto parts, industrial equipment,
    electronics, chemicals, pharma, and other manufacturing verticals.
  businessModel: >-
    Annual subscription software with modular cloud deployment, fast implementation, and an
    upmarket path from lightweight shopfloor tools toward broader enterprise manufacturing
    operating workflows and AI add-ons.
  stage: Series D
