tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Public-cloud SaaS MES
    - Recurring software for production execution, quality, warehousing, traceability, and cross-factory collaboration
    - Automation hardware, implementation hardware, and unrelated ERP modules
    - Plant operations, digital-transformation, or manufacturing IT budgets
    - Direct current monetization wedge for Black Lake
  - - Cloud-native manufacturing collaboration
    - Workflow software connecting workshops, factories, and supplier-facing production processes
    - Pure office SaaS and non-manufacturing collaboration tools
    - Operations leaders and plant-management sponsors
    - Explains why Black Lake markets itself beyond narrow shop-floor control
  - - SME order-fulfillment manufacturing SaaS
    - Order, scheduling, inventory, and lightweight execution software for small and mid-sized factories
    - Full-suite enterprise ERP replacement projects
    - Owners, factory managers, or SME operations leads
    - Captures the Small Work Order expansion path
  - - Large-enterprise multi-plant execution layer
    - MES plus shared data standards, dashboards, quality, equipment, and inter-factory coordination
    - Heavy automation capex and bespoke systems-integration hardware
    - Plant groups, operations transformation, and IT co-sponsors
    - Matches the Heihu Zhizao and case-study motion
  - - Industrial-AI overlays on factory data
    - Scheduling, maintenance, analytics, and workflow agents built on manufacturing data
    - Foundation-model infrastructure spending that is not application-specific
    - Innovation, operations excellence, and digital leaders
    - Important growth adjacency, but not the whole market boundary today
  notes: The actionable market is software and workflow spend around execution and collaboration; hardware automation and generic enterprise software are adjacent but should not be counted as Black Lake addressable revenue.
