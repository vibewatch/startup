callouts:
- calloutType: insight
  title: The real wedge is smaller than the macro story
  body: China's manufacturing digitization story is huge, but Black Lake monetizes only a narrower slice around cloud execution and collaboration. That is still attractive, yet it means market-size rhetoric should stay anchored to the China MES software and cloud-MES layers rather than to all smart-manufacturing spend.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM013
- calloutType: risk
  title: The next leg of upside depends on execution, not just category growth
  body: Official and analyst sources agree that cost, skills, standards, security, and data readiness still slow industrial-AI and SME digitization adoption. Those frictions could delay both AI monetization and overseas expansion even if the category keeps growing.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM037
  - CM047
- calloutType: strength
  title: Segmented product design matches real buyer heterogeneity
  body: Black Lake is not selling one undifferentiated MES package. The combination of Heihu Zhizao for larger, multi-plant organizations and Small Work Order for high-mix SMEs maps well to how Chinese manufacturing demand is actually segmented.
  claimRefs:
  - CM021
  - CM023
  - CM024
  - CM025
