  evidenceGaps:
  - type: missing-source
    severity: material
    topic: share-gap
    missingEvidence: A directly accessible IDC table or independent analyst report that publishes Black Lake's exact China public-cloud SaaS MES share.
    whyItMatters: The accessible public summary confirms category size and Black Lake's top-tier position but not the exact share needed for precise market-share underwriting.
    diligencePath: Obtain the full IDC report or an authorized analyst excerpt that reproduces the cloud-MES vendor-share table.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: sea-revenue-gap
    missingEvidence: Country-level Southeast Asia customer counts, revenue, partner mix, and local legal-entity footprint for Black Lake.
    whyItMatters: Regional option value is strategically relevant, but without local revenue or deployment proof it should not be underwritten as a core current growth engine.
    diligencePath: Request management's regional pipeline, signed customer list, and entity / partner map by ASEAN country.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: minor
    topic: budget-owner
    missingEvidence: Role-specific procurement evidence showing which titles approve Black Lake contracts by segment and ACV band.
    whyItMatters: Public case studies reveal pain points but not formal budget ownership, which matters for sales-cycle forecasting and channel design.
    diligencePath: Interview recent customers and request a segmented sales-motion breakdown from management.
    relatedQuestionRefs:
