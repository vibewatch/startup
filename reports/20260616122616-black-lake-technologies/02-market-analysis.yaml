- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - China manufacturing digitization at 89.6% coverage and 57.7% equipment penetration
    - Positive
    - Current
    - Broadens the installed base that can adopt execution software rather than just basic digitization
    - Request Black Lake's mix of first-time digitizers vs replacement deals
  - - Smart-factory and 5G industrial infrastructure buildout
    - Positive
    - Current
    - Makes multi-site data visibility and connected workflows more realistic at scale
    - Test how much of Black Lake demand comes from 5G / IIoT-enabled projects
  - - Rapid growth in industrial AI and agent use
    - Positive
    - Current to near-term
    - Raises value of structured production data and can expand software wallet share
    - Request attach rates and paid pricing for AI modules
  - - Cloud delivery and lower rollout cost
    - Positive
    - Current
    - Supports Black Lake's wedge against long-cycle on-prem deployments
    - Validate actual time-to-live and services burden on recent projects
  - - SME reluctance and capability gaps
    - Negative
    - Current
    - Can slow conversion even where digitization pain is obvious
    - Measure win rates and churn in the SME segment by industry and owner sophistication
  - - Cost, use-case clarity, and data readiness barriers for industrial AI
    - Negative
    - Current
    - Can delay AI upsell even after core MES adoption
    - Separate paid AI usage from pilot or marketing-stage usage
  - - Standards, security, and trust gaps
    - Negative
    - Current
    - Raises friction in regulated or security-sensitive factories
    - Confirm security certifications, audit history, and regulated-industry references
  - - Uneven ASEAN digital maturity
    - Negative
    - Near-term
    - Makes regional expansion country-selective rather than one-size-fits-all
    - Prioritize country sequencing, partner model, and local implementation economics
  notes: The same macro environment that helps demand also makes execution uneven; underwriting should distinguish between category momentum and Black Lake's ability to convert that momentum into repeatable, profitable deployments.
