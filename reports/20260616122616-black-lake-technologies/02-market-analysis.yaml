- id: china-sizing-and-demand-backdrop
  title: China sizing lenses and demand backdrop
  body: |-
    The most decision-useful sizing lens is the public China MES market rather than a hand-wavy "industrial software" TAM. IDC's 2024 market read puts China MES solutions at RMB15.91 billion, with RMB6.29 billion in software and RMB1.005 billion in public-cloud SaaS MES. Those layers matter because they show both opportunity and constraint: Black Lake is competing inside a real and growing software category, but the public-cloud slice remains much smaller than the full services-plus-software pool. The company's underwriting case therefore depends less on claiming a massive theoretical market and more on taking share as deployment preferences migrate toward cloud-native, cross-factory coordination and AI-enriched workflows.

    China's macro adoption backdrop is strong enough to support that migration. CAICT says 89.6% of above-scale industrial enterprises had undertaken digital transformation by end-2025, while equipment digitization reached 57.7%. Digitization is deepest in automotive, shipbuilding, and electronics, and national infrastructure keeps widening: more than 30,000 basic smart factories, more than 1,200 advanced smart factories, more than 230 excellence-level smart factories, and nationwide 5G-plus-industrial-internet coverage across all 41 industrial categories. NBS data on connected devices, industrial robots, and additive manufacturing reinforce the same point: Chinese manufacturing is no longer debating whether digitization matters, but which software layers, delivery models, and AI features deliver the fastest operational payoff.
