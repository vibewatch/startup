  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A dated, audited company KPI sheet reconciling current customer count, headcount, and country footprint.
    whyItMatters: Black Lake uses 4,000+, 32,000+, 34,000+, and near-40,000 scale figures across public materials, which changes how much operating leverage later chapters should assume.
    diligencePath: Request the latest board deck or investor update with definitions for customers, factories, supply-chain participants, and active countries.
    relatedQuestionRefs:
    - QO011
    - QO013
    - QO014
    relatedTableRefs:
    - TO001
    - TO005
    - TO006
  - type: conflicting-data
    severity: material
    topic: capital-history
    missingEvidence: A clean financing ledger that reconciles RMB and USD totals, rounds, and whether secondaries or venture debt are included.
    whyItMatters: 'The Series D is clear, but total capital raised is not: CB Insights shows $108.53M while Caixin says the April 2026 round exceeded prior cumulative financing.'
    diligencePath: Request the cap-table summary, round-by-round closing schedule, and any secondary or debt disclosures under NDA.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: Current revenue, ARR, gross margin, and cash-burn figures.
    whyItMatters: The company says it is profitable and growing >60%, but underwriting valuation, efficiency, and durability requires precise operating metrics.
    diligencePath: Request audited 2024-2025 financials plus current ARR bridge and cohort retention metrics.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
    - TO004
  - type: missing-source
    severity: material
    topic: governance-control
    missingEvidence: Current board composition, share classes, voting rights, investor protections, and any founder-control arrangements.
    whyItMatters: A named director roster is not enough to assess control, veto rights, or governance risk after the 2026 Series D.
    diligencePath: Request the post-Series-D board list, shareholder agreement summary, and fully diluted cap table.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
    - TO004
  - type: missing-source
    severity: material
    topic: entity-structure
    missingEvidence: A clear explanation of how Shanghai Black Lake Technology Co., Ltd. relates to Shanghai Black Lake Network Technology Co., Ltd. and the operating brand.
    whyItMatters: Later diligence on IP ownership, contracting entity, and legal liability depends on knowing which entity holds customers, employees, and software rights.
    diligencePath: Request business-license set, intercompany structure chart, and IP-assignment summary from counsel.
    relatedQuestionRefs:
    - QO019
    - QO025
    relatedTableRefs:
    - TO006
  - type: access-blocked
    severity: minor
    topic: legal-risk
    missingEvidence: Case-level docket details and disposition records behind the summarized hearing notices and litigation relationships.
    whyItMatters: The public risk summaries show that legal activity exists, but without docket-level detail it is hard to tell whether the matters are routine commercial disputes or a more material signal.
    diligencePath: Pull docket records directly from the relevant courts or a paid enterprise-risk database before treating the notices as a hard underwriting negative.
    relatedQuestionRefs:
    - QO020
    - QO024
    relatedTableRefs:
    - TO007
