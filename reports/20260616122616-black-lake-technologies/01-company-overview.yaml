- id: milestones-footprint-and-risk-signals
  title: Milestones, footprint, and early risk signals
  body: |-
    The strongest strategic through-line in the record is Black Lake's shift from collaboration SaaS into industrial AI. The origin story begins with factory-floor workflow coordination, evolves through rapid-deployment products such as Small Work Order, and by 2023-2026 becomes explicitly framed as an AI-native manufacturing operating system with industrial agents for quoting, order splitting, scheduling, production, and quality. That transition is not purely marketing language: independent 2026 reporting describes concrete agent categories, task volume at scale, and a management thesis that Chinese manufacturing may leap directly from low-software penetration into agent-led decision support.

            Geographic ambition is also visible, though still more narrative than audited fact. Public sources reference Singapore, Indonesia, and Vietnam; Baidu's English profile goes further to claim operations in 12 countries; and China Daily plus Jiemian describe rising overseas interest and travel. The company is therefore best described as early international rather than domestically confined.

            Risk signals exist, but they are summary-level. Aiqicha and Baidu profile pages show hearing notices, litigation relationships, and equity-freeze references, yet no public source in hand demonstrates a sanction, insolvency process, or product-recall event. The adverse conclusion is therefore nuanced: there is enough smoke to warrant docket-level follow-up, but not enough disclosed substance to make legal overhang a chapter-one red flag on its own.
