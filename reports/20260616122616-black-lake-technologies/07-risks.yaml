  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: legal-risk
    missingEvidence: Case dockets, claim amounts, counterparties, and outcomes for the open-court notices and litigation relationships tied to the operating entity.
    whyItMatters: Public counts alone do not show whether the legal matters are routine labor/vendor disputes or investment-material liabilities.
    diligencePath: Request the litigation schedule, docket list, pleadings, and settlement/outcome summary from management or outside counsel.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: private-company-disclosure
    missingEvidence: Audited revenue, gross margin, renewal, churn, and customer-concentration data behind the public growth and valuation narrative.
    whyItMatters: The company is private and public KPI coverage is media-reported, so downside sensitivity cannot be underwritten from public sources alone.
    diligencePath: Ask for audited financial statements, board reporting, top-customer mix, NRR/GRR, and cohort retention in the data room.
    relatedQuestionRefs:
    - QR024
    - QR028
  - type: missing-source
    severity: material
    topic: ai-accuracy-risk
    missingEvidence: Independent measurements of AI-agent error rates, override frequency, rollback mechanisms, and customer-level incident outcomes.
    whyItMatters: The public AI thesis depends on decision quality rather than only workflow digitization, so unverified accuracy claims can translate into operational loss or churn.
    diligencePath: Request offline-eval methodology, customer case logs, human-override metrics, and any third-party validation of agent performance.
    relatedQuestionRefs:
    - QR023
    - QR030
  - type: access-blocked
    severity: material
    topic: integration-dependency
    missingEvidence: A full public or diligence-room API catalog with auth model, versioning policy, sandbox access, and support SLAs.
    whyItMatters: Integration risk is central to implementation success, but the public developer surface is too thin to independently assess breadth, governance, or backwards-compatibility discipline.
    diligencePath: Request sandbox credentials, API change logs, integration architecture diagrams, and implementation runbooks.
    relatedQuestionRefs:
    - QR010
    - QR025
  - type: missing-source
    severity: material
    topic: overseas-expansion
    missingEvidence: Country-by-country data-flow maps, local hosting architecture, transfer mechanisms, and compliance ownership for overseas factories.
    whyItMatters: Expansion into multiple jurisdictions compounds data, AI, labor, and implementation risk if production data crosses borders without a documented control framework.
    diligencePath: Request the overseas deployment checklist, transfer impact assessments, standard contracts, and local counsel memos for each active country.
    relatedQuestionRefs:
    - QR021
    - QR026
  - type: missing-source
    severity: minor
    topic: security-governance
    missingEvidence: Public uptime history, incident disclosures, pen-test summaries, or external assurance reports.
    whyItMatters: Public trust signals are helpful but do not substitute for operational evidence on resilience or incident response.
    diligencePath: Request status-page history, incident postmortems, security-review summaries, and customer security questionnaires.
    relatedQuestionRefs:
    - QR025
