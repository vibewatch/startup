callouts:
- calloutType: risk
  title: 'Top underwriting risk: disclosure opacity compounds everything else'
  body: Black Lake's public story is strong enough to matter, but too many core KPIs remain media-reported or company-reported. That makes legal counts, AI-performance claims, customer-scale claims, and cyclical sensitivity harder to normalize into one defendable base case.
  claimRefs:
  - CR001
  - CR025
  - CR030
  - CR044
- calloutType: risk
  title: AI upside is real, but the public validation stack is still thin
  body: The company likely has genuine product progress, yet public evidence still stops short of independent error-rate, override, or incident-quality disclosure. The IC should treat AI-agent claims as promising but not yet fully audited.
  claimRefs:
  - CR029
  - CR030
  - CR031
- calloutType: recommendation
  title: Best diligence leverage comes from one integrated data-room request
  body: Ask management for one package that reconciles audited KPIs, litigation detail, AI evals, API governance, and overseas data-transfer architecture. Those five items clear most of the remaining high-residual risks at once.
  claimRefs:
  - CR001
  - CR011
  - CR018
  - CR031
  - CR044
