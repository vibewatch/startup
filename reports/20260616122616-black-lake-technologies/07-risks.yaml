- id: market-partner-risks
  title: Demand cyclicality, partner dependence, and macro transmission
  body: The public macro evidence makes cyclical demand a real risk rather than a generic caution. Black Lake's fastest-growth public surface is the SME-focused Small Work Order product, while official May 2026 PMI data shows medium and small manufacturers below the expansion threshold and Reuters reports weak domestic demand plus rising cost pressure. That does not prove immediate churn, but it does create a credible path to slower logo adds, softer seat expansion, lower willingness to pay for AI upgrades, and delayed implementation projects among the exact cohort that values low-friction rollout. The dependency story is similarly structural. Black Lake relies on mainstream clouds, integration layers, external documentation gateways, and factory ecosystem connectivity across supply chain, logistics, planning, and production. Once the company follows customers overseas, those dependencies broaden further into local data-transfer mechanisms, legal advisers, visa logistics, and local operating
    partners. None of these are fatal on their own; together they create a multi-node failure chain that deserves explicit monitoring.
