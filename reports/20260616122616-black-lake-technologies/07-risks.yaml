- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Legal / regulatory overhang
    - New disclosed proceedings or regulator inquiry
    - Any material claim, injunction, or data-governance inquiry affecting production or cross-border processing
    - Pause underwriting until counsel quantifies liability and remediation
  - - Private-company disclosure risk
    - Data room cannot reconcile revenue, profitability, customer counts, and retention with public narrative
    - If audited or board-level KPIs materially diverge from the media story
    - Move to research-more or re-cut price/risk terms
  - - AI-agent accuracy risk
    - Evidence of frequent human overrides, customer complaints, or costly decision errors
    - Override rates or error losses materially above management narrative
    - Treat agent moat claims as unproven and haircut adoption assumptions
  - - SME cyclical demand risk
    - PMI or customer data show sustained weakness in SMB manufacturing demand
    - Two or more quarters of worsening SMB conversion, churn, or seat compression
    - Reset base-case growth and payback expectations
  - - Overseas expansion risk
    - Each new country requires bespoke legal or data-transfer work rather than repeatable process
    - Country launches repeatedly depend on emergency visas, custom hosting, or ad hoc legal fixes
    - Constrain expansion premium and require stronger local control framework
  - - Implementation / integration risk
    - Delayed go-lives or failed integrations cluster in major customer rollouts
    - Repeat escalation on ERP/device/API integration in reference checks or deployment cohorts
    - Treat services capacity and partner governance as gating diligence items
  notes: 'Kill criteria are designed for IC use: each trigger is something management should be able to measure or document during diligence rather than a vague sentiment test.'
