- id: growth-drivers-constraints-and-unresolved-sizing
  title: Growth drivers, constraints, and unresolved sizing questions
  body: 'The most durable market drivers are dependency sprawl, repeated supply-chain attacks, AI-assisted development, and regulation. Sonatype says yearly open-source downloads surpassed 9.8 trillion in 2025 and malware grew 75%, while its Q1 2026 malware index reported 21,764 malicious packages in a single quarter and 1.346 million since 2017. AppSecSanta’s 2026 statistics page separately cites $60 billion of 2025 supply-chain attack cost and a path to $138 billion by 2031. These figures are directionally supportive rather than canonical, but together they reinforce the same conclusion: organizations are not buying this tooling because the category is fashionable; they are buying it because ungoverned software consumption now looks like a board-level operational risk.


    The main constraints are equally clear. Mordor flags lack of universally accepted SBOM formats, AppSec/DevSecOps talent shortages, tool sprawl, and perceived IP-leakage risk with cloud-native scanners as category restraints. JFrog adds a different problem: most critical alerts are noise, with only 11.9% of 248 high-profile CVEs in one review judged genuinely exploitable. Black Duck’s positioning, which emphasizes on-prem, hosted, and air-gapped options plus deep knowledge-base context, effectively acknowledges the same buyer concern: many enterprises want workflow-integrated supply-chain tooling, but they do not want to create new data exposure or alert fatigue to get it. The unresolved analytical question for Sonatype is therefore not whether the market exists; it is how much of the broad market is truly serviceable for a platform that blends repository control, SCA, SBOM, and AI/OSS governance in large regulated accounts rather than chasing every lighter-weight developer tool use case.'
