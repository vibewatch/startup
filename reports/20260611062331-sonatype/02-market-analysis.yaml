  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A management-grade market model reconciling broad platform TAM, SCA share, SBOM subsegment size, and Sonatype’s true serviceable wedge.
    whyItMatters: Publisher disagreement is too large to support one canonical top-down market number for valuation without a bottoms-up overlay.
    diligencePath: Build a bottoms-up SAM from regulated large-enterprise and public-sector accounts that need repository plus SCA plus SBOM plus policy controls.
    relatedQuestionRefs:
    - QM010
    - QM011
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: buyer-conversion
    missingEvidence: Independent evidence on win rates, sales-cycle length, and consolidation ROI for enterprise buyers choosing integrated software supply chain platforms.
    whyItMatters: The market can be large and still convert poorly if buyers delay purchases because of integration fatigue or budget ambiguity.
    diligencePath: Request win-loss data, customer ROI studies, and sales-cycle distributions from management.
    relatedQuestionRefs:
    - QM018
    - QM019
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: minor
    topic: standards-fragmentation
    missingEvidence: More precise cross-vendor evidence on real-world SPDX, CycloneDX, and VEX interoperability friction.
    whyItMatters: Format fragmentation is a stated restraint, but the public record here is still more directional than quantified.
    diligencePath: Interview customers and implementation partners that run multi-tool SBOM workflows across regulated environments.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: sonatype-sam
    missingEvidence: Management view of which buyer segments, geographies, and product bundles Sonatype treats as its actual serviceable market.
    whyItMatters: A vendor’s real serviceable market is usually much narrower than public broad-category TAM numbers.
    diligencePath: Obtain internal segmentation decks, pipeline composition, and product attach-rate data under NDA.
