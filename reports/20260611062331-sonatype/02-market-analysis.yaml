tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Repository and artifact control
    - Binary repositories, package proxies, policy enforcement on artifact flow
    - General storage and backup software
    - Platform engineering; central IT
    - Core because Sonatype originated here and still monetizes control of dependency intake
  - - Software composition analysis
    - Open-source inventory, vulnerability and license checks, remediation guidance
    - Generic code quality tools without dependency intelligence
    - AppSec; engineering security
    - Core because SCA remains the buyer’s first governance layer
  - - SBOM management and compliance
    - SBOM generation, exchange, audit evidence, lifecycle monitoring
    - Standalone GRC platforms without software-component depth
    - Compliance; procurement; security
    - Increasingly important because regulation is moving from guidance to enforcement
  - - Integrity, provenance, and tamper detection
    - Build attestation, integrity verification, dependency provenance
    - Generic SIEM or endpoint tools
    - Security architecture; regulated engineering orgs
    - Adjacent but increasingly convergent with repository and SCA controls
  - - Broader DevSecOps / cybersecurity
    - Static/dynamic testing, cloud posture, network security
    - Unrelated endpoint, email, or network controls
    - CISO organization
    - Useful context but too broad to treat as Sonatype’s direct served market
  notes: The market boundary is intentionally operational rather than vendor-marketing-driven; the same spend bucket can be labeled differently across publishers.
