  - - Federal attestation and SBOM requests
    - tailwind
    - current
    - Compliance moves demand from optional tooling to procurement requirement
    - Confirm whether federal buyers purchase Sonatype for compliance alone or as part of broader repository/SCA bundles
  - - EU CRA enforcement timeline
    - tailwind
    - 2026-2027
    - Lifecycle obligations broaden demand beyond U.S. federal procurement
