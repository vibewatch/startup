      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is cross-functional. The day-to-day users are developers, platform engineering teams,
              DevOps, and AppSec practitioners because the tools sit in package resolution, CI/CD, pull-request checks,
              repository management, and remediation workflows. The economic buyer, however, is often central security,
              platform engineering leadership, or enterprise IT because the software must satisfy policy, risk,
              procurement, and audit requirements across the organization rather than for one development team. In
              regulated environments, compliance, procurement, and legal functions become de facto co-payers because
              they can block adoption if the tooling cannot generate audit-ready artifacts such as SBOMs, attestations,
              and vulnerability records. That is why public sector, financial services, healthcare, and large software
              vendors recur across sources as the most natural early adopters.


              Adoption is also becoming more consolidated. JFrog’s 2026 state-of-the-union page says organizations cut
              their application security tool count nearly in half, signaling buyer fatigue with fragmented point tools.
              At the same time, the same JFrog report says npm overtook Maven as the most-used enterprise ecosystem by
              traffic and that Hugging Face model growth has created a new class of artifact that traditional governance
              was not built to manage. In other words, the number of artifact types and governance surfaces is expanding
              even as buyers want fewer control planes. That tension favors vendors like Sonatype that can sell one
              workflow-integrated platform spanning repository, SCA, SBOM, and policy enforcement, but it also raises
              the execution bar because buyers want integration depth, lower alert noise, and explainable policy
              outcomes.
