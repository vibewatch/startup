chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founders, and product spine
        blocks:
          - type: paragraph
            body: >-
              Sonatype’s core identity is unusually durable for a cybersecurity infrastructure company. The business was
              founded in 2008 by Jason van Zyl and Brian Fox, two figures tied closely to Apache Maven and the early
              Java dependency ecosystem. That origin matters because Sonatype’s commercial wedge was not a bolt-on
              security point solution; it grew out of the workflow layer developers already depended on for binary and
              package management. Reviewed official materials continue to position the company as the maintainer of
              Maven Central and the creator of Nexus Repository, and current product navigation still treats repository
              management, software composition analysis, malware prevention, SBOM management, and AI/open-source
              governance as one connected platform rather than disconnected modules. That gives later diligence chapters
              a clean canonical description: Sonatype sells software supply chain management and security products that
              sit in the artifact, dependency, and policy path of enterprise software delivery.


              The company’s current public positioning also shows how it is adapting its old repository-management
              franchise to newer AI and software supply chain risks. The homepage, 2026 malware research,
              package-registry initiative, and product pages all emphasize AI-driven DevSecOps, automated governance,
              and real-time intelligence rather than only classic artifact storage. In practical terms, the named
              product set now spans Nexus Repository, Lifecycle, Firewall, Guide, SBOM Manager, and Maven Central
              stewardship. The message is consistent across official and independent sources: Sonatype wants to be the
              control plane for what developers and AI coding systems are allowed to consume, rather than merely a
              scanner that reports problems after the fact. That continuity from Maven-era dependency management to
              present-day OSS and AI governance is one of the strongest overview facts in the record.
