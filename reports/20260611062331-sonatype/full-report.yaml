      - number: '8.3'
        title: Entry discipline, kill triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The practical underwriting conclusion is fair-to-stretched rather than clearly attractive. Sonatype’s
              public evidence is strong enough to say the business likely deserved a unicorn-plus enterprise value after
              2024-06-11 and may still justify roughly that neighborhood today. But it is not strong enough to say
              outside investors should confidently pay through that level without new diligence. The missing pieces all
              sit exactly where private-equity software outcomes tend to swing: debt load, preference and rollover
              structure, retention durability, ARR mix, and the balance between regulated-account stickiness and
              bundled-platform competition.


              For that reason, entry discipline has to separate enterprise value from equity value. If Sonatype carries
              meaningful net debt or transaction preferences, the equity value available to a new investor could be
              materially below the headline enterprise value anchor. If leverage is light and ARR quality remains
              intact, the headline EV anchor becomes more durable and the downside narrows. This is why the chapter does
              not recommend a buy call from public evidence alone.


              The most important kill triggers are observable. A clear post-2024 slowdown in ARR growth, evidence that
              GitHub, GitLab, or JFrog are displacing Sonatype in repository-led accounts, or any revelation of
              heavier-than-expected debt or preference overhang would push the valuation into the bear range. By
              contrast, a fresh lender or sponsor process, retention disclosure, and a clean debt-and-cash bridge could
              move the stance from research-more toward a firmer underwriting view. Until then, the right call is to
              treat Sonatype as a credible but incompletely disclosed mid-band private software asset.
            claimRefs:
              - CV016
              - CV017
              - CV032
              - CV033
              - CV041
              - CV044
