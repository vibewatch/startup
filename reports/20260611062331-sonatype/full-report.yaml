  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Typical enterprise Sonatype customer journey from open-source risk recognition to embedded CI/CD policy gates and
      downstream procurement / expansion surfaces.
    data:
      items:
        - label: Risk Trigger
          value: Manual dependency review, false positives, repository sprawl, compliance pressure, or malicious-package fear
          note: Common pains shown in bank, healthcare, and manufacturing stories.
        - label: Evaluation
          value: Repository, Lifecycle, or Firewall compared against existing tooling and competitors
          note: Endress+Hauser explicitly compared Sonatype with Black Duck and Veracode.
        - label: Initial Embed
          value: CI/CD handoff, proxy repository, build breaker, or lifecycle scan in existing toolchain
          note: ABN AMRO, Krungsri, and Pershing all describe workflow insertion rather than greenfield replacement.
        - label: Operational Proof
          value: Faster builds, better deployment cadence, lower false positives, earlier remediation, or secure procurement
          note: Public proof is strongest where operational metrics are disclosed.
        - label: Expansion
          value: >-
            Add policy gates, Firewall, legal/compliance automation, SBOM management, or public-sector contract buying
            paths
          note: This is the visible land-and-expand loop in public materials.
        - label: Renewal Proxy
          value: System becomes mission-critical artifact, policy, or monitoring layer inside delivery workflows
          note: Public evidence suggests stickiness, but Sonatype does not disclose renewal cohorts.
    claimRefs:
      - CU012
      - CU020
      - CU024
      - CU039
      - CU040
      - CU042
