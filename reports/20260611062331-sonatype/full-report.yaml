            body: >-
              The final risk bucket is not a public red flag so much as a persistent underwriting gap. Public sources
              give enough evidence to see adoption, platform breadth, and regulated-market fit, but not enough to judge
              renewal strength with confidence. Reviewed materials do not disclose NRR, GRR, top-customer share,
              public-sector revenue exposure, or module-level attach. Review pages also show pricing sensitivity, mixed
