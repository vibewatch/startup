      - number: '7.3'
        title: Ownership overhang, regulatory reset, and channel-dependent public-sector exposure
        blocks:
          - type: paragraph
            body: >-
              Governance and go-to-market risk are intertwined. Reuters-reported sale coverage makes clear that Vista
              has at least explored strategic alternatives for Sonatype, which is normal for a mature sponsor-backed
              software asset but still leaves investors underwriting a business with limited public disclosure under an
              ownership structure that could change. At the same time, Sonatype benefits from real government and
              regulated-market relevance, but recent U.S. policy signals make that relevance less automatic than a pure
              SBOM story might imply. CISA and NSA still frame SBOMs as useful supply-chain instruments, while OMB
              M-26-05 shifts agencies toward broader risk-based validation instead of prescriptive software-accounting
              processes. That makes Carahsoft and AWS procurement routes helpful but not sufficient. Public-sector
              traction can still be valuable, yet the winning motion likely depends on operating outcomes, support, and
              implementation credibility as much as on compliance artifacts. Because public-sector ARR mix is not
              disclosed, concentration remains plausible but not quantifiable from public sources.
