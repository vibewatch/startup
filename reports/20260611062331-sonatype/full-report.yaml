  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and the buyer job to be done
        blocks:
          - type: paragraph
            body: >-
              The buyer is not just selecting an SCA scanner. The real job is to control which components and artifacts
              enter software delivery workflows, detect security and license issues early enough to avoid rework,
              generate compliance evidence such as SBOMs, and do all of that without breaking developer velocity. That
              broader job definition is why Sonatype faces several classes of competition at once. Snyk, Mend, Black
              Duck, Checkmarx, and Endor compete most directly on dependency risk discovery and remediation. JFrog
              competes from the artifact-system-of-record layer, where Xray is sold beside repository and registry
              control. GitHub Advanced Security and GitLab compete by bundling code and dependency security directly
              into the development platform many teams already standardize on. FOSSA competes where legal and license
              compliance are the primary buying trigger, while Socket presses on malicious-package detection with a
              lighter, developer-first posture. The practical consequence is that Sonatype wins when buyers want one
              control plane spanning repository governance, policy enforcement, and compliance evidence, and loses more
              readily when the buyer optimizes for native SCM bundling, lower entry price, or narrow developer-centric
              remediation features.
            claimRefs:
