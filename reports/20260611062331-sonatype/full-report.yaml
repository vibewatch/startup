  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Shows how business quality, public valuation support, and unresolved capital-structure risk combine into a
      research-more recommendation.
    data:
      nodes:
        - id: n1
          label: Repository-led product breadth
          description: Repository, SCA, SBOM, government, and AI-governance surfaces support infrastructure-like stickiness.
        - id: n2
          label: Regulated customer proof
          description: Customer and government evidence supports demand in compliance-sensitive accounts.
        - id: n3
          label: 2024 profitable ARR anchor
          description: Reuters-reported process marker placed Sonatype above $1.5B EV on about $150M ARR and profitability.
        - id: n4
          label: Current public comp band
          description: Public software comps range from low-single-digit EV/revenue to mid-teen premium developer multiples.
        - id: n5
          label: Disclosure and compression risk
          description: Debt ambiguity, retention opacity, and AI or bundling pressure block a buy call.
        - id: n6
          label: Research-more / fair-to-stretched
          description: Valuation is supportable but not clearly attractive without fresh diligence.
    approximationNotes: This is an analytical decision path rather than a company-reported process map.
    claimRefs:
      - CV003
      - CV008
      - CV017
      - CV043
      - CV047
      - CV049
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Illustrates which diligence outcomes most move Sonatype enterprise value relative to the base-case midpoint.
    data:
      items:
        - label: Net debt / preference burden worse than expected
          value: -250
          unit: US$M EV vs. base midpoint
          detail: Largest single swing because Reuters reported EV including debt, not equity value.
        - label: Retention or ARR growth weaker than assumed
          value: -200
          unit: US$M EV vs. base midpoint
          detail: Would pull Sonatype toward mature software floors.
        - label: Bundled competition / AI compression intensifies
          value: -150
          unit: US$M EV vs. base midpoint
          detail: Public comparables show premium multiples are unstable under disruption.
        - label: Fresh proof of double-digit profitable growth
          value: 200
          unit: US$M EV vs. base midpoint
          detail: Would justify holding closer to premium repository and developer-infrastructure comps.
        - label: Clean cash-flow and gross-margin bridge
          value: 150
          unit: US$M EV vs. base midpoint
          detail: Would narrow the opacity discount and support firmer underwriting.
    approximationNotes: >-
      Sensitivity values are directional analytical deltas around the base-case midpoint, not model outputs from
      management guidance.
    claimRefs:
      - CV041
      - CV043
      - CV045
      - CV046
      - CV047
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Enterprise-value range view that separates bear, base, and bull underwriting cases.
    data:
      items:
        - label: Bear case
          low: 800
          mid: 950
          high: 1100
          unit: USD millions EV
          detail: Assumes weaker ARR quality, heavier leverage, or comp compression.
          source: Public comps + adverse signals
          tone: negative
        - label: Base case
          low: 1100
          mid: 1350
          high: 1600
          unit: USD millions EV
          detail: Anchors near the 2024 process marker while applying an opacity discount.
          source: Reuters anchor + comp band
          tone: neutral
        - label: Bull case
          low: 1600
          mid: 1800
          high: 2000
          unit: USD millions EV
          detail: Needs proof of durable profitable growth and limited net debt.
          source: Premium repository / developer-infra comps
          tone: positive
    approximationNotes: >-
      All ranges are enterprise-value ranges. Public evidence does not support an equity-value or return-range figure
      until debt and preference terms are disclosed.
    claimRefs:
      - CV040
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Six IC-style indicators summarize where Sonatype scores well and where public-evidence quality remains weakest.
    data:
      items:
        - label: Market / category relevance
          value: High
          detail: Regulation, repository governance, and software-supply-chain security remain real budget lines.
        - label: Product / moat quality
          value: Medium-high
          detail: Repository control plus governance breadth is valuable, but bundling risk is real.
        - label: Customer proof
          value: Medium-high
          detail: Public references in finance and government support real enterprise depth.
        - label: Economics quality
          value: Medium
          detail: 2024 profitability helps, but current gross-margin and retention data are missing.
        - label: Evidence quality
          value: Medium-low
          detail: The main Sonatype valuation anchor is still a July 2024 process report, not fresh audited disclosure.
        - label: Valuation attractiveness
          value: Fair to stretched
          detail: Supportable around the 2024 anchor, but not clearly compelling on public data alone.
    approximationNotes: These KPIs are analytical judgments derived from chapter evidence, not company-reported operating metrics.
    claimRefs:
      - CV017
      - CV021
      - CV043
      - CV047
      - CV049
