      - number: '7.2'
        title: Operating complexity, workflow noise, and trust-surface burden
        blocks:
          - type: paragraph
            body: >-
              The operating risk is not that Sonatype is a flimsy product; it is that the product is important enough to
              create a large blast radius when it is misconfigured, noisy, or down. Official system requirements show
              that meaningful self-managed Nexus deployments need external PostgreSQL, node sizing, storage discipline,
              and attention to unsupported patterns. That is a real implementation burden versus SaaS-first point tools.
              Review evidence points the same way: users repeatedly praise artifact control and CI/CD fit, but they also
              flag documentation, UI, analytics, NPM, replication, and setup friction. The policy layer carries a second
              risk. Firewall and Lifecycle create value by sitting early in the intake and decision path, but that means
              false positives, poor tuning, or data-quality slippage can slow releases and undermine developer trust.
              Sonatype’s public trust center and status page are positives, yet they also create higher expectations for
              incident transparency, certification scope, and support maturity than the current public record fully
              satisfies.
