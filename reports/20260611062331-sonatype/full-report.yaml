  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow positioning
        blocks:
          - type: paragraph
            body: >-
              Sonatype sells a connected software-supply-chain control plane, not a narrow point scanner. The deepest
              public evidence still centers on Nexus Repository and Lifecycle: Repository owns binary, package, and
              proxy control, while Lifecycle adds policy, open-source intelligence, and remediation context. SBOM
              Manager and Guide extend the suite in two strategically logical directions. SBOM Manager turns the same
              component inventory into audit-ready evidence, monitoring, and VEX workflows for compliance teams. Guide
              pushes the company into AI-native software governance by feeding live dependency intelligence into coding
              assistants instead of waiting for post-commit alerts. Maven Central and the broader data-services layer
              matter because they help explain why Sonatype keeps framing itself as an intelligence company as much as a
              tooling vendor. The public product story is coherent: repository control, dependency policy,
              malicious-package prevention, compliance evidence, and AI dependency guidance are meant to reinforce one
              another. The main uncertainty is not what the suite is trying to be; it is how much of current customer
              value still comes from the mature Repository plus Lifecycle base versus the newer Guide, Firewall, and
              SBOM adjacencies.
