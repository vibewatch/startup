      - number: '2.2'
        title: Sizing lenses and the regulatory floor
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates vary sharply because publishers define the category differently. Mordor
              frames a broad software supply chain security platforms market that already stood at $5.53 billion in 2025
              and could reach $10.10 billion by 2030, with SCA taking 40.7% of 2024 share. 6Wresearch gives a much
              smaller 2026 category value of $1.19 billion, while Verified Market Reports places the 2026 market at
              $2.16 billion. That spread is not just noise; it reflects a real taxonomy problem. Some publishers include
              repository control, integrity verification, provenance, and broader DevSecOps governance, while others
              isolate a narrower risk-warning or tamper-detection tool set. The SBOM-management subsegment itself is
              also substantial and growing quickly, with Statifacts placing it at $2.034 billion in 2026 and Technavio
              describing a $1.41 billion 2025 market growing at 22.1% CAGR.


              Regulation helps explain why the market can sustain both broad platform and narrow compliance-tool
              narratives at once. NIST SP 800-218 defines the secure software development baseline for U.S. federal
              procurement, CISA’s attestation form operationalizes that baseline and notes that agencies may require a
              current SBOM on request, and the EU Cyber Resilience Act imposes lifecycle cybersecurity obligations
              across products with digital elements. The EU page states that reporting obligations begin in September
              2026 and the main CRA obligations apply from December 2027. Sonatype’s 2026 regulation commentary usefully
              interprets the same pattern: 2026 is the turning point from guidance to enforcement. That means category
              demand is no longer purely threat-led; it is increasingly compliance-led as well.
