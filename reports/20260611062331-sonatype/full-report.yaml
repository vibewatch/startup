  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'External pressure: bundling, JFrog adjacency, and SCA / SBOM commoditization'
        blocks:
          - type: paragraph
            body: >-
              Sonatype faces a market risk that is more subtle than a single feature gap. The category is being
              compressed from three directions at once: GitHub and GitLab increasingly sell security inside the
              development platform contract, JFrog can pair artifact management with software-supply-chain security
              inside one registry-led motion, and lighter-weight vendors such as Snyk or FOSSA make baseline SCA or SBOM
              workflows easy to buy without a bigger platform decision. Public pricing pages show why this matters.
              GitHub now sells security add-ons directly per active committer, GitLab places advanced security inside
              Ultimate, JFrog markets a single supply-chain platform, and FOSSA already includes imported SBOMs and
              compliance reporting in lower-friction plans. None of that proves Sonatype lacks differentiation, but it
              does mean differentiation has to live above commodity scanning and reporting. The burden is on Sonatype to
              show that repository control, lower-noise intelligence, and regulated-environment fit produce better win
              rates and renewal durability than bundled or cheaper alternatives.
            claimRefs:
              - CR001
