      - number: '3.2'
        title: Product scope, deployment, and feature positioning
        blocks:
          - type: paragraph
            body: >-
              Sonatype's durable differentiation starts with repository heritage. Its public platform surface combines
              Nexus Repository, Lifecycle, Firewall, Guide, and SBOM Manager, which together cover binary control,
              open-source policy, malware blocking, AI/open-source intelligence, and compliance reporting. JFrog has the
              closest adjacency because Artifactory plus Xray similarly couples system-of-record control with security
              scanning. Snyk, Mend, Checkmarx, Endor, and Socket instead lead with detection, prioritization, and
              remediation workflows; they can be easier to adopt because they do not require the repository to be the
              control anchor, but they also create more multi-vendor architectures. Black Duck and Checkmarx emphasize
              deeper detection, reachability, malicious-package analysis, or on-premises and air-gapped deployment,
              reflecting their appeal in more regulated or security-mature accounts. GitHub and GitLab compete on
              developer workflow integration rather than stand-alone supply-chain specialization: they embed security
              into the place where code already lives. The implication is that Sonatype's best competitive posture is
              not to out-market every point feature; it is to win accounts that value repository control, policy
              centralization, and deployment flexibility enough to tolerate a broader platform decision.
