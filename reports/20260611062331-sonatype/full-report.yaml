      - number: '6.4'
        title: Durability, implementation friction, and public evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The main customer diligence risk is not lack of logos; it is lack of durability disclosure. Sonatype's
              public record does not disclose NRR, GRR, churn, contract length, or top-customer concentration, so
              stickiness has to be inferred from workflow centrality and regulated-buyer fit rather than proven through
              cohorts. Independent review evidence is directionally constructive but not clean. TrustRadius and PeerSpot
              suggest Nexus becomes mission-critical once it manages proxying, artifact storage, and policy gates, yet
              the same sources surface documentation issues, UI friction, harder NPM workflows, and limited pricing
              transparency. Review transparency is also imperfect: current G2 and Gartner pages were not directly
              retrievable during this run because of JS or human-validation gates. Finally, the user-specified logos
              Boeing, Capital One, and Comcast were not supportable in the reviewed 2025-2026 official customer pages.
              That does not disprove those relationships, but it means this chapter should rely on the named references
              it can actually verify rather than on remembered logo-wall assumptions.
