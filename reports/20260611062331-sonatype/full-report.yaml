  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and why this category exists
        blocks:
          - type: paragraph
            body: >-
              The market Sonatype serves is narrower than generic cybersecurity and broader than classic SCA alone. The
              consistent boundary across official, analyst, and regulatory sources is software supply chain security:
              products and services that give organizations visibility into software components, control over what
              enters build and runtime pipelines, and evidence that software was built, selected, and maintained
              according to secure development policies. In practical buying terms that means repository and artifact
              control, software composition analysis, SBOM generation and lifecycle management, vulnerability and
              exploitability intelligence, provenance and tamper detection, and workflow-integrated governance inside
              CI/CD and developer tooling. This boundary excludes unrelated categories such as endpoint protection,
              network perimeter security, and generalized cloud security platforms unless they specifically manage
              software dependencies or build integrity.


              The market exists because modern software production depends on layers of third-party and open-source code
              that move faster than manual review can handle. GitHub’s research says open source powers nearly every
              piece of modern software and that 92% of developers use or experiment with AI coding tools, while Synopsys
              says over 97% of code in most codebases comes from open source. CISA’s SBOM page describes the SBOM as a
              key building block in software security and software supply chain risk management, and Sonatype’s own 2026
              regulatory commentary says open source now makes up 80-90% of modern applications. The core market logic
              is therefore not optional-feature security spending; it is the operating need to know what code is being
              consumed, whether it is safe enough to use, and whether the organization can prove that to auditors,
              regulators, and customers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
