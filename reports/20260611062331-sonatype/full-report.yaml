        - Cap-table and transaction-terms review.
      - - ARR quality and retention
        - Current ARR, ARR growth, NRR, GRR, logo churn, and multi-product attach.
        - Distinguishes durable premium revenue from a stale 2024 snapshot.
        - Board deck or operating KPI packet.
      - - Margin and cash conversion
        - Current gross margin, EBITDA, free cash flow, and support / hosting cost mix.
        - Validates whether revenue multiples should sit nearer JFrog or lower software floors.
        - QoE and management bridge.
      - - Competitive proof
        - Current win-loss, top-customer concentration, and regulated-account renewal evidence.
        - Tests whether repository control still protects value against bundling and AI disruption.
        - Commercial diligence and customer calls.
    notes: >-
      Every ask is aimed at moving the valuation stance from plausible to underwritable rather than simply adding more
      market color.
    claimRefs:
      - CV017
      - CV041
      - CV047
      - CV048
      - CV049
