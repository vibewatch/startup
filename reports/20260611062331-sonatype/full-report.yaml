  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer pains
        blocks:
          - type: paragraph
            body: >-
              Sonatype's public customer record is concentrated in large, security-sensitive organizations rather than
              SMB self-serve buyers. Official segment pages and case studies consistently map to enterprise platform
              engineering, application security, compliance, and procurement stakeholders across financial services,
              government, healthcare, manufacturing, and technology. The recurring buyer pain is not generic dependency
              scanning; it is the operational cost of unsafe open source inside existing CI/CD pipelines, combined with
              new compliance pressure around SBOMs, malicious packages, and AI model use. Government pages emphasize
              zero-trust, EO 14028, and secure development in sensitive environments. Financial-services pages emphasize
              the need to innovate quickly without failing compliance. Healthcare and manufacturing pages stress
              resilience, uptime, and regulated-data protection. This pattern matters because it suggests Sonatype often
              wins where a central repository or policy engine can become infrastructure for many teams rather than a
              narrow point tool for one project.
