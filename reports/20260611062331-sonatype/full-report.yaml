        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Sonatype's monetization model is easiest to understand as a layered software platform rather than as a
              single

              security SKU. The clearest public pricing evidence is for Nexus Repository Cloud, where Sonatype
              officially

              advertises pricing that starts at $135 plus consumption per month, with consumption defined as total
              monthly

              egress plus total monthly storage. Official product pages also make clear that the same repository product
              is

              available as SaaS, self-hosted, on-prem, and air-gapped software. That matters financially because it
              implies

              Sonatype can monetize the same core workflow through recurring cloud usage, enterprise self-managed

              subscriptions, and regulated-environment deployments that are unlikely to be price-transparent.


              The repository franchise is also no longer the whole story. Official pages and the 2024 Buy with AWS
              release

              show Sonatype selling or packaging Lifecycle, SBOM Manager, and Repository Firewall alongside Nexus

              Repository. In other words, the company appears to monetize three layers at once: repository and traffic

              management, software composition and policy intelligence, and compliance/SBOM workflows. The procurement

              motion is visibly enterprise-led. Sonatype's own AWS announcement highlights private offers via AWS

              Marketplace, while TrustRadius and CloudRepo show only partial plan-level price snapshots rather than a
              clean

              public list for realized enterprise contracts. The practical conclusion is that public pricing can anchor
              how the

              model works, but not how much revenue each customer cohort actually delivers after discounts, bundle
              attach,

              and multi-product upsell.
