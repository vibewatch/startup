      - number: '1.3'
        title: Capital history, scale markers, and milestone chronology
        blocks:
          - type: paragraph
            body: >-
              Sonatype’s capital formation story is visible enough to establish direction even if not every historical
              round detail is equally clean. Official sources confirm a $30 million Goldman Sachs-led financing in
              February 2016 and an $80 million TPG-led minority investment in September 2018, both framed around
              accelerating product development, sales, marketing, and international expansion. Those releases also
              supply useful historical scale checkpoints: in early 2016 Sonatype said more than 90,000 organizations
              used its Nexus solutions, while the 2018 investment release said the Nexus platform was being used by more
              than 10 million software developers and 1,000 enterprises worldwide. Vista Equity Partners then acquired
              Sonatype in November 2019, turning the business from a venture-backed growth company into a
              private-equity-owned software asset with more explicit exit optionality.


              The single most important post-cutoff valuation marker is external, not official. Reuters reporting from
              July 12, 2024, mirrored on MarketScreener and Economic Times, said Vista was exploring options including a
              sale or minority stake transaction that could value Sonatype at more than $1.5 billion including debt. The
              same reporting said Sonatype had engaged Goldman Sachs, was generating about $150 million in annual
              recurring revenue, and was profitable. Those are not audited disclosures, so they belong in the report as
              third-party-reported and freshness-sensitive claims rather than management facts. But together with
              current company claims of nearly 2,000 organizations, 15 million developers, strong financial-services
              penetration, and ongoing 2026 product and leadership announcements, they anchor a credible late-stage
              picture: Sonatype appears to be a scaled, profitable software infrastructure company with multiple exit
              paths, but still limited public financial transparency.
