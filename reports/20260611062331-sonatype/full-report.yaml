      - number: '1.2'
        title: Leadership transition, governance context, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Leadership is the biggest current change in the overview chapter. In July 2025 Sonatype appointed Bhagwat
              Swaroop as chief executive officer and moved Wayne Jackson, who had led the company for roughly 15 years,
              into the executive chairman role. That transition looks planned rather than distressed: the announcement
              frames Swaroop as a scale operator with experience at Entrust, One Identity, Proofpoint, NetApp, Symantec,
              Intel, and McKinsey, while Jackson’s statement emphasizes continuity around open source and AI governance.
              Independent reposts from ON Partners and Intelligence Community News corroborate the same leadership
              shift, and ON Partners adds a useful current operating-footprint detail by stating that Sonatype is
              headquartered in Fulton, Maryland with offices in the United Kingdom, Australia, Colombia, and India.


              What remains less transparent is the deeper governance picture. Reviewed public material is rich on
              executive messaging but comparatively sparse on board composition, investor-control rights, or any updated
              cap-table breakdown after the 2019 Vista acquisition. Even the company page fetched with full text is more
              useful for product navigation than for formal corporate governance disclosure. That means the chapter can
              support a high-confidence statement that the CEO transition is real, current, and non-emergency, but not a
              high-confidence statement about how much authority sits with Vista, which directors remain active, or
              whether founder Jason van Zyl still plays an operating role day to day. That is a meaningful diligence gap
              because Sonatype is late-stage, private, and potentially sale-ready.
            claimRefs:
