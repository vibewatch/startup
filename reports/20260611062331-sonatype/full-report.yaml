      - number: '6.3'
        title: Adoption motion, procurement, and stickiness proxies
        blocks:
          - type: paragraph
            body: >-
              The customer motion visible in public materials is land-with-workflow, then expand-with-governance. Case
              studies usually start with one of four pains: manual security review, poor component visibility, false
              positives, or repository sprawl. Sonatype then gets embedded into the CI/CD path as an artifact manager,
              policy gate, or lifecycle monitor. Once embedded, expansion surfaces include firewalling inbound packages,
              adding SBOM workflows, broadening legal/compliance coverage, or extending procurement through AWS
              Marketplace and public-sector contract vehicles. This is not the same as proven net retention, but it is a
              plausible stickiness proxy because customers repeatedly describe Nexus or Lifecycle as a handoff point,
              quality gate, or always-on monitoring layer. Public-sector procurement evidence also matters. Carahsoft
              positions Sonatype for government buyers and lists active contract vehicles, while AWS Marketplace offers
              a cloud-procurement path for Nexus Repository. Those surfaces lower friction for regulated accounts even
              though Sonatype does not publish segment ARR or renewal rates.
