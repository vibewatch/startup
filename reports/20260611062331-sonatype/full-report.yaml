companyProfile:
  summary: >-
    Sonatype is a late-stage private, Vista-owned software supply chain security company founded in 2008 by Jason van
    Zyl and Brian Fox and now headquartered in Fulton, Maryland. The company has evolved from Maven-ecosystem roots into
    a broader control plane spanning Nexus Repository, Lifecycle, Firewall, Guide, SBOM Manager, and Maven Central
    stewardship, with deployment options across SaaS, self-hosted, and air-gapped environments. Public materials and
    Reuters' July 2024 reporting together support a picture of a scaled, profitable enterprise software asset with
    nearly 2,000 organizations, 15 million developers, and meaningful penetration in regulated accounts, but with
    material residual opacity around capital structure, retention, and current operating metrics.
  founders:
    - name: Jason van Zyl
      role: Co-founder
      background: Creator of Apache Maven and the founder most directly tied to Sonatype's Maven-ecosystem origin.
      claimRefs:
        - CO001
        - CO002
    - name: Brian Fox
      role: Co-founder
      background: >-
        Co-founded Sonatype alongside Jason van Zyl and helped anchor the company's early Maven and
        repository-management identity.
      claimRefs:
        - CO001
  headquarters: Fulton, Maryland, USA
  productSummary: >-
    Sonatype sells a software supply chain control plane centered on Nexus Repository, Lifecycle, Firewall, Guide, SBOM
    Manager, and Maven Central stewardship, combining repository control, software composition analysis,
    malicious-package prevention, compliance evidence, and AI dependency guidance.
  customerFocus: >-
    Large enterprises and regulated buyers — especially financial services, government, healthcare, manufacturing, and
    technology organizations — that need centralized artifact control, secure software delivery, and audit-ready
    open-source governance.
  businessModel: >-
    Recurring software model anchored by repository subscriptions and usage-based cloud pricing, plus quote-led
    enterprise upsells across Lifecycle, Firewall, SBOM, and related governance workflows, with procurement support
    through channels such as AWS Marketplace and Carahsoft.
  stage: Late-stage private / private-equity owned
  fundingStatus: >-
