      - number: '3.4'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Sonatype does have a moat, but it is conditional rather than universal. Repository control, deep binary
              and component governance, malware prevention, and enterprise deployment options create higher switching
              costs than pure scanner products because moving the artifact system of record touches CI/CD, developer
              workstations, package policies, and audit flows at once. That favors Sonatype in large regulated
              enterprises with hybrid environments and formal compliance needs. The moat is less secure in teams that
              are already standardized on GitHub or GitLab and can absorb dependency security as a platform add-on, or
              in cloud-native teams that prefer point tools such as Snyk, Endor, or Socket for faster adoption and more
              targeted remediation. JFrog remains the most strategically dangerous rival because it can pair repository
              control with security inside the same commercial motion, while GitHub and GitLab remain the biggest
              distribution threats because they can lower incremental procurement friction to near zero. Black Duck,
              FOSSA, Mend, and Checkmarx are more situational but can still win when license compliance depth, broader
              AST bundling, or malicious-package and reachability claims matter more than repository centralization. The
              unresolved diligence question is not whether Sonatype has differentiation; it is whether that
              differentiation converts into repeatable win rates and renewal durability against bundled incumbents.
