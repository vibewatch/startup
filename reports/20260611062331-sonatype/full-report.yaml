  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation anchor and comparable band
        blocks:
          - type: paragraph
            body: >-
              The cleanest public Sonatype valuation anchor is not a new funding round or a disclosed sponsor mark, but
              the July 2024 Reuters-reported sale process. Three accessible Reuters-attributed reprints say Vista
              explored either a sale or a minority stake transaction that could value Sonatype at more than $1.5 billion
              including debt, while the company was generating about $150 million of ARR and was profitable. That
              matters because it places a credible public marker on Sonatype after 2024-06-11 and implies about 10x
              EV/ARR. On that evidence alone, Sonatype clearly supported unicorn status after 2024-06-11.


              The same evidence also sets a hard boundary on what can be claimed. Reuters explicitly said including
              debt, so the reported figure is enterprise value, not a clean equity-value datapoint. Public sources do
              not disclose Sonatype’s current net debt, preferred stack, rollover equity, or sponsor-to-management
              economics. That means the public record supports a valuation anchor, but not an equity cheque amount.


              Current public comps widen the picture. GitLab screens around the mid-3x EV/revenue area, Elastic and
              Progress sit in the low- to mid-single digits, Atlassian is also near the high-3x range, while JFrog and
              DigitalOcean command premium mid-teen multiples. Sonatype’s implied 10x 2024 EV/ARR anchor therefore lands
              in the middle of the current band: materially above slower, broader software names, but still below the
              most premium developer-infrastructure valuations. The right read is that Sonatype’s public valuation
              support is real, but it is a triangulation exercise rather than a single-point mark.
            claimRefs:
              - CV010
              - CV011
