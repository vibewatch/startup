summary:
  headline: >-
    Sonatype appears to be a credible, profitable software-supply-chain control-plane asset with strong
    regulated-enterprise proof, but private-equity opacity, bundled-platform competition, and incomplete debt and
    retention disclosure keep the report in research-more territory.
