evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, ownership percentages, debt package, and investor-control rights after Vista acquisition.
    whyItMatters: >-
      Late-stage sponsor-owned companies can look stable publicly while having very different control, leverage, and
      exit constraints privately.
    diligencePath: Request an updated board list, capitalization summary, and debt schedule from management or the data room.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-profile
    missingEvidence: Management-certified current ARR, revenue, gross margin, EBITDA, and net retention figures.
    whyItMatters: >-
      Overview judgment and valuation anchoring are materially weaker when third-party-reported ARR and database revenue
      estimates cannot be reconciled.
    diligencePath: Obtain board pack KPIs or audited / reviewed financial statements covering 2024-2026.
    relatedQuestionRefs:
      - QO015
      - QO022
  - type: missing-source
    severity: minor
    topic: capital-history
    missingEvidence: A clean, source-backed pre-Vista financing ledger with precise dates and all legacy investors.
    whyItMatters: >-
      Historical capital efficiency and investor behavior help frame ownership expectations and realized value at the
      Vista transaction.
    diligencePath: Cross-check company records, investor announcements, and commercial databases under NDA.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
      - TO004
  - type: access-blocked
    severity: minor
    topic: user-reviews
    missingEvidence: More detailed first-hand negative workflow and usability commentary from enterprise users and former employees.
    whyItMatters: >-
      The public overview can identify potential workflow-fit risk, but cannot yet quantify whether it is isolated or
      systematic.
    diligencePath: >-
      Collect customer-reference calls, win-loss notes, and full review-platform exports rather than relying on public
      snippets.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A management-grade market model reconciling broad platform TAM, SCA share, SBOM subsegment size, and Sonatype’s
      true serviceable wedge.
    whyItMatters: >-
      Publisher disagreement is too large to support one canonical top-down market number for valuation without a
      bottoms-up overlay.
    diligencePath: >-
      Build a bottoms-up SAM from regulated large-enterprise and public-sector accounts that need repository plus SCA
      plus SBOM plus policy controls.
    relatedQuestionRefs:
      - QM010
      - QM011
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-conversion
    missingEvidence: >-
      Independent evidence on win rates, sales-cycle length, and consolidation ROI for enterprise buyers choosing
      integrated software supply chain platforms.
    whyItMatters: >-
      The market can be large and still convert poorly if buyers delay purchases because of integration fatigue or
      budget ambiguity.
    diligencePath: Request win-loss data, customer ROI studies, and sales-cycle distributions from management.
    relatedQuestionRefs:
      - QM018
      - QM019
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: minor
    topic: standards-fragmentation
    missingEvidence: More precise cross-vendor evidence on real-world SPDX, CycloneDX, and VEX interoperability friction.
    whyItMatters: Format fragmentation is a stated restraint, but the public record here is still more directional than quantified.
    diligencePath: Interview customers and implementation partners that run multi-tool SBOM workflows across regulated environments.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: sonatype-sam
    missingEvidence: >-
      Management view of which buyer segments, geographies, and product bundles Sonatype treats as its actual
      serviceable market.
    whyItMatters: A vendor’s real serviceable market is usually much narrower than public broad-category TAM numbers.
    diligencePath: Obtain internal segmentation decks, pipeline composition, and product attach-rate data under NDA.
    relatedQuestionRefs:
      - QM023
      - QM024
      - QM026
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: No public management-grade win-loss data versus JFrog, GitHub, GitLab, or Snyk.
    whyItMatters: Without this, the chapter can describe logical threats but not measure actual displacement rates.
    diligencePath: Request competitive win-loss by segment, reason code, and incumbent platform.
    relatedQuestionRefs:
      - QP018
      - QP019
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Public pages do not show Sonatype realized ASPs, discount ladders, or the broader platform list-price
      architecture.
    whyItMatters: Price transparency risk may be overstated or understated without actual deal data.
    diligencePath: Request pricing waterfalls, discount bands, and gross retention by package.
    relatedQuestionRefs:
      - QP011
      - QP015
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: medium
    topic: renewal-durability
    missingEvidence: No public retention, NRR, or renewal benchmarks by competitor class.
    whyItMatters: Switching-cost arguments are stronger if they show up in retention outcomes.
    diligencePath: Request churn and expansion by repository-led versus scanner-led customer cohorts.
    relatedQuestionRefs:
      - QP016
      - QP025
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: medium
    topic: feature-parity
    missingEvidence: >-
      Vendors market similar capabilities, but public pages do not normalize detection quality, false positives, or
      deployment maturity.
    whyItMatters: Capability matrices can overstate equivalence or difference without benchmark testing.
    diligencePath: Run controlled bake-off across representative repos and regulated deployment scenarios.
    relatedQuestionRefs:
      - QP009
      - QP010
      - QP024
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: arr-revenue-bridge
    missingEvidence: >-
