  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric / issue
      - Impact on underwriting
      - Current public evidence
      - Exact diligence path
    rows:
      - - ARR-to-revenue bridge and product mix
        - Cannot reconcile repository, security, compliance, and services revenue quality
        - Reuters gives ARR marker; market-data sources disagree on revenue
        - Request quarterly ARR, GAAP revenue, deferred revenue, and product-mix bridge
      - - Gross margin and COGS split
        - Cannot judge software margin path or incremental economics
        - No reviewed public source discloses gross margin
        - Request COGS by cloud infrastructure, support, data operations, and services
      - - Retention metrics (NRR / gross retention / churn)
        - Cannot verify durability of installed-base economics
        - No public NRR or churn disclosure found
        - Request trailing 8-quarter cohort retention and expansion analysis
      - - CAC, payback, and sales-cycle efficiency
        - Cannot underwrite incremental growth capital needs
        - Only old 2018 sales-growth and pipeline proxies are public
        - Request S&M spend, new logo count, sales-cycle length, and CAC payback by segment
      - - Cash, runway, and debt terms
        - Cannot test capital adequacy or downside resilience
        - Historical debt exists, but current balance and terms are not public
        - Request cash balance, monthly burn or cash generation, debt schedule, and covenant package
      - - Government revenue concentration
        - Cannot assess whether public-sector procurement meaningfully changes revenue quality
        - Public search surfaces exist but do not disclose enough contract detail
        - Request top-customer concentration, public-sector ARR, and renewal profile
      - - Realized pricing and discounting
        - Cannot know how far list pricing differs from enterprise ASPs
        - Public list evidence exists only for a subset of offers
        - Provide price waterfall from list to realized contract value by product family
    notes: >-
      Each row is a true underwriting blocker or material uncertainty rather than a cosmetic disclosure preference.
