  - id: capital-structure-and-capital-adequacy
    title: Capital structure and capital adequacy
    body: |-
      The capital-history facts needed for underwriting are clear even though the full chronology already lives in
      Company Overview. Sonatype raised a $30 million equity-and-debt round led by Goldman Sachs in 2016,
      took an $80 million TPG-led minority investment in 2018, and was acquired by Vista Equity Partners in
      November 2019. The latest public external valuation anchor is the July 2024 Reuters report that Vista was
      exploring a sale or minority stake transaction at more than $1.5 billion including debt. Reuters also said
      Sonatype was profitable at roughly $150 million of ARR, which is the strongest public evidence that the
      company may no longer be financing growth through obvious external burn.

      That said, capital adequacy is still not fully transparent. Reuters' inclusion of debt in enterprise value,
      combined with the 2016 financing's explicit debt component, tells us debt exists or has existed in the capital
      structure, but not what remains outstanding, under what covenants, or at what cost. The most concrete public
      filing evidence is at subsidiary level. Companies House shows SONATYPE UK LIMITED remains current on
      filings through 2024, with 2024 full accounts filed in January 2026. Those filings are useful for proving legal-
      entity maintenance and a minimum level of corporate hygiene, but they do not substitute for consolidated
      financial statements. Financially, the company looks more like a low-capex software asset with exit optionality
      than a business facing visible project-finance or manufacturing constraints, yet investors still lack the cash,
      debt, and working-capital detail needed to clear the capital-adequacy question fully.
    claimRefs:
      - CI013
      - CI015
      - CI016
      - CI017
      - CI018
      - CI030
      - CI031
      - CI032
      - CI038
      - CI040
      - CI041
