tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Nexus Repository Cloud
        - Recurring software subscription with usage-linked billing
        - Monthly base fee plus storage and egress consumption
        - Official starting price disclosed; pricing starts at $135 + consumption per month
        - High if customers expand artifact volume predictably; still software-like and recurring
        - Obtain ARR split between cloud subscription base and variable consumption
      - - Nexus Repository Pro / self-managed deployments
        - Enterprise subscription or license for self-hosted, on-prem, and air-gapped installs
        - Contracted software subscription / license
        - Paid Pro edition exists; exact realized enterprise pricing not publicly disclosed
        - Medium-to-high; sticky deployment, but renewal terms and discounts are private
        - Request realized ASP by deployment type and gross retention by cohort
      - - Community Edition funnel
        - Free product used to seed adoption and later upsell to enterprise tiers
        - Free / no direct license revenue
        - Community Edition is publicly available
        - Low direct monetization but strategically important for top-of-funnel
        - Disclose free-to-paid conversion and attach rates into Platform SKUs
      - - Lifecycle / SCA intelligence
        - Quote-led security and policy upsell on top of repository footprint
        - Per-user or enterprise contract benchmarks appear in third-party pricing pages; official realized pricing undisclosed
        - Officially sold as a product with continuous intelligence operations
        - Potentially high-margin software revenue if attach rates are durable
        - Provide standalone and attached ARR for Lifecycle
      - - SBOM Manager / compliance workflows
        - Audit-ready compliance and SBOM management sold as an additional workflow
        - Enterprise platform contract / quote-led
        - Officially positioned as compliance product; no public realized pricing
        - Quality potentially strong because regulation can make usage non-discretionary
        - Provide revenue contribution from SBOM/compliance SKUs
      - - Repository Firewall and AWS procurement channel
        - Threat-prevention add-on plus procurement path expansion via AWS Marketplace private offers
        - Platform add-on and enterprise private offer
        - Officially available on AWS by Dec. 2024
        - Supports upsell and procurement efficiency rather than pure list-price transparency
        - Disclose AWS-sourced pipeline and multi-product private-offer mix
      - - Support / migration / enterprise services
        - Deployment assistance, migration, and enterprise support around sticky repository infrastructure
        - Support contract or professional services attachment
        - Migration and enterprise support are publicly referenced, but revenue share is not disclosed
        - Lower quality than software subscription revenue if services mix is material
        - Split recurring software ARR from services and support revenue
    notes: >-
      List pricing is visible only for part of the cloud repository offer; most enterprise realized pricing, bundles,
      and discounts remain private.
