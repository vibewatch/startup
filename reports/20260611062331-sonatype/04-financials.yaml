callouts:
  - calloutType: strength
    title: Revenue quality looks better than raw disclosure quality
    body: >-
      Public evidence points to sticky, recurring developer-infrastructure revenue with clear cross-sell paths into
      policy, security, and compliance workflows, even though the exact ARR mix is private. The business model
      itself looks better than the disclosure package.
    claimRefs:
      - CI005
      - CI017
      - CI035
      - CI036
      - CI038
  - calloutType: risk
    title: Disclosure, not demand, is the main underwriting problem
    body: >-
      The biggest public-evidence failure is the absence of a current ARR-to-revenue bridge, margin build,
      retention metrics, and debt schedule. Without those items, even a seemingly profitable software asset can be
      mispriced.
    claimRefs:
      - CI029
      - CI033
      - CI034
      - CI040
      - CI042
