  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: arr-revenue-bridge
      missingEvidence: Current ARR, GAAP revenue, deferred revenue, and product-mix bridge by Repository, Lifecycle, Firewall, SBOM Manager, and services.
      whyItMatters: Without a clean bridge, revenue quality and platform attach cannot be underwritten with confidence.
      diligencePath: Request CFO-certified quarterly revenue bridge and product-mix schedule for the trailing eight quarters.
      relatedQuestionRefs:
        - QI014
        - QI015
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin-and-retention
      missingEvidence: Fully loaded gross margin, gross retention, net revenue retention, and churn by deployment model and major product family.
      whyItMatters: These are the core metrics needed to validate margin path and recurring revenue durability.
      diligencePath: Obtain management cohort tables and a COGS build that splits cloud infrastructure, support, and data-intelligence costs.
      relatedQuestionRefs:
        - QI014
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway-and-debt
      missingEvidence: Current cash balance, debt balance, maturity schedule, interest cost, covenant package, and internal runway view.
      whyItMatters: Public sources confirm debt entered the capital structure historically but do not show current downside resilience.
      diligencePath: Request treasury schedule, lender agreements, board deck liquidity slides, and latest monthly cash-flow statements.
      relatedQuestionRefs:
        - QI020
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-and-discounts
      missingEvidence: List-to-net pricing waterfall, enterprise discount bands, and attach rates from Repository into Lifecycle, Firewall, and SBOM Manager.
      whyItMatters: List prices and third-party plan snapshots do not reveal realized ASPs or bundle economics.
      diligencePath: Review a recent pricing book, sample executed order forms, and revenue-by-product ASP bridge.
