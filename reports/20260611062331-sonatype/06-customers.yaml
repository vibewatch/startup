callouts:
  - calloutType: strength
    title: Best public proof comes from regulated production workflows
    body: >-
      Sonatype's customer evidence is strongest where Repository or Lifecycle sits directly inside
      regulated CI/CD workflows. USPTO, Pershing, ABN AMRO, Discovery Health, Software AG, and
      multiple banks provide a stronger-than-average public record for an enterprise infrastructure
      vendor because they describe how Sonatype affects deployment cadence, security gating, or
      compliance at production scale.
    claimRefs: [CU012, CU017, CU018, CU022, CU023, CU026]
  - calloutType: risk
    title: Durability is inferred, not disclosed
    body: >-
      Workflow centrality and regulated procurement create plausible stickiness, but Sonatype still
      does not publish NRR, GRR, churn, contract-length, or customer-concentration data in the
      materials reviewed for this run. That leaves a meaningful diligence gap between strong logo /
      case-study evidence and proven customer durability.
    claimRefs: [CU037, CU038, CU039, CU042]
  - calloutType: insight
    title: Public proof favors core products over newer platform narrative
    body: >-
      The public customer record validates mature Repository and Lifecycle workflows far more
      clearly than it validates paid adoption of Guide, SBOM Manager, or other newer expansion
      modules. That does not make the newer narrative wrong, but it means investors should ask for
      attach and renewal data before underwriting platform-led expansion assumptions.
    claimRefs: [CU031, CU039]
