company:
  name: Sonatype
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence supports Sonatype as a scaled enterprise software-supply-chain vendor
    with particularly strong proof in regulated buyers such as banks and government agencies. The
    strongest public proof sits around mature Repository and Lifecycle deployments with quantified
    workflow gains, while retention, concentration, and newer AI/SBOM module attach remain
    materially under-disclosed.
sections:
  - id: customer-segments-and-buyer-pains
    title: Customer segments and buyer pains
    body: >-
      Sonatype's public customer record is concentrated in large, security-sensitive organizations
      rather than SMB self-serve buyers. Official segment pages and case studies consistently map
      to enterprise platform engineering, application security, compliance, and procurement
      stakeholders across financial services, government, healthcare, manufacturing, and
      technology. The recurring buyer pain is not generic dependency scanning; it is the
      operational cost of unsafe open source inside existing CI/CD pipelines, combined with new
      compliance pressure around SBOMs, malicious packages, and AI model use. Government pages
      emphasize zero-trust, EO 14028, and secure development in sensitive environments.
      Financial-services pages emphasize the need to innovate quickly without failing compliance.
      Healthcare and manufacturing pages stress resilience, uptime, and regulated-data protection.
      This pattern matters because it suggests Sonatype often wins where a central repository or policy
      engine can become infrastructure for many teams rather than a narrow point tool for one
      project.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007, CU008, CU041]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-customer-proof-and-vertical-coverage
    title: Named customer proof and vertical coverage
    body: >-
      The quality of Sonatype's public customer proof is solid by enterprise infrastructure
      standards. Named references span ABN AMRO, Nomura, BNP Paribas Personal Finance, Discovery
      Health, USPTO, a DOE laboratory, Krungsri, BNY Mellon | Pershing, Endress+Hauser, Trilliant,
      Software AG, and Mühlbauer. The vertical mix covers finance, government, healthcare,
      manufacturing, and technology with multiple proofs that appear to be production deployments
      rather than pilots. Several references include concrete operating outcomes: USPTO reported
      teams moving from concept to deployment in under 24 hours and more than 70,000 deployments
      in a year; Pershing cut builds from two hours to seven minutes or better and said it could
      deliver 66% more functionality; BNP Paribas cited impact across 250-plus developers. The
      caveat is that the deepest quantified proof still clusters around core Repository and
      Lifecycle workflows. Public evidence for newer AI and SBOM products is thinner and usually
      framed through solution pages or partner messaging rather than named production references.
    claimRefs: [CU012, CU014, CU015, CU016, CU017, CU018, CU022, CU023, CU029, CU031]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: adoption-motion-procurement-and-stickiness
    title: Adoption motion, procurement, and stickiness proxies
    body: >-
      The customer motion visible in public materials is land-with-workflow, then
      expand-with-governance. Case studies usually start with one of four pains: manual security
      review, poor component visibility, false positives, or repository sprawl. Sonatype then gets
      embedded into the CI/CD path as an artifact manager, policy gate, or lifecycle monitor. Once
      embedded, expansion surfaces include firewalling inbound packages, adding SBOM workflows,
      broadening legal/compliance coverage, or extending procurement through AWS Marketplace and
      public-sector contract vehicles. This is not the same as proven net retention, but it is a
      plausible stickiness proxy because customers repeatedly describe Nexus or Lifecycle as a
      handoff point, quality gate, or always-on monitoring layer. Public-sector procurement
      evidence also matters. Carahsoft positions Sonatype for government buyers and lists active
      contract vehicles, while AWS Marketplace offers a cloud-procurement path for Nexus
      Repository. Those surfaces lower friction for regulated accounts even though Sonatype does
      not publish segment ARR or renewal rates.
    claimRefs: [CU009, CU010, CU011, CU020, CU021, CU039, CU040, CU042]
    tableRefs: [TU004, TU005]
    figureRefs: []
  - id: durability-friction-and-public-evidence-gaps
    title: Durability, implementation friction, and public evidence gaps
    body: >-
      The main customer diligence risk is not lack of logos; it is lack of durability disclosure.
      Sonatype's public record does not disclose NRR, GRR, churn, contract length, or
      top-customer concentration, so stickiness has to be inferred from workflow centrality and
      regulated-buyer fit rather than proven through cohorts. Independent review evidence is
      directionally constructive but not clean. TrustRadius and PeerSpot suggest Nexus becomes
      mission-critical once it manages proxying, artifact storage, and policy gates, yet the same
      sources surface documentation issues, UI friction, harder NPM workflows, and limited pricing
      transparency. Review transparency is also imperfect: current G2 and Gartner pages were not
      directly retrievable during this run because of JS or human-validation gates. Finally, the
      user-specified logos Boeing, Capital One, and Comcast were not supportable in the reviewed
      2025-2026 official customer pages. That does not disprove those relationships, but it means
      this chapter should rely on the named references it can actually verify rather than on
      remembered logo-wall assumptions.
    claimRefs: [CU030, CU032, CU033, CU034, CU035, CU036, CU037, CU038]
    tableRefs: [TU006]
    figureRefs: []
