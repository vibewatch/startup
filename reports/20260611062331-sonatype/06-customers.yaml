  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof-coverage
      missingEvidence: A current referenceable-logo list showing which enterprise customers permit public naming, including whether Boeing, Capital One, or Comcast are active and referenceable.
      whyItMatters: The public chapter can only rely on named proof that is actually supportable. Unsupported remembered logos weaken customer-quality assessment and can overstate brand depth.
      diligencePath: Ask Sonatype for a permission-cleared customer reference list with status by logo, product, geography, and reference-call availability.
      relatedQuestionRefs: [QU020]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, logo churn, renewal rates, and median contract terms by major customer cohort.
      whyItMatters: Without retention disclosures, customer durability has to be inferred from workflow centrality rather than proven through cohorts.
      diligencePath: Request customer-success dashboards, renewal cohorts, and top-20 account renewal history for Repository, Lifecycle, Firewall, Guide, and SBOM Manager.
      relatedQuestionRefs: [QU023]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: concentration-and-vertical-mix
      missingEvidence: Top-customer concentration, public-sector ARR share, and revenue mix by financial services, government, healthcare, manufacturing, and technology.
      whyItMatters: Named references skew toward regulated buyers, but the revenue significance and concentration risk of those verticals are not visible publicly.
      diligencePath: Request ARR and bookings mix by vertical, channel, and top-10 account; reconcile to customer count and renewal concentration.
      relatedQuestionRefs: [QU024]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: material
      topic: new-module-attach
      missingEvidence: Named paying references and attach / renewal data for Guide, SBOM Manager, and other newer expansion modules.
      whyItMatters: The public narrative increasingly emphasizes AI and SBOM governance, but customer proof remains much stronger for mature Repository and Lifecycle workflows.
      diligencePath: Request paying-customer counts, ACVs, attach rates, and live references for Guide, SBOM Manager, and Firewall by customer segment.
      relatedQuestionRefs: [QU019]
      relatedTableRefs: [TU004, TU005]
    - type: access-blocked
      severity: minor
      topic: independent-review-transparency
      missingEvidence: Directly inspectable current G2 and Gartner review distributions, comments, and reviewer segmentation.
      whyItMatters: Independent review validation is weaker when high-visibility review platforms are blocked by JS or human-validation gates during diligence.
      diligencePath: Use analyst subscriptions or seller-provided exports to review current rating distributions and reviewer cohorts on blocked platforms.
      relatedQuestionRefs: [QU025]
