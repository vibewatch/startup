figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: Typical enterprise Sonatype customer journey from open-source risk recognition to embedded CI/CD policy gates and downstream procurement / expansion surfaces.
    data:
      items:
        - label: Risk Trigger
          value: Manual dependency review, false positives, repository sprawl, compliance pressure, or malicious-package fear
          note: Common pains shown in bank, healthcare, and manufacturing stories.
        - label: Evaluation
          value: Repository, Lifecycle, or Firewall compared against existing tooling and competitors
          note: Endress+Hauser explicitly compared Sonatype with Black Duck and Veracode.
        - label: Initial Embed
          value: CI/CD handoff, proxy repository, build breaker, or lifecycle scan in existing toolchain
          note: ABN AMRO, Krungsri, and Pershing all describe workflow insertion rather than greenfield replacement.
        - label: Operational Proof
          value: Faster builds, better deployment cadence, lower false positives, earlier remediation, or secure procurement
          note: Public proof is strongest where operational metrics are disclosed.
        - label: Expansion
          value: Add policy gates, Firewall, legal/compliance automation, SBOM management, or public-sector contract buying paths
          note: This is the visible land-and-expand loop in public materials.
        - label: Renewal Proxy
          value: System becomes mission-critical artifact, policy, or monitoring layer inside delivery workflows
          note: Public evidence suggests stickiness, but Sonatype does not disclose renewal cohorts.
    claimRefs: [CU012, CU020, CU024, CU039, CU040, CU042]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Public-evidence funnel from Sonatype's broad claimed customer base down to named references, quantified outcomes, and disclosed retention evidence.
    data:
      items:
        - label: Claimed installed base
          value: 2000
          detail: Nearly 2,000 global organizations / more than 2,000 enterprise customers in official and Reuters-backed materials
        - label: Named current references reviewed
          value: 12
          detail: Named customers surfaced in 2025-2026 official customer pages and roundups reviewed in this run
        - label: References with quantified operational outcomes
          value: 5
          detail: USPTO, Pershing, BNP Paribas, Software AG, and Fortune 200 financial story provide meaningful metrics or scale markers
        - label: References with partner / procurement signal
          value: 3
          detail: Government and marketplace paths are visible through Carahsoft, AWS Marketplace, and federal stories
        - label: Publicly disclosed retention cohorts
          value: 0
          detail: No NRR, GRR, churn, or contract-cohort disclosures found in reviewed public materials
    approximationNotes: >-
      Stages below the installed-base claim are counts of public evidence objects reviewed in this
      run, not internal funnel or conversion metrics from Sonatype.
    claimRefs: [CU001, CU002, CU017, CU018, CU029, CU037]
