callouts:
- calloutType: risk
  title: Bundling is the clearest external displacement threat
  body: Sonatype can still win on repository control, lower-noise intelligence, and regulated deployment
    fit, but public evidence shows that GitHub, GitLab, JFrog, and lighter-weight point tools now make
    it easy for buyers to obtain acceptable supply-chain security without a stand-alone Sonatype platform
    decision.
  claimRefs:
  - CR001
  - CR004
  - CR005
  - CR009
  - CR042
- calloutType: risk
  title: Control-plane products create higher operational blast radius
  body: Because Sonatype sits in the repository and policy path, implementation mistakes or service issues
    affect both security posture and release velocity. That creates stronger stickiness in good states,
    but it also means support maturity, docs quality, and incident discipline matter more than they do
    for a passive scanner.
  claimRefs:
  - CR012
  - CR015
  - CR020
  - CR041
  - CR043
- calloutType: recommendation
  title: The main diligence ask is proof of renewal durability, not more logo slides
  body: 'Public evidence already shows that Sonatype sells to meaningful enterprises and regulated accounts.
    The missing investment-grade evidence is cohort durability: NRR, GRR, module attach, public-sector
    mix, win-loss by bundled competitor, and implementation-to-renewal outcomes.'
  claimRefs:
  - CR031
  - CR044
  - CR045
  - CR046
