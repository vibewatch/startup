- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Bundled displacement by GitHub / GitLab / JFrog
    - Competitive loss mix
    - Repeated losses in GitHub-, GitLab-, or JFrog-standardized deals without a countervailing regulated-market
      win rate
    - Thesis weakens; require hard win-loss data before underwriting premium growth
  - - Deployment complexity and support burden
    - Implementation and support metrics
    - Time-to-value stretches materially, or support escalation themes cluster around configuration, docs,
      or policy tuning
    - Pause upside assumptions until onboarding economics and support quality are proven
  - - Control-plane trust failure
    - Incident evidence
    - Material repository, policy, or intelligence incident with weak postmortem discipline or customer-visible
      fallout
    - Treat as thesis-break risk because blast radius touches release reliability and customer trust
  - - Renewal opacity
    - Commercial diligence packet
    - Management cannot provide NRR, GRR, top-customer share, or module attach / renewal evidence
    - Do not underwrite durable expansion or premium valuation stance
  - - Public-sector concentration without proof
    - Segment diligence
    - Government or regulated-market concentration is material but unsupported by segment ARR, margins,
      or renewal strength
    - Discount moat assumptions until segment economics are proven
  - - Roadmap overreach in AI / newer modules
    - Module proof gap
    - Guide and SBOM Manager narrative outruns paid adoption, reference depth, or attach evidence
    - Value Sonatype primarily on mature Repository / Lifecycle base until newer modules are evidenced
  notes: These triggers are designed to be monitored during diligence and post-investment rather than
    treated as binary pre-close blockers in isolation.
