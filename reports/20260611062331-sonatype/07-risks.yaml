chapter:
  number: 7
  title: Risks
  summary: Sonatype’s biggest risks are budget compression from bundled DevSecOps platforms, operational
    friction from a control-plane product that can interrupt builds, and disclosure opacity under private-equity
    ownership. Public evidence still supports regulated-market relevance and genuine product depth, but
    renewal durability, public-sector mix, and full independent-review coverage remain under-disclosed.
sections:
- id: external-pressure-and-bundling
  title: 'External pressure: bundling, JFrog adjacency, and SCA / SBOM commoditization'
  body: 'Sonatype faces a market risk that is more subtle than a single feature gap. The category is being
    compressed from three directions at once: GitHub and GitLab increasingly sell security inside the
    development platform contract, JFrog can pair artifact management with software-supply-chain security
    inside one registry-led motion, and lighter-weight vendors such as Snyk or FOSSA make baseline SCA
    or SBOM workflows easy to buy without a bigger platform decision. Public pricing pages show why this
    matters. GitHub now sells security add-ons directly per active committer, GitLab places advanced security
    inside Ultimate, JFrog markets a single supply-chain platform, and FOSSA already includes imported
    SBOMs and compliance reporting in lower-friction plans. None of that proves Sonatype lacks differentiation,
    but it does mean differentiation has to live above commodity scanning and reporting. The burden is
    on Sonatype to show that repository control, lower-noise intelligence, and regulated-environment fit
    produce better win rates and renewal durability than bundled or cheaper alternatives.'
  claimRefs:
  - CR001
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR038
  - CR042
  tableRefs:
  - TR003
  figureRefs:
  - FR001
- id: operating-complexity-and-trust
  title: Operating complexity, workflow noise, and trust-surface burden
  body: 'The operating risk is not that Sonatype is a flimsy product; it is that the product is important
    enough to create a large blast radius when it is misconfigured, noisy, or down. Official system requirements
    show that meaningful self-managed Nexus deployments need external PostgreSQL, node sizing, storage
    discipline, and attention to unsupported patterns. That is a real implementation burden versus SaaS-first
    point tools. Review evidence points the same way: users repeatedly praise artifact control and CI/CD
    fit, but they also flag documentation, UI, analytics, NPM, replication, and setup friction. The policy
    layer carries a second risk. Firewall and Lifecycle create value by sitting early in the intake and
    decision path, but that means false positives, poor tuning, or data-quality slippage can slow releases
    and undermine developer trust. Sonatype’s public trust center and status page are positives, yet they
    also create higher expectations for incident transparency, certification scope, and support maturity
    than the current public record fully satisfies.'
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
