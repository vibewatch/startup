  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: trust-assurance-depth
    missingEvidence: Current SOC 2, ISO mapping, penetration-test summary, SLA commitments, and service-credit
      language for the products most relevant to enterprise buyers.
    whyItMatters: The trust center and status page prove the existence of a trust surface but do not provide
      enough public evidence to underwrite certification scope or service accountability.
    diligencePath: Request the current trust packet, SLA exhibits, and recent incident-review materials
      from Sonatype.
    relatedQuestionRefs:
    - QR010
  - type: private-evidence-only
    severity: blocking
    topic: renewal-durability
    missingEvidence: NRR, GRR, logo churn, top-customer concentration, public-sector ARR mix, and module-level
      attach / renewal data.
    whyItMatters: Without cohort durability evidence, investors cannot cleanly separate workflow stickiness
      from marketing-level customer proof.
    diligencePath: Request a cohort bridge by core Repository/Lifecycle accounts, newer modules, and public-sector
      segment.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR005
  - type: access-blocked
    severity: material
    topic: independent-review-triangulation
    missingEvidence: Retrievable G2 and Gartner review exports or screenshots with current rating distribution,
      top complaints, and review count trend.
    whyItMatters: Blocked independent-review surfaces limit the ability to quantify complaint concentration,
      rank movement, and sentiment drift across large review platforms.
    diligencePath: Use authenticated analyst or customer accounts, or request internally exported review
      dashboards during diligence.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: contract-risk-allocation
    missingEvidence: Current MSA, DPA, indemnity carve-outs, breach notice commitments, and negotiated
      enterprise SLA terms.
    whyItMatters: Contract-level risk allocation determines how much operational and privacy risk Sonatype
      retains versus pushes to customers, and those details are not visible in public materials.
    diligencePath: Review legal packet and redlines from a sample of large regulated customers.
    relatedQuestionRefs:
    - QR010
    - QR022
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: public-sector-economics
    missingEvidence: Direct-versus-channel bookings mix, reseller discounts, federal renewal rate, and
      margin impact for Carahsoft or marketplace-led deals.
    whyItMatters: Channel-heavy public-sector access can look attractive in logos while still masking
      margin pressure, concentration, or weak direct ownership of the customer relationship.
    diligencePath: Request federal pipeline, bookings mix, and partner economics by route to market.
    relatedQuestionRefs:
    - QR015
    - QR017
    relatedTableRefs:
    - TR001
    - TR003
