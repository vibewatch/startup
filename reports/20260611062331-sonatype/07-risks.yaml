- id: ownership-regulatory-and-channel-exposure
  title: Ownership overhang, regulatory reset, and channel-dependent public-sector exposure
  body: Governance and go-to-market risk are intertwined. Reuters-reported sale coverage makes clear that
    Vista has at least explored strategic alternatives for Sonatype, which is normal for a mature sponsor-backed
    software asset but still leaves investors underwriting a business with limited public disclosure under
    an ownership structure that could change. At the same time, Sonatype benefits from real government
    and regulated-market relevance, but recent U.S. policy signals make that relevance less automatic
    than a pure SBOM story might imply. CISA and NSA still frame SBOMs as useful supply-chain instruments,
    while OMB M-26-05 shifts agencies toward broader risk-based validation instead of prescriptive software-accounting
    processes. That makes Carahsoft and AWS procurement routes helpful but not sufficient. Public-sector
    traction can still be valuable, yet the winning motion likely depends on operating outcomes, support,
    and implementation credibility as much as on compliance artifacts. Because public-sector ARR mix is
    not disclosed, concentration remains plausible but not quantifiable from public sources.
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR046
  - CR047
  tableRefs:
  - TR001
  - TR004
  figureRefs:
  - FR003
- id: commercial-opacity-and-kill-criteria
  title: Commercial opacity, renewal uncertainty, and investor kill criteria
  body: 'The final risk bucket is not a public red flag so much as a persistent underwriting gap. Public
    sources give enough evidence to see adoption, platform breadth, and regulated-market fit, but not
    enough to judge renewal strength with confidence. Reviewed materials do not disclose NRR, GRR, top-customer
    share, public-sector revenue exposure, or module-level attach. Review pages also show pricing sensitivity,
    mixed free-tier perceptions, and at least one explicit JFrog displacement anecdote. Independent review
    coverage is incomplete because G2 and Gartner surfaces were blocked in this run, which limits complaint
    triangulation. That leaves a clean investor conclusion. Sonatype may still be a durable enterprise
    software asset, but the burden of proof now sits on three diligence asks: prove direct renewal durability,
    prove that bundled rivals are not taking share in GitHub-, GitLab-, or JFrog-centric accounts, and
    prove that the repository and policy control plane can sustain enterprise-grade reliability without
    generating enough noise to erode customer trust.'
