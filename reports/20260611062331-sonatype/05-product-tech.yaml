    whyItMatters: Public review evidence says Jenkins remains in real customer workflows, but the clearest retrievable current first-party Jenkins docs were not accessible from the live help surface during this run.
    diligencePath: Ask Sonatype for current Jenkins integration docs and a supported plugin matrix, then verify against a live customer implementation.
