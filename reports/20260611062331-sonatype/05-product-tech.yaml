    - Current standalone Firewall docs are harder to retrieve than adjacent products
  - - Generate compliance evidence
    - Security and procurement teams need SBOMs and VEX context
    - SBOM Manager
    - Automated generation, storage, monitoring, and distribution support audit readiness
    - Public module-level pricing and customer case studies are limited
  - - Embed security in existing DevOps tools
    - Customers want to keep GitHub, GitLab, Azure DevOps, and Jenkins workflows
    - Integrations layer
    - GitHub, GitLab, Azure DevOps, and review evidence show embedded workflow support
    - Bundled native platform security increases competitive pressure
