    - label: Developer & SCM Layer
      modules:
      - GitHub
      - GitLab
      - Azure DevOps
      - Jenkins / CI tooling
      - AI coding assistants
      note: Developers stay in existing code-hosting and CI surfaces rather than moving into a separate Sonatype IDE
    - label: Integration & Workflow Layer
      modules:
      - GitHub Actions
      - Azure DevOps extension
      - GitLab integration
      - Private-registry wiring
      - SBOM fetch / SARIF outputs
      note: This layer brings policy results into native workflows
    - label: Control Plane Layer
      modules:
      - Nexus Repository
      - Lifecycle / IQ policy engine
      - Firewall
      - SBOM Manager
      - Guide
      note: Repository, policy, compliance, and AI guidance are sold as one connected suite
    - label: Data & Intelligence Layer
      modules:
      - Open Source Intelligence
      - Maven Central stewardship
      - Data Services
      - Malware research
      - Compliance knowledge
