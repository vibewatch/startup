- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Repository service
    - Stores and proxies binaries, containers, packages, and AI models
    - Artifact-format handlers, object storage, identity controls
    - Repository is central to delivery workflows, so outages or bad config create broad blast radius
  - - IQ / policy engine
    - Applies security, license, and quality policy across SDLC stages
    - Lifecycle scans, Firewall logic, SBOM workflows
    - If policy tuning is weak, customers experience noise or adoption friction
  - - Open source intelligence and data services
    - Feed vulnerability context, package health, and trend data into the platform
    - Continuous collection, curation, Maven Central stewardship, status-visible data services
    - Data quality is a moat, but must stay better than public CVE or bundled platform alternatives
  - - SBOM and VEX layer
    - Generates, catalogs, augments, and monitors SBOMs
    - CycloneDX, SPDX, VEX support and compliance mappings
    - Regulatory relevance rises quickly, but module economics are still opaque publicly
  - - AI guardrail layer
    - Injects live dependency intelligence into MCP-capable assistants
    - Guide, MCP server, assistant support, platform APIs
    - Fast-evolving AI workflow standards can make roadmaps perishable
  - - Integration surfaces
    - Push results into GitHub, GitLab, Azure DevOps, and existing CI/CD
    - Marketplace extensions, actions, private registries, SCM permissions
    - Weak or stale integrations would immediately reduce platform stickiness
  - - Deployment and operations layer
    - Runs as SaaS, self-hosted, or disconnected with HA patterns
    - Cloud, containers, Kubernetes, external database, SAGE
    - Operational complexity rises in self-managed and regulated deployments
  notes: This table describes the control-plane architecture implied by public docs rather than an internal microservice diagram.
  claimRefs:
  - CE005
  - CE008
  - CE009
  - CE026
  - CE027
  - CE028
  - CE031
