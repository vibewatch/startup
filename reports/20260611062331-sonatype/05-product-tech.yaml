tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Workflow role
  - Maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Nexus Repository
    - Platform engineering / DevOps
    - Central artifact store, proxy, cache, binary distribution
    - Established core product
    - 20+ formats, private-registry control, flexible deployment, AI-model artifact support
    - Public module pricing and attach remain limited
  - - Lifecycle
    - AppSec / platform engineering
    - Policy evaluation, SCA, remediation, open-source governance
    - Established add-on with shared IQ engine
    - 24/7 curated intelligence and stage-aware policy enforcement
    - Public evidence does not quantify current attach or renewal by cohort
  - - Firewall
    - Security / platform engineering
    - Block malicious or unsafe OSS before intake
    - Current module but public docs feel less complete than adjacent products
    - Edge protection and malicious-package prevention fit naturally with repository control
    - Standalone architecture and current public docs are thin
  - - SBOM Manager
    - Compliance / security / procurement
    - Generate, store, monitor, distribute SBOMs and VEX
    - Newer but clearly productized compliance module
    - CycloneDX, SPDX, VEX, continuous monitoring, centralized SBOM catalog
    - Public adoption and pricing evidence are sparse
  - - Guide
    - Developers / AI-assisted coding teams
    - Inject live dependency intelligence into AI coding assistants
    - Newest strategic growth module
    - MCP-native guardrails, AI package quality context, free entry point
    - Public usage and monetization depth remain unclear
  - - Maven Central + data services
    - Developers / research / policy engine
    - Package discovery, intelligence, namespace/package trend data
    - Long-lived strategic asset
    - Stewardship of Central plus proprietary OSS intelligence creates data moat
    - Direct monetization and API economics are not public
  notes: Maturity reflects public evidence strength and product-surface continuity, not internal ARR contribution.
