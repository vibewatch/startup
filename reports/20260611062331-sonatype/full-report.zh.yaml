      - number: '3.4'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Sonatype 确实有护城河，但不是无条件的。仓库控制、深度二进制和组件治理、恶意软件预防以及企业部署选项，比纯扫描器产品制造更高切换成本，因为迁移制品系统记录会一次性触及
              CI/CD、开发者工作站、包策略和审计流。这有利于 Sonatype 在拥有混合环境和正式合规需求的大型受监管企业中守住位置。护城河在已经标准化到 GitHub 或
              GitLab、并能把依赖安全作为平台附加项吸收的团队中不那么稳；在偏好 Snyk、Endor 或 Socket 这类点工具以获得更快采用和更聚焦修复的云原生团队中也不稳。JFrog
              仍是最具战略危险性的对手，因为它能在同一商业动作中把仓库控制和安全配在一起；GitHub 和 GitLab 仍是最大的分销威胁，因为它们能把增量采购摩擦压到接近零。Black Duck、FOSSA、Mend 和
              Checkmarx 更具场景性，但当许可证合规深度、更宽 AST 捆绑，或恶意包与可达性主张比仓库集中更重要时，仍能赢单。未解的尽调问题不是 Sonatype
              有没有差异化，而是这种差异化能否转化为可重复的胜率和续约耐久性，顶住捆绑型存量平台。
