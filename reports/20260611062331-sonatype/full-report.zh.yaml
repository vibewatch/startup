  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买家要完成的任务
        blocks:
          - type: paragraph
            body: >-
              买家选择的不只是一个 SCA 扫描器。真正的任务，是控制哪些组件和制品进入软件交付工作流，尽早发现安全和许可证问题以避免返工，生成 SBOM 等合规证据，并且不打断开发者速度。这个更宽的任务定义解释了为什么
              Sonatype 同时面对多类竞争。Snyk、Mend、Black Duck、Checkmarx 和 Endor 在依赖风险发现和修复上最直接竞争。JFrog 从制品系统记录层竞争，Xray
              与仓库和注册表控制一起销售。GitHub Advanced Security 和 GitLab 通过把代码与依赖安全直接捆进许多团队已经标准化的开发平台来竞争。FOSSA
              在法务和许可证合规是主要购买触发因素时竞争；Socket 则以更轻、更偏开发者优先的姿态压向恶意包检测。实际结果是，买家想要一个横跨仓库治理、策略执行和合规证据的控制平面时，Sonatype
              更容易赢；买家优化原生 SCM 捆绑、更低入门价格或窄口径开发者修复功能时，Sonatype 更容易输。
