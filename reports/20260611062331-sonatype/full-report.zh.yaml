      - number: '4.2'
        title: 牵引力、收入质量与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Sonatype 的公开牵引力标记足以说明它是一家真实的企业软件公司，但不足以精确承保。公司历史融资公告在这里异常有用。2018 年 TPG 公告称，Sonatype 服务超过 10 million 名开发者和
              1,000 家企业，上半年销售额同比增长 81%，每笔交易 pipeline ACV 增长 117%。2016 年 Goldman Sachs 融资公告则使用更宽泛的采用语言，称超过 90,000 家组织使用
              Nexus 解决方案，上一年 Central Repository 处理超过 30 billion 次组件请求。到 2024 年，Reuters 报道称公司拥有超过 2,000 家企业客户、约 15
              million 名开发者、约 $150 million ARR，并已盈利。


              这些指标从结构上指向相当高的收入质量：经常性软件合同、工作流嵌入、生态覆盖，以及围绕构建速度和自动化的客户 ROI 证据。TrustRadius 和 PeerSpot 都显示，用户从 CI/CD
              集成和依赖缓存中看到强运营价值。但公开记录仍缺少最关键的承保指标：没有披露 NRR、总留存、CAC、回本周期或当前毛利率，第三方收入估计也从约 $94 million 到极宽的 $100 million 至
              $500 million 区间不等。正确读法不是 Sonatype 很弱，而是公司的公开牵引力显然为正，但确切单位经济仍为私有信息，因此建模风险高。
