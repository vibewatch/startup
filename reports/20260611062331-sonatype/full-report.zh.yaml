      - number: '3.3'
        title: 定价、包装与分销力量
        blocks:
          - type: paragraph
            body: >-
              包装是这个品类最重要的竞争武器之一。Sonatype 对 Nexus Repository Cloud
              的公开定价是用量型，买家按存储和出站流量付费，而不是纯按开发者席位付费。对制品量大的企业，这可能有吸引力；但也意味着 Sonatype 暴露的简单公开价目，比那些入门动作为按席位的竞争对手更少。Snyk
              按贡献开发者定价，并宣传免费、团队和企业路径。GitHub Advanced Security 公布 Secret Protection 和 Code Security 的活跃提交者定价。FOSSA
              公布按项目定价，JFrog 公布从相对低月费起步的平台层级，GitLab 则用计划捆绑把安全卷入更高平台层级。Checkmarx、Black Duck 和 Mend
              的大部分仍是报价驱动的企业销售动作。结果是混合的。买家已经围绕仓库和治理基础设施定义采购时，Sonatype 受益，因为用量和平台包装能映射到企业架构需求；但当标准化在 GitHub 或 GitLab
              上的团队可通过现有合同增加“足够好”的安全能力，或安全负责人想要最清楚的按开发者成本故事时，Sonatype 处于劣势。
