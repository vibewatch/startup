  - id: TP003
    title: 价格 / 包装比较
    columns:
      - 厂商
      - 价格 / 单位 / 合同模式
      - 公开信号
      - 包含能力
      - 未知项 / 折扣风险
      - 影响
    rows:
      - - Sonatype
        - Nexus Repository Cloud 按用量计费
        - 已公布存储 + 出站流量定义
        - 代码仓库云经济性
        - 完整平台 / 安全套件标价大多未披露
        - 对架构主导买家更强，不适合简单席位预算比较
      - - Snyk
        - 按贡献开发者计费，覆盖 free/team/ignite/enterprise 路径
        - 公开方案页面发布方案结构，但并非所有数字
        - 通过平台覆盖开源、代码、容器、IaC、API/web
        - 企业折扣和完整层级费率未完全公开
        - 适合开发者主导的落地动作
      - - JFrog
        - 平台层级约从 $150/mo Pro 和 $950/mo Enterprise X 起
        - 公开价格页面
        - 带安全和 DevSecOps 功能的制品管理
        - 大型企业定价和 Xray 范围可能显著扩张
        - 对已经购买代码仓库基础设施的团队是强切入口
      - - Black Duck
        - 报价主导的企业合同
        - 检索页面没有公开标价
        - SCA、合规、部署灵活性
        - 实际价格未知
        - 销售动作更重，但契合受监管买家
      - - Mend
        - 按贡献开发者计费；偏企业
        - 价格页面定义贡献者单位
        - Mend 产品：Mend AppSec、Mend AI、Mend Renovate Enterprise
        - 实际企业价格和折扣未知
        - 广套件有助于平台整合
      - - FOSSA
        - 按项目定价
        - Business 方案显示每个项目每月 $20，按年计费
        - 许可证 + 漏洞扫描和 SBOM 导入
        - 企业定价调价机制未知
        - 对法律 / 合规主导的切入点有吸引力
      - - GitHub Advanced Security
        - 按每月活跃提交者收费，代码安全和密钥保护为单独附加项
        - GHAS 页面公开 $19 和 $30 价格
        - 原生代码安全、SCA、密钥扫描
        - 捆绑折扣和企业合同条款未知
        - 对已标准化使用 GitHub 的团队，是强力捆绑替代品
      - - GitLab
        - 通过 Ultimate 做平台层捆绑
        - 定价和功能对比页面显示安全能力位于更高层级
        - 平台内置 CI/CD 和安全功能
        - 检索文本未覆盖精确席位定价
        - 更适合已标准化使用 GitLab 的组织
      - - Checkmarx
        - 定制捆绑报价
        - 定价页面引导询价
        - SCA 位于更广泛的 Checkmarx One 模块内
        - 实际模块定价未知
        - 可赢下 AST 整合交易，而不只是独立 SCA 评测
      - - Endor Labs / Socket
        - 按席位收费或联系销售；也有免费 / 开源路径
        - 定价页面强调席位、规模折扣，或创业公司 / 开源项目计划
        - 低噪声 SCA、恶意包检测、开发者优先工作流
        - 企业实际价格和捆绑条款未知
        - 适合作为更轻量或更早期采用场景的竞争切口
    notes: 本表概括的是公开定价表面，而不是谈判后的企业实际价格。若页面未披露完整标价，对应单元格明确标为未知或询价驱动。
