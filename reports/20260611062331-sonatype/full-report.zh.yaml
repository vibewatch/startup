      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家地图是跨职能的。日常用户是开发者、平台工程团队、DevOps 和 AppSec 从业者，因为工具位于包解析、CI/CD、拉取请求检查、仓库管理和修复工作流中。经济买家则往往是中央安全、平台工程领导层或企业
              IT，因为软件必须在整个组织范围内满足政策、风险、采购和审计要求，而不是只服务一个开发团队。在受监管环境中，合规、采购和法务会成为事实上的共同付款方，因为如果工具无法生成
              SBOM、证明和漏洞记录等审计就绪材料，他们可以阻断采用。因此，公共部门、金融服务、医疗和大型软件厂商反复出现在来源中，成为最自然的早期采用者。


              采用也在变得更集中。JFrog 2026 年 state-of-the-union 页面称，组织把应用安全工具数量几乎砍半，显示买家已厌倦碎片化点工具。同时，同一 JFrog 报告称，npm 按流量超过
              Maven，成为最常用企业生态；Hugging Face 模型增长也创造出一类传统治理未准备好管理的新制品。换句话说，制品类型和治理表面在扩张，但买家想要更少控制平面。这个张力有利于 Sonatype
              这样的供应商，因为它能销售一个嵌入工作流的平台，横跨仓库、SCA、SBOM 和策略执行；但执行门槛也随之提高，因为买家想要更深集成、更少告警噪音和可解释的策略结果。
