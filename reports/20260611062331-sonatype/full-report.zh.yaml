      - number: '8.3'
        title: 进入纪律、否决触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              实际承销结论是合理到偏紧，而不是明确有吸引力。Sonatype 的公开证据足以说明，2024-06-11
              之后这家公司很可能配得上超过独角兽水平的企业价值，今天也可能仍能大致支撑这一附近水平。但这些证据不足以让外部投资者在没有新尽调的情况下，确信可以穿透这一水平继续出价。缺失项都正好落在私募软件回报最容易摆动的位置：债务负担、优先权和滚存结构、留存持久性、ARR
              结构，以及受监管账户粘性与捆绑平台竞争之间的平衡。


              因此，进入纪律必须把企业价值和股权价值分开。若 Sonatype 背负有意义的净债务或交易优先权，新投资者可获得的股权价值可能显著低于标题企业价值锚点。若杠杆较轻且 ARR 质量保持完好，标题 EV
              锚点会更持久，下行也会收窄。这就是本章不能仅凭公开证据给出买入判断的原因。


              最重要的否决触发项都可观察：若 2024 年之后 ARR 增长明显放缓；有证据显示 GitHub、GitLab 或 JFrog 正在以仓库为核心的账户里替代
              Sonatype；或披露出高于预期的债务或优先权阴影，估值都会被推入悲观区间。相反，新的贷款人或赞助方流程、留存披露，以及干净的债务与现金桥，可能把立场从继续研究推向更坚定的承销观点。在那之前，正确做法是把
              Sonatype 视为可信但披露不完整的中区间私营软件资产。
