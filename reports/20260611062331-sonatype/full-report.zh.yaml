        title: 所有权阴影、监管重置与依赖渠道的公共部门敞口
        blocks:
          - type: paragraph
            body: >-
              治理风险与商业化风险交织在一起。Reuters 报道的出售消息表明，Vista 至少探索过 Sonatype
              的战略选择；这对成熟的赞助方持有软件资产很正常，但投资者仍要承销一个公开披露有限、且所有权结构可能变化的业务。与此同时，Sonatype 确实受益于政府和受监管市场相关性，但近期美国政策信号让这种相关性不像纯
              SBOM 叙事暗示的那样自动成立。CISA 和 NSA 仍把 SBOM 视为有用的供应链工具，而 OMB M-26-05 将机构推向更广的风险化验证，而不是规定式软件盘点流程。因此，Carahsoft 和 AWS
