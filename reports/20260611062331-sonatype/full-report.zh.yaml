    data:
      items:
        - date: '2008'
          label: 创立
          detail: Jason van Zyl 和 Brian Fox 围绕 Maven 生态需求创立 Sonatype
          tone: positive
        - date: '2016-02-04'
          label: Goldman 融资
          detail: $30M 股权和债务轮融资支持扩张
          tone: positive
        - date: '2018-09-07'
          label: TPG 投资
          detail: $80M 少数股权轮验证后期增长
          tone: positive
