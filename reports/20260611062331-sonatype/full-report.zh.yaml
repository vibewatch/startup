  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 外部压力：捆绑、JFrog 邻近竞争与 SCA / SBOM 商品化
        blocks:
          - type: paragraph
            body: >-
              Sonatype 面临的市场风险，比单一功能缺口更微妙。这个品类正同时受到三股力量挤压：GitHub 和 GitLab 越来越多地把安全卖进开发平台合同；JFrog
              可在一个以注册表为核心的销售动作里，把制品管理和软件供应链安全打包；Snyk 或 FOSSA 等轻量厂商让基础 SCA 或 SBOM
              工作流无需更大的平台决策也能采购。公开定价页说明了为什么这件事重要。GitHub 现在直接按活跃提交者销售安全附加项，GitLab 将高级安全放进 Ultimate，JFrog 营销单一供应链平台，FOSSA
              已在低摩擦套餐中包含导入 SBOM 和合规报告。这些都不能证明 Sonatype 缺少差异化，但意味着差异化必须站在商品化扫描和报告之上。Sonatype
              需要证明，仓库控制、更低噪声的情报和受监管环境适配，能带来优于捆绑或更便宜替代方案的胜率和续约持久性。
