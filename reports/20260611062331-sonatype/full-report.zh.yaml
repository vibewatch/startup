      - number: '1.2'
        title: 领导层交接、治理背景与运营足迹
        blocks:
          - type: paragraph
            body: >-
              领导层是概况章节中最大的当前变化。2025 年 7 月，Sonatype 任命 Bhagwat Swaroop 为首席执行官；领导公司约 15 年的 Wayne Jackson
              转任执行董事长。这次交接更像计划内换挡，而不是危机处置：公告把 Swaroop 描述为具备 Entrust、One Identity、Proofpoint、NetApp、Symantec、Intel 和
              McKinsey 经历的规模化运营者；Jackson 的表态则强调围绕开源和 AI 治理的连续性。ON Partners 与 Intelligence Community News
              的独立转载证实了同一领导层变动；ON Partners 还补充了有用的当前运营足迹，称 Sonatype 总部位于马里兰州 Fulton，并在英国、澳大利亚、哥伦比亚和印度设有办公室。


              更深层的治理图景仍不够透明。已审阅公开材料在高管叙事上信息丰富，但董事会构成、投资人控制权，或 2019 年 Vista
              收购后的最新股权结构拆分披露相对稀薄。即使用全文抓取的公司页面，也更多服务于产品导航，而不是正式公司治理披露。因此，本章可以高置信度确认 CEO 交接真实、当前且非紧急；但不能高置信度判断 Vista
              掌握多少权力、哪些董事仍活跃，或创始人 Jason van Zyl 是否仍日常参与经营。Sonatype 已是后期私有公司，并可能处在待售窗口，这个缺口对尽调有实质意义。
