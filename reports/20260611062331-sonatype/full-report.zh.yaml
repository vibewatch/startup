      - number: '7.4'
        title: 商业不透明、续约不确定性与投资者否决条件
        blocks:
          - type: paragraph
            body: >-
              最后一类风险与其说是公开红旗，不如说是持续存在的承销缺口。公开来源足以看见采用、平台广度和受监管市场适配，但不足以有把握判断续约强度。已审阅材料不披露
              NRR、GRR、头部客户占比、公共部门收入敞口或模块级附加率。评论页面还显示价格敏感、免费层认知分化，以及至少一条明确的 JFrog 替代轶事。由于本轮 G2 和 Gartner
              页面被拦，独立评论覆盖不完整，限制了投诉三角验证。因此投资者结论很清楚。Sonatype 仍可能是一个持久的企业软件资产，但举证责任现在落在三项尽调问题上：证明直接续约持久性；证明捆绑对手没有在以
