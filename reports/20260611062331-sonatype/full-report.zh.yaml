      - 主要用例
      - 规模 / 公开证明
      - 收入 / 战略价值
      - 缺口
    rows:
      - - 企业平台工程
        - 买方：平台工程或 DevOps 负责人；用户：开发者和构建工程师；付款方：中央工程 或 CIO 预算
        - 制品控制、依赖代理、CI/CD 交接、安全内部分发
        - Nexus 和 Lifecycle 被描述为 ABN AMRO、BNP Paribas、USPTO 以及大型第三方评测部署中的核心基础设施
        - 战略价值高，因为制品库位置可以成为许多团队和下游产品的控制点
        - 公开来源没有披露 ACV、席位数，或按队列划分的附加购买
      - - 联邦 / 政府
        - 买方：机构工程、AppSec 或现代化负责人；用户：开发者和安全团队；付款方： 机构采购 / 项目预算
        - 安全软件开发、SBOM 合规、开源治理、隔离网络或敏感环境交付
        - 具名证明包括 USPTO 和一家 DOE 实验室；政府解决方案和 Carahsoft 页面补充了采购 上下文
        - 战略价值高，因为联邦合规和采购路径可以提高耐久性和切换成本
        - 没有公开披露联邦 ARR、合同价值或续约条款
      - - 金融服务
        - 买方：AppSec、DevSecOps 或工程领导；用户：开发者、风险和合规团队；付款方：CIO / CISO / 转型预算
        - 策略门禁、恶意包拦截、自动漏洞审查、更快的合规发布
        - 具名证明包括 ABN AMRO、Nomura、BNP Paribas、Krungsri、BNY Mellon | Pershing， 以及一家未具名的 Fortune 200 金融机构
        - 可能是核心战略分层，因为多个具名案例位于受监管银行和经纪交易商环境
        - 没有公开的垂直收入组合或按银行分层划分的客户占比
      - - 医疗健康
        - 买方：安全和应用平台负责人；用户：开发团队和合规人员；付款方：IT / 数字健康预算
        - 围绕敏感数据提供持续漏洞可见性、合规支持和安全软件交付
        - Discovery Health 是具名部署；医疗健康解决方案页面强化了患者数据和合规叙事
        - 战略价值中高，因为医疗安全事故会带来明确的运营和监管成本
        - 没有公开的医疗客户数、定价或续约数据
      - - 制造 / 工业
        - 买方：安全或工程领导；用户：开发者和产品团队；付款方：企业 IT 或产品 工程预算
        - 自动化治理、生产前关键发现移除、SBOM / 合规准备、安全工业软件交付
        - Endress+Hauser 和 Mühlbauer 提供了具名制造业证明，涉及安全流水线和 政府采购相关性
        - 重要战略分层，因为正常运行时间、合规和嵌入式软件风险支持耐久工作流
        - 没有公开的制造业 ARR 或平台客户占比
      - - 技术 / 软件供应商
        - 买方：工程、AppSec 或法务 / 合规领导；用户：开发者、架构师和发布 经理；付款方：软件 R&D 预算
        - 许可证 / 合规自动化、CI/CD 安全、制品管理和安全产品发布
        - 具名证明包括 Software AG 和 Trilliant；解决方案页面面向开发者和启用 AI 的软件团队
        - 战略价值高，因为 Sonatype 产品可以成为供应商自身软件工厂的一部分
        - 公开材料没有量化该分层从制品库向 AI 或 SBOM 模块扩张的情况
    notes: 各行把公开客户证明和解决方案叙事映射到买方 / 用户 / 付款方模式；规模和战略价值 基于公开证据，而非已披露收入分层。
