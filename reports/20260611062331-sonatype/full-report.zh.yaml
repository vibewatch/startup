  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点与可比区间
        blocks:
          - type: paragraph
            body: >-
              最干净的 Sonatype 公开估值锚点，不是新融资轮或已披露的赞助方账面标记，而是 Reuters 2024 年 7 月报道的出售流程。三篇可访问的 Reuters 转载报道称，Vista
              探索过出售或少数股权交易，可能让 Sonatype 估值超过 $1.5 billion（含债务），当时公司约有 $150 million ARR 且已盈利。这很重要，因为它在 2024-06-11 之后给
              Sonatype 放下了一个可信公开标记，并隐含约 10x EV/ARR。仅凭该证据，Sonatype 在 2024-06-11 之后显然支撑独角兽地位。


              同一证据也划出可主张内容的硬边界。Reuters 明确说了包含债务，因此报道数字是企业价值，而不是干净的股权价值数据点。公开来源不披露 Sonatype
              当前净债务、优先股堆叠、滚存股权或赞助方与管理层经济安排。这意味着公开记录支持一个估值锚点，但不支持股权支票金额。


              当前公开可比公司让图景更宽。GitLab 筛选结果约在 EV/revenue 中 3x 区间，Elastic 和 Progress 处在低到中个位数，Atlassian 也接近高 3x；JFrog 和
              DigitalOcean 则享有十几倍中段的溢价倍数。因此，Sonatype 隐含的 2024 年 10x EV/ARR
              锚点落在当前区间中部：显著高于增长更慢、业务更宽的软件公司，但仍低于最溢价的开发者基础设施估值。正确解读是，Sonatype 的公开估值支撑真实存在，但它是一项三角测算，而非单点标记。
