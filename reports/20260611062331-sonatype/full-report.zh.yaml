  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释因素 / 重要性
      - 尽调要求
    rows:
      - - 仓库控制提高切换成本
        - GitHub / GitLab 买家可能不想再要一个以仓库为中心的独立控制平面
        - 高
        - 只有当制品治理是战略事项而非附带需求时，Sonatype 护城河最强
        - 按 SCM 标准和仓库既有供应商索取赢单 / 输单数据
      - - 平台广度降低工具蔓延
        - 用户体验更好的点工具仍可能赢下团队级采用
        - 中
        - 广度能打动 CIO / CISO 买家，但可能拖慢部门级采用
        - 索取从落地到扩张的数据和席位激活曲线
      - - 企业部署灵活性支撑受监管客户
        - 云原生团队可能更偏好更轻的 SaaS 优先产品
        - 中
        - 混合和隔离网支持很有价值，但也缩窄了天然买家群
        - 按云原生账户和混合账户拆分管线
      - - 开源情报和恶意软件姿态让 Sonatype 差异化
        - Socket、Endor、Checkmarx 等厂商营销更强的低噪声或恶意包叙事
        - 中高
        - 如果买家认为传统 SCA 噪声高，信号质量就很关键
        - 对照 Snyk、Endor、Checkmarx、Socket 跑可利用性 / 噪声指标基准
      - - SBOM 和合规表面有助于受监管采购
        - 如果法律 / 合规掌握预算，FOSSA 和 Black Duck 可以赢单
        - 中
        - 合规主导交易可能把法律工作流置于仓库控制之上
        - 索取联邦、医疗和高度受监管行业的赢率证明
      - - 定价不透明保护企业打包灵活性
        - 透明定价的对手让预算沟通更容易
        - 高
        - 捆绑或标价定价可能在中端市场或 GitHub 原生交易中压缩 Sonatype
        - 索取实际 ASP、折扣阶梯和价格输单原因
      - - JFrog 是最接近的战略类比对象
        - Artifactory 加 Xray 可以抵消 Sonatype 的仓库优势
        - 高
        - 对制品密集型团队，这是最危险的单一供应商替代方案
        - 索取相对 JFrog 的具名替换数据
      - - 捆绑式平台安全正在扩张
        - GitHub 和 GitLab 可以靠合同邻近性赢单，而不是靠产品更优
        - 高
        - 分发力可能压过最佳单点产品深度
        - 按 SCM 平台索取附加率和竞争重叠数据
      - - 更广泛的 AST 平台可以重构交易叙事
        - Mend 和 Checkmarx 可能靠整合授权赢单
        - 中
        - 如果买家看重完整 AST 平台合理化，Sonatype 可能被压缩成一个模块
        - 索取 Sonatype 在更广泛 AST RFP 中被评估的频率
      - - 新兴专精厂商挤压功能叙事
        - 即使 Endor 和 Socket 没有直接替换 Sonatype，也能影响路线图
        - 中
        - 新进入者会重设市场对可达性、AI 和恶意包行为的预期
        - 对照这些专精厂商跟踪路线图缺口和客户要求
    notes: 严重性是基于已检索公开证据的分析判断。本登记表旨在揭示可能侵蚀 Sonatype 差异化的因素，而不是暗示这些威胁已经造成输单。
