      - number: '2.2'
        title: 规模测算视角与监管底线
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估计差异很大，因为发布方对品类的定义不同。Mordor 将广义软件供应链安全平台市场定义为 2025 年已达 $5.53 billion，2030 年可能达到 $10.10 billion，其中
              SCA 占 2024 年份额的 40.7%。6Wresearch 给出的 2026 年品类规模小得多，为 $1.19 billion；Verified Market Reports 则把 2026 年市场放在
              $2.16 billion。这个区间不只是噪音，而是真实的分类问题：有的发布方纳入仓库控制、完整性验证、来源证明和更广 DevSecOps 治理；有的则隔离出更窄的风险预警或篡改检测工具集。SBOM
              管理子板块本身也相当可观且增长很快，Statifacts 将其 2026 年规模放在 $2.034 billion，Technavio 则描述为 2025 年 $1.41 billion、CAGR 22.1%
              的市场。


              监管解释了为什么宽平台和窄合规工具叙事可以同时成立。NIST SP 800-218 定义美国联邦采购的安全软件开发基线；CISA 证明表把该基线落到操作层，并指出机构可按要求索取当前 SBOM；欧盟 Cyber
              Resilience Act 对带数字元素的产品施加全生命周期网络安全义务。欧盟页面称，报告义务从 2026 年 9 月开始，CRA 主要义务自 2027 年 12 月适用。Sonatype 2026
              年监管评论对同一模式的解读有用：2026 年是从指引走向执行的转折点。这意味着品类需求不再只由威胁驱动，也越来越由合规驱动。
