        title: 架构、部署与集成深度
        blocks:
          - type: paragraph
            body: >-
              Sonatype 公开记录中最有说服力的技术故事，是架构适配既有企业工作流。Repository 明确构建为位于制品路径中，而不是替代源码控制；Sonatype
              文档覆盖广泛包支持、仓库安全控制和多种生产部署模式，包括 Docker、Kubernetes、OpenShift、外部数据库和高可用方案。部署模型也是受监管买家的真实强项，因为 Sonatype 明确支持
              SaaS、自托管和断连的 SAGE 式环境。集成深度足以产生商业意义。GitHub Actions 展示了在 GitHub 原生流程中做策略评估和 SBOM 获取的官方路径；Azure DevOps 有
              marketplace 扩展，支持构建失败或警告行为并嵌入报告；Sonatype 的 GitLab 材料描述了合并请求自动化和流水线集成。客户评价证据也独立强化了这一点：Repository 常被嵌入 CI/CD
              流水线和私有包流程。弱点在文档一致性：Firewall 和 Jenkins 显然属于更广工作流故事的一部分，但当前公开文档抓取不如 Repository、Lifecycle 或 Guide
              清晰，这对产品面一致性带来轻度尽调担忧。
