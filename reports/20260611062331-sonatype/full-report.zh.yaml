      - number: '2.4'
        title: 增长驱动、约束与未解的规模问题
        blocks:
          - type: paragraph
            body: >-
              最持久的市场驱动来自依赖蔓延、反复发生的供应链攻击、AI 辅助开发和监管。Sonatype 称，2025 年年度开源下载量超过 9.8 trillion，恶意软件增长 75%；其 2026 年 Q1
              恶意软件指数报告单季发现 21,764 个恶意包，自 2017 年以来累计 1.346 million 个。AppSecSanta 的 2026 年统计页面另称，2025 年供应链攻击成本为 $60
              billion，并可能在 2031 年达到 $138
              billion。这些数字是方向性支撑，而不是标准口径；但它们共同强化同一结论：组织购买此类工具，不是因为品类时髦，而是因为不受治理的软件消费如今看起来像董事会层面的运营风险。


              主要约束同样清晰。Mordor 提到的品类制约包括缺少普遍接受的 SBOM 格式、AppSec / DevSecOps 人才短缺、工具蔓延，以及云原生扫描器带来的 IP 泄露感知风险。JFrog
              补充了另一个问题：大多数关键告警都是噪音，在一项对 248 个高知名度 CVE 的复盘中，只有 11.9% 被判断为真正可利用。Black Duck
              强调本地、托管和气隙选项，以及深度知识库上下文，本质上也承认同一个买家顾虑：很多企业想要嵌入工作流的供应链工具，但不想为此增加新的数据暴露或告警疲劳。Sonatype
              的未解分析问题因此不是市场是否存在，而是一个把仓库控制、SCA、SBOM 和 AI / OSS 治理混合在一起、面向大型受监管账户的平台，究竟能服务广义市场中的多大部分，而不是追逐每一种更轻量的开发者工具用例。
