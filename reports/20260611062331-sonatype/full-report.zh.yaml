  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 展示业务质量、公开估值支撑和未解决资本结构风险如何共同指向继续研究建议。
    data:
      nodes:
        - id: n1
          label: 制品库牵引的产品宽度
          description: 制品库、SCA、SBOM、政府和 AI 治理界面支撑类似基础设施的粘性。
        - id: n2
          label: 受监管客户证据
          description: 客户和政府证据支持合规敏感账户中的需求。
        - id: n3
          label: 2024 年盈利 ARR 锚点
          description: Reuters 报道的交易进程标记显示，Sonatype 在约 $150M ARR 且盈利的基础上，EV 超过 $1.5B。
        - id: n4
          label: 当前公开可比公司区间
          description: 公开软件可比公司的 EV/revenue 从低个位数到十几倍的高溢价开发者倍数不等。
        - id: n5
          label: 披露与压缩风险
          description: 债务不明、留存不透明，以及 AI 或捆绑压力阻断买入结论。
        - id: n6
          label: 继续研究 / 合理至偏高
          description: 估值有支撑，但没有新尽调时，吸引力并不明确。
    approximationNotes: 这是分析性决策路径，不是公司披露的流程图。
    claimRefs:
      - CV003
      - CV008
      - CV017
      - CV043
      - CV047
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 展示哪些尽调结果最能推动 Sonatype 企业价值相对基准情景中点发生变化。
    data:
      items:
        - label: 净债务 / 优先权负担差于预期
          value: -250
          unit: US$M EV vs. base midpoint
          detail: 单项波动最大，因为 Reuters 报道的是包含债务的 EV，而不是股权价值。
        - label: 留存或 ARR 增长弱于假设
          value: -200
          unit: US$M EV vs. base midpoint
          detail: 会把 Sonatype 拉向成熟软件公司的底部倍数。
        - label: 捆绑竞争 / AI 压缩加剧
          value: -150
          unit: US$M EV vs. base midpoint
          detail: 公开可比公司显示，在颠覆压力下，高溢价倍数并不稳定。
        - label: 新证据证明两位数盈利增长
          value: 200
          unit: US$M EV vs. base midpoint
          detail: 可支持估值更接近高溢价的制品库和开发者基础设施可比公司。
        - label: 清晰的现金流和毛利率桥接
          value: 150
          unit: US$M EV vs. base midpoint
          detail: 会收窄不透明折价，并支撑更扎实的承销判断。
    approximationNotes: 敏感性数值是围绕基准情景中点的方向性分析增量，不是基于管理层指引跑出的模型结果。
    claimRefs:
      - CV041
      - CV043
      - CV045
      - CV046
      - CV047
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 以企业价值区间呈现悲观、基准和乐观承销情景。
    data:
      items:
        - label: 悲观情景
          low: 800
          mid: 950
          high: 1100
          unit: USD millions EV
          detail: 假设 ARR 质量较弱、杠杆更重，或可比公司倍数压缩。
          source: Public comps + adverse signals
          tone: negative
        - label: 基准情景
          low: 1100
          mid: 1350
          high: 1600
          unit: USD millions EV
          detail: 锚定在接近 2024 年交易进程标记的位置，同时计入不透明折价。
          source: Reuters anchor + comp band
          tone: neutral
        - label: 乐观情景
          low: 1600
          mid: 1800
          high: 2000
          unit: USD millions EV
          detail: 需要证明盈利增长可持续，且净债务有限。
          source: Premium repository / developer-infra comps
          tone: positive
    approximationNotes: 所有区间都是企业价值区间。在债务和优先权条款披露前，公开证据不足以支撑股权价值或回报区间数字。
    claimRefs:
      - CV040
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 六个投委会风格指标概括 Sonatype 得分较高的地方，以及公开证据质量最薄弱的环节。
    data:
      items:
        - label: 市场 / 品类相关性
          value: High
          detail: 监管、制品库治理和软件供应链安全仍是真实预算项。
        - label: 产品 / 护城河质量
          value: Medium-high
          detail: 制品库控制叠加治理宽度有价值，但捆绑风险真实存在。
        - label: 客户证据
          value: Medium-high
          detail: 金融和政府领域的公开客户案例支持其企业级深度。
        - label: 经济性质量
          value: Medium
          detail: 2024 年盈利有帮助，但当前毛利率和留存数据缺失。
        - label: 证据质量
          value: Medium-low
          detail: Sonatype 主要估值锚点仍是 2024 年 7 月的交易进程报道，不是新的经审计披露。
        - label: 估值吸引力
          value: Fair to stretched
          detail: 围绕 2024 年锚点可以支撑，但仅靠公开数据还谈不上明确有吸引力。
    approximationNotes: 这些 KPI 是基于章节证据得出的分析判断，不是公司披露的运营指标。
    claimRefs:
      - CV017
      - CV021
      - CV043
      - CV047
      - CV049
