  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与工作流定位
        blocks:
          - type: paragraph
            body: >-
              Sonatype 销售的是连通的软件供应链控制平面，而不是狭窄点扫描器。最深的公开证据仍围绕 Nexus Repository 和 Lifecycle：Repository
              掌握二进制、包和代理控制；Lifecycle 增加策略、开源情报和修复上下文。SBOM Manager 和 Guide 把套件延伸到两个战略上合理的方向。SBOM Manager
              把同一组件清单变成面向合规团队的审计就绪证据、监控和 VEX 工作流。Guide 则把实时依赖情报喂给编码助手，而不是等到提交后告警，从而把公司推向 AI 原生软件治理。Maven Central
              和更广数据服务层也重要，因为它们解释了为什么 Sonatype 一直把自己说成一家情报公司，而不只是工具供应商。公开产品故事是连贯的：仓库控制、依赖策略、恶意包预防、合规证据和 AI
              依赖指导要彼此强化。主要不确定性不在于套件想成为什么，而在于当前客户价值有多少仍来自成熟的 Repository 加 Lifecycle 基础，又有多少来自较新的 Guide、Firewall 和 SBOM
              邻接模块。
