              和公共部门合同工具延伸采购。它不等同于已证实的净留存，但可作为合理的粘性代理指标，因为客户反复把 Nexus 或 Lifecycle 描述为交接点、质量闸门或常开监控层。公共部门采购证据也重要。Carahsoft
              将 Sonatype 面向政府买家定位，并列出有效合同工具；AWS Marketplace 则为 Nexus Repository 提供云采购路径。即便 Sonatype 不披露分部门 ARR
