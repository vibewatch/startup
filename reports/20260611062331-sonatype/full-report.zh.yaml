        - 开发者 UX 强，围绕 SCA、SAST、容器、IaC、API/web 提供广 AppSec 套件
        - 席位定价在规模化后可能变贵，也不掌握代码仓库的记录系统
      - - JFrog
        - 直接
        - 上市软件供应链平台，公布入门价格，并有广泛企业客户证明
        - 制品密集型 DevOps 和平台团队
        - Artifactory 加 Xray，把安全绑定到二进制管理和 CI/CD
        - 最适合已经标准化使用 JFrog 的客户
      - - Black Duck
        - 直接 / 既有厂商
        - 客户页面显示 4,000+ 家组织，并在 Fortune 100 中渗透较强
        - 合规要求重的企业和隔离网络环境
        - 许可证 / 合规能力深，部署选项广，知识库大
        - 更偏合规，对开发者优先买家可能显得更重
      - - Mend
        - 直接
        - 企业 AppSec 厂商，客户 logo 广，并有 Renovate 覆盖
        - 想要 SCA 加 SAST 和自动化的安全主导企业
        - 以可达性驱动的 SCA 和更广 AppSec 中的依赖自动化
        - 商业动作仍偏企业级，价格透明度较低
      - - GitHub Advanced Security
        - 相邻 / 捆绑
        - Microsoft 旗下开发者平台，按活跃提交者加购定价
        - 标准化使用 GitHub 的团队
        - 原生工作流集成，增量采购摩擦低
        - 买家需要代码仓库中立或本地制品治理时，差异化较弱
      - - GitLab Ultimate
        - 相邻 / 捆绑
        - 企业层级平台方案捆绑安全 / 合规
        - 标准化使用 GitLab 的 DevSecOps 团队
        - 安全能力内嵌在一个 DevOps 控制平面里
        - 离开 GitLab 中心型组织后，价值会走弱
      - - Checkmarx
        - 相邻直接
        - 价格页面显示 1,800+ 家企业
        - 正在整合 AST 工具的 AppSec 买家
        - SCA 放在更广的 Checkmarx One 组合中销售，并带恶意包和可达性主张
        - 购买动机可能主要是更大 AST 套件的一部分，而不是最佳单项代码仓库治理
      - - FOSSA
        - 相邻直接
        - 按项目定价，在法务 / 合规主导组织中有强案例研究
        - 法务、合规和 OSS 治理团队
        - 许可证合规工作流深，报告达到审计级
        - 安全深度和代码仓库控制窄于 Sonatype 或 JFrog
      - - Endor Labs
        - 新兴直接
        - 席位定价，具名客户包括 Atlassian 和 Rubrik
        - 寻求降噪的云原生工程和安全团队
        - 基于可达性的 SCA 和低噪音优先级排序
        - 较早期厂商，没有代码仓库既有地位
      - - Socket
        - 新兴替代
        - 2021 年成立；有投资方支持，对开源使用免费
        - 关注恶意包风险的开发者
        - 基于行为的包检测，采用较轻
        - 平台广度窄于 Sonatype，企业合规范围更有限
      - - 内部自建 + OSS 工具
        - 现状替代
        - 使用现有 SCM、CI/CD、Dependabot 类告警和人工策略
        - 较小或成本敏感团队
        - 前期支出最低，灵活性最高
        - 集成负担高，长期审计就绪治理较弱
    notes: 类别是分析标签，不是厂商自我描述。规模或融资信号来自官方公司页面、价格页面、客户页面或官方融资公告（如可获得）；这些只能当作表层指标，不能视为完全标准化的收入比较。
