            body: >-
              Repository 或 Lifecycle 直接嵌入受监管 CI/CD 工作流时，Sonatype 的客户证据最强。USPTO、Pershing、ABN AMRO、Discovery
              Health、Software AG 和多家银行提供了强于企业基础设施厂商平均水平的公开记录，因为它们说明了 Sonatype 如何在生产规模上影响部署节奏、安全闸门或合规。
            calloutType: strength
            claimRefs:
              - CU012
              - CU017
              - CU018
              - CU022
              - CU023
              - CU026
          - type: callout
            title: 持久性靠推断，而非披露
            body: 工作流中心性和受监管采购带来合理粘性，但在本轮审阅材料中，Sonatype 仍未披露 NRR、GRR、流失率、合同期限或客户集中度数据。因此，强客户标识 / 案例证据与已证实的客户持久性之间，仍有实质尽调缺口。
            calloutType: risk
            claimRefs:
              - CU037
              - CU038
              - CU039
              - CU042
          - type: callout
            title: 公开证据更支持核心产品，而非较新的平台叙事
            body: >-
              公开客户记录对成熟的 Repository 和 Lifecycle 工作流验证清晰得多，对 Guide、SBOM Manager
              或其他较新扩张模块的付费采用验证要弱得多。这不代表新叙事错误，但意味着投资者在承销平台驱动扩张假设前，应索取附加率和续约数据。
