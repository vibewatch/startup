chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创始人与产品主轴
        blocks:
          - type: paragraph
            body: >-
              对一家网络安全基础设施公司来说，Sonatype 的核心身份异常持久。公司 2008 年由 Jason van Zyl 和 Brian Fox 创立，两人都与 Apache Maven 和早期 Java
              依赖生态关系紧密。这个起点很关键：Sonatype 的商业切入点不是外挂式安全点工具，而是开发者早已依赖的二进制和包管理工作流层。已审阅的官方材料继续把公司定位为 Maven Central 维护者和 Nexus
              Repository 创建者；当前产品导航也把仓库管理、软件组成分析、恶意软件预防、SBOM 管理和 AI /
              开源治理视为一个连通平台，而不是彼此割裂的模块。这给后续尽调章节提供了清晰的标准描述：Sonatype 销售软件供应链管理与安全产品，位置卡在企业软件交付的制品、依赖和策略路径上。


              公司当前公开定位也显示，它在把旧有仓库管理特许权改造到新的 AI 和软件供应链风险上。首页、2026 年恶意软件研究、包注册表倡议和产品页都强调 AI 驱动的
              DevSecOps、自动化治理和实时情报，而不只是传统制品存储。落到产品上，命名产品集已覆盖 Nexus Repository、Lifecycle、Firewall、Guide、SBOM Manager 和
              Maven Central 管理。官方和独立来源传递的信息一致：Sonatype 想成为开发者和 AI 编码系统可消费内容的控制平面，而不只是事后报告问题的扫描器。从 Maven 时代依赖管理延续到当下 OSS
              与 AI 治理，是本记录中最强的概况事实之一。
