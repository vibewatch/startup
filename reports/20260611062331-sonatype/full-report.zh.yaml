      - number: '3.2'
        title: 产品范围、部署与功能定位
        blocks:
          - type: paragraph
            body: >-
              Sonatype 的持久差异化从仓库基因开始。其公开平台面把 Nexus Repository、Lifecycle、Firewall、Guide 和 SBOM Manager
              组合在一起，覆盖二进制控制、开源策略、恶意软件拦截、AI / 开源情报和合规报告。JFrog 最接近，因为 Artifactory 加 Xray
              同样把系统记录控制与安全扫描耦合。Snyk、Mend、Checkmarx、Endor 和 Socket
              则以检测、优先级排序和修复工作流起步；它们更容易采用，因为不要求仓库成为控制锚点，但也会制造更多多供应商架构。Black Duck 和 Checkmarx
              强调更深检测、可达性、恶意包分析，或本地与气隙部署，反映出它们在更受监管或安全成熟账户中的吸引力。GitHub 和 GitLab
              竞争的是开发者工作流集成，而不是独立供应链专业化：它们把安全嵌入代码已经所在的位置。含义是，Sonatype
              最好的竞争姿态不是在每一个点功能上赢营销战，而是赢下那些足够重视仓库控制、策略集中和部署灵活性，愿意承受更宽平台决策的账户。
