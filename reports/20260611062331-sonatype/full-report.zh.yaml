  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 质量
      - 尽调要求
    rows:
      - - Nexus Repository Cloud
        - 带使用量计费的软件经常性订阅
        - 月基础费加存储和出口流量消耗
        - 官方披露起步价；定价从每月 $135 + 用量开始
        - 如果客户制品量可预测扩张，质量较高；仍是软件式经常性收入
        - 获取云订阅基础费和可变消耗的 ARR 拆分
      - - Nexus Repository Pro / 自托管部署
        - 面向自托管、本地和隔离网安装的企业订阅或许可证
        - 合同制软件订阅 / 许可证
        - 付费 Pro 版本存在；企业实际定价未公开披露
        - 中高；部署粘性强，但续约条款和折扣为私有信息
        - 按部署类型索取实际 ASP，并按队列索取总留存
      - - Community Edition 漏斗
        - 免费产品用于播种采用，之后向企业层级增购
        - 免费 / 无直接许可收入
        - Community Edition 公开可用
        - 直接变现低，但对漏斗顶部有战略意义
        - 披露免费转付费转化率，以及向 Platform SKU 的附加率
      - - Lifecycle / SCA 情报
        - 在仓库足迹之上的询价式安全和策略增购
        - 第三方定价页面出现按用户或企业合同的基准；官方实际定价未披露
        - 官方作为带持续情报运营的产品销售
        - 如果附加率可持续，可能是高毛利软件收入
        - 提供 Lifecycle 的独立 ARR 和附加 ARR
      - - SBOM Manager / 合规工作流
        - 作为额外工作流销售的审计就绪合规和 SBOM 管理
        - 企业平台合同 / 询价驱动
        - 官方定位为合规产品；无公开实际定价
        - 监管可能让使用变成非可选项，因此质量可能较强
        - 提供 SBOM / 合规 SKU 的收入贡献
      - - Repository Firewall 和 AWS 采购渠道
        - 威胁预防附加项，加上通过 AWS Marketplace 私有报价扩展采购路径
        - 平台附加项和企业私有报价
        - 截至 2024 年 12 月，官方已在 AWS 上架
        - 支撑增购和采购效率，而非纯粹的标价透明度
        - 披露来自 AWS 的管线和多产品私有报价组合
      - - 支持 / 迁移 / 企业服务
        - 围绕高粘性仓库基础设施提供部署协助、迁移和企业支持
        - 支持合同或专业服务附加
        - 公开材料提到迁移和企业支持，但未披露收入占比
        - 如果服务占比较高，质量低于软件订阅收入
        - 拆分经常性软件 ARR 与服务、支持收入
    notes: 只有部分云仓库产品可见标价；大多数企业实际定价、捆绑和折扣仍未公开。
