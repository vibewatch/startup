  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: 五个紧凑的竞争指标，解释 Sonatype 哪里有结构性强项，以及分发风险哪里最高。
    data:
      items:
        - label: 控制平面广度
          value: High
          detail: 明确覆盖仓库、SCA、恶意软件、SBOM 和 AI / 开源治理，强化平台叙事。
