      - number: '1.3'
        title: 资本历史、规模标记与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              Sonatype 的资本形成故事足以判断方向，尽管并非每一轮历史细节都同样干净。官方来源确认，公司 2016 年 2 月完成 Goldman Sachs 领投的 $30 million 融资，2018 年 9
              月完成 TPG 领投的 $80 million 少数股权投资，两次都围绕加速产品开发、销售、营销和国际扩张展开。这些公告还给出有用的历史规模检查点：2016 年初，Sonatype 称超过 90,000
              家组织使用其 Nexus 解决方案；2018 年投资公告称 Nexus 平台被全球超过 10 million 名软件开发者和 1,000 家企业使用。Vista Equity Partners 随后在 2019
              年 11 月收购 Sonatype，公司从风投支持的成长公司变成私募股权持有的软件资产，退出可选项也更明确。


              截至目前，最重要的估值标记来自外部而非官方。Reuters 2024 年 7 月 12 日报道，并由 MarketScreener 和 Economic Times 镜像，称 Vista
              正在探索包括出售或少数股权交易在内的选项，可能使 Sonatype 含债务估值超过 $1.5 billion。同一报道还称 Sonatype 已聘请 Goldman Sachs，年经常性收入约 $150
              million，并已盈利。这些不是经审计披露，因此报告中应作为第三方报道且对时效敏感的说法处理，而不是管理层事实。但结合公司当前关于近 2,000 家组织、15 million 名开发者、金融服务渗透强，以及
              2026 年仍有产品和领导层公告的说法，它们锚定了一个可信的后期图景：Sonatype 看起来是一家具规模、已盈利的软件基础设施公司，拥有多条退出路径，但公开财务透明度仍有限。
