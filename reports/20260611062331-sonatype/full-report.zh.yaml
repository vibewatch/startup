companyProfile:
  summary: >-
    Sonatype 是一家后期私有、Vista 持有的软件供应链安全公司，2008 年由 Jason van Zyl 和 Brian Fox 创立，目前总部位于马里兰州 Fulton。公司从 Maven 生态根基出发，扩展为覆盖
    Nexus Repository、Lifecycle、Firewall、Guide、SBOM Manager 和 Maven Central 管理的更广控制平面，部署形态横跨 SaaS、自托管和气隙环境。公开材料与 Reuters
    2024 年 7 月报道共同描绘出一家已具规模并盈利的企业软件资产：服务近 2,000 家组织、触达 15 million 名开发者，在受监管账户中渗透可观；但资本结构、留存和当前经营指标仍有实质不透明。
