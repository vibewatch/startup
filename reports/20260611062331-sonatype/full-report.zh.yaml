        - 最接近公司的外部估值标记。
        - 历史流程标记，不是当前股权价值或已签约交易。
      - - GitLab 当前公开市场
        - 收入约 $1.0B；EV 约 $3.6B-$4.0B
        - EV / 收入约 3.5x-3.8x
        - 公开 DevSecOps 平台可比公司，与安全和工作流相邻。
        - 面临执行和留存压力；并非以仓库为中心。
      - - JFrog 当前公开市场
        - 收入约 $563M-$576M；EV 约 $9.0B
        - EV / 收入约 15.8x-16.0x
        - 最接近的公开仓库和软件供应链可比公司。
        - 在 AI 扰动标题下，溢价倍数已出现剧烈波动。
      - - Elastic 当前公开市场
        - 收入约 $2.0B；EV 约 $6.0B
        - EV / 收入约 3.2x
        - 盈利型基础设施 / 安全相邻底部参照。
        - 搜索和可观测性业务组合比 Sonatype 更宽。
      - - DigitalOcean 当前公开市场
        - 收入约 $1.0B；EV 约 $18.0B
        - EV / 收入约 18.0x
        - 盈利型开发者基础设施溢价样本。
        - 云基础设施模式与软件供应链并不直接匹配。
      - - Atlassian 当前公开市场
        - 收入约 $6.0B；EV 约 $24.0B
        - EV / 收入约 3.8x
        - 大型开发者平台基准，用来衡量工作流价值。
        - 规模大得多，且协作产品占比不同。
      - - Progress 当前公开市场
        - 收入约 $986M；EV 约 $3.0B
        - EV / 收入约 2.6x
        - 成熟盈利软件底部，用于下行情景框定。
        - 不是原生开发者安全公司，M&A 画像也不同。
    notes: Sonatype 行是隐含 EV/ARR 锚点，公开市场行是当前 EV / 收入参照；该表用于设定区间，不做直接算术平均。
