  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Sonatype 的变现模式更容易理解为分层软件平台，而不是单一安全 SKU。最清晰的公开定价证据来自 Nexus Repository Cloud，Sonatype 官方宣传的起价是每月 $135
              加用量，用量定义为月度总出站流量加月度总存储。官方产品页也明确，同一仓库产品可作为 SaaS、自托管、本地部署和气隙软件提供。这在财务上重要，因为它意味着 Sonatype
              可以通过经常性云用量、企业自管订阅，以及不太可能价格透明的受监管环境部署，变现同一个核心工作流。


              仓库特许权也不再是全部故事。官方页面和 2024 年 Buy with AWS 公告显示，Sonatype 将 Lifecycle、SBOM Manager 和 Repository Firewall 与
              Nexus Repository 一起销售或包装。换句话说，公司似乎同时变现三层：仓库和流量管理、软件组成与策略情报，以及合规 / SBOM 工作流。采购动作明显由企业销售驱动。Sonatype 自己的 AWS
              公告强调通过 AWS Marketplace 提供 private offers；TrustRadius 和 CloudRepo
              只展示部分计划级价格快照，而不是已成交企业合同的清晰公开价目。实际结论是，公开定价可以锚定模式如何运作，但无法说明每个客户群在折扣、捆绑附着和多产品增购之后真正贡献多少收入。
