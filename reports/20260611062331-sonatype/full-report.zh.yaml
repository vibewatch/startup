      - number: '7.2'
        title: 运营复杂度、工作流噪声与信任界面负担
        blocks:
          - type: paragraph
            body: >-
              运营风险不在于 Sonatype 产品薄弱，而在于产品足够重要，一旦配置错误、噪声过大或停机，影响半径会很大。官方系统要求显示，有意义的自托管 Nexus 部署需要外部
              PostgreSQL、节点规格规划、存储纪律，并关注不受支持的模式。相较 SaaS 优先的点工具，这是真实实施负担。评论证据也指向同一方向：用户反复称赞制品控制和 CI/CD
              适配，但也指出文档、UI、分析、NPM、复制和部署摩擦。策略层还带来第二重风险。Firewall 和 Lifecycle
              通过站在接入和决策路径早期创造价值，但这也意味着误报、调优差或数据质量下滑会拖慢发布并削弱开发者信任。Sonatype
              的公开信任中心和状态页是正面因素，但它们也抬高了外界对事故透明度、认证范围和支持成熟度的期待，而当前公开记录尚未完全满足。
