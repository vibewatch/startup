  - id: TV005
    title: 打破投资逻辑与否决触发项表
    columns:
      - 触发项
      - 阈值 / 证据
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 杠杆意外
        - 净债务或优先股堆叠相对标题 EV 明显压低股权价值。
        - 打破 2024 年 EV 锚点能干净映射到可投资股权的假设。
        - 继续前，先按股权口径重算价值。
      - - ARR 质量不达预期
        - 最新 ARR 或留存数据显示，增长弱于假设，或续约质量低于基准情景。
        - 削弱 10x 隐含倍数，并把估值推向成熟软件底部。
        - 将承销切到悲观区间。
      - - 捆绑替代
        - 输赢或流失证据显示，GitHub、GitLab 或 JFrog 正在拿走仓库主导账户。
        - 削弱黏性和溢价倍数依据。
        - 去掉溢价，改用低个位数可比倍数。
      - - AI 扰动扩大
        - AI 原生安全工具继续压缩仓库和代码安全倍数。
        - 降低对开发者工具溢价估值的容忍度。
        - 要求更宽安全边际，或暂缓。
      - - 没有新的估值标记
        - 赞助方、贷款方或管理层没有提供桥接表，更新 2024 年 7 月流程锚点。
        - 随着唯一公开 Sonatype 估值标记老化，陈旧数据风险上升。
        - 维持继续研究建议。
    notes: 触发项设计为外部可观察，并且直接绑定估值，而不只是泛泛的运营担忧。
    claimRefs:
      - CV033
      - CV034
      - CV041
      - CV045
      - CV047
      - CV049
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 债务和现金桥接表
        - 当前债务、现金、利息负担、契约，以及签约或最近季度的净债务。
        - 区分企业价值和股权价值，并直接改变下行。
        - 管理层、贷款方材料或 QoE 资料包。
      - - 优先权和滚存负担
        - 管理层滚存、期权稀释、清算优先权或赞助方结构细节。
        - 决定真实股权收益和回报计算。
        - 审阅股权结构表和交易条款。
      - - ARR 质量和留存
        - 当前 ARR、ARR 增长、NRR、GRR、logo 流失和多产品绑定。
        - 区分可持续的溢价收入和陈旧的 2024 年快照。
        - 董事会材料或运营 KPI 资料包。
      - - 利润率和现金转化
        - 当前毛利率、EBITDA、自由现金流，以及支持 / 托管成本结构。
        - 验证收入倍数应更接近 JFrog，还是更低的软件底部。
        - QoE 和管理层桥接表。
      - - 竞争证明
        - 当前输赢、头部客户集中度和受监管账户续约证据。
        - 测试仓库控制能否继续抵御捆绑和 AI 扰动、保护价值。
        - 商业尽调和客户访谈。
    notes: 每一项要求都指向把估值立场从“说得通”推进到“可承销”，而不是简单增加更多市场背景。
    claimRefs:
      - CV017
      - CV041
      - CV047
      - CV048
      - CV049
