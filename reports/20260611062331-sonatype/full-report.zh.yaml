  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界及品类存在的原因
        blocks:
          - type: paragraph
            body: >-
              Sonatype 服务的市场比泛网络安全更窄，却比传统 SCA
              更宽。官方、分析师和监管来源给出的稳定边界是软件供应链安全：产品和服务帮助组织看清软件组件，控制进入构建和运行时流水线的内容，并证明软件按安全开发政策构建、选择和维护。落到采购语言，就是仓库和制品控制、软件组成分析、SBOM
              生成与生命周期管理、漏洞和可利用性情报、来源与篡改检测，以及嵌入 CI/CD 和开发者工具的治理。该边界排除终端防护、网络边界安全和通用云安全平台等无关类别，除非这些产品明确管理软件依赖或构建完整性。


              这个市场存在，是因为现代软件生产依赖层层第三方和开源代码，移动速度远超人工审查。GitHub 研究称，开源支撑几乎所有现代软件，92% 的开发者使用或尝试 AI 编码工具；Synopsys 称，多数代码库超过
              97% 的代码来自开源。CISA 的 SBOM 页面把 SBOM 描述为软件安全和软件供应链风险管理的关键构件；Sonatype 自身 2026 年监管评论称，开源如今占现代应用的
              80-90%。因此，核心市场逻辑不是可选功能型安全支出，而是运营需求：组织必须知道自己消费了什么代码、是否足够安全，以及能否向审计方、监管者和客户证明这一点。
