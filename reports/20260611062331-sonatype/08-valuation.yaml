  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: net-debt-and-equity-bridge
    missingEvidence: Current debt, cash, covenants, and any preferred or rollover structure that converts enterprise value into equity value.
    whyItMatters: The public anchor is explicitly enterprise value including debt, so equity underwriting is impossible without the bridge.
    diligencePath: Request latest debt schedule, cash balance, and transaction waterfall from management or lender materials.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV006
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: current-arr-growth-and-retention
    missingEvidence: Current ARR, ARR growth, NRR, GRR, churn, and module attach since the July 2024 process marker.
    whyItMatters: Whether Sonatype deserves a premium or a discount to public comps depends on current revenue quality, not only a historical process report.
    diligencePath: Obtain board KPI pack or QoE bridge showing current ARR composition and retention.
    relatedQuestionRefs:
    - QV021
    - QV022
    - QV023
    - QV028
    relatedTableRefs:
    - TV004
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-win-loss
    missingEvidence: Current top-customer share, regulated-sector mix, win-loss results versus GitHub, GitLab, and JFrog, and renewal evidence in repository-led accounts.
    whyItMatters: Competitive compression is one of the main reasons the valuation could move from mid-band support to the bear case.
    diligencePath: Run commercial diligence, customer calls, and win-loss analysis focused on repository-led versus bundled-platform deals.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: stale
    severity: minor
    topic: stale-public-valuation-anchor
    missingEvidence: A fresher sponsor, lender, or market datapoint after the July 2024 sale exploration.
    whyItMatters: The existing anchor is useful, but its age increases the risk that the business or capital structure has changed materially by 2026-06-11.
    diligencePath: Request any lender marks, sponsor process updates, or more recent secondary or minority transaction references.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
