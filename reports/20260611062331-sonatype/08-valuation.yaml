- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / evidence
  - Transmission to thesis
  - Action implication
  rows:
  - - Leverage surprise
    - Net debt or preference stack materially reduces equity value versus headline EV.
    - Breaks the assumption that the 2024 EV anchor maps cleanly to investable equity.
    - Re-cut value on an equity basis before proceeding.
  - - ARR quality miss
    - Fresh ARR or retention data show weaker growth or lower renewal quality than assumed in the base case.
    - Undermines the 10x implied multiple and pushes toward mature-software floors.
    - Move underwriting to bear range.
  - - Bundled displacement
    - Win-loss or churn evidence shows GitHub, GitLab, or JFrog taking repository-led accounts.
    - Weakens stickiness and premium-multiple justification.
    - Remove premium to low-single-digit comps.
  - - AI disruption broadens
    - AI-native security tools keep compressing repository and code-security multiples.
    - Reduces tolerance for premium developer-tool valuations.
    - Demand wider margin of safety or defer.
  - - No fresh valuation marker
    - No sponsor, lender, or management bridge updates the July 2024 process anchor.
    - Raises stale-data risk as the only public Sonatype valuation marker ages.
    - Keep recommendation at research-more.
  notes: Triggers are designed to be externally observable and directly tied to valuation, not just generic operational concerns.
  claimRefs:
  - CV033
  - CV034
  - CV041
  - CV045
  - CV047
  - CV049
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Debt and cash bridge
    - Current debt, cash, interest burden, covenants, and net debt at signing or latest quarter.
    - Separates enterprise value from equity value and changes downside directly.
    - Management, lender materials, or QoE package.
  - - Preference and rollover overhang
    - Management rollover, option dilution, liquidation preferences, or sponsor structure details.
    - Determines real equity proceeds and return math.
    - Cap-table and transaction-terms review.
  - - ARR quality and retention
    - Current ARR, ARR growth, NRR, GRR, logo churn, and multi-product attach.
    - Distinguishes durable premium revenue from a stale 2024 snapshot.
    - Board deck or operating KPI packet.
  - - Margin and cash conversion
    - Current gross margin, EBITDA, free cash flow, and support / hosting cost mix.
    - Validates whether revenue multiples should sit nearer JFrog or lower software floors.
    - QoE and management bridge.
  - - Competitive proof
    - Current win-loss, top-customer concentration, and regulated-account renewal evidence.
    - Tests whether repository control still protects value against bundling and AI disruption.
    - Commercial diligence and customer calls.
  notes: Every ask is aimed at moving the valuation stance from plausible to underwritable rather than simply adding more market color.
