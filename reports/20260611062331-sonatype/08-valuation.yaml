- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Probability signal
  - Main risk
  rows:
  - - Bull
    - Sonatype still grows double digits on profitable ARR, carries limited net debt, and shows strong retention in repository-led accounts.
    - Supports roughly $1.6B-$2.0B EV and limited discount to premium developer-infrastructure comps.
    - Requires fresh sponsor, lender, or management evidence not yet public.
    - Public evidence does not yet prove current growth, retention, or leverage.
  - - Base
    - 2024 ARR/profitability marker is directionally right, leverage is modest, and private opacity offsets some business quality.
    - Supports roughly $1.1B-$1.6B EV, broadly around the 2024 process anchor but with no clear upside premium.
    - Best fit with current public record.
    - Any debt surprise or growth deterioration pushes value into bear range.
  - - Bear
    - ARR quality is weaker than the 2024 marker, bundled rivals compress win rates, or debt/preference overhang is heavier than expected.
    - Supports roughly $0.8B-$1.1B EV and a multiple closer to mature software floors.
    - Activated by negative diligence on retention, leverage, or competitive displacement.
    - Could move equity value well below the headline EV marker.
  notes: Scenario ranges are enterprise-value ranges, not equity-value estimates, because public debt and preference data are missing.
