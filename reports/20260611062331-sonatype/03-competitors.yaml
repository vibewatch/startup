- id: pricing-packaging-and-distribution-power
  title: Pricing, packaging, and distribution power
  body: Packaging is one of the most important competitive weapons in this category. Sonatype's public pricing for Nexus Repository Cloud is consumption-based, meaning buyers pay for storage and egress rather than purely for developer seats. That can be attractive for artifact-heavy enterprises, but it also means Sonatype exposes less simple public list pricing than rivals whose entry motion is seat-based. Snyk prices by contributing developer and advertises free, team, and enterprise paths. GitHub Advanced Security publishes active-committer pricing for Secret Protection and Code Security. FOSSA publishes project-based pricing, JFrog publishes platform tiers beginning at relatively low monthly entry points, and GitLab uses plan bundling that rolls security into higher platform tiers. Checkmarx, Black Duck, and much of Mend remain quote-led enterprise sales motions. The result is mixed. Sonatype benefits when the buyer is already framing the purchase around repository and governance infrastructure,
    because consumption and platform packaging can map to enterprise architecture needs. It is disadvantaged when a GitHub- or GitLab-standardized team can add 'good enough' security through an existing contract, or when a security lead wants the cleanest possible per-developer cost story.
