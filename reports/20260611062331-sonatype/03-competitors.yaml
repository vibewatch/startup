- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / why it matters
  - Diligence ask
  rows:
  - - Repository control raises switching costs
    - GitHub/GitLab buyers may not want a separate repository-centric control plane
    - High
    - Sonatype moat is strongest when artifact governance is strategic, not incidental
    - Request win-loss by SCM standard and by repository incumbent
  - - Integrated platform breadth reduces tool sprawl
    - Point tools with better UX can still win team-level adoption
    - Medium
    - Breadth helps CIO/CISO buyers but can slow departmental adoption
    - Request land-to-expand data and seat activation curves
  - - Enterprise deployment flexibility supports regulated accounts
    - Cloud-native teams may prefer lighter SaaS-first products
    - Medium
    - Hybrid and air-gapped support is valuable but narrows natural buyer base
    - Segment pipeline by cloud-native versus hybrid accounts
  - - Open-source intelligence and malware posture differentiate Sonatype
    - Socket, Endor, Checkmarx, and others market stronger low-noise or malicious-package narratives
    - Medium-high
    - Signal quality matters if buyers perceive classic SCA as noisy
    - Benchmark exploitability/noise metrics versus Snyk, Endor, Checkmarx, Socket
  - - SBOM and compliance surfaces help in regulated procurement
    - FOSSA and Black Duck can win if legal/compliance owns the budget
    - Medium
    - Compliance-led deals may prioritize legal workflow over repository control
    - Request proof of win rates in federal, healthcare, and highly regulated sectors
  - - Pricing opacity protects enterprise packaging flexibility
    - Transparent rivals create easier budget conversations
    - High
    - Bundled or listed pricing can compress Sonatype in midmarket or GitHub-native deals
    - Request realized ASPs, discount ladders, and loss reasons on price
  - - JFrog is the closest strategic analog
    - Artifactory plus Xray can neutralize Sonatype repository advantage
    - High
    - This is the most dangerous one-vendor alternative for artifact-heavy teams
    - Request named displacement data versus JFrog
  - - Bundled platform security is expanding
    - GitHub and GitLab can win through contract adjacency rather than product superiority
    - High
    - Distribution power can outweigh best-of-breed depth
    - Request attach-rate and competitive overlap data by SCM platform
  - - Broader AST platforms can reframe the deal
    - Mend and Checkmarx may win on consolidation mandates
    - Medium
    - If the buyer values full AST platform rationalization, Sonatype can be narrowed to just one module
    - Request how often Sonatype is evaluated in broader AST RFPs
  - - Emerging specialists pressure feature narratives
    - Endor and Socket can influence roadmaps even when they do not displace Sonatype directly
    - Medium
    - New entrants reset expectations on reachability, AI, and malicious package behavior
    - Track roadmap gaps and customer requests against these specialists
  notes: Severity is an analytical judgment based on retrieved public evidence. The register is designed to surface what could erode Sonatype differentiation rather than to imply those threats are already causing losses.
