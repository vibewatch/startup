- calloutType: strength
  title: Sonatype competes best when repository control is part of the purchase
  body: The company’s cleanest differentiation is not generic SCA breadth but owning the package and artifact control plane together with policy, malware, and SBOM workflows.
  claimRefs:
  - CP002
  - CP012
  - CP032
- calloutType: risk
  title: Bundled incumbents are the biggest distribution threat
  body: GitHub, GitLab, and JFrog can win deals because security attaches to an existing workflow or platform contract, not because they necessarily dominate every feature dimension.
  claimRefs:
  - CP008
  - CP017
  - CP019
  - CP033
- calloutType: insight
  title: The market fragments by workflow owner, not by one universal product leader
  body: Compliance-led, developer-led, artifact-led, and SCM-led buyers often choose different winners, so Sonatype should be underwritten as a strong segment fit rather than as a universal category default.
