evidenceGaps:
  - type: missing-source
    severity: material
    topic: 'Company Overview: founders and executive identities'
    missingEvidence: No public source retrieved for this run names any EXU founder, officer, or board member.
    whyItMatters: Governance quality, key-person concentration, and founder-market fit cannot be underwritten without identities.
    diligencePath: Request a leadership org chart, key-person insurance policy status, and founder bios directly from the company.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO002
  - type: access-blocked
    severity: material
    topic: 'Company Overview: official website inaccessible'
    missingEvidence: >-
      The company website at exuglobal.com did not respond during retrieval, so any primary product, team, and
      jurisdictional claims are unverified.
    whyItMatters: A live institutional-grade exchange whose site is unreachable is a diligence red flag on its own.
    diligencePath: >-
      Confirm live production URLs, request a walkthrough of the trading interface, and ask whether exuglobal.com is the
      sole customer-facing domain.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: 'Company Overview: revenue, trading volume, and users'
    missingEvidence: No verified revenue, run-rate, trading volume, or user-count figure is available for EXU in public sources.
    whyItMatters: A $1.2B valuation on a Series B is not underwritable without those numbers.
    diligencePath: >-
      Request 24 months of monthly trading volume, revenue, take rate, monthly active users, and customer geography from
      management.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: 'Company Overview: Leadership and founder table is a partial public enumeration'
    missingEvidence: >-
      Public sources do not name EXU's founders, executives, or board so the leadership table is a placeholder for
      diligence asks.
    whyItMatters: Named leaders are prerequisite to any founder-market-fit judgment.
    diligencePath: Ask the company for the current leadership roster including tenures, prior roles, and equity ownership.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs: []
  - type: enumeration-incomplete
    severity: minor
    topic: 'Company Overview: Stakeholder or investor map covers only public names'
    missingEvidence: >-
