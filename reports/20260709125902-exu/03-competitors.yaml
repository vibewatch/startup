callouts:
  - calloutType: strength
    title: Investor identity is EXU's single strongest competitive signal
    body: >-
      A Series B lead by Sequoia with Goldman Sachs and Granite Asia participation is a stronger investor signal than
      most incumbents had at the same stage. It creates real institutional access even before product proves out.
    claimRefs:
      - CP001
      - CP029
      - CP035
  - calloutType: risk
    title: AI is a marketing wrapper, not a moat, without proprietary data
    body: >-
      AI-driven trading tools are widely available via third-party APIs and open models. Unless EXU's AI trains on
      proprietary order-book data or delivers execution improvements that show up in fill quality, this differentiator
      is easy to replicate.
    claimRefs:
      - CP023
      - CP024
      - CP032
      - CP036
  - calloutType: insight
    title: Regulator posture is the axis where EXU can most credibly differentiate
    body: >-
      The gap between US/EU-regulated venues and offshore competitors is durable and expensive to close. EXU's ability
      to secure MiCA passporting and US state MTLs before scaling should be a leading indicator of long-term
      positioning.
    claimRefs:
      - CP016
      - CP017
      - CP019
      - CP031
