chapter:
  number: 3
  title: Competitors
  summary: >-
    EXU competes in a crowded centralized-exchange field led by Coinbase, Binance, Kraken, OKX, Bybit, Gemini, Bitstamp,
    and Crypto.com. Every listed peer publishes a fee schedule and licensing footprint; EXU discloses neither. Investor
    identity and regulatory posture are the two dimensions where EXU can most credibly differentiate, but AI-based
    trading features are commoditizing quickly and are not a moat by themselves.
sections:
  - id: section-1
    title: Competitive landscape and substitutes
    body: >-
      The competitive landscape for EXU is unusually crowded even by fintech standards. The top of the incumbent stack
      is Coinbase (US-listed public equity), Binance (largest by volume, still recovering from a $4.3B US settlement),
      Kraken (top-5 US venue), OKX and Bybit (global derivatives leaders), Gemini and Bitstamp (regulated legacy
      venues), and Crypto.com (consumer-brand-forward). Substitutes matter as much as the direct peers: decentralized
      exchanges like Uniswap and dYdX handle a growing share of long-tail spot volume, OTC desks like Cumberland,
      Galaxy, and B2C2 absorb the largest institutional trades bilaterally without touching public order books, and
      traditional brokerages such as Robinhood, Fidelity, and Schwab increasingly offer spot crypto exposure through
      familiar accounts. Fireblocks and other custody-infrastructure vendors are neither peers nor substitutes but
      represent a build-vs-buy question that every new exchange has to answer. EXU's public materials do not disclose
      which of these stacks it uses, so the competitive frame is inferred rather than confirmed.
    claimRefs:
      - CP001
      - CP023
      - CP024
      - CP026
    tableRefs:
      - TP001
  - id: section-2
    title: Feature, pricing, and regulator-posture comparison
    body: >-
      Feature and pricing comparison is where EXU's public-record thinness matters most. Every listed peer publishes a
      fee schedule, a licensing footprint, and at minimum a marketing description of institutional services. EXU does
      not. On features, Coinbase covers all eight of the capability rows in the matrix (spot, derivatives via
      subsidiary, custody, prime, AI-lite via Advanced Trade, MiCA in progress, broad US MTLs, and adjacencies via Base
      L2 and USDC). Binance, Kraken, and OKX cover 6-7 rows. Bybit, Gemini, Crypto.com, and Bitstamp cluster around 4-5.
      EXU claims only two rows publicly — spot trading and AI-marketed features. On pricing, the industry converges
      around a tiered maker/taker schedule that reduces to under 10 basis points for the highest-volume institutions;
      without published fees, EXU's take rate and competitiveness cannot be scored. On regulatory posture, the gap
      between US/EU-regulated venues (Coinbase, Kraken, Gemini, Bitstamp) and offshore venues (Binance, OKX, Bybit) is
      the single most durable competitive axis, and EXU's position on it is unknown.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP015
      - CP016
      - CP017
      - CP019
      - CP029
      - CP031
      - CP034
    tableRefs:
      - TP002
      - TP003
    figureRefs:
      - FP001
      - FP002
  - id: section-3
    title: Switching cost, multi-homing, and distribution power
    body: >-
      Switching cost in the exchange market is asymmetric across segments. For retail users, the primary switching cost
      is fiat on/off ramp, KYC redo, and habitual UX; those costs are real but low enough that retail traders routinely
      maintain accounts on 2-3 venues. For institutional users, the switching cost is much higher: legal and compliance
      approval, custody-tech integration, and middle-office reporting all take 30-90 days per venue. That creates
      durable inertia for incumbent institutional relationships but also creates a moat for the first new venue an
      institutional buyer approves, because the same integration work does not have to be redone. Multi-homing behavior
      at both retail and institutional levels means EXU does not need to be the only venue, but must be one of the top
      2-3 that a target buyer approves. Distribution power in the sector flows through brand trust (Coinbase, Gemini),
      stablecoin issuer alignment (Circle/USDC across many venues), traditional-broker distribution partnerships
      (Robinhood-Bitstamp acquisition, Fidelity Crypto), and social-media and referral programs (Binance, Bybit). EXU's
      distribution levers are not publicly disclosed and are a diligence ask.
    claimRefs:
      - CP027
      - CP028
      - CP029
      - CP030
    tableRefs:
      - TP004
  - id: section-4
    title: Moat durability, adverse evidence, and displacement risk
    body: >-
      Moat durability for a new institutional-grade crypto exchange rests on three plausible pillars: (i) tier-1
      investor trust, (ii) a robust regulatory license posture, and (iii) AI or execution features that draw on
      proprietary order-flow data. EXU has (i) by virtue of the Sequoia, Goldman, and Granite Asia syndicate. Pillar
      (ii) is unknown because EXU's licensing posture is not disclosed. Pillar (iii) is the weakest — AI trading
      features are commoditizing quickly through third-party APIs, and unless EXU's AI feeds on proprietary order-book
      depth or execution outcomes, it is a marketing wrapper rather than a moat. Adverse competitor evidence — SEC
      actions against Binance and Coinbase, Binance's $4.3B November 2023 settlement, and FTX's collapse — collectively
      means investors underwrite crypto exchanges with a higher risk premium than other fintech categories, and any new
      entrant benefits from this shift only if it can credibly demonstrate a materially better compliance posture.
      Displacement risk is highest from incumbents extending into AI-driven prosumer tools (Coinbase Advanced, Kraken
      Pro), from traditional brokerages entering crypto with existing user bases, and from offshore venues shipping
      product features faster.
    claimRefs:
      - CP018
      - CP019
      - CP020
      - CP021
      - CP022
      - CP025
      - CP030
      - CP031
      - CP032
      - CP033
      - CP035
      - CP036
