  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - risk
      - severity
      - time horizon
      - implication for EXU
    rows:
      - - Incumbent expansion into AI-driven prosumer tools
        - high
        - 6-18 months
        - Coinbase Advanced, Kraken Pro can add AI features quickly, eroding EXU's stated differentiation.
      - - DEX substitution for retail long-tail
        - medium
        - 12-24 months
        - Uniswap-style venues siphon retail flow in non-USD markets; retail moat is not durable.
      - - Regulatory license lag
        - high
        - 6-24 months
        - If EXU trails on MiCA or US MTLs, it loses the compliance premium peers cite.
      - - Custody trust deficit
        - high
        - immediate
        - Any early operational incident is fatal — FTX and Mt. Gox precedents are 20+ years long.
      - - Multi-homing behavior
        - medium
        - ongoing
        - Users active on 2-3 venues; EXU needs to be materially better on a proprietary dimension.
      - - Traditional brokerage entry
        - medium
        - 12-36 months
        - Robinhood, Fidelity, Schwab can distribute crypto exposure with existing user bases.
      - - Offshore venue product cadence
        - medium
        - 3-12 months
        - OKX and Bybit ship derivatives features faster; EXU has to match on product-market fit.
      - - AI-feature commoditization
        - medium
        - 12 months
        - Third-party trading APIs and open models make AI signals a table-stakes feature quickly.
    notes: >-
      The moat register is a diligence template; each entry should be scored against EXU's actual product roadmap in a
