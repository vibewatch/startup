company:
  name: EXU
chapter:
  number: 1
  title: Company Overview
  summary: >-
    EXU is a Silicon Valley-anchored crypto trading platform founded in 2025 that raised a $120 million Series B at a
    $1.2 billion valuation from Sequoia Capital, The Goldman Sachs Group, and Granite Asia. Public evidence supports the
    investor identity and valuation numbers, but the company website was inaccessible during retrieval and no founders,
    executives, board, headcount, revenue, or trading volume are publicly disclosed; underwriting requires a data-room
    read.
sections:
  - id: section-1
    title: Identity and public footprint
    body: >-
      EXU (also referenced as EXUGlobal) is a crypto trading platform founded in 2025 that TechCrunch lists in its 2025
      unicorn tracker with a $1.2 billion post-money valuation after a $120 million Series B round. The company is
      anchored geographically in the U.S. venture ecosystem — the TechCrunch article is a U.S. unicorn survey and the
      named investors are U.S. and Asia-Pacific institutional funds — but no primary filing, press release, or company
      page confirms an exact headquarters city, founding month, or executive team. The official website at exuglobal.com
      did not respond during research for this run, which is itself a diligence signal: an institutional-grade crypto
      trading platform whose website is not reachable is a company where every operating claim must be corroborated in a
      private data room. On the public record, EXU's identity is therefore best described as an early-stage,
      U.S.-oriented crypto trading platform whose defining public artifacts are its investor syndicate and its
      PitchBook-reported valuation, not its product or its team.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO006
      - CO033
      - CO035
    tableRefs:
      - TO001
    figureRefs:
      - FO003
  - id: section-2
    title: Founders, leadership, and governance gaps
    body: >-
      The public sources retrieved for this run do not name any EXU founder, officer, or board member. That is unusual
      for a Series B unicorn: comparable crypto exchange peers (Coinbase, Kraken, Bitstamp, Gemini) all have publicly
      identifiable founder-CEOs and named senior teams. Silicon Valley pattern-matching says a Series B round of this
      size would typically involve at least a founder-CEO with prior crypto or trading credibility, a CTO with
      distributed systems or trading systems background, and a Chief Compliance Officer given the regulatory
      environment. None of that can be verified from the public sources examined. The named lead investor Sequoia
      Capital is well documented, as is the strategic backing of The Goldman Sachs Group and the Asia-Pacific
      relationship anchor Granite Asia (successor to GGV Capital), so investor identity is the only leadership dimension
      with high-confidence public coverage. Every other governance question — board composition, protective provisions,
      chair independence, existence of an audit or risk committee, and key-person insurance — is a mandatory data-room
      diligence ask before underwriting.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO030
      - CO034
    tableRefs:
      - TO002
      - TO003
  - id: section-3
    title: Funding, valuation, and capital base
    body: >-
      The core capital facts for EXU are consistent across TechCrunch's reporting and its underlying PitchBook data
      feed: a $120 million Series B round completed in 2025 at a $1.2 billion post-money valuation, bringing cumulative
      raised to $160 million. Named participants in the round are Sequoia Capital, The Goldman Sachs Group, and Granite
      Asia. Public sources do not disclose the earlier funding history that produced the other $40 million of the $160
      million total — no seed or Series A press releases are indexed in the sources retrieved. Public sources also do
      not disclose any secondary transaction, convertible-note or SAFE overhang, or debt/credit facility; a Series B
      crypto exchange with roughly $160 million of equity would typically not need debt, but institutional custody or
      fiat rails partnerships may require guarantee structures that only appear in the data room. Compared with
      Coinbase's pre-IPO capital stack and Kraken's multi-round history, EXU's public capital profile looks compact and
      clean, but the underwriting question is whether the private cap table matches that picture.
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO007
      - CO008
      - CO009
      - CO010
      - CO015
    tableRefs: []
  - id: section-4
    title: Cover metrics, milestones, and sector chronology
    body: >-
      Beyond capital, the cover metrics that would normally close out a company overview — revenue, run-rate, monthly
      active users, trading volume, headcount, and office locations — are not publicly disclosed for EXU. Marketing
      statements attributed to the company in third-party press aggregators (isStories.com and similar) referenced
      roughly 1 million users and $280 million daily trading volume, but those figures were not retrievable as primary
      text and cannot be verified against any exchange volume tracker (CoinMarketCap, The Block, DefiLlama). The
      verifiable public chronology for EXU is very short: founded in 2025, Series B closed in 2025, listed in
      TechCrunch's January 2026 unicorn survey. That chronology sits inside a much longer sector chronology that any
      diligence read has to account for: the November 2022 FTX bankruptcy, the June 2023 SEC actions against Binance and
      Coinbase, the 2023 publication of the EU MiCA regulation, the November 2023 IOSCO 18-recommendation framework, and
      the ongoing FATF Travel Rule expectations. That combined chronology is why the diligence posture for EXU has to be
      "research more" rather than "buy" — the investor signal is genuinely strong, but the operating record required to
      underwrite a $1.2B valuation is not yet public.
    claimRefs:
