callouts:
  - calloutType: risk
    title: Every core product claim is unverifiable from public sources
    body: >-
      EXU's website was inaccessible during retrieval; matching engine performance, custody model, and AI feature detail
      cannot be primary-verified.
    claimRefs:
      - CE001
      - CE029
      - CE034
  - calloutType: insight
    title: AI signal features are cheap to build, hard to defend
    body: >-
      Foundation-model APIs from Google Cloud, OpenAI, and Anthropic put AI signal features within reach of any
      competitor. Without proprietary training data, EXU's AI is a marketing wrapper, not a durable moat.
    claimRefs:
      - CE007
      - CE008
      - CE030
  - calloutType: recommendation
    title: Trust controls should be the first data-room ask
    body: >-
      SOC 2 Type II, ISO 27001, proof of reserves, pen-test summaries, and custody insurance are the fastest way to
      distinguish an institutional-grade platform from a marketing claim.
    claimRefs:
      - CE020
      - CE024
      - CE034
