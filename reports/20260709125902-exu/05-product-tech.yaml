company:
  name: EXU
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    EXU is described as an institutional-grade crypto trading platform with AI-driven features, but its official website
    was inaccessible during retrieval and no primary product, architecture, or trust-control detail is publicly
    available. Every product claim in this chapter is inferred from peer templates (Coinbase Institutional, Kraken,
    Binance) and industry standards (NIST, FATF, IOSCO, MiCA). AI signal features are cheap to build with
    foundation-model APIs and only become a moat with proprietary data.
sections:
  - id: section-1
    title: Product definition and modules
    body: >-
      EXU is publicly described as an institutional-grade crypto trading platform with AI-driven trading signals and
      risk management features. Because the company website did not respond during retrieval, the product definition has
      to be built from peer templates and the small set of external references. A reasonable inferred module map for a
      platform positioned this way includes: a matching engine, spot trading UI + API (REST + WebSocket + FIX),
      derivatives trading if licensed, MPC-based custody with cold storage backup, KYC/AML pipeline, blockchain
      analytics integration, market data feed, and an AI signal service. Coinbase Institutional publishes an equivalent
      product surface, so the peer benchmark is clear even if EXU's coverage is not. Each module carries specific trust
      dependencies that any institutional buyer will scrutinize, including SOC 2 controls on the matching engine, MPC
      operational discipline on custody, and Chainalysis or Elliptic integration on the AML pipeline.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE013
      - CE014
      - CE019
      - CE029
    tableRefs:
      - TE001
  - id: section-2
    title: Architecture, dependencies, and workflow
    body: >-
      The reference architecture for an institutional-grade exchange combines cloud infrastructure (AWS or GCP
      multi-region), a low-latency matching engine (C++ or Rust in-memory order book), trading APIs (REST + WebSocket +
      FIX), a custody stack (HSM + MPC + cold multi-sig), blockchain nodes (Bitcoin, Ethereum, Solana, and others), a
      KYC/AML pipeline (Persona, Onfido, Chainalysis, Elliptic), and an AI signal service built on foundation-model
      APIs. AWS Blockchain and Google Cloud publish partner-facing documentation that supports this stack, and
      Fireblocks provides a widely-used MPC custody option. NIST cybersecurity guidance and NIST post-quantum
      cryptography standards are the baseline controls that institutional buyers will benchmark against, and Ledger
      Academy provides developer-facing security education material widely referenced by exchange engineering teams. The
      customer onboarding workflow — first meeting, legal/compliance review, custody-tech integration, pilot trade, ramp
      — has 30-60 day and 30-60 day and further-30-day gates that translate directly into deployment complexity. EXU's
      specific vendors, latency targets, and blockchain coverage are all private.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
      - CE012
      - CE015
      - CE016
      - CE017
      - CE018
      - CE029
      - CE031
      - CE032
    tableRefs:
      - TE002
      - TE003
    figureRefs:
      - FE001
      - FE002
      - FE003
  - id: section-3
    title: Differentiation, IP, and roadmap
    body: >-
      For a crypto exchange, technical differentiation rests on four dimensions: matching engine quality (latency and
      throughput), custody security architecture (MPC + HSM + cold storage design), blockchain integrations (breadth and
      settlement finality across chains and L2s), and proprietary AI models. Patented software plays almost no role in
      exchange moats; the moat is operational competence and integration depth. EXU's public materials mention AI-driven
      trading signals as a marketing highlight, but without proprietary data — for example, EXU's own order-book depth
      used to train models — that AI is easily replicable using third-party foundation-model APIs. a16z's 2024 State of
      Crypto report documents rapid L2 scaling and material blockchain-cost declines, so exchanges that deeply integrate
      Ethereum L2s can offer materially cheaper withdrawals than those still routed through L1. Roadmap items that would
      strengthen EXU's technical moat include colocation-grade matching latency, proprietary market-data products,
      cross-margined derivatives, audited real-time proof of reserves, and a defined post-quantum key rotation strategy.
      None of these are publicly disclosed for EXU.
    claimRefs:
      - CE008
      - CE027
      - CE030
      - CE033
      - CE035
    tableRefs:
      - TE005
  - id: section-4
    title: Trust, safety, security, and quality controls
    body: >-
      Trust controls are where an institutional-grade exchange either earns or loses buyer confidence, and they are
      entirely private for EXU. The standard institutional expectation is SOC 2 Type II, ISO 27001, independent
      penetration testing on an annual or continuous cadence, custody insurance for cold-storage assets, 24/7 trading
      desk support with named account managers, and post-FTX real-time proof of reserves. FATF Travel Rule compliance,
      ESMA implementing standards under MiCA, and IOSCO recommendations all translate into concrete platform-side
      integrations that add operating cost but also become moats once implemented. Blockchain analytics integration
      (Chainalysis, Elliptic) is a de facto sanctions and illicit-flow standard. The Hexatrust security-vendor ecosystem
      represents the SIEM/SOAR/IAM/DLP layer any regulated fintech typically integrates with. Fidelity Digital Assets
      research reinforces that institutional buyer expectations are demanding on all of these dimensions. None of these
      controls are disclosed publicly for EXU, which makes trust-control disclosure the single most important data-room
      ask.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE028
      - CE034
      - CE036
    tableRefs:
      - TE004
    figureRefs:
      - FE004
