  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The EXU investment thesis rests on four pillars: tier-1 investor identity (Sequoia, Goldman Sachs, Granite
              Asia), AI-driven product differentiation, MiCA licensing potential as EU market unlock, and institutional
              flow growth as demand-side tailwind. The anti-thesis is equally clear: investor identity does not
              substitute for operating metrics, AI features are cheap to build with third-party foundation-model APIs
              and require proprietary data to be defensible, MiCA license status for EXU is unknown, and post-FTX flight
              to quality tends to benefit publicly regulated incumbents (Coinbase Institutional, Kraken) before it
              reaches new entrants. Given that every operating metric — revenue, take rate, users, trading volume,
              license posture, retention, burn — is private and the company website was inaccessible during retrieval,
              the recommendation is "research-more" with low confidence, high risk rating, and an "expensive" valuation
              stance. Both TechCrunch's narrative and PitchBook's data anchor a $1.2B mark, but neither confirms
              operating metrics; base-case scenario modelling suggests a $600-800M EV that sits below the current mark.
              Coinbase's multi-cycle equity value from $86B peak to sub-$10B trough reminds any private buyer that
              crypto exchange multiples are highly cycle-sensitive.
            claimRefs:
              - CV001
              - CV002
              - CV005
