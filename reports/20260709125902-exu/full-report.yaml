      - number: '8.2'
        title: Entry discipline, preference stack, and public-price support
        blocks:
          - type: paragraph
            body: >-
              Entry discipline for an EXU Series B investment matters more than usual because the current mark is set by
              the syndicate rather than by any independently verifiable operating metric. Standard Series B preferred
              stock terms in a Sequoia-led round typically carry 1x non-participating liquidation preference and
              pro-rata rights, but specific EXU terms are not publicly disclosed. The public-price support question is
              whether the $1.2B mark can be justified against comparable transactions: PitchBook's 2025 crypto VC report
              and the small set of comparable private rounds together with Coinbase's public equity value provide the
              anchor. Coinbase's SEC 10-K filings and its SEC EDGAR filings page give the deepest reference financial
              detail, and Yahoo Finance, MarketWatch, and Bloomberg all publish COIN quotes so multi-source public-price
              data is available. On a revenue-multiple basis, the current mark implies materially better operating
              metrics than any comparable private exchange has demonstrated at Series B without public disclosure —
              hence the "expensive" valuation stance. On an AUM-multiple basis using DefiLlama's CEX reserve tracker as
              a sanity check, the private-market benchmark is similar. Dilution and preference overhang from earlier
              rounds ($40M pre-Series B) are further unknowns that should be scored in a data-room read.
            claimRefs:
