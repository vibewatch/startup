              features. On pricing, the industry converges around a tiered maker/taker schedule that reduces to under 10
              basis points for the highest-volume institutions; without published fees, EXU's take rate and
              competitiveness cannot be scored. On regulatory posture, the gap between US/EU-regulated venues (Coinbase,
              Kraken, Gemini, Bitstamp) and offshore venues (Binance, OKX, Bybit) is the single most durable competitive
