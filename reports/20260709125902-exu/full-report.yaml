              relationship, (b) execution added, (c) prime services (borrow, cross-margining), (d) derivatives, (e)
              structured products. Deloitte's enterprise adoption research confirms that treasuries and enterprise
              buyers move through this sequence very slowly. Land-and-expand from custody to execution is the
              highest-leverage expansion path because custody accounts are exceptionally sticky and provide a natural
