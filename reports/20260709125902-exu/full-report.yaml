            body: >-
              Feature and pricing comparison is where EXU's public-record thinness matters most. Every listed peer
              publishes a fee schedule, a licensing footprint, and at minimum a marketing description of institutional
              services. EXU does not. On features, Coinbase covers all eight of the capability rows in the matrix (spot,
              derivatives via subsidiary, custody, prime, AI-lite via Advanced Trade, MiCA in progress, broad US MTLs,
