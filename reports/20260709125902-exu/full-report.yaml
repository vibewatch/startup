      - number: '3.3'
        title: Switching cost, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching cost in the exchange market is asymmetric across segments. For retail users, the primary
              switching cost is fiat on/off ramp, KYC redo, and habitual UX; those costs are real but low enough that
              retail traders routinely maintain accounts on 2-3 venues. For institutional users, the switching cost is
              much higher: legal and compliance approval, custody-tech integration, and middle-office reporting all take
              30-90 days per venue. That creates durable inertia for incumbent institutional relationships but also
              creates a moat for the first new venue an institutional buyer approves, because the same integration work
              does not have to be redone. Multi-homing behavior at both retail and institutional levels means EXU does
              not need to be the only venue, but must be one of the top 2-3 that a target buyer approves. Distribution
              power in the sector flows through brand trust (Coinbase, Gemini), stablecoin issuer alignment (Circle/USDC
              across many venues), traditional-broker distribution partnerships (Robinhood-Bitstamp acquisition,
              Fidelity Crypto), and social-media and referral programs (Binance, Bybit). EXU's distribution levers are
              not publicly disclosed and are a diligence ask.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
