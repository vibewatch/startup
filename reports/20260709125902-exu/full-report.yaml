      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness for a private crypto exchange at EXU's scale is gated by three prerequisites: regulator
              posture (licenses secured and disclosed), audited financial statements at institutional standards, and
              named institutional customer proofs. EXU has none of these publicly demonstrated as of the current date.
              Thesis-break triggers that would force a downgrade from "research-more" to "avoid" include: any material
              regulatory enforcement action against EXU, any custody incident with confirmed customer loss above $10M,
              founder or CTO exit within 12 months of investment, failure to secure MiCA passporting by end of 2026,
              reserve outflows exceeding 25% in a week (observable via DefiLlama), and any adverse Chainalysis screening
              finding. Final diligence asks are focused: 24 months of monthly revenue and take rate to anchor revenue
              models, customer list with concentration by top-10 to reveal concentration risk, full license schedule (US
              MTLs, MSB, MiCA, other) to determine geographic revenue ceiling, custody model diagram plus insurance
              policy summary, SOC 2 Type II attestation report, fully diluted cap table with preference stack, roadmap
              with milestones and headcount plan, and audited financial statements or interim unaudited if audit is
              pending. Each of these asks maps to a specific valuation input, and each is the precondition for moving
              from "research-more" to a "buy" or "avoid" call.
            claimRefs:
