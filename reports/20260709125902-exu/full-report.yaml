  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk landscape
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is the single most extensively documented risk category for a crypto exchange. The SEC has
              active litigation against Binance (13 charges filed June 2023) and Coinbase (unregistered exchange
              complaint filed June 2023), and continued enforcement actions across 2024. Binance and CEO Changpeng Zhao
              settled with U.S. authorities for $4.3 billion on AML and sanctions charges in November 2023. FinCEN
              classifies crypto exchanges as MSBs subject to BSA CTR/SAR reporting. FATF Travel Rule and VASP guidance
              shape cross-border AML expectations. The CFTC actively regulates crypto derivatives and warns of pervasive
              retail fraud. In the EU, MiCA and ESMA implementing standards establish a comprehensive licensing regime
              whose transition period ends in the 2024-2025 window. IOSCO's 18 policy recommendations are the global
              baseline. On top of federal action, state Attorneys General — most notably California and New York — bring
              parallel civil actions. For an exchange whose licensing posture is not publicly disclosed, every one of
              these regulatory dimensions is a critical or material impact risk with unknown mitigation maturity.
            claimRefs:
