      - number: '7.3'
        title: Partner, people, and financial risk
        blocks:
          - type: paragraph
            body: >-
              Partner dependency risk for EXU concentrates in fiat banking (limited crypto-friendly banks), cloud
              infrastructure (typical single-cloud architecture), MPC/custody vendors (Fireblocks and BitGo dominant),
              Chainalysis/Elliptic for sanctions screening (near duopoly), stablecoin issuers (USDC and USDT), and
              foundation-model providers for AI features. Single-vendor failure is a realistic scenario for any of
              these. People risk is elevated because EXU's founders and executives are not publicly named — Silicon
              Valley pattern-matching says a Series B unicorn without a named leadership team is unusual and warrants a
              specific data-room read on key-person concentration, retention equity, and succession planning. Financial
              and model risk includes concentrated top-account revenue for a new exchange (typically one to three
              accounts drive Year 1 volume), thin market-maker rebate margins that squeeze gross margin at institutional
              scale, and reliance on stablecoin issuer solvency for settlement. BIS prudential standards indirectly
              raise the cost of banking partners. FTC consumer warnings and Fed FSR crypto references keep
              macro-regulatory attention high.
            claimRefs:
              - CR014
              - CR015
