      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Institutional-grade crypto trading has a well-defined buyer stack: retail active traders (the historical
              volume driver), prosumer API users, family offices, hedge funds and prop shops, and corporate treasuries.
              EXU's stated positioning targets the middle three segments — family offices, hedge funds, and prosumers —
              where fee sensitivity is lower and product differentiation (AI signals, execution quality, cross-margin)
              matters more than in retail. The adoption path is a two-stage funnel: (1) legal/compliance approval based
              on the platform's regulatory posture and audit history, and (2) custody-tech integration into the buyer's
              middle office. Both stages typically take 30-90 days and drop 70-85% of the raw pipeline before first
              pilot volume. Growth signals in Fidelity and PwC research confirm the direction of travel — institutional
              participation is increasing — but the funnel means Year 1 exchange volume is bounded by pipeline maturity,
              not headline market size. The buyer map is also affected by ETF flow: U.S. spot Bitcoin and Ether ETFs
              generate custody demand and hedging volume that ends up on the exchange side, giving EXU an indirect but
              real institutional flow driver.
