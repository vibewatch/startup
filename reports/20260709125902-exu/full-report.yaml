        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk for a crypto exchange is dominated by cyber intrusion, MPC/HSM key compromise, exchange
              outage during volatility, insider fraud, reconciliation drift, blockchain reorgs, and DDoS abuse. NIST
              cybersecurity guidance is the baseline institutional buyers expect. Cyber and key-compromise risks are the
              most severe: post-Mt.Gox and post-FTX experience shows that a single custody incident with customer loss
              is fatal for institutional credibility, regardless of technical merit. Chainalysis reporting on illicit
              exchange flows and sanctions exposure reinforces that operational controls have to include blockchain
              analytics screening. The FBI IC3 annual reports document billions of dollars in reported crypto-related
              crime losses. The SEC has an ongoing cybersecurity enforcement history that touches crypto issuers and
              platforms. Post-quantum cryptography (NIST PQC) is a slower-moving risk but real for long-lived cold
              storage keys. EXU discloses no SOC 2, ISO 27001, penetration testing summary, or proof-of-reserves
              attestation, so every operational risk mitigation is unknown from the public record.
