      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigations for the risk register are largely industry standard: multi-jurisdiction license portfolio and
              outside counsel retention (regulatory), MPC + cold storage + insurance + SOC 2 + continuous penetration
              testing (cyber/custody), real-time proof of reserves + transparency reports (reputational), named
              leadership + retention equity + succession plans (people), diversified fee mix + adjacencies + multi-bank
              relationships (financial), and multi-cloud and multi-custody architecture (partner). Monitoring indicators
              that institutional buyers actually track include Chainalysis screening results, S&P counterparty rating
              actions, DefiLlama outflow spikes as a leading indicator of trust erosion, and CoinDesk-style enforcement
              news. Kill criteria that should be pre-negotiated at term sheet include: any material regulatory
              enforcement action against EXU, any custody incident with customer loss, founder or CTO exit within 12
              months of investment, and failure to secure MiCA passporting by end of 2026. Each kill criterion maps to a
              specific monitoring indicator and a specific mitigation path, and each should be tested in a data-room
              deep dive before writing a check.
            claimRefs:
