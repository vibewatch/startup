  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              EXU's addressable market is the global centralized cryptocurrency exchange sector — the fee pool that
              spans retail spot, institutional spot, derivatives clearing, custody, and margin-adjacent services.
              Included spend covers trading fees, market-maker rebates, and derivatives clearing revenue; excluded spend
              covers mining, stablecoin issuer float, and pure DeFi protocol fees. Substitutes matter a great deal
              because they compete for the same underlying flow: decentralized exchanges (Uniswap, dYdX, GMX) offer
              non-custodial execution at competitive spreads for retail and long-tail assets, OTC desks (Cumberland,
              Galaxy, B2C2) take large institutional trades bilaterally without touching a public order book, and
              traditional brokerages (Robinhood, Fidelity, Schwab) increasingly offer spot crypto exposure through
              familiar accounts. Wikipedia's stablecoin coverage confirms that dollar-pegged stablecoins are now the
              primary settlement asset on centralized exchanges, tying exchange growth to stablecoin adoption. That
              means EXU's "institutional-grade crypto trading platform" positioning is not a market of its own; it is a
              segment inside the broader exchange sector that competes on regulatory posture, custody quality, AI-driven
              differentiation, and fee schedule.
            claimRefs:
