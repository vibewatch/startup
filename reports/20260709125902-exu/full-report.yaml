        title: Revenue model and stream mix
        blocks:
          - type: paragraph
            body: >-
              Centralized crypto exchanges monetize through trading fees (retail spot, institutional spot, and
              derivatives), custody fees, staking revenue share, listing fees, and market-data subscriptions; a growing
              set of platforms also monetize through AI-signal or premium-tier subscriptions. EXU's public materials
              mention AI-signal features but do not disclose fee schedules, VIP tiers, or the actual stream mix. Using
              peer benchmarks — Coinbase's public 10-K filings, Binance's tiered fee schedule, Kraken's 0.16%/0.26%
              low-tier and 0.00%/0.10% high-tier fees, and Bitstamp's 0.4%/0.4% low tier — the industry blended take
              rate for institutional volume settles between 5 and 15 basis points, with retail take rates 3-4x higher
              and derivatives take rates lower still. Coinbase's 10-K also documents that custody and staking revenue is
              more stable than trading revenue, so exchanges with an institutional-adjacencies mix typically report
              lower revenue volatility than pure retail venues. EXU's institutional positioning would fit this pattern
              if the actual stream mix bears it out.
