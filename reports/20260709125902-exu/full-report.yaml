        title: Differentiation, IP, and roadmap
        blocks:
          - type: paragraph
            body: >-
              For a crypto exchange, technical differentiation rests on four dimensions: matching engine quality
              (latency and throughput), custody security architecture (MPC + HSM + cold storage design), blockchain
              integrations (breadth and settlement finality across chains and L2s), and proprietary AI models. Patented
              software plays almost no role in exchange moats; the moat is operational competence and integration depth.
              EXU's public materials mention AI-driven trading signals as a marketing highlight, but without proprietary
              data — for example, EXU's own order-book depth used to train models — that AI is easily replicable using
              third-party foundation-model APIs. a16z's 2024 State of Crypto report documents rapid L2 scaling and
              material blockchain-cost declines, so exchanges that deeply integrate Ethereum L2s can offer materially
              cheaper withdrawals than those still routed through L1. Roadmap items that would strengthen EXU's
              technical moat include colocation-grade matching latency, proprietary market-data products, cross-margined
              derivatives, audited real-time proof of reserves, and a defined post-quantum key rotation strategy. None
