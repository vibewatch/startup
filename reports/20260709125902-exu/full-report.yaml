      - number: '8.3'
        title: Comparable set and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The comparable set is deliberately mixed to provide multiple lenses: Coinbase as the public benchmark with
              SEC 10-K disclosure and multi-cycle market-cap history from roughly $60-90B currently down to sub-$10B in
              crypto winters; Kraken as a comparable private multi-round history with rumored IPO path; Binance as the
              private opaque scale reference indicating that even top-of-market private valuations are hard to mark;
              Gemini as a regulated-posture private peer with disclosed prior secondary rounds around $7B; Bitstamp as
              an M&A comparable being acquired by Robinhood for approximately $200M; OKX as a large private but opaque
              global peer. Messari's Q4 2024 sector report and Galaxy Research provide outside outlook framing. CFA
              Institute methodology research and Aswath Damodaran's public valuation research together anchor the
              framework for scenario modelling. The bull/base/bear scenario table shows illustrative EV bands: bear
              $200-400M in a crypto-winter drawdown similar to 2022-2023 with take-rate compression, base $600-800M at
              15 bps blended take rate on $5B monthly volume, bull $2.8-3.2B assuming $15B monthly volume, 20 bps
              blended take rate, and 8x revenue multiple after a licensing sweep and institutional wins. Each range
              carries wide error bands and is illustrative until private data is available.
