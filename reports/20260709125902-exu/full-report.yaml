      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for EXU is unusually crowded even by fintech standards. The top of the incumbent
              stack is Coinbase (US-listed public equity), Binance (largest by volume, still recovering from a $4.3B US
              settlement), Kraken (top-5 US venue), OKX and Bybit (global derivatives leaders), Gemini and Bitstamp
              (regulated legacy venues), and Crypto.com (consumer-brand-forward). Substitutes matter as much as the
              direct peers: decentralized exchanges like Uniswap and dYdX handle a growing share of long-tail spot
              volume, OTC desks like Cumberland, Galaxy, and B2C2 absorb the largest institutional trades bilaterally
              without touching public order books, and traditional brokerages such as Robinhood, Fidelity, and Schwab
              increasingly offer spot crypto exposure through familiar accounts. Fireblocks and other
              custody-infrastructure vendors are neither peers nor substitutes but represent a build-vs-buy question
              that every new exchange has to answer. EXU's public materials do not disclose which of these stacks it
              uses, so the competitive frame is inferred rather than confirmed.
