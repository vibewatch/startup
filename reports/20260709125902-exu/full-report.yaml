      - number: '2.2'
        title: Sizing lenses and evidence-constrained numbers
        blocks:
          - type: paragraph
            body: >-
              No single public source reconciles a dollar-denominated TAM/SAM/SOM for a new institutional-grade crypto
              exchange. Four independent lenses do exist in the public record and are shown in the sizing table: (i)
              a16z crypto reports 220 million monthly active blockchain addresses in September 2024, more than 3x the
              end-of-2023 baseline; (ii) The Block's ongoing spot-volume tracker regularly shows trillions of dollars of
              annual volume across major centralized venues; (iii) CoinMarketCap enumerates hundreds of exchanges by
              trust score and liquidity; (iv) Fidelity Digital Assets and PwC surveys estimate institutional allocation
              and fund AUM. These are not the same measurement and cannot be summed. The most defensible construction
              for EXU's sizing is therefore an evidence-constrained SAM: a take-rate applied to U.S. + EU institutional
              spot volume plus a share of derivatives clearing, held against the multi-vendor competitive frame
              described in the competitors chapter. Chainalysis 2024 reporting reminds every underwriter that some
              reported volume is inflated by illicit or wash-trade activity, so the SAM has to be discounted for that as
              well.
