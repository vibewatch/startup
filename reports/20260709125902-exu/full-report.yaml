      - number: '2.4'
        title: Drivers, constraints, and preserved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Growth drivers for EXU's market are institutional allocation growth, stablecoin transaction volume, U.S.
              spot crypto ETF adoption, and stronger EU regulatory clarity via MiCA. Constraints are U.S. regulatory
              ambiguity (SEC v. Binance, SEC v. Coinbase still in litigation), cyber and custody risk, fiduciary
              reluctance, elevated compliance costs, and the reputational overhang from FTX and other 2022-2023
              collapses. Bank prudential standards published by BIS cap direct bank exposure to crypto assets, which
              paradoxically helps exchanges by pushing bank clients to specialist venues but also reduces the pool of
              natural credit and treasury counter-parties. IOSCO's 18 recommendations and the Fed's Financial Stability
              Report both signal that regulator attention will remain high in 2026. Preserved sizing gaps for this
              chapter include: (a) no reconciled dollar-denominated SAM specific to institutional-grade crypto trading;
              (b) no public disclosure of how much of reported exchange volume is wash-trade or self-trade; (c) no
              public data on how much U.S. institutional flow migrates to EU-domiciled venues under MiCA; and (d) no
              EXU-specific pipeline data. These are the diligence asks any investor must resolve.
