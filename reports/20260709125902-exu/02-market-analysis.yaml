slug: exu
runDate: "2026-07-09"
company:
  name: EXU
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    EXU's market is the global centralized cryptocurrency exchange sector, with EXU targeting the institutional and
    prosumer segments. No single public number reconciles a dollar-denominated addressable pool; four independent lenses
    (blockchain addresses, spot volume, exchange count, institutional allocation surveys) each anchor a different sizing
    assumption. Growth drivers (institutional allocation, MiCA, ETF flows) are real but bounded by U.S. regulatory
    ambiguity, custody risk, and post-FTX trust dynamics.
sections:
  - id: section-1
    title: Market boundary and substitutes
    body: >-
      EXU's addressable market is the global centralized cryptocurrency exchange sector — the fee pool that spans retail
      spot, institutional spot, derivatives clearing, custody, and margin-adjacent services. Included spend covers
      trading fees, market-maker rebates, and derivatives clearing revenue; excluded spend covers mining, stablecoin
      issuer float, and pure DeFi protocol fees. Substitutes matter a great deal because they compete for the same
      underlying flow: decentralized exchanges (Uniswap, dYdX, GMX) offer non-custodial execution at competitive spreads
      for retail and long-tail assets, OTC desks (Cumberland, Galaxy, B2C2) take large institutional trades bilaterally
      without touching a public order book, and traditional brokerages (Robinhood, Fidelity, Schwab) increasingly offer
      spot crypto exposure through familiar accounts. Wikipedia's stablecoin coverage confirms that dollar-pegged
      stablecoins are now the primary settlement asset on centralized exchanges, tying exchange growth to stablecoin
      adoption. That means EXU's "institutional-grade crypto trading platform" positioning is not a market of its own;
      it is a segment inside the broader exchange sector that competes on regulatory posture, custody quality, AI-driven
      differentiation, and fee schedule.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM021
      - CM034
    tableRefs:
      - TM001
  - id: section-2
    title: Sizing lenses and evidence-constrained numbers
    body: >-
      No single public source reconciles a dollar-denominated TAM/SAM/SOM for a new institutional-grade crypto exchange.
      Four independent lenses do exist in the public record and are shown in the sizing table: (i) a16z crypto reports
      220 million monthly active blockchain addresses in September 2024, more than 3x the end-of-2023 baseline; (ii) The
      Block's ongoing spot-volume tracker regularly shows trillions of dollars of annual volume across major centralized
      venues; (iii) CoinMarketCap enumerates hundreds of exchanges by trust score and liquidity; (iv) Fidelity Digital
      Assets and PwC surveys estimate institutional allocation and fund AUM. These are not the same measurement and
      cannot be summed. The most defensible construction for EXU's sizing is therefore an evidence-constrained SAM: a
      take-rate applied to U.S. + EU institutional spot volume plus a share of derivatives clearing, held against the
      multi-vendor competitive frame described in the competitors chapter. Chainalysis 2024 reporting reminds every
      underwriter that some reported volume is inflated by illicit or wash-trade activity, so the SAM has to be
      discounted for that as well.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM008
      - CM009
      - CM014
      - CM029
      - CM030
      - CM031
      - CM036
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: section-3
    title: Buyer segmentation and adoption path
    body: >-
      Institutional-grade crypto trading has a well-defined buyer stack: retail active traders (the historical volume
      driver), prosumer API users, family offices, hedge funds and prop shops, and corporate treasuries. EXU's stated
      positioning targets the middle three segments — family offices, hedge funds, and prosumers — where fee sensitivity
      is lower and product differentiation (AI signals, execution quality, cross-margin) matters more than in retail.
      The adoption path is a two-stage funnel: (1) legal/compliance approval based on the platform's regulatory posture
      and audit history, and (2) custody-tech integration into the buyer's middle office. Both stages typically take
      30-90 days and drop 70-85% of the raw pipeline before first pilot volume. Growth signals in Fidelity and PwC
      research confirm the direction of travel — institutional participation is increasing — but the funnel means Year 1
      exchange volume is bounded by pipeline maturity, not headline market size. The buyer map is also affected by ETF
      flow: U.S. spot Bitcoin and Ether ETFs generate custody demand and hedging volume that ends up on the exchange
      side, giving EXU an indirect but real institutional flow driver.
    claimRefs:
      - CM022
      - CM023
      - CM024
      - CM032
      - CM035
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004
  - id: section-4
    title: Drivers, constraints, and preserved sizing gaps
    body: >-
      Growth drivers for EXU's market are institutional allocation growth, stablecoin transaction volume, U.S. spot
      crypto ETF adoption, and stronger EU regulatory clarity via MiCA. Constraints are U.S. regulatory ambiguity (SEC
      v. Binance, SEC v. Coinbase still in litigation), cyber and custody risk, fiduciary reluctance, elevated
      compliance costs, and the reputational overhang from FTX and other 2022-2023 collapses. Bank prudential standards
      published by BIS cap direct bank exposure to crypto assets, which paradoxically helps exchanges by pushing bank
      clients to specialist venues but also reduces the pool of natural credit and treasury counter-parties. IOSCO's 18
      recommendations and the Fed's Financial Stability Report both signal that regulator attention will remain high in
      2026. Preserved sizing gaps for this chapter include: (a) no reconciled dollar-denominated SAM specific to
      institutional-grade crypto trading; (b) no public disclosure of how much of reported exchange volume is wash-trade
      or self-trade; (c) no public data on how much U.S. institutional flow migrates to EU-domiciled venues under MiCA;
      and (d) no EXU-specific pipeline data. These are the diligence asks any investor must resolve.
    claimRefs:
      - CM007
      - CM012
      - CM015
      - CM016
      - CM019
      - CM020
      - CM025
      - CM026
      - CM027
      - CM028
      - CM032
      - CM033
      - CM036
    tableRefs:
      - TM004
tables:
  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Retail spot trading
        - Trading fees on retail accounts (0.1-0.5% typical)
        - Non-crypto brokerage fees
        - Retail user
        - High — this is the primary revenue pool for most exchanges historically.
      - - Institutional spot trading
        - Fee tiers 0.02-0.10% at institutional volumes; maker rebates
        - Custody-only fees, OTC bilateral desk fees
        - Family office, hedge fund, prop trader
        - High — EXU's stated positioning targets this segment.
      - - Derivatives trading
        - Perpetuals and options trading fees, funding rebates
        - Underlying spot execution booked elsewhere
        - Hedge fund, prop trader, retail leverage user
        - Medium — separate license posture; EXU has no public derivatives disclosure.
      - - Custody and staking
        - Custody fees, staking revenue share
        - Retail self-custody
        - Institutional custodian client
        - Medium — margin-accretive adjacency; EXU disclosure limited.
      - - AI-driven trading tools
        - Premium subscription for AI signals, execution helpers
        - Free retail analytics
        - Active trader, quant fund
        - Medium — EXU marketing highlights AI; monetization mechanics private.
    notes: >-
      Boundary intentionally excludes DeFi and non-fee income (float, mining) to focus on centralized-exchange fee pools
      relevant to EXU.
