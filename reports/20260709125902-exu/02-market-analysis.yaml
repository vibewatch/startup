callouts:
  - calloutType: insight
    title: No single public number sizes the institutional exchange market
    body: >-
      Publishers use different denominators (addresses, spot volume, fund AUM, allocation surveys) and different
      wash-trade filters. Any valuation model has to declare which lens it uses and stress the assumption.
    claimRefs:
      - CM004
      - CM005
      - CM029
      - CM036
  - calloutType: strength
    title: Regulator activity is building the market EXU needs
    body: >-
      MiCA in the EU, IOSCO globally, and FinCEN in the U.S. are progressively creating the licensing perimeter that
      lets institutions participate. That perimeter is a moat for well-capitalized new entrants.
    claimRefs:
      - CM017
      - CM019
      - CM020
      - CM026
  - calloutType: risk
    title: The adoption funnel is long and self-selective
    body: >-
      Legal, compliance, and custody-tech integrations typically drop 70-85% of institutional pipeline before first
      pilot; EXU's Year 1 volume will be gated by this funnel regardless of product quality.
    claimRefs:
      - CM022
      - CM032
      - CM033
      - CM035
