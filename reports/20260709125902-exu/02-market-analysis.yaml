  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - Institutional allocation to digital assets
        - positive
        - 2024-2026
        - Grows the SAM and reduces sensitivity to retail cycles
        - Ask EXU for institutional wallet share and named lighthouse customers.
      - - Stablecoin transaction volume growth
        - positive
        - current
        - Increases spot volume and settlement flow through exchanges
        - Determine which stablecoins EXU supports and any float sharing agreements.
      - - U.S. spot Bitcoin/Ether ETF flows
        - positive
        - current
        - Boosts custody demand and derivatives hedging volume
        - Check if EXU is a counterparty to any ETF issuer.
      - - EU MiCA implementation
        - positive
        - 2024-2025
        - Provides a harmonized licensing path in the EU
        - Ask for MiCA license status and expected passporting.
      - - U.S. SEC/CFTC enforcement uncertainty
        - negative
        - ongoing
        - Chills institutional participation and raises compliance costs
        - "Confirm EXU's U.S. licensing posture: state MTLs, BitLicense, MSB."
      - - Cybersecurity and custody incidents
        - negative
        - ongoing
        - Erodes trust and can trigger sudden outflows
        - Ask for custody insurance, penetration test summary, and audit history.
      - - FTX and past-exchange reputational overhang
        - negative
        - ongoing
        - Raises the diligence bar every institutional buyer applies
        - Ask how EXU handles proof-of-reserves and segregation.
      - - Bank prudential limits (BIS)
        - negative
        - ongoing
        - Caps direct bank exposure and pushes flow into shadow rails
        - Ask which banks EXU banks with and any capital advisory constraints.
    notes: >-
      Drivers and constraints must be balanced against EXU-specific licensing posture; sector tailwinds alone do not
      underwrite the valuation.
