callouts:
  - calloutType: risk
    title: Regulatory risk is high-probability and high-severity
    body: >-
      The SEC has an active docket against Binance and Coinbase, the two largest peers. Any U.S.-facing exchange is at
      material risk of similar enforcement.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
  - calloutType: risk
    title: Cyber and custody is the single largest existential risk
    body: >-
      Post-Mt.Gox and post-FTX, one custody incident with customer loss is fatal. This is the single highest-severity
      operational risk category.
    claimRefs:
      - CR005
      - CR006
      - CR017
      - CR018
      - CR035
  - calloutType: recommendation
    title: Set explicit kill criteria in the term sheet
    body: >-
      Kill criteria — regulatory enforcement, custody incident, founder exit, or license lag — should be pre-negotiated
      as unwind or step-in triggers.
    claimRefs:
      - CR031
      - CR036
