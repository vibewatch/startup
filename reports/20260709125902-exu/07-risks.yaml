          detail: Cyber incident, enforcement action, custody breach, or key departure.
          tone: warning
        - id: regulatory
          label: Regulatory response
          detail: Formal inquiry, consent order, or license impact.
          tone: negative
        - id: financial
          label: Financial impact
          detail: Fines, legal costs, cash outflows, banking pressure.
          tone: negative
        - id: reputation
          label: Reputational damage
          detail: Customer withdrawals; institutional counterparty downgrades.
          tone: negative
        - id: operations
          label: Operational containment
          detail: Incident response, comms, controls remediation.
          tone: warning
        - id: recovery
          label: Recovery path
          detail: Attestation, audit, disclosure; regulator dialogue.
          tone: neutral
      edges:
        - from: trigger
          to: regulatory
        - from: trigger
          to: operations
        - from: regulatory
          to: financial
        - from: regulatory
          to: reputation
        - from: operations
          to: reputation
