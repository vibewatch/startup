chapter:
  number: 7
  title: Risks
  summary: >-
    Regulatory and operational risk are the two dominant risk categories for EXU. SEC enforcement against Binance and
    Coinbase, Binance's $4.3B AML settlement, and FTX's collapse form a live sector-adverse frame. Cyber and custody
    risk is the single largest existential category. EXU's mitigation posture is not publicly disclosed on any
    dimension, so kill criteria should be pre-negotiated at term sheet.
sections:
  - id: section-1
    title: Regulatory and legal risk landscape
    body: >-
      Regulatory risk is the single most extensively documented risk category for a crypto exchange. The SEC has active
      litigation against Binance (13 charges filed June 2023) and Coinbase (unregistered exchange complaint filed June
      2023), and continued enforcement actions across 2024. Binance and CEO Changpeng Zhao settled with U.S. authorities
      for $4.3 billion on AML and sanctions charges in November 2023. FinCEN classifies crypto exchanges as MSBs subject
      to BSA CTR/SAR reporting. FATF Travel Rule and VASP guidance shape cross-border AML expectations. The CFTC
      actively regulates crypto derivatives and warns of pervasive retail fraud. In the EU, MiCA and ESMA implementing
      standards establish a comprehensive licensing regime whose transition period ends in the 2024-2025 window. IOSCO's
      18 policy recommendations are the global baseline. On top of federal action, state Attorneys General — most
      notably California and New York — bring parallel civil actions. For an exchange whose licensing posture is not
      publicly disclosed, every one of these regulatory dimensions is a critical or material impact risk with unknown
      mitigation maturity.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR015
      - CR022
      - CR024
      - CR034
    tableRefs:
      - TR001
    figureRefs:
      - FR002
  - id: section-2
    title: Operational, quality, and security risk
    body: >-
      Operational risk for a crypto exchange is dominated by cyber intrusion, MPC/HSM key compromise, exchange outage
      during volatility, insider fraud, reconciliation drift, blockchain reorgs, and DDoS abuse. NIST cybersecurity
      guidance is the baseline institutional buyers expect. Cyber and key-compromise risks are the most severe:
      post-Mt.Gox and post-FTX experience shows that a single custody incident with customer loss is fatal for
      institutional credibility, regardless of technical merit. Chainalysis reporting on illicit exchange flows and
      sanctions exposure reinforces that operational controls have to include blockchain analytics screening. The FBI
      IC3 annual reports document billions of dollars in reported crypto-related crime losses. The SEC has an ongoing
      cybersecurity enforcement history that touches crypto issuers and platforms. Post-quantum cryptography (NIST PQC)
      is a slower-moving risk but real for long-lived cold storage keys. EXU discloses no SOC 2, ISO 27001, penetration
      testing summary, or proof-of-reserves attestation, so every operational risk mitigation is unknown from the public
      record.
    claimRefs:
      - CR006
      - CR013
      - CR017
      - CR018
      - CR020
      - CR021
      - CR025
      - CR026
      - CR035
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: section-3
    title: Partner, people, and financial risk
    body: >-
      Partner dependency risk for EXU concentrates in fiat banking (limited crypto-friendly banks), cloud infrastructure
      (typical single-cloud architecture), MPC/custody vendors (Fireblocks and BitGo dominant), Chainalysis/Elliptic for
      sanctions screening (near duopoly), stablecoin issuers (USDC and USDT), and foundation-model providers for AI
      features. Single-vendor failure is a realistic scenario for any of these. People risk is elevated because EXU's
      founders and executives are not publicly named — Silicon Valley pattern-matching says a Series B unicorn without a
      named leadership team is unusual and warrants a specific data-room read on key-person concentration, retention
      equity, and succession planning. Financial and model risk includes concentrated top-account revenue for a new
      exchange (typically one to three accounts drive Year 1 volume), thin market-maker rebate margins that squeeze
      gross margin at institutional scale, and reliance on stablecoin issuer solvency for settlement. BIS prudential
      standards indirectly raise the cost of banking partners. FTC consumer warnings and Fed FSR crypto references keep
      macro-regulatory attention high.
    claimRefs:
      - CR014
      - CR015
      - CR016
      - CR019
      - CR023
      - CR027
      - CR028
      - CR029
      - CR033
    tableRefs:
      - TR003
      - TR004
    figureRefs:
      - FR003
  - id: section-4
    title: Mitigations, monitoring, and kill criteria
    body: >-
      Mitigations for the risk register are largely industry standard: multi-jurisdiction license portfolio and outside
      counsel retention (regulatory), MPC + cold storage + insurance + SOC 2 + continuous penetration testing
      (cyber/custody), real-time proof of reserves + transparency reports (reputational), named leadership + retention
      equity + succession plans (people), diversified fee mix + adjacencies + multi-bank relationships (financial), and
      multi-cloud and multi-custody architecture (partner). Monitoring indicators that institutional buyers actually
      track include Chainalysis screening results, S&P counterparty rating actions, DefiLlama outflow spikes as a
      leading indicator of trust erosion, and CoinDesk-style enforcement news. Kill criteria that should be
      pre-negotiated at term sheet include: any material regulatory enforcement action against EXU, any custody incident
      with customer loss, founder or CTO exit within 12 months of investment, and failure to secure MiCA passporting by
      end of 2026. Each kill criterion maps to a specific monitoring indicator and a specific mitigation path, and each
      should be tested in a data-room deep dive before writing a check.
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR033
      - CR035
      - CR036
    tableRefs:
      - TR005
