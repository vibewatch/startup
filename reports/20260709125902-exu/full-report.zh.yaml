  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              EXU
              的可触达市场是全球中心化加密货币交易所行业——一个覆盖零售现货、机构现货、衍生品清算、托管和保证金相邻服务的手续费池。纳入支出的项目包括交易费、做市商返佣和衍生品清算收入；排除支出包括挖矿、稳定币发行方浮存收益和纯
              DeFi 协议费用。替代方案非常重要，因为它们争夺同一底层订单流：去中心化交易所（Uniswap、dYdX、GMX）为零售和长尾资产提供非托管执行，价差具备竞争力；OTC
              柜台（Cumberland、Galaxy、B2C2）用双边方式承接大型机构交易，不触碰公开订单簿；传统券商（Robinhood、Fidelity、Schwab）也越来越多地通过熟悉账户提供现货加密货币敞口。Wikipedia
              的稳定币覆盖确认，锚定美元的稳定币现在是中心化交易所的主要结算资产，交易所增长也就与稳定币采用绑定。因此，EXU
              的「机构级加密货币交易平台」定位不是一个独立市场，而是更大交易所行业里的一个细分市场；竞争维度是监管姿态、托管质量、AI 驱动差异化和费率表。
