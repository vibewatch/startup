  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代方案
        blocks:
          - type: paragraph
            body: >-
              即便按金融科技标准看，EXU 面临的竞争格局也异常拥挤。现有玩家栈顶包括 Coinbase（美国上市公司）、Binance（按交易量最大，仍在消化 $4.3B 美国和解）、Kraken（美国前五交易场所）、OKX
              和 Bybit（全球衍生品龙头）、Gemini 和 Bitstamp（受监管的老牌场所），以及 Crypto.com（面向消费者品牌）。替代方案和直接同行同样重要：Uniswap、dYdX
              等去中心化交易所承接越来越多长尾现货交易量；Cumberland、Galaxy、B2C2 等 OTC 柜台用双边方式吸收最大的机构交易，不触碰公开订单簿；Robinhood、Fidelity、Schwab
              等传统券商也越来越多地通过熟悉账户提供现货加密货币敞口。Fireblocks 和其他托管基础设施供应商既不是同行也不是替代者，但它们代表每家新交易所都必须回答的自建还是外采问题。EXU
              的公开材料没有披露它使用这些技术栈中的哪一个，因此竞争框架只能推断，不能确认。
