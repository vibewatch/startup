            body: >-
              监管风险是加密货币交易所最有公开记录可查的风险类别。SEC 对 Binance 有正在进行的诉讼（2023 年 6 月提出 13 项指控），也对 Coinbase 提出未注册交易所投诉（2023 年 6
              月），并在 2024 年继续推进执法行动。Binance 及 CEO Changpeng Zhao 于 2023 年 11 月就 AML 和制裁指控与美国当局达成 $4.3 billion 和解。FinCEN
              将加密货币交易所归类为 MSB，受 BSA CTR/SAR 报告约束。FATF Travel Rule 和 VASP 指引塑造跨境 AML 预期。CFTC
              积极监管加密货币衍生品，并警告零售欺诈普遍存在。欧盟方面，MiCA 和 ESMA 执行标准建立了全面牌照制度，其过渡期在 2024–2025 年窗口结束。IOSCO 的 18
              项政策建议是全球基线。除联邦行动外，州检察长——尤其是 California 和 New York——也会发起平行民事诉讼。EXU 牌照姿态未公开披露，上述每个监管维度都是关键或重大影响风险，缓释成熟度未知。
