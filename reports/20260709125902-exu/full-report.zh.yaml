      - number: '3.3'
        title: 切换成本、多平台使用与分发能力
        blocks:
          - type: paragraph
            body: >-
              交易所市场的切换成本在不同客群之间不对称。零售用户的主要切换成本是法币出入金通道、重新 KYC 和习惯性 UX；这些成本真实存在，但低到足以让零售交易者经常同时维护 2–3
              个场所账户。机构用户的切换成本高得多：法律和合规批准、托管技术集成、中台报告都需要每个场所 30–90
              天。这为现有机构关系创造了持久惯性，也为第一个获某家机构批准的新场所构成护城河，因为同一套集成工作不必重复做。零售和机构两端都会多平台使用，意味着 EXU 不必成为唯一场所，但必须进入目标买方批准的前 2–3
              家。行业分发能力来自品牌信任（Coinbase、Gemini）、稳定币发行方绑定（Circle/USDC 横跨多个场所）、传统券商分发合作（Robinhood 收购 Bitstamp、Fidelity
              Crypto），以及社交媒体和推荐计划（Binance、Bybit）。EXU 的分发杠杆未公开披露，是尽调问题。
