figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: EXU 公开记录很薄；它又处在一个已有大量先例的行业时间线中，执法、破产和监管事件密集。
    data:
      items:
        - date: 2022-11
          label: FTX 破产
          detail: 定义行业的反向事件，任何新加密交易所都必须把它纳入尽调。
          tone: negative
        - date: 2023-06
          label: SEC 诉 Binance 与 SEC 诉 Coinbase
          detail: 美国针对最大同业的两起进行中执法行动。
          tone: warning
        - date: 2023-06
          label: 欧盟发布 MiCA
          detail: 面向加密资产服务提供商的欧盟综合牌照制度。
          tone: neutral
        - date: 2023-11
          label: IOSCO 18 项建议
          detail: 加密交易平台的全球监管基线。
          tone: neutral
        - date: '2024'
          label: Granite Asia 更名
          detail: GGV Capital 亚洲部门变为 Granite Asia；这是被点名的 EXU 投资人身份。
          tone: neutral
        - date: '2025'
          label: EXU 成立
          detail: 新的加密交易平台，尚无既往运营记录。
          tone: positive
        - date: '2025'
          label: EXU 以 $1.2B 估值完成 $120M Series B
          detail: Sequoia、Goldman Sachs 和 Granite Asia 参与的 Series B 轮。
          tone: positive
        - date: 2026-01
          label: TechCrunch 独角兽名单
          detail: 首个被广泛索引的公开引用，锚定当前尽调视角。
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO009
      - CO012
      - CO013
      - CO014
      - CO026
      - CO027
