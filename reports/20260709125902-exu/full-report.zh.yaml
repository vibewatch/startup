      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              EXU 规模的私募加密交易所能否退出，取决于三项前提：监管姿态（已拿到并披露牌照）、符合机构标准的经审计财务报表，以及具名机构客户证明。截至当前日期，EXU
              没有公开证明其中任何一项。会迫使建议从“继续研究（research-more）”下调至“回避（avoid）”的投资逻辑破裂触发点包括：EXU 遭遇任何重大监管执法；任何确认客户损失超过 $10M
              的托管事件；创始人或 CTO 在投资后 12 个月内离职；2026 年底前未取得 MiCA 护照化资格；一周内储备流出超过 25%（可通过 DefiLlama 观察）；以及任何不利的 Chainalysis
              筛查结果。最终尽调问题要聚焦：过去 24 个月按月列示的收入和抽佣率，用来锚定收入模型；客户名单及 top-10 集中度，用来暴露集中风险；完整牌照清单（US
              MTL、MSB、MiCA、其他），用来判断地理收入上限；托管模型图和保险保单摘要；SOC 2 Type II
              鉴证报告；完全稀释股权结构表及优先股堆叠；包含里程碑和人员计划的路线图；以及经审计财务报表，若审计未完成则提供中期未审计报表。每一项都对应具体估值输入，也是从“继续研究（research-more）”转向“买入（buy）”或“回避（avoid）”判断的前提。
