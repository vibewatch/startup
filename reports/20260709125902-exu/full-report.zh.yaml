        title: 收入模型与收入流组合
        blocks:
          - type: paragraph
            body: >-
              中心化加密货币交易所靠交易费（零售现货、机构现货和衍生品）、托管费、质押收入分成、上币费和市场数据订阅变现；越来越多平台也开始用 AI 信号或高级套餐订阅变现。EXU 的公开材料提到 AI
              信号功能，但没有披露费率表、VIP 分层或实际收入流组合。参照同行基准——Coinbase 公开 10-K、Binance 分层费率表、Kraken 低档 0.16%/0.26% 和高档 0.00%/0.10%
              费率、Bitstamp 低档 0.4%/0.4%——机构交易量的行业混合抽成率落在 5–15 个基点之间，零售抽成率高出 3–4 倍，衍生品抽成率则更低。Coinbase 10-K
              还显示，托管和质押收入比交易收入更稳定，因此带有机构相邻业务组合的交易所，通常收入波动低于纯零售场所。如果 EXU 的真实收入组合能证明这一点，其机构定位就符合该模式。
