              除资本外，通常用于收尾公司概览的封面指标——收入、年化收入、月活用户、交易量、员工数和办公室地点——EXU 均未公开披露。第三方新闻聚合站（isStories.com 等）引用过据称来自公司的营销表述，提到约
              100 万用户和 $280 million 日交易量，但这些数字无法作为一手文本抓取，也无法对照任何交易所交易量追踪器（CoinMarketCap、The Block、DefiLlama）验证。EXU
              可验证的公开时间线很短：2025 年成立，2025 年完成 Series B，进入 TechCrunch 2026 年 1 月独角兽盘点。这个时间线嵌在一个更长的行业时间线中，任何尽调都必须纳入：2022 年
              11 月 FTX 破产，2023 年 6 月 SEC 对 Binance 和 Coinbase 采取行动，2023 年 EU MiCA 监管发布，2023 年 11 月 IOSCO 发布 18 项建议框架，以及
