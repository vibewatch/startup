        title: 架构、依赖与工作流
        blocks:
          - type: paragraph
            body: >-
              机构级交易所的参考架构由几部分组成：云基础设施（AWS 或 GCP 多区域）、低延迟撮合引擎（C++ 或 Rust 内存订单簿）、交易 API（REST + WebSocket + FIX）、托管栈（HSM +
              MPC + 冷多签）、区块链节点（Bitcoin、Ethereum、Solana 等）、KYC/AML 管线（Persona、Onfido、Chainalysis、Elliptic），以及基于基础模型 API 的
              AI 信号服务。AWS Blockchain 和 Google Cloud 都发布了面向合作伙伴的文档来支撑这一技术栈，Fireblocks 则提供被广泛使用的 MPC 托管选项。NIST 网络安全指引和
              NIST 后量子密码标准，是机构买方会用来对标的基础控制；Ledger Academy 提供面向开发者的安全教育材料，也被交易所工程团队广泛引用。客户入驻工作流——首次会议、法律 /
              合规评审、托管技术集成、试点交易、放量——有 30–60 天、再 30–60 天、再 30 天的关口，直接转化为部署复杂度。EXU 的具体供应商、延迟目标和区块链覆盖均属私有信息。
