    approximationNotes: null
    claimRefs:
      - CU006
      - CU013
      - CU014
      - CU015
      - CU032
      - CU034
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 用于测算第一年收入的机构采用漏斗流失咨询基准。
    data:
      items:
        - label: 管线（初次推介）
          value: 100
          tone: neutral
        - label: 合规 / 法务通过
          value: 45
          tone: warning
        - label: 托管技术集成完成
          value: 25
          tone: warning
        - label: 试点订单完成
          value: 12
          tone: neutral
        - label: 全量交易流
          value: 5
          tone: positive
    approximationNotes: 百分比是咨询基准；EXU 特定管线漏斗未披露。
    claimRefs:
      - CU032
      - CU033
      - CU034
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: 从公开披露看，EXU 的客户证据表面与主要同业相比如何。
    data:
      columns:
        - 具名案例研究
        - 机构账户数量
        - 交易量披露
      rows:
        - label: Coinbase
          values:
            - label: 是
              tone: positive
            - label: 是
              tone: positive
            - label: 是（10-K）
              tone: positive
        - label: Binance
          values:
            - label: 有限
              tone: neutral
            - label: 有限
              tone: neutral
            - label: 部分
              tone: neutral
        - label: Kraken
          values:
            - label: 部分
              tone: neutral
            - label: 有限
              tone: neutral
            - label: 部分
              tone: neutral
        - label: EXU
          values:
            - label: none
              tone: warning
            - label: none
              tone: warning
            - label: none
              tone: warning
    approximationNotes: null
    claimRefs:
      - CU007
      - CU028
      - CU035
      - CU039
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 方向性的同业留存队列，用来给 EXU 投资测算提供参照。
    data:
      columns:
        - 第 0 月
        - 第 3 月
        - 第 6 月
        - 第 12 月
      rows:
        - label: 管理良好的散户交易所队列
          values:
            - 100
            - 65
            - 45
            - 32
        - label: 机构客户队列
          values:
            - 100
            - 92
            - 88
            - 82
    approximationNotes: 数值是方向性咨询基准；EXU 特定留存未披露。
    claimRefs:
      - CU016
      - CU029
      - CU032
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: EXU 最高优先级风险类别的可能性 × 影响热力图。
    data:
      columns:
        - 低影响
        - 重大影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - label: 区块链重组
              tone: neutral
            - label: 内部人欺诈（有控制措施）
              tone: neutral
            - label: 主权级银行断供
              tone: warning
        - label: 中等可能性
          values:
            - label: DDoS 滥用
              tone: neutral
            - label: CFTC 衍生品行动
              tone: warning
            - label: SEC 执法
              tone: negative
        - label: 高可能性
          values:
            - label: 后量子滞后
              tone: neutral
            - label: 波动期交易所宕机
              tone: warning
            - label: 网络入侵
              tone: negative
    approximationNotes: 位置为定性判断；具体概率需要管理层数据。
    claimRefs:
      - CR001
      - CR009
      - CR017
      - CR020
      - CR026
      - CR035
  - id: FR002
    title: 风险传导图
    type: flow
    layout: wide
    summary: 单一触发事件如何传导到监管、运营、财务和声誉域。
    data:
      nodes:
        - id: trigger
          label: 触发事件
          detail: 网络事件、执法行动、托管失守或关键人员离职。
          tone: warning
        - id: regulatory
          label: 监管回应
          detail: 正式问询、同意令或牌照影响。
          tone: negative
        - id: financial
          label: 财务影响
          detail: 罚款、法律成本、现金流出、银行压力。
          tone: negative
        - id: reputation
          label: 声誉受损
          detail: 客户提款；机构交易对手下调评级。
          tone: negative
        - id: operations
          label: 运营处置
          detail: 事件响应、沟通、控制整改。
          tone: warning
        - id: recovery
          label: 恢复路径
          detail: 鉴证、审计、披露；与监管对话。
          tone: neutral
      edges:
        - from: trigger
          to: regulatory
        - from: trigger
          to: operations
        - from: regulatory
          to: financial
        - from: regulatory
          to: reputation
        - from: operations
          to: reputation
        - from: reputation
          to: financial
        - from: operations
          to: recovery
    approximationNotes: null
    claimRefs:
      - CR001
      - CR005
      - CR017
      - CR021
      - CR032
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 可能级联成 EXU 业务关键故障的外部依赖。
    data:
      nodes:
        - id: bank
          label: 主要法币银行
          detail: 电汇 / ACH / SEPA 通道。
          tone: warning
        - id: cloud
          label: 云服务商
          detail: AWS / GCP / Azure 主区域。
          tone: neutral
        - id: mpc
          label: MPC / 托管供应商
          detail: Fireblocks、BitGo、自建。
          tone: warning
        - id: analytics
          label: Chainalysis / Elliptic
          detail: 制裁筛查和分析。
          tone: warning
        - id: stablecoin
          label: 稳定币发行方
          detail: Circle USDC、Tether USDT。
          tone: neutral
        - id: exu
          label: EXU 平台
          detail: 运营依赖上述全部环节。
          tone: neutral
      edges:
        - from: bank
          to: exu
        - from: cloud
          to: exu
        - from: mpc
          to: exu
        - from: analytics
          to: exu
        - from: stablecoin
          to: exu
    approximationNotes: null
    claimRefs:
      - CR018
      - CR019
      - CR027
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资人身份、私有可比公司和公开可比公司如何合在一起，得出“继续研究”结论和高风险评级。
    data:
      nodes:
        - id: identity
          label: 投资人身份
          detail: Sequoia + Goldman + Granite Asia 已具名。
          tone: positive
        - id: private
          label: 私有可比公司
          detail: PitchBook 2025 显示 Series B 中腰部拥挤。
          tone: neutral
        - id: public
          label: 公开可比公司（COIN）
          detail: 多周期股权价值，倍数区间很宽。
          tone: neutral
        - id: gaps
          label: 经营指标缺口
          detail: 收入、用户、交易量、牌照均未公开。
          tone: warning
        - id: scenario
          label: 情景区间
          detail: 基准 $600-800M；乐观 $2.8-3.2B；悲观 $200-400M。
          tone: neutral
        - id: rec
          label: 建议
          detail: 继续研究，风险评级高。
          tone: warning
      edges:
        - from: identity
          to: rec
        - from: private
          to: scenario
        - from: public
          to: scenario
        - from: scenario
          to: rec
        - from: gaps
          to: rec
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV029
      - CV030
      - CV031
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 EV 倍数固定为 7x 时，按抽成率和成交量假设测算的 EV 敏感性。
    data:
      items:
        - label: 悲观成交量 × 10 bps
          value: 250
          tone: warning
        - label: 基准成交量 × 15 bps
          value: 700
          tone: neutral
        - label: 乐观成交量 × 20 bps
          value: 3000
          tone: positive
        - label: Coinbase 同业历史低谷 EV
          value: 8000
          tone: neutral
        - label: Coinbase 同业历史高峰 EV
          value: 86000
          tone: positive
    approximationNotes: 数值为示意性百万美元企业价值；倍数固定为 7x；与 COIN 的比较使用市值。
    claimRefs:
      - CV017
      - CV029
      - CV030
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准、乐观情景下的隐含 EV 区间，单位为百万美元。
    data:
      items:
        - label: 悲观情景
          low: 200
          high: 400
          unit: USD million EV
          tone: warning
        - label: 基准情景
          low: 600
          high: 800
          unit: USD million EV
          tone: neutral
        - label: 乐观情景
          low: 2800
          high: 3200
          unit: USD million EV
          tone: positive
    approximationNotes: EV 区间仅作示意；没有私有披露前，不要据此决定支票规模。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV038
  - id: FV004
    title: 投资 KPIs
    type: kpi
    layout: standard
