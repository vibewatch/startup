      - number: '8.2'
        title: 入场纪律、优先股堆叠和公开价格支撑
        blocks:
          - type: paragraph
            body: >-
              EXU Series B 投资的入场纪律比通常更重要，因为当前标记估值来自财团定价，而不是任何可独立核验的经营指标。Sequoia 领投的标准 Series B 优先股条款通常包括 1x
              非参与式清算优先权和按比例跟投权利，但 EXU 的具体条款未公开。公开价格支撑要回答的是：$1.2B 标记估值能否经得起可比交易检验。PitchBook 2025 年加密 VC 报告、少量可比私募轮次，以及
              Coinbase 的公开股权价值共同提供锚点。Coinbase 的 SEC 10-K 文件和 SEC EDGAR 文件页给出最深的可比财务细节；Yahoo Finance、MarketWatch 和
              Bloomberg 都发布 COIN 报价，因此公开价格有多源数据可查。按收入倍数看，当前标记估值隐含的经营指标，要显著好于任何同阶段私募交易所在 Series B
              且无公开披露时已经证明的水平——这就是“昂贵”估值立场的依据。按 AUM 倍数看，用 DefiLlama 的 CEX 储备追踪器做交叉校验，私募市场基准也相近。前几轮（Series B 前
              $40M）带来的稀释和优先股悬挂仍是未知数，应在 资料室阅读中打分。
