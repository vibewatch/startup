            body: SEC 对 Binance 和 Coinbase 两大同业都有在办案件。任何面向美国业务的交易所，都面临类似执法的实质风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 网络安全和托管是最大的生死线风险
            body: 经历 Mt.Gox 和 FTX 后，只要发生一次造成客户损失的托管事故，就足以致命。这是严重程度最高的运营风险类别。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR017
              - CR018
              - CR035
          - type: callout
            title: 在投资条款清单中写清终止条件
            body: 终止条件——监管执法、托管事故、创始人离职或牌照进度落后——应预先谈妥，作为交易解除或投资人介入的触发条件。
            calloutType: recommendation
            claimRefs:
              - CR031
