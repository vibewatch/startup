      - number: '1.2'
        title: 创始人、管理层与治理缺口
        blocks:
          - type: paragraph
            body: >-
              本轮研究抓取到的公开来源，没有列出任何 EXU 创始人、高管或董事会成员。Series B 阶段独角兽出现这种信息空白并不常见：可比加密货币交易所 Coinbase、Kraken、Bitstamp、Gemini
              都有可公开识别的创始人 CEO 和具名高管团队。按硅谷模式匹配，这种规模的 Series B 通常至少会有一位具备加密货币或交易履历的创始人 CEO、一位有分布式系统或交易系统背景的
              CTO，以及在当前监管环境下必需的首席合规官。公开来源无法验证这些信息。已披露领投方 Sequoia Capital 有充分公开记录，The Goldman Sachs Group 的战略背书和亚太关系锚点
              Granite Asia（GGV Capital
              继任者）也可确认，因此投资方身份是唯一具备高置信度公开覆盖的领导力维度。其他治理问题——董事会构成、保护性条款、董事长独立性、审计或风险委员会是否存在、关键人员保险——在投资判断前都必须进数据室核查。
