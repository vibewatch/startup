      - number: '6.3'
        title: 留存驱动与客户经济性
        blocks:
          - type: paragraph
            body: >-
              该细分市场中，机构客户留存由托管信任、费率竞争力、执行质量、产品广度和客户经理支持驱动；EY 和 Morgan Stanley 研究都强调，机构决策更看重信任和审计轨迹，而不是单纯看费用。零售客户留存则由 UX
              简洁度、费率竞争力、品牌信任和稳定币可用性驱动。咨询基准显示，运营良好的零售交易所能在 12 个月留住一个月度获客批次的 30–50%，而机构批次因入驻成本高，年度留存通常高于 80%。FTC 消费者警示和
              FTX 崩盘都抬高了零售客户适用于任何新场所的信任门槛；机构买方则把 FTX 当作对手方尽调纪律的参照案例。IOSCO 客户保护建议、FATF Travel Rule 要求和 FinCEN MSB
              义务都会出现在入驻 UX 中，成为平台必须尽量降低、但不能违反义务的摩擦。IMF 跨境政策工作和 Fed FSR 对客户敞口的讨论，共同补足 EXU 留存必须建立其上的宏观框架。
