      - number: '2.2'
        title: 市场规模口径与受证据约束的数字
        blocks:
          - type: paragraph
            body: >-
              没有单一公开来源能为一家新的机构级加密货币交易所调和出以美元计价的 TAM/SAM/SOM。公开记录中有四个独立观察口径，并列在市场规模表中：（i）a16z crypto 报告称，2024 年 9
              月月活跃区块链地址为 2.2 亿个，是 2023 年底基线的 3 倍以上；（ii）The Block 持续追踪的现货交易量经常显示，主要中心化场所年交易额达数万亿美元；（iii）CoinMarketCap
              按信任评分和流动性列出数百家交易所；（iv）Fidelity Digital Assets 和 PwC 调研估算机构配置与基金 AUM。这些口径并不衡量同一件事，不能相加。因此，EXU
              最可辩护的规模测算应构建一个受证据约束的 SAM：对美国 + 欧盟机构现货交易量套用抽成率，再加上衍生品清算份额，并与竞争对手章节描述的多供应商竞争框架相互校验。Chainalysis 2024
              年报告也提醒每个投资判断者，部分报告交易量会被非法活动或刷量交易抬高，因此 SAM 还要相应打折。
