              EXU 的公开牵引力极少：没有收入数字，没有年化收入，没有月活用户，没有被 CoinMarketCap、The Block 或 DefiLlama 追踪的交易量。公开记录最多只能支持方向性收入模型：按 15
              个基点的混合抽成率，$1 billion 月交易量意味着约 $15–20 million 年收入；$5 billion 意味着 $75–100 million；$15 billion 意味着 $225–300
              million。没有一个区间可以确认，而且每个区间都取决于真实的零售 / 机构 / 衍生品组合。Wikipedia 的 Coinbase
              条目记录了交易所收入对加密货币价格周期的敏感度，因此任何点估计都必须穿过悲观情景压力测试：假设加密寒冬中收入下滑 40–60%，这也正是 Coinbase 10-K 历史呈现的情况。Bloomberg 和
              MarketWatch 的 COIN 报价，是直接交易所可比公司的持续公开标记。
