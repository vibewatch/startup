      - number: '3.4'
        title: 护城河韧性、反向证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              一家新的机构级加密货币交易所，护城河韧性可能立在三根柱子上：（i）一线投资方信任；（ii）稳健的监管牌照姿态；（iii）基于专有订单流数据的 AI 或执行功能。凭借 Sequoia、Goldman 和
              Granite Asia 组成的投资方组合，EXU 拥有（i）。由于 EXU 未披露牌照姿态，（ii）未知。（iii）最弱——AI 交易功能正在被第三方 API 快速商品化；除非 EXU 的 AI
              吃到专有订单簿深度或执行结果数据，否则它只是营销外壳，不是护城河。反向竞争证据——SEC 对 Binance 和 Coinbase 的行动、Binance 2023 年 11 月 $4.3B 和解、FTX
              崩盘——共同意味着投资者会用高于其他金融科技类别的风险溢价来评估加密货币交易所；任何新进入者只有能可信证明合规姿态显著更好，才能受益于这种转变。替代风险最高的来源，是现有玩家向 AI
              驱动的准专业用户工具延展（Coinbase Advanced、Kraken Pro）、传统券商带着既有用户基础进入加密货币，以及离岸场所更快推出产品功能。
