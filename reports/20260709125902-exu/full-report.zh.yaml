  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块
        blocks:
          - type: paragraph
            body: >-
              EXU 被公开描述为机构级加密货币交易平台，提供 AI
              驱动的交易信号和风险管理功能。由于公司网站在抓取期间无响应，产品定义只能从同行模板和少量外部引用拼出。这样定位的平台，合理推断的模块地图包括：撮合引擎、现货交易 UI + API（REST + WebSocket
              + FIX）、在获牌照前提下的衍生品交易、基于 MPC 的托管与冷存储备份、KYC/AML 管线、区块链分析集成、市场数据流和 AI 信号服务。Coinbase Institutional
              发布了相当的产品覆盖范围，因此即便 EXU 覆盖不清楚，同行基准也很明确。每个模块都有机构买方会审查的特定信任依赖，包括撮合引擎上的 SOC 2 控制、托管上的 MPC 运营纪律，以及 AML 管线上的
              Chainalysis 或 Elliptic 集成。
