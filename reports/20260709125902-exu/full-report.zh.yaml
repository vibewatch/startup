            body: >-
              EXU 的核心资本事实在 TechCrunch 报道及其底层 PitchBook 数据流中保持一致：2025 年完成 $120 million Series B 轮，投后估值 $1.2
              billion，累计融资达到 $160 million。本轮已披露参与方为 Sequoia Capital、The Goldman Sachs Group 和 Granite
              Asia。公开来源没有披露早期融资历史，也就无法解释 $160 million 总额中其余 $40 million 的来源——本次抓取的来源中未索引到种子轮或 Series A
              新闻稿。公开来源也没有披露任何老股交易、可转债或 SAFE 遗留，或债务 / 信贷额度；一家累计股权融资约 $160 million 的 Series B
              加密货币交易所通常不需要债务，但机构托管或法币通道合作可能需要担保结构，而这些只会出现在数据室。相比 Coinbase 上市前资本结构和 Kraken 多轮融资历史，EXU
              的公开资本画像显得紧凑、干净；投资判断的问题在于，私有股权结构表是否真的匹配这一图景。
