      - number: '5.4'
        title: 信任、安全、网络安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任控制决定机构级交易所能否赢得买方信心，而 EXU 的信任控制完全不公开。标准机构预期包括 SOC 2 Type II、ISO 27001、年度或持续节奏的独立渗透测试、冷存储资产托管保险、配备具名客户经理的
              24/7 交易台支持，以及 FTX 之后的实时储备证明。FATF Travel Rule 合规、MiCA 下 ESMA 执行标准和 IOSCO
              建议，都会转化成平台侧具体集成；这些集成增加运营成本，但一旦落地也会成为护城河。区块链分析集成（Chainalysis、Elliptic）实际上已是制裁和非法资金流筛查标准。Hexatrust
              安全供应商生态代表受监管金融科技通常会集成的 SIEM/SOAR/IAM/DLP 层。Fidelity Digital Assets 研究进一步强调，机构买方在这些维度上的要求都很高。EXU
              没有公开披露任何这些控制，因此信任控制披露是最重要的单一数据室问题。
