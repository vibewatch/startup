  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑和建议
        blocks:
          - type: paragraph
            body: >-
              EXU 的投资逻辑立在四根柱子上：一线投资人身份（Sequoia、Goldman Sachs、Granite Asia）、AI 驱动的产品差异化、MiCA 牌照可能打开 EU
              市场，以及机构资金流增长带来的需求侧顺风。反向逻辑同样清楚：投资人身份不能替代经营指标；借助第三方基础模型 API，AI 功能并不难做，若没有自有数据也难以防守；EXU 的 MiCA 牌照状态未知；FTX
              之后资金飞向质量更高的平台，往往会先利好公开受监管的在位者（Coinbase
              Institutional、Kraken），再轮到新进入者。鉴于收入、抽佣率、用户、交易量、牌照状态、留存、烧钱速度等所有经营指标均未公开，且检索时公司网站无法访问，本报告建议为“继续研究（research-more）”：信心低、风险评级高、估值立场为“昂贵”。TechCrunch
              的叙事和 PitchBook 的数据都锚定 $1.2B 估值，但两者都没有确认经营指标；基准情景模型显示企业价值（EV）约 $600-800M，低于当前标记估值。Coinbase 的股权价值经历多个周期，从峰值
              $86B 跌到低于 $10B，也提醒任何私募买家：加密交易所估值倍数高度受周期牵引。
