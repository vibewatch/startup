      - number: '2.4'
        title: 增长驱动、约束与保留的规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              EXU 所在市场的增长驱动来自机构配置增长、稳定币交易量、美国现货加密 ETF 采用，以及 MiCA 带来的欧盟监管清晰度提升。约束来自美国监管不确定性（SEC 诉 Binance、SEC 诉 Coinbase
              仍在诉讼中）、网络与托管风险、受托责任顾虑、高企的合规成本，以及 FTX 和其他 2022–2023 年崩盘事件留下的声誉包袱。BIS
              发布的银行审慎标准限制银行直接持有加密资产，这一机制反而帮助交易所，因为银行客户会被推向专业场所；但它也缩小了自然信贷和财资对手方池。IOSCO 的 18 项建议和 Fed 的 Financial
              Stability Report 都释放同一信号：2026 年监管关注度仍会很高。本章保留的规模测算缺口包括：（a）没有针对机构级加密货币交易、以美元计价且经过调和的
              SAM；（b）没有公开披露报告交易量中有多少来自刷量或自成交；（c）没有公开数据说明 MiCA 下有多少美国机构订单流迁移到欧盟注册场所；（d）没有 EXU 专属管线数据。这些都是任何投资者必须解决的尽调问题。
