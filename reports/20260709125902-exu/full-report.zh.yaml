      - number: '8.3'
        title: 可比公司组和情景框架
        blocks:
          - type: paragraph
            body: >-
              可比组刻意混合使用，以便从多组镜头看问题：Coinbase 是公开市场基准，有 SEC 10-K 披露，市值经历多周期，当前约 $60-90B，加密寒冬时跌到低于 $10B；Kraken 是有多轮融资历史且传出
              IPO 路径的私募可比；Binance 是不透明的私有规模参照，也说明即使是市场顶部的私募估值也很难标记；Gemini 是监管姿态较强的私募同业，此前披露过约 $7B 的二级交易轮；Bitstamp 是 M&A
              可比，Robinhood 以约 $200M 收购；OKX 是大型但不透明的全球私募同业。Messari 2024 年 Q4 行业报告和 Galaxy Research 提供外部前景框架。CFA Institute
              的方法论研究和 Aswath Damodaran 的公开估值研究共同锚定情景建模框架。乐观 / 基准 / 悲观情景表给出示意 EV 区间：悲观为 $200-400M，类似 2022-2023
              年加密寒冬回撤并伴随抽佣率 压缩；基准为 $600-800M，假设月交易量 $5B、综合抽佣率 15 bps；乐观为 $2.8-3.2B，假设月交易量 $15B、综合抽佣率 20
              bps、牌照一次性打通并拿下机构客户后按 8x 收入倍数定价。每个区间误差带都很宽，在私有数据可得之前仅供示意。
