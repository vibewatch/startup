      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              加密货币交易所的运营风险主要由网络入侵、MPC/HSM 密钥泄露、波动期交易所宕机、内部人欺诈、对账漂移、区块链重组和 DDoS 滥用构成。NIST
              网络安全指引是机构买方预期的基线。网络与密钥泄露风险最严重：Mt.Gox 和 FTX 之后的经验表明，只要发生一次造成客户损失的托管事件，无论技术多好，机构可信度都会归零。Chainalysis
              关于非法交易所资金流和制裁暴露的报告进一步说明，运营控制必须纳入区块链分析筛查。FBI IC3 年报记录了数十亿美元报告中的加密货币相关犯罪损失。SEC
              对加密货币发行方和平台也有持续的网络安全执法历史。后量子密码（NIST PQC）推进较慢，但对长期冷存储密钥是真实风险。EXU 没有披露 SOC 2、ISO
              27001、渗透测试摘要或储备证明鉴证，因此公开记录无法判断任何运营风险缓释措施。
