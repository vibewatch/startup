      - number: '4.2'
        title: GTM 动作、成本结构与单位经济基准
        blocks:
          - type: paragraph
            body: >-
              EXU 的 GTM 动作未公开披露，因此分析依赖公开基准。同行 10-K 和分析师工作显示，零售用户 CAC 为 $50–$200，回本周期 6–18 个月；机构账户年贡献毛利为
              $50k–$500k，取决于交易量分层。合规机构交易所的成本结构主要由几项吃掉：工程（撮合引擎、托管栈、AI 功能）、合规和牌照（MiCA、美国州级 MTLs、MSB）、审计和报告（按 EY 和 PwC 指引对齐
              BIS 审慎会计）、银行通道关系（Fed FSR 和 BIS 处理方式）以及区块链结算。毛利驱动项包括抽成率、做市商返佣吸收、区块链结算成本和法币通道成本；机构抽成率规模化后可能把毛利率从约 85% 压到约
              50%。Chainalysis 关于非法资金流的报告进一步提醒，报告收入质量必须对执法暴露交易量打折。Grant Thornton 的税务说明也提示，司法辖区决定报告收入与入账收入是否一致，这也是 EXU
              注册地必须核查的原因。
