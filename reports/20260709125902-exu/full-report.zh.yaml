              的真实烧钱速度、资金跑道或债务结构。下一轮融资触发点很可能由牌照里程碑和机构客户赢单共同构成；公开没有路线图。交易所营运资本包括隔离的客户法币余额、热 /
              冷钱包浮动余额和结算缓冲；没有数据室时，这些都不透明。BIS 审慎制度显著抬高了任何接入银行的法币通道成本，因此 EXU 的银行合作方名单很重要。财务结论是：资本充足性很可能足以支撑未来 18–24
