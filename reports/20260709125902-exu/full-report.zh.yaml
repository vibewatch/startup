    sections:
      - number: '1.1'
        title: 身份与公开足迹
        blocks:
          - type: paragraph
            body: >-
              EXU（也被称为 EXUGlobal）是一家成立于 2025 年的加密货币交易平台。TechCrunch 在 2025 年独角兽追踪中列出该公司：完成 $120 million Series B 轮后，投后估值
              $1.2 billion。公司在地理上更贴近美国创投生态——TechCrunch
              文章是美国独角兽盘点，已披露投资方也是美国和亚太机构基金——但没有一手备案、新闻稿或公司页面能确认具体总部城市、成立月份或高管团队。研究期间，官网 exuglobal.com
              无响应，这本身就是尽调信号：一家号称机构级的加密货币交易平台，如果官网无法访问，所有经营口径都必须在私有数据室里交叉验证。公开记录下，EXU
              最准确的定义是早期、偏美国导向的加密货币交易平台；其公开身份主要由投资方名单和 PitchBook 报告的估值构成，而不是产品或团队。
