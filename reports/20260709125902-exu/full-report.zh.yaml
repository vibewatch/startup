      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              机构级加密货币交易有清晰的买方栈：零售活跃交易者（历史上的交易量引擎）、准专业 API 用户、家族办公室、对冲基金和自营交易公司，以及企业财资。EXU
              的既有定位瞄准中间三个群体——家族办公室、对冲基金和准专业用户——这些客户对费用不那么敏感，产品差异化（AI
              信号、执行质量、跨保证金）也比零售场景更重要。采用路径是两段式漏斗：（1）基于平台监管姿态和审计历史完成法律 / 合规批准；（2）把托管技术接入买方中台。两个阶段通常各需 30–90 天，并在首笔试点交易量前淘汰
              70–85% 的原始管线。Fidelity 和 PwC 研究中的增长信号确认了方向——机构参与度在上升——但这条漏斗意味着第 1 年交易量受管线成熟度约束，而不是由头部市场规模决定。ETF
              资金流也会影响买方地图：美国现货 Bitcoin 和 Ether ETF 带来托管需求和套保交易量，最终流向交易所端，给 EXU 带来间接但真实的机构订单流驱动。
