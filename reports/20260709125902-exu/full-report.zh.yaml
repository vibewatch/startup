      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              机构客户扩张路径通常遵循分阶段序列：（a）仅托管关系；（b）加入执行；（c）主经纪服务（借贷、跨保证金）；（d）衍生品；（e）结构化产品。Deloitte
              的企业采用研究确认，财资和企业买方沿这条序列推进非常慢。先落地托管、再扩到执行，是杠杆最高的扩张路径，因为托管账户极其粘，且自然把客户导入抽成率更高的服务。新机构交易所的集中度风险，通常意味着 1–3
              个头部账户贡献第 1 年收入的大部分；没有 EXU 头部账户占比披露时，这是客户侧最大、也最不可量化的单一风险。财富管理机构（RIA、私人银行）渠道依赖也会带来类似集中度风险，但经济条款可重新谈判。S&P
              Global 的对手方评级流程会影响机构风险团队如何权衡 EXU 的对手方画像，而 FTX、FTC 警示、Fed FSR
              等负面行业新闻共同抬高留存门槛，即便平台本身运营良好也不例外。集中度风险表中的每个指标，都是必需的数据室问题。
