chapter:
  number: 6
  title: Customers
  summary: >-
    EXU's stated customer focus is institutional and sophisticated retail crypto traders, but no named customer, MAU,
    retention cohort, or institutional account count is publicly disclosed. Peer benchmarks and adoption-funnel
    consulting values provide the only usable frame. Customer-side diligence is the single most significant evidence
    weakness in the entire report.
sections:
  - id: section-1
    title: Customer segmentation and buyer map
    body: >-
      EXU's stated customer focus per external coverage is institutional and sophisticated retail crypto traders.
      Because the company website was inaccessible during retrieval and no named customer is publicly disclosed, the
      segmentation model is inferred from stated positioning and peer templates. The most defensible model covers six
      segments: retail active traders (the historical volume engine of centralized exchanges), prosumer/API power users
      (fee-and-latency-sensitive), family offices (compliance-heavy, custody-first), hedge funds and prop trading desks
      (prime-and-derivatives-heavy), corporate treasuries (audit-heavy, low-turnover), and wealth-manager pass-through
      channels (RIA and private banks). Fidelity Digital Assets and PwC research both show institutional allocation
      growing but from a small base, so EXU's addressable buyer pool at the top end of the segment stack is real but
      capped. a16z's 220 million monthly active address count sets the macro end-user pool ceiling for retail. Statista
      aggregates geography splits that make it easier to model region-by-region growth once EXU discloses jurisdictions
      served.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU023
      - CU031
    tableRefs:
      - TU001
  - id: section-2
    title: Adoption trajectory, named proofs, and diligence gaps
    body: >-
      EXU has published no monthly active user count, no registered user count, no institutional account count, no
      monthly trading volume figure, no assets-under-custody figure, and no named lighthouse institutional customer. In
      a Series B unicorn context, that combined evidence gap is the most significant single diligence weakness in the
      entire report. Peer benchmarks provide the frame: Coinbase publicly cites 10,000+ institutional accounts,
      publishes named institutional case studies (BlackRock, Bridgewater-adjacent counterparties, etc.), and discloses
      trading volume in its 10-Ks; Binance publishes hundreds of millions of registered users; Kraken publishes partial
      disclosure. Wikipedia's Coinbase and Binance pages document the scale ceiling. The Block and DefiLlama provide
      indirect signals — flow concentration and custody asset stickiness — that would allow triangulation once EXU
      appears on those data feeds. Investopedia's reviews and CoinDesk's ongoing customer coverage will eventually be a
      real-time customer signal for EXU, but neither has substantive EXU coverage in the sources retrieved. The named
      customer proof table has no rows for EXU by design.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU016
      - CU020
      - CU028
      - CU035
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU003
  - id: section-3
    title: Retention drivers and customer economics
    body: >-
      Retention drivers for institutional customers in this segment are custody trust, fee competitiveness, execution
      quality, product breadth, and account-manager support; EY and Morgan Stanley research both emphasize that trust
      and audit trail matter more than fees alone for institutional decision drivers. Retention drivers for retail
      customers are UX simplicity, fee competitiveness, brand trust, and stablecoin availability. Consulting benchmarks
      suggest well-managed retail exchanges hold 30-50% of a monthly acquisition cohort at 12 months, while
      institutional cohorts stay above 80% year-over-year given onboarding cost. FTC consumer warnings and the FTX
      collapse both raise the trust bar retail customers apply to any new venue; institutional buyers use FTX as the
      reference case for counterparty diligence discipline. IOSCO customer-protection recommendations, FATF Travel Rule
      requirements, and FinCEN MSB obligations all show up in the onboarding UX as friction the platform must minimize
      without violating obligation. IMF cross-border policy work and Fed FSR customer-exposure discussion complete the
      macro frame under which EXU's retention has to be built.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU017
      - CU018
      - CU019
      - CU021
      - CU022
      - CU026
      - CU027
      - CU029
      - CU032
      - CU036
    tableRefs:
      - TU004
    figureRefs:
      - FU001
      - FU002
      - FU004
  - id: section-4
    title: Expansion paths and concentration risk
    body: >-
      Expansion paths for institutional customers typically follow a staged sequence: (a) custody-only relationship, (b)
      execution added, (c) prime services (borrow, cross-margining), (d) derivatives, (e) structured products.
      Deloitte's enterprise adoption research confirms that treasuries and enterprise buyers move through this sequence
      very slowly. Land-and-expand from custody to execution is the highest-leverage expansion path because custody
      accounts are exceptionally sticky and provide a natural funnel into higher-take-rate services. Concentration risk
      for a new institutional exchange typically means one to three lead accounts produce a majority of Year 1 revenue;
      without disclosure of EXU's top-account share, this is the largest single unquantifiable customer-side risk.
      Channel dependence on wealth managers (RIAs, private banks) creates similar concentration risk but with
      renegotiable economics. S&P Global counterparty rating flow feeds into how institutional risk teams weigh EXU's
      counterparty profile, and adverse sector news (FTX, FTC warnings, Fed FSR) collectively raise the retention bar
      even for genuinely well-run platforms. Every metric in the concentration risk table is a mandatory data-room ask.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU030
      - CU033
      - CU034
      - CU035
      - CU036
    tableRefs:
      - TU005
