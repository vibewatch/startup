callouts:
  - calloutType: risk
    title: EXU discloses no named customer, MAU, or retention metric
    body: >-
      Every customer-facing metric that would normally close out a customers chapter is private. Underwriting relies on
      peer benchmarks and inference.
    claimRefs:
      - CU028
      - CU029
      - CU030
  - calloutType: insight
    title: Institutional customers are hard to onboard but very sticky once acquired
    body: >-
      Peer benchmarks show 70-85% drop-off pre-pilot but 90-115% NRR post go-live. If EXU can convert pipeline to pilot,
      retention economics favour a new entrant.
    claimRefs:
      - CU006
      - CU032
      - CU034
  - calloutType: strength
    title: The macro end-user pool is at all-time high
    body: >-
      a16z reports 220M monthly active blockchain addresses in September 2024, more than 3x end-of-2023 levels. New
      entrants like EXU are launching into the largest addressable end-user pool in the sector's history.
    claimRefs:
      - CU004
