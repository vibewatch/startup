company:
  name: EXU
chapter:
  number: 8
  title: Valuation
  summary: >-
    Investor identity is strong (Sequoia, Goldman Sachs, Granite Asia) but every EXU operating metric is private.
    Base-case EV modelling yields $600-800M, below the current $1.2B mark; bull case reaches $2.8-3.2B only after a
    licensing sweep and institutional wins; bear case sits at $200-400M in a crypto-winter with enforcement overlay.
    Recommendation is "research-more" with low confidence, high risk rating, and "expensive" valuation stance.
sections:
  - id: section-1
    title: Thesis, anti-thesis, and recommendation
    body: >-
      The EXU investment thesis rests on four pillars: tier-1 investor identity (Sequoia, Goldman Sachs, Granite Asia),
      AI-driven product differentiation, MiCA licensing potential as EU market unlock, and institutional flow growth as
      demand-side tailwind. The anti-thesis is equally clear: investor identity does not substitute for operating
      metrics, AI features are cheap to build with third-party foundation-model APIs and require proprietary data to be
      defensible, MiCA license status for EXU is unknown, and post-FTX flight to quality tends to benefit publicly
      regulated incumbents (Coinbase Institutional, Kraken) before it reaches new entrants. Given that every operating
      metric — revenue, take rate, users, trading volume, license posture, retention, burn — is private and the company
      website was inaccessible during retrieval, the recommendation is "research-more" with low confidence, high risk
      rating, and an "expensive" valuation stance. Both TechCrunch's narrative and PitchBook's data anchor a $1.2B mark,
      but neither confirms operating metrics; base-case scenario modelling suggests a $600-800M EV that sits below the
      current mark. Coinbase's multi-cycle equity value from $86B peak to sub-$10B trough reminds any private buyer that
      crypto exchange multiples are highly cycle-sensitive.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV008
      - CV017
      - CV020
      - CV034
      - CV037
      - CV038
      - CV039
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: section-2
    title: Entry discipline, preference stack, and public-price support
    body: >-
      Entry discipline for an EXU Series B investment matters more than usual because the current mark is set by the
      syndicate rather than by any independently verifiable operating metric. Standard Series B preferred stock terms in
      a Sequoia-led round typically carry 1x non-participating liquidation preference and pro-rata rights, but specific
      EXU terms are not publicly disclosed. The public-price support question is whether the $1.2B mark can be justified
      against comparable transactions: PitchBook's 2025 crypto VC report and the small set of comparable private rounds
      together with Coinbase's public equity value provide the anchor. Coinbase's SEC 10-K filings and its SEC EDGAR
      filings page give the deepest reference financial detail, and Yahoo Finance, MarketWatch, and Bloomberg all
      publish COIN quotes so multi-source public-price data is available. On a revenue-multiple basis, the current mark
      implies materially better operating metrics than any comparable private exchange has demonstrated at Series B
      without public disclosure — hence the "expensive" valuation stance. On an AUM-multiple basis using DefiLlama's CEX
      reserve tracker as a sanity check, the private-market benchmark is similar. Dilution and preference overhang from
      earlier rounds ($40M pre-Series B) are further unknowns that should be scored in a data-room read.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV012
      - CV017
      - CV026
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
    tableRefs:
      - TV003
    figureRefs:
      - FV002
      - FV003
  - id: section-3
    title: Comparable set and scenario framing
    body: >-
      The comparable set is deliberately mixed to provide multiple lenses: Coinbase as the public benchmark with SEC
      10-K disclosure and multi-cycle market-cap history from roughly $60-90B currently down to sub-$10B in crypto
      winters; Kraken as a comparable private multi-round history with rumored IPO path; Binance as the private opaque
      scale reference indicating that even top-of-market private valuations are hard to mark; Gemini as a
      regulated-posture private peer with disclosed prior secondary rounds around $7B; Bitstamp as an M&A comparable
      being acquired by Robinhood for approximately $200M; OKX as a large private but opaque global peer. Messari's Q4
      2024 sector report and Galaxy Research provide outside outlook framing. CFA Institute methodology research and
      Aswath Damodaran's public valuation research together anchor the framework for scenario modelling. The
      bull/base/bear scenario table shows illustrative EV bands: bear $200-400M in a crypto-winter drawdown similar to
      2022-2023 with take-rate compression, base $600-800M at 15 bps blended take rate on $5B monthly volume, bull
      $2.8-3.2B assuming $15B monthly volume, 20 bps blended take rate, and 8x revenue multiple after a licensing sweep
      and institutional wins. Each range carries wide error bands and is illustrative until private data is available.
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
      - CV018
      - CV019
      - CV022
      - CV023
      - CV024
      - CV025
      - CV027
      - CV028
    tableRefs:
      - TV004
  - id: section-4
    title: Exit readiness, thesis-break triggers, and final diligence asks
    body: >-
      Exit readiness for a private crypto exchange at EXU's scale is gated by three prerequisites: regulator posture
      (licenses secured and disclosed), audited financial statements at institutional standards, and named institutional
      customer proofs. EXU has none of these publicly demonstrated as of the current date. Thesis-break triggers that
      would force a downgrade from "research-more" to "avoid" include: any material regulatory enforcement action
      against EXU, any custody incident with confirmed customer loss above $10M, founder or CTO exit within 12 months of
      investment, failure to secure MiCA passporting by end of 2026, reserve outflows exceeding 25% in a week
      (observable via DefiLlama), and any adverse Chainalysis screening finding. Final diligence asks are focused: 24
      months of monthly revenue and take rate to anchor revenue models, customer list with concentration by top-10 to
      reveal concentration risk, full license schedule (US MTLs, MSB, MiCA, other) to determine geographic revenue
      ceiling, custody model diagram plus insurance policy summary, SOC 2 Type II attestation report, fully diluted cap
      table with preference stack, roadmap with milestones and headcount plan, and audited financial statements or
      interim unaudited if audit is pending. Each of these asks maps to a specific valuation input, and each is the
      precondition for moving from "research-more" to a "buy" or "avoid" call.
    claimRefs:
      - CV033
      - CV035
      - CV036
      - CV040
    tableRefs:
      - TV005
      - TV006
    figureRefs:
      - FV004
