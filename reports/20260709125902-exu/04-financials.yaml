callouts:
  - calloutType: risk
    title: Every revenue metric that matters is private
    body: >-
      Trading volume, take rate, revenue, gross margin, and burn rate are all undisclosed. No underwriter should size a
      check on public data alone.
    claimRefs:
      - CI002
      - CI036
  - calloutType: insight
    title: Institutional take rate compresses quickly
    body: >-
      Coinbase, Kraken, Binance, and Bitstamp all show take rate collapsing to under 10 basis points at institutional
      VIP scale. EXU's institutional positioning means volume alone does not guarantee revenue.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI009
      - CI028
  - calloutType: strength
    title: $160M raised gives useful operating runway
    body: >-
      For a Series B fintech, $160M with a tier-1 syndicate typically funds 18-24 months of build-out and provides
      regulatory capital cushions; both are prerequisites for institutional trust.
    claimRefs:
      - CI001
      - CI027
      - CI031
