slug: exu
runDate: "2026-07-09"
company:
  name: EXU
chapter:
  number: 4
  title: Financials
  summary: >-
    EXU has raised roughly $160M cumulatively at a $1.2B Series B valuation, but revenue, take rate, gross margin, and
    burn are all private. The financial verdict is that capital adequacy is likely sufficient for 18-24 months of
    build-out, revenue quality is un-underwritable from public sources, and every meaningful metric requires a
    management data room.
sections:
  - id: section-1
    title: Revenue model and stream mix
    body: >-
      Centralized crypto exchanges monetize through trading fees (retail spot, institutional spot, and derivatives),
      custody fees, staking revenue share, listing fees, and market-data subscriptions; a growing set of platforms also
      monetize through AI-signal or premium-tier subscriptions. EXU's public materials mention AI-signal features but do
      not disclose fee schedules, VIP tiers, or the actual stream mix. Using peer benchmarks — Coinbase's public 10-K
      filings, Binance's tiered fee schedule, Kraken's 0.16%/0.26% low-tier and 0.00%/0.10% high-tier fees, and
      Bitstamp's 0.4%/0.4% low tier — the industry blended take rate for institutional volume settles between 5 and 15
      basis points, with retail take rates 3-4x higher and derivatives take rates lower still. Coinbase's 10-K also
      documents that custody and staking revenue is more stable than trading revenue, so exchanges with an
      institutional-adjacencies mix typically report lower revenue volatility than pure retail venues. EXU's
      institutional positioning would fit this pattern if the actual stream mix bears it out.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI030
    tableRefs:
      - TI001
      - TI002
  - id: section-2
    title: GTM motion, cost structure, and unit economics benchmarks
    body: >-
      Because EXU's GTM motion is not publicly disclosed, the analysis relies on public benchmarks. Peer 10-Ks and
      analyst work suggest CAC per retail user of $50-$200 with 6-18 month payback, and contribution margin per
      institutional account of $50k-$500k annually depending on volume tier. Cost structure for a compliant
      institutional exchange is dominated by engineering (matching engine, custody stack, AI features), compliance and
      licensing (MiCA, US state MTLs, MSB), audit and reporting (BIS-aligned prudential accounting per EY and PwC
      guidance), banking-rail relationships (Fed FSR and BIS treatment), and blockchain settlement. Gross margin drivers
      are take rate, market-maker rebate absorption, blockchain settlement cost, and fiat-rail cost; institutional take
      rate can compress gross margin from ~85% to ~50% at scale. Chainalysis reporting on illicit flows is a further
      reminder that reported revenue quality has to be discounted for enforcement-exposed volume. Grant Thornton's tax
      note flags that jurisdiction determines whether reported and booked revenue align, another reason EXU's domicile
      is a diligence ask.
    claimRefs:
      - CI005
      - CI015
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI029
      - CI030
      - CI034
    tableRefs:
      - TI003
    figureRefs:
      - FI001
      - FI002
  - id: section-3
    title: Public traction gaps and revenue model estimates
    body: >-
      EXU's public traction is minimal: no revenue figure, no run-rate, no monthly active users, no trading volume
      tracked by CoinMarketCap, The Block, or DefiLlama. The most that can be modelled from the public record is a
      directional revenue model: at a 15 basis-point blended take rate, $1 billion of monthly volume implies roughly
      $15-20 million of annual revenue; $5 billion implies $75-100 million; $15 billion implies $225-300 million. None
      of these ranges is confirmable, and each depends on the actual retail-versus-institutional-versus-derivatives mix.
      Wikipedia's Coinbase entry documents how sensitive exchange revenue is to crypto price cycles, so any point
      estimate must be stress-tested through a bear-case that assumes 40-60% revenue drawdown in a crypto winter, which
      is what Coinbase's 10-K history has shown. Bloomberg and MarketWatch's COIN quotes are the ongoing public marker
      for the direct exchange comparable.
    claimRefs:
      - CI002
      - CI010
      - CI016
      - CI018
      - CI026
      - CI028
      - CI036
    tableRefs:
      - TI005
    figureRefs:
      - FI003
  - id: section-4
    title: Capital adequacy, financing dependency, and verdict
    body: >-
      EXU has raised $160 million cumulatively across a Series B totalling $120 million and prior rounds not publicly
      disclosed. For a Series B crypto exchange this is consistent with 18-24 months of operating runway plus
      regulatory-capital cushions that MiCA and US state MTLs typically require, but no public source confirms EXU's
      actual burn, runway, or debt structure. Next-round triggers are likely a mix of licensing milestones and
      institutional customer wins; no roadmap is public. Working capital for an exchange includes segregated customer
      fiat balances, hot/cold wallet float, and settlement cushions, all of which are opaque without a data room. The
      BIS prudential regime materially raises the cost of any banking-integrated fiat rail, so EXU's banking partner
      list matters. The financial verdict is that capital adequacy is likely sufficient for the next 18-24 months,
      revenue quality and margin path are un-underwritable from the public record, and every meaningful financial metric
      requires a private data-room read before an investment decision can be made.
    claimRefs:
      - CI001
      - CI027
      - CI031
      - CI032
      - CI033
      - CI024
      - CI035
      - CI036
    tableRefs:
      - TI004
    figureRefs:
      - FI004
