            body: >-
              Peer comparisons sharpen the conclusion. Sudu's $500 million is massive for a company with no public
              revenue disclosures, but it is not unusually large for the very front of the humanoid arms race. Figure
              has already raised far more and continues to absorb capital at vastly higher valuations. Apptronik has
              stacked multiple large rounds behind a commercialization program. Physical Intelligence and Skild show
              that software-first robot-brain players can also command multi-billion valuations and war chests without
              mature public revenue disclosure. By contrast, Unitree and AgiBot show what public price, shipment, or
              revenue visibility can look like in China before full market maturity, which makes Sudu's opacity stand
