      - number: '2.2'
        title: TAM/SAM/SOM and Market Sizing
        blocks:
          - type: paragraph
            body: >-
              Multiple credible sources provide market sizing estimates for the humanoid robotics market. Fortune
              Business Insights projects the global humanoid robot market at $6.24B in 2026, growing to $165.13B by 2034
              at a 50.6% CAGR. Market Research Future estimates the China humanoid robots market specifically at $4.9B
              in 2025, growing to $92.82B by 2035 at 34.17% CAGR. Goldman Sachs projects the humanoid robotics market
              reaching $38B by 2035. The robotics AI software layer (Sudu's specific addressable market) is a subset of
              these figures, estimated at 15-25% of total market value as hardware costs decline and software
              differentiation increases. For Sudu Technology specifically, the SAM narrows to Chinese industrial and
              logistics deployments of robot brain technology, estimated at $1-3B by 2030 based on current deployment
              trajectories. The SOM for a single vendor in this early market is constrained by production capacity and
              customer acquisition speed, realistically $100-500M in annual revenue by 2030 for a market leader.
