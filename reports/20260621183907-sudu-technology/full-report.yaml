      - number: '3.3'
        title: Switching costs, distribution power, and regulation favor the earlier movers
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in this sector is not just about robot dexterity. The firms that win early
              enterprise accounts gain integration depth, task data, safety review history, and internal champion
              networks that become hard to dislodge. Figure's BMW proof, Apptronik's strategic industrial backers,
              Skild's OEM-friendly software posture, and Unitree's broad hardware availability all create channels that
              Sudu has not yet matched publicly. Even where a buyer could theoretically multi-home across robot brains
              or hardware, the practical switching cost includes workflow redesign, re-integration with MES or warehouse
              software, safety approvals, retraining, and the loss of task-specific fine-tuning data. Sudu's only named
              customer today is CATL, which is also an investor; that weakens the independence of its single public
              reference. Regulation adds another layer. The American Security Robotics Act does not answer every
              software-embedding edge case, but it clearly increases geopolitical friction for Chinese humanoid
              suppliers. That matters because software-first businesses depend on wide OEM and channel access, not just
              one domestic lighthouse customer.
