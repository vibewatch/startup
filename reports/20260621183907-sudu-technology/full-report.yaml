      - number: '8.3'
        title: Scenario analysis should be milestone-based, not pseudo-precise
        blocks:
          - type: paragraph
            body: >-
              Because Sudu lacks public revenue and margin data, a precise DCF or revenue-multiple framework would
              create false confidence. A better method is milestone valuation. In the bull case, Sudu proves independent
              customer breadth, demonstrates real factory deployments beyond CATL, keeps the sim-first advantage
              credible, and scales manufacturing without a major safety or reliability stumble; under that path, the
              current price can still compound because the company would graduate from technical optionality to category
              leadership in China. In the base case, Sudu lands a few more industrial accounts and continues to raise
              capital, but customer proof remains thinner than the valuation implies; that can still preserve value,
              though returns from today’s price become less attractive. In the bear case, pilot conversion lags,
              manufacturing ramp slips, or peers pull further ahead on disclosed deployments and public-market access;
              then the present valuation looks hard to defend and a down-round or flat round becomes plausible. The key
              insight is that downside is driven less by market collapse than by failure to clear specific milestones
              quickly.
            claimRefs:
