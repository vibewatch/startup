  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Current financing context: ambitious price, limited commercial proof'
        blocks:
          - type: paragraph
            body: >-
              The first fact in Sudu’s valuation story is that price is already doing a lot of work. The company moved
              from formation in 2025 to a 2026 Pre-A round reported at more than $500 million raised and a valuation
              above $2 billion. That is a remarkable mark for a startup with no publicly disclosed revenue, no public
              ARR, no disclosed customer count, and only one named operating customer relationship. The price can still
              be rationalized—investors are clearly underwriting the founder set, the Hao Su research lineage,
              simulation-first differentiation, and the strategic value of being early in embodied AI. But those are
              option-style inputs, not steady-state cash-flow inputs. A traditional revenue multiple cannot be
              calculated, and even dilution analysis is approximate because public coverage does not clearly state
              whether the headline valuation is pre-money or post-money. If the figure is roughly post-money, the new
              round implies about 25% dilution; if it is pre-money, the implied post-money would be even higher. Either
              way, the burden of proof now sits with commercialization.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
