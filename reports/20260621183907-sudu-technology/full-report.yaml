      - number: '3.4'
        title: 'Moat durability: Sudu''s simulation lineage is real, but the adverse case is stronger today'
        blocks:
          - type: paragraph
            body: >-
              The best pro-Sudu argument is that Prof. Hao Su's SAPIEN/ManiSkill lineage gives the company a genuine
              simulation-first research pedigree, and simulation-heavy training could reduce dependence on slow,
              expensive robot-data collection. That is a real technical wedge. The adverse case, however, is stronger
              today because the market is already moving in exactly the directions that pressure such a wedge: open
              robot-brain platforms from NVIDIA and Google are lowering the cost of baseline intelligence; software-
              first peers such as Physical Intelligence and Skild have raised more money and can sign OEMs before Sudu
              does; low-cost Chinese hardware companies such as Unitree and AgiBot are training buyers to expect cheaper
              platforms; and full-stack peers such as Figure and Boston Dynamics have more concrete enterprise proof.
              Sudu's moat is therefore not yet a deployment moat, a data moat, or a price moat. It is best described as
              a research-to-product hypothesis with elite academic heritage. That can still become a durable advantage,
              but only if Sudu converts technical framing into independent deployments, pricing clarity, and repeatable
              operating data faster than the field commoditizes the intelligence layer.
            claimRefs:
              - CP003
