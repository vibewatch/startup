      - number: '1.4'
        title: Business Model and Product Overview
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology's business model centers on developing general-purpose robotic brain technology that can
              be deployed across various hardware platforms and industrial applications. The company's flagship product,
              Sudo R1, is a fully self-developed hardware-software integrated robot system trained entirely on
              simulation data using a 3D world model combined with reinforcement learning. The system achieves near-100%
              zero-shot success rates in object manipulation tasks across over 100 object types without requiring any
              real-machine training data. The company targets industrial manufacturing, logistics, and commercial
              service applications, with plans to sell both complete robotic systems and licensing its AI brain
              technology to hardware manufacturers. Sudu has already established collaboration with CATL for battery
              production and logistics applications, and is building capabilities to cover multi-station robotic
              deployment. The company's open-source strategy includes parts of its simulation framework to build a
              broader developer community.
