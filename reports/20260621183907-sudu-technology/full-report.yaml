      - number: '5.2'
        title: Architecture and training lineage
        blocks:
          - type: paragraph
            body: >-
              Sudu's most credible public technology asset is lineage. The company's core product claims map onto the
              Hao Su ecosystem of embodied-AI research: SAPIEN as a high-fidelity simulation environment, ManiSkill as
              an open manipulation benchmark and training framework, and a public academic tradition of
              reinforcement-learning-oriented sim-to-real work. That does not prove Sudu's commercial system works, but
              it does show the company is building on serious technical foundations rather than vague marketing. The
              architecture implied by public materials is a pipeline: simulation assets and task definitions feed a
              world-model and policy-learning layer, which then drives perception, control, and hardware execution. The
              strongest evidence for this is indirect but coherent across Sudu articles, SAPIEN documentation, ManiSkill
              documentation, GitHub repositories, and the ManiSkill3 paper. The most important caveat is that the public
              evidence is stronger for the underlying research stack than for any Sudu-specific SDK, API, or code
              release. In product terms, Sudu has borrowed credibility from a living research/developer ecosystem, but
              it has not yet translated that into a buyer-visible developer surface of its own.
