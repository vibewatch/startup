      - number: '1.3'
        title: Funding History, Valuation, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology completed its Pre-A funding round on April 20, 2026, raising $500 million (approximately
              RMB 34.1 billion) at a post-money valuation exceeding $2 billion (approximately RMB 13.6 billion). This
              achievement made the company one of the fastest startups globally to reach unicorn status, doing so in
              under 12 months from founding. The investor syndicate is remarkably diverse, spanning internet giants
              (Alibaba, Tencent, Ant Group), battery/industrial players (CATL via Puquan Capital), top-tier venture
              capital (IDG Capital, GL Ventures, BlueRun Ventures, Hillhouse Capital), and strategic investors (Hengdian
              Capital, Futeng Capital, Fudan Innovation). The company issued convertible preferred shares in the
              transaction. Gaohu Capital served as the exclusive long-term financial advisor. Prior to this round, by
              end of 2025, the company had already secured investment from over ten institutional investors. The speed
              of fundraising and diversity of the investor base suggests strong market confidence, though the valuation
              remains entirely forward-looking given the absence of commercial revenue.
