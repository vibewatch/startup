      - number: '3.2'
        title: Direct peer benchmarking shows Sudu trailing on capital, deployments, and pricing clarity
        blocks:
          - type: paragraph
            body: >-
              The strongest direct benchmarks are not the oldest robotics companies but the best-capitalized firms
              proving one of three things that Sudu has not yet proven in public: independent production deployments,
              disclosed monetization, or repeatable scale economics. Figure AI has both premium capital access and BMW
              line deployment data. Apptronik has attracted strategic industrial investors while pushing Apollo toward
              mass manufacturability. Physical Intelligence and Skild AI have raised more capital than Sudu for
              software-first robot intelligence, giving them more room to subsidize partnerships or become the default
              AI layer for third-party OEMs. Unitree and AgiBot matter for a different reason: they reset buyer
              expectations on price, shipment volume, and speed of iteration in China. Sudu therefore faces a compressed
              strategic middle. It is too early-stage on public deployment proof to outrank Figure or Apptronik, too
              under-scaled on disclosed capital to outrun PI or Skild in software distribution, and too expensive by
              implication if Chinese hardware leaders keep pushing list prices down without waiting for long enterprise
              sales cycles. Until Sudu discloses either price or more non-investor deployments, buyers must underwrite
              Sudu more on promise than on evidence.
