  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology operates at the intersection of two rapidly converging markets: embodied AI software
              (robot brains/intelligence platforms) and humanoid/general-purpose robotics hardware. The addressable
              market boundary includes spending on robotic intelligence software, simulation platforms, manipulation
              systems, and integrated humanoid robot systems deployed in industrial, logistics, and commercial settings.
              Excluded from the primary addressable market are traditional industrial automation (fixed-axis robots),
              pure software AI without physical embodiment, and consumer entertainment robots. The status-quo
              substitutes being displaced include manual labor in flexible manufacturing, specialized single-task
              automation systems, and conventional robotic arms requiring extensive programming per task. The embodied
              AI brain segment specifically targets the intelligence layer that makes robots generalizable across tasks
              without per-scenario engineering. This market boundary is particularly important because it distinguishes
              Sudu from both traditional robotics companies selling hardware and pure-play AI companies selling software
              without physical instantiation. The convergence of these two domains in 2025-2026 represents a new market
              category where Sudu Technology positions itself.
            claimRefs:
              - CM001
