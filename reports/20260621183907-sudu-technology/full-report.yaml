      - number: '7.4'
        title: Partner concentration and key-person dependence can break the thesis quickly
        blocks:
          - type: paragraph
            body: >-
              Sudu’s team quality is a strength, but it is also a dependency. The commercial story is tightly linked to
              Han Zheng’s track record as a repeat founder and Hao Su’s scientific credibility in simulation, world
              models, and robotics research. Losing either anchor—or failing to translate their credibility into a
              second layer of operating leadership—would materially weaken the investment case. CATL dependence is the
              other major structural risk. If the only named customer is also a strategic investor, then pipeline
              independence remains unproven and negotiation leverage may skew toward the customer. Finally, market
              timing risk remains high. China is standardizing humanoid robotics quickly, but that does not mean the
              category will scale on venture timetables. A slower adoption curve, more safety gating, or stronger price
              competition from listed and better-capitalized peers could compress Sudu’s room for error. The thesis only
              holds if customer breadth, factory execution, and non-investor demand all improve together over the next
              12 to 24 months.
