      - number: '1.2'
        title: Leadership, Founders, and Key Personnel
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology is led by co-founder and CEO Han Zheng (韩铮), a serial entrepreneur and former Young
              Scientist at Microsoft Research Asia. Han previously co-founded ZeptTech (a motion-sensing game controller
              company), ZEPP (China's first smart sports hardware company, acquired by Zepp Health/Huami in 2018), and
              Rocket Science (a smart office/video conferencing platform acquired by Ucommune in 2020 at a valuation of
              RMB 200 million). His Chief Technology Advisor is Professor Hao Su (苏昊), who joined Fudan University in
              2026 as the Haoqing Distinguished Professor and inaugural Dean of the Institute of General Physical
              Intelligence. Prof. Su holds PhDs in Mathematics from Beihang University and Computer Science from
              Stanford (under Fei-Fei Li), was formerly a tenured professor at UC San Diego, and is a co-creator of
              ImageNet, ShapeNet, PointNet, SAPIEN, ManiSkill, and TD-MPC. The technical lead is Xu Zexiang, former head
              of Generative AI at Adobe with over 11,000 Google Scholar citations. Hardware lead Chen Runze previously
              served as an investor at Source Code Capital and led the investment in Unitree Robotics. Strategy lead
              Zhang Xiaoheng has a background spanning ABB, Huawei, and BlueRun Ventures. The core team originated from
              the Hillbot project, combining academic depth with industry execution and capital market experience. No
              leadership turnover or key-person departures have been reported since founding.
