      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Sudu's differentiation claim is easy to state and hard to verify: the company says that simulation- first
              training can produce robust real-world manipulation without collecting real-world training data. If true
              at scale, that would be a meaningful product advantage because it could cut data-collection cost, speed up
              iteration, and make deployment on new tasks faster. The risk is that embodied AI has spent years
              confronting the reality gap between simulation and physical systems, and the academic literature still
              treats that gap as an open technical problem rather than a solved one. Sudu's product story also lacks
              visible trust infrastructure. Public materials reviewed for this chapter do not expose a rich safety,
              privacy, cybersecurity, certification, or reliability-control surface. That does not mean those controls
              do not exist internally, only that they are not yet part of the company's public buyer proof. The result
              is a mixed technical verdict: the architecture and lineage are more credible than the governance and
              validation layer, and the company remains dependent on future real-world proof to convert a strong
              technical narrative into a durable product moat.
