      - number: '8.4'
        title: 'Recommendation: track, with a stretched valuation stance until independent proof arrives'
        blocks:
          - type: paragraph
            body: >-
              The most defensible investment posture is track or research-more at the current public mark, not because
              Sudu lacks promise, but because the evidence-to-price ratio is still unfavorable. Investors are paying
              ahead for a very strong talent stack and a potentially important product architecture, yet they are doing
              so before public customer breadth, public financial disclosure, and public reliability proof exist. That
              does not make the round irrational: embodied AI is being financed like a platform race, and Sudu has
              enough differentiators to deserve a seat at the table. It does mean the next diligence step should be
              brutally practical. Before paying up again, an investor should demand non-investor customer names,
              pilot-to-production conversion evidence, factory milestones, safety and data-governance ownership, and a
              clearer view of capital needs. If those appear, today’s valuation can age well. If they do not, the round
              will look like peak-optional pricing for a business that had not yet earned a commercial discount rate.
