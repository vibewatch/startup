      - number: '4.3'
        title: Capital intensity, burn, and adequacy
        blocks:
          - type: paragraph
            body: >-
              The most important financial question is not whether Sudu has raised enough to start, but what its capital
              must fund before the next round. A serious embodied-AI program consumes money in at least five buckets:
              model and simulation R&D, compute, hardware prototyping and BOM iteration, manufacturing or tooling
              preparation, and enterprise pilot support. Sudu's stated factory ambition in Lingang and its integrated
              hardware-software positioning mean that burn is likely closer to a deep-tech hardware curve than to a
              pure-software startup curve, yet no reviewed source discloses monthly burn or cash runway. That forces any
              runway view into scenario analysis. Publicly, the company has no disclosed debt, project-finance
              obligations, inventory metrics, receivables profile, or backlog indicators that would let an outsider
              model working-capital strain. The practical implication is that $500 million is best seen as a war chest
              for experimentation and scale-up, not as proof that Sudu is fully funded to profitability. The next
              financing trigger will likely depend on independent deployments, monetization clarity, and evidence that
