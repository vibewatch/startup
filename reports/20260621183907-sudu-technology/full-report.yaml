      - number: '5.3'
        title: Deployment maturity and operator workflow
        blocks:
          - type: paragraph
            body: >-
              The public product evidence suggests that Sudu is further along in technical demonstration than in
              operational maturity. Sudo R1 is framed as zero-real-data-trained and near-100% on selected tasks, but the
              externally visible proof still sits at the demo, article, and pilot stage rather than the long-run
              reliability stage. The implied operator workflow is straightforward: define the task, simulate it, train a
              policy, deploy it on the robot, observe performance, and then refine the loop with additional scenarios
              and operator supervision. That is plausible and internally consistent with the sim-first narrative. What
              is not public is the durability layer around it: there is no buyer-facing service manual, no public SDK
              for third-party integrators, no field MTBF, no uptime record, and no published support SLA. This leaves
              the product looking technologically ambitious but commercially early. In other words, Sudu appears able to
              demonstrate capability, but public evidence has not yet shown that the company can industrialize
              onboarding, integration, or long-horizon support at the standard expected by factory buyers.
