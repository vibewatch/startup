      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Key growth drivers include China's 15th Five-Year Plan (2026-2030) which elevates robotics and embodied
              intelligence to a national strategic priority, with dedicated funding through the 60 billion RMB National
              AI Industry Investment Fund. China's demographic crisis (310 million citizens aged 60+, 5.5 million
              caregiver deficit) creates structural demand for automation. The MIIT's Humanoid Robot and Embodied
              Intelligence Standard System (HEIS 2026) provides the first comprehensive national framework for robot
              commercialization, developed by 120+ institutions covering six pillars. Technology maturation in
              simulation-to-real transfer and reinforcement learning reduces deployment costs substantially. Key
              constraints include the persistent sim-to-real gap for safety-critical applications where simulation
              cannot capture all real-world edge cases, high upfront capital costs for industrial humanoid robots
              ($150K-$320K per unit), lack of proven ROI data for humanoid deployments beyond limited pilots, regulatory
              uncertainty for autonomous systems operating in Chinese industrial environments, and the intense
              competition from well-funded US competitors including Figure AI valued at $39B with actual factory
              deployments. Additional constraints include integration complexity with existing manufacturing systems and
              the unproven economics of robotics-as-a-service business models for vendors.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
