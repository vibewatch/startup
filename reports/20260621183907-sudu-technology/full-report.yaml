      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The primary buyer segments for Sudu Technology's robot brain technology include industrial manufacturers
              seeking flexible automation, logistics operators managing warehouse and sorting operations, battery
              manufacturers (like CATL, an existing pilot customer), and consumer electronics assembly plants. The buyer
              is typically the VP of Operations or Chief Technology Officer at large industrial enterprises. The user is
              the factory floor operations team. The payer is the corporate capital expenditure budget or, increasingly,
              robotics-as-a-service operational expense line items. Budget ownership sits with manufacturing/operations
              leadership, with procurement triggered by labor cost pressure, quality requirements, or production
              flexibility demands. The Chinese market uniquely features state-owned enterprises and government-backed
              industrial parks as significant early adopters driven by national policy mandates.
            claimRefs:
              - CM010
