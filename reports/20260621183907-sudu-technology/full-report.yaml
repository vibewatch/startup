      - number: '4.2'
        title: Revenue model and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Sudu's public materials imply a monetization ambition but not yet a reported business model in the
              accounting sense. The company appears to be positioning around integrated robot-system sales, software or
              brain licensing, deployment engineering, and after-sale support, yet none of the reviewed sources disclose
              list pricing, realized contract value, revenue recognition method, backlog, or gross margin. The only
              named commercial relationship is CATL, which is also an investor; that makes the pilot strategically
              useful but financially ambiguous because outside observers cannot tell whether any pilot revenue is
              arm's-length, subsidized, or still pre-commercial. This absence of pricing and volume data prevents even a
              basic split between hardware revenue, software revenue, and service revenue. It also blocks standard GTM
              efficiency analysis: there is no public CAC, payback, cycle time, win rate, retention, or utilization
              data. The result is that Sudu can be described as pre-revenue or pre- disclosed-revenue, but not
              meaningfully underwritten on revenue quality from public evidence alone.
