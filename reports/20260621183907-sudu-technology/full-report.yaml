    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Founding
        blocks:
          - type: paragraph
            body: >-
              Shanghai Sudu Technology Co., Ltd. (上海苏度科技有限公司, also known as Sudo AI or Sudo Tech) was founded on May 19,
              2025, with its registered office in Yangpu District, Shanghai. The company operates in the embodied
              artificial intelligence and robotics sector, specializing in general-purpose robot brain technology and
              intelligent control systems. Sudu Technology's core proposition is developing foundational models for
              robotic manipulation that can be trained entirely in simulation without requiring real-world demonstration
              data. The company is building a manufacturing base in the Lingang area of Shanghai for mass production of
              robotic systems. As of June 2026, the company is pre-revenue and in the commercial pilot phase, having
              demonstrated its technology through its flagship Sudo R1 system. Its current stage is Pre-A and it
              operates as a private-undisclosed entity with limited public financial disclosures.
