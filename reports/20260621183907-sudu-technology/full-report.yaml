  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and visible modules
        blocks:
          - type: paragraph
            body: >-
              Publicly, Sudu is not selling a single narrow component; it is presenting an integrated embodied-AI stack.
              The visible product is Sudo R1, but the economic proposition underneath it is broader: a robot body, a
              simulation-trained policy stack, a world-model layer, and a deployment method that claims to move from
              simulation into physical execution without collecting real-world imitation data first. In workflow terms,
              the buyer is not being pitched a general-purpose research platform alone. Instead, Sudu is signaling a
              system that can be trained against task scenarios, transferred into hardware, and deployed into industrial
              contexts such as manufacturing and logistics. The most important module-level distinction is therefore
              between what is delivered as a demo-visible robot and what is delivered as the invisible training and
              control substrate behind it. This matters because Sudu's technical moat, if it exists, will reside less in
              the metal and more in the training pipeline, policy generalization, and workflow conversion from task
              definition to repeatable manipulation. The public record is strong on these conceptual modules, but still
              thin on mature SKU, service, or support packaging.
