  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape segmentation: software-first, full-stack, low-cost, and incumbents'
        blocks:
          - type: paragraph
            body: >-
              Sudu sits in a narrower competitive lane than its $2B+ valuation implies. Its closest analogues are
              software-first robot-brain companies such as Physical Intelligence, Skild AI, and increasingly platform
              vendors such as NVIDIA and Google DeepMind that want to supply the intelligence layer across many hardware
              bodies. Against them, Sudu's claim is that simulation-first training can avoid the long real-world data
              collection loop required by full-stack humanoid programs. The problem is that the rest of the field has
              already split into multiple advantage pools: Figure AI and Apptronik combine AI with manufacturing and
              named customers; Unitree and AgiBot are pulling price and volume down in China; NEURA and Boston Dynamics
              bring ecosystem depth and industrial credibility; and adjacent vendors such as Deep Robotics, Agile
              Robots, and Fourier compete for the same automation budgets even when the form factor is not a pure
              humanoid. In other words, Sudu is not only racing direct embodied-AI peers. It is also racing open
              robot-brain platforms, low-cost domestic hardware, and incumbent industrial automation suppliers that can
              capture buyer budgets before Sudu proves a repeatable commercial wedge.
