  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count-gap
    missingEvidence: A current customer list with named pilots, paid accounts, and deployed robot counts.
    whyItMatters: Without breadth data, investors cannot judge whether Sudu is a one-account story or the start of a repeatable customer base.
    diligencePath: Request a pipeline and customer-status export split by pilot, paid deployment, and investor-linked account.
    relatedQuestionRefs:
    - QU004
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Renewal, expansion, and cohort retention metrics for early customer accounts.
    whyItMatters: Customer durability is central to any robotics commercialization thesis and is completely absent from public evidence.
    diligencePath: Ask management for contract renewals, pilot extension rates, and any NRR-style cohort analysis.
    relatedQuestionRefs:
    - QU013
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: catl-outcome-gap
    missingEvidence: Plant-level outcome metrics for the CATL deployment such as uptime, throughput, labor savings, or workstation coverage.
    whyItMatters: Named proof is far more valuable when it includes measurable operating benefit rather than just a partner name.
    diligencePath: Request customer reference calls and KPI dashboards from the CATL validation program.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Additional named customer relationships beyond CATL and any independent non-investor reference accounts.
    whyItMatters: The current enumeration table is structurally partial and concentration risk remains high until other accounts are named.
    diligencePath: Request permission to cite at least two non-investor customer logos with use-case and deployment stage.
    relatedQuestionRefs:
    - QU009
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: service-gap
    missingEvidence: Public or semi-public SLA, support, and contract-length terms for deployed customers.
    whyItMatters: Procurement quality is hard to judge without service expectations and support obligations.
    diligencePath: Review a standard MSA/SOW and support policy from a pilot customer.
    relatedQuestionRefs:
    - QU014
acknowledgedWarnings:
- dimension: figureType
  reason: The planned retention cohort figure is intentionally omitted because no public time-series retention percentages exist for Sudu, and fabricating cohort cells would be less honest than using a disclosure-gap scorecard.
