  - FU003
- id: target-segments-and-adoption-surface
  title: The target customer surface is structured industrial work, not broad enterprise software
  body: 'Sudu''s public materials consistently frame the product around pick-and-place style manipulation, structured environments, and data-sensitive industrial workflows rather than consumer robotics or general office automation. The most repeated segment signals are industrial manufacturing, warehousing, sorting, depalletizing, and logistics-adjacent operations. This lines up with broader industry evidence: Goldman Sachs expects early demand for humanoids and general-purpose physical AI to emerge first in structured manufacturing, while China''s 2026 humanoid standards push initial deployment toward factories, logistics centers, and other semi-structured settings. CATL is a good fit for that thesis because it operates complex battery manufacturing, large-scale quality systems, and automation-heavy plants where labor substitution, flexibility, and data governance all matter. Sudu''s differentiation pitch is that simulation-trained robots can adapt to new tasks without bespoke data collection
    at each customer site, which, if true, would shorten deployment cycles for industrial buyers. But that is still a proposition rather than an observed fleet-level outcome.'
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  tableRefs:
