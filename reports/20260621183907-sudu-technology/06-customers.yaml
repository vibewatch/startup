chapter:
  number: 6
  title: Customers
  summary: Sudu Technology remains pre-revenue and has not disclosed customer count, revenue, retention, or production contracts. Public customer proof is concentrated in April 2026 launch coverage pointing to CATL as the only named pilot and strategic investor, while target demand is framed around industrial manufacturing and logistics use cases that value data security and fast deployment.
sections:
- id: named-customer-proof-and-public-evidence
  title: Named customer proof is concentrated in one disclosed CATL relationship
  body: The public customer record for Sudu is unusually thin relative to its valuation. Across the company blog, launch coverage, and investor-linked writeups, the only clearly named operating customer relationship is CATL, described as joint development or deployment validation in battery-production and logistics scenarios. That matters because it gives Sudu at least one credible industrial reference point, but it also shows how early the company still is commercially. There is no public contract value, no disclosed number of deployed robots, no proof of expansion from one cell or workstation to a broader plant rollout, and no arm's-length list of additional named buyers. Several articles say Sudu has attracted “head industrial customers” or is doing secondary development with top manufacturing and logistics clients, but those references stop short of naming counterparties or quantifying use. The result is that customer proof exists, but it is still pilot-grade, concentrated, and highly
    mediated by launch-period media rather than recurring customer disclosures.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  tableRefs:
