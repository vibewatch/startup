  figureRefs: []
- id: retention-renewal-and-commercial-gaps
  title: Retention, renewal, and revenue durability are not publicly disclosed
  body: 'From a diligence perspective, the biggest weakness in the customer chapter is not the absence of logos alone but the absence of durability metrics. No reviewed public source discloses customer count, annual recurring revenue, booked revenue, average contract value, net revenue retention, gross retention, renewal rates, or pilot-to-production conversion. Sudu also does not publish case studies with baseline-versus-outcome metrics, service-level commitments, payback analyses, or references from independent plant operators. That leaves investors unable to separate technical novelty from repeatable customer value. The company does claim near-100% zero-shot picking performance on selected tasks, and launch-period articles argue that the system can be deployed without collecting sensitive customer data, but neither claim substitutes for evidence of paid retention. In practice, the public customer narrative therefore remains a commercialization hypothesis: the product may fit important
    industrial workflows, yet there is still no disclosed proof that customers stay, expand, or pay at scale.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-procurement-and-go-to-market-risk
  title: Customer concentration and procurement risk dominate the commercial picture
  body: Because CATL appears to be both a strategic investor and the only named operating customer, concentration risk is high even before revenue begins. A supportive investor-customer can accelerate validation, but it can also blur whether commercial demand is independent of the financing syndicate. That issue is sharper in robotics than in software because buyers care about safety, uptime, integration, and long deployment cycles, all of which typically require more proof than a short demo can provide. Public comparators such as Apptronik, Figure, and Skild increasingly disclose named brands, deployment categories, or even early revenue signals, whereas Sudu's public record still relies on launch articles and generalized references to top industrial clients. Sudu's go-to-market appeal is clear—faster deployment, less customer data collection, and flexible manipulation—but industrial procurement will still require plant-level reliability, integration support, and broad references that are
    not yet public. Until those appear, the commercial thesis rests on a narrow proof base and a wide evidence gap.
  claimRefs:
