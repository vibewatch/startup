- id: technology-manufacturing-and-operational-risks
  title: The biggest operational question is whether simulation-first performance survives real factories
  body: 'The core technology risk is the classic sim-to-real gap, only sharpened by Sudu’s unusually strong claim that no real-world training data is required to reach near-production behavior. The official Sudo R1 material is impressive, but it also admits that true production-grade performance still lies ahead. That is a critical nuance. Demos of picking under varied visual conditions do not automatically establish long-duration reliability, exception handling, safety under edge cases, or integration with line-side processes. Manufacturing risk compounds the technology risk because Sudu is also preparing physical capacity in Lingang rather than selling a pure software layer. Factory construction, supplier coordination, quality control, certification, and service operations all add execution complexity before revenue is visible. Broader industry evidence cuts both ways: Goldman argues structured manufacturing is a plausible first market, but also notes that general-purpose humanoid viability
    is not yet proven and that some components remain hard to scale. In other words, Sudu is trying to solve model risk and industrialization risk simultaneously.'
  claimRefs:
