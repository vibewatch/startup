company:
  name: Sudu Technology
chapter:
  number: 7
  title: Risks
  summary: Sudu Technology’s risk profile is dominated by pre-revenue execution, unproven sim-to-real commercialization, concentration around CATL, and a high valuation set before scaled field proof. Regulatory and data-security rules in China are manageable but real, while manufacturing buildout, key-person dependence, and intensifying humanoid competition raise the threshold for flawless execution.
sections:
- id: commercial-and-financing-risks
  title: Pre-revenue execution and valuation risk sit at the top of the stack
  body: 'Sudu’s most immediate risk is simple: the company is valued like a leader before it has shown public commercial proof at leader scale. The business has raised exceptional capital and attracted top investors quickly, but no reviewed public source discloses revenue, customer count, contract backlog, or margin profile. That means the next financing or mark-up will depend on turning technical promise into operating evidence faster than peers with larger deployment footprints. Competition magnifies this. Figure, Apptronik, Skild, Physical Intelligence, and Unitree are all absorbing large amounts of capital while disclosing some combination of real deployments, revenue signals, or listing progress. Sudu therefore faces a narrow path: it must prove not just that its technology works in curated demonstrations, but that it can convert pilots into production revenue before the market demands stricter commercial benchmarks. The absence of public revenue turns every delay in customer conversion
    into a valuation and fundraising risk, not just an operating issue.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
