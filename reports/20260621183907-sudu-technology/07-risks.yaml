- id: regulatory-legal-and-geopolitical-risks
  title: Chinese AI, data, and export-control rules create a real compliance perimeter
  body: 'Sudu is not obviously in immediate regulatory distress, but the company operates in a part of the AI stack where compliance obligations can compound quickly. China’s deep synthesis and generative AI rules impose data-handling, security, labeling, and governance responsibilities on providers of AI systems, and the Data Security Law creates a broader framework for data handling and industry supervision. Those rules matter even more if Sudu collects video, sensor, model-output, or workflow data in industrial settings. In parallel, China’s export-control regime and the growing geopolitical focus on dual-use AI mean a robot company associated with high-end manufacturing, autonomy, and potentially military-adjacent capabilities could face future restrictions on components, foreign collaboration, or outbound commercialization. Standard-setting also raises the bar: new industrial-robot and humanoid-robot standards will likely make safety, interoperability, and documentation more important
    over time. None of this is a thesis-break today, but it is a real execution burden for a company trying to move fast.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
