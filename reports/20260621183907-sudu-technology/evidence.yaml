evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Employee count, organizational structure, and hiring velocity data
    whyItMatters: Cannot assess burn rate, execution capacity, or team scaling relative to funding
    diligencePath: Request HR data or LinkedIn employee count via management meeting
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: ownership structure
    missingEvidence: Cap table, investor ownership percentages, and governance terms
    whyItMatters: Cannot assess dilution, control dynamics, or investor alignment
    diligencePath: Request cap table disclosure in data room
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: private-evidence-only
    severity: material
    topic: burn rate
    missingEvidence: Monthly burn rate, runway estimate, and planned use of the $500M proceeds
    whyItMatters: Cannot assess financial sustainability or timeline to next fundraise
    diligencePath: Request financial projections and use-of-proceeds breakdown from management
    relatedQuestionRefs:
      - QO018
  - type: enumeration-incomplete
    severity: minor
    topic: full leadership team
    missingEvidence: Complete list of all senior leaders, board members, and key technical staff beyond the five publicly disclosed
    whyItMatters: Cannot fully assess team depth, key-person dependency, or functional coverage gaps
    diligencePath: Request complete org chart from management or review LinkedIn for additional team members
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: IP protection
    missingEvidence: Patent filings, IP strategy, or technology licensing agreements
    whyItMatters: Core technology defensibility cannot be assessed without IP landscape review
    diligencePath: Search patent databases (CNIPA) for Sudu Technology filings; request IP summary
    relatedQuestionRefs:
      - QO014
  - type: stale
    severity: minor
    topic: manufacturing progress
    missingEvidence: Lingang facility completion timeline and production capacity targets
    whyItMatters: Mass production readiness directly affects commercialization timeline
    diligencePath: Request construction timeline update from company; check Lingang development authority records
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: material
    topic: market sizing discrepancy
    missingEvidence: Reconciliation of 4x+ variance between Goldman Sachs ($38B) and Fortune BI ($165B) TAM projections
    whyItMatters: Cannot confidently size Sudu's opportunity without understanding methodology differences
    diligencePath: Request full methodology reports from both publishers; identify definitional differences
    relatedQuestionRefs:
      - QM015
      - QM016
  - type: missing-source
    severity: material
    topic: robot brain software TAM
    missingEvidence: Dedicated analyst report sizing the embodied AI software/platform segment specifically
    whyItMatters: Sudu's actual SAM (robot brain software) has no established benchmark separate from full hardware+software TAM
    diligencePath: Commission custom market sizing or find specialist robotics software analyst reports
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: regulatory framework details
    missingEvidence: Specific compliance requirements for AI-autonomous robots in Chinese industrial settings
    whyItMatters: Regulatory burden affects time-to-market and cost structure for deployment
    diligencePath: Review MIIT and CAC published guidelines; interview compliance specialists
    relatedQuestionRefs:
      - QM018
  - type: missing-source
    severity: material
    topic: sudu-pricing
    missingEvidence: Public Sudo R1 list price, software-fee model, contract structure, and support terms.
    whyItMatters: >-
      Without price disclosure, buyers cannot compare Sudu against Unitree, AgiBot, Apptronik, or software-only
      robot-brain alternatives.
    diligencePath: >-
      Request current pricing sheet, pilot commercial terms, and any software-license or maintenance schedule from
      management.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: sudu-benchmarking
    missingEvidence: >-
      Independent benchmark or third-party witnessed test comparing Sudu's success-rate claims against external
      robot-brain peers on equivalent tasks.
    whyItMatters: >-
      Sudu's core moat claim is technical; without benchmark parity evidence, the simulation-first advantage remains
      marketing-heavy.
    diligencePath: Request benchmark protocol, raw test logs, and third-party observer validation against a named peer baseline.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: non-investor-customers
    missingEvidence: Names and outcomes of non-investor pilot customers beyond CATL.
    whyItMatters: >-
      Independent customer proof is the cleanest way to rebut the view that Sudu trails on commercialization and
      reference quality.
    diligencePath: Request at least two non-investor references with deployment scope, task metrics, and renewal or expansion status.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: minor
    topic: channel-independence
    missingEvidence: >-
      Contractual details showing whether CATL has any exclusivity, preferred access, or channel overlap with other
