- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Pre/post-money and cap table
    - Exact valuation basis, preference stack, and dilution math
    - The round headline is ambiguous and affects return math materially
    - Management and counsel data room
  - - Independent customers
    - Named non-investor accounts with stage and contract status
    - Removes investor-customer circularity from valuation support
    - GTM lead and customer references
  - - Lingang milestones
    - Construction, capex, commissioning timeline
    - Shows whether hardware scaling assumptions are realistic
    - Operations lead and project documents
  - - Reliability metrics
    - Uptime, throughput, intervention rate, safety incidents
    - Determines whether demos can support premium pricing
    - Engineering and customer-ops review
  - - Cash needs
    - Burn, runway, and next-raise assumptions
    - Pre-revenue valuations are vulnerable to dilution if cash use is underestimated
    - Finance lead and board materials
  notes: These asks target the specific evidence gaps that currently keep the valuation stance at stretched rather than fair.
