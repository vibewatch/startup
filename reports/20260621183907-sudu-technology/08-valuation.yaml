- id: comparable-set-and-what-the-market-pays-for
  title: Comparable embodied-AI valuations show why the round happened, not why it is cheap
  body: The strongest defense of Sudu’s price is relative rather than absolute. Figure is at a far higher valuation with meaningful deployment evidence at BMW and very large capital committed. Apptronik has a lower valuation but also a named commercial agreement with Mercedes-Benz and a broader disclosed customer set. Skild and Physical Intelligence show that investors will also pay double-digit billions for software-first or model-first robotics platforms even without mature commercialization. Unitree complicates the picture because it is both more operationally visible and more financially measurable, making Sudu’s opacity look expensive. The peer set therefore cuts both ways. On one hand, Sudu is not an outlier in a market that prizes embodied-AI optionality and scarce talent. On the other hand, peers with similar or higher prices often show more customer, revenue, or public-market evidence than Sudu does. That means Sudu’s valuation is explainable but still stretched when normalized
    against disclosed operating proof.
  claimRefs:
