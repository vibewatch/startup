      - number: '5.4'
        title: 差异化、信任与技术风险
        blocks:
          - type: paragraph
            body: >-
              Sudu 的差异化主张很容易讲清，却很难验证：公司称仿真优先训练可以不采集真实世界训练数据，也能产生稳健的真实世界操作能力。
              如果能规模化成立，这会是有意义的产品优势，因为它可能削减数据采集成本、加快迭代，并让新任务部署更快。风险在于，具身 AI 多年来一直面对仿真与物理系统之间的现实差距，
              学术文献仍把这个差距视为开放技术问题，而不是已解决问题。Sudu 的产品故事也缺少可见信任基础设施。本章审阅的公开材料没有展示丰富的安全、隐私、
              网络安全、认证或可靠性控制界面。这不意味着这些控制在内部不存在，只说明它们还没有成为公司公开买方证明的一部分。最终技术判断是混合的：
              架构和血统比治理与验证层更可信，而公司仍要依赖未来真实世界证明，把强技术叙事转化为持久产品护城河。
