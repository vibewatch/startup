companyProfile:
  summary: >-
    Sudu Technology（苏度科技）是一家总部位于上海的具身 AI 与机器人公司，2025 年 5 月成立，开发通用机器人脑技术。 旗舰产品 Sudo R1 完全使用仿真数据训练，结合 3D
    世界模型与强化学习，不依赖真实世界训练数据即可实现接近 100% 的零样本抓取成功率。 2026 年 4 月，公司完成 Alibaba、Tencent、CATL 和一线 VC 支持的 $500M Pre-A 轮，估值超过
    $2B，成为最快跻身独角兽行列的中国初创公司之一。
