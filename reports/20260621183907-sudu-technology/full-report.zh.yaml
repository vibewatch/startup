        title: 管理层、创始人与关键人员
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology 由联合创始人兼 CEO 韩铮领导。韩铮是连续创业者，曾任 Microsoft Research Asia 青年科学家。 他此前共同创办
              ZeptTech（体感游戏控制器公司）、ZEPP（中国第一家智能运动硬件公司，2018 年被 Zepp Health/Huami 收购）以及 Rocket Science（智能办公 / 视频会议平台，2020
              年以 RMB 200 million 估值被 Ucommune 收购）。首席技术顾问是苏昊教授， 他于 2026 年加入复旦大学，担任浩清教授和通用物理智能研究院首任院长。苏昊拥有 Beihang
              University 数学博士和 Stanford 计算机科学博士学位 （导师为 Fei-Fei Li），此前是 UC San Diego 终身教授，也是
              ImageNet、ShapeNet、PointNet、SAPIEN、ManiSkill 和 TD-MPC 的共同创建者。 技术负责人 Xu Zexiang 曾任 Adobe 生成式 AI 负责人，Google
              Scholar 引用超过 11,000 次。硬件负责人 Chen Runze 曾在 Source Code Capital 任投资人， 并主导投资 Unitree Robotics。战略负责人 Zhang
              Xiaoheng 的经历横跨 ABB、Huawei 和 BlueRun Ventures。核心团队源自 Hillbot 项目，
              兼具学术深度、产业执行力和资本市场经验。自成立以来，公开信息未显示管理层流失或关键人物离职。
