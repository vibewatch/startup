              Sudu 的团队质量是优势，也是依赖。商业叙事高度绑定韩铮的连续创业履历，以及苏昊在仿真、世界模型和机器人研究上的学术可信度。失去任一锚点，或无法把两人的信誉转化为第二层运营领导力，都会实质削弱投资理由。CATL
              依赖是另一个重大结构性风险。如果唯一具名客户同时也是战略投资方，管线独立性仍未被证明，谈判杠杆也可能向客户倾斜。最后，市场时点风险仍高。中国正在快速标准化人形机器人，但这不等于该品类会按风险投资的时间表放量。采用曲线更慢、安全闸门更多，或上市公司和资本更充足的同行打出更强价格竞争，都可能压缩
              Sudu 的容错空间。只有未来 12 到 24 个月里，客户广度、工厂执行和非投资方需求一起改善，投资逻辑才站得住。
