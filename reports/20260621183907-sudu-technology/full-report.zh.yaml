      - number: '1.3'
        title: 融资历史、估值与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology 于 2026 年 4 月 20 日完成 Pre-A 轮融资，募集 $500 million（约 RMB 34.1 billion），投后估值超过 $2 billion （约 RMB
              13.6 billion）。公司成立不到 12 个月即达到独角兽估值，成为全球最快跻身独角兽行列的初创公司之一。投资人组合极为多元： 互联网巨头（Alibaba、Tencent、Ant Group）、电池 /
              工业玩家（CATL 通过 Puquan Capital）、一线风险资本（IDG Capital、GL Ventures、 BlueRun Ventures、Hillhouse
              Capital）以及战略投资方（Hengdian Capital、Futeng Capital、Fudan Innovation）。公司在交易中发行可转换优先股。 Gaohu Capital
              担任独家长期财务顾问。在此轮之前，截至 2025 年底，公司已获得十多家机构投资。融资速度和投资人多样性显示市场信心很强， 但在没有商业收入的情况下，估值仍完全押注未来。
