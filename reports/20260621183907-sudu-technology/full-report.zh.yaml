  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 投前 / 投后估值和股权结构
        - 精确估值基础、优先权结构和稀释测算
        - 本轮标题存在歧义，并会实质影响回报测算
        - 管理层和律师资料室
      - - 独立客户
        - 具名非投资方账户，含阶段和合同状态
        - 从估值支撑中移除投资人即客户的循环论证
        - GTM 负责人和客户访谈
      - - 临港里程碑
        - 建设、资本开支、投产时间表
        - 显示硬件规模化假设是否现实
        - 运营负责人和项目文件
      - - 可靠性指标
        - 正常运行时间、吞吐量、干预率、安全事故
        - 决定演示能否支撑溢价定价
        - 工程和客户运营复核
      - - 现金需求
        - 烧钱额、现金跑道和下一轮融资假设
        - 若低估现金消耗，尚无收入的估值容易被稀释
        - 财务负责人和董事会材料
    notes: 这些要求针对当前让估值立场只能停在偏贵、而非公平的具体证据缺口。
