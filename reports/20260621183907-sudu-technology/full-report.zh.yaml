      - number: '8.2'
        title: embodied AI 可比估值解释了为什么能融资，但不能证明便宜
        blocks:
          - type: paragraph
            body: >-
              Sudu 价格最有力的辩护是相对估值，而不是绝对估值。Figure 的估值高得多，并且在 BMW 有实质部署证据，也投入了巨额资本。Apptronik 估值更低，但也与 Mercedes-Benz
              有具名商业协议，并披露了更广的客户群。Skild 和 Physical Intelligence 则说明，即便商业化尚未成熟，投资人也愿意为软件优先或模型优先的机器人平台支付百亿美元级价格。Unitree
              让画面更复杂，因为它运营上更可见，财务上也更可衡量，这让 Sudu 的不透明显得昂贵。因此，可比公司给出的是双向信号。一方面，在一个看重 embodied AI 期权价值和稀缺人才的市场里，Sudu
              并非异类。另一方面，价格相近或更高的同行，往往拿出了比 Sudu 更多的客户、收入或公开市场证据。也就是说，Sudu 的估值可以解释，但按已披露运营证明归一化后，仍显得紧。
