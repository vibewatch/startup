  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与可见模块
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，Sudu 卖的不是单一狭窄组件，而是在展示一套一体化具身 AI 栈。可见产品是 Sudo R1，但底层经济主张更宽：
              一个机器人本体、一套仿真训练的策略栈、一个世界模型层，以及一种部署方法，声称可先不采集真实世界模仿数据，就从仿真走向物理执行。
              按工作流看，买方听到的不是一个通用研究平台，而是一个可针对任务场景训练、迁移到硬件、并部署到制造和物流等工业场景的系统。
              因此，最重要的模块级区分在于，哪些是作为演示可见机器人交付，哪些是背后的不可见训练和控制底座。这很关键，因为如果 Sudu 存在技术护城河，
              它更可能在训练管线、策略泛化，以及从任务定义到可复制操作的工作流转换里，而不是在金属硬件里。公开记录对这些概念模块讲得很清楚， 但对成熟 SKU、服务或支持包装仍然很薄。
