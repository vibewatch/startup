      - number: '8.4'
        title: 建议：继续跟踪；在独立证明出现前，对估值保持偏紧判断
        blocks:
          - type: paragraph
            body: >-
              以当前公开价格看，最可辩护的投资姿态是跟踪或继续研究，不是因为 Sudu
              没有潜力，而是证据与价格的比例仍不理想。投资人正在提前为很强的人才栈和可能重要的产品架构付费，但付款发生在公开客户广度、公开财务披露和公开可靠性证明出现之前。这并不意味着该轮融资不理性：embodied AI
              正被当作平台竞赛来融资，Sudu
              也有足够差异化，值得坐上牌桌。但下一步尽调必须非常务实。再次支付溢价之前，投资人应要求看到非投资方客户名称、试点转量产证据、工厂里程碑、安全与数据治理负责人，以及更清晰的资本需求。如果这些出现，今天的估值可以经得起时间检验；如果没有，这轮融资就会像是为一家尚未赚到商业折现率的公司支付了期权峰值价格。
