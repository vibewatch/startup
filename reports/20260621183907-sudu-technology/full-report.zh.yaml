  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 赛道拆分：软件优先、全栈、低成本与既有厂商
        blocks:
          - type: paragraph
            body: >-
              Sudu 所处的竞争通道，比 $2B+ 估值暗示的要窄。最接近的对标是 Physical Intelligence、Skild AI 这类软件优先的机器人脑公司， 以及 NVIDIA、Google
              DeepMind 等越来越想把智能层供给给多种机器人本体的平台厂商。面对这些对手，Sudu 的主张是仿真优先训练能绕开全栈人形机器人项目所需的漫长真实世界数据采集循环。
              问题在于，其他玩家已经分化成多个优势池：Figure AI 和 Apptronik 把 AI、制造和具名客户结合起来；Unitree 和 AgiBot 在中国把价格和出货量往下拉； NEURA 和 Boston
              Dynamics 带来生态深度与工业可信度；Deep Robotics、Agile Robots、Fourier 等相邻厂商即便不是纯人形形态，也在争夺同一批自动化预算。 换句话说，Sudu
              不只是在追赶直接的具身 AI 同行。它还要与开放机器人脑平台、低成本本土硬件，以及能在 Sudu 证明可复制商业切口前先拿走买方预算的工业自动化既有供应商竞争。
