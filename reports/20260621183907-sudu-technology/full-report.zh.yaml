      - number: '4.2'
        title: 收入模式与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Sudu 的公开材料暗示了变现雄心，但还没有报告会计意义上的商业模式。公司似乎围绕一体化机器人系统销售、软件或大脑授权、部署工程和售后支持布局，
              但已审阅来源均未披露标价、实际合同金额、收入确认方法、积压订单或毛利率。唯一具名商业关系是 CATL，而 CATL 同时也是投资人；
              这让试点有战略价值，却在财务上含混，因为外部观察者无法判断任何试点收入是否独立交易、是否被补贴，或是否仍处于商业化前阶段。 缺少价格和销量数据，连硬件收入、软件收入和服务收入之间的基本拆分都无法做出。标准 GTM
              效率分析也被堵住：公开信息没有 CAC、回本期、周期时长、 胜率、留存或利用率数据。因此，Sudu 可以被描述为尚未产生收入或尚未披露收入，但仅凭公开证据，无法有意义地承销收入质量。
