              Sudu 最直接的风险很简单：公司在尚未公开展示领导者规模商业证明之前，就已经按领导者估值。公司很快筹到大额资本并吸引顶级投资人，
              但已审阅公开来源没有披露收入、客户数量、合同积压或利润率情况。这意味着下一轮融资或估值上调，将取决于公司能否比部署足迹更大的同行更快把技术承诺变成运营证据。
