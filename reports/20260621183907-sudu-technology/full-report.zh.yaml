              Sudu 最可信的公开技术资产是血统。公司的核心产品主张映射到苏昊具身 AI 研究生态：SAPIEN 是高保真仿真环境，ManiSkill 是开放操作基准和训练框架， 还有一条面向强化学习 sim-to-real
              工作的公开学术传统。这不能证明 Sudu 的商业系统有效，但能说明公司建在严肃技术基础之上，而不是模糊营销。
              公开材料暗示的架构是一条管线：仿真资产和任务定义输入世界模型与策略学习层，再驱动感知、控制和硬件执行。最强证据是间接的， 但在 Sudu 文章、SAPIEN 文档、ManiSkill 文档、GitHub 仓库和
              ManiSkill3 论文之间相互一致。最重要的保留意见是， 公开证据对底层研究栈更强，对任何 Sudu 专属 SDK、API 或代码发布更弱。从产品角度看，Sudu 借用了一个活跃研究 / 开发者生态的可信度，
              但还没有把它转化为买方可见的自有开发者界面。
