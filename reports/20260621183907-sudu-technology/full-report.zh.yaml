      - number: '1.4'
        title: 商业模式与产品概览
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology 的商业模式围绕通用机器人脑技术展开，这套技术可部署到多种硬件平台和工业应用中。旗舰产品 Sudo R1 是完全自研的软硬件一体化机器人系统， 使用 3D
              世界模型结合强化学习，完全在仿真数据上训练。系统无需任何真机训练数据，就能在 100 多类物体的操作任务中实现接近 100% 的零样本成功率。
              公司瞄准工业制造、物流和商业服务应用，计划同时销售完整机器人系统，并向硬件厂商授权 AI 大脑技术。Sudu 已与 CATL 建立合作，
              面向电池生产和物流场景，并在建设覆盖多工位机器人部署的能力。公司的开源策略包括开放部分仿真框架，以建立更广泛的开发者社区。
