  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 客户广度未能扩大
        - 下一轮融资前仍只有一个具名客户
        - 需求独立性仍未得到证明
        - 将溢价倍数视为缺乏支撑
      - - 工厂爬坡明显滑坡
        - 临港里程碑或投产时间后移
        - 交付和规模化故事变弱
        - 提高下行和稀释概率
      - - 可靠性证据迟迟不出现
        - 演示之外没有公开现场 KPI
        - 仿真优先优势仍停留在理论层面
        - 持有或后退，直到证据改善
      - - 下一轮只靠叙事
        - 披露没有改善，却寻求更高价格
        - 价格进一步跑在证据前面
        - 要求更好条款，或回避
      - - 同业持续披露更多，而 Sudu 仍不透明
        - 与 Unitree / Apptronik / Figure 的差距扩大
        - 相对估值支撑恶化
        - 将立场从跟踪转为回避
    notes: 这些触发项面向投委会使用，可随新证据出现而刷新。
