            body: >-
              最重要的财务问题不是 Sudu 是否筹到足够的钱开始，而是下一轮之前这些钱必须覆盖什么。严肃的具身 AI 项目至少在五个桶里消耗资金： 模型和仿真 R&D、算力、硬件原型与 BOM
              迭代、制造或工装准备，以及企业试点支持。Sudu 宣称在临港建设工厂，并采取软硬件一体化定位， 这意味着烧钱曲线可能更接近深科技硬件公司，而不是纯软件初创公司；但已审阅来源没有披露月度 burn 或现金
              runway。任何 runway 判断都只能进入情景分析。 公开信息显示，公司没有披露债务、项目融资义务、库存指标、应收账款情况或积压订单指标，外部人无法建模营运资本压力。实际含义是， $500 million
              更应被视为实验和规模化的弹药库，而不是 Sudu 已获得通往盈利所需全部资金的证明。下一次融资触发因素很可能取决于独立部署、变现清晰度， 以及资本正在转化为可复制客户需求的证据。
