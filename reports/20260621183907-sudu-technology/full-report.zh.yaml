    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与成立
        blocks:
          - type: paragraph
            body: >-
              Shanghai Sudu Technology Co., Ltd.（上海苏度科技有限公司，也称 Sudo AI 或 Sudo Tech）成立于 2025 年 5 月 19 日，注册地位于上海杨浦区。
              公司处在具身人工智能和机器人赛道，专攻通用机器人脑技术和智能控制系统。Sudu Technology 的核心主张是开发机器人操作基础模型，
              完全用仿真训练，不需要真实世界示范数据。公司正在上海临港建设制造基地，为机器人系统量产做准备。截至 2026 年 6 月，公司尚未产生收入， 处于商业试点阶段，已通过旗舰系统 Sudo R1 展示技术。当前阶段为
              Pre-A，仍是未披露详细信息的私营实体，公开财务披露有限。
