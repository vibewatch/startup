      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology 机器人脑技术的主要买方包括寻求柔性自动化的工业制造商、管理仓储和分拣业务的物流运营商、电池制造商（如现有试点客户 CATL）， 以及消费电子组装工厂。买方通常是大型工业企业的运营
              VP 或 CTO。用户是工厂一线运营团队。付款方是企业资本开支预算，或越来越常见的 robotics-as-a-service 运营开支条目。预算归制造 /
              运营负责人所有，劳动力成本压力、质量要求或生产灵活性需求会触发采购。中国市场还有一个独特特征： 国企和政府支持的产业园是重要早期采用者，背后受国家政策要求驱动。
