  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景：价格激进，商业证明有限
        blocks:
          - type: paragraph
            body: >-
              Sudu 估值故事里的第一事实，是价格已经承担了太多预期。公司 2025 年成立，到 2026 年 Pre-A 轮据称融资超过 $500 million、估值超过 $2
              billion。对于一家没有公开收入、没有公开
              ARR、没有披露客户数量，且只有一个具名运营客户关系的创业公司，这个定价非常突出。这个价格仍可被解释——投资人显然在押注创始人组合、苏昊的研究谱系、仿真优先差异化，以及早期进入 embodied AI
              的战略价值。但这些更像期权式输入，不是稳态现金流输入。传统收入倍数无法计算；即便做稀释分析也只能近似，因为公开报道没有说清头部估值是 pre-money 还是 post-money。如果该数字大致是
              post-money，新一轮意味着约 25% 稀释；如果是 pre-money，隐含 post-money 还会更高。无论哪种，证明责任现在都落在商业化上。
            claimRefs:
              - CV001
              - CV002
              - CV003
