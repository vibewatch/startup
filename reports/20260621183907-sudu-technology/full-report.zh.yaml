      - number: '3.2'
        title: 直接同业基准显示 Sudu 在资本、部署和定价清晰度上落后
        blocks:
          - type: paragraph
            body: >-
              最有力的直接基准不是最老牌的机器人公司，而是资本最充足、正在证明三件 Sudu 尚未公开证明的事的公司：独立生产部署、已披露变现，或可复制的规模经济。 Figure AI 同时拥有高端资本渠道和 BMW
              产线部署数据。Apptronik 吸引了战略工业投资人，同时推动 Apollo 走向可大规模制造。Physical Intelligence 和 Skild AI 作为软件优先的机器人智能公司，融资额高于
              Sudu，因此更有空间补贴合作，或成为第三方 OEM 的默认 AI 层。Unitree 和 AgiBot 的重要性来自另一点： 它们正在重置中国买方对价格、出货量和迭代速度的预期。因此，Sudu
              被挤在战略中段：公开部署证明太早期，难以压过 Figure 或 Apptronik； 已披露资本规模不足，难以在软件分发上跑赢 PI 或 Skild；如果中国硬件龙头继续压低标价、不等待漫长企业销售周期，Sudu
              隐含上又显得太贵。 在 Sudu 披露价格或更多非投资人部署之前，买方只能更多基于承诺而非证据来承销 Sudu。
