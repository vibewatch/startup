      - number: '2.2'
        title: TAM/SAM/SOM 与市场规模
        blocks:
          - type: paragraph
            body: >-
              多个可信来源给出了人形机器人市场规模估算。Fortune Business Insights 预计全球人形机器人市场 2026 年为 $6.24B， 到 2034 年增至 $165.13B，CAGR 为
              50.6%。Market Research Future 估计中国人形机器人市场 2025 年为 $4.9B， 到 2035 年增至 $92.82B，CAGR 为 34.17%。Goldman Sachs
              预计人形机器人市场到 2035 年达到 $38B。机器人 AI 软件层 （Sudu 的具体可服务市场）是上述规模的一个子集；随着硬件成本下降、软件差异化上升，该层估计占总市场价值的 15-25%。对 Sudu
              Technology 而言， SAM 收窄到中国工业和物流场景中的机器人脑技术部署，按当前部署轨迹估计到 2030 年为 $1-3B。早期市场中单一厂商的 SOM 受产能和获客速度限制， 市场领导者到 2030
              年实现 $100-500M 年收入较为现实。
