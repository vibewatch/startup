      - number: '3.3'
        title: 切换成本、分发权力与监管更有利于先发者
        blocks:
          - type: paragraph
            body: >-
              这个行业的竞争耐久性不只取决于机器人灵巧度。率先拿下企业客户的公司会积累集成深度、任务数据、安全评审历史和内部支持者网络，后来者很难撬动。 Figure 的 BMW 证明、Apptronik
              的战略工业支持者、Skild 对 OEM 友好的软件姿态，以及 Unitree 广泛的硬件可得性，都形成了 Sudu 尚未公开匹配的渠道。
              即便买方理论上可以在多个机器人脑或硬件之间多栖，实际切换成本也包括工作流重设计、与 MES 或仓储软件重新集成、安全审批、再培训，以及丢失任务专属微调数据。 Sudu 目前唯一具名客户是 CATL，而 CATL
              同时也是投资人；这削弱了其单一公开案例的独立性。监管又增加一层压力。American Security Robotics Act
              不能回答每一个软件嵌入的边缘情况，但它明确提高了中国人形机器人供应商的地缘政治摩擦。这很关键，因为软件优先业务依赖广泛的 OEM 和渠道触达， 而不只是一个本土灯塔客户。
