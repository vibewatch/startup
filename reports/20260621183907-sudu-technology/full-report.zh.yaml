      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动因素包括中国“十五五”规划（2026–2030），它把机器人和具身智能提升为国家战略重点，并通过 RMB 60 billion 国家 AI 产业投资基金提供专项资金。 中国人口结构危机（60
              岁以上人口 310 million、护理人员缺口 5.5 million）带来自动化的结构性需求。MIIT 的 Humanoid Robot and Embodied Intelligence Standard
              System（HEIS 2026）由 120 多家机构制定，覆盖六大支柱，为机器人商业化提供首个全面国家框架。仿真到现实迁移和强化学习技术成熟， 大幅降低部署成本。主要约束包括：安全关键应用中持续存在的
              sim-to-real 缺口，因为仿真无法覆盖所有真实世界边缘情况；工业人形机器人前期资本成本高 （每台 $150K-$320K）；有限试点之外，人形机器人部署缺少已验证 ROI
              数据；自主系统在中国工业环境运行仍有监管不确定性；以及资金充足的美国竞争对手激烈竞争， 包括估值 $39B 且已有实际工厂部署的 Figure AI。额外约束还包括与现有制造系统集成复杂，以及
              robotics-as-a-service 商业模式对厂商的经济性尚未验证。
