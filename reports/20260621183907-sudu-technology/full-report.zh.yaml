      - number: '8.3'
        title: 情景分析应按里程碑定价，而不是做伪精确
        blocks:
          - type: paragraph
            body: >-
              Sudu 没有公开收入和利润率数据，精确 DCF 或收入倍数框架只会制造虚假的确定性。更好的方法是里程碑估值。牛市情景下，Sudu 证明独立客户广度，展示 CATL 之外的真实工厂部署，维持 sim-first
              优势的可信度，并在制造扩张中避开重大安全或可靠性失误；沿这条路径，当前价格仍可能继续复利，因为公司会从技术期权升级为中国的品类领导者。基准情景下，Sudu
              拿下少数更多工业客户并继续融资，但客户证明仍比估值所暗示的更薄；这仍能保住价值，只是从今天价格出发的回报吸引力下降。熊市情景下，试点转量产滞后、制造爬坡滑坡，或同行在披露部署和公开市场通道上进一步领先；届时当前估值会很难防守，down-round
              或 flat round 变得可能。关键判断是，下行更多来自未能快速跨过具体里程碑，而不是市场崩盘。
