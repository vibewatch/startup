      - number: '5.3'
        title: 部署成熟度与操作员工作流
        blocks:
          - type: paragraph
            body: >-
              公开产品证据显示，Sudu 在技术演示上走得比运营成熟度更远。Sudo R1 被包装为零真实数据训练、在特定任务上接近 100%，
              但外部可见证明仍停留在演示、文章和试点阶段，而不是长期可靠性阶段。隐含的操作员工作流很直接：定义任务、仿真任务、训练策略、部署到机器人、
              观察表现，再用更多场景和操作员监督迭代循环。这个流程合理，也与仿真优先叙事内部一致。尚未公开的是围绕它的耐久层： 没有面向买方的服务手册，没有给第三方集成商的公开 SDK，没有现场 MTBF，没有 uptime
              记录，也没有发布支持 SLA。这让产品看起来技术野心很强， 但商业上仍早期。换句话说，Sudu 似乎能展示能力，但公开证据尚未证明公司能按工厂买方期待的标准，把 onboarding、集成或长周期支持工业化。
