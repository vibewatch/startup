      - number: '3.4'
        title: 护城河耐久性：Sudu 的仿真血统真实存在，但当下反面案例更强
        blocks:
          - type: paragraph
            body: >-
              支持 Sudu 的最佳论点是，苏昊教授的 SAPIEN/ManiSkill 血统让公司拥有真正的仿真优先研究底座，而重度仿真训练可能降低对缓慢、昂贵机器人数据采集的依赖。
              这是一个真实的技术切口。但今天反面案例更强，因为市场正沿着恰好挤压该切口的方向演进：NVIDIA 和 Google 的开放机器人脑平台正在降低基础智能的成本； Physical Intelligence 和
              Skild 等软件优先同行融资更多，可以在 Sudu 之前签下 OEM；Unitree、AgiBot 等低成本中国硬件公司正在训练买方期待更便宜的平台； Figure 和 Boston Dynamics
              等全栈同行则拥有更具体的企业证明。因此，Sudu 的护城河还不是部署护城河、数据护城河或价格护城河。更准确地说， 它是一个带有顶级学术传承的“研究转产品”假设。这个假设仍可能变成持久优势，但前提是 Sudu
              在智能层被商品化之前，更快把技术叙事转化为独立部署、清晰定价和可复制运营数据。
