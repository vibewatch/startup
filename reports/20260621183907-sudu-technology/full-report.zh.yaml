  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Sudu Technology 站在两个快速汇合的市场交叉点：具身 AI 软件（机器人脑 / 智能平台）和人形 / 通用机器人硬件。可服务市场边界包括机器人智能软件、
              仿真平台、操作系统，以及部署在工业、物流和商业场景的一体化人形机器人系统支出。主要可服务市场不包括传统工业自动化（固定轴机器人）、 无物理载体的纯软件
              AI，以及消费娱乐机器人。正在被替代的现状方案包括柔性制造中的人工劳动、专用单任务自动化系统，以及每项任务都需要大量编程的传统机械臂。 具身 AI
              大脑细分市场专门瞄准智能层，让机器人不需要逐场景工程化就能跨任务泛化。这个市场边界格外重要，因为它把 Sudu 与销售硬件的传统机器人公司、 以及销售无实体软件的纯 AI 公司区分开来。2025–2026
              年，两个领域汇合形成新市场类别，Sudu Technology 正是在其中定位自己。
            claimRefs:
              - CM001
              - CM002
              - CM003
