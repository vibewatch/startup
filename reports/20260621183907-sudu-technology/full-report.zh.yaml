  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资结构与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Sudu 公开的财务故事始于一次超大融资事件，而不是可见收入基础。公开来源一致描述，公司通过可转换优先股完成 $500 million Pre-A 轮， 估值超过 $2
              billion，背后投资人覆盖互联网平台、战略工业资本和中国一线风险基金。这个组合很重要：Alibaba、Tencent、Ant、CATL、IDG、 GL
              Ventures、Hillhouse、BlueRun、Hengdian 等投资人，让一家成立 13 个月的公司拥有异常宽的融资韧性。同时，轮次结构意味着投资人很可能获得了有意义的下行保护，
              尽管具体条款未公开。财务分析的关键在于，Sudu 用早期披露拿到了后期阶段的钱。公司有足够资本推进产品化和工厂准备，
              但市场实际上是在承销未来商业化，而不是任何已验证的公开收入流。因此，尽调重心从历史利润表转向条款、资金用途和未来融资触发条件。
