companyProfile:
  summary: "Sudu Technology (苏度科技) is a Shanghai-based embodied AI and robotics company founded in May 2025 that develops general-purpose robot brain technology. Its flagship product, Sudo R1, is trained entirely on simulation data using a 3D world model combined with reinforcement learning, achieving near-100% zero-shot grasping success rates without requiring real-world training data. The company achieved a $2B+ valuation through a $500M Pre-A round in April 2026 backed by Alibaba, Tencent, CATL, and top-tier VCs, making it one of the fastest Chinese startups to reach unicorn status."
  foundedDate: "2025-05-19"
  founders:
    - name: "Han Zheng"
      role: "Co-Founder & CEO"
      background: "Former Microsoft Research Asia Young Scientist; serial entrepreneur with exits at ZEPP (acquired by Huami 2018) and Rocket Science (acquired by Ucommune 2020)."
      claimRefs: ["CO006", "CO007", "CO008"]
    - name: "Hao Su"
      role: "Chief Technology Advisor"
      background: "Fudan University Haoqing Distinguished Professor; former UCSD tenured professor; co-creator of ImageNet, ShapeNet, PointNet, SAPIEN, ManiSkill; PhDs from Beihang and Stanford."
      claimRefs: ["CO009", "CO010", "CO011"]
