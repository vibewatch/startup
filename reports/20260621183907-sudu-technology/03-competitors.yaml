callouts:
  - calloutType: "risk"
    title: "Open robot-brain platforms are the clearest adverse signal"
    body: >-
      NVIDIA Isaac GR00T and Google DeepMind Gemini Robotics show that well-capitalized platform vendors
      want the intelligence layer to be cheap, standardized, and widely distributed. That is directly
      adverse to Sudu's plan to monetize a differentiated robot brain.
    claimRefs: ["CP021", "CP023", "CP024", "CP036"]
  - calloutType: "risk"
    title: "Sudu's single named pilot is not an independent market proof point"
    body: >-
      CATL is both investor and pilot customer, so Sudu's strongest public reference is strategically useful
      but weak as third-party validation when compared with BMW for Figure AI or public shipment metrics for
      Unitree and AgiBot.
    claimRefs: ["CP002", "CP005", "CP017", "CP020", "CP031", "CP037"]
  - calloutType: "insight"
    title: "China's hardware price floor may set the entire category's buyer psychology"
    body: >-
      Unitree and AgiBot matter even if Sudu wants to emphasize software value, because public low-cost
      hardware anchors force every new entrant to justify why its integrated system deserves a premium.
    claimRefs: ["CP017", "CP019", "CP020", "CP033"]
  - calloutType: "strength"
    title: "Sudu's best defensible wedge is still its simulation pedigree"
    body: >-
      Among public competitors, few can match the direct lineage from SAPIEN and ManiSkill into a commercial
      robot-brain narrative. That does not yet equal a moat, but it is the company's most credible starting
      point.
    claimRefs: ["CP003", "CP035", "CP038"]
