callouts:
  - calloutType: "strength"
    title: "The lineage is real"
    body: >-
      Sudu's strongest product asset is not a brochure feature but the fact that its sim-first story maps
      onto visible, respected embodied-AI research assets such as SAPIEN and ManiSkill.
    claimRefs: ["CE008", "CE010", "CE011", "CE012", "CE013", "CE033"]
  - calloutType: "risk"
    title: "The reality gap remains the central technical risk"
    body: >-
      Public academic literature still treats sim-to-real transfer as a hard problem, so Sudu's boldest
      product claim is also the part of the stack most in need of independent validation.
    claimRefs: ["CE024", "CE025", "CE028", "CE036"]
  - calloutType: "risk"
    title: "Trust disclosure trails capability disclosure"
    body: >-
      Public materials say much more about performance and architecture than about safety, reliability,
      cybersecurity, privacy, or certification.
    claimRefs: ["CE021", "CE022", "CE023", "CE035", "CE037"]
  - calloutType: "insight"
    title: "Open-source heritage helps the story, but not yet the product surface"
    body: >-
      The underlying research ecosystem has visible documentation and GitHub activity, yet Sudu itself has
      not converted that into a buyer-facing SDK or product repository that outsiders can evaluate directly.
    claimRefs: ["CE016", "CE017", "CE018", "CE038"]
