company:
  name: "Sudu Technology"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sudu Technology (苏度科技) is a Shanghai-based embodied AI startup founded in May 2025 that achieved a $2B+ valuation within 11 months through its Pre-A round of $500M backed by Alibaba, Tencent, CATL, and other top-tier investors, positioning itself as one of China's fastest-growing robotics unicorns."
sections:
  - id: "identity-and-founding"
    title: "Identity, Headquarters, and Founding"
    body: "Shanghai Sudu Technology Co., Ltd. (上海苏度科技有限公司, also known as Sudo AI or Sudo Tech) was founded on May 19, 2025, with its registered office in Yangpu District, Shanghai. The company operates in the embodied artificial intelligence and robotics sector, specializing in general-purpose robot brain technology and intelligent control systems. Sudu Technology's core proposition is developing foundational models for robotic manipulation that can be trained entirely in simulation without requiring real-world demonstration data. The company is building a manufacturing base in the Lingang area of Shanghai for mass production of robotic systems. As of June 2026, the company is pre-revenue and in the commercial pilot phase, having demonstrated its technology through its flagship Sudo R1 system. Its current stage is Pre-A and it operates as a private-undisclosed entity with limited public financial disclosures."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005"]
    tableRefs: ["TO001"]
    figureRefs: ["FO003"]
  - id: "leadership-and-team"
    title: "Leadership, Founders, and Key Personnel"
    body: "Sudu Technology is led by co-founder and CEO Han Zheng (韩铮), a serial entrepreneur and former Young Scientist at Microsoft Research Asia. Han previously co-founded ZeptTech (a motion-sensing game controller company), ZEPP (China's first smart sports hardware company, acquired by Zepp Health/Huami in 2018), and Rocket Science (a smart office/video conferencing platform acquired by Ucommune in 2020 at a valuation of RMB 200 million). His Chief Technology Advisor is Professor Hao Su (苏昊), who joined Fudan University in 2026 as the Haoqing Distinguished Professor and inaugural Dean of the Institute of General Physical Intelligence. Prof. Su holds PhDs in Mathematics from Beihang University and Computer Science from Stanford (under Fei-Fei Li), was formerly a tenured professor at UC San Diego, and is a co-creator of ImageNet, ShapeNet, PointNet, SAPIEN, ManiSkill, and TD-MPC. The technical lead is Xu Zexiang, former head of Generative AI at Adobe with over 11,000 Google Scholar citations. Hardware lead Chen Runze previously served as an investor at Source Code Capital and led the investment in Unitree Robotics. Strategy lead Zhang Xiaoheng has a background spanning ABB, Huawei, and BlueRun Ventures. The core team originated from the Hillbot project, combining academic depth with industry execution and capital market experience. No leadership turnover or key-person departures have been reported since founding."
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO011", "CO012", "CO013", "CO034", "CO035"]
    tableRefs: ["TO002"]
    figureRefs: []
  - id: "funding-and-valuation"
    title: "Funding History, Valuation, and Investor Base"
    body: "Sudu Technology completed its Pre-A funding round on April 20, 2026, raising $500 million (approximately RMB 34.1 billion) at a post-money valuation exceeding $2 billion (approximately RMB 13.6 billion). This achievement made the company one of the fastest startups globally to reach unicorn status, doing so in under 12 months from founding. The investor syndicate is remarkably diverse, spanning internet giants (Alibaba, Tencent, Ant Group), battery/industrial players (CATL via Puquan Capital), top-tier venture capital (IDG Capital, GL Ventures, BlueRun Ventures, Hillhouse Capital), and strategic investors (Hengdian Capital, Futeng Capital, Fudan Innovation). The company issued convertible preferred shares in the transaction. Gaohu Capital served as the exclusive long-term financial advisor. Prior to this round, by end of 2025, the company had already secured investment from over ten institutional investors. The speed of fundraising and diversity of the investor base suggests strong market confidence, though the valuation remains entirely forward-looking given the absence of commercial revenue."
    claimRefs: ["CO014", "CO015", "CO016", "CO017", "CO018", "CO019", "CO020", "CO032", "CO033"]
    tableRefs: ["TO003"]
    figureRefs: []
  - id: "business-model-and-product"
    title: "Business Model and Product Overview"
    body: "Sudu Technology's business model centers on developing general-purpose robotic brain technology that can be deployed across various hardware platforms and industrial applications. The company's flagship product, Sudo R1, is a fully self-developed hardware-software integrated robot system trained entirely on simulation data using a 3D world model combined with reinforcement learning. The system achieves near-100% zero-shot success rates in object manipulation tasks across over 100 object types without requiring any real-machine training data. The company targets industrial manufacturing, logistics, and commercial service applications, with plans to sell both complete robotic systems and licensing its AI brain technology to hardware manufacturers. Sudu has already established collaboration with CATL for battery production and logistics applications, and is building capabilities to cover multi-station robotic deployment. The company's open-source strategy includes parts of its simulation framework to build a broader developer community."
    claimRefs: ["CO021", "CO022", "CO023", "CO024", "CO025", "CO026", "CO036"]
    figureRefs: ["FO002"]
  - id: "milestones-and-timeline"
    title: "Key Milestones and Corporate Timeline"
    body: "Despite being less than 14 months old at the time of this analysis, Sudu Technology has achieved a remarkable series of milestones. Founded in May 2025 by Han Zheng with technical backing from Prof. Hao Su, the company secured initial seed investments from major institutions by end of 2025. In early 2026, Prof. Su officially joined Fudan University as Dean of the Institute of General Physical Intelligence, strengthening the company's academic-industry bridge. On April 20, 2026, the company announced both the Sudo R1 system and its $500M Pre-A round simultaneously, a strategy designed to demonstrate technical validation alongside fundraising. The company published a 60-minute unedited demonstration video showing the system's capabilities across varied conditions. The Lingang manufacturing base is currently under construction for mass production readiness. There have been no reported adverse events, regulatory issues, or leadership changes since founding."
    claimRefs: ["CO027", "CO028", "CO029", "CO030", "CO031", "CO032", "CO034"]
    tableRefs: ["TO004"]
    figureRefs: ["FO001"]
