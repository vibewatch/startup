callouts:
  - calloutType: "risk"
    title: "Public disclosure is far weaker than the valuation headline"
    body: >-
      Sudu's $2B+ valuation is easy to quote but hard to underwrite because there is still no public ARR,
      gross margin, runway, backlog, or realized pricing data.
    claimRefs: ["CI003", "CI010", "CI020", "CI021", "CI034", "CI036"]
  - calloutType: "insight"
    title: "The investor mix is itself part of the financial product"
    body: >-
      Sudu did not just raise money; it raised from internet platforms, industrial capital, and top-tier VC.
      That combination can extend financing resilience and accelerate pilots, even before revenue becomes
      visible.
    claimRefs: ["CI002", "CI008", "CI009", "CI030"]
  - calloutType: "risk"
    title: "Capital intensity likely outruns public disclosure"
    body: >-
      A company trying to fund model R&D, compute, hardware iteration, and factory preparation needs more
      than headline equity; without burn and capex disclosure, investors are underwriting faith in execution.
    claimRefs: ["CI019", "CI020", "CI023", "CI025", "CI031", "CI035"]
  - calloutType: "recommendation"
    title: "Diligence should focus on conversion of capital into arm's-length revenue"
    body: >-
      The most important next data points are realized pricing, non-investor customers, pilot conversion,
      and runway by spending bucket rather than another round headline.
    claimRefs: ["CI024", "CI027", "CI028", "CI029", "CI035", "CI036"]
