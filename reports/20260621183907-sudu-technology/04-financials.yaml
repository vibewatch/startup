      - ["Realized pricing / ASP", "Cannot model hardware/software mix or margin", "Request signed pricing sheets and realized ASP by pilot and production contract", "blocking"]
      - ["Gross margin by stream", "Cannot assess path to profitable scale", "Request hardware, software, and services gross margin with assumptions", "blocking"]
      - ["Cap table and investor rights", "Cannot assess dilution, preference stack, or governance constraints", "Request current cap table and key preferred-share terms", "material"]
