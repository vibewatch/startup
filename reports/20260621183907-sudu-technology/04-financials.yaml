      - ["Customer pipeline and backlog", "Cannot evaluate demand visibility or GTM efficiency", "Request active pilots, signed rollouts, backlog value, and conversion funnel", "material"]
    notes: >-
      These missing metrics are the core reason the chapter's verdict remains disclosure-constrained despite a
      very large funding round.
