      - ["Compute / training infrastructure", "High", "Robot-brain training and iteration are compute-intensive even if public GPU budget is undisclosed", "medium", "Compute spend can compress runway without visible revenue offset"]
      - ["Prototype hardware and BOM iteration", "High", "Integrated hardware-software positioning implies repeated prototype and testing cycles", "medium", "Margins and burn stay opaque until BOM and failure-rate data are shared"]
      - ["Factory / tooling / Lingang setup", "Medium to high", "Public factory ambition implies tooling, equipment, and working-capital needs", "medium", "Scale-up could consume capital faster than a software-only company"]
