      - ["Next-round trigger", "Commercial proof", "Likely tied to independent deployments, pricing clarity, and repeatable revenue", "medium", "Headline funding alone is unlikely to sustain premium valuation indefinitely"]
    notes: >-
      This is an evidence-based scenario map, not a company-disclosed budget. It distinguishes between what
