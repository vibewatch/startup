      - ["Backlog / signed deployments", null, "low", "Signals demand visibility and working-capital planning", "Request backlog value, signed rollouts, and renewal/expansion data"]
    notes: >-
      The many nulls are themselves important findings. Public sources provide almost no underwriteable unit-
