callouts:
  - calloutType: "strength"
    title: "China National Policy Tailwind"
    body: "The 15th Five-Year Plan's elevation of embodied intelligence to a top-tier national strategic priority, alongside quantum and fusion energy, creates mandatory government coordination and unlocks $8.2B in AI investment funds — providing structural demand support for domestic players like Sudu."
    claimRefs: ["CM015", "CM016"]
  - calloutType: "risk"
    title: "Market Sizing Uncertainty"
    body: "Analyst estimates for the humanoid robot market vary by 4x or more ($38B to $165B by 2034-35), reflecting deep uncertainty about commercialization timelines. Sudu's SAM is further constrained to the robot brain software layer, which has no established market size benchmark."
    claimRefs: ["CM004", "CM005", "CM006", "CM009"]
  - calloutType: "insight"
    title: "China Production Scale Advantage"
    body: "China already accounts for 80% of global humanoid robot shipments through Unitree and AgiBot, creating a large domestic hardware ecosystem that needs robot brain software — Sudu's exact offering."
    claimRefs: ["CM020", "CM022"]
