- id: final-diligence-asks-and-kill-triggers
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: 'Exit optionality exists, but only in outline. MedCity reported that management is targeting a possible 2028 IPO, and the financing cadence shows Solace can attract credible growth investors. Still, the public record does not yet support an IPO-ready or control-sale-ready underwriting package because the core economic bridge remains hidden. The final diligence agenda is straightforward: obtain the payer mix, reimbursement waterfall, collections data, margin stack, and cap-table waterfall that explain what the >$1 billion headline actually buys. That same package determines the kill triggers. If reimbursement rules or payer willingness retreat, if commercial expansion proves shallow, or if future financing terms imply heavy seniority and thin upside to new money, the thesis breaks quickly. Conversely, if diligence shows durable reimbursement economics and clean terms, Solace could move from interesting story to actionable late-stage candidate. Until then, price-sensitive tracking
    is the disciplined stance.'
