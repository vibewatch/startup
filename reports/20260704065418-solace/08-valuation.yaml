  title: Valuation
  summary: 'Solace has a real late-stage financing breakout signal and credible patient-level traction, but the public record still does not disclose the revenue, margin, collections, or cap-table detail needed to underwrite the current >$1B mark cleanly. The right stance is track: the company looks strategically important, yet valuation appears stretched until private diligence closes the economics and term-structure gaps.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation, confidence, and price discipline
  body: 'Solace has earned a serious late-stage financing signal. The February 2026 Series C put the company above the $1 billion threshold, brought total funding to roughly $211 million, and was accompanied by tangible patient-level traction: more than 20,000 patients monthly, more than 2,000 advocates, and explicit claims of 10x year-over-year growth. That is enough to rule out a casual dismissal of the business. It is not enough to underwrite a buy at the current mark from public evidence alone. The record still lacks revenue, take rate, gross margin, burn, collection quality, and the exact preference stack behind the round. In other words, Solace looks more like a credible company with an under-documented price than a weak company with a flashy round. The right call is therefore track with medium confidence, high risk, and a stretched valuation stance: stay engaged because the wedge is real, but demand private-evidence confirmation or more attractive entry terms before treating the current
    round as investable.'
