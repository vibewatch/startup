- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: 'Covers the strongest valuation or scale signals visible in the retained healthcare-navigation corpus: Solace itself, the Accolade public and control outcomes, Garner''s two disclosed private rounds, and Included''s profitability signal. Several strategic competitors remain in the table as status references even when clean valuation data is unavailable.'
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Solace Series C
    - '>20k patients monthly; >2k advocates; $130M new capital'
    - '> $1B valuation in Feb 2026'
    - Live entry anchor and strongest signal that reimbursed advocacy has investor support.
    - Exact post-money, share count, and preferences are undisclosed.
  - - Accolade public market
    - ~$0.44B TTM revenue; public-navigation benchmark
    - ~$0.57B market cap on 2025-05-30 (~1.3x market-cap/revenue)
    - Shows how public markets have valued scaled navigation when profitability is weak.
    - Market cap is not enterprise value and public-market sentiment can understate strategic value.
  - - Transcarent / Accolade control outcome
    - Accolade sold at $621M; combined platform >20M members and >1,700 clients; Transcarent last private valuation ~$2.2B
    - Control deal plus strategic combination, not a minority financing
    - Useful strategic-clearing reference for category consolidation and breadth.
    - Control premium and combined-company scope make it an imperfect read-through for Solace.
  - - Garner Series D
    - 130% revenue growth; ~700 organizations; 2.5M members
    - $1.35B valuation in 2025
    - Proves private investors will still pay premium prices for fast-growing navigation assets.
    - Employer-first doctor-ranking model differs from Solace's Medicare-led advocacy wedge.
  - - Garner Series E
    - ~$200M gross ARR; almost 800 customers; growth more than doubled for five years
    - $2.74B valuation in 2026
    - Upper-end private comp for a much more monetized and disclosed navigation company.
    - Garner disclosed ARR and scale that Solace has not, so the headline multiple is not portable.
  - - Included Health
    - Profitable; double-digit growth; ~300 employers and health plans; no preference stack
    - Private scale and quality signal; no clean valuation in retained corpus
    - Shows the category can move toward profitability and cleaner cap-table construction.
    - No direct valuation mark in the retained corpus and a broader employer-care scope than Solace.
  notes: Comparable lens uses valuation signals where available and status signals where valuation is missing; this is intentional because the retained corpus does not support a single clean market multiple for navigation.
