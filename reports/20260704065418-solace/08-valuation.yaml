- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Relative valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Reimbursement stays durable, commercial coverage becomes meaningful, and Solace proves attractive platform economics on top of advocacy volume.
    - Supports about 1.6x to 2.5x the February 2026 valuation anchor over a multi-year hold, because the business would start to resemble top private navigation winners rather than public laggards.
    - Commercial expansion could remain shallow; labor intensity could still cap margins.
    - Possible but evidence-light until monetization and payer-mix disclosure improves.
  - - Base
    - Medicare-led adoption continues, payer relationships deepen, and Solace grows into the round without proving category-leading economics immediately.
    - Supports roughly 0.9x to 1.4x the February 2026 anchor; investors preserve value or earn only moderate upside unless disclosure quality improves.
    - Narrative remains stronger than model, limiting rerating.
    - Most plausible public-record case today.
  - - Bear
    - Reimbursement durability weakens, payer expansion stalls, or category multiples compress toward legacy navigation outcomes.
    - Supports about 0.4x to 0.8x the February 2026 anchor, with worse outcomes if future-round terms add heavy seniority.
    - Public comps and consolidation outcomes already show this path is plausible.
    - Not the base case, but too real to ignore given the disclosure gap.
  notes: Ranges are relative to the February 2026 mark because exact post-money, share count, and seniority are not publicly disclosed.
