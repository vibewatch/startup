- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Theme
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Reimbursed wedge
    - Solace has a differentiated reimbursed advocacy wedge rather than a pure cash-pay concierge model.
    - The exact take rate, denial profile, and reimbursement durability are still undisclosed.
    - Show code-level billing mechanics, realized rates, and stable collections by payer.
  - - Patient traction
    - 20k+ monthly patients and 2k+ advocates indicate real usage and supply-side depth.
    - Usage volume alone does not prove revenue quality or operating leverage.
    - Disclose revenue per patient month, utilization, and contribution margin by cohort.
  - - Category timing
    - Rising employer and payer pressure on cost and complexity makes navigation more relevant, not less.
    - Navigation has also become a crowded and consolidating market where broad platforms can outscale narrower wedges.
    - Prove Solace can win or partner into enterprise channels without losing economics.
  - - Comparable support
    - Garner and Included show investors will still reward scaled, high-quality navigation assets.
    - Those companies disclose more about ARR, profitability, or cap-table quality than Solace does publicly.
    - Match that disclosure standard or offer a valuation discount to compensate.
  - - Exit optionality
    - A 2028 IPO aspiration and strong syndicate suggest plausible future liquidity paths.
    - No public S-1, audited financials, or preference waterfall exists yet, so exit timing is narrative rather than evidence.
    - Show banker readiness, audit quality, and a cap table compatible with IPO or strategic-sale math.
  notes: Rows separate company-quality arguments from price-quality arguments so the recommendation remains disciplined.
