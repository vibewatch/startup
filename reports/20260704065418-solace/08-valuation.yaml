tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Breakout financing plus real patient traction, but economics and terms are still opaque.
    - Stay engaged; do not treat the current round as a public-record buy.
  - - Confidence
    - Medium
    - Funding and usage proof are credible; revenue, margins, and preference stack are not public.
    - Use this as an IC screening view, not a final approval.
  - - Risk rating
    - High
    - Reimbursement durability, collections quality, and future-round terms could change returns materially.
    - Require downside underwriting before any fresh entry.
  - - Valuation stance
    - Stretched
    - The >$1B mark rests on strong momentum but not on public revenue or margin disclosure.
    - A lower-price structure or stronger private evidence is needed to improve the call.
  - - Entry discipline
    - Diligence-only at current mark
    - The public record supports interest, not clean underwriting.
    - Prefer track, structured entry, or discounted secondary exposure over blind late-stage primary exposure.
  - - What changes the call
    - Economics + terms
    - Payer mix, take rate, margin, collections, and cap-table clarity would directly move fair value.
    - Upgrade only after that package is disclosed and consistent with premium outcomes.
  notes: 'This table is intentionally price-sensitive: strong company quality does not override weak economic disclosure at a unicorn-plus mark.'
