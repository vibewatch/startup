- id: comparable-valuation-lens
  title: Comparable valuation lens and why the current mark looks stretched
  body: 'The comp set argues for discipline, not disbelief. Accolade is the clearest public caution sign: roughly $0.44 billion of trailing revenue sat against about $0.57 billion of market cap in May 2025, and the company later sold to Transcarent for about $621 million. Even allowing for weak profitability and public-market pressure, that outcome shows that navigation scale alone does not command premium multiples when economics disappoint. Garner points in the other direction, but with a crucial difference: its 2025 and 2026 rounds reached $1.35 billion and $2.74 billion alongside 130% growth, about $200 million of gross ARR, and close to 800 customers. Included Health adds a separate quality signal because it says it is profitable, growing double digits, and has no preference stack. Fresh employer-market coverage also shows Included pushing navigation into alternative plan design with AI-guided primary-care routing and copay-first pricing, underscoring how broader navigation platforms
    are trying to own both care guidance and benefit structure. Solace currently resembles the category''s strongest private narrative more than its weakest public outcome, yet its public disclosure quality still looks closer to a story than to a model. That mismatch is why the current price feels stretched rather than absurd.'
