summary:
  headline: Solace 已搭起一个由报销支撑、具备真实全国规模的患者倡导平台，故事有吸引力；但核心经济性、付款方组合和 Series C 条款仍太不透明，公开记录目前只支持跟踪，而不是干净的后期承销。
