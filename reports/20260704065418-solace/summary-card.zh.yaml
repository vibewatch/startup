  topStrengths:
    - 保险覆盖的 Medicare 和 Medicare Advantage 倡导服务，拿掉了传统自费患者倡导服务的大部分消费者价格摩擦。
    - 对一家年轻公司来说，公开规模信号有分量：Solace 称其通过覆盖全部 50 个州、超过 2,000 名 advocate 的网络，每月服务超过 20,000 名患者。
    - 产品差异化看起来来自专属且由临床人员监督的倡导服务，以及强患者 / provider 证言，而不只是通用导航软件。
    - 可信投资人的近期融资，给了 Solace 扩张 advocate 网络、平台和 payer / provider 伙伴关系的资源。
  topRisks:
    - 公开披露仍缺收入、ARR、take rate、毛利率、回款质量、消耗、runway 和付款方组合，完整财务承销被卡住。
    - 报销能否持久，取决于与 CMS 对齐的计费规则、Medicare Advantage 计划设计、拒付、预授权，以及伙伴能否规模化落地运营。
    - 向商业险和雇主扩张时，Solace 要面对更广的导航服务既有玩家；这些公司把倡导服务与药房、虚拟护理、分析和单合同采购打包。
    - 独立安全保证、advocate 流失 / 个案负载数据，以及正式服务水平承诺，在公开材料里仍很薄。
  unresolvedGaps:
    - 当前收入或 ARR、take rate、毛利率、消耗、runway、理赔回款表现，以及拒付 / 申诉结果。
    - 精确 Series C 投后估值、完全摊薄股数、清算优先权、任何债务或老股组件，以及投资人控制条款。
    - 付款方组合、sponsor 集中度、留存和续约指标，以及早期扩张表述之外的具体商业险或雇主牵引。
    - 独立安全和审计证据、事件历史、advocate 资质组合、流失率、个案负载和响应时间 SLA。
