- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Reimbursement integrity
    - Paid-claim rate, audit exceptions, and recoupments for CMS-aligned services
    - Any CMS or MA audit finding, or denial/recoupment rates above 10% for two consecutive quarters
    - Cut revenue expectations and require billing-remediation proof before underwriting more upside.
  - - Coverage breadth
    - Named plan coverage, top-payer concentration, and commercial mix
    - Top payer above 40% of revenue or no material commercial mix progress after 12 months
    - Treat payer concentration as a thesis limiter rather than a temporary launch issue.
  - - Security and trust
    - Independent audit scope, incident log, and breach disclosure
    - Material PHI incident, failed external audit, or inability to produce control evidence
    - Treat as a thesis break because privacy trust is foundational to the product.
  - - Workforce capacity
    - Advocate attrition, caseloads, supervisor ratios, and patient-response times
    - Attrition above 20%, median response time above two business days, or falling oversight ratios
    - Lower growth assumptions and require an operating-stability plan.
  - - Network / access execution
    - In-network specialist success rate and repeated directory failures
    - Persistent appointment-failure rates above 15% in priority specialties
    - Assume lower outcome delivery and weaker retention for affected cohorts.
  - - Partner-led expansion
    - Referral conversion from payer/provider partnerships
    - No material embed wins or weak pilot conversion despite financing and announced strategy
    - Reduce commercial and enterprise upside, and underwrite Solace primarily as a narrower Medicare service.
  notes: These thresholds are investor-side kill criteria, not management guidance. They are intended to convert the fetched public evidence into concrete monitoring rules during diligence and post-investment tracking.
