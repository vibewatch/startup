  title: Risks
  summary: 'Solace Health''s main residual risks come from reimbursement and execution dependencies rather than near-term capital scarcity: CMS-aligned billing rules, plan-by-plan Medicare Advantage coverage, HIPAA-grade data handling, advocate-labor scaling, and payer/provider partner reliance all sit between strong demand signals and durable realized outcomes. The company has real mitigants—clinician supervision, national reach, large recent financings, and explicit privacy controls—but public evidence remains thin on payer concentration, claim-denial performance, security audit detail, and advocate attrition, so diligence should use tight kill criteria around reimbursement leakage, service-quality drift, and any trust-breaking incident.'
