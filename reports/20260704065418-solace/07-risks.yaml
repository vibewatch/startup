  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payer-concentration-gap
    missingEvidence: Revenue, utilization, and margin concentration by top payer and plan type.
    whyItMatters: Without payer concentration data, investors cannot distinguish diversified reimbursement from hidden dependence on a few Medicare Advantage contracts.
    diligencePath: Request top-10 payer mix, plan-level paid-claim volume, and commercial versus Medicare / MA contribution by quarter.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: workforce-gap
    missingEvidence: Advocate attrition, caseload distribution, supervisor ratios, and response-time SLAs.
    whyItMatters: Solace sells continuity and judgment, so labor strain could degrade outcomes before topline growth visibly slows.
    diligencePath: Request monthly staffing dashboard data, regretted attrition, caseload percentiles, and supervisor-to-advocate ratios by program.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: security-gap
    missingEvidence: Independent audit detail, pentest summaries, incident history, and BAA / subprocessors evidence.
    whyItMatters: Public HIPAA positioning alone is insufficient to size residual trust and breach risk for a data-heavy virtual platform.
    diligencePath: Review most recent external audit package, penetration-test remediations, incident log, and vendor-management controls.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: claims-data-gap
    missingEvidence: Plan-level denial, prior-authorization, approval, appeal, and recoupment metrics.
    whyItMatters: The core reimbursement-risk question cannot be closed without knowing how often Solace's workflow converts into approved, paid services across plans.
    diligencePath: Request payer-level funnel data from eligibility check through authorization, claim payment, appeal, and cash collection.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: legal-status-gap
    missingEvidence: Direct confirmation of any Solace-specific lawsuit, OCR action, or material breach history.
    whyItMatters: Absence of a fetched public event is not the same as clean legal or security history, and investors need explicit confirmation on this risk surface.
    diligencePath: Run counsel-backed litigation, enforcement, and breach diligence plus management representation letters covering the last three years.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
