sections:
- id: risk-overview-and-model-exposure
  title: Risk Overview and Model Exposure
  body: Solace's risk stack is shaped by the fact that the product sits in the messy middle of U.S. healthcare rather than at a clean software endpoint. The company can grow quickly—recent coverage cites more than 2,000 advocates, more than 20,000 patients served monthly, a $130 million Series C, and a valuation above $1 billion—but those top-line signals do not remove the structural frictions that determine whether advocacy time actually turns into reimbursed, high-quality, trusted service. The core question is not whether people need help navigating care; the fetched evidence strongly suggests they do. The question is whether Solace can keep its clinician-supervised, high-touch model compliant, consistent, and economically durable while operating inside Medicare rules, Medicare Advantage plan restrictions, provider-network chaos, and a labor-intensive service model. The heatmap therefore places reimbursement integrity, workforce scaling, and trust assurance in the highest residual-severity
    cells because those risks can simultaneously hit outcomes, paid utilization, and commercial credibility.
  claimRefs:
