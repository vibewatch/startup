chapter:
  number: 1
  title: Company Overview
  summary: Solace Health is a 2022-founded virtual healthcare advocacy platform created by Jeremy Gurewitz and Sara Sargent that has scaled from an early Medicare-focused navigator into a >$1 billion, Series C-backed company. Public sources support national virtual delivery, >2,000 advocates, and >20,000 patients served monthly by early 2026, but they do not disclose revenue, cap-table details, or a cleanly audited cumulative patient count.
sections:
- id: identity-and-delivery-model
  title: Identity and Delivery Model
  body: 'Solace Health was founded in 2022 by Jeremy Gurewitz and Sara Sargent after Gurewitz’s experience helping his mother navigate pancreatic cancer care. Funding releases identify the company as based in Redwood City, California, while the official marketing site emphasizes mission rather than corporate location. The core offering is a virtual advocacy platform: patients typically complete a short physician intake, get matched to one dedicated advocate, and continue working with that advocate over text, phone, video, and asynchronous follow-up. Official pages consistently position Solace as insurance-covered healthcare advocacy, anchored in Medicare and many Medicare Advantage plans, with commercial-insurance expansion beginning to appear in 2026 materials. The company also presents a more formal clinical wrapper than a pure marketplace. Solace Health Medical Group is described as a clinician-led provider group delivering services nationwide under physician and psychologist oversight,
    and the company’s trust materials say the platform is HIPAA-compliant, encrypted, and limited to the minimum necessary PHI. The important nuance is role definition: advocates do substantial administrative and coordination work, but Solace repeatedly says they do not diagnose, prescribe, or replace treating physicians.'
