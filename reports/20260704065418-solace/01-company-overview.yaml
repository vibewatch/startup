  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: advocate-credentials
    missingEvidence: A current credential mix for active advocates, broken out by RN, LCSW, physician, psychologist, and other licensed staff.
    whyItMatters: Credential mix affects clinical scope, reimbursement defensibility, operational staffing, and later market-comparison claims.
    diligencePath: Request an active advocate roster by license type plus any supervising-clinician ratio and state-practice matrix.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board roster, founder ownership, investor board seats, protective provisions, and any observer rights.
    whyItMatters: Control rights and board composition determine who can shape strategy, financing terms, and founder succession risk.
    diligencePath: Obtain the current cap table, charter, investor-rights agreement, and latest board-consent package from management.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-precision
    missingEvidence: Exact post-money valuation, share count, option-pool refresh, and liquidation stack for the 2026 Series C.
    whyItMatters: A public >$1B headline is directionally useful, but pricing discipline and return scenarios depend on exact security terms.
    diligencePath: Review the Series C term sheet, stock purchase agreement, and capitalization table immediately after close.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Disclosure of debt facilities, venture credit, founder or investor secondary sales, and exact ownership percentages.
    whyItMatters: These terms directly affect dilution, seniority, downside protection, and realized liquidity before any future exit.
    diligencePath: Ask for a financing-history schedule that reconciles equity rounds, debt, SAFEs/notes, and any secondary transactions.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: cumulative-reach
    missingEvidence: A single management-defined cumulative patient metric with a frozen denominator and distinction between patients, families, and accounts.
    whyItMatters: Inconsistent reach counters can inflate traction narratives and complicate market-share or cohort-quality analysis later in the report.
    diligencePath: Request a monthly historical utilization table showing unique patients, family accounts, and active advocates by month.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, gross margin, payer mix, headcount, and office-location data are absent from public sources.
    whyItMatters: Without operating metrics, investors cannot judge efficiency, burn, organizational scale, or how much the >$1B valuation rests on future expectations.
    diligencePath: Request board materials or data-room metrics covering ARR/revenue, gross margin, active users, headcount, and geographic staffing mix.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: Internal launch chronology, provider-partnership milestones, and any formal complaint, litigation, or enforcement history beyond public web traces.
    whyItMatters: The company overview can ship with a public chronology, but later diligence on operating risk and go-to-market execution benefits from a fuller timeline.
    diligencePath: Ask management for a board-level timeline of product launches, payer/provider wins, and any material disputes or compliance events.
    relatedQuestionRefs:
    - QO023
    - QO026
    relatedTableRefs:
    - TO004
