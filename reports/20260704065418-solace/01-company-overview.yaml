- id: milestones-and-open-gaps
  title: Milestones, Regulatory Context, and Open Gaps
  body: 'The milestone record that later chapters should reuse starts before incorporation. Gurewitz’s mother’s 2016 pancreatic-cancer diagnosis and 2018 death supply the company’s founding narrative, and Solace was formally launched in 2022 around the idea that patients need help between diagnosis and treatment. The next major unlock was not only capital but reimbursement context: Solace’s own help-center materials tie its insurance-covered model to 2024 Medicare policy changes, and CMS’s 2024 physician-fee-schedule rule did create separately payable Principal Illness Navigation services involving care navigators and auxiliary personnel under practitioner supervision. By 2026, Solace had combined that reimbursement tailwind with payer/provider partnership ambitions and unicorn financing. The adverse record is comparatively light in retained sources: no corroborated layoffs, sanctions, or litigation surfaced here. Instead, the external caution signs are softer—mixed low-tier reviews about
    eligibility limits, virtual-only delivery, and administrative variability. The bigger diligence gaps are economic and governance: exact valuation mechanics, cap table, debt or secondary activity, board rights, revenue, and a precise audited cumulative reach number all remain outside public view.'
