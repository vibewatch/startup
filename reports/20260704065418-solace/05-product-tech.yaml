- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: 'Layered view of the public Solace stack: access and intake on top, clinician-supervised orchestration in the middle, and EHR/billing infrastructure below.'
  data:
    layers:
    - id: access-layer
      label: Access and intake layer
      detail: Patient and provider entry surfaces handle eligibility checks, referrals, and scheduling for the first virtual intake.
      sublayers:
      - id: eligibility
        label: Eligibility check
        detail: Website flow to confirm Medicare, Medicare Advantage, and expanding commercial coverage.
      - id: referral
        label: Referral channels
        detail: Provider referrals via website, email, or fax with intake usually available within 48 hours.
    - id: clinical-layer
      label: Clinical orchestration layer
      detail: Solace physician or psychologist performs intake and connects the patient to a dedicated advocate under clinician supervision.
      sublayers:
      - id: intake-visit
        label: Virtual clinician intake
        detail: Short virtual visit establishes fit and directs the case.
      - id: matching
        label: Advocate matching
        detail: Dedicated advocate is paired based on background, need, and goals.
    - id: execution-layer
      label: Advocate execution layer
      detail: Advocates run communication, scheduling, record gathering, appeals, care coordination, and family updates over time.
      sublayers:
      - id: communications
        label: Remote communication
        detail: Phone, video, text, email, secure messaging, and virtual visits.
      - id: playbooks
        label: Workflow playbooks
        detail: Scheduling, referrals, prior auth, billing disputes, transitions, and resource navigation.
    - id: platform-layer
      label: Data and reimbursement layer
      detail: Public materials point to a proprietary EHR / data platform, patient notes, and Medicare billing enablement beneath the service workflow.
      sublayers:
      - id: ehr
        label: Solace EHR / EMR
        detail: Advocates log updates and connect patient history across the case.
      - id: billing
        label: Billing infrastructure
        detail: Technology handles Medicare billing and supports the platform’s reimbursement share.
