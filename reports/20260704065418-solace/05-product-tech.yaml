- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Eligibility + intake flow
    - Patient / referring provider
    - Live and nationally deployed
    - Rapid coverage check plus short virtual clinician intake before matching
    - Exact conversion funnel and abandonment rates are undisclosed
  - - Dedicated advocate service
    - Patient / family caregiver
    - Core live service
    - One matched advocate stays with the case instead of one-off call-center support
    - Backup coverage rules and caseload norms are not public
  - - Remote communication workspace
    - Patient / advocate / family
    - Live
    - Phone, video, text, email, virtual visits, notes, and family loop-ins support continuity
    - No response-time SLA or channel-level availability metrics are public
  - - Advocacy workflow playbooks
    - Advocate
    - Live across many use cases
    - Single operating model spans appointments, records, prior auth, billing, transitions, and resources
    - No public productivity, resolution-time, or outcomes-per-playbook data
  - - Solace EHR / patient notes layer
    - Advocate / clinician
    - Live but thinly disclosed
    - Company says advocates log updates in a proprietary EHR / EMR environment
    - No public data model, interoperability standard, or connector list
  - - Medicare billing enablement
    - Clinician / advocate / finance
    - Live
    - Technology handles Medicare billing and allows Solace to retain a reimbursement share
    - No public detail on codes, denial rates, or claims operations stack
  - - Clinical oversight layer
    - Solace physician / psychologist
    - Live
    - Clinician-led intake and incident-to style supervision make the service legible to payers
    - Supervision ratios, documentation standards, and escalation criteria are undisclosed
  - - Content + education surface
    - Patient / caregiver
    - Active but adjunct
    - Articles and explainers broaden top-of-funnel trust and literacy
    - Not a substitute for product release notes or technical documentation
