  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-continuity
    missingEvidence: Public SLA detail for urgent-response expectations, advocate backup coverage, and continuity when a matched advocate is unavailable.
    whyItMatters: Workflow reliability is central to a high-touch service; vague continuity language makes implementation risk harder to underwrite.
    diligencePath: Request operating playbooks covering response-time targets, after-hours escalation, advocate handoff rules, and patient-facing SLA language.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE002
    - TE004
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Independent proof of certifications, penetration testing, breach history, detailed privacy notice content, and any uptime or incident-response commitments.
    whyItMatters: The chapter can describe company-reported HIPAA practices, but trust underwriting needs more than self-attested security copy and a Vanta link.
    diligencePath: Request SOC 2/HITRUST status, third-party assessment reports, incident history, privacy notice text, and public or contractual uptime commitments.
    relatedQuestionRefs:
    - QE017
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: platform-architecture
    missingEvidence: Named cloud providers, interoperability standards, API coverage, provider EHR connectors, data model details, and internal observability architecture.
    whyItMatters: The public record proves an EHR/data/billing layer exists but not how defensible, portable, or integration-ready that stack really is.
    diligencePath: Request architecture diagrams, integration inventories, API docs, interoperability standards, security architecture, and provider/payer connector list.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
    - TE005
  - type: conflicting-data
    severity: material
    topic: advocate-credential-mix
    missingEvidence: A clean roster breakdown showing how many advocates are RNs versus LCSWs or other licensed clinical staff, plus supervision ratios and specialization metadata.
    whyItMatters: Solace’s differentiation partly depends on clinician quality; inconsistent public descriptions make staffing quality and scope boundaries harder to verify.
    diligencePath: Request advocate credential mix, active-versus-total roster counts, specialization categories, training standards, and clinician-supervision protocols.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
