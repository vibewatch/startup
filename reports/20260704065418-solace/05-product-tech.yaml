chapter:
  number: 5
  title: Product & Technology
  summary: Solace’s product is a clinician-supervised advocacy workflow delivered nationally through remote communication, a dedicated advocate model, and a lightly disclosed EHR/billing stack. The service looks commercially scaled and reimbursement-aware, but public technical details, independent security proof, and release discipline remain materially under-disclosed.
sections:
- id: product-definition-and-customer-workflow
  title: Product definition and customer workflow
  body: 'Solace’s product is best understood as a clinician-supervised healthcare advocacy workflow rather than a standalone consumer app. The patient-facing journey starts with an eligibility or story intake, continues through a short virtual clinician visit, and then hands off to a dedicated advocate matched to the patient’s needs. From there, delivery becomes high-touch and ongoing: Solace says advocates work by phone, video, text, email, virtual visits, and secure messaging, while the advocate also keeps doing unseen work between touchpoints. The service surface is broad but coherent. Official pages repeatedly describe the same jobs—scheduling, referrals, paperwork, medical-record organization, prior authorization, billing disputes, care coordination, transitions, and local-resource sourcing—showing that Solace sells one repeatable advocacy model across many use cases instead of a menu of disconnected tools. The workflow is also deliberately bounded. Solace is explicit that advocates
    do not diagnose, prescribe, replace the treating physician, or provide legal advice, which is important when reconciling the platform’s clinically trained workforce with its non-diagnostic role. Public pages also emphasize persistence: the same advocate can stay involved for as long as needed, and the company frames that continuity as part of the product rather than an add-on service tier. That continuity matters because many of Solace’s use cases—second opinions, prior-auth fights, billing disputes, and care transitions—unfold over days or weeks rather than within a single call.'
