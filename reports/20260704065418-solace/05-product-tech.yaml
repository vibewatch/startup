- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Solace solution
  - Measurable benefit
  - Limitation
  rows:
  - - New diagnosis navigation
    - Patient must gather records, find specialists, and organize next steps alone
    - Dedicated advocate researches options, finds specialists, prepares questions, and can join visits remotely
    - Shorter time-to-care is the stated goal
    - No public before/after cycle-time data
  - - Appointment and referral coordination
    - Patients and families chase offices and paperwork themselves
    - Advocate schedules appointments, coordinates referrals, and makes follow-up calls
    - Reduces administrative burden on patient
    - Provider office integration depth is undisclosed
  - - Prior authorization and coverage appeals
    - Patients face payer red tape and denial appeals directly
    - Advocate prepares documentation, works with clinicians/insurers, and keeps follow-up moving
    - Can unblock treatments or equipment faster
    - Denial-overturn rate is not public
  - - Billing disputes and claims support
    - Patients review confusing bills or denied claims alone
    - Advocate reviews bills, negotiates, and files appeals
    - Potential cost savings and reduced financial stress
    - No public savings distribution or win-rate disclosure
  - - Care coordination / transitions
    - Multiple providers often fail to share records or plans cleanly
    - Advocate organizes records, clarifies instructions, and supports care handoffs
    - Lower fragmentation and better continuity
    - No public readmission or transition KPI set
  - - Community-resource coordination
    - Transportation, housing, or support-group needs are handled ad hoc
    - Advocate helps identify health-related social supports and local resources
    - Extends the product beyond the clinic walls
    - Community resource coverage depth is not enumerated publicly
  notes: Benefit statements reflect the outcomes Solace says it is trying to drive; most row-level KPIs remain undisclosed publicly.
