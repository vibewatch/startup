  topStrengths:
    - >-
      Insurance-covered Medicare and Medicare Advantage advocacy removes much of the consumer price friction that
      constrains traditional cash-pay patient-advocacy services.
    - >-
      Public scale signals are meaningful for a young company: Solace says it serves more than 20,000 patients monthly
      through a network of more than 2,000 advocates across all 50 states.
    - >-
      The product appears differentiated by dedicated, clinician-supervised advocacy and strong patient/provider
      testimonial proof rather than generic navigation software alone.
    - >-
      Recent financing from credible investors gives Solace resources to expand its advocate network, platform, and
      payer/provider partnerships.
  topRisks:
    - >-
      Public disclosure still omits revenue, ARR, take rate, gross margin, collections quality, burn, runway, and payer
      mix, blocking a full financial underwrite.
    - >-
      Reimbursement durability depends on CMS-aligned billing rules, Medicare Advantage plan design, denials, prior
      authorizations, and partner operationalization at scale.
    - >-
      Commercial and employer expansion faces broader navigation incumbents that bundle advocacy with pharmacy, virtual
      care, analytics, and one-contract procurement.
    - >-
      Independent security assurance, advocate attrition/caseload data, and formal service-level commitments remain thin
      in public materials.
  unresolvedGaps:
    - >-
      Current revenue or ARR, take rate, gross margin, burn, runway, claims-collection performance, and denial/appeal
      outcomes.
    - >-
      Exact Series C post-money valuation, fully diluted share count, liquidation preferences, any debt or secondary
      components, and investor control terms.
    - >-
      Payer mix, sponsor concentration, retention and renewal metrics, and concrete commercial or employer traction
      beyond early expansion messaging.
    - >-
      Independent security and audit evidence, incident history, advocate credential mix, attrition, caseloads, and
      response-time SLAs.
