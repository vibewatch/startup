      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              保留下来的官方来源给出了一幅范围很窄但清楚的领导层画像。创始人仍站在台前：Jeremy Gurewitz 是公开 CEO，也承载公司起源叙事；Sara Sargent 是联合创始人兼 Chief Product
              Officer。临床侧，Solace 公开点名 John Taylor 担任 Chief Medical Officer、Mark Upton 担任 Medical
              Director，强化公司希望把倡导服务嵌进由医生监督的照护管理结构，而不是放在其旁边。同样重要的是未公开的部分。在保留来源中，Solace
              没有披露公开董事会名单、创始人持股、投资人董事权利，或创始人与医疗领导之外更广泛的职能负责人。对于一家已经拿到后期风险资本的公司，这构成实质尽调盲区，也带来关键人物风险：Gurewitz 和 Sargent
              看起来掌握了大部分公开战略叙事、产品论点和投资人信息，因此任何离任或角色扰动都可能重大。后续章节的实用结论是：Solace 看起来由创始人主导、受临床监督，但从公开市场视角看，治理并不透明。
