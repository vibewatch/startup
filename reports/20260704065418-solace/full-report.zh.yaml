      - number: '7.3'
        title: 运营、安全与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Solace 是人在回路中的照护平台，失败画像与自助式 SaaS 产品很不一样。公司称自己符合 HIPAA、数据处理加密、只采集最低必要
              PHI，但公开证据没有给出投资人评估剩余安全风险所需的独立审计细节、事故历史或控制测试。如果 OCR 最终落地近期医疗法律评论所述的 HIPAA Security Rule
              变化，年度审计、资产清单、MFA、加密和更快商业伙伴通知会进一步抬高控制负担。服务交付也从根本上是远程的：Solace
              靠电话、视频、短信和邮件工作，倡导员在屏幕外协调大量就医流程。效率可能更高，但也暴露在分诊错误、跟进不一致，以及不信任远程医疗重模式的患者质疑之下。检索语料中最不利的公开信号，并非已经坐实的不当行为指控，而是较软的提醒：投诉往往集中在行政不一致、资格意外和可用性约束。这些摩擦，正是重服务扩张快于监督、QA
              和人员配置纪律时会被放大的问题。
