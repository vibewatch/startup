          detail: 界定可支付导航服务和照护管理条件。
        - id: ma
          label: Medicare Advantage 计划
          detail: 设定资格、事先授权和网络规则。
        - id: providers
          label: 医疗服务方网络 / 目录
          detail: 预约网内照护需要外部供给。
        - id: clinicians
          label: 监督临床医生
          detail: 医生和心理学家锚定合规服务交付。
        - id: partners
          label: 支付方 / 医疗服务方合作伙伴
          detail: 更早嵌入和规模化转诊需要它们。
        - id: commercial
          label: 商业买方
          detail: 未来雇主和非 Medicare 增长路径。
        - id: incumbents
          label: 导航服务存量玩家
          detail: Quantum Health 和 Transcarent 已经规模化销售。
      edges:
        - from: cms
          to: solace
        - from: ma
          to: solace
        - from: providers
          to: solace
        - from: clinicians
          to: solace
        - from: partners
          to: solace
        - from: commercial
          to: partners
        - from: incumbents
          to: commercial
    approximationNotes: 该图映射控制点，而非法律所有权。实践中多项依赖会相互强化，但图形为保留单向因果可读性而作了简化。
    claimRefs:
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR043
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链从融资和牵引力证明出发，经过披露缺口和品类风险，落到观察建议。
    data:
      nodes:
        - id: n1
          label: 突破性融资
          type: input
          detail: Series C 以 >$1B 估值募集 $130M，累计融资约 $211M。
        - id: n2
          label: 牵引力证明
          type: process
          detail: 每月 20k+ 患者、2k+ 倡导员和 10x 增长显示真实采用。
        - id: n3
          label: 报销切入点
          type: process
          detail: 可变分成的 Medicare 计费，加上 MA 和选择性商业保险覆盖，拼出差异化赛道。
        - id: n4
          label: 披露缺口
          type: process
          detail: 收入、利润率、回款和股权结构条款仍未披露。
        - id: n5
          label: 可比公司重估风险
          type: process
          detail: Accolade 和更广泛的导航服务可比公司显示，仅有规模并不保证高溢价结果。
        - id: n6
          label: 建议：观察
          type: output
          detail: 继续紧跟公司，但没有私下尽调或更好的入场价格纪律，就不要按当前估值下判断。
      edges:
        - from: n1
          to: n2
          label: 由此支撑
        - from: n2
          to: n3
          label: 进一步增强
        - from: n3
          to: n4
          label: 仍受阻于
        - from: n4
          to: n5
          label: 风险又被放大
        - from: n5
          to: n6
          label: 迫使保持纪律
    approximationNotes: 这是一张投委会逻辑图，不是确定性模型；每个节点都把多条公开事实压缩成一个关口判断。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV039
      - CV041
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 相对 February 2026 锚点，展示公开记录中主要驱动因素对价值的示意性相对影响。
    data:
      items:
        - label: 商业保险扩张被证明有实质规模
          value: 0.5
          detail: 如果商业保险覆盖成为有意义的第二增长曲线，估值会被正向重估。
        - label: 抽成率和利润率披露变清楚
          value: 0.6
          detail: 最大上行驱动，因为它把使用量转成可投资的经济性。
        - label: 独立结果证明出现
          value: 0.2
          detail: 有帮助，但不如收入质量和报销耐久性关键。
        - label: 公开导航服务可比公司继续压缩
          value: -0.5
          detail: 如果品类定价继续向 Accolade 式结果靠拢，就是下行因素。
        - label: 回款或拒付表现令人失望
          value: -0.7
          detail: 最大下行驱动，因为报销摩擦会摧毁市场感知的经营杠杆。
    approximationNotes: 数值是分析师式相对影响估计，以相对当前锚点的方向性倍数变化表示，不是已观察到的市场变动。
    claimRefs:
      - CV012
      - CV013
      - CV016
      - CV020
      - CV022
      - CV023
      - CV041
      - CV043
      - CV044
      - CV045
      - CV047
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 相对 February 2026 估值锚点的低 / 基准 / 高结果，而不是给出虚假的美元精度。
    data:
      items:
        - label: 悲观结果（相对 Feb-2026 估值标记）
          low: 0.4
          base: 0.6
          high: 0.8
          unit: x
          note: 报销或可比公司压力把业务推向公开导航服务的出清水平。
        - label: 基准结果（相对 Feb-2026 估值标记）
          low: 0.9
          base: 1.1
          high: 1.4
          unit: x
          note: Solace 兑现本轮增长预期，但尚未证明品类领先的经济性。
        - label: 乐观情景相对 2026 年 2 月估值
          low: 1.6
          base: 2
          high: 2.5
          unit: x
          note: 商业化扩张和强劲的单位经济模型，支撑私有市场溢价结果。
        - label: 当前公开参照
          low: 1
          base: 1
          high: 1
          unit: x
          note: 投后估值和股数没有披露，因此该锚点是概念性参照，不是精确值。
    approximationNotes: 区间值只是后期投资测算用的相对回报经验估算；除未披露的 Series C 条款可能已经内含的稀释外，不再考虑未来稀释。
    claimRefs:
      - CV006
      - CV036
      - CV041
      - CV043
      - CV044
      - CV045
      - CV046
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 一张 IC 风格快照：一边是 Solace 的品类优势，一边是当前公开证据缺口。
    data:
      items:
        - label: 市场需求
          value: 8/10
          detail: 可负担性压力真实存在，市场对引导式导航的需求也在上升。
        - label: 患者 / 产品验证
          value: 8/10
          detail: 以一家年轻公司看，月度患者、医疗倡导员和消费者验证信号都很强。
        - label: 报销护城河
          value: 7/10
          detail: Medicare 支撑的倡导服务有差异化，但可持续性还要直接尽调验证。
        - label: 经济性可见度
          value: 3/10
          detail: 收入、利润率、回款和烧钱速度仍未披露。
        - label: 执行 / 政策风险
          value: 4/10
          detail: 交付高度依赖人力，又依赖报销，风险仍然偏高。
        - label: 估值吸引力
          value: 3/10
          detail: 以公开记录实际能支撑的内容看，当前估值显得偏高。
        - label: 证据质量
          value: 4/10
          detail: 最强主张仍更多来自融资叙事和公司口径，而不是独立建模。
    approximationNotes: 评分是基于留存材料做出的 IC 判断输入，不是管理层披露的 KPI。
    claimRefs:
      - CV006
      - CV009
      - CV010
      - CV016
      - CV020
      - CV022
      - CV039
      - CV046
