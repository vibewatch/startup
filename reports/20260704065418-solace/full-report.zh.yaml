              竞争风险不是 Solace 缺少真人倡导，而是更大的平台现在把倡导服务与 PBM、虚拟照护、AI
              分诊、分析和单点方案编排一起打包进一份面向雇主的合同。没有公开留存和合同数据，很难判断当买方想要完整技术栈时，Solace 的韧性有多强。
