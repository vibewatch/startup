  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the strongest valuation or scale signals visible in the retained healthcare-navigation corpus: Solace
        itself, the Accolade public and control outcomes, Garner's two disclosed private rounds, and Included's
        profitability signal. Several strategic competitors remain in the table as status references even when clean
        valuation data is unavailable.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 限制
    rows:
      - - Solace Series C
        - 每月 >20k 名患者；>2k 名倡导员；$130M 新资本
        - 2026 年 2 月估值 > $1B
        - 当前入场锚点，也是可报销倡导服务获得投资人支持的最强信号。
        - 具体投后估值、股份数和优先权未披露。
      - - Accolade 公开市场
        - ~$0.44B TTM 收入；公开导航基准
        - 2025-05-30 市值 ~$0.57B（约 1.3x 市值 / 收入）
        - 显示盈利能力较弱时，公开市场如何给规模化导航定价。
        - 市值不是企业价值，公开市场情绪也可能低估战略价值。
      - - Transcarent / Accolade 控制权结果
        - Accolade 以 $621M 出售；合并平台拥有 >20M 会员和 >1,700 家客户；Transcarent 最近一次私募估值 ~$2.2B
        - 控制权交易叠加战略合并，不是少数股融资
        - 可作为品类整合和平台宽度的战略出清参照。
        - 控制权溢价和合并公司范围，使其对 Solace 的映射并不完美。
      - - Garner Series D
        - 收入增长 130%；~700 个组织；2.5M 会员
        - 2025 年估值 $1.35B
        - 证明私募投资人仍愿为快速增长的导航资产支付溢价。
        - 以雇主为先的医生排名模型，不同于 Solace 由 Medicare 带动的倡导切入点。
      - - Garner Series E
        - ~$200M 总 ARR；近 800 家客户；连续五年增长超过一倍
        - 2026 年估值 $2.74B
        - 这是变现和披露都更充分的导航公司，构成私营可比对象上沿。
        - Garner 披露了 Solace 尚未披露的 ARR 和规模，因此标题倍数不能直接套用。
      - - Included Health
        - 已盈利；两位数增长；~300 家雇主和健康计划；无优先股堆叠
        - 私营规模和质量信号；留存资料中没有干净估值
        - 说明该品类可以走向盈利，并形成更干净的股权结构表。
        - 留存资料中没有直接估值标记，且雇主医疗服务范围比 Solace 更宽。
    notes: 可比视角在有估值信号时使用估值信号，估值缺失时使用状态信号；这是有意为之，因为留存资料无法支持单一干净的导航市场倍数。
