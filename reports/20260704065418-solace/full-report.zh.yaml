chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与交付模式
        blocks:
          - type: paragraph
            body: >-
              Solace Health 由 Jeremy Gurewitz 和 Sara Sargent 于 2022 年创立，起点是 Gurewitz 帮助母亲应对胰腺癌治疗时的亲身经历。融资稿称公司位于加州
              Redwood City，官网营销页则更强调使命而非公司所在地。核心产品是一套虚拟倡导平台：患者通常先完成简短的医生接诊评估，再匹配一名专属倡导员，并持续通过短信、电话、视频和异步跟进与其协作。官方页面一致把
              Solace 定位为由保险覆盖的医疗倡导服务，以 Medicare 和许多 Medicare Advantage 计划为锚；2026
              年材料开始出现商业保险扩张。公司呈现出的临床外壳也比纯撮合平台更正式。Solace Health Medical Group
              被描述为由临床医生主导的医疗服务团队，在医生和心理学家监督下全国交付服务；公司的信任材料称平台符合 HIPAA、加密处理数据，并把 PHI 限制在最低必要范围。关键细节在角色边界：倡导员承担大量行政和协调工作，但
              Solace 反复强调他们不诊断、不开处方，也不替代主治医生。
