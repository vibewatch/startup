      - 核心假设
      - 相对估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 报销路径保持稳定，商业保险覆盖开始贡献实质增量，Solace 在倡导服务量之上跑出有吸引力的平台经济性。
        - 若持有多年，可支撑约为 2026 年 2 月估值锚点 1.6x 至 2.5x 的结果；届时业务更像顶级私营导航赢家，而非公开市场落后者。
        - 商业扩张可能仍停在浅层；人力强度仍可能压住利润率。
        - 存在可能，但在变现和支付方结构披露改善前，证据偏薄。
      - - 基准
        - Medicare 带动的采用延续，支付方关系加深；Solace 通过增长消化本轮估值，但短期内尚未证明品类领先经济性。
        - 支撑约为 2026 年 2 月锚点 0.9x 至 1.4x 的结果；除非披露质量改善，投资人更多是保值，或只获得温和上行。
        - 叙事强于模型，限制重新定价。
        - 按当前公开记录看，这是最可能的情景。
      - - 悲观
        - 报销稳定性削弱，支付方扩张停滞，或品类倍数向传统导航结果压缩。
        - 支撑约为 2026 年 2 月锚点 0.4x 至 0.8x 的结果；如果未来轮次条款加入过重优先权，结果会更差。
        - 公开可比公司和整合交易结果已经说明，这条路径并非小概率想象。
        - 不是基准情景，但考虑披露缺口，现实到不能忽视。
    notes: 区间相对于 2026 年 2 月估值标记，因为精确的投后估值、股份数和优先级尚未公开披露。
