      - number: '8.4'
        title: 退出准备度、尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              退出可选性存在，但目前只有轮廓。MedCity 报道称，管理层以 2028 年可能 IPO 为目标；融资节奏也显示 Solace 能吸引可信的成长型投资人。即便如此，公开记录还不足以支撑一套具备 IPO
              条件或具备控制权出售条件 的承销包，因为核心经济桥梁仍被遮住。最终尽调议程很直接：拿到支付方组合、报销分配瀑布、回款数据、利润率结构和股权结构分配瀑布，解释 >$1 billion
              这个头条究竟买到了什么。同一套材料也决定否决触发点。如果报销规则或支付方意愿后退、商业保险扩张偏浅，或未来融资条款意味着高优先级和新钱上行空间偏薄，投资逻辑会很快破裂。反过来，如果尽调显示报销经济性持久且条款干净，Solace
              可以从有趣故事变成可执行的后期候选标的。在那之前，价格敏感地跟踪才是有纪律的姿态。
