  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Solace
              的产品最好理解为一套受临床医生监督的医疗倡导工作流，而不是独立消费者应用。面向患者的旅程从资格或病情信息录入开始，经过一次简短虚拟临床医生就诊，再交接给按患者需求匹配的专属倡导员。之后交付变成高接触、持续型：Solace
              称倡导员通过电话、视频、短信、电子邮件、虚拟就诊和安全消息工作，同时也在触点之间持续做看不见的工作。服务面很宽，但逻辑连贯。官方页面反复描述同一组任务——排期、转诊、文书、病历整理、预授权、账单争议、照护协调、转场和本地资源搜寻——显示
              Solace 卖的是一套可在多种用例中复用的倡导模型，而不是一菜单互不相连的工具。工作流也被有意设定边界。Solace
              明确表示，倡导员不诊断、不开处方、不替代主治医生，也不提供法律建议；当把平台受过临床训练的劳动力同其非诊断角色放在一起看时，这一点很重要。公开页面还强调持续性：同一名倡导员可以在需要多久就参与多久，公司把这种连续性视为产品的一部分，而非附加服务层。连续性重要，因为
              Solace 的许多用例——第二意见、预授权拉锯、账单争议和照护转场——会持续数天或数周，而不是一次电话内结束。
