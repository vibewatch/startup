  - id: TU005
    title: 扩张与集中风险表
    description: Main growth vectors and concentration exposures visible from public evidence.
    columns:
      - 扩张驱动因素
      - 集中风险
      - 影响
      - 尽调路径
    notes: 本表区分可见的扩张路径，以及仍缺失的披露；后者才足以量化付款方、转诊方或赞助方集中度。
    rows:
      - - 商业保险与雇主赞助计划覆盖
        - 公开材料仍很少披露具名雇主或商业赞助方账户
        - 若覆盖转化为真实赞助方量级，上行空间很大；但证据仍薄
        - 要求提供商业会员数、雇主标识，以及 Medicare / MA 之外的收入占比
      - - 更深的医疗机构转诊与更早嵌入照护
        - 若过度依赖转诊渠道表现，集中度可能落在少数医疗体系或医生团体上
        - 可能加速增长并改善结果，但渠道依赖会转移议价权
        - 要求按医疗集团提供转诊量，以及前 10 大转诊方带来的启动个案占比
      - - 全国虚拟模式与宽专科目录
        - 全国承诺可能掩盖不同专科、州或行为健康可用性的深度差异
        - 支撑更广的 TAM 扩张，但也抬高人员配置和质量控制复杂度
        - 要求提供州级倡导员密度和专科填补率
      - - 专属倡导员纵向服务模式
        - 没有公开队列、访问频次或续约数据来证明复购经济性
        - 若个案保持活跃，可能带来强留存；但公开数据还无法支撑承销
        - 要求提供关系时长分布和重复参与队列
      - - 付款方节省叙事
        - 没有公开付款方结构或头部付款方集中度数据
        - 若 Medicare / MA 占比过高，报销或编码变化就会变得重要
        - 要求披露 Original Medicare、MA、商业和自费收入拆分
      - - 大规模客户评价与高评论数
        - 评论增长仍可能主要来自公司提示，而非多元赞助方基础
        - 有助于转化，但不能替代已披露的赞助方留存
        - 要求披露重复用户评论占比和按季度的评论节奏
