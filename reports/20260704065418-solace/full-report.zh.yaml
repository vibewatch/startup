  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 报销稳定性破裂
        - 可计费路径、医师监督权限或支付方报销倡导工作的意愿出现实质性倒退
        - 削弱 Solace 区别于纯礼宾服务或导航供应商的核心切入点。
        - 在管理层证明替代变现引擎前，视为投资逻辑立即破裂。
      - - 商业扩张停滞
        - 没有证据表明，除零散保险公司引用外，商业保险覆盖成为实质性第二条增长腿
        - 公司会过度依赖 Medicare 带动的增长，长期倍数支撑也变窄。
        - 如果估值仍假设广泛支付方扩张，维持观察，或下调建议。
      - - 经济性披露不及预期
        - 尽调发现抽成率低、毛利率低、回款差或拒付率高
        - 把一个有吸引力的叙事，变成杠杆有限、服务属性偏重的模型。
        - 不要按当前价格推进；从更低入场区间重新承销，或直接放弃。
      - - 未来融资嵌入过重优先权
        - 下一轮引入惩罚性优先权、参与权或棘轮条款，与溢价成长轮不匹配
        - 即便企业价值守住，新钱回报也可能大幅恶化。
        - 除非价格大幅重置，否则按普通股式回报预期应视为不可投。
      - - 品类重估加深
        - 新的公开市场或 M&A 标记显示，导航资产成交价远低于溢价私募预期
        - 可辩护退出路径变少，也迫使 Solace 证明自己有离群经济性。
        - 收紧入场纪律，并下调复核基准情景估值区间。
    notes: 这些阈值刻意保持方向性，因为决定性变量是政策、支付方经济性和融资条款，而不是单一披露收入线。
    claimRefs:
