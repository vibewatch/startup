      - number: '7.5'
        title: 人员、执行与否决标准
        blocks:
          - type: paragraph
            body: >-
              人员风险很重要，因为 Solace 卖的是连续性、判断力和韧性，不只是一个软件工作流入口。公司承诺为患者配备一名长期陪伴的专属倡导员，自有描述也强调护士、LCSW
              和其他持证临床人员在临床医生监督下工作。因此，人员质量、主管带宽和留存，比泛泛的员工数更重要。但公开语料没有披露倡导员流失率、个案负载、响应时间 SLA
              或主管与倡导员比例。全远程、早期公司可以跑得很快，也可能把运营压力藏到服务一致性下滑之后才暴露。因此，正确投资姿态应当以门槛为准。只要报销完整性转弱、公共信任在安全或质量事件后破裂、合作伙伴驱动增长停滞，或劳动力指标暴露倦怠和监督偏薄，投资逻辑就应快速下调。Solace
              可能仍在医疗体系里搭建有价值的一层，但检索证据显示，公司必须证明的是持久执行力，而不只是需求。
