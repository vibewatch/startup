      - number: '4.2'
        title: 收入质量、公开牵引与单位经济
        blocks:
          - type: paragraph
            body: >-
              收入质量看起来方向上好于纯现金支付的倡导服务业务，因为报销似乎移除了主要消费者价格门槛，公开规模信号也不小。Series C 材料和独立报道称，Solace 通过超过 2,000 名倡导员网络每月服务超过
              20,000 名患者；BusinessWire 还称同比增长 10x。这一组合暗示了真实的支付方支持需求，而不只是轶事式获客。同时，服务显然带有人力交付成本：官方 Medicare 覆盖说明称，每与倡导员相处 1
              小时，背后大约还有 3
              小时协调工作；公开服务范围覆盖排期、医疗服务提供方协调、预授权、账单争议和社会需求支持。这些事实让抽成率、使用率和回款质量成为毛利率的决定项。但公开记录恰好没有提供这些输入。Factually
              的独立评论有用，是因为它指出大多数直接覆盖证明仍来自公司本身，应同计划文件交叉核对；这让 Solace
              的收入质量证据足以画出机制，但不足以完成单位经济模型。关于账单争议、预授权和患者倡导员职责的更多官方指南，让服务组合更清楚：Solace
              倡导员被期待追文件、处理申诉、降低账单，并管理照护转场。这些活动可能通过切入系统中昂贵的失效点来改善收入质量，但也确认了，除非报销收益和倡导员利用率都强，否则毛利率会受人力密集工作约束。
