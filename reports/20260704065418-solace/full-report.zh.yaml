  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 突破性融资叠加真实患者牵引，但经济性和条款仍不透明。
        - 保持跟踪；不要把当前轮次当成可由公开记录支撑的买入。
      - - 信心
        - 中
        - 融资和使用证据可信；收入、利润率和优先股堆叠未公开。
        - 将其作为 IC 初筛视角，而非最终批准。
      - - 风险评级
        - 高
        - 报销持久性、回款质量和未来轮次条款可能实质改变回报。
        - 任何新进入前，都要求下行情景承销。
      - - 估值立场
        - 偏高
        - '>$1B 标记建立在强动能上，但没有公开收入或利润率披露支撑。'
        - 需要更低价格结构或更强私有证据，才能改善判断。
      - - 进入纪律
        - 按当前估值仅做尽调
        - 公开记录支持兴趣，不支持干净承销。
        - 相比盲目参与后期新股，更偏好跟踪、结构化进入或折价老股敞口。
      - - 改变判断的因素
        - 经济性 + 条款
        - 付款方结构、抽成率、利润率、回款和股权结构表清晰度，会直接移动公允价值。
        - 只有在该组合被披露且与溢价结果一致后，才上调判断。
    notes: 本表刻意对价格敏感：强公司质量无法抵消独角兽以上估值下经济披露薄弱的问题。
