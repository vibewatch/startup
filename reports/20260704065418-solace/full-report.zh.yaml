        title: 同业画像与打包方式
        blocks:
          - type: paragraph
            body: >-
              抓取语料支持一个清楚的同业集合，但不是一个同质类别。如果 Solace 试图走向更完整的倡导加照护体验，Included 和老 Accolade
              是最接近的类比；两者都把倡导与虚拟临床服务和福利指引配对。Quantum 和 Rightway 也是由临床牵头的导航平台，但公开定位明显以雇主和 ROI 为先：Quantum
              销售分层导航套餐，并强调理赔节省、拒付减少、高成本理赔参与和大型集成层；Rightway 则把导航与透明收费 PBM、福利管理工作流减负结合。Transcarent/Accolade 是这组中最宽的套件，组合
              AI WayFinding、照护体验、药房、倡导服务、专家医学意见和单一采购外壳。HealthJoy 的临床深度相对较轻，但更像面向 HR
              部署的福利操作系统和参与层。企业组公开定价大多不透明，因此有用的比较点不是名义价目表，而是打包方式、买方取向，以及会员费用由谁承担。
