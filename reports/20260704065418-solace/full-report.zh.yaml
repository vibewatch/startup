  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 报销完整性
        - CMS 对齐服务的已支付索赔率、审计例外和追回
        - 任一 CMS 或 MA 审计发现，或连续两个季度拒付 / 追回率高于 10%
        - 下调收入预期，并在承销更多上行前要求拿出计费整改证据。
      - - 覆盖广度
        - 具名计划覆盖、头部付款方集中度和商业结构
        - 最大付款方收入占比高于 40%，或 12 个月后商业结构没有实质进展
        - 将付款方集中度视为投资逻辑限制，而非暂时性启动问题。
      - - 安全与信任
        - 独立审计范围、事件日志和泄露披露
        - 重大 PHI 事件、外部审计失败，或无法提供控制证据
        - 视为投资逻辑破裂，因为隐私信任是产品根基。
      - - 人力容量
        - 倡导员离职率、个案负载、主管比例和患者响应时间
        - 离职率高于 20%、中位响应时间高于两个工作日，或监督比例下降
        - 下调增长假设，并要求运营稳定计划。
      - - 网络 / 可及性执行
        - 网络内专科成功率和反复出现的目录失败
        - 优先专科的持续预约失败率高于 15%
        - 假设受影响队列的结果交付更弱、留存更低。
      - - 合作伙伴驱动扩张
        - 来自付款方 / 医疗机构合作的转诊转化
        - 尽管有融资和已宣布战略，仍没有实质嵌入式胜利，或试点转化偏弱
        - 下调商业和企业上行，并主要将 Solace 按更窄的 Medicare 服务承销。
    notes: 这些阈值是投资方否决标准，不是管理层指引。目的在于把已抓取的公开证据转化为尽调和投后跟踪中的具体监测规则。
