      - number: '8.2'
        title: 可比估值视角，以及为什么当前标记偏高
        blocks:
          - type: paragraph
            body: >-
              可比公司组支持价格纪律，不支持全盘否定。Accolade 是最清楚的公开警示：2025 年 5 月，其约 $0.44 billion 过去收入对应约 $0.57 billion 市值，后来又以约 $621
              million 出售给 Transcarent。即便考虑盈利能力偏弱和公开市场压力，这一结果也说明，当经济性令人失望时，导航规模本身拿不到高溢价倍数。Garner 指向另一个方向，但关键差别很大：它在 2025
              和 2026 年轮次达到 $1.35 billion 和 $2.74 billion，同时有 130% 增长、约 $200 million 总 ARR、接近 800 家客户。Included Health
              另给出一个质量信号，因为公司称自己已经盈利、保持两位数增长，且没有优先股堆叠。新的雇主市场报道还显示，Included 正把导航推入替代计划设计，用 AI
              引导初级照护分诊，并采用共付优先定价；这说明更宽的导航平台想同时掌握照护引导和福利结构。Solace
              目前更像这个类别里最强的私营叙事，而不是最弱的公开市场结果；但它的公开披露质量仍更接近故事，而不是模型。这种错配解释了为什么当前价格显得偏高，而不是荒唐。
