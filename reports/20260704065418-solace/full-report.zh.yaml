          detail: 公开轮次为平台建设和增长提供资金。
        - id: c2
          label: 平台和计费基础设施
          detail: 资金投向技术、病历和支撑报销的系统。
        - id: c3
          label: 倡导员网络扩张
          detail: 资金也支持供给增长，并让服务更早嵌入照护旅程。
        - id: c4
