      - number: '5.3'
        title: 信任、合规与成熟度
        blocks:
          - type: paragraph
            body: >-
              信任和成熟度好坏参半。积极的一面是，Solace 一贯表示自己符合 HIPAA，采用加密数据处理，把 PHI 限制在最低必要范围，并让患者信息不进入支付界面。它也提到
              Vanta，并运营全国远程模式；公开来源称该模式已经通过超过 2,000 名倡导员每月服务超过 20,000 名患者。CMS 2024 年 Principal Illness Navigation
              框架提供了有用背景，因为它显示，针对由辅助人员参与的受监督类导航服务，联邦报销基础设施现在已经存在。但这是背景支持，不是对 Solace 本身的背书。弱点在证明深度。来源包没有提供具名托管厂商、uptime
              SLA、互操作细节、Vanta 提及之外的独立审计材料，或抓取到的 HIPAA notice URL 下有实质内容的隐私通知。同样，产品路线图证据很宽而非颗粒度高：Series B 和 C
              材料谈到平台投资、临床研究，以及更早嵌入支付方 / 医疗服务提供方，但没有披露带日期的功能发布或安全路线图节点。这让 Solace
              在服务规模上看起来商业成熟，但技术细节仍披露不足。即使公司的支持和内容入口，也更偏运营而不是发布导向：它们帮助患者理解 Medicare
              变化、安全基础和工作流预期，却不暴露技术买方通常想看的细颗粒度变更日志、可用性仪表盘或审计包。对尽调而言，负担因此从阅读文档转向索取内部运营证据。
