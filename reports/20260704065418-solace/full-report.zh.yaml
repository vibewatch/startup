  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开资料中的 Solace 技术栈可以分三层看：上层做接入与初筛，中层做临床医生监督下的编排，底层是 EHR / 计费基础设施。
    data:
      layers:
        - id: access-layer
          label: 接入与初筛层
          detail: 患者和医疗服务方入口负责资格核验、转诊和首次线上初诊排期。
          sublayers:
            - id: eligibility
              label: Eligibility check
              detail: Website flow to confirm Medicare, Medicare Advantage, and expanding commercial coverage.
            - id: referral
              label: Referral channels
              detail: Provider referrals via website, email, or fax with intake usually available within 48 hours.
        - id: clinical-layer
          label: 临床编排层
          detail: Solace 医生或心理学家完成初诊，并在临床监督下把患者连接到专属倡导员。
          sublayers:
            - id: intake-visit
              label: Virtual clinician intake
              detail: Short virtual visit establishes fit and directs the case.
            - id: matching
              label: Advocate matching
              detail: Dedicated advocate is paired based on background, need, and goals.
        - id: execution-layer
          label: 倡导员执行层
          detail: 倡导员持续处理沟通、排期、病历收集、申诉、照护协调和家属同步。
          sublayers:
            - id: communications
              label: Remote communication
              detail: Phone, video, text, email, secure messaging, and virtual visits.
            - id: playbooks
              label: Workflow playbooks
              detail: Scheduling, referrals, prior auth, billing disputes, transitions, and resource navigation.
        - id: platform-layer
          label: 数据与报销层
          detail: 公开材料显示，服务流程底下有自研 EHR / 数据平台、患者记录和 Medicare 计费支持。
          sublayers:
            - id: ehr
              label: Solace EHR / EMR
              detail: Advocates log updates and connect patient history across the case.
            - id: billing
              label: Billing infrastructure
              detail: Technology handles Medicare billing and supports the platform’s reimbursement share.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE017
      - CE018
      - CE019
      - CE020
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开可见的运营流程，从资格核验、临床医生初诊、匹配、远程支持，到幕后执行。
    data:
      nodes:
        - id: w1
          label: 资格或案例录入
          detail: 患者或医疗服务方提交案例并核验保障覆盖。
        - id: w2
          label: 线上临床医生初诊
          detail: Solace 医生或心理学家在一次短暂线上问诊中评估匹配度。
        - id: w3
          label: 专属倡导员匹配
          detail: Solace 按需求和背景为患者匹配一名倡导员。
        - id: w4
          label: 远程协作
          detail: 电话、视频、短信、电子邮件、安全消息、记录和家属接入共同支撑这段关系。
        - id: w5
          label: 幕后执行
          detail: 倡导员在通话之外收集病历、安排就诊、推进申诉，并协调医疗服务方。
        - id: w6
          label: 持续连续性
          detail: 需求变化时，同一名倡导员可以长期参与。
      edges:
        - from: w1
          to: w2
          label: 已覆盖或合格录入
        - from: w2
          to: w3
          label: 按需求匹配
        - from: w3
          to: w4
          label: 定期触点
        - from: w4
          to: w5
          label: 任务触发
        - from: w5
          to: w6
          label: 保留连续性
    approximationNotes: 该流程展示公开页面描述的长期运营模式；它不是理赔裁定流程，也不是技术序列图。
