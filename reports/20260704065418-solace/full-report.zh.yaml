      - number: '7.2'
        title: 监管、法律与覆盖风险
        blocks:
          - type: paragraph
            body: >-
              Solace 的监管风险，重点不是某个已知的公开执法事件，而是收入靠少数报销和隐私前提成立。CMS 2024 年医师收费表调整，把重大疾病导航及相关服务纳入可支付范围；
              辅助人员只要在开票执业者监督下工作，就可以触发相应付款。Solace 公开的临床模式页面也明确写到：先由医生接诊，再由倡导员作为发起临床医生的 incident-to
              支持继续跟进。这种对齐是资产，但也意味着文档质量、医疗必要性、监督以及各计划资格不是后台细节，而是核心收入依赖。Solace 自有材料反复提醒，不同保险计划的资格不同；其 Medicare
              说明也指出，Medicare Advantage 计划可以比 Original Medicare 施加更严的网络和事前授权规则。再叠加虚拟平台处理受保护健康信息（PHI）的 HIPAA
              义务、多州执照，以及行为健康覆盖差异，公司在传统诉讼风险之外已经有不小的合规面。HHS 指引把商业伙伴保障和泄露通知流程列为明确义务；一份 2026 年医疗法律分析称，OCR 待定的 Security Rule
              变化可能把年度审计、资产清单、MFA、加密和更快供应商通知进一步压成运营负担。CMS 的 CY 2026 Medicare Advantage
              最终规则也说明，申诉和利用管理护栏仍在移动，不是已稳定的基础设施。检索语料没有浮现 Solace 专属诉讼、OCR 行动或披露泄露，因此正确姿态不是洗清风险，而是严密监控。公开尽调仍需要 Solace
              计划层面的付款证据和法律状态确认。
