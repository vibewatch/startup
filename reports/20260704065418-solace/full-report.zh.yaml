  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：医疗导航比医疗倡导更宽，但 Solace 目前只覆盖其中一部分
        blocks:
          - type: paragraph
            body: >-
              抓取到的市场来源把医疗导航定义为临床、财务和行政工作流的混合体，而不是单一软件功能。Included Health
              将医疗导航描述为一个统一入口，可覆盖理赔与倡导支持、账单问题、专家临床支持、成本可见性，以及面向雇主、医保计划和企业的照护协调。Mordor
              进一步把市场拆为前门导航、医疗倡导、按病种划分的垂直导航和通用导航，并把终端用户分成雇主、支付方或医保计划、医疗服务提供方或医疗系统，以及其他。这个边界很重要，因为 Solace 目前并不等量映射到所有层级。


              Solace 的公开证据最强处在 Medicare 覆盖的倡导服务：由临床医生发起接诊评估，倡导员按 incident-to
              规则配合临床人员，支持慢病和急性病，并帮助处理预授权、医疗服务提供方协调和医疗行政事项。这明显重叠了导航市场中的医疗倡导和照护协调切片。但这并不自动让 Solace
              等同于现有大厂向雇主销售的完整雇主端导航技术栈；后者会把福利前门、导流、PBM 集成、虚拟照护或计划管理打包进一个平台。远程医疗和直接照护交付也是相邻而非相同类别；CMS 仍把远程医疗视为独立的 Medicare
              覆盖类别。因此，在市场规模和估值上，正确框架应是「Solace 重叠了一个快速增长的导航市场」，而不是「Solace 已经等同于整个导航平台市场」。
