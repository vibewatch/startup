      - number: '2.4'
        title: 增长驱动与采用约束：成本通胀有利，但宽度、信任和数据摩擦仍卡住采用
        blocks:
          - type: paragraph
            body: >-
              医疗导航的增长逻辑很直接。雇主成本涨得快过工资和一般通胀；McKinsey 称，许多雇主希望节省超过 10%，并可能为此更换保险公司。Mercer 显示，高绩效网络、可变共付和 EPO
              设计使用增加，这些都要求会员更好地选择医疗服务提供方和福利。Quantum 的趋势报告称，参与正在从被动了解福利，转向专科协调、药房批准、导向卓越中心（Centers of
              Excellence）等高摩擦动作。CMS 2024 年 Principal Illness Navigation 和 Community Health Integration
              报销变化，也为高风险病情下医疗必要的导航、照护协调和患者自我倡导带来 Medicare 顺风。


              但采用并非没有摩擦。KFF 称，美国仍没有关于网络充足性或目录准确性的全国标准；CMS 发现 45.1% 的 Medicare Advantage 目录地点不准确，其中 38.4% 的错误可能阻断访问。KFF
              还引用神秘客证据，显示拨打列名 QHP 医疗服务提供方的电话中有 73% 未能预约成功；另一项审查发现 48.7% 的 MA
              目录不准确。这种失灵创造了对导航员的需求，但也抬高了厂商的运营负担：验证网络真相、协调病历、解决访问问题，都吃人工也吃数据。与此同时，雇主端既有厂商越来越常把导航与相邻产品打包，因此新进入者必须证明宽度或更好的
              ROI。对 Solace 而言，最大的剩余约束是证据，而不是类别逻辑：抓取记录支持需求和相邻性，但不支持精确的商业 SAM、雇主渗透率，或支付方 / 医疗服务提供方集中度画像。
