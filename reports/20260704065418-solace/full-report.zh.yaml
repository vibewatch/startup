      - number: '6.2'
        title: 采用轨迹与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              公开规模信号有意义，但没有完全同步。Solace 2026 年 2 月 Series C 材料和独立转载称，平台每月服务超过 20,000 名患者，拥有超过 2,000
              名倡导员的全国网络。另有多个当前官方页面称，Solace 累计已帮助超过 200,000 名患者、个人或家庭；而抓取时首页仍显示较小的 45K+
              患者帮助计数。最安全的解读是，公司确实有全国采用和快速增长，但部分网站计数器滞后，或使用了不同分母。满意度和社会证明入口按类别标准看也很大：outcomes 页面引用 8,332 条评价、4.7
              星；referral 页面引用超过 18,000 条五星评价；外部评价聚合器指向一个更小但仍有意义的 Trustpilot 评价基数。对尽调而言，关键结论是 Solace
              已从轶事式需求跨入规模化使用，但公开采用仪表盘仍缺一套权威口径。
