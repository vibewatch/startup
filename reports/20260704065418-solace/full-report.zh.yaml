  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 主题
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变观点
    rows:
      - - 可报销切入点
        - Solace 拥有差异化的可报销倡导切入点，而非纯自费礼宾服务模式。
        - 具体抽成率、拒付结构和报销持久性仍未披露。
        - 展示代码级计费机制、实际费率，以及按付款方划分的稳定回款。
      - - 患者牵引
        - 20k+ 月度患者和 2k+ 名倡导员指向真实使用量和供给端深度。
        - 使用量本身不能证明收入质量或运营杠杆。
        - 披露按队列划分的每患者月收入、利用率和贡献利润率。
      - - 品类时点
        - 雇主和支付方面临的成本与复杂度压力上升，反而让导航更有用。
        - 导航也进入拥挤且持续整合的市场，宽平台能靠规模压过更窄的切入点。
        - 证明 Solace 能打进或借合作进入企业渠道，同时不牺牲经济性。
      - - 可比支持
        - Garner 和 Included 说明，规模化且质量高的导航资产仍能获得投资人定价奖励。
        - 这些公司对 ARR、盈利能力和股权结构质量的披露，都比 Solace 更充分。
        - 要么达到同等披露标准，要么给出估值折扣作为补偿。
      - - 退出可选性
        - 2028 年 IPO 愿景和强投资人组合，说明未来存在可行的流动性路径。
        - 目前还没有公开 S-1、经审计财务或优先权瀑布，退出时间更多是叙事而非证据。
        - 拿出投行准备度、审计质量，以及能支撑 IPO 或战略出售测算的股权结构表。
    notes: 各行把公司质量论据和价格质量论据拆开，确保建议保持纪律性。
