  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与购买层级
        blocks:
          - type: paragraph
            body: >-
              Solace
              的客户证据在终端用户和转诊医疗服务提供方层最强，而不是经典的雇主优先企业销售。公司的公开入口一致把患者、家庭照护者和亲人描述为核心用户，用例覆盖新诊断、慢病、专科医生寻找、账单争议、预授权、第二意见、老年照护、痴呆支持、残障支持和行为健康协调。新抓取到的癌症、慢病和老年照护专科页面，以及加州、弗吉尼亚州页面，显示
              Solace 把同一个照护协调承诺包装进按诊断和地理划分的获客入口，并包含本地资源和支持医生信息。今天的付费渠道仍以 Medicare 和 Medicare Advantage
              覆盖为主；医疗服务提供方是重要转诊来源，支付方则被框定为经济受益者，因为 Solace
              称其临床医生牵头模型可以减少摩擦、延迟和可避免的使用。商业保险和雇主赞助覆盖现在也出现在公开材料里，但公开具名赞助方账户仍稀少。这意味着，应把 Solace
              分析为一家以患者为中心的照护导航公司，其真实证明点在患者参与和医疗服务提供方转诊，支付方和雇主扩张在公开披露中仍更早期。
