  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与定位
        blocks:
          - type: paragraph
            body: >-
              Solace 不是那些主导公开类别叙事的大型雇主端导航厂商的直接克隆。它的公开材料强调由保险覆盖的患者倡导、由临床医生牵头的接诊评估，以及一名代表患者执行工作的具名倡导员，而不是简单地把员工引导穿过福利栈。这让
              Solace 最接近面向 Medicare 和 Medicare Advantage 会员、可报销的患者倡导服务，并部分重叠支付方 /
              医疗服务提供方的照护管理，而不是正好落在传统自保雇主导航桶里。相比之下，Included Health、Quantum Health、Rightway、Transcarent/Accolade 和
              HealthJoy
              都主要把自己呈现为面向雇主、医保计划或组织的平台，把导航与更广泛的福利、临床、药房或编排层组合起来。实际结果是战场被切开：当任务是「替患者把医疗杂活做掉」时，尤其在复杂慢病、老龄化、诊断、账单和治疗可及性工作流里，Solace
              最强；当买方要的是一份企业合同、可衡量的雇主节省、单点方案集成和福利管理杠杆时，大型套件最强。
            claimRefs:
