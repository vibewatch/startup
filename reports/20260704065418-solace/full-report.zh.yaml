  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与模型敞口
        blocks:
          - type: paragraph
            body: >-
              Solace 的风险栈由一个事实塑形：产品坐落在美国医疗体系混乱的中间地带，而不是干净的软件端点。公司可以快速增长——近期报道提到超过 2,000 名倡导员、每月服务超过 20,000 名患者、$130
              million Series C 和超过 $1 billion
              的估值——但这些表层信号不能消除那些决定倡导时间能否真正转化为可报销、高质量、可信服务的结构性摩擦。核心问题不是人们是否需要帮助来在医疗体系中导航；抓取证据强烈表明他们确实需要。问题在于，在 Medicare
              规则、Medicare Advantage 计划限制、医疗服务方网络混乱和劳动密集型服务模型之内运营时，Solace
              能否让其受临床医生监督的高接触模型持续合规、稳定且经济上耐久。因此，热力图把报销完整性、劳动力扩张和信任保障放在最高剩余严重度单元格，因为这些风险可以同时打击结果、付费使用和商业可信度。
