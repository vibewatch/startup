      - number: '2.3'
        title: 买方、用户和支付方地图：雇主要买简化，Solace 当前证明点仍是 Medicare 倡导
        blocks:
          - type: paragraph
            body: >-
              在雇主端导航中，经济买方通常是自保雇主或福利负责人，用户是员工或家属，经济回报是降低趋势成本并提高福利满意度。Quantum 的 2026 年报告显示了雇主现在在采购什么：一个能跨保险公司、PBM
              和医疗服务提供方负责到底的向导；由临床牵头的导航，而不是纯呼叫中心支持；质量优先的导流；以及用 AI 增强真人专家，而非取代真人。Quantum 还报告，93%
              的雇主希望技术方案仍包含人工支持。这有利于能把数字分诊和高接触干预结合起来的平台。


              Solace 与这种需求模式部分重叠，但起点不同。它最有证据支撑的市场进入路径是 Medicare 和 Medicare Advantage 倡导服务，由直接计费基础设施和对齐 CMS
              的照护管理工作流推动。Solace 也披露了商业保险可用性，以及更深的支付方 / 医疗服务提供方合作野心，但没有披露雇主客户数、覆盖人头、PMPM
              定价或商业收入结构。与此同时，既有导航厂商推的是更宽的雇主套件：Quantum 称服务 500+ 雇主；Included 为雇主和医保计划组合倡导、导航和虚拟照护；Rightway 加入 PBM 集成和 ROI
              主张；Transcarent 强调统一的合作伙伴接入和报告；HealthJoy 组合 AI、管家式支持、账单申诉和导流。实际结论是，Solace 具备进入雇主端导航的可信相邻性，但今天的公开证据更像一个以
              Medicare 为根的倡导服务滩头阵地，并有支付方 / 医疗服务提供方扩张潜力，而不是已经被证明的雇主类别领导者。
