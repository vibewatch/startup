      - number: '2.2'
        title: 市场规模视角：全球医疗导航 TAM 可作背景，但美国 SAM 仍受证据约束
        blocks:
          - type: paragraph
            body: >-
              抓取语料中最干净的自上而下市场估算来自 Mordor Intelligence 的全球医疗导航平台预测：2025 年 USD 11.40 billion，2026 年 USD 12.25 billion，到
              2031 年达到 USD 17.61 billion，CAGR 为 7.52%。Mordor 还报告，2025 年雇主贡献了 45.63% 的市场收入，北美占 45.25%。这些数字支持方向性透视：2025
              年隐含全球雇主切片约 USD 5.2 billion，隐含北美雇主切片约 USD 2.35 billion。但这些仍是分析师模型抽象，并不是仅限美国、仅限医疗倡导、且特指 Solace 的 SAM。


              更强的需求证据来自美国成本压力和复杂度，而不是精确的公开 SAM 模型。KFF 称，雇主赞助保险覆盖 154 million 名 65 岁以下人群，2025 年平均保费达到单人 USD 9,325、家庭 USD
              26,993。Mercer 称，2025 年雇主赞助医疗成本达到每名员工 USD 17,496；2026 年续保涨幅在缓解前平均 9.2%，即便调整计划后仍有 6.7%。McKinsey 另预计，2024 至
              2026 年商业医疗成本每年上涨 9% 到 10%。CMS 提供了更宽的支付方背景，预计到 2033 年全国医疗支出平均增长 5.8%，其中 Medicare
              增长尤其强。合起来看，这些来源解释了为什么导航预算正被优先投入，但仍未拆出 Solace 今天能在 Medicare、Medicare Advantage、商业雇主、支付方和医疗服务提供方渠道中赢得的收入池。
