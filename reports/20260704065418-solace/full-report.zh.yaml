      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              最大上行来自从 Medicare 优先的覆盖服务扩展到更广的商业和嵌入式照护路径。Solace
              现在称其在全国覆盖商业保险，包括雇主赞助计划；多篇融资文章称，下一阶段是更深的支付方和医疗服务提供方合作，把倡导服务放到照护旅程更早的位置。最大风险是集中度：公开证据仍显示，公司高度依赖 Medicare 和
              Medicare Advantage 报销、转诊医疗服务提供方渠道，以及公司控制的证言，而不是多元化的公开赞助方名册。谁在规模化付费也存在透明度风险，因为公开材料没有拆出 Original
              Medicare、Medicare Advantage 和商业量，也没有披露头部支付方或头部转诊来源敞口。有限的公开雇主 logo、没有披露的赞助方队列、以及不一致的患者计数，让人难以判断 Solace
              的商业扩张仍是早期试点，还是已经形成有意义的收入多元化。
