      - number: '6.4'
        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >-
              Solace 的留存证据方向积极但不完整。公开页面称，每名患者会得到一名专属倡导员，后者可以长期陪伴；Solace
              还明确表示，患者可以按需要一直同同一名倡导员合作，或之后回来重新获得帮助。新具名故事增加了定性纵向证据：Robert 的照护案例包含每周跟进和支持小组连接；Liz 的父亲在专科访问加速后获得每日跟进；Pearl
              的记忆检查故事包含提醒和家庭会议；Esther 的多专科案例在初始 48 小时动员后仍保持协调。按类别看，评价入口很强：官方页面引用 8,332 条评价中的 4.7 星和超过 18,000
              条五星评价，第三方评价聚合器报告来自 357 条评价的 4.5 Trustpilot 衍生评分。同时，公司没有公开披露 NRR、GRR、客户 logo
              流失、续约率、合同期限或队列留存，而这些才是投资人想看的真实耐久度指标。外部评论也指出保险资格、倡导员可用性、行政和远程医疗怀疑等较窄问题。结果是一幅强满意度和重复关系意愿的图景，但还不是量化留存经济性的图景。
