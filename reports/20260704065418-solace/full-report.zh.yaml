  - id: FU001
    title: 客户旅程图
    type: journey-map
    description: Solace 以患者为中心的模式中，客户分群、激活入口和重复支持循环如何展开。
    layout: wide
    summary: Solace 的旅程从患者或转诊临床医生开始，并通过持续倡导、家属参与，以及支付方 / 医疗服务方强化而扩展。
    claimRefs:
      - CU001
      - CU002
      - CU018
      - CU020
      - CU021
      - CU022
    data:
      nodes:
        - label: 触发事件
          detail: 患者、照护者或临床医生在诊断、拒付、账单或照护转接问题后意识到照护摩擦。
          tone: neutral
        - label: 保障核验
          detail: 患者或医疗服务方核验 Medicare、Medicare Advantage 或商业保险资格；零自付信息降低转化阻力。
          tone: positive
        - label: 医生初诊
          detail: Solace 医生评估匹配度，保留临床监督，并把患者匹配到合适的倡导服务路径。
          tone: positive
        - label: 专属倡导员匹配
          detail: 一名倡导员接手电话、排期、授权、病历和家属沟通，渠道包括电话、视频、短信和电子邮件。
          tone: positive
        - label: 长期支持循环
          detail: 只要仍有需要，支持就会持续，包括定期跟进、更新 EHR，以及新问题出现时重新介入。
          tone: positive
        - label: 转诊 / 赞助方飞轮
          detail: 满意的患者、照护者、临床医生和支付方会反复转介，增强 Solace 在医疗服务方和支付方中的嵌入。
          tone: positive
