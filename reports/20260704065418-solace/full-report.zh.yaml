          tone: neutral
        - label: 资格核验
          detail: Solace 可快速核验 Medicare、Medicare Advantage 以及较新的商业保险渠道。
          tone: positive
        - label: 线上医生初诊
          detail: 一次简短医生通话确认匹配度和报销准备度。
