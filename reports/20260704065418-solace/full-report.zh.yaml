      - number: '1.3'
        title: 融资、投资人和规模快照
        blocks:
          - type: paragraph
            body: >-
              Solace 的融资节奏是公司阶段最清楚的信号。公司在 2024 年完成 $14 million Series A，2025 年 4 月完成 $60 million Series B，并在 2026 年 2
              月完成由 IVP 领投、估值超过 $1 billion 的 $130 million Series C。Series C 后的独立报道把累计融资写作 $211 million，可见投资人包括 Inspired
              Capital、Craft Ventures、Torch Capital、Menlo Ventures、SignalFire、IVP 和 RiverPark
              Ventures。规模口径很强，但需要谨慎处理。Series C 材料和后续报道称，到 2026 年初，Solace 拥有超过 2,000 名倡导员，每月服务超过 20,000 名患者。公司还宣传倡导员平均经验
              16 年、98% 报告结果改善，以及大部分由保险覆盖、多数患者几乎或完全不自付的模式。累计覆盖故事没有那么干净：首页显示已帮助 45K+ 患者，其他公司入口则称已帮助约 200,000
              名患者及家庭。这个不一致意味着后续章节应使用月度患者量，而不是单一累计覆盖数字。收入、ARR、员工数、办公室足迹和持股比例仍未披露。
