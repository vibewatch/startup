      - number: '7.4'
        title: 合作伙伴、依赖与财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              Solace 不只依赖自己的倡导员网络；它还依赖决定倡导能否奏效的外部系统。Medicare Advantage 计划设计、事前授权、服务方网络广度和服务方目录准确性，都会影响 Solace
              能否把患者带到可用的网内照护。CMS 的目录审查报告和 KFF 的网络充足性研究显示，这些摩擦是系统性的，不是零散案例；这有助于解释 Solace 的需求，也意味着公司暴露在无法完全控制的问题之下。KFF
              发现，2024 年 Medicare Advantage 有近 53 million 次事前授权裁定，其中 4.1 million 次被拒，超过 80% 的上诉拒绝后来被推翻；HHS-OIG 称，其相关工作推动了
              CMS、行业和国会行动。Fierce 对同一研究的摘要也强调保险公司层面的差异很大，进一步说明患者摩擦会因计划不同而显著分化。增长策略又加了一层风险。Solace
              最近的融资报道强调，要深化支付方和服务方合作，把倡导更早嵌入照护流程；商业保险扩张仍在早期。因此，支付方和服务方渠道执行很关键，尤其是 Quantum Health 和 Transcarent
              等更大在位者已经大规模向雇主和健康计划销售整合导航平台。雇主成本压力上升可能提高买方对导航的兴趣，但也会抬高 ROI 审查，并压缩市场对差结果、弱转化或模糊报销经济性的容忍度。
