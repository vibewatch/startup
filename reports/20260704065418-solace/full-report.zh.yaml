      - CV048
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任人或尽调路径
    rows:
      - - 收入和 ARR
        - 当前收入、ARR，以及按支付方和队列拆分的增长桥
        - 需要这些数据，才能把独角兽信号转成估值模型，而不是停在融资标题。
        - 财务包：月度收入桥、过去十二个月视图和董事会预算。
      - - 报销经济性
        - 抽成率、总额到净额瀑布、拒付率、申诉和应收账款周转天数
        - 验证 Solace 是可扩展平台，还是低毛利服务中介。
        - 结合支付方合同、计费运营和回款看板，审查收入周期。
      - - 支付方结构与扩张
        - 来自 Original Medicare、Medicare Advantage、商业保险和自费的患者与收入占比，加上已签署商业合同
        - 决定集中度风险，也检验商业上行叙事是否现实。
        - 围绕合同摘要和上线时间表，做商业与支付方尽调。
      - - 股权结构表与优先权
        - 完全摊薄股份数、Series C 股价、清算优先顺位、老股成分和按比例参投权
        - 条款不透明时，真实回报可能和标题估值相差很大。
        - 法务和财务审查最新股权结构表与交易文件。
      - - 独立结果证据
        - 第三方或同行评审研究，证明成本趋势降低、依从性改善或就医时间缩短
        - 这会强化一种判断：患者倡导正在成为耐久基础设施，而不只是融资周期主题。
        - 临床研究和支付方 ROI 资料包，包括任何未发表分析。
      - - 退出准备度
        - 审计状态、投行准备、数据室成熟度，以及管理层更新后的 IPO 或战略出售计划
        - 后期定价需要可信流动性路径，不能只有品类热度。
        - 与 CFO、法律顾问和外部顾问做董事会层面尽调。
    notes: 每项要求都对应留存公开资料暴露出的具体承销缺口，没有一项只是走形式。
    claimRefs:
      - CV015
      - CV039
