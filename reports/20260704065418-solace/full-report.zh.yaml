      - number: '5.2'
        title: 临床与技术架构
        blocks:
          - type: paragraph
            body: >-
              交付架构有三个可见层。第一层是临床资格确认：支付方和 Medicare 材料描述，Solace
              医生或心理学家先做初步评估，再把患者连接给倡导员。第二层是倡导员劳动力本身，公开资质描述方向上偏临床，但并不完全一致。支付方页面称倡导员包括 RN、LCSW
              和其他持证临床人员；消费者页面则简化为注册护士和其他医疗专业人士；Bloomberg 摘录称，Series C 时人员名单全是注册护士。第三层是软件和数据层。Series B 材料描述了自研 EHR
              和数据平台；转诊入口称倡导员在 Solace EHR 中记录更新；Bloomberg 摘录又补充了 Medicare 计费工具和用于患者病史的内部
              EMR。这足以支持真实运营栈的存在，但不足以细画托管、互操作性、API
              覆盖或安全架构。因此，今天外部可读的护城河是临床监督下的工作流编排和报销赋能，而不是披露很深的技术栈。转诊入口进一步强化了这一点：它描述倡导员联系各方索取病历、记录更新，并在 Solace EHR
              中保持个案有序。换句话说，Solace 的可见架构较少关于自助式患者应用，更多关于一套让受过临床训练的人类能规模化协调复杂照护的工作流系统。
