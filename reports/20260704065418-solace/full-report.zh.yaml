      - number: '6.3'
        title: 具名患者与医疗服务提供方证明
        blocks:
          - type: paragraph
            body: >-
              具名证明存在，但压倒性地偏证言和转诊导向，而不是企业 logo 导向。医疗服务提供方侧，Marian University 的 Dr. Luke Nelligan 和 St. Vincents Hospital
              的 Dr. Daniel Anzaldua 都公开背书 Solace；Nelligan 还具体表示，他看到被转介到该服务的老年患者结果更好。患者和照护者侧，Diane J.
              描述自己因保险网络变化失去心脏科医生后使用 Solace；Alexa 和 Hilary 描述父亲癌症过程中获得倡导员支持。新抓取的故事页增加了更多具名具体案例：Julia
              的心脏病案例包含远程医疗协调和一次成功保险申诉；Robert 的 Alzheimer’s 照护案例包含每周跟进和照护者支持小组；Liz 的父亲把专科访问从数月加速到数周；Pearl
              的记忆检查案例包含神经科医生访问和家庭会议；Esther 的多病种案例在 48 小时内被组织到多名专科医生之间。其他具名故事还覆盖 Parkinson’s
              相关急诊升级、术前预授权逆转、透析后勤协调、肾脏照护、临终关怀协调，甚至 MedCity 报道的一起恢复移植名单案例。这些例子显示，Solace
              可以指向患者自主启动和临床医生转诊两条路径上的真实使用，但多数公开证明仍由公司筛选且偏定性，而不是来自已披露支付方、医疗服务体系或雇主赞助方的独立测量生产环境 ROI。
