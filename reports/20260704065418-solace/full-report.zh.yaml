        title: 里程碑、监管背景和待补缺口
        blocks:
          - type: paragraph
            body: >-
              后续章节应复用的里程碑记录从公司成立前就开始。Gurewitz 母亲在 2016 年被诊断为胰腺癌并于 2018 年去世，构成公司的创始叙事；Solace 则在 2022
              年正式推出，核心想法是患者在诊断与治疗之间需要帮助。下一次重大解锁不只是资本，也来自报销背景：Solace 自己的帮助中心材料把由保险覆盖的模式同 2024 年 Medicare 政策变化相连；CMS 2024
              年 physician fee schedule 规则确实新设了可单独支付的 Principal Illness Navigation 服务，涉及在执业者监督下由照护导航员和辅助人员交付服务。到 2026
              年，Solace 已把这股报销顺风同支付方 /
              医疗服务提供方合作野心和独角兽融资结合起来。保留来源中的反向记录相对较轻：这里没有出现可佐证的裁员、制裁或诉讼。外部警示更多是软信号——低层级评论中夹杂对资格限制、纯虚拟交付和行政不稳定的抱怨。更大的尽调缺口在经济性和治理：精确估值机制、股权结构表、债务或老股交易、董事会权利、收入，以及经审计的精确累计覆盖人数，都仍在公开视野之外。
