  - id: FU003
    title: 客户证明矩阵
    type: matrix
    description: 从结果具体性、独立性、部署成熟度和留存可见性评估公开客户证明质量。
    layout: wide
    summary: Solace 有可信的具名证明，但多数是定性且由公司控制，并非独立审计的赞助方 ROI。
    claimRefs:
      - CU023
      - CU026
      - CU027
      - CU039
      - CU041
      - CU048
    data:
      columns:
        - 结果具体性
        - 独立性
        - 部署成熟度
        - 留存可见性
      rows:
        - label: Diane J. 患者案例
          values:
            - label: 中等
              tone: positive
              detail: 解决的问题明确（保险网络变动后找到新的心脏科医生），但没有量化前后结果
            - label: 弱
              tone: risk
              detail: 只在 Solace 自控渠道重复出现
            - label: 强
              tone: positive
              detail: 呈现为真实生产案例，不是试点
            - label: 弱
              tone: risk
              detail: 未披露持续时长、续约或重复使用细节
        - label: Alexa 和 Hilary 照护者案例
          values:
            - label: 中等
              tone: positive
              detail: 高风险癌症照护旅程，定性背书很强，但没有量化临床或财务结果
            - label: 弱
              tone: risk
              detail: 证据仍是公司发布的证言内容
            - label: 强
              tone: positive
              detail: 代表活跃照护协调中的真实家庭使用
            - label: 弱
              tone: risk
              detail: 没有公开证据说明该家庭持续参与多久
        - label: Dr. Luke Nelligan 转诊证明
          values:
            - label: 中等
              tone: positive
              detail: 该医疗服务方明确称，患者更有信心，也获得更好结果
            - label: 弱
              tone: risk
              detail: 医疗服务方引语公开，但仍托管在 Solace 渠道
            - label: 强
              tone: positive
              detail: 代表持续真实转诊，而非一次性试点
            - label: 中等
              tone: neutral
              detail: 转诊关系暗示重复使用，但未披露转诊数量或续约数据
        - label: 外部评价生态
          values:
            - label: 中等
              tone: neutral
              detail: 评分和投诉主题可见，但用户成效仍多为定性
            - label: 强
              tone: positive
              detail: 包括 Solace 控制之外的独立平台和讨论论坛
            - label: 强
              tone: positive
              detail: 代表真实生产用户使用后的反馈，不是售前营销
            - label: 中等
              tone: neutral
              detail: 评论量间接显示重复满意度，但没有公开队列曲线
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 热力图对 Solace 主要剩余风险排序，报销合规、质量漂移和信任保障落在最高严重度格子。
    data:
      columns:
        - label: 中等影响
        - label: 高影响
        - label: 极高影响
      rows:
        - label: 高可能性
          values:
            - 患者数、评价和质量报告指标不透明
            - 商业保险扩张面临成熟导航服务存量玩家压力
            - 计划层面的保障限制和报销漏损
        - label: 中等可能性
          values:
            - 对远程医疗的怀疑或行政执行不一致
            - 医疗服务方目录和网络准入摩擦
            - 规模扩大后倡导员产能和监督质量漂移
        - label: 低可能性
          values:
            - 已抓取公开材料中尚未出现公开执法事件
            - 各州临床执业范围复杂
            - 重大 PHI 或破坏信任的安全事件
    approximationNotes: 可能性和影响是基于已抓取公开证据的定性分析判断，不是管理层披露。极高影响格子代表会迫使投资逻辑快速重置的事件。
    claimRefs:
      - CR019
      - CR023
      - CR041
      - CR042
      - CR044
      - CR045
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向图展示合规、信任和人力风险如何沿 Solace 服务模式传导，影响使用量、增长和估值。
    data:
      nodes:
        - id: compliance
          label: 报销 / 合规漂移
          detail: 监督、文档或医疗必要性控制变弱。
        - id: security
          label: 信任或安全事件
          detail: PHI 控制失败或保障证明薄弱会伤害可信度。
        - id: labor
          label: 倡导员产能紧张
          detail: 个案负荷、流失或监督削弱服务一致性。
        - id: experience
          label: 患者体验恶化
          detail: 资格意外更多、响应更慢，或倡导结果更弱。
        - id: utilization
          label: 付费使用量下降
          detail: 获批、完成或获得报销的服务量走软。
        - id: partner
          label: 支付方 / 医疗服务方信心转弱
          detail: 转诊和嵌入式合作更难赢得或留住。
        - id: growth
          label: 增长放慢，ROI 证明变弱
          detail: 商业可信度和估值支撑变弱。
      edges:
        - from: compliance
          to: utilization
        - from: security
          to: partner
        - from: security
          to: experience
        - from: labor
          to: experience
        - from: experience
          to: utilization
        - from: utilization
          to: growth
        - from: partner
          to: growth
    approximationNotes: 箭头是定性因果联系，不是计量经济估计。反馈循环被简化，便于图表保持 DAG 式的单向因果可读性。
    claimRefs:
      - CR042
      - CR043
      - CR044
      - CR046
      - CR047
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 有向图展示 Solace 依赖哪些外部系统，才能把倡导服务时间转成可报销且成功的照护交付。
    data:
      nodes:
