  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与报销机制
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的是由报销支撑的倡导服务模式，而不是透明 SaaS 价目表。Solace 的患者、FAQ 和 Medicare 覆盖页面称，服务由 Original Medicare 和许多 Medicare
              Advantage 计划覆盖，现在也在扩展到商业保险；公开患者成本主张集中在 94%-95% 的用户无需自付。支付方页面补充了运营细节：Solace 医生或心理学家完成接诊评估，之后倡导员按
              incident-to 规则配合发起临床医生工作。CMS 2024 年 Principal Illness Navigation
              规则本身也重要，因为它明确为在计费执业者监督下由辅助人员交付的类导航服务创造了支付。Bloomberg 补上了缺失的变现链条：Solace 的技术处理 Medicare
              计费，公司保留支付给倡导员报销款中的可变份额。对覆盖计划之外的用户，Solace
              公开提到小时费率和免费初次通话，但仍不公布价目表。实际结论是：这是由临床医生牵头、按保险计费的服务平台，并以自费作为兜底，而不是经典订阅目录。Solace 自己的照护协调指南也强化了这一框架：它明确把
              Medicare 支持同 Chronic Care Management、Transitional Care Management 和 Medicare Advantage 协调项目相连。这不能证明 Solace
              只按某一个计费代码族获付，但确实加强了公开案例：业务围绕可报销的协调工作搭建，而不是围绕可自由支配的消费者支出。
