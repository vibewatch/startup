  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Solace 已经拿到严肃的后期融资信号。2026 年 2 月的 Series C 让公司越过 $1 billion 门槛，累计融资约 $211 million，同时伴随具体的患者层面进展：月服务患者超过
              20,000、倡导员超过 2,000，并明确声称同比增长
              10x。这足以排除随手否定这门生意；但仅靠公开证据，还不足以按当前估值标记承销买入。记录仍缺收入、抽成率、毛利率、烧钱速度、回款质量，以及本轮背后的精确优先股堆叠。换句话说，Solace
              更像一家可信但价格文档不足的公司，不是披着光鲜融资的弱公司。因此，正确判断是中等信心观察、高风险、估值偏高：切入点确实存在，继续保持接触；但在把当前轮次视为可投之前，需要私人证据确认，或更有吸引力的进入条款。
