      - number: '3.3'
        title: 替代品、切换成本与分发权力
        blocks:
          - type: paragraph
            body: >-
              Solace 还在同现状替代品竞争，这些替代品看起来并不像拿了风投的导航平台。抓取到的 Solace 定价解释区分出三类持久替代方案：独立私人倡导员，历史现金收费约每小时 $100 到
              $500；医院雇佣的倡导员，免费但大多只覆盖一家机构和一次照护事件；保险公司赞助的个案管理师，也免费但因服务于计划而有结构性冲突。Solace 的答案是，把许多 Medicare 和 Medicare
              Advantage
              受益人的低费用或零会员费用，与具名、独立倡导员和「代办到底」工作流结合起来。信任建立后，这会形成基于关系的粘性，但锁定效应弱于雇主套件的采购锁定；后者由一份合同销售，并嵌入福利、药房、分析和合作伙伴生态。这一点重要，因为宽平台的公开分发能力要显眼得多：Quantum
              称拥有 500+ 雇主，Rightway 超过 3 million 会员，HealthJoy 有 1,800+ 客户，Transcarent/Accolade 则超过 20 million 会员和 1,700+
              客户。
            claimRefs:
              - CP030
              - CP032
              - CP036
              - CP049
              - CP051
      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Solace 的护城河在窄赛道里似乎更耐久，而不是在宽泛医疗导航类别标题下更耐久。最强的公开差异化不是平台宽度，而是立场和工作流设计：倡导员代表患者，而不是医院或保险公司；接入路径包含临床监督；Medicare
              和许多 Medicare Advantage
              计划可以覆盖服务；倡导员承担相当一部分行政负担。这些特征尤其适合面对碎片化照护的老年、慢病或新诊断患者。主要战略风险在于，类别买方越来越想在一个平台上集成导航、药房支持、质量导流、虚拟照护、分析和
              AI。Included 的 CEO 已经把导航的很大一部分描述为商品化，Transcarent-Accolade 合并也显示规模玩家正在变宽。CMS 新的 Principal Illness Navigation
              付款同样是一把双刃剑：它验证了 Solace 底层的报销逻辑，但也让医疗服务提供方、支付方和社区型导航项目更容易被证明合理。因此，Solace
              最强的位置是专注、可报销的倡导服务领导者；在正面拼企业套件采购战时会更弱。
