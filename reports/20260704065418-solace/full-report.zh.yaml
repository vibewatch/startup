      - number: '4.3'
        title: 资本充足性、可比信号与披露结论
        blocks:
          - type: paragraph
            body: >-
              从表面看，资本充足性很强。Solace 完成了 $14 million Series A、$60 million Series B 和 $130 million Series C；MedCity 与
              Bloomberg 将累计融资写作 $211 million，最近估值超过 $1 billion。公开资金用途语言一致指向扩张倡导员网络、平台投入、临床研究、支付方和医疗服务提供方合作；按 Bloomberg
              的说法，还包括大量营销和招聘。这足以说明公司在 2026 年 2
              月融资后并不显然马上缺钱。但这不足以承销流动性。已审阅的公开来源仍省略现金余额、月度烧钱速度、现金跑道、债务和报销营运资本动态。可比信号有信息量，但噪音很大，不能定案。Accolade 曾有约 $440
              million 的过去 12 个月收入（TTM），但在约 $621 million 被收购前市值只有约 $570 million；CNBC 将该退出放进更艰难的数字健康公开市场环境。Garner
              则展示了区间另一端：Series D 时披露 130% 增长，Series E 时披露约 $200 million gross ARR，但这些披露来自更宽的雇主端导航模式。因此结论是平衡的：Solace
              的融资位置看起来强，但公开披露仍太薄，无法有信心地建模收入质量、利润率或现金跑道。MobiHealthNews 又提供了一个警示性可比公司信号，指出 Accolade
              在私有化交易前裁员并缩小规模，凸显更宽的导航平台要维持公开市场预期有多难。这个背景让我们更不能从单一可比结果外推稳定倍数。
