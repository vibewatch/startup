      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              收入和轮次条款没有披露，因此情景框架应相对 2026 年 2
              月估值标记来判断，而不是假装能精确到美元。乐观情景取决于三个相互关联的证明：报销保持持久，商业保险或支付方扩张变得可见且重要，管理层证明可变份额报销模型能产出有吸引力的平台经济性，而不只是高服务吞吐量。若这些成立，Solace
              可以证明自己相对当前标记应有明确溢价。基准情景更克制，也更有用：Medicare 驱动的进展
              仍然真实，支付方关系加深，公司逐步长进本轮估值，但没有快到足以凭突破性经济性获得大幅重估。悲观情景正是公开市场可比公司所警示的：类别倍数压缩，报销或回款比预期更不稳，未来融资或交易价格更接近传统导航基准。因此，决策应围绕情景触发因素，而不是单一头条估值数字。
