companyProfile:
  summary: >-
    Solace 是一家私营虚拟医疗倡导公司，由 Jeremy Gurewitz 和 Sara Sargent 于 2022 年创立，公开总部位于加州 Redwood
    City。公司把患者及家庭匹配给可通过短信、电话和视频联系的专属倡导员，并把服务放进由临床医生监督的工作流中；该工作流围绕 Medicare 和 Medicare Advantage 报销设计，2026
    年材料开始出现商业保险扩张信号。公开证据显示，Solace 已全国交付，拥有超过 2,000 名倡导员，每月服务超过 20,000 名患者，并在 2026 年 2 月 Series C 后累计融资约 $211
    million，该轮估值超过 $1 billion。主要尽调限制不是需求，而是投资判断不透明：公开材料仍未披露收入、抽成率、支付方结构、毛利率、现金跑道，或支撑独角兽估值的详细股权结构条款。
