  productSummary: Solace sells a virtual healthcare advocacy service that pairs each patient with a dedicated advocate and supporting clinician workflow to coordinate appointments, records, prior authorizations, billing disputes, care plans, and broader care navigation over text, phone, and video.
  customerFocus: Primarily Medicare and Medicare Advantage members facing chronic, aging, diagnostic, billing, or treatment-access complexity, alongside caregivers, referral providers, and an emerging commercial-insurance channel.
  businessModel: Insurance-covered, labor-backed care navigation model that bills Medicare- and Medicare Advantage-compatible advocacy workflows and appears to monetize through a variable share of reimbursements paid to advocates; self-pay and commercial coverage exist but are less publicly disclosed.
  stage: Series C private company
  fundingStatus: Last disclosed financing was a $130 million February 2026 Series C led by IVP at a valuation above $1 billion; cumulative disclosed funding is roughly $211 million.
