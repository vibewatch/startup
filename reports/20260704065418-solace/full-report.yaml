      - number: '1.3'
        title: Funding, Investors, and Scale Snapshot
        blocks:
          - type: paragraph
            body: >-
              Solace’s financing cadence is the clearest signal of company stage. The company raised a $14 million
              Series A in 2024, a $60 million Series B in April 2025, and a $130 million Series C in February 2026 led
              by IVP at a valuation above $1 billion. Independent coverage after the Series C put cumulative funding at
              $211 million, with the visible investor set spanning Inspired Capital, Craft Ventures, Torch Capital,
              Menlo Ventures, SignalFire, IVP, and RiverPark Ventures. Scale claims are strong but should be handled
              carefully. Series C materials and downstream coverage say Solace had more than 2,000 advocates and served
              more than 20,000 patients per month by early 2026. The company also advertises 16 years of average
              advocate experience, 98% reported outcome improvement, and a largely insurance-covered model in which most
              patients pay little or nothing out of pocket. The cumulative reach story is less clean: the homepage shows
              45K+ patients helped while other company surfaces cite about 200,000 patients and families helped. That
              inconsistency means later chapters should rely on monthly patient volume, not a single lifetime-volume
              number. Revenue, ARR, headcount, office footprint, and ownership percentages remain undisclosed.
