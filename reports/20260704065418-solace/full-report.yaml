      - number: '5.3'
        title: Trust, compliance, and maturity
        blocks:
          - type: paragraph
            body: >-
              Trust and maturity are mixed. On the positive side, Solace consistently says it is HIPAA-compliant, uses
              encrypted data handling, limits itself to minimum-necessary PHI, and keeps patient information off a
              payments surface. It also points to Vanta and operates a nationwide, remote model that public sources say
              already serves more than 20,000 patients monthly through more than 2,000 advocates. CMS’s 2024 Principal
              Illness Navigation framework is useful context because it shows federal reimbursement infrastructure now
              exists for supervised navigation-style services involving auxiliary personnel. But that is contextual
              support, not an endorsement of Solace itself. The weak spot is proof depth. The source pack does not
              provide named hosting vendors, uptime SLAs, interoperability details, public release notes, independent
              audit artifacts beyond the Vanta mention, or a substantive privacy notice at the fetched HIPAA-notice URL.
              Likewise, product-roadmap evidence is broad rather than granular: Series B and C materials talk about
              platform investment, clinical research, and earlier payer/provider embedding, yet they do not disclose
              dated feature releases or security roadmap checkpoints. That leaves Solace looking commercially mature in
              service scale, but still under-disclosed in technical specifics. Even the company’s support and content
              surfaces look more operational than release-oriented: they help patients understand Medicare changes,
              security basics, and workflow expectations, but they do not expose the kind of granular change log, uptime
              dashboard, or audit packet that technical buyers usually want. For diligence, that shifts the burden from
              reading docs to requesting internal operating evidence.
