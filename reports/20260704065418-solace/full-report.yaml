        title: Retention, Repeat Usage, and Satisfaction
        blocks:
          - type: paragraph
            body: >-
              Solace’s retention evidence is directionally positive but incomplete. Public pages say each patient gets
              one dedicated advocate who can stay with them over time, and Solace explicitly says patients can keep
              working with the same advocate for as long as needed or return later for renewed help. Fresh named stories
              add qualitative longitudinal evidence: Robert’s caregiving case includes weekly check-ins and a
              support-group connection, Liz’s father received daily follow-up after specialist access was accelerated,
              Pearl’s memory-workup story includes reminders and family meetings, and Esther’s multi-specialist case
              stayed coordinated after an initial 48-hour mobilization. Review surfaces are strong for the category:
              official pages cite 4.7 stars across 8,332 reviews and more than 18,000 five-star reviews, while
              third-party review aggregators report a 4.5 Trustpilot-derived score from 357 reviews. At the same time,
              the company does not publicly disclose NRR, GRR, logo churn, renewal rates, contract length, or cohort
              retention, which are the real durability metrics investors would want. External review commentary also
              points to narrower issues around insurance eligibility, advocate availability, administration, and
              telehealth skepticism. The result is a picture of strong satisfaction and repeat-relationship intent, but
              not yet of quantified retention economics.
