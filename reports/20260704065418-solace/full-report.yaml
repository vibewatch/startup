      - number: '5.2'
        title: Clinical and technology architecture
        blocks:
          - type: paragraph
            body: >-
              The delivery architecture has three visible layers. First is clinician qualification: payer and Medicare
              materials describe a Solace physician or psychologist doing an initial evaluation and then connecting the
              patient to an advocate. Second is the advocate workforce itself, where public credential descriptions are
              directionally clinical but not perfectly consistent. The payer page says advocates include RNs, LCSWs, and
              other licensed clinical staff, while consumer pages simplify that to registered nurses and other
              healthcare professionals and the Bloomberg excerpt said the roster was all registered nurses at the time
              of Series C. Third is the software and data layer. Series B materials describe a proprietary EHR and data
              platform; the referral surface says advocates log updates in the Solace EHR; the Bloomberg excerpt adds
              Medicare billing tooling and an in-house EMR for patient histories. That is enough to support a real
              operating stack, but not enough to map hosting, interoperability, API coverage, or security architecture
              in detail. The externally legible moat today is therefore workflow orchestration and reimbursement
              enablement under clinician oversight, not a deeply disclosed technical stack. The referral surface
              reinforces that point by describing advocates reaching out for records, logging updates, and keeping the
              case organized inside the Solace EHR. In other words, Solace’s visible architecture is less about a
              self-serve patient application and more about a workflow system that lets clinically trained humans
              coordinate complex care at scale.
