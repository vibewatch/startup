  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: navigation is broader than advocacy, but Solace currently overlaps only part of it'
        blocks:
          - type: paragraph
            body: >-
              The fetched market sources define healthcare navigation as a mixed clinical, financial, and administrative
              workflow rather than a single software feature. Included Health describes navigation as a single point of
              entry that can cover claims and advocacy support, billing questions, expert clinical support, cost
              visibility, and care coordination for employers, health plans, and enterprises. Mordor further breaks the
              market into front-door navigation, health advocacy, condition-specific vertical navigation, and general
              navigation, then segments end users into employers, payers or health plans, providers or health systems,
              and others. That boundary matters because Solace does not currently map to all of those layers equally.


              Solace's public evidence is strongest around Medicare-covered advocacy: clinician-initiated intake,
              advocates working incident to clinical staff, chronic-condition and acute-condition support, and help with
              prior authorizations, provider coordination, and healthcare administration. That clearly overlaps the
              health-advocacy and care-coordination slice of the navigation market. It does not automatically make
              Solace equivalent to the full employer-navigation stack now sold by incumbents that bundle benefits front
              door, steerage, PBM integration, virtual care, or plan administration in one platform. Telehealth and
              direct care delivery are also adjacent rather than identical categories; CMS still treats telehealth as a
              separate Medicare coverage category. For market sizing and valuation, the right frame is therefore “Solace
              overlaps a fast-growing navigation market” rather than “Solace already equals the whole navigation
              platform market.”
