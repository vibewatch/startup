companyProfile:
  summary: >-
    Solace is a private virtual healthcare advocacy company founded in 2022 by Jeremy Gurewitz and Sara Sargent and
    publicly based in Redwood City, California. The company matches patients and families with dedicated advocates
    reachable by text, phone, and video inside a clinician-supervised workflow designed around Medicare and Medicare
    Advantage reimbursement, with commercial expansion beginning to appear in 2026 materials. Public evidence shows
    national delivery, more than 2,000 advocates, more than 20,000 patients served monthly, and about $211 million
    raised through a February 2026 Series C that valued the company above $1 billion. The main diligence limitation is
    not demand but underwriting opacity: public materials still do not disclose revenue, take rate, payer mix, gross
    margin, cash runway, or the detailed cap-table terms behind the unicorn mark.
