      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              Because revenue and round terms are undisclosed, the scenario framework should be relative to the February
              2026 mark rather than falsely precise in dollars. The bull case depends on three linked proofs:
              reimbursement remains durable, commercial or payer expansion becomes visibly material, and management
              demonstrates that a variable-share reimbursement model can produce attractive platform economics rather
              than just high service throughput. In that case Solace could justify a clear premium to the current mark.
              The base case is more modest and more useful: Medicare-led traction remains real, payer relationships
              deepen, and the company grows into the round without proving breakout economics fast enough to deserve a
              major rerating. The bear case is the one public-market comps warn about: category multiples compress,
              reimbursement or collections prove shakier than expected, and a future financing or transaction clears
              nearer to legacy-navigation benchmarks. The decision should therefore center on scenario triggers, not on
              a single headline valuation number.
