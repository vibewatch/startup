      - number: '4.3'
        title: Capital adequacy, comparable signals, and disclosure verdict
        blocks:
          - type: paragraph
            body: >-
              On a headline basis, capital adequacy looks strong. Solace raised $14 million in Series A, $60 million in
              Series B, and $130 million in Series C, with MedCity and Bloomberg placing lifetime funding at $211
              million and the latest valuation above $1 billion. Public use-of-funds language consistently points to
              advocate-network expansion, platform investment, clinical research, payer and provider partnerships, and
              in Bloomberg’s telling, significant marketing and hiring as well. That is enough to say the company is not
              obviously undercapitalized immediately after the February 2026 round. But it is not enough to underwrite
              liquidity. The reviewed public sources still omit cash on hand, monthly burn, runway, debt, and
              reimbursement working-capital dynamics. Comparable signals are informative but noisy rather than
              dispositive. Accolade showed about $440 million of TTM revenue yet only about $570 million of market cap
              before a roughly $621 million takeout, and CNBC framed that exit as part of a tougher digital-health
              public-market environment. Garner shows the opposite side of the range, disclosing 130% growth at Series D
              and about $200 million of gross ARR at Series E, but those disclosures come from a broader
              employer-navigation model. The verdict is therefore balanced: Solace’s financing position appears strong,
              but public disclosure is still too thin to model revenue quality, margins, or runway with confidence.
              MobiHealthNews adds another cautionary comp signal by noting that Accolade cut staff and downsized before
              its take-private transaction, underscoring how hard it has been for broader navigation platforms to
              sustain public-market expectations. That backdrop makes it even more important not to extrapolate a stable
              multiple from any single comp outcome.
