      - number: '4.2'
        title: Revenue quality, public traction, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Revenue quality looks directionally better than a purely cash-pay advocacy business because reimbursement
              appears to remove the main consumer pricing barrier, and the public scale signals are not trivial. Series
              C materials and independent coverage say Solace serves more than 20,000 patients monthly through a network
              of more than 2,000 advocates, with BusinessWire also citing 10x year-over-year growth. That combination
              suggests genuine payer-backed demand rather than only anecdotal patient acquisition. At the same time, the
              service clearly carries human-delivery cost: official Medicare coverage copy says each hour with an
              advocate is accompanied by roughly three hours of behind-the-scenes coordination, and the public service
              scope spans scheduling, provider coordination, prior authorization, billing disputes, and social-needs
              support. Those facts make take rate, utilization, and collections quality decisive for margins. Yet those
              are exactly the inputs the public record does not provide. Factually’s independent reviews are useful
              because they note that most direct coverage proof is still company-originated and should be checked
              against plan documents, which makes Solace’s revenue-quality evidence credible enough to map the mechanism
              but not strong enough to finish the unit-economic model. Additional official guides on billing disputes,
              prior authorization, and patient-advocate responsibilities make the service mix even clearer: Solace
              advocates are expected to chase documentation, handle appeals, reduce bills, and manage transitions of
              care. Those activities may improve revenue quality by making the service useful in expensive failure
              points of the system, but they also confirm that gross margin will be constrained by people-intensive work
              unless reimbursement yield and advocate utilization are strong.
