chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Delivery Model
        blocks:
          - type: paragraph
            body: >-
              Solace Health was founded in 2022 by Jeremy Gurewitz and Sara Sargent after Gurewitz’s experience helping
              his mother navigate pancreatic cancer care. Funding releases identify the company as based in Redwood
              City, California, while the official marketing site emphasizes mission rather than corporate location. The
              core offering is a virtual advocacy platform: patients typically complete a short physician intake, get
              matched to one dedicated advocate, and continue working with that advocate over text, phone, video, and
              asynchronous follow-up. Official pages consistently position Solace as insurance-covered healthcare
              advocacy, anchored in Medicare and many Medicare Advantage plans, with commercial-insurance expansion
              beginning to appear in 2026 materials. The company also presents a more formal clinical wrapper than a
              pure marketplace. Solace Health Medical Group is described as a clinician-led provider group delivering
              services nationwide under physician and psychologist oversight, and the company’s trust materials say the
              platform is HIPAA-compliant, encrypted, and limited to the minimum necessary PHI. The important nuance is
              role definition: advocates do substantial administrative and coordination work, but Solace repeatedly says
              they do not diagnose, prescribe, or replace treating physicians.
