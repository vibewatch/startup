  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Positioning
        blocks:
          - type: paragraph
            body: >-
              Solace is not a straight clone of the large employer-navigation vendors that dominate the public category
              conversation. Its public materials emphasize insurance-covered patient advocacy, a clinician-led intake,
              and a named advocate who executes work on the patient’s behalf rather than simply steering an employee
              through a benefits stack. That places Solace closest to reimbursed patient advocacy for Medicare and
              Medicare Advantage members, with some overlap into payer/provider care management, rather than squarely in
              the traditional self-insured-employer navigation bucket. By contrast, Included Health, Quantum Health,
              Rightway, Transcarent/Accolade and HealthJoy all present themselves primarily as employer, health-plan, or
              organization-facing platforms that combine navigation with broader benefits, clinical, pharmacy, or
              orchestration layers. The practical result is a split battlefield: Solace is strongest where the job is
              “take healthcare homework off the patient’s plate,” especially in complex chronic, aging, diagnostic,
              billing, and treatment-access workflows; the large suites are strongest where the buyer wants one
              enterprise contract, measurable employer savings, point-solution integration, and benefit-administration
              leverage.
