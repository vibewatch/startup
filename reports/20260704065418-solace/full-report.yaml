      - number: '2.2'
        title: 'Sizing lenses: global navigation TAM is useful context, but U.S. SAM remains evidence-constrained'
        blocks:
          - type: paragraph
            body: >-
              The cleanest top-down market estimate in the fetched corpus is Mordor Intelligence's global healthcare
              navigation platform forecast: USD 11.40 billion in 2025, USD 12.25 billion in 2026, and USD 17.61 billion
              by 2031 at a 7.52% CAGR. Mordor also reports that employers represented 45.63% of market revenue in 2025
              and North America 45.25%. Those figures support directional lensing: the implied global employer slice in
              2025 is roughly USD 5.2 billion, and the implied North American employer slice is roughly USD 2.35
              billion. But those are still analyst-model abstractions. They are not a U.S.-only, advocacy-only,
              Solace-specific SAM.


              The stronger evidence for demand comes from U.S. cost pressure and complexity rather than from a precise
              public SAM model. KFF says employer-sponsored insurance covers 154 million people under 65 and that
              average 2025 premiums reached USD 9,325 for single coverage and USD 26,993 for family coverage. Mercer
              says employer-sponsored health cost hit USD 17,496 per employee in 2025, while 2026 renewal increases
              averaged 9.2% before mitigation and 6.7% even after plan changes. McKinsey separately expects commercial
              healthcare costs to rise 9% to 10% annually from 2024 through 2026. CMS adds a broader payer backdrop,
              projecting 5.8% average national health expenditure growth through 2033 and especially strong Medicare
              growth. Taken together, these sources show why navigation budgets are being prioritized, but they still do
              not isolate the revenue pool Solace can win today across Medicare, MA, commercial employer, payer, and
              provider channels.
