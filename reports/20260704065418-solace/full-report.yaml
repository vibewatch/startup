  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Reimbursement durability breaks
        - >-
          Meaningful rollback in billable pathways, supervisory permissions, or payer willingness to reimburse advocacy
          work
        - Undercuts the core wedge that differentiates Solace from pure concierge or navigation vendors.
        - Treat as immediate thesis-break until management proves an alternate monetization engine.
      - - Commercial expansion stalls
        - No evidence that commercial coverage becomes a material second leg beyond scattered carrier references
        - Leaves the company over-dependent on Medicare-led growth and narrows long-term multiple support.
        - Keep recommendation at track or downgrade if valuation still assumes broad payer expansion.
      - - Economics disclosure disappoints
        - Diligence reveals weak take rate, low gross margin, poor collections, or high denial rates
        - Converts a promising narrative into a services-heavy model with limited leverage.
        - Do not proceed at current pricing; re-underwrite from a lower entry zone or walk away.
      - - Future financing embeds heavy seniority
        - >-
          Next round introduces punitive preferences, participation, or ratchets inconsistent with a premium growth
          round
        - Even if enterprise value holds, new-money returns can degrade sharply.
        - Treat as a no-go for common-like return expectations unless pricing resets materially.
      - - Category reset deepens
        - New public or M&A marks for navigation assets clear well below premium private expectations
        - Shrinks the set of defensible exits and raises the burden on Solace to prove outlier economics.
        - Tighten entry discipline and revisit base-case valuation range downward.
    notes: >-
      Thresholds are intentionally directional because the decisive variables are policy, payer economics, and financing
      terms rather than a single disclosed revenue line.
    claimRefs:
      - CV033
      - CV034
      - CV039
      - CV041
      - CV044
