      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Retained official sources surface a narrow but clear leadership picture. The founders remain front and
              center: Jeremy Gurewitz is the public CEO and origin-story carrier, while Sara Sargent is the co-founder
              and Chief Product Officer. On the clinical side, Solace publicly names John Taylor as Chief Medical
              Officer and Mark Upton as Medical Director, reinforcing that the company wants advocacy to sit inside a
              physician-supervised care-management structure rather than beside it. What is not public is equally
              important. In the retained source set, Solace does not disclose a public board roster, founder ownership,
              investor board rights, or broader functional leadership outside the founders and medical leadership. That
              creates a meaningful diligence blind spot for a company that has already raised late-stage venture
              capital. It also raises key-person risk: Gurewitz and Sargent appear to hold most of the public strategic
              narrative, product thesis, and investor messaging, so any departure or role disruption would likely be
              material. For later chapters, the practical takeaway is that Solace looks founder-led and clinically
              supervised, but not transparently governed from a public-markets standpoint.
