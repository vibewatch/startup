            body: >-
              Public scale signals are meaningful but not perfectly synchronized. Solace’s February 2026 Series C
              materials and independent pickup say the platform serves more than 20,000 patients monthly and has a
              national network of more than 2,000 advocates. Separately, multiple current official pages say Solace has
              helped more than 200,000 patients, individuals, or families cumulatively, while the homepage still showed
              a smaller 45K-plus patients-helped counter at fetch time. The safest interpretation is that the company
              has real national adoption and rapid growth, but that some website counters lag or use different
              denominators. Satisfaction and social-proof surfaces are also large by category standards: the outcomes
              page cites 8,332 reviews at 4.7 stars, the referral page cites more than 18,000 five-star reviews, and
              outside review aggregators point to a smaller but still meaningful Trustpilot review base. For diligence,
              the key takeaway is that Solace has crossed from anecdotal demand into scaled usage, yet its public
              adoption dashboard still lacks one canonical metric set.
