      - number: '6.5'
        title: Expansion Paths and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              The biggest upside is expansion from a Medicare-first covered service into broader commercial and
              embedded-care pathways. Solace now says it covers commercial insurance nationally, including
              employer-sponsored plans, and multiple financing articles say the next phase is deeper payer and provider
              partnerships that place advocacy earlier in the care journey. The biggest risk is concentration: public
              evidence still suggests a heavy reliance on Medicare and Medicare Advantage reimbursement,
              referral-provider channels, and company-controlled testimonials rather than a diversified public sponsor
              roster. There is also transparency risk around who actually pays in volume, because public materials do
              not break out Original Medicare versus Medicare Advantage versus commercial volume, nor do they disclose
              top-payer or top-referral-source exposure. Limited public employer logos, no disclosed sponsor cohorts,
              and inconsistent patient counters make it difficult to tell whether Solace’s commercial expansion is still
              early pilot activity or already meaningful revenue diversification.
