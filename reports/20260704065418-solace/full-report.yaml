  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and reimbursement mechanics
        blocks:
          - type: paragraph
            body: >-
              The public record supports a reimbursement-backed advocacy model rather than a transparent SaaS price
              sheet. Solace’s patient, FAQ, and Medicare coverage pages say the service is covered by Original Medicare
              and many Medicare Advantage plans, now expanding into commercial coverage as well, and public patient-cost
              claims cluster around 94%-95% of users paying nothing out of pocket. The payer page adds the operational
              detail that a Solace physician or psychologist completes the intake and then an advocate works incident to
              the initiating clinician. CMS’s 2024 Principal Illness Navigation rule independently matters because it
              explicitly created payment for navigation-style services furnished by auxiliary personnel under
              billing-practitioner supervision. Bloomberg supplies the missing monetization link: Solace’s technology
              handles Medicare billing and the company retains a variable share of reimbursements paid to advocates. For
              users outside covered plans, Solace publicly mentions hourly rates and free intro calls, but it still does
              not publish a rate card. The practical conclusion is a clinician-led, insurance-billed services platform
              with a self-pay fallback, not a classic subscription catalog. Solace’s own care-coordination guide
              reinforces that framing by explicitly tying Medicare support to Chronic Care Management, Transitional Care
              Management, and Medicare Advantage coordination programs. That does not prove Solace is paid under one
              single code family, but it does strengthen the public case that the business is built around reimbursable
              coordination work rather than discretionary consumer spend.
