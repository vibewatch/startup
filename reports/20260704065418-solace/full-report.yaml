      - number: '2.3'
        title: >-
          Buyer, user, and payer map: employers buy simplification, while Solace's current proof point is Medicare
          advocacy
        blocks:
          - type: paragraph
            body: >-
              In employer navigation, the economic buyer is typically the self-insured employer or benefits leader, the
              user is the employee or dependent, and the economic payoff is lower trend plus higher benefits
              satisfaction. Quantum's 2026 report shows what employers are now shopping for: one accountable guide
              across carriers, PBMs, and providers; clinically led navigation rather than pure call-center support;
              quality-first steerage; and AI used to augment human experts rather than replace them. Quantum also
              reports that 93% of employers want technology solutions that still include human support. That favors
              platforms that can combine digital triage with high-touch intervention.


              Solace partially overlaps that demand pattern, but from a different starting point. Its strongest
              evidence-backed route to market is Medicare and Medicare Advantage advocacy, enabled by direct billing
              infrastructure and CMS-aligned care-management workflows. Solace has also disclosed commercial coverage
              availability and deeper payer/provider partnership ambitions, but not employer-client count, covered
              lives, PMPM pricing, or commercial revenue mix. Meanwhile incumbent navigation vendors pitch broader
              employer suites: Quantum says it serves 500-plus employers; Included combines advocacy, navigation, and
              virtual care for employers and health plans; Rightway adds PBM integration and ROI claims; Transcarent
              emphasizes unified partner access and reporting; HealthJoy combines AI, concierge support, billing
              appeals, and steerage. The practical conclusion is that Solace has credible adjacency into employer
              navigation, but its public evidence today fits a Medicare-rooted advocacy beachhead with payer-provider
              expansion potential rather than a proven employer category leader.
