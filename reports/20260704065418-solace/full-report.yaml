  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and ARR
        - Current revenue, ARR, and growth bridge by payer and cohort
        - Needed to convert the unicorn signal into a valuation model rather than a financing headline.
        - 'Finance package: monthly revenue bridge, trailing twelve month view, and board budget.'
      - - Reimbursement economics
        - Take rate, gross-to-net waterfall, denial rates, appeals, and days sales outstanding
        - Tests whether Solace is a scalable platform or a thin-margin services intermediary.
        - Revenue-cycle review with payer contracts, billing operations, and collections dashboards.
      - - Payer mix and expansion
        - >-
          Share of patients and revenue from Original Medicare, Medicare Advantage, commercial, and self-pay plus signed
          commercial contracts
        - Determines concentration risk and the realism of the commercial-upside narrative.
        - Commercial and payer diligence with contract summaries and launch timelines.
      - - Cap table and preferences
        - Fully diluted share count, Series C share price, liquidation stack, secondary components, and pro rata rights
        - Returns can differ radically from the headline valuation when terms are opaque.
        - Legal and finance review of the latest cap table and transaction docs.
      - - Independent outcomes evidence
        - Third-party or peer-reviewed studies showing lower cost trend, better adherence, or faster time-to-care
        - Would strengthen the case that advocacy is becoming durable infrastructure rather than a funding-cycle theme.
        - Clinical research and payer ROI packet, including any unpublished analyses.
      - - Exit readiness
        - Audit status, banker preparation, data-room maturity, and management's updated IPO or strategic-sale plan
        - Late-stage pricing requires a believable liquidity path, not only category enthusiasm.
        - Board-level diligence with CFO, counsel, and any external advisors.
    notes: Each ask is tied to a specific underwriting gap surfaced by the retained public corpus; none are cosmetic.
    claimRefs:
