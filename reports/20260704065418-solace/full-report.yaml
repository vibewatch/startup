      - number: '7.5'
        title: People, Execution, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              People risk matters because Solace sells continuity, judgment, and persistence, not just access to a
              software workflow. The company promises one dedicated advocate who stays with the patient over time, and
              its own descriptions emphasize nurses, LCSWs, and other licensed clinical staff working under clinician
              oversight. That makes staffing quality, supervisor bandwidth, and retention more important than a generic
              headcount number. Yet the public corpus does not disclose advocate attrition, caseloads, response-time
              SLAs, or supervisor-to-advocate ratios. A fully remote, early-stage organization can move quickly, but it
              can also hide operational strain until service consistency slips. The right investment posture is
              therefore threshold-based. If reimbursement integrity weakens, if public trust breaks after a security or
              quality incident, if partner-driven growth stalls, or if workforce metrics reveal burnout or thin
              supervision, the thesis should be downgraded quickly. Solace may still be building a valuable layer in
              healthcare, but the fetched evidence says the company has to prove durable execution, not just demand.
