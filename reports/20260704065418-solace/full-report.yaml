      - number: '7.3'
        title: Operational, Security, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Solace is a human-in-the-loop care platform, which creates a very different failure profile
              from a self-serve SaaS product. The company says it is HIPAA-compliant, uses encrypted data handling, and
              captures only minimum-necessary PHI, but the fetched public evidence does not include the independent
              audit detail, incident history, or control testing an investor would want to size residual security risk.
              If OCR ultimately finalizes the HIPAA Security Rule changes described in recent healthcare-law commentary,
              the control burden could rise further through annual audits, asset inventories, MFA, encryption, and
              faster business-associate notifications. Service delivery is also fundamentally remote: Solace works by
              phone, video, text, and email, and advocates coordinate much of the care journey off-screen. That can be
              efficient, but it also creates exposure to triage errors, inconsistent follow-through, and skepticism from
              patients who distrust telehealth-heavy models. The most adverse public signals in the fetched corpus are
              not allegations of proven misconduct; they are softer warnings that complaints tend to cluster around
              administrative inconsistency, eligibility surprises, and availability constraints. Those are exactly the
              kinds of frictions that can widen when a high-touch service scales faster than supervision, QA, and
              staffing discipline.
