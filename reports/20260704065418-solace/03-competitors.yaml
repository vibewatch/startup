tables:
- id: TP001
  title: Competitor profile table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: Covers the six most visible public peer platforms plus the main status-quo substitute set evidenced in the fetched corpus. Smaller regional navigators, payer-owned point tools, and provider-specific care-coordination programs are excluded because the fetched bundle does not provide enough public scale data to compare them reliably.
  columns:
  - Competitor
  - Category
  - Public scale / funding
  - Primary buyer / user
  - Product scope
  - Differentiation vs Solace
  - Key limitation vs Solace
  rows:
  - - Solace
    - Direct patient-advocacy platform
    - '>20,000 patients monthly; >2,000 advocates; $130M Series C at >$1B valuation'
    - Medicare and Medicare Advantage patients; payer and provider partners
    - Dedicated human advocate, clinician-led intake, care coordination, billing and access help
    - Insurance-covered, patient-aligned, no-homework advocacy model
    - Far narrower employer platform breadth than enterprise suites
  - - Included Health
    - Broad navigation plus virtual care platform
    - About 300 employers and health plans; says it is profitable and growing double digits
    - Employers, health plans, public sector, labor unions, consultants
    - Navigation, advocacy, AI-native plan design, primary care, specialty care, mental health
    - Much broader care-delivery footprint than Solace
    - Public positioning is employer- and organization-first, not Medicare-first
  - - Quantum Health
    - Employer navigation and care coordination platform
    - 25+ years; 500+ employers; 850+ integrations
    - Self-insured employers and workforce populations
    - Navigation, care coordination, provider guidance, pharmacy support, analytics
    - Strong procurement fit for employers seeking ROI and integration depth
    - Member relationship runs through employer benefits rather than independent patient advocacy
  - - Rightway
    - Care navigation plus PBM
    - 3M+ members; hundreds of thousands of Fortune 500 employees; recent >97% client retention
    - Employers and health systems
    - Navigation, billing help, pharmacy benefits management, app-driven member support
    - Strongest pharmacy/PBM adjacency in the peer set
    - Not positioned around reimbursed Medicare patient advocacy
  - - Transcarent + Accolade
    - Broad enterprise health-and-benefits platform
    - '>20M members; >1,700 employer and health plan clients; Accolade FY2024 revenue about $414M'
    - Self-insured employers, health plans, unions and members
    - AI navigation, advocacy, expert opinion, virtual primary care, pharmacy, specialty care, point-solution store
    - Broadest suite and strongest one-contract enterprise story
    - Buyer and feature scope are much broader than Solace’s current lane
  - - HealthJoy
    - Benefits operating system / concierge layer
    - 1,800+ clients; 94% satisfaction; 2.5x point-solution utilization
    - Employers, consultants, HR and finance leaders
    - Benefits OS, JoyAI, concierge, steerage, reporting
    - Strong engagement and operating-system framing for HR buyers
    - Less clinically deep and less advocacy-specific than Solace
  - - Status-quo substitutes
    - Private advocates, hospital advocates, insurer case managers
    - Private advocates often $100-$500/hour; hospital and insurer programs usually free to member
    - Patients and caregivers already inside hospitals or health plans
    - Episodic hospital help, conflicted insurer navigation, or cash-pay private advocacy
    - Familiar and already embedded in existing care settings
    - Limited continuity, narrower scope, or misaligned incentives
  notes: Public scale and scope compare heterogeneous models; rows emphasize disclosed buyer/channel orientation and what the fetched corpus makes comparable, not identical unit economics.
