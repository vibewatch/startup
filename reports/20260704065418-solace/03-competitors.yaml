- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public contract model
  - Public member charge signal
  - Public price / unit
  - Public packaging signal
  - Competitive implication
  rows:
  - - Solace
    - Medicare / Medicare Advantage reimbursement plus payer-provider partnerships
    - Covered members can pay $0 or little out of pocket
    - Uncovered commercial list pricing not publicly disclosed
    - 20-minute physician intake, one dedicated advocate, ongoing text / phone / video support
    - Distinctive consumer payment model lowers friction for covered Medicare patients
  - - Included
    - Custom enterprise contracts with employers and health plans
    - Member access depends on employer or organization benefits
    - Not publicly disclosed
    - Navigation plus advocacy, AI-native design, primary care, specialty, mental health
    - Broader clinical stack than Solace, but procurement runs through employers and plans
  - - Quantum
    - Employer contract; tiered navigation packages
    - Employer-sponsored benefit
    - Not publicly disclosed
    - Embold Plus, Flex and Signature packages with different breadth and disruption levels
    - Strong fit for employers buying ROI-oriented navigation depth
  - - Rightway
    - Employer contract; PBM plus navigation or stand-alone navigation
    - Employer-sponsored benefit
    - Transparent-fee claim, but actual fee not public
    - Neutral PBM, navigation, bill resolution, app, cost comparisons
    - Harder for Solace to match when pharmacy savings drive the buying decision
  - - Transcarent + Accolade
    - One contract, simplified, for employers and health plans
    - Member access typically included through benefit sponsor
    - Not publicly disclosed
    - AI WayFinding, advocacy, expert opinion, primary care, pharmacy, experience store
    - Strongest one-platform procurement story in the peer set
  - - HealthJoy
    - Employer / consultant platform contract
    - Employer-sponsored benefit
    - Not publicly disclosed
    - Benefits operating system, JoyAI, concierge and reporting
    - Competes more on HR execution and engagement than deep advocacy
  - - Status-quo substitutes
    - Cash-pay or already embedded in hospital / insurer relationship
    - Hospital and insurer programs usually no separate member charge
    - 'Private advocates: roughly $100-$500 per hour in fetched Solace explainer'
    - Episodic hospital advocacy or insurer case management
    - Solace wins if patients value independence, continuity and lower out-of-pocket burden
  notes: The public comparison is mostly packaging rather than hard price because enterprise peers do not disclose rate cards in the fetched corpus. Solace’s Medicare / MA coverage is the clearest member-charge differentiator.
