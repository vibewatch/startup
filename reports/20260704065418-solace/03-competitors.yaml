- id: FP003
  title: Moat / readiness KPIs
  type: kpi
  layout: standard
  summary: 'Compact public-readiness view of Solace’s competitive position. The KPIs emphasize where public evidence is strongest: reimbursed access, advocate supply, workflow intensity and current scale.'
  data:
    items:
    - label: Monthly patient volume
      value: '>20,000'
      detail: Publicly disclosed current monthly patient volume; still much smaller than Transcarent + Accolade’s 20M-member footprint.
    - label: Advocate network
      value: '>2,000 advocates'
      detail: Large human-service layer for a young company, but not directly comparable to enterprise-suite member counts.
    - label: Covered footprint
      value: Original Medicare + many MA plans nationwide
      detail: Distinct reimbursement fit versus employer-sponsored peers whose public model depends on benefit sponsors.
    - label: Work-done-for-you intensity
      value: 3 additional backstage hours per help hour
      detail: Signals deeper execution than lighter concierge or steerage layers, but also implies service-delivery complexity.
    - label: Funding runway
      value: $130M Series C at >$1B valuation
      detail: Gives Solace capital to scale, though broader platforms still show larger public distribution and bundle depth.
