callouts:
- calloutType: strength
  title: Solace’s strongest public differentiation is alignment, not breadth
  body: 'The fetched corpus most clearly supports a focused claim: Solace is built so a dedicated, clinician-supervised advocate works for the patient and can often be covered by Medicare or Medicare Advantage. That is a materially different positioning from employer-first navigation stacks that optimize around procurement breadth and benefit operations.'
  claimRefs:
  - CP032
  - CP034
  - CP039
  - CP044
- calloutType: risk
  title: Broad suites can out-bundle Solace if the buying center is HR or a health plan
  body: The competitive risk is not that Solace lacks human advocacy. It is that larger platforms now package advocacy together with PBM, virtual care, AI triage, analytics and point-solution orchestration under one employer-facing contract. Without public retention and contract data, it is hard to know how resilient Solace is when buyers want that full stack.
  claimRefs:
  - CP036
  - CP037
  - CP043
  - CP050
