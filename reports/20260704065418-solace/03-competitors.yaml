  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-coverage
    missingEvidence: Publicly comparable data on smaller regional navigators, payer-owned navigation products and provider-built care-management entrants.
    whyItMatters: These omitted players may matter in specific geographies or payer channels even if they are not the main national peers.
    diligencePath: Expand the competitor census with payer, provider and regional-navigation discovery work and add rows if public scale data exists.
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: Realized contract values, PEPM rates, reimbursement yields, discounts and gross-margin structure for Solace and enterprise peers.
    whyItMatters: Public packaging alone is not enough to judge pricing power or resilience against bundled-suite competition.
    diligencePath: Request payer contracts, MA reimbursement by code, enterprise rate cards and realized-price cohorts from management.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Solace’s current payer-provider partner counts, referral concentration, Medicare versus Medicare Advantage mix and cohort-level retention.
    whyItMatters: Distribution durability and channel concentration determine whether Solace can scale without relying on expensive direct patient acquisition.
    diligencePath: Ask for partner roster, referral share by channel and retention by payer or provider cohort.
    relatedQuestionRefs:
    - QP027
  - type: missing-source
    severity: material
    topic: retention-and-multi-homing
    missingEvidence: Win-loss data, repeat-use rates, member retention and evidence on how often patients or sponsors multi-home with broader navigation suites.
    whyItMatters: Without this data, the durability of Solace’s relationship-based switching costs is hard to judge.
    diligencePath: Request churn, repeat-use, referral-source persistence and competitive displacement data from management or payer partners.
    relatedQuestionRefs:
    - QP028
