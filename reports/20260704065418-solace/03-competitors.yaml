- id: peer-profiles-and-packaging
  title: Peer Profiles and Packaging
  body: 'The fetched corpus supports a clear peer set, but not a single homogeneous category. Included and legacy Accolade are the closest analogs if Solace tries to move toward a more complete advocacy-plus-care experience; both pair advocacy with virtual clinical services and benefits guidance. Quantum and Rightway are clinically led navigation platforms too, but their public positioning is decisively employer-first and ROI-first: Quantum sells tiered navigation packages and emphasizes claims savings, denial reduction, high-cost-claim engagement and a large integration layer, while Rightway couples navigation with a transparent-fee PBM and benefit-manager workflow relief. Transcarent/Accolade is the broadest suite in the set, combining AI WayFinding, care experiences, pharmacy, advocacy, expert medical opinion, and a single procurement wrapper. HealthJoy is comparatively lighter on clinical depth but stronger as a benefits operating system and engagement layer for HR-led deployments. Public
    pricing is mostly opaque across the enterprise set, so packaging, buyer orientation, and who bears the member charge are the useful comparison points rather than nominal rate cards.'
  tableRefs:
