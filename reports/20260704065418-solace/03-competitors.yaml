- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk dimension
  - Current assessment
  - Threat
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Medicare / MA reimbursement fit
    - Strong
    - Provider or payer programs imitate reimbursed navigation using CMS policy support
    - Solace publicly emphasizes Medicare coverage; CMS now separately pays for PIN services
    - Medium
    - Request reimbursement by code, denial rates, and payer mix by plan type
  - - Patient alignment and trust
    - Strong
    - Hospital and insurer substitutes remain familiar and embedded in existing workflows
    - Solace says advocates work for the patient, while hospital and insurer programs have scope or incentive limits
    - Medium
    - Validate repeat-use, NPS and referral rates versus status-quo alternatives
  - - Human-executed no-homework workflow
    - Strong
    - AI-led or lower-touch concierge products undercut service intensity
    - Solace’s model stresses done-for-you execution and backstage care coordination hours
    - Medium
    - Measure advocate productivity, case complexity and outcomes by cohort
  - - Platform breadth
    - Weak to moderate
    - Broad suites bundle navigation with care, PBM, analytics and one-contract procurement
    - Transcarent/Accolade, Included, Quantum and Rightway all market wider stacks
    - High
    - Stay focused on high-acuity Medicare workflows or add targeted partnerships rather than full-stack sprawl
  - - Distribution leverage
    - Moderate
    - Enterprise peers have much larger disclosed member, client or employer reach
    - Public peer metrics materially exceed Solace’s disclosed monthly patient volume
    - High
    - Prove payer/provider channel efficiency and partnership-driven acquisition economics
  - - Category structure
    - Adverse trend
    - Consolidation and commoditization compress standalone navigation positioning
    - Included describes category commoditization; Transcarent acquired Accolade for scale
    - High
    - Show differentiated outcomes in chronic, aging and treatment-access cohorts
  notes: Severity reflects competitive durability over the next 24–36 months, not a default investment recommendation. Several rows remain constrained by undisclosed retention, payer-mix and pricing data.
