        title: Exhibits
        blocks:
          - type: callout
            title: Out-of-Band Architectural Tradeoff
            body: >-
              Salt Security's out-of-band traffic mirroring guarantees zero latency impact on production applications,
              but shifts runtime enforcement entirely to third-party integrations with WAFs, API gateways, and SOAR
              platforms rather than offering native inline packet dropping.
            calloutType: insight
            claimRefs:
              - CE002
              - CE012
          - type: callout
            title: Behavioral Baselines & Baselining Latency
            body: >-
              ML-driven behavioral detection requires approximately 30 days of representative production traffic to
              stabilize per-user and per-endpoint baselines, creating a window of potential false positives or delayed
              BOLA detection for newly deployed services.
            calloutType: risk
            claimRefs:
