      - number: '7.4'
        title: Risk Prioritization and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Strategic and financial risks confronting Salt Security center on competitive consolidation, capital
              structure discipline, and execution continuity. Following Akamai's $450 million acquisition of Noname
              Security in June 2024 and Harness's merger with Traceable in March 2025, Salt Security remains the only
              independent pure-play API security vendor among the category's original pioneers. While standalone status
              preserves vendor neutrality and specialized engineering focus, it exposes Salt to aggressive platform
              bundling and pricing pressure from broader cloud security suites like Akamai and integrated DevSecOps
              platforms like Harness. Independent market intelligence scores Salt Security's defensibility at 13 to 14,
              characterizing its proprietary behavioral baseline moat as contested under competitive pressure. Moreover,
              Salt's rapid 2026 repositioning around agentic AI security and MCP monitoring creates an execution gap, as
              third-party endorsements and customer references predominantly validate its traditional API protection
              capabilities. Core investment thesis-break triggers include: (1) gross margin compression or accelerated
              customer churn driven by bundled competitor pricing; (2) evidence of high-profile customer breaches
              originating through unmitigated prompt injection or authenticated rogue agents; (3) failure to secure
              multi-year contract renewals with core enterprise clients; and (4) operational disruption to core research
              and development velocity within its Israeli engineering facilities without proven geographic redundancy.
            claimRefs:
              - CR007
              - CR008
              - CR009
