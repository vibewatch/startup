  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Salt Security operates across heavily regulated enterprise verticals including banking, financial
              technology, healthcare, and global retail, exposing the vendor to stringent regulatory compliance and
              legal liability standards. The company's Policy Hub and API Posture Governance engine provide automated
              compliance mapping against major statutory regimes, including PCI DSS v4.0, PSD2, HIPAA, GDPR, CCPA, LGPD,
              and FFIEC guidelines. The Policy Hub incorporates approximately 100 pre-configured posture rules and
              customizable templates designed to identify sensitive data leakage, improper authorization, and
              configuration drift before audits occur. However, the rapid emergence of agentic AI frameworks—most
              notably the phased enforcement of the European Union AI Act—introduces heightened legal exposure for
              autonomous software interacting with enterprise records. High-risk AI implementations under the EU AI Act
              mandate verifiable human oversight, detailed technical documentation, and continuous risk management
              across execution layers. While Salt Security provides posture governance and runtime monitoring across
              APIs and Model Context Protocol servers, failure to satisfy evolving EU AI Act standards or cross-border
              data transfer mandates could expose enterprise customers to severe administrative penalties, creating
              procurement friction and slowing contract expansion across multinational accounts.
            claimRefs:
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
