      - number: '7.3'
        title: Partner Infrastructure and Procurement Dependencies
        blocks:
          - type: paragraph
            body: >-
              Salt Security's deployment architecture and commercial go-to-market motions introduce material
              dependencies on major cloud hyperscalers, web application firewall providers, and enterprise security
              platforms. The platform's software-as-a-service tier relies extensively on Amazon Web Services (AWS)
              infrastructure for large-scale data lake processing and behavioral baseline modeling, complemented by
              local hosting expansions such as its Sydney, Australia deployment. Salt also depends heavily on edge
              enforcement partnerships, utilizing Salt Managed Rules for AWS WAF as well as native integrations with
              Cloudflare and Akamai to execute inline blocking when malicious behavioral anomalies are detected.
              Disruption to these integration channels or changes to partner API access policies could impair real-time
              enforcement capabilities. On the commercial front, Salt Security leverages AWS Marketplace private offers
              as a primary procurement vehicle, where contracts anchor software fees to monthly API call quotas, such as
              $36,000 annually for up to 5 million monthly calls and $100,000 for 100 million calls, alongside $1 per
              request overage fees on higher tiers. For hybrid enterprise deployments requiring passive network
              mirroring, customer-managed collectors, or complex gateway connectors, total cost of ownership escalates
              significantly beyond base licensing fees. Additionally, research by Salt Labs highlighting vulnerabilities
              in external agent platforms, such as the Manus AI platform account hijacking flaw, emphasizes the
              operational risks inherent in third-party agentic software integrations.
            claimRefs:
              - CR012
              - CR013
              - CR014
