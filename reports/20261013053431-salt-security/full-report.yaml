            title: Multiple Compression and Liquidation Preference Overhang
            body: >-
              With over $281M in total capital raised and no disclosed primary equity financing in over four years,
              later-stage liquidation preferences may severely compress common equity returns under realistic base-case
              acquisition or recapitalization scenarios.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
