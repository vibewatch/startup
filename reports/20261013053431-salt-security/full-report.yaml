    columns:
      - User Job / Operational Task
      - Traditional Security Workflow
      - Salt Security Operating Solution
      - Measurable Workflow Benefit
      - Architectural Limitation / Boundary
    rows:
      - - Shadow & Zombie API Discovery
        - Manual spreadsheet audits, developer self-reporting, or static gateway configuration exports
        - Continuous automated mirroring of live traffic to identify active undocumented and deprecated endpoints
        - Complete visibility into active attack surface within minutes of sensor deployment without developer friction
        - Requires traffic mirroring coverage across all network segments; untagged or encrypted paths can remain blind
      - - BOLA / BOPLA Exploit Prevention
        - Signature-based WAF inspection or static application security testing (SAST) missing business logic flaws
        - Machine learning baselines comparing user authorization context against historical object access norms
        - Pinpoints broken object-level authorization attacks during reconnaissance before data exfiltration occurs
        - Requires approximately 30 days of representative production traffic for behavioral models to stabilize
      - - Pre-Production & Runtime Posture Hardening
        - Periodic penetration testing and vulnerability scans generating disconnected reports
        - Continuous runtime feedback loop feeding developer-specific remediation context and drift analysis into CI/CD
        - >-
          Reduces alert noise by up to 96% by grouping related probe attempts into a single consolidated incident
          timeline
        - Developers must actively integrate remediation insights into backlogs; Salt does not rewrite code
      - - Agentic AI & MCP Server Governance
        - Unmonitored developer deployment of LLM plugins, desktop MCP servers, and autonomous agent workflows
        - Live Agentic Security Graph mapping agent-to-tool API calls, flagging over-permissioned tools and shadow MCPs
        - Ensures autonomous agent workflows adhere to enterprise data boundaries and regulatory governance standards
        - Emerging protocol landscape; agent frameworks evolve rapidly and require continuous connector updates
    notes: >-
      Operational workflow comparisons derived from vendor architecture briefs, AppSec Santa reviews, and enterprise
      buyer guidance.
