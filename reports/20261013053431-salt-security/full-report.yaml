      - number: '7.2'
        title: Operational Threats and Agentic Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The proliferation of autonomous AI agents and Model Context Protocol (MCP) servers has profoundly altered
              the operational threat surface for enterprise software. Empirical research conducted by Salt Security
              across more than 300 enterprise security leaders demonstrates that 92% of organizations lack the advanced
              security maturity required to defend complex agentic environments. Operational vulnerability is further
              underscored by the fact that 47% of surveyed organizations have delayed production software releases due
              to unresolved API security concerns, while 32% experienced an active API security incident during the
              preceding twelve months. A critical finding from Salt Labs threat intelligence is that 99% of modern API
              attack attempts originate from authenticated sources, frequently involving compromised service credentials
              or rogue autonomous agents operating without human supervision, rate limits, or behavioral guardrails.
              Furthermore, 65% of recorded attacks exploit Security Misconfigurations under the OWASP API8 standard, a
              failure mode that is dramatically amplified when over-permissioned APIs are connected to autonomous LLMs
              capable of querying, chaining, and exfiltrating data at machine speed. With prompt injection established
              as the preeminent vulnerability in the OWASP Top 10 for LLM Applications 2026, Salt Security's Agentic
              Security Graph must continuously map relationships across LLMs, MCP servers, and downstream APIs to
              prevent unauthorized tool execution and sensitive data exfiltration.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
