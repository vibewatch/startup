      - number: '4.2'
        title: Cost Structure, Hosting Drivers, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Salt Security's cost of goods sold (COGS) is driven by cloud infrastructure hosting, distributed traffic
              metadata ingestion, and specialized machine learning inference compute. Unlike inline reverse-proxy
              solutions, Salt operates via out-of-band traffic mirroring and cloud connectors, which eliminates inline
              latency bottlenecks but shifts infrastructure processing costs entirely onto Salt's cloud analytics
              backend. Industry survey data from Salt highlights that 47% of enterprise respondents experienced API
              volume growth between 51% and 100% year-over-year, driving natural expansion across customer volume bands
              while simultaneously escalating backend ingestion compute. Total cost of ownership for buyers extends
              beyond direct software subscriptions to include external cloud egress, on-premises hybrid server
              deployments, and external Web Application Firewall (WAF) licensing required for automated inline blocking.
              Core unit economics metrics—including gross margin percentage, net revenue retention (NRR), and customer
              acquisition cost (CAC) payback—remain strictly confidential, requiring prospective investors to underwrite
              potential cloud compute margin compression during formal diligence.
            claimRefs:
              - CI007
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI008
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI007
              - CI010
              - CI012
      - number: '4.3'
        title: Traction Scale, Competitive Tradeoffs, and Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Public competitive intelligence and analyst reporting attribute roughly $75M in annual recurring revenue
              to Salt Security, positioning the company as an established dedicated pure-play vendor within the API
              protection category. Customer sentiment on Gartner Peer Insights and TrustRadius highlights strong
              customer satisfaction with agentless API discovery and automated shadow API inventory creation. However,
              customer reviews also document enterprise implementation friction, specifically around complex identity
              integrations involving Okta and DPoP protocols that require dedicated professional services.
              Architecturally, Salt's dedicated out-of-band positioning presents commercial tradeoffs against
              consolidated Cloud Web Application and API Protection (WAAP) suites. Competitors such as Imperva (backed
              by Thales) bundle native Web Application Firewalls, DDoS mitigation, and bot defense into a single inline
              platform, whereas Salt requires integrations with third-party network devices to achieve automated
              mitigation. This architectural distinction exposes Salt to vendor consolidation pressures and potential
              pricing concessions in accounts prioritizing unified edge tooling.
            claimRefs:
              - CI008
              - CI009
              - CI011
      - number: '4.4'
        title: Capital Adequacy and Financial Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capital adequacy perspective, Salt Security has accumulated $281M in lifetime venture funding,
              crowned by a $1.4B valuation achieved during its Series D round. However, the company has released no
              public disclosures regarding its post-2022 cash reserves, monthly cash burn, or operational runway. In an
              underwriting context, Salt displays high structural revenue quality rooted in recurring enterprise
              contracts and expanding API call volumes, but its financial profile carries significant valuation tension.
              An estimated $75M revenue base against a $1.4B private valuation implies an entry multiple exceeding 18x
              ARR. In the absence of audited net retention, gross margins, and verified cash runway, institutional
              underwriters cannot validate whether Salt is operating near cash-flow breakeven or remains dependent on
              external capital markets. Consequently, access to audited financial schedules, retention cohorts, and COGS
              accounting remains a mandatory diligence prerequisite before confirming investment conviction.
            claimRefs:
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Multiple Compression Risk
            body: >-
              Salt Security's last reported valuation of $1.4B against estimated revenue of $75M implies a revenue
              multiple exceeding 18x. In the absence of disclosed profitability or hyper-growth metrics (>80% YoY), this
              multiple presents substantial down-round or multiple compression risk relative to public cybersecurity
              comparables.
            calloutType: risk
            claimRefs:
              - CI008
              - CI014
          - type: callout
            title: Agentic AI as an Expansion Wedge vs. Margin Pressure
            body: >-
              While Salt's extension into agentic security (LLMs, MCP servers, and coding assistants) provides a timely
              narrative and GTM expansion path, bundling Salt Code at no additional charge delays immediate software
              margin expansion, while increasing cloud processing and model analysis compute requirements.
            calloutType: insight
            claimRefs:
              - CI004
              - CI006
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition & Core Module Portfolio
        blocks:
          - type: paragraph
            body: >-
              Salt Security provides an enterprise API Protection Platform designed to secure APIs across their entire
              lifecycle, spanning continuous discovery, posture governance, and runtime threat detection. As modern
              software engineering teams embrace microservice architectures and continuous deployment, undocumented API
              sprawl creates severe enterprise vulnerability blind spots. The platform continuously inventories REST,
              GraphQL, and SOAP interfaces across on-premises, cloud, and hybrid environments, uncovering dormant zombie
              endpoints and uncataloged shadow services. Beyond traditional web APIs, Salt has extended its core
              platform into emerging autonomous systems through the Salt Agentic Security Platform. This extension
              introduces Agentic Security Posture Management (AG-SPM) and AI Detection and Response (AI-DR), mapping
              Model Context Protocol (MCP) servers, large language model integrations, and agent tool execution paths.
              Salt Policy Hub complements runtime monitoring by providing approximately one hundred pre-loaded
              compliance rules that map endpoint configurations and sensitive data flows to regulatory standards
              including PCI DSS, HIPAA, GDPR, SOC 2, and NIST. In addition, independent developer platforms such as API
              Evangelist maintain structured public catalogs scoring Salt's publicly exposed API specifications,
              reflecting active practitioner community engagement.
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE008
              - CE009
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Operational Workflows & Enterprise Use Cases
        blocks:
          - type: paragraph
            body: >-
              Enterprise security operations center (SOC) analysts, application security engineers, and platform teams
              deploy Salt Security to replace fragmented manual tracking workflows with automated real-time visibility.
              Traditional application security approaches typically rely on periodic manual spreadsheet audits,
              developer self-attestations, or static web application firewall configurations, all of which fail to catch
              undocumented API modifications introduced during rapid agile sprints. Salt addresses this operational
              friction by automatically cataloging active API endpoints within minutes of sensor activation, classifying
              exposed parameters, sensitive data payloads, and authentication mechanisms without requiring developers to
              write documentation. In runtime defense scenarios, the platform protects against sophisticated business
              logic abuses—specifically Broken Object Level Authorization (BOLA) and Broken Object Property Level
              Authorization (BOPLA)—which dominate the OWASP API Top 10 vulnerabilities. Rather than triggering separate
              alerts for each suspicious transaction, Salt correlates reconnaissance probes across distributed entities
              and compiles them into a single consolidated incident timeline. Research from Salt Labs also tracks
              frontier attack vectors across autonomous AI agent environments, demonstrating how multi-step agent
              workflows can be hijacked via indirect prompt injection if API tool integrations remain ungoverned.
            claimRefs:
