      - number: '5.3'
        title: Technical Architecture & Operating Model
        blocks:
          - type: paragraph
            body: >-
              Salt Security's operational architecture centers on its patented API Context Engine (ACE), engineered
              specifically to deliver comprehensive security visibility without impacting application performance or
              end-user latency. Unlike traditional inline proxies or web application firewalls that inspect transactions
              synchronously and introduce network latency, Salt deploys out of band by collecting mirrored copies of API
              traffic. Lightweight sensors integrated with API gateways such as Kong, Apigee, and NGINX, alongside cloud
              load balancers and Kubernetes sidecars, capture transaction streams and forward sanitized metadata to
              Salt's cloud-scale API data lake. Inside the cloud engine, machine learning algorithms continuously
              baseline normal user and system behaviors across millions of attributes, differentiating benign
              application updates from malicious low-and-slow reconnaissance campaigns. The platform's architecture also
              incorporates the live Agentic Security Graph, which traces interactions between language models, MCP
              servers, and underlying enterprise APIs. However, because the system operates out of band, it does not
              natively drop malicious packets in the data path; instead, automated attack mitigation depends on pushing
              orchestration directives to existing edge firewalls, API gateways, or security orchestration, automation,
              and response (SOAR) playbooks.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
              - CE012
