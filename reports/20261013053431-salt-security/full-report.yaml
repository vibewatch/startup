      - number: '1.4'
        title: Product Evolution, AI-Agent Shift, and Historical Milestones
        blocks:
          - type: paragraph
            body: >-
              From 2018 through 2024, Salt Security focused predominantly on post-production runtime API discovery,
              posture management, and behavioral threat mitigation. Throughout 2025, the company accelerated product
              cadence under its Twelve Months of Innovation program, launching Ask Pepper AI conversational security
              investigations, GitHub Connect repository visibility, and MCP protections for AWS WAF. In 2026, Salt
              expanded into agentic systems by launching the Salt Agentic Security Platform, introducing Salt Claude
              Connect to govern MCP servers linked to Claude Enterprise environments, and releasing native AI Detection
              and Response (AI-DR) to intercept prompt injection before attackers compromise downstream APIs. Despite
              these advances, independent technical evaluations highlight essential operational trade-offs: Salt relies
              on out-of-band traffic mirroring that avoids latency but requires third-party WAF integration for
              blocking, and its standalone pure-play footprint creates procurement friction against consolidated web
              application security platforms.
