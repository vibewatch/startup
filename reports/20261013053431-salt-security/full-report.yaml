chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Salt Security is a cybersecurity technology enterprise headquartered in Palo Alto, California, operating
              in the specialized domain of application programming interface (API) and agentic artificial intelligence
              security. Founded in 2018 with foundational engineering operations rooted in Israeli cybersecurity
              intelligence traditions, the company developed the patented Salt API Protection Platform to address
              systemic security blind spots created when modern software architectures decomposed monolithic
              applications into distributed, microservice-driven APIs. The platform operates primarily out-of-band via
              cloud-scale traffic mirroring, utilizing machine learning algorithms and big data analytics to
              continuously map attack surfaces, baseline normative API behavior over multi-week observation windows, and
              uncover sophisticated business logic abuse, such as Broken Object Level Authorization (BOLA), without
              introducing inline network latency into enterprise production environments. Operating as a Series D
              venture-backed enterprise, Salt Security balances core runtime discovery and threat prevention across
              REST, GraphQL, and SOAP interfaces while expanding into emerging Model Context Protocol (MCP) and agentic
              workflows.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
