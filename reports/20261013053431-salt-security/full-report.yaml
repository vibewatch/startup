  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The API security market addresses the vulnerability surface created by application programming interfaces
              across discovery, posture management, runtime threat detection, and pre-deployment testing. Modern
              enterprise application estates rely on APIs for over seventy percent of all internet traffic, creating an
              expansive attack surface that traditional perimeter defenses fail to protect. Web Application Firewalls
              (WAFs) and API gateways traditionally served as status-quo controls, but they lack visibility into
              business logic abuse, broken object level authorization (BOLA), and undocumented shadow or zombie
              endpoints. Dedicated API protection platforms isolate this spend by inspecting traffic out-of-band or via
              connectors without introducing latency into production request paths. The category boundary increasingly
              includes agentic AI and Model Context Protocol (MCP) server interactions, where AI agents invoke backend
              tools and APIs autonomously. Status-quo substitutes remain internal script inventories, generic gateway
              logging, and edge WAF rule bundles, none of which provide automated behavioral baselining across
              distributed multi-cloud architectures.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM, SAM, and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable market for API security requires decomposing broader application security
              spend into dedicated API protection opportunities. While the overall Cloud Web Application and API
              Protection (WAAP) market exceeds twelve billion dollars globally, dedicated API security constitutes a
              specialized subset currently estimated between 1.5 billion and 2.0 billion dollars. The serviceable
              addressable market (SAM) concentrates in mid-sized to large enterprises with over one thousand employees
              and extensive API estates across financial services, healthcare, and technology. Within this footprint,
              Salt Security targets organizations running complex microservices and hybrid cloud architectures requiring
              agentless behavioral monitoring. The serviceable obtainable market (SOM) is further constrained by
              enterprise willingness to fund standalone pure-play tooling rather than relying on consolidated suites
              from edge incumbents like Akamai or Cloudflare. Private market sizing benchmarks indicate that standalone
              API security contracts typically range between $36,000 for low-volume deployments and upwards of $210,000
              for high-volume estates, creating a realistic near-term obtainable opportunity of approximately $175
              million for independent pure-play vendors.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM007
              - CM011
      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement of dedicated API security platforms is primarily led by Chief Information Security Officers
              (CISOs), Vice Presidents of Information Security, and heads of Application Security at enterprises
              generating over $500 million in annual revenue. These buyers typically manage dedicated application
              security budgets between $150,000 and $300,000 annually. Buying triggers include post-incident audit
              findings, surging API attack volume, regulatory compliance mandates across PCI DSS, HIPAA, and GDPR, or
              the rollout of generative AI and autonomous agent frameworks. While security leadership controls the
              economic decision and sign-off, day-to-day users comprise security engineers, SOC analysts, and DevSecOps
              platform teams who require low false-positive rates and actionable attacker forensics. Cross-functional
              friction frequently arises between security teams demanding strict posture enforcement and engineering
              platform owners wary of pipeline release friction or complex traffic mirroring setups. AWS Marketplace
              private offers serve as a primary procurement vehicle to streamline annual enterprise purchasing against
              existing cloud commitments.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Drivers, Structural Headwinds, and Market Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The primary growth tailwind for API security adoption is the structural proliferation of API-driven
              architectures, augmented by the expansion of agentic AI workflows where autonomous agents execute actions
              across MCP servers and backend APIs. However, market adoption faces significant headwinds from vendor
              consolidation and procurement friction. The acquisition of major pure-play competitors, such as Noname
              Security by Akamai and Traceable by Harness, has intensified competition from bundled edge platforms
              offering combined WAF, DDoS, and API defenses under single commercial contracts. Furthermore, Salt
              Security's enterprise-only custom pricing model, which lacks public entry-level tiers and routinely scales
              into six-figure annual commitments, creates friction for mid-market buyers. From a diligence perspective,
              critical gaps persist regarding the exact proportion of annual contract value derived from emerging
              agentic modules versus legacy API discovery, as well as the durability of customer retention when edge
              vendors offer native gateway protections.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Consolidation Pressure from Edge and WAF Incumbents
            body: >-
              With Akamai acquiring Noname Security for $450 million and Harness acquiring Traceable, the stand-alone
              pure-play API security market has rapidly consolidated. Pure-play vendors like Salt Security face intense
              competitive pressure from edge incumbents bundling API discovery into existing WAF and CDN contracts,
              forcing buyers to weigh specialized behavioral depth against single-vendor procurement efficiency.
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
          - type: callout
            title: Agentic AI and MCP Expand the Enterprise API Attack Surface
            body: >-
              The enterprise shift toward autonomous AI agents and Model Context Protocol (MCP) architectures transforms
              APIs into execution fabrics for non-human identities. Organizations deploying agentic workflows require
              continuous discovery of MCP servers and runtime guardrails, establishing a high-value expansion vector
              that extends Salt Security's addressable opportunity beyond traditional REST and GraphQL interfaces.
            calloutType: insight
            claimRefs:
              - CM003
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and consolidation
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than direct API-security vendors. Salt competes with Akamai API Security,
              created after Akamai acquired Noname Security for $450 million in June 2024, and with Harness's
              application-security stack after Traceable merged with Harness in March 2025. It also faces adjacent CNAPP
              modules, API gateways, hyperscaler-native controls, traditional WAFs, internal tooling, and the status quo
              of relying on development and security teams to assemble point controls. The retained independent
              comparison describes Salt as the only standalone pure-play of the Salt, Noname/Akamai, and
              Traceable/Harness trio. That independence concentrates product focus, but it also denies Salt the
              installed-base distribution that Akamai, Harness, CNAPP vendors, and cloud providers can use to make
              bundled API coverage the default. Levo is a direct specialist alternative, although its comparison is
              competitor-issued and is evidence of positioning rather than an independent benchmark.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP016
      - number: '3.2'
        title: Buyer criteria, capability trade-offs, and packaging
        blocks:
          - type: paragraph
            body: >-
              Salt's official materials emphasize inventory across internal, external, shadow, and third-party APIs,
              plus real-time behavioral detection for BOLA and abuse. Omdia independently characterizes the offering as
              combining discovery, runtime protection, and shift-left security on a cloud-based big-data service. The
              retained market comparison assigns Salt the strongest BOLA/BOPLA detection, Akamai the advantage in
              discovery and edge enforcement, and Harness the advantage in distributed tracing context and native CI/CD
              integration. These are different control points rather than interchangeable feature checkboxes. Salt's
              sales motion is described as enterprise licensing, commonly per endpoint, but none of the retained
              eligible sources provides a verifiable current price card, discount schedule, or realized contract value.
              Levo's criticisms of traffic-dependent runtime products identify plausible privacy, cost, and
              pre-production concerns, but they remain competitor assertions and should be validated through
              architecture reviews and proof-of-concept telemetry rather than treated as neutral test results.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP015
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Salt is extending differentiation beyond conventional API monitoring. Company-issued evidence says GitHub
              Connect and MCP Finder moved discovery into repositories and CI/CD, while a September 2026 syndicated Salt
              release announced native AI Detection and Response spanning prompts, models, agents, MCP servers, tools,
              and downstream APIs. This broadens Salt's addressable security graph, but public launch scope is not proof
              of paid adoption, efficacy, or durable differentiation. Distribution remains the strategic counterweight:
              Akamai can attach API security to edge protection, Harness can attach it to DevSecOps, and CNAPP or cloud
              vendors can make adequate discovery and posture controls part of an existing platform contract. Salt's
              moat is therefore strongest where sophisticated buyers value behavioral detection depth and cross-layer
              agentic context enough to support a specialist deployment. It is weakest where procurement prioritizes
              consolidation, existing-vendor integration, or basic inventory over best-of-breed detection.
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Bundling can win without feature parity
            body: >-
              Akamai, Harness, CNAPP, and cloud-native alternatives can use existing contracts and control points to
              reduce procurement friction. Salt therefore needs evidence that superior specialist detection creates
              enough incremental value to overcome another deployment and vendor relationship.
            calloutType: risk
            claimRefs:
              - CP010
              - CP015
          - type: callout
            title: Make the proof of concept comparative
            body: >-
              Require Salt and at least one installed-platform alternative to run against the same API inventory,
              identity context, attack replay, false-positive threshold, data-residency constraints, and operating-cost
              model; public marketing does not establish a comparable outcome.
            calloutType: recommendation
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Salt Security monetizes primarily through annual software-as-a-service (SaaS) subscriptions and cloud
              marketplace private offers governed by API volume consumption and estate complexity. Public pricing
              anchors on AWS Marketplace establish an entry-level contract band of $36,000 annually for up to 5 million
              monthly API calls, stepping up to $100,000 annually for up to 100 million monthly calls, accompanied by a
              steep $1 per request overage charge on the higher tier. Procurement benchmarks indicate an average
              contract value (ACV) of approximately $70,000, with comprehensive enterprise deployments scaling up to
              roughly $210,000. During 2026, Salt expanded its addressable packaging with the Salt Agentic Security
              Platform, introducing Agentic Security Posture Management (AG-SPM) and Agentic Detection and Response
              (AG-DR) to monitor LLMs, MCP servers, and API interactions. To capture developer-side adoption without
              immediate procurement friction, Salt launched Salt Code in June 2026 as a policy enforcement engine for AI
              coding assistants, offering it at no additional cost for existing licensees. While this bundling
              accelerates customer expansion, it defers near-term standalone monetization.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
