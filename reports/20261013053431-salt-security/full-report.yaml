              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Salt Security was founded by Chief Executive Officer Roey Eliyahu and Chief Operating Officer Michael
              Nicosia, who identified early that rapid cloud transformation and microservice adoption would transform
              APIs into the primary target for malicious exploitation. Eliyahu brings technical domain leadership and
              software security architecture expertise from elite technological units, while Nicosia drives operational
              delivery, customer success architecture, and corporate scaling. The broader executive management team
              provides seasoned enterprise governance, including Chief Financial Officer Kfir Lippmann overseeing fiscal
              planning and capital allocation, Executive Vice President of Technologies Iko Azoulay directing scalable
              infrastructure, and Vice President of Product Aner Gelman managing platform capabilities across runtime
              detection and API posture governance. Additionally, the company operates Salt Labs, an internal dedicated
              research division that discovers novel API attack vectors and publishes responsible industry vulnerability
              disclosures across emerging cloud and agentic environments.
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization History and Institutional Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Salt Security has secured approximately $281 million in cumulative equity financing across multiple
              institutional rounds since graduating from the Y Combinator accelerator program. The capitalization
              trajectory reached its high-water mark in February 2022 when the company closed a $140 million Series D
              financing round led by Alphabet growth equity fund CapitalG at a post-money valuation of $1.4 billion,
              establishing Salt Security as a unicorn pioneer in dedicated API defense. However, the company has
              operated without an announced institutional equity financing round between February 2022 and late 2026,
              representing a span of over four years. While independent market intelligence models estimated 2024
              revenues near $48.5 million to $75 million, the lack of audited operating disclosures creates valuation
              uncertainty for prospective institutional investors benchmarking against current market multiples.
              Furthermore, while peer pioneers Noname Security and Traceable were acquired or merged, Salt remains an
              independent standalone pure-play.
            claimRefs:
