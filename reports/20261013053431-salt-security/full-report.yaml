  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              Salt's clearest fit is the large enterprise security organization managing API sprawl across hybrid or
              multi-cloud environments. RFP Wiki frames the core buyers as security and platform teams that need
              continuous discovery, posture management, testing, and runtime defense, while Salt's own product page
              emphasizes visibility across internal, external, shadow, and third-party APIs. The only practitioner
