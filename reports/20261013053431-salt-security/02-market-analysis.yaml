callouts:
  - calloutType: "risk"
    title: "Consolidation Pressure from Edge and WAF Incumbents"
    body: "With Akamai acquiring Noname Security for $450 million and Harness acquiring Traceable, the stand-alone pure-play API security market has rapidly consolidated. Pure-play vendors like Salt Security face intense competitive pressure from edge incumbents bundling API discovery into existing WAF and CDN contracts, forcing buyers to weigh specialized behavioral depth against single-vendor procurement efficiency."
    claimRefs:
      - "CM006"
      - "CM012"
  - calloutType: "insight"
    title: "Agentic AI and MCP Expand the Enterprise API Attack Surface"
    body: "The enterprise shift toward autonomous AI agents and Model Context Protocol (MCP) architectures transforms APIs into execution fabrics for non-human identities. Organizations deploying agentic workflows require continuous discovery of MCP servers and runtime guardrails, establishing a high-value expansion vector that extends Salt Security's addressable opportunity beyond traditional REST and GraphQL interfaces."
    claimRefs:
      - "CM003"
      - "CM011"
