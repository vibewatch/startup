  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心模块组合
        blocks:
          - type: paragraph
            body: >-
              Salt Security 提供企业级 API Protection Platform，覆盖 API 全生命周期，包括持续发现、态势治理和运行时威胁检测。现代软件工程团队采用微服务架构和持续部署后，未记录的
              API 蔓延造成严重企业漏洞盲区。平台持续盘点本地、云端和混合环境中的 REST、GraphQL 和 SOAP 接口，发现休眠僵尸端点和未编目的影子服务。除传统 Web API 外，Salt 还通过 Salt
              Agentic Security Platform 将核心平台拓展到新兴自主系统。该扩展引入 Agentic Security Posture Management（AG-SPM）和 AI Detection
              and Response（AI-DR），绘制 Model Context Protocol（MCP）服务器、大语言模型集成和代理工具执行路径。Salt Policy Hub 通过约 100
              条预加载合规规则补充运行时监控，把端点配置和敏感数据流映射到 PCI DSS、HIPAA、GDPR、SOC 2 和 NIST 等监管标准。此外，API Evangelist 等独立开发者平台维护结构化公开目录，为
              Salt 公开暴露的 API 规范评分，体现活跃的从业者社区参与。
