        title: 技术差异化、依赖与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从技术和竞争角度看，Salt Security 是目前主要的独立纯平台 API 安全厂商；Noname Security 和 Traceable 等历史直接同行已被整合进 Akamai、Harness
              等更广平台。这种架构聚焦让 Salt 工程团队能专门优化 BOLA、BOPLA 等复杂授权异常的行为机器学习算法，不必为无关的 Web
              应用防御功能牺牲路线图优先级。但专业化也带来尽调团队必须评估的技术和运营依赖。第一，Salt 的行为基线模型通常需要约 30
              天代表性生产流量，检测阈值才会成熟，新部署微服务因此暴露在初始基线滞后风险下。第二，由于执行依赖第三方拦截集成，运营效果高度取决于企业网关连接器和 SIEM
              管线的可靠性与响应速度。最后，企业买方需要维护单独合同，而非把 API 控制整合进 Imperva 等更广的 WAAP 套件，由此增加厂商管理开销，必须验证检测深度是否值得单独运营平台。
            claimRefs:
              - CE006
