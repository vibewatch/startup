chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Salt Security 是一家总部位于美国加州 Palo Alto 的网络安全技术企业，专注于应用程序接口（API）和代理式人工智能安全。公司成立于 2018
              年，工程基础植根于以色列网络安全情报传统，随后开发出专利 Salt API Protection Platform，解决现代软件架构从单体应用拆分为分布式微服务 API
              后形成的系统性安全盲区。平台主要通过云规模流量镜像在带外运行，利用机器学习算法和大数据分析持续绘制攻击面，并在数周观察窗口内建立正常 API 行为基线，识别 Broken Object Level
              Authorization（BOLA）等复杂业务逻辑滥用，同时不向企业生产环境的网络路径引入内联延迟。作为一家 D 轮、风险资本支持的企业，Salt Security 在 REST、GraphQL 和 SOAP
              接口上兼顾运行时发现与威胁防御，并继续拓展至新兴的 Model Context Protocol（MCP）和代理式工作流。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 创始人、高管领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Salt Security 由 CEO Roey Eliyahu 和 COO Michael Nicosia 创立；两人很早就判断，快速云转型和微服务普及会让 API 成为恶意利用的首要目标。Eliyahu
              带来技术领域领导力及精英技术部队积累的软件安全架构经验，Nicosia 则负责运营交付、客户成功架构和公司规模化。更广泛的管理团队提供成熟的企业治理：CFO Kfir Lippmann
              负责财务规划和资本配置，技术执行副总裁 Iko Azoulay 负责可规模化基础设施，产品副总裁 Aner Gelman 管理运行时检测和 API 态势治理能力。此外，公司运营内部专门研究部门 Salt
              Labs，发现新型 API 攻击向量，并在新兴云和代理式环境中发布负责任的行业漏洞披露。
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 资本化历史与机构利益相关者图谱
        blocks:
          - type: paragraph
            body: >-
              自从 Y Combinator 加速器毕业后，Salt Security 通过多轮机构融资累计筹得约 $281M。资本化轨迹在 2022 年 2 月达到高点：公司完成由 Alphabet 成长股权基金
              CapitalG 领投的 $140M D 轮融资，投后估值 $1.4B，使其成为专注 API 防御的独角兽先行者。但从 2022 年 2 月到 2026
              年末，公司一直没有宣布新的机构股权融资，间隔超过四年。独立市场情报模型估计 2024 年收入约为 $48.5M 至
              $75M，但缺少经审计的经营披露，使潜在机构投资者按当前市场倍数估值时面临不确定性。此外，同行先行者 Noname Security 和 Traceable 已被收购或合并，Salt 仍是独立的纯平台公司。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO010
      - number: '1.4'
        title: 产品演进、AI 代理转向与历史里程碑
        blocks:
          - type: paragraph
            body: >-
              2018 至 2024 年，Salt Security 主要聚焦生产环境后的运行时 API 发现、态势管理和行为威胁缓解。2025 年，公司在 Twelve Months of Innovation
              计划下加快产品节奏，推出 Ask Pepper AI 对话式安全调查、GitHub Connect 代码库可见性，以及面向 AWS WAF 的 MCP 防护。2026 年，Salt 进入代理式系统领域，推出
              Salt Agentic Security Platform，引入 Salt Claude Connect 以治理连接 Claude Enterprise 环境的 MCP 服务器，并发布原生 AI
              Detection and Response（AI-DR），在攻击者危及下游 API 前拦截提示词注入。尽管产品有所进展，独立技术评估仍指出关键取舍：Salt 依赖避免延迟的带外流量镜像，但必须集成第三方 WAF
              才能拦截；其独立纯平台定位也使其在面对整合式 Web 应用安全平台时承受采购阻力。
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO011
              - CO012
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 先锋品类聚焦与平台整合浪潮
            body: >-
              主要竞争者 Noname Security（被 Akamai 以 $450M 收购）和 Traceable（与 Harness 合并）已融入更广泛的应用交付及 DevSecOps 套件，Salt Security
              仍是 API 安全领域突出的独立纯平台。这种独立性强化了其在行为检测和新兴 MCP/代理安全上的技术专长，但也让企业采购面对整合式安全套件时更难推进。
            calloutType: insight
            claimRefs:
              - CO010
              - CO013
          - type: callout
            title: 资本化年份与估值可辩护性缺口
            body: >-
              Salt Security 自 2022 年 2 月 D 轮（估值 $1.4B）以来没有宣布机构股权融资。第三方估计 2024 年收入约为 $48.5M 至
              $75M，但缺乏经审计的经营披露、已确认客户量或近期定价标记，令潜在投资者按已压缩的公开 SaaS 倍数估值时面临估值悬压。
            calloutType: risk
            claimRefs:
              - CO002
              - CO004
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              API 安全市场应对应用程序接口在发现、态势管理、运行时威胁检测和上线前测试环节形成的漏洞面。现代企业应用资产中超过七成互联网流量依赖 API，形成传统边界防御无法覆盖的庞大攻击面。Web Application
              Firewall（WAF）和 API 网关过去是现状控制手段，但无法看见业务逻辑滥用、Broken Object Level Authorization（BOLA）及未记录的影子或僵尸端点。专用 API
              防护平台通过带外检查流量或连接器隔离这项支出，不向生产请求路径引入延迟。随着 AI 代理调用后端工具和 API，品类边界正越来越包含代理式 AI 和 Model Context
              Protocol（MCP）服务器交互。现状替代方案仍包括内部脚本清单、通用网关日志和边缘 WAF 规则包，但都无法在分布式多云架构中自动建立行为基线。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: TAM、SAM 与受限测算视角
        blocks:
          - type: paragraph
            body: >-
              评估 API 安全的总可服务市场，需要把更广义的应用安全支出拆分为专用 API 防护机会。私募市场规模基准显示，独立纯平台厂商近期可获得的现实机会约为 $175M；高流量资产的独立 API 安全合同可达
              $210,000，低流量部署通常从 $36,000 起。全球 Cloud Web Application and API Protection（WAAP）市场已超过百亿美元，专用 API 安全目前估计为 1.5B
              美元至 2.0B 美元。可服务市场（SAM）集中在员工超过 1,000 人、在金融服务、医疗和科技领域拥有大量 API 资产的中大型企业。Salt Security
              在这一范围内瞄准运行复杂微服务和混合云架构、需要无代理行为监控的组织。可服务可获得市场（SOM）还受企业是否愿意购买独立纯平台工具限制，而非依赖 Akamai 或 Cloudflare 等边缘厂商的整合套件。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM007
              - CM011
      - number: '2.3'
        title: 买方画像、采购动态与预算归属
        blocks:
          - type: paragraph
            body: >-
              专用 API 安全平台主要由年收入超过 $500M 企业的首席信息安全官（CISO）、信息安全副总裁和应用安全负责人推动采购。这些买方通常管理每年 $150,000 至 $300,000
              的专用应用安全预算。触发采购的因素包括事故后的审计发现、API 攻击量激增、PCI DSS、HIPAA 和 GDPR 等合规要求，或生成式 AI
              与自主代理框架上线。安全负责人掌握经济决策和签字，但日常用户包括安全工程师、SOC 分析师和 DevSecOps
              平台团队，他们需要低误报率及可执行的攻击者取证。安全团队要求严格执行态势控制，工程平台负责人则担心流水线发布受阻或流量镜像复杂，双方经常产生跨职能摩擦。AWS Marketplace
              私下报价是简化年度企业采购、对接既有云承诺的主要渠道。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 采用驱动、结构性阻力与市场尽调缺口
        blocks:
          - type: paragraph
            body: >-
              API 驱动架构的结构性扩张，是 API 安全采用的主要增长顺风；代理式 AI 工作流扩张也在推波助澜，因为自主代理会跨 MCP 服务器和后端 API 执行动作。但厂商整合和采购摩擦构成明显阻力。Akamai
              收购 Noname Security、Harness 收购 Traceable 后，边缘平台把 WAF、DDoS 和 API 防御打包在单一商业合同中，竞争进一步加剧。Salt Security
              只面向企业、采用定制定价，既没有公开入门档位，年度承诺也常常达到六位数，这会阻碍中端买方。从尽调角度看，年度合同价值中来自新兴代理模块而非传统 API
              发现的确切比例仍是缺口；当边缘厂商提供原生网关防护时，客户留存能否持续也未获证明。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 边缘与 WAF 既有厂商带来的整合压力
            body: >-
              Akamai 以 $450M 收购 Noname Security、Harness 收购 Traceable 后，独立纯平台 API 安全市场迅速整合。Salt Security
              等纯平台厂商正承受边缘既有厂商的激烈竞争：后者把 API 发现打包进现有 WAF 和 CDN 合同，迫使买方在专业行为深度与单一厂商采购效率之间权衡。
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
          - type: callout
            title: 代理式 AI 与 MCP 扩大企业 API 攻击面
            body: >-
              企业转向自主 AI 代理和 Model Context Protocol（MCP）架构后，API 变成非人类身份的执行基础设施。部署代理式工作流的组织需要持续发现 MCP 服务器并设置运行时护栏，这为 Salt
              Security 创造了高价值扩张方向，把可获得机会延伸到传统 REST 和 GraphQL 接口之外。
            calloutType: insight
            claimRefs:
              - CM003
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与整合
        blocks:
          - type: paragraph
            body: >-
              竞争范围不止直接 API 安全厂商。Salt 与 Akamai API Security 竞争，后者是在 Akamai 于 2024 年 6 月以 $450M 收购 Noname Security
              后形成；Salt 也与 Traceable 于 2025 年 3 月并入 Harness 后的应用安全栈竞争。此外，Salt 还面对相邻的 CNAPP 模块、API 网关、云超大规模厂商原生控制、传统
              WAF、内部工具，以及由开发和安全团队自行拼装点状控制的现状。保留的独立比较称，在 Salt、Noname/Akamai 和 Traceable/Harness 三者中，Salt
              是唯一独立纯平台。这种独立性让产品更聚焦，但也失去了 Akamai、Harness、CNAPP 厂商和云服务商借助既有客户基础把捆绑 API 覆盖变成默认选项的分发能力。Levo
              是直接的专业替代者，但其比较由竞争者提供，反映的是定位而非独立基准。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP016
      - number: '3.2'
        title: 买方标准、能力取舍与产品打包
        blocks:
          - type: paragraph
            body: >-
              Salt 官方材料强调覆盖内部、外部、影子和第三方 API 的清单，以及针对 BOLA 和滥用的实时行为检测。Omdia
              独立描述该产品将发现、运行时防护和左移安全结合在云端大数据服务中。保留的市场比较认为，Salt 在 BOLA/BOPLA 检测上最强，Akamai 在发现和边缘执行上占优，Harness 在分布式追踪上下文及原生
              CI/CD 集成上占优。这些是不同的控制点，并非可以互换的功能勾选项。Salt 的销售模式被描述为企业授权，通常按端点计价，但保留的合格来源没有提供可验证的当前价目表、折扣安排或实际合同价值。Levo
              对依赖流量的运行时产品提出的隐私、成本和生产前风险批评具有合理性，但仍是竞争者论断，应由架构评审和概念验证遥测加以验证，不能视作中立测试结果。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP015
      - number: '3.3'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Salt 正把差异化延伸到传统 API 监控之外。公司发布的证据称，GitHub Connect 和 MCP Finder 已把发现延伸到代码库和 CI/CD；2026 年 9 月，联合发布的 Salt
              新闻宣布原生 AI Detection and Response 覆盖提示词、模型、代理、MCP 服务器、工具和下游 API。这扩大了 Salt
              的安全图谱，但公开发布范围不能证明付费采用、效果或持久差异化。分发仍是战略制衡：Akamai 可把 API 安全附加到边缘防护，Harness 可附加到 DevSecOps，CNAPP
              或云厂商则可把够用的发现和态势控制纳入既有平台合同。因此，Salt
              的壁垒最强之处在于专业买方足够看重行为检测深度和跨层代理上下文，愿意支持专业部署；当采购优先考虑整合、既有厂商集成或基础清单而非最佳检测时，壁垒最弱。
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP015
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 没有功能完全对等，打包也能胜出
            body: Akamai、Harness、CNAPP 和云原生替代方案可以利用既有合同和控制点降低采购摩擦。因此，Salt 需要证明专业检测的优势能带来足够增量价值，抵消新增部署和厂商关系。
            calloutType: risk
            claimRefs:
              - CP010
              - CP015
          - type: callout
