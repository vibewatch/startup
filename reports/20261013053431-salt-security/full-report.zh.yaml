              Salt Security 最近一次披露的 $1.4B 估值对应估计 $75M 收入，意味着超过 18 倍收入倍数。在缺少盈利能力或超高速增长指标（同比
              >80%）的情况下，相比公开网络安全可比公司，这一倍数带来显著的下轮融资或倍数压缩风险。
