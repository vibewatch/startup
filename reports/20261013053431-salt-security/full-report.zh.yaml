  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              Salt Security 服务于银行、金融科技、医疗和全球零售等高度监管的企业垂直行业，因此面临严格的监管合规和法律责任标准。公司的 Policy Hub 和 API Posture Governance
              引擎可对 PCI DSS v4.0、PSD2、HIPAA、GDPR、CCPA、LGPD 和 FFIEC 指引等主要法定制度自动进行合规映射。Policy Hub 包含约 100
              条预配置态势规则和可定制模板，用于在审计前发现敏感数据泄露、授权不当和配置漂移。但代理式 AI 框架快速出现，尤其是欧盟 AI 法案分阶段执行，使自主软件与企业记录交互时面临更高法律风险。欧盟 AI
              法案下的高风险 AI 实施要求可验证的人类监督、详细技术文档以及跨执行层持续风险管理。Salt Security 虽能跨 API 和 Model Context Protocol
              服务器提供态势治理及运行时监控，但若无法满足不断变化的欧盟 AI 法案标准或跨境数据传输要求，可能使企业客户遭受严重行政处罚，增加采购摩擦并放慢跨国客户合同扩张。
            claimRefs:
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR010
              - CR011
      - number: '7.2'
        title: 运营威胁与代理执行风险
        blocks:
          - type: paragraph
            body: >-
              自主 AI 代理和 Model Context Protocol（MCP）服务器扩散后，企业软件运营威胁面发生深刻变化。Salt Security 对 300 多名企业安全负责人的实证研究显示，92%
              的组织缺乏防御复杂代理式环境所需的高级安全成熟度。另有数据表明，47% 的受访组织因未解决 API 安全问题推迟生产软件发布，32% 在此前 12 个月经历过 API 安全事件。Salt Labs
              威胁情报的关键发现是，现代 API 攻击尝试中 99% 来自已认证来源，常涉及被攻陷的服务凭证或缺乏人工监督、速率限制和行为护栏的恶意自主代理。此外，65% 的记录攻击利用 OWASP API8
              标准下的安全配置错误；当权限过大的 API 连接到能以机器速度查询、串联并外泄数据的自主 LLM 时，这种失效会被大幅放大。提示词注入已成为 OWASP Top 10 for LLM Applications
              2026 的首要漏洞，Salt Security 的 Agentic Security Graph 必须持续绘制 LLM、MCP 服务器和下游 API 的关系，防止未授权工具执行和敏感数据外泄。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 合作伙伴基础设施与采购依赖
        blocks:
          - type: paragraph
            body: >-
              Salt Security 的部署架构和商业市场拓展模式，对主要云超大规模厂商、Web 应用防火墙提供商和企业安全平台形成重大依赖。其 SaaS 层高度依赖 Amazon Web
              Services（AWS）基础设施进行大规模数据湖处理和行为基线建模，并辅以悉尼等本地托管部署。Salt 也高度依赖边缘执行合作伙伴，使用 AWS WAF 的 Salt Managed Rules 及与
              Cloudflare、Akamai 的原生集成，在检测到恶意行为异常时执行内联拦截。这些集成渠道中断或合作伙伴改变 API 访问政策，都会削弱实时执行能力。在商业端，Salt 以 AWS Marketplace
              私下报价为主要采购渠道，合同将软件费用锚定到月度 API 调用配额，例如每年 $36,000 对应最多 500 万次调用、$100,000 对应 1 亿次调用，高档位另收每次请求 $1
              的超额费用。需要被动网络镜像、客户管理采集器或复杂网关连接器的混合企业部署，总拥有成本会显著超过基础授权费。此外，Salt Labs 对外部代理平台漏洞（如 Manus AI
              平台账户劫持缺陷）的研究，也凸显第三方代理式软件集成固有的运营风险。
            claimRefs:
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 风险排序与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              Salt Security 面临的战略和财务风险集中在竞争整合、资本结构纪律和执行连续性。Akamai 于 2024 年 6 月以 $450M 收购 Noname Security、Harness 于 2025
              年 3 月与 Traceable 合并后，Salt Security 仍是该品类早期先行者中唯一的独立纯平台 API 安全厂商。独立地位保留了厂商中立性和专门工程能力，却让 Salt 暴露在 Akamai
              等更广云安全套件及 Harness 等整合式 DevSecOps 平台的激进捆绑和定价压力下。独立市场情报将 Salt Security 的可防御性评为 13 至
              14，认为其专有行为基线壁垒在竞争压力下受到挑战。此外，Salt 在 2026 年快速转向代理式 AI 安全和 MCP 监控，造成执行缺口：第三方背书和客户参考主要验证的仍是传统 API
              防护能力。核心投资论点破坏触发器包括：（1）捆绑竞争者定价导致毛利率压缩或客户流失加速；（2）高知名度客户因未缓解的提示词注入或已认证恶意代理而遭遇入侵；（3）无法与核心企业客户锁定多年合同续约；（4）以色列工程设施的核心研发速度因运营中断而受损，且没有已证明的地域冗余。
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
