      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 代理式安全缺口与发布摩擦
            body: >-
              企业采用自主 AI 代理的速度正在加快，而安全项目落后，92% 的组织缺乏高级成熟度。47% 的企业因 API 安全担忧推迟生产发布，99% 的攻击来自已认证来源，Salt
              因此承受着提供机器速度自动拦截、又不引入误报干扰的紧迫执行压力。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 独立韧性与竞争者捆绑
            body: >-
              随着同赛道的 Noname Security 被 Akamai 收购、Traceable 并入 Harness，Salt Security 成为唯一独立的 API
              专业厂商。投资者应密切观察：基础设施套件整合会否压低 Salt 的企业定价，还是其专利行为基线引擎能够持续 形成稳固的客户锁定。
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与战略定位
        blocks:
          - type: paragraph
            body: >-
              Salt Security 是专用 API 防护与运行时行为检测领域的技术标杆。公司 2018 年成立，根基位于以色列和硅谷， 率先用机器学习分析镜像 API 流量，识别 Broken Object Level
              Authorization（BOLA）等业务逻辑漏洞。现代 企业架构转向解耦微服务、云网关和自主代理工作流后，传统 Web Application Firewall（WAF）难以发现低速、
              长周期的侦察攻击。Salt 抓住这一转型，累计募集超过 $281 million 风投资金，其中包括 CapitalG 主导、于 2022 年 2 月完成、将公司估值推至 $1.4 billion 的标志性
              $140 million Series D。2026 年，公司把护城河 延伸至代理式 AI 安全，推出原生 AI Detection and Response（AI-DR），追踪 Large Language
              Models、 Model Context Protocol（MCP）服务器与后端 REST APIs 之间的交互。随着 Noname Security 被 Akamai 收购、 Traceable 并入
              Harness，Salt 成为唯一能服务多云企业的独立赛道专业厂商，在不受边缘厂商锁定的情况下提供 专门防护。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV010
              - CV011
      - number: '8.2'
        title: 推荐框架与估值判断
        blocks:
          - type: paragraph
            body: >-
              我们的正式尽调结论是需继续研究，置信度中等、风险评级高。产品效果和企业品牌认知仍然强劲，但公司当前 估值已显著偏高。Salt 标志性的 $1.4 billion 估值追溯至 2022
              年初风险投资倍数的高点。独立市场情报估计 公司年收入约 $75 million；第三方模型则在 $46.5 million 至 $75 million 之间大幅分歧，且没有审计确认。 将历史 $1.4
              billion 估值套用于这些收入估计，隐含 ARR 倍数为 18.7x 至 30.1x，明显高于公开市场网络安全 软件倍数和私募并购交易。更关键的是，Akamai 于 2024 年 6 月以 $450
              million 收购直接竞争对手 Noname Security，形成不利的定价基准，直接挑战 Salt 的私人估值论点。因此，在管理层提供经审计财务数据、GAAP
              收入增长率、客户留存队列，以及明确的以色列工程团队连续性保障前，主要资本配置者应暂不形成买入信念。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV011
      - number: '8.3'
        title: 正反论点的结构性博弈
        blocks:
          - type: paragraph
            body: >-
              评估 Salt Security，必须在强劲的结构性顺风与尖锐的厂商整合压力之间权衡。正方论点建立在 Salt 的技术深度
              上：其专利大数据分析和无代理带外架构，让安全团队能够在应用零延迟的情况下，部署覆盖完整生命周期的 API 姿态治理和运行时检测。此外，Salt 激进拓展代理式安全，有望承接企业为治理自主 AI 代理和 MCP
              工具而新增 的预算。反方则强调一体化边缘平台在采购中的吸引力。企业 CISO 越来越倾向把工具整合进 Akamai、Cloudflare 及 Thales 支持的 Imperva 等边缘巨头提供的统一 Cloud
              Web Application and API Protection（WAAP）套件。 独立 API 安全定价造成明显预算摩擦：AWS Marketplace 私有报价从每月 5 million 次调用的
              $36,000，到 100 million 次调用的 $100,000，平均 ACV 接近 $70,000。当平台既有厂商以边际增量成本提供捆绑式 API 检测时， 独立专业厂商会面临销售周期拉长和获客逆风。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.4'
        title: 估值情景、可比交易与退出期限
        blocks:
          - type: paragraph
            body: >-
              为量化风险调整后的回报，我们在 24 个月投资期限内分析三种经营情景。乐观情景（概率 25%）下，企业加速采用 生成式 AI 代理和复杂 MCP 网络，推动高毛利 ARR 在 2027 年增至 $120
              million。沿着这条路径，Salt 重建 超高速增长的可信度，以 $1.8 billion 至 $2.2 billion（15x 至 18x ARR）实现 IPO 或一线网络安全整合退出。 基准情景（概率
              55%）下，Salt 在专业企业 API 防护领域保持稳定但放缓的扩张，模型 ARR 增至 $90 million 至 $100 million。按 10x 至 11x 的正常化市场倍数，企业价值为 $900
              million 至 $1.1 billion，相较 2022 年 Series D 定价仅温和收缩，并需要结构化资本重组。悲观情景（概率 20%）下，企业采购向 Akamai 和 Imperva
              整合，限制独立厂商的市场扩张，将收入压在 $75 million 以下。Salt 被迫进行类似 Noname Security 的防御性 战略出售，实现 $450 million 至 $600
              million（6x 至 8x ARR），并给早期投资者和普通股股东带来严重的清算优先权负担。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 核心判断：估值过高，需继续研究
            body: >-
              Salt Security 虽在 API 和代理式安全领域保持技术领先，但相较估计收入规模和近期赛道并购可比（例如 Akamai 以 $450M 收购 Noname），2022 年 $1.4B
              估值明显偏高。投资者应要求经核实的财务披露，再参与任何二级流动性 或股权融资。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
          - type: callout
            title: 倍数压缩与清算优先权负担
            body: 累计融资超过 $281M，且四年多未披露新的一级股权融资；在现实的基准收购或资本重组情景下，后期轮次的清算优先权可能严重压缩普通股回报。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV014
