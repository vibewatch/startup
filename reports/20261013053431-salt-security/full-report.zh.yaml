        - label: 已认证恶意智能体利用
          values:
            - null
            - null
            - label: 关键影响（OWASP API8 配置错误与数据外泄）
        - label: 竞争性平台捆绑
          values:
            - null
            - label: 高影响（Akamai 与 Harness 定价压力）
            - null
        - label: 提示注入与模型操纵
          values:
            - null
            - null
            - label: 高影响（通过 MCP 服务器进行间接注入）
        - label: 生产部署摩擦
          values:
            - null
            - null
            - label: 中等影响（47% 企业发布延迟）
        - label: 云市场合同总拥有成本上升
          values:
            - null
            - label: 中等影响（AWS Marketplace 流量超额费用）
            - null
    approximationNotes: 可能性和影响定位综合 Salt Labs 实证威胁研究、企业调研回复和截至 2026 年的独立市场评估。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR013
  - id: FV001
    title: 投资建议决策逻辑流程
    type: flow
    summary: 依次连接品类地位、运营验证、估值悬置和最终继续研究立场的分析关卡。
    data:
      nodes:
        - id: N1
          label: 品类领导地位
          description: Salt Security 凭借专利 ML 和无代理发现能力，率先进入 API 行为安全
        - id: N2
          label: 智能体 AI 扩张
          description: 2026 年平台发布原生 AI-DR 和 MCP 服务器运行时可见性
        - id: N3
          label: 市场整合
          description: 主要同行已被收购（Akamai 以 $450M 收购 Noname，Harness 收购 Traceable），Salt 成为唯一专注型厂商
        - id: N4
          label: 信息不透明
          description: 自 2022 年 2 月以来没有主要融资；第三方 ARR 估算在 $46.5M 和 $75M 之间冲突
        - id: N5
          label: 估值悬置
          description: 2022 年 D 轮定价（$1.4B）相对 $450M 并购可比案例面临严重倍数压缩
        - id: N6
          label: 尽调建议
          description: 估值立场偏高，建议继续研究；在提供经审计财务数据前暂缓主要资本投入
      edges:
        - from: N1
          to: N2
          label: 促成
        - from: N2
          to: N3
          label: 驱动差异化
        - from: N3
          to: N4
          label: 与之形成对比
        - from: N4
          to: N5
          label: 造成
        - from: N5
          to: N6
          label: 决定
    approximationNotes: 流程展示导向继续研究立场的逻辑决策层级。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
