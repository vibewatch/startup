  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业定价架构
        blocks:
          - type: paragraph
            body: >-
              Salt Security 主要通过年度软件即服务（SaaS）订阅和云市场私下报价变现，定价受 API 流量和资产复杂度影响。AWS Marketplace 的公开价格锚点显示，最多 500 万次月度 API
              调用的入门合同档位为每年 $36,000，最多 1 亿次月度调用为每年 $100,000；更高档位还按每次请求收取高达 $1 的超额费用。采购基准显示平均合同价值（ACV）约
              $70,000，完整企业部署可扩大到约 $210,000。2026 年，Salt 通过推出 Salt Agentic Security Platform 扩大产品包装范围，引入 Agentic Security
              Posture Management（AG-SPM）和 Agentic Detection and Response（AG-DR），监测 LLM、MCP 服务器和 API
              交互。为在不立即增加采购摩擦的情况下获取开发者采用，公司于 2026 年 6 月推出 Salt Code，作为 AI
              编程助手的策略执行引擎，并向现有授权客户免费提供。虽然捆绑能加速客户扩张，却推迟了近期独立变现。
            claimRefs:
