      - number: '4.3'
        title: 规模牵引、竞争取舍与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              公开竞争情报和分析师报告估计 Salt Security 的年度经常性收入约为 $75M，使其成为 API 防护领域成熟的专用纯平台厂商。Gartner Peer Insights 和 TrustRadius
              的客户评价肯定其无代理 API 发现和自动创建影子 API 清单。但评价也记录了企业实施摩擦，尤其是涉及 Okta 和 DPoP 协议的复杂身份集成需要专门专业服务。从架构上看，Salt 的带外定位相对于整合式
              Cloud Web Application and API Protection（WAAP）套件存在商业取舍。Imperva（由 Thales 支持）等竞争者把原生 WAF、DDoS
              缓解和机器人防护打包进单一内联平台，而 Salt 需要集成第三方网络设备才能实现自动缓解。这一差异让 Salt 暴露在厂商整合压力和潜在价格让步下，尤其是在重视统一边缘工具的客户中。
            claimRefs:
              - CI008
              - CI009
              - CI011
      - number: '4.4'
        title: 资本充足性与财务投资判断
        blocks:
          - type: paragraph
            body: >-
              从资本充足性看，Salt Security 累计获得 $281M 风险融资，并在 D 轮达到 $1.4B 估值。但公司没有公开披露 2022 年后的现金储备、月度烧钱或运营 runway。在投资判断中，Salt
              的收入质量结构上较高，靠经常性企业合同和不断增长的 API 调用量支撑，但财务画像承受显著估值张力。估计 $75M 收入对应 $1.4B 私募估值，意味着超过 18 倍 ARR
              入场倍数。没有经审计的净留存、毛利率和经核实的现金 runway，机构投资者无法确认 Salt 是接近现金流盈亏平衡，还是仍依赖外部资本市场。因此，在确认投资信心前，取得经审计财务明细、留存 cohort 和
              COGS 核算仍是必需的尽调前提。
            claimRefs:
