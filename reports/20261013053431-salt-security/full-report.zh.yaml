    approximationNotes: 里程碑日期来自公司申报文件、Y Combinator 记录、新闻公告和行业跟踪数据库。
    claimRefs:
      - CO011
      - CO012
    data:
      items:
        - label: 公司创立与成立
          detail: Roey Eliyahu 和 Michael Nicosia 创立 Salt Security，应对不断扩大的应用 API 漏洞暴露面
          tone: positive
        - label: Y Combinator 加速
          detail: Salt Security 参加 Y Combinator，建立其专利 API Protection Platform
          tone: neutral
        - label: D 轮独角兽融资
          detail: CapitalG 领投 $140M D 轮，估值 $1.4B；累计融资达到 $281M
          tone: positive
        - label: Deloitte Fast 500 认可
          detail: 企业收入快速增长后，入选 Deloitte Technology Fast 500
          tone: positive
        - label: 12 个月创新活动
          detail: 2025 年每月发布平台进展，包括 Ask Pepper AI 和 GitHub Connect
          tone: neutral
        - label: Agentic Security Platform 发布
          detail: 推出 Agentic Security Platform，管理 AI 智能体在 LLM、MCP 服务器和 API 之间的交互
          tone: positive
        - label: Claude Enterprise MCP 可见性
          detail: 发布 Salt Claude Connect，持续看见连接到 Claude Enterprise 的 MCP 服务器
          tone: neutral
        - label: 原生 AI-DR 运行时防护
          detail: 以原生 AI Detection and Response 扩展平台，把提示注入连接到下游 API 攻击
          tone: positive
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从云应用安全总支出逐层收窄至 Salt Security 可服务企业 API 安全机会的分层规模视角。
    data:
      items:
        - label: Web 应用与 API 防护总市场（WAAP）
          value: 12000
          unit: USD M
          detail: 企业在边界 WAF、DDoS 缓解和边缘 API 防御上的广泛支出
        - label: 专用 API 防护市场
          value: 1800
          unit: USD M
          detail: API 发现、姿态治理和运行时行为安全上的专业化支出
        - label: 可服务可寻址市场（SAM）- 北美与 EMEA
          value: 650
          unit: USD M
          detail: 受监管行业中拥有 1,000+ 名员工和 50+ 个活跃 API 的企业
        - label: 可服务可获得市场（SOM）- 专注行为安全
          value: 175
          unit: USD M
          detail: 优先采用无代理运行时行为检测，而非捆绑式边缘 WAF 的组织
        - label: 目标管道机会
          value: 75
          unit: USD M
          detail: 当前报告的运营规模基准和活跃企业续约基础
        - label: 智能体 AI 与 MCP 增值市场
          value: 40
          unit: USD M
          detail: 面向企业 LLM 端点和 MCP 服务器监控的新兴扩张机会
    approximationNotes: 图表综合 Gartner 行业研究估算、Akamai/Noname 交易数据和 AWS Marketplace 采购基准；专注型 SOM 反映定制定价约束。
    claimRefs:
      - CM004
      - CM007
      - CM011
  - id: FP001
    title: 定位视角：API 专业化与分销杠杆
    type: quadrant
    summary: 序数定位显示，Salt 的专业化聚焦受到更广泛平台厂商既有客户基础杠杆的抵消。
    data:
      xAxis:
        label: API 安全专业化程度（1 低，5 高）
      yAxis:
        label: 平台分销杠杆（1 低，5 高）
      points:
        - label: Salt Security
          x: 5
          'y': 2
          note: 独立专注型厂商，聚焦行为安全和智能体安全
        - label: Akamai API Security
          x: 4
          'y': 5
          note: 专用能力通过 Akamai 边缘平台分发
        - label: Harness / Traceable
          x: 4
          'y': 4
          note: 专用追踪能力通过 Harness DevSecOps 分发
        - label: CNAPP 模块
          x: 2
          'y': 5
          note: 云安全分发范围更广，但报告显示专业深度较弱
        - label: 网关 / 超大规模云厂商控制
          x: 1
          'y': 5
          note: 无处不在的基础控制，而非完整的专业覆盖
        - label: Levo.ai
          x: 5
          'y': 1
          note: 专业化挑战者；留存证据尚未证明其分发规模
    approximationNotes: 分析师构建的序数评分，不是实测市场份额或产品测试结果；定位综合留存证据中的专业化、所有权和分发路径。
    claimRefs:
      - CP004
      - CP015
      - CP016
  - id: FI001
    title: 收入模型与单位经济转换桥
    type: flow
    summary: 通过连续桥接展示客户 API 流量和智能体部署如何转化为订阅收入与毛利率。
    approximationNotes: 展示从客户基础设施到软件利润率的结构性运营转换模型；中间计算成本按典型云托管流量分析工作负载估算。
    claimRefs:
      - CI007
      - CI010
      - CI012
    data:
      nodes:
        - id: node-1
          label: 企业 API 与智能体部署
          detail: 客户在各云环境扩展 REST、GraphQL 和 MCP 端点
        - id: node-2
          label: 无代理流量镜像摄取
          detail: 带外采集将元数据发送到 Salt 云端，不引入内联延迟
        - id: node-3
          label: 订阅许可锚点
          detail: 年度平台合同覆盖 $36k 基础档至 $210k 企业档
        - id: node-4
          label: 流量与能力分层
          detail: 月度调用量阈值（5M-100M+）推动合同升级并产生超额费用
        - id: node-5
          label: 云托管与推理销货成本
          detail: AWS 托管、数据留存以及 ML/LLM 行为分析计算成本
        - id: node-6
          label: 实现的毛贡献
          detail: 扣除云基础设施和数据处理成本后的底层软件毛利
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈展示流量采集、元数据提取、大数据摄取、行为 AI Context Engine 关联、姿态治理和生态编排。
    data:
      layers:
        - label: 流量采集与镜像层
          detail: 跨 API 网关、云负载均衡器、Kubernetes sidecar 和容器主机进行带外采集
          modules:
            - API 网关插件（Kong、Apigee、MuleSoft、NGINX）
            - 云流量镜像（AWS VPC Mirroring、Azure vTap）
            - 容器与服务网格传感器（Kubernetes、Envoy、Istio）
        - label: 元数据提取与预处理层
          detail: 提取交易元数据、剥离敏感载荷，并准备流数据转发到云端，不增加应用延迟
          modules:
            - 请求头与端点元数据提取器
            - PII/PHI 载荷脱敏过滤器
            - 带外转发代理
        - label: 云数据湖与摄取管道
          detail: 集中式大数据仓库存储数百万个 API 属性，构建持续的多租户上下文
          modules:
            - 云规模分布式摄取引擎
            - 长期 API 遥测存储
            - Schema 目录与端点清单索引
        - label: API Context Engine（ACE）与 AI 分析层
          detail: 以专利行为 ML 模型为 API 活动建立正常基线，并关联持续多日的攻击者侦察行为
          modules:
            - 行为基线引擎（按用户与端点）
            - BOLA / BOPLA 异常检测模型
            - 聚合攻击者指纹与时间线关联器
        - label: 姿态治理与智能体安全层
          detail: 持续清单治理、Policy Hub 规则验证，以及面向 MCP 服务器的 Agentic Security Graph 映射
          modules:
            - API 清单与敏感数据暴露目录
            - Policy Hub 合规引擎（SOC 2、HIPAA、PCI DSS）
            - 智能体安全姿态管理（AG-SPM 与 MCP Protect）
        - label: 编排与强制执行集成层
          detail: 将检测洞察、聚合告警和自动拦截策略转发到企业安全工具
          modules:
            - 拦截连接器（WAF、网关、防火墙规则）
            - SIEM 与 SOC 连接器（Splunk、Sentinel、Datadog）
            - CI/CD 与开发者修复信息流（Jira、GitHub）
    approximationNotes: 架构拆解综合供应商技术文档、CrowdStrike 合作伙伴简报和独立应用安全评测。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
      - CE008
  - id: FU001
    title: 企业客户旅程与扩张检查点
    type: journey-map
    summary: 面向尽调的流程，从 API 可见性需求走到运营使用和潜在智能体安全扩张，并明确标出实施摩擦。
    data:
      items:
        - label: 1. 触发
          detail: API 泛滥、影子端点和运行时可见性不足，催生采购需求。
          touchpoints:
            - 安全与平台需求研讨会
        - label: 2. 评估
          detail: 买方测试清单准确性、行为检测、强制执行选项和工作流适配度。
          touchpoints:
            - RFP
            - 演示
            - 概念验证（PoC）
        - label: 3. 集成
          detail: 团队配置采集器、连接器、流量访问权限，并跨职能明确所有权。
          touchpoints:
            - 云与混合环境连接器
            - 安全工程
        - label: 4. 建立基线
          detail: 按客户 API 资产调优策略和行为模型。
          touchpoints:
            - 策略评审
            - 误报调优
        - label: 5. 运营
          detail: 安全团队调查威胁，并可定期复盘。
          touchpoints:
            - SOC 工作流
            - 季度复盘
        - label: 6. 扩张
          detail: 现有 API 安全用户可能评估智能体姿态和检测模块。
          touchpoints:
            - AI-DR
            - MCP 与智能体可见性
    approximationNotes: 该流程是综合出的采购与运营模型，并非实测的 Salt 客户漏斗；没有可用的阶段转化率或队列时间数据。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU010
      - CU012
  - id: FR001
    title: 风险严重程度与可能性热力图
    type: matrix
    summary: 矩阵评估将核心企业风险类别映射到可能性层级、影响严重程度和剩余缓解姿态。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
