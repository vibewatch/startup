  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户工作 / 运营任务
      - 传统安全工作流
      - Salt Security 运营方案
      - 可量化的工作流收益
      - 架构限制 / 边界
    rows:
      - - 影子与僵尸 API 发现
        - 手工表格审计、开发者自报或静态网关配置导出
        - 持续自动镜像实时流量，识别活跃但未记录及已弃用的端点
        - 传感器部署后数分钟内即可完整看见活跃攻击面，不增加开发者负担
        - 要求覆盖所有网络分段的流量镜像；未打标签或加密路径可能形成盲区
      - - BOLA / BOPLA 漏洞利用防护
        - 基于签名的 WAF 检查，或会漏掉业务逻辑缺陷的静态应用安全测试（SAST）
        - 用机器学习基线将用户授权上下文与历史对象访问规律比较
        - 在数据外泄前的侦察阶段定位对象级授权失效攻击
        - 行为模型稳定前，需要约 30 天有代表性的生产流量
      - - 上线前与运行时态势加固
        - 定期渗透测试和漏洞扫描，生成彼此割裂的报告
        - 持续运行时反馈闭环，将面向开发者的修复上下文和漂移分析送入 CI/CD
        - 通过把相关探测尝试归并到单一事件时间线，最多可减少 96% 的告警噪声
        - 开发者必须主动把修复洞见纳入待办；Salt 不会重写代码
      - - 智能代理 AI 与 MCP 服务器治理
        - 开发者不受监控地部署 LLM 插件、桌面 MCP 服务器和自主代理工作流
        - 实时智能代理安全图谱映射代理到工具的 API 调用，标记权限过大的工具和影子 MCP
        - 确保自主代理工作流遵守企业数据边界和监管治理标准
        - 协议生态仍在形成；代理框架快速演进，需要持续更新连接器
    notes: 运营工作流对比来自供应商架构简介、AppSec Santa 评测及企业买方指南。
