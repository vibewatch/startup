      - number: '5.3'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Salt Security 的运营架构围绕专利 API Context Engine（ACE）构建，目标是在不影响应用性能或终端用户延迟的情况下提供完整安全可见性。不同于同步检查交易、引入网络延迟的传统内联代理或
              WAF，Salt 通过收集 API 流量镜像副本在带外部署。与 Kong、Apigee 和 NGINX 等 API 网关集成的轻量传感器，连同云负载均衡器和 Kubernetes
              sidecar，捕获交易流并将脱敏元数据转发到 Salt 的云规模 API 数据湖。在云引擎内，机器学习算法持续根据数百万属性建立正常用户和系统行为基线，区分良性应用更新与恶意低速侦察。平台还包含实时
              Agentic Security Graph，追踪语言模型、MCP 服务器和底层企业 API 之间的交互。但由于系统在带外运行，它不会原生在数据路径中丢弃恶意数据包；自动攻击缓解依赖向现有边缘防火墙、API
              网关或安全编排、自动化与响应（SOAR）剧本推送编排指令。
