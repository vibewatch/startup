      - number: '4.2'
        title: 成本结构、托管驱动与单位经济
        blocks:
          - type: paragraph
            body: >-
              Salt Security 的销售成本（COGS）由云基础设施托管、分布式流量元数据摄取和专用机器学习推理算力驱动。不同于内联反向代理方案，Salt
              通过带外流量镜像和云连接器运行，消除内联延迟瓶颈，却把基础设施处理成本全部转移到 Salt 的云分析后端。Salt 的行业调研显示，47% 的企业受访者经历了 51% 至 100% 的 API
              流量同比增长，这会自然推动客户进入更高流量档位，同时抬升后端摄取算力。买方总拥有成本不止软件订阅，还包括外部云出口、本地混合服务器部署，以及自动内联拦截所需的外部 Web Application
              Firewall（WAF）授权。毛利率、净收入留存率（NRR）和客户获取成本（CAC）回收期等核心单位经济指标严格保密，潜在投资者必须在正式尽调中评估云算力压缩利润率的可能性。
            claimRefs:
              - CI007
              - CI010
              - CI012
