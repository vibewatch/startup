      - number: '5.2'
        title: 运营工作流与企业用例
        blocks:
          - type: paragraph
            body: >-
              企业安全运营中心（SOC）分析师、应用安全工程师和平台团队部署 Salt Security，用自动实时可见性替代零散的人工追踪。传统应用安全通常依赖定期人工表格审计、开发者自证或静态 WAF
              配置，这些办法都抓不住快速敏捷迭代中新出现的未记录 API 变更。Salt 在传感器启用后数分钟内自动编目活跃 API 端点，识别暴露参数、敏感数据载荷和认证机制，无需开发者撰写文档。在运行时防御中，平台防护
              BOLA 和 BOPLA 等复杂业务逻辑滥用，它们在 OWASP API Top 10 漏洞中占主导。Salt 不为每笔可疑交易单独触发告警，而是关联分布式实体的侦察探针，汇总成一条事件时间线。Salt Labs
              的研究也追踪自主 AI 代理环境中的前沿攻击向量，展示若 API 工具集成缺乏治理，多步骤代理工作流可能被间接提示词注入劫持。
