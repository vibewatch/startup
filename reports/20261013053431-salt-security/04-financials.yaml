company:
  name: Salt Security
chapter:
  number: 4
  title: Financials
  summary: Salt Security sustains an estimated $75M annual revenue run-rate through enterprise API protection subscriptions, but forward underwriting is constrained by private-metric opacity across gross margins, net retention, and operating burn against its $1.4B private valuation.
sections:
  - id: revenue-streams-and-pricing-architecture
    title: Revenue Streams and Commercial Pricing Architecture
    body: >-
      Salt Security monetizes primarily through annual software-as-a-service (SaaS) subscriptions and cloud marketplace private offers governed by API volume consumption and estate complexity. Public pricing anchors on AWS Marketplace establish an entry-level contract band of $36,000 annually for up to 5 million monthly API calls, stepping up to $100,000 annually for up to 100 million monthly calls, accompanied by a steep $1 per request overage charge on the higher tier. Procurement benchmarks indicate an average contract value (ACV) of approximately $70,000, with comprehensive enterprise deployments scaling up to roughly $210,000. During 2026, Salt expanded its addressable packaging with the Salt Agentic Security Platform, introducing Agentic Security Posture Management (AG-SPM) and Agentic Detection and Response (AG-DR) to monitor LLMs, MCP servers, and API interactions. To capture developer-side adoption without immediate procurement friction, Salt launched Salt Code in June 2026 as
      a policy enforcement engine for AI coding assistants, offering it at no additional cost for existing licensees. While this bundling accelerates customer expansion, it defers near-term standalone monetization.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
    tableRefs:
      - TI001
      - TI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Hosting Drivers, and Unit Economics
    body: >-
      Salt Security's cost of goods sold (COGS) is driven by cloud infrastructure hosting, distributed traffic metadata ingestion, and specialized machine learning inference compute. Unlike inline reverse-proxy solutions, Salt operates via out-of-band traffic mirroring and cloud connectors, which eliminates inline latency bottlenecks but shifts infrastructure processing costs entirely onto Salt's cloud analytics backend. Industry survey data from Salt highlights that 47% of enterprise respondents experienced API volume growth between 51% and 100% year-over-year, driving natural expansion across customer volume bands while simultaneously escalating backend ingestion compute. Total cost of ownership for buyers extends beyond direct software subscriptions to include external cloud egress, on-premises hybrid server deployments, and external Web Application Firewall (WAF) licensing required for automated inline blocking. Core unit economics metrics—including gross margin percentage, net
      revenue retention (NRR), and customer acquisition cost (CAC) payback—remain strictly confidential, requiring prospective investors to underwrite potential cloud compute margin compression during formal diligence.
    claimRefs:
      - CI007
      - CI010
      - CI012
    tableRefs:
      - TI003
    figureRefs:
      - FI001
  - id: traction-scale-and-private-metric-gaps
    title: Traction Scale, Competitive Tradeoffs, and Private-Metric Gaps
    body: >-
      Public competitive intelligence and analyst reporting attribute roughly $75M in annual recurring revenue to Salt Security, positioning the company as an established dedicated pure-play vendor within the API protection category. Customer sentiment on Gartner Peer Insights and TrustRadius highlights strong customer satisfaction with agentless API discovery and automated shadow API inventory creation. However, customer reviews also document enterprise implementation friction, specifically around complex identity integrations involving Okta and DPoP protocols that require dedicated professional services. Architecturally, Salt's dedicated out-of-band positioning presents commercial tradeoffs against consolidated Cloud Web Application and API Protection (WAAP) suites. Competitors such as Imperva (backed by Thales) bundle native Web Application Firewalls, DDoS mitigation, and bot defense into a single inline platform, whereas Salt requires integrations with third-party network devices
      to achieve automated mitigation. This architectural distinction exposes Salt to vendor consolidation pressures and potential pricing concessions in accounts prioritizing unified edge tooling.
    claimRefs:
      - CI008
      - CI009
      - CI011
  - id: capital-adequacy-and-financial-verdict
    title: Capital Adequacy and Financial Underwriting Verdict
    body: >-
      From a capital adequacy perspective, Salt Security has accumulated $281M in lifetime venture funding, crowned by a $1.4B valuation achieved during its Series D round. However, the company has released no public disclosures regarding its post-2022 cash reserves, monthly cash burn, or operational runway. In an underwriting context, Salt displays high structural revenue quality rooted in recurring enterprise contracts and expanding API call volumes, but its financial profile carries significant valuation tension. An estimated $75M revenue base against a $1.4B private valuation implies an entry multiple exceeding 18x ARR. In the absence of audited net retention, gross margins, and verified cash runway, institutional underwriters cannot validate whether Salt is operating near cash-flow breakeven or remains dependent on external capital markets. Consequently, access to audited financial schedules, retention cohorts, and COGS accounting remains a mandatory diligence prerequisite before
      confirming investment conviction.
    claimRefs:
      - CI013
      - CI014
