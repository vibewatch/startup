  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-financials-and-burn
      missingEvidence: Audited financial statements confirming current annual recurring revenue (ARR), cash balance, net burn rate, and forward operating runway as of 2026.
      whyItMatters: Without audited ARR, cash reserves, and monthly cash burn figures, underwriters cannot determine forward capital adequacy or assess runway under varying growth scenarios.
      diligencePath: Request confidential management financial package including audited 2024-2025 financial statements, YTD 2026 management accounts, and board-approved 2026-2027 operating plan.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: unit-economics-and-retention
      missingEvidence: Cohort-level net revenue retention (NRR), gross revenue retention (GRR), customer acquisition cost (CAC) payback, and hosting gross margins.
      whyItMatters: SaaS multiples and terminal cash flow projections depend critically on whether growth is driven by efficient expansion (NRR > 120%) or costly new customer acquisition with high churn.
      diligencePath: Request historical quarterly cohort retention tables, customer churn schedules by logo and ARR, and detailed COGS schedules separating hosting infrastructure from customer support.
      relatedQuestionRefs:
        - QI005
      relatedTableRefs:
        - TI003
    - type: conflicting-data
      severity: minor
      topic: agentic-monetization-realization
      missingEvidence: Evidence of standalone paid contract realization and incremental ARR attach for newly launched modules (Salt Agentic Security Platform and Salt Code).
      whyItMatters: Salt Code is currently bundled at zero incremental cost for existing customers, leaving it uncertain whether agentic features will drive new revenue tiers or serve merely as defensive retention features.
      diligencePath: Review pipeline data and commercial contract amendments to verify customer willingness to pay incremental licensing fees for agentic AI protection capabilities.
      relatedQuestionRefs:
        - QI001
      relatedTableRefs:
        - TI001
