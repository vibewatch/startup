      - Confidence
      - Strategic Diligence Significance
      - Required Diligence Ask
    notes: Unit economics metrics reflect a synthesis of public market estimates and unverified private figures; null entries indicate material corporate disclosures that Salt Security has not made public as of the current run date.
    claimRefs:
      - CI001
      - CI003
      - CI008
      - CI013
    rows:
      - - Gross Margin (%)
        - null
        - low
        - Measures cloud hosting, traffic ingestion, and LLM inference compute efficiency relative to subscription revenue
        - Request COGS schedule distinguishing AWS hosting, LLM inference, and support engineering.
      - - Net Revenue Retention (NRR)
        - null
        - low
        - Determines expansion durability across API volume growth and multi-module attach
        - Obtain trailing-twelve-month cohort retention, gross churn, and expansion rates.
      - - Customer Acquisition Cost (CAC) Payback
        - null
        - low
        - Reflects enterprise sales cycle efficiency and direct salesforce productivity
        - Request sales and marketing spend breakdown against new ARR additions.
      - - Average Contract Value (ACV)
        - ~$70,000 (proposals $36k–$210k)
        - medium
        - Validates enterprise buyer profile and contract size required to support direct enterprise sales
        - Review contract value distribution across Fortune 500 and mid-market accounts.
      - - Annual Recurring Revenue (ARR)
        - $75M (reported/estimated)
        - medium
        - Anchors revenue scale against the $1.4B valuation established in Series D financing
        - Require audited revenue recognition schedule and GAAP-to-ARR reconciliation.
