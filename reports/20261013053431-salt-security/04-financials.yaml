    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
    rows:
      - - API Protection Core Platform
        - Annual software subscription (SaaS) and private offer contracts
        - Per-account base fee plus API call volume tier
        - Primary revenue driver; estimated ~$75M ARR run-rate
        - High (recurring SaaS, multi-year enterprise commitments)
        - Request audited ARR breakdown, contract duration distribution, and renewal rates.
      - - Agentic Security Platform (AG-SPM & AG-DR)
        - Add-on platform capability and unified agentic security tier
        - Discovered agents, MCP servers, and LLM connection endpoints
        - Launched March 2026; early enterprise adoption via RSA discovery sessions
        - Moderate to high (strategic expansion, cross-sell into installed base)
        - Verify paid attach rate vs. promotional bundling in existing enterprise contracts.
      - - Salt Code (AI Coding Assistant Policy)
        - Developer seat or platform policy engine extension
        - Developer workflows / early access currently bundled at no added cost
        - Free early access / included at no additional cost for existing customers (June 2026)
        - Low current direct monetization (land-and-expand product wedge)
        - Confirm roadmap timeline for standalone SKU monetization and developer seat pricing.
      - - AWS Marketplace & Channel Private Offers
        - Cloud marketplace co-sell and channel distribution
        - Consumption-based API call volume tiers with overage fees
        - Active marketplace listings ($36k-$100k base tiers with $1 overages)
        - High (cloud commit drawdown, lower procurement friction)
        - Examine marketplace gross vs. net margin after AWS listing fees and partner margins.
