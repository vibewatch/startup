callouts:
  - calloutType: risk
    title: Valuation Multiple Compression Risk
    body: Salt Security's last reported valuation of $1.4B against estimated revenue of $75M implies a revenue multiple exceeding 18x. In the absence of disclosed profitability or hyper-growth metrics (>80% YoY), this multiple presents substantial down-round or multiple compression risk relative to public cybersecurity comparables.
    claimRefs:
      - CI008
      - CI014
  - calloutType: insight
    title: Agentic AI as an Expansion Wedge vs. Margin Pressure
    body: While Salt's extension into agentic security (LLMs, MCP servers, and coding assistants) provides a timely narrative and GTM expansion path, bundling Salt Code at no additional charge delays immediate software margin expansion, while increasing cloud processing and model analysis compute requirements.
    claimRefs:
      - CI004
      - CI006
      - CI012
