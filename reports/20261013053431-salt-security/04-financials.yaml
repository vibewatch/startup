      - CI001
      - CI002
      - CI003
      - CI006
    rows:
      - - AWS Marketplace Tier 1
        - 12-month contract; up to 5M API calls/month
        - $36,000 / year list anchor
        - Serves as procurement entry baseline for mid-market estates
        - Discount depth unlisted; private offer negotiation common
        - RFP.wiki AWS Marketplace analysis
      - - AWS Marketplace Tier 2
        - 12-month contract; up to 100M API calls/month
        - $100,000 / year list anchor ($1/req overage)
        - Enterprise baseline; overage charges apply outside contracted limits
        - Overage economics for high-volume estates require custom quote
        - RFP.wiki AWS Marketplace analysis
      - - Direct Enterprise ACV
        - Annual or multi-year custom enterprise subscription
        - Custom sales-led quote; average ACV ~$70,000
        - Large proposals reach roughly $210,000 based on API volume & scale
        - Enterprise discount levels and multi-year escalators undisclosed
        - RFP.wiki procurement reference benchmarks
      - - Salt Code & Add-On Modules
        - License-bundled module / Early Access Program
        - Bundled at no additional cost for existing licensees
        - Zero incremental software charge for current licensees at launch
        - Future standalone packaging and tier thresholds unverified
