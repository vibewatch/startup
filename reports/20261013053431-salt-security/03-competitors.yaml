chapter:
  number: 3
  title: "Competitors"
  summary: "Salt remains the only independent pure-play among the three API-security vendors most directly compared in the retained independent evidence, while Akamai and Harness now compete through broader platform bundles. Salt's behavioral detection and agentic-security expansion are meaningful differentiators, but pricing opacity, platform consolidation, and improving bundled alternatives weaken confidence that those advantages will sustain standalone pricing power."
sections:
  - id: "landscape-and-consolidation"
    title: "Landscape and consolidation"
    body: >-
      The competitive set is broader than direct API-security vendors. Salt competes with Akamai API
      Security, created after Akamai acquired Noname Security for $450 million in June 2024, and with
      Harness's application-security stack after Traceable merged with Harness in March 2025. It also
      faces adjacent CNAPP modules, API gateways, hyperscaler-native controls, traditional WAFs, internal
      tooling, and the status quo of relying on development and security teams to assemble point
      controls. The retained independent comparison describes Salt as the only standalone pure-play of
      the Salt, Noname/Akamai, and Traceable/Harness trio. That independence concentrates product focus,
      but it also denies Salt the installed-base distribution that Akamai, Harness, CNAPP vendors, and
      cloud providers can use to make bundled API coverage the default. Levo is a direct specialist
      alternative, although its comparison is competitor-issued and is evidence of positioning rather
      than an independent benchmark.
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP010"
      - "CP016"
    tableRefs:
      - "TP001"
  - id: "buyer-criteria-and-packaging"
    title: "Buyer criteria, capability trade-offs, and packaging"
    body: >-
      Salt's official materials emphasize inventory across internal, external, shadow, and third-party
      APIs, plus real-time behavioral detection for BOLA and abuse. Omdia independently characterizes
      the offering as combining discovery, runtime protection, and shift-left security on a cloud-based
      big-data service. The retained market comparison assigns Salt the strongest BOLA/BOPLA detection,
      Akamai the advantage in discovery and edge enforcement, and Harness the advantage in distributed
      tracing context and native CI/CD integration. These are different control points rather than
      interchangeable feature checkboxes. Salt's sales motion is described as enterprise licensing,
      commonly per endpoint, but none of the retained eligible sources provides a verifiable current
      price card, discount schedule, or realized contract value. Levo's criticisms of traffic-dependent
      runtime products identify plausible privacy, cost, and pre-production concerns, but they remain
      competitor assertions and should be validated through architecture reviews and proof-of-concept
      telemetry rather than treated as neutral test results.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP011"
      - "CP012"
    tableRefs:
      - "TP002"
      - "TP003"
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      Salt is extending differentiation beyond conventional API monitoring. Company-issued evidence
      says GitHub Connect and MCP Finder moved discovery into repositories and CI/CD, while a September
      2026 syndicated Salt release announced native AI Detection and Response spanning prompts, models,
      agents, MCP servers, tools, and downstream APIs. This broadens Salt's addressable security graph,
      but public launch scope is not proof of paid adoption, efficacy, or durable differentiation.
      Distribution remains the strategic counterweight: Akamai can attach API security to edge
      protection, Harness can attach it to DevSecOps, and CNAPP or cloud vendors can make adequate
      discovery and posture controls part of an existing platform contract. Salt's moat is therefore
      strongest where sophisticated buyers value behavioral detection depth and cross-layer agentic
      context enough to support a specialist deployment. It is weakest where procurement prioritizes
      consolidation, existing-vendor integration, or basic inventory over best-of-breed detection.
    claimRefs:
      - "CP013"
      - "CP014"
      - "CP015"
    figureRefs:
      - "FP001"
