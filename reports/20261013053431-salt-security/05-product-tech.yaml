figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-layer architectural stack illustrating traffic collection, metadata extraction, big data ingestion, behavioral AI Context Engine correlation, posture governance, and ecosystem orchestration.
    data:
      layers:
        - label: Traffic Collection & Mirroring Layer
          detail: Out-of-band capture across API gateways, cloud load balancers, Kubernetes sidecars, and container hosts
          modules:
            - API Gateway Plugins (Kong, Apigee, MuleSoft, NGINX)
            - Cloud Traffic Mirroring (AWS VPC Mirroring, Azure vTap)
            - Container & Service Mesh Sensors (Kubernetes, Envoy, Istio)
        - label: Metadata Extraction & Pre-Processing Layer
          detail: Extracts transaction metadata, strips sensitive payloads, and prepares streams for cloud forwarding without app latency
          modules:
            - Header & Endpoint Metadata Extractor
            - PII/PHI Payload Masking Filter
            - Out-of-Band Forwarding Agent
        - label: Cloud Data Lake & Ingestion Pipeline
          detail: Centralized big data repository storing millions of API attributes to build continuous multi-tenant context
          modules:
            - Cloud-Scale Distributed Ingestion Engine
            - Long-Term API Telemetry Store
            - Schema Catalog & Endpoint Inventory Index
        - label: API Context Engine (ACE) & AI Analysis Layer
          detail: Patented behavioral ML models baselining normal API activity and correlating multi-day attacker reconnaissance
          modules:
            - Behavioral Baseline Engine (Per-User & Per-Endpoint)
            - BOLA / BOPLA Anomaly Detection Models
            - Consolidated Attacker Fingerprint & Timeline Correlator
        - label: Posture Governance & Agentic Security Layer
          detail: Continuous inventory governance, Policy Hub rule validation, and Agentic Security Graph mapping for MCP servers
          modules:
            - API Inventory & Sensitive Data Exposure Catalog
            - Policy Hub Compliance Engine (SOC 2, HIPAA, PCI DSS)
            - Agentic Security Posture Management (AG-SPM & MCP Protect)
        - label: Orchestration & Enforcement Integration Layer
          detail: Forwarding detection insights, consolidated alerts, and automated blocking policies to enterprise security tooling
          modules:
            - Blocking Connectors (WAF, Gateway, Firewall Rules)
            - SIEM & SOC Connectors (Splunk, Sentinel, Datadog)
            - CI/CD & Developer Remediation Feed (Jira, GitHub)
    approximationNotes: Architectural breakdown synthesized from vendor technical documentation, CrowdStrike partner briefs, and independent application security reviews.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
      - CE008
callouts:
  - calloutType: insight
    title: Out-of-Band Architectural Tradeoff
    body: Salt Security's out-of-band traffic mirroring guarantees zero latency impact on production applications, but shifts runtime enforcement entirely to third-party integrations with WAFs, API gateways, and SOAR platforms rather than offering native inline packet dropping.
    claimRefs:
      - CE002
      - CE012
  - calloutType: risk
    title: Behavioral Baselines & Baselining Latency
    body: ML-driven behavioral detection requires approximately 30 days of representative production traffic to stabilize per-user and per-endpoint baselines, creating a window of potential false positives or delayed BOLA detection for newly deployed services.
    claimRefs:
      - CE003
      - CE013
