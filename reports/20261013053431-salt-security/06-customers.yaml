company:
  name: "Salt Security"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    The strongest adoption evidence in the assigned source set is a single anonymous enterprise
    practitioner account describing three years of use, quarterly reviews, a blocked complex
    attack, and 240 man-hours saved. Salt appears best suited to large, API-intensive enterprises,
    but named production references, fleet-wide adoption metrics, retention, contract duration,
    and concentration remain undisclosed.
sections:
  - id: "buyer-segments-and-use-cases"
    title: "Buyer segments and use cases"
    body: >-
      Salt's clearest fit is the large enterprise security organization managing API sprawl across
      hybrid or multi-cloud environments. RFP Wiki frames the core buyers as security and platform
      teams that need continuous discovery, posture management, testing, and runtime defense, while
      Salt's own product page emphasizes visibility across internal, external, shadow, and
      third-party APIs. The only practitioner evidence in the assigned pool describes an unnamed
      client using Salt across its application estate, not a disclosed logo or independently
      attributable account. This supports a buyer profile centered on CISOs, AppSec leaders, SOC
      teams, platform engineering, and developers, with enterprise security budgets as the likely
      payer. It does not establish segment mix, geography, customer count, or revenue contribution
      by vertical. Agentic-AI buyers are an emerging target, but current evidence demonstrates
      product availability rather than paid customer adoption.
    claimRefs: ["CU001", "CU002", "CU008", "CU011", "CU012", "CU013"]
    tableRefs: ["TU001"]
  - id: "adoption-and-customer-proof"
    title: "Adoption and customer proof"
    body: >-
      The most concrete usage signal is one PeerSpot-supplied practitioner review. The reviewer
      reports three years of use, quarterly threat reviews, and a complex attack that Salt detected
      and stopped. The same account attributes 240 man-hours saved to attack prevention and
      mitigation. These are useful proof points because they describe ongoing operational use
      rather than a logo, but they remain a single anonymous account with no disclosed deployment
      size, API volume, contract value, baseline, or methodology. Salt's resource center advertises
      case studies, yet the fetched page exposes no named customers or outcomes. A 2025 syndicated
      company release similarly says customers requested visibility and speed without providing a
      customer count, cohort, or quantified result. The evidence therefore supports real use at one
      enterprise, not broad adoption or a measurable growth trajectory.
    claimRefs: ["CU002", "CU003", "CU004", "CU005", "CU006", "CU014", "CU015"]
    tableRefs: ["TU002", "TU003"]
  - id: "deployment-and-expansion-journey"
    title: "Deployment and expansion journey"
    body: >-
      The likely customer journey begins with API inventory gaps and proceeds through a
      proof-of-concept, connector and traffic setup, policy baselining, operational threat review,
      and possible expansion into agentic-security controls. This sequence is supported as a
      procurement and implementation model, not as a disclosed Salt cohort. RFP Wiki advises
      buyers to plan for collection architecture, connector setup, policy baselining, and shared
      ownership across development, platform, and security teams. The practitioner review adds a
      material counterweight: implementation in a unique environment was complex and time
      consuming, with a steep learning curve. That friction may favor large enterprises with
      dedicated security engineering and limit efficient down-market expansion. Salt's newer
      AI-DR availability creates an upsell surface, but no assigned source proves conversion,
      attach rate, or incremental contract value.
    claimRefs: ["CU007", "CU008", "CU010", "CU011", "CU012", "CU013"]
    figureRefs: ["FU001"]
  - id: "durability-economics-and-concentration"
    title: "Durability, economics, and concentration"
    body: >-
      Public evidence is insufficient to underwrite customer durability. The reviewed source set
      provides no NRR, GRR, logo churn, renewal rate, contract duration, cohort retention, customer
      count, or top-customer concentration. RFP Wiki characterizes sales as custom-contract and
      enterprise-led, which is consistent with procurement friction and implementation effort, but
      it does not reveal Salt's realized pricing, discounting, renewal behavior, or services burden.
      The anonymous practitioner's three-year usage history is a positive longevity signal for one
      account, not a retention statistic. Investment diligence should therefore request a
      customer-level ARR bridge, gross and net retention by cohort, production-versus-pilot status,
      top-10 concentration, implementation time, referenceability, and expansion by module. Until
      those data are supplied, customer quality is credible but not quantifiable, and concentration
      risk remains open rather than demonstrably low.
    claimRefs: ["CU003", "CU007", "CU009", "CU016"]
callouts:
  - calloutType: "risk"
    title: "Durability cannot be inferred from one positive account"
    body: >-
      One anonymous three-year deployment supports product usefulness, but the assigned evidence
      does not disclose retention, renewal, cohort, or concentration metrics.
    claimRefs: ["CU003", "CU016"]
