    type: "journey-map"
    summary: >-
      A diligence-oriented sequence from API visibility need through operational use and potential
      agentic-security expansion, with implementation friction shown explicitly.
    data:
      items:
        - label: "1. Trigger"
          detail: "API sprawl, shadow endpoints, and insufficient runtime visibility create the buying need."
          touchpoints:
            - "Security and platform requirements workshop"
        - label: "2. Evaluation"
          detail: "Buyer tests inventory accuracy, behavioral detection, enforcement options, and workflow fit."
          touchpoints:
            - "RFP"
            - "Demo"
            - "Proof of concept"
        - label: "3. Integration"
          detail: "Teams configure collectors, connectors, traffic access, and ownership across functions."
          touchpoints:
            - "Cloud and hybrid connectors"
            - "Security engineering"
        - label: "4. Baselining"
          detail: "Policies and behavioral models are tuned to the customer's API estate."
          touchpoints:
            - "Policy review"
            - "False-positive tuning"
        - label: "5. Operations"
          detail: "Security teams investigate threats and can conduct recurring reviews."
          touchpoints:
            - "SOC workflow"
            - "Quarterly review"
        - label: "6. Expansion"
          detail: "Existing API-security users may evaluate agentic posture and detection modules."
          touchpoints:
            - "AI-DR"
            - "MCP and agent visibility"
    approximationNotes: >-
      The sequence is a synthesized procurement and operating model, not a measured Salt customer
      funnel; no stage conversion rates or cohort timings are available.
    claimRefs: ["CU001", "CU004", "CU007", "CU010", "CU012"]
