sections:
  - id: identity-and-operating-profile
    title: Company Identity and Operating Model
    body: Salt Security is a cybersecurity technology enterprise headquartered in Palo Alto, California, operating in the specialized domain of application programming interface (API) and agentic artificial intelligence security. Founded in 2018 with foundational engineering operations rooted in Israeli cybersecurity intelligence traditions, the company developed the patented Salt API Protection Platform to address systemic security blind spots created when modern software architectures decomposed monolithic applications into distributed, microservice-driven APIs. The platform operates primarily out-of-band via cloud-scale traffic mirroring, utilizing machine learning algorithms and big data analytics to continuously map attack surfaces, baseline normative API behavior over multi-week observation windows, and uncover sophisticated business logic abuse, such as Broken Object Level Authorization (BOLA), without introducing inline network latency into enterprise production environments. Operating as a Series D venture-backed enterprise, Salt Security balances core runtime discovery and threat prevention across REST, GraphQL, and SOAP interfaces while expanding into emerging Model Context Protocol (MCP) and agentic workflows.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO009
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, Executive Leadership, and Governance
    body: Salt Security was founded by Chief Executive Officer Roey Eliyahu and Chief Operating Officer Michael Nicosia, who identified early that rapid cloud transformation and microservice adoption would transform APIs into the primary target for malicious exploitation. Eliyahu brings technical domain leadership and software security architecture expertise from elite technological units, while Nicosia drives operational delivery, customer success architecture, and corporate scaling. The broader executive management team provides seasoned enterprise governance, including Chief Financial Officer Kfir Lippmann overseeing fiscal planning and capital allocation, Executive Vice President of Technologies Iko Azoulay directing scalable infrastructure, and Vice President of Product Aner Gelman managing platform capabilities across runtime detection and API posture governance. Additionally, the company operates Salt Labs, an internal dedicated research division that discovers novel API attack vectors and publishes responsible industry vulnerability disclosures across emerging cloud and agentic environments.
    claimRefs:
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization History and Institutional Stakeholder Map
    body: Salt Security has secured approximately $281 million in cumulative equity financing across multiple institutional rounds since graduating from the Y Combinator accelerator program. The capitalization trajectory reached its high-water mark in February 2022 when the company closed a $140 million Series D financing round led by Alphabet growth equity fund CapitalG at a post-money valuation of $1.4 billion, establishing Salt Security as a unicorn pioneer in dedicated API defense. However, the company has operated without an announced institutional equity financing round between February 2022 and late 2026, representing a span of over four years. While independent market intelligence models estimated 2024 revenues near $48.5 million to $75 million, the lack of audited operating disclosures creates valuation uncertainty for prospective institutional investors benchmarking against current market multiples. Furthermore, while peer pioneers Noname Security and Traceable were acquired or merged, Salt remains an independent standalone pure-play.
    claimRefs:
      - CO001
      - CO002
      - CO010
      - CO014
    tableRefs:
      - TO003
  - id: product-evolution-and-milestones
    title: Product Evolution, AI-Agent Shift, and Historical Milestones
    body: 'From 2018 through 2024, Salt Security focused predominantly on post-production runtime API discovery, posture management, and behavioral threat mitigation. Throughout 2025, the company accelerated product cadence under its Twelve Months of Innovation program, launching Ask Pepper AI conversational security investigations, GitHub Connect repository visibility, and MCP protections for AWS WAF. In 2026, Salt expanded into agentic systems by launching the Salt Agentic Security Platform, introducing Salt Claude Connect to govern MCP servers linked to Claude Enterprise environments, and releasing native AI Detection and Response (AI-DR) to intercept prompt injection before attackers compromise downstream APIs. Despite these advances, independent technical evaluations highlight essential operational trade-offs: Salt relies on out-of-band traffic mirroring that avoids latency but requires third-party WAF integration for blocking, and its standalone pure-play footprint creates procurement friction against consolidated web application security platforms.'
    claimRefs:
      - CO011
      - CO012
      - CO013
    figureRefs:
      - FO001
