  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Financial performance and GAAP metrics
      missingEvidence: Audited financial statements detailing ARR, GAAP revenue, gross margin, cash burn, and net revenue retention as of 2026.
      whyItMatters: Private modeled revenue estimates vary widely between $48.5M and $75M, preventing rigorous valuation benchmarking against public comparables.
      diligencePath: Request audited financial statements, management accounts, and trailing-twelve-month retention cohorts under mutual non-disclosure agreement.
      relatedQuestionRefs:
        - QO009
    - type: enumeration-incomplete
      severity: material
      topic: Customer concentration and enterprise adoption
      missingEvidence: Complete account registry, contract value distribution (ACV), and verified logo list beyond confirmed reference City National Bank.
      whyItMatters: While Salt claims 100+ enterprise deployments, public validation is restricted to a single enterprise bank, masking potential customer concentration risk.
      diligencePath: Require anonymized customer concentration schedules showing top-10 customer revenue contribution and logo churn history during confirmatory diligence.
      relatedQuestionRefs:
        - QO010
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: Executive team and board composition
      missingEvidence: Full board of directors list, committee assignments, and equity ownership cap table including secondary share transactions.
      whyItMatters: Understanding independent board oversight and founder voting control is critical for assessing corporate governance and key-person risk.
      diligencePath: Review certified corporate charter, board meeting minutes, and current capitalization table during legal diligence.
      relatedTableRefs:
        - TO002
