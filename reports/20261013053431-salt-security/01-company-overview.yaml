callouts:
  - calloutType: insight
    title: Pioneering Category Focus vs. Platform Consolidation Wave
    body: While major competitors Noname Security (acquired by Akamai for $450M) and Traceable (merged with Harness) were absorbed into broader application delivery and DevSecOps suites, Salt Security remains the prominent standalone pure-play in API security. This independence sharpens technical specialization in behavioral detection and emerging MCP/agent security, but introduces enterprise procurement friction against consolidated security suites.
    claimRefs:
      - CO010
      - CO013
  - calloutType: risk
    title: Capitalization Vintage and Valuation Defensibility Gap
    body: Salt Security has not announced an institutional equity financing round since its February 2022 Series D ($1.4B valuation). While third-party estimates model 2024 revenues around $48.5M to $75M, the lack of audited operating disclosures, confirmed customer volume, or recent pricing marks creates valuation overhang for prospective investors benchmarking against compressed public SaaS multiples.
    claimRefs:
      - CO002
      - CO004
      - CO014
