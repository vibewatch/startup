  title: The Agentic Security Gap and Release Friction
  body: Enterprise adoption of autonomous AI agents is accelerating while security programs lag behind, with 92% of organizations
    lacking advanced maturity. With 47% of enterprises delaying production releases over API security concerns and 99% of
    attacks originating from authenticated sources, Salt faces acute execution pressure to deliver automated, machine-speed
    blocking without introducing false-positive disruption.
