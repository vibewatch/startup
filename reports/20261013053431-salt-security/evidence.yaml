evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Financial performance and GAAP metrics
    missingEvidence: >-
      Audited financial statements detailing ARR, GAAP revenue, gross margin, cash burn, and net revenue retention as of
      2026.
    whyItMatters: >-
      Private modeled revenue estimates vary widely between $48.5M and $75M, preventing rigorous valuation benchmarking
      against public comparables.
    diligencePath: >-
      Request audited financial statements, management accounts, and trailing-twelve-month retention cohorts under
      mutual non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: Customer concentration and enterprise adoption
    missingEvidence: >-
      Complete account registry, contract value distribution (ACV), and verified logo list beyond confirmed reference
      City National Bank.
    whyItMatters: >-
      While Salt claims 100+ enterprise deployments, public validation is restricted to a single enterprise bank,
      masking potential customer concentration risk.
    diligencePath: >-
      Require anonymized customer concentration schedules showing top-10 customer revenue contribution and logo churn
      history during confirmatory diligence.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Executive team and board composition
    missingEvidence: >-
      Full board of directors list, committee assignments, and equity ownership cap table including secondary share
      transactions.
    whyItMatters: >-
      Understanding independent board oversight and founder voting control is critical for assessing corporate
      governance and key-person risk.
    diligencePath: >-
      Review certified corporate charter, board meeting minutes, and current capitalization table during legal
      diligence.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-and-private-financials
    missingEvidence: >-
      Audited financial breakout detailing the exact revenue split between core API posture modules and newly launched
      Agentic AI / MCP protection modules.
    whyItMatters: >-
      Determines whether enterprise customer expansions are driven by traditional API compliance needs or new generative
      AI infrastructure budgets.
    diligencePath: >-
      Request customer renewal contract data and module expansion breakdown under non-disclosure during management
      diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable current revenue, ARR, customer count, funding, win-rate, and segment-mix data for Salt and its
      principal alternatives.
    whyItMatters: >-
      Without normalized operating scale and win-loss evidence, acquisition values and platform ownership do not show
      actual competitive momentum.
    diligencePath: >-
      Request management's dated competitive pipeline, loss reasons, displacement records, and normalized peer operating
      metrics from investors or procurement references.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Like-for-like current quotes, endpoint definitions, minimum commitments, overages, discounts, implementation fees,
      and realized renewal pricing.
    whyItMatters: >-
      Public contract-model descriptions cannot establish relative total cost or Salt's ability to preserve standalone
      pricing power.
    diligencePath: >-
      Run a controlled RFP with the same API estate and contract term, then reconcile vendor quotes to deployment and
      operating costs.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-efficacy
    missingEvidence: >-
      Independent, reproducible head-to-head testing of detection recall, false positives, deployment effort, data
      handling, and operating cost.
    whyItMatters: >-
      The strongest adverse architecture claims are competitor-issued, while company product launches do not establish
