  topStrengths:
    - API 安全覆盖面广，从发现、态势治理、运行时防御延伸到新兴的智能体 AI 控制。
    - 凭借带外行为检测和在该赛道较高的品牌认知度，企业市场定位清晰。
    - 竞争对手整合后，专注 API 安全的独立厂商选择更少，Salt Security 得以保持纯粹的独立定位。
  topRisks:
