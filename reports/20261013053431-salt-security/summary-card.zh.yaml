    - 只面向企业的定价和复杂的实施流程可能拖慢采用，并让捆绑式平台竞争对手占优。
    - 相较当前公开收入信号和该赛道的并购先例，历史上的 $1.4B 估值显得偏高。
  unresolvedGaps:
    - 截至 2026 年经审计的 ARR / 收入、烧钱速度、现金余额和现金跑道。
    - 客户数、NRR / GRR、流失率、合同期限及头部客户集中度。
    - 面向以色列研发组织的书面业务连续性计划。
    - 除发布宣传外，尚无 Agentic Security 和 Salt Code 持续付费采用的证据。
