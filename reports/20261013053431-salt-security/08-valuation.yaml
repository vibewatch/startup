        - Enterprise preference for bundled edge suites (Akamai, Cloudflare, Imperva/Thales)
        - Verified Fortune 500 migration from bundled WAFs to standalone Salt deployment
      - - Agentic AI Horizon
        - Rapid expansion into AI-DR and MCP server protection captures high-growth agentic runtime demand
        - Enterprise agentic security spend remains nascent with uncertain standalone monetization
        - Paid ARR from Agentic Security modules exceeding 20% of new bookings
      - - Commercial Pricing
        - Strong enterprise ACVs ($70k average, up to $210k) demonstrate mission-critical willingness to pay
        - Per-API call consumption pricing creates friction and budget unpredictability for high-volume estates
        - Transition to predictable workload-based enterprise subscription packaging
      - - Valuation Realism
        - Growth could support premium multiple if emerging as the definitive DevSecOps API standard
        - 2022 unicorn valuation of $1.4B disconnected from $450M M&A benchmark set by Noname acquisition
        - Formal capital raise or strategic partnership confirming valuation above $1.0B
    notes: Contrasts structural drivers against consolidation headwinds; rows represent key investment tension points.
