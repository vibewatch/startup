company:
  name: Fever
chapter:
  number: 5
  title: Product & Technology
  summary: Fever’s public product surface is unusually broad for an experiences platform, combining curated discovery, digital ticketing, loyalty, vouchers, payment management, ticket recovery, support, and partner onboarding with branded or original formats such as Candlelight and Netflix-linked experiences. The workflow evidence is strong, but the underlying engineering stack, reliability metrics, and security attestations remain lightly documented publicly.
sections:
- id: product-definition-and-modules
  title: Product definition and module map
  body: 'Fever’s public materials describe a broader product than a normal events list or ticket wallet. The homepage, support article, and app-store descriptions show curated discovery, exclusive experiences, account-based ticketing, Favorites, Fever Club, ticket transfer, voucher redemption, payment-method management, and continuous support. That means the core product should be treated as a consumer discovery-and-transaction platform with multiple reinforcing modules, not just a feed of events. On top of that core, Fever has visible product lines such as Candlelight, Stranger Things, Bridgerton, and festival activations like Fever House, which function as branded or original content modules. This is important for later chapters because it suggests the company’s moat depends partly on formats and inventory design, not only on software utility. The product is also unusually modular for a consumer entertainment brand: loyalty, vouchers, account management, and partner intake all show up
    in separate public docs. That breadth suggests product management attention on retention and operational convenience, not just on top-of-funnel discovery.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE012
  - CE017
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-and-operating-architecture
  title: Workflow and operating architecture
  body: 'The most visible product workflow is app-centric. Users discover experiences, choose dates and ticket quantities, apply vouchers, manage or delete payment methods, receive tickets by email, recover missing tickets through account-resolution steps, and transfer tickets to friends inside the app. Those steps imply an underlying architecture that links discovery, checkout, identity, ticket wallet, payments, order reconciliation, and support. On the supply side, partner onboarding shows that Fever also runs a gated operating workflow for organizers and rights holders. The result is a two-sided operating model: consumer demand on one side and partner inventory plus event operations on the other. Public sources do not reveal code-level architecture, but they do reveal enough workflow detail to map the major product layers with confidence. It is especially notable that support docs expose several recovery or exception flows. That means the technology stack is not only about ideal checkout
    conversion; it also has to reconcile accounts, restore ticket visibility, manage stored payment details, and move ownership between users without breaking admission.'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE014
  - CE015
  - CE029
  - CE035
  tableRefs:
  - TE002
  - TE003
  figureRefs:
  - FE002
  - FE003
- id: differentiation-dependencies-and-roadmap
  title: Differentiation, dependencies, and roadmap signals
  body: 'Fever’s strongest public differentiation comes from mixing software with content and rights access. The app features matter, but they are not the whole story: Candlelight, Netflix-linked experiences, festival activations, and the DICE combination all point to a product strategy built around exclusive inventory and partner relationships. That creates dependencies too. App stores, payments, email delivery, privacy compliance, support operations, and partner onboarding are all critical to a functioning product loop. Public roadmap evidence is indirect rather than explicit, but the sequence of new experiential formats and the DICE expansion imply continued release and integration work. The main weakness is that internal technical documentation, APIs, and engineering detail remain largely private. External dependencies matter because any weakness in app-store distribution, payments, privacy operations, partner content supply, or support throughput can degrade the customer experience
    even when the front-end brand remains strong.'
  claimRefs:
  - CE013
  - CE016
  - CE017
  - CE018
  - CE023
  - CE028
  - CE030
  - CE031
  - CE034
  - CE035
  tableRefs:
  - TE004
  - TE005
  figureRefs:
  - FE004
- id: trust-privacy-and-tech-verdict
  title: Trust, privacy, and technology verdict
  body: 'Trust and compliance are real parts of the product surface. Fever publishes terms, refund processes, a global privacy notice, and uses support workflows to resolve tickets and payments. GDPR and DSA obligations add another layer of product responsibility around disclosure, privacy, and user rights. What remains missing is detailed public evidence on engineering stack, uptime, and external security certification. That gap does not imply weak technology, but it does mean diligence should focus on operational controls and data governance rather than assume that “proprietary technology” alone is a meaningful quality marker. The best current verdict is that the product is clearly broad and user-facing, while the underlying technical stack is only lightly disclosed publicly. Review and complaint sources reinforce that point: even a well-designed feature set can still lose trust if ticket recovery, refunds, or support response times fail under load.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE024
  - CE025
  - CE026
  - CE027
  - CE032
  - CE033
