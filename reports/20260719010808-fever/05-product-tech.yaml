- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Curated discovery feed
    - Consumer
    - Mature public surface
    - Personalized and curated city-based discovery
    - Need recommendation-quality and repeat-rate data.
  - - Ticket wallet / transfer
    - Consumer
    - Mature support-documented surface
    - App-native transfer and account-linked tickets
    - Need fraud, abuse, and transfer failure metrics.
  - - Fever Club loyalty
    - Consumer
    - Mature support-documented surface
    - App-linked points and redemption loop
    - Need redemption economics and retention impact.
  - - Voucher + payment management
    - Consumer
    - Mature support-documented surface
    - Checkout flexibility and stored payment methods
    - Need conversion lift and refund-exposure data.
  - - Partner onboarding workflow
    - Organizer / partner
    - Mature but lightly disclosed
    - Two-sided marketplace and mandate intake
    - Need integration time and partner win-rate data.
  - - Branded / original experiences
    - Consumer + partner
    - Active and expanding
    - Exclusive formats such as Candlelight and Netflix-linked activations
    - Need gross margin and capex data by format.
  - - DICE music layer
    - Partner + consumer
    - Newly integrated / evolving
    - Deeper venue, promoter, and artist relationships
    - Need integration roadmap and overlap analysis.
  notes: Matrix mixes software modules and experience assets because Fever’s differentiation appears to depend on both digital workflow and exclusive content formats.
