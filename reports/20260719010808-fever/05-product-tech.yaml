- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Discovery and curation layer
    - Ranks and merchandises experiences
    - Proprietary recommendation logic, content ops
    - Algorithm quality and freshness not publicly measurable
  - - Checkout and payments
    - Converts intent into paid orders
    - Stored payment methods, vouchers, refund handling
    - Payment failure, fraud, chargebacks
  - - Ticket wallet and delivery
    - Stores and recovers tickets
    - Email delivery, account identity, app wallet
    - Ticket visibility issues and support load
  - - Support and policy layer
    - Resolves refunds, transfers, and account issues
    - Help center, customer service tooling, terms
    - Operational cost and trust risk
  - - Partner supply intake
    - Brings organizers and rights holders onto platform
    - Business onboarding, event detail ingestion
    - Onboarding friction and integration burden
  notes: Architecture is an operating model abstraction built from workflow evidence; no public source in this run documented the internal code stack or vendor map.
