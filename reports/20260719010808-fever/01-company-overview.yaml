- id: adverse-signals-and-open-items
  title: Adverse signals and chapter-one open items
  body: 'The biggest weakness in the public record is not lack of growth ambition; it is measurement and disclosure precision. The operating story is strong, but monthly active users for Fever itself are not publicly pinned down, audited revenue remains absent, and capital-structure detail is not disclosed. There are also ordinary but important platform risks visible already in chapter one: complaint aggregators show refund and ticket-validation friction, and the terms contain arbitration and class-action waiver provisions that can mute but not remove consumer-dispute risk. Finally, third-party company directories are noisy: Tracxn and LeadIQ point to thousands of employees, while Craft still shows a stale, obviously undercounted profile. Those inconsistencies do not negate Fever’s unicorn status, but they do lower confidence in any precise operating or financial model built only from public web evidence. One more practical implication is that later chapters should not reuse directory numbers
    uncritically. Instead they should reuse the canonical funding and scale markers from this chapter, then layer in new evidence only when it clearly adds a different lens or materially fresher support.'
