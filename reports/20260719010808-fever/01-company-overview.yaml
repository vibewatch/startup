- id: capital-governance-and-stakeholders
  title: Capital, governance, and stakeholder map
  body: 'The strongest post-cutoff unicorn evidence is the June 2025 funding event. Fever’s own release confirms more than $100 million from L Catterton and Point72, while Tracxn records the same round at a $1.8 billion post-money valuation and lifts lifetime funding to roughly $527 million. The 2022 and 2023 rounds explain how Fever moved from a $1 billion valuation marker to a late-stage private company with a large global investor roster that includes Goldman Sachs, Goodwater, Eurazeo, Alignment Growth, Smash, Rakuten, Accel, and Fidelity. Public governance visibility remains partial: Tracxn surfaces a board roster, but there is no broad public cap-table or preference-stack disclosure. As a result, the right chapter-one conclusion is not that capital is unavailable; it is that Fever has deep investor sponsorship but still limited transparency on liquidation preferences, debt, or secondary supply.'
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO031
