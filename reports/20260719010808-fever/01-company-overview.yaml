- calloutType: insight
  title: The HQ story is dual-footprint, not binary
  body: The cleanest factual framing is that Fever is Madrid-founded with Spanish legal roots, but it now operates through a named U.S. entity and public New York address. Treating either location as the whole story would understate the company’s cross-border complexity.
  claimRefs:
