company:
  name: Fever
chapter:
  number: 1
  title: Company Overview
  summary: Fever is a Madrid-founded, now globally operated live-entertainment discovery and ticketing platform whose strongest public evidence centers on 2025 unicorn-confirming financing, 2024 EBITDA profitability, and expanding music/sports partnerships. The public record supports a roughly $1.8B valuation marker, about $527M cumulative funding, a DICE acquisition in 2025, and broad global reach, while exact MAU, audited revenue, and cap-table detail remain undisclosed.
sections:
- id: identity-and-operating-frame
  title: Identity, legal footprint, and operating frame
  body: 'Fever should be underwritten as a global live-entertainment discovery and ticketing platform rather than as a venue owner or event promoter. The official homepage, newsroom, and support surfaces consistently describe a curated consumer layer for discovering and buying access to experiences, while support and partner materials show that the platform also runs partner onboarding and post-purchase ticket workflows. The headquarters picture is nuanced rather than contradictory: Tracxn still points to a Madrid registered address and founding base, while Fever’s 2026 privacy notice and LeadIQ point to 50 Greene Street in New York as the current operating entity address. That split matters because it supports the user prompt’s Spain-rooted framing without ignoring the company’s U.S. operating footprint. Investors should therefore treat Fever as Madrid-founded with an active New York operating center, backed by a cross-border legal structure and a product that spans discovery, ticketing,
    support, and partner tooling.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
