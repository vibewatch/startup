- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Why it matters
  - Current evidence
  - Diligence ask
  rows:
  - - Latest round
    - '>$100M in June 2025'
    - Fresh capital for expansion and cushion
    - Official release plus Tracxn
    - Confirm net proceeds, secondaries, and earmarked uses.
  - - Total raised
    - $527M over 9 rounds
    - Indicates investor willingness to keep funding scale
    - Tracxn
    - Reconcile against any debt or uncounted structured capital.
  - - Reported valuation marker
    - $1.8B
    - Sets private-market expectation and return hurdle
    - Tracxn
    - Request post-money cap table and preference stack.
  - - Cash on hand
    - null
    - Critical for runway
    - No public disclosure found
    - Request latest cash balance and restricted cash.
  - - Burn / runway
    - null
    - Determines financing dependency
    - No public disclosure found
    - Request monthly burn and runway by base/bear case.
  - - Cross-border settlement / FX
    - Material
    - Can trap working capital or raise cash volatility
    - Corpay partnership and 50+ country ops
    - Request settlement cycle, FX exposure, and hedging policy.
  - - Acquisition integration spend
    - Unknown
    - DICE integration could consume capital
    - DICE announcement and filing history only
    - Request one-time integration budget and synergy timing.
  - - Debt / covenants
    - null
    - Can subordinate equity returns
    - No public disclosure found
    - Request credit agreements and covenant package.
  notes: Capital adequacy is directionally supported by the 2025 raise, but the absence of cash, burn, and covenant data is a major diligence blocker.
