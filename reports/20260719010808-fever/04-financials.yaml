  - TI004
  figureRefs:
  - FI004
- id: public-comp-context-and-verdict
  title: Public-comp context and chapter verdict
  body: 'Eventbrite provides the clearest public benchmark in the retained record. It offers transparent SEC filings, a visible revenue line, and a modest public-market capitalization relative to broad ticketing market narratives. Fever, by contrast, has stronger private-market momentum and broader exclusive-experience storytelling, but materially weaker public comparability. That does not make Fever financially weak; it means its financial quality is harder to verify. The best current verdict is therefore balanced: Fever appears to have credible scale, multiple monetization paths, and enough investor support to continue expanding, but public evidence is still too thin to underwrite revenue quality, burn, runway, or post-acquisition integration economics with high confidence. In other words, the current public file supports a “financeable and promising” conclusion, but not a “fully diligenced and precision-modeled” one.'
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI032
  - CI036
