company:
  name: Fever
chapter:
  number: 4
  title: Financials
  summary: Fever’s public financial picture shows strong directional momentum but very limited line-item transparency. Official sources support 2024 EBITDA profitability, 20x revenue growth versus pre-pandemic levels, and fresh 2025 capital, while public revenue, margins, take rate, cash, burn, and acquisition economics remain undisclosed, making the company financeable but not fully underwritable from public evidence alone.
sections:
- id: revenue-model-and-mix
  title: Revenue model and likely mix
  body: 'Fever’s public record supports a platform revenue model, but not a clean waterfall of disclosed line items. Official product pages show consumer ticketing, exclusive or curated experiences, and app-based support; partner onboarding pages show a B2B route where organizers bring inventory and events onto the platform. Branded or original formats such as Candlelight, Stranger Things, Bridgerton, and Fever House strongly suggest that Fever can monetize more than standard event listing fees. At the same time, no retained source gives a standardized schedule of ticket fees, partner take rates, or revenue-share mechanics. The right conclusion is that Fever almost certainly has multiple revenue streams, but the mix among consumer ticket sales, partner ticketing mandates, branded experiences, and demand-generation services remains opaque from public evidence alone. The fact pattern also suggests that revenue recognition could be messy in practice: some formats likely behave like marketplace
    commissions, others like co-produced event economics, and others like enterprise ticketing or marketing services. Without management definitions, even apparently simple metrics such as GMV or net revenue could conceal meaningful mix shifts.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI029
  - CI035
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: public-growth-and-unit-economics-signals
  title: Public growth and unit-economics signals
  body: 'The strongest financial positive signal is the company’s own June 2025 statement that 2024 was full-year EBITDA profitable and represented more than 20x revenue growth from pre-pandemic levels. That is directionally powerful evidence that Fever is not merely subsidizing growth indefinitely. The problem is that the public record stops there: there is no audited revenue figure, no ARR, no disclosed take rate, no gross margin, and no customer-acquisition or payback data. Headcount proxies do show that Fever operates at meaningful scale, which implies a large opex base and meaningful support cost. Refund workflows and consumer complaints also matter because they can erode gross-to-net revenue and raise service expense. So this chapter can support a view of improving economics, but not a clean public model of those economics. This matters because a platform can be EBITDA positive for very different reasons, including temporary marketing pullbacks, favorable mix, or working-capital timing.
    Public evidence does not let an outside investor separate those possibilities.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
