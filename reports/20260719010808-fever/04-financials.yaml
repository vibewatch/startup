- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited 2025 revenue
    - Cannot judge scale versus valuation
    - Request audited 2024 and 2025 income statements.
  - - Gross margin by product line
    - Cannot judge platform quality or original-experience economics
    - Request gross profit by consumer ticketing, partner ticketing, and originals.
  - - Take rate and net revenue after refunds
    - Cannot model monetization depth
    - Request GMV to net revenue bridge with refunds and chargebacks.
  - - Cash, burn, runway
    - Cannot judge financing dependency
    - Request treasury pack and monthly management reporting.
  - - Debt, covenants, or structured capital
    - Cannot judge preference overhang or downside risk
    - Request debt schedules and financing documents.
  - - DICE acquisition economics
    - Cannot assess post-M&A return logic
    - Request purchase price allocation and integration plan.
  notes: These are not minor omissions; they are the minimum private inputs needed before treating Fever as underwritten rather than merely promising.
