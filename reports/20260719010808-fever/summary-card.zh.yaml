summary:
  headline: 观察：Fever 看起来是真正跑出规模的品类龙头，合作伙伴验证扎实，经营杠杆也说得通；但当前私募估值已经计入相当成功，在缺少非公开收入、留存和集中度数据前，只能有条件支撑。
