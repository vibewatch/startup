  topStrengths:
    - 全球规模信号很强，包括 300M+ 月互动、200k+ 个体验项目，以及覆盖 50+ 个国家的运营。
    - 多边模式不止一个产品界面，而是同时覆盖消费者需求、主办方供给、B2B 体验和高信号的权利方合作。
    - 与管理层相关的证据称，Fever 2024 年全年 EBITDA 已盈利，收入较疫情前增长超过 20 倍。
    - DICE、LIV Golf、Sunny Hill Festival 和 Formula 1 在音乐、体育和企业票务里给 Fever 留下真实战略期权。
    - 融资历史和投资人名单支撑一个判断：Fever 仍是现场娱乐技术赛道里最可信的规模化私营玩家之一。
  topRisks:
    - 公开财务披露仍太薄：没有经审计收入、现金、烧钱、抽佣率，也没有队列留存分母。
    - 退款、票务可见性和客服投诉仍把消费者保护与客户服务风险暴露出来。
    - 最新约 $1.8B 估值按公开证据看已经合理偏满，而不是明显便宜。
    - 合作伙伴、活动系列、地域和 DICE 贡献的集中度都没有披露，乐观情景仍有一部分没被证明。
    - 多产品、多国家和现场活动服务窗口叠在一起，即便需求强，也会制造执行压力。
  unresolvedGaps:
    - 经审计的过去收入、GMV、抽佣率，以及分部或地域结构。
    - EBITDA 桥接、现金转化、营运资本画像和当前现金跑道。
    - 复购、主办方续约、企业留存和头部合作伙伴集中度。
    - 按活动类别和地域拆分的退款率、事故率和支持 SLA 仪表盘。
    - LIV、F1 和 DICE 相关供给等主要合作伙伴的合同经济性、实施成本和续约状态。
