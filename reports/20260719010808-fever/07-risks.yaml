  title: Risks
  summary: Fever’s top residual risks center on consumer-protection compliance, privacy and cross-border data handling, support and ticketing reliability, partner dependency, and the difficulty of underwriting a richly scaled but still under-disclosed operating model.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: Fever’s risk stack starts with the fact that it sits directly inside regulated ticketing and consumer-commerce flows. The current terms and support surfaces show a cross-border platform that handles discovery, payments, customer service, refunds, vouchers, and data sharing with partners. That puts Fever inside multiple live legal regimes at once. In the US, the FTC’s junk-fees rule now explicitly covers live-event ticket businesses and third-party platforms, including mobile apps and B2B transactions. In the UK, the CMA’s long-running secondary-ticketing enforcement history and the Digital Markets, Competition and Consumers Act keep pressure on transparency and consumer treatment. In the EU, the Digital Services Act and GDPR add marketplace, transparency, rights-handling, and international-transfer obligations. Fever’s own terms partly mitigate that by pushing event-performance responsibility toward organizers and by using arbitration, but those clauses do not eliminate brand, enforcement,
    or customer-trust risk if pricing, refunds, or data handling fall short in practice.
  claimRefs:
