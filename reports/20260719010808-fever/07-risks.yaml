- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Pricing-transparency enforcement
    - Regulator action or formal warning tied to fee disclosure
    - Any FTC, UK, or EU action alleging deceptive ticket pricing
    - Pause or reprice investment case until checkout-compliance evidence is reviewed
  - - Refund / support deterioration
    - Refund backlog or complaint intensity rises materially
    - Sustained increase in unresolved complaints, voucher disputes, or long response times
    - Assume weaker repeat purchase and higher remediation cost
  - - Ticket-delivery reliability failure
    - Missing-ticket or validation incidents spike
    - Any marquee event cycle with visible access failures
    - Treat as thesis-break on operational trust
  - - Partner concentration shock
    - Loss or underperformance of a major rights-holder relationship
    - Churn of a flagship partner or failed high-visibility launch
    - Lower growth assumptions and raise concentration discount
  - - Privacy / transfer control failure
    - Regulator complaint or material breach involving personal data
    - AEPD / DPA action, data-transfer challenge, or disclosed breach
    - Reassess legal reserves, brand damage, and EU operating posture
  - - People / execution stress
    - Attrition or off-hours overload in operations/support teams
    - Persistent understaffing, high churn, or degraded service metrics
    - Reduce confidence in scaling ability even if demand remains strong
  notes: These triggers are designed to be monitorable and thesis-relevant rather than generic red flags.
