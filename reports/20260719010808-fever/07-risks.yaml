  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-and-incidents
    missingEvidence: Security certifications, breach history, uptime targets, status history, and incident postmortems.
    whyItMatters: Without operating assurance metrics, investors cannot size the residual probability or cost of reliability failures.
    diligencePath: Request SOC 2 / ISO materials, status history, incident logs, and latest postmortems.
    relatedQuestionRefs:
    - QR017
  - type: private-evidence-only
    severity: material
    topic: refund-and-support-metrics
    missingEvidence: Refund SLA, first-response time, case backlog, resolution-time distributions, and complaint-rate trends.
    whyItMatters: Support quality is one of the clearest public risk signals, yet it is impossible to quantify from public evidence alone.
    diligencePath: Request monthly support dashboards by geography and event category plus refund-aging analysis.
    relatedQuestionRefs:
    - QR014
    - QR015
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner, top-organizer, top-event-family, and top-geography concentration by GMV and revenue.
    whyItMatters: A few marquee relationships could drive outsized volume and create hidden concentration risk.
    diligencePath: Request concentration tables, contract end dates, and launch dependency map.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: checkout-compliance
    missingEvidence: Country-by-country legal review of checkout display, fee disclosure, voucher logic, and refund exceptions.
    whyItMatters: FTC, UK, and EU consumer-protection regimes can all create expensive remediation if the actual flows lag the legal standard.
    diligencePath: Request product screenshots, counsel memo, AB tests, and historical complaint tagging for fee or refund disputes.
    relatedQuestionRefs:
    - QR004
    - QR006
    - QR008
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: important
    topic: people-and-coverage
    missingEvidence: Ops/support attrition, staffing ratios, off-hours coverage, and on-call escalation process.
    whyItMatters: A live-events platform can look healthy top-line while internal fatigue erodes service quality and launch reliability.
    diligencePath: Request staffing plans, attrition cohorts, workload dashboards, and peak-event coverage runbooks.
    relatedQuestionRefs:
    - QR025
    - QR026
    relatedTableRefs:
    - TR004
