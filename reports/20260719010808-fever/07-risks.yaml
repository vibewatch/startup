- id: operational-and-customer-trust-risk
  title: Operational and customer-trust risk
  body: The public operational record suggests Fever has built a meaningful support machine, but also that customer-service and ticket-resolution issues are not edge cases. Fever publishes 24/7 contact routes, an incident section, an intake form with ticket IDs and event-status fields, and dedicated help articles for refunds, transfers, and missing tickets. Those workflows are a positive sign because they show the company has instrumented the most time-sensitive failure paths. They are also a warning sign, because they reveal where the customer experience can break. Independent complaint surfaces repeatedly mention delayed or voucher-led refunds, missing tickets, weak escalation, and generic responses after bookings go wrong. One public complaint even describes a confirmed QR-code purchase that still failed at venue access because the ticket did not appear correctly in-app until after the event. In a live-entertainment marketplace, those problems transmit quickly into trust, repeat purchase,
    organizer confidence, and remediation cost. The absence of public incident metrics, refund SLAs, or resolution dashboards means operational quality still has to be diligence-tested privately rather than assumed from brand scale.
  claimRefs:
  - CR014
  - CR015
  - CR016
