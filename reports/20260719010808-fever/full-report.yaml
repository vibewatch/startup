      - number: '4.3'
        title: Capital adequacy and cash complexity
        blocks:
          - type: paragraph
            body: >-
              Fever’s capital position is easier to describe than its cash position. Tracxn records roughly $527 million
              of lifetime funding and a reported $1.8 billion valuation marker for the latest round, while Fever itself
              confirmed more than $100 million of new capital in June 2025. Those facts support the view that investors
              continue to back the company’s strategy. What remains opaque is how much cash remains, what monthly burn
              looks like, whether partner advances or acquisition costs consume working capital, and whether there are
              debt or covenant obligations outside the public record. Cross-border FX complexity also matters materially
              because Corpay’s partnership signals a large international settlement footprint. The DICE acquisition adds
              further uncertainty because the transaction economics were not disclosed. Regulatory obligations on
              pricing and customer outcomes also matter financially because they can require more support staffing,
              clearer disclosures, and faster refund handling in major markets.
