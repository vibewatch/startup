      - number: '7.3'
        title: Dependency, financial, and people risk
        blocks:
          - type: paragraph
            body: >-
              Fever’s next risk layer is dependency complexity. The terms make clear that payments run through
              third-party processors and that organizer economics, fees, and refunds can vary by event. The app-centric
              product surface also relies on mobile distribution, device access, and account recovery to make digital
              tickets usable at the moment of attendance. Cross-border scale adds another layer: Corpay’s 2026
              announcement says Fever chose an exclusive global FX partner because its operations span more than 50
              countries, which is a strong signal that treasury and settlement complexity are now material operating
              concerns. Marquee partnerships with LIV Golf, Formula 1, Sunny Hill Festival, and DICE improve growth and
              credibility, but they also raise implementation, brand, and concentration risk if service quality fails on
              a high-visibility launch. The balance sheet is another unknown. Tracxn shows substantial historical
              funding and a unicorn valuation, yet the public corpus still lacks audited revenue, burn, cash, or
              working-capital disclosure. Finally, the people model itself looks intense: Fever’s own operations-support
              recruiting emphasizes many products and countries, while independent workplace coverage points to nights,
              weekends, and time-zone stretch. That combination can support speed, but it also raises burnout and
              execution risk during peak event periods.
