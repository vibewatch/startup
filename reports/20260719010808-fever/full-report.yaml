  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category logic
        blocks:
          - type: paragraph
            body: >-
              Fever should not be sized against the entire live entertainment economy without adjustment. The official
              product surfaces show a business that curates and distributes access to events and experiences, while
              partner proof shows it also sells ticketing and audience reach to organizers. That means the most accurate
              boundary is not venue ownership, artist management, or promoter gross revenue; it is the digital layer
              that monetizes discovery, ticketing, merchandising, and experiential demand generation. The DICE
              acquisition pushes the company deeper into music-centric ticketing, but it still does not turn Fever into
              the whole live-entertainment stack. Market analysis for Fever therefore needs layered boundaries: a narrow
              ticketing and experience-distribution view for direct monetization, a mid-range ticket-market lens for
              adjacent capture, and a broader live-entertainment ceiling for strategic context only. Using a single
              undifferentiated TAM would overstate what Fever can realistically monetize and hide the importance of
              category mix, buyer type, and cross-border execution.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
