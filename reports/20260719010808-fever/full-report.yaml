      - number: '8.3'
        title: Recommendation, scenarios, and return discipline
        blocks:
          - type: paragraph
            body: >-
              The right recommendation from public evidence is research more / conditional participation. Fever has
              enough proof to stay on the investable list, but not enough disclosure to justify an unconditional buy at
              the last mark. The bull case is attractive: if private revenue is already well above the weaker public
              comps, if EBITDA profitability is durable, and if enterprise ticketing wins like LIV, F1, and
              DICE-adjacent supply turn into repeatable higher-value contracts, the 2025 valuation could look justified
              or even conservative. The base case is less exciting: strong brand and growth persist, but sparse
              disclosure plus support and regulatory risk keep the company valued roughly around its last private round.
              The bear case is that service issues, consumer-protection pressure, or partner concentration combine with
              public-market multiple compression, making the current mark look rich. In that world, investors need
              either a lower entry price, stronger downside protection, or much better private KPI access. Put
              differently: Fever may merit diligence, but it does not yet merit valuation complacency.
