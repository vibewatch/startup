  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape structure and archetypes
        blocks:
          - type: paragraph
            body: >-
              Fever does not compete in a single neatly bounded peer set. It overlaps directly with ticketing and
              discovery platforms such as DICE and Eventbrite, sits adjacent to curated-experiences players such as
              Headout, and competes indirectly with enterprise ticketing infrastructure such as Ticketmaster Business
              and with discovery substitutes such as Resident Advisor and Time Out. That fragmentation matters because
              no one peer captures all of Fever’s business model. Eventbrite is self-service and long-tail. Headout is
              curated and experience-led. DICE is music-first. Ticketmaster is enterprise-heavy. RA and Time Out often
              intercept attention before checkout. Tracxn’s broad competitor list reinforces that Fever operates inside
              a crowded, heterogeneous market, but the practical lesson is that investors must evaluate competition
              segment by segment rather than ask which single company is “the” competitor. It also means a competitor
              can be highly relevant in one workflow and mostly irrelevant in another. Ticketmaster may dominate
              enterprise infrastructure, while Time Out may matter only at discovery, and Headout may matter most where
              tourism or attraction inventory overlaps with Fever’s city curation.
            claimRefs:
