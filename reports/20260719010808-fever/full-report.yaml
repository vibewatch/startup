      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The main diligence gap is not whether Fever can attract customers; it is whether those customers are
              durable and profitable over time. Public evidence shows broad acquisition and a reasonably rich
              post-purchase workflow, but it does not show NRR, GRR, customer churn, organizer renewal, top-customer
              concentration, or contract length. The available proxies are mixed. On the positive side, Apple shows a
              4.8/5 rating from 71K ratings, the business pages reference onboarding, dashboards, and client success
              support, and support articles show the company has built workflows for transfers, missing tickets, and
              urgent contact. On the negative side, independent complaint surfaces repeatedly mention refund friction,
              ticket-visibility failures, and inconsistent service quality. One public complaint explicitly describes a
              QR-confirmed purchase that was not visible in the app until after the event. Even marquee partner proof
              needs nuance: Sunny Hill’s official tickets page routes buyers by geography and does not visibly
              foreground Fever on the accessible page, which suggests partner visibility can vary by market. The correct
              read is that Fever’s customer breadth is real, but retention quality, concentration risk, and service
              resolution performance still require private diligence. The same issue affects the B2B side. Public
              references show that client success, onboarding, and dashboards exist, but they do not show whether
              corporate buyers reorder quarterly, renew annually, or expand wallet share after the first event. For
              underwriting purposes, that means Fever has credible customer acquisition evidence and useful
              service-quality warnings, but still needs private cohort, renewal, and concentration data before customer
              quality can be scored with high conviction.
