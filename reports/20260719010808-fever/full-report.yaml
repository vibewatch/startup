      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The same forces that make Fever attractive also define its constraints. Mobile ticketing and personalized
              discovery are strong demand drivers, as are premium add-ons and the willingness of sports, music, and
              brand-rights owners to outsource ticketing or demand generation. Cross-border operations further expand
              the geographic opportunity, which is why finance and FX infrastructure now matter strategically. But
              growth is not frictionless. Ticket markets face fraud and counterfeit risk, refund disputes damage trust,
              and fee-transparency regulation limits hidden pricing practices. Competition is also structurally diverse:
              enterprise incumbents, self-service platforms, editorial city guides, and community-led music properties
              all compete for different pieces of the journey. Fever’s market opportunity is therefore real, but it is
              not a winner-take-all category. The quality of trust, pricing transparency, and partner economics will
              determine how much of the large top-down market the company can actually capture. That is why later
              chapters should focus less on generic industry CAGR tables and more on how Fever converts those category
              tailwinds into repeat demand and durable partner economics.
