  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      A few core risk nodes—regulatory failure, service failure, and dependency breakage—flow into customer trust,
      margin, and valuation support.
    data:
      nodes:
        - id: reg
          label: Consumer / privacy regulation
          detail: FTC, GDPR, DSA, UK ticketing rules, and contract fairness shape acceptable platform behavior.
          tone: warning
        - id: ops
          label: Support and ticket operations
          detail: >-
            Refunds, missing tickets, outages, and escalation quality determine whether live-event demand converts into
            trust.
          tone: warning
        - id: dep
          label: Partner and platform dependencies
          detail: Payments, app distribution, FX, organizers, and marquee rights-holders create external points of failure.
          tone: warning
        - id: trust
          label: Customer and organizer trust
          detail: Users and partners return only if Fever feels reliable and fair when problems occur.
          tone: warning
        - id: margin
          label: Remediation and compliance cost
          detail: Legal work, refunds, support load, and manual recovery compress margin.
          tone: negative
        - id: valuation
          label: Valuation support
          detail: Residual risk lowers willingness to pay for private growth at a premium.
          tone: negative
      edges:
        - from: reg
          to: ops
        - from: reg
          to: margin
        - from: dep
          to: ops
        - from: dep
          to: trust
        - from: ops
          to: trust
        - from: ops
          to: margin
        - from: trust
          to: valuation
        - from: margin
          to: valuation
    approximationNotes: The graph is qualitative and directional, not a quantified fault tree.
    claimRefs:
      - CR008
      - CR012
      - CR018
      - CR023
      - CR025
      - CR031
      - CR039
      - CR040
      - CR041
      - CR042
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Fever’s dependency surface spans payments, app access, FX management, organizers, and marquee partners; several
      nodes can hurt trust simultaneously.
    data:
      nodes:
        - id: payments
          label: Payment processors
          detail: Process transactions and move funds to organizers.
          tone: warning
        - id: app
          label: App distribution / account access
          detail: Mobile ticket access and recovery depend on app availability and user login.
          tone: warning
        - id: fx
          label: FX and treasury operations
          detail: Cross-border settlement needs specialist management across many countries.
          tone: warning
        - id: organizers
          label: Event organizers / venues
          detail: Underlying event delivery and refund posture originate with organizers.
          tone: warning
        - id: partners
          label: Marquee rights holders
          detail: LIV, F1, Sunny Hill, DICE, and similar partners drive visibility and complexity.
          tone: warning
        - id: support
          label: Support operations
          detail: Human and process layer that resolves failures across all other nodes.
          tone: warning
      edges:
        - from: payments
          to: support
        - from: app
          to: support
        - from: fx
          to: support
        - from: organizers
          to: support
        - from: partners
          to: support
        - from: support
          to: app
        - from: support
          to: organizers
    approximationNotes: Support is shown as the common absorber because many external failures become internal customer-service work.
    claimRefs:
      - CR015
      - CR023
      - CR024
      - CR025
      - CR026
      - CR029
      - CR033
      - CR041
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call flows from real scale and partner proof into a valuation stance that stays conditional because the
      denominator data is missing.
    data:
      nodes:
        - id: a
          label: Global scale and brand proof
          detail: 300M+ monthly interactions, 200k+ experiences, 500+ cities, and visible marquee partners
        - id: b
          label: Economics signal exists
          detail: 2024 EBITDA-positive claim and 20x pre-pandemic revenue growth are positive but still unaudited publicly
        - id: c
          label: Public comps are mixed
          detail: >-
            Eventbrite and Vivid Seats trade far below private-unicorn optics, while Live Nation and CTS Eventim prove
            scale value
        - id: d
          label: Disclosure gap remains wide
          detail: No public audited revenue, take rate, burn, or cohort durability
        - id: e
          label: Valuation stance
          detail: Current mark looks full-to-fair rather than obviously cheap
        - id: f
          label: Recommendation
          detail: Research more / participate only with discount, structure, or stronger private KPI access
      edges:
        - from: a
          to: b
        - from: b
          to: c
        - from: c
          to: d
        - from: d
          to: e
        - from: e
          to: f
    approximationNotes: Flow encodes recommendation logic rather than a process chronology.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV017
      - CV019
      - CV020
      - CV021
      - CV024
      - CV027
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The largest swing factors are private revenue quality, durability of profitability, and whether risk or comp
      compression dominates.
    data:
      items:
        - label: Revenue / GMV disclosed above bullish expectation
          value: 0.4
        - label: Durable EBITDA and cash conversion confirmed
          value: 0.3
        - label: Enterprise partner wins renew and scale
          value: 0.2
        - label: Public-comp discount stays severe
          value: -0.5
        - label: Support / regulatory risk proves worse than expected
          value: -0.4
        - label: Concentration or weak retention emerges
          value: -0.3
    approximationNotes: Values are directional USD-billion valuation deltas versus the base case, not management forecasts.
    claimRefs:
