      - number: '5.2'
        title: Workflow and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The most visible product workflow is app-centric. Users discover experiences, choose dates and ticket
              quantities, apply vouchers, manage or delete payment methods, receive tickets by email, recover missing
              tickets through account-resolution steps, and transfer tickets to friends inside the app. Those steps
              imply an underlying architecture that links discovery, checkout, identity, ticket wallet, payments, order
              reconciliation, and support. On the supply side, partner onboarding shows that Fever also runs a gated
              operating workflow for organizers and rights holders. The result is a two-sided operating model: consumer
              demand on one side and partner inventory plus event operations on the other. Public sources do not reveal
              code-level architecture, but they do reveal enough workflow detail to map the major product layers with
              confidence. It is especially notable that support docs expose several recovery or exception flows. That
              means the technology stack is not only about ideal checkout conversion; it also has to reconcile accounts,
              restore ticket visibility, manage stored payment details, and move ownership between users without
              breaking admission.
