  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and likely mix
        blocks:
          - type: paragraph
            body: >-
              Fever’s public record supports a platform revenue model, but not a clean waterfall of disclosed line
              items. Official product pages show consumer ticketing, exclusive or curated experiences, and app-based
              support; partner onboarding pages show a B2B route where organizers bring inventory and events onto the
              platform. Branded or original formats such as Candlelight, Stranger Things, Bridgerton, and Fever House
              strongly suggest that Fever can monetize more than standard event listing fees. At the same time, no
              retained source gives a standardized schedule of ticket fees, partner take rates, or revenue-share
              mechanics. The right conclusion is that Fever almost certainly has multiple revenue streams, but the mix
              among consumer ticket sales, partner ticketing mandates, branded experiences, and demand-generation
              services remains opaque from public evidence alone. The fact pattern also suggests that revenue
              recognition could be messy in practice: some formats likely behave like marketplace commissions, others
              like co-produced event economics, and others like enterprise ticketing or marketing services. Without
              management definitions, even apparently simple metrics such as GMV or net revenue could conceal meaningful
              mix shifts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
