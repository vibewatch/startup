      - number: '4.2'
        title: Public growth and unit-economics signals
        blocks:
          - type: paragraph
            body: >-
              The strongest financial positive signal is the company’s own June 2025 statement that 2024 was full-year
              EBITDA profitable and represented more than 20x revenue growth from pre-pandemic levels. That is
              directionally powerful evidence that Fever is not merely subsidizing growth indefinitely. The problem is
              that the public record stops there: there is no audited revenue figure, no ARR, no disclosed take rate, no
              gross margin, and no customer-acquisition or payback data. Headcount proxies do show that Fever operates
              at meaningful scale, which implies a large opex base and meaningful support cost. Refund workflows and
              consumer complaints also matter because they can erode gross-to-net revenue and raise service expense. So
              this chapter can support a view of improving economics, but not a clean public model of those economics.
              This matters because a platform can be EBITDA positive for very different reasons, including temporary
              marketing pullbacks, favorable mix, or working-capital timing. Public evidence does not let an outside
              investor separate those possibilities.
