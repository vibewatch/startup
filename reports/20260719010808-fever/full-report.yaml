      - number: '3.4'
        title: Trust, regulation, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in ticketing now depends partly on regulation and customer trust. The FTC’s
              junk-fees rule, CMA scrutiny of secondary ticketing, and broader online-marketplace obligations under the
              DSA all raise the cost of opaque pricing or weak disclosure. Complaint and review sources also show how
              refund handling and support disputes can undermine repeat purchase. Those issues do not mean Fever is
              uniquely weak; they mean the sector itself is trust-sensitive. Public competitors with deeper disclosure,
              such as Eventbrite, enjoy an advantage in transparency even if they do not win every product comparison.
              Private Fever may still be strategically better positioned in exclusives and branded experiences, but
              outside investors have less visibility into pricing, partner concentration, and retention than they would
              have with public comps. That transparency gap can itself become a competitive disadvantage in financing or
              diligence settings, even if end users do not directly perceive it.
            claimRefs:
              - CP024
              - CP025
              - CP026
              - CP027
              - CP030
              - CP033
              - CP034
              - CP035
