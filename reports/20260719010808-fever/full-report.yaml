      - number: '7.4'
        title: Mitigation posture and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Fever is not unmanaged. The company has visible mitigations: legal notices, support intake,
              ticket-transfer tools, partner-screening, an incident section, and specialist partners such as Corpay.
              Those all reduce first-order risk. But the residual question for investors is whether the controls are
              proportionate to the scale claimed. The public record is still much better at proving that Fever can grow
              and sign partners than at proving it can keep regulatory, service, and concentration risk within
              predictable bounds. That means the investment call should remain contingent on private evidence.
              Specifically, investors need to see compliance workflows for fee disclosure and refunds, complaint and
              incident dashboards, organizer and enterprise renewal data, and concentration by partner, event family,
              and geography. Absent that, the correct approach is to define clear kill criteria: an enforcement action
              tied to pricing or privacy, a measurable rise in ticket-delivery failures or refund delays, a failed
              marquee launch, or evidence that a small number of partners drive a disproportionate share of GMV. Those
              are monitorable triggers that can break the thesis even if top-line reach remains impressive.
            claimRefs:
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
