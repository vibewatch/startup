      - number: '3.3'
        title: Switching costs, rights access, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive advantage Fever can plausibly claim is not discovery software alone. Discovery
              is easy to multi-home: users can browse Fever, Time Out, RA, Eventbrite, Ticketmaster, or social feeds
              with low switching cost. The moat gets stronger only when Fever controls exclusive inventory, branded
              formats, or integrated partner relationships that are hard to replicate quickly. That is why the DICE
              acquisition matters strategically: it expands Fever’s footprint with venues, promoters, and artists and
              gives it more embedded music distribution. Ticketmaster still looks stronger in enterprise infrastructure,
              but Fever can be stronger where rights access, curation, and consumer demand generation intersect. The
              weakness is that those advantages are harder to measure publicly than consumer-app traffic or
              public-company revenue. Public disclosure remains sparse. for investors.
