  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Fever’s public materials describe a broader product than a normal events list or ticket wallet. The
              homepage, support article, and app-store descriptions show curated discovery, exclusive experiences,
              account-based ticketing, Favorites, Fever Club, ticket transfer, voucher redemption, payment-method
              management, and continuous support. That means the core product should be treated as a consumer
              discovery-and-transaction platform with multiple reinforcing modules, not just a feed of events. On top of
              that core, Fever has visible product lines such as Candlelight, Stranger Things, Bridgerton, and festival
              activations like Fever House, which function as branded or original content modules. This is important for
              later chapters because it suggests the company’s moat depends partly on formats and inventory design, not
              only on software utility. The product is also unusually modular for a consumer entertainment brand:
              loyalty, vouchers, account management, and partner intake all show up in separate public docs. That
              breadth suggests product management attention on retention and operational convenience, not just on
              top-of-funnel discovery.
