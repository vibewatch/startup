        title: Sizing lenses and comparability discipline
        blocks:
          - type: paragraph
            body: >-
              The retained market sources describe materially different universes. The narrowest and most directly
              relevant lens is online event ticketing at roughly $88.38 billion in 2026, because it captures digital
              ticket discovery and checkout. A slightly broader ticket-market view comes in around $90.23 billion and
              includes more ticket formats and use cases. The live-entertainment lens from 360iResearch is much larger
              at about $239.47 billion, while Gitnux’s $1.2 trillion annual live-entertainment figure is broader still
              and should be treated as an outer context ceiling, not as Fever’s direct SAM. Coherent’s nearly $490
              billion U.S. live-events estimate is useful for showing just how large the underlying activity pool is,
              but its geography and category boundary make it a poor stand-alone proxy for Fever’s monetizable base. The
              right takeaway is that Fever’s addressable market is clearly large, but credible underwriting depends on
              boundary logic, not on selecting the highest available number.
