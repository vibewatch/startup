            body: >-
              The strongest post-cutoff unicorn evidence is the June 2025 funding event. Fever’s own release confirms
              more than $100 million from L Catterton and Point72, while Tracxn records the same round at a $1.8 billion
              post-money valuation and lifts lifetime funding to roughly $527 million. The 2022 and 2023 rounds explain
              how Fever moved from a $1 billion valuation marker to a late-stage private company with a large global
