      - number: '1.3'
        title: Scale, partnerships, and milestone trajectory
        blocks:
          - type: paragraph
            body: >-
              Fever’s scale claims are impressive but need metric hygiene. The homepage advertises more than 150,000
              experiences in over 200 major cities across 30-plus countries; the newsroom says over 300 million people
              were inspired last year across 40-plus countries; support materials say the community exceeds 125 million
              and is present in over 100 large cities; Corpay says operations now span more than 50 countries. These are
              not identical counts, but they can coexist because they measure different layers of the system: catalog
              breadth, city footprint, annual reach, registered community, and operational geography. Partnerships also
              matter because they show the commercial surface area of the platform. Fever now sits inside large cultural
              and sports ecosystems including Primavera Sound, Real Madrid, FC Barcelona, LIV Golf, X Games, and
              Corpay’s FX stack. The DICE acquisition further extends this logic into music-first ticketing, venue
              relationships, and artist-promoter workflows.
