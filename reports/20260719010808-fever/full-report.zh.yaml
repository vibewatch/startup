      - number: '6.2'
        title: 具名证据与采用信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户证据来自宽度加头部名称，而不是带合同结果的干净案例库。Fever 商业首页声称每月 300M+ 互动、200k+ 体验，并在 30+ 国家、500+ 城市运营；较旧的支持文案仍提到 125M+
              全球社区和 100+ 城市。这种不一致并非致命，但说明不同公司页面对规模的描述不同。更重要的是，Fever 现在有多个超越泛泛 logo 的具名证明。公司称已有 1,000 多家企业使用 Fever for
              Business 形式，包括 Meta、MGM Resorts、Pfizer、Accenture 和 Kiko Milano。专门的 Fever for Business 页面还加入精选推荐语，包括
              Travelzoo、Genius Partners、Accor Live Limitless 和具名活动赞助商。在合作伙伴侧，LIV Golf 选择 Fever 作为 2026 赛季 14
              场赛事的全球票务和需求生成伙伴，Sunny Hill Festival 指定 Fever 为 2026 年国际票务伙伴，Formula 1 选择 Fever 作为新 F1.com 票务平台的官方供应商，并从
              2027 年开始。这一组合强烈说明，企业和主办方采用真实存在，即便每个 logo 的收入产出仍然私有。
