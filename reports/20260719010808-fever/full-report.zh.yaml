            body: >-
              在保留记录中，Eventbrite 提供了最清晰的公开基准。它有透明 SEC 文件、可见收入线，相对于宽泛票务市场叙事而言公开市值不高。相比之下，Fever
              有更强的私募市场动能和更宽的独家体验叙事，但公开可比性显著更弱。这不说明 Fever 财务弱；它说明财务质量更难核验。当前最佳结论因此是平衡的：Fever
              看起来有可信规模、多条变现路径，以及足以继续扩张的投资人支持，但公开证据仍太薄，无法高置信度承销收入质量、烧钱速度、现金跑道或收购后整合经济性。换句话说，当前公开档案支持“可融资且有前景”的结论，但不支持“已完整尽调且可精确建模”的结论。
