      - number: '8.3'
        title: 建议、情景与回报纪律
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，合理建议是继续研究 / 有条件参与。Fever 有足够证据留在可投资名单上，但披露还不够支撑按上一轮定价无条件买入。乐观情景有吸引力：如果私下收入已经显著高于更弱的公开可比公司，如果 EBITDA
              盈利能持续，如果 LIV、F1 以及 DICE 周边供给等企业票务项目能沉淀成可复制的高价值合同，2025
              年估值可能算合理，甚至偏保守。基准情景没那么兴奋：品牌和增长继续强，但披露稀疏，加上客服和监管风险，让公司估值大致停留在上一轮私募融资附近。悲观情景是，服务问题、消费者保护压力或合作伙伴集中，与公开市场倍数压缩叠加，让当前估值显得偏贵。在那个情形下，投资人需要更低进入价格、更强下行保护，或显著更好的私有
              KPI 数据访问权限。换句话说：Fever 值得尽调，但还不值得对估值掉以轻心。
