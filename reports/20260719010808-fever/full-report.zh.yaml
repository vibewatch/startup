  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Fever 并不只卖给一种客户原型。公开记录指向一个宽泛的多边模型：一侧是消费者购票者，另一侧是主办方和场馆侧供给伙伴，中间还有越来越明确的 B2B
              买家层。消费者界面仍是核心需求引擎：应用商店列表、支持页面和商业首页，都把 Fever
              定位为面向本地现场体验的发现与预订产品。但业务界面也重要，因为它们说明还有谁在付钱。票务首页面向活动推广方、景点、剧院、体育运营方和现场演出卖家。团体预订页面加入学校、旅行社和企业异地团建。Fever for
              Business 则把雇主、客户招待团队和福利经理纳入买家，而员工、客户和合作伙伴成为所购体验的终端用户。这种分层对尽调重要，因为 Fever
              不只是消费者市场；它也是一个票务、需求生成和体验式销售平台，拥有多类付款方和多条扩张路径。
