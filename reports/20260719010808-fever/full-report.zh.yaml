      - number: '4.2'
        title: 公开增长与单位经济性信号
        blocks:
          - type: paragraph
            body: >-
              最强的财务正面信号，是公司自己在 2025 年 6 月声明：2024 年全年 EBITDA 盈利，并且收入较疫情前水平增长超过 20x。这是方向上很有力的证据，说明 Fever
              不只是无限期补贴增长。问题在于，公开记录到此为止：没有经审计收入数字，没有 ARR，没有披露抽佣率，没有毛利率，也没有获客成本或回本数据。员工数代理显示 Fever 已在有意义的规模上运营，这意味着庞大的
              opex
              基础和可观支持成本。退款工作流和消费者投诉同样重要，因为它们会侵蚀总收入到净收入的转化，并抬高服务费用。因此，本章可以支持经济性改善的判断，但不能建立一套干净的公开经济性模型。原因在于，平台可能因为非常不同的原因实现
              EBITDA 盈利，包括临时收缩营销、有利组合或营运资本时点。公开证据无法让外部投资者拆分这些可能性。
