      - number: '8.2'
        title: 可比框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司支持谨慎，而不是给空白支票式增长溢价。Eventbrite 退市前最后一次公开市值读数仅约 $453M，此前经历多年持续下跌，显示公开市场会多么残酷地折价规模不足或信心较低的票务平台。Vivid
              Seats 更严厉：其 2026 年 3 月业绩显示 2025 年收入 $570.8M，但 2026 年 7 月市值在严重回撤后只有约 $77.9M。另一个极端是 Live Nation 和 CTS
              Eventim，它们证明规模化票务可以支撑非常大的公开价值，但这些都是成熟既有玩家，有经审计财务、大量交易量和更透明经济性。Live Nation 市值约 $41.9B，票务吞吐量巨大；CTS Eventim
              2025 年收入超过 €3B，并保持强票务利润率后，市值约 $6.2B。因此，Fever 的 $1.8B
              标记处在一个尴尬中间地带：远高于受困或被冷落的公开市场型平台，但仍远低于主导型既有玩家。没有披露收入分母时，这个中间地带定价应被视为可能合理，但并不明显便宜。
