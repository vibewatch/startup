      - number: '8.4'
        title: 最终尽调问题与推翻投资逻辑的信号
        blocks:
          - type: paragraph
            body: >-
              投委会应把 Fever 视为高质量但披露不完整的资产。最重要的缺失输入并不抽象，正是判断 $1.8B 是否有吸引力所需的变量：滚动收入、城市和细分业务组合、抽佣率、EBITDA
              和现金转化、客户复购、主办方与企业留存、客服负担，以及按合作伙伴或活动家族划分的集中度。上述指标会立刻告诉投资人，Fever
              更接近一家高溢价、已盈利的规模化平台，还是更接近一家高增长市场平台、仍应给出大幅公开可比折价。在此之前，投资逻辑应继续对价格和事件保持敏感。任何费用披露或退款方面的监管行动、投诉强度恶化、标杆合作伙伴上线失败，或用户队列耐久性偏弱的证据，都可能很快伤到投资逻辑。反过来，经过审计且能证明盈利可持续、复购健康、集中度有限的证据，可能把建议上调。结论因此是克制而不是戏剧化：只有在更深入尽调、相对上一轮定价有折价，或交易结构能补偿剩余不确定性时才推进。
