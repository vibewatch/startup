      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              比起品牌对比，功能对比更能说明问题。Fever 的公开差异化依赖精选发现、独家或品牌化库存、沉浸式形式，以及移动端购后托管流程。Eventbrite 强调开放创建和自助票务；Headout
              强调最优价格的精选旅行和景点；DICE 突出预先定价和相关推荐；Ticketmaster 强调运营方解决方案和票房规模；Resident Advisor 与 Time Out
              则靠社区或编辑能力赢得发现，而不是靠全栈票务护城河。定价是整个集合里最不透明的区域：保留来源给出了定位语言，但没有可比抽佣率或费用表。这种不透明意味着，定价权和单位经济性应被视为未解决的尽调问题，而不是任何单一玩家已经证明的优势。因此，竞争问题不只是看谁有更多列表或更大品牌，而是看谁能赢下每个细分场景所需的精选、权利获取、结账信任和运营方经济性的精确组合。
