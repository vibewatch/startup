  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与价格背景
        blocks:
          - type: paragraph
            body: >-
              Fever 的正向投资逻辑很直接：公司拥有可信全球规模、独特的体验与票务品牌、可见的 B2C 和 B2B 界面、头部合作伙伴胜利，以及一轮在 2025 年重申独角兽地位的融资。公开证据现在覆盖商业网站上的
              300M+ 月互动、200k+ 体验、30+ 国家 500+ 城市、1,000 多个企业活动客户，以及与 LIV Golf、Formula 1、Sunny Hill Festival 和 DICE
              的高可见度关系。与管理层相关的来源还声称，收入较疫情前增长 20x，并在 2024 年实现全年 EBITDA 盈利。这很强。问题在于价格纪律。Fever 最新公开估值标记约
              $1.8B，而公开语料仍未披露经审计收入、现金、烧钱速度、抽佣率、复购或集中度。这意味着公司可能很好，但用当前公开数据为上一轮价格买单，论证仍不完整。因此，关键估值问题不是 Fever
              是否令人印象深刻；而是在没有私有 KPI 访问权时，独角兽估值下是否还剩足够上行空间。
