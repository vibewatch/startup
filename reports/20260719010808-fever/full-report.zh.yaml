  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >-
              不能不加调整地把 Fever
              放进整个现场娱乐经济里估算规模。官方产品页面显示，公司精选并分发活动与体验的入场权限；合作伙伴证据则显示，它也向主办方出售票务和受众触达。因此，最准确的边界不是场馆所有权、艺人管理或推广方总收入，而是把活动发现、票务、商品销售和体验式需求生成变现的数字层。DICE
              收购让公司更深入音乐中心的票务，但仍不会把 Fever 变成完整现场娱乐栈。分析 Fever
              的市场，需要分层设边界：直接变现看狭义票务和体验分发；相邻捕获看中等口径票务市场；更宽的现场娱乐天花板只作为战略背景。单一、不区分层次的总可用市场（TAM）会夸大 Fever
              能现实变现的部分，也会掩盖品类组合、买家类型和跨境执行的重要性。
