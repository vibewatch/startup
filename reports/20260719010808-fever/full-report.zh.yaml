  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入规模显著高于较弱公开可比公司，2024 年 EBITDA 盈利延续，企业和伙伴签约累积成耐久合同
        - 公允价值上移至大约 $2.0B-$2.7B；若执行继续干净，上轮估值仍可能有上行
        - 监管或客服失败打断溢价叙事
        - 有可能，但需要私有 KPI 证明
      - - 基准
        - 品牌、触达和增长仍强，但披露仍不完整，风险只是可控而非已解决
        - 公允价值集中在约 $1.4B-$1.95B；当前估值位于可支撑区间上半部
        - 倍数压缩和披露稀疏限制重估
        - 最能被公开证据支撑
      - - 悲观
        - 服务摩擦、消费者保护压力或伙伴集中度叠加公开市场谨慎
        - 公允价值压缩至 $0.9B-$1.35B 附近，使 2025 年估值显得偏贵
        - 队列耐久性弱或执法行动浮出水面
        - 没有私有尽调无法排除
    notes: 情景区间是以十亿美元计的企业价值粗略判断，不是伪精确模型。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Fever（最新私有估值）
        - 私募融资参照
        - 2025 年 6 月 >$100M 融资对应 ~$1.8B 估值
        - 确定投资者必须评估的实际价格背景
        - 没有公开审计收入或利润率分母
      - - Eventbrite
        - 公开市场价值
        - 2026 年退市 / 被收购前最后公开市值约 ~$0.45B
        - 显示公开市场对较小型活动票务平台可以多严苛
        - 成熟度、业务组合和公开市场背景不同
      - - Live Nation / Ticketmaster
        - 公开市场价值和票务规模
        - 市值约 ~$41.9B；2026 年 Q1 收费票券 81M 张，票务递延收入 $368M
        - 上沿证明：票务规模化后能支撑很大价值
        - 比 Fever 多元、成熟且主导得多
      - - Vivid Seats
        - 公开市场价值对比披露收入
        - 尽管 2025 年收入 $570.8M、盈利能力弱，市值约 ~$77.9M
        - 显示公开投资者不信任耐久性或经济性时的下行
        - 偏二级市场，模式不同
      - - CTS Eventim
        - 公开市场价值和收入基础
        - 2025 年收入 €3.079B 且票务利润率强，市值约 ~$6.2B
        - 相比 Live Nation，这家欧洲老牌公司更接近 Fever 的地域组合和平台逻辑
        - 成熟得多、规模更大，且经过完整审计
    notes: 可比行用于框定估值想象空间；在没有收入披露时，不是为 Fever 主张精确倍数。
    enumerationScope:
      coverage: sample
      basis: >-
        This sample uses the most decision-relevant public ticketing comps retrieved during the run; it is not a full
        universe of every consumer-experiences or live-events platform.
    claimRefs:
      - CV001
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 投资逻辑破坏和否决触发信号表
    columns:
      - 触发信号
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 消费者保护执法
        - 任何针对费用披露、退款或欺骗性票务做法的正式行动
        - 挑战核心结账信任，并可能迫使利润率稀释型补救
        - 暂停或放弃，直到法律和产品补救完成复核
      - - 支持 / 票务恶化
        - 未解决票券、退款或入场失败明显激增
        - 直接打击复购、主办方信任和品牌资产
        - 下调估值区间，并要求运营数据
      - - 伙伴集中度冲击
        - 头部权利方伙伴关系流失或表现不及预期
        - 削弱增长可选性，并暴露隐藏集中度
        - 下调乐观情景概率
      - - 私有经济性偏弱
        - 收入、EBITDA 或现金转换显著低于预期
        - 显示当前估值相对公开可比公司过于激进
        - 要求远低于上轮的折价，否则拒绝
      - - 留存不及预期
        - 复购低，或主办方 / 企业续约队列表现差
        - 把规模变成低质量量级，而不是耐久经济性
        - 转向悲观区间
      - - 监管 / 隐私事件
        - 重大 DPA 投诉、传输问题或公开泄露
        - 提高风险折价和未来合规成本
        - 立即重新评估投资案例
    notes: 每个触发信号都设计得足够具体，便于 IC 在初始尽调后监控。
    claimRefs:
      - CV026
      - CV028
      - CV029
      - CV037
      - CV038
      - CV041
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和 GMV
        - 过去十二个月收入、GMV、抽佣率和城市结构
        - 没有分母，私有估值无法干净对标
        - 财务尽调请求 / 管理层数据室
      - - 盈利质量
        - EBITDA 调节表、现金转换和营运资本表现
        - 检验 2024 年盈利是否耐久，还是会计口径偏轻
        - 财务和会计尽调
      - - 客户耐久性
        - 复购、队列留存、主办方续约、企业续约
        - 区分真实平台耐久性和一次性热度周期
        - 增长 / 收入运营尽调
      - - 集中度
        - 头部伙伴、头部活动系列、头部地域和 DICE 贡献
        - 判断头部胜利是否掩盖过高集中度
        - 商业尽调和董事会材料
      - - 支持负担
        - 退款率、事件量、SLA 指标和票券失败率
        - 量化运营风险是可管理，还是会摧毁利润率
        - 运营尽调
      - - 监管合规
        - 结账截图、费用披露逻辑、隐私工作流、DSR 日志
        - 检验已知法律风险是否被主动控制
        - 法务 / 产品尽调
    notes: 如果管理层不能及时提供这些材料，这本身就应降低对当前价格的信心。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV028
      - CV039
      - CV043
