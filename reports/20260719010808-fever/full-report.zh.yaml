  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Fever 的风险栈从一个事实开始：它直接嵌在受监管的票务和消费者商业流程中。当前条款和支持界面显示，这是一个跨境平台，处理发现、支付、客服、退款、代金券以及与合作伙伴的数据共享。这让 Fever
              同时落入多个现行法律制度。在美国，FTC 垃圾费用规则现在明确覆盖现场活动票务企业和第三方平台，包括移动 app 和 B2B 交易。在英国，CMA 长期二级票务执法历史以及 Digital Markets,
              Competition and Consumers Act，继续给透明度和消费者待遇施压。在欧盟，Digital Services Act 和 GDPR 增加了市场、透明度、权利处理和国际传输义务。Fever
              自身条款通过把活动履约责任推向主办方并使用仲裁，部分缓释了风险；但如果定价、退款或数据处理在实践中失手，这些条款无法消除品牌、执法或客户信任风险。
