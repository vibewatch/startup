      - number: '7.3'
        title: 依赖、财务与人员风险
        blocks:
          - type: paragraph
            body: >-
              Fever 下一层风险是依赖复杂度。条款明确显示，支付通过第三方处理器运行，主办方经济性、费用和退款可能因活动而异。以 app
              为中心的产品界面还依赖移动分发、设备访问和账户恢复，才能让数字票在入场时可用。跨境规模又加一层：Corpay 2026 年公告称，Fever 选择独家全球 FX 伙伴，因为其运营跨越 50
              多个国家。这是一个强信号，说明资金管理和结算复杂度现在已是重大运营议题。与 LIV Golf、Formula 1、Sunny Hill Festival 和 DICE
              的头部合作提高了增长和可信度，但如果高可见度上线时服务质量失效，也会抬高实施、品牌和集中度风险。资产负债表是另一个未知数。Tracxn
              显示可观历史融资和独角兽估值，但公开语料仍缺少经审计收入、烧钱速度、现金或营运资本披露。最后，人员模型本身看起来强度很高：Fever
              自己的运营支持招聘强调多产品和多国家，而独立职场报道指向夜间、周末和跨时区拉伸。这种组合可以支撑速度，但也会在活动高峰期抬高倦怠和执行风险。
