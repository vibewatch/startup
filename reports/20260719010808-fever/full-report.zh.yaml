              Fever 的资本位置比现金位置更容易描述。Tracxn 记录累计融资约 $527 million，最新一轮据报估值锚点为 $1.8 billion；Fever 自己也确认 2025 年 6 月获得超过 $100
              million 新资本。这些事实支持投资者仍在支持公司战略的判断。仍不透明的是现金还剩多少、月度烧钱速度如何、合作伙伴预付款或收购成本是否吞噬营运资本，以及公开记录之外是否存在债务或契约义务。跨境 FX
              复杂度也很关键，因为 Corpay 合作表明公司有庞大的国际结算足迹。DICE
              收购增加了进一步不确定性，因为交易经济性没有披露。围绕定价和客户结果的监管义务也会产生财务影响，因为它们可能要求主要市场投入更多支持人员、更清晰披露和更快退款处理。
