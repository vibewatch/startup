companyProfile:
  summary: >-
    Fever 是一家源自马德里、成立于 2014 年的现场娱乐科技公司，如今把消费者活动发现、票务、供给侧合作伙伴与分发工具，以及 B2B
    体验式产品组合在一起。公开证据显示，它已经有庞大全球足迹、优质权利方关系，并且音乐、体育和原创体验的组合正在扩大。公司据报在 2025 年 6 月完成一轮 $100M+ 融资，估值约 $1.8B，并称 2024 年仍保持
    EBITDA 盈利，同时收入较疫情前增长超过 20x。DICE 合并以及与 LIV Golf、Formula 1 的新合作，让 Fever 不再只是城市活动 app，而是更宽的票务与需求生成平台。
