      - number: '6.3'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              主要尽调缺口不是 Fever
              能否吸引客户，而是这些客户能否长期留存并盈利。公开证据显示，公司获取面很广，购后工作流也相当丰富，但没有展示净留存率（NRR）、总留存率（GRR）、客户流失、主办方续约、头部客户集中度或合同期限。现有代理指标好坏参半。正面看，Apple
              显示 71K 个评分给出
              4.8/5，业务页面提到入驻、仪表盘和客户成功支持，支持文章显示公司已为转票、缺失票券和紧急联系搭建工作流。负面看，独立投诉页面反复提到退款摩擦、票券可见性失败和服务质量不一致。一条公开投诉明确描述了一次 QR
              确认的购买，直到活动结束后才在 app 中可见。即便头部合作伙伴证据也需要细读：Sunny Hill 的官方购票页按地理位置分流买家，在可访问页面上没有明显突出
              Fever，说明合作伙伴可见度会因市场而异。正确读法是，Fever 的客户宽度真实存在，但留存质量、集中度风险和服务解决表现仍需要私有尽调。同一问题也影响 B2B
              侧。公开引用显示客户成功、入驻和仪表盘存在，但没有显示企业买家是否按季度复购、按年续约，或在第一场活动后扩大钱包份额。承销时，这意味着 Fever
              有可信的获客证据和有用的服务质量警示，但在高确信度评价客户质量前，仍需要私有队列、续约和集中度数据。
