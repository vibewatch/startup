      - number: '1.4'
        title: 反向信号与第一章待解问题
        blocks:
          - type: paragraph
            body: >-
              公开记录里最大的弱点不是缺少增长野心，而是衡量和披露精度不足。运营叙事很强，但 Fever
              自身的月活用户没有公开钉住，经审计收入缺失，资本结构细节也未披露。第一章已经能看到普通但重要的平台风险：投诉聚合网站显示退款和验票摩擦，条款包含仲裁和集体诉讼豁免，可以削弱但不能消除消费者争议风险。最后，第三方公司目录噪音很大：Tracxn
              和 LeadIQ 指向数千名员工，而 Craft 仍显示一个过时且明显低估的档案。这些不一致不会否定 Fever
              的独角兽状态，但会降低仅靠公开网页证据搭建任何精确运营或财务模型的信心。还有一个实际含义：后续章节不应不加批判地复用目录数字，而应复用本章的规范融资和规模标记，只有在新增证据明确提供不同视角或实质更新时才叠加进去。
