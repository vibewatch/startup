      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              吸引 Fever 的同一批力量，也定义了它的约束。移动票务和个性化发现是强需求驱动，优质附加项以及体育、音乐和品牌权利方把票务或需求生成外包的意愿也是如此。跨境运营进一步放大地理机会，这也是金融和 FX
              基础设施如今具有战略意义的原因。但增长并非无摩擦。票务市场面临欺诈和假票风险，退款争议会伤害信任，费用透明监管会限制隐藏定价。竞争结构也很多元：企业级既有玩家、自助服务平台、编辑型城市指南和社区驱动的音乐资产，都在旅程的不同环节竞争。因此，Fever
              的市场机会真实存在，但不是赢家通吃品类。信任质量、定价透明度和合作伙伴经济性，将决定公司到底能捕获多少自上而下的大市场。这也是后续章节应少看通用行业 CAGR 表、多看 Fever
              如何把品类顺风转化为复购需求和耐久合作伙伴经济性的原因。
