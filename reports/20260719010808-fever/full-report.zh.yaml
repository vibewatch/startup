        title: 信任、监管与竞争风险
        blocks:
          - type: paragraph
            body: >-
              票务竞争的耐久性现在部分取决于监管和客户信任。FTC 垃圾费用规则、CMA 对二级票务的审查，以及 DSA
              下更广泛的在线市场义务，都会提高不透明定价或弱披露的成本。投诉和评价来源也显示，退款处理和支持争议会削弱复购。这些问题不意味着 Fever 独特地弱；它们说明行业本身对信任敏感。Eventbrite
              这类披露更深的公开竞争对手，即便并不赢下每一次产品对比，也享有透明度优势。私营的 Fever
              在独家和品牌体验上仍可能战略位置更好，但外部投资者看到的定价、合作伙伴集中度和留存，比他们看公开可比公司时少。这种透明度缺口本身可能在融资或尽调场景里变成竞争劣势，即便终端用户不会直接感知。
            claimRefs:
              - CP024
