      - CR018
      - CR025
      - CR034
      - CR039
      - CR040
      - CR041
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 少数核心风险节点——监管失误、服务失效和依赖断裂——会传导到客户信任、利润率和估值支撑。
    data:
      nodes:
        - id: reg
          label: 消费者 / 隐私监管
          detail: FTC、GDPR、DSA、英国票务规则和合同公平性共同界定平台可接受的行为边界。
          tone: warning
        - id: ops
          label: 支持与票务运营
          detail: 退款、门票遗失、宕机和升级处理质量，决定现场活动需求能否转成信任。
          tone: warning
        - id: dep
          label: 合作伙伴和平台依赖
          detail: 支付、App 分发、外汇、主办方和头部权益方都会形成外部故障点。
          tone: warning
        - id: trust
          label: 客户和主办方信任
          detail: 只有 Fever 在出问题时显得可靠且公平，用户和合作伙伴才会回来。
          tone: warning
        - id: margin
          label: 补救和合规成本
          detail: 法务、退款、支持负荷和手工找回都会挤压利润率。
          tone: negative
        - id: valuation
          label: 估值支撑
          detail: 剩余风险会降低投资人为高溢价私有增长付费的意愿。
          tone: negative
      edges:
        - from: reg
          to: ops
        - from: reg
          to: margin
        - from: dep
          to: ops
        - from: dep
          to: trust
        - from: ops
          to: trust
        - from: ops
          to: margin
        - from: trust
          to: valuation
        - from: margin
          to: valuation
    approximationNotes: 这张图是定性、方向性的，不是量化故障树。
    claimRefs:
      - CR008
      - CR012
      - CR018
      - CR023
      - CR025
      - CR031
      - CR039
      - CR040
      - CR041
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Fever 的依赖面覆盖支付、App 访问、外汇管理、主办方和头部合作伙伴；多个节点可同时伤害信任。
    data:
      nodes:
        - id: payments
          label: 支付处理机构
          detail: 处理交易，并把资金划转给主办方。
          tone: warning
        - id: app
          label: App 分发 / 账户访问
          detail: 移动端门票访问和找回依赖 App 可用性和用户登录。
          tone: warning
        - id: fx
          label: 外汇和资金运营
          detail: 跨境结算需要在多个国家做专业化管理。
          tone: warning
        - id: organizers
          label: 活动主办方 / 场馆
          detail: 底层活动交付和退款态度来自主办方。
          tone: warning
        - id: partners
          label: 头部权益方
          detail: LIV、F1、Sunny Hill、DICE 及类似合作伙伴带来可见度，也增加复杂度。
          tone: warning
        - id: support
          label: 支持运营
          detail: 人和流程层，负责解决所有其他节点上的故障。
          tone: warning
      edges:
        - from: payments
          to: support
        - from: app
          to: support
        - from: fx
          to: support
        - from: organizers
          to: support
        - from: partners
          to: support
        - from: support
          to: app
        - from: support
          to: organizers
    approximationNotes: 支持被画成共同吸收层，因为许多外部故障最终都会变成内部客服工作。
    claimRefs:
      - CR015
      - CR023
      - CR024
      - CR025
      - CR026
      - CR029
      - CR033
      - CR041
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 真实规模和合作伙伴证据推导出估值立场，但由于分母数据缺失，结论仍有条件。
    data:
      nodes:
        - id: a
          label: 全球规模和品牌证据
          detail: 每月 300M+ 次互动、200k+ 个体验、500+ 个城市，以及可见的头部合作伙伴
        - id: b
          label: 经济性信号存在
          detail: 2024 年 EBITDA 转正主张和疫情前收入增长 20x 是正面信号，但公开层面仍未审计
        - id: c
          label: 公开可比公司信号混杂
          detail: Eventbrite 和 Vivid Seats 的交易估值远低于私有独角兽观感，而 Live Nation 和 CTS Eventim 证明规模有价值
        - id: d
          label: 披露缺口仍大
          detail: 未公开经审计收入、抽成率、烧钱速度或队列持续性
        - id: e
          label: 估值立场
          detail: 当前标记估值看起来偏满到合理，而不是明显便宜
        - id: f
          label: 建议
          detail: 继续研究 / 仅在有折扣、结构保护或更充分私有 KPI 访问时参与
      edges:
        - from: a
          to: b
        - from: b
          to: c
        - from: c
          to: d
        - from: d
          to: e
        - from: e
          to: f
    approximationNotes: 图中表达的是建议逻辑，而不是流程时间线。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV017
      - CV019
      - CV020
      - CV021
      - CV024
      - CV027
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 摆动最大的因素，是私有收入质量、盈利持续性，以及最终由风险还是公开可比公司压缩主导。
    data:
      items:
        - label: 收入 / 商品交易总额（GMV）披露高于乐观情景预期
          value: 0.4
        - label: 持续 EBITDA 和现金转化得到确认
          value: 0.3
        - label: 企业合作伙伴胜单续约并扩大规模
          value: 0.2
        - label: 公开可比公司折价仍重
          value: -0.5
        - label: 支持 / 监管风险证实比预期更糟
          value: -0.4
        - label: 出现集中度或弱留存
          value: -0.3
    approximationNotes: 数值是相对于基准情景、以 USD 十亿美元计的方向性估值变化，不是管理层预测。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽的估值带；最新标记估值位于基准情景上半区，而不是明显便宜区间。
    data:
      items:
        - label: 悲观
          low: 0.9
          mid: 1.15
          high: 1.35
        - label: 基准
          low: 1.4
          mid: 1.7
          high: 1.95
        - label: 乐观
          low: 2
          mid: 2.35
          high: 2.7
    approximationNotes: 数值是基于情景逻辑和公开可比公司框架得出的宽泛企业价值区间，以 USD 十亿美元计，不是 DCF。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Fever 在规模和合作伙伴证据上得分较好，但披露质量和当前估值吸引力偏弱。
    data:
      items:
        - label: 规模证据
          value: 8
        - label: 增长 / 需求信号
          value: 7
        - label: 合作伙伴 / 客户证据
          value: 8
        - label: 披露质量
          value: 3
        - label: 经济性可见度
          value: 4
        - label: 当前估值吸引力
          value: 4
        - label: 剩余风险负荷
          value: 4
    approximationNotes: 分数是 0-10 的序位尽调判断，由保留证据综合得出。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV012
      - CV014
      - CV024
      - CV039
      - CV040
      - CV041
