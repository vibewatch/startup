      - number: '2.2'
        title: 规模测算视角与可比性纪律
        blocks:
          - type: paragraph
            body: >-
              保留的市场来源描述的是实质不同的市场宇宙。最窄、也最直接相关的视角是在线活动票务，2026 年约 $88.38 billion，因为它覆盖数字化购票发现和结账。稍宽的票务市场视角约 $90.23
              billion，纳入更多票种和用例。360iResearch 的现场娱乐视角大得多，约 $239.47 billion；Gitnux 的 $1.2 trillion
              年度现场娱乐数字更宽，只应作为外部背景天花板，而不是 Fever 的直接可服务市场（SAM）。Coherent 对美国现场活动近 $490 billion
              的估计，有助于说明底层活动池有多大，但其地理和品类边界让它不适合作为 Fever 可变现基础的独立代理。正确结论是，Fever 的可服务市场显然很大，但可信承销靠边界逻辑，不靠挑最高数字。
