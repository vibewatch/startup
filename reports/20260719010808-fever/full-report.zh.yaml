  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与可能组合
        blocks:
          - type: paragraph
            body: >-
              Fever 的公开记录支持平台收入模式，但没有披露科目的清晰瀑布。官方产品页显示消费者票务、独家或精选体验，以及基于 app 的支持；合作伙伴入驻页显示一条 B2B
              路径，主办方把库存和活动带到平台。Candlelight、Stranger Things、Bridgerton、Fever House 等品牌化或原创形式强烈暗示，Fever
              的变现不止标准活动上架费。与此同时，保留来源没有给出标准化票务费用、合作伙伴抽佣率或收入分成机制。正确结论是，Fever
              几乎肯定有多条收入流，但消费者票务销售、合作伙伴票务委托、品牌体验和需求生成服务之间的组合，仅靠公开证据仍不透明。事实模式还提示，收入确认在实践中可能很复杂：一些形式可能像市场佣金，另一些像联合制作活动经济性，还有一些像企业票务或营销服务。没有管理层定义，即便
              GMV 或净收入这类看似简单的指标，也可能掩盖有意义的组合迁移。
