      - number: '3.3'
        title: 切换成本、权利获取与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Fever 最有可能声称的最强竞争优势，并不是发现软件本身。发现很容易多平台并用：用户可以用很低切换成本浏览 Fever、Time Out、RA、Eventbrite、Ticketmaster
              或社交信息流。只有当 Fever 控制独家库存、品牌化形式或难以快速复制的深度合作伙伴关系时，护城河才会变强。这也是 DICE 收购具有战略意义的原因：它扩大 Fever
              在场馆、推广方和艺人中的足迹，并带来更多嵌入式音乐分发。Ticketmaster 在企业基础设施上仍然更强，但在权利获取、精选和消费者需求生成交汇处，Fever 可以更强。弱点在于，这些优势比消费者 app
              流量或上市公司收入更难公开衡量。投资者能看到的公开披露仍然很少。
