    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、法律足迹与运营框架
        blocks:
          - type: paragraph
            body: >-
              承销 Fever 时，应把它看作全球现场娱乐发现与票务平台，而不是场馆所有者或活动推广方。官方首页、新闻室和支持页面一直把 Fever
              描述成一个精选消费层，帮助用户发现体验并购买入场权限；支持和合作伙伴材料也显示，平台还承载合作伙伴入驻和购后票务流程。总部叙事不是互相矛盾，而是更细：Tracxn 仍指向马德里注册地址和创始基地，而 Fever
              的 2026 年隐私通知与 LeadIQ 指向纽约 50 Greene Street，作为当前运营实体地址。这一分野重要，因为它既支持用户提示里“源自西班牙”的框架，也不忽略公司的美国运营足迹。因此，投资者应把
              Fever 视为源自马德里、在纽约拥有活跃运营中心的公司；它背后有跨境法律结构，产品横跨发现、票务、支持和合作伙伴工具。
