  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构与原型
        blocks:
          - type: paragraph
            body: >-
              Fever 并不处在一个边界清晰的单一同业集合里。它与 DICE、Eventbrite 等票务和发现平台直接重叠，与 Headout 这类精选体验玩家相邻，也间接竞争 Ticketmaster Business
              这类企业票务基础设施，以及 Resident Advisor、Time Out 这类发现替代品。这种碎片化重要，因为没有一个同业能覆盖 Fever 的全部商业模式。Eventbrite
              是自助服务和长尾；Headout 是精选、体验驱动；DICE 以音乐优先；Ticketmaster 偏企业级；RA 和 Time Out 常在结账前截获注意力。Tracxn 宽泛的竞品清单再次说明 Fever
              位于一个拥挤且异质的市场，但实际教训是，投资者必须按细分评估竞争，而不是追问哪家公司才是“那个”竞争对手。这也意味着，某个竞争对手在一个工作流里高度相关，在另一个工作流里却大多无关。Ticketmaster
              可能主导企业基础设施，Time Out 可能只在发现环节重要，而 Headout 在旅游或景点库存与 Fever 城市精选重叠时最重要。
            claimRefs:
              - CP001
              - CP002
