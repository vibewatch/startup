      - number: '2.3'
        title: 买家、用户、付款方与替代路径
        blocks:
          - type: paragraph
            body: >-
              Fever 至少服务三条经济属性不同的客户路径。在核心消费者 app
              里，同一个人往往负责发现、购买和参加，因此产品质量、信任和复购行为最重要。在推广方、音乐节、场馆和体育票务里，经济买家是商业运营方或权利方，终端用户仍是粉丝，预算权更接近票务或增长团队。品牌体验和跨境活动构成第三条路径：营销或合作预算为体验买单，而参与者仍是面向消费者的用户。替代路径也能清楚映射到这一分层。Eventbrite
              是创作者自助驱动的替代品；Headout 是相邻的精选体验；DICE 是直接相邻的音乐票务；Ticketmaster Business 是企业级票房基准；Resident Advisor 和 Time Out
              是发现层替代品。这一点重要，因为 Fever 的赢面来自精选、独家性或受众触达比原始列表量或企业级既有地位更重要的场景。
