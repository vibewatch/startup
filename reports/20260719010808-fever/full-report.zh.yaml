        - 若证据显示很大一部分是低质量流量或无法变现的活动，投资逻辑会被削弱
      - - 平台正扩展到价值更高的 B2B 和伙伴票务用例
        - 若企业客户案例多为一次性激活且续约率低，溢价会收窄
      - - 2024 年 EBITDA 转正说法显示运营杠杆在改善
        - 若调整后盈利剔除了沉重的客服或营销负担，估值应压缩
      - - F1、LIV Golf、Sunny Hill 和 DICE 带来战略可选性
        - 若头部伙伴未能续约或贡献 GMV 很少，可选性应打折
      - - 公开市场证明票务规模化后可以有价值
        - 若 Fever 的私有经济性更像较弱公开可比公司，而不是成熟龙头，当前估值就太满
      - - 披露稀疏是今天犹豫的主因
        - 私下披露的经审计收入、留存和集中度数据可能显著上调建议
    notes: 反向逻辑主要由缺失的分母和公开可比公司的警示主导，而不是市场需求不足。
    claimRefs:
