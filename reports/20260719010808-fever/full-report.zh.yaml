      - number: '1.3'
        title: 规模、合作伙伴与里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              Fever 的规模说法很亮眼，但需要指标清洗。首页称其在 30 多个国家、200 多个主要城市提供超过 150,000 个体验；新闻室称去年在 40 多个国家触达超过 300 million
              人；支持材料称社区超过 125 million、覆盖 100 多个大型城市；Corpay 称运营现已跨越 50
              多个国家。这些口径并不相同，但可以共存，因为它们衡量的是系统不同层：目录宽度、城市足迹、年度触达、注册社区和运营地理。合作伙伴同样重要，因为它们显示平台的商业表面积。Fever 现在嵌入大型文化和体育生态，包括
              Primavera Sound、Real Madrid、FC Barcelona、LIV Golf、X Games，以及 Corpay 的 FX 栈。DICE
              收购进一步把这套逻辑延伸到音乐优先的票务、场馆关系和艺人—推广方工作流。
