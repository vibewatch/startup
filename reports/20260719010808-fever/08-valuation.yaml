- id: comparable-framing
  title: Comparable framing
  body: 'Public comps argue for caution rather than for a blank-check growth premium. Eventbrite’s last public market-cap reading before delisting was only about $453M, after an extended multiyear decline, showing how brutally public markets can discount subscale or lower-confidence ticketing platforms. Vivid Seats is even harsher: its March 2026 results showed $570.8M of 2025 revenue, but its July 2026 market cap was only about $77.9M after a severe drawdown. At the other extreme, Live Nation and CTS Eventim prove that scaled ticketing can support very large public values, but those are mature incumbents with audited financials, very large volume, and more transparent economics. Live Nation’s market cap sits around $41.9B with huge ticketing throughput, while CTS Eventim’s market cap is about $6.2B after surpassing €3B of 2025 revenue and maintaining strong ticketing margins. Fever’s $1.8B mark therefore sits in an awkward middle zone: far above distressed or underloved public marketplaces,
    but still far below dominant incumbents. Without a disclosed revenue denominator, that middle-zone pricing should be treated as potentially fair but not obviously cheap.'
  claimRefs:
  - CV017
  - CV018
