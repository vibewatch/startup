- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Fever (latest private mark)
    - Private financing reference
    - ~$1.8B valuation on June 2025 >$100M round
    - Sets the actual price context investors must assess
    - No public audited revenue or margin denominator
  - - Eventbrite
    - Public market value
    - ~$0.45B last public market cap before 2026 delisting / acquisition
    - Shows how harsh public markets can be on smaller event-ticketing platforms
    - Different maturity, business mix, and public-market context
  - - Live Nation / Ticketmaster
    - Public market value and ticketing scale
    - ~$41.9B market cap; 81M fee-bearing tickets in Q1 2026 and $368M ticketing deferred revenue
    - Upper-end proof that ticketing can support very large values at scale
    - Far more diversified, mature, and dominant than Fever
  - - Vivid Seats
    - Public market value vs reported revenue
    - ~$77.9M market cap despite $570.8M 2025 revenue and weak profitability
    - Shows downside when public investors distrust durability or economics
    - Secondary-market orientation and different model
  - - CTS Eventim
    - Public market value and revenue base
    - ~$6.2B market cap after €3.079B 2025 revenue and strong ticketing margins
    - European incumbent closer to Fever’s geography mix and platform logic than Live Nation
    - Much more mature, larger, and fully audited
  notes: Comparable rows are used to bracket valuation imagination, not to claim a precise multiple for Fever without revenue disclosure.
