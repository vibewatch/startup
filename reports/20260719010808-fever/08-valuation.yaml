company:
  name: Fever
chapter:
  number: 8
  title: Valuation
  summary: Fever looks like a credible scaled category leader, but the 2025 $1.8B private mark already prices in a meaningful amount of success relative to weaker public-ticketing comps; without private revenue and retention disclosure, the right public-data stance is conditional rather than outright bullish.
sections:
- id: thesis-and-price-context
  title: Thesis and price context
  body: 'Fever’s positive investment case is straightforward: the company has credible global scale, a distinctive experiences-and-ticketing brand, visible B2C and B2B surfaces, marquee partner wins, and a 2025 financing that reaffirmed unicorn status. Public evidence now spans 300M+ monthly interactions, 200k+ experiences, 500+ cities across 30+ countries on the business site, over 1,000 enterprise event customers, and high-visibility relationships with LIV Golf, Formula 1, Sunny Hill Festival, and DICE. Management-linked sources also claim 20x revenue growth from pre-pandemic levels and full-year EBITDA profitability in 2024. That is strong. The problem is price discipline. Fever’s latest public valuation marker is about $1.8B, and the public corpus still does not disclose audited revenue, cash, burn, take rate, repeat purchase, or concentration. That means the company may be good, but the current public-data case for paying the last round is incomplete. The key valuation question is therefore
    not whether Fever is impressive; it is whether enough upside remains at a unicorn mark without private KPI access.'
  claimRefs:
