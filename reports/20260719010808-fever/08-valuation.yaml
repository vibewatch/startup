- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Scaled consumer demand engine with 300M+ monthly interactions and 200k+ experiences
    - Evidence that a large share is low-quality traffic or non-monetizing activity would weaken the thesis
  - - Platform is expanding into higher-value B2B and partner ticketing use cases
    - If enterprise wins are mostly one-off activations with low renewal, the premium narrows
  - - 2024 EBITDA-positive claim suggests improving operating leverage
    - If adjusted profitability excludes heavy support or marketing burden, valuation should compress
  - - F1, LIV Golf, Sunny Hill, and DICE create strategic optionality
    - If marquee partnerships fail to renew or add little GMV, optionality should be discounted
  - - Public markets show ticketing can be valuable at scale
    - If Fever’s private economics resemble weaker public comps more than mature incumbents, the current mark is too full
  - - Sparse disclosure is the main reason to hesitate today
    - Private audited revenue, retention, and concentration data could move the recommendation up materially
  notes: The anti-thesis is dominated by missing denominators and public-comp caution, not by a lack of market demand.
