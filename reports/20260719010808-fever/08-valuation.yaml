- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue scale is materially above weak public comps, 2024 EBITDA profitability persists, and enterprise / partner wins compound into durable contracts
    - Fair value moves to roughly $2.0B-$2.7B; last round could still offer upside if execution remains clean
    - Regulatory or support failures interrupt premium narrative
    - Possible but needs private KPI proof
  - - Base
    - Brand, reach, and growth remain strong, but disclosure stays partial and risks remain manageable rather than solved
    - Fair value clusters around $1.4B-$1.95B; current mark sits in upper half of supportable band
    - Multiple compression and sparse disclosure cap rerating
    - Most supportable from public evidence
  - - Bear
    - Service friction, consumer-protection pressure, or partner concentration combine with public-market caution
    - Fair value compresses toward $0.9B-$1.35B, making the 2025 mark look rich
    - Weak cohort durability or enforcement action becomes visible
    - Cannot be ruled out without private diligence
  notes: Scenario bands are broad enterprise-value judgments in USD billions rather than pseudo-precise models.
