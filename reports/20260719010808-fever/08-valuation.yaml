  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-gmv
    missingEvidence: Trailing revenue, GMV, take rate, and geographic or segment mix.
    whyItMatters: These are the minimum denominators needed to compare Fever with public ticketing comps.
    diligencePath: Request audited revenue bridge, GMV, and take-rate by business line.
    relatedQuestionRefs:
    - QV006
    - QV007
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: profitability-quality
    missingEvidence: EBITDA bridge, cash conversion, working-capital profile, and capex intensity.
    whyItMatters: The valuation premium depends heavily on whether profitability is durable and cash-backed.
    diligencePath: Request audited EBITDA, free-cash-flow, and monthly cash burn / generation tables.
    relatedQuestionRefs:
    - QV002
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: durability-and-concentration
    missingEvidence: Consumer repeat purchase, organizer renewal, enterprise renewal, and top-partner concentration.
    whyItMatters: Without durability and concentration, scale could still be lower-quality or more fragile than it appears.
    diligencePath: Request cohort tables and top-10 partner / city / event-family concentration by GMV and revenue.
