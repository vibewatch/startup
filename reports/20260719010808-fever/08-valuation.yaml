- id: final-diligence-and-thesis-breaks
  title: Final diligence asks and thesis-breaks
  body: 'The investment committee should treat Fever as a high-quality-but-incompletely-disclosed asset. The most important missing inputs are not abstract. They are the exact inputs needed to decide whether $1.8B is attractive: trailing revenue, city and segment mix, take rate, EBITDA and cash conversion, customer repeat behavior, organizer and enterprise retention, support burden, and concentration by partner or event family. Those metrics would immediately tell investors whether Fever is closer to a premium, profitable scaled platform or closer to a high-growth marketplace that still deserves a large public-comp discount. Until then, the thesis should remain price-sensitive and event-sensitive. Any regulatory action on fee disclosure or refunds, worsening complaint intensity, a failed marquee partner rollout, or evidence of weak cohort durability would undermine the case quickly. Conversely, audited evidence of durable profitability, healthy repeat purchase, and limited concentration
    could move the recommendation upward. The conclusion is therefore disciplined rather than dramatic: pursue only with deeper diligence, a discount to the last mark, or structure that compensates for residual uncertainty.'
