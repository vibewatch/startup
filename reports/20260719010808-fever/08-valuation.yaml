- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Consumer-protection enforcement
    - Any formal action on fee disclosure, refunds, or deceptive ticketing practices
    - Challenges core checkout trust and can force margin-dilutive remediation
    - Pause or pass until legal and product remediation is reviewed
  - - Support / ticketing deterioration
    - Visible spike in unresolved ticket, refund, or access failures
    - Direct hit to repeat purchase, organizer trust, and brand equity
    - Lower valuation range and require operational data
  - - Partner concentration shock
    - Loss or underperformance of a marquee rights-holder partnership
    - Cuts growth optionality and exposes hidden concentration
    - Reduce probability of bull case
  - - Weak private economics
    - Revenue, EBITDA, or cash conversion materially below expectations
    - Shows current mark is too ambitious relative to public comps
    - Require discount well below last round or decline
  - - Retention disappointment
    - Low repeat purchase or poor organizer / enterprise renewal cohorts
    - Turns scale into low-quality volume rather than durable economics
    - Shift toward bear range
  - - Regulatory / privacy event
    - Material DPA complaint, transfer issue, or public breach
    - Raises risk discount and future compliance cost
    - Reassess investment case immediately
  notes: Each trigger is designed to be specific enough for IC monitoring after initial diligence.
  claimRefs:
  - CV026
  - CV028
  - CV029
  - CV037
  - CV038
  - CV041
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and GMV
    - Trailing twelve-month revenue, GMV, take rate, and city mix
    - Without a denominator, the private mark cannot be benchmarked cleanly
    - Finance diligence request / management data room
  - - Profitability quality
    - EBITDA bridge, cash conversion, and working-capital behavior
    - Tests whether 2024 profitability is durable or accounting-light
    - Finance and accounting diligence
  - - Customer durability
    - Repeat purchase, cohort retention, organizer renewal, enterprise renewal
    - Separates real platform durability from one-time hype cycles
    - Growth / revenue operations diligence
  - - Concentration
    - Top partners, top event families, top geographies, and DICE contribution
    - Determines whether marquee wins hide outsized concentration
    - Commercial diligence and board materials
  - - Support burden
    - Refund rates, incident volumes, SLA metrics, and ticket-failure rate
    - Quantifies whether operational risk is manageable or margin-destructive
    - Operations diligence
  - - Regulatory compliance
    - Checkout screenshots, fee-disclosure logic, privacy workflows, DSR logs
    - Tests whether known legal risks are actively controlled
    - Legal / product diligence
  notes: If management cannot supply these materials promptly, that itself should lower confidence in the current price.
