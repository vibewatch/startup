  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, repeat purchase cohorts, and buyer-frequency curves by segment.
    whyItMatters: The public record proves acquisition and public satisfaction proxies, but not whether customers stay and compound in revenue terms.
    diligencePath: Request cohort tables for consumers, organizers, and B2B accounts plus refund-linked churn analysis.
    relatedQuestionRefs:
    - QU022
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: ACV, contract length, pricing structure, and expansion data for Fever for Business, sports partners, and organizer accounts.
    whyItMatters: Marquee logos are useful only if they convert into durable, high-quality revenue with acceptable service cost.
    diligencePath: Request sample MSAs, pricing schedules, and logo-level expansion or renewal data.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-organizer, and top-event concentration as a share of GMV or revenue.
    whyItMatters: A small number of marquee partners or event franchises could drive an outsized share of volume and risk.
    diligencePath: Request top-10 customer, organizer, and event-family contribution plus contract end dates.
    relatedQuestionRefs:
    - QU024
  - type: private-evidence-only
    severity: important
    topic: service-quality
    missingEvidence: Complaint rates, refund rates, first-response time, resolution SLA, and ticket-delivery incident rates.
    whyItMatters: Support failures can directly degrade repeat purchase and organizer trust even when demand acquisition remains strong.
    diligencePath: Request monthly support dashboards and incident postmortems segmented by event type and geography.
    relatedQuestionRefs:
    - QU017
    - QU018
