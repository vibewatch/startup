  - - Sunny Hill Festival
    - International music festival
    - Official international ticketing partner for 2026 with cross-listing across Fever and DICE
    - Production rollout for 2026 festival cycle
    - Shows music-festival organizer adoption and DICE cross-network value
    - Official festival ticket page does not visibly foreground Fever on accessible surface
  - - Formula 1
    - Global motorsport series
    - New F1.com ticketing platform for general admission, hospitality, and Paddock Club tickets
    - Signed, future production from 2027 onward
    - Very high-signal customer logo validating enterprise-grade ticketing credibility
    - Deployment starts after the current run date, so current revenue proof is still forward-looking
