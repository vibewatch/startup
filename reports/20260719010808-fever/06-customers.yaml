- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale evidence
  - Revenue / strategic value
  - Gap
  rows:
  - - Self-serve consumers
    - Individual / attendee / individual
    - Discover and book local live experiences, attractions, and exclusives
    - App-store listings plus business homepage scale claims and 71K App Store ratings
    - Core demand engine and data source for recommendations
    - No public free-to-paid conversion, repeat-purchase rate, or payer mix
  - - Organizer / venue / promoter supply
    - Organizer or venue / event operations / organizer
    - List, market, and ticket concerts, attractions, theaters, sports, and live shows
    - Business homepage explicitly targets promoters, attractions, theaters, live shows, and sports operators
    - Supply-side inventory depth is necessary for marketplace relevance and ticketing revenue
    - No public organizer count, yield rate, or renewal disclosure
  - - Group organizers, schools, travel agencies
    - School, agency, or employer / attendees / organizer
    - Reserve block tickets and manage group access
    - Group-bookings page targets school trips, team buildings, travel agencies, and corporate outings
    - Adds higher-order-volume bookings and dedicated-service revenue
    - No public volume split or average order value
  - - Employer / brand buyers
    - Employer or marketing team / employees, clients, partners / employer or brand
    - Private events, Candlelight activations, benefits, client entertainment
    - Fever for Business, Fever Pass, and 1,000+ company claim
    - Higher-ARPU B2B wedge layered on top of consumer demand
    - No ACV, contract length, or renewal metrics
  - - Major sports and festival partners
    - League, team, or festival / fans / organizer
    - Global ticketing and demand generation for marquee events
    - LIV Golf, Sunny Hill Festival, Formula 1 from 2027
    - Builds credibility with high-visibility rights holders and sports audiences
    - No public economics, exclusivity depth, or partner concentration data
  - - Affiliate / media partners
    - Publisher or affiliate / readers / partner
    - Use Fever inventory to monetize audience with curated experiences
    - Fever for Business testimonials cite Travelzoo and family-activity publisher use
    - Expands distribution beyond owned demand channels
    - No public affiliate revenue contribution or retention data
  notes: Public evidence supports a genuinely multi-sided customer model rather than a single consumer-only app.
