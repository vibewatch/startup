- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Consumer cross-sell into exclusive events and loyalty
    - A few blockbuster formats could matter disproportionately
    - Consumer demand may be less diversified than headline inventory counts suggest
    - Request GMV and repeat purchase by event family and city
  - - Organizer upsell into ticketing + demand generation
    - Large rights-holder wins could concentrate volume in a small logo set
    - Revenue volatility could rise if marquee organizers churn
    - Request top-10 organizer share and contract duration
  - - Fever for Business multi-product wedge
    - Corporate events may expand into benefits, gift cards, and affiliates
    - Healthy land-and-expand potential if logos renew across modules
    - Request logo-level product attach and renewal
  - - Sports-partner credibility loop
    - LIV Golf and F1 could open other sports accounts
    - Winning sports logos may also raise implementation complexity and support burden
    - Request implementation team capacity and partner economics
  - - Geographic partner routing
    - Official partner visibility can differ by market and local routing rules
    - Fever brand presence may be weaker in some purchase flows than in press releases
    - Request market-by-market funnel ownership
  - - Customer-service quality
    - Refund or ticket-visibility failures can impair repeat use and partner trust
    - Support friction can directly reduce retention even if demand acquisition stays strong
    - Request complaint-rate, refund-rate, and SLA dashboards
  notes: Risk rows focus on what public evidence can and cannot support rather than inventing churn or concentration figures.
  claimRefs:
  - CU019
  - CU021
  - CU028
  - CU030
  - CU031
  - CU032
  - CU034
  - CU036
- id: TU006
  title: Public service-friction and adverse evidence table
  columns:
  - Issue surface
  - Observed pattern
  - Evidence source
  - Customer implication
  - Official mitigation
  - Remaining gap
  rows:
  - - Refund disputes
    - Recurring complaints about voucher-led or delayed refunds
    - ComplaintsBoard + JustUseApp
    - Can weaken repeat use and trust after event disruption
    - Refund help center article and support channels exist
    - No public refund SLA or resolved-case stats
  - - Ticket visibility failures
    - Customers report confirmed purchases not appearing in app
    - Specific ComplaintsBoard complaint + missing-ticket article
    - High-friction failure mode on the day of attendance
    - Dedicated recovery article and live support routes
    - No public incident rate
  - - Support responsiveness
    - Mixed reports of helpful vs slow support
    - JustUseApp + ComplaintsBoard
    - Service quality may vary by issue complexity
    - 24/7 support claim via app, call, and email
    - No public CSAT, FRT, or resolution-time data
  - - Partner-screening friction
    - Partner submissions are reviewed for suitability
    - Partner-up help page
    - May preserve quality but slows self-serve supply intake
    - Business intake and manual review
    - No acceptance-rate or onboarding-time disclosure
  - - Urgent-event escalation
    - Contact article prioritizes live chat / calls within 48h of event
    - Support contact page
    - Shows operational awareness of time-sensitive failures
    - Multiple support channels available
    - No public response-time guarantee
  - - Brand-visibility inconsistency
    - Festival ticket page does not visibly foreground Fever
    - Sunny Hill tickets page
    - Partner ownership may be less visible than press materials imply
    - Cross-listing still referenced in Fever press release
    - No market-by-market routing or attribution detail
  notes: Adverse evidence does not disprove adoption, but it shows where customer-quality risk remains visible in public.
