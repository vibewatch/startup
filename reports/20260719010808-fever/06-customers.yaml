  title: Customers
  summary: Public evidence supports a broad three-sided customer surface for Fever spanning consumers, supply-side organizers, and employer/brand buyers, but renewal and concentration quality remain materially under-disclosed.
sections:
- id: customer-base-and-segments
  title: Customer base and segmentation
  body: 'Fever does not sell into a single customer archetype. The public record points to a broad multi-sided model with consumer ticket buyers on one side, organizers and venue-side supply partners on another, and an increasingly explicit B2B buyer layer in the middle. The consumer surface is still the core demand engine: the app-store listings, support pages, and business homepage all frame Fever as a discovery-and-booking product for local live experiences. But the business surfaces matter because they show who else pays. The ticketing homepage targets event promoters, attractions, theaters, sports operators, and live-show sellers. The group-bookings page adds schools, travel agencies, and corporate offsites. Fever for Business adds employers, client-entertainment teams, and benefits managers as buyers, while employees, clients, and partners become end users of the purchased experience. That segmentation matters for diligence because it means Fever is not only a consumer marketplace;
    it is also a ticketing, demand-generation, and experiential-sales platform with multiple payer types and multiple expansion paths.'
  claimRefs:
