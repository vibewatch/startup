  topStrengths:
  - Strong global scale signals, including 300M+ monthly interactions, 200k+ experiences, and operations across 50+ countries.
  - Multi-sided model spans consumer demand, organizer supply, B2B experiences, and high-signal rights-holder partnerships rather than a single product surface.
  - Management-linked evidence says Fever was full-year EBITDA profitable in 2024 and grew revenue more than 20x from pre-pandemic levels.
  - DICE, LIV Golf, Sunny Hill Festival, and Formula 1 create real strategic option value in music, sports, and enterprise ticketing.
  - Funding history and investor roster support the view that Fever remains one of the most credible scaled private players in live-entertainment technology.
  topRisks:
  - 'Public financial disclosure is still too thin: no audited revenue, cash, burn, take rate, or cohort retention denominator is available.'
  - Consumer-protection and customer-service risk remains visible through refund, ticket-visibility, and support complaints.
  - The latest ~$1.8B mark appears full-to-fair on public evidence rather than obviously cheap.
  - Concentration by partner, event family, geography, and DICE contribution remains undisclosed, leaving the bull case partly unproven.
  - Operating complexity across many products, many countries, and live-event support windows can create execution strain even when demand is strong.
  unresolvedGaps:
  - Audited trailing revenue, GMV, take rate, and segment or geography mix.
  - EBITDA bridge, cash conversion, working-capital profile, and current runway.
  - Repeat purchase, organizer renewal, enterprise retention, and top-partner concentration.
  - Refund-rate, incident-rate, and support-SLA dashboards tied to event categories and geographies.
  - Contract economics, implementation cost, and renewal status for major partners including LIV, F1, and DICE-linked supply.
disclaimer: This report-meta artifact is derived only from public evidence reviewed in the Fever chapter YAMLs as of 2026-07-19. It is not investment advice. Fever remains a private company with incomplete public financial disclosure, so the recommendation and valuation stance are especially sensitive to private revenue quality, retention, concentration, and support-performance data.
