companyProfile:
  summary: Fever is a Madrid-founded live-entertainment technology company founded in 2014 that now combines consumer event discovery, ticketing, partner-side supply and distribution tooling, and B2B experiential products. Public evidence shows a large global footprint, premium-rights-holder relationships, and a growing mix of music, sports, and original experiences. The company raised a reported $100M+ round in June 2025 at roughly a $1.8B valuation and says it remained EBITDA-profitable in 2024 while growing revenue more than 20x from pre-pandemic levels. The DICE combination and newer partnerships with LIV Golf and Formula 1 extend Fever beyond a city-events app into a broader ticketing and demand-generation platform.
  foundedDate: '2014-01-01'
  foundingLocation: Madrid, Spain
  headquarters: Madrid, Spain / New York operating entity
  productSummary: Consumer discovery app and website, mobile-native ticketing and wallet, partner-side ticketing and distribution tools, Fever for Business private events and employee benefits, and DICE-linked music ticketing.
  customerFocus: Self-serve event-goers, organizers and venues, enterprise and brand buyers, group organizers, and marquee sports / festival partners.
  businessModel: Commission- and service-fee-driven ticketing and marketplace monetization layered with partner distribution, B2B event products, and strategic premium inventory relationships.
  stage: Late-stage private / Series E
  fundingStatus: June 2025 financing of $100M+ with L Catterton and Point72 at a reported $1.8B valuation; Tracxn records $527M of total disclosed funding over nine rounds.
