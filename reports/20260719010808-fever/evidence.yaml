    relatedQuestionRefs:
      - QV026
      - QV028
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: important
    topic: support-economics
    missingEvidence: Refund rate, SLA performance, incident volume, and support cost per order.
    whyItMatters: Operational friction can destroy the economics of an otherwise attractive marketplace.
    diligencePath: Request customer-support dashboard and refund-aging data by event type.
    relatedQuestionRefs:
      - QV015
      - QV016
    relatedTableRefs:
      - TV005
  - type: private-evidence-only
    severity: important
    topic: partner-rollout-quality
    missingEvidence: Contract length, economics, integration cost, and renewal status for LIV, F1, DICE, and similar partners.
