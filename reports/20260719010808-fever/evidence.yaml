evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: monthly-active-users
    missingEvidence: A management-defined Fever-only monthly active user metric with methodology and geography split.
    whyItMatters: >-
      The user prompt scaffold mentions MAU, but public sources only support annual reach, community size, and DICE
      monthly-active-fan data.
    diligencePath: >-
      Request board or investor KPI decks showing MAU, DAU/MAU, and active buyer definitions by geography and product
      line.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited 2025 revenue, gross margin, and segment or vertical mix for Fever.
    whyItMatters: >-
      Valuation discipline and underwriting quality are materially weaker without a verified revenue base behind the
      EBITDA-positive claim.
    diligencePath: >-
      Request audited financial statements or board-approved management accounts covering 2024 and 2025 with geography
      and vertical breakout.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Share-class terms, liquidation preferences, any debt covenants, and outstanding employee option overhang.
    whyItMatters: >-
      Late-stage private returns depend heavily on preference stack and dilution, not just the headline valuation
      marker.
    diligencePath: >-
      Request the latest cap table, financing documents, side letters, and any credit agreements tied to growth or
      acquisition financing.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A complete official leadership and board page with current executives, responsibilities, and biographies.
    whyItMatters: >-
      The founder/leadership enumeration is assembled from third-party and release-signatory evidence rather than a
      comprehensive company directory.
    diligencePath: Request the current org chart, executive bios, and board observer/committee lists from management.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: TO003 stakeholder map completeness
    missingEvidence: A full cap table and contract roster showing investor rights and strategic counterparties.
    whyItMatters: >-
      The stakeholder map is directionally right but cannot distinguish economics, control, or renewal exposure without
      private documents.
    diligencePath: Request cap table exports, financing documents, major commercial contracts, and any board rights schedules.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: >-
      A company-approved chronology covering every material launch, financing, regulatory event, and geographic
      expansion.
    whyItMatters: The milestone table is high signal but intentionally selective; missing dates can distort trend interpretation.
    diligencePath: Request an internal timeline or data-room chronology to reconcile launches, partnerships, and compliance events.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-disclosure
    missingEvidence: A management-approved SAM/SOM model by geography, vertical, and product line.
    whyItMatters: Public market reports are too broad to translate directly into revenue potential without private mix assumptions.
    diligencePath: >-
      Request the board TAM/SAM/SOM model used in planning and financing materials, including assumptions for music,
      sports, and originals.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: partner-penetration
    missingEvidence: Promoter, venue, and festival penetration metrics, win rates, and renewal data.
    whyItMatters: >-
      The company’s B2B opportunity cannot be sized credibly without knowing how many large mandates it wins and
      retains.
    diligencePath: Request pipeline, win/loss, and cohort renewal data segmented by partner type and geography.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: Product-line take rates, fees, and gross-to-net economics by consumer and partner route.
    whyItMatters: Even a large TAM can be economically unattractive if monetization depth is weak or highly variable.
    diligencePath: >-
      Request unit economics by route to market, including ticketing fees, partner revenue share, and support cost per
      order.
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable fee schedules, take rates, and contract economics for Fever and key peers.
    whyItMatters: Without pricing comparability, feature breadth can be mistaken for economic advantage.
    diligencePath: Request partner contracts, checkout fee screenshots by market, and a public/private comp pricing bridge.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: partner-retention
    missingEvidence: Venue, promoter, and festival retention metrics or penetration rates across Fever and peers.
    whyItMatters: High switching costs only matter if they actually translate into durable renewal behavior.
    diligencePath: Request retention cohorts and win/loss data by segment, especially for DICE-related music accounts.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: minor
    topic: axs-benchmark
    missingEvidence: A readable AXS company page or operator overview.
    whyItMatters: AXS is a known live-ticketing peer, but its public site was access-restricted during this run.
    diligencePath: Re-fetch AXS with alternative profile handling or use an authoritative third-party operator profile.
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited 2024-2025 revenue, gross profit, and segment mix.
    whyItMatters: >-
      Without audited revenue and margin, the EBITDA-positive claim cannot be converted into a reliable underwriting
      model.
    diligencePath: Request audited financial statements and management reporting with segment breakouts.
    relatedQuestionRefs:
      - QI008
      - QI009
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Cash on hand, monthly burn, runway, and any debt or covenant obligations.
    whyItMatters: Capital adequacy cannot be judged from funding history alone.
    diligencePath: Request treasury pack, monthly cash-flow reporting, and all debt agreements.
    relatedQuestionRefs:
      - QI017
      - QI023
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Take rate, refund rate, CAC, payback, and gross margin by route to market.
    whyItMatters: These metrics determine whether growth and EBITDA are durable or simply period-specific.
    diligencePath: Request cohort-level consumer and partner economics plus finance-reviewed KPI definitions.
    relatedQuestionRefs:
      - QI024
  - type: private-evidence-only
    severity: material
    topic: engineering-stack
    missingEvidence: A current system architecture, data pipeline overview, and major third-party service map.
    whyItMatters: The public record proves the workflow exists but not how resilient or scalable the underlying implementation is.
    diligencePath: Request an engineering architecture review, key vendor list, and technical due-diligence walkthrough.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Uptime, incident history, SLA targets, and ticket-delivery failure rates.
    whyItMatters: >-
      Operational reliability directly affects consumer trust and partner willingness to route ticket volume through
      Fever.
    diligencePath: Request reliability dashboards, incident postmortems, and support volume metrics tied to ticketing failures.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: security-certification
    missingEvidence: Formal security audits, certifications, penetration-test summaries, or privacy compliance attestations.
    whyItMatters: Policy documents alone do not prove the strength of operational controls.
    diligencePath: Request SOC 2 / ISO materials, privacy DPIAs, and latest security review outputs.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, repeat purchase cohorts, and buyer-frequency curves by segment.
    whyItMatters: >-
      The public record proves acquisition and public satisfaction proxies, but not whether customers stay and compound
      in revenue terms.
    diligencePath: Request cohort tables for consumers, organizers, and B2B accounts plus refund-linked churn analysis.
    relatedQuestionRefs:
      - QU022
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      ACV, contract length, pricing structure, and expansion data for Fever for Business, sports partners, and organizer
      accounts.
    whyItMatters: Marquee logos are useful only if they convert into durable, high-quality revenue with acceptable service cost.
    diligencePath: Request sample MSAs, pricing schedules, and logo-level expansion or renewal data.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, top-organizer, and top-event concentration as a share of GMV or revenue.
    whyItMatters: A small number of marquee partners or event franchises could drive an outsized share of volume and risk.
    diligencePath: Request top-10 customer, organizer, and event-family contribution plus contract end dates.
    relatedQuestionRefs:
      - QU024
  - type: private-evidence-only
    severity: important
    topic: service-quality
    missingEvidence: Complaint rates, refund rates, first-response time, resolution SLA, and ticket-delivery incident rates.
    whyItMatters: >-
      Support failures can directly degrade repeat purchase and organizer trust even when demand acquisition remains
      strong.
    diligencePath: Request monthly support dashboards and incident postmortems segmented by event type and geography.
    relatedQuestionRefs:
      - QU017
      - QU018
  - type: private-evidence-only
    severity: material
    topic: security-and-incidents
    missingEvidence: Security certifications, breach history, uptime targets, status history, and incident postmortems.
    whyItMatters: >-
      Without operating assurance metrics, investors cannot size the residual probability or cost of reliability
      failures.
    diligencePath: Request SOC 2 / ISO materials, status history, incident logs, and latest postmortems.
    relatedQuestionRefs:
      - QR017
  - type: private-evidence-only
    severity: material
    topic: refund-and-support-metrics
    missingEvidence: Refund SLA, first-response time, case backlog, resolution-time distributions, and complaint-rate trends.
    whyItMatters: >-
      Support quality is one of the clearest public risk signals, yet it is impossible to quantify from public evidence
      alone.
    diligencePath: Request monthly support dashboards by geography and event category plus refund-aging analysis.
    relatedQuestionRefs:
      - QR014
      - QR015
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-partner, top-organizer, top-event-family, and top-geography concentration by GMV and revenue.
    whyItMatters: A few marquee relationships could drive outsized volume and create hidden concentration risk.
    diligencePath: Request concentration tables, contract end dates, and launch dependency map.
    relatedQuestionRefs:
      - QR029
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: checkout-compliance
    missingEvidence: Country-by-country legal review of checkout display, fee disclosure, voucher logic, and refund exceptions.
    whyItMatters: >-
      FTC, UK, and EU consumer-protection regimes can all create expensive remediation if the actual flows lag the legal
      standard.
    diligencePath: Request product screenshots, counsel memo, AB tests, and historical complaint tagging for fee or refund disputes.
    relatedQuestionRefs:
      - QR004
      - QR006
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: important
    topic: people-and-coverage
    missingEvidence: Ops/support attrition, staffing ratios, off-hours coverage, and on-call escalation process.
    whyItMatters: >-
      A live-events platform can look healthy top-line while internal fatigue erodes service quality and launch
      reliability.
    diligencePath: Request staffing plans, attrition cohorts, workload dashboards, and peak-event coverage runbooks.
    relatedQuestionRefs:
      - QR025
      - QR026
    relatedTableRefs:
      - TR004
  - type: private-evidence-only
    severity: material
    topic: revenue-and-gmv
    missingEvidence: Trailing revenue, GMV, take rate, and geographic or segment mix.
    whyItMatters: These are the minimum denominators needed to compare Fever with public ticketing comps.
    diligencePath: Request audited revenue bridge, GMV, and take-rate by business line.
    relatedQuestionRefs:
      - QV006
      - QV007
    relatedTableRefs:
      - TV004
  - type: private-evidence-only
    severity: material
    topic: profitability-quality
    missingEvidence: EBITDA bridge, cash conversion, working-capital profile, and capex intensity.
    whyItMatters: The valuation premium depends heavily on whether profitability is durable and cash-backed.
    diligencePath: Request audited EBITDA, free-cash-flow, and monthly cash burn / generation tables.
    relatedQuestionRefs:
      - QV002
      - QV029
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: material
    topic: durability-and-concentration
