- id: buyers-users-payers-and-substitutes
  title: Buyers, users, payers, and substitute paths
  body: Fever serves at least three economically distinct customer paths. In the core consumer app, the same person often discovers, buys, and attends, so product quality, trust, and repeat behavior matter most. In promoter, festival, venue, and sports ticketing, the economic buyer is a commercial operator or rights holder, the end user is still the fan, and budget authority sits closer to ticketing or growth teams. Branded experiences and cross-border activations add a third path where marketing or partnerships budgets fund the experience while the attendee remains the consumer-facing user. Substitute paths map cleanly onto this segmentation. Eventbrite is the self-service creator-led substitute; Headout is the curated experiences adjacent; DICE is the direct music-ticketing adjacent; Ticketmaster Business is the enterprise box-office benchmark; Resident Advisor and Time Out are discovery substitutes. This matters because Fever wins where curation, exclusivity, or audience reach matter
    more than raw listing volume or enterprise incumbency.
  claimRefs:
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
