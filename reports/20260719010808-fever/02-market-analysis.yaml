- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Mobile-first ticketing and digital wallets
    - Positive
    - Current
    - Supports app-led conversion and last-minute buying
    - Check Fever app retention, wallet usage, and repeat behavior.
  - - Personalized discovery and curation
    - Positive
    - Current
    - Differentiates from directory-like event listings
    - Request recommendation performance and repeat-rate data.
  - - Sports, music, and festival mandates
    - Positive
    - Current / near-term
    - Expands B2B revenue beyond pure B2C ticketing
    - Review renewal rates and economic terms for key mandates.
  - - Cross-border operations and FX infrastructure
    - Positive with execution risk
    - Current
    - Enables geographic growth but adds complexity
    - Assess treasury controls, settlement economics, and local entity map.
  - - Fee-transparency regulation
    - Negative / margin discipline
    - Current
    - Limits hidden pricing levers and raises compliance stakes
    - Audit checkout pricing and fee presentation by market.
  - - Counterfeit / fraud / trust issues
    - Negative
    - Current
    - Can slow repeat demand and raise support cost
    - Measure fraud losses, chargebacks, and complaint-resolution rates.
  - - Refund and service friction
    - Negative
    - Current
    - Damages customer trust and partner confidence
    - Review customer support SLAs, refund policy exceptions, and complaint trends.
  - - Multi-archetype competition
    - Negative
    - Current
    - Forces Fever to win on curation and partner ROI rather than generic breadth
    - Benchmark against self-service, enterprise, and editorial substitutes.
  notes: Driver/constraint register focuses on factors that directly alter adoption timing, pricing power, or repeat usage rather than on generic market-growth narratives.
