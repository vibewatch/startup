    - Promoter full P&L, sponsorship outside mandate
    - Venue, promoter, festival / operator
    - High relevance after Primavera and DICE.
  - - Sports and branded activations
    - Rights-holder ticketing, fan engagement, experiential marketing
    - Team media rights, venue ownership, merchandise outside ticketing scope
    - Sports org or brand / operator
    - Strategically growing adjacency.
  - - Editorial or discovery-only substitutes
    - Media/discovery traffic, event recommendations
    - Direct ticket economics when off-platform
    - Consumer / advertiser or publisher
    - Important substitute but not full economic equivalent.
