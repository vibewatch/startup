company:
  name: Fever
chapter:
  number: 3
  title: Competitors
  summary: Fever competes across a fragmented landscape that spans self-service ticketing, curated-experiences marketplaces, music-first ticketing, enterprise box-office infrastructure, and editorial discovery substitutes. Its strongest visible advantages sit in curated exclusives, branded formats, and partner-integrated music or festival routes, while generic discovery remains highly multi-home and public disclosure is much weaker than comparable public peers such as Eventbrite.
sections:
- id: landscape-structure
  title: Landscape structure and archetypes
  body: Fever does not compete in a single neatly bounded peer set. It overlaps directly with ticketing and discovery platforms such as DICE and Eventbrite, sits adjacent to curated-experiences players such as Headout, and competes indirectly with enterprise ticketing infrastructure such as Ticketmaster Business and with discovery substitutes such as Resident Advisor and Time Out. That fragmentation matters because no one peer captures all of Fever’s business model. Eventbrite is self-service and long-tail. Headout is curated and experience-led. DICE is music-first. Ticketmaster is enterprise-heavy. RA and Time Out often intercept attention before checkout. Tracxn’s broad competitor list reinforces that Fever operates inside a crowded, heterogeneous market, but the practical lesson is that investors must evaluate competition segment by segment rather than ask which single company is “the” competitor. It also means a competitor can be highly relevant in one workflow and mostly irrelevant
    in another. Ticketmaster may dominate enterprise infrastructure, while Time Out may matter only at discovery, and Headout may matter most where tourism or attraction inventory overlaps with Fever’s city curation.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
  tableRefs:
  - TP001
