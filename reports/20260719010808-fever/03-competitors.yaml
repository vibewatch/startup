  - - Music scale via DICE
    - Integration missteps or promoter attrition
    - High
    - Request DICE retention, overlap, and integration KPIs.
  - - Consumer discovery brand
    - Users multi-home across discovery surfaces
    - Medium
    - Measure repeat behavior and direct app traffic dependency.
  - - Partner demand generation
    - Ticketmaster or Eventbrite undercut or bundle services
    - Medium
    - Compare partner ROI, fee economics, and implementation speed.
  - - Trust and service quality
    - Refund disputes erode consumer and partner confidence
    - High
    - Audit support SLAs, complaint rates, and reimbursement workflow.
  - - Private-company opacity
    - Investors cannot benchmark economics cleanly
    - Medium
    - Request unit economics, partner concentration, and public-comp bridge.
  notes: Risk register focuses on durability rather than current popularity, because competitive position depends on renewal, trust, and embed depth over time.
