- id: capability-and-pricing-comparison
  title: Capability and pricing comparison
  body: 'Feature comparison is more revealing than brand comparison. Fever’s public differentiation leans on curated discovery, exclusive or branded inventory, immersive formats, and a managed mobile post-purchase workflow. Eventbrite emphasizes open creation and self-service ticketing. Headout emphasizes best-price curated travel and attractions. DICE highlights upfront pricing and relevant recommendations. Ticketmaster emphasizes operator solutions and box-office scale. Resident Advisor and Time Out win discovery through community or editorial power rather than through a full-stack ticketing moat. Pricing is the least transparent area across the set: the retained sources show positioning language, but not comparable take rates or fee schedules. That opacity means pricing power and unit economics should be treated as unresolved diligence questions rather than as proven advantages for any one player. This is why the competitive question is not merely who has more listings or a larger brand,
    but who can win the exact combination of curation, rights access, checkout trust, and operator economics required by each segment.'
  claimRefs:
  - CP013
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
  - CP031
  tableRefs:
  - TP002
