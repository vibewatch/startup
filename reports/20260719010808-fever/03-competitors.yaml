- id: switching-costs-and-moat
  title: Switching costs, rights access, and moat durability
  body: 'The strongest competitive advantage Fever can plausibly claim is not discovery software alone. Discovery is easy to multi-home: users can browse Fever, Time Out, RA, Eventbrite, Ticketmaster, or social feeds with low switching cost. The moat gets stronger only when Fever controls exclusive inventory, branded formats, or integrated partner relationships that are hard to replicate quickly. That is why the DICE acquisition matters strategically: it expands Fever’s footprint with venues, promoters, and artists and gives it more embedded music distribution. Ticketmaster still looks stronger in enterprise infrastructure, but Fever can be stronger where rights access, curation, and consumer demand generation intersect. The weakness is that those advantages are harder to measure publicly than consumer-app traffic or public-company revenue. Public disclosure remains sparse. for investors.'
  claimRefs:
  - CP020
  - CP021
  - CP022
  - CP023
  - CP028
  - CP029
  - CP032
  - CP036
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: trust-regulation-and-competitive-risk
  title: Trust, regulation, and competitive risk
  body: Competitive durability in ticketing now depends partly on regulation and customer trust. The FTC’s junk-fees rule, CMA scrutiny of secondary ticketing, and broader online-marketplace obligations under the DSA all raise the cost of opaque pricing or weak disclosure. Complaint and review sources also show how refund handling and support disputes can undermine repeat purchase. Those issues do not mean Fever is uniquely weak; they mean the sector itself is trust-sensitive. Public competitors with deeper disclosure, such as Eventbrite, enjoy an advantage in transparency even if they do not win every product comparison. Private Fever may still be strategically better positioned in exclusives and branded experiences, but outside investors have less visibility into pricing, partner concentration, and retention than they would have with public comps. That transparency gap can itself become a competitive disadvantage in financing or diligence settings, even if end users do not directly perceive
    it.
  claimRefs:
  - CP024
  - CP025
  - CP026
  - CP027
  - CP030
  - CP033
  - CP034
  - CP035
