    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Creator reach, "6.5M+ claimed by Tripo3ds.com", "Low", "Possible top-of-funnel scale, not paid demand", "Monthly active, paid, and retained cohorts"]
      - [Enterprise adoption, "Tencent, Sony, and HTC listed; JPR reports hundreds of companies", "Medium", "Potential enterprise channel without contract economics", "Logos, ACV, renewal, concentration, and referenceability"]
      - [Production cleanup, "Complex assets can require manual review", "Medium", "May reduce customer ROI or increase support burden", "Rework rate, support hours, and gross cost by workload"]
      - [CAC and payback, null, "Unavailable", "Determines whether growth is capital-efficient", "Spend, funnel conversion, CAC, and gross-margin payback"]
      - [Gross margin, null, "Unavailable", "Separates scalable software economics from compute-heavy delivery", "Revenue and direct compute/support cost by product"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines financing dependency after recent rounds", "Cash bridge, burn, debt, commitments, and downside runway"]
    notes: "Null means the assigned public sources do not disclose the metric; it is not evidence that the metric is zero, immaterial, or unavailable to management."
    claimRefs: [CI005, CI006, CI007, CI013, CI014, CI015]
