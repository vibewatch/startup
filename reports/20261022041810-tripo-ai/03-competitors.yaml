    approximationNotes: "Ordinal analyst mapping from assigned source descriptions, not a measured benchmark or market share ranking. Coordinates are comparative heuristics and should be replaced with controlled buyer tests before investment underwriting."
    claimRefs: [CP001, CP003, CP010, CP011, CP012]
callouts:
  - calloutType: strength
    title: Workflow depth is the clearest differentiation
    body: "The strongest evidence-backed distinction is the connected path from generation to structured geometry, materials, rigging, animation, export, and API integration, not a claim that every generated asset is final-production quality."
    claimRefs: [CP001, CP005, CP006]
  - calloutType: risk
    title: The moat is exposed to free and bundled alternatives
    body: "Open-source systems and broader creative platforms can compress price and make generation interchangeable; Tripo must prove lower downstream rework and durable enterprise usage rather than rely on user counts or one-off visual quality."
    claimRefs: [CP010, CP011, CP013]
