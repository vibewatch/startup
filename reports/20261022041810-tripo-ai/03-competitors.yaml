    columns: [Buying criterion, Tripo AI, 3D AI Studio, Media.io, Manual or internal build]
    rows:
      - [Text/image/multi-view to 3D, "Documented", "Documented by competitor page", "Not a mesh workflow in comparison", "Manual reference interpretation"]
      - [Structured or low-poly topology, "Smart Mesh documented", "Competitor claims clean topology", "Unknown / not applicable", "Artist-controlled"]
      - [Texturing and segmentation, "Documented", "Segmentation described as basic in comparison", "2D editing instead", "Artist or separate tools"]
      - [Rigging and animation, "Documented; output still needs review", "Competitor claims auto-rigging", "Not a 3D rigging alternative", "Manual or specialist tools"]
      - [DCC and game-engine handoff, "GLB, FBX, OBJ, STL, USD and named integrations reported", "Exports reported by competitor", "2D export path", "Native pipeline control"]
      - [API or programmatic integration, "Separate async API documented", "API claimed on Studio plan", "Not established in assigned sources", "Build internally"]
      - [Private commercial use, "Paid plans documented as private/commercial; free tier non-commercial", "Pricing claim only", "Unknown", "Depends on internal rights and assets"]
      - [Independent quality benchmark, "Not established", "Not established", "Not established", "Not applicable"]
    notes: "Cells distinguish documented product claims from unknowns; competitor-page assertions are not independent validation. “Documented” means present in an assigned source, not that the capability is universally production-ready."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Published price or model, Included capability or unit, Commercial or privacy posture, Competitive implication]
    rows:
      - [Tripo AI Free/Basic, "$0; 200 credits/month on official surface", "Approximately 8 models at roughly 25 credits each", "Public CC BY 4.0 and non-commercial according to official surface", "Low-friction trial but weak fit for private commercial production"]
      - [Tripo AI Professional, "$19.90/month or about $13.93/month annual billing on official surface", "3,000 credits/month; approximately 120 models", "Private models and commercial use", "Converts workflow value into recurring subscription and credit consumption"]
      - [Tripo AI Advanced, "$49.90/month on official surface", "8,000 credits/month", "Private models and commercial use", "Higher-throughput tier; realized usage and margins remain undisclosed"]
      - [Tripo AI API, "Usage-based credits; separate billing", "Generation, texturing, conversion, segmentation and related operations", "API keys and billing separate from Studio", "Enables embedding but exposes usage economics and reliability to diligence"]
      - [3D AI Studio, "$19/month Basic and $29/month Studio claimed by competitor page", "1,000 or 3,500 credits plus image/video tools claimed", "Competitor page claims broader suite", "Potential bundle and credit-value pressure; claims require independent verification"]
      - [Media.io, "Not compared as a like-for-like mesh subscription", "2D image/video and editing workflows", "Different deliverable and licensing question", "Substitute when the buyer needs media output, not a 3D asset"]
    notes: "Prices and credit quantities are publisher- or vendor-stated snapshots from assigned pages and may change. Credits are not treated as equivalent units across vendors, and list pricing is not realized revenue or margin."
    claimRefs: [CP005, CP007, CP008, CP009]
