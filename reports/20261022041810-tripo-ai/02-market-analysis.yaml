      comparable growth rate was supplied in the retained text.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - ["Individual creator / hobbyist", "Creator", "Creator", "Self", "Prompt or image to draft asset", "Personal software budget", "Lower barrier and faster experimentation"]
      - ["Indie game or small studio", "Studio lead", "Artist / designer", "Studio", "Generate, refine, export to engine", "Production tools budget", "Asset backlog and short iteration cycles"]
      - ["Media / VFX production", "Art or technical director", "Artists and pipeline staff", "Studio / production budget", "Generate then inspect, clean, rig and export", "Pipeline or labor budget", "Pressure on asset volume and revision time"]
      - ["E-commerce / product visualization", "Marketing or product lead", "Designer / marketer", "Brand or commerce budget", "Reference image to visual concept", "Campaign or product budget", "Need for rapid variants before production"]
      - ["Developer / platform team", "Engineering lead", "Developer", "Software / platform budget", "Async API generation and post-processing", "Infrastructure budget", "Batch volume and integration into an existing product"]
      - ["Education / research", "Instructor or researcher", "Student / researcher", "Institution", "Concept modeling and experimentation", "Program or lab budget", "Accessible tooling and reduced learning curve"]
    notes: >-
      Buyer, user, payer, and budget-owner assignments are analytical segmentation based
      on the documented workflows and use cases; the sources do not publish a verified
      customer-by-segment revenue split.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
figures:
  - id: FM001
    title: Constrained market opportunity lenses
    type: pyramid
    summary: >-
      A non-additive pyramid shows the evidence-supported progression from a broad
      creator and production universe to Tripo's currently disclosed workflow surface;
      it does not estimate TAM, SAM, or SOM.
    data:
      items:
        - label: "Broad 3D creation and production universe"
          value: "Not quantified"
          valueNote: "No comparable public spend denominator in retained sources"
        - label: "AI-assisted asset workflow users"
          value: "6.5M+ creators"
          valueNote: "Company-controlled audience figure; not equivalent to paying customers"
        - label: "Developer workflow surface"
          value: "40,000 developers"
          valueNote: "Company-distributed figure; developer activity and overlap with creators are unresolved"
        - label: "Disclosed industry-client surface"
          value: "700 industry clients"
          valueNote: "Company-distributed figure; client definition and paid status are unresolved"
        - label: "Production-workflow demand lens"
          value: "Not quantified"
          valueNote: "Use cases and bottleneck claims are directional, not a spend denominator"
        - label: "Disclosed enterprise / developer surface"
          value: "40,000 developers; 700 industry clients"
          valueNote: "Company-distributed release; definitions and overlap are unresolved"
    approximationNotes: >-
      Layers are ordered evidence lenses, not magnitude-proportional values. The
      disclosed figures are not added together and do not establish a serviceable or
      obtainable market.
    claimRefs: [CM006, CM008, CM016]
callouts:
  - calloutType: insight
    title: Market thesis
    body: >-
      Tripo's strongest market wedge is workflow acceleration for asset-heavy teams,
      where generation, preparation, and export reduce the cost of iteration without
      removing the need for expert review.
    claimRefs: [CM002, CM010, CM011]
  - calloutType: risk
    title: Sizing risk
    body: >-
      Public audience and client counts are company-controlled, use different
      denominators, and do not show paid conversion, recurring usage, or revenue.
    claimRefs: [CM006, CM015, CM016]
