      severity: material
      topic: named-customers
      missingEvidence: "Referenceable customer list with production versus pilot status, use case, outcome, spend band, and renewal status."
      whyItMatters: "Named organizations may represent different relationship types and cannot be used to estimate enterprise revenue or concentration."
      diligencePath: "Obtain permissioned customer references and a contract-level deployment schedule for the named accounts."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
