    columns: [Customer or cohort, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Riot, "Game development", "Company-reported use of Tripo models", "Not disclosed", "Named as a user by the company in independent coverage", "No project, spend, or renewal evidence"]
      - [EA, "Game development", "Company-reported use of Tripo models", "Not disclosed", "Named as a user by the company in independent coverage", "No production outcome or contract evidence"]
      - [Sony, "Games / technology", "Named enterprise user and company-reported use", "Not disclosed", "Appears on official enterprise list and in external coverage", "Relationship type and commercial scale are not disclosed"]
      - [Tencent, "Games / technology", "Named enterprise user and company-reported use", "Not disclosed", "Appears on official enterprise list and in external coverage", "Could reflect strategic affiliation rather than customer revenue"]
      - [NetEase, "Games", "Company-reported use of Tripo models", "Not disclosed", "Named in Jon Peddie coverage", "No deployment detail, outcome, or renewal evidence"]
      - [Independent KrASIA test, "Creator / product workflow", "Text-to-3D and image-to-3D evaluation", "Test, not customer deployment", "Strong results on clean inputs; output closely matched a simple reference image", "Complex-image performance and animation quality remained uncertain"]
    notes: "Enumeration is partial: the sources name selected organizations and one independent test, not a complete customer population. A named logo is not treated as proof of paid production deployment."
    enumerationScope:
      coverage: partial
      basis: "Selected named organizations and one public product test from sources fetched for this chapter on 2026-10-22; no complete customer list or account ledger is public."
    claimRefs: [CU010, CU012, CU014, CU016]
figures:
  - id: FU001
    title: Customer journey from creation to production integration
    type: journey-map
    summary: Tripo can move users from low-friction experimentation into workflow integration, but public evidence does not establish conversion or retention at any step.
    data:
      items:
        - label: Discover
          title: Discover
          description: "Creators encounter browser-based text, image, multi-view, or sketch generation."
          touchpoints: ["Free account and monthly credits", "Community and prompt discovery"]
        - label: Generate
          title: Generate
          description: "A user produces a previewable mesh and textures in seconds."
          touchpoints: ["Text-to-3D", "Image-to-3D", "Multi-view and sketch inputs"]
        - label: Refine
          title: Refine
          description: "The user improves the asset before export."
          touchpoints: ["Segmentation", "Texturing", "Retopology", "Rigging and animation"]
        - label: Integrate
          title: Integrate
          description: "The asset moves into a creator or production tool."
          touchpoints: ["GLB, FBX, OBJ, STL, and USDZ export", "Blender, Unity, and Unreal workflows"]
        - label: Expand
          title: Expand
          description: "Teams can embed generation into products or pipelines."
          touchpoints: ["REST API", "Plug-ins", "Batch or production workflows"]
        - label: Retain
          title: Retain
          description: "Durability would be demonstrated by repeat usage, renewal, or cohort expansion."
          touchpoints: ["NRR and GRR not disclosed", "Churn, renewal, ACV, and concentration not disclosed"]
    claimRefs: [CU001, CU002, CU013, CU017, CU018, CU020]
callouts:
  - calloutType: recommendation
    title: Underwrite usage quality, not logo breadth
    body: Proceed with customer diligence only after obtaining active-versus-registered definitions, paid conversion, cohort retention, customer-level ACV bands, and production references for named enterprises.
    claimRefs: [CU007, CU009, CU015, CU020]
