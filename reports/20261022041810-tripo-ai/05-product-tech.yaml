  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Independent benchmark results by asset class, input quality, latency percentile, and production failure rate.
      whyItMatters: Preview speed and feature breadth do not establish reliable output quality or operating cost for a buyer's asset mix.
      diligencePath: Request benchmark data and run a controlled evaluation on representative customer assets.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Current privacy, retention, model-training, deletion, access-control, incident-response, and service-level terms.
      whyItMatters: Hosted prompts and reference images may contain confidential customer or product information.
      diligencePath: Obtain enterprise terms, security documentation, DPA, subprocessors, and incident history under diligence access.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: minor
      topic: integrations
      missingEvidence: Independent production evidence for named DCC, engine, and API integrations.
      whyItMatters: Stated compatibility does not prove import fidelity, version stability, or successful deployment in customer pipelines.
      diligencePath: Test representative exports in each target tool and obtain customer references for production integrations.
      relatedQuestionRefs: [QE004]
    - type: stale
      severity: material
      topic: roadmap
      missingEvidence: A current product-versus-research boundary and delivery plan for Project Eden and Gaussian-splat outputs.
      whyItMatters: Research announcements can be mistaken for shipped product capability when assessing technical maturity.
      diligencePath: Ask management for a dated roadmap, availability matrix, support policy, and commercialization milestones.
      relatedQuestionRefs: [QE005, QE007]
