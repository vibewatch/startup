evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: disclosure
    missingEvidence: Audited or management-provided revenue, ARR, gross margin, customer conversion and retention by defined period.
    whyItMatters: >-
      Financing scale cannot be translated into operating quality or valuation support without recurring revenue and
      margin evidence.
    diligencePath: >-
      Request monthly or quarterly KPI schedules with definitions, cohort denominators and reconciliation to financial
      statements.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: capitalization
    missingEvidence: Priced-round documents, cap table, security preferences, dilution, debt and any secondary transaction detail.
    whyItMatters: Headline funding and unicorn status may not equal common-equity value or cash available to the business.
    diligencePath: Obtain the latest cap table, financing term sheets and debt schedule under NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, executive and succession roster with reporting lines and ownership interests.
    whyItMatters: >-
      The company appears technically founder-led, so key-person concentration and control cannot be assessed from the
      partial public roster.
    diligencePath: Request an organization chart, board materials and key-person continuity plan.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A dated metric dictionary reconciling users, creators, developers, studio clients and generated assets.
    whyItMatters: >-
      The retained sources report different populations and periods that must not be added or treated as active
      customers.
    diligencePath: Request product analytics definitions, active-period denominators and enterprise-logo verification.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      Independent global and regional spend estimates for AI 3D generation, including paid seats, API usage, and
      adjacent workflow software.
    whyItMatters: Without a comparable denominator, audience counts cannot support TAM, SAM, SOM, or valuation sensitivity.
    diligencePath: >-
      Obtain at least two independent category studies with definitions, geography, year, and methodology, then
      reconcile them to a bottom-up paid-usage model.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A dated reconciliation of the official 6.5M+ creator figure with the release's 40,000 developer and 700
      industry-client figures.
    whyItMatters: The populations may overlap or use different activity thresholds, so summing them would overstate reach.
    diligencePath: >-
      Request cohort definitions, active-versus-registered status, paid share, and customer-count reconciliation from
      management.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Segment-level conversion, ACV or API spend, retention, and workflow-volume data for creators, studios, and
      enterprise developers.
    whyItMatters: The market opportunity depends on recurring paid usage, not the size of the free community.
    diligencePath: >-
      Request anonymized cohort tables covering plan mix, credits consumed, renewal, customer concentration, and API
      volume.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitive-benchmark
    missingEvidence: >-
      Controlled tests using the same asset set, prompt inputs, acceptance criteria, latency, cleanup minutes, and total
      cost across Tripo and named competitors.
    whyItMatters: >-
      Without common test conditions, positioning scores and competitor claims cannot establish a durable quality or
      cost advantage.
    diligencePath: >-
      Run a buyer-side bake-off with representative props, characters, mechanical parts, and multi-view inputs; record
      pass rates and artist rework.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Enterprise conversion, renewal, churn, seat expansion, API utilization, realized price, and customer concentration
      by cohort.
    whyItMatters: A large user base and named customers do not prove recurring revenue quality or switching costs.
    diligencePath: >-
      Request cohort retention, gross and net revenue retention, ACV bands, logo concentration, and representative
      contract terms under NDA.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: commoditization
    missingEvidence: >-
      Current quality, licensing, compute, and distribution comparison for open-source and bundled platform
      alternatives.
    whyItMatters: Free or bundled systems could compress standalone pricing before Tripo's workflow advantage becomes durable.
    diligencePath: >-
      Track release cadence and benchmark open alternatives quarterly against Tripo on accepted production assets and
      total workflow cost.
    relatedQuestionRefs:
      - QP005
      - QP010
  - type: stale
    severity: minor
    topic: pricing
    missingEvidence: >-
      A dated, independently verified snapshot of current plans, credit consumption, API rates, and commercial-license
      terms.
    whyItMatters: Credit pricing and license restrictions change quickly and can alter competitor rankings.
    diligencePath: Recheck official pricing, API documentation, and terms immediately before underwriting or procurement.
    relatedQuestionRefs:
      - QP003
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Monthly recognized revenue split between Studio subscriptions and API usage, including refunds, credits,
      discounts, contract duration, and deferred revenue treatment.
    whyItMatters: >-
      Without realized revenue and recognition policy, list pricing and adoption claims cannot support an
      earnings-quality or valuation conclusion.
    diligencePath: Request management's monthly revenue bridge and accounting policy by product for the latest 24 months.
    relatedQuestionRefs:
      - QI005
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly burn, committed infrastructure and payroll obligations, debt, financing preferences, and
      downside runway.
    whyItMatters: >-
      Funding raised is not cash available, and model research plus infrastructure spending may create continuing
      financing dependency.
    diligencePath: Obtain the latest balance sheet, cash-flow forecast, cap table, financing documents, and a 24-month downside case.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Paid conversion, cohort retention, API utilization, compute cost per task, support and rework cost, and gross
      margin by plan.
    whyItMatters: >-
      These inputs determine whether the credit model scales as recurring software revenue or remains compute-heavy and
      service-intensive.
    diligencePath: >-
      Request cohort, usage, infrastructure-cost, and contribution-margin schedules segmented by Studio plan and API
      workload.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Independent benchmark results by asset class, input quality, latency percentile, and production failure rate.
    whyItMatters: >-
      Preview speed and feature breadth do not establish reliable output quality or operating cost for a buyer's asset
      mix.
    diligencePath: Request benchmark data and run a controlled evaluation on representative customer assets.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: Current privacy, retention, model-training, deletion, access-control, incident-response, and service-level terms.
    whyItMatters: Hosted prompts and reference images may contain confidential customer or product information.
    diligencePath: Obtain enterprise terms, security documentation, DPA, subprocessors, and incident history under diligence access.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: integrations
    missingEvidence: Independent production evidence for named DCC, engine, and API integrations.
    whyItMatters: >-
      Stated compatibility does not prove import fidelity, version stability, or successful deployment in customer
      pipelines.
    diligencePath: Test representative exports in each target tool and obtain customer references for production integrations.
    relatedQuestionRefs:
      - QE004
  - type: stale
    severity: material
    topic: roadmap
    missingEvidence: A current product-versus-research boundary and delivery plan for Project Eden and Gaussian-splat outputs.
    whyItMatters: Research announcements can be mistaken for shipped product capability when assessing technical maturity.
    diligencePath: Ask management for a dated roadmap, availability matrix, support policy, and commercialization milestones.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer-level cohorts showing active accounts, paid conversion, renewal, churn, NRR, GRR, and contract duration.
    whyItMatters: Broad creator counts and logos do not establish recurring revenue quality or durable customer value.
    diligencePath: Request a monthly cohort export by plan and segment, with active-account definitions and reconciled paid revenue.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Referenceable customer list with production versus pilot status, use case, outcome, spend band, and renewal
      status.
    whyItMatters: >-
      Named organizations may represent different relationship types and cannot be used to estimate enterprise revenue
      or concentration.
    diligencePath: Obtain permissioned customer references and a contract-level deployment schedule for the named accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, channel contribution, geographic mix, and expansion by account.
    whyItMatters: A few strategic relationships could drive visibility without proving a diversified commercial base.
    diligencePath: >-
      Request revenue by customer and channel for the latest twelve months, including concentration thresholds and
      renewal dates.
    relatedQuestionRefs:
      - QU008
  - type: access-blocked
    severity: minor
    topic: procurement
    missingEvidence: Enterprise security, privacy, data residency, and SLA materials tied to customer procurement.
    whyItMatters: Cloud processing of proprietary assets may slow or prevent adoption in security-sensitive organizations.
    diligencePath: Review the enterprise DPA, security questionnaire responses, regional processing options, and uptime commitments.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: legal-regulatory
    missingEvidence: >-
