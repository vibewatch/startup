companyProfile:
  summary: >-
    Tripo AI is VAST's Beijing-founded 3D generative AI business. Its product surface spans Tripo Studio, a developer
    API, plugins, community products, and research directions including TripoSplat and Project Eden. The evidence
    supports a broad workflow from text, images, and sketches through mesh generation, editing, rigging, animation, and
    export, while financial and customer economics remain largely private.
