company:
  name: Tripo AI
chapter:
  number: 1
  title: Company Overview
  summary: Tripo AI is VAST's Beijing-founded 3D generative AI business, combining browser software, APIs and plugins to turn text, images and sketches into editable 3D assets. Public evidence supports a rapidly expanding product and financing footprint, but revenue, cap-table terms and independently verified customer economics remain undisclosed.
sections:
  - id: identity-and-product
    title: Identity, product and operating footprint
    body: >-
      Tripo AI is presented across the retained evidence as a VAST-built platform rather than a
      standalone model: it combines Tripo Studio, a developer API, plugins and community products.
      Independent coverage describes VAST as founded in 2023 and based in Beijing, while the company
      site describes text, image, multi-view and sketch inputs that become meshes, textures and
      materials. The product is designed to move beyond a single generation step into segmentation,
      texturing, retopology, rigging, animation and export. The clearest operating limitation is
      also explicit: complex faces, mechanical parts and demanding deformation can still require
      manual review. Public evidence does not establish a legally precise corporate structure,
      headquarters split, employee count or revenue model by product line.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and key-person dependence
    body: >-
      The available leadership record is concentrated in a small technical founding group. KrASIA
      identifies CEO Simon Song, CTO Liang Ding and research leader Yanpei Cao, linking Song and
      Ding to SenseTime and Cao to Tencent; it also reports Song's prior MiniMax co-founding role.
      The 2026 coverage independently repeats the core executive backgrounds, which supports a
      founder-led technical narrative but not a complete governance map. No retained source names a
      board, independent directors, succession plan, CFO or formal control rights. That missing
      governance evidence matters because the company is raising capital quickly and expanding
      globally while relying on specialized research leadership. The current diligence conclusion is
      therefore strong technical founder-market fit with material key-person and governance
      disclosure gaps.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing, investors and scale signals
    body: >-
      Financing announcements show a fast sequence of rounds, but the public record is not a single
      reconciled capitalization statement. The March company announcement describes $50 million
      backed by Alibaba and Baidu Ventures; later reporting describes nearly $200 million in
      extended Series A financing and a July $150 million tranche; September coverage describes
      approximately $446.4 million in Series B and B+ rounds and says six-month fundraising reached
      roughly $744 million. These are reported financing amounts, not cash available, revenue or
      valuation. A separate June report says the company reached unicorn status but notes that the
      specific valuation was not disclosed. The investor mix spans financial, strategic, gaming and
      automotive participants, while preference terms, dilution, secondaries and debt remain open
      questions.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: scale-and-gaps
    title: Milestones and evidence limits
    body: >-
      Tripo's milestone path runs from VAST's 2023 founding through a 2024 foundation-model launch,
      successive model releases, broadening workflow features, public financing and the 2026 Eden
      world-model direction. Company-reported scale is substantial but inconsistent across dated
      surfaces: the March announcement says more than 6.5 million creators, 90,000 developers and
      nearly 100 million generated assets, while June coverage reports 10 million users and 90,000
      studio clients. Those populations and definitions are not shown to be identical, so they
      should not be combined. The retained evidence does not verify ARR, recognized revenue, gross
      margin, conversion, retention, headcount, customer concentration or valuation. Those are
      material gaps for underwriting and should be requested directly with denominator and period
      definitions.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
