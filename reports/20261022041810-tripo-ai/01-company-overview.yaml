  - calloutType: strength
    title: Technical founder-market fit
    body: "The retained profiles consistently connect Tripo's leadership to prior SenseTime, Tencent and MiniMax experience while the product expands from generation into production workflow tooling."
    claimRefs: [CO005, CO006, CO007]
