  - id: FI001
    title: Activity-to-economics evidence bridge
    type: flow
    summary: >-
      The public record shows routes from creator or developer activity into credit-metered offers, but conversion,
      revenue, direct cost, and cash remain undisclosed.
    data:
      nodes:
        - id: demand
          label: Creator and enterprise activity
          value: Reach is reported; active paid cohorts are unavailable
          detail: User and company counts are adoption signals, not revenue.
        - id: studio
          label: Studio credit subscriptions
          value: Free and paid tiers reported
          detail: Realized price, discounts, and conversion are unavailable.
        - id: api
          label: Developer API usage
          value: Separate API offer; usage billing reported by one listing
          detail: Official rate card and committed volume are unavailable.
        - id: revenue
          label: Recognized revenue
          value: null
          detail: No product-level revenue or recognition policy is public.
        - id: gross-profit
          label: Gross profit
          value: null
          detail: Compute, support, rework, and gross margin are unavailable.
        - id: cash
          label: Cash runway
          value: null
          detail: Reported financing does not disclose cash, burn, or obligations.
      edges:
        - from: demand
