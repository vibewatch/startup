      - number: '4.3'
        title: Financing supports investment, but runway remains unproven
        blocks:
          - type: paragraph
            body: >-
              Recent disclosures report nearly $200 million across Series A+ and A++ rounds in June 2026 and a further
              $150 million Series A3 round in July. The Company Overview owns the full financing chronology; here those
              rounds matter only as evidence of financing access and dependency. Company-issued and trade sources say
              the capital is intended for foundation and world models, algorithms, data infrastructure, global
              commercialization, and talent. A company-distributed October headline also announced EdenLive, showing
              that product investment continued after the rounds. None of this establishes cash available: funding
              raised is not cash on hand, and the assigned sources disclose neither burn, debt, preferred terms,
              committed infrastructure spend, nor runway. Capital adequacy requires a monthly cash bridge, financing
              obligations, and a downside plan tied to a next-round trigger.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Revenue quality and capital efficiency remain diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Tripo is monetization-visible but financially disclosure-light. The positive case is a concrete credit
              architecture, separate consumer and developer monetization paths, reported enterprise adoption, and
              repeated access to equity capital. The adverse case is equally material: public user and customer counts
              are not paying cohorts, list pricing is not realized revenue, production cleanup can impair willingness to
              pay or contribution margin, and ambitious model, infrastructure, and talent spending can consume capital
              before recurring demand is proven. No defensible SaaS, marketplace, or infrastructure multiple can be
              grounded in the assigned evidence because revenue, growth, gross margin, retention, cash, and burn are
              unavailable. The financial stance should remain conditional until management supplies product-level
              accounting, cohort retention, direct compute and support costs, customer concentration, and a reconciled
              cash forecast.
