  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Tripo AI is presented across the retained evidence as a VAST-built platform rather than a standalone
              model: it combines Tripo Studio, a developer API, plugins and community products. Independent coverage
              describes VAST as founded in 2023 and based in Beijing, while the company site describes text, image,
              multi-view and sketch inputs that become meshes, textures and materials. The product is designed to move
              beyond a single generation step into segmentation, texturing, retopology, rigging, animation and export.
              The clearest operating limitation is also explicit: complex faces, mechanical parts and demanding
              deformation can still require manual review. Public evidence does not establish a legally precise
              corporate structure, headquarters split, employee count or revenue model by product line.
