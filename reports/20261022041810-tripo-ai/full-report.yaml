        - Defer entry unless verified economics and a materially lower documented price offset the risks.
        - Plausible but not quantifiable from public data
        - Quality limitations persist or preferences and dilution dominate the headline valuation.
    notes: >-
      Qualitative scenarios intentionally omit unsupported valuation ranges, multiples, and numeric probabilities;
      private-round references are context rather than operating comparables.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
