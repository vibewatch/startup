  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Tripo AI's customer-facing product is a browser workspace rather than a locally installed modeling
              package. A reviewed third-party product page describes text-to-3D, single-image and multi-view generation,
              sketch-to-3D, segmentation, texturing, rigging, animation, and export. Users can generate an asset,
              inspect it in the browser, refine geometry or texture, and move the result into tools such as Blender,
              Unity, or Unreal. An independent technical description similarly characterizes the platform as a connected
              workflow for structured topology, segmentation, texturing, rigging, animation, and export. This workflow
              positioning matters because the product's value is not only first-pass visual generation: it is the
              reduction of handoff friction between ideation and downstream production. Evidence still describes outputs
              as starting points for many professional uses, not as a universal replacement for modeling or CAD.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE009
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE016
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The operating model is cloud inference with browser delivery and a separate developer API. An independent
              product directory reports that generation and editing run on Tripo servers, so a local GPU is not required
              for the hosted workflow; its discussion of open-source TripoSplat distinguishes that hosted path from a
              self-hosted PyTorch workload. The official API was not retained in this evidence set, but a third-party
              product page describes an asynchronous API in which an application submits a task, receives a task ID, and
              polls or receives a callback before downloading results. The same page separates Studio subscriptions from
              API keys and usage-based billing. This creates a scalable integration surface, but it also makes service
              availability, queueing, API-version continuity, and cloud data handling central dependencies for
              production users.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE009
              - CE011
              - CE016
      - number: '5.3'
        title: Maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              Tripo differentiates through a choice of geometry paths and an expanding workflow surface. A reviewed
              third-party product page describes a high-detail path and Smart Mesh for low-poly output, while an
              external technical interview reports that Smart Mesh is intended for structured real-time geometry and
              that high-detail generation can reach up to two million polygons. The same interview says complex faces,
              strict mechanical parts, and demanding deformation can still require manual review. TripoSplat adds a
              distinct open-source Gaussian-splat research line, but the product-directory evidence says the commercial
              production path still ends in a mesh and that Gaussian output as the final delivered format was described
              as in development. The defensible moat is therefore workflow integration, model iteration, and ecosystem
              reach rather than proof of fully autonomous production assets.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Reliability, trust, and roadmap risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies several practical controls and several unresolved risks. A third-party product
              page distinguishes public, non-commercial Basic-plan models from private commercial-use paid plans, and
              says API callback URLs must use HTTPS. It also directs users to review the privacy policy and terms for
              data-retention specifics rather than claiming a complete public security specification. Product maturity
              is similarly mixed: Smart Mesh is presented as a fast structured path, while external technical commentary
              says final assets may need scale, material, topology, skinning, or joint-placement checks.       A
              company-issued syndicated headline announces EdenLive as real-time generative rendering, while a separate
              technical interview describes Project Eden as a research preview focused on persistent state and
              multiplayer environments, not a general-purpose game engine today. Diligence should therefore test
              reliability by asset class, API service levels, incident history, retention and training terms, and the
              boundary between shipped product and roadmap research.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow integration is the clearest product advantage
            body: >-
              The reviewed evidence supports a broad path from multimodal input through editing and export, with a
              browser workspace, API, and DCC/engine integrations. That is a more specific advantage than generic claims
              of faster image generation.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
          - type: callout
            title: Production readiness is asset- and destination-dependent
            body: >-
              External technical evidence explicitly retains manual review for complex faces, strict mechanical parts,
              deformation, scale, materials, topology, and joint placement. A buyer should validate those failure modes
              on its own asset mix rather than extrapolate from seconds-to-preview claims.
            calloutType: risk
            claimRefs:
              - CE010
              - CE016
          - type: callout
            title: Security and roadmap boundaries need direct diligence
            body: >-
              The reviewed product surface describes HTTPS callbacks and plan-level privacy controls but points to
              separate legal documents for retention and privacy specifics; Project Eden is described as research rather
              than a general-purpose engine.
            calloutType: assumption
            claimRefs:
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              Tripo serves several distinct customer groups rather than one homogeneous account base. A retained product
              guide and independent interview coverage describe browser-based Studio users who want rapid asset
              creation, developers and companies integrating through an API, and creators using community experiences.
              External coverage adds game developers, product designers, architecture and e-commerce users, while the
              platform also names applications in animation, AR/VR, education, industrial design, and 3D printing. These
              are different buying motions: a hobbyist or individual creator may value a free credit allowance and
              iteration speed, whereas an enterprise team needs commercial rights, predictable output, API integration,
              data handling, and production support. The available evidence supports segment breadth and workflow
              relevance, but it does not disclose segment-level revenue, active-account definitions, conversion, or
              contract values.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU008
              - CU009
              - CU017
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU013
              - CU017
              - CU018
              - CU020
      - number: '6.2'
        title: Adoption and usage signals
        blocks:
          - type: paragraph
            body: >-
              A March 2026 company release claimed more than 6.5 million creators and 90,000 developers worldwide. In an
              August 2026 interview published by Jon Peddie Research, Tripo named Riot, EA, Sony, Tencent, and NetEase
              among companies it says it works with. These are different evidence classes: self-reported aggregate reach
              and company-supplied relationships in independent interview coverage, not audited active, paying, or
              production customer data. A Tripo3Ds.com guide separately names Tencent, Sony, and HTC as enterprise
              users, but its unknown issuer and lack of methodology do not provide independent corroboration. The
              signals support broad distribution and enterprise awareness, while leaving paid conversion, activity
              definitions, deployment depth, geography, and revenue contribution unresolved.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU013
      - number: '6.3'
        title: Named customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where a source describes a concrete workflow or customer-facing use, and weakest
              where a logo wall is the only signal. KrASIA independently tested image-to-3D and reported that a simple
              reference image produced a closely matching model, while separately observing animation artifacts and
              uncertainty on more complex inputs. Jon Peddie records company-reported relationships across major game
              and technology companies, but does not provide production status, outcomes, ACV, renewal, or customer
              references. The current public record contains no reliable NRR, GRR, churn, renewal, cohort,
              contract-length, or customer-concentration disclosure. That absence is a material gap rather than evidence
              of weak retention; an investor should request a cohort export and referenceable production customers.
            claimRefs:
              - CU010
              - CU012
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU012
              - CU014
              - CU016
      - number: '6.4'
        title: Expansion, procurement, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Tripo has a plausible land-and-expand path: a creator can start with browser generation and then adopt the
              API or production tools, while paid plans add commercial rights. A syndicated company release announced
              EdenLive for real-time generative rendering in October 2026, and Develop3D reports that Tripo intends to
              accelerate global commercialization and enterprise-customer solutions. These broader surfaces can enlarge
              the account opportunity, but do not establish conversion, retention, willingness to pay, or enterprise
              ACV. Cloud delivery and China-based operations may also create procurement and data-residency friction for
              proprietary assets. Public sources do not identify top-customer share, channel dependence, renewal
              cohorts, or the revenue contribution of any named enterprise, so concentration and expansion remain open
              underwriting questions.
            claimRefs:
              - CU002
              - CU013
              - CU017
              - CU018
              - CU019
              - CU020
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite usage quality, not logo breadth
            body: >-
              Proceed with customer diligence only after obtaining active-versus-registered definitions, paid
              conversion, cohort retention, customer-level ACV bands, and production references for named enterprises.
            calloutType: recommendation
            claimRefs:
              - CU007
              - CU009
              - CU015
              - CU020
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Production readiness is the clearest evidence-backed operating risk. In an interview published by Jon
              Peddie Research, Tripo's chief scientist said complex faces, strict mechanical parts, and demanding
              deformation can still require manual review; two hands-on reviews similarly describe messy topology or a
              continuing cleanup pass. The investment implication is not that the product lacks utility, but that time
              saved in generation may be partly returned in quality assurance, retopology, and deformation repair.
              Rights and data governance rank alongside quality because the retained reviewer discusses limited
              treatment of training-data and IP questions, while the pool contains no primary terms, DPA, security
              attestation, or legal record. These gaps make enterprise conversion and regulated use harder to
              underwrite.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR008
              - CR010
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, licensing, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The evidence supports questions, not a finding of misconduct. A favorable but independent review says
              commercial users in legally sensitive markets should conduct diligence on IP and training data. An
              unaffiliated product-summary site describes free outputs as public under CC BY 4.0 and paid outputs as
              private with commercial rights, but that site is not Tripo's official domain and cannot establish the
              governing contract. The assigned pool also does not verify retention periods, model-training use of
              customer inputs, indemnification, audit rights, export-control processes, litigation, regulatory
              inquiries, or incident history. Those unknowns remain material because customers may submit proprietary
              images and deploy generated assets commercially. Primary agreements and counsel-led record checks are
              therefore prerequisites to treating rights or compliance controls as mitigated.
            claimRefs:
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
      - number: '7.3'
        title: Operational, quality, and technical execution
        blocks:
          - type: paragraph
            body: >-
              Quality risk is concentrated in difficult assets and final-production requirements rather than basic
              preview generation. KrASIA reported a strong result on a clean, simple reference image but left complex
              textures and busy backgrounds untested. A Reddit trial user separately said a single-image free result was
              not convincing; that is one anecdote, not a product-wide defect rate. Cloud delivery adds an unquantified
              reliability dependency, because Jon Peddie Research reports that generation runs on Tripo's servers and
              the pool supplies no uptime, queue, recovery, or service-level history. Scope is also expanding: the
              company-issued EdenLive release and the Jon Peddie interview place persistent world-model work beside an
              asset stack whose physical fidelity, computational efficiency, and environment stability remain active
              research challenges.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR012
              - CR014
      - number: '7.4'
        title: Dependencies, financial exposure, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Tripo depends on compute capacity, its own hosted Studio and API, downstream DCC and game-engine
              integrations, and a broad financing syndicate. The Robotics Media reports roughly $446 million of combined
              Series B and B+ financing and says proceeds are intended for models, data infrastructure, training and
              inference compute, product development, and commercialization. That is evidence of capital raised and
              planned uses, not cash currently available, revenue, margin, burn, or runway. Monitor asset acceptance
              without manual repair, API availability and latency, compute cost per completed task, repeat paid usage,
              rights complaints, security events, and customer or vendor concentration. Thesis-break triggers are
              repeated production rejection, a material rights or security event, persistent service degradation, or
              financing on worsening terms without verified commercial progress.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production-ready remains asset-dependent
            body: >-
              Multiple sources preserve a manual-review or cleanup requirement for complex topology, deformation, and
              difficult inputs, so diligence should measure accepted outputs rather than generation speed.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Financing raised is not runway
            body: >-
              The reported financing and intended uses do not disclose current cash, burn, margins, revenue, or
              financing terms.
            calloutType: assumption
            claimRefs:
              - CR009
              - CR010
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Evidence base and investment thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Tripo AI combines capital access with a broad 3D-production workflow rather
              than offering only a prompt-to-model demo. DealStreetAsia and WOWTALE separately reported roughly $446
              million across Series B and B+ rounds, while DEVELOP3D reported a further $150 million extended Series A
              tranche earlier in 2026. Jon Peddie Research and a company-authored directory listing describe a suite
              spanning a browser workspace, API, plugins, topology, texturing, rigging, animation, and export. A company
              release also claimed 6.5 million creators, 90,000 developers, and nearly 100 million generated assets.
              These scale figures are company-issued and do not establish paid usage, retention, revenue, or cash
              available. The thesis is therefore credible enough to track, but it remains conditional on converting
              product breadth and usage into durable, profitable customer economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Price sensitivity, comparables, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The retained evidence provides one historical price marker rather than a defensible current valuation.
              DealStreetAsia reported that June 2026 financing pushed VAST's valuation past $1 billion, but no assigned
              source states the Series B/B+ post-money valuation, share price, dilution, liquidation preference, or
              secondary component. WOWTALE reported two adjacent private-capital references: Meshy raised nearly $400
              million at a $1.5 billion valuation, and World Labs raised $1 billion. Those rounds show investor appetite
              for AI-generated 3D and world-model companies, but they are not operating-multiple benchmarks because
              aligned revenue, growth, margin, and retention denominators are absent. The scenario framework therefore
              uses evidence gates rather than invented valuation ranges or return probabilities. Any premium entry
              requires verified economics and common-equity terms; absent those, financing size is context, not price
              support.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Recommendation, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The appropriate call is track/research-more with medium confidence and a stretched-or-unknown valuation
              stance. Independent product evidence is balanced: KrASIA found strong results on selected prompts and a
              clean reference image, but also observed variable rigging and left complex-image performance unresolved.
              Tripo's chief scientist separately told Jon Peddie Research that demanding faces, mechanical parts, and
              deformation can still require manual review. A current company announcement of EdenLive signals continued
              roadmap activity, not commercialization or exit readiness. Before entry, diligence should obtain the
              current cap table and preference stack, audited or management revenue bridges, Studio-versus-API margins,
              paid-conversion and retention cohorts, customer concentration, and evidence that production use lowers
              downstream labor. Thesis-break triggers are weak paid retention, persistent cleanup requirements,
              unfavorable preference overhang, or a requested price that cannot be reconciled to verified operating
              metrics.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track / research-more. The assigned evidence supports product and financing momentum, but not a defensible
              current price or common-equity return case.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              Defer entry if paid retention, production reliability, or terms protecting common equity cannot be
              demonstrated at a price reconciled to verified economics.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
