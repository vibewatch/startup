              - CP011
              - CP012
      - number: '3.2'
        title: Capability and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              Tripo's differentiator is workflow depth, but sources do not establish a controlled benchmark against
              every rival. The official product surface lists a free tier, paid private and commercial-use plans, Smart
              Mesh, high-detail generation, PBR texturing, segmentation, rigging, exports, and an API. Jon Peddie gives
              a separate account of Smart Mesh as structured low-poly geometry and says high-detail output can reach two
              million polygons in the interviewed product version; the official surface shown in the pool gives a lower
              roughly 500,000-polygon current-model description and says product specifications change. Those figures
              should not be collapsed into a single universal limit. A competing 3D AI Studio page claims lower cost per
              credit and faster generation, but it is a vendor-authored comparison and its arithmetic is not an
              independent benchmark. Media.io similarly frames itself as a 2D alternative, not a mesh competitor.
              Pricing and license terms therefore create a segmentation axis: low-cost exploration, private commercial
              production, high-volume API use, and workflows that avoid 3D entirely.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Tripo's moat is more likely to depend on consistent, editable outputs and integration than on raw
              generation novelty. Jon Peddie's interview explicitly says complex faces, hero characters, strict
              mechanical parts, and joint deformation can still require manual review, and the Medium hands-on account
              warns that attractive models may have messy meshes and topology that require repair. That preserves a role
              for artists and makes cleanup time a key switching-cost and retention metric. At the same time,
              PlanetTools describes Tencent's open systems and Google's platform depth as pressure on a specialist,
              while Develop3D reports new financing and continued investment by Tripo in foundation and world models.
              The competitive risk is a narrowing gap between free or bundled “good enough” generation and paid workflow
              reliability. Tripo can mitigate that risk through reproducibility, enterprise licensing, API reliability,
              integrations, and measurable reduction in downstream rework, but the assigned sources do not provide
              churn, renewal, realized pricing, or an independent quality benchmark.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow depth is the clearest differentiation
            body: >-
              The strongest evidence-backed distinction is the connected path from generation to structured geometry,
              materials, rigging, animation, export, and API integration, not a claim that every generated asset is
              final-production quality.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP006
          - type: callout
            title: The moat is exposed to free and bundled alternatives
            body: >-
              Open-source systems and broader creative platforms can compress price and make generation interchangeable;
              Tripo must prove lower downstream rework and durable enterprise usage rather than rely on user counts or
              one-off visual quality.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP013
  - number: 4
    title: Financials
