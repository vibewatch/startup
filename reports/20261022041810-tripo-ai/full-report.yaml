  - id: FE001
    title: Tripo product architecture map
    type: stack
    summary: >-
      Tripo combines multimodal inputs, cloud generation, browser editing, integration outputs, and a separate research
      layer.
    data:
      layers:
        - label: Inputs
          detail: Multimodal references enter the hosted generation workflow
          items:
            - label: Text
              detail: Prompt-based object description
            - label: Image and multi-view
              detail: Single photo or several reference views
            - label: Sketch
              detail: Rough drawing as a generation input
        - label: Generation
          detail: Model paths produce dense or structured geometry
          items:
            - label: High-detail path
              detail: Dense geometry for visual and print-oriented use
            - label: Smart Mesh
              detail: Structured low-poly geometry for real-time use
        - label: Refinement
          detail: Browser tools prepare assets for downstream use
          items:
            - label: Segmentation and retopology
              detail: Prepare structured editable parts
            - label: Texturing
              detail: PBR textures and local Magic Brush edits
            - label: Rigging and animation
              detail: Prepare characters and motion
        - label: Delivery
          detail: Exports, API tasks, and plugins connect to production tools
          items:
            - label: Studio export
              detail: GLB, FBX, OBJ, STL, USDZ, and related formats
            - label: API integration
              detail: Third-party-described async task submission, polling or callback, and download
            - label: DCC and engine plugins
              detail: Blender, Maya, Unity, Unreal, and other integrations
        - label: Research extension
          detail: Open research extends beyond the currently described mesh workflow
          items:
            - label: TripoSplat
              detail: Open-source Gaussian-splat model
            - label: Project Eden
              detail: Research preview for persistent interactive worlds
        - label: Quality and controls
          detail: Licensing, callbacks, and customer diligence govern deployment
          items:
            - label: Plan-level rights
              detail: Public Basic models versus private paid-plan models
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
      - CE011
      - CE016
  - id: FU001
    title: Customer journey from creation to production integration
    type: journey-map
    summary: >-
      Tripo can move users from low-friction experimentation into workflow integration, but public evidence does not
      establish conversion or retention at any step.
    data:
      items:
        - label: Discover
          title: Discover
          description: Creators encounter browser-based text, image, multi-view, or sketch generation.
          touchpoints:
            - Free account and monthly credits
            - Community and prompt discovery
        - label: Generate
          title: Generate
          description: A user produces a previewable mesh and textures in seconds.
          touchpoints:
            - Text-to-3D
            - Image-to-3D
            - Multi-view and sketch inputs
        - label: Refine
          title: Refine
          description: The user improves the asset before export.
          touchpoints:
            - Segmentation
            - Texturing
            - Retopology
            - Rigging and animation
        - label: Integrate
          title: Integrate
          description: The asset moves into a creator or production tool.
          touchpoints:
            - GLB, FBX, OBJ, STL, and USDZ export
            - Blender, Unity, and Unreal workflows
        - label: Expand
          title: Expand
          description: Teams can embed generation into products or pipelines.
          touchpoints:
            - REST API
            - Plug-ins
            - Batch or production workflows
        - label: Retain
          title: Retain
          description: Durability would be demonstrated by repeat usage, renewal, or cohort expansion.
          touchpoints:
            - NRR and GRR not disclosed
            - Churn, renewal, ACV, and concentration not disclosed
    claimRefs:
      - CU001
      - CU002
      - CU013
      - CU017
      - CU018
      - CU020
