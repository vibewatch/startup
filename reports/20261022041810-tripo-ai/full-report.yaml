  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set spans specialist 3D generators, broader creative suites, open or
              platform-backed model ecosystems, and the status quo of manual modeling or internal production teams.
              Tripo is positioned around a workflow that starts with text, images, multi-view references, or sketches
              and continues through segmentation, texturing, retopology, rigging, animation, and export. Jon Peddie
              Research describes Tripo Studio as an AI-native workspace and separately identifies an API, plug-ins, and
              a creator community, while KrASIA reports multimodal inputs, customization, rigging, and common exports.
              That is a different buying proposition from a 2D media tool: Media.io's own comparison says its value is
              for image, video, and marketing deliverables rather than a downloadable mesh. The practical buyer question
              is therefore not which product has the best demo, but whether the customer's next production step is a 3D
              engine, DCC package, printer, or a 2D campaign.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
