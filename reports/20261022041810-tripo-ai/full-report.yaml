        title: Adoption and speed do not establish efficient growth
        blocks:
          - type: paragraph
            body: >-
              The unaffiliated product listing claims more than 6.5 million creators and names Tencent, Sony, and HTC,
              while a Jon Peddie Research interview reports that Tripo works with hundreds of companies. These are
              useful demand signals but do not reveal paid accounts, annual recurring revenue, active usage, enterprise
