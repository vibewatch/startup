  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is software and usage-based infrastructure that converts text, images, multi-view
              references, or sketches into editable 3D assets and helps move those assets toward a production tool or
              engine. This boundary includes generation, topology or part processing, texturing, rigging, animation,
              export, and API integration when those capabilities are part of the same workflow. It excludes
              general-purpose CAD, photogrammetry services, game engines, and bespoke modeling labor except as
              substitutes or downstream complements. KrASIA describes Tripo as generating textured models from text or
              image prompts and identifies Blender, Unity, and Unreal as downstream tools; Jon Peddie similarly
              describes Studio, API, plugins, and an integrated preparation workflow. The status quo is therefore not
              one competitor: it is manual blocking and refinement in DCC software, CAD for precision work, and
              combinations of separate generation, retopology, texturing, rigging, and engine tools. The economic wedge
              is the time and experimentation saved before final human review, not automatically the value of the final
              asset. Lorphic's practical review explicitly characterizes the tradeoff as speed versus control and says
              generated geometry is approximate rather than manufacturing-grade.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports multiple directional sizing lenses but not a single additive market total. The
              first lens is a horizontal creator and developer workflow: a company-distributed Yahoo/ACCESS release
              reports more than 6.5M creators, over 40,000 developers, and more than 700 industry clients. Those
              company-controlled figures use different populations, so they cannot be summed or treated as paying
              customers. The second lens is professional production: Jon Peddie describes use cases spanning games,
              printing, product design, animation, AR/VR, media production, e-commerce, education, and industrial
              design, and reports a monthly-credit consumer plan alongside paid plans. The third lens is high-fidelity
              media production, where Tripo's official 2026 page describes a workflow bottleneck and presents
              directional time and cost claims; those claims are marketing evidence, not an independent market forecast.
              No retained source provides a comparable global spend denominator, paid penetration, or Tripo-specific
              serviceable segment. The resulting sizing view should be read as a constrained adoption map rather than a
              TAM claim.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM008
              - CM016
      - number: '2.3'
        title: Buyer segmentation, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map separates the person requesting an asset from the budget owner and from the workflow that
              determines whether the output is useful. Individual creators and small teams buy credits for ideation,
              prototypes, and low-risk production work; studios and enterprise production groups need repeatable
              throughput, commercial rights, exports, and integration; developers and platform teams need asynchronous
              API access and predictable usage billing. Jon Peddie records separate Studio and API products and says the
              API covers generation, texturing, segmentation, retopology, rigging, and animation. The adoption trigger
              is a backlog of assets or iteration cycles where faster first drafts have clear value. The principal
              constraints are output quality, cleanup, topology and deformation requirements, licensing, workflow
              integration, and trust in consistency. Jon Peddie's interview records that complex faces, strict
              mechanical parts, and demanding deformation may still require manual review; Lorphic likewise says
              manufacturing precision and regulatory constraints remain poor fits. Pricing and rights are also gating
              factors: Jon Peddie reports free, Professional, and Advanced plans, with full commercial rights attached
              to the two paid plans. These constraints make conversion to paid, recurring production usage the key
              unresolved market question.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: What the evidence does not yet establish
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish the denominator needed to value this market: there is no audited
              spend pool for AI 3D generation, no independent estimate of paid seats or API volume, and no comparable
              definition of an enterprise customer. The company-distributed ACCESS release also combines different scale
              frames: more than 6.5M creators, more than 40,000 developers, and more than 700 industry clients. These
              may represent overlapping populations or different activity definitions, but the distinction is not
              resolved by the available text. The official media-production page includes dramatic percentage claims
              about time, cost, and asset demand without a methodology, while Jon Peddie's independent trade coverage
              provides workflow descriptions and limitations but not a market forecast. A diligence-grade sizing model
              therefore needs paid conversion, annualized usage, customer segmentation, retention, and third-party
              category spend. Until those are available, the market supports a trackable adoption thesis rather than a
              precise top-down valuation input.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market thesis
            body: >-
              Tripo's strongest market wedge is workflow acceleration for asset-heavy teams, where generation,
              preparation, and export reduce the cost of iteration without removing the need for expert review.
            calloutType: insight
            claimRefs:
