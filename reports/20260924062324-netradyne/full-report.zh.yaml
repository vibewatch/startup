companyProfile:
  summary: >-
    Netradyne 总部位于 San Diego，是一家非上市公司，销售 Driveri
    车队安全与管理平台。平台整合车载摄像头、边缘智能、驾驶员辅导、车联网（Telematics）、合规工作流、系统集成和隐私控制。公开材料为其产品和客户案例提供了有力佐证；公司于 2025 年 1 月宣布完成 $90 million
    Series D，并展现出广泛的国际化布局意图。不过，财务指标和诉讼应对态势仍未公开。
