      - - 基准
        - 赛道和证明不错，但私有指标不完整
        - 增长中等，硬件毛利率参差
        - 合理估值需要打折
        - 需要数据室
      - - 悲观
        - 隐私、竞争或单元经济性偏弱开始反噬
        - 采用放慢，并需法律准备金
        - 下轮降估值或结构化融资风险
        - 盯紧诉讼和留存
      - - 下行触发因素
        - 同意授权控制未通过审计
        - 案件或客户阻力恶化
        - 倍数压缩
        - 暂停投资
    notes: 各行汇总已审阅公开证据；null 或定性单元格表示私营公司数据未公开披露。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
