company:
  name: Axiom Space
chapter:
  number: 1
  title: Company Overview
  summary: Axiom Space is a Houston-based private human-spaceflight and orbital-infrastructure company founded in 2016 by Kam Ghaffarian and Michael Suffredini. By the 2026-06-06 run date, the company had completed four private ISS missions, was building Axiom Station and the AxEMU lunar suit, and had disclosed at least $955 million of cumulative financing through February 2026, while adverse reporting and a NASA OIG audit highlighted execution, schedule, and transparency risk.
sections:
  - id: identity-model
    title: Identity, Headquarters, and Operating Model
    body: "Axiom Space describes itself as a human space exploration company that is building era-defining space infrastructure and technology-driven services. The official site, careers copy, and February 2026 financing release all center the same operating thesis: monetize commercial human spaceflight to the International Space Station today while building the longer-lived infrastructure stack for low-Earth orbit tomorrow. That stack includes Axiom Station, private astronaut missions, microgravity research, in-space manufacturing, orbital data-compute offerings, and lunar/low-Earth-orbit spacesuits. The company says it was founded in 2016 by Kam Ghaffarian and Michael Suffredini, and multiple official releases describe it as Houston-based. NASA mission pages corroborate that Axiom has become the agency’s repeat private-astronaut-mission counterpart, while the company’s own mission pages frame Ax-1 through Ax-4 as both stand-alone revenue events and precursors to station demand creation. This supports a practical one-line description: Axiom is a private, late-stage space-infrastructure company that sells access, mission services, and enabling hardware around a future commercial successor to the ISS."
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO038
