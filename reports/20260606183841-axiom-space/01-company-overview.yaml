  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: board-governance
      missingEvidence: Current board roster, committee structure, and governance rights by investor.
      whyItMatters: Board composition and committee control determine oversight quality and founder/investor power balance.
      diligencePath: Request board deck index, cap table governance summary, and current board consent matrix.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO002
        - TO003
    - type: conflicting-data
      severity: material
      topic: total-raised
      missingEvidence: A reconciled financing ledger explaining the gap between supportable disclosed funding and higher database-style total-funding figures.
      whyItMatters: Capital sufficiency, leverage, and dilution analysis depend on knowing whether additional debt or closed rounds exist.
      diligencePath: Request financing schedule by round with close dates, debt instruments, warrants, and post-money valuations.
      relatedQuestionRefs:
        - QO014
      relatedTableRefs:
        - TO001
        - TO003
    - type: private-evidence-only
      severity: material
      topic: current-headcount
      missingEvidence: Current full-time employee count and post-2024 workforce trend.
      whyItMatters: Headcount is a key proxy for burn, program capacity, and whether the company has rebuilt after reported layoffs.
      diligencePath: Request HR census, org chart by function, and monthly ending headcount since 2024-01-01.
      relatedQuestionRefs:
        - QO023
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: revenue-customers
      missingEvidence: Current revenue, mission profitability, customer count, and contracted backlog by product line.
      whyItMatters: Without these metrics, investors cannot judge whether valuation and capital intensity are supported by commercial traction.
      diligencePath: "Request monthly revenue by segment, customer roster, mission P&Ls, and booked backlog by contract."
      relatedQuestionRefs:
        - QO024
      relatedTableRefs:
        - TO001
    - type: stale
      severity: material
      topic: station-schedule
      missingEvidence: A current integrated master schedule for the first two station modules and key supplier milestone status.
      whyItMatters: Axiom’s post-ISS strategy depends on station timing; schedule slip can impair the business model.
      diligencePath: Request module manufacturing schedule, NASA interface milestones, and contingency plan if ISS transition timing compresses.
      relatedQuestionRefs:
        - QO015
        - QO018
      relatedTableRefs:
        - TO004
