companyProfile:
  summary: >-
    Axiom Space is a Houston-based private space-infrastructure company founded in 2016
    that monetizes private astronaut missions, microgravity research access, and
    NASA-linked development work while building the longer-term Axiom Station platform and
    AxEMU spacesuit program. Public evidence shows real execution proof in four completed
    ISS missions, five consecutive NASA private-astronaut-mission awards,
    sovereign-customer demand, and a February 2026 financing rebound after a 2025 reset.
    But the same public file leaves revenue quality, margin capture, backlog conversion,
    debt mix, and cap-table seniority largely undisclosed, so investors can underwrite
    strategic relevance and program momentum more confidently than common-equity
    economics.
  foundedDate: '2016-01-01'
  founders:
    - name: Kam Ghaffarian
      role: Co-founder & Executive Chairman
      background: null
      claimRefs: [CO001, CO011]
    - name: Michael Suffredini
      role: Co-founder; first CEO through 2024
      background: null
      claimRefs: [CO001, CO012]
  foundingLocation: Houston, TX, USA
  headquarters: Houston, TX, USA
  productSummary: >-
    Axiom sells managed private-astronaut missions to the ISS, microgravity research and
    mission integration services, and is developing Axiom Station modules plus the AxEMU
    lunar and microgravity spacesuit system. The near-term product is a NASA- and
    SpaceX-integrated mission workflow; the longer-term product is a commercial low-
    Earth-orbit platform intended to detach into a free-flying station no earlier than
    2028.
  customerFocus: >-
    NASA, sovereign astronaut programs, research institutions, payload sponsors, and
    prospective future station tenants that need human-spaceflight access or commercial
    LEO infrastructure.
  businessModel: >-
    Revenue appears to come from private-astronaut mission planning and execution,
    research and payload support, NASA-linked spacesuit development work, and eventually
    station tenancy and services if Axiom Station reaches operation. Public materials show
    willingness to pay and contract scale, but not how seat pricing, NASA payments, and
    future station economics convert into net revenue or margin.
  stage: Late-stage private
  fundingStatus: >-
    Axiom announced a $350 million February 2026 financing described publicly as a mix of
    equity and debt, after a March 2025 round around a $2.0 billion pre-money reference
    and before a CNBC/PitchBook rebound reference above $2.5 billion. Reviewed public
    financing events support a lower bound of at least $955 million of cumulative funding,
    but exact cap-table and debt terms remain undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO007, CO028, CU001, CI036, CV005, CV010, CV012, CV014]
