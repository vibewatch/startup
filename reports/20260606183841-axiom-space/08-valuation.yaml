- id: comp-lenses-and-scenario-range
  title: Comparable lenses and scenario range
  body: 'The comparable set should be used as a frame, not a formula. Public space stocks in mid-2026 show that markets will still pay heavily for option value: Rocket Lab, Planet Labs, Intuitive Machines, and even AST SpaceMobile carry multibillion-dollar capitalizations, while Virgin Galactic shows how brutally human-spaceflight stories can compress when commercial proof thins. That range cuts both ways for Axiom. It means a roughly $2.0 billion to $2.5 billion private mark is not absurd in sector context, but it also means the public winners have continuous market discovery and disclosed revenue lines. Axiom does not. The right approach is therefore scenario valuation. In the bull case, Axiom keeps the 2026 financing window open, advances AxEMU and station milestones on time, and converts sovereign mission demand into repeatable program value, supporting roughly $3.5 billion to $5.0 billion. In the base case, value stays near the 2025-2026 private reference marks at roughly $2.0 billion
    to $3.0 billion because strategic relevance persists but disclosure does not improve. In the bear case, renewed delays or another punitive financing round reset common-equity value toward roughly $0.8 billion to $1.5 billion.'
