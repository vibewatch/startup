- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Core assumptions
  - Implied equity value range (USD B)
  - What drives it
  rows:
  - - Bull
    - 20–30%
    - AxEMU and station milestones hold, sovereign mission demand remains monetizable, NASA dependence does not worsen, and new capital is raised on non-punitive terms.
    - 3.5–5.0
    - Execution and financing both improve before ISS transition pressure becomes acute.
  - - Base
    - 45–55%
    - Axiom stays strategically relevant and funds itself, but disclosure remains thin and value stays anchored near the 2025–2026 private marks.
    - 2.0–3.0
    - Strategic momentum survives, but opacity prevents a stronger rerating.
  - - Bear
    - 20–30%
    - Major schedule slippage, weaker funding conditions, or a fresh inside/down round reset common-equity value.
    - 0.8–1.5
    - Delays and financing stress transmit directly into dilution and preference overhang.
  notes: Ranges are scenario estimates rather than DCF outputs because the public record does not disclose the revenue, margin, debt, and cash data needed for a conventional private-company model.
