tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why it lands there
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Public valuation signals exist, but cap-table terms, debt, revenue conversion, and margin data remain private.
    - Do not accept the 2026 rebound mark at face value without a private diligence package.
  - - Confidence
    - Medium
    - Funding history and sector context are visible, but the economics underneath the private rounds are not.
    - Use scenario ranges and diligence sequencing rather than a single target price.
  - - Risk rating
    - High
    - Axiom combines long-cycle hardware execution, NASA-shaped demand, supplier dependence, and repeated external financing.
    - Assume another financing event is plausible before the platform is truly de-risked.
  - - Valuation stance
    - Stretched
    - The 2026 rebound outpaces the quality of public operating disclosure and may sit above a complex preferred and debt stack.
    - Treat the headline valuation as a ceiling until terms and cash conversion are shown.
  - - What changes the call
    - Lower price or cleaner evidence
    - A materially lower entry or a clean cap table plus cash-conversion evidence would improve underwriting.
    - Re-underwrite if effective common-equity entry moves closer to the 2025 reset or diligence closes the key gaps.
  notes: This table summarizes the public-only IC call; it is not a substitute for a cap-table review, debt diligence, or management-provided operating model.
