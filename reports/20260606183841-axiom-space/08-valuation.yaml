- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Evidence
  - Why it matters
  - Limitation
  - Status
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-useful public space comps for pricing Axiom as of 2026-06-06 rather than every listed aerospace or satellite company in market.
  rows:
  - - Axiom private marks
    - ~$2.0B March 2025 reset; >$2.5B February 2026 rebound reference; terms undisclosed.
    - Keeps the subject company's own reset-and-rebound path visible beside public comps.
    - Secondary marks and headlines are less reliable than public market discovery.
    - Private
  - - Rocket Lab
    - $63.72B market cap; $601.8M FY2025 revenue.
    - Shows what public markets will pay for scaled space infrastructure with disclosed revenue, backlog, and continuous price discovery.
    - Rocket Lab has much broader product and revenue diversification than Axiom.
    - Public
  - - Redwire
    - $3.65B market cap; $335.38M FY2025 revenue.
    - Useful lower-scale infrastructure comp with disclosed revenue and supplier-heavy execution profile.
    - Redwire sells components and services rather than ISS-linked human-spaceflight infrastructure.
    - Public
  - - Intuitive Machines
    - $6.37B market cap; $210.06M FY2025 revenue.
    - Helps frame how markets value NASA-linked space platforms with government-program dependence.
    - Lunar services are not a direct analog to Axiom's station-plus-missions stack.
    - Public
  - - Planet Labs
    - $11.48B market cap; $307.73M FY2026 revenue.
    - Useful reminder that public space platforms can earn meaningful value when recurring revenue is visible.
    - Planet is data-subscription driven, not human-spaceflight infrastructure.
    - Public
  - - AST SpaceMobile
    - $36.33B market cap; $70.92M FY2025 revenue.
    - Shows how aggressively public markets can price option value and future strategic positioning in space.
    - ASTS remains a telecom network buildout rather than a station or mission-services company.
    - Public
  - - Virgin Galactic
    - $413.54M market cap; $1.54M FY2025 revenue.
    - A cautionary human-spaceflight reference for what happens when commercial proof and capital efficiency disappoint.
    - Virgin Galactic's suborbital tourism model is structurally different from Axiom's mission-plus-infrastructure thesis.
    - Public
  notes: This mix intentionally spans the subject company's own private marks, scaled infrastructure comps, NASA-linked platform companies, option-value public stories, and a human-spaceflight cautionary comp because Axiom sits across several buckets but cleanly matches none of them.
