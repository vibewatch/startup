company:
  name: Axiom Space
chapter:
  number: 8
  title: Valuation
  summary: 'Axiom Space''s public valuation file supports a real reset-and-rebound narrative: a reviewed 2023 secondary high mark near $2.6 billion, a March 2025 reset around a $2.0 billion pre-money valuation, and a February 2026 rebound above $2.5 billion according to CNBC''s PitchBook reference. But the same public record still lacks clean revenue, margin, burn, debt, and preference-stack disclosure, while NASA dependence, xEVAS schedule risk, and 2024 liquidity stress reporting all keep common-equity underwriting fragile. The recommended stance is research-more, with medium confidence, high risk, and a stretched valuation stance unless price or diligence terms improve materially.'
sections:
- id: mark-history-and-public-price-support
  title: Mark history and what public evidence actually prices
  body: 'Public pricing history should be read as narrative rather than audited valuation. One reviewed 2026 secondary page places Axiom''s 2023 Series C at a roughly $2.6 billion high mark, while Sacra and an Investing.com/Bloomberg summary describe a March 2025 financing of at least $100 million at about a $2 billion pre-money valuation. That makes 2025 look like a reset rather than a continuation of the earlier peak. By February 2026 the tone improved again: Axiom announced a new $350 million financing, QIA confirmed its participation, 4iG separately closed its second tranche, and CNBC said PitchBook valued Axiom above $2.5 billion. The issue is not a lack of pricing markers; it is the quality of those markers. Axiom did not disclose the March 2025 or February 2026 share price, debt split, or preferred-stack economics. Public evidence therefore supports a three-step story—2023 high mark, 2025 reset, 2026 rebound—but not the clean common-equity economics underneath it.'
