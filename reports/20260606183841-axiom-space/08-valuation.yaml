  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-opacity
    missingEvidence: Signed 2025 and 2026 term sheets, share count waterfall, liquidation preferences, anti-dilution terms, board rights, and any secondary price discovery.
    whyItMatters: Without the actual preferred and control stack, a headline private valuation can materially overstate the value available to new common-equity money.
    diligencePath: Request the latest cap table, board-approved term sheets, investor rights agreements, and any side letters from the lead investors or company counsel.
    relatedQuestionRefs:
    - QV013
    - QV027
    - QV028
    - QV030
  - type: private-evidence-only
    severity: material
    topic: debt-schedule
    missingEvidence: The split between equity and debt in the February 2026 round, plus debt maturity, coupon or PIK terms, covenants, collateral, and any intercreditor restrictions.
    whyItMatters: Debt can subordinate fresh equity, tighten runway flexibility, and trigger forced financing even if the headline valuation appears unchanged.
    diligencePath: Obtain the debt term sheet or credit agreement, covenant model, and management's downside compliance case under delay scenarios.
    relatedQuestionRefs:
    - QV013
    - QV028
    - QV029
  - type: missing-source
    severity: blocking
    topic: revenue-conversion
    missingEvidence: Recognized revenue, gross margin, cash burn, runway, and backlog-to-cash conversion by missions, xEVAS, and station work.
    whyItMatters: The core valuation question is not whether Axiom has contracts, but whether those contracts convert into cash and margin before more financing is required.
    diligencePath: Request monthly revenue and gross-margin bridges by business line, backlog burn-down, cash-flow statements, and a 24-month liquidity plan.
    relatedQuestionRefs:
    - QV005
    - QV007
    - QV027
    - QV030
  - type: missing-source
    severity: material
    topic: demand-proof
    missingEvidence: Signed non-NASA demand evidence for future station occupancy, repeat sovereign mission pipeline, and pricing or retention data that is not purely one-off mission anecdote.
    whyItMatters: A valuation above the 2025 reset is easier to defend if Axiom can show demand that survives beyond NASA-mediated station transition policy and one mission cycle.
    diligencePath: Request station LOIs, sovereign mission pipeline by country, repeat-booking data, and any non-NASA or non-ISS commercial commitments.
    relatedQuestionRefs:
    - QV008
    - QV011
    - QV024
    - QV025
  - type: conflicting-data
    severity: material
    topic: valuation-history
    missingEvidence: Authoritative reconciliation of the 2023 high mark, the exact March 2025 share price, and whether 4iG is additive to or embedded in the 2026 financing headline.
    whyItMatters: The chapter can frame a reset-and-rebound narrative, but precision on historical marks matters when judging whether the current price is truly recovering or still below prior economics.
    diligencePath: Cross-check investor decks, board materials, legal closing sets, and any secondary or fund NAV marks with management's own financing chronology.
    relatedQuestionRefs:
    - QV001
    - QV002
    - QV004
    - QV030
    relatedTableRefs:
    - TV004
