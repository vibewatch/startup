- id: recommendation-triggers-and-diligence
  title: Recommendation, change-the-call rules, and final diligence asks
  body: 'The recommendation is research-more, with medium confidence, a high risk rating, and a stretched valuation stance. This is not a judgment that Axiom lacks strategic importance. It is a judgment that public evidence does not yet justify paying the 2026 rebound mark as if it were clean common-equity value. The call would improve for two reasons only: price or evidence. On price, an effective entry nearer the 2025 reset than the 2026 rebound—especially if it lands at or below roughly $1.5 billion to $2.0 billion on clean terms—would offer better cushion against schedule and refinancing risk. On evidence, the company could earn a stronger view by showing the 2025 and 2026 term sheets, reconciling whether 4iG is additive or inside the headline round, providing debt maturities and covenants, and proving contract value is converting into cash without margin collapse. The thesis-break triggers are equally concrete: another major AxEMU or station slip, renewed supplier-payment stress, or
    terms that subordinate fresh investors beneath a thick preferred and debt stack. Until those points are resolved, Axiom is investable only as a diligence process, not as a price-taker.'
