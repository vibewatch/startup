- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Financing access
    - Axiom has repeatedly attracted sovereign, strategic, and partner capital even after a 2024 stress period.
    - The 2026 round included debt and the exact stack remains opaque, so capital access does not equal attractive entry economics.
    - Show the 2025 and 2026 term sheets plus debt split and covenant package.
  - - Contract proof
    - '>$2.2B of customer contracts and xEVAS ceiling language show real institutional demand and program relevance.'
    - Contract headlines are not recognized revenue; OIG still frames xEVAS as schedule-sensitive milestone work rather than clean recurring economics.
    - Provide backlog-to-cash conversion, milestone acceptance, and margin by program.
  - - Human-spaceflight demand
    - Ax-4 pricing proves sovereign customers will still pay meaningful amounts for mission access.
    - Seat pricing is negotiated and bundled, so the public cannot see Axiom's retained take-rate or whether missions are attractive on contribution margin.
    - Show mission-level economics and repeat booking cadence by sovereign customer.
  - - Strategic position
    - Axiom has station, suit, mission, and NASA relationships that make the company strategically important in the post-ISS transition.
    - That same importance also means heavy dependence on NASA policy, budget design, and delivery timing.
    - Show non-NASA station demand, occupancy commitments, and post-ISS customer pipeline.
  - - Entry discipline
    - A lower effective entry could make the same asset attractive because sponsor support and strategic relevance are real.
    - Paying near the 2026 rebound without clean terms risks buying narrative and option value rather than underwritten common equity.
    - Either improve the price or materially improve the evidence file before underwriting.
  notes: The anti-thesis is not that Axiom lacks strategic relevance; it is that the public record still asks investors to infer too much beneath the private marks.
