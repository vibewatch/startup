- id: underwriting-quality-of-the-mark
  title: Contract headlines do not equal valuation support
  body: 'Axiom has enough evidence to avoid nihilism, but not enough to support price-taking. The bullish inputs are real: the 2023 release said Axiom had more than $2.2 billion of customer contracts, xEVAS is a genuine NASA procurement with billion-dollar ceiling language, Ax-4 seat pricing shows sovereign willingness to pay, and NASA''s February 2026 spacesuit update confirms technical progress. The underwriting catch is conversion. The same record says private-astronaut-mission pricing is negotiated mission by mission, OIG says xEVAS remains a milestone-based fixed-price development contract whose combined maximum has changed and could slip to 2031, and none of the reviewed public materials disclose recognized revenue, gross margin, cash burn, or backlog burn-down. Capital intensity is visible from the station''s revised 2028 free-flight target and the €110 million Thales module contract. Adverse reporting from Forbes and The Register means investors cannot ignore liquidity history. Taken
    together, Axiom has real programs and real sponsors, but public evidence is strongest at the contract headline layer and weakest at the cash-conversion layer.'
