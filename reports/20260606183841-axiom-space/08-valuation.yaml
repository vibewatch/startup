- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Fresh punitive financing
    - A new round prices below the 2025 reset or carries visibly harsh preference and debt terms.
    - Would confirm that the 2026 rebound did not fix common-equity economics.
    - Re-rate toward avoid unless the price fully compensates for the new stack.
  - - Another major AxEMU slip
    - NASA or OIG evidence points to another step-change in schedule or scope beyond the current delay path.
    - Would weaken the value of xEVAS as a validation and cash-support pillar.
    - Revisit every bull and base-case milestone assumption immediately.
  - - Station timeline deterioration
    - Free-flight timing pushes materially beyond the 2028 target without compensating demand proof.
    - Extends the period in which Axiom is funding long-cycle hardware before broad station monetization is visible.
    - Cut scenario range and assume more dilution risk.
  - - Renewed supplier-payment stress
    - Credible reporting of arrears or strained terms with partners such as SpaceX or Thales reappears.
    - Would show that financing access is again lagging execution needs.
    - Treat as a financing-quality red flag, not just an operations issue.
  - - NASA market-support deterioration
    - Commercial LEO support or station-transition policy weakens without private demand replacing it.
    - Would reduce the most important external demand support for the station thesis.
    - Move value toward the bear range unless non-NASA occupancy proof appears.
  notes: These are monitorable breakpoints rather than background worries; each one directly changes the economics or seniority of the equity case.
