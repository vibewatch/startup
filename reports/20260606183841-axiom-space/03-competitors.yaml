chapter:
  number: 3
  title: Competitors
  summary: 'Axiom Space still leads the commercial-station transition because it has flown four private astronaut missions, holds the fifth NASA PAM award, and is converting ISS-attached modules into a free-flying station plan. But that lead is no longer exclusive: NASA has now selected Vast and Voyager for later PAMs, Starlab and Orbital Reef continue to market richer research campuses, and buyers with weaker need for station tenancy can substitute into free-flyer missions, legacy brokers, or national-agency programs. The resulting moat is operational and trust-based rather than structural, with durability constrained by NASA policy, SpaceX dependence, and still-opaque post-ISS pricing and backlog data.'
sections:
- id: landscape-now
  title: Axiom leads the bridge market, but the field is no longer exclusive
  body: 'Axiom now competes in two overlapping arenas rather than one. The first is the near-term private astronaut mission bridge from today’s ISS to tomorrow’s commercial stations. In that bridge market, Axiom is the incumbent: public sources show it has already flown four chartered ISS missions, won a fifth NASA order for early 2027, and converted sovereign crews from India, Poland, and Hungary into visible customer proof. The second arena is the post-ISS station platform race, where Axiom must compete with Starlab, Orbital Reef, and Vast on habitat capability, partner depth, and readiness to host research and sovereign missions after the ISS retires. NASA’s 2026 selection of Vast for the sixth PAM and Voyager for a seventh mission matters because it breaks any assumption that Axiom will remain the sole broker of ISS-linked commercial human spaceflight. Once buyers can compare Axiom against other ISS-capable brokers and future stations simultaneously, the practical landscape expands beyond
    one startup-versus-government frame into a portfolio of direct peers, substitutes, and internal-build paths.'
