      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 重置与反弹不等于干净价值
            body: Axiom 的融资档案足以说明投资人仍想暴露于这个故事，但不足以证明 2026 年反弹标记下的新钱普通股受到良好保护。这一区别正是继续研究建议的核心。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV036
              - CV037
              - CV040
          - type: callout
            title: 隐藏优先级可能抹掉私人公司标题估值
            body: 最大的估值风险不是 Axiom 没有战略相关性，而是混合债务、未披露优先权，以及融资公告之间尚未解决的重叠，可能让新投资人实际拿到的轮次经济性明显弱于表面估值。
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV045
          - type: callout
            title: 使用情景区间，而不是单点 DCF
            body: 由于公开证据仍缺少确认收入、毛利率、烧钱、现金跑道和积压订单 转化，正确方法是以融资历史、资本强度和公开可比公司语境为锚做情景框架，而不是假装缺失输入已知，去构建精确内在价值模型。
            calloutType: assumption
            claimRefs:
              - CV035
              - CV041
              - CV042
