        title: 直接同行在能力深度和商业化成熟度上分化
        blocks:
          - type: paragraph
            body: >-
              直接空间站同行并不等同。Starlab 主打最深的研究园区主张：单次发射空间站、三个对接口、Bishop 气闸、载荷平台、宇航员服务，以及与 Airbus、MDA、Saber、Vivace
              等伙伴绑定的明确科学园区模式。Sierra Space 和 NASA 描述下的 Orbital Reef
              仍定位为面向商业、研究和旅游的混合用途商业园区，但公开证据在客户证明上更轻，在设计里程碑语言上更重。Vast 的 Haven-1 更窄但更具体：一个四人、两周平台，有可见硬件进展、接入 SpaceX 的系统，以及
              NASA 选定的 2027 年私人任务，可在 Haven-2 前培育客户关系。Voyager 的 2028 年 ISS PAM 又加入一个基础设施玩家，而且不要求 Starlab 本身届时已运营。因此，Axiom
              不再只和未来舱段概念竞争；它面对的是一组阶梯式替代方案，从单模块空间站和未来科学园区，到能在自家空间站上线前积累训练、集成和主权销售经验的 PAM 供应商。
