      - number: '6.4'
        title: 重复行为、耐久性与公开客户证据的边界
        blocks:
          - type: paragraph
            body: >-
              公开耐久性信号在合同框架最清楚的地方最强：NASA。连续五次 PAM 授予让 Axiom 从同一个锚定客户处拿到可见的重复业务，这比多数私营航天同行披露的留存证据更强。离开
              NASA，证据就变弱。沙特阿拉伯、土耳其、印度、波兰、匈牙利的主权宇航员任务证明了真实采购决策，但公开记录通常是一事一议，围绕国家目标，而不是披露的续约计划。Burjeel、Booz Allen、UCSD
              这类研究用户证明了真实任务使用，Sanford 的后续癌症研究也是重复科研需求的最佳例子之一；但即便如此，公开材料也没有披露续约经济性是直接归 Axiom、通过 ISS National Lab
              赞助，还是经由另一层合作伙伴结构。


              同样重要的是，已审阅材料没有披露客户数、净留存率（NRR）、总留存率（GRR）、流失率、头部客户占比或续约率。因此，本章可以区分试点与真实飞行任务、logo
              与实际使用，却无法把这些证明转化为传统软件式耐久性模型。投资人应把 Axiom 的客户证据看作：执行真实性强，NASA 之外的重复模式中等，已披露客户经济性弱。
