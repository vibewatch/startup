      - number: '8.2'
        title: 合同标题不等于估值支撑
        blocks:
          - type: paragraph
            body: >-
              Axiom 有足够证据，不应被简单归零，但不足以支撑照价接受。看多依据是真实的：2023 年公告称 Axiom 拥有超过 $2.2 billion 客户合同；xEVAS 是真实的 NASA
              采购，并带有十亿美元级上限表述；Ax-4 席位定价显示主权客户愿意付费；NASA 2026 年 2 月航天服更新确认技术进展。承做难点在于转化。同一组记录显示，私人宇航员任务按任务逐个谈价；OIG 称 xEVAS
              仍是一份基于里程碑的固定价格开发合同，其合并最高额已经变化，并可能滑到 2031 年；已审阅公开材料没有披露确认收入、毛利率、烧钱速度或积压订单 消化。空间站修订后的 2028 年自由飞行目标和 €110
              million Thales 模块合同，让资本强度可见。Forbes 和 The Register 的反向报道意味着投资人不能忽视流动性历史。合在一起，Axiom
              有真实项目和真实赞助方；但公开证据在合同标题层最强，在现金转化层最弱。
