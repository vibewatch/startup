        title: 合同经济性与订单储备质量
        blocks:
          - type: paragraph
            body: >-
              Axiom 确有公开合同信号，但这些信号不等于已确认收入。公司 2023 年 8 月 Series C 公告称，Axiom 拥有超过 $2.2 billion 客户合同，其中包括一项 NASA xEVAS
              授标；Axiom 将其描述为 $1.26 billion 长期合同，含约 $370 million 已保障任务订单付款。NASA 自己的 2022 年 xEVAS 授标公告把该采购定义为
              IDIQ、基于里程碑的服务合同，Axiom 和 Collins 到 2034 年的合并上限为 $3.5 billion。到 2026 年 4 月，NASA OIG 将当前合并最高额描述为 $3.1
              billion，称 Collins 已退出任务订单，并警告演示可能要到 2031 年才发生。这组信息在经济性上很关键：xEVAS 给 Axiom
              带来大型政府背书项目，但它是开发强度高的固定价格服务合同，收入时间取决于技术里程碑和 NASA
              验收，而不是稳定产品订阅。订单储备质量因此是混合的。公开合同下限真实存在，但公开证据仍未显示分部收入确认、里程碑消耗，或标题合同价值转化为现金的时间表。
