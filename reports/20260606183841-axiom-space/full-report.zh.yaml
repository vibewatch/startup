      - number: '6.3'
        title: 研究与载荷用户：使用看得见，付款路径更模糊
        blocks:
          - type: paragraph
            body: >-
              把 Ax-4 当作研究平台，而不只是一场主权宇航员任务，公开客户证据会进一步扩宽。ISS National Lab 表示，Ax-4 搭载的研究将超过 Axiom 以往任何一次私人任务，包括来自 31 个国家的
              60 多项实验，以及 20 多项由 ISS National Lab 赞助的研究。这让 Axiom 在采购乘组的政府之外，有了真实的载荷用户界面。这些具名用户有价值，因为它们指向实际任务用例。UAE 的
              Burjeel Holdings 通过 Suite Ride 项目，在 Ax-4 上测试微重力下的葡萄糖监测和胰岛素可用性。Booz Allen Hamilton 在测试可穿戴生物识别和边缘处理。UC San
              Diego 的 Sanford Stem Cell Institute 在延续此前的 Axiom 癌症研究。HUNOR 也出现在 ISS National Lab 清单中，带有具名的感知和植物生长实验。


              不过，这些用户的证明质量并不相同。任务是真的，实验也是真的，但变现路径往往不透明。ISS National Lab 赞助意味着，部分用户可能间接购买 Axiom
              准入、获得赞助名额，或通过多层合作伙伴栈参与，而不是签下一份清晰可见的 Axiom 合同。因此，这些研究用户能证明利用率和市场宽度，却仍留下更难的尽调问题：合同规模、直接收入捕获，以及是否会重复购买。
