      - number: '1.4'
        title: 里程碑、产品进展与反向记录
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示了有意义的运营进展，也暴露出清晰的进度和执行风险。Axiom 在 2022 年完成 Ax-1，成为首个全私人 ISS 任务，随后执行 Ax-2 和 Ax-3；2025 年又通过 Ax-4 让
              India、Poland 和 Hungary 回到政府赞助载人航天，同时扩大研究组合。NASA 选择 Axiom 执行第五次私人任务，目标不早于 2027 年 1
              月，说明机构需求仍在。产品侧，截至运行日期，Axiom Station 首个模块仍在建设中，Axiom 和 NASA 都继续把该空间站描述为后 ISS 商业运营的接替路径。NASA 航天服材料显示 AxEMU
              项目在推进技术评审和测试，但 2026 年 4 月 NASA OIG 审计是一个重大反向信号：审计称，原定 2025 和 2026 年的演示计划无法实现，已经出现至少一年半延误，进一步滑坡可能把演示推到 2031
              年。另有 2024 年媒体调查描述了现金压力、裁员、供应商付款紧张以及空间站建设慢于计划。核心尽调结论因此是混合的：Axiom 有真实任务执行和机构信用，但投资人仍需要更清晰的进度控制、经济性和透明度证据。
