      - number: '2.2'
        title: 边界不同，规模测算口径也会分叉
        blocks:
          - type: paragraph
            body: >-
              Axiom 所售产品没有单一、干净的公开 TAM，因此正确做法是保留多种口径，而不是假装精确。最窄的官方口径是 NASA 政策：该机构现在用有限预算资助 CLD
              开发，预期至少两家供应商，并且只要求一次四人、一个月、非 NASA 演示作为最低门槛。ISS 时代的任务切口也有上限。NASA 仍允许每年最多两次 PAM，Ax-4 展示的是四人任务清单，所以除非 NASA
              或后续空间站提高频次，今天的 PAM 吞吐上限每年只有约八个座位。中间口径是研究 / 制造租用：NASA 和 ISS National Lab 已经在二十多个 InSPA 奖项上投入超过 $60
              million，并继续征集近期经济影响项目；开源调查则统计出 303 家在轨制造实体。但同一批调查也说，经常性盈利生产仍未跑通。最宽口径对承销最没用：偏旅游的报告预计 2030
              年代初市场可达数十亿美元，因为它们把亚轨道旅行、轨道旅游、私人宇航员任务和空间站停留打包在一起。作为宽泛可比项，这些报告并非错误，但会显著夸大 Axiom 近期真正可服务的市场。
