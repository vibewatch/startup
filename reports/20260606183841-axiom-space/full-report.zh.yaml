chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Axiom Space 自称是一家载人太空探索公司，正在建设定义时代的太空基础设施和技术驱动服务。官方网站、招聘文案和 2026 年 2 月融资新闻稿都围绕同一个运营逻辑：今天用面向 International
              Space Station 的商业载人航天变现，明天建设更长期的低地球轨道基础设施栈。这个栈包括 Axiom Station、私人宇航员任务、微重力研究、在轨制造、轨道数据与算力产品，以及月面 /
              低地球轨道航天服。公司称其由 Kam Ghaffarian 和 Michael Suffredini 于 2016 年创立，多份官方新闻稿称公司总部在 Houston。NASA 任务页面印证，Axiom
              已成为该机构反复合作的私人宇航员任务对手方；Axiom 自己的任务页面则把 Ax-1 到 Ax-4 既写成独立收入事件，也写成培育空间站需求的前置步骤。因此，一个实用的一句话描述是：Axiom
              是一家后期私人太空基础设施公司，围绕未来接替 ISS 的商业空间站，销售访问权、任务服务和配套硬件。
