  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 这些示意性参考标记显示，框架从 2025 年重置切到 2026 年反弹，或回到下行情景时，投资判断会多快变化。
    data:
      items:
        - label: 2023 二级市场高点标记
          value: 2.6
        - label: 2025 重置参考
          value: 2
        - label: 2026 反弹底部
          value: 2.5
        - label: 新增兴趣观察区
          value: 1.6
        - label: 牛市中点
          value: 4.25
        - label: 熊市中点
          value: 1.15
      yAxis:
        label: 示意性股权价值或参考标记（USD B）
    approximationNotes: 数值结合了已报道的私人市场参考标记和本章情景估算，用来展示决策敏感性，并不意味着 Axiom 内在价值可以精确到该水平。
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间显示，即便 2026 年融资反弹后，投资测算区间仍然很宽。
    data:
      items:
        - label: 熊市情景隐含股权价值
          low: 0.8
          high: 1.5
          unit: USD B
          note: 延误叠加惩罚性融资，或以低于 2025 年条款再次重置。
        - label: 基准情景隐含股权价值
          low: 2
          high: 3
          unit: USD B
          note: 战略意义仍在，但披露和经济性仍不完整。
        - label: 牛市情景隐含股权价值
          low: 3.5
          high: 5
          unit: USD B
          note: 里程碑守住，融资环境保持建设性，NASA 塑造的需求延续。
        - label: 价格变化观察区
          low: 1.5
          high: 2
          unit: USD B
          note: 有效入场价若更接近 2025 年重置水平，风险回报会改善。
    approximationNotes: 区间是分析师估算，来自融资历史、合同质量、资本强度和公开可比参照。公开运营材料太不完整，因此未尝试 DCF。
    claimRefs:
      - CV012
      - CV041
      - CV042
      - CV043
      - CV044
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的评分显示，Axiom 过战略重要性这道线，比过透明度或估值纪律更容易。
    data:
      items:
        - label: 融资渠道
          value: 7 / 10
          status: verified
          note: 2026 年融资、QIA 支持和 4iG 交割显示资本渠道仍然打开。
        - label: 合同可见度
          value: 6 / 10
          status: verified
          note: 大额合同和 xEVAS 真实存在，但转化为现金的情况未公开。
        - label: 技术进展
          value: 6 / 10
          status: in-progress
          note: AxEMU 和空间站里程碑存在，但两个时间表的风险都尚未完全出清。
        - label: 收入透明度
          value: 2 / 10
          status: gap
          note: 公开收入、毛利率、烧钱速度和现金跑道仍未披露。
        - label: 市场独立性
          value: 3 / 10
          status: gap
          note: CSIS 和 Payload 仍把需求描述为 NASA 塑造，而非自我持续。
        - label: 资本结构清晰度
          value: 2 / 10
          status: gap
          note: 股债混合，再加上未知优先权和契约条款，让资本栈仍然不透明。
        - label: 估值纪律
          value: 4 / 10
          status: in-progress
          note: 2025 年重置和 2026 年反弹可见，但底层经济性不可见。
        - label: 投资建议
          value: Research-more
          status: verified
          note: 以当前公开证据质量看，可投动作是尽调，而不是接受报价。
    approximationNotes: 评分由分析师给出，反映证据质量和投资测算准备度，不代表公司绝对质量或技术雄心。
    claimRefs:
      - CV005
      - CV010
      - CV015
      - CV020
      - CV023
      - CV037
      - CV038
      - CV039
      - CV040
      - CV046
