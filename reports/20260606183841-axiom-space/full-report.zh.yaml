      - number: '5.5'
        title: 信任控制、路线图成熟度与仍然关键的技术风险
        blocks:
          - type: paragraph
            body: >-
              Axiom 产品栈最强的正面信号，是主要信任控制在公开层面可见。空间站硬件在制造推进前经过 NASA 参与的设计评审。私人宇航员任务需要 NASA 和国际伙伴做乘组评审，还要接入 NASA 与 SpaceX
              训练界面。AxEMU 有 NASA 定义的正式技术和安全标准、承包商主导评审、仍待完成的 NASA 主导关键设计同步评审，以及在浮力和减重力设施中的持续测试。这些是实质控制点，不是品牌口号。


              最强的负面信号，是进度和质量风险同样公开可见。NASA OIG 称，原计划 2025 年演示月面航天服、2026 年演示 ISS 航天服的时间表过于乐观且无法实现，并警告如果延误符合历史常态，演示可能滑到
              2031 年。GAO 另行显示，NASA 已经把 Artemis III 推迟到 2026 年 9 月，以吸收剩余承包商工作。即便 Axiom
              最新公开测试记录方向上积极，监督来源也清楚说明，这套航天服还不是低风险、接近收尾的项目。


              空间站风险更集中在制造和依赖项。SpaceNews 报道称，Thales 制造的结构出现腐蚀，也波及 Axiom 模块硬件；Axiom 称观察到的斑点有限，已移除并缓解，且不改变模块 1 在 2028
              年发射的目标路径。这件事可能可控，但它提醒投资人，Axiom 的进度既取决于伙伴制造质量，也取决于自身 Houston 集成工作。更宽的承销结论因此是平衡的：Axiom
              有足够真实产品、流程和测试证据，值得作为建设者兼运营商认真看待；但其最重要的未来产品仍处在一条狭窄走廊里，由 NASA 监督、SpaceX 接口、供应商质量和进度执行共同界定。
