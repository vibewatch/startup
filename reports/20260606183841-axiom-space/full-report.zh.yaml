      - number: '8.3'
        title: 可比视角和情景区间
        blocks:
          - type: paragraph
            body: >-
              可比公司集合应作为框架，而不是公式。2026 年中期的上市航天股显示，市场仍愿意为期权价值付很高价格：Rocket Lab、Planet Labs、Intuitive Machines，甚至 AST
              SpaceMobile 都有数十亿美元市值；Virgin Galactic 则显示，当商业证明变薄，人类航天故事会被多么残酷地压缩。这个区间对 Axiom 是双刃剑。它意味着在行业语境下，约 $2.0
              billion 到 $2.5 billion 的私募估值并不荒唐；但也意味着上市赢家有连续市场定价和已披露收入线。Axiom 没有。因此，正确方法是情景估值。乐观情景下，Axiom 保持 2026
              年融资窗口打开，按时推进 AxEMU 和空间站里程碑，并把主权任务需求转化为可重复的项目价值，支撑约 $3.5 billion 到 $5.0
              billion。基准情景下，由于战略相关性仍在但披露没有改善，价值停留在 2025-2026 年私募参考标记附近，约 $2.0 billion 到 $3.0
              billion。悲观情景下，新的延期或另一轮惩罚性融资会把普通股价值重置到约 $0.8 billion 到 $1.5 billion。
