      - number: '5.4'
        title: 微重力服务、制造模式与可见依赖边界
        blocks:
          - type: paragraph
            body: >-
              Axiom 当前产品目录混合了已交付服务和仍在开发的硬件。已交付部分在微重力访问上最清楚。Axiom 研究页面明确表示，科学家、工程师和产品创新者今天就能用其任务专家把产品或实验送入轨道；Ax-4
              直接证明这个产品不是愿景——它在 2025 年于 ISS 执行了研究和技术演示。这个区分很重要，因为它让承销保持落地：Axiom 已经是基于任务的研究访问运营商和编排方，但还不是独立研究空间站运营商。


              制造模式同样混合。Payload 称，Axiom
              希望在最影响进度和产品控制的地方垂直整合——软件、工程、生命支持和内部结构——但仍把结构工作和部分子系统范围外包给伙伴。空间站建设资本密集，这种安排看起来合理，却也制造了可见依赖边界。Thales
              仍是加压模块结构的关键外部制造伙伴；SpaceX 仍嵌入 Dragon 运营、发射供应商训练以及未来与 ISS 脱轨共存问题；NASA 仍同时作为当前目的地所有者和未来认证把关者嵌入其中。


              公开从业者信号也支持一个判断：Axiom 仍在为真实技术执行招聘，而不只是做项目管理剧场。其招聘页面继续宣传工程密集型基础设施工作；Built In 的岗位汇总突出飞行软件、GNC 仿真、载荷管理、系统工程和
              EVA 相邻运营岗位。招聘不是执行质量证明，但可以作为一个合理代理，说明公司仍需要横跨任务运营、硬件和软件的深度技术人力。相比之下，一条相邻产品线仍缺少文档：轨道数据中心出现在 Axiom
              的解决方案表面，但已审阅材料没有像任务、空间站模块或 AxEMU 一样披露架构、硬件、客户或验证证据。因此，现阶段应把它视为相邻业务，而不是核心承销产品。
