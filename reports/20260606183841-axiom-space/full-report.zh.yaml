      - number: '5.2'
        title: Axiom 今天真正交付的东西：私人宇航员任务与托管式微重力访问
        blocks:
          - type: paragraph
            body: >-
              Axiom 最成熟的产品不是未来空间站，而是当前任务服务工作流；这套工作流已经能把主权和私人客户送进 NASA 的 ISS 系统。NASA 和 Axiom 都称，Ax-5
              是公司连续第五次私人宇航员任务授标，目标不早于 2027 年 1 月，并预计与 ISS 对接最多 14 天。NASA 新闻稿把服务边界说得异常清楚：Axiom 提名乘组成员，NASA
              和国际伙伴评审；获批后，这些乘组成员与 NASA、伙伴和发射供应商一起训练。这就是 Axiom 今天销售的核心客户工作流——任务打包、评审导航、训练编排和在轨执行。


              Ax-4 用具体方式展示了运营模式。Axiom 任务页面把交付顺序描述为 SpaceX Dragon 发射、ISS 对接、约两周微重力研究、技术演示和外联，然后溅落返回。NASA 更广的 PAM
              框架解释了其战略意义：私人宇航员任务是 NASA 从机构拥有目的地转向竞争性商业 LEO 经济的转型计划的一部分。换句话说，在 Axiom Station 上线前，Axiom 已经在把这个桥接期变现。


              运营架构也比营销材料显示的更真实。Axiom 的 MCC-A 不是象征性房间；公司称，自 Ax-1 以来，它一直与 NASA Johnson 保持实时运营连接，并且仍是宇航员任务执行的组成部分。NASA
              任务管理播客补充了实操细节：Axiom 运行自己的目标和控制室，同时与 NASA 24/7 ISS 控制中心协同，也要对接单独的 SpaceX 训练流程，确保安全操作 Dragon。NASA Spinoff
              补上人的能力侧：Axiom 的私人客户起步时往往几乎没有特定任务训练，依赖具备 NASA 任务控制和宇航员训练背景的教官与操作人员。客户处理、训练中介、任务控制和 ISS 研究执行合在一起，就是 Axiom
              眼下交付内容的最清晰答案。
