  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              Axiom 的实际近期收入模式比泛泛的太空经济叙事窄得多。最能支撑的变现产品，是以交钥匙式捆绑包销售的私人宇航员任务、通过里程碑任务订单付费的 NASA xEVAS
              航天服服务，以及从公开披露角度仍处于收入前阶段的未来空间站服务。最清晰的公开座位价格数据点来自 Associated Press：Ax-4 客户为约两周任务支付了每席超过 $65 million。NASA
              自己的定价政策解释了为什么这个数字不能直接翻成 Axiom 净收入：NASA 把超出基础能力的 ISS 资源视为可报销项目，称公开定价只是代表性价格，也称由于任务概念不同，详细定价会在任务授标时谈判。Axiom
              任务材料和 NASA 咨询页面还显示，任务为主权客户打包研究组合、宇航员训练、外联和 ISS 运营；但已审阅的公开来源没有披露，一份座位合同扣除 NASA 收费、SpaceX 运输、训练和任务管理后，Axiom
              能留住多少。公开证据因此支持真实的任务服务业务，但还不能给出干净的已实现 ASP 或毛利曲线。
