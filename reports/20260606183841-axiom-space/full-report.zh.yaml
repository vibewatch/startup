  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新一轮惩罚性融资
        - 新一轮价格低于 2025 年重置价，或带有明显苛刻的优先权和债务条款。
        - 会证实 2026 年反弹没有修复普通股经济性。
        - 除非价格完全补偿新堆叠，否则重估至回避方向。
      - - AxEMU 再次重大延误
        - NASA 或 OIG 证据显示，在当前延误路径之外，进度或范围又出现阶跃式变化。
        - 会削弱 xEVAS 作为验证和现金支撑支柱的价值。
        - 立即重审所有乐观和基准情景的里程碑假设。
      - - 空间站时间线恶化
        - 自由飞行时间实质推迟到 2028 年目标之后，且没有相应需求验证补偿。
        - 会拉长 Axiom 在广泛空间站变现可见前，为长周期硬件筹资的时间。
        - 下调情景区间，并假设更高稀释风险。
      - - 供应商付款压力重现
        - 可信报道称，与 SpaceX、Thales 等合作伙伴的欠款或紧张条款重现。
        - 会显示融资可得性再次落后于执行需求。
        - 视为融资质量红旗，而不只是运营问题。
      - - NASA 市场支持恶化
        - 商业 LEO 支持或空间站过渡政策走弱，且没有私人需求接棒。
        - 会削弱空间站逻辑最重要的外部需求支撑。
        - 除非出现非 NASA 入住验证，否则把价值推向悲观区间。
    notes: 这些是可监测断点，不是背景担忧；每一项都会直接改变股权案例的经济性或优先级。
