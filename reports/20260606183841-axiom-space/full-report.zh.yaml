      - number: '7.5'
        title: 缓释因素、监测指标与打破投资逻辑的触发条件
        blocks:
          - type: paragraph
            body: >-
              Axiom 并非没有缓释。NASA 2026 年 2 月里程碑更新、Axiom
              的冗余和测试说法、公开合规热线，以及新融资，都显示管理层仍在推进项目，也明白审查会来自哪里。但公开缓释组合仍偏流程，而非结果。投资人能看到评审、政策和伙伴背书；仍看不到债务契约、供应商补救计划、当前关键路径时间表，或诉讼和保险清单。因此，正确的监测框架必须明确。AxEMU
              如果再错过里程碑，会威胁 NASA 信心，并延长 EMU 依赖。NASA 商业 LEO 战略再次调整，或后续阶段资金不足，会直接压制空间站商业案例，因为 NASA 仍是锚定市场。SpaceX 或 Thales
              如果再次出现欠款或违约通知，就说明流动性又一次跑不过执行。这些不是背景风险：合在一起，它们定义了什么情况下 Axiom 投资逻辑不再像耐心执行风险，而是变成结构性资本不足的过渡故事。
