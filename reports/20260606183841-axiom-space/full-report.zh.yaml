        - NASA 主导的评审结果
        - 当前技术评审阶段之后，任何公开披露的延期，或重大重新设计被重启
        - 暂停承销判断，直到管理层给出修订路径，且仍能守住 ISS 和 Artemis 时间表
      - - 空间站进度风险
        - 集成里程碑变化
        - 舱段顺序再次调整或延期，且没有已获资金支持的绕行方案，进一步压缩 ISS 退役前时间
        - 以更晚的空间站收入爬坡和更重外部融资需求，重切基准情景
      - - NASA 政策依赖
        - CLD 二、三阶段时间安排
        - 资金延迟、战略逆转，或商业空间站支持范围实质缩小
        - 假设需求形成更慢，对政府任务的剩余依赖更高
      - - 供应商 / 交易对手压力
        - 付款计划、违约或补救通知
        - 与 SpaceX、Thales 或其他任务关键供应商出现新的欠款、补救函或公开纠纷
        - 视为即时流动性和交付风险，而不是背景性的供应商摩擦
      - - 融资风险
        - 资本市场准入
        - 在主要技术里程碑前又需要大额融资，且单位经济或合同可见度仍不清晰
        - 假设条款更苛刻、稀释更重、战略灵活性更低
      - - 法律 / 监管尾部风险
        - 索赔、违约通知或合规事件
        - 任何披露的出口管制问题、重大隐私事件、安全事故，或此前隐藏的诉讼
        - 升级为律师牵头尽调，并围绕运营分心和声誉受损重置下行情景
