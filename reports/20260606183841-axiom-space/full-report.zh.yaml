  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 证据
      - 重要性
      - 局限
      - 状态
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public space comps for pricing Axiom as of 2026-06-06 rather than every
        listed aerospace or satellite company in market.
    rows:
      - - Axiom 私募估值
        - 2025 年 3 月约 $2.0B 重置；2026 年 2 月 >$2.5B 反弹参考；条款未披露。
        - 把标的公司自身重置—反弹路径放在公开可比公司旁边。
        - 老股估值和新闻口径不如公开市场定价可靠。
        - 非上市
      - - Rocket Lab
        - $63.72B 市值；$601.8M FY2025 收入。
        - 显示公开市场愿意为已有规模、披露收入与在手订单、且持续价格发现的空间基础设施支付什么价格。
        - Rocket Lab 的产品和收入多元化远高于 Axiom。
        - 上市
      - - Redwire
        - $3.65B 市值；$335.38M FY2025 收入。
        - 是一个规模较小的基础设施可比对象，收入已披露，执行也更依赖供应商。
        - Redwire 销售组件和服务，而不是与 ISS 绑定的载人航天基础设施。
        - 上市
      - - Intuitive Machines
        - $6.37B 市值；$210.06M FY2025 收入。
        - 帮助判断市场如何给依赖政府项目、又绑定 NASA 的空间平台定价。
        - 月球服务并非 Axiom 空间站加任务堆栈的直接类比。
        - 上市
      - - Planet Labs
        - $11.48B 市值；$307.73M FY2026 收入。
        - 提醒我们，一旦经常性收入可见，上市空间平台也能获得可观价值。
        - Planet 靠数据订阅驱动，不是载人航天基础设施。
        - 上市
      - - AST SpaceMobile
        - $36.33B 市值；$70.92M FY2025 收入。
        - 显示公开市场可以多激进地为空间领域的期权价值和未来战略位置定价。
        - ASTS 仍是电信网络建设，而不是空间站或任务服务公司。
        - 上市
      - - Virgin Galactic
        - $413.54M 市值；$1.54M FY2025 收入。
        - 这是载人航天领域的警示性参照：商业验证和资本效率不及预期时会发生什么。
        - Virgin Galactic 的亚轨道旅游模式在结构上不同于 Axiom 的任务加基础设施逻辑。
        - 上市
    notes: 这组可比对象有意覆盖标的公司的私募估值、已有规模的基础设施可比公司、NASA 绑定的平台公司、带期权价值的上市故事，以及一个载人航天警示案例；Axiom 横跨多个篮子，却不完全匹配任何一个。
