              NASA 下单，空间站首批模块依赖 Thales 作为主结构制造商。即便 2026 年融资也增加了关系集中度，因为 QIA、4iG 等战略资本提供者绑定的仍是同一套空间站和轨道服务叙事，而不是把需求基础从
