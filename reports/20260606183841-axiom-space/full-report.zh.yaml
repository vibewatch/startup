      - number: '2.3'
        title: 买家已经可见，但复购仍然集中
        blocks:
          - type: paragraph
            body: >-
              买家图谱比总体 TAM 更清楚。NASA 是市场塑形者：它资助开发、认证安全、购买服务，也限制频次。主权政府是今天最清晰可见的非 NASA 付费群体。Ax-4 不像休闲任务；它把 India、Poland 和
              Hungary 的政府支持宇航员送上 ISS，任务期 14 天，研究组合覆盖 31 个国家。因此，Axiom
              更该看重主权需求，而不是泛泛的旅游叙事。第二个付费群体是需要持续微重力访问的研究和制造用户，而不是一次性宣传事件。ISS National Lab 和 NASA
              正刻意推动这个群体从资助实验走向经常性商业模式，Sierra Space 等竞争性基础设施供应商也已经围绕未来轨道平台签下半导体和材料合作。第三层买家是 Axiom
              以外的未来空间站运营商和国际机构，Voyager 获选 2028 年 PAM、NASA 允许国际伙伴直接与 CLD 供应商合作都说明了这一点。问题在于集中度：需求的公开证据存在，但重复承诺、价格披露和 后 ISS
              订单储备仍大多是私有信息。
