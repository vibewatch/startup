companyProfile:
  summary: >-
    Axiom Space 是一家总部在 Houston、成立于 2016 年的私人太空基础设施公司。公司用私人宇航员任务、微重力研究访问和 NASA 项目开发工作变现，同时建设更长期的 Axiom Station 平台和 AxEMU
    航天服项目。公开证据显示，它完成了四次 ISS 任务，连续五次拿到 NASA 私人宇航员任务授标，有主权客户需求，并在 2025 年重置后于 2026 年 2
    月实现融资反弹。但同一套公开资料仍大多没有披露收入质量、毛利捕获、订单储备转化、债务组合和股权结构优先级，所以投资人更能承销的是战略重要性和项目动量，而不是普通股权益经济性。
