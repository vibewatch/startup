      - number: '1.3'
        title: 融资历史、估值信号与关键利益方图谱
        blocks:
          - type: paragraph
            body: >-
              Axiom 的资本故事由已确认里程碑和未解决的不透明性拼在一起。官方 2023 年 8 月 Series C 新闻稿披露融资 $350 million，把累计融资推高到超过 $505
              million，并强调客户合同超过 $2.2 billion。随后 Sacra 和 Bloomberg 来源的 2025 年 3 月报道称，公司又以约 $2 billion 投前估值融资至少 $100
              million。2026-02-12，Axiom 宣布再融资 $350 million，由 QIA 和 Type One Ventures 共同领投，1789 Capital、4iG 和 LuminArx
              也参与；Axiom 和 QIA 均称该轮包含股权和债务。CNBC 补充称 PitchBook 给出的 Axiom 估值超过 $2.5 billion，但公司没有披露该轮估值。只用 2023 年 8
              月披露的累计数字，加上后续报道 / 公告轮次，到 2026 年 2 月可支撑的累计融资下限至少为 $955
              million。这个数字已经不小，但仍低于某些数据库式累计融资数字；这些更高口径无法用已抓取的运行日期前一手材料独立调和。投资人和关键利益方基础具有战略意义，因为 NASA、SpaceX、Thales
              Alenia Space 和主权资金背景投资人各自以不同方式影响执行。
