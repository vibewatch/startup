        title: NASA 政策、客户集中度与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Axiom 的业务仍处在 NASA 塑造的市场里。NASA 自己的商业空间站和私人宇航员任务页面显示，NASA 同时是当前目的地的守门人、未来空间站服务买方，也是试图避免后 ISS
              人类航天断档的机构。外部政策分析更直白：CSIS 称 NASA 今天实际上就是这个市场；Aerospace 则表示，如果没有持续政府兴趣，稳定的非政府空间站客户基础高度投机。NASA
