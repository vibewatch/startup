      - number: '8.4'
        title: 建议、改变结论的规则，以及最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等，风险评级高，估值立场偏高。这不是在判断 Axiom 缺乏战略重要性，而是在判断公开证据尚不足以证明应按 2026
              年反弹标记付费，并把它视为干净的普通股价值。结论只会因两个原因改善：价格或证据。价格方面，如果有效入场价更接近 2025 年重置，而不是 2026 年反弹——尤其是在干净条款下落在约 $1.5 billion 到
              $2.0 billion 或以下——就能更好缓冲进度和再融资风险。证据方面，公司可以通过展示 2025 年和 2026 年投资条款书、厘清 4iG
              是增量资金还是包含在标题轮次内、提供债务到期和契约、并证明合同价值正在转化为现金且毛利没有坍塌，来赢得更强判断。打破投资逻辑的触发条件同样具体：AxEMU
              或空间站再次重大延期，供应商付款压力重现，或新条款把新投资人压在厚厚一层优先股和债务堆叠之下。在这些问题解决前，Axiom 只能作为尽调流程来投资，而不能作为照价接受的标的。
