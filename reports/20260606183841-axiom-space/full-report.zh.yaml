      - number: '6.5'
        title: 集中度风险，以及任务需求与未来空间站租户之间的缺口
        blocks:
          - type: paragraph
            body: >-
              当前客户集中度很高。NASA 不只是众多客户之一；它是主导需求锚点、当前目的地所有者，也是塑造任务节奏和乘组批准的机构。主权项目和研究清单让叙事更分散，但它们仍跑在 ISS 和 NASA
              居中协调的任务模式上。因此，今天最好的公开证据支持的是短期准入销售，而不是广泛、自我维持的商业空间站租户基础。NASA 自己的商业空间站战略称，机构未来希望成为众多客户之一；PAM
              的目的则是在那次过渡前帮助公司积累能力和伙伴关系。


              问题在于，独立市场证据仍然谨慎。Center for Space Policy and Strategy 表示，如果没有持续政府兴趣，稳定的商业空间站客户基础高度投机。NASASpaceFlight
              提到一种担忧：市场未必能支撑所有拟议空间站。SpaceNews 报道，NASA 当前第二阶段框架只要求一次四人、一个月的演示任务，并把服务认证和采购推迟到后续阶段。直白说，Axiom
              有强证据证明客户今天会购买任务；有中等证据证明这些任务可以培育未来用户；但公开证据很弱，无法证明长期空间站租用需求已经签约或具备耐久性。
