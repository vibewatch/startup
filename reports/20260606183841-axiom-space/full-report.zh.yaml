            body: >-
              Axiom 的可投资性问题，不是缺少需求证据；问题在于公开证据在合同、任务和里程碑层最强，在转化层最弱。NASA、CSIS、Payload 和 SpaceNews
              都指向一个仍由联邦政策和预算支持居中调节的空间站市场，意味着未来平台收入既取决于 NASA
              的转型设计，也取决于独立客户拉力。与此同时，已审阅来源从未披露已确认收入、ARR、毛利率、烧钱速度、营运资本或订单储备转现金时间表。即便最清晰可见的非 NASA
