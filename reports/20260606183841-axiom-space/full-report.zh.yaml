  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值标记历史，以及公开证据实际定价的内容
        blocks:
          - type: paragraph
            body: >-
              公开定价历史应被当作叙事，而不是审计后估值。一页已审阅的 2026 年老股页面把 Axiom 2023 年 Series C 放在约 $2.6 billion 的高点；Sacra 和
              Investing.com/Bloomberg 摘要则描述了 2025 年 3 月一轮至少 $100 million、投前估值约 $2 billion 的融资。这样看，2025
              年更像一次重置，而不是早期高点的延续。到 2026 年 2 月，基调再次改善：Axiom 宣布新的 $350 million 融资，QIA 确认参与，4iG 单独完成第二批交割，CNBC 称 PitchBook
              对 Axiom 的估值超过 $2.5 billion。问题不是缺少定价标记，而是这些标记的质量。Axiom 没有披露 2025 年 3 月或 2026 年 2
              月的股价、债务拆分或优先股堆叠经济性。因此，公开证据支持一个三步叙事——2023 年高点、2025 年重置、2026 年反弹——但不能证明其下干净的普通股经济性。
