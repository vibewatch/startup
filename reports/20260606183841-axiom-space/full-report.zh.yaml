      - number: '5.3'
        title: AxEMU 架构、测试进展与供应商栈
        blocks:
          - type: paragraph
            body: >-
              AxEMU 是 Axiom 第二条主要产品线，也是公司在空间站材料之外公开技术面最细的部分。NASA 和 Axiom 对核心架构的描述一致：该航天服建立在 NASA xEMU
              开发基础上，增加更广的尺码和可调节性，提升弯腰、采集地质样本等任务的机动性，并采用更新的生命支持、压力服和航电要素。Axiom
              进一步称，航天服架构围绕冗余设计，用来缓解单点故障，并且只需有限环境调整，就能服务月面和微重力 EVA 任务。这不等于完整子系统物料清单，但足以理解设计意图：Axiom 不是从白纸发明航天服，而是在商业化和产品化
              NASA 传承技术，同时为服务交付调整整套方案。


              公开测试记录有意义。NASA 报告称，截至 2026 年 2 月，航天服已完成超过 850 小时有人加压测试、完成承包商主导的技术评审、在 Neutral Buoyancy Laboratory
              完成首批系列运行，并在 Active Response Gravity Offload System 中开展后续减重力评估。Axiom 自己的年度回顾又补充了首次双服 NBL 工作、压力服组件无人热真空测试、超过
              800 小时有人加压时间，以及超过 1,200 项评审产品。Flying 独立印证了 NBL 早期载人测试。这些还不是最终认证里程碑，但已经远超概念图阶段。


              供应商图谱也有真实内容。Prada 公开参与外层材料和设计呈现；CollectSPACE 报道称，Oakley 提供可展开的两段式面罩系统，Nokia 提供用于高清视频、遥测和语音的高速通信。NASA
              自己的供应商页面把控制边界说清楚：Axiom 拥有设计、开发、鉴定、认证、生产和支持设备，NASA 保留训练、任务规划和审批权。这个切分带来信任和技术纪律，但也意味着不能只按 Axiom
              内部时间表评判该项目；它必须在每个主要评审和测试节点满足 NASA 把关。
