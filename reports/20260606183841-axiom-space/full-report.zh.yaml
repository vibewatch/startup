            body: >-
              融资故事有支撑，但并不干净。Axiom 无疑在 2026 年 2 月再次证明自己能拿到资本，而且该轮明确包含股权和债务；但留存记录仍显示，这家公司在长期空间站收入被证明之前，项目会消耗大量现金。Forbes
              2024 年报道是核心反向信号：现金紧张、裁员、薪资压力、据称与 SpaceX 和 Thales
              存在付款压力，以及亏损的私人任务。这段历史重要，因为它提高了一种风险：任何新延期都可能重新打开流动性问题，而不只是一次纯技术失误。公开记录并未显示治理已经破裂，但治理仍高度依赖创始人，并处在交接期。公司在
              2025 年 10 月更换 CEO，并保留公开合规渠道；但外部投资人仍看不到董事会流程、债务条款、供应商救济和诉讼时间表。因此，即便没有头条案件，法律暴露也是真实的：Axiom 自身条款提示 ITAR 和 EAR
              合规，隐私政策承认跨境传输和并不完美的网络安全，可接受使用政策也预设了法院命令、政府通知和终止权。
