        title: 空间站与 AxEMU 的技术执行和进度风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的执行风险仍是两个高难度项目的进度挤压。航天服方面，OIG 和 GAO 都表示，工作停留在开发阶段的时间长于 NASA 最初计划；OIG 现在把剩余风险写成运营后果：如果 Axiom
              像以往航天项目一样延期，NASA 到 2031 年可能仍等不到月面和微重力演示。NASA 自己 2026 年 2
              月的更新显示了真实进展——技术评审完成、大量加压测试完成、首个飞行单元部件开始到位——但这仍是交付前进展，不是进度风险已经关闭。空间站硬件风险类似。Thales 原计划在 2024 年和 2025
              年发射前两个模块，而 Axiom 当前公开空间站页面仍称制造和最终集成正在进行。安全覆盖层也重要：OIG 表示，如果 Axiom 不能按时或按成本交付下一代航天服，NASA 可能不得不继续依赖老化的
              EMU，而这些 EMU 已有已知安全问题。
