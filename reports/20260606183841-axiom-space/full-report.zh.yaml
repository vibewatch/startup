      - number: '6.2'
        title: 主权宇航员客户：真实任务，不只是标识
        blocks:
          - type: paragraph
            body: >-
              Axiom 最强的非 NASA 客户证明，来自已经飞过的主权国家宇航员任务。沙特阿拉伯通过 Ax-2，在 Axiom 安排下把 Rayyanah Barnawi 和 Ali Alqarni 送入太空；这套安排
              NASA 自己也有描述，因此沙特参与是真正的政府任务，而不只是宣传合作。土耳其通过 Ax-3 让 Alper Gezeravcı 成为本国首位宇航员，并把任务绑定到 13 项实验的国家科学计划。Ax-4
              又进一步扩大了主权客户群：印度、波兰、匈牙利都在中断 40 多年后回到政府资助的人类航天；印度派出任务飞行员 Shubhanshu Shukla，波兰和匈牙利则把任务用于国家研究组合。


              关键细节在于可重复性。这些主权项目证明，各国政府会为国家声望、科学和宇航员训练目标购买或使用 Axiom
              的任务栈。但公开证据看起来仍是单次项目，而不是订阅式需求。每个主权客户订单都是一项独立任务，有特定宇航员和实验清单；不是已披露的多年席位配额协议，也不是经常性空间站使用合同。因此，正确的投资判断是混合的：主权宇航员业务真实存在，原则上能带来收入，也有全球相关性；但公开留存证据远弱于任务
              logo 可能暗示的水平。
