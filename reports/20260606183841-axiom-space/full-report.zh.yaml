        title: 资本强度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本强度比损益表更容易观察。Axiom 2024 年空间站更新称，公司调整了模块顺序，使平台最早可在 2028 年自由飞行；但该计划仍需要 Thales Alenia Space、Houston
              集成、发射、停靠以及后续模块添加上的长周期硬件工作。Thales 项目本身可追溯到 2021 年首两个加压模块合同，European Spaceflight 报道该协议金额为 €110 million，AX-H1
              压力容器预计 2025 年交付、2026 年底发射。融资侧，Axiom 2026 年 2 月公告称，公司以股权和债务混合方式融资 $350 million，用于继续资助 Axiom Station 和
              AxEMU。QIA 和 Satellite Today 分别证实了混合结构，CNBC 则称管理层计划把资金用于航天服能力以及一号、二号模块。4iG 另行披露，将在 2026 年 3 月 31 日前完成两步走
              $100 million 投资。公开证据因此支持反复外部融资和重大制造承诺，但不显示当前账上现金、债务条款或现金跑道。
