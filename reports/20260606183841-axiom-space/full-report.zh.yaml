  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论从可见的估值重置与反弹记录出发，落到合同证据、缺失的经济性、资本强度，最后指向继续研究。
    data:
      nodes:
        - id: reset2025
          label: 2025 重置
          detail: 2025 年 3 月融资接近 $2.0B 投前估值。
        - id: rebound2026
          label: 2026 反弹
          detail: 2026 年 2 月融资，加上 PitchBook 超过 $2.5B 的参考值。
        - id: contracts
          label: 合同证据
          detail: '>$2.2B 客户合同口径、xEVAS 和主权任务定价都是真实的。'
        - id: opacity
          label: 经济性缺口
          detail: 收入、毛利率、烧钱速度、债务拆分和优先权栈均未公开披露。
        - id: capital
          label: 资本强度 / NASA 依赖
          detail: 空间站和宇航服项目仍需要时间、资金和政策支持。
        - id: result
          label: 继续研究 / 估值偏高
          detail: 价格支撑存在，但还不足以给出干净的买入结论。
      edges:
        - from: reset2025
          to: rebound2026
          label: 反弹至
        - from: rebound2026
          to: contracts
          label: 因此更容易相信
        - from: contracts
          to: opacity
          label: 但仍撞上
        - from: opacity
          to: capital
          label: 因此更重要
        - from: capital
          to: result
          label: 推动
    approximationNotes: 这张图是决策图，不是管理层给出的流程图；它刻意把可见融资支撑与仍未公开的运营经济性拆开。
