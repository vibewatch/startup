  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2025 和 2026 年条款清单
        - 股价、清算优先权、反稀释、董事会权利，以及任何老股估值。
        - 决定名义估值是否对应可投资的普通股价值。
        - 由领投方尽调，向公司律师和董事会材料索取。
      - - 债务时间表和契约
        - 债务金额、到期日、票息或 PIK 条款、抵押品和契约测试。
        - 判断 2026 年融资是增强还是约束了股权故事。
        - 向财务团队获取信贷协议和下行契约模型。
      - - 在手订单到现金转化
        - 按项目拆分里程碑验收、开票金额、已确认收入和毛利率。
        - 区分亮眼合同口径和实际价值创造。
        - 财务尽调，加合同层面的收入确认梳理。
      - - 任务单位经济
        - 扣除 NASA 收费、SpaceX 运输、训练和任务支持成本后的留存收入。
        - 检验主权座位定价只是战略相关但经济性弱，还是确实有吸引力。
        - 按任务和客户索取任务层面 P&L 与报价历史。
      - - 非 NASA 需求验证
        - 已签署的空间站 LOI、入住假设、主权客户复购管线，以及任何非 NASA 服务承诺。
        - 判断 Axiom 能否走出 NASA 塑造的市场。
        - 用已签客户文件和客户访谈做商业尽调。
      - - 融资时间线对账
        - 明确 4iG 是纳入还是排除在更广义 2026 年融资标题之外。
        - 校准累计融资、稀释历史，以及对重置—反弹叙事的置信度。
        - 用监管文件时间线对照管理层融资日程和交割文件夹。
    notes: 这些是最低限度尽调问题，足以把本章从情景框架推进到真正考虑价格的承销建议。
