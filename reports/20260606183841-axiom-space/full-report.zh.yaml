  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Axiom 领跑桥接市场，但战场不再独占
        blocks:
          - type: paragraph
            body: >-
              Axiom 现在竞争的不是一个市场，而是两个重叠战场。第一个是近期私人宇航员任务桥接市场，把今天的 ISS 接到明天的商业空间站。在这个桥接市场里，Axiom 是既有玩家：公开来源显示，它已执行四次包租 ISS
              任务，赢得 2027 年初第五次 NASA 订单，并把 India、Poland 和 Hungary 的主权乘组转化成可见客户证明。第二个战场是 后 ISS 空间站平台竞赛，Axiom
              必须在舱段能力、伙伴深度以及 ISS 退役后承接研究和主权任务的准备度上，与 Starlab、Orbital Reef 和 Vast 竞争。NASA 2026 年选择 Vast 执行第六次 PAM、选择
              Voyager 执行第七次任务，这一点很重要，因为它打破了 Axiom 将继续独占 连接 ISS 的商业载人航天经纪角色的假设。一旦买家可以同时比较 Axiom、其他具备 ISS
              能力的经纪商和未来空间站，实际竞争版图就不再是一个初创公司对政府的框架，而是由直接同行、替代品和自建路径组成的组合。
