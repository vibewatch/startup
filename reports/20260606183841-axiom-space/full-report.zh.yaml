      - number: '2.4'
        title: 采用约束真实存在，月面 EVA 是相邻选项而非核心市场
        blocks:
          - type: paragraph
            body: >-
              最难的尽调工作在约束侧。NASA、智库和安全委员会材料都警告，商业空间站客户基础如果没有政府持续参与，仍然带有猜测性。修订后的 CLD
              政策比旧版永久载人概念更省钱，也可能更现实，但它同样暴露出转型受预算约束的程度。Beyond Earth 强调尚未解决的赔偿和任务授权缺口；Aerospace Safety Advisory Panel
              则警告，NASA 路径仍是愿景，取决于供应商能否证明自己有足够非 NASA 客户存活下来。微重力制造同样受技术约束：开源管线更大了，但 ISS National Lab 自己的 2026
              年微生物研究显示，基础营养输运物理仍可能打断生物生产。因此，月面 / ISS EVA 切口最好视为相邻期权价值，而不是核心 TAM。NASA 显然正在通过 xEVAS 造市，Axiom
              有真实任务订单和月球车集成工作，合同上限也很大。但 OIG 也说 xEVAS 之前这个市场并不存在，且延误可能把演示推到 2031 年，所以这部分上行更适合支撑战略重要性，而不是近期收入承销。
