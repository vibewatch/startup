  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 融资可得性
        - 即使经历 2024 年压力期，Axiom 仍反复吸引主权、战略和合作伙伴资本。
        - 2026 年融资包含债务，具体堆叠仍不透明，因此能拿到资本不等于入场经济性有吸引力。
        - 提供 2025 和 2026 年条款清单，以及债务拆分和契约包。
      - - 合同验证
        - '>$2.2B 的客户合同和 xEVAS 上限表述，显示真实机构需求和项目相关性。'
        - 合同披露口径不是已确认收入；OIG 仍把 xEVAS 描述为对进度敏感的里程碑工作，而不是清晰的经常性经济性。
        - 提供在手订单到现金转化、里程碑验收和按项目利润率。
      - - 载人航天需求
        - Ax-4 定价证明，主权客户仍愿意为任务准入支付可观金额。
        - 座位价格经过谈判且打包出售，外界看不到 Axiom 留存抽成，也看不到任务贡献利润率是否有吸引力。
        - 展示按主权客户拆分的任务层面经济性和重复预订节奏。
      - - 战略位置
        - Axiom 同时拥有空间站、航天服、任务和 NASA 关系，使公司在后 ISS 过渡中具备战略重要性。
        - 这份重要性也意味着，公司高度依赖 NASA 政策、预算设计和交付节奏。
        - 展示非 NASA 空间站需求、入住承诺和后 ISS 客户管线。
      - - 入场纪律
        - 更低的有效入场价可能让同一资产变得有吸引力，因为主要支持方支持和战略相关性确实存在。
        - 如果在接近 2026 年反弹价位买入，却没有干净条款，就可能买到叙事和期权价值，而不是经承销验证的普通股。
        - 承销前，要么改善价格，要么实质性补强证据包。
    notes: 反向逻辑不是 Axiom 缺乏战略相关性；问题在于，公开记录仍要求投资者在私募估值之下推断太多。
