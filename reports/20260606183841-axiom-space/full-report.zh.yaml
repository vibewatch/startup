        blocks:
          - type: paragraph
            body: >-
              定价可见度仍是 Axiom 当前少数优势之一。NASA 公开发布私人宇航员任务的代表性定价逻辑，Associated Press 关于 Ax-4 的报道则称，主权客户为约两周 ISS 任务支付了每席超过 $65
              million。相比之下，已审阅的 Starlab、Orbital Reef 和 Haven-1 公开页面更强调能力、测试、伙伴网络和时间表，没有披露座位、租用或载荷费率。即便 Vast
              的公开定价信号也只是间接的：其 CEO 告诉 SpaceNews，Haven-1 任务应该能与私人 ISS 任务竞争，但公司仍未发布标价。依赖项同样共享，但程度不一。Axiom 近期业务依赖 NASA 继续开放
              ISS 访问，也依赖 SpaceX 运输。Vast 通过 Dragon 运输和 Starlink 系统与 SpaceX 绑定得更明显；Starlab 和 Orbital Reef 仍暴露在 NASA
              转型政策下，因为它们的收入案例依然假设 NASA 会成为商业 LEO 中的多个锚定客户之一。这意味着，竞争风险既由外部平台依赖塑造，也由产品功能塑造。
