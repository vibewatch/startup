        - 政府资助的乘组席位、国家研究组合、公众传播权，以及宇航员项目加速
        - 没有任务服务或空间站时间绑定的泛声望支出
        - 国家航天机构、部委或国家支持项目
        - 核心切入点，因为 Ax-4 显示，在私人空间站完全上线前，政府会购买任务准入
      - - 微重力科研 / 制造准入
        - 面向制药、生物技术、光学、材料和半导体的实验室时间、载荷托管、工艺开发、返回材料和重复飞行准入
        - 从不购买轨道服务的纯地面研发资助或泛“太空经济”投资
        - NASA、ISS National Lab、大学、创业公司和工业研发买方
        - 核心切入点，因为它是经常性空间站租用的最强非旅游理由
      - - 商业空间站基础设施和租用
        - 开发支持、未来服务合同、舱段运营、物流集成和后 ISS 载人演示
        - 不绑定有人值守空间站的通用在轨服务 / SSA、碎片清除或卫星加注
        - 先是 NASA，之后是国际机构和私人租户
        - 核心切入点，因为这是 Axiom 最终想拥有的平台层
      - - 相邻的月面 EVA / 航天服服务
        - NASA xEVAS 任务订单、ISS 航天服支持、月球车集成和未来 EVA 服务合同
        - 独立月球旅游或通用国防航天系统
        - NASA、Artemis 承包商和未来月面运营方
        - 相邻而非核心：战略重要，但仍主要由 NASA 采购创造
      - - 明确排除的代理市场
        - 无——这些只作为参考可比对象
        - 亚轨道旅游、通用轨道物流 / SSA、广义国防航天基础设施，以及混合了不同产品的广义“太空旅游”总可用市场（TAM）
        - 各报告差异很大
        - 只能作为外部边界代理；不应作为 Axiom 直接市场来承做
    notes: 表格有意把 Axiom 实际覆盖的市场与更广义的代理市场分开，让本章可以保留相互冲突的估算，而不混同不同产品。
