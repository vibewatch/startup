  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险判断
        blocks:
          - type: paragraph
            body: >-
              Axiom 的风险画像由同步执行主导，而不是某个孤立问题。排名最高的风险是：Axiom 必须在对 NASA 有意义的时间表上交付 Axiom Station 硬件和 AxEMU 航天服，同时还要继续飞 ISS
              任务并融资。2026 年 4 月 NASA OIG 审计把这一担忧从泛泛的创业公司风险推到有记录的项目风险：原定航天服演示时间表不可实现；Collins 退出后，NASA 依赖 Axiom 作为单一 xEVAS
              供应商；如果按历史平均延期幅度，演示可能推到 2031 年。第二大风险是对 NASA 的依赖：NASA 同时是客户、政策制定者和未来认证方，而商业空间站市场仍像政府牵引，并非自我维持。第三是对 SpaceX 和
              Thales 的供应商 / 伙伴依赖。第四是再融资和供应商付款风险。第五是法律、出口管制、隐私和安全暴露；这些风险已在公开政策和监督报告中可见，但公开披露尚未充分去风险。
