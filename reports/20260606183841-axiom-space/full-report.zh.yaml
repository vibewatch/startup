      - number: '1.2'
        title: 创始人、领导层更替与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Axiom 同时推进多个资本密集型项目，领导层记录因此格外重要。官方团队材料显示，Kam Ghaffarian 是联合创始人兼执行董事长，Michael Suffredini 是联合创始人、首任 CEO 至
              2024 年，Jonathan Cirtain 是现任 CEO 兼总裁。Axiom 2025 年 10 月公告还感谢前任 CEO Tejpaul Bhatia 在过渡期带领公司，说明公司在 2024 到 2025
              年之间经历过多种 CEO 安排。2024 年 9 月的独立负面报道称，Suffredini 于 2024 年 8 月因个人原因卸任，Ghaffarian 在选出长期继任者前担任临时
              CEO。公开领导层材料显示，公司在宇航员运营、空间站运营、法务、政策、科学和财务上有人才深度，但已抓取的官方材料没有公开列出董事会成员。这留下治理缺口：投资人能看到高管面孔和创始人履历，却看不到董事会构成、委员会监督或当前所有权
              / 控制权的清晰公开记录。考虑到融资轮规模和创始人影响力集中，关键人风险和治理透明度仍是核心尽调议题。
