  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先界定市场，再谈规模
        blocks:
          - type: paragraph
            body: >-
              Axiom 真正面对的市场是商业 LEO 基础设施和服务，不是笼统的“太空经济”。纳入的支出包括：通过美国经纪商卖给
              ISS、未来再卖给商业空间站的私人宇航员任务；国家机构购买访问、训练、载荷集成和声望的主权宇航员任务；卖给科学、制药、材料和半导体用户的微重力研究与制造访问；NASA 和其他机构客户在 ISS
              退役后购买的空间站基础设施和租用服务；以及相邻的月面 / ISS EVA 服务切口，因为 Axiom 在月面和轨道应用中使用同一套航天服架构。排除项同样重要：亚轨道休闲旅游、泛空间物流和 SSA
              收入、偏国防的轨道基础设施，以及把太空酒店、气球和奢华旅行打包进去的宽泛“太空旅游”类别。NASA 自己的转型表述很关键：该机构希望成为商业市场中的多个客户之一。这意味着 Axiom
              需要多元客户，也意味着可服务市场应按谁会实际购买经常性 LEO 服务来界定。
