  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: NASA 作为锚定客户，以及 Axiom 今天销售内容的边界
        blocks:
          - type: paragraph
            body: >-
              在 Axiom 的客户栈里，NASA 是当前最清晰的客户和交易对手。公开记录异常具体：NASA 已连续五次向 Axiom 授予私人宇航员任务，Ax-5 目标不早于 2027 年 1 月；NASA
              自己的新闻稿还说明，这段关系是双向的。Axiom 从 NASA 购买任务服务，例如乘组消耗品、货物运输、存储和日常使用的 ISS 资源；NASA 反过来向 Axiom 购买冷藏样本返回。这让 NASA
              不只是发射许可方。它是锚定买家、当前目的地所有者、与国际伙伴一起把关乘组审批的机构，也是每次任务内部的商业交易对手。


              这个区分很重要，因为它让本章立足于当前使用，而不是空间站营销。Axiom 今天可证明销售的是托管式 ISS 访问：乘组打包、任务集成、任务控制支持，以及短期空间站停留中的微重力研究执行。NASA 的 PAM
              项目明确称，这些任务是未来商业空间站的探路者；但当前证明仍基于任务，并依赖 ISS。换句话说，Axiom 今天确有客户活动，但最强客户证明围绕访问经纪和任务运营，而不是独立目的地租用。
