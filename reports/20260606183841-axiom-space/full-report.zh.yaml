      - number: '5.1'
        title: Axiom Station 模块与新的组装顺序
        blocks:
          - type: paragraph
            body: >-
              Axiom 的公开产品故事现在围绕重新排序的空间站建设展开，而不只是泛泛承诺“总有一天建商业空间站”。公司称，在轨顺序现在从 Payload Power Thermal Module（AxPPTM）开始，然后是
              Hab One、气闸、Hab Two，最后是 Research and Manufacturing Facility。明确理由是运营性的，不是表面调整：NASA 要求 Axiom 调整顺序，让未来的 Axiom
              舱段能与 ISS 脱轨飞行器共存，保留有价值的 ISS 设备，并更早达到自由飞行。Payload 的独立报道补上了机制：PPTM 可使用不同于原 Hab One 优先计划的 ISS 端口，为可回收 ISS
              硬件提供更多存储，并在首个模块到达约九个月后形成双模块自由飞行器。


              模块级能力图谱也足够具体，可以用于承销。Axiom 的空间站页面给每个模块分派了不同工作：PPTM 负责基础设施转移，Hab One 启用载人居住和初步研究 / 制造，气闸带来未来 EVA 能力，Hab Two
              扩大乘员和实验室容量，AxRMF 是专用研究制造设施。Thales 和 Axiom 的材料都称，前两个发射的加压模块各有四个乘员舱位。这让投资人可以具体理解 Axiom
              实际在建什么：不是单体巨型空间站，而是分阶段轨道平台；在完整建成前，早期用途取决于电力、存储、停靠和研究支持。


              制造成熟度可见但不完整。Axiom 称，首个模块在 Thales 开始焊接和加工主结构前，已通过 NASA 初步和关键设计评审，最终集成放在 Houston。Payload 补充称，Axiom 正为 PPTM
              复用大量既有 Hab One / Hab Two 物料集，并在软件、工程、生命支持和部分内部建造上做垂直整合，同时仍依赖伙伴负责结构和部分子系统。这个组合提高了进度灵活性，但也意味着只有 NASA
              接口假设、Thales 结构交付和 Houston 最终集成都保持一致，模块顺序才跑得通。
