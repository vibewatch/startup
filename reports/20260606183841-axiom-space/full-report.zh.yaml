      - number: '3.4'
        title: Axiom 的护城河在运营端，但政策和替代品会侵蚀
        blocks:
          - type: paragraph
            body: >-
              因此，Axiom 的护城河中等，并非天然耐久。公司拥有真实运营优势：反复执行 PAM、拿下可见主权客户、公开价格参考，以及从挂接 ISS
              模块走向自由飞行空间站的可信路径。买家如果需要训练、载荷集成、机构批准，以及有空间站经验的任务指挥官，这些优势会形成切换成本。但护城河并非独占。NASA 正刻意分散供应商，Space Adventures 和
              Polaris 式自由飞行器任务可以吸收由声望或赞助驱动的需求，India 等国家机构仍可选择国家主导航天员访问，而不是经常性购买商业座位。反向证据很重要：NASA OIG
              警告，市场需求有限和资金不足威胁转型时间表；SpaceNews 报道称，因为真正的空间站市场尚未成形，NASA
              公开考虑过核心模块后备方案。如果政策不确定性持续，胜出的可能不是长期空间站愿景最宽的公司，而是最能接入 NASA 采购桥梁的公司。
