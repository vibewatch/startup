- id: buyers-and-adoption
  title: The buyers are visible, but repeat purchasing is still concentrated
  body: 'The buyer map is clearer than the aggregate TAM. NASA is the market shaper: it funds development, certifies safety, buys services, and constrains cadence. Sovereign governments are the clearest non-NASA paying class visible today. Ax-4 did not look like a leisure mission; it put India, Poland, and Hungary onto the ISS with government-backed astronauts, a 14-day manifest, and a research portfolio spanning 31 countries. That is why sovereign demand matters more than generic tourism rhetoric for Axiom. A second paying segment is research and manufacturing users who need persistent microgravity access, not a one-off publicity event. ISS National Lab and NASA are deliberately trying to move that segment from grant-funded experiments to recurring business models, and competitor infrastructure providers like Sierra Space are already signing semiconductor and materials partnerships around future orbital platforms. The third buyer layer is future station operators and international agencies
    beyond Axiom itself, as shown by Voyager''s 2028 PAM selection and NASA''s permission for direct international partnerships with CLD providers. The problem is concentration: public evidence for demand exists, but repeat commitments, price disclosure, and post-ISS backlog are still mostly private.'
