- id: constraints-and-adjacent-upside
  title: Adoption constraints are real, and lunar EVA is adjacent not core
  body: 'The hardest diligence work sits on the constraint side. NASA, think-tank, and safety-panel materials all warn that the commercial-station customer base remains speculative without ongoing government participation. The revised CLD policy is more affordable and probably more realistic than the older permanently crewed concept, but it also reveals how budget-bound the transition is. Beyond Earth highlights unresolved indemnification and mission-authorization gaps, while the Aerospace Safety Advisory Panel warned that NASA''s path is still aspirational and depends on providers proving they have enough non-NASA customers to survive. Microgravity manufacturing also remains technically constrained: the open-source pipeline is bigger, but ISS National Lab''s own 2026 microbes study shows that basic nutrient-transport physics can still break biological production. The lunar/ISS EVA wedge is therefore best treated as adjacent option value rather than core TAM. NASA is clearly market-making
    there through xEVAS, Axiom has real task orders and rover integration work, and the contract ceilings are large. But OIG also says the market did not exist before xEVAS and delays could push demonstrations to 2031, so that upside should support strategic relevance more than near-term revenue underwriting.'
