tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Axiom
  rows:
  - - Private astronaut missions
    - Mission brokerage, astronaut training, payload integration, on-orbit operations, sample return, and station resource use for ISS or successor stations
    - Suborbital joyrides and zero-gravity tourism that do not require station operations
    - U.S. mission broker plus private or sovereign end customer; NASA also buys or sells mission services around each flight
    - Core wedge because it is already commercialized and teaches the operating model for station services
  - - Sovereign astronaut missions
    - Government-sponsored crew seats, national research portfolios, outreach rights, and astronaut-program acceleration
    - Generic prestige spending with no mission services or station time attached
    - National space agencies, ministries, or state-backed programs
    - Core wedge because Ax-4 shows governments will buy mission access before private stations are fully online
  - - Microgravity research / manufacturing access
    - Lab time, payload hosting, process development, returned materials, and repeat flight access for pharma, biotech, optics, materials, and semiconductors
    - Pure Earth-based R&D grants or generic “space economy” investment that never buys orbital services
    - NASA, ISS National Lab, universities, startups, and industrial R&D buyers
    - Core wedge because it is the strongest non-tourism rationale for recurring station tenancy
  - - Commercial station infrastructure and tenancy
    - Development support, future service contracts, habitat operations, logistics integration, and post-ISS crewed demonstrations
    - Generic in-orbit services/SSA, debris removal, or satellite refueling not tied to human-tended stations
    - NASA first, then international agencies and private tenants
    - Core wedge because this is the platform layer Axiom ultimately wants to own
  - - Adjacent lunar EVA / spacesuit services
    - NASA xEVAS task orders, ISS spacesuit support, rover integration, and future EVA-service contracts
    - Standalone lunar tourism or generic defense-space systems
    - NASA, Artemis contractors, and future lunar operators
    - 'Adjacent, not core: strategically important but still largely created by NASA procurement'
  - - Explicitly excluded proxy markets
    - None — these are reference comparables only
    - Suborbital tourism, generic orbital logistics/SSA, broad defense-space infrastructure, and broad “space tourism” TAMs that mix unlike products
    - Varies widely by report
    - Useful only as outer-bound proxies; they should not be underwritten as Axiom's direct market
  notes: The table intentionally separates Axiom’s actual addressed market from broader proxy markets so the chapter can preserve conflicting estimates without conflating unlike products.
