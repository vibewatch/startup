- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - NASA development / transition
    - Space Operations Mission Directorate and ISS program
    - Astronaut office, station operators, research users
    - NASA appropriations
    - Fund development, set certification path, buy services after demos
    - Federal human-spaceflight and station-transition budgets
    - Avoiding a post-ISS service gap while lowering operating cost
  - - Sovereign astronaut missions
    - National space agencies and ministries
    - Government astronauts, science teams, public-outreach programs
    - National governments
    - Buy crew seats, training, payload integration, and mission operations
    - Human-spaceflight or science diplomacy budget
    - National prestige plus scientific return without building a domestic station first
  - - Research institutions / industrial R&D
    - Principal investigators, biotech/materials startups, university labs
    - Scientists, payload operators, process engineers
    - NASA, ISS National Lab, grants, or corporate R&D budgets
    - Book payload access, develop process, return samples/products to Earth
    - R&D, innovation, or translational-science budget
    - A microgravity result that cannot be replicated terrestrially
  - - Manufacturing-tenancy prospects
    - Semiconductor, materials, and platform partners
    - Manufacturing payload teams
    - Corporate capex plus mission budgets
    - Move from flight demonstration to repeated orbital production and logistics support
    - Advanced-manufacturing or new-product budget
    - Proof that quality improvement outweighs upmass/downmass cost
  - - Future CLD providers / international partners
    - Commercial station developers and partner agencies
    - Platform operators and their tenant mix
    - Provider capital plus partner co-investment
    - Use missions and shared standards to de-risk later station operations
    - Platform-development and partnership budget
    - Need to secure early anchor tenants and interoperability paths
  - - Adjacent lunar EVA customers
    - NASA Artemis program and future lunar operators
    - Astronauts and EVA operations teams
    - NASA task orders and later lunar-operations budgets
    - Buy EVA services, suit integration, and rover interfaces
    - Exploration systems budget
    - Need for a flight-ready suit after legacy EMU limits and xEVAS delays
  notes: 'The buyer map shows that Axiom’s market is multi-sided: NASA shapes standards and budgets, sovereign agencies buy missions, and research/manufacturing users may become recurring tenants if technical ROI is proven.'
