  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pam-unit-economics
    missingEvidence: Public seat-level contract prices, gross margin structure, and payload pricing by mission remain undisclosed; NASA resource pricing is not the same as Axiom's sell price.
    whyItMatters: Without provider-level pricing and contribution margin evidence, investors cannot convert NASA's mission cadence ceiling into a defendable revenue or EBITDA forecast.
    diligencePath: Request executed or redacted customer contracts, seat-price schedules, mission P&Ls, and post-mission contribution-margin reviews for Ax-3 and Ax-4.
    relatedQuestionRefs:
    - QM015
    - QM025
  - type: private-evidence-only
    severity: blocking
    topic: post-iss-customer-base
    missingEvidence: Named non-NASA anchor customers, LOIs, utilization commitments, and renewal pathways for post-ISS station capacity are mostly private.
    whyItMatters: The biggest underwriting risk is not technical feasibility alone but whether enough sovereign, research, and commercial tenants will contract for a station after ISS retirement.
    diligencePath: Request pipeline and booked-backlog detail by customer class, including sovereign missions, pharma/materials users, and any post-2030 NASA or partner MOUs.
    relatedQuestionRefs:
    - QM023
    - QM025
  - type: private-evidence-only
    severity: material
    topic: sovereign-repeat-demand
    missingEvidence: Public follow-on manifests, budgets, or memoranda showing that India, Poland, Hungary, or other countries intend repeat purchases after Ax-4 are still limited.
    whyItMatters: Sovereign astronaut demand is one of the clearest non-NASA revenue wedges today, but one completed mission does not yet prove a durable annual market.
    diligencePath: Request sovereign pipeline by country, proposal status, training agreements, and forward budget support tied to repeat missions or station-tenancy purchases.
    relatedQuestionRefs:
    - QM004
    - QM012
    - QM025
  - type: conflicting-data
    severity: material
    topic: microgravity-manufacturing-proof
    missingEvidence: Open-source materials show a larger project pipeline but still do not show repeat production revenue, conversion rates from pilots to production, or customer retention.
    whyItMatters: Microgravity manufacturing is central to long-run station demand narratives; if it remains grant-driven or technically fragile, the most important non-tourism upside case weakens materially.
    diligencePath: Obtain customer-level purchase orders, returned-product qualification results, repeat-flight schedules, and cost-per-kg economics for the leading materials and biotech tenants.
    relatedQuestionRefs:
    - QM018
    - QM019
    - QM025
