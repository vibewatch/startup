- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - NASA transition budget still exists
    - Positive
    - 2025-2031
    - Provides a real but finite floor for station-development demand
    - Map awarded and prospective NASA dollars by milestone and by provider
  - - Sovereign astronaut demand is visible
    - Positive
    - Current
    - Ax-4 proves governments will buy mission access and research packages before commercial stations are ready
    - Request pipeline by country, proposal stage, and expected repeat cadence
  - - PAM cadence remains capped
    - Negative
    - Current ISS era
    - Even bullish demand hits a throughput ceiling if NASA continues to allow only up to two missions per year
    - Request station-era cadence assumptions and transport allocations beyond ISS
  - - Non-NASA station customer base is still speculative
    - Negative
    - Pre-2030 to early 2030s
    - The market can fail even if hardware launches if anchor tenants do not materialize
    - Obtain booked backlog, LOIs, and renewal probability by customer class
  - - Microgravity R&D pipeline is growing
    - Positive
    - Current to medium term
    - A larger tenant funnel exists for optics, biotech, and materials users
    - Request conversion rates from grants and demonstrations to repeat paid missions
  - - Microgravity production physics are still hard
    - Negative
    - Current
    - Technical bottlenecks can delay or kill the most important non-tourism revenue thesis
    - Review process yields, failure modes, and Earth-return qualification data
  - - Regulatory / indemnification gaps persist
    - Negative
    - Current
    - Insurance and mission-authorization uncertainty can suppress investment and customer contracting
    - Request legal memo on indemnification, licensing, and customer liability allocation
  - - Lunar EVA adjacency is real but NASA-made
    - Mixed
    - 2026-2031
    - xEVAS and rover work add strategic upside, but near-term demand still depends mainly on NASA procurement and schedule recovery
    - Request xEVAS backlog, milestone schedule, and any non-NASA EVA inquiries
  notes: 'This table mixes drivers and constraints because the central diligence issue is timing: several demand wedges are real, but almost all remain bottlenecked by budgets, certification, regulation, or technical proof.'
