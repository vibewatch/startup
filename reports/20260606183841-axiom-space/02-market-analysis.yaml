  name: Axiom Space
chapter:
  number: 2
  title: Market Analysis
  summary: Axiom Space is not addressing the generic “space economy”; it is addressing a much narrower commercial-LEO infrastructure and services market made up of ISS-to-post-ISS mission services, sovereign and private astronaut access, microgravity research/manufacturing tenancy, and a supportable adjacent lunar EVA/spacesuit wedge. Public evidence supports real demand signals in sovereign missions and R&D access, but NASA budget caps, transition-policy changes, regulatory gaps, and still-unproven non-government station utilization keep the near-term serviceable market far smaller than bullish space-tourism TAMs imply.
sections:
- id: boundary-definition
  title: Define the market before sizing it
  body: 'Axiom''s relevant market is commercial LEO infrastructure and services, not the undifferentiated “space economy.” The included spend is the combination of: private astronaut missions sold through U.S. brokers to the ISS and, later, commercial stations; sovereign astronaut missions where national agencies buy access, training, payload integration, and prestige; microgravity research and manufacturing access sold to science, pharma, materials, and semiconductor users; the station infrastructure and tenancy services that NASA and other institutional customers will purchase after ISS retirement; and an adjacent lunar/ISS EVA-services wedge because Axiom is using one suit architecture across lunar and orbital applications. The excluded spend is just as important: suborbital leisure tourism, generic space-logistics and SSA revenue, defense-heavy orbital infrastructure, and broad “space tourism” categories that bundle space hotels, balloons, and luxury travel. NASA''s own transition language
    matters here because it says the agency wants to be one of many customers in a commercial marketplace, which means Axiom needs diverse customers but also that the addressable market should be defined by who will actually buy recurring LEO services.'
