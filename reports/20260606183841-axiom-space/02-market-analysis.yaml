- id: TM002
  title: Sizing lens table
  columns:
  - Lens
  - Publisher / method
  - Timing / geography
  - Visible value
  - What it actually measures
  - Boundary / limitation
  rows:
  - - Revised CLD development budget
    - NASA directive plus SpaceNews coverage
    - FY2026-FY2031, U.S.
    - $272.3M FY2026 request; $2.1B over five years; ~$1.0B-$1.5B for next-phase agreements
    - Public development support for commercial station demonstrations
    - This is a procurement/budget lens, not the full post-ISS market
  - - ISS-era private mission throughput
    - NASA PAM policy + Ax-4 crew size
    - Current ISS era, global customers via U.S. broker
    - ~8 seats/year ceiling
    - Two PAMs per year with four-person crews if current rules persist
    - This is a mission-capacity estimate, not revenue, and it can change if cadence or crew size changes
  - - Sovereign-demand proof point
    - Ax-4 official mission evidence
    - 2025 mission, India/Poland/Hungary plus 31-country research set
    - 3 sovereign customer seats; ~60 studies; 31 countries
    - Current evidence that governments will pay for astronaut access and research portfolios
    - One mission proves willingness-to-pay but not durable annual cadence
  - - Research-manufacturing support lens
    - NASA InSPA + ISS National Lab calls
    - Spring 2023 onward, U.S.-led LEO R&D market
    - '>$60M across 20+ awards'
    - Publicly funded pipeline intended to move research toward scalable commercial production
    - Grant and mission-support spending do not equal recurring tenancy revenue
  - - Open-source manufacturing pipeline lens
    - Factories in Space survey
    - 2024 global snapshot
    - 303 entities, up from 117 in 2022
    - Observable ecosystem of potential users/suppliers for in-space manufacturing
    - Entity count is pipeline breadth, not booked demand; profitable production remains unproven
  - - Broad proxy tourism lens
    - SkyQuest
    - 2025-2033 global forecast
    - $1.7B in 2025; $2.39B in 2026; $25.96B in 2033
    - A broad “space tourism” market that includes orbital tourism and station stays
    - Bundles suborbital tourism and other products that Axiom does not directly sell as its core market
  - - Boundary-creep comparator
    - Research and Markets
    - 2026 global product definition
    - Orbital space tourism includes short-duration flights, long-duration station stays, and PAMs
    - A category map showing how broad tourism vendors collapse multiple orbital products into one TAM
    - Useful for comparison, but not a clean Axiom-specific market estimate
  - - Adjacent orbital-services comparator
    - Novaspace
    - Ten-year global forecast
    - $4.6B commercial revenue over a decade
    - In-orbit services and SSA markets
    - Mostly excludes the human-spaceflight services that matter to Axiom; use only as an excluded adjacent benchmark
  notes: Rows intentionally preserve incompatible public lenses instead of blending them into a single fake TAM. Where values use different units or time windows, the boundary is stated explicitly.
