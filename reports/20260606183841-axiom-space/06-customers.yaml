chapter:
  number: 6
  title: Customers
  summary: Axiom Space has real customers today, but the proof is uneven by segment. NASA is the clearest anchor customer and counterparty, sovereign-astronaut missions from Saudi Arabia to India/Poland/Hungary show genuine government use rather than logo-only marketing, and Ax-4 reveals a broader research-user surface through ISS National Lab and named payload sponsors. Public durability evidence, however, is strongest for NASA mission cadence and weakest for non-NASA economics, top-customer concentration, and future station-tenancy commitments.
sections:
- id: nasa-anchor-and-current-service-boundary
  title: NASA as anchor customer and the boundary of what Axiom sells today
  body: "NASA is the clearest present-day customer and counterparty in Axiom’s customer stack. The public record is unusually specific: NASA has already awarded five consecutive private astronaut missions to Axiom, with Ax-5 targeted no earlier than January 2027, and NASA’s own release says the relationship runs both directions. Axiom purchases mission services from NASA such as crew consumables, cargo delivery, storage, and daily-use ISS resources; NASA in turn buys cold-stow sample return from Axiom. That makes NASA more than a launch-permit giver. It is the anchor buyer, the owner of the current destination, the crew-approval gatekeeper with international partners, and a commercial trading counterparty inside each mission.\n\nThat distinction matters because it keeps the chapter grounded in present usage rather than station marketing. What Axiom demonstrably sells today is managed ISS access: crew packaging, mission integration, mission-control support, and microgravity research execution\
    \ on short-duration station stays. NASA’s PAM program explicitly says these missions are pathfinders for future commercial stations, but the current proof is still mission-based and ISS-dependent. In other words, Axiom has real customer activity today, yet the strongest customer proof is around access brokerage and mission operations, not independent destination tenancy."
