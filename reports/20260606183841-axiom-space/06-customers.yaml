- id: repeat-behavior-and-public-proof-limits
  title: Repeat behavior, durability, and the limits of public customer proof
  body: "The public durability signal is strongest where the contracting framework is clearest: NASA. Five consecutive PAM awards give Axiom visible repeat business from the same anchor customer, and that is better retention proof than most private-space peers disclose. Outside NASA, the evidence weakens. Sovereign astronaut missions across Saudi Arabia, Türkiye, India, Poland, and Hungary prove real purchase decisions, but the public record usually shows one mission at a time, tied to national objectives rather than a disclosed renewal program. Research users like Burjeel, Booz Allen, and UCSD prove active mission usage, and Sanford’s follow-on cancer work is one of the best examples of repeat research demand, yet even there the public materials do not disclose whether the renewal economics accrue directly to Axiom, through ISS National Lab sponsorship, or via another partner structure.\n\nJust as important, the reviewed materials do not disclose customer count, NRR, GRR, churn, top-customer\
    \ share, or renewal rates. That means the chapter can separate pilots from live missions and logos from actual use, but it cannot convert that proof into a conventional software-style durability model. Investors should treat Axiom’s customer evidence as strong on execution reality, moderate on repeat patterns outside NASA, and weak on disclosed customer economics."
