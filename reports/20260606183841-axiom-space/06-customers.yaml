- id: research-and-payload-users
  title: 'Research and payload users: visible use, fuzzier payment paths'
  body: "Public customer evidence broadens further when Ax-4 is treated as a research platform, not only a sovereign-astronaut mission. ISS National Lab said Ax-4 would launch more research than any previous private Axiom mission, including more than 60 experiments from 31 countries and more than two dozen ISS National Lab-sponsored investigations. That gives Axiom a real payload-user surface beyond the crew-buying governments. The named users are valuable because they identify actual mission use cases. Burjeel Holdings from the UAE is using Ax-4 to test glucose monitoring and insulin viability in microgravity through the Suite Ride project. Booz Allen Hamilton is testing wearable biometrics and edge processing. The Sanford Stem Cell Institute at UC San Diego is extending prior Axiom cancer research. HUNOR also appears inside the ISS National Lab manifest with named perception and plant-growth experiments.\n\nStill, proof quality differs across these users. The missions are real and the\
    \ experiments are real, but the monetization path is often opaque. ISS National Lab sponsorship means some users may be buying Axiom access indirectly, receiving sponsored slots, or participating through a layered partner stack rather than signing a plainly visible Axiom contract. That makes these research users important evidence of utilization and market breadth, while leaving open the harder diligence questions about contract size, direct revenue capture, and repeat behavior."
