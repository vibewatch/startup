tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Current use case
  - Public proof quality
  - Strategic value
  - Gap
  rows:
  - - NASA / ISS Program
    - Buyer=NASA mission office; users=Axiom crews and payloads; payer=NASA and Axiom in split service flows
    - Private astronaut mission orders, ISS resources, sample return
    - Highest — five consecutive mission orders and explicit bilateral service purchases
    - Anchor revenue and operational legitimacy
    - No public mission-level margin, pricing, or top-line value disclosed
  - - Sovereign astronaut programs
    - Buyer=government space agency or state-backed program; users=national astronaut and research teams; payer=government
    - Discrete national missions to ISS via Ax-2/Ax-3/Ax-4
    - High — multiple named flown missions with experiments
    - Creates repeatable international demand funnel and geopolitical credibility
    - Public evidence rarely shows contract size or multi-mission commitments
  - - Private individual / sponsor-backed crew members
    - Buyer may be individual, sponsor, or donor; user=private astronaut; payer=private capital
    - Mission seat plus outreach and science participation
    - Medium — Ax-1/Ax-2 pages show private participants, but payment detail is absent
    - Adds non-government demand surface
    - Public record does not show how repeatable this segment is
  - - Research institutions and universities
    - Buyer may be institution, grant sponsor, or intermediary; users=scientists and principal investigators
    - Microgravity experiments and payload execution on ISS
    - Medium — named projects exist, but direct contracting path is often hidden
    - Broadens use beyond astronaut seats and creates payload pipeline
    - Named-user list is partial and economics are opaque
  - - ISS National Lab-sponsored payload users
    - Buyer / sponsor=ISS National Lab or partner sponsor; users=companies, universities, and sovereign programs
    - Sponsored investigations on Ax-4 and prior missions
    - Medium — real experiments with named institutions
    - Can feed future repeat usage and diversify demand
    - Intermediated sponsorship obscures Axiom net revenue capture
  - - Future station tenants (thesis stage)
    - Potential buyer=nations, labs, manufacturers, commercial partners; user=astronauts and payload teams
    - Later free-flyer research, habitation, and manufacturing
    - Low — strong narrative but sparse public contract proof
    - Largest long-term upside if mission users convert
    - No public tenant roster or signed long-duration contracts in reviewed sources
  notes: Rows separate current mission buyers and users from the future station-tenancy thesis. “Proof quality” reflects public evidence strength, not revenue quality.
