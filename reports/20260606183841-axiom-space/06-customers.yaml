- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / execution risk
  - Impact
  - Diligence path
  rows:
  - - NASA mission cadence
    - NASA remains the dominant anchor customer and gateway to ISS access
    - Strong current validation but high single-customer concentration
    - Request revenue share tied to NASA-awarded PAMs and non-NASA backlog by mission
  - - Sovereign astronaut programs
    - Deals appear episodic and procurement-heavy, with approval friction through NASA and partner review
    - Good growth surface but weak public renewal visibility
    - Request sovereign pipeline, repeat-country plans, and contract structures
  - - ISS National Lab-sponsored research
    - Partner sponsorship can mask direct Axiom monetization
    - Helps utilization and user diversity, but net revenue capture may be thinner than headline activity
    - Request direct-pay vs sponsored payload revenue split
  - - Burjeel / healthcare payloads
    - Some demand sits at pilot-study or MOU stage rather than recurring procurement
    - Useful proof of adjacent healthcare demand, but not yet station-tenancy proof
    - Request signed follow-on mission scope and commercial terms
  - - Future Axiom Station tenancy
    - Independent analysts warn stable commercial-station customer base is still speculative
    - Largest upside case also carries the biggest demand risk
    - Request tenant roster, LOIs, reservation deposits, and minimum-use commitments
  - - Market structure after ISS
    - NASA phase-two framework still emphasizes demo missions and later service certification
    - Mission demand may arrive before a deep tenant market is proven
    - Request management view on pre-booked occupancy vs speculative pipeline
  notes: Risk rows distinguish currently monetized mission demand from the still-unproven long-duration tenant thesis. Public evidence supports concentration risk more strongly than it supports broad station demand.
