figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Axiom’s present customer journey starts with NASA-brokered mission access and can branch into sovereign astronaut programs, research payloads, and a still-speculative future station-tenancy loop.
  data:
    items:
    - id: solicit
      label: Mission solicitation / outreach
      actor: NASA, sovereign agency, research sponsor, or private buyer
      description: Demand enters through NASA PAM solicitations, sovereign astronaut programs, or research-access outreach rather than through a self-service station booking engine.
      channels:
      - NASA PAM process
      - Government astronaut programs
      - Axiom mission sales
      - Research outreach
    - id: approve
      label: Crew / payload approval
      actor: NASA, Axiom, partners, sponsoring customer
      description: Crews and payloads move through mission integration, NASA review, training, and ISS resource planning before they become a flown customer mission.
      channels:
      - Crew review
      - NASA partner approval
      - Training
      - Payload integration
    - id: fly
      label: Flown ISS mission
      actor: Astronauts, sovereign programs, payload users
      description: Current production use is a short-duration ISS mission with science, outreach, and technology demonstrations, usually lasting about 10 to 14 days.
      channels:
      - Dragon launch
      - ISS docking
      - On-orbit science
      - Mission control
    - id: repeat
      label: Repeat / expand
      actor: NASA, returning research institutions, additional governments
      description: The best evidenced repeat loop is NASA mission cadence, while repeat research use and additional sovereign programs are visible but less economically transparent.
      channels:
      - Follow-on mission order
      - New sovereign cohort
      - Repeat payload study
      - ISS National Lab sponsorship
    - id: station
      label: Future station conversion
      actor: Potential long-duration tenants
      description: Axiom wants mission users to convert into future station customers, but public proof of signed tenant commitments remains limited.
      channels:
      - Commercial station planning
      - Future research/manufacturing
      - National astronaut ambitions
      - Tenant pipeline
