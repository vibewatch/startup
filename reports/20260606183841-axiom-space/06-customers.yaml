  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A current full customer ledger showing which governments, institutions, and private buyers paid for each flown mission or payload slot.
    whyItMatters: The chapter can prove real usage but cannot fully size concentration or separate direct-paying customers from sponsor-mediated participants.
    diligencePath: Request a mission-by-mission customer table with buyer, user, payer, mission date, use case, and commercial value.
    relatedTableRefs:
    - TU003
    - TU001
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Public disclosure of customer count, NRR, GRR, churn, repeat mission rate, and top-customer revenue share.
    whyItMatters: Without durability metrics, investors cannot convert operational proof into a conventional retention or concentration model.
    diligencePath: Request customer cohort reporting and top-customer share for NASA, sovereign programs, and research users.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU017
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: research-monetization
    missingEvidence: Contract path and economics for ISS National Lab-sponsored or partner-sponsored research payloads, including whether Axiom is paid directly.
    whyItMatters: Named research users are visible, but current public evidence cannot tell whether the work scales into durable, high-margin customer revenue for Axiom.
    diligencePath: Request direct-pay versus sponsored payload revenue mix, average payload value, and repeat-booking statistics.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: future-station-tenants
    missingEvidence: Signed long-duration tenant contracts, LOIs, reservations, or deposit-backed occupancy commitments for Axiom Station.
    whyItMatters: The valuation upside depends on proving that today’s mission users convert into future station customers, not just on showing that missions can fly.
    diligencePath: Request current tenant pipeline by segment, commitment stage, planned duration, and expected start date.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
    - TU006
  - type: conflicting-data
    severity: minor
    topic: saudi-and-uae-expansion
    missingEvidence: Clear documentation separating flown Saudi sovereign missions from later Saudi or UAE microgravity-research MOUs and pilot projects.
    whyItMatters: The public record supports interest from Gulf-region users, but it mixes flown mission proof with pre-station partnership narratives.
    diligencePath: Request a timeline of Gulf-region customers showing flown missions, signed research projects, and future station-use discussions by entity.
    relatedQuestionRefs:
    - QU005
    - QU012
    relatedTableRefs:
    - TU003
    - TU006
