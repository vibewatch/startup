  - CE019
  - CE020
- calloutType: strength
  title: Station resequencing is a genuine product design change, not just a date slide
  body: 'Moving PPTM ahead of Hab One changes how the station becomes useful: Axiom is optimizing for earlier independence, equipment transfer, and coexistence with ISS end-of-life traffic rather than waiting for a habitat-first configuration.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
