- calloutType: strength
  title: Axiom already sells the workflow it wants station hardware to replace
  body: 'The company’s clearest product maturity is operational, not structural: it can already source crews, run training with NASA and SpaceX, execute missions from MCC-A, and deliver ISS-based research access. That gives Axiom a real service engine while station hardware is still in build.'
  claimRefs:
