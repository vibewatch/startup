  title: AxEMU has real test momentum but remains exposed to NASA schedule gates
  body: Public testing progress is meaningful, yet NASA OIG and GAO show that the suit still sits inside a larger Artemis schedule chain with credible downside scenarios. The program should be treated as advancing, not de-risked.
