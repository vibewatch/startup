  title: Product & Technology
  summary: Axiom Space currently delivers managed private-astronaut missions and ISS-based microgravity research access, while building a future stack anchored by the resequenced Axiom Station module chain and the AxEMU spacesuit program. Public evidence supports a specific station assembly order, real NASA-integrated mission workflow, and meaningful AxEMU testing progress, but also shows concentration on NASA, SpaceX, and Thales interfaces plus schedule and manufacturing risks that still need underwriting.
sections:
- id: station-modules-assembly
  title: Axiom Station modules and the new assembly order
  body: |-
    Axiom’s public product story is now organized around a resequenced station build, not just a generic “commercial station someday” promise. The company says the on-orbit order now begins with the Payload Power Thermal Module (AxPPTM), then Hab One, then an airlock, Hab Two, and finally the Research and Manufacturing Facility. The explicit rationale is operational, not cosmetic: NASA asked Axiom to adjust the sequence so the future Axiom segment could coexist with the ISS deorbit vehicle, preserve valuable ISS equipment, and reach free-flight sooner. Payload’s independent reporting adds the missing mechanics: the PPTM can use a different ISS port than the original Hab One-first plan, offers more storage for salvaged ISS hardware, and creates a two-module free-flyer roughly nine months after the first module arrives.

    The module-level capability map is also specific enough to underwrite. Axiom’s station page assigns distinct jobs to each module: PPTM handles infrastructure transfer, Hab One turns on crewed habitation and initial research/manufacturing, the airlock brings future EVA capability, Hab Two expands crew and lab capacity, and AxRMF is the dedicated research-manufacturing facility. Thales’ and Axiom’s materials both say the first two launched pressurized modules each contain four crew quarters. That gives investors a concrete interpretation of what Axiom is actually building: not a single monolithic station, but a staged orbital platform whose early utility depends on power, storage, berthing, and research support before the full buildout arrives.

    Manufacturing maturity is visible but incomplete. Axiom says the first module advanced through preliminary and critical design review with NASA before Thales began welding and machining primary structures, and that final integration will occur in Houston. Payload adds that Axiom is reusing much of the existing Hab One/Hab Two material set for PPTM and is vertically integrating software, engineering, life support, and parts of the internal build while still relying on partners for structures and some subsystems. That mix improves schedule flexibility, but it also means the module sequence only works if NASA interface assumptions, Thales structural delivery, and Houston final integration all stay aligned.
