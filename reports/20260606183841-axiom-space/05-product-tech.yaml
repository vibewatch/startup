  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Post-resequencing station integration and autonomous-operations readiness matrix
    missingEvidence: A public integrated readiness matrix for PPTM-to-Hab-One separation, autonomous free-flight, guidance/control handoff, and post-separation station operations.
    whyItMatters: The new product architecture is only investable if the free-flyer step is operationally credible; public materials explain why the sequence changed but not how the two-module station will operate immediately after separation.
    diligencePath: Request the current integrated test plan, autonomy CONOPS, and major open-item list for the resequenced station program under NDA.
    relatedQuestionRefs:
    - QE002
    - QE023
    - QE025
  - type: private-evidence-only
    severity: material
    topic: AxEMU subsystem qualification map beyond the public partner list
    missingEvidence: A subsystem-by-subsystem qualification matrix covering life support, pressure garment, avionics, tooling, communications, and remaining certification closeouts, including which items are flight-qualified versus still developmental.
    whyItMatters: Public materials show meaningful test progress but do not reveal which subsystems remain the pacing items. Without that map, investors can see motion but not the actual critical path.
    diligencePath: Request the latest qualification-status dashboard, open test anomalies, and NASA review action list for the lunar and LEO suit variants.
    relatedQuestionRefs:
    - QE012
    - QE014
    - QE015
    - QE025
  - type: missing-source
    severity: material
    topic: Orbital data center technical specificity
    missingEvidence: Public architecture, hardware, customer, and validation materials for any Axiom orbital-data-center offering comparable to the detail available for station modules or AxEMU.
    whyItMatters: The reviewed materials make the adjacency visible but not underwritable. Treating it as a real product without technical evidence would overstate today’s portfolio breadth.
    diligencePath: Ask management for a current product brief, target workloads, power/thermal assumptions, and any signed customer or pilot evidence before including the adjacency in a core underwriting case.
    relatedQuestionRefs:
    - QE019
    - QE025
  - type: private-evidence-only
    severity: material
    topic: Module corrosion corrective-action evidence
    missingEvidence: Post-mitigation inspection data, material-analysis findings, repair acceptance criteria, and any schedule reserve associated with the corrosion issue reported on Axiom module structures.
    whyItMatters: Axiom says the issue is limited and manageable, but without inspection and acceptance evidence investors cannot independently judge whether the problem is truly contained or simply not yet schedule-critical.
    diligencePath: Request corrective-action reports from Axiom/Thales, including test/inspection closeout packages and any delta to launch reserve assumptions.
    relatedQuestionRefs:
    - QE021
    - QE025
