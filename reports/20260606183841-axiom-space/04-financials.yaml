  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract-mix
    missingEvidence: Program-by-program breakdown of the >$2.2 billion customer-contract figure, including how much is xEVAS, mission services, and future station-related work.
    whyItMatters: Without the backlog mix, it is impossible to judge concentration, conversion timing, or how much of headline contracted value is near-cash versus developmental.
    diligencePath: Request customer-contract schedule by program, counterparty, milestone, and expected recognition date.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, trailing 12-month burn, debt schedule, and runway under base, bear, and bull scenarios.
    whyItMatters: This is the core capital-adequacy blocker for a long-duration hardware and fixed-price-contract company.
    diligencePath: Request monthly cash flow statements, unrestricted cash, debt covenants, and management runway model.
    relatedQuestionRefs:
    - QI015
    - QI018
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pam-unit-economics
    missingEvidence: Mission-level waterfall showing customer payment, NASA reimbursements, SpaceX transport cost, training/operations cost, and retained margin.
    whyItMatters: A public seat-price floor does not answer whether private astronaut missions are attractive on a contribution-margin basis.
    diligencePath: Request mission P&L by flight and quote history by sovereign versus private customer type.
    relatedQuestionRefs:
    - QI003
    - QI010
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
  - type: missing-source
    severity: material
    topic: station-tenancy-pricing
    missingEvidence: Signed station-customer LOIs, price sheets, occupancy model, and dated revenue ramp tied to module launch milestones.
    whyItMatters: Station revenue is central to the upside case, but public evidence only proves the platform roadmap, not commercial conversion.
    diligencePath: Request tenancy pipeline, pricing sheets, signed LOIs, and management ramp assumptions by module and year.
    relatedQuestionRefs:
    - QI002
    - QI011
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: xevas-cash-conversion
    missingEvidence: Awarded task orders, milestone acceptance status, invoiced amounts, and expected future receipts for xEVAS.
    whyItMatters: The difference between a large ceiling and cash already earned is the difference between revenue quality and development risk.
    diligencePath: Request xEVAS task-order ledger, milestone calendar, and cash-receipts history.
    relatedQuestionRefs:
    - QI012
    - QI020
    - QI023
    relatedTableRefs:
    - TI001
    - TI003
  - type: conflicting-data
    severity: material
    topic: funding-overlap
    missingEvidence: Reconciliation showing whether 4iG capital sits inside or outside the broader February 2026 $350 million total and whether any debt facilities were separate.
    whyItMatters: Double counting financing support would overstate capital adequacy at exactly the point where the company appears financing-dependent.
    diligencePath: Request financing closing memo and cap-table / debt bridge for the 2025-2026 period.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
