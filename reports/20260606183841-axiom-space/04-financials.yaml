- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current-value-status
  - quality
  - diligence-ask
  rows:
  - - Private astronaut missions
    - Turnkey mission package covering astronaut training, mission integration, launch/ISS stay coordination, research support, and return
    - Seat / mission contract
    - Public seat-price floor exists; realized revenue undisclosed
    - 'Medium: real buyer proof exists, but retained economics are opaque'
    - Request per-mission P&L, NASA reimbursements, SpaceX pass-throughs, and margin by seat cohort
  - - Sovereign astronaut missions
    - Government-sponsored missions that bundle national astronaut access with research portfolios and outreach
    - Seat / national mission package
    - Ax-4 shows India, Poland, and Hungary paying for mission access
    - 'Medium-high: government buyers are visible, but repeat cadence and pricing variance are private'
    - Request sovereign pipeline, quote ranges, renewal cadence, and payment milestones
  - - NASA xEVAS spacesuit services
    - Milestone-based service contract for lunar and ISS EVA capability
    - Task order / milestone payment
    - Large contract ceiling and guaranteed-payment disclosure exist; delivery timing slipped
    - 'Medium: government contract quality is real, but fixed-price development risk is high'
    - Request awarded task orders, remaining milestone schedule, and cash received to date
  - - Future Axiom Station tenancy
    - Research, manufacturing, habitation, and platform services on a future commercial station
    - Station tenancy / service contract
    - Platform described publicly; no public tenancy pricing found
    - 'Low: future-service logic is visible, but monetization proof is not'
    - Request signed tenancy LOIs, pricing sheets, utilization assumptions, and launch-linked revenue timing
  - - Microgravity research services
    - Mission-linked research packages, experiment hosting, and on-orbit operations support
    - Research portfolio / payload service
    - Ax-4 carried about 60 studies from 31 countries, but standalone pricing is not public
    - 'Low-medium: activity is visible, but no line-item revenue disclosure exists'
    - Request revenue by research customer, payload type, and mission
  - - Orbital data compute and data-center ambitions
    - Data processing / storage and orbital data-center cooperation concepts tied to station infrastructure
    - Strategic program / future contract
    - Strategic cooperation is public, but no public Axiom revenue contract found
    - 'Low: concept is strategically relevant but commercially unproven in public evidence'
    - Request signed contracts, minimum commitments, and capex plan for data-center workloads
  notes: Rows separate visible monetization surfaces from what public evidence cannot yet convert into recognized revenue or margin.
