- id: capital-intensity-financing
  title: Capital intensity and financing dependency
  body: The capital-intensity picture is easier to observe than the income statement. Axiom’s 2024 station update says the company revised module sequencing so the platform can free-fly as early as 2028, but that plan still requires long-cycle hardware work across Thales Alenia Space, Houston integration, launch, berthing, and later module additions. The Thales program itself goes back to a 2021 contract for the first two pressurized modules, and European Spaceflight reported that agreement at €110 million with AX-H1 pressure-vessel delivery expected in 2025 and launch in late 2026. On the funding side, Axiom’s February 2026 announcement said it raised $350 million in a mix of equity and debt to keep funding Axiom Station and AxEMU. QIA and Satellite Today independently corroborated the mixed structure, while CNBC said management planned to use the money on spacesuit capability plus modules one and two. 4iG separately disclosed a two-step $100 million investment closing by March 31, 2026.
    Public evidence therefore supports repeated external financing and major manufacturing commitments, but not current cash on hand, debt terms, or runway.
