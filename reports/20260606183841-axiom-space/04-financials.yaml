callouts:
- calloutType: insight
  title: Visible price is not visible margin
  body: The >$65 million Ax-4 seat price is useful as a willingness-to-pay signal, but public evidence still does not show Axiom’s retained take-rate after NASA charges, SpaceX transport, training, and mission support.
  claimRefs:
  - CI004
  - CI007
  - CI008
- calloutType: risk
  title: xEVAS turns contract scale into contractor risk
  body: The xEVAS program creates a large government-backed revenue opportunity, but OIG shows that fixed-price development and delayed demonstrations can push cash conversion far behind the headline contract ceiling.
  claimRefs:
  - CI012
  - CI014
  - CI016
  - CI044
- calloutType: assumption
  title: Treat station revenue as option value until price and occupancy data are public
  body: Axiom Station can be a large future revenue surface, but public sources still do not show signed public tenancy pricing, utilization commitments, or a dated ramp from hardware milestones into recurring cash receipts.
  claimRefs:
  - CI024
  - CI031
  - CI032
