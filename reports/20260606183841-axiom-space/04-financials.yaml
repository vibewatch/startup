- id: financial-verdict-gaps
  title: Underwriting verdict and public-data blockers
  body: 'The investability problem is not that Axiom lacks demand evidence; it is that public evidence is strongest at the contract, mission, and milestone layer and weakest at the conversion layer. NASA, CSIS, Payload, and SpaceNews all point to a station market still mediated by federal policy and budget support, meaning future platform revenue depends as much on NASA’s transition design as on independent customer pull. Meanwhile, the reviewed sources never disclose recognized revenue, ARR, gross margin, burn, working capital, or backlog-to-cash conversion schedules. Even the clearest visible non-NASA demand wedge—sovereign astronaut missions—only shows public top-of-funnel pricing and mission activity, not Axiom’s retained margin after transport and NASA charges. The underwriting verdict is therefore constrained but not empty: Axiom appears to have a real government and sovereign-services business plus a credible station-and-suit roadmap, yet the business remains capital-intensive and
    financing-dependent, with public evidence insufficient to underwrite revenue quality, margin path, or cash sufficiency.'
