  - diligence-ask
  rows:
  - - Visible mission-seat price floor
    - '> $65M per Ax-4 customer'
    - medium
    - Shows sovereign willingness to pay for a bundled mission product
    - Request quote history by mission, customer type, and negotiated inclusions
  - - Mission duration anchor
    - ~14 days for Ax-4
    - high
    - Helps normalize seat-price anecdotes against mission length
    - Request days on station, crew-resource consumption, and off-station training hours by mission
  - - NASA ISS reimbursement model
    - Full reimbursement above baseline; detailed pricing negotiated at award
    - high
    - Indicates NASA charges are only one layer of the mission cost stack
    - Request actual NASA reimbursable invoices for each mission
  - - Axiom retained take-rate after NASA and SpaceX
    - Not publicly disclosed
    - low
    - Without retained take-rate, seat price cannot translate into margin
    - Request revenue-share and pass-through schedule by mission
  - - xEVAS contract form
    - Firm-fixed-price, IDIQ, milestone-based service contract
    - medium
    - Determines how engineering overruns and schedule slips affect contractor economics
    - Request task-order terms, milestone acceptance criteria, and change-order mechanics
  - - Commercial market outside NASA for spacesuits
    - NASA OIG says no commercial market existed before xEVAS
    - medium
    - A contractor-owned suit platform still depends on NASA-created demand today
    - Request non-NASA pipeline, if any, for lunar or microgravity EVA services
  - - Recognized revenue by stream
    - Not publicly disclosed
    - low
    - Revenue-quality analysis needs mission, contract, and station revenue separation
    - Request monthly recognized revenue by product line
  - - Gross margin by stream
    - Not publicly disclosed
    - low
    - Margin path cannot be tested without line-level cost and pricing data
    - Request gross-margin bridge for PAM, xEVAS, and station-related programs
  - - Working-capital cycle
    - Not publicly disclosed
    - low
    - Long-cycle hardware programs can consume cash ahead of revenue recognition
    - Request inventory, payables, WIP, milestone receivables, and cash-conversion-cycle data
