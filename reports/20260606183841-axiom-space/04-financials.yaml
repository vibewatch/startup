- id: TI002
  title: Pricing / monetization table
  columns:
  - price-unit-contract
  - list-vs-realized-pricing
  - discounts-or-unknowns
  - source
  - revenue-implication
  rows:
  - - 'Ax-4 sovereign seat: > $65M per customer'
    - Public media-reported all-in seat price, not Axiom net revenue
    - Unknown split across Axiom, NASA ISS charges, SpaceX transport, training, and mission support
    - NBC/AP Ax-4 report
    - Useful willingness-to-pay floor, but not enough to infer gross profit
  - - 'NASA PAM pricing tables: representative reimbursable values'
    - Representative list framework; detailed mission pricing negotiated at award
    - Mission concept differences and negotiated terms mean realized invoices vary
    - NASA Commercial and Marketing Pricing Policy
    - Official pricing helps frame cost stack, but not realized contract economics
  - - 'xEVAS combined ceiling: $3.5B original, $3.1B current'
    - Contract ceiling, not recognized revenue
    - Task-order mix, milestone timing, and contractor overrun exposure are not public in full
    - NASA 2022 award release and 2026 OIG report
    - Shows headline scale, but timing and margin capture remain uncertain
  - - 'Axiom-claimed xEVAS guaranteed payments: about $370M'
    - Company-claimed guaranteed-payment figure, not audited revenue
    - Timing of recognition and remaining milestone risk are not disclosed
    - Axiom 2023 Series C release
    - Useful evidence of contracted cash potential, not evidence of current earnings
  - - 'Future station tenancy pricing: not publicly disclosed'
    - No public list price or standard contract found
    - Occupancy assumptions, discounts, and service bundles all unknown
    - Axiom station materials and reviewed market commentary
    - Future platform revenue cannot be underwritten from public pricing evidence
  - - 'Orbital data-center cooperation economics: not publicly disclosed'
    - Strategic partnership or framework only
    - No disclosed commercial commitments, pricing sheet, or margin structure
    - 4iG release and SpaceNews coverage
    - Strategic adjacency exists, but public monetization evidence is immature
