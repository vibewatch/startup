  rows:
  - - Disclosed cumulative funding after Series C
    - '> $505M cumulative funding after Aug. 2023 Series C'
    - '2023-08-21'
    - medium
    - Shows a meaningful prior capital base before the 2026 round
    - Request cap table and round-by-round use-of-funds bridge
  - - February 2026 financing size and form
    - $350M in a mix of equity and debt
    - '2026-02-12'
    - high
    - Confirms fresh capital but also confirms some repayment or covenant exposure
    - Request debt amount, maturity, covenants, and lien package
  - - Stated use of funds
    - Axiom Station plus AxEMU; CNBC added modules one and two specifically
    - '2026-02-12'
    - medium
    - New capital appears earmarked for long-cycle hardware rather than short-cycle working capital alone
    - Request 24-month operating plan and program budget by station, suits, and missions
  - - 4iG strategic investment
    - $100M in two tranches; second tranche closed Mar. 31, 2026
    - '2026-03-31'
    - high
    - Adds partner capital, but public overlap with the broader 2026 financing is not fully separable
    - Request schedule showing whether 4iG was inside or outside the $350M round total
  - - Station free-flight target
    - As early as 2028 after revised module sequence
    - '2024-12-18'
    - high
    - Suggests earlier platform independence, but only with continued execution funding
    - Request funding required to reach PPTM launch, separation, and first paid occupancy
  - - Supplier and module commitment
    - Thales contract reported at €110M; AX-H1 late-2026 launch expectation after 2025 delivery
    - '2024-02-01'
    - medium
    - Shows real capex-like commitments and supplier dependence
    - Request signed supplier milestones, payment schedule, and escalation clauses
  - - NASA-backed station-market support
    - C3DO support reported at $1.0B-$1.5B from FY2026-FY2031; $2.1B overall CLD projection cited
    - '2025-09-01'
    - medium
    - Station demand still depends heavily on federal program design and budgets
    - Request management view on revenue under alternate NASA funding cases
  - - Cash on hand, burn, and runway
    - Not publicly disclosed in reviewed sources
    - '2026-06-06'
    - low
    - This is the core capital-adequacy blocker
    - Request current cash, trailing 12-month burn, and base/bear/bull runway
  - - Debt ratio and covenant headroom
    - Not publicly disclosed beyond the round including debt
    - '2026-06-06'
    - low
    - Debt can tighten flexibility in a long-duration development program
    - Request debt schedule, covenants, security interests, and stress cases
  notes: Capital rows use only supportable public figures; no attempt is made to infer cash balance or runway from fundraising headlines alone.
