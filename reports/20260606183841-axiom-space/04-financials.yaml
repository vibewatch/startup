- id: TI005
  title: Public financial gaps table
  columns:
  - missing-private-metric
  - impact
  - exact-diligence-path
  - current-public-proxy
  - blocker-level
  rows:
  - - Recognized revenue by stream
    - Cannot distinguish mission cash generation from xEVAS milestones or pre-revenue station work
    - Request monthly recognized revenue split across PAMs, sovereign missions, xEVAS, and station-related programs
    - Contract values, mission counts, and financing rounds only
    - blocking
  - - Gross margin by stream
    - Cannot judge whether headline contract value translates into profitable delivery
    - Request gross-margin bridge by business line including NASA charges, SpaceX pass-throughs, training, labor, and supplier costs
    - Seat-price anecdotes and contract ceilings
    - blocking
  - - Cash balance, burn, and runway
    - Cannot test solvency, financing timing, or downside resilience
    - Request last 12 months of monthly cash flow, current unrestricted cash, and runway by scenario
    - Fresh financing announcements without operating cash disclosure
    - blocking
  - - xEVAS milestone cash schedule
    - Cannot assess near-term cash inflow versus engineering spend
    - Request awarded task orders, milestone acceptance status, invoiced amounts, and expected receipts
    - OIG ceiling and company-guaranteed-payment claims only
    - material
  - - PAM cost-sharing and revenue split
    - Cannot convert >$65M seat price into retained margin
    - Request mission-level waterfall showing Axiom retained revenue after NASA and SpaceX
    - Public seat-price floor plus NASA representative pricing policy
    - material
  - - Station tenancy pricing and occupancy commitments
    - Cannot underwrite future platform services without buyers and price points
    - Request signed LOIs, customer categories, pricing sheets, occupancy model, and launch-linked ramp
    - Platform vision and station timeline only
    - material
  - - Contract-backlog mix and conversion timing
    - Cannot tell how much of backlog is near-cash versus long-dated developmental value
    - Request contract schedule by program, counterparty, milestone, and expected recognition date
    - '> $2.2B customer-contract floor with partial xEVAS detail only'
    - material
  - - Working-capital metrics
    - Cannot measure supplier pressure or pre-revenue cash drain in hardware programs
    - Request inventory, WIP, payables aging, milestone receivables, and cash-conversion-cycle detail
    - Supplier milestones and manufacturing timelines only
    - material
