evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board roster, committee structure, and governance rights by investor.
    whyItMatters: Board composition and committee control determine oversight quality and founder/investor power balance.
    diligencePath: Request board deck index, cap table governance summary, and current board consent matrix.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled financing ledger explaining the gap between supportable disclosed funding and higher database-style
      total-funding figures.
    whyItMatters: >-
      Capital sufficiency, leverage, and dilution analysis depend on knowing whether additional debt or closed rounds
      exist.
    diligencePath: Request financing schedule by round with close dates, debt instruments, warrants, and post-money valuations.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: Current full-time employee count and post-2024 workforce trend.
    whyItMatters: Headcount is a key proxy for burn, program capacity, and whether the company has rebuilt after reported layoffs.
    diligencePath: Request HR census, org chart by function, and monthly ending headcount since 2024-01-01.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-customers
    missingEvidence: Current revenue, mission profitability, customer count, and contracted backlog by product line.
    whyItMatters: >-
      Without these metrics, investors cannot judge whether valuation and capital intensity are supported by commercial
      traction.
    diligencePath: Request monthly revenue by segment, customer roster, mission P&Ls, and booked backlog by contract.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: station-schedule
    missingEvidence: A current integrated master schedule for the first two station modules and key supplier milestone status.
    whyItMatters: Axiom’s post-ISS strategy depends on station timing; schedule slip can impair the business model.
    diligencePath: >-
      Request module manufacturing schedule, NASA interface milestones, and contingency plan if ISS transition timing
      compresses.
    relatedQuestionRefs:
      - QO015
      - QO018
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: pam-unit-economics
    missingEvidence: >-
      Public seat-level contract prices, gross margin structure, and payload pricing by mission remain undisclosed; NASA
      resource pricing is not the same as Axiom's sell price.
    whyItMatters: >-
      Without provider-level pricing and contribution margin evidence, investors cannot convert NASA's mission cadence
      ceiling into a defendable revenue or EBITDA forecast.
    diligencePath: >-
      Request executed or redacted customer contracts, seat-price schedules, mission P&Ls, and post-mission
      contribution-margin reviews for Ax-3 and Ax-4.
    relatedQuestionRefs:
      - QM015
      - QM025
  - type: private-evidence-only
    severity: blocking
    topic: post-iss-customer-base
    missingEvidence: >-
      Named non-NASA anchor customers, LOIs, utilization commitments, and renewal pathways for post-ISS station capacity
      are mostly private.
    whyItMatters: >-
      The biggest underwriting risk is not technical feasibility alone but whether enough sovereign, research, and
      commercial tenants will contract for a station after ISS retirement.
    diligencePath: >-
      Request pipeline and booked-backlog detail by customer class, including sovereign missions, pharma/materials
      users, and any post-2030 NASA or partner MOUs.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: sovereign-repeat-demand
    missingEvidence: >-
      Public follow-on manifests, budgets, or memoranda showing that India, Poland, Hungary, or other countries intend
      repeat purchases after Ax-4 are still limited.
    whyItMatters: >-
      Sovereign astronaut demand is one of the clearest non-NASA revenue wedges today, but one completed mission does
      not yet prove a durable annual market.
    diligencePath: >-
      Request sovereign pipeline by country, proposal status, training agreements, and forward budget support tied to
      repeat missions or station-tenancy purchases.
    relatedQuestionRefs:
      - QM004
      - QM012
      - QM025
  - type: conflicting-data
    severity: material
    topic: microgravity-manufacturing-proof
    missingEvidence: >-
      Open-source materials show a larger project pipeline but still do not show repeat production revenue, conversion
      rates from pilots to production, or customer retention.
    whyItMatters: >-
      Microgravity manufacturing is central to long-run station demand narratives; if it remains grant-driven or
      technically fragile, the most important non-tourism upside case weakens materially.
    diligencePath: >-
      Obtain customer-level purchase orders, returned-product qualification results, repeat-flight schedules, and
      cost-per-kg economics for the leading materials and biotech tenants.
    relatedQuestionRefs:
      - QM018
      - QM019
      - QM025
  - type: private-evidence-only
    severity: material
    topic: starlab-demand
    missingEvidence: >-
      Signed customer names, payload contracts, and commercial revenue terms behind the reported 130% Starlab demand
      figure.
    whyItMatters: Demand quality determines whether Starlab is a real underwriting threat or only a strong marketing narrative.
    diligencePath: Request booked customer list, contract value ranges, and cancellation terms from Voyager/Starlab management.
    relatedQuestionRefs:
      - QP008
      - QP025
  - type: conflicting-data
    severity: material
    topic: haven1-schedule
    missingEvidence: >-
