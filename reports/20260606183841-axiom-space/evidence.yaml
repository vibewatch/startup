    whyItMatters: >-
      Without comparable pricing, it is hard to tell whether Axiom’s published price visibility is a strength or just a
      disclosure artifact.
    diligencePath: >-
      Collect customer proposals, term sheets, or signed pricing ranges directly from each provider and map them into
