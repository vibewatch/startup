tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk / issue
  - Jurisdiction / surface
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - xEVAS sole-provider and contract-structure risk
    - NASA procurement / Artemis / ISS
    - OIG says Collins withdrawal left Axiom as sole active provider under a developmental, fixed-price services structure
    - High
    - Critical
    - NASA reviews, milestone verification, optional future-provider mechanism
    - High — one provider now carries schedule and performance risk for both lunar and ISS suits
    - Request current NASA risk register, milestone burn-down, and any contingency path if Axiom misses another major review
  - - Export-control and proprietary-technology exposure
    - ITAR / EAR / international collaboration
    - Axiom terms expressly reference ITAR/EAR; Prada collaboration highlights controlled and proprietary technology sensitivity
    - Medium
    - High
    - Public legal terms, partner selection, controlled design disclosure
    - Medium-High — public language confirms exposure but not operating procedures
    - Request export-control program summary, technology-control plan, and partner-country approval workflows
  - - Privacy, cyber, and policy-enforcement exposure
    - Website, recruiting, community, support, data handling
    - Privacy notice allows cross-border transfer and says systems cannot be guaranteed fully secure; AUP permits suspension and action on government notice
    - Medium
    - Moderate
    - Updated legal terms, privacy notice, SOC-style internal controls not publicly disclosed
    - Medium — surface area is visible, but operating evidence is private
    - Obtain security attestations, incident history, subprocessor list, and internal control ownership map
  - - Litigation, claims, insurance, and remedy opacity
    - Counterparty contracts / mission operations / supplier disputes
    - No public claims schedule was surfaced in retained evidence even though policies and supplier-stress reporting imply legal tail risk exists
    - Medium
    - High
    - Compliance hotline and legal terms are visible, but dispute inventory is not
    - High — inability to see claims, insurance limits, or cure rights constrains downside analysis
    - Request litigation schedule, insured limits, indemnity stack, and all active notices of breach or reservation of rights
  notes: Rows rank supportable legal and regulatory exposures from public oversight, contractual terms, and policy disclosures; private litigation and insurance schedules remain undisclosed.
  enumerationScope:
    coverage: partial
    basis: Covers the highest-severity public legal and regulatory surfaces identifiable from retained oversight reports, Axiom legal pages, and partner disclosures as of 2026-06-06; private claims files and contract schedules were not available.
