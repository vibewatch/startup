  evidenceGaps:
  - type: missing-source
    severity: material
    topic: station-critical-path
    missingEvidence: A current integrated Axiom Station critical-path schedule, earned-value view, and milestone slippage log for first-module delivery and follow-on module sequencing.
    whyItMatters: Without a current critical path, investors cannot measure how much schedule buffer exists relative to ISS retirement or how much contingency remains after prior slippage.
    diligencePath: Request the latest integrated master schedule, milestone-burn chart, and customer-facing change log covering Hab One, power, docking, and free-flyer separation milestones.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: litigation-and-insurance-disclosure
    missingEvidence: A litigation, claims, arbitration, indemnity, and insurance schedule covering Axiom, AxEMU, station development, SpaceX launches, and major suppliers.
    whyItMatters: Legal exposure appears supportable through public terms and regulatory oversight, but active claims, insured limits, and contractual remedies are not public enough to score tail risk precisely.
    diligencePath: Request counsel-prepared litigation and claims schedule, insurance certificates and limits, and any notices of breach, cure, or reservation of rights from major counterparties.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: The debt tranche size, covenants, maturity profile, security package, and step-up economics embedded in the February 2026 financing.
    whyItMatters: A capital-intensive company can look funded on headline dollars while still facing near-term refinancing risk if debt terms are restrictive or maturities cluster before key milestones.
    diligencePath: Obtain the financing term sheet, debt agreement summary, cap-table update, and management bridge from February 2026 cash sources to next major technical milestones.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: supplier-arrears-and-remedies
    missingEvidence: Current payable aging, amended payment plans, and remedy clauses with SpaceX, Thales, and any other mission-critical suppliers.
    whyItMatters: Historical payment stress is publicly reported, but investors need to know whether cure periods, milestones, or cash sweeps could still disrupt launches or module delivery.
    diligencePath: Request supplier aging, amended payment schedules, notices of breach or cure, and management’s monthly liquidity waterfall that covers supplier obligations.
    relatedQuestionRefs:
    - QR030
