- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - AxEMU schedule risk
    - NASA-led review outcomes
    - Any publicly disclosed deferral after current technical-review stage or major redesign reopening
    - Pause underwriting until management shows a revised path that still protects ISS and Artemis timelines
  - - Station schedule risk
    - Integrated milestone movement
    - Another module-sequence change or slip that compresses time before ISS retirement without a funded workaround
    - Re-cut base case around a later station revenue ramp and heavier external-financing needs
  - - NASA policy dependence
    - CLD phase-two and phase-three timing
    - Funding delay, strategy reversal, or material reduction in scope for commercial-station support
    - Assume slower demand formation and higher residual dependency on government missions
  - - Supplier / counterparty stress
    - Payment-plan, breach, or cure notices
    - New arrears, cure letters, or public disputes with SpaceX, Thales, or other mission-critical suppliers
    - Treat as immediate liquidity and delivery risk, not background vendor friction
  - - Financing risk
    - Capital-market access
    - Need for another large raise before major technical milestones without clearer unit economics or contract visibility
    - Assume tougher terms, dilution, and lower strategic flexibility
  - - Legal / regulatory tail risk
    - Claims, breach notices, or compliance incidents
    - Any disclosed export-control issue, significant privacy incident, safety incident, or previously hidden litigation
    - Escalate to counsel-led diligence and reset downside case around operational distraction and reputation damage
  notes: Kill criteria translate the chapter’s evidence into monitorable events; thresholds focus on changes that would reprice residual risk quickly rather than gradual underperformance alone.
