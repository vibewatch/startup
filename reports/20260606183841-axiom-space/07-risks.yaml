- id: mitigations-monitors-and-thesis-breakers
  title: Mitigations, monitors, and thesis-break triggers
  body: 'Axiom is not unmitigated. NASA’s February 2026 milestone update, Axiom’s redundancy and testing claims, the public compliance hotline, and the new financing round all show that management is still moving programs forward and understands where scrutiny will come from. But the public mitigation set is still process-heavy rather than outcome-heavy. Investors can see reviews, policies, and partner endorsements; they still cannot see debt covenants, supplier cure plans, current critical-path schedules, or a litigation-and-insurance schedule. The right monitoring framework is therefore explicit. A further AxEMU milestone miss would threaten NASA confidence and extend EMU reliance. Another shift in NASA’s commercial-LEO strategy or underfunding of follow-on phases would directly pressure the station business case because NASA remains the anchor market. Renewed arrears or breach notices with SpaceX or Thales would indicate that liquidity is again outrunning execution. Those are not background
    risks: together they define the conditions under which the Axiom thesis stops looking like patient execution risk and starts looking like a structurally undercapitalized transition story.'
