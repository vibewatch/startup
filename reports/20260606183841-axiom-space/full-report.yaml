      - number: '5.4'
        title: Microgravity services, manufacturing model, and visible dependency edges
        blocks:
          - type: paragraph
            body: >-
              Axiom’s current product catalog mixes delivered services with still-developing hardware. The delivered
              part is clearest in microgravity access. Axiom’s research page is explicit that scientists, engineers, and
              product innovators can use its mission experts to bring products or experiments to orbit today, and Ax-4
              provides direct evidence that this offering is not aspirational — it executed research and technology
              demonstrations on the ISS in 2025. The distinction matters because it keeps underwriting grounded: Axiom
              is already an operator and orchestrator of mission-based research access, but it is not yet an operator of
              an independent research station.


              The manufacturing model is similarly hybrid. Payload says Axiom wants vertical integration where it most
              affects schedule and product control — software, engineering, life support, and internal structures — but
              still outsources structural work and some subsystem scope to partners. That looks rational for a
              capital-intensive station build, yet it creates visible dependency edges. Thales remains the decisive
              outside manufacturing partner for pressurized module structures; SpaceX remains embedded through Dragon
              operations, launch-provider training, and the future ISS deorbit coexistence problem; NASA remains
              embedded as both present destination owner and future certification gatekeeper.


              Public practitioner signal also supports the idea that Axiom is still staffing real technical execution
              rather than just program-management theater. Its careers page continues to pitch engineering-heavy
              infrastructure work, and Built In’s job rollup highlights flight-software, GNC simulation, payload
              management, systems engineering, and EVA-adjacent operations roles. That is not proof of execution
              quality, but it is a legitimate proxy that the company still needs deep technical labor across mission
              operations, hardware, and software. By contrast, one adjacent product line remains underdocumented:
              orbital data centers appear in Axiom’s solutions surface, but the reviewed materials do not expose
              architecture, hardware, customers, or validation evidence at the same level as missions, station modules,
              or AxEMU. It should therefore be treated as an adjacency, not a core underwritten product at this stage.
