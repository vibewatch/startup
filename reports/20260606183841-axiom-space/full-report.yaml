              the public compliance hotline, and the new financing round all show that management is still moving
              programs forward and understands where scrutiny will come from. But the public mitigation set is still
              process-heavy rather than outcome-heavy. Investors can see reviews, policies, and partner endorsements;
              they still cannot see debt covenants, supplier cure plans, current critical-path schedules, or a
              litigation-and-insurance schedule. The right monitoring framework is therefore explicit. A further AxEMU
