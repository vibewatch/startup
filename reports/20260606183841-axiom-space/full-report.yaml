      - number: '3.2'
        title: Direct peers differ on capability depth and commercialization maturity
        blocks:
          - type: paragraph
            body: >-
              The direct-station peers are not interchangeable. Starlab markets the deepest research-campus proposition:
              a single-launch station with three docking ports, a Bishop airlock, payload platforms, astronaut services,
              and an explicit science-park model tied to Airbus, MDA, Saber, Vivace, and other partners. Orbital Reef,
              as described by Sierra Space and NASA, is still framed as a mixed-use business park for commerce,
              research, and tourism, but public evidence is lighter on customer proof and heavier on design-milestone
              language. Vast’s Haven-1 is narrower but more concrete: a four-person, two-week platform with visible
              hardware progress, SpaceX-linked systems, and a NASA-selected private mission in 2027 that can seed
              customer relationships before Haven-2. Voyager’s 2028 ISS PAM adds another infrastructure player without
              yet requiring Starlab itself to be operational. Axiom therefore no longer competes only against future
              habitat concepts; it competes against a ladder of alternatives ranging from single-module stations and
              future science parks to PAM providers that can accumulate training, integration, and sovereign-sales
              experience before their own stations are online.
