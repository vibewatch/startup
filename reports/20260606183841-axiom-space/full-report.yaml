      - number: '5.3'
        title: AxEMU architecture, test progress, and supplier stack
        blocks:
          - type: paragraph
            body: >-
              AxEMU is Axiom’s second major product line and the most detailed public technical surface the company
              offers outside station materials. NASA’s and Axiom’s descriptions align on the core architecture: the suit
              builds on NASA’s xEMU development base, adds broader sizing and adjustability, improves mobility for tasks
              such as bending and collecting geology samples, and uses updated life-support, pressure-garment, and
              avionics elements. Axiom further says the suit architecture is built around redundancy to mitigate
              single-point failures and is designed to serve both lunar and microgravity EVA missions with limited
              environmental changes. That does not amount to a full subsystem bill of materials, but it is specific
              enough to understand the design intent: Axiom is not inventing a suit from a blank sheet; it is
              commercializing and productizing NASA heritage while tailoring the package for service delivery.


              The public test record is meaningful. NASA reported more than 850 hours of pressurized testing with a
              person inside the suit by February 2026, completion of a contractor-led technical review, first-series
              runs in the Neutral Buoyancy Laboratory, and follow-on reduced-gravity evaluation in the Active Response
              Gravity Offload System. Axiom’s own year-in-review adds first dual-suit NBL work, an uncrewed
              thermal-vacuum test of the pressure garment assembly, more than 800 hours of crewed pressurized time, and
              more than 1,200 review products. Flying independently corroborated early crew testing in the NBL. These
              are not final certification milestones, but they are far beyond concept-art status.


              The supplier map also has real substance. Prada is publicly tied to the outer-layer materials and design
              presentation, while CollectSPACE reports Oakley is providing the deployable two-part visor system and that
              Nokia is supplying high-speed communications for HD video, telemetry, and voice. NASA’s own provider page
              makes the control boundary clear: Axiom owns design, development, qualification, certification,
              production, and support equipment, while NASA retains training, mission-planning, and approval authority.
              That split creates trust and technical discipline, but it also means the program cannot be judged purely
              on Axiom’s internal schedule; it must satisfy NASA gatekeeping at each major review and test step.
