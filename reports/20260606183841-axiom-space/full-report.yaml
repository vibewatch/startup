  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Axiom leads the bridge market, but the field is no longer exclusive
        blocks:
          - type: paragraph
            body: >-
              Axiom now competes in two overlapping arenas rather than one. The first is the near-term private astronaut
              mission bridge from today’s ISS to tomorrow’s commercial stations. In that bridge market, Axiom is the
              incumbent: public sources show it has already flown four chartered ISS missions, won a fifth NASA order
              for early 2027, and converted sovereign crews from India, Poland, and Hungary into visible customer proof.
              The second arena is the post-ISS station platform race, where Axiom must compete with Starlab, Orbital
              Reef, and Vast on habitat capability, partner depth, and readiness to host research and sovereign missions
              after the ISS retires. NASA’s 2026 selection of Vast for the sixth PAM and Voyager for a seventh mission
              matters because it breaks any assumption that Axiom will remain the sole broker of ISS-linked commercial
              human spaceflight. Once buyers can compare Axiom against other ISS-capable brokers and future stations
              simultaneously, the practical landscape expands beyond one startup-versus-government frame into a
              portfolio of direct peers, substitutes, and internal-build paths.
            claimRefs:
