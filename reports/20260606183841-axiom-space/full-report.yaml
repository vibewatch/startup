      - number: '6.2'
        title: 'Sovereign astronaut customers: real missions, not just logos'
        blocks:
          - type: paragraph
            body: >-
              Axiom’s strongest non-NASA customer proof comes from sovereign astronaut missions that actually flew.
              Saudi Arabia used Ax-2 to send Rayyanah Barnawi and Ali Alqarni through an arrangement with Axiom that
              NASA itself described, making Saudi participation a genuine government mission rather than a promotional
              partnership only. Türkiye used Ax-3 to fly Alper Gezeravcı as its first astronaut and tied the mission to
              a 13-experiment national science program. Ax-4 then expanded the sovereign-customer set further: India,
              Poland, and Hungary each returned to government-sponsored human spaceflight after more than 40 years, with
              India flying mission pilot Shubhanshu Shukla and Poland and Hungary using the mission for national
              research portfolios.


              The important nuance is repeatability. These sovereign programs prove that governments will buy or use
              Axiom’s mission stack for national prestige, science, and astronaut-training goals. But the public
              evidence still looks episodic rather than subscription-like. Each sovereign win is a discrete mission with
              a particular astronaut and experiment manifest, not a disclosed multiyear seat-allotment agreement or
              recurring station-usage contract. The right underwriting conclusion is therefore mixed: sovereign
              astronaut business is real, revenue-bearing in principle, and globally relevant, but public retention
              evidence is far weaker than the mission logos might imply.
