            body: >-
              The financing story is supportive but not clean. Axiom undeniably proved access to capital again in
              February 2026, and the round explicitly included both equity and debt, but the retained record still shows
              a company whose programs consume large amounts of cash before long-duration station revenue is proven.
              Forbes’ 2024 reporting is the central adverse signal: cash crunch, layoffs, payroll pressure, reported
              payment strain with SpaceX and Thales, and money-losing private missions. That history matters because it
              raises the risk that any new delay reopens liquidity questions rather than remaining a purely technical
              miss. Governance is not broken in the public record, but it is still founder- and transition-heavy. The
              company changed CEOs in October 2025 and keeps public compliance channels, yet outside investors still
              lack public visibility into board process, debt terms, supplier remedies, and litigation schedules. Legal
              exposure is therefore real even without a headline case: Axiom’s own terms flag ITAR and EAR compliance,
              its privacy policy acknowledges cross-border transfers and imperfect cyber security, and its
