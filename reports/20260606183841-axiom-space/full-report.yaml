      - number: '1.3'
        title: Funding History, Valuation Signals, and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Axiom’s capital story is a mix of confirmed milestones and unresolved opacity. The official August 2023
              Series C release disclosed a $350 million raise, lifting total funds raised to over $505 million and
              highlighting more than $2.2 billion of customer contracts. Sacra and Bloomberg-sourced March 2025
              reporting then described a fresh financing of at least $100 million at roughly a $2 billion pre-money
              valuation. On 2026-02-12, Axiom announced another $350 million financing, with QIA and Type One Ventures
              co-leading and 1789 Capital, 4iG, and LuminArx also participating; Axiom and QIA both said the round
              included equity and debt. CNBC added that PitchBook placed Axiom’s value above $2.5 billion, though the
              company itself did not disclose valuation for the round. Using only the disclosed cumulative figure from
              August 2023 plus the later reported/announced rounds yields a supportable lower bound of at least $955
              million in cumulative financing by February 2026. That is substantial, but still below some database-style
              total-funding figures, which cannot be independently reconciled from the fetched pre-run-date primary
              materials. The investor and stakeholder base is strategically meaningful because NASA, SpaceX, Thales
              Alenia Space, and sovereign-linked investors each affect execution in different ways.
