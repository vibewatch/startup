        - Core wedge because it is already commercialized and teaches the operating model for station services
      - - Sovereign astronaut missions
        - >-
          Government-sponsored crew seats, national research portfolios, outreach rights, and astronaut-program
          acceleration
        - Generic prestige spending with no mission services or station time attached
        - National space agencies, ministries, or state-backed programs
        - Core wedge because Ax-4 shows governments will buy mission access before private stations are fully online
      - - Microgravity research / manufacturing access
        - >-
          Lab time, payload hosting, process development, returned materials, and repeat flight access for pharma,
          biotech, optics, materials, and semiconductors
        - Pure Earth-based R&D grants or generic “space economy” investment that never buys orbital services
        - NASA, ISS National Lab, universities, startups, and industrial R&D buyers
        - Core wedge because it is the strongest non-tourism rationale for recurring station tenancy
      - - Commercial station infrastructure and tenancy
