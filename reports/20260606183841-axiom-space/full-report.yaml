  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-ready scores show that Axiom clears the strategic-importance bar more easily than the transparency or
      valuation-discipline bar.
    data:
      items:
        - label: Financing access
          value: 7 / 10
          status: verified
          note: 2026 raise, QIA support, and 4iG closing show live capital access.
        - label: Contract visibility
          value: 6 / 10
          status: verified
          note: Headline contracts and xEVAS are real, but conversion into cash is not public.
        - label: Technical progress
          value: 6 / 10
          status: in-progress
          note: AxEMU and station milestones exist, but neither schedule is fully de-risked.
        - label: Revenue transparency
          value: 2 / 10
          status: gap
          note: Public revenue, margin, burn, and runway remain undisclosed.
        - label: Market independence
          value: 3 / 10
          status: gap
          note: CSIS and Payload still frame demand as NASA-shaped rather than self-sustaining.
        - label: Cap-structure clarity
          value: 2 / 10
          status: gap
          note: Mixed equity and debt plus unknown preferences and covenants keep the stack opaque.
        - label: Valuation discipline
          value: 4 / 10
          status: in-progress
          note: The 2025 reset and 2026 rebound are visible, but the economics beneath them are not.
        - label: Recommendation
          value: Research-more
          status: verified
          note: At current public evidence quality, diligence—not price-taking—is the investable action.
    approximationNotes: >-
      Scores are analyst-assigned and reflect evidence quality and underwriting readiness, not absolute company quality
      or technical ambition.
