  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market before sizing it
        blocks:
          - type: paragraph
            body: >-
              Axiom's relevant market is commercial LEO infrastructure and services, not the undifferentiated “space
              economy.” The included spend is the combination of: private astronaut missions sold through U.S. brokers
              to the ISS and, later, commercial stations; sovereign astronaut missions where national agencies buy
              access, training, payload integration, and prestige; microgravity research and manufacturing access sold
              to science, pharma, materials, and semiconductor users; the station infrastructure and tenancy services
              that NASA and other institutional customers will purchase after ISS retirement; and an adjacent lunar/ISS
              EVA-services wedge because Axiom is using one suit architecture across lunar and orbital applications. The
              excluded spend is just as important: suborbital leisure tourism, generic space-logistics and SSA revenue,
              defense-heavy orbital infrastructure, and broad “space tourism” categories that bundle space hotels,
              balloons, and luxury travel. NASA's own transition language matters here because it says the agency wants
              to be one of many customers in a commercial marketplace, which means Axiom needs diverse customers but
              also that the addressable market should be defined by who will actually buy recurring LEO services.
