      - number: '5.2'
        title: 'What Axiom actually delivers today: private astronaut missions and managed microgravity access'
        blocks:
          - type: paragraph
            body: >-
              Axiom’s most mature product is not the future station; it is the current mission-services workflow that
              already moves sovereign and private customers through NASA’s ISS system. NASA and Axiom both say Ax-5 is
              the company’s fifth consecutive private astronaut mission award, targeted no earlier than January 2027 and
              expected to stay docked to the ISS for up to 14 days. NASA’s release makes the service boundary unusually
              clear: Axiom proposes crew members, NASA and international partners review them, and once approved those
              crew members train with NASA, the partners, and the launch provider. That is the core customer workflow
              Axiom sells today — mission packaging, review navigation, training orchestration, and on-orbit execution.


              Ax-4 shows the operating model in concrete terms. Axiom’s mission page describes the delivered sequence as
              SpaceX Dragon launch, ISS docking, roughly two weeks of microgravity research, technology demonstrations,
              and outreach, then splashdown return. NASA’s broader PAM framework explains why that matters
              strategically: private astronaut missions are part of NASA’s transition plan from an agency-owned
              destination toward a competitive commercial LEO economy. In other words, Axiom is monetizing the bridge
              period before Axiom Station exists.


              The operations architecture is also more real than marketing decks suggest. Axiom’s MCC-A is not a
              symbolic room; the company says it has maintained a live operational link with NASA Johnson since Ax-1 and
              remains integral to astronaut-mission execution. NASA’s mission-management podcast adds practitioner
              detail: Axiom runs its own objectives and control room while coordinating with NASA’s 24/7 ISS control and
              the separate SpaceX training flow needed to operate Dragon safely. NASA Spinoff fills in the
              human-capability side, showing that Axiom’s private customers often start with little or no
              mission-specific training and rely on instructors and operators with NASA mission-control and
              astronaut-training backgrounds. That combination — customer handling, training mediation, mission control,
              and ISS research execution — is the clearest answer to what Axiom delivers right now.
