  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: NASA as anchor customer and the boundary of what Axiom sells today
        blocks:
          - type: paragraph
            body: >-
              NASA is the clearest present-day customer and counterparty in Axiom’s customer stack. The public record is
              unusually specific: NASA has already awarded five consecutive private astronaut missions to Axiom, with
              Ax-5 targeted no earlier than January 2027, and NASA’s own release says the relationship runs both
              directions. Axiom purchases mission services from NASA such as crew consumables, cargo delivery, storage,
              and daily-use ISS resources; NASA in turn buys cold-stow sample return from Axiom. That makes NASA more
              than a launch-permit giver. It is the anchor buyer, the owner of the current destination, the
              crew-approval gatekeeper with international partners, and a commercial trading counterparty inside each
              mission.


              That distinction matters because it keeps the chapter grounded in present usage rather than station
              marketing. What Axiom demonstrably sells today is managed ISS access: crew packaging, mission integration,
              mission-control support, and microgravity research execution on short-duration station stays. NASA’s PAM
