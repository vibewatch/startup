    title: Comparable valuation table
    columns:
      - Comparable
      - Evidence
      - Why it matters
      - Limitation
      - Status
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public space comps for pricing Axiom as of 2026-06-06 rather than every
