      - number: '2.2'
        title: Sizing lenses diverge because the boundaries diverge
        blocks:
          - type: paragraph
            body: >-
              There is no single clean public TAM for what Axiom is selling, so the right answer is to preserve multiple
              lenses rather than fake precision. The narrowest official lens is NASA policy: the agency now funds CLD
              development with a finite budget, expects at least two providers, and only requires a four-person,
              one-month non-NASA demonstration as the minimum threshold. The ISS-era mission wedge is also capped. NASA
              still enables up to two PAMs a year and Ax-4 shows a four-person manifest, so today's PAM throughput
              ceiling is only about eight seats per year unless NASA or successor stations expand cadence. The middle
              lens is research/manufacturing tenancy: NASA and ISS National Lab have already committed more than $60
              million across twenty-plus InSPA awards and continue to solicit near-term economic-impact projects, while
              open-source surveys count 303 in-space-manufacturing entities. But those same surveys say recurring
              profitable production still is not proven. The broadest lens is the least useful for underwriting:
              tourism-oriented reports project multi-billion-dollar markets by the early 2030s because they bundle
              suborbital trips, orbital tourism, private astronaut missions, and station stays. Those are not wrong as
              broad comparables, but they materially overstate Axiom's actual near-term serviceable market.
