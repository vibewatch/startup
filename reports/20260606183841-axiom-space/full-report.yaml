  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing signals
        blocks:
          - type: paragraph
            body: >-
              Axiom’s actual near-term revenue model is narrower than generic space-economy rhetoric. The most
              supportable monetized products are private astronaut missions sold as turnkey bundled packages, NASA xEVAS
              spacesuit services paid through milestone task orders, and future station services that remain pre-revenue
              from a public-disclosure standpoint. The clearest public seat-price datapoint is the Associated Press
              report that Ax-4 customers paid more than $65 million per seat for a roughly two-week mission. NASA’s own
              pricing policy explains why that figure cannot be translated directly into Axiom net revenue: NASA treats
              its ISS resources as reimbursable above baseline capability, says the published pricing is only
              representative, and says detailed pricing is negotiated at mission award because mission concepts differ.
              Axiom mission materials and NASA advisory pages also show that missions bundle research portfolios,
              astronaut training, outreach, and ISS operations for sovereign customers, but none of the reviewed public
              sources disclose how much of a seat contract Axiom retains after NASA charges, SpaceX transportation,
              training, and mission management. Public evidence therefore supports a real mission-services business, but
              not a clean realized ASP or gross-profit curve.
