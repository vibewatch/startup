      - number: '6.5'
        title: Concentration risk and the gap between mission demand and future station tenancy
        blocks:
          - type: paragraph
            body: >-
              Current customer concentration is high. NASA is not merely one of many customers; it is the dominant
              demand anchor, the owner of the present destination, and the institution shaping mission cadence and crew
              approval. Sovereign programs and research manifests diversify the story, but they still run through the
              ISS and NASA-mediated mission model. This is why the best public evidence today supports short-duration
              access sales, not a broad, self-sustaining commercial station tenant base. NASA’s own commercial-stations
              strategy says the agency wants to become one customer among many in the future, while PAMs are intended to
              help companies build capabilities and partnerships ahead of that transition.


              The problem is that independent market evidence remains cautious. The Center for Space Policy and Strategy
              says a stable commercial-station customer base is highly speculative without continued government
              interest. NASASpaceFlight notes concern that the market may not support all proposed stations. SpaceNews
              reports that NASA’s current phase-two framework only requires a four-person, one-month demonstration
              mission and defers service certification and purchases to a later phase. Put plainly, Axiom has strong
              proof that customers will buy missions today, moderate proof that those missions can seed future users,
              and weak public proof that long-duration station tenancy demand is already contracted or durable.
