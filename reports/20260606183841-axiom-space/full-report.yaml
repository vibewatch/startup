      - number: '1.4'
        title: Milestones, Product Progress, and Adverse Record
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows meaningful operational progress but also clear schedule and execution risk.
              Axiom completed Ax-1 in 2022 as the first all-private ISS mission, followed with Ax-2 and Ax-3, and used
              Ax-4 in 2025 to return India, Poland, and Hungary to government-sponsored human spaceflight while
              expanding its research portfolio. NASA selected the company for a fifth private mission targeted no
              earlier than January 2027, showing continuing institutional demand. On the product side, Axiom Station’s
              first module remained under construction as of the run date, and both Axiom and NASA continued to describe
              the station as the intended successor path to post-ISS commercial operations. NASA’s spacesuit materials
              show the AxEMU program advancing through technical review and testing, but the April 2026 NASA OIG audit
              is a major adverse signal: it said the original 2025 and 2026 demonstration schedules proved unachievable,
              that delays of at least a year and a half had already occurred, and that further slippage could push
              demonstrations to 2031. Separate 2024 press investigations described cash pressure, layoffs,
              supplier-payment strain, and a slower-than-planned station build. The core diligence conclusion is
              therefore mixed: Axiom has real mission execution and institutional credibility, but investors still need
              sharper evidence on schedule control, economics, and transparency.
