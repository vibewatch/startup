      - number: '1.2'
        title: Founders, Leadership Changes, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The leadership record is unusually important because Axiom is pursuing several capital-intensive programs
              at once. Official team materials identify Kam Ghaffarian as co-founder and executive chairman, Michael
              Suffredini as co-founder and first CEO through 2024, and Jonathan Cirtain as the current CEO and
              president. Axiom’s October 2025 announcement also thanked prior CEO Tejpaul Bhatia for steering the
              company through a transition period, showing that the company cycled through multiple CEO arrangements
              between 2024 and 2025. Independent adverse coverage from September 2024 reported that Suffredini stepped
              down for personal reasons in August 2024 and that Ghaffarian became interim CEO before a permanent
              successor was chosen. Public leadership materials show depth in astronaut operations, station operations,
              legal, policy, science, and finance, but the board itself is not publicly enumerated in the fetched
              official materials. That leaves a governance gap: investors can see executive faces and founder pedigrees,
              but not a clean public record of board composition, committee oversight, or current ownership/control
              rights. Given the size of the financing rounds and the concentration of founder influence, key-person and
              governance transparency remain central diligence topics.
