  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - 2025 and 2026 term sheets
        - Share price, liquidation preferences, anti-dilution, board rights, and any secondary marks.
        - Defines whether the headline mark maps to investable common-equity value.
        - Lead-investor diligence request to company counsel and board materials.
      - - Debt schedule and covenants
        - Debt amount, maturity, coupon or PIK terms, collateral, and covenant tests.
        - Determines whether the 2026 raise strengthened or constrained the equity story.
        - Obtain credit agreement and downside covenant model from finance team.
      - - Backlog-to-cash conversion
        - Milestone acceptance, invoiced amounts, recognized revenue, and gross margin by program.
        - Separates impressive contract headlines from actual value creation.
        - Finance diligence plus contract-level revenue-recognition walk-through.
      - - Mission unit economics
        - Retained revenue after NASA charges, SpaceX transport, training, and mission support costs.
        - Tests whether sovereign seat pricing is strategically relevant but economically weak, or genuinely attractive.
        - Request mission-level P&L and quote history by mission and customer.
      - - Non-NASA demand proof
        - Signed station LOIs, occupancy assumptions, repeat sovereign pipeline, and any non-NASA service commitments.
        - Determines whether Axiom can grow beyond a NASA-shaped market.
        - Commercial diligence with signed customer documents and reference calls.
      - - Funding chronology reconciliation
        - Exact treatment of 4iG inside or outside the broader 2026 financing headline.
        - Sharpens cumulative funding, dilution history, and confidence in the reset-and-rebound narrative.
        - Reconcile filing chronology against management financing schedule and closing binders.
    notes: >-
      These are the minimum diligence asks needed to move the chapter from scenario framing toward an actual price-aware
      underwriting recommendation.
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV044
      - CV045
      - CV046
