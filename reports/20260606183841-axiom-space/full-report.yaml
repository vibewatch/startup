  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk thesis
        blocks:
          - type: paragraph
            body: >-
              Axiom’s risk profile is dominated by synchronized execution rather than a single isolated issue. The
              highest-ranked risk is that Axiom must deliver Axiom Station hardware and AxEMU spacesuits on schedules
              that matter to NASA at the same time that it continues flying ISS missions and raising capital. The April
              2026 NASA OIG audit moved that concern from generic startup risk to documented program risk by saying the
              original suit demonstration schedules were unachievable, that Collins’ withdrawal left NASA reliant on
              Axiom as a single xEVAS provider, and that historical-average slippage could push demonstrations to 2031.
              The second-ranked risk is dependence on NASA as customer, policy setter, and future certifier, because the
              commercial-station market still looks government-led rather than self-sustaining. Third come supplier and
              partner dependencies on SpaceX and Thales. Fourth is refinancing and vendor-payment risk. Fifth is legal,
              export-control, privacy, and safety exposure that is visible in public policies and oversight reports but
              not yet fully de-risked by public disclosures.
