      - number: '5.5'
        title: Trust controls, roadmap maturity, and the technical risks that still matter
        blocks:
          - type: paragraph
            body: >-
              The strongest positive on Axiom’s product stack is that major trust controls are visible in public.
              Station hardware moved through NASA-linked design reviews before manufacturing advanced. Private astronaut
              missions require NASA and international-partner crew review plus NASA and SpaceX training interfaces.
              AxEMU has formal NASA-defined technical and safety standards, a contractor-led review, a NASA-led critical
              design sync review still ahead, and ongoing test campaigns in buoyancy and reduced-gravity facilities.
              Those are material control points, not brand slogans.


              The strongest negative is that schedule and quality risk are also visible in public. NASA OIG says the
              original schedule to demonstrate lunar suits by 2025 and ISS suits by 2026 was overly optimistic and
              unachievable, and warned that if delays track historical norms, demonstrations could slip to 2031. GAO
              separately showed that NASA already moved Artemis III to September 2026 to absorb remaining contractor
              work. Even if Axiom’s latest public testing record is directionally positive, oversight sources make clear
              that the suit is not yet a low-risk, nearly closed program.


              Station risk is more manufacturing- and dependency-centric. SpaceNews reported corrosion on Thales-built
              structures that also touched Axiom module hardware, with Axiom saying the observed spots were limited,
              removed, and mitigated without changing the target 2028 launch path for module 1. That may prove
              manageable, but the episode is a reminder that Axiom’s schedule depends on partner manufacturing quality
              as well as its own Houston integration work. The broader underwriting conclusion is therefore balanced:
              Axiom has enough real product, process, and test evidence to take seriously as a builder-operator, but its
              most important future products still sit inside a narrow corridor defined by NASA oversight, SpaceX
              interfaces, supplier quality, and schedule execution.
