            body: >-
              Axiom’s business still sits inside a NASA-shaped market. NASA’s own commercial-stations and
              private-astronaut-missions pages show that the agency is simultaneously the current destination
              gatekeeper, the future buyer of station services, and the institution trying to avoid a post-ISS
              human-spaceflight gap. External policy analysis is blunter: CSIS says NASA is effectively the market
              today, while Aerospace says a stable non-government station customer base is highly speculative without
              continued government interest. NASA’s revised phase-two design also narrows the near-term objective to
              funded demonstrations before later certification and purchases, which means station economics remain
              policy-sensitive. Supplier concentration compounds that dependence. Axiom’s current private-mission
              cadence still runs through SpaceX Dragon and NASA ordering, and the station’s first modules depend on
              Thales as primary structure manufacturer. Even the 2026 financing round adds relationship concentration
              because strategic capital providers such as QIA and 4iG are tied to the same station and orbital-services
