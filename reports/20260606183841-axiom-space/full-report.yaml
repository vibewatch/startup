        title: Mark history and what public evidence actually prices
        blocks:
          - type: paragraph
            body: >-
              Public pricing history should be read as narrative rather than audited valuation. One reviewed 2026
              secondary page places Axiom's 2023 Series C at a roughly $2.6 billion high mark, while Sacra and an
              Investing.com/Bloomberg summary describe a March 2025 financing of at least $100 million at about a $2
              billion pre-money valuation. That makes 2025 look like a reset rather than a continuation of the earlier
              peak. By February 2026 the tone improved again: Axiom announced a new $350 million financing, QIA
              confirmed its participation, 4iG separately closed its second tranche, and CNBC said PitchBook valued
              Axiom above $2.5 billion. The issue is not a lack of pricing markers; it is the quality of those markers.
              Axiom did not disclose the March 2025 or February 2026 share price, debt split, or preferred-stack
              economics. Public evidence therefore supports a three-step story—2023 high mark, 2025 reset, 2026
              rebound—but not the clean common-equity economics underneath it.
