  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Axiom Space describes itself as a human space exploration company that is building era-defining space
              infrastructure and technology-driven services. The official site, careers copy, and February 2026
              financing release all center the same operating thesis: monetize commercial human spaceflight to the
              International Space Station today while building the longer-lived infrastructure stack for low-Earth orbit
              tomorrow. That stack includes Axiom Station, private astronaut missions, microgravity research, in-space
              manufacturing, orbital data-compute offerings, and lunar/low-Earth-orbit spacesuits. The company says it
              was founded in 2016 by Kam Ghaffarian and Michael Suffredini, and multiple official releases describe it
              as Houston-based. NASA mission pages corroborate that Axiom has become the agency’s repeat
              private-astronaut-mission counterpart, while the company’s own mission pages frame Ax-1 through Ax-4 as
              both stand-alone revenue events and precursors to station demand creation. This supports a practical
              one-line description: Axiom is a private, late-stage space-infrastructure company that sells access,
              mission services, and enabling hardware around a future commercial successor to the ISS.
