        - None — these are reference comparables only
        - >-
          Suborbital tourism, generic orbital logistics/SSA, broad defense-space infrastructure, and broad “space
          tourism” TAMs that mix unlike products
        - Varies widely by report
        - Useful only as outer-bound proxies; they should not be underwritten as Axiom's direct market
