      - number: '3.3'
        title: Pricing visibility is narrow, and dependencies are shared
        blocks:
          - type: paragraph
            body: >-
              Pricing visibility remains one of Axiom’s few current advantages. NASA publicly publishes representative
              pricing logic for private astronaut missions, and Associated Press reporting on Ax-4 says sovereign
              customers paid more than $65 million per seat for a roughly two-week ISS mission. By contrast, the
              reviewed public pages for Starlab, Orbital Reef, and Haven-1 focus on capabilities, testing, partner
              networks, and schedules rather than disclosing seat, tenancy, or payload rates. Even Vast’s public pricing
              signal is indirect: its chief executive told SpaceNews Haven-1 missions should be competitive with private
              ISS missions, but the company still has not published a list price. Dependence is similarly shared but not
              equal. Axiom’s near-term business depends on NASA continuing ISS access and on SpaceX transportation. Vast
              is even more visibly tied to SpaceX through Dragon transport and Starlink systems, while Starlab and
              Orbital Reef remain exposed to NASA transition policy because their revenue cases still assume NASA will
              become one of many anchor customers in commercial LEO. That means competitive risk is shaped as much by
              external platform dependencies as by product features.
