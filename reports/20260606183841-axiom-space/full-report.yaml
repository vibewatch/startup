            body: >-
              Axiom does have public contract signals, but they are not equivalent to recognized revenue. The company’s
              August 2023 Series C announcement said Axiom had more than $2.2 billion of customer contracts, including a
              NASA xEVAS award that it described as a $1.26 billion long-term contract with about $370 million of
              guaranteed task-order payments. NASA’s own 2022 xEVAS award release framed the procurement as an IDIQ,
              milestone-based services contract with a $3.5 billion combined ceiling across Axiom and Collins through
              2034. By April 2026, NASA OIG described the current combined maximum as $3.1 billion, said Collins had
              withdrawn from task orders, and warned that demonstrations may not occur until 2031. That combination
              matters economically: xEVAS gives Axiom a large government-backed program, but it is a development-heavy
              fixed-price service contract whose revenue timing depends on technical milestones and NASA acceptance
              rather than a steady product subscription. Backlog quality is therefore mixed. The public contract floor
