      - number: '7.2'
        title: Technical execution and schedule risk for station and AxEMU
        blocks:
          - type: paragraph
            body: >-
              The sharpest execution risk remains schedule compression across two hard programs. On spacesuits, the OIG
              and GAO both say the work stayed developmental for longer than NASA’s original plan assumed, and the OIG
              now frames the remaining risk in operational terms: if Axiom slips like prior spaceflight programs, NASA
              may still be waiting on lunar and microgravity demonstrations in 2031. NASA’s own February 2026 update
              shows genuine progress—technical review completed, extensive pressurized testing, and first-flight-unit
              parts arriving—but that is still pre-delivery progress, not closed-out schedule risk. Station hardware
              risk is similar. Thales’ original plan targeted 2024 and 2025 launches for the first two modules, while
              Axiom’s current public station page still describes fabrication and final integration as ongoing. The
              safety overlay is important: OIG says NASA may have to keep relying on aging EMUs, which already carry
              known safety problems, if Axiom cannot deliver next-generation suits in time or cost.
