      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reset and rebound is not the same as clean value
            body: >-
              Axiom's financing file is good enough to show that investors still want exposure to the story, but not
              good enough to prove that new-money common equity at the 2026 rebound mark is well protected. That
              distinction is the heart of the research-more call.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV036
              - CV037
              - CV040
          - type: callout
            title: Hidden seniority can erase a private-company headline mark
            body: >-
              The biggest valuation risk is not that Axiom has no strategic relevance. It is that mixed debt,
              undisclosed preferences, and unresolved overlap between financing announcements could make the headline
              round economics materially weaker for fresh investors than the top-line valuation suggests.
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV045
          - type: callout
            title: Use scenario ranges, not a single-point DCF
            body: >-
              Because public evidence still omits recognized revenue, gross margin, burn, runway, and backlog
              conversion, the right method is scenario framing anchored on financing history, capital intensity, and
              public comp context—not a precise intrinsic value model pretending the missing inputs are known.
            calloutType: assumption
            claimRefs:
              - CV035
              - CV041
              - CV042
