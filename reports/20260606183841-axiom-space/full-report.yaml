companyProfile:
  summary: >-
    Axiom Space is a Houston-based private space-infrastructure company founded in 2016 that monetizes private astronaut
    missions, microgravity research access, and NASA-linked development work while building the longer-term Axiom
    Station platform and AxEMU spacesuit program. Public evidence shows real execution proof in four completed ISS
    missions, five consecutive NASA private-astronaut-mission awards, sovereign-customer demand, and a February 2026
    financing rebound after a 2025 reset. But the same public file leaves revenue quality, margin capture, backlog
    conversion, debt mix, and cap-table seniority largely undisclosed, so investors can underwrite strategic relevance
    and program momentum more confidently than common-equity economics.
