              The investability problem is not that Axiom lacks demand evidence; it is that public evidence is strongest
              at the contract, mission, and milestone layer and weakest at the conversion layer. NASA, CSIS, Payload,
              and SpaceNews all point to a station market still mediated by federal policy and budget support, meaning
              future platform revenue depends as much on NASA’s transition design as on independent customer pull.
              Meanwhile, the reviewed sources never disclose recognized revenue, ARR, gross margin, burn, working
