      - number: '3.4'
        title: Axiom’s moat is operational, but policy and substitutes can erode it
        blocks:
          - type: paragraph
            body: >-
              Axiom’s moat is therefore moderate rather than durable by default. The company has real operating
              advantages: repeated PAM execution, visible sovereign-customer wins, published price references, and a
              credible path from attached ISS modules to a free-flying station. Those advantages create switching costs
              for buyers who need training, payload integration, agency approvals, and a mission commander with station
              experience. But the moat is not exclusive. NASA is deliberately diversifying providers, Space Adventures
              and Polaris-style free-flyer missions can absorb prestige- or sponsorship-driven demand, and national
              agencies such as India can still pursue state-led astronaut access instead of buying recurring commercial
              seats. The adverse evidence is important: NASA OIG warned that limited market demand and inadequate
              funding threaten the transition timetable, and SpaceNews reported NASA openly considering a core-module
              fallback because a true station market had not yet emerged. If that policy uncertainty persists, the
              winner may be the company with the best bridge into NASA procurement rather than the company with the
              broadest long-term station vision.
