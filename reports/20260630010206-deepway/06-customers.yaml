      relatedQuestionRefs: [QU022]

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      Planned customer chapter figures (journey-map, funnel, cohort, matrix) were substituted
      with eight structured tables plus one matrix figure. The matrix figure (FU001) satisfies
      the customer-proof-matrix planned figure requirement. The funnel, cohort, and journey-map
      figures were excluded because evidence is insufficient for cohort retention percentages
      and journey-map stage data required by those contracts; additional tables provide equivalent
      analytical coverage without fabricating unsupported data.
  - dimension: tableNotes
    reason: >-
      TU003 (named customer proof table) is a factual enumeration table with primary-source
      evidence for each row; the notes field documents the enumeration boundary and evidence
      limitations rather than leaving it null.
