        a named customer and measurable operating hours or revenue.
      whyItMatters: >-
        The entire L4 autonomous-freight-robot narrative depends on a commercial step-up
        that has not yet been proven with any paying customer.
      diligencePath: >-
        Monitor DeepWay's HKEX IPO filings for any disclosed L4 customer revenue;
        check Inner Mongolia and Xinjiang platooning project for contract details.
      relatedQuestionRefs: [QU007, QU025]

    - type: missing-source
      severity: minor
      topic: adverse-customer-experience
      missingEvidence: >-
        Any public record of customer complaints, truck failures, insurance claims, or
        deployment failures across DeepWay's fleet of 12,000+ units.
      whyItMatters: >-
        The absence of adverse evidence in a 12,000-unit fleet is consistent with either
        excellent reliability or limited public disclosure channels in China's logistics sector.
      diligencePath: >-
        Search Chinese logistics industry forums, SAMR product recall database, and
        insurance claim records; contact fleet operators directly for unfiltered feedback.
      relatedQuestionRefs: [QU023]

    - type: missing-source
