  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: >-
        NRR, GRR, subscription renewal rates, and customer-level churn data for DeepWay's
        fleet ADAS subscription business.
      whyItMatters: >-
        Without retention metrics it is impossible to assess whether DeepWay's customer base
        is durable or merely growing through one-time truck sales.
      diligencePath: >-
        Request HKEX prospectus supplemental data; ask management to provide cohort-level
        subscription renewal data for the 2,000+ activated ADAS vehicles.
      relatedQuestionRefs: [QU007, QU013, QU021, QU025]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Revenue segmentation by customer tier and geographic region to assess top-customer
        concentration risk.
      whyItMatters: >-
        If 2-3 customers represent a majority of revenue, loss of any single customer would
        materially impair the business.
      diligencePath: >-
        Review HKEX prospectus for customer concentration disclosure; request management to
        disclose top-5 customer revenue share.
      relatedTableRefs: [TU003]
      relatedQuestionRefs: [QU011]

    - type: missing-source
      severity: minor
      topic: L4-commercial-customer
      missingEvidence: >-
