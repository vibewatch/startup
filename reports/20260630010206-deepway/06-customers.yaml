company:
  name: DeepWay
chapter:
  number: 6
  title: Customers
  summary: >-
    DeepWay's customer base as of June 2026 is anchored by large Chinese logistics operators
    and express-delivery fleets — Platypus Logistics (200-truck order), STO Express (first
    NEV truck delivery in China's express sector), and Xinchenghui Logistics (100 CATL
    battery-swap trucks) — plus an emerging international footprint through Foodstuffs North
    Island in New Zealand and a newly signed Australian partner. Domestic market share in
    China's express-delivery segment exceeds 95%, and cumulative deliveries surpassed
    approximately 12,000 units by early 2026. The core risk is that customer adoption is
    concentrated in short-haul fixed-route bulk-freight operators in China; retention evidence
    is thin (ADAS subscription renewal rates are not disclosed), no formal NRR/GRR data is
    public, and the step-up from L2 ADAS subscriptions to the future L4 autonomous-freight-robot
    revenue model has not yet been proven in commercial terms.

sections:
  - id: named-customer-deployments-china
    title: Named Customer Deployments — China
    body: >-
      DeepWay's strongest commercial proof resides in China's short-haul port-logistics and
      express-delivery sectors. The most significant 2026 deployment is a 200-truck order from
      Platypus Logistics, a world-leading port-logistics enterprise with operations across
      Shanghai, Ningbo, Guangzhou, and Shenzhen. On May 7, 2026 the first 50 DeepWay Xingtu
      6×4 electric trucks (505 kWh battery) were formally handed over to Sixiangjia, a company
      within the Platypus ecosystem, with the remaining 150 units scheduled for H1 2026 delivery.
      Platypus selected DeepWay on the basis of four operational factors: ultra-low energy
      consumption (industry-leading real-world efficiency), safety from ground-up engineering
      rather than diesel-to-electric conversion, native TMS digital integration with Platypus's
      capacity-dispatching system, and high uptime reliability in intensive port-cycle operations.
      Daily operating mileage on Platypus routes ranges from 200 to 400 km. The Platypus
      selection is commercially significant because the company uses data-driven vehicle
      procurement; adoption by a data-driven operator constitutes independent validation of
      total cost of ownership, not merely a marketing relationship.

      In October 2024, DeepWay and CATL jointly delivered 100 Shenxiang Xingchen
      battery-swappable heavy-duty trucks to Xinchenghui Logistics Co., Ltd. in conjunction
      with the inauguration of a new CATL Electric Truck Charging and Battery Swapping Center
      in Dujiangyan, Sichuan Province. These trucks target Southwest China's gravel-transport
      sector, achieving 190 km range on a full 49-tonne load per charge and 400–500 km per day
      through battery-swap cycles. Energy consumption of 0.925 kWh/km at full load was cited
      as a key procurement driver.

      On April 21, 2025, DeepWay and STO Express held a delivery ceremony in Shanghai for the
      first batch of new-energy heavy-duty trucks — the first such delivery in China's national
      express-delivery industry. These vehicles are equipped with CDTL's distributed drive
      system (EA5000N), achieving 1.15 kWh/km ultra-low energy consumption for intercity
      transport. The milestone marked a critical precedent for zero-emission adoption in
      China's parcel-logistics sector. SF Express is separately confirmed as a DeepWay
      customer per industry analyst databases, though the specific fleet size and contract
      terms are not publicly disclosed.
