    type: matrix
    layout: standard
    summary: >-
      Side-by-side positioning of DeepWay versus its three primary autonomous-trucking
      competitors across twelve commercial and technical dimensions as of June 2026.
      Highlights DeepWay's delivery-scale lead while surfacing data-gap and competitive
      challenges from Inceptio and KargoBot.
    data:
      columns:
        - label: DeepWay
        - label: KargoBot (Didi)
        - label: Inceptio Technology
        - label: Plus AI / Zeron
      rows:
        - label: "Cumulative autonomous km (H1 2025)"
          values: ["~100M km", "35M+ L4 km", ">400M km", "Not disclosed"]
        - label: "L4 commercial operation"
          values: ["Platooning pilots — Inner Mongolia, Xinjiang", "Commercial supply chain operations", "Pilot-only (no commercial L4)", "ODD-restricted pilots"]
        - label: "Cumulative fleet deliveries"
