callouts:
  - calloutType: strength
    title: First-Mover in China Express Delivery Electrification
    body: >-
      DeepWay's April 2025 delivery to STO Express was the first NEV heavy-truck delivery
      in China's national express delivery industry, establishing the company as the
      benchmark reference for sector-wide electrification. The 95%+ market-share claim in
      the express-delivery segment, while unaudited, signals dominant positioning in a
      high-frequency, fixed-route logistics vertical well-suited to autonomous operation.
    claimRefs:
      - CU007
      - CU021

  - calloutType: risk
    title: Unaudited Metrics and Thin Retention Evidence
    body: >-
      No formal NRR, GRR, or subscription-renewal data has been publicly disclosed.
      robotics.press flags funding figure discrepancies and notes that all operational
      metrics are self-reported pending the HKEX IPO prospectus audit. The gap between
      L2 ADAS fleet deployment and commercially proven L4 revenue remains the central
      unvalidated assumption in DeepWay's customer value story.
    claimRefs:
      - CU033
      - CU034

