  topStrengths:
    - DeepWay 已做到真实交付和收入规模：2025 年交付 8,020 辆车、收入 RMB 3.96 billion，多数自动驾驶卡车同业尚未追上。
    - 产品栈纵向打通整车架构、电池、车队软件和 Baidu 绑定的自动驾驶，拼出一条差异化的中国商业化路径。
    - 机构支持仍强：Baidu 还在股权结构表中，港股上市前披露的 IPO 前融资超过 $310 million。
    - 早期客户样本覆盖中国港口物流、快递配送和部分海外部署，说明 L4 自动驾驶完全商业化之前，这些卡车已能解决真实运营场景。
  topRisks:
    - 收入仍有 99% 来自硬件，2025 年毛利率只有 4.9%，商业经济性距离软件模式还很远。
    - DeepWay 高度依赖 Baidu Apollo、CATL 电池和 JAC 制造，技术、供应链和议价权风险会同步暴露。
    - 核心 L4 货运机器人逻辑仍取决于中外监管演进；中国全国性 L3/L4 标准要到 2027 年才生效。
    - 港股 IPO 尚未披露确切定价或隐含估值，公开市场投资人难以把握入场纪律。
    - 客户留存、订阅 ARPU 和成熟自动驾驶服务单车经济性披露仍不足。
  unresolvedGaps:
    - 港交所申请版本仍遮盖确切 IPO 价格区间、股数和隐含投前估值。
    - 公开来源没有披露 ADAS 订阅 ARPU、续约队列、NRR，或可持续经常性软件收入何时形成。
    - 除公司和招股书披露外，未看到对累计自动驾驶公里数和 L4 就绪度指标的独立公开审计。
    - 电池成本、质保和经销 / 渠道扩张之后的长期利润率结构，公开数据仍无法支撑判断。
    - 海外商业化深度仍有限，目前超出新西兰和澳大利亚早期渠道 / 客户样本的证据不多。
