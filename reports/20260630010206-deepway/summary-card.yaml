  topStrengths:
    - >-
      DeepWay has reached real delivery and revenue scale — 8,020 trucks and RMB 3.96 billion revenue in 2025 — that
      most autonomous-trucking peers have not matched.
    - >-
      The product stack is vertically integrated across vehicle architecture, batteries, fleet software, and
      Baidu-linked autonomous driving, creating a differentiated China commercialization path.
    - >-
      Institutional support remains strong, with Baidu still on the cap table and disclosed pre-IPO funding exceeding
      $310 million before the Hong Kong listing.
    - >-
      Early customer proof spans Chinese port logistics, express delivery, and selected overseas deployments, showing
      the trucks solve real operating use cases before L4 autonomy is fully commercial.
  topRisks:
    - >-
      Revenue is still 99% hardware-led and 2025 gross margin was only 4.9%, so the business economics remain far from
      software-like.
    - >-
      DeepWay relies heavily on Baidu Apollo, CATL batteries, and JAC manufacturing, creating correlated technology,
      supply-chain, and bargaining-power risk.
    - >-
      The core L4 freight-robot thesis still depends on evolving Chinese and overseas regulation, with nationwide
      Chinese L3/L4 standards only taking effect in 2027.
    - >-
      The Hong Kong IPO does not yet disclose exact pricing or implied valuation, making entry discipline difficult for
      public-market investors.
    - >-
      Customer retention, subscription ARPU, and mature autonomous-service unit economics remain insufficiently
      disclosed.
  unresolvedGaps:
    - >-
      Exact IPO price range, share count, and implied pre-money valuation remain redacted in the draft HKEX application
      proof.
    - >-
      Public sources do not disclose ADAS subscription ARPU, renewal cohorts, NRR, or the timing of durable recurring
      software revenue.
    - >-
      No independent public audit of cumulative autonomous-kilometer and L4-readiness metrics was available beyond
      company and prospectus disclosures.
    - >-
      Long-term margin structure after battery costs, warranties, and distributor/channel expansion is still not
      underwritten in public data.
    - Overseas commercialization depth beyond initial New Zealand and Australia channel/customer proofs remains limited.
