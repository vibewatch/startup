  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 Tianji 软件套件
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的核心商业产品是正向开发的 Xingchen 系列新能源重卡。第一代 Xingchen Gen-I 在公司 2020 年 7 月成立后，于 2021
              年进入试点运营，验证了白纸设计、AV-first 底盘架构。第二代 Xingchen Gen-II 于 2023 年进入商业生产，动力总成效率和车载计算冗余明显提升；到 2025 年交付 8,020 辆，使
              DeepWay 成为中国第九大新能源重卡销售商。定位为更广泛市场可达性的 Xingtu（StarWay）平台，把产品组合延伸到更多车队细分。海外方面，Xingchen Gen-II 在澳大利亚获得 NHVR
              认证，并于 2024 年 9 月在泰国启动商业运营；到 2025 年，分销协议已覆盖马来西亚、新加坡、新西兰、哈萨克斯坦和阿联酋。

              Tianji 套件是 DeepWay 叠在车辆硬件平台之上的自有软件栈。它包含四个商业模块：Suixing（Level 2 主动安全辅助）、Yanxing（面向 2–3 辆卡车车队的 Intelligent
              Platoon Transportation System）、Duxing（Level 4 单车自动驾驶开发项目）和 Tianshu（用于实时遥测、调度和路径优化的车队 SaaS）。截至 2025 年 12
              月，超过 7,500 辆车运行 Suixing L2 订阅，在活跃车队中的转化率超过 30%。Tianshu SaaS 在硬件换新周期之外，为公司与车队运营商建立合同触点。Yanxing IPTS 借助
              5G-V2X 通信进行协同编队管理，并于 2023 年进入商业服务。Duxing 仍处于有人监管道路测试模式，仅在北京和天津持有 ICV 牌照；HKEX 递表没有披露任何商业 L4 收入。
