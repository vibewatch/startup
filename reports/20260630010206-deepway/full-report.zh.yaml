      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 正向开发优势与 Apollo 白盒许可
            body: >-
              DeepWay 的白纸设计路径叠加对 Baidu Apollo 自动驾驶平台的独家白盒访问，形成了硬件—软件协同设计护城河，柴油车改造型竞争对手很难复制。Apollo 合作让 DeepWay 接入中国最成熟的开源
              AV 代码库之一，同时保留在其上开发自有算法的 IP 自由度。
            calloutType: strength
            claimRefs:
              - CO006
              - CO029
          - type: callout
            title: 毛利率很薄，盈利路径仍待打穿
            body: >-
              2025 年 4.9% 的毛利率意味着，即便剔除利息和折旧，DeepWay 仍会被运营费用拖入亏损。累计净亏损超过 RMB 1.7B，研发支出占收入
              9.8%；公司若要达到能支撑盈利的单位经济性，要么显著放量摊薄固定成本，要么成功变现 Tianji 软件订阅栈。整车毛利与软件毛利之间的落差，是核心财务风险。
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO032
          - type: callout
            title: 反向分析：融资数字混淆与 L4 时间表滑坡
            body: >-
              一份独立竞争分析（robotics.press，2026 年 6 月）提示，$173M 和 $310M 的 Pre-IPO 数字分别指 Round 1 和累计总额，这一区别在二级报道中常被模糊。同一分析还质疑
              Duxing L4 商业部署时间表是否已从原定 2025 年目标后移，并指出 2026 年 5 月 HKEX 递表没有给出 L4 单车运营的确定商业上线日期。
