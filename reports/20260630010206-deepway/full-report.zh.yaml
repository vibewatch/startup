      - number: '5.2'
        title: 技术架构与 Apollo 集成
        blocks:
          - type: paragraph
            body: >-
              DeepWay 最具结构性差异的技术资产，是正向开发的 Electrical/Electronic Architecture（EEA）。不同于传统卡车 OEM 把 AV 传感器改装到既有柴油平台上，DeepWay
              的 Xingchen 底盘从一开始就为自动驾驶运营设计，配备集中式域控制器、冗余电力网络和原生传感器安装点。这一路径意味着车辆 CAN / Ethernet 主干针对低延迟 AV 通信设计，而不是事后补装。

              每辆车的标准传感器套件包括 10 个摄像头（覆盖环视和前向远距视野）、5 个毫米波雷达和 3 个红外传感器，总计 18 个传感器单元，提供 360 度环境覆盖。车载计算平台提供 500+
              TOPS，足以同时运行实时感知、预测和规划。DeepWay 是唯一持有 Baidu Apollo 自动驾驶软件栈白盒许可的商用车公司，这意味着它访问的是平台源代码，而不是编译后的 API。Apollo 提供
              Baidu 十多年 AV 研发沉淀出的成熟核心感知、预测和规划流水线；DeepWay 在其上叠加商用车专用层，包括重卡动力学模型、载重 / 天气处理，以及驾驶辅助校准配置。

              Three-Electric 系统（电池包、驱动电机和电机控制器）面向长途重载货运设计，这是商用车市场能耗最高的细分。浙江长兴专用 Three-Electric 制造设施于 2025 年 2
              月开工。在该设施投产前，装配外包给 JAC Motors 和 Shandong Reach，两者都是成熟中国整车制造商。截至 2026 年 5 月 HKEX 递表，DeepWay
              活跃车队累计自动驾驶和半自动驾驶里程超过 200M 公里。公司在北京和天津持有 ICV（Intelligent Connected Vehicle）道路测试牌照，可在公开道路上开展有人监管 L4 开发。
