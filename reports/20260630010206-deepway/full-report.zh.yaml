      - number: '8.5'
        title: 关键催化剂、风险与投资人考量
        blocks:
          - type: paragraph
            body: >-
              最终的投资问题不是 DeepWay 有没有做出真实业务；它已经做到了。问题在于 IPO 价格是否把这种验证转化为有吸引力的回报。短期重估上行将来自克制的 IPO 定价、H1 2026
              毛利率继续上行的证据、更高级编队或 L4 变现获得监管许可，以及海外扩张带来需求而非分心的证明。谨慎理由同样清楚：负权益仍是真实压力，软件收入仍可忽略，中国自动驾驶专精公司和既有卡车 OEM 都能从不同角度攻击
              DeepWay 的叙事。因此，今天的公开证据支持价格敏感立场，而不是无条件买入。若采用中个位数销售额倍数框架，估值看起来公允；若 IPO
              定价推入软件式区间，则偏紧；只有最终交易为公开数据中仍未解决的执行风险留下空间，估值才有吸引力。
