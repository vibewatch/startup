        blocks:
          - type: paragraph
            body: >-
              DeepWay
              的护城河在电动卡车设计、自动驾驶经济性和服务触达紧密耦合的场景中最可信。公司可以主张，完整卡车架构降低了传感器和计算集成摩擦，让增量辅助驾驶成本保持较低，并比改装路径提供更好的运营者体验。这是真实差异化，但护城河耐久性存在争议。Inceptio
              披露的里程底座更大、OEM 份额更强，可能比 DeepWay 的集成硬件优势复利更快，因为数据飞轮和生产合作一旦放大就更难压缩。KargoBot 说明，更聚焦走廊的 L4
              策略不必先解决所有货运用例，也能接近有吸引力的经济性。Pony.ai 说明，现金池深得多的相邻自动驾驶平台可以延伸到卡车。Plus.ai 和 Aurora 则显示，以 OEM
              为中心、跨地域的模型可能把技术栈部分模块商品化。TuSimple 在监管和治理动荡后滑向
