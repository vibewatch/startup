            body: >-
              TuSimple 说明，一旦治理问题、监管压力和商业化挫折叠加，公开市场上的自动驾驶卡车股票故事几乎可以失去全部价值。DeepWay
              的香港路径避开了一部分直接赴美上市敞口，但无法抹去投资人对这个品类的更广泛记忆：当预期跑在执行前面时，该领域能很快毁掉资本。
            calloutType: risk
