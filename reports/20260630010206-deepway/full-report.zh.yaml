      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 三重单一来源依赖
            body: >-
              CATL（电池）、Baidu Apollo（ADS 软件）和 JAC Motors（制造）各自都是切换成本极高的单一来源依赖。三者任何一个出现中断——CATL 供应受限、Baidu 战略退出或 JAC
              停产——都会实质削弱 DeepWay 制造、差异化或开发车辆的能力。三项风险并不独立：CATL 旗下竞争卡车 Zeron 带来结构性冲突；Baidu 自身 AV 战略可能变化；JAC
              的财务健康状况无法从公开来源审计。投资人应把这组三重依赖视为复合相关风险。
            calloutType: risk
            claimRefs:
              - CR034
              - CR035
              - CR014
          - type: callout
            title: L4 收入模型仍是未来承诺
            body: >-
              DeepWay 作为自动货运机器人公司的完整多头故事，取决于从 L2 ADAS（当前现实）转向商业 L4 自动货运（未来承诺）。该转型需要同时打通三个独立关口：五个试点城市之外的监管授权、完整 L4
              栈技术验证，以及保险框架。截至 2026 年中，三者均未解决。robotics.press 的反向笔记将其表述为核心风险：缺口不只是技术问题，也是制度问题，且时间表不由 DeepWay 直接控制。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR038
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可比公司范围与收入质量分析
        blocks:
          - type: paragraph
            body: >-
              作为一家自动驾驶卡车公司，DeepWay 进入估值时的公开画像很特殊。其 FY2025 收入为人民币 3961.1 million，按用户参考汇率约合 $582 million，远高于 Aurora、WeRide
              或 Pony.ai 当前披露的收入。这个规模重要，因为它证明了真实卡车商业化，而不只是试点部署。但收入质量与收入规模同样重要。招股书显示，FY2025 收入的 99.2% 仍来自卡车硬件，软件及其他收入仅占
              0.8%；DeepWay 因此更接近一家带自动驾驶上行空间的 EV 卡车 OEM，而不是软件优先的自动驾驶平台。该收入结构解释了为什么公开可比公司会分成两类：DeepWay
              凭增长和软件可选性，应较普通卡车制造商享有溢价；但相较毛利率和经常性收入已经强得多的纯 AV 或 ADAS 公司，则应折价。
