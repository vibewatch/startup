      - number: '6.3'
        title: 客户分层、采用轨迹与经常性收入
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的核心客户是中国短途、固定线路大宗货运市场中的大型商业物流运营商——该细分市场估计占中国公路货运总量的 40–50%，也是近期最适合规模化自动驾驶落地的场景。中国客户群覆盖快递（STO
              Express、SF Express）、港口物流（鸭嘴兽、鑫诚辉）、砂石 / 大宗货物和区域干线。DeepWay 在中国快递电动卡车细分市场拥有超过 95% 的市场份额，并位居上海、新疆和山东销量前列。

              采用速度在加快：2023 年（首个商业化年份）交付 509 台，2024 年交付 3,002 台，2025 年交付 8,020 台，后者在中国新能源重卡市场排名第九。截至 2026
              年初，中国、泰国、新西兰、澳大利亚及其他市场的累计交付量据报超过 12,000 台；截至 2025 年中，由客户运营的累计里程超过 2 亿 km（新西兰分销商口径）。DeepWay 2025 年收入增长
              101%，至约人民币 39.6 亿元（~$582M），几乎全部（>90%）由整车销售驱动。

              客户模型的一个关键维度，是来自天玑随行 ADAS 订阅的经常性收入。DeepWay 是全球首家在全系车型标配集成式驾驶辅助系统的公司；车队运营商为主动使用自动驾驶辅助功能支付订阅费。截至 2025 年中，超过
              2,000 台车辆已激活订阅，付费订阅率上升被投资人视为强商业信号。DeepWay 在中国的 400+ 服务中心和 1,000+ 认证工程师，支撑售后与订阅服务网络，也支撑复购。

              不过，公开可得的客户留存证据有限。公司未披露 NRR、GRR 或正式流失数据。长期车队级订阅续费率，以及任何合同期限或锁定结构证据，均未公开。这些是评估客户基础质量和耐久性的实质尽调缺口。
