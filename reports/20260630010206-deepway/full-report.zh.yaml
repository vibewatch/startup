      - number: '3.3'
        title: 能力、定价与分销比较
        blocks:
          - type: paragraph
            body: >-
              能力比较不是单纯比谁的自动驾驶等级更高。DeepWay 的优势是集成式电动卡车设计、低成本 L2 部署和可量化的订阅挂载。Inceptio 在披露里程和 OEM 制造杠杆上领先。KargoBot 在公开 L4
              走廊专业化和编队经济性上领先。Pony.ai 把卡车业务与更大的 robotaxi 平台混合，获得现金、工程品牌和跨项目经验。Plus.ai 和 Aurora 展示了全球 OEM
              分销的力量，但本材料包中的披露证据，在合作伙伴广度上强于中国线路密度。几乎所有同业的公开定价都不透明：厂商销售的通常不是软件标价，而是卡车 ASP、订阅挂载、OEM 集成 ADAS
              成本、节油、人力减少或利用率提升的某种组合。这种不透明提高了对实际定价、折扣和合同结构的尽调重要性。分销能力也相应由 OEM 合作和制造位置塑造。若买方想要一辆深度优化的电动卡车，DeepWay
              的垂直整合是优势；但对偏好模块化采购、在底盘、软件和运营提供商之间多供应商并行的车队来说，这也可能是限制。
