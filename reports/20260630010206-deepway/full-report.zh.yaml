            body: >-
              2025 年利润表有所改善，但还不能证明公司具备持久的高质量单位经济性。毛利增至 RMB 194.9 million，毛利率升至 4.9%，高于 2023 年和 2024 年的 0.4% 与
              0.5%；但公司仍录得 RMB 649.1 million 净亏损，净亏损率为 -16.4%。研发仍是核心成本中心：DeepWay 2025 年研发投入 RMB 386.6 million，相当于收入的
              9.8%；递表称所有研发均发生即费用化，没有资本化。销售与营销也随 go-to-market 搭建而放大，2025 年达到 RMB 223.3 million、428 名员工；同时，随销量爬坡，估算的单台交付
              S&M 支出明显下降。收入质量仍带集中度风险。2025 年，前五大客户贡献 39.5% 收入，最大客户贡献 12.7%；最大客户的子公司还供应电池，前五大供应商占采购额 79.4%。经销商销售仅占 2025
              年收入 2.5%，说明 DeepWay 目前仍主要依赖直销和 110+ 服务中心网络，而不是宽广外部渠道。净结果是，DeepWay 更像一家早期 EV
              OEM，叠加辅助驾驶变现期权；还不像一家已经证明经常性经济性的 software-first 自动驾驶公司。
