  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 已点名客户部署——中国
        blocks:
          - type: paragraph
            body: >-
              DeepWay 最强的商业验证来自中国短途港口物流和快递配送场景。2026 年最重要的落地，是鸭嘴兽物流的 200 台订单；鸭嘴兽是全球领先的港口物流企业，业务覆盖上海、宁波、广州和深圳。2026 年 5 月 7
              日，首批 50 台 DeepWay 星途 6×4 电动重卡（505 kWh 电池）正式交付给鸭嘴兽生态内企业四向佳，其余 150 台计划在 2026 年上半年交付。鸭嘴兽选择
              DeepWay，基于四个运营因素：极低能耗（真实工况效率行业领先）、从底层重新开发而不是油改电带来的安全性、原生 TMS 与鸭嘴兽运力调度系统打通，以及高强度港口循环作业中的高出勤可靠性。鸭嘴兽线路的日运营里程在
              200 至 400 km 之间。鸭嘴兽的选择具有商业意义，因为该公司靠数据驱动车辆采购；一个数据驱动运营商采用 DeepWay，构成了对 TCO 的独立验证，而不只是营销合作。

              2024 年 10 月，DeepWay 与 CATL 联合向鑫诚辉物流有限公司交付 100 台深向星辰换电重卡，同时 CATL 电动重卡充换电站在四川都江堰启用。该批车辆面向中国西南砂石运输市场，满载 49
              吨单次充电续航 190 km，靠换电循环实现每日 400–500 km。满载能耗 0.925 kWh/km 被列为关键采购驱动因素。

              2025 年 4 月 21 日，DeepWay 与 STO Express 在上海举行首批新能源重卡交付仪式——这是中国全国快递行业首次此类交付。该批车辆搭载 CDTL
              分布式驱动系统（EA5000N），城际运输能耗低至 1.15 kWh/km。该里程碑为中国包裹物流行业零排放采用树立了关键先例。行业分析数据库另行确认 SF Express 是 DeepWay
              客户，但具体车队规模和合同条款未公开披露。
