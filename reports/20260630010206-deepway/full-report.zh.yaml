      - number: '1.4'
        title: 里程碑、规模与市场存在感
        blocks:
          - type: paragraph
            body: >
              DeepWay 的里程碑从 2020 年底两方宣布合资开始，延伸到商业卡车交付（2022 年 6 月首批交付 CATL 用于干线运输）、进入泰国海外市场（2024 年 9 月），以及 2026 年 4 月超过
              $310M 的 Pre-IPO 机构轮融资。公司车队累计自动驾驶里程超过 200M 公里，全国服务中心超过 400 个。

              2025 年是运营台阶年：交付量增长 167% 至 8,020 辆，经营现金流转正，Pre-IPO 轮引入全球机构资本。Tianji Suixing L2 ADAS 订阅突破 7,500
              辆活跃车辆。海外商业运营现已覆盖泰国、澳大利亚、马来西亚、新加坡、新西兰、哈萨克斯坦和阿联酋，首个海外商业运营于 2024 年 9 月在泰国启动。

              知识产权方面，截至 2025 年 12 月 31 日，DeepWay 拥有 195 项专利、265 件商标和 108 项软件著作权。公司已在北京和天津取得 L4 自动驾驶道路测试牌照。Tianji Yanxing
              IPTS 编队系统于 2023 年进入商业服务。

              关键客户风险：2025 年前五大客户集中度为 39.5%（较 2023 年的 82.5% 改善），单一最大客户贡献 2025 年收入的 12.7%，仍带来实质收入集中风险。
