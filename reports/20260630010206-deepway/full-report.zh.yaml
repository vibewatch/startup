      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 中国的结构性采用优势真实存在
            body: >-
              中国同时拥有异常庞大的货运底座、快速提升的新能源重卡渗透、密集走廊物流，以及比多数西方市场更偏商业化的试点环境。这一组合很关键，因为它允许 DeepWay
              这类公司在全国范围内完全无人驾驶合法化之前，先变现卡车硬件和辅助驾驶，从当前收入接到未来自动驾驶上行空间的桥更可信。
            calloutType: strength
            claimRefs:
              - CM004
              - CM006
              - CM021
              - CM036
          - type: callout
            title: 监管与商业化节奏仍可能后移
            body: >-
              多头市场判断假设公开道路许可、车队信任、责任框架和走廊运营会足够快成熟，使辅助驾驶转化为可规模化的自动驾驶货运。保留来源支持试点进展真实存在，但并不能证明走廊级许可、保险接受度和线路经济性会按最大情景预测暗示的激进时间表放大。
            calloutType: risk
            claimRefs:
              - CM030
              - CM033
              - CM037
              - CM038
          - type: callout
            title: 关键市场洞察是 TAM 与 SAM 脱节
            body: >-
              只要引用中国公路货运、广义 AV 预测或全球自动驾驶卡车 thesis，DeepWay 的标题市场就能被做得很大。但这些数字没有一个单独等同于可投资市场。可投资 SAM
              是新能源重卡车队和货运走廊中的子集：客户现在能买车，下一步能订阅软件，并最终能在有效监管许可下运营或购买自动驾驶货运。
