    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与战略语境
        blocks:
          - type: paragraph
            body: >
              DeepWay Technology Co., Ltd. 于 2020 年 7 月成立，是 Baidu, Inc. 与 Lionbridge Financial Leasing Group
              的合资公司。公司总部位于中国安徽省合肥市（合肥总部于 2023 年 11 月正式设立），北京承担研发，装配环节则通过合同制造伙伴运营工厂。公司官网和 HKEX 申请版本把 DeepWay
              的使命描述为开发“smart NEV heavy-duty trucks”：它从白纸开始正向开发电动动力总成和 L2–L4 自动驾驶，而不是改造存量柴油重卡。

              商业模式分三步走。第一阶段（当前主驱动）：销售 Xingchen 和 Xingtu 牵引车系列，2025 年硬件收入占比超过 97%。第二阶段（放量）：Tianji 软件订阅——截至 2026 年 5
              月递表，Suixing L2 ADAS 订阅（定价 RMB 3,000–5,000 / 年）已激活超过 7,500 辆车，渗透率超过 30%。第三阶段（2027 年以后目标）：Tianji Duxing
              Level 4 单车自动驾驶货运网络，目前仍在开发。公司还运营 Tianji Tianshu 车队管理 SaaS。

              截至 2025 年 12 月 31 日，DeepWay 累计交付 11,531 辆车（2023 年 509 辆、2024 年 3,002 辆、2025 年 8,020 辆），在中国 2025
              年新能源重卡市场排名第 9。2025 年收入 RMB 3,961.1M（约 US$582M），同比增长 101%。净亏损从 2024 年的 RMB 675.1M 收窄至 2025 年的 RMB
              649.1M，经营现金流转正至 RMB 835.2M。毛利率从 2024 年的 0.5% 提升至 4.9%。
