            title: DeepWay 的规模应享有溢价，但还不到软件倍数
            body: >-
              DeepWay 的 FY2025 收入和正经营现金流，是多数 AV 同行拿不出的更强商业化信号。即便如此，公司几乎所有收入仍来自卡车硬件，毛利率也只是最近才达到
              4.9%；因此证据支持混合模型估值区间，而不是自动驾驶软件估值框架。
