      - number: '7.2'
        title: 技术、运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              DeepWay 当前产品线以 L2 Advanced Driver Assistance（ADAS）商业部署，覆盖约 12,000 台装机车队；这不是 Level 4 自动驾驶。从 L2 车队数据采集跨到
              Level 4 自动货运运营，需要同时完成工程里程碑（全栈 L4 验证、传感器冗余认证、失效安全架构）、监管里程碑（各司法辖区商业部署许可）和保险里程碑（保险覆盖框架），而截至 2026
              年中这些均未解决。robotics.press 曾指出，DeepWay 将其 L2 ADAS 描述为通向 L4 的入口，但所有自动驾驶里程指标均为自报，且在 HKEX IPO
              申报前未经独立审计。验证维度至关重要：投资人若依赖数据飞轮叙事（积累训练里程以加速 L4 安全性），无法独立核验这一主张。JAC Motors 是 DeepWay 星途和 Star 平台的主要 OEM
              制造伙伴。制造依赖把产能、质量体系和物流可得性风险集中到单一伙伴身上。JAC 产能一旦中断，DeepWay 履行截至 2025 年中所报 1,400 台积压订单的能力会直接受损。CATL 的 600 kWh
              LFP 电池包是全产品线唯一电池平台；公司未公开披露第二供应商。电池价格波动由碳酸锂和 LFP 正极材料现货价格驱动，会直接压缩毛利率。若 CATL 电池价格快速下跌（如 2023–2024 年中国 EV
              行业所见），车队客户可能推迟采购，等待更便宜的下一代电池包，从而给 DeepWay 带来需求空档和 OEM 库存风险。内蒙古和新疆的编队行驶与 L4
              试点运营，在缺乏公认保险或事故响应框架时，会带来安全和责任敞口。
