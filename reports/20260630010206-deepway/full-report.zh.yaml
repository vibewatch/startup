      - number: '6.2'
        title: 国际市场客户与分销
        blocks:
          - type: paragraph
            body: >-
              DeepWay 在 2025 年真正进入国际市场，并在 2026 年加速获客。商业进展最靠前的海外落地，是新西兰 Foodstuffs North Island；该公司成为中国以外首个在温控商业供应链中运营
              DeepWay Star 电动卡车的运营商。Foodstuffs 于 2026 年 3 月从 Palmerston North Distribution Centre 启用该车辆。卡车每天跑双循环线路：上午往返
              200 km，向 Kapiti Coast 门店配送冷藏和冷冻食品；下午再往返 280 km，前往北岛南部其他门店。午间 90 分钟补能支撑 460 km 的日循环。车辆配备 600 kWh
              磷酸铁锂电池，连续功率 224 kW / 峰值功率 492 kW，连续扭矩 30,000 Nm，列车总质量 50,000 kg。Foodstuffs 此前在 2025 年用冷藏挂车试跑该车超过 1,000
              km。首席执行官 Chris Quin 将采用该车与供应链抵御燃油价格波动的韧性以及环境目标（2030 年减排 42%）联系起来。

              在新西兰分销渠道中，Etrucks New Zealand 于 2025 年 7 月被正式任命为全国官方分销商，并于 2025 年 7 月 30 日在 Hamilton 的 EROAD Fleet
              Managers' Day 推出 DeepWay Star。该车零售价为 NZD 255,000 + GST（扣除政府 Low Emissions Heavy Vehicle Fund
              补贴后），是新西兰市场价格最低的电动半挂牵引车。分销协议由 Etrucks 董事 Ross Linton 与 DeepWay 全球运营经理 Chiara Wang 在 DeepWay 合肥总部签署。Etrucks
              此前分销高端 Windrose E1400；DeepWay Star 补上了更具成本效率的档位，拓宽了可覆盖的车队客群。

              在澳大利亚，DeepWay 于 2025 年 5 月与一家澳大利亚伙伴签署经销协议，并确认首笔订单——这使澳大利亚成为 DeepWay
              继新加坡、泰国、马来西亚之后的第四个亚太市场。澳大利亚分销商在签约前完成真实工况测试，并验证了车辆的高效率和安全表现。DeepWay 国际总经理林发才承诺为澳大利亚市场提供定制化产品和全生命周期支持。NGS
              Super 养老基金参与 2026 年 4 月 Pre-IPO 轮，既体现资本承诺，也显示其有意动用广泛的澳新资源，加速 DeepWay 区域商业化。
