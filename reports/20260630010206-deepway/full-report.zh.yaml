      - number: '7.3'
        title: 竞争与财务风险
        blocks:
          - type: paragraph
            body: >-
              DeepWay 面临来自多条战线的竞争压力。Inceptio Technology 车队已累计超过 4 亿自动驾驶 km，相当于 DeepWay 所报约 1 亿 km 的 4× 数据规模优势。Inceptio
              的纯软件 OEM 集成模式，让它无需承担垂直一体化 OEM 的资本要求，就能嵌入多个卡车品牌，扩张成本结构更低。KargoBot 于 2023 年从 Didi 分拆，2024 年完成 RMB 600
              million（~$83M）Series C，已展示商业 L4 供应链运营，并运营专门设计的无驾驶室自动驾驶卡车——与 DeepWay 鸭嘴兽部署争夺同一港口物流走廊。Zeron 由 CATL、Nio
              Capital 和 Momenta 支持，2024 年融资 $175M；其拥有 CATL 供应链入口，未来可能匹配 DeepWay 的电池合作优势，构成竞争威胁。财务端，DeepWay 2025 年收入 RMB
              3.96 billion（同比 +101%），但净亏损 RMB 649 million，意味着 EBIT 利润率约 -16%。硬件（卡车销售）贡献超过 90%
              收入，说明业务本质上是资本密集型制造运营，而不是软件业务。弥合 L2 到 L4 缺口所需的 R&D 投入，必须与产能爬坡同步持续投入；而经常性软件收入有限，难以抵消双重资本需求。HKEX Chapter 18C
              IPO 面向的市场环境中，亏损自动驾驶公司在全球都面临更高投资人审视。Baidu 持有 DeepWay 约 13–17%（因来源而异），既是战略锚，也可能在 Baidu
              下调自动驾驶战略优先级时成为潜在压力。$310M Pre-IPO 融资公告与 robotics.press 跟踪的首笔约 $173M 款项之间存在差异，引发对披露指标数据质量的疑问。
