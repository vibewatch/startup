  - id: FE001
    title: DeepWay 全栈技术架构（2026 年 6 月）
    type: stack
    layout: standard
    summary: 这张层级栈图从物理车辆硬件延伸到云服务和商业软件订阅， 展示 Baidu Apollo 基础层与 DeepWay 自有增量之间的整合关系。
    data:
      layers:
        - id: layer-01
          label: 卡车底盘和车身
          detail: 正向开发的 AV 原生平台；没有传统柴油底座。配有专用线束、执行器安装位和计算舱。
          owner: Proprietary
        - id: layer-02
          label: 三电系统（电池 · 电机 · 控制器）
          detail: NMC/LFP 电池包、同步驱动电机、SiC 电机控制器。按长途重载货运工况设计。
          owner: Proprietary (contracted mfg at JAC Motors / Shandong Reach; own factory under construction)
        - id: layer-03
          label: 传感器套件
          detail: 每车 10 个摄像头（环视 + 前向长距）+ 5 个毫米波雷达 + 3 个 IR 传感器 = 18 个传感单元。
          owner: Tier-1 hardware suppliers (unnamed)
        - id: layer-04
          label: 车载计算平台
          detail: 集中式域控制器；总算力 500+ TOPS。EEA 架构为低时延 AV 指令 / 控制而设计。
          owner: Proprietary EEA architecture; third-party SoCs
        - id: layer-05
          label: 传感器融合引擎
          detail: 把摄像头、雷达和 IR 数据流做多模态融合，生成统一的环境表征。
          owner: Proprietary + Apollo base layer
        - id: layer-06
          label: 感知 AI（Apollo 核心）
          detail: 对车辆、行人、障碍物做 3D 检测、跟踪和分类。可访问 Baidu Apollo 白盒源码； 是唯一的商用车 OEM 授权方。
          owner: Baidu Apollo (white-box licence) + DeepWay adaptation
        - id: layer-07
          label: 预测模块（Apollo 核心）
          detail: 对周边道路使用者做 5–8 秒轨迹预测；已按重卡动力学校准。
          owner: Baidu Apollo (white-box licence) + DeepWay tuning
        - id: layer-08
          label: 规划模块（自研 + Apollo）
          detail: 结合载荷感知动力学模型做路线和机动规划；在 Apollo 规划核心上叠加自研商用车层。
          owner: Baidu Apollo (base) + DeepWay proprietary
        - id: layer-09
          label: 车辆控制（执行器指令）
          detail: 纵向和横向控制指令；制动线控和转向线控执行硬件来自 Tier-1 供应商。
          owner: Proprietary firmware; third-party actuation hardware
        - id: layer-10
          label: Suixing — L2 主动安全（商业化）
          detail: 自适应巡航、车道保持辅助、防碰撞、疲劳检测。7,500+ 个活跃订阅， 渗透率约 30%。约 RMB 3,000–5,000/车/年。
          owner: Proprietary subscription product
        - id: layer-11
          label: Yanxing — IPTS 编队系统（商业化）
          detail: 2–3 辆卡车用 5G-V2X 领航-跟随协议协同编队。自 2023 年起商业化。
          owner: Proprietary subscription product
        - id: layer-12
          label: Duxing — L4 单车自动驾驶（开发阶段）
          detail: 目标：无人驾驶长途干线。当前状态：持北京和天津 ICV 牌照开展有监督道路测试。没有商业部署或收入。
          owner: Proprietary development programme
        - id: layer-13
          label: Tianshu — 车队 SaaS（商业化）
          detail: 云平台覆盖实时遥测、调度、路线优化、驾驶员行为评分。独立于硬件换新周期。
          owner: Proprietary SaaS product
    approximationNotes: >-
      层级边界是概念性的；实际软件模块可能跨越多个层。公开 HKEX 申报没有披露第三方 SoC 和传感器供应商名称。 申报文件描述了 Apollo 白盒整合深度，但 Apollo 代码与 DeepWay
      自有代码之间的技术边界没有公开量化。
