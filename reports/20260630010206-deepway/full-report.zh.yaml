      - number: '8.3'
        title: 估值方法与倍数分析
        blocks:
          - type: paragraph
            body: >-
              收入倍数是最实用的框架，因为 DeepWay 仍在亏损，且 IPO 的确切股本和发行价在招股书草稿中仍被遮盖。DCF 会制造虚假精确，EBITDA 或盈利倍数也为时过早。因此，最干净的方法是采用分层锚定的混合
              EV / 收入区间。第一层，约 1.5x 至 3x 销售额的硬件底部，反映大部分收入仍由卡车硬件产生、毛利率仅 4.9% 的现实。第二层，约 5x 至 8x 销售额的混合模型中间带，反映 DeepWay
              极快增长、经营现金流转正，以及可信但尚未证明的软件上行。第三层，10x 至 15x
              销售额的软件式上行，只有在天玑订阅开始变得重要、毛利率实质抬升时才合理。最新私募融资轮支持投资人看到上行可选性的判断，但公开证据仍无法解决 Pre-IPO 估值条款的确切问题。
