      - number: '8.2'
        title: 市场背景与增长可及性
        blocks:
          - type: paragraph
            body: >-
              即便 DeepWay 尚未证明软件变现，市场背景也足够大，能支撑一个有意义的估值区间。Mordor 估计，中国公路货运市场 2025 年为 $472.77 billion，2031 年将达 $668.55
              billion；ARK 则把自动驾驶交通描绘为到 2030 年的全球万亿美元级机会。这些数字并不意味着 DeepWay 今天就配得上软件倍数，但解释了为什么投资人仍积极给公司融资。按份额看，DeepWay
              仍处早期：申报文件显示其在中国 2025 年 NEV 重卡市场排名第九，距离任何品类领导地位主张仍有很长跑道。竞争背景也很重要。中国正在成为辅助驾驶卡车的重要商业化场地，Inceptio 和 KargoBot
              等竞争对手也分别围绕商业里程、走廊经济性和 OEM 覆盖构建自己的估值故事。因此，DeepWay 的可及上行取决于把当前卡车规模转化为持久市场份额和软件附着，而不是只靠 TAM。
