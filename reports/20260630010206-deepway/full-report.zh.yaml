  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              DeepWay 不应被当成泛自动驾驶公司来分析。宽泛 AV 类别混在一起的是乘用车、robotaxi、消费级 ADAS
              和软件栈，买方、预算和落地规则都与重载货运差异很大。最有助于投资判断的边界，应从中国公路货运开始，因为车队、托运人和物流运营商真正花钱买的是牵引车、运营效率和货运服务。在这个市场内部，DeepWay
              的现实切入点是新能源重卡替代：正在把柴油资产换成电动牵引车的车队，可以在不改变核心采购流程的情况下，叠加智能驾驶舱硬件、辅助驾驶订阅，并最终接入更高阶自动驾驶货运服务。被排除的支出同样重要。乘用
              AV、仓储机器人、纯路径规划软件、铁路或海运货运、通用 EV 充电基础设施都能贴上物流或自动驾驶叙事，但并不直接对应 DeepWay 正在解决的买方任务。

              因此，现状替代集合很具体：人工驾驶柴油重卡、仍由人工驾驶的传统电动卡车，以及长途干线上高度依赖司机的接力网络。IDTechEx 汇总的行业报道指出，传统上 1,000
              公里以内线路需要两名司机，更长的接力结构可能涉及四到六名司机。因此，劳动力、安全和利用率是采购逻辑的核心，而不是边缘功能。DeepWay
              自身定位和递表披露也支撑这种分阶段框架：先卖车，再变现辅助驾驶；只有当走廊许可和运营信心足够后，才尝试吃到货运服务经济性的一部分。
            claimRefs:
