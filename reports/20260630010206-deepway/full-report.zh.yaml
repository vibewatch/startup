      - number: '5.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 独家 Apollo 白盒许可形成可防守的 AV 护城河
            body: >-
              DeepWay 是唯一拥有 Baidu Apollo 白盒（源代码级）访问权限的商用车公司，因此能接入中国最成熟、经过生产检验的 AV 软件栈之一。不同于其他伙伴使用的 API
              级集成，白盒访问支持深度定制、商用车专用调校，以及扩展或修改核心感知和规划流水线。再叠加正向开发底盘，这种集成意味着硬件和软件从一开始协同设计——这是柴油车改造型竞争对手不做完整整车重构就无法复制的结构性优势。
            calloutType: strength
            claimRefs:
              - CE011
              - CE019
          - type: callout
            title: L4 商业时间表不透明，且依赖 Apollo
            body: >-
              Tianji Duxing L4 项目没有披露商业部署时间表。DeepWay 的 Phase 3 自动驾驶货运即服务愿景依赖 L4 商业化，但 HKEX 递表没有给出 Duxing
              商业上线的目标日期或中期里程碑。此外，白盒 Apollo 许可造成单一供应商依赖：Baidu 许可政策一旦变化，公司就必须从头替换核心 AV 软件栈，构成重大执行风险。考虑到 Baidu 仍是 13.48%
              股东，这一风险有所缓和，但在已披露条款中并未被完全合同化对冲。
