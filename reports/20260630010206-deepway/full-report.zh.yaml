      - number: '8.4'
        title: 情景分析与 IPO 定价背景
        blocks:
          - type: paragraph
            body: >-
              情景分析比单一目标值更有信息量，因为 DeepWay 未来 12 至 24 个月可能把公司推向很不同的同业集合。牛市情景下，软件收入变得可见，毛利率升至 15% 以上，走廊或编队经济性创造类似服务的收入流，支撑
              $6 billion 至 $8 billion 区间。基准情景下，DeepWay 继续高速增长，但主体仍是卡车 + ADAS 业务，可支撑 $3 billion 至 $4.5 billion 区间，类似对
              Pony.ai 或 WeRide 估值逻辑打折。熊市情景下，硬件毛利仍薄、既有 OEM 压低价格、公开市场对中国自动驾驶公司的怀疑加剧，公司会被拉向 $0.8 billion 至 $1.8 billion
              区间。TuSimple 是最关键的反向先例，因为它证明，自动驾驶卡车股票故事上市后若在治理、监管或商业化上令人失望，估值可以多快崩塌。
