  - id: FR001
    title: 风险严重性评估矩阵
    type: matrix
    layout: standard
    summary: 截至 2026 年 6 月，这张跨主题风险评估覆盖 DeepWay 的十二个关键风险维度， 评估发生可能性、潜在影响、缓释成熟度和剩余敞口。监管和伙伴依赖风险占据高严重性象限。
    data:
      columns:
        - label: 可能性（高 / 中 / 低）
        - label: 发生后的影响
        - label: 缓释成熟度
        - label: 剩余敞口
      rows:
        - label: 中国 L4 五城商业化上限
          values:
            - 高
            - 高 — 将自动驾驶收入限制在试点走廊
            - 低 — 无法单方面解决
            - 2027 年 7 月前，五城之外的 L4 收入基本受阻
        - label: 2027 年 7 月强制 L3/L4 国家标准
          values:
            - 高（日期已定）
            - 高 — 认证成本和延误风险
            - 中 — L4 研发正在推进
            - 认证失败或延误会阻断商业化扩张
        - label: CATL 单一电池供应商依赖
          values:
            - 中
            - 高 — 没有替代供应商；成本绑定 CATL 定价
            - 低 — 未披露替代供应商
            - 若 CATL 定价或供应可得性变化，利润率会被全面压缩
        - label: Baidu Apollo ADS 授权排他性
          values:
            - 中
            - 极高 — L4 路线图依赖 Baidu Apollo
            - 低 — 未披露 IP 托管或替代技术栈
            - Baidu 战略退出会同时抽走技术伙伴和股东锚
        - label: JAC Motors 制造集中度
          values:
            - 中
            - 高 — 没有 JAC 就无法履行 1,400 辆积压订单
            - 低 — 没有备用 OEM 制造伙伴
            - 停产会推迟积压订单交付，并损害客户关系
        - label: L2 到 L4 技术缺口
          values:
            - 高（确定）
            - 高 — L4 带来的收入抬升可能还要 3-5 年
            - 中 — L2 车队正在积累公里数据
            - 自动驾驶货运机器人叙事尚未验证；保险和监管缺口未解
        - label: Inceptio 自动驾驶公里数据领先
          values:
            - 高（当前现实）
            - 中高 — 数据规模优势可能转化为 L4 能力差距
            - 低 — DeepWay 无法加速 Inceptio 这个竞争对手的数据积累
            - Inceptio 400M km 对 DeepWay 100M km，代表 4× 数据劣势
        - label: KargoBot L4 商业运营
          values:
            - 高（35M L4 km 正在运营）
            - 中 — KargoBot 在同一港口物流细分市场竞争
            - 低 — DeepWay 有规模（12,000 辆卡车，对比试点车队）
            - KargoBot 的 L4 领先可能赢下下一层港口物流合同
        - label: 净亏损 RMB 649M，且资本需求双重
          values:
            - 高（持续亏损）
            - 高 — 若 IPO 延迟或认购不足，存在资本耗尽风险
            - 中 — IPO 前已融资 $310M+；HKEX IPO 正在推进
            - 没有 IPO 或后续资本，跑道可能不足以支撑完整 L4 爬坡
        - label: IPO 时点风险 — Chapter 18C 上市
          values:
            - 中
            - 高 — IPO 延迟会拉长亏损期，并可能需要稀释性融资
            - 中 — 已聘请 CICC 和 CMB International 担任保荐人
            - AV 公司 IPO 市场环境不确定；投资者对亏损型 AV 公司的兴趣偏弱
        - label: 中国数据隐私和网络安全法律
          values:
            - 高（法律已生效）
            - 中 — 海外部署面临跨境数据传输限制
            - 中 — 国内数据中心基础设施已就位
            - 海外部署合规可能需要大量法律和基础设施成本
        - label: 西方市场对中国 AV 的地缘政治审查
          values:
            - 中（趋势增强）
            - 高 — NZ、AU、EU 可能出现运营禁令或强制审计
            - 低 — 未披露面向西方市场的政府事务策略
            - 被迫退出海外市场会损害投资者叙事和国际收入
    approximationNotes: 可能性和影响评级，是基于监管文件、独立分析师评论和公司披露做出的定性分析师判断。 未使用定量概率模型。评级代表截至 2026 年 6 月 30 日，分析师相对于投资论点对严重性的判断。
    claimRefs:
      - CR001
      - CR002
      - CR034
      - CR035
      - CR014
      - CR013
      - CR027
      - CR016
      - CR023
      - CR026
      - CR003
      - CR010
  - id: FV001
    title: 推荐逻辑流程
    type: flow
    layout: wide
    summary: 价格敏感型推荐逻辑从规模验证出发，依次穿过收入质量、资产负债表风险，最后落到入场纪律。
    data:
      nodes:
        - id: n1
          label: 收入规模已验证
          detail: FY2025 收入和交付显示真实商业化
        - id: n2
          label: 硬件占比过重
          detail: 99.2% 的收入仍来自卡车硬件
        - id: n3
          label: 利润率仍薄
          detail: 即便已有改善，毛利率也只有 4.9%
        - id: n4
          label: 软件上行空间存在
          detail: 如果采用率扩大，Tianji 可以贡献更高利润率的经常性收入
        - id: n5
          label: 资产负债表压顶
          detail: 净负债和 IPO 前工具仍压制上行信心
        - id: n6
          label: 除非价格守纪律，否则跟踪
          detail: 最好的公开立场是：基准区间内合理，高于区间偏贵，低于区间有吸引力
    claimRefs:
