      - number: '2.3'
        title: 买方分层与采用经济性
        blocks:
          - type: paragraph
            body: >-
              DeepWay
              的买方图谱是多阶段的，因为产品本质上是一套栈：智能新能源牵引车、付费辅助驾驶层，以及未来自动驾驶货运服务。第一阶段，直接买方通常是做车辆资本开支决策的车队所有者、租赁公司或运输运营商。使用者由司机、调度员和安全
              / 运营经理共同组成；付款方往往是车队 P&L 负责人或 CFO 角色，他们评估
              TCO、融资、利用率和残值。第二阶段，预算逻辑转向运营费用：车队已经买了牵引车，现在要判断辅助驾驶订阅、能耗优化或远程运营工具，能否通过节省人力、降低能耗、减少事故或提升资产利用率回本。DeepWay 披露的
              7,500+ L2 激活车辆、30%+ 订阅率和 200M+ 累计里程，说明公司已越过纯概念阶段，进入早期订阅转化阶段；但公开材料没有披露单车单位经济性。

              分细分市场看，最可能的早期采用者是高频干线承运商、合同物流运营商、工业自有车队，以及能够标准化线路和维护的 OEM
              或经销商绑定车队生态。采用路径也比“把卡车卖给所有人”的故事更窄。车队通常先在线路受限的场景做电动化，在可预测干线上安装或激活辅助驾驶功能；等监管、保险和组织信任允许后，再试验更高阶自动驾驶货运运营。这一顺序会影响市场规模判断：最终货运服务上行空间可能很大，但初期预算归属和采用意愿仍由熟悉的车队资本开支和
              TCO 逻辑支配，而不是投机性软件倍数。
