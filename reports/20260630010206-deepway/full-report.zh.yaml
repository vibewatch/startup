            body: >-
              DeepWay 自身画像不寻常，因为它不只是自动驾驶软件厂商。公司称其正向开发完整电动重卡，并从底盘向上嵌入辅助驾驶，这支撑了低风阻、较低的增量 L2 BOM
              成本，以及同时通过整车销售和订阅变现的路径。按递表期披露的规模，7,500+ L2 激活车辆、30%+ 订阅挂载、200M+ 公里和 CNY 1.5 billion 2025
              年上半年收入，显示出有意义的客户采用，但尚未盈利。Inceptio 是最强的中国同类基准：它结合了 4,000+ L2+ / L3 卡车、超过 400M 公里自动驾驶里程、大型 OEM
              集成，以及围绕安全和节油的公开商业化叙事。KargoBot 是最集中的 L4 挑战者，项目更窄但走廊导向更先进，并声称在 Ordos 跑出正向单位经济性。Pony.ai
              从更宽的自动驾驶业务带来资产负债表和资本市场实力；Plus.ai、Aurora、Kodiak 和 Einride 则展示全球同业如何靠 OEM 和承运商合作，在不自建完整卡车平台的情况下打入生产走廊。
