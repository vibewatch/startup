  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与国家安全风险
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的核心商业命题，取决于中国是否授予广泛的 L4 卡车商业部署授权。截至 2026 年 6 月，该授权仅限五个试点城市——上海、广州、深圳、重庆和杭州——这些城市自 2025 年 8
              月起有条件允许取消安全员。上述走廊之外，商业 L4 货运运营尚未获准。强制性全国 L3/L4 标准计划于 2027 年 7
              月生效，将在中国范围内统一安全测试、认证和部署审批要求。不符合这些标准，将阻止公司在任何地理市场开展商业运营。过渡期同时带来时间风险（若认证比预期更久）和成本风险（为满足国家标准而进行必要系统升级）。中国数据隐私和网络安全法律——《个人信息保护法》（PIPL）、《数据安全法》（DSL）和《网络安全法》——对跨境数据传输施加严格要求，自动驾驶车辆传感器和车联网数据被归类为具有潜在国家重要性的数据。这些法律要求部分数据在境内存储，出境前接受安全评估，并且只能由持牌实体处理。海外部署还要满足所在国监管机构自己的审批要求。2026
              年 6 月通过的联合国自动驾驶系统全球技术法规，引入了新的国际合规标准；DeepWay 若要在受监管市场部署车队，必须满足这些标准。

              国际部署面临叠加风险：中国自动驾驶技术嵌入在西方运输走廊运营的商用卡车，已经引发地缘政治审查。Carnegie Endowment 2025 年 11
              月指出，中国自动驾驶车辆平台进入伙伴国供应链，会让东道国政府担忧数据主权和基础设施脆弱性。美国和欧盟已开始把筛查机制延伸到运营实体交通基础设施的中国科技公司。即便 DeepWay
              获得所在国运营批准，批准后的限制或强制审计也可能实质压缩海外收入模型。中国尚未标准化 L4 商业卡车保险框架，自动驾驶车队运营商的风险转移机制仍未解决。
