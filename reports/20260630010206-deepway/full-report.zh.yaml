      - number: '4.4'
        title: 同业语境与财务结论
        blocks:
          - type: paragraph
            body: >-
              同业比较同时凸显 DeepWay 的优势和局限。DeepWay 2025 年 RMB 3.96 billion 收入远高于 Aurora、WeRide 或 Pony.ai 披露的 2025
              年公开收入，但不能把这种差距误读为自动驾驶经济性更优，因为 DeepWay 正在大规模确认完整卡车硬件收入，而这些同业报告的收入结构仍更多来自软件、服务或更早期商业组合。DeepWay 4.9% 的毛利率仍远低于
              WeRide 的 30.2%，还不像软件经济性。收入、交付、在手订单和累计 L2 里程都能印证公开牵引力，但关键承销输入仍未公开，包括订阅
              ARPU、实际折扣、质保成本、应收账款账龄、销售周期、CAC、回本期和合同续费。外部评论也保持怀疑：Electrek 提到，尽管 DeepWay 全球累计交付超过 12,000
              辆电动半挂车，公司仍未盈利。因此，财务结论是混合的：DeepWay 已经取得真实制造和商业规模，但公开证据仍支持的是 EV 硬件加 ADAS
              故事，毛利率改善但偏薄，资本强度有意义，并且在承销长期利润率路径前仍有多个数据缺口未解。
