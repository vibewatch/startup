      - number: '1.2'
        title: 领导层、治理与股东
        blocks:
          - type: paragraph
            body: >
              DeepWay 由 Wan Jun 联合创立，Wan Jun 现任董事长兼 CEO。他还创办了 Lionbridge Financial Leasing Group；这家卡车物流公司与 Baidu 共同设立了
              DeepWay。CTO 是 Tian Shan，他曾在 Baidu 智能驾驶部门负责自动驾驶商用车研究，把 Baidu Apollo 平台与 DeepWay Tianji 智能套件之间的技术连续性接了起来。截至
              2025 年 12 月 31 日，公司全职能员工 1,308 人，其中研发 412 人，占 31.5%。

              股东结构带着合资公司出身的印记。Wan Jun 体系（包括 Lionbridge 实体）合计持有约 20.44% 已发行股份。按 HKEX 申请版本，Baidu 仍持股 13.48%。Series
              A（Qiming Venture Partners 领投）、Series A+（Shandong Weiqiao Pioneering Group 和 SoftBank China Venture Capital
              领投）以及 Series B（Zhongan Capital 与 Puhua Capital 共同领投）的财务投资者均持有重要股份。Pre-IPO 轮投资者包括 PuHua Capital（领投 Round
              1，$163M）、Stone UAE 和 NGS Super Australia。

              HKEX 文件和财务报表由一家 Big Four 审计机构审计。截至 2026 年 6 月，已审阅材料没有公开点名 CFO 或独立董事。Wan Jun（外部关系、战略）和 Tian
              Shan（全栈技术架构）身上的关键人风险都偏高。Baidu 的白盒 Apollo IP 许可构成战略依赖；如果 Baidu 持股跌破某个许可门槛，治理可能受到影响。
