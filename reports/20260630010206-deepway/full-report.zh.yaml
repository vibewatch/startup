  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入规模、结构与质量
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的收入爬坡真实存在，而且对一家自动驾驶卡车公司来说异常快；但收入构成比标题规模更重要。HKEX 递表显示，公司直到 2023 年 6 月 Xingchen I 首批交付才开始产生收入，随后从
              2023 年 RMB 425.6 million 增至 2024 年 RMB 2.0 billion，再到 2025 年 RMB 4.0 billion。这一增长几乎全部来自整车硬件销售：卡车硬件占 2023
              年收入的 99.9%，到 2025 年仍占 99.2%；软件及其他收入在 2025 年仅为销售额的 0.8%。交付量从 2023 年 509 辆扩至 2025 年 8,020
              辆，但同期估算的单车混合收入大幅下滑，说明规模可能是靠更低 ASP 组合、更丰富产品梯队、定价压力，或三者共同换来的。递表支撑了公司在销量和收入上的强劲公开牵引力，包括递表日 516 辆在手订单，以及 2025
              年中国新能源重卡市场第九名；但它没有披露实际订阅 ARPU、合同折扣或标价到净价桥，投资者无法有把握地区分硬件 ASP、软件转化率和渠道影响。
