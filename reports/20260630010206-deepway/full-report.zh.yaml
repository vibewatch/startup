      - number: '7.4'
        title: 伙伴依赖、人员风险与缓释
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的商业模型建立在三项高度集中的伙伴依赖之上：CATL 提供电池，Baidu Apollo 提供 ADS 软件栈，JAC 负责整车制造。CATL 电池关系嵌入最深：CATL 于 2024 年 10
              月联合交付鑫诚辉换电车队，并伴随 DeepWay 部署建设充换电基础设施。这带来相互切换成本，但也把关键部件集中到单一供应商手中；该供应商的战略优先级（包括 CATL 自有 EV 卡车品牌
              Zeron）未必会长期与 DeepWay 对齐。Baidu Apollo 提供自动驾驶感知与规划栈；独家授权关系支撑 DeepWay 的 L4 开发路线图。Baidu
              若发生战略重组——包括退出、减少投入，或在自动货运领域重新定位竞争——会同时拿走 DeepWay 的主要技术伙伴和关键营销可信度锚点。人员风险上，CEO
              万钧是狮桥（物流租赁母公司）联合创始人，也是主要商业关系架构师；CTO 田山是 13 年 Baidu 老兵，是 ADS 开发团队的技术锚。任一高管离开都会造成实质连续性缺口。部分缓释因素包括：扩大自动驾驶 km
              数据飞轮、分散国际客户基础以降低中国单一市场集中度、扩充服务中心网络（400+ 中心已运营），以及推进 HKEX IPO，建立上市主体，改善公开市场问责和资本可得性。2025 年上半年 Ordos L4
              试点观察到的单位经济突破（据报在该规模下为正）如果能在全国复制，可能成为拐点指标。投资命题的击穿条件包括：2027 年 7 月标准之后无法取得全国 L4 商业部署授权、Baidu Apollo
              伙伴关系退出，或无法通过 L4 爬坡期维持 IPO 融资跑道。
