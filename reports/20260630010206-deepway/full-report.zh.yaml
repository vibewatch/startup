      - number: '4.3'
        title: 现金流、资产负债表与资本依赖
        blocks:
          - type: paragraph
            body: >-
              2025 年现金流量表大幅改善，但资产负债表仍需要谨慎归一化。经营现金流从 2023 年 RMB -714.6 million、2024 年 RMB -429.6 million 转为 2025 年 RMB
              835.2 million；融资流入达到 RMB 1.63 billion，年末现金增至 RMB 1.61 billion。与此同时，投资现金流出扩大至 RMB 1.16 billion，应收贸易及其他款项从
              2023 年 RMB 321.2 million 增至 2025 年 RMB 1.58 billion；由于 Pre-IPO 金融负债以公允价值计入损益，净负债恶化至 RMB -1.90 billion。仅这些
              FVTPL 负债在 2025 年末就达到 RMB 2.96 billion。管理层还直白表示，预计 2026 年将继续产生净亏损。公开资本支持仍然可观：Baidu 仍持股 13.48%，Pre-IPO 首次交割为
              US$173 million；在此前 Series A+ 和 Series B 融资后，扩大的 Pre-IPO 轮又把披露融资推高至 US$310 million 以上。不过，申请版本仍对 IPO
              募资用途明细做了遮盖，公开市场投资者仍无法承销运营、技术投入、海外扩张、营运资金和其他义务之间的准确分配。
