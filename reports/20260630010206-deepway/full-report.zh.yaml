  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              DeepWay 并不处在一个狭窄同业集合里竞争。对货运买方和车队运营商来说，现实替代方案横跨七类：中国高速自动驾驶卡车直接同业、全球自动驾驶卡车技术栈厂商、电动化货运编排者、向新能源车辆转型的传统卡车 OEM
              和车队、人工驾驶现状、内部自研或混合栈部署，以及来自更大自动驾驶或 OEM 生态的潜在进入者。在中国，最直接的同业是 Inceptio 和
              KargoBot，因为两者都在国内走廊上商业化重卡自动驾驶，并向车队销售具体的运营改善故事。Pony.ai 更偏相邻，但相关性上升，因为它已把 robotruck 收入、SANY
              卡车制造关系和双重上市资本带入货运板块。Plus.ai、Aurora、Kodiak 和 Einride 今天作为国内即时替代品的重要性较低，更像战略参照：它们展示了顶级 OEM
              合作、无人驾驶安全叙事和货运网络编排可以长成什么样。现状仍然强大：辅助驾驶卡车、传统车队运营和人工司机仍是默认采购路径，大型车队也可以在 OEM、车联网和自动驾驶模块之间多供应商并行，而不是押注单一全栈厂商。
