      - number: '5.3'
        title: IP 组合、研发投入与技术路线图
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 12 月 31 日，DeepWay 拥有 195 项专利、265 件商标和 108 项软件著作权，这是不到五年运营中搭出的组合。专利覆盖车辆硬件（底盘设计、Three-Electric
              组件、传感器安装系统）、软件（感知算法、EEA 固件）以及系统级创新（编队协同协议、车队优化模型）。研发投入的绝对值大幅增长，从 2023 年 RMB 219M 增至 2025 年 RMB
              387M；随着收入规模扩大，研发占收入比下降（2023 年 51.5%，2025 年 9.8%）。412 名研发员工（总员工 1,308 人）占员工总数
              31.5%，对一家大规模交付实体硬件的公司来说，这一比例明显偏高。

              技术路线图沿着 HKEX 递表披露的三阶段商业化轨迹推进：第一阶段（当前）——整车销售并挂载 Tianji 订阅；第二阶段——扩展 IPTS 编队网络，形成自动驾驶货运走廊；第三阶段——过渡到完整 L4
              自动驾驶货运网络，由 DeepWay 以服务方式运营卡车。第三阶段可信度受 Duxing 当前仅处开发状态的约束：公司尚未宣布商业 L4 部署，HKEX 递表也没有披露商业 L4 运营目标时间表。Apollo
              平台的开源属性同时带来优势和依赖风险：它有已验证代码库和活跃生态，但如果 Baidu 改变白盒 Apollo 访问的许可条款，DeepWay 将需要替换核心 AV
              软件栈，这会吃掉大量研发并可能拖慢商业路线图。国内同业（尤其 HAOMO、Hesai，以及与 SAIC、FAW 合作的平台集成商）在 L2 ADAS 细分的竞争侵蚀，是订阅收入增长更近端的风险。
