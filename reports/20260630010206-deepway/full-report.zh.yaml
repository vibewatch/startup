            - HKEX Chapter 18C 申报（2025–2026）
            - 未宣布 IPO
            - 未宣布 IPO
            - SPAC 或私有（Zeron 2024 年私有）
        - label: 数据飞轮优势
          values:
            - 约 100M km；6,400+ 辆联网卡车产生真实世界数据
            - 35M L4 km；每公里自动驾驶含量最高
            - '>400M km；按规模看数据护城河最强'
            - 公开数据不足，无法比较
    approximationNotes: >-
      竞争对手指标来自 IDTechEx 分析师报告、The Driven 和 Jiemian Global。KargoBot 和 Inceptio 的财务数据未公开披露。 DeepWay 指标来自 CNEVPost 转引的 HKEX
      招股书。由于竞争对手数据不可得，收入和盈利能力比较是单边的。
    claimRefs:
      - CU030
      - CU031
      - CU032
      - CU035
