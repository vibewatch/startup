      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              最清晰的自上而下市场锚点并不是自动驾驶软件，而是中国公路货运。Mordor Intelligence 估算，中国公路货运市场 2026 年为 $500.9 billion，到 2031 年将以 5.95%
              CAGR 增至 $668.55 billion；这给所有卡车 OEM、车队软件提供商和自动驾驶运营商提供了必须争夺份额的庞大支出底座。第二个视角是中国广义自动驾驶汽车市场：GII Research 经 Yahoo
              Finance 发布的预测显示，该市场将从 2025 年 $22.84 billion 增至 2034 年 $218.95 billion，CAGR 为 28.55%。这个数字能证明自动化投资速度很快，但对
              DeepWay 的相关性被明显高估，因为它包含乘用车和非货运类别。第三个更贴近运营的视角是新能源重卡市场。36Kr 相关行业报道称，2025 年中国新能源重卡销量 231,100 辆，同比增长 182%，渗透率
              28.89%，并预期 2026 年约 35%、2030 年超过 50%。这个电动化装机底座很关键，因为自动驾驶功能要附着在硬件上。

              第四个视角专门针对货运自动驾驶，也激进得多。EqualOcean 援引一家北京智库，将 2030 年中国重卡保有量框定为 627 万辆，并给出 8,539 亿元自动驾驶卡车收入潜力。ARK Invest
              给出更宽的全球天花板，预测 2030 年自动驾驶公路卡车配送收入为 $320 billion。这些是有用的方向性信号，但不能与公路货运支出或整车销售数据直接横比。DeepWay 的实际 SAM
              更窄：重复性走廊货运、新能源卡车替换预算、已激活车队上的辅助驾驶挂载，以及在许可和远程运营模型存在时，最终形成的特定线路自动驾驶服务收入。因此，正确的尽调姿态是同时保留多个视角，而不是把它们压成一个英雄式 TAM
              数字。
