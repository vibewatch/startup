      - number: '1.3'
        title: 融资历史、估值与资本策略
        blocks:
          - type: paragraph
            body: >
              DeepWay 已在五轮披露融资中合计募资约 RMB 3.96B（折合超过 $580M）：Series A（RMB 460M，2021 年 8 月）、Series A+（RMB 770M，2023 年 3
              月）、Series B（RMB 750M，2024 年 12 月）、Pre-IPO Round 1（约 RMB 1.177B，2026 年 1 月）以及 Pre-IPO Round 2（Pre-IPO 总额超过
              $310M，2026 年 4 月交割）。按公司新闻材料，Pre-IPO Round 1 是截至 2026 年前五年全球自动驾驶卡车公司最大的单笔融资。

              申请版本没有明确写出 Pre-IPO 估值；在已审阅公开来源中，也没有官方确认的投后股权估值。公司于 2025 年 11 月 6 日首次递交 HKEX 上市申请（已失效），并于 2026 年 5 月 7
              日重新递表，CICC 和 CMB International 担任联席保荐人。IPO 募资拟用于整车研发、长兴三电智能工厂完工以及海外市场扩张。

              资本效率是担忧点：累计净亏损超过 RMB 1.7B，而 2025 年毛利率只有 4.9%。2025 年研发支出为 RMB 386.6M，占收入
              9.8%；公司要在规模化后盈利，毛利率必须实质提升。一份反向分析指出，$173M 和 $310M 分别指 Round 1 与累计 Pre-IPO 总额——媒体报道常把二者混在一起，可能误导投资者对单轮规模的判断。
