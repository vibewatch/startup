      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自中国物流的结构性低效。China Daily 援引 China Logistics Information Center 报道，2023 年社会物流总费用为 18.2 万亿元，占 GDP 的
              14.4%；Swedish Transport Analysis Agency
              的研究也指出，这一比率仍明显高于发达市场常态。这个差距给任何能降低人力强度、提升资产利用率并减少能源或事故成本的技术，都提供了直接宏观激励。电动化是第二个主要驱动，因为新能源重卡替代已经发生，而不是假设：2025
              年销量和渗透率数据说明车队正在更换牵引车，这给自动驾驶厂商提供了硬件装机基础，而不是要求买方从零资助一个新品类。第三，中国政策环境比许多西方市场更利于商业化：国家智能网联汽车规划、重卡公开道路测试先例和指定示范项目，缩短了从试点到付费运营的路径。

              约束同样重要。资本强度仍高，因为 DeepWay 必须在 L4 收入层被验证之前，同时投入整车项目、软件以及最终更重的运营栈。监管许可仍按走廊发放，而不是全国一揽子批准，所以真实 SAM
              受限于车队能够实际部署高阶自动驾驶货运的地点。信任和责任并不轻：安全员弱化或无人驾驶运营要求车队和托运人在低毛利行业接受新的风险画像。最后，市场规模证据天然矛盾。广义 AV
              报告、新能源卡车销量数据、货运支出研究和自动驾驶情景预测回答的是不同问题。这并不否定机会；它意味着投资者应按分阶段商业化里程碑和线路经济性来承销 DeepWay，而不是按可找到的最大标题预测来下判断。
