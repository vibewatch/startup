      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的客户扩张策略押注「数据飞轮」：装机基盘上的自动驾驶里程越多，算法迭代越快，进而让运营更安全，并最终走向无人化；随着时间推移，这可以支撑更高的单车或每 km 订阅定价。这个逻辑支撑了物流运营商内部
              land-and-expand 的长期故事，但截至 2026 年中，从 L2 ADAS 真实追加销售到未来 L4 自动货运机器人服务，商业证据仍完全停留在理论层面。

              集中度风险很重。客户基础由单一垂直领域（大宗 / 港口货运）的中国物流运营商主导。前两大车队客户（鸭嘴兽 200 台、鑫诚辉 100 台）合计约 300
              台已确认在中国投产部署，占已命名中国客户证据中的大头。国际客户仍处于早期商业化或试点阶段；Foodstuffs NZ 是一台真实运营车辆，澳大利亚订单尚未公开量化。没有客户公开披露过初始合同之外的车队扩张订单。

              从反向视角看，robotics.press 在一份竞争情报报告中指出，DeepWay 自报运营指标是自认证而非经审计，且 $310M Pre-IPO 轮金额与此前跟踪数据冲突（首笔款项人民币 11.77 亿元 ≈
              $173M，而部分数据库跟踪的累计金额为 $282–354M）。该报告认为，从 6,400 台 L2-ADAS 卡车到商业可行的 L4
              部署之间，仍有监管、保险和技术验证挑战未解决。截至研究日期，公开来源中尚未发现独立客户结果研究（G2、Gartner Peer Insights、学术第三方审计）来佐证 DeepWay 的 TCO 主张。
