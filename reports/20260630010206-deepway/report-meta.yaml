companyProfile:
  summary: DeepWay is a Chinese smart heavy-duty truck company incorporated in July 2020 as a Baidu and Lionbridge joint venture. It designs purpose-built new-energy tractors such as the Xingchen and Xingtu platforms, layers the Tianji intelligence suite across ADAS, platooning, fleet management, and future L4 autonomy, and monetizes through truck sales today with software subscription and autonomous-freight-network ambitions over time. Following rapid scale-up to 8,020 deliveries and RMB 3.96 billion of revenue in 2025, DeepWay remains private but is pursuing a Hong Kong IPO after refiling in May 2026.
  foundedDate: "2020-07-01"
  founders:
    - name: Wan Jun
      role: Chairman, CEO, and co-founder
      background: Founder of Lionbridge Financial Leasing Group and the principal operator behind DeepWay's logistics and financing ecosystem.
      claimRefs: [CO003]
  foundingLocation: Beijing, China
  headquarters: Hefei, Anhui, China
  productSummary: Xingchen and Xingtu electric heavy-duty tractors plus the Tianji suite, including Suixing ADAS subscriptions, Yanxing platooning, Duxing L4 autonomy-in-development, and Tianshu fleet-management software.
  customerFocus: Chinese port logistics, express delivery, bulk-freight operators, and selected overseas fleets via distributor and partner channels.
  businessModel: Hardware-led truck sales today, followed by ADAS/software subscriptions and a longer-term autonomous freight-network service model.
  stage: late-stage private / pre-IPO
  fundingStatus: Approximately RMB 3.96 billion raised across Series A, A+, B, and two pre-IPO tranches; cumulative disclosed pre-IPO funding exceeded $310 million by April 2026.
