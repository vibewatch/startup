    - QM002
  - id: CM003
    statement: Broad autonomous-vehicle market categories are analytically misleading for DeepWay because they mix passenger and non-freight use cases whose buyers, regulations, and spending logic do not map to heavy-duty logistics.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM013
    - SM015
    - SM025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
    - QM008
    - QM009
