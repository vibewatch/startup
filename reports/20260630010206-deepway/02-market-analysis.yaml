company:
  name: DeepWay
chapter:
  number: 2
  title: Market Analysis
  summary: 'DeepWay participates in a layered market rather than one monolithic “autonomous vehicles” category: the useful denominator is China road freight, the practical adoption wedge is new energy heavy-duty trucks, and the monetizable autonomy upside sits on repeat trunk corridors where regulation and ROI allow software-led services. The strongest outside evidence points to a very large freight base market ($500.9 billion in 2026 China road freight spend), unusually fast electrification (231,100 new-energy heavy-duty trucks sold in 2025, 28.89% penetration), and credible but non-comparable autonomy forecasts ranging from vehicle- market lenses to 853.9 billion yuan freight-autonomy scenarios, which is why DeepWay’s real SAM must be treated as a subset of corridor-ready fleet demand rather than a headline AV TAM.'
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Alternatives
  body: >-
    DeepWay should not be analyzed as a generic autonomous-vehicle company, because the broad AV category mixes passenger cars, robotaxis, consumer ADAS, and software stacks whose buyers, budgets, and rollout rules differ materially from heavy-duty freight. The most decision-useful boundary starts with China road freight because that is the spend pool into which fleets, shippers, and logistics operators actually buy tractors, operating efficiency, and freight services. Inside that market, DeepWay’s practical wedge is the new-energy heavy-duty truck transition: fleets already replacing diesel assets with battery-electric tractors can add smart-cab hardware, assisted-driving subscriptions, and eventually higher-autonomy freight services without changing the core procurement workflow. The excluded spend is just as important. Passenger AV, warehouse robots, pure routing software, rail or ocean freight, and generic EV charging infrastructure all touch logistics or autonomy narratives but do not
    directly express the buyer job DeepWay is solving.

    The status quo substitute set is therefore concrete: diesel heavy-duty trucks with human drivers, conventional electric trucks still operated manually, and labor-heavy relay networks on long-haul corridors. Industry reporting summarized by IDTechEx notes that sub-1,000 km routes traditionally require two drivers while longer relay structures can involve four to six drivers, making labor, safety, and utilization central to purchase logic rather than peripheral features. DeepWay’s own positioning and filing disclosures support this phased framing: sell the truck first, monetize assisted driving second, and only then try to capture a share of freight service economics once corridor permissions and operational confidence are sufficient.
