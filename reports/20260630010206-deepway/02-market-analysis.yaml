- id: market-sizing
  title: Market Sizing and Growth Trajectory
  body: >-
    The clearest top-down market anchor is not autonomous software at all but China road freight transport. Mordor Intelligence estimates the China road freight transport market at $500.9 billion in 2026, growing to $668.55 billion by 2031 at a 5.95% CAGR, which establishes the enormous spend base from which any truck OEM, fleet software provider, or autonomy operator must win share. A second lens is China’s broad autonomous-vehicles market: GII Research, distributed through Yahoo Finance, projects $22.84 billion in 2025 growing to $218.95 billion by 2034 at a 28.55% CAGR. That figure confirms the speed of automation investment but materially overstates what is relevant to DeepWay because it includes passenger-car and non-freight categories. A more operationally relevant third lens is the new-energy heavy-duty truck market. Industry coverage tied to 36Kr reports 231,100 China new-energy heavy-duty truck sales in 2025, up 182% year over year, with 28.89% penetration and expectations for roughly
    35% in 2026 and above 50% by 2030. That electrified installed base matters because it creates the hardware substrate on which autonomy features can attach.

    The fourth lens is freight-autonomy-specific and much more aggressive. EqualOcean, citing a Beijing think tank, frames a 2030 China heavy-duty fleet of 6.27 million vehicles and 853.9 billion yuan in autonomous truck revenue potential. ARK Invest offers an even broader global ceiling, projecting $320 billion of autonomous over-the-road truck delivery revenue by 2030. These are useful directional signals, but they are not apples-to-apples with road freight spend or vehicle-sales data. DeepWay’s actual SAM is narrower: repeated corridor freight, new-energy truck replacement budgets, assisted-driving attach on activated fleets, and eventually route-specific autonomous service revenue where permits and remote-operations models exist. The correct diligence posture is therefore to preserve multiple lenses simultaneously and resist collapsing them into one heroic TAM number.
