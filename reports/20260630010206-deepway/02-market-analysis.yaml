  - id: CM005
    statement: China's total logistics costs reached 18.2 trillion yuan in 2023, equivalent to 14.4% of GDP, leaving a materially larger efficiency gap than developed markets and strengthening the macro ROI case for freight automation.
    type: third-party-reported
    topic: growth-driver
    sourceRefs:
