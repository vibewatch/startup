  claims:
  - id: CM001
    statement: DeepWay's relevant market boundary is the intersection of China road freight, new-energy heavy-duty truck replacement, and commercial freight autonomy rather than the full autonomous-vehicles category.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM001
    - SM011
    - SM015
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM001
    - QM008
  - id: CM002
    statement: The primary status-quo substitutes for DeepWay are diesel heavy-duty trucks with human drivers, manually operated electric heavy-duty trucks, and labor-intensive relay networks rather than passenger AV products or generic logistics software.
    type: inferred
    topic: substitutes
    sourceRefs:
    - SM005
    - SM006
    - SM015
    confidence: medium
    freshness: current
    answersQuestionRefs:
