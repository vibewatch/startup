artifact: financials
slug: deepway
runDate: "2026-06-30"
company:
  name: DeepWay
chapter:
  number: 4
  title: Financials
  summary: >-
    DeepWay scaled reported revenue from RMB 425.6 million in 2023 to RMB 3.96 billion in 2025,
    but 99%+ of sales still came from truck hardware and gross margin only reached 4.9% in 2025.
    Operating cash flow turned positive in 2025 and year-end cash reached RMB 1.61 billion, yet the
    filing still shows RMB 1.90 billion of net liabilities, large fair-value liabilities from pre-IPO
    instruments, and an explicit expectation of continued net losses in 2026.

sections:
  - id: revenue-scale-mix-and-quality
    title: Revenue Scale, Mix, and Quality
    body: >-
      DeepWay's top-line ramp is real and unusually fast for an autonomous-trucking company, but the
      composition of that revenue matters more than the absolute headline. The HKEX filing shows revenue
      began only in June 2023 with the first batch deliveries of Xingchen I, then climbed from RMB 425.6
      million in 2023 to RMB 2.0 billion in 2024 and RMB 4.0 billion in 2025. That growth came almost
      entirely from complete-truck hardware sales: truck hardware represented 99.9% of 2023 revenue and
      still 99.2% in 2025, while software and other revenue reached only 0.8% of sales in 2025. Delivery
      volume expanded from 509 units in 2023 to 8,020 in 2025, but estimated blended revenue per delivery
      fell materially over the same period, implying that scale has been won through a lower ASP mix,
      a richer product ladder, pricing pressure, or all three. The filing supports strong public traction
      on units and revenue, including a 516-unit backlog at filing date and ninth-place rank in China's
      2025 NEV heavy-duty truck market, but it does not disclose realized subscription ARPU, contract
      discounting, or a list-to-net bridge that would let an investor separate hardware ASP, software
      take-rate, and channel effects with confidence.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI035, CI046, CI048]
    tableRefs: [TI001, TI002, TI003]
  - id: cost-structure-unit-economics-and-concentration
    title: Cost Structure, Unit Economics, and Concentration
    body: >-
      The 2025 income statement shows improvement, but not yet evidence of durable high-quality unit
      economics. Gross profit rose to RMB 194.9 million and gross margin improved to 4.9%, versus only
      0.4% and 0.5% in 2023 and 2024, yet the company still posted a RMB 649.1 million net loss and a
      -16.4% net loss margin. R&D remains a defining cost center: DeepWay spent RMB 386.6 million on R&D
      in 2025, equal to 9.8% of revenue, and the filing says all R&D is expensed as incurred with no
      capitalization. Sales and marketing also scaled with the go-to-market buildout, reaching RMB 223.3
      million and 428 heads in 2025, while estimated S&M spend per delivered truck fell sharply as volume
      ramped. Revenue quality still carries concentration risk. In 2025, the top five customers generated
      39.5% of revenue, the largest customer contributed 12.7%, the largest customer's subsidiary also
      supplied batteries, and the top five suppliers accounted for 79.4% of purchases. Distributor sales
      were only 2.5% of 2025 revenue, which suggests DeepWay still depends primarily on direct sales and
      its 110-plus service-center footprint rather than a broad external channel. The net result is that
      DeepWay looks more like an early-stage EV OEM with assisted-driving monetization optionality than a
      software-first autonomy company with already-proven recurring economics.
    claimRefs: [CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI036, CI037, CI038, CI039, CI054]
    tableRefs: [TI004, TI008, TI009]
  - id: cash-flow-balance-sheet-and-capital-dependency
    title: Cash Flow, Balance Sheet, and Capital Dependency
    body: >-
      The cash-flow statement improved sharply in 2025, but the balance sheet still requires careful
      normalization. Operating cash flow moved from RMB -714.6 million in 2023 and RMB -429.6 million in
      2024 to RMB 835.2 million in 2025, while financing inflow reached RMB 1.63 billion and year-end cash
      rose to RMB 1.61 billion. At the same time, investing cash outflow expanded to RMB 1.16 billion,
      trade and other receivables climbed from RMB 321.2 million in 2023 to RMB 1.58 billion in 2025,
      and net liabilities worsened to RMB -1.90 billion because of pre-IPO financial liabilities measured
      at fair value through profit or loss. Those FVTPL liabilities alone were RMB 2.96 billion at the end
      of 2025. Management also states plainly that it expects to continue incurring net losses in 2026.
      Public capital support remains substantial: Baidu still held 13.48%, the initial pre-IPO close was
      US$173 million, and the expanded pre-IPO round took disclosed financing above US$310 million after
      earlier Series A+ and Series B raises. However, the draft application proof leaves the line-item use
      of IPO proceeds redacted, so public investors still cannot underwrite the exact split between
      operations, technology investment, overseas expansion, working capital, and other obligations.
    claimRefs: [CI026, CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI034, CI040, CI041, CI042, CI043, CI044, CI045]
    tableRefs: [TI005, TI006, TI007, TI011]
  - id: peer-context-and-financial-verdict
    title: Peer Context and Financial Verdict
    body: >-
      Peer comparison clarifies both DeepWay's strengths and its limitations. DeepWay's RMB 3.96 billion
      of 2025 revenue is much larger than the public 2025 revenue disclosed by Aurora, WeRide, or Pony.ai,
      but that difference should not be misread as proof of superior autonomy economics because DeepWay is
      booking complete truck hardware revenue at scale, whereas those peers still report more software,
      services, or earlier-stage commercial mix. DeepWay's 4.9% gross margin remains far below WeRide's
      30.2% and does not resemble software-like economics yet. Public traction is corroborated on revenue,
      deliveries, backlog, and cumulative L2 mileage, but critical underwriting inputs remain private,
      including subscription ARPU, realized discounting, warranty cost, receivables aging, sales-cycle
      length, CAC, payback, and contract renewals. External commentary also remains skeptical: Electrek
      highlighted that DeepWay still was not profitable despite more than 12,000 cumulative delivered
      electric semis globally. The financial verdict is therefore mixed: DeepWay has achieved genuine
      manufacturing and commercial scale, but public evidence still supports an EV-hardware-plus-ADAS story
      with improving yet thin gross margins, meaningful capital intensity, and several unresolved data gaps
      before a long-term margin path can be underwritten.
    claimRefs: [CI029, CI035, CI041, CI046, CI047, CI048, CI049, CI050, CI051, CI052, CI053, CI054, CI055]
    tableRefs: [TI010]
    figureRefs: [FI001]

