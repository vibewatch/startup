callouts:
  - calloutType: risk
    title: Net liabilities remain the central financial risk
    body: >-
      DeepWay ended 2025 with RMB 1.90 billion of net liabilities and RMB 2.96 billion of pre-IPO
      financial liabilities at fair value through profit or loss, while management simultaneously disclosed
      that it expects to continue incurring net losses in 2026. Positive 2025 operating cash flow therefore
      does not eliminate the need to normalize the capital structure before judging sustainable solvency.
    claimRefs: [CI026, CI029, CI032, CI033, CI034]
  - calloutType: insight
    title: Revenue scale should not be mistaken for software-grade economics
    body: >-
      DeepWay's 2025 revenue already exceeds public revenue reported by several listed autonomy peers, but
      99.2% of its own revenue still came from truck hardware and gross margin was only 4.9%. The company
      has proven commercialization, not yet a software-like margin model.
    claimRefs: [CI004, CI008, CI013, CI050, CI051, CI052, CI053, CI054]

