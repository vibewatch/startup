company:
  name: DeepWay
chapter:
  number: 7
  key: risks
  title: Risks
  summary: >-
    DeepWay's risk profile is dominated by four interlocking challenges. First, a regulatory
    gap: China's L4 commercial-operation regime is confined to five pilot cities and a mandatory
    national standard does not take effect until July 2027, capping the full commercial case for
    autonomous-freight-robot revenue. Second, competitive pressure: Inceptio has accumulated
    400+ million cumulative autonomous km versus DeepWay's ~100 million, and KargoBot has
    demonstrated commercial L4 operations, threatening the differentiation narrative before
    DeepWay's own L4 fleet matures. Third, supplier and technology concentration: CATL is the
    sole battery supplier, Baidu Apollo provides the core ADS stack, and JAC Motors manufactures
    the vehicles — triple single-source dependencies that compress negotiating leverage and create
    correlated operational risk. Fourth, financial fragility: a net loss of RMB 649 million in
    2025 despite 101% revenue growth signals continued capital intensity, and the Chapter 18C
    HKEX IPO timing is sensitive to market conditions. International expansion adds geopolitical
    scrutiny, host-country regulatory complexity, and channel-partner depth risk. All operational
    metrics remain self-reported pending the IPO audit.

sections:
  - id: regulatory-legal-risks
    title: Regulatory, Legal, and National-Security Risks
    body: >-
      DeepWay's core commercial thesis depends on China granting broad commercial L4 truck
      deployment authorization. As of June 2026, that authorization is restricted to five pilot
      cities — Shanghai, Guangzhou, Shenzhen, Chongqing, and Hangzhou — where safety-driver
      removal was conditionally permitted from August 2025. Outside these corridors, commercial
      L4 freight operation is not permitted. A mandatory national L3/L4 standard is scheduled
      to take effect in July 2027, which will impose harmonized safety testing, certification,
      and deployment approval requirements across China. Non-compliance with these standards
      would prevent commercial operation in any geographic market. The transition creates both
      a timing risk (if certification takes longer than projected) and a cost risk (from
      required system upgrades to meet national standards). China's data privacy and cybersecurity
      laws — the Personal Information Protection Law (PIPL), the Data Security Law (DSL), and
      the Cybersecurity Law — impose strict requirements on cross-border data transfers, with
      autonomous-vehicle sensor and telematics data classified as data of potential national
      importance. These laws require that certain data be stored domestically, subject to
      security assessments before export, and processed only by licensed entities. For overseas
      deployments, host-country regulators impose their own approval requirements. The UN Global
      Technical Regulation for automated driving systems, adopted in June 2026, introduces a new
      layer of international compliance standards that DeepWay must meet for fleet deployments
      in regulated markets.

      International deployments face a compounding risk: Chinese autonomous-driving technology
      embedded in commercial trucks operating on Western transport corridors has attracted
      geopolitical scrutiny. The Carnegie Endowment noted in November 2025 that Chinese
      autonomous-vehicle platforms operating in partner-country supply chains raise data-sovereignty
      and infrastructure-vulnerability concerns for host governments. The US and EU have begun
      to extend screening mechanisms to Chinese technology companies operating physical
      transportation infrastructure. Even if DeepWay obtains host-country operational approval,
      post-approval restrictions or mandatory audits may materially constrain the overseas
      revenue model. No L4 commercial-trucking insurance framework has been standardized in
      China, creating an unresolved risk-transfer mechanism for autonomous fleet operators.
