callouts:
  - calloutType: risk
    title: Triple Single-Source Dependency
    body: >-
      CATL (batteries), Baidu Apollo (ADS software), and JAC Motors (manufacturing) each represent
      a single-source dependency with very high switching costs. A disruption to any one of these
      three partners — CATL supply constraint, Baidu strategic exit, or JAC production stoppage —
      would materially impair DeepWay's ability to manufacture, differentiate, or develop vehicles.
      These three risks are not independent: CATL's competing Zeron truck creates a structural
      conflict; Baidu's own AV strategy may evolve; and JAC's financial health is not auditable
      from public sources. Investors should treat this triple dependency as a compound correlated risk.
    claimRefs:
      - CR034
      - CR035
      - CR014

  - calloutType: risk
    title: L4 Revenue Model Remains a Future Promise
    body: >-
      The entire bull case for DeepWay as an autonomous-freight-robot company depends on a
      transition from L2 ADAS (current reality) to commercial L4 autonomous freight (future promise).
      This transition requires completing three independent gatings simultaneously: regulatory
      authorization beyond the 5 pilot cities, technical validation of the full L4 stack, and
      an insurance framework. None of these has been resolved as of mid-2026. The robotics.press
      adverse note articulates this as the central risk: the gap is not merely technical but
      institutional, and the timeline is outside DeepWay's direct control.
    claimRefs:
      - CR001
      - CR002
      - CR013
      - CR038

