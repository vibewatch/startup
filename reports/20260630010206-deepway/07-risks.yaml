  - id: partner-dependency-mitigations
    title: Partner Dependencies, People Risks, and Mitigations
    body: >-
      DeepWay's business model rests on three concentrated partner dependencies: CATL for
      batteries, Baidu Apollo for the ADS software stack, and JAC for vehicle manufacturing.
      The CATL battery relationship is the most structurally embedded: CATL co-delivered
      the Xinchenghui battery-swap fleet in October 2024 and has built charging-and-swap
      infrastructure alongside DeepWay deployments. This creates mutual switching costs but
      also consolidates critical components under a single supplier whose strategic priorities
      (including CATL's own EV truck brand Zeron) may not permanently align with DeepWay's.
      Baidu Apollo provides the autonomous-driving perception and planning stack; the exclusive
      licensing relationship underpins DeepWay's L4 development roadmap. Any strategic
      realignment by Baidu — including exit, reduced investment, or competitive repositioning
      in the autonomous freight space — would simultaneously remove DeepWay's primary technical
      partner and a key marketing credibility anchor. On people risk, CEO Wan Jun is the
      co-founder of Lionbridge (the logistics-leasing parent) and is the primary commercial
      relationship architect; CTO Tian Shan, a 13-year Baidu veteran, is the technical anchor
      of the ADS development team. Departure of either executive would create a material
      continuity gap. Mitigations that partially address the risk profile include: growing the
      autonomous-km data flywheel, diversifying the international customer base to reduce
      China-only concentration, expanding the service-center network (400+ centers already
      operational), and pursuing the HKEX IPO to establish a listed entity with improved
      public-market accountability and capital access. The unit-economics breakthrough observed
      in Ordos L4 pilots in H1 2025 (reported as positive at that scale) represents a potential
      inflection indicator if replicated at national scale. Kill criteria for the investment
      thesis include: failure to obtain national L4 commercial deployment authorization post
      July 2027 standard, departure of the Baidu Apollo partnership, or inability to sustain
      the IPO financing runway through the L4 ramp.
