  evidenceGaps:
    - id: ER001
      type: private-evidence-only
      severity: material
      topic: partner-contract-terms
      missingEvidence: >-
        Specific commercial terms of DeepWay's supply agreements with CATL (battery supply),
        Baidu Apollo (ADS licensing), and JAC Motors (OEM manufacturing) — including pricing,
        exclusivity, minimum volume commitments, and change-of-control provisions.
      whyItMatters: >-
        Without visibility into these contract terms, investors cannot assess whether CATL's
        investment in the competing Zeron brand or Baidu's evolving autonomous-vehicle strategy
        creates structural conflict-of-interest risks that would impair DeepWay's supply
        continuity and technological roadmap.
      diligencePath: >-
        Request all three partner agreements from the data room; focus on: CATL — exclusivity
        scope and priority queue provisions; Baidu Apollo — IP ownership on derivative works,
        source-code escrow, change-of-control termination rights; JAC — capacity reservation
        and quality SLA terms.
      relatedQuestionRefs: [QR017, QR018, QR029]

    - id: ER002
      type: private-evidence-only
      severity: material
      topic: investment-thesis-monitoring
      missingEvidence: >-
        No publicly disclosed kill criteria, monitoring thresholds, or investment-thesis
        triggers from DeepWay's institutional pre-IPO investors (ABC Impact, NGS Super,
        Stone Venture, Xiamen Guosheng). No confirmed cyber-liability insurance coverage
        for autonomous-system incidents has been publicly disclosed.
      whyItMatters: >-
        Without formal monitoring indicators or thesis-break definitions, investors cannot
        frame a structured exit discipline. Cyber-liability gaps leave DeepWay exposed to
        uninsured incident costs in pilot and commercial L4 deployments, potentially impairing
        the business at a critical phase of the L4 ramp.
      diligencePath: >-
        Request investor subscription agreements from the data room to identify any covenant,
        milestone, or consent rights that function as implicit kill criteria; ask management
        directly for the board-level scenario plan that would trigger an IPO withdrawal or
        strategic pivot; confirm insurance coverage for L4 platooning operations.
