  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Structure
        blocks:
          - type: paragraph
            body: >-
              DeepWay does not compete in a single narrow peer set. The landscape spans seven practical alternatives for
              freight buyers and fleet operators: direct China highway-autonomy truck peers, global autonomous-trucking
              stack vendors, electrified freight orchestrators, legacy truck OEMs and fleets moving into new-energy
              vehicles, the human-driver status quo, internal build or mixed-stack deployments, and likely entrants from
              larger autonomy or OEM ecosystems. In China, the most immediate peer set is Inceptio and KargoBot, because
              both are actively commercializing heavy-truck autonomy on domestic corridors and selling a concrete
              operating improvement story to fleets. Pony.ai is adjacent but increasingly relevant because it has
              brought robotruck revenue, SANY truck manufacturing ties, and dual-listing capital into the freight
              segment. Plus.ai, Aurora, Kodiak, and Einride matter less as immediate domestic substitutes today and more
              as strategic benchmarks for what best-in-class OEM partnerships, driverless safety narratives, and
              freight-network orchestration can look like. The status quo remains formidable: assisted-driving trucks,
              conventional fleet operations, and human drivers are still the default procurement path, while large
              fleets can multi-home across OEMs, telematics, and autonomy modules instead of standardizing on a single
              full-stack vendor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP041
