  - id: FE001
    title: DeepWay Full-Stack Technology Architecture (June 2026)
    type: stack
    layout: standard
    summary: >-
      Hierarchical stack view of DeepWay's technology layers from physical vehicle hardware through to cloud services
      and commercial software subscriptions, illustrating the integration between the Baidu Apollo base layer and
      DeepWay's proprietary additions.
    data:
      layers:
        - id: layer-01
          label: Truck Chassis and Body
          detail: >-
            Forward-engineered AV-native platform; no legacy diesel base. Dedicated wiring harness, actuator mounts, and
            compute bay.
          owner: Proprietary
        - id: layer-02
          label: Three-Electric System (Battery · Motor · Controller)
          detail: >-
            NMC/LFP battery packs, synchronous drive motor, SiC motor controller. Designed for long-haul heavy-freight
            duty cycles.
          owner: Proprietary (contracted mfg at JAC Motors / Shandong Reach; own factory under construction)
        - id: layer-03
          label: Sensor Suite
          detail: 10 cameras (surround + long-range forward) + 5 mmWave radars + 3 IR sensors = 18 sensor units per vehicle.
          owner: Tier-1 hardware suppliers (unnamed)
        - id: layer-04
          label: Onboard Compute Platform
          detail: >-
            Centralized domain controllers; 500+ TOPS total compute. EEA architecture purpose-built for low-latency AV
            command/control.
          owner: Proprietary EEA architecture; third-party SoCs
        - id: layer-05
          label: Sensor Fusion Engine
          detail: Multi-modal fusion of camera, radar, and IR data streams into unified environment representation.
          owner: Proprietary + Apollo base layer
        - id: layer-06
          label: Perception AI (Apollo Core)
          detail: >-
            3D detection, tracking, classification of vehicles, pedestrians, obstacles. Baidu Apollo white-box source
            access; only commercial vehicle OEM licensee.
          owner: Baidu Apollo (white-box licence) + DeepWay adaptation
        - id: layer-07
          label: Prediction Module (Apollo Core)
          detail: Trajectory forecasting for surrounding road users over 5–8 second horizon; heavy-truck dynamics calibrated.
          owner: Baidu Apollo (white-box licence) + DeepWay tuning
        - id: layer-08
          label: Planning Module (Proprietary + Apollo)
          detail: >-
            Route and manoeuvre planning with load-aware dynamics models; proprietary commercial-vehicle layers on
            Apollo planning core.
          owner: Baidu Apollo (base) + DeepWay proprietary
        - id: layer-09
          label: Vehicle Control (Actuator Commands)
          detail: >-
            Longitudinal and lateral control commands; brake-by-wire and steer-by-wire actuation hardware from Tier-1
            suppliers.
          owner: Proprietary firmware; third-party actuation hardware
        - id: layer-10
          label: Suixing — L2 Active Safety (Commercial)
          detail: >-
            Adaptive cruise, lane-keep assist, collision avoidance, fatigue detection. 7,500+ active subscriptions at
            ~30% take rate. ~RMB 3,000–5,000/vehicle/year.
          owner: Proprietary subscription product
        - id: layer-11
          label: Yanxing — IPTS Platoon System (Commercial)
          detail: 2–3 truck coordinated platooning using 5G-V2X leader-follower protocol. Commercial since 2023.
          owner: Proprietary subscription product
        - id: layer-12
          label: Duxing — L4 Solo Autonomy (Development Stage)
          detail: >-
            Target: driverless long-haul. Current status: supervised road-test on Beijing and Tianjin ICV licences. No
            commercial deployment or revenue.
          owner: Proprietary development programme
        - id: layer-13
          label: Tianshu — Fleet SaaS (Commercial)
          detail: >-
            Cloud platform for real-time telemetry, dispatch, route optimization, driver behaviour scoring. Independent
            of hardware refresh cycle.
          owner: Proprietary SaaS product
    approximationNotes: >-
      Layer boundaries are conceptual; actual software modules may span multiple layers. Third-party SoC and sensor
      supplier names are not disclosed in public HKEX filings. Apollo white-box integration depth is described in the
      filing but technical boundaries between Apollo code and DeepWay proprietary code are not quantified publicly.
    claimRefs:
