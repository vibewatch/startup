      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is structural inefficiency in Chinese logistics. China Daily, citing the China
              Logistics Information Center, reported total logistics costs of 18.2 trillion yuan in 2023, or 14.4% of
              GDP; the Swedish Transport Analysis Agency’s study notes that this ratio remains materially above
              developed-market norms. That gap creates a direct macro incentive for any technology that can lower labor
              intensity, improve asset utilization, and reduce energy or accident costs. Electrification is a second
              major driver because the new-energy heavy-duty truck transition is already real rather than hypothetical:
              2025 sales and penetration data show fleets are replacing tractors now, which gives autonomy vendors a
              hardware install base instead of asking buyers to fund a category from zero. Third, China’s policy
              environment is more commercially constructive than many Western markets: national intelligent connected
              vehicle planning, public-road testing precedents for heavy-duty trucks, and designated demonstrations
              shorten the path from pilot to paid operations.

              The constraints are equally material. Capital intensity remains high because DeepWay must fund vehicle
              programs, software, and eventually a heavier operations stack before the L4 revenue layer is proven.
              Regulatory permissions are still corridor-specific, not nationwide blanket approvals, so the real SAM is
              constrained by where fleets can actually deploy higher-autonomy freight. Trust and liability are
              non-trivial: safety-driver-light or driver-out operations ask fleets and shippers to accept a new risk
              profile in a low-margin industry. Finally, market-sizing evidence is contradictory by design. Broad AV
              reports, new-energy truck sales data, freight-spend studies, and autonomy-scenario forecasts answer
              different questions. That does not invalidate the opportunity; it means investors should underwrite
              DeepWay on staged commercialization milestones and route economics, not on the largest headline forecast
              available.
