      - number: '6.4'
        title: Retention, Expansion, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              DeepWay's customer expansion strategy relies on the "data flywheel" — increasing autonomous-miles across
              the installed base feeds algorithm refinement, enabling safer and eventually driverless operation that
              justifies higher per-truck or per-km subscription pricing over time. This logic underpins the long-term
              case for land-and-expand within logistics operators, but the commercial evidence for actual upsell from L2
              ADAS to future L4 autonomous-freight-robot services remains entirely theoretical as of mid-2026.

              Concentration risk is material. The customer base is dominated by Chinese logistics operators in a single
              vertical (bulk/port freight). The top two fleet customers (Platypus at 200 trucks and Xinchenghui at 100
              trucks) together represent approximately 300 confirmed production deployments in China — a large share of
              the Chinese named-customer evidence. International customers are in early-commercial or pilot stage;
              Foodstuffs NZ represents one truck in a real-world deployment, and the Australian order has not been
              publicly quantified. No customer has publicly disclosed fleet-expansion orders beyond the initial
              contracts.

              From the adverse perspective, robotics.press notes in a competitive-intelligence report that DeepWay's
              self-reported operational metrics are self-certified rather than audited, and that the $310M pre-IPO round
              figure conflicts with earlier tracked data (RMB 1.177B ≈ $173M first tranche vs. a cumulative figure that
              some databases tracked at $282–354M). The report characterises the gap between 6,400 L2-ADAS trucks and
              commercially viable L4 deployment as involving unresolved regulatory, insurance, and technical-validation
              challenges. No independent customer outcome study (G2, Gartner Peer Insights, academic third-party audit)
              corroborating DeepWay's TCO claims has been identified in public sources as of the research date.
