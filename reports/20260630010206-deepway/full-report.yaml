      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: TuSimple remains the clearest downside precedent for public autonomous-trucking valuations
            body: >-
              TuSimple shows that a public autonomous-trucking equity story can lose almost all of its value once
              governance problems, regulatory pressure, and commercialization setbacks compound. DeepWay's Hong Kong
              path avoids some direct US-listing exposure, but it does not erase the broader investor memory that this
              category can destroy capital quickly when expectations outrun execution.
            calloutType: risk
            claimRefs:
              - CV037
              - CV038
              - CV044
          - type: callout
            title: DeepWay's scale deserves a premium, but not a software multiple yet
            body: >-
              DeepWay's FY2025 revenue and positive operating cash flow are much stronger commercialization signals than
              most AV peers can show. Even so, the company still books almost all revenue from truck hardware and only
              recently reached a 4.9% gross margin, so the evidence supports a mixed-model valuation range rather than
              an autonomy-software valuation framework.
            calloutType: insight
            claimRefs:
