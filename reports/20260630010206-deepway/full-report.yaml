      - number: '6.2'
        title: International Market Customers and Distribution
        blocks:
          - type: paragraph
            body: >-
              DeepWay entered international markets in earnest in 2025 and accelerated customer acquisition through
              2026. The most commercially advanced international deployment is Foodstuffs North Island in New Zealand,
              which became the first operator of a DeepWay Star electric truck in a temperature-controlled commercial
              supply chain outside China. Foodstuffs commissioned the vehicle from its Palmerston North Distribution
              Centre in March 2026. The truck performs a daily dual-cycle route: a 200 km round trip delivering chilled
              and frozen groceries to Kapiti Coast stores in the morning, followed by a 280 km round trip to other lower
              North Island stores in the afternoon. A 90-minute midday recharge sustains the 460 km daily cycle. The
              truck has a 600 kWh lithium iron phosphate battery, 224 kW continuous / 492 kW peak power, 30,000 Nm
              continuous torque, and a 50,000 kg Gross Combination Mass. Foodstuffs previously trialled the vehicle in
              2025 over 1,000 km with the refrigerated trailer. Chief Executive Chris Quin linked the adoption to supply
              chain resilience against fuel price volatility as well as environmental targets (42% emissions reduction
              by 2030).

              In the New Zealand distribution channel, Etrucks New Zealand was formally appointed as official national
              distributor in July 2025 and launched the DeepWay Star at the EROAD Fleet Managers' Day in Hamilton on
              July 30, 2025. The vehicle's retail price of NZD 255,000 + GST (after the government's Low Emissions Heavy
              Vehicle Fund subsidy) represents the most affordable battery-electric semi-tractor available in New
              Zealand. The distribution agreement was signed between Etrucks director Ross Linton and DeepWay global
              operations manager Chiara Wang at DeepWay's Hefei headquarters. Etrucks previously distributed the
              high-end Windrose E1400; the DeepWay Star fills a cost-effective tier, broadening addressable fleet
              segments.

              In Australia, DeepWay signed a dealership agreement with an Australian partner in May 2025 and confirmed
              its first order — making Australia DeepWay's fourth Asia-Pacific market after Singapore, Thailand, and
              Malaysia. The Australian distributor conducted real-world testing before signing and validated the trucks
              for high efficiency and safety performance. DeepWay International General Manager Lin Facai committed to
              customized products and full lifecycle support for the Australian market. The NGS Super pension fund's
              participation in the April 2026 pre-IPO round reflects both capital commitment and an intention to
              leverage its extensive Australia–New Zealand resources to accelerate DeepWay's regional commercialization.
