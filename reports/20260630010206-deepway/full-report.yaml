      - number: '8.4'
        title: Scenario Analysis and IPO Pricing Context
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more informative than a single target value because DeepWay's next twelve to
              twenty-four months could push the company toward very different peer sets. In the bull case, software
              revenue becomes visible, gross margins expand above 15%, and corridor or platooning economics create a
              service-like revenue stream that justifies a $6 billion to $8 billion range. In the base case, DeepWay
              keeps growing rapidly, but remains mainly a truck-plus-ADAS business, supporting a $3 billion to $4.5
              billion band similar to a discounted version of Pony.ai or WeRide valuation logic. In the bear case,
              hardware margins stay thin, established OEMs pressure pricing, and public-market skepticism toward
              China-origin autonomy names intensifies, pulling the company toward a $0.8 billion to $1.8 billion range.
              TuSimple is the essential adverse precedent because it demonstrates how quickly an autonomous-trucking
              equity story can implode after listing if governance, regulation, or commercialization disappoints.
            claimRefs:
              - CV034
