  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Tianji Software Suite
        blocks:
          - type: paragraph
            body: >-
              DeepWay's core commercial product is the Xingchen series of forward-engineered new-energy heavy-duty
              trucks. The first-generation Xingchen Gen-I entered pilot operations in 2021 following the company's July
              2020 founding, establishing proof of concept for the blank-sheet AV-first chassis architecture. The
              second-generation Xingchen Gen-II reached commercial production in 2023 with substantially improved
              powertrain efficiency and onboard compute headroom, and by 2025 had achieved 8,020 unit deliveries —
              making DeepWay the ninth-largest NEV heavy truck seller in China. The Xingtu (StarWay) platform,
              positioned for broader market accessibility, extends the product portfolio into additional fleet segments.
              Overseas, the Xingchen Gen-II obtained NHVR certification in Australia and commenced commercial operations
              in Thailand in September 2024, with distribution agreements covering Malaysia, Singapore, New Zealand,
              Kazakhstan, and the UAE by 2025.

              The Tianji suite is DeepWay's proprietary software stack layered on top of the vehicle hardware platform.
              It comprises four commercial modules: Suixing (Level 2 active safety assistance), Yanxing (Intelligent
              Platoon Transportation System for 2–3 truck convoys), Duxing (Level 4 solo autonomous development
              programme), and Tianshu (fleet SaaS for real-time telemetry, dispatch, and route optimization). As of
              December 2025, more than 7,500 vehicles are running the Suixing L2 subscription, representing a 30%+ take
              rate across the active fleet. The Tianshu SaaS creates contractual touchpoints with fleet operators
              independent of hardware refresh cycles. Yanxing IPTS entered commercial service in 2023 leveraging 5G-V2X
              communications for coordinated platoon management. Duxing remains in supervised road-test mode with ICV
              licences in Beijing and Tianjin only; no commercial L4 revenue has been disclosed in the HKEX filing.
