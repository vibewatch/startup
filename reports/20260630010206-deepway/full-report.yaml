chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Strategic Context
        blocks:
          - type: paragraph
            body: >
              DeepWay Technology Co., Ltd. was incorporated in July 2020 as a joint venture between Baidu, Inc. and
              Lionbridge Financial Leasing Group. The company is headquartered in Hefei, Anhui Province, China (Hefei
              headquarters formally established November 2023) with R&D operations in Beijing and assembly plants
              operated through contract manufacturing partners. The corporate website and HKEX application proof
              describe DeepWay's mission as developing "smart NEV heavy-duty trucks" that are forward-engineered from
              blank-sheet for electric powertrains and L2–L4 autonomous driving, rather than converting diesel
              incumbents.

              The business model has three intended phases. Phase 1 (current primary driver): vehicle sales of the
              Xingchen and Xingtu tractor series, with hardware revenue comprising over 97% of 2025 revenue. Phase 2
              (scaling): Tianji software subscriptions—the Suixing L2 ADAS subscription (priced at RMB 3,000–5,000 per
              year) had over 7,500 activated vehicles and a 30%+ uptake rate as of the May 2026 filing. Phase 3 (target
              from 2027+): the Tianji Duxing Level 4 single-vehicle autonomous freight network, currently in
              development. The company also operates Tianji Tianshu, a fleet management SaaS.

              As of December 31, 2025, DeepWay had delivered 11,531 vehicles cumulatively (509 in 2023, 3,002 in 2024,
              8,020 in 2025), ranking #9 in China's NEV heavy-duty truck market for 2025. Revenue was RMB 3,961.1M
              (~US$582M) in 2025, representing 101% year-on-year growth. Net loss narrowed to RMB 649.1M in 2025 (from
              RMB 675.1M in 2024), while operating cash flow turned positive at RMB 835.2M. Gross margin improved to
              4.9% (from 0.5% in 2024).
