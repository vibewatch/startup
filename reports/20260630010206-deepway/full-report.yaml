      - number: '7.2'
        title: Technology, Operational, and Supply-Chain Risks
        blocks:
          - type: paragraph
            body: >-
              DeepWay's current product range is commercially deployed as L2 Advanced Driver Assistance (ADAS) — not
              Level 4 autonomous — across its ~12,000-unit installed fleet. The commercial transition from L2 fleet-data
              collection to Level 4 autonomous freight operation involves engineering milestones (full-stack L4
              validation, sensor redundancy certification, fail-safe architecture), regulatory milestones (commercial
              deployment permits in each jurisdiction), and insurance milestones (insurance coverage frameworks) that
              are all unresolved as of mid-2026. robotics.press has noted that DeepWay characterizes its L2 ADAS as an
              on-ramp to L4, but all autonomous-miles metrics are self-reported and have not been independently audited
              ahead of the HKEX IPO filing. The validator dimension is critical: investors relying on the data flywheel
              narrative (accumulating training miles to accelerate L4 safety) cannot independently verify the claim. JAC
              Motors is the primary OEM manufacturing partner for DeepWay's Xingtu and Star platforms. The manufacturing
              dependency concentrates production risk in a single partner's capacity, quality systems, and logistical
              availability. Any disruption to JAC's production capacity would directly impair DeepWay's ability to
              fulfill the 1,400-unit backlog reported as of mid-2025. CATL's 600 kWh LFP battery pack is the only
              battery platform across the full product line; no secondary supplier has been publicly disclosed. Battery
              pricing fluctuations — which are driven by lithium carbonate and LFP cathode material spot prices —
              compress gross margins directly. A rapid decline in CATL battery pricing (as occurred in 2023–2024 across
              the Chinese EV industry) could trigger fleet customers to defer purchases awaiting cheaper next-generation
              packs, creating demand pockets and OEM inventory risk for DeepWay. Platooning and L4 pilot operations in
              Inner Mongolia and Xinjiang create safety and liability exposure in the absence of a recognized insurance
              or incident-response framework.
            claimRefs:
