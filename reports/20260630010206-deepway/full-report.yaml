            body: >-
              DeepWay's own profile is unusual because it is not only an autonomy-software vendor. The company says it
              forward-engineers the complete electric heavy truck and embeds assisted driving from the chassis up, which
              supports low aerodynamic drag, low incremental L2 BOM cost, and a monetization path through both vehicle
              sales and subscriptions. Its disclosed scale by filing period, 7,500-plus L2-activated vehicles, 30%-plus
              subscription attach, 200 million-plus kilometers, and CNY 1.5 billion H1 2025 revenue, shows meaningful
              customer adoption but not yet profitability. Inceptio is the strongest like-for-like China benchmark: it
              combines 4,000-plus L2+/L3 trucks, more than 400 million kilometers of autonomous mileage, large OEM
              integrations, and a public commercialization narrative around safety and fuel savings. KargoBot is the
              most concentrated L4 challenge, with a narrower but more advanced corridor-led program that claims
              positive unit economics in Ordos. Pony.ai brings balance- sheet and capital-markets strength from its
              broader autonomy business, while Plus.ai, Aurora, Kodiak, and Einride show how global peers are using OEM
              and carrier partnerships to reach production corridors without building a complete truck platform
