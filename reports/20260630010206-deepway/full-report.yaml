      - number: '8.5'
        title: Key Catalysts, Risks, and Investor Considerations
        blocks:
          - type: paragraph
            body: >-
              The final investment question is not whether DeepWay has built a real business; it has. The question is
              whether the IPO price converts that proof into an attractive return. Near-term rerating upside would come
              from disciplined IPO pricing, evidence that gross margin keeps climbing in H1 2026, regulatory permission
              for more advanced platooning or L4 monetization, and proof that overseas expansion adds demand rather than
              distraction. The main reasons for caution are equally clear: negative equity remains a real overhang,
              software revenue is still negligible, and both Chinese autonomy specialists and established truck OEMs can
              attack DeepWay's narrative from different angles. As a result, the public evidence today supports a
              price-sensitive stance rather than an unconditional buy call. Valuation looks fair in a
              mid-single-digit-sales framework, stretched if IPO pricing pushes into software-style territory, and
              attractive only if the final deal leaves room for execution risk that remains unresolved in public data.
