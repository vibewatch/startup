      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: China's structural adoption advantage is real
            body: >-
              China combines an unusually large freight base, fast new-energy heavy-duty truck adoption, dense corridor
              logistics, and a more commercialization-oriented pilot environment than most Western markets. That
              combination matters because it lets companies like DeepWay monetize truck hardware and assisted driving
              before full nationwide driver-out autonomy is legal, creating a more credible bridge from present revenue
              to future autonomy upside.
            calloutType: strength
            claimRefs:
              - CM004
              - CM006
              - CM021
              - CM036
          - type: callout
            title: Regulatory and commercialization timing can still slip
            body: >-
              The bullish market case assumes that public-road permits, fleet trust, liability frameworks, and corridor
              operations mature fast enough to let assisted driving convert into scalable autonomous freight. Retained
              sources support that pilot progress is real, but they do not prove that corridor-level permissions,
              insurance acceptance, and route economics will scale on the aggressive timelines implied by the largest
              scenario forecasts.
            calloutType: risk
            claimRefs:
              - CM030
              - CM033
              - CM037
              - CM038
          - type: callout
            title: The key market insight is the TAM/SAM disconnect
            body: >-
              DeepWay's headline market can be made to look enormous by citing China road freight, broad AV forecasts,
              or global autonomous trucking theses. None of those figures alone is the investable market. The investable
              SAM is the subset of new-energy heavy-duty truck fleets and freight corridors where customers can buy
              trucks now, subscribe to software next, and eventually operate or purchase autonomous freight under live
              regulatory permissions.
            calloutType: insight
            claimRefs:
