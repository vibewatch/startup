      - number: '4.1'
        title: Revenue Scale, Mix, and Quality
        blocks:
          - type: paragraph
            body: >-
              DeepWay's top-line ramp is real and unusually fast for an autonomous-trucking company, but the composition
              of that revenue matters more than the absolute headline. The HKEX filing shows revenue began only in June
              2023 with the first batch deliveries of Xingchen I, then climbed from RMB 425.6 million in 2023 to RMB 2.0
              billion in 2024 and RMB 4.0 billion in 2025. That growth came almost entirely from complete-truck hardware
              sales: truck hardware represented 99.9% of 2023 revenue and still 99.2% in 2025, while software and other
              revenue reached only 0.8% of sales in 2025. Delivery volume expanded from 509 units in 2023 to 8,020 in
              2025, but estimated blended revenue per delivery fell materially over the same period, implying that scale
              has been won through a lower ASP mix, a richer product ladder, pricing pressure, or all three. The filing
              supports strong public traction on units and revenue, including a 516-unit backlog at filing date and
              ninth-place rank in China's 2025 NEV heavy-duty truck market, but it does not disclose realized
              subscription ARPU, contract discounting, or a list-to-net bridge that would let an investor separate
              hardware ASP, software take-rate, and channel effects with confidence.
