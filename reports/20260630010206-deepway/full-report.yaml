      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Forward-Engineering Advantage and Apollo White-Box License
            body: >-
              DeepWay's blank-sheet design approach, combined with exclusive white-box access to Baidu's Apollo
              autonomous driving platform, creates a hardware-software co-design moat that diesel-converted competitors
              cannot easily replicate. The Apollo partnership gives DeepWay access to one of China's most mature
              open-source AV codebases while retaining IP freedom to develop proprietary algorithms on top of it.
            calloutType: strength
            claimRefs:
              - CO006
              - CO029
          - type: callout
            title: Thin Gross Margin and Path to Profitability
            body: >-
              A 4.9% gross margin in 2025 means DeepWay loses money on operational expenses even when excluding interest
              and depreciation. With cumulative net losses exceeding RMB 1.7B and R&D spend at 9.8% of revenue, the
              company requires either significant volume scale (to spread fixed costs) or successful monetisation of the
              Tianji software subscription stack to reach unit economics that support profitability. The gap between
              vehicle-margin and software-margin is the central financial risk.
