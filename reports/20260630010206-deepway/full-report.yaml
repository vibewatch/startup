      - number: '3.3'
        title: Capability, Pricing, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >-
              Capability comparison is not just a race to the highest autonomy level. DeepWay's advantage is integrated
              electric-truck design with low-cost L2 deployment and measurable subscription attach. Inceptio leads on
              disclosed mileage and OEM manufacturing leverage. KargoBot leads on public L4 corridor specialization and
              platooning economics. Pony.ai blends trucking with a much larger robotaxi platform, giving it cash,
              engineering brand, and cross-program learnings. Plus.ai and Aurora show the power of global OEM
              distribution, but their disclosed evidence in this pack is stronger on partner breadth than on China route
              density. Public pricing remains opaque across nearly all peers: rather than software list prices, most
              vendors sell some combination of truck ASP, subscription attach, OEM-integrated ADAS cost, fuel savings,
              labor reduction, or utilization uplift. That opacity raises diligence importance around realized pricing,
              discounting, and contract structure. Distribution power is correspondingly shaped by OEM partnerships and
              manufacturing position. DeepWay's vertical integration is a strength if a buyer wants a tightly optimized
              electric truck, but it can be a limitation for fleets that prefer modular sourcing and multi-homing across
              chassis, software, and operations providers.
