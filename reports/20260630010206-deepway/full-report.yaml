      - number: '6.3'
        title: Customer Segmentation, Adoption Trajectory, and Recurring Revenue
        blocks:
          - type: paragraph
            body: >-
              DeepWay's primary customer segments are large commercial logistics operators in China's short-haul,
              fixed-route bulk-freight market — a segment estimated to account for 40–50% of China's total road freight
              volume and the most viable deployment scenario for near-term autonomous operation at scale. The Chinese
              customer base spans express delivery (STO Express, SF Express), port logistics (Platypus, Xinchenghui),
              gravel/bulk cargo, and regional trunking. DeepWay holds over 95% market share in China's express-delivery
              electric-truck segment and ranks among the top sellers in Shanghai, Xinjiang, and Shandong.

              Adoption has followed an accelerating trajectory: 509 units delivered in 2023 (first commercial year),
              3,002 in 2024, and 8,020 in 2025 — the latter ranking ninth in China's new-energy heavy-truck market. As
              of early 2026, cumulative deliveries reportedly exceeded 12,000 units across China, Thailand, New Zealand,
              Australia, and other markets, with cumulative customer-operated distance exceeding 200 million km by
              mid-2025 (as reported by the New Zealand distributor). DeepWay's revenue grew 101% in 2025 to
              approximately RMB 3.96 billion (~$582M), driven almost entirely (>90%) by vehicle sales.

              A key dimension of the customer model is the recurring revenue from Tianji Suixing ADAS subscriptions.
              DeepWay is the first company globally to make an integrated driver-assistance system standard across its
              entire vehicle lineup; fleet operators pay subscription fees for active use of the autonomous-driving
              assistance features. As of mid-2025, over 2,000 vehicles had the subscription activated with a rising paid
              subscription rate described by investors as a strong commercial signal. DeepWay's 400+ service centers and
              1,000+ certified engineers in China underpin the after-sales and subscription service network required to
              sustain repeat business.

              However, publicly available evidence on customer retention is limited. No NRR, GRR, or formal churn data
              has been disclosed. Long-term fleet-level subscription renewal rates and any evidence of contract length
              or lock-in structure are not publicly available. These represent material diligence gaps for evaluating
              the quality and durability of the customer base.
