  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Comparable Company Universe and Revenue Quality Analysis
        blocks:
          - type: paragraph
            body: >-
              DeepWay enters valuation with an unusual public profile for an autonomous-trucking company. Its FY2025
              revenue of RMB 3961.1 million, roughly $582 million at the user's reference exchange rate, is far larger
              than the revenue currently disclosed by Aurora, WeRide, or Pony.ai. That scale matters because it proves
              real truck commercialization and not just pilot deployments. But the quality of the revenue matters just
              as much as the quantity. The prospectus shows that 99.2% of FY2025 revenue still came from truck hardware
              and only 0.8% from software and other streams, leaving DeepWay much closer to an EV truck OEM with
              autonomy upside than to a software-first autonomy platform. That mix explains why public comparables split
              into two camps: DeepWay deserves a premium to plain truck manufacturers for growth and software
              optionality, but a discount to pure-AV or ADAS names whose gross margins and recurring revenue are already
              much stronger.
