        title: Cost Structure, Unit Economics, and Concentration
        blocks:
          - type: paragraph
            body: >-
              The 2025 income statement shows improvement, but not yet evidence of durable high-quality unit economics.
              Gross profit rose to RMB 194.9 million and gross margin improved to 4.9%, versus only 0.4% and 0.5% in
              2023 and 2024, yet the company still posted a RMB 649.1 million net loss and a -16.4% net loss margin. R&D
              remains a defining cost center: DeepWay spent RMB 386.6 million on R&D in 2025, equal to 9.8% of revenue,
              and the filing says all R&D is expensed as incurred with no capitalization. Sales and marketing also
              scaled with the go-to-market buildout, reaching RMB 223.3 million and 428 heads in 2025, while estimated
              S&M spend per delivered truck fell sharply as volume ramped. Revenue quality still carries concentration
              risk. In 2025, the top five customers generated 39.5% of revenue, the largest customer contributed 12.7%,
              the largest customer's subsidiary also supplied batteries, and the top five suppliers accounted for 79.4%
              of purchases. Distributor sales were only 2.5% of 2025 revenue, which suggests DeepWay still depends
              primarily on direct sales and its 110-plus service-center footprint rather than a broad external channel.
              The net result is that DeepWay looks more like an early-stage EV OEM with assisted-driving monetization
              optionality than a software-first autonomy company with already-proven recurring economics.
