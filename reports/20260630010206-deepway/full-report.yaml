      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              DeepWay's moat is most credible where electric-truck design, autonomy economics, and service access are
              tightly coupled. The company can argue that its complete-truck architecture lowers sensor and compute
              integration friction, keeps incremental assisted-driving cost low, and creates a better operator
              experience than retrofit approaches. That is real differentiation, but the durability of the moat is
              contested. Inceptio's larger disclosed mileage base and OEM share may compound faster than DeepWay's
              integrated-hardware edge because data flywheels and production partnerships are harder to compress once
              they scale. KargoBot shows that a more corridor-specific L4 strategy can reach attractive economics
              without solving every freight use case first. Pony.ai shows that adjacent autonomy platforms with much
              deeper cash pools can extend into trucking. Plus.ai and Aurora indicate that OEM-centric,
              geography-spanning models may commoditize parts of the stack. TuSimple's collapse into CreateAI after
              regulatory and governance turmoil is the clearest adverse precedent: cross-border autonomy programs can
              lose strategic focus quickly, and freight buyers may discount ambitious roadmaps if trust, capital, or
              regulatory posture deteriorate.
