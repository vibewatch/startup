  - id: FR001
    title: Risk severity assessment matrix
    type: matrix
    layout: standard
    summary: >-
      Cross-cutting risk assessment for DeepWay's twelve key risk dimensions as of June 2026, evaluating likelihood,
      potential impact, mitigation maturity, and residual exposure. Regulatory and partner-dependency risks dominate the
      high-severity quadrant.
    data:
      columns:
        - label: Likelihood (H/M/L)
        - label: Impact if realized
        - label: Mitigation maturity
        - label: Residual exposure
      rows:
        - label: China L4 5-city commercial cap
          values:
            - High
            - High — limits autonomous revenue to pilot corridors
            - Low — cannot be unilaterally resolved
            - L4 revenue effectively blocked outside 5 cities until post-July 2027
        - label: Mandatory L3/L4 national standard July 2027
          values:
            - High (date set)
            - High — certification cost and delay risk
            - Medium — active L4 R&D underway
            - Certification failure or delay blocks commercial scaling
        - label: CATL sole-supplier battery dependency
          values:
            - Medium
            - High — no alternative supplier; cost tied to CATL pricing
            - Low — no alternative supplier disclosed
            - Full margin compression if CATL pricing or availability changes
        - label: Baidu Apollo ADS licensing exclusivity
          values:
            - Medium
            - Very high — L4 roadmap depends on Baidu Apollo
            - Low — no IP escrow or alternative stack disclosed
            - Baidu strategic exit would simultaneously remove tech partner and shareholder anchor
        - label: JAC Motors manufacturing concentration
          values:
            - Medium
            - High — backlog of 1,400 units unfulfillable without JAC
            - Low — no backup OEM manufacturing partner
            - Production stoppage would delay backlog delivery and damage customer relationships
        - label: L2 to L4 technology gap
          values:
            - High (certainty)
            - High — revenue uplift from L4 may be 3-5 years away
            - Medium — km data accumulating via L2 fleet
            - The autonomous-freight-robot case is unproven; insurance and regulatory gaps unresolved
        - label: Inceptio autonomous-km data lead
          values:
            - High (current reality)
            - Medium-High — data scale advantage may translate to L4 capability gap
            - Low — DeepWay cannot accelerate Inceptio's competitor data accumulation
            - Inceptio's 400M km vs DeepWay 100M km represents 4× data disadvantage
        - label: KargoBot L4 commercial operations
          values:
            - High (35M L4 km in operation)
            - Medium — KargoBot competes in same port-logistics segment
            - Low — DeepWay has scale (12,000 trucks vs pilot fleet)
            - KargoBot's L4 lead may win next-tier port-logistics contracts
        - label: Net loss RMB 649M with dual capital demands
          values:
            - High (sustained losses)
            - High — capital exhaustion risk if IPO delayed or undersubscribed
            - Medium — $310M+ pre-IPO raised; HKEX IPO in progress
            - Without IPO or follow-on capital, runway may be insufficient for full L4 ramp
        - label: IPO timing risk — Chapter 18C listing
          values:
            - Medium
            - High — IPO delays extend loss period and may require dilutive capital raise
            - Medium — CICC and CMB International sponsors engaged
            - AV company IPO market conditions uncertain; investor appetite for loss-making AV companies subdued
        - label: China data privacy and cybersecurity laws
          values:
            - High (laws in force)
            - Medium — cross-border data transfer restrictions for overseas deployments
            - Medium — domestic data center infrastructure in place
            - Overseas deployment compliance may require significant legal and infrastructure cost
        - label: Geopolitical scrutiny of Chinese AV in Western markets
          values:
            - Medium (trend increasing)
            - High — potential operational bans or mandatory audits in NZ, AU, EU
            - Low — no disclosed government-affairs strategy in Western markets
            - Forced withdrawal from overseas markets would damage investor narrative and international revenue
    approximationNotes: >-
      Likelihood and impact ratings are qualitative analyst assessments based on regulatory publications, independent
