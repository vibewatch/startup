  - id: TI011
    title: Capital adequacy and public financial gaps table
    columns:
      - Area
      - PublicDatapoint
      - MissingInformation
      - WhyItMatters
      - DiligenceRequest
    rows:
      - - Runway
        - 2025 year-end cash of RMB 1612.3m and positive 2025 operating cash flow
        - No public monthly burn bridge, covenant package, or downside-case runway
        - Cash alone does not reveal resilience if working capital reverses or capex rises
        - Request monthly cash bridge, debt schedule, and base/bear runway model
      - - Realized pricing
        - Revenue and delivery counts are public
        - No list-to-net bridge or disclosed discounting by model, customer, or channel
        - ASP compression could reflect weak pricing power rather than mix
        - Request invoice-level pricing waterfall and discount policy by top customer cohort
      - - Recurring software revenue
        - Software and other revenue was only 0.8% of 2025 sales
        - No subscription ARPU, attach, renewal, or gross margin disclosure
        - The investment case depends on proving that ADAS monetization expands beyond truck hardware
        - Request cohort subscription metrics, ARPU, gross margin, and renewal data
      - - Working capital
        - Receivables reached RMB 1583.1m in 2025
        - No aging buckets, bad-debt experience, or customer credit insurance disclosure
        - Collection quality can materially alter cash conversion and impairment risk
        - Request AR aging, overdue balances, write-off history, and top-customer payment terms
      - - Manufacturing capital intensity
        - 2025 investing outflow was RMB 1163.6m
        - No public plant-utilization, capex split, or warranty reserve detail
        - Margin durability depends on whether fixed assets and after-sales obligations are scaling efficiently
        - Request capex schedule, utilization, warranty reserve, and service-cost bridge
      - - IPO proceeds
        - Application proof is filed but use-of-proceeds lines are redacted
        - Exact allocation among operations, R&D, overseas expansion, and debt or working-capital support
        - Investors cannot test whether the IPO solves growth needs or merely patches the balance sheet
        - Request full proceeds schedule and contingency plan if IPO size prices below expectations
    notes: >-
      Public-versus-private underwriting checklist keyed to the company's reported cash, financing, and working-capital
      profile.
    claimRefs:
      - CI029
      - CI030
      - CI033
      - CI041
      - CI045
      - CI048
      - CI049
