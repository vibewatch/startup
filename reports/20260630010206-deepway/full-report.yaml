      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Exclusive Apollo White-Box Licence Creates Defensible AV Moat
            body: >-
              DeepWay's status as the only commercial vehicle company with white-box (source-code-level) access to Baidu
              Apollo gives it access to one of China's most mature and production-tested AV software stacks. Unlike
              API-level integrations used by other partners, white-box access enables deep customization,
              commercial-vehicle-specific tuning, and the ability to extend or modify core perception and planning
              pipelines. This integration, combined with the forward-engineered chassis, means hardware and software
              were co-designed — a structural advantage that diesel-conversion competitors cannot replicate without a
              full vehicle redesign.
            calloutType: strength
            claimRefs:
              - CE011
              - CE019
          - type: callout
            title: L4 Commercial Timeline Opacity and Apollo Dependency
            body: >-
              The Tianji Duxing L4 programme has no disclosed commercial deployment timeline. DeepWay's Phase 3 vision
              of autonomous freight-as-a-service depends on L4 commercialization, but the HKEX filing provides no target
              date or interim milestone for Duxing's commercial launch. Additionally, the white-box Apollo licence
              creates a single-vendor dependency: any change in Baidu's licensing policy would require a ground-up
              replacement of the core AV software stack, representing a material execution risk. Given that Baidu
              remains a 13.48% shareholder, this risk is partially mitigated, but it is not fully contractually hedged
              in disclosed terms.
