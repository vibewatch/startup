company:
  name: DeepWay
chapter:
  number: 3
  title: Competitors
  summary: >-
    DeepWay competes most directly with China's highway-autonomy truck specialists Inceptio and
    KargoBot, while Pony.ai, Plus.ai, Aurora, Kodiak, and Einride define adjacent strategic
    benchmarks on capital access, OEM reach, safety posture, and L4 maturity. DeepWay's strongest
    differentiator is its forward-engineered electric truck plus ADAS stack, which supports low
    incremental L2 cost and early monetization, but Inceptio currently holds the clearest mileage
    and OEM-distribution data moat, and KargoBot plus Pony.ai show that L4 corridor economics and
    better-capitalized multi-program autonomy platforms can pressure DeepWay's long-term advantage.
sections:
  - id: competitive-landscape-and-market-structure
    title: Competitive Landscape and Market Structure
    body: >-
      DeepWay does not compete in a single narrow peer set. The landscape spans seven practical
      alternatives for freight buyers and fleet operators: direct China highway-autonomy truck
      peers, global autonomous-trucking stack vendors, electrified freight orchestrators, legacy
      truck OEMs and fleets moving into new-energy vehicles, the human-driver status quo, internal
      build or mixed-stack deployments, and likely entrants from larger autonomy or OEM ecosystems.
      In China, the most immediate peer set is Inceptio and KargoBot, because both are actively
      commercializing heavy-truck autonomy on domestic corridors and selling a concrete operating
      improvement story to fleets. Pony.ai is adjacent but increasingly relevant because it has
      brought robotruck revenue, SANY truck manufacturing ties, and dual-listing capital into the
      freight segment. Plus.ai, Aurora, Kodiak, and Einride matter less as immediate domestic
      substitutes today and more as strategic benchmarks for what best-in-class OEM partnerships,
      driverless safety narratives, and freight-network orchestration can look like. The status quo
      remains formidable: assisted-driving trucks, conventional fleet operations, and human drivers
      are still the default procurement path, while large fleets can multi-home across OEMs,
      telematics, and autonomy modules instead of standardizing on a single full-stack vendor.
    claimRefs: [CP001, CP002, CP003, CP004, CP041]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: direct-competitor-profiles
    title: Direct Competitor Profiles
    body: >-
      DeepWay's own profile is unusual because it is not only an autonomy-software vendor. The
      company says it forward-engineers the complete electric heavy truck and embeds assisted
      driving from the chassis up, which supports low aerodynamic drag, low incremental L2 BOM
      cost, and a monetization path through both vehicle sales and subscriptions. Its disclosed
      scale by filing period, 7,500-plus L2-activated vehicles, 30%-plus subscription attach,
      200 million-plus kilometers, and CNY 1.5 billion H1 2025 revenue, shows meaningful customer
      adoption but not yet profitability. Inceptio is the strongest like-for-like China benchmark:
      it combines 4,000-plus L2+/L3 trucks, more than 400 million kilometers of autonomous mileage,
      large OEM integrations, and a public commercialization narrative around safety and fuel
      savings. KargoBot is the most concentrated L4 challenge, with a narrower but more advanced
      corridor-led program that claims positive unit economics in Ordos. Pony.ai brings balance-
      sheet and capital-markets strength from its broader autonomy business, while Plus.ai, Aurora,
      Kodiak, and Einride show how global peers are using OEM and carrier partnerships to reach
      production corridors without building a complete truck platform themselves.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP013, CP016, CP020, CP022, CP025]
    tableRefs: [TP005, TP006]
  - id: capability-pricing-and-distribution-comparison
    title: Capability, Pricing, and Distribution Comparison
    body: >-
      Capability comparison is not just a race to the highest autonomy level. DeepWay's advantage
      is integrated electric-truck design with low-cost L2 deployment and measurable subscription
      attach. Inceptio leads on disclosed mileage and OEM manufacturing leverage. KargoBot leads on
      public L4 corridor specialization and platooning economics. Pony.ai blends trucking with a
      much larger robotaxi platform, giving it cash, engineering brand, and cross-program learnings.
      Plus.ai and Aurora show the power of global OEM distribution, but their disclosed evidence in
      this pack is stronger on partner breadth than on China route density. Public pricing remains
      opaque across nearly all peers: rather than software list prices, most vendors sell some
      combination of truck ASP, subscription attach, OEM-integrated ADAS cost, fuel savings, labor
      reduction, or utilization uplift. That opacity raises diligence importance around realized
      pricing, discounting, and contract structure. Distribution power is correspondingly shaped by
      OEM partnerships and manufacturing position. DeepWay's vertical integration is a strength if a
      buyer wants a tightly optimized electric truck, but it can be a limitation for fleets that
      prefer modular sourcing and multi-homing across chassis, software, and operations providers.
    claimRefs: [CP012, CP014, CP017, CP018, CP020, CP021, CP023, CP027, CP028, CP029, CP033, CP037]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]
  - id: moat-durability-and-displacement-risk
    title: Moat Durability and Displacement Risk
    body: >-
      DeepWay's moat is most credible where electric-truck design, autonomy economics, and service
      access are tightly coupled. The company can argue that its complete-truck architecture lowers
      sensor and compute integration friction, keeps incremental assisted-driving cost low, and
      creates a better operator experience than retrofit approaches. That is real differentiation,
      but the durability of the moat is contested. Inceptio's larger disclosed mileage base and OEM
      share may compound faster than DeepWay's integrated-hardware edge because data flywheels and
      production partnerships are harder to compress once they scale. KargoBot shows that a more
      corridor-specific L4 strategy can reach attractive economics without solving every freight use
      case first. Pony.ai shows that adjacent autonomy platforms with much deeper cash pools can
      extend into trucking. Plus.ai and Aurora indicate that OEM-centric, geography-spanning models
      may commoditize parts of the stack. TuSimple's collapse into CreateAI after regulatory and
      governance turmoil is the clearest adverse precedent: cross-border autonomy programs can lose
      strategic focus quickly, and freight buyers may discount ambitious roadmaps if trust, capital,
      or regulatory posture deteriorate.
    claimRefs: [CP019, CP024, CP026, CP030, CP031, CP032, CP034, CP035, CP036, CP038, CP039, CP040, CP042]
    tableRefs: [TP004]
    figureRefs: [FP003]
