callouts:
  - calloutType: risk
    title: Inceptio's disclosed mileage moat is the clearest competitive risk to DeepWay
    body: >-
      Inceptio's 400M-plus autonomous commercial kilometers, 4,000-plus trucks in operation, and
      large OEM production footprint mean it likely compounds more driving data and partner
      entrenchment than DeepWay today. Even if DeepWay's integrated truck design is superior on
      unit economics, it may be harder to out-scale a rival already embedded across multiple OEM
      programs and recognized publicly for commercialization leadership.
    claimRefs: [CP009, CP010, CP030]
  - calloutType: strength
    title: DeepWay's vertical integration is a real product and cost differentiator
    body: >-
      DeepWay is the only company in this pack that explicitly pairs a self-developed electric
      heavy truck with ground-up assisted-driving integration and a disclosed low incremental L2 BOM
      cost. That gives it a stronger argument for system-level efficiency, aerodynamic performance,
      and monetization through both hardware and software than rivals relying purely on partner
      chassis.
    claimRefs: [CP005, CP006, CP027, CP034]
  - calloutType: insight
    title: TuSimple / CreateAI is a cautionary tale for cross-border autonomy programs
    body: >-
      TuSimple's exit from US autonomous trucking and pivot into CreateAI after regulatory and
      governance controversy shows how quickly an AV freight story can lose credibility when
      cross-border controls, investigations, and strategic focus break down. For DeepWay and its
      peers, governance and jurisdiction strategy are therefore part of competitive durability, not
      merely legal overhead.
    claimRefs: [CP026, CP037]
