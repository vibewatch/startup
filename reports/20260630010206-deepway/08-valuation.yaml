  "number": 8
  "title": "Valuation"
  "summary": "DeepWay's RMB 3961 million, or roughly $582 million, of FY2025 revenue and 101% growth trajectory make it the highest-revenue company in this AV peer set, but 99.2% hardware concentration and a 4.9% gross margin still cap near-term software-style multiples. The most defensible public range is about $3 billion to $4.5 billion in the base case, with upside to $6 billion to $8 billion only if Tianji software and margin expansion become visible, and downside to $0.8 billion to $1.8 billion if post-IPO multiple compression resembles TuSimple's cautionary path."
"sections":
- "id": "comp-universe"
  "title": "Comparable Company Universe and Revenue Quality Analysis"
  "body": "DeepWay enters valuation with an unusual public profile for an autonomous-trucking company. Its FY2025 revenue of RMB 3961.1 million, roughly $582 million at the user's reference exchange rate, is far larger than the revenue currently disclosed by Aurora, WeRide, or Pony.ai. That scale matters because it proves real truck commercialization and not just pilot deployments. But the quality of the revenue matters just as much as the quantity. The prospectus shows that 99.2% of FY2025 revenue still came from truck hardware and only 0.8% from software and other streams, leaving DeepWay much closer to an EV truck OEM with autonomy upside than to a software-first autonomy platform. That mix explains why public comparables split into two camps: DeepWay deserves a premium to plain truck manufacturers for growth and software optionality, but a discount to pure-AV or ADAS names whose gross margins and recurring revenue are already much stronger."
