- "id": "valuation-methodology"
  "title": "Valuation Methodology and Multiple Analysis"
  "body": "Revenue multiples are the most practical framework because DeepWay remains loss-making and its exact IPO share count and price are still redacted in the draft prospectus. A DCF would create false precision, while EBITDA or earnings multiples are premature. The cleanest method is therefore a blended EV-to-revenue range anchored on three layers. First, a hardware floor of roughly 1.5x to 3x sales captures the reality that most revenue is still generated by truck hardware with only 4.9% gross margin. Second, a mixed-model middle band of roughly 5x to 8x sales reflects DeepWay's very fast growth, positive operating cash flow, and credible but still unproven software upside. Third, software-style upside of 10x to 15x sales is only rational if Tianji subscriptions begin to matter and gross margins step materially higher. The latest private financing round supports the idea that investors see upside optionality, but public evidence still leaves exact pre-IPO valuation terms unresolved."
