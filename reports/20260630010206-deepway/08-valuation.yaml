- "id": "market-sizing"
  "title": "Market Context and Growth Addressability"
  "body": "The market backdrop is large enough to justify a meaningful valuation range even before DeepWay proves software monetization. Mordor estimates China's road-freight market at $472.77 billion in 2025 and $668.55 billion by 2031, while ARK frames autonomous transportation as a multi-trillion-dollar global opportunity by 2030. Those figures do not mean DeepWay deserves software multiples today, but they do explain why investors continue to fund the company aggressively. DeepWay is still early in share terms: the filing places it ninth in China's 2025 NEV heavy-duty truck market, leaving a long runway before any claim of category leadership. The competitive context is also important. China is emerging as a major commercialization venue for assisted-driving trucks, and rivals such as Inceptio and KargoBot are each building their own valuation stories around commercial mileage, corridor economics, and OEM reach. DeepWay's addressable upside therefore depends on converting its current\
    \ truck scale into durable market share and software attach rather than on TAM alone."
