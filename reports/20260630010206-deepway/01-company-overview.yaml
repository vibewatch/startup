  - id: section-leadership
    title: Leadership, Governance, and Shareholders
    body: >
      DeepWay was co-founded by Wan Jun, who serves as Chairman and CEO. Wan Jun also founded
      Lionbridge Financial Leasing Group, the trucking logistics firm that co-established
      DeepWay with Baidu. The CTO is Tian Shan, who previously led autonomous commercial
      vehicle research within Baidu's intelligent driving unit and brings deep technical
      continuity between Baidu's Apollo platform and DeepWay's Tianji intelligence suite.
      As of December 31, 2025, the company employed 1,308 people across all functions,
      with 412 (31.5%) in R&D.

      The shareholder structure reflects the joint-venture origin. Wan Jun's group (including
      Lionbridge entities) collectively holds approximately 20.44% of the outstanding shares.
      Baidu retains a 13.48% stake as of the HKEX application proof. Financial investors
      from the Series A (led by Qiming Venture Partners), Series A+ (led by Shandong Weiqiao
      Pioneering Group and SoftBank China Venture Capital), and Series B (co-led by Zhongan
      Capital and Puhua Capital) rounds hold significant stakes. Pre-IPO round investors
      include PuHua Capital (led Round 1 at $163M), Stone UAE, and NGS Super Australia.

      HKEX filings and financial statements were audited by a Big Four auditor. The company
      had no publicly named CFO or independent board directors in materials reviewed as of
      June 2026. Key-person risk is elevated on both Wan Jun (external relationships, strategy)
      and Tian Shan (full-stack technology architecture). Baidu's white-box Apollo IP license
      creates a strategic dependency that could affect governance if Baidu's stake falls below
      a license threshold.
