  evidenceGaps:
    - id: EGO001
      topic: "Pre-IPO post-money equity valuation"
      description: >-
        No confirmed post-money valuation figure appears in the HKEX application proof or
        any public source reviewed. The implied valuation from round pricing requires access
        to share count and price-per-share data not publicly disclosed.
      relatedQuestionRefs: [QO004]
    - id: EGO002
      topic: "Q1 2026 or H1 2026 revenue and delivery data"
      description: >-
        No public quarterly financial disclosures are available for 2026. The HKEX filing
        covers through December 31, 2025. Updated operational metrics for 2026 have not been
        released in any reviewed source.
      relatedQuestionRefs: [QO016, QO024]
    - id: EGO003
      topic: "Subscription churn rate and ARPU for Tianji Suixing"
      description: >-
        The HKEX application proof discloses the number of activated vehicles and uptake rate
        but does not disclose churn rate, annual revenue per unit (ARPU), or contract tenure
        for the Tianji Suixing subscription, preventing unit economics analysis.
      relatedQuestionRefs: [QO015]
