  - id: section-funding
    title: Funding History, Valuation, and Capital Strategy
    body: >
      DeepWay has raised a total of approximately RMB 3.96B (over $580M USD equivalent)
      across five disclosed rounds: Series A (RMB 460M, Aug 2021), Series A+ (RMB 770M,
      Mar 2023), Series B (RMB 750M, Dec 2024), Pre-IPO Round 1 (~RMB 1.177B, Jan 2026),
      and Pre-IPO Round 2 (total pre-IPO exceeding $310M USD, closed Apr 2026). The Pre-IPO
      Round 1 was the largest single round for an autonomous trucking company globally in
      the five years to 2026, according to company press materials.

      The pre-IPO valuation is not explicitly stated in the application proof; no official
      post-money equity valuation has been confirmed in public sources reviewed. The company
      filed its first HKEX listing application on November 6, 2025 (which expired), and
      refiled on May 7, 2026 with CICC and CMB International as joint sponsors. The IPO
      proceeds are intended to fund vehicle R&D, Changxing Three-Electric Smart Factory
      completion, and overseas market expansion.

      Capital efficiency concern: cumulative net losses exceed RMB 1.7B against a gross
      margin of 4.9% in 2025. The R&D expenditure was RMB 386.6M in 2025 (9.8% of revenue),
      and the company would need material margin expansion to achieve profitability at scale.
      An adverse analysis notes that the $173M and $310M figures refer to Round 1 and
      cumulative pre-IPO totals respectively—a distinction frequently blurred in press
      coverage that may mislead investors about round sizing.
