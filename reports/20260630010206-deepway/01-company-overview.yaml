  - id: section-milestones
    title: Milestones, Scale, and Market Presence
    body: >
      DeepWay's milestone arc spans from a two-party joint-venture announcement in late 2020
      through commercial truck deliveries (first to CATL for trunk transport in June 2022),
      overseas market entry in Thailand (September 2024), and a pre-IPO institutional round
      exceeding $310M in April 2026. The company accumulated over 200M autonomous-driving
      kilometers across its fleet and 400+ service centres nationwide.

      The 2025 operating year was a step-change: deliveries grew 167% to 8,020 units,
      operating cash flow turned positive, and the Pre-IPO rounds brought in global
      institutional capital. The Tianji Suixing L2 ADAS subscription crossed 7,500 active
      vehicles. Overseas commercial operations now span Thailand, Australia, Malaysia,
      Singapore, New Zealand, Kazakhstan, and the UAE, with the first overseas commercial
      operation commencing in Thailand in September 2024.

      Intellectual property: DeepWay held 195 patents, 265 trademarks, and 108 software
      copyrights as of December 31, 2025. Road-test licences for L4 autonomous operation
      were obtained in Beijing and Tianjin. The Tianji Yanxing IPTS platooning system
      entered commercial service in 2023.

      Key customer risk: the top-5 customer concentration ratio was 39.5% in 2025 (improved
      from 82.5% in 2023), and the single largest customer accounted for 12.7% of 2025
      revenue, creating meaningful revenue concentration.
