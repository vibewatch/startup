company:
  name: DeepWay
chapter:
  number: 1
  title: Company Overview
  summary: >-
    DeepWay Technology Co., Ltd. (深向科技有限公司) is a Hefei-based Chinese developer and
    manufacturer of forward-engineered smart new-energy heavy-duty trucks, co-founded in 2020
    by Baidu and Lionbridge Group. The company sells the Xingchen (Star) and Xingtu (StarWay)
    tractor platforms and monetises the proprietary Tianji autonomous-driving suite through
    hardware bundling and software subscriptions. Deliveries tripled to 8,020 vehicles in 2025,
    revenue nearly doubled to RMB 3,961M (~$582M), and cash flow from operations turned
    positive. However, cumulative net losses exceed RMB 1.7B, gross margin is only 4.9%, and
    DeepWay is mid-way through a Hong Kong IPO process (refiled May 2026 after an earlier
    filing lapsed). The pre-IPO round raised over $310M from global institutional investors
    including Stone UAE and NGS Super Australia. Key diligence questions centre on the
    credible path to profitability at scale, Baidu's strategic role post-IPO, and whether
    the Level 4 Duxing system can reach commercial deployment on its stated roadmap.

sections:
  - id: section-identity
    title: Identity, Business Model, and Strategic Context
    body: >
      DeepWay Technology Co., Ltd. was incorporated in July 2020 as a joint venture between
      Baidu, Inc. and Lionbridge Financial Leasing Group. The company is headquartered in
      Hefei, Anhui Province, China (Hefei headquarters formally established November 2023)
      with R&D operations in Beijing and assembly plants operated through contract
      manufacturing partners. The corporate website and HKEX application proof describe
      DeepWay's mission as developing "smart NEV heavy-duty trucks" that are forward-engineered
      from blank-sheet for electric powertrains and L2–L4 autonomous driving, rather than
      converting diesel incumbents.

      The business model has three intended phases. Phase 1 (current primary driver): vehicle
      sales of the Xingchen and Xingtu tractor series, with hardware revenue comprising over
      97% of 2025 revenue. Phase 2 (scaling): Tianji software subscriptions—the Suixing L2
      ADAS subscription (priced at RMB 3,000–5,000 per year) had over 7,500 activated
      vehicles and a 30%+ uptake rate as of the May 2026 filing. Phase 3 (target from
      2027+): the Tianji Duxing Level 4 single-vehicle autonomous freight network, currently
      in development. The company also operates Tianji Tianshu, a fleet management SaaS.

      As of December 31, 2025, DeepWay had delivered 11,531 vehicles cumulatively (509 in
      2023, 3,002 in 2024, 8,020 in 2025), ranking #9 in China's NEV heavy-duty truck market
      for 2025. Revenue was RMB 3,961.1M (~US$582M) in 2025, representing 101% year-on-year
      growth. Net loss narrowed to RMB 649.1M in 2025 (from RMB 675.1M in 2024), while
      operating cash flow turned positive at RMB 835.2M. Gross margin improved to 4.9%
      (from 0.5% in 2024).
