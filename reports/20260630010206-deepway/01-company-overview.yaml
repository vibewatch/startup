callouts:
  - calloutType: strength
    title: Forward-Engineering Advantage and Apollo White-Box License
    body: >-
      DeepWay's blank-sheet design approach, combined with exclusive white-box access to
      Baidu's Apollo autonomous driving platform, creates a hardware-software co-design moat
      that diesel-converted competitors cannot easily replicate. The Apollo partnership gives
      DeepWay access to one of China's most mature open-source AV codebases while retaining
      IP freedom to develop proprietary algorithms on top of it.
    claimRefs:
      - CO006
      - CO029
  - calloutType: risk
    title: Thin Gross Margin and Path to Profitability
    body: >-
      A 4.9% gross margin in 2025 means DeepWay loses money on operational expenses even
      when excluding interest and depreciation. With cumulative net losses exceeding RMB 1.7B
      and R&D spend at 9.8% of revenue, the company requires either significant volume scale
      (to spread fixed costs) or successful monetisation of the Tianji software subscription
      stack to reach unit economics that support profitability. The gap between vehicle-margin
      and software-margin is the central financial risk.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO032
  - calloutType: risk
    title: "Adverse Analysis: Funding Figure Confusion and L4 Timeline Slippage"
    body: >-
      An independent competitive analysis (robotics.press, June 2026) flags that the $173M
      and $310M pre-IPO figures refer to Round 1 and cumulative totals respectively, a
      distinction frequently obscured in secondary coverage. The same analysis questions
      whether Duxing L4 commercial deployment timelines were pushed from the original
      2025 target and notes that no firm commercial launch date for L4 solo operations
      has been set in the May 2026 HKEX filing.
    claimRefs:
      - CO032
      - CO039

