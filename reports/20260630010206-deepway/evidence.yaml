evidenceGaps:
  - id: EGO001
    topic: Pre-IPO post-money equity valuation
    description: >-
      No confirmed post-money valuation figure appears in the HKEX application proof or any public source reviewed. The
      implied valuation from round pricing requires access to share count and price-per-share data not publicly
      disclosed.
    relatedQuestionRefs:
      - QO004
  - id: EGO002
    topic: Q1 2026 or H1 2026 revenue and delivery data
    description: >-
      No public quarterly financial disclosures are available for 2026. The HKEX filing covers through December 31,
      2025. Updated operational metrics for 2026 have not been released in any reviewed source.
    relatedQuestionRefs:
      - QO016
      - QO024
  - id: EGO003
    topic: Subscription churn rate and ARPU for Tianji Suixing
    description: >-
      The HKEX application proof discloses the number of activated vehicles and uptake rate but does not disclose churn
      rate, annual revenue per unit (ARPU), or contract tenure for the Tianji Suixing subscription, preventing unit
      economics analysis.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      DeepWay has not publicly disclosed clean per-vehicle, per-subscription, or per-route unit economics that would
      allow an outside analyst to test gross margin progression from truck hardware into assisted-driving and L4
      operations.
    whyItMatters: >-
      Without unit economics, the market opportunity can look attractive while the business model remains
      value-destructive; investors cannot tell whether subscription and freight-service layers actually overcome OEM
      capital intensity.
    diligencePath: >-
      Request management disclosure on vehicle gross margin, subscription ARPU, subscription retention, and pilot-route
      unit economics; cross-check against HKEX roadshow materials or investor education after listing.
    relatedQuestionRefs:
      - QM013
      - QM026
    relatedTableRefs:
      - TM008
  - type: missing-source
    severity: material
    topic: corridor-sam
    missingEvidence: >-
      Public sources do not provide a precise corridor-by-corridor inventory of where autonomous heavy-duty trucks are
      currently permitted, how many vehicles are authorized, or what freight density exists in each approved geography.
    whyItMatters: >-
      DeepWay's actual SOM depends on live regulatory permissions and route density, not on China-wide freight or AV
      totals. The absence of a permit map makes any precise SOM estimate speculative.
    diligencePath: >-
      Build a permit ledger from provincial and municipal transport notices, operator announcements, and pilot-zone
      disclosures; reconcile by corridor, L-level, fleet count, and safety-driver requirement.
    relatedQuestionRefs:
      - QM007
      - QM027
    relatedTableRefs:
      - TM006
      - TM008
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Retained analyst and industry estimates describe different layers of the market — road freight spend, broad AV
      software and hardware, new-energy heavy-duty truck volumes, and autonomous trucking revenue scenarios — but no
      source reconciles them into one decision-grade DeepWay TAM/SAM/SOM framework.
    whyItMatters: >-
      If these methodologies are mixed indiscriminately, valuation can be anchored to an inflated headline TAM or to a
      denominator that has little bearing on DeepWay's corridor-constrained monetization path.
    diligencePath: >-
      Normalize each forecast by geography, year, unit, and scope; request methodology notes from publishers where
      possible and compare them with DeepWay's own market-sizing assumptions in future filing updates.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM002
      - TM007
