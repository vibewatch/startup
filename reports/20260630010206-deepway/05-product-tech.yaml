  - id: tech-architecture
    title: Technology Architecture and Apollo Integration
    body: >-
      DeepWay's most structurally differentiated technical asset is its forward-engineered
      Electrical/Electronic Architecture (EEA). Unlike legacy truck OEMs that retrofit AV
      sensors onto existing diesel platforms, DeepWay's Xingchen chassis was designed from the
      outset for autonomous operation, with centralized domain controllers, redundant power
      networks, and native sensor mounting points. This approach means the vehicle's CAN/Ethernet
      backbone was architected for low-latency AV communication rather than retro-fitted as
      an add-on.

      The standard sensor suite per vehicle comprises 10 cameras (covering surround and forward
      long-range fields of view), 5 millimetre-wave radars, and 3 infrared sensors — 18 sensor
      units in total — providing 360-degree environmental coverage. The onboard computing platform
      delivers 500+ TOPS, sufficient to run real-time perception, prediction, and planning
      simultaneously. DeepWay is the only commercial vehicle company to hold a white-box licence
      to Baidu's Apollo autonomous driving software stack, meaning access to the platform source
      code rather than a compiled API. Apollo provides the mature core perception, prediction,
      and planning pipelines developed over Baidu's decade-plus of AV R&D; DeepWay adds
      commercial-vehicle-specific layers including heavy-truck dynamics models, load/weather
      handling, and driver-assist calibration profiles on top.

      The Three-Electric system (battery pack, drive motor, and motor controller) was designed
      for long-haul heavy freight — the most energy-intensive segment of the commercial vehicle
      market. A dedicated Three-Electric manufacturing facility in Changxing, Zhejiang broke
      ground in February 2025. Until that facility reaches production, assemblies are contracted
      to JAC Motors and Shandong Reach, both established Chinese vehicle manufacturers. DeepWay
      has accumulated more than 200 million autonomous and semi-autonomous kilometres across its
      active fleet as of the May 2026 HKEX filing. The company holds ICV (Intelligent Connected
      Vehicle) road-test licences in Beijing and Tianjin municipalities enabling supervised L4
      development on public roads.
