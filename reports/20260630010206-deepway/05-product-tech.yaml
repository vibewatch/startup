  - id: roadmap-and-IP
    title: IP Portfolio, R&D Investment, and Technology Roadmap
    body: >-
      As of December 31, 2025, DeepWay holds 195 patents, 265 trademarks, and 108 software
      copyrights, a portfolio assembled in under five years of operations. Patent coverage
      spans vehicle hardware (chassis design, Three-Electric components, sensor mounting
      systems), software (perception algorithms, EEA firmware), and system-level innovations
      (platoon coordination protocols, fleet optimization models). R&D investment has grown
      substantially in absolute terms — from RMB 219M in 2023 to RMB 387M in 2025 — while
      declining as a share of revenue as the top line scales (51.5% in 2023, 9.8% in 2025).
      The 412 R&D employees (out of 1,308 total) represent 31.5% of the workforce, a notably
      high ratio for a company delivering physical hardware at volume.

      The technology roadmap follows a three-phase commercialisation trajectory disclosed in
      the HKEX filing: Phase 1 (current) — vehicle sales with Tianji subscription attach;
      Phase 2 — expand the IPTS platoon network to create autonomous-freight corridors;
      Phase 3 — transition to a full L4 autonomous freight network where DeepWay operates
      trucks as a service. The credibility of Phase 3 is constrained by the current
      development-only status of Duxing: no commercial L4 deployment has been announced
      and the HKEX filing discloses no target timeline for commercial L4 operations. The
      open-source nature of the Apollo platform creates both an advantage (proven codebase,
      active ecosystem) and a dependency risk: any change in Baidu's licensing terms for the
      white-box Apollo access would require DeepWay to replace the core AV software stack,
      an undertaking that would consume significant R&D and potentially delay the commercial
      roadmap. Competitive erosion in the L2 ADAS segment from domestic peers (notably HAOMO,
      Hesai, and platform integrators working with SAIC and FAW) represents the nearer-term
      risk to subscription revenue growth.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE031
      - CE032
      - CE034
