      - number: '5.2'
        title: Architecture and integration model
        blocks:
          - type: paragraph
            body: >-
              The public architecture forms a vertically integrated stack. At the bottom are Sunrise
              intelligent-computing chips and boards; above them are Ubuntu- based system software, firmware, hardware
              interfaces, TogetheROS.Bot middleware, algorithm libraries, and development tooling. Preqin separately
              describes a heterogeneous CPU, BPU, and MCU design, while the official developer surface frames RDK as
              hardware, software, algorithms, solutions, and tools. This breadth can shorten prototype assembly because
              developers do not need to source every layer independently. It also creates coupling: firmware, media
              pipelines, drivers, middleware, and model toolchains must remain mutually compatible as hardware and
              software releases evolve.
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
