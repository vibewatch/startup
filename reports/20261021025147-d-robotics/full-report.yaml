chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              D-Robotics supplies the computing layer used by robotics developers rather than primarily building
              complete robots. Its official site describes a development-infrastructure stack spanning computing boards,
              operating systems, and applications, while independent profiles add Sunrise chips, RDK developer kits, and
              software tools. The company was created from Horizon Robotics' AIoT unit in January 2024 and is
              consistently located in Shenzhen in the reviewed company profiles. Preqin describes revenue as coming from
              hardware and software sales, but no cited source breaks out product mix, pricing, recurring software
              revenue, or gross margin. The resulting investment identity is a capital-intensive chip-and-platform
              supplier with an ecosystem strategy, not a pure software company and not a robot OEM.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
          - type: table
            tableRef: TO001
