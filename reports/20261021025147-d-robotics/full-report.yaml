        title: Financing and operating scale
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing sequence accelerated from a reported $100 million Series A in May 2025 to a $120
              million Series B1 tranche in 2026, followed by a report that aggregate Series B funding had reached $270
              million by April 2026. D-Robotics then announced a $400 million Series C on September 17, 2026. These are
