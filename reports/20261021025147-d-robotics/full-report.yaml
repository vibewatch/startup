      - number: '3.3'
        title: Distribution, workflow switching costs, and opaque pricing
        blocks:
          - type: paragraph
            body: >-
              D-Robotics is attempting to turn a component sale into an ecosystem relationship. Its company-issued
              materials pair the RDK toolchain with the D-Robotics Gravity Program, which is said to support product
              development, supply-chain selection, go-to-market work, and fundraising. That combination can create
              workflow-level switching costs because customers adopt tools, algorithms, support processes, and partner
              relationships around the compute layer, not just a chip. The same mechanism is not yet quantified: public
              evidence does not disclose migration effort, retention, multi-homing, exclusive supply terms, realized
              pricing, discounts, minimum commitments, or channel economics. Preqin's profile says the company generates
              revenue from hardware and software, but it does not expose contract structure. Pricing should therefore be
              treated as an underwriting gap rather than inferred from product breadth or funding.
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP009
              - CP012
              - CP015
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The emerging moat case rests on three mutually reinforcing assets: an integrated product stack, a
              developer and university footprint, and support that reaches into supply chain and commercialization. All
              three are primarily supported by company-issued claims, so they show strategic intent and claimed adoption
              rather than verified lock-in. Displacement can come from multiple directions. Horizon's automotive
              relationships and full-stack engineering show how an incumbent can extend adjacent capabilities into
              general robotics; global and domestic chip vendors can compete at the compute layer; and larger OEMs may
              internalize hardware and algorithms to gain control or lower perceived supplier cost. An investor in
              Horizon explicitly identifies in-house OEM development as a threat, while also arguing that vertical
              integration is difficult. The resulting judgment is conditional: D-Robotics has a credible platform shape,
              but durable differentiation requires independently verified benchmarks, production retention, migration
              friction, and commercial terms.
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A broader product boundary than a standalone chip
            body: >-
              D-Robotics' supported differentiation is the combination of compute, development tools, algorithms,
              software, and ecosystem support; the evidence does not yet establish that this bundle outperforms or
              underprices alternatives.
