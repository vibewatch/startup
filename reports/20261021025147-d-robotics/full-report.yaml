  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and developer workflow
        blocks:
          - type: paragraph
            body: >-
              The product is best understood as infrastructure for teams building robots, not as a finished robot. The
              documented RDK family spans X3, X3 Module, X5, and Ultra kits, while third-party profiles describe a wider
              offer combining Sunrise chips, development kits, software, and developer resources. In the customer
              workflow, teams select a board or module, install or update RDK OS, connect sensors and actuators, use
              packaged APIs and robot middleware, and progress from examples toward a customized prototype.
              Company-published projects show that this workflow can support onboard perception and control, but those
              demonstrations are not evidence of production-scale reliability or repeatable customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE011
