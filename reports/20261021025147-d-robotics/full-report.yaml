      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is thin. An independent profile identifies Wang Cong as the former leader of
              Horizon's AIoT and robotics business across product development, marketing, and sales before its spinout.
              Preqin also describes D-Robotics as operating under D-Robotics Holding Limited, an affiliate of Horizon
              Robotics. That relationship matters because Horizon is separately profiled as a Beijing company founded in
              2015 that completed an IPO in October 2024; its valuation, headcount, revenue, and leadership therefore
              cannot be substituted for D-Robotics data. No reviewed source identifies D-Robotics' board chair,
              directors, ownership percentages, or executive bench beyond Wang. Key-person dependence and
              parent-affiliate controls remain material diligence questions rather than resolved facts.
