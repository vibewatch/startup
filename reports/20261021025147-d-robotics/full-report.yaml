              overlap among tranches, disclose secondary components, or provide post-financing cash. The latest
              operating metrics are also company-issued: first-half 2026 revenue grew "several times" year over year,
              cumulative Sunrise shipments exceeded eight million, and the S600 had more than 20 customers within six
              months. None of those statements supplies audited revenue, unit economics, or a confirmed valuation.
