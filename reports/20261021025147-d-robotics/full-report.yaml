      - number: '4.3'
        title: Cost structure and unit economics remain private
        blocks:
          - type: paragraph
            body: >-
              The reviewed sources provide no D-Robotics gross margin, cost of goods sold, foundry or packaging
              economics, inventory position, warranty burden, R&D spend, working-capital cycle, or capital expenditure.
              They also do not disclose customer acquisition cost, payback, sales cycle, channel fees, or software
              attach rates. A third-party profile reports that the former parent, Horizon Robotics, had 2023 operating
              income of CNY 1.55 billion and R&D expense of CNY 2.366 billion, illustrating that advanced chip platforms
              can carry heavy development costs; those figures are not transferable to the spun-out D-Robotics entity.
              Investment underwriting therefore requires a management model that reconciles chip volume, average selling
              price, software revenue, direct costs, and operating cash use.
