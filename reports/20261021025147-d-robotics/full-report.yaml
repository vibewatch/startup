figures:
  - id: FO001
    title: D-Robotics milestone timeline
    type: timeline
    summary: >-
      Public milestones show a rapid two-and-a-half-year path from spinout to Series C, while financial and governance
      disclosure remains limited.
    data:
      items:
        - date: 2024-01
          label: D-Robotics spins out
          detail: The company is reported to have separated from Horizon Robotics' AIoT unit.
          tone: neutral
        - date: 2025-05
