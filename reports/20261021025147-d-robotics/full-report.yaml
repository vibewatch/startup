  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded as robotics development infrastructure: edge-compute chips,
              development kits, operating systems, algorithms, and deployment tooling sold to teams building intelligent
              machines. D-Robotics explicitly does not focus on one complete humanoid or other finished robot, so total
              robot-system revenue would materially overstate its addressable spend. Included demand comes from
              developers and OEMs that buy or integrate compute and software; excluded demand includes actuators,
              batteries, complete robot bodies, installation services, and downstream labor savings. Status-quo
              substitutes include general-purpose processors, internally assembled hardware-software stacks, and
              continued prototype use without a production-grade platform. This boundary is wider than a chip-only
              category but narrower than the global robotics market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses, not a synthetic TAM
        blocks:
          - type: paragraph
            body: >-
              The retained independent sizing evidence establishes category momentum but not D-Robotics' monetizable
              market. DWS reported a global robotics market above $46 billion in 2024 and forecast more than $67 billion
              by 2028 at a 9.94% CAGR; it separately cited autonomous mobile robots growing from under $4 billion in
              2022 to more than $13 billion by 2030. These estimates use different categories and periods and include
              substantial spend outside D-Robotics' infrastructure layer. They therefore cannot be added, nested, or
              converted into SAM or SOM. The most defensible current presentation is a set of boundary-aware sizing
              lenses alongside company adoption indicators, with the missing infrastructure-spend denominator treated as
              a material gap.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
