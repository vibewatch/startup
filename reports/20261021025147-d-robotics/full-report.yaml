              - CE006
              - CE009
              - CE012
              - CE013
      - number: '5.3'
        title: Maturity, reliability, and support evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity evidence is operational rather than commercial. Public manuals cover environment
              setup, system customization, application development, algorithm tooling, robot development, FAQs, and
              release notes. The X5 release history records fixes to boot behavior, media pipelines, ROS component
              loading, inference-latency statistics, networking, CAN, displays, and camera support. That transparency is
              useful because it exposes real integration failure modes and shows continuing maintenance. It also limits
              the underwriting conclusion: release-note remediation demonstrates a functioning engineering process, not
              a field-availability target, mean time between failures, lifecycle-support commitment, or validated
              deployment quality across customer environments.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
              - CE015
      - number: '5.4'
        title: Differentiation and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              D-Robotics' differentiation is the combination of proprietary accelerator architecture, development
              hardware, software, and a robotics-specific ecosystem rather than a single component. A company-published
              community surface supplies project examples and thus provides a limited developer- signal proxy, while
              independent profiles corroborate the integrated product positioning. The evidence remains asymmetric:
              specifications and examples are detailed, but independent benchmark methodology, secure-development
              controls, certification status, vulnerability disclosure, support service levels, silicon manufacturing
              dependencies, and production deployment telemetry are not established by the assigned public sources.
              Investment diligence should therefore treat technical breadth as credible and production robustness as
              unverified.
            claimRefs:
              - CE001
              - CE008
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Prototype breadth is not production assurance
            body: >-
              Public release notes identify thermal, firmware, driver, media, and middleware failure modes, while the
              reviewed sources provide no formal security certification, reliability SLO, or independent benchmark
              package.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a multi-layer customer base rather than a single buyer persona. Robotuo
              describes D-Robotics as an infrastructure supplier to research institutions, commercial robot developers,
              and individual makers, with applications spanning humanoids, quadrupeds, service robots, logistics AMRs,
              cleaners, and lawn mowers. D-Robotics itself describes collaborations with OEMs and partners in humanoid,
              companion, vacuum-cleaning, and lawn-mowing robots. These sources support a segmentation of developers,
              institutions, and OEMs, but they do not identify who signs contracts, whether chips or software drive
              billings, or how strategic value differs by segment. The public record is therefore useful for mapping
              users and use cases, not for sizing segment revenue.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption evidence is product-level rather than financial. Ziprobotic reports that
              cumulative Sunrise-series shipments exceeded 8 million units by mid-2026, that D-Robotics said the S600
              gained more than 20 customers in its first six months, and that the wider ecosystem included more than 500
              robotics companies, 500 universities, and 100,000 developers across more than 20 countries. It also names
              eight robotics companies associated with the customer base. These are substantial reach indicators, yet no
              cited source supplies a common starting date, active-versus-cumulative denominator, contract value, or
              deployment status. Shipments cannot be treated as active robots, paying customers, or recurring revenue
              without those missing bridges.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU007
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public proof weakens materially after initial adoption. No retained source reports NRR, GRR, churn,
              renewals, contract duration, repeat-purchase cohorts, customer satisfaction, or customer-level revenue.
              Ziprobotic says the customer base is almost entirely domestic and explicitly calls D-Robotics' claimed
              majority share of China's embodied-intelligence market self-reported and unaudited. That combination
              creates two diligence risks: ecosystem breadth may not translate into recurring economics, and domestic
              concentration may limit geographic diversification. The integrated chip, kit, software, and
              OEM-collaboration model provides a plausible expansion path, but the sources do not show that customers
              actually move through it or expand spend.
            claimRefs:
              - CU009
              - CU010
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU005
              - CU016
      - number: '6.4'
        title: What adjacent evidence does and does not prove
        blocks:
          - type: paragraph
            body: >-
              Horizon Robotics' documented automotive scale is relevant heritage, not customer proof for the spun-out
              D-Robotics entity. A 2026 Baillie Gifford interview attributes 3 million vehicle deployments in the prior
              year to Horizon, while a 2020 report lists major automotive OEM and Tier-1 relationships; neither source
              says those contracts transferred to D-Robotics. Forge likewise profiles Horizon as a smart-mobility and
              autonomous-vehicle company. Broader evidence shows attractive demand but long procurement paths: DWS
              forecasts autonomous-mobile-robot demand growth, while AGCO's competing humanoid deployment remains a
              future pilot even under a commercial agreement. These benchmarks support market interest, not D-Robotics
              retention or production conversion.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption breadth is not yet durable revenue proof
            body: >-
              Shipments, developers, universities, and named logos establish reach, but the retained evidence contains
              no retention metric, customer-level revenue, contract duration, or independently verified production
              outcome.
            calloutType: risk
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is not a single chip-performance issue but the interaction of market access,
              financial opacity, and execution scope. A secondary report says US authorization restrictions now cover
              new foreign-made humanoid and quadruped robots, while D-Robotics says many named S600 adopters are Chinese
              and already in mass production. That creates a route-to-market risk even if the component itself is not
              directly prohibited. The company has also raised $400 million to broaden both silicon and software, yet
              public growth disclosures use relative phrases and percentages without revenue, margin, cash-burn,
              customer-base, or shipment baselines. Fresh capital lowers near-term financing pressure but does not
              establish capital efficiency or durable demand.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              TechTimes reports that the FCC added humanoid and quadruped robots to its Covered List in July 2026 and
              describes the consequence as a block on new import authorizations for affected foreign-made products. The
              same report distinguishes end products from chips, so the evidence does not support calling Sunrise
              silicon directly banned. The practical risk is indirect: Chinese robot OEMs powered by the chip may lose
              US market access, and US OEMs may face additional supply-chain scrutiny. No allocated primary FCC, court,
              patent, privacy, certification, sanctions, or export-control record establishes D-Robotics' exact
              obligations. The legal posture therefore remains material but only partly verified, and investment
              approval should require counsel-reviewed primary records rather than rely on one news account.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR008
      - number: '7.3'
        title: Operating, technical, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              D-Robotics is attempting to support chips, developer kits, operating systems, algorithms, and applications
              across humanoid, quadruped, logistics, service, companion, and research use cases. That breadth multiplies
              qualification, safety, integration, and support paths. Public descriptions also identify deep technical
              ties to Horizon Robotics, including optimization for Horizon-origin models, but do not disclose IP
              licenses, service agreements, or separation protections. Management's D-Robotics Gravity Program is a
              sensible mitigation because it explicitly supports product development, supply-chain selection,
              go-to-market work, and fundraising. It remains company-reported, however. Sector testimony also identifies
              compact batteries and energy-consuming architectures as unresolved robotics constraints, while
              cross-vendor compute figures use unlike precision and sparsity conventions.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR009
              - CR014
      - number: '7.4'
        title: Financial model risk, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Standalone D-Robotics revenue, gross margin, burn, working capital, inventory, customer concentration, and
              cash runway are not disclosed in the allocated evidence. The available signals are directionally positive
              but difficult to underwrite: company materials say revenue grew several times year over year, while
              another report cites 180% shipment growth and 200% customer growth but notes that total volumes and
              revenue were not disclosed. Horizon's historical R&D spending and fundraising illustrate the capital
              intensity of integrated chip-and-software development, not D-Robotics' own economics. Thesis-break
              triggers should therefore include loss of US authorization routes for major customers, failure to
              reconcile growth percentages with audited absolute figures, concentration in a few OEMs or suppliers, or
              inability to document arm's-length IP and service arrangements with Horizon.
            claimRefs:
              - CR004
              - CR007
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory evidence is secondary
            body: >-
              Treat reported US restrictions as a material diligence trigger, not as a fully verified legal conclusion,
              until primary FCC records and counsel confirm scope, timing, affected products, and component-level
              implications.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Gate conviction on absolute operating data
            body: >-
              Do not convert percentage growth, cumulative shipments, or a large funding round into a conclusion about
              margin, cash runway, customer concentration, or repeat demand without audited absolute figures and
              cohort-level support.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track/research-more, with medium-low confidence and high underwriting risk. The
              positive case is not capital scarcity: D-Robotics closed a $400 million Series C in September 2026, and
              independent coverage reported nearly RMB4.5 billion raised during 2026. The constraint is price discovery.
              Multiples reports a $450 million valuation for the May 2025 Series A but leaves the September 2026 Series
              C valuation undisclosed. That makes the latest financing amount unusable as a proxy for enterprise value
              or post-money equity value. An investor should therefore avoid a valuation conclusion based on capital
              raised, shipment counts, or qualitative revenue growth alone. The call can move toward invest only after
              the current price, fully diluted ownership, audited revenue and gross margin, cash burn, and preference
              stack are verified.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and recommendation logic
        blocks:
          - type: paragraph
            body: >-
              The thesis is that D-Robotics may become a horizontal computing layer for robotics rather than a
              single-product robot vendor. Its own release says first-half 2026 revenue grew several times year over
              year, cumulative Sunrise shipments exceeded 8 million, and the S600 won more than 20 customers within six
              months, with a majority already in mass production. Independent profiles also describe the company as an
              infrastructure provider supplying chips, development kits, and software. The anti-thesis is that these are
              predominantly company-originated operating claims without disclosed revenue, margin, retention,
              concentration, or unit-economics denominators. Strong ecosystem activity may precede durable monetization,
              while a large financing can mask capital intensity. The recommendation logic therefore treats adoption as
              proof of relevance, not proof of an attractive security price.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV011
              - CV016
      - number: '8.3'
        title: Bull, base, and bear framework without false precision
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple valuation is premature because no audited revenue or EBITDA base is
              available in the reviewed evidence. The public comparison set is also too heterogeneous to supply a clean
              anchor: Multiples shows last-fiscal-year EV/revenue figures ranging from 1.0x for ECARX to 29.9x for Xtend
              AI Robotics, while Horizon Robotics has a much larger listed valuation but an automotive ADAS focus that
              differs from D-Robotics' robotics-infrastructure scope. Accordingly, the scenarios use evidence thresholds
              rather than invented dollar ranges. The bull case requires audited conversion of deployments into
              recurring or repeatable revenue and margins; the base case preserves tracking status until those economics
              and the entry price are known; the bear case is triggered by weak conversion, concentration, a punitive
              preference stack, or a financing-led valuation unsupported by operating cash generation.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              D-Robotics remains privately held, and the reviewed sources disclose neither an IPO timetable nor
              observable secondary-market pricing. Forge's general private-market disclosure is directionally relevant:
              private securities are highly illiquid and no market is guaranteed to develop. Exit readiness should
              therefore be judged through milestones rather than a calendar assumption. Required diligence is the
              September 2026 capitalization table, liquidation preferences and anti-dilution rights, audited 2025 and
              2026 financials, customer-level shipment and revenue concentration, foundry commitments, and a
              board-approved financing and exit plan. Thesis-break triggers are a down round, revenue conversion
              materially below shipment growth, gross-margin compression inconsistent with an infrastructure platform,
              dependence on a small set of OEM programs, or restrictions that impair chip supply or international
              distribution.
            claimRefs:
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides headline scale
            body: >-
              Treat the $400 million Series C as evidence of financing access, not evidence of value. Without the round
              valuation, fully diluted ownership, audited economics, and preference stack, the only defensible stance is
              track/research-more.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV016
