      - number: '4.4'
        title: New capital delays, but does not answer, the runway question
        blocks:
          - type: paragraph
            body: >-
              D-Robotics announced a US$400 million Series C in September 2026 and said the proceeds would expand the
              Sunrise portfolio and an end-to-end software platform. That is financing raised, not disclosed cash on
              hand: the retained evidence provides no closing balance sheet, debt obligations, monthly burn, runway, or
              next-round trigger. It also leaves the latest valuation publicly undisclosed. The financial verdict is
              therefore mixed. Product breadth, reported shipment scale, customer adoption, and fresh financing support
              a credible commercialization path, while the absence of absolute revenue, margins, unit economics, and
              cash-flow data blocks a conventional quality-of- revenue or capital-adequacy assessment. A data-room
              review should be a condition of any valuation conclusion, not a post-investment workstream.
            claimRefs:
