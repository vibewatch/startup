        title: Traction signals are substantial but mostly company-reported
        blocks:
          - type: paragraph
            body: >-
              D-Robotics reported that first-half 2026 revenue grew several times year-over-year, cumulative Sunrise
              shipments exceeded eight million, and the S600 reached more than twenty embodied-AI customers within six
              months, with most named projects in mass production. These are meaningful commercialization signals, but
              neither the revenue base nor the period shipment count is disclosed, and cumulative chip shipments must
              not be confused with robot units or current-period sell-through. The go-to-market system also includes a
              developer ecosystem and the Gravity Program, which the company says provides product, supply-chain, GTM,
              and fundraising support. This can seed design-ins, yet public evidence does not quantify sales cycles,
              channel economics, conversion, or customer concentration.
