              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The user base spans individual developers, universities, research institutions, commercial development
              teams, and robot OEMs. The likely payer changes with maturity: makers and laboratories buy development
              kits, while product or engineering organizations at robot manufacturers procure production hardware and
              software. Preqin describes the products as tools for prototyping, product development, performance
              evaluation, and verification; D-Robotics' own disclosures then point to customer adoption and mass
              production. This supports a staged path from evaluation to design-in and volume deployment, but public
              sources do not identify contract values, purchasing authorities, procurement cycles, or whether software
              is licensed separately from hardware. Those omissions prevent a bottom-up spend model.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM013
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by expanding robot categories, growing AMR adoption, pressure to localize Chinese
              semiconductor supply, and the economic appeal of reusing one development platform across multiple form
              factors. D-Robotics reports more than 100,000 developers, more than 500 universities, and over 20
              countries on its platform, while its S600 reached more than 20 customers within six months; these are
              useful distribution and design-in signals, not proof of recurring revenue or durable share. Constraints
              are equally important. Robotics lacks a unified form factor, many Chinese humanoid developers reportedly
              use Nvidia as the primary platform, battery capacity and compute efficiency remain technical bottlenecks,
              and production transitions can require customization. Valuation should therefore weight verified
              production revenue and repeat platform purchasing more heavily than broad category forecasts or developer
              registrations.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad market growth is not a company revenue forecast
            body: >-
              Fragmented robot form factors, Nvidia-centered workflows, and unresolved power constraints can slow
              standardization. Underwrite D-Robotics against verified production revenue, repeat purchases, and gross
              margin rather than applying broad robotics-market growth directly.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              D-Robotics competes for the compute-and-development layer rather than for the finished robot. The
              practical landscape therefore includes more than direct chip peers: NVIDIA Jetson and domestic SoC vendors
              are component or platform substitutes; Horizon Robotics is an adjacent full-stack incumbent with shared
              lineage and an expressed ambition to support broader robotics; vertically integrated OEM teams can build
              internally; and robot makers can retain their existing heterogeneous stacks. Independent directories
              describe D-Robotics as an enabling infrastructure supplier, while lower-reputation market profiles name
              Rockchip, Allwinner, Black Sesame, Horizon, and NVIDIA as alternatives. Those names establish a plausible
              comparison set, not relative product superiority. The evidence-backed map below scores only how much the
              assigned sources demonstrate integration and robotics-specific ecosystem breadth; it is not a benchmark of
              performance, market share, or price.
            claimRefs:
              - CP006
