      - number: '3.2'
        title: Capability breadth is visible; comparative advantage is not
        blocks:
          - type: paragraph
            body: >-
              The clearest supported distinction is product scope. D-Robotics' own materials describe an integrated
              infrastructure spanning Sunrise chips, RDK hardware, software, algorithms, solutions, and development
              tools. A third-party profile similarly frames the company as a foundation for multiple robot types rather
              than a complete humanoid vendor. Company-issued releases report more than 20 S600 adopters within six
              months and an installed developer base above 100,000, but the retained pool contains no independent
              latency, power-efficiency, reliability, software-portability, or total-cost benchmark against competing
              platforms. Horizon provides the strongest adjacent proof point for the full-stack model: its CEO describes
              co-designing hardware and software, while historical reporting places Black Sesame, Huawei, NVIDIA, and
              Intel's Mobileye in the broader Chinese AI-chip contest. Unsupported matrix cells remain explicitly
              unknown.
