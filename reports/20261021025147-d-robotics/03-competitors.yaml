  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing"
      missingEvidence: "Comparable list and realized prices, contract units, discounts, support fees, minimum commitments, and total cost of ownership."
      whyItMatters: "Without commercial terms, diligence cannot test price advantage, software attach, margin quality, or customer payback against alternatives."
      diligencePath: "Request current price books, anonymized contracts, discount schedules, support terms, and matched competitor quotes for representative deployments."
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: "missing-source"
      severity: "material"
      topic: "comparative-benchmarks"
      missingEvidence: "Independent, workload-matched benchmarks for latency, power, reliability, model support, software portability, and system cost."
      whyItMatters: "The retained sources establish product breadth but cannot demonstrate technical superiority or durable differentiation."
      diligencePath: "Commission reproducible tests on matched robot workloads and obtain customer reference calls that compare deployed alternatives."
      relatedQuestionRefs: [QP003, QP006]
      relatedTableRefs: [TP002]
    - type: "missing-source"
      severity: "material"
      topic: "switching-cost"
      missingEvidence: "Cohort retention, multi-homing, migration effort, exclusive supply terms, and independent production-volume evidence."
      whyItMatters: "Developer registrations and named adopters do not establish repeat purchasing, lock-in, or production durability."
      diligencePath: "Review customer cohorts and renewal or repeat-order data, then interview churned, multi-homing, and scaled-production customers."
      relatedQuestionRefs: [QP005, QP007]
      relatedTableRefs: [TP001, TP002]
