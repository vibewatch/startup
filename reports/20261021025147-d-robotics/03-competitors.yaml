    title: "Capability evidence matrix"
    columns:
      - "Buying criterion"
      - "D-Robotics"
      - "Horizon Robotics"
      - "NVIDIA Jetson"
      - "Domestic general SoCs"
      - "Internal build"
    rows:
      - ["Chip plus software integration", "Evidenced: company describes chips, kits, software, algorithms, and tools", "Evidenced for automotive: CEO describes joint hardware-software development", "Unknown in assigned evidence", "Unknown in assigned evidence", "Possible, but implementation evidence is buyer-specific"]
      - ["Robotics category breadth", "Company claims humanoid, quadruped, service, companion, logistics, and other applications", "Broader robotics is a stated future ambition; current retained proof is automotive-led", "Unknown in assigned evidence", "Unknown in assigned evidence", "Depends on each OEM's scope"]
      - ["Developer ecosystem", "Company claims 100,000+ developers and 500+ universities across 20+ countries", "No comparable developer metric in assigned evidence", "Unknown in assigned evidence", "Unknown in assigned evidence", "Internal engineering team only"]
      - ["Mass-production evidence", "Company claims 20+ S600 adopters within six months and majority in mass production", "Automotive deployment is described, but not directly comparable with general robotics", "Unknown in assigned evidence", "Unknown in assigned evidence", "No cross-buyer evidence"]
      - ["Public comparative benchmark", "Unavailable", "Unavailable", "Unavailable", "Unavailable", "Unavailable"]
    notes: >-
      "Evidenced" means the retained source states the capability; it does not mean independently
      benchmark-verified. Unknown cells preserve missing evidence rather than implying absence.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Alternative"
      - "Observed package"
      - "Public price / unit"
      - "Contract model"
      - "Investment implication"
    rows:
      - ["D-Robotics", "Sunrise chips, RDK kits, software platform, algorithms, and DGP support", "Unknown in assigned evidence", "Hardware and software sales reported; terms undisclosed", "Cannot test gross-margin quality, discounting, or software attach"]
      - ["Horizon Robotics", "Integrated hardware-software programs for OEMs", "Unknown in assigned evidence", "Co-development relationship described; terms undisclosed", "Customization may deepen relationships but can raise service intensity"]
      - ["NVIDIA Jetson", "Named platform substitute", "Unknown in assigned evidence", "Unknown in assigned evidence", "No defensible total-cost comparison"]
      - ["Domestic SoC vendors", "Chip or embedded-compute alternatives", "Unknown in assigned evidence", "Unknown in assigned evidence", "Potential component-price pressure cannot be quantified"]
      - ["Internal build", "Buyer-owned hardware and software stack", "No transfer price; development cost unknown", "Internal engineering budget", "Control benefit must be compared with time, talent, and execution cost"]
    notes: >-
      No retained source discloses comparable list prices, realized prices, discounts, minimum
      commitments, support fees, or total cost of ownership; all such cells are intentionally unknown.
    claimRefs: [CP002, CP005, CP007, CP009, CP012, CP015, CP016]
figures:
  - id: "FP001"
    title: "Evidence-backed competitive positioning map"
    type: "quadrant"
    summary: >-
      Ordinal coordinates show the strength of retained evidence for integration and
      robotics-specific ecosystem breadth, not product quality or market rank.
    data:
      xAxis:
        label: "Hardware-software integration evidence"
        min: 1
        max: 3
      yAxis:
        label: "Robotics-specific ecosystem evidence"
        min: 1
        max: 3
      points:
        - label: "D-Robotics"
          x: 3
          y: 3
          note: "Company and directory sources describe a full stack and multi-category developer ecosystem."
        - label: "Horizon Robotics"
          x: 3
          y: 2
          note: "Full-stack automotive evidence is strong; broader robotics remains an expressed expansion path."
        - label: "NVIDIA Jetson"
          x: 1
          y: 1
          note: "Named as a competitor, but no comparative capability evidence was retained."
        - label: "Rockchip / Allwinner"
          x: 1
          y: 1
          note: "Named as domestic alternatives without retained robot-platform detail."
        - label: "Black Sesame / Huawei"
          x: 2
          y: 1
          note: "Retained reporting supports adjacent AI-chip activity, not a current robotics benchmark."
        - label: "Internal build"
          x: 2
          y: 1
          note: "Recognized as a control-oriented substitute; implementation evidence is buyer-specific."
    approximationNotes: >-
      Scores are analyst-coded ordinal evidence levels: 1 = named only or unknown, 2 = adjacent or
      partial evidence, 3 = explicit retained evidence. Coordinates are not measured performance,
      share, price, or quality.
    claimRefs: [CP002, CP006, CP007, CP008, CP009, CP010, CP016]
callouts:
  - calloutType: "strength"
    title: "A broader product boundary than a standalone chip"
    body: >-
      D-Robotics' supported differentiation is the combination of compute, development tools,
      algorithms, software, and ecosystem support; the evidence does not yet establish that this
      bundle outperforms or underprices alternatives.
    claimRefs: [CP001, CP002, CP005, CP015]
  - calloutType: "risk"
    title: "The core competitive proof remains private"
    body: >-
      Pricing, benchmark performance, customer retention, migration effort, exclusive supply
      terms, and independently verified production outcomes are absent from the assigned evidence.
    claimRefs: [CP003, CP007, CP010, CP012, CP016]
