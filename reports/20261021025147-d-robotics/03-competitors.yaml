      - ["Horizon Robotics", "Adjacent incumbent and origin company", "IPO completed in October 2024; third-party profiles report public-company scale", "Automotive OEMs, with stated ambition to support broader robotics", "Hardware-software co-design and established OEM relationships", "Assigned evidence does not isolate a current general-robotics product or pricing comparison"]
      - ["NVIDIA Jetson ecosystem", "Global platform substitute", "Not quantified in assigned evidence", "Developers and OEMs needing edge AI compute", "Named as a principal alternative by a retained market profile", "No retained product, price, performance, or customer evidence"]
      - ["Rockchip / Allwinner", "Domestic general-purpose SoC substitutes", "Not quantified in assigned evidence", "Cost-sensitive embedded-device and robot builders", "Named as domestic alternatives by a retained market profile", "No retained robot-specific capability or commercial evidence"]
      - ["Black Sesame / Huawei", "Domestic AI-chip adjacents", "Not quantified in assigned evidence", "Automotive and embedded AI buyers", "Historical independent reporting places both in China's autonomous-chip contest", "No current robot-platform benchmark in the assigned pool"]
      - ["Internal build / status quo", "Buyer-controlled substitute", "Funded from the buyer's own engineering budget", "Large OEMs with chip and algorithm teams", "Maximum control over customization and intellectual property", "Development cost, time, reliability, and migration economics are not disclosed"]
    notes: >-
      Profiles use only the assigned evidence set as of 2026-10-21. Unknown fields are not
      estimates; funding and scale figures retain the source's period and attribution.
    claimRefs: [CP001, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP014]
