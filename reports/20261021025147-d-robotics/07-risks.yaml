company:
  name: D-Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    D-Robotics' most consequential public-evidence risks are US market-access
    exposure through Chinese robot customers, weak visibility into standalone
    economics and dependencies, and the execution burden of supporting chips,
    software, and many robot categories at once. The allocated evidence also
    shows mitigations through fresh capital, mass-production claims, and an
    ecosystem support program, but primary regulatory records, audited
    financials, supplier data, and incident metrics remain unavailable.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >-
      The highest residual exposure is not a single chip-performance issue but
      the interaction of market access, financial opacity, and execution scope.
      A secondary report says US authorization restrictions now cover new
      foreign-made humanoid and quadruped robots, while D-Robotics says many
      named S600 adopters are Chinese and already in mass production. That
      creates a route-to-market risk even if the component itself is not
      directly prohibited. The company has also raised $400 million to broaden
      both silicon and software, yet public growth disclosures use relative
      phrases and percentages without revenue, margin, cash-burn, customer-base,
      or shipment baselines. Fresh capital lowers near-term financing pressure
      but does not establish capital efficiency or durable demand.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR016]
    figureRefs: [FR001]
  - id: regulatory-and-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      TechTimes reports that the FCC added humanoid and quadruped robots to its
      Covered List in July 2026 and describes the consequence as a block on new
      import authorizations for affected foreign-made products. The same report
      distinguishes end products from chips, so the evidence does not support
      calling Sunrise silicon directly banned. The practical risk is indirect:
      Chinese robot OEMs powered by the chip may lose US market access, and US
      OEMs may face additional supply-chain scrutiny. No allocated primary FCC,
      court, patent, privacy, certification, sanctions, or export-control record
      establishes D-Robotics' exact obligations. The legal posture therefore
      remains material but only partly verified, and investment approval should
      require counsel-reviewed primary records rather than rely on one news
      account.
    claimRefs: [CR001, CR002]
    tableRefs: [TR001]
  - id: operating-technical-and-partner-dependencies
    title: Operating, technical, and partner dependencies
    body: >-
      D-Robotics is attempting to support chips, developer kits, operating
      systems, algorithms, and applications across humanoid, quadruped,
      logistics, service, companion, and research use cases. That breadth
      multiplies qualification, safety, integration, and support paths. Public
      descriptions also identify deep technical ties to Horizon Robotics,
      including optimization for Horizon-origin models, but do not disclose IP
      licenses, service agreements, or separation protections. Management's
      D-Robotics Gravity Program is a sensible mitigation because it explicitly
      supports product development, supply-chain selection, go-to-market work,
      and fundraising. It remains company-reported, however. Sector testimony
      also identifies compact batteries and energy-consuming architectures as
      unresolved robotics constraints, while cross-vendor compute figures use
      unlike precision and sparsity conventions.
    claimRefs: [CR005, CR006, CR008, CR009, CR011, CR012, CR013]
    tableRefs: [TR002, TR003]
  - id: financial-model-and-kill-criteria
    title: Financial model risk, monitoring, and kill criteria
    body: >-
      Standalone D-Robotics revenue, gross margin, burn, working capital,
      inventory, customer concentration, and cash runway are not disclosed in
      the allocated evidence. The available signals are directionally positive
      but difficult to underwrite: company materials say revenue grew several
      times year over year, while another report cites 180% shipment growth and
      200% customer growth but notes that total volumes and revenue were not
      disclosed. Horizon's historical R&D spending and fundraising illustrate
      the capital intensity of integrated chip-and-software development, not
      D-Robotics' own economics. Thesis-break triggers should therefore include
      loss of US authorization routes for major customers, failure to reconcile
      growth percentages with audited absolute figures, concentration in a few
      OEMs or suppliers, or inability to document arm's-length IP and service
      arrangements with Horizon.
    claimRefs: [CR004, CR007, CR010, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Regulatory evidence is secondary
    body: >-
      Treat reported US restrictions as a material diligence trigger, not as a
      fully verified legal conclusion, until primary FCC records and counsel
      confirm scope, timing, affected products, and component-level implications.
    claimRefs: [CR001, CR002]
  - calloutType: recommendation
    title: Gate conviction on absolute operating data
    body: >-
      Do not convert percentage growth, cumulative shipments, or a large funding
      round into a conclusion about margin, cash runway, customer concentration,
      or repeat demand without audited absolute figures and cohort-level support.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR016]
