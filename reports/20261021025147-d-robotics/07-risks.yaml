figures:
  - id: FR001
    title: Qualitative residual-risk heatmap
    type: matrix
    summary: >-
      Source-anchored prioritization by potential impact and strength of the
      observed risk signal; positioning is qualitative rather than probabilistic.
    data:
      columns:
        - key: lower-signal
          label: Lower observed signal
          detail: Limited allocated evidence of occurrence
        - key: moderate-signal
          label: Moderate observed signal
          detail: Evidence indicates exposure but leaves material uncertainty
        - key: stronger-signal
          label: Stronger observed signal
          detail: Multiple or direct disclosures indicate exposure
      rows:
        - label: Critical potential impact
          note: Could materially impair market access or product delivery
          values:
            - value: No risk assigned
              note: Blank classification is not evidence of absence
            - value: US market access
              detail: Reported end-product restrictions affect Chinese OEM routes
            - value: Supply-chain opacity
              detail: Foundry and packaging dependencies are undisclosed
        - label: High potential impact
          note: Could materially impair economics, control, or scaling
          values:
            - value: No risk assigned
              note: Blank classification is not evidence of absence
            - value: Horizon / IP dependency
              detail: Technical ties are visible but contract protections are not
            - value: Financial opacity
              detail: Growth is relative while margins, burn, and concentration are absent
        - label: High potential impact — financial model
          note: Could impair capital efficiency or force additional financing
          values:
            - value: No risk assigned
              note: Blank classification is not evidence of absence
            - value: Follow-on capital need
              detail: Chip and software scope is capital intensive while runway is undisclosed
            - value: Absolute economics unavailable
              detail: Revenue, margin, burn, working capital, and concentration are not public
        - label: High potential impact — control and dependency
          note: Could weaken strategic control or interrupt delivery
          values:
            - value: No risk assigned
              note: Blank classification is not evidence of absence
            - value: Horizon relationship
              detail: Technical ties are reported while governing contracts are unavailable
            - value: Supplier concentration
              detail: Foundry, packaging, and memory counterparties are not identified
        - label: Moderate potential impact
          note: Could slow adoption or weaken comparability
          values:
            - value: Compute comparability
              detail: Unlike precision and sparsity metrics limit direct comparison
            - value: Ecosystem support burden
              detail: Many categories and development layers increase support complexity
            - value: No risk assigned
              note: Blank classification is not evidence of absence
        - label: Moderate potential impact — delivery scale
          note: Could raise integration costs or delay customer production
          values:
            - value: No risk assigned
              note: Blank classification is not evidence of absence
            - value: Category breadth
              detail: Many robot types require distinct integration and support paths
            - value: Deployment evidence quality
              detail: Mass-production claims lack independent volume and reliability data
    approximationNotes: >-
      Analyst synthesis of cited evidence; labels are not quantified likelihoods,
      and unavailable data is not scored as zero.
    claimRefs: [CR016]
