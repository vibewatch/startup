  evidenceGaps:
    - type: missing-source
      severity: material
      topic: assurance-gaps
      missingEvidence: >-
        Security certifications, secure-development controls, vulnerability
        disclosure policy, privacy posture, safety case, availability targets,
        and quality-management evidence.
      whyItMatters: >-
        Without formal assurance evidence, prototype capability cannot be
        translated into production readiness for safety- or uptime-sensitive
        robots.
      diligencePath: >-
        Request certification reports, penetration-test summaries, SBOM and
        vulnerability-management procedures, support SLAs, and quality-system
        documentation from management.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: independent-performance
      missingEvidence: >-
        Reproducible third-party benchmarks for latency, throughput, power draw,
        thermal behavior, model accuracy, and total cost across representative
        robotics workloads.
      whyItMatters: >-
        Vendor specifications and project examples cannot establish comparative
        performance or economics against alternative robotics-compute platforms.
      diligencePath: >-
        Commission side-by-side workload testing on production-intent hardware
        using disclosed models, power limits, cooling, and accuracy thresholds.
    - type: private-evidence-only
      severity: material
      topic: supply-and-lifecycle
      missingEvidence: >-
        Foundry, packaging, memory, component-sourcing, yield, inventory,
        export-control, product-lifecycle, and end-of-life commitments.
      whyItMatters: >-
        Hardware availability and support duration can constrain OEM deployment
        even when software and prototype performance are adequate.
      diligencePath: >-
        Review supplier agreements, approved-vendor lists, inventory policy,
        product-change notifications, lifecycle roadmaps, and contingency plans.
