      - [RDK OS and firmware, Boot hardware manage media and expose system services, Compatible miniboot drivers Ubuntu packages and board revisions, Updates can create firmware or hardware compatibility failures]
      - [TogetheROS.Bot middleware, Connect robot software components and packaged functions, ROS component paths drivers codecs and system libraries, Release notes document loading and component defects]
