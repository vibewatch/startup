schemaVersion: "report-v2"
artifact: financials
slug: d-robotics
runDate: 2026-10-21
company:
  name: D-Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    D-Robotics has credible evidence of a mixed chip, developer-kit, and software
    monetization model plus company-reported volume and revenue growth, but public
    evidence still does not expose absolute revenue, realized pricing, margins,
    burn, or runway. The September 2026 financing expands the capital base but
    cannot be treated as cash available without balance-sheet and cash-flow data.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model is visible; revenue quality is not
    body: >-
      Third-party profiles describe D-Robotics as selling Sunrise chips, RDK
      developer kits, and software used to develop intelligent robots, while the
      company's own materials position the offering as integrated
      hardware-software infrastructure. That supports a multi-stream model rather
      than a pure SaaS characterization. Public evidence does not disclose list
      prices, realized average selling prices, software licensing terms, revenue
      mix, contract duration, discounting, or accounting recognition. The key
      underwriting distinction is therefore between an evidenced product set and
      an unevidenced economic model: shipments show distribution, but they do not
      reveal revenue per chip, attach rates, recurring software revenue, or gross
      profit. The revenue bridge below makes those missing conversion steps
      explicit instead of filling them with estimates.
    claimRefs: [CI001, CI002, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-gtm
    title: Traction signals are substantial but mostly company-reported
    body: >-
      D-Robotics reported that first-half 2026 revenue grew several times
      year-over-year, cumulative Sunrise shipments exceeded eight million, and the
      S600 reached more than twenty embodied-AI customers within six months, with
      most named projects in mass production. These are meaningful commercialization
      signals, but neither the revenue base nor the period shipment count is
      disclosed, and cumulative chip shipments must not be confused with robot
      units or current-period sell-through. The go-to-market system also includes
      a developer ecosystem and the Gravity Program, which the company says
      provides product, supply-chain, GTM, and fundraising support. This can seed
      design-ins, yet public evidence does not quantify sales cycles, channel
      economics, conversion, or customer concentration.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010]
  - id: costs-and-unit-economics
    title: Cost structure and unit economics remain private
    body: >-
      The reviewed sources provide no D-Robotics gross margin, cost of goods sold,
      foundry or packaging economics, inventory position, warranty burden, R&D
      spend, working-capital cycle, or capital expenditure. They also do not
      disclose customer acquisition cost, payback, sales cycle, channel fees, or
      software attach rates. A third-party profile reports that the former parent,
      Horizon Robotics, had 2023 operating income of CNY 1.55 billion and R&D
      expense of CNY 2.366 billion, illustrating that advanced chip platforms can
      carry heavy development costs; those figures are not transferable to the
      spun-out D-Robotics entity. Investment underwriting therefore requires a
      management model that reconciles chip volume, average selling price, software
      revenue, direct costs, and operating cash use.
    claimRefs: [CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: New capital delays, but does not answer, the runway question
    body: >-
      D-Robotics announced a US$400 million Series C in September 2026 and said the
      proceeds would expand the Sunrise portfolio and an end-to-end software
      platform. That is financing raised, not disclosed cash on hand: the retained
      evidence provides no closing balance sheet, debt obligations, monthly burn,
      runway, or next-round trigger. It also leaves the latest valuation publicly
      undisclosed. The financial verdict is therefore mixed. Product breadth,
      reported shipment scale, customer adoption, and fresh financing support a
      credible commercialization path, while the absence of absolute revenue,
      margins, unit economics, and cash-flow data blocks a conventional quality-of-
      revenue or capital-adequacy assessment. A data-room review should be a
      condition of any valuation conclusion, not a post-investment workstream.
    claimRefs: [CI003, CI004, CI015]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value or status
      - Evidence quality
      - Diligence ask
    rows:
      - [Sunrise chips, Hardware sale, Chip, "8M+ cumulative shipments company-reported; period revenue unavailable", "High confidence in the claim; economics unverified", "Invoice-level units, ASP, returns, inventory, and customer concentration"]
      - [RDK developer kits, Hardware sale, Kit, "Products evidenced; public price and volume unavailable", "Medium", "SKU price list, realized ASP, unit volumes, and gross margin"]
      - [Software platform, "License, support, or bundle mechanism not disclosed", "Contract or seat unknown", "Software offering evidenced; monetized mix unavailable", "Medium on offering; low on economics", "Contracts, attach rate, recurring share, renewal, and recognition policy"]
      - [Gravity Program, "Ecosystem and GTM enablement; direct monetization not evidenced", "Program participant", "500+ innovators company-reported", "Medium", "Program P&L, conversion to paying customers, subsidy level, and strategic return"]
    notes: >-
      Stream existence is drawn from retained official and independent sources;
      values are company-reported where noted, and unavailable fields are not
      estimated.
    claimRefs: [CI001, CI002, CI006, CI009, CI011]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offering
      - Price or unit
      - Contract model
      - List versus realized
      - Public status
      - Underwriting implication
    rows:
      - [Sunrise chips, "Per-chip price unavailable", "Purchase terms unavailable", "Both unavailable", "No retained source discloses terms", "Revenue cannot be derived from cumulative shipments"]
      - [RDK kits, "Per-kit price unavailable", "Direct and channel mix unavailable", "Both unavailable", "No retained source discloses terms", "Developer adoption cannot be converted to kit revenue"]
      - [Software, "License metric unavailable", "Standalone versus bundled unknown", "Both unavailable", "No retained source discloses terms", "Recurring revenue and software margin cannot be tested"]
      - [DGP support, "Fee or subsidy unavailable", "Program economics unknown", "Not applicable without a price", "Support scope disclosed, monetization absent", "Treat as GTM investment until economics are provided"]
    notes: >-
      This is a disclosure-gap table, not a pricing estimate; null economics mean
      unavailable in the assigned public evidence rather than zero.
    claimRefs: [CI001, CI002, CI009, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Absolute revenue, Unavailable, Medium, "Anchors growth and valuation", "Monthly revenue by stream and geography for 2024-2026"]
      - [Gross margin, Unavailable, Medium, "Tests chip and software contribution economics", "Gross margin bridge by SKU and software line"]
      - [CAC and payback, Unavailable, Medium, "Tests efficiency of OEM and developer acquisition", "Fully loaded CAC, sales cycle, and payback by segment"]
      - [Software attach and recurrence, Unavailable, Medium, "Determines quality and durability of revenue", "Attach, ARR, renewal, churn, and standalone versus bundled terms"]
      - [Cash burn and runway, Unavailable, Medium, "Determines financing dependency", "Closing cash, monthly net burn, debt schedule, and base/downside runway"]
      - [Working capital and capex, Unavailable, Medium, "Tests inventory and manufacturing cash needs", "Inventory aging, receivables, payables, commitments, and capex plan"]
      - ["Former-parent R&D intensity", "CNY 2.366B R&D expense versus CNY 1.55B operating income in 2023", Low, "Illustrative only; not D-Robotics economics", "D-Robotics standalone R&D, capitalization policy, and allocation history"]
    notes: >-
      Unavailable means the metric was not disclosed in the retained chapter
      sources. The Horizon Robotics row is a non-transferable parent comparator,
      not an estimate of D-Robotics results.
    claimRefs: [CI004, CI005, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the customer, product, and relative-growth stages,
      while pricing, recognition, gross profit, and cash conversion remain open.
    data:
      nodes:
        - id: demand
          label: Robot developers and OEMs
          detail: "Developers, universities, and embodied-AI manufacturers are the evidenced user base."
        - id: hardware
          label: Chips and RDK kits
          detail: "Hardware sales are the clearest reported monetization mechanism."
        - id: software
          label: Software platform
          detail: "Software is part of the offer, but standalone or bundled terms are not disclosed."
        - id: contracts
          label: Pricing and contracts
          detail: "ASP, discounts, contract length, channel fees, and recognition terms are unavailable."
        - id: revenue
          label: Revenue
          detail: "Only relative first-half 2026 growth is disclosed; the absolute base is unavailable."
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: "Margin, working capital, burn, and runway are unavailable."
    approximationNotes: >-
      Ordered conceptual flow only; no conversion rates, revenue values, or
      margins are estimated.
    claimRefs: [CI001, CI002, CI005, CI011, CI012]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: >-
      The US$400 million Series C is a financing event. Without closing cash,
      debt, commitments, and burn, it does not establish cash available or the
      number of months the company can operate before another raise.
    claimRefs: [CI003, CI004]
