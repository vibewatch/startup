artifact: customers
slug: d-robotics
runDate: 2026-10-21
company:
  name: D-Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    D-Robotics has meaningful adoption signals—more than 8 million cumulative Sunrise chip
    shipments, more than 20 reported S600 customers in six months, and a broad developer
    ecosystem—but public evidence does not establish production status, retention, customer
    outcomes, or revenue concentration. The customer case therefore remains credible at the
    reach and design-win level but unproven at the durable-revenue level.
sections:
  - id: customer-base
    title: Customer base and buying surfaces
    body: >-
      Public evidence points to a multi-layer customer base rather than a single buyer persona.
      Robotuo describes D-Robotics as an infrastructure supplier to research institutions,
      commercial robot developers, and individual makers, with applications spanning humanoids,
      quadrupeds, service robots, logistics AMRs, cleaners, and lawn mowers. D-Robotics itself
      describes collaborations with OEMs and partners in humanoid, companion, vacuum-cleaning,
      and lawn-mowing robots. These sources support a segmentation of developers, institutions,
      and OEMs, but they do not identify who signs contracts, whether chips or software drive
      billings, or how strategic value differs by segment. The public record is therefore useful
      for mapping users and use cases, not for sizing segment revenue.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest current adoption evidence is product-level rather than financial.
      Ziprobotic reports that cumulative Sunrise-series shipments exceeded 8 million units by
      mid-2026, that D-Robotics said the S600 gained more than 20 customers in its first six
      months, and that the wider ecosystem included more than 500 robotics companies, 500
      universities, and 100,000 developers across more than 20 countries. It also names eight
      robotics companies associated with the customer base. These are substantial reach
      indicators, yet no cited source supplies a common starting date, active-versus-cumulative
      denominator, contract value, or deployment status. Shipments cannot be treated as active
      robots, paying customers, or recurring revenue without those missing bridges.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Public proof weakens materially after initial adoption. No retained source reports NRR,
      GRR, churn, renewals, contract duration, repeat-purchase cohorts, customer satisfaction, or
      customer-level revenue. Ziprobotic says the customer base is almost entirely domestic and
      explicitly calls D-Robotics' claimed majority share of China's embodied-intelligence
      market self-reported and unaudited. That combination creates two diligence risks: ecosystem
      breadth may not translate into recurring economics, and domestic concentration may limit
      geographic diversification. The integrated chip, kit, software, and OEM-collaboration
      model provides a plausible expansion path, but the sources do not show that customers
      actually move through it or expand spend.
    claimRefs: [CU009, CU010, CU016]
    figureRefs: [FU001]
  - id: contextual-benchmarks
    title: What adjacent evidence does and does not prove
    body: >-
      Horizon Robotics' documented automotive scale is relevant heritage, not customer proof for
      the spun-out D-Robotics entity. A 2026 Baillie Gifford interview attributes 3 million
      vehicle deployments in the prior year to Horizon, while a 2020 report lists major
      automotive OEM and Tier-1 relationships; neither source says those contracts transferred
      to D-Robotics. Forge likewise profiles Horizon as a smart-mobility and autonomous-vehicle
      company. Broader evidence shows attractive demand but long procurement paths: DWS forecasts
      autonomous-mobile-robot demand growth, while AGCO's competing humanoid deployment remains
      a future pilot even under a commercial agreement. These benchmarks support market interest,
      not D-Robotics retention or production conversion.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
