    title: Customer evidence ladder and expansion path
    type: journey-map
    summary: >-
      Public evidence is strongest at ecosystem reach and cumulative shipment stages, while
      production conversion, outcomes, renewal, and spend expansion remain unverified.
    data:
      nodes:
        - id: developer-discovery
          label: Developer discovery
          detail: "Public resources and RDK kits address individual makers, universities, and commercial development teams."
          evidenceStatus: supported
        - id: prototype
          label: Prototype and evaluation
          detail: "Research and commercial teams can use chips, kits, and software for perception, computation, and integration."
          evidenceStatus: supported
        - id: oem-collaboration
          label: OEM collaboration
          detail: "D-Robotics claims collaborations across humanoid, companion, cleaning, and lawn-mowing robot sectors."
          evidenceStatus: company-claimed
        - id: design-win
          label: Design win
          detail: "More than 20 S600 customers were reported in the first six months, but named S600 accounts are not disclosed."
          evidenceStatus: partially-supported
        - id: production-shipment
          label: Production shipment
          detail: "More than 8 million cumulative Sunrise chips were reported, without customer, product, or active-deployment attribution."
          evidenceStatus: partially-supported
        - id: renewal-expansion
          label: Renewal and expansion
          detail: "Renewal, repeat purchase, cohort retention, contract duration, and customer-level spend expansion are not public."
          evidenceStatus: unresolved
    approximationNotes: "Ordered as an analytical evidence ladder, not a measured conversion funnel; no conversion rates or stage populations are available."
    claimRefs: [CU001, CU003, CU004, CU006, CU005, CU016]
callouts:
  - calloutType: risk
    title: Adoption breadth is not yet durable revenue proof
    body: >-
      Shipments, developers, universities, and named logos establish reach, but the retained
      evidence contains no retention metric, customer-level revenue, contract duration, or
      independently verified production outcome.
    claimRefs: [CU005, CU007, CU008, CU009, CU016]
