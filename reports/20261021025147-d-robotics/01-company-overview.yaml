slug: d-robotics
runDate: 2026-10-21
company:
  name: D-Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    D-Robotics is a 2024 Horizon Robotics spinout selling integrated robotics
    computing hardware and software from Shenzhen. Public evidence shows rapid
    financing and company-reported deployment scale, but does not establish a
    valuation, audited financial profile, exact headcount, board composition, or
    ownership percentages.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      D-Robotics supplies the computing layer used by robotics developers rather
      than primarily building complete robots. Its official site describes a
      development-infrastructure stack spanning computing boards, operating
      systems, and applications, while independent profiles add Sunrise chips,
      RDK developer kits, and software tools. The company was created from
      Horizon Robotics' AIoT unit in January 2024 and is consistently located in
      Shenzhen in the reviewed company profiles. Preqin describes revenue as
      coming from hardware and software sales, but no cited source breaks out
      product mix, pricing, recurring software revenue, or gross margin. The
      resulting investment identity is a capital-intensive chip-and-platform
      supplier with an ecosystem strategy, not a pure software company and not a
      robot OEM.
    claimRefs: [CO001, CO002, CO003, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Public leadership evidence is thin. An independent profile identifies Wang
      Cong as the former leader of Horizon's AIoT and robotics business across
      product development, marketing, and sales before its spinout. Preqin also
      describes D-Robotics as operating under D-Robotics Holding Limited, an
      affiliate of Horizon Robotics. That relationship matters because Horizon
      is separately profiled as a Beijing company founded in 2015 that completed
      an IPO in October 2024; its valuation, headcount, revenue, and leadership
      therefore cannot be substituted for D-Robotics data. No reviewed source
      identifies D-Robotics' board chair, directors, ownership percentages, or
      executive bench beyond Wang. Key-person dependence and parent-affiliate
      controls remain material diligence questions rather than resolved facts.
    claimRefs: [CO004, CO014, CO015, CO016]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing and operating scale
    body: >-
      The disclosed financing sequence accelerated from a reported $100 million
      Series A in May 2025 to a $120 million Series B1 tranche in 2026, followed
      by a report that aggregate Series B funding had reached $270 million by
      April 2026. D-Robotics then announced a $400 million Series C on September
      17, 2026. These are round amounts and should not be added mechanically into
      cash available: the sources do not reconcile overlap among tranches,
      disclose secondary components, or provide post-financing cash. The latest
      operating metrics are also company-issued: first-half 2026 revenue grew
      "several times" year over year, cumulative Sunrise shipments exceeded
      eight million, and the S600 had more than 20 customers within six months.
      None of those statements supplies audited revenue, unit economics, or a
      confirmed valuation.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO016]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The timeline shows a fast transition from corporate separation to major
      financing and reported commercial scale. The strongest validation is the
      combination of successive funding rounds, product release cadence, and a
      company-reported ecosystem exceeding 100,000 developers, 500 universities,
      and 20 countries. The evidentiary quality is uneven, however: financing is
      reported across company releases and secondary publications, while the
      largest operating metrics originate with D-Robotics and are not tied to
      audited statements. The reviewed set contains no reliable evidence of a
      board roster, cap table, exact employee count, post-money valuation, cash
      runway, debt facilities, or regulatory and legal event history. That
      absence must be treated as a diligence gap, not evidence that adverse
      events or financing constraints do not exist.
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO016]
    figureRefs: [FO001]
