    summary: >-
      Public milestones show a rapid two-and-a-half-year path from spinout to
      Series C, while financial and governance disclosure remains limited.
    data:
      items:
        - date: "2024-01"
          label: "D-Robotics spins out"
          detail: "The company is reported to have separated from Horizon Robotics' AIoT unit."
          tone: neutral
        - date: "2025-05"
          label: "$100M Series A"
          detail: "AI Insider reports a $100 million Series A round."
          tone: positive
        - date: "2025"
          label: "Reported operating expansion"
          detail: "A secondary report says shipments rose 180% and the customer base grew 200%, without disclosing totals."
          tone: neutral
        - date: "2025-11"
          label: "Sunrise S600 launch"
          detail: "D-Robotics says it launched the embodied-AI computing chip in November 2025."
          tone: positive
        - date: "2026"
          label: "$120M Series B1"
          detail: "The Insight reports the B1 close and says cumulative funding then stood at $220 million."
          tone: positive
        - date: "2026-04"
          label: "Series B reaches $270M"
          detail: "AI Insider reports aggregate Series B funding of $270 million."
          tone: positive
        - date: "H1 2026"
          label: "Company reports scale"
          detail: "Revenue grew 'several times' year over year and cumulative Sunrise shipments exceeded eight million, according to D-Robotics."
          tone: neutral
        - date: "2026-09-17"
          label: "$400M Series C"
          detail: "D-Robotics announces the closing of a $400 million Series C."
          tone: positive
    approximationNotes: >-
      Timeline dates preserve the precision available in the retained sources;
      the B1 item is placed in 2026 because the fetched text does not provide an
      exact closing date.
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO009, CO010, CO011]
callouts:
  - calloutType: strength
    title: Capital and ecosystem momentum
    body: >-
      A $400 million Series C followed rapid Series A and B financing, while
      D-Robotics reports more than eight million cumulative chip shipments and a
      developer community above 100,000.
    claimRefs: [CO005, CO006, CO007, CO008, CO010, CO012]
  - calloutType: risk
    title: Disclosure does not match financing scale
    body: >-
      The reviewed evidence does not establish audited revenue, gross margin,
      cash burn, runway, valuation, exact headcount, board composition, or
      ownership percentages.
    claimRefs: [CO016]
