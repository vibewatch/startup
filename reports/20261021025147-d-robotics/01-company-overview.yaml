  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: disclosure-gaps
      missingEvidence: >-
        Audited revenue, gross margin, cash burn, cash balance, debt, runway,
        post-money valuation, and exact employee count.
      whyItMatters: >-
        Financing amounts and percentage growth do not establish operating scale,
        capital efficiency, liquidity, or valuation support.
      diligencePath: >-
        Obtain audited financial statements, monthly management accounts, bank
        statements, financing closing documents, debt schedules, and the current
        employee roster.
      relatedQuestionRefs: [QO005, QO007]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: >-
        Full executive roster, board composition, biographies, delegated
        authorities, founder status, and succession arrangements.
      whyItMatters: >-
        One publicly identified executive is insufficient to assess functional
        coverage, governance independence, or key-person concentration.
      diligencePath: >-
        Request the organization chart, board register and minutes, executive
        biographies, succession plan, and key-person employment agreements.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: investors
      missingEvidence: >-
        Signed cap table, investor ownership percentages, liquidation
        preferences, board rights, secondary components, and related-party links.
      whyItMatters: >-
        Published investor lists do not reveal control, dilution, preference
        stack, proceeds retained by the company, or affiliate influence.
      diligencePath: >-
        Reconcile the fully diluted cap table to each financing agreement,
        shareholder register, funds-flow statement, and investor-rights schedule.
      relatedQuestionRefs: [QO006, QO007]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: adverse-events
      missingEvidence: >-
        Authoritative litigation, sanctions, export-control, outage, recall, and
        regulatory records tied to the D-Robotics legal entities.
      whyItMatters: >-
        The lack of an adverse record in the assigned public source set is not
        proof that no incident, claim, or restriction exists.
      diligencePath: >-
        Run legal-entity registry, court, regulator, sanctions, product-safety,
        and customer-incident searches in each operating jurisdiction.
      relatedQuestionRefs: [QO007]
