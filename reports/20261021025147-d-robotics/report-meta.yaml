      Audited 2025-2026 revenue, gross margin, operating cash flow, burn, working-capital requirements, cash balance,
      debt, and runway.
    - >-
      Signed Series C documents showing pre-money and post-money valuation, liquidation preferences, anti-dilution
      rights, proceeds retained, and the fully diluted capitalization table.
    - >-
      Customer contracts, invoices, production volumes, repeat-order cohorts, retention, and top-account revenue
      concentration.
    - >-
      Foundry, packaging, memory, logistics, capacity-reservation, second-source, and export-control exposure by
      product.
    - >-
      Horizon Robotics IP licenses, transition services, governance rights, related-party terms, and standalone
      ownership of core technology.
    - >-
      Primary FCC and other regulatory records, product certifications, recall and incident histories, vulnerability
      controls, and counsel-reviewed legal scope.
