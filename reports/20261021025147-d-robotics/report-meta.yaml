  topStrengths:
    - >-
      A $400 million Series C provides substantial financing capacity for the Sunrise chip portfolio and end-to-end
      robotics software platform.
    - >-
      Company-reported traction includes more than eight million cumulative chip shipments and more than 20 S600
      customers within six months.
    - >-
      The platform spans chips, developer kits, software, and ecosystem support, positioning D-Robotics as
      infrastructure across multiple robot categories.
  topRisks:
    - >-
      Audited revenue, gross margin, burn, runway, working capital, and unit economics are unavailable, preventing a
      quality-of-revenue assessment.
    - >-
      Reported US restrictions affecting foreign-made robot end products may constrain downstream customer market
      access, but primary regulatory scope remains unverified.
    - >-
      Horizon-related IP, service, governance, and related-party arrangements are undisclosed, leaving separation and
      dependency risk unresolved.
    - >-
      Customer concentration, supplier and foundry dependencies, production reliability, and safety or security incident
      histories are not publicly established.
  unresolvedGaps:
