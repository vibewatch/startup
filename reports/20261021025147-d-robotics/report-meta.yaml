companyProfile:
  summary: >-
    D-Robotics supplies the computing layer for robotics development rather than complete robots. Its integrated
    platform combines Sunrise chips, RDK developer kits, operating systems, applications, and software tools. The
    company was spun out of Horizon Robotics' AIoT unit in January 2024, is headquartered in Shenzhen, and operates
    through a reported Horizon-affiliated holding company. Public evidence identifies Wang Cong as the former leader of
    Horizon's AIoT and robotics business but does not establish his current title, founder status, the broader executive
    team, board composition, or ownership percentages.
  foundedDate: null
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    Sunrise edge-AI chips, RDK developer kits, operating-system and application tooling, and an integrated software
    platform for robotics development and deployment.
  customerFocus: >-
    Robotics OEMs, commercial development teams, research institutions, universities, and individual developers across
    humanoid, quadruped, service, logistics, companion, and other intelligent-robot categories.
  businessModel: >-
    Sales of robotics-development hardware and software; public evidence does not disclose product mix, pricing,
    licensing terms, recurring revenue, or gross margin.
  stage: Series C
  fundingStatus: >-
