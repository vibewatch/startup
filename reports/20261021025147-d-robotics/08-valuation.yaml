    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Evidence basis", "What changes the view"]
    rows:
      - ["Recommendation", "Track / research more", "$400M Series C and deployment evidence are positive, but current price and audited economics are unavailable.", "Verified round valuation plus audited revenue, gross margin, burn, and customer concentration."]
      - ["Confidence", "Medium-low", "Financing amounts are corroborated, while operating growth is largely company-reported.", "Customer invoices, audited statements, and cohort-level renewal or repeat-order evidence."]
      - ["Risk rating", "High", "Private-market liquidity, hardware capital intensity, and missing preference terms create asymmetric downside.", "Clean preference stack, sufficient runway, diversified production customers, and supply assurance."]
      - ["Valuation stance", "Unsupported at an undisclosed current price", "The latest disclosed valuation in the reviewed data is $450M from May 2025; the September 2026 round valuation is blank.", "A primary financing document stating pre-money, post-money, and fully diluted ownership."]
      - ["Decision implication", "Do not issue a buy recommendation", "Capital raised is not enterprise value, cash available, or proof of attractive returns.", "Entry terms that clear a milestone-based return case under audited operating assumptions."]
    notes: "Assessments distinguish disclosed financing amounts from valuation, cash availability, and audited operating performance; no return multiple is estimated."
    claimRefs: ["CV001", "CV005", "CV006", "CV012", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "Fresh institutional financing supports continued product investment.", "$400M Series C closed in September 2026.", "Evidence that capital converts into repeatable high-margin revenue rather than only R&D scale."]
      - ["Thesis", "The platform has meaningful shipment and developer reach.", "Company-originated evidence reports more than 8M cumulative chip shipments and more than 100,000 developers.", "Independent shipment reconciliation and monetized-active-developer cohorts."]
      - ["Thesis", "S600 has early commercial adoption.", "The company reports more than 20 customers within six months, with a majority in mass production.", "Named contracts, unit volumes, repeat orders, and customer concentration."]
      - ["Anti-thesis", "Commercial momentum lacks financial denominators.", "Revenue growth is qualitative; audited revenue, gross margin, burn, and cash runway are not disclosed.", "Audited financial statements and board-approved budget versus actuals."]
      - ["Anti-thesis", "The latest financing does not establish an investable valuation.", "The September 2026 Series C amount is disclosed, but its valuation is not.", "Signed term sheet and capitalization table with pre-money and post-money values."]
      - ["Anti-thesis", "Hardware and software integration may remain capital intensive.", "The company is funding chips across computing tiers and an end-to-end software platform.", "Evidence of gross-margin expansion, design reuse, and customer-funded development."]
    notes: "Operating metrics are issuer claims unless explicitly described as third-party data; the table does not treat shipments, developers, or funding as revenue."
    claimRefs: ["CV001", "CV006", "CV007", "CV008", "CV009", "CV010", "CV011"]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Probability signal", "Trigger"]
    rows:
      - ["Bull", "Audited revenue validates several-fold growth; production customers diversify; gross margin and repeat orders improve.", "A growth-platform multiple may become supportable, but no numeric range is publishable before revenue and entry price are verified.", "Low-to-medium on current public evidence.", "Audited results and contracts demonstrate scalable economics."]
      - ["Base", "Adoption expands, but economics and current valuation remain private.", "Track without pricing a return; require a discount or milestone protection against missing information.", "Highest relative support from the reviewed evidence.", "Primary round terms and audited economics become available."]
      - ["Bear", "Deployment does not convert to revenue, concentration or supply risk emerges, or preferences transfer downside to new money.", "Capital impairment risk dominates; decline investment regardless of headline ecosystem scale.", "Material downside remains plausible because core denominators are absent.", "Down round, missed production milestones, margin compression, or adverse supply restrictions."]
    notes: "Scenarios are qualitative because public evidence does not provide a current valuation, audited financial base, preference stack, or target exit terms."
    claimRefs: ["CV006", "CV007", "CV009", "CV013", "CV015", "CV016"]
