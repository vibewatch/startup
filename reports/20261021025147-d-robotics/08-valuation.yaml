company:
  name: "D-Robotics"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    D-Robotics has fresh financing and company-reported deployment momentum, including a
    $400 million Series C, more than 8 million cumulative Sunrise chip shipments, and more
    than 20 S600 customers. The investable conclusion is nevertheless track/research-more:
    public evidence does not disclose the September 2026 round valuation, audited economics,
    preference terms, or a credible exit timetable, so a defensible entry range cannot be set.
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and entry discipline"
    body: >-
      The recommendation is track/research-more, with medium-low confidence and high
      underwriting risk. The positive case is not capital scarcity: D-Robotics closed a
      $400 million Series C in September 2026, and independent coverage reported nearly
      RMB4.5 billion raised during 2026. The constraint is price discovery. Multiples reports
      a $450 million valuation for the May 2025 Series A but leaves the September 2026 Series
      C valuation undisclosed. That makes the latest financing amount unusable as a proxy for
      enterprise value or post-money equity value. An investor should therefore avoid a
      valuation conclusion based on capital raised, shipment counts, or qualitative revenue
      growth alone. The call can move toward invest only after the current price, fully diluted
      ownership, audited revenue and gross margin, cash burn, and preference stack are verified.
    claimRefs: ["CV001", "CV002", "CV005", "CV006", "CV016"]
    tableRefs: ["TV001"]
  - id: "thesis-and-anti-thesis"
    title: "Thesis, anti-thesis, and recommendation logic"
    body: >-
      The thesis is that D-Robotics may become a horizontal computing layer for robotics
      rather than a single-product robot vendor. Its own release says first-half 2026 revenue
      grew several times year over year, cumulative Sunrise shipments exceeded 8 million,
      and the S600 won more than 20 customers within six months, with a majority already in
      mass production. Independent profiles also describe the company as an infrastructure
      provider supplying chips, development kits, and software. The anti-thesis is that these
      are predominantly company-originated operating claims without disclosed revenue,
      margin, retention, concentration, or unit-economics denominators. Strong ecosystem
      activity may precede durable monetization, while a large financing can mask capital
      intensity. The recommendation logic therefore treats adoption as proof of relevance,
      not proof of an attractive security price.
    claimRefs: ["CV007", "CV008", "CV009", "CV010", "CV011", "CV016"]
    tableRefs: ["TV002"]
    figureRefs: ["FV001"]
  - id: "scenario-framework"
    title: "Bull, base, and bear framework without false precision"
    body: >-
      A conventional revenue-multiple valuation is premature because no audited revenue or
      EBITDA base is available in the reviewed evidence. The public comparison set is also
      too heterogeneous to supply a clean anchor: Multiples shows last-fiscal-year
      EV/revenue figures ranging from 1.0x for ECARX to 29.9x for Xtend AI Robotics, while
      Horizon Robotics has a much larger listed valuation but an automotive ADAS focus that
      differs from D-Robotics' robotics-infrastructure scope. Accordingly, the scenarios use
      evidence thresholds rather than invented dollar ranges. The bull case requires audited
      conversion of deployments into recurring or repeatable revenue and margins; the base
      case preserves tracking status until those economics and the entry price are known; the
      bear case is triggered by weak conversion, concentration, a punitive preference stack,
      or a financing-led valuation unsupported by operating cash generation.
    claimRefs: ["CV006", "CV007", "CV009", "CV013", "CV014", "CV016"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-diligence"
    title: "Exit readiness, final diligence asks, and thesis-break triggers"
    body: >-
      D-Robotics remains privately held, and the reviewed sources disclose neither an IPO
      timetable nor observable secondary-market pricing. Forge's general private-market
      disclosure is directionally relevant: private securities are highly illiquid and no
      market is guaranteed to develop. Exit readiness should therefore be judged through
      milestones rather than a calendar assumption. Required diligence is the September
      2026 capitalization table, liquidation preferences and anti-dilution rights, audited
      2025 and 2026 financials, customer-level shipment and revenue concentration, foundry
      commitments, and a board-approved financing and exit plan. Thesis-break triggers are
      a down round, revenue conversion materially below shipment growth, gross-margin
      compression inconsistent with an infrastructure platform, dependence on a small set of
      OEM programs, or restrictions that impair chip supply or international distribution.
    claimRefs: ["CV012", "CV015", "CV016"]
tables:
