    claimRefs: ["CV001", "CV006", "CV008", "CV009", "CV011", "CV016"]
callouts:
  - calloutType: "recommendation"
    title: "Price discipline overrides headline scale"
    body: >-
      Treat the $400 million Series C as evidence of financing access, not evidence of value.
      Without the round valuation, fully diluted ownership, audited economics, and preference
      stack, the only defensible stance is track/research-more.
    claimRefs: ["CV001", "CV006", "CV016"]
