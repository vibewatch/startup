callouts:
  - calloutType: risk
    title: Broad market growth is not a company revenue forecast
    body: >-
      Fragmented robot form factors, Nvidia-centered workflows, and unresolved
      power constraints can slow standardization. Underwrite D-Robotics against
      verified production revenue, repeat purchases, and gross margin rather than
      applying broad robotics-market growth directly.
    claimRefs: [CM011, CM012, CM015]
