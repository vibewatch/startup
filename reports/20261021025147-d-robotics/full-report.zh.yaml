              Sunrise 硅片本身被直接禁用。实际风险是间接的：中国机器人 OEM 若由该芯片驱动，可能失去美国市场准入；美国 OEM 则可能面临更严格的供应链审查。分配到本部分的证据没有包含
              FCC、法院、专利、隐私、认证、制裁或出口管制的原始记录来确立 D-Robotics 的确切义务。因此，法律态势仍然重大但只得到部分验证，投资批准应要求律师审阅原始记录，而不能依赖一篇新闻报道。
