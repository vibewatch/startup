              客户，其中大多数已点名项目进入量产。这些是有意义的商业化信号，但收入基数和当期出货量都未披露，累计芯片出货量也不能与机器人数量或当前期间的 sell-through 混淆。其上市体系还包括开发者生态和
              Gravity Program，公司称该计划提供产品、供应链、GTM 和融资支持。这可以推动设计导入，但公开证据没有量化销售周期、渠道经济性、转化率或客户集中度。
