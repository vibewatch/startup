          items:
            - CPU
            - BPU 与 MCU 架构
    approximationNotes: 层级顺序是对公开文档的分析性综合，并非披露的内部系统图或生产物料清单。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE009
      - CE012
      - CE013
  - id: FU001
    title: 客户证据阶梯与扩张路径
    type: journey-map
    summary: 公开证据在生态触达和累计出货阶段最强，而量产转化、结果、续约和支出扩张仍未得到验证。
    data:
      nodes:
        - id: developer-discovery
          label: 开发者发现
          detail: 公开资源与 RDK 套件面向个人创客、大学和商业开发团队。
          evidenceStatus: supported
        - id: prototype
          label: 原型与评估
          detail: 研究与商业团队可以用芯片、套件和软件完成感知、计算与集成。
          evidenceStatus: supported
        - id: oem-collaboration
          label: OEM 合作
          detail: D-Robotics 声称已与人形、陪伴、清洁和割草机器人领域展开合作。
          evidenceStatus: company-claimed
        - id: design-win
          label: 设计赢单
          detail: 据报道，前六个月已有超过 20 家 S600 客户，但未披露点名的 S600 客户账户。
          evidenceStatus: partially-supported
        - id: production-shipment
          label: 量产出货
          detail: 据报道 Sunrise 累计芯片出货量超过 8 million，但没有客户、产品或实际部署归属信息。
          evidenceStatus: partially-supported
        - id: renewal-expansion
          label: 续约与扩张
          detail: 续约、重复购买、cohort 留存、合同期限和客户层面的支出扩张均未公开。
          evidenceStatus: unresolved
    approximationNotes: 该顺序是分析性的证据阶梯，不是实测转化漏斗；没有可用的转化率或阶段规模。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU006
      - CU005
      - CU016
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: 基于潜在影响和观察到的风险信号强度进行来源锚定的优先级排序；定位是定性的，不代表概率。
    data:
      columns:
        - key: lower-signal
          label: 较低观察信号
          detail: 关于风险发生的已分配证据有限
        - key: moderate-signal
          label: 中等观察信号
          detail: 证据表明存在风险敞口，但仍有重大不确定性
        - key: stronger-signal
          label: 较强观察信号
          detail: 多项或直接披露表明存在风险敞口
      rows:
        - label: 严重潜在影响
          note: 可能实质性损害市场准入或产品交付
          values:
            - value: No risk assigned
              note: 空白分类不代表风险不存在
            - value: US market access
              detail: 据报道，终端产品限制影响中国 OEM 路径
            - value: Supply-chain opacity
              detail: 晶圆代工与封装依赖未披露
        - label: 高潜在影响
          note: 可能实质性损害经济模型、控制权或规模化
          values:
            - value: No risk assigned
              note: 空白分类不代表风险不存在
            - value: Horizon / IP dependency
              detail: 技术联系可见，但合同保护不存在
            - value: Financial opacity
              detail: 增长是相对值，而利润率、消耗速度和集中度缺失
        - label: 高潜在影响 — 财务模型
          note: 可能损害资本效率或迫使公司追加融资
          values:
            - value: No risk assigned
              note: 空白分类不代表风险不存在
            - value: Follow-on capital need
              detail: 芯片与软件范围资本密集，而现金跑道未披露
            - value: Absolute economics unavailable
              detail: 收入、利润率、消耗速度、营运资金和集中度均未公开
        - label: 高潜在影响 — 控制与依赖
          note: 可能削弱战略控制或中断交付
          values:
            - value: No risk assigned
              note: 空白分类不代表风险不存在
            - value: Horizon relationship
              detail: 据报道存在技术联系，但治理合同不可得
            - value: Supplier concentration
              detail: 晶圆代工、封装和存储对手方未被识别
        - label: 中等潜在影响
          note: 可能拖慢采用或削弱可比性
          values:
            - value: Compute comparability
              detail: 与精度和稀疏性指标不同，限制了直接比较
            - value: Ecosystem support burden
              detail: 品类和开发层级很多，增加了支持复杂度
            - value: No risk assigned
              note: 空白分类不代表风险不存在
        - label: 中等潜在影响 — 交付规模
          note: 可能提高集成成本或延迟客户量产
          values:
            - value: No risk assigned
              note: 空白分类不代表风险不存在
            - value: Category breadth
              detail: 多种机器人类型需要不同的集成与支持路径
            - value: Deployment evidence quality
              detail: 量产说法缺少独立的规模和可靠性数据
    approximationNotes: 对引用证据的分析师综合；标签不是量化概率，数据不可得也不按零分处理。
    claimRefs:
      - CR016
  - id: FV001
    title: 从证据到决策的建议逻辑
    type: flow
    summary: 融资和采用证明了相关性，但经济数据与价格缺失，无法给出买入建议。
    data:
      nodes:
        - id: capital
          label: 新增资本
          value: $400M Series C
          detail: 融资能力支持持续投入芯片与平台。
        - id: deployment
          label: 部署信号
          value: '>8M chips; >20 S600 customers'
          detail: 发行方自报的规模支持产品相关性，但不能证明收入已获独立验证。
        - id: business-model
          label: 平台模型
          value: Chips + kits + software
          detail: 如果变现可重复，基础设施定位可以跨机器人品类扩张。
        - id: economics-gap
          label: 经济数据缺口
          value: No audited revenue or margin
          detail: 定性增长不足以支持精确倍数。
        - id: price-gap
          label: 价格与条款缺口
          value: 2026 valuation undisclosed
          detail: 融资金额不等于投后估值或投资者回报。
        - id: decision
          label: 决策
          value: Track / research more
          detail: 只有在价格、优先权、持股和经审计经济数据得到验证后才推进。
      edges:
        - from: capital
          to: deployment
        - from: deployment
          to: business-model
        - from: business-model
          to: economics-gap
        - from: economics-gap
          to: price-gap
        - from: price-gap
          to: decision
    approximationNotes: 该流程是分析性的决策顺序，不是量化转化漏斗或概率模型。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
      - CV011
      - CV016
