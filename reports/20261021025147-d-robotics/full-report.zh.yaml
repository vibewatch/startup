      - number: '3.3'
        title: 分销、工作流转换成本与不透明定价
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 正试图把组件销售转化为生态关系。公司材料将 RDK 工具链与 D-Robotics Gravity Program
              配套，据称该计划支持产品开发、供应链选择、上市工作和融资。这一组合可能形成工作流层面的转换成本，因为客户围绕计算层采用工具、算法、支持流程和合作伙伴关系，而不只是购买芯片。但同一机制尚未量化：公开证据没有披露迁移工作量、留存、多归属、独家供应条款、实际定价、折扣、最低承诺或渠道经济性。Preqin
              的资料称公司从硬件和软件产生收入，但没有展示合同结构。因此，定价应被视为投资判断缺口，而不是从产品广度或融资规模中推断。
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP015
              - CP016
