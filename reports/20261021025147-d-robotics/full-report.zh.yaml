      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据很薄弱。一份独立资料称，Wang Cong 在分拆前曾负责 Horizon 的 AIoT 和机器人业务，覆盖产品开发、营销和销售。Preqin 还称 D-Robotics 在 D-Robotics
              Holding Limited 旗下运营，该公司是 Horizon Robotics 的关联方。这一关系很重要：Horizon 另有资料称其是一家 2015 年在北京成立、并于 2024 年 10 月完成 IPO
              的公司，因此其估值、员工人数、收入和领导层不能替代 D-Robotics 的数据。审阅的来源没有列出 D-Robotics 的董事长、董事、持股比例，也没有披露 Wang
              之外的管理团队。关键人物依赖和母公司关联方控制仍是重大尽调问题，而不是已经解决的事实。
