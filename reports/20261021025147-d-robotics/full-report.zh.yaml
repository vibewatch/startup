      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              正在形成的护城河逻辑建立在三个相互强化的资产上：一体化产品栈、开发者与大学覆盖面，以及延伸到供应链和商业化的支持。三者主要由公司发布的说法支持，因此体现的是战略意图和声称的采用，而非已验证的锁定。替代可能来自多个方向。Horizon
              的汽车关系和全栈工程能力说明，现有厂商可以将相邻能力延伸到通用机器人；全球和国内芯片厂商可以在计算层竞争；大型 OEM 也可能把硬件和算法内部化，以获得控制权或降低感知中的供应商成本。一位 Horizon
              投资者明确将 OEM 内部开发列为威胁，同时认为垂直整合困难。由此得出的判断是有条件的：D-Robotics 具备可信的平台形态，但要证明持久差异化，仍需独立验证的基准、生产留存、迁移摩擦和商业条款。
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
