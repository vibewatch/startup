chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 为机器人开发者提供计算层，而不是主要制造完整机器人。其官网将产品描述为覆盖计算板、操作系统和应用的开发基础设施栈，独立资料则补充提到 Sunrise 芯片、RDK 开发套件和软件工具。公司于
              2024 年 1 月从 Horizon Robotics 的 AIoT 部门成立，审阅的公司资料也一致将其所在地列为深圳。Preqin
              称其收入来自硬件和软件销售，但没有引用来源拆分产品组合、定价、经常性软件收入或毛利率。因此，D-Robotics 更像一家采取生态策略、资本密集的芯片与平台供应商，而非纯软件公司或机器人 OEM。
