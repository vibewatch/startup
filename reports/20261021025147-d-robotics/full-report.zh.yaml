            body: >-
              已披露的融资节奏从据报道于 2025 年 5 月完成的 $100 million Series A，加速至 2026 年的 $120 million Series B1，随后有报道称截至 2026 年 4 月累计
              Series B 融资已达 $270 million。D-Robotics 又于 2026 年 9 月 17 日宣布完成 $400 million Series
              C。这些是轮次金额，不能机械相加为可用现金：来源没有调和各批次之间的重叠，也未披露二级交易成分或融资后现金。最新运营指标同样由公司发布：2026 年上半年收入同比增长“several times”，Sunrise
