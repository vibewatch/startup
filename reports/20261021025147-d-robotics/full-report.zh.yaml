            title: 产品边界比单独芯片更宽
            body: D-Robotics 已获支持的差异化在于计算、开发工具、算法、软件和生态支持的组合；证据尚未证明这一组合的性能优于替代方案或价格更低。
            calloutType: strength
            claimRefs:
