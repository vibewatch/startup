              - CM008
              - CM015
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              用户群覆盖个人开发者、大学、科研机构、商业开发团队和机器人 OEM。随着成熟度变化，可能的付费方也会变化：创客和实验室购买开发套件，而机器人制造商的产品或工程组织采购生产硬件和软件。Preqin
              将这些产品描述为用于原型制作、产品开发、性能评估和验证的工具；D-Robotics
              自身披露则指向客户采用和量产。这支持一条从评估到设计导入、再到规模部署的分阶段路径，但公开来源没有披露合同金额、采购决策人、采购周期，也没有说明软件是否与硬件分开许可。上述缺口使自下而上的支出模型无法建立。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM008
              - CM013
      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求受到机器人品类扩张、AMR 采用率提升、中国半导体供应本土化压力，以及在多种形态之间复用同一开发平台的经济吸引力支持。D-Robotics 报告称，其平台拥有超过 100,000 名开发者、超过 500
              所大学和 20 多个国家；S600 在六个月内达到超过 20 家客户。这些是有用的分销和设计导入信号，但不是经常性收入或持久份额的证明。约束同样重要：机器人缺乏统一形态，许多中国人形机器人开发者据报道将
              Nvidia 作为主要平台，电池容量和计算效率仍是技术瓶颈，转入量产还可能需要定制。因而，估值应更多权重于已验证的生产收入和平台重复采购，而不是宽泛的品类预测或开发者注册量。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 证据表
        blocks:
          - type: callout
            title: 广泛市场增长不是公司收入预测
            body: 碎片化的机器人形态、以 Nvidia 为中心的工作流，以及尚未解决的功耗约束，都可能拖慢标准化。对 D-Robotics 的投资判断应基于已验证的生产收入、重复采购和毛利率，而不是直接套用广义机器人市场增速。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 争夺的是计算与开发层，而不是成品机器人市场。因此，实际竞争格局不止包括直接芯片同行：NVIDIA Jetson 和国内 SoC 厂商是组件或平台替代方案；Horizon Robotics
              是拥有共同渊源、并明确希望支持更广泛机器人领域的相邻全栈既有厂商；垂直整合的 OEM 团队可以内部构建；机器人制造商也可以继续使用现有异构技术栈。独立目录将 D-Robotics
              描述为赋能型基础设施供应商，而信誉较低的市场资料则将 Rockchip、Allwinner、Black Sesame、Horizon 和 NVIDIA
              列为替代方案。这些名称形成了一个合理的比较集合，但不代表相对产品优势。下方基于证据的地图只评价指定来源展示了多少集成能力和机器人专属生态广度，不是性能、市场份额或价格基准。
            claimRefs:
              - CP006
