            title: 用绝对运营数据决定投资判断
            body: 在没有经审计绝对数字和 cohort 层面支持前，不要把百分比增长、累计出货量或大额融资轮次转换成关于利润率、现金 runway、客户集中度或重复需求的结论。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪 / 继续研究，信心中低，投资判断风险高。积极情形并不是资本稀缺：D-Robotics 于 2026 年 9 月完成 $400 million Series C，独立报道还称其在 2026 年筹集了近
              RMB4.5 billion。约束在于价格发现。Multiples 报告称 2025 年 5 月 Series A 的估值为 $450 million，但没有披露 2026 年 9 月 Series C
              的估值。因此，最新融资金额不能作为企业价值或融资后股权价值的代理。投资者应避免仅根据融资额、出货量或定性收入增长作出估值结论。只有在当前价格、完全摊薄持股、经审计收入和毛利率、现金消耗以及优先股堆叠得到验证后，结论才可转向投资。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与建议逻辑
        blocks:
          - type: paragraph
            body: >-
              投资论点是，D-Robotics 可能成为机器人的横向计算层，而不是单一产品机器人供应商。公司自身公告称，2026 年上半年收入同比增长 several times，Sunrise 累计出货量超过 8
              million，S600 在六个月内赢得超过 20
              家客户，其中多数已经量产。独立资料也将公司描述为供应芯片、开发套件和软件的基础设施提供商。反论点是，这些运营说法大多来自公司自身，却没有披露收入、利润率、留存、集中度或单位经济性分母。强劲的生态活动可能先于持久变现，而大额融资可能掩盖资本密集度。因此，建议逻辑将采用视为相关性证明，而不是有吸引力的证券价格证明。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV011
              - CV016
      - number: '8.3'
        title: 没有虚假精确度的多空框架
        blocks:
          - type: paragraph
            body: >-
              传统收入倍数估值尚为时过早，因为审阅证据中没有经审计收入或 EBITDA 基数。公开比较集合也过于异质，无法提供干净锚点：Multiples 显示，ECARX 的上一财年 EV/收入为 1.0x，Xtend AI
              Robotics 为 29.9x；Horizon Robotics 的上市估值大得多，且聚焦汽车 ADAS，与 D-Robotics
              的机器人基础设施范围不同。因此，情景采用证据阈值，而不是虚构美元区间。乐观情景要求经审计证明部署已转化为经常性或可重复收入和利润率；基准情景在这些经济性和入场价格明确前维持跟踪状态；悲观情景则由转化率低、集中度高、惩罚性的优先股堆叠，或由融资推动但缺乏运营现金生成支持的估值触发。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、最终尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              D-Robotics 仍为私有公司，审阅来源既没有披露 IPO 时间表，也没有可观察的二级市场价格。Forge
              对私募市场的一般披露具有方向性参考价值：私募证券流动性很差，也不能保证会形成市场。因此，退出准备度应按里程碑而不是日历假设判断。所需尽调包括 2026 年 9 月股权资本表、清算优先权和反稀释权利、经审计的
              2025 和 2026
              年财务数据、客户层面出货与收入集中度、晶圆代工承诺，以及经董事会批准的融资和退出计划。论点失效触发条件包括：下轮融资估值下降；收入转化明显低于出货增长；毛利率压缩程度与基础设施平台不符；依赖少数 OEM
              项目；或限制损害芯片供应或国际分销。
            claimRefs:
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 证据表
        blocks:
          - type: callout
            title: 价格纪律优先于表面规模
            body: 将 $400 million Series C 视为融资渠道畅通的证据，而不是价值证据。在轮次估值、完全摊薄持股、经审计经济数据和优先股堆叠明确前，唯一站得住脚的立场是 track/research-more。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV016
