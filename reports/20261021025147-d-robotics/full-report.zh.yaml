            body: >-
              D-Robotics 于 2026 年 9 月宣布完成 US$400 million Series C，并称募集资金将扩大 Sunrise
              产品组合和端到端软件平台。这是已募集融资，而不是已披露现金余额：保留的证据没有期末资产负债表、债务义务、月度现金消耗、现金 runway
              或下一轮融资触发条件。最新估值也仍未公开。因而，财务结论是混合的。产品广度、据报道的出货规模、客户采用和新融资支持可信的商业化路径，但绝对收入、毛利率、单位经济性和现金流数据的缺失，使传统的收入质量或资本充足性评估无法进行。数据室审阅应是任何估值结论的前提，而不是投后工作流。
