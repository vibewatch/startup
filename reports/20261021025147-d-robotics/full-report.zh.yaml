  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 触发条件
    rows:
      - - 乐观
        - 经审计收入验证数倍增长；量产客户更加多元；毛利率与重复下单改善。
        - 增长型平台倍数可能获得支持，但在收入和入场价格得到验证前，无法公布数值区间。
        - 基于当前公开证据，低至中等。
        - 经审计结果和合同证明经济模型可规模化。
      - - 基准
        - 采用率扩大，但经济数据与当前估值仍属非公开信息。
        - 在不对回报定价的情况下跟踪；针对信息缺失，要求折价或里程碑保护。
        - 审阅证据对该情景的相对支持最高。
        - 首轮融资条款和经审计经济数据可得。
      - - 悲观
        - 部署无法转化为收入，集中度或供应风险浮现，或优先权将下行风险转嫁给新资金。
        - 资本减值风险占主导；无论生态规模的标题数字如何，都应放弃投资。
        - 核心分母缺失，因此显著下行仍然合理可见。
        - 下轮融资、错过量产里程碑、利润率承压或不利的供应限制。
    notes: 由于公开证据没有提供当前估值、经审计财务基础、优先股堆叠或目标退出条款，情景只能定性描述。
