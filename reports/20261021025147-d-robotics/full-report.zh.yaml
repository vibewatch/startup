      - number: '3.2'
        title: 能力广度可见；比较优势尚未证明
        blocks:
          - type: paragraph
            body: >-
              最清晰的已支持差异在于产品范围。D-Robotics 自有材料将其描述为覆盖 Sunrise 芯片、RDK
              硬件、软件、算法、解决方案和开发工具的一体化基础设施。第三方资料也将公司定位为多种机器人类型的基础平台，而不是完整人形机器人供应商。公司发布的公告称，S600 在六个月内获得超过 20
              家采用者，已安装开发者基数超过 100,000，但保留的资料中没有独立的延迟、能效、可靠性、软件可移植性或总成本基准来对比竞争平台。Horizon 为全栈模式提供了最强的相邻验证：其 CEO
              称公司采用软硬件协同设计，而历史报道则将 Black Sesame、Huawei、NVIDIA 和 Intel's Mobileye 放在更广泛的中国 AI 芯片竞争中。没有证据支持的矩阵单元仍明确标为未知。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP002
