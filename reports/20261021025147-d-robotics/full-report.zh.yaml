        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              最高的剩余敞口不是单一的芯片性能问题，而是市场准入、财务不透明和执行范围相互作用的结果。一份二手报告称，美国授权限制目前涵盖新的外国制造人形和四足机器人，而 D-Robotics 称许多点名的 S600
              采用者是中国客户并已进入量产。这会造成上市路径风险，即使组件本身没有被直接禁止。公司还筹集了 $400
              million，以同时扩展芯片和软件，但公开增长披露只使用相对表述和百分比，没有收入、利润率、现金消耗、客户基础或出货量基数。新资本降低短期融资压力，却不能证明资本效率或需求持久性。
            claimRefs:
              - CR001
