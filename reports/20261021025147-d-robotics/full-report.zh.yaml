            body: >-
              审阅的来源没有提供 D-Robotics
              的毛利率、销货成本、晶圆代工或封装经济性、库存状况、保修负担、研发支出、营运资金周期或资本开支。来源也没有披露获客成本、回收期、销售周期、渠道费用或软件附着率。一份第三方资料称，前母公司 Horizon
              Robotics 2023 年营业收入为 CNY 1.55 billion，研发费用为 CNY 2.366 billion，说明先进芯片平台可能承担沉重开发成本；这些数字不能转移到分拆后的 D-Robotics
              实体。因而，投资判断需要一份管理层模型，调和芯片销量、平均售价、软件收入、直接成本和运营现金使用。
