  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应限定为机器人开发基础设施：面向智能机器开发团队销售的边缘计算芯片、开发套件、操作系统、算法和部署工具。D-Robotics
              明确并不专注于某一款完整人形机器人或其他成品机器人，因此把整个机器人系统收入计入会显著高估其可触达支出。纳入的需求来自购买或集成计算和软件的开发者与
              OEM；不纳入的需求包括执行器、电池、完整机器人机体、安装服务及下游节省的人工成本。现状替代方案包括通用处理器、内部组装的软硬件栈，以及继续用原型而不采用生产级平台。这一边界比纯芯片品类更宽，但比全球机器人市场更窄。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 规模化视角，而非合成 TAM
        blocks:
          - type: paragraph
            body: >-
              保留的独立规模估算证据证明了品类动能，但没有证明 D-Robotics 的可变现市场。DWS 报告称，全球机器人市场 2024 年超过 $46 billion，并预计到 2028 年超过 $67
              billion，CAGR 为 9.94%；其另行引用的自主移动机器人市场则预计从 2022 年不足 $4 billion 增长至 2030 年超过 $13 billion。这些估算使用不同品类和时期，且包含
              D-Robotics 基础设施层之外的大量支出，因此不能相加、嵌套或转换成 SAM 或 SOM。目前最稳妥的呈现方式，是把有边界意识的规模化视角与公司采用指标并列，并将缺失的基础设施支出分母视为重大缺口。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM015
