            body: >-
              第三方资料称 D-Robotics 销售 Sunrise 芯片、RDK 开发套件和用于开发智能机器人的软件，而公司自有材料则将产品定位为一体化软硬件基础设施。这支持多收入流模式，而不是纯 SaaS
              定性。公开证据没有披露标价、实际平均售价、软件许可条款、收入组合、合同期限、折扣或会计确认方式。因此，投资判断要区分已证实的产品集合与尚未证实的经济模型：出货量显示分销，但无法揭示每颗芯片收入、附着率、经常性软件收入或毛利。下方的收入桥明确列出这些缺失的转换步骤，而不是用估算填补。
