evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      Audited revenue, gross margin, cash burn, cash balance, debt, runway, post-money valuation, and exact employee
      count.
    whyItMatters: >-
      Financing amounts and percentage growth do not establish operating scale, capital efficiency, liquidity, or
      valuation support.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, bank statements, financing closing documents,
      debt schedules, and the current employee roster.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Full executive roster, board composition, biographies, delegated authorities, founder status, and succession
      arrangements.
    whyItMatters: >-
      One publicly identified executive is insufficient to assess functional coverage, governance independence, or
      key-person concentration.
    diligencePath: >-
      Request the organization chart, board register and minutes, executive biographies, succession plan, and key-person
      employment agreements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: >-
      Signed cap table, investor ownership percentages, liquidation preferences, board rights, secondary components, and
      related-party links.
    whyItMatters: >-
      Published investor lists do not reveal control, dilution, preference stack, proceeds retained by the company, or
      affiliate influence.
    diligencePath: >-
      Reconcile the fully diluted cap table to each financing agreement, shareholder register, funds-flow statement, and
      investor-rights schedule.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Authoritative litigation, sanctions, export-control, outage, recall, and regulatory records tied to the D-Robotics
      legal entities.
    whyItMatters: >-
      The lack of an adverse record in the assigned public source set is not proof that no incident, claim, or
      restriction exists.
    diligencePath: >-
      Run legal-entity registry, court, regulator, sanctions, product-safety, and customer-incident searches in each
      operating jurisdiction.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A credible estimate of annual robotics edge-compute hardware and software spend segmented by geography, robot
      category, production stage, and addressable price band.
    whyItMatters: >-
      Without the infrastructure-spend denominator, broad robotics and AMR forecasts cannot support a company-specific
      TAM, SAM, SOM, or market-share calculation.
    diligencePath: >-
      Obtain third-party semiconductor shipment data and management's unit-volume, average-selling-price,
      software-attach, and geographic assumptions, then reconcile them to customer production plans.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Named budget owners, procurement cycles, contract values, pricing, software packaging, renewal behavior, and
      switching-cost evidence by buyer segment.
    whyItMatters: >-
      User and application counts do not establish who controls purchasing, annual spend per account, conversion timing,
      or recurring platform economics.
    diligencePath: >-
      Review anonymized customer contracts, pipeline-stage data, win-loss records, cohort purchasing, and interviews
      with OEM engineering and procurement leaders.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list and realized prices, contract units, discounts, support fees, minimum commitments, and total cost
      of ownership.
    whyItMatters: >-
      Without commercial terms, diligence cannot test price advantage, software attach, margin quality, or customer
      payback against alternatives.
    diligencePath: >-
      Request current price books, anonymized contracts, discount schedules, support terms, and matched competitor
      quotes for representative deployments.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-benchmarks
    missingEvidence: >-
