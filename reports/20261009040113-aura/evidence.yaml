evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-valuation-and-capitalization
    missingEvidence: >-
      Independent post-listing public equity market capitalization and float trading metrics for Aura Consolidated Group
      on the ASX.
    whyItMatters: >-
      While Aura completed the Qoria acquisition and listed on the ASX (AXQ) in July 2026, full enterprise valuation and
      public trading multiples require verified market-cap disclosures.
    diligencePath: 'Review subsequent ASX quarterly filings and audited annual statements for Aura Consolidated Group (ASX: AXQ).'
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-enumeration
    missingEvidence: >-
      Complete roster of senior vice presidents, independent board committee chairs, and subsidiary managing directors
      post-Qoria integration.
    whyItMatters: >-
      Public releases disclose the C-suite (CEO, CFO, CMO, CPO), but full governance and operational committee
      leadership remains undisclosed in initial transaction materials.
    diligencePath: Examine subsequent statutory proxy filings and ASX annual reports for committee charter and director disclosures.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: institutional-stakeholder-map
    missingEvidence: >-
      Detailed post-merger cap table showing exact equity percentages, voting rights, and liquidation preferences across
      venture sponsors and former Qoria shareholders.
    whyItMatters: >-
      Major institutional holders (Madrone, Ten Eleven, Warburg Pincus, Accel) hold significant equity, but exact
      post-ASX ownership distribution has not been published in detail.
    diligencePath: 'Audit ASX substantial shareholder notices (Form 603/604) for Aura Consolidated Group (ASX: AXQ).'
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-and-share
    missingEvidence: >-
      Audited segment revenue split between direct retail D2C consumer subscribers and employer-sponsored voluntary
      benefits.
    whyItMatters: Prevents independent determination of true consumer TAM penetration versus corporate benefit account adoption.
    diligencePath: >-
      Request audited revenue disclosures and broker commission schedules for the MetLife voluntary benefit distribution
      channel.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, discounting, refunds, and revenue mix by consumer plan and partner contract.
    whyItMatters: Public list pricing cannot establish realized revenue quality or the durability of ARPU.
    diligencePath: Request billing extracts and monthly cohort revenue bridges by plan and channel for 2024 through September 2026.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, payback, commission burden, gross retention, and contribution margin by direct, employer, school, and MSP
      channel.
    whyItMatters: >-
      Sales and marketing consumes a large share of revenue, and blended public metrics cannot establish channel
      profitability.
    diligencePath: Obtain monthly cohort economics, partner commission schedules, and acquisition-spend attribution by channel.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, debt draws, covenant headroom, transaction uses, and the next financing
      trigger.
    whyItMatters: Closing liquidity includes borrowing capacity and cannot be treated as cash runway.
    diligencePath: >-
      Request the September 2026 balance sheet, 18-month cash forecast, debt schedule, covenant calculations, and
      downside liquidity case.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: metric-comparability
    missingEvidence: >-
      A reconciliation of the 2021 company claim of more than $220 million in annual revenue to the later filed GAAP
      revenue series.
    whyItMatters: Unreconciled historical labels can create a false growth or contraction narrative.
    diligencePath: >-
      Request the original 2021 metric definition, entity perimeter, accounting basis, and a bridge to 2024-2026 GAAP
      revenue.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: breach-financial-risk
    missingEvidence: Post-breach churn, refunds, remediation cost, insurance recovery, partner reviews, and sales-pipeline impact.
    whyItMatters: The event is documented, but its effect on retention, acquisition efficiency, and cash needs is not public.
    diligencePath: Request incident-specific cost records and pre/post-event cohort and partner retention analyses.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: technical-benchmarks
    missingEvidence: >-
      Independent laboratory benchmarks and empirical false-positive/detection rates for Aura's antivirus, phishing
      detection, and scam call blocking modules.
    whyItMatters: >-
      Without independent AV-Test or AV-Comparatives results, the technical efficacy of Aura's threat prevention engine
      relative to Bitdefender, Norton, or CrowdStrike cannot be verified.
    diligencePath: Request third-party efficacy evaluations or internal malware laboratory test results during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: >-
      Public developer platform documentation, API reference guides, and software development kits for third-party
      enterprise integrations.
    whyItMatters: >-
      Aura maintains a closed proprietary architecture; the lack of public APIs restricts enterprise custom workflow
      integration to predefined partner channels.
    diligencePath: Review technical integration documentation provided to MetLife and MSP distribution partners under NDA.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: customer-retention-benchmarks
    missingEvidence: >-
      Audited gross retention rate (GRR), net revenue retention (NRR), and 12-month cohort retention tables across D2C
      and MetLife benefit tiers.
    whyItMatters: >-
      Without verified retention cohorts, customer lifetime value and the durability of promotional pricing cannot be
      evaluated.
    diligencePath: >-
      Request confidential subscription retention schedules and MetLife employer renewal data under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: post-breach-churn
    missingEvidence: >-
      Empirical monthly churn rates, customer support ticket volume, and cancellation data following the March 2026 data
      breach disclosure.
    whyItMatters: >-
      Determines whether the 900,000-record vishing incident caused measurable customer defection or brand damage in
      consumer trust.
    diligencePath: Review quarterly churn rate deltas between Q1 2026 and Q3 2026 alongside customer sentiment tracking.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: post-breach-churn
    missingEvidence: >-
      Audited post-breach churn figures, customer refund requests, and renewal rates following the March 2026 marketing
      list compromise.
    whyItMatters: >-
      Direct customer trust and retention impact determine whether customer acquisition cost escalates or consumer ARR
      degrades.
    diligencePath: Request monthly consumer cohort renewal and cancellation metrics for Q1 2026 through Q3 2026.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: regulatory-compliance-audit
    missingEvidence: Third-party compliance audit reviews and ongoing reporting logs under the CFPB consent decree framework.
    whyItMatters: >-
      Verifies whether operational integration of Intersections Inc / Identity Guard has eliminated recurring
      subscription billing disputes.
    diligencePath: Obtain independent regulatory compliance reviews and customer dispute resolution logs.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: stale
    severity: material
    topic: current-liquidity
    missingEvidence: >-
      Current cash, debt, burn, runway, margins, financing preferences, covenants, and capital requirements; the
      retained financing announcement is from 2021.
    whyItMatters: Funding raised in 2021 is not cash available in 2026 and cannot establish present resilience or dilution risk.
    diligencePath: >-
      Obtain audited 2025 financials, 2026 monthly management accounts, cash and debt schedules, financing documents,
      and a board-approved forecast.
    relatedQuestionRefs:
      - QR006
  - type: missing-source
    severity: material
    topic: homonym-exclusion
    missingEvidence: >-
      Relevant net-new independent or primary risk sources for the target Aura digital-safety company; the assigned
      net-new sources are unrelated homonyms.
    whyItMatters: >-
      Homonym evidence can satisfy mechanical source counts while creating false company allegations if entity identity
      is not screened.
    diligencePath: >-
      In a later authorized discovery cycle, use the official domain, Burlington headquarters, and digital-safety
      product terms to retrieve direct incident, regulator, court, and partner evidence.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Signed Series G documents, fully diluted capitalization, liquidation stack, dividend terms, debt balances,
      covenants, and current common-equity ownership.
    whyItMatters: >-
      Post-money valuation does not establish proceeds to common shareholders or dilution under downside and exit
      outcomes.
    diligencePath: >-
      Obtain the charter, stock purchase agreement, investor-rights documents, current cap table, debt schedule, and
      management-prepared exit waterfall under NDA.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financials-and-retention
    missingEvidence: >-
      Audited current revenue and ARR reconciliation, gross margin, operating cash flow, cash balance, burn, customer
      cohorts, channel concentration, and post-incident renewal data.
    whyItMatters: >-
      These inputs determine whether growth is durable, whether additional financing is required, and what valuation or
      target return could be supported.
    diligencePath: >-
      Request audited financial statements, monthly KPI bridges, customer and partner cohorts, cash and debt schedules,
      and incident-linked churn analysis under NDA.
    relatedQuestionRefs:
      - QV010
    relatedTableRefs:
      - TV002
      - TV003
