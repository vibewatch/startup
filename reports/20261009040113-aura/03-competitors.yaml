callouts:
  - calloutType: "risk"
    title: "Unbundling Risk from Specialized Privacy Services"
    body: "Aura's core pricing defense—that a unified $144 to $384 suite is cheaper than buying disparate identity, antivirus, and VPN products—collapses when consumer intent is driven solely by data broker removal. With specialized services like PrivacyOn delivering multi-person broker removal for $99.96 annually, Aura risks high customer acquisition costs and churn among single-utility subscribers."
    claimRefs:
      - "CP011"
      - "CP012"
  - calloutType: "insight"
    title: "Enterprise and MSP Channel Insulation"
    body: "Aura's expansion into enterprise employee benefits via MetLife and identity-centric BYOD security for MSPs provides structural margin and retention insulation. Enterprise partnerships represented over 30% of ARR at year-end 2025, enabling Aura to bypass pure-play consumer acquisition friction and counter incumbent scale."
