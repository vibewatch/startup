company:
  name: "Aura"
chapter:
  number: 4
  title: "Financials"
  summary: "Aura's September 2026 S-1/A shows a recurring subscription business with $119.9 million of standalone revenue in the first half of 2026, while the post-Qoria group reported $339.7 million of pro forma ARR. Revenue growth and improving gross contribution are encouraging, but $44.4 million of first-half operating cash use, acquisition-related leverage, and missing channel-level CAC and payback data keep financial underwriting dependent on private diligence."
sections:
  - id: "revenue-model"
    title: "Recurring Revenue With Multiple Distribution Economics"
    body: >-
      Aura earns primarily recurring subscription revenue through direct-to-consumer and partner channels, with the latter spanning employee benefits and other distribution relationships [CI001]. The public consumer entry price is $10 per month, but that is list pricing rather than evidence of realized price, discounts, or revenue per contract [CI002]. Revenue is recognized ratably over non-cancellable terms that typically range from one month to three years; a significant portion of subscribers pay before service delivery, which supports cash collection but creates contract liabilities [CI003]. In the first half of 2026, direct-to-consumer revenue was $79.3 million and partner revenue was $40.7 million, or approximately 66% and 34% of the $119.9 million total, respectively [CI005]. This mix provides more than one acquisition route, yet the public record does not isolate partner commissions, school economics, MSP pricing, or realized discounting.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "traction-and-unit-economics"
    title: "Growth Is Visible; Full Unit Economics Are Not"
    body: >-
      Standalone Aura revenue reached $119.9 million for the six months ended June 30, 2026, 31% above the comparable 2025 period [CI004]. The combined Aura-Qoria presentation used a different lens: pro forma ARR of $339.7 million at quarter-end, also up 27% year over year, so it should not be substituted for GAAP revenue [CI006]. Direct-to-consumer monthly ARPU was $16.61, direct-to-consumer net revenue retention was 92%, and employee-benefits net revenue retention was 110% [CI007]. Based on reported revenue and cost of revenue, first-half gross margin was approximately 73.9%, versus approximately 71.3% a year earlier [CI008]. These are useful quality signals, but CAC, payback, cohort contribution margin, logo concentration, cancellation rates, and partner-level renewal economics remain unavailable.
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI002"
  - id: "cost-and-profitability"
    title: "Service Costs Are Scalable, but Marketing Still Dominates"
    body: >-
      Direct service costs include credit monitoring, identity-fraud insurance, payment processing, software and servers, VPN hosting, call-center operations, and customer support [CI009]. Sales and marketing expense was $86.4 million in the first half of 2026, approximately 72% of revenue, making acquisition efficiency the central margin variable [CI010]. On a combined pro forma basis, management reported a $12.6 million second-quarter adjusted EBITDA loss, a 51% year-over-year improvement, alongside $27 million of annualized cost actions against a $55 million program [CI011]. Adjusted EBITDA excludes acquisition costs, stock compensation, mark-to-market changes, and other items, so the improvement does not establish cash breakeven. The underwriting case requires the cost program to convert into durable cash savings without impairing retention or growth.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
  - id: "capital-adequacy"
    title: "Liquidity Improved at Close, but Financing Dependency Persists"
    body: >-
      Aura used $44.4 million of cash in operating activities in the first half of 2026, compared with $50.8 million a year earlier [CI012]. At June 30, it held $17.0 million of unrestricted cash and $70.8 million of restricted cash, principally including transaction funds not then available for general use [CI013]. At the July transaction close, management reported $124.0 million of total liquidity after costs; that measure included cash and available revolver capacity and followed a $100 million equity raise and an upsized $100 million debt facility [CI014]. The balance sheet also carried $48.9 million under a customer-investment financing arrangement and a $25.0 million convertible note at December 31, 2025 [CI015]. Separately, a reported March 2026 breach affected approximately 900,000 records, but public evidence does not quantify resulting churn, remediation cost, or partner impact [CI016]. The financial verdict is therefore growth-positive but not yet fully underwritable: revenue quality is increasingly visible, while capital needs and downside sensitivity require private data.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
