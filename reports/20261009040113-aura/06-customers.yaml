callouts:
  - calloutType: "risk"
    title: "Enterprise Channel Concentration and Intermediary Margin Dependency"
    body: "With more than 30% of ARR originating from enterprise partnerships and exclusive distribution through MetLife, Aura's enterprise growth is heavily leveraged to third-party broker performance and carrier terms. Any shift in MetLife's underwriting priorities or benefit shelf placement could materially disrupt commercial momentum."
    claimRefs:
      - "CU005"
  - calloutType: "insight"
    title: "Identity-Centric BYOD as an Untapped MSP Expansion Vector"
    body: "By unbundling identity protection from invasive mobile device management, Aura Business for MSPs addresses an underserved market where 65% of providers face BYOD demand but hesitate to manage personal hardware due to liability. Successful Entra ID integrations could establish a high-retention B2B channel."
    claimRefs:
      - "CU004"
      - "CU008"
      - "CU009"
