  title: "Customers"
  summary: "Aura's customer base spans direct-to-consumer digital safety subscribers, enterprise employer benefit channels distributed via MetLife, and an emerging managed service provider (MSP) BYOD tier. While consumer adoption is anchored in family online protection and credit monitoring, commercial durability is tested by channel concentration, post-incident brand overhang, and the absence of audited retention benchmarks."
sections:
  - id: "customer-segmentation-and-go-to-market"
    title: "Customer Segmentation and Multi-Channel GTM Structure"
    body: |
      Aura operates across distinct buyer and payer segments spanning consumer households, corporate employee benefit programs, and small-to-medium business IT environments. In the direct-to-consumer (D2C) lane, household heads subscribe to identity theft monitoring, device antivirus, VPN capabilities, and family safety controls starting at $10 monthly. In the enterprise employer benefits lane, distributed exclusively through MetLife, corporate HR buyers sponsor digital security plans as voluntary employee benefits. Concurrently, Aura has expanded into enterprise security by targeting managed service providers (MSPs) with identity-centric BYOD controls that integrate with Microsoft Entra ID without intrusive mobile device management.

      Enterprise employer benefits and direct commercial partnerships contributed more than 30% of Aura's reported annualized recurring revenue (ARR) as of December 2025. This dual-track go-to-market model diversifies customer acquisition away from direct digital ad spend, though it introduces significant intermediary dependence on MetLife's institutional sales cycle and broker networks.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory, Family Telemetry, and Production Deployments"
    body: |
      Aura's reported customer base has expanded from over one million customers following its Series F funding round to 1.6 million reported accounts in subsequent disclosures, supported by bundles across identity protection and family wellness. The company leverages proprietary behavioral data from its State of the Youth research to demonstrate real-world engagement, analyzing telemetry across children ages 8 to 17 to measure digital stress and app switching frequency. Furthermore, Aura's enterprise expansion addresses MSP demand where 65% of surveyed MSPs report client requests for BYOD identity management, mitigating vulnerability patterns where 55% of MSPs experienced security incidents over 24 months.

      In adjacent technology ecosystems, enterprise software platforms demonstrate rapid adoption loops for specialized agent workflows, as seen in Seismic's deployment of Aura Agents across 248 organizations and Expedia Group's completion of over 1,000 roleplay sessions across 260 users. While these enterprise deployments highlight the market appetite for automated workflows, Aura's core identity platform relies heavily on silent background monitoring, meaning active weekly user engagement remains concentrated in transactional fraud alerts and parental dashboard controls rather than continuous manual software interaction.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"

  - id: "retention-overhang-and-concentration-risks"
    title: "Retention Durability, Breach Overhang, and Procurement Diligence"
    body: |
      Customer retention and durability represent critical diligence areas for Aura given the elevated sensitivity of personal identity data. In March 2026, threat actors targeted Aura's marketing systems via a vishing campaign that compromised approximately 900,000 records from a legacy Circle Media Labs marketing tool, exposing names and email addresses alongside 35,000 detailed customer records. Although no Social Security numbers, banking credentials, or passwords were leaked, the incident created brand overhang and increased scrutiny across enterprise benefit brokers and MSP procurement teams evaluating platform trust.

      Furthermore, private-company opacity conceals net revenue retention (NRR), gross retention rates (GRR), and cohort churn metrics. While Aura's pricing baseline anchors around $150M ARR and post-separation growth targets exceeding 40% year-over-year, third-party analytics indicate steep operating losses and negative EBITDA margins. Without audited cohort disclosure, investors face severe concentration risks tied to MetLife distribution, potential churn from introductory consumer discounts, and heightened enterprise vendor diligence cycles following security disclosures.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
