chapter:
  number: 1
  title: "Company Overview"
  summary: "Aura is an all-in-one consumer and family digital safety platform founded in 2017 by CEO Hari Ravichandran, providing identity theft protection, credit monitoring, and parental controls. In July 2026, Aura completed the acquisition of student safety leader Qoria Limited and listed on the Australian Securities Exchange under ticker AXQ, exiting Q2 2026 with $339.7 million in pro forma ARR and $124.0 million in total liquidity."
sections:
  - id: "corporate-identity-and-evolution"
    title: "Corporate Identity, Founding History, and Public Listing"
    body: "Aura Consolidated Group, Inc. is a global digital safety and wellbeing technology company that provides proactive online protection for individuals, families, educational institutions, and commercial enterprises. The business was originally established in 2017 by Founder and Chief Executive Officer Hari Ravichandran under the corporate name iSubscribed, initially focusing on personal identity theft protection and credit monitoring. The company underwent a major operational expansion in 2019 through the acquisition of Intersections Inc., the operator of the Identity Guard product family, subsequently consolidating its operations and rebranding as Aura. Today, Aura operates from the Greater Boston metropolitan area in Massachusetts, delivering an integrated subscription software platform that combines three-bureau credit monitoring with Experian Credit Lock, suspicious transaction alerts, dark web identity scanning, anti-virus defenses, virtual private networks, and parental control tools. In a transformative corporate transaction completed on July 17, 2026, Aura acquired Australian student safety and digital wellbeing provider Qoria Limited. Following the implementation of this scheme of arrangement, Aura commenced unrestricted public trading on the Australian Securities Exchange under the ticker symbol AXQ on July 20, 2026, transitioning from a privately held venture-backed unicorn into a dual-hemisphere public enterprise."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance Structure, and Regulatory History"
    body: "Aura is led by Founder and Chief Executive Officer Hari Ravichandran, a technology entrepreneur who previously founded and served as Chief Executive Officer of web hosting conglomerate Endurance International Group. Ravichandran maintains central authority over Aura's corporate vision, product roadmap, capital structure, and international acquisition strategy. Day-to-day financial operations and transaction execution are overseen by Chief Financial Officer Brian DeCenzo, who manages capital allocation, post-merger integration, and public reporting compliance under Australian Securities Exchange regulations. In mid-2026, Aura bolstered its senior executive leadership team by recruiting Steven Young as Global Chief Marketing Officer and Adam Medros as Chief Product Officer, positioning the organization to expand consumer subscriber acquisition, improve digital marketing unit economics, and accelerate the deployment of context-aware artificial intelligence across child wellbeing and parental safety applications. Governance diligence warrants close ongoing scrutiny due to historical regulatory enforcement actions and a recent cyber security incident. In 2018, Ravichandran settled an enforcement complaint with the U.S. Securities and Exchange Commission concerning alleged overstatement of subscriber metrics at Endurance, agreeing to personally pay $1.38 million without admitting wrongdoing. Additionally, Aura's 2019 acquisition target, Intersections Inc., had entered into a 2015 Consumer Financial Protection Bureau consent order requiring $1.2 million in penalties and consumer restitution regarding unfair billing for add-on credit products. Most recently, in March 2026, threat group ShinyHunters executed a successful vishing cyberattack against an employee, infiltrating an external marketing database inherited from the 2021 Circle Media Labs acquisition and compromising approximately 900,000 consumer records. While Aura confirmed that no passwords, banking credentials, or Social Security numbers were exfiltrated, the breach underscores key-person and inherited-asset security vulnerabilities."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization, Multi-Channel Distribution, and Financial Scale"
    body: "Prior to its 2026 public market transition, Aura raised more than $670 million in equity capital across institutional venture capital rounds. The company's capitalization history is anchored by a $200 million Series F financing completed in October 2021 at a $2.5 billion post-money valuation, led by Madrone Capital Partners with participation from Ten Eleven Ventures, General Catalyst, Warburg Pincus, and Accel. In March 2025, Aura secured a $140 million Series G equity round at a reduced post-money valuation of $1.6 billion, co-led by Ten Eleven Ventures and Madrone Capital Partners, alongside conventional debt financing. In July 2026, closing the Qoria acquisition was paired with a fresh $100 million equity raise and an upsized $100 million debt facility, equipping the merged business with $124.0 million in total transaction liquidity as of July 17, 2026. The merged group operates across three distinct distribution vectors: direct-to-consumer digital safety subscriptions starting at $10 per month, employer-sponsored voluntary employee benefits distributed exclusively through MetLife, and the enterprise Aura Business solution launched in April 2026 to capture identity-based BYOD security demand across managed service providers. On a pro forma basis combining Aura and Qoria under U.S. GAAP, the consolidated enterprise exited the second quarter of 2026 with $339.7 million in annual recurring revenue and generated $85.1 million in quarterly GAAP revenue, each expanding 27% year over year. Pro forma Adjusted EBITDA loss improved 51% year over year to $12.6 million, supported by $27 million in actioned annualized operating cost reductions as management targets positive free cash flow generation."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
