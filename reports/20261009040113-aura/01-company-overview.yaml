    body: "Aura's July 2026 acquisition of student safety leader Qoria Limited fundamentally shifted the company from a private U.S. consumer digital safety provider into a dual-hemisphere public company listed on the ASX (AXQ). The combined group exits Q2 2026 with $339.7 million in pro forma ARR, $124.0 million in total liquidity, and enterprise BYOD expansion, while targeting positive free cash flow."
