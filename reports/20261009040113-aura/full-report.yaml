      - number: '6.2'
        title: Adoption Trajectory, Family Telemetry, and Production Deployments
        blocks:
          - type: paragraph
            body: >
              Aura's reported customer base has expanded from over one million customers following its Series F funding
              round to 1.6 million reported accounts in subsequent disclosures, supported by bundles across identity
              protection and family wellness. The company leverages proprietary behavioral data from its State of the
              Youth research to demonstrate real-world engagement, analyzing telemetry across children ages 8 to 17 to
              measure digital stress and app switching frequency. Furthermore, Aura's enterprise expansion addresses MSP
              demand where 65% of surveyed MSPs report client requests for BYOD identity management, mitigating
              vulnerability patterns where 55% of MSPs experienced security incidents over 24 months.


              In adjacent technology ecosystems, enterprise software platforms demonstrate rapid adoption loops for
              specialized agent workflows, as seen in Seismic's deployment of Aura Agents across 248 organizations and
              Expedia Group's completion of over 1,000 roleplay sessions across 260 users. While these enterprise
              deployments highlight the market appetite for automated workflows, Aura's core identity platform relies
              heavily on silent background monitoring, meaning active weekly user engagement remains concentrated in
              transactional fraud alerts and parental dashboard controls rather than continuous manual software
              interaction.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
