      - CI009
      - CI012
  - id: FE001
    title: Aura Product and Security Architecture Stack
    type: stack
    summary: >-
      Architectural overview of Aura's multi-tiered delivery model spanning client endpoints, identity integrations, and
      cloud monitoring services.
    data:
      layers:
        - label: Enterprise & Partner Integration Layer
          detail: Multi-tenant MSP administration, Microsoft Entra ID conditional access sync, and MetLife benefit conduits.
        - label: Unified User Experience Layer
          detail: Cross-platform applications for iOS, Android, macOS, and Windows with Aura Intelligence scoring.
        - label: Core Application Engine
          detail: Encrypted Vault, password manager, parental rules engine, and Kidas Safe Gaming audio/text parsing.
        - label: Security & Transport Layer
          detail: Virtual Private Network (VPN) routing through 100+ virtual locations and local endpoint malware defense.
        - label: Upstream Data & Bureau Gateway
          detail: >-
            Direct three-bureau credit feeds (Experian, TransUnion, Equifax), bank transaction aggregators, and breach
            data pipelines.
        - label: Legacy & Acquired Infrastructure
          detail: >-
            Acquired subsidiary databases and marketing tools (Circle Media, Intersections) creating attack surface
            exposure.
