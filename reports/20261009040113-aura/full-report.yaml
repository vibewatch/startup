              Endurance operating metrics) and acquired subsidiary Intersections ($1.2 million CFPB consent order),
              coupled with a March 2026 ShinyHunters vishing breach exposing 900,000 consumer records, create ongoing
              reputational and brand trust hurdles that demand rigorous ongoing governance oversight.
