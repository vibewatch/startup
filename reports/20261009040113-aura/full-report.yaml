  - id: FR001
    title: Risk Severity and Residual Exposure Heatmap
    type: matrix
    summary: Evaluation of core operational, regulatory, and channel dependencies mapped across likelihood and residual impact.
    data:
      columns:
        - Evidence / likelihood state
        - Residual severity
        - Monitor or thesis-break trigger
      rows:
        - label: 2026 breach and trust exposure
          values:
            - label: Realized
              detail: A third-party account reports approximately 900,000 marketing records affected
              tone: risk
            - label: High
              detail: Aura's product proposition depends on digital-safety trust
              tone: risk
            - label: Forensic remediation absent or another material incident
              detail: Require closure evidence and post-incident retention before de-risking
              tone: risk
        - label: Acquired-data governance
          values:
            - label: Realized pathway
              detail: The reported breach involved Circle-era marketing tooling
              tone: risk
            - label: High
              detail: Data lineage and retained-system controls are not evidenced
              tone: risk
            - label: Incomplete inventory or deletion attestations
              detail: Require system inventory, data map, access logs, and deletion evidence
              tone: warning
        - label: Partner concentration
          values:
            - label: Disclosed, denominator ambiguous
              detail: Company says partner routes exceeded 30% of 2025 revenue; footnote cites end-of-period ARR
              tone: warning
            - label: High
              detail: MetLife is described as exclusive for employee benefits
              tone: risk
            - label: Adverse renewal or rising concentration
              detail: Require contract, renewal, cohort, and channel concentration data
              tone: risk
        - label: BYOD and Entra execution
          values:
            - label: Prospective
              detail: Architecture is described, but deployment performance is not public
              tone: warning
            - label: Material
              detail: Integration, privacy, support, and service-level performance remain untested
              tone: warning
            - label: Weak activation, renewal, or incident performance
              detail: Require deployment, support, privacy-audit, and service-level telemetry
              tone: risk
        - label: Historical governance matters
          values:
            - label: Historical
              detail: Prior-company SEC and pre-acquisition CFPB matters are not current Aura findings
              tone: neutral
            - label: Material diligence
              detail: Current board and compliance controls were not retained
              tone: warning
            - label: Control testing identifies recurring weaknesses
              detail: Review KPI definitions, billing controls, complaints, and audit oversight
              tone: risk
        - label: Current liquidity
          values:
            - label: Unknown
              detail: The retained financing evidence is from 2021
              tone: neutral
            - label: Potentially high
              detail: Current cash, debt, burn, runway, margins, and covenants are unavailable
              tone: warning
            - label: Runway or covenant headroom below investment threshold
              detail: Set the threshold after reviewing current financials and financing documents
              tone: risk
