              - CV008
              - CV010
              - CV012
              - CV016
      - number: '8.2'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Forge reports that Aura's March 24, 2025 Series G raised $89.65 million at $10.28 per share and a $1.6
              billion post-money valuation [CV001, CV002]. Aura's October 2021 release had announced a $200 million
              Series F at a $2.5 billion post-money valuation [CV005]. Comparing those two stated post-money marks
              yields a 36% decline, but this is a comparison of financing-round valuations across different dates and
              security terms, not proof of an equivalent decline in common-share value [CV006]. EquityZen's public page
              confirms a pre-IPO marketplace context while withholding current valuation, cap-table, funding-history,
              and preference detail behind accreditation and access controls [CV004]. The public evidence therefore
              supports financing context, not a precise present-day price.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Thesis, Anti-Thesis, and Downside
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Aura can combine a broad consumer protection bundle with partner and enterprise
              distribution. The official site advertises plans starting at $10 per month, while Aura's April 2026
              release says employee-benefit and direct partnerships represented more than 30% of 2025 revenue; that
              release separately identifies its basis as reported end-of-period ARR for December 2025, so the
              denominator needs diligence rather than reinterpretation [CV007, CV008]. The same release describes an
              MSP-focused BYOD product, adding a potential enterprise route [CV009]. The anti-thesis is trust and
              execution risk: the retained independent review reports that approximately 900,000 records were stolen in
              a March 2026 vishing incident [CV010]. Historical scale and a corporate venture initiative add context,
              but neither resolves current unit economics [CV012, CV013].
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Scenarios, Exit Readiness, and Diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional scenarios, not numeric probability weights or defensible valuation
              ranges. A bull case requires audited growth, retention, margins, diversified partner contribution, and
              evidence that the 2026 security incident did not impair renewals. A base case requires stable subscription
              economics and a financing structure that leaves adequate common-equity value at or below the latest
              reported round mark. A bear case follows if churn, partner concentration, remediation costs, or new
              capital needs weaken the equity position [CV008, CV010, CV015]. EquityZen describes IPO, merger or
              acquisition, and eligible secondary transactions as possible private-market exits, but the retained page
              does not show an Aura-specific timetable or executable liquidity [CV011]. Final diligence must obtain
              audited financials, cohort retention, channel concentration, debt, cash, and the complete preference
              waterfall before a target return or hold period can be underwritten [CV015, CV016].
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-specific recommendation withheld
            body: >-
              The $1.6 billion Series G post-money valuation is a dated financing reference, not a verified current
              common-equity value. A defensible entry price requires the signed round documents, fully diluted
              capitalization, debt and cash balances, audited current revenue and ARR reconciliation, retention cohorts,
              margins, and incident-related churn or partner-renewal evidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
              - CV016
