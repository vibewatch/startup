  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Consumer Product Architecture and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Aura organizes its customer-facing offering into an all-in-one digital safety ecosystem designed to
              replace fragmented standalone utilities such as antivirus engines, standalone password vaults, and
              credit-score dashboards. In daily consumer workflows, the platform operates as a background guardian
              across Windows, macOS, iOS, Android, and web browser extensions, continuously monitoring threat surfaces
              without requiring active user intervention. The primary user journey begins with enrollment where members
              link personal identifying attributes including Social Security numbers, email addresses, credit and debit
              accounts, and retirement accounts. Aura monitors these identity vectors against third-party breach dumps
              and billions of data points, alerting subscribers when exposed records are detected. For financial and
              credit workflows, Aura provides three-bureau credit monitoring across Experian, Equifax, and TransUnion,
              featuring instant lockdown capabilities through Experian Credit Lock. Complementing credit vigilance,
              transaction tracking identifies anomalous withdrawals and spending spikes based on modeled user behavior
              and geolocation. Digital wellbeing and family safety features round out the consumer workflow: parents
              manage child screen time and app access across platforms like YouTube and Roblox, while the integrated
              Safe Gaming module monitors in-game text and voice communications across more than 200 PC titles for
              cyberbullying and online predator risks.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
