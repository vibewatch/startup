              - CM009
      - number: '2.3'
        title: Buyer Segmentation, Procurement Economics, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Aura's go-to-market structure spans three distinct buyer segments characterized by divergent purchasing
              motivations and economics. Direct retail consumers purchase self-serve monthly or annual subscriptions
              driven by acute fraud events, proactive credit management, or family parental control needs. Corporate
              enterprise buyers procure Aura through voluntary employee benefits programs, distributed via major
              insurance partners including MetLife, which alongside other partnerships accounted for over 30% of Aura's
              ARR in 2025. In the SMB and mid-market tier, Managed Service Providers license Aura Business to secure
              unmanaged employee mobile devices accessing cloud applications via Microsoft Entra ID. Critical diligence
              gaps remain regarding the precise gross margin structure of insurance partnerships, cohort retention rates
              following promotional onboarding periods, and the degree to which enterprise BYOD offerings cannibalize
              direct consumer subscriptions.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The TAM Illusion: Loss Headwinds vs. Wallet Share'
            body: >-
              Marketing figures frequently conflate the $21 billion lost to cybercrime with the addressable software
              market. Consumer digital safety spend is highly discretionary, forcing vendors like Aura to bundle VPN,
              antivirus, and credit monitoring to defend a $10 to $30 monthly willingness to pay against free bank
              alerts.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
          - type: callout
            title: Distribution Dependency and Enterprise BYOD Friction
            body: >-
              While enterprise employee benefits through MetLife and direct partnerships represent over 30% of revenue,
              expanding into SMBs via MSPs faces friction. MSPs historically resisted BYOD management due to privacy
              liability, requiring Aura's agentless Entra ID conditional access architecture to prove adoption.
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Core Alternatives
        blocks:
          - type: paragraph
            body: >-
              Aura's competitive universe divides into three distinct tiers: legacy cybersecurity and identity theft
              conglomerates, specialized point solutions focusing on data broker removal or credit monitoring, and
              zero-cost status quo mechanisms. In consumer identity safety, Norton LifeLock represents the primary
              direct legacy incumbent, competing across identity alerts, credit bureau tracking, and antivirus bundles.
              However, specialized point competitors have emerged to unbundle Aura's value proposition. Services such as
              PrivacyOn, DeleteMe, and Incogni target consumer demand specifically for data broker and people-search
              site removal, challenging Aura's high-ticket all-in-one packaging. Furthermore, status-quo alternatives
              such as free statutory credit freezes across Equifax, Experian, and TransUnion provide preventative
              protection that monitoring suites cannot replicate. In response to consumer pricing resistance and growth
              limits, Aura has expanded into enterprise security with an identity-centric BYOD offering distributed
              through MSPs and its exclusive employee benefits channel with MetLife.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
