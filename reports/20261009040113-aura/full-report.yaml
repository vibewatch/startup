              - CR005
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with low confidence, high risk, and a valuation stance of insufficient
              public evidence. Aura has a real subscription product, a reported historical revenue base, and a newer
              partner-led distribution motion, but those facts do not establish a current enterprise value or an
              investable return profile [CV007, CV008, CV012, CV016]. Forge reports a $1.6 billion March 2025 Series G
              post-money mark, yet it also warns that its private-company data can depend on limited inputs and may not
              represent an executable market price [CV001, CV003]. Entry discipline should therefore begin with primary
              financing documents, audited operating data, and a security-class waterfall rather than treating the
              reported round valuation as a current common-equity price.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV012
              - CV016
