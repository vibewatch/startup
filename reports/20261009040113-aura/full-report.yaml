  - id: FI001
    title: Revenue-to-Cash Economics
    type: flow
    summary: >-
      Aura converts direct and partner subscription activity into ratably recognized revenue, then absorbs
      service-delivery and acquisition costs before reaching operating cash flow.
    data:
      nodes:
        - id: customer-entry
          label: Direct and partner acquisition
          detail: Consumers, employers, schools, and other partners enter through channels with different acquisition costs.
        - id: subscription-billing
          label: Subscription billing
          detail: Monthly, one-year, and two-year plans; many subscribers pay before fulfillment.
        - id: revenue-recognition
          label: Ratable revenue recognition
          detail: Revenue is recognized over non-cancellable terms typically lasting one month to three years.
        - id: service-delivery
          label: Direct service costs
          detail: Monitoring, insurance, processing, infrastructure, call-center, and support costs reduce gross profit.
        - id: growth-spend
          label: Sales, marketing, and product spend
          detail: Sales and marketing alone equaled approximately 72% of H1 2026 revenue.
        - id: cash-conversion
          label: Operating cash flow
          detail: H1 2026 operating cash use was $44.4 million despite revenue growth.
    approximationNotes: >-
      The figure is a mechanism map, not a proportional waterfall; it does not infer undisclosed CAC, payback, or
      channel margins.
