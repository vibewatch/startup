        - The mark is dated and Forge disclaims audit or independent verification
        - Signed financing documents and a current fully diluted cap table
      - - Historical scale
        - Aura reported more than $220M in annual revenue in October 2021
        - Historical revenue is neither current revenue nor ARR and does not establish present margins
        - Audited 2024-2026 revenue, ARR reconciliation, gross margin, and cash flow
      - - Distribution
        - Aura says partner routes represented more than 30% of 2025 revenue, with an end-period ARR footnote
        - The public release does not disclose partner concentration, economics, or renewal rates
        - Partner-level ARR, gross retention, commission burden, and renewal schedules
      - - Trust
        - The product bundle addresses identity, credit, privacy, and device security
        - A retained review reports approximately 900,000 records stolen in a 2026 vishing incident
        - Independent remediation assessment and evidence of unaffected retention and renewals
    notes: Company-issued product, revenue, and channel statements are not classified as independent verification.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
      - CV012
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Required assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Audited growth and margins; strong retention; diversified partner contribution; verified incident remediation
        - Apply a selected comparable multiple only after current ARR and net debt are verified
        - Enterprise execution and trust recovery fail to translate into durable economics
        - Not quantifiable from retained public evidence
      - - Base
        - Stable consumer economics; partner contribution persists; no material new security event
        - Use the 2025 round mark only as a reference, adjusted for current performance and preference terms
        - Stale price discovery and partner concentration obscure common-equity value
        - Not quantifiable from retained public evidence
      - - Bear
        - Higher churn, weaker partner renewals, greater remediation cost, or additional capital need
        - Value from downside cash needs and the verified preference waterfall; no public floor is supportable
        - Dilution, preference overhang, trust impairment, and constrained liquidity
        - Risk remains material until primary diligence closes the gaps
    notes: >-
      No numeric valuation range, probability, target return, or hold period is presented because current audited
      financial and capitalization inputs are unavailable.
    claimRefs:
      - CV006
      - CV008
      - CV010
      - CV011
      - CV015
      - CV016
