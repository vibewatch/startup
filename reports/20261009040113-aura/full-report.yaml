        title: Exhibits
        blocks:
          - type: callout
            title: Recurring growth with improving gross contribution
            body: >-
              Standalone revenue grew 31% year over year in H1 2026, while the filed revenue and cost-of-revenue figures
              imply gross margin expanded by roughly 2.6 percentage points [CI004, CI008].
            calloutType: strength
            claimRefs:
              - CI004
              - CI008
