              - CR011
      - number: '7.3'
        title: Operational Security Incidents, Partner Reliance, and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The reported breach pathway ran through a marketing list and tooling retained after the 2021 Circle
              acquisition, making acquired-data inventory and access control a concrete integration risk rather than a
              hypothetical one (CR003, CR010). Distribution is also concentrated: Aura describes MetLife as the
              exclusive channel for its employee-benefits offering and says that offering plus direct partnerships
              represented more than 30% of 2025 revenue, although the release's footnote describes the basis as December
              2025 end-of-period ARR (CR004, CR014). That revenue-versus-ARR inconsistency prevents a precise
              concentration calculation. Aura Business adds Microsoft Entra ID and MSP dependencies; Aura cites Omdia
              research that 55% of MSPs had experienced a BYOD incident in the preceding 24 months and says its product
              does not inspect personal content or activity (CR005, CR015, CR016). Current burn, runway, margins,
              partner renewal terms, and channel-level retention are unavailable; the only financing mark retained here
              is the company's 2021 Series F announcement (CR006).
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR014
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Brand Trust Overhang Post-2026 Marketing Data Compromise
            body: >-
              A third-party account says the March 2026 vishing incident reached approximately 900,000 marketing records
              from tooling retained after the Circle acquisition. Aura said financial information, Social Security
              numbers, and passwords were not taken, but independent remediation evidence and post-incident retention
              data are absent.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR013
