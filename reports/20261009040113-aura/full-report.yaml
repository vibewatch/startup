      - number: '6.3'
        title: Retention Durability, Breach Overhang, and Procurement Diligence
        blocks:
          - type: paragraph
            body: >
              Customer retention and durability represent critical diligence areas for Aura given the elevated
              sensitivity of personal identity data. In March 2026, threat actors targeted Aura's marketing systems via
              a vishing campaign that compromised approximately 900,000 records from a legacy Circle Media Labs
              marketing tool, exposing names and email addresses alongside 35,000 detailed customer records. Although no
              Social Security numbers, banking credentials, or passwords were leaked, the incident created brand
              overhang and increased scrutiny across enterprise benefit brokers and MSP procurement teams evaluating
              platform trust.


              Furthermore, private-company opacity conceals net revenue retention (NRR), gross retention rates (GRR),
              and cohort churn metrics. While Aura's pricing baseline anchors around $150M ARR and post-separation
              growth targets exceeding 40% year-over-year, third-party analytics indicate steep operating losses and
              negative EBITDA margins. Without audited cohort disclosure, investors face severe concentration risks tied
              to MetLife distribution, potential churn from introductory consumer discounts, and heightened enterprise
              vendor diligence cycles following security disclosures.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Channel Concentration and Intermediary Margin Dependency
            body: >-
              With more than 30% of ARR originating from enterprise partnerships and exclusive distribution through
              MetLife, Aura's enterprise growth is heavily leveraged to third-party broker performance and carrier
              terms. Any shift in MetLife's underwriting priorities or benefit shelf placement could materially disrupt
              commercial momentum.
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: Identity-Centric BYOD as an Untapped MSP Expansion Vector
            body: >-
              By unbundling identity protection from invasive mobile device management, Aura Business for MSPs addresses
              an underserved market where 65% of providers face BYOD demand but hesitate to manage personal hardware due
              to liability. Successful Entra ID integrations could establish a high-retention B2B channel.
            calloutType: insight
            claimRefs:
              - CU004
              - CU008
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Profile and Residual Exposures
        blocks:
          - type: paragraph
            body: >-
              The strongest evidenced risk is a mismatch between Aura's trust proposition and its own security
              execution. Aura says it never sells customer data and advertises up to $1 million of identity-theft
              coverage for each adult member, yet a third-party account says a March 2026 vishing attack reached about
              900,000 marketing records (CR001, CR002, CR003). Aura said financial information, Social Security numbers,
              and passwords were not taken, but roughly 35,000 records reportedly included home addresses and phone
              numbers (CR012, CR013). The assigned evidence does not include Aura's incident notice, forensic report,
              remediation testing, insurance terms, or post-incident retention. Residual impact is therefore high but
              not quantifiable: another material incident, or failure to evidence completed remediation, should be
              treated as a thesis-break trigger rather than assumed away.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
