      - number: '5.3'
        title: Data Protection, Legacy Integration Exposure, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Aura pairs its defensive software with comprehensive customer guarantees, backing each adult subscription
              with up to $1 million in identity theft insurance to cover eligible remediation losses, legal fees, and
              stolen funds, supported by 24/7 US-based fraud resolution specialists. Despite marketing bank-grade
              encryption standards and strict commitments never to sell consumer data to third parties, the platform's
              multi-acquisition history presents material security risks. Over its operating lifespan, Aura absorbed
              legacy businesses including Intersections Inc. (now Identity Guard) and Circle Media Labs. This
              acquisitive architecture resulted in fragmented secondary systems. In March 2026, the ShinyHunters
              cybercriminal group executed a vishing attack targeting employee credentials, successfully breaching an
              external marketing database inherited from the 2021 Circle acquisition. The breach compromised
              approximately 900,000 consumer records, including roughly 35,000 records containing physical addresses and
              phone numbers. Although Aura confirmed that core identity vectors like Social Security numbers, passwords,
              and banking credentials were not breached, the incident exposes severe post-acquisition data sanitization
              and access-governance deficits. Technical diligence must scrutinize how thoroughly acquired assets have
              been audited and integrated into Aura's primary security perimeter.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: M&A Integration Debt Creates Credibility Overhang
            body: >-
              For a digital safety vendor whose core brand proposition is identity safeguarding, the March 2026 data
              breach—in which 900,000 customer records were exfiltrated from an acquired marketing platform via employee
              vishing—demonstrates substantial integration vulnerability. Enterprise buyers and MSP partners require
              rigorous proof that subsidiary environments have been isolated from core infrastructure.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
          - type: callout
            title: Identity-Centric BYOD Bridges Consumer and Enterprise Revenue
            body: >-
              By leveraging its consumer endpoint client to provide device posture checks via Microsoft Entra ID
              conditional access, Aura unlocks a differentiated enterprise GTM for MSPs. This approach avoids heavy MDM
              agent rollouts on employee personal devices while securing corporate applications against compromised
              mobile endpoints.
            calloutType: insight
            claimRefs:
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Multi-Channel GTM Structure
        blocks:
          - type: paragraph
            body: >
              Aura operates across distinct buyer and payer segments spanning consumer households, corporate employee
              benefit programs, and small-to-medium business IT environments. In the direct-to-consumer (D2C) lane,
              household heads subscribe to identity theft monitoring, device antivirus, VPN capabilities, and family
              safety controls starting at $10 monthly. In the enterprise employer benefits lane, distributed exclusively
              through MetLife, corporate HR buyers sponsor digital security plans as voluntary employee benefits.
              Concurrently, Aura has expanded into enterprise security by targeting managed service providers (MSPs)
              with identity-centric BYOD controls that integrate with Microsoft Entra ID without intrusive mobile device
              management.


              Enterprise employer benefits and direct commercial partnerships contributed more than 30% of Aura's
              reported annualized recurring revenue (ARR) as of December 2025. This dual-track go-to-market model
              diversifies customer acquisition away from direct digital ad spend, though it introduces significant
              intermediary dependence on MetLife's institutional sales cycle and broker networks.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
