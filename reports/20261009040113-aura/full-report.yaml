  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Aura positions its product footprint across the emerging consumer digital safety and wellness category,
              sitting at the intersection of consumer identity theft protection, credit monitoring, digital privacy
              tools, and device security. Historically, this market was fragmented across standalone point solutions
              including bureau credit trackers, dedicated antivirus software vendors, virtual private network utilities,
              and basic parental control apps. Aura's core boundary consolidates these capabilities into an integrated
              multi-device subscription spanning individual, couple, and family tiers. In 2026, Aura expanded its
              functional boundary beyond retail households into business environments through Aura Business and Managed
              Service Provider channels, focusing on identity-centric bring-your-own-device security rather than
              traditional hardware mobile device management. The primary non-consumption substitutes remain status-quo
              consumer inertia, free credit tracking tools provided by retail banking portals, and employer-sponsored
              cybersecurity awareness training programs. Additionally, market perimeter discipline requires excluding
              public entities sharing the Aura name, such as Aura Biosciences (NASDAQ: AURA), which operate in entirely
              unrelated biotechnology sectors.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses, Growth Drivers, and Sizing Discrepancies
        blocks:
          - type: paragraph
            body: >-
              Evaluating Aura's addressable market requires distinguishing top-line cybercrime loss statistics from
              realizable subscription spend. While broader industry marketing cites $21 billion in annual online crime
              losses reported by the FBI in 2025 and broad global cybersecurity spend forecasts exceeding $300 billion,
              Aura's serviceable addressable market is defined by household and enterprise seat budgets. Within the
              United States, roughly 130 million households represent potential consumer buyers, yielding a serviceable
              consumer market of $15.6 billion assuming a baseline entry pricing of $10 per month. Aura's serviceable
              obtainable market represents modern digital-first households and corporate benefit enrollees willing to
              pay for bundled protection, where Aura currently addresses over 1.6 million members. Key growth drivers
              include accelerating cybercrime frequency, regulatory focus on child online privacy, and employer adoption
              of voluntary identity benefits. Growth constraints center on severe private-company financial opacity,
              consumer price sensitivity, commoditization of standalone VPN and antivirus features, and trust overhang
              following security incidents.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
