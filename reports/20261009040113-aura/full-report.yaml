      - number: '7.2'
        title: Regulatory Oversight, Historical Consent Decrees, and Governance
        blocks:
          - type: paragraph
            body: >-
              The pool identifies two historical matters that warrant governance diligence but does not establish a
              current enforcement action against Aura. A third-party summary reports that CEO Hari Ravichandran
              personally paid $1.38 million to resolve SEC allegations concerning subscriber metrics at a prior company,
              with no admission of wrongdoing (CR007). The same source says Intersections, acquired by Aura in 2019 and
              later associated with the Identity Guard line, had previously entered a CFPB consent order involving an
              approximately $1.2 million penalty plus restitution (CR008, CR009). These are history and control-design
              questions, not proof of present non-compliance. The 2026 breach creates a separate privacy-notification
              and remediation diligence path, but the assigned sources do not show the jurisdictions notified, claims
              filed, or regulator disposition. Four assigned results concern unrelated Aura-named entities and must not
              be used as target-company allegations (CR011).
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
