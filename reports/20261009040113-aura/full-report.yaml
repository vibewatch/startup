  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision path separates operating evidence from financing marks, risk evidence, and unresolved underwriting
      inputs.
    data:
      nodes:
        - id: historical-scale
          label: Historical scale
          detail: >-
            Aura reported more than $220M in annual revenue in October 2021; this is historical revenue, not current
            ARR.
          tone: positive
        - id: channel-signal
          label: Channel signal
          detail: >-
            Aura reported more than 30% partner contribution for 2025, with an end-period ARR basis noted in the
            release.
          tone: positive
        - id: round-mark
          label: Latest retained round mark
          detail: Forge reports a $1.6B post-money Series G valuation dated March 2025.
          tone: neutral
        - id: pricing-caveat
          label: Pricing caveat
          detail: Forge warns that its private-company data may rely on limited inputs and may not represent market price.
          tone: warning
        - id: trust-risk
          label: Trust risk
          detail: A retained independent review reports approximately 900,000 records stolen in a March 2026 vishing incident.
          tone: risk
        - id: diligence-gaps
          label: Underwriting gaps
          detail: >-
            Current audited financials, retention, cash, debt, and the full preference waterfall are unavailable
            publicly.
          tone: warning
        - id: recommendation
          label: Research more
          detail: Defer a price-specific call until operating performance and common-equity economics are verified.
          tone: neutral
      edges:
        - from: historical-scale
          to: channel-signal
          label: updated by
        - from: channel-signal
          to: round-mark
          label: frames
        - from: round-mark
          to: pricing-caveat
          label: qualified by
        - from: pricing-caveat
          to: trust-risk
          label: combined with
        - from: trust-risk
          to: diligence-gaps
          label: raises need for
        - from: diligence-gaps
          to: recommendation
          label: drives
    approximationNotes: This is a qualitative decision chain; it does not estimate conversion rates, probabilities, or valuation.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV012
      - CV016
