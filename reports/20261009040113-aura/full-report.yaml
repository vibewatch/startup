      - number: '3.2'
        title: Pricing Structures and Packaging Dynamics
        blocks:
          - type: paragraph
            body: >-
              Pricing transparency and multi-tier packaging represent a key competitive battlefield between Aura and
              legacy providers. Unlike Norton LifeLock, which employs aggressive first-year teaser discounts followed by
              substantial renewal rate hikes of 22% to 39%, Aura maintains a flat renewal structure where annual plans
              renew at posted base rates of $144 for Individual, $264 for Couple, and $384 for Family tiers.
              Nevertheless, Aura imposes a substantial billing cadence penalty: choosing monthly billing rather than
              annual prepay increases annualized costs to $180 for Individual, $348 for Couple, and $600 for Family—a
              56% premium on family plans. Against specialized data removal alternatives, Aura faces substantial cost
              disadvantages for single-job buyers. PrivacyOn offers continuous broker removal and dark web monitoring
              covering up to five family members starting at $99.96 annually ($8.33 per month), undercutting Aura's $384
              Family tier by approximately $284 per year. Consequently, Aura's pricing power rests entirely on customer
              utilization of bundled insurance, VPN, antivirus, and credit monitoring.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Trust Posture, Channel Distribution, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Moat durability in digital safety depends heavily on consumer trust, channel partnerships, and switching
              barriers. Because consumer identity monitoring fundamentally operates via post-incident detection rather
              than fraud prevention, brand credibility is paramount. Aura suffered a material trust setback in March
              2026 when threat actor ShinyHunters conducted a vishing attack against an acquired marketing list,
              compromising approximately 900,000 consumer records, including 35,000 records containing physical
              addresses and phone numbers. To insulate its growth model against direct consumer acquisition volatility
              and high churn, Aura has aggressively expanded enterprise distribution. Enterprise employee benefits
              through MetLife and direct partnerships accounted for over 30% of Aura's ARR at year-end 2025. In April
              2026, Aura extended this strategy by launching an identity-centric BYOD solution for MSPs integrated with
              Microsoft Entra ID, establishing B2B switching costs and institutional distribution power that direct
              consumer identity rivals struggle to match.
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Unbundling Risk from Specialized Privacy Services
            body: >-
              Aura's core pricing defense—that a unified $144 to $384 suite is cheaper than buying disparate identity,
              antivirus, and VPN products—collapses when consumer intent is driven solely by data broker removal. With
              specialized services like PrivacyOn delivering multi-person broker removal for $99.96 annually, Aura risks
              high customer acquisition costs and churn among single-utility subscribers.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: Enterprise and MSP Channel Insulation
            body: >-
              Aura's expansion into enterprise employee benefits via MetLife and identity-centric BYOD security for MSPs
              provides structural margin and retention insulation. Enterprise partnerships represented over 30% of ARR
              at year-end 2025, enabling Aura to bypass pure-play consumer acquisition friction and counter incumbent
              scale.
            calloutType: insight
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Recurring Revenue With Multiple Distribution Economics
        blocks:
          - type: paragraph
            body: >-
              Aura earns primarily recurring subscription revenue through direct-to-consumer and partner channels, with
              the latter spanning employee benefits and other distribution relationships [CI001]. The public consumer
              entry price is $10 per month, but that is list pricing rather than evidence of realized price, discounts,
              or revenue per contract [CI002]. Revenue is recognized ratably over non-cancellable terms that typically
              range from one month to three years; a significant portion of subscribers pay before service delivery,
              which supports cash collection but creates contract liabilities [CI003]. In the first half of 2026,
              direct-to-consumer revenue was $79.3 million and partner revenue was $40.7 million, or approximately 66%
              and 34% of the $119.9 million total, respectively [CI005]. This mix provides more than one acquisition
              route, yet the public record does not isolate partner commissions, school economics, MSP pricing, or
              realized discounting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI009
              - CI012
      - number: '4.2'
        title: Growth Is Visible; Full Unit Economics Are Not
        blocks:
          - type: paragraph
            body: >-
              Standalone Aura revenue reached $119.9 million for the six months ended June 30, 2026, 31% above the
              comparable 2025 period [CI004]. The combined Aura-Qoria presentation used a different lens: pro forma ARR
              of $339.7 million at quarter-end, also up 27% year over year, so it should not be substituted for GAAP
              revenue [CI006]. Direct-to-consumer monthly ARPU was $16.61, direct-to-consumer net revenue retention was
              92%, and employee-benefits net revenue retention was 110% [CI007]. Based on reported revenue and cost of
              revenue, first-half gross margin was approximately 73.9%, versus approximately 71.3% a year earlier
              [CI008]. These are useful quality signals, but CAC, payback, cohort contribution margin, logo
              concentration, cancellation rates, and partner-level renewal economics remain unavailable.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
      - number: '4.3'
        title: Service Costs Are Scalable, but Marketing Still Dominates
        blocks:
          - type: paragraph
            body: >-
              Direct service costs include credit monitoring, identity-fraud insurance, payment processing, software and
              servers, VPN hosting, call-center operations, and customer support [CI009]. Sales and marketing expense
              was $86.4 million in the first half of 2026, approximately 72% of revenue, making acquisition efficiency
              the central margin variable [CI010]. On a combined pro forma basis, management reported a $12.6 million
              second-quarter adjusted EBITDA loss, a 51% year-over-year improvement, alongside $27 million of annualized
              cost actions against a $55 million program [CI011]. Adjusted EBITDA excludes acquisition costs, stock
              compensation, mark-to-market changes, and other items, so the improvement does not establish cash
              breakeven. The underwriting case requires the cost program to convert into durable cash savings without
              impairing retention or growth.
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Liquidity Improved at Close, but Financing Dependency Persists
        blocks:
          - type: paragraph
            body: >-
              Aura used $44.4 million of cash in operating activities in the first half of 2026, compared with $50.8
              million a year earlier [CI012]. At June 30, it held $17.0 million of unrestricted cash and $70.8 million
              of restricted cash, principally including transaction funds not then available for general use [CI013]. At
              the July transaction close, management reported $124.0 million of total liquidity after costs; that
              measure included cash and available revolver capacity and followed a $100 million equity raise and an
              upsized $100 million debt facility [CI014]. The balance sheet also carried $48.9 million under a
              customer-investment financing arrangement and a $25.0 million convertible note at December 31, 2025
              [CI015]. Separately, a reported March 2026 breach affected approximately 900,000 records, but public
              evidence does not quantify resulting churn, remediation cost, or partner impact [CI016]. The financial
              verdict is therefore growth-positive but not yet fully underwritable: revenue quality is increasingly
              visible, while capital needs and downside sensitivity require private data.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
