chapter:
  number: 7
  title: "Risks"
  summary: "Aura's clearest evidenced risk is trust exposure after a third-party report that a March 2026 vishing attack reached approximately 900,000 marketing records. Public evidence also identifies concentrated partner distribution and historical governance matters, while current legal status, remediation quality, insurance economics, liquidity, and post-incident churn remain material diligence gaps."
sections:
  - id: "executive-risk-assessment"
    title: "Executive Risk Profile and Residual Exposures"
    body: "The strongest evidenced risk is a mismatch between Aura's trust proposition and its own security execution. Aura says it never sells customer data and advertises up to $1 million of identity-theft coverage for each adult member, yet a third-party account says a March 2026 vishing attack reached about 900,000 marketing records (CR001, CR002, CR003). Aura said financial information, Social Security numbers, and passwords were not taken, but roughly 35,000 records reportedly included home addresses and phone numbers (CR012, CR013). The assigned evidence does not include Aura's incident notice, forensic report, remediation testing, insurance terms, or post-incident retention. Residual impact is therefore high but not quantifiable: another material incident, or failure to evidence completed remediation, should be treated as a thesis-break trigger rather than assumed away."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-legal-exposures"
    title: "Regulatory Oversight, Historical Consent Decrees, and Governance"
    body: "The pool identifies two historical matters that warrant governance diligence but does not establish a current enforcement action against Aura. A third-party summary reports that CEO Hari Ravichandran personally paid $1.38 million to resolve SEC allegations concerning subscriber metrics at a prior company, with no admission of wrongdoing (CR007). The same source says Intersections, acquired by Aura in 2019 and later associated with the Identity Guard line, had previously entered a CFPB consent order involving an approximately $1.2 million penalty plus restitution (CR008, CR009). These are history and control-design questions, not proof of present non-compliance. The 2026 breach creates a separate privacy-notification and remediation diligence path, but the assigned sources do not show the jurisdictions notified, claims filed, or regulator disposition. Four assigned results concern unrelated Aura-named entities and must not be used as target-company allegations (CR011)."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR001"
  - id: "operational-security-and-dependencies"
    title: "Operational Security Incidents, Partner Reliance, and Execution Risks"
    body: "The reported breach pathway ran through a marketing list and tooling retained after the 2021 Circle acquisition, making acquired-data inventory and access control a concrete integration risk rather than a hypothetical one (CR003, CR010). Distribution is also concentrated: Aura describes MetLife as the exclusive channel for its employee-benefits offering and says that offering plus direct partnerships represented more than 30% of 2025 revenue, although the release's footnote describes the basis as December 2025 end-of-period ARR (CR004, CR014). That revenue-versus-ARR inconsistency prevents a precise concentration calculation. Aura Business adds Microsoft Entra ID and MSP dependencies; Aura cites Omdia research that 55% of MSPs had experienced a BYOD incident in the preceding 24 months and says its product does not inspect personal content or activity (CR005, CR015, CR016). Current burn, runway, margins, partner renewal terms, and channel-level retention are unavailable; the only financing mark retained here is the company's 2021 Series F announcement (CR006)."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
