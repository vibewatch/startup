callouts:
  - calloutType: "insight"
    title: "The TAM Illusion: Loss Headwinds vs. Wallet Share"
    body: "Marketing figures frequently conflate the $21 billion lost to cybercrime with the addressable software market. Consumer digital safety spend is highly discretionary, forcing vendors like Aura to bundle VPN, antivirus, and credit monitoring to defend a $10 to $30 monthly willingness to pay against free bank alerts."
    claimRefs:
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Distribution Dependency and Enterprise BYOD Friction"
    body: "While enterprise employee benefits through MetLife and direct partnerships represent over 30% of revenue, expanding into SMBs via MSPs faces friction. MSPs historically resisted BYOD management due to privacy liability, requiring Aura's agentless Entra ID conditional access architecture to prove adoption."
    claimRefs:
      - "CM004"
      - "CM008"
      - "CM012"
