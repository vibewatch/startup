callouts:
  - calloutType: "risk"
    title: "M&A Integration Debt Creates Credibility Overhang"
    body: "For a digital safety vendor whose core brand proposition is identity safeguarding, the March 2026 data breach—in which 900,000 customer records were exfiltrated from an acquired marketing platform via employee vishing—demonstrates substantial integration vulnerability. Enterprise buyers and MSP partners require rigorous proof that subsidiary environments have been isolated from core infrastructure."
    claimRefs:
      - "CE014"
      - "CE015"
      - "CE016"
  - calloutType: "insight"
    title: "Identity-Centric BYOD Bridges Consumer and Enterprise Revenue"
    body: "By leveraging its consumer endpoint client to provide device posture checks via Microsoft Entra ID conditional access, Aura unlocks a differentiated enterprise GTM for MSPs. This approach avoids heavy MDM agent rollouts on employee personal devices while securing corporate applications against compromised mobile endpoints."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
