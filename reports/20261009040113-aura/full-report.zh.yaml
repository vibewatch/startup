      - number: '4.3'
        title: 服务成本可扩张，但营销仍占主导
        blocks:
          - type: paragraph
            body: >-
              直接服务成本包括信用监控、身份欺诈保险、支付处理、软件与服务器、VPN 托管、呼叫中心运营和客户支持 [CI009]。2026 年上半年销售与营销费用为 $86.4 million，约占收入
              72%，因此获客效率是利润率的核心变量 [CI010]。合并备考口径下，管理层披露第二季度调整后 EBITDA 亏损 $12.6 million，同比改善 51%，并在 $55 million 计划中执行了
              $27 million 年化降本 [CI011]。调整后 EBITDA
              不含收购成本、股权薪酬和按市值计价变动等项目，因此改善不代表现金盈亏平衡。投资判断取决于降本计划能否转化为持久现金节省，同时不损害留存和增长。
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 交割时流动性改善，但融资依赖仍在
        blocks:
          - type: paragraph
            body: >-
              2026 年上半年，Aura 经营活动使用现金 $44.4 million，上年同期为 $50.8 million [CI012]。截至 6 月 30 日，公司持有 $17.0 million 非受限现金和
              $70.8 million 受限现金，后者主要是当时不能自由使用的交易资金 [CI013]。7 月交易交割时，管理层披露扣除成本后总流动性为 $124.0 million，其中包括现金和可用循环额度；此前公司新增
              $100 million 股权融资并扩大 $100 million 债务额度 [CI014]。截至 2025 年 12 月 31 日，资产负债表还包括客户投资融资安排下的 $48.9 million 和
              $25.0 million 可转债 [CI015]。另据披露，2026 年 3 月泄露影响约 900,000 条记录，但公开证据没有量化流失、补救成本或合作伙伴影响
              [CI016]。因此，财务结论是增长积极但尚未完全可据以投资判断：收入质量逐渐清晰，但资本需求和下行情景敏感度仍需私有数据。
