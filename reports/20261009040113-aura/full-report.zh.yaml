      - number: '2.2'
        title: 市场规模口径、增长驱动与估算差异
        blocks:
          - type: paragraph
            body: >-
              评估 Aura 的可服务市场，必须把网络犯罪损失总额与可兑现的订阅支出区分开。行业营销材料引用 FBI 报告的 2025 年年度网络犯罪损失 $21 billion，以及超过 $300 billion
              的全球网络安全支出预测；但 Aura 的可服务市场取决于家庭和企业席位预算。美国约 130 million 户家庭构成潜在消费者，若按 $10 per month 的基础入门价计算，可服务消费者市场为 $15.6
              billion。Aura 可获取的服务市场是愿意为捆绑保护付费的数字优先家庭和企业福利参保者，公司目前覆盖超过 1.6 million
              名成员。增长驱动包括网络犯罪频率上升、监管机构对儿童在线隐私的关注，以及雇主采用自愿身份福利。增长约束则包括私营公司严重的财务不透明、消费者价格敏感、独立 VPN 和反病毒功能商品化，以及安全事件后的信任阴影。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
