      - number: '1.2'
        title: 高管领导、治理结构与监管历史
        blocks:
          - type: paragraph
            body: >-
              Aura 由创始人兼 CEO Hari Ravichandran 领导。此前，他创办并担任网页托管集团 Endurance International Group 的 CEO。Ravichandran 对
              Aura 的公司愿景、产品路线图、资本结构和国际收购战略拥有核心决策权。日常财务运营和交易执行由 CFO Brian DeCenzo
              负责，他管理资本配置、并购后整合，以及遵守澳大利亚证券交易所监管下的公开披露要求。2026 年年中，Aura 招募 Steven Young 担任全球首席营销官、Adam Medros
              担任首席产品官，补强高管团队，以扩大消费者订阅获客、改善数字营销单位经济性，并加快将具备上下文感知能力的人工智能部署到儿童福祉和家长安全应用中。鉴于历史监管执法行动和近期网络安全事件，治理尽调需要持续严密关注。2018
              年，Ravichandran 就美国证券交易委员会针对 Endurance 订阅指标涉嫌夸大的执法投诉达成和解，同意个人支付 $1.38 million，但不承认有不当行为。此外，Aura 在 2019 年收购的
              Intersections Inc. 曾于 2015 年接受消费者金融保护局同意令，因不公平收取附加信用产品费用，同意支付 $1.2 million 罚款并向消费者赔偿。最近，2026 年 3 月，威胁组织
              ShinyHunters 对一名员工发动语音钓鱼攻击，入侵了从 2021 年收购 Circle Media Labs 时继承的外部营销数据库，影响约 900,000 条消费者记录。Aura
              确认密码、银行凭证和社会安全号码均未被窃取，但此次泄露暴露出关键人物和继承资产的安全漏洞。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
