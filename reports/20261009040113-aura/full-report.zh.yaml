        title: 客户细分与多渠道市场进入结构
        blocks:
          - type: paragraph
            body: >
              Aura 覆盖消费者家庭、企业员工福利计划和中小企业 IT 环境等不同买方与付费方。消费者直销渠道中，家庭负责人以每月 $10 起订阅身份盗窃监控、设备反病毒、VPN 和家庭安全控制。企业雇主福利通过
              MetLife 独家分销，企业 HR 买方将数字安全方案作为自愿员工福利。Aura 还面向 MSP 拓展企业安全，提供可接入 Microsoft Entra ID、无需侵入式移动设备管理的身份型 BYOD 控制。


              截至 2025 年 12 月，企业员工福利和直销商业合作贡献了 Aura 披露 ARR 的超过 30%。双轨市场进入模式降低了对数字广告直销获客的依赖，但也显著依赖 MetLife 的机构销售周期和经纪网络。
