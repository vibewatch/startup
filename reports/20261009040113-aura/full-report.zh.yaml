      - number: '5.3'
        title: 数据保护、遗留整合暴露与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Aura 为每个成人订阅提供最高 $1 million 的身份盗窃保险，用于覆盖符合条件的补救损失、法律费用和被盗资金，并配备 24/7
              美国欺诈处理专家。尽管公司宣传银行级加密并承诺绝不向第三方出售消费者数据，多次收购仍带来重大安全风险。Aura 先后吸收 Intersections Inc.（现为 Identity Guard）和 Circle
              Media Labs 等遗留业务，形成碎片化的次级系统。2026 年 3 月，网络犯罪组织 ShinyHunters 针对员工凭证发动语音钓鱼攻击，入侵从 2021 年 Circle
              收购继承的外部营销数据库，影响约 900,000 条消费者记录，其中约 35,000 条含住址和电话号码。Aura
              确认社会安全号码、密码和银行凭证等核心身份向量未泄露，但事件暴露出收购后数据清理和访问治理的严重缺口。技术尽调必须核查被收购资产是否经过充分审计，并已整合进 Aura 的核心安全边界。
