            body: 超过 30% 的 ARR 来自企业合作和 MetLife 独家分销，因此 Aura 的企业增长高度依赖第三方经纪商表现和保险方条款。MetLife 的承保重点或福利货架位置一旦变化，商业势头可能受到重大冲击。
