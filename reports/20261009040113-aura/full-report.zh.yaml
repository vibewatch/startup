  - id: FU001
    title: Aura 客户采用与多渠道扩张旅程
    type: journey-map
    summary: 展示 D2C 和企业渠道中的客户 onboarding、触点、产品采用界面和扩张循环。
    data:
      items:
        - label: 发现与认知
          stage: 发现与认知
          touchpoints:
            - D2C 在线数字营销
            - MetLife 开放投保门户
            - MSP IT 咨询
        - label: 上手与注册
          stage: 上手与注册
          touchpoints:
            - 征信机构身份验证
            - 跨移动端和 PC 安装应用
            - Entra ID 租户配置
        - label: 主动防护
          stage: 主动防护
          touchpoints:
            - 实时暗网和欺诈提醒
            - 家长控制和数字健康检查
            - 自动设备杀毒扫描
        - label: 事件处理
          stage: 事件处理
          touchpoints:
            - 24/7 美国欺诈专家升级处理
            - 信用档案锁定和征信机构提醒
            - $1M 身份盗窃保险理赔处理
        - label: 扩张与留存
          stage: 扩张与留存
          touchpoints:
            - 从个人套餐升级为家庭套餐
            - 在 MSP 客户中增加 BYOD 席位
            - 年度续约和保险理赔处理
        - label: 倡导与续约
          stage: 倡导与续约
          touchpoints:
            - 家庭口碑推荐
            - 企业年度福利重新注册
            - MSP 多租户合同续约
