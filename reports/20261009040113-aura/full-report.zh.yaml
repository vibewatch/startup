        - 企业执行力和信任恢复未能转化为持久的经济性
        - 无法从留存的公开证据量化
      - - 基准
        - 消费者经济性稳定；合作伙伴贡献持续；没有新的重大安全事件
        - 仅将 2025 年轮次估值作为参考，并按当前表现和优先权条款调整
