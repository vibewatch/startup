      - number: '4.2'
        title: 增长清晰可见，但完整单位经济性仍不透明
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月 30 日的 six months，Aura 独立收入为 $119.9 million，比 2025 年同期高 31% [CI004]。Aura-Qoria 合并口径不同：季度末备考
              ARR 为 $339.7 million，同比也增长 27%，不能替代 GAAP 收入 [CI006]。消费者直销月度 ARPU 为 $16.61，直销净收入留存率为 92%，员工福利净收入留存率为 110%
              [CI007]。按披露的收入和收入成本计算，上半年毛利率约为 73.9%，上年同期约为 71.3% [CI008]。这些是有用的质量信号，但
              CAC、回本周期、队列贡献毛利、客户集中度、取消率和合作伙伴续费经济性仍未披露。
