chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、创立历史与上市
        blocks:
          - type: paragraph
            body: >-
              Aura Consolidated Group, Inc. 是一家全球数字安全与福祉科技公司，为个人、家庭、教育机构和商业企业提供主动式在线保护。公司由创始人兼 CEO Hari Ravichandran 于
              2017 年以 iSubscribed 名义创立，最初专注个人身份盗窃保护和信用监控。2019 年，公司收购运营 Identity Guard 产品家族的 Intersections
              Inc.，业务规模大幅扩张，随后整合运营并更名为 Aura。如今，Aura 总部位于马萨诸塞州大波士顿都会区，提供一体化订阅软件平台，将三大征信机构信用监控与 Experian Credit
              Lock、可疑交易预警、暗网身份扫描、反病毒防护、虚拟专用网络和家长控制工具结合起来。2026 年 7 月 17 日完成的一项重大公司交易中，Aura 收购了澳大利亚学生安全与数字福祉服务商 Qoria
              Limited。该安排方案实施后，Aura 于 2026 年 7 月 20 日以股票代码 AXQ 在澳大利亚证券交易所开始不受限制的公开交易，从一家由风险资本支持的私营独角兽转型为横跨两个半球的上市企业。
            claimRefs:
              - CO001
              - CO002
              - CO010
