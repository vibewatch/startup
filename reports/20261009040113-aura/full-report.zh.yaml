            title: 治理与品牌信任阴影
            body: >-
              创始人 Hari Ravichandran 过往涉及 Endurance 运营指标的监管行动（SEC $1.38 million 和解）、被收购子公司 Intersections 的监管行动（CFPB $1.2
              million 同意令），再加上 2026 年 3 月 ShinyHunters 语音钓鱼事件暴露 900,000 条消费者记录，持续构成声誉和品牌信任障碍，需要严格的治理监督。
