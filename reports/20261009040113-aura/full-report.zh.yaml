      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 公开市场与并购双重转型
            body: >-
              Aura 于 2026 年 7 月收购学生安全龙头 Qoria Limited，使公司从美国私营消费者数字安全服务商转型为在 ASX（AXQ）上市、业务横跨两个半球的公众公司。合并集团在 2026
              年第二季度末拥有 $339.7 million 备考 ARR、$124.0 million 总流动性，并拓展企业 BYOD 业务，同时以正自由现金流为目标。
