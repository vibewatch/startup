  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 消费者产品架构与工作流整合
        blocks:
          - type: paragraph
            body: >-
              Aura 面向客户提供一体化数字安全生态，替代反病毒引擎、独立密码库和信用评分面板等割裂工具。日常使用中，平台在 Windows、macOS、iOS、Android
              和浏览器扩展中后台运行，持续监控威胁面，不要求用户主动操作。用户注册时会绑定社会安全号码、邮箱、信用卡与借记卡账户及退休账户等身份信息；Aura
              将这些身份向量与第三方泄露库和数十亿个数据点比对，发现暴露记录就向订阅者预警。金融和信用场景覆盖 Experian、Equifax、TransUnion 三大征信机构，并通过 Experian Credit
              Lock 提供即时锁定。交易追踪根据用户行为模型和地理位置识别异常提款与支出激增。数字福祉和家庭安全功能还包括家长管理儿童屏幕时间和 YouTube、Roblox 等平台的应用访问；Safe Gaming
              模块则监控 200 多款 PC 游戏的文字与语音通信，识别网络欺凌和在线捕食者风险。
