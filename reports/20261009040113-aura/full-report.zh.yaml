  - id: FI001
    title: 收入到现金的经济性
    type: flow
    summary: Aura 将直销和合作伙伴订阅活动转化为按比例确认的收入，再吸收服务交付和获客成本，最终形成经营现金流。
    data:
      nodes:
        - id: customer-entry
          label: 直接获客与合作伙伴获客
          detail: 消费者、雇主、学校和其他合作伙伴通过获客成本不同的渠道进入。
        - id: subscription-billing
          label: 订阅计费
          detail: 月度、1 年期和 2 年期套餐；许多订阅者在履约前付款。
        - id: revenue-recognition
          label: 按比例确认收入
          detail: 收入在通常为 1 个月至 3 年的不可取消期限内确认。
        - id: service-delivery
          label: 直接服务成本
          detail: 监控、保险、处理、基础设施、呼叫中心和支持成本会压低毛利。
        - id: growth-spend
          label: 销售、营销和产品支出
          detail: 仅销售和营销支出就约等于 2026 年上半年收入的 72%。
        - id: cash-conversion
          label: 经营现金流
          detail: 尽管收入增长，2026 年上半年经营现金仍流出 $44.4 million。
    approximationNotes: 该图展示机制，而非按比例绘制的瀑布图；不推断未披露的 CAC、回本期或渠道利润率。
