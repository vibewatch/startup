      - number: '6.3'
        title: 留存持久性、泄露阴影与采购尽调
        blocks:
          - type: paragraph
            body: >
              鉴于个人身份数据的高敏感性，客户留存和持久性是 Aura 的关键尽调事项。2026 年 3 月，威胁行为者通过语音钓鱼攻击 Aura 营销系统，入侵遗留 Circle Media Labs 营销工具中的约
              900,000 条记录，除姓名和邮箱外，还暴露 35,000 条详细客户记录。虽然社会安全号码、银行凭证和密码没有泄露，但事件造成品牌阴影，也让评估平台信任度的企业福利经纪商和 MSP 采购团队更加谨慎。


              此外，私营公司不透明性遮蔽了净收入留存率（NRR）、总留存率（GRR）和队列流失指标。Aura 的定价基线约为 $150M ARR，分拆后增长目标超过 40%
              year-over-year，但第三方分析显示运营亏损严重且 EBITDA 利润率为负。没有经审计的队列披露，投资者将面临 MetLife
              分销集中、消费者首购折扣引发潜在流失，以及安全披露后企业供应商尽调周期拉长等风险。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
