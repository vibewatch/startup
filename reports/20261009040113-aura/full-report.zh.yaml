      - number: '1.3'
        title: 资本结构、多渠道分销与财务规模
        blocks:
          - type: paragraph
            body: >-
              在 2026 年转入公开市场前，Aura 通过机构风险投资轮次累计募集超过 $670 million 股权资本。其资本历史以 2021 年 10 月完成的 $200 million Series F
              为核心，当时投后估值为 $2.5 billion，由 Madrone Capital Partners 领投，Ten Eleven Ventures、General Catalyst、Warburg Pincus
              和 Accel 参与。2025 年 3 月，Aura 完成 $140 million Series G 股权融资，投后估值降至 $1.6 billion，由 Ten Eleven Ventures 和
              Madrone Capital Partners 共同领投，另有传统债务融资。2026 年 7 月完成 Qoria 收购时，公司同时新增 $100 million 股权融资并扩大 $100 million
              债务额度；截至 2026 年 7 月 17 日，合并业务拥有 $124.0 million 交易总流动性。合并集团有三条分销路径：起价 $10 per month 的消费者直销数字安全订阅；由 MetLife
              独家分销的雇主赞助自愿员工福利；以及 2026 年 4 月推出、面向托管服务商身份型 BYOD 安全需求的企业 Aura Business 方案。按美国 GAAP 将 Aura 与 Qoria
              合并计算，合并企业在 2026 年第二季度末 ARR 为 $339.7 million，季度 GAAP 收入为 $85.1 million，均同比增长 27%。备考调整后 EBITDA 亏损同比改善 51% 至
              $12.6 million；管理层已执行 $27 million 年化运营降本计划，并以实现正自由现金流为目标。
