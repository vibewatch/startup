  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Aura
              将产品定位在新兴的消费者数字安全与福祉品类，处于消费者身份盗窃保护、信用监控、数字隐私工具和设备安全的交汇处。过去，这一市场由征信机构信用追踪、专用反病毒软件、虚拟专用网络工具和基础家长控制应用等单点方案割裂构成。Aura
              将这些能力整合进覆盖个人、伴侣和家庭层级的多设备订阅。2026 年，公司通过 Aura Business
              和托管服务商渠道，把业务边界从零售家庭扩展到企业环境，重点是身份型自带设备安全，而非传统硬件移动设备管理。主要的非消费替代方案仍是消费者维持现状的惰性、零售银行门户提供的免费信用追踪工具，以及雇主赞助的网络安全意识培训。划定市场边界时还必须排除同名但完全无关的实体，例如生物科技公司
              Aura Biosciences（NASDAQ: AURA）。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
