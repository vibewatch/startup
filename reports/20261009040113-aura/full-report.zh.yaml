      - number: '2.3'
        title: 买方细分、采购经济性与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Aura 的市场进入覆盖三类买方，购买动机和经济性各不相同。零售消费者购买按月或按年自助订阅，需求通常来自突发欺诈、主动信用管理或家庭家长控制。企业买方通过自愿员工福利计划采购 Aura，主要由 MetLife
              等保险合作伙伴分销；这些合作伙伴与其他渠道在 2025 年合计贡献了 Aura 超过 30% 的 ARR。SMB 和中型市场客户则由托管服务商通过 Microsoft Entra
              ID，为访问云应用的非托管员工手机部署 Aura Business。保险合作的具体毛利率结构、促销 onboarding 后的队列留存率，以及企业 BYOD 是否蚕食消费者直销订阅，仍存在关键尽调缺口。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: TAM 幻觉：损失规模逆风与钱包份额
            body: >-
              营销材料经常把网络犯罪造成的 $21 billion 损失与可服务软件市场混为一谈。消费者数字安全支出高度可选，Aura 这样的厂商只能捆绑 VPN、反病毒和信用监控，才能在免费银行预警面前守住 $10 to
              $30 monthly 的付费意愿。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
          - type: callout
            title: 分销依赖与企业 BYOD 摩擦
            body: >-
              MetLife 企业员工福利和直销合作伙伴贡献了超过 30% 的收入，但通过 MSP 拓展 SMB 面临阻力。由于隐私责任风险，MSP 过去一直抗拒 BYOD 管理，因此 Aura 必须靠无代理 Entra ID
              条件访问架构证明市场接受度。
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与核心替代方案
        blocks:
          - type: paragraph
            body: >-
              Aura 的竞争对手分为三层：传统网络安全和身份盗窃集团；专注数据经纪商移除或信用监控的专业单点方案；以及零成本的现状机制。Norton LifeLock
              是消费者身份安全领域的主要传统直接竞争者，覆盖身份预警、征信机构追踪和反病毒捆绑。PrivacyOn、DeleteMe 和 Incogni 等服务则专门移除数据经纪商和人员搜索网站，挑战 Aura
              的高价一体化包装。Equifax、Experian 和 TransUnion 的免费法定信用冻结，提供监控套件无法复制的预防性保护。面对价格阻力和增长上限，Aura 通过 MSP 分销的身份型 BYOD 产品及
              MetLife 独家员工福利渠道进入企业安全市场。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
