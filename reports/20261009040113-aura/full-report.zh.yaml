  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 多种分销经济性下的经常性收入
        blocks:
          - type: paragraph
            body: >-
              Aura 主要通过消费者直销和合作伙伴渠道赚取经常性订阅收入，后者包括员工福利及其他分销关系 [CI001]。公开消费者起价为每月 $10，但这是标价，不能证明实际价格、折扣或单份合同收入
              [CI002]。收入在通常为一个月至三年的不可取消期限内按比例确认；不少订阅者在服务交付前付款，有利于收款，却形成合同负债 [CI003]。2026 年上半年，消费者直销收入为 $79.3
              million，合作伙伴收入为 $40.7 million，分别约占 $119.9 million 总额的 66% 和 34%
              [CI005]。这种结构提供了不止一条获客路径，但公开资料没有拆分合作佣金、学校经济性、MSP 定价或实际折扣。
            claimRefs:
