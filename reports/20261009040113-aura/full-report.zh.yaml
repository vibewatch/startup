      - number: '3.2'
        title: 定价结构与产品包装
        blocks:
          - type: paragraph
            body: >-
              定价透明度和多层产品包装，是 Aura 与传统厂商竞争的关键战场。Norton LifeLock 先以首年优惠吸引客户，再将续费价提高 22% 至 39%；Aura 则采用平价续费结构，年付方案公开基础价为
              Individual $144、Couple $264、Family $384。按月付费会显著抬高成本，年化价格分别为 Individual $180、Couple $348、Family $600，家庭方案溢价
              56%。对只需单一功能的客户，Aura 比专业数据移除服务贵得多。PrivacyOn 每年 $99.96（$8.33 per month）起，为最多五名家庭成员提供持续经纪商移除和暗网监控，比 Aura $384
              的 Family 方案每年低约 $284。因此，Aura 的定价能力完全取决于客户是否使用捆绑的保险、VPN、反病毒和信用监控。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: 信任状况、渠道分销与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              数字安全的护城河能否持久，主要取决于消费者信任、渠道合作和切换壁垒。消费者身份监控依靠事后侦测而非事前防欺诈，因此品牌可信度至关重要。2026 年 3 月，威胁行为者 ShinyHunters
              对一份被收购的营销名单发动语音钓鱼攻击，影响约 900,000 条消费者记录，其中 35,000 条含住址和电话号码，Aura 的信任基础因此遭到重大打击。为降低消费者直销获客波动和高流失，Aura
              大力拓展企业分销。2025 年底，MetLife 企业员工福利和直销合作贡献了 Aura 超过 30% 的 ARR。2026 年 4 月，公司又推出与 Microsoft Entra ID 集成的身份型 BYOD
              方案，面向 MSP 建立 B2B 切换成本和机构分销能力，这是纯消费者身份安全竞争者难以复制的。
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP014
              - CP015
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 专业隐私服务带来的拆包风险
            body: >-
              Aura 的核心定价防线是：$144 至 $384 的统一套件比单独购买身份、反病毒和 VPN 产品便宜。但当消费者只想移除数据经纪商信息时，这一防线就会失效。PrivacyOn 等专业服务每年 $99.96
              即可为多人移除经纪商信息，Aura 的单功能订阅者因此可能面临高获客成本和流失。
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: 企业与 MSP 渠道隔离
            body: >-
              Aura 通过 MetLife 拓展企业员工福利，并为 MSP 提供身份型 BYOD 安全，从结构上缓冲利润和留存压力。2025 年底，企业合作贡献超过 30% 的 ARR，使 Aura
              能绕开纯消费者获客阻力，并对抗传统厂商规模优势。
