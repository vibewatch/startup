              - CR011
      - number: '7.3'
        title: 运营安全事件、合作伙伴依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              已披露的泄露路径经过 2021 年收购 Circle 后保留的营销名单和工具，因此收购数据清单与访问控制是具体的整合风险，而非假设风险（CR003、CR010）。分销也高度集中：Aura 称 MetLife
              是员工福利产品的独家渠道，并称该产品加直销合作贡献了 2025 年收入的超过 30%；但新闻稿脚注将口径写成 2025 年 12 月期末 ARR（CR004、CR014）。收入与 ARR
              的不一致使集中度无法精确计算。Aura Business 还依赖 Microsoft Entra ID 和 MSP；Aura 引用 Omdia 研究称，55% 的 MSP 在此前 24 months 内经历过
              BYOD 事件，并表示产品不会检查个人内容或活动（CR005、CR015、CR016）。当前烧钱速度、现金跑道、利润率、合作伙伴续约条款和渠道留存均不可得；这里保留的唯一融资标记是公司 2021 年 Series
              F 公告（CR006）。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR014
              - CR016
      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 2026 年营销数据泄露后的品牌信任阴影
            body: 第三方报道指称，2026 年 3 月语音钓鱼事件触及 Circle 收购后保留的工具中的约 900,000 条营销记录。Aura 称财务信息、社会安全号码和密码未被窃取，但独立补救证据和事件后的留存数据均缺失。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR013
          - type: callout
            title: 企业 BYOD 增加新的依赖栈
            body: >-
              Aura Business 将分销拓展到消费者直销之外，但公开发布证据也带来对 Microsoft Entra ID 和 MSP
              执行的依赖。在把该渠道视为已验证的多元化之前，还需要部署量、激活、续约、服务水平、支持负担和隐私审计结果。
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度低、风险高，估值立场是公开证据不足。Aura 有真实的订阅产品、披露过的历史收入基础和较新的合作伙伴分销模式，但这些事实不足以确定当前企业价值或可投资回报画像 [CV007, CV008,
              CV012, CV016]。Forge 报告 2025 年 3 月 Series G 投后估值为 $1.6 billion，但也提醒其私营公司数据可能依赖有限输入，未必代表可执行的市场价格 [CV001,
              CV003]。因此，入场纪律应从原始融资文件、经审计经营数据和不同证券类别的清算瀑布开始，而不能把轮次估值当作当前普通股价格。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV012
              - CV016
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Forge 报告 Aura 的 Series G 于 2025 年 3 月 24 日以每股 $10.28 募集 $89.65 million，投后估值 $1.6 billion [CV001,
              CV002]。Aura 2021 年 10 月公告的 $200 million Series F 投后估值为 $2.5 billion [CV005]。两个投后估值相差
              36%，但这是不同日期和证券条款下的融资轮估值比较，并不证明普通股价值同幅下降 [CV006]。EquityZen 公开页面确认其处于 IPO
              前市场背景，但当前估值、股权表、融资历史和优先权细节受认证与访问控制限制 [CV004]。因此，公开证据支持融资背景，而非精确的当前价格。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: 投资逻辑、反向逻辑与下行风险
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是：Aura 能把广泛的消费者保护套件与合作伙伴和企业分销结合起来。官网宣传套餐起价 $10 per month；Aura 2026 年 4 月公告称，员工福利和直销合作贡献了 2025 年收入的超过
              30%，但公告另称其口径是 2025 年 12 月期末 ARR，因此分母需要尽调，不能自行改写 [CV007、CV008]。同一公告还描述了面向 MSP 的 BYOD 产品，增加潜在企业路径
              [CV009]。反向逻辑是信任和执行风险：保留的独立审查称，2026 年 3 月语音钓鱼事件窃取了约 900,000 条记录 [CV010]。历史规模和公司风投项目提供背景，但都不能解决当前单位经济性
              [CV012、CV013]。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据支持有条件的情景，不支持数字概率权重或可辩护的估值区间。乐观情景需要经审计增长、留存、利润率、多元化合作伙伴贡献，以及证明 2026
              年安全事件没有损害续约。基准情景需要稳定的订阅经济性，以及在不高于最新轮次估值的情况下仍为普通股留下足够价值的融资结构。若流失、合作伙伴集中、补救成本或新增资本需求削弱股权地位，则进入悲观情景
              [CV008、CV010、CV015]。EquityZen 将 IPO、并购和符合条件的老股交易列为可能的私募市场退出，但保留页面没有显示 Aura 特定时间表或可执行流动性
              [CV011]。在对目标回报或持有期进行投资判断前，最终尽调必须取得经审计财务、队列留存、渠道集中度、债务、现金和完整优先权瀑布 [CV015、CV016]。
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 暂不提供具体价格建议
            body: >-
              $1.6 billion Series G 投后估值是有日期的融资参考，不是经核实的当前普通股价值。要确定可辩护的入场价，需要已签署的轮次文件、完全稀释资本结构、债务和现金余额、经审计的当前收入与 ARR
              对账、留存队列、利润率，以及与事件相关的流失或合作伙伴续约证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
              - CV016
