  - id: FR001
    title: 风险严重程度与剩余风险敞口热力图
    type: matrix
    summary: 评估核心运营、监管和渠道依赖项，并按可能性与剩余影响映射。
    data:
      columns:
        - 证据 / 可能性状态
        - 剩余严重程度
        - 监测或论点失效触发条件
      rows:
        - label: 2026 年数据泄露与信任风险敞口
          values:
            - label: 已发生
              detail: 第三方账户报告称，约 900,000 条营销记录受到影响
              tone: risk
            - label: 高
              detail: Aura 的产品主张依赖数字安全信任
              tone: risk
            - label: 缺少取证修复，或再次发生重大事件
              detail: 在降低风险前，要求提供结案证据和事件后留存数据
              tone: risk
        - label: 已收购数据治理
          values:
            - label: 已发生的路径
              detail: 据报道，事件涉及 Circle 时代的营销工具
              tone: risk
            - label: 高
              detail: 没有数据血缘和留存系统控制方面的证据
              tone: risk
            - label: 清单不完整或缺少删除证明
              detail: 要求提供系统清单、数据地图、访问日志和删除证据
              tone: warning
        - label: 合作伙伴集中度
          values:
            - label: 已披露，分母含义不明
              detail: 公司称合作伙伴渠道占 2025 年收入超过 30%；脚注引用期末 ARR
              tone: warning
            - label: 高
              detail: 员工福利渠道被描述为由 MetLife 独家提供
              tone: risk
            - label: 续约不利或集中度上升
              detail: 要求提供合同、续约、同期群体和渠道集中度数据
              tone: risk
        - label: BYOD 与 Entra 执行
          values:
            - label: 未来风险
              detail: 已描述架构，但部署表现没有公开信息
              tone: warning
            - label: 重大
              detail: 集成、隐私、支持和服务水平表现仍未经验证
              tone: warning
            - label: 激活、续约或事件表现弱
              detail: 要求提供部署、支持、隐私审计和服务水平遥测
              tone: risk
        - label: 历史治理事项
          values:
            - label: 历史事项
              detail: 先前公司的 SEC 和收购前 CFPB 事项不是当前 Aura 的发现
              tone: neutral
            - label: 重大尽调事项
              detail: 没有留存当前董事会和合规控制信息
              tone: warning
            - label: 控制测试发现反复出现的弱点
              detail: 审查 KPI 定义、计费控制、投诉和审计监督
              tone: risk
        - label: 当前流动性
          values:
            - label: Unknown
              detail: 留存的融资证据来自 2021 年
              tone: neutral
            - label: 可能较高
              detail: 当前现金、债务、烧钱、现金跑道、利润率和契约不可得
              tone: warning
            - label: 现金跑道或契约余量低于投资门槛
              detail: 在审阅当前财务和融资文件后设定门槛
              tone: risk
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR007
      - CR011
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策路径将经营证据与融资估值、风险证据和未解决的投资判断输入分开。
    data:
      nodes:
        - id: historical-scale
          label: 历史规模
          detail: Aura 报告称，2021 年 10 月年收入超过 $220M；这是历史收入，不是当前 ARR。
          tone: positive
        - id: channel-signal
          label: 渠道信号
          detail: Aura 报告称，2025 年合作伙伴贡献超过 30%，发布内容注明以期末 ARR 为口径。
          tone: positive
        - id: round-mark
          label: 最近留存的轮次估值
          detail: Forge 报告称，Series G 投后估值为 $1.6B，日期为 2025 年 3 月。
          tone: neutral
        - id: pricing-caveat
          label: 定价警示
          detail: Forge 警告，其私营公司数据可能依赖有限输入，且未必代表市场价格。
          tone: warning
        - id: trust-risk
          label: 信任风险
          detail: 一份留存的独立审查报告称，2026 年 3 月语音钓鱼事件中约有 900,000 条记录被盗。
          tone: risk
        - id: diligence-gaps
          label: 投资判断缺口
          detail: 当前经审计财务、留存、现金、债务和完整优先权瀑布均未公开。
          tone: warning
        - id: recommendation
          label: 继续研究
          detail: 在运营表现和普通股权益经济性得到验证前，暂缓作出具体价格判断。
          tone: neutral
      edges:
        - from: historical-scale
          to: channel-signal
          label: 更新于
        - from: channel-signal
          to: round-mark
          label: 构成框架
        - from: round-mark
          to: pricing-caveat
          label: 受……限定
        - from: pricing-caveat
          to: trust-risk
          label: 与……结合
        - from: trust-risk
          to: diligence-gaps
          label: 增加对……的需求
        - from: diligence-gaps
          to: recommendation
          label: 推动
    approximationNotes: 这是定性决策链，不估算转化率、概率或估值。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV012
      - CV016
