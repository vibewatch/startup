    data:
      layers:
        - label: 企业与合作伙伴集成层
          detail: 多租户 MSP 管理、Microsoft Entra ID 条件访问同步，以及 MetLife 福利通道。
        - label: 统一用户体验层
          detail: 面向 iOS、Android、macOS 和 Windows 的跨平台应用，以及 Aura Intelligence 评分。
        - label: 核心应用引擎
          detail: 加密 Vault、密码管理器、家长规则引擎，以及 Kidas Safe Gaming 音频 / 文本解析。
        - label: 安全与传输层
          detail: 通过 100+ 个虚拟位置进行虚拟专用网络（VPN）路由，以及本地终端恶意软件防御。
        - label: 上游数据与征信机构网关
          detail: 直接接入三大征信机构（Experian、TransUnion、Equifax）的信用数据流、银行交易聚合器和泄露数据管道。
        - label: 历史与收购基础设施
          detail: 已收购子公司的数据库和营销工具（Circle Media、Intersections）扩大了攻击面。
    approximationNotes: 概念图根据官方产品规格、公司架构申报文件和安全泄露披露综合绘制。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE008
      - CE009
