callouts:
- calloutType: insight
  title: GOAT looks like a monetized marketplace, but not a pure asset-light classifieds business
  body: The policy stack shows GOAT monetizes commission, seller fees, cash-out fees, shipping, and premium service layers. But Instant items, prepaid labels, buyer protection, and international facilities mean a meaningful portion of value creation still depends on physical operations and service execution.
  claimRefs:
  - CI001
  - CI002
  - CI004
  - CI005
  - CI017
  - CI018
  - CI044
- calloutType: risk
  title: Service-level failures are a direct financial risk, not just a brand risk
  body: 'The FTC shipping case matters because it converts operational misses into cash penalties and exposes a sensitive part of GOAT''s model: buyers pay up for speed and trust. If shipping promises or dispute handling slip, the platform loses both brand equity and margin.'
  claimRefs:
  - CI007
  - CI019
  - CI046
- calloutType: recommendation
  title: Current liquidity remains un-underwritable from public evidence alone
  body: Public evidence is sufficient to estimate GMV and fee logic, and to compare GOAT against eBay and The RealReal. It is not sufficient to judge current cash, debt, burn, or runway. Any serious diligence process should request a current balance sheet, monthly cash burn, standard-versus-Instant gross margin split, and regional facility economics before taking a view on capital adequacy.
  claimRefs:
  - CI042
  - CI043
  - CI048
