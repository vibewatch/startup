- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'The financial read-through is mixed but usable. On the positive side, GOAT has a real fee stack, broad seller distribution via alias and Flight Club, and a market position that still appears top tier in sneaker resale. Public comps demonstrate that authenticated resale and marketplace economics can both be profitable at scale. On the negative side, GOAT''s own public file is still too thin where it matters most: recognized revenue, gross margin, order-mix economics, cash, debt, and burn. The FTC action and the overseas facility pullback are not thesis killers by themselves, but they do show that service execution and physical-network cost are both live issues. As a result, the chapter verdict is that GOAT likely has revenue quality that is better than pure social resale, but with a margin path and capital profile that remain impossible to underwrite confidently without private data. The right next step is not valuation work; it is a diligence package that converts policy visibility
    into audited economics.'
  claimRefs:
  - CI014
  - CI019
