- id: capital-adequacy
  title: Liquidity, capital adequacy, and financing dependency
  body: 'The open-source evidence is enough to reconstruct historical scale markers but not enough to confirm current liquidity. GOAT''s last widely disclosed primary capital event remains the 2021 Series F that valued the business at $3.7 billion. Third-party market data still puts GMV at roughly $2.0-2.5 billion, and the platform clearly continues to operate at global scale, but none of the retained sources disclose current cash, debt, or runway. That absence is material. It means investors cannot tell whether recent facility closures were proactive optimization or reactive cash preservation. It also means the company''s financing dependency cannot be separated cleanly from its operating model. Foot Locker is relevant mainly as a scale reminder: sneaker distribution, store refreshes, digital investment, and omnichannel service are expensive even for public incumbents. GOAT may be less capital-intensive than a first-party retailer, but the available public evidence does not prove it is
    comfortably self-funded.'
  claimRefs:
