company:
  name: GOAT Group
chapter:
  number: 4
  title: Financials
  summary: 'GOAT''s public financial picture is mostly reconstructive: fee policies are explicit, but revenue, gross margin, EBITDA, cash, and debt are not publicly disclosed. Using published GMV estimates and GOAT''s fee schedule suggests a marketplace revenue proxy around $190-310 million, while public comps show authenticated resale can be profitable at scale but remains operationally intensive; GOAT''s current capital adequacy therefore remains an unresolved diligence blocker rather than a confirmed strength.'
sections:
- id: monetization-model
  title: Monetization model and take-rate logic
  body: 'GOAT''s monetization is unusually visible for a private marketplace because its fee and policy stack lays out multiple fee layers in plain language. The core engine is seller commission, but it is not the only one. GOAT also charges seller fees that vary by route and geography, a 2.9% cash-out fee on ACH or PayPal payouts, buyer shipping charges, and premium speed layers such as Instant next-day delivery. That creates a broader monetization stack than a simple take-rate marketplace, even if the company does not disclose how much of the shipping and service line is recognized as revenue versus passed through to carriers. alias and Flight Club matter here because they broaden the revenue surface without requiring GOAT to acquire all supply directly: more seller activity can be routed into the same transaction-fee architecture across multiple buyer endpoints. The crucial caveat is concentration. The retained public evidence does not show advertising, subscription, or financing revenue,
    so GOAT still appears heavily dependent on transaction-linked economics.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
