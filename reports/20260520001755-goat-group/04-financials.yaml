- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public status
  - Implication
  - Proxy / comparator
  - Diligence ask
  rows:
  - - Cash on hand
    - Unknown in retained public GOAT sources
    - Cannot confirm liquidity buffer or self-funding capacity
    - The RealReal ended 2025 with $166M cash; GOAT has no equivalent public disclosure
    - Provide latest unrestricted cash and restricted cash
  - - Monthly burn / runway
    - Unknown in retained public GOAT sources
    - Runway cannot be estimated responsibly
    - Public authenticated-resale comp reached positive EBITDA only after years of scale investment
    - Provide monthly burn, fixed cost base, and runway at current plan
  - - Debt / financing obligations
    - Unknown in retained public GOAT sources
    - Leverage and covenant risk are unobservable
    - No retained source showed warehouse, credit-facility, or project-finance obligations
    - Provide debt schedule, covenants, and any inventory financing lines
  - - Last disclosed equity funding
    - $195M Series F at $3.7B valuation in 2021
    - Historical capital base is known, but current liquidity is not
    - Helps anchor preference stack and dilution history only
    - Confirm any post-2021 primary or secondary financing
  - - International facility rationalization
    - Facilities reportedly closed in UK, Hong Kong, and Japan
    - May reduce burn, but could also compress service quality or growth
    - Complex reports closures; no public savings figure disclosed
    - Share annualized opex savings and any inventory write-downs
  - - Incumbent benchmark for scale funding
    - Foot Locker runs 2,410 stores globally and still prioritizes digital investment
    - Shows how expensive omnichannel sneaker distribution remains at scale
    - Foot Locker gross-margin improvement came with continuing customer-facing investment
    - Map GOAT's network opex against owned, partner, and variable cost buckets
  notes: This table intentionally leaves unknown values unknown. The core output is whether public evidence is sufficient to judge capital adequacy; for GOAT, it is not.
  claimRefs:
  - CI012
  - CI019
  - CI020
  - CI028
  - CI034
  - CI035
  - CI042
  - CI043
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Nearest public proxy
  - Impact on judgment
  - Diligence path
  rows:
  - - Audited revenue
    - Needed to distinguish GMV, net revenue, and pass-through fees
    - GMV estimate from PLOTT + fee policy proxy
    - 'High: revenue quality remains estimated'
    - Request audited P&L with revenue-recognition policy
  - - Gross margin by order type
    - Needed to judge whether Instant / standard mix improves or dilutes economics
    - The RealReal and eBay public margins provide only rough outer bounds
    - 'High: margin path cannot be underwritten confidently'
    - Request gross margin split for standard, Instant, and affiliate channels
  - - Cash, debt, and runway
    - Needed to assess next-round dependency and downside risk
    - No direct GOAT public proxy retained
    - 'High: capital adequacy unproven'
    - Request latest balance sheet, debt schedule, and 12-month cash forecast
  - - Standard vs Instant mix
    - Needed to understand inventory, service, and shipping cost intensity
    - GOAT policy proves both flows exist but not their weight
    - 'Medium: cost structure remains blurred'
    - Request GMV, order count, and gross profit split by fulfillment mode
  - - Refund / chargeback / SLA breach rates
    - Needed to quantify buyer-protection economics and regulatory exposure
    - FTC case provides adverse signal but no recurring rate card
    - 'Medium: operational-risk severity is directionally clear, not quantified'
    - Request monthly refund and chargeback cohorts
  - - Non-transaction revenue
    - Needed to know whether GOAT has advertising or subscription upside like eBay
    - eBay advertising and peer buyer-fee models show what GOAT may be missing
    - 'Medium: concentration risk may be understated'
    - Request ancillary revenue breakdown and product roadmap
  notes: These are the exact public-data gaps that stop the chapter from converting marketplace-fee evidence into a high-confidence financial underwriting case.
