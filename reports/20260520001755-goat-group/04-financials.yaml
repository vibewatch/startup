- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / estimate
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 GOAT GMV estimate
    - $2.0-2.5B
    - Medium
    - Top-line base for all revenue and margin estimates
    - Validate internal GMV by geography and category
  - - Headline take-rate band
    - 9.5%-12.4% before seller-fee variability
    - Medium
    - Directly converts GMV into a revenue proxy
    - Confirm regional commission exceptions and promotional waivers
  - - Marketplace revenue proxy
    - $190-310M from GMV × headline fees
    - Low-Medium
    - Frames scale relative to peers despite no audited revenue
    - Provide recognized revenue, not just GMV-derived proxy
  - - Buyer shipping / service monetization
    - $14.95 standard US shipping; $27.95 next-day Instant
    - Medium
    - Shows buyer-side revenue offsets to fulfillment cost
    - Provide gross and net shipping margin by order type
  - - Trust / refund exposure
    - 30-day buyer-protection window plus >$2M FTC shipping order
    - High
    - Operational misses can convert into cash costs and fines
    - Provide refund, chargeback, and SLA breach rates
  - - International facility overhead
    - Closures in UK, Hong Kong, and Japan reported in 2025
    - Medium
    - Suggests fixed-cost burden outside core markets
    - Share regional contribution margin and facility savings
  - - Cash-out / processor leakage
    - 2.9% cash-out fee plus payment-processing costs implied
    - Medium
    - Payment economics shape net take rate
    - Provide payout mix and processor cost net of seller charges
  - - Gross margin
    - Not publicly disclosed
    - Low
    - Key missing proof point for durability of the model
    - Provide audited gross margin by standard vs Instant orders
  notes: The table mixes disclosed facts with explicitly labeled estimates where public audited data is absent. Unknowns are retained as unknown and paired with precise diligence asks.
