- id: TI002
  title: Pricing / monetization table
  columns:
  - Platform
  - Core seller monetization
  - Buyer-side fee model
  - Trust / returns model
  - What it implies for GOAT
  rows:
  - - GOAT
    - 9.5% commission + seller fee + 2.9% cash-out
    - Buyer pays shipping; Instant next-day fee on eligible orders
    - Buyer protection for inauthentic / incorrect / mismatched items
    - Transaction-fee heavy model that must earn its premium through trust and service
  - - StockX
    - 7.0-9.0% transaction fee + 3% processing
    - No buyer fee cited in retained source; 14-day returns via credit
    - Verification plus post-purchase credit return path
    - Direct core-sneaker pricing pressure, especially for high-volume sellers
  - - eBay
    - Variable seller fees tied to category and listing setup
    - Authentication is free to eligible sneaker buyers
    - Authenticity Guarantee and seller protections
    - GOAT competes against an incumbent that can fund trust without a sneaker-specific fee
  - - Whatnot
    - Commission fee + payment-processing fee; no listing/storage fee
    - Buyer protection through support workflow
    - Counterfeit / not-as-described / lost-order coverage
    - Lower listing friction in live commerce can attract opportunistic sellers
  - - Vinted
    - No seller fees
    - Buyer Protection fee of $0.70 + 5% plus buyer-paid shipping
    - Buyer-funded refunds and support
    - Buyer-funded protection shows an alternative margin architecture to GOAT
  - - Depop
    - No seller fee on new UK/US listings; 10% elsewhere; processing applies
    - Small US buyer marketplace fee from July 2024
    - Platform investment in Depop Protection and support
    - Long-tail apparel sellers have lower-friction alternatives to GOAT
  - - Poshmark
    - Exact current fee schedule not verifiable in retained source set
    - Community-commerce purchase protection model not quantified here
    - Social-commerce brand remains strategically valuable
    - Useful reminder that community and discovery still carry enterprise value
  notes: GOAT is compared only against monetization mechanics that were visible in fetched sources during this run. Unsupported exact fee schedules are called out rather than estimated.
  enumerationScope:
    coverage: partial
    basis: Covers the peer fee architectures that were fetch-verifiable in the retained source set and most relevant to GOAT's monetization and seller acquisition pressure in 2026.
