- id: cost-structure
  title: Cost structure and authentication intensity
  body: 'The fee stack alone does not tell the economic story, because GOAT''s model still has meaningful physical cost drivers. Standard orders are comparatively marketplace-like: sellers confirm, print labels, and ship after sale. But GOAT also runs Instant-item and premium-fulfillment flows, supports buyer-protection refunds, and has historically operated facilities in multiple countries. Those features make the model more capital and service intensive than classifieds-like resale apps. Public comparables are useful on this point. eBay shows what a scaled marketplace can look like when take rate is supported by advertising and limited physical-auth exposure. The RealReal shows the opposite end of the spectrum: authenticated resale can achieve positive EBITDA, but even at public scale it still carries large cost of revenue and very large operations-and-technology expense. GOAT likely sits between those two poles. That makes its undisclosed standard-versus-Instant mix one of the most important
    missing metrics in the entire financial file.'
