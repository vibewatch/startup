tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public value / status
  - Revenue quality
  - Margin sensitivity
  - Diligence ask
  rows:
  - - Seller commission
    - Percentage of completed sale price
    - 9.5% headline rate (12.4% Canada) plus seller fee
    - Core recurring transaction revenue while GMV is healthy
    - High sensitivity to sell-through and price compression
    - Need regional mix of sellers and any tiered exceptions
  - - Seller fee / submission fee
    - Fixed fee based on location and drop-off vs prepaid shipping
    - US drop-off $0; US prepaid shipping $5; international fixed fees vary
    - Likely part monetization, part label-cost recovery
    - Sensitive to logistics costs and seller routing mix
    - Need net revenue versus pass-through split by market
  - - Seller cash-out fee
    - 2.9% charge on ACH or PayPal payout
    - Publicly disclosed in fee policy
    - Ancillary monetization tied to seller payout behavior
    - Margin depends on payment-provider economics
    - Need share of payouts that incur the fee
  - - Buyer shipping and Instant next-day fee
    - Buyer-paid shipping and expedited-delivery charges
    - $14.95 standard contiguous-US shipping; $27.95 next-day Instant
    - Service-fee revenue but likely partially offset by carrier cost
    - Sensitive to carrier inflation and return rates
    - Need gross vs net shipping margin by order type
  - - Priority processing / premium service layers
    - Operationally faster handling for eligible orders
    - Available to eligible buyers; exact surcharge not retained in fetched excerpt
    - Potential ancillary monetization but not publicly quantifiable
    - Sensitive to staffing and fulfillment throughput
    - Need price and attach-rate data for premium services
  notes: GOAT publishes explicit commission, seller-fee, cash-out, and buyer-shipping economics, but not the net revenue recognition split between pass-through logistics and true service margin.
  enumerationScope:
    coverage: partial
    basis: Enumerates the public fee and service layers visible in GOAT's 2026 policies; excludes any private B2B or advertising revenue streams not evidenced in fetched sources.
