- id: section-2
  title: Operational risk still sits in shipping, refunds, authentication, and support
  body: 'The operational question is not whether GOAT has policies; it clearly does. The harder question is whether those policies close the gap between advertised convenience and lived buyer experience at scale. GOAT''s shipping policy still says delivery times are estimates rather than guarantees, and international orders can stretch to 5-30 business days because of customs. That caveat helps legally, but it also means the user promise is softer than the marketing memory many customers bring to the platform. Independent complaint venues are noisy and imperfect, yet the same themes recur across them: delayed responses, canceled or wrong orders, counterfeit concerns, and dissatisfaction with refund handling. Even the better complaint sources still show ongoing 2026 activity, which means this is not just stale pandemic residue. The authenticity flow is the second operational choke point. GOAT presents a layered verification system and states that all items are checked by one or more methods,
    but some products can still skip physical examination. In a marketplace built on trust, that residual ambiguity matters more than it would in ordinary ecommerce. Investors should therefore read support backlog, claim outcomes, and authentication false-negative rates as first-order operating metrics, not back-office details.'
