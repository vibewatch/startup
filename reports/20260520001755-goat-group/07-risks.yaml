- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - FTC / trust relapse
    - Regulator, court, or policy re-escalation
    - Any new enforcement, restitution program, or broad authenticity-claim dispute wave
    - Pause underwriting and re-open downside assumptions immediately.
  - - Shipping deterioration
    - Buyer complaints and support delays rise again
    - Sustained increase in late-shipment complaints or longer support-cycle times
    - Cut conversion and retention assumptions; treat as an execution miss, not noise.
  - - Authentication miss rate
    - Counterfeit or misdescribed-item disputes trend up
    - Meaningful increase in disputed-authentication cases or return approvals tied to quality mismatch
    - Raise trust haircut and require deeper operations diligence before adding risk.
  - - Tariff / customs friction
    - Cross-border fees or hold times rise materially
    - Higher duty pass-through, customs delays, or carrier-charge surprises on core corridors
    - Reduce international conversion assumptions and review unit-economics resilience.
  - - Category heat loss
    - Resale spreads compress further across core brands
    - More releases at or below retail and weaker seller incentive to list on-platform
    - Lower GMV and take-rate expectations and revisit valuation support.
  notes: Kill criteria are intentionally observable so investors can update the view before a trust shock fully reaches GMV.
