  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ftc-compliance
    missingEvidence: Post-order compliance reporting, regulator correspondence, and any internal remediation scorecard since the FTC settlement.
    whyItMatters: The public record proves a past failure but does not prove that remediation is durable.
    diligencePath: Request board or compliance committee materials covering shipping-promise, refund, and authenticity control improvements.
    relatedQuestionRefs:
    - QR001
    - QR028
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: authentication-quality
    missingEvidence: False-negative rate, manual-review rate, disputed-authentication volume, and appeal outcomes by category.
    whyItMatters: Trust is GOAT's product, so verification quality directly drives repeat purchase and regulator risk.
    diligencePath: Request monthly quality-control dashboards and any third-party audit results for authentication operations.
    relatedQuestionRefs:
    - QR006
    - QR027
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: cross-border-unit-economics
    missingEvidence: Duty-prepaid share, customs-hold rate, refund incidence, and conversion impact by key international corridor.
    whyItMatters: Tariff and customs changes can erode GMV or margin even if top-line demand remains intact.
    diligencePath: Request corridor-level logistics metrics and sensitivity analysis for duty pass-through.
