- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - GOAT has real scale and a still-relevant private-market following.
    - thesis
    - Current revenue, take rate, and margin disclosure showing economics stronger than public resale peers would strengthen the case.
  - - StockX and Vestiaire show private resale assets can still hold multi-billion-dollar reference values.
    - thesis
    - Cleaner, convergent secondary marks across providers would make private-comp framing more credible.
  - - Current GOAT marks remain too dependent on modeled or partial secondary sources.
    - anti-thesis
    - A fresh primary round or management-sanctioned secondary disclosure would reduce this concern.
  - - Public resale comps mostly trade at modest revenue multiples.
    - anti-thesis
    - If GOAT can prove materially higher revenue scale or better unit economics, a premium multiple could be defensible.
  - - The disclosure gap makes downside easier to explain than upside.
    - anti-thesis
    - Audited financials, cohort data, and preference-stack clarity would improve underwriteability.
  notes: Arguments are intentionally price-sensitive and centered on what the current valuation already assumes.
