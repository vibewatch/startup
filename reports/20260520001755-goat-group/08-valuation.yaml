- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Current revenue and take rate
    - Latest twelve-month revenue, GMV, take rate, and cohort retention by geography and category.
    - These metrics determine which public-comp multiple bucket GOAT deserves.
    - Request management deck and finance-room exports.
  - - Margin and cash conversion
    - Contribution margin, fulfillment cost, refunds, working capital, and cash-burn bridge.
    - A marketplace can look large and still be weak economically.
    - Request audited or reviewed financial statements plus board package.
  - - Cap table and preference stack
    - Fully diluted share count, liquidation preferences, side letters, and employee secondary restrictions.
    - Needed to turn secondary share-price references into actual equity value.
    - Request legal data room and latest financing documents.
  - - Secondary-market evidence quality
    - Recent transfer volume, bid-ask depth, and actual cleared trades on approved venues.
    - Clarifies whether current modeled prices are actionable or mostly illustrative.
    - Request broker data and company-approved transfer statistics.
  - - Risk-to-valuation linkage
    - Evidence that trust, tariffs, and support issues are not eroding repeat purchase or cross-border conversion.
    - The risk chapter can change the valuation chapter faster than a normal software diligence process would.
    - Cross-check risk KPIs against cohort and unit-economics data.
  notes: These asks focus on the specific evidence gaps preventing a buy decision at the current visible price range.
