- id: section-3
  title: Public comps imply that revenue support matters more than marketplace mystique
  body: Public comps are imperfect, but they are still the best way to test how much economic support a multi-billion-dollar GOAT mark would require. ThredUp trades around 1.62x revenue, The RealReal around 1.49x, Rent the Runway around 0.33x, and eBay around 4.37x. That spread is wide, yet it is still more disciplined than hand-waving around secondary-market interest. If GOAT were valued at UpMarket's $3.34 billion reference, it would need only about $0.76 billion of revenue at eBay's multiple, but about $2.06 billion at ThredUp's multiple, about $2.24 billion at The RealReal's multiple, and more than $10 billion at Rent the Runway's distressed multiple. Because GOAT does not publicly disclose current revenue in the fetched evidence, investors cannot tell which of those zones is even directionally right. That is the core underwriting problem. GOAT may deserve a premium to the public resale names because of brand quality, marketplace position, or better take-rate economics, but those are
    hypotheses until management opens the books. Public comps therefore do not prove GOAT is overvalued to the penny; they prove that current confidence should be conditional on private diligence rather than granted automatically.
