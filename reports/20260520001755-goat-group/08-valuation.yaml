artifact: valuation
slug: goat-group
runDate: '2026-05-20'
company:
  name: GOAT Group
chapter:
  number: 8
  title: Valuation
  summary: 'GOAT is still a real scaled marketplace, but the current public evidence does not justify paying a premium private-market price with casual confidence. The last clean primary mark is the 2021 $3.7 billion round, while 2026 secondary indicators are mixed and model-heavy: UpMarket points to roughly $3.34 billion and Nasdaq Private Market shows a $3.54 share-price estimate without a public share-count bridge. Public resale comps mostly trade at 0.3x-1.6x revenue, with eBay the only richer marketplace outlier. That evidence supports an avoid call at a roughly $3.3 billion to $3.7 billion entry reference.'
sections:
- id: section-1
  title: 'Recommendation: quality exists, but the current entry still asks investors to underwrite too much opacity'
  body: 'GOAT is clearly not a speculative shell. The company disclosed meaningful scale at its last primary round, and multiple private-market platforms still maintain current pages for the stock, which is more than can be said for many stale unicorns. That said, the investment question is not whether GOAT is real; it is whether the currently visible price range is compelling relative to what public evidence can actually support. On that test, the answer is no. The cleanest historical anchor remains the June 2021 Series F at $3.7 billion. The freshest current anchor from UpMarket is about $3.34 billion, and Nasdaq Private Market gives a May 2026 share-price estimate without a public share-count bridge. That means the market is still being asked to trust modeled or partial secondary signals rather than audited, filing-grade economics. Public resale peers do not solve the problem in GOAT''s favor. The stronger public comps still trade on much lower revenue multiples than a casual multi-billion-dollar
    private mark would imply, and the weakest public comp shows how violent downside can be when consumer-platform economics disappoint. The right posture is therefore price discipline, not admiration discipline: avoid new money at the current reference range unless private diligence materially improves the economics picture or the price resets lower.'
  claimRefs:
  - CV001
  - CV005
  - CV006
  - CV028
