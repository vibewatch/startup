    - Historical primary mark, not a current market-clearing price.
  - - GOAT
    - 2026 modeled secondary reference
    - 'UpMarket estimate: $3.34B; NPM estimate: $3.54/share'
    - Best current public pricing references for the stock.
    - Model-driven / partial and not enough to derive a precise enterprise value.
  - - StockX
    - Private comp
    - 2021 $3.8B primary mark; 2026 modeled reference up to $4.41B and NPM $50.14/share
    - Closest private sneaker-marketplace analog with active secondary tracking.
    - Provider dispersion is wide and direct revenue disclosure is absent.
  - - Vestiaire Collective
    - Private comp
    - Tracxn current valuation $1.64B
    - Useful luxury-resale benchmark for category adjacency.
    - Less sneaker-centric and current mark still tied to older funding history.
  - - ThredUp
    - Public comp
    - ~1.62x revenue ($0.52B market cap / $321.19M TTM revenue)
    - Public resale platform with accessible revenue and value data.
    - Different assortment, economics, and growth profile.
  - - The RealReal
    - Public comp
    - ~1.49x revenue ($1.08B market cap / $722.53M TTM revenue)
    - Closest public luxury-resale platform in disclosure quality.
    - Business mix differs from sneaker-led marketplace dynamics.
  - - Rent the Runway
    - Public comp
    - ~0.33x revenue ($0.11B market cap / $329.80M revenue)
    - Shows downside multiple compression for a consumer platform with weaker market trust.
    - Rental apparel model is only a stress reference, not a clean operating peer.
  - - eBay
    - Public marketplace ceiling reference
    - ~4.37x revenue ($50.72B market cap / $11.60B TTM revenue)
    - Best disclosed broad-marketplace benchmark in the set.
    - Diversified scale platform, not a focused resale marketplace.
  notes: The comp set mixes private resale names and public marketplaces because no single listed company matches GOAT exactly.
