- id: capital-private-status
  title: Funding history and current private status
  body: |-
    The clearest public capital milestones are still the late 2020 and 2021 rounds. GOAT announced a $100 million Series E from D1 Capital Partners in September 2020 and said that financing brought cumulative capital to nearly $300 million. Current private-company profile sources then converge on a large June 2021 Series F round of $195 million at a $3.7 billion valuation. They do not match perfectly on total capital—Fundbat says $493 million, Tracxn says $487 million—but both still place the latest headline valuation at $3.7 billion and describe the business as private.

    That private status is the most important conclusion for this chapter. As of the post-2024 evidence available in this run, current profile pages from PitchBook, Tracxn, and Fundbat still classify GOAT as private or Series F/later-stage VC, and no source retrieved in this run documents an IPO, SPAC, or acquisition of GOAT Group itself. The company's own 2026 terms and privacy policies also continue to describe operating surfaces under 1661, Inc. d/b/a GOAT rather than a public-company structure.

    The diligence limit is that public capital visibility effectively stops after the 2021 round. Current board rights, secondaries, and any internal valuation resets are not publicly disclosed in the accessible record.
