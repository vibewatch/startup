- id: founders-footprint
  title: Founders, operating footprint, and governance visibility
  body: |-
    Founder visibility is clear at origin but thinner than one would want for a late-stage private company. GOAT's official about page names the founding year, while current third-party company profiles and older funding releases continue to identify Eddy Lu and Daishin Sugano as the founders. Public 2026 materials that were easy to retrieve do not expose a current full executive roster or board list, so leadership diligence relies more on founder continuity and on operational signals from hiring, footprint, and legal policies than on a polished governance page.

    Operating-footprint evidence is stronger. Flight Club's current pages confirm it is owned by GOAT Group and still runs flagship stores in New York, Los Angeles, and Miami, while the Japan store locator adds a current Tokyo location. The hiring board also shows active roles across Los Angeles, Shanghai, Easton, Teterboro, Atlanta, Fontana, the Philippines, and remote North America, covering authentication, fulfillment, software, machine learning, dispute handling, and retail operations. Combined with GOAT's privacy disclosures about in-person locations and compliance checks, that suggests a materially larger operating system than the consumer app alone implies.

    What remains missing is formal governance disclosure: there is no easy public board matrix, no refreshed founder biography pack, and no current economic breakdown of the portfolio.
