  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and investor-rights summary for GOAT Group.
    whyItMatters: Without current governance disclosure, it is hard to assess control, founder dependence, and investor influence after the 2021 round.
    diligencePath: Request the current board deck, board roster, and major investor side-letter / information-rights summary under NDA.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-certified current employee count and a location breakdown by function.
    whyItMatters: Current profile sources conflict on workforce scale, which affects operating-leverage and execution-readiness judgments.
    diligencePath: Request HRIS export or finance-certified headcount by brand, geography, and function as of the latest month-end.
