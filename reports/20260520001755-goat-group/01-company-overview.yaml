    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current revenue, GMV, take rate, and brand-level contribution data after the 2021 financing window.
    whyItMatters: The chapter can confirm identity and private status, but not current economic scale or the mix between GOAT, Flight Club, Grailed, Sneakers.com, and alias.
    diligencePath: Request audited or board-level monthly financials with GMV, net revenue, take rate, and EBITDA by brand for the last 12 months.
