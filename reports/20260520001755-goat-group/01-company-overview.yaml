company:
  name: GOAT Group
chapter:
  number: 1
  title: Company Overview
  summary: GOAT Group remains a private, venture-backed sneaker and apparel marketplace operator as of 2025-2026, with current profile sources still describing it as private/Series F rather than public or acquired. Official brand surfaces show a five-brand portfolio spanning GOAT, Flight Club, Grailed, Sneakers.com, and alias, while current company pages continue to cite 60M+ members across 170 countries. The most material recent adverse development is the FTC's December 2024 order requiring more than $2.0M in consumer refunds and operational remedies around shipping and buyer-protection practices, while exact current headcount, board composition, and post-2021 cap-table detail remain under-disclosed.
sections:
- id: identity-model
  title: Identity, portfolio, and operating model
  body: |-
    GOAT was founded in 2015 by Eddy Lu and Daishin Sugano and positions itself as a global marketplace for sneakers, apparel, and accessories. Current official materials still describe a two-sided buyer/seller service rather than a pure first-party retailer: the terms of use define buyers and sellers, the privacy policy covers sites, apps, and in-person locations, and the homepage shows more than 315,000 live listings. That makes the company easier to frame as infrastructure for authenticated secondary commerce, not just a fashion storefront.

    The portfolio is broader than the flagship GOAT app. GOAT Group's current careers page says the company operates five brands—GOAT, Flight Club, Grailed, Sneakers.com, and alias—and serves more than 60 million members across 170 countries. That brand architecture matters because it spreads GOAT Group across premium sneaker resale, consignment-style retail, men's fashion resale, discount footwear, and seller tooling. alias in particular reinforces that GOAT Group is not only consumer-facing; it also supplies workflow and pricing tools for sellers across GOAT and Flight Club.

    The operating model is therefore multi-surface and omnichannel: digital marketplace, seller tooling, authentication and fulfillment infrastructure, and branded retail. Public materials are strongest on marketplace breadth and brand coverage, but weaker on exact current economics by brand.
