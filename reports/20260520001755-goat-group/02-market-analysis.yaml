- id: sizing-lenses
  title: 'Sizing lenses: narrow sneaker resale versus broader apparel and luxury recommerce'
  body: |-
    The narrowest lens comes from sneaker-resale specialists. PLOTT DATA places the global sneaker resale market at roughly $6-8 billion in 2024 and attributes the largest share to the United States, with Europe and Asia-Pacific forming meaningful secondary pools. ResellCalendar reaches a similar directional conclusion on the U.S. market, projecting domestic sneaker resale to hit roughly $6 billion by the end of 2025. Those figures are small relative to the headline global footwear market, but they are much closer to GOAT's actual arena.

    Once the scope broadens to apparel and luxury resale, the numbers expand quickly. thredUP's current report projects the global secondhand apparel market to $393 billion by 2030, while its 2025 report sizes the U.S. secondhand apparel market at $74 billion by 2029 and U.S. online resale at $40 billion by 2029. The Business Research Company separately places global apparel resale at $225.71 billion in 2026 and luxury resale at $41.61 billion in 2026. BCG and Vestiaire then offer a fashion-and-luxury resale lens of roughly $210-220 billion today, reaching $320-360 billion by 2030.

    These scopes are not contradictions so much as nested lenses. For valuation work, the narrower sneaker-resale figures are the safer base case for GOAT's direct market; the broader apparel and luxury numbers matter more for adjacency, brand expansion, and multiple support.
  claimRefs:
