company:
  name: GOAT Group
chapter:
  number: 2
  title: Market Analysis
  summary: 'GOAT''s directly relevant market is authenticated sneaker resale and adjacent fashion recommerce, not the full global sneaker market. Public sizing lenses diverge sharply by scope: PLOTT and reseller-focused sources place sneaker resale closer to a $6-8B global market today, while apparel and fashion/luxury recommerce sources span roughly $41.6B in luxury resale, $225.7B in apparel resale, and $210-220B for secondhand fashion and luxury more broadly. Buyer demand is being pulled by affordability, discovery, and trade-in behavior, but the market is also getting more operationally demanding as margins compress, authentication expectations rise, and competition fragments across GOAT, StockX, eBay, The RealReal, Vestiaire, thredUP, and specialist operators.'
sections:
- id: market-boundary
  title: 'Market boundary: authenticated sneaker resale plus fashion-recommerce adjacency'
  body: |-
    The key framing mistake in GOAT analysis is to treat the company as if it addresses all footwear or all fashion. The primary sneaker market is much larger, but that is not GOAT's direct monetization pool. GOAT participates most directly in authenticated sneaker resale and price-discovery services, then extends into adjacent secondhand apparel and fashion surfaces through Flight Club, Grailed, Sneakers.com, and seller tooling. That means the narrow market is best understood as secondary sneaker commerce with authentication, fulfillment, and curation attached, while the broader adjacency is digital recommerce across apparel and luxury categories.

    Using broader fashion-resale lenses is still useful, because they describe the customer behavior and platform economics that pull GOAT forward. Online multibrand platforms now sit at the center of secondhand adoption, and customer motivations—affordability, uniqueness, access to sold-out items, and resale value—carry across sneakers, apparel, bags, and luxury accessories. But those adjacent statistics should be read as context, not as GOAT's full TAM.

    For diligence, the cleanest approach is to stack three scopes instead of picking one headline number: broad primary sneaker spend, narrow sneaker resale GMV, and broader secondhand fashion/apparel/luxury recommerce. That preserves comparability and avoids overclaiming.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
