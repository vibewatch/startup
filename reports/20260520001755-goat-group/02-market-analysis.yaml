- id: drivers-constraints-competition
  title: Growth drivers, constraints, and competitive context
  body: |-
    The strongest current demand drivers are affordability, tariffs and macro cost pressure, digitized discovery, and better authentication infrastructure. thredUP's 2025 report shows that tariffs and trade concerns can push shoppers toward secondhand, while BCG/Vestiaire and eBay show how digital trust layers—authentication, product data, and easier online discovery—reduce the friction that historically limited resale. Social commerce and trade-in credits also matter because they pull resale into the mainstream retail funnel rather than leaving it as a side market.

    The counterweights are real. Sneaker-resale specialists and reseller-focused sources consistently describe thinner margins, more volume dependence, and a post-pandemic normalization that punishes indiscriminate flipping. In luxury resale, authentication and condition grading remain core bottlenecks, and broader research sources emphasize the cost of verifying provenance and matching quality to listings. That is why digital product passports, QR-linked authenticity records, and platform-managed inspection matter so much to market structure.

    Competition is therefore fragmented by business model rather than only by category. GOAT competes with StockX and eBay in sneaker resale, with Stadium Goods and Flight Club-style retail curation in premium inventory, and with The RealReal, Vestiaire, thredUP, and other platforms in adjacent fashion and luxury recommerce. The winning platforms are the ones that make secondhand feel as reliable and easy as buying new.
