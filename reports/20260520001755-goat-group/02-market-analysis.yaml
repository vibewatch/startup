    - Gen Z / Millennial digital native
    - Peer sellers and platform inventories
    - Combines trend following with resale economics
    - Content creation, discovery, and cultural relevance
    - Important for fashion velocity and new-customer acquisition.
  notes: Buyer and seller segments overlap; the same user can be both a liquidity-seeking seller and a value-seeking buyer over time.
