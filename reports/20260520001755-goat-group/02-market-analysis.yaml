  - - Authenticated sneaker resale
    - Secondary-market sneaker transactions with platform authentication, logistics, and price discovery
    - Primary-market sneaker sell-through and non-authenticated peer-to-peer trades
    - Collectors, style buyers, resellers
    - Core direct market.
  - - Broader sneaker / streetwear recommerce
    - Secondary apparel, accessories, collectibles, and cross-category marketplace activity around sneaker culture
    - All apparel retail and luxury categories not routed through resale platforms
    - Style-led buyers and sellers
    - Important adjacency through GOAT, Flight Club, Grailed, and alias.
  - - Luxury resale
    - Authenticated pre-owned handbags, watches, jewelry, leather goods, and luxury apparel
    - Mass-market apparel and pure primary-luxury sell-through
    - Affluent and aspirational luxury shoppers
    - Useful adjacency and trust benchmark, but broader than GOAT's core.
  - - Apparel resale / recommerce
    - Pre-owned clothing and accessories across managed marketplaces, thrift, and online resale channels
    - Primary apparel retail and non-resale fashion spend
    - Value-seeking and circular-fashion consumers
    - Sets the broader demand environment for secondhand buying behavior.
  - - Primary sneakers market
    - All new sneaker sales in athleisure / sneaker retail
    - Resale GMV and apparel categories
    - Mass-market footwear buyers
    - Useful upper-bound context, not GOAT's direct TAM.
