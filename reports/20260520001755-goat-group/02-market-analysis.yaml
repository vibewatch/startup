  title: Affordability, digital discovery, and trade-in behavior keep pulling resale into the mainstream
  body: Current resale-market evidence points to a powerful combination of affordability, easier online discovery, social-commerce behavior, and brand-backed trade-in programs. Those are structural tailwinds for any platform that can preserve trust.
  claimRefs:
