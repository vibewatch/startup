    - Uses resale for curation and rare finds, not only discounts
    - Uniqueness and access to sold-out pieces
    - Defines the high-trust, high-AOV resale playbook.
  - - Extra-income seller
    - Closet detox / side-income seller
    - Existing wardrobe holders
    - Monetizes unused items and funds future purchases
    - Need for cash or trade-in value
    - Supply depth depends on making selling friction low.
