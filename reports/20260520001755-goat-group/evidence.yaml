      and alias-driven supply.
    whyItMatters: >-
      Without company-level geographic and category mix, public regional demand statistics cannot be translated into a
      clean GOAT-specific SAM or execution roadmap.
    diligencePath: >-
      Request brand-by-brand and region-by-region GMV, take rate, and contribution margin, plus management commentary on
      category expansion priorities.
