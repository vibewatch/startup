evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and investor-rights summary for GOAT Group.
    whyItMatters: >-
      Without current governance disclosure, it is hard to assess control, founder dependence, and investor influence
      after the 2021 round.
    diligencePath: >-
      Request the current board deck, board roster, and major investor side-letter / information-rights summary under
      NDA.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-certified current employee count and a location breakdown by function.
    whyItMatters: >-
      Current profile sources conflict on workforce scale, which affects operating-leverage and execution-readiness
      judgments.
    diligencePath: Request HRIS export or finance-certified headcount by brand, geography, and function as of the latest month-end.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current revenue, GMV, take rate, and brand-level contribution data after the 2021 financing window.
    whyItMatters: >-
      The chapter can confirm identity and private status, but not current economic scale or the mix between GOAT,
      Flight Club, Grailed, Sneakers.com, and alias.
    diligencePath: >-
      Request audited or board-level monthly financials with GMV, net revenue, take rate, and EBITDA by brand for the
      last 12 months.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: goat-som
    missingEvidence: Current audited GMV, take rate, and active-buyer/seller metrics for GOAT and Flight Club.
    whyItMatters: >-
      Public market-size lenses can only bound GOAT's opportunity; they cannot isolate defendable share or monetization
      without company operating data.
    diligencePath: >-
      Request monthly GMV, active buyers, active sellers, and take rate by brand for the last 12 months, then benchmark
      versus the narrow sneaker-resale lens.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: tam-methodology
    missingEvidence: >-
      A management-selected market-definition memo that states which TAM/SAM lens the company actually uses internally
      and why.
    whyItMatters: >-
      Public sources use incompatible scopes—primary sneakers, sneaker resale, apparel resale, luxury resale, and all
      secondhand fashion—so valuation work can overstate addressable market if one headline number is taken literally.
    diligencePath: >-
      Request board materials or strategy memos that define GOAT's internal TAM/SAM/SOM framework and the bridge from
      sneaker resale into broader recommerce categories.
    relatedQuestionRefs:
      - QM010
      - QM024
    relatedTableRefs:
      - TM002
