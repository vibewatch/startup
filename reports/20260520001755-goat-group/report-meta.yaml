companyProfile:
  summary: >-
    GOAT Group is a Los Angeles-based private marketplace operator founded in 2015 by Eddy Lu and
    Daishin Sugano. The company built GOAT around authenticated sneaker resale, then expanded into a
    broader multi-brand portfolio that now includes Flight Club retail consignment, Grailed fashion
    resale, alias seller tooling, and Sneakers.com for more value-oriented footwear discovery. Public
    evidence confirms global brand reach and continuing relevance, but the company remains materially
    under-disclosed on current financials, governance, and cap-table detail.
  foundedDate: '2015-01-01'
  founders:
    - name: Eddy Lu
      role: Co-founder & CEO
      background: Co-founded GOAT after a counterfeit sneaker buying experience and remains the clearest public operating face of the business.
      claimRefs: [CO002]
    - name: Daishin Sugano
      role: Co-founder
      background: Technical co-founder identified across official and profile sources, though his current day-to-day operating role is less visible in fetched 2026 materials.
      claimRefs: [CO002]
  foundingLocation: Los Angeles, CA
  headquarters: Los Angeles, CA
  productSummary: >-
    GOAT Group operates an authenticated sneaker, apparel, and accessories marketplace with digital
    buyer surfaces, seller tooling, and physical retail. GOAT is the flagship marketplace, Flight
    Club provides consignment stores and premium retail trust points, alias centralizes seller
    listing and pricing workflows, Grailed extends the portfolio into fashion resale, and
    Sneakers.com broadens the funnel toward value-oriented footwear shoppers.
  customerFocus: >-
    Core users include sneaker collectors, premium fashion buyers, resellers and consignors,
    boutiques and retailers listing inventory, and a broader mass-market footwear audience reached
    through Sneakers.com. Public materials support a 60M-plus community across 170 countries but do
    not disclose active-buyer or active-seller conversion layers.
  businessModel: >-
    GOAT monetizes primarily through transaction-linked economics: seller commission, seller fees,
    payout fees, buyer shipping and speed layers, and adjacent seller distribution across GOAT,
    Flight Club, and alias. The model blends two-sided marketplace economics with authentication,
    fulfillment, and retail infrastructure, making it more operationally intensive than pure
    classifieds resale.
  stage: Growth
  fundingStatus: >-
    GOAT remains private. The last clearly disclosed primary financing was the June 2021 Series F:
    $195M at a $3.7B valuation. Current 2026 secondary references are mixed and model-heavy,
    including an UpMarket estimate near $3.34B and an NPM share-price estimate without a public
    share-count bridge.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO006, CO028, CO029, CO032, CO033, CV005, CV006]
summary:
  headline: >-
    GOAT is a real, scaled resale asset, but the public evidence still supports avoidance at the
    current visible $3.3B-$3.7B range: post-FTC trust risk, thin financial disclosure, and mixed
    secondary signals leave investors underpaid for opacity.
