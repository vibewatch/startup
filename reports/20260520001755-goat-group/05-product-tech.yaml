company:
  name: GOAT Group
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    GOAT Group runs a multi-surface commerce stack spanning the GOAT consumer marketplace, Flight
    Club retail and consignment, Sneakers.com and the alias seller app. Official support and policy
    materials document selective seller onboarding, verification-first resale routing,
    location-aware pricing adjustments, Persona-based seller identity checks and cross-channel
    listing across GOAT Group brands. Public developer signals point to Ruby on Rails plus Go
    backend work, cloud-hosted seller microservices, dedicated machine-learning and authentication
    staffing and an actively maintained mobile app, but the company does not publish a full
    architecture diagram, formal uptime commitments or a detailed AI roadmap.
sections:
  - id: marketplace-surfaces-and-workflows
    title: Marketplace surfaces and user workflows
    body: >-
      GOAT Group's product stack is not a single app so much as a coordinated set of commerce
      surfaces. Corporate copy now frames the portfolio as GOAT, Flight Club, Grailed, Sneakers.com
      and alias, with GOAT itself covering a broad catalog that goes beyond sneakers into apparel,
      accessories and collectibles. The strongest public workflow description comes from GOAT
      Support: buyers browse more than a million listings while sellers can include retailers and
      boutiques, resale items route through GOAT verification, retail items ship from trusted
      partners and Instant inventory ships pre-verified from GOAT facilities. That mix matters
      because it means the customer experience is built around routing logic rather than a single
      fulfillment path. On the seller side, GOAT and alias documentation show a gated supply model
      in which sellers request approval, submit listings by SKU, price and condition and then feed
      inventory into a cross-brand network that can show items across GOAT surfaces and, via alias,
      across Flight Club and Sneakers.com as well. That architecture supports selection breadth, but
      it also creates many places where verification, price translation and shipping orchestration
      can fail.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE014
      - CE015
      - CE016
      - CE017
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE002
  - id: seller-tooling-authentication-and-pricing
    title: Seller tooling, authentication and pricing mechanics
    body: >-
      The most differentiated public product detail lives in alias, which functions as the operating
      console for GOAT Group sellers. Official FAQ and seller-policy pages show that GOAT is not
      simply exposing a fixed-price listing form; it layers approval gates, pricing guidance,
      score-based economics and identity verification into the seller workflow. Sellers must pass
      Persona checks, can be suspended if verification fails or seller score drops below threshold
      and use pricing tiles such as High Demand, Global Indicator and Lowest Price while setting
      inventory. The company explicitly says those recommendations are advisory, but the combination
      of historical sales data, market insights, global demand and buyer-location adjustments means
      GOAT is running a fairly sophisticated price-translation layer behind the scenes. That is
      notable because it ties authentication, logistics and monetization together: seller outputs
      are translated into buyer-visible prices that may differ by geography once duties and
      operational costs are added. This is not enough to prove a broad AI moat, but it does prove
      that GOAT has seller-specific decision support tooling rather than a bare marketplace upload
      experience.
    claimRefs:
      - CE008
      - CE009
      - CE010
