callouts:
  - calloutType: strength
    title: >-
      GOAT couples supply curation with pricing and verification rather than offering a thin listing
      layer
    body: >-
      The combination of selective seller approval, cross-brand listing distribution,
      verification-first resale routing and data-driven seller pricing is meaningfully more
      opinionated than a generic peer-to-peer marketplace. That should support trust and
      gross-margin capture if the underlying operations keep working.
    claimRefs:
      - CE010
      - CE013
      - CE018
      - CE019
      - CE024
  - calloutType: risk
    title: >-
      The public engineering picture is informative but still too indirect for deep technical
      underwriting
    body: >-
      Hiring pages, app metadata and GitHub provide enough evidence to infer a cloud-backed,
      service-oriented commerce stack, but GOAT still does not publish a formal architecture
      diagram, status page, security-certification set or reliability metrics. Technical diligence
      therefore still depends heavily on management access.
    claimRefs:
      - CE031
      - CE032
      - CE033
      - CE035
      - CE041
  - calloutType: risk
    title: Trust operations appear central, but public adverse app feedback shows operational sharp edges
    body: >-
      Public reviews point to login, seller-confirmation and service-escalation issues. When a
      business relies on verification, routing and payout correctness, even modest operational
      friction can damage both buyer trust and seller supply retention.
    claimRefs:
      - CE022
      - CE024
      - CE040
  - calloutType: insight
    title: >-
      The clearest 2026 roadmap signal is portfolio segmentation, not a disclosed AI-first product
      plan
    body: >-
      Sneakers.com broadens the funnel toward everyday shoppers, while GOAT and alias preserve
      premium and resale workflows. The company is hiring for ML and ships AR features, but public
      materials still stop short of describing a broad AI platform strategy.
    claimRefs:
      - CE003
      - CE030
      - CE034
      - CE042
