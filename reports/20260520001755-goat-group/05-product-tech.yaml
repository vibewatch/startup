  - id: architecture-developer-signals-and-dependencies
    title: Architecture, developer signals and dependencies
    body: >-
      GOAT Group does not publish a formal engineering architecture deck, so the best public
      read-through comes from hiring, app-distribution metadata and a modest GitHub footprint. Y
      Combinator and Built In job pages point to a backend stack spanning Ruby on Rails, Go, Java
      and Python, with explicit references to Go microservices for seller experiences, cloud
      deployment and infrastructure scaled for logistics-heavy commerce. Greenhouse openings for
      machine-learning, authentication and authenticator roles reinforce that trust operations are
      staffed as a core function rather than outsourced entirely. The public GitHub organization, by
      contrast, is thin and mostly fork-based, which suggests GOAT does not rely on open-source
      brand building as a developer-acquisition strategy. Mobile-store evidence adds one more layer:
      the iOS app is actively maintained, the Android footprint is large on both Google Play and
      AppBrain and the Android package includes a non-trivial number of libraries. Together these
      signals support a reasonable inference of a cloud-hosted, service-oriented commerce platform
      with separate consumer, seller and verification operations, but they stop short of proving
      specific cloud vendors, data pipelines or observability tooling.
    claimRefs:
      - CE028
      - CE029
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
      - CE038
      - CE039
      - CE041
    tableRefs:
      - TE006
    figureRefs:
      - FE003
  - id: trust-privacy-retail-and-roadmap
    title: Trust, privacy, retail operations and roadmap
    body: >-
      The public trust and compliance picture is stronger on marketplace controls than on formal
      enterprise-style assurances. GOAT and alias policies are detailed about seller identity,
      shipping windows, returns-to-seller fees, VAT self-billing and buyer-facing price adjustments,
      while the Apple privacy disclosure is explicit that GOAT tracks and links a meaningful amount
      of user data. Those disclosures show operational maturity, but they are not substitutes for
      public security certifications, a status page or audited availability metrics. Physical retail
      remains part of the system as well: Flight Club still positions itself as the original sneaker
      consignment store with named New York, Los Angeles and Miami storefronts, and GOAT Group
      continues to use product launches such as Sneakers.com to extend the funnel beyond premium
      collectors toward everyday buyers. The clearest 2026 roadmap evidence is therefore commercial
      rather than architectural: a new value-oriented brand launch, ongoing app maintenance and
      continued hiring in ML and authentication. Investors can underwrite those signals as evidence
      of product expansion, but detailed AI claims, SRE maturity and security posture still need
      management diligence rather than public-source inference.
    claimRefs:
      - CE030
      - CE036
      - CE037
      - CE040
      - CE042
    tableRefs:
      - TE004
      - TE005
