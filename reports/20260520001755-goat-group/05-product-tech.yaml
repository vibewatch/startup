  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-disclosure
      missingEvidence: >-
        An official architecture or dependency diagram naming core infrastructure, data systems,
        observability tooling and payment/logistics vendors.
      whyItMatters: >-
        Without a first-party architecture map, technical diligence relies on job pages and policy
        inference rather than directly verifiable system design.
      diligencePath: >-
        Request an engineering architecture review and current production dependency inventory from
        the CTO or platform lead.
      relatedQuestionRefs:
        - QE025
    - type: missing-source
      severity: material
      topic: security-certifications
      missingEvidence: >-
        A public status page, uptime commitments, security certification list or independent
        security report for GOAT consumer surfaces.
      whyItMatters: >-
        Trust policies show process, but investors still cannot assess availability or externally
        audited security posture from public materials alone.
      diligencePath: >-
        Ask for SOC reports, penetration-test summaries, public-status tooling and incident history
        covering GOAT and alias.
      relatedQuestionRefs:
        - QE024
    - type: private-evidence-only
      severity: material
      topic: ml-and-authentication
      missingEvidence: >-
        Documentation showing where machine-learning models are actually deployed in production
        beyond pricing guidance, AR discovery and ML hiring signals.
      whyItMatters: >-
        ML is easy to overstate in marketplace stories; underwriting should distinguish production
        systems from roadmap or hiring intent.
      diligencePath: >-
        Request a product-by-product map of deployed models, input data, guardrails and business
        KPIs.
      relatedQuestionRefs:
        - QE023
    - type: stale
      severity: minor
      topic: developer-surface
      missingEvidence: >-
        A first-party developer blog, API documentation set or SDK changelog for external technical
        audiences.
      whyItMatters: >-
        The absence of a clear developer surface limits outside validation of platform maturity and
        slows partner diligence.
      diligencePath: >-
        Confirm whether private partner APIs or internal tooling exist and whether the company plans
        to expose any public developer documentation.
      relatedQuestionRefs:
        - QE025
