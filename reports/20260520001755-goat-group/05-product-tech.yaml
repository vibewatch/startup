        - label: Consumer Surface Layer
          detail: >-
            Buyer-facing marketplace experiences across GOAT app/web, drops, collections and AR-led
            discovery.
          modules:
            - GOAT iOS app
            - GOAT Android app
            - GOAT web catalog
            - Drops / events / editorial
        - label: Seller Surface Layer
          detail: >-
            alias handles seller onboarding, listing, price guidance, payouts and cross-brand
            distribution.
          modules:
            - Seller approval
            - Listing editor
            - Price slider
            - Inventory and earnings views
        - label: Trust and Verification Layer
          detail: >-
            Identity verification, item authentication and seller scoring reduce fraud and quality
            leakage.
          modules:
            - Persona KYC
            - Specialist authentication
            - Seller score engine
            - Buyer protection / returns logic
        - label: Fulfillment and Retail Layer
