        - Buyers
        - >-
          Marketplace for new and pre-owned sneakers, apparel and accessories with drops, events and
          curated collections
        - Mature app and web surface with 10M+ Android installs and 2M iOS ratings
        - Combines primary, retail-partner and resale inventory in one UX
        - No public DAU/MAU or conversion disclosure
      - - Resale verification path
        - Buyers and peer sellers
        - Ship-to-Verify workflow for resale products before buyer delivery
        - Documented in support center and seller policy
        - Verification step supports authenticity trust vs. pure peer-to-peer listing
        - No public reject rate or false-positive metrics
      - - Retail / boutique partner path
        - Buyers and brand partners
        - Pre-verified retail inventory ships directly from trusted retail and boutique partners
        - Documented in support center
        - Lets GOAT mix partner-sourced and peer-sourced inventory
        - No public partner mix or SLA disclosure
      - - Instant inventory
        - Speed-sensitive buyers
        - Pre-verified inventory held at GOAT facilities for faster shipment
        - Support article and seller policy both describe facility-led routing
        - Fastest fulfillment path inside the GOAT surface
        - No facility count or speed metric disclosed
      - - alias seller console
        - Resellers and consignors
        - >-
          Dedicated seller app for listing, inventory management, price guidance and earnings
          management
        - Active Android app updated in May 2026
        - Cross-brand listing and seller-specific tooling rather than buyer-first UI
        - No public seller adoption or attach-rate disclosure
      - - Flight Club retail / consignment
