            - Low
        - label: PissedConsumer aggregate complaints
          values:
            - Sometimes
            - 'Yes'
            - Medium
            - Low
        - label: alias seller-app reviews
          values:
            - 'Yes'
            - 'Yes'
            - Medium
            - Low
        - label: Official GOAT / alias copy
