  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: transacting-customer-count
      missingEvidence: >-
        Active transacting buyer counts, active seller counts and monthly or quarterly cohort
        activity beyond the 60M community metric.
      whyItMatters: >-
        Headline community size can materially overstate monetizable customer depth if many members
        are dormant or single-transaction users.
      diligencePath: >-
        Request monthly active buyers, active sellers and repeat-purchase frequency by geography and
        segment.
      relatedQuestionRefs:
        - QU015
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, churn, refund-adjusted repeat rate and seller retention cohorts.
      whyItMatters: >-
        Without retention disclosure it is impossible to distinguish durable marketplace habit from
        costly reacquisition or fragile seller supply.
      diligencePath: Request cohort tables for buyers and sellers by vintage, GMV band and geography.
      relatedQuestionRefs:
        - QU014
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-seller GMV concentration, partner-inventory concentration and geographic revenue mix.
      whyItMatters: >-
        A broad community claim can still mask heavy economic dependence on a narrow set of sellers,
        merchants or countries.
      diligencePath: >-
        Request top-10 and top-100 seller share of GMV, top-country revenue split and
        partner-channel contribution.
      relatedQuestionRefs:
        - QU019
        - QU025
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: >-
        A more comprehensive named user proof set that covers positive and negative buyers, sellers
        and international users.
      whyItMatters: >-
        Current named proof shows the platform is live but does not provide representative coverage
        of the overall user base.
      diligencePath: >-
        Expand the enumeration with additional named app reviews, public testimonials or verified
        customer interviews.
      relatedQuestionRefs:
        - QU011
        - QU012
      relatedTableRefs:
        - TU003
