figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      How buyers and sellers move through the GOAT ecosystem from discovery to repeat usage or
      resale.
    data:
      nodes:
        - id: discover
          label: Discovery
          detail: >-
            Buyer or seller discovers GOAT, Flight Club, alias or Sneakers.com through app stores,
            drops, editorial or brand awareness.
          type: input
        - id: browse
          label: Browse / Search
          detail: >-
            Buyer explores new, pre-owned or curated inventory; seller scans or searches SKU inside
            alias.
          type: process
        - id: commit
          label: Purchase or List
          detail: Buyer places order; seller submits listing after approval.
          type: process
        - id: route
          label: Route through network
          detail: >-
            Inventory can route via GOAT verification, trusted partner direct ship, Instant facility
            stock or Flight Club/affiliate exposure.
          type: process
        - id: delivery
          label: Delivery / Payout
          detail: Buyer receives item or seller receives earnings after delivery or consignment sale.
          type: process
        - id: support
          label: Support / Issue Handling
          detail: >-
            User enters FAQ or submit-request workflow if there is an authenticity, shipping or
            refund problem.
          type: process
        - id: repeat
          label: Repeat or Churn
          detail: >-
            Satisfied users can buy, browse or sell again; dissatisfied users may churn publicly
            through negative reviews.
          type: output
    approximationNotes: >-
      Journey is synthesized from support, app-store and review evidence rather than internal funnel
      analytics.
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU009
      - CU026
      - CU027
      - CU032
      - CU033
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: Representative buyer and seller operating flow across GOAT, alias and Flight Club.
    data:
      nodes:
        - id: buyer-app
          label: Buyer app install or web visit
          detail: Free-to-download app and broad global shipping lower top-of-funnel friction.
          type: input
        - id: seller-app
          label: Seller adopts alias
          detail: Seller installs alias to list inventory across the network.
          type: input
        - id: inventory
          label: Inventory enters marketplace
          detail: Retailers, boutiques or approved sellers supply items into GOAT Group channels.
          type: process
        - id: verification
          label: Verification / direct-ship routing
          detail: >-
            Order path depends on resale verification, partner direct ship or facility-held Instant
            inventory.
          type: process
        - id: buyer-outcome
          label: Delivery and support outcome
          detail: Positive outcome can drive repeat browsing; poor support can create public complaints.
          type: process
        - id: seller-outcome
          label: Payout and reinvestment
          detail: Seller receives earnings and may relist or consign more inventory.
          type: output
        - id: public-feedback
          label: Public review layer
          detail: >-
            Ratings and reviews on Apple, Google Play, AppBrain and complaint sites create visible
            sentiment loops.
          type: output
    approximationNotes: >-
      This is a process map, not a numeric funnel; public sources do not disclose conversion rates
      between these stages.
    claimRefs:
      - CU004
      - CU008
      - CU011
      - CU013
      - CU023
      - CU026
      - CU027
      - CU032
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      How strong the public evidence is across customer proof categories and what each source does
      or does not prove.
    data:
      columns:
        - Named User Visible
        - Production Use Evident
        - Outcome Specificity
        - Retention Visibility
