  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - One listing distributed across GOAT, Flight Club and Sneakers.com
        - Top sellers may still drive disproportionate GMV even if distribution is broad
        - High upside, unclear concentration
        - Request top-10 seller GMV share and top-100 seller churn
      - - Sneakers.com launch into everyday consumers
        - May broaden audience but could lower AOV or dilute brand mix
        - Strategic upside with margin-mix uncertainty
        - Request early customer-repeat and CAC payback for Sneakers.com
      - - Flight Club retail halo
        - Store footprint is small and likely concentrated in a handful of cities
        - Medium strategic value, low disclosed scale
        - Request store contribution to acquisition and resale trust conversion
      - - 170-country shipping reach
        - Cross-border economics may still be concentrated in a few countries
        - Large TAM signal with unknown regional revenue split
        - Request country revenue concentration and customs-issue rates
      - - International retrenchment in Hong Kong, Japan and UK facilities
        - Seller trust can be damaged when storage/fulfillment nodes are shut down
        - Material operational risk for cross-border sellers
        - Request detailed rationale and GMV impact from 2025 facility closures
      - - Retailer / boutique partner supply
        - Partner-sourced assortment may concentrate on a small number of merchants or brands
        - Diversifies inventory but may create hidden supplier concentration
        - Request partner contribution to orders and take-rate by channel
    notes: >-
