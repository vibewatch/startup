callouts:
  - calloutType: strength
    title: GOAT clearly has real buyer and seller usage, not just logo-level demand claims
    body: >-
      App-store scale, named public reviews and an active seller app make it hard to argue that GOAT
      is a merely aspirational marketplace. The evidence shows live buyers, repeat users and sellers
      relying on the platform in production.
    claimRefs:
      - CU012
      - CU013
      - CU021
      - CU022
      - CU023
  - calloutType: risk
    title: >-
      The 60M community metric is broad awareness, not a substitute for active-customer or retention
      disclosure
    body: >-
      GOAT communicates impressive top-of-funnel scale, but public sources still do not disclose
      active transacting buyers, active sellers, cohort retention or NRR/GRR. Investors should treat
      the headline as reach, not realized customer quality.
    claimRefs:
      - CU001
      - CU014
      - CU040
  - calloutType: risk
    title: Adverse review volume points to meaningful service and trust friction
    body: >-
      Counterfeit disputes, refund complaints, shipping issues and poor escalation quality appear
      repeatedly across independent review surfaces. Those issues may not define the whole customer
      base, but they are too frequent to dismiss as noise.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU024
      - CU025
      - CU027
  - calloutType: insight
    title: Expansion is visible in brand architecture, but concentration remains opaque
    body: >-
      Sneakers.com broadens the demand funnel and alias broadens seller distribution, yet public
      sources do not show whether economics remain concentrated in a smaller pool of premium
      sellers, partner inventory or geographies.
    claimRefs:
      - CU010
      - CU011
      - CU029
      - CU030
      - CU039
