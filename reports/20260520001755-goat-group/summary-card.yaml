summary:
  headline: >-
    GOAT is a real, scaled resale asset, but the public evidence still supports avoidance at the current visible
    $3.3B-$3.7B range: post-FTC trust risk, thin financial disclosure, and mixed secondary signals leave investors
    underpaid for opacity.
  overallScore: 5.8
  recommendation: avoid
  confidence: medium
  riskRating: high
  valuationStance: expensive
