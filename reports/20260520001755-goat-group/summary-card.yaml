  topStrengths:
    - >-
      Multi-brand reach across GOAT, Flight Club, Grailed, Sneakers.com, and alias gives the company broader demand and
      supply surfaces than a single-app resale marketplace.
    - >-
      Official materials still support 60M+ members across 170 countries, showing durable brand relevance and global
      awareness.
    - >-
      GOAT's authentication-led positioning and seller tooling create a more defensible premium niche than low-friction
      generic classifieds resale.
    - >-
      The business remains large enough to retain active secondary-market coverage and historical scale markers such as
      $2B GMV at the 2021 financing.
  topRisks:
    - >-
      The FTC's 2024 order proves shipping, refund, and buyer-protection failures already escalated into formal
      enforcement, not just anecdotal complaints.
    - >-
      Current revenue, margin, cash, debt, and share-count disclosure is too thin to underwrite a multi-billion-dollar
      valuation with confidence.
    - >-
      Tariff and customs friction can worsen landed cost and delivery predictability just as sneaker resale premiums
      compress.
    - >-
      GOAT remains exposed to authentication misses, support backlogs, and category dependence on brand release cycles
      it does not control.
  unresolvedGaps:
    - Current revenue, gross margin, EBITDA, cash, debt, and runway remain undisclosed in the public evidence set.
    - Active buyers, active sellers, repeat-purchase cohorts, NRR, and churn are not publicly disclosed.
    - >-
      Post-2021 cap-table changes, current fully diluted share count, and any management-sanctioned secondary pricing
      remain opaque.
    - >-
      Post-FTC remediation metrics such as shipment SLA trends, refund outcomes, and authentication false-negative rates
      were not publicly available.
    - Public leadership and board disclosure is sparse for a company at this scale.
