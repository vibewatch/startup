      - number: '2.3'
        title: 买家与卖家分层
        blocks:
          - type: paragraph
            body: >-
              买家群体并不单一。球鞋里仍有收藏和炒作驱动人群，重视稀缺性、发售日历和转售价值；但越来越多需求更务实：买家追求更低价格的穿搭、女性签名款、复古跑鞋，或是在不缴一级市场运气税的情况下买到售罄鞋款。服饰和奢侈品里，分层更长——从把转售当作可负担入口的向往型消费者，到用它优化衣橱的富裕消费者，再到靠出售衣橱存货变现或筹措下一次购买的卖家。


              BCG 和 Vestiaire 对理解分层行为尤其有用。它们显示，二手已经深度进入衣橱，线上多品牌平台拿到一半以上购买，Gen Z
              用转售做发现和自我表达，美国买家围绕价格更交易化，欧洲买家更偏策展。thredUP 及其 2025 年调研还显示，Gen Z 和 Millennials 计划把远高于老龄群体的服饰预算分配给二手。


              具体到 GOAT，这意味着公司同时服务收藏型和重性价比需求。也意味着卖家流动性几乎和买家流量一样重要，因为额外收入和衣橱清理动机，才让库存持续周转。
