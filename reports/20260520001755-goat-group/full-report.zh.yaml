      - number: '3.2'
        title: 经济性与信任对比
        blocks:
          - type: paragraph
            body: >-
              GOAT 不是靠成为最便宜渠道取胜。它公开的经济模型叠加了卖家佣金、卖家费用和提现费，再向买家另收运费和高端履约选项费用。StockX 也提供类似变现的鉴定模式，但高销量卖家可以拿到低于 GOAT
              标准佣金的交易费。eBay 把球鞋鉴定作为免费的买家服务，并能靠大得多的 GMV 和 GOAT 未公开披露的广告业务来支撑这个选择。另一端，Vinted 和 Depop
              在关键地区降低或取消卖家费用，转而把更多经济性放到买家或支付处理上。Whatnot
              处在不同中间地带：它是直播社交市场平台，通过佣金和支付处理变现，但依赖成交后的买家保护，而不是预先鉴定库存。这些差异重要，因为各家的买家信任和卖家摩擦并不是用同一种方式付费。
