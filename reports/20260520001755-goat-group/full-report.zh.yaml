      - number: '2.4'
        title: 增长驱动、约束与竞争背景
        blocks:
          - type: paragraph
            body: >-
              当前最强的需求驱动来自可负担性、关税和宏观成本压力、数字化发现，以及更好的鉴定基础设施。thredUP 2025 年报告显示，关税和贸易担忧会把消费者推向二手；BCG / Vestiaire 和 eBay
              则显示，数字信任层——鉴定、商品数据和更容易的线上发现——会降低过去限制转售的摩擦。社交电商和以旧换新积分同样重要，因为它们把转售拉进主流零售漏斗，而不是留在边缘市场。


              反向力量也真实存在。球鞋转售专业机构和面向转售商的来源反复提到，利润率变薄、对规模依赖更强，且疫情后正常化会惩罚无差别倒卖。奢侈品转售中，鉴定和成色评级仍是核心瓶颈；更宽的研究来源强调，验证来源和把质量匹配到上架商品的成本很高。这也是数字产品护照、二维码关联真伪记录、平台托管检验对市场结构如此重要的原因。


              因此，竞争不是只按品类切，而是按商业模式切。GOAT 在球鞋转售里与 StockX 和 eBay 竞争，在高端库存里与 Stadium Goods 和 Flight Club
              式零售策展竞争，在相邻时尚和奢侈品二手电商里与 The RealReal、Vestiaire、thredUP 等平台竞争。能赢的平台，会让买二手像买新货一样可靠、简单。
