  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - GOAT 证明当前收入规模足以支撑溢价平台倍数，且投资者奖励披露改善。
        - 股权价值约 $4.8B，较 $3.34B UpMarket 参考值约 +44%。
        - 需要明显强于当前公开记录的经济性和更干净的披露。
        - 低
      - - 基准
        - GOAT 仍有相关性，但估值更接近较强的公开转售可比公司，而不是稀缺性溢价叙事。
        - 股权价值约 $2.2B，较 UpMarket $3.34B 参考价约 -34%。
        - 即便执行不错，也未必跑赢倍数约束和披露折价。
        - 中
      - - 悲观
        - 当前收入支撑弱于预期，私有市场不透明度受到的惩罚更像承压消费平台。
        - 股权价值约 $1.2B，较 UpMarket $3.34B 参考价约 -64%。
        - 一旦增长质量不及预期，公开市场估值压缩和流动性不足会迅速传导。
        - 中
    notes: 情景区间是投资委员会的讨论工具，锚定当前可见的 GOAT 参考价格，并非管理层指引。
