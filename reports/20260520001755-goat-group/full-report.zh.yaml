companyProfile:
  summary: >-
    GOAT Group 是一家总部位于 Los Angeles 的私营市场平台运营商，2015 年由 Eddy Lu 和 Daishin Sugano 创立。公司先围绕正品鉴定球鞋转售打造 GOAT，随后扩展成多品牌组合，包括
    Flight Club 零售寄售、Grailed 时尚转售、alias 卖家工具，以及面向更重性价比鞋履发现的 Sneakers.com。公开证据确认其全球品牌触达和持续相关性，但公司对当前财务、治理和股权结构细节的披露仍明显不足。
