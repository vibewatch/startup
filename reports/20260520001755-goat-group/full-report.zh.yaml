      - number: '7.2'
        title: 运营风险仍卡在物流、退款、鉴定和客服
        blocks:
          - type: paragraph
            body: >-
              运营问题不在于 GOAT 有没有政策；它显然有。更难的问题是，这些政策能否在规模化之后，弥合宣传中的便利与买家实际体验之间的落差。GOAT 的物流政策仍写明交付时间只是估计而非保证，国际订单还可能因海关拉长到
              5-30
              个工作日。这个限定在法律上有帮助，但也意味着用户承诺比许多客户带着的营销记忆更软。独立投诉渠道噪音大、并不完美，但相同主题反复出现：回复延迟、订单取消或发错、假货担忧，以及对退款处理不满。即便质量较高的投诉来源仍显示
              2026 年有持续活动，说明这不只是疫情时期遗留的陈旧问题。真伪鉴定流程是第二个运营瓶颈。GOAT
              展示了分层验证体系，并称所有商品都会经过一种或多种方法检查，但部分商品仍可跳过实物检查。一个建立在信任上的交易平台里，这种残余模糊性比普通电商更重要。因此，投资者应把客服积压、索赔结果和鉴定假阴性率当成一线运营指标，而不是后台细节。
