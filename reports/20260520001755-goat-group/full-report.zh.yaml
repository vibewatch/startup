      - number: '1.3'
        title: 融资历史与当前私营状态
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开资本里程碑仍是 2020 年末和 2021 年两轮。GOAT 于 2020 年 9 月宣布 D1 Capital Partners 领投的 $100M Series E，并称该融资使累计资本接近
              $300M。当前私营公司资料来源随后共同指向 2021 年 6 月一轮大型 Series F：融资 $195M，估值 $3.7B。它们对累计资本口径并不完全一致——Fundbat 称 $493M，Tracxn 称
              $487M——但都仍把最新头条估值放在 $3.7B，并将公司描述为私营。


              该私营状态是本章最重要的结论。基于本次运行可用的 2024 年后证据，PitchBook、Tracxn 和 Fundbat 当前资料页仍把 GOAT 归为私营或 Series F / 后期
              VC；本次检索没有任何来源记录 GOAT Group 本身已经 IPO、SPAC 或被收购。公司自己的 2026 年条款和隐私政策也继续把运营主体描述为 1661, Inc. d/b/a
              GOAT，而不是上市公司结构。


              尽调限制在于，公开资本能见度实际上在 2021 年那轮之后就停止了。当前董事会权利、老股交易以及任何内部估值重置，都没有在可访问记录中公开披露。
