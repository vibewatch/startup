  - id: TV005
    title: 投资逻辑失效与止损触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前经济性仍未披露
        - 尽调中，管理层仍不开放当前收入、抽佣率和利润率数据。
        - 投资人是在为不透明买单，而不是为证据买单。
        - 不要按当前可见价格加仓。
      - - 老股价格进一步分化
        - 数据提供方价差扩大，或更保守的信号继续下行。
        - 私有市场价格发现更弱，而不是更强。
        - 用区间低端作为实际承销锚点。
      - - 公开转售倍数持续低迷
        - ThredUp / RealReal / RENT 没有显著重估。
        - 从公开可比公司推到 GOAT 数十亿美元估值的桥仍然脆弱。
        - 模型中继续以下行情景为主。
      - - GMV 规模未能转化为收入质量
        - 私下尽调显示抽佣率低、利润率薄，或营运资本压力大。
        - 市场规模不再支撑溢价估值。
        - 转为明确回避，或要求低得多的入场价。
      - - 跨境或信任摩擦重新加速
        - 风险章节的止损标准开始触发，同时估值证据仍然稀薄。
        - 经营压力与估值脆弱性叠加。
        - 把估值下行和业务风险下行视为联动，而不是分开看。
    notes: 止损触发项用于推翻“品牌质量能够支撑估值”的乐观桥。
    claimRefs:
      - CV007
      - CV008
      - CV012
      - CV030
      - CV032
      - CV039
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任人或尽调路径
    rows:
      - - 当前收入与抽佣率
        - 按地区和品类拆分的最近十二个月收入、GMV、抽佣率和队列留存。
        - 上述指标决定 GOAT 应落在哪个公开可比倍数区间。
        - 索取管理层材料和财务数据室导出。
      - - 利润率与现金转化
        - 贡献利润率、履约成本、退款、营运资本和现金消耗桥。
        - 市场平台可以看起来很大，但经济性仍然很弱。
        - 索取经审计或审阅的财务报表，以及董事会材料。
      - - 股权结构表与优先股堆叠
        - 完全摊薄股数、清算优先权、侧函和员工老股转让限制。
        - 需要这些信息，才能把老股股价参考转换成实际股权价值。
        - 索取法律数据室和最新融资文件。
      - - 老股市场证据质量
        - 获批交易场所的近期转让量、买卖价差深度和实际成交交易。
        - 厘清当前模型价格能否执行，还是主要用于示意。
        - 索取经纪商数据和公司批准的转让统计。
      - - 风险与估值联动
        - 证明信任、关税和客服问题没有侵蚀复购或跨境转化的证据。
        - 相比普通软件尽调，风险章节可能更快改写估值章节。
        - 用队列和单位经济数据交叉核对风险 KPI。
    notes: 上述尽调问题聚焦具体证据缺口，而证据缺口正阻碍在当前可见价格区间作出买入决定。
    claimRefs:
      - CV007
      - CV008
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
