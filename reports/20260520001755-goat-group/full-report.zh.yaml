  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 改变判断的条件
    rows:
      - - GOAT 具备真实规模，也仍受私募市场关注。
        - 投资逻辑
        - 如果当前收入、抽佣率和利润率披露显示其经济性强于公开转售可比公司，投资理由会增强。
      - - StockX 和 Vestiaire 显示，私营转售资产仍能守住数十亿美元参考估值。
        - 投资逻辑
        - 如果不同提供方的二级市场标记更干净且趋同，私募可比框架会更可信。
      - - GOAT 当前估值标记过度依赖模型化或局部二级市场来源。
        - 反向逻辑
        - 新一轮新股融资或管理层认可的老股交易披露会降低这一担忧。
      - - 公开转售可比公司大多以温和收入倍数交易。
        - 反向逻辑
        - 如果 GOAT 能证明收入规模明显更高或单位经济性更好，溢价倍数就有防守性。
      - - 披露缺口让下行比上行更容易解释。
        - 反向逻辑
        - 经审计财务、队列数据和优先股堆叠清晰度会改善可承销性。
    notes: 这些论点有意对价格敏感，并围绕当前估值已经隐含的假设展开。
