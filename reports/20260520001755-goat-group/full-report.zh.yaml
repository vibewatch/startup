      - number: '8.2'
        title: 价格背景：GOAT 相比 2021 年大致持平到下行，私募可比信号仍噪音很大
        blocks:
          - type: paragraph
            body: >-
              给 GOAT 当前价格定位，最实用的方法是对照自身历史和最接近的私募转售可比公司。GOAT 2021 年估值为 $3.7 billion，对应 $195 million 新资本和披露的 $2 billion
              GMV。UpMarket 当前模型估值为 $3.34 billion，只比该新股融资估值低约 10%，意味着可见的私募重估是温和的，而不是剧烈的。Nasdaq Private Market 的 $3.54
              股价估计同样指向市场相关性仍在，但证据集中没有公开完全稀释股数，因此不足以推出公司估值。StockX 让可比性问题更清楚。它 2021 年新股融资估值为 $3.8
              billion，但当前二级市场参考因提供方不同差异很大，从更高的模型化估值到保守得多的第三方估计都有。这种分散在流动性差的私营公司里很正常，但意味着投资者应抵制虚假的精确。Vestiaire Collective
              当前 Tracxn 估值为 $1.64 billion，方向上有用，但它是奢侈品转售平台，而不是纯球鞋主导的交易平台。结论是，GOAT
              处在可信但披露仍不足的私募区间：头条价格参考存在，但没有一个强到让当前估值显得明显便宜。
