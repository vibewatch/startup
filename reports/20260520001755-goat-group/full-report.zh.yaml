  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 市场平台界面与用户工作流
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 的产品栈与其说是一个 App，不如说是一组协同的商业界面。公司文案现在把组合表述为 GOAT、Flight Club、Grailed、Sneakers.com 和 alias；GOAT
              本身覆盖的目录也从球鞋延伸到服饰、配饰和收藏品。最强的公开工作流描述来自 GOAT Support：买家浏览超过 1M 个在售商品，卖家可包括零售商和精品店，转售商品经 GOAT
              验证，零售商品由可信合作伙伴发货，Instant 库存则由 GOAT 设施预先验证后发货。这个组合重要，因为它说明客户体验围绕路由逻辑搭建，而不是单一路径履约。卖家侧，GOAT 和 alias
              文档显示一个有门槛的供给模型：卖家申请批准，按 SKU、价格和成色提交上架商品，然后把库存送入一个跨品牌网络；商品可出现在 GOAT 界面，也可通过 alias 出现在 Flight Club 和
              Sneakers.com。这个架构支撑丰富选品，但也制造了许多可能出错的节点：验证、价格转换和发货编排都可能失败。
