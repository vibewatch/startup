      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - FTC / 信任问题反弹
        - 监管、法院或政策重新升级
        - 任何新的执法、赔偿计划或大范围真伪主张争议浪潮
        - 立即暂停承销，并重新打开下行情景假设。
      - - 配送恶化
        - 买家投诉和支持延迟再次上升
        - 发货延迟投诉持续增加，或支持周期变长
        - 下调转化和留存假设；把它视为执行失误，而不是噪音。
      - - 鉴定漏判率
        - 假货或描述不符争议上行
        - 争议鉴定案件明显增加，或与质量不匹配相关的退货批准增加
