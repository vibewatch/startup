      - number: '8.4'
        title: 情景逻辑：在今天可见估值下，下行比上行更容易解释
        blocks:
          - type: paragraph
            body: >-
              GOAT
              合理的乐观情景并非不可能。如果公司在交易平台规模之上维持了强劲收入转化，如果跨境摩擦证明可控，并且投资者最终更愿意按高端交易平台而不是较弱公开转售组合来给它定价，那么高于当前模型估值的结果是可能的。但公开证据并没有让这个情景变得容易。下行情景更容易解释，因为它需要的英勇假设更少：持续缺乏披露、公开可比倍数保持低迷、二级市场信号只是温和偏正，已经足以支撑一个显著低于
              2021 年的估值。这也是本章情景表相对于当前入场参考仍偏负面的原因。接近 $1.2 billion 的悲观情景和接近 $2.2 billion 的基准情景，都自然来自公开市场压缩和当前经济性不确定；而接近
              $4.8 billion 的乐观情景，则要求投资者假设收入规模和质量好于现有证据所显示。决策因此不太取决于 GOAT 能否打造一家好公司，而更取决于投资者是否因不透明获得了补偿。按今天可见区间看，答案是否定的。
