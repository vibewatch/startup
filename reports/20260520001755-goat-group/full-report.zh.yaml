        - label: GOAT / alias 官方文案
          values:
            - 否
            - 仅宽泛
            - 低
            - None
    approximationNotes: 矩阵评估的是证据质量，不是客户价值；留存可见度低反映公开队列指标缺失，并不等于留存为负。
