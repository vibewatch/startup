  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: GOAT 最高的剩余风险集中在法律—信任暴露、跨境摩擦和品类级转售压缩。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: FTC / 买家承诺再次失守
          values:
            - label: 中
              tone: warning
              detail: 核心行为已经被执法一次。
            - label: 严重
              tone: negative
              detail: 再犯会伤害信任，并招来进一步审查。
            - label: 中
              tone: warning
              detail: 政策已经存在，但持续控制的公开证据薄弱。
            - label: 高
              tone: negative
              detail: 剩余法律—信任暴露仍是排名最高的风险。
        - label: 鉴定漏判或争议
          values:
            - label: 中
              tone: warning
              detail: 并非每件商品都会实物检查。
            - label: 高
              tone: negative
              detail: 假货指控扩散时，信任型市场会很快破裂。
            - label: 中
              tone: warning
              detail: 多种验证模式有帮助，但无法消除边缘案例。
            - label: 高
              tone: negative
              detail: 信任就是产品，剩余严重度仍高。
        - label: 跨境关税摩擦
          values:
            - label: 高
              tone: negative
              detail: 政策变化已在 2025-2026 年落地。
            - label: 高
              tone: warning
              detail: 摩擦会同时打击转化和交付体验。
            - label: 中低
              tone: warning
              detail: GOAT 有客服支持内容，但没有公开走廊指标。
            - label: 高
              tone: negative
              detail: 国际复杂性可能叠加较弱市场需求，放大风险。
        - label: 转售溢价压缩
          values:
            - label: 高
              tone: negative
              detail: 公开品类评论已经显示溢价率下降。
            - label: 中高
              tone: warning
              detail: 卖家利润变薄会降低供给质量和上架紧迫性。
            - label: 中低
              tone: warning
              detail: GOAT 无法直接控制全品类供需。
            - label: 中高
              tone: warning
              detail: 这会很痛，但严重度仍低于信任失守。
        - label: 价格竞争和合作伙伴依赖
          values:
            - label: 中高
              tone: warning
              detail: GOAT 规模仍大，但相对 StockX 等玩家并不占支配地位。
            - label: 中高
              tone: warning
              detail: 竞争性费用或价差可能拖慢热门发售的转化。
            - label: 中
              tone: warning
              detail: 二手库存和策划选品能提供部分缓冲。
            - label: 中
              tone: warning
              detail: 除非叠加信任或海关冲击，否则仍可管理。
    approximationNotes: 序数评分是有来源支撑的排序判断，不是合成概率。
    claimRefs:
      - CR001
      - CR008
      - CR016
      - CR018
      - CR022
      - CR028
      - CR030
      - CR035
      - CR036
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 信任失灵和关税摩擦会通过客户转化、卖家供给和退款负担传导到估值。
    data:
      nodes:
        - id: trust
          label: 信任失灵
          detail: 运输、真伪和退款争议削弱买家信心。
          tone: warning
        - id: tariffs
          label: 关税摩擦
          detail: 更高关税和海关复杂性抬高到岸成本与交付不确定性。
          tone: warning
        - id: support
          label: 支持负担
          detail: 工单处理慢会放大每个运营错误。
          tone: warning
        - id: buyers
          label: 买家转化
          detail: 客户对价格更敏感，也更难容忍意外成本。
          tone: warning
        - id: sellers
          label: 卖家积极性
          detail: 利润薄、争议处理差，会降低上架质量和深度。
          tone: warning
        - id: gmv
          label: GMV 韧性
          detail: 转化下滑、供给变弱，会拖慢市场平台吞吐。
          tone: negative
        - id: margin
          label: 利润率压力
          detail: 退款、支持成本和抽成率下滑挤压经济模型。
          tone: negative
        - id: valuation
          label: 估值下行
          detail: 信任和吞吐同时走弱时，市场平台价值会下跌。
          tone: negative
      edges:
        - from: trust
          to: support
        - from: trust
          to: buyers
        - from: tariffs
          to: buyers
        - from: tariffs
          to: support
        - from: support
          to: margin
        - from: buyers
          to: gmv
        - from: sellers
          to: gmv
        - from: gmv
          to: valuation
        - from: margin
          to: valuation
        - from: trust
          to: sellers
    approximationNotes: 风险图为定性图，旨在呈现因果方向，而非数值权重。
    claimRefs:
      - CR013
      - CR019
      - CR024
      - CR031
      - CR034
      - CR035
      - CR036
      - CR037
      - CR044
  - id: FR003
    title: 依赖地图
    type: dag
    layout: wide
    summary: GOAT 依赖品牌、卖家、物流和海关参与方，但无法完全控制这些主体。
    data:
      nodes:
        - id: nike
          label: Nike / 主要品牌
          detail: 为核心球鞋需求设定产品引力和稀缺性背景。
          tone: warning
        - id: sellers
          label: 卖家网络
          detail: 提供库存广度和成色质量。
          tone: warning
        - id: goat
          label: GOAT 运营核心
          detail: 鉴定、支持、商品运营和支付。
          tone: neutral
        - id: customs
          label: 海关 / 关税制度
          detail: 决定关税、清关步骤和延误风险。
          tone: warning
        - id: carriers
          label: 物流合作伙伴
          detail: 承接交付执行和部分费用收取。
          tone: warning
        - id: buyers
          label: 买家
          detail: 需要对价格、真伪和交付有信心。
          tone: neutral
        - id: stockx
          label: 竞争基准
          detail: 另一类交易场所会影响价格透明度和切换行为。
          tone: warning
      edges:
        - from: nike
          to: buyers
        - from: nike
          to: sellers
        - from: sellers
          to: goat
        - from: customs
          to: goat
        - from: carriers
          to: goat
        - from: goat
          to: buyers
        - from: stockx
          to: buyers
        - from: stockx
          to: sellers
    approximationNotes: 这张图标出交易对手和系统节点，而不是法律控制边界。
    claimRefs:
      - CR020
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR034
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: GOAT 确实有规模，也仍有市场存在感，但当前价格仍跑在公开披露能支撑的水平前面。
    data:
      nodes:
        - id: scale
          label: 真实交易平台规模
          detail: GOAT 上一轮融资披露了 $2B 商品交易总额（GMV）、30M 会员和 600K 卖家。
          tone: positive
        - id: current
          label: 有当前价格参照
          detail: UpMarket 和 NPM 仍在发布 GOAT 当前页面，说明这个标的没有过时。
          tone: positive
        - id: opaque
          label: 披露仍不足
          detail: 抓取资料中看不到当前收入、利润率和完全摊薄股数。
          tone: warning
        - id: comps
          label: 上市可比公司倍数不高
          detail: 多数上市转售可比公司的收入倍数只有 0.3x-1.6x。
          tone: warning
        - id: decision
          label: 回避
          detail: 没有私募尽调，不应在大约 $3.3B-$3.7B 的参考估值上追加新资金。
          tone: negative
      edges:
        - from: scale
          to: current
        - from: current
          to: decision
        - from: opaque
          to: decision
        - from: comps
          to: decision
    approximationNotes: null
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV030
      - CV031
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: $3.34B 的 GOAT 估值标记，只有在投资者假设收入支撑很强，或愿意给出溢价交易平台倍数时，才显得稳妥。
    data:
      items:
        - label: 0.33x 下所需收入
          value: 10.12
          detail: 按 Rent the Runway 当前倍数，要支撑 $3.34B 估值所需的收入（十亿美元）。
          tone: negative
        - label: 1.49x 下所需收入
          value: 2.24
          detail: 按 The RealReal 当前倍数，要支撑 $3.34B 估值所需的收入（十亿美元）。
          tone: warning
        - label: 1.62x 下所需收入
          value: 2.06
          detail: 按 ThredUp 当前倍数，要支撑 $3.34B 估值所需的收入（十亿美元）。
          tone: warning
        - label: 4.37x 下所需收入
          value: 0.76
          detail: 按 eBay 当前倍数，要支撑 $3.34B 估值所需的收入（十亿美元）。
          tone: positive
    approximationNotes: 敏感性条形只是用已引用的上市可比公司倍数，把市值反推到收入；不是折现现金流模型的输出。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 现有证据支撑的是一个很宽的区间，但中位数仍低于当前可见 GOAT 参考值。
    data:
      items:
        - label: 悲观情景
          low: 0.9
          mid: 1.2
          high: 1.5
          displayValue: $0.9B-$1.5B
          detail: 上市可比公司倍数压缩，再叠加当前经济性偏弱，支撑大幅重置。
          tone: negative
        - label: 基准情景
          low: 1.9
          mid: 2.2
          high: 2.5
          displayValue: $1.9B-$2.5B
          detail: GOAT 仍有市场存在感，但估值更接近较强的上市转售可比公司。
          tone: warning
        - label: 乐观情景
          low: 4
          mid: 4.8
          high: 5.5
          displayValue: $4.0B-$5.5B
          detail: 收入质量好于担忧，披露改善，保住溢价交易平台估值标记。
          tone: positive
    approximationNotes: 区间锚定当前可见 GOAT 参考值，作为供投委会讨论的情景输出，不是管理层指引。
    claimRefs:
      - CV031
      - CV032
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: GOAT 在市场相关性上得分高，但当前证据质量和估值支撑得分低。
    data:
      items:
        - label: 市场相关性
          score: 7
          detail: 公司仍有活跃老股交易页面，也有可观品牌足迹。
          tone: positive
        - label: 历史验证
          score: 7
          detail: 2021 年那轮融资披露了实际商品交易总额（GMV）、会员数和卖家规模。
          tone: positive
        - label: 私募可比支撑
          score: 6
          detail: StockX 和 Vestiaire 说明转售资产仍可守住可观私募估值。
          tone: warning
        - label: 上市可比支撑
          score: 4
          detail: 上市转售公司倍数大多不高，难以让当前估值标记显得便宜。
          tone: negative
        - label: 披露质量
          score: 3
          detail: 当前收入、利润率和股数披露仍缺失。
          tone: negative
        - label: 风险调整后价格
          score: 3
          detail: 当前可见入场价，并未明显补偿投资者承担的信息不透明。
          tone: negative
        - label: 证据质量
          score: 5
          detail: 证据足以支持回避，但还不足以让人有把握买入。
          tone: warning
    approximationNotes: 评分采用投委会使用的序位判断，依据本章有来源支撑的证据，而不是加权量化模型。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV030
      - CV031
      - CV034
      - CV036
      - CV037
      - CV042
