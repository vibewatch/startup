      - number: '3.4'
        title: 护城河侵蚀风险
        blocks:
          - type: paragraph
            body: >-
              两类风险最突出。第一，GOAT 的信任护城河依赖执行。FTC 发货命令显示，一旦服务承诺滑坡，那些愿意为 GOAT 费用溢价买单的买家，很快会质疑平台是否配得上这份溢价。第二，Complex
              报道的国际设施收缩说明，GOAT 模型中的实体部分，在核心市场之外仍有不小的固定成本和服务复杂度风险。低迷周期里，这些问题让 GOAT
              比轻费用社交市场平台更暴露。与此同时，竞争集合也确认护城河不会一夜消失。StockX 仍缺少 GOAT 更宽的生活方式策展，Vinted 和 Depop 在高端球鞋鉴定上仍弱，Whatnot
              更多是围绕形式竞争，而不是经验证的球鞋库存。正确结论是，GOAT
              的护城河持久但有条件：可信履约和多品牌触达顺畅时，它能守住；一旦执行失误迫使买卖双方重新评估费用取舍，它侵蚀最快。实际操作中，投资人应把服务水平可靠性和设施生产率视为核心护城河指标，而不是后台指标。
