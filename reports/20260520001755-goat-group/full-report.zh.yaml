      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
      - CI013
      - CI014
      - CI015
    data:
      nodes:
        - id: seller-supply
          label: 获批卖家 + 买家需求
          description: GOAT 只接纳获批卖家，并把商品分发到 GOAT Group 各触点。
        - id: gmv
          label: GMV（2024E $2.0-2.5B）
          description: PLOTT 对 GOAT 年度球鞋转售交易额的估计。
        - id: commission
          label: 佣金收入（9.5%-12.4% 名义口径）
          description: 完成交易中抽取的卖家佣金，尚未计入卖家费用差异。
        - id: seller-fees
          label: 卖家费用 + 提现费
          description: 按路线 / 地区固定的卖家费用表，加上 ACH / PayPal 提现 2.9% 费用。
        - id: buyer-fees
          label: 买家运费 + Instant / 优先服务费
          description: 符合条件订单中买家支付的运费和加急服务费。
        - id: gross-revenue
          label: 收入代理值（$190-310M）
          description: 用公开费率层把 GMV 折算为收入代理值；不是经审计收入数字。
        - id: cost-stack
          label: 鉴定 / 运输 / 退款成本栈
          description: 鉴定人力、运单、设施、支付处理、退款和合规成本。
        - id: contribution
          label: 贡献利润率未知
          description: 公开资料未披露 GOAT 毛利率或 EBITDA。
      edges:
        - from: seller-supply
          to: gmv
          label: 交易发生
        - from: gmv
          to: commission
          label: 抽取佣金
        - from: gmv
          to: seller-fees
          label: 卖家提现层
        - from: gmv
          to: buyer-fees
          label: 买家服务费
        - from: commission
          to: gross-revenue
          label: 计入代理值
        - from: seller-fees
          to: gross-revenue
          label: 计入代理值
        - from: buyer-fees
          to: gross-revenue
          label: 计入 / 由承运商成本抵消
        - from: gross-revenue
          to: cost-stack
          label: 支撑运营
        - from: cost-stack
          to: contribution
          label: 扣除成本后的净额
