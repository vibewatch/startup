              商品和高端履约流程，支持买家保护退款，并且历史上在多个国家运营设施。这些功能让模型比分类信息式转售 App 更吃资本和服务。公开可比公司在这一点上有用。eBay
              展示了一个规模化市场平台在抽佣率获得广告支撑、实体鉴定暴露有限时可以是什么样子。The RealReal 展示了光谱另一端：经鉴定转售可以实现正
