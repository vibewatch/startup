      - CR045
  - id: TV001
    title: 建议摘要表
    columns:
      - 决策字段
      - 当前判断
      - 决策含义
    rows:
      - - 建议
        - 回避
        - 在没有私有尽调前，不要以大约 $3.3B-$3.7B 的参考估值承销新资金。
      - - 置信度
        - 中
        - 公开证据方向上有用，但对当前收入和利润率仍然很薄。
      - - 风险评级
        - 高
        - 私募市场估值标记流动性差，公开转售标的倍数平淡；如果披露不及预期，下行空间不小。
      - - 估值立场
        - 昂贵
        - 可见的私募标记需要比当前公开记录更好的经济性证据支撑。
      - - 持有 / 退出姿态
        - 只有久期足够长且能拿到私有信息时才成立
        - 现有持有人可以等待流动性，但新买家并没有明显因不透明获得补偿。
      - - 价格纪律
        - 低于当前可见区间，或披露明显改善时再重新评估
        - 更低入场价或达到申报文件级别的证据，可能实质性改变判断。
    notes: 该建议针对当前可见价格区间，并不是笼统断言 GOAT 是一家弱公司。
