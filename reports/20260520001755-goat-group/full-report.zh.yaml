  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与信任风险已有记录，不再是假设
        blocks:
          - type: paragraph
            body: >-
              GOAT 的核心风险不再是转售交易平台理论上会不会让买家失望；FTC 已经记录了公开承诺与实际执行脱节的地方。2024 年 12 月的命令之所以重要，是因为它把物流履约失败与消费者保护补救绑定起来，并明确触及
              GOAT 的 Buyer Protection
              和真伪承诺。这比单个季度客服表现差严重得多，意味着公司已经越过了从声誉摩擦到正式执法的门槛。此后，公司仍保留买家保护、真伪鉴定和条款页面，这是一个缓释点，因为投资者能检查其声称的控制措施。但同样这些页面仍暴露关键摩擦：索赔必须迅速提出；获批退货默认退为
              GOAT Credit，除非买家另行要求；部分商品可以不经实物检查完成鉴定。这些安排在运营上或许合理，但当客户认为商品是假货、与描述存在重大差异，或只是觉得不值得再在平台下单时，争议仍有残余空间。Trippy
              Goat 仍在审理的案卷本身不是生死问题，但它强化了更大的判断：除 FTC 事项外，GOAT 仍暴露在法律与商标清理风险中。
