      - number: '1.2'
        title: 创始人、运营足迹与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人能见度在公司起点上清楚，但对一家后期私营公司来说仍偏薄。GOAT 官方关于页面列出创立年份，当前第三方公司资料和较早融资稿也继续把 Eddy Lu 和 Daishin Sugano 列为创始人。可轻松获取的
              2026 年公开材料没有展示当前完整高管名单或董事会名单，因此领导层尽调更多依赖创始人延续性，以及招聘、地点和法律政策释放的运营信号，而不是一页打磨好的治理页面。


              运营足迹证据更强。Flight Club 当前页面确认它归 GOAT Group 所有，并仍在 New York、Los Angeles 和 Miami 运营旗舰店；日本门店定位页还显示一个当前 Tokyo
              门店。招聘板也显示 Los Angeles、Shanghai、Easton、Teterboro、Atlanta、Fontana、Philippines
              和北美远程岗位仍在招，覆盖鉴定、履约、软件、机器学习、争议处理和零售运营。再结合 GOAT 关于线下地点和合规检查的隐私披露，GOAT 的运营系统明显大于一个消费 App。


              缺口在正式治理披露：公开渠道看不到易获取的董事会矩阵、更新后的创始人传记包，也没有产品组合当前经济性的拆分。
