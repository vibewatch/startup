  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 推荐：质量存在，但当前入场点仍要求投资者承受过多不透明
        blocks:
          - type: paragraph
            body: >-
              GOAT 显然不是投机空壳。公司在上一次新股融资中披露了有意义的规模，多家私募市场平台仍保留其股票的当前页面，这已经强过许多陈旧独角兽。话虽如此，投资问题不是 GOAT
              是否真实存在，而是当前可见价格区间相对于公开证据真正能支撑的内容是否有吸引力。在这个测试下，答案是否定的。最干净的历史锚点仍是 2021 年 6 月 Series F，估值 $3.7
              billion。UpMarket 给出的最新当前锚点约为 $3.34 billion，Nasdaq Private Market 给出 2026 年 5
              月的股价估计，但没有公开股本数量桥接。这意味着市场仍被要求相信模型化或部分二级信号，而不是经审计、达到申报级别的经济数据。公开转售可比公司也不能替 GOAT
              解决问题。较强的公开可比公司收入倍数仍远低于随口给出的数十亿美元私募估值所暗示的水平，最弱的公开可比则说明，一旦消费平台经济性令人失望，下行可以非常猛烈。因此，正确姿态是价格纪律，而不是仰慕纪律：除非私下尽调显著改善经济图景，或价格下调，否则应避免在当前参考区间投入新资金。
