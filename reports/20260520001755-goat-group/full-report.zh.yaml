  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - GOAT
        - 2021 年新股轮
        - ' $195M F 轮，估值 $3.7B '
        - 最后一个由公司认可、相对干净的估值锚点。
        - 历史新股价格，不是当前市场出清价格。
      - - GOAT
        - 2026 年模型化老股参考
        - UpMarket 估计：$3.34B；NPM 估计：$3.54/share
        - 当前最好的公开股票定价参考。
        - 模型驱动且信息不完整，不足以推导精确企业价值。
      - - StockX
        - 私有可比公司
        - 2021 年新股价格 $3.8B；2026 年模型参考价最高 $4.41B，NPM 为 $50.14/share
        - 最接近的私有球鞋市场可比对象，并有活跃老股跟踪。
        - 数据提供方分歧大，且缺少直接收入披露。
      - - Vestiaire Collective
        - 私有可比公司
        - Tracxn 当前估值 $1.64B
        - 可作为相邻品类的奢侈品转售基准。
        - 球鞋属性更弱，当前价格仍绑定较早融资历史。
      - - ThredUp
        - 公开可比公司
        - 收入约 1.62x（市值 $0.52B / TTM 收入 $321.19M）
        - 公开转售平台，收入和估值数据可获取。
        - 品类组合、经济模型和增长画像不同。
      - - The RealReal
        - 公开可比公司
        - 收入约 1.49x（市值 $1.08B / TTM 收入 $722.53M）
        - 披露质量上最接近的公开奢侈品转售平台。
        - 业务组合不同于球鞋主导的市场动态。
      - - Rent the Runway 可比公司
        - 公开可比公司
        - 收入约 0.33x（市值 $0.11B / 收入 $329.80M）
        - 展示了市场信任较弱的消费平台会承受怎样的下行倍数压缩。
        - 服装租赁模式只能作为压力参考，不是干净的经营同业。
      - - eBay
        - 公开市场平台上限参考
        - 收入约 4.37x（市值 $50.72B / TTM 收入 $11.60B）
        - 本组中披露最充分的综合市场平台基准。
        - 多元化规模平台，不是聚焦转售的市场。
    notes: 可比组混合了私有转售公司和公开市场平台，因为没有一家上市公司与 GOAT 完全匹配。
    enumerationScope:
