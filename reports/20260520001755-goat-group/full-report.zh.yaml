              财务读数喜忧参半，但仍可用。正面看，GOAT 有真实费用栈，通过 alias 和 Flight Club
              拿到广泛卖家分发，在球鞋转售中的市场地位仍像第一梯队。公开可比公司也证明，经鉴定转售和市场平台经济在规模化后都可能盈利。负面看，GOAT
              自己的公开文件在最关键处仍太薄：确认收入、毛利率、订单结构经济性、现金、债务和烧钱速度。FTC 行动和海外设施收缩本身不是投资逻辑杀手，但说明服务执行和实体网络成本都是正在发生的问题。因此，本章结论是：GOAT
              的收入质量大概率好过纯社交转售，但没有私有数据，仍无法有把握地承销其利润率路径和资本画像。正确下一步不是估值工作，而是一套尽调包，把政策可见度转化为经审计的经济性。
