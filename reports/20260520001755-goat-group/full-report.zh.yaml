            title: 狭义球鞋转售才是正确的承销基准情景
            body: 广义服饰和奢侈品二手电商统计能描述有用相邻市场，但对 GOAT 最有决策价值的市场口径仍是带正品鉴定的球鞋转售。不控制范围就套用更宽数字，会夸大直接 TAM。
