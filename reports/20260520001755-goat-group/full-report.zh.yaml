            body: >-
              GOAT Group 不发布正式工程架构材料，因此最好的公开读数来自招聘、App 分发元数据和有限的 GitHub 足迹。Y Combinator 和 Built In 招聘页指向一个覆盖 Ruby on
              Rails、Go、Java 和 Python 的后端栈，并明确提到用于卖家体验、云部署和面向重物流商业扩展的基础设施的 Go 微服务。Greenhouse
              上机器学习、鉴定和鉴定师岗位进一步说明，信任运营是核心职能，而不是完全外包。相较之下，公开 GitHub 组织很薄，且多为分叉仓库，说明 GOAT
              不依靠开源品牌建设作为开发者获客策略。移动商店证据又加了一层：iOS App 持续维护，Android 在 Google Play 和 AppBrain 上都有很大足迹，Android
              包含相当数量的库。这些信号合在一起，可以合理推断它是一个云托管、服务导向的商业平台，分离运行消费者、卖家和验证业务；但仍不足以证明具体云厂商、数据管道或可观测性工具。
