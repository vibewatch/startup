      - number: '8.3'
        title: 公开可比公司说明，收入支撑比交易平台光环更重要
        blocks:
          - type: paragraph
            body: >-
              公开可比公司并不完美，但仍是检验数十亿美元 GOAT 估值需要多少经济支撑的最好办法。ThredUp 约按 1.62x 收入交易，The RealReal 约 1.49x，Rent the Runway 约
              0.33x，eBay 约 4.37x。这个区间很宽，但仍比围绕二级市场兴趣的空泛挥手更有纪律。如果 GOAT 按 UpMarket 的 $3.34 billion 参考估值，用 eBay 倍数只需约 $0.76
              billion 收入支撑；但用 ThredUp 倍数约需 $2.06 billion，用 The RealReal 倍数约需 $2.24 billion，用 Rent the Runway 的受压倍数则需要超过
              $10 billion。由于抓取到的证据中，GOAT 没有公开披露当前收入，投资者无法判断这些区间中哪一个哪怕方向上正确。这就是核心承销问题。GOAT
              可能因品牌质量、交易平台地位或更好的抽佣率经济性而应高于公开转售公司，但在管理层打开账本之前，这些都只是假设。因此，公开可比公司并不能精确证明 GOAT
              被高估了多少；它们证明，当前信心应取决于私下尽调，而不是自动授予。
