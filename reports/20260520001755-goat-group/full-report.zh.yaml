              描述了一个宽广、易用的目录，Jimmy Patel 描述自己多年使用卖家功能——但同一批平台也暴露出真伪争议、退货摩擦和卖家工具宕机。实际看，GOAT
              在市场平台两端都有可见客户证明，但高度自下而上且偏轶事。证据仍有用，因为它把真实生产使用与仅列 Logo 的营销区分开；不过仅凭公开材料，投资人无法量化卖家 GMV 集中度或买家复购率。
