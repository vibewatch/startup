            body: 政策栈显示，GOAT 通过佣金、卖家费用、提现费、运费和高端服务层变现。但 Instant 商品、预付标签、买家保护和国际设施意味着，价值创造中仍有相当一部分依赖实体运营和服务执行。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI017
              - CI018
              - CI044
          - type: callout
            title: 服务水平失误是直接财务风险，不只是品牌风险
            body: FTC 发货案件重要，因为它把运营失误转化为现金罚款，并暴露 GOAT 模型中的敏感部位：买家为速度和信任付溢价。一旦发货承诺或争议处理滑坡，平台会同时损失品牌资产和利润率。
            calloutType: risk
            claimRefs:
              - CI007
              - CI019
              - CI046
          - type: callout
            title: 仅凭公开证据，当前流动性仍无法承销
            body: >-
              公开证据足以估计 GMV 和费用逻辑，也足以把 GOAT 与 eBay、The RealReal
              对比。但它不足以判断当前现金、债务、烧钱速度或现金跑道。任何严肃尽调都应先索取当前资产负债表、月度现金消耗、标准订单 vs Instant 的毛利率拆分，以及区域设施经济性，再判断资本充足性。
            calloutType: recommendation
            claimRefs:
