            body: >-
              GOAT 的变现对一家私营市场平台而言少见地可见，因为其费用和政策栈用白话列出了多层收费。核心引擎是卖家佣金，但不止于此。GOAT 还收取按路径和地区变化的卖家费用、ACH 或 PayPal 提现 2.9%
              费用、买家运费，以及 Instant 次日达等高端速度层。即使公司不披露运费和服务线有多少确认为收入、多少转付给承运商，这也形成了比简单抽佣市场平台更宽的变现栈。alias 和 Flight Club
              在这里重要，因为它们拓宽收入界面，同时不要求 GOAT 直接获取全部供给：更多卖家活动可被路由进同一套交易费用架构，并分发到多个买家端。关键限制是集中度。保留的公开证据没有显示广告、订阅或融资收入，因此 GOAT
              看起来仍高度依赖交易挂钩经济。
