      - number: '6.3'
        title: 使用、留存代理指标与反向信号
        blocks:
          - type: paragraph
            body: >-
              GOAT 不公开披露 NRR、GRR、活跃买家或客户队列，因此留存只能从代理指标推断，不能当作已知事实。最强代理指标是应用商店规模和评论密度：2 million 条 iOS 评分、10 million-plus
              次 Android 安装、AppBrain 上约 36 thousand 条 Android 评分、一个归档的 BBB
              客户评论页，以及数百条独立投诉网站评论。这些数字说明平台长期有持续公开使用，反馈界面也大到值得重视。它们也暴露出反复出现的摩擦模式。评论者反复抱怨取消、退款处理、客服缓慢、升级机制弱和鉴定争议；卖家侧 alias
              评论又补充了库存可见性和运营问题投诉。这些反向证据重要，因为它说明留存大概率并不均质：坚定球鞋玩家和活跃卖家可能继续使用平台，但服务失误很可能在边际上提高流失风险。核心限制仍是披露。公开证据证明平台活跃、分发广且仍产生新鲜反馈，但没有揭示高使用队列是在增长、稳定还是衰退。
