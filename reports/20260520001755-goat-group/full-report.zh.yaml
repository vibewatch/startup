      - number: '2.2'
        title: 规模口径：狭义球鞋转售 vs 更宽服饰和奢侈品二手电商
        blocks:
          - type: paragraph
            body: >-
              最窄的口径来自球鞋转售专业机构。PLOTT DATA 估计 2024 年全球球鞋转售市场约 $6-8B，并称美国占最大份额，欧洲和亚太构成有意义的第二层市场。ResellCalendar
              对美国市场给出类似方向判断，预计美国国内球鞋转售到 2025 年底约 $6B。相对头条全球鞋履市场，这些数字很小，但更接近 GOAT 的真实战场。


              一旦范围扩到服饰和奢侈品转售，数字会迅速放大。thredUP 当前报告预计全球二手服饰市场到 2030 年达 $393B，其 2025 年报告测算美国二手服饰市场到 2029 年达 $74B、美国线上转售到
              2029 年达 $40B。The Business Research Company 则把 2026 年全球服饰转售放在 $225.71B，奢侈品转售放在 $41.61B。BCG 和 Vestiaire
              又给出时尚与奢侈品转售口径：当下约 $210-220B，到 2030 年达 $320-360B。


              这些范围与其说矛盾，不如说是嵌套口径。做估值时，狭义球鞋转售数字更适合作为 GOAT 直接市场的基准情景；更宽的服饰和奢侈品数字，更多用于相邻扩张、品牌延展和倍数支撑。
