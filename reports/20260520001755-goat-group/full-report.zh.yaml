  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >-
              GOAT 的竞争集合不只球鞋转售。最接近的直接替代是 StockX 和 Stadium Goods，它们同样围绕信任、验证和高端球鞋需求展开。eBay
              重要，是因为它同时拥有巨大的买家流动性、免费球鞋鉴定，以及宽广的变现栈。Whatnot 争夺直播电商注意力；Vinted、Depop 和 Poshmark 通过让二手销售更便宜、更社交，对 GOAT
              形成间接压力。Nike SNKRS 和 Foot Locker 不是转售市场平台，但仍重要，因为直接发售控制和全渠道零售触达，会在转售需求落到 GOAT
              之前就分流供给和买家注意力。由此形成的格局不是单维竞争：信任深度、流动性、卖家摩擦和一方发售入口，各自构成不同优势。也意味着相关比较会随使用场景变化：经鉴定的高客单球鞋更偏向 GOAT、StockX、eBay 和
              Stadium Goods；低客单衣橱轮换或创作者带动发现，则把用户拉向 Vinted、Depop、Poshmark 和 Whatnot。
