      - number: '7.3'
        title: 合作伙伴与市场依赖正通过关税、Nike 和转售压缩传导
        blocks:
          - type: paragraph
            body: >-
              GOAT 还面对一组部分来自外部的风险，因此很难只靠更好的客服话术化解。美国关税和 de minimis 规则变化是最清晰的例子。公开海关评论和 eBay
              买家指南显示，低价值例外已经收窄，许多进口商品如今面临更广泛的关税征收和清关要求。GOAT
              自己的帮助中心现在已有专门关税板块，说明这个问题在运营上已经重要。传导机制很直接：更多关税和更多海关步骤，要么推高到岸成本，要么削弱交付可预测性，两者都会压低转化。与此同时，转售品类没有提供多少经济缓冲。WWD
              和转售分析师描述的市场中，高于零售价交易的发售占比相较 2020 年下降，许多卖家如今靠规模赚小钱，而不是靠稀缺性赚高溢价。Nike 相关渠道动态又增加了第二层依赖。Nike 正在重新校准 DTC
              策略和批发关系，但它仍掌握着驱动球鞋转售的巨大产品引力。因此，GOAT 依赖品牌发售纪律和品类热度，而这两点它无法直接控制。
