  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：正品鉴定球鞋转售，加上时尚二手电商邻近市场
        blocks:
          - type: paragraph
            body: >-
              分析 GOAT 时最容易犯的框架错误，是把它当作覆盖所有鞋履或所有时尚的公司。一级球鞋市场大得多，但那不是 GOAT 的直接变现池。GOAT 最直接参与的是带正品鉴定的球鞋转售和价格发现服务，再通过 Flight
              Club、Grailed、Sneakers.com 和卖家工具延伸到相邻二手服饰和时尚入口。因此，狭义市场最好理解为叠加鉴定、履约和策展的二级球鞋交易；更宽的相邻市场，则是服饰和奢侈品品类的数字二手电商。


              采用更宽的时尚转售视角仍有价值，因为它描述了推动 GOAT
              向前的消费者行为和平台经济。线上多品牌平台已经站在二手采用的中心，消费者动机——可负担性、独特性、买到售罄商品、转售价值——在球鞋、服饰、包袋和奢侈配饰之间相通。但这些相邻统计应作为背景，而不是 GOAT 的完整
              TAM。


              做尽调时，最干净的方法不是挑一个头条数字，而是叠三层范围：广义一级球鞋支出、狭义球鞋转售 GMV、更宽的二手时尚 / 服饰 / 奢侈品电商。这样既保留可比性，也避免夸大。
