      - number: '5.2'
        title: 卖家工具、鉴定与定价机制
        blocks:
          - type: paragraph
            body: >-
              最有差异化的公开产品细节在 alias；它充当 GOAT Group 卖家的运营控制台。官方 FAQ 和卖家政策页面显示，GOAT
              不只是开放一个固定价上架表单，而是在卖家工作流里叠加审批门槛、定价指引、基于评分的经济性和身份验证。卖家必须通过 Persona 检查；如果验证失败或卖家评分跌破阈值，可能被暂停；设置库存时还会使用 High
              Demand、Global Indicator、Lowest Price 等定价卡片。公司明确表示这些建议仅供参考，但历史销售数据、市场洞察、全球需求和买家所在地调整组合在一起，意味着 GOAT
              幕后运行着相当复杂的价格转换层。这点值得注意，因为它把鉴定、物流和变现绑在一起：卖家输出会转换成买家可见价格；一旦加入关税和运营成本，不同地区价格可能不同。单凭这些还不足以证明宽泛的 AI 护城河，但足以证明
              GOAT 有卖家专属决策支持工具，而不是裸市场平台上传体验。
