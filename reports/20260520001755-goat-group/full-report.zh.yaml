      - 模式
      - 规模 / 所有权
      - 信任机制
      - 卖家经济性
      - 战略优势
      - 局限
    rows:
      - - GOAT
        - 带鉴定的转售市场 + 联盟卖家网络
        - 通过 alias 触达 170 个国家的 50M 买家；上次披露为 2021 年 GMV $2B、估值 $3.7B
        - GOAT Buyer Protection + 鉴定查验
        - 9.5% 佣金 + 卖家费用 + 2.9% 提现费
        - GOAT、Flight Club、Sneakers.com 共同做球鞋 / 服饰策展定位
        - FTC 发货监管令与设施收缩释放执行风险信号
      - - StockX
        - 买卖报价式球鞋市场
        - 私营；PLOTT 估计占 2024 年球鞋转售 GMV 的 38-40%
        - 实物鉴定 + 符合条件订单 14 天退货
        - 7.0-9.0% 交易费 + 3% 处理费
        - 流动性、透明定价、卖家等级
        - 生活方式策展和品牌叙事弱于 GOAT
      - - eBay
        - 综合市场 + 直播电商功能
        - 2025 年 GMV $79.6B；135M 活跃买家
        - 免费球鞋 Authenticity Guarantee + 卖家保护
        - 按品类变化的费用 + 可选刊登升级 + 广告
        - 庞大买家触达与广告变现
        - 球鞋优先的策展体验较弱
      - - Stadium Goods
        - 持库存的高端精品店
        - PLOTT 估计 2024 年球鞋转售 GMV 为 $400-600M
        - 预先鉴定、可直接发货的库存
        - 已抓取来源集中未保留准确公开卖家费用
        - 即时发货和奢侈精品店品牌
        - 重库存模式，规模更窄
      - - Depop
        - 移动端社交时尚市场
