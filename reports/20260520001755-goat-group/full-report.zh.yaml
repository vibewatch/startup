    approximationNotes: 图中只展示公开点名的依赖；已审阅来源没有具体记录承运商、支付处理商和云厂商。
    claimRefs:
      - CE014
      - CE015
      - CE022
      - CE024
      - CE028
      - CE029
      - CE041
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 买家和卖家如何在 GOAT 生态中从发现走向重复使用或转售。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 买家或卖家通过应用商店、限量发售、编辑内容或品牌认知发现 GOAT、Flight Club、alias 或 Sneakers.com。
          type: input
        - id: browse
          label: 浏览 / 搜索
          detail: 买家查看新品、二手或策划库存；卖家在 alias 内扫描或搜索 SKU。
          type: process
        - id: commit
          label: 购买或上架
          detail: 买家下单；卖家获批后提交上架。
          type: process
        - id: route
          label: 经网络分流
          detail: 库存可经 GOAT 验证、可信合作伙伴直发、Instant 设施库存或 Flight Club / 关联方曝光分流。
          type: process
        - id: delivery
          label: 交付 / 提现
          detail: 买家收货；卖家在交付或寄售售出后收到收益。
          type: process
        - id: support
          label: 支持 / 问题处理
          detail: 出现真伪、运输或退款问题时，用户进入 FAQ 或提交请求流程。
          type: process
        - id: repeat
          label: 复购或流失
          detail: 满意用户可以再次购买、浏览或出售；不满意用户可能通过负面评价公开流失。
          type: output
    approximationNotes: 旅程由客服支持、应用商店和评价证据综合而成，不来自内部漏斗分析。
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU009
      - CU026
      - CU027
      - CU032
      - CU033
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: GOAT、alias 与 Flight Club 之间代表性的买家和卖家运营流。
    data:
      nodes:
        - id: buyer-app
          label: 买家安装应用或访问网页
          detail: 免费下载的应用和广泛全球配送降低漏斗顶端摩擦。
          type: input
        - id: seller-app
          label: 卖家采用 alias
          detail: 卖家安装 alias，在整个网络上架库存。
          type: input
        - id: inventory
          label: 库存进入市场平台
          detail: 零售商、精品店或获批卖家向 GOAT Group 渠道供给商品。
          type: process
        - id: verification
          label: 验证 / 直发路由
          detail: 订单路径取决于转售验证、合作伙伴直发或设施持有的 Instant 库存。
          type: process
        - id: buyer-outcome
          label: 交付和支持结果
          detail: 正面结果可推动重复浏览；糟糕支持会制造公开投诉。
          type: process
        - id: seller-outcome
          label: 提现和再投入
          detail: 卖家收到收益后，可能重新上架或寄售更多库存。
          type: output
        - id: public-feedback
          label: 公开评价层
          detail: Apple、Google Play、AppBrain 和投诉网站上的评分与评价形成可见情绪循环。
          type: output
    approximationNotes: 这是流程图，不是数字漏斗；公开资料未披露这些阶段之间的转化率。
    claimRefs:
      - CU004
      - CU008
      - CU011
      - CU013
      - CU023
      - CU026
      - CU027
      - CU032
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 各类客户证据的公开强度，以及每类来源能证明什么、不能证明什么。
    data:
      columns:
        - 可见具名用户
        - 生产使用证据
        - 结果具体性
        - 留存可见度
      rows:
        - label: App Store / Google Play 汇总评分
          values:
