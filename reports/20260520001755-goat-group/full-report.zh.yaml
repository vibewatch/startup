chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品牌组合与运营模式
        blocks:
          - type: paragraph
            body: >-
              GOAT 由 Eddy Lu 和 Daishin Sugano 于 2015 年创立，自称是面向球鞋、服饰和配饰的全球市场平台。当前官方材料仍把它描述为双边买家 /
              卖家服务，而不是纯自营零售商：使用条款定义了买家和卖家，隐私政策覆盖网站、App 和线下地点，首页显示超过 315,000 个在售商品。这样看，公司更像正品鉴定二级交易的基础设施，而不只是一个时尚前台店面。


              产品组合比旗舰 GOAT App 更宽。GOAT Group 当前招聘页称公司运营五个品牌——GOAT、Flight Club、Grailed、Sneakers.com 和 alias——服务 170 个国家超过
              60M 会员。这个品牌架构重要，因为 GOAT Group 横跨高端球鞋转售、寄售式零售、男装时尚转售、折扣鞋履和卖家工具。尤其是 alias 强化了一个判断：GOAT Group 不只是面向消费者，也为
              GOAT 和 Flight Club 上的卖家提供工作流和定价工具。


              运营模式因此是多入口、全渠道：数字市场平台、卖家工具、鉴定和履约基础设施、品牌零售。公开材料在市场平台宽度和品牌覆盖上证据最强，但按品牌拆出的当前经济性仍不清楚。
