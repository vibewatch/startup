      - number: '1.4'
        title: 里程碑、监管风险与未解尽调项
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 的里程碑显示，公司从 2015 年创立的市场平台扩张为一个带有传统零售基础设施的多品牌转售平台。Flight Club 贡献了更早的品牌资产，New York 门店可追溯到 2005
              年，Los Angeles 到 2006 年，Miami 到 2018 年。GOAT 2020 年融资稿当时记录了 13 个线下地点和 30M 会员，当前 2026 年材料把社区指标抬到超过 60M
              会员，并加入五品牌组合表述。PitchBook 和 Tracxn 也显示 2022 年收购 Grailed；虽然原始新闻稿本次无法抓取，组合扩张叙事仍得以保留。


              最关键的反向里程碑不是财务，而是监管。2024 年 12 月，FTC 要求 GOAT 支付 $2,013,527 消费者退款，并调整发货和买家保护实践，指控其发货延迟、取消 /
              退款控制薄弱，以及对瑕疵或非正品商品的补救可得性存在误导。ConsumerAffairs 记录了 GOAT 的反驳，称受影响订单占比很小，但这不改变命令本身存在。


              未解尽调项仍然重要：当前员工数在不同资料数据库之间仍不一致，独立的买家保护政策 URL 已无法公开解析，公开来源也看不到当前董事会 /
              股权结构视图。这些不足对早期章节不是致命问题，但会限制对融资、规模声明和法律状态之外封面指标的信心。
