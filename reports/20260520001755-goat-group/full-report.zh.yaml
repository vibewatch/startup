  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与地理
        blocks:
          - type: paragraph
            body: >-
              读 GOAT Group 客户群的核心难点在于，公司披露了一个很大的社区指标，却没有披露其下方的运营转化层。公司文案现在指向覆盖 170 个国家、超过 60M 的会员，消费 App 也承诺买家保护并发货到超过
              170 个国家。这些信号明确支持全球认知和广泛触达，但没有告诉我们其中有多少是活跃买家、复购买家或已变现卖家。公开分层仍来自产品界面，而不是已披露客户表：GOAT 仍是高端和收藏属性更重的市场平台，Flight
              Club 提供实体寄售零售，alias 是专用卖家控制台，Sneakers.com 把漏斗延伸到日常球鞋消费者。这套组合设计意味着几类重叠客户——收藏者、高端时尚买家、寄售方、零售商、精品店和低 AOV
              重性价比买家——但没有披露它们各自的收入占比。线上发货触达与 Flight Club 实体足迹结合，说明地域覆盖是线上线下混合的，但公开材料仍没有给出国家级客户结构。
