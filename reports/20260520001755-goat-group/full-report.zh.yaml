      - number: '7.4'
        title: 正确尽调姿态是设定否决条件和运营证据，而不是泛泛仰慕品牌
        blocks:
          - type: paragraph
            body: >-
              现有风险没有一个迫使投资者立刻归零。GOAT
              规模仍大、分布全球，也仍有足够相关性吸引买家和卖家。但公开记录并不能支持一种轻松判断：只因为公司仍有规模，信任问题就已经解决。最有用的纪律因此是明确否决条件。如果延迟发货或真伪争议开始在投诉渠道再次上升，如果关税转嫁开始扭曲转化率和退款率，或如果品牌组合进一步偏离历史上支撑转售需求的品类，下行速度可能比高层次
              GMV
              叙事暗示的更快。公司公开材料显示了真实缓释：客服入口存在，反欺诈检查存在，平台规则也写得清楚。缺失的是证据：这些控制如今是否始终足够强，能防止监管机构、承运商、海关摩擦和客户重新撕开同样的伤口。从投资角度看，GOAT
              应被当作一个已经有规模、但运营上仍脆弱的交易平台来监控；其价值取决于能否避免信任、物流和跨境复杂度同时叠加。
