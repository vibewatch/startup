            body: >-
              扩张可见，集中度不可见。GOAT Group 2026 年 3 月推出 Sneakers.com，明确是要从收藏者和高端消费者拓宽到更重性价比的日常购物者；公司也仍维持 GOAT、Flight Club 和
              Sneakers.com 之间的跨品牌卖家分发。纸面上，这是可信的落地后扩张机制。与此同时，Complex 在 2025 年末报道称，GOAT 正在关闭 Hong Kong、Japan 和 UK
              设施，并把受影响的 Alias 库存退还给卖家；这说明国际运营并不是简单单向扩张故事。最重要的剩余未知是集中度。公开来源没有量化头部卖家的 GMV
