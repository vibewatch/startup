  - id: FI001
    title: 收入模型桥
    type: flow
    summary: GOAT 的卖家和买家活动如何转化为交易费收入、附加服务费，再进入一组公开信息只部分可见的成本堆栈。
    approximationNotes: GOAT GMV 根据第三方市场数据估计，并用公开费率表转换。净收入确认与转嫁型配送收入的处理未公开披露。
