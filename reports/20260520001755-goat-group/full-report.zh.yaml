      - number: '3.3'
        title: 护城河持久性
        blocks:
          - type: paragraph
            body: >-
              GOAT 地位中最有防御性的部分，是它把经鉴定的转售供给聚合到多个关联需求端，同时仍筛选卖家并支持买家保护索赔。alias 给 GOAT 的销售面比单一店面更宽，Flight Club 迁入 alias
              也提高了卖家留在集团网络内的概率。PLOTT 仍把 GOAT 放在全球球鞋转售份额第一梯队，这也对公司有利。但同一组证据也说明，护城河不应被夸大。eBay 的流动性规模完全不同，Nike
              控制一级发售供给，Vinted 或 Depop 可在相邻时尚品类用更低卖家摩擦压制 GOAT。因此，GOAT 的优势在高端、信任敏感品类最强；在这些品类里，鉴定、策展和多品牌受众质量比绝对最低费用更重要。
