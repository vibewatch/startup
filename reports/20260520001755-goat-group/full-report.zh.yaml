      - - 关税 / 海关摩擦
        - 跨境费用或扣留时间大幅上升
        - 核心线路上关税转嫁、海关延误或承运商收费意外增加
        - 下调国际转化假设，并复核单位经济韧性。
      - - 品类热度流失
        - 核心品牌转售价差进一步压缩
        - 更多发售价格处于或低于零售价，卖家上平台的激励变弱
        - 下调 GMV 和抽佣率预期，并重新审视估值支撑。
    notes: 否决标准故意设置为可观察，投资者可以在信任冲击完全传导到 GMV 前更新判断。
    claimRefs:
      - CR016
      - CR018
      - CR022
      - CR023
      - CR035
