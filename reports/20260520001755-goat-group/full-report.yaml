  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: authenticated sneaker resale plus fashion-recommerce adjacency'
        blocks:
          - type: paragraph
            body: >-
              The key framing mistake in GOAT analysis is to treat the company as if it addresses all footwear or all
              fashion. The primary sneaker market is much larger, but that is not GOAT's direct monetization pool. GOAT
              participates most directly in authenticated sneaker resale and price-discovery services, then extends into
              adjacent secondhand apparel and fashion surfaces through Flight Club, Grailed, Sneakers.com, and seller
              tooling. That means the narrow market is best understood as secondary sneaker commerce with
              authentication, fulfillment, and curation attached, while the broader adjacency is digital recommerce
              across apparel and luxury categories.


              Using broader fashion-resale lenses is still useful, because they describe the customer behavior and
              platform economics that pull GOAT forward. Online multibrand platforms now sit at the center of secondhand
              adoption, and customer motivations—affordability, uniqueness, access to sold-out items, and resale
              value—carry across sneakers, apparel, bags, and luxury accessories. But those adjacent statistics should
              be read as context, not as GOAT's full TAM.


              For diligence, the cleanest approach is to stack three scopes instead of picking one headline number:
              broad primary sneaker spend, narrow sneaker resale GMV, and broader secondhand fashion/apparel/luxury
              recommerce. That preserves comparability and avoids overclaiming.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
              - CM011
              - CM016
