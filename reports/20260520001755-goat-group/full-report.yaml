      - number: '7.3'
        title: Partner and market dependencies now transmit through tariffs, Nike, and resale compression
        blocks:
          - type: paragraph
            body: >-
              GOAT also faces a risk stack that is partly external and therefore harder to manage away with better
              support scripts. U.S. tariff and de minimis changes are the clearest example. Public customs commentary
              and eBay's buyer guidance show that low-value exceptions have narrowed and that many imported goods now
              face broader duty collection and customs clearance requirements. GOAT's own support center now carries a
              dedicated tariff section, which suggests the issue is already operationally material. The transmission
              mechanism is straightforward: more duties and more customs steps create either higher landed cost or worse
              delivery predictability, both of which reduce conversion. At the same time, the resale category is not
              offering much economic cushion. WWD and resale analysts describe a market where the share of releases
              trading above retail has fallen versus 2020 and where many sellers now earn small volume-driven profits
              instead of large scarcity-driven premiums. Nike-related channel dynamics add a second dependency. Nike is
              recalibrating its DTC strategy and wholesale relationships, but it still controls a huge share of the
              underlying product gravity that drives sneaker resale. GOAT is therefore dependent on brand release
              discipline and category heat that it does not control directly.
