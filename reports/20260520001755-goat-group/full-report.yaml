      - number: '8.2'
        title: 'Price context: GOAT looks roughly flat to down versus 2021, while private-comp signals remain noisy'
        blocks:
          - type: paragraph
            body: >-
              The most practical way to frame GOAT's current price is against its own history and against the nearest
              private resale comparables. GOAT's 2021 mark was $3.7 billion on $195 million of new capital and $2
              billion of disclosed GMV. UpMarket's current model at $3.34 billion is only about ten percent below that
              primary mark, which means the visible private reset is modest rather than dramatic. Nasdaq Private
              Market's $3.54 share-price estimate points in the same direction of continued market relevance, but it is
              not enough to produce a company valuation because the fully diluted share count is not public in the
              evidence set. StockX makes the comparability problem even clearer. Its 2021 primary value was $3.8
              billion, yet current secondary references vary materially by provider, from richer modeled marks to much
              more conservative third-party estimates. That dispersion is normal in illiquid private names, but it means
              investors should resist false precision. Vestiaire Collective is directionally useful at a $1.64 billion
              current Tracxn value, yet it is a luxury-resale platform rather than a pure sneaker-led marketplace. The
              takeaway is that GOAT sits in a credible but still under-disclosed private bucket where headline price
              references exist, but none are strong enough to make the current mark feel obviously cheap.
            claimRefs:
