      - number: '6.4'
        title: Expansion and concentration dynamics
        blocks:
          - type: paragraph
            body: >-
              Expansion is visible, concentration is not. GOAT Group's March 2026 launch of Sneakers.com is a clear move
              to broaden beyond collectors and premium consumers toward a more value-oriented everyday shopper, and the
              company still maintains cross-brand seller distribution across GOAT, Flight Club and Sneakers.com. Those
              are credible land-and-expand mechanics on paper. At the same time, Complex reported in late 2025 that GOAT
              was shutting facilities in Hong Kong, Japan and the UK and returning affected Alias inventory to sellers,
              which suggests international operations have not been a simple one-way expansion story. The most important
              remaining unknown is concentration. Public sources do not quantify GMV concentration in top sellers,
              revenue concentration by geography or the split between partner inventory, peer resale and value-oriented
              new buyers. That omission is material because a two-sided marketplace can look globally diverse at the
              community level while still depending heavily on a narrower set of sellers, regions or premium categories
              for economics.
