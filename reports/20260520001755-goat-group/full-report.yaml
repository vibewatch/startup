companyProfile:
  summary: >-
    GOAT Group is a Los Angeles-based private marketplace operator founded in 2015 by Eddy Lu and Daishin Sugano. The
    company built GOAT around authenticated sneaker resale, then expanded into a broader multi-brand portfolio that now
    includes Flight Club retail consignment, Grailed fashion resale, alias seller tooling, and Sneakers.com for more
    value-oriented footwear discovery. Public evidence confirms global brand reach and continuing relevance, but the
    company remains materially under-disclosed on current financials, governance, and cap-table detail.
