  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      GOAT's top residual risks cluster around legal-trust exposure, cross-border friction, and category-level resale
      compression.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: FTC / buyer-promise relapse
          values:
            - label: medium
              tone: warning
              detail: The core conduct has already been enforced once.
            - label: critical
              tone: negative
              detail: A repeat would damage trust and invite further scrutiny.
            - label: medium
              tone: warning
              detail: Policies exist but public proof of sustained control is thin.
            - label: high
              tone: negative
              detail: Residual legal-trust exposure remains the top-ranked risk.
        - label: Authentication miss or dispute
          values:
            - label: medium
              tone: warning
              detail: Not every item is physically examined.
            - label: high
              tone: negative
              detail: A trust marketplace breaks quickly when fake-item claims spread.
            - label: medium
              tone: warning
              detail: Multiple verification modes help but do not eliminate edge cases.
            - label: high
              tone: negative
              detail: Residual severity stays high because trust is the product.
        - label: Cross-border tariff friction
          values:
            - label: high
              tone: negative
              detail: Policy changes are already live in 2025-2026.
            - label: high
              tone: warning
              detail: Friction can hit both conversion and delivery experience.
            - label: low-medium
              tone: warning
              detail: GOAT has support content but not public corridor metrics.
            - label: high
              tone: negative
              detail: International complexity can compound with weaker market demand.
        - label: Resale premium compression
          values:
            - label: high
              tone: negative
              detail: Public category commentary already shows lower premium rates.
            - label: medium-high
              tone: warning
              detail: Smaller seller profits can reduce supply quality and urgency.
            - label: low-medium
              tone: warning
              detail: GOAT cannot directly control category-wide supply and demand.
            - label: medium-high
              tone: warning
              detail: This is painful but still below the severity of trust failure.
        - label: Price competition and partner dependence
          values:
            - label: medium-high
              tone: warning
              detail: GOAT remains large but not dominant versus StockX and others.
            - label: medium-high
              tone: warning
              detail: Competitive fees or price gaps can slow conversion on hot releases.
            - label: medium
              tone: warning
              detail: Used inventory and curation provide some offset.
            - label: medium
              tone: warning
              detail: Manageable unless combined with trust or customs shocks.
    approximationNotes: Ordinal scores are source-backed ranking judgments rather than synthetic probabilities.
    claimRefs:
      - CR001
      - CR008
      - CR016
      - CR018
      - CR022
      - CR028
      - CR030
      - CR035
      - CR036
      - CR045
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Trust failures and tariff friction reach valuation through customer conversion, seller supply, and refund burden.
    data:
      nodes:
        - id: trust
          label: Trust failure
          detail: Shipping, authenticity, and refund disputes weaken buyer confidence.
          tone: warning
        - id: tariffs
          label: Tariff friction
          detail: Higher duties and customs complexity raise landed cost and delivery uncertainty.
          tone: warning
        - id: support
          label: Support burden
          detail: Slow case handling magnifies every operational error.
          tone: warning
        - id: buyers
          label: Buyer conversion
          detail: Customers become more price-sensitive and less tolerant of surprises.
          tone: warning
        - id: sellers
          label: Seller enthusiasm
          detail: Small margins and poor dispute handling reduce listing quality and depth.
          tone: warning
        - id: gmv
          label: GMV durability
          detail: Lower conversion and weaker supply slow marketplace throughput.
          tone: negative
        - id: margin
          label: Margin pressure
          detail: Refunds, support cost, and lower take-rate compress economics.
          tone: negative
        - id: valuation
          label: Valuation downside
          detail: Marketplace value falls if trust and throughput weaken together.
          tone: negative
      edges:
        - from: trust
          to: support
        - from: trust
          to: buyers
        - from: tariffs
          to: buyers
        - from: tariffs
          to: support
        - from: support
          to: margin
        - from: buyers
          to: gmv
        - from: sellers
          to: gmv
        - from: gmv
          to: valuation
        - from: margin
          to: valuation
        - from: trust
          to: sellers
    approximationNotes: The graph is qualitative and intended to show causal direction rather than numerical weighting.
    claimRefs:
      - CR013
      - CR019
      - CR024
      - CR031
      - CR034
      - CR035
      - CR036
      - CR037
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: GOAT depends on brands, sellers, logistics, and customs actors that it does not fully control.
    data:
      nodes:
        - id: nike
          label: Nike / major brands
          detail: Set the product gravity and scarcity backdrop for core sneaker demand.
          tone: warning
        - id: sellers
          label: Seller network
          detail: Provide inventory breadth and condition quality.
          tone: warning
        - id: goat
          label: GOAT operating core
          detail: Authentication, support, merchandising, and payments.
          tone: neutral
        - id: customs
          label: Customs / tariff regime
          detail: Determines duties, clearance steps, and delay risk.
          tone: warning
        - id: carriers
          label: Logistics partners
          detail: Handle delivery execution and some fee collection.
          tone: warning
        - id: buyers
          label: Buyers
          detail: Need confidence in price, authenticity, and delivery.
          tone: neutral
        - id: stockx
          label: Competitive benchmark
          detail: Alternative venue shaping price transparency and switching behavior.
          tone: warning
      edges:
        - from: nike
          to: buyers
        - from: nike
          to: sellers
        - from: sellers
          to: goat
        - from: customs
          to: goat
        - from: carriers
          to: goat
        - from: goat
          to: buyers
        - from: stockx
          to: buyers
        - from: stockx
          to: sellers
    approximationNotes: The map highlights counterparties and system nodes, not legal control boundaries.
    claimRefs:
      - CR020
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR034
      - CR045
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: GOAT's scale and relevance are real, but the current price still outruns what public disclosure can support.
    data:
      nodes:
        - id: scale
          label: Real marketplace scale
          detail: GOAT disclosed $2B GMV, 30M members, and 600K sellers at its last round.
          tone: positive
        - id: current
          label: Current price references exist
          detail: UpMarket and NPM still publish current GOAT pages, so the name is not stale.
          tone: positive
        - id: opaque
          label: Disclosure remains thin
          detail: Current revenue, margins, and fully diluted share count are not public in the fetched set.
          tone: warning
        - id: comps
          label: Public comps are modest
          detail: Most public resale comps trade at only 0.3x-1.6x revenue.
          tone: warning
        - id: decision
          label: Avoid
          detail: Do not add new money at a roughly $3.3B-$3.7B reference without private diligence.
          tone: negative
      edges:
        - from: scale
          to: current
        - from: current
          to: decision
        - from: opaque
          to: decision
        - from: comps
          to: decision
    approximationNotes: null
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV030
      - CV031
      - CV039
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      A $3.34B GOAT mark only looks comfortable if investors assume very strong revenue support or a premium marketplace
      multiple.
    data:
      items:
        - label: Revenue needed at 0.33x
          value: 10.12
          detail: USD billions needed to support $3.34B at Rent the Runway's current multiple.
          tone: negative
        - label: Revenue needed at 1.49x
          value: 2.24
          detail: USD billions needed to support $3.34B at The RealReal's current multiple.
          tone: warning
        - label: Revenue needed at 1.62x
          value: 2.06
          detail: USD billions needed to support $3.34B at ThredUp's current multiple.
          tone: warning
        - label: Revenue needed at 4.37x
          value: 0.76
          detail: USD billions needed to support $3.34B at eBay's current multiple.
          tone: positive
    approximationNotes: >-
      Sensitivity bars are simple market-cap-to-revenue bridges using cited public-comp multiples, not discounted cash
      flow outputs.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: The current evidence supports a wide range, but the midpoint still sits below the current visible GOAT reference.
    data:
      items:
        - label: Bear case
          low: 0.9
          mid: 1.2
          high: 1.5
          displayValue: $0.9B-$1.5B
          detail: Public-comp compression plus weak current economics support a sharp reset.
          tone: negative
        - label: Base case
          low: 1.9
          mid: 2.2
          high: 2.5
          displayValue: $1.9B-$2.5B
          detail: GOAT stays relevant but is valued closer to stronger public resale comps.
          tone: warning
        - label: Bull case
          low: 4
          mid: 4.8
          high: 5.5
          displayValue: $4.0B-$5.5B
          detail: Better-than-feared revenue quality and improved disclosure preserve a premium marketplace mark.
          tone: positive
    approximationNotes: >-
      Ranges are scenario outputs for IC discussion anchored to current visible GOAT references, not management
      guidance.
    claimRefs:
      - CV031
      - CV032
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: GOAT scores well on market relevance and poorly on current evidence quality and valuation support.
    data:
      items:
        - label: Market relevance
          score: 7
          detail: The company still has active secondary pages and a meaningful brand footprint.
          tone: positive
        - label: Historical proof
          score: 7
          detail: The 2021 round disclosed real GMV, members, and seller scale.
          tone: positive
        - label: Private-comp support
          score: 6
          detail: StockX and Vestiaire show resale assets can still hold meaningful private values.
          tone: warning
        - label: Public-comp support
          score: 4
          detail: Public resale multiples are mostly modest and do not make the current mark feel cheap.
          tone: negative
        - label: Disclosure quality
          score: 3
          detail: Current revenue, margin, and share-count disclosure remain missing.
          tone: negative
        - label: Risk-adjusted price
          score: 3
          detail: Current visible entry references do not clearly pay investors for opacity.
          tone: negative
        - label: Evidence quality
          score: 5
          detail: There is enough evidence to avoid, but not enough to buy with conviction.
          tone: warning
    approximationNotes: >-
      Scores are ordinal IC heuristics based on the source-backed evidence in this chapter rather than a weighted
      quantitative model.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV030
      - CV031
      - CV034
      - CV036
      - CV037
      - CV042
