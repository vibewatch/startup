  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      How GOAT's seller and buyer activity converts into transaction-fee revenue, ancillary service fees, and then into
      a cost stack that is only partially visible publicly.
    approximationNotes: >-
      GOAT GMV is estimated from third-party market data and converted through published fee schedules. Net revenue
      recognition versus pass-through shipping is not publicly disclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
      - CI013
      - CI014
      - CI015
    data:
      nodes:
        - id: seller-supply
          label: Approved sellers + buyer demand
          description: GOAT admits only approved sellers and distributes listings across GOAT Group surfaces.
        - id: gmv
          label: GMV (2024E $2.0-2.5B)
          description: PLOTT estimate for GOAT's annual sneaker-resale transaction volume.
        - id: commission
          label: Commission revenue (9.5%-12.4% headline)
          description: Seller commission captured on completed transactions, before seller-fee variability.
        - id: seller-fees
          label: Seller fee + cash-out fee
          description: Fixed seller-fee schedule by route/location plus 2.9% cash-out charge on ACH/PayPal payouts.
        - id: buyer-fees
          label: Buyer shipping + Instant / priority charges
          description: Buyer-paid shipping and expedited-service charges on eligible orders.
        - id: gross-revenue
          label: Revenue proxy ($190-310M)
          description: GMV translated through published fee layers; not an audited revenue figure.
        - id: cost-stack
          label: Authentication / shipping / refund cost stack
          description: Inspection labor, shipping labels, facilities, payment processing, refunds, and compliance.
        - id: contribution
          label: Contribution margin unknown
          description: Public sources do not disclose GOAT's gross margin or EBITDA.
      edges:
        - from: seller-supply
          to: gmv
          label: Transactions occur
        - from: gmv
          to: commission
          label: Commission applied
        - from: gmv
          to: seller-fees
          label: Seller payout layer
        - from: gmv
          to: buyer-fees
          label: Buyer service charges
        - from: commission
          to: gross-revenue
          label: Added to proxy
        - from: seller-fees
          to: gross-revenue
          label: Added to proxy
        - from: buyer-fees
          to: gross-revenue
          label: Added / offset by carrier cost
        - from: gross-revenue
          to: cost-stack
          label: Operations funded
        - from: cost-stack
          to: contribution
          label: Net after costs
