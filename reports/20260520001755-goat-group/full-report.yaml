  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and trust risk is now documented, not hypothetical
        blocks:
          - type: paragraph
            body: >-
              GOAT's core risk is no longer whether a resale marketplace could in theory disappoint buyers; the FTC
              already documented where public promises and actual execution diverged. The December 2024 order matters
              because it ties shipping-performance failures to consumer-protection remedies and explicitly reaches
              GOAT's Buyer Protection and authenticity claims. That is a much more serious signal than a single bad
              quarter of customer service. It means the company has already crossed the threshold from reputational
              irritation to formal enforcement. The company has since kept buyer-protection, authenticity, and terms
              pages live, which is a mitigation because investors can inspect the stated controls. But those same pages
              still show frictions that matter: claims must be raised quickly, approved returns default to GOAT Credit
              unless buyers ask otherwise, and some products can be authenticated without physical examination. Those
              features may be operationally reasonable, yet they leave residual room for disputes when customers believe
              an item is fake, materially different, or simply not worth reordering from the platform. The live Trippy
              Goat docket is not existential by itself, but it reinforces the broader point that GOAT remains exposed to
              legal and trademark cleanup beyond the FTC matter.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
