  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Current economics remain undisclosed
        - Management still does not open current revenue, take-rate, and margin data in diligence.
        - Investors keep paying for opacity rather than evidence.
        - Do not add capital at the current visible mark.
      - - Secondary marks diverge further
        - Provider spread widens or the more conservative signals keep falling.
        - Private-market price discovery looks weaker, not stronger.
        - Use the lower end of the range as the practical underwriting anchor.
      - - Public resale multiples stay muted
        - ThredUp / RealReal / RENT do not rerate meaningfully.
        - The bridge from public comps to a multi-billion-dollar GOAT mark remains fragile.
        - Keep downside scenarios dominant in the model.
      - - GMV scale fails to convert into revenue quality
        - Private diligence shows low take rate, thin margin, or heavy working-capital strain.
        - Marketplace scale stops justifying premium value.
        - Move to a hard avoid or require a much lower entry.
      - - Cross-border or trust friction re-accelerates
        - Risk chapter kill criteria start hitting at the same time valuation evidence stays thin.
        - Operational stress and valuation fragility compound.
        - Treat valuation downside and business-risk downside as linked, not separate.
    notes: Kill triggers are designed to invalidate the bullish bridge from brand quality to valuation support.
    claimRefs:
      - CV007
