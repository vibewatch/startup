      - number: '3.3'
        title: Moat durability
        blocks:
          - type: paragraph
            body: >-
              The most defensible part of GOAT's position is that it aggregates authenticated resale supply across
              multiple affiliated demand surfaces while still screening sellers and supporting buyer-protection claims.
              alias gives GOAT a broader selling surface than a single storefront, and Flight Club's migration into
              alias increases the odds that sellers stay inside the group's network. GOAT also benefits from the fact
              that PLOTT still places it in the top tier of global sneaker resale share. But the same evidence set also
              shows why the moat should not be overstated. eBay operates at a wholly different liquidity scale, Nike
              controls primary release supply, and Vinted or Depop can undercut GOAT on seller friction in adjacent
              fashion categories. GOAT's advantage is therefore strongest in premium, trust-sensitive categories where
              authentication, curation, and multi-brand audience quality matter more than the absolute lowest fees.
