      - number: '8.4'
        title: 'Scenario logic: the downside is easier to explain than the upside at today''s visible marks'
        blocks:
          - type: paragraph
            body: >-
              A reasonable bull case for GOAT is not impossible. If the company has sustained strong revenue conversion
              on top of its marketplace scale, if cross-border friction proves manageable, and if investors ultimately
              value it closer to a premium marketplace than to the weaker public resale set, then an outcome above the
              current modeled value is possible. But public evidence does not make that case easy. The downside case is
              easier to explain because it needs fewer heroic assumptions: a continued lack of disclosure, public-comp
              multiples that stay muted, and only modestly positive secondary-market signals are enough to support a
              materially lower mark than 2021. That is why the scenario table in this chapter still skews negatively
              relative to the current entry reference. A bear case near $1.2 billion and a base case near $2.2 billion
              both follow naturally from public-market compression and uncertain current economics, while a bull case
              near $4.8 billion requires investors to assume better revenue scale and quality than the current evidence
              reveals. The decision therefore turns less on whether GOAT can build a good business and more on whether
              investors are being paid for the opacity. At today's visible range, they are not.
            claimRefs:
