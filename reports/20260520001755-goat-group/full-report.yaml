      - number: '7.4'
        title: The right diligence posture is kill criteria and operating proof, not generic brand admiration
        blocks:
          - type: paragraph
            body: >-
              None of the current risks force an immediate zero. GOAT remains large, globally distributed, and still
              relevant enough to attract both buyers and sellers. But the public record does not justify a relaxed view
              that the trust problem is solved just because the company still has scale. The most useful discipline is
              therefore explicit kill criteria. If late shipping or authenticity disputes begin to rise again across
              complaint channels, if tariff pass-through starts to distort conversion and refund rates, or if brand mix
              shifts further away from the categories that historically sustained resale demand, the downside can move
              faster than a high-level GMV narrative suggests. The company's public materials show real mitigations:
              support surfaces exist, anti-fraud checks exist, and platform rules are clearly spelled out. What is
              missing is evidence that these controls are now consistently strong enough to keep regulators, carriers,
              customs friction, and customers from re-opening the same wounds. For investment purposes, GOAT should
              therefore be monitored like a scaled but still operationally fragile marketplace whose value depends on
              keeping trust, logistics, and cross-border complexity from compounding at the same time.
            claimRefs:
              - CR020
