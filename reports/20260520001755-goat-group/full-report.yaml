      - number: '1.4'
        title: Milestones, regulatory risk, and unresolved diligence items
        blocks:
          - type: paragraph
            body: >-
              GOAT Group's milestones show a company that expanded from a 2015-founded marketplace into a multi-brand
              resale platform with legacy retail infrastructure. Flight Club contributes older brand heritage, with the
              New York store dating to 2005, Los Angeles to 2006, and Miami to 2018. GOAT's 2020 funding release
              documented 13 physical locations and 30 million members at that time, while current 2026 materials lift
              the community metric to more than 60 million members and add the five-brand portfolio framing. PitchBook
              and Tracxn also show a 2022 Grailed acquisition, preserving the portfolio-expansion story even though the
              original news article was not fetchable in this run.


              The key adverse milestone is regulatory, not financial. In December 2024 the FTC required GOAT to pay
              $2,013,527 in consumer refunds and change shipping and buyer-protection practices, alleging late shipment
              performance, weak cancellation/refund controls, and misrepresentation of remedy availability for deficient
              or inauthentic goods. ConsumerAffairs recorded GOAT's rebuttal that the affected share of orders was
              small, but that does not remove the fact of the order.


              Unresolved diligence items remain material: exact current headcount still differs across profile
              databases, a standalone buyer-protection-policy URL no longer resolves publicly, and a current
              board/cap-table view is absent from accessible sources. Those are not fatal to an early chapter, but they
              do limit confidence in cover metrics beyond funding, scale claims, and legal status.
