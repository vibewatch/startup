      - number: '6.3'
        title: Usage, retention proxies and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Because GOAT does not publicly disclose NRR, GRR, active buyers or customer cohorts, retention must be
              inferred from proxies rather than treated as known. The strongest proxies are app-store scale and review
              density: 2 million iOS ratings, 10 million-plus Android installs, roughly 36 thousand Android ratings on
              AppBrain, an archived BBB customer-review page and hundreds of independent complaint-site reviews. Those
              numbers demonstrate sustained public usage over time and a feedback surface large enough to matter. They
              also expose a recurring pattern of friction. Reviewers repeatedly complain about cancellations, refund
              handling, slow support, weak escalation and authentication disputes; seller-side alias reviews add
              inventory visibility and operational-bug complaints. That adverse evidence matters because it suggests
              retention is probably heterogeneous: committed sneakerheads and active sellers may keep using the
