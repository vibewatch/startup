  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model and take-rate logic
        blocks:
          - type: paragraph
            body: >-
              GOAT's monetization is unusually visible for a private marketplace because its fee and policy stack lays
              out multiple fee layers in plain language. The core engine is seller commission, but it is not the only
              one. GOAT also charges seller fees that vary by route and geography, a 2.9% cash-out fee on ACH or PayPal
              payouts, buyer shipping charges, and premium speed layers such as Instant next-day delivery. That creates
              a broader monetization stack than a simple take-rate marketplace, even if the company does not disclose
              how much of the shipping and service line is recognized as revenue versus passed through to carriers.
              alias and Flight Club matter here because they broaden the revenue surface without requiring GOAT to
              acquire all supply directly: more seller activity can be routed into the same transaction-fee architecture
              across multiple buyer endpoints. The crucial caveat is concentration. The retained public evidence does
              not show advertising, subscription, or financing revenue, so GOAT still appears heavily dependent on
              transaction-linked economics.
