      - number: '2.3'
        title: Buyer and seller segments
        blocks:
          - type: paragraph
            body: >-
              The buyer base is not monolithic. In sneakers, there is still a collector and hype-driven segment that
              cares about scarcity, release calendars, and resale value, but a growing share of demand is more
              pragmatic: buyers chasing style at lower price points, women's signature models, retro runners, or access
              to sold-out pairs without paying primary-market luck tax. In apparel and luxury, the segment map stretches
              further—from aspirational consumers using resale as an affordable entry point, to affluent consumers using
              it for wardrobe refinement, to sellers monetizing closets or funding future purchases.


              BCG and Vestiaire are especially useful for understanding segment behavior. They show secondhand is
              already deeply embedded in wardrobes, with online multibrand platforms taking more than half of purchases,
              Gen Z using resale for discovery and self-expression, and U.S. buyers behaving more transactionally around
              price while European buyers lean more toward curation. thredUP and its 2025 survey work add that Gen Z and
              Millennials plan to allocate far more of their apparel budgets to secondhand than older cohorts.


              For GOAT specifically, this means the company sells into both collectible and value-oriented demand. It
              also means seller liquidity matters almost as much as buyer traffic, because extra-income and
              wardrobe-detox motives are what keep inventory turning.
