company:
  name: GOAT Group
chapter:
  number: 3
  title: Competitors
  summary: GOAT Group sits between premium authenticated sneaker marketplaces and much larger social-fashion or first-party channels. The evidence suggests GOAT's moat is real in curated authenticated resale and cross-brand seller reach, but it is pressured simultaneously by eBay's liquidity, Nike's supply control, and low-friction fee models from Vinted and Depop.
sections:
- id: landscape-overview
  title: Landscape overview
  body: 'GOAT''s competitive set is broader than just sneaker resale. Its closest direct substitutes are StockX and Stadium Goods, which also center trust, verification, and premium sneaker demand. eBay matters because it combines huge buyer liquidity with free sneaker authentication and a broad monetization stack. Whatnot competes for attention in live commerce, while Vinted, Depop, and Poshmark pressure GOAT indirectly by making secondhand selling cheaper and more social. Nike SNKRS and Foot Locker are not resale marketplaces, but they still matter because direct release control and omnichannel retail reach can divert both supply and buyer attention before resale demand ever lands on GOAT. The resulting landscape is not one-dimensional: trust depth, liquidity, seller friction, and first-party release access all create different competitive advantages. It also means the relevant comparison changes by use case: authenticated high-ticket sneakers lean toward GOAT, StockX, eBay, and Stadium
    Goods, while lower-ticket wardrobe rotation or creator-led discovery pulls users toward Vinted, Depop, Poshmark, and Whatnot.'
