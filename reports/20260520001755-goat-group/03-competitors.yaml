- id: economics-and-trust
  title: Economics and trust comparison
  body: 'GOAT is not winning by being the cheapest channel. Its published economics stack seller commission, seller fees, and cash-out fees, then separately charges buyers shipping and premium fulfillment options. StockX offers a similarly monetized authenticated model, but high-volume sellers can reach lower transaction fees than GOAT''s standard commission. eBay absorbs sneaker authentication as a free buyer service and can support that choice with far larger GMV and an advertising business that GOAT has not publicly disclosed. On the other end of the spectrum, Vinted and Depop minimize or eliminate seller fees in key geographies and instead place more of the economics on buyers or payment processing. Whatnot occupies a different middle ground: a live-social marketplace that monetizes via commission and payment processing but relies on post-order buyer protection rather than pre-authenticated inventory. These differences matter because buyer trust and seller friction are not funded the
    same way across the set.'
