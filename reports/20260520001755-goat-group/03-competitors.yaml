- id: risk-register
  title: Moat erosion risks
  body: 'Two risks stand out. First, GOAT''s trust moat depends on execution. The FTC shipping order shows that if service promises slip, the same buyers who pay GOAT''s fee premium can quickly question whether the platform deserves that premium. Second, the international facility pullback reported by Complex suggests the physical part of GOAT''s model still carries meaningful fixed-cost and service-complexity risk outside core markets. Those issues make GOAT more exposed than fee-light social marketplaces during downturns. At the same time, the competitor set confirms that the moat is not disappearing overnight. StockX still lacks GOAT''s broader lifestyle curation, Vinted and Depop remain weak on premium sneaker authentication, and Whatnot competes more on format than on verified sneaker inventory. The right conclusion is that GOAT''s moat is durable but conditional: it holds when trusted fulfillment and multi-brand reach work smoothly, and erodes fastest when execution failures force
    buyers and sellers to re-evaluate the fee tradeoff. In practice, that means investors should treat service-level reliability and facility productivity as core moat indicators rather than back-office metrics.'
