callouts:
- calloutType: strength
  title: GOAT's strongest moat is aggregated authenticated demand, not lowest price
  body: GOAT can route seller supply across alias, GOAT, Flight Club, and Sneakers.com, which is a real distribution asset. But the retained evidence does not support a claim that GOAT is the cheapest place to sell; Vinted and Depop are structurally lower-friction, while StockX can be cheaper for high-volume sellers.
  claimRefs:
  - CP001
  - CP002
  - CP005
  - CP011
  - CP024
  - CP029
- calloutType: risk
  title: eBay and Nike are the structurally hardest threats to dislodge
  body: eBay owns far more buyer liquidity and can subsidize trust features through advertising and take-rate scale, while Nike SNKRS controls first-party release supply before resale demand even forms. GOAT can win on curation and authenticated experience, but it does not control either the largest demand pool or the primary supply source.
  claimRefs:
  - CP016
  - CP017
  - CP018
  - CP038
  - CP043
- calloutType: insight
  title: GOAT's moat is durable only if trust execution stays clean
  body: The competitive set shows that buyers can choose low-fee social-fashion platforms, high-liquidity marketplaces, or brand-native channels. GOAT's differentiator is trusted authenticated fulfillment; the FTC shipping action and the international-facility pullback therefore matter disproportionately because they attack the same trust surface that justifies GOAT's higher fee burden.
  claimRefs:
  - CP031
  - CP041
  - CP042
  - CP043
