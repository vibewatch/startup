tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Platform
  - Model
  - Scale / ownership
  - Trust mechanism
  - Seller economics
  - Strategic edge
  - Limitation
  rows:
  - - GOAT
    - Authenticated resale marketplace + affiliate seller network
    - 50M buyer reach across 170 countries via alias; last disclosed $2B GMV and $3.7B valuation in 2021
    - GOAT Buyer Protection + authenticated inspection
    - 9.5% commission + seller fee + 2.9% cash-out
    - Curated sneaker/apparel positioning across GOAT, Flight Club, Sneakers.com
    - FTC shipping order and facility rationalization signal execution risk
  - - StockX
    - Bid/ask sneaker marketplace
    - Private; PLOTT estimates 38-40% of 2024 sneaker resale GMV
    - Physical verification + 14-day returns for eligible orders
    - 7.0-9.0% transaction fee + 3% processing
    - Liquidity, transparent pricing, seller tiers
    - Less lifestyle curation and brand storytelling than GOAT
  - - eBay
    - Horizontal marketplace + live commerce features
    - 2025 GMV $79.6B; 135M active buyers
    - Free sneaker Authenticity Guarantee + seller protections
    - Variable category fees + optional listing upgrades + ads
    - Massive buyer reach and advertising monetization
    - Less curated sneaker-first experience
  - - Stadium Goods
    - Inventory-holding premium boutique
    - PLOTT estimates $400-600M of 2024 sneaker resale GMV
    - Pre-authenticated inventory ready for shipment
    - Exact public seller fee not retained in fetched source set
    - Immediate ship and luxury-boutique brand
    - Inventory-heavy model with narrower scale
  - - Depop
    - Mobile social fashion marketplace
    - eBay says 2025 GMS of about $1B; 7M buyers; 3M sellers
    - Community trust + Depop Protection investment
    - No seller fee on new US/UK listings; 10% elsewhere; payment processing applies
    - Gen Z discovery and low-friction listing
    - Weak premium sneaker authentication
  - - Vinted
    - Buyer-funded P2P fashion marketplace
    - Millions of members; monetization anchored in buyer protection
    - Buyer Protection + refunds on platform checkout
    - No seller fees; buyer pays $0.70 + 5% protection fee
    - Lowest seller friction among cited peers
    - Not premium-sneaker-specific
  - - Poshmark
    - Social-commerce style marketplace owned by Naver
    - Acquired for $1.2B enterprise value
    - Community and social discovery; precise current fee page not retained
    - Exact current fee schedule not verified in fetched source set
    - Strong social engagement and US fashion brand
    - Not sneaker-trust-led
  - - Whatnot
    - Live shopping marketplace
    - Private; scale not publicly quantified in retained official sources
    - Buyer protection for inauthentic / not-as-described / lost items
    - Commission fee + payment-processing fee; no listing/storage fees
    - Live urgency and creator-led discovery
    - Lower sneaker depth than GOAT/StockX
  - - Nike SNKRS / Foot Locker
    - First-party release channels
    - Nike-controlled launch calendar; Foot Locker runs 2,410 stores in 26 countries
    - Brand-native authenticity from original supply
    - Retail markup rather than resale take rate
    - Direct supply control and omnichannel launch reach
    - Limited secondary-market liquidity compared with resellers
  notes: Profiles emphasize the direct sneaker resale set plus the most important social-fashion and first-party substitutes. Exact current Poshmark and Stadium Goods seller-fee schedules were not verifiable in fetched sources and are marked accordingly.
