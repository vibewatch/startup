summary:
  headline: GOAT 是有真实规模的转售资产，但公开证据仍支持在当前可见 $3.3B-$3.7B 区间回避：FTC 之后的信任风险、稀薄的财务披露和混杂的二级市场信号，让投资人没有拿到足够补偿来承担不透明性。
