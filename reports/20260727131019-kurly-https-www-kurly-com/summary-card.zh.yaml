  topStrengths:
    - 韩国清晨配送先行者和品牌龙头，10 年冷链基础设施构成护城河
    - 亏损十年后 2025 年首次实现全年经营利润；Q1 2026 经营利润为 2025 全年的 1.9x
    - 战略性 Naver 合作（Kurly N Mart GMV 6 个月内增长 9x）打开新获客渠道
    - 毛利率从 27.6%（2022）系统性提升至 34.3%（Q1 2026）
    - 付费会员（1.4M+ Kurly Members）推动高粘性复购，并贡献约 50% GMV
    - 业务多元化（Beauty Kurly、FBK 3P、Midnight Delivery）降低单一产品风险
  topRisks:
    - Coupang 在韩国电商约 40% 的份额，以及增长中的 Rocket Fresh 夜间配送，直接威胁 Kurly 核心市场
    - FY2025 经营利润率仅 0.5%，缓冲极小；盈利可持续性超过 1 年尚未证实
    - 2021-2023 年估值暴跌 78%；IPO 市场风险仍高，前次上市尝试失败
    - Naver 依赖：战略投资者目前持股 >6%；Naver 可能开发竞争性生鲜解决方案
    - 高物流成本结构（冷链、夜间配送人力）限制利润率扩张上限
    - 关键人风险：Sophie Kim 是创始人 CEO，未披露继任计划
  unresolvedGaps:
    - 2026 全年财务结果，以及 Q1 2026 动能是季节性还是结构性
    - IPO 时间线、目标估值和交易所选择（KOSPI vs. alternative venues）
    - 精确股本结构表及创始人/投资者持股拆分
    - Kurly USA 的牵引力指标和国际收入贡献
    - 现金余额、债务授信和通往 IPO 的现金跑道
    - Coupang Rocket Fresh 与 Kurly 在清晨配送细分市场的份额趋势
