- id: operating-scale-milestones-and-risk
  title: Operating Scale, Milestones, and Risk Signals
  body: 'The operational evidence is strongest around the 2024-2026 profitability turn. Public sources show positive EBITDA in 2024, first half-year operating profit in 2025, first full-year operating profit in 2025, and record Q1 2026 revenue, GMV, and operating profit. Those results were not driven by one metric alone. Coverage attributes the improvement to diversification through Beauty Kurly, third-party fulfillment and seller services, Naver-linked N Mart growth, and logistics-center optimization. Membership scale also matters: Kurly Members surpassed 1.4 million paid subscribers, and management-linked coverage reported more than 30% MAU growth in 2025, indicating the platform is trying to deepen wallet share rather than merely add orders. Even so, risk remains real. The company’s inferred 2025 operating margin was only about 0.55%, public headcount datasets conflict sharply, and the business still operates inside a Korean e-commerce market where Coupang and Naver are far larger platforms.
    Kurly has proved the model can earn money; it has not yet proved that its premium cold-chain economics can compound with wide margin cushion.'
