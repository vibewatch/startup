  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: Primary corporate-registration or audited corporate-history documentation that clarifies whether 2014 reflects incorporation, predecessor entity formation, or a database error.
    whyItMatters: Founding year is a chapter-one identity fact that later market-share, maturity, and employee-tenure comparisons will reuse.
    diligencePath: Obtain official Korean corporate registration records or investor data-room corporate-history materials.
    relatedQuestionRefs:
    - QO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Current board roster, investor board seats, voting rights, protective provisions, and preference-stack detail.
    whyItMatters: Control and exit economics cannot be judged from ownership headlines alone, especially after Naver’s stake increased above the founder’s reported personal holding.
    diligencePath: Request the latest cap table, shareholder agreement, board-consent schedule, and financing documents from management or lead counsel.
    relatedQuestionRefs:
    - QO008
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current employee count with scope definition across parent company, subsidiaries, warehouse labor, and contractors.
    whyItMatters: The difference between 918 and 2,882 employees is large enough to distort operating-efficiency and productivity benchmarks.
    diligencePath: Request HRIS exports or audited headcount by entity and employment type as of Q1 2026 and year-end 2025.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: customer-disclosure
    missingEvidence: Official disclosure of active customers, order frequency, retention, or cohort behavior for 2025-2026.
    whyItMatters: Membership counts alone do not reveal breadth of demand, basket quality, or the durability of recent profitability.
    diligencePath: Ask management for active-customer, order-frequency, and repeat-rate metrics by cohort, with definitions that reconcile to GMV and membership numbers.
    relatedQuestionRefs:
    - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: A fuller chronology of internal product launches, debt facilities, and board/governance events not disclosed in public coverage.
    whyItMatters: The milestone table is strong on financing and profitability events but may understate internal operating inflections that matter for underwriting.
    diligencePath: Cross-check management’s internal timeline, board materials, and lender documents against the public chronology before using it as the sole record.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
