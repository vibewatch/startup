- id: capital-base-and-stakeholders
  title: Funding History, Valuation Reset, and Stakeholder Map
  body: Kurly’s capital story has two distinct arcs. The first arc is the 2020-2021 expansion period, when the company raised large late-stage rounds including the $200 million Series F at a $2.2 billion valuation and a later $210 million pre-IPO round at a $3.3 billion valuation. That phase established Kurly as one of South Korea’s best-funded grocery-tech platforms and brought in a blend of global growth investors and strategic logistics capital, including CJ Logistics. The second arc is the 2022-2026 reset-and-rebuild period. Kurly cleared preliminary KOSPI review in 2022, abandoned the IPO in January 2023 amid weak market conditions, and reportedly saw valuation expectations collapse by roughly 78% to about $669 million. The renewed May 2026 Naver financing did not restore the old peak, but it did move Kurly back up to an implied ₩2.8 trillion valuation and reinforced a strategically useful partnership around storefront distribution and logistics. The result is a company whose investability
    improved operationally before it fully recovered financially from its prior valuation compression.
