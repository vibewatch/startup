company:
  name: Kurly
chapter:
  number: 1
  title: Company Overview
  summary: 'Kurly is a Seoul-based premium online grocery platform best known for dawn delivery and now extending into beauty, marketplace fulfillment, paid membership, and Naver-linked channels. Public reporting shows a sharp reset from the 2021-2023 valuation swing but also a real profitability inflection: first positive EBITDA in 2024, first half-year operating profit in 2025, first full-year operating profit in 2025, and record Q1 2026 results that reopened the IPO narrative. The key open diligence questions are governance opacity, thin margins despite profitability, and conflicting public headcount and founding-date datasets.'
sections:
- id: identity-model-and-stage
  title: Identity, Model, and Current Stage
  body: 'Kurly, legally Kurly, Inc. (컬리), is a Seoul-headquartered private commerce company whose public identity has consolidated around the Kurly brand after earlier association with Market Kurly. The business is best understood as a premium online grocery and fresh-food platform rather than a general marketplace first: independent coverage and recent performance stories still anchor the company to dawn-delivery grocery, even as management has diversified into beauty, third-party fulfillment, paid membership, and Naver-linked storefronts. The current stage is late-stage private and effectively pre-IPO. That framing matters because the company is no longer being judged purely on category creation or top-line growth; it is being judged on whether a once loss-making cold-chain grocery model can sustain profitability at public-market scrutiny levels. Public datasets are not perfectly aligned on the founding date: most reporting and the corporate narrative point to 2015, while some labor-market
    data products encode 2014. The prudent chapter-one baseline is therefore 2015 founding with an explicit footnote that some third-party databases appear to capture an earlier incorporation or operating precursor.'
