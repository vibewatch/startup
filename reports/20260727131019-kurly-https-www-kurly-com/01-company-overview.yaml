callouts:
- calloutType: strength
  title: Profitability is now evidenced across multiple time windows, not just one quarter
  body: 'Kurly’s public record now shows four profitability markers in sequence: positive EBITDA in 2024, first half-year operating profit in 2025, first annual operating profit in 2025, and record Q1 2026 profit. That does not eliminate risk, but it materially improves the credibility of the business model versus the earlier perception that premium dawn delivery was structurally unprofitable.'
  claimRefs:
  - CO018
  - CO022
  - CO024
  - CO026
- calloutType: risk
  title: Valuation recovered faster than margin quality
  body: The Naver deal lifted Kurly back to an implied ₩2.8 trillion valuation, yet the company’s inferred 2025 operating margin was only about 0.55%. The market has moved from questioning survival to questioning durability, especially in a sector where logistics intensity stays high and much larger platforms set delivery expectations.
  claimRefs:
  - CO027
  - CO030
  - CO041
  - CO043
- calloutType: insight
  title: Naver matters as more than a financial investor
  body: 'The 2026 Naver financing is strategically interesting because it also reinforces customer-acquisition and logistics links: Kurly N Mart is already operating on Naver Plus Store, and Kurly Next Mile supports dawn delivery for Naver-linked sellers. The investment therefore functions as both cap-table support and channel leverage ahead of any revived IPO process.'
  claimRefs:
  - CO013
  - CO014
  - CO028
  - CO029
  - CO030
