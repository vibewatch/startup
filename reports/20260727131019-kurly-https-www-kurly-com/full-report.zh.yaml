        - 当 Kurly 的选品和高端生鲜组合能支撑更高 AOV 时，契合度好
        - 促销力度大时，可能转向 SSG 或 Coupang
      - - 价值最大化的移动端杂货买家
        - 价格和促销优先；忠诚度低
        - 跨平台比价频繁，对折扣和会员权益反应强
        - 若决策主要看送达后最低价，匹配度弱
        - Coupang 主导的价格战会压缩 Kurly 扩大众市场份额的空间
