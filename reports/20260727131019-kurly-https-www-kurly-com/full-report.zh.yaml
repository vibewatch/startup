      - number: '2.3'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              韩国杂货竞争是不对称的。Kurly 并不是在和一群规模相当的高端同行作战；它面对的是更大的横向生态，这些生态可以用杂货加深留存、会员、物流密度和钱包份额。WPIC 估算 Coupang 约占韩国整体电商
              40%，Naver Shopping 接近 20%，这意味着两大平台进入杂货时，在流量、分发杠杆和资本上都远超 Kurly 单独可匹配的水平。Coupang 2024 年 3 月计划投资 ₩3 trillion
              扩张 Rocket Delivery、增加八个以上履约中心，并到 2026 年覆盖全国 88%，尤其重要，因为它会压缩高端清晨配送专营者过去享有的地域优势。


              Kurly 的回应是差异化，而不是模仿。它已经从只做生鲜食品的身份，转向更宽的高端杂货加生活方式平台，增加 Beauty Kurly、第三方卖家履约、与 Naver 合作的 Kurly N
              Mart，以及更快的履约模式。话虽如此，行业平均盈利能力仍弱。LS Securities 的市场总结提到，2026 年 Q1 包括 Coupang、SSG.com 和 11Street
              在内的主要同行仍有经营亏损，而 Kurly 当季表现强劲。这对尽调有两点含义：第一，Kurly 近期盈利看起来是差异化能力，而不只是周期性反弹；第二，如果大型对手选择用利润换份额，品类仍容易重新进入补贴周期。
