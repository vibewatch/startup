  - id: TV005
    title: 投资论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 利润率回落
        - 2026 年经营利润率在 Q1 后回落到盈亏平衡附近。
        - 说明重估来自一个顺风季度，而不是可持续盈利模型。
        - 按悲观情景重新承保，避免按当前价格买入。
      - - IPO 市场疲弱
        - KRX 窗口保持关闭，或投行把定价压到当前私募标记以下。
        - 说明公开市场流动性还不能验证 Kurly 的恢复估值。
        - 把私募标记视为乐观持有标记，而不是可实现退出价值。
      - - 竞争性价格压力
        - Coupang、SSG 或其他既有玩家迫使平台加大配送或商品侧再投入。
        - 会挤压本就很薄的利润率结构，削弱利润可持续性的信心。
        - 把估值锚重新拉回 0.5x 销售额或更低。
      - - 股权结构包袱
        - 优先权条款、期权稀释或二级转让压力显著压缩普通股上行空间。
        - 意味着名义估值夸大了投资者经济收益。
        - 要求重新定价或更强下行保护。
      - - Naver 协同不及预期
        - Kurly N-Mart 增长明显放缓，或渠道经济性被证明利润率很低。
        - 会拿掉乐观情景的核心支柱。
        - 在渠道得到验证前，建议维持跟踪 / 继续研究。
    notes: 否决触发项应是可监控的估值信号，而不是泛泛业务担忧。
    claimRefs:
      - CV045
      - CV047
      - CV048
      - CV049
      - CV052
      - CV054
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 完全摊薄股数与优先权结构
        - 2026 年 5 月融资后的精确股权结构表、期权池、优先权条款，以及任何估值调整条款。
        - 没有这些，投资者无法把名义估值转换成真实持有经济账。
        - 索取董事会批准的股权结构表、融资文件和清算瀑布模型。
      - - 资产负债表与流动性
        - 现金、债务、租赁义务、营运资金状况和契约条款包。
        - 经营利润率很薄，流动性和现金转化是下行分析核心。
        - 索取经审计 FY2025 和最新中期资产负债表包，以及债务明细。
      - - 利润可持续性
        - 按季度拆分的 2026 月度毛利率、履约成本和 SG&A 桥表。
        - 公开证据显示一个突出季度，但尚未证明全年可持续。
        - 索取月度管理账和群组层面的成本桥表。
      - - Naver 渠道经济性
        - Kurly N-Mart / Naver 相关交易量的 GMV、抽佣率、复购行为和贡献利润率。
        - 乐观情景很大一部分押注战略渠道杠杆，而不只是资金。
        - 索取渠道损益以及留存 / 复购数据。
      - - IPO 准备度
        - 主承销商委任、目标时间表、治理准备度和 KRX / 分析师反馈。
        - 退出概率会显著影响当前估值是否提供足够的风险调整后上行。
        - 索取投行材料、治理清单和股权故事草案。
    notes: 这些是最低限度的私有数据请求，足以把基于公开证据的跟踪判断推进到可投资承保视角。
    claimRefs:
      - CV053
      - CV054
