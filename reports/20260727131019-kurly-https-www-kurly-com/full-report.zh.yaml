        title: Kurly 的客户基础真实存在，但公开披露仍依赖代理指标，而不是完整活跃客户基数
        blocks:
          - type: paragraph
            body: >-
              讲 Kurly
              的客户故事，最好把它拆成一组高意图购物任务，而不是单一、无差异的大众市场受众。官方和独立来源都持续描述一个精选杂货平台：它已扩到美妆、家居生活和合作渠道分发的杂货，同时保留高端、信任导向的承诺。这支持一张四层客户地图：把
              Kurly 当主要购物平台的核心复购杂货会员；购买更宽生鲜和 FMCG 篮子的日常家庭消费者；符合 Kurly 选品式商品经营风格的相邻美妆和生活方式消费者；以及先在 Naver Plus Store、而不是
              Kurly 自有 App 中接触 Kurly 的新 Naver 获客用户。即便不完整，公开规模证据也有意义。BigGo 2025 年报道称 MAU 同比增长超过 30%，会员超过 1.4 million；App
              商店界面和 Naver 渠道数据也显示，Kurly 已在 iOS 和 Android 两端具备消费者规模。尽调保留项在披露质量：Kurly 和本报告采信的报道没有公布干净的总活跃客户数，所以本章只能把
              MAU、会员、评分和合作渠道行为作为现有最佳客户代理指标。
