  - id: TI006
    title: 公开财务缺口与具体尽调问题
    columns:
      - 缺失指标
      - 重要性
      - 目前最佳公开代理指标
      - 具体尽调请求
      - 严重性
    rows:
      - - 现金余额与债务
        - 缺少现金和债务数据，即便有 Naver 融资，也无法判断现金跑道。
        - 只有已报道融资规模和盈利快照。
        - 索取最新资产负债表、各实体现金、债务期限表，以及任何债务约束条款包。
        - 阻断性
      - - 营运资本与库存周转
        - 冷链生鲜即便账面利润转正，也可能吞掉现金。
        - 毛利率趋势和管理层对采购效率的评论。
        - 索取库存天数、损耗 / 腐损率、应付账款天数和供应商账期集中度。
        - 阻断性
      - - 资本开支与自由现金流
        - 物流扩张可能需要持续投入，超过 P&L 快照能看到的范围。
        - 报道称 Naver 资金将支持物流基础设施。
        - 索取履约中心资本开支计划、维护性资本开支和过去十二个月自由现金流。
        - 重要
      - - 各业务线收入结构与贡献利润率
        - 盈利路径可能过度依赖毛利更高的邻近业务，而不是核心生鲜。
        - Beauty Kurly、3P/FBK 和 Kurly N Mart 的增长率。
        - 索取业务线层面的收入、毛利、贡献利润率和活跃客户重叠度。
        - 重要
      - - 会员经济性与 CAC / 回本周期
        - 订阅与渠道经济性，是判断当前利润率结构能否复现的关键。
        - 2025 年付费会员 >1.4M，MAU +30%。
        - 索取会员 ARPU、留存、下单频次提升、按渠道拆分的 CAC 和按队列拆分的回本周期。
        - 重要
      - - 毛利率定义口径
        - 公开来源对 2026 年 Q1 同时给出 33.1% 和 34.3%。
        - 公司相关材料和分析师摘要。
        - 索取管理层桥表，把已披露收入、COGS 和服务组合调整同毛利率勾稽起来。
        - 轻微
    notes: 这是尽调请求表，不是在声称存在隐性困境。它列出截至 2026-07-27 本次报告运行日期，公开投资者仍无法从已审阅来源核验的事项。
