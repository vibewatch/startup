      - number: '5.3'
        title: 生态扩张与渠道复用
        blocks:
          - type: paragraph
            body: >-
              Kurly 2025-2026 年产品路线图显示，它在有纪律地扩张相邻业务，而不是随机铺品类。Beauty Kurly 已成为最清晰证据：公司可以向同一批对质量敏感的用户卖出不止生鲜食品，该业务 2025 年增长
              23%，2026 年 Q1 又增长 20.2%。FBK 和其他第三方卖家服务，从供给侧展示了同样的资产复用；2025 年上半年和 2026 年 Q1 数据都指向约 50% 以上增长，说明 Kurly
              正把物流能力变现给外部商户。Naver 合作更具战略意义，因为它把 Kurly 延伸到自有 App 之外。Kurly N Mart 于 2025 年 9 月在 Naver Plus Store
              上线，随后快速复利：月度 GMV 在数月内增长超过七倍，平均月交易额增长超过 50%，Aju Press 报道超过 90% 用户是 Naver Plus 会员，复购率约 60%。Kurly Nextmile
              通过为接入 Naver 的卖家配送清晨订单闭合了链条。这让 Kurly 不再只是单一店面，更像一个分布在自有和合作渠道上的高端杂货基础设施层。
