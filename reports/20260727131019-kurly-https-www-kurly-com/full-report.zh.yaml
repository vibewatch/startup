        blocks:
          - type: paragraph
            body: >-
              Kurly 的客户体验仍有差异化，因为它围绕信任、选品和高端购物感搭建，而不是围绕韩国最低价购物篮。TechCrunch 把品牌描述为以消费者为中心、质量驱动，官方 10
              周年活动再次围绕“好东西”展开，Google Play 文案仍强调详细指南、食谱、评价、基于画像的美妆推荐和直接客服联系。可见满意度代理指标健康：Apple 评价界面显示约 350,000 条评分下得分
              4.8，Google Play 仍显示超过 10 million 次安装、4.6 分和超过 43,000 条评价。但反向证据恰恰重要，因为 Kurly 卖的是信任溢价。所采信的 Apple 评价页反复出现关于
              App 错误、商品缺失或错送、退款不满和处理等待时间过长的投诉。一旦服务失灵，客户会立即质疑费用、补偿以及这份溢价是否值得支付。因此，客户论点是平衡的，而非完美的：Kurly
