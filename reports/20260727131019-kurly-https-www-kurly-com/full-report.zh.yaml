chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Kurly，法定名称 Kurly, Inc.（컬리），是一家总部位于首尔的未上市商业公司。早期外界常把它和 Market Kurly 绑定，如今其公众身份已收束到 Kurly
              品牌。理解这家公司，首先应把它看作高端线上杂货与生鲜平台，而不是普通综合市场：即使管理层已扩到美妆、第三方履约、付费会员和接入 Naver
              的店面，独立报道和近期业绩叙事仍把公司锚定在清晨配送杂货。当前阶段是后期未上市，实质上处在 IPO
              前夜。这个框架很重要，因为外界不再只按品类开创或收入增长评价它，而是在看一个曾经亏损的冷链杂货模型，能否在公开市场审视下持续盈利。公开数据集对创立日期并不完全一致：多数报道和公司叙事指向 2015
              年，部分劳动力市场数据产品写作 2014 年。因此，第一章的审慎基线应是 2015 年创立，并明确脚注说明部分第三方数据库似乎记录了更早的注册实体或运营前身。
