  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值标记站得住，但前提是预期要克制
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 Naver 交易是公开记录里最清晰的实时估值锚。Kurly 披露第三方配售 ₩33 billion，新股 498,882 股、每股 ₩66,148，交易后 Naver 持股
              6.2%；多家媒体共同指向约 ₩2.8 trillion 的隐含企业价值。按 2025 年历史业绩计算，约为 1.18x 收入、0.79x GMV。按 2026 年 Q1 年化口径，收入倍数压缩到约
              0.94x，但年化营业利润倍数仍约 28.9x，基于 Q1 年化净利润的隐含 P/E 约 34.5x。这组组合说明，该估值标记已不再是救援估值；它已经资本化了一次真实复苏。乐观解读是，战略资金与物流、Naver
              渠道扩张绑定。谨慎解读是，公开材料仍无法让外部投资者重建完全摊薄股数、优先股层级或资产负债表缓冲，因此估值支撑仍依赖证据，而不是已经被完整承销。
