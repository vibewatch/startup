  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 支撑依据
      - 什么会改变看法
    rows:
      - - 正向论点
        - Kurly 已从叙事走到已验证盈利；Naver 资本带来的不只是被动现金，还包括战略分发和物流杠杆。
        - 若 2026 全年利润率保持为正，且私有材料显示股权结构干净、流动性充足，则上调。
      - - 反向论点
        - 2025 年经营利润率只有 0.55%，过去估值曾跌去 80%；若一个强季度无法复现，公司仍可能被大幅重定价。
        - 若 2026 年 Q2-Q4 利润率回落到盈亏平衡附近，或 IPO 准备暴露沉重优先权、现金转化偏弱，则下调。
    notes: 反向论点聚焦估值持久性和证据质量，不否认底层业务进展。
