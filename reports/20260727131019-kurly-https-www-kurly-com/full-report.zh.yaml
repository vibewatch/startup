companyProfile:
  summary: >-
    Kurly（原 Market Kurly）是韩国高端线上杂货与生活方式平台的先行者，由 Sophie Kim（김슬아）于 2015 年在首尔创立。公司把 새벽배송（清晨配送）引入韩国——午夜前下单，上午 7
    点前送达——并用十年时间筑起冷链物流优势。2025 年，Kurly 首次实现全年经营利润（收入 ₩2.37 trillion，经营利润 ₩13.1 billion），完成从亏损型颠覆者到盈利零售科技平台的 10
    年转身。此后，公司从生鲜扩到 Beauty Kurly、第三方履约（FBK），并与 Naver 建立战略合作，在 Naver Plus Store 上推出 Kurly N Mart。2026 年 5 月，Naver 以 ₩2.8
    trillion 估值投资 ₩33 billion，为 Kurly 重启 IPO 野心背书。2026 年 Q1 创下季度新高：收入同比增长 28.4%，经营利润同比增长 1,277%。
