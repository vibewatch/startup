        title: 公开可比公司显示，Kurly 处在中段，而不是极度便宜
        blocks:
          - type: paragraph
            body: >-
              公开可比组不完美，但仍有决策价值。CompaniesMarketCap 显示，Coupang 2025 年收入约 $34.5 billion，2026 年 7 月市值约 $28.0 billion，即约
              0.81x 销售额。Instacart 2025 年收入约 $3.74 billion、市值约 $10.3 billion，即约 2.75x 销售额，其 SEC 股东信显示其确实有营业盈利。Ocado
              的收入和市值隐含约 1.11x 销售额，而 HelloFresh 在长期增长失望后估值仅约 0.07x 销售额。因此，Kurly 1.18x 的历史收入倍数高于 Coupang、Ocado 和
              HelloFresh，但低于 Instacart。对于一个刚刚盈利、有高端定位且有真实战略背书的韩国杂货平台，这个位置方向上公平，但还没便宜到可以忽略执行风险。市场结构证据也强化了谨慎：WPIC 描述
              Coupang 在韩国电商中约 40% 份额、Naver 约 20%，而第三方线上杂货市场规模估计会随品类定义大幅波动。可比公司的教训是，Kurly 配得上复苏信用，但不自动配得上稀缺性溢价。
