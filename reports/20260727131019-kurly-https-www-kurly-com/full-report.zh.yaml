  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 移动产品界面与核心用户任务
        blocks:
          - type: paragraph
            body: >-
              Kurly 的核心产品，最好理解为围绕高端杂货运营模型打造的移动优先商业界面。Apple App Store 和 Google Play 描述都呈现一个统一消费端界面，把 Market Kurly 食品电商与
              Beauty Kurly 结合，强调精选供给、可信评价、食谱和指南，以及基于画像的美妆发现推荐。这一点重要，因为 Kurly
              并不是想用最低价格或最全供给赢得大众市场；它要为那些更重视新鲜、信任和呈现、购买意图更强的用户减少决策疲劳。公开 App 指标显示产品已经具备规模：Google Play 显示下载量超过 10
              million、评分 4.6，Apple 显示约 350,000 条评价下评分 4.8。不过，App 和服务体验并非无摩擦。评价页也反复出现 App
              错误、包装过度、错送以及冷冻商品状态不佳等投诉。尽调应注意：产品不只是 App 外壳。真正的产品是 App、冷链承诺和守住信任的最后一英里执行。
