      - number: '1.2'
        title: 领导层、创始人与市场契合、治理可见度
        blocks:
          - type: paragraph
            body: >-
              Kurly 仍与创始人兼 CEO Sophie Kim 高度绑定。她曾是投资银行家，这有助于解释公司为什么擅长讲资本市场叙事，也愿意押注一个物流很重的高端定位，而不是复制低摩擦市场平台。公开财务沟通中，CFO
              Kim Jong-hoon 也频繁出现，已成为季度盈利和 IPO
              节奏上最可见的高管声音。这组搭配显示，领导结构更像创始人愿景叠加财务纪律，而不是一个被充分披露的运营班底。主要治理限制并不是缺少领导者姓名，而是缺少公开控制权细节。已审阅资料能识别主要投资者和战略股东；Korea
              Herald 提到，Naver 6.2% 的持股已超过 Sophie Kim
              个人持股，但公开材料没有披露当前董事会构成、表决协议、清算优先权或投资人知情权。尽调读数是：即便股权结构上的经济影响力可能已经向大型战略或财务支持方转移，围绕 Sophie Kim 的关键人依赖仍然重要。
