  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 历史损益与盈利拐点
        blocks:
          - type: paragraph
            body: >-
              Kurly 披露的财务弧线现在已足够可信，可以分阶段描述。第一阶段是高速增长：TechCrunch 报道 2020 年收入约 ₩845 billion，同比增长
              124%，证明清晨配送模式即使尚未证明持久盈利，也能赢得需求。第二阶段是 2021-2024 年收入规模放缓但仍保持正增长，同时毛利率稳步上行，LS Securities 后来总结其从 2022 年的 27.6%
              提升到 2024 年的 31.8%。第三阶段对尽调最关键：Kurly 从 2024 年 ₩18.3 billion 经营亏损，转为 2025 年 ₩13.1 billion 经营利润，随后仅 2026 年 Q1
              就实现 ₩24.2 billion 经营利润。这个顺序重要，因为它显示盈利转向并未局限于一个会计期间。同时，2025 年全年经营利润率只有约
              0.55%，所以公司证明盈亏平衡可行性的速度，快于证明足够厚的经济缓冲。
