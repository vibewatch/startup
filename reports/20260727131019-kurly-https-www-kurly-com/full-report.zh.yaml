  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 概率信号
      - 较当前上行 / 下行
    rows:
      - - 乐观
        - 2026 Q1 增长延续，Naver 渠道经济性跑出规模，IPO 买方给 Kurly 超过 1.35x 远期销售额的稀缺溢价。
        - ₩4.0T-₩5.0T；基于 ~₩3.0T 的 2026 年化收入，约 1.35x-1.70x。
        - 可能，但需要增长持续 >20%，IPO 铺排也要干净。
        - +43% 至 +79%
      - - 基准
        - Kurly 大体守住 2026 Q1 的运行节奏，公开市场投资者愿意按接近 1.0x-1.15x 远期销售额，给一家刚盈利的高端生鲜零售商估值。
        - ₩3.0T-₩3.5T；基于 2026 年化收入，约 1.0x-1.15x。
        - 与当前公开证据最一致。
        - +7% 至 +25%
      - - 悲观
        - 2026 Q1 被证明只是异常强劲，利润率回落，或韩国 IPO 情绪持续疲弱，市场重新回到 2024 年式谨慎。
        - ₩1.0T-₩1.5T；约为远期销售额的 0.35x-0.50x，和 / 或回落到此前低谷附近。
        - 可信，因为业务仍靠薄利运行，且已经经历过一次严重降估值。
        - '-64% 至 -46%'
    notes: 区间是基于公开证据的判断带，不是管理层指引，也不是完整 DCF。
