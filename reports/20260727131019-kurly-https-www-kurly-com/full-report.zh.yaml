      - number: '1.4'
        title: 运营规模、里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              运营证据在 2024-2026 年盈利转向上最强。公开资料显示，Kurly 2024 年 EBITDA 转正，2025 年上半年首次实现半年度经营利润，2025 年首次实现全年经营利润，2026 年 Q1
              收入、GMV 和经营利润均创纪录。这些结果并非由单一指标推动。报道把改善归因于 Beauty Kurly、第三方履约和卖家服务、接入 Naver 的 N Mart
              增长，以及物流中心优化。会员规模同样重要：Kurly Members 付费订阅用户超过 1.4 million，与管理层口径一致的报道披露 2025 年 MAU 增长超过
              30%，说明平台不只是增加订单，还在试图加深钱包份额。即便如此，风险仍然真实。公司推算的 2025 年经营利润率只有约 0.55%，公开员工数据集分歧很大，而业务仍处在 Coupang 和 Naver
              规模远大得多的韩国电商市场中。Kurly 已经证明这个模式能赚钱；它还没有证明高端冷链经济性能在足够宽的利润缓冲下持续复利。
