              Kurly 的收入质量正在改善，因为增长不再只来自直接 1P 杂货转售。最强证据指向一个混合模型：高端生鲜零售仍是购物篮锚点，但 Beauty Kurly、卖家配送、FBK 履约和通过 Naver
              分发的杂货，承担了更多增量增长。BigGo 和 The Investor 都把 2026 年 Q1 改善归因于食品、美妆和卖家配送服务的均衡增长；StartupRecipe 和 Aju Press
              则显示，Naver 注资扩张明确指向物流和新业务，而不是简单修补资产负债表。单位经济性方向上也更好。毛利率自 2022 年以来每年扩张，2026 年 Q1 SG&A 率同比下降 2.2
              个百分点，物流优化叠加午夜配送密度提升了资产利用率。不过，这套经济性尚未被完全验证：公开资料没有披露各业务流贡献利润率、CAC 或回收期、库存周转，或 1P 杂货、美妆、3P 服务与 Naver
