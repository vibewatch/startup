      - number: '1.3'
        title: 融资历史、估值重置与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Kurly 的资本故事分成两条清晰弧线。第一条是 2020-2021 年扩张期，公司完成多轮后期大额融资，包括估值 $2.2 billion 的 $200 million Series F，以及随后估值 $3.3
              billion 的 $210 million pre-IPO 轮。这个阶段把 Kurly 推成韩国融资最充足的杂货科技平台之一，也引入了全球成长投资者和包括 CJ Logistics 在内的战略物流资本。第二条是
              2022-2026 年的重置与重建期。Kurly 在 2022 年通过 KOSPI 初步审查，但 2023 年 1 月因市场疲弱放弃 IPO，据报道估值预期大约下跌 78%，降至约 $669
              million。2026 年 5 月的 Naver 新融资没有把估值拉回旧峰值，却把 Kurly 重新推到隐含 ₩2.8 trillion
              估值，并围绕店面分发和物流强化了一段有战略价值的合作关系。结果是：这家公司在完全修复此前估值压缩之前，先在运营层面改善了可投资性。
