  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争和市场结构是首要战略风险
        blocks:
          - type: paragraph
            body: >-
              Kurly 最大的外部风险在于，它已经身处一个韩国电商市场：服务预期正由资产负债表更厚、品类更宽、用户锁定更深的公司来设定。WPIC 的市场地图显示，Coupang 份额接近 40%，Naver Shopping
              约 20%；这意味着 Kurly 争的是在一个已由规模化分销平台控制的市场里继续保持存在感，而不是在利基高端玩家之间竞争。Coupang 2026
              年披露把威胁落到实处：单季收入以数十亿美元计、活跃电商客户数以千万计，且多年 ₩3 trillion 物流扩张正在把 Rocket Delivery 推向全国覆盖。Kurly
              不需要击败这一切才算活得下去，但必须足够差异化，让客户继续为高端选品和可预期新鲜度付费，而不是默认选择更宽的套餐式平台。


              问题在于，护城河边缘正在变窄。当日达和即时零售预期在抬升，Kurly 自己也上线了午夜配送，Naver 与 Kurly 联合推出的 Kurly N Mart 证明，伙伴分销能比 Kurly
              自有应用更快拉动增长。这在战略上有用，但也带来二阶依赖：如果 Naver 调整流量分配、费用经济性、商品运营优先级，或者决定更直接地自建杂货能力，Kurly 最新的增长向量就会变成漏洞。换句话说，战略风险不只是
              Coupang 的规模，而是未来所有主要平台都能提供「足够快」的杂货服务，Kurly 却要在没有高端余量的情况下守住高端定位。
