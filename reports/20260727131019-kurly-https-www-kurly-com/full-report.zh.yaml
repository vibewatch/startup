              财务上，Kurly 现在更不像救援故事，更像一家重新定价后、试图重新赢回公开市场信任的成长公司。最重要的检查点是 2026 年 5 月 Naver 融资：新增资本 ₩33 billion，以每股 ₩66,148
              发行 498,882 股新股，Naver 持股 6.2%，隐含公司估值约 ₩2.8 trillion。这是一笔有战略价值的钱，因为管理层明确把它与物流基础设施和新业务绑定，Naver Plus Store
              渠道的交易量似乎也在快速扩张。但更宽的资本故事仍有伤痕。TechCrunch 报道，从 2021 年 pre-IPO 峰值到 2023 年撤回 IPO 时的估值预期，降幅约 78%；即便 2026
              年重新定价，仍低于更早的私募峰值。更深的尽调问题是，Kurly 的公开披露仍远薄于上市同行：已融资金额可见，但当前现金、债务、契约和跑道数据不可见。
