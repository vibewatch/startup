        title: Kurly Members 是最清晰的留存引擎，但公开队列持久性仍披露不足
        blocks:
          - type: paragraph
            body: >-
              公开记录中质量最高的留存证据，是付费会员计划。多份 2025-2026 年来源收敛到同一幅图景：Kurly Members 到 2025 年底达到约 1.4 million 有效订阅用户，仅第四季度净增就超过
              200,000，管理层继续扩大权益而不是削减权益。官方新闻稿显示了这个产品为什么重要。Kurly 把订阅费定在每月 KRW 1,900，同时返还 KRW 2,000
              即时积分，再叠加会员专属价格和优惠券包，随后通过 KRW 20,000
              以上临时无限免配送费强化配送经济性。这种设计说明，该计划意在提高订单频次和习惯，而不只是变现一个被动身份标识。合作渠道证据强化了这一点。Aju Press 报道 Kurly N Mart 复购率
              60%，Naver Plus 会员占比约 90%，会员复购行为远重于非会员。缺失的是投资级留存视角：所采信来源没有出现公开流失曲线、队列表、NRR 或会员 GMV/订阅用户披露。
