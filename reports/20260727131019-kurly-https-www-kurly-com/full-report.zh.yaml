  - id: FR003
    title: 估值与盈利时间线
    type: timeline
    layout: wide
    summary: 关键节点展示 Kurly 如何从 2021 年估值高点，走到 2026 年靠盈利重新打开 IPO 选项。
    data:
      items:
        - date: '2021-12-01'
          label: 私募市场高点
          description: TechCrunch 报道，2021 年末 Kurly 按 Pre-IPO 口径估值 $3.3B。
        - date: '2022-08-22'
          label: IPO 审查通过
          description: Kurly 通过上市初审，之后推迟流程。
        - date: '2023-01-04'
          label: IPO 撤回
          description: 市场情绪疲弱、估值据报大幅塌缩之际，Kurly 取消了 IPO。
        - date: '2026-03-07'
          label: 首个年度经营利润
          description: FY2025 收入 ₩2.3671T，经营利润 ₩13.1B，全年首次转正。
        - date: '2026-05-06'
          label: Naver 将估值锚定在约 ₩2.8T
          description: Naver 投入 ₩33B 获得 6.2% 股权，显著修复估值情绪。
        - date: '2026-05-11'
          label: IPO 预期回归
          description: 2026 年一季度利润创纪录，重新点燃公开市场对 IPO 的猜测；但市场讨论仍把上市视为有条件事件。
    claimRefs:
      - CR011
      - CR012
      - CR016
      - CR018
      - CR019
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 经营兑现、估值参照、战略支持和剩余缺口，如何合成一条跟踪观察建议。
    data:
      nodes:
        - id: proof
          label: 经营兑现
          detail: FY2025 转盈利；2026 年一季度明显加速。
        - id: price
          label: 当前价格锚
          detail: Naver 轮 ₩2.8T，给出了当前估值锚。
        - id: peers
          label: 同业参照
          detail: 1.18x 销售额处在中游：高于 Coupang / Ocado，低于 Instacart。
        - id: synergy
          label: 战略上行
          detail: Naver 将资金与物流、渠道扩张绑在一起。
        - id: gaps
          label: 尽调卡点
          detail: 股权结构表、资产负债表和持续性数据仍未公开。
        - id: call
          label: 建议
          detail: 跟踪观察；估值尚算公允但风险高，只有看到更深验证或更好入场价后才买入。
      edges:
        - from: proof
          to: call
        - from: price
          to: call
        - from: peers
          to: call
        - from: synergy
          to: call
        - from: gaps
          to: call
    approximationNotes: 这是决策图，不是量化模型。
    claimRefs:
      - CV004
      - CV010
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: Kurly 当前销售倍数与选定上市同业倍数对比。
    data:
      items:
        - label: HelloFresh FY2025 市销率
          value: 0.07
          unit: x
          tone: negative
          detail: 长期增长不及预期后，折价很深。
        - label: Coupang FY2025 市销率
          value: 0.81
          unit: x
          tone: neutral
          detail: 韩国规模化参照，品类范围宽得多。
        - label: Kurly FY2025 市销率
          value: 1.18
          unit: x
          tone: neutral
          detail: 以 FY2025 收入计的当前私募估值锚。
        - label: Ocado FY2025 市销率
          value: 1.11
          unit: x
          tone: neutral
          detail: 技术属性更重的生鲜杂货参照。
        - label: Kurly 2026 年一季度年化市销率
          value: 0.94
          unit: x
          tone: positive
          detail: 以 2026 年一季度年化收入计的当前估值锚。
        - label: Instacart FY2025 市销率
          value: 2.75
          unit: x
          tone: positive
          detail: 已盈利的北美生鲜杂货平台可比公司。
    approximationNotes: 上市同业使用 2026 年 7 月市值快照的粗略值；Kurly 使用 2026 年 5 月私募融资估值锚。
    claimRefs:
      - CV030
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 相对当前 ₩2.8T 估值锚的熊市 / 基准 / 牛市估值区间。
    data:
      items:
        - label: 熊市情景
          low: 1
          mid: 1.25
          high: 1.5
          unit: KRW trillion
          detail: 较当前 -64% 至 -46%；利润率回落或 IPO 窗口疲弱。
        - label: 基准情景
          low: 3
          mid: 3.25
          high: 3.5
          unit: KRW trillion
          detail: 较当前 +7% 至 +25%；年化收入节奏守住，市场给约 1.0x-1.15x 前瞻销售额倍数。
        - label: 牛市情景
          low: 4
          mid: 4.5
          high: 5
          unit: KRW trillion
          detail: 较当前 +43% 至 +79%；增长持续，加上 IPO 稀缺溢价。
    approximationNotes: 情景区间是依据公开年化节奏和同业倍数约束推导的判断区间。
    claimRefs:
      - CV050
      - CV052
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 投资委员会式评分，衡量 Kurly 当前投资条件。
    data:
      items:
        - label: 估值状态
          value: Fair
          period: May 2026
          tone: neutral
          detail: 修复已经反映，不再是困境估值。
        - label: 盈利验证
          value: Medium-high
          period: Q1 2026
          tone: positive
          detail: 首个全年经营利润转正后，2026 年一季度经营利润创纪录。
        - label: 利润率持续性
          value: Low-medium
          period: FY2025/Q1 2026
          tone: warning
          detail: 2025 年经营利润率只有约 0.55%。
        - label: 战略支持
          value: High
          period: May 2026
          tone: positive
          detail: Naver 资金叠加渠道 / 物流合作。
        - label: 同业位置
          value: Middle band
          period: Jul 2026
          tone: neutral
          detail: 按销售倍数，高于 Coupang / Ocado，低于 Instacart。
        - label: 信息完整度
          value: Low
          period: Jul 2026
          tone: warning
          detail: 股权结构表、现金 / 债务和 IPO 准备细节仍未公开。
    approximationNotes: KPI 标签概括本章基于公开证据的判断，不能替代尽调。
    claimRefs:
      - CV045
      - CV053
  - id: FV005
    title: 历史估值时间线
    type: timeline
    summary: Kurly 从 Series E 到 2026 年修复估值锚的私募市场轨迹。
    data:
      items:
        - label: Series E 轮
          date: '2020-04-07'
          value: '0.78'
          note: 估值约 US$780M。
        - label: Series F 轮
          date: '2021-07-09'
          value: '2.2'
          note: 估值 US$2.2B。
        - label: Pre-IPO 轮融资
          date: '2021-12-19'
          value: '3.3'
          note: 估值高点为 US$3.3B。
        - label: IPO 估值塌缩
          date: '2023-01-04'
          value: '0.669'
          note: 撤回 IPO 阶段报道约 US$669M。
        - label: Naver 轮融资
          date: '2026-05-06'
          value: '1.87'
          note: 修复估值锚约 US$1.87B / ₩2.8T。
    approximationNotes: 数值沿用来源报道的美元口径；2026 年 Naver 轮按本章 ₩1,500/USD 的简化汇率。
    claimRefs:
      - CV022
      - CV023
