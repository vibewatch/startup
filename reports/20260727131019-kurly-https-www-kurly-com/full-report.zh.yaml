          detail: 复购行为和运费敏感度最强的付费会员。
        - label: 家庭日常生鲜杂货用户
          value: broad recurring base
          detail: 鲜食、肉类、海鲜、农产品和 FMCG 采购越来越像固定习惯。
        - label: 美妆 / 生活方式跨品类用户
