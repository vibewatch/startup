      - number: '2.2'
        title: 消费者人口结构与行为
        blocks:
          - type: paragraph
            body: >-
              Kurly 的需求逻辑与韩国人口结构异常契合。DataReportal 报告韩国有 50.6 million 互联网用户和 60.9 million
              个移动连接，意味着在可触达城市消费者中，数字接入几乎已经普及。它还报告 81.6%
              的人口生活在城市地区，这一点重要，因为高密度公寓生活、长通勤和小厨房都会提高预约配送和精选生鲜供给的价值。最重要的家庭结构变化是一人户上升：多方来源指向 2024 年一人户达到 8.05
              million，占全部家庭 36.1%，首尔接近 39.8%。


              这类人群不只是更常在线买东西，而是买法不同。WUSATA 的韩国杂货调查显示，85.7% 的一人户曾在线购买杂货；调查还显示，Coupang 赢得大众市场频次，而 Kurly 的单笔客单价更高，约为每单
              ₩48,200。The Straits Times 关于 sobun
              拼单群——陌生人拆分杂货和配送订单——的报道提供了有用侧写：小家庭会遇到分量、储存和篮子规模摩擦，因此高端选品、小包装设计和可靠新鲜度尤其有价值。因此，Kurly
              受益的核心不是成为最便宜的平台，而是成为让城市专业人士和小家庭能低后悔、高信任地购买食品的平台。
