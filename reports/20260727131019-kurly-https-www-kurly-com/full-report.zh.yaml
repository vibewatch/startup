            body: >-
              Kurly 比 2023 年更接近 IPO 准备状态，但仍不容易直接验证。正面案例真实存在：2024 年 EBITDA 转正，2025 年上半年两个季度盈利，2025 年首次实现全年经营利润，2026 年 Q1
              极强，说明业务跨过了重要运营门槛。风险案例也同样真实。2025 年全年经营利润率仍只有约 0.55%，所报道的 2026 年 Q1 毛利率在不同来源之间有 33.1% 与 34.3%
              的小幅差异，公开材料仍不给出资产负债表深度。对冷链零售商来说，现金、债务、库存、应付账款、资本开支、自由现金流和分业务流贡献利润率缺失，不是装饰性遗漏，而是投资判断的阻塞点。因此，正确的尽调结论是有条件的：Kurly
              已显著改善收入质量和盈利可信度，但投资者仍需要数据室证据，才能判断当前利润结构是否足够持久，能支撑公开上市。
