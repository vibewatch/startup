      - number: '2.4'
        title: 市场结构、趋势与监管
        blocks:
          - type: paragraph
            body: >-
              Kurly 的市场结构由四股力量决定：集中的消费者平台、对质量敏感的食品供应商、资本密集型冷链物流，以及对线上食品流通收紧的监管。供应商力量是混合的。高端农场、进口食品品牌和美妆品牌重要，因为选品本身就是
              Kurly 品牌承诺的一部分；但规模提升也在增强 Kurly 的采购杠杆，公司持续改善的毛利率已体现这一点。相比之下，买方力量很高，因为消费者可以轻松在 Kurly、Coupang、Naver、SSG
              和线下渠道之间多平台并用，除非某个平台在信任、便利或会员经济性上胜出，否则切换成本很低。


              若干结构性趋势仍在帮助 Kurly。即时零售在扩张，AI 驱动的个性化正从功能变成预期，Kurly 与 Naver
              这类跨渠道合作降低了获客摩擦。但同样的力量也带来逆风。即时零售缩短了可接受配送窗口；进口食品检查增加，韩国食品监管机构把 2025 年线上食品检查目标从 3,400 翻倍到
              6,000；进口食品通胀叠加汇率波动，也会同时压制消费需求和毛利率。因此，Kurly 的机会在于靠技术和物流密度，更快把这些压力转成高端服务优势，赶在竞争者将其商品化之前。
