      - number: '2.5'
        title: Kurly 的市场定位与 TAM
        blocks:
          - type: paragraph
            body: >-
              Kurly 的实际 TAM 应看作分层机会，而不是一个巨大的杂货数字。最外层是韩国零售电商，GMV 已约 $215 billion。更相关的可服务市场是线上食品和杂货，2025 年宽口径估算集中在
              $16.9-17.0 billion，窄口径线上杂货估算约 $7.0 billion。按当前汇率，Kurly 2025 年 GMV ₩3.534 trillion 折合约 $2.5
              billion，按任一市场口径看都已有意义：大约相当于宽口径线上食品电商的五分之一，或在更窄的高端生鲜配送细分中占据更大份额。


              这并不意味着 Kurly 拥有韩国杂货市场。WUSATA 消费者调查显示，Kurly 在首选平台份额上远落后于 Coupang，说明它的滩头阵地不是大众杂货频次，而是高端、信任驱动、高客单任务。Kurly
              更高的客单价、强生鲜认知，以及在美妆、3P 履约和 Naver 分发杂货上的牵引力，说明它更应被理解为一个从精选食品核心向外扩张的高端杂货基础设施平台。因此，下一条增长向量是复用同一套客户信任和冷链 /
              物流资产的相邻业务——美妆、同日便利、外部履约和渠道合作——而不是逼 Kurly 与最大横向市场平台打纯价格战。
