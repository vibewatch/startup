      - number: '3.2'
        title: 配送服务追平、买方切换与场景竞争
        blocks:
          - type: paragraph
            body: >-
              Kurly 最尖锐的竞争压力不是单一价格战，而是购买场景被切碎。Kurly 在计划型高端购物篮上仍有不错基准，因为它把清晨配送和新的同日触点结合起来；但同一批公开证据显示，至少有四种对手配送逻辑。SSG
              正搭建高端存量玩家栈，借助 E-Mart 枢纽覆盖清晨、预约、一小时和 2 小时配送。Baemin 通过承诺一小时送达杂货和日用品，并叠加免配送费俱乐部权益，猛攻紧急补货需求。Homeplus 和 Lotte
              则保留门店驱动替代方案，服务那些主要想要可靠线上超市补货的家庭。即便较弱的生鲜电商阵地也提供了信息：GSfresh 的终止通知说明，一些既有玩家没有成功把独立生鲜主张做大。放到 Kurly
              身上，结果就是切换成本低、多平台并用高。买家可以保留 Kurly 来完成可信的高端生鲜订单，然后为一次紧急零食跑腿、低价日用品篮子或门店驱动的同日任务转去别处。这就是为什么功能追平不如场景控制和频次捕获重要。
