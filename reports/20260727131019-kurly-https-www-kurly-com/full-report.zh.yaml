  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >-
              Kurly 在韩国的市场边界小于整体电商，却大于单纯生鲜清晨配送。最外层看，WPIC 估算韩国 2024 年电商 GMV 约为 ₩300
              trillion，占总零售约三分之一，使韩国跻身全球零售数字化渗透最高的市场之一。在这片广义消费池内，食品和杂货机会至少可用三种口径衡量。Deep Market Insights 单独切出较窄的线上杂货市场，估算
              2025 年为 $6.98 billion；ECDB 更宽的食品电商数据集显示 2025 年为 $16.93 billion，线上占比 10-15%。IMARC 更高，达到 $16.99
              billion，因为其定义包含更宽的线上杂货篮子和更多区域拆分。


              关键分析点不是某一个来源绝对正确、其他来源错误，而是口径决定结论。窄口径通常强调数字优先的杂货下单，宽口径则纳入食品市场平台流量、日用品补货和混合业态零售。三种口径仍指向同一个方向性结论：韩国线上杂货市场已经大到足以支撑多个规模化运营商，但相对于韩国消费者的便利需求、城市密度和智能手机使用率，结构上仍未充分渗透。这个格局给了
              Kurly 真实增长跑道，但不是无竞争跑道，因为当品类经济性改善或战略压力上升时，大型相邻平台可以把资本重新投向杂货。
