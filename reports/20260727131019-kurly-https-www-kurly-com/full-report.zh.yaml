        title: 基准情形有上行，但不足以忽略下行和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              用情景法收尾最合适，因为 Kurly 现在在叙事上可投，但披露仍不完整。基准情形下，2026 年收入按 Q1 运行率年化，叠加约 1.0x-1.15x 的前瞻销售额倍数，可支撑约 ₩3.0 trillion 至
              ₩3.5 trillion 估值，只比当前标记高 7% 至 25%。牛市情形——约 ₩4.0 trillion 至 ₩5.0 trillion——需要增长持续高于 20%，证明 Naver
              带来的需求和更高利润率的邻近业务继续放大，并且 IPO 市场愿意支付稀缺性溢价。熊市情形——约 ₩1.0 trillion 至 ₩1.5 trillion——在 Q1 2026 异常有利、竞争迫使再投资或韩国
              IPO 需求仍薄弱时依然可信。这组情景数学给出了本章最清晰的投资结论：估值公允、风险高，建议跟踪而非买入。Kurly
              已经赢得重估，但当前价格已经嵌入相当一部分转身。要从跟踪走向买入，投资者仍需要关于股权结构、资产负债表、投行流程，以及盈利能否熬过完整一年而不是一个亮眼季度的非公开证据。
