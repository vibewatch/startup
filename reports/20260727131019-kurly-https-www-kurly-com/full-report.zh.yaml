      - number: '5.4'
        title: 数据、AI 护城河与技术边界
        blocks:
          - type: paragraph
            body: >-
              Kurly 的数据和软件层看起来有价值，但比公司的物流声誉更早期。今天最强证据是间接的：App 商店文案强调与画像数据绑定的个性化美妆推荐、可信评价和引导式商品经营；Google Play 的数据安全披露显示
              App 收集广泛身份、购买历史和 App 活动字段；管理层称 2025 年 7 月成立的 AX Center 将牵头全公司 AI 转型和新业务规划。这说明 Kurly
              具备更好需求预测、定价和个性化的原料，但还没有公开量化出能与冷链护城河相比的 AI 护城河。更直接的产品技术风险是执行漏水。App Store 和 Google Play 评价仍出现反复的 App
              错误、错送、包装过度以及冷冻品到货状态差等投诉。竞争压力也高企，因为 Coupang、SSG 和 Baemin 分别在速度、会员权益或即时配送便利上设定强预期。因此，Kurly
              的产品优势真实但有条件：只有软件、包装和路线级运营共同跑顺时，它才最有效。
