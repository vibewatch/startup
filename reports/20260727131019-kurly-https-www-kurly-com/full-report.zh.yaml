      - number: '7.3'
        title: 运营、技术与监管风险仍紧密耦合
        blocks:
          - type: paragraph
            body: >-
              Kurly
              的风险面异常耦合，因为它给客户的承诺不只是软件、不只是食品零售，也不只是配送。午夜和清晨配送要求仓库排班、冷链处理、路由密度、应用可靠性、客服补救和监管合规几乎无缝协同。因此，适合公开市场叙事的「物流优化」表述既是缓释手段，也是警示：如果利润率改善要靠同一张实体网络挤出更高利用率，服务退化、劳资摩擦或食品质量事件就会同时传导到声誉和盈利。App
              Store 投诉说明，薄弱环节不必很戏剧化；反复的应用错误、漏货、错送或缓慢的补救闭环，已经足以磨损支撑 Kurly 定位的便利溢价。


              韩国监管面又加了一层。MOEL 的劳动标准框架、FTC 的电商规则、PIPC 的隐私监管、MFDS 的食品安全职责，在这里都重要，因为 Kurly
              卡在消费电商、易腐品和数据密集型移动下单的交汇处。夜间导向履约尤其容易受到排班和工资合规审查。同时，Kurly 的 Google Play
              披露显示，应用处理广泛类别的个人数据和设备关联数据，网络安全或隐私失误可能很快从 PR 问题升级为监管事件。Kurly
              有可见缓释项——隐私披露、传输加密、删除请求和结构化下单流程——但公开来源仍只给投资者看到事件频率、泄露历史和控制成熟度的表层。
