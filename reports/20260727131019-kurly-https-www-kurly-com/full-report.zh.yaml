  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 韩国竞争层级：直接对手、相邻平台与替代品
        blocks:
          - type: paragraph
            body: >-
              Kurly 面对的不是一个边界清晰的竞争同行组。与它在商品陈列上最接近的是 SSG.com 和 Oasis，两者都在生鲜食品信任和高端选品上竞争；但经济上最危险的对手仍是
              Coupang，因为它可以补贴速度，把杂货捆进更大的会员和物流生态，并用远多于 Kurly 的用户流量守住份额。2026 年 Q1 公开证据强化了这种分化：Kurly 盈利，Oasis 在更小基数上仍盈利，而
              Coupang、SSG.com 和 11Street 的经济性仍较弱或亏损。Baemin 又是另一种玩家。它首先不是精选高端杂货商，但庞大的 App 触达和一小时配送定位，使它能可信地攻击 Kurly
              的紧急场景。Gmarket 和 11Street 主要作为综合市场平台有意义，Homeplus 和 Lotte 仍是以门店网络为锚的现状替代品，而不是完整的 Kurly 类似物。因此，战略地图是分层的：Kurly
              的直接同行在选品和信任上重叠，但最强攻击者重叠的是分发和消费习惯塑造。
