      - number: '7.4'
        title: 缓释因素、监控指标与投资假设失效点
        blocks:
          - type: paragraph
            body: >-
              现在研判
              Kurly，正确方式不是假设它必然失败，也不是假设它已经进入逃逸速度。几项真实缓释因素清晰可见：十年高端生鲜杂货品牌、全年盈利可行的证据、一个足够大且能快速带来需求的渠道伙伴、一张可复用于清晨和午夜配送的物流网络，以及明确披露的隐私与合规界面，而不是彻底黑箱。这些因素重要，也解释了
              Kurly 为什么不再像一个简单的「不经济创业公司」故事。但公开证据仍指向一家如果多个中等风险同时排列，下行就可能重新加速的公司：套餐式竞争更快逼近、Naver
              经济性走弱、人工成本承压、服务失败、食品质量事件，或消费环境转软。


              因此，监控这个投资假设要靠具体触发器，而不是抽象担忧。如果利润率改善停滞、配送窗口却拉宽，模型可能是在用运营复杂度购买增长。如果合作方拉动的增长占主导、但贡献利润率不清楚，分销杠杆可能在遮蔽集中度风险。如果管理层无法提供库存周转、损耗、冷链事故、现金、债务和
              Naver 合同经济性的非公开数据，投资者仍是在承销一个附带了更好季度的黑箱。只有尽调确认近期盈利转折是复利起点，而不是优化的高水位线，Kurly 才值得投资。
