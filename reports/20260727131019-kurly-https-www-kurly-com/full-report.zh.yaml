  - id: TI003
    title: 收入流和货币化质量
    columns:
      - 业务流
      - 规模 / 价格信号证据
      - 收入确认逻辑
      - 利润率 / 资本画像
      - 当前尽调判断
    rows:
      - - 1P 高端杂货
        - 历史核心业务；自有库存销售确认收入。
        - 向终端客户直接销售商品，按总额确认收入。
        - 库存、损耗和冷链营运资本强度最高。
        - 仍是购物篮锚点，但公开拆分未披露 2025 年收入中核心杂货贡献多少。
      - - Beauty Kurly
        - 美妆 GMV 2025 年增长 23%，Q1 2026 增长 20.2%。
        - 可能随品类不同混合自有库存和平台型经济性。
        - 毛利率可能高于生鲜，但公开资料未披露贡献利润率。
        - 看起来是有意义的邻接业务：能抬高购物篮质量，又不必完整复制杂货物流成本。
      - - 3P 商家配送 / FBK
        - 3P GMV 2025 年增长 54.9%，商家配送 GMV 在 Q1 2026 增长 52.6%。
        - 收入来自商家履约相关服务和物流，不只靠商品转售。
        - 提高资产利用率，库存风险应低于 1P 零售。
        - 这是 Kurly 正在跳出纯零售加价经济性的最重要证据。
      - - Naver 上的 Kurly N Mart
        - 上线后月 GMV 增长超过 7x；月均交易数提升逾 50%。
        - 通过 Naver 分发店铺获得渠道销售及物流 / 服务收入。
        - CAC 可能更低，因为 Kurly 向 Naver 借流量，而不是自掏腰包买下全部流量。
        - 战略上有吸引力，因为它把需求获取和物流利用率绑在一起。
      - - Kurly USA / 跨境
        - 美国官方上线采用 48 小时配送；冷藏 / 冷冻满 $89 免运，常温满 $49 免运。
        - 向美国销售韩国食品和 K-beauty 带来的跨境电商收入。
        - 航空货运和服务复杂度会上升，因此增长不一定等于利润率扩张。
        - 这是有意思的邻接业务，但公开数据尚未量化其对合并收入的贡献。
    notes: 本表混合了直接披露的增长信号和机制层推断。只有美国跨境入口公开可见价格；国内实际抽成率和分业务收入组合仍未披露。
