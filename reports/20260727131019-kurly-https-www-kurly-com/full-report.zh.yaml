        blocks:
          - type: paragraph
            body: >-
              Kurly 的护城河真实但窄。证据支持它相较多数大众市场同行拥有更强的毛利率和高端选品位置，近期业绩也显示 Kurly
              现在可以选择性扩张，而不必马上回到全面补贴打法。话虽如此，这条护城河不是流量规模、实体店无处不在，也不是不受约束的资本。Coupang
              仍在设定品类外边界，因为它把最大的电商受众、物流密度和为份额亏钱的已验证意愿绑在一起。Baemin 即便永远成不了最佳高端杂货商，也能在高频即时零售场景上侵蚀 Kurly。SSG
              能从高端存量玩家一侧压迫同一批富裕家庭。Oasis 证明，有纪律的小众运营商即使不匹配 Kurly 规模，也能保持相关性。最有意思的战略转折是
              Naver：它不是一对一的杂货运营商，却是分发伙伴；其持股增长和更深整合提高了 Kurly 的渠道杠杆，也创造了可信的退出选择权。换句话说，Kurly
              最好的防守不是同时模仿每个对手，而是在能借规模的地方借规模，同时加深可盈利差异化。
