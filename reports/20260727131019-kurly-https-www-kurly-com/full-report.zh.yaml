      - number: '8.2'
        title: Kurly 已经经历过溢价周期，也经历过严酷重置
        blocks:
          - type: paragraph
            body: >-
              历史语境重要，因为 Kurly 当前价格并不是在一个干净市场中发现的。TechCrunch 跟踪到，2020 年 4 月 Series E 时公司估值约 $780 million，2021 年 7 月
              Series F 为 $2.2 billion，2021 年 12 月 pre-IPO 轮为 $3.3 billion。到 2023 年 1 月 Kurly 放弃 IPO 时，报道中的预期已跌至约 $669
              million——较 2021 年末峰值回撤约 80%。这次坍塌是本章最强的反向数据点，因为它说明当增长质量和市场窗口不再支撑私募市场乐观情绪时，投资者已经给 Kurly 重新定过一次价。因此，2026 年
              Naver 轮应被理解为复苏估值标记，而不是从零出发的绿地估值。LS Securities 的表述有用：最新轮次接近 Naver 早期投资对应约 ₩1 trillion 水平的三倍，但仍远低于 2021
              年私募峰值。换句话说，Kurly 修复了可信度，没有抹去历史。
