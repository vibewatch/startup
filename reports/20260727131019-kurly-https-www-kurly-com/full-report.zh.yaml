      - number: '7.2'
        title: 财务脆弱性已下降，但并未消失
        blocks:
          - type: paragraph
            body: >-
              Kurly 2025-2026 年的财务故事比投资者在 2023 年看到的版本明显更好，但按公开市场标准仍脆弱。公司已经证明全年营业利润可以转正，2026 年 Q1
              又证明盈利可以和真实增长并存。这很关键，因为过去的做空论点——清晨配送在结构上根本不可能赚钱——已经得不到最新记录支持。不过，正面案例不能被夸大。Kurly 2025 全年营业利润率只有约
              0.55%，这意味着产品组合、履约效率、营销强度、损耗、人工成本或合作方条款只要轻微恶化，就可能吃掉缓冲垫。因此，分析师和市场评论把重点放在可持续性上，而不是庆祝一次与过去彻底切割，是合理的。


              估值历史也强化了这份谨慎。TechCrunch 记录了 2021 年私募市场峰值到 2023 年撤回 IPO 时估值标记之间约 78% 的坍塌；尽管 2026 年 5 月 Naver
              交易显著改善了叙事，它并没有抹去一个教训：公开市场拒绝不计代价买增长时，电商估值会剧烈重置。新资金在战略上有用，但管理层自己把资金用途和物流扩张、新业务绑定；换句话说，Kurly
              仍需要投入来守住服务质量并拓宽收入。核心财务风险因此不是迫在眉睫的资不抵债，而是 Kurly 可能先实现了盈利，却还没实现耐久性。
