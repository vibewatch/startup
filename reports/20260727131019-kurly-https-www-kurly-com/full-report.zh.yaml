            body: >-
              国际类比强调了为什么不应把 Kurly 当作普通杂货 App 分析。Amazon Fresh 展示了横向平台路径，杂货只是庞大电商会员生态中的又一层留存。Instacart
              代表结构上不同的模式：它靠中介零售商并为其店面赋能取胜，而不是拥有 Kurly 式库存经济性。Ocado 走向另一个极端，把线上杂货视为技术、履约和最后一英里操作系统。Hema/Freshippo
              展示了门店与数字混合路线，高密度实体节点、快速配送半径和有纪律扩张可以与最终盈利并存。Kurly 位于这些模板之间。它小于 Amazon 或 Coupang，不如 Instacart 那样市场平台化，也不是
              Ocado 那样的纯基础设施供应商；但其战略上行空间最接近 Hema 或 Ocado 的逻辑：把高端信任与可复用物流和软件层结合。这个框架重要，因为它提示 Kurly
