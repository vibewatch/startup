              Kurly 2025-2026 年获客模式，明显好于“花更多钱买 App 流量”的简单故事。第一，2025 年上半年报道把新增客户与 Saetbyeol 配送扩到 11
              个新区域、随后进入济州绑定，说明只要服务承诺在地理上可用，覆盖扩张仍能创造真实需求。第二，Naver 联盟创造了更便宜、更宽的发现入口。Kurly 和 Naver
              明确把合作描述为大规模获取新客户和覆盖更多年龄层的路径，最终渠道数据也很强：StartupRecipe 和 Aju 报道称，Kurly N Mart 上线后 GMV 增长超过七倍；2026 年 Q1 来源称 3
