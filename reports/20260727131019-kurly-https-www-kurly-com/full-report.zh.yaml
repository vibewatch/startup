      - number: '5.2'
        title: 冷链物流与配送架构
        blocks:
          - type: paragraph
            body: >-
              Kurly 最有防御性的技术是运营型技术，而不是纯软件定义技术。公司持续把全程冷链、分温包装和清晨配送，作为一套严密控制的物流系统带给客户的结果。2025-2026
              年公开资料把这套系统连接到三个具名核心物流中心——Gimpo、Pyeongtaek 和 Changwon——以及一个为强化 FBK 而开设的 Ansan 3PL 冷库。2026 年 2 月推出 Midnight
              Star Delivery 有重要战略意义，因为它显示 Kurly 正用软件和路由逻辑扩大资产利用率：同一套基础设施，拉长履约窗口，堆高订单密度。Aju Press 报道，前一晚截止时间之后到下午 3
              点之间下的订单，现在可在午夜前送达客户，初期覆盖首尔和京畿，计划进一步扩张。另有 2025 年上半年报道称，Saetbyeol 覆盖新增 11 个区域，甚至在济州增加了一日达服务。模式很清楚：Kurly
              的护城河不是某个明星仓库或某个 App 功能，而是一张能在次晨、同日和第三方履约流程中持续复用同一冷链骨架的网络。
