  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: working-capital
    missingEvidence: Current cash balance, debt, inventory turns, spoilage rate, payables terms, capex, and free-cash-flow
      bridge.
    whyItMatters: Kurly’s sub-1% annual operating margin means working-capital and cash conversion quality can determine whether
      reported profit is durable.
    diligencePath: Request monthly working-capital bridge, warehouse-level spoilage metrics, lender or covenant summary, and
      cash runway model from management.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: naver-economics
    missingEvidence: Contribution margin, fee structure, customer-acquisition economics, and contract change rights for Kurly
      N Mart / Nextmile cooperation with Naver.
    whyItMatters: Fast partner-led growth can look attractive while quietly lowering bargaining power or hiding weaker unit
      economics.
    diligencePath: Obtain Naver partnership term sheet summary, channel mix by GMV and revenue, and cohort-level economics
      for partner-acquired customers.
    relatedQuestionRefs:
    - QR005
    - QR028
  - type: missing-source
    severity: material
    topic: cybersecurity-history
    missingEvidence: Historical breach log, material incident history, third-party security audits, and remediation SLAs for
      app, payments, and logistics systems.
    whyItMatters: Kurly’s public privacy and data-safety surfaces show exposure but do not let investors judge whether the
      company has already experienced meaningful incidents.
    diligencePath: Request security memo, last two years of material incidents, penetration-test history, and board-level
      security reporting cadence.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: labor-model
    missingEvidence: Workforce mix between employees, contractors, and outsourced last-mile labor; overtime, night-premium,
      and turnover data by facility.
    whyItMatters: Kurly’s service promise depends on labor-intensive operations, so labor classification or overtime dependence
      can change margins quickly.
    diligencePath: Request facility labor model, shift design, overtime share, labor-dispute history, and compliance audit
      results.
    relatedQuestionRefs:
    - QR013
  - type: private-evidence-only
    severity: material
    topic: cold-chain-incident-rates
    missingEvidence: On-time delivery rates, cold-chain break incidents, product recall history, refund rates, and category-level
      complaint rates.
    whyItMatters: Public reviews show some service leakage, but investors cannot tell whether those issues are rare edge cases
      or structural operational noise.
    diligencePath: Request warehouse and route service dashboards, claim-rate history, and any MFDS-related incident or recall
      correspondence.
    relatedQuestionRefs:
    - QR011
    - QR017
    - QR029
  - type: missing-source
    severity: minor
    topic: ai-roi
    missingEvidence: Quantified KPIs showing whether the AX Center has improved forecast accuracy, route planning, personalization,
      or labor productivity.
    whyItMatters: Without outcome metrics, AI language can be strategically correct but financially immaterial.
    diligencePath: Ask management for pre/post AX metrics tied to conversion, pick accuracy, forecast error, and support automation.
    relatedQuestionRefs:
    - QR018
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-surface
    missingEvidence: A fuller map of municipal reporting, food-label, tax, packaging, and cross-border trade rules that may
      apply by region or channel.
    whyItMatters: The public chapter covers the principal visible rules, but a full legal workup would be broader than the
      public-source record supports.
    diligencePath: Commission Korean counsel to produce a channel-by-channel compliance matrix for domestic retail, partner
      distribution, and Kurly USA.
    relatedTableRefs:
    - TR004
