- id: TR005
  title: Mitigations and thesis-break triggers
  columns:
  - Risk area
  - Monitorable trigger
  - Why it matters
  - Action implication
  rows:
  - - Margin durability
    - Two consecutive quarters of falling gross or operating margin without a clear growth payback.
    - Would suggest 2025-2026 profitability was an optimization peak, not a new base.
    - Re-underwrite the business as structurally fragile.
  - - Partner concentration
    - Naver-driven GMV growth keeps rising while Kurly cannot disclose partner economics or channel mix.
    - Would indicate growth quality is increasingly partner-dependent.
    - Demand contract and contribution-margin diligence before underwriting upside.
  - - Service reliability
    - Visible increase in app-error, misdelivery, or missing-item complaints without better disclosure.
    - Would undermine the convenience premium that supports Kurly’s brand.
    - Assume weaker retention and higher support costs.
  - - Regulatory friction
    - Material labor, privacy, or e-commerce enforcement action or recurring formal consumer disputes.
    - Would convert manageable compliance cost into thesis-damaging event risk.
    - Escalate risk rating and cut valuation tolerance.
  - - International distraction
    - Kurly USA absorbs management attention but fails to show clean unit economics.
    - Would create non-core complexity before the domestic case is fully de-risked.
    - Treat overseas expansion as negative optionality rather than upside.
  notes: Triggers are intentionally concrete so an investment committee can monitor whether Kurly is compounding or simply
    running harder to stay in place.
