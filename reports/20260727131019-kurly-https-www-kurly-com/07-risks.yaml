- id: mitigations-monitoring-and-thesis-breaks
  title: Mitigations, Monitoring, and Thesis Breaks
  body: |-
    The right way to underwrite Kurly now is not to assume either failure or escape velocity. Several real mitigants are visible: a decade-old brand in premium grocery, proof that annual profit is possible, a channel partner large enough to add demand quickly, a logistics network that can be reused across dawn and midnight delivery, and explicit privacy and compliance surfaces rather than total opacity. Those matter, and they explain why Kurly no longer looks like a simple “uneconomic startup” story. But the public evidence still points to a business whose downside can re-accelerate if multiple moderate risks line up at once: faster bundled competition, weaker Naver economics, labor-cost pressure, service failures, food-quality incidents, or a soft consumer backdrop.

    That means the thesis should be monitored with concrete triggers rather than abstract concern. If margin improvement stalls while delivery windows widen, the model may be buying growth with operational complexity. If partner-led growth becomes dominant without clear contribution margins, distribution leverage may be masking concentration risk. If management cannot provide private data on inventory turns, spoilage, cold-chain incidents, cash, debt, and Naver contract economics, investors are still underwriting a black box with a better quarter attached. Kurly is investable only if diligence confirms that the recent profit turn is the start of compounding rather than the high-water mark of optimization.
