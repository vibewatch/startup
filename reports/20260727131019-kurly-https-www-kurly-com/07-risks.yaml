- id: TR004
  title: Regulatory / legal risk register
  columns:
  - Rule / authority
  - Jurisdiction
  - Kurly exposure
  - What compliance appears to require
  - Residual risk
  rows:
  - - Labor Standards Act / MOEL
    - South Korea
    - Night and delivery-heavy operations raise working-hours, rest, and wage scrutiny.
    - Track hours, pay correctly, structure shifts lawfully, and withstand inspection.
    - Operational peak periods can still create compliance stress.
  - - E-Commerce Act / KFTC
    - South Korea
    - Kurly is a mail-order distributor and mobile retailer.
    - Disclose operator identity and terms, confirm orders, and handle delivery and refunds on time.
    - Customer-complaint spikes can turn into regulatory attention.
  - - PIPA / PIPC
    - South Korea
    - Kurly handles personal, transactional, and app-performance data through its app.
    - Maintain lawful data handling, deletion pathways, and privacy governance.
    - Incident history and control depth are not public.
  - - Food safety / MFDS
    - South Korea
    - Perishable food, packaging, and labeling issues can trigger both churn and formal scrutiny.
    - Keep cold-chain quality, labeling, and product-handling controls reliable.
    - Private cold-chain KPIs and recall history are undisclosed.
  - - Cross-border trade and customs
    - United States / South Korea
    - Kurly USA adds shipping, customs, and consumer-service complexity.
    - Adjust pricing, logistics, and compliance as duty rules change.
    - Cross-border economics may worsen faster than demand ramps.
  notes: This table summarizes the main public regulatory surfaces relevant to Kurly’s operating model in 2026 rather than
