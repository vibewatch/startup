      - number: '3.2'
        title: Delivery Service Parity, Buyer Switching, and Mission Competition
        blocks:
          - type: paragraph
            body: >-
              The sharpest competitive pressure on Kurly is not a single price war but a fragmentation of buyer
              missions. Kurly still benchmarks well on planned premium baskets because it combines dawn delivery with
              newer same-day surfaces, but the same public evidence shows at least four rival delivery logics. SSG is
              building a premium incumbent stack that now spans dawn, scheduled, one-hour, and 2-hour delivery using
              E-Mart hubs. Baemin pushes hard on urgent top-up needs by promising one-hour delivery of groceries and
              daily goods alongside free-delivery club benefits. Homeplus and Lotte keep the store-led substitute
              available for households that mainly want dependable supermarket replenishment online. Even the weaker
              fresh-commerce surfaces are informative: GSfresh's termination notice suggests some incumbents did not
              scale a standalone fresh proposition successfully. For Kurly, the result is low switching cost and high
              multi-homing. Buyers can keep Kurly for trusted premium fresh orders, then defect elsewhere for an urgent
              snack run, a low-price pantry basket, or a store-led same-day mission. That is why feature parity matters
              less than mission control and frequency capture.
            claimRefs:
