companyProfile:
  summary: >-
    Kurly (formerly Market Kurly) is South Korea's pioneering premium online grocery and lifestyle platform, founded in
    2015 by Sophie Kim (김슬아) in Seoul. The company introduced 새벽배송 (dawn delivery) — orders placed before midnight
    delivered before 7am — to Korea, building a decade-long cold-chain logistics advantage. In 2025, Kurly achieved its
    first annual operating profit (₩13.1 billion on ₩2.37 trillion in revenue), capping a 10-year journey from
    loss-making disruptor to profitable retail-tech platform. The company has since expanded beyond fresh food into
    Beauty Kurly, third-party fulfillment (FBK), and a strategic partnership with Naver, launching Kurly N Mart on Naver
    Plus Store. In May 2026, Naver invested ₩33 billion at a ₩2.8 trillion valuation, endorsing Kurly's renewed IPO
    ambitions. Q1 2026 saw record quarterly results: revenue up 28.4% YoY and operating profit up 1,277% YoY.
  foundedDate: '2015-05-01'
