  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Size and Growth
        blocks:
          - type: paragraph
            body: >-
              The Korean market boundary for Kurly is narrower than total e-commerce but broader than pure fresh-food
              dawn delivery. At the top level, WPIC sizes South Korea's 2024 e-commerce GMV at roughly ₩300 trillion, or
              about one-third of total retail, making Korea one of the most digitally penetrated retail markets
              globally. Inside that broad spend pool, the food and grocery opportunity can be measured through at least
              three different lenses. Deep Market Insights isolates a narrower online grocery market at $6.98 billion in
              2025, while ECDB's broader food e-commerce dataset shows $16.93 billion in 2025 and 10-15% online share.
              IMARC lands even higher at $16.99 billion because its definition includes a wider online grocery basket
              and more regional segmentation.


              The main analytical point is not that one source is definitively right and the others are wrong, but that
              scope matters. Narrow definitions typically emphasize digital-first grocery ordering, while broader
              definitions include food marketplace traffic, pantry replenishment, and mixed-format retail. All three
              lenses still point to the same directional conclusion: Korea's online grocery market is already large
              enough to support multiple scaled operators, yet still structurally underpenetrated versus the
              convenience, urban density, and smartphone usage that characterize Korean consumers. The resulting setup
              gives Kurly a real growth runway, but not an uncontested one, because large adjacent platforms can
              reallocate capital into grocery when category economics improve or strategic pressure rises.
            claimRefs:
              - CM001
              - CM002
              - CM003
