      - number: '7.2'
        title: Financial Fragility Has Fallen, but Not Disappeared
        blocks:
          - type: paragraph
            body: >-
              Kurly’s 2025-2026 financial story is materially better than the one investors saw in 2023, but it is still
              fragile by public-market standards. The company has now proven that annual operating profit is possible,
              and Q1 2026 showed that profit can coexist with real growth. That matters because the old short
              thesis—that dawn delivery was structurally incapable of making money at all—is no longer supported by the
              most recent record. However, the positive case should not be overstated. Kurly’s full-year 2025 operating
              margin was only about 0.55%, which means even modest deterioration in product mix, fulfillment
              productivity, marketing intensity, spoilage, labor expense, or partner terms could eliminate the cushion.
              Analysts and market commentary are therefore right to focus on sustainability rather than celebrating one
              clean break from the past.


              Valuation history reinforces the caution. TechCrunch captured a roughly 78% collapse between the 2021
              private-market peak and the 2023 withdrawal-era mark, and although the May 2026 Naver deal materially
              improved the narrative, it did not erase the lesson that ecommerce valuations can reset violently when
              public markets refuse growth-at-any-price stories. The new capital is strategically useful, but management
              itself tied it to logistics expansion and new businesses, which is another way of saying Kurly still needs
              to invest to defend service quality and broaden revenue. The core financial risk is therefore not imminent
              insolvency; it is that Kurly may have reached profitability before it reached durability.
