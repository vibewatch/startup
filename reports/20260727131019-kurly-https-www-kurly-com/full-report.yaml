    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - margin relapse
        - 2026 operating margin falls back toward breakeven after Q1.
        - Would show the rerating was driven by one favorable quarter rather than a durable earnings model.
        - Re-underwrite toward the bear case and avoid paying current prices.
      - - weak IPO market
        - KRX window stays shut or bankers push pricing below the current private mark.
        - Would signal public liquidity is not ready to validate Kurly's recovery valuation.
        - Treat private mark as an optimistic hold mark rather than a realizable exit value.
      - - competitive pricing pressure
        - Coupang, SSG, or other incumbents force heavier delivery or merchandising reinvestment.
        - Would squeeze already-thin margin structure and reduce confidence in profit durability.
        - Move valuation anchor back toward 0.5x sales or lower.
      - - cap-table overhang
        - Preference terms, option dilution, or secondary overhang materially reduce common-equity upside.
        - Would mean headline valuation overstates investor economics.
        - Require repricing or stronger downside protection.
      - - Naver synergy under-delivers
        - Kurly N-Mart growth slows materially or channel economics prove low-margin.
        - Would remove a central pillar of the bull case.
        - Keep recommendation at track/research-more until the channel is validated.
    notes: Kill triggers are meant to be monitorable valuation signals, not general business concerns.
