  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competition and Market Structure Are the Primary Strategic Risks
        blocks:
          - type: paragraph
            body: >-
              Kurly’s biggest external risk is that it now operates in a Korean commerce market where service
              expectations are being set by companies with much larger balance sheets, broader product scope, and deeper
              customer lock-in. WPIC’s market map shows Coupang near 40% share and Naver Shopping around 20%, which
              means Kurly is fighting for relevance in a market already controlled by scaled distribution platforms
              rather than by niche premium specialists. Coupang’s own 2026 disclosures make the threat concrete:
              billions of dollars of quarterly revenue, tens of millions of active commerce customers, and a multiyear
              ₩3 trillion logistics expansion that pushes Rocket Delivery toward nationwide coverage. Kurly does not
              need to beat all of that to remain viable, but it does need to stay sufficiently differentiated that
              customers keep paying for premium curation and predictable freshness rather than defaulting to a broader
              bundle.


              The challenge is that the moat is narrowing at the edge. Same-day and quick-commerce expectations are
              rising, Kurly itself has added midnight delivery, and Naver’s joint Kurly N Mart service is proving that
              partner distribution can accelerate growth faster than Kurly’s owned app alone. That is strategically
              useful, but it also creates a second-order dependency: if Naver changes traffic allocation, fee economics,
              merchandising priorities, or decides to build grocery capability more directly, Kurly’s newest growth
              vector becomes a vulnerability. In other words, the strategic risk is not just Coupang’s size; it is a
              future in which every major platform can offer “fast enough” grocery, leaving Kurly to defend premium
              positioning without premium slack.
            claimRefs:
