  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The current mark is defensible, but only with disciplined expectations
        blocks:
          - type: paragraph
            body: >-
              The May 2026 Naver transaction is the clearest live valuation anchor in the public record. Kurly disclosed
              a ₩33 billion third-party allotment, 498,882 new shares priced at ₩66,148, and a post-transaction Naver
              stake of 6.2%; multiple outlets converged on an implied corporate value of roughly ₩2.8 trillion. On
              trailing 2025 results, that works out to about 1.18x revenue and 0.79x GMV. On a Q1 2026 annualized basis,
              the revenue multiple compresses to about 0.94x, but the annualized operating-profit multiple is still
              about 28.9x and the implied P/E on annualized Q1 net income is roughly 34.5x. That mix says the mark is
              not a rescue valuation anymore; it already capitalizes a real recovery. The bullish read is that this is
              strategic money paired with logistics and Naver-channel expansion. The cautious read is that public
              materials still do not let outside investors reconstruct the fully diluted share count, preference stack,
              or balance-sheet cushion, so valuation support is still evidence-sensitive rather than fully underwritten.
