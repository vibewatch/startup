        - label: Coupang FY2025 P/S
          value: 0.81
          unit: x
          tone: neutral
          detail: Scaled Korean benchmark with much broader category scope.
        - label: Kurly FY2025 P/S
          value: 1.18
          unit: x
          tone: neutral
          detail: Current private mark on FY2025 revenue.
        - label: Ocado FY2025 P/S
          value: 1.11
          unit: x
          tone: neutral
          detail: Technology-heavy grocery reference.
        - label: Kurly Q1 2026 annualized P/S
          value: 0.94
          unit: x
          tone: positive
          detail: Current mark on annualized Q1 2026 revenue.
        - label: Instacart FY2025 P/S
          value: 2.75
          unit: x
          tone: positive
          detail: Profitable North American grocery platform comp.
    approximationNotes: Public peers use rough July 2026 market-cap snapshots; Kurly uses the May 2026 private financing mark.
    claimRefs:
      - CV030
      - CV034
  - id: FV003
    title: Valuation / return range
    type: range
    summary: Bear/base/bull valuation bands relative to the current ₩2.8T mark.
    data:
      items:
        - label: Bear case
          low: 1
          mid: 1.25
          high: 1.5
          unit: KRW trillion
          detail: '-64% to -46% vs current; margin relapse or weak IPO window.'
        - label: Base case
          low: 3
          mid: 3.25
          high: 3.5
          unit: KRW trillion
          detail: +7% to +25% vs current; run-rate holds and market pays ~1.0x-1.15x forward sales.
        - label: Bull case
          low: 4
          mid: 4.5
          high: 5
          unit: KRW trillion
          detail: +43% to +79% vs current; sustained growth plus IPO scarcity premium.
    approximationNotes: Scenario bands are judgment ranges derived from public run-rate and peer-multiple discipline.
    claimRefs:
      - CV050
      - CV052
  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: IC-style scoring of Kurly's current investment setup.
    data:
      items:
        - label: valuation stance
          value: Fair
          period: May 2026
          tone: neutral
          detail: Recovery already reflected; not distressed anymore.
        - label: profit proof
          value: Medium-high
          period: Q1 2026
          tone: positive
          detail: First full-year profit followed by record Q1 operating profit.
        - label: margin durability
          value: Low-medium
          period: FY2025/Q1 2026
          tone: warning
          detail: 2025 operating margin was only about 0.55%.
        - label: strategic support
          value: High
          period: May 2026
          tone: positive
          detail: Naver capital plus channel/logistics cooperation.
        - label: peer positioning
          value: Middle band
          period: Jul 2026
          tone: neutral
          detail: Above Coupang/Ocado, below Instacart on sales multiple.
        - label: information completeness
          value: Low
          period: Jul 2026
          tone: warning
          detail: Cap table, cash/debt, and IPO prep details remain private.
    approximationNotes: KPI labels summarize the chapter's public-evidence judgment and do not replace diligence.
    claimRefs:
