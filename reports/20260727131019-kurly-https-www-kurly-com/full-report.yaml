            body: >-
              Kurly's revenue quality is improving because growth is no longer coming only from direct 1P grocery
              resale. The strongest evidence points to a blended model: premium fresh-food retail remains the basket
              anchor, but Beauty Kurly, seller delivery, FBK fulfillment, and Naver-distributed grocery are doing more
              of the incremental growth work. BigGo and The Investor both attribute Q1 2026 improvement to balanced
              growth across food, beauty, and seller-delivery services, while StartupRecipe and Aju Press show that
              Naver-funded expansion is explicitly aimed at logistics and new businesses rather than simple
              balance-sheet patching. Unit economics also look directionally better. Gross margin has expanded every
              year since 2022, Q1 2026 SG&A ratio fell 2.2 percentage points year over year, and logistics optimization
              plus midnight delivery density improved asset utilization. Still, the economics are not yet fully
              underwritten: public sources do not disclose contribution margin by stream, CAC or payback, inventory
