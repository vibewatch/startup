      - number: '8.3'
        title: Public comparables place Kurly in the middle of the pack, not at a screaming discount
        blocks:
          - type: paragraph
            body: >-
              The public comp set is imperfect but still decision-useful. CompaniesMarketCap places Coupang at roughly
              $34.5 billion of 2025 revenue and about $28.0 billion of July 2026 market capitalization, or about 0.81x
              sales. Instacart sits at about $3.74 billion of 2025 revenue and roughly $10.3 billion of market
              capitalization, or about 2.75x sales, with its SEC shareholder letter showing real operating
              profitability. Ocado's revenue and market cap imply roughly 1.11x sales, while HelloFresh screens at only
              about 0.07x sales after prolonged growth disappointment. Kurly's 1.18x trailing-revenue multiple therefore
              sits above Coupang, Ocado, and HelloFresh but below Instacart. That looks directionally fair for a newly
              profitable, premium-positioned Korean grocery platform with real strategic backing, but it is not cheap
              enough to ignore execution risk. Market-structure evidence reinforces the caution: WPIC describes Coupang
              with about 40% share and Naver with about 20% share in Korean e-commerce, while third-party market-size
              estimates for online grocery vary widely depending on category definition. The comp lesson is that Kurly
              deserves recovery credit, not automatic scarcity premia.
