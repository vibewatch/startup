  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - diligence path
    rows:
      - - fully diluted share count and preference stack
        - Exact post-May-2026 cap table, option pool, preference terms, and any ratchets.
        - Without it, investors cannot translate headline valuation into actual ownership economics.
        - Request board-approved cap table, financing documents, and waterfall model.
      - - balance sheet and liquidity
        - Cash, debt, lease obligations, working-capital profile, and covenant package.
        - Thin operating margins make liquidity and cash conversion central to downside analysis.
        - Request audited FY2025 and latest interim balance-sheet package plus debt schedule.
      - - profit durability
        - Monthly 2026 gross margin, fulfilment cost, and SG&A bridge by quarter.
        - Public evidence shows one standout quarter but not yet a full-year durability proof.
        - Request monthly management accounts and cohort-level cost bridge.
      - - Naver channel economics
        - GMV, take rate, repeat behavior, and contribution margin for Kurly N-Mart / Naver-linked volumes.
        - A major part of the bull case depends on strategic-channel leverage, not just capital.
        - Request channel P&L and retention/repurchase data.
      - - IPO readiness
        - Lead-bank mandate, target timetable, governance readiness, and KRX/analyst feedback.
        - Exit probability materially affects whether current valuation offers enough risk-adjusted upside.
        - Request banker materials, governance checklist, and draft equity story.
    notes: >-
      These are the minimum private-data requests needed to move from a public-evidence track call to an investable
      underwriting view.
