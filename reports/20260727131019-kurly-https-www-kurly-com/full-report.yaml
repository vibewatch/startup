        title: Capital History, Valuation Reset, and Forward Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Financially, Kurly now looks less like a rescue story and more like a repriced growth company trying to
              earn back public-market credibility. The most important checkpoint is the May 2026 Naver financing: ₩33
              billion of new capital, 498,882 newly issued shares at ₩66,148 each, a 6.2% Naver stake, and an implied
              company valuation of about ₩2.8 trillion. That is strategically useful money because management explicitly
              tied it to logistics infrastructure and new businesses, and the Naver Plus Store channel appears to be
              expanding transaction volume quickly. But the broader capital story remains scarred. TechCrunch reported a
              roughly 78% drop from the 2021 pre-IPO peak to the 2023 withdrawal-era expectation, and even the 2026
              repricing remains below the earlier private peak. The deeper diligence issue is that Kurly's public
              disclosure is still far thinner than that of public peers: capital raised is visible, but current cash,
