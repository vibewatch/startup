        title: >-
          Kurly’s customer base is real, but public disclosure still relies on proxies rather than a full
          active-customer denominator
        blocks:
          - type: paragraph
            body: >-
              Kurly’s customer story is strongest when framed as a set of high-intent shopping missions rather than a
              single undifferentiated mass-market audience. Official and independent sources consistently describe a
              curated grocery platform that has expanded into beauty, living, and partner-distributed grocery while
              keeping a premium, trust-oriented promise. That supports a customer map with four visible layers: core
              repeat grocery members who use Kurly as a main shopping platform; routine household shoppers buying
              broader fresh and FMCG baskets; adjacent beauty and lifestyle shoppers who fit Kurly’s curation-led
              merchandising style; and newer Naver-acquired users who meet Kurly first inside Naver Plus Store rather
              than inside Kurly’s owned app. Public proof of scale is also meaningful even if incomplete. BigGo’s 2025
              coverage says MAU grew more than 30% year over year and members surpassed 1.4 million, while app-store
              surfaces and Naver channel data show that Kurly already operates at consumer scale across both iOS and
              Android. The underwriting caveat is disclosure quality: Kurly and the retained coverage do not publish a
              clean total active-customer count, so the chapter must rely on MAU, membership, ratings, and
              partner-channel behavior as the best available customer proxies.
