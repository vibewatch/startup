  - id: FR003
    title: Valuation and profitability timeline
    type: timeline
    layout: wide
    summary: Key milestones showing how Kurly moved from 2021 valuation peak to 2026 profit-led IPO reconsideration.
    data:
      items:
        - date: '2021-12-01'
          label: Private-market peak
          description: TechCrunch reported a $3.3B pre-IPO valuation context for Kurly in late 2021.
        - date: '2022-08-22'
          label: IPO review passed
          description: Kurly passed preliminary listing screening before later postponing the process.
        - date: '2023-01-04'
          label: IPO withdrawn
          description: Kurly scrapped the IPO amid weak market sentiment and a reported valuation collapse.
        - date: '2026-03-07'
          label: First annual operating profit
          description: FY2025 closed with ₩13.1B of operating profit on ₩2.3671T of revenue.
        - date: '2026-05-06'
          label: Naver marks value at ~₩2.8T
          description: Naver invested ₩33B for a 6.2% stake, materially improving valuation sentiment.
        - date: '2026-05-11'
          label: IPO hopes return
          description: >-
            Record Q1 2026 profit restarted public-market speculation, but commentary still treated listing as
            conditional.
    claimRefs:
      - CR011
      - CR012
      - CR016
      - CR018
      - CR019
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: How operating proof, valuation context, strategic support, and remaining gaps combine into a track recommendation.
    data:
      nodes:
        - id: proof
          label: Operating proof
          detail: FY2025 turned profitable; Q1 2026 accelerated sharply.
        - id: price
          label: Current price anchor
          detail: ₩2.8T Naver round establishes the live valuation mark.
        - id: peers
          label: Peer context
          detail: '1.18x sales is mid-pack: above Coupang/Ocado, below Instacart.'
        - id: synergy
          label: Strategic upside
          detail: Naver ties funding to logistics and channel expansion.
        - id: gaps
          label: Diligence blockers
          detail: Cap table, balance sheet, and durability data remain private.
        - id: call
          label: Recommendation
          detail: Track; fair valuation, high risk, buy only after deeper proof or better entry.
      edges:
        - from: proof
          to: call
        - from: price
          to: call
        - from: peers
          to: call
        - from: synergy
          to: call
        - from: gaps
          to: call
    approximationNotes: This is a decision map, not a quantitative model.
    claimRefs:
      - CV004
      - CV010
