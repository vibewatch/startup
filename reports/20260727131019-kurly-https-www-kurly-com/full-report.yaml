      - number: '8.2'
        title: Kurly has already lived through both a premium cycle and a severe reset
        blocks:
          - type: paragraph
            body: >-
              Historical context matters because Kurly's current price is not being discovered in a clean market.
              TechCrunch tracked the company at roughly $780 million in the April 2020 Series E, $2.2 billion in the
              July 2021 Series F, and $3.3 billion in the December 2021 pre-IPO round. By January 2023, when Kurly
              abandoned its IPO, reported expectations had collapsed to about $669 million—roughly an 80% drawdown from
              the late-2021 peak. That collapse is the strongest adverse datapoint in the chapter because it shows
              investors have already repriced Kurly once when growth quality and market windows stopped supporting
              private-market optimism. The 2026 Naver round therefore should be read as a recovery mark, not a
              first-principles greenfield valuation. LS Securities' framing is useful: the latest round is close to
              three times the approximately ₩1 trillion level associated with Naver's earlier investment, but it still
              sits well below the 2021 private peak. In other words, Kurly has repaired credibility, not erased history.
