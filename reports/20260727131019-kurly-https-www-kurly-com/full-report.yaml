        title: Identity, Model, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              Kurly, legally Kurly, Inc. (컬리), is a Seoul-headquartered private commerce company whose public identity
              has consolidated around the Kurly brand after earlier association with Market Kurly. The business is best
              understood as a premium online grocery and fresh-food platform rather than a general marketplace first:
              independent coverage and recent performance stories still anchor the company to dawn-delivery grocery,
              even as management has diversified into beauty, third-party fulfillment, paid membership, and Naver-linked
              storefronts. The current stage is late-stage private and effectively pre-IPO. That framing matters because
              the company is no longer being judged purely on category creation or top-line growth; it is being judged
              on whether a once loss-making cold-chain grocery model can sustain profitability at public-market scrutiny
              levels. Public datasets are not perfectly aligned on the founding date: most reporting and the corporate
              narrative point to 2015, while some labor-market data products encode 2014. The prudent chapter-one
              baseline is therefore 2015 founding with an explicit footnote that some third-party databases appear to
              capture an earlier incorporation or operating precursor.
