      - number: '8.4'
        title: Base-case upside exists, but it is not wide enough to ignore downside and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              A scenario view is the right way to close the chapter because Kurly is now investable on narrative, but
              not yet on complete disclosure. In the base case, annualized 2026 revenue near the Q1 run-rate and a
              roughly 1.0x-1.15x forward-sales outcome support a valuation of about ₩3.0 trillion to ₩3.5 trillion, only
              7% to 25% above the current mark. The bull case—roughly ₩4.0 trillion to ₩5.0 trillion—requires sustained
              growth above 20%, proof that Naver-linked demand and higher-margin adjacencies keep scaling, and an IPO
              market willing to pay a scarcity premium. The bear case—about ₩1.0 trillion to ₩1.5 trillion—remains
              credible if Q1 2026 was unusually favorable, competition forces reinvestment, or Korean IPO demand stays
              thin. That scenario math produces the clearest investment conclusion in the chapter: fair valuation, high
              risk, and a track recommendation rather than a buy recommendation. Kurly has earned a rerating, but the
              current price already embeds recovery. To move from track to buy, investors still need private evidence on
              the cap table, balance sheet, banker process, and whether profitability can survive a full year rather
              than one standout quarter.
