      - number: '3.3'
        title: Moat Durability, Adverse Pressure, and Strategic Optionality
        blocks:
          - type: paragraph
            body: >-
              Kurly's moat is real but narrow. The evidence supports a stronger gross-margin and premium-curation
              position than most mass-market peers, and recent results suggest Kurly can now expand selectively without
              returning immediately to all-out subsidy behavior. That said, this moat is not traffic scale,
              physical-store ubiquity, or unconstrained capital. Coupang still sets the category's outer boundary
              because it couples the largest commerce audience with logistics density and a demonstrated willingness to
              lose money in pursuit of share. Baemin can erode Kurly on high-frequency quick-commerce missions even if
              it never becomes the best premium grocer. SSG can pressure the same affluent household from the premium
              incumbent side. Oasis proves that disciplined niche operators can stay relevant without matching Kurly's
              scale. The most interesting strategic twist is Naver: not a direct like-for-like grocery operator, but a
              distribution partner whose growing stake and deeper integration improve Kurly's channel leverage and
              create plausible exit optionality. In other words, Kurly's best defense is to deepen profitable
              differentiation while borrowing scale where it can, not to imitate every rival simultaneously.
            claimRefs:
