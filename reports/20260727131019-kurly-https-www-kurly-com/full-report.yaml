        title: Leadership, Founder-Market Fit, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Kurly remains closely identified with founder and CEO Sophie Kim, whose background as a former investment
              banker helps explain the company’s strong capital-markets narrative and willingness to build a
              logistics-heavy premium position rather than a low-friction marketplace clone. Public financial
              communication also repeatedly surfaces CFO Kim Jong-hoon, who has become the most visible executive voice
              on quarterly profitability and IPO timing. That combination suggests a leadership structure centered on
              founder vision plus finance discipline rather than a broadly disclosed operating bench. The main
              governance limitation is not the absence of leadership names but the absence of public control-right
              detail. Reviewed sources identify major investors and strategic stakeholders, and Korea Herald notes that
              Naver’s 6.2% stake now exceeds Sophie Kim’s personal stake, but public materials do not disclose current
              board composition, voting agreements, liquidation preferences, or investor information rights. For
              diligence purposes, this means key-person dependence remains material around Sophie Kim even as economic
              influence on the cap table may already have shifted toward large strategic or financial backers.
