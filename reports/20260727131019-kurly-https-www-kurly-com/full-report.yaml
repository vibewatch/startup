              about 0.55%, public headcount datasets conflict sharply, and the business still operates inside a Korean
              e-commerce market where Coupang and Naver are far larger platforms. Kurly has proved the model can earn
              money; it has not yet proved that its premium cold-chain economics can compound with wide margin cushion.
