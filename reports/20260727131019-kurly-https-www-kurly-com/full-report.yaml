              complaints about recurring app errors, misdelivery, excessive packaging, and frozen items arriving in poor
              condition. Competitive pressure also stays high because Coupang, SSG, and Baemin each set strong
              expectations on speed, membership benefits, or urgent-delivery convenience. Kurly's product advantage is
