  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Mobile product surface and the core user job
        blocks:
          - type: paragraph
            body: >-
              Kurly's core product is best understood as a mobile-first commerce interface wrapped around a premium
              grocery operating model. The Apple App Store and Google Play descriptions both present one unified
              consumer surface that combines Market Kurly food commerce with Beauty Kurly, emphasizing curated
              assortment, trusted reviews, recipes and guides, and profile-based recommendation for beauty discovery.
              That matters because Kurly is not trying to win the mass market on lowest price or universal assortment;
              it is trying to reduce decision fatigue for higher-intent shoppers who value freshness, trust, and
              presentation. Public app metrics suggest the product is already scaled: Google Play shows 10 million-plus
              downloads and a 4.6 rating, while Apple shows a 4.8 rating from roughly 350,000 reviews. Still, the app
              and service experience are not frictionless. Review pages also surface recurring complaints about app
              errors, excessive packaging, misdelivery, and frozen goods arriving in weak condition. For diligence, that
              means the product is not merely the app shell. The real product is the app plus the cold-chain promise
              plus the last-mile execution that preserves trust.
