evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: >-
      Primary corporate-registration or audited corporate-history documentation that clarifies whether 2014 reflects
      incorporation, predecessor entity formation, or a database error.
    whyItMatters: >-
      Founding year is a chapter-one identity fact that later market-share, maturity, and employee-tenure comparisons
      will reuse.
    diligencePath: Obtain official Korean corporate registration records or investor data-room corporate-history materials.
    relatedQuestionRefs:
      - QO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Current board roster, investor board seats, voting rights, protective provisions, and preference-stack detail.
    whyItMatters: >-
      Control and exit economics cannot be judged from ownership headlines alone, especially after Naver’s stake
      increased above the founder’s reported personal holding.
    diligencePath: >-
      Request the latest cap table, shareholder agreement, board-consent schedule, and financing documents from
      management or lead counsel.
    relatedQuestionRefs:
      - QO008
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A management-confirmed current employee count with scope definition across parent company, subsidiaries, warehouse
      labor, and contractors.
    whyItMatters: >-
      The difference between 918 and 2,882 employees is large enough to distort operating-efficiency and productivity
      benchmarks.
    diligencePath: Request HRIS exports or audited headcount by entity and employment type as of Q1 2026 and year-end 2025.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-disclosure
    missingEvidence: Official disclosure of active customers, order frequency, retention, or cohort behavior for 2025-2026.
    whyItMatters: >-
      Membership counts alone do not reveal breadth of demand, basket quality, or the durability of recent
      profitability.
    diligencePath: >-
      Ask management for active-customer, order-frequency, and repeat-rate metrics by cohort, with definitions that
      reconcile to GMV and membership numbers.
    relatedQuestionRefs:
      - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A fuller chronology of internal product launches, debt facilities, and board/governance events not disclosed in
      public coverage.
    whyItMatters: >-
      The milestone table is strong on financing and profitability events but may understate internal operating
      inflections that matter for underwriting.
    diligencePath: >-
      Cross-check management’s internal timeline, board materials, and lender documents against the public chronology
      before using it as the sole record.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: dawn-delivery-market-share
    missingEvidence: >-
      A current third-party estimate of dawn-delivery market share by operator (Kurly, Coupang Rocket Fresh, SSG, Oasis)
      for 2025-2026.
    whyItMatters: >-
      Kurly’s strategic position is really about premium dawn and fresh delivery, but public sources mostly disclose
      broad e-commerce or food-market numbers instead of the precise subsegment share investors care about.
    diligencePath: >-
      Request a current sell-side or industry report focused specifically on Korean dawn-delivery GMV and order share,
      or obtain private retailer panel data.
    relatedQuestionRefs:
      - QM026
  - type: conflicting-data
    severity: minor
    topic: h1-2025-revenue-disclosure
    missingEvidence: >-
      An authoritative primary filing that resolves the small discrepancy between English-language press reports on
      Kurly’s first-half 2025 revenue figure.
    whyItMatters: >-
      The profit trend is clear, but inconsistent revenue transcription reduces confidence in exact half-year top-line
      comparisons.
    diligencePath: Use Kurly’s original Korean semiannual filing or IR deck rather than translated media summaries.
  - type: private-evidence-only
    severity: material
    topic: customer-cohort-unit-economics
    missingEvidence: >-
      Order frequency, gross margin, CAC, and retention by customer cohort and region for Kurly’s fresh, beauty, and N
      Mart users.
    whyItMatters: >-
      Without cohort economics it is impossible to know whether Kurly’s recent profitability is driven by durable repeat
      behavior or by temporarily favorable mix and cost controls.
    diligencePath: >-
      Request internal cohort dashboards or a board-level operating review that splits GMV, CAC, and retention by
      channel and category.
  - type: private-evidence-only
    severity: material
    topic: competitive-pricing-architecture
    missingEvidence: >-
      A current apples-to-apples comparison of basket pricing, delivery fees, and membership economics across Kurly,
      Coupang, Naver, and SSG for the same grocery SKUs.
    whyItMatters: >-
      Kurly’s premium positioning only works if quality and convenience offset any price gap; public reporting does not
      quantify that tradeoff cleanly.
    diligencePath: Run a live basket scrape for 50-100 overlapping grocery items across leading Korean apps in the same week.
    relatedTableRefs:
      - TM003
      - TM004
  - type: enumeration-incomplete
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Region-by-region delivery cutoffs, free-delivery thresholds, and paid-membership economics for Kurly, Coupang,
      SSG, Baemin, Homeplus, and Lotte under the same shopping basket assumptions.
    whyItMatters: >-
      Switching-cost analysis changes materially when one platform waives fees or shortens cutoffs in a specific
      district, so public homepage evidence alone can overstate or understate Kurly's real parity.
    diligencePath: >-
      Run synchronized live-cart checks in Seoul, Bundang, Busan, and one non-core city; capture screenshots of cutoff
      times, basket minimums, and membership discounts from each app on the same day.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: bmart-economics
    missingEvidence: >-
      Standalone Bmart 2025-2026 revenue, profitability, and geographic coverage broken out from Baemin's broader app
      metrics in accessible public English sources.
    whyItMatters: >-
      Without a clean Bmart disclosure, diligence cannot tell whether Baemin's quick-commerce threat is already scaled
      and self-funding or still mostly an attachment to the food-delivery super-app.
    diligencePath: >-
      Review Korean-language Woowa Brothers disclosures, Delivery Hero materials, and local market-research panels that
      split Baemin food delivery from Bmart quick commerce.
    relatedQuestionRefs:
