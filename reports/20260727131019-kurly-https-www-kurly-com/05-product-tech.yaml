- id: cold-chain-logistics-and-delivery-architecture
  title: Cold-chain logistics and delivery architecture
  body: 'Kurly''s most defensible technology is operational rather than purely software-defined. The company keeps presenting full cold-chain handling, temperature-separated packaging, and dawn delivery as the customer-facing outcome of a tightly controlled logistics system. In 2025-2026 public sources tied that system to three named core logistics centers—Gimpo, Pyeongtaek, and Changwon—plus an Ansan 3PL cold-storage site opened to reinforce FBK. The February 2026 Midnight Star Delivery launch is strategically important because it shows Kurly using software and routing logic to widen asset utilization: same infrastructure, longer fulfillment window, more order density. Aju Press reported that orders placed between the previous night''s cutoff and 3 p.m. can now reach customers before midnight, initially in Seoul and Gyeonggi with planned wider rollout. Separate H1 2025 reporting says Saetbyeol coverage expanded into 11 new regions and even added one-day service in Jeju. The pattern is clear:
    Kurly''s moat is not one heroic warehouse or one app feature, but a network that keeps reusing the same cold-chain backbone across next-morning, same-day, and third-party fulfillment workflows.'
