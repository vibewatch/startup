- id: data-ai-moat-and-technology-limits
  title: Data, AI moat, and technology limits
  body: 'Kurly''s data and software layer appears valuable, but it is earlier-stage than the company''s logistics reputation. The strongest evidence today is indirect: app-store copy highlights personalized beauty recommendations tied to profile data, trusted reviews, and guided merchandising; Google Play''s data-safety disclosure shows the app collects broad identity, purchase-history, and app-activity fields; and management says an AX Center created in July 2025 will lead company-wide AI transformation and new-business planning. That suggests Kurly has the ingredients for better demand forecasting, pricing, and personalization, but not yet a publicly quantified AI moat comparable to its cold-chain one. The more immediate product-tech risk is execution leakage. App Store and Google Play reviews still surface complaints about recurring app errors, misdelivery, excessive packaging, and frozen items arriving in poor condition. Competitive pressure also stays high because Coupang, SSG, and
    Baemin each set strong expectations on speed, membership benefits, or urgent-delivery convenience. Kurly''s product advantage is therefore real but conditional: it works best when the software, packaging, and route-level operations all perform together.'
