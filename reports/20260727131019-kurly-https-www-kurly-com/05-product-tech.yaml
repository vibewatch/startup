- id: ecosystem-expansion-and-channel-reuse
  title: Ecosystem expansion and channel reuse
  body: 'Kurly''s 2025-2026 product roadmap shows disciplined adjacency expansion rather than random category sprawl. Beauty Kurly has become the clearest proof that the company can sell more than fresh food to the same quality-sensitive user base, growing 23% in 2025 and another 20.2% in Q1 2026. FBK and other third-party seller services show the same asset reuse from the supply side, with H1 2025 and Q1 2026 data both pointing to roughly 50%-plus growth as Kurly monetizes logistics capacity for outside merchants. The Naver partnership is even more strategically important because it extends Kurly beyond its owned app. Kurly N Mart launched on Naver Plus Store in September 2025, then compounded quickly: monthly GMV moved more than sevenfold within months, average monthly transaction volume rose over 50%, and Aju Press reported that more than 90% of users were Naver Plus members with repurchase rates around 60%. Kurly Nextmile closes the loop by delivering dawn orders for Naver-linked sellers.
    This makes Kurly less like a single storefront and more like a premium grocery infrastructure layer distributed across owned and partner channels.'
