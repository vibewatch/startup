tables:
- id: TE001
  title: Kurly product and service portfolio
  columns:
  - Surface / service
  - What it does
  - Current evidence / metric
  - Why it matters
  rows:
  - - Kurly app (Market Kurly + Beauty Kurly)
    - Unified mobile storefront for grocery, beauty, reviews, reorder behavior, and merchandising guidance.
    - 10M+ Android downloads; 4.6 Google Play rating; 4.8 App Store rating with ~350k evaluations.
    - Mobile scale turns merchandising and customer data into a reusable demand layer.
  - - Saetbyeol / dawn delivery
    - Core next-morning refrigerated grocery service using temperature-separated packaging and cold-chain handling.
    - Still described as the flagship promise across app surfaces and 2025-2026 reporting.
    - Defines Kurly's brand trust and willingness-to-pay in premium grocery.
  - - Midnight Star Delivery
    - Extends cutoffs into same-day / before-midnight fulfillment using existing logistics nodes.
    - Rolled out in February 2026; orders before 3 p.m. reach customers by midnight.
    - Improves asset utilization and reduces the gap versus faster convenience rivals.
  - - Beauty Kurly
    - Beauty and cosmetics channel inside the same commerce surface.
    - Grew 23% in 2025 and 20.2% in Q1 2026.
    - Proves that Kurly can cross-sell into higher-margin adjacencies.
  - - Kurly N Mart on Naver
    - Fresh-grocery storefront inside Naver Plus Store with dawn and same-day options.
    - GMV rose more than 7x within months; average monthly transaction growth exceeded 50%.
    - Adds demand outside Kurly's owned app and lowers acquisition dependence.
  - - FBK / Kurly Nextmile / Members
    - Combines seller fulfillment, partner delivery, and paid-retention economics.
    - FBK/3P grew roughly 50%-plus; members exceeded 1.4M by end-2025.
    - Monetizes logistics and loyalty beyond first-party grocery baskets.
  notes: Rows group closely linked modules when the public record reports them as one operating system rather than as standalone P&Ls.
