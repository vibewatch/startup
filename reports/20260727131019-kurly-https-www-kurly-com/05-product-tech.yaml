- id: TE002
  title: Technology stack and infrastructure overview
  columns:
  - Capability layer
  - Publicly visible description
  - Status in 2026
  - Competitive implication
  rows:
  - - Mobile commerce UX
    - Unified grocery + beauty app with reviews, recipes/guides, and personalized recommendation surfaces.
    - Scaled and well adopted, but still exposed to app-error complaints.
    - Helps Kurly win trust-sensitive missions rather than lowest-price traffic.
  - - Cold-chain packaging
    - Temperature-separated packaging and full cold-chain handling are central in public product copy.
    - Mature and core to brand promise.
    - Harder to copy than front-end features because it sits inside operations.
  - - Warehouse and order orchestration
    - Core centers in Gimpo, Pyeongtaek, and Changwon are repeatedly cited in profitability and optimization reporting.
    - Operationally proven; still being extended into same-day and 3P use cases.
    - Network density becomes a moat when multiple services share the same fixed assets.
  - - Seller fulfillment / partner APIs
    - FBK and Kurly Nextmile let outside sellers use Kurly logistics and Naver-linked delivery channels.
    - Fast-growing but still scaling.
    - Turns logistics from a cost center into a platform capability.
  - - Data / AI / AX layer
    - App personalization plus a July 2025 AX Center intended to drive company-wide AI use.
    - Promising but early in public proof.
    - Could deepen forecasting and personalization, but is not yet the main public moat.
  notes: This table synthesizes product copy, app-store disclosures, and operating commentary rather than reproducing an internal architecture diagram.
