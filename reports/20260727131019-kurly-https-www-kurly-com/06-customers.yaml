    {
      "id": "experience-satisfaction-and-frictions",
      "title": "Customer experience is still Kurly’s moat when execution works, and the main customer risks are price sensitivity plus service leakage",
      "body": "Kurly’s customer experience remains differentiated because it is built around trust, curation, and a premium shopping feel rather than around being the absolute cheapest basket in Korea. TechCrunch described the brand as consumer-centric and quality-led, the official 10th-anniversary campaign again centered on “good things,” and Google Play copy still emphasizes detailed guides, recipes, reviews, profile-based beauty recommendations, and direct service contact. Visible satisfaction proxies are healthy: Apple’s review surface shows a 4.8 score from roughly 350,000 ratings, and Google Play still shows 10 million-plus installs with a 4.6 rating and more than 43,000 reviews. But the adverse evidence matters precisely because Kurly charges for trust. The retained Apple review page surfaces repeated complaints about app errors, missing or misdelivered products, refund dissatisfaction, and long waits for resolution. When service fails, customers immediately question fees, compensation, and whether the premium is worth paying. That leaves the customer thesis balanced rather than perfect: Kurly has strong adoption and loyalty signals, but the public record still lacks clean disclosure on churn, CAC, concentration, and how often service issues actually erode high-value cohorts.",
