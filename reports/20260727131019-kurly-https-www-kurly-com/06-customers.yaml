    {
      "id": "membership-and-retention",
      "title": "Kurly Members is the clearest retention engine, but public cohort durability is still under-disclosed",
      "body": "The highest-quality retention evidence in the public record is the paid membership program. Multiple 2025-2026 sources converge on the same picture: Kurly Members reached roughly 1.4 million valid subscribers by the end of 2025, net additions exceeded 200,000 in the fourth quarter alone, and management continues to widen benefits instead of cutting them back. The official newsroom shows why the product matters. Kurly priced the subscription at just KRW 1,900 per month while returning KRW 2,000 in immediate points, layered on member-only pricing and coupon packs, and then strengthened shipping economics through temporary unlimited free delivery above KRW 20,000. That kind of design suggests the program is meant to increase order frequency and habit, not merely to monetize a passive badge. Partner-channel evidence reinforces the point. Aju Press reported a 60% repurchase rate at Kurly N Mart, around 90% Naver Plus member mix, and far heavier repeat behavior among members than non-members. What remains missing is the investor-grade retention view: no public churn curve, cohort table, NRR, or member GMV-per-subscriber disclosure appears in the retained sources.",
