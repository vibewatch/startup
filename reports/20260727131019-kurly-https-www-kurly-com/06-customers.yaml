    {
      "id": "acquisition-and-channel-expansion",
      "title": "Customer acquisition has shifted from pure owned-app growth toward logistics-led regional expansion and Naver-assisted channel capture",
      "body": "Kurly’s 2025-2026 acquisition pattern looks materially better than a simple “buy more app traffic” story. First, H1 2025 reporting ties new-customer gains to the extension of Saetbyeol delivery into 11 more regions and later into Jeju, which means coverage expansion still creates real demand when the service promise becomes geographically available. Second, the Naver alliance created a meaningfully cheaper and broader discovery surface. Kurly and Naver explicitly described the partnership as a route to large-scale new-customer acquisition and more diverse age cohorts, and the resulting channel data looks strong: startuprecipe and Aju reported more than sevenfold GMV growth for Kurly N Mart after launch, while Q1 2026 sources said March transaction value was roughly nine times the September 2025 base. Just as important, the channel does not look like one-off sampling. Aju’s February 2026 report says repeat purchase reached 60%, produce and meat baskets rose sharply, FMCG sales increased more than fivefold, and about 80% of transactions occurred inside the Naver Plus Store app. The implication is that Kurly is expanding from a premium owned-app audience into a partner-distributed routine-grocery audience without abandoning its curation-led positioning.",
