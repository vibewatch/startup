- id: competitive-landscape
  title: Competitive Landscape
  body: 'Korea''s grocery competition is asymmetric. Kurly is not fighting a field of equally scaled premium peers; it is competing against larger horizontal ecosystems that can use grocery to deepen retention, membership, logistics density, and wallet share. WPIC places Coupang at roughly 40% of Korean e-commerce overall and Naver Shopping near 20%, which means the two biggest platforms enter grocery with far more traffic, distribution leverage, and capital than Kurly can match on its own. Coupang''s March 2024 plan to invest ₩3 trillion to expand Rocket Delivery, add eight-plus fulfillment centers, and reach 88% national coverage by 2026 is especially important because it compresses the geographic advantage that premium dawn-delivery specialists once enjoyed.


    Kurly''s response has been to differentiate rather than imitate. It has moved from a fresh-food-only identity toward a broader premium grocery-plus-lifestyle platform, adding Beauty Kurly, third-party seller fulfillment, Kurly N Mart with Naver, and faster fulfillment modes. That said, the sector still shows weak average profitability. LS Securities'' market summary notes Q1 2026 operating losses at major peers including Coupang, SSG.com, and 11Street, even as Kurly posted a strong quarter. This implies two things for diligence: first, Kurly''s recent profitability looks differentiated rather than merely cyclical; second, the category remains vulnerable to renewed subsidy cycles if larger rivals choose to trade margin for share.'
