tables:
- id: TM001
  title: Korea online grocery market sizing lenses
  columns:
  - Lens / Source
  - 2024/2025 Value
  - Growth Outlook
  - Boundary Definition
  - Implication for Kurly
  rows:
  - - WPIC Korea e-commerce market
    - ₩300T GMV in 2024 (~$215B)
    - Overall e-commerce expected to keep double-digit growth into 2025
    - All Korean e-commerce across categories; not grocery-specific
    - Defines outer digital retail ceiling and confirms grocery is competing in a highly digital retail environment
  - - WUSATA online food shopping lens
    - KRW 47T online food purchases and KRW 29T food-service transactions in 2024
    - Food purchases grew 14.8% YoY in 2024
    - Broad online food spend including grocery-related food purchases
    - Shows food already scales well beyond a niche and is growing faster than total online shopping
  - - Deep Market Insights
    - $6.98B in 2025
    - 29.48% CAGR to $71.4B by 2034
    - Narrower online grocery market definition focused on grocery ordering
    - Useful lower-bound SAM for pure online grocery and premium fresh delivery
  - - IMARC Group
    - $16.99B in 2025
    - 23.54% CAGR to $120.0B by 2034
    - Broader online grocery definition including multiple product and platform formats
    - Useful upper-bound market lens when including broader pantry and multi-format grocery behavior
  - - ECDB food e-commerce
    - $16.93B in 2025
    - 5-10% YoY growth into 2026
    - Transaction-based food e-commerce market including fresh food as top category
    - Grounds Kurly against an observed 2025 digital food market rather than only forecast models
  notes: Multiple sizing lenses are intentionally preserved because source definitions differ; lower numbers describe narrower grocery-only activity while higher numbers include broader food e-commerce behavior.
