- id: TM003
  title: Competitive positioning across Korean grocery-related commerce
  columns:
  - Player
  - Relative Scale
  - Profitability Signal
  - Primary Strength
  - Primary Weakness
  rows:
  - - Kurly
    - GMV ₩3.534T in 2025; premium niche vs. horizontal giants
    - 2025 annual OP +₩13.1B; Q1 2026 OP +₩24.2B
    - Fresh-food curation, brand trust, higher basket, premium positioning
    - Lower traffic scale and lower capital firepower than Coupang or Naver ecosystems
  - - Coupang / Rocket Fresh
    - Largest e-commerce player; ~40% overall market share
    - Q1 2026 operating loss of about -$242M while still investing heavily
    - Logistics density, nationwide reach, high purchase frequency, membership moat
    - Lower premium curation signal; grocery can be one category among many
  - - Naver Shopping + Kurly N Mart
    - ~20% overall e-commerce share plus discovery traffic advantage
    - Platform economics stronger than pure inventory retail
    - Search/discovery distribution and partnership leverage
    - Less vertically controlled grocery experience than direct operators
  - - SSG.com
    - Major incumbent in premium grocery and department-store adjacency
    - Q1 2026 operating loss of about -₩21.9B
    - Offline sourcing relationships and premium retail heritage
    - Weaker economics and less logistics scale than Coupang
  - - Oasis / other niche specialists
    - Smaller than Kurly but focused in health/organic grocery
    - Sector reputation for better unit discipline
    - Organic / value-for-quality positioning with niche loyalty
    - Lower brand breadth and less ecosystem reach
  notes: Relative scale mixes platform-level market share with company-level grocery positioning because public disclosures are uneven across Korean private and divisional operators.
