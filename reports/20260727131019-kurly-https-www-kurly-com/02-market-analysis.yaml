chapter:
  number: 2
  title: Market Analysis
  summary: Kurly operates inside a Korean e-commerce market that was about ₩300 trillion ($215 billion) in 2024, with online grocery definitions ranging from roughly $7 billion for narrower pure-play grocery to about $17 billion for broader food e-commerce in 2025. Demand is supported by Korea's 97.9% internet penetration, 81.6% urbanization, and 8.05 million single-person households, but competition is brutal because Coupang is scaling a nationwide logistics moat while quick commerce resets delivery expectations. Kurly's positioning remains strongest in premium fresh food, higher-ticket baskets, and curated assortment extensions such as beauty and fulfillment rather than in mass-market price leadership.
sections:
- id: market-size-growth
  title: Market Size and Growth
  body: 'The Korean market boundary for Kurly is narrower than total e-commerce but broader than pure fresh-food dawn delivery. At the top level, WPIC sizes South Korea''s 2024 e-commerce GMV at roughly ₩300 trillion, or about one-third of total retail, making Korea one of the most digitally penetrated retail markets globally. Inside that broad spend pool, the food and grocery opportunity can be measured through at least three different lenses. Deep Market Insights isolates a narrower online grocery market at $6.98 billion in 2025, while ECDB''s broader food e-commerce dataset shows $16.93 billion in 2025 and 10-15% online share. IMARC lands even higher at $16.99 billion because its definition includes a wider online grocery basket and more regional segmentation.


    The main analytical point is not that one source is definitively right and the others are wrong, but that scope matters. Narrow definitions typically emphasize digital-first grocery ordering, while broader definitions include food marketplace traffic, pantry replenishment, and mixed-format retail. All three lenses still point to the same directional conclusion: Korea''s online grocery market is already large enough to support multiple scaled operators, yet still structurally underpenetrated versus the convenience, urban density, and smartphone usage that characterize Korean consumers. The resulting setup gives Kurly a real growth runway, but not an uncontested one, because large adjacent platforms can reallocate capital into grocery when category economics improve or strategic pressure rises.'
