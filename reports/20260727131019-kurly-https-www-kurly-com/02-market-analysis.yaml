- id: TM004
  title: Consumer segment analysis for Korean online grocery
  columns:
  - Segment
  - Observed Need State
  - Behavior Pattern
  - Why Kurly Fits / Misses
  - Risk to Kurly
  rows:
  - - Urban single professional
    - Small household, long work hours, low tolerance for store trips
    - High mobile use; frequent curated fresh purchases; willing to pay for convenience
    - Strong fit because trust, freshness, and scheduled delivery reduce planning friction
    - May drift to quick commerce if Kurly is too slow for urgent missions
  - - Young 20s/30s one-person household
    - Portion control, budget sensitivity, storage limits
    - Online-heavy and likely to split orders or compare apps
    - 'Partial fit: Kurly wins on quality but loses if minimum basket feels expensive'
    - Coupang and low-price channels can win routine pantry orders
  - - Family quality shopper
    - Needs fresh produce, meal kits, and reliable next-day supply
    - Less frequent than singles but larger baskets
    - Good fit where Kurly’s curation and premium fresh assortment justify higher AOV
    - Can defect to SSG or Coupang when promotions are aggressive
  - - Value-maximizing mobile grocery buyer
    - Price and promotions first; low loyalty
    - High cross-shopping, high responsiveness to discounts and memberships
    - Weak fit if decision is driven mainly by lowest delivered price
    - Price wars led by Coupang compress Kurly’s room to scale mass-market share
  notes: Segment rows synthesize public consumer-survey evidence with platform basket patterns; they are behavioral archetypes, not mutually exclusive census buckets.
  enumerationScope:
    coverage: partial
    basis: Maps the highest-value and highest-frequency grocery buyer archetypes evident in 2024-2026 Korean survey and market reporting, not every demographic micro-segment.
