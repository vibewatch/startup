- calloutType: insight
  title: Single-person households are a structural demand engine, not a short-term fad
  body: With 8.05 million one-person households and nearly 40% of Seoul households living alone, Korea supplies exactly the high-frequency, convenience-seeking user base that premium scheduled grocery delivery needs.
  claimRefs:
  - CM009
  - CM010
  - CM011
- calloutType: risk
  title: Coupang can reset the category economics faster than Kurly can
  body: Coupang’s 3 trillion won logistics buildout and overall 40% e-commerce share mean Kurly cannot assume that premium grocery remains a protected niche if delivery speed, membership incentives, or pricing intensify again.
  claimRefs:
