- id: kurly-positioning-tam
  title: Kurly's Market Positioning and TAM
  body: 'Kurly''s practical TAM should be framed as a layered opportunity rather than one giant grocery number. The broadest outer ring is Korean retail e-commerce, already about $215 billion in GMV. The more relevant serviceable market is online food and grocery, where broad 2025 estimates cluster around $16.9-17.0 billion while narrower online-grocery estimates sit near $7.0 billion. Kurly''s 2025 GMV of ₩3.534 trillion converts to roughly $2.5 billion at prevailing exchange rates, implying meaningful scale against either market lens: approximately one-fifth of broad online food e-commerce, or a much larger share of the narrower premium fresh-delivery segment.


    That does not mean Kurly owns grocery in Korea. WUSATA''s consumer survey shows Kurly far behind Coupang in primary platform share, which confirms that its beachhead is not mass grocery frequency but premium, trust-driven, higher-basket missions. Kurly''s higher average ticket, strong fresh-food perception, and traction in beauty, 3P fulfillment, and Naver-distributed grocery suggest the company is best understood as a premium grocery infrastructure platform expanding outward from a curated-food core. The next growth vector is therefore adjacencies that reuse the same customer trust and cold-chain/logistics asset base—beauty, same-day convenience, external fulfillment, and channel partnerships—without forcing Kurly into a pure price war with the largest horizontal marketplaces.'
