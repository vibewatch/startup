  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dawn-delivery-market-share
    missingEvidence: A current third-party estimate of dawn-delivery market share by operator (Kurly, Coupang Rocket Fresh, SSG, Oasis) for 2025-2026.
    whyItMatters: Kurly’s strategic position is really about premium dawn and fresh delivery, but public sources mostly disclose broad e-commerce or food-market numbers instead of the precise subsegment share investors care about.
    diligencePath: Request a current sell-side or industry report focused specifically on Korean dawn-delivery GMV and order share, or obtain private retailer panel data.
    relatedQuestionRefs:
    - QM026
  - type: conflicting-data
    severity: minor
    topic: h1-2025-revenue-disclosure
    missingEvidence: An authoritative primary filing that resolves the small discrepancy between English-language press reports on Kurly’s first-half 2025 revenue figure.
    whyItMatters: The profit trend is clear, but inconsistent revenue transcription reduces confidence in exact half-year top-line comparisons.
    diligencePath: Use Kurly’s original Korean semiannual filing or IR deck rather than translated media summaries.
  - type: private-evidence-only
    severity: material
    topic: customer-cohort-unit-economics
    missingEvidence: Order frequency, gross margin, CAC, and retention by customer cohort and region for Kurly’s fresh, beauty, and N Mart users.
    whyItMatters: Without cohort economics it is impossible to know whether Kurly’s recent profitability is driven by durable repeat behavior or by temporarily favorable mix and cost controls.
    diligencePath: Request internal cohort dashboards or a board-level operating review that splits GMV, CAC, and retention by channel and category.
  - type: private-evidence-only
    severity: material
    topic: competitive-pricing-architecture
    missingEvidence: A current apples-to-apples comparison of basket pricing, delivery fees, and membership economics across Kurly, Coupang, Naver, and SSG for the same grocery SKUs.
    whyItMatters: Kurly’s premium positioning only works if quality and convenience offset any price gap; public reporting does not quantify that tradeoff cleanly.
    diligencePath: Run a live basket scrape for 50-100 overlapping grocery items across leading Korean apps in the same week.
    relatedTableRefs:
    - TM003
    - TM004
