- id: market-structure-trends-regulation
  title: Market Structure, Trends, and Regulation
  body: 'Kurly''s market structure has four decisive forces: concentrated consumer platforms, quality-sensitive food suppliers, capital-intensive cold-chain logistics, and tightening regulatory oversight for online food flows. Supplier power is mixed. Premium farms, imported food brands, and beauty brands matter because curation is part of Kurly''s brand promise, but rising scale improves Kurly''s purchasing leverage, as seen in the company''s steadily improving gross margins. Buyer power, by contrast, is high because consumers can multi-home easily across Kurly, Coupang, Naver, SSG, and offline channels, and switching costs are low unless a platform wins on trust, convenience, or membership economics.


    Several structural trends still help Kurly. Quick commerce is expanding, AI-led personalization is moving from feature to expectation, and cross-channel partnerships like Kurly''s Naver integration reduce customer acquisition friction. Yet the same forces also create headwinds. Quick commerce shortens acceptable delivery windows; imported food inspection is increasing, with Korea''s food regulator doubling 2025 online-food inspection targets from 3,400 to 6,000; and imported food inflation plus FX volatility can pressure both consumer demand and gross margin. Kurly''s opportunity therefore comes from using technology and logistics density to turn these pressures into premium service advantages faster than competitors can commoditize them.'
