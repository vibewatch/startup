- id: consumer-demographics-behavior
  title: Consumer Demographics and Behavior
  body: 'Kurly''s demand thesis fits unusually well with Korea''s demographic structure. DataReportal reports 50.6 million internet users and 60.9 million mobile connections, meaning digital access is effectively universal among addressable urban consumers. It also reports that 81.6% of the population lives in urban areas, which matters because dense apartment living, long commutes, and small kitchens all increase the value of pre-scheduled delivery and curated fresh assortment. The single most important household shift is the rise of one-person households: multiple sources point to 8.05 million single-person households in 2024, or 36.1% of all households, with Seoul near 39.8%.


    That demographic does not merely buy more online; it buys differently. WUSATA''s Korea grocery survey says 85.7% of single-person households have bought groceries online, and it also shows that Coupang wins mass-market frequency while Kurly posts a higher average transaction value at roughly ₩48,200 per purchase. The Straits Times'' reporting on sobun groups—strangers splitting groceries and delivery orders—adds useful color: smaller households face portion, storage, and basket-size friction that make premium curation, smaller pack architecture, and dependable freshness especially valuable. Kurly therefore benefits less from being the cheapest platform and more from being the platform that makes high-trust, low-regret food buying easy for urban professionals and small households.'
