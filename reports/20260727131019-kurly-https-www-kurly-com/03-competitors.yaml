- id: TP003
  title: Membership, packaging, and feature comparison
  columns:
  - Player
  - Membership / promotion layer
  - Delivery economics visible publicly
  - Non-grocery breadth
  - Trust / quality posture
  - Implication for Kurly
  rows:
  - - Kurly
    - Paid-member retention layer; not the broadest bundle
    - Service breadth expanded to dawn plus selective same-day surfaces
    - Beauty, 3P fulfillment, and Naver channel extension
    - Premium curation and freshness trust
    - Differentiation depends on maintaining quality and basket economics rather than raw bundle breadth
  - - Coupang
    - Wow membership and Rocket ecosystem are central on the official surface
    - Large bundle can subsidize delivery and returns across categories
    - Very broad general marketplace
    - Convenience and habit over premium curation
    - Bundling power can overwhelm narrower specialists if Kurly lets service parity close
  - - SSG.com
    - Sseuk 7 Club rewards and 40,000 won free-delivery threshold disclosed for 2-hour service
    - Combines scheduled, dawn, and rapid delivery with store-backed logistics
    - Department-store and grocery adjacency
    - Premium incumbent trust with store inventory
    - Most credible incumbent attempt to replicate premium grocery plus faster offline fulfillment
  - - Baemin
    - Baemin Club free-delivery benefits
    - One-hour delivery and food-delivery convenience dominate
    - Food, groceries, flowers, electronics, and daily goods
    - Speed and app frequency matter more than curated assortment
    - High risk on urgent missions and consumer habit, lower overlap on premium stock-up baskets
  - - Gmarket / 11Street
    - Promotion-led marketplace memberships and discounts
    - Economics not centered on specialized fresh SLAs
    - Broad general merchandise marketplaces
    - Price search and assortment breadth over freshness authority
    - Pressure Kurly on commodity pantry and discount missions, not on premium brand trust
  - - Oasis
    - Loyal-customer intensity more visible than a broad bundle
    - Economics supported by repeat customers, not disclosed national subsidy offers
    - Narrower, eco-focused grocery scope
    - Organic and value-for-quality trust
    - Small but disciplined rival that can win affluent, health-conscious users without matching Kurly's scale
  notes: Table compares user-facing packaging and membership logic, not realized net pricing; public promo copy and delivery thresholds are dynamic and often region-specific.
