tables:
- id: TP001
  title: Korean competitor profile table
  columns:
  - Player
  - Category
  - Latest public scale signal
  - Profitability signal
  - Key strength vs Kurly
  - Key weakness / threat to Kurly
  rows:
  - - Coupang
    - Horizontal scale platform
    - Q1 2026 revenue $8.5B; 33.25M Q1 app users
    - Q1 2026 operating loss $242M; 27.0% gross margin
    - Traffic scale, self-operated logistics, Rocket/Wow bundle
    - Can reset speed and pricing expectations; weaker premium-curation signal than Kurly
  - - SSG.com
    - Premium incumbent / store-network grocer
    - 2-hour pilot expanding toward ~50 E-Mart hubs by end-2026
    - Q1 2026 operating loss ₩21.9B
    - Offline sourcing, premium retail heritage, store hubs
    - Still loss-making and behind Coupang on ecosystem scale
  - - Baemin / Bmart
    - Quick-commerce super-app
    - 22.55M Q1 2026 app users; one-hour goods delivery surface
    - Standalone Bmart economics not cleanly disclosed in reviewed English sources
    - High-frequency demand, rider network, fast top-up missions
    - Less proven as a premium fresh weekly-basket destination
  - - Oasis
    - Profitable niche specialist
    - Q2 2025 sales ₩148.9B; 2024 sales disclosure ₩475.4B
    - Profitable in 2024 and Q2 2025; management claims 14+ years of profitability
    - Organic positioning, loyal repeat buyers, capital discipline
    - Small scale and narrower assortment breadth than Kurly
  - - Gmarket
    - General marketplace
    - Broad merchandise and food assortment with membership promotions
    - ChosunBiz says revenue declined in H1 2025
    - Promotion-led marketplace breadth
    - Weak direct overlap with premium dawn-delivery grocery
  - - 11Street
    - General marketplace under restructuring
    - Open market returned to black in 2025
    - Still posted ₩39.6B FY2025 operating loss; Q1 2026 peer set still loss-making
    - Large marketplace habit and price-led shopping mission
    - No clear fresh-delivery moat and weaker economics than Kurly
  - - Homeplus / Lotte / other offline grocers
    - Store-network substitutes
    - Official online-mart and fresh-mall surfaces remain active
    - Economics mixed or undisclosed
    - Physical stores, sourcing relationships, status-quo trust
    - Fragmented UX and less differentiated premium-brand equity online
  notes: Rows emphasize the most relevant Korean competitive classes rather than every minor regional app; revenue and profit fields stay qualitative where public segment disclosure is incomplete.
