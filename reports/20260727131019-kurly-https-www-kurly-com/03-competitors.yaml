chapter:
  number: 3
  title: Competitors
  summary: Kurly competes in a stratified Korean grocery field rather than a clean set of like-for-like peers. Coupang is the dominant scale threat because it can bundle grocery into a far larger logistics and membership ecosystem while still tolerating losses. SSG.com and Oasis are the closest merchandising comparables, Baemin attacks urgent top-up missions through quick commerce, and Gmarket, 11Street, Homeplus, and Lotte remain substitutes or adjacent pressure points rather than full Kurly replicas. Internationally, the most relevant lessons come from Amazon Fresh, Instacart, Ocado, and Hema, which show four different ways grocery can be bundled, intermediated, automated, or fused with stores.
sections:
- id: korean-competitive-hierarchy
  title: 'Korean Competitive Hierarchy: Direct Rivals, Adjacent Platforms, and Substitutes'
  body: 'Kurly does not face one clean competitive peer group. Its closest merchandising overlaps are SSG.com and Oasis, both of which compete on fresh-food trust and premium assortment, but the most dangerous economic rival is still Coupang because it can subsidize speed, bundle grocery inside a much larger membership and logistics ecosystem, and defend share with much more user traffic. Q1 2026 public evidence reinforces that split: Kurly was profitable, Oasis remained profitable on a smaller base, while Coupang, SSG.com, and 11Street were still showing weaker or loss-making economics. Baemin is different again. It is not a curated premium grocer first, but its massive app reach and one-hour delivery positioning make it a credible attacker of Kurly''s urgent missions. Gmarket and 11Street matter mostly as broad marketplaces, while Homeplus and Lotte remain status-quo substitutes anchored in store networks rather than full Kurly lookalikes. The strategic map is therefore layered: Kurly''s
    direct peers overlap on assortment and trust, but the most powerful attackers overlap on distribution and consumer habit formation.'
