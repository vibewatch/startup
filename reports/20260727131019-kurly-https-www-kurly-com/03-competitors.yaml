  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor-pricing
    missingEvidence: Region-by-region delivery cutoffs, free-delivery thresholds, and paid-membership economics for Kurly, Coupang, SSG, Baemin, Homeplus, and Lotte under the same shopping basket assumptions.
    whyItMatters: Switching-cost analysis changes materially when one platform waives fees or shortens cutoffs in a specific district, so public homepage evidence alone can overstate or understate Kurly's real parity.
    diligencePath: Run synchronized live-cart checks in Seoul, Bundang, Busan, and one non-core city; capture screenshots of cutoff times, basket minimums, and membership discounts from each app on the same day.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP002
    - TP003
  - type: missing-source
    severity: material
    topic: bmart-economics
    missingEvidence: Standalone Bmart 2025-2026 revenue, profitability, and geographic coverage broken out from Baemin's broader app metrics in accessible public English sources.
    whyItMatters: Without a clean Bmart disclosure, diligence cannot tell whether Baemin's quick-commerce threat is already scaled and self-funding or still mostly an attachment to the food-delivery super-app.
    diligencePath: Review Korean-language Woowa Brothers disclosures, Delivery Hero materials, and local market-research panels that split Baemin food delivery from Bmart quick commerce.
