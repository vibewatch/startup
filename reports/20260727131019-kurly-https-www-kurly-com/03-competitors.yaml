- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - Kurly moat or vulnerability
  - Threat vector
  - Current evidence
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Premium assortment and higher margin mix
    - Coupang bundles grocery into a much larger ecosystem
    - Kurly gross-margin signal is stronger, but Coupang still combines scale with willingness to lose money
    - High
    - Margin quality helps Kurly, but scale can still reset category economics
    - Stress-test how Kurly margins hold if a competitor subsidizes delivery for 12-18 months
  - - Planned premium-basket leadership
    - Baemin captures urgent top-up frequency
    - Baemin's one-hour goods delivery and large app reach target the highest-frequency use case
    - High
    - Frequency loss can weaken retention even if Kurly keeps higher-ticket baskets
    - Measure Kurly repeat behavior when households also use Baemin for same-day convenience
  - - Store-free cold-chain specialist model
    - SSG uses stores as flexible hubs
    - SSG is layering 2-hour, dawn, and other modes on top of E-Mart inventory and logistics
    - Medium-High
    - Offline nodes may improve service density faster than greenfield fulfillment in some districts
    - Compare fulfillment-cost and SLA economics district by district versus store-backed rivals
  - - Niche-quality differentiation
    - Oasis proves disciplined niche operators can stay profitable
    - Oasis stayed profitable while expanding dawn delivery to new cities
    - Medium
    - Kurly cannot assume smaller specialists will disappear in a scale-led market
    - Assess whether Kurly's premium audience overlaps more with Oasis than top-line size implies
  - - Standalone app acquisition economics
    - Naver channel dependence / optionality
    - Naver now owns 6.2% and Kurly N Mart is a fast-growing external storefront
    - Medium
    - Partnership lowers CAC risk but may increase channel dependence or strategic constraint
    - Review economics, data sharing, and exclusivity terms of the Naver relationship
  - - Category still early in mission convergence
    - Low switching cost and multi-homing
    - Consumers can mix Kurly, Coupang, SSG, Baemin, and store apps by mission
    - High
    - Kurly's moat weakens quickly if rivals match enough service quality on premium baskets
    - Collect cohort data on cross-app overlap, wallet share, and churn triggers by order mission
  notes: Risk register focuses on durable competitive economics rather than simple feature parity; severity reflects underwriting relevance, not certainty of occurrence.
  enumerationScope:
    coverage: partial
    basis: The register prioritizes the moat and vulnerability vectors that most directly affect Kurly's underwriting case, not every conceivable competitor action.
