- id: international-analogues-and-lessons
  title: International Analogues and What They Suggest for Kurly
  body: 'The international analogues underline why Kurly should not be analyzed as a generic grocery app. Amazon Fresh shows the horizontal-platform path, where grocery is one more retention layer inside a vast commerce membership ecosystem. Instacart represents a structurally different model: it wins by intermediating retailers and powering their storefronts rather than by owning Kurly-like inventory economics. Ocado is the opposite extreme, treating online grocery as a technology, fulfilment, and last-mile operating system. Hema/Freshippo shows the hybrid store-and-digital route, where dense physical nodes, fast delivery radii, and disciplined expansion can coexist with eventual profitability. Kurly sits between those templates. It is smaller than Amazon or Coupang, less marketplace-like than Instacart, and not a pure infrastructure vendor like Ocado, but its strategic upside looks closest to the Hema or Ocado logic of combining premium trust with reusable logistics and software layers.
    That framing matters because it suggests Kurly should defend density, category authority, and infrastructure utilization rather than chase undifferentiated mass-market breadth.'
