- id: TP002
  title: Delivery-speed and fulfillment matrix
  columns:
  - Provider
  - Publicly visible speed promise
  - Fulfillment base
  - Coverage signal
  - Product focus
  - Competitive implication for Kurly
  rows:
  - - Kurly
    - Dawn delivery plus Midnight Star same-day evening delivery; same-day via Kurly N Mart
    - Dedicated cold-chain/logistics network plus Naver-linked channel fulfillment
    - Expanded beyond core regions; same-day added where density supports it
    - Premium fresh food, beauty, selective convenience
    - Benchmark specialist; strongest on planned premium baskets, less advantaged on urgent top-up missions
  - - Coupang
    - Same-day and early-morning orders growing >40% in later public update; Rocket bundle implied on official surface
    - Self-operated large-scale logistics network
    - Nationwide scale leader by traffic and distribution
    - Mass-market grocery plus wider commerce
    - Most dangerous scale-and-speed threat even if premium curation is weaker
  - - SSG.com
    - Dawn, scheduled, one-hour, and 2-hour delivery visible publicly
    - E-Mart stores used as logistics hubs
    - 2-hour pilot planned to expand to ~50 stores nationwide by end-2026
    - Premium grocery, fresh foods, department-store adjacency
    - Closest incumbent overlap with Kurly on premium grocery plus faster offline-backed convenience
  - - Baemin
    - One-hour delivery of groceries and daily goods in some areas
    - Rider network and local quick-commerce operations
    - High national app reach, but exact Bmart coverage undisclosed here
    - Urgent top-up goods, food delivery, convenience missions
    - Biggest threat on immediacy and frequency, not on curated premium weekly baskets
