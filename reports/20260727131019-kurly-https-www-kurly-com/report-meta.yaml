companyProfile:
  summary: "Kurly (formerly Market Kurly) is South Korea's pioneering premium online grocery and lifestyle platform, founded in 2015 by Sophie Kim (김슬아) in Seoul. The company introduced 새벽배송 (dawn delivery) — orders placed before midnight delivered before 7am — to Korea, building a decade-long cold-chain logistics advantage. In 2025, Kurly achieved its first annual operating profit (₩13.1 billion on ₩2.37 trillion in revenue), capping a 10-year journey from loss-making disruptor to profitable retail-tech platform. The company has since expanded beyond fresh food into Beauty Kurly, third-party fulfillment (FBK), and a strategic partnership with Naver, launching Kurly N Mart on Naver Plus Store. In May 2026, Naver invested ₩33 billion at a ₩2.8 trillion valuation, endorsing Kurly's renewed IPO ambitions. Q1 2026 saw record quarterly results: revenue up 28.4% YoY and operating profit up 1,277% YoY."
  foundedDate: "2015-05-01"
  founders:
    - name: "Sophie Kim"
      role: "Founder and CEO"
      background: "Former investment banker; founded Kurly in 2015 and built Korea's first dawn-delivery fresh food platform"
      claimRefs: [CO005]
  foundingLocation: "Seoul, South Korea"
  headquarters: "Seoul, South Korea"
  productSummary: "Premium online grocery platform with dawn delivery (새벽배송, orders before midnight, delivery before 7am), Beauty Kurly (cosmetics channel), Fulfillment by Kurly (FBK) for third-party sellers, Kurly N Mart (Naver-integrated storefront), Midnight Star Delivery (order by 3pm, deliver by midnight), and Kurly USA (cross-border Korean goods)"
  customerFocus: "Urban Korean professionals aged 25-45, premium fresh food shoppers, beauty consumers; Kurly Members paid-subscription base of 1.4M+ subscribers"
  businessModel: "Direct-to-consumer premium e-commerce with own cold-chain logistics (direct-purchase sourcing model); paid membership (Kurly Members); third-party marketplace (FBK/3P); Naver channel partnership (Kurly N Mart); logistics-as-a-service via Kurly Next Mile"
  stage: "Late-stage private, pre-IPO; IPO revived May 2026"
