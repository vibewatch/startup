- id: TI006
  title: Public financial gaps and exact diligence asks
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy today
  - Exact diligence ask
  - Severity
  rows:
  - - Cash balance and debt
    - Without cash and debt, runway cannot be judged even after the Naver raise.
    - Reported fundraise sizes and profitability snapshots only.
    - Request latest balance sheet, cash by entity, debt schedule, and any covenant package.
    - Blocking
  - - Working capital and inventory turns
    - Cold-chain grocery can destroy cash even when headline profit turns positive.
    - Gross-margin trend and management commentary on procurement efficiency.
    - Request inventory days, shrink/spoilage rates, payables days, and supplier-term concentration.
    - Blocking
  - - Capex and free cash flow
    - Logistics expansion may require ongoing capital beyond what P&L snapshots show.
    - Articles say Naver money will support logistics infrastructure.
    - Request fulfillment-center capex plan, maintenance capex, and trailing twelve-month free cash flow.
    - Material
  - - Revenue mix and contribution margin by stream
    - The profit path may depend disproportionately on higher-margin adjacencies rather than core grocery.
    - Growth rates for Beauty Kurly, 3P/FBK, and Kurly N Mart.
    - Request stream-level revenue, gross profit, contribution margin, and active-customer overlap.
    - Material
  - - Membership economics and CAC/payback
    - Subscription and channel economics are critical to judging repeatability of the current margin structure.
    - Paid members >1.4M and MAU +30% in 2025.
    - Request membership ARPU, retention, order frequency uplift, CAC by channel, and payback cohorting.
    - Material
  - - Exact gross-margin definition
    - Public sources cite both 33.1% and 34.3% for Q1 2026.
    - Company-linked and analyst summaries.
    - Request management bridge tying reported revenue, COGS, and service-mix adjustments to gross margin.
    - Minor
  notes: This is a diligence-request table, not a claim of hidden distress. It catalogs what a public investor still cannot verify from reviewed sources as of the 2026-07-27 run date.
