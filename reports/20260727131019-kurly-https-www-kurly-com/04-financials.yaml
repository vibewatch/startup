- id: TI004
  title: Unit economics, cost structure, and peer context
  columns:
  - Metric / lens
  - Public value or signal
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin trend
    - 27.6% (2022) → 29.7% (2023) → 31.8% (2024) → 33.3% (2025)
    - Medium
    - Shows multi-year COGS improvement rather than one-quarter noise.
    - Reconcile exact accounting treatment for direct-purchase inventory, seller services, and channel fulfillment.
  - - Q1 2026 gross margin
    - 33.1% in company-linked coverage vs 34.3% in LS Securities
    - Low-Medium
    - The discrepancy is small, but it shows that public summaries are not identical disclosures.
    - Obtain management-prepared bridge from gross merchandise economics to recognized gross profit.
  - - SG&A leverage
    - Q1 2026 SG&A ratio down 2.2pp YoY
    - Medium
    - Indicates operating leverage from scale and logistics optimization.
    - Request fixed vs variable cost split and regional fulfillment economics.
  - - Business-mix support
    - Beauty, 3P/FBK, and Naver-linked GMV all grew faster than core retail
    - Medium
    - Suggests margin expansion may depend on mix shift, not only better grocery procurement.
    - Break out revenue, gross profit, and order frequency by stream.
  - - Peer profitability context
    - LS Securities says Coupang, SSG.com, and 11Street all posted Q1 2026 operating losses while Kurly reported profit
    - Medium
    - Helps show Kurly is outperforming peers on current margin direction, even if absolute margins remain thin.
    - Benchmark normalized fulfillment cost per order and marketing cost per active customer against peers.
  - - Scale gap to public peer
    - Coupang official site cites 95,000 employees and 190+ countries/territories served
    - High
    - Shows Kurly competes in a market where much larger platforms can absorb subsidy cycles.
    - Size Kurly's defensible niche by basket quality, channel mix, and repeat behavior rather than by raw scale.
  notes: Values mix directly reported metrics, calculated ratios, and peer context. The table is intended to assess directionality and underwriting relevance, not to imply Kurly provides full segment reporting.
