- id: disclosure-gaps-and-ipo-readiness
  title: Disclosure Gaps, Margin Risk, and IPO Readiness
  body: 'Kurly is closer to IPO-readiness than it was in 2023, but it is not yet straightforward to underwrite. The positive case is real: positive EBITDA in 2024, two profitable quarters in H1 2025, first annual operating profit in 2025, and a very strong Q1 2026 suggest the business has crossed an important operating threshold. The risk case is also real. The 2025 annual operating margin was still only about 0.55%, the reported Q1 2026 gross margin contains a minor 33.1% versus 34.3% source discrepancy, and public materials still do not provide balance-sheet depth. For a cold-chain retailer, missing data on cash, debt, inventory, payables, capex, free cash flow, and stream-level contribution margin are not cosmetic omissions; they are underwriting blockers. The right diligence conclusion is therefore conditional: Kurly has materially improved revenue quality and earnings credibility, but the company still needs private data-room evidence before investors can judge whether the present profit
    structure is durable enough for a public listing.'
