- id: TI003
  title: Revenue streams and monetization quality
  columns:
  - Stream
  - Evidence of scale / price signal
  - Revenue recognition logic
  - Margin / capital profile
  - Current diligence read
  rows:
  - - 1P premium grocery
    - Core historical business; revenue recognized on owned inventory sales.
    - Gross revenue from direct product sales to end customers.
    - Highest inventory, spoilage, and cold-chain working-capital intensity.
    - Still the basket anchor, but no public split discloses how much of 2025 revenue came from core grocery.
  - - Beauty Kurly
    - Beauty GMV grew 23% in 2025 and 20.2% in Q1 2026.
    - Likely a mix of owned inventory and platform-like economics depending on category.
    - Potentially better gross margin than fresh food, but public contribution margin is undisclosed.
    - Looks like a meaningful adjacency that can raise basket quality without recreating grocery logistics cost in full.
  - - 3P seller delivery / FBK
    - 3P GMV grew 54.9% in 2025 and seller-delivery GMV grew 52.6% in Q1 2026.
    - Service and logistics revenue tied to merchant fulfillment rather than only product resale.
    - Improves asset utilization and should be lighter on inventory risk than 1P retail.
    - Most important evidence that Kurly is widening beyond pure retail markup economics.
  - - Kurly N Mart on Naver
    - Monthly GMV grew more than 7x after launch; average monthly transactions rose over 50%.
    - Channel sales and logistics/service revenue through Naver-distributed storefronts.
    - Potentially lower CAC because Kurly rents demand from Naver instead of funding all traffic itself.
    - Strategically attractive because it combines demand acquisition with logistics utilization.
  - - Kurly USA / cross-border
    - Official U.S. launch uses 48-hour delivery; free shipping starts at $89 chilled/frozen and $49 ambient.
    - Cross-border commerce revenue from Korean food and K-beauty sold into the U.S.
    - Adds airfreight and service complexity, so growth may not equal margin expansion.
    - Interesting adjacency, but public data does not yet quantify contribution to consolidated revenue.
  notes: This table mixes directly reported growth signals with mechanism-level inference. Pricing is only publicly visible on the U.S. cross-border surface; domestic realized take rates and stream-level revenue mix remain undisclosed.
  claimRefs:
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI035
  - CI041
