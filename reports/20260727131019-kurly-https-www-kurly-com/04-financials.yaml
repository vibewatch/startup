    - 2026-05
    - '>$783M (author estimate)'
    - Combines TechCrunch's ~$761M pre-2023 total with roughly $22M equivalent from Naver.
    - Historical capital raised is not the same as available liquidity or runway.
  notes: USD and KRW values are preserved as reported. The final row is an author estimate using the reviewed Naver deal size and a roughly ₩1,500/USD exchange-rate convention from current Korean market coverage.
