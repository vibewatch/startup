chapter:
  number: 4
  title: Financials
  summary: 'Kurly''s public financial record now shows a genuine profitability turn rather than a single lucky quarter: positive EBITDA in 2024, first half-year operating profit in 2025, first full-year operating profit in 2025, and record Q1 2026 results. Gross margin has expanded steadily into the low-30s while 3P fulfillment, Beauty Kurly, and Naver-distributed grocery have become the clearest non-core growth engines. The underwriting problem is no longer whether Kurly can generate revenue, but whether sub-1% annual operating margins, private balance-sheet opacity, and undisclosed working-capital and capex needs make the current IPO narrative durable.'
sections:
- id: historical-pl-and-profitability
  title: Historical P&L and the Profitability Inflection
  body: 'Kurly''s disclosed financial arc is now credible enough to describe in phases. The first phase was hypergrowth: TechCrunch reported roughly ₩845 billion of 2020 revenue and 124% year-over-year growth, establishing that the dawn-delivery model could win demand even before it could prove durable earnings. The second phase was slower but still positive top-line scaling through 2021-2024, alongside a steady gross-margin climb that LS Securities later summarized from 27.6% in 2022 to 31.8% in 2024. The third phase is the decisive one for diligence: Kurly moved from a ₩18.3 billion operating loss in 2024 to a ₩13.1 billion operating profit in 2025, then posted ₩24.2 billion of operating profit in Q1 2026 alone. That sequence matters because it shows the profit turn was not confined to one accounting period. At the same time, the annual operating margin in 2025 was only about 0.55%, so the company has proved breakeven viability faster than it has proved a wide economic cushion.'
