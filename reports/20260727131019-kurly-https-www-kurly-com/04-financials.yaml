  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-debt
    missingEvidence: Latest balance sheet showing unrestricted cash, restricted cash, debt balances, lease liabilities, and any working-capital credit lines.
    whyItMatters: Without cash and debt data, investors cannot determine whether the Naver raise created runway or merely reduced near-term pressure.
    diligencePath: Request the latest monthly management accounts, debt schedule, and any lender or landlord covenant summary.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: blocking
    topic: working-capital
    missingEvidence: Inventory days, spoilage/shrink, payables days, supplier concentration, and order-level contribution margin by major category.
    whyItMatters: A cold-chain retailer can report positive operating profit while still consuming significant cash through inventory and vendor-payment dynamics.
    diligencePath: Request a 12-month working-capital bridge and category-level inventory aging from finance or operations leadership.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: material
    topic: capex-and-free-cash-flow
    missingEvidence: Fulfillment-center capex plan, maintenance capex, and trailing-twelve-month free cash flow.
    whyItMatters: Logistics expansion is capital intensive, so margin improvement is not enough to judge equity financing dependency.
    diligencePath: Request board materials or capex committee updates covering planned logistics investment and facility utilization.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: material
    topic: revenue-mix-and-contribution-margin
    missingEvidence: Revenue, gross profit, and contribution margin broken out across 1P grocery, Beauty Kurly, 3P/FBK, Kurly N Mart, and overseas operations.
    whyItMatters: The current profit narrative may depend on mix shift; without stream economics, investors cannot test whether core grocery alone is sustainably profitable.
    diligencePath: Request a segment bridge used internally for budget and board reporting, plus cohort-level order frequency by stream.
    relatedQuestionRefs:
    - QI002
    - QI025
    relatedTableRefs:
    - TI006
  - type: conflicting-data
    severity: minor
    topic: q1-2026-gross-margin-definition
    missingEvidence: Management reconciliation for why public summaries cited both 33.1% and 34.3% gross margin for Q1 2026.
    whyItMatters: The gap is small, but investors need a precise definition before using the margin trajectory in an IPO-ready model.
    diligencePath: Ask finance to provide the exact Q1 2026 gross margin formula and whether marketplace or service revenue was treated differently across summaries.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI004
    - TI006
