  title: Funding, valuation, and capital adequacy checkpoints
  columns:
  - Checkpoint
  - Date / period
  - Amount / value
  - What it established
  - Current underwriting issue
  rows:
  - - Series F financing
    - 2021-07
    - $200M at $2.2B valuation
    - Confirmed Kurly could attract major late-stage growth capital before the IPO attempt.
    - Still below the later private peak, so it is not the right current anchor by itself.
  - - Pre-IPO peak / withdrawal-era reset
    - 2021 peak to 2023 withdrawal
    - ~$3.3B peak vs ~${0.669}B withdrawal-era expectation
    - Shows the severity of public-market repricing after the IPO plan was pulled.
    - The 2026 recovery should be read as partial repair, not full restoration.
  - - First annual operating profit
    - FY2025
    - ₩13.1B on ₩2.3671T revenue
    - Improved Kurly's negotiating position for any fresh capital or revived listing.
    - Annual operating margin stayed only around 0.55%, so profit quality still needs stress testing.
  - - Naver strategic investment
    - 2026-05
    - ₩33B; 498,882 shares at ₩66,148 each
    - Brought in new growth capital and strategically tied Kurly more tightly to Naver distribution.
    - The financing is useful, but public sources still do not disclose post-money cash balance.
  - - Implied valuation after Naver deal
    - 2026-05
    - ~₩2.8T; Naver stake 6.2%
    - Marked a meaningful recovery from the withdrawal-era trough.
    - Still below the 2021 private peak when converted to USD and compared with earlier expectations.
