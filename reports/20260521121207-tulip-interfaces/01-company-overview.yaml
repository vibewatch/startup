- id: leadership-capital
  title: Leadership, investor base, and capital trajectory
  body: 'Leadership remains founder-led. Natan Linder is the public face of the company and is consistently identified as co-founder and CEO. Rony Kubat appears in current 2026 product-launch coverage as CIO and co-founder, and older MIT Media Lab pages describe Tulip as a company founded by Linder and Kubat after their MIT work. Natan’s outside profile also matters for diligence: the World Economic Forum biography highlights prior leadership roles and his co-founder/chairman relationship with Formlabs, which reinforces his credibility as a repeat builder in physical-world technology.


    Tulip’s public funding story is strongest from 2021 onward. The August 2021 Series C announcement said Tulip raised $100 million led by Insight Partners, with Pitango Growth, TIME Ventures, DMG MORI, NEA, and Vertex Ventures US participating. The release also disclosed that Tulip served hundreds of global enterprise customers across more than 35 countries and had grown ARR at a 270% CAGR over the prior three years. In January 2026, Tulip announced a $120 million Series D led by Mitsubishi Electric at a $1.3 billion valuation, effectively moving the company into the unicorn category in both official and independent coverage.


    Mitsubishi Electric matters as more than a passive investor. Its December 2025 announcement said it had already invested in Tulip and signed a strategic alliance to strengthen Mitsubishi’s digital-transformation offerings in manufacturing. That makes the January 2026 Series D look less like a standalone venture event and more like the financing expression of an already-operational strategic relationship. Publicly named rounds since 2017 sum to at least $272.5 million of disclosed capital before considering any undisclosed seed or early strategic financing, but the current public record still does not provide a clean, up-to-date cap table, liquidation stack, or current board roster.'
