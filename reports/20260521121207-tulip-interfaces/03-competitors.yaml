- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Why the threat is credible
  - Diligence ask
  rows:
  - - No-code app flexibility
    - Feature convergence by direct peers
    - High
    - Workflow builders and AI copilots are spreading across the category
    - Request win/loss data versus Augmentir, Parsable, and Redzone
  - - Composable MES + governance
    - Incumbent suite response
    - High
    - ThingWorx, Opcenter, and Plex can bundle adjacent capabilities through broader installed bases
    - Measure attach and replacement rates in accounts already using incumbent stacks
  - - Open integration surface
    - Internal build or SI-led custom layers
    - Medium
    - Strong APIs can help Tulip land but also make substitution easier over time
    - Request data on third-party-built versus Tulip-native app retention
  - - Operator adoption and local ownership
    - Multi-homing with CMMS / MES / ERP
    - Medium
    - Plants can keep Tulip for one job while standardizing another platform elsewhere
    - Test whether Tulip owns mission-critical workflow layers or optional edge use cases
  - - Regulated / high-complexity fit
    - Packaged point tools improving compliance features
    - Medium
    - Peers increasingly market traceability, auditability, and AI assistance
    - Request regulated-customer expansion metrics and validation-services load
  - - Pricing transparency
    - Packaged ROI competitors or hidden-discount suites
    - Medium
    - Tulip's visible list price can be easier to attack when peers keep pricing opaque
    - Review actual discounting, services attach, and contract length by segment
  notes: Severity reflects current public evidence, not confidential win/loss data.
