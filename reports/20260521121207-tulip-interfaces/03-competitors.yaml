- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public pricing visibility
  - Observed packaging model
  - What buyer learns before sales contact
  - Implication for Tulip
  rows:
  - - Tulip
    - High
    - USD 100 or USD 250 per interface per month; enterprise custom
    - Entry price, minimums, and core tier structure are visible
    - Helps qualification but exposes price anchoring and minimum thresholds
  - - Augmentir
    - Low
    - Custom enterprise pricing
    - Must contact sales; marketplace lists features, not price
    - Tulip is more transparent but also easier to benchmark
  - - Parsable
    - Low
    - Custom enterprise pricing
    - Public feature positioning only
    - Tulip can win on transparency but loses the flexibility to hide discounting
  - - Poka
    - Low
    - Custom enterprise pricing
    - Homepage stresses platform and outcomes, not list price
    - Category buyers may compare value stories instead of line-item rates
  - - Redzone
    - Low
    - Custom enterprise pricing / packaged outcomes
    - Outcome metrics are public; pricing is not
    - Packaged ROI framing can compete with Tulip's more configurable story
  - - MaintainX
    - Low in fetched set
    - Likely seat / asset / enterprise tiers, but not visible on homepage snapshot
    - Security and enterprise claims are visible before pricing
    - Maintenance buyers may engage without a clean direct price comparison
  - - Incumbent suites
    - Low
    - Custom bundle or suite pricing
    - Platform depth is clear; cost is typically hidden behind solution selling
    - Tulip can look cheaper and faster to start, but broader suites can bundle strategically
  notes: “Low” visibility means the fetched public corpus did not expose a stable list price, not that private quotes do not exist.
