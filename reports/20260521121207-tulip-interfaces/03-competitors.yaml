- id: TP001
  title: Competitor profile table
  columns:
  - Vendor
  - Category
  - Public scale / signal
  - Target customer / use case
  - Primary differentiation
  - Observed limitation
  rows:
  - - Augmentir
    - Direct peer
    - AI-native connected-worker platform; Microsoft marketplace listing; active 2025-2026 product/news cadence
    - Manufacturing and field service teams needing skills management and adaptive guidance
    - Industrial AI agents, skills management, and personalized work guidance
    - Pricing not public; best fit skews toward packaged worker-guidance use cases rather than open-ended app composition
  - - Parsable
    - Direct peer
    - Frontline-operations platform with 2024 Frost & Sullivan award cited on homepage
    - Large industrial operations digitizing SOPs, audits, and collaboration
    - Conditional digital procedures, collaboration, and compliance traceability
    - Public product packaging is opaque; solution subpage fetches 404
  - - Poka
    - Direct peer
    - 2,300+ rollout success stories claimed on homepage
    - Manufacturers prioritizing learning, knowledge capture, and standardization
    - Video-rich tribal-knowledge capture and frontline learning workflows
    - Public pricing absent; positioning is less about custom app development
  - - Redzone / QAD
    - Direct peer / packaged substitute
    - 2,000+ factories claimed; 26% productivity increase and 35% lower turnover marketed
    - Manufacturers wanting fast packaged frontline productivity improvement
    - Packaged connected-manufacturing workflows with strong operational outcome framing
    - Less obviously extensible as a general no-code app platform
  - - PTC ThingWorx
    - Adjacent incumbent
    - Established IIoT platform with manufacturing, service, and engineering scope
    - Industrial enterprises seeking broader connected-product / factory platform
    - End-to-end IIoT stack, prebuilt apps, and enterprise developer tooling
    - Broader scope can mean heavier implementation and less Tulip-style operator-app simplicity
  - - Siemens Opcenter
    - Adjacent incumbent
    - MOM portfolio linking PLM to automation and quality operations
    - Enterprises standardizing on structured manufacturing operations management
    - System-of-record depth and strong fit for formal manufacturing processes
    - Less obviously no-code and human-centric than Tulip's operator-first pitch
  - - Rockwell Plex
    - Adjacent incumbent
    - Plex markets 8B+ transactions per day and 96% gross renewal rate
    - Manufacturers wanting cloud smart-manufacturing platform with enterprise governance
    - Broader manufacturing platform depth plus Rockwell channel presence
    - More suite-like and less flexible for custom frontline apps than Tulip claims
  - - MaintainX
    - Adjacent substitute
    - 14,000+ companies claimed; strong enterprise security posture marketed
    - Maintenance and asset-reliability teams
    - CMMS/EAM depth, preventive maintenance, parts, and asset workflows
    - Not designed primarily as a frontline app-composition or MES-adjacent platform
  - - Fabrico
    - Adjacent substitute
    - Maintenance-centric product with QR, machine connectivity, and CMMS/EAM framing
    - Plants centered on maintenance execution and uptime visibility
    - Fast deployment, maintenance ROI framing, and asset-centric workflows
    - Maintenance scope is narrower than Tulip's broader frontline execution positioning
  notes: Public scale signals are uneven because most peers are private and disclose different metrics; “observed limitation” reflects fetched-public-surface scope, not a full product teardown.
