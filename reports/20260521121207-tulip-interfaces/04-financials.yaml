- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Exact diligence ask
  rows:
  - - Current ARR
    - Not disclosed
    - Low
    - Core input for valuation and runway
    - Request latest ARR, ARR by cohort, and ARR by vertical
  - - Current revenue
    - Not disclosed
    - Low
    - Needed for growth and margin underwriting
    - Request quarterly revenue and recognized services revenue
  - - Gross margin
    - Not disclosed
    - Low
    - Separates software scalability from services/compliance burden
    - 'Request gross margin split: subscription, services, and support'
  - - CAC / sales efficiency
    - Not disclosed
    - Low
    - Determines how efficiently Tulip turns capital into ARR
    - Request CAC payback, blended sales cycle, and win rates
  - - Customer ROI proxy
    - 448% TEI composite customer ROI; <6 month payback
    - Medium
    - Suggests customer-side willingness to fund deployments
    - Request independent customer ROI by cohort, not just composite study
  - - Historical growth proxy
    - 270% ARR CAGR over three years before Aug 2021 (company claim)
    - Low
    - Signals prior momentum but is stale for current underwriting
    - Request current growth rate and any slowdown or acceleration post-2021
  - - Public usage scale
    - 43K apps, 60K workers, 1K sites in 2025
    - Medium
    - Shows footprint but not monetized quality
    - Request average revenue per site and net expansion by site cohort
  notes: This table intentionally separates customer-side ROI proof from Tulip-side unit-economics disclosure.
