- id: TI002
  title: Pricing / monetization table
  columns:
  - Tier or lever
  - Public price / structure
  - Included economics clue
  - What remains unknown
  - Implication
  rows:
  - - Essentials
    - USD 100 per interface per month, billed annually, 10-interface minimum
    - Entry-level recurring subscription
    - Average discounting and services attach
    - Low-friction price anchor, but not necessarily typical ACV
  - - Professional
    - USD 250 per interface per month
    - Connectivity, SSO, connectors, API, on-prem connector host
    - Typical migration path from Essentials
    - Suggests interface count plus feature depth both drive expansion
  - - Enterprise
    - Custom
    - Multi-site, governance, app exchange, import/export
    - Base price and bundling rules
    - Likely where strategic accounts and largest ACVs sit
  - - Regulated Industries
    - Custom uplift over Enterprise
    - e-signatures, auditable record history, validation pack, 0-RPO, audit privileges
    - Incremental price and deployment cost
    - Potentially sticky high-value revenue in life sciences and defense
  - - AI / automation / monitoring add-ons
    - Custom or quota-based
    - Usage-linked monetization beyond seat-like pricing
    - Actual adoption and consumption levels
    - Creates upsell path but may also add variable infrastructure cost
  notes: List prices are valuable for boundary-setting, but realized enterprise pricing is not disclosed publicly.
