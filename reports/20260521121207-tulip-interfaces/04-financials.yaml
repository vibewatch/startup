- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Core valuation input
    - Undisclosed
    - Request trailing 8 quarters of revenue and ARR
  - - Gross margin by segment
    - Separates software quality from services drag
    - Undisclosed
    - Request subscription vs services gross margin bridge
  - - NRR / churn
    - Tests revenue durability
    - Undisclosed
    - Request cohort retention and expansion by vintage
  - - CAC / payback
    - Tests sales efficiency
    - Undisclosed
    - Request CAC by channel and payback by segment
  - - Cash balance / burn / runway
    - Tests financing dependency
    - Undisclosed
    - Request monthly cash burn and operating plan
  - - Customer concentration
    - Tests downside and bargaining power
    - Undisclosed
    - Request top-10 customer revenue share and renewal dates
  - - Implementation services load
    - Tests margin and scaling constraints
    - Undisclosed
    - Request average deployment cost, services hours, and partner utilization
  notes: These are the minimum missing metrics required for a clean private-company financial underwrite.
