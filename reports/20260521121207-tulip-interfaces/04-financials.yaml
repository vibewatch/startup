  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Current read
  - Why it matters
  - Diligence ask
  rows:
  - - Series C capital
    - USD 100M in Aug 2021 led by Insight Partners
    - Confirmed
    - Backstops the 2021-2025 scaling phase
    - Confirm how much remained pre-Series D
  - - Series D capital
    - USD 120M in Jan 2026 led by Mitsubishi Electric at USD 1.3B valuation
    - Confirmed
    - Meaningfully extends runway and strategic optionality
    - Request post-round cash balance and monthly burn
  - - Strategic capital quality
    - Mitsubishi alliance plus investment
    - Positive
    - Adds channel and credibility value beyond cash alone
    - Clarify commercial terms, exclusivity, and revenue commitments
  - - Debt / credit facilities
    - No public evidence found
    - Unknown but likely none disclosed
    - Debt changes downside risk and runway math
    - Request any venture debt, covenants, or working-capital lines
  - - Burn / runway
    - Not disclosed
    - Unknown
    - Critical for financing dependency analysis
    - Request 2025 and 2026 burn trajectory plus runway under plan
  - - Use of funds
    - AI scale-up, global operations, and partnership expansion
    - Confirmed but qualitative
    - Indicates where new capital will be consumed
    - Request hiring plan and spend allocation by function
  notes: Public financing is well corroborated; runway remains unknowable without internal cash and burn data.
