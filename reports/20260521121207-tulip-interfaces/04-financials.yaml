company:
  name: Tulip Interfaces
chapter:
  number: 4
  title: Financials
  summary: Tulip has a legible software monetization model, strong fresh financing, and public customer-ROI proof, but public revenue quality remains opaque. The main underwriting conclusion is that the company likely has healthy software economics potential and improved capital runway after the 2026 Series D, yet investors still lack disclosed revenue, burn, gross margin, retention, and concentration data needed for a clean financial underwrite.
sections:
- id: revenue-model
  title: Revenue streams, pricing model, and monetization mechanics
  body: 'Tulip''s public revenue model is unusually legible for a private industrial software company because the company publishes tiered list pricing and defines its commercial units in legal terms. The core subscription is priced per interface rather than per named user, which means monetization scales with the number of operational endpoints running apps, dashboards, or machine-connected workflows. The pricing page also shows that Tulip is not selling one monolithic SKU. Essentials and Professional anchor the base subscription, while Enterprise and Regulated Industries add governance, multilingual deployment, app lifecycle controls, e-signatures, audit history, long-term-support releases, and validation packs. Add-ons for AI actions, automation tasks, machine monitoring, computer vision, GovCloud, premium support, and professional services provide obvious expansion paths above the base contract. The terms of service reinforce this structure by defining interfaces, automations, professional
    services, and support services separately. That suggests a mix of recurring platform revenue plus services and add-on monetization. What remains missing is realized pricing: list price is not the same as ASP, and the public corpus does not show discounting, services attach, contract duration, or what share of ARR comes from regulated add-ons versus core subscriptions.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
