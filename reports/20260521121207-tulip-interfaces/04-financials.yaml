tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue quality read
  - Diligence ask
  rows:
  - - Core platform subscription
    - Recurring SaaS access to Tulip platform tiers
    - Monthly active interfaces
    - Clearly visible through plans page
    - Likely recurring and software-like, but realized ASP unknown
    - Request cohort ARR, interface counts, and contract duration by segment
  - - Regulated / enterprise upgrades
    - Higher-tier governance, validation, e-signature, LTS, and multi-site controls
    - Custom enterprise contract uplift
    - Publicly visible as tier/features, not priced
    - Potentially high-value and sticky in regulated accounts
    - Request attach rates and incremental gross margin by add-on
  - - AI actions and automation add-ons
    - Usage-based or quota-based expansion over included credits/tasks
    - Monthly add-on consumption
    - Publicly listed as add-ons
    - Good expansion lever if usage persists; unclear gross margin after third-party model costs
    - Request AI-action revenue, COGS, and usage concentration
  - - Machine monitoring / vision / GovCloud add-ons
    - Operational or compliance-specific expansion modules
    - Custom add-on pricing
    - Publicly visible as add-ons, not priced
    - Could raise ACV materially in complex accounts
    - Request module penetration and ACV uplift
  - - Professional services and premium support
    - Implementation, training, support, and success services
    - SOW / support contract
    - Visible in plans and terms, but not quantified
    - Can accelerate deployment but may dilute blended margin if overused
    - Request services mix, gross margin, and implementation staffing model
  notes: Public evidence identifies monetization levers but not their realized mix or margin contribution.
