      - number: '8.5'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              Tulip 没有干净的公开可比公司，所以可比框架必须把自身缺陷说清楚。PTC、Siemens 和 Rockwell 都重要，因为它们框定了 Tulip
              想要颠覆或补充的工业软件采购中心；但每家公司都是更宽的上市公司语境，并不是独立的互联一线员工纯标的。Plex 尤其有用，因为它自己的产品页仍突出云规模和 96% 总续约率，这正是投资者希望从 Tulip
              看到、但目前还没有的留存证据。MaintainX 与现代一线软件规模相关，但它以维护为先，因此比 Tulip 的可组合执行层逻辑更窄。Tulip
              自己的公开评论和实施说法表明，公司竞争靠的是速度、灵活性和受治理的适配能力，而不是商品化工作流工具。因此，可比框架只能给方向，不能给确定答案：它支持这个品类可以沉淀出严肃价值，但在没有收入披露前，并不能证明
              USD 1.3 billion 便宜。
