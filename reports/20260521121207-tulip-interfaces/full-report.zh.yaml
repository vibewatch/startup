      - number: '4.3'
        title: 成本结构、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从财务上看，把 Tulip 理解为软件加服务公司，比把它理解为资本密集型硬件公司更合适。公开语料暗示的主要成本中心包括云基础设施、AI
              推理和外部模型提供商、实施与支持、合规与安全，以及能服务多站点制造商的销售组织。AI 安全和治理文档尤其有信息量，因为它点名 AWS、Azure、DeepL 和 Tulip AI
              功能堆栈里的相关服务。这直接说明，部分增量使用经济性建立在第三方云和模型厂商之上，而不是完全自有堆栈。基础设施和合规负担在运营层面也可见。Tulip 现在运行公开状态页面，其 2026
              年维护事件通知反复提到数据库升级、Kubernetes 迁移、ingress 变更和区域停机窗口。这些不是困境信号，但提醒我们：可用性工程、SRE 和合规都是服务交付模型里的真实成本项。2026 年 Series
              D 让资本充足性明显改善：公司在 2021 年 USD 100 million Series C 之后，又由 Mitsubishi Electric 领投，以 USD 1.3 billion 估值融资 USD
              120 million。这是有意义的缓冲，但公开烧钱速度、现金余额和现金跑道仍未披露，因此资本是否充足仍取决于私有运营数据。
