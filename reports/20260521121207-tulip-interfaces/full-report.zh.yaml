      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Tulip 方向上具备退出可能，但公开材料还不足以支持最终投资判断。公司有独角兽估值，有可能拓宽商业和退出选项的战略投资方，有全球客户证据，叙事也贴合当下对带 AI
              能力工业软件的偏好。这足以支持继续尽调，但不足以支撑在当前价格给出最终投资建议。最关键的缺口很直接：当前 ARR
              和收入增长、订阅与服务的毛利率拆分、净留存率、客户集中度、受监管部署深度证据，以及包含近期轮次清算优先权的完整股权结构表。公开证据也没有回答：最强客户成果能否在不依赖重服务投入的情况下复现；高级受监管工作流要求今天是否已经完全满足，还是只在路线图上。这些会打穿投资逻辑，因为它们直接映射到估值倍数韧性。最终建议因此不取决于再找一个营销数据点，而取决于把当前故事转成可审计的经济性和治理证据。
