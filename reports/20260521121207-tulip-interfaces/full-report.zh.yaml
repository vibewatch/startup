  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR ~USD 180-220M，多站点扩张健康，溢价软件倍数维持
        - 股权价值大约 USD 1.6-2.4B；当前估值标记从合理到有吸引力
        - 需要强留存、有限服务拖累，以及受监管行业牵引力延续
        - 有可能，但不是基准情景
      - - 基准
        - ARR ~USD 120-150M，扩张良好但不突出，倍数保持克制
        - 股权价值大约 USD 0.9-1.4B；当前估值标记接近公允价值
        - 叙事仍成立，但从当前价格出发，上行空间有限
        - 从公开证据看最可能
      - - 悲观
        - ARR <USD 100M、扩张放慢，或溢价预期回落到传统工业软件倍数
        - 股权价值大约 USD 0.4-0.7B；当前估值标记会显得偏贵
        - 下行由经济性缺失驱动，不一定来自产品失败
        - 足以影响入场纪律
    notes: 区间是情景输出，不是公司指引。它们锚定已披露的 USD 1.3B 融资轮和明确 ARR 敏感性，而不是未披露的管理层预测。
