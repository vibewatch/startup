      - number: '4.2'
        title: GTM 动作、客户经济性与公开单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Tulip 看起来运行的是面向企业的先落地再扩张动作，而不是产品驱动的自助模型。它的定价有最低门槛，更高层级捆绑治理和连接能力，最强证据点来自多站点或高复杂度客户。2023 年 TEI
              研究在这里有用，尽管它衡量的是客户侧经济性，而不是 Tulip 侧经济性。研究把最强公开 ROI 案例放在一个 20 个站点、10,000 名员工的组合客户上，给出 448% ROI、USD 16.23
              million NPV 和少于六个月的回本周期。这说明当部署显著改善吞吐量、劳动效率或质量时，买方能够证明支出合理。它不能证明 Tulip 自身 CAC
              高效、毛利率高，或销售与客户成功成本回本快。同样的谨慎也适用于客户名单。AstraZeneca、Stanley Black & Decker、DMG
              MORI、Tiffany、Laerdal、Formlabs、Pratt Miller、Reframe 和 TICO
              等具名用户，显示公司在严肃工业和受监管环境中相关性强，但它们没有披露合同价值、续约行为或集中度。最稳妥的结论是：Tulip
              有可信的价值故事，嵌入之后可能有不错的扩张潜力；但公开证据仍不足以承销销售效率或耐久收入质量。
