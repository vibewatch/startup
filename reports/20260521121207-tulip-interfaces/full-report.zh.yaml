      - number: '3.2'
        title: 能力宽度、定价透明度与 GTM 差异
        blocks:
          - type: paragraph
            body: >-
              能力和包装的差异，比厂商营销通常暗示的更大。Augmentir 和 Redzone 强调 AI 主导的生产率、一线教练和打包运营改进。Parsable 更偏流程和合规，突出数字 SOP、协作和可审计性。Poka
              偏知识捕获、劳动力学习和跨站点标准化。MaintainX 和 Fabrico 更偏维护与资产管理；ThingWorx、Opcenter 和 Plex
              则处在更宽的系统层，可覆盖一线用例，但不是由无代码操作员应用定义。Tulip 的竞争边缘在于可配置应用构建、设备与系统连接、可组合 MES
              结构，以及面向受监管或复杂环境的治理组合。它还因公开标价而突出：Tulip 发布按界面计价的入门价格，而本次抓取集合里的大多数同行都把买方推向定制企业销售。这有助于漏斗顶部获客，但也让 Tulip
              更容易被比价，并且比那些把包装藏在演示申请后面的竞争者更暴露最低门槛。实践中，GTM
              差异和功能清单一样重要，因为现有巨头和维护玩家可借相邻预算、既有管理员关系进入客户账户。因此，读这张矩阵最好的方式是看买方意图，而不是只看品牌标签。在 Tulip 和现有套件之间做选择的工厂，和在 Tulip
              与维护优先或 SOP 优先、工作流范围更窄、实际买方需求更简单的点工具之间做选择的工厂，做的是完全不同的决定。
