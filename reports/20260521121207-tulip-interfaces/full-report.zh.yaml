      - number: '5.3'
        title: 信任、合规与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              对受监管买方而言，Tulip 最具体的差异化不是单个算法或硬件资产，而是受治理的应用生命周期控制、受监管工作流功能，以及安全项目投入的证据。Security, Compliance & Governance 和
              GxP 页面描述了基于角色的权限、通过 IdP 的 SSO、审批、版本控制、有文档记录的长期支持版本、审计追踪、电子签名、不可变数据采集和验证支持。定价材料进一步说明，这些功能位于一个独立的 Regulated
              Industries 层，包含可审计记录历史、0-RPO、验证包和 GxP 审计权限。Tulip 在 February 2026 宣布的 FedRAMP Moderate
              Equivalency，为航空航天与国防再加一层分量；信任中心则强调加密和年度渗透测试。即便如此，公开语料在控制描述上强于在独立基准结果上。计划维护，以及缺少公开 SLA 或 MTTR
              披露，意味着可靠性尽调仍需要客户引用和资料室材料，而不能只看产品页面。
