        - FedRAMP 进展停滞
        - 等效认证之外没有清晰进展，或缺少受监管客户证据
        - 重新评估公共部门和 A&D 上行空间
      - - 可靠性
        - 重大宕机或反复出现严重客户事故
        - 重大安全 / 数据完整性事件，或长时间可用性事件
        - 上调平台风险，推迟投资
