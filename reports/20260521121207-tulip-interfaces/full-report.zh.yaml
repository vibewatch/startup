      - number: '7.2'
        title: 运营、可靠性与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Tulip 像一个真实的云平台，也背着云平台应有的负担。公开状态页披露产品级和 garden 级服务健康，覆盖认证、应用执行、分析、连接器、AI、vision
              和多个区域，包括美国政府环境。January、March 和 May 2026 的社区维护帖子提到数据库变更、ingress 工作、Azure 网络更新、Kubernetes
              升级，甚至一次高影响的中国集群迁移。这些通知不能证明不稳定——它们是计划维护，不是隐藏故障——但它们证明可用性工程和变更管理是 Tulip 的核心运营纪律。AI 带来第二层运营风险。Tulip 的 AI
              治理材料称 AI 功能会与 AWS、Azure、DeepL
              等外部服务互动，这意味着隐私、延迟、成本和故障风险有一部分外部化。评论提供了有用的反向视角：用户称赞灵活性和支持，但也有人抱怨云排障不清晰、基础分析钻取不足，以及高级机器或 EBR
              类功能存在缺口。总体判断是，Tulip 有可见控制，但公开语料仍缺少量化 SLA、MTTR 和独立安全保证，强度不足以抹掉平台执行风险。
