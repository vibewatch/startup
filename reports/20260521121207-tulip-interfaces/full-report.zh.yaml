  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开客户证据在结果具体度和生产成熟度上最强，留存透明度较弱。
    approximationNotes: 各单元格用定性标签评估已抓取公开语料中的证据质量。
    data:
      columns:
        - 生产成熟度
        - 结果具体度
        - 背书质量
        - 留存可见度
      rows:
        - label: Tiffany
          values:
            - 高
            - 高
            - 高
            - 低
        - label: VEKA
          values:
            - 高
            - 高
            - 高
            - 低
        - label: Formlabs
          values:
            - 高
            - 高
            - 高
            - 低
        - label: Laerdal
          values:
            - 高
            - 中
            - 高
            - 低
        - label: DMG MORI
