  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 正向逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 品类需求
        - 连接工人和一线运营软件在增长、格局分散，也切中制造业数字化
        - 市场增长不保证 Tulip 能拿到足够收入来支撑溢价估值
        - 展示当前按队列划分的 ARR 增长，以及核心垂直行业胜率
      - - 产品差异化
        - Tulip 定位为面向操作员的可组合层，变化速度可快过僵硬 MES
        - 快速配置仍可能带来治理负担和高级受监管工作流缺口
        - 提供经核验的客户背调和大型受监管部署实施证据
      - - 客户证据
        - 公开客户案例和 2025 年覆盖指标显示采用深度真实
        - 公开客户 logo 和 TEI 式 ROI 证据不披露合同金额、留存或集中度
        - 披露 NRR、总留存率、前 10 大客户集中度和模块附加
      - - 战略验证
        - Mitsubishi 投资和联盟意味着工业侧背书扎实
        - 战略叙事可能高估渠道价值，不能替代收入证据
        - 展示联盟带来的联合销售管线、部署和收入贡献
      - - 估值纪律
        - 如果 ARR 和扩张已足够大，USD 1.3B 可以辩护
        - 不披露 ARR，同一估值也可能明显跑在证据前面
        - 披露 ARR、服务收入组合、毛利率和股权结构表，以锁定真实倍数
    notes: 反向逻辑基于证据，不是泛泛的谨慎标签；每一行都点出能消除不确定性的具体数据。
