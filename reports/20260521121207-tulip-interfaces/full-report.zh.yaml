      - CU045
      - CU046
      - CU047
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 严重度最高的风险簇集中在监管场景落地、平台可靠性、财务不透明和竞争压力。
    approximationNotes: 单元格是基于本章证据综合得出的定性严重度标签，不是模型生成的概率。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 受监管 / 法律场景落地
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 运营可靠性
          values:
            - 中
            - 高
            - 中
            - 高
        - label: AI / 供应商依赖
          values:
            - 中
            - 中
            - 中
            - 中
        - label: 竞争 / 商品化
          values:
            - 高
            - 中
            - 低
            - 高
        - label: 财务不透明 / 现金跑道
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 客户集中度未知项
          values:
            - 中
            - 高
            - 低
