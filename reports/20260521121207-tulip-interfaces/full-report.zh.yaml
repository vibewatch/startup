chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与公司定位
        blocks:
          - type: paragraph
            body: >-
              Tulip 把自己定位为一线运营平台，而不是僵硬的传统 MES。公司在首页、平台页和“运作方式”页面反复强调：它是一套可组合、无代码系统，帮助制造商数字化工作流、连接人员、机器与企业系统，并且不必等待常规 IT
              开发周期就能持续改进运营。当前官方文案把 AI 放到产品表层的多个位置：应用编写、分析、计算机视觉、自动化，以及更宽的“以人为先”运营模型——软件增强操作员，而不是替代他们。


              到 2026 年，Tulip 的公开企业身份也比早期报道更清晰。Tulip 官方页面和近期新闻稿将总部放在 Massachusetts Somerville，同时描述其在
              Munich、Budapest、Singapore、Tel Aviv 和 Tokyo 的全球布局。同一批当前页面也显示出比旧稿更宽的生态覆盖：官网现在引用 47 个国家、110 家合作伙伴和 29
              种语言；January 2026 融资公告则把公开规模锚定在 2025 年 45 个国家、1,000 个客户站点、43,000 个应用、60,000 名一线员工。


              尽调里仍有一个细节需要打结：创立时间。当前官方“关于我们”文案称 Tulip 由 MIT Media Lab 团队发起，并建立在十多年研究之上；2026 年独立报道则称公司是 2012 年从 MIT
              孵化出来的衍生公司。网上其他二级资料写 2014。由于本次抓取材料里的官网没有钉死法律注册日期，最稳妥的事实基线是：Tulip 是由联合创始人 Natan Linder 和 Rony Kubat 领导的 MIT
              Media Lab 衍生公司；准确“成立”年份仍应从股权结构表或法律文件确认，而不能只看营销文案。
