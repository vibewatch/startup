      - CR013
      - CR027
      - CR033
      - CR034
      - CR035
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议维持在观察 / 继续研究：规模和战略证据很强，但未解的经济性和定价风险抵消了部分确定性。
    approximationNotes: 该流程是基于公开证据综合出的定性决策链，不是加权评分模型。
    data:
      nodes:
        - id: market
          label: 增长中的品类
        - id: product
          label: 可组合产品差异化
        - id: proof
          label: 客户 / 覆盖面证明
        - id: finance
          label: Series D 轮 + Mitsubishi 验证
        - id: opacity
          label: ARR / 利润率不透明
        - id: decision
          label: 观察 / 继续研究
      edges:
        - from: market
          to: decision
          label: 支撑
        - from: product
          to: decision
          label: 支撑
        - from: proof
          to: decision
          label: 支撑
        - from: finance
          to: decision
          label: 支撑
        - from: opacity
          to: decision
          label: 压低确定性
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV012
      - CV034
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 USD 1.3B 估值下，假设 ARR 倍数小幅变化，就会推导出差异很大的隐含 ARR 水平。
    approximationNotes: 柱形条用简单的估值 / ARR 算术，从已披露的 USD 1.3B 估值机械推导隐含 ARR。
    data:
      items:
        - label: 6x ARR -> 隐含 ARR
          value: 217
        - label: 8x ARR -> 隐含 ARR
          value: 163
        - label: 10x ARR -> 隐含 ARR
          value: 130
        - label: 12x ARR -> 隐含 ARR
          value: 108
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据的估值区间很宽；基准情景接近当前标记估值，悲观情景明显低于该水平。
    approximationNotes: 区间来自情景表综合出的情景带，不是市场报价标记。
    data:
      items:
        - label: 悲观
          low: 400
          mid: 550
          high: 700
        - label: 基准
          low: 900
          mid: 1150
          high: 1400
        - label: 乐观
          low: 1600
          mid: 2000
          high: 2400
    claimRefs:
      - CV031
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Tulip 在市场相关性和产品证明上得分较高，但证据质量和估值透明度偏弱。
    approximationNotes: 分数是基于本报告证据做出的 IC 式 1 到 5 序数判断，不是管理层提供的指标。
    data:
      items:
        - label: 市场相关性
          value: 4/5
          detail: 买方中心明确，且有增长顺风
          tone: positive
        - label: 产品证明
          value: 4/5
          detail: 部署和灵活性证据强
          tone: positive
        - label: 护城河耐久性
          value: 3/5
          detail: 护城河真实存在，但会被现有厂商和相邻供应商争夺
          tone: medium
        - label: 经济性可见度
          value: 1/5
          detail: ARR、利润率和留存仍未披露
          tone: negative
        - label: 风险姿态
          value: 2/5
          detail: 估值下行风险仍然显著
          tone: negative
        - label: 估值纪律
          value: 2/5
          detail: 进入数据室前只能基于情景判断
          tone: negative
        - label: 证据质量
          value: 2/5
          detail: 足够支持尽调，不足以形成确信
          tone: negative
    claimRefs:
      - CV028
      - CV034
      - CV035
      - CV036
      - CV045
