      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              只凭公开证据给 Tulip 估值，负责任的做法只能是情景分析。乐观情景下，公开规模信号已经转成强劲变现：Tulip 把 1,000 个站点覆盖转化为下一个规划窗口内约 USD 180-220 million 的
              ARR，靠受治理的多站点推广保持健康扩张；客户把它当成高价值运营层，而不是可替换的工作流应用，因此公司能维持溢价软件倍数。基准情景下，Tulip 是一家好公司，但收入规模小于叙事暗示，ARR 更接近约 USD
              120-150 million，估值区间围绕当前标记。悲观情景下，ARR 仍低于 USD 100
              million，部署摩擦或受监管工作流缺口拖慢扩张，市场把倍数压回更常规的工业软件区间。若如此，最新价格就会显得偏贵。重点不是制造虚假精度，而是公开证据支持的结果分布很宽；下行更多来自经济性缺失，而不是明显的产品弱点。
