companyProfile:
  summary: >
    Tulip Interfaces 是一家总部位于 Massachusetts Somerville 的工业 SaaS 公司，为制造业和其他运营场景提供无代码、AI 加持的一线运营平台。公司由 Natan Linder 和 Rony
    Kubat 从 MIT Media Lab 孵化创立，帮助制造商数字化工作流、连接人员、机器和企业系统，并在不依赖传统 IT 开发周期的情况下推动持续改进。2026 年 1 月，公司完成由 Mitsubishi Electric
    领投的 USD 120 million Series D，估值 USD 1.3 billion，进入独角兽行列；其平台覆盖 47 个国家的客户，承载 43,000 个应用和 60,000 名一线员工。
  foundedDate: '2012-01-01'
  founders:
    - name: Natan Linder
      role: 联合创始人兼 CEO
      background: MIT Media Lab 研究员和连续创业者；亦为 Formlabs 联合创始人/董事长。
      claimRefs:
        - CO012
    - name: Rony Kubat
      role: 联合创始人兼 CIO
      background: MIT Media Lab 研究员；与 Natan Linder 共同创立 Tulip。
      claimRefs:
        - CO013
  foundingLocation: Cambridge, MA (MIT Media Lab)
  headquarters: Somerville, MA
  productSummary: >
    Tulip 提供可组合、无代码的一线运营平台，模块包括 App Editor、Analytics、AI（Tulip AI / GenAI）、Computer Vision、Machine
    Kit（边缘设备连接）、Automations、Common Data Model 以及 Connectors & Integrations。平台面向医疗器械、制药、航空航天与国防和离散制造提供预构建的可组合 MES
    套件。产品云原生、GxP 就绪，并在 February 2026 达到 FedRAMP Moderate Equivalency。
  customerFocus: |
    面向受监管行业（生命科学、医疗器械、制药、航空航天与国防）以及离散制造（电子、消费品、工业）的中型市场到大型企业制造商。目标用户包括负责一线工作流数字化的运营经理、工厂总监以及 IT/OT 负责人。
  businessModel: >
    订阅 SaaS 按月活跃界面计价：Essentials 为 USD 100/interface/month（最低 10 个界面），Professional 为 USD 250/interface/month，Enterprise
    采用定制价格。GTM 采用先落地再扩张：先在单个站点试点，再向产线、站点和地区铺开。
  stage: Series D
  fundingStatus: >
    USD 120M Series D（Jan 2026），由 Mitsubishi Electric 领投，估值 USD 1.3B。此前融资：USD 100M Series C（Aug 2021，Insight
    Partners）。累计披露融资：约 USD 272.5M+。
