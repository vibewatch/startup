  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻赛道与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              应把 Tulip 放在互联工人/一线运营软件市场里分析，而不是把它当作泛“所有制造软件”厂商。独立市场报告对互联工人的定义很宽，足以纳入硬件、服务、部署工具和多个终端市场；Tulip 自己的平台和可组合 MES
              页面则描述了更窄、软件主导的价值主张，围绕无代码应用、数据采集、分析、连接器、治理和受监管工作流支持展开。这意味着最宽口径的类别估计可用于方向性的 TAM 背景，但几乎肯定高估了 Tulip
              近期能直接触达的支出。公司最接近的场景，是工厂用它替换纸质作业指导书、电子表格、僵硬的“纸面流程搬上屏幕”系统、碎片化点工具，以及更慢的传统 MES 定制周期。相邻赛道重要，因为买方也可以用更宽的 MES
              套件、CMMS 或维护工具、ERP 附加模块、内部应用，或流程特定质量系统来完成类似任务。SoftwareWorld 和 SelectHub 都把 Tulip 放进更宽的 MES
              替代方案集合，也说明采购会随买方起点痛点不同，在“互联工人”“MES”和“一线应用平台”标签之间切换。这个区分很重要：投资人应承销软件主导的执行层，而不是整个互联工人硬件、服务与转型支出包。
