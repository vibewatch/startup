              留存叙事是 Tulip 公开证据明显变弱的地方。本次抓取没有公开 NRR、GRR、总流失、客户 logo
              流失、续约率或合同期限披露。这意味着耐久度只能从较弱代理指标推断。多站点部署、全天使用评论和平台扩张引用都提供支持。G2 和 Gartner
              评论在灵活性、速度和支持方面也方向性正面。一个较有用的支持信号是，评论者明确把新用户导向 Tulip 的社区、大学和知识中心材料；Tulip
              自身现在也运行公开状态页，提升服务健康透明度。但这些评论也提供了本章最有用的反向证据。几位用户表示，部署成熟后，治理需要有意识地设置。其他人点出基础分析钻取、有限 joins 或机器逻辑功能、云延迟排障，以及
              EBR 类生命科学用例的功能缺口。这些本身不构成投资逻辑破坏点，但重要，因为它们正是可能拖慢大型受监管账户扩张的问题。正确解读是：Tulip
