      - number: '2.2'
        title: 规模测算视角、买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              两种规模测算视角都相关。宽口径视角使用独立互联工人市场报告，覆盖制造、建筑、采矿、石油天然气和医疗等行业的软件、服务与硬件支出。保守视角使用 Tulip 的真实包装和部署模型：按界面计价的 SaaS、可组合
              MES 套件、治理功能，以及面向需要工作流数字化、设备和系统连接、多站点控制的工厂出售的受监管行业附加模块。后一种窄口径更贴近 Tulip 的实际
              SAM，因为它过滤掉了只需要坚固可穿戴设备、简单巡检，或完整替换既有 ERP/MES
              的项目。买方分层也指向工厂牵引、企业跟进的切入路径。日常用户是操作员、技术员、主管和质量人员；经济买方通常是运营负责人、工厂总监、CI 负责人、制造 IT
              或数字化转型负责人；预算可来自运营卓越、质量、合规或工厂转型池。Tulip 的案例研究反复出现在离散制造、生命科学、包装和国防类环境中，这些场景里流程变异、可追溯性和培训比单一固定应用更重要。换句话说，Tulip
              赢在买方想要一套可配置的一线工作操作系统，而不只是静态指导书仓库或狭窄的维护点工具。这个细节正是估值工作中 SAM 应保持有边界、务实的核心原因。
