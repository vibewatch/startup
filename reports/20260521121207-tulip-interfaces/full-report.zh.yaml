      - number: '8.2'
        title: 建议、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，正确选择不是买入或回避，而是观察 / 继续研究：中等信心、高估值风险。原因在于估值分母不透明。Tulip
              披露的信息足以支撑严肃尽调：新融资、一线战略投资方、可识别的客户证据、品类分析师覆盖，以及相对僵硬传统 MES 的清晰产品差异。缺的是判断 USD 1.3 billion
              估值到底保守、合理还是激进所需的运营数据。公开材料仍未披露 ARR、收入、毛利率、净留存率、服务投入强度或客户集中度。因此，估值判断必须基于情景。如果 Tulip 的 ARR 已明显高于 USD 100
              million，扩张健康、服务负担受控，最新价格或许站得住。如果收入显著低于该区间，或留存弱于叙事暗示，下行可能很大。因此，建议应继续取决于数据室级披露包，而不是只看叙事动能。
