      - number: '8.3'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Tulip 当前融资背景强于许多后期工业软件创业公司，因为 2026 年 1 月那轮融资把资本和战略联盟绑在一起。公司披露了 USD 120 million 的 Series D，估值 USD 1.3
              billion；Mitsubishi Electric 另行宣布了这笔投资，以及一个面向数字化转型方案的更广泛联盟。这一点重要，因为这轮不仅像融资事件，也像商业验证事件。Tulip
              自己的定价和市场推进材料也解释了为什么投资者愿意给溢价：平台按受治理的执行层来卖，可以从一个工作流起步，快速证明 ROI，再扩到工位、产线和站点。但入场纪律仍必须量化。在 USD 1.3 billion
              估值下，假设 ARR 小幅变化，承销结果就会完全不同。没有披露
              ARR，也没有公开的优先股堆叠视图，投资者无法判断最新轮次买到的是溢价软件倍数，还是在为尚未证明的故事提前买单。这种不确定性要求尽调纪律，而不是条件反射地接受标题估值。
            claimRefs:
