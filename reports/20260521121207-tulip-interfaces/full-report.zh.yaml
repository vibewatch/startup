      - number: '1.2'
        title: 领导层、投资方基础与资本轨迹
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始人掌舵。Natan Linder 是 Tulip 的公开门面，始终以联合创始人兼 CEO 身份出现。Rony Kubat 在 2026 年最新产品发布报道中以 CIO 和联合创始人身份出现；更早的
              MIT Media Lab 页面也称 Tulip 是 Linder 和 Kubat 在 MIT 工作之后创立的公司。Natan 的外部履历同样影响尽调判断：World Economic Forum
              传记强调他过去的领导角色，以及他与 Formlabs 的联合创始人/董事长关系，这强化了他作为现实世界技术领域连续创业者的可信度。


              Tulip 的公开融资叙事从 2021 年之后最扎实。August 2021 Series C 公告称 Tulip 融资 $100 million，由 Insight Partners 领投，Pitango
              Growth、TIME Ventures、DMG MORI、NEA 和 Vertex Ventures US 参投。公告还披露，Tulip 服务了 35 个以上国家的数百家全球企业客户，过去三年 ARR 按
              270% CAGR 增长。January 2026，Tulip 宣布完成由 Mitsubishi Electric 领投的 $120 million Series D，估值 $1.3
              billion；无论在官方还是独立报道中，公司都由此进入独角兽类别。


              Mitsubishi Electric 不只是被动投资人。其 December 2025 公告称，Mitsubishi 已经投资 Tulip，并签署战略联盟，以强化 Mitsubishi
              面向制造业的数字化转型方案。因此，January 2026 Series D 看起来不像孤立的风险融资事件，更像一段已经落地运行的战略关系在资本层面的表达。自 2017 年以来，公开点名的轮次合计至少披露
              $272.5 million 资本，尚未计入任何未披露的种子轮或早期战略融资；但当前公开记录仍没有给出干净、最新的股权结构表、清算优先权堆叠或现任董事会名单。
