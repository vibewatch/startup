  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 主要传导路径从平台与合规落地，蔓延到客户信任、扩张、融资和估值风险。
    approximationNotes: 该 DAG 反映本章描述的因果路径，不代表统计权重。
    data:
      nodes:
        - id: platform
          label: 平台可靠性或安全失误
        - id: compliance
          label: 受监管工作流信心下降
        - id: customer
          label: 客户扩张或留存走弱
        - id: finance
          label: 增长 / 融资叙事走弱
        - id: valuation
          label: 估值与信心受压
      edges:
        - from: platform
          to: compliance
        - from: platform
          to: customer
        - from: compliance
