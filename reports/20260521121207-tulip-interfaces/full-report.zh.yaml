  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与变现机制
        blocks:
          - type: paragraph
            body: >-
              作为一家私营工业软件公司，Tulip
              的公开收入模型异常清楚，因为公司发布分层标价，并在法律条款中定义商业单位。核心订阅按界面计价，而不是按具名用户计价，这意味着变现随运行应用、仪表盘或机器连接工作流的运营端点数量扩张。定价页还显示，Tulip
              卖的不是一个单体 SKU。Essentials 和 Professional 锚定基础订阅，Enterprise 和 Regulated Industries
              则增加治理、多语言部署、应用生命周期控制、电子签名、审计历史、长期支持版本和验证包。AI
              动作、自动化任务、机器监控、计算机视觉、GovCloud、高级支持和专业服务等附加项，为基础合同之上提供了明显扩张路径。服务条款通过分别定义界面、自动化、专业服务和支持服务进一步强化了这一结构。这暗示收入组合包括经常性平台收入，以及服务和附加项变现。缺口仍在真实成交价：标价不等于
              ASP，公开语料也看不到折扣、服务绑定、合同期限，或 ARR 中受监管附加模块相对核心订阅的占比。
