  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流定义与模块表面
        blocks:
          - type: paragraph
            body: >-
              最好把 Tulip 理解为运营工作流平台，而不是单个一体化 MES
              模块。产品从操作员工作流出发：工程师和一线团队构建应用，把它们部署到工站和设备，采集流程数据，触发质量或审批步骤，并把信息送入分析和自动化。公开页面展示了宽但连贯的模块图。App Editor
              覆盖无代码工作流构建和受治理部署；Analytics 和 Tables 覆盖仪表盘、KPI 和 AI 辅助报告；Connectors、APIs 和 Machine Kit 覆盖系统与机器连接；Tulip AI 和
              Vision 把 AI 嵌入编写、翻译、缺陷检测和操作员指导；Common Data Model 则为这些模块提供共享 schema。这个宽度很重要，因为 Tulip
              的客户案例描述的不是孤立点工具，而是在同一个运营层里把分步执行、质量采集、设备数据和企业系统连接串起来。
