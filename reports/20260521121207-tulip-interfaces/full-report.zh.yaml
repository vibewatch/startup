      - number: '3.3'
        title: 切换成本、锁定效应、多栖使用与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              Tulip 的护城河有意义，但并非绝对。最强锁定来自已配置工作流、已连接数据模型、集成、操作员培训、审批和已验证流程，而不只是自有内容。一旦 Tulip
              嵌入生产，这些因素会制造真实切换摩擦，尤其是在受监管或高混合场景中。同时，多栖使用很常见：工厂可以用 Tulip 做一线执行，同时在堆栈其他位置保留 SAP、Oracle、Plex、Opcenter、CMMS
              或内部工具。这把刀两面都有刃。它让 Tulip 更容易先落地再扩张，也降低了相邻工具共存并逐步替代它的门槛。现有巨头通过渠道触达、更宽的安装基础和企业架构可信度保留强势优势。直接同行通过复制 AI
              叙事、工作流数字化和协作功能进一步缩小差距。即便只看厂商表层证据，也能感到类别正在快速趋同：多个旧竞争对手 URL 现在返回 404，G2 对比内容被 JS 门禁拦住，私营公司定价仍不透明。因此，Tulip
              的耐久优势不是“互联工人”品牌本身，而是公司能否持续证明：可配置、可治理的一线应用比僵硬套件更快产出价值，也比打包点工具更可扩展。
