        title: 合作伙伴、竞争与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Tulip 的合作伙伴风险和财务风险紧密相连。战略上，Mitsubishi Electric 有价值，因为它增加渠道可信度和制造业联盟；但它也是一种依赖，可能塑造 GTM 和退出预期。技术上，Tulip 依赖开放
              APIs、客户系统、边缘连接、外部 AI 提供商和云基础设施，因此链条任何一环失效，即便 Tulip 自身代码没问题，也会损害一线工作流。竞争同样强。PTC、Siemens 和 Rockwell
              都有大得多的安装基础、更多资源，以及打包相邻能力的能力。现在 AI 功能正成为工业软件的入场券，这一点尤其相关。财务上，最大风险不是公开弱，而是公开不透明。Tulip 以 USD 1.3 billion
              估值融了一大笔 Series D，这对短期现金跑道有安抚作用；但当前收入、烧钱速度、客户集中度和续约质量仍未披露。因此，在管理层数据澄清 Tulip
              的类别叙事能否转化为耐久、高效收入之前，投资人必须假设存在有意义的执行风险。
