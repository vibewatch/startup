  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、现有巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Tulip 位于互联工人软件、一线执行应用和可组合 MES 的交叠处。这个交叠带来了混乱的真实采购短名单。直接同行包括 Augmentir、Parsable、Poka 和
              Redzone，因为它们都在营销某种组合：一线指导、协作和 AI 增强的工厂执行。但采购很少止步于此。买方想要更大的 IIoT 或制造运营平台时，也会选择 PTC ThingWorx、Siemens
              Opcenter 或 Rockwell Plex 等更宽的现有堆栈；如果核心任务是工单、正常运行时间和资产历史，而不是操作员工作流组合，他们也可能横向转向 MaintainX 或 Fabrico
              等维护中心工具。G2、SoftwareWorld 和 SelectHub 的替代方案目录进一步印证了这种碎片化：它们把 Tulip 放在 MES 套件、ERP
              关联制造工具和点产品旁边，而不是一个干净的同行集合里。实际含义是，Tulip 防守的不只是一种类别叙事；它必须打赢现状流程、内部自建选项、专门的互联工人工具，以及带着已安装基础杠杆进入的更大套件。
