  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              看多 Tulip，首先看的是品类逻辑，而不是单纯的财务披露。Tulip
              不是在卖一款通用工作流应用；它把自己定位成可组合制造平台，嵌在操作员、机器、企业系统和受治理的变更控制之间。公开资料也说明，这个品类不是凭空想象出来的。分析师市场资料把互联一线员工和一线运营软件描述成一个增长中但分散的市场，需求来自生产率、安全和数字化转型。Tulip
              自己的 2026 年融资材料，还给出了一家私有工业软件公司少见的具体覆盖信号：43,000 个应用、60,000 名一线员工、1,000 个客户站点，以及 45
              个国家的运营覆盖。评论反复称赞灵活性、快速部署，以及适配不断变化的车间工作流，强化了核心产品逻辑。反向逻辑也同样具体：独立评论还提到治理投入、云端根因不清、受监管工作流功能缺口；公开材料仍没有
              ARR、留存、毛利率和烧钱速度。因此，公司可能确实很强，但仅凭公开证据仍无法精确定价。
