      - number: '2.3'
        title: 增长驱动、采用约束与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              独立证据和公司背书证据对市场扩张原因判断一致：制造商面临劳动力短缺、培训压力、质量要求，并且越来越需要把一线执行接入实时数据。Business Research Insights
              报告了广泛采用和强生产率提升；Tulip 的 TEI 和客户故事则说明，工作流数字化之后，买方为什么愿意持续投入。但同一批证据也指出约束。Mordor 明确把高实施成本列为市场阻力；替代方案评论来源则把
              Tulip 描述为功能强，但相比更简单或更打包的替代品可能更贵、集成更重。Tulip
              自己的治理、安全和受监管行业页面也说明，企业价值伴随真实的部署复杂度，不是一款轻量清单应用。承销中最大的未解问题不是这个类别是否存在，而是 Tulip
              能在多大程度上高效服务头部类别，而不陷入长实施周期或沉重服务开销。市场规模估计相互矛盾、顾问页面无法访问、缺少清晰的分部收入披露，因此正确结论应是有边界、受证据约束的 SAM，而不是单个激进 TAM
              数字。后续尽调也应聚焦实施周期、服务强度和垂直扩张率，而不是只把自上而下 TAM 当成变现预测。
