  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Tulip 的监管风险大多是间接的，但仍有后果，因为公司卖进生命科学、医疗技术、航空航天和国防工作流；这些场景看重可审计性和数据完整性。Tulip 自己的 GxP 和航空航天材料明确把产品锚定在 21 CFR
              Part 11 风格控制、电子签名、审计追踪、验证支持和国防级安全定位上。这带来上行空间，也抬高了失败成本：如果产品在受监管场景中不达标，客户承受的运营损害可能远大于通用工作流软件。法律表面相当成熟。Tulip
              发布隐私政策、服务条款和网站条款，这些文件描述了数据处理、安全措施和合同限制。但公开语料不等于尽调已完全扫清。抓取到的 eCFR Part 11 页面被反爬控制拦截；公开记录也没有显示审计结果、重大诉讼，或
              FedRAMP Moderate Equivalency 之外的正式授权直接证据。这意味着监管和法律尽调仍是活问题，不是已经勾掉的框。
