      - CU024
      - CU033
      - CU037
      - CU041
  - id: FU004
    title: 客户证据 KPI
    type: kpi
    layout: standard
    summary: 从公开客户证据看，Tulip 在具名证明和部署广度上较强，但缺少硬性的持续性指标。
    approximationNotes: 计数是本章层面的公开证据标记，不是公司内部 KPI。
    data:
      items:
        - label: 具名客户案例研究
          value: 9
          detail: 已抓取官方案例研究，客户身份明确
          tone: positive
        - label: 公开多站点上线案例
          value: 2
          detail: Tiffany 和 DMG MORI 给出了最清晰的可见扩张案例
          tone: opportunity
        - label: 反向评价主题
          value: 4
          detail: 治理、分析、云端故障排查和类似 EBR 的缺口反复出现
          tone: risk
        - label: 已披露留存指标
          value: 0
          detail: 未发现公开的 NRR、GRR、流失率或续约率披露
          tone: high
    claimRefs:
