      - number: '4.4'
        title: 公开牵引力、私有缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开财务图景足以支撑有条件的正面判断，但不足以支撑干净的承销模型。正面看，Tulip 有清晰的订阅单位、公开入门定价、高价值扩张杠杆、2026
              年融资轮的独立佐证，以及表明产品能在大型工业环境中证明支出合理的客户证据。FedRAMP 等效性推进和国防导向叙事也可能打开更高价值的受监管预算。负面看，投资人把叙事转成模型所需的几乎所有指标都缺失：当前
              ARR、收入、毛利率、CAC、NRR、实施成本、支持负担、客户集中度和现金消耗，在本次抓取的公开记录中都没有。即便某些监管尽调也未完成，因为 eCFR Part 11
              页面抓取结果是访问拦截页，而不是可读文本来源。因此，正确结论不是“财务薄弱”，而是“仅凭公开证据无法确认财务质量”。Tulip
              看起来像一家资金充足、路径上可能跑出有吸引力经济性的私营软件公司；但如果没有管理层资料室访问，它还不像一家收入质量可以被承销的公司。
