    rows:
      - - 投资建议
        - 观察 / 继续研究
        - 中
        - 只有管理层在尽调中提供可审计的 ARR、利润率、留存和股权结构表数据，才继续推进
      - - 风险评级
        - 估值风险高，公司质量风险中等
        - 中
        - 先建下行情景；估值压缩可能比产品叙事破裂更快
      - - 估值立场
        - USD 1.3B 估值有溢价，但尚未验证
        - 低至中
        - 收入质量披露前，只能把当前估值标记视为可解释，不能算承销完成
      - - 目标回报逻辑
        - 基准情景支持持有纪律，不支持明显低价入场
        - 低
        - 不要只靠品类增长或 Mitsubishi 这条新闻来承销上行空间
      - - 什么会提升判断
        - ARR 高于 ~USD 130-160M，扩张强劲，服务收入组合健康
        - 中
        - 干净的数据室可把判断从观察推到可投资
      - - 什么会推翻判断
        - ARR 明显低于 ~USD 100M、留存偏弱，或下一轮融资更弱
        - 中
        - 这些结果会让最新价格显得偏高
    notes: 本表是基于公开证据和明确估值敏感性的综合判断，不能替代管理层财务披露。
