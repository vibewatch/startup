      - number: '1.3'
        title: 牵引力信号、2025-2026 里程碑与尽调红旗
        blocks:
          - type: paragraph
            body: >-
              Tulip 最强的公开牵引力信号来自融资披露、客户证据和近期产品发布的组合。January 2026 Series D 材料称，Tulip 在 2025 年覆盖 45 个国家的 60,000
              名一线员工、1,000 个客户站点和 43,000 个应用；当前网页文案则指向 47 个国家、110 家合作伙伴和 29 种语言。本次抓取材料中的具名客户横跨受监管和工业类别，包括
              AstraZeneca、Richemont、Stanley Black & Decker 和 DMG MORI；单个案例研究还显示了可量化结果，例如 Tiffany 将发布节奏从季度级推进到接近每周，VEKA
              将条码相关质量逃逸减少 88%，Reframe 压缩住宅生产周期。


              里程碑节奏也很关键。April 2025，Tulip 推出面向航空航天与国防的可组合 MES；February 2026，公司宣布 FedRAMP Moderate Equivalency；March
              2026，公司与 NVIDIA 推出 Factory Playback，把视频和运营数据同步成可回放的生产时间线。合在一起看，这些里程碑表明 Tulip
              正试图从“无代码一线应用平台”转向更宽的执行系统叙事，把合规、AI 和工业数据上下文都纳入其中。


              尽调红旗更多指向不透明，而不是明显困境。评论和市场证据整体偏正面，但独立用户仍指出治理复杂度、云连接排障、部分场景分析深度有限，以及高度特定的批记录或机器逻辑需求存在功能缺口。社区帖子还显示，Tulip 直到
              2025
              年底才正式推出公开状态页；公司自己的帖子也把该页面定义为高严重性、多客户事故的事实来源。本次抓取到的法律或事故页面没有显示重大披露安全事件或诉讼，但公司仍需要比头部动能指标更深入的尽调，尤其是当前经济性、客户集中度和治理。
