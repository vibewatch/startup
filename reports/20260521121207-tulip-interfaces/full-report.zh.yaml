  - id: TV004
    title: 可比估值表
    slug: comparable-valuation-table
    enumeration: true
    columns:
      - 可比对象
      - 参考类型
      - 估值 / 状态
      - 与 Tulip 的相关性
      - 局限
    rows:
      - - Tulip
        - 最新私募融资轮
        - 2026 年 1 月投后估值 USD 1.3B
        - 需直接承销的当前估值标记
        - 收入和留存分母未披露
      - - PTC / ThingWorx
        - 上市工业软件所有者
        - 上市披露主体，有经审计报告，工业软件敞口广
        - 可作为 IIoT / 执行软件披露标准的纪律基准
        - 范围远宽于独立连接工人平台
      - - Siemens / Opcenter
        - 上市工业软件套件
        - 大型上市集团内嵌产品
        - 是大型企业竞争中的相关既有 MOM / MES 基准
        - Opcenter 本身没有独立估值或倍数
      - - Rockwell / Plex
        - 上市所有者加内嵌云资产
        - 上市披露主体；Plex 页面强调 8B+ 日交易量和 96% 总续约率
        - 可作深度嵌入式工业软件规模化形态的基准
        - 不是 Plex 的清晰独立公开估值
      - - MaintainX
        - 相邻私有一线软件
        - 大规模私有运营商，页面显示覆盖 14,000+ 家公司
        - 说明现代一线软件可在传统 MES 之外实现广泛部署
        - 以维护为先的定位窄于 Tulip 执行层逻辑
    notes: 这是一组方向性可比对象，不是精确倍数表，因为最佳工业参照大多是内嵌产品或大型上市公司语境，而非独立纯标的。
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerated from the fetched public corpus of Tulip-adjacent industrial-software references that are most
        relevant to buyer context, disclosure discipline, and execution-layer competition.
    claimRefs:
      - CV001
      - CV009
      - CV021
      - CV022
      - CV023
      - CV030
      - CV044
  - id: TV005
    title: 逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 下一轮融资事件偏弱
        - 相比 USD 1.3B 持平或下调
        - 表明私募市场不再接受溢价叙事
        - 重切估值，暂停新增资金承诺
      - - 经济性落空
        - ARR 明显低于 ~USD 100M，或毛利率显著低于软件预期
        - 在合理倍数下，当前估值标记将难以支撑
        - 除非价格重置，否则从观察转为回避
      - - 留存或集中度弱点
        - NRR 低于 100%，或头部客户依赖明显偏高
        - 会打破先落地再扩张的韧性逻辑
        - 提高下行权重，降低终值倍数
      - - 受监管工作流产品缺口持续存在
        - 路线图承诺后，大型背调客户仍提到类 EBR 或治理短板
        - 会削弱受监管制造业的溢价逻辑
        - 下调护城河和扩张假设
      - - 联盟交付不及预期
        - Mitsubishi 伙伴关系几乎没有带来可衡量销售管线或部署杠杆
        - 会削弱本轮内含的战略上行和退出可选性
        - 从估值中剥离战略溢价
    notes: 触发因素被设计为可观察的尽调或投后事件，因此能同时服务入场和监控纪律。
    claimRefs:
      - CV011
      - CV020
      - CV033
      - CV039
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与增长
        - 最新 ARR、往绩收入和队列增长
        - 需要用它把 USD 1.3B 换算成真实倍数
        - 管理层财务包和董事会指标
      - - 留存质量
        - 总留存率、NRR、客户 logo 流失和模块附加
        - 决定先落地再扩张逻辑是否真实
        - 客户队列分析和背调通话
      - - 利润率结构
        - 订阅与服务毛利率，以及实施负担
        - 区分可规模化软件经济性和重人力交付
        - FP&A 审查和服务利用率分析
      - - 客户集中度
        - 前 10 大客户和按垂直行业划分的收入占比
        - 如果少数灯塔客户占主导，决定下行风险
        - 收入集中度明细表
      - - 股权结构表和优先权
        - Series D 条款、清算优先权和任何老股交易动态
        - 必须弄清真实入场经济性和退出回款
        - 法律尽调和融资文件
      - - 受监管工作流深度
        - 需要看到部署证据已经验证、审计历史完整，高级用例路线图能闭环
        - 决定生命科学和防务能否支撑高价
        - 产品、合规和客户参考尽调
    notes: 这些是当前价格下，足以实质改变投资决策的最小未决事项集合。
    claimRefs:
      - CV012
      - CV013
      - CV028
      - CV029
      - CV038
      - CV044
