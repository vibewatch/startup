      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Tulip 同时依赖监管方、云与 AI 供应商、客户系统、边缘连接和战略合作伙伴。
    approximationNotes: 展示会影响 Tulip 交付和扩张能力的关键交易对手与层级。
    data:
      nodes:
        - id: reg
          label: 监管方 / 合规标准
        - id: cloud
          label: 云与 AI 提供商
        - id: custsys
          label: 客户系统与数据
        - id: edge
          label: 边缘设备与网络
        - id: partner
          label: 战略合作伙伴 / 投资方
        - id: tulip
          label: Tulip 平台交付
        - id: buyer
          label: 客户信任与扩张
      edges:
        - from: reg
          to: tulip
          label: 安全 / 合规负担
        - from: cloud
          to: tulip
          label: 基础设施 / AI 服务
        - from: custsys
          to: tulip
          label: 集成
        - from: edge
          to: tulip
          label: 机器上下文
        - from: partner
          to: tulip
          label: 联盟影响力
        - from: tulip
          to: buyer
          label: 工作流执行与信任
    claimRefs:
