              Tulip 的公开客户证据指向一个宽但非常具体的客户类型：复杂制造商和受监管运营方。它们需要灵活的工作流数字化，而不是狭窄点解决方案。2026 年 Series D 材料称，2025 年 Tulip 应用支撑了
              45 个国家、1,000 个客户站点、60,000 名一线员工的工作。具名证据进一步勾勒出这个足迹。Tiffany 属于奢侈品，VEKA 属于建材，Pratt Miller 属于工程和国防相邻制造，TICO
