chapter:
  number: 6
  title: Customers
  summary: Tulip has unusually strong named-customer proof for a private industrial software company, with recent case studies spanning luxury manufacturing, building products, engineering, heavy equipment, additive manufacturing, pharma packaging, and medical devices. The positive read is broad production relevance and credible land-and-expand behavior; the caution is that public evidence is rich in workflow outcomes but still thin on NRR, churn, contract length, and customer concentration.
sections:
- id: customer-base-segmentation
  title: Customer base shape, segmentation, and adoption footprint
  body: 'Tulip’s public customer evidence points to a broad but very specific type of customer: complex manufacturers and regulated operators that need flexible workflow digitization more than they need a narrow point solution. The 2026 Series D materials say that in 2025 Tulip apps enabled the work of 60,000 frontline workers across 1,000 customer sites in 45 countries. Named proof then fills in the shape of that footprint. Tiffany sits in luxury goods, VEKA in building products, Pratt Miller in engineering and defense-adjacent manufacturing, TICO in terminal tractors, Formlabs in additive manufacturing, Sharp in clinical packaging, and Laerdal in medical products. Those are not lightweight references. They suggest Tulip wins where execution, traceability, and change management matter. The public corpus is less clear on payer economics than on user workflows, but the recurring pattern is a buyer group spanning operations, engineering, IT, quality, and process-development teams who need
    a common digital layer across workstations, sites, or value streams.'
