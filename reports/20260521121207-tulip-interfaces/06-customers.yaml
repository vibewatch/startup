  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, contract lengths, and cohort retention by customer vintage.
    whyItMatters: Without direct durability metrics, strong workflow proof still cannot be translated into revenue-quality confidence.
    diligencePath: Request customer cohort retention tables, renewal schedule, and top-20 account expansion history.
    relatedQuestionRefs:
    - QU015
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 concentration, and revenue by site count or vertical.
    whyItMatters: A handful of large accounts could dominate ARR even if public customer proof looks broad.
    diligencePath: Request ARR by top-10 accounts, customer concentration bridge, and site-count distribution by paying account.
    relatedQuestionRefs:
    - QU018
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: A complete list of active production customers and inactive or failed deployments.
    whyItMatters: Public named case studies are curated and may overstate average deployment success.
    diligencePath: Request full customer reference list segmented by production, pilot, churned, and inactive accounts.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: channel-partner-dependence
    missingEvidence: Partner-sourced pipeline, SI reliance, and services-delivery mix by channel.
    whyItMatters: Partner dependence changes margin quality and customer-control risk during deployment and expansion.
    diligencePath: Request bookings and implementation mix split by direct vs partner-led motion.
    relatedQuestionRefs:
    - QU024
