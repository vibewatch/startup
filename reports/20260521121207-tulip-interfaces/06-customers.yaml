- id: named-customer-proof
  title: Named customer proof and what it actually demonstrates
  body: Tulip’s strongest customer evidence is not logo collection; it is outcome-specific case material. Tiffany says Tulip now supports every stage of production across four North American sites, with faster new-product introductions, less training time, and lower rework. VEKA links Tulip to traceability and dramatic reductions in quality escapes, scrap, and returns. Reframe uses Tulip as the digital backbone behind prefabricated-home manufacturing that it says runs 2.5x faster. TICO ties Tulip to materially lower quality-inspection and rework effort. Formlabs describes shorter cycle time, lower defect-logging time, and higher productivity. Sharp says clinical packaging became 30% faster. Laerdal uses Tulip Vision to verify kit completeness before shipment. DMG MORI and Software Connect together suggest Tulip can live across a global machine-builder footprint rather than inside a single pilot cell. The result is a high-confidence conclusion that Tulip works in production environments.
    What it does not prove is revenue concentration, contract size, renewal behavior, or expansion economics by cohort.
