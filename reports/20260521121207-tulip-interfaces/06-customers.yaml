- id: expansion-concentration
  title: Expansion logic, concentration risk, and what remains unknown
  body: Taken together, the public record supports a land-and-expand interpretation of Tulip’s GTM motion. Customers often start with a painful workflow, prove value quickly, then widen the footprint across more stations, processes, or sites. Tiffany’s four-site deployment and 1,700-user footprint are the clearest public example, but DMG MORI, the broad case-study portfolio, and the 1,000-site scale metric all point in the same direction. That is the positive. The negative is that public concentration and channel exposure remain largely opaque. Tulip’s strongest logos are impressive, but the fetched corpus does not disclose top-customer revenue share, partner-sourced pipeline contribution, renewal cohorts, or average site count per account. For investors, that means the customer chapter can support confidence in relevance and adoption, but not a clean durability or concentration underwrite. Those missing denominators should be carried directly into diligence asks before any high-confidence
    revenue-quality conclusion is made.
