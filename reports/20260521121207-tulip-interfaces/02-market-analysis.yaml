  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A normalized, source-consistent market model that reconciles analyst scope differences and converts the connected-worker outer category into a Tulip-relevant software SAM.
    whyItMatters: Valuation work can be distorted if broad category TAM is mistaken for the spend Tulip can actually reach.
    diligencePath: Request management's internal market model by vertical and compare it against a reconciled bottom-up view using customer counts, site counts, and price bands.
    relatedQuestionRefs:
    - QM010
    - QM023
  - type: access-blocked
    severity: minor
    topic: consultant-benchmarks
    missingEvidence: Full-text access to McKinsey, Deloitte, and Forrester materials that are only partially visible or inaccessible in the fetched corpus.
    whyItMatters: Open-public evidence may understate or overstate adoption dynamics when widely cited consultant work cannot be checked directly.
    diligencePath: Obtain licensed copies or management-provided PDFs for the cited consultant reports and rerun the market narrative with direct quotations.
    relatedQuestionRefs:
    - QM021
    - QM025
  - type: private-evidence-only
    severity: material
    topic: som-precision
    missingEvidence: Pipeline conversion, deployment-capacity, ACV, and retention data needed to turn the conservative SAM into a reliable near-term SOM.
    whyItMatters: Without internal funnel and cohort data, public market analysis cannot say how much of the category Tulip can win economically.
    diligencePath: Request cohort ARR, implementation duration, services load, and multi-site expansion rates by vertical.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: regional-adoption-corroboration
    missingEvidence: Second-source corroboration for the specific regional-share and enterprise-adoption percentages quoted by Business Research Insights.
    whyItMatters: Single-source adoption figures are directionally useful but not strong enough to carry a hard underwriting conclusion alone.
    diligencePath: Cross-check regional adoption and penetration with another open analyst or government dataset before using them in an investment memo.
    relatedQuestionRefs:
    - QM022
