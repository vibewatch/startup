- id: TM002
  title: TAM / SAM / SOM sizing lens table
  columns:
  - Lens
  - Publisher / basis
  - Geography / period
  - Value / growth
  - Methodology lens
  - Confidence
  - Key limitation
  rows:
  - - Broad TAM
    - Business Research Insights
    - Global, 2026-2035
    - USD 11.5B in 2026 to USD 37.69B by 2035; 14.1% CAGR
    - Connected worker market across hardware, software, and services
    - Medium
    - Likely overstates Tulip-relevant spend because the scope includes categories Tulip does not monetize directly
  - - Broad TAM
    - Mordor Intelligence
    - Global, 2025-2030
    - USD 8.88B in 2025 to USD 27.52B by 2030; 25.39% CAGR
    - Connected worker category segmented by component, deployment, end user, and geography
    - Medium
    - Different base year, category scope, and forecast horizon make it non-comparable to BRI without adjustment
  - - Category maturity lens
    - QKS Group SPARK Matrix
    - Global, Q4 2025
    - Category tracked as connected frontline workforce platform
    - Confirms an analyst-defined vendor set exists around frontline-workforce platforms
    - Low
    - The fetched page exposes only title-level evidence, not market size or ranking detail
  - - Conservative SAM
    - Tulip product + packaging lens
    - Current
    - Manufacturing and regulated frontline-app / composable-MES budgets only
    - Uses Tulip's actual interface pricing, governance features, and regulated-industry positioning to bound serviceable demand
    - Medium
    - No public third-party source isolates this SAM cleanly
  - - Near-term SOM
    - Operationally constrained estimate
    - Current
    - Subset of SAM reachable through enterprise, multi-site, integration-heavy deployments
    - Limited by implementation complexity, buyer readiness, and enterprise governance requirements
    - Low
    - Private conversion, retention, and deployment-capacity data are unavailable
  notes: The table intentionally keeps incompatible sizing methodologies separate rather than averaging them into one synthetic TAM.
