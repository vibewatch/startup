- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for adoption
  - Evidence or diligence ask
  rows:
  - - Labor shortages and frontline turnover
    - Driver
    - Current / structural
    - Raises demand for digital guidance, faster onboarding, and knowledge capture
    - Supported by consultant and Tulip TEI narratives; quantify by vertical during diligence
  - - Quality and traceability requirements
    - Driver
    - Current / structural
    - Improves ROI for workflow digitization in regulated or high-complexity plants
    - Validated by Tulip case studies and regulated-product surfaces
  - - AI-enabled analytics and workflow automation
    - Driver
    - Current / accelerating
    - Expands value proposition beyond digitization into decision support and continuous improvement
    - Company claims are strong; need independent evidence on sustained usage and monetization
  - - Integration complexity with legacy systems
    - Constraint
    - Current
    - Can stretch pilot-to-scale timelines and require specialist resources
    - Mordor cites implementation cost restraint; alternative reviews mention integration frictions
  - - Price sensitivity at small sites
    - Constraint
    - Current
    - Interface-based pricing and minimum thresholds can limit light-use cases
    - List pricing is clear, but realized discounting and services bundling are unknown
  - - Category-definition ambiguity
    - Constraint
    - Persistent
    - Makes TAM/SAM arguments easy to overstate in fundraising or valuation work
    - Keep contradictory market estimates explicit rather than forcing one blended number
  notes: Some timing judgments are analytical rather than directly stated by sources; they are included to connect evidence to adoption pacing and diligence priorities.
