tables:
- id: TM001
  title: Market definition table
  columns:
  - Market slice
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters for Tulip
  rows:
  - - Broad connected worker market
    - Software, services, wearables, deployment tooling, analytics, and workflow enablement across frontline-heavy industries
    - General ERP suites, pure industrial hardware not tied to worker workflows, and unrelated office productivity software
    - Enterprise operations, digital transformation, EHS, OT/IT
    - Useful outer TAM reference, but broader than Tulip's practical sales motion
  - - Frontline operations software
    - Workflow digitization, work instructions, quality capture, data collection, analytics, connectors, automations
    - Standalone AR hardware, generic dashboards without workflow layer, consulting-only spend
    - Plant director, operations excellence, quality, manufacturing IT
    - Closest category fit to Tulip's platform positioning and packaging
  - - Composable MES / regulated workflow systems
    - Execution, traceability, approvals, compliance records, common data model, governance
    - Full monolithic ERP replacement, heavy APS/SCM modules, unrelated PLM authoring
    - Manufacturing IT, quality/compliance, site leadership
    - Represents the highest-value SAM slice for regulated and complex manufacturers
  - - Status-quo substitutes
    - Paper SOPs, clipboards, spreadsheets, email, whiteboards, fragmented local apps
    - Any solution already embedded with real-time validation and traceability
    - Plant manager, supervisors, CI leaders
    - Explains why pilots can start from local pain rather than enterprise transformation mandates
  - - Adjacent substitutes
    - Legacy MES, CMMS/maintenance platforms, QMS modules, internal-build apps, ERP add-ons
    - Software not used on the frontline or not tied to operational execution
    - CIO, manufacturing IT, enterprise architects
    - Shows procurement can shift between categories even when the job-to-be-done overlaps
  notes: Broad analyst TAMs combine multiple spend pools; Tulip underwriting should separate outer-category context from the narrower software-led frontline execution layer it actually sells into.
