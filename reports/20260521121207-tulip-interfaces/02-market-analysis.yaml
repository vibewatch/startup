- id: TM003
  title: Buyer / user / payer segmentation table
  columns:
  - Segment / vertical
  - Economic buyer
  - Primary users
  - Typical payer / budget owner
  - Workflow trigger
  - Why Tulip fits
  rows:
  - - Discrete manufacturing plant
    - Plant director or operations leader
    - Operators, supervisors, technicians
    - Operations excellence or plant budget
    - Paper processes, quality escapes, slow changeovers
    - No-code apps and machine connectivity fit fast local workflow redesign
  - - Regulated pharma / medtech site
    - Quality or manufacturing systems lead
    - Operators, quality staff, validation teams
    - Compliance, quality, and digital manufacturing budgets
    - Traceability, approvals, audit readiness, validation needs
    - GxP-ready controls and record history raise willingness to pay
  - - Packaging / process operations
    - Continuous improvement or site operations
    - Line leads, operators, quality teams
    - Operations or productivity budget
    - Need for faster root-cause visibility and standardized execution
    - Analytics plus guided workflows support throughput and defect reduction
  - - Defense / aerospace-style build environments
    - Manufacturing engineering or program operations lead
    - Assemblers, inspectors, inventory teams
    - Program, quality, and manufacturing IT budgets
    - Configuration changes, serial traceability, contract requirements
    - Composable MES and rapid workflow adaptation address high-mix complexity
  - - Enterprise digital transformation office
    - Manufacturing IT / OT or transformation leader
    - Local site teams across plants
    - Central transformation budget with site co-funding
    - Scaling proven pilot across sites with governance
    - Workspaces, approvals, connectors, and common data model support standardization
  notes: Segmentation reflects observed buyers and users across Tulip product pages and case studies; public sources do not disclose exact ACV or budget line items by vertical.
