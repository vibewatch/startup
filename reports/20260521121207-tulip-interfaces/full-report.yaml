            body: >-
              The retention story is where Tulip’s public evidence becomes noticeably weaker. There is no fetched public
              NRR, GRR, gross churn, logo churn, renewal-rate, or contract-length disclosure. That means durability has
              to be inferred from weaker proxies. Multi-site deployments, all-day usage comments, and references to
              platform expansion are supportive. Reviews on G2 and Gartner are also directionally positive on
              flexibility, speed, and support. One of the more useful support signals is that reviewers explicitly point
              new users toward Tulip’s community, university, and knowledge-hub materials, while Tulip itself now runs a
              public status page for service-health transparency. But those same reviews also supply the chapter’s most
              useful adverse evidence. Several users say governance needs deliberate setup as deployments mature. Others
              call out basic analytics drill-down, limited joins or machine-logic functionality, cloud-latency
              troubleshooting, and feature gaps for EBR-like life-sciences use cases. Those are not thesis-breaks on
              their own, but they matter because they are exactly the kinds of issues that can slow expansion inside
              large regulated accounts. The right read is that Tulip’s customer love appears real, but public durability
