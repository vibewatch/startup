  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Tulip should be analyzed inside the connected-worker/frontline-operations software market, not as a
              generic “all manufacturing software” vendor. Independent market reports frame connected worker broadly
              enough to include hardware, services, deployment tooling, and multiple end markets; Tulip's own platform
              and composable-MES pages describe a narrower software-led value proposition built around no-code apps,
              data capture, analytics, connectors, governance, and regulated-workflow support. That means the broadest
              category estimates are useful for directional TAM context, but they almost certainly overstate the spend
              directly reachable by Tulip in the near term. The company is closest to plants replacing paper work
              instructions, spreadsheets, rigid paper-on-glass systems, fragmented point tools, and slower legacy MES
              customization cycles. Adjacencies matter because buyers can also solve similar jobs with broader MES
              suites, CMMS or maintenance tools, ERP add-ons, internal apps, or process-specific quality systems.
              SoftwareWorld and SelectHub both surface Tulip in broader MES-alternative sets, reinforcing that
              procurement can shift between “connected worker,” “MES,” and “frontline app platform” labels depending on
              the buyer's starting pain point. That distinction matters because investors should underwrite the
              software-led execution layer, not the entire bundle of connected-worker hardware, services, and
              transformation spend.
