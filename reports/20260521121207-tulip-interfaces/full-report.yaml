companyProfile:
  summary: >
    Tulip Interfaces is a Somerville, Massachusetts-based industrial SaaS company that provides a no-code, AI-enabled
    frontline operations platform for manufacturing and other operational environments. Founded by Natan Linder and Rony
    Kubat out of the MIT Media Lab, Tulip helps manufacturers digitize workflows, connect people, machines, and
    enterprise systems, and drive continuous improvement without traditional IT development cycles. The company reached
    unicorn status with a USD 120 million Series D in January 2026 led by Mitsubishi Electric at a USD 1.3 billion
    valuation, and serves customers across 47 countries with 43,000 apps and 60,000 frontline workers on its platform.
  foundedDate: '2012-01-01'
  founders:
    - name: Natan Linder
      role: Co-founder & CEO
      background: MIT Media Lab researcher and serial entrepreneur; also co-founder/chairman at Formlabs.
      claimRefs:
        - CO012
    - name: Rony Kubat
      role: Co-founder & CIO
      background: MIT Media Lab researcher; co-founded Tulip alongside Natan Linder.
      claimRefs:
        - CO013
  foundingLocation: Cambridge, MA (MIT Media Lab)
  headquarters: Somerville, MA
  productSummary: >
    Tulip provides a composable, no-code frontline operations platform including an App Editor, Analytics, AI (Tulip AI
    / GenAI), Computer Vision, Machine Kit (edge device connectivity), Automations, Common Data Model, and Connectors &
    Integrations. The platform offers pre-built Composable MES suites for Medical Devices, Pharmaceuticals, Aerospace &
    Defense, and Discrete Manufacturing. It is cloud-native, GxP-ready, and achieved FedRAMP Moderate Equivalency in
    February 2026.
  customerFocus: >
    Mid-market to enterprise manufacturers in regulated industries (life sciences, medical devices, pharma, aerospace &
    defense) and discrete manufacturing (electronics, consumer goods, industrial). Targets operations managers, plant
    directors, and IT/OT leaders responsible for digitizing frontline workflows.
  businessModel: >
    Subscription SaaS priced per monthly active interface: Essentials at USD 100/interface/month (10-interface minimum),
    Professional at USD 250/interface/month, Enterprise at custom pricing. Land-and-expand GTM with pilots at one site
    followed by rollout across lines, sites, and geographies.
  stage: Series D
  fundingStatus: >
    USD 120M Series D (Jan 2026) led by Mitsubishi Electric at USD 1.3B valuation. Prior: USD 100M Series C (Aug 2021,
    Insight Partners). Total disclosed: ~USD 272.5M+.
