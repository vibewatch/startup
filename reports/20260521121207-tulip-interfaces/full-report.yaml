              toward a more AI-native operations system. The aerospace-and-defense Composable MES announcement
              emphasizes traceability, CAPA, and regulated manufacturing apps; Tulip AI adds generation, translation,
              OCR, and AI agents; and Factory Playback, built with NVIDIA technology, adds replayable operational
