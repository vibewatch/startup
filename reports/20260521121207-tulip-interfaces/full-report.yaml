      - number: '4.3'
        title: Cost structure, capital adequacy, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Tulip is financially easier to think about as a software-plus-services company than as a capital-intensive
              hardware business. The main cost centers implied by the public corpus are cloud infrastructure, AI
              inference and external model providers, implementation and support, compliance and security, and a sales
              organization capable of serving multi-site manufacturers. The AI security and governance documentation is
              particularly informative because it names AWS, Azure, DeepL, and related services in Tulip's AI feature
              stack. That is direct evidence that some incremental usage economics sit on top of third-party cloud and
              model vendors rather than a fully owned stack. The infrastructure and compliance burden is also visible
              operationally. Tulip now runs a public status surface, and its 2026 maintenance-event notices repeatedly
              reference database upgrades, Kubernetes migrations, ingress changes, and regional downtime windows. Those
              are not distress signals, but they are reminders that availability engineering, SRE, and compliance are
              real line items in the service-delivery model. Capital adequacy improved materially with the 2026 Series
              D: the company raised USD 120 million at a USD 1.3 billion valuation led by Mitsubishi Electric after the
              2021 USD 100 million Series C. That is meaningful cushion, but public burn, cash balance, and runway
              remain undisclosed, so capital sufficiency still depends on private operating data.
