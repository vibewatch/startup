  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Tulip sits in the overlap between connected-worker software, frontline execution apps, and composable MES.
              That overlap produces a messy real-world shortlist. Direct peers include Augmentir, Parsable, Poka, and
              Redzone because all market some mix of frontline guidance, collaboration, and AI-enhanced plant execution.
              But procurement rarely stops there. Buyers can also choose broader incumbent stacks such as PTC ThingWorx,
              Siemens Opcenter, or Rockwell Plex when they want a larger IIoT or manufacturing-operations platform, and
              they can fall sideways into maintenance-centric tools such as MaintainX or Fabrico when the core job is
              work orders, uptime, and asset history rather than operator workflow composition. Alternatives directories
              from G2, SoftwareWorld, and SelectHub reinforce this fragmentation by placing Tulip beside MES suites,
              ERP-linked manufacturing tools, and point products rather than one clean peer set. The practical
              implication is that Tulip does not only defend against one category narrative; it must win against status
              quo processes, internal-build options, specialized connected-worker tools, and larger suites that arrive
              with installed-base leverage.
