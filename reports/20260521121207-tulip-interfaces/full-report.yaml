      - number: '4.2'
        title: GTM motion, customer economics, and public unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Tulip appears to run an enterprise-oriented land-and-expand motion rather than a product-led self-serve
              model. Its pricing has minimums, the higher tiers bundle governance and connectivity, and the strongest
              proof points come from multi-site or high-complexity customers. The 2023 TEI study is useful here even
              though it is customer-side economics rather than Tulip-side economics. It frames the strongest public ROI
              case around a 20-site, 10,000-employee composite customer, with 448% ROI, USD 16.23 million NPV, and
              sub-six-month payback. That is evidence that buyers can justify spend when the deployment meaningfully
              improves throughput, labor efficiency, or quality. It is not evidence that Tulip has efficient CAC, high
              gross margins, or fast payback on its own sales and success costs. The same caution applies to customer
              logos. Named users such as AstraZeneca, Stanley Black & Decker, DMG MORI, Tiffany, Laerdal, Formlabs,
              Pratt Miller, Reframe, and TICO show relevance across serious industrial and regulated environments, but
              they do not disclose contract value, renewal behavior, or concentration. The most defensible conclusion is
              that Tulip has a credible value story and likely decent expansion potential once embedded, but public
              evidence still stops short of underwriting sales efficiency or durable revenue quality.
