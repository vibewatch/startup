  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and company positioning
        blocks:
          - type: paragraph
            body: >-
              Tulip positions itself as a frontline-operations platform rather than a rigid legacy MES. Across its
              homepage, platform, and “how it works” pages, the company describes a composable, no-code system that
              helps manufacturers digitize workflows, connect people, machines, and enterprise systems, and continuously
              improve operations without waiting on conventional IT development cycles. The current official copy
              emphasizes AI throughout the product surface: app authoring, analytics, computer vision, automations, and
              a broader “human-first” operating model in which software augments operators instead of replacing them.


              The public corporate identity is also clearer in 2026 than in older coverage. Tulip’s official pages and
              recent press releases place headquarters in Somerville, Massachusetts, while describing a global footprint
              across Munich, Budapest, Singapore, Tel Aviv, and Tokyo. The same current surfaces also show broader
              ecosystem reach than older releases: the homepage now cites 47 countries, 110 partners, and 29 languages,
              while the January 2026 financing announcement anchored public scale at 43,000 apps supporting 60,000
              frontline workers across 1,000 customer sites in 45 countries during 2025.


              One diligence wrinkle is the founding chronology. Current official “about us” copy says Tulip was started
              by a team out of the MIT Media Lab and built on more than ten years of research, while independent 2026
              coverage describes the company as an MIT spinout dating to 2012. Other secondary profiles on the web cite
              2014. Because the official site does not pin down the legal incorporation date in the fetched materials,
              the safest ground-truth is that Tulip is an MIT Media Lab spinout led by co-founders Natan Linder and Rony
              Kubat, with the exact “founded” year still worth confirming from cap-table or legal records rather than
              marketing copy.
