      - number: '3.3'
        title: Switching cost, lock-in, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Tulip's moat is meaningful but not absolute. The strongest lock-in comes from configured workflows,
              connected data models, integrations, operator training, approvals, and validated processes rather than
              proprietary content alone. That creates real switching friction once Tulip is embedded in production,
              especially in regulated or high-mix settings. At the same time, multi-homing is common: a plant can run
              Tulip for frontline execution while retaining SAP, Oracle, Plex, Opcenter, a CMMS, or internal tools
              elsewhere in the stack. That cuts both ways. It makes land-and-expand easier for Tulip, but it also lowers
              the hurdle for adjacent tools to coexist and slowly displace it. Incumbents retain powerful advantages
              through channel reach, broader installed base, and enterprise architecture credibility. Direct peers
              narrow the gap further by copying AI claims, workflow digitization, and collaboration features. Even
              vendor-surface evidence hints at fast-moving category convergence: multiple old competitor URLs now
              resolve to 404s, G2 comparison content is JS-gated, and private-company pricing remains opaque. The
              durable advantage for Tulip is therefore not “connected worker” branding by itself; it is whether the
              company can keep proving that configurable, governed frontline apps deliver value faster than rigid suites
              and more extensibly than packaged point tools.
