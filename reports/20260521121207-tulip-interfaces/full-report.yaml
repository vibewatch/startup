            body: >-
              The public financial picture contains enough evidence to support a qualified positive view, but not enough
              to support a clean underwriting model. On the positive side, Tulip has a clear subscription unit,
              published entry pricing, high-value expansion levers, independent corroboration of the 2026 financing
              round, and customer evidence suggesting the product can justify spend in large industrial environments.
              Its FedRAMP-equivalency push and defense-oriented messaging may also open higher-value regulated budgets.
              On the negative side, nearly every metric investors would use to convert that narrative into a model is
              missing: current ARR, revenue, gross margin, CAC, NRR, implementation cost, support burden, customer
              concentration, and cash burn are all absent from the fetched public record. Even some regulatory diligence
              remains incomplete because the eCFR Part 11 page fetched as an access block rather than a readable text
              source. The right verdict is therefore not “financially weak,” but “financially unconfirmable from public
              evidence alone.” Tulip looks like a well-funded private software company with a plausible path to
              attractive economics; it does not yet look like a company whose revenue quality can be underwritten
              without management data room access.
