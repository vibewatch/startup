      - number: '7.3'
        title: Partner, competition, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Tulip’s partner and financial risks are tightly linked. Strategically, Mitsubishi Electric is valuable
              because it adds channel credibility and a manufacturing alliance, but it is also a dependency that can
              shape go-to-market and exit expectations. Technically, Tulip relies on open APIs, customer systems, edge
              connectivity, external AI providers, and cloud infrastructure, so a failure anywhere in that chain can
              impair frontline workflows even if Tulip’s own code is sound. Competition is also formidable. PTC,
              Siemens, and Rockwell all bring much larger installed bases, more resources, and the ability to bundle
              adjacent capabilities. That is especially relevant now that AI features are becoming table stakes across
              industrial software. Financially, the biggest risk is not public weakness so much as public opacity. Tulip
              raised a large Series D at a USD 1.3 billion valuation, which is reassuring for runway in the short term,
              but current revenue, burn, customer concentration, and renewal quality remain undisclosed. Investors
              therefore have to assume meaningful execution risk until management data clarifies whether Tulip’s
              category narrative is converting into durable, efficient revenue.
