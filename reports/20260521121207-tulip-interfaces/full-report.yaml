      - number: '2.2'
        title: Sizing lenses, buyer segmentation, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Two sizing lenses are relevant. The broad lens uses independent connected-worker market reports and
              captures spend across software, services, and hardware for manufacturing, construction, mining, oil and
              gas, and healthcare. The conservative lens uses Tulip's actual packaging and deployment model:
              interface-priced SaaS, composable MES suites, governance features, and regulated-industry add-ons sold
              into plants that need workflow digitization, device and system connectivity, and multi-site controls. That
              narrower lens better matches Tulip's practical SAM because it filters out projects where buyers only need
              rugged wearables, simple inspections, or a full incumbent ERP/MES replacement. Buyer segmentation also
              points to a plant-led wedge with enterprise follow-through. Daily users are operators, technicians,
              supervisors, and quality staff; economic buyers are typically operations leaders, plant directors, CI
              leaders, manufacturing IT, or digital-transformation owners; and budget can come from operations
              excellence, quality, compliance, or factory-transformation pools. Tulip's case studies show repeated
              adoption in discrete manufacturing, life sciences, packaging, and defense-style environments where process
              variation, traceability, and training matter more than a single fixed application. Put differently, Tulip
              wins where the buyer wants a configurable operating system for frontline work, not just a static
              repository for instructions or a narrow maintenance-only point tool. That nuance is the core reason the
              SAM should stay bounded and practical for valuation work.
