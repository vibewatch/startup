      - number: '5.2'
        title: Architecture, deployment, and integration model
        blocks:
          - type: paragraph
            body: >-
              The fetched corpus points to a cloud-first architecture with edge extensions rather than an on-premise
              software stack. Tulip’s official pages repeatedly pair cloud delivery with edge connectivity, and Machine
              Kit explicitly describes getting machine data to the cloud through Edge devices, current sensors, OPC UA,
              and MQTT. Connectors & Integrations expands that model to ERP, PLM, databases, business systems, and
              bi-directional machine connections. The developer and documentation surfaces show that this is not only
              marketing language. Tulip maintains a developer program, public API setup guidance, user-creation
              endpoints, and an active community forum focused on APIs, custom widgets, hardware integrations, and
              Node-RED. That combination is strategically important: Tulip’s product value depends on being the
              orchestration layer between people, machines, and existing systems. It also defines the core dependency
              stack, because uptime and implementation quality now rely on cloud infrastructure, edge connectivity, API
              tokens, and third-party services being managed well.
