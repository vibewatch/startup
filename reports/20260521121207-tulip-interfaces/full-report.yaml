      - number: '8.3'
        title: Current financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Tulip’s current financing context is stronger than that of many late-stage industrial software startups
              because the January 2026 round paired capital with a strategic alliance. The company disclosed a USD 120
              million Series D at a USD 1.3 billion valuation, and Mitsubishi Electric separately announced both the
              investment and a broader alliance focused on digital-transformation solutions. That matters because the
              round reads as a commercial-validation event as well as a financing event. Tulip’s own pricing and
              go-to-market materials also suggest why investors could underwrite a premium: the platform is sold as a
              governed execution layer that can start with one workflow, prove ROI quickly, and expand across stations,
              lines, and sites. But entry discipline still has to be quantitative. At a USD 1.3 billion valuation, even
              modest changes in assumed ARR create very different underwriting outcomes. Without disclosed ARR and
              without a public preference-stack view, investors cannot know whether the latest round is entering at a
              premium software multiple or simply paying ahead of proof. That uncertainty argues for diligence
              discipline, not reflexive acceptance of the headline mark.
            claimRefs:
              - CV001
