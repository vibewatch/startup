      - number: '8.6'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Tulip appears directionally exit-able but not yet publicly underwriteable. The company has a unicorn
              valuation, a strategic investor that could widen commercial and exit options, global customer proof, and
              messaging that fits today’s appetite for AI-enabled industrial software. That is enough to support
              continued diligence. It is not enough to support a final investment recommendation at the current price.
              The most important missing items are straightforward: current ARR and revenue growth, gross margin by
              subscription versus services, net retention, customer concentration, proof of regulated-deployment depth,
              and the full cap table including liquidation preferences from recent rounds. Public evidence also leaves
              open whether the strongest customer outcomes can be repeated without heavy services effort and whether
              advanced regulated-workflow requirements are fully satisfied today or only on the roadmap. Those are
              thesis-break issues because they map directly into multiple durability. The final recommendation therefore
              depends less on finding one more marketing data point and more on converting the current story into
              auditable economics and governance evidence.
