  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow definition and module surface
        blocks:
          - type: paragraph
            body: >-
              Tulip is best understood as an operations workflow platform rather than a single monolithic MES module.
              The product starts from the operator workflow: engineers and frontline teams build apps, deploy them to
              stations and devices, capture process data, trigger quality or approval steps, and feed that information
              into analytics and automations. The public surface shows a broad but coherent module map. App Editor
              covers no-code workflow construction and governed deployment; Analytics and Tables cover dashboards, KPIs,
              and AI-assisted reporting; Connectors, APIs, and Machine Kit cover systems and machine connectivity; Tulip
              AI and Vision embed AI into authoring, translation, defect detection, and operator guidance; and the
              Common Data Model gives those pieces a shared schema. That breadth matters because Tulip’s customer cases
              do not describe isolated point tools. They describe integrated, step-by-step execution, quality capture,
              equipment data, and enterprise-system connectivity inside one operating layer.
