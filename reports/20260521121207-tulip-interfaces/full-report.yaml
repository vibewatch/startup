  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Tulip begins with category logic rather than pure financial disclosure. Tulip is not
              pitching a generic workflow app; it positions itself as a composable manufacturing platform that sits
              between operators, machines, enterprise systems, and governed change control. Public sources also show
              that this category is not imaginary. Analyst market sources describe connected-worker and
              frontline-operations software as a growing, fragmented market shaped by productivity, safety, and
              digital-transformation demand. Tulip’s own 2026 financing materials add unusually concrete footprint
              signals for a private industrial software company: 43,000 apps, 60,000 workers, 1,000 customer sites, and
              operations across 45 countries. Reviews reinforce the core product thesis by repeatedly praising
              flexibility, rapid deployment, and fit for changing shop-floor workflows. The anti-thesis is just as
              concrete. Independent reviews also surface governance effort, cloud-root-cause ambiguity, and
              regulated-workflow feature gaps, while the public corpus still omits ARR, retention, gross margin, and
              burn. That means the company may be genuinely strong, yet still impossible to price precisely from public
              evidence alone.
            claimRefs:
              - CV001
