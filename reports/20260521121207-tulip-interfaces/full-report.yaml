      - number: '2.3'
        title: Growth drivers, adoption constraints, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The independent and company-backed evidence agrees on why this market is expanding: manufacturers face
              labor shortages, training pressure, quality demands, and a growing need to connect frontline execution to
              real-time data. Business Research Insights reports broad adoption and strong productivity gains, while
              Tulip's TEI and customer stories show why buyers keep funding these projects once workflows are digitized.
              But the same evidence also highlights constraints. Mordor explicitly flags high implementation costs as a
              market restraint, while alternative-review sources frame Tulip as powerful but potentially expensive or
              integration-heavy compared with simpler or more packaged substitutes. Tulip's own governance, security,
              and regulated-industry pages signal that enterprise value comes with real deployment complexity, not a
              lightweight checklist app. The biggest unresolved question for underwriting is not whether the category
              exists; it is how much of the headline category Tulip can serve efficiently without long implementation
              cycles or heavy services overhead. Contradictory market-size estimates, inaccessible consultant pages, and
              the absence of clean segment-level revenue disclosure mean the right conclusion is a bounded,
              evidence-constrained SAM rather than a single heroic TAM number. That is why follow-up diligence should
              focus on implementation duration, services intensity, and vertical expansion rates instead of treating
              top-down TAM alone as a monetization forecast.
