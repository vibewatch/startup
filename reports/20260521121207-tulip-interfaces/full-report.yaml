        - Public filer; Plex page highlights 8B+ daily transactions and 96% gross renewal
        - Useful benchmark for what deeply embedded industrial software can look like at scale
        - Not a clean standalone public valuation for Plex
      - - MaintainX
        - Private adjacent frontline software
        - Large-scale private operator with 14,000+ company footprint on site
        - Shows modern frontline software can reach broad deployment outside legacy MES
        - Maintenance-first positioning is narrower than Tulip’s execution-layer thesis
    notes: >-
      This is a directional comparable set rather than a precise multiple table because the best industrial references
      are mostly embedded products or broad public-company contexts, not standalone pure plays.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerated from the fetched public corpus of Tulip-adjacent industrial-software references that are most
        relevant to buyer context, disclosure discipline, and execution-layer competition.
    claimRefs:
      - CV001
      - CV009
      - CV021
      - CV022
      - CV023
      - CV030
      - CV044
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Weak next financing event
        - Flat or down round versus USD 1.3B
        - Would imply the private market no longer accepts the premium narrative
        - Re-cut valuation and pause new capital commitment
      - - Economics miss
        - ARR materially below ~USD 100M or gross margin meaningfully below software expectations
        - Would make the current mark hard to justify under reasonable multiples
        - Move from track to avoid unless price resets
      - - Retention or concentration weakness
        - NRR below 100% or top-customer dependence materially high
        - Would break the land-and-expand durability thesis
        - Increase downside weighting and reduce terminal multiple
      - - Regulated-workflow product gap persists
        - Large references still cite EBR-like or governance shortcomings after roadmap promises
        - Would weaken the premium regulated-manufacturing thesis
        - Downgrade moat and expansion assumptions
      - - Alliance under-delivers
        - Mitsubishi partnership produces little measurable pipeline or deployment leverage
        - Would reduce strategic-upside and exit-optionalities embedded in the round
        - Strip strategic premium from the valuation
    notes: >-
      Triggers are framed as observable diligence or post-investment events so they can inform both entry and monitoring
      discipline.
    claimRefs:
      - CV011
      - CV020
      - CV033
      - CV039
      - CV043
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - ARR and growth
        - Latest ARR, trailing revenue, and cohort growth
        - Needed to translate USD 1.3B into an actual multiple
        - Management finance pack and board metrics
      - - Retention quality
        - Gross retention, NRR, logo churn, and module attach
        - Determines whether the land-and-expand thesis is real
        - Customer cohort analysis and reference calls
      - - Margin structure
        - Subscription versus services gross margin and implementation burden
        - Separates scalable software economics from labor-heavy delivery
        - FP&A review and services utilization analysis
      - - Customer concentration
        - Top-10 customers and revenue share by vertical
        - Determines downside if a few lighthouse accounts dominate
        - Revenue concentration schedule
      - - Cap table and preferences
        - Series D terms, liquidation preferences, and any secondary dynamics
        - Required to understand real entry economics and exit proceeds
        - Legal diligence and financing documents
      - - Regulated-workflow depth
        - Validated deployment evidence, audit history, and roadmap closure on advanced use cases
        - Critical for premium pricing in life sciences and defense
        - Product, compliance, and customer-reference diligence
    notes: >-
      These are the smallest set of unresolved items that can materially move the investment decision at the current
      price.
    claimRefs:
      - CV012
      - CV013
      - CV028
      - CV029
      - CV038
      - CV044
