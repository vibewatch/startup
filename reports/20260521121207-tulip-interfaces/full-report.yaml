      - number: '1.3'
        title: Traction signals, 2025-2026 milestones, and diligence flags
        blocks:
          - type: paragraph
            body: >-
              Tulip’s best public traction signals combine financing disclosures, customer proof, and recent product
              launches. The January 2026 Series D materials say Tulip supported 60,000 frontline workers, 1,000 customer
              sites, and 43,000 apps in 45 countries during 2025, while current web copy points to 47 countries, 110
              partners, and 29 languages. Named customers in the fetched set span regulated and industrial categories,
              including AstraZeneca, Richemont, Stanley Black & Decker, and DMG MORI, while individual case studies show
              measurable outcomes such as Tiffany moving from quarterly to near-weekly launches, VEKA cutting
              barcode-related quality escapes by 88%, and Reframe compressing home-production cycles.


              The milestone cadence also matters. In April 2025 Tulip introduced a composable MES for aerospace and
              defense, in February 2026 it announced FedRAMP Moderate Equivalency, and in March 2026 it launched Factory
              Playback with NVIDIA to synchronize video and operational data into replayable production timelines. Taken
              together, those milestones suggest Tulip is trying to move from “no-code frontline app platform” toward a
              broader system-of-execution narrative spanning compliance, AI, and industrial data context.


              The diligence flags are mostly around opacity rather than obvious distress. Review and marketplace
              evidence is generally positive, but independent users still point to governance complexity,
              cloud-connection troubleshooting, limited analytics depth in some cases, and feature gaps around highly
              specific batch-record or machine-logic needs. Community posts also show Tulip only formalized a public
              status page in late 2025, and its own posts frame that page as the source of truth for high-severity
              multi-customer incidents. None of the fetched legal or incident surfaces showed a major disclosed security
              breach or lawsuit, but the company still requires deeper diligence on current economics, concentration,
              and governance than its headline momentum metrics alone provide.
