- id: bull-base-bear-scenarios
  title: Bull, base, and bear case scenarios
  body: 'Scenario analysis is the only responsible way to value Tulip from public evidence. In the bull case, the public scale signals are already translating into strong monetization: Tulip converts its 1,000-site footprint into roughly USD 180-220 million of ARR over the next planning window, keeps expansion healthy through governed multi-site rollouts, and sustains a premium software multiple because customers treat the product as a high-value operational layer rather than a replaceable workflow app. In the base case, Tulip is a good company but a smaller revenue business than the narrative suggests, landing closer to roughly USD 120-150 million ARR and a valuation band around the current mark. In the bear case, ARR is still below USD 100 million, deployment friction or regulated-workflow gaps slow expansion, and the market compresses the multiple toward a more conventional industrial-software range. Under that outcome, the latest price would look rich. The important point is not false
    precision; it is that the public evidence supports a wide distribution of outcomes, with downside driven more by missing economics than by obvious product weakness.'
