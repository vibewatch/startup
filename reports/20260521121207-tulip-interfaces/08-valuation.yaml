  - CV033
  - CV039
  - CV043
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and growth
    - Latest ARR, trailing revenue, and cohort growth
    - Needed to translate USD 1.3B into an actual multiple
    - Management finance pack and board metrics
  - - Retention quality
    - Gross retention, NRR, logo churn, and module attach
    - Determines whether the land-and-expand thesis is real
    - Customer cohort analysis and reference calls
  - - Margin structure
    - Subscription versus services gross margin and implementation burden
    - Separates scalable software economics from labor-heavy delivery
    - FP&A review and services utilization analysis
  - - Customer concentration
    - Top-10 customers and revenue share by vertical
    - Determines downside if a few lighthouse accounts dominate
    - Revenue concentration schedule
  - - Cap table and preferences
    - Series D terms, liquidation preferences, and any secondary dynamics
    - Required to understand real entry economics and exit proceeds
    - Legal diligence and financing documents
  - - Regulated-workflow depth
    - Validated deployment evidence, audit history, and roadmap closure on advanced use cases
    - Critical for premium pricing in life sciences and defense
    - Product, compliance, and customer-reference diligence
  notes: These are the smallest set of unresolved items that can materially move the investment decision at the current price.
