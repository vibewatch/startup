- id: comparable-valuation-analysis
  title: Comparable valuation analysis
  body: 'Tulip does not have a clean public comparable, so the comp set has to be explicit about its imperfections. PTC, Siemens, and Rockwell all matter because they frame the industrial-software buying center Tulip is trying to disrupt or complement, but each is a much broader public-company context rather than a standalone connected-worker pure play. Plex is especially useful because its own product page still highlights cloud scale and a 96% gross renewal rate, which is exactly the kind of retention evidence investors would want from Tulip but do not yet have. MaintainX is relevant on modern frontline-software scale, yet it is maintenance-first and therefore narrower than Tulip’s composable execution thesis. Tulip’s own review surface and implementation claims imply that the company competes on speed, flexibility, and governed adaptability rather than on commodity workflow tooling. The result is a comp frame that is directional rather than deterministic: it supports the idea that serious
    value can accrue in this category, but it does not prove that USD 1.3 billion is cheap without revenue disclosure.'
