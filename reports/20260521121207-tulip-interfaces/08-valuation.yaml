  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr-retention-margin
    missingEvidence: Current ARR, revenue growth, subscription versus services gross margin, and net retention metrics.
    whyItMatters: Those are the minimum inputs needed to decide whether USD 1.3B is cheap, fair, or rich.
    diligencePath: Request management KPI pack, cohort tables, and margin bridge before making a final investment decision.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Series D terms, liquidation preferences, any secondary activity, and the full post-round cap table.
    whyItMatters: Entry economics and eventual exit proceeds can diverge materially from the headline valuation when preference stacks are opaque.
    diligencePath: Review financing documents and build a proceeds waterfall before underwriting returns.
    relatedQuestionRefs:
    - QV033
    - QV030
  - type: access-blocked
    severity: material
    topic: regulated-compliance-primary-text
    missingEvidence: A clean, readable primary-text validation path for the exact compliance requirements Tulip references in regulated settings.
    whyItMatters: Regulated-workflow credibility is part of the premium thesis, so unresolved compliance depth weakens confidence in expansion assumptions.
    diligencePath: Use a reliable regulator-approved access path and request customer validation artifacts and audit outcomes from management.
    relatedQuestionRefs:
    - QV031
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table
    missingEvidence: A fuller pure-play comparable set with disclosed standalone valuation multiples for businesses closer to Tulip’s exact profile.
    whyItMatters: The current comparable table is analytically useful but still directional because most relevant industrial references are embedded or broader entities.
    diligencePath: Supplement with market-data terminals, private-market databases, and direct comp screens during formal investment work.
    relatedQuestionRefs:
    - QV020
    - QV023
    relatedTableRefs:
    - TV004
