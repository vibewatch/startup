- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak next financing event
    - Flat or down round versus USD 1.3B
    - Would imply the private market no longer accepts the premium narrative
    - Re-cut valuation and pause new capital commitment
  - - Economics miss
    - ARR materially below ~USD 100M or gross margin meaningfully below software expectations
    - Would make the current mark hard to justify under reasonable multiples
    - Move from track to avoid unless price resets
  - - Retention or concentration weakness
    - NRR below 100% or top-customer dependence materially high
    - Would break the land-and-expand durability thesis
    - Increase downside weighting and reduce terminal multiple
  - - Regulated-workflow product gap persists
    - Large references still cite EBR-like or governance shortcomings after roadmap promises
    - Would weaken the premium regulated-manufacturing thesis
    - Downgrade moat and expansion assumptions
  - - Alliance under-delivers
    - Mitsubishi partnership produces little measurable pipeline or deployment leverage
    - Would reduce strategic-upside and exit-optionalities embedded in the round
    - Strip strategic premium from the valuation
  notes: Triggers are framed as observable diligence or post-investment events so they can inform both entry and monitoring discipline.
  claimRefs:
