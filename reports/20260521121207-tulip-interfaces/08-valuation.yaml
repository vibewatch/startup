- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Category demand
    - Connected-worker and frontline-operations software is growing, fragmented, and relevant to manufacturing digitization
    - Market growth does not guarantee Tulip captures enough revenue to justify a premium mark
    - Show current ARR growth by cohort and win rates in core verticals
  - - Product differentiation
    - Tulip is positioned as a composable operator-facing layer that can change faster than rigid MES
    - Fast configuration can still create governance burden and advanced regulated-workflow gaps
    - Provide audited reference calls and implementation evidence for large regulated rollouts
  - - Customer proof
    - Public customer stories and 2025 footprint metrics suggest real adoption depth
    - Public logos and TEI-style ROI proof do not reveal contract value, retention, or concentration
    - Disclose NRR, gross retention, top-10 customer concentration, and module attach
  - - Strategic validation
    - Mitsubishi investment and alliance imply serious industrial credibility
    - Strategic narratives can overstate channel value and do not replace revenue evidence
    - Show joint pipeline, deployments, and revenue contribution from the alliance
  - - Valuation discipline
    - USD 1.3B can be defendable if ARR and expansion are already substantial
    - Without ARR disclosure, the same valuation can also be materially ahead of proof
    - Disclose ARR, services mix, gross margin, and cap table to pin down the actual multiple
  notes: The anti-thesis is evidence-based, not a generic caution label; each row names the specific data that would resolve uncertainty.
