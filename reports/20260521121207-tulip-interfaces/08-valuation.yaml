- id: recommendation-risk-and-valuation-stance
  title: Recommendation, risk rating, and valuation stance
  body: 'On public evidence, the right call is not buy or avoid; it is track / research-more with medium confidence and high valuation risk. The reason is denominator opacity. Tulip has enough disclosed evidence to justify serious diligence: fresh capital, a blue-chip strategic investor, recognizable customer proof, category analyst coverage, and clear product differentiation from rigid legacy MES. What it does not have is the operating data needed to tell whether USD 1.3 billion is conservative, fair, or aggressive. Public materials still do not disclose ARR, revenue, gross margin, net retention, services intensity, or customer concentration. As a result, the valuation stance has to be scenario-based. If Tulip is already well north of USD 100 million ARR with solid expansion and controlled services burden, the latest price may be defensible. If revenue is materially below that range or if retention is weaker than the narrative implies, downside could be significant. The recommendation should
    therefore remain conditional on a data-room-style disclosure package rather than on narrative momentum alone.'
