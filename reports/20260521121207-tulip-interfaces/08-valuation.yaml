  - - MaintainX
    - Private adjacent frontline software
    - Large-scale private operator with 14,000+ company footprint on site
    - Shows modern frontline software can reach broad deployment outside legacy MES
    - Maintenance-first positioning is narrower than Tulip’s execution-layer thesis
  notes: This is a directional comparable set rather than a precise multiple table because the best industrial references are mostly embedded products or broad public-company contexts, not standalone pure plays.
