chapter:
  number: 7
  title: Risks
  summary: Tulip’s risk profile is concentrated in regulated-workflow execution, cloud and vendor dependency, competitive pressure, and financial opacity rather than in disclosed litigation or physical-asset hazards. The company has visible mitigations—governance controls, legal/privacy surfaces, a status page, FedRAMP-oriented security work, and trust materials—but public evidence still leaves material gaps around full regulatory depth, incident metrics, concentration, and capital needs.
sections:
- id: regulatory-legal-risk
  title: Regulatory and legal risk
  body: 'Tulip’s regulatory risk is mostly indirect but still consequential because the company sells into life sciences, medtech, aerospace, and defense workflows where auditability and data integrity matter. Tulip’s own GxP and aerospace materials explicitly anchor the product around 21 CFR Part 11-style controls, e-signatures, audit trails, validation support, and defense-grade security positioning. That creates upside, but it also raises the cost of failure: if the product falls short in regulated settings, the operational damage to customers can be much larger than in generic workflow software. The legal surface is reasonably mature. Tulip publishes a privacy policy, terms of service, and website terms, and those documents describe data handling, security measures, and contractual limitations. But the public corpus is not the same as fully cleared diligence. The fetched eCFR Part 11 page was blocked by anti-bot controls, and the public record did not surface direct evidence of audit
    outcomes, major litigation, or formal authorization beyond FedRAMP Moderate Equivalency. That means regulatory and legal diligence remains a live issue, not a box already checked.'
