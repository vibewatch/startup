- id: mitigations-kill-triggers
  title: Mitigations, monitoring indicators, and thesis-break triggers
  body: 'Tulip does have visible mitigations. Governance pages describe access control, SSO, approvals, versioning, templates, and deployment control. The trust center references encryption and penetration testing. The status page and maintenance disclosures show that Tulip is willing to expose operational information publicly instead of hiding all service work behind private support channels. FedRAMP-oriented messaging and GxP features show the company understands where it must invest to win regulated buyers. But those mitigations are only partially decisive because several of the highest-stakes questions require private evidence: actual audit outcomes, customer concentration, capital efficiency, renewal behavior, and whether advanced regulated use cases are satisfied without heavy services effort. The cleanest thesis-break triggers are therefore measurable. A major security or data-integrity failure in a regulated customer, stalled FedRAMP progress, clear evidence of concentration, a weak
    next financing event, or repeated feedback that Tulip’s advanced analytics and EBR-like controls lag buyer needs would all materially weaken the investment case. This is a risk chapter where the public mitigations are meaningful, but the private diligence asks still dominate the final go/no-go decision.'
