- id: roadmap-differentiation-gaps
  title: Roadmap, differentiation, and remaining diligence gaps
  body: Tulip’s 2025-2026 roadmap signals that the company is trying to move from no-code operations software toward a more AI-native operations system. The aerospace-and-defense Composable MES announcement emphasizes traceability, CAPA, and regulated manufacturing apps; Tulip AI adds generation, translation, OCR, and AI agents; and Factory Playback, built with NVIDIA technology, adds replayable operational history that ties video to process data. Those launches sharpen Tulip’s pitch as a composable platform for complex, quality-sensitive environments rather than a generic low-code app builder. The moat, however, is still best described as integration-rich workflow know-how plus regulated deployment features, not as a proven standalone data or IP monopoly. Customer proof shows Tulip working in demanding contexts, but the public record does not disclose quantified uptime, independent security certifications such as SOC 2 or ISO 27001 on the fetched pages, or adoption metrics for the newest
    AI and playback features. Those are the core technical diligence gaps that remain for investors and buyers.
