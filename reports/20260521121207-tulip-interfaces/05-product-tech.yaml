- id: TE002
  title: Workflow / use-case table
  columns:
  - Workflow job
  - Legacy pain point
  - Tulip layer used
  - Observable benefit
  - Limitation / caution
  rows:
  - - Digital work instructions
    - Paper or static instructions go stale quickly
    - App Editor + approvals + templates
    - Faster deployment and more consistent execution
    - Benefit is well evidenced; contract value is not
  - - Production data capture
    - Manual forms and disconnected spreadsheets
    - Apps + Tables + Analytics
    - Real-time visibility and faster exception handling
    - Need proof of data quality governance at enterprise scale
  - - Machine and process monitoring
    - Limited context around asset utilization and events
    - Machine Kit + Connectors + edge devices
    - Machine and operator data can be combined in one workflow
    - Need proof on advanced machine logic and resilience to connectivity issues
  - - Regulated review and release
    - Manual review burden and fragmented evidence
    - GxP / audit trails / e-signatures / 0-RPO
    - Better traceability and review by exception
    - Need buyer references on validation effort and audit acceptance
  - - AI-assisted troubleshooting and translation
    - Slow resolution and language friction
    - Tulip AI + Vision
    - Faster problem resolution and multilingual support
    - Newest AI layers still need adoption and quality benchmarks
  notes: Benefits are based on official capability descriptions and customer cases; they should not be read as universal ROI guarantees.
