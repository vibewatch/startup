  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Public uptime, SLA, MTTR, and incident-frequency metrics by product area or region.
    whyItMatters: Feature breadth does not eliminate deployment risk; investors and enterprise buyers still need quantified reliability evidence.
    diligencePath: Request customer-facing SLA documents, 12-month incident history, and references from multi-site regulated deployments.
    relatedQuestionRefs:
    - QE018
  - type: missing-source
    severity: material
    topic: independent-security-certifications
    missingEvidence: Fetched public proof for named certifications such as SOC 2 or ISO 27001 and the exact scope of any attestations.
    whyItMatters: Enterprise and defense underwriting depends on third-party assurance, not only vendor-authored trust language.
    diligencePath: Request Tulip’s current trust packet, certification letters, and audit scope matrix.
    relatedQuestionRefs:
