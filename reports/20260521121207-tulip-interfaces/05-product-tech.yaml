  title: Technology / operating architecture table
  columns:
  - Layer
  - Role in stack
  - Evidence
  - Dependency
  - Risk
  rows:
  - - Cloud application layer
    - Hosts editor, apps, analytics, automations, and AI services
    - Official platform pages
    - Tulip cloud operations
    - Central uptime and release-management dependency
  - - Edge device layer
    - Captures machine and sensor data and bridges shop-floor assets
    - Machine Kit page
    - Local network, edge hardware, operator setup
    - Connectivity or device issues can interrupt context capture
  - - Integration layer
    - Connects ERP, PLM, databases, machines, and APIs
    - Connectors page + developer docs
    - Customer systems and credentials
    - Integration quality varies with source-system hygiene
  - - Data model layer
    - Standardizes entities and operational context
    - Common Data Model page
    - Schema governance inside customer account
    - Poor schema governance can weaken composability
  - - Identity and governance layer
    - Controls access, approvals, versions, and deployments
    - Security & Governance page + GxP page
    - IdP, user roles, admin setup
    - Misconfigured governance can create change-control risk
  - - AI provider layer
    - Supports LLMs, OCR, translation, and AI-assisted analytics
    - Tulip AI page + AI governance doc
    - AWS, Azure, DeepL, and related services
    - External-provider dependency affects cost, privacy, and performance
