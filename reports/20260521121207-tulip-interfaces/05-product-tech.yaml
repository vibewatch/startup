tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - What it does
  - Current maturity read
  - Differentiation angle
  - Main diligence gap
  rows:
  - - App Editor
    - Process engineer / ops leader
    - Builds no-code frontline apps with steps, widgets, logic, approvals, and templates
    - Mature core surface
    - Fast workflow digitization with governance built in
    - Need usage and deployment depth by module
  - - Analytics & Tables
    - Ops leader / CI / quality
    - Turns production data into dashboards, KPIs, AI-assisted summaries, and reports
    - Mature but still evolving
    - Real-time visibility tied to frontline context
    - Need proof of advanced analytics depth and joins
  - - Connectors & APIs
    - IT / integration engineer
    - Connects ERP, PLM, databases, machines, and external systems to Tulip
    - Mature platform layer
    - Open integration posture vs closed workflow silos
    - Need proof of implementation effort at large enterprise scale
  - - Automations
    - Engineer / app builder
    - Executes action-oriented workflow logic and tasks across connected processes
    - Established add-on
    - Extends apps into execution logic
    - Need evidence on orchestration complexity and monitoring
  - - Machine Kit / Edge
    - Manufacturing engineer
    - Connects machines and sensors through edge hardware and protocols
    - Mature for basic monitoring and context capture
    - Bridges physical assets to cloud apps quickly
    - Need evidence on scale, device management, and downtime handling
  - - Tulip AI
    - Builder / operator / manager
    - Adds AI chat, OCR, translation, AI agents, and generated analytics
    - Rapidly expanding 2025-2026 layer
    - Operations-specific AI embedded in workflow context
    - Need adoption, governance, and cost-per-use data
  - - Vision
    - Quality / operator
    - Runs AI-powered verification and defect detection in workflows
    - Applied solution layer
    - No-code camera-based verification tied to operator actions
    - Need false positive / false negative benchmarks
  - - Common Data Model
    - Engineer / architect
    - Provides shared human-readable schema for composable MES and apps
    - Strategic architecture layer
    - Flexibility without vendor-locked schema
    - Need evidence on real-world model governance at scale
  notes: Maturity reads are inferred from breadth of official product, documentation, and customer-proof surfaces rather than from disclosed module revenue.
