evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding year
    missingEvidence: Primary legal or financing document that states Tulip’s exact incorporation date or formal founding year.
    whyItMatters: >-
      Overview, tenure, and market-history framing differ if the company is treated as a 2012 spinout versus a 2014
      commercial formation.
    diligencePath: >-
      Request Delaware incorporation docs, earliest cap-table records, or an investor profile that explicitly states
      legal founding date.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: TO002 board governance coverage
    missingEvidence: Current board roster, observer rights, and post-Series-D governance structure.
    whyItMatters: >-
      Strategic-investor influence and founder control cannot be underwritten cleanly without current governance
      visibility.
    diligencePath: Request current board deck, charter summary, and investor-rights schedule.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current economics
    missingEvidence: Current revenue, ARR, gross margin, burn, and renewal metrics.
    whyItMatters: A $1.3B price is difficult to judge from company-overview evidence alone without economic context.
    diligencePath: Request latest board package or KPI pack covering revenue quality, gross margin, and growth by cohort.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: TO004 milestone and concentration coverage
    missingEvidence: >-
      Revenue concentration, deployment depth by top account, and multi-site retention metrics, plus a fuller dated
      chronology for early financing and incorporation milestones.
    whyItMatters: >-
      Named logos and case studies do not prove durable diversified revenue, and the chronology still lacks primary
      evidence for exact founding and early-round timing.
    diligencePath: >-
      Request top-10 customer revenue share, expansion history, site-level activity metrics, and earliest financing
      records or incorporation documents.
    relatedQuestionRefs:
      - QO004
      - QO025
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: review freshness
    missingEvidence: Larger set of 2025-2026 independent user reviews with detailed implementation outcomes and failure cases.
    whyItMatters: >-
      Current independent review surfaces are useful but too thin to fully characterize deployment pain or satisfaction
      distribution.
    diligencePath: Interview reference customers and collect fresh review exports from Gartner, G2, and procurement teams.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A normalized, source-consistent market model that reconciles analyst scope differences and converts the
      connected-worker outer category into a Tulip-relevant software SAM.
    whyItMatters: Valuation work can be distorted if broad category TAM is mistaken for the spend Tulip can actually reach.
    diligencePath: >-
      Request management's internal market model by vertical and compare it against a reconciled bottom-up view using
      customer counts, site counts, and price bands.
    relatedQuestionRefs:
      - QM010
      - QM023
  - type: access-blocked
    severity: minor
    topic: consultant-benchmarks
    missingEvidence: >-
      Full-text access to McKinsey, Deloitte, and Forrester materials that are only partially visible or inaccessible in
      the fetched corpus.
    whyItMatters: >-
      Open-public evidence may understate or overstate adoption dynamics when widely cited consultant work cannot be
      checked directly.
    diligencePath: >-
      Obtain licensed copies or management-provided PDFs for the cited consultant reports and rerun the market narrative
      with direct quotations.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: private-evidence-only
    severity: material
    topic: som-precision
    missingEvidence: >-
      Pipeline conversion, deployment-capacity, ACV, and retention data needed to turn the conservative SAM into a
      reliable near-term SOM.
    whyItMatters: >-
      Without internal funnel and cohort data, public market analysis cannot say how much of the category Tulip can win
      economically.
    diligencePath: Request cohort ARR, implementation duration, services load, and multi-site expansion rates by vertical.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: regional-adoption-corroboration
    missingEvidence: >-
      Second-source corroboration for the specific regional-share and enterprise-adoption percentages quoted by Business
      Research Insights.
    whyItMatters: >-
      Single-source adoption figures are directionally useful but not strong enough to carry a hard underwriting
      conclusion alone.
    diligencePath: >-
      Cross-check regional adoption and penetration with another open analyst or government dataset before using them in
      an investment memo.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: Contract-level pricing, discounting, and deployment scope for major direct peers and incumbents.
    whyItMatters: >-
      Without realized pricing and package detail, headline comparisons can misstate competitive ACV pressure or
      expansion economics.
    diligencePath: Request win/loss pricing sheets, competitive battlecards, and recent redlined quotes from sales leadership.
    relatedQuestionRefs:
      - QP024
  - type: access-blocked
    severity: minor
    topic: review-comparison
    missingEvidence: Readable access to G2 alternatives and similar review-driven comparison pages without JS blocking.
    whyItMatters: Independent shortlist evidence is harder to use when comparison portals are inaccessible in the public fetch set.
    diligencePath: Use licensed review exports or manual browser capture to recover accessible comparison data.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: win-rate-data
    missingEvidence: Independent evidence on Tulip win rates against Augmentir, Parsable, Redzone, and incumbent MES suites.
    whyItMatters: Public product surfaces show positioning, not which claims actually convert in head-to-head deals.
    diligencePath: >-
      Ask management for named competitive deals won and lost over the last 12 months with reasons and replacement
      context.
    relatedQuestionRefs:
      - QP021
      - QP022
      - QP023
  - type: stale
    severity: minor
    topic: vendor-surface-freshness
    missingEvidence: Stable canonical product pages for all peers, especially where older URLs now return 404.
    whyItMatters: Stale or moved pages complicate feature and packaging comparisons and can hide recent strategic shifts.
    diligencePath: Capture current product sitemaps or PDF collateral from each vendor before finalizing a win/loss matrix.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: core-financials
    missingEvidence: Current ARR, revenue, gross margin, CAC, NRR, cash balance, and burn.
    whyItMatters: >-
      These are the minimum inputs needed to translate Tulip's funding and product narrative into an investment-grade
      financial model.
    diligencePath: >-
      Request the management data room package with monthly recurring revenue bridge, gross margin, burn, runway, and
      cohort retention.
    relatedQuestionRefs:
      - QI024
  - type: missing-source
    severity: material
    topic: revenue-mix
    missingEvidence: A source showing how much revenue comes from subscriptions versus services, support, or add-ons.
    whyItMatters: >-
      Revenue mix affects gross margin durability and whether scale comes from software or labor-intensive
      implementation.
