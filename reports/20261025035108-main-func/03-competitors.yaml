chapter:
  number: 3
  title: Competitors
  summary: Main Func positions Genspark as a broad AI workspace that collects context, orchestrates many models, and produces finished work, while the competitive set spans enterprise automation suites, CRM-embedded agents, knowledge-work agents, and customer-service specialists. Public evidence supports a differentiated breadth thesis, but competitor pricing, governance, and distribution make switching and commoditization material diligence risks.
sections:
  - id: landscape
    title: Competitive landscape and strategic position
    body: >-
      Genspark competes across several buying motions rather than in one narrowly
      defined software category. Main Func describes an AI workspace that collects
      information from searches, email, meetings, and calls, processes it through a
      Super Agent orchestrating 30+ models, and generates slides, sheets, and
      documents. Its July 2026 launch materials broaden that surface to persistent
      memory, an email client, team channels, custom software, and a $199 meeting
      device. This breadth creates a direct peer set of agentic workspaces, an
      adjacent set of enterprise automation and CRM platforms, and a substitute set
      of specialist customer-service or knowledge agents. It also creates a
      positioning tension: breadth can reduce tool switching for knowledge workers,
      but buyers may prefer incumbent controls, domain-specific reliability, or
      narrower products with clearer ownership and pricing.
    claimRefs: [CP001, CP002, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-comparison
    title: Capability, pricing, and buyer trade-offs
    body: >-
      The buyer comparison is asymmetric because vendors expose different units and
      levels of detail. Salesforce publishes Agentforce consumption prices of $500
      per 100,000 Flex Credits and $2 per conversation, plus per-user options from
      $5 to $150 per month and a $550-per-user Max Edition starting point. Main Func
      publicly exposes a $199 SecondBrain Note price in the launch release, but the
      pool contains no comparable Genspark workspace price, enterprise contract
      terms, or realized discount data. Automation Anywhere emphasizes orchestration
      of AI agents, deterministic automations, and people, while IBM emphasizes a
      control-plane view, governance, and traceability. These are not interchangeable
      products, so the matrix marks unsupported cells as unknown rather than
      inferring parity. The practical buying question is whether Genspark's
      cross-workflow breadth offsets incumbents' embedded distribution and
      enterprise-control advantages.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      Genspark's proposed moat is primarily contextual breadth: a shared memory
      layer, multi-model orchestration, and a workspace that moves from context to
      finished deliverables. The July release claims $250 million of annualized run
      rate within 12 months and more than 7,000 business clients, but those figures
      are company-issued and do not establish retention, gross margin, workflow
      completion, or customer concentration. Sierra's public product surface shows
      the competing depth path: production-ready agents, guardrails, observability,
      long-horizon planning, customer context, and outcome optimization; TechCrunch
      separately reports Sierra's claimed Fortune 50 penetration and ARR milestones.
      Enterprise incumbents can also bundle agents into existing systems and
      procurement relationships. The result is a credible differentiation hypothesis,
      not a durable moat conclusion. Validation should focus on multi-homing,
      switching friction, usage retention, model-cost economics, and whether
      customers buy a workspace or merely consume episodic outputs.
    claimRefs: [CP003, CP010, CP011, CP012, CP014, CP015, CP016]
    tableRefs: []
    figureRefs: []
