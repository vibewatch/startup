  - id: FP001
    title: Competitive positioning by breadth and enterprise control
    type: quadrant
    summary: "An evidence-backed ordinal map places Genspark toward broad workflow coverage while incumbents and specialists emphasize enterprise control or domain depth."
    data:
      points:
        - {label: Genspark, x: 8, y: 5, note: "Broad workspace and finished-work scope are company-described; enterprise-control depth remains partly unverified."}
        - {label: Sierra, x: 5, y: 8, note: "Customer-service depth, guardrails, observability, and planning are documented; breadth outside service is less clear."}
        - {label: Salesforce Agentforce, x: 6, y: 8, note: "CRM distribution, security policies, and metered agent products are documented; broad non-CRM workspace scope is not established."}
        - {label: IBM watsonx Orchestrate, x: 6, y: 8, note: "Cross-functional enterprise workflows and control-plane positioning are documented; pricing is unknown."}
        - {label: Automation Anywhere, x: 6, y: 7, note: "Agentic process automation and governance credentials are documented; independent scale evidence is limited."}
        - {label: Status quo or internal build, x: 2, y: 3, note: "Avoids new platform procurement but lacks a documented unified workspace capability in this pool."}
      xAxis: {label: "Breadth of knowledge-work and workflow coverage", min: 0, max: 10}
      yAxis: {label: "Enterprise control and operating depth", min: 0, max: 10}
    approximationNotes: "Coordinates are ordinal analyst judgments anchored to the retained source descriptions, not measured market scores or independent benchmarks."
    claimRefs: [CP001, CP002, CP006, CP007, CP008, CP009, CP011, CP012, CP015]
callouts:
  - calloutType: insight
    title: Breadth is the thesis, not yet the moat
    body: Genspark's cross-workflow context and finished-output proposition is differentiated in the assigned evidence, but durability depends on retention, reliability, and cost-to-serve data that are not public here.
    claimRefs: [CP001, CP002, CP004, CP015]
  - calloutType: risk
    title: Incumbent distribution can compress differentiation
    body: Salesforce, IBM, and Automation Anywhere each frame agents as extensions of existing enterprise systems or automation controls, creating a credible displacement path even if Genspark has broader user-facing scope.
    claimRefs: [CP006, CP007, CP008, CP009]
