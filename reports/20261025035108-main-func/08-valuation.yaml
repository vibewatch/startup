company:
  name: Main Func
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports a meaningful AI-workspace growth story, but the reported $2.6 billion valuation already prices in substantial execution, retention, and margin success. The appropriate posture is research-more: preserve upside exposure only with verified cohort economics, cap-table terms, and a price disciplined against public software benchmarks."
sections:
  - id: decision
    title: Investment decision
    body: >-
      Main Func's reported financing trajectory is strong but internally inconsistent enough to require price discipline. A June 2026 account described a $100 million Series B extension at a $2.6 billion post-money valuation and more than $645 million of total funding, while a separate June account described a $275 million Series B at a $1.25 billion post-money valuation. Both accounts are third-party summaries of financing information rather than audited filings, and the later $2.6 billion figure is the more recent of the two. The July company release then stated $250 million of annualized run rate, more than 7,000 business clients, $645 million of funding, and a $2.6 billion valuation, but those figures remain company-issued. The resulting call is research-more rather than buy: the business may be scaling, yet public evidence does not establish retention, gross margin, revenue quality, dilution, or liquidation preferences.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001]
  - id: thesis
    title: Thesis and anti-thesis
    body: >-
      The bull case is that Main Func is positioned at the intersection of agentic workflow adoption and a product that expands from individual productivity into shared enterprise workflows. Google Cloud's 2026 trends report says 52% of executives in generative-AI-using organizations have agents in production and that 88% of agentic-AI early adopters see positive ROI on at least one use case; these are market-adoption signals, not proof of Main Func conversion. The company release describes persistent memory, email, team collaboration, and no-code software creation, which could support broader usage and a larger wallet if customers retain those workflows. The anti-thesis is that agent economics and governance are unresolved: an independent industry analysis says more than 40% of agentic projects may be canceled by the end of 2027, citing operationalization, governance, and measurable-value obstacles. A high growth headline can therefore coexist with weak cohort durability, high model costs, or expensive enterprise deployment.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenarios, entry discipline, and diligence
    body: >-
      A simple public-market sensitivity illustrates why the current price requires proof rather than enthusiasm. Multiples.vc reports October 2026 median EV/revenue multiples of 3.5x for artificial-intelligence software and 2.1x across horizontal SaaS, while its methodology says public data is powered by FactSet and Morningstar and private transaction data is assembled from public information and other sources. Applying those reference multiples to the company's reported $250 million annualized run rate is only an illustrative proxy, not a revenue valuation: it yields approximately $525 million at 2.1x and $875 million at 3.5x, before adjustments for growth, gross margin, net cash, financing terms, or the difference between annualized run rate and recognized revenue. The reported $2.6 billion valuation is about 10.4x that run-rate proxy, so entry should be contingent on a verified revenue bridge, durable retention, contribution margin, and clean preference and dilution terms. A credible exit case also needs evidence that customers use autonomous workflows repeatedly rather than buying a novelty product.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
