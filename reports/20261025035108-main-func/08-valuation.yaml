      - [Risk rating, "High", "Execution, model-cost, governance, retention, and financing-term risks remain material.", high]
      - [Valuation stance, "Stretched", "Reported $2.6B is about 10.4x the reported $250M annualized run rate.", medium]
    notes: >-
      Evidence combines company-issued launch metrics, third-party financing summaries, and public software benchmarks; annualized run rate is not treated as audited revenue, and the valuation comparison is illustrative.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current stance]
    rows:
      - ["Agentic adoption is broadening", "Google Cloud reports 52% of executives in gen-AI-using organizations have agents in production.", "Main Func must show paid deployment, repeat use, and expansion rather than category-level adoption.", "Supports thesis"]
      - ["Product breadth can support expansion", "The company release describes persistent memory, email, team chat, and no-code software creation.", "Cohort data should show which modules increase retention and account value.", "Supports thesis"]
      - ["Reported scale may be real but is not independently audited", "The company reports $250M annualized run rate and more than 7,000 business clients.", "Provide revenue recognition, customer definition, cohort retention, and customer concentration.", "Material uncertainty"]
      - ["Agent projects can fail after pilots", "Industry analysis cites governance, operationalization, and measurable-value obstacles and predicts over 40% cancellation by end-2027.", "Show production completion rates, governance controls, and customer ROI evidence.", "Counters thesis"]
    notes: >-
      Rows separate market-level evidence from company-specific proof; the adoption and failure statistics are not direct estimates of Main Func's customers or outcomes.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Illustrative valuation logic, Downside trigger, Probability signal]
    rows:
      - [Bull, "Run rate converts into durable revenue; retention and gross margin support a premium AI-software multiple.", "3.5x x $250M reported annualized run rate = approximately $875M proxy; additional growth could justify more.", "Cohorts expand and contribution margin is demonstrated.", "Low-to-medium"]
      - [Base, "Reported scale is partly validated, but public SaaS economics apply and financing terms remain uncertain.", "2.1x x $250M reported annualized run rate = approximately $525M proxy.", "Revenue quality, retention, or margin trails the headline run rate.", "Most plausible pending diligence"]
      - [Bear, "Run rate is not comparable to recognized revenue and enterprise deployments remain costly or fragile.", "1.0x x $250M reported annualized run rate = approximately $250M proxy; not a forecast.", "Down-round, material churn, weak gross margin, or failed production deployments.", "Material risk"]
      - [Current reported mark, "Company and third-party reports state a $2.6B post-money valuation.", "Approximately 10.4x $250M reported annualized run rate; terms and denominator are unverified.", "Any preference, dilution, or metric-definition disadvantage.", "Reference point, not fair value"]
    notes: >-
      Multiples are illustrative sensitivity anchors, not a company valuation or forecast. The 2.1x and 3.5x references come from October 2026 public horizontal SaaS and artificial-intelligence software medians; the 1.0x case is a conservative analyst assumption. The reported annualized run rate is not substituted for audited revenue.
    claimRefs: [CV001, CV002, CV005, CV013, CV014, CV015, CV016]
