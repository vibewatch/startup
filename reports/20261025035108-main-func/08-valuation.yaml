callouts:
  - calloutType: recommendation
    title: Investment posture
    body: >-
      Research-more is the evidence-sensitive recommendation. A buy case requires verified recognized revenue, cohort retention, gross and contribution margin, customer concentration, and financing terms; without those, the reported $2.6 billion mark should be treated as stretched rather than as a validated fair value.
    claimRefs: [CV004, CV006, CV013, CV014, CV016]
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Escalate to avoid if diligence shows a material down-round or preference overhang, sustained negative contribution margin from model and support costs, weak repeat usage after pilots, or customer concentration that makes the reported client count misleading.
    claimRefs: [CV010, CV011, CV012, CV015]
