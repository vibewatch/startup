  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing-terms
      missingEvidence: "Current cap table, liquidation preferences, option pool, secondary transactions, and any investor-protective terms after the reported $2.6 billion valuation."
      whyItMatters: "The headline valuation cannot be converted into common-equity value or dilution-adjusted return without the security terms and ownership denominator."
      diligencePath: "Obtain the latest cap table, preferred-stock purchase agreement, preference stack, 409A or secondary marks, and a fully diluted ownership bridge from management."
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: "Audited or management-reconciled recognized revenue, ARR definition, customer cohort retention, NRR, GRR, contract duration, and customer concentration."
      whyItMatters: "Annualized run rate and business-client count do not establish recurring revenue quality or durability."
      diligencePath: "Request monthly recurring-revenue bridges, logo and dollar retention cohorts, ACV distribution, churn reasons, and top-customer concentration for the latest four quarters."
      relatedQuestionRefs: [QV002, QV006]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: "Gross margin and contribution margin by modality after model-vendor, inference, support, compliance, and onboarding costs."
      whyItMatters: "Agent workloads can consume variable compute and human-support costs that make revenue growth economically unattractive."
      diligencePath: "Review cost of revenue by model and workflow, gross-margin history, payback by segment, and a sensitivity case for model-price or usage changes."
      relatedQuestionRefs: [QV006]
    - type: conflicting-data
      severity: material
      topic: financing-chronology
      missingEvidence: "Primary documentation reconciling the $275 million Series B at $1.25 billion with the later $100 million extension at $2.6 billion."
      whyItMatters: "Conflicting round descriptions can materially change dilution, valuation step-up, and the timing of the current mark."
      diligencePath: "Obtain signed round announcements or investor confirmations and reconcile proceeds, post-money share count, and close dates."
      relatedQuestionRefs: [QV001, QV007]
    - type: missing-source
      severity: material
      topic: commercialization-risk
      missingEvidence: "Independent customer evidence for production workflow completion, repeat usage, ROI, false-action rates, and governance outcomes."
      whyItMatters: "Category-level AI adoption and company launch claims do not prove that Main Func customers safely retain autonomous workflows."
      diligencePath: "Sample enterprise references and request anonymized production metrics, renewal data, security-review outcomes, and incident logs."
      relatedQuestionRefs: [QV005, QV009]
