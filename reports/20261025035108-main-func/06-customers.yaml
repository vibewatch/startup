      severity: material
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract duration,
        customer cohorts, and satisfaction data segmented by customer type.
      whyItMatters: >-
        Reported client count and run rate cannot establish durable adoption or
        efficient growth without renewal and cohort behavior.
      diligencePath: >-
        Reconcile CRM, billing, product-usage, and contract exports by monthly
        cohort and segment, then test retention calculations against sampled invoices.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-1, top-5, and top-10 customer revenue shares, ACV distribution,
        segment revenue mix, channel contribution, and renewal calendar.
      whyItMatters: >-
        Concentration and procurement timing could make the reported annualized
        run rate less durable than the aggregate figure implies.
      diligencePath: >-
        Obtain the customer revenue ledger, channel agreements, contract
        schedule, and anonymized account-level ARR bridge for finance review.
