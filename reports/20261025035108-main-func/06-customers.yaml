figures:
  - id: FU001
    title: Customer journey and potential expansion surfaces
    type: journey-map
    summary: >-
      The company-described workflow moves from individual intent through
      connected context and agent output toward team collaboration, while the
      commercial conversion and expansion steps remain unmeasured.
    data:
      items:
        - label: Enter with a work objective
          detail: A knowledge worker or team states an intended outcome rather than a sequence of prompts.
          touchpoints:
            - Genspark AI Workspace
        - label: Connect work context
          detail: The company describes context spanning email, meetings, calls, documents, and systems of record.
          touchpoints:
            - SecondBrain
            - Connected enterprise systems
        - label: Execute through agents
          detail: Specialized agents and tools are described as orchestrating multi-step work.
          touchpoints:
            - Super Agent
            - Agent suite
        - label: Produce a finished deliverable
          detail: Supported examples include reports, presentations, financial models, designs, and applications.
          touchpoints:
            - Workspace outputs
        - label: Bring work into a team
          detail: Shared memory and channels are positioned as collaboration surfaces for people and agents.
          touchpoints:
            - GenTeam
        - label: Validate commercial expansion
          detail: Seat growth, workflow growth, renewal, and upsell require private cohort evidence.
          touchpoints:
            - Procurement review
            - Usage and renewal data
    approximationNotes: >-
      This is a qualitative company-described journey, not a conversion funnel.
      Stage order does not imply observed conversion, duration, or economic value.
    claimRefs: [CU006, CU007, CU016]
callouts:
  - calloutType: strength
    title: Reported scale is material
    body: >-
      More than 7,000 business clients and $250 million in Annualized Run Rate
      within 12 months would represent strong demand if the client and run-rate
      definitions reconcile to billing and usage records.
    claimRefs: [CU003, CU004]
  - calloutType: risk
    title: Durability remains a private-data question
    body: >-
      The assigned evidence does not disclose retention, contract length,
      concentration, or a broad set of named production customers, so reported
      scale cannot yet establish durable enterprise adoption.
    claimRefs: [CU010, CU011, CU012]
