  topStrengths:
    - >-
      Reported scale reached $250 million of annualized run rate within twelve months and more than 7,000 business
      clients.
    - Product breadth spans persistent context, communications, collaboration, content creation, and workflow execution.
    - >-
      Category evidence indicates growing enterprise adoption of AI agents and potential demand for multi-stage
      workflows.
  topRisks:
    - >-
      The reported valuation is about 10.4 times the reported run-rate proxy while recognized revenue and financing
      terms remain unverified.
    - >-
      Public evidence does not establish retention, gross margin, contribution margin, customer concentration, or cash
      conversion.
    - >-
      Multi-model dependencies, connected data, autonomous actions, and recording features create material reliability,
      privacy, and regulatory exposure.
    - Conflicting public financing accounts prevent a clean view of dilution, preference stack, and common-equity value.
  unresolvedGaps:
    - >-
      Current cap table, liquidation preferences, option pool, secondary transactions, and fully diluted ownership after
      the reported June 2026 financing.
    - >-
      Audited or management-reconciled recognized revenue, ARR definition, cohort retention, NRR, GRR, contract
      duration, and customer concentration.
    - >-
      Gross margin and contribution margin by workflow after model-vendor, inference, support, compliance, onboarding,
      and hardware costs.
    - >-
      Independent customer evidence for production completion, repeat usage, ROI, false-action rates, renewal behavior,
      and governance outcomes.
    - >-
      Product-specific data controls, incident history, vendor portability, fallback architecture, and regulator or
      litigation exposure.
