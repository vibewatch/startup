      - ["Cross-functional operations", "COO or process owner", "Multiple departments", "Operations budget", "Multi-stage process orchestration", "Change management and ownership"]
      - ["Small teams and professionals", "Founder or team lead", "Individual knowledge workers", "Team or self-serve budget", "Finished documents, slides, and analysis", "Willingness to pay and switching cost"]
      - ["Regulated enterprises", "CIO, compliance, or risk leader", "Approved business users", "IT plus compliance budget", "Controlled agent execution", "Governance, permissions, and auditability"]
    notes: "Buyer map is an evidence-constrained synthesis from the assigned adoption survey, product descriptions, and market definitions; exact Main Func budget ownership remains a diligence gap."
