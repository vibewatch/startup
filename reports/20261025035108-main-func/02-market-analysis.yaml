callouts:
  - calloutType: risk
    title: Broad TAM is not a company forecast
    body: >
      The available workplace-AI estimate includes hardware, software, services, and
      consulting; it should not be converted into Main Func revenue without a bottom-up
      buyer, price, retention, and cost model.
    claimRefs: [CM005, CM016]
  - calloutType: insight
    title: Adoption is moving toward workflow ownership
    body: "The strongest market signal is not generic AI interest but movement toward multi-stage, cross-functional workflows where integration and governance determine whether pilots become recurring spend."
    claimRefs: [CM006, CM010, CM011]
  - calloutType: assumption
    title: Company-specific sizing remains unresolved
    body: "A bottom-up SAM/SOM requires current customer segmentation, pricing, retention, usage, and cost evidence that the assigned public sources do not provide."
    claimRefs: [CM016, CM018]
