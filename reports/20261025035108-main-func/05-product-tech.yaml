          items:
            - name: SecondBrain
              detail: "Persistent memory across email, meetings, calls, documents, and systems of record"
            - name: SecondBrain Note
              detail: "Hardware capture that syncs searchable, structured memory"
        - label: Orchestration
          detail: "The platform routes work across specialized and third-party models."
          items:
            - name: Mixture-of-Agents
              detail: "Specialized and third-party models routed by subtask"
            - name: Agent skills
              detail: "Reusable workflows for email and other work"
        - label: Agent execution
          detail: "Agents apply context to inbox, software-building, and other multi-step tasks."
          items:
            - name: GenMail
              detail: "Inbox prioritization and drafting"
            - name: AgentBase
              detail: "No-code software built from connected data or spreadsheets"
        - label: Collaboration
          detail: "People and agents work together through shared memory and channels."
          items:
            - name: GenTeam
              detail: "Shared channels for people and agents"
        - label: Deliverables
          detail: "The system produces finished work products from the executed workflow."
          items:
            - name: Finished deliverables
              detail: "Presentations, documents, spreadsheets, web apps, and phone calls"
        - label: Governance
          detail: "Security, permissions, auditability, and human review constrain autonomous work."
          items:
            - name: Trust controls
              detail: "Encryption, certifications, access controls, and evaluation evidence require verification"
    claimRefs: [CE001, CE002, CE004, CE005, CE006]
callouts:
  - calloutType: insight
    title: Architecture thesis
    body: The defensible product thesis is orchestration of context and actions across workflows, not ownership of a foundation model; that thesis is only investable if reliability, security, and unit-cost evidence follows.
    claimRefs: [CE005, CE007, CE008]
