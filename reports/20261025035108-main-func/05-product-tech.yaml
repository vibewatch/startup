      - [SecondBrain Note, "User capturing meetings and ideas", "Available; $199 list price and $179 introductory price stated in release", "Hardware-to-memory capture outside the screen", "Consent, regional recording rules, device security, retention"]
      - [GenMail, "Individual knowledge worker", "Launched in Workspace 6.0", "Agentic inbox with reusable skills", "False-send rate, approval controls, and connector scope"]
      - [GenTeam, "Teams of people and agents", "Launched in Workspace 6.0", "Shared memory and agent participation in channels", "Tenant isolation, role controls, and adoption evidence"]
      - [AgentBase, "Business user building internal software", "Launched in Workspace 6.0", "No-code software from connected data or spreadsheets", "Generated-code review, data lineage, and rollback"]
    notes: "Status and feature descriptions are company-issued launch claims; diligence gaps are analyst requests, not observed defects."
    claimRefs: [CE001, CE002, CE003, CE004, CE006]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Turn context into a deliverable", "Gather email, notes, calls, and documents manually", "SecondBrain synthesizes connected sources for users and agents", "No public completion or time-saved metric", "Context quality and authorization are unquantified"]
      - ["Handle email work", "Read, prioritize, and draft replies in an inbox", "GenMail prioritizes and drafts in the user's voice", "No public false-draft or approval metric", "High consequence of incorrect action"]
      - ["Coordinate team work", "People exchange work in team channels", "GenTeam places people and agents in shared channels", "No public adoption or expansion metric", "Shared-memory permissions are undisclosed"]
      - ["Build an internal tool", "Technical team builds a CRM, dashboard, or tracker", "AgentBase connects data or spreadsheets without coding", "No public production reliability metric", "Generated software may require engineering review"]
      - ["Capture off-screen work", "Meeting or phone information is transcribed and re-entered", "SecondBrain Note captures and syncs searchable memory", "No public capture accuracy or retention metric", "Consent, privacy, and device failure modes need testing"]
    notes: "The solution column records disclosed product positioning; the benefit column deliberately distinguishes absent public metrics from measured outcomes."
    claimRefs: [CE001, CE002, CE003, CE004, CE006]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["User context", "Ingest email, meetings, calls, documents, and systems of record", "Connectors, storage, identity", "Over-collection or stale context can drive wrong actions"]
      - ["Orchestration", "Route subtasks across specialized models", "OpenAI, Anthropic, Google and other model providers", "Vendor availability, policy changes, and inference cost"]
      - ["Agent execution", "Plan and execute multi-step work", "Browser, file, API, and workspace permissions", "Prompt injection, excessive privilege, and false actions"]
      - ["Collaboration", "Share memory and work between people and agents", "Tenant isolation and role-based access", "Cross-user leakage or unclear ownership"]
      - ["Capture hardware", "Record and sync spoken context into memory", "Device firmware, cloud sync, encryption", "Consent, regional law, loss, and deletion assurance"]
      - ["Governance", "Review, audit, and constrain autonomous work", "Audit logs, human approval, evaluation harnesses", "Public evidence does not quantify controls or incidents"]
    notes: "Architecture is synthesized only from disclosed product descriptions and clearly labeled dependencies; implementation details not publicly specified remain diligence questions."
    claimRefs: [CE005, CE007, CE008, CE010, CE011, CE012]
