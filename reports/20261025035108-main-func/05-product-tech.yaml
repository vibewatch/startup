company:
  name: Main Func
chapter:
  number: 5
  title: Product & Technology
  summary: Main Func's public product surface has expanded from AI search into an agentic workspace that combines persistent context, specialized agents, collaboration, and a first hardware capture device. The architecture is strategically coherent, but public evidence still leaves reliability, permissioning, model-cost controls, and production security outcomes insufficiently quantified.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: >-
      Main Func presents Genspark as a workspace that captures a user's context, acts on it, and
      scales that work across a team. The July 2026 launch describes SecondBrain as a persistent
      memory layer spanning email, meeting notes, calls, documents, and systems of record; GenMail
      places an agent inside the inbox; GenTeam adds shared channels for people and agents; and
      AgentBase lets users create software from connected data or spreadsheets. A separate company
      profile describes the Super Agent as orchestrating more than 70 models to produce finished
      presentations, documents, spreadsheets, web apps, and phone calls. This is a broad workflow
      promise rather than a single narrow SKU, so diligence should test task completion and error
      handling by workflow, not infer maturity from the breadth of the catalog.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, deployment, and differentiation
    body: >-
      The disclosed operating model is a mixture-of-agents design: the platform routes subtasks
      among in-house and third-party models, then presents a finished deliverable. The launch adds
      persistent memory and a collaboration layer, while SecondBrain Note extends capture beyond
      the screen and syncs recordings into searchable memory. This creates a plausible
      differentiation thesis around context orchestration and workflow completion rather than
      owning a foundation model. It also creates dependencies on model vendors, connectors,
      identity and permission systems, storage, and human review. The public materials identify
      certifications and encryption for the hardware-memory workflow, but do not disclose
      measured completion rates, false-action rates, latency, uptime, recovery objectives, or
      model-routing cost controls.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-and-diligence
    title: Trust, safety, and implementation risk
    body: >-
      The product's strongest technical risk is the combination of broad permissions and
      persistent context. Genspark's earlier search product used multiple specialized models and
      third-party models, but independent reporting documented unsafe recommendations and editable
      pages that could contain wrong or plagiarized material; those observations are historical
      and should not be treated as proof of current Workspace behavior. The 2026 product
      materials claim encryption, SOC 2 Type II, and ISO 27001 for SecondBrain Note, while
      independent enterprise-agent research emphasizes identity, least privilege, audit logs,
      retries, validation against systems of record, and graceful degradation. Before underwriting
      technical maturity, request current audit scope, subprocessors, incident history, connector
      permission design, data-retention controls, evaluation results, and customer-level
      reliability metrics.
    claimRefs: [CE009, CE010, CE011, CE012]
    callouts:
      - calloutType: risk
        title: Evidence gap
        body: Public materials establish a product direction and selected controls, but not the operating metrics needed to assess safe autonomous execution at enterprise scale.
        claimRefs: [CE008, CE009, CE012]
