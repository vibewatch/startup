      - number: '3.2'
        title: Capability, pricing, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              The buyer comparison is asymmetric because vendors expose different units and levels of detail. Salesforce
              publishes Agentforce consumption prices of $500 per 100,000 Flex Credits and $2 per conversation, plus
              per-user options from $5 to $150 per month and a $550-per-user Max Edition starting point. Main Func
              publicly exposes a $199 SecondBrain Note price in the launch release, but the pool contains no comparable
              Genspark workspace price, enterprise contract terms, or realized discount data. Automation Anywhere
              emphasizes orchestration of AI agents, deterministic automations, and people, while IBM emphasizes a
              control-plane view, governance, and traceability. These are not interchangeable products, so the matrix
              marks unsupported cells as unknown rather than inferring parity. The practical buying question is whether
              Genspark's cross-workflow breadth offsets incumbents' embedded distribution and enterprise-control
              advantages.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP013
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Genspark's proposed moat is primarily contextual breadth: a shared memory layer, multi-model
              orchestration, and a workspace that moves from context to finished deliverables. The July release claims
              $250 million of annualized run rate within 12 months and more than 7,000 business clients, but those
              figures are company-issued and do not establish retention, gross margin, workflow completion, or customer
              concentration. Sierra's public product surface shows the competing depth path: production-ready agents,
              guardrails, observability, long-horizon planning, customer context, and outcome optimization; TechCrunch
              separately reports Sierra's claimed Fortune 50 penetration and ARR milestones. Enterprise incumbents can
              also bundle agents into existing systems and procurement relationships. The result is a credible
              differentiation hypothesis, not a durable moat conclusion. Validation should focus on multi-homing,
              switching friction, usage retention, model-cost economics, and whether customers buy a workspace or merely
              consume episodic outputs.
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the thesis, not yet the moat
            body: >-
              Genspark's cross-workflow context and finished-output proposition is differentiated in the assigned
              evidence, but durability depends on retention, reliability, and cost-to-serve data that are not public
              here.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP015
          - type: callout
            title: Incumbent distribution can compress differentiation
            body: >-
              Salesforce, IBM, and Automation Anywhere each frame agents as extensions of existing enterprise systems or
              automation controls, creating a credible displacement path even if Genspark has broader user-facing scope.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Main Func publicly positions Genspark as an agentic workspace that turns business intent into finished
              deliverables, spanning presentations, financial models, documents, web applications, phone calls, memory,
              email, team collaboration, and custom software. The available evidence supports a broad product surface,
              but not a clean revenue bridge by product, customer segment, contract term, or accounting treatment. The
              June 2026 launch material reports $250 million of annualized run rate within 12 months and more than 7,000
              business clients, while the financing release reports more than $50 million of annualized run rate within
              five months of the initial launch. Those are company-issued or company-linked annualized metrics, not
              audited revenue or ARR definitions. The only explicit public price in the assigned pool is $199 for
              SecondBrain Note, with a $179 introductory price; that is a hardware list price and cannot be used as a
              proxy for software contract value. List pricing, realized revenue, mix, discounts, refunds, and
              usage-based model costs remain unverified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Sales efficiency and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public disclosures do not provide Main Func CAC, payback, gross margin, contribution margin, sales cycle,
              quota attainment, support cost, inference cost, or working-capital data. The business model appears to
              require orchestration across many third-party models and tools: the Series B announcement described
              30-plus AI models, 150-plus in-house tools, and 20-plus premium datasets, while the later launch describes
              70-plus models and integrations with several major technology companies. That breadth may improve task
              coverage, but it also makes variable compute, model-provider, storage, tool, support, and compliance costs
              important diligence items. Public comparables show what a mature automation platform can disclose, not
              what Main Func achieves: UiPath reported $1.611 billion of FY2026 revenue, 83% GAAP gross margin, $371
              million operating cash flow, and $1.69 billion of cash, cash equivalents, and marketable securities. The
              comparison is directional only because UiPath is public, mature, and uses its own ARR definition.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Main Func has reported $645 million of total funding and a $2.6 billion valuation after a June 2026 $100
              million Series B extension, but public sources do not disclose cash on hand, monthly burn, runway, debt,
              project-finance obligations, liquidation preferences, or use of proceeds. Funding raised is therefore not
              equivalent to cash available for operations. The financing history and valuation step-up indicate access
              to capital, yet they do not establish that the latest round is sufficient for the cost base implied by a
              multi-model agent platform, hardware launch, enterprise integrations, and global go-to-market. The central
              financial diligence task is to reconcile bookings, billed revenue, recognized revenue, deferred revenue,
              gross profit by modality, vendor commitments, and customer concentration. Until that reconciliation is
              available, the evidence supports a high-growth narrative with material underwriting uncertainty rather
              than a demonstrated margin or runway profile.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI013
              - CI014
      - number: '4.4'
        title: Diligence blockers and requested evidence
        blocks:
          - type: paragraph
            body: >-
              The public record is unusually strong on headline growth and financing announcements but thin on the
              inputs needed to underwrite revenue quality and capital adequacy. The reported $250 million annualized run
              rate is not accompanied by a revenue-recognition policy, customer cohort data, net or gross retention,
              contract duration, average contract value, concentration, renewal behavior, or a bridge from paid usage to
              recognized revenue. The sources also do not establish profitability, operating cash flow, cash balance,
              debt terms, or the split between software, hardware, self-serve, team, and enterprise revenue. These gaps
              are material because a fast ARR ramp can coexist with high inference costs, discounts, one-time usage, or
              low renewal quality. The requested diligence package should include monthly P&L and cash-flow statements,
              ARR-to-revenue reconciliation, cohort retention, customer and contract concentration, vendor invoices,
              model-routing costs, hardware unit economics, and the complete capitalization and preference stack.
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI004
