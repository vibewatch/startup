      - CI013
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Genspark's disclosed product model layers context capture, model orchestration, agent execution, and collaborative
      deliverables.
    data:
      layers:
        - label: Context and capture
          detail: User-owned information enters persistent memory through connected systems and hardware.
          items:
            - name: SecondBrain
              detail: Persistent memory across email, meetings, calls, documents, and systems of record
            - name: SecondBrain Note
              detail: Hardware capture that syncs searchable, structured memory
        - label: Orchestration
          detail: The platform routes work across specialized and third-party models.
          items:
            - name: Mixture-of-Agents
              detail: Specialized and third-party models routed by subtask
            - name: Agent skills
              detail: Reusable workflows for email and other work
        - label: Agent execution
          detail: Agents apply context to inbox, software-building, and other multi-step tasks.
          items:
            - name: GenMail
              detail: Inbox prioritization and drafting
            - name: AgentBase
              detail: No-code software built from connected data or spreadsheets
        - label: Collaboration
          detail: People and agents work together through shared memory and channels.
          items:
            - name: GenTeam
              detail: Shared channels for people and agents
        - label: Deliverables
          detail: The system produces finished work products from the executed workflow.
          items:
            - name: Finished deliverables
              detail: Presentations, documents, spreadsheets, web apps, and phone calls
        - label: Governance
          detail: Security, permissions, auditability, and human review constrain autonomous work.
          items:
            - name: Trust controls
              detail: Encryption, certifications, access controls, and evaluation evidence require verification
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: Customer journey and potential expansion surfaces
    type: journey-map
    summary: >-
      The company-described workflow moves from individual intent through connected context and agent output toward team
      collaboration, while the commercial conversion and expansion steps remain unmeasured.
    data:
      items:
        - label: Enter with a work objective
          detail: A knowledge worker or team states an intended outcome rather than a sequence of prompts.
          touchpoints:
            - Genspark AI Workspace
        - label: Connect work context
          detail: The company describes context spanning email, meetings, calls, documents, and systems of record.
          touchpoints:
            - SecondBrain
            - Connected enterprise systems
        - label: Execute through agents
          detail: Specialized agents and tools are described as orchestrating multi-step work.
          touchpoints:
            - Super Agent
            - Agent suite
        - label: Produce a finished deliverable
          detail: Supported examples include reports, presentations, financial models, designs, and applications.
          touchpoints:
            - Workspace outputs
        - label: Bring work into a team
          detail: Shared memory and channels are positioned as collaboration surfaces for people and agents.
          touchpoints:
            - GenTeam
        - label: Validate commercial expansion
          detail: Seat growth, workflow growth, renewal, and upsell require private cohort evidence.
          touchpoints:
            - Procurement review
            - Usage and renewal data
    approximationNotes: >-
      This is a qualitative company-described journey, not a conversion funnel. Stage order does not imply observed
      conversion, duration, or economic value.
    claimRefs:
      - CU006
      - CU007
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Residual exposure remains concentrated in high-impact dependencies and data-control risks where public operating
      metrics are incomplete.
    data:
      columns:
        - Medium impact
        - High impact
      rows:
        - label: Low likelihood
          values:
            - Vendor fallback
            - Regulatory classification
        - label: Medium likelihood
          values:
            - Hardware reliability
            - Privacy and data control
        - label: High likelihood
          values:
            - Margin compression
            - Wrong or unauthorized agent action
        - label: Low residual exposure
          values:
            - Documented fallback
            - Limited evidence
        - label: Medium residual exposure
          values:
            - Support burden
            - Control testing
        - label: High residual exposure
          values:
            - Cost sensitivity
            - Data and action controls
    approximationNotes: >-
      Qualitative placement based on disclosed product scope, external regulatory requirements, and missing operating
      denominators; this is not a measured probability model.
