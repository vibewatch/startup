              - CO011
              - CO014
      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The strongest available leadership evidence identifies Eric Jing as co-founder and CEO and attributes
              prior Microsoft, Google, and Baidu experience to the founding team. The same profile names Kay Zhu as CTO
              and Wen Sang as COO, while FundedIQ independently lists Kay Zhu as a founder and places the company in a
              51–100 employee band. The discrepancy is material: one profile gives an estimated 143 employees as of
              March 2026, whereas the database uses a broad employee range. Neither source provides a complete board,
              ownership register, succession plan, or key-person controls. The company’s product breadth and reported
              speed of launches increase the importance of founder continuity and technical leadership, but the public
              record is not sufficient to quantify dependence. Governance diligence should therefore focus on the
              current cap table, board rights, executive retention, and operating controls for agents that can act
              across user systems.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
