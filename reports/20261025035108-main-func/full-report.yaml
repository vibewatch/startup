chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Main Func is presented as a Palo Alto, California technology company whose flagship product is Genspark,
              an AI workspace for knowledge workers and teams. FundedIQ describes the product as collecting context from
              web searches, email, meetings, and calls, then using a “Super Agent” to coordinate specialized agents and
              produce reports, slide decks, spreadsheets, and prototype applications. A July 2026 release describes
              Workspace 6.0 as moving beyond one-off generation toward persistent memory, agent collaboration, and work
              execution. The product surface therefore spans research, content, communication, and workflow automation
              rather than a single narrow assistant. The company’s own release says it serves individual and enterprise
              users, while the available evidence does not disclose a segment-level revenue mix, retention, or
              contribution margin. This is a broad platform thesis with meaningful execution and governance
              dependencies.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
