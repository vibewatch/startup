        - Most plausible pending diligence
      - - Bear
        - Run rate is not comparable to recognized revenue and enterprise deployments remain costly or fragile.
        - 1.0x x $250M reported annualized run rate = approximately $250M proxy; not a forecast.
        - Down-round, material churn, weak gross margin, or failed production deployments.
        - Material risk
      - - Current reported mark
        - Company and third-party reports state a $2.6B post-money valuation.
        - Approximately 10.4x $250M reported annualized run rate; terms and denominator are unverified.
        - Any preference, dilution, or metric-definition disadvantage.
        - Reference point, not fair value
    notes: >-
      Multiples are illustrative sensitivity anchors, not a company valuation or forecast. The 2.1x and 3.5x references
      come from October 2026 public horizontal SaaS and artificial-intelligence software medians; the 1.0x case is a
      conservative analyst assumption. The reported annualized run rate is not substituted for audited revenue.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV013
      - CV014
      - CV015
      - CV016
