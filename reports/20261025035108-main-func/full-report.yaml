  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Main Func presents Genspark as a workspace that captures a user's context, acts on it, and scales that
              work across a team. The July 2026 launch describes SecondBrain as a persistent memory layer spanning
              email, meeting notes, calls, documents, and systems of record; GenMail places an agent inside the inbox;
              GenTeam adds shared channels for people and agents; and AgentBase lets users create software from
              connected data or spreadsheets. A separate company profile describes the Super Agent as orchestrating more
              than 70 models to produce finished presentations, documents, spreadsheets, web apps, and phone calls. This
              is a broad workflow promise rather than a single narrow SKU, so diligence should test task completion and
              error handling by workflow, not infer maturity from the breadth of the catalog.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
      - number: '5.2'
        title: Architecture, deployment, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is a mixture-of-agents design: the platform routes subtasks among in-house
              and third-party models, then presents a finished deliverable. The launch adds persistent memory and a
              collaboration layer, while SecondBrain Note extends capture beyond the screen and syncs recordings into
              searchable memory. This creates a plausible differentiation thesis around context orchestration and
              workflow completion rather than owning a foundation model. It also creates dependencies on model vendors,
              connectors, identity and permission systems, storage, and human review. The public materials identify
              certifications and encryption for the hardware-memory workflow, but do not disclose measured completion
              rates, false-action rates, latency, uptime, recovery objectives, or model-routing cost controls.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Trust, safety, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              The product's strongest technical risk is the combination of broad permissions and persistent context.
              Genspark's earlier search product used multiple specialized models and third-party models, but independent
              reporting documented unsafe recommendations and editable pages that could contain wrong or plagiarized
              material; those observations are historical and should not be treated as proof of current Workspace
              behavior. The 2026 product materials claim encryption, SOC 2 Type II, and ISO 27001 for SecondBrain Note,
              while independent enterprise-agent research emphasizes identity, least privilege, audit logs, retries,
              validation against systems of record, and graceful degradation. Before underwriting technical maturity,
              request current audit scope, subprocessors, incident history, connector permission design, data-retention
              controls, evaluation results, and customer-level reliability metrics.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture thesis
            body: >-
              The defensible product thesis is orchestration of context and actions across workflows, not ownership of a
              foundation model; that thesis is only investable if reliability, security, and unit-cost evidence follows.
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation remains broad rather than economically resolved
        blocks:
          - type: paragraph
            body: >-
              Public evidence places Genspark across a wide customer surface: EquityZen describes autonomous automation
              for SMEs and work tools for knowledge workers and teams, while company-issued launch material addresses
              both individual users and enterprise clients worldwide. Those descriptions establish plausible user
              segments, but not the buyer, payer, contract owner, geography, company-size distribution, or revenue
              contribution within each segment. The distinction matters because an individual knowledge worker, an SME
              team, and an enterprise deployment can have very different acquisition costs, security reviews,
              procurement cycles, and expansion paths. The assigned pool therefore supports a segmentation map, not a
              revenue mix. An independent profile also links MainFunc and Genspark through co-founder and CTO Kay Zhu,
              helping attribute the product evidence to the company without adding customer proof.
            claimRefs:
              - CU001
              - CU002
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
              - CU016
      - number: '6.2'
        title: Reported scale is rapid, but the disclosed metrics are not a retention cohort
        blocks:
          - type: paragraph
            body: >-
              Two company-aligned releases describe a steep commercial trajectory. A Lanchi Ventures-issued release
              reported more than $50 million in annualized run rate within five months of launch. A later
              Genspark-issued release, syndicated by TMCnet and FinancialContent, reported $250 million in Annualized
              Run Rate within 12 months and more than 7,000 business clients on July 21, 2026. These figures are
              meaningful signs of demand, but Annualized Run Rate is not audited revenue or ARR, and the releases do not
              define the run-rate calculation, client denominator, active-use threshold, or paid-versus-trial mix. The
              two mirrors of the July release are the same company-issued evidence, not independent corroboration.
              Category surveys from Google Cloud and Anthropic indicate broad enterprise interest in agents, but they
              cannot validate Genspark's own adoption.
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU014
      - number: '6.3'
        title: Customer proof is thin relative to the reported client count
        blocks:
          - type: paragraph
            body: >-
              The retained evidence contains one direct Genspark customer quotation: an unnamed CFO at a large publicly
              traded Texas real-estate company said the product was boardroom ready after the company tried more than 20
              AI tools for quarterly presentations and earnings reports. That is useful use-case evidence, but anonymity
              prevents independent confirmation of production status, deployment size, duration, procurement terms, or
              measured outcome. No additional named Genspark customer deployment appears in the assigned pool. More
              importantly, the company-specific sources do not disclose NRR, GRR, churn, renewals, contract length,
              satisfaction, cohort behavior, or customer concentration. The absence is limited to the reviewed public
              evidence; it is not proof that the company lacks durable customers or internal retention data. These
              metrics should be treated as a material diligence request.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Product breadth creates an expansion hypothesis, not demonstrated expansion
        blocks:
          - type: paragraph
            body: >-
              Workspace 6.0 is described as capturing context from email, meetings, calls, documents, and systems of
              record, then extending work into shared team channels. That architecture could support a land-and-expand
              motion from one user or workflow into additional data surfaces and collaborators, but the assigned
              evidence provides no seat expansion, workflow expansion, renewal, or upsell measurements. External
              category evidence makes the opportunity credible but also raises the proof bar: Anthropic reports that
              multi-stage and cross-functional agent deployments are already common in its survey, while independent
              low-tier commentary relaying Gartner's forecast warns that more than 40% of agentic projects could be
              canceled by the end of 2027 because of operationalization, governance, and value measurement problems.
              That forecast is secondhand category context, not a prediction about Genspark, but it highlights
              procurement and production risks the company must disprove with customer cohorts and references.
            claimRefs:
              - CU006
              - CU007
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported scale is material
            body: >-
              More than 7,000 business clients and $250 million in Annualized Run Rate within 12 months would represent
              strong demand if the client and run-rate definitions reconcile to billing and usage records.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: Durability remains a private-data question
            body: >-
              The assigned evidence does not disclose retention, contract length, concentration, or a broad set of named
              production customers, so reported scale cannot yet establish durable enterprise adoption.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and privacy exposure
        blocks:
          - type: paragraph
            body: >-
              Main Func markets a workspace that captures and processes email, meeting notes, calls, documents, CRM
              data, and other connected context. The July 2026 launch material describes SecondBrain as a persistent
              layer that users and agents can read, use, and update, and says the company protects recordings with
              encryption, SOC 2 Type II, and ISO 27001 certifications. Those are company-issued statements, not an
              independent control audit. The EU AI Act creates a moving compliance perimeter: transparency rules apply
              from August 2026, while certain high-risk obligations and post-market controls phase in later. The
              California Attorney General's current CCPA guidance separately requires notice, access, deletion,
              correction, opt-out, and sensitive-information controls for covered businesses. The key diligence issue is
              whether product-specific data maps, retention controls, model routing, consent flows, and customer
              contractual allocations match the jurisdictions and use cases in which the platform is deployed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Model, platform, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              The orchestration strategy can broaden product capability while creating an exposure to upstream model and
              platform providers. Independent reporting describes Genspark as orchestrating more than 70 models and
              relying on OpenAI, Anthropic, and Microsoft for different layers, including models, APIs, cloud
              infrastructure, and enterprise distribution. The same reporting identifies the strategic tension directly:
              an orchestrator depends on access to model makers that also build competing agent products. The July
              launch release adds hardware, email, team, and custom-software surfaces, which increases the number of
              operational paths that can fail or create support obligations. Public sources do not provide task-success,
              false-action, uptime, incident, recovery-time, or vendor-concentration metrics. A prudent investor should
              therefore treat resilience, portability, data segregation, and vendor-contract protections as unverified
              rather than infer them from certifications or partnership announcements.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Financial and commercial downside
        blocks:
          - type: paragraph
            body: >-
              The July 2026 company release reports $250 million of annualized run rate within twelve months, more than
              7,000 business clients, $645 million of funding, and a $2.6 billion valuation. Those figures are company
              claims repeated in syndicated copies, so they indicate scale ambitions but do not independently establish
              revenue quality, cash conversion, gross margin, retention, customer concentration, or runway. The
              independent partnership coverage likewise says that broad task-success and customer-retention data have
              not been published. A model-routing business may face margin compression if usage grows faster than
              pricing or if upstream model prices, limits, or terms change. The commercial kill criteria should
              therefore be tied to verified contribution margin, renewal and concentration data, service reliability,
              and the ability to migrate workloads without unacceptable quality or compliance degradation.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR009
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Before underwriting growth, require evidence for vendor portability, contribution margin by workload,
              cohort retention and concentration, approval and rollback controls, privacy deletion tests, and incident
              history. Public certifications and partnership announcements do not answer those operating questions.
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR011
              - CR012
              - CR013
          - type: callout
            title: No incident is not no risk
            body: >-
              The assigned public sources do not establish a Main Func breach, outage, lawsuit, or enforcement action.
              That absence should be recorded as an evidence boundary, not treated as evidence that such events have not
              occurred.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision
        blocks:
          - type: paragraph
            body: >-
              Main Func's reported financing trajectory is strong but internally inconsistent enough to require price
              discipline. A June 2026 account described a $100 million Series B extension at a $2.6 billion post-money
              valuation and more than $645 million of total funding, while a separate June account described a $275
              million Series B at a $1.25 billion post-money valuation. Both accounts are third-party summaries of
              financing information rather than audited filings, and the later $2.6 billion figure is the more recent of
              the two. The July company release then stated $250 million of annualized run rate, more than 7,000
              business clients, $645 million of funding, and a $2.6 billion valuation, but those figures remain
              company-issued. The resulting call is research-more rather than buy: the business may be scaling, yet
              public evidence does not establish retention, gross margin, revenue quality, dilution, or liquidation
              preferences.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Main Func is positioned at the intersection of agentic workflow adoption and a
              product that expands from individual productivity into shared enterprise workflows. Google Cloud's 2026
              trends report says 52% of executives in generative-AI-using organizations have agents in production and
              that 88% of agentic-AI early adopters see positive ROI on at least one use case; these are market-adoption
              signals, not proof of Main Func conversion. The company release describes persistent memory, email, team
              collaboration, and no-code software creation, which could support broader usage and a larger wallet if
              customers retain those workflows. The anti-thesis is that agent economics and governance are unresolved:
              an independent industry analysis says more than 40% of agentic projects may be canceled by the end of
              2027, citing operationalization, governance, and measurable-value obstacles. A high growth headline can
              therefore coexist with weak cohort durability, high model costs, or expensive enterprise deployment.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, entry discipline, and diligence
        blocks:
          - type: paragraph
            body: >-
              A simple public-market sensitivity illustrates why the current price requires proof rather than
              enthusiasm. Multiples.vc reports October 2026 median EV/revenue multiples of 3.5x for
              artificial-intelligence software and 2.1x across horizontal SaaS, while its methodology says public data
              is powered by FactSet and Morningstar and private transaction data is assembled from public information
              and other sources. Applying those reference multiples to the company's reported $250 million annualized
              run rate is only an illustrative proxy, not a revenue valuation: it yields approximately $525 million at
              2.1x and $875 million at 3.5x, before adjustments for growth, gross margin, net cash, financing terms, or
              the difference between annualized run rate and recognized revenue. The reported $2.6 billion valuation is
              about 10.4x that run-rate proxy, so entry should be contingent on a verified revenue bridge, durable
              retention, contribution margin, and clean preference and dilution terms. A credible exit case also needs
              evidence that customers use autonomous workflows repeatedly rather than buying a novelty product.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment posture
            body: >-
              Research-more is the evidence-sensitive recommendation. A buy case requires verified recognized revenue,
              cohort retention, gross and contribution margin, customer concentration, and financing terms; without
              those, the reported $2.6 billion mark should be treated as stretched rather than as a validated fair
              value.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Thesis-break triggers
            body: >-
              Escalate to avoid if diligence shows a material down-round or preference overhang, sustained negative
              contribution margin from model and support costs, weak repeat usage after pilots, or customer
              concentration that makes the reported client count misleading.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
