              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Financing, scale, and diligence posture
        blocks:
          - type: paragraph
            body: >-
              Publicly available company-issued material says Genspark reached a $250 million annualized run rate within
              twelve months, served more than 7,000 business clients, and was backed by $645 million at a $2.6 billion
              valuation. The release is a company claim, not audited financial reporting. The refreshed profile source
              gives the same headline valuation, total funding, and employee estimate, while FundedIQ records only one
              $100 million Series B round, illustrating why the financing history should be reconciled to primary
              closing documents before underwriting. The June 2026 valuation implies a substantial financing step-up,
              but the sources do not disclose liquidation preferences, secondary transactions, debt, revenue
              recognition, gross margin, or profitability. Independent context also warns that many enterprise-agent
              initiatives fail when governance, integration, and measurable ROI are weak. Main Func’s reported traction
              is therefore promising but should be treated as a diligence lead: validate cohort behavior, customer
              concentration, model-vendor economics, and the terms behind the latest valuation.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO012
              - CO014
