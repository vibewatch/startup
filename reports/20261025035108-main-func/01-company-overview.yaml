company:
  name: Main Func
chapter:
  number: 1
  title: Company Overview
  summary: Main Func is the Palo Alto company behind Genspark, an agentic AI workspace that combines multi-model orchestration, persistent context, and team workflows. Public evidence shows rapid reported growth and a June 2026 valuation step-up, but private-company disclosures remain inconsistent across databases and do not establish profitability, cap-table terms, or durability of customer usage.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: >-
      Main Func is presented as a Palo Alto, California technology company whose flagship product is
      Genspark, an AI workspace for knowledge workers and teams. FundedIQ describes the product as
      collecting context from web searches, email, meetings, and calls, then using a “Super Agent” to
      coordinate specialized agents and produce reports, slide decks, spreadsheets, and prototype
      applications. A July 2026 release describes Workspace 6.0 as moving beyond one-off generation
      toward persistent memory, agent collaboration, and work execution. The product surface therefore
      spans research, content, communication, and workflow automation rather than a single narrow
      assistant. The company’s own release says it serves individual and enterprise users, while the
      available evidence does not disclose a segment-level revenue mix, retention, or contribution
      margin. This is a broad platform thesis with meaningful execution and governance dependencies.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: people-and-governance
    title: Founders, leadership, and governance
    body: >-
      The strongest available leadership evidence identifies Eric Jing as co-founder and CEO and
      attributes prior Microsoft, Google, and Baidu experience to the founding team. The same profile
      names Kay Zhu as CTO and Wen Sang as COO, while FundedIQ independently lists Kay Zhu as a founder
      and places the company in a 51–100 employee band. The discrepancy is material: one profile gives
      an estimated 143 employees as of March 2026, whereas the database uses a broad employee range.
      Neither source provides a complete board, ownership register, succession plan, or key-person
      controls. The company’s product breadth and reported speed of launches increase the importance of
      founder continuity and technical leadership, but the public record is not sufficient to quantify
      dependence. Governance diligence should therefore focus on the current cap table, board rights,
      executive retention, and operating controls for agents that can act across user systems.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and diligence posture
    body: >-
      Publicly available company-issued material says Genspark reached a $250 million annualized run
      rate within twelve months, served more than 7,000 business clients, and was backed by $645
      million at a $2.6 billion valuation. The release is a company claim, not audited financial
      reporting. The refreshed profile source gives the same headline valuation, total funding, and
      employee estimate, while FundedIQ records only one $100 million Series B round, illustrating
      why the financing history should be reconciled to primary closing documents before underwriting.
      The June 2026 valuation implies a substantial financing step-up, but the sources do not disclose
      liquidation preferences, secondary transactions, debt, revenue recognition, gross margin, or
      profitability. Independent context also warns that many enterprise-agent initiatives fail when
      governance, integration, and measurable ROI are weak. Main Func’s reported traction is therefore
      promising but should be treated as a diligence lead: validate cohort behavior, customer
      concentration, model-vendor economics, and the terms behind the latest valuation.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: exhibits
    title: Evidence exhibits
    body: >-
      The timeline below preserves dated milestones that are visible in the assigned evidence, while
      the tables distinguish reported figures from gaps and identify the stakeholders whose rights or
      dependencies matter for diligence. Dates and metrics are retained with their source posture:
      company-issued releases are not recast as independent verification, and database estimates are
      not treated as audited facts. The most important unresolved issue is not product identity but
      the bridge from reported growth to durable, profitable, governed usage. A current cap table,
      customer cohort file, margin bridge, incident history, and board materials would materially
      improve confidence in the company overview.
    claimRefs: [CO009, CO011, CO014]
    figureRefs: []
