evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary financing chronology and cap table reconciling the reported $100M round record with the $645M
      cumulative-funding claim.
    whyItMatters: >-
      Financing totals and valuation determine dilution, preference stack, and the price discipline required for
      underwriting.
    diligencePath: >-
      Request executed term sheets, capitalization table, preferred-stock schedule, and bank-confirmed financing
      proceeds.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited or management financials showing revenue definition, gross margin, model and infrastructure costs,
      profitability, and cash runway.
    whyItMatters: Annualized run rate is not revenue, ARR, cash generation, or proof of sustainable unit economics.
    diligencePath: Obtain monthly P&L, revenue-recognition policy, usage-cost bridge, bookings, collections, and runway schedule.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table
    missingEvidence: Complete current officer, board, founder, and key technical-lead register with tenure and retention terms.
    whyItMatters: The public record does not establish governance coverage or the degree of key-person dependence.
    diligencePath: >-
      Request board roster, committee structure, executive employment agreements, succession plan, and recent
      departures.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      Customer-level cohort, retention, concentration, contract-length, and active-account evidence behind the >7,000
      client claim.
    whyItMatters: Client count without activity and concentration definitions cannot establish durable demand or revenue quality.
    diligencePath: Request anonymized cohort tables, logo retention, NRR/GRR, ACV bands, churn, and top-account concentration.
    relatedQuestionRefs:
      - QO005
  - type: adverse-data
    severity: material
    topic: governance
    missingEvidence: Incident, security-review, false-action, workflow-completion, and regulatory history for autonomous agents.
    whyItMatters: >-
      Independent evidence identifies governance and measurable ROI as common failure points for enterprise-agent
      deployments.
    diligencePath: >-
      Request SOC reports, penetration-test summaries, incident log, model-risk controls, customer escalations, and
      regulator correspondence.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: company-sizing
    missingEvidence: A bottom-up SAM/SOM model tied to current customer segments, prices, usage, retention, and geographic scope.
    whyItMatters: >-
      Broad workplace-AI estimates include categories that Main Func may not monetize, so they cannot support a company
      revenue forecast.
    diligencePath: >-
      Request management's market model and reconcile it to customer-level pipeline, paid accounts, ACV, retention, and
      expansion data.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: traction
    missingEvidence: >-
      Cohort retention, NRR, GRR, contract length, ACV distribution, gross margin, and customer concentration behind
      reported clients and annualized run rate.
    whyItMatters: >-
      Reported client count and annualized run rate do not establish recurring quality, unit economics, or valuation
      durability.
    diligencePath: >-
      Obtain a cohort bridge by customer segment and reconcile bookings, recognized revenue, ARR, usage costs, and
      renewals.
    relatedQuestionRefs:
      - QM005
