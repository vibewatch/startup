    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["AI transparency and GPAI obligations", "EU", "Medium", "High", "Unverified", "High", "Obtain product classification, transparency-control map, GPAI allocation, and compliance ownership by use case."]
      - ["High-risk AI controls, logging, oversight, and post-market monitoring", "EU", "Medium", "High", "Unverified", "High", "Map deployments to Annex III and regulated-product scenarios; inspect logs, human-oversight procedures, incident reporting, and technical files."]
      - ["Personal-information notice, access, deletion, correction, opt-out, and sensitive-data controls", "California", "Medium", "High", "Partially disclosed", "High", "Review privacy notices, data inventory, retention/deletion tests, GPC handling, processor terms, and breach response evidence."]
      - ["Recording and connected-workspace consent, security, and data-use allocation", "Multi-jurisdiction", "Medium", "High", "Unverified", "High", "Review consent UX, regional recording rules, encryption/key management, subprocessor list, and customer DPA language."]
    notes: "Regulatory requirements are sourced from European Commission and California Attorney General pages; company control maturity is not independently verified and null-like unknowns are represented as Unverified."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented AI and privacy obligations relevant to connected workspace features as of the 2026-10-25 run date."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Upstream model access, pricing, policy, or quality change", "Medium", "High", "Unverified", "High", "No disclosed vendor concentration, portability test, fallback SLA, or unit-cost sensitivity."]
      - ["Agent makes a wrong or unauthorized action across connected systems", "Medium", "High", "Unverified", "High", "No public false-action, task-success, approval-gating, or rollback metrics."]
      - ["Sensitive context is exposed through memory, recording, or model routing", "Medium", "High", "Partially disclosed", "High", "Certification statements do not establish tenant isolation, retention enforcement, deletion verification, or all subprocessor controls."]
      - ["Hardware or multi-surface service failure creates support and reliability burden", "Medium", "Medium", "Unverified", "Medium", "No public uptime, incident, replacement, recovery-time, or field-failure data."]
    notes: "Risk levels are analytical judgments anchored to disclosed product scope and external control requirements; the cited public materials do not publish operating-rate denominators or incident histories."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Frontier-model APIs and models", "OpenAI and Anthropic", "Access, pricing, latency, policy, or model quality changes impair routing economics or product behavior.", "High", "Maintain model abstraction and tested alternatives; verify contractual continuity and portability.", "High"]
      - ["Cloud and enterprise distribution", "Microsoft / Azure", "Infrastructure, integration, or channel changes increase cost, reduce reach, or constrain product choices.", "High", "Document exit architecture, service-level terms, and channel-independent acquisition.", "Medium-High"]
      - ["Connected customer systems and data sources", "Customer CRMs, email, documents, and records", "Permission, schema, availability, or deletion mismatch causes incorrect actions or compliance exposure.", "High", "Use least privilege, approval gates, audit logs, and verified deletion workflows.", "High"]
      - ["Customer concentration and retention", "Business-client base", "A small number of clients or low renewal quality makes reported scale fragile.", "Medium-High", "Track cohort retention, ACV concentration, expansion, and production-use outcomes.", "High"]
    notes: "Counterparties and roles are drawn from public partnership reporting and the company launch release; concentration, contract terms, and mitigation execution remain undisclosed."
    claimRefs: [CR005, CR006, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Residual exposure remains concentrated in high-impact dependencies and data-control risks where public operating metrics are incomplete.
    data:
      columns: ["Medium impact", "High impact"]
      rows:
        - label: "Low likelihood"
          values: ["Vendor fallback", "Regulatory classification"]
        - label: "Medium likelihood"
          values: ["Hardware reliability", "Privacy and data control"]
        - label: "High likelihood"
          values: ["Margin compression", "Wrong or unauthorized agent action"]
        - label: "Low residual exposure"
          values: ["Documented fallback", "Limited evidence"]
        - label: "Medium residual exposure"
          values: ["Support burden", "Control testing"]
        - label: "High residual exposure"
          values: ["Cost sensitivity", "Data and action controls"]
    approximationNotes: "Qualitative placement based on disclosed product scope, external regulatory requirements, and missing operating denominators; this is not a measured probability model."
    claimRefs: [CR001, CR005, CR007, CR009, CR013]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: >-
      Before underwriting growth, require evidence for vendor portability, contribution margin
      by workload, cohort retention and concentration, approval and rollback controls, privacy
      deletion tests, and incident history. Public certifications and partnership announcements
      do not answer those operating questions.
    claimRefs: [CR007, CR009, CR011, CR012, CR013]
  - calloutType: assumption
    title: No incident is not no risk
    body: >-
      The assigned public sources do not establish a Main Func breach, outage, lawsuit, or
      enforcement action. That absence should be recorded as an evidence boundary, not treated
      as evidence that such events have not occurred.
    claimRefs: [CR008, CR009]
