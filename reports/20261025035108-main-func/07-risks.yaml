company:
  name: Main Func
chapter:
  number: 7
  title: Risks
  summary: Main Func's principal risks are dependency and control risks around a rapidly expanding multi-model workspace, together with privacy and regulatory obligations that rise as the product connects email, meetings, documents, and systems of record. Public evidence supports a high residual-risk posture, but does not establish that the company has experienced a breach, outage, litigation, or regulatory enforcement event.
sections:
  - id: regulatory-privacy
    title: Regulatory and privacy exposure
    body: >-
      Main Func markets a workspace that captures and processes email, meeting notes, calls,
      documents, CRM data, and other connected context. The July 2026 launch material describes
      SecondBrain as a persistent layer that users and agents can read, use, and update, and
      says the company protects recordings with encryption, SOC 2 Type II, and ISO 27001
      certifications. Those are company-issued statements, not an independent control audit.
      The EU AI Act creates a moving compliance perimeter: transparency rules apply from August
      2026, while certain high-risk obligations and post-market controls phase in later. The
      California Attorney General's current CCPA guidance separately requires notice, access,
      deletion, correction, opt-out, and sensitive-information controls for covered businesses.
      The key diligence issue is whether product-specific data maps, retention controls, model
      routing, consent flows, and customer contractual allocations match the jurisdictions and
      use cases in which the platform is deployed.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: dependency-operations
    title: Model, platform, and execution dependencies
    body: >-
      The orchestration strategy can broaden product capability while creating an exposure to
      upstream model and platform providers. Independent reporting describes Genspark as
      orchestrating more than 70 models and relying on OpenAI, Anthropic, and Microsoft for
      different layers, including models, APIs, cloud infrastructure, and enterprise
      distribution. The same reporting identifies the strategic tension directly: an
      orchestrator depends on access to model makers that also build competing agent products.
      The July launch release adds hardware, email, team, and custom-software surfaces, which
      increases the number of operational paths that can fail or create support obligations.
      Public sources do not provide task-success, false-action, uptime, incident, recovery-time,
      or vendor-concentration metrics. A prudent investor should therefore treat resilience,
      portability, data segregation, and vendor-contract protections as unverified rather than
      infer them from certifications or partnership announcements.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: financial-commercial
    title: Financial and commercial downside
    body: >-
      The July 2026 company release reports $250 million of annualized run rate within twelve
      months, more than 7,000 business clients, $645 million of funding, and a $2.6 billion
      valuation. Those figures are company claims repeated in syndicated copies, so they
      indicate scale ambitions but do not independently establish revenue quality, cash
      conversion, gross margin, retention, customer concentration, or runway. The independent
      partnership coverage likewise says that broad task-success and customer-retention data
      have not been published. A model-routing business may face margin compression if usage
      grows faster than pricing or if upstream model prices, limits, or terms change. The
      commercial kill criteria should therefore be tied to verified contribution margin,
      renewal and concentration data, service reliability, and the ability to migrate workloads
      without unacceptable quality or compliance degradation.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
    figureRefs: [FR001]
tables:
