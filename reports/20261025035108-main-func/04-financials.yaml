company:
  name: Main Func
chapter:
  number: 4
  title: Financials
  summary: Public evidence describes a rapid annualized-revenue ramp and substantial financing, but it does not disclose realized revenue, gross margin, cash, burn, retention, or customer-level economics. The underwriting case therefore depends on validating the quality and durability of the reported ARR rather than extrapolating it into profitability.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and monetization
    body: >-
      Main Func publicly positions Genspark as an agentic workspace that turns business intent into finished deliverables, spanning presentations, financial models, documents, web applications, phone calls, memory, email, team collaboration, and custom software. The available evidence supports a broad product surface, but not a clean revenue bridge by product, customer segment, contract term, or accounting treatment. The June 2026 launch material reports $250 million of annualized run rate within 12 months and more than 7,000 business clients, while the financing release reports more than $50 million of annualized run rate within five months of the initial launch. Those are company-issued or company-linked annualized metrics, not audited revenue or ARR definitions. The only explicit public price in the assigned pool is $199 for SecondBrain Note, with a $179 introductory price; that is a hardware list price and cannot be used as a proxy for software contract value. List pricing, realized revenue, mix, discounts, refunds, and usage-based model costs remain unverified.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: sales-efficiency-and-cost-structure
    title: Sales efficiency and cost structure
    body: >-
      Public disclosures do not provide Main Func CAC, payback, gross margin, contribution margin, sales cycle, quota attainment, support cost, inference cost, or working-capital data. The business model appears to require orchestration across many third-party models and tools: the Series B announcement described 30-plus AI models, 150-plus in-house tools, and 20-plus premium datasets, while the later launch describes 70-plus models and integrations with several major technology companies. That breadth may improve task coverage, but it also makes variable compute, model-provider, storage, tool, support, and compliance costs important diligence items. Public comparables show what a mature automation platform can disclose, not what Main Func achieves: UiPath reported $1.611 billion of FY2026 revenue, 83% GAAP gross margin, $371 million operating cash flow, and $1.69 billion of cash, cash equivalents, and marketable securities. The comparison is directional only because UiPath is public, mature, and uses its own ARR definition.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Main Func has reported $645 million of total funding and a $2.6 billion valuation after a June 2026 $100 million Series B extension, but public sources do not disclose cash on hand, monthly burn, runway, debt, project-finance obligations, liquidation preferences, or use of proceeds. Funding raised is therefore not equivalent to cash available for operations. The financing history and valuation step-up indicate access to capital, yet they do not establish that the latest round is sufficient for the cost base implied by a multi-model agent platform, hardware launch, enterprise integrations, and global go-to-market. The central financial diligence task is to reconcile bookings, billed revenue, recognized revenue, deferred revenue, gross profit by modality, vendor commitments, and customer concentration. Until that reconciliation is available, the evidence supports a high-growth narrative with material underwriting uncertainty rather than a demonstrated margin or runway profile.
    claimRefs: [CI009, CI010, CI011, CI012]
    figureRefs: [FI001]
  - id: financial-gaps-and-asks
    title: Diligence blockers and requested evidence
    body: >-
      The public record is unusually strong on headline growth and financing announcements but thin on the inputs needed to underwrite revenue quality and capital adequacy. The reported $250 million annualized run rate is not accompanied by a revenue-recognition policy, customer cohort data, net or gross retention, contract duration, average contract value, concentration, renewal behavior, or a bridge from paid usage to recognized revenue. The sources also do not establish profitability, operating cash flow, cash balance, debt terms, or the split between software, hardware, self-serve, team, and enterprise revenue. These gaps are material because a fast ARR ramp can coexist with high inference costs, discounts, one-time usage, or low renewal quality. The requested diligence package should include monthly P&L and cash-flow statements, ARR-to-revenue reconciliation, cohort retention, customer and contract concentration, vendor invoices, model-routing costs, hardware unit economics, and the complete capitalization and preference stack.
    claimRefs: [CI013, CI014, CI015]
    tableRefs: [TI004]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [stream, mechanism, unit, current value or status, quality, diligence ask]
    rows:
      - [Agentic workspace, "Autonomous delivery of presentations, documents, spreadsheets, web apps, and other outputs", "Not disclosed", "$250M annualized run rate reported within 12 months", "Company-issued annualized metric; not audited revenue", "Provide ARR definition, billed-to-recognized bridge, and cohort retention"]
      - [Business clients, "Use of workspace and agents by organizations", "Clients", "More than 7,000 business clients reported in July 2026", "Company-issued count; mix and paying status unavailable", "Provide active-paying definition, concentration, and renewal data"]
      - [AI Workspace launch, "Agentic workspace launched with Series B financing", "Annualized run rate", "Exceeded $50M within five months of initial launch", "Company-issued historical milestone", "Reconcile cohorts, discounts, usage, and recognized revenue"]
      - [SecondBrain Note, "Dedicated hardware capturing meetings and spoken ideas", "Device", "$199 list price; $179 introductory price", "Company launch list price; not realized revenue", "Provide bill of materials, fulfillment cost, returns, and attach rate"]
    notes: "Sources are company-issued or company-linked disclosures. Annualized run rate is not treated as GAAP revenue or cash receipts; the hardware price is list pricing."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit-economics evidence and diligence status
    columns: [metric, value, confidence, why it matters, diligence ask]
    rows:
      - [ARR definition, null, low, "Annualized run rate may differ from recognized revenue and can include different customer or usage assumptions", "Provide written metric policy and monthly reconciliation"]
      - [Gross margin, null, low, "Model, tool, storage, support, and compliance costs may scale with usage", "Provide gross margin by product and customer cohort"]
      - [CAC and payback, null, low, "Rapid growth does not establish efficient acquisition", "Provide fully loaded sales and marketing spend, new ARR, and cohort payback"]
      - [Net retention, null, low, "Retention distinguishes durable recurring demand from one-time or promotional usage", "Provide GRR, NRR, logo retention, and cohort waterfall"]
      - [Operating cash flow, null, low, "Accounting growth does not establish self-funding operations", "Provide monthly cash flow, burn, and working-capital schedule"]
      - [Cash and runway, null, low, "Funding raised is not cash available after spending and obligations", "Provide cash balance, debt, commitments, and runway cases"]
    notes: "All null values are unavailable in the assigned public evidence and each row has a specific diligence request. UiPath figures are a mature public-company benchmark, not a Main Func estimate."
    claimRefs: [CI005, CI006, CI007, CI008, CI014, CI015]
  - id: TI004
    title: Capital adequacy and underwriting checklist
    columns: [input, public evidence, underwriting interpretation, required evidence]
    rows:
      - [Total funding, "$645M reported; financing release separately reports a $275M Series B", "Capital access is evidenced, but cash available is not", "Round documents, cap table, preference stack, and current cash"]
      - [Latest valuation, "$2.6B post-money after June 2026 $100M extension", "Valuation is a financing reference point, not a revenue multiple or liquidity value", "Term sheet, secondary activity, and current financing terms"]
      - [Burn and runway, null, "Cannot infer runway from funding raised", "Monthly cash burn, commitments, and base/downside scenarios"]
      - [Debt and project finance, null, "No public evidence of debt or related obligations in the assigned pool", "Debt schedule, covenants, leases, and hardware inventory financing"]
      - [Customer concentration, null, "7,000-plus client count does not show revenue concentration", "Top-10 and top-25 revenue, renewal, and contract concentration"]
      - [Margin path, null, "Growth may not translate to contribution profit with multi-model routing", "Vendor spend, gross margin bridge, support and compliance cost allocation"]
    notes: "Reported financing amounts and valuation are preserved as disclosed; no cash, burn, debt, or margin value is inferred from them."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: From customer activity to underwritable economics
    type: flow
    summary: Public evidence reaches annualized run rate, but the revenue-to-cash and margin steps remain unverified.
    data:
      nodes:
        - id: customer-activity
          label: "Workspace, agents, hardware, and business clients"
          detail: "More than 7,000 business clients and a $199/$179 hardware price are publicly described."
        - id: billed-usage
          label: "Billed or contracted usage"
          detail: "Plans, seats, usage terms, discounts, and contract values are not disclosed."
        - id: annualized-run-rate
          label: "$250M annualized run rate"
          detail: "Company-linked July 2026 launch material reports this within 12 months."
        - id: recognized-revenue
          label: "Recognized revenue"
          detail: "No public reconciliation or accounting policy is available."
        - id: gross-profit
          label: "Gross profit after model and delivery costs"
          detail: "No Main Func gross margin or contribution margin is disclosed."
        - id: cash-generation
          label: "Operating cash generation and runway"
          detail: "Cash balance, burn, debt, and runway are unavailable."
      edges:
        - from: customer-activity
          to: billed-usage
        - from: billed-usage
          to: annualized-run-rate
        - from: annualized-run-rate
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
        - from: gross-profit
          to: cash-generation
    approximationNotes: "The sequence is an analytical bridge, not a measured conversion funnel; only the annualized run-rate and hardware list price have public numeric support."
    claimRefs: [CI001, CI002, CI004, CI013, CI014]
callouts:
  - calloutType: strength
    title: Rapid reported monetization
    body: "Company-linked materials report a $250M annualized run rate within 12 months and more than 7,000 business clients."
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Revenue quality is not yet underwritable
    body: "No assigned source provides recognized revenue, gross margin, retention, cash, burn, or customer concentration."
    claimRefs: [CI013, CI014, CI015]
  - calloutType: recommendation
    title: Require a metric and cash bridge
    body: "Underwriting should be conditional on an ARR-to-revenue reconciliation, cohort retention, product-level gross margin, and monthly cash-flow package."
    claimRefs: [CI013, CI014, CI015]
