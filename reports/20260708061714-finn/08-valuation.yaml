- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Debt-market access weakens
    - ABS / warehouse growth stalls or refinancing costs jump
    - Growth narrative breaks because fleet expansion is capital-constrained
    - Move toward bear case
  - - Residual values deteriorate
    - Realized resale values materially miss underwriting
    - Equity value falls through lower margin and weaker collateral performance
    - Cut valuation range
  - - Service quality worsens
    - Complaint or resolution metrics deteriorate
    - B2B durability and brand arguments weaken
    - Apply execution discount
  - - Disclosure remains thin
    - No audited revenue-quality or cohort-economics evidence emerges
    - Public-like premium remains unsupported
    - Stay track rather than buy
  - - Leadership / control slippage
    - Finance or operating controls lag scale
    - Narrative becomes harder to defend to late-stage or public investors
    - Delay underwriting or reduce entry price
  notes: Triggers are chosen for their direct ability to compress multiple support or equity value.
  claimRefs:
  - CV017
  - CV023
  - CV033
  - CV037
  - CV039
  - CV041
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Recognized revenue bridge from ARR, deferred revenue, and cohort mix
    - Determines whether public-multiple comparisons are even directionally fair
    - Finance diligence + accounting review
  - - Fleet cash conversion
    - Realized residual values, remarketing timing, and utilization by cohort
    - Decides whether equity can compound after debt service
    - Fleet / financing diligence
  - - Capital structure
    - Debt covenants, collateral tests, preference stack, and maturity ladder
    - Changes real equity value versus headline valuation
    - Legal + financing diligence
  - - Customer durability
    - Churn, NRR, concentration, contract length, and B2B cohort behavior
    - Determines whether growth is durable enough for premium pricing
    - Commercial diligence
  - - Service economics
    - Support cost, damage cost, returns friction, and complaint resolution trends
    - Tests whether operational intensity caps margin expansion
    - Operations diligence
  notes: These asks are prioritized by how directly they could move the investment call at the current price.
