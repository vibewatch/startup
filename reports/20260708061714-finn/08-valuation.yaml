    - ~0.46x
    - Asset-heavy mobility downside anchor
    - Mature rental company, not venture-growth operator
  - - Hertz
    - July 2026 market cap / TTM revenue
    - ~0.08x
    - Distressed asset-heavy downside anchor
    - Distress history materially skews the multiple
  notes: The table mixes platform, auto-commerce, and rental references because no public pure-play FINN analogue exists.
