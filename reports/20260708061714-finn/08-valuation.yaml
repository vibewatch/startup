- id: exit-readiness-and-final-diligence-asks
  title: Exit Readiness and the Final Diligence Ask List
  body: 'The final valuation question is not just what FINN might be worth in theory, but what evidence would let an investor underwrite that value with confidence. Public materials are still thin on the most important bridges between ARR and equity value: revenue recognition quality, realized fleet cash conversion, residual-value performance versus underwriting, debt covenants, customer concentration, and normalized service-cost intensity. Those gaps matter because they directly determine whether the equity can compound from the 2026 round or whether public-style multiple compression will dominate. Exit readiness is therefore incomplete. FINN has the narrative ingredients of a future large mobility platform, but not yet the public disclosure quality that would make an IPO-style or late-stage crossover valuation easy to defend. The actionable conclusion is to focus diligence on the handful of metrics that most directly decide whether todays headline price is fair, full, or still too rich.'
