- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR growth stays strong, residual values stabilize, and management proves profitable growth with cleaner disclosures
    - ~€1.2B-€1.5B range; upside requires premium-like execution proof
    - Debt remains manageable; service issues contained
    - Possible, but needs evidence not yet public
  - - Base
    - Growth continues, but debt, servicing, and remarketing risk remain meaningful
    - ~€0.75B-€1.05B range; close to current headline, so upside is limited
    - Multiple does not expand much without better disclosure
    - Most consistent with current evidence
  - - Bear
    - Residual values or funding costs worsen and operations disappoint
    - ~€0.3B-€0.6B range; multiple compresses toward lower asset-heavy peers
    - Capital access and customer friction matter more than growth narrative
    - Real downside if macro and execution move together
  notes: Scenario ranges are heuristic and use public comp anchors plus ARR-based judgment, not a full DCF.
  claimRefs:
