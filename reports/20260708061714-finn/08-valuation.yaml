- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - 'Thesis: FINN has real scale and financing access'
    - '>€300M ARR, >50k subscriptions, unicorn round, B2B momentum'
    - Upgrade if cohort profitability and cash conversion are demonstrated
  - - 'Anti-thesis: current price already assumes a lot'
    - '>3.3x valuation/ARR heuristic and missing audited revenue detail'
    - Downgrade if debt, residual, or service metrics weaken
  - - 'Structural caution: debt is central'
    - ABS, warehouse, and full-debt vehicle financing are core to growth
    - Improve only if leverage, covenants, and refinance risk are transparently managed
  - - 'Optionality: B2B can improve durability'
    - Business-customer count and existing-customer expansion support some stickiness
    - Strengthen if churn and concentration data validate account quality
  notes: The anti-thesis is valuation-led, not an argument that FINN lacks product-market fit.
