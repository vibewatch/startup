    - Marketplace model is less asset-heavy than FINN
  - - Lyft
    - July 2026 market cap / TTM revenue
    - ~0.90x
    - Shows how public markets punish weaker profitability confidence
    - Single-country platform, different economics
  - - Grab
    - July 2026 market cap / TTM revenue
