  - FU003
- id: satisfaction-retention-and-adverse-signals
  title: Satisfaction, Retention, and Adverse Signals
  body: 'Public customer-quality evidence is mixed. On the positive side, the App Store shows a 4.7 rating from 189 ratings, the Play listing emphasizes 24/7 support and frictionless ordering, and Trustpilot includes at least some repeat-use praise from customers who renewed into a second car. On the negative side, the same Trustpilot archive contains repeated complaints about delivery delays, return disputes, deposit handling, deductible charges, and weak customer support. That matters because the service model is operationally intense: if handover, support, or returns break, customer sentiment can deteriorate quickly. The deeper problem is that none of these surfaces substitute for cohort metrics. Ratings and reviews are useful directional signals, but they do not provide NRR, GRR, churn, or average subscription duration. As a result, public proof suggests a real product with real users and real friction points, but not a clean view of durable customer economics.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU020
  - CU021
  - CU022
  - CU024
  - CU030
  - CU036
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-loops-and-concentration-risk
  title: Expansion Loops and Concentration Risk
  body: The best public expansion signal comes from B2B, not from consumer up-tiering. FINN said more than 80% of new B2B subscriptions were sold to existing customers, which is classic land-and-expand behavior and suggests that once a business account starts using the platform, it may widen the fleet relationship over time. The company also said large fleets of 50-plus vehicles were the strongest growth source and that the enterprise segment above 200 vehicles was a priority. JobAuto adds a second expansion loop because benefit channels like Probonio can distribute FINN to multiple employers and employee cohorts without the company having to win each end user one by one. The main unresolved risk is concentration. Because public materials rarely name enterprise customers or show revenue share by account, it is impossible to assess whether a few large fleet relationships or channel partners dominate the base. Customer quality therefore looks promising on expansion logic but still under-disclosed
    on concentration and retention durability.
  claimRefs:
  - CU017
  - CU018
  - CU023
  - CU031
  - CU032
  - CU033
  - CU035
  - CU036
