company:
  name: FINN
chapter:
  number: 6
  title: Customers
  summary: 'Public customer proof shows FINN serving both retail and business demand, with the clearest expansion evidence coming from B2B fleets and the JobAuto employee-benefit channel. The weakest part of the public record is retention quality: reviews and ratings exist, but churn, NRR, and concentration remain materially undisclosed.'
sections:
- id: customer-segments-and-buyer-logic
  title: Customer Segments, Buyer Logic, and Geography
  body: 'The reviewed sources show FINN serving multiple customer groups with different buyer-user-payer structures. The simplest segment is the retail consumer: the user chooses and pays for the car subscription directly. Business subscriptions are more complex because fleet managers, procurement, finance, or HR functions may approve and pay while employees use the vehicles. JobAuto adds a third structure, where the employer enables the benefit, but the employee funds most of the subscription through salary conversion. That matters because it turns FINN from a pure consumer offering into a channel-based corporate mobility product. Public evidence also suggests the strongest named customer proof is still Germany-centric. The business-growth release, Probonio materials, and most review surfaces are tied to Germany, while the U.S. evidence in the reviewed set is thinner and framed as harder to scale. FINN therefore looks like a broad but still Germany-led customer platform rather than a balanced
    transatlantic franchise.'
  claimRefs:
  - CU001
  - CU009
  - CU010
  - CU013
  - CU019
  - CU025
  - CU028
  - CU029
  - CU034
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-named-proof
  title: Adoption Trajectory and Named Proof Surfaces
  body: 'The strongest adoption numbers are still company-reported, but they do show step-change growth. FINN disclosed 25,000 active subscriptions in early 2024 and more than 50,000 subscriptions on the road by June 2026. On the B2B side, the company said it supplied over 2,500 business customers in late 2023 and that those customers already drove 45% of ARR. That scale matters because it supports the idea that FINN has moved beyond small pilot demand. Named customer proof is less straightforward. Public materials do not reveal many enterprise customer names, but they do show named channel and implementation proof for JobAuto: Probonio markets the benefit to its 5,000-plus customers, Vision Mobility covered the partnership independently, and noa.tech documented a live JobAuto portal with external clients onboarded. Those are not the same as a long list of named fleet customers, but they do support the existence of a real channel and production workflow rather than a concept deck.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU009
  - CU014
  - CU015
  - CU019
  - CU023
  - CU033
