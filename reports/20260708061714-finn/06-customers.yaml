- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Land-and-expand inside B2B accounts
    - Large fleets may account for outsized revenue
    - Could strengthen revenue quality or create hidden account concentration
    - Request revenue share by fleet size bucket and top 10 accounts
  - - JobAuto channel growth
    - Reliance on key benefit/distribution partners such as Probonio
    - Could accelerate acquisition but create channel dependence
    - Request channel-sourced volumes and partner concentration
  - - Enterprise fleet focus
    - A few large employers may dominate growth
    - Could produce step-change wins but slower procurement cycles
    - Request pipeline and closed-won data by company size
  - - Consumer app and review channels
    - Mobile acquisition may not equal durable retention
    - Could overstate customer quality if ratings outrun renewals
    - Request paid-subscriber retention and return reasons
  - - Geographic concentration in Germany
    - US or other markets may remain immaterial
    - Limits diversification and makes local execution more important
    - Request live subscriber split by geography and channel
  notes: Public evidence supports clear expansion loops but very limited visibility into revenue concentration.
