  - TU005
  figureRefs: []
tables:
- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale proof
  - Strategic value
  - Gap
  rows:
  - - Retail consumer
    - Consumer / consumer / consumer
    - Flexible personal mobility without ownership
    - Consumer app, home delivery, ratings, reviews
    - Broad demand base and brand visibility
    - No public active-user split by country
  - - SME fleet
    - Owner-manager or fleet lead / employees / business budget
    - Flexible business vehicles and admin reduction
    - B2B page and >2,500 business-customer proof
    - Recurring B2B revenue with admin leverage
    - No public logo list or cohort margin
  - - Enterprise fleet
    - Procurement / HR / finance / employees / business budget
    - Larger fleets and company-car substitution
    - 50+ vehicle fleets show strongest growth; 200+ vehicle segment targeted
    - Potentially sticky and high-value segment
    - Named customers and concentration not disclosed
  - - JobAuto employee-benefit user
    - Employer enables, employee uses and largely funds via salary conversion
    - Tax-efficient mobility benefit
    - Probonio, JobAuto calculator, and portal case study
    - Channel-based growth without classic B2C CAC alone
    - Channel dependence and employer activation data absent
  - - US customer cohort
    - Consumer / consumer / consumer
    - Flexible car access in prior expansion market
    - Only limited scale proof in reviewed set
    - Optional diversification if economics work
    - Public customer proof much thinner than Germany
  notes: Customer segments are separated by buyer-user-payer structure because JobAuto and B2B materially change procurement logic.
