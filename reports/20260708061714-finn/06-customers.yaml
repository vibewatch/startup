  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention and churn metrics
    missingEvidence: NRR, GRR, gross churn, and realized average contract duration by segment.
    whyItMatters: Ratings and testimonials cannot replace cohort evidence when judging customer durability.
    diligencePath: Request monthly cohort tables for B2C, B2B, and JobAuto separately.
    relatedQuestionRefs:
    - QU011
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Revenue share by top customers, by fleet-size bucket, and by distribution channel.
    whyItMatters: Expansion can look attractive while still depending on a small number of large accounts or channels.
    diligencePath: Request top-10 customer revenue concentration and partner-sourced volume share.
    relatedQuestionRefs:
    - QU014
    - QU017
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: JobAuto channel conversion
    missingEvidence: Activation rate from partner channel to employer contract to employee subscription.
    whyItMatters: Named JobAuto proof exists, but channel efficiency remains unquantified.
    diligencePath: Request funnel data from Probonio-sourced leads through live subscriptions.
