chapter:
  number: 4
  title: Financials
  summary: FINNs public financial story is strong on funding milestones and still weak on audited operating detail. The reviewed evidence supports a fast-growing but capital-intensive subscription model funded through repeated equity rounds plus warehouse and ABS debt, with profitability hinging on residual values, funding costs, and disciplined fleet operations as much as on top-line ARR growth.
sections:
- id: revenue-model-and-disclosed-operating-base
  title: Revenue Model and the Limited Public Operating Baseline
  body: FINN monetizes access, not ownership. The official consumer and B2B pages describe a recurring monthly subscription that bundles insurance, registration, taxes, maintenance, and service while leaving fuel or charging to the customer. That framing makes ARR the most intuitive external shorthand, and the company has repeatedly used ARR rather than GAAP revenue in public releases. The strongest disclosed operating mix signal is the October 2023 B2B update, which said total ARR exceeded €160 million and that business subscriptions alone produced more than €72 million, or 45% of ARR. By June 2026 FINN said ARR was above €300 million with more than 50,000 subscriptions on the road. What is missing is as important as what is present. Public sources do not disclose recognized revenue, gross margin, depreciation policy, bad-debt profile, or subscriber-cohort retention. As a result, the financial baseline is directionally strong but not audit-grade.
  claimRefs:
  - CI001
  - CI002
  - CI010
  - CI018
  - CI030
  - CI031
  - CI032
  - CI034
