- id: TI004
  title: Profitability Path and Unit-Economics Driver Table
  columns:
  - Driver
  - Direction
  - Public evidence
  - Implication for margin
  - Diligence ask
  rows:
  - - OEM sourcing and new-car inventory
    - Positive
    - TechCrunch says ~97% new inventory sourced directly from OEMs
    - Can support better procurement and availability
    - Quantify procurement discounts and concentration by OEM
  - - Remarketing / resale outlet discipline
    - Positive if executed well
    - TechCrunch says vehicles are pre-brokered to retailers after subscription
    - Improves cash conversion and residual-value realization
    - Request realized versus planned resale values by cohort
  - - Residual-value volatility
    - Negative risk
    - KBRA says EV value declines moderated but remain structure-sensitive
    - Can compress returns and ABS coverage if resale weakens
    - Request residual assumptions by model and powertrain
  - - Funding cost / rate environment
    - Negative risk
    - ECB deposit facility 2.25% and main refi 2.40% in June 2026
    - Higher rates reduce pricing flexibility and debt spread
    - Map average cost of funds and hedging policy
  - - B2B mix and utilization stability
    - Potentially positive
    - B2B already 45% of ARR in late 2023
    - Could improve repeat demand and lower churn volatility
    - Request cohort gross profit and renewal rates by B2B segment
  - - Company-level profitability gap
    - Negative but improving if core product truly profitable
    - TechCrunch says core product profitable but company not yet profitable in early 2024
    - Overheads, losses on fleet, or funding costs may still absorb gross profit
    - Request bridge from unit profit to consolidated EBITDA / net income
  notes: Public evidence supports the direction of the margin logic but not its magnitude.
