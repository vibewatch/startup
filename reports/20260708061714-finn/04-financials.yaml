- id: TI006
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue
    - Needed to normalize valuation and growth
    - Not publicly disclosed
    - Prevents clean EV/revenue analysis
    - Request audited revenue by month and geography
  - - Gross margin / contribution margin
    - Shows whether unit economics are truly attractive
    - Not publicly disclosed
    - Core-product profitability claim cannot be verified
    - Request margin bridge from subscription fee to contribution profit
  - - Fleet depreciation assumptions
    - Central to residual-risk underwriting
    - Not publicly disclosed
    - Could materially change economics by powertrain
    - Request model-level depreciation and resale history
  - - Current drawn debt and covenants
    - Defines leverage and refinancing risk
    - Facility headlines only
    - Facility size may overstate liquidity or understate leverage risk
    - Request debt schedule, maturities, and covenant package
  - - Cohort retention / churn
    - Determines revenue quality beyond headline ARR
    - Not publicly disclosed
    - ARR may mask weak retention or expensive reacquisition
    - Request B2C and B2B cohort tables
  - - Cash balance / runway
    - Needed to assess next-round timing
    - Not publicly disclosed
    - Cannot judge near-term capital adequacy precisely
    - Request treasury runway model and budget
  notes: These gaps are the main reason public financial analysis can only be directional rather than fully underwritten.
