- id: TI005
  title: Pricing / Monetization Table
  columns:
  - Offer / channel
  - Public list pricing
  - Contract basis
  - What is included
  - What is not shown publicly
  rows:
  - - FINN consumer homepage
    - From €149/month plus €1,500 service fee
    - Vehicle-specific subscription listing
    - Insurance, registration, taxes, maintenance, service
    - Realized discounts, utilization, margin by model
  - - FINN B2B offer
    - Custom business subscription rather than clean list price
    - Employer / fleet contract
    - Admin portal and bundled fleet services
    - Realized B2B pricing curve and fleet discounts
  - - TechCrunch 2024 reporting lens
    - Popular models around €430 to €1,200 per month
    - Typically ~12-month subscriptions in report
    - Insurance, tax, technical inspection per article
    - Exact mapping to current official offer and maintenance scope
  - - Revenue recognition implication
    - List pricing is visible, realized pricing is not
    - Monthly service subscription
    - Shows monetization logic only
