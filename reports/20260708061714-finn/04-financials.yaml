- id: margin-logic-rates-and-residual-value-risk
  title: Margin Logic, Interest Rates, and Residual-Value Risk
  body: 'The reviewed evidence suggests that FINNs gross-margin logic depends on buying or financing vehicles efficiently, keeping them utilized, controlling service and damage costs, and exiting them at acceptable residual values after the subscription period. TechCrunchs 2024 reporting adds two helpful details: the company sourced most inventory directly from OEMs, and it had brokered resale outlets before vehicles rolled off subscription. That is exactly what an asset-heavy operator should do, because remarketing speed and realized residual value are critical to cash conversion. The risk side is equally clear. FINNs ABS structures are secured by the car fleet, so collateral performance matters. KBRAs March 2026 note says EV residual-value declines in Europe have moderated, but the agency still highlights sensitivity to collateral mix, jurisdiction, and structure. At the same time, ECB rates remained materially above zero in mid-2026, so funding cost is still a live margin variable rather
    than a rounding error.'
  claimRefs:
  - CI011
  - CI012
  - CI020
  - CI021
  - CI022
  - CI023
  - CI035
  - CI036
  tableRefs:
  - TI004
  figureRefs: []
- id: peer-multiples-and-path-to-profitability
  title: Public Comparable Multiples and the Path to Profitability
  body: 'Public comps do not support a simplistic high-growth-tech valuation lens for FINN. A July 2026 snapshot shows Carvana trading at a rough market-cap-to-revenue ratio around 3.3x, while Avis sits closer to 0.46x and Hertz near 0.08x. Those companies are not perfect peers, but that spread is precisely the point: asset-heavy mobility businesses are priced according to growth credibility, leverage, profitability, and capital-market confidence, not revenue alone. FINNs own 2026 valuation above €1 billion against ARR above €300 million implies a headline ratio above 3x, but ARR is not audited revenue and debt is essential to the model. Public evidence therefore supports only a conditional profitability path. Management said in early 2024 that the core product was profitable even though the overall company was not yet profitable. For that claim to mature into durable company-level earnings, FINN must keep financing costs contained, protect residual values, and convert B2B scale into lower
    servicing and utilization volatility.'
