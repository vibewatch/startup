    - ~0.46x
    - Mature rental / mobility operator multiple
    - Rental economics and corporate structure differ from FINN
  - - Hertz
    - $0.66B
    - $8.50B TTM
    - ~0.08x
    - Severely discounted asset-heavy mobility multiple
    - Distress and leverage history distort comparability
  - - FINN headline heuristic
    - '>€1B valuation'
    - '>€300M ARR'
    - '>3x valuation / ARR'
    - Closer to growth-style headline than rental-style multiple
    - ARR is not audited revenue and debt is material
  - - Sector takeaway
    - Wide spread across peers
    - Mixed
    - 0.08x to 3.29x in reviewed set
    - Multiples reflect growth, leverage, and confidence more than revenue alone
    - Any single-multiple valuation shortcut is unsafe
  notes: These ratios are simple market-cap-to-revenue heuristics using publicly visible July 2026 values and should not be confused with normalized EV/revenue multiples.
