  title: Public Comps Multiple Table
  columns:
  - Company
  - Market cap (Jul 2026)
  - Revenue basis
  - Implied market-cap / revenue
  - Interpretation
  - Why only directional for FINN
  rows:
  - - Carvana
    - $74.02B
