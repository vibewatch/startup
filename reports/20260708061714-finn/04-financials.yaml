- id: TI001
  title: Revenue Structure Table
  columns:
  - Revenue component
  - What public sources support
  - Best disclosed metric
  - Confidence
  - Gap / caveat
  rows:
  - - Consumer subscriptions
    - Recurring monthly fees from bundled car access
    - Customer-facing monthly price from €149 plus service fee
    - Medium
    - Public pages do not show revenue mix by vehicle class or cohort
  - - B2B / fleet subscriptions
    - Recurring monthly fees plus admin simplification for employers
    - '>€72M B2B ARR and 45% of ARR in late 2023'
    - Medium
    - No gross-margin or renewal-rate disclosure
  - - Included services bundle
    - Insurance, registration, taxes, maintenance, service
    - Bundle repeatedly described on official pages
    - High
    - External reporting in 2024 simplified maintenance treatment, creating scope ambiguity
  - - Excluded end-user cost
    - Fuel or charging outside fee
    - Official pages exclude fuel/charging
    - High
    - Ancillary fees and damage economics not publicly normalized
  - - Top-line shorthand
    - ARR rather than GAAP revenue
    - '>€160M ARR in 2023; >€300M ARR in 2026'
    - Medium
    - ARR is not audited revenue and may not map cleanly to recognized sales
  - - Gross margin / depreciation
    - Not disclosed directly
    - No public percentage
    - Low
    - Requires internal unit-economics pack and fleet-level depreciation schedule
  notes: Public sources are strongest on recurring-revenue direction and weakest on recognized revenue, gross margin, and cohort economics.
