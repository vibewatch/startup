  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited revenue and gross margin
    missingEvidence: A full P&L with recognized revenue, gross profit, depreciation, funding cost, and EBITDA bridge.
    whyItMatters: ARR alone cannot establish unit economics, profitability, or valuation quality.
    diligencePath: Request audited financial statements or lender materials with monthly P&L detail.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI021
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: fleet-level residual value assumptions
    missingEvidence: Residual-value curve, realized resale proceeds, and loss rates by make, model, and powertrain.
    whyItMatters: Residual-value outcomes are one of the biggest swing factors in an asset-backed subscription model.
    diligencePath: Request fleet remarketing reports and ABS collateral-performance packs.
    relatedQuestionRefs:
    - QI007
    - QI017
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: facility overlap and draw schedule
    missingEvidence: A lender-by-lender schedule showing current drawn balances, maturities, covenants, and overlap among ABS, warehouse, and leasing facilities.
    whyItMatters: Headline facility sizes do not reveal actual leverage or refinancing risk.
    diligencePath: Request treasury schedules and debt term sheets.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI002
