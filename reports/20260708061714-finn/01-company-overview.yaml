- id: milestones-partnerships-and-cautionary-signals
  title: Milestones, OEM Partnerships, and Cautionary Signals
  body: 'The milestone pattern shows FINN broadening from a D2C subscription startup into a multi-stakeholder mobility platform with B2B, OEM, and financing depth. By late 2023 the company said 45% of ARR already came from commercial subscriptions and that more than 80% of new B2B subscriptions were sold to existing customers, indicating genuine fleet traction rather than pure marketing volume. In 2024 and 2025, OEM and platform partnerships deepened through Toyota/KINTO, Hyundai, Stellantis, and BYD. Those releases matter because they demonstrate supply access, launch windows for new models, and progress toward electrification. Hyundai and BYD sources also restate the target of taking the EV share of the fleet above 80% by 2028. However, the chapter also needs the adverse side of the record. The February 2024 decision to pause the U.S. business shows management was willing to retreat from a capital-intensive expansion when returns or strategic fit looked weaker than the German core. Trustpilot
    and app-platform evidence points to a second cautionary signal: customers frequently praise convenience and digital onboarding, but some 2025 complaints cite delivery delays, support friction, and disputed end-of-term damage charges. Together, those signals suggest a company with real scale and capital-market credibility, but one whose operational edge must keep up with rapid fleet growth and more complex customer-service obligations.'
