callouts:
- calloutType: strength
  title: FINN has shown repeatable access to both venture and fleet-backed debt capital
  body: The strongest public proof of platform maturity is not just the unicorn valuation; it is the progression from Series A to Series D while simultaneously layering warehouse debt, ABS lines, and OEM framework deals. That mix is hard to replicate and suggests investors and lenders both believe FINN can keep placing vehicles at scale.
  claimRefs:
  - CO013
  - CO017
  - CO021
  - CO025
  - CO031
  - CO033
- calloutType: risk
  title: Governance opacity and service-issue complaints still temper confidence
  body: Public sources are strong on growth and financing, but weak on board structure, current cap-table detail, and customer-dispute resolution. The 2024 US pullback and 2025 review complaints about return charges show that fast growth still has real execution and governance edge cases.
  claimRefs:
  - CO010
  - CO024
  - CO039
  - CO040
