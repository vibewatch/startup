- id: financing-history-and-capital-stack
  title: Financing History, Valuation Progression, and Capital Stack
  body: FINN's capital story is unusually important because the business model requires both software execution and large fleet financing capacity. The official round chronology shows a €20 million Series A in December 2020, up to €500 million of debt in December 2021, a May 2022 Series B combining $110 million of equity with $720 million of debt commitments, a €100 million Series C in January 2024 at a valuation above €600 million, a February 2025 ABS II facility of up to €1 billion, and a June 2026 Series D with nearly €100 million of equity plus more than €40 million of debt at a valuation above €1 billion. Those milestones are corroborated by investor, media, and legal-advisor sources, not just company copy. The capital mix also evolved. Early releases emphasized venture backing from White Star, HV, UVC, Picus, Heartcore, Korelya, and later Planet First and Portage, but by 2023-2025 FINN was increasingly highlighting warehouse, ABS, and fleet-backed debt from Credit Suisse, Waterfall,
    Avellinia, Citi, and Jefferies. That matters for underwriting because financing availability is part of the product. At the same time, public sources do not disclose the full current dilution picture, liquidation preferences, covenant package, or exact overlap between warehouse, ABS, and leasing lines. The evidence supports strong access to capital; it does not eliminate balance-sheet complexity.
  claimRefs:
  - CO011
  - CO013
  - CO015
