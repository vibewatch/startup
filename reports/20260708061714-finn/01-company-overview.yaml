  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, voting rights, liquidation preferences, and lender covenants.
    whyItMatters: These documents determine real control, dilution risk, and downside protection for new investors.
    diligencePath: Request the current cap table, board deck, shareholder agreement summary, and debt term sheets from management.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A dated HR or finance-confirmed headcount by geography and function.
    whyItMatters: Public newsroom copy supports only a rough 300-plus employee marker and cannot support productivity analysis on its own.
    diligencePath: Request a current org chart and payroll headcount bridge by month.
    relatedQuestionRefs:
    - QO017
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: A reconciliation between active subscriptions, unique subscribers, churned accounts, and B2B vehicle seats.
    whyItMatters: Without it, growth and retention quality can be overstated by fleet-unit counts.
    diligencePath: Request cohort and unit-account bridges segmented by B2C and B2B.
    relatedQuestionRefs:
    - QO018
  - type: conflicting-data
    severity: minor
    topic: investor-gap
    missingEvidence: Primary documentation confirming or disproving BMW i Ventures and La Famiglia as current investors.
    whyItMatters: Investor-brand accuracy matters for market perception and could affect assumptions about OEM or network support.
    diligencePath: Confirm the current cap table directly with management and compare against legal closing documents for each round.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: A lender-by-lender schedule of ABS, warehouse, and leasing facilities with maturities and advance rates.
    whyItMatters: Fleet availability and equity efficiency depend on these terms, especially in stress cases.
    diligencePath: Request treasury materials or financing memoranda covering all active debt lines.
    relatedQuestionRefs:
    - QO011
    - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: TO005 milestone chronology is limited to public milestones
    missingEvidence: Private internal product launches, board decisions, and covenant amendments between public financing events.
    whyItMatters: The public chronology is sufficient for external diligence, but it may miss internal operating or governance inflection points.
    diligencePath: Request an internal company timeline or board materials to fill non-public milestone gaps.
    relatedTableRefs:
    - TO005
