  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构和真正的竞争者集合
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争修正是，FINN 面对的不只是少数创业公司同业。这个市场结构上很混杂。FINN 自身是数字化专营商，面向消费者和车队客户提供宽口径全包承诺。SIXT+
              代表租车巨头模式：可信品牌、密集网点、App，以及按月打包汽车使用权的能力。KINTO 体现 OEM 自有生态模式，服务商可以依靠主机厂库存和品牌金融逻辑。Ayvens
              带来租赁巨头视角，把灵活性定位为企业出行的延伸，而不是纯消费者创业产品。Flexcar 和 Autonomy 则显示美国市场更碎片化，切口更窄，例如按月便利或纯 EV 敞口。已审阅 Cluno
              证据也重要，因为它否定了一个常见捷径：在当前来源集中，Cluno 不是 FINN 拥有的资产，而是一个 2023 年转到 ViveLaCar 和 The Platform Group 旗下的平台。
