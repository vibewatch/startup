  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和现状替代品
        blocks:
          - type: paragraph
            body: >-
              FINN 的相关市场不是整个乘用车市场，也不是泛化的短租市场，而是更窄的经常性车辆使用权市场：买方为汽车使用权，以及保险、注册、维护、保养等打包运营服务支付一笔可预期月费。FINN 自己的消费者和 B2B
              页面通过强调便利、单一账单和打包行政服务，同时把燃油或充电排除在套餐外，清楚划出了这一边界。Deloitte
              的车辆即服务框架有用，因为它把订阅放在所有权或租赁的一端，与汽车共享或网约车的另一端之间。这意味着主要替代品是私人购车、雇主提供的公司车、传统租赁和灵活租车产品。这个边界会影响估值：可服务支出来自经常性使用权和服务利润，而不是终端用户购买车辆的完整标价。
