      - number: '1.4'
        title: 里程碑、OEM 合作和警示信号
        blocks:
          - type: paragraph
            body: >-
              里程碑模式显示，FINN 正从 D2C 订阅创业公司扩展为一个兼具 B2B、OEM 和融资深度的多方出行平台。到 2023 年底，公司称 45% ARR 已来自商业订阅，且超过 80% 的新增 B2B
              订阅卖给既有客户，说明车队牵引是真实的，不只是营销规模。2024 和 2025 年，Toyota/KINTO、Hyundai、Stellantis 和 BYD 等 OEM
              与平台合作继续加深。这些公告重要，因为它们证明了供给获取、新车型上线窗口和电动化进展。Hyundai 与 BYD 来源也重申，到 2028 年把车队 EV 占比提升到 80%
              以上的目标。不过，本章也必须纳入负面记录。2024 年 2 月暂停美国业务的决定显示，当回报或战略契合度弱于德国核心市场时，管理层愿意撤出资本密集型扩张。Trustpilot
              和应用平台证据给出第二个警示：客户常称赞便利和数字化下单体验，但部分 2025 年投诉提到交付延迟、支持摩擦以及期末车辆损伤收费争议。合起来看，FINN
              确有规模和资本市场信用，但运营锋利度必须跟上快速扩张的车队和更复杂的客户服务义务。
