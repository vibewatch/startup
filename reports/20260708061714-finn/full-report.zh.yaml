  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型和有限的公开经营基线
        blocks:
          - type: paragraph
            body: >-
              FINN 变现的是使用权，不是所有权。官方消费者和 B2B 页面描述的是经常性月度订阅，保险、注册、税费、维护和服务打包在内，燃油或充电由客户承担。这个框架让 ARR
              成为最直观的外部速记指标，公司在公开公告中也反复使用 ARR，而不是 GAAP 收入。最强的已披露运营组合信号来自 2023 年 10 月 B2B 更新：总 ARR 超过 €160
              million，企业订阅单独贡献超过 €72 million，即 ARR 的 45%。到 2026 年 6 月，FINN 称 ARR 超过 €300 million，在路订阅超过 50,000
              单。缺失的信息和已有信息同样重要。公开来源没有披露确认收入、毛利率、折旧政策、坏账情况或订阅用户队列留存。因此，财务基线方向上很强，但还不到审计级。
