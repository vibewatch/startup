      - number: '7.4'
        title: 人员、重组和打破投资假设的触发点
        blocks:
          - type: paragraph
            body: >-
              执行风险较高，因为 FINN 同时在多个前线扩张。公司追求更多车队资本、更高 EV 比例、更多 B2B 扩张和更广平台野心，同时仍需在客户层面保持运营一致性。公开记录显示，在这轮推进中管理层有重要变化：CFO
              兼联合创始人 Max Beyer 于 2024 年底离任，Jan Hansen 在 2024 年晋升，统一 B2B 和 B2C 增长运营。这些调整可以理解，但也说明领导架构仍在演化。Munich Startups
              对 2026
              年融资的报道在这一点上很有启发：即使达到独角兽规模，公司仍把新资本描述为车队、技术和运营基础设施的燃料，盈利性增长仍是正在推进的目标，而不是已确定的结果。这种同步挑战本身就是可监控投资风险。最先打破投资假设的情形，是融资可得性减弱、服务质量恶化、合规收紧快于流程成熟，或高管带宽无法让系统保持同步。
