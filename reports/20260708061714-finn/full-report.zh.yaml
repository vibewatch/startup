      - number: '2.2'
        title: 规模测算视角、地理范围和市场成熟度
        blocks:
          - type: paragraph
            body: >-
              公开市场数据表明，相比主流汽车金融，这是一个增长很快但规模仍不大的品类。IMARC 估算 2025 年全球汽车订阅市场为 USD 6.27 billion，并预测 2034 年达到 USD 24.10
              billion；欧洲以 41.9% 占最大区域份额。美国今天规模较小，为 USD 1.7 billion，但也预计以十几个百分点的中段速度复合增长。这些数字有助于判断品类规模方向，但它们是宽口径 TAM，不是
              FINN 真正可服务市场。德国仍是有吸引力的锚点区域：欧洲引领这一品类，德国又有深厚的车队、租赁和 OEM 生态；不过整体乘用车背景并不繁荣。VDA 预计 2026 年德国和欧洲注册量只会温和增长，PwC 与
              Platform Executive 也都指出成熟市场承受负担能力压力。这种组合反而支撑 FINN 的价值主张：即便更广义汽车周期低迷，订阅也可以增长，因为它把灵活性卖给一个持有成本昂贵的环境。
