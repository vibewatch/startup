      - number: '2.4'
        title: 增长驱动、约束和监管时点
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动因素是灵活性、打包后的成本透明、数字化下单，以及不承担长期残值敞口的电动化。分析师来源反复把订阅描述为一种方式，消费者和企业都可借此试用
              EV、避免长期融资承诺，并在工作模式或用车需求变化时保留出行选择。但同一批来源也说明为什么品类难以规模化。负担能力仍是真约束，因为成熟市场车价高，许多 EV
              仍有溢价。充电基础设施和政策清晰度也很关键，尤其是考虑高 EV 配比的车队买家。监管又增加一层复杂性。在欧洲，远程服务和消费者权利规则塑造披露和合同要求；在美国，近期 FTC
              诉讼和规则撤回显示汽车商业监管会变化。因此，FINN 自己在 2024 年暂停美国业务，是有意义的负面证据：有吸引力的需求叙事并不能消除资本密集度、监管碎片化或地域执行风险。
