  - id: TR004
    title: 人员 / 执行风险台账
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施 / 尽调路径
    rows:
      - - 财务领导层
        - CFO 联合创始人离职；COO 临时覆盖
        - 中
        - 高
