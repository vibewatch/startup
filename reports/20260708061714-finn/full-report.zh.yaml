  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑证据
      - 哪些情况会改变判断
    rows:
      - - 投资逻辑：FINN 有真实规模和融资通道
        - '>€300M ARR、>50k 订阅、独角兽轮次、B2B 动能'
        - 若队列盈利能力和现金转化得到验证，可上调判断
      - - 反向逻辑：当前价格已计入太多
        - '>3.3x 估值 / ARR 粗算，且缺少经审计的收入细节'
        - 若债务、残值或服务指标走弱，应下调判断
      - - 结构性谨慎：债务是核心
        - ABS、仓储融资和全债务车辆融资是增长核心
        - 只有杠杆、契约和再融资风险透明可控，判断才会改善
      - - 可选上行：B2B 可增强韧性
        - 企业客户数和存量客户扩张支撑一定黏性
        - 若流失和集中度数据验证账户质量，判断可加强
    notes: 反向逻辑由估值驱动，并不是说 FINN 没有产品市场匹配。
    claimRefs:
      - CV016
      - CV026
      - CV027
      - CV028
      - CV031
      - CV034
      - CV035
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 增长保持强劲，残值企稳，管理层用更清晰披露证明增长能赚钱
        - ~€1.2B-€1.5B 区间；上行需要接近溢价水平的执行证明
        - 债务仍可管理；服务问题得到控制
        - 可能成立，但需要尚未公开的证据
      - - 基准
        - 增长延续，但债务、服务和再营销风险仍然不低
        - ~€0.75B-€1.05B 区间；接近当前公开估值，上行有限
        - 没有更好披露，倍数难以明显扩张
        - 与当前证据最一致
      - - 悲观
        - 残值或融资成本恶化，运营表现不及预期
        - ~€0.3B-€0.6B 区间；倍数向资产重的低端可比公司压缩
        - 资本通道和客户摩擦比增长叙事更重要
        - 若宏观和执行同步走弱，下行真实存在
    notes: 情景区间是启发式判断，使用公开可比公司锚点和基于 ARR 的判断，并非完整 DCF。
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标基础
      - 倍数 / 估值
      - 相关性
      - 局限
    rows:
      - - FINN 公开口径粗算
        - '>€1B 估值 / >€300M ARR'
        - '>3.3x 估值 / ARR'
        - 直接对应当前定价背景
        - ARR 不是经审计收入，且债务是核心
      - - Uber
        - 2026 年 7 月市值 / TTM 收入
        - ~2.82x
        - 已规模化出行平台，受公开市场估值纪律约束
        - 市场撮合模式比 FINN 更轻资产
      - - Lyft
        - 2026 年 7 月市值 / TTM 收入
        - ~0.90x
        - 展示公开市场如何惩罚盈利信心不足
        - 单一国家平台，经济模型不同
      - - Grab
        - 2026 年 7 月市值 / TTM 收入
        - ~4.53x
        - 公开出行公司高端倍数，增长叙事仍在
        - 多垂类超级应用，不是车队重的订阅运营商
      - - Carvana
        - 2026 年 7 月市值 / TTM 收入
        - ~3.29x
        - 高增长公开汽车电商参照
        - 库存和融资结构不同
      - - Avis Budget Group
        - 2026 年 7 月市值 / TTM 收入
        - ~0.46x
        - 资产重出行业务的下行锚点
        - 成熟租车公司，不是风险投资式增长运营商
      - - Hertz
        - 2026 年 7 月市值 / TTM 收入
        - ~0.08x
        - 困境型资产重业务的下行锚点
        - 困境历史会明显扭曲倍数
    notes: 没有公开上市的纯 FINN 对标公司，因此表中混合了平台、汽车电商和租车参照。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV021
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-relevant public mobility comps reviewed for FINN, but not every listed transport
        or leasing company.
  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 门槛
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 债务市场通道走弱
        - ABS / 仓储融资增长停滞，或再融资成本跳升
        - 车队扩张受资本约束，增长叙事破裂
        - 转向悲观情景
      - - 残值恶化
        - 实际转售价值明显低于投资测算假设
        - 利润率下降、抵押品表现走弱，股权价值随之下滑
        - 下调估值区间
      - - 服务质量恶化
        - 投诉或解决指标恶化
        - B2B 韧性和品牌论点走弱
        - 加执行折扣
      - - 披露仍然稀薄
        - 没有经审计的收入质量或队列经济证据出现
        - 类上市公司溢价仍缺少支撑
        - 维持观察，而不是买入
      - - 领导层 / 管控滑坡
        - 财务或运营管控跟不上规模
        - 面向后期或公开市场投资人的叙事更难站住
        - 推迟投资测算，或降低入场价格
    notes: 这些触发项之所以被选中，是因为它们能直接压缩倍数支撑或股权价值。
    claimRefs:
      - CV017
      - CV023
      - CV033
      - CV037
      - CV039
      - CV041
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 从 ARR、递延收入和队列结构到已确认收入的桥表
        - 决定公开市场倍数比较是否至少方向上公平
        - 财务尽调 + 会计复核
      - - 车队现金转化
        - 按队列拆分的实际残值、再营销时间和利用率
        - 决定扣除债务服务后，股权能否复利增长
        - 车队 / 融资尽调
      - - 资本结构
        - 债务契约、抵押品测试、优先股堆叠和到期阶梯
        - 改变真实股权价值与公开估值之间的关系
        - 法律 + 融资尽调
      - - 客户韧性
        - 流失、NRR、集中度、合同期限和 B2B 队列表现
        - 决定增长是否足够持久，能支撑溢价定价
        - 商业尽调
      - - 服务经济性
        - 支持成本、损坏成本、退车摩擦和投诉解决趋势
        - 检验运营强度是否封住利润率扩张
        - 运营尽调
    notes: 这些请求按其对当前价格下投资判断的直接影响排序。
    claimRefs:
      - CV030
      - CV038
      - CV040
      - CV041
