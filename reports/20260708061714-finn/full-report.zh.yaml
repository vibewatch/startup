      - number: '8.2'
        title: 公开可比区间和情景逻辑
        blocks:
          - type: paragraph
            body: >-
              公开可比集合说明，估值需要一个宽区间，而不是单点估算。2026 年 7 月，按简单市值 / 收入启发式，Uber 约 2.8x，Lyft 约 0.9x，Grab 约 4.5x，Carvana 约
              3.3x，Avis 约 0.46x，Hertz 约 0.08x。这种分散不是噪音；它反映了增长耐久性、盈利能力、杠杆、资产所有权和投资者信心的巨大差异。FINN
              介于其中几个类别之间。它比传统租车运营商有更强的头条增长，但也比平台型出行业务更资产重，因为它直接承担车队融资和残值风险。因此，FINN 当前 >3.3x 的估值 / ARR
              启发式，只有在牛市或强基准情形下才站得住。若债务、再营销或服务指标走弱，熊市情形很容易想象；而上行情形需要仍处私域的运营证明。这就是为什么基准情形的权重，比头条融资本身显示的更高。
