  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前定价背景，以及为什么估值纪律重要
        blocks:
          - type: paragraph
            body: >-
              2026 年融资给了 FINN 一个清晰的公开头条：估值超过 €1 billion，ARR 超过 €300 million，在路订阅超过 50,000 单。这是有意义的规模，且相比 2024 年 Series C
              超过 €600 million 的估值进一步上台阶，说明投资人看到了真实增长。但同一证据集也要求估值纪律。模型仍依赖债务支持的车队融资，公开材料仍强调 ARR
              而非审计收入，管理层自己的叙事仍围绕高效或盈利性增长，而不是一个已经完成的盈利故事。这组因素意味着，价格应按风险调整后的出行倍数来判断，而不是纯软件倍数。换句话说，核心问题不是 FINN
              是否亮眼，而是当前头条估值是否已经在关键运营未知数解决前，吸收了大部分公开上行。
