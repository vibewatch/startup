          - type: paragraph
            body: >-
              已审阅来源显示，FINN 服务多个客户群，买方、使用者和付款方结构各不相同。最简单的细分是零售消费者：用户直接选择并支付汽车订阅。企业订阅更复杂，因为车队经理、采购、财务或 HR
              可能审批和付款，而员工使用车辆。JobAuto 加入第三种结构：雇主提供福利通道，但员工通过薪资转换承担大部分订阅费用。这很重要，因为它让 FINN
              从纯消费者产品变成基于渠道的企业出行产品。公开证据还显示，最强的具名客户证明仍以德国为中心。业务增长公告、Probonio
              材料和大多数评价页面都与德国相关；已审阅材料中的美国证据更薄，且呈现出更难规模化的特点。因此，FINN 看起来是一个广泛但仍由德国牵引的客户平台，而不是均衡的跨大西洋业务版图。
