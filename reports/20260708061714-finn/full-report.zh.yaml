      - number: '3.4'
        title: 护城河耐久性和负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              竞争图谱的负面一面是，核心功能集已不稀缺。Deloitte 的框架解释了原因：早期进入者可能积累品牌和学习优势，但一旦在位者调动资本、车辆供给和渠道关系，仍然可以赢。这一风险直接出现在已审阅竞品页面上。SIXT
              和 Flexcar 都营销随时取消和换车灵活性；KINTO 和 Ayvens 可以把灵活用车变成自有金融或租赁经济的延伸；Autonomy 则使用更窄的 EV 切口。换句话说，FINN
              的护城河不能只靠“全包、灵活”这句话，因为多个对手现在也在说类似的话。更强的护城河候选项是车队融资、OEM
              配车、企业车队工作流和运营执行。即便如此，公开证据仍不完整。没有可靠的跨公司公开数据披露流失率、利用率、换车频率、CAC
              或按车辆队列划分的利润率。因此，本章可以有信心识别竞争压力，但仅凭公开材料还不能宣布谁是可持续赢家。
