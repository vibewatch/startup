chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品模型和当前规模
        blocks:
          - type: paragraph
            body: >-
              FINN 更应被理解为一家资产重、但由软件牵引的汽车订阅平台，而不是传统经销商或租赁经纪。官方面向消费者和 B2B
              的页面反复说明，客户支付固定月费，保险、注册、税费、维护和服务都打包在内，只需另付燃油或充电费用。当前德国消费者页显示，订阅起价为每月 €149，另收一次性 €1,500 服务费，通常从 6 个月起订；OEM
              合作公告则显示，不少车型周期为 6 到 24 个月。这个产品逻辑很关键：FINN
              卖的是便利、交付速度和可预期运营成本，而不是所有权。公司也把同一核心主张用于企业车队，集中门户和客户支持可以为雇主减少行政工作。公开规模指标显示 FINN 已明显越过早期创业阶段：2026 年 6 月
              Series D 公告称，FINN 在路订阅超过 50,000 单，ARR 超过 €300 million；新闻室首页则称公司是德国领先的汽车订阅服务商，员工超过 300
              人。证据支持平台规模，但没有把活跃订阅用户和活跃订阅车辆拆开，因此客户数精度仍需管理层确认。
