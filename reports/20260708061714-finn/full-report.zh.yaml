      - number: '4.3'
        title: 利润率逻辑、利率和残值风险
        blocks:
          - type: paragraph
            body: >-
              已审阅证据显示，FINN 的毛利逻辑取决于能否高效采购或融资车辆、保持车辆利用率、控制服务和损伤成本，并在订阅期后以可接受残值退出。TechCrunch 2024 年报道补充了两个有用细节：公司大部分库存直接来自
              OEM，并且在车辆退出订阅前已安排经纪转售渠道。这正是资产重运营商该做的事，因为再营销速度和实际残值对现金转换至关重要。风险面同样清楚。FINN 的 ABS 结构由车队担保，因此抵押品表现很关键。KBRA
              2026 年 3 月说明指出，欧洲 EV 残值下降已有所放缓，但该机构仍强调结果对抵押品组合、司法辖区和结构敏感。与此同时，ECB 利率在 2026
              年中仍明显高于零，所以融资成本仍是实时影响利润率的变量，不是四舍五入误差。
