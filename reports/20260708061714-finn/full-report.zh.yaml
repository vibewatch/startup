      - number: '2.3'
        title: 买方分层、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，汽车订阅市场并非纯由消费者驱动。IMARC 估算，企业用户已是全球最大的终端使用细分；FINN 自身披露也支持这个逻辑：到 2023 年底，公司称 B2B 订阅贡献 45% ARR，服务超过
              2,500 家企业客户。个人用户方面，甜蜜点似乎是城市专业人士和更年轻家庭，他们更想获得使用权而非所有权，尤其在通勤模式不稳定时。BearingPoint
              增加了一个重要行为细节：此前用过订阅式租赁的人对该模式明显更开放，意味着试用和车队接触可以加速需求。企业侧，买方、使用者和付款方往往不同。HR、采购、财务或车队经理可能控制预算，而员工或外勤团队使用车辆。这种分离利好能够减少行政工作、简化账单，并让公司无需直接承担残值风险即可快速调整车队规模的产品。
