  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资产支持模型、融资成本和残值风险
        blocks:
          - type: paragraph
            body: >-
              FINN 的公开材料几乎没有留下疑问：这是资产重运营模型。公司卖的是数字订阅体验，但底层服务仍需要大量、持续融资的车辆库存。公开时间线——Series C、Avellinia、ABS II，再到仍包含新债务的
              Series
              D——显示增长在结构上绑定车队资本，而不只是软件效率。这很重要，因为即使一线需求强劲，资本市场准入一旦收紧，增长也会卡住。第二层风险是资产表现。残值、利用率和再营销纪律决定融资车辆能否按正确节奏转回现金。KBRA
              2026 年 3 月说明在方向上让人安心，因为 EV 残值下降已有所放缓，但也强调结果仍对结构敏感。欧元利率仍高于零时，融资成本和退出价值风险仍是利润率和偿付能力的核心驱动，而不是背景变量。
