            body: >-
              FINN 的融资路径清楚表明，公司不是纯软件平台。公司 2020 年以传统风险股权起步，但到 2021 年管理层已开始强调用债务能力支持车队。2021 年 12 月最高 €500 million
              债务工具、2022 年 5 月 Series B 加 $720 million 债务承诺、2023 年 7 月 Avellinia 追加把预付率提到 100%、2025 年 2 月最高 €1 billion
              ABS II，都指向同一个方向：车队可得性离不开融资市场准入。2026 年 6 月 Series D
              又叠加了一层，在独角兽估值下把新股权和更多债务结合起来。这很重要，因为公开头条融资成功可能掩盖资产负债表复杂性。ABS、仓储和租赁项目下的债务额度可能重叠或摊还，不能天真地加总成当前未偿余额。但战略信息很明确——FINN
              已经把车队融资本身做成了产品的一部分。
