      - number: '8.4'
        title: 退出准备度和最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              最后的估值问题，不只是 FINN 理论上值多少钱，而是什么证据能让投资者有信心承销这一价值。公开材料在 ARR
              与股权价值之间最重要的桥上仍很薄：收入确认质量、实际车队现金转换、残值表现相对承销假设、债务契约、客户集中度和正常化服务成本强度。这些缺口很关键，因为它们直接决定股权能否从 2026
              年融资继续复利，还是会被公开市场式倍数压缩主导。因此，退出准备度并不完整。FINN 具备未来大型出行平台的叙事要素，但还没有足以轻松支撑 IPO 式或后期 crossover
              估值的公开披露质量。可执行结论是，把尽调集中到少数最直接决定今日头条价格是合理、很满还是过高的指标上。
