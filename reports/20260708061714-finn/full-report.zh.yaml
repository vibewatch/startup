      - number: '7.3'
        title: 运营摩擦和伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              已审阅材料中最强负面证据不是战略问题，而是运营问题。Trustpilot
              上反复出现关于交付质量、注册处理、支持响应延迟、意外收费，以及客户尝试延长或退出订阅时摩擦的投诉。这些个案不能证明服务大面积失败，但确实符合底层模型：FINN
              位于一条高接触链条中心，横跨车辆采购、物流、注册、维修保养、保险接口和返还。任何一个交接点失败，客户都会把整个系统体验为 FINN 的失败。伙伴依赖会放大该风险。TechCrunch 称大部分库存直接来自
              OEM；E.ON 公告显示 EV 转换部分依赖充电赋能；JobAuto 则依赖福利和门户伙伴扩展到 B2B 渠道。FINN 有真实缓释手段——OEM
              关系、预先安排的转售和伙伴分发——但这些关系本身也是集中点，需要持续执行纪律。
