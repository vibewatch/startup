  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和核心工作流
        blocks:
          - type: paragraph
            body: >-
              FINN 提供的是打包汽车订阅服务，不是纯软件应用。面向客户的产品从网页或 App 开始，用户选择车辆、选择期限，并完成无纸化下单流程。应用商店描述把流程压缩成四步：找车、在线订阅、收车，然后开车，由 FINN
              处理行政事务。核心承诺是，公司拿掉通常伴随所有权、租赁和文书工作的复杂性。已审阅移动端列表和 Toyota
              合作公告还显示，交付本身就是产品的一部分：客户可在几分钟内下单，并在家里或办公室收车。因此，建模时应把产品看作软件赋能的服务工作流，背后有真实运营履约。它不只是平台撮合模式，也不只是移动 App。
