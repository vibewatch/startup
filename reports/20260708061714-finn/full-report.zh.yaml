companyProfile:
  summary: >-
    FINN 是一家 2019 年创立、总部位于慕尼黑的汽车订阅平台，出售的是打包后的车辆使用权，而不是所有权。公开来源支持其面向消费者和企业车队的数字化全包月费产品，也支持公司反复拿到风险资本和资产支持资本，并在 2026
    年达到独角兽估值；但这些材料还没有给出足够的审计财务细节，不能把 FINN 当作透明的公开股票故事来处理。
