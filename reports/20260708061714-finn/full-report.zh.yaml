  - id: TI004
    title: 盈利路径与单元经济驱动表
    columns:
      - 驱动因素
      - 方向
      - 公开证据
      - 利润率影响
      - 尽调要求
    rows:
      - - OEM 采购与新车库存
        - 正向
        - TechCrunch 称，约 97% 的新车库存直接来自 OEM
        - 能改善采购条件和供给可得性
        - 按 OEM 量化采购折扣和集中度
      - - 二手车再营销 / 转售渠道纪律
        - 执行到位则正向
        - TechCrunch 称，车辆在订阅结束后会预先安排转售给零售商
        - 改善现金回收和残值变现
        - 按队列索取实际转售价格与计划转售价格对比
      - - 残值波动
        - 负向风险
        - KBRA 称，EV 价值跌幅已有缓和，但仍受结构影响
        - 转售走弱时，回报和 ABS 覆盖可能被压缩
        - 按车型和动力总成索取残值假设
      - - 资金成本 / 利率环境
        - 负向风险
        - 2026 年 6 月，ECB 存款便利利率为 2.25%，主要再融资利率为 2.40%
        - 利率走高会压缩定价弹性和债务利差
        - 梳理平均资金成本和对冲政策
      - - B2B 占比与利用率稳定性
        - 潜在正向
        - 2023 年末，B2B 已占 ARR 的 45%
        - 可能提高复购需求，并降低流失波动
        - 按 B2B 细分客群索取队列毛利和续约率
      - - 公司层面盈利缺口
        - 负向，但若核心产品确实盈利则改善
        - TechCrunch 称，2024 年初核心产品已盈利，但公司尚未盈利
        - 管理费用、车队亏损或资金成本仍可能吃掉毛利
        - 索取从单车利润到合并 EBITDA / 净利润的桥接表
    notes: 公开证据支持利润率逻辑的方向，但无法证明量级。
