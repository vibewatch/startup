      - number: '3.2'
        title: 功能、合同和包装对比
        blocks:
          - type: paragraph
            body: >-
              表面看，这个品类已经高度商品化，因为许多服务商都承诺不同组合的全包价格、打包维护、短承诺期和数字化预订。但细节仍然关键。FINN 打包经典运营服务，并靠门户式行政功能支持企业用户。SIXT+
              强调随时取消的灵活性、网点取车、里程调整和可选保障，但也披露注册费，并按车辆类别分配而非保证具体车型。KINTO 的条款因市场而异：泛欧页面强调一个月通知期和固定费用便利，荷兰页面突出无 BKR 登记和 3 到
              9 个月最低期限，瑞典页面使用滚动 30 天周期。Ayvens 明显以企业为先，把产品定位成带预定义服务的短期租赁。Flexcar 的反所有权表达最尖锐；Autonomy
              则要求用户自行购买保险，打破了全包模板。结果是核心功能有显著重叠，但期限刚性、打包深度和目标用户存在不小差异。
