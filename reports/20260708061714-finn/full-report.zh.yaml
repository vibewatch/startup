      - CR028
      - CR035
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最大风险不是沿单一技术故障传导，而是穿过利润率、流动性和客户留存。
    data:
      nodes:
        - id: rates
          label: ECB 利率
        - id: debt
          label: ABS / 债务栈
        - id: fleet
          label: 车队库存
        - id: residual
          label: 残值
        - id: ops
          label: 服务运营
        - id: margin
          label: 毛利率
        - id: liquidity
          label: 流动性 / 增长能力
        - id: retention
          label: 留存 / 品牌
        - id: valuation
          label: 估值支撑
      edges:
        - from: rates
          to: debt
          label: 抬高其成本
        - from: debt
          to: fleet
          label: 提供资金
        - from: fleet
          to: residual
          label: 带来退出敞口
        - from: residual
          to: margin
          label: 压缩
        - from: margin
          to: liquidity
          label: 降低
        - from: ops
          to: retention
          label: 塑造
        - from: retention
          to: valuation
          label: 支撑
        - from: liquidity
          to: valuation
          label: 约束
        - from: ops
          to: margin
          label: 给其增加支持和物流成本
    claimRefs:
      - CR008
      - CR010
      - CR012
      - CR028
      - CR030
      - CR032
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: FINN 依赖融资、供给、充电和渠道合作伙伴，这些环节都会影响客户体验。
    data:
      nodes:
        - id: oem
          label: OEM
        - id: financiers
          label: 债务 / ABS 合作伙伴
        - id: charging
          label: E.ON / 充电
        - id: jobauto
          label: JobAuto 合作伙伴
        - id: finn
          label: FINN 平台
        - id: customer
          label: 订阅用户
        - id: resale
          label: 二手处置渠道
      edges:
        - from: financiers
          to: finn
          label: 为其车队增长提供资金
        - from: oem
          to: finn
          label: 向其供应库存
        - from: charging
          to: finn
          label: 支持其 EV 转型
        - from: jobauto
          to: finn
          label: 向其分发 B2B 需求
        - from: finn
          to: customer
          label: 服务
        - from: customer
          to: resale
          label: 把车辆退回
        - from: resale
          to: financiers
          label: 影响其担保品结果
    claimRefs:
      - CR005
      - CR013
      - CR014
      - CR016
      - CR036
      - CR041
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 推荐结论来自真实规模，但披露缺口和风险加权后的估值纪律抵消了部分吸引力。
    data:
      nodes:
        - id: scale
          label: 规模：>€300M ARR / 50k+ 订阅
        - id: debt
          label: 债务支持的车队模式
        - id: gaps
          label: 收入与利润率缺口
        - id: comps
          label: 上市可比公司区间
        - id: rec
          label: 跟踪建议
      edges:
        - from: scale
          to: rec
          label: 支撑观察名单
        - from: debt
          to: rec
          label: 抬高风险
        - from: gaps
          to: rec
          label: 限制信心
        - from: comps
          to: rec
          label: 锚定价格纪律
    claimRefs:
      - CV005
      - CV016
      - CV031
      - CV032
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 简单的 ARR 敏感性显示，倍数小幅变化就会让披露估值快速变化。
    data:
      items:
        - label: 2.0x ARR
          value: 600
        - label: 2.5x ARR
          value: 750
        - label: 3.0x ARR
          value: 900
        - label: 3.5x ARR
          value: 1050
        - label: 4.0x ARR
          value: 1200
        - label: 5.0x ARR
          value: 1500
    claimRefs:
      - CV006
      - CV014
      - CV035
      - CV036
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 合理区间很宽，因为公开记录还未证明 FINN 在出行倍数中应落在哪个位置。
    data:
      items:
        - label: 悲观
          low: 300
          high: 600
          unit: EUR M
        - label: 基准
          low: 750
          high: 1050
          unit: EUR M
        - label: 乐观
          low: 1200
          high: 1500
          unit: EUR M
    claimRefs:
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 评分卡在规模上最强，在证据质量和风险调整后估值支撑上最弱。
    data:
      items:
        - label: 市场验证
          value: 7
          unit: /10
          sub: Large mobility demand and scale claims
          claimRefs:
            - CV026
        - label: 客户验证
          value: 6
          unit: /10
          sub: B2B momentum visible but incomplete
          claimRefs:
            - CV028
            - CV029
        - label: 经济性可见度
          value: 3
          unit: /10
          sub: ARR public, margins private
          claimRefs:
            - CV030
            - CV032
        - label: 风险负荷
          value: 3
          unit: /10
          sub: High capital and execution risk
          claimRefs:
            - CV033
        - label: 估值支撑
          value: 4
          unit: /10
          sub: Current price looks full on public evidence
          claimRefs:
            - CV034
        - label: 证据质量
          value: 4
          unit: /10
          sub: Useful but not buy-grade
          claimRefs:
            - CV032
            - CV040
    claimRefs:
      - CV026
      - CV029
      - CV030
      - CV032
      - CV033
      - CV034
      - CV040
