      - number: '3.3'
        title: 分发能力、供给获取和 B2B 定位
        blocks:
          - type: paragraph
            body: >-
              这个市场里的竞争力，更多由谁能拿到车、融到资、反复服务车队决定，而不是 UI 打磨。SIXT 宣称在美国拥有 80 多个网点和长期运营历史，这会转化为信任和线下分发。KINTO 和 Ayvens
              的优势不同：它们嵌在 OEM 或租赁生态中，可以把灵活订阅做成更广车辆金融组合的一部分。Flexcar 和 Autonomy 是更聚焦的挑战者，但在已审阅材料中，它们没有展示同等广度的多市场车队关系。FINN
              最强的公开对冲筹码，是自身运营规模和 B2B 牵引。公开材料称在路订阅超过 50,000 单，且 B2B 在 2023 年底已贡献 45% ARR。这不能证明领导地位牢不可破，但说明 FINN
              的竞争实质超过一款小众 App。对公司车替代和企业使用场景而言，B2B 门户深度、车队管理和融资可得性，与消费者营销同样重要。
