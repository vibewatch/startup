      - - 商业化组织
        - B2B 和 B2C 并入同一个增长负责人组织
        - 中
        - 中
        - 跟踪重组期间服务指标，并确认责任边界清晰
      - - 支持和服务运营
        - 公开投诉载体提到交接和响应问题
        - 中
        - 中
