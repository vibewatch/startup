  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 车队融资可得性
        - ABS 或仓储额度扩张明显放慢，或契约收紧
        - 新增车队增长连续两个季度受限
        - 重定投资测算，或暂停以增长驱动的估值假设
      - - 残值
        - 实际转售价值低于计划，足以压低债务覆盖
        - 队列层面的转售表现持续低于投资测算假设
        - 将情景转向悲观，并要求资产级数据
      - - 客服质量
        - 投诉、退车争议或支持延迟上升，且解决速度没有加快
        - 投诉率、CSAT 或拒付指标明显恶化
        - 假设 CAC 拖累更大，留存韧性更弱
      - - 合规与营销
        - 消费者保护法或环保宣传证明缺口浮出水面
        - 监管问询、被迫修改文案，或合同争议反复出现
        - 为扩张情景做投资测算前，要求公司给出法律整改方案
      - - 领导层与执行
        - 财务或运营人员流动拖慢管控成熟度
        - 报告缺失、重组稳定延后，或 KPI 下滑
        - 提高执行折扣，避免按高溢价倍数假设
    notes: 公开记录缺少经审计的损失率披露，因此终止标准被设为可监测的经营或融资事件。
