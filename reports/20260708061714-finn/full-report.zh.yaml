            body: >-
              最强采用数字仍来自公司自报，但确实显示增长跨了台阶。FINN 披露 2024 年初有 25,000 个活跃订阅，到 2026 年 6 月在路订阅超过 50,000 单。B2B 侧，公司称 2023 年底服务超过
