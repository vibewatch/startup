            body: >-
              公开可比公司并不支持用简单的高增长科技估值框架看 FINN。2026 年 7 月快照显示，Carvana 的市值 / 收入粗略比率约为 3.3x，Avis 接近 0.46x，Hertz 约
              0.08x。这些公司不是完美同业，但价差正说明问题：资产重的出行业务按增长可信度、杠杆、盈利能力和资本市场信心定价，不只看收入。FINN 自身 2026 年估值超过 €1 billion，ARR 超过 €300
              million，隐含头条比率高于 3x；但 ARR 不是审计收入，债务对模型不可或缺。因此，公开证据只能支持一条有条件的盈利路径。管理层在 2024
              年初称核心产品已盈利，尽管整体公司尚未盈利。要把这一说法兑现为可持续的公司层面利润，FINN 必须控制融资成本、守住残值，并把 B2B 规模转化为更低的服务成本和利用率波动。
