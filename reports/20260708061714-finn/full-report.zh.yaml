        title: 扩张回路和集中度风险
        blocks:
          - type: paragraph
            body: >-
              最好的公开扩张信号来自 B2B，而不是消费者升档。FINN 称超过 80% 的新增 B2B 订阅卖给既有客户，这是典型先落地再扩张行为，说明企业账户一旦开始使用平台，可能随时间扩大车队关系。公司还表示，50
              辆以上的大型车队是最强增长来源，200 辆以上企业细分是优先方向。JobAuto 又增加第二条扩张回路，因为 Probonio 等福利渠道可以把 FINN
              分发给多个雇主和员工队列，公司不必逐个拿下终端用户。主要未解风险是集中度。由于公开材料很少具名企业客户，也不展示账户收入占比，无法判断少数大型车队关系或渠道伙伴是否主导基盘。因此，客户质量在扩张逻辑上看起来有吸引力，但在集中度和留存耐久性上披露仍不足。
