      - number: '8.3'
        title: 建议、信心和反论点
        blocks:
          - type: paragraph
            body: >-
              基于公开可得证据，FINN 应给跟踪建议，而不是买入或放弃。直接放弃会忽视真实规模、B2B
              牵引和投资人支持。激进买入则需要对收入质量、利润率耐久性、客户集中度和资本结构韧性有更多信心，而公开记录给不到。反论点很直接：2026 年融资已经把 FINN
              定价为领先的出行赢家，但支撑高端私募倍数的许多数据点仍未披露。同业申报文件加强了这种谨慎。即便大得多的公开出行平台，仍在提示激励、自由现金流压力和规模化持续盈利的难度。这并不意味着 FINN
              没有吸引力；而是说明当前公开价格对证据很敏感。正确姿态是持续跟踪、加深尽调，等待更强证明或更宽松的进入条款。这种价格敏感的谨慎，是本章核心结论。公开证据还不到买入级别。
