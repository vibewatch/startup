      - number: '6.3'
        title: 满意度、留存和负面信号
        blocks:
          - type: paragraph
            body: >-
              公开客户质量证据好坏参半。正面看，App Store 在 189 条评分下为 4.7 分，Play 页面强调 24/7 支持和低摩擦下单，Trustpilot
              至少包含一些客户续订第二辆车的重复使用好评。负面看，同一 Trustpilot
              档案中反复出现交付延迟、返还争议、押金处理、免赔额收费和客户支持薄弱的投诉。这很重要，因为服务模型运营强度很高：交接、支持或返还任何一环出问题，客户都会把整个系统体验为 FINN
              的失败。更深的问题是，这些表面信号都不能替代队列指标。评分和评价是有用的方向信号，但不给出
              NRR、GRR、流失率或平均订阅期限。因此，公开证据表明产品真实、用户真实、摩擦点也真实，但还看不到可持续客户经济性的干净图景。
