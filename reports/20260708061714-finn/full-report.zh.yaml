      - number: '1.2'
        title: 领导层、创始人和治理披露
        blocks:
          - type: paragraph
            body: >-
              领导层连续性很重要，因为 FINN 的公开叙事在 2023 年发生了实质变化。官方 2023 年 4 月公告称，联合创始人 Maximilian Wühr 在 Max-Josef Meier 卸任后接任
              CEO；Jürgen Lobach 加入管理董事会，Max Beyer 当时继续担任 CFO。随后 2025 年 10 月新闻稿任命 Florian Drabeck 为 CFO
              兼财务和法务负责人，显示公司在更依赖机构债务和盈利叙事时，财务职能经验更强。最可靠的官方创始人名单来自 2023 年管理层变动公告，列出 Maximilian Wühr、Nikolai
              Schröder、Andreas Wixler、Max Beyer、Hans-Peter Ringer 和 Max-Josef Meier。White Star Capital 的组合页面另行确认其 2020 年
              12 月首次投资，并把 Wühr 描述为仍在领导业务的运营型创始人。缺失的信息和已有信息同样重要：已审阅公开材料能识别创始人、高管，以及 Planet First Partners 在 2024
              年获得董事席位等部分董事会变化，但没有给出完整董事名单、优先权堆栈或正式控制权披露。因此，外部投资者对治理集中度、创始人经济权益和未来融资的具体决策权能见度有限。
