      - number: '7.2'
        title: 监管、合同和消费者营销风险
        blocks:
          - type: paragraph
            body: >-
              FINN 的客户关系几乎完全靠远程签约形成，所以消费者法合规不是次要问题。EU 规则已经统一了合同前披露和撤回权，2026 年绿色转型修正案又对面向消费者的可持续性和耐久性表述增加审查。这很重要，因为 FINN
              仍在公司描述中使用气候中性和 CO2 补偿语言，需要扎实证据和有纪律的营销审查。美国带来另一种不确定性：FTC 2026 年关于负选项规则制定的行动，在撤回该流程中单独 CARS
              规则的同时，仍让订阅取消问题保持活跃。结论不是证明 FINN
              今天存在合规问题；而是提醒投资者，订阅、汽车零售和营销主张周围的监管边界在移动。因此，投资者应把合规风险视为动态变量，尤其当激进增长叙事与消费者披露、取消处理和环境定位交叉时。
