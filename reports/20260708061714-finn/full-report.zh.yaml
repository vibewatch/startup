      - number: '1.3'
        title: 融资历史、估值演进和资本结构
        blocks:
          - type: paragraph
            body: >-
              FINN 的资本故事格外重要，因为商业模式同时需要软件执行力和大规模车队融资能力。官方融资时间线显示：2020 年 12 月 €20 million Series A；2021 年 12 月最高 €500
              million 债务；2022 年 5 月 Series B，包含 $110 million 股权和 $720 million 债务承诺；2024 年 1 月 €100 million Series C，估值超过
              €600 million；2025 年 2 月最高 €1 billion ABS II 设施；以及 2026 年 6 月 Series D，近 €100 million 股权加超过 €40 million
              债务，估值超过 €1 billion。投资方、媒体和法律顾问来源都能交叉印证这些节点，不只是公司口径。资本组合也在演变。早期公告强调 White
              Star、HV、UVC、Picus、Heartcore、Korelya，以及后来的 Planet First 和 Portage 等风投支持；但到 2023–2025 年，FINN 越来越强调来自 Credit
              Suisse、Waterfall、Avellinia、Citi 和 Jefferies 的仓储融资、ABS
              和车队抵押债务。承销时这点很关键，因为融资可得性本身就是产品的一部分。与此同时，公开来源没有披露当前完整稀释图、清算优先权、契约条款，或仓储、ABS 与租赁额度之间的精确重叠。证据支持 FINN
              有很强资本获取能力，但没有消除资产负债表复杂性。
