coverageNotes: Public evidence is strong on FINN's funding milestones, subscription scale, and business-model positioning, but weak on audited revenue, gross margin, cohort retention, and capital-structure detail. Reported scale metrics rely heavily on ARR and subscription disclosures rather than public financial statements, and the company funds growth through a mix of equity and asset-backed debt rather than a simple venture-equity story.
