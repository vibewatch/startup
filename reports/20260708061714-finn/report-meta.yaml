      claimRefs: [CO008, CR033]
  foundingLocation: Munich, Germany
  headquarters: Munich, Germany
  productSummary: Monthly car subscriptions for private and business customers, with insurance, taxes, registration, and maintenance bundled into the fee while fuel or charging remains separate.
  customerFocus: Consumers, SMEs, and business fleets seeking flexible vehicle access without ownership.
  businessModel: Monthly subscription fees for bundled vehicle access, supported by debt-funded fleet ownership and remarketing rather than an asset-light marketplace model.
  stage: Series D / Unicorn
  fundingStatus: Raised repeated equity and debt financing through Series A, B, C, and D plus large warehouse and ABS structures; the June 2026 Series D valued FINN above €1 billion, but public materials do not disclose one fully reconciled lifetime funding total on a single basis.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO008, CI017, CI018, CI019]
summary:
  headline: FINN has built real scale in car subscriptions, but the 2026 unicorn round already prices in strong execution despite unresolved disclosure, capital-intensity, and service-risk questions.
