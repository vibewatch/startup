  topStrengths:
    - Real public scale support, including more than 50,000 subscriptions on the road and ARR above €300 million by June 2026.
    - Repeated access to both equity and large-scale fleet financing, culminating in unicorn status and ABS capacity above €1 billion.
    - A differentiated all-inclusive subscription offer that serves both consumers and business fleets.
    - B2B traction is meaningful, with more than 2,500 business customers and evidence of existing-customer expansion.
  topRisks:
    - The model remains capital-intensive and highly sensitive to funding costs, residual values, and fleet-cash-conversion performance.
    - Public disclosures still do not provide audited revenue, gross margin, cohort retention, or concentration metrics sufficient for a buy-grade valuation call.
    - Customer-service friction, returns handling, and contract-dispute risk can impair both brand and unit economics in a service-heavy operating model.
    - Current private pricing already looks full relative to risk-adjusted public mobility comps, especially because FINN reports ARR rather than audited revenue.
  unresolvedGaps:
    - Audited revenue, gross margin, and cohort-level unit economics are not public.
    - Debt covenants, collateral tests, maturity schedules, and preference-stack detail are not public.
    - Realized residual values, remarketing performance, and fleet cash-conversion data remain private.
    - Churn, NRR, customer concentration, and normalized service-cost trends are not publicly disclosed.
disclaimer: This report is based on publicly available information as of 2026-07-08 and is not investment advice. Private-company metrics remain partially disclosed, and headline valuation references should be interpreted alongside the companys debt-backed capital structure and public data gaps.
