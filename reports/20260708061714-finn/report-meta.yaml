companyProfile:
  summary: FINN is a Munich-based car-subscription platform founded in 2019 that sells bundled vehicle access rather than ownership. Public sources support a digital, all-inclusive monthly product for both consumers and business fleets, repeated access to venture and asset-backed capital, and a 2026 unicorn valuation, but they do not yet provide the audited financial detail needed to treat the company like a transparent public-equity story.
  foundedDate: '2019-01-01'
