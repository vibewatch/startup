- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Flexibility is differentiated
    - Multiple rivals promise cancel-anytime or short rolling terms
    - High
    - SIXT and Flexcar both foreground flexibility and vehicle changes
    - Measure win/loss reasons beyond generic convenience claims
  - - All-inclusive bundling is differentiated
    - Bundling is widely copied by SIXT, KINTO, Ayvens, and Flexcar
    - High
    - Core service bundle appears across most reviewed competitors
    - Focus diligence on margin and service-quality execution, not just bundle design
  - - B2B workflow creates a moat
    - Large incumbents also target business fleets
    - Medium
    - SIXT, Ayvens, and Flexcar all have business use signals
    - Request renewal, expansion, and admin-efficiency metrics by fleet cohort
  - - Supply and finance relationships are hard to copy
    - Incumbents may have stronger captive supply or balance-sheet access
    - High
    - Deloitte plus OEM/leasing competitors suggest incumbents can mobilize structural advantages
    - Map OEM concentration, lender dependence, and exclusive allocations
  - - Brand and digital experience create durable lead
    - Low switching costs or multi-homing may erode that lead
    - Medium
    - Public sources do not disclose churn, swap frequency, or loyalty by provider
    - Request churn, utilization, and repeat-booking data before underwriting a moat
  notes: The register intentionally emphasizes durable economic threats rather than superficial feature gaps.
