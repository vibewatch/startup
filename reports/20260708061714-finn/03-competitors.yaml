  - - Autonomy
    - EV-focused US challenger
    - EV-curious consumers
    - Clear EV wedge and user-selected insurance flexibility
    - Not all-inclusive in the same way as FINN or European bundled rivals
  notes: This profile table focuses on the main solution classes a buyer can realistically substitute for FINN rather than on every historical entrant that has ever tested subscriptions.
