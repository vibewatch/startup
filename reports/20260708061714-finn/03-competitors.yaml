  - - SIXT+
    - Rental incumbent
    - Premium consumer users and business customers
    - Dense branch network, strong brand, app-led flexibility, business discounts and fleet portal
    - Sign-up fees, category-not-model allocation, and less bespoke startup identity
  - - KINTO FLEX
    - OEM-backed captive
    - Consumers and business users depending on market
    - Manufacturer ecosystem, quick-delivery stock, all-in pricing, flexible notice options
    - Terms vary significantly by country and minimum terms can be longer than startup messaging implies
  - - Ayvens Flex
    - Leasing incumbent / fleet operator
    - Business and project-based users
    - Company-first short-term fleet product with operational services and reporting
    - Feels closer to short-term lease than consumer-native subscription
  - - Flexcar
    - US challenger
    - Consumers and small business fleets
