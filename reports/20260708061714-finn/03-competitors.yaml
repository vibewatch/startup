chapter:
  number: 3
  title: Competitors
  summary: FINN competes less with one direct clone than with a layered field of rental incumbents, OEM-backed captives, flexible leasing operators, and US subscription challengers. The reviewed source set suggests FINNs product is credible and scaled, but its core flexibility bundle is imitable, making supply, financing, and B2B execution more durable than consumer-facing features alone.
sections:
- id: landscape-and-competitor-classes
  title: Landscape Structure and the Real Competitor Set
  body: 'The most important competitive correction is that FINN does not face only a handful of startup peers. The landscape is structurally mixed. FINN itself is a digital specialist with a broad all-inclusive promise spanning consumer and fleet customers. SIXT+ represents the rental-incumbent model: a trusted brand with a dense network, an app, and the ability to package car access month by month. KINTO illustrates the OEM-captive model, where the provider can lean on manufacturer inventory and branded financing logic. Ayvens brings the leasing-incumbent perspective, positioning flexibility as an extension of corporate mobility rather than as a pure consumer startup product. Flexcar and Autonomy show a more fragmented US field with narrower wedges such as month-to-month convenience or EV-only exposure. The reviewed Cluno evidence also matters because it disproves a common shortcut: Cluno is not a FINN-owned asset in the current source set, but a platform that moved to ViveLaCar and The
    Platform Group in 2023.'
