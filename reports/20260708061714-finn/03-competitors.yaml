  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cross-competitor churn and utilization
    missingEvidence: Comparable churn, swap-frequency, utilization, and gross-margin data for FINN and named rivals.
    whyItMatters: Without usage-quality and retention data, it is easy to overstate or understate a moat from public marketing copy alone.
    diligencePath: Request cohort-level churn, vehicle-turn, and swap-rate data from FINN and use customer interviews to benchmark major competitors.
    relatedQuestionRefs:
    - QP021
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: true apples-to-apples pricing
    missingEvidence: Normalized monthly price quotes for comparable vehicle classes, mileage allowances, insurance levels, and fees across FINN and each rival.
    whyItMatters: Feature parity can be misleading if one product hides more fees or includes weaker protection.
    diligencePath: Run mystery-shopping quotes for the same customer profile and vehicle class across providers.
    relatedQuestionRefs:
    - QP009
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: supply concentration and lender overlap
    missingEvidence: OEM allocation, fleet-financing counterparties, and concentration by vehicle brand for FINN versus rivals.
    whyItMatters: Supply-side power is likely more durable than front-end UX, but public materials do not quantify it consistently.
    diligencePath: Request partner concentration schedules and compare them with rivals public fleet relationships.
    relatedQuestionRefs:
    - QP017
    - QP022
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: historic competitor continuity
    missingEvidence: A complete record of discontinued or failed subscription experiments across geographies, including products no longer live.
    whyItMatters: The competitive field is dynamic, and survivorship bias can make todays active pages look more durable than they are.
    diligencePath: Compile historical competitor launches, pauses, and exits from archived pages and industry reporting.
    relatedQuestionRefs:
    - QP025
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: multi-homing and switching-cost evidence
    missingEvidence: Customer interview evidence on whether users treat subscriptions as interchangeable or attach to one providers workflow.
    whyItMatters: This is central to whether FINN can sustain pricing power as copycat features proliferate.
    diligencePath: Interview fleet buyers and consumers who switched among FINN, SIXT, leasing, and dealer offers.
    relatedQuestionRefs:
    - QP018
    - QP023
    relatedTableRefs:
    - TP004
