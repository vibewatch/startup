- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Competitor
  - Public price / term disclosure
  - Included services
  - Notable contract detail
  - Implication
  rows:
  - - FINN
    - From €149/month plus service fee; six-month style offer visible on homepage
    - Insurance, registration, taxes, maintenance, service
    - Fuel/charging excluded; dynamic listings
    - Clear all-in message but exact economics vary by car and market
  - - SIXT+
    - USD 199-399 sign-up fee; minimum 30 days; monthly extension
    - Maintenance, service, registration, protection options
    - Category reservation only; cancellation by vehicle return; fuel excluded
    - Flexible but not frictionless for users expecting a fixed specific model
  - - KINTO FLEX (NL)
    - Minimum terms 3/6/9 months; month-to-month after minimum
    - Insurance, tax, maintenance, roadside assistance
    - No BKR registration; alternative to lease
    - Strong local-country alternative to private lease rather than universal one-size product
  - - KINTO FLEX (SE)
    - 30-day periods; extend or end at each period
    - Subscription fee plus extra charges like fuel-card use or extra miles
    - Four-day notice for pickup in reviewed page
    - Closer to rolling subscription than the NL variant
  - - Ayvens Flex
    - Three to 12 months typical; under-three-month early-return fee
    - Insurance, service, tyres, assistance, replacement car
    - Business-focused contract structure
    - Competes directly where employers value flexible leased fleets
  - - Flexcar / Autonomy
    - No down payment and cancel-anytime messaging, but public exact monthly price not cleanly extracted here
    - Flexcar bundles insurance and maintenance; Autonomy requires user insurance
    - US challengers use narrower wedges than FINN
    - US comparison is strategically useful even when price disclosure is incomplete
  notes: The reviewed source set is strong on terms and bundle components but inconsistent on exact comparable list prices, so this table preserves unknowns instead of normalizing them away.
