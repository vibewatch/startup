- id: people-execution-and-thesis-break-risk
  title: People, Reorganization, and Thesis-Break Triggers
  body: 'Execution risk is elevated because FINN is scaling on multiple fronts at once. The company is pursuing more fleet capital, more EV mix, more B2B expansion, and broader platform ambitions, while still needing operational consistency at the customer level. The public record shows meaningful management change inside that push: CFO and co-founder Max Beyer exited at the end of 2024, and Jan Hansen was elevated in 2024 to unify B2B and B2C growth operations. Those are understandable moves, but they demonstrate that leadership structure is still evolving. Munich Startups write-up of the 2026 round is revealing on this point: even at unicorn scale, the company framed new capital as fuel for fleet, technology, and operational infrastructure, with profitable growth still an active objective rather than a settled outcome. That synchronization challenge is itself a monitorable investment risk. The thesis therefore breaks first if financing access weakens, service quality deteriorates, compliance
    tightens faster than processes mature, or executive bandwidth fails to keep the system synchronized.'
