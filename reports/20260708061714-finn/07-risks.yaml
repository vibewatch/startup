- id: regulatory-and-customer-contract-risk
  title: Regulatory, Contract, and Consumer-Marketing Risk
  body: 'FINNs customer relationship is formed almost entirely through distance contracting, so consumer-law compliance is not a secondary issue. EU rules already harmonize pre-contract disclosures and withdrawal rights, and the 2026 green-transition amendments add fresh scrutiny to how consumer-facing sustainability and durability messages are presented. That matters because FINN continues to use climate-neutral and CO2-compensation language in company descriptions, creating a real need for robust substantiation and disciplined marketing review. The US adds a different flavor of uncertainty: the FTCs 2026 action on negative-option rulemaking kept subscription-cancellation questions alive while withdrawing the separate CARS rule from that process. The result is not proof of a FINN compliance problem today; it is a reminder that the regulatory perimeter around subscriptions, auto retail, and marketing claims is moving. Investors should therefore treat compliance risk as dynamic, especially
    where aggressive growth narratives intersect with consumer disclosures, cancellation handling, and environmental positioning.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR042
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-partner-dependency-risk
  title: Operational Friction and Partner-Dependency Risk
  body: 'The strongest adverse evidence in the reviewed set is operational rather than strategic. Trustpilot surfaces recurring complaints about delivery quality, registration handling, delayed support responses, unexpected charges, and friction when customers try to extend or exit a subscription. Those anecdotes do not prove broad service failure, but they do fit the underlying model: FINN sits at the center of a high-touch chain spanning vehicle sourcing, logistics, registration, servicing, insurance interfaces, and returns. When one handoff fails, the customer experiences the whole system as FINNs failure. Partner dependence compounds that risk. TechCrunch said most inventory was sourced directly from OEMs; the E.ON release shows EV conversion depends partly on charging enablement; and JobAuto relies on benefit and portal partners to expand into B2B channels. FINN has real mitigations—OEM relationships, pre-brokered resale, and partner distribution—but those same relationships are also
    concentration points that require constant execution discipline.'
  claimRefs:
  - CR013
  - CR014
  - CR016
  - CR017
  - CR018
