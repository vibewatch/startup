- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Fleet funding access
    - ABS or warehouse expansion slows materially or covenants tighten
    - New fleet growth constrained for two consecutive quarters
    - Reprice underwriting or pause growth-led valuation assumptions
  - - Residual values
    - Realized resale values miss plan enough to pressure debt coverage
    - Persistent cohort-level resale underperformance versus underwriting
    - Move case toward bear scenario and demand asset-level data
  - - Customer service quality
    - Complaints, return disputes, or support delays rise without faster resolution
    - Clear deterioration in complaint rate, CSAT, or chargeback metrics
    - Assume higher CAC drag and lower retention durability
  - - Compliance and marketing
    - Consumer-law or green-claims substantiation gaps surface
    - Regulatory inquiry, forced copy changes, or repeated contract disputes
    - Require legal remediation plan before underwriting expansion
  - - Leadership and execution
    - Finance or operations turnover slows control maturity
    - Missed reporting, delayed reorg stabilization, or KPI slippage
    - Increase execution discount and avoid premium multiple assumptions
  notes: Kill criteria are framed as monitorable operating or financing events because the public record lacks audited loss-rate disclosure.
