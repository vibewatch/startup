            body: >-
              Leadership continuity has mattered because FINN's public story changed materially in 2023. An official
              April 2023 release says co-founder Maximilian Wühr became CEO after Max-Josef Meier stepped down, while
              Jürgen Lobach joined the managing board and Max Beyer remained CFO at the time. A later October 2025 press
              release adds Florian Drabeck as CFO and head of finance and legal, showing a more experienced finance
              function as the company leaned harder into institutional debt and profitability messaging. The strongest
              official founder roster comes from the 2023 management-change release, which names Maximilian Wühr,
              Nikolai Schröder, Andreas Wixler, Max Beyer, Hans-Peter Ringer, and Max-Josef Meier as founders. White
