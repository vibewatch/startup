      - number: '7.2'
        title: Regulatory, Contract, and Consumer-Marketing Risk
        blocks:
          - type: paragraph
            body: >-
              FINNs customer relationship is formed almost entirely through distance contracting, so consumer-law
              compliance is not a secondary issue. EU rules already harmonize pre-contract disclosures and withdrawal
              rights, and the 2026 green-transition amendments add fresh scrutiny to how consumer-facing sustainability
              and durability messages are presented. That matters because FINN continues to use climate-neutral and
              CO2-compensation language in company descriptions, creating a real need for robust substantiation and
              disciplined marketing review. The US adds a different flavor of uncertainty: the FTCs 2026 action on
              negative-option rulemaking kept subscription-cancellation questions alive while withdrawing the separate
              CARS rule from that process. The result is not proof of a FINN compliance problem today; it is a reminder
              that the regulatory perimeter around subscriptions, auto retail, and marketing claims is moving. Investors
              should therefore treat compliance risk as dynamic, especially where aggressive growth narratives intersect
              with consumer disclosures, cancellation handling, and environmental positioning.
