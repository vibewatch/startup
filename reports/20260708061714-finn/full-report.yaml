              the operating founder still leading the business. What is missing is as important as what is present:
              reviewed public materials identify founders, top executives, and some board additions such as Planet First
              Partners' board seat in 2024, but they do not provide a full board roster, preference stack, or formal
              control-rights disclosure. That leaves outside investors with limited visibility into governance
              concentration, founder economics, and the exact decision rights around future financings.
