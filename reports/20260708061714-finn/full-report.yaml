chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Model, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              FINN is best understood as an asset-heavy but software-led car-subscription platform rather than a
              traditional dealership or leasing broker. The official consumer and B2B pages consistently describe a
              fixed monthly payment that bundles insurance, registration, taxes, maintenance, and service while leaving
              customers to pay only fuel or charging. The current German consumer page says subscriptions start at €149
              per month plus a one-time €1,500 service fee and typically begin at six months, while OEM partnership
              releases show many listings running six to 24 months. That product logic matters because FINN sells
              convenience, delivery speed, and predictable operating cost rather than ownership. The company also uses
              the same core proposition for business fleets, where a centralized portal and account support reduce admin
              work for employers. Public scale markers now place FINN well beyond the early-startup phase: the June 2026
              Series D announcement says more than 50,000 FINN subscriptions are on the road and ARR exceeds €300
              million, while the newsroom landing page frames the company as Germany's leading auto-subscription
              provider with over 300 employees. The evidence supports platform scale, but it does not separate active
              subscribers from active subscription vehicles, so customer-count precision still needs management
              confirmation.
