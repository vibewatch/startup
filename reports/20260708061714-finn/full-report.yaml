        title: Customer Segments, Buyer Logic, and Geography
        blocks:
          - type: paragraph
            body: >-
              The reviewed sources show FINN serving multiple customer groups with different buyer-user-payer
              structures. The simplest segment is the retail consumer: the user chooses and pays for the car
              subscription directly. Business subscriptions are more complex because fleet managers, procurement,
              finance, or HR functions may approve and pay while employees use the vehicles. JobAuto adds a third
              structure, where the employer enables the benefit, but the employee funds most of the subscription through
              salary conversion. That matters because it turns FINN from a pure consumer offering into a channel-based
              corporate mobility product. Public evidence also suggests the strongest named customer proof is still
              Germany-centric. The business-growth release, Probonio materials, and most review surfaces are tied to
              Germany, while the U.S. evidence in the reviewed set is thinner and framed as harder to scale. FINN
              therefore looks like a broad but still Germany-led customer platform rather than a balanced transatlantic
