      - number: '4.3'
        title: Margin Logic, Interest Rates, and Residual-Value Risk
        blocks:
          - type: paragraph
            body: >-
              The reviewed evidence suggests that FINNs gross-margin logic depends on buying or financing vehicles
              efficiently, keeping them utilized, controlling service and damage costs, and exiting them at acceptable
              residual values after the subscription period. TechCrunchs 2024 reporting adds two helpful details: the
              company sourced most inventory directly from OEMs, and it had brokered resale outlets before vehicles
              rolled off subscription. That is exactly what an asset-heavy operator should do, because remarketing speed
              and realized residual value are critical to cash conversion. The risk side is equally clear. FINNs ABS
              structures are secured by the car fleet, so collateral performance matters. KBRAs March 2026 note says EV
              residual-value declines in Europe have moderated, but the agency still highlights sensitivity to
              collateral mix, jurisdiction, and structure. At the same time, ECB rates remained materially above zero in
              mid-2026, so funding cost is still a live margin variable rather than a rounding error.
