      - number: '2.4'
        title: Growth Drivers, Constraints, and Regulatory Timing
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are flexibility, bundled cost transparency, digital onboarding, and
              electrification without long-term residual-value exposure. Analyst sources repeatedly present
              subscriptions as a way for both consumers and companies to test EVs, avoid long financing commitments, and
              keep mobility options open when work patterns or vehicle needs change. But the same sources also show why
              the category is hard to scale. Affordability remains a real constraint because mature-market vehicle
              prices are high and many EVs still command a premium. Charging infrastructure and policy clarity matter as
              well, especially for fleet buyers considering EV-heavy mixes. Regulation adds a second layer of
              complexity. In Europe, distance-service and consumer-rights rules shape disclosure and contract
              requirements; in the United States, recent FTC litigation and rule withdrawals show that auto-commerce
              regulation can shift. FINNs own decision to pause the US business in 2024 is therefore meaningful adverse
              evidence: attractive demand narratives do not eliminate capital intensity, regulatory fragmentation, or
              geographic execution risk.
