      - number: '2.2'
        title: Sizing Lenses, Geography, and Market Maturity
        blocks:
          - type: paragraph
            body: >-
              Public market data suggests a fast-growing but still modest category relative to mainstream auto finance.
              IMARC estimates the global car-subscription market at USD 6.27 billion in 2025 and forecasts USD 24.10
              billion by 2034, with Europe holding the largest regional share at 41.9%. The United States is smaller
              today at USD 1.7 billion but is also forecast to compound in the mid-teens. Those figures are
              directionally helpful for category scale, but they are broad TAM lenses rather than FINNs true serviceable
              market. Germany remains an attractive anchor geography because Europe leads the category and Germany has a
              deep fleet, leasing, and OEM ecosystem, yet the overall passenger-car backdrop is not booming. VDA expects
              only modest 2026 growth in German and European registrations, and PwC plus Platform Executive both
              describe affordability pressure in mature markets. That combination supports FINNs value proposition:
              subscriptions can grow even when the wider auto cycle is subdued because they sell flexibility into an
              expensive ownership environment.
