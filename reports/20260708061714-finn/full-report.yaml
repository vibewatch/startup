      - number: '4.4'
        title: Public Comparable Multiples and the Path to Profitability
        blocks:
          - type: paragraph
            body: >-
              Public comps do not support a simplistic high-growth-tech valuation lens for FINN. A July 2026 snapshot
              shows Carvana trading at a rough market-cap-to-revenue ratio around 3.3x, while Avis sits closer to 0.46x
              and Hertz near 0.08x. Those companies are not perfect peers, but that spread is precisely the point:
              asset-heavy mobility businesses are priced according to growth credibility, leverage, profitability, and
              capital-market confidence, not revenue alone. FINNs own 2026 valuation above €1 billion against ARR above
              €300 million implies a headline ratio above 3x, but ARR is not audited revenue and debt is essential to
              the model. Public evidence therefore supports only a conditional profitability path. Management said in
              early 2024 that the core product was profitable even though the overall company was not yet profitable.
              For that claim to mature into durable company-level earnings, FINN must keep financing costs contained,
              protect residual values, and convert B2B scale into lower servicing and utilization volatility.
