      - number: '3.4'
        title: Moat Durability and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse side of the competitive picture is that the core feature set is no longer rare. Deloittes
              framework helps explain why: early movers may have gained brand and learning advantages, but incumbents
              can still win once they mobilize capital, vehicle supply, and channel relationships. That risk shows up
              directly in the reviewed competitor pages. SIXT and Flexcar both market cancel-anytime flexibility and
              vehicle changes; KINTO and Ayvens can turn flexible access into an extension of captive or leasing
              economics; Autonomy uses a narrower EV wedge. In other words, FINNs moat cannot rest on saying
              "all-inclusive and flexible" because multiple rivals now say similar things. The stronger moat candidates
              are fleet financing, OEM allocation, business-fleet workflow, and operating execution. Even there, the
              public evidence remains incomplete. There is no reliable cross-company public data on churn, utilization,
              swap frequency, CAC, or margin by vehicle cohort. That means the chapter can identify competitive pressure
              with confidence, but it cannot yet declare a durable winner from public materials alone.
            claimRefs:
              - CP023
              - CP026
              - CP028
              - CP032
              - CP033
              - CP038
              - CP039
