  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Asset-Backed Model, Funding Costs, and Residual-Value Risk
        blocks:
          - type: paragraph
            body: >-
              FINNs public materials leave little doubt that this is an asset-heavy operating model. The company sells a
              digital subscription experience, but the underlying service still requires large and continuously financed
              vehicle inventory. The public chronology—Series C, Avellinia, ABS II, then a Series D that still included
              fresh debt—shows that growth is structurally tied to fleet capital rather than only to software
              efficiency. That matters because even strong top-line demand can stall if capital-market access tightens.
              The second layer of risk is asset performance. Residual values, utilization, and remarketing discipline
              determine whether financed vehicles convert back into cash at the right pace. KBRAs March 2026 note is
              directionally reassuring because EV residual-value declines have moderated, but it also underscores that
              outcomes remain structure-sensitive. With euro rates still above zero, financing cost and exit-value risk
              remain core drivers of margin and solvency rather than background variables.
