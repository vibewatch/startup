        title: Product Definition and Core Workflow
        blocks:
          - type: paragraph
            body: >-
              FINN delivers a bundled car-subscription service rather than a software-only application. The
              customer-facing product starts online or in the app, where users choose a vehicle, select a term, and
              complete a paperless ordering flow. The app-store descriptions reduce the process to four steps: find a
              car, subscribe online, receive delivery, and drive while FINN handles the administration. The core promise
              is that the company removes the complexity normally attached to ownership, leasing, and paperwork. The
              reviewed mobile listings and Toyota partner release also show that delivery is part of the product itself:
              customers can order within minutes and receive the car at home or at the office. That is why the product
              should be modeled as a software-enabled service workflow with real operational fulfillment behind it. It
              is not just a marketplace and not just a mobile app.
