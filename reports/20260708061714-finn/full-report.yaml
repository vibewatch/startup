      - number: '4.2'
        title: Capital Stack Evolution and Fleet-Financing Dependence
        blocks:
          - type: paragraph
            body: >-
              FINNs financing path makes clear that the company is not a pure software marketplace. It began with
              conventional venture equity in 2020, but by 2021 management was already emphasizing debt capacity to fund
              the fleet. The December 2021 debt facility of up to €500 million, the May 2022 Series B plus $720 million
              of debt commitments, the July 2023 Avellinia top-up that lifted the advance rate to 100%, and the February
              2025 ABS II of up to €1 billion all point in the same direction: fleet availability is inseparable from
              financing-market access. The June 2026 Series D added another layer by combining fresh equity with more
              debt at unicorn valuation. This matters because public headline funding success can mask balance-sheet
              complexity. Debt lines across ABS, warehouse, and leasing programmes may overlap or amortize, so they
              should not be naively summed into one current outstanding balance. But the strategic message is
              unambiguous—FINN has made fleet financing itself part of the product.
