              Execution risk is elevated because FINN is scaling on multiple fronts at once. The company is pursuing
              more fleet capital, more EV mix, more B2B expansion, and broader platform ambitions, while still needing
              operational consistency at the customer level. The public record shows meaningful management change inside
              that push: CFO and co-founder Max Beyer exited at the end of 2024, and Jan Hansen was elevated in 2024 to
