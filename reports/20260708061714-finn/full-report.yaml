  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Pricing Context and Why Discipline Matters
        blocks:
          - type: paragraph
            body: >-
              The 2026 financing round gives FINN a clear public headline: more than €1 billion valuation, more than
              €300 million ARR, and more than 50,000 subscriptions on the road. That is meaningful scale, and the
              step-up from the 2024 Series C valuation above €600 million shows that investors have seen real growth.
              But the same evidence set also argues for valuation discipline. The model still relies on debt-backed
              fleet funding, public materials still emphasize ARR rather than audited revenue, and managements own
              narrative still centers on efficient or profitable growth rather than on a finished profitability story.
              That combination means the price should be judged as a risk-adjusted mobility multiple, not as a pure
              software multiple. In other words, the core question is not whether FINN is impressive—it is whether the
              current headline valuation already captures most of the public upside before key operating unknowns are
              resolved.
