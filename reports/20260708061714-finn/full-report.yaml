      - number: '8.2'
        title: Public Comparable Range and Scenario Logic
        blocks:
          - type: paragraph
            body: >-
              The public comp set shows why valuation needs a wide range rather than a single point estimate. In July
              2026, Uber traded around 2.8x revenue, Lyft around 0.9x, Grab around 4.5x, Carvana around 3.3x, Avis
              around 0.46x, and Hertz near 0.08x on simple market-cap-to-revenue heuristics. That spread is not noise;
              it reflects very different mixes of growth durability, profitability, leverage, asset ownership, and
              investor confidence. FINN sits between several of these categories. It has stronger headline growth than
              traditional rental operators, but it is also more asset-intensive than marketplace-style mobility
              platforms because it directly carries fleet financing and residual-value risk. As a result, FINNs current
              >3.3x valuation-to-ARR heuristic looks feasible only in a bull or strong-base case. The bear case is easy
              to imagine if debt, remarketing, or service metrics weaken, while the upside case requires operational
              proof that is still private. That is why the base case carries more weight than the headline round alone
              suggests.
            claimRefs:
