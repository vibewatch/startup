  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for FINN is not the full passenger-car market and not generic short-term rental. It is
              the narrower recurring vehicle-access market where the buyer pays one predictable monthly fee for the
              right to use a car plus bundled operating services such as insurance, registration, maintenance, and
              servicing. FINNs own consumer and B2B pages make that boundary explicit by emphasizing convenience, single
              billing, and bundled administration while leaving fuel or charging outside the package. Deloittes
              vehicle-as-a-service framing is useful because it places subscriptions between ownership or leasing on one
              side and car-sharing or ride-hailing on the other. That means the main substitutes are private ownership,
              employer-provided company cars, conventional leasing, and flexible rental products. This boundary matters
              for valuation because the addressable spend is recurring access and service margin, not the full sticker
              price of vehicles purchased by end users.
            claimRefs:
              - CM001
              - CM002
              - CM003
