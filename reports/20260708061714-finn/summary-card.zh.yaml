  topStrengths:
    - 公开规模证据扎实：到 2026 年 6 月，路上订阅车辆超过 50,000 辆，ARR 超过 €300 million。
    - 公司多次拿到股权融资和大规模车队融资，最终进入独角兽区间，ABS 额度超过 €1 billion。
    - 全包式订阅方案有差异化，同时服务消费者和企业车队。
    - B2B 牵引力不弱，企业客户超过 2,500 家，也有存量客户扩张证据。
  topRisks:
    - 模式仍然吃资本，对融资成本、残值和车队现金转化表现高度敏感。
    - 公开披露仍缺经审计收入、毛利率、队列留存和集中度指标，支撑不了买入级估值判断。
    - 运营重服务，客服摩擦、退车处理和合同纠纷风险会同时伤品牌和单位经济。
    - 按风险调整后的上市出行可比公司看，当前私募定价已经偏满；尤其 FINN 披露的是 ARR，而不是经审计收入。
  unresolvedGaps:
    - 经审计收入、毛利率和队列层面的单位经济尚未公开。
    - 债务契约、抵押品测试、到期安排和优先股堆叠细节没有公开。
    - 已实现残值、二手车处置表现和车队现金转化数据仍是私有信息。
    - 流失率、NRR、客户集中度和标准化服务成本趋势尚未公开披露。
