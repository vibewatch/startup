chapter:
  number: 2
  title: Market Analysis
  summary: FINN operates inside a still-small but clearly institutionalizing car-subscription market whose strongest public evidence points to Europe as the leading region, corporate fleets as the largest end-use segment, and electrification as a major but not yet dominant growth vector. The best public data supports strong category growth, but Germany-only TAM and FINN-specific SAM remain imperfectly disclosed and should be treated as directional rather than precise.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: The relevant market for FINN is not the full passenger-car market and not generic short-term rental. It is the narrower recurring vehicle-access market where the buyer pays one predictable monthly fee for the right to use a car plus bundled operating services such as insurance, registration, maintenance, and servicing. FINNs own consumer and B2B pages make that boundary explicit by emphasizing convenience, single billing, and bundled administration while leaving fuel or charging outside the package. Deloittes vehicle-as-a-service framing is useful because it places subscriptions between ownership or leasing on one side and car-sharing or ride-hailing on the other. That means the main substitutes are private ownership, employer-provided company cars, conventional leasing, and flexible rental products. This boundary matters for valuation because the addressable spend is recurring access and service margin, not the full sticker price of vehicles purchased by end users.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM012
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses-and-geographic-mix
  title: Sizing Lenses, Geography, and Market Maturity
  body: 'Public market data suggests a fast-growing but still modest category relative to mainstream auto finance. IMARC estimates the global car-subscription market at USD 6.27 billion in 2025 and forecasts USD 24.10 billion by 2034, with Europe holding the largest regional share at 41.9%. The United States is smaller today at USD 1.7 billion but is also forecast to compound in the mid-teens. Those figures are directionally helpful for category scale, but they are broad TAM lenses rather than FINNs true serviceable market. Germany remains an attractive anchor geography because Europe leads the category and Germany has a deep fleet, leasing, and OEM ecosystem, yet the overall passenger-car backdrop is not booming. VDA expects only modest 2026 growth in German and European registrations, and PwC plus Platform Executive both describe affordability pressure in mature markets. That combination supports FINNs value proposition: subscriptions can grow even when the wider auto cycle is subdued
    because they sell flexibility into an expensive ownership environment.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM010
  - CM011
  - CM014
  - CM020
  - CM021
  - CM023
  - CM037
