  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Germany-only SAM for FINN
    missingEvidence: A bottom-up market model for Germany and any active non-German geographies segmented by B2C and B2B, price band, and vehicle type.
    whyItMatters: Broad category TAMs are not enough to underwrite realistic growth or market share assumptions.
    diligencePath: Request internal market planning materials or lender underwriting decks with segment-level penetration assumptions.
    relatedQuestionRefs:
    - QM014
    - QM021
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: B2B buyer economics
    missingEvidence: Contract-level expansion, churn, and gross-margin data by fleet cohort, company size, and EV mix.
    whyItMatters: Corporate users appear to be the largest segment, but public sources do not show retention quality or unit economics.
    diligencePath: Request cohort data, renewal reasons, and CAC payback by B2B segment.
    relatedQuestionRefs:
    - QM020
    - QM022
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: State-by-state US compliance map
    missingEvidence: A current legal matrix for subscription contract treatment, cancellation, dealer regulation, and insurance handling by state.
    whyItMatters: US market potential is real, but regulatory inconsistency can make nominal TAMs misleading.
    diligencePath: Request outside-counsel summaries and internal market-entry criteria for each state.
    relatedQuestionRefs:
    - QM017
    - QM018
    relatedTableRefs:
    - TM004
