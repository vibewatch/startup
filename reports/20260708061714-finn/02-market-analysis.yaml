- id: buyer-segmentation-and-adoption-path
  title: Buyer Segmentation, Budget Ownership, and Adoption Path
  body: 'The public evidence suggests that the car-subscription market is not purely consumer-led. IMARC estimates that corporate users already represent the largest end-use segment globally, and FINNs own disclosures support that logic: by late 2023 the company said B2B subscriptions generated 45% of ARR and served more than 2,500 business customers. For personal users, the sweet spot appears to be urban professionals and younger households that want access over ownership, especially when commuting patterns are less stable. BearingPoint adds an important behavioral nuance: prior users of subscription-style leasing are materially more open to the model, which means trial and fleet exposure can be demand accelerants. On the business side, the buyer, user, and payer often differ. HR, procurement, finance, or fleet managers may control budget while employees or field teams use the vehicles. That separation favors products that reduce admin work, simplify billing, and let companies resize fleets
    quickly without taking direct residual-value risk.'
  claimRefs:
  - CM002
  - CM008
  - CM013
  - CM016
  - CM017
  - CM018
  - CM019
  - CM030
  - CM031
  - CM034
  - CM035
  - CM040
  tableRefs:
  - TM003
