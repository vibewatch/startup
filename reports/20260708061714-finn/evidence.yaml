evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, voting rights, liquidation preferences, and lender covenants.
    whyItMatters: These documents determine real control, dilution risk, and downside protection for new investors.
    diligencePath: Request the current cap table, board deck, shareholder agreement summary, and debt term sheets from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A dated HR or finance-confirmed headcount by geography and function.
    whyItMatters: >-
      Public newsroom copy supports only a rough 300-plus employee marker and cannot support productivity analysis on
      its own.
    diligencePath: Request a current org chart and payroll headcount bridge by month.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: A reconciliation between active subscriptions, unique subscribers, churned accounts, and B2B vehicle seats.
    whyItMatters: Without it, growth and retention quality can be overstated by fleet-unit counts.
    diligencePath: Request cohort and unit-account bridges segmented by B2C and B2B.
    relatedQuestionRefs:
      - QO018
  - type: conflicting-data
    severity: minor
    topic: investor-gap
    missingEvidence: Primary documentation confirming or disproving BMW i Ventures and La Famiglia as current investors.
    whyItMatters: Investor-brand accuracy matters for market perception and could affect assumptions about OEM or network support.
    diligencePath: Confirm the current cap table directly with management and compare against legal closing documents for each round.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-stack
    missingEvidence: A lender-by-lender schedule of ABS, warehouse, and leasing facilities with maturities and advance rates.
    whyItMatters: Fleet availability and equity efficiency depend on these terms, especially in stress cases.
    diligencePath: Request treasury materials or financing memoranda covering all active debt lines.
    relatedQuestionRefs:
      - QO011
      - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: TO005 milestone chronology is limited to public milestones
    missingEvidence: Private internal product launches, board decisions, and covenant amendments between public financing events.
    whyItMatters: >-
      The public chronology is sufficient for external diligence, but it may miss internal operating or governance
      inflection points.
    diligencePath: Request an internal company timeline or board materials to fill non-public milestone gaps.
    relatedTableRefs:
      - TO005
  - type: private-evidence-only
    severity: material
    topic: Germany-only SAM for FINN
    missingEvidence: >-
      A bottom-up market model for Germany and any active non-German geographies segmented by B2C and B2B, price band,
      and vehicle type.
    whyItMatters: Broad category TAMs are not enough to underwrite realistic growth or market share assumptions.
    diligencePath: >-
      Request internal market planning materials or lender underwriting decks with segment-level penetration
      assumptions.
    relatedQuestionRefs:
      - QM014
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: B2B buyer economics
    missingEvidence: Contract-level expansion, churn, and gross-margin data by fleet cohort, company size, and EV mix.
    whyItMatters: >-
      Corporate users appear to be the largest segment, but public sources do not show retention quality or unit
      economics.
    diligencePath: Request cohort data, renewal reasons, and CAC payback by B2B segment.
    relatedQuestionRefs:
      - QM020
      - QM022
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: State-by-state US compliance map
    missingEvidence: >-
      A current legal matrix for subscription contract treatment, cancellation, dealer regulation, and insurance
      handling by state.
    whyItMatters: US market potential is real, but regulatory inconsistency can make nominal TAMs misleading.
    diligencePath: Request outside-counsel summaries and internal market-entry criteria for each state.
    relatedQuestionRefs:
      - QM017
      - QM018
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: minor
    topic: Germany market-size precision
    missingEvidence: >-
      Independent public sources that reconcile Germany-only subscription revenue, vehicle count, or penetration using
      the same definition.
    whyItMatters: Current public estimates mix leasing, fleet, and subscription categories, which can overstate certainty.
    diligencePath: Preserve multiple public lenses until a common market definition is available.
    relatedQuestionRefs:
      - QM021
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Elasticity by consumer price band
    missingEvidence: Conversion and cancellation behavior by monthly price, mileage allowance, and service fee.
    whyItMatters: >-
      Affordability is one of the biggest market constraints, but public data does not show where FINNs demand curve
      breaks.
    diligencePath: Request pricing-test results and win/loss data against leasing and ownership alternatives.
    relatedQuestionRefs:
      - QM010
      - QM015
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: cross-competitor churn and utilization
    missingEvidence: Comparable churn, swap-frequency, utilization, and gross-margin data for FINN and named rivals.
    whyItMatters: >-
      Without usage-quality and retention data, it is easy to overstate or understate a moat from public marketing copy
      alone.
    diligencePath: >-
      Request cohort-level churn, vehicle-turn, and swap-rate data from FINN and use customer interviews to benchmark
      major competitors.
    relatedQuestionRefs:
      - QP021
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: true apples-to-apples pricing
    missingEvidence: >-
      Normalized monthly price quotes for comparable vehicle classes, mileage allowances, insurance levels, and fees
      across FINN and each rival.
    whyItMatters: Feature parity can be misleading if one product hides more fees or includes weaker protection.
    diligencePath: Run mystery-shopping quotes for the same customer profile and vehicle class across providers.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: supply concentration and lender overlap
    missingEvidence: OEM allocation, fleet-financing counterparties, and concentration by vehicle brand for FINN versus rivals.
    whyItMatters: Supply-side power is likely more durable than front-end UX, but public materials do not quantify it consistently.
    diligencePath: Request partner concentration schedules and compare them with rivals public fleet relationships.
    relatedQuestionRefs:
      - QP017
      - QP022
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: minor
    topic: historic competitor continuity
    missingEvidence: >-
      A complete record of discontinued or failed subscription experiments across geographies, including products no
      longer live.
    whyItMatters: >-
      The competitive field is dynamic, and survivorship bias can make todays active pages look more durable than they
      are.
    diligencePath: Compile historical competitor launches, pauses, and exits from archived pages and industry reporting.
    relatedQuestionRefs:
      - QP025
      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
