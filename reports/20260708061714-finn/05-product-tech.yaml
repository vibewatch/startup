  - TE004
  - TE005
  figureRefs:
  - FE004
- id: trust-quality-and-product-risks
  title: Trust, Quality, and Product-Dependency Risks
  body: The reviewed trust posture is mostly operational rather than certification-led. Public app surfaces show privacy disclosures and 24/7 support claims, while the consumer and partner pages emphasize insurance handling, service coverage, and a simple digital process. That helps explain the customer promise, but it does not provide the same comfort as a public security page, uptime history, or detailed compliance disclosures would. Product availability also depends heavily on external partners. OEM and leasing relationships shape inventory breadth and delivery speed, while app stores remain critical to the mobile experience. The FINN Station pilot adds a promising new pickup option, but it is still early relative to the core delivery workflow. Overall, the public evidence supports a mature customer workflow and growing operational sophistication; it does not yet support strong conclusions about deeper software defensibility, telemetry infrastructure, or externally audited trust controls.
    Another unresolved point is whether the same support and quality standard holds consistently across consumer delivery, fleet use, and new pickup-station formats.
  claimRefs:
  - CE006
  - CE007
  - CE024
  - CE025
  - CE026
  - CE028
  - CE029
  - CE035
  - CE036
