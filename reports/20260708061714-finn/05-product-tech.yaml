  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: internal software architecture
    missingEvidence: Service architecture, data model, telematics stack, incident handling, and major third-party vendors.
    whyItMatters: Without it, product diligence cannot separate genuine platform leverage from manual operational workarounds.
    diligencePath: Request an architecture review, system diagram, and reliability runbook from engineering.
    relatedQuestionRefs:
    - QE005
    - QE017
    - QE021
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security and compliance evidence
    missingEvidence: Public or private proof of security controls, audit scope, certifications, and privacy-governance process.
    whyItMatters: Customer trust claims are visible, but externally verifiable security/compliance proof is not.
    diligencePath: Request security policies, penetration-test summaries, vendor assessments, and any ISO/SOC evidence.
    relatedQuestionRefs:
    - QE013
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: B2B portal depth
    missingEvidence: Screenshots, integration detail, admin workflow specs, and customer references for the fleet portal.
    whyItMatters: The B2B portal is strategically important but only lightly described publicly.
    diligencePath: Request product demo, integration matrix, and customer-admin interviews.
    relatedQuestionRefs:
    - QE003
    - QE020
    relatedTableRefs:
    - TE001
    - TE002
  - type: private-evidence-only
    severity: material
    topic: FINN Station economics
    missingEvidence: Utilization, cost per handover, customer uptake, and city rollout criteria for station pickup.
    whyItMatters: The station model could improve or worsen last-mile economics depending on adoption and density.
    diligencePath: Request pilot KPI dashboard and expansion decision memo.
    relatedQuestionRefs:
    - QE012
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: developer-signal weakness
    missingEvidence: Public repo, changelog, engineering blog, API documentation, or practitioner community proof.
    whyItMatters: Current developer-signal proxies show hiring and org maturity but not code quality or ecosystem pull.
    diligencePath: Ask for release notes, engineering metrics, and any community or package-level activity.
