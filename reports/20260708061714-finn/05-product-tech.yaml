company:
  name: FINN
chapter:
  number: 5
  title: Product & Technology
  summary: FINNs product is best understood as a digitally ordered, logistics-heavy subscription workflow rather than a deep public-software platform. The reviewed sources show live mobile ordering, business-fleet tooling, and expanding pickup infrastructure, but they provide only limited external evidence on internal architecture, telemetry, or security certifications.
sections:
- id: product-definition-and-core-workflow
  title: Product Definition and Core Workflow
  body: 'FINN delivers a bundled car-subscription service rather than a software-only application. The customer-facing product starts online or in the app, where users choose a vehicle, select a term, and complete a paperless ordering flow. The app-store descriptions reduce the process to four steps: find a car, subscribe online, receive delivery, and drive while FINN handles the administration. The core promise is that the company removes the complexity normally attached to ownership, leasing, and paperwork. The reviewed mobile listings and Toyota partner release also show that delivery is part of the product itself: customers can order within minutes and receive the car at home or at the office. That is why the product should be modeled as a software-enabled service workflow with real operational fulfillment behind it. It is not just a marketplace and not just a mobile app.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE031
  - CE032
  - CE033
  - CE034
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: asset-catalog-and-operating-architecture
  title: Asset Catalog, Partner Inventory, and Operating Architecture
  body: 'Public sources show FINN managing a broad product catalog rather than a single subscription SKU. Toyota, Hyundai, BYD, and Stellantis releases all describe wide model ranges, multiple powertrains, and different contract windows, which means the operating architecture must coordinate OEM supply, vehicle configuration, booking, financing, and delivery. Toyotas 2024 announcement alone referenced roughly 1,300 Toyota and Lexus vehicles in the first step of the programme, while Hyundai and BYD each pointed to 5,000-unit partnership plans and Stellantis described a five-year history plus several tens of thousands of subscribed vehicles. The architecture visible from public sources is therefore operational: digital browse and order, fleet sourcing, delivery or pickup, support, and remarketing. What remains hidden is the deeper software stack. There is no public API portal or systems diagram in the reviewed set, and TechCrunch specifically reported that connected-car diagnostics were constrained
    by proprietary OEM systems.'
  claimRefs:
  - CE004
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE021
  - CE024
  - CE027
  - CE035
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE003
- id: maturity-developer-signal-and-scaling
  title: Maturity, Developer-Signal Proxies, and Scaling Clues
  body: 'FINN does not expose the kind of public developer surface that a software infrastructure company might, so product diligence has to rely on live apps, recruiting signals, and operating-team disclosures as proxies. The iOS page shows an actively updated app with a June 2026 release, current OS support, privacy disclosures, and bilingual coverage. The careers pages show a company organized around Growth, Operations, Fleet, Finance & Legal, Tech, and People, with Tech embedded across functions rather than isolated in a central lab. The careers blog goes further by surfacing the CTO and describing automation as a scaling lever. Levers recruiting page even notes limited use of AI tooling in hiring operations. Together, these are imperfect but useful developer-signal proxies: they indicate a live product organization that ships software and automates workflows, even though no public repository, API doc set, or engineering status page is visible. The maturity picture is strongest for ordering
    and operations, weaker for externally visible technical depth.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE022
  - CE029
  - CE030
  - CE034
