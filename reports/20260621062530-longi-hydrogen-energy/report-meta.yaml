companyProfile:
  summary: >-
    LONGi Hydrogen Energy is the hydrogen-equipment subsidiary launched by LONGi Green Energy in Xi'an in March 2021 to extend
    the parent's solar-led decarbonization strategy into large-scale water electrolysis. Public sources show a business centered
    on alkaline electrolyzer stacks, integrated hydrogen-production systems, modular plant architecture, and digital O&M tools,
    with project references in Uzbekistan, Norway, and Namibia plus a reported 500+ MW order footprint across 10 countries and
    regions by late 2025. The company appears strategically important and well capitalized for category expansion, but it remains
    privately opaque on standalone profitability, backlog quality, and exact post-funding ownership.
  foundedDate: '2021-03-31'
  founders:
    - name: Li Zhenguo
      role: Formation chairman and parent founder
      background: Founded LONGi Green Energy and sponsored LONGi Hydrogen's 2021 formation inside the parent group's decarbonization strategy.
      claimRefs: [CO007, CO002]
  foundingLocation: Xi'an, China
  headquarters: Xi'an, Shaanxi, China
  productSummary: Large-scale alkaline electrolyzers, integrated hydrogen-production systems, modular plant packages, and digital O&M tools for industrial green hydrogen.
  customerFocus: Industrial decarbonization operators, renewable-hydrogen developers, ammonia and e-fuels projects, and energy/chemical/steel customers in China and export markets.
  businessModel: Capital-equipment sales for electrolyzer systems and BoP, plus project engineering support, modular system delivery, and lifecycle service / digital O&M attachments.
  stage: Series A / industrial scale-up
  fundingStatus: 2024 Series A reportedly raised about CNY 1 billion (about US$137.9 million) at a post-money valuation above CNY 10 billion; parent-company support remains strategic.
  disclosureProfile: private-undisclosed
