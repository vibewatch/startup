  topStrengths:
    - Parent-backed strategic position inside LONGi's global clean-energy ecosystem.
    - Credible alkaline-electrolyzer scale with 2.5 GW end-2023 capacity and a larger roadmap.
    - Real overseas project traction in Central Asia, Europe, and Africa rather than a domestic-only story.
    - Product roadmap spans core stacks, modular plant design, and digital O&M tools.
  topRisks:
    - Chinese electrolyzer overcapacity and price competition can compress margins before demand catches up.
    - Standalone subsidiary revenue, margins, cash burn, and cap-table rights remain largely undisclosed.
    - Export growth faces localization rules, trade friction, and policy dependence in target markets.
    - Parent-level solar downturn can tighten internal capital-allocation tolerance.
  unresolvedGaps:
    - Audited 2025 and Q1 2026 standalone revenue, gross margin, cash, and burn-rate disclosure.
    - Exact post-Series-A cap table, preference stack, and minority-investor governance rights.
    - Customer concentration, backlog aging, and order-to-revenue conversion evidence.
    - Confirmed realized manufacturing capacity and utilization beyond roadmap claims.
    - Full board roster and decision-rights map for the subsidiary.
