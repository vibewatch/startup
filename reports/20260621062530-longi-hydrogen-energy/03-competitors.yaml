chapter:
  number: 3
  title: Competitors
  summary: LONGi competes in a crowded alkaline-heavy field where domestic Chinese peers threaten price and share, while Western incumbents threaten trust, installed-base credibility, and export-market service depth. The clearest domestic adverse evidence is Sungrow’s public claim to number-one share in China, PERIC’s 2024 delivery leadership among Chinese suppliers, and Tianjin Mainland’s credible export and project record. LONGi’s best differentiators are standardized large-unit alkaline products, integrated project delivery, and solar-parent adjacency, but those moats are easier to defend in cost-sensitive projects than in applications where service depth, standards, and proven uptime dominate the buying decision.
sections:
- id: competitive-landscape
  title: 'Competitive landscape: direct peers, incumbents, and substitute answers to the same buyer job'
  body: 'The relevant competitive set for LONGi is broader than a list of alkaline manufacturers. The innermost ring is the Chinese alkaline pack: Sungrow, PERIC, Tianjin Mainland, and other domestic suppliers that compete most directly on delivered equipment price, project references, and local execution. These firms are the most important near-term competitive threat because they attack the same buyer problem with similar technology assumptions. The next ring is the globally scaled electrolyzer group: Nel, ITM Power, thyssenkrupp nucera, and HydrogenPro. Some are more PEM-heavy, some are more alkaline-heavy, but all bring stronger public proof on installed base, certified manufacturing, or international service coverage than LONGi currently discloses. The outer ring includes integrators, EPC-led offerings, and the status-quo decision to delay hydrogen capex or use incumbent lower-carbon pathways rather than installing a new electrolyzer asset.


    This framing matters because buyer criteria differ by project. A Chinese industrial site may care first about delivered capex and fast customization. A European project finance stack may care more about service support, contractability, and standards assurance. LONGi is positioned best in the first case and is trying to close the credibility gap in the second through export projects and the HydrogenPro partnership. But public evidence does not support a thesis that LONGi is clearly dominant across all customer classes. Instead, it supports a thesis that LONGi is one of several credible Chinese alkaline leaders pursuing export scale while stronger Western incumbents defend premium segments and service-sensitive buyers.'
