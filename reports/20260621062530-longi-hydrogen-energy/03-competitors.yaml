  - - HydrogenPro
    - High-pressure alkaline OEM and partner
    - 220 MW US delivery reference; Europe-focused cooperation with LONGi
    - Large alkaline projects needing pressure and local engineering support
    - Strong alkaline specialization plus European market access
    - Partnership blurs line between direct competitor and channel enabler
