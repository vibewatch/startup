  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、既有巨头，以及对同一买方任务的替代答案
        blocks:
          - type: paragraph
            body: >-
              隆基的相关竞争集合不止一张碱性制造商清单。最内圈是中国碱性阵营：阳光电源、PERIC、天津大陆，以及其他在交付设备价格、项目案例和本地执行上最直接竞争的国内供应商。这些公司是近期最重要的竞争威胁，因为它们用类似技术假设攻击同一个买方问题。下一圈是全球规模化电解槽集团：Nel、ITM
              Power、thyssenkrupp nucera 和 HydrogenPro。有些更偏
              PEM，有些更偏碱性，但它们在已装机基础、认证制造或国际服务覆盖上都有比隆基当前披露更强的公开证明。最外圈包括集成商、EPC 主导方案，以及推迟氢能 capex
              或采用既有低碳路径、而不是安装新电解槽资产的现状选择。


              这个框架重要，因为买方标准因项目而异。中国工业场址可能首先看交付 capex 和快速定制。欧洲项目融资组合可能更看服务支持、合同可执行性和标准保障。隆基在第一种场景中定位最好，并试图通过出口项目和
              HydrogenPro
              合作来弥合第二种场景的可信度缺口。但公开证据并不支持隆基在所有客户类别中明显占优的判断。相反，它支持的是另一个判断：隆基是几家可信中国碱性龙头之一，正追求出口规模；与此同时，更强的西方既有厂商在防守高端细分市场和服务敏感型买方。
