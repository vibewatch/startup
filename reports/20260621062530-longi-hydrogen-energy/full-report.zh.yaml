    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈、用户工作流与解决方案范围
        blocks:
          - type: paragraph
            body: >-
              隆基氢能把大规模碱性水电解系统卖进基础设施工作流，而不是泛泛实验室或试点场景。公开记录始终把公司放在工业绿氢应用中，比如绿色氨、e-fuels、冶金，以及离网或并网制氢。产品家族现在层次分明。ALK Hi1
              仍是旗舰电流密度碱性平台，带有量化的电耗、压力、负荷范围和寿命主张。更广的组合加入了 ALK G 以扩大单机产量，HyBlock 面向工厂预制的户外模块化部署，HySmart
              则用于工厂级数字化运维。这很重要，因为它显示隆基试图捕捉比单纯电解槽销售更多的项目栈价值。可持续发展页面通过描述全生命周期服务强化了同一定位，服务包括项目设计、经济性分析、瞬态仿真验证和全链条产品供应。换句话说，公司希望被当作低
              LCOH 氢能项目的系统集成商来承销，而不只是电解槽供应商。
