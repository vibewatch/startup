      - number: '3.3'
        title: 能力、定价、打包与分销对比
        blocks:
          - type: paragraph
            body: >-
              公开技术对比显示，中国碱性阵营内部的同质性比营销语言暗示的更高。隆基 ALK Hi1 和 PERIC 公开的碱性产品都引用 4.3 kWh 级别电耗和高氢气纯度。天津大陆 FDQ1000 页面也指向 99.9%
              氢气纯度和 1,000–1,500 Nm3/h 产量。这意味着，面对所有国内对手，隆基并没有在单一可见技术指标上明显取胜。它更好的公开论据是系统设计和项目打包：更大的标准化单元、更低占地、集成
              balance-of-plant，以及从产品页走向出口调试的可记录路径。


              定价证据更薄。独立分析师同意中国碱性设备显著低于西方替代品，但也警告买方经常在比较不同范围。西方交钥匙系统通常打包工厂级基础设施和更高标准支持，而中国报价可能突出电解槽或部分系统数字。一旦出口项目需要本地服务、认证和可靠性支持，真实竞争差距就会收窄。这正是
              HydrogenPro 合作重要的原因。它不只是制造合作，而是对能力缺口的分销和服务回答。隆基可以凭成本和项目案例赢得买方注意，但商业问题在于，它能否把这些优势与足够的服务信心打包起来，在中国以外项目中击败
              Nel、thyssenkrupp nucera 或 ITM 这样的公司。
