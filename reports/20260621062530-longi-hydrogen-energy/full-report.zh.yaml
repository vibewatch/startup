              交易中承诺向这家挪威 OEM 投入约 NOK 70 million，作为更广泛合作轮次的一部分；2025 年 5 月 Oslo Bors 文件披露了精确认购股份和价格。母公司支持对充足性仍然相关，因为隆基
              2026 年一季度更新称，集团保持安全现金储备，资产负债率为 64.43%，有息负债比例为 22.89%。问题在于，这些来源都没有披露隆基氢能自身现金余额、月度
