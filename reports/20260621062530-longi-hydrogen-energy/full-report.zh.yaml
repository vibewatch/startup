      - number: '8.4'
        title: 情景、建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确输出应是一组情景区间，而不是一个被强行辩护的单一内在价值。如果 LONGi
              借助母公司支持和伙伴本地化，在行业整合摧毁定价前把成本优势转化为耐久订单，牛市情景可以支撑报道中的私募估值。基准情景应打折，因为公开同行、政策依赖和缺失的子公司披露都反对一开始就支付完整战略溢价。熊市情景也很容易想象：本地化壁垒收紧、国内需求支持不及预期，或上市同行倍数再次压缩，这轮私募估值不再像底部，而更像周期高点的乐观。由于公开记录不包含经审计的子公司收入、毛利率、优先权结构或客户集中度数据，有证据支撑的建议是继续研究，而不是买入或回避。下一轮尽调如果能清楚回答三个问题，最能改变判断：子公司在
              2025 年和 2026 年 Q1 实际赚了多少，2024 年融资附带哪些权利和清算优先权，以及欧洲策略有多少已经具备投标准备，而不是仍停留在愿景。
