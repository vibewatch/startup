      - number: '8.3'
        title: 战略选择权与政策、执行折价
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen 确实拥有真实战略资产，足以支撑它相对弱势同行享有溢价。它嵌在一个大得多的工业母公司里，已经融到不小的资本，声称拥有可观国内份额，并已通过 HydrogenPro
              搭建面向欧洲的桥梁，而不是等待本地化规则变松。这些都是真正的正面因素。问题在于，每一项仍有条件。母公司支持并不告诉你子公司的独立利润率。市场份额和产能声明在供给过剩行业里含金量更低。欧洲选择权受政策筛查约束，而这些筛查明确为加强本地供应安全而设计。即便技术故事也只是不错，但不明显独特：公开来源把
              LONGi 和 HydrogenPro 的领先碱性效率指标放在相近区间。于是，这变成一个典型的成长股权难题。上行情景存在，因为 LONGi
              可能完成本地化、整合份额，并把战略位置转化为有利润的销量。折价情景也存在，因为政策塑造的市场、缺失的子公司披露和出口摩擦，在执行得到证明前通常都应吃估值折扣。
