companyProfile:
  summary: >-
    隆基氢能是隆基绿能 2021 年 3 月在西安推出的氢能装备子公司，意在把母公司以光伏为核心的脱碳战略延伸到大规模水电解。公开资料显示，公司业务围绕碱性电解槽、集成制氢系统、模块化工厂架构和数字化运维工具展开；截至 2025
    年底，公司在乌兹别克斯坦、挪威、纳米比亚已有项目案例，并据称在 10 个国家和地区累计拿到 500+ MW 订单。公司对品类扩张具备战略重要性和资本支撑，但在独立盈利能力、在手订单质量和融资后精确股权结构上仍相当不透明。
