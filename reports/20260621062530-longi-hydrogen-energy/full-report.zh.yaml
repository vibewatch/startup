      - number: '2.2'
        title: 用供给、交付与成本视角测算市场
        blocks:
          - type: paragraph
            body: >-
              用“氢能市场很大”这种泛泛框架来承销隆基并无帮助。更紧、更可防守的视角，是制造产能、实际项目需求和已交付系统之间的错配。S&P Global 把 2024 年中国电解槽制造产能估为 39 GW；VNZ 报告
              2024 年全球交付量只有 3.2 GW；S&P 又引用当年前十个月中国招标需求仅 693 MW。这一缺口是本章最重要的市场规模事实：供给端已经扩张，但需求兑现仍窄且不均衡。VNZ 的 1.44 GW
              中国交付数据说明中国仍是最大交付目的地，但即便如此，也只是已宣布或已建制造能力的一小部分。对投资者来说，相关的 TAM/SAM/SOM
              顺序因此不是自上而下的氢能宏观预测，而是从全球制造产能，到已交付系统，再到真正投运并运行的参考项目这一受限漏斗。


              成本证据强化了同一结论。CRU 和 S&P 都显示中国碱性设备确实在压低成本，但也警告比较常常不是同口径，因为中国报价经常排除工厂级
              BoP、安装或出口标准适配。即便标准化之后，证据仍指向中国碱性系统的重大成本优势；不过，市场后果是利润率被压缩，而不是自动形成持久价值获取。隆基自己的产品页面强调标准化、更大单元规模和更小占地，以此降低
              LCOH。这符合更广泛的市场模式：买方奖励的是更低的交付系统成本，而不是新化学路线。承销难点在于，公开来源没有披露隆基的实际销售价格、项目级毛利率或已装机利用率，因此经济机会的规模比利润池质量更清楚。
