      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开参考项目显示，隆基并不是卖给单一同质买方。在乌兹别克斯坦，直接项目结构结合了项目开发商、EPC 伙伴和氨应用场景；在挪威，买方逻辑围绕 e-fuels
              和工业脱碳；在纳米比亚，终端使用概念横跨运输、离网发电、铁路和海事应用。每个案例里，直接买方都更接近工业项目发起方或 EPC
              主导的交付组合，而不是泛泛的氢气消费者。这很重要，因为预算所有权通常在项目开发商、工业运营商、公用事业或基础设施发起方手里，他们承销的是整个项目，不只是购买一套电解槽。隆基围绕“绿电 + 绿氢”和 BoP
              交付的自身定位，也支持这一判断。


              公开证据中的采用路径也很具体。隆基从产品发布和国内产能建设，走到出口参考项目，再到声称签约国家覆盖 10
              个、全球触达更广。公司价值主张目前并不是靠透明的重复出货进入商品化售后市场来证明，而是靠一串标杆项目证明其国际标准合规、模块标准化和海外调试支持能力。这让买方地图更窄，但也更实在：近期最可信的市场，是碱性技术可接受、电力成本决定性、项目可背书性比高端性能灵活性更重要的大型工业或基础设施氢能项目。
