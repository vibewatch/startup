      - number: '1.4'
        title: 产品、制造规模与商业化里程碑
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的氢能装备子公司来说，隆基氢能的运营故事发展得相当充分。隆基氢能 2023 年推出 ALK Hi1 系列，声称最低直流电耗为 4.0 kWh/Nm³，随后又搭配更大的 ALK G 系列；母公司 2023
              年年报称，ALK G 单槽产氢量达到 3,000 Nm³/h。隆基称 2023 年底制造产能达到 2.5 GW，位居行业第一；Taiyang 和 H2CE 也描述了无锡、西安合计 2.5 GW 的布局，并给出
              2025 年 5–10 GW 产能目标。商业上，公司已从国内示范走向出口项目：为乌兹别克斯坦风电制氨项目提供四台 1,000 Nm³/h 设备，为计划 2026 年投运的挪威 e-fuels 项目提供多台 Hi1
              设备，在纳米比亚项目服务多部门交通需求，并截至 2025 年 10 月在 10 个国家和地区累计获得超过 500 MW 全球订单。2024 年年报还称，公司年内交付首个大型海外项目并拿下欧洲重大订单；这比单纯签署
              MOU 更能证明商业化进展。
