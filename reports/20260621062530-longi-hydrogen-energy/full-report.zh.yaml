      - number: '3.4'
        title: 护城河耐久性、切换成本与不利竞争证据
        blocks:
          - type: paragraph
            body: >-
              隆基最可信的护城河，在于买方想从一家熟悉公用事业级可再生能源供应链的公司采购成本优化的碱性系统。光伏母公司的邻近性重要，因为它契合买方对“绿电 +
              绿氢”项目的需求，也可能帮助隆基协调电力电子、采购和大型项目执行。乌兹别克斯坦、挪威和纳米比亚的出口案例强化了这条护城河，因为它们证明隆基不只是把国产电解槽卖进中国试点。但这些优势并非牢不可破。它们在成本敏感、工业规模应用中最强；在高端市场中更弱，因为那里的买方更重视已装机基础、运营支持和国际合同证明。


              不利证据足够强，本章不能默认把隆基视为品类领导者。阳光电源公开声称中国份额第一。VNZ 的 2024 年数据集显示，PERIC 在交付 MW 上领先阳光电源，并识别了隆基、PERIC
              和天津大陆重叠的项目。独立来源也保留了绝对产能排名上的分歧，并显示更大市场中只有少数已交付电解槽处于运行状态。这意味着，买方真正的护城河测试不是谁声称拥有最大名义工厂，而是谁能在客户需要的具体司法辖区完成调试、服务和支持。公开来源仍未揭示重复采购行为、多供应商并用比例或各供应商投运后
              uptime，因此切换成本耐久性仍更像假设，而不是已经证明。
