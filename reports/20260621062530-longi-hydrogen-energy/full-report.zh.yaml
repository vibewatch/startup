              公开记录足以证明采用正在发生，但范围太窄，还证明不了组合耐久性。LONGi 披露全球订单超过 500 MW、覆盖 10
              个国家或地区，却没有披露多少项目已在运行、对应多少客户、待交付订单有多少集中在少数账户，或重复中标是否来自同一批开发商生态。即便最好的公开案例也高度集中：乌兹别克斯坦、Hydrogen Dune
              和未具名的挪威项目承担了大部分证明。外部市场来源还给出真实警示。中国电解槽行业仍面临下游需求偏弱、标准缺口和投产滞后，这意味着已签订单并不等于成熟且留存的客户关系。实际含义是，LONGi
              的客户章节通过了具名证明门槛，但没有通过耐久性门槛。投资人可以把公司视为具备国际可信度、商业前景不错，但在押注可复制性之前，仍应要求管线质量、集中度和服务留存数据。
