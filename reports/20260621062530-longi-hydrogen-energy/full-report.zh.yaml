    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: LONGi Hydrogen 从 2021 年成立，到约四年内进入工业规模、拿到第三方融资并交付海外项目；但这一切发生在行业定价环境恶化之中。
    data:
      items:
        - date: 2021-03
          label: 公司在西安成立
          detail: LONGi 在集团架构内设立专门氢能子公司。
          tone: positive
        - date: 2023-02
          label: ALK Hi1 发布
          detail: 新碱性系列支撑效率和 LCOH 销售话术。
          tone: positive
        - date: '2023'
          label: 营业额突破 RMB 100m
          detail: 母公司年报称子公司跨过首个九位数收入门槛。
          tone: positive
        - date: 2023-12
          label: 产能达到 2.5 GW
