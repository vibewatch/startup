        title: 缓释措施、监测指标与止损标准
        blocks:
          - type: paragraph
            body: >-
              这组风险之所以仍可投资、而不是直接致命，是因为 LONGi Hydrogen 确实有可信的缓释因素——只是公开证明还不足以把剩余风险降到中高以下。母公司资产负债表支持很重要，因为相比纯氢能初创公司，LONGi
              能在坏周期里更久地继续给氢能业务输血。2024 年融资给子公司留下了本地化、招聘和吸收亏损的空间。HydrogenPro 投资和 OEM
              协议也显示，管理层不是被动等待欧洲打开。但这些缓释因素仍有条件。投资人不应把战略当证据，除非三件事可见：第一，面向欧洲的供应能通过韧性和本地化筛查；第二，订单转化不靠破坏性让利；第三，现场运营表现足够耐久。如果
              LONGi 扩产快过需求端承购形成，如果成本下降前政策支持先变弱，或如果欧洲商业化打开前伙伴主导的出口桥梁先削弱，投资论点就会破裂。
