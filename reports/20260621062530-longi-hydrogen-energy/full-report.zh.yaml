      - number: '1.2'
        title: 管理层、治理与所有权能见度
        blocks:
          - type: paragraph
            body: >-
              管理层轮廓部分可见，但披露并不完整。早期公开报道把公司注册与隆基创始人李振国担任董事长兼总经理联系在一起；当前经营披露更多围绕总裁马军、副总裁王英歌，以及隆基绿能副总裁、隆基氢能董事张海濛展开。这说明子公司仍紧嵌在母公司高管体系中，而不是以高度独立的公开治理面貌运作。尽管如此，留存的官方来源没有发布完整董事名单、股东比例或
              Series A 后股权结构；投资者能识别关键高管和母公司的控制姿态，但还无法从公开文件精确勾勒决策权、董事会委员会或稀释情况。
