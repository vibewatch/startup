    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、母公司关系与使命
        blocks:
          - type: paragraph
            body: >-
              隆基氢能于 2021 年 3 月在西安注册，是隆基绿能集团内的控股子公司，反映出母公司决定把光伏驱动的脱碳能力扩展为更宽的“绿电 +
              绿氢”战略。官方和近官方表述对公司使命口径一致：它想成为大规模碱性水电解装备和集成绿氢解决方案的领先供应商，而不只是零部件制造商。当前产品面覆盖碱性电解槽、完整制氢系统、模块化工厂架构和数字化运维工具，因此这门生意更像工业设备平台，而不是单一
              SKU 制造商。隆基 2023 和 2024 年年报也显示，母公司把氢能视为与绿色甲醇、绿色氨以及更广泛工业脱碳绑定的战略邻近业务，而不是边缘试验。
