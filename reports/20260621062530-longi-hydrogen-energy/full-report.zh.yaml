        title: 架构、模块化与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开来源可见的技术架构，指向一个常规碱性核心，外面包裹着异常明确的工业化主张。ALK Hi1 标称 4.1–4.3 kWh/Nm3 直流电耗、30–110% 负荷范围、1.6 MPa 运行压力和 200,000
              小时寿命目标。产品页面还强调 4 对 1 气液分离模块、标准化模块集成、一键启停、自动链式停机，以及横跨生产管理、DCS 监控和 PLC 设备管理的三级控制栈。HyBlock
              把运营模式从设备延伸到交付架构：面向百兆瓦到吉瓦级项目的户外模块化单元，与森松预制，把现场复杂度转移到工厂装配。HySmart 又把产品延伸到运营环节，承诺数字孪生、预测性诊断、超过 30
              项安全指标跟踪，以及可测量的人工和能源节省。合在一起，公开证据支持一个判断：隆基的差异化越来越来自打包系统设计、项目模块化和数字化运维，而不只是电化学本身。
