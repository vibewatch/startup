      - number: '8.2'
        title: 经济性与公开可比公司组
        blocks:
          - type: paragraph
            body: >-
              公开可比证据并不乐观。到 2026 年 6 月，ITM Power、Nel ASA 和 thyssenkrupp nucera 的股权价值都在 LONGi Hydrogen
              报道私募估值所隐含水平附近或以下；HydrogenPro
              的市值更小，而且仍显示亏损、收入有限，并处在战略评估流程中。这些公司没有一家是完美的一对一可比对象，但这正是重点：如果连拥有可见投资者关系基础设施的上市专业公司，都无法稳定超过 LONGi Hydrogen
              的隐含估值，那么举证责任就转到 LONGi 身上——它必须证明更高增长、更强利润率或特权式市场准入。成本分析进一步支持谨慎。CRU 和 S&P
              都认为，中国成本领先是真实的，但不等于健康经济性，因为低价由政策支持、激烈竞争和需求仍落后于已装制造产能的市场共同驱动。因此，投资人不应只因为 LONGi 能规模化制造，就支付稀缺性倍数。
