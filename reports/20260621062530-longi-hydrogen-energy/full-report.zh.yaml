  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: standard
    summary: 受约束的规模测算视角：从中国制造规模，到已交付市场量，再到 LONGi 有证据支撑的参考足迹。
    data:
      nodes:
        - id: tam
          label: 外层：中国制造基础
          detail: 2024 年中国电解槽年制造产能为 39 GW；2023 年碱性占比 >93%，交付仍由碱性主导。
        - id: sam
          label: 中层：已交付市场
          detail: 2024 年全球交付 3.2 GW，其中 1.44 GW 落在中国。已交付市场远小于制造产能。
        - id: som
          label: 内层：LONGi 有证据支撑的足迹
          detail: 2024 年报道披露当前产能 2.5 GW，2025 年目标 5-10 GW，并有挪威、乌兹别克斯坦和纳米比亚出口参考。
    approximationNotes: 该金字塔使用制造、交付和公司足迹三层，而不是泛泛的氢能 TAM。由于公开来源没有披露 LONGi 已实现的年度出货量或已定价在手订单，测算刻意受证据约束。
