      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              隆基所在市场的增长逻辑是真实的。中国 2026
              年氢能战略正从设定目标转向激活需求，包括按绩效奖励的城市群、明确的终端用氢价格目标，以及在氨、甲醇、交通和冶金中建设工业应用场景的清晰压力。中国碱性设备的成本优势也足够真实，即便按同口径系统比较，中国 OEM
              仍在结构上比多数西方同行更便宜。隆基自己的路线图与这种市场逻辑方向一致：更大的标准化单元、更低的 balance-of-plant
              强度，以及可出口的集成系统。如果需求激活成功，隆基应当能在最看重交付成本和工业规模的那部分市场中占住位置。


              但不利证据同样重要。供给过剩已经可见，公开成本数据表明部分制造商接近现金成本运营，而 VNZ 发现已交付设备只有 43% 处于运行状态，说明制造规模不等于部署价值。S&P
              还强调了标准缺口、贸易壁垒，以及围绕跟随可再生电源运行灵活性的工程妥协。中国市场正从国内价格竞争转向出口可信度，这些问题会直接影响隆基。剩余尽调缺口包括实际系统定价、年度出货量、已装机利用率，以及隆基的出口案例能否转化为可复制的多国订单，而不是一次性项目胜利。在这些变量可见之前，这个市场应被视为战略重要，但利润率风险仍高。
