      - number: '4.4'
        title: 不利经济性与市场压力
        blocks:
          - type: paragraph
            body: >-
              不利情形押在利用率和利润率上，而不是缺少产品市场意图。S&P 的 39 GW 与 693 MW 需求错配、CRU 对亏损制造商的描述，以及 Asia Times
              对行业整合的警告，都指向一个市场：即便技术可信的供应商，也可能难以把产能转化为盈利吞吐量。母公司状况放大了这一风险。隆基绿能在 2024 年录得近十年来首次亏损，意味着氢能扩张是在母公司核心 PV
              经济性承压时推进，而不是站在轻松富余的位置上推进。出口市场有帮助，但会带来标准、关税和本地化摩擦。World Bank 相关摘要、H2Tech 和 Tim Harper
              都强调，中国规模正在拉低全球价格底线，同时也招致海外政策回应；因此，隆基氢能的利润机会可能在国际版图扩大时同步收紧。
