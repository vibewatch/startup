        title: 收入模式与商业范围
        blocks:
          - type: paragraph
            body: >-
              隆基氢能的变现面比单纯销售电解槽更宽。官方项目发布显示，公司销售完整碱性电解槽套件，包含供电、控制、气液分离、纯化和更广的 BoP 范围。后续 HyBlock 和 HySmart
              发布把这一模式延伸到模块化工厂架构和数字化运维，说明未来收入可能来自工程化系统设计、工厂预制模块、调试、全生命周期服务和软件驱动的运营支持。证明这些不只是潜在项目叙事的最强公开证据，是母公司 2023
              年年报称隆基氢能 2023 年营业额超过 RMB 1 亿元，以及 2024
              年年报称业务交付首个大型海外项目并获得欧洲重大订单。因此收入显然已经存在，但公开来源没有披露产品线组合、在手订单价值，或设备与服务各自贡献的收入比例。
