      - number: '7.2'
        title: 市场结构、需求与经济性风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的非公司特定风险，是中国电解槽制造规模已经跑在短期可实现需求前面。多家独立来源指向同一方向：S&P 描述了年产能与招标需求之间的巨大缺口；Sohu 汇总的 GGII
              数据称，出货量仍远低于行业铭牌产能；MERICS 和 H2Tech 都预计行业会整合。即便 LONGi Hydrogen 比小型竞争者更强，它仍卖进同一个通缩性的行业结构。设备降价能帮项目开发商，却也会同时摧毁
              OEM 利润率。CRU
              的工作在这里尤其重要，因为它把电堆价格观感和全系统经济性拆开：中国的名义成本优势确实存在，但很大一部分由政策和竞争驱动，无补贴经济性下的商业可行性仍未解决。含义是，如果估值、招聘和工厂扩张决策建立在牛市叙事上，一旦氢能需求爬坡慢于工厂建设，这些决策就会变成负担。
