    type: flow
    layout: wide
    summary: 单位经济性逻辑可以看到系统效率和市场定价，但到了利润率披露和产能利用率就断开了。
    data:
      nodes:
        - id: power_cost
          label: 电力驱动 LCOH 的 70–80%
          detail: 管理层访谈称，电力成本主导制氢经济性。
          tone: neutral
        - id: efficiency
          label: Hi1 效率 4.0–4.3 kWh/Nm³
          detail: LONGi 把低电耗作为核心竞争杠杆来营销。
          tone: positive
        - id: market_price
          label: 中国市场价格接近 $185–200/kW
          detail: S&P 称，1,000 Nm³/h 系统如今定价已接近生产成本。
          tone: warning
        - id: oversupply
          label: 39 GW 产能 vs 693 MW 需求
          detail: 严重的利用率错配，可能把技术优势变成低利润率销量。
          tone: negative
        - id: unknown_margin
          label: 毛利率未知
          detail: 没有公开数据证明 LONGi 能把效率转化为有吸引力的利润。
          tone: warning
      edges:
        - from: power_cost
          to: efficiency
        - from: efficiency
          to: market_price
        - from: market_price
          to: oversupply
        - from: oversupply
          to: unknown_margin
    approximationNotes: 公开证据支持这条逻辑链，但不支持终端经济性；利用率和质保成本仍未披露。
    claimRefs:
      - CI009
      - CI010
      - CI014
      - CI016
      - CI027
  - id: FI003
    title: 财务估算区间
    type: range
    layout: wide
    summary: 公开成本基准显示，中国碱性电解槽经济性在现金成本投标、已报告项目成本和无补贴可比成本之间差异巨大。
    data:
