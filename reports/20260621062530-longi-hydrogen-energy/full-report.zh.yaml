  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代路径
        blocks:
          - type: paragraph
            body: >-
              隆基氢能服务的市场，最适合定义为大规模碱性电解槽设备，以及把可再生电力转化为工业氢所需的系统级硬件和工程。纳入支出不只是电解槽本体。隆基公开材料反复把产品定位为集成制氢解决方案，覆盖电解槽、控制系统、气液分离、纯化和面向氨、e-fuels、炼化、交通与电力应用的
              BoP 模块。ALK Hi1 和 ALK G
              页面把这个边界讲得很具体：产品作为标准化工业制氢系统出售，附带运行压力、负荷范围、占地和资本开支主张，而不是孤立的实验室部件。因此，合适的市场视角是绿氢工厂的项目设备与项目集成，尤其是碱性技术可接受、买方更关心全生命周期氢成本而非高端
              PEM 灵活性的场景。


              边界之外是下游燃料电池汽车、氢能零售，以及隆基不直接变现的纯商用氢承购经济性。这些领域只有在拉动上游电解槽系统需求时才相关。相近替代路径仍具战略意义：PEM
              电解槽、常压碱性系统和西方交钥匙系统争夺同一批脱碳预算，而现状灰氢、项目延期或替代电气化路径也会吸走本可投向隆基系统的资本。公开第三方研究还显示，中国当前市场压倒性地以碱性为主，这契合隆基定位，但也把近期可服务组合收窄到成本敏感、工业规模应用，而不是自上而下叙事里常见的整个氢能经济。
