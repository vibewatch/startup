      - number: '3.2'
        title: 竞争对手画像：规模、技术范围与战略方向
        blocks:
          - type: paragraph
            body: >-
              隆基自己的画像建立在标准化大规模碱性产品和一串出口参考项目之上。阳光电源的公开说法强调国内份额领先和实证研发平台。PERIC
              把自己定位为拥有强碱性资质和邻近氢能系统业务的综合氢能装备供应商。天津大陆展现出长期专业厂商特征：出口活动显著、运营 5 MW
              参考项目、工厂基础扩大。这些都是有意义的国内对手，因为它们竞争同一个宽泛的工业氢叙事，并不要求客户采用根本不同的技术路径。


              西方和国际规模化公司则不同。Nel 强调制造规模、服务网络和全球已装机基础。ITM 强调 PEM 工厂模块和欧洲项目相关性。thyssenkrupp nucera
              强调极大的已安装和已签约产能，以及数十年电解经验。HydrogenPro
              值得注意，因为它既是竞争对手，也是分销桥梁：它自己销售高压碱性系统，但与隆基的合作也证明隆基希望在欧洲补强本地市场可信度和服务能力。因此，这组画像对比支持一个更细的结论：隆基在中国的直接竞争，最强点是成本和碱性专业化；出口时最难打的对手，则是那些运营证明披露更好、特定市场服务深度更强的公司。
