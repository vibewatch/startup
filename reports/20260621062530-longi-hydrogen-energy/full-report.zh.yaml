      - number: '4.5'
        title: 财务结论与承销阻断点
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个混合但方向偏正的商业结论，以及一个较弱的承销结论。商业上，隆基氢能已经跨过从原型故事到创收工业业务的门槛：2023 年营业额超过 RMB 1 亿元，国内碱性中标份额领先，出口案例增加，并有资金支持
              HydrogenPro 等合作。财务上，核心阻断点在公开资料中仍没有被解决：没有披露 2024 或 2025 年独立收入，没有毛利率、EBITDA、订单 backlog 价值、现金余额、burn
              rate，也没有营运资本画像。因此，报道中的 >RMB 100 亿元投后估值建立在高度不完整的数据集上；以最后一个公开营业额门槛衡量，除非 2023
              年后收入大幅跃迁，否则意味着极高的收入倍数。正确结论不是公司没有进展，而是没有数据室就无法有信心地承销。
