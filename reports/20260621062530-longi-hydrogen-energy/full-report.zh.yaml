      - number: '1.5'
        title: 不利背景、战略约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最大的不利因素不只是产品不成熟，而是市场结构。S&P Global 估计，中国电解槽制造产能在 2024 年达到每年 39 GW，而前十个月招标需求只有 693 MW；CRU
              则认为，许多制造商在接近现金成本的价格上运营，亏损被补贴或更强势的母公司业务掩盖。MERICS 和 Asia Times
              同样把中国氢能装备视作另一个产能过剩场景，产业政策、出口压力和贸易摩擦都可能扰动回报。隆基无法隔绝这种压力。母公司 2024 年年报录得近十年来首次亏损；尽管 2026
              年一季度更新仍称现金储备安全，这一背景意味着氢能扩张必须在集团内部争夺资本。公开尽调还有三个关键缺口：完整董事会构成、2024 年融资后精确持股，以及经审计的子公司独立财务报表。
