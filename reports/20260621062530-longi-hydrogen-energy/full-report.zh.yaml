      - number: '1.3'
        title: 融资历史与资本化
        blocks:
          - type: paragraph
            body: >-
              公开融资证据指向两次不同的资本化步骤。第一，中国商业报道称，隆基绿能投资和六名隆基高管在 2023 年向子公司注入 RMB 5 亿元，对应投前估值约 RMB 30
              亿元，先于外部融资建立了更大的内部资本基础。第二，多家 2024 年来源报道了约 RMB 10 亿元的 Series A 轮；Pedaily 和 163.com 都称投后估值超过 RMB 100
              亿元，并列出广发信德、永华投资、隐山资本、陕西基金、朱雀以及陕西旭强瑞清洁能源等投资方。母公司 2024 年年报没有重述这轮融资的新闻口径金额，但确认少数股东对隆基氢能非同比例增资，为集团资本公积增加 RMB
              3.427 亿元，给出了子公司在该期间获得外部股权融资的直接备案级证据。CB Insights 也记录了 2024 年 7 月 12 日的一笔 Series
              A，包含六名投资者，大体印证了时间点，但精确持股比例仍未披露。
