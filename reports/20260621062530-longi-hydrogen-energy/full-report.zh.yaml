  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及私募估值到底意味着什么
        blocks:
          - type: paragraph
            body: >-
              公开领域最强的估值事实，不是折现现金流输入，而是 2024 年融资本身。多篇中文报道描述了一轮约 CNY 10 亿的 Series A，投后估值超过 CNY 100 亿；Energy Iceberg 后来还把
              LONGi Hydrogen 列入中国 2024 年氢能融资周期的主要赢家。这很重要，因为它说明，在全球部署怀疑加重的背景下，成熟投资人仍愿意承销这个品类。但一轮融资不等于公允价值。CB Insights
              仍只显示占位式估值模型，也没有公开备案锁定确切投后估值、清算优先权或任何反稀释条款。上市母公司 2025 年和 2026 年 Q1 披露强化了 LONGi
              对氢能的战略承诺，但没有拆出子公司收入或现金消耗。所以，私募估值作为市场信号是真实的，作为估值锚却很弱：它证明当时有风险偏好，不证明今天的入场价格在基本面上有吸引力。
