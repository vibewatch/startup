  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen 卖进的是一个由政策而不只是技术决定项目能否融资的行业。中国 2026 年 3
              月氢能试点是利好，但不是空白支票：三部委通知把支持做成竞争制，给城市群奖励设上限，并明确警示低水平重复建设。这些措辞很关键，因为它传递出国家更偏好有纪律地形成需求，而不是不受控制地扩张 OEM
              产能。到了中国以外，风险从补贴设计转向市场准入。欧盟委员会第二轮 Hydrogen Bank 拍卖按 Net-Zero Industry Act
              的逻辑加入韧性标准，这些标准瞄准的是供应安全和欧洲产业领导力，而不是单纯最低成本采购。对 LONGi Hydrogen
              来说，只靠出口中国电堆的欧洲策略，即便还没进入客户层面的尽调，也会先遇到政策摩擦；本地化或合规伙伴产能一旦延迟，海外管线转化为订单的速度就会放慢。
