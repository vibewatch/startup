              公开成本故事比公开 P&L 更清楚。隆基声称 ALK Hi1 可在 4.0–4.3 kWh/Nm³ 运行；Taiyang 和 HydrogenPro 披露也支持一个判断：高效中国碱性系统现在围绕低 4
              kWh/Nm³ 区间竞争。定价方面，S&P Global 报道称，中国 1,000 Nm³/h 碱性电解槽系统价格从 2023 年的 $200–224/kW 降至 2024 年上半年的
              $185–200/kW，已接近生产成本。CRU 的项目工作把 2024 年以来中国碱性全系统工厂成本置于约 $1.0 million/MW，并可能在 2026 年走向 $0.8
              million/MW；非中国市场则略高于 $2.0 million/MW。但 CRU 也认为，一个技术等效、商业可行且无补贴的中国系统更接近 $1.3
              million/MW。换句话说，隆基确实享有成本优势，但其中一部分可能来自政策支持、被压缩的利润率和运营取舍，而不全是纯经济剩余。
