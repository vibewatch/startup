      - number: '7.3'
        title: 运营、伙伴与出口执行风险
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen 的出口故事说得通，但公司不会因为找了伙伴就摆脱执行风险。HydrogenPro 联盟在战略上合理，因为它能提供面向欧洲的制造、工程和服务能力，不必逼 LONGi
              独自搭完所有东西。但同一结构也把风险集中到一个伙伴身上，而 HydrogenPro 在 2026 年 Q1 公开进入战略评估，以处理流动性和增长选择。HydrogenPro
              的积压订单和后期管线显示它有商业相关性，但亏损和有限现金余额也显示它脆弱。因此，出口风险有两层：第一，随着本地化规则和韧性标准收紧，纯中国出口更难赢下欧洲；第二，绕开这些规则的桥梁依赖的交易对手，财务上还没有足够稳固。与此同时，更广泛的技术性能争论仍然重要。Longi
              的效率声明足够可信，值得认真看待，但第三方报道继续提示，在间歇性可再生能源场景下，可靠性、适应性和衰减仍有隐忧。这种组合让国际扩张成为执行挑战，而不是简单的成本套利。
