  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投资准备度在战略背书上得分最高，在披露完整性和公开估值支撑上最弱。
    data:
      items:
        - label: 战略性母公司支持
          score: 4
          max: 5
          note: 大型母公司和战略承诺增强韧性
        - label: 技术可信度
          score: 3
          max: 5
          note: 公开证据显示性能有竞争力，但并非独一档
        - label: 公开估值支撑
          score: 2
          max: 5
          note: 上市同业多数低于私人估值标记交易
        - label: 披露完整性
          score: 1
          max: 5
          note: 没有单体经审计收入或股权结构细节
        - label: 政策依赖
          score: 2
          max: 5
          note: 需求形成仍依赖政策执行
        - label: 出口可选性
          score: 3
          max: 5
          note: 欧洲路径存在，但仍取决于本地化
        - label: 今日价格信心
          score: 2
          max: 5
          note: 基于情景，不是精确定价
    approximationNotes: 分数为定性投委会启发式判断，来自已审阅公开语料。
    claimRefs:
      - CV027
      - CV032
      - CV034
      - CV044
      - CV045
      - CV046
