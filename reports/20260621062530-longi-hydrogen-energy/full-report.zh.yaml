          tone: positive
        - date: 2024-12
          label: HydrogenPro 合作
          detail: LONGi 将战略投资与欧洲制造和服务合作绑定。
          tone: positive
        - date: '2025'
          label: 海外项目扩展
          detail: 乌兹别克斯坦、挪威和纳米比亚案例显示国际部署势头。
