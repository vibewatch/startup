        - 索取融资文件、更新版股权结构表和董事会批准文件
      - - 独立财务
        - 2025 年经审计收入、毛利率、EBITDA、经营性现金消耗和 2026 年 Q1 桥接
        - 看不到子公司实际赚了多少、烧了多少，就无法承销估值
        - 索取经审计的子公司报表和母公司合并桥接
      - - 订单质量
        - 在手订单构成、取消权、里程碑排期和客户集中度
        - 溢价倍数依赖耐久的已签约需求，而不是松散订单标题
        - 索取已签订单簿、客户群组和订单账龄
      - - 欧洲商业化路径
        - 面向欧洲的可投标采购、组装、服务和监管合规蓝图
        - 本地化是上行情景核心，也关系到能否避开出口摩擦
        - 索取与 HydrogenPro 的分工矩阵和欧洲投标清单
      - - 技术证明
        - 按产品代际划分的现场性能数据、衰减曲线和质保索赔
        - 技术同等还不够；估值上行需要大规模可融资的性能
        - 索取机队 KPI 包、故障率日志和质保准备金方法
    notes: 这些尽调问题按其推动建议和估值立场的速度排序，而不是按回答难易度排序。
    claimRefs:
      - CV006
      - CV021
      - CV035
      - CV043
      - CV044
