  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: longi-capacity
    missingEvidence: A reconciled manufacturer-level dataset for LONGi’s effective 2026 capacity, current utilization, and delivered annual shipments.
    whyItMatters: Independent sources preserve different numbers for current capacity and competitive ranking, which affects market-share framing and export readiness.
    diligencePath: Obtain LONGi project shipment disclosures, plant-level output data, or a paid manufacturer leaderboard extract that distinguishes nameplate capacity from effective throughput.
    relatedQuestionRefs:
    - QM019
    - QM022
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Current realized ASP, project margin, or project-level turnkey price for LONGi systems.
    whyItMatters: Without realized pricing, investors can observe market demand but cannot judge whether LONGi captures attractive economics or just participates in a price war.
    diligencePath: Request signed project pricing ranges, gross-margin bridges, or customer-side EPC cost sheets under NDA.
    relatedQuestionRefs:
    - QM020
  - type: missing-source
    severity: material
    topic: utilization-transparency
    missingEvidence: Installed-base utilization and post-commissioning operating data for LONGi systems outside marketing case studies.
    whyItMatters: Operational utilization is the clearest test of whether manufacturing growth is converting into durable market adoption.
    diligencePath: Request performance dashboards, O&M logs, or third-party owner references from commissioned Uzbekistan, Norway, or domestic plants.
    relatedQuestionRefs:
    - QM025
  - type: stale
    severity: minor
    topic: orderbook-granularity
    missingEvidence: A current 2026 orderbook by country, MW, and commissioning date for LONGi hydrogen systems.
    whyItMatters: Export momentum is a central part of the market thesis, but public references still read as episodic project announcements rather than a disclosed recurring backlog.
    diligencePath: Refresh after interim results or ask management for a geography-by-geography orderbook summary.
    relatedQuestionRefs:
    - QM022
