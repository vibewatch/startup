- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for LONGi
  - Diligence ask
  rows:
  - - Reward-for-performance city-cluster subsidies
    - Driver
    - 2026-2030
    - Supports real project demand instead of only manufacturing build-out
    - Which project classes are eligible and what offtake thresholds apply?
  - - Hydrogen price targets below RMB 25/kg nationally
    - Driver
    - 2030 target, visible in 2026 policy
    - Creates a public benchmark for cost-down roadmaps
    - Which regions can reach target economics with alkaline systems first?
  - - Chinese alkaline cost advantage vs Western turnkey systems
    - Driver
    - Current
    - Improves LONGi export competitiveness in cost-sensitive markets
    - How much of the apparent advantage survives export-standard adaptation?
  - - Domestic oversupply vs project demand
    - Constraint
    - Current
    - Pushes equipment pricing toward commodity levels
    - What are LONGi’s realized margins and backlog discipline?
  - - Only 43% of delivered units operational in VNZ dataset
    - Constraint
    - Current
    - Suggests commissioning, utilization, or project-readiness friction
    - How many LONGi units are operating at design load post-commissioning?
  - - EU / US trade and sourcing barriers
    - Constraint
    - Current
    - Raises cost and execution friction for export growth
    - How much localization or partner service coverage is needed by region?
  - - Standards and flexibility gaps
    - Constraint
    - Current
    - Could favor PEM or Western turnkey systems in demanding applications
    - Which certifications and operating profiles have LONGi already passed?
  - - Standardized larger-unit products and BoP integration
    - Driver
    - Current to near term
    - Creates a plausible route to lower project CAPEX and footprint
    - Are savings realized at project level or only in vendor marketing?
  notes: Rows mix demand drivers with underwriting constraints. Cost advantage is real, but so are utilization, standards, and trade-friction risks.
