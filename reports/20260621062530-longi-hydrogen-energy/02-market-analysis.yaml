callouts:
- calloutType: insight
  title: This is a funded-project equipment market, not a generic “hydrogen economy” TAM
  body: LONGi’s public evidence is strongest where real project sponsors buy standardized alkaline systems with BoP integration. Treating all downstream hydrogen use as addressable LONGi revenue would materially overstate the practical market.
  claimRefs:
  - CM002
  - CM008
  - CM009
  - CM012
- calloutType: strength
  title: Export reference projects make the market case more credible than domestic capacity headlines alone
  body: Norway, Uzbekistan, and Namibia matter because they show actual applications, standards compliance, and commissioning support. Those references are more underwriting-relevant than generic capacity targets.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM012
  - CM013
- calloutType: risk
  title: Oversupply and opaque realized pricing remain the chapter’s core adverse evidence
  body: China’s manufacturing scale already exceeds visible demand by a wide margin, while public sources still do not disclose LONGi’s realized selling price, gross margin, or utilization. That combination makes market size easier to believe than market quality.
