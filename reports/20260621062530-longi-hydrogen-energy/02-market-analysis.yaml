tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to LONGi
  rows:
  - - Large alkaline electrolyzer systems
    - Stacks, gas-liquid separation, purification, controls, skid modules, balance-of-plant integration
    - Fuel-cell vehicles, merchant hydrogen resale, downstream retail station economics
    - Project developers, EPCs, industrial operators
    - Core served market and the basis of current public references
  - - Integrated green-ammonia / e-fuels projects
    - Electrolyzer package plus power interface and plant integration
    - Ammonia synthesis loop or downstream fuel distribution economics
    - Developers, utilities, chemical sponsors
    - Most visible export reference set today
  - - Industrial decarbonization hydrogen plants
    - Hydrogen-production equipment for refining, metallurgy, chemicals, and power-to-X projects
    - End-product decarbonization savings not monetized by LONGi directly
    - Industrial asset owners and infrastructure sponsors
    - Likely largest budget pool if policy activation works
  - - Premium PEM-flexibility segment
    - Only the alkaline share that still clears buyer requirements
    - PEM premium justified by high dynamic-flexibility use cases
    - Buyers needing renewable-following flexibility
    - Important substitute path, but not LONGi’s current core
  - - Grey hydrogen status quo
    - None
    - Legacy fossil-based hydrogen production and delayed capex
    - Incumbent industrial hydrogen users
    - Main economic substitute because it anchors buyer willingness to pay
  - - Hydrogen ecosystem rhetoric
    - None
    - Vehicles, retail fueling, and broad “hydrogen economy” narrative without equipment budgets
    - Policymakers and commentators
    - Useful for sentiment but not for underwritten sizing
  notes: Boundary is set at equipment and system-integration spend for hydrogen production. Downstream use cases matter only when they translate into funded upstream projects.
