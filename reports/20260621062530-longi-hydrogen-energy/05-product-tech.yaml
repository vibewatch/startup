company:
  name: LONGi Hydrogen Energy
chapter:
  number: 5
  title: Product & Technology
  summary: 'LONGi Hydrogen''s public product stack is no longer just a single alkaline stack. The evidence now supports a four-part offer: ALK Hi1 as the core medium-pressure alkaline electrolyzer, ALK G as a larger-capacity single-unit variant, HyBlock as the modular outdoor delivery architecture, and HySmart as the digital O&M layer. Public materials credibly support energy-efficiency, modularization, and international-project-readiness claims, but they still leave notable gaps on disclosed certificate detail, cyber/control assurance, and long-duration flexible-operations durability.'
sections:
- id: '5.1'
  title: Product stack, user workflow, and solution scope
  body: LONGi Hydrogen sells large-scale alkaline water electrolysis systems into infrastructure workflows rather than into generic lab or pilot settings. The public record consistently frames the company around industrial green hydrogen applications such as green ammonia, e-fuels, metallurgy, and off-grid or grid-connected hydrogen production. The product family is now visibly layered. ALK Hi1 remains the flagship current-density alkaline platform with quantified power-consumption, pressure, load-range, and service-life claims. The broader portfolio adds ALK G for larger single-unit output, HyBlock for factory-prefabricated outdoor modular deployment, and HySmart for plant-level digital O&M. That matters because it shows LONGi is trying to capture more of the project stack than a bare electrolyzer sale. The sustainability page reinforces the same positioning by describing full-lifecycle services that include project design, economic analysis, transient simulation verification, and chain-wide
    product supply. In other words, the company wants to be underwritten as a system integrator for low-LCOH hydrogen projects, not merely as a stack vendor.
