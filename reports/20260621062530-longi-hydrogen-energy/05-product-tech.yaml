  evidenceGaps:
  - type: missing-source
    severity: material
    topic: certificate-level disclosure for hydrogen products
    missingEvidence: The retained sources claim export-standard compliance and multiple certifications but do not publish the complete certificate list, certificate IDs, or downloadable dossier for the hydrogen equipment.
    whyItMatters: Industrial buyers and investors need document-level confirmation of pressure-equipment, electrical, and process-safety compliance, not only summary marketing claims.
    diligencePath: Request CE/PED or equivalent declaration files, named certifying bodies, test scope, and project-level acceptance documentation for ALK Hi1, ALK G, HyBlock, and HySmart.
    relatedQuestionRefs:
    - QE010
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: cybersecurity and controls assurance for HySmart and plant automation
    missingEvidence: No retained public source shows a trust center, control-system security architecture, patching model, incident process, or customer-facing assurance pack for the digital O&M layer.
    whyItMatters: As LONGi moves up-stack into diagnostics and plant-level monitoring, controls assurance becomes part of product risk rather than a back-office issue.
    diligencePath: Request software and control security architecture, remote-access model, identity design, incident logs, and any third-party audit or penetration-test results.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: durability under highly intermittent renewable operation
    missingEvidence: Public sources describe project commissioning and load range but do not provide long-run degradation, restart cycling, or availability data under intermittent renewable profiles.
    whyItMatters: External market research suggests flexibility and durability under partial-load or cycling conditions are central to the real cost of alkaline systems.
    diligencePath: Request field data on start-stop cycles, stack degradation, efficiency drift, availability, and maintenance interventions across the company’s export references.
    relatedQuestionRefs:
    - QE022
    - QE026
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: software release and upgrade governance
    missingEvidence: The retained sources show the existence of a digital O&M layer but not a release cadence, validation gate, or rollback model for software and controls updates.
    whyItMatters: Digital operations become a differentiated feature only if upgrades can be introduced without compromising uptime or process safety.
    diligencePath: Review internal software release policy, validation procedures, customer change-management workflows, and any post-release incident history with product and service teams.
    relatedQuestionRefs:
    - QE006
    - QE024
    relatedTableRefs: []
