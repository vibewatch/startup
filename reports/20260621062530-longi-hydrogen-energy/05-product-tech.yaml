- id: '5.4'
  title: Trust, compliance, and remaining technical diligence gaps
  body: 'LONGi''s public trust and compliance record is credible but incomplete. The strongest evidence is contextual rather than certificate-deep: ALK Hi1 claims Level-I energy efficiency and more than 10 professional certifications; the Uzbekistan project says equipment was delivered in line with relevant EU directives and U.S. industrial codes; the Namibia project says the system will comply with CE-marking requirements and international safety standards; and LONGi''s broader sustainability disclosures show active carbon-footprint and environmental-compliance work across the group. That is enough to support a view that the company knows how to package equipment for export markets. It is not enough to independently verify the full trust surface. The retained sources do not publish a detailed certificate pack for the hydrogen products, do not provide customer-facing cyber or control-system assurance materials, and do not disclose fleet-wide durability under highly intermittent operation.
    External market research makes that omission more important, not less, because the global debate around Chinese electrolyzers increasingly centers on flexible operation, standards alignment, and life-cycle performance rather than stack-only capex. For diligence, the remaining burden is clear: certificate-level verification, controls-security review, and operating-history proof under variable renewable profiles.'
