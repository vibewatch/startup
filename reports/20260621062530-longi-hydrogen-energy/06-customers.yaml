- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Anchor project succeeds and becomes regional reference
    - A few flagship projects may dominate both backlog and market perception
    - If one large project slips, visible momentum can reverse quickly
    - Request backlog split, operating MW by customer, and top-10 customer concentration
  - - Customer ecosystems expand around ports, ammonia, or mobility infrastructure
    - Infrastructure buildout may depend on non-LONGi counterparties and public incentives
    - Hardware wins may not convert into durable service revenue or repeat orders
    - Request partner dependence, post-commissioning service share, and incentive sensitivity by project
  - - European channel support via HydrogenPro
    - Regional access may be mediated by partner economics rather than direct customer relationships
    - If partner liquidity or strategy changes, European pipeline quality may change too
    - Request channel ownership, revenue split, and named jointly pursued customer programs
  - - China’s low-cost manufacturing advantage
    - Weak downstream demand and standards friction can slow customer FIDs
    - Signed orders may commission slowly or face profit compression
    - Request booking-to-operation conversion and cancellation history
  - - International project diversification across Europe, Africa, and Central Asia
    - Diversification is still concentrated in a narrow set of use cases such as ammonia, e-fuels, and mobility
    - The apparent TAM may be narrower than a generic hydrogen-equipment story implies
    - Request pipeline segmentation by use case, project size, and end-market economics
  notes: The main risk is not absence of proof; it is that proof is concentrated in a few capital-intensive reference projects.
