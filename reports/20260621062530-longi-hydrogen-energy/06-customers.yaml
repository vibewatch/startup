- id: '6.2'
  title: Named project proof shows real adoption, but the best evidence is project-specific rather than fleet-wide
  body: 'The strongest customer proof is Uzbekistan. LONGi’s 2024 shipment release names ACWA Power and POWERCHINA Huadong, includes a direct ACWA quote, and frames the project as the first phase of a broader utility-scale hydrogen effort. The 2025 commissioning pages then add operational depth: four 1,000 Nm3/h units, 20 MW installed capacity, 52 MW wind input, over 3,000 tonnes per year of hydrogen, and full-load commissioning with 99.99% purity according to POWERCHINA. Namibia is the next-best proof because the customer side is more visible. Cleanergy, GH2 Namibia, CMB, Mining & Energy, and Offshore Energy all tie LONGi’s Hi1 system to the Hydrogen Dune site, a 5 MW electrolyzer configuration integrated with solar, battery storage, truck conversion, port demand, and local training. Norway is weaker in naming but still meaningful: the project is scheduled for 2026 operation, uses multiple 1,000 Nm3/h Hi1 units, and is specifically aimed at e-fuels. The pattern is clear: LONGi’s public
    adoption proof is strongest where project scope, use case, and counterparties are all visible at once.'
