company:
  name: LONGi Hydrogen Energy
chapter:
  number: 6
  title: Customers
  summary: 'LONGi Hydrogen''s public customer evidence is strong on named flagship projects and weak on portfolio-level durability metrics. The file now supports three concrete international counterparty clusters: ACWA Power and POWERCHINA in Uzbekistan''s green-ammonia pilot, Cleanergy/CMB in Namibia''s Hydrogen Dune logistics-and-port ecosystem, and an undisclosed European e-fuels developer in Norway. HydrogenPro adds a second layer of go-to-market proof by functioning as an OEM/service bridge into Europe. What the public evidence still does not show is active-customer count, retention, contract tenor, or revenue concentration, so the customer story is credible but concentrated.'
sections:
- id: '6.1'
  title: Customer and counterparty mix is infrastructure-heavy, project-led, and international
  body: 'LONGi Hydrogen is not selling into a broad SMB or software-style account base. The named public counterparties are project developers, EPCs, logistics and port decarbonization operators, and large industrial-transition programs. Uzbekistan pairs ACWA Power as project developer with POWERCHINA Huadong as EPC and commissioning partner. Namibia centers on Cleanergy Solutions and CMB’s Walvis Bay ecosystem, where hydrogen is tied to trucks, port equipment, rail, and maritime use rather than to a generic supply contract. Norway adds a European e-fuels project where the end customer is still undisclosed but the application is clearly industrial and export oriented. This segmentation matters because it implies customer value is won through project bankability, local infrastructure integration, and standards-ready delivery rather than through low-touch transactional sales. It also means the visible customer file is naturally lumpy: a small number of capital-intensive projects can carry
    most of the public proof.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU010
  - CU011
  - CU019
  - CU020
  - CU033
  - CU034
