- id: '6.3'
  title: Expansion logic comes from ecosystem buildout and partner channels rather than public retention data
  body: Public expansion evidence exists, but it is not SaaS-like retention evidence. ACWA’s quote on Uzbekistan explicitly describes the pilot as a first phase with more milestones ahead. Namibia’s customer-side materials show the Hydrogen Dune project as a starting point for a wider Walvis Bay buildout that includes truck conversion, a Hydrogen Academy, an ammonia pipeline extension, a bunkering and storage concept, and a future gigawatt-scale inland plant. HydrogenPro adds a second expansion path by giving LONGi a European OEM and service bridge rather than leaving it to sell every project from China directly. These are all positive signals because they imply that a successful first installation can lead to follow-on work around infrastructure, service, or regional replication. But they are still proxies. None of the retained sources disclose active-customer count, live-project conversion rates, or installed-base renewal economics. The result is a customer story where channel depth and
    ecosystem buildout are visible, but classical durability metrics are not.
