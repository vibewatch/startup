  - - EPC and commissioning partners
    - Engineering contractor / site commissioning teams / project owner
    - Integrate and ramp alkaline systems into operating plants
    - POWERCHINA Huadong named and quoted on Uzbekistan project
    - Important because EPC endorsement increases bankability for future projects
    - Public file still lacks a broader EPC roster and repeat-win statistics
  - - Port and logistics decarbonization operators
    - Infrastructure developer / mobility users / ecosystem financiers
    - Produce hydrogen for trucks, port equipment, rail, vessels, and off-grid demand
    - Hydrogen Dune 5 MW electrolyzer with solar, battery, and mobility conversion scope
    - Shows a customer class where hydrogen demand is tied to physical logistics assets, not just subsidy capture
    - Project is pre-steady-state and economics are not public
  - - European e-fuels developers
    - Project developer / synthetic-fuels operator / industrial offtaker
    - Replace fossil feedstocks with e-fuels
    - Multiple 1,000 Nm3/h Hi1 units for Norway project due 2026
    - Creates European reference value in a hard-to-enter end market
    - Customer name remains undisclosed
  - - European OEM / service channels
    - OEM partner / regional integrator / project developer customer base
    - Local manufacturing, engineering, and after-sales support
    - HydrogenPro partnership with 1 GW capacity access
    - Can shorten market-entry friction in Europe and improve service credibility
    - Partner channel is not the same as end-customer retention proof
