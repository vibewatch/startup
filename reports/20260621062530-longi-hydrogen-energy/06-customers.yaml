  evidenceGaps:
  - type: missing-source
    severity: material
    topic: active-customer denominator and live operating-project count
    missingEvidence: The retained sources do not disclose how many active customers, operating projects, or commissioned megawatts sit behind LONGi’s public order-footprint claims.
    whyItMatters: Without a denominator, investors cannot distinguish between a concentrated flagship-project pipeline and a broad repeatable installed base.
    diligencePath: Request active-customer count, commissioned MW by customer, operating project count, and booking-to-operation conversion history by region.
    relatedQuestionRefs:
    - QU013
    - QU021
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: retention, renewal, and service-term disclosure
    missingEvidence: No retained source publishes NRR, GRR, churn, average service-contract term, warranty-extension behavior, or renewal rates for any customer cohort.
    whyItMatters: Project announcements prove adoption but not whether the company sustains profitable customer relationships after equipment delivery and commissioning.
    diligencePath: Request warranty/service attachment rates, renewal terms, service revenue by cohort, and customer-reference evidence on post-commissioning support.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: top-customer and top-project concentration
    missingEvidence: The public record names only a small set of flagship projects and does not quantify backlog or revenue exposure to those accounts.
    whyItMatters: A hydrogen-equipment business can look internationally active while still depending economically on a handful of projects or counterparties.
    diligencePath: Request top-10 customer concentration, backlog by project, cancellation history, and exposure to any single developer, EPC, or service partner.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: independent satisfaction and failed-deployment evidence
    missingEvidence: Retained sources are rich in project announcements but thin on customer-owned reliability dashboards, complaint records, or failed-deployment case studies.
    whyItMatters: Independent operating sentiment matters for underwriting service quality and repeat-order potential in project businesses.
    diligencePath: Request customer references, service-ticket history, complaint logs, and any delayed or cancelled export-project postmortems.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
