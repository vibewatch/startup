callouts:
- calloutType: strength
  title: Commercial proof exists, even if the public P&L does not
  body: The combination of >RMB 100 million 2023 turnover, 24% domestic alkaline bid share, first large-scale overseas delivery, and 500+ MW cumulative global orders is enough to show this is a real commercial business rather than a concept asset.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI017
- calloutType: risk
  title: Margin risk may be hidden inside China’s cost advantage
  body: S&P and CRU both describe an industry where pricing is approaching production cost and some manufacturers rely on subsidies or stronger parent businesses, meaning low headline system cost does not automatically equal attractive returns.
  claimRefs:
  - CI011
  - CI014
  - CI015
  - CI027
- calloutType: risk
  title: Capital adequacy is only indirectly observable
  body: Public sources show financing events and parent support, but no standalone cash balance, burn rate, debt schedule, or backlog value for LONGi Hydrogen itself.
  claimRefs:
  - CI020
  - CI024
  - CI026
  - CI034
- calloutType: insight
  title: The valuation headline looks stretched against the only public revenue threshold
  body: If the >RMB 10 billion post-money valuation is directionally correct and the only public revenue threshold remains “more than RMB 100 million” in 2023, then the business needs a step-change in 2024-2026 revenue to justify that mark comfortably.
  claimRefs:
  - CI005
  - CI018
  - CI037
