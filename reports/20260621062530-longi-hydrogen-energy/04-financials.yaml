- id: financial-verdict-and-blockers
  title: Financial verdict and underwriting blockers
  body: 'The public record supports a mixed but directionally positive commercial verdict and a weak underwriting verdict. Commercially, LONGi Hydrogen has crossed the line from prototype story to revenue-generating industrial business: it had more than RMB 100 million of turnover in 2023, leading domestic market share in alkaline bid wins, growing export references, and the backing to fund partnerships such as HydrogenPro. Financially, however, the core blockers remain untouched in public: no disclosed standalone revenue for 2024 or 2025, no gross margin, no EBITDA, no order backlog value, no cash balance, no burn rate, and no working-capital profile. The reported >RMB 10 billion post-money valuation therefore sits on a highly incomplete data set; against the last public turnover threshold, it implies an extremely rich revenue multiple unless revenue scaled dramatically after 2023. The right conclusion is not that the company lacks traction, but that the company cannot be underwritten confidently
    without a data room.'
