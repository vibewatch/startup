  topStrengths:
    - Parent-backed strategic position inside LONGi's global clean-energy ecosystem.
    - Credible alkaline-electrolyzer scale with 2.5 GW end-2023 capacity and a larger roadmap.
    - Real overseas project traction in Central Asia, Europe, and Africa rather than a domestic-only story.
    - Product roadmap spans core stacks, modular plant design, and digital O&M tools.
  topRisks:
