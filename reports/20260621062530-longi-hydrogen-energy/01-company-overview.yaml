- id: funding-and-capitalization
  title: Funding history and capitalization
  body: Public funding evidence points to two distinct capitalization steps. First, Chinese business coverage said LONGi Green Energy Investment and six LONGi executives injected RMB 500 million into the subsidiary in 2023 at a pre-money valuation of roughly RMB 3 billion, establishing a much larger internal capital base before outside fundraising. Second, multiple 2024 sources reported a Series A round of about RMB 1 billion, while Pedaily and 163.com both described a post-money valuation above RMB 10 billion and named investors including GF Xinde, Yonghua Investment, Hidden Hill Capital, Shaanxi Fund, Rosefinch, and Shaanxi Xuqiangrui Clean Energy. The parent’s 2024 annual report does not restate the headline round size, but it does confirm that minority shareholders made a non-proportional capital increase into LONGi Hydrogen Energy that added RMB 342.7 million to the group’s capital reserve, giving direct filing-level evidence that the subsidiary raised outside equity during the period.
    CB Insights also records a single Series A dated July 12, 2024 with six investors, broadly corroborating the timing while leaving precise ownership stakes undisclosed.
  claimRefs:
