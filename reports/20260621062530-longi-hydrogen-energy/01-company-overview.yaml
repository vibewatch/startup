- id: adverse-context-and-diligence-gaps
  title: Adverse context, strategic constraints, and diligence gaps
  body: 'The main adverse issue is not product immaturity alone; it is market structure. S&P Global estimated that China’s electrolyzer manufacturing capacity reached 39 GW per year in 2024 while only 693 MW of tender demand appeared in the first ten months, and CRU argued that many manufacturers were operating at or near cash-cost pricing with losses masked by subsidies or stronger parent businesses. MERICS and Asia Times likewise frame Chinese hydrogen equipment as another overcapacity arena where industrial policy, export pressure, and trade friction can destabilize returns. LONGi is not insulated from that pressure. The parent company’s 2024 annual report recorded its first loss in nearly a decade, and although the 2026 Q1 update still described a safe cash reserve, that backdrop implies hydrogen expansion must compete internally for capital. Public diligence also remains incomplete on three critical fronts: full board composition, precise shareholding after the 2024 financing, and audited
    standalone subsidiary financial statements.'
