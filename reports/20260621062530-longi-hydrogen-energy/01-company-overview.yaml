- id: leadership-and-governance
  title: Leadership, governance, and ownership visibility
  body: The leadership picture is partly visible but not fully disclosed. Early public coverage tied the company’s registration to LONGi founder Li Zhenguo as chairman and general manager, while current operating disclosure centers more on Ma Jun as President, Wang Yingge as Vice President, and Zhang Haimeng as a LONGi Green Energy vice president and board director at LONGi Hydrogen. This suggests the subsidiary is still tightly embedded in the parent’s executive orbit rather than operating with a highly independent public governance profile. That said, no retained official source publishes a full board roster, shareholder percentages, or post-Series-A cap table, so investors can identify key executives and the parent’s control posture but cannot yet map decision rights, board committees, or dilution precisely from public documents.
  claimRefs:
