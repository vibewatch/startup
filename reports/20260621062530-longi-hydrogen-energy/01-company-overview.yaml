company:
  name: LONGi Hydrogen Energy
chapter:
  number: 1
  title: Company Overview
  summary: LONGi Hydrogen Energy is a Xi’an-founded March 2021 hydrogen-equipment subsidiary of LONGi Green Energy that has scaled alkaline electrolyzer manufacturing capacity to 2.5 GW, reported more than RMB 100 million of 2023 turnover, and pushed overseas projects in Central Asia, Europe, and Africa. The company also raised a large 2024 Series A round reportedly worth about RMB 1 billion at a post-money valuation above RMB 10 billion, but public governance disclosure remains thin and its growth sits inside a Chinese electrolyzer market now facing severe oversupply and margin pressure.
sections:
- id: identity-and-mission
  title: Identity, parentage, and mission
  body: 'LONGi Hydrogen Energy was registered in Xi’an in March 2021 as a holding subsidiary inside the LONGi Green Energy group, reflecting the parent company’s decision to turn solar-driven decarbonization into a broader “green power + green hydrogen” strategy. Official and near-official descriptions are consistent on the company’s mission: it wants to be a leading supplier of large-scale alkaline water electrolysis equipment and integrated green hydrogen solutions, not merely a component maker. The current product surface spans alkaline stacks, full hydrogen-production systems, modular plant architecture, and digital O&M tooling, which makes the business more comparable to an industrial equipment platform than a single-SKU manufacturer. LONGi’s own 2023 and 2024 annual reports also show that the parent views hydrogen as a strategic adjacency tied to green methanol, green ammonia, and broader industrial decarbonization rather than a side experiment.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
