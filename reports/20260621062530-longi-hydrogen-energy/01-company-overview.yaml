- id: products-capacity-and-commercialization
  title: Products, manufacturing scale, and commercialization milestones
  body: 'The operating story is unusually well developed for a young hydrogen-equipment subsidiary. LONGi Hydrogen launched the ALK Hi1 series in 2023 with claimed minimum DC power consumption of 4.0 kWh/Nm³ and later paired it with the larger ALK G series, whose single-slot output reached 3,000 Nm³/h in the parent’s 2023 annual report. LONGi said end-2023 manufacturing capacity reached 2.5 GW and ranked first in the industry, while Taiyang and H2CE described the same 2.5 GW footprint across Wuxi and Xi’an with a 5–10 GW capacity target for 2025. Commercially, the company moved beyond domestic demonstrations into export projects: four 1,000 Nm³/h units for Uzbekistan’s wind-to-ammonia project, multiple Hi1 units for a Norwegian e-fuels project planned for 2026 operation, a Namibia project serving multi-sector mobility demand, and more than 500 MW of cumulative global orders across ten countries by October 2025. The 2024 annual report further says the company delivered its first large-scale
    overseas project and secured major European orders during the year, which is a stronger commercialization signal than simply signing MOUs.'
