              Huadong, includes a direct ACWA quote, and frames the project as the first phase of a broader
              utility-scale hydrogen effort. The 2025 commissioning pages then add operational depth: four 1,000 Nm3/h
              units, 20 MW installed capacity, 52 MW wind input, over 3,000 tonnes per year of hydrogen, and full-load
              commissioning with 99.99% purity according to POWERCHINA. Namibia is the next-best proof because the
