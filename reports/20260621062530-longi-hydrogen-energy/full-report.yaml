  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitute pathways
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen’s served market is best defined as large-scale alkaline electrolyzer equipment plus the
              system-level hardware and engineering needed to turn renewable power into industrial hydrogen. The
              included spend is not just the electrolysis stack. Public LONGi materials repeatedly position the offering
              as an integrated hydrogen-production solution that includes stacks, control systems, gas-liquid
              separation, purification, and balance-of-plant modules for ammonia, e-fuels, refining, mobility, and power
              applications. The ALK Hi1 and ALK G pages make this boundary concrete: the product is sold as a
              standardized industrial hydrogen-production system with operating-pressure, load-range, footprint, and
              CAPEX claims, not as an isolated laboratory component. That means the relevant market lens is project
              equipment and project integration for green-hydrogen plants, especially where alkaline technology is
              acceptable and where buyers care about lifecycle hydrogen cost more than about premium PEM flexibility.


              Excluded from the boundary are downstream fuel-cell vehicles, hydrogen retail, and pure merchant-hydrogen
              offtake economics that LONGi does not directly monetize. Those sectors matter only insofar as they
              activate demand for upstream electrolyzer systems. Close substitute pathways still matter strategically:
              PEM electrolyzers, atmospheric alkaline systems, and Western turnkey systems compete for the same
              decarbonization budgets, while status-quo grey hydrogen, delayed project execution, or alternative
              electrification pathways can absorb the same capital that might have funded a LONGi system. Public
              third-party work also shows that China’s current market is overwhelmingly alkaline, which fits LONGi’s
              positioning but narrows its near-term addressable mix toward cost-sensitive, industrial-scale use cases
              rather than the full hydrogen economy rhetoric often used in top-down narratives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM031
              - CM033
