chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, parentage, and mission
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen Energy was registered in Xi’an in March 2021 as a holding subsidiary inside the LONGi Green
              Energy group, reflecting the parent company’s decision to turn solar-driven decarbonization into a broader
              “green power + green hydrogen” strategy. Official and near-official descriptions are consistent on the
              company’s mission: it wants to be a leading supplier of large-scale alkaline water electrolysis equipment
              and integrated green hydrogen solutions, not merely a component maker. The current product surface spans
              alkaline stacks, full hydrogen-production systems, modular plant architecture, and digital O&M tooling,
              which makes the business more comparable to an industrial equipment platform than a single-SKU
              manufacturer. LONGi’s own 2023 and 2024 annual reports also show that the parent views hydrogen as a
              strategic adjacency tied to green methanol, green ammonia, and broader industrial decarbonization rather
              than a side experiment.
