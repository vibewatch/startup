      - number: '7.3'
        title: Operational, partner, and export execution risk
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen’s export story is plausible, but the company is not escaping execution risk by partnering.
              The HydrogenPro alliance is strategically sensible because it can provide European-facing manufacturing,
              engineering, and service capacity without forcing LONGi to build everything alone. Yet that same structure
              concentrates risk in a partner that publicly entered a strategic review in Q1 2026 to address liquidity
              and growth alternatives. HydrogenPro’s backlog and late-stage pipeline show commercial relevance, but its
              losses and modest cash balance also show fragility. Export risk therefore has two layers: first, Europe is
              harder to win with pure Chinese exports because localization rules and resilience criteria are tightening;
              second, the bridge around those rules depends on counterparties that are not yet financially bulletproof.
              Meanwhile, broader technology-performance debates still matter. Longi’s efficiency claims are credible
              enough to take seriously, but third-party reporting continues to note reliability, adaptability, and
              degradation concerns in intermittent-renewables settings. That combination makes international scaling an
              execution challenge, not a simple cost-arbitrage play.
