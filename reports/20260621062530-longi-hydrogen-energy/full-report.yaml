      - number: '6.4'
        title: >-
          The biggest unresolved issues are concentration, retention, and proof-quality concentration in a few flagship
          projects
        blocks:
          - type: paragraph
            body: >-
              The public record is credible enough to prove adoption but too narrow to prove portfolio durability. LONGi
              discloses over 500 MW of global orders and 10 countries or regions, yet it does not disclose how many
              projects are operating, how many customers that represents, what portion of backlog is concentrated in a
              few accounts, or whether repeat wins are driven by the same developer ecosystems. Even the best public
              references are concentrated: Uzbekistan, Hydrogen Dune, and the unnamed Norway project do most of the
              work. External market sources add a real caution. China’s electrolyzer industry still faces weak
              downstream demand, standards gaps, and commissioning lag, which means a signed order is not identical to a
              mature, retained customer relationship. The practical implication is that LONGi’s customer chapter passes
              the named-proof bar but not the durability bar. Investors should treat the company as internationally
              credible and commercially promising, while still demanding pipeline-quality, concentration, and
              service-retention data before underwriting repeatability.
