            body: >-
              Publicly visible capitalization shows a business that has attracted both parent support and outside
              equity. Chinese coverage indicates the 2023 insider-parent capital raise totaled about RMB 500 million,
              followed by a 2024 Series A of roughly RMB 1 billion. LONGi’s 2024 annual report then gives filing-level
              confirmation that minority shareholders injected capital, adding RMB 342.7 million to group capital
              reserve as share premium. The company also used balance-sheet strength strategically: LONGi’s December
              2024 HydrogenPro deal committed approximately NOK 70 million from LONGi Hydrogen into the Norwegian OEM as
              part of a broader cooperation round, and the May 2025 Oslo Bors filing disclosed the exact subscription
              shares and price. Parent support is still relevant to adequacy, because LONGi’s Q1 2026 update said the
              group maintained a safe cash reserve and carried a 64.43% asset-liability ratio with 22.89%
              interest-bearing liabilities. The problem is that none of these sources disclose LONGi Hydrogen’s own cash
              balance, monthly burn, receivables aging, or project-finance obligations, so capital adequacy can only be
