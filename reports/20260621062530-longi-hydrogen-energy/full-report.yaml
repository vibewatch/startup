      - number: '3.3'
        title: Capability, pricing, packaging, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The public technical comparison shows more parity than marketing language suggests inside the Chinese
              alkaline cohort. LONGi’s ALK Hi1 and PERIC’s published alkaline product both cite 4.3 kWh-class
              electricity consumption and high hydrogen purity. Tianjin Mainland’s FDQ1000 page also points to 99.9%
              hydrogen purity with 1,000-1,500 Nm3/h output. That means LONGi does not obviously win on a single visible
              technical metric against every domestic rival. Its better public argument is system design and project
              packaging: larger standardized units, lower footprint, integrated balance-of-plant, and a documented path
              from product page to export commissioning.


              Pricing is where evidence gets thinner. Independent analysts agree that Chinese alkaline equipment is
              materially cheaper than Western alternatives, but they also warn that buyers often compare different
              scopes. Western turnkey systems frequently bundle plant-level infrastructure and higher standards support,
              while Chinese quotes may highlight stack or partial-system numbers. This narrows the true competitive gap
              once export projects need local service, certification, and reliability support. That is exactly why the
              HydrogenPro partnership matters. It is not just a manufacturing cooperation; it is a distribution and
              service answer to a capability gap. LONGi can win buyer attention with cost and project references, but
              the commercial question is whether it can package those advantages with enough service confidence to beat
              firms like Nel, thyssenkrupp nucera, or ITM when the project is outside China.
