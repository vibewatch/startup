      - number: '8.2'
        title: Economics and the public-comparable set
        blocks:
          - type: paragraph
            body: >-
              The public-comparable evidence is sobering. By June 2026, ITM Power, Nel ASA, and thyssenkrupp nucera all
              carried equity values around or below the level implied by LONGi Hydrogen’s reported private mark, while
              HydrogenPro traded at a far smaller market cap and still showed losses, modest revenue, and a
              strategic-review process. None of these companies is a perfect one-to-one comp, but that is exactly the
              point: if even listed specialists with visible investor-relations infrastructure do not consistently clear
              LONGi Hydrogen’s implied valuation, the burden of proof shifts to LONGi to show either superior growth,
              stronger margins, or privileged market access. Cost analysis reinforces caution. CRU and S&P both argue
              that Chinese cost leadership is real but not synonymous with healthy economics because low prices are
              being driven by policy support, aggressive competition, and a market where demand still lags installed
              manufacturing capacity. Investors therefore should not pay a scarcity multiple simply because LONGi can
              manufacture at scale.
