  - id: FI003
    title: Financial estimate range
    type: range
    layout: wide
    summary: >-
      Public cost benchmarks show how dramatically Chinese alkaline-electrolyzer economics diverge between cash-cost
      bidding, reported project cost, and unsubsidized comparable cost.
    data:
      items:
        - label: Cash-cost stack floor
          low: 0.13
          high: 0.15
          displayValue: $0.13M–$0.15M/MW
          detail: CRU says extreme 2025 Chinese single-stack bids may fall to cash-cost levels just below $0.15M/MW.
          tone: negative
        - label: Reported China full-system level
          low: 0.8
          high: 1
          displayValue: $0.8M–$1.0M/MW
          detail: CRU places recent Chinese alkaline project costs around $1.0M/MW with possible 2026 drift toward $0.8M/MW.
          tone: warning
        - label: Unsubsidized viable China equivalent
          low: 1.3
          high: 1.5
          displayValue: $1.3M–$1.5M/MW
          detail: >-
            CRU argues technologically comparable and commercially viable Chinese systems should be priced higher than
            current headline bids.
          tone: neutral
        - label: Non-Chinese large-scale system benchmark
          low: 2
          high: 2.6
          displayValue: $2.0M–$2.6M/MW
          detail: CRU and World Bank-linked reporting show materially higher installed costs outside China.
          tone: positive
    approximationNotes: >-
      Ranges synthesize CRU market benchmarks and World Bank-linked 2026 reporting; they are not LONGi-specific realized
      contract prices.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      LONGi Hydrogen’s capital story is visible at the fundraising and parent-support level, but weak at the standalone
      cash-flow level.
    data:
      columns:
        - External equity visibility
        - Parent support visibility
        - Margin visibility
        - Demand / utilization risk
      rows:
        - label: What is publicly disclosed
          values:
            - label: Medium
              tone: neutral
              detail: 2024 Series A size is public via media and minority capital increase is confirmed in the annual report.
            - label: Medium
              tone: neutral
              detail: Parent Q1 2026 report shows safe cash reserve and leverage ratios, but no ring-fenced support policy.
            - label: Low
              tone: warning
              detail: No public gross margin, EBITDA, or warranty reserve data for the subsidiary.
            - label: Low
              tone: negative
              detail: Demand visible through projects, but national market demand trails manufacturing capacity massively.
        - label: What is only indirectly inferable
          values:
            - label: Medium
              tone: neutral
              detail: HydrogenPro investment suggests enough available capital to fund strategic expansion.
            - label: Medium
              tone: warning
              detail: Parent losses imply more internal capital discipline, not less dependence on parent context.
            - label: Low
              tone: negative
              detail: Low market pricing and oversupply imply margins are under pressure, but exact magnitude is unknown.
            - label: Low
              tone: negative
              detail: 500+ MW order headline does not disclose utilization, cancellations, or timing of revenue recognition.
        - label: What a data room must provide
          values:
            - label: Low
              tone: negative
              detail: Signed financing docs, shareholder rights, and cap-table roll-forward remain private.
            - label: Low
              tone: negative
              detail: No standalone cash balance, debt schedule, or guarantee exposure is public.
            - label: Low
              tone: negative
              detail: Need project-level P&Ls, warranty costs, and service gross margin.
            - label: Low
              tone: negative
              detail: Need plant utilization, backlog aging, and export profitability by geography.
    approximationNotes: Matrix grades are qualitative judgments based on the public-source record as of the run date.
