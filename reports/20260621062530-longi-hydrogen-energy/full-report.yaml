      - number: '4.2'
        title: Pricing, cost position, and unit economics
        blocks:
          - type: paragraph
            body: >-
              The public cost story is clearer than the public P&L. LONGi claims ALK Hi1 can operate at 4.0–4.3 kWh/Nm³,
              while Taiyang and HydrogenPro disclosures support the view that efficient Chinese alkaline systems now
              compete around the low-4 kWh/Nm³ range. On pricing, S&P Global reported that 1,000 Nm³/h alkaline
              electrolyzer system prices in China fell from $200–224/kW in 2023 to $185–200/kW in the first half of
              2024, already near production cost. CRU’s project work places Chinese alkaline full-system plant costs
              around $1.0 million per MW since 2024, potentially easing toward $0.8 million per MW in 2026, versus
              slightly above $2.0 million per MW in non-Chinese markets; but CRU also argues that a technologically
              equivalent, commercially viable unsubsidized Chinese system is closer to $1.3 million per MW. In other
              words, LONGi enjoys real cost advantage, yet part of that advantage may be a function of policy support,
              compressed margins, and operational trade-offs rather than pure economic surplus.
