        title: Revenue model and commercial scope
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen’s monetization surface is broader than a bare stack sale. Official project releases show
              the company selling full alkaline electrolyzer packages with power supply, controls, gas-liquid
              separation, purification, and broader balance-of-plant scope. The later HyBlock and HySmart launches
              extend that model into modular plant architecture and digital O&M, suggesting future revenue can come from
              engineered system design, factory-prefabricated modules, commissioning, lifecycle service, and
              software-led operations support. The strongest public proof that these are not only pipeline narratives is
              the parent’s 2023 annual report, which says LONGi Hydrogen generated more than RMB 100 million of turnover
              in 2023, and the 2024 annual report, which says the business delivered its first large-scale overseas
              project and secured major European orders. Revenue therefore clearly exists, but public sources do not
