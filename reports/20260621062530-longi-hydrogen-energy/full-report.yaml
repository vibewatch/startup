  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              LONGi Hydrogen is selling into a sector where policy, not just technology, determines whether projects get
              financed. China’s March 2026 hydrogen pilot is supportive, but it is not a blank check: the three-ministry
              notice makes support competitive, caps city-cluster awards, and explicitly warns against low-level
              repetitive construction. That language matters because it signals a state preference for disciplined
              demand formation rather than uncontrolled OEM capacity build-out. Outside China, the risk shifts from
              subsidy design to market access. The European Commission’s second Hydrogen Bank auction added resilience
              criteria under the logic of the Net-Zero Industry Act, and those criteria are aimed at security of supply
              and European industrial leadership rather than pure cheapest-cost procurement. For LONGi Hydrogen, that
              means a Europe strategy that relies only on exporting Chinese stacks will face policy friction even before
              customer-level due diligence, and any delay in localization or compliant partner capacity can slow
              conversion of its overseas pipeline into orders.
            claimRefs:
              - CR001
