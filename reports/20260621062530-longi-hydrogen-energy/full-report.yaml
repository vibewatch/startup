      - number: '8.4'
        title: Scenarios, recommendation, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right output is a scenario range, not a single defended intrinsic value. A bull case can justify the
              reported private mark if LONGi uses parent support and partner localization to convert cost advantage into
              durable orders before sector consolidation destroys pricing. A base case applies a discount because public
              peers, policy dependence, and missing subsidiary disclosure all argue against paying a full strategic
              premium up front. A bear case is easy to imagine: localization barriers tighten, domestic demand support
              disappoints, or listed peer multiples compress again, and the round’s private mark stops looking like a
              floor and starts looking like peak-cycle optimism. Because the public record does not include audited
              subsidiary revenue, gross margin, preference stack, or customer-concentration data, the evidence-backed
              recommendation is research-more rather than buy or avoid. The next diligence session would most change the
              call if it answered three questions cleanly: what the subsidiary actually earned in 2025 and Q1 2026, what
              rights and liquidation preferences came with the 2024 round, and how much of the Europe strategy is
              already tender-ready rather than still aspirational.
