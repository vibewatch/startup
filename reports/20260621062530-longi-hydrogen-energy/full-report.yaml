            body: >-
              The leadership picture is partly visible but not fully disclosed. Early public coverage tied the company’s
              registration to LONGi founder Li Zhenguo as chairman and general manager, while current operating
              disclosure centers more on Ma Jun as President, Wang Yingge as Vice President, and Zhang Haimeng as a
