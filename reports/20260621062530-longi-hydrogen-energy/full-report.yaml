      - number: '4.4'
        title: Adverse economics and market pressure
        blocks:
          - type: paragraph
            body: >-
              The adverse case rests on utilization and margins, not on a lack of product-market intent. S&P’s 39 GW
              versus 693 MW demand mismatch, CRU’s description of loss-making manufacturers, and Asia Times’ warning
              about consolidation all point to a market where even technically credible suppliers may struggle to
              convert capacity into profitable throughput. Parent-company conditions amplify that risk. LONGi Green
              Energy recorded its first loss in nearly a decade in 2024, which means hydrogen expansion is being pursued
              while the parent’s core PV economics are under stress rather than from a position of effortless surplus.
              Export markets help, but they bring standards, tariff, and localization friction. The World Bank-linked
              summary, H2Tech, and Tim Harper all underscore that Chinese scale is driving down global price floors
              while also inviting foreign policy responses, so LONGi Hydrogen’s margin opportunity may tighten exactly
              as its international footprint grows.
