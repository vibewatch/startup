      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The public reference projects show that LONGi is not selling into a single homogeneous buyer type. In
              Uzbekistan, the immediate project structure combines a project developer, an EPC partner, and an ammonia
              use case; in Norway, the buyer logic centers on e-fuels and industrial decarbonization; in Namibia, the
              end-use concept spans transport, off-grid generation, rail, and maritime applications. In each case, the
              direct buyer is closer to an industrial project sponsor or EPC-led delivery stack than to a generic
              hydrogen consumer. That matters because budget ownership typically sits with project developers,
              industrial operators, utilities, or infrastructure sponsors that are underwriting a whole project, not
              just a stack purchase. LONGi’s own positioning around “green power plus green hydrogen” and
              balance-of-plant delivery supports that reading.


              The adoption path visible in public evidence is also specific. LONGi moved from product launch and
              domestic capacity build-out to export reference projects, then to claims of broader global reach across
              ten signed countries. The company’s value proposition is not currently proven by transparent recurring
              shipments into a commoditized aftermarket. It is proven by a sequence of landmark projects that validate
              compliance with international standards, module standardization, and the ability to support overseas
              commissioning. This makes the buyer map narrower but more tangible: the most credible near-term market is
              large industrial or infrastructure hydrogen projects where alkaline technology is acceptable, power cost
              is decisive, and referenceability matters more than premium performance flexibility.
