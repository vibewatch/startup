      - number: '2.2'
        title: Sizing the market with supply, delivery, and cost lenses
        blocks:
          - type: paragraph
            body: >-
              A generic “hydrogen market is huge” framing is not useful for underwriting LONGi. The tighter and more
              defensible lens is the mismatch between manufacturing capacity, actual project demand, and delivered
              systems. S&P Global put Chinese electrolyzer manufacturing capacity at 39 GW in 2024, while VNZ reported
              only 3.2 GW of global deliveries in 2024 and S&P cited just 693 MW of Chinese tender demand in the first
              ten months of that year. That gap is the most important sizing fact in the chapter: the market has already
              scaled on the supply side, but demand realization is still narrow and uneven. VNZ’s 1.44 GW China-delivery
              figure shows China is still the largest delivery destination, yet even that level is a small fraction of
              announced or installed manufacturing capability. For investors, the relevant TAM/SAM/SOM sequence is
              therefore not a top-down hydrogen macro forecast but a constrained funnel from global manufacturing
              capacity to delivered systems to reference projects that actually commission and operate.


              Cost evidence reinforces the same conclusion. CRU and S&P both show real cost compression in Chinese
              alkaline equipment, but they also warn that comparisons are often apples to oranges because Chinese quotes
              frequently exclude plant-level balance-of-plant, installation, or export-standard adaptation. Even after
              normalization, the evidence still points to a major cost advantage for Chinese alkaline systems; however,
              the market consequence is margin compression, not automatically durable value capture. LONGi’s own product
              pages emphasize standardization, larger-unit scale, and lower footprint as the route to lower LCOH. That
              fits the broader market pattern: buyers are rewarding lower delivered system cost, not novel chemistry.
              The underwriting challenge is that public sources do not disclose LONGi’s realized selling price,
              project-level gross margin, or installed-base utilization, so the size of the economic opportunity is
              clearer than the quality of the profit pool.
            claimRefs:
