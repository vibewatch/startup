      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The growth case for LONGi’s market is real. China’s 2026 hydrogen strategy is moving from target-setting
              toward demand activation, with reward-for-performance city clusters, explicit end-user hydrogen price
              targets, and clear pressure to build industrial use cases in ammonia, methanol, transport, and metallurgy.
              China’s cost advantage in alkaline equipment is also real enough that even normalized system comparisons
              still leave Chinese OEMs structurally cheaper than most Western peers. LONGi’s own roadmap is
              directionally aligned with that market logic: larger standardized units, lower balance-of-plant intensity,
              and exportable integrated systems. If demand activation succeeds, LONGi should be well placed inside the
              portion of the market that cares first about delivered cost and industrial scale.


              But the adverse evidence is equally important. Oversupply is already visible, public cost data suggests
              some manufacturers are operating near cash cost, and VNZ’s finding that only 43% of delivered units were
              operational underscores that manufacturing scale is not the same as deployed value. S&P also highlights
              standards gaps, trade barriers, and engineering compromises around renewable-following flexibility. Those
              issues matter directly for LONGi because the market is trying to move from domestic price competition into
              export credibility. The key remaining diligence gaps are realized system pricing, shipment volume by year,
              installed-base utilization, and whether LONGi’s export references translate into repeatable multi-country
              orders rather than one-off project wins. Until those variables are visible, the market should be treated
              as strategically important but still margin-risky.
