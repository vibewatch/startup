      - number: '3.4'
        title: Moat durability, switching costs, and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              LONGi’s moat is most credible where buyers want a cost-optimized alkaline system from a company that
              already understands utility-scale renewable supply chains. The solar-parent adjacency matters because it
              fits buyer demand for “green power plus green hydrogen” projects and because it likely helps LONGi
              coordinate power electronics, procurement, and large-project execution. The export references in
              Uzbekistan, Norway, and Namibia strengthen this moat because they demonstrate that LONGi can do more than
              sell a domestic stack into a Chinese pilot. But those advantages are not unassailable. They are strongest
              in cost-sensitive, industrial-scale applications and weaker in premium markets where the buyer weights
              installed base, operations support, and international contracting proof more heavily.


              The adverse evidence is strong enough that this chapter cannot treat LONGi as category leader by default.
              Sungrow publicly claims number-one China share. VNZ’s 2024 dataset shows PERIC ahead of Sungrow on
              delivered MW and identifies projects where LONGi, PERIC, and Tianjin Mainland all overlap. Independent
              sources also preserve disagreement on absolute capacity rankings and show that only a minority of
              delivered electrolyzers were operational in the wider market. That means the buyer’s real moat test is not
              who claims the biggest nameplate factory, but who can commission, service, and support equipment in the
              exact jurisdiction the customer needs. Public sources still do not reveal repeat-purchase behavior,
              multi-homing rates, or post-commissioning uptime by vendor, so switching-cost durability remains more
              hypothesized than proven.
