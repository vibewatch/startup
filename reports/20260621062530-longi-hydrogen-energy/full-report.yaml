      - number: '3.2'
        title: 'Competitor profiles: scale, technical scope, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              LONGi’s own profile is built around standardized large-scale alkaline products and a sequence of export
              reference projects. Sungrow’s public pitch emphasizes domestic share leadership plus an empirical R&D
              platform. PERIC presents itself as a broad hydrogen-equipment supplier with strong alkaline credentials
              and adjacent hydrogen-system businesses. Tianjin Mainland shows the profile of a long-standing specialist
              with significant export activity, operating 5 MW references, and a growing factory base. These are all
              meaningful domestic rivals because they compete on the same broad industrial-hydrogen narrative and do not
              require customers to adopt a radically different technology route.


              The Western and internationally scaled set is different. Nel emphasizes manufacturing scale, service
              network, and global installed base. ITM emphasizes PEM plant modules and European project relevance.
              thyssenkrupp nucera emphasizes very large installed and contracted capacity with decades of electrolysis
              experience. HydrogenPro is notable because it is both a competitor and a distribution bridge: it sells
              high-pressure alkaline systems on its own, but its partnership with LONGi is also evidence that LONGi
              wants local-market credibility and service reinforcement in Europe. The profile comparison therefore
              supports a nuanced conclusion: LONGi’s direct competition is strongest in China on cost and alkaline
              specialization, while its hardest export competition comes from firms with better-disclosed operational
              proof and market-specific service depth.
