  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the private mark actually means
        blocks:
          - type: paragraph
            body: >-
              The strongest valuation fact in the public domain is not a discounted cash-flow input; it is the 2024
              financing round itself. Multiple Chinese-language reports describe a roughly CNY 1 billion Series A round
              at above CNY 10 billion post-money, and Energy Iceberg later grouped LONGi Hydrogen among the major
              winners of China’s 2024 hydrogen funding cycle. That matters because it tells us sophisticated investors
              were willing to underwrite the category despite worsening global deployment skepticism. But a funding
              round is not the same thing as fair value. CB Insights still shows only a placeholder valuation model, and
              no public filing fixes the exact post-money, liquidation preferences, or any ratchet terms. The listed
              parent’s 2025 and Q1 2026 disclosures reinforce LONGi’s strategic commitment to hydrogen, but they do not
              break out subsidiary revenue or cash burn. So the private mark is real as a market signal and weak as a
              valuation anchor: it proves appetite existed, not that today’s entry price is attractive on fundamentals.
            claimRefs:
              - CV001
