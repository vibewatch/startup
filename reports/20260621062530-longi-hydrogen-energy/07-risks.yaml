- id: mitigations-monitoring-kill-criteria
  title: Mitigations, monitoring indicators, and kill criteria
  body: >-
    The reason this risk picture is investable rather than fatal is that LONGi Hydrogen does have credible mitigants—just not enough public proof to downgrade residual exposure below medium-high. Parent-company balance-sheet support matters because LONGi can keep funding hydrogen through a bad cycle longer than a pure-play startup can. The 2024 financing round gives the subsidiary room to localize, hire, and absorb losses. The HydrogenPro investment and OEM agreement also show that management is not waiting passively for Europe to open. But these are still conditional mitigants. Investors should not treat strategy as evidence until three things are visible: first, proof that Europe-facing supply can satisfy resilience and localization screens; second, proof that orders are converting without destructive margin concessions; and third, proof that operational performance in the field is durable. The thesis breaks if LONGi expands capacity faster than offtake formation, if policy support softens
    before costs fall, or if the partner-led export bridge weakens before Europe is commercially open.
  claimRefs:
