- id: market-structure-and-economics
  title: Market structure, demand, and economic risk
  body: >-
    The clearest non-company-specific risk is that Chinese electrolyzer manufacturing scale has outrun realizable near-term demand. Multiple independent sources point in the same direction: S&P describes a huge gap between annual capacity and tender demand; GGII data summarized by Sohu says shipments remain far below industry nameplate capacity; MERICS and H2Tech both expect consolidation. Even if LONGi Hydrogen is a stronger operator than smaller rivals, it still sells into the same deflationary industry structure. Equipment-price declines that help project developers can simultaneously destroy OEM margin. CRU’s work is especially important here because it separates stack-price optics from full-system economics: China’s headline cost advantage is real, but much of it is policy- and competition-driven, and commercial viability at unsubsidized economics remains unresolved. The implication is that valuation, hiring, and plant-expansion decisions made against a bull-market narrative can become
    a liability if hydrogen demand ramps slower than factories were built.
  claimRefs:
