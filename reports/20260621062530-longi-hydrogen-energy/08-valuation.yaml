company:
  name: LONGi Hydrogen Energy
chapter:
  number: 8
  title: Valuation
  summary: >-
    The public record supports a meaningful financing milestone and a strategically credible position in alkaline electrolysis, but it does not yet support treating LONGi Hydrogen Energy’s reported >CNY 10 billion private valuation as cheap. Public listed peers mostly trade below that level, sector economics remain policy- and oversupply-shaped, and the subsidiary still lacks standalone disclosed revenue, margins, and preference-stack detail, so the evidence-backed call is research-more with a stretched valuation stance and medium confidence at best.
sections:
- id: financing-and-price-context
  title: Financing context and what the private mark actually means
  body: >-
    The strongest valuation fact in the public domain is not a discounted cash-flow input; it is the 2024 financing round itself. Multiple Chinese-language reports describe a roughly CNY 1 billion Series A round at above CNY 10 billion post-money, and Energy Iceberg later grouped LONGi Hydrogen among the major winners of China’s 2024 hydrogen funding cycle. That matters because it tells us sophisticated investors were willing to underwrite the category despite worsening global deployment skepticism. But a funding round is not the same thing as fair value. CB Insights still shows only a placeholder valuation model, and no public filing fixes the exact post-money, liquidation preferences, or any ratchet terms. The listed parent’s 2025 and Q1 2026 disclosures reinforce LONGi’s strategic commitment to hydrogen, but they do not break out subsidiary revenue or cash burn. So the private mark is real as a market signal and weak as a valuation anchor: it proves appetite existed, not that today’s
    entry price is attractive on fundamentals.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
