- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Implied valuation view
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - >-
      Share leadership sustains, Europe localization works, demand forms on policy schedule, and margins normalize as weaker OEMs consolidate
    - Current >CNY 10bn mark is defendable and could expand
    - Requires multiple strategic milestones to line up by 2027
    - Execution delay, localization failure, or slower demand formation
  - - Base
    - >-
      Strong strategic relevance but partial discount for oversupply, policy dependence, and missing disclosure
    - Private mark looks full rather than cheap; upside exists but is not obvious at entry
    - Most consistent with public evidence today
    - Listed-peer multiple compression and unresolved data gaps
  - - Bear
    - Pilot demand disappoints, trade friction tightens, and public comps de-rate further
    - Material downside from current private mark
    - Becomes more likely if no audited subsidiary metrics appear
    - Policy reversal, partner stress, or continued price wars
  notes: >-
    Scenario labels are directional rather than model-derived because public evidence is insufficient for a formulaic DCF or robust comparable-multiple output.
