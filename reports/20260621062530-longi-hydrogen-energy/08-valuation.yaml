- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Round economics
    - >-
      Exact post-money, liquidation preferences, anti-dilution rights, and board terms from the 2024 Series A
    - >-
      These terms determine whether the headline valuation is economically equivalent to a clean common-equity mark
    - Request financing documents, updated cap table, and board approvals
  - - Standalone financials
    - 2025 audited revenue, gross margin, EBITDA, operating cash burn, and Q1 2026 bridge
    - Valuation cannot be underwritten without seeing what the subsidiary actually earned and burned
    - Request audited subsidiary statements and parent consolidation bridge
  - - Order quality
    - Backlog composition, cancellation rights, milestone schedules, and customer concentration
    - A premium multiple depends on durable contracted demand rather than soft order headlines
    - Request signed order book, customer cohort, and backlog aging
  - - Europe go-to-market
    - Tender-ready sourcing, assembly, service, and regulatory-compliance blueprint for Europe
    - Localization is central to the upside case and to avoiding export friction
    - Request workshare matrix with HydrogenPro and Europe tender list
  - - Technology proof
    - Field-performance data, degradation curves, and warranty claims by product generation
    - Technology parity is not enough; valuation upside needs bankable performance at scale
    - Request fleet KPI pack, failure-rate logs, and warranty reserve method
  notes: >-
    These diligence asks are intentionally ordered by how quickly they would move recommendation and valuation stance, not by how easy they are to answer.
