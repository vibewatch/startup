- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Standalone subsidiary disclosure remains absent
    - No audited revenue, margin, or cap-table detail through next financing cycle
    - Prevents validation of current private mark and keeps confidence capped
    - Do not underwrite valuation upside from public narrative alone
  - - Public comps de-rate again
    - Another meaningful leg down in listed electrolyzer peer values
    - Shrinks comparable support for premium private marks
    - Mark private valuation stance more conservative
  - - Europe localization path stalls
    - No compliant tender-ready Europe delivery structure emerges
    - Undercuts the most important non-China growth option
    - Reduce upside multiple and delay any buy call
  - - Domestic demand support disappoints
    - Pilot roll-out lags or delivered-hydrogen economics fail to improve
    - Weakens bull-case absorption of sector overcapacity
    - Re-cut scenarios toward base/bear
  notes: >-
    The triggers are chosen for observability from filings, policy releases, or partner updates rather than from internal dashboards.
