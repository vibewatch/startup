  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-economics
    missingEvidence: >-
      Exact post-money cap table, liquidation preferences, anti-dilution protections, and governance rights from the 2024 Series A.
    whyItMatters: >-
      A headline valuation without the preference stack can materially overstate what common-equity fair value really is.
    diligencePath: Obtain subscription agreements, shareholder register updates, and board approvals for the round.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: standalone-financials
    missingEvidence: Audited 2025 and Q1 2026 standalone subsidiary revenue, gross margin, EBITDA, and cash-burn data.
    whyItMatters: >-
      Without subsidiary financials, valuation must remain scenario-based and cannot graduate to a high-confidence buy or avoid call.
    diligencePath: Request audited entity-level statements and a bridge to LONGi parent disclosures.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Order-book detail showing recurring revenue, backlog quality, cancellation rights, and customer concentration.
    whyItMatters: >-
      The difference between strategic narrative and priceable value is whether order momentum converts into durable, well-structured revenue.
    diligencePath: Review signed customer contracts, backlog aging, and cohort-level renewal or repeat-order data.
    relatedQuestionRefs:
    - QV027
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: europe-localization-economics
    missingEvidence: >-
      A tender-ready Europe operating model with sourcing, assembly, and service economics under current localization rules.
    whyItMatters: >-
      Europe is the most important premium-upside option and the most obvious export-friction bottleneck, so valuation should discount it until the model is concrete.
    diligencePath: Request the workshare model with HydrogenPro, target tenders, and regulatory-compliance memos.
    relatedQuestionRefs:
    - QV016
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: minor
    topic: >-
      TV004 comparable valuation coverage remains partial because the public comp set is illustrative rather than exhaustive.
    missingEvidence: >-
      A broader, directly comparable set of listed alkaline-electrolyzer peers with harmonized revenue and margin data.
    whyItMatters: >-
      The current comparable table is sufficient for entry-discipline context, but it is not a full market map and therefore should not be over-interpreted as a precision comp basket.
    diligencePath: >-
      Expand the public-comp set with additional listed electrolyzer or industrial-hydrogen names once directly comparable financials are available.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV004
