- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Valuation / multiple
  - Relevance
  - Limitation
  rows:
  - - ITM Power
    - Public UK-listed pure-play electrolyzer and hydrogen systems company
    - ~$1.19bn market cap in June 2026
    - Best-known listed electrolyzer peer with visible equity mark
    - Market cap is volatile and not a direct fair-value multiple for LONGi Hydrogen
  - - Nel ASA
    - Public Norway-listed hydrogen equipment company
    - ~$0.46bn market cap in June 2026
    - Shows how far listed hydrogen-equipment valuations can compress after sector hype
    - Different portfolio mix and longer public-market history
  - - thyssenkrupp nucera
    - Public Germany-listed industrial electrolysis and chlor-alkali company
    - ~$1.12bn market cap in June 2026
    - Useful for comparing larger industrial credibility against valuation
    - Business mix is broader and not a startup-like growth profile
  - - HydrogenPro
    - Public Norway-listed alkaline electrolyzer specialist
    - ~NOK 200.7m market cap; ~2.37x trailing sales on 19 June 2026
    - Most directly relevant small-cap alkaline peer and also LONGi’s partner
    - Very small scale and financially stressed, so it may understate fair strategic value
  - - LONGi Hydrogen Energy
    - Private China-based alkaline electrolyzer subsidiary
    - Reported >CNY 10bn post-money in 2024 round
    - Current private reference point for entry discipline
    - No public filing fixes exact post-money, preferences, or standalone revenue
  notes: >-
    The table is an evidence-backed valuation context table, not a claim that these companies are directly interchangeable. It uses market cap or publicized private mark because audited standalone revenue for LONGi Hydrogen is unavailable.
