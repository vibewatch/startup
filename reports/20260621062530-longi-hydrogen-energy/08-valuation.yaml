  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - Anti-thesis
  - What would change the view
  rows:
  - - Strategic parent and category positioning justify premium value
    - Parent support, domestic share claims, and Europe option value
    - Parent scale does not substitute for subsidiary unit economics
    - Audited standalone subsidiary financials
  - - 2024 funding validates investor appetite
    - Round size and investor roster are non-trivial
    - Round terms and exact post-money are not publicly verified
    - Cap table plus executed subscription documents
  - - Chinese cost leadership can create global share gains
    - CRU and H2Tech both show a real cost edge
    - Cost edge narrows after freight, tariffs, and standards adaptation
    - Tender wins that show profitable export conversion
  - - HydrogenPro alliance adds Europe-localization optionality
    - NOK 140m investment and 1 GW capacity access are tangible
    - Partner liquidity and policy screens can still block scale-up
    - Europe project list with sourcing compliance and service model
  notes: >-
    The anti-thesis column is intentionally stringent because the current task is valuation discipline, not narrative maximization.
