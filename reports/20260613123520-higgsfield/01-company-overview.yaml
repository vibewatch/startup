  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: "Audited financial statements showing actual cash burn, gross margin, and path to profitability; bank records or CFO attestation of the claimed $500K burn figure"
      whyItMatters: "Burn rate and profitability horizon are central to valuation; the single-source company claim of $500K burn over 10 months is implausible given compute costs and headcount and has not been audited"
      diligencePath: "Request audited financials or management accounts showing monthly P&L, gross margin by product tier, and net revenue retention from the company during due diligence"
      relatedQuestionRefs: [QO015]
    - type: stale
      severity: minor
      topic: headcount
      missingEvidence: "Current employee headcount and team distribution as of June 2026; the January 2026 figure of ~70 employees and the stated target of ~300 by year-end may both be outdated"
      whyItMatters: "Headcount progression against plan is a leading indicator of operational scaling capability; missing current data prevents assessment of execution against growth commitments"
      diligencePath: "Request current LinkedIn headcount data or direct company disclosure of current employee count by function and location"
      relatedQuestionRefs: [QO012]
    - type: stale
      severity: material
      topic: ARR
      missingEvidence: "Higgsfield's ARR as of June 2026; the most recent public figure ($300M, early February 2026) is approximately four months old at run date and has not been updated"
      whyItMatters: "ARR trajectory post-adverse event is critical to assessing whether the February 2026 Forbes investigation caused material churn or growth deceleration"
      diligencePath: "Request the most recent monthly ARR figure, subscriber count, and net revenue retention directly from the company; cross-reference with ARR Club or SaaStr benchmarks if available"
      relatedQuestionRefs: [QO018]
    - type: private-evidence-only
      severity: minor
      topic: governance
      missingEvidence: "Full board composition beyond Jeff Herbst; board observer rights granted to investors; equity cap table showing founder and investor ownership percentages"
      whyItMatters: "Board composition affects governance quality, founder control, and the likelihood of disciplined decision-making; the February 2026 marketing failures raise governance accountability questions"
      diligencePath: "Request cap table, board composition, and any shareholder rights agreements from the company; review SEC Form D filings if any investors filed them"
      relatedQuestionRefs: [QO028]
