company:
  name: Higgsfield
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Higgsfield is a San Francisco-based AI video generation startup founded in October 2023 by
    ex-Snap AI head Alex Mashrabov and Kazakhstan-based engineer Yerzat Dulat, achieving a
    $1.3 billion valuation and $200 million ARR within nine months of its April 2025 commercial
    launch; rapid growth has been accompanied by material adverse events — distribution of racist
    promotional content, user throttling on "unlimited" plans, and creator payment failures —
    that the company publicly acknowledged and partially remediated by June 2026.
sections:
  - id: identity-product-business-model
    title: "Identity, Product, and Business Model"
    body: >-
      Higgsfield Inc., headquartered in San Francisco, California, describes its core offering
      as an AI-native generative video platform and "video reasoning engine" designed to automate
      commercial video production for brands, agencies, and social media marketing teams. Founded
      in October 2023 and commercially launched in April 2025 with a browser-based product, the
      company reached over 25 million registered users and approximately 6 million video
      generations per day as of June 2026. Rather than training a single proprietary foundation
      model, Higgsfield aggregates over twelve third-party AI video and image models — including
      OpenAI Sora 2, Google Veo 3.1 and Nano Banana, Alibaba WAN, Kuaishou Kling 3.0, and
      Bytedance Seedream and Seedance — into a unified end-to-end production interface covering
      ideation, storyboarding, animation, editing, and publishing in a single browser session.
      Differentiated features include Cinema Studio 2.0 (launched February 2026; 70+ camera
      motion presets), Soul ID (persistent character consistency across scenes), a UGC Builder
      for authentic-style ad content, and a Marketing Studio that converts product URLs into
      campaign-ready video variants via its "URL-to-Ad" automation pipeline. Revenue is generated
      through tiered subscriptions as of June 2026: Starter at $15/month (200 credits), Plus at
      $34/month (1,000 credits), Ultra at $84/month (3,000 credits), and enterprise or team plans
      at negotiated pricing; credits expire after 90 days. The company claims SOC2 and ISO 42001
      alignment, GDPR compliance, and serves over 100,000 business teams. Its initial consumer
      mobile-app concept (a ChatGPT-for-video product) was abandoned after consumers proved
      unwilling to pay; the pivot to professional creators and marketers proved decisive.
    claimRefs: [CO001, CO002, CO008, CO009, CO010, CO011, CO037, CO038, CO039, CO042, CO044, CO045]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-governance
    title: "Leadership and Governance"
    body: >-
      Higgsfield was co-founded by Alex Mashrabov (CEO) and Yerzat Dulat (CTO). Mashrabov
      previously served as Head of Generative AI at Snap Inc., where he built deep experience
      in social media content generation at scale; his public profile is central to the
      company's investor and media narratives. Dulat, based in Kazakhstan, leads Higgsfield's
      engineering organization across its San Francisco and Almaty offices. Mahi de Silva joined
      as co-founder and Chief Strategy Officer in early 2025 and oversees marketing, influencer
      strategy, and go-to-market; his public role in the February 2026 Forbes investigation —
      acknowledging marketing process failures — has made him a visible risk vector. Jeff Herbst,
      formerly Head of Corporate Development at NVIDIA and managing partner at lead investor GFT
      Ventures, serves on Higgsfield's board; his 20-year NVIDIA tenure spanning developer
      ecosystems and AI infrastructure adds strategic value, and he has been the primary external
      voice amplifying Higgsfield's growth narrative to the press and investor community. Active
      hiring on the careers page spans Engineering & Product, G&A, Marketing & Sales, and
      Research & Development in both San Francisco and Almaty, indicating a distributed
      international structure. As of January 2026 Higgsfield had approximately 70 employees, with
      a stated target of approximately 300 by year-end 2026. Key-person dependence on Mashrabov
      is notable; board composition beyond Jeff Herbst has not been publicly disclosed, limiting
      governance assessment from the outside.
    claimRefs: [CO001, CO003, CO004, CO005, CO006, CO007, CO024, CO033, CO036, CO043]
    tableRefs: [TO002]
    figureRefs: []
  - id: funding-capitalization
    title: "Funding History and Capitalization"
    body: >-
      Higgsfield's capitalization history reflects exceptional early investor conviction. In
      September 2025, the company closed an oversubscribed $50 million Series A led by GFT
      Ventures with participation from BroadLight Capital, NextEquity Partners, AI Capital
      Partners (Alpha Intelligence Capital's U.S. fund), Menlo Ventures, and Alpha Square Group.
      On January 15, 2026 — only four months later — Higgsfield announced an $80 million Series
      A extension with Accel, AI Capital Partners, and Menlo Ventures, bringing total Series A
      financing to over $130 million and establishing a post-money valuation exceeding $1.3 billion;
      the strategic lead was Alpha Intelligence Capital's Antoine Blondeau. Third-party aggregator
      GetLatka records total lifetime funding at approximately $188 million across three rounds,
      implying a seed or pre-Series A tranche not separately announced. CEO Mashrabov stated in
      February 2026 that Higgsfield was in discussions for another capital raise. CSO de Silva
      claimed the company burned only $500,000 over its first ten months before reaching $200
      million ARR — a figure not independently audited. Venture investors interviewed by Forbes
      expressed skepticism about the unit economics behind Higgsfield's heavily-discounted
      subscriber acquisition programs. Secondary transactions and debt facilities have not been
      publicly disclosed. The full equity cap table, including percentage ownership by round
      and any secondary sales by founders, remains private.
    claimRefs: [CO012, CO013, CO014, CO015, CO025, CO026, CO027, CO041]
    tableRefs: [TO003]
    figureRefs: []
  - id: scale-milestones-adverse
    title: "Scale, Milestones, and Adverse Events"
    body: >-
      Higgsfield's commercial velocity is exceptional: from $0 to $200 million ARR in under
      nine months from product launch (April 2025 to January 2026), a trajectory the company
      benchmarked against Lovable, Cursor, OpenAI, Slack, and Zoom. By early February 2026 ARR
      had reached $300 million, with CEO Mashrabov targeting $1 billion by year-end 2026.
      Registered users grew from 11 million (September 2025) to 15 million (January 2026) to
      over 25 million (June 2026); daily video generation volume rose from 4.5 million per day
      (January 2026) to approximately 6 million per day (June 2026). The platform has generated
      over 850 million total items. Paying subscribers reached approximately 300,000 by early
      February 2026. However, rapid scale has produced material adverse events. A February 2026
      Forbes investigation documented three categories of failure: (1) Higgsfield's marketing team
      distributed a media kit for its Vibe Motion launch containing stock video clips from Envato
      falsely presented as AI-generated, and separately distributed to creators videos featuring
      overtly racist depictions of popular animated characters and non-consensual deepfakes of
      public figures; (2) Higgsfield's X account was suspended for "inauthentic behavior"
      following the promotion; (3) multiple users on "unlimited" subscription plans experienced
      severe performance throttling, prompting $1.35 million in refunds. CSO de Silva acknowledged
      all three failures publicly, attributing them to processes that "hadn't always kept pace
      with core values." Higgsfield subsequently implemented mandatory legal and senior-leadership
      review for all external marketing materials. The Higgsfield Earn creator-monetization program
      also experienced payment delays affecting multiple creators, attributed by the company to
      fraudulent activity detection challenges.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO039, CO040, CO041, CO045]
    tableRefs: [TO004]
    figureRefs: [FO001]
