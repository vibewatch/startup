callouts:
  - calloutType: insight
    title: "No Rigorous Sub-Market SAM Estimate Exists — This Is the Key Sizing Gap"
    body: >-
      Despite the AI video market generating significant investor attention and multiple
      headline TAM figures ($200B-$600B), no independent analyst has published a rigorous
      bottom-up estimate for the AI-native marketing video SaaS sub-market that Higgsfield
      actually addresses. All available estimates use boundaries too broad to price the
      real serviceable opportunity. The derived SAM of $2B-$10B is the author's calculation
      and should be treated as a sensitivity range, not a market fact, until an independent
      analyst validates it.
    claimRefs: [CM001, CM002, CM036]
  - calloutType: risk
    title: "Sora Web Discontinuation Removes a Key Model Differentiator"
    body: >-
      OpenAI discontinued the Sora web and app experience on April 26, 2026 — removing
      Higgsfield's ability to cite Sora as a live consumer-facing integration that it was the
      largest customer of. While the Sora API remains available until September 2026, this
      sunset reduces Higgsfield's model differentiation relative to competitors and raises a
      precedent question: what happens when other key model integrations (Veo, Kling) pivot
      access terms or are internalized by their parent companies?
    claimRefs: [CM009, CM010, CM039, CM040]
  - calloutType: strength
    title: "Multi-Model Aggregator Architecture Reduces Dependency on Any Single Model Provider"
    body: >-
      Higgsfield's strategic choice to aggregate twelve-plus models rather than build a single
      proprietary foundation model provides architectural resilience against model provider
      concentration risk — the Sora discontinuation affected the company but did not halt
      operations because Kling 3.0, Veo 3.1, Minimax Hailuo, and Seedance provide functional
      alternatives. This architecture also creates a structural competitive advantage over
      single-model platforms like Runway, which must rebuild integrations when they add new
      models, while Higgsfield's workflow layer is already model-agnostic.
    claimRefs: [CM028, CM031, CM039, CM040]
