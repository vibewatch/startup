  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Bull Argument
      - Evidence
      - Anti-Thesis
      - What Would Change the View
    rows:
      - - Hypergrowth is real, not merely a concept narrative
        - ARR reportedly moved from $11M in February 2025 to $200M in January 2026 and $300M by February 2026
        - Run-rate velocity can still mask weak retention, subsidized acquisition, or margin-poor usage
        - Release cohort retention, refund-adjusted ARR bridge, and paid-user churn by plan
      - - Founder quality and investor quality reduce execution risk
        - Alex Mashrabov previously sold AI Factory and led generative AI at Snap; Accel and Menlo backed the company
        - Strong founders and investors do not neutralize platform-safety or unit-economics failures
        - Provide operating dashboards showing that execution quality matches founder pedigree
      - - Multi-product surface can expand monetization beyond a single viral app
        - Official pages show multiple creation surfaces including Cinema Studio, Canvas, Motion, and enterprise workflows
        - Broader surface area can also increase moderation burden and compute cost complexity
        - Show product-level revenue mix, margin by workflow, and enterprise expansion rates
      - - Current valuation looks lower than some private AI-video peers on ARR
        - Higgsfield screens around 4.3x-6.5x ARR versus roughly ~7x for HeyGen and mid-teens for Runway
        - Peer data are sparse and not fully apples-to-apples; quality discounts may be deserved
        - Confirm NRR, gross margin, and cash efficiency to justify using premium peer frames
      - - Viral reach could support long-term platform economics
        - 15M users in January 2026 and 24M+ by June 2026 indicate large funnel depth
        - Funnel scale is less valuable if billing complaints and refunds impair trust or conversion quality
        - Show conversion, repeat usage, and complaint-rate improvement after the February 2026 incident
    notes: >-
      Each row pairs a real upside vector with the principal underwriting objection that still prevents a
      stronger recommendation.
    claimRefs: [CV001, CV005, CV006, CV008, CV010, CV019, CV021, CV023, CV029, CV030]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - ARR 2026E
      - Implied EV
      - ARR Multiple
      - Key Risk
      - Probability Signal
    rows:
      - - Bull
        - Growth remains extreme, safety controls hold, enterprise/API mix lifts revenue quality, and compute costs prove manageable
        - $400M-$500M
        - $2.8B-$4.0B
        - 7.0x-8.0x
        - Multiple only holds if retention and margin look software-like
        - Possible, but requires several private metrics to break favorably at once
      - - Base
        - Growth stays strong but not perfect; valuation waits on proof of retention, margin, and refund normalization
        - $260M-$320M
        - $1.5B-$2.2B
        - 5.0x-7.0x
        - Market discounts quality uncertainty despite healthy topline
        - Highest-probability public-only path given current evidence
      - - Bear
        - Refunds, moderation failures, or vendor-cost pressure expose weaker durability and force slower growth
        - $180M-$220M
        - $0.9B-$1.2B
        - 4.0x-5.5x
        - Down round or repeat scandal drives abrupt multiple compression
        - Material tail risk because key proof points remain private
    notes: >-
      Scenario bands are analyst estimates anchored to disclosed ARR points and the available private/public
      comp set; they are not management guidance.
    claimRefs: [CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
  - id: TV004
