        Higgsfield itself, two direct private peers with public funding anchors, one enterprise-oriented private
        benchmark, and one mature public software benchmark. It is not a full global census because private
        AI-video revenue disclosure is sparse, stale, and inconsistent across companies.
    rows:
      - - Higgsfield
        - Series A extension / Jan 2026
        - $1.3B post-money
        - $200M ARR in Jan 2026; ~$300M ARR reported in Feb 2026
        - 6.5x on $200M; 4.3x on $300M
