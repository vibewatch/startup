callouts:
  - id: KV001
    calloutType: insight
    title: Valuation already compresses to 4.3x on the February 2026 ARR lens
    body: >-
      The most important framing point is that Higgsfield's $1.3B mark is not being compared against a
      tiny experimental revenue base. If the February 2026 Forbes run-rate of roughly $300M is directionally
      right, the valuation is already near 4.3x ARR — cheaper than many private AI-software narratives.
      That supports continued diligence, but it does not eliminate the need to verify whether ARR is durable,
      refund-adjusted, and margin-accretive.
    claimRefs: [CV006, CV009, CV029]
