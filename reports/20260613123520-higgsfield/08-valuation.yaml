  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / Event
      - Risk Type
      - Action Implication
    rows:
      - - Financing reset
        - Next priced round occurs below the $1.3B mark or requires emergency bridge capital
        - Valuation / financing risk
        - Re-underwrite from bear-case assumptions and pause new investment
      - - Repeat safety scandal
        - Another documented racist, non-consensual deepfake, or deceptive-marketing episode reaches mainstream press
        - Reputational / legal risk
        - Treat as thesis-break until governance controls are independently evidenced
      - - Billing and refund pattern persists
        - Refunds, throttling complaints, or forced charges remain material after management remediation
        - Revenue-quality risk
        - Discount ARR quality and reduce acceptable entry multiple
      - - Unit-economics miss
        - Diligence reveals gross margin materially below software-like levels or vendor costs dominate contribution margin
        - Margin / model risk
        - Reframe Higgsfield as compute-resale-heavy rather than software-like
      - - Platform dependency shock
        - Major pricing, access, or policy change from OpenAI/Sora or another critical model supplier impairs product economics
        - Partner concentration risk
        - Increase downside weighting and seek supplier-diversification proof before proceeding
    notes: >-
      These are investor monitoring rules rather than company-stated thresholds; they highlight what would most
      quickly invalidate the current public-only valuation case.
    claimRefs: [CV022, CV023, CV024, CV026, CV046, CV047]
  - id: TV006
    title: Final diligence asks table
    columns:
      - Ask
      - Rationale
      - Priority
    rows:
      - - Provide audited 2025 and YTD 2026 P&L, balance sheet, cash flow, and ARR bridge
        - Needed to verify that run-rate growth converts to recognized recurring revenue and real cash generation quality
        - Critical
      - - Provide cohort retention, gross revenue retention, NRR, and churn by plan and customer segment
        - This is the single biggest missing proof point for whether current ARR deserves a premium multiple
        - Critical
      - - Provide gross margin and contribution margin by workflow and by third-party model family
        - Required to test whether scale economics improve or worsen as premium video generation grows
        - Critical
      - - Provide full cap table, share classes, liquidation preferences, anti-dilution terms, and any side letters
        - Return quality at a $1.3B entry depends on who gets paid first in flat or moderately up outcomes
        - High
      - - Provide refund history, complaint-rate trend, and post-February 2026 remediation metrics
        - Necessary to determine whether billing friction was a one-off clean-up or a structural monetization issue
        - High
      - - Provide current OpenAI and other key model-supplier contracts, pricing tiers, and concentration by spend
        - Vendor concentration could meaningfully reshape both margin and product continuity risk
        - High
      - - Provide board reporting on moderation, legal review, and deepfake-governance controls
        - Needed to judge whether trust-and-safety risk is now managed at governance level rather than ad hoc
        - High
    notes: >-
      The first three asks are effectively gating items for any upgrade from research-more to buy-like conviction.
    claimRefs: [CV030, CV044, CV048, CV049, CV050]
