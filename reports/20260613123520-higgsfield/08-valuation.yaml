  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: NRR disclosure
      missingEvidence: Net revenue retention, gross revenue retention, and churn by plan and customer segment.
      whyItMatters: NRR is the clearest public-missing variable for deciding whether current ARR deserves a premium multiple or a discount.
      diligencePath: Request cohort tables from management or lead investors under NDA.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: gross margin disclosure
      missingEvidence: Gross margin and contribution margin by workflow and by third-party model family.
      whyItMatters: Margin structure determines whether Higgsfield should be valued like software, media, or compute-enabled resale.
      diligencePath: Request detailed unit-economics schedules and model-supplier cost breakdowns.
      relatedQuestionRefs: [QV009]
    - type: private-evidence-only
      severity: material
      topic: audited financials
      missingEvidence: Audited 2025 financial statements and a recognized-revenue bridge for 2026 year-to-date performance.
      whyItMatters: Without audited statements, investors cannot verify that the revenue run-rate claims map cleanly to durable recurring revenue.
      diligencePath: Request audited financial package, management accounts, and reconciliation from ARR to recognized revenue.
      relatedQuestionRefs: [QV019]
    - type: conflicting-data
      severity: material
      topic: burn verification
      missingEvidence: Independent evidence that reconciles the reported ten-month burn figure with user volume, vendor costs, and headcount.
      whyItMatters: If burn is materially higher than framed, the current valuation may face earlier dilution or weaker cash efficiency than expected.
      diligencePath: Request monthly cash-burn history, cloud or model-supplier invoices, and board-level budget reporting.
      relatedQuestionRefs: [QV021]
    - type: private-evidence-only
      severity: material
      topic: cap table and preferences
      missingEvidence: Full capitalization table, liquidation waterfall, anti-dilution terms, and any investor-specific side letters.
      whyItMatters: Return quality at a $1.3B entry depends on preference overhang as much as on enterprise value growth.
      diligencePath: Obtain the latest cap table and financing documents from the company or lead investors.
      relatedQuestionRefs: [QV022]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable coverage
      missingEvidence: A fuller set of private AI-video peers with disclosed ARR, revenue quality, and round terms.
      whyItMatters: The comp table is directionally useful but cannot prove that Higgsfield deserves the exact same premium or discount as every peer.
      diligencePath: Extend peer work with additional private-market data sources, investor materials, and more current public benchmarks.
      relatedQuestionRefs: [QV016, QV017]
      relatedTableRefs: [TV004]
acknowledgedWarnings:
  - dimension: tableNotes
    reason: Recommendation and scenario tables are intentionally judgmental synthesis artifacts; concise notes are sufficient because the underlying support is carried by claimRefs and localEvidence rather than by raw source tabulation inside each cell.
