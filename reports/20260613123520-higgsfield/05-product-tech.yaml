- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Cinema Studio 2.0
    - Pro filmmakers, brand creators
    - GA (Feb 2026)
    - 70+ camera presets, optical-physics-style control, stacked motion
    - Dynamic motion quality is only 3-4/10 in one independent stress test and no benchmark versus peers is published
  - - Marketing Studio (Hermes Agent)
    - Marketing teams, ecommerce operators
    - GA
    - URL-to-video workflow with 9 formats and automated brief generation
    - Output consistency across repeated runs and arbitrary product URLs is not independently benchmarked
  - - AI Influencer Studio
    - Social media managers, brands
    - GA
    - Persistent Soul ID character with broad attribute control
    - Liability for synthetic likenesses and deepfake misuse is not addressed in product-specific detail
  - - Soul ID
    - Brands, creators, agencies
    - GA
    - 20+ photo training in about 3 minutes with cross-scene identity persistence
    - Performance degrades in dynamic action and no third-party quality benchmark exists
  - - Lipsync Studio
    - Multilingual brands
    - GA
    - 20+ language phoneme-level sync for dubbed video
    - Public multilingual accuracy evidence is absent
  - - Popcorn storyboard
    - Pre-production teams
    - GA
    - 8-10 consistent planning scenes that can be animated downstream
    - Complex multi-scene narrative consistency at production scale is still unverified publicly
  - - MCP Server
    - AI developers, agent platforms
    - GA (2026)
    - Agent-facing generation surface for Claude and other MCP clients
    - Adoption, rate limits, and error handling telemetry are not public
  - - Supercomputer
    - Marketing ops teams
    - GA (2026)
    - Plain-language multi-step content creation with auto-model routing
    - Agentic reliability and failure recovery at scale are not documented publicly
  - - Image Generator suite
    - Brand, marketing, editorial teams
    - GA
    - 4K image output, inpainting, relighting, and background changes
    - Commercial rights and likeness rules for synthetic human imagery need tighter diligence
  - - Recast
    - Video editors, brands
    - GA
    - In-video character replacement without green screen
    - Accuracy in complex lighting and motion environments is unproven publicly
  notes: Rows summarize customer-facing modules from official product pages with independent review checks where available; gaps flag the most important missing proof rather than missing features.
