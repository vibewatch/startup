  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audit-gap
    missingEvidence: A downloadable SOC2 Type II report, ISO 42001 certificate, or public DPA that matches Higgsfield's enterprise trust claims.
    whyItMatters: Enterprise buyers and investors cannot distinguish self-described alignment from independently audited controls without an artifact.
    diligencePath: Request the latest SOC2 report, ISO certificate, DPA template, and security questionnaire responses directly from the company under NDA.
    relatedQuestionRefs:
    - QE009
    - QE011
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: soul-id-limitations
    missingEvidence: An independent benchmark of Soul ID character consistency and motion quality versus named alternative tools across low-motion and high-motion scenes.
    whyItMatters: Persistent-character quality is central to Higgsfield's product differentiation, yet one public review is not enough to underwrite performance durability.
    diligencePath: Commission a controlled bake-off using identical prompts, training photos, and motion scenarios across Higgsfield and at least two competing stacks.
    relatedQuestionRefs:
    - QE010
    - QE020
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: mcp-observability-gap
    missingEvidence: Real adoption counts, latency distributions, rate limits, error rates, and incident history for the MCP integration surface.
    whyItMatters: Developer tooling can look strategically important while still being commercially immaterial or operationally fragile.
    diligencePath: Request MCP usage dashboards, customer references, API or MCP SLA data, and support logs from the engineering team.
    relatedQuestionRefs:
    - QE017
    - QE023
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: material
    topic: hermes-reliability-gap
    missingEvidence: A reproducible benchmark showing Hermes Agent's extraction accuracy and failure rate across a broad set of product URLs and catalog schemas.
    whyItMatters: URL-to-video automation is a core workflow promise, so weak extraction reliability would directly reduce ROI and increase credit waste.
    diligencePath: Run a monitored pilot over a sample of ecommerce pages covering different CMS stacks and compare extracted fields against ground truth.
    relatedQuestionRefs:
    - QE012
    - QE021
    relatedTableRefs:
    - TE002
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: compute-intensity
    missingEvidence: Per-generation GPU-time assumptions, queueing telemetry, and region-level infrastructure data behind the reported millions of daily videos.
    whyItMatters: Without infrastructure telemetry, outside estimates of compute burden and unit economics remain directional rather than underwriteable.
    diligencePath: Ask for infrastructure cost dashboards, per-model render times, and peak-load queue metrics during technical diligence.
    relatedQuestionRefs:
    - QE007
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: likeness-rights
    missingEvidence: Product-specific commercial-use guidance and legal opinions on synthetic likeness, consent, and advertising-safe usage for AI influencer workflows.
    whyItMatters: Brands can create compliance and reputational exposure if rights management around synthetic humans is weaker than the marketing surface implies.
    diligencePath: Review counsel memos, takedown history, creator release flows, and indemnity language tied to AI Influencer and Recast workflows.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE004
  - type: conflicting-data
    severity: minor
    topic: vibe-motion-ambiguity
    missingEvidence: Technical documentation that cleanly distinguishes Vibe Motion's generative mechanics from any template-assisted or compositing workflow.
    whyItMatters: The February 2026 controversy makes it important to separate launch marketing from actual underlying product behavior.
    diligencePath: Request a product demo, engineering notes, and retained sample provenance for Vibe Motion outputs.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE005
