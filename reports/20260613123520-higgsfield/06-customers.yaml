  evidenceGaps:
    - type: missing-disclosure
      severity: blocking
      topic: retention-gaps
      missingEvidence: 'Net revenue retention, gross retention, churn, renewal, and cohort-retention data by plan tier and by enterprise versus self-serve segment.'
      whyItMatters: 'Customer durability cannot be underwritten from user-growth or ARR alone when the strongest public sentiment indicators are mixed.'
      diligencePath: 'Request monthly cohort tables, churn waterfall, and NRR/GRR definitions directly from the company finance or growth team.'
      relatedQuestionRefs:
        - QU007
        - QU021
      relatedTableRefs:
        - TU004
    - type: missing-disclosure
      severity: material
      topic: marquee-logos
      missingEvidence: 'Direct confirmation from Nike, Coca-Cola, McDonald''s, or their agencies that Higgsfield was used in production campaigns.'
      whyItMatters: 'Marquee enterprise-brand proof materially affects confidence in Higgsfield''s ability to convert creator traction into durable B2B credibility.'
      diligencePath: 'Obtain customer references, campaign approvals, or agency-side confirmation before treating the logos as verified customer proof.'
      relatedQuestionRefs:
        - QU009
      relatedTableRefs:
        - TU003
    - type: missing-disclosure
      severity: material
      topic: geography-gap
      missingEvidence: 'Geographic split of active users, paying users, and ARR by region or country.'
      whyItMatters: 'Without geography data, it is impossible to judge regulatory concentration, go-to-market focus, or exposure to region-specific creator or ad-spend cycles.'
      diligencePath: 'Request management reporting on ARR and MAUs by geography, plus top-ten country concentration.'
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU005
    - type: missing-disclosure
      severity: material
      topic: conversion
      missingEvidence: 'A clean free-to-paid conversion rate using matched time periods and active-user definitions rather than total registrations.'
      whyItMatters: 'The reported 24M-plus creators and 300K payers imply low conversion, but the comparison is noisy because one number is a June company claim and the other is a February media report.'
      diligencePath: 'Request funnel data from registrations to active users to first-time payers, segmented by creator, team, and enterprise motion.'
      relatedQuestionRefs:
        - QU007
      relatedTableRefs:
        - TU002
    - type: missing-disclosure
      severity: material
      topic: enterprise-arr
      missingEvidence: 'Enterprise ARR as a percentage of total ARR and the count of customers above material contract thresholds.'
      whyItMatters: 'The valuation and durability story depends heavily on whether ARR is concentrated in low-ticket self-serve plans or in stickier team and enterprise relationships.'
      diligencePath: 'Request segment revenue mix, top-customer concentration, and counts of customers above $25K, $100K, and $1M ARR.'
      relatedQuestionRefs:
        - QU008
        - QU026
      relatedTableRefs:
        - TU005
