callouts:
  - calloutType: strength
    title: Marketing-team majority could improve monetization quality
    body: 'If the 85% professional-marketer composition estimate is directionally right, Higgsfield is not just a consumer novelty app. It is increasingly embedded in campaign production budgets, which should make repeat spend more durable than a purely discretionary creator tool.'
    claimRefs:
      - CU004
      - CU006
      - CU038
  - calloutType: risk
    title: Trustpilot and Earn complaints are real churn signals
    body: 'The top-line ARR story is impressive, but public customer feedback remains noisy. Trustpilot complaints, throttling allegations, $1.35 million in refunds, and creator payment delays all suggest that retention quality may lag customer acquisition quality.'
    claimRefs:
      - CU012
      - CU014
      - CU015
      - CU016
      - CU017
  - calloutType: risk
    title: Marquee logo proof is weaker than the marketing narrative
    body: 'Vertex CGI is credible production proof, but the biggest consumer-brand names in circulation remain cofounder claims rather than independently confirmed reference accounts. That matters because enterprise credibility often gets over-inferred from logo mention alone.'
