  topStrengths:
    - >-
      Founder-market fit is unusually strong given Alex Mashrabov's Snap/AI Factory background and the team's ability to
      ship creator-native workflows quickly.
    - >-
      Higgsfield appears to have found a real commercial wedge in marketer-led short-form video creation rather than
      relying only on hobbyist creator demand.
    - >-
      The product bundles multiple frontier models, storyboard-to-publish workflow steps, and character/brand
      consistency into one browser-native environment.
    - >-
      The company has already attracted top-tier investors and enough scale to justify serious diligence rather than
      dismissive category skepticism.
  topRisks:
    - >-
      February 2026 content-safety, deepfake, and billing incidents show governance and operational controls may lag
      growth.
    - >-
      Unit economics, gross margin, burn, refund dynamics, and true revenue quality remain unverified by audited
      disclosures.
    - >-
      Higgsfield's product edge depends heavily on third-party model suppliers and continued access to premium external
      generation APIs.
    - >-
      Customer quality is opaque: user growth is public, but retention, concentration, enterprise expansion, and
      denominator definitions remain noisy.
  unresolvedGaps:
    - >-
      Audited or reviewed bridge from subscriptions and enterprise spend to recurring ARR, including refunds and
      credits.
    - Net revenue retention, cohort behavior, and concentration by marketer, agency, and enterprise customer segment.
    - >-
      Supplier-cost concentration, gross margin by product line, and the real burn profile behind 4.5M+ daily
      generations.
    - Cap-table detail, liquidation preferences, and evidence that post-February 2026 process fixes are durable.
