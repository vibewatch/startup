      - number: '2.2'
        title: 市场规模：TAM、SAM 与可用视角
        blocks:
          - type: paragraph
            body: >-
              AI 视频创作有多种市场规模估算，但边界不一致，直接比较并不可靠。最宽口径的估算——归因于 ainvest 引用市场研究汇编——把全球 AI 视频市场定为 $600 billion，几乎肯定涵盖了远超
              Higgsfield 订阅产品的硬件、基础设施和服务。Menlo Ventures 投资人 Amy Wu 在为 Higgsfield 2025 年 9 月 Series A 背书时引用了美国视频创作年市场
              $200 billion，这一数字包含传统制作，并非专指 AI 原生工具。GFT Ventures 的 Jeff Herbst 定性认为，社交媒体营销人员对 AI 视频的需求「可能超过
              Hollywood」，暗示可服务市场大于估计 $100 billion 的全球影视制作行业。上述数字都没有单独切出 AI 原生营销视频 SaaS 子市场。根据 Higgsfield 自身披露指标，可以粗略推导
              SAM：如果 Higgsfield 在 2026 年 2 月 $300 million ARR 时持有 3% 到 15% 的市场份额，隐含 SAM 介于 $2 billion 到 $10
              billion——区间很宽，完全由未知分母驱动。Higgsfield 自身增长轨迹中 ARR Club 跟踪的 870% 年化 CAGR 不能外推为全市场增长率。未找到独立分析师报告单独测算 AI 原生营销视频
              SaaS 子市场；这是市场规模尽调中最关键的单一证据缺口。
