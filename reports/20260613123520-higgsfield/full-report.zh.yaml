      - - Runway
        - 直接创意同业
        - 历史累计融资 $237M+；自有 Gen-4.5 技术栈；自助定价清晰
        - 创作者、电影制作人、设计团队、专业消费者
        - 掌握一方模型路线图，叠加剪辑 / 工作流套件
        - 如果买方想用外部最优模型，灵活性不如路由器
      - - Synthesia
        - 商务视频专门厂商
        - 定价页称 50,000+ 团队使用；公开信任 / 合规技术栈
        - L&D、销售、HR、营销、传播团队
        - 企业治理、虚拟人、本地化、协作
        - 不太面向电影感广告创意或实验性镜头语言
      - - Pika
        - 创意消费级挑战者
        - 当前素材包显示 Pika 2.5 仍活跃，但缺少清晰公开定价
        - 创作者和熟悉趋势的社交用户
        - Pika Universe、智能体、MCP、移动友好特效
        - 企业包装和治理的公开证据较弱
      - - Kling AI
        - 模型原生挑战者
        - KlingAI 3.0，含 Omni、Native Audio、API 平台
        - 创作者、开发者、企业 API 买方
        - 原始模型定位强，多模态能力突出
        - 单一模型暴露，前端工作流广度证据较少
      - - OpenAI / Sora
        - 上游模型 / 收缩中的直接对手
        - 独立入口 2026 年 4 月下线；API 计划 2026 年 9 月关停
        - 开发者和路由平台伙伴，而非新的直接终端用户
        - 标杆模型质量和品牌拉力
        - 停用后没有持久的独立自助目的地
      - - Adobe Premiere + DaVinci Resolve
        - 既有替代品
        - 剪辑安装基础深，专业工作流熟悉度高
        - 剪辑师、机构、制作团队、内部工作室
        - 下游精修、后期制作和既有工具肌肉记忆
        - 不是 AI 原生多模型生成中心
      - - HeyGen
        - 相邻商务视频专门厂商
        - 独立市场报道点名为竞争对手，但保留的 2026 年细节较薄
        - 商务视频、虚拟人驱动传播、营销团队
        - 以易用性和 ROI 竞争，而不是电影感控制
        - 当前保留材料在最新定价、融资和产品深度上不完整
