      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 由 Alex Mashrabov（CEO）和 Yerzat Dulat（CTO）共同创立。Mashrabov 此前在 Snap Inc. 担任生成式 AI
              负责人，积累了大规模社交媒体内容生成经验；他的公开形象是公司投资人与媒体叙事的核心。Dulat 常驻 Kazakhstan，领导 Higgsfield 分布在 San Francisco 和 Almaty
              的工程组织。Mahi de Silva 于 2025 年初以联合创始人兼首席战略官身份加入，负责营销、网红策略和 GTM；他在 2026 年 2 月 Forbes
              调查中公开承认营销流程失败，因此成为可见的风险点。Jeff Herbst 此前担任 NVIDIA 企业发展负责人，也是领投方 GFT Ventures 的管理合伙人，目前进入 Higgsfield 董事会；他在
              NVIDIA 的 20 年经历横跨开发者生态和 AI 基础设施，带来战略价值，也一直是对媒体和投资圈放大 Higgsfield 增长叙事的主要外部声音。招聘页面覆盖 San Francisco 与 Almaty
              两地的 Engineering & Product、G&A、Marketing & Sales、Research & Development，显示公司采用分布式国际组织。截至 2026 年 1
              月，Higgsfield 约有 70 名员工，并称目标是在 2026 年底达到约 300 人。对 Mashrabov 的关键人物依赖明显；除 Jeff Herbst 外，董事会构成未公开，外部评估治理空间有限。
