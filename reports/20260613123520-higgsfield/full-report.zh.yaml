        - 下一轮定价低于 $1.3B 标记，或需要紧急过桥资本
        - 估值 / 融资风险
        - 按悲观情景假设重新承销，并暂停新投资
      - - 安全丑闻重演
        - 又一起有记录的种族主义、非自愿深伪或欺骗性营销事件进入主流媒体
        - 声誉 / 法律风险
        - 在治理控制得到独立证明前，视为投资逻辑破裂
      - - 计费和退款模式延续
        - 管理层修复后，退款、限流投诉或强制扣费仍然显著
        - 收入质量风险
        - 下调 ARR 质量，并降低可接受入场倍数
      - - 单位经济不达标
        - 尽调显示毛利率显著低于软件水平，或供应商成本主导贡献毛利
        - 毛利 / 模型风险
        - 将 Higgsfield 重新定义为计算转售权重高，而不是软件属性强
      - - 平台依赖冲击
        - OpenAI/Sora 或其他关键模型供应商发生重大定价、访问或政策变化，损害产品经济性
        - 合作伙伴集中风险
        - 提高下行情景权重，并在推进前寻求供应商多元化证明
