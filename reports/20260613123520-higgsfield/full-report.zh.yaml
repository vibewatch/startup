      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 按 2026 年 2 月 ARR 口径，估值已压缩到 4.3x
            body: >-
              最重要的框架是，Higgsfield 的 $1.3B 估值并不是拿一个很小的实验性收入基数来比较。如果 Forbes 2026 年 2 月报道的约 $300M 运行率大致正确，估值已经接近 4.3x
              ARR——比许多私营 AI 软件叙事更便宜。这支持继续尽调，但不能免除核验 ARR 是否耐久、是否已扣除退款影响、是否能增厚利润率的必要性。
            calloutType: insight
