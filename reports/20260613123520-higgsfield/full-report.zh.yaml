      - number: '8.5'
        title: 建议、终止触发点与尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅基于公开信息的建议是继续研究。公司已经跨过值得认真尽调的门槛，但还没有跨过让新投资人忽视收入耐久性和治理证据缺口的门槛。估值足够合理，进一步工作仍可能支持投资；但它还不够便宜，不能替未解决的烧钱、毛利率、队列和安全问题买单。投资人尤其应严格看待下行触发点：估值下调融资、重复的信任与安全失败，或证据显示退款和限速是获客模式的结构性组成部分，都会显著改变承销判断。通向更强建议的最快路径，不是又一个增长标题，而是审计数字、留存队列、股权结构透明度，以及证明
              2026 年 2 月丑闻是例外而非运营模式的证据。
