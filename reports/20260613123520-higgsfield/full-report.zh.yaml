      - number: '2.3'
        title: 买方细分与采用动态
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 的买方基础由社交媒体营销人员主导，占平台使用量 85%；该细分中 80% 已在交付商业作品，说明这是一笔生产基础设施采购，而不是实验预算。付款方通常是营销部门预算，由 CMO
              或数字负责人掌握，个人营销人员或设计师是用户。第二大细分是创意代理商，它们用 Higgsfield 更快、更低成本地交付客户视频 brief——平台的多模型架构让代理商无需管理多个订阅，就能按 brief
              选择最佳模型。企业与 DTC 品牌团队正在成为最高价值买方：若干 beta 客户年支出超过 $200,000，使用「URL-to-Ad」自动化流水线的 direct-to-consumer 广告主代表一种
              Higgsfield 通过 Marketing Studio 明确瞄准的「GenAI-first」运营模式。个人创作者构成庞大但 ARPU 较低的基础——Higgsfield 的 Earn
              项目瞄准该细分做病毒式分发，但遭遇付款和欺诈问题，可能限制长期变现。各细分采用触发点不同：社交媒体团队看重内容量和发布频率；DTC 广告主看重通过快速创意迭代优化
              CPA；企业品牌看重合规级内容安全与生产速度结合。预算归属从自由裁量的创作者支出（免费或 $15/month），转向营销运营明细预算（$34-$84/month+），再到企业采购（定制定价）。截至 2026 年
              2 月，Higgsfield 的 300,000+ 付费订阅用户说明免费层有可观转化，但相对 25 million 注册用户的比例（1.2% 转化率）也显示大量免费层用户尚未转化。
