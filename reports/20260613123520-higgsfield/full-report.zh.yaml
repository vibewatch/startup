      - 公开信息
      - 标价与实际价格
      - 折扣 / 未知项
      - 来源快照
    rows:
      - - 免费
        - 免费层级，访问受限
        - 官方和二级定价资料都持续提到免费入口
        - 实际收入为零；价值在获客漏斗顶部
        - 实时页面的具体 credit 额度无法机器读取
        - 官方定价页；UsagePricing；Apostle
      - - Starter / 入门付费
        - 当前二级快照约 15 USD / 月
        - 较新的定价汇总一致显示 Starter 为 $15、200 credits
        - 实际价格取决于促销折扣和充值
        - 官方实时卡片无法直接机器读取
        - UsagePricing；Fluxnote
      - - 更高消费者层级
        - 当前二级快照描述了打折年付 Plus 和 Ultra 层级，以及更大的 credit 池
        - 公开证据支撑年付折扣和分层 credits，但没有一份规范的实时卡片导出
        - 实际 ARPU 取决于模型组合和促销节奏
        - 二级来源对 2026 年具体月费阶梯说法不一
        - UsagePricing；AppReviewLab；UCStrategies
      - - 商业席位
        - 按席位计费的团队计划，包含共享 credits 和协作功能
        - 官方团队资料和评测材料都能看到 Business / team 包装
        - 部分账户的实际席位价格很可能经过谈判或促销调整
        - 当前实时数字仍依赖第三方抓取
        - UsagePricing；团队计划页面
      - - Enterprise
        - 通过演示驱动销售提供定制定价
        - 官方页面明确展示 Enterprise 包装
        - 实际价格按合同确定，不按标价表
        - 没有公开 ACV 价目表或标准条款清单
        - Enterprise 页面；官方演示流程
      - - 高级模型使用经济性
        - 单条片段的 credit 消耗会随模型和质量大幅波动
        - 评测资料量化了高级输出 60-300 credits 的用量
        - 单个成品资产的实际成本取决于迭代、失败和附加项
        - 公开来源未披露扣除合作伙伴模型成本后的净毛利
        - Fluxnote；AppReviewLab
      - - 较早的 2026 年公开快照
        - 较早评测保留了约 $9-$10 的 starter 和约 $29-$30 的 pro 框架
        - 显示 2026 年资料覆盖中的历史定价漂移
        - 未经确认，不适合作为当前实际价格
        - 与后续层级名称和定价阶梯冲突
        - UCStrategies；Apostle
    notes: 官方定价页由客户端渲染，因此本表区分可直接支撑的信息，以及由二级定价追踪器和评测重建的信息。
