      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 2026 年 1 月延展轮降低了短期资本压力风险，但没有消除融资依赖。本章本地财务主张支持其以超过 $1.3B 估值获得 $130M+ Series A 资本；GetLatka
              另列三轮累计融资 $188M。管理层称最新一轮资金将扩大企业销售、国际覆盖、R&D、API 能力和营销自动化；Reuters 辛迪加报道称，员工数可能从约 70 人增至 2026 年底约 300
              人。这些计划意味着未来运营成本基数更高，尤其是当计算需求随日生成量扩张。Forbes 还报道，Higgsfield 到 2026 年 2
              月已重新进入融资洽谈；距离延展轮如此之近，是值得注意的信号。最难承保的缺口是现金可见度：公开资料不披露账上现金、债务、净烧钱或现金跑道。即便广为流传的「前十个月仅烧掉
