      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 的资本化历程反映出早期投资人罕见的强信念。2025 年 9 月，公司完成超额认购的 $50 million Series A，由 GFT Ventures 领投，BroadLight
              Capital、NextEquity Partners、AI Capital Partners（Alpha Intelligence Capital 的美国基金）、Menlo Ventures 和 Alpha
              Square Group 参投。仅四个月后，2026 年 1 月 15 日，Higgsfield 宣布完成 $80 million Series A 延展轮，Accel、AI Capital Partners 和
              Menlo Ventures 参与，使 Series A 总融资超过 $130 million，投后估值超过 $1.3 billion；战略领投人为 Alpha Intelligence Capital 的
              Antoine Blondeau。第三方聚合平台 GetLatka 记录的累计融资约 $188 million，分三轮完成，暗示还有一笔未单独宣布的种子轮或 Pre-Series A。CEO Mashrabov
              于 2026 年 2 月表示，Higgsfield 正在洽谈新一轮融资。CSO de Silva 称，公司在前十个月仅烧掉 $500,000，随后达到 $200 million
              ARR——该数字未获独立审计。Forbes 采访的风险投资人对 Higgsfield
              大幅折扣获客项目背后的单位经济性表示怀疑。二级交易和债务融资未公开披露。完整股权结构表，包括各轮持股比例和创始人任何老股出售，仍属私人信息。
