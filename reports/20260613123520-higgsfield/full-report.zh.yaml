      - 对承销判断的影响
      - 当前公开数据说明什么
      - 具体尽调路径
    rows:
      - - 按收入流拆分的收入结构
        - 无法判断 ARR 中有多少来自入门计划、团队席位、Enterprise 或充值
        - 公开来源证明存在多条变现路径，但不披露占比
        - 按计划、Enterprise 和充值收入索取月度经常性收入桥
      - - 实际价格 / 折扣流失
        - 如果促销使用很重，标价可能高估变现质量
        - 公开证据包含折扣、促销码和互相冲突的定价快照
        - 按计划和队列索取已开票价格实现率，包含促销获客用户
      - - 按模型族拆分的毛利率
        - 不披露服务成本，就无法检验软件式盈利能力
        - 重计算路由可见，但公开来源缺失毛利率
        - 索取自研模型与第三方模型的毛利率和 COGS 拆分
      - - CAC / LTV / 回本周期
        - 无法判断增长是高效，还是靠补贴驱动
        - 未发现公开 CAC、LTV 或回本周期数据
        - 索取分渠道获客成本、回本周期，以及按队列拆分的 LTV
      - - NRR / 流失
        - 无法区分可持续扩张和新增客户总量增长
        - 未发现公开 NRR 或流失指标
        - 按客户分群索取 NRR、客户流失和收入流失
      - - 在手现金 / 现金跑道
        - 仅凭公开数据无法评估融资紧迫性
        - 融资轮次公开，但当前现金和现金跑道不公开
        - 索取月度现金桥、现金跑道模型和董事会现金阈值政策
      - - Enterprise 合同条款
        - 无法建模 ACV 耐久性或实施摩擦
        - 据报道，若干 beta 客户支出 >$200K，但数量和条款均为私有
        - 索取前 20 大合同模板、续约率和达成价值时间数据
      - - 审计或管理层财务报表
        - 限制对 ARR、烧钱、退款和收入确认的验证能力
        - 公开证据主要来自媒体、访谈和评测，而非审计报告
        - 索取董事会材料、审计或审阅报表，以及月度管理账
    notes: 每个缺口都列出需要哪类私有证据，才能把增长叙事推进为可承销的财务模型。
