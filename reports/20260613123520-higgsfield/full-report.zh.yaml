        - 拉响流失红旗；要求队列留存和净收入留存数据
      - - 资本状况 / 烧钱偏离
        - 现金消耗与所称 $500K/10 个月烧钱速度不一致
        - 确认烧钱速度 >$5M/月或现金位置 < 6 个月跑道
