companyProfile:
  summary: >-
    Higgsfield 是一家位于 San Francisco 的私营 AI 视频初创公司，由前 Snap 生成式 AI 负责人 Alex Mashrabov 与 CTO Yerzat Dulat 于 2023 年 10
    月创立。公司从消费者视频概念转向浏览器端营销和创作者生产平台，把多个第三方模型串成一个工作流，覆盖创意构思、分镜、生成、编辑和发布。公开披露支持其到 2026 年 1 月异常快速升至 $1.3B 估值、$200M
    年化收入运行率，但也暴露出仍未解决的重大治理、安全、计费和单位经济性问题。
