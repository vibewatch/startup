      - number: '7.3'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Higgsfield 平台在 24 million 注册用户中每天生成约 4.5 million
              个视频片段，这一吞吐量已经造成有记录的平台不稳定。公司基于浏览器、服务端计算的架构，把所有工作负载集中在云基础设施中，没有披露本地部署或分布式备用方案。高流量事件造成可观察的性能下降和限速，引发用户投诉和
              $1.35M 退款。2025 年 12 月至 2026 年 1 月，bot 攻击迫使公司关闭 40,000
              个账号，说明在消费级规模运营免费层获客引导漏斗会暴露对抗面。内容审核在模型层执行，每个集成模型采用不同过滤逻辑，导致 Higgsfield 12+
              集成模型之间的执行不一致；公司没有披露统一内容过滤器。Higgsfield 未披露 SOC 2、ISO 27001 或任何其他安全认证，抬高了企业信任门槛。截至 2026 年 1 月，公司约有 70
              名员工；相对于一个每天从 12+ 个 AI 模型集成生成 4.5M 条视频的平台，这一人员规模偏低。快速扩员带来的执行风险已经存在：公司一年前员工少于 15 人，文化和流程成熟时间被压缩。
