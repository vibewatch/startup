  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 看多理由
      - 证据
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 超高速增长是真实的，不只是概念叙事
        - 据报道，ARR 从 2025 年 2 月的 $11M 增至 2026 年 1 月的 $200M，并在 2026 年 2 月达到 $300M
        - 运行率速度仍可能掩盖留存弱、补贴式获客或低毛利用量
        - 披露按计划划分的队列留存、扣除退款后的 ARR 桥和付费用户流失
      - - 创始人质量和投资人质量降低执行风险
        - Alex Mashrabov 此前出售 AI Factory，并在 Snap 负责生成式 AI；Accel 和 Menlo 投资了公司
        - 强创始人和强投资人不能抵消平台安全或单位经济失效
        - 提供运营仪表盘，证明执行质量匹配创始人履历
      - - 多产品表面可把变现扩展到单一爆款应用之外
        - 官方页面展示了多个创作表面，包括 Cinema Studio、Canvas、Motion 和企业工作流
        - 更宽的产品表面也会增加审核负担和计算成本复杂度
        - 展示按产品划分的收入结构、按工作流划分的毛利率和企业扩张率
      - - 按 ARR 看，当前估值低于部分私有 AI 视频同行
        - Higgsfield 约为 4.3x-6.5x ARR，而 HeyGen 约为 ~7x，Runway 为十几倍
        - 同行数据稀疏，且并非完全可比；质量折价可能合理
        - 确认 NRR、毛利率和现金效率，以证明可采用高溢价同行框架
      - - 病毒式触达可能支撑长期平台经济
        - 2026 年 1 月 15M 用户，2026 年 6 月超过 24M+，显示漏斗深度大
        - 如果计费投诉和退款损害信任或转化质量，漏斗规模价值会打折
        - 展示 2026 年 2 月事件之后的转化、复用和投诉率改善
    notes: 每一行都把一个真实上行向量与主要承销反对意见配对；后者仍阻止给出更强建议。
