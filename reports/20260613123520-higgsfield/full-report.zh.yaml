      - number: '5.2'
        title: 架构、集成与依赖
        blocks:
          - type: paragraph
            body: >-
              平台架构看起来是路由式应用栈，而不是垂直整合模型公司。官方页面和技术文档显示，其应用层面向创作者产品，编排层由 Hermes Agent、Soul ID 训练、Lipsync 和分镜工具组成，模型层可调用
              Sora 2、Kling、Veo 3.1、Seedance 以及其他图像模型等高级外部引擎。MCP 表面把该架构向外延伸：外部智能体可通过 Model Context Protocol
              调用生成工作流，而不是经典自研 SDK。这在战略上有用，因为 Higgsfield 既可作为终端用户产品，也可作为更广 AI 工作流中的智能体可访问工具。


              同一设计也让依赖风险无法忽视。上游模型供应商提升质量时，Higgsfield 会受益；但它也继承提供商定价、可用性和政策变化。Forbes 与 Higgsfield 自有 Team Plan
              材料显示，公司尤其深度依赖 OpenAI 的 Sora API；分析式报道也指向服务器端 NVIDIA 支持的算力。Stripe 位于支付路径，模型级审核位于安全路径。从架构看，Higgsfield
              是一家建立在第三方模型访问与自有创意控制之上的工作流和编排公司。这是可信的软件位置，但防御性弱于拥有基础模型，或公开延迟、正常运行时间和故障恢复等硬可靠性遥测。
