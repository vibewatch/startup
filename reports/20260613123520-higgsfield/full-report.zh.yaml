      - number: '7.4'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >
              Higgsfield CSO 在 2026 年 2 月称，公司在达到 $200M ARR 前的十个月里只烧了 $500,000——这是一个异常说法，未经核验，也与每天 4.5M
              条视频生成规模下的典型云基础设施成本不一致。即便保守假设每条视频需要 30 秒 A100 等效计算，仅按需云价格计算，日常算力成本就接近每月 $3M。Forbes 引述的匿名 VC
              也怀疑该业务的「economic flywheel of the business makes sense」，指出公司依赖大额折扣促销（$3M 免费促销码、无限套餐 Black Friday 65%
              折扣），同时对使用这些优惠的用户限速。Higgsfield Earn 影响者计划虽然向创作者分发了 $1M+，也吸引了大量欺诈，需要主动反制。定价从 $9/月（Starter）到
              $149/月（Agency）不等；基于 credits 的消费让毛利率存在不确定性，因为 Sora 2 等高端模型的单次生成成本很高。在 300,000 付费用户和 $200M ARR 下，混合 ARPU 约为
              $667/年（$55/月），与 Pro 或 Agency 档位一致，但对留存下行压力或组合向 Starter 档迁移非常敏感。据报道，截至 2026 年 2 月，公司正在洽谈追加融资，说明除 $130M
              Series A 总额外仍有资本需求；规模化后的隐含烧钱速度可能明显高于 CSO 所称数字。
