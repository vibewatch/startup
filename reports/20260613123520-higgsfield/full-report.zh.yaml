  - id: FR001
    title: 风险热力图——可能性 vs. 严重性
    type: matrix
    layout: standard
    summary: |
      截至 2026 年 6 月，本图按可能性（行）和严重性（列）映射 Higgsfield 的关键风险，突出内容安全和声誉类别中高可能性、高严重性风险的集中分布。
    data:
      columns:
