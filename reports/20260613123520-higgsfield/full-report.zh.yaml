      - number: '1.4'
        title: 规模、里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 的商业速度异常：产品从 2025 年 4 月发布到 2026 年 1 月，不到九个月 ARR 从 $0 增至 $200 million；公司将这条曲线对标
              Lovable、Cursor、OpenAI、Slack 和 Zoom。到 2026 年 2 月初，ARR 已达 $300 million，CEO Mashrabov 的目标是 2026 年底达到 $1
              billion。注册用户从 2025 年 9 月的 11 million 增至 2026 年 1 月的 15 million，再到 2026 年 6 月超过 25 million；日视频生成量从 2026 年 1
              月的 4.5 million 次增至 2026 年 6 月约 6 million 次。平台累计生成内容超过 850 million 件。到 2026 年 2 月初，付费订阅用户约
              300,000。然而，快速扩张带来了重大负面事件。Forbes 2026 年 2 月调查记录了三类失败：（1）Higgsfield 营销团队在 Vibe Motion 发布时分发媒体包，其中把 Envato
              的库存视频片段虚假呈现为 AI 生成；另向创作者分发包含热门动画角色明显种族主义描绘和公众人物非自愿 deepfake 的视频；（2）Higgsfield 的 X
              账号因「非真实行为」在推广后被封禁；（3）多名「无限」订阅计划用户遭遇严重性能限速，引发 $1.35 million 退款。CSO de Silva 公开承认三项失败，称流程「并不总能跟上核心价值观」。随后
              Higgsfield 对所有外部营销材料实行强制法务和高级管理层审核。Higgsfield Earn 创作者变现项目也出现付款延迟，影响多名创作者；公司将原因归于欺诈活动检测挑战。
