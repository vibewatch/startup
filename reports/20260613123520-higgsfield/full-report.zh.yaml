  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户任务
        blocks:
          - type: paragraph
            body: >-
              对一家年轻 AI 视频公司而言，Higgsfield 的产品表面很宽，因为它把多个创意任务打包进一个 web 工作区，而不是销售单一生成端点。产品集覆盖通过 Cinema Studio 2.0
              的旗舰视频生成、通过 Marketing Studio 和 Hermes Agent 的营销自动化、通过 AI Influencer Studio 和 Soul ID 的持久角色创建、通过 Lipsync
              Studio 的多语言后期制作、通过 Popcorn 的分镜规划，以及通过 Nano Banana Pro 和相关图像模型的静态图像生成。放到客户工作流里，这意味着营销人员可以在同一界面内从 brief
              走到资产生成、本地化，再到变体生产。这种宽度是最清晰的产品优势，因为购买短视频广告创作工具的买方，重视减少工具切换不亚于重视任何单一基础模型。


              工作流主张也足够具体，足以影响尽调。Marketing Studio 承诺 URL-to-video 自动化和九种预设创意格式，UGC Builder 聚焦口播表演，AI Marketing Video
              Maker 延伸到配音和翻译。Popcorn 把脚本或提示词转成八到十分镜场景，Soul ID 加 Recast 处理持久屏幕身份。因此，它看起来不是一个通用文生视频
              app，而是为需要快速生成大量变体的创作者、社交团队和品牌优化的营销活动生产栈。开放尽调问题是：这种宽度能否在生产规模下转化为持续可靠的输出，还是主要增加消耗点数的迭代循环数量。
