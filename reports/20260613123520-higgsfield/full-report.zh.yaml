      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动来自结构性需求：TikTok、Instagram Reels 和 YouTube Shorts 的社交媒体算法动态，要求品牌持续产出高频、品牌一致的短视频内容。AI 模型质量提升正在快速扩大 AI
              生成视频可覆盖的用例；2026 年，Google Veo 3.1 的原生音频合成和 Kling 3.0 的照片级真人动作把质量下限继续抬高。Higgsfield 企业页面称生产速度快 10x、每个资产节省
              $12,000——如果这些数字在规模化后仍成立，将构成有说服力的企业采用
              ROI。多模型聚合架构相比任何单一基础模型降低了切换成本，因为客户用一个订阅即可访问所有模型。与这些驱动相对，三项约束突出。第一，点数经济性：Veo 3、Sora 等高级 AI 模型每次生成消耗 40-70
              点，中档计划几个片段就会耗尽，给高量生产团队制造摩擦。第二，内容安全与品牌风险：Higgsfield 2026 年 2 月种族主义内容事件和 X 账号封禁，是企业采购红旗；Trustpilot 3.7/5
              的混合评分反映用户体验问题仍在持续。第三，OpenAI Sora 于 2026 年 4 月 26 日停止 web 和 app 体验——Higgsfield 曾是该平台最大客户——短期内构成重大模型来源风险，即便
              Sora API 仍可用至 2026 年 9 月，且 Higgsfield 已将流量导向 Kling 3.0、Veo 3.1、Minimax Hailuo 和 Seedance。EU AI Act 以及美国关于
              AI 内容标识的行政行动带来的监管不确定性，可能在中期增加合规负担和企业采购摩擦。
