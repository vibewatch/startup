chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Higgsfield Inc. 总部位于 California 州 San Francisco，将核心产品描述为 AI
              原生生成式视频平台和「视频推理引擎」，为品牌、代理商和社交媒体营销团队自动化商业视频制作。公司成立于 2023 年 10 月，2025 年 4 月推出基于浏览器的商业化产品；截至 2026 年 6
              月，注册用户超过 25 million，每日视频生成量约 6 million 次。Higgsfield 没有训练单一自研基础模型，而是把十二个以上第三方 AI 视频和图像模型聚合到统一的端到端制作界面，包括
              OpenAI Sora 2、Google Veo 3.1 和 Nano Banana、Alibaba WAN、Kuaishou Kling 3.0，以及 Bytedance Seedream 和
              Seedance；用户在一个浏览器会话里完成创意构思、分镜、动画、编辑和发布。差异化功能包括 Cinema Studio 2.0（2026 年 2 月发布；70+ 个镜头运动预设）、Soul
              ID（跨场景保持角色一致性）、用于真实风格广告内容的 UGC Builder，以及 Marketing Studio，后者通过「URL-to-Ad」自动化流水线把产品 URL 转成可投放的视频变体。截至 2026
              年 6 月，收入来自分层订阅：Starter 为 $15/month（200 点数），Plus 为 $34/month（1,000 点数），Ultra 为 $84/month（3,000
              点数），企业或团队计划采用议价；点数 90 天后过期。公司称其对齐 SOC2 和 ISO 42001、符合 GDPR，并服务超过 100,000 个商业团队。最初的消费者移动 App
              概念（ChatGPT-for-video 产品）因消费者不愿付费而被放弃；转向专业创作者和营销人员成为关键转折。
