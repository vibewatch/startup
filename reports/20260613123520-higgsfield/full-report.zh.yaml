  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Higgsfield 先把用户从社交发现带到自助式创作者使用场景，再把其中更窄的一段推进团队和企业工作流。
    data:
      items:
        - label: 发现
          detail: 用户接触 Higgsfield，主要来自网红内容、X / 社交分发、媒体报道，以及电影感 AI 视频带起的产品口碑。
          claimRefs:
            - CU001
            - CU021
        - label: 免费试用
          detail: 免费点数和低门槛注册拉动初次探索；创作者先测试模型质量和工作流适配度，再决定是否付费。
          claimRefs:
            - CU001
            - CU028
        - label: 首次付费订阅
          detail: 转化从 Starter 等低客单价套餐开始（$15 / 月），之后靠高级套餐、点数加购和企业席位扩张。
          claimRefs:
            - CU027
            - CU028
        - label: 活跃创作者
          detail: 高频用户大量生成内容，参与社区 / Discord 支持闭环，也可能使用 Earn 计划或 Soul ID 工作流。
          claimRefs:
            - CU005
            - CU011
            - CU031
        - label: 团队或商业升级
          detail: 营销团队和代理机构采用协作工作区、商业定价和营销工作室自动化，用于产出营销活动。
          claimRefs:
            - CU002
            - CU022
            - CU038
        - label: 企业
          detail: 大型组织更多通过定制演示销售、信任标识和专属支持承诺进入，而不是纯自助转化。
          claimRefs:
            - CU023
            - CU029
        - label: 流失风险
          detail: 点数耗尽、限流投诉、折扣到期、退款纠纷和创作者计划失败，都会在长期留存被证明前形成流失出口。
          claimRefs:
            - CU014
            - CU015
            - CU016
            - CU017
    claimRefs:
