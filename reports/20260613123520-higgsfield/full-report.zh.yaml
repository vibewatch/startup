  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 公开客户路径从庞大的社交触达和注册量，收窄到规模小得多、但价值更高的付费、团队和企业用户。
    data:
      nodes:
        - label: 认知
          detail: 平台内容据称或估计带来 3B+ 次社交曝光，在创作者和营销人群中形成很大的漏斗顶部发现量。
          claimRefs:
            - CU005
        - label: 注册用户
          detail: Higgsfield 称截至 2026 年 6 月拥有 24M+ 名创作者，已生成 300M+ 条视频。
          claimRefs:
            - CU001
        - label: 付费订阅者
          detail: Forbes 报道，截至 2026 年 2 月付费用户约 300,000，说明转化已有实质规模，但未披露流失。
          claimRefs:
            - CU003
            - CU026
        - label: 团队和商业用户
          detail: 公司称 100,000+ 个团队使用该平台，但没有披露其中多少是活跃商业账户，多少只是轻量协作使用。
          claimRefs:
            - CU002
        - label: 生产级营销使用
          detail: 商业使用看起来已有实质规模，因为分析师报道称 85% 的用户是专业营销人员，80% 的内容用于商业。
          claimRefs:
