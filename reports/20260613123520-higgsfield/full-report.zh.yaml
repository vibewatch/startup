      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Runway 是最清晰的直接创意竞争者，因为它把自研前沿模型与自有编辑和工作流栈结合起来。它与 Higgsfield 正面争夺想要高保真电影感生成的创作者，但命题本质不同：Runway
              要客户采用其模型生态，Higgsfield 则提供跨多个引擎的路由层。Synthesia 是另一个买方细分中的强竞争者。其公开材料聚焦商业视频、本地化、合规和协作，因此对
              L&D、沟通或销售赋能团队更有吸引力，而不是面向时尚前沿短视频广告。Pika 和 Kling 更靠近实验边缘：Pika 偏向创作者工具和 app 原生特效，Kling 则营销纯模型能力和 API 访问。


              替代和相邻集合同样重要，因为 AI 视频预算仍在流动。OpenAI 的 Sora 在独立产品关闭后不再是稳定的直接目的地，但作为 Higgsfield 等平台内部的上游模型基准，仍然重要。Adobe
              Premiere 和 DaVinci Resolve 仍具可信度，因为许多团队已经熟悉这些界面，并可在其他地方叠加生成能力。HeyGen 之所以相关，是因为独立市场报道仍将其列为竞争者；但保留下来的 2026
              年证据包对其当前包装的材料远少于 Synthesia 或 Runway，这本身也是一个有用的尽调信号：哪些供应商更容易用公开证据承保。
