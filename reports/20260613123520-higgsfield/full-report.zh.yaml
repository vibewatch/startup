      - number: '6.3'
        title: 留存、满意度与重复使用
        blocks:
          - type: paragraph
            body: >
              Higgsfield 最大的客户尽调缺口不是采用，而是耐久性。公开来源足以说明平台变现速度惊人：Forbes 报道，截至 2026 年 2 月大约有 300,000 名付费用户；与公司相关的报道则显示，ARR 到
              2026 年 1 月从 $100 million 跳到 $200 million，并在 2 月初达到 $300 million-plus 运行率。这些数字意味着不错的变现能力；按 $200 million ARR
              / 300,000 付费用户组合估算，年 ARPU 约为 $667。但保留的公开来源都没有披露
              NRR、GRR、流失率、队列留存、按套餐划分的取消率，或按收入计算的客户集中度。也就是说，市场能看到收入线快速转化，却看不到这些客户是否留下来。


              反向证据确实指向标题增长故事下方的真实留存风险。Trustpilot 评分约为 3.8/5，反复出现的投诉包括名义上无限套餐被限速、暗黑模式计费，以及自动迁移到按需收费。Forbes
              还报道，打折无限套餐吸引了大量用户，但他们后来发现，如果不额外购买 credits，服务在功能上几乎不可用；公司向受降速影响的用户退款 $1.35 million，部分原因是 bot 攻击。据报道，credits
              90 天后过期且不能滚存，这很可能伤害偶尔使用但潜在价值不低的用户。正确解读不是断言留存一定差，而是：重复使用最强的公开指标都是间接的；用户情绪最强的直接公开指标则偏负面。
