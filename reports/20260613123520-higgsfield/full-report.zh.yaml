      - number: '7.2'
        title: 声誉与内容安全风险
        blocks:
          - type: paragraph
            body: >
              2026 年 2 月，Forbes 报道 Higgsfield 内部营销团队和外部第三方创作者分发了 Google Drive 文件夹，其中包含以儿童角色（Shrek、Moana、Mickey
              Mouse）为主角的种族主义视频、公共人物（Sydney Sweeney、Zendaya、President Trump）的非自愿 deepfake 片段，以及被虚假包装成 AI
              生成输出的库存视频模板。Higgsfield CSO Mahi de Silva 确认了这些事件，承认内部和外部创作者都制作了相关素材，并称其「absolutely not representative of
              our values」。公司 X/Twitter 账号随后因「inauthentic behavior」被暂停，主要病毒式营销渠道消失。Higgsfield
              事后宣布流程改进——所有外部材料必须经过强制法律审查和高层签字——但执行可靠性仍未核验。另据 Forbes 记录，Higgsfield 广告曾炫称它「ended 20 creative
              jobs」，疏远了公司正试图服务的创作者社区。Trustpilot 评价（3.7-3.8/5）描述了欺骗性计费、被限速的「unlimited」套餐和自动按需收费。截至 2026 年 2 月，公司已向受影响用户退款
              $1.35 million。这些事件合在一起更像一个模式，而不是单次失误，从而抬高了复发概率，也加重了企业销售中的品牌损害。
