  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险图景
        blocks:
          - type: paragraph
            body: >
              Higgsfield 处在生成式 AI、合成媒体和用户生成内容的交汇点；这个监管三岔口正在所有主要司法辖区快速成形。EU AI Act 针对有害 AI 操纵和生物识别分类的禁令已于 2025 年 2 月生效，其
              General Purpose AI（GPAI）透明度和安全义务现在覆盖大型模型集成方，而不只是模型开发者。Higgsfield 至少把 12 个第三方 AI
              模型集成进单一平台；它作为合成媒体输出的高量分发方，可能在欧洲触发 GPAI 合规义务。EU AI Act 下要求披露 AI 生成内容的 deepfake
              标注要求，已经影响平台和用户义务。在美国，Copyright Office 发布 Federal Register 指引（37 CFR Part 202，2023 年 3 月），明确缺乏足够人类作者贡献的 AI
              生成内容不受版权保护——这对依赖 Higgsfield 输出做商业活动的企业客户是实质风险。至少十二个美国州已经通过非自愿 deepfake 立法；联邦提案仍在推进。Higgsfield 的 Privacy
              Policy（2025 年 8 月生效）承认 GDPR 适用和国际数据传输，但没有确认用于流向美国处理的 Standard Contractual Clauses 或充分保障已经到位。Terms of Use
              包含强制绑定仲裁和集体诉讼豁免，限制了公司的集体诉讼暴露，但在某些欧盟司法辖区可能违反消费者保护规范。deepfake 责任、版权归属不确定性和 GDPR 合规缺口叠加，使监管风险既重大又当前，并非假设。
