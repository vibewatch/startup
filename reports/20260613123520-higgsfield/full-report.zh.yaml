      - number: '8.3'
        title: 可比公司与 ARR 倍数基准
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 最直接的可比对象，是其他风投支持的 AI 视频公司，而不是宽泛的软件或广告科技企业。按现有公开证据，Runway 2024 年 8
              月融资在更低披露收入基数上给出了明显更高的定价；HeyGen 2024 年 3 月估值则更接近 Higgsfield 当前 ARR 框架。Synthesia
              在战略上相关，但难以作为严格倍数可比，因为它的公开定位是企业视频，而不是消费者加营销创作者漏斗，当前 ARR 披露也有限。Adobe
              只能作为成熟软件的天花板式基准，不是真正同行。因此，这组可比公司有助于估值纪律，但天然不完整：私营 AI 视频公司披露的收入细节太少，不足以支撑完整市场地图。
