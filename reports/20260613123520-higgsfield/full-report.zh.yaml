  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 身处拥挤但分层的 AI 视频市场。最接近的直接同行是 Runway、Pika、Kling 等创意优先的 AI 视频平台，它们围绕原始生成质量、镜头控制或高级模型访问竞争。第二类包括
              Synthesia、HeyGen 等商业视频专家，它们优化的是培训、本地化和沟通，而不是电影感广告创作。第三类是替代方案：买方仍可在一个工具里生成片段，再用 Adobe Premiere 或 DaVinci
              Resolve 收尾，或继续使用手工制作栈加自由职业者。因此，相关比较集比单纯文生视频供应商更宽。


              Higgsfield 最强的市场信号，是它不要求买方押注单一引擎。官方页面和评论都描述了一套路由工作流：可调用 Sora、Kling、Veo、Wan、Seedance 等外部模型，同时在其上叠加 Cinema
              Studio、Soul ID 等 Higgsfield
              自有控制。这让平台对重视灵活性的社交营销人员和创作者有吸引力，但也意味着其护城河更多取决于工作流聚合，而不是独占模型所有权。本章结论是：当买方需要在一个界面里完成电影感、短视频、多模型制作时，Higgsfield
              最强；当企业治理、既有剪辑软件或上游模型所有者能够主导工作流时，它更弱。
