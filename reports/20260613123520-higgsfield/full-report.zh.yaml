      - number: '6.2'
        title: 具名证明与生产深度
        blocks:
          - type: paragraph
            body: >
              Higgsfield 的具名客户证据真实存在，但覆盖面很窄。保留材料里最干净、可核验的生产案例，是 Vertex CGI 创意总监 Nikita Vantorin 在 Qatar Airways 活动中使用
              Higgsfield；Forbes 称该活动在 Instagram 获得 69 million
              次观看。这个案例有意义，因为它证明了一个具名的代理机构从业者在真实活动中使用产品，并拿到了可衡量的受众结果。第二个有用证据来自 AppReviewLab 的从业者评测：一个未具名护肤品牌用 Soul ID
              在四小时内生成 15 条代言人形象一致的视频变体，而不是花一整天拍摄。这个案例说明产品能解决商业制作问题，但证据权重更低，因为品牌未具名，业务结果也没有披露。


              更大的头部客户名称，比营销叙事暗示的要弱得多。联合创始人告诉 Forbes 撰稿人 Charlie Fink，为 Nike、Coca-Cola、McDonald's 等品牌服务的代理机构在使用该软件；但
              Forbes 2 月那篇更偏调查的文章也报道，上述品牌都没有确认使用。因此这些 logo 处在一个未核验的中间状态：如果属实，商业价值重要，也说得通，但还不能算可作标杆引用的证据。反向证据同样重要。Forbes
              报道，电影制作人 Tim Soret 在发现一段库存素材被包装成 AI 生成内容后，拒绝了 Vibe Motion 发布合作提案。该事件没有抹掉平台的商业效用，但说明客户信任和营销可信度仍然脆弱。因此，投资人应把
              Higgsfield 的客户证据拆开看：使用规模强，从业者案例中等，独立确认的头部 logo 证据偏薄。
