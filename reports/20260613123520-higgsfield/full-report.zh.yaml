  - id: TM004
    title: 增长驱动因素与制约因素表
    columns:
      - 驱动因素或制约因素
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 社交媒体内容需求加速
        - 驱动因素
        - 持续
        - 扩大可触达用户；更高频创作推高 ARPU
        - 验证平台算法是否继续奖励 AI 生成内容，还是开始标记这类内容
      - - AI 模型质量提升（Kling 3.0、Veo 3.1、原生音频）
        - 驱动因素
        - 近期（2026）
        - 支撑更高质量用例；打开企业级广播质量内容场景
        - 监测其质量是否达到传统制作水准，从而触发企业采购
      - - 相比传统视频制作的 ROI 优势
        - 驱动因素
        - 当前
        - 10 倍速度和显著成本下降，为预算负责人提供有说服力的采用理由
        - 通过客户访谈核验单个素材成本主张；检查对机构利润率的影响
      - - 免费层转付费层的切换成本低
        - 驱动因素
        - 当前
        - 浏览器使用、无需安装、订阅模式降低门槛；试用到转化路径顺畅
        - 监测各定价层的试用转化率和回本周期
      - - 高端模型的 credit 经济摩擦
        - 制约因素
        - 近期
        - Veo 3.1 / Sora 2 消耗大量 credit，耗尽中档套餐；限制重度用户 ARPU
        - 跟踪 Starter / Plus 升级到 Ultra 的比例；按套餐衡量 credit 到生成的经济性
      - - 内容安全和品牌风险事件
        - 制约因素
        - 持续
        - 种族主义内容事件和 X 封禁，是企业采购的红旗
        - 评估内容审核成熟度、企业 SLA 承诺和品牌安全控制
      - - OpenAI Sora 网页版停用（2026 年 4 月）
        - 制约因素
        - 中期（至 2026 年 9 月 API 关停）
        - 失去关键差异化模型；Higgsfield 曾是 Sora 最大客户
        - 核验模型路由覆盖面；评估 Kling / Veo 是否填补 Sora 质量缺口
      - - AI 内容标注的监管不确定性
        - 制约因素
        - 中期
        - EU AI Act 和美国 AI 政策可能要求内容披露；增加企业合规成本
        - 监测 EU AI Act 对生成式内容的执法时间表；评估 GDPR 数据义务
    notes: 驱动因素和制约因素评估由作者基于来源证据和定性推断得出。时间分类：当前=已经生效，近期=6–12 个月内，中期=12–24 个月。Sora 停用日期（2026 年 4 月 26 日）来自 OpenAI 帮助中心。
