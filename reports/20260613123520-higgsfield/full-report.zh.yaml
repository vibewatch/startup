    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 公开的变现栈更容易被理解为分层点数业务，而不是简单固定费 SaaS
              订阅。官方企业和团队材料显示，公司在自助创作者漏斗之上销售共享工作区、审批、角色控制、安全承诺，以及由演示驱动的企业扩张。第三方定价追踪器和评论一致描述了一个免费增值阶梯：付费消费者计划、团队或商业席位结构，以及定制企业层；但它们对精确价格点意见不一，因为实时定价页面由客户端渲染，几乎不暴露机器可读细节。这在财务上很重要：标价存在，但点数、年度折扣、促销码、高级模型使用和企业定制条款都会共同塑造客户实际支付额，使实现价格发生显著变化。因此，公开证据支持一个宽泛结论：收入来自订阅、共享席位计划、企业合同，以及可能的用量加购；但精确组合、实际折扣和收入确认政策仍未验证。
