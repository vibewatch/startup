  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 处在三个相邻支出类别的交叉点：AI 视频生成工具、数字营销内容制作，以及营销自动化平台。其核心可服务支出，是团队使用 AI 原生工作流制作社交媒体、广告和企业营销视频所产生的专业订阅与
              API 收入。不包括传统专业视频制作服务（设备租赁、摄制组、后期公司）、影视长片制作，以及没有视频输出的通用文生图工具。Higgsfield 正在开始捕获的相邻支出包括 AI 虚拟形象和网红生成（AI
              Influencer 产品）、营销自动化（Marketing Studio 与 URL-to-Ad 流水线），以及面向开发者的 API 工作流（Higgsfield Skills API）。主要现状替代方案是使用
              Adobe Premiere Pro、Blackmagic Design DaVinci Resolve 等工具进行传统视频制作；Higgsfield 称其能以 10x 速度优势替代这些工具，并为每个内容资产节省
              $12,000，但这些说法来自公司披露，未获独立验证。第二类替代方案是正在出现的单模型 AI 视频生成器——Runway ML、Pika、Kling AI；Higgsfield
              以多模型聚合架构和完整生产工作流区别于这些仅生成能力的平台。市场边界很重要，因为把全部视频创作支出（$200B+）纳入的 TAM 估算，无法由 Higgsfield 当前订阅产品直接服务；公司实际覆盖的是更窄的
              AI 原生营销和社交内容制作细分市场。
