  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >
              Higgsfield
              至少服务两个不同需求面，不应把它们合并成一个客户桶。最宽的需求面是极大的自助创作者基础，用户通过社交热度、免费点数和低摩擦月度计划注册。更高价值的需求面是商业：营销团队、代理商、电商运营者和企业创意团队不那么关心新奇，更关心吞吐量、一致性和营销活动
              ROI。公开证据持续指向这种商业倾斜。Higgsfield 自有企业和营销页面围绕商业工作流来定位产品，外部分析则称平台 85% 用户是专业营销人员，约 80%
              创作内容用于商业而非个人。这很重要，因为营销驱动的用户组合通常比纯消费者创作者受众更有预算、更可重复。


              细分仍需谨慎。买方、用户和付款方并不总是同一个人。个人创作者可能发现产品后自助购买 Starter 或 Plus
              计划；代理商创意总监或效果营销负责人可能是小团队买方；更大的企业可能只会通过演示驱动流程进入。公司称截至 2026 年 6 月，拥有 24 million+ 创作者、300 million+ 个视频生成和
              100,000+ 个平台团队，合在一起意味着巨大的漏斗顶部规模。但这些数字没有披露活跃用户数、付费团队数、企业客户数，或每个队列贡献的 ARR
              占比。最强的工作结论是：创作者驱动认知和使用量，而代理商和营销团队可能驱动最佳变现质量。
