  - - Higgsfield
    - Multi-model AI video platform
    - $130M Series A; $1.3B valuation; 15M+ users; 4.5M videos/day
    - Social marketers, creators, agencies, enterprise teams
    - Routes 50+ models with Cinema Studio and Soul ID
    - Depends on upstream model access and faces trust overhang from adverse coverage
  - - Runway
    - Direct creative peer
    - Raised $237M+ historically; proprietary Gen-4.5 stack; clear self-serve pricing
    - Creators, filmmakers, design teams, prosumers
    - Owns first-party model roadmap plus editing/workflow suite
    - Less flexible than a router if buyers want best-of-breed outside models
  - - Synthesia
    - Business-video specialist
    - 50,000+ teams cited on pricing page; public trust/compliance stack
    - L&D, sales, HR, marketing, communications teams
    - Enterprise governance, avatars, localization, collaboration
    - Less oriented to cinematic ad creative or experimental camera language
  - - Pika
    - Creative consumer challenger
    - Current pack shows active Pika 2.5 surface but no clear public pricing
    - Creators and trend-native social users
    - Pika Universe, agents, MCP, mobile-friendly effects
    - Weaker public evidence on enterprise packaging and governance
  - - Kling AI
    - Model-native challenger
    - KlingAI 3.0 with Omni, Native Audio, API platform
    - Creators, developers, enterprise API buyers
    - Strong raw model positioning and multimodal capability
