- id: TP004
  title: Moat durability/competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Multi-model routing in one workspace
    - Upstream vendors can improve their own distribution or change API economics
    - High
    - Track model-mix dependency and gross-margin sensitivity by supplier
  - - Cinema Studio and creator-native controls
    - Runway or incumbents can ship similar controls into owned stacks
    - Medium
    - Monitor whether creative output quality remains differentiated in buyer tests
  - - Soul ID and recurring character workflows
    - Character lock-in helps only if usage remains repeatable and reliable
    - Medium
    - Ask for retention by Soul ID-trained accounts versus generic users
  - - Marketing automation and connectors
    - Large customers may still prefer incumbents or internal build for final workflow orchestration
    - Medium
    - Request proof of durable automation adoption beyond one-off campaigns
  - - Rapid adoption and social reach
    - Trust issues can block enterprise expansion even when creator growth is strong
    - High
    - Verify complaint rates, refund trends, and policy-enforcement metrics
  - - Router neutrality
    - Low switching cost lets customers multi-home across tools and pressure pricing
    - High
    - Check net retention and win-loss reasons against Runway, Synthesia, and incumbent editors
  notes: Severity reflects competitive durability, not legal materiality; the final column identifies the next diligence proof needed to validate or refute each moat claim.
