    - Kling 3.0, Omni, Native Audio, API platform
    - Current self-serve price not retained
    - Strong model promise, but buying cost clarity is weaker
  - - OpenAI / Sora direct
    - Discontinued
    - Standalone consumer surface sunset; API sunset pending
    - Legacy Sora output only until shutdown windows close
    - No stable new-user direct offer remains
    - Buyers wanting Sora-class output increasingly need routed alternatives
