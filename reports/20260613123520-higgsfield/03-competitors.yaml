    - Benchmark model quality and brand pull
    - No durable standalone self-serve destination after discontinuation
  - - Adobe Premiere + DaVinci Resolve
    - Incumbent substitute
    - Entrenched editing installs and familiar pro workflows
    - Editors, agencies, production teams, in-house studios
    - Downstream finishing, post-production, and incumbent muscle memory
    - Not AI-native multi-model generation hubs
  - - HeyGen
    - Adjacent business-video specialist
    - Named competitor in independent market coverage, but retained 2026 detail is thin
    - Business video, avatar-led communications, marketing teams
    - Competes on ease and ROI rather than cinematic control
    - Current retained pack is incomplete on fresh pricing, funding, and product depth
