  rows:
  - - Higgsfield (June 2026 review snapshot)
    - Starter $15 / 200 credits; Plus $34 / 1,000; Ultra $84 / 3,000; Business $49/seat
    - Credit-based monthly tiers with team plan
    - Premium external models, Cinema Studio, marketing workflows
    - Credits expire after 90 days; realized enterprise discounts unknown
    - Flexible but usage-sensitive economics can spike on premium models
  - - Higgsfield (older 2026 review snapshot)
    - Free $0; Starter $9; Pro $29; Agency $149
    - Older credit-based tier naming
    - Access tiers reportedly unlock premium engines and priority
    - Historic snapshot conflicts with newer review pricing
    - Packaging volatility raises diligence on current offer terms
  - - Runway
    - Free; Standard $12/mo annual; Pro $28/mo annual; Unlimited $76/mo annual
    - Credit tiers plus unlimited plan
    - Gen-4.5, editing, workflows, storage, custom voices on higher tiers
    - Monthly list pricing and enterprise discounting not fully retained here
    - Cleaner procurement than most peers, but bound to one vendor stack
  - - Synthesia
    - Starts at $18/mo
    - Seat/subscription plan with enterprise upsell
    - Avatars, dubbing, collaboration, analytics, compliance posture
    - Higher-tier enterprise economics and discounting are not public
    - Best suited to predictable business-video budgets
  - - Pika
    - Unknown
    - No clear current public self-serve pricing retained
    - Pika 2.5, agents, MCP, creative effects
    - Current public pricing absent in retained pack
    - Evaluation friction is higher despite strong creator appeal
  - - Kling AI
    - Unknown
