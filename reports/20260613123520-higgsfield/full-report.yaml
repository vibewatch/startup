      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Available Lenses'
        blocks:
          - type: paragraph
            body: >-
              Multiple market sizing estimates for AI video creation exist, but they use inconsistent boundaries that
              make direct comparison unreliable. The broadest available estimate — attributed to ainvest citing market
              research compilation — pegs the global AI video market at $600 billion, almost certainly encompassing
              hardware, infrastructure, and services far beyond Higgsfield's subscription product. Menlo Ventures
              investor Amy Wu cited a $200 billion annual US video creation market in her endorsement of Higgsfield's
              September 2025 Series A, a figure that includes traditional production and is not specific to AI-native
              tools. GFT Ventures' Jeff Herbst has argued qualitatively that social media marketer demand for AI video
              "could eclipse Hollywood," implying an addressable market larger than the estimated $100 billion global
              film and TV production industry. None of these figures isolate the AI-native marketing video SaaS
              sub-market. Deriving from Higgsfield's own disclosed metrics, a rough SAM estimate is possible: if
              Higgsfield holds somewhere between 3% and 15% market share at its February 2026 ARR of $300 million,
              implied SAM falls between $2 billion and $10 billion — a wide range driven entirely by the unknown
              denominator. Higgsfield's ARR Club-tracked 870% annualized CAGR from its own growth trajectory cannot be
              extrapolated to market-wide growth rates. No independent analyst report isolating the AI-native marketing
              video SaaS sub-market has been identified; this is the single most material evidence gap for market sizing
              diligence.
            claimRefs:
