      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No Rigorous Sub-Market SAM Estimate Exists — This Is the Key Sizing Gap
            body: >-
              Despite the AI video market generating significant investor attention and multiple headline TAM figures
              ($200B-$600B), no independent analyst has published a rigorous bottom-up estimate for the AI-native
              marketing video SaaS sub-market that Higgsfield actually addresses. All available estimates use boundaries
              too broad to price the real serviceable opportunity. The derived SAM of $2B-$10B is the author's
              calculation and should be treated as a sensitivity range, not a market fact, until an independent analyst
              validates it.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM036
          - type: callout
            title: Sora Web Discontinuation Removes a Key Model Differentiator
            body: >-
              OpenAI discontinued the Sora web and app experience on April 26, 2026 — removing Higgsfield's ability to
              cite Sora as a live consumer-facing integration that it was the largest customer of. While the Sora API
              remains available until September 2026, this sunset reduces Higgsfield's model differentiation relative to
              competitors and raises a precedent question: what happens when other key model integrations (Veo, Kling)
              pivot access terms or are internalized by their parent companies?
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM039
              - CM040
          - type: callout
            title: Multi-Model Aggregator Architecture Reduces Dependency on Any Single Model Provider
            body: >-
              Higgsfield's strategic choice to aggregate twelve-plus models rather than build a single proprietary
              foundation model provides architectural resilience against model provider concentration risk — the Sora
              discontinuation affected the company but did not halt operations because Kling 3.0, Veo 3.1, Minimax
              Hailuo, and Seedance provide functional alternatives. This architecture also creates a structural
              competitive advantage over single-model platforms like Runway, which must rebuild integrations when they
              add new models, while Higgsfield's workflow layer is already model-agnostic.
            calloutType: strength
            claimRefs:
              - CM028
              - CM031
              - CM039
              - CM040
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Higgsfield sits in a crowded but segmented AI video market. Its closest direct peers are creative-first AI
              video platforms such as Runway, Pika, and Kling, which compete on raw generation quality, camera control,
              or access to premium models. A second cluster includes business-video specialists such as Synthesia and
              HeyGen, which optimize for training, localization, and communications rather than cinematic ad creation. A
              third cluster is substitutes: buyers can still generate clips in one tool, finish them in Adobe Premiere
              or DaVinci Resolve, or simply keep a manual production stack plus freelancers. That means the relevant
              comparison set is wider than text-to-video vendors alone.


              Higgsfield’s strongest market signal is that it does not ask buyers to bet on one engine. Official pages
              and reviews both describe a routed workflow that can call outside models such as Sora, Kling, Veo, Wan,
              and Seedance while layering Higgsfield-specific controls such as Cinema Studio and Soul ID on top. That
              makes the platform attractive to social marketers and creators who value flexibility, but it also means
              its moat depends more on workflow aggregation than on exclusive model ownership. The chapter’s bottom line
              is that Higgsfield is strongest where buyers want cinematic, short-form, multi-model production in one
              interface, and weaker where enterprise governance, installed editing software, or upstream model owners
              can dictate the workflow.
            claimRefs:
