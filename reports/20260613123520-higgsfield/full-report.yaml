      - number: '1.4'
        title: Scale, Milestones, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Higgsfield's commercial velocity is exceptional: from $0 to $200 million ARR in under nine months from
              product launch (April 2025 to January 2026), a trajectory the company benchmarked against Lovable, Cursor,
              OpenAI, Slack, and Zoom. By early February 2026 ARR had reached $300 million, with CEO Mashrabov targeting
              $1 billion by year-end 2026. Registered users grew from 11 million (September 2025) to 15 million (January
              2026) to over 25 million (June 2026); daily video generation volume rose from 4.5 million per day (January
              2026) to approximately 6 million per day (June 2026). The platform has generated over 850 million total
              items. Paying subscribers reached approximately 300,000 by early February 2026. However, rapid scale has
              produced material adverse events. A February 2026 Forbes investigation documented three categories of
              failure: (1) Higgsfield's marketing team distributed a media kit for its Vibe Motion launch containing
              stock video clips from Envato falsely presented as AI-generated, and separately distributed to creators
              videos featuring overtly racist depictions of popular animated characters and non-consensual deepfakes of
              public figures; (2) Higgsfield's X account was suspended for "inauthentic behavior" following the
              promotion; (3) multiple users on "unlimited" subscription plans experienced severe performance throttling,
              prompting $1.35 million in refunds. CSO de Silva acknowledged all three failures publicly, attributing
              them to processes that "hadn't always kept pace with core values." Higgsfield subsequently implemented
              mandatory legal and senior-leadership review for all external marketing materials. The Higgsfield Earn
              creator-monetization program also experienced payment delays affecting multiple creators, attributed by
              the company to fraudulent activity detection challenges.
