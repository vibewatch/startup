  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model & Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Higgsfield’s public monetization stack is easiest to understand as a layered credit business rather than a
              plain flat-fee SaaS subscription. Official enterprise and team materials show the company selling shared
              workspaces, approvals, role controls, security commitments, and demo-led enterprise expansion on top of a
              self-serve creator funnel. Third-party pricing trackers and reviews consistently describe a freemium
              ladder with paid consumer plans, a team or business seat construct, and a custom enterprise tier, but they
              disagree on exact price points because the live pricing page renders client-side and exposes little
              machine-readable detail. That matters financially: list pricing exists, yet realized pricing can move
              materially when credits, annual discounts, promo codes, premium-model usage, and enterprise custom terms
              all shape what a customer actually pays. The public evidence therefore supports a broad conclusion that
              revenue comes from subscriptions, shared-seat plans, enterprise contracts, and likely usage top-ups, while
              leaving the exact mix, realized discounting, and revenue-recognition policy unverified.
