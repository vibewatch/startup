  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >
              Higgsfield operates at the intersection of generative AI, synthetic media, and user-generated content — a
              regulatory tripoint that is rapidly crystallising across all major jurisdictions. The EU AI Act's
              prohibitions on harmful AI manipulation and biometric categorisation became effective in February 2025,
              and its General Purpose AI (GPAI) transparency and safety obligations now apply to large model
              integrators, not merely model developers. Higgsfield integrates at least 12 third-party AI models into a
              single platform, and its role as a high-volume distributor of synthetic media outputs may trigger GPAI
              compliance obligations in Europe. The deepfake labelling requirements under the EU AI Act, requiring
              disclosure of AI-generated content, already affect platform and user obligations. In the United States,
              the Copyright Office published Federal Register guidance (37 CFR Part 202, March 2023) establishing that
              AI-generated content lacking sufficient human authorship is not copyrightable — a material risk for
              enterprise customers relying on Higgsfield outputs for commercial campaigns. At least twelve US states
              have enacted non-consensual deepfake legislation; federal proposals are pending. Higgsfield's Privacy
              Policy (effective August 2025) acknowledges GDPR applicability and international data transfers, but does
              not confirm that Standard Contractual Clauses or adequate safeguards are in place for US-bound processing.
              The Terms of Use contain mandatory binding arbitration and a class-action waiver, limiting the company's
              class-litigation exposure but potentially violating consumer protection norms in certain EU jurisdictions.
              The combination of deepfake liability, copyright ownership uncertainty, and GDPR compliance gaps makes the
              regulatory risk profile material and current, not hypothetical.
