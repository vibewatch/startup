      Maps Higgsfield's key risks by likelihood (rows) and severity (columns) as of June 2026, highlighting a
      concentration of high-likelihood, high-severity risks in content safety and reputational categories.
    data:
      columns:
        - 'Severity: Low'
        - 'Severity: Medium'
        - 'Severity: High'
        - 'Severity: Critical'
      rows:
        - label: 'Likelihood: High'
          values:
            - Staging/scaling friction
            - Bot attack / fraud
            - Platform outage
            - Content safety failure
        - label: 'Likelihood: Medium'
          values:
            - Pricing compression
            - X/Twitter channel loss
            - Capital raise difficulty
            - Regulatory action (EU AI Act)
        - label: 'Likelihood: Low'
          values:
            - Key person departure
            - GDPR data breach
            - OpenAI access restriction
            - IP litigation from training data
    approximationNotes: >-
      Likelihood and severity ratings are qualitative assessments based on published evidence and industry norms; no
      formal risk quantification was available.
