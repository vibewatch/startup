      - number: '2.3'
        title: Buyer Segmentation and Adoption Dynamics
        blocks:
          - type: paragraph
            body: >-
              Higgsfield's buyer base is dominated by social media marketers, who account for 85% of platform usage; 80%
              of that segment is already delivering commercial work, indicating this is a production-infrastructure
              purchase rather than an experimentation budget. The payer is typically the marketing department budget,
              owned by a CMO or head of digital, with individual marketers or designers as users. The second major
              segment is creative agencies, which use Higgsfield to deliver client video briefs faster and at lower cost
              — the platform's multi-model architecture lets agencies select the optimal model per brief without
              managing multiple subscriptions. The enterprise and DTC brand team segment is emerging as the
              highest-value buyer: several beta customers are spending over $200,000 per year, and direct-to-consumer
              advertisers running "URL-to-Ad" automation pipelines represent a "GenAI-first" operating model adoption
              that Higgsfield is explicitly targeting with its Marketing Studio. Individual creators form a large but
              lower-ARPU base — Higgsfield's Earn program targets this segment for viral distribution but has
              encountered payment and fraud issues that may cap its long-term monetization. The adoption trigger differs
              by segment: for social media teams it is content volume and publishing frequency; for DTC advertisers it
              is CPA optimization through rapid creative iteration; for enterprise brands it is compliance-grade content
              safety combined with production speed. Budget ownership shifts from discretionary creator spend (free or
              $15/month) to line-item marketing operations spend ($34-$84/month+) to enterprise procurement (custom
              pricing). Higgsfield's 300,000+ paying subscribers as of February 2026 suggest meaningful conversion from
              the free tier but the ratio to 25 million registered users (1.2% conversion) indicates significant
              unconverted free-tier mass.
