      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Higgsfield was co-founded by Alex Mashrabov (CEO) and Yerzat Dulat (CTO). Mashrabov previously served as
              Head of Generative AI at Snap Inc., where he built deep experience in social media content generation at
              scale; his public profile is central to the company's investor and media narratives. Dulat, based in
              Kazakhstan, leads Higgsfield's engineering organization across its San Francisco and Almaty offices. Mahi
              de Silva joined as co-founder and Chief Strategy Officer in early 2025 and oversees marketing, influencer
              strategy, and go-to-market; his public role in the February 2026 Forbes investigation — acknowledging
              marketing process failures — has made him a visible risk vector. Jeff Herbst, formerly Head of Corporate
              Development at NVIDIA and managing partner at lead investor GFT Ventures, serves on Higgsfield's board;
              his 20-year NVIDIA tenure spanning developer ecosystems and AI infrastructure adds strategic value, and he
              has been the primary external voice amplifying Higgsfield's growth narrative to the press and investor
              community. Active hiring on the careers page spans Engineering & Product, G&A, Marketing & Sales, and
              Research & Development in both San Francisco and Almaty, indicating a distributed international structure.
              As of January 2026 Higgsfield had approximately 70 employees, with a stated target of approximately 300 by
              year-end 2026. Key-person dependence on Mashrabov is notable; board composition beyond Jeff Herbst has not
              been publicly disclosed, limiting governance assessment from the outside.
