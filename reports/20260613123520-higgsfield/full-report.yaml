      - number: '6.2'
        title: Named proof and production depth
        blocks:
          - type: paragraph
            body: >
              Higgsfield's named customer proof is real but narrow. The cleanest verified production example in the
              retained pack is Vertex CGI creative director Nikita Vantorin's use of Higgsfield for a Qatar Airways
              campaign that Forbes said generated 69 million Instagram views. That is meaningful because it proves a
              named agency-side practitioner used the product in a real campaign with a measurable audience outcome. A
              second useful proof point comes from AppReviewLab's practitioner review, which describes an unnamed
              skincare brand using Soul ID to generate 15 spokesperson-consistent video variations in four hours instead
              of a full day of shooting. That case is helpful because it shows the product solving a commercial
              production problem, but its evidentiary weight is lower because the brand is unnamed and the business
              outcome is not disclosed.


              The bigger headline customer names are much weaker than the marketing narrative suggests. Cofounders told
              Forbes contributor Charlie Fink that agencies working for brands such as Nike, Coca-Cola, and McDonald's
              use the software, but Forbes' more investigative February article also reported that none of those brands
              confirmed usage. That leaves those logos in an unverified middle state: plausible, commercially important
              if true, but not yet reference-quality proof. The adverse proof matters too. Forbes reported that
              filmmaker Tim Soret declined a proposed Vibe Motion launch collaboration after identifying stock footage
              presented as if it were AI-generated. That episode does not erase the platform's commercial utility, but
              it does show that customer trust and marketing credibility are still fragile. Investors should therefore
              underwrite Higgsfield's customer proof as strong on usage scale, moderate on practitioner case studies,
              and thin on independently confirmed marquee logos.
