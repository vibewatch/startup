      - number: '4.3'
        title: Cost Structure & Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The cost side is where the public story becomes materially weaker. Higgsfield’s own materials and
              independent reviews show a platform routing work across 50-plus models, including premium third-party
              engines such as Sora, Veo, Kling, and Seedance, while also supporting enterprise collaboration and
              high-throughput marketing workflows. That architecture is commercially attractive, but it implies
              nontrivial serving costs because every generation consumes scarce GPU or partner-model capacity.
              Fluxnote’s clip-level credit math reinforces that concern: depending on model and quality settings, a
              single output can burn tens to hundreds of credits, making realized cost-to-serve much more variable than
              headline subscription prices imply. Public sources do not disclose gross margin, compute cost per
              generation, support burden, or working-capital dynamics. Instead, the chapter is left triangulating from
              volume, model mix, refunds, promo credits, and throttling complaints. The result is a business with
              visible revenue momentum but still-unproven unit economics, especially if aggressive discounts and creator
              incentives are doing part of the acquisition work.
