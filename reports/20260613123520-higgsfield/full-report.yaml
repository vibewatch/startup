      - number: '7.4'
        title: Financial and Business-Model Risks
        blocks:
          - type: paragraph
            body: >
              Higgsfield's CSO claimed in February 2026 that the company burned only $500,000 in the ten months
              preceding $200M ARR — an extraordinary claim that is unverified and internally inconsistent with typical
              cloud infrastructure costs at 4.5M daily video generation scale. If each video requires a conservative 30
              seconds of A100-equivalent compute, daily compute costs alone approach $3M per month at on-demand cloud
              pricing. Anonymous VCs quoted in Forbes expressed skepticism that the "economic flywheel of the business
              makes sense," noting the company's reliance on heavy discount promotions ($3M in free promo codes, 65%
              Black Friday discounts on unlimited plans) and throttling users who took those deals. The Higgsfield Earn
              influencer program, while distributing $1M+ to creators, also attracted significant fraud, requiring
              active countermeasures. Pricing spans $9/month (Starter) to $149/month (Agency), with credit-based
              consumption creating margin uncertainty as premium models like Sora 2 carry high per-generation costs. At
              300,000 paying users and $200M ARR, blended ARPU is approximately $667/year ($55/month) — consistent with
              the Pro or Agency tier, but sensitive to any downward pressure on retention or mix shift toward the
              Starter tier. The company is reportedly in talks for an additional fundraise as of February 2026,
              suggesting capital requirements beyond the $130M Series A total, and the implied burn at scale may be
              materially higher than the CSO's stated figure.
