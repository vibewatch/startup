    sections:
      - number: '8.1'
        title: Financing Context and Valuation Reference Point
        blocks:
          - type: paragraph
            body: >-
              The January 2026 financing establishes the only clean public price anchor: Higgsfield raised an $80M
              Series A extension that brought the full Series A to $130M and the company's reported post-money valuation
              to $1.3B. That matters because the same financing package also claimed a $200M annual revenue run-rate,
              15M users, 4.5M videos generated per day, and a team of about 70 people, producing a headline picture of
              unusual speed. By February 2026, Forbes reported the annual run-rate had already moved to roughly $300M
              with about 300,000 paying users. On that lens, the mark compresses from about 6.5x ARR to roughly 4.3x ARR
              in a matter of weeks. The valuation reference point is therefore not a classic late-stage premium
              multiple; it is a question of whether the underlying ARR is durable, margin-accretive, and safe to scale.
              Public evidence says the price is supportable as a growth multiple, but not yet underwritten as a
              high-conviction quality multiple.
