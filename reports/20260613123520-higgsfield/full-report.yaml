      - number: '6.3'
        title: Retention, satisfaction, and repeat usage
        blocks:
          - type: paragraph
            body: >
              Higgsfield's biggest customer diligence gap is not adoption; it is durability. Public sources provide
              enough evidence to say the platform has monetized at impressive speed, with Forbes reporting roughly
              300,000 paying users by February 2026 and company-linked reporting pointing to a jump from $100 million to
              $200 million ARR by January 2026 and a $300 million-plus run rate by early February. Those numbers imply
              respectable monetization and an estimated annual ARPU of roughly $667 at the $200 million ARR / 300,000
              payer combination. But none of the retained public sources publish NRR, GRR, churn, cohort retention,
              plan-level cancellation rates, or customer concentration by revenue. That means the market can see rapid
              top-line conversion without seeing whether those customers stay.


              The adverse evidence does point to real retention risk below the headline growth story. Trustpilot sits
              around 3.8 out of 5 and includes repeated complaints about throttling on nominally unlimited plans,
              dark-pattern billing, and automatic migration into on-demand charges. Forbes also reported that discounted
              unlimited plans drew large numbers of users who later found the service functionally unusable without
              buying additional credits, and that the company refunded $1.35 million to users affected by slowdowns
              partly caused by bot attacks. Credits reportedly expire after 90 days and do not roll over, which likely
              hurts occasional but potentially valuable users. The right read is not that retention is poor with
              certainty; it is that the strongest public indicators of repeat usage are indirect, while the strongest
              direct public indicators of user sentiment skew negative.
