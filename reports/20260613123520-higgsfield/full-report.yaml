        title: Growth Traction & GTM Efficiency
        blocks:
          - type: paragraph
            body: >-
              Public traction is unusually strong for a private application-layer AI company. The January financing
              announcement and follow-on press coverage say Higgsfield crossed $200M annualized revenue in under nine
              months, doubled from $100M in roughly two months, exceeded 15M users, and reached 4.5M daily video
              generations. Forbes then reported that the annualized run rate moved above $300M by early February 2026,
              with roughly 300,000 paying users and management targeting $1B by year-end. The GTM motion also looks more
              commercially oriented than a pure consumer app: Forbes and Reuters-syndicated coverage say about 85% of
              usage comes from professional social media marketers, while enterprise beta customers were reportedly
              already spending more than $200K per year. That supports a view that Higgsfield is monetizing a
              high-volume marketing workflow, not just creator experimentation. Even so, CAC, retention, win rates,
              churn, and cohort efficiency are absent from public disclosures, so the growth signal is strong but the
              sales-efficiency proof remains incomplete.
