chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Higgsfield Inc., headquartered in San Francisco, California, describes its core offering as an AI-native
              generative video platform and "video reasoning engine" designed to automate commercial video production
              for brands, agencies, and social media marketing teams. Founded in October 2023 and commercially launched
              in April 2025 with a browser-based product, the company reached over 25 million registered users and
              approximately 6 million video generations per day as of June 2026. Rather than training a single
              proprietary foundation model, Higgsfield aggregates over twelve third-party AI video and image models —
              including OpenAI Sora 2, Google Veo 3.1 and Nano Banana, Alibaba WAN, Kuaishou Kling 3.0, and Bytedance
              Seedream and Seedance — into a unified end-to-end production interface covering ideation, storyboarding,
              animation, editing, and publishing in a single browser session. Differentiated features include Cinema
              Studio 2.0 (launched February 2026; 70+ camera motion presets), Soul ID (persistent character consistency
              across scenes), a UGC Builder for authentic-style ad content, and a Marketing Studio that converts product
              URLs into campaign-ready video variants via its "URL-to-Ad" automation pipeline. Revenue is generated
              through tiered subscriptions as of June 2026: Starter at $15/month (200 credits), Plus at $34/month (1,000
              credits), Ultra at $84/month (3,000 credits), and enterprise or team plans at negotiated pricing; credits
              expire after 90 days. The company claims SOC2 and ISO 42001 alignment, GDPR compliance, and serves over
              100,000 business teams. Its initial consumer mobile-app concept (a ChatGPT-for-video product) was
              abandoned after consumers proved unwilling to pay; the pivot to professional creators and marketers proved
              decisive.
