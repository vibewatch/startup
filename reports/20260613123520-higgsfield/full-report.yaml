  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Higgsfield operates at the intersection of three adjacent spending categories: AI video generation tools,
              digital marketing content production, and marketing automation platforms. Its core addressable spend is
              professional subscription and API revenue from teams producing social media, advertising, and enterprise
              marketing video using AI-native workflows. This excludes traditional professional video production
              services (equipment rental, crew, post houses), long-form cinematic production for film and TV, and
              general-purpose text-to-image tools without video output. Adjacent spend that Higgsfield is beginning to
              capture includes AI avatar and influencer creation (its AI Influencer product), marketing automation
              (Marketing Studio and URL-to-Ad pipeline), and developer-facing API workflows (Higgsfield Skills API). The
              primary status-quo substitute is traditional video production using tools like Adobe Premiere Pro and
              Blackmagic Design DaVinci Resolve, which Higgsfield claims to replace at a 10x speed advantage and $12,000
              saved per content asset; these claims are company-disclosed and not independently validated. A secondary
              substitute is the emerging class of single-model AI video generators — Runway ML, Pika, Kling AI — against
              which Higgsfield differentiates via a multi-model aggregator architecture and full production workflow
              rather than generation-only capability. The market boundary matters because TAM estimates that include all
              video creation spend ($200B+) are not directly serviceable by Higgsfield's current subscription product,
              which addresses the narrower AI-native marketing and social content production segment.
