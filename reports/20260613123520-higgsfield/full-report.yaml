      - number: '1.3'
        title: Funding History and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Higgsfield's capitalization history reflects exceptional early investor conviction. In September 2025, the
              company closed an oversubscribed $50 million Series A led by GFT Ventures with participation from
              BroadLight Capital, NextEquity Partners, AI Capital Partners (Alpha Intelligence Capital's U.S. fund),
              Menlo Ventures, and Alpha Square Group. On January 15, 2026 — only four months later — Higgsfield
              announced an $80 million Series A extension with Accel, AI Capital Partners, and Menlo Ventures, bringing
              total Series A financing to over $130 million and establishing a post-money valuation exceeding $1.3
              billion; the strategic lead was Alpha Intelligence Capital's Antoine Blondeau. Third-party aggregator
              GetLatka records total lifetime funding at approximately $188 million across three rounds, implying a seed
              or pre-Series A tranche not separately announced. CEO Mashrabov stated in February 2026 that Higgsfield
              was in discussions for another capital raise. CSO de Silva claimed the company burned only $500,000 over
              its first ten months before reaching $200 million ARR — a figure not independently audited. Venture
              investors interviewed by Forbes expressed skepticism about the unit economics behind Higgsfield's
              heavily-discounted subscriber acquisition programs. Secondary transactions and debt facilities have not
              been publicly disclosed. The full equity cap table, including percentage ownership by round and any
              secondary sales by founders, remains private.
