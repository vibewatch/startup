      - number: '7.3'
        title: Operational and Technical Risks
        blocks:
          - type: paragraph
            body: >
              Higgsfield's platform generates approximately 4.5 million video clips per day across its 24 million
              registered users, a throughput level that has already caused documented platform instability. The
              company's browser-based, server-side compute architecture concentrates all workloads in cloud
              infrastructure, with no disclosed on-premise or distributed fallback. Heavy-traffic events caused
              observable degradation and throttling, prompting user complaints and $1.35M in refunds. Bot attacks
              requiring the shutdown of 40,000 accounts in December 2025–January 2026 demonstrate the adversarial
              surface of operating a free-tier onboarding funnel at consumer scale. Content moderation is applied at the
              model level with different filtering logic per integrated model, creating inconsistent enforcement across
              Higgsfield's 12+ integrated models; there is no disclosed universal content filter. Higgsfield has not
              disclosed SOC 2, ISO 27001, or any other security certification, raising enterprise trust barriers. The
              company employs approximately 70 people as of January 2026, a staffing level that is low relative to the
              operational complexity of a platform generating 4.5M daily videos from 12+ AI model integrations.
              Execution risk from rapid headcount scaling is present: the company grew from under 15 employees one year
              prior, compressing the culture and process maturation timeline.
