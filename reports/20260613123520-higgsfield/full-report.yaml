  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >
              Higgsfield serves at least two distinct demand surfaces that should not be collapsed into one customer
              bucket. The broadest surface is a very large self-serve creator base that signs up through social buzz,
              free credits, and low-friction monthly plans. The higher-value surface is commercial: marketing teams,
              agencies, e-commerce operators, and enterprise creative groups that care less about novelty and more about
              throughput, consistency, and campaign ROI. Public evidence consistently points to this commercial skew.
              Higgsfield's own enterprise and marketing pages frame the product around business workflows, while outside
              analysis claims that 85% of the platform's users are professional marketers and that roughly 80% of
              created content is commercial rather than personal. That matters because a marketing-led user mix is
              usually more budgeted and repeatable than a purely consumer creator audience.


              The segmentation still needs care. Buyers, users, and payers are not always the same person. An individual
              creator may discover the product and self-serve into a Starter or Plus plan, while an agency creative
              director or performance-marketing lead may be the buyer for a small team, and a larger enterprise may only
              enter through a demo-led motion. The company claims 24 million-plus creators, 300 million-plus videos
              created, and 100,000-plus teams on platform as of June 2026, which together imply enormous top-of-funnel
              scale. But those numbers do not disclose how many users are active, how many teams are paying, how many
              are enterprise, or what share of ARR comes from each cohort. The strongest working conclusion is that
              creators drive awareness and usage volume, while agencies and marketing teams likely drive the best
              monetization quality.
