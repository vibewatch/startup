      - number: '5.2'
        title: Architecture, Integration & Dependencies
        blocks:
          - type: paragraph
            body: >-
              The platform architecture appears to be a routed application stack rather than a vertically integrated
              model company. Official pages and technical docs show an application layer of creator-facing products, an
              orchestration layer made up of Hermes Agent, Soul ID training, Lipsync, and storyboard tooling, and a
              model layer that can call premium external engines such as Sora 2, Kling, Veo 3.1, Seedance, and other
              image models. The MCP surface extends that architecture outward by letting external agents invoke
              generation workflows through Model Context Protocol instead of a classic proprietary SDK. That is
              strategically useful because it makes Higgsfield available both as an end-user product and as an
              agent-accessible tool in broader AI workflows.


              The same design makes dependency risk impossible to ignore. Higgsfield benefits whenever upstream model
              vendors improve quality, but it also inherits provider pricing, availability, and policy changes. Forbes
              and Higgsfield's own Team Plan materials indicate especially deep dependence on OpenAI's Sora API, while
              analyst-style coverage points to server-side NVIDIA-backed compute. Stripe sits in the payment path and
              model-level moderation sits in the safety path. Architecturally, Higgsfield looks like a workflow and
              orchestration company built atop third-party model access plus proprietary creative controls. That is a
              credible software position, but it is less defensible than owning the foundational models or publishing
              hard reliability telemetry around latency, uptime, and failure recovery.
