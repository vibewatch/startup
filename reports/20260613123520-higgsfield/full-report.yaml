  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface & Customer Jobs
        blocks:
          - type: paragraph
            body: >-
              Higgsfield's product surface is broad for a young AI-video company because it packages multiple creative
              jobs into one web workspace instead of selling a single generation endpoint. The product set spans
              flagship video generation through Cinema Studio 2.0, campaign automation through Marketing Studio and
              Hermes Agent, persistent character creation through AI Influencer Studio and Soul ID, multilingual
              post-production through Lipsync Studio, storyboard planning through Popcorn, and still-image generation
              through Nano Banana Pro and related image models. In customer-workflow terms, that means a marketer can
              move from brief, to asset generation, to localization, to variant production without leaving the same
              interface. That breadth is the clearest product advantage because buyers shopping for short-form ad
              creation care as much about reducing tool handoffs as they do about any single base model.


              The workflow claims are also specific enough to matter for diligence. Marketing Studio promises
              URL-to-video automation and nine preset creative formats, while UGC Builder focuses on talking-head
              performance and AI Marketing Video Maker extends into dubbing and translation. Popcorn turns scripts or
              prompts into eight to ten storyboard scenes, and Soul ID plus Recast handle persistent on-screen identity.
              The resulting view is not of a generic text-to-video app, but of a campaign-production stack optimized for
              creators, social teams, and brands that need many variants quickly. The open diligence question is whether
              this breadth translates into consistently reliable outputs at production scale or whether it mainly
              increases the number of credit-consuming iteration loops.
