      - number: '7.2'
        title: Reputational and Content-Safety Risks
        blocks:
          - type: paragraph
            body: >
              In February 2026, Forbes reported that Higgsfield's internal marketing team and external third-party
              creators distributed Google Drive folders containing racist videos featuring children's characters (Shrek,
              Moana, Mickey Mouse), nonconsensual deepfake clips of public figures (Sydney Sweeney, Zendaya, President
              Trump), and a stock video template falsely presented as AI-generated output. Higgsfield's CSO Mahi de
              Silva confirmed the incidents, acknowledging both internal and external creators produced the material and
              describing it as "absolutely not representative of our values." The company's X/Twitter account was
              subsequently suspended for "inauthentic behavior," eliminating its primary viral marketing channel. While
              Higgsfield announced post-incident process improvements — mandatory legal review and senior leadership
              sign-off for all external materials — execution reliability remains unverified. Separately, Forbes
              documented Higgsfield's advertisement boasting it "ended 20 creative jobs," which alienated the creator
              community the company is trying to serve. Trustpilot reviews (rated 3.7-3.8/5) describe deceptive billing
              practices, throttled "unlimited" plans, and automatic on-demand charges. The company refunded $1.35
              million to affected users as of February 2026. These incidents collectively represent a pattern rather
              than a single error, elevating the probability of recurrence and the severity of brand damage in
              enterprise sales.
