  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Public value
      - Status
      - Implication
      - Planned use / diligence ask
    rows:
      - - Latest primary capital
        - '>$130M total Series A after $80M extension'
        - Disclosed
        - Reduces near-term capital pressure but does not reveal current cash balance
        - Confirm unrestricted cash on hand post-close and any secondary component
      - - Lifetime funding
        - '~$188M total across three rounds per GetLatka'
        - Third-party reported
        - Implies seed capital beyond the disclosed Series A stack
        - Reconcile cap table and lifetime proceeds to bank balance
      - - Cash on hand
        - null
        - Undisclosed
        - Public runway cannot be measured from available sources
        - Provide current cash, restricted cash, and monthly cash bridge
      - - Burn disclosure
        - '$0.5M burned in first ten months before $200M ARR, per management quote'
        - Company-claimed
        - Potentially signals extreme capital efficiency or incomplete cost framing
        - Provide monthly gross burn, net burn, and one-time credits/refunds history
      - - Next-round signal
        - Forbes said company was already back in funding talks by Feb 2026
        - Third-party reported
        - Suggests management still values financing flexibility despite January extension
        - Clarify target round timing, purpose, and minimum cash threshold
      - - Planned use of funds
        - Enterprise sales, international expansion, R&D, API and marketing automation
        - Disclosed
        - Future opex and compute demand likely rise materially
        - Map budget by hiring, infrastructure, and go-to-market bucket
      - - Headcount plan
        - ~70 employees to ~300 by end-2026; GetLatka lists ~101 employees
        - Mixed public signals
        - Scaling payroll and support burden could compress margins if revenue mix weakens
        - Provide actual headcount by month and hiring plan by function
      - - Debt / project finance
        - null
        - No public disclosure found
        - Cannot exclude financing obligations or vendor commitments from public data alone
        - Provide debt schedule, cloud commitments, and material supplier prepayments
    notes: >-
      This table focuses on forward capital adequacy rather than repeating the
      full historical funding chronology, which is owned by Company Overview.
    claimRefs:
      - CI001
      - CI013
      - CI025
      - CI026
      - CI027
      - CI028
      - CI034
      - CI042
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on underwriting
      - What public data says today
      - Exact diligence path
    rows:
      - - Revenue mix by stream
        - Cannot tell how much ARR comes from entry plans versus team seats, enterprise, or top-ups
        - Public sources prove multiple monetization paths but not their percentages
        - Request monthly recurring revenue bridge by plan, enterprise, and top-up revenue
      - - Realized pricing / discount leakage
        - List pricing may overstate monetization quality if promo usage is heavy
        - Public evidence includes discounts, promo codes, and conflicting pricing snapshots
        - Request billed price realization by plan and by cohort including promo-acquired users
      - - Gross margin by model family
        - Impossible to test software-like profitability without serving-cost disclosure
        - Compute-heavy routing is visible, but gross margin is absent from public sources
        - Request gross margin and COGS split across proprietary versus third-party models
      - - CAC / LTV / payback
        - Cannot judge whether growth is efficient or subsidy-driven
        - No public CAC, LTV, or payback data found
        - Request acquisition cost by channel, payback period, and LTV by cohort
      - - NRR / churn
        - Cannot separate durable expansion from gross-new-logo growth
        - No public NRR or churn metrics found
        - Request NRR, logo churn, and revenue churn by customer segment
      - - Cash on hand / runway
        - Cannot assess financing urgency from public data alone
        - Funding rounds are public, but current cash and runway are not
        - Request monthly cash bridge, runway model, and board cash-threshold policy
      - - Enterprise contract terms
        - Cannot model ACV durability or implementation friction
        - Several beta customers reportedly spend >$200K, but counts and terms are private
        - Request top 20 contract templates, renewal rates, and time-to-value data
      - - Audited or management financial statements
        - Limits ability to validate ARR, burn, refunds, and revenue recognition
        - Public evidence is mainly press, interviews, and reviews rather than audited reporting
        - Request board deck, audited or reviewed statements, and monthly management accounts
    notes: >-
      Each gap names the exact private evidence needed to move from a growth
      narrative to an underwritable financial model.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial enumeration of the most decision-relevant public-data gaps for
        financial diligence based on the retained source pack and chapter
        research questions.
    claimRefs:
      - CI020
      - CI033
      - CI034
      - CI041
      - CI042
