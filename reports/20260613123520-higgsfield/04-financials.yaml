  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Paying subscribers
        - ~300,000
        - Medium
        - Supports that a meaningful subscription base exists instead of purely free usage
        - Request paid subscribers by plan and by monthly vs annual billing
      - - Implied annual revenue per payer
        - ~667 USD per year at $200M ARR / 300K payers
        - Medium
        - Gives a rough ARPPU bridge that can be compared with list pricing and enterprise upsell
        - Request billed ARPPU by cohort and logo segment
      - - Enterprise beta spend
        - Several customers >$200K per year
        - Medium
        - Shows that six-figure ACV is possible and helps explain ARPPU above entry-tier pricing
        - Request number of >$100K and >$200K accounts plus average term length
      - - Usage concentration
        - ~85% of usage from professional social marketers
        - High
        - Suggests commercial rather than hobbyist demand and affects churn expectations
        - Request retention and expansion by marketer vs creator cohorts
      - - Gross margin
        - null
        - Low
        - Core indicator for whether heavy compute can scale into software-like economics
        - Provide gross margin by model family, cloud vendor, and enterprise support load
      - - Compute cost per generation
        - null
        - Low
        - Needed to understand whether premium-model routing is profitable at current price points
        - Provide weighted average cost per image/video generation and partner-model pass-through
      - - CAC / LTV / payback
        - null
        - Low
        - Required to test whether promo-driven acquisition is efficient or merely fast
        - Provide channel CAC, blended payback, and LTV by plan cohort
      - - NRR / churn
        - null
        - Low
        - Separates durable recurring revenue from promo-led gross adds
        - Provide logo churn, gross revenue churn, and NRR by segment
    notes: Null means the metric is not publicly disclosed in retained sources, not that the metric equals zero.
