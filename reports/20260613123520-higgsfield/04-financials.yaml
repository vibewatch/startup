  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - What is public
      - List vs realized pricing
      - Discounts / unknowns
      - Source snapshot
    rows:
      - - Free
        - Free tier with limited access
        - Free entry point is consistently cited across official and secondary pricing coverage
        - Realized revenue is zero; value is top-of-funnel acquisition
        - Exact credit allowance on live page is not machine-readable
        - Official pricing page; UsagePricing; Apostle
      - - Starter / entry paid
        - ~15 USD per month in current secondary snapshots
        - Starter at $15 and 200 credits appears consistently in newer pricing roundups
        - Realized price depends on promo discounts and top-ups
        - Official live card cannot be machine-read directly
        - UsagePricing; Fluxnote
      - - Higher consumer tiers
        - Current secondary snapshots describe discounted annual Plus and Ultra tiers and larger credit pools
        - Public evidence supports annual discounting and tiered credits, not one canonical live card export
        - Realized ARPU depends on model mix and promo cadence
        - Secondary sources disagree on exact monthly ladder across 2026
        - UsagePricing; AppReviewLab; UCStrategies
      - - Business seats
        - Per-seat team plan with shared credits and collaboration features
        - Business / team packaging is visible in official team and review materials
        - Realized seat pricing is likely negotiated or promo-adjusted for some accounts
        - Current live figures remain dependent on third-party captures
        - UsagePricing; team-plan page
      - - Enterprise
        - Custom pricing via demo-led sales motion
        - Enterprise packaging is explicit on official pages
        - Realized pricing is contract-specific rather than list-based
        - No public ACV schedule or standard term sheet
        - Enterprise page; official demo flow
      - - Premium-model usage economics
        - Clip-level credit burn can vary widely by model and quality
        - Review coverage quantifies 60-300 credit usage for premium outputs
        - Realized cost per finished asset depends on iterations, failures, and add-ons
        - Public sources do not show net margin after partner-model costs
        - Fluxnote; AppReviewLab
      - - Older 2026 public snapshots
        - Older reviews preserved ~$9-$10 starter and ~$29-$30 pro framing
        - Shows historical pricing drift across 2026 coverage
        - Not appropriate to use as current realized price without confirmation
        - Conflicts with later tier names and pricing ladders
        - UCStrategies; Apostle
    notes: >-
      The official pricing page is client-rendered, so the table distinguishes
      what is directly supportable from what is reconstructed by secondary
      pricing trackers and reviews.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial pricing enumeration assembled from the official client-rendered
        pricing surface plus multiple June 2026 secondary captures and reviews
        because the live page is not fully machine-readable.
