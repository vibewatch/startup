  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: A monthly revenue bridge split across self-serve plans, business seats, enterprise contracts, and credit top-ups.
      whyItMatters: Without the mix, public ARR cannot be translated into durable segment economics or forecast quality.
      diligencePath: Request the last 12 months of MRR by plan plus top-up revenue and enterprise booked ARR.
      relatedQuestionRefs:
        - QI003
      relatedTableRefs:
        - TI001
        - TI005
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Actual billed price realization by cohort, including promo-acquired users, annual billing, and enterprise discounts.
      whyItMatters: List pricing may overstate monetization quality if discounts and credit giveaways are doing the conversion work.
      diligencePath: Request cohort-level billed ARPU, discount logs, promo-code usage, and top-up revenue by plan.
      relatedQuestionRefs:
        - QI005
      relatedTableRefs:
        - TI002
        - TI005
    - type: private-evidence-only
      severity: material
      topic: enterprise-contract-terms
      missingEvidence: Enterprise logo count, ACV distribution, contract length, renewal data, and implementation cost.
      whyItMatters: Several >$200K beta customers are encouraging, but underwriting needs to know whether that pattern is broad and durable.
      diligencePath: Review top-20 enterprise contracts, pipeline conversion, and renewal or expansion history.
      relatedQuestionRefs:
        - QI011
      relatedTableRefs:
        - TI001
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: compute-cost-per-video
      missingEvidence: Weighted average cost per video, cost per credit, and partner-model pass-through economics by model family.
      whyItMatters: Without compute-cost disclosure, no public source can clear gross margin or validate whether premium-model routing is profitable.
      diligencePath: Request gross margin build, cloud invoices, partner-model spend, and contribution margin by product path.
      relatedQuestionRefs:
        - QI013
        - QI012
        - QI014
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Current cash balance, unrestricted cash, monthly gross burn, net burn, and board runway model after the January 2026 extension.
      whyItMatters: Financing dependency cannot be underwritten from gross capital raised alone.
      diligencePath: Request monthly cash bridge, board cash-threshold policy, and hiring-adjusted runway model.
      relatedQuestionRefs:
        - QI015
        - QI016
        - QI018
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: cac-ltv-payback
      missingEvidence: Channel CAC, blended and segmented LTV, and payback by plan cohort.
      whyItMatters: The public record shows hypergrowth but cannot tell whether acquisition spend and promo credits are efficient.
      diligencePath: Request acquisition cost by channel and cohort retention model with CAC payback calculations.
      relatedQuestionRefs:
        - QI010
        - QI022
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: nrr-churn
      missingEvidence: Logo churn, gross revenue churn, and NRR by self-serve, business, and enterprise cohorts.
      whyItMatters: Promo-led growth can look strong in gross adds while still hiding weak retention.
      diligencePath: Request monthly retention dashboards and cohort expansion analysis.
      relatedQuestionRefs:
        - QI025
        - QI023
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: Audited or reviewed financial statements plus monthly management accounts tying ARR, refunds, and burn to accounting records.
      whyItMatters: Most public figures come from press and interviews rather than audited reporting.
      diligencePath: Obtain audited statements or at minimum reviewed management financials with ARR reconciliation and refund reserve policy.
      relatedQuestionRefs:
        - QI004
        - QI024
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: material
      topic: free-vs-paid-ratio
      missingEvidence: A precise denominator for total users, customers, teams, and paying subscribers across the platform.
      whyItMatters: Different public denominators make conversion, monetization, and retention math hard to trust.
      diligencePath: Request a KPI dictionary and monthly active user waterfall from total accounts to paying accounts.
      relatedQuestionRefs:
        - QI006
        - QI007
      relatedTableRefs:
        - TI003
        - TI005
