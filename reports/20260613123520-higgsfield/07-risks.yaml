callouts:
  - calloutType: risk
    title: Content Safety Pattern Risk — Not a One-Off
    body: >
      The February 2026 Forbes investigation documented racist videos, nonconsensual deepfakes,
      and false AI-generation claims as a connected pattern of behaviour, not an isolated incident.
      The CSO's admission that "controversial content gets attention" was explicit policy, not
      accident. A second equivalent incident would be a thesis-break trigger.
    claimRefs: [CR006, CR007, CR008, CR009, CR035]

  - calloutType: risk
    title: OpenAI Concentration Is the Platform's Largest Single Risk
    body: >
      As OpenAI's largest Sora 2 customer by spend and usage, Higgsfield has the most to lose
      from any API pricing, access, or competitive pivot. There is no disclosed contractual
      protection against adverse changes, and the multi-model hedge is partial — no other model
      currently matches Sora 2's narrative coherence at scale.
    claimRefs: [CR018, CR019, CR029]

  - calloutType: risk
    title: Burn Rate Claim Lacks Credibility at Scale
    body: >
      A stated $500K burn over 10 months at 4.5M daily video generations is inconsistent with
      estimated cloud infrastructure costs. Anonymous VCs familiar with the company share this
      skepticism. Unaudited financials mean investors cannot verify the true cash position or
      burn rate before committing capital.
    claimRefs: [CR022, CR023, CR024, CR027]

  - calloutType: insight
    title: EU AI Act GPAI Compliance Is the Unaddressed Regulatory Time-Bomb
    body: >
      Higgsfield's GPAI model integrator status under the EU AI Act has not been assessed or
      disclosed. As a platform distributing outputs from multiple large AI models to commercial
      users in Europe, Higgsfield may carry secondary compliance obligations that could materially
      increase operating costs or limit European market access without a clear mitigation path.
    claimRefs: [CR001, CR033, CR038]

