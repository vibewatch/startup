companyProfile:
  summary: Higgsfield is a San Francisco-based private AI video startup founded in October 2023 by former Snap generative-AI leader Alex Mashrabov and CTO Yerzat Dulat. The company pivoted from a consumer video concept into a browser-based marketing and creator production platform that chains multiple third-party models into a single workflow covering ideation, storyboarding, generation, editing, and publishing. Public disclosures support an unusually fast climb to a $1.3B valuation and $200M annualized revenue run rate by January 2026, but they also show material governance, safety, billing, and unit-economics questions that remain open.
