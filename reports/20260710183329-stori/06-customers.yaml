schemaVersion: report-v2
artifact: customers
slug: stori
runDate: '2026-07-10'
company:
  name: Stori
chapter:
  number: 6
  title: Customers
  summary: >-
    Stori’s public customer story is strongest on breadth and inclusion rather than on deep retention metrics. The retained evidence supports a large Mexican mass-market user base built around underserved consumers and increasingly widened into savers, remittance-linked users, micromerchants, and partner-channel segments, but public data on repeat usage, concentration, and cohort durability remain limited.
sections:
  - id: customer-segmentation-and-core-jobs
    title: Customer segmentation, buyers, users, and key jobs-to-be-done
    body: >-
      Stori’s customer base is fundamentally consumer-led. The core buyer, user, and payer is the same individual: a Mexican consumer seeking first-time or second-chance formal credit, simple app-based savings, or low-friction money management. The most important supporting evidence is consistent across company and third-party sources: Stori’s owned pages emphasize approval without heavy bureau friction, Reuters and Bloomberg frame the company around underserved consumers, and LinkedIn still describes the broader mission as serving hundreds of millions of underbanked Latin Americans. Public product expansion creates secondary segments on top of that core. Cuenta+ introduces saver and balance-management users. Félix introduces remittance-linked recipients and senders influencing destination choice. Tap introduces micromerchants as users and fee payers. Co-branded cards with SHEIN, Atlas, and Farmacias Similares imply acquisition through affinity or partner communities rather than only through a generic card funnel. The key customer insight is that Stori is no longer serving one monolithic “unbanked borrower” segment; it is building a layered underserved-money-user base with different entry points into the same app ecosystem.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-named-proof
    title: Adoption trajectory, public customer growth signals, and named proof quality
    body: >-
      Public customer adoption is easier to prove than public retention. Stori and third-party coverage together establish a credible scale trajectory: over 1 million-plus users by 2022, 3 million users by the 2024 financing announcement, more than 4 million users in 2025 remittance-related coverage, and 5 million-plus Mexicans on current owned marketing. Those numbers are not perfectly standardized, but they show that Stori is not a niche pilot. Named proof is harder because Stori sells to mass consumers rather than enterprise accounts. The best public substitutes are customer-facing proof surfaces: app-store listings and review-oriented summaries showing how users describe the product, plus partner-linked flows that demonstrate real use cases in production rather than concept stage. Kardmatch’s review of Cuenta+ is particularly useful because it combines positive feature commentary with caution on protection limits and trust. That makes it more informative than a pure owned testimonial. Taken together, the public record supports real customer adoption and some qualitative user acceptance, while still leaving important gaps on actives, funded accounts, and long-term repeat behavior.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: retention-repeat-usage-and-durability
    title: Retention, repeat usage, satisfaction proxies, and durability gaps
    body: >-
      The largest public customer gap is durability. Stori’s owned pages clearly describe reasons to keep using the app after first approval: bill pay, savings yields, balance management, on-app card controls, rewards, and adjacent products. App-store and Play-store surfaces provide lightweight external evidence that users find the app useful enough to rate it positively. Kardmatch also argues that the app experience and digital account tooling are meaningful strengths. But none of these public signals are substitutes for real retention data. There is no public NRR, GRR, churn, or cohort curve in the retained source set, and even user counts are not always standardized between “users,” “clients,” “account holders,” “card users,” and “Mexicans served.” The right conclusion is therefore restrained: Stori likely has repeat-use potential because the product suite is broader than one dormant card, but public evidence does not yet prove how sticky those users are over time or how many adopt multiple modules in a profitable way.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU026, CU027]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-loops-and-concentration-risk
    title: Expansion loops, partner dependence, and concentration risk
    body: >-
      Stori’s expansion logic is clear in public materials: land a consumer through a card or partner page, keep them in the app with payments and account tools, then widen usage into savings, loans, remittances, or merchant acceptance. That creates multiple expansion loops, but it also introduces concentration and channel risk. If partner-led channels such as SHEIN, Atlas, Farmacias Similares, or Félix become too important without proven economics, the company can end up with customer breadth that is less durable than it appears. There is also a category-level concentration issue. Public market commentary shows large rivals like Nu, Mercado Pago, and ecosystem-based players competing for the same mass-market consumer wallet, which means multi-homing is a realistic customer behavior. The consequence is that Stori’s customer value depends less on top-line sign-up counts than on whether it can hold balances, keep repeat engagement, and deepen trust after the first product. Public evidence supports the existence of these loops, but not yet the degree to which they create durable share of wallet.
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038, CU039, CU040]
    tableRefs: [TU005]
    figureRefs: []
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer / user / payer, Use case, Scale signal, Revenue / strategic value, Gap]
    rows:
      - [Thin-file or underserved consumer, Same person, First credit access and financial identity building, Core company narrative across owned and news sources, Entry wedge and long-term wallet relationship, No public cohort profitability by segment]
      - [Saver / deposit user, Same person, Store and grow balances in Cuenta+, Public deposit product rollout and review coverage, Funding quality and higher app frequency, No public funded-account or balance-retention data]
      - [Remittance-linked recipient, Sender influences product choice and recipient uses the account, Receive money into a Stori-linked destination, Félix and El Economista show live production use case, New deposit inflow and family-finance relevance, No public attach-rate or repeat-remittance disclosure]
      - [Micromerchant, Merchant owner pays and uses, Accept payments through Tap, Public product page proves offering exists, Expands beyond household finance into merchant workflow, No public merchant count or GMV]
      - [Partner-channel shopper / affinity user, Same person, Acquire card through SHEIN Atlas or Farmacias Similares pathways, Visible current partner pages, Lower CAC potential and better segmentation, No public partner-channel economics]
    notes: This segmentation focuses on observable customer behaviors rather than on internal management taxonomy.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns: [Metric, Value, Date, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Users / customers, 1.4M, 2022, Prior funding coverage and Parsers summary, Medium, Shows the company had already achieved meaningful early scale, Exact active-user definition unavailable]
      - [Users, 3M, 2024-08, PR Newswire and Reuters, Medium, Confirms national-scale consumer penetration before broader product push, Active vs cumulative users not disclosed]
      - [Users, 4M+, 2025-10, El Economista remittance coverage, Medium, Suggests continuing adoption beyond the 2024 round, Product mix within total users not disclosed]
      - [Mexicans served, 5M+, Current, Stori homepage / Play listing, Medium, Current owned marketing shows continued scale ambition, Definition may differ from active customers]
      - [Card + savings split, 2.3M card users and 300k savings users, 2024-04, El Economista fusion coverage, Medium, Gives rare glimpse of product-mix adoption, Current mix not publicly updated]
    notes: Adoption signals are directionally strong but not standardized, so they should not be treated as a clean KPI series.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: Stori is a mass-consumer fintech, so public named proof is mostly review, listing, and partner-use-case evidence rather than enterprise reference accounts.
    columns: [Customer, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Kardmatch reviewer audience, Saver / evaluator, Public review of Cuenta+ and app-managed savings workflow, Production consumer product, Review highlights digital onboarding and daily-yield features while warning on protection limits, Independent review not equal to broad satisfaction sample]
      - [Apple App Store users, Consumer app users, Ongoing iOS app usage for card and account management, Production, Listing existence and rating signal indicate real consumer usage, Ratings are not the same as retention or revenue quality]
      - [Google Play users, Consumer app users, Ongoing Android app usage for card and account management, Production, Listing text and rating signal indicate large-market app deployment, Store metrics do not disclose churn or funded-account behavior]
      - [Félix / Stori remittance users, Remittance-linked households, Send-money flow into Stori destination, Production, Partner pages and news show a live customer use case beyond domestic credit, Public attach and repeat-use data unavailable]
    notes: In a B2C fintech, named proof necessarily leans on public review and production-use-case evidence rather than named enterprise logos.
    claimRefs: [CU016, CU017, CU018, CU028, CU029]
  - id: TU004
    title: Retention / repeat usage / satisfaction table
    columns: [Metric, Value / null, Segment, Confidence, Diligence ask]
    rows:
      - [True retention cohort, null, All users, Low, Request month-1 month-3 month-6 funded and active retention]
      - [NRR / GRR, null, Multi-product users, Low, Request revenue retention if internally tracked]
      - [Public app satisfaction proxy, 4.7 / 5 blended review signal, Consumer app users, Medium, Reconcile rating signal against actual support and churn data]
      - [Repeat-use potential, Qualitatively positive but unquantified, Card and account users, Medium, Request frequency and bill-pay / transfer engagement metrics]
      - [Multi-product attach, null, Existing Stori customers, Low, Request share of card users also holding Cuenta+ loans or Tap use]
    notes: Public evidence is strongest on satisfaction proxies and weakest on true retention math.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU026, CU027]
  - id: TU005
    title: Expansion and concentration risk table
    columns: [Expansion driver, Concentration risk, Impact, Diligence path]
    rows:
      - [Card-to-account cross-sell, Users may multi-home balances elsewhere, Medium-High, Request funded-account attach and balance persistence]
      - [Remittance-linked growth, Dependence on partner execution and corridor economics, Medium, Request remittance-funded account counts and repeat behavior]
      - [Partner-affinity channels, One or two channels could matter more than expected, Medium, Request partner concentration and CAC by channel]
      - [Tap merchant expansion, Merchant adoption may remain too small to matter financially, Medium, Request active merchants and GMV]
      - [Mass-market scale, Large rivals can compete for the same underserved consumer, High, Request overlap and reactivation data against major peers]
    notes: Expansion is visible; durable concentration-adjusted economics are not.
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038, CU039, CU040]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Stori’s customer journey starts with simple access and ideally expands into repeat app-based money management.
    data:
      items:
        - label: Discover
          detail: Card page, partner page, or app-store discovery
        - label: Apply
          detail: Mobile-first onboarding and approval flow
        - label: Activate
          detail: First card or account use
        - label: Repeat
          detail: Bills transfers savings and app controls
        - label: Expand
          detail: Loans remittances Tap or co-brand continuation
    claimRefs: [CU001, CU002, CU004, CU006, CU019, CU028]
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: Public evidence supports a broad acquisition-to-use funnel but not the exact conversion rates between steps.
    data:
      nodes:
        - {id: c1, label: Audience reached through owned or partner channels}
        - {id: c2, label: Application and onboarding}
        - {id: c3, label: First approved card or account}
        - {id: c4, label: Repeat app-based usage}
        - {id: c5, label: Multi-product expansion}
      edges:
        - {from: c1, to: c2}
        - {from: c2, to: c3}
        - {from: c3, to: c4}
        - {from: c4, to: c5}
    claimRefs: [CU009, CU010, CU011, CU019, CU020, CU030]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Public customer proof is strongest on product-in-production and weakest on quantified outcome and retention transparency.
    data:
      columns: [Production proof, Outcome specificity, Satisfaction visibility, Retention visibility]
      rows:
        - label: App Store / Play listings
          values: [High, Low, Medium, Low]
        - label: Kardmatch review
          values: [High, Medium, Medium, Low]
        - label: Félix use case
          values: [High, Medium, Low, Low]
        - label: Partner-channel pages
          values: [Medium, Low, Low, Low]
    claimRefs: [CU016, CU017, CU018, CU022, CU023, CU029]
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: wide
    summary: No true public retention cohort is disclosed, so this figure uses public satisfaction proxies only and should not be read as actual retention.
    data:
      columns: [month-1, month-3, month-6]
      rows:
        - label: iOS satisfaction proxy
          values: [96, 96, 96]
        - label: Android satisfaction proxy
          values: [92, 92, 92]
        - label: Public repeat-use visibility
          values: [100, 40, 0]
    claimRefs: [CU021, CU022, CU023, CU024, CU026, CU027]
callouts:
  - calloutType: strength
    title: Stori has clearly crossed out of pilot territory
    body: Multiple independent and owned sources support national-scale customer adoption rather than a niche or experimental user base.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
  - calloutType: risk
    title: Public retention evidence is thin
    body: User-count growth and positive ratings do not prove durable retention, funded-account behavior, or multi-product economics.
    claimRefs: [CU019, CU021, CU022, CU024, CU025, CU026, CU027]
  - calloutType: insight
    title: Customer breadth is widening through new jobs-to-be-done
    body: Savings, remittances, partner channels, and Tap all suggest Stori is serving more than one financial moment for the same broad user base.
    claimRefs: [CU003, CU004, CU005, CU006, CU028, CU030]
  - calloutType: assumption
    title: User counts are directionally useful, not perfectly standardized
    body: Public customer totals likely mix users clients and served individuals, so they should frame scale but not replace management KPIs.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015]
