  claims:
    - {id: CU001, statement: 'Stori’s core customer is an individual Mexican consumer who is usually also the buyer user and payer of the product.', type: inferred, topic: segments, sourceRefs: [SU001, SU007, SU018], confidence: medium, freshness: current, answersQuestionRefs: [QU001]}
    - {id: CU002, statement: 'Reuters and Bloomberg frame Stori around underserved or underbanked consumer finance rather than enterprise software or affluent banking.', type: third-party-reported, topic: segments, sourceRefs: [SU003, SU004], confidence: medium, freshness: recent, answersQuestionRefs: [QU001]}
    - {id: CU003, statement: 'Cuenta+ expands the customer base into savers and balance-management users rather than only cardholders.', type: company-claimed, topic: segments, sourceRefs: [SU018], confidence: medium, freshness: current, answersQuestionRefs: [QU003]}
    - {id: CU004, statement: 'Félix adds remittance-linked households as a meaningful adjacent customer segment.', type: third-party-reported, topic: segments, sourceRefs: [SU012, SU013, SU014], confidence: medium, freshness: recent, answersQuestionRefs: [QU004]}
    - {id: CU005, statement: 'Tap adds micromerchants as users and payers within the broader Stori ecosystem.', type: company-claimed, topic: segments, sourceRefs: [SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU005]}
    - {id: CU006, statement: 'SHEIN Atlas and Farmacias Similares pages show that affinity or partner-channel users are part of the acquisition mix.', type: company-claimed, topic: segments, sourceRefs: [SU015, SU016, SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU002]}
    - {id: CU007, statement: 'LinkedIn still frames Stori’s broader mission around underbanked Latin American consumers, reinforcing the inclusion-led segment thesis.', type: company-claimed, topic: segments, sourceRefs: [SU006], confidence: medium, freshness: current, answersQuestionRefs: [QU001]}
    - {id: CU008, statement: 'The visible customer map is now layered rather than monolithic because multiple entry surfaces lead into the same app ecosystem.', type: inferred, topic: segments, sourceRefs: [SU001, SU012, SU015, SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU002, QU025]}
    - {id: CU009, statement: 'Public sources establish that Stori had already reached more than one million users by 2022.', type: third-party-reported, topic: growth, sourceRefs: [SU005], confidence: medium, freshness: historical, answersQuestionRefs: [QU006]}
    - {id: CU010, statement: 'PR Newswire said Stori had 3 million users at the time of the August 2024 financing announcement.', type: company-claimed, topic: growth, sourceRefs: [SU002], confidence: medium, freshness: recent, answersQuestionRefs: [QU007]}
    - {id: CU011, statement: 'Reuters also linked the 2024 round to a 3 million-user customer base.', type: third-party-reported, topic: growth, sourceRefs: [SU003], confidence: medium, freshness: recent, answersQuestionRefs: [QU007]}
    - {id: CU012, statement: 'El Economista’s 2025 remittance coverage said Stori had more than 4 million users.', type: third-party-reported, topic: growth, sourceRefs: [SU013], confidence: medium, freshness: recent, answersQuestionRefs: [QU008]}
    - {id: CU013, statement: 'Current owned marketing says more than 5 million Mexicans already enjoy Stori’s financial peace of mind.', type: company-claimed, topic: growth, sourceRefs: [SU001, SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU009, QU027]}
    - {id: CU014, statement: 'El Economista’s 2024 fusion coverage referenced about 2.3 million card users and 300,000 savings users.', type: third-party-reported, topic: growth, sourceRefs: [SU023], confidence: medium, freshness: recent, answersQuestionRefs: [QU010, QU028]}
    - {id: CU015, statement: 'These growth signals are directionally strong but are not perfectly standardized across sources.', type: inferred, topic: growth, sourceRefs: [SU002, SU003, SU013, SU023], confidence: medium, freshness: current, answersQuestionRefs: [QU006, QU029]}
    - {id: CU016, statement: 'In a mass-consumer fintech, public named customer proof is mostly review listing and live-use-case evidence rather than enterprise reference accounts.', type: inferred, topic: proof, sourceRefs: [SU009, SU010, SU011, SU012], confidence: medium, freshness: current, answersQuestionRefs: [QU011]}
    - {id: CU017, statement: 'Kardmatch’s Cuenta+ review is valuable because it combines positive product commentary with adverse trust caveats.', type: third-party-reported, topic: proof, sourceRefs: [SU011, SU019], confidence: medium, freshness: recent, answersQuestionRefs: [QU012]}
    - {id: CU018, statement: 'App-store listings and remittance flows demonstrate that Stori’s customer products are live in production rather than concept-stage.', type: inferred, topic: proof, sourceRefs: [SU009, SU010, SU012], confidence: medium, freshness: current, answersQuestionRefs: [QU013, QU014]}
    - {id: CU019, statement: 'Owned pages describe multiple reasons for repeat use after first approval, including bill pay savings yields account controls and adjacent products.', type: company-claimed, topic: retention, sourceRefs: [SU018, SU020, SU025], confidence: medium, freshness: current, answersQuestionRefs: [QU015]}
    - {id: CU020, statement: 'App-store and Play-store surfaces provide public satisfaction signals but not true retention math.', type: inferred, topic: retention, sourceRefs: [SU009, SU010], confidence: medium, freshness: current, answersQuestionRefs: [QU016, QU017]}
    - {id: CU021, statement: 'Kardmatch says the Stori app has strong public ratings and highlights practical account-management features.', type: third-party-reported, topic: retention, sourceRefs: [SU011], confidence: medium, freshness: recent, answersQuestionRefs: [QU016]}
    - {id: CU022, statement: 'No public NRR GRR or churn cohort is disclosed in the retained source set.', type: open-question, topic: retention, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QU015, QU029]}
    - {id: CU023, statement: 'Ratings are a satisfaction proxy and cannot substitute for funded-account or active-user retention.', type: inferred, topic: retention, sourceRefs: [SU009, SU010, SU011], confidence: medium, freshness: current, answersQuestionRefs: [QU017]}
    - {id: CU024, statement: 'The customer evidence is therefore stronger on broad acceptance than on measured durability.', type: inferred, topic: retention, sourceRefs: [SU009, SU010, SU011, SU020], confidence: medium, freshness: current, answersQuestionRefs: [QU025]}
    - {id: CU025, statement: 'Public evidence does not reveal how many Stori users hold multiple modules profitably over time.', type: open-question, topic: retention, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QU018, QU029]}
    - {id: CU026, statement: 'The retention figure in this chapter should be read as a public satisfaction proxy rather than as a true cohort disclosure.', type: inferred, topic: retention, sourceRefs: [SU009, SU010, SU011], confidence: medium, freshness: current, answersQuestionRefs: [QU017]}
    - {id: CU027, statement: 'A prudent diligence conclusion is that repeat-use potential exists, but durable customer stickiness is still unproven from public data.', type: inferred, topic: retention, sourceRefs: [SU018, SU020, SU021], confidence: medium, freshness: current, answersQuestionRefs: [QU025, QU030]}
    - {id: CU028, statement: 'Stori’s expansion logic is to land users through a card or partner page and then widen usage into savings loans remittances or merchant tools.', type: inferred, topic: expansion, sourceRefs: [SU001, SU012, SU018, SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU019]}
    - {id: CU029, statement: 'Félix creates a specific expansion loop in which remittance receipt can become deposit behavior inside Stori.', type: third-party-reported, topic: expansion, sourceRefs: [SU012, SU013, SU014], confidence: medium, freshness: recent, answersQuestionRefs: [QU022]}
    - {id: CU030, statement: 'Partner-channel pages show that customer acquisition is already broader than pure direct-response card marketing.', type: company-claimed, topic: expansion, sourceRefs: [SU015, SU016, SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU019, QU020]}
    - {id: CU031, statement: 'This broader channel mix can improve acquisition efficiency only if partner economics are sound.', type: inferred, topic: concentration, sourceRefs: [SU012, SU015, SU016, SU017], confidence: medium, freshness: current, answersQuestionRefs: [QU020, QU030]}
    - {id: CU032, statement: 'Tap could create a meaningful new user category, but public evidence does not yet show merchant scale.', type: inferred, topic: expansion, sourceRefs: [SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU023]}
    - {id: CU033, statement: 'Large rivals make customer multi-homing a realistic behavior in Mexican digital finance.', type: inferred, topic: concentration, sourceRefs: [SU021, SU022], confidence: medium, freshness: current, answersQuestionRefs: [QU021]}
    - {id: CU034, statement: 'That means headline user counts are less important than funded balances repeat usage and share of wallet.', type: inferred, topic: concentration, sourceRefs: [SU021, SU022], confidence: medium, freshness: current, answersQuestionRefs: [QU021, QU030]}
    - {id: CU035, statement: 'Kardmatch’s trust caveats show that deposit customers may still compare Stori unfavorably with banks on safety perception.', type: third-party-reported, topic: concentration, sourceRefs: [SU011, SU019], confidence: medium, freshness: recent, answersQuestionRefs: [QU024]}
    - {id: CU036, statement: 'Bloomberg Línea said about 80 percent of Stori’s card customers were first-time cardholders, underscoring a distinctive acquisition segment.', type: third-party-reported, topic: segments, sourceRefs: [SU004], confidence: medium, freshness: recent, answersQuestionRefs: [QU026]}
    - {id: CU037, statement: 'Current official scale claims imply that Stori has progressed beyond a pure credit-card originator toward a broader consumer-finance customer base.', type: inferred, topic: growth, sourceRefs: [SU001, SU018, SU026], confidence: medium, freshness: current, answersQuestionRefs: [QU027]}
    - {id: CU038, statement: 'Savings users appear to have been a newer cohort in 2024 than card users, consistent with product-stack expansion after the original card wedge.', type: inferred, topic: growth, sourceRefs: [SU014, SU018, SU023], confidence: medium, freshness: recent, answersQuestionRefs: [QU028]}
    - {id: CU039, statement: 'The most important management-only customer metrics are retention funded-account actives and partner-channel economics.', type: open-question, topic: concentration, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QU029]}
    - {id: CU040, statement: 'The evidence-based customer verdict is that Stori has proven large-scale customer acquisition and credible use-case breadth, but not yet public proof of durable cohort quality.', type: inferred, topic: verdict, sourceRefs: [SU001, SU002, SU011, SU013, SU021], confidence: medium, freshness: current, answersQuestionRefs: [QU025, QU030]}
    - {id: CU041, statement: 'Stori’s blog and education surfaces suggest the company is trying to deepen customer understanding and repeat engagement beyond initial approval.', type: company-claimed, topic: retention, sourceRefs: [SU024, SU025, SU031], confidence: medium, freshness: current, answersQuestionRefs: [QU015]}
