  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: The current product appears mature in cards and regulated retail-finance basics, less mature in public proof around merchant remittance and engineering-quality metrics.
    data:
      columns: [Public product visibility, Regulatory scaffolding, Workflow clarity, External adoption signal, Public quality metrics]
      rows:
        - label: Cards
          values: [High, High, High, High, Low]
        - label: Deposits
          values: [High, High, High, Medium, Low]
        - label: Loans
          values: [Medium, High, Medium, Low, Low]
        - label: Tap
          values: [Medium, Medium, Medium, Low, Low]
        - label: Remittance linkage
          values: [Medium, Medium, Medium, Low, Low]
    claimRefs: [CE027, CE028, CE029, CE030, CE031, CE035]
callouts:
  - calloutType: strength
    title: Stori is now a bundle, not a single feature
    body: Owned pages, contracts, and partner flows show that Stori has assembled multiple reusable retail-finance modules beyond its original card wedge.
    claimRefs: [CE001, CE002, CE003, CE004, CE016, CE018]
  - calloutType: insight
    title: Public breadth is easier to verify than internal quality
    body: The retained sources strongly support product breadth and regulatory scaffolding, but not uptime, defect, fraud, or servicing-quality metrics.
    claimRefs: [CE027, CE028, CE029, CE031, CE035]
  - calloutType: risk
    title: Operational complexity likely rises faster than marketing implies
    body: Each new product and partner adds dependencies that can fragment service quality if internal tooling and observability lag the bundle expansion.
    claimRefs: [CE021, CE022, CE023, CE024, CE026]
  - calloutType: recommendation
    title: Request architecture and quality-operating reviews
    body: The next diligence step should focus on core ledgers decisioning app release quality fraud controls and customer-service instrumentation rather than more marketing walkthroughs.
    claimRefs: [CE025, CE030, CE032, CE034, CE035]
