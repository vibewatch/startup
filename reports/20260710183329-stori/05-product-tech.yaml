  claims:
    - {id: CE001, statement: 'Stori’s current public product surface includes cards, deposit products, loans, merchant acceptance, and remittance-linked account usage.', type: company-claimed, topic: product-breadth, sourceRefs: [SE001, SE002, SE003, SE004, SE005, SE009], confidence: high, freshness: current, answersQuestionRefs: [QE001, QE003]}
    - {id: CE002, statement: 'Cuenta+, loans, Tap, and partner-linked flows show that Stori is broader than a starter credit-card app.', type: company-claimed, topic: product-breadth, sourceRefs: [SE003, SE004, SE005, SE009], confidence: high, freshness: current, answersQuestionRefs: [QE001, QE003]}
    - {id: CE003, statement: 'The SHEIN, Atlas, and Farmacias Similares pages show that Stori repackages core financial rails for segmented acquisition and use cases.', type: company-claimed, topic: segmentation, sourceRefs: [SE006, SE007, SE008], confidence: medium, freshness: current, answersQuestionRefs: [QE004]}
    - {id: CE004, statement: 'The Stori app-store descriptions present the product as a single app used to manage multiple financial activities.', type: third-party-reported, topic: product-surface, sourceRefs: [SE010, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE017]}
    - {id: CE005, statement: 'Product-specific contracts for cards, deposits, and loans indicate that Stori operates multiple formally defined product modules.', type: inferred, topic: product-surface, sourceRefs: [SE012, SE013, SE014], confidence: medium, freshness: current, answersQuestionRefs: [QE011, QE012]}
    - {id: CE006, statement: 'PR Newswire and Reuters both describe Stori as broadening beyond its original card product after the 2024 funding round.', type: third-party-reported, topic: roadmap, sourceRefs: [SE023, SE024], confidence: medium, freshness: recent, answersQuestionRefs: [QE020, QE021]}
    - {id: CE007, statement: 'Bloomberg Línea linked the 2024 round to a wider financial-services push in Mexico.', type: third-party-reported, topic: roadmap, sourceRefs: [SE025], confidence: medium, freshness: recent, answersQuestionRefs: [QE020]}
    - {id: CE008, statement: 'The evidence-backed product asset is a reusable financial-services stack rather than a single visible card feature.', type: inferred, topic: product-breadth, sourceRefs: [SE001, SE003, SE004, SE005, SE006, SE009], confidence: medium, freshness: current, answersQuestionRefs: [QE025]}
    - {id: CE009, statement: 'The public acquisition path is mobile-first, beginning on owned or partner landing pages and continuing inside the app.', type: inferred, topic: workflow, sourceRefs: [SE001, SE002, SE006, SE007, SE008, SE010, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE005]}
    - {id: CE010, statement: 'Cuenta+ pages emphasize savings balance growth and everyday app-based money management.', type: company-claimed, topic: workflow, sourceRefs: [SE003], confidence: medium, freshness: current, answersQuestionRefs: [QE006]}
    - {id: CE011, statement: 'Stori préstamos adds a short-term liquidity workflow inside the broader Stori ecosystem.', type: company-claimed, topic: workflow, sourceRefs: [SE004], confidence: medium, freshness: current, answersQuestionRefs: [QE007]}
    - {id: CE012, statement: 'Stori Tap turns the phone into a merchant acceptance workflow rather than only a consumer spending tool.', type: company-claimed, topic: workflow, sourceRefs: [SE005], confidence: medium, freshness: current, answersQuestionRefs: [QE008]}
    - {id: CE013, statement: 'The Félix page shows that Stori can be used as a destination for remittance-linked funds sent from the United States.', type: third-party-reported, topic: workflow, sourceRefs: [SE009], confidence: medium, freshness: recent, answersQuestionRefs: [QE009]}
    - {id: CE014, statement: 'Payments FAQ pages imply that routine servicing and payment education are part of the ongoing product workflow.', type: company-claimed, topic: workflow, sourceRefs: [SE020], confidence: medium, freshness: current, answersQuestionRefs: [QE005]}
    - {id: CE015, statement: 'A multi-module app matters because it can increase frequency and share of wallet compared with a one-time credit approval experience.', type: inferred, topic: workflow, sourceRefs: [SE003, SE004, SE005, SE020], confidence: medium, freshness: current, answersQuestionRefs: [QE006, QE007, QE008]}
    - {id: CE016, statement: 'The key unverified workflow questions are activation, repeat funding, attach, and merchant repeat usage rather than whether the features exist.', type: open-question, topic: workflow, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QE010]}
    - {id: CE017, statement: 'Stori’s visible workflow is software-led and self-service-oriented rather than branch-led.', type: inferred, topic: workflow, sourceRefs: [SE001, SE010, SE011, SE020], confidence: medium, freshness: current, answersQuestionRefs: [QE005, QE017]}
    - {id: CE018, statement: 'The retained evidence supports an architecture with user-facing apps on top of product modules for cards deposits loans and support.', type: inferred, topic: architecture, sourceRefs: [SE001, SE002, SE003, SE004, SE010, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE011]}
    - {id: CE019, statement: 'Contracts and disclosures imply separate internal product processes for cards deposits loans and services.', type: inferred, topic: architecture, sourceRefs: [SE012, SE013, SE014, SE017], confidence: medium, freshness: current, answersQuestionRefs: [QE011, QE012]}
    - {id: CE020, statement: 'The financial core necessarily includes regulated deposit operations inside a SOFIPO framework.', type: inferred, topic: architecture, sourceRefs: [SE003, SE013, SE021], confidence: medium, freshness: current, answersQuestionRefs: [QE011, QE016]}
    - {id: CE021, statement: 'App stores are a critical product dependency because the main consumer experience is mobile-distributed.', type: inferred, topic: dependencies, sourceRefs: [SE010, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE013, QE024]}
    - {id: CE022, statement: 'Payment rails and card processing are critical dependencies because Stori’s public products rely on cards payments and settlement.', type: inferred, topic: dependencies, sourceRefs: [SE002, SE005, SE012], confidence: medium, freshness: current, answersQuestionRefs: [QE013]}
    - {id: CE023, statement: 'Partner integrations are critical dependencies for remittances and segmented distribution.', type: inferred, topic: dependencies, sourceRefs: [SE006, SE007, SE008, SE009, SE027], confidence: medium, freshness: current, answersQuestionRefs: [QE013, QE024]}
    - {id: CE024, statement: 'Customer service and collections are integral operating layers because Stori publishes product-specific service and collections contact materials.', type: inferred, topic: dependencies, sourceRefs: [SE019, SE020], confidence: medium, freshness: current, answersQuestionRefs: [QE013]}
    - {id: CE025, statement: 'Rapid module expansion can create integration and observability risk if internal tooling does not keep pace with the visible bundle.', type: inferred, topic: architecture-risk, sourceRefs: [SE001, SE005, SE012, SE019], confidence: medium, freshness: current, answersQuestionRefs: [QE014, QE023]}
    - {id: CE026, statement: 'The largest hidden product risk is not whether Stori has modules but whether the modules run cleanly together at scale.', type: inferred, topic: architecture-risk, sourceRefs: [SE001, SE003, SE004, SE005, SE019], confidence: medium, freshness: current, answersQuestionRefs: [QE014, QE025]}
    - {id: CE027, statement: 'Stori publishes visible legal surfaces including terms privacy notices contracts and commissions for multiple products.', type: observed, topic: trust, sourceRefs: [SE012, SE013, SE014, SE015, SE016, SE017, SE018], confidence: medium, freshness: current, answersQuestionRefs: [QE015]}
    - {id: CE028, statement: 'Deposit-related pages disclose protection and regulated-product context that are relevant to user trust.', type: company-claimed, topic: trust, sourceRefs: [SE003, SE013, SE018, SE021], confidence: medium, freshness: current, answersQuestionRefs: [QE015, QE016]}
    - {id: CE029, statement: 'Apple App Store and Google Play listings provide external distribution and product-signal evidence beyond owned marketing pages.', type: observed, topic: quality-signal, sourceRefs: [SE010, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE017]}
    - {id: CE030, statement: 'LinkedIn provides evidence that Stori is operating as an organization beyond a landing page but not direct evidence of engineering quality.', type: inferred, topic: quality-signal, sourceRefs: [SE022], confidence: medium, freshness: current, answersQuestionRefs: [QE017]}
    - {id: CE031, statement: 'The retained public evidence does not disclose uptime bug rate fraud-loss rate release cadence or customer-service SLAs.', type: open-question, topic: quality-gaps, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QE018, QE022]}
    - {id: CE032, statement: 'The visible roadmap shows a company that has moved from one core card into a wider product platform over time.', type: inferred, topic: maturity, sourceRefs: [SE002, SE003, SE004, SE005, SE023, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE019, QE021]}
    - {id: CE033, statement: 'The 2024 funding round appears to have supported product expansion rather than only balance-sheet growth.', type: third-party-reported, topic: maturity, sourceRefs: [SE023, SE024, SE025, SE026], confidence: medium, freshness: recent, answersQuestionRefs: [QE020, QE021]}
    - {id: CE034, statement: 'App-led distribution means software quality and support quality are first-order operating concerns even when compliance paperwork is in place.', type: inferred, topic: maturity, sourceRefs: [SE010, SE011, SE015, SE019], confidence: medium, freshness: current, answersQuestionRefs: [QE022, QE025]}
    - {id: CE035, statement: 'The evidence-based verdict is that Stori has built a real multi-module retail-finance product but public evidence is still too thin to prove best-in-class product reliability or technical maturity.', type: inferred, topic: verdict, sourceRefs: [SE001, SE003, SE010, SE011, SE021], confidence: medium, freshness: current, answersQuestionRefs: [QE019, QE025]}
  evidenceGaps:
    - {type: private-evidence-only, severity: material, topic: architecture-details, missingEvidence: 'A real system architecture review covering ledgers decisioning data pipelines incident management and release controls.', whyItMatters: 'Public marketing and contracts do not reveal whether the stack is scalable or fragile.', diligencePath: 'Request an engineering and architecture deep dive with system owners and recent incident history.', relatedQuestionRefs: [QE023], relatedTableRefs: [TE003]}
    - {type: missing-source, severity: material, topic: quality-metrics, missingEvidence: 'Uptime crash rate authorization success fraud-loss and customer-service SLA metrics.', whyItMatters: 'These are the operating indicators that determine whether a consumer-finance app is dependable at scale.', diligencePath: 'Request quarterly product-quality dashboards and incident postmortems.', relatedQuestionRefs: [QE018, QE022], relatedTableRefs: [TE004]}
    - {type: missing-source, severity: material, topic: activation-and-attach, missingEvidence: 'Activation funded-account and multi-product attach rates across cards deposits loans Tap and remittance-linked flows.', whyItMatters: 'Feature breadth only matters economically if users actually progress through the operating flow.', diligencePath: 'Request funnel and attach metrics by cohort.', relatedQuestionRefs: [QE010], relatedTableRefs: [TE002]}
    - {type: missing-source, severity: minor, topic: merchant-scale, missingEvidence: 'Active merchant counts and GMV for Stori Tap.', whyItMatters: 'Tap could become strategically important but the retained public set does not prove scale.', diligencePath: 'Request monthly active merchants GMV and churn.', relatedQuestionRefs: [QE008], relatedTableRefs: [TE001]}
    - {type: missing-source, severity: minor, topic: partner-flow-economics, missingEvidence: 'Economics and user quality for co-brands and remittance-linked channels.', whyItMatters: 'Partnerships may widen the funnel without improving retention or unit economics.', diligencePath: 'Request partner-level CAC conversion and cohort retention.', relatedQuestionRefs: [QE004, QE009], relatedTableRefs: [TE001]}
