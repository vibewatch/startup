  claims:
    - {id: CR001, statement: 'Stori now operates across cards deposits and loans rather than a single credit-card product.', type: inferred, topic: regulatory-perimeter, sourceRefs: [SR001, SR002, SR003, SR004], confidence: medium, freshness: current, answersQuestionRefs: [QR001, QR002]}
    - {id: CR002, statement: 'This broader product surface creates a wider regulatory and legal perimeter than a single card program.', type: inferred, topic: regulatory-perimeter, sourceRefs: [SR001, SR002, SR003, SR004, SR006], confidence: medium, freshness: current, answersQuestionRefs: [QR001]}
    - {id: CR003, statement: 'Stori publishes multiple contracts disclosures commission materials and modification notices for different products.', type: observed, topic: legal-surface, sourceRefs: [SR002, SR003, SR004, SR006, SR007, SR034, SR035, SR036], confidence: medium, freshness: current, answersQuestionRefs: [QR002]}
    - {id: CR004, statement: 'Public legal visibility does not by itself prove the quality of operating compliance or complaint handling.', type: inferred, topic: legal-surface, sourceRefs: [SR003, SR006, SR007], confidence: medium, freshness: current, answersQuestionRefs: [QR004]}
    - {id: CR005, statement: 'Kardmatch notes that SOFIPO savings protection is smaller than bank deposit insurance, which can create trust risk for deposit users.', type: third-party-reported, topic: deposit-trust, sourceRefs: [SR013, SR031], confidence: medium, freshness: recent, answersQuestionRefs: [QR003, QR022]}
    - {id: CR006, statement: 'Kardmatch recommends caution with balances that exceed the protected amount for a SOFIPO account.', type: third-party-reported, topic: deposit-trust, sourceRefs: [SR013], confidence: medium, freshness: recent, answersQuestionRefs: [QR003]}
    - {id: CR007, statement: 'CONDUSEF contact disclosure shows consumer-protection escalation is part of the visible risk surface around Stori’s products.', type: observed, topic: consumer-protection, sourceRefs: [SR008, SR032], confidence: medium, freshness: current, answersQuestionRefs: [QR004]}
    - {id: CR008, statement: 'Savvi-related reporting shows Stori’s regulated-deposit path depends on integration into a SOFIPO structure rather than only a marketing front end.', type: third-party-reported, topic: regulatory-perimeter, sourceRefs: [SR024], confidence: medium, freshness: recent, answersQuestionRefs: [QR001]}
    - {id: CR009, statement: 'The legal risk question is therefore whether disclosures servicing and collections quality scale as fast as product breadth.', type: inferred, topic: regulatory-perimeter, sourceRefs: [SR002, SR006, SR007, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR025]}
    - {id: CR010, statement: 'Legal Paradox characterizes Stori as profitable but with the riskiest loan book among the challengers it compares.', type: third-party-reported, topic: credit-risk, sourceRefs: [SR009], confidence: medium, freshness: recent, answersQuestionRefs: [QR005, QR024]}
    - {id: CR011, statement: 'The 2025 audited statements show large reserve and provisioning balances relative to the scale of the lending business.', type: observed, topic: credit-risk, sourceRefs: [SR010], confidence: medium, freshness: recent, answersQuestionRefs: [QR006]}
    - {id: CR012, statement: 'The March 2026 filing shows profitability remained positive, which means risk is not currently overwhelming the model but still needs monitoring.', type: observed, topic: credit-risk, sourceRefs: [SR011], confidence: medium, freshness: recent, answersQuestionRefs: [QR006, QR021]}
    - {id: CR013, statement: 'Public sources do not disclose uptime authorization-rate or fraud-loss metrics for Stori’s app-led product.', type: open-question, topic: operational-quality, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QR007, QR020]}
    - {id: CR014, statement: 'This means external diligence cannot yet confirm whether visible product quality is matched by strong underlying controls.', type: inferred, topic: operational-quality, sourceRefs: [SR014, SR015, SR023], confidence: medium, freshness: current, answersQuestionRefs: [QR007]}
    - {id: CR015, statement: 'In a thin-file consumer-lending model, complaint or support stress can worsen collections outcomes and vice versa.', type: inferred, topic: operating-compound-risk, sourceRefs: [SR009, SR010, SR013], confidence: medium, freshness: current, answersQuestionRefs: [QR018, QR024]}
    - {id: CR016, statement: 'App-led onboarding and self-service make operational reliability a first-order risk rather than a secondary convenience issue.', type: inferred, topic: operational-quality, sourceRefs: [SR014, SR015], confidence: medium, freshness: current, answersQuestionRefs: [QR008]}
    - {id: CR017, statement: 'The public risk set therefore combines credit underwriting uncertainty with incomplete visibility into support and control quality.', type: inferred, topic: operating-compound-risk, sourceRefs: [SR009, SR013, SR014, SR015], confidence: medium, freshness: current, answersQuestionRefs: [QR024]}
    - {id: CR018, statement: 'Funding and liquidity assumptions become more fragile if customer trust weakens at the same time that losses rise.', type: inferred, topic: operating-compound-risk, sourceRefs: [SR010, SR011, SR013], confidence: medium, freshness: current, answersQuestionRefs: [QR021]}
    - {id: CR019, statement: 'Stori’s visible growth strategy depends on app stores partner channels and external payment or service rails.', type: inferred, topic: dependencies, sourceRefs: [SR014, SR015, SR016, SR017, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR009, QR011]}
    - {id: CR020, statement: 'Apple and Google are critical dependencies because Stori’s main user experience is app-distributed.', type: inferred, topic: dependencies, sourceRefs: [SR014, SR015], confidence: medium, freshness: current, answersQuestionRefs: [QR011]}
    - {id: CR021, statement: 'Félix adds a differentiated remittance-linked use case, but it also introduces partner execution risk outside Stori’s direct control.', type: third-party-reported, topic: dependencies, sourceRefs: [SR016, SR025], confidence: medium, freshness: recent, answersQuestionRefs: [QR009, QR010]}
    - {id: CR022, statement: 'The SHEIN Atlas and Farmacias Similares pages show that partner-led packaging is part of current customer acquisition strategy.', type: company-claimed, topic: dependencies, sourceRefs: [SR017, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR009, QR012]}
    - {id: CR023, statement: 'Partner underperformance can harm Stori’s brand even when the customer only experiences the failure at the handoff layer.', type: inferred, topic: dependencies, sourceRefs: [SR016, SR017, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR010, QR012]}
    - {id: CR024, statement: 'Collections and service contacts published by Stori imply that third-party or multi-step servicing processes are part of the operating model.', type: inferred, topic: dependencies, sourceRefs: [SR007], confidence: medium, freshness: current, answersQuestionRefs: [QR010]}
    - {id: CR025, statement: 'This creates interface risk because Stori owns the customer’s trust outcome even when another party owns part of the process.', type: inferred, topic: dependencies, sourceRefs: [SR007, SR016, SR017], confidence: medium, freshness: current, answersQuestionRefs: [QR010]}
    - {id: CR026, statement: 'WhiteSight’s view that licensing shapes monetization ceilings also implies that regulatory strategy is itself a dependency risk.', type: third-party-reported, topic: dependencies, sourceRefs: [SR021], confidence: medium, freshness: recent, answersQuestionRefs: [QR009]}
    - {id: CR027, statement: 'Partner and platform dependence matters only if channel economics justify the extra operational complexity.', type: inferred, topic: dependencies, sourceRefs: [SR016, SR017, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR012, QR025]}
    - {id: CR028, statement: 'Stori is broadening simultaneously across lending deposits merchant acceptance remittance-linked flows and partner packaging.', type: inferred, topic: execution, sourceRefs: [SR001, SR016, SR017, SR018, SR019, SR022], confidence: medium, freshness: current, answersQuestionRefs: [QR013, QR014]}
    - {id: CR029, statement: 'That breadth creates execution risk across risk compliance treasury product engineering and customer service functions.', type: inferred, topic: execution, sourceRefs: [SR001, SR007, SR010, SR011], confidence: medium, freshness: current, answersQuestionRefs: [QR013, QR014]}
    - {id: CR030, statement: 'Public materials do not reveal whether internal reporting and controls have scaled as fast as the visible bundle has scaled.', type: open-question, topic: execution, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QR015, QR023]}
    - {id: CR031, statement: 'Funding announcements show product-expansion ambition but do not themselves prove operating-team depth.', type: inferred, topic: execution, sourceRefs: [SR012, SR020, SR022, SR023], confidence: medium, freshness: current, answersQuestionRefs: [QR015]}
    - {id: CR032, statement: 'Execution complexity is therefore highest where regulated operations customer support and product expansion intersect.', type: inferred, topic: execution, sourceRefs: [SR001, SR006, SR007, SR010], confidence: medium, freshness: current, answersQuestionRefs: [QR014, QR025]}
    - {id: CR033, statement: 'The most important kill criteria are worsening credit quality service stress partner concentration without economics and any visible compliance breakdown.', type: inferred, topic: kill-criteria, sourceRefs: [SR009, SR010, SR013, SR016], confidence: medium, freshness: current, answersQuestionRefs: [QR016]}
    - {id: CR034, statement: 'Credit or service failures can transmit into complaints margin pressure slower growth and lower valuation confidence in sequence.', type: inferred, topic: risk-transmission, sourceRefs: [SR009, SR010, SR011, SR013], confidence: medium, freshness: current, answersQuestionRefs: [QR018, QR024]}
    - {id: CR035, statement: 'The evidence-based overall risk verdict is that Stori is exposed mainly to compound execution risk rather than one isolated binary hazard.', type: inferred, topic: verdict, sourceRefs: [SR001, SR009, SR010, SR013, SR016, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR017, QR025]}
    - {id: CR036, statement: 'Published terms FAQs and service documents indicate that collections and customer service are formal governance surfaces rather than informal support functions.', type: inferred, topic: legal-surface, sourceRefs: [SR007, SR026, SR029, SR033], confidence: medium, freshness: current, answersQuestionRefs: [QR026]}
    - {id: CR037, statement: 'The Paypers and El Economista both show that remittance-linked usage depends on partner execution as well as Stori’s own product operations.', type: third-party-reported, topic: dependencies, sourceRefs: [SR025, SR028], confidence: medium, freshness: recent, answersQuestionRefs: [QR027]}
    - {id: CR038, statement: 'The World Bank’s view that access to finance remains a growth bottleneck in Mexico implies that any credit tightening or trust shock could constrain Stori’s expansion disproportionately.', type: third-party-reported, topic: macro-risk, sourceRefs: [SR027], confidence: medium, freshness: current, answersQuestionRefs: [QR028]}
    - {id: CR039, statement: 'The gap between SOFIPO protection limits and bank-style trust expectations remains a recurring risk theme in public review coverage.', type: inferred, topic: deposit-trust, sourceRefs: [SR013, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR029]}
    - {id: CR040, statement: 'If credit-quality stress, support strain, and compliance concerns appear together, they are likely to trigger an investment kill-switch faster than pure top-line slowdown alone.', type: inferred, topic: kill-criteria, sourceRefs: [SR009, SR010, SR026, SR029], confidence: medium, freshness: current, answersQuestionRefs: [QR030]}
