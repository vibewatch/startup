tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public signal
  - Current value / status
  - Quality
  - Diligence ask
  enumerationScope:
    coverage: partial
    basis: Rows cover the monetization surfaces directly visible in retained public pages, contracts, and statutory statements, not a management-certified revenue segmentation.
  rows:
  - - Credit cards
    - Interest income, late fees, opening fees, interchange-linked activity, and ancillary card charges
    - Cards are the flagship product and cost sheets disclose CAT and fee structures
    - Clearly active
    - High-revenue potential but credit-risk heavy
    - Request revolving balances, transactor/revolver mix, and net credit yield
  - - Personal loans
    - Interest and fees on app-originated personal credit
    - Public loan contract and product page confirm the product line
    - Clearly active
    - Likely high-yield and risk-sensitive
    - Request average ticket, tenor, APR, and vintage losses
  - - Demand and term deposits
    - Deposit balances deepen wallet share and support funding
    - Cuenta+ and Inversión+ pages plus deposit brochures show demand and time-deposit products
    - Clearly active
    - Low direct revenue but strategically important for funding and retention
    - Request cost of funds and balance stickiness by product
  - - Merchant acceptance / Tap
    - 2.8% + IVA fee per successful NFC transaction
    - Tap page discloses pricing and settlement path into Cuenta+
    - Recently active
    - Potentially attractive fee stream but likely still small
    - Request GMV, active merchants, and gross margin
  - - Payments and app utility
    - Bill pay, top-ups, transfers, and remittance-linked app usage
    - Current pages market payments, recharges, and Félix-linked remittances
    - Active but not segmented
    - Retention-positive but direct monetization unclear
    - Request payment take rates and app-activity monetization
  notes: Stori’s public evidence is stronger on product existence and customer pricing than on revenue-recognition detail. This is enough to map streams, not enough to forecast by stream with confidence.
