- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Public price / rate
  - List vs realized
  - Implication
  - Source / gap
  rows:
  - - Stori Clásica credit card
    - Weighted CAT 164.9% on current card page; product cost sheet shows some card variants at 158.3% or higher
    - List-like disclosure only
    - High-yield segment economics can be attractive but stress customer affordability
    - Need realized APR by cohort and revolve behavior
  - - Stori Green credit card
    - Weighted CAT 204.6% in cost sheet
    - List disclosure
    - Suggests very high-risk high-yield underwriting at some product tiers
    - Need product mix and delinquency by variant
  - - Stori Black
    - 1% cashback, no annual fee, weighted CAT 184.1% on cost sheet
    - List disclosure
    - Mixes rewards messaging with high underlying borrowing costs
    - Need activation, spend, and revolve rates by tier
  - - Cuenta+ demand deposits
    - No opening or management fee; brochure shows base account GAT 0% while promotional savings buckets show higher returns
    - Public list terms
    - Useful for acquisition and funding, but interest cost matters
    - Need cost of funds and average balances
  - - Inversión+ fixed terms
    - Current pages market up to ~8.2% with brochures showing promotional 7.0% GAT examples and some marketing references to 15%
    - Public list terms only
    - Good for balance growth, but could compress margin if not matched to asset yield
    - Need term mix, renewal rates, and spread economics
  - - Stori Tap
    - 2.8% + IVA per successful transaction
    - List disclosure
    - Offers a visible merchant-fee stream with no hardware rental
    - Need merchant acquisition cost and active merchant count
  notes: The pricing picture is unusually visible for a private fintech, but it is still list pricing. Public materials do not disclose realized pricing, credit losses, or customer-level product mix.
