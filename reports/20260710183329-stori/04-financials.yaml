- id: capital-adequacy-funding-and-asset-quality
  title: Capital adequacy, asset quality, and financing dependency
  body: Stori’s capital structure is improving, but it remains tightly linked to credit quality and repeat access to external funding. At year-end 2025, the SOFIPO reported MXN 2.03 billion of capital and MXN 9.78 billion of total liabilities, with a loan book that now roughly matches the deposit base in size. Traditional deposits rose to MXN 9.32 billion, split between MXN 3.25 billion of demand deposits and MXN 6.07 billion of time deposits. Credit-loss reserves reached MXN 1.36 billion at year-end 2025, up from MXN 624 million in 2024, and Deloitte highlighted reserve estimation as the key audit matter in the 2025 audit. The company’s public funding narrative also remains debt-aware rather than equity-only. The 2024 round combined equity with debt from Goldman Sachs and Davidson Kempner, while the 2021 and 2022 rounds also included debt facilities. In other words, Stori is funding credit expansion with a mix of deposits, venture equity, and institutional borrowing. That is strategically
    positive because it broadens capital access, but it also means underwriting confidence should be tied to reserve discipline, net charge-off behavior, covenant terms, and liquidity—not just headline user growth. Public evidence does not disclose runway, debt covenants, or a group-level liquidity stress test.
  claimRefs:
