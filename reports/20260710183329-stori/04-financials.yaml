- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Why it matters
  - Exact diligence path
  enumerationScope:
    coverage: partial
    basis: Rows cover the biggest unresolved financial questions that remain after reviewing retained public filings, product pages, and news coverage.
  rows:
  - - Consolidated group revenue and EBITDA
    - High
    - The SOFIPO filing does not capture the whole Stori group or any non-SOFIPO entities cleanly
    - Request audited consolidated financial statements and segment bridge
  - - Customer acquisition cost and payback
    - High
    - Growth quality cannot be judged from user counts alone
    - Request cohort CAC by channel and payback by product
  - - Delinquency, roll-rate, and charge-off detail
    - High
    - Reserve adequacy and credit model quality are central for a lender to underserved consumers
    - Request monthly vintage tables and collections curves
  - - Debt tenor, covenants, and liquidity runway
    - High
    - Funding dependency is a major risk in a lending-led fintech
    - Request debt-facility summaries and liquidity plan
  - - Product-level margin mix
    - Medium
    - Cards, deposits, loans, and merchant services likely have very different economics
    - Request product P&Ls and contribution-margin bridge
  notes: These gaps are not cosmetic. Each missing metric changes how one should think about growth durability, capital intensity, and valuation.
  claimRefs:
  - CI034
  - CI035
  - CI037
  - CI038
  - CI039
  - CI040
