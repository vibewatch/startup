company:
  name: Stori
chapter:
  number: 4
  title: Financials
  summary: Stori’s financial file is stronger than most private fintech peers because its SOFIPO subsidiary publishes audited and interim statements, but investors still do not get a clean consolidated group P&L. The public record shows a fast-growing balance sheet, high-yield lending and deposit economics, and a 2025 statutory net profit that depends heavily on deferred-tax effects rather than a fully proven operating surplus.
sections:
- id: revenue-model-and-pricing
  title: Revenue model, monetization surfaces, and pricing signals
  body: 'Stori’s public monetization logic is visible even where full revenue segmentation is not. The core balance-sheet engine is consumer credit: card products, personal loans, and related interest, fees, and interchange-like payment activity. On the liabilities side, the company uses deposits and fixed-term savings products to deepen customer engagement and fund the regulated entity. The current card page and cost-of-credit disclosures show that Stori monetizes through high annualized borrowing costs, late fees, opening fees on some variants, and cash-withdrawal or replacement-card fees. The deposit brochure and Cuenta+ pages show the opposite side of the customer value proposition: free opening, no maintenance fee, and yields that have been marketed as market-leading to pull balances into the Stori ecosystem. Merchant acceptance through Stori Tap introduces a third monetization surface, with a disclosed 2.8% plus VAT fee per successful transaction. The result is a consumer-finance stack
    where lending is almost certainly the dominant revenue contributor, while deposits, payments, and merchant acceptance improve retention and wallet share. What remains missing is a public product-level revenue mix or a management-verified bridge from customer activity to consolidated revenue and gross profit.'
  claimRefs:
