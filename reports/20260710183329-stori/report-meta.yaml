subtitle: Mexico consumer-finance platform — real scale and profitability proof, durability still needs deeper diligence
coverageNotes: >-
  Public evidence is unusually strong on product breadth, customer-scale signals, funding history,
  and regulated-entity financial statements, but still incomplete on retention cohorts, standardized
  active-user definitions, partner-channel economics, and group-level unit economics. Valuation and
  recommendation therefore lean on the 2024 round anchor, audited 2025 / Q1 2026 profitability,
  and directional public comparables rather than on prospectus-grade disclosure.
