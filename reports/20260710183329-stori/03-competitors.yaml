- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Entry pricing / contract signal
  - Included capabilities
  - Discount / yield hook
  - Unknowns
  - Implication
  rows:
  - - Stori
    - No annual fee framing on owned cards and digital onboarding
    - Credit, deposits, loans, Tap, remittance-linked flows, co-brands
    - Yield-led savings and simple approval framing
    - Exact pricing by cohort is not fully public
    - Stori cannot rely only on low-friction entry because peers use the same hook
  - - Nu
    - Low-friction cards plus Cuenta Nu / Cajitas
    - Credit card, debit account, savings buckets, bill pay
    - Up to 13% on Cuenta Nu marketing
    - Promotional persistence and cohort economics not fully public
    - Strong savings-led acquisition and retention engine
  - - Klar
    - No-fee account framing on owned pages
    - Account, card, investments, transfers, bill pay
    - High headline yield and investment modules
    - Public price detail changes over time
    - Broad money-management bundle looks directly competitive
  - - Mercado Pago
    - Wallet and payments-led bundle
    - Payments, transfers, business tools, credit, yield-bearing balances
    - Up to 12% annual yield on official messaging
    - Cross-subsidy by ecosystem is not transparent in Mexico-only terms
    - Powerful bundle for users who already transact in MELI ecosystem
  - - RappiCard
    - No-annual-fee credit-card framing
    - Credit card inside Rappi ecosystem
    - Rappi ecosystem convenience rather than broad banking suite
    - Depth outside the card is limited in retained sources
    - Effective substitute for card-first acquisition users
  - - Hey Banco / BBVA
    - Bank-backed card and account bundles
    - Cards, accounts, payments, savings, broader bank rails
    - Yield or loyalty hooks vary by product
    - Not optimized for the same thin-file segment as Stori
    - Incumbents compete hardest on trust rather than novelty
  notes: The competitive pricing picture is dominated by low-friction entry and visible yield rather than complex long-term contracts, which lowers switching costs for consumers.
