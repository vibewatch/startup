  rows:
  - - Nu México
    - Direct challenger
    - 12M-15M Mexico users in retained 2025-2026 sources
    - Mass-market consumers seeking credit plus savings
    - Scale, brand, and well-known savings product
    - Competes for the same everyday-money relationship as Stori
  - - Klar
    - Direct challenger
    - 7M Mexicans trust Klar per owned page; raised large capital historically
    - Mass-market users wanting one app for account, card, and investments
    - Strong integrated app positioning and high-yield marketing
    - Still fights for trust and profitability against larger ecosystems
  - - Ualá
    - Direct challenger
    - Bank-positioning and deposit-protection messaging on official site
    - Consumers seeking simple digital account plus card
    - Regulatory-trust framing via bank identity and IPAB coverage
    - Public scale in Mexico is less obvious than Nu or Mercado Pago
  - - RappiCard
    - Substitute / adjacency
    - App-distributed no-annual-fee card
    - Digital consumers already inside Rappi ecosystem
    - Low-friction acquisition and platform-native discovery
    - Narrower money-management bundle than broader challengers
  - - Mercado Pago
    - Ecosystem competitor
    - Broad payments, transfers, credit, and merchant tools
    - Consumers and merchants inside Mercado Libre ecosystem
    - Commerce-led distribution and large ecosystem breadth
    - Finance is one layer of a larger commerce machine
  - - Spin by OXXO
    - Ecosystem competitor
    - Tens of millions of users plus nationwide store footprint in market commentary
    - Cash-heavy and mass-market users wanting convenience
    - Physical distribution and cash-in/cash-out trust
    - Public commentary questions profitability and active-user quality
  - - Hey Banco / BBVA
    - Incumbent digital
    - Bank-backed trust and existing balance-sheet depth
    - Customers preferring incumbent brands
    - Strong trust, card depth, and established rails
    - Less differentiated for underserved thin-file acquisition
  - - Revolut / Openbank / Plata
    - Likely entrants / expanders
    - Global or new-capital-backed entrants targeting Mexico
    - Digitally savvy users and broader retail banking
    - Fresh capital, global product learnings, or banking ambition
    - Operating proof in Mexico varies and is still forming
  notes: The table groups rivals by the way they attack Stori’s wallet share rather than by legal charter alone. Scale signals are based only on retained public sources and are not standardized across companies.
