- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Underwriting thin-file users better than peers
    - Peers can mimic UX and price while using larger balance sheets
    - High
    - Request cohort loss curves, approval quality, and contribution margin by segment
  - - Broader underserved-consumer brand
    - Nu, Klar, and Mercado Pago can widen bundles faster with larger top-of-funnel
    - High
    - Request retention, cross-sell, and share-of-wallet evidence by product cohort
  - - Partnership-led packaging via SHEIN, Atlas, Farmacias Similares, and Félix
    - Partner channels may be easy for rivals to counter or renegotiate
    - Medium
    - Request partner economics, renewal terms, and user quality by channel
  - - SOFIPO / deposit infrastructure plus profitability proof
    - Regulatory or credit-quality setbacks can erase perceived moat quickly
    - High
    - Request current NPL, reserve, and funding-cost trajectories
  - - Merchant and remittance adjacencies reduce single-product dependence
    - New adjacencies may remain too small to matter economically
    - Medium
    - Request active merchants, GMV, remittance-linked funded accounts, and attach rates
  notes: The retained evidence suggests Stori has emerging structural defenses, but most visible feature moats are copyable. The decisive question is whether unit economics and retention are actually better in the underserved segment.
