- id: pricing-capability-distribution-and-trust
  title: Capability breadth, pricing posture, distribution power, and trust / regulatory posture
  body: 'On capabilities, the most important split is between single-wedge challengers and ecosystem builders. Stori has clearly moved beyond one starter credit card, but Nu, Klar, Mercado Pago, and incumbent-bank apps also offer broader bundles across deposits, payments, and app-based money management. On pricing and packaging, the field leans heavily on zero-fee or low-friction entry plus visible yield, cashback, or convenience. That means Stori’s differentiation cannot rely on headline price alone. Distribution is therefore central. Mercado Pago benefits from commerce and merchant rails, Spin from retail stores, BBVA from branch-scale trust, and RappiCard from app-native discovery inside Rappi. Stori’s comparable distribution response appears to be partnership-led packaging and product adjacency: co-branded cards, merchant acceptance via Tap, and remittance-linked account usage via Félix. Trust and regulatory posture matter because consumers in this segment often evaluate the institution
    before they evaluate the feature. SOFIPO protections, CNBV framing, bank backing, and payment-network familiarity all influence conversion.'
  claimRefs:
