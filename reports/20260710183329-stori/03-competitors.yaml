  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standardized-competitor-kpis
    missingEvidence: A normalized competitor scorecard using the same definitions for active users, funded accounts, deposits, losses, and profitability.
    whyItMatters: Public competitor comparisons mix unlike metrics and can overstate or understate Stori’s true position.
    diligencePath: Build a management-normalized peer benchmark with consistent KPI definitions.
    relatedQuestionRefs:
    - QP004
    - QP023
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: channel-level-cac
    missingEvidence: Public evidence on acquisition cost and payback by partner channel versus owned channels.
    whyItMatters: Partnership-led competition only matters if the channels produce attractive economics.
    diligencePath: Request CAC, approval, fraud, and retention by channel and partner.
    relatedQuestionRefs:
    - QP012
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: merchant-economics
    missingEvidence: Active merchant counts, Tap GMV, and monetization per merchant.
    whyItMatters: Tap is strategically useful only if it changes share of wallet and economics at scale.
    diligencePath: Request active merchants, GMV, and repeat-use data for Tap.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: remittance-attach-rate
    missingEvidence: The number of Stori accounts funded or retained through remittance-linked usage.
    whyItMatters: The Félix partnership is differentiating in theory but its competitive importance is not publicly quantified.
    diligencePath: Request remittance-funded account counts and deposit behavior.
    relatedQuestionRefs:
    - QP014
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: material
    topic: retention-versus-peers
    missingEvidence: Direct retention or share-of-wallet comparisons versus Nu, Klar, and Mercado Pago.
    whyItMatters: Low switching costs make retention the real moat test in this category.
    diligencePath: Request cohort retention and multi-product adoption by peer-overlap segment.
    relatedQuestionRefs:
    - QP017
    - QP018
    relatedTableRefs:
    - TP004
