evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, shareholder-control map, and succession planning materials.
    whyItMatters: >-
      Late-stage underwriting needs to know whether governance has scaled alongside capital raised and product
      complexity.
    diligencePath: Request board materials, governance policies, and shareholder-rights summaries from management.
    relatedQuestionRefs:
      - QO010
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: >-
      A reconciled cap-table and debt schedule that explains why current owned materials cite US$400M+ invested while
      disclosed rounds sum materially higher.
    whyItMatters: Investors need a clean baseline for dilution, leverage, and capital-intensity history.
    diligencePath: Request financing schedule by round, instrument, investor, and debt provider.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: international-footprint
    missingEvidence: Primary evidence confirming current live operations and customer scale outside Mexico.
    whyItMatters: The expansion story affects TAM, operating complexity, and valuation upside.
    diligencePath: Request country-by-country customer, revenue, and regulatory status disclosures.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO005
