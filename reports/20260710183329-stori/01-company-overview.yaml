- id: scale-milestones-and-open-questions
  title: Scale milestones, operating momentum, and open questions
  body: 'The best way to read Stori’s scale narrative is as a chronology rather than a single static metric. In 2022 the company said it had more than 1.4 million customers in Mexico. El Economista reported that by April 2024 Stori had 2.3 million credit-card users and 300,000 savings customers, with management expecting a combined 3 million users in coming months. The August 2024 financing release then referred to 3 million users, and an October 2025 remittances article described more than 4 million users split across credit-card, savings, and multi-product cohorts. The current credit-card page now markets to “more than 5 million Mexicans.” That progression supports a real growth trajectory, even if the exact user definition shifts between cardholders, users, and product holders. Public evidence also shows adjacent milestones: Cuenta+ followed SOFIPO-license approval in 2023, Stori Tap broadened the app into merchant acceptance, and a Félix Pago alliance added WhatsApp-based remittances
    in 2025. The open questions are mostly about operating quality rather than existence: current consolidated headcount, exact active-user definitions, contribution by product line, and whether international expansion is still intent or already execution.'
