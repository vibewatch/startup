- id: founders-leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: The clearest public founder evidence centers on Bin Chen and Marlene Garayzar, who appear repeatedly in official releases as CEO/co-founder and CGO/co-founder respectively. Secondary coverage from EL CEO adds Sherman He, GY Liu, and Nick Chen to the founding group, while LinkedIn employee listings also surface Nick Chen on the company page. That gives the report a supportable founder roster of at least five names, not the six-name list sometimes repeated in prompt lore. Leadership expansion has become more visible since the August 2024 financing round, when Stori announced Diego Cabrera Canay as CFO after prior finance roles at dLocal and MercadoLibre. Governance visibility, however, still trails operating scale. Publicly retained sources do not provide a full current board roster, committee map, or voting-rights breakdown. The company is clearly past the stage of an informal startup, but outside investors still need a direct governance package to understand control concentration,
    succession resilience, and the exact relationship between the operating SOFIPO and the broader holding structure.
  claimRefs:
