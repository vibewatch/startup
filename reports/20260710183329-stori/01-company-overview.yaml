- id: funding-history-and-capital-formation
  title: Funding history, investor base, and capital formation
  body: 'Stori’s funding history is one of the strongest parts of its public file, but it is not perfectly tidy. The company’s own current “we are Stori” page says more than US$400 million has been invested in Stori. Yet the retained financing announcements point to a higher disclosed round-by-round sum: US$200 million in November 2021, US$150 million in July 2022, and US$212 million in August 2024. Taken literally, those three rounds alone add to roughly US$562 million of equity-and-debt commitments, implying the homepage figure is stale, rounded, or using a narrower definition. That discrepancy is important because it shows why investors should trust dated financing releases more than simplified site banners. What is not in doubt is sponsor quality. The 2021 and 2022 rounds named GGV, GIC, BAI, Lightspeed, General Catalyst, Goodwater, and Tresalia, while the 2024 round added Notable Capital, ACE Redpoint Ventures, Goldman Sachs, and Davidson Kempner. Bloomberg Línea also reported that
    the 2024 round came at a valuation above the 2022 unicorn round, even though the exact new mark was not disclosed.'
  claimRefs:
