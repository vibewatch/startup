company:
  name: Stori
chapter:
  number: 1
  title: Company Overview
  summary: Stori is a Mexico City-based consumer-finance fintech that has expanded from an accessible credit card into a broader app spanning deposits, investments, loans, and merchant acceptance. Public evidence strongly supports real scale and repeated access to capital, but the record is still uneven on current governance depth, exact cumulative funding, and the extent of operations outside Mexico.
sections:
- id: identity-product-and-footprint
  title: Identity, product scope, and footprint
  body: Stori’s public positioning is no longer just a single starter credit card. Its current owned pages present a consumer-finance app built around no-annual-fee credit cards, deposit accounts, fixed-term investments, personal loans, and a phone-based merchant acceptance product called Stori Tap. That product breadth matters because it shifts the diligence baseline from “credit-card startup” to “regulated digital-finance platform” operating through a Mexican SOFIPO structure. The most current owned credit-card page says more than 5 million Mexicans already “live their own Stori,” while the home and credit pages keep emphasizing a 99% approval-rate message, no-annual-fee positioning, and progressively higher credit lines. Stori’s headquarters are consistently placed in Mexico City, and LinkedIn still shows an additional Arlington, Virginia location. Public sources do not verify current live operations in Brazil or Peru, so the evidence-backed footprint in this report remains Mexico-centered
    with broader Latin American ambition rather than confirmed multi-country operating scale.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
