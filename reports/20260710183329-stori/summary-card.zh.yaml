  topStrengths:
    - 目标市场是大体量、服务不足的人群，公开证据显示它已有全国性真实客户规模，而不是试点阶段牵引。
    - 公开产品宽度已经越过信用卡，延伸到储蓄、贷款、汇款、合作伙伴渠道和商户工具。
    - 经审计的 2025 年和 2026 年 Q1 文件，给出私营消费金融创业公司少见的主体层面盈利证据。
    - 2024 年融资和持续拿到债务加股权资金，说明投资者兴趣仍在，也给公司留下战略融资弹性。
  topRisks:
    - 薄信用档案贷款一旦信用质量恶化，可能很快压过当前盈利叙事。
    - 客户耐久性仍缺少分母：公开 cohort、留存曲线和入金账户行为都未披露。
    - 在保护上限低于银行的 SOFIPO 架构下，存款信任和服务质量风险仍然重要。
    - 合作伙伴和渠道扩张能放宽漏斗；但如果分渠道 CAC 和留存偏弱，也会遮住经济质量。
    - 更大生态和资本更厚的挑战者仍在竞争，护城河耐久性因此不确定。
  unresolvedGaps:
    - 2024 年融资后的最新私募市场估值标记或老股价格发现。
    - 信用卡、储蓄和合作伙伴渠道用户的 cohort 留存、激活和多产品附着。
    - vintage 损失曲线、拨备方法和当前风险质量趋势数据。
    - 超出保护上限的存款余额行为，以及信任 / 投诉趋势。
    - 合作伙伴渠道集中度、CAC，以及续约或终止经济性。
