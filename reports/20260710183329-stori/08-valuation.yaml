  claims:
    - {id: CV001, statement: 'The most defensible current recommendation from public evidence is watch rather than invest or pass.', type: inferred, topic: recommendation, sourceRefs: [SV001, SV002, SV005, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV002, QV025]}
    - {id: CV002, statement: 'The recommendation is not pass because Stori has real scale product breadth and public profitability proof.', type: inferred, topic: recommendation, sourceRefs: [SV003, SV005, SV006, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV002]}
    - {id: CV003, statement: 'The recommendation is not invest because public evidence still lacks new private marks standardized cohorts and full risk-adjusted economics.', type: inferred, topic: recommendation, sourceRefs: [SV005, SV006, SV007, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV003]}
    - {id: CV004, statement: 'Entity-level profitability is visible in Stori’s 2025 and March 2026 public filings.', type: observed, topic: economics-proof, sourceRefs: [SV005, SV006], confidence: medium, freshness: recent, answersQuestionRefs: [QV015]}
    - {id: CV005, statement: 'The retained source set therefore supports engagement but not high-confidence conviction.', type: inferred, topic: recommendation, sourceRefs: [SV001, SV005, SV007, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV003, QV025]}
    - {id: CV006, statement: 'The core thesis is that a large underserved market and a real multi-product platform can still create substantial value if economics compound cleanly.', type: inferred, topic: thesis, sourceRefs: [SV017, SV020, SV022, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV004]}
    - {id: CV007, statement: 'The anti-thesis is that visible profitability and breadth may not prove durable value if credit quality or trust deteriorate.', type: inferred, topic: anti-thesis, sourceRefs: [SV007, SV021, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV005]}
    - {id: CV008, statement: 'Competitive intensity means Stori must prove durable economics rather than rely on market-need storytelling alone.', type: inferred, topic: anti-thesis, sourceRefs: [SV015, SV016, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV023]}
    - {id: CV009, statement: 'Deposits loans and partner-led flows can improve share of wallet only if they improve retention and margin, not just complexity.', type: inferred, topic: thesis, sourceRefs: [SV018, SV023, SV024, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV004, QV023]}
    - {id: CV010, statement: 'The public evidence still leaves confidence at medium because major IC questions depend on management-only data.', type: inferred, topic: confidence, sourceRefs: [SV005, SV006, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV003]}
    - {id: CV011, statement: 'Bloomberg Línea and Reuters describe the 2024 financing as roughly a $1.32 billion post-money valuation anchor.', type: third-party-reported, topic: valuation-anchor, sourceRefs: [SV001, SV002], confidence: medium, freshness: recent, answersQuestionRefs: [QV001, QV006]}
    - {id: CV012, statement: 'The 2022 Stori round was announced at a $1.2 billion valuation, providing a prior unicorn anchor.', type: company-claimed, topic: valuation-anchor, sourceRefs: [SV004, SV027], confidence: medium, freshness: historical, answersQuestionRefs: [QV001, QV006]}
    - {id: CV013, statement: 'This means public evidence shows only a modest step-up between the 2022 and 2024 valuation anchors.', type: inferred, topic: valuation-anchor, sourceRefs: [SV011, SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV006]}
    - {id: CV014, statement: 'The bull case requires durable profitability plus continued growth in users deposits and product adoption.', type: inferred, topic: scenarios, sourceRefs: [SV005, SV006, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV007, QV017]}
    - {id: CV015, statement: 'The bear case is driven mainly by credit-quality deterioration trust stress or operating-control slippage.', type: inferred, topic: scenarios, sourceRefs: [SV007, SV021, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV008, QV024]}
    - {id: CV016, statement: 'A scenario-based valuation range is more defensible than a precise intrinsic-value model from public data alone.', type: inferred, topic: scenarios, sourceRefs: [SV001, SV005, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV016]}
    - {id: CV017, statement: 'Profitability durability is one of the most important valuation sensitivities because Stori’s model is balance-sheet and trust dependent.', type: inferred, topic: sensitivity, sourceRefs: [SV005, SV006, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV017, QV027]}
    - {id: CV018, statement: 'Deposit trust and partner economics matter almost as much because they determine whether growth improves or weakens funding quality.', type: inferred, topic: sensitivity, sourceRefs: [SV018, SV021, SV024, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV017, QV027]}
    - {id: CV019, statement: 'Without newer public marks after 2024 investors should treat the last disclosed round as the cleanest price reference point.', type: inferred, topic: scenarios, sourceRefs: [SV001, SV002, SV004], confidence: medium, freshness: current, answersQuestionRefs: [QV021]}
    - {id: CV020, statement: 'The public valuation range in this chapter is therefore anchored around but not identical to the 2024 unicorn valuation.', type: estimated, topic: scenarios, sourceRefs: [SV011, SV012, SV016, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV016]}
    - {id: CV021, statement: 'Nu Holdings had a public market capitalization of about $66.78 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV008], confidence: medium, freshness: recent, answersQuestionRefs: [QV009, QV010]}
    - {id: CV022, statement: 'SoFi had a public market capitalization of about $24.07 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV009], confidence: medium, freshness: recent, answersQuestionRefs: [QV009, QV011]}
    - {id: CV023, statement: 'Capital One had a public market capitalization of about $124.47 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV010], confidence: medium, freshness: recent, answersQuestionRefs: [QV009, QV012]}
    - {id: CV024, statement: 'MercadoLibre had a public market capitalization of about $94.64 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV011], confidence: medium, freshness: recent, answersQuestionRefs: [QV009, QV013]}
    - {id: CV025, statement: 'Upstart had a public market capitalization of about $3.12 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV012], confidence: medium, freshness: recent, answersQuestionRefs: [QV009, QV014]}
    - {id: CV026, statement: 'TransUnion had a public market capitalization of about $14.43 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV013], confidence: medium, freshness: recent, answersQuestionRefs: [QV014]}
    - {id: CV027, statement: 'Intuit had a public market capitalization of about $75.01 billion as of July 2026 in the retained source set.', type: third-party-reported, topic: comps, sourceRefs: [SV014], confidence: medium, freshness: recent, answersQuestionRefs: [QV014]}
    - {id: CV028, statement: 'Nu and SoFi are directionally useful fintech platform comparables, but their scale geography and disclosure profiles differ materially from Stori.', type: inferred, topic: comps, sourceRefs: [SV008, SV009, SV015], confidence: medium, freshness: current, answersQuestionRefs: [QV010, QV011, QV029]}
    - {id: CV029, statement: 'Capital One is best treated as a maturity benchmark rather than a direct multiple comp for Stori.', type: inferred, topic: comps, sourceRefs: [SV010], confidence: medium, freshness: current, answersQuestionRefs: [QV012, QV029]}
    - {id: CV030, statement: 'Public comps imply that scale alone does not command premium value without durable economics or trusted funding quality.', type: inferred, topic: comps, sourceRefs: [SV008, SV009, SV010, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV014, QV029]}
    - {id: CV031, statement: 'The thesis breaks if profitability weakens while credit or reserve stress rises.', type: inferred, topic: thesis-breakers, sourceRefs: [SV005, SV006, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV019]}
    - {id: CV032, statement: 'The thesis also breaks if complaint or trust signals suggest deposits and cross-sell are growing faster than control quality.', type: inferred, topic: thesis-breakers, sourceRefs: [SV021, SV023, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV024]}
    - {id: CV033, statement: 'Partner dependence without measured economics is a valuation discount rather than a premium.', type: inferred, topic: thesis-breakers, sourceRefs: [SV018, SV024, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV019]}
    - {id: CV034, statement: 'A material adverse regulatory or control event would likely act as a hard kill-switch for the funding case.', type: inferred, topic: thesis-breakers, sourceRefs: [SV023, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV024]}
    - {id: CV035, statement: 'Competitive compression from larger ecosystems or better-capitalized rivals would reduce willingness to fund above a fair anchor.', type: inferred, topic: thesis-breakers, sourceRefs: [SV015, SV016, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV019]}
    - {id: CV036, statement: 'The most valuable remaining diligence ask is an updated private-market mark after the 2024 round.', type: open-question, topic: diligence-asks, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QV020, QV021]}
    - {id: CV037, statement: 'The next most important diligence ask is product-cohort retention and payback rather than another high-level user-count update.', type: open-question, topic: diligence-asks, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QV020, QV026, QV030]}
    - {id: CV038, statement: 'Vintage loss curves and reserve methodology are necessary to know whether current profitability is durable.', type: open-question, topic: diligence-asks, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QV020, QV027]}
    - {id: CV039, statement: 'Deposit-balance behavior above covered limits and partner-channel economics are necessary to refine valuation stance further.', type: open-question, topic: diligence-asks, sourceRefs: [], confidence: medium, freshness: current, answersQuestionRefs: [QV020, QV024, QV030]}
    - {id: CV040, statement: 'The evidence-based overall valuation verdict is watch / fair with medium confidence pending proof that profitability and trust are durable enough to justify a premium to the 2024 anchor.', type: inferred, topic: verdict, sourceRefs: [SV001, SV005, SV007, SV021, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV025, QV030]}
  evidenceGaps:
    - {type: private-evidence-only, severity: material, topic: updated-private-mark, missingEvidence: 'Any post-2024 primary or secondary price discovery for Stori equity.', whyItMatters: 'Without newer marks the last disclosed round remains the dominant anchor.', diligencePath: 'Request cap table updates and recent transaction history.', relatedQuestionRefs: [QV021], relatedTableRefs: [TV006]}
    - {type: missing-source, severity: material, topic: comparable-valuation-table-TV004-coverage, missingEvidence: 'Public revenue, net take-rate, or contribution-margin data sufficient for multiple-based valuation and cleaner peer normalization.', whyItMatters: 'A more precise valuation method depends on revenue and margin disclosure.', diligencePath: 'Request revenue bridge and product-level contribution margins.', relatedQuestionRefs: [QV022], relatedTableRefs: [TV003, TV004]}
    - {type: private-evidence-only, severity: material, topic: cohort-economics, missingEvidence: 'Retention activation payback and cross-sell economics by cohort.', whyItMatters: 'These metrics determine whether user growth actually compounds enterprise value.', diligencePath: 'Request cohort dashboards and finance-model support.', relatedQuestionRefs: [QV026, QV030], relatedTableRefs: [TV006]}
    - {type: missing-source, severity: material, topic: partner-economics, missingEvidence: 'Channel-level CAC, renewal, and profitability for partner-led acquisition or remittance flows.', whyItMatters: 'Partner breadth can widen the funnel while reducing economic quality.', diligencePath: 'Request channel P&Ls and major contract terms.', relatedQuestionRefs: [QV024], relatedTableRefs: [TV006]}
    - {type: private-evidence-only, severity: material, topic: regulatory-downside, missingEvidence: 'Current examination, remediation, or control findings relevant to valuation downside.', whyItMatters: 'A hidden control issue can overwhelm public growth proof quickly.', diligencePath: 'Request compliance and regulator-update materials.', relatedQuestionRefs: [QV024], relatedTableRefs: [TV005]}
