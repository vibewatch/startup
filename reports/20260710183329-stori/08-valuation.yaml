schemaVersion: report-v2
artifact: valuation
slug: stori
runDate: '2026-07-10'
company:
  name: Stori
chapter:
  number: 8
  title: Valuation
  summary: >-
    The retained public evidence supports a real late-stage fintech with significant customer scale, a documented 2024 unicorn-round valuation anchor, and newly visible entity-level profitability. It does not yet support a high-confidence “cheap” or “must-pass” call, so the most defensible stance is watch / fair: Stori looks fundable on proof and market need, but valuation upside now depends on whether profitability, funding quality, and customer trust remain durable as the product stack broadens.
sections:
  - id: recommendation-and-core-logic
    title: Recommendation, confidence, and core logic
    body: >-
      The current recommendation is watch with medium confidence.       The company has enough proof to avoid a pass: it serves a large underserved market, raised a substantial 2024 round at unicorn valuation, disclosed meaningful user scale, and now shows entity-level profitability in public filings. But the same evidence does not justify a high-conviction invest recommendation from public data alone today.       The missing elements are standardized private-market marks after the 2024 round, detailed cohort economics, customer-retention evidence, clean risk-adjusted margin visibility, and better clarity on how partner-led and deposit-led expansion affect durable long-run returns.       In other words, the question is no longer whether Stori has built a real company; clearly, it has. The question is whether the next leg of value creation will be driven by compounding economics rather than simply by more balance-sheet deployment and broader product breadth.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001, FV004]
  - id: round-anchor-scenarios-and-range
    title: Private round anchor, bull / base / bear scenarios, and valuation range
    body: >-
      Public valuation work must start from the last clean private anchor rather than from an invented discounted-cash-flow model. Bloomberg Línea and Reuters describe the 2024 financing as $212 million of equity and debt at roughly $1.32 billion post-money valuation, following an earlier 2022 round around $1.2 billion. That means public evidence supports only a modest step-up between 2022 and 2024 despite material product broadening and scale gains. The right scenario framework therefore asks what has to happen next for the valuation to compound: in the bull case, Stori would keep scaling users, deposits, and profits while proving partner and risk discipline; in the base case, it would remain a solid but still-risky Mexico-focused consumer-finance platform; in the bear case, credit losses or funding stress would turn current proof into a flat or down-round outcome. Because public data on revenue, net take rate, and cohort payback remain incomplete, the valuation range in this chapter is scenario-based rather than formula-driven.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020]
    tableRefs: [TV003]
    figureRefs: [FV002, FV003]
  - id: comparable-valuation-logic
    title: Comparable valuation logic and why public comps are only partly comparable
    body: >-
      Public listed comparables help frame valuation, but they do not produce a clean one-for-one answer for Stori. Nu and SoFi are the closest public fintech comparables in broad consumer-finance ambition, though their geographies, disclosures, and scale differ. Capital One is useful as a mature credit-card and deposit institution benchmark, but far too large and established to act as a direct valuation comp. MercadoLibre matters because Mercado Pago shows how embedded-finance ecosystems can command large value when finance sits inside a broader distribution machine. Upstart, TransUnion, and Intuit provide additional context on what public markets pay for fintech software, consumer-finance infrastructure, or financial-data businesses, but each differs materially from Stori’s balance-sheet-heavy Mexican retail-finance profile. The practical use of comps here is therefore directional: they show that public markets reward scale, trusted deposits, and durable profitability more than headline user growth alone.       That cuts both ways for Stori, whose private valuation story is strong but still exposed to risk-quality and trust questions today.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030]
    tableRefs: [TV004]
    figureRefs: []
  - id: thesis-breakers-and-final-diligence-asks
    title: Thesis-breakers, kill triggers, and final diligence asks
    body: >-
      The thesis breaks if the evidence stops moving from “growth with promise” toward “growth with durable economics and trust.” That means the final diligence burden is clear. Management needs to show whether public profitability is repeatable across the cycle, whether deposit and product expansion improve customer lifetime value rather than merely increasing operational complexity, and whether the company can defend itself against larger ecosystems and better-capitalized competitors without stretching credit quality.       The final asks are therefore intentionally focused on proof, not marketing: updated private-mark data, loss and reserve curves, deposit behavior above covered limits, retention and repeat-usage cohorts, partner economics, and current regulatory interaction history. Without those answers, public evidence supports a fair valuation stance but not a decisive bargain call today. With strong answers, Stori could justify a more aggressive recommendation because the business already has enough scale and market need to matter.
    claimRefs: [CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
    tableRefs: [TV005, TV006]
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Recommendation, Confidence, Risk rating, Valuation stance, Decision implication]
    rows:
      - [Watch, Medium, Elevated but manageable, Fair, Continue diligence and require proof of durable economics before upgrading to invest]
    notes: This recommendation is based on retained public evidence only and should be treated as a diligence-stage view rather than a final IC vote.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, What would change the view]
    rows:
      - ['Large underserved market plus real product breadth and public profitability proof support staying engaged.', 'Downgrade if profitability fades, complaints rise, or credit costs widen materially.']
      - ['2024 unicorn valuation anchor looks credible given scale and capital access.', 'Upgrade only if new private marks and current operating metrics show genuine compounding beyond the 2024 anchor.']
      - ['Deposits, loans, Tap, and remittance-linked flows could deepen wallet share.', 'Downgrade if these adjacencies add complexity without measurable retention or margin benefit.']
      - ['Competition does not erase Stori’s relevance because underserved-user fit is real.', 'Downgrade if larger ecosystems capture the same users more cheaply or with stronger trust.']
    notes: >-
      The anti-thesis is intentionally practical: what evidence would actually change the recommendation rather than merely create debate.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, Profits compound while user and deposit growth remain healthy and risk quality stays controlled, Private mark moves materially above 2024 anchor on proven durable earnings and funding quality, Credit or control stress does not emerge, Low-Medium]
      - [Base, Stori remains a growing Mexico-focused consumer-finance platform with mixed but improving economics, Valuation stays around or moderately above the 2024 anchor as evidence de-risks gradually, Competition and trust keep the market from paying a premium, Medium]
      - [Bear, Credit losses support strain or funding/trust concerns overwhelm product-breadth gains, Round or secondary value flattens or resets below the 2024 anchor, Operating complexity and risk quality dominate the narrative, Medium]
    notes: Because public revenue and unit-economics data are incomplete, scenarios are logic-based and anchored to the last clean private valuation rather than to a claimed intrinsic value model.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020]
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: Public comps are sampled to bracket digital-consumer-finance, card-led lending, and ecosystem-finance business models that investors may use heuristically when framing Stori.
    columns: [Comparable, Metric, Multiple / valuation / status, Relevance, Limitation]
    rows:
      - [Nu Holdings, Public market cap, '$66.78B as of July 2026', Closest large LatAm digital-consumer-finance comp, Much larger scale and public-market liquidity]
      - [SoFi, Public market cap, '$24.07B as of July 2026', Consumer-finance platform comp with deposits and lending, US market structure differs materially]
      - [Capital One, Public market cap, '$124.47B as of July 2026', Mature credit-card and deposit benchmark, Too large and mature for direct multiple transfer]
      - [MercadoLibre, Public market cap, '$94.64B as of July 2026', Embedded-finance ecosystem benchmark through Mercado Pago, Commerce-led business model is broader than Stori]
      - [Upstart, Public market cap, '$3.12B as of July 2026', Alternative credit-tech comparator, More software / marketplace oriented than Stori]
      - [TransUnion, Public market cap, '$14.43B as of July 2026', Data and credit-infrastructure comparator, Not a direct consumer-balance-sheet lender]
      - [Intuit, Public market cap, '$75.01B as of July 2026', Financial-software trust benchmark, Different monetization and risk model]
    notes: These comps are directional only. Public market caps are not equivalent to private fintech value without liquidity, governance, geography, and risk adjustments.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [Trigger, Threshold, Transmission to thesis, Action implication]
    rows:
      - [Profitability reversal, Two periods of materially weaker earnings with worse credit or reserve signals, Breaks the case that Stori has crossed into durable economics, Move from watch/fair toward pass]
      - [Trust or servicing stress, Persistent complaint or operational-reliability deterioration, Weakens deposit and cross-sell thesis, Halt valuation-upside assumptions]
      - [Partner dependence without economics, Concentration rises while unit economics stay unclear, Turns breadth story into fragility story, Discount expansion narrative]
      - [Regulatory or control event, Material adverse compliance or collections issue, Damages trust and financing confidence simultaneously, Treat as hard kill-switch until remediated]
      - [Competitive compression, Larger rivals win the same users more cheaply, Reduces path to premium value creation, Lower willingness to fund above fair anchor]
    notes: Triggers are designed to convert a broad discussion into monitorable decision rules.
    claimRefs: [CV031, CV032, CV033, CV034, CV035]
  - id: TV006
    title: Final diligence asks table
    columns: [Topic, Missing evidence, Why it matters, Owner or diligence path]
    rows:
      - [Updated private mark, Post-2024 price discovery or secondary transactions, Needed to know whether fair means flat or already moving higher, Ask management and lead investors]
      - [Cohort economics, Retention activation payback and cross-sell by product cohort, Needed to separate growth from compounding, Ask management and finance]
      - [Credit quality, Vintage loss curves reserve methodology and recoveries, Needed to test whether profitability is durable, Ask risk and finance teams]
      - [Deposit trust, Balance distribution and behavior above covered limits, Needed to evaluate funding durability, Ask treasury and customer teams]
      - [Partner economics, Channel CAC and renewal / termination terms, Needed to price partner-led expansion realistically, Ask business development]
      - [Regulatory interactions, Examination or remediation history, Needed to assess downside left-tail risk, Ask compliance and legal]
    notes: These asks define the shortest path from a watch recommendation toward either invest or pass.
    claimRefs: [CV036, CV037, CV038, CV039, CV040]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation follows a chain from market need and operating proof through unresolved durability questions into a watch / fair stance.
    data:
      nodes:
        - {id: v1, label: Large underserved market and real product proof}
        - {id: v2, label: 2024 unicorn valuation anchor plus public profitability}
        - {id: v3, label: Durability questions on risk trust and cohorts remain open}
        - {id: v4, label: Watch recommendation and fair valuation stance}
      edges:
        - {from: v1, to: v2}
        - {from: v2, to: v3}
        - {from: v3, to: v4}
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The biggest drivers of upside or downside are durable profitability, credit quality, funding trust, and partner economics rather than marketing reach alone.
    data:
      items:
        - {label: Durable profitability proof, value: 5}
        - {label: Credit quality / reserve path, value: 5}
        - {label: Deposit trust and funding quality, value: 4}
        - {label: Retention and cross-sell proof, value: 4}
        - {label: Partner-channel economics, value: 3}
        - {label: Macro / competition pressure, value: 3}
    claimRefs: [CV014, CV015, CV017, CV018, CV031, CV032]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario analysis suggests a wide range around the 2024 unicorn anchor rather than a precise point estimate.
    data:
      items:
        - {label: Bear case implied value, low: 0.8, high: 1.1}
        - {label: Base case implied value, low: 1.2, high: 1.6}
        - {label: Bull case implied value, low: 1.7, high: 2.5}
    claimRefs: [CV011, CV012, CV016, CV017, CV018, CV020]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Market proof is strong, economics proof is improving, but evidence quality and risk-adjusted durability are still only medium.
    data:
      items:
        - {label: Market need, value: High, detail: Large underserved Mexican consumer-finance market remains clearly real.}
        - {label: Product and scale proof, value: High, detail: Stori has multi-product breadth and millions of users in public sources.}
        - {label: Economics proof, value: Medium, detail: Public filings now show profitability, but durability is not fully proven.}
        - {label: Moat durability, value: Medium-Low, detail: Competition is intense and many visible features are copyable.}
        - {label: Risk-adjusted valuation, value: Medium, detail: 2024 anchor looks credible, but not obviously cheap from public data.}
        - {label: Evidence quality, value: Medium, detail: Enough to support watch / fair, not enough to support high-confidence invest.}
    claimRefs: [CV007, CV008, CV021, CV031, CV039, CV040]
callouts:
  - calloutType: recommendation
    title: Watch, not pass
    body: Public evidence shows enough scale and proof to stay engaged, but not enough durable-economics visibility to justify a high-confidence invest call yet.
    claimRefs: [CV001, CV002, CV003, CV006, CV040]
  - calloutType: risk
    title: Fair can become stretched quickly if proof stalls
    body: At a unicorn-plus anchor, the next step-up depends more on repeatable profitability and trust than on another marketing milestone.
    claimRefs: [CV011, CV015, CV032, CV033, CV035]
  - calloutType: insight
    title: Public comps reward durability more than headline growth
    body: Listed comparables imply that scale matters, but public markets still punish fintechs that lack durable economics or trust-heavy funding quality.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV030]
  - calloutType: assumption
    title: The 2024 round is still the cleanest price anchor
    body: Without newer private marks, the most defensible valuation frame starts from the last disclosed round and then adjusts by scenario rather than by invented precision.
    claimRefs: [CV012, CV013, CV016, CV020]
