- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Publisher / basis
  - Geography
  - Value / signal
  - Methodology / limitation
  - Implication
  rows:
  - - Macro population lens
    - World Bank country overview
    - Mexico
    - Nearly 130 million people
    - Population is not bankable adults or Stori’s exact served segment
    - Confirms large national scale before narrowing to underserved consumers.
  - - Financial-exclusion lens
    - WhiteSight / Reuters-Condusef framing
    - Mexico
    - Over 50% of adults unbanked; only just over half use some financial product
    - Public summaries, not a single harmonized official ratio in retained pack
    - Supports a large inclusion gap for challengers to attack.
  - - Scaled-challenger proof lens
    - Nu, Klar, Spin, Legal Paradox, EL CEO
    - Mexico
    - Millions of users already acquired by digital challengers
    - User counts differ by company and definition
    - Shows that the category is already proven, not hypothetical.
  - - Stori ambition lens
    - LinkedIn / company materials
    - Latin America
    - ~400M underbanked consumers cited as addressable population
    - Broad regional ambition, not Mexico-specific served market
    - Useful for strategy framing, not for current Mexico underwriting.
  - - Ecosystem revenue lens
    - Legal Paradox / Mercado Pago context
    - Mexico fintech ecosystems
    - Large players already monetise beyond one card through payments and commerce
    - Comparable economics vary by model
    - Suggests Stori’s TAM expands as it layers products, not only users.
  notes: This chapter uses evidence-constrained sizing rather than one broad dollar TAM. The point is to triangulate demand using population, exclusion, competitor adoption, and ecosystem depth.
