  - - Incumbent and ecosystem competition
    - Negative
    - Current
    - Big players retain superior capital, physical rails, or commerce traffic
    - Request Stori customer-acquisition and retention benchmarks versus peers
  notes: 'The largest opportunities and risks in Mexico’s digital-finance market are linked: fast onboarding and high yields pull users in, but regulation, trust, and capital intensity determine who keeps them profitably.'
