- id: growth-drivers-constraints-and-market-shape
  title: Growth drivers, adoption constraints, and what market shape means for Stori
  body: 'The strongest growth drivers in this market are obvious from both Stori’s strategy and competitor behavior: mobile-first onboarding, simple documentation requirements, high-visibility savings yields, and product bundles that move beyond one card into a broader app relationship. The regulatory ladder is also a driver because it creates credible upgrade paths: WhiteSight frames Mexico’s license stack as a roadmap for phased ambition, and Legal Paradox argues that authorization depth increasingly determines monetization ceilings. But the same ladder is a constraint because regulatory status takes time and capital to scale. Competitive intensity is another constraint. EL CEO and Legal Paradox both describe a market consolidating around a few scaled winners, while incumbents and ecosystems such as Mercado Pago, Spin, and Hey Banco retain significant advantages in distribution, capital, or physical presence. Trust and credit performance remain the most company-specific constraints for
    Stori. Thin-file consumer lending can grow fast, but high APRs, reserve needs, and customer-support friction can narrow the path from top-line user growth to durable profitable share. The resulting market is large, but it is no longer “greenfield”; it is a consolidation game where execution quality and regulatory depth matter more than novelty.'
