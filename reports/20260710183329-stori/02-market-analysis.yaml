- id: sizing-lenses-and-segment-logic
  title: 'Sizing lenses: underserved adults, challenger-banking adoption, and modular ecosystem share'
  body: 'A precise TAM number is not directly published in the retained source set, so the most defensible approach is to triangulate the opportunity through multiple constrained lenses. Lens one is macro-demographic: Mexico’s nearly 130 million people and still-incomplete financial inclusion create a large pool of adults who need formal credit, deposit products, and payments rails. Lens two is competitive adoption: scaled challengers already prove that millions of Mexican users will adopt branch-light digital finance when onboarding, pricing, and trust are localized. Nu’s official site and third-party market analysis place it in the 12 to 15 million-user range in Mexico by 2025-2026, Klar says 7 million Mexicans trust it, and Spin’s physical-plus-digital footprint reaches into the tens of millions of users through OXXO distribution. Lens three is Stori’s own ambition. Historical company materials and LinkedIn describe a target market of roughly 400 million underbanked Latin American consumers,
    but the evidence-backed served market in this report remains Mexico-first. Together, these lenses imply a large addressable market, but also one where scale is already accumulating around a handful of ecosystems rather than being evenly distributed among dozens of small fintechs.'
