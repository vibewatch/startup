  - - High-yield savings offers
    - Positive
    - Current
    - Helps pull balances and app engagement
    - Request deposit stickiness after promotional periods
  - - Regulatory ladder (SOFIPO to broader license depth)
    - Mixed
    - Medium term
    - Can expand monetization but requires capital and compliance execution
    - Request roadmap, timing, and conditions for next license steps
