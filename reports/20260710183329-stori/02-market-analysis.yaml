chapter:
  number: 2
  title: Market Analysis
  summary: Stori operates in a large but fiercely contested Mexican digital-finance market defined by low formal-finance penetration, high smartphone adoption, and a regulatory ladder that rewards winners who turn credit, savings, payments, and trust into a primary financial relationship. The public evidence supports a big consumer opportunity, but also a market already consolidating around a few scaled ecosystems rather than an open field of endless challengers.
sections:
- id: market-boundary-and-why-mexico-matters
  title: Market boundary, included spend, and why Mexico is structurally attractive
  body: The relevant market for Stori is broader than “credit cards for the unbanked” but narrower than “all banking in Latin America.” In evidence-backed terms, Stori sits at the intersection of consumer credit, digital deposits, everyday payments, app-based money management, merchant acceptance for microbusinesses, and cross-border remittance receipt. Mexico is structurally attractive because it combines scale with exclusion. The World Bank describes the country as the second-largest economy in Latin America with a population of nearly 130 million, while also noting that growth, inclusion, and access to finance have underperformed peer countries. Reuters, citing Condusef, reported that just over half of the Mexican population uses some sort of financial product, and WhiteSight argues that more than half of Mexican adults remain unbanked. That gap is exactly the opening digital challengers target. For Stori, the included spend is not only revolving card balances; it also includes deposit
    balances, savings behavior, payments volume, and adjacent services that can turn an entry-level credit relationship into a broader financial operating system for individuals and small merchants.
