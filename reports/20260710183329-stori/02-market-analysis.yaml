  evidenceGaps:
  - type: missing-source
    severity: material
    topic: stori-market-share
    missingEvidence: A current verified share-of-market figure for Stori across credit cards, deposits, or active digital-finance users in Mexico.
    whyItMatters: Without share data it is hard to judge how much of the structural inclusion opportunity Stori has already captured.
    diligencePath: Request management share estimates with underlying methodology and product denominators.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: stori-cac
    missingEvidence: Customer acquisition cost and payback relative to major Mexican challenger peers.
    whyItMatters: A large market does not automatically produce durable value if user acquisition economics deteriorate.
    diligencePath: Request channel CAC, conversion, and payback data by product.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: active-user-definition
    missingEvidence: A reconciled definition of active users, funded accounts, cardholders, and cross-product users for Stori and peers.
    whyItMatters: Public user comparisons can mislead when each company uses different denominators.
    diligencePath: Request standardized KPI definitions in management materials.
    relatedQuestionRefs:
    - QM007
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: sam-som-precision
    missingEvidence: A current public bottom-up Mexico-specific SAM and SOM for underserved consumer-finance users.
    whyItMatters: The opportunity is clearly large, but the current file does not support a precise bottom-up number.
    diligencePath: Build a bottom-up model using management application funnels, approvals, funded accounts, and repeat usage.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: merchant-acceptance-scale
    missingEvidence: Active Stori Tap merchant count and processed volume.
    whyItMatters: Merchant services expand the market story only if adoption moves beyond a feature launch.
    diligencePath: Request GMV, active merchants, and merchant-retention data for Tap.
    relatedQuestionRefs:
    - QM013
    relatedTableRefs:
    - TM003
