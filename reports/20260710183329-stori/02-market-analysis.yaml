tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or activity
  - Excluded spend
  - Buyer / payer
  - Why it matters for Stori
  rows:
  - - Consumer credit cards and revolving credit
    - Card spend, interest-bearing balances, fees, and credit-building relationships
    - Large corporate card programs or affluent-only premium banking
    - Individual consumer
    - This is Stori’s historic entry wedge and still the main acquisition surface.
  - - Digital deposits and savings
    - Demand deposits, time deposits, savings buckets, and yield-seeking balances
    - Traditional branch savings not linked to app-led acquisition
    - Individual consumer
    - Deposits improve retention and lower dependence on pure external funding.
  - - Everyday money movement
    - Bill pay, top-ups, transfers, and app-based financial management
    - Wholesale treasury services and enterprise cash management
    - Individual consumer
    - These behaviors increase app frequency and make the relationship stickier.
  - - Merchant acceptance for microbusinesses
    - Tap-based card acceptance and settlement into a Stori account
    - Large enterprise acquiring and hardware-heavy POS estates
    - Merchant
    - This broadens TAM beyond household finance into micromerchant tools.
  - - Remittance-linked financial activity
    - Inbound remittance receipt and balances that can stay within Stori products
    - Full remittance-origination economics in the United States
    - Sender abroad and receiver in Mexico
    - This adds a meaningful adjacency for cash inflow and deposit capture.
  notes: The table defines the market in workflow terms rather than by legal entity type. It excludes corporate banking and wholesale lending because the retained evidence ties Stori to mass consumer and micromerchant finance instead.
