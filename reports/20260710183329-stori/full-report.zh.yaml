      - 公开价格 / 利率
      - 标价 vs 实际
      - 含义
      - 来源 / 缺口
    rows:
      - - Stori Clásica 信用卡
        - 当前信用卡页面显示加权 CAT 164.9%；产品成本表显示部分卡种为 158.3% 或更高
        - 仅类似标价披露
        - 高收益客群经济模型可能有吸引力，但会压迫客户承受能力
        - 需要按用户批次划分的实际 APR 和循环借款行为
      - - Stori Green 信用卡
        - 成本表显示加权 CAT 204.6%
        - 标价披露
        - 暗示部分产品层级承保风险极高、收益率也极高
        - 需要按变体拆分的产品组合和逾期情况
      - - Stori Black
        - 1% 返现，无年费；成本表披露加权 CAT 184.1%
        - 价目表披露
        - 奖励卖点和高底层借款成本并存
        - 需要按层级拆分激活、消费和循环信贷比例
      - - Cuenta+ 活期存款
        - 无开户费或管理费；宣传册显示基础账户 GAT 为 0%，促销储蓄桶显示更高收益
        - 公开价目条款
        - 有助于获客和筹资，但利息成本必须看清
        - 需要资金成本和平均余额
      - - Inversión+ 定期产品
        - 当前页面宣传最高约 8.2%；宣传册给出 7.0% GAT 促销示例，部分营销材料还提到 15%
        - 仅有公开价目条款
        - 有利于余额增长，但若资产收益率匹配不上，可能压缩利差
        - 需要期限结构、续存率和利差经济性
      - - Stori Tap
        - 每笔成功交易 2.8% + IVA
        - 价目表披露
        - 提供可见的商户手续费收入，且无硬件租金
        - 需要商户获客成本和活跃商户数
    notes: Stori 是私人金融科技公司，定价图景公开度异常高，但这些仍是价目表价格。公开材料没有披露实际成交价格、信用损失或客户层面的产品组合。
