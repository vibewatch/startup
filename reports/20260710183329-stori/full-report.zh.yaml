        - 信用卡、借记账户、储蓄罐、账单支付
        - Cuenta Nu 营销中最高 13%
        - 促销持续性和用户批次经济模型未完全公开
        - 储蓄牵引的获客和留存引擎强
      - - Klar
        - 自有页面强调账户免费
        - 账户、卡、投资、转账、账单支付
        - 高标题收益率和投资模块
        - 公开价格细节会随时间变化
        - 宽资金管理组合看起来直接构成竞争
      - - Mercado Pago
        - 钱包和支付牵引的组合
        - 支付、转账、商家工具、信贷、带息余额
        - 官方信息称年收益率最高 12%
        - 仅看墨西哥，生态交叉补贴并不透明
        - 对已经在 MELI 生态交易的用户，组合很强
      - - RappiCard
        - 信用卡主打无年费
        - Rappi 生态内信用卡
        - 便利性来自 Rappi 生态，而不是宽银行套件
        - 保留来源中，卡以外的深度有限
        - 对卡优先获客用户，是有效替代品
      - - Hey Banco / BBVA
        - 银行背书的卡和账户组合
        - 卡、账户、支付、储蓄、更广银行基础网络
        - 收益率或忠诚度钩子因产品而异
        - 未针对 Stori 同一薄信用档案客群优化
        - 传统机构最强竞争点是信任，而不是新鲜感
    notes: 竞争定价主要由低摩擦入口和可见收益率主导，而不是复杂长期合同；这降低了消费者转换成本。
