      - number: '7.3'
        title: 合作伙伴、平台和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Stori 可见的增长策略依赖一张外部平台和伙伴网络。应用商店仍是关键获客和服务渠道。卡组织与支付轨道关系到核心产品可信度。与 SHEIN、Atlas、Farmacias Similares
              的联名和分层页面显示，伙伴包装已经进入获客打法。Félix 又加入一条与汇款挂钩的流程，既依赖伙伴执行，也依赖 Stori
              自身账户体验。这在战略上有价值：不用所有能力都自建，也能扩大漏斗；但它也带来集中度和接口风险。伙伴表现不佳、改变条款或在用户交接上体验差，即使 Stori 内部产品团队执行到位，也会伤害 Stori
              的客户体验。催收触达、第三方服务流程和分发平台同理：即使某段流程由另一方掌握，品牌影响仍由公司承担。尽调的关键问题是伙伴集中度、终止权、API 和服务水平依赖，以及渠道经济性是否足以抵消额外复杂度。
