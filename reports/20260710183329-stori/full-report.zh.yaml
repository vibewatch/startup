        title: 客户分层、买方、用户和关键任务场景
        blocks:
          - type: paragraph
            body: >-
              Stori 的客户基础本质上由消费者驱动。核心买方、用户和付款方是同一个人：一个寻求首次或二次机会正规信用、简单应用储蓄或低摩擦资金管理的墨西哥消费者。最重要的支持证据在公司和第三方来源中一致：Stori
              自有页面强调无需重度征信局摩擦即可获批，Reuters 和 Bloomberg 围绕服务不足消费者定位公司，LinkedIn
              仍把更广使命描述为服务数亿拉丁美洲低银行覆盖人群。公开产品扩张在这个核心之上创造了次级分层。Cuenta+ 引入储户和余额管理用户。Félix 引入汇款挂钩收款人，以及影响目的地选择的汇款人。Tap
              引入微型商户作为用户和付费方。与 SHEIN、Atlas 和 Farmacias Similares 的联名卡意味着通过亲和力或伙伴社群获客，而不只是通用卡漏斗。关键客户洞察是，Stori
              不再服务单一的“未被银行覆盖借款人”分层；它正在搭建一个分层的服务不足资金用户基础，用户从不同入口进入同一应用生态。
