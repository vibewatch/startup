      - number: '2.3'
        title: 买方、用户和付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              Stori
              的核心用户是个人消费者，同时也是申请人、使用者和经济付款方。这不同于企业金融科技或薪资软件，后者的预算负责人是别人。入口产品通常是信用卡或存款账户，两者都为征信薄或服务不足消费者解决即时准入和信任问题。Stori
              扩张后，第二类人群出现了：使用 Stori Tap 的微型和小型商户，商户成为用户和付费方，终端客户则是交易对手方。第三个相邻人群是使用汇款走廊的家庭，美国汇款人通过 Félix Pago 发起价值，墨西哥的
              Stori 账户持有人成为收款用户。竞争对手证据显示，墨西哥的采用路径越来越基于生态，而不是基于单一产品。Nu 本地化储蓄和提现通道，Mercado Pago 从商业和支付交叉销售，Spin
              借力实体便利店，传统银行支持的 Hey Banco 营销完整数字银行组合。因此，Stori 的挑战不只是获取首次信用用户，而是成为他们在第一个产品解锁后仍愿意保留的可信日常资金应用。
