      - number: '8.4'
        title: 论点破裂点、否决触发项和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              如果证据不再从“有前景的增长”推进到“有可持续经济性和信任的增长”，投资论点就会破裂。这也让最终尽调负担非常清楚。管理层需要证明：公开盈利是否可跨周期重复，存款和产品扩张是否改善客户终身价值而不只是增加运营复杂度，公司能否在不拉伸信用质量的情况下防御更大生态和资本更厚的竞争者。最终要索取的材料因此刻意聚焦证据而非营销：更新后的私募估值标记数据、损失和准备金曲线、保障限额以上的存款行为、留存和重复使用
              分群、伙伴经济性，以及当前监管互动历史。没有这些答案，公开证据支持“公允”估值立场，但今天还不能得出明确便宜的结论。若答案很强，Stori
              可以支撑更积极的建议，因为这家公司已经有足够规模和市场需求，值得认真看待。
            claimRefs:
