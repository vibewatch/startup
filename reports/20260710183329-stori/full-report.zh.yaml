      - number: '8.3'
        title: 可比估值逻辑，以及为什么上市可比公司只能部分可比
        blocks:
          - type: paragraph
            body: >-
              上市可比公司有助于框定估值，但无法给 Stori 一一对应的干净答案。Nu 和 SoFi 在广义消费金融抱负上是最接近的上市金融科技可比对象，但地域、披露和规模都不同。Capital One
              可作为成熟信用卡和存款机构基准，但体量太大、成熟度太高，不能直接充当估值可比。MercadoLibre 很重要，因为 Mercado Pago
              证明，金融嵌入更广分发机器时，嵌入式金融生态可以获得很高估值。Upstart、TransUnion 和 Intuit 则补充说明公开市场如何给金融科技软件、消费金融基础设施或金融数据业务定价，但每一家都与
              Stori 偏重资产负债表的墨西哥零售金融画像有实质差异。因此，这里使用可比公司的方式是方向性的：它们说明，公开市场奖励规模、可信存款和可持续盈利，力度超过单纯的用户规模增长。对 Stori
              而言，这把刀有两面：它的私募估值故事很强，但今天仍暴露在风险质量和信任问题之下。
