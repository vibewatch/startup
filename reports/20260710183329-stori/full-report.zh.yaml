companyProfile:
  summary: >-
    Stori 是一家总部位于墨西哥城的金融科技公司，核心命题是扩大服务不足消费者的金融可得性。公司最初从入门信用卡切入，如今已扩展为更宽的零售金融平台，覆盖信用卡、储蓄和存款产品、贷款、与汇款挂钩的账户流程，以及通过 Tap
    提供的商户收单。公开来源已经支持其真实客户规模和实体层面盈利，但在留存、资金质量、渠道经济性和长期护城河耐久性上仍留下重大尽调问题。
