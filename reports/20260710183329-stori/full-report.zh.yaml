      - number: '4.4'
        title: 财务判断和尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务判断是混合的，但在更深尽调后具备投资可能。正面看，Stori 的受监管子公司拥有有意义的资产负债表、经审计报表、扩张中的存款、增长中的净贷款，以及 Q1 2026 净利润 MXN 59.1
              million。这些都是实质信号，说明业务比只发布虚荣指标的典型私营金融科技公司更成熟。负面看，公开记录仍对经济质量留下太多模糊。经审计的 2025
              年利润依赖递延税项收益，而经营结果仍为负。公开来源也没有披露整个 Stori
              集团的合并收入、产品级毛利率、按分群的逾期、CAC、回收期、烧钱或债务契约余量。评测来源和法律手册还增加了重要的客户层面提醒：Stori 卡可能背负很高
              CAT，部分变体还包括开卡费，这有助于变现高风险客群，但也提高了对催收、声誉和监管审查的敏感度。因此，正确的尽调方式应像贷方而不是应用：先看准备金方法、按放款批次的贷款表现、资金期限、存款粘性和正常化经营盈利，再去承销任何增长倍数故事。
