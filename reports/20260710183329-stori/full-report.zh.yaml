  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和墨西哥结构性吸引力
        blocks:
          - type: paragraph
            body: >-
              Stori 面向的市场比“面向未被银行服务人群的信用卡”更宽，但比“拉丁美洲所有银行业务”更窄。按证据可支撑的口径，Stori
              位于消费信贷、数字存款、日常支付、基于应用的资金管理、微型企业商户收单和跨境汇款接收的交汇处。墨西哥有结构性吸引力，因为它同时具备规模和排斥。World Bank 将该国描述为拉丁美洲第二大经济体，人口接近
              130 million，同时指出其增长、包容和金融可得性落后于同类国家。Reuters 援引 Condusef 报道称，略高于一半的墨西哥人口使用某种金融产品；WhiteSight
              则认为超过一半的墨西哥成年人仍未被银行覆盖。这道缺口正是数字挑战者瞄准的入口。Stori
              纳入的支出不只是循环信用卡余额；还包括存款余额、储蓄行为、支付量，以及能把入门信用关系扩展成个人和小商户更广金融操作系统的相邻服务。
