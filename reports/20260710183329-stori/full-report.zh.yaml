      - number: '8.2'
        title: 私募轮锚点、牛 / 基准 / 熊情景和估值区间
        blocks:
          - type: paragraph
            body: >-
              公开估值工作必须从最后一个干净的私募锚点出发，而不是凭空编一个折现现金流模型。Bloomberg Línea 和 Reuters 将 2024 年融资描述为 $212 million 股权和债务，投后估值约
              $1.32 billion；此前 2022 年一轮约 $1.2 billion。也就是说，尽管产品明显扩展、规模也上来了，公开证据只支持 2022 至 2024
              年之间温和上调。正确的情景框架因此要问：估值接下来靠什么复利增长？牛市情景下，Stori
              继续扩大用户、存款和利润，同时证明伙伴和风险纪律；基准情景下，它仍是一家扎实但风险仍高、聚焦墨西哥的消费金融平台；熊市情景下，信用损失或资金压力会把当前证明拉回持平轮甚至估值下调轮。由于营收、净抽成率和
              分群回本期的公开数据仍不完整，本章估值区间采用情景法，而不是公式驱动。
            claimRefs:
              - CV011
