    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品范围和业务足迹
        blocks:
          - type: paragraph
            body: >-
              Stori 的公开定位已经不再只是单一入门信用卡。公司当前自有页面呈现的是一款消费金融应用，围绕免年费信用卡、存款账户、定期投资、个人贷款，以及名为 Stori Tap
              的手机端商户收单产品搭建。产品广度很重要，因为尽调基线从“信用卡初创公司”变成了通过墨西哥 SOFIPO 结构运营的“受监管数字金融平台”。最新自有信用卡页面称，超过 5 million 墨西哥人已经“活出自己的
              Stori”，而首页和信用卡页面继续强调 99% 批准率、免年费定位和逐步提高的授信额度。Stori 总部一直标在墨西哥城，LinkedIn 仍显示公司在 Arlington, Virginia
              另有地点。公开来源没有验证当前在巴西或秘鲁的实际运营，因此本报告中有证据支持的足迹仍以墨西哥为中心，更多体现拉丁美洲野心，而不是已确认的多国运营规模。
