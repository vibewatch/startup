      - number: '2.2'
        title: 规模测算视角：服务不足成年人、挑战者银行采用率和模块化生态份额
        blocks:
          - type: paragraph
            body: >-
              已保留来源没有直接发布精确 TAM 数字，因此最可辩护的方法是用多个受约束视角交叉校准机会。第一层是宏观人口：墨西哥接近 130 million
              人口，金融包容仍不完整，形成大量需要正规信贷、存款产品和支付通道的成年人。第二层是竞争采用：已经成规模的挑战者证明，只要开户注册、定价和信任做了本地化，数百万墨西哥用户会采用轻网点数字金融。Nu
              官方网站和第三方市场分析把其 2025-2026 年墨西哥用户量放在 12 到 15 million 区间，Klar 称 7 million 墨西哥人信任它，Spin 的线下加数字足迹借助 OXXO
              分销触达数千万用户。第三层是 Stori 自身野心。公司历史材料和 LinkedIn 描述的目标市场约为 400 million
              拉丁美洲低银行覆盖消费者，但本报告有证据支持的服务市场仍以墨西哥优先。合在一起，这些视角说明可触达市场很大；但规模正在向少数生态聚拢，而不是平均分给几十家小金融科技公司。
