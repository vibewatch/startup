      - number: '7.4'
        title: 人员、执行和投资否决条件
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是管理层和运营团队的执行质量。Stori
              正在同时做很多事：服务欠覆盖消费者的贷款方、存款平台、商户收单工具、邻近汇款的账户目的地，以及由伙伴包装的产品公司。即便不考虑未来地域或牌照扩张，风险、合规、服务、资金、产品和工程已经产生组织复杂度。公开融资公告显示，公司在投入拓宽产品范围，但公开材料没有说明内部报告、控制或领导梯队是否按同样速度扩容。因此，投资委员会应设定清晰否决条件，而不是笼统要求“关注信用损失”。最重要触发项包括：信用质量恶化且没有足够收益补偿，投诉或服务压力上升，伙伴依赖缺少已验证经济性，以及任何迹象显示存款或客户信任的增长快过公司受监管运营纪律的提升。若这些信号同时出现，Stori
              的增长故事可能很快从杠杆变成脆弱性。
