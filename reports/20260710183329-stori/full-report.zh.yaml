            body: >-
              即便完整收入分部未披露，Stori
              的公开变现逻辑也已经可见。核心资产负债表引擎是消费信贷：卡产品、个人贷款，以及相关利息、费用和类似交换费的支付活动。负债端，公司用存款和定期储蓄产品加深客户参与，并为受监管实体提供资金。当前信用卡页面和信用成本披露显示，Stori
              通过高年化借款成本、滞纳金、部分变体的开卡费，以及取现或补卡费变现。存款宣传册和 Cuenta+ 页面展示了客户价值主张的另一面：免费开户、无维护费，以及曾以市场领先话术营销的收益率，用来把余额拉进 Stori
              生态。通过 Stori Tap 的商户收单引入第三个变现表面，披露费率为每笔成功交易 2.8% 加
              VAT。结果是一个消费金融栈，贷款几乎肯定是主导收入贡献者，存款、支付和商户收单则提升留存和钱包份额。仍然缺失的是公开的产品级收入结构，或管理层验证的从客户活动到合并收入和毛利的桥。
