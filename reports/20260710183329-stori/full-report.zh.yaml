        - 受 SOFIPO 监管的资产负债表和披露
        - 要求提供流动性压力测试和集中度报告
    notes: 执行风险高，因为 Stori 同时沿多个运营维度拓宽。
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 信贷质量
        - 逾期率或拨备趋势明显恶化，却没有匹配的收益率提升
        - 连续两个期间恶化，且看不到纠偏证据
        - 重新审视投资假设；追加资本前要求更严格的损失控制
      - - 存款信任
        - 围绕保障上限的投诉或客户误解证据增加
        - 投诉持续集中，或引发监管关注
        - 暂停乐观资金假设，要求提出信任修复计划
      - - 运营可靠性
        - App / 服务事故或支持积压反复出现
        - 事故反复且解决缓慢
        - 下调对多产品扩张叙事的信心
      - - 伙伴依赖
        - 某个伙伴或渠道变得关键，但经济性未被验证
        - 集中度高，退出灵活性弱
        - 折价看待渠道驱动增长，并要求应急方案
      - - 控制环境
        - 合同、服务或催收环节出现任何合规失守迹象
        - 正式不利行动，或重大内控疏漏
        - 在完成补救前视为否决开关
    notes: 这些否决标准把宽泛风险清单变成可监测的投资纪律。
    claimRefs:
      - CR033
      - CR034
      - CR035
  - id: TV001
    title: 推荐摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 观望
        - 中
        - 偏高但可控
        - 公允
        - 继续尽调；在上调至投资前，要求证明经济性可持续
    notes: 该建议仅基于保留下来的公开证据，应视为尽调阶段观点，而不是最终 IC 投票。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 未被充分服务的市场足够大，产品宽度真实，也有公开盈利证据，支持继续跟进。
        - 如果盈利走弱、投诉上升或信贷成本明显扩大，则下调判断。
      - - 结合规模和融资渠道，2024 年独角兽估值锚点看起来可信。
        - 只有新的私募估值标记和当前运营指标显示公司确实在 2024 年锚点之上复合增长，才上调判断。
      - - 存款、贷款、Tap 和汇款联动流程可能提高钱包份额。
        - 如果这些相邻业务只增加复杂度，却没有可衡量的留存或利润率收益，则下调判断。
      - - 竞争不会让 Stori 失去意义，因为它确实贴合未被充分服务的用户。
        - 如果更大的生态能以更低成本或更强信任拿下同一批用户，则下调判断。
    notes: 反论点刻意保持务实：什么证据会真正改变建议，而不是只制造争论。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 利润持续复合增长，同时用户和存款增长保持健康，风险质量受控
        - 在持久盈利和资金质量得到验证后，私募估值标记明显高于 2024 年锚点
        - 没有出现信贷或控制压力
        - 低-中
      - - 基准
        - Stori 仍是聚焦墨西哥、持续增长的消费金融平台，经济性参差但在改善
        - 证据逐步降低风险后，估值保持在 2024 年锚点附近或略高于该水平
        - 竞争和信任约束市场支付溢价
        - 中
      - - 熊市
        - 信贷损失、支持压力或资金 / 信任担忧压过产品宽度带来的收益
        - 新一轮融资或二级交易估值走平，或重置到 2024 年锚点以下
        - 运营复杂度和风险质量主导叙事
        - 中
    notes: 由于公开收入和单位经济数据不完整，这些情景基于逻辑，并锚定最近一次干净的私募估值，而不是某个声称的内在价值模型。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Public comps are sampled to bracket digital-consumer-finance, card-led lending, and ecosystem-finance business
        models that investors may use heuristically when framing Stori.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Nu Holdings
        - 公开市值
        - $66.78B，截至 2026 年 7 月
        - 最接近的大型拉美数字消费金融可比公司
        - 规模和公开市场流动性大得多
      - - SoFi
        - 公开市值
        - $24.07B，截至 2026 年 7 月
        - 带存款和贷款的消费金融平台可比公司
        - 美国市场结构差异明显
      - - Capital One
        - 公开市值
        - $124.47B，截至 2026 年 7 月
        - 成熟信用卡和存款基准
        - 规模太大、业务太成熟，不能直接套用倍数
      - - MercadoLibre
        - 公开市值
        - $94.64B，截至 2026 年 7 月
        - 通过 Mercado Pago 形成的嵌入式金融生态基准
        - 以商业为主的商业模式比 Stori 更宽
      - - Upstart
        - 公开市值
        - $3.12B，截至 2026 年 7 月
        - 另类信贷科技可比公司
        - 比 Stori 更偏软件 / 市场平台
      - - TransUnion
        - 公开市值
        - $14.43B，截至 2026 年 7 月
        - 数据和信贷基础设施可比公司
        - 不是直接面向消费者的资产负债表贷款方
      - - Intuit
        - 公开市值
        - $75.01B，截至 2026 年 7 月
        - 金融软件信任基准
        - 变现和风险模型不同
    notes: 这些可比公司只具方向性。若不调整流动性、治理、地域和风险，公开市值不能等同于私募金融科技价值。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV005
    title: 投资论点破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 盈利反转
        - 连续两个期间盈利明显走弱，且信贷或准备金信号恶化
        - 打破 Stori 已进入可持续经济性的判断
        - 从观望 / 公允转向放弃
      - - 信任或服务压力
        - 投诉持续，或运营可靠性恶化
        - 削弱存款和交叉销售论点
        - 停止采用估值上行假设
      - - 缺少经济性支撑的伙伴依赖
        - 集中度上升，单位经济性仍不清楚
        - 把宽度故事变成脆弱性故事
        - 折价看待扩张叙事
      - - 监管或控制事件
        - 重大不利合规或催收问题
        - 同时伤害信任和融资信心
        - 在完成补救前视为硬性否决开关
      - - 竞争压缩
        - 更大竞争对手以更低成本拿下同一批用户
        - 压缩创造溢价价值的路径
        - 降低以高于公允锚点出资的意愿
    notes: 触发因素用于把宽泛讨论变成可监测的决策规则。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 更新后的私募估值标记
        - 2024 年后的价格发现或二级交易
        - 需要判断「公允」意味着持平，还是已经上行
        - 询问管理层和领投方
      - - 分群经济性
        - 按产品用户群拆分的留存、激活、回本周期和交叉销售
        - 需要把增长和复利能力拆开
        - 询问管理层和财务团队
      - - 信贷质量
        - 按放款批次的损失曲线、准备金方法和回收
        - 需要检验盈利能否持续
        - 询问风险和财务团队
      - - 存款信任
        - 余额分布，以及保障上限以上的客户行为
        - 需要评估资金来源能否持续
        - 询问司库和客户团队
      - - 伙伴经济性
        - 渠道 CAC 和续约 / 终止条款
        - 需要现实地为伙伴驱动扩张定价
        - 询问商务拓展团队
      - - 监管互动
        - 检查或整改历史
        - 需要评估下行尾部风险
        - 询问合规和法律团队
    notes: 这些尽调事项定义了从观望建议走向投资或放弃的最短路径。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
