              年审计中把准备金估计列为关键审计事项。公司的公开融资叙事也仍然带有债务意识，而不是纯股权。2024 年那轮把股权与 Goldman Sachs 和 Davidson Kempner 的债务结合起来；2021 和
              2022 年融资也包括债务工具。换言之，Stori
              正用存款、风险投资股权和机构借款的组合来资助信贷扩张。这在战略上是正面的，因为它拓宽了资本可得性；但这也意味着承销信心应绑定准备金纪律、净核销行为、契约条款和流动性，而不只是醒目用户增长。公开证据没有披露现金余量、债务契约或集团层面的流动性压力测试。
