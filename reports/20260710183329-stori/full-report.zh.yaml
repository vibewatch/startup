  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、置信度与核心逻辑
        blocks:
          - type: paragraph
            body: >-
              当前建议是“观望”，置信度中等。公司已有足够证据，不应直接放弃：它服务庞大的欠覆盖市场，2024
              年以独角兽估值完成大额融资，披露了有意义的用户规模，并且公开申报文件现在显示实体层面盈利。但同一组证据今天仅靠公开数据还不足以支撑高确信度投资建议。缺口在于：2024
              年融资后标准化的私募市场估值标记、详细分群经济性、客户留存证据、清晰的风险调整后利润率，以及对伙伴驱动和存款驱动扩张如何影响长期可持续回报的更好说明。换句话说，问题不再是 Stori
              是否已经做成一家真实公司；显然已经做成。问题是下一段价值创造靠复利经济性驱动，还是只是靠更多资产负债表投放和更宽产品线驱动。
