        - 公开贷款合同和产品页确认该产品线
        - 明确在运营
        - 可能高收益，也对风险敏感
        - 索取平均票额、期限、APR 和 vintage 损失
      - - 活期和定期存款
        - 存款余额加深钱包份额并支撑资金来源
        - Cuenta+、Inversión+ 页面和存款手册显示活期与定期存款产品
        - 明确在运营
        - 直接收入低，但对资金来源和留存有战略价值
