      - number: '4.2'
        title: 资产负债表牵引真实存在，但盈利质量需要细拆
        blocks:
          - type: paragraph
            body: >-
              Stori México, S.A. de C.V., S.F.P. 经审计的 2025 年财务报表显示，它是真实的贷款和存款平台，不是轻量营销壳。2025 年末存款达到 MXN 9.32 billion，高于
              2024 年的 MXN 7.97 billion；净贷款达到 MXN 7.92 billion，一年前为 MXN 5.87 billion。2025 年末总资产为 MXN 11.80
              billion。损益表也显示总金融活动已经成规模：利息收入 MXN 5.75 billion，收取佣金和费用 MXN 798 million，拨备前金融利差 MXN 4.61
              billion。但拨备负担巨大。2025 年信用损失拨备消耗 MXN 3.49 billion，只留下 MXN 1.12 billion 调整后金融利差；扣除管理和推广费用后，经营结果为负 MXN 174.6
              million。法定净利润只有在递延税项增加 MXN 427.8 million 后才转正至 MXN 253.2 million。这意味着 2025 年结果方向上好于 2024 年 MXN 706.9
              million 净亏损，但不能证明在完全正常化口径下有干净的经营盈利。
