            body: >-
              Stori 的资本结构在改善，但仍与信贷质量和反复获得外部资金的能力紧密相连。2025 年末，SOFIPO 报告资本 MXN 2.03 billion、总负债 MXN 9.78
              billion，贷款账本规模已大致匹配存款基数。传统存款升至 MXN 9.32 billion，分为 MXN 3.25 billion 活期存款和 MXN 6.07 billion 定期存款。2025
