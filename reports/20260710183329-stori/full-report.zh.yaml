      - number: '1.4'
        title: 规模里程碑、运营动能和未解问题
        blocks:
          - type: paragraph
            body: >-
              读 Stori 的规模叙事，最好按时间线而不是单一静态指标来看。2022 年，公司称其在墨西哥有超过 1.4 million 客户。El Economista 报道，到 2024 年 4 月，Stori 有
              2.3 million 信用卡用户和 300,000 储蓄客户，管理层预计未来几个月合计用户数达到 3 million。随后，2024 年 8 月融资稿提到 3 million 用户；2025 年 10
              月一篇汇款文章称用户超过 4 million，分布在信用卡、储蓄和多产品分群。当前信用卡页面现在面向“超过 5 million
              墨西哥人”营销。这一进展支持真实增长轨迹，即便确切用户定义在持卡人、用户和产品持有人之间切换。公开证据还显示相邻里程碑：Cuenta+ 在 2023 年 SOFIPO 牌照获批后推出，Stori Tap
              把应用拓展到商户收单，2025 年与 Félix Pago 的联盟加入基于 WhatsApp
              的汇款。未解问题主要是运营质量，而不是是否存在：当前合并口径员工数、准确活跃用户定义、各产品线贡献，以及国际扩张仍是意图还是已经执行。
