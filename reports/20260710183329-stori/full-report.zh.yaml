  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块、资产表面和各模块服务对象
        blocks:
          - type: paragraph
            body: >-
              公开产品表面已经足够宽，应该把 Stori 看成模块化消费金融平台，而不是单功能金融科技公司。核心模块包括 Stori Card、Cuenta+、分层卡变体、现金贷款、用于商户收单的 Stori Tap，以及通过
              Félix 的汇款挂钩使用。与 SHEIN、Atlas 和 Farmacias Similares
              的联名页面显示，管理层正在把同一套底层通道打包给不同用户分层和获客渠道。这说明主要产品资产不是任何一种卡面设计，而是一组可复用的授信、服务、存款和支付能力，再包进不同客户体验。App Store 和 Play
              描述也强化了这一点：一个应用让用户从一个界面管理储蓄、卡、支付和其他金融动作。因此，产品问题不再是“Stori 有没有卡？”，而是“它已经为服务不足消费者和相邻商户拼出多少日常资金操作系统？”
