            body: >-
              公开客户采用比公开留存更容易证明。Stori 与第三方报道共同建立了可信规模轨迹：2022 年用户超过 1 million、2024 年融资公告时 3 million 用户、2025 年汇款相关报道中超过 4
              million 用户，以及当前自有营销上的 5 million 以上墨西哥人。这些数字并未完全标准化，但显示 Stori 不是小众试点。具名证明更难，因为 Stori
              面向大众消费者，而不是企业账户。最好的公开替代是面向客户的证据界面：应用商店列表和评测型摘要显示用户如何描述产品，合作伙伴挂钩流程则证明真实用例已经进入生产，而不是停在概念阶段。Kardmatch 对
