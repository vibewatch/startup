        title: 融资历史、投资人基础和资本形成
        blocks:
          - type: paragraph
            body: >-
              Stori 的融资历史是其公开档案里最强的一部分，但并不完全规整。公司当前自有的“我们是 Stori”页面称，Stori 已获得超过 US$400 million
              投资。然而，已保留的融资公告指向更高的逐轮披露合计：2021 年 11 月 US$200 million、2022 年 7 月 US$150 million、2024 年 8 月 US$212
              million。按字面计算，三轮合计已约 US$562 million
              股债承诺，意味着首页数字可能过时、被四舍五入，或采用了更窄定义。这个差异很重要，因为它说明投资者为什么应比简化网站横幅更信任有日期的融资稿。毫无疑问的是出资方质量。2021 和 2022 年融资点名
              GGV、GIC、BAI、Lightspeed、General Catalyst、Goodwater 和 Tresalia；2024 年那轮又加入 Notable Capital、ACE Redpoint
              Ventures、Goldman Sachs 和 Davidson Kempner。Bloomberg Línea 还报道，2024 年融资估值高于 2022 年独角兽轮，尽管确切新估值未披露。
