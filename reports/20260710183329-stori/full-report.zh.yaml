            body: >-
              Stori 的公开财务证据和第三方市场评论都说明，信用风险和运营风险已经贴近模型核心。Legal Paradox 强调 Stori 早期已盈利，但也把它的贷款账簿形容为所比较挑战者中风险最高的一个。2025
              年经审计报表显示，拨备绝对规模很大；业务仍依赖把损失率、催收和客服质量压在很窄的执行区间内。运营上，公司还依赖 App
              驱动的开户、客服、支付通道和数字自助服务。现有来源没有披露正常运行时间、服务水平表现、欺诈损失、授权率或详细投诉趋势，因此尽调还无法区分：Stori 只是消费端 UX
              强，还是消费端管控环境也强。实际风险是复合的：薄档案信贷、App 依赖和多产品扩张单看都可控，但只要任何一层控制松动，三者叠加就可能放大客户不满或监管关注。
