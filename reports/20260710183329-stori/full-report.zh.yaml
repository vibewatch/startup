  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              一阶监管风险很直接：Stori 不再只是信用卡的营销品牌。它现在在受监管 SOFIPO
              框架内提供存款、储蓄和贷款产品，并承担产品专属合同、披露和客户服务义务。这带来的监管边界远比单一卡产品更厚。好消息是，Stori
              的公开法律表面很广：合同、成本和佣金、隐私条款、存款材料和财务信息页面都可见。坏消息是，这也扩大了流程、披露、投诉处理或催收失败可能演变为监管或法律问题的地点数量。Kardmatch
              等公开评测来源也提醒用户，SOFIPO 保护上限显著低于银行存款保险；如果余额增长快过用户理解，它会变成信任和消费者保护风险。因此，法律风险问题不只是 Stori
              是否受监管，而是其运营、沟通和服务标准能否跟上不断扩大的产品边界。
