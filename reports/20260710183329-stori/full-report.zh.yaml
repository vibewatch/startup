      - number: '2.4'
        title: 增长驱动、采用约束和市场形态对 Stori 的含义
        blocks:
          - type: paragraph
            body: >-
              这个市场最强的增长驱动，从 Stori
              策略和竞争对手动作都能看出来：移动优先开户注册、简单材料要求、高可见度储蓄收益率，以及从一张卡走向更广应用关系的产品组合。监管阶梯也是驱动，因为它给了可信升级路径：WhiteSight
              把墨西哥牌照栈描述为分阶段野心的路线图，Legal Paradox 认为授权深度越来越决定变现天花板。但同一条阶梯也是约束，因为监管身份需要时间和资本才能放大。竞争强度是另一个约束。EL CEO 和 Legal
              Paradox 都描述了一个正在向少数规模赢家整合的市场，而 Mercado Pago、Spin、Hey Banco 等在位者和生态在分销、资本或实体存在上保留显著优势。信任和信贷表现仍是 Stori
              最具公司特异性的约束。征信薄消费贷款可以快速增长，但高
              APR、准备金需求和客户支持摩擦会收窄从表层用户增长通往持久盈利份额的路径。因此，这个市场很大，但不再是“空白市场”；它是一场整合游戏，执行质量和监管深度比新奇感更重要。
