            body: >-
              Stori 各模块的公开流程符合移动优先的消费金融设计。用户通过卡、账户或合作伙伴入口发现产品，完成数字开户注册，获得信用或存款准入，然后把使用扩展到日常支付、储蓄、贷款或合作伙伴挂钩功能。Cuenta+ 和
              FAQ 页面强调转账、账单支付、服务管理和有息余额等日常动作。Tap 页面加入商户流程，手机变成收单设备。Félix 集成加入汇款流程，价值从墨西哥境外发起并进入与 Stori
              挂钩的账户。这些流程重要，因为它们拓宽了一个应用内的任务场景。它们也为尽调创造了可衡量的产品问题：批准后的激活率、Cuenta+ 中的重复入金行为、从卡到存款或贷款的附加率、Tap
              商户重复使用，以及真正多产品使用而不是只持有沉睡入门卡的用户占比。
