      - - 商户收单 / Tap
        - 每笔成功 NFC 交易收取 2.8% + IVA
        - Tap 页面披露定价，以及结算进入 Cuenta+ 的路径
        - 近期在运营
        - 费率收入可能有吸引力，但规模可能仍小
        - 索取 GMV、活跃商户和毛利率
      - - 支付和 App 功能
        - 账单支付、充值、转账和汇款挂钩 App 使用
        - 当前页面营销支付、充值和 Félix 挂钩汇款
        - 在运营，但未分项
        - 有利留存，但直接变现不清晰
        - 索取支付抽佣率和 App 活动变现情况
    notes: Stori 公开证据对产品存在和客户定价支持更强，对收入确认细节支持较弱。这足以梳理收入流，但不足以有把握地按收入流预测。
