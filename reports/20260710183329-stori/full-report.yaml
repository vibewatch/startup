      - number: '7.4'
        title: People, execution, and investment kill criteria
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is execution quality at management and operating-team level. Stori is trying to be
              many things at once: a lender to underserved consumers, a deposit platform, a merchant-acceptance tool, a
              remittance-adjacent account destination, and a partner-packaged product company. That creates
              organizational complexity in risk, compliance, servicing, treasury, product, and engineering even before
              considering any future geographic or license expansion. Public funding announcements suggest the company
              is investing to broaden its product scope, but public materials do not reveal whether internal reporting,
              controls, or leadership depth have scaled at the same speed. The investment committee should therefore
              define clear kill criteria rather than relying on a generic “watch credit losses” instruction. The most
              important triggers are worsening credit quality without compensating yield, rising complaint or service
              stress, partner dependence without proven economics, and any evidence that deposits or customer trust are
              growing faster than the firm’s regulated operating discipline. If those signals appear together, Stori’s
              growth story could turn from leverage into fragility quickly.
