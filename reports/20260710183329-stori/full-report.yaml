      - number: '6.3'
        title: Retention, repeat usage, satisfaction proxies, and durability gaps
        blocks:
          - type: paragraph
            body: >-
              The largest public customer gap is durability. Stori’s owned pages clearly describe reasons to keep using
              the app after first approval: bill pay, savings yields, balance management, on-app card controls, rewards,
              and adjacent products. App-store and Play-store surfaces provide lightweight external evidence that users
              find the app useful enough to rate it positively. Kardmatch also argues that the app experience and
              digital account tooling are meaningful strengths. But none of these public signals are substitutes for
              real retention data. There is no public NRR, GRR, churn, or cohort curve in the retained source set, and
              even user counts are not always standardized between “users,” “clients,” “account holders,” “card users,”
              and “Mexicans served.” The right conclusion is therefore restrained: Stori likely has repeat-use potential
              because the product suite is broader than one dormant card, but public evidence does not yet prove how
              sticky those users are over time or how many adopt multiple modules in a profitable way.
