      - number: '4.2'
        title: Balance-sheet traction is real, but profitability quality needs careful parsing
        blocks:
          - type: paragraph
            body: >-
              The audited 2025 financial statements for Stori México, S.A. de C.V., S.F.P. show a real
              lending-and-deposit platform, not a lightweight marketing shell. Deposits reached MXN 9.32 billion at
              year-end 2025, up from MXN 7.97 billion in 2024, while net loans reached MXN 7.92 billion versus MXN 5.87
              billion a year earlier. Total assets were MXN 11.80 billion at year-end 2025. The income statement also
              shows strong scale in gross financial activity: MXN 5.75 billion of interest income, MXN 798 million of
              commissions and fees charged, and a MXN 4.61 billion financial margin before provisioning. But the
              provisioning burden is huge. Credit-loss provisioning consumed MXN 3.49 billion in 2025, leaving adjusted
              financial margin of only MXN 1.12 billion and an operating result of negative MXN 174.6 million after
              administration and promotion expenses. Statutory net income turned positive at MXN 253.2 million only
              because deferred taxes added MXN 427.8 million. That means the 2025 result is directionally better than
              2024’s MXN 706.9 million net loss, but not evidence of clean operating profitability on a fully normalized
              basis.
