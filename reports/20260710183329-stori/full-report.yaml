      - number: '6.2'
        title: Adoption trajectory, public customer growth signals, and named proof quality
        blocks:
          - type: paragraph
            body: >-
              Public customer adoption is easier to prove than public retention. Stori and third-party coverage together
              establish a credible scale trajectory: over 1 million-plus users by 2022, 3 million users by the 2024
              financing announcement, more than 4 million users in 2025 remittance-related coverage, and 5 million-plus
              Mexicans on current owned marketing. Those numbers are not perfectly standardized, but they show that
              Stori is not a niche pilot. Named proof is harder because Stori sells to mass consumers rather than
              enterprise accounts. The best public substitutes are customer-facing proof surfaces: app-store listings
              and review-oriented summaries showing how users describe the product, plus partner-linked flows that
              demonstrate real use cases in production rather than concept stage. Kardmatch’s review of Cuenta+ is
              particularly useful because it combines positive feature commentary with caution on protection limits and
              trust. That makes it more informative than a pure owned testimonial. Taken together, the public record
              supports real customer adoption and some qualitative user acceptance, while still leaving important gaps
              on actives, funded accounts, and long-term repeat behavior.
