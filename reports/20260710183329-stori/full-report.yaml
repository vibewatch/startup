      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is mixed but investable with deeper diligence. On the positive side, Stori’s
              regulated subsidiary has a meaningful balance sheet, audited statements, expanding deposits, growing net
              loans, and a Q1 2026 net profit of MXN 59.1 million. Those are material signals that the business is more
              mature than a typical private fintech that only publishes vanity metrics. On the negative side, the public
              record still leaves too much ambiguity around economic quality. The audited 2025 profit depended on
              deferred tax benefits while the operating result remained negative. Public sources also do not disclose
              consolidated revenue across the full Stori group, product-level gross margins, delinquency by cohort, CAC,
              payback, burn, or debt-covenant headroom. Review sources and legal brochures add an important
              customer-level caution: Stori’s cards can carry very high CATs and some variants include opening fees,
              which helps monetize high-risk segments but also raises sensitivity to collections, reputation, and
              regulatory scrutiny. The right diligence approach is therefore lender-style rather than app-style: start
              with reserve methodology, loan performance by vintage, funding tenor, deposit stickiness, and normalized
              operating profitability before underwriting any growth-multiple story.
