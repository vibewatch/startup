  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation, buyers, users, and key jobs-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Stori’s customer base is fundamentally consumer-led. The core buyer, user, and payer is the same
              individual: a Mexican consumer seeking first-time or second-chance formal credit, simple app-based
              savings, or low-friction money management. The most important supporting evidence is consistent across
              company and third-party sources: Stori’s owned pages emphasize approval without heavy bureau friction,
              Reuters and Bloomberg frame the company around underserved consumers, and LinkedIn still describes the
              broader mission as serving hundreds of millions of underbanked Latin Americans. Public product expansion
              creates secondary segments on top of that core. Cuenta+ introduces saver and balance-management users.
              Félix introduces remittance-linked recipients and senders influencing destination choice. Tap introduces
              micromerchants as users and fee payers. Co-branded cards with SHEIN, Atlas, and Farmacias Similares imply
              acquisition through affinity or partner communities rather than only through a generic card funnel. The
              key customer insight is that Stori is no longer serving one monolithic “unbanked borrower” segment; it is
              building a layered underserved-money-user base with different entry points into the same app ecosystem.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
