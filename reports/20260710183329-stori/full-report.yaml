      - number: '8.3'
        title: Comparable valuation logic and why public comps are only partly comparable
        blocks:
          - type: paragraph
            body: >-
              Public listed comparables help frame valuation, but they do not produce a clean one-for-one answer for
              Stori. Nu and SoFi are the closest public fintech comparables in broad consumer-finance ambition, though
              their geographies, disclosures, and scale differ. Capital One is useful as a mature credit-card and
              deposit institution benchmark, but far too large and established to act as a direct valuation comp.
              MercadoLibre matters because Mercado Pago shows how embedded-finance ecosystems can command large value
              when finance sits inside a broader distribution machine. Upstart, TransUnion, and Intuit provide
              additional context on what public markets pay for fintech software, consumer-finance infrastructure, or
              financial-data businesses, but each differs materially from Stori’s balance-sheet-heavy Mexican
              retail-finance profile. The practical use of comps here is therefore directional: they show that public
              markets reward scale, trusted deposits, and durable profitability more than headline user growth
              alone.       That cuts both ways for Stori, whose private valuation story is strong but still exposed to
              risk-quality and trust questions today.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
