      - number: '8.2'
        title: Private round anchor, bull / base / bear scenarios, and valuation range
        blocks:
          - type: paragraph
            body: >-
              Public valuation work must start from the last clean private anchor rather than from an invented
              discounted-cash-flow model. Bloomberg Línea and Reuters describe the 2024 financing as $212 million of
              equity and debt at roughly $1.32 billion post-money valuation, following an earlier 2022 round around $1.2
              billion. That means public evidence supports only a modest step-up between 2022 and 2024 despite material
              product broadening and scale gains. The right scenario framework therefore asks what has to happen next
              for the valuation to compound: in the bull case, Stori would keep scaling users, deposits, and profits
              while proving partner and risk discipline; in the base case, it would remain a solid but still-risky
              Mexico-focused consumer-finance platform; in the bear case, credit losses or funding stress would turn
              current proof into a flat or down-round outcome. Because public data on revenue, net take rate, and cohort
              payback remain incomplete, the valuation range in this chapter is scenario-based rather than
              formula-driven.
            claimRefs:
              - CV011
              - CV012
