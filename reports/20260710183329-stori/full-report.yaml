  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, ecosystems, incumbents, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              Stori does not face a single clean rival set. The direct-peer cluster includes Nu, Klar, Ualá, and
              RappiCard in mass-market digital credit and app-led money management. The ecosystem cluster includes
              Mercado Pago and Spin, which use payments, commerce, or physical retail presence to embed finance into a
              broader relationship. The incumbent-digital cluster includes BBVA and Hey Banco, where trusted banks bring
              established balance sheets and brand recognition into app-led retail finance. Likely entrants or expanding
              challengers include Revolut, Openbank, and Plata, all of which add pressure on the same core consumer
              wallet over time. Stori also competes with the status quo: cash, debit-first habits, informal borrowing,
              and the customer decision to keep one product while multi-homing across apps for savings, transfers, and
              payments. Public market commentary from EL CEO, WhiteSight, and Legal Paradox suggests the field is
              already stratifying by license depth, ecosystem breadth, and access to low-cost distribution rather than
              by app novelty alone.
            claimRefs:
