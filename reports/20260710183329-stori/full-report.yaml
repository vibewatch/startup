          - type: paragraph
            body: >-
              The adverse competitive view is that most visible features in Mexican digital retail finance are already
              commoditised. No-annual-fee cards, yield-bearing deposits, instant transfers, and app-based service
              payments are widely available across Stori, Nu, Klar, Mercado Pago, and incumbent digital banks.
              Multi-homing is also natural because customers can keep a credit card in one app, savings in another, and
              payments in a third with relatively little friction. That weakens product-only moats. Stori’s possible
              defenses are instead structural: experience underwriting thin-file users, a broadened underserved-consumer
              brand, growing deposit and loan infrastructure, and partnerships that create tailored entry points. But
              even Legal Paradox’s bullish recognition of Stori’s profitability is paired with adverse evidence on
              riskier credit quality than some peers. The practical implication is that Stori’s moat must come from
              better economics and retention in a difficult segment, not from the claim that competitors cannot copy its
              visible product features.
