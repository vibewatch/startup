  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and core logic
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is watch with medium confidence.       The company has enough proof to avoid a
              pass: it serves a large underserved market, raised a substantial 2024 round at unicorn valuation,
              disclosed meaningful user scale, and now shows entity-level profitability in public filings. But the same
              evidence does not justify a high-conviction invest recommendation from public data alone today.       The
              missing elements are standardized private-market marks after the 2024 round, detailed cohort economics,
              customer-retention evidence, clean risk-adjusted margin visibility, and better clarity on how partner-led
              and deposit-led expansion affect durable long-run returns.       In other words, the question is no longer
              whether Stori has built a real company; clearly, it has. The question is whether the next leg of value
              creation will be driven by compounding economics rather than simply by more balance-sheet deployment and
              broader product breadth.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
