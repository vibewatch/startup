companyProfile:
  summary: >-
    Stori is a Mexico City-based fintech built around widening financial access for underserved consumers. What began as
    a starter-card proposition has expanded into a broader retail-finance platform spanning credit cards, savings and
    deposit products, loans, remittance-linked account workflows, and merchant acceptance via Tap. Public sources now
    support real customer scale and entity-level profitability, but they still leave major diligence questions around
    retention, funding quality, channel economics, and long-run moat durability.
