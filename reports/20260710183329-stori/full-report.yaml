      - number: '6.4'
        title: Expansion loops, partner dependence, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Stori’s expansion logic is clear in public materials: land a consumer through a card or partner page, keep
              them in the app with payments and account tools, then widen usage into savings, loans, remittances, or
              merchant acceptance. That creates multiple expansion loops, but it also introduces concentration and
              channel risk. If partner-led channels such as SHEIN, Atlas, Farmacias Similares, or Félix become too
              important without proven economics, the company can end up with customer breadth that is less durable than
              it appears. There is also a category-level concentration issue. Public market commentary shows large
              rivals like Nu, Mercado Pago, and ecosystem-based players competing for the same mass-market consumer
              wallet, which means multi-homing is a realistic customer behavior. The consequence is that Stori’s
              customer value depends less on top-line sign-up counts than on whether it can hold balances, keep repeat
              engagement, and deepen trust after the first product. Public evidence supports the existence of these
              loops, but not yet the degree to which they create durable share of wallet.
            claimRefs:
              - CU028
              - CU029
              - CU030
              - CU031
              - CU032
