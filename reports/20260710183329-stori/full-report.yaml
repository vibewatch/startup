      - number: '8.4'
        title: Thesis-breakers, kill triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The thesis breaks if the evidence stops moving from “growth with promise” toward “growth with durable
              economics and trust.” That means the final diligence burden is clear. Management needs to show whether
              public profitability is repeatable across the cycle, whether deposit and product expansion improve
              customer lifetime value rather than merely increasing operational complexity, and whether the company can
              defend itself against larger ecosystems and better-capitalized competitors without stretching credit
              quality.       The final asks are therefore intentionally focused on proof, not marketing: updated
              private-mark data, loss and reserve curves, deposit behavior above covered limits, retention and
              repeat-usage cohorts, partner economics, and current regulatory interaction history. Without those
              answers, public evidence supports a fair valuation stance but not a decisive bargain call today. With
              strong answers, Stori could justify a more aggressive recommendation because the business already has
              enough scale and market need to matter.
            claimRefs:
              - CV031
