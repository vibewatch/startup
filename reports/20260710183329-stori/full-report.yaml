      - number: '7.3'
        title: Partner, platform, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Stori’s visible growth strategy depends on a web of external platforms and partners. App stores remain
              critical acquisition and servicing channels. Card and payment rails matter for the credibility of the core
              product. Co-branded and segmented pages with SHEIN, Atlas, and Farmacias Similares show that partner
              packaging is now part of the go-to-market motion. Félix adds a remittance-linked flow that depends on
              partner execution as well as Stori’s own account experience. This is strategically valuable because it
              expands the funnel without building everything in-house, but it also creates concentration and interface
              risk. A partner underperforming, changing terms, or creating a poor user handoff can damage Stori’s
              customer experience even if Stori’s internal product team executes well. The same is true for collections
              contacts, third-party service processes, and distribution platforms: the company owns the brand impact
              even when another party owns part of the workflow. For diligence, the key questions are partner
              concentration, termination rights, API and service-level dependence, and whether channel economics justify
              the extra complexity.
            claimRefs:
