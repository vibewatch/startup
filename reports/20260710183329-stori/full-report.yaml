      - number: '2.3'
        title: Buyer, user, and payer segmentation plus adoption paths
        blocks:
          - type: paragraph
            body: >-
              Stori’s core user is an individual consumer who is simultaneously the applicant, user, and economic payer
              of the product. That is different from enterprise fintech or payroll software, where the budget owner is
              someone else. The entry product is typically a credit card or deposit account, both of which solve
              immediate access and trust problems for thin-file or underserved consumers. As Stori expands, a second
              segment emerges: micro and small merchants using Stori Tap, where the merchant becomes the user and fee
              payer while end-customers are the transaction counterparties. A third adjacent segment is families using
              remittance corridors, where the sender in the United States initiates value through Félix Pago and the
              Stori account holder in Mexico becomes the receiving user. Competitor evidence suggests the adoption path
              in Mexico is increasingly ecosystem-based rather than single-product based. Nu localizes savings and
              cash-out rails, Mercado Pago cross-sells from commerce and payments, Spin leverages physical convenience
              stores, and traditional-bank-backed Hey Banco markets a full digital-bank bundle. Stori’s challenge is
              therefore not just to acquire first-time credit users but to become the trusted daily-money app they keep
              after the first product unlocks.
