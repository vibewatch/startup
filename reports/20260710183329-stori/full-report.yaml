        title: Exhibits
        blocks:
          - type: callout
            title: Watch, not pass
            body: >-
              Public evidence shows enough scale and proof to stay engaged, but not enough durable-economics visibility
              to justify a high-confidence invest call yet.
            calloutType: recommendation
            claimRefs:
