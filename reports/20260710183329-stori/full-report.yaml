      - number: '3.2'
        title: 'Direct competitor profiles: scale, funding posture, target users, and product overlap'
        blocks:
          - type: paragraph
            body: >-
              Nu and Klar overlap with Stori most directly because they combine digital onboarding, cards or accounts,
              and high-visibility savings yields for mass-market Mexican consumers. Nu’s official and third-party
              evidence emphasizes scale, while Klar’s owned pages emphasize multi-product money management inside one
              app. Ualá competes through bank-like positioning and deposit protection messaging. RappiCard competes
              through a no-annual-fee, no-bureau framing that can appeal to a similar acquisition audience. Mercado
              Pago, by contrast, is not just another card issuer; it cross-sells from commerce, transfers, and merchant
              tools into consumer finance. Spin uses OXXO’s physical footprint as a trust and distribution advantage.
              Stori’s own product surface now spans starter credit cards, deposit accounts, loans, remittance receipt,
              merchant acceptance, and co-branded variants with SHEIN, Atlas, and Farmacias Similares, which suggests
              management is trying to defend against single-product commoditization by widening the bundle faster than
              its original card story alone would permit.
