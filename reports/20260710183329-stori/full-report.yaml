        title: User workflows, use cases, and measurable benefits visible in public materials
        blocks:
          - type: paragraph
            body: >-
              The public workflow across Stori’s modules is consistent with a mobile-first consumer-finance design. A
              user discovers the product through a card, account, or partner offer; completes digital onboarding;
              receives access to credit or deposits; and then expands usage into daily payments, savings, loans, or
              partner-linked functions. Cuenta+ and FAQ pages emphasize everyday actions such as transfers, bill
              payment, service management, and yield-bearing balances. The Tap page adds a merchant workflow in which
              the phone becomes the acceptance device. The Félix integration adds a remittance workflow in which value
              originates outside Mexico and lands into a Stori-linked account. These flows matter because they widen the
              jobs-to-be-done inside one app. They also create measurable product questions for diligence: activation
              rate after approval, repeat funding behavior in Cuenta+, attach rate from cards into deposits or loans,
