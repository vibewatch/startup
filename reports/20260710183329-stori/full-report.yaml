      - Owner or diligence path
    rows:
      - - Updated private mark
        - Post-2024 price discovery or secondary transactions
        - Needed to know whether fair means flat or already moving higher
        - Ask management and lead investors
      - - Cohort economics
        - Retention activation payback and cross-sell by product cohort
        - Needed to separate growth from compounding
        - Ask management and finance
      - - Credit quality
        - Vintage loss curves reserve methodology and recoveries
        - Needed to test whether profitability is durable
        - Ask risk and finance teams
      - - Deposit trust
        - Balance distribution and behavior above covered limits
        - Needed to evaluate funding durability
        - Ask treasury and customer teams
      - - Partner economics
        - Channel CAC and renewal / termination terms
        - Needed to price partner-led expansion realistically
        - Ask business development
      - - Regulatory interactions
        - Examination or remediation history
        - Needed to assess downside left-tail risk
        - Ask compliance and legal
    notes: These asks define the shortest path from a watch recommendation toward either invest or pass.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
