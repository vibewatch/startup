  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The first-order regulatory risk is straightforward: Stori is no longer just a marketing brand for a credit
              card. It now offers deposit, savings, and lending products inside a supervised SOFIPO framework with
              product-specific contracts, disclosures, and customer-service obligations. That creates a much richer
              regulatory perimeter than a single card product. The good news is that Stori’s public legal surface is
              extensive: contracts, costs and commissions, privacy terms, deposit materials, and financial-information
              pages are all visible. The bad news is that this also widens the number of places where process,
              disclosure, complaint-handling, or collections failures could become regulatory or legal issues. Public
              review sources such as Kardmatch also remind users that SOFIPO protection limits are materially smaller
              than bank deposit insurance, which can become a trust and consumer-protection risk if balances grow faster
              than user understanding. The legal risk question is therefore not only whether Stori is regulated, but
              whether its operations, communications, and servicing standards can keep pace with its growing product
              perimeter.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
