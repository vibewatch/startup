      - number: '7.2'
        title: Operational, credit, and quality risks
        blocks:
          - type: paragraph
            body: >-
              Stori’s public financial evidence and third-party market commentary make clear that credit and operating
              risk sit close to the center of the model. Legal Paradox highlights Stori’s early profitability but also
              characterizes the loan book as the riskiest among the challengers it compares. The audited 2025 statements
              show that provisions are large in absolute terms, and the business still depends on keeping loss rates,
              collections, and support quality inside a narrow execution band. Operationally, the company also depends
              on app-led onboarding, customer service, payments rails, and digital self-service. The retained sources do
              not disclose uptime, service-level performance, fraud losses, authorization rates, or detailed complaint
              trends, which means diligence cannot yet separate a strong consumer UX from a strong consumer-control
              environment. In practice, this creates a compound risk: thin-file lending, app dependence, and
              multi-product expansion can each be manageable individually, but together they can amplify customer
              dissatisfaction or regulatory attention if any control layer slips.
            claimRefs:
              - CR010
              - CR011
