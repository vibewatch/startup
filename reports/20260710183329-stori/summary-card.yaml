  topStrengths:
    - >-
      Large underserved-market positioning with strong evidence of real national customer scale rather than pilot-stage
      traction.
    - >-
      Public product breadth now extends beyond cards into savings, loans, remittances, partner channels, and merchant
      tools.
    - >-
      Audited 2025 and Q1 2026 filings provide rare entity-level profitability evidence for a private consumer-finance
      startup.
    - >-
      The 2024 round and repeat access to debt-plus-equity funding suggest continued investor appetite and strategic
      financing flexibility.
  topRisks:
    - Credit-quality deterioration in thin-file lending could quickly overwhelm the current profitability narrative.
    - >-
      Customer durability is still denominator-poor because public cohorts, retention curves, and funded-account
      behavior remain undisclosed.
    - >-
      Deposit-trust and servicing quality risk remain meaningful in a SOFIPO structure with lower protection limits than
      banks.
    - >-
      Partner and channel expansion can widen the funnel while obscuring economic quality if CAC and retention by
      channel are weak.
    - Competition from larger ecosystems and better-capitalized challengers keeps moat durability uncertain.
  unresolvedGaps:
    - Updated private-market mark or secondary price discovery after the 2024 round.
    - Cohort retention, activation, and multi-product attach for card, savings, and partner-channel users.
    - Vintage loss curves, reserve methodology, and current risk-quality trend data.
    - Deposit-balance behavior above protection limits and trust / complaint trends.
    - Partner-channel concentration, CAC, and renewal or termination economics.
