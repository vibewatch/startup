schemaVersion: report-v2
artifact: customers
slug: defense-unicorns
runDate: 2026-10-18
company:
  name: Defense Unicorns
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence shows Defense Unicorns selling into defense procurement
    channels rather than broad commercial end markets: the company claims active
    use across more than 100 mission systems and organizations, a DoW-wide IDIQ,
    and an Army vendor-onboarding motion through UDS Army. What remains missing is
    the durability layer that matters most for an investor judgment: retention,
    renewal, top-customer concentration, and how much of the contract-vehicle
    access converts into recurring software revenue.
sections:
  - id: buyer-map
    title: Buyer map and customer motion
    body: >-
      The assigned evidence points to a concentrated defense customer base with two
      linked motions. First, Defense Unicorns positions UDS as infrastructure for
      mission-software teams operating in secure or disconnected environments across
      cloud, on-premises, and tactical edge settings, which aligns the product with
      military operators and program offices rather than general enterprise buyers.
      Second, the company is trying to widen distribution through procurement and
      partner channels: the September 2026 IDIQ gives DoW organizations a task-order
      path to UDS Enterprise and UDS Fleet, while UDS Army adds marketplace,
      sandbox, and pre-authorized environment hooks for Army program managers and
      for software vendors trying to reach Army missions. That structure supports a
      land-and-expand thesis inside defense accounts, but it also implies heavy
      dependence on federal acquisition workflows.
    claimRefs: [CU001, CU002, CU005, CU007, CU008, CU009, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption signals are real, but mostly company-authored
    body: >-
      The public adoption signals are meaningful but still largely company-shaped.
      Defense Unicorns and its investor reposts say adoption in military systems
      increased 300% year over year in early 2026, and the company later said its
      software was deployed across more than 100 mission systems and organizations.
      The evidence also goes beyond anonymous logo walls: the sources name Navy,
      Air Force, and Space Force customers, and the UDS Army announcement names a
      first onboarding cohort of HERE, Kana Systems, Lastwall, Petra Data,
      Sandtable, and Selas Defense. Those facts support real traction and a growing
      vendor ecosystem, but they do not disclose how many accounts are paying,
      which deployments are production versus trial, or whether those proofs scale
      into durable recurring revenue.
    claimRefs: [CU003, CU004, CU006, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain the largest customer unknowns
    body: >-
      The weakest part of the customer story is durability. The assigned source
      pool does not disclose NRR, GRR, churn, renewal rates, contract length, or
      top-customer concentration, so public evidence currently proves access and
      adoption more clearly than retention. There is also a structural channel risk:
      Defense Unicorns is tightly tied to U.S. defense appropriations and
      contracting speed. GAO reported in January 2026 that about half of the 74
      acquisition programs it surveyed saw schedule effects from continuing
      resolutions, and that long CR periods can create contracting-office
      bottlenecks that limit vendors' ability to complete projects. That does not
      negate customer demand, but it means conversion from interest, contract
      vehicle access, and onboarding to steady software revenue still needs tighter
      diligence.
    claimRefs: [CU005, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / channel signal
      - Revenue / strategic value
      - Gap
    rows:
      - - DoW organizations buying UDS Enterprise / UDS Fleet
        - Payer and buyer are defense organizations using task orders; users are mission-software teams
        - Acquire hardened runtime and fleet-management software for secure mission delivery
        - DoW-wide single-award IDIQ with a $350M ceiling and streamlined task orders
        - Opens a department-wide software procurement path
        - Ceiling value is not disclosed revenue, backlog, or funded conversion
      - - Military service operators in Navy, Air Force, and Space Force
        - Users are operators and program offices running mission software
        - Deploy and sustain software across cloud, on-premises, and tactical edge environments
        - Company says software is deployed across more than 100 mission systems and organizations
        - Suggests breadth across multiple service branches
        - Named programs, usage depth, and renewal behavior are not disclosed
      - - Army program managers and soldiers using UDS Army
        - Buyers are Army program managers; end users are soldiers and mission owners
        - Discover, demo, acquire, and deploy approved applications in IL4 / IL5 environments
        - Army App Marketplace plus sandbox trial environments on uds.army.mil
        - Embeds the product inside an Army acquisition workflow
        - Public sources do not show completed purchase volumes or renewal data
      - - Commercial software vendors entering Army missions
        - Customer-adjacent partners are software vendors onboarding through UDS Army
        - Use Defense Unicorns tooling to reach Army missions without separate ATO work
        - First public cohort names six vendors and claims faster onboarding economics
        - Creates an ecosystem expansion loop beyond direct end-account selling
        - Production conversion and take-rate economics are not disclosed
    notes: >-
      Public sources separate direct defense buyers from vendor-onboarding partners;
      null-style gaps here indicate missing conversion, renewal, or revenue detail
      rather than zero activity.
    claimRefs: [CU001, CU002, CU005, CU006, CU007, CU008, CU009, CU010, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Adoption growth in military systems
        - 300% year-over-year increase
        - "2026-01-13"
        - AVP and Bain reposts of the financing announcement
        - Medium
        - Indicates materially rising use in defense programs
        - Starting base, paying accounts, and ARR are not disclosed
      - - Mission-system / organization footprint
        - More than 100 mission systems and organizations
        - "2026-09-30"
        - Company PR via PRNewswire
        - Medium
        - Suggests meaningful deployment breadth across defense accounts
        - Mix of pilots, production workloads, and revenue contribution is not disclosed
      - - Procurement-access expansion
        - $350M single-award IDIQ ceiling
        - "2026-09-30"
        - Company PR via PRNewswire and WN syndication
        - Medium
        - Makes department-wide task-order procurement easier
        - Ceiling value is not booked revenue or funded backlog
      - - UDS Army onboarding motion
        - First cohort of 6 vendors; ATO from 18 months to as little as 2 weeks; >70% lower documentation expense
        - 2026 access; publication date not disclosed in fetched text
        - Company PR with DEVCOM C5ISR
        - Medium
        - Shows a channel that can widen adoption beyond direct sales
        - No disclosed conversion from onboarding to paid production usage
    notes: >-
      Every row is a public signal rather than a normalized revenue cohort; the
      table preserves the source's own metric definitions and flags missing
      denominators explicitly.
    claimRefs: [CU003, CU005, CU006, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / participant
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - U.S. Navy
        - Military service customer
        - Company says operators use Defense Unicorns technology on critical systems
        - Existing customer claimed; specific production program not named
        - Named service-branch proof beyond generic defense marketing
        - No contract, mission program, or outcome metric disclosed
      - - U.S. Air Force
        - Military service customer
        - Existing customer under the broader Defense Unicorns footprint
        - Existing customer claimed; production depth not disclosed
        - Supports multi-service adoption thesis
        - No named deployment or renewal evidence disclosed
      - - U.S. Space Force
        - Military service customer
        - Existing customer under the broader Defense Unicorns footprint
        - Existing customer claimed; production depth not disclosed
        - Shows reach into another defense branch
        - No named system or contract value disclosed
      - - HERE
        - Software vendor onboarding through UDS Army
        - Vendor cohort for Army marketplace and pre-authorized environment access
        - Onboarding cohort; production deployment not disclosed
        - Evidence that third-party vendors are entering the Army channel
        - No disclosed Army contract, user count, or realized spend
      - - Lastwall
        - Software vendor onboarding through UDS Army
        - Vendor cohort for Army marketplace and pre-authorized environment access
        - Onboarding cohort; production deployment not disclosed
        - Reinforces ecosystem participation beyond a single logo
        - Public evidence does not show conversion to sustained usage
      - - Selas Defense
        - Software vendor onboarding through UDS Army
        - Vendor cohort for Army marketplace and pre-authorized environment access
        - Onboarding cohort; production deployment not disclosed
        - Shows the channel is attracting defense-relevant vendors
        - Public evidence does not show fielded outcomes or renewals
    notes: >-
      This is a partial enumeration built from every named service branch and
      first-cohort vendor explicitly identified in the assigned public sources;
      rows distinguish named proof from actual production-depth evidence.
    enumerationScope:
      coverage: partial
      basis: >-
        Combines every named service branch and first-cohort vendor explicitly
        identified in the assigned public sources as of the run date.
    claimRefs: [CU004, CU006, CU010]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Defense Unicorns expands by reducing procurement and compliance friction for
      both defense buyers and software vendors, then using those surfaces to move
      workloads into production.
    data:
      items:
        - label: Mission need in a disconnected environment
          detail: Secure mission-software teams need updates across cloud, on-premises, and tactical edge environments.
          touchpoints: >-
            UDS is positioned for secure, constrained, or disconnected teams and
            for deployment from a single artifact.
        - label: Compliance and ATO acceleration
          detail: UDS and UDS Army package compliance evidence and inherited controls into the buying motion.
          touchpoints: >-
            Support authorization; authorized DevSecOps pipeline; pre-authorized
            IL4 / IL5 environments.
        - label: Marketplace discovery and demo
          detail: Army buyers can discover, demo, and test approved applications before a larger deployment.
          touchpoints: >-
            Army App Marketplace; sandbox trial environments; "try before they
            buy" for Army customers.
        - label: Task-order procurement
          detail: The DoW-wide IDIQ shortens the path from requirement to purchase.
          touchpoints: >-
            Single-award IDIQ; streamlined task-order process; direct access to UDS
            Enterprise and UDS Fleet.
        - label: Mission deployment and fleet updates
          detail: Applications then move into production mission environments.
          touchpoints: >-
            Secure runtime, shared cyber services, and updates across distributed
            operational environments.
        - label: Ecosystem expansion loop
          detail: Named software vendors onboard through UDS Army to widen future account reach.
          touchpoints: >-
            First cohort includes HERE, Kana Systems, Lastwall, Petra Data,
            Sandtable, and Selas Defense.
    approximationNotes: >-
      The sequence reflects the documented adoption path in public sources rather
      than measured conversion rates between stages.
    claimRefs: [CU002, CU005, CU009, CU010, CU011, CU012, CU014]
callouts:
  - calloutType: risk
    title: Public customer proof is stronger on access than on durability
    body: >-
      The public record now shows contract-vehicle access, named service branches,
      and a first onboarding cohort, but it still does not disclose renewal,
      retention, or concentration metrics that would confirm how durable the
      customer base really is.
    claimRefs: [CU005, CU006, CU010, CU013, CU014]
