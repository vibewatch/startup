    rows:
      - - Affiliation, ownership, and federal-funding eligibility
        - U.S. SBA SBIR affiliation and foreign-interest screening
        - No assigned source confirms Defense Unicorns' SBIR participation or eligibility posture.
        - Unverified
        - High if applicable
        - Not publicly evidenced
        - Material conditional risk
        - Reconcile SBIR history, employee and affiliate counts, cap table, board rights, and foreign-investor disclosures with counsel.
      - - Facility clearance and foreign ownership, control, or influence
        - DCSA facility-clearance and FOCI review
        - Financing participants are public, but ownership percentages, information rights, clearance status, and mitigation agreements are not.
        - Unverified
        - High for classified expansion
        - Not publicly evidenced
        - Material gating risk
        - Obtain the current cap table, governance-rights matrix, DCSA correspondence, facility-clearance status, and any FOCI mitigation plan.
      - - Prime-contractor supply-chain liability
        - U.S. export controls, cybersecurity, sourcing, and sanctions requirements
        - A DoW-wide single-award IDIQ was announced; supplier controls and contractual flow-down evidence were not disclosed.
        - Medium as performance scales
        - High
        - Product controls described; enterprise controls unverified
        - High until verified
        - Review supplier nationality, overseas engineering access, ITAR/EAR classification, sanctions screening, CMMC evidence, and subcontractor attestations.
    notes: Risk ratings are conditional analyst assessments based on the assigned public sources; no row asserts a known violation, and missing public records do not prove compliance or noncompliance.
    enumerationScope:
      coverage: partial
      basis: Public-only enumeration of the three defense-supplier lifecycle gates identified in the assigned 2026 legal analysis and applicable company disclosures.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR011
      - CR012
      - CR013
