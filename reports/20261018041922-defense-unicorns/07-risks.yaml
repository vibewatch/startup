  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: foci
      missingEvidence: Current cap table, investor and limited-partner nationality exposure, board and information rights, facility-clearance status, and any FOCI mitigation agreement.
      whyItMatters: Ownership or governance restrictions could delay or block classified programs and change the effective value of the company's contract access.
      diligencePath: Obtain the capitalization table, governance-rights matrix, DCSA correspondence, facility-clearance record, and a counsel memorandum covering FOCI and SBIR affiliation.
      relatedQuestionRefs:
        - QR002
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Independent uptime, incident, rollback, vulnerability-remediation, penetration-test, and customer operating evidence for UDS.
      whyItMatters: Company-described scanning and authorization controls do not establish production reliability or effective security operation in mission environments.
      diligencePath: Review twelve months of severity-one and severity-two incidents, SLO attainment, rollback metrics, CVE aging, independent assessment results, and two production customer references.
      relatedQuestionRefs:
        - QR005
      relatedTableRefs:
        - TR002
    - type: private-evidence-only
      severity: material
      topic: contract-conversion
      missingEvidence: Funded task-order backlog, recognized revenue, gross margin, renewal behavior, services mix, and concentration by program office and mission integrator.
      whyItMatters: Funding, valuation, adoption, and contract-ceiling figures do not reveal recurring economics, cash runway, or conversion efficiency.
      diligencePath: Reconcile the IDIQ ceiling to awarded and funded orders, revenue recognition, cash collections, customer cohorts, gross margin, and the top-ten customer and partner concentration schedules.
      relatedQuestionRefs:
        - QR006
        - QR007
        - QR010
      relatedTableRefs:
        - TR003
