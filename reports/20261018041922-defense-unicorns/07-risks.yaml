callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Pause or reprice if funded task orders materially lag the announced vehicle, if services and
      integration effort prevent recurring software margins, if a clearance or supplier-control
      issue blocks target programs, or if independent testing shows that update, rollback, and
      vulnerability-remediation performance cannot meet mission requirements.
    claimRefs:
      - CR001
      - CR007
      - CR012
      - CR013
      - CR016
