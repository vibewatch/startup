      - Evidence basis
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Mission update or runtime failure in disconnected environments
        - UDS is designed to package, deploy, monitor, and sustain software where connectivity is limited or absent.
        - Unverified
        - Critical if realized
        - Architecture and packaging controls described
        - High-impact uncertainty
        - No independent uptime, rollback, recovery-time, or field-incident record was available.
      - - Bundled-platform complexity increases resource and upgrade burden
        - UDS supplies shared runtime services; adverse comparable-category commentary documents coupling and upgrade burden in another DoD Kubernetes bundle.
        - Medium
        - High
        - Open-source and repeatable baselines described
        - Medium-high
        - No UDS-specific component count, upgrade cadence, failed-upgrade rate, or operator-effort benchmark was available.
      - - Compliance artifacts overstate effective security
        - Company documentation describes scanned and SBOMed packages; adverse commentary warns that image scans and ATO artifacts do not prove runtime hardening.
        - Unverified
        - High
        - Preventive controls described; independent assurance absent
        - High until tested
        - No independent assessment, penetration-test result, control exception list, or incident postmortem was available.
      - - Implementation capacity cannot match adoption and contract scope
        - LinkedIn labels the company 51-200 employees while also displaying 269 associated employees; public deployment claims exceed 100 mission systems or organizations.
        - Medium
        - High
        - Recent financing supports hiring; staffing mix remains unknown
        - Medium-high
        - Reconcile payroll headcount, cleared labor, partner-delivered work, support ratios, and services versus product staffing.
    notes: The Big Bang source is used only as a comparable architecture warning, not as proof of a UDS defect; qualitative likelihoods remain provisional where company-specific incident data are unavailable.
    claimRefs:
