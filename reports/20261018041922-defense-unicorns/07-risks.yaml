      - CR007
      - CR008
      - CR009
      - CR010
      - CR014
      - CR015
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - IDIQ conversion
        - DoW ordering organizations
        - Fund and issue task orders under the $350 million ceiling
        - High
        - Contract access does not convert into funded backlog, renewal, or recognized revenue.
        - High
        - Single-award vehicle can reduce procurement steps for participating buyers.
        - High because funded task-order value is undisclosed
      - - Mission integration and operational adoption
        - Program offices and mission integrators
        - Deploy, authorize, and sustain UDS in live environments
        - Medium-high
        - Integrator capacity, customer staffing, or platform complexity slows production use.
        - High
        - Company materials emphasize repeatable baselines, authorization evidence, and reduced platform one-offs.
        - Medium-high without independent deployment benchmarks
      - - Open-source and package ecosystem
        - Zarf, Pepr, Kubernetes, and packaged upstream components
        - Supply the runtime and application dependencies used in disconnected environments
        - Medium
        - Vulnerability remediation or coupled upgrades lag mission requirements.
        - High
        - Scanning, SBOMs, CVE reports, and open-source foundations are described.
        - Medium-high without observed remediation and upgrade data
      - - Growth-capital expectations
        - Bain-led investor syndicate
        - Fund expansion and influence governance at a valuation above $1 billion
        - Medium
        - Adoption growth fails to translate into profitable, recurring software economics.
        - High
        - The round added $136 million and Bain described growth as profitable.
        - High because burn, cash, margin, and recurring revenue are undisclosed
    notes: Funding raised is not treated as cash available, contract ceiling is not treated as revenue, and public adoption claims lack a disclosed denominator beyond military systems.
    claimRefs:
