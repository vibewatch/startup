              - CM011
              - CM012
              - CM017
      - number: '2.3'
        title: 驱动因素与约束：现代化紧迫性真实存在，但采购摩擦是结构性的
        blocks:
          - type: paragraph
            body: >-
              指定证据集中的需求驱动因素非常清晰。国防部预算措辞指出，软件现代化需要安全且快速的交付、云基础、现代开发—安全—运营工具、采购政策演进和网络监控；Defense Unicorns
              的产品定位恰好对应这些断连环境中的缺口。买方路径也很复杂：公司自己的岗位描述同时面向软件供应商、政府评估人员和平台运营者，意味着上线生产前要完成多方接入和审批。估值时点同样必须重视约束因素。GAO
              报告称，持续决议会延迟合同授予和部署、推高成本并使预算执行更复杂；因此，真实的市场需求并不会自动转化为 Defense Unicorns 的近期软件收入或顺畅部署速度。
            claimRefs:
              - CM007
              - CM009
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: 证据展项
        blocks:
          - type: callout
            title: 真实需求信号，变现信号不完整
            body: 指定资料让需求论点可信，因为国防部软件现代化预算和采购载体确实存在；但变现论点仍未展开，因为公开来源没有披露价格实现、细分结构或预算到收入的转化。
            calloutType: insight
            claimRefs:
              - CM005
              - CM010
              - CM012
              - CM017
          - type: callout
            title: 采购时点可能压过品类需求
            body: GAO 关于持续决议的证据意味着，估值时点不仅取决于产品与市场的匹配度，还取决于国防预算和任务订单能否足够快地推进，让现代化需求变成已确认的软件收入。
            calloutType: risk
            claimRefs:
              - CM005
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局更接近政府和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 将 Unified Defense
              Stack（UDS）定位为面向安全、断连环境的可移植软件交付平台；而本批独立证据最清晰地指向政府主导的替代方案，而不是一片密集的商业同行。Platform One 仍是可信替代品，其套件覆盖 Big
              Bang、Iron Bank、Party Bus 和 P1 Marketplace；GovCIO 称该项目为跨国防单位进行软件交付的标准化、可扩展、安全方案。资料还显示，Big Bang
              本身是一条由客户管理的部署路径，配有版本化指南、软件包引用和运营材料。因此，买方真正面对的往往不是“另一家创业公司的 SKU”，而是政府基线、内部现代化项目，或项目办公室把现有 Platform One
              组件延伸到自身环境。
            claimRefs:
              - CP001
