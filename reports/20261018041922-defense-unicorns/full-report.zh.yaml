        title: 证据展项
        blocks:
          - type: callout
            title: 竞争压力既来自功能，也来自分发
            body: 保留证据中的最强替代方案，把安全运行时工具、采购路径和政府基线结合起来。因此，Defense Unicorns 需要赢下采购转化和项目标准化，而不只是做出技术差异化。
            calloutType: insight
