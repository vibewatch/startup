chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台范围
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 一直将自己定位为一家 2021 年成立的国防科技公司，专注于用开源、原生适配气隙环境的交付基础设施，让软件成为战略威慑能力。公司和投资人介绍反复强调的并不是通用
              DevSecOps 咨询，而是用平台方式在云端、本地部署和战术边缘环境中打包、交付并持续维护任务软件。UDS
              文档给出了最清晰的产品层解释：在互联网访问受限、且一次性平台定制长期存在的断连或严格管控环境中，平台要把现代软件连同其依赖和合规证据一起迁入。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO007
              - CO011
              - CO012
      - number: '1.2'
        title: 领导层、治理与运营足迹
        blocks:
          - type: paragraph
            body: >-
              现有资料对创始人和运营信号的覆盖最充分，但对正式治理的披露明显较弱。Bain Capital 2026 年 1 月的公告将 Rob Slaughter、Jeff McCoy 和 Andrew Greene
              列为创始人；同期公告称 Slaughter 为 CEO、McCoy 为 CTO。招聘信息也显示，公司已覆盖不同运营场景：一个平台岗位要求在圣安东尼奥现场工作，支持安全裸金属 UDS
              部署；另一份更新后的岗位则描述了远程平台和 SRE 职能，负责 IAM、监控、Iron Bank 合规和值班支持。另一个与海军领域相关的 Mission Manager
              岗位，说明公司有专门服务某条军种业务线的产品管理能力，而不只是泛化的平台销售。仍然缺失的是董事会构成、所有权和控制权细节。
