  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现披露
        blocks:
          - type: paragraph
            body: >-
              审阅记录支持这样一种变现模式：将软件平台部署到安全环境，并配套服务或持续维护工作，而不是自助式商业 SaaS。Multiples 将收入模式归为“服务、订阅”；Defense Unicorns 自己的文档则把
              UDS 描述为在云端、本地部署和战术边缘环境中打包、交付并运行软件的平台。对投资判断最关键的商业层仍然缺失：审阅过的公开来源没有披露挂牌价格、实际价格、最低合同承诺、平均合同价值，或软件订阅与服务的结构。2026
              年 9 月的 IDIQ 和 Tradewinds 入驻明确拓宽了采购可及性，但它们是分销和签约机制，不是已入账收入或利润质量的公开证明。
            claimRefs:
