          note: 供应链和基线集成信号强，但目前关于端到端可移植制品交付的证据较少。
        - label: 内部遗留系统现代化
          x: 2
          'y': 6
          tone: warning
          note: 深度嵌入现有项目，但受紧耦合遗留系统拖慢。
        - label: 项目专属一次性构建
          x: 3
          'y': 4
          tone: warning
          note: 避开供应商采用，但通常缺少其他路径所展现的可复用基线和采购捷径。
    approximationNotes: 定位分数是锚定保留来源文本的序数判断，应理解为相对位置，而不是经审计的数值基准。
