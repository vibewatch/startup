  - id: FE001
    title: 产品架构图
    type: stack
    summary: UDS 呈现为分层交付技术栈，其商业 SKU 将同一套原生隔离网基础封装到不同的运营方和采购流程中。
    data:
      layers:
        - label: 任务软件与运营方成果
          detail: 在受限环境中选择、打包、部署、更新并维护任务应用。
          outputs:
            - label: Mission applications
            - label: Verified packages
            - label: ATO evidence artifacts
        - label: 目录与控制界面
          detail: 面向买方和运营方的界面位于共享运行时之上。
          modules:
            - label: UDS Registry / 隔离网应用商店
            - label: UDS Fleet 控制平面
            - label: UDS Army 接入路径
        - label: 部署与打包接口
          detail: UDS 提供工具，从本地开发到生产运营，负责软件的打包、部署和管理。
          outputs:
            - label: Packaging workflows
            - label: Deployment operations
        - label: 共享运行时与网络安全服务
          detail: 运行时层处理每个已部署应用都会继承的通用运营服务。
          outputs:
            - label: Networking
            - label: Identity
            - label: Logging and monitoring
            - label: Runtime security
            - label: Compliance support
        - label: 开源交付基础
          detail: Defense Unicorns 以自有开源项目为 UDS 的基础，而不是封闭的专有底层。
          modules:
            - label: Zarf
            - label: Pepr
        - label: 合同与项目接入点
          detail: 商业封装也通过可签约和面向采购的产品界面呈现。
          modules:
            - label: UDS Enterprise
            - label: 部门级 IDIQ 访问权
    approximationNotes: 该技术栈仅反映保留来源中点名的层和模块；没有推断未明确描述的隐藏内部结构、数据存储或控制平面。
    claimRefs:
      - CE002
      - CE006
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Defense Unicorns 先为国防买方和软件供应商降低采购与合规摩擦，再借助这些界面把工作负载推入生产环境。
    data:
      items:
        - label: 隔离环境中的任务需求
          detail: 安全任务软件团队需要跨云、on-premises 和战术边缘环境更新软件。
          touchpoints: UDS is positioned for secure, constrained, or disconnected teams and for deployment from a single artifact.
        - label: 加速合规与 ATO
          detail: UDS 和 UDS Army 将合规证据与继承控制打包进采购流程。
          touchpoints: Support authorization; authorized DevSecOps pipeline; pre-authorized IL4 / IL5 environments.
        - label: Marketplace 发现与演示
          detail: 陆军买方可以在大规模部署前发现、演示和测试获批应用。
          touchpoints: Army App Marketplace; sandbox trial environments; "try before they buy" for Army customers.
        - label: 任务订单采购
          detail: 覆盖整个 DoW 的 IDIQ 缩短了从需求到采购的路径。
          touchpoints: Single-award IDIQ; streamlined task-order process; direct access to UDS Enterprise and UDS Fleet.
        - label: 任务部署与机群更新
          detail: 随后，应用进入生产任务环境。
          touchpoints: Secure runtime, shared cyber services, and updates across distributed operational environments.
        - label: 生态扩张循环
          detail: 点名的软件供应商通过 UDS Army 接入，扩大未来账户覆盖。
          touchpoints: First cohort includes HERE, Kana Systems, Lastwall, Petra Data, Sandtable, and Selas Defense.
    approximationNotes: 该顺序反映公开来源记载的采用路径，而不是各阶段之间经测量的转化率。
    claimRefs:
      - CU002
      - CU005
      - CU009
      - CU010
      - CU011
      - CU012
      - CU014
