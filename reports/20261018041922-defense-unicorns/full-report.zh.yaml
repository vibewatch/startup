      - number: '1.3'
        title: 融资、客户与具名利益相关方
        blocks:
          - type: paragraph
            body: >-
              指定资料中的公开证据支持强劲的融资和采购叙事。Bain Capital 表示其于 2026 年 1 月领投 1.36 亿美元 B 轮，并称该轮使 Defense Unicorns 估值超过 10
              亿美元；公告还列出 Ansa Capital、Sapphire Ventures、Valor Equity Partners、AVP、Uncorrelated Ventures 和 David H.
              Petraeus 参与。商业触达方面，2026 年 9 月的 PRNewswire 新闻稿称，Army Contracting Command Aberdeen Proving Ground
              授予一份单一中标、覆盖全 DoW 的 IDIQ，最高额度为 3.5 亿美元，适用于 UDS Enterprise 和 UDS Fleet。同一新闻稿还称，公司已部署到 100
              多个任务系统和组织，并将海军、空军和太空军列为现有客户。UDS Army 的陆军发布进一步把平台与 DEVCOM C5ISR 及预授权 Azure Government
              环境结合起来；但这些仍是公司发布的采用声明，而非独立的转化证据。
