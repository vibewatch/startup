      - number: '1.4'
        title: 风险信号与未解决缺口
        blocks:
          - type: paragraph
            body: >-
              资料中最有分量的怀疑声音来自 2026 年 2 月的一篇独立文章：文章认为 Big Bang 的一体化技术栈可能带来不必要的运营负担，并削弱运营人员对 Kubernetes 的真正理解。这一批评不能直接证明
              Defense Unicorns
              的产品失败，却点出了国防项目采用单体式安全平台时真实存在的产品和实施风险。对尽调更重要的是，当前整理的公开记录仍未披露确认收入、ARR、毛利率、续约表现、确切客户数、董事会席位或所有权集中度。因此，本章可以确认公司身份、融资、采购触达和运营信号，但无法确认单位经济性或控制结构。
            claimRefs:
              - CO005
              - CO007
              - CO013
              - CO015
      - number: '1.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 真实的采购杠杆已经出现
            body: >-
              指定资料不能证明收入已经实现，但确实显示出有意义的触达：覆盖全 DoW 的 IDIQ 额度、具名军种客户，以及与 DEVCOM 关联的 UDS Army 项目，都提高了 Defense Unicorns
              在国防采购渠道内扩大分销的可能性。
            calloutType: strength
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: callout
            title: 公开指标仍不足以支撑投资判断
            body: 这里的公开记录支持融资势头和招聘广度，却没有足以高置信度支持或挑战独角兽估值的运营指标。收入、留存、毛利率、董事会控制权和确切客户数，仍不在指定证据范围内。
            calloutType: risk
            claimRefs:
              - CO005
              - CO007
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：国防软件交付基础设施，而非泛 IT 支出
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns 将 UDS
              定义为面向军事系统的安全、可移植、原生适配气隙环境的软件交付平台，覆盖云端、本地部署、断连和战术环境中的打包、部署、安全、监控和合规证据。文档和平台页面显示，其可变现边界不是任务应用开发或武器功能本身，而是帮助软件进入已认证任务环境的运行时、打包、分发、授权支持和运营层。开源
              UDS Base 扩大了漏斗顶部的采用；Enterprise、Fleet 和 UDS Army 则表明，付费品类是国防专用的平台和工作流层，而非通用 DevOps 点工具。
            claimRefs:
