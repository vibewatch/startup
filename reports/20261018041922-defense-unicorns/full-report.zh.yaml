      - number: '3.2'
        title: 差异化真实存在，但合同和基线选择会制造摩擦
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开产品差异，在于 Defense Unicorns 强调原生适配气隙环境的打包能力和可移植性。公司文档称，UDS 可以用单一制品部署到云端、本地部署和战术边缘环境，完全离线运行，并生成支持 ATO
              流程的证据。Platform One 和 Big Bang 在标准化安全服务、cATO 对齐和可复用基线方面也展现出重叠价值，因此竞争并非一方完全缺少某项功能，而是项目办公室最终采用哪套基线。Defense
              Unicorns 自身条款还增加了切换摩擦：订阅与购买数量绑定，默认按年续约；软件许可按独立环境配置，除非另行批准转移。这些条款不能证明存在硬锁定，但确实说明客户一旦承诺，环境级打包和采购选择可能变得黏性很强。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP010
              - CP011
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP012
              - CP016
      - number: '3.3'
        title: 持久性更多取决于采购转化，而非公开同行基准
        blocks:
          - type: paragraph
            body: >-
              公开牵引力信号有分量：Defense Unicorns 的 2026 年融资公告称估值超过 10 亿美元，采用量同比增长 300%；后续合同公告称 UDS Enterprise 和 UDS Fleet
              可通过覆盖全 DoW 的单一中标 IDIQ 采购，并提到已部署到 100
              多个任务系统和组织。这些是有用的规模信号，但仍由公司发布。当前指定资料没有披露实际定价、已获资金支持的任务订单转化、续约表现，或与具名商业直接同行的清晰横向基准。因此，护城河论点在采购触达、部署可移植性和文档/合规工作流上最有力；若说成已经证明能隔绝替代技术栈或价格压力，则最薄弱。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP015
