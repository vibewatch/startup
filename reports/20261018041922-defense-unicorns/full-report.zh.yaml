      - number: '2.2'
        title: 市场规模视角：公开国防 IT 预算验证需求，但不能直接构成公司 SAM
        blocks:
          - type: paragraph
            body: >-
              最有力的自上而下视角，是国防部 FY2026 信息技术和网络空间预算请求。该请求显示，国防部 8483 亿美元总预算中包含 661 亿美元 IT/网络空间支出，其中 113.63 亿美元归入任务交付
              IT，282.20 亿美元归入基础设施、安全与 IT 管理，30 亿美元专门用于云和云迁移。这些数字验证了 Defense Unicorns
              所面对的是一个有商业云参与的大型现代化预算池，但它们只是上限视角，不是真正的 TAM/SAM/SOM
              桥接：这些类别远宽于单一气隙软件交付平台，当前公开来源也没有披露其中有多少可触达、可竞争，或已被现有供应商和内部项目锁定。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
