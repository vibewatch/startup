  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资和任务牵引力的公开证据真实存在，但估值支撑因经济指标缺失和溢价入场风险而中断。
    data:
      nodes:
        - id: financing
          label: 融资证据
          value: $136M Series B; >$1B valuation
          note: 公司、投资者和独立报道反复提及。
          tone: positive
        - id: traction
          label: 任务牵引力
          value: 300% adoption claim plus contract access
          note: 信号积极，但大部分证据仍由公司描述。
          tone: positive
        - id: product
          label: 产品契合度
          value: Airgap-native deploy-anywhere platform
          note: 文档强调离线运行、授权支持和供应商中立。
          tone: neutral
        - id: opacity
          label: 经济指标不透明
          value: Revenue still public only as $10-50M range
          note: 没有保留来源披露确切 ARR、毛利率或续约情况。
          tone: risk
        - id: competition
          label: 下行压力
          value: Ceiling conversion and adjacent competitor risk
          note: 授标义务落后于最高估值，竞争对手持续建设安全交付渠道。
          tone: risk
        - id: recommendation
          label: 建议
          value: Research-more at this price
          note: 等待确切经济指标或更好的入场条款。
          tone: risk
    approximationNotes: 各节点总结保留证据，不代表量化概率树。
