  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支持
      - 哪些信息会改变判断
    rows:
      - - 投资逻辑 - 品类相关性
        - 公司、投资人和独立来源都重复提到 $136M Series B 及 >$1B 估值。
        - 精确的增长质量指标可以增强信心。
      - - 投资逻辑 - 任务适配度
        - 文档显示 UDS 是可部署到任何地方、支持离线、支持授权的基础设施，面向受限环境。
        - 可重复的软件毛利率证据会提升护城河价值。
      - - 反向逻辑 - 估值不透明
        - Dealroom 仍只报告估值、收入、融资和员工数的宽泛公开区间。
        - 精确 ARR 或已确认收入，加上续约数据，可以填补对标缺口。
      - - 反向逻辑 - 合同炒作风险
        - 公司公开宣传 $350M IDIQ 额度上限，但公开授标数据强调，有资金支持的义务和期权价值低于额度上限标题所暗示的水平。
        - 任务订单转化和有资金支持的订单储备披露可以降低这一风险。
      - - 反向逻辑 - 竞争
        - Leidos 和 Second Front 都描述了面向政府买方的竞争性安全 DevSecOps 路径，削弱了仅凭独特性进行投资判断的说服力。
        - 相对于相邻平台的明确赢单率和替代数据，可以缓解这一担忧。
    notes: 各行混合了已披露事实和分析框架；合同额度上限不应当作已确认收入或手头现金。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看多
        - IDIQ 访问权转化为有意义的已获资助任务订单，采用率增长进一步转化为稳定的软件收入和利润率。
        - 如果经济指标迅速跟上，当前独角兽入场价格仍可能带来复合增长。
        - 订单转化、利润率结构和续约质量的执行情况。
        - 需要当前公开记录之外的确切 ARR、毛利率和任务订单证据。
      - - 基准
        - 公司持续赢得任务相关性，但公开经济数据仍很粗略，投资者无法清晰证明收入倍数。
        - 回报更多取决于避开下行，而不是从当前水平实现明确的倍数扩张。
        - 软件与服务的构成不透明，条款未披露。
        - 与目前保留的证据相符。
      - - 看空
        - 最高估值叙事跑在已获资助转化之前，竞争对手则进一步深化与机构的关系。
        - 由于入场价格已经计入品类领导地位，平轮或下轮融资风险上升。
        - 倍数压缩、任务订单流转放缓，以及偏服务的业务结构。
        - 有限的公开经济披露和相邻竞争证据共同支持这一判断。
      - - 上行触发因素
        - 管理层提供确切的已确认收入、软件毛利率、续约和已获资助积压订单转化数据。
        - 价格合适时，这可能支持从“继续研究”转向可投资。
        - 数据室仍可能暴露客户集中度偏低或优先权悬置。
        - 保留的公开来源中没有这些信息。
      - - 放弃触发因素
        - 尽调显示，相比合同标题所暗示的规模，已获资助转化率很低，或 Series B 优先权条款激进。
        - 即使采用真实存在，也会令当前估值缺乏吸引力。
        - 优先股堆叠可能封顶普通股的上行空间。
        - 公开层面仍未解决。
    notes: 情景区间仅用于指示方向，因为公开来源对融资和合同背景的披露，比对已实现软件经济效益的披露更精确。
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
