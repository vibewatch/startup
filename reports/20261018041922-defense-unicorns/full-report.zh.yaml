      - number: '8.2'
        title: 融资背景、验证点与公开支持边界
        blocks:
          - type: paragraph
            body: >-
              融资背景总体偏正面。公司和投资人材料在 2026 年 1 月轮次规模、投资人联合体，以及 Defense Unicorns 凭快速且盈利的增长达到独角兽地位这一说法上相互吻合。独立报道还将公司与 2024 年 A
              轮融资及国防任务中的持续产品部署联系起来。但当前价格的公开支持仍不完整，因为最面向市场的保留数据集对估值、收入、总融资和员工数都只报告区间。因此，公开数据足以确认融资势头，却不够精确，无法锚定清晰的收入倍数，也无法评估稀释和下行保护条款。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景框架取决于有资金支持的转化，而非额度标题
        blocks:
          - type: paragraph
            body: >-
              上行情景并不荒唐：公司有一轮已披露融资，有一款明确面向断连和受监管环境的产品，还有一套采购叙事，包括 3.5 亿美元单一中标 IDIQ 上限和 USAspending
              中的既往授标数据。核心投资问题是，这些采购触达有多少会变成有资金支持、可重复、软件占比较高的收入，而不是一次性服务或尚未下单的额度价值。下行情景是，合同额度标题和战略叙事持续跑在实际经济性前面，而相邻竞争者继续与大型集成商一起赢得安全软件交付项目。这种组合可以维持运营相关性，却仍可能让投资人在一个已经溢价的入场点获得疲弱的风险投资回报。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调问题与论点破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              只有管理层能把当前公开区间收窄为可用于投资判断的经济性，这笔交易才具备投资条件。最能改变价格判断的问题包括：确切 ARR
              或确认收入、软件与服务结构、软件毛利率、续约表现、针对合同载体的有资金支持任务订单转化、客户集中度，以及完整的 B
              轮优先股堆叠。如果尽调显示，轮次价格由持久的软件收入和国防项目内可重复的转化支撑，基准情景可以迅速上调；如果材料反而显示有资金支持的转化低、服务占比高，或清算优先权激进，那么即使任务牵引力真实，当前公开证据也指向有限上行空间和显著的下一轮降价风险。
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 公开证据支持耐心，而不是照单全收价格
            body: 建议是“继续研究”：融资势头和任务牵引力看起来真实，但保留的公开来源仍未披露精确收入、利润率、续约或优先权条款数据，无法为超过 10 亿美元的入场估值做投资判断。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV014
