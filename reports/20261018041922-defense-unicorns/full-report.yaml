          - type: callout
            title: Security and usability claims still need independent proof
            body: >-
              The assigned pool is strong on official descriptions of ATO support, control coverage, and portability,
              but it does not independently validate runtime overhead, incident history, or open-source community depth.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
