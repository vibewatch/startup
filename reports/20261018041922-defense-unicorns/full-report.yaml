              - CU002
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.2'
        title: Adoption signals are real, but mostly company-authored
        blocks:
          - type: paragraph
            body: >-
              The public adoption signals are meaningful but still largely company-shaped. Defense Unicorns and its
              investor reposts say adoption in military systems increased 300% year over year in early 2026, and the
              company later said its software was deployed across more than 100 mission systems and organizations. The
              evidence also goes beyond anonymous logo walls: the sources name Navy, Air Force, and Space Force
              customers, and the UDS Army announcement names a first onboarding cohort of HERE, Kana Systems, Lastwall,
              Petra Data, Sandtable, and Selas Defense. Those facts support real traction and a growing vendor
              ecosystem, but they do not disclose how many accounts are paying, which deployments are production versus
              trial, or whether those proofs scale into durable recurring revenue.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU006
              - CU010
      - number: '6.3'
        title: Durability and concentration remain the largest customer unknowns
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the customer story is durability. The assigned source pool does not disclose NRR, GRR,
              churn, renewal rates, contract length, or top-customer concentration, so public evidence currently proves
              access and adoption more clearly than retention. There is also a structural channel risk: Defense Unicorns
              is tightly tied to U.S. defense appropriations and contracting speed. GAO reported in January 2026 that
              about half of the 74 acquisition programs it surveyed saw schedule effects from continuing resolutions,
              and that long CR periods can create contracting-office bottlenecks that limit vendors' ability to complete
              projects. That does not negate customer demand, but it means conversion from interest, contract vehicle
              access, and onboarding to steady software revenue still needs tighter diligence.
            claimRefs:
              - CU005
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public customer proof is stronger on access than on durability
            body: >-
              The public record now shows contract-vehicle access, named service branches, and a first onboarding
              cohort, but it still does not disclose renewal, retention, or concentration metrics that would confirm how
              durable the customer base really is.
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU010
