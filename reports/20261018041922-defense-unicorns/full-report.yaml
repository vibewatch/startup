      - number: '4.2'
        title: Traction proxies and delivery economics
        blocks:
          - type: paragraph
            body: >-
              The best public traction signals are operational rather than financial. Bain's January 2026 announcement
              says the company reached profitable growth and a 300% year-over-year increase in military-system adoption,
              and the September 2026 IDIQ release says the software is deployed across more than 100 mission systems and
              organizations. A separate Tradewinds release points to a Project Blue example in which an ATO pipeline
              reduced one application-update approval cycle to two days versus a traditional process that can take up to
              six months. Those data points help explain buyer value and implementation urgency, but they are not
              substitutes for revenue, CAC, payback, utilization, or gross-margin disclosure. The chapter therefore
              relies on public adoption and procurement signals as proxies while treating unit economics as a diligence
              gap rather than filling it with SaaS-style assumptions.
