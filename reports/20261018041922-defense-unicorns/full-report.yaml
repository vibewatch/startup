      - number: '3.2'
        title: Differentiation is real, but contract and baseline choices create friction
        blocks:
          - type: paragraph
            body: >-
              The strongest public product distinction is Defense Unicorns' emphasis on airgap-native packaging and
              portability. The company documentation says UDS can deploy from a single artifact across cloud,
              on-premises, and tactical-edge environments, operate fully offline, and produce evidence to support
              authority-to-operate processes. Platform One and Big Bang show overlapping value on standardized security
              services, cATO alignment, and reusable baselines, which means the battle is not feature absence on one
              side so much as which baseline a program office standardizes on. Defense Unicorns' own terms add switching
              friction: subscriptions are tied to purchased quantities, annual renewals are the default, and software
              licenses are provisioned per unique environment unless transfer is separately approved. Those terms do not
              prove hard lock-in, but they do show that environment-level packaging and procurement choices can become
              sticky once a customer commits.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP010
              - CP011
              - CP014
              - CP016
