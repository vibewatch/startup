      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The latest financing is clear but the cash-consumption picture is not. Multiple sources agree Defense
              Unicorns raised $136 million in January 2026 at a valuation above $1 billion, and Multiples reports
              roughly $172 million raised across three rounds. Public statements also say the new capital is meant to
              expand UDS, UDS Registry, and UDS Army. Even so, the reviewed record does not disclose cash on hand, burn,
              runway, working capital needs, gross margin, or conversion from procurement access into funded orders and
              recognized revenue. That means the public case supports strategic relevance and financing access, but not
              a defendable view on revenue quality, margin path, or whether the January 2026 round fully funds the next
              growth step without another raise.
            claimRefs:
