        title: Named products, SKUs, and commercialization surfaces
        blocks:
          - type: paragraph
            body: >-
              The public product map is broader than a single platform SKU. Official docs establish the base UDS
              platform, while 2025-2026 reporting and announcements extend that base into Registry/App Store
              distribution and contractable offerings such as UDS Enterprise and UDS Fleet. Bain's Series B announcement
              adds UDS Army as a development priority, which suggests the company is packaging the same airgap-native
              core into buyer-specific channels rather than selling one undifferentiated stack. The underwriting caveat
              is maturity disclosure: the retained evidence identifies the names, roles, and go-to-market surfaces of
              these products, but it does not independently quantify installed base, renewal behavior, or
              GA-versus-pilot status for each SKU.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
