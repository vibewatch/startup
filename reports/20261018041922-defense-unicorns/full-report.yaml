      - number: '2.2'
        title: 'Sizing lenses: public defense IT budgets confirm demand, but not a clean company SAM'
        blocks:
          - type: paragraph
            body: >-
              The strongest public top-down lens is the Department of Defense FY2026 information technology and
              cyberspace budget request. That request frames $66.1 billion of IT/cyberspace spending inside an $848.3
              billion overall DoD budget, with $11.363 billion mapped to mission-delivery IT, $28.220 billion mapped to
              infrastructure, security, and IT management, and $3.0 billion mapped specifically to cloud and cloud
              migration. Those figures validate that Defense Unicorns sells into a large modernization wallet with
              commercial-cloud participation, but they are ceiling lenses rather than a true TAM/SAM/SOM bridge: they
              include categories far broader than one airgap software-delivery platform, and the public sources here do
              not disclose what share of those budgets is addressable, competed, or already committed to incumbents and
              internal programs.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM017
      - number: '2.3'
        title: 'Drivers and constraints: modernization urgency is real, but procurement friction is structural'
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are unusually legible in the assigned evidence set. DoD budget language says software
              modernization needs secure rapid delivery, cloud foundations, modern development-security-operations
              tooling, acquisition-policy evolution, and cyber monitoring, while Defense Unicorns positions its products
              around exactly those gaps in disconnected environments. The adoption path is also buyer-complex: the
              company's own role description spans software vendors, government evaluators, and platform operators,
              implying multi-sided onboarding and approval work before production use. The constraint side is equally
              important for valuation timing. GAO reports that continuing resolutions delay contract awards and
              fielding, can raise costs, and complicate budget execution, which means a valid market need does not
              automatically convert into near-term software revenue or clean deployment velocity for Defense Unicorns.
            claimRefs:
              - CM007
              - CM009
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real demand signal, incomplete monetization signal
            body: >-
              The assigned pool makes the demand thesis believable because DoD software modernization budgets and
              procurement vehicles are clearly real, but it still leaves the monetization thesis under-specified because
              public sources do not disclose price realization, segment mix, or budget-to-revenue conversion.
            calloutType: insight
            claimRefs:
              - CM005
              - CM010
              - CM012
              - CM017
          - type: callout
            title: Procurement timing can overpower category demand
            body: >-
              GAO continuing-resolution evidence means valuation timing depends not only on product-market fit but also
              on whether defense budgets and task orders move fast enough for modernization need to become booked
              software revenue.
            calloutType: risk
            claimRefs:
              - CM005
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape skews toward government and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns positions Unified Defense Stack (UDS) as a portable software-delivery platform for
              secure, disconnected environments, while the independent evidence in this pool points most clearly to
              government-led substitutes rather than a dense field of named commercial peers. Platform One remains a
              credible alternative because its suite spans Big Bang, Iron Bank, Party Bus, and P1 Marketplace, with
              GovCIO describing the program as a standardized, scalable, secure approach to software delivery across
              Defense units. Big Bang itself is documented as a customer-managed deployment path with versioned
              guidance, package references, and operations material. That means the real buyer alternative is often not
              "another startup SKU," but a government baseline, an internal modernization effort, or a program office
              extending existing Platform One components into its own environment.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
