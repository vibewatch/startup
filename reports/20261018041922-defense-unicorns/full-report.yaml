      - number: '1.3'
        title: Funding, customers, and named stakeholders
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned pool supports a strong financing and procurement narrative. Bain Capital
              said it led a $136 million Series B in January 2026 and stated that the round brought Defense Unicorns to
              a valuation above $1 billion, with named participation from Ansa Capital, Sapphire Ventures, Valor Equity
              Partners, AVP, Uncorrelated Ventures, and David H. Petraeus. On the commercial-access side, the September
              2026 PRNewswire release said Army Contracting Command Aberdeen Proving Ground awarded a single-award,
              DoW-wide IDIQ with a $350 million ceiling for UDS Enterprise and UDS Fleet. The same release also claimed
              an installed footprint across more than 100 mission systems and organizations and named the Navy, Air
              Force, and Space Force as existing customers. The UDS Army launch extends that story by pairing the
              platform with DEVCOM C5ISR and pre-authorized Azure Government environments, but those are still
              company-issued adoption claims rather than independent conversion evidence.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO011
              - CO012
              - CO013
