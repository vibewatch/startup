  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Defense Unicorns expands by reducing procurement and compliance friction for both defense buyers and software
      vendors, then using those surfaces to move workloads into production.
    data:
      items:
        - label: Mission need in a disconnected environment
          detail: Secure mission-software teams need updates across cloud, on-premises, and tactical edge environments.
          touchpoints: UDS is positioned for secure, constrained, or disconnected teams and for deployment from a single artifact.
        - label: Compliance and ATO acceleration
          detail: UDS and UDS Army package compliance evidence and inherited controls into the buying motion.
          touchpoints: Support authorization; authorized DevSecOps pipeline; pre-authorized IL4 / IL5 environments.
        - label: Marketplace discovery and demo
          detail: Army buyers can discover, demo, and test approved applications before a larger deployment.
          touchpoints: Army App Marketplace; sandbox trial environments; "try before they buy" for Army customers.
        - label: Task-order procurement
          detail: The DoW-wide IDIQ shortens the path from requirement to purchase.
          touchpoints: Single-award IDIQ; streamlined task-order process; direct access to UDS Enterprise and UDS Fleet.
        - label: Mission deployment and fleet updates
          detail: Applications then move into production mission environments.
          touchpoints: Secure runtime, shared cyber services, and updates across distributed operational environments.
        - label: Ecosystem expansion loop
          detail: Named software vendors onboard through UDS Army to widen future account reach.
          touchpoints: First cohort includes HERE, Kana Systems, Lastwall, Petra Data, Sandtable, and Selas Defense.
    approximationNotes: >-
      The sequence reflects the documented adoption path in public sources rather than measured conversion rates between
      stages.
    claimRefs:
      - CU002
      - CU005
      - CU009
      - CU010
      - CU011
      - CU012
      - CU014
