  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer map and customer motion
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a concentrated defense customer base with two linked motions. First,
              Defense Unicorns positions UDS as infrastructure for mission-software teams operating in secure or
              disconnected environments across cloud, on-premises, and tactical edge settings, which aligns the product
              with military operators and program offices rather than general enterprise buyers. Second, the company is
              trying to widen distribution through procurement and partner channels: the September 2026 IDIQ gives DoW
              organizations a task-order path to UDS Enterprise and UDS Fleet, while UDS Army adds marketplace, sandbox,
              and pre-authorized environment hooks for Army program managers and for software vendors trying to reach
              Army missions. That structure supports a land-and-expand thesis inside defense accounts, but it also
              implies heavy dependence on federal acquisition workflows.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
