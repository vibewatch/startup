              - CP012
              - CP016
      - number: '3.3'
        title: Durability depends on procurement conversion more than public peer benchmarking
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are meaningful: Defense Unicorns' 2026 funding announcement claims a valuation
              above $1 billion and a 300% year-over-year adoption increase, while the later contract release says UDS
              Enterprise and UDS Fleet are available through a DoW-wide single-award IDIQ and cites deployments across
              more than 100 mission systems and organizations. Those are useful scale markers, but they are still
              company-issued. The public record in this assigned pool does not disclose realized pricing, funded
              task-order conversion, renewal behavior, or a clean side-by-side benchmark against named direct commercial
              peers. As a result, the moat argument is strongest when framed around procurement access, deployment
              portability, and documentation/compliance workflows; it is weakest when framed as proven insulation from
              substitute stacks or price pressure.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP015
