  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product does in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns positions UDS as the software-delivery substrate for defense teams that have to move
              applications into secure, constrained, or disconnected environments without rebuilding every platform from
              scratch. The workflow starts with packaging mission software and its dependencies, continues through
              catalog discovery and selection for a specific mission, and ends with delivery into cloud, on-premises, or
              tactical-edge environments where internet access may be limited or absent. The evidence also shows why the
              catalog surface matters: DefenseScoop describes UDS Registry as a mission-software repository that lets
              operators pull only the applications they need for a given mission, while the Airgap App Store broadens
              that same model into a marketplace-oriented front end for compliant mission applications.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
