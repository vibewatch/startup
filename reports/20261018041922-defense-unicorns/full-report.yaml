chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Defense Unicorns consistently describes itself as a defense technology company founded in 2021 and focused
              on making software a strategic deterrent through open-source, airgap-native delivery infrastructure.
              Across company and investor descriptions, the core proposition is not generic DevSecOps consulting but a
              platform approach for packaging, delivering, and sustaining mission software across cloud, on-premises,
              and tactical-edge environments. The UDS documentation adds the clearest product-level explanation: the
              platform is meant to move modern software, together with its dependencies and compliance evidence, into
              disconnected or tightly controlled environments where internet access and one-off platform customization
              are persistent constraints.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO007
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, governance, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The current pool is strongest on founders and operating signals, and materially weaker on formal
              governance. Bain Capital's January 2026 announcement names Rob Slaughter, Jeff McCoy, and Andrew Greene as
              founders, while contemporaneous announcements identify Slaughter as CEO and McCoy as CTO. Hiring evidence
              also shows a company that now spans distinct operating contexts: one platform role is onsite in San
              Antonio supporting secure bare-metal UDS deployments, while another refreshed posting describes a remote
              platform and SRE function covering IAM, monitoring, Iron Bank compliance, and on-call support. A separate
              Mission Manager posting tied to the Navy domain suggests product management capacity dedicated to a
              specific service-line mission rather than a purely generic platform sales motion. What remains missing is
              board composition, ownership, and control-right detail.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
