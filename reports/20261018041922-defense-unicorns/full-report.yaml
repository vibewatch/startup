        title: Architecture, deployment model, and control claims
        blocks:
          - type: paragraph
            body: >-
              The most concrete architecture evidence comes from the official UDS docs, which describe a repeatable
              delivery pattern spanning packaging, runtime services, deployment tooling, and curated packages. The same
              source says UDS is built on open-source foundations including Zarf and Pepr, supporting the company's
              vendor-neutral positioning. Official launch material adds the trust-and-compliance layer: Defense Unicorns
              says UDS can produce ATO evidence, automate parts of the software-delivery lifecycle quickly enough to
              deliver initial security documentation in as little as two weeks, and satisfy up to 90% of the NIST 800-53
              technical controls borne by IL-4/5 program offices. Those statements are important to the value
              proposition, but they remain company claims rather than independently verified control results.
            claimRefs:
