            title: Public peer benchmarking remains thin
            body: >-
              The assigned evidence supports comparisons against Platform One, Big Bang, and internal build paths, but
              it does not provide transparent public pricing or win-rate evidence against named commercial peers. That
              leaves commoditization and price-pressure risk only partially answered.
            calloutType: risk
            claimRefs:
