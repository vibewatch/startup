  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization disclosure
        blocks:
          - type: paragraph
            body: >-
              The reviewed record supports a monetization model built around software platforms deployed into secure
              environments, plus associated services or sustainment work, rather than a self-serve commercial SaaS
              motion. Multiples classifies the revenue model as "Services, Subscription," while Defense Unicorns' own
              documentation describes UDS as a platform to package, deliver, and run software across cloud, on-premises,
              and tactical-edge environments. What remains missing is the commercial layer that matters most for
              underwriting: no reviewed public source discloses list pricing, realized pricing, minimum contract
              commitments, average contract value, or mix between software subscriptions and services. The September
              2026 IDIQ and Tradewinds placement clearly expand procurement accessibility, but they are distribution and
              contracting mechanisms, not public proof of booked revenue or margin quality.
            claimRefs:
