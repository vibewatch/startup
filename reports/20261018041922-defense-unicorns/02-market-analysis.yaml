callouts:
- calloutType: insight
  title: Real demand signal, incomplete monetization signal
  body: The assigned pool makes the demand thesis believable because DoD software modernization budgets and procurement vehicles are clearly real, but it still leaves the monetization thesis under-specified because public sources do not disclose price realization, segment mix, or budget-to-revenue conversion.
  claimRefs:
  - CM005
  - CM010
  - CM012
  - CM017
- calloutType: risk
  title: Procurement timing can overpower category demand
  body: GAO continuing-resolution evidence means valuation timing depends not only on product-market fit but also on whether defense budgets and task orders move fast enough for modernization need to become booked software revenue.
