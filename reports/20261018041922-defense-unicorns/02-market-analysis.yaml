    - Mission program offices and platform owners funding deployment infrastructure
    - Core category defined by the platform and docs surfaces
  - - Open-source UDS Base
    - Core runtime and CLI foundation that can seed adoption
    - Commercial support, hardened images, fleet management, and enterprise-only tooling
    - Engineering teams can adopt without license spend
    - Explains why the top of funnel may exceed near-term monetization
  - - UDS Enterprise and UDS Fleet
    - Commercial runtime, distribution, cyber services, control plane, and support for operational environments
    - One-off custom integration labor not embedded in the product SKU
    - DoW ordering activities acquiring products through task orders or other procurement paths
    - Most direct paid platform wedge in the assigned evidence
  - - UDS Army platform workflow
    - Vendor onboarding, security evaluation, authorization workflows, environment provisioning, and Day 2 operations
    - The end application licenses sold by outside software vendors
    - Army mission sponsors paying for the platform workflow around delivery and authorization
    - Shows the category extends into accreditation and operational workflow, not just package transport
