evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Recognized revenue, ARR, gross margin, renewal behavior, backlog conversion, and a current named customer count.
    whyItMatters: >-
      These metrics are necessary to test whether the >$1B valuation is supported by durable software economics rather
      than procurement access alone.
    diligencePath: >-
      Request a current board deck or finance package with GAAP revenue, recurring revenue mix, gross margin, backlog,
      and customer cohort detail.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, ownership percentages, protective provisions, and liquidation or control rights after the
      Series B.
    whyItMatters: >-
      Without governance detail, the chapter cannot assess control concentration, investor influence, or downside
      protection across the cap table.
    diligencePath: >-
      Obtain the current cap table, board list, stock purchase agreement, and investor rights documents from the data
      room.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: corporate-identity
    missingEvidence: An official corporate page or filing that confirms headquarters and legal entity details.
    whyItMatters: >-
      Current evidence supports operations in San Antonio and profile-card headquarters in Colorado Springs, but not a
      single authoritative corporate identity record.
    diligencePath: >-
      Request the legal entity chart, incorporation records, and the company's own about or contact page with
      headquarters information.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Standard contract pricing, discounting behavior, and software-versus-services mix for UDS Enterprise, Fleet, and
      UDS Army.
    whyItMatters: Without realized pricing, public budget lenses cannot be converted into a credible SAM/SOM or unit-economics view.
    diligencePath: Request recent price sheets, representative task orders, and revenue mix by product line from management.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: segment-conversion
    missingEvidence: >-
      A segment-level bridge from DoD and Army modernization budgets to the portion that can realistically be captured
      by an airgap software-delivery platform.
    whyItMatters: >-
      The public budget data validate need, but they do not show how much spend is contestable, recurring, or relevant
      to this exact product category.
    diligencePath: >-
      Ask management for pipeline by segment, task-order conversion, and win-loss evidence against incumbents and
      internal build.
    relatedQuestionRefs:
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: revenue-conversion
    missingEvidence: >-
      Booked revenue, backlog conversion, renewal behavior, and funded task-order cadence under the public procurement
      vehicles.
    whyItMatters: >-
      Procurement access is valuable only if it converts into recurring software revenue on a timeline that supports the
      valuation.
    diligencePath: Obtain cohort-level bookings, backlog, and renewal data tied to the IDIQ and other federal channels.
    relatedQuestionRefs:
      - QM007
      - QM009
  - type: missing-source
    severity: material
    topic: direct-commercial-peers
    missingEvidence: >-
      Named direct commercial peer profiles with source-backed capability, pricing, and customer-footprint evidence for
      the same defense software-delivery job.
    whyItMatters: >-
      Without public peer benchmarks, it is hard to test whether Defense Unicorns competes on superior product economics
      or simply on niche procurement access.
    diligencePath: >-
      Collect competitor pricing pages, product docs, customer references, and procurement records for at least two
      direct commercial alternatives.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: task-order-conversion
    missingEvidence: >-
      Funded task-order volume, renewal rates, and realized expansion behavior under the IDIQ and other procurement
      vehicles.
    whyItMatters: >-
      Contract ceiling and access matter less than funded conversion when underwriting whether procurement scale is a
      durable moat.
    diligencePath: Request booking, backlog-conversion, and renewal cohorts by program, vehicle, and environment count.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: Representative order-form economics, environment counts, discount ranges, and services mix by customer type.
    whyItMatters: Public terms reveal contract mechanics but not buyer willingness to pay or margin durability.
    diligencePath: Obtain anonymized order forms or pricing summaries segmented by agency, deployment scope, and support level.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Realized pricing by product contract type discounting and average contract value
    whyItMatters: >-
      Without pricing realization it is impossible to distinguish software leverage from services-heavy delivery
      economics.
    diligencePath: Request customer contracts or redacted order forms plus a price realization bridge by product family.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance monthly burn runway and any debt or project-finance obligations
    whyItMatters: The January 2026 round size alone cannot establish whether the company is fully funded to the next milestone.
    diligencePath: Obtain board or lender reporting that shows cash burn runway covenant exposure and planned use of funds.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Funded task-order conversion backlog and renewal data under the IDIQ and related procurement channels
    whyItMatters: Procurement access only matters economically if it converts into durable revenue and renewals.
    diligencePath: >-
      Request awarded order history backlog conversion and renewal cohorts for programs entering through IDIQ or
      marketplace channels.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: independent-security-validation
    missingEvidence: >-
      Independent security assessments live status or incident history and customer-operational evidence validating UDS
      reliability and control claims.
    whyItMatters: >-
      The strongest public trust claims are company-authored so underwriters still do not know whether the 2-week ATO
      workflow 90-percent-control statement and runtime-security posture hold in production environments.
    diligencePath: >-
      Request current IL4 or IL5 authorization packages third-party assessments uptime and incident logs and at least
      two operator references who can speak to deployment reliability.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository release download issue and contributor metrics for Zarf Pepr UDS packages or other maintained
      artifacts.
    whyItMatters: >-
      Defense Unicorns emphasizes open-source foundations and vendor neutrality but the assigned pool does not prove
      external developer adoption maintenance depth or ecosystem pull.
    diligencePath: >-
      Pull GitHub and package-registry evidence for Zarf and Pepr then add practitioner-community references that show
      adoption release cadence and issue response.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: private-evidence-only
    severity: material
    topic: sku-maturity
    missingEvidence: >-
      SKU-level GA or pilot status deployed install base and expansion or renewal evidence for UDS Army UDS Fleet
      Registry or App Store and Tactical Edge.
    whyItMatters: >-
      The product family is expanding faster than public maturity evidence so product-risk underwriting depends on
      understanding which offerings are scaled products versus emerging channels.
    diligencePath: >-
      Request a current SKU matrix with GA dates customer counts deployment stage and referenceable programs by product
      line.
    relatedQuestionRefs:
      - QE002
      - QE006
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: retention-and-renewal
    missingEvidence: Public metrics for NRR, GRR, churn, renewal rates, contract duration, and cohort behavior.
    whyItMatters: Retention and renewal quality determine whether customer traction converts into durable software revenue.
    diligencePath: Request cohort retention, renewal, and contract-duration data by program and service branch from management.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Named top-customer mix, funded task-order conversion, and revenue share by military branch or agency.
    whyItMatters: >-
      The public record suggests heavy federal-buyer concentration, but it does not quantify how exposed revenue is to a
      narrow set of programs.
    diligencePath: Request top-10 customer concentration, task-order conversion, and backlog realization by program office.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Production-versus-pilot status, contract scope, and outcome metrics for each named service branch and vendor
