    rows:
      - [Defense Unicorns UDS, Commercial defense software-delivery platform, "Valuation above $1B, $136M Series B, >100 mission systems / organizations cited in company releases", "DoW organizations, allied users, commercial vendors delivering to Army missions", "Airgap-native runtime, registry, and fleet management positioned for cloud, on-prem, and tactical edge", "Realized pricing, renewal behavior, and funded conversion are not public"]
      - [Platform One suite, Government-run DevSecOps infrastructure and substitute baseline, "GovCIO describes P1 as a standardized, scalable software-delivery engine used across military modernization efforts", "Air Force and wider DoD programs seeking secure software delivery and cATO-aligned baselines", "Marketplace, Big Bang, Party Bus, and Iron Bank combine acquisition path with reusable secure tooling", "Retained sources do not disclose price, total deployments, or whether it fully substitutes for portable commercial artifacts"]
      - [Big Bang, Government/open-source stack component within the Platform One ecosystem, "Versioned user guide, package docs, release notes, and training portal are publicly maintained", "Teams evaluating or operating customer-managed secure deployments", "Customer-managed deployment path and integrated package documentation support in-house operation", "Public docs show capabilities and guidance, not economic outcomes or head-to-head win rates"]
      - [Internal legacy / one-off build, Status-quo internal alternative, "GovCIO cites decades of tightly coupled systems as a major modernization hurdle", "Program offices extending existing systems instead of adopting a new external platform", "Avoids external vendor procurement and can reuse existing data and interfaces", "Legacy integration burden and accreditation complexity can slow delivery and increase maintenance load"]
    notes: Public evidence is uneven across alternatives; cells preserve company-issued and independent statements separately, and missing pricing or deployment detail remains unknown rather than estimated.
    claimRefs: [CP001, CP004, CP005, CP006, CP007, CP008, CP009, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Defense Unicorns
      - Platform One / Big Bang substitute
      - Evidence-backed implication
    rows:
      - [Disconnected deployment and updates, "UDS is described as airgap-native and able to ship software with dependencies into disconnected environments", "GovCIO says Platform One provides secure, scalable delivery, but the retained source does not claim the same portable single-artifact airgap packaging language", "Defense Unicorns has the sharper public message for disconnected artifact portability"]
      - [Shared security and runtime services, "UDS Core handles networking, identity, logging, monitoring, runtime security, and compliance", "GovCIO says Big Bang integrates DevSecOps tools for continuous evaluation plus monitoring and logging", "Both sides sell a baseline/platform story, so standardization choice matters as much as raw features"]
      - [ATO / accreditation support, "UDS docs say the platform produces compliance documentation and evidence to facilitate ATO processes", "GovCIO says Platform One is aligned with continuous authority to operate principles", "Neither side has a monopoly on compliance positioning in the retained public record"]
      - [Acquisition and channel access, "Defense Unicorns cites a DoW-wide single-award IDIQ and UDS Army as a path for vendors into Army missions", "GovCIO says P1 Marketplace offers a streamlined acquisition pathway with continuous industry onboarding", "Competitive advantage may come from contract path and onboarding speed, not only product depth"]
      - [Lock-in versus openness, "UDS docs say the platform is built on open-source foundations with no proprietary lock-in", "GovCIO says open source is foundational to Platform One, and Big Bang offers customer-managed deployment guides", "Open-source claims soften lock-in rhetoric, but environment baselines and accreditation still create switching work"]
    notes: Unsupported cells are stated as unknown; this matrix compares only capabilities that the retained sources describe directly.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP011, CP014, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public contract / price model
      - Included capabilities
      - Disclosure limits
      - Implication
    rows:
      - [Defense Unicorns subscriptions and services, "Fees are set in Order Forms, separate quotes, or standard prices; quantities are purchased rather than usage-based; renewals default annually", "Software packages, subscriptions, professional services, and support under the agreement", "No public SKU list, realized price, discounting, or average deployment footprint is disclosed", "Price competition cannot be benchmarked cleanly from public sources"]
      - [Defense Unicorns environment license, "Unless otherwise specified, each software license is provisioned per Unique Environment and cannot transfer without written approval", "Access and use rights for the licensed software and associated documentation", "Public terms show contract mechanics, not actual buyer spend or environment counts", "Environment-based provisioning can raise migration and multi-homing friction after adoption"]
      - [Platform One / Big Bang substitute path, "No public commercial pricing is disclosed in the retained competitor sources", "Marketplace, Big Bang, Iron Bank, and related government-run tooling", "The retained evidence does not expose comparable list prices or funded operating cost", "Buyers may compare vendor path versus internal budget and acquisition speed instead of apples-to-apples pricing"]
    notes: Public pricing is largely absent; the table compares contract mechanics and disclosure posture rather than inventing list-price equivalents.
    claimRefs: [CP005, CP006, CP010, CP012, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal map of the alternatives most visible in the retained public evidence, emphasizing that Defense Unicorns competes against government baselines and internal-build paths as much as against named commercial peers.
    data:
      xAxis:
        label: Deployment portability / disconnected readiness
        min: 0
        max: 10
        low: Low
        high: High
        description: Estimated ordinal score from retained source descriptions, not a measured benchmark.
        scale: ordinal
      yAxis:
        label: Distribution / institutional baseline reach
        min: 0
        max: 10
        low: Low
        high: High
        description: Estimated ordinal score from retained source descriptions, not a measured benchmark.
        scale: ordinal
      points:
        - label: Defense Unicorns UDS
          x: 9
          y: 8
          tone: positive
          note: Airgap-native, portable artifact delivery plus IDIQ access.
        - label: Platform One suite
          x: 6
          y: 9
          tone: neutral
          note: Broad government baseline with cATO-aligned distribution and Marketplace reach.
        - label: Big Bang
          x: 5
          y: 7
          tone: neutral
          note: Customer-managed secure stack inside the Platform One ecosystem.
        - label: Iron Bank / Big Bang baseline
          x: 4
          y: 8
          tone: neutral
          note: Strong supply-chain and baseline integration signal, but less evidence here on portable end-to-end artifact delivery.
        - label: Internal legacy modernization
          x: 2
          y: 6
          tone: warning
          note: Deeply embedded in existing programs, but slowed by tightly coupled legacy systems.
        - label: Program-specific one-off build
          x: 3
          y: 4
          tone: warning
          note: Avoids vendor adoption, but typically lacks the reusable baseline and acquisition shortcuts shown by the other paths.
    approximationNotes: Positioning scores are ordinal judgments anchored to the retained source text; they should be read as relative placement, not audited numeric benchmarks.
    claimRefs: [CP001, CP004, CP005, CP006, CP011, CP014]
callouts:
  - calloutType: insight
    title: Competitive pressure is as much about distribution as features
    body: The strongest substitutes in the retained evidence bundle combine secure runtime tooling with acquisition pathways and government baselines. That means Defense Unicorns needs procurement conversion and program-standardization wins, not just technical differentiation.
    claimRefs: [CP006, CP007, CP011, CP013]
  - calloutType: risk
    title: Public peer benchmarking remains thin
    body: The assigned evidence supports comparisons against Platform One, Big Bang, and internal build paths, but it does not provide transparent public pricing or win-rate evidence against named commercial peers. That leaves commoditization and price-pressure risk only partially answered.
    claimRefs: [CP012, CP013]
