callouts:
  - calloutType: "strength"
    title: "Real procurement leverage is visible"
    body: >-
      The assigned pool does not prove realized revenue, but it does show meaningful access:
      a DoW-wide IDIQ ceiling, named service-branch customers, and a DEVCOM-linked UDS Army
      program all improve the odds that Defense Unicorns can expand distribution inside
      defense procurement channels.
    claimRefs: ["CO011", "CO012", "CO013"]
  - calloutType: "risk"
    title: "Public metrics are still too thin for underwriting"
    body: >-
      The public record here supports financing momentum and hiring breadth, but not the
      operating metrics that would justify or challenge the unicorn valuation with high
      confidence. Revenue, retention, gross margin, board control, and exact customer counts
      remain outside the assigned evidence.
    claimRefs: ["CO005", "CO007"]
