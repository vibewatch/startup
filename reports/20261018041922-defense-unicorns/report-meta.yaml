  topStrengths:
    - >-
      Airgap-native product positioning matches a hard defense deployment problem and is backed by multiple direct
      product descriptions.
    - >-
      Public financing and procurement signals show real investor support and widening access to Department of War
      buyers.
    - The company has named branch-level customers and a larger post-Series-B mission-system footprint.
  topRisks:
    - Revenue, gross margin, renewal, and preference-term disclosure remain too coarse for clean underwriting.
