    - >-
      Public sources do not show standard pricing realization, average environments per account,
      software-versus-services mix, or headcount and cleared-labor composition.
    - >-
      Board composition, ownership percentages, control rights, and Series B preference terms remain outside the public
      record.
    - >-
      The $350 million contract-vehicle claim, 100-plus mission-system footprint, and partner-channel traction still
      need tighter evidence on funded conversion, renewal behavior, and direct economic value.
