    claimRefs: [CP006, CP007, CP016]
  - calloutType: risk
    title: "Model-layer differentiation is not proven"
    body: "The retained evidence does not provide an independent accuracy benchmark, realized price comparison, or analyst placement for Instabase, while competitors and cloud platforms continue to expand document-AI capabilities."
    claimRefs: [CP012, CP014, CP015]

