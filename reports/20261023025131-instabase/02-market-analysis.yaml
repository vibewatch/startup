callouts:
  - calloutType: insight
    title: "The investable market is narrower than the headline TAM"
    body: "Instabase's relevant wedge is enterprise IDP for regulated, document-heavy workflows where integration, validation, and auditability matter; generic AI or OCR spend should not be counted as equivalent serviceable demand."
    claimRefs: [CM001, CM003, CM004, CM011]
  - calloutType: risk
    title: "Forecast dispersion is material"
    body: "The assigned analysts span USD 3.17B to USD 4.31B for 2026 and 17.78% to 33.8% CAGRs, so a valuation case that depends on one published TAM would be fragile."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
  - calloutType: recommendation
    title: "Test production conversion by workflow"
    body: "Diligence should request paid-production conversion, document volumes, exception rates, implementation time, renewal behavior, and realized savings by vertical because public evidence does not isolate Instabase's SAM, SOM, or workflow-level ROI."
    claimRefs: [CM013, CM014, CM015]
