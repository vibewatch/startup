      - [Healthcare, "Health-plan or provider operations", "Records, authorization, and billing teams", "Healthcare administration", "Sensitive records, prior authorization, and workflow throughput", "Operations or compliance"]
      - [Government and public sector, "Agency modernization and program owners", "Caseworkers and reviewers", "Agency technology budget", "Forms, records, and accountable public workflows", "Program, procurement, or IT"]
    notes: "Segment roles are an evidence-constrained adoption map from the assigned market and product sources; public sources do not disclose Instabase's exact budget-owner mix or conversion rates by segment."
    claimRefs: [CM003, CM004, CM011, CM012, CM013]
