      - ["Axa", "Insurance", "Enterprise document-processing use case", "Named customer reference; production status not stated", "Supports insurance vertical relevance", "No outcome, scope, or retention evidence"]
      - ["Sonic Automotive", "Transportation / retail", "Enterprise document automation", "Named customer reference; production status not stated", "Broadens vertical evidence beyond financial services", "No use-case or commercial detail"]
    notes: "This is a partial, source-bounded enumeration of named references; a named logo or directory listing does not prove active production use, retention, or revenue contribution."
    claimRefs: [CU009, CU003, CU013]
figures:
  - id: FU001
    title: Customer journey from document intake to expansion
    type: journey-map
    summary: Public evidence maps a regulated enterprise journey from document-heavy workflow selection through extraction, human review, deployment, and potential multi-workflow expansion.
    data:
      nodes:
        - id: intake
          label: Document-heavy workflow
          title: Document-heavy workflow
          detail: "Banks, insurers, government agencies, and other enterprises identify a high-friction process."
          touchpoints: ["PDFs, scans, emails, and forms", "Compliance and operations stakeholders"]
        - id: build
          label: Configure application
          title: Configure application
          detail: "Teams build or customize an application for reading, extracting, classifying, and validating content."
          touchpoints: ["Custom workflow", "OCR and NLP tooling"]
        - id: review
          label: Validate and route exceptions
          title: Validate and route exceptions
          detail: "Structured outputs are checked against confidence thresholds and may route exceptions to human review."
          touchpoints: ["Human-in-the-loop review", "Auditability requirement"]
        - id: deploy
          label: Operate at enterprise scale
          title: Operate at enterprise scale
          detail: "Deployment can span cloud, hybrid, or on-premises requirements in regulated environments."
          touchpoints: ["Production workflow", "Data residency and deployment constraints"]
        - id: expand
          label: Add workflows and data types
          title: Add workflows and data types
          detail: "A successful deployment may extend to additional document types, use cases, or business units."
          touchpoints: ["450+ data types reported for one solution", "Potential cross-workflow expansion"]
        - id: renew
          label: Renew and reference
          title: Renew and reference
          detail: "Durability must be demonstrated through renewals, repeat usage, and customer references rather than inferred from logos."
          touchpoints: ["Renewal cohort", "Reference call", "Expansion evidence"]
    claimRefs: [CU002, CU005, CU007, CU010]
callouts:
  - calloutType: recommendation
    title: Underwrite usage, not logos
    body: Request customer-level ARR or revenue concentration, active deployment counts, renewal cohorts, reference calls, and security-incident remediation evidence before treating the public customer set as durable adoption.
    claimRefs: [CU012, CU013, CU014, CU015]
