company:
  name: Instabase
chapter:
  number: 6
  title: Customers
  summary: Instabase has public evidence of enterprise document-processing use cases and a named partner deployment, but public customer-count, retention, and concentration data remain limited. The strongest adoption signal is a Weaviate case study describing production-scale processing, while directory and review pages provide broader but lower-confidence coverage of customer references.
sections:
  - id: customer-segments
    title: Buyer, user, and workflow segmentation
    body: >-
      Instabase is positioned for document-heavy enterprise workflows rather than a self-serve consumer product. The available evidence points to operations, finance, and compliance teams as users, with banks, insurers, government organizations, transportation, retail, and other large enterprises as target or reported customer segments. The use-case pattern is consistent across sources: customers submit heterogeneous documents, the platform extracts and classifies information, and downstream teams use the result for decisions such as income verification, underwriting, claims intake, or regulatory workflows. This supports a multi-stakeholder enterprise sale, but the pool does not disclose segment-level revenue, payer identity, contract size, or geographic mix.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption and named customer proof
    body: >-
      Public adoption proof is uneven but not absent. Weaviate's partner case study reports that Instabase processed more than 500K varied documents per day, stored 50K-plus tenants in a cluster, and supported 450-plus data types for one customer solution; these are company-described operating metrics reproduced by a technology partner, not independently audited KPIs. The same case study identifies mortgage underwriting, driver's-license verification, insurance submissions, and public-sector workflows, while the public directory pages claim six reviews, 13 case studies, and 19 references or reviews. Named production evidence is strongest for İşbank's money-order-processing deployment in the IDP directory, but the source does not provide contract size or outcome measurement.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-expansion
    title: Retention, expansion, and commercial durability
    body: >-
      The evidence supports a plausible land-and-expand motion but does not establish retention. Instabase's platform is described as customizable and capable of serving multiple workflows, which can create expansion potential after an initial document-processing deployment. A Chief Revenue Officer appointment also indicates an explicit effort to scale enterprise adoption and channel partnerships. However, no source in the assigned pool reports net revenue retention, gross retention, churn, renewal rates, contract duration, cohort behavior, customer satisfaction, or expansion revenue. The appropriate diligence conclusion is therefore that product breadth and sales leadership are observable, while commercial durability remains unverified and should not be inferred from logos, reference counts, or partner usage metrics.
    claimRefs: [CU010, CU011, CU012]
  - id: concentration-risks
    title: Concentration and customer diligence risks
    body: >-
      Customer concentration cannot be quantified from the public evidence. The available pages mention large financial institutions and other regulated enterprises, but do not identify the top-customer revenue share, largest account, renewal calendar, channel dependence, or procurement cycle. The customer proof is also exposed to source-quality limitations: several records are directories or vendor-authored pages, and the public incident tracker reports a disclosed breach affecting under 1,000 records in April 2026. That incident is not evidence of customer churn, but it raises a concrete diligence question about affected customers, notification scope, remediation, and whether security controls influenced renewals or expansion. Investors should require customer-level revenue and retention schedules before underwriting durability.
    claimRefs: [CU013, CU014, CU015]
    callouts:
      - calloutType: strength
        title: Production-scale operating signal
        body: A partner case study reports more than 500K documents per day, 50K-plus tenants, and 450-plus data types for a customer solution, offering a stronger adoption signal than logo-only marketing while remaining company-described.
        claimRefs: [CU005, CU006, CU007]
      - calloutType: risk
        title: Retention and concentration are opaque
        body: No assigned source discloses NRR, GRR, churn, renewal behavior, contract length, top-customer share, or customer-level revenue, so durable adoption and concentration risk remain open underwriting questions.
        claimRefs: [CU012, CU013, CU014]
