company:
  name: Instabase
chapter:
  number: 4
  title: Financials
  summary: Instabase has an enterprise subscription-oriented document-AI model with public evidence of a $100M 2025 Series D and reported revenue around $50M, but private-company disclosure does not establish realized pricing, margins, cash, burn, or runway. The financial underwriting case therefore depends on validating revenue quality, implementation economics, and remaining capital adequacy rather than treating third-party estimates as audited results.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Instabase sells an AI-powered, low-code automation platform that converts
      unstructured sources into machine-readable data and automates document-heavy
      workflows. StartEngine describes the offering as serving major enterprises,
      including Uber and four of the five largest U.S. banks, while the company
      profile from Multiples describes a subscription revenue model, while IDP
      Software describes use cases
      in banking, insurance, healthcare, and public-sector workflows. Those sources
      support a high-value enterprise motion, but neither list pricing nor realized
      revenue by customer or segment. Multiples reports $50M of latest recorded
      revenue in January 2025 and labels the figure as revenue or ARR recorded
      alongside funding rounds; AskCyborg separately reports $50M revenue for 2023
      and explicitly says its AI-generated research is not independently verified.
      The appropriate underwriting distinction is therefore between company or
      analyst-reported traction and recognized revenue, with mix, cohort retention,
      concentration, and contract accounting still open.
      TechList estimates 43.8K monthly visits to instabase.com, but its own
      methodology warns that public-source data may not be current; this is only a
      weak top-of-funnel proxy, not evidence of bookings or revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI001]
  - id: cost-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Public evidence points to a software-led product with potentially meaningful
      implementation and compute costs. IDP Software reports custom-quote pricing,
      no free tier, API-driven workflow automation, cloud and hybrid deployment, and
      an AWS migration that it attributes to a 30% compute-cost reduction, 20%
      performance improvement, and 70% lower development-environment costs using
      EC2 Spot Instances. These are operating-cost signals, not a gross-margin
      disclosure. The same source says deployments typically require solution design,
      document-model tuning, integration work, and ongoing monitoring; this creates
      a diligence need to separate recurring platform revenue from professional
      services and customer-specific delivery effort. No eligible source supplies
      CAC, payback, gross margin, contribution margin, implementation margin, or
      customer-level usage economics, so those fields remain unavailable rather
      than estimated.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Instabase raised a $100M Series D in January 2025, led by Qatar Investment
      Authority with participation from existing investors, according to FinSMEs
      and Silicon Valley Daily. The refresh pool also contains inconsistent
      third-party funding totals: Venture Capital Tracker says total funding
      exceeds $322M, while Multiples reports $292M across six rounds and IDP
      Software reports $322M across seven rounds. These discrepancies are themselves
      a diligence issue; funding raised is not cash currently available. The same
      sources do not disclose cash on hand, burn, debt, runway, liquidation
      preferences, or a next-round trigger. A Board Cybersecurity record reports a
      confirmed breach disclosed April 13, 2026 with fewer than 1,000 estimated
      records affected; it does not quantify financial impact, so the event is a
      risk signal rather than a modeled loss. QuantLogix offers a model estimate
      below its cited last-round mark, but labels it a research estimate rather
      than a quote. Financially, Instabase merits a cautious track posture pending
      primary statements, contract-level revenue quality, and capital-use evidence.
      Company-issued syndicated coverage says the Series D proceeds were intended
      to expand AI Hub's automation, analysis, and search capabilities, but does
      not quantify remaining capital or expected payback.
    claimRefs: [CI009, CI010, CI011, CI012, CI016]
    tableRefs: [TI003]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Current value/status, Quality, Diligence ask]
    rows:
      - [Platform subscription, "AI Hub and document/workflow automation for enterprise use", "Subscription model reported; price not disclosed", "Third-party profile; not audited", "Obtain ARR-to-revenue bridge, contract terms, renewal and concentration data"]
      - [Usage or workflow revenue, "Document extraction, classification, search, and agentic automation", "Mechanism described; unit metric not disclosed", "Product description only", "Confirm whether billing is seat-, document-, workflow-, or outcome-based"]
      - [Implementation and services, "Solution design, model tuning, integration, and monitoring", "Required effort described; revenue mix not disclosed", "Operational inference from implementation description", "Separate services revenue and delivery cost from recurring platform revenue"]
      - [Customer traction, "Enterprise deployments in banking, insurance, healthcare, and government", "Four of five largest U.S. banks and Uber claimed by offering page", "Company/offer-page claim", "Verify active contracts, revenue contribution, and customer concentration"]
    notes: >-
      Values distinguish reported mechanisms and claims from recognized revenue;
      no row establishes audited revenue or ARR.
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI002
    title: Pricing and unit-economics availability
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [List price, null, "Unavailable", "Custom quoting prevents public price benchmarking", "Collect standard price card, discount bands, and realized ACV by segment"]
      - [Gross margin, null, "Unavailable", "Compute, review, and delivery intensity may affect software margins", "Obtain GAAP gross margin and cost-of-revenue bridge"]
      - [CAC and payback, null, "Unavailable", "Enterprise sales efficiency determines capital needs", "Provide fully loaded sales and marketing spend, bookings, cohort payback"]
      - [Retention / NRR, null, "Unavailable", "Expansion and churn determine revenue quality", "Provide logo retention, dollar retention, churn, and expansion by cohort"]
      - [Compute cost, "30% reduction attributed to AWS migration", "Medium; third-party profile", "Signals possible infrastructure leverage but not margin", "Reconcile baseline, period, workload, and customer pass-through"]
      - [Implementation effort, "Solution design, tuning, integration, and monitoring described", "Medium; third-party profile", "May create services burden and slower deployment", "Measure implementation hours, time-to-value, and support cost by deployment"]
    notes: >-
      Null means no eligible public value was found in the assigned pool; it is
      not zero and does not imply the metric is immaterial.
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Capital adequacy evidence matrix
    columns: [Input, Public evidence, Underwriting interpretation, Remaining gap]
    rows:
      - [Latest financing, "$100M Series D in January 2025", "Fresh financing is evidence of investor support at that date", "Obtain capitalization table and current cash balance"]
      - [Stated use of funds, "Expand AI Hub automation, analysis, and search", "Company-issued plan, not evidence of realized returns", "Obtain actual spend, milestones, and return on invested capital"]
      - [Valuation, "$1.24B reported by several profiles; QuantLogix also publishes a lower model estimate", "Private marks are not continuously priced", "Verify post-money terms, preferences, and any secondary price"]
      - [Total funding, "$292M, $322M+, and $322M are all reported in the pool", "Totals are inconsistent and not cash-on-hand", "Reconcile round chronology and exclude secondary/debt amounts"]
      - [Cash / burn / runway, null, "Capital adequacy cannot be calculated", "Obtain monthly cash flow, debt schedule, and runway case"]
      - [Financial incident exposure, "Confirmed breach; under 1,000 estimated records", "Potential remediation or churn risk is unquantified", "Request incident costs, insurance coverage, and customer impact"]
    notes: >-
      This is a public-evidence matrix, not a cash forecast; financing raised,
      valuation, and accounting performance are separate quantities.
    claimRefs: [CI009, CI010, CI011, CI012, CI016]
figures:
  - id: FI001
    title: From enterprise activity to financial underwriting
    type: flow
    summary: Publicly described enterprise activity can support revenue-quality analysis, but private disclosure leaves margin and capital-adequacy steps unresolved.
    data:
      nodes:
        - id: enterprise-workflows
          label: Enterprise document workflows
          detail: Banking, insurance, healthcare, and government use cases are described in assigned sources.
        - id: platform-monetization
          label: Platform subscription / custom quote
          detail: Subscription model and custom quoting are reported; realized pricing is unavailable.
        - id: delivery-costs
          label: Compute plus implementation
          detail: AWS cost reduction and solution-design, tuning, integration, and monitoring requirements are reported.
        - id: revenue-quality
          label: Revenue quality
          detail: Revenue or ARR estimates exist, but recognized revenue, mix, retention, and concentration are not disclosed.
        - id: capital-adequacy
          label: Cash, burn, runway
          detail: A $100M Series D is reported, but cash on hand, burn, debt, and runway remain unavailable.
        - id: underwriting-decision
          label: Underwriting decision
          detail: Current evidence supports a cautious track posture pending private financial diligence.
      edges:
        - from: enterprise-workflows
          to: platform-monetization
        - from: platform-monetization
          to: delivery-costs
        - from: delivery-costs
          to: revenue-quality
        - from: revenue-quality
          to: capital-adequacy
        - from: capital-adequacy
          to: underwriting-decision
    claimRefs: [CI001, CI005, CI009, CI011]
callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: Cash, burn, runway, gross margin, retention, and realized pricing are not publicly disclosed in the assigned evidence, so the financing need and downside case cannot be quantified.
    claimRefs: [CI008, CI011]
  - calloutType: insight
    title: Evidence-quality distinction
    body: Public sources support an enterprise platform and financing history, but inconsistent third-party funding totals and revenue labels require reconciliation before valuation or runway conclusions are treated as decision-grade.
    claimRefs: [CI003, CI009, CI010]
