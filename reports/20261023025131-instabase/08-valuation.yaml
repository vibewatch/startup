artifact: valuation
slug: instabase
runDate: 2026-10-23
company:
  name: Instabase
chapter:
  number: 8
  title: Valuation
  summary: Instabase has a public financing anchor but no public operating disclosures sufficient to underwrite a precise intrinsic value. The January 2025 Series D and subsequent third-party marks support a track-or-research-more stance until revenue quality, terms, and downside protection are verified.
sections:
  - id: investment-view
    title: Investment view
    body: >-
      Instabase has credible enterprise-document automation positioning, but the valuation case is
      constrained by disclosure. Tracxn records a $100M Series D dated January 17, 2025 at a $1.24B
      post-money valuation, while Venture Capital Tracker also reports a $1.24B Series D mark and
      $322M-plus total funding. Those figures are financing-history evidence, not proof of current
      fair value or cash available to common shareholders. QuantLogix reports a conflicting $801.78M
      last disclosed round value and a model price of $524.38M, explicitly describing the latter as
      a research estimate rather than a quote or target. The conflict itself is material: a buyer
      cannot select an entry price without reconciling whether the marks use different share classes,
      dates, or data definitions. The recommendation is therefore track/research-more rather than
      buy, with price discipline contingent on verified ARR or revenue, gross margin, retention,
      burn, cap-table terms, and liquidation preferences.
    claimRefs: [CV001, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The positive thesis is that Instabase sells a workflow layer around difficult, regulated
      document processes rather than only commodity OCR. Its official AI Hub page lists extraction,
      validation, human review, deployment controls, connectors, monitoring, and a 99.5% uptime SLA;
      the independent IDP overview describes context-first processing, audit trails, hybrid deployment,
      and named deployments including İşbank. These features can support durable enterprise switching
      costs if customers pay for governed outcomes. The anti-thesis is that the model layer is
      becoming easier to substitute and the public record does not provide third-party accuracy,
      revenue, pricing, retention, or analyst benchmarks. The same IDP overview says no pricing,
      model specifications, accuracy benchmarks, or major analyst placements have been published.
      A 2026 breach record adds a diligence item for security controls and customer remediation.
      Thus product credibility is not equivalent to valuation support; the key test is whether
      measurable, repeatable customer economics justify a premium to private-market and public SaaS
      reference points.
    claimRefs: [CV006, CV007, CV008, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-comps
    title: Scenarios and comparable reference points
    body: >-
      A revenue-multiple framework is the least-wrong public method while company financials remain
      private, but it must be treated as a range rather than a target. Aventis reports a median
      public SaaS EV/revenue multiple of 4.6x in August 2026 and says investors increasingly reward
      efficiency, profitability, and meaningful AI integration. Its private SaaS M&A sample reports
      a 4.5x median EV/revenue multiple across 543 transactions with disclosed revenue multiples.
      UiPath provides a public automation reference: Stock Analysis reports a 3.36x trailing
      price-to-sales ratio and $1.67B trailing revenue as of July 24, 2026, while Macrotrends
      records UiPath at 4.32x on July 31, 2025 and 5.59x on January 31, 2025. These are not direct
      Instabase comps: UiPath is public, much larger, and has different growth and margin disclosure.
      A defensible Instabase range therefore requires verified revenue and a documented premium or
      discount for growth, margins, concentration, security, and liquidity. With those inputs absent,
      the bear case is a multiple reset or down-round; the bull case requires evidence of durable
      enterprise expansion and improving unit economics.
    claimRefs: [CV011, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: diligence-and-triggers
    title: Diligence asks and thesis-break triggers
    body: >-
      The next decision should be gated on evidence, not on the headline Series D mark. Request the
      latest management accounts, ARR or revenue bridge, gross margin, net retention, burn and runway,
      customer concentration, cohort expansion, security incident remediation, and the complete
      capitalization table. Confirm whether the $1.24B and $801.78M figures refer to the same
      post-money basis and whether any secondary print or preferred terms change the common-equity
      outcome. A thesis break would be a verified decline in recurring revenue or retention, material
      concentration loss, unresolved breach obligations, a financing below the last mark, or terms
      that subordinate new investors to substantial preference overhang. Conversely, evidence of
      profitable growth, repeatable deployments, and clean preference terms could move the stance
      toward fair or attractive at a negotiated price. Until then, the appropriate action is to
      track and seek a better evidence package rather than extrapolate from funding totals.
    claimRefs: [CV016, CV017, CV018, CV019]
    tableRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - ["Recommendation", "track / research-more", "Do not underwrite a buy without operating and term-sheet evidence"]
      - ["Confidence", "medium-low", "Public financing evidence exists but key economics are undisclosed"]
      - ["Risk rating", "high", "Down-round, liquidity, security, and preference risks remain material"]
      - ["Valuation stance", "stretched / unknown", "Conflicting private marks prevent a precise fair-value call"]
    notes: "Assessment uses public financing, market-reference, and adverse-source evidence; private operating metrics and deal terms are not disclosed."
    claimRefs: [CV001, CV003, CV004, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Enterprise workflow differentiation", "AI Hub combines extraction, validation, review, deployment, and monitoring", "Verified customer-level ROI and retention by workflow"]
      - ["Regulated-industry fit", "Document-heavy banking, insurance, and public-sector use cases are described", "Named customer expansion and independently verified renewal evidence"]
      - ["Valuation support", "2025 Series D provides a financing anchor", "Reconciled cap table, preferred terms, ARR, margin, and current price"]
      - ["Substitution and execution risk", "No public accuracy benchmarks or analyst placements; model layer is competitive", "Independent benchmark results and sustainable unit economics"]
      - ["Security risk", "Public tracker records a confirmed breach affecting under 1,000 records", "Completed remediation, customer notices, and control testing"]
    notes: "Rows distinguish company/product evidence from unresolved underwriting tests; absence of disclosure is treated as a gap, not as proof of failure."
    claimRefs: [CV006, CV007, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified recurring growth, strong retention, improving margins, and clean preference terms", "Premium to public/private SaaS references may be supportable", Low until metrics are provided, Growth or retention misses]
      - [Base, "Enterprise demand persists but growth, margin, and liquidity remain only partly evidenced", "Value near a negotiated reference range; no precise target", Most defensible today, Financing at a discount or weak net retention]
      - [Bear, "Commodity pressure, customer concentration, unresolved breach costs, or preference overhang", "Multiple compression and/or down-round risk; common value may be below headline marks", Material, Material customer loss or adverse financing"]
      - [Diligence gate, "Audited or management financial package plus cap table and security remediation", "No investment decision until evidence closes the gate", Required, Any missing package remains unresolved]
    notes: "Scenarios are qualitative because Instabase does not publicly disclose the revenue, margin, retention, burn, runway, and preference inputs needed for numeric valuation ranges."
    claimRefs: [CV003, CV004, CV011, CV016, CV017, CV018]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public product and financing evidence feeds a cautious recommendation because valuation and downside inputs remain incomplete.
    data:
      nodes:
        - {id: evidence, label: "Evidence base", detail: "Enterprise product controls and 2025 financing mark"}
        - {id: gap, label: "Underwriting gaps", detail: "Revenue, retention, margin, burn, cap table, and terms"}
        - {id: risk, label: "Downside risks", detail: "Multiple reset, security remediation, liquidity, preference overhang"}
        - {id: price, label: "Price discipline", detail: "Reconcile marks and apply a defensible multiple range"}
        - {id: proof, label: "Proof threshold", detail: "Verify recurring economics, customer quality, and remediation"}
        - {id: decision, label: "Decision", detail: "Track / research-more; price discipline required"}
      edges:
        - {from: evidence, to: gap}
        - {from: gap, to: risk}
        - {from: risk, to: price}
        - {from: price, to: proof}
        - {from: proof, to: decision}
    claimRefs: [CV001, CV006, CV016]
callouts:
  - calloutType: recommendation
    title: Decision implication
    body: Do not treat the $1.24B financing mark or a third-party model price as current fair value; require operating metrics and preferred-security terms before setting an entry price.
    claimRefs: [CV001, CV003, CV004, CV016]
  - calloutType: risk
    title: Thesis-break trigger
    body: A verified retention or recurring-revenue decline, unresolved breach exposure, material customer loss, or financing below the last mark would invalidate the base case.
    claimRefs: [CV010, CV017, CV018]
