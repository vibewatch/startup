evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management revenue, ARR, gross margin, burn, runway, and retention metrics.
    whyItMatters: The business model and valuation cannot be assessed from financing data alone.
    diligencePath: >-
      Request the latest management accounts, ARR bridge, gross-margin schedule, cash balance, and runway plan under
      NDA.
    relatedQuestionRefs:
      - QO004
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled capitalization and financing schedule explaining the $277M, $276.22M, and $322M totals.
    whyItMatters: Total raised affects dilution, ownership, and financing capacity.
    diligencePath: >-
      Obtain the company capitalization table, round closing statements, and treatment of debt, grants, acquisitions,
      and secondaries.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee count reconciled to legal-entity counts and open-role activity.
    whyItMatters: Scale and operating leverage cannot be inferred from incompatible measures.
    diligencePath: Request a dated employee roster by function, geography, entity, and contractor status.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cybersecurity
    missingEvidence: Incident scope, affected customers, notification status, remediation, and independent forensic conclusions.
    whyItMatters: A confirmed breach may affect enterprise trust, contractual obligations, and operational risk.
    diligencePath: Request the incident report, customer-notification record, remediation plan, and current security attestations.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete executive roster, board biographies, ownership, and governance rights.
    whyItMatters: Public names do not establish succession coverage or investor control.
    diligencePath: Request the current org chart, board materials, committee charter, and investor-rights schedule.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A company-specific SAM/SOM model with eligible account count, workflow volume, pricing, win rate, and serviceable
      geography.
    whyItMatters: Generic IDP forecasts do not establish how much of the market Instabase can serve or capture.
    diligencePath: >-
      Request management's bottom-up account and workflow model, reconcile it to pipeline and production contracts, and
      separate software revenue from services.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: diligence-gap
    missingEvidence: >-
      Verified cohort-level production conversion, renewal, expansion, document-volume, and realized-ROI data by
      vertical.
    whyItMatters: Market growth and category mindshare do not prove repeatable customer adoption or durable pricing power.
    diligencePath: >-
      Obtain anonymized customer cohorts, pilot-to-production conversion, retention, expansion, implementation
      timelines, and outcome evidence under diligence access.
    relatedQuestionRefs:
      - QM010
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A reconciled definition and denominator for publisher market estimates spanning 2026 through the outer forecast
      years.
    whyItMatters: The forecast range is wide enough to materially change implied valuation multiples and market-share assumptions.
    diligencePath: >-
      Ask each publisher or an independent market advisor to document included products, services, geographies, and
      whether cloud/API/RPA spend is included.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: evidence-gap
    missingEvidence: >-
      Independent side-by-side accuracy, price, implementation-time, retention, and win-rate data for Instabase and its
      closest alternatives.
    whyItMatters: >-
      Without comparable buyer-workload evidence, ordinal positioning and moat conclusions remain directional rather
      than underwriting-grade.
    diligencePath: >-
      Require a controlled proof of concept using representative documents, exception rates, total implementation
      effort, realized pricing, and downstream handoff metrics.
    relatedQuestionRefs:
      - QP008
  - type: enumeration-incomplete
    severity: material
    topic: landscape
    missingEvidence: >-
      Complete coverage of internal build, RPA incumbent, ECM, and regional specialist alternatives in each target
      vertical.
    whyItMatters: The assigned pool supports a broad substitution map but cannot establish an exhaustive competitor universe.
    diligencePath: >-
      Run vertical-specific procurement and analyst research for banking, insurance, public sector, and healthcare
      buying motions.
    relatedQuestionRefs:
      - QP001
      - QP003
  - type: private-evidence-only
    severity: minor
    topic: pricing
    missingEvidence: Instabase realized price, discounting, implementation fees, and customer-level packaging.
    whyItMatters: Published competitor list prices are not comparable to an undisclosed enterprise contract.
    diligencePath: >-
      Request a representative commercial proposal with volume tiers, services, renewal terms, and implementation
      assumptions.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt schedule, committed obligations, and runway scenario.
    whyItMatters: Funding raised cannot be converted into available cash or runway without current financial statements.
    diligencePath: Request management accounts, bank balance, twelve-month cash forecast, debt documents, and board-approved plan.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Realized pricing, gross margin, CAC payback, retention, expansion, and implementation-cost cohorts.
    whyItMatters: >-
      Enterprise revenue quality and capital intensity cannot be underwritten from list-price absence and third-party
      estimates.
    diligencePath: >-
      Obtain a cohort revenue bridge with bookings, recognized revenue, churn, NRR, services mix, delivery hours, and
      fully loaded go-to-market spend.
    relatedQuestionRefs:
      - QI003
      - QI005
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled round-by-round capitalization and funding schedule.
    whyItMatters: Conflicting total-funding figures impair comparisons between capital raised, valuation, and financing dependency.
    diligencePath: >-
      Reconcile signed financing documents, cap table, secondary transactions, debt, and any acquisition or grant
      proceeds.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: Independent accuracy, latency, throughput, and cost benchmarks by document type and packet complexity.
    whyItMatters: >-
      Without a common test set, buyers cannot compare the claimed context-first workflow with incumbent OCR, IDP, or
      general-purpose model alternatives.
