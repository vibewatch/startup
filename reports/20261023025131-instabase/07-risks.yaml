schemaVersion: "report-v2"
artifact: risks
slug: instabase
runDate: 2026-10-23
company:
  name: Instabase
chapter:
  number: 7
  title: Risks
  summary: Instabase's principal risks are evidence gaps around security, regulatory exposure, implementation reliability, and private-company financial resilience. Publicly available adverse evidence includes a reported 2026 data breach and competitor-published concerns about cost, file limits, timeouts, and implementation complexity, while financing and workforce signals remain inconsistent across secondary sources.
sections:
  - id: ranked-risk-overview
    title: Ranked risk overview
    body: Instabase sells document and workflow automation into regulated, document-heavy environments, so failures in confidentiality, auditability, accuracy, or deployment economics can affect both customer trust and renewal prospects. The strongest adverse signal in the assigned evidence is a third-party incident record stating that Instabase disclosed a confirmed breach affecting fewer than 1,000 records in April 2026. A separate review published by competitor Extend describes high costs, confusing navigation, file-size constraints, memory issues, and processing timeouts; because the issuer sells an alternative product, these allegations are not independent benchmarks. The risk register therefore treats them as diligence leads rather than settled performance facts. Public sources also disagree on funding, valuation, employee count, and total capital, which raises underwriting risk for a private company without audited disclosure.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory, legal, and security exposure
    body: The EU AI Act creates a material classification and control risk for document automation deployed in credit, insurance, public services, employment, law enforcement, or other listed contexts. The assigned legal explainer says providers of high-risk systems must implement risk management, data governance, technical documentation, logging, human oversight, accuracy, robustness, cybersecurity, and conformity controls. Instabase's public product description emphasizes regulated verticals and audit trails, but the assigned evidence does not establish which customer deployments fall within each legal category or whether the company has an EU conformity position. A separate incident tracker reports a confirmed breach, but it does not provide technical root cause, affected customers, notification scope, or remediation evidence.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operational-and-dependency
    title: Operational, partner, and financial dependencies
    body: Operational diligence should focus on whether the platform can sustain large, variable document workloads and whether implementation services scale economically. The assigned evidence describes AWS migration benefits, including lower compute cost and faster provisioning, but those figures come from a vendor-oriented platform listing and do not disclose customer-level service-level attainment. The same source says pricing, model strings, and accuracy benchmarks are not published, leaving buyers unable to validate total cost or task-level performance before a proof of concept. Competitor commentary adds claims of complex implementation and quota pressure, while a layoffs tracker reports no layoff data; neither result proves operating health. Finally, three private-market sources publish materially different valuation marks, so capital runway, financing terms, and dilution risk remain unresolved rather than quantified.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: Treat a new material security incident, inability to document EU AI Act controls for in-scope deployments, repeated production timeout or accuracy failures on representative customer files, or financing evidence showing less than twelve months of runway as a thesis-break event pending remediation.
    claimRefs: [CR006, CR008, CR010, CR015]
  - calloutType: insight
    title: Highest-value diligence
    body: Request an incident post-mortem, customer-specific accuracy and timeout statistics, contractual SLA and service-credit history, AI Act applicability assessment, current cash and burn schedule, and the cap-table terms of the January 2025 financing before underwriting.
    claimRefs: [CR006, CR009, CR010, CR015]
tables:
  - id: TR001
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Confirmed breach with unclear scope", "Medium", "Critical", "Low", "High", "Root cause and affected-customer, notification, and remediation evidence are unavailable; sources SR006 and SR007"]
      - ["Large-file processing limits and timeouts", "Medium", "High", "Low", "High", "Independent production failure rates and SLA credits are unavailable; source SR004"]
      - ["Complex implementation and high cost", "Medium", "High", "Low", "High", "Customer-level deployment duration and total cost are unavailable; source SR004"]
      - ["Unpublished accuracy and model benchmarks", "Medium", "High", "Low", "High", "Document-type accuracy, recall, and false-positive data are unavailable; source SR008"]
    notes: "Rows synthesize public risk signals; likelihood and residual exposure are analyst assessments anchored to the cited evidence, not company-disclosed probabilities."
    claimRefs: [CR002, CR003, CR009, CR010]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or case, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["High-risk AI Act obligations for listed use cases", "European Union", "Framework obligations are phased and include high-risk controls", "Medium", "High", "Product description cites regulated verticals and audit trails but no applicability assessment is public", "High", "Obtain deployment-by-deployment classification and conformity file; sources SR005 and SR008"]
      - ["AI Act data governance, logging, human oversight, and cybersecurity", "European Union", "Requirements described for high-risk providers", "Medium", "High", "Evidence does not show implementation or audit results", "High", "Request technical documentation, logs policy, model governance, and audit reports; source SR005"]
      - ["Data-breach response and notification exposure", "United States / customer jurisdictions", "Third-party tracker reports confirmed breach disclosed April 2026", "Medium", "Critical", "Root cause and notification scope are not public", "High", "Obtain incident post-mortem, regulator correspondence, and customer notices; source SR006"]
    enumerationScope:
      coverage: partial
      basis: "Public legal and incident records found in the assigned pool for Instabase through 2026-10-23"
    notes: "This is a partial public-record register, not a complete litigation, regulatory, or customer-contract enumeration."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Cloud infrastructure", "AWS", "Hosting and compute platform", "Not disclosed", "Cost or availability shock increases delivery cost or disrupts service", "High", "AWS migration and hybrid deployment are described", "High"]
      - ["Enterprise implementation resources", "Instabase services and customer technical teams", "Model tuning, integration, and change management", "Not disclosed", "Projects take longer or require more services than budgeted", "High", "Professional-services support is implied but capacity and unit economics are undisclosed", "High"]
      - ["Growth capital and financing terms", "Qatar Investment Authority and other reported investors", "Funding and liquidity support", "Not disclosed", "Down-round terms or limited runway constrain product investment", "High", "Fresh financing is reported but cash balance, burn, preferences, and runway are unavailable", "High"]
      - ["Regulated-industry customer base", "Banks, insurers, and government agencies", "Revenue and reference relationships", "Not disclosed", "Procurement, concentration, or compliance failure delays renewals and expansion", "Medium", "Named use cases exist but customer-level revenue and retention are unavailable", "High"]
    notes: "Counterparties and roles are drawn from assigned public descriptions; concentration and failure probabilities are not disclosed and remain diligence gaps."
    claimRefs: [CR009, CR011, CR012, CR013, CR015, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Residual exposure is highest where public evidence shows a confirmed incident or material operating limitation but mitigation evidence is incomplete.
    data:
      columns: [Low likelihood, Medium likelihood, High likelihood]
      rows:
        - label: Security incident
          values: ["-", "Confirmed breach; residual critical exposure", "-"]
        - label: Regulatory controls
          values: ["-", "AI Act applicability and conformity gap", "-"]
        - label: Processing reliability
          values: ["-", "Timeout and file-limit allegations", "-"]
        - label: Financial resilience
          values: ["-", "Valuation, funding, burn and runway unresolved", "-"]
        - label: Implementation economics
          values: ["-", "Cost and complexity allegations", "-"]
        - label: Partner concentration
          values: ["No public concentration evidence", "Customer and cloud concentration unknown", "-"]
    claimRefs: [CR002, CR005, CR009, CR011, CR012, CR013]
