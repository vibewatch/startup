company:
  name: Instabase
chapter:
  number: 1
  title: Company Overview
  summary: Instabase is a privately held San Francisco enterprise AI company founded by Anant Bhardwaj in 2015. Public evidence supports a document-processing and workflow-automation business with substantial financing, but current operating scale, financial performance, and the precise latest valuation remain inconsistently disclosed.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: "Instabase was founded in 2015 by Anant Bhardwaj and is headquartered in San Francisco. Its product has evolved from an applied AI platform for document processing into an enterprise workflow-automation platform for unstructured documents. The strongest independent description is that it helps enterprises extract, classify, and act on PDFs, scans, emails, and forms in banking, insurance, and government workflows. Its monetization mechanics are not publicly detailed: pricing is described as custom quote with no free tier, while the company’s public materials do not disclose model-level pricing, contract values, revenue, or recurring-revenue metrics. The resulting identity is clear, but the commercial model and current customer breadth remain diligence gaps."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: Anant Bhardwaj is consistently identified as founder and chief executive, and the company’s origin story ties the product to his MIT research on making unstructured data programmable. Tracxn lists a five-member active board, including Bhardwaj, Aditya Ramesh, Gerald Chen, Peter Sonsini, and David Karger, with the latter four described there as independent board members. A January 2026 product and engineering consolidation reportedly appointed Omkar Pendse as Chief Product and Technology Officer, combining two functions under one role. This strengthens regulated-industry operating coverage, but the public record still centers strategic identity and financing history on Bhardwaj, so succession depth and key-person dependence should be tested directly.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and operating scale
    body: "Instabase’s financing history shows rapid capital formation followed by a valuation reset. TechCrunch reported a $45 million Series C in June 2023 at a $2 billion valuation, while its January 2025 report described a $100 million Series D and a $1.24 billion valuation. The two rounds are corroborated by structured financing databases, although total funding differs by provider: Tracxn and the IDP profile state $322 million across seven rounds, while Forge and QuantLogix publish lower totals. Headcount is similarly inconsistent: assigned sources report 139 employees in August 2026, 183 in February 2026, and 251 without a clearly stated measurement date. No audited revenue, ARR, margin, burn, runway, or customer count was found in the assigned pool."
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-risk
    title: Milestones and adverse diligence
    body: "The milestone record runs from founding and early financing through the 2019 public disclosure of enterprise use cases, the 2020–2021 move toward transformer-based models, the 2023 AI Hub and large financing round, the 2025 Series D, and the 2026 product-and-engineering reorganization. These milestones show a coherent transition from a general data-application concept to regulated document workflows. The adverse record is material but bounded: a tracker reports that Instabase disclosed a cybersecurity incident confirmed as a data breach in April 2026, with an estimate of under 1,000 affected records. The incident warrants verification of scope, notification, remediation, and customer impact; it is not evidence of broader operational failure by itself."
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Enterprise workflow positioning
    body: Public evidence consistently places Instabase in complex, document-heavy enterprise workflows rather than as a standalone OCR utility.
    claimRefs: [CO002, CO003]
  - calloutType: risk
    title: Disclosure and valuation inconsistency
    body: Financing and headcount figures vary materially across sources, while core financial and customer metrics remain unavailable.
    claimRefs: [CO011, CO012]
  - calloutType: recommendation
    title: Verify current operating scale
    body: Request a current capitalization table, audited or management financials, active-customer definition, headcount reconciliation, and cybersecurity incident documentation before relying on headline scale metrics.
    claimRefs: [CO011, CO012, CO016]
