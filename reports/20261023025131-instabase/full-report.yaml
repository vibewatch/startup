  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public product and financing evidence feeds a cautious recommendation because valuation and downside inputs remain
      incomplete.
    data:
      nodes:
        - id: evidence
          label: Evidence base
          detail: Enterprise product controls and 2025 financing mark
        - id: gap
          label: Underwriting gaps
          detail: Revenue, retention, margin, burn, cap table, and terms
        - id: risk
          label: Downside risks
          detail: Multiple reset, security remediation, liquidity, preference overhang
        - id: price
          label: Price discipline
          detail: Reconcile marks and apply a defensible multiple range
        - id: proof
          label: Proof threshold
          detail: Verify recurring economics, customer quality, and remediation
        - id: decision
          label: Decision
          detail: Track / research-more; price discipline required
      edges:
