            body: >-
              Anant Bhardwaj is consistently identified as founder and chief executive, and the company’s origin story
              ties the product to his MIT research on making unstructured data programmable. Tracxn lists a five-member
              active board, including Bhardwaj, Aditya Ramesh, Gerald Chen, Peter Sonsini, and David Karger, with the
