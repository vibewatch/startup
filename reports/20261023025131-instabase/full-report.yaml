  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is intelligent document processing software and associated implementation services
              that ingest structured or unstructured documents, classify them, extract fields, validate outputs, and
              route work into an operational workflow. Precedence Research describes the market as software and
              solutions for “the ingestion, extraction, classification, and processing of structured and unstructured
              data from documents,” while Grand View Research identifies invoice processing, fraud detection, and
              customer onboarding as use cases. This boundary includes IDP platforms, workflow orchestration,
              human-in-the-loop review, and integration services; it excludes generic foundation-model spend, standalone
              OCR APIs, enterprise content repositories, and manual business-process outsourcing except where they are
              the status quo substitute. The buyer is therefore usually a regulated enterprise operations,
              transformation, or technology function rather than an individual end user. Instabase's publicly described
              target sectors—financial services, insurance, healthcare, and government—fit this boundary, but its
              enterprise-contract model and implementation-led deployments narrow the immediately serviceable segment to
              organizations with high document volumes, integration capacity, and a compliance case for auditability.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >-
              Published IDP estimates support a growing market but do not converge on one denominator. Mordor
              Intelligence estimates USD 3.17 billion in 2026 and USD 7.18 billion in 2031 at a 17.78% CAGR, while Grand
              View Research estimates USD 3.9 billion in 2026 and USD 29.7 billion in 2033 at a 33.8% CAGR. Precedence
              Research is more expansive again, describing USD 4.31 billion in 2026 and approximately USD 43.92 billion
              by 2034 at a 33.68% CAGR; GMI estimates USD 3.62 billion in 2026 and USD 24.99 billion by 2035 at a 23.94%
              CAGR. These are publisher estimates using different scopes and proprietary methods, not independently
              reconciled measurements. The useful valuation signal is directional: cloud, large-enterprise, BFSI, and
              compliance-heavy workflows are repeatedly identified as important segments, but the spread in forecasts
              makes a top-down TAM unsuitable as a standalone SOM claim. Instabase's constrained opportunity is best
              framed as a subset of enterprise IDP where custom workflows and controlled deployment justify enterprise
              pricing.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.3'
        title: Buyers, adoption triggers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by manual-work reduction, rising unstructured-data volumes, digital-transformation
              programs, cloud elasticity, and regulatory or audit requirements. Grand View Research says large
              enterprises held 71.6% of 2025 revenue and BFSI represented 25.0%, while Mordor says large enterprises
              held 64.35% and cloud deployments 74.10%; the exact shares differ, but both point toward a
              large-enterprise buying center. Instabase's described product fit is strongest where the payer owns an
              end-to-end workflow—loan processing, claims, regulatory documentation, or government forms—and can fund
              integration, tuning, and human review. The main constraints are sensitive-data security, regional
              compliance, procurement cycles, variable document quality, ongoing model or template tuning, and
              competition from incumbent RPA suites, hyperscaler APIs, specialist parsers, and internal engineering.
              PeerSpot reports zero Instabase reviews in its comparison record and a decline in reported mindshare from
              4.2% to 2.2% year over year as of October 2026; this is a market-signal caveat, not proof of customer
              churn. Instabase should therefore be underwritten on repeatable workflow economics and conversion from
              pilot to production, not market growth alone.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
