chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Instabase was founded in 2015 by Anant Bhardwaj and is headquartered in San Francisco. Its product has
              evolved from an applied AI platform for document processing into an enterprise workflow-automation
              platform for unstructured documents. The strongest independent description is that it helps enterprises
              extract, classify, and act on PDFs, scans, emails, and forms in banking, insurance, and government
              workflows. Its monetization mechanics are not publicly detailed: pricing is described as custom quote with
              no free tier, while the company’s public materials do not disclose model-level pricing, contract values,
              revenue, or recurring-revenue metrics. The resulting identity is clear, but the commercial model and
              current customer breadth remain diligence gaps.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
