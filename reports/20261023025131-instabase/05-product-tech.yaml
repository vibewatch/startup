    notes: Use cases are supported by product descriptions and external reporting, while measurable benefit cells remain qualitative because the retained sources do not provide a common denominator or controlled benchmark.
    claimRefs: [CE002, CE003, CE006, CE008, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Read and digitize", "Deskew, deblur, OCR, and preserve layout or visual elements", "Document quality and OCR/model components", "Error rates on degraded scans and handwriting"]
      - ["Interpret and reason", "Apply LLMs or agents to multi-step extraction and calculations", "Model providers, prompts, retrieval, and document context", "Hallucination, latency, and model-change controls"]
      - ["Standardize and export", "Normalize data and apply custom transformations", "APIs, SDKs, connectors, and Python logic", "Integration failures and schema drift"]
      - ["Verify and validate", "Score confidence and route exceptions to review", "Rules, queues, reviewers, and audit trail", "Human-review cost, escalation thresholds, and evidence retention"]
    notes: This is an analytical architecture map based on the retained product descriptions; it distinguishes described mechanisms from unverified production dependencies and controls.
    claimRefs: [CE005, CE006, CE010, CE011]
figures:
  - id: FE001
    title: Instabase product architecture map
    summary: AI Hub is described as a document-to-workflow stack in which context preservation and reasoning feed normalization, validation, review, and downstream integration.
    type: stack
    data:
      layers:
        - label: Ingest and digitize
          modules: [PDFs, scans, images, email, spreadsheets, OCR, layout preservation]
        - label: Understand context
          modules: [Document classification, packet context, tables, signatures, semantics]
        - label: Reason and transform
          modules: [LLM or agent steps, calculations, business rules, custom Python]
        - label: Verify and review
          modules: [Confidence checks, validation rules, queues, human-in-the-loop]
        - label: Integrate and operate
          modules: [APIs, SDKs, connectors, audit trails, downstream systems]
        - label: Govern and monitor
          modules: [Access controls, audit evidence, accuracy monitoring, incident response]
    approximationNotes: Layer order is an analytical representation of the documented workflow, not a published implementation diagram; model providers, deployment topology, and availability status are not disclosed in the retained evidence.
    claimRefs: [CE001, CE005, CE006, CE010]
callouts:
  - calloutType: strength
    title: Workflow depth is the clearest product strength
    body: Public material describes a product that spans document understanding, business logic, validation, exception review, and integration rather than isolated text extraction.
    claimRefs: [CE001, CE003, CE005]
  - calloutType: risk
    title: Performance and assurance remain diligence gates
    body: The retained evidence does not provide reproducible accuracy benchmarks, model inventory, current SLA, or independent security testing; a reported 2026 breach also requires incident-specific follow-up.
    claimRefs: [CE009, CE012, CE013, CE014]
