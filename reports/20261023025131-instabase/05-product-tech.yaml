  evidenceGaps:
    - type: missing-source
      severity: material
      topic: benchmarks
      missingEvidence: Independent accuracy, latency, throughput, and cost benchmarks by document type and packet complexity.
      whyItMatters: Without a common test set, buyers cannot compare the claimed context-first workflow with incumbent OCR, IDP, or general-purpose model alternatives.
      diligencePath: Require a customer-specific bake-off using representative documents, error taxonomy, latency targets, human-review rates, and total-cost assumptions.
      relatedQuestionRefs: [QE005, QE006]
    - type: missing-source
      severity: material
      topic: assurance-gaps
      missingEvidence: Current model inventory, deployment availability, SLA, independent security testing, and regulatory authorization evidence.
      whyItMatters: These controls determine whether the platform can be deployed in regulated production environments and how failures are governed.
      diligencePath: Obtain the current security package, architecture diagram, subprocessor list, model cards, pen-test summary, SLA, and authorization status under NDA.
      relatedQuestionRefs: [QE005, QE007, QE009]
    - type: access-blocked
      severity: material
      topic: security
      missingEvidence: Root cause, affected systems, remediation, notification scope, and customer impact for the reported April 2026 breach.
      whyItMatters: A breach disclosure without technical and remediation context cannot establish residual security risk or whether customer data was exposed through the product.
      diligencePath: Request the incident report, forensic summary, corrective-action plan, customer notifications, and evidence that the product environment was or was not affected.
      relatedQuestionRefs: [QE008]
