callouts:
  - calloutType: "insight"
    title: "Macroeconomic Inflation Distorts Nominal Marketplace Metrics"
    body: "In an economy where consumer price index inflation exceeded 31% year-over-year in 2026, nominal GMV growth in Turkish Lira cannot be interpreted as volume or demand expansion. Real top-line performance requires deflating transacted values against sector-specific indices, distinguishing headline inflation pass-through from authentic underlying market share gains."
    claimRefs:
      - CM005
  - calloutType: "risk"
    title: "Regulatory Decoupling of Private Label Operations"
    body: "The Turkish Competition Authority's enforcement and the Electronic Commerce Law amendments under Law No. 7416 forced Trendyol to structurally separate its private label apparel business into TrendyolMilla, removing high-margin proprietary brands from the core marketplace algorithm and curtailing platform self-preferencing."
    claimRefs:
      - CM006
      - CM007
      - CM008
