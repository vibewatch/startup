callouts:
  - calloutType: "risk"
    title: "Antitrust Data Firewall Vulnerability"
    body: "Although Trendyol segregated its private-label apparel operations into the standalone TrendyolMilla application pursuant to Law No. 7416, the Turkish Competition Authority explicitly held in its July 2024 Re-evaluation Decision that structural unbundling does not eliminate competitive exposure. Trendyol's marketplace continues to harvest granular third-party seller metrics, customer search queries, and price elasticity signals that can inform private-label product development. Continued regulatory monitoring leaves Trendyol vulnerable to recurrent compliance audits and administrative penalties if informational Chinese walls fail."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Geopolitical and Governance Constraints on Exit Horizon"
    body: "Alibaba Group's dominant 70% to 86.5% equity ownership fundamentally defines Trendyol's strategic trajectory and exit options. While leadership targets an eventual dual-listing IPO once international revenue reaches 50% of the total, extensive Chinese corporate control creates heightened scrutiny from Western exchanges and institutional allocators. Furthermore, the timing of liquidity events remains subordinated to Alibaba's broader global portfolio considerations rather than Trendyol's standalone market readiness."
    claimRefs:
      - "CR006"
      - "CR008"
      - "CR012"
