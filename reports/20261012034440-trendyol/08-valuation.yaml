  - id: "exit-readiness-governance-and-diligence-path"
    title: "Exit Readiness, Regulatory Constraints, and Diligence Asks"
    body: "Trendyol's path to an initial public offering faces structural operational prerequisites and stringent regulatory hurdles. Group President Çağlayan Çetin has explicitly articulated management's strategic threshold: Trendyol will pursue a dual-listing IPO—combining Borsa Istanbul with either the London Stock Exchange or New York—only after international revenue reaches 30% to 35% (and ideally 50%) of total sales. With current foreign revenue estimated at approximately 20%, achieving this benchmark requires continued heavy capital deployment in European and Middle Eastern fulfillment infrastructure. Compounding this operational timeline are significant regulatory and antitrust constraints imposed by the Turkish Competition Authority (TCA). Following a comprehensive investigation into algorithmic manipulation and data self-preferencing, the TCA levied an administrative fine of TRY 61.3 million against Trendyol in July 2023. Under subsequent Electronic Commerce Law amendments, Trendyol was compelled to structurally separate its private-label apparel business (TrendyolMilla) from its core marketplace, ceasing direct on-platform private-label sales as of January 1, 2024. While the TCA's 2024 re-evaluation confirmed that algorithmic self-preferencing concerns were addressed by this operational separation, the regulator firmly upheld ongoing behavioral obligations restricting third-party seller data usage. For prospective investors, core diligence asks center on three critical areas: first, obtaining standalone audited IFRS financial statements verifying segment gross margins; second, assessing the legal and technical boundaries governing data-sharing between the marketplace, TrendyolMilla, and parent Alibaba; and third, clarifying minority shareholder rights and board governance under Alibaba's controlling stake. Key thesis-break triggers include sustained negative free cash flow in international expansion hubs or renewed antitrust enforcement that impairs marketplace take rates."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
