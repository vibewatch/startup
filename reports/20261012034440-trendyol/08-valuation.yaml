  - calloutType: "recommendation"
    title: "Primary Investment Directive: Track"
    body: "We assign Trendyol an investment recommendation of Track with a Medium confidence rating and a High risk assessment. While domestic scale and marketplace economics are highly compelling, entry at or near the 2021 decacorn valuation of $16.5 billion is unattractive in light of current public emerging-market multiples and unverified international unit margins. Investors should monitor private secondary discounts and await audited financial filings."
