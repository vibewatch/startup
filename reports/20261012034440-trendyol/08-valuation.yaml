chapter:
  number: 8
  title: "Valuation"
  summary: "Trendyol demonstrates formidable domestic e-commerce dominance in Turkey with over $12.5 billion in annual GMV and proven operational profitability, reinforced by Uber's $700 million investment in Trendyol Go, but its unconfirmed $16.5 billion valuation mark from 2021 remains 30% to 45% above emerging-market peer benchmarks. Given Alibaba's controlling 70% to 86% ownership, ongoing Turkish Competition Authority regulatory oversight, and the lack of audited financial disclosures ahead of an IPO targeted for 2028–2030, the appropriate investment posture is Track with an estimated fair entry range of $9.0 billion to $11.5 billion."
sections:
  - id: "investment-thesis-and-recommendation-framework"
    title: "Investment Thesis, Stance, and Recommendation Framework"
    body: "Trendyol represents the undisputed market leader in Turkish e-commerce, operating a diversified superapp ecosystem spanning horizontal retail marketplace, instant grocery delivery (Trendyol Go), proprietary logistics (Trendyol Express), and consumer payments (Trendyol Pay). The core investment thesis rests on Trendyol's dominant domestic scale, having processed over $12.5 billion in gross merchandise value in 2024 across 40 million customers and 2.5 million daily package deliveries, alongside proven operational profitability in its domestic Turkish market since 2023. This operational momentum was powerfully validated in May 2025 when Uber agreed to acquire an 85% stake in Trendyol Go for $700 million, unlocking non-dilutive liquidity and validating the standalone market value of the group's logistics and delivery assets. However, this impressive operational achievement is sharply counterbalanced by valuation reality: Trendyol's last confirmed institutional valuation mark of $16.5 billion, set during the August 2021 funding round led by SoftBank, General Atlantic, Princeville Capital, ADQ, and QIA, is five years stale and unanchored to subsequent global valuation corrections. Public emerging-market and European e-commerce comparables have experienced dramatic valuation multiple compression from peak pandemic highs of 2.0x–3.5x revenue to current levels of 0.3x–0.8x revenue and 0.4x–0.7x GMV. At its historical $16.5 billion mark, Trendyol trades at an implied 1.3x 2024 GMV multiple, representing a rich premium to peers that is difficult to justify without audited corporate financial disclosures, proven international unit margins, and a transparent capital structure. Consequently, we assign Trendyol an investment recommendation of Track with an Expensive valuation stance, High risk rating, and Medium confidence, advising investors to maintain pricing discipline and seek a target entry valuation between $9.0 billion and $11.5 billion."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV011"
      - "CV012"
      - "CV013"
