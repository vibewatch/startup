  - id: "scenario-analysis-and-return-profiles"
    title: "Bull, Base, and Bear Return Scenarios"
    body: "To evaluate Trendyol's risk-adjusted return profile, we construct multi-scenario valuation models anchored on 2024 operating metrics ($12.5 billion GMV, 40 million shoppers), recent subsidiary transactions, and peer multiples. In the Bull Case (20% probability), Trendyol successfully accelerates its international expansion across Saudi Arabia, the United Arab Emirates, Germany, and Central and Eastern Europe, driving international sales from roughly 20% to over 40% of total Group revenue by 2027. Operating leverage from Trendyol Express and advertising revenue expansion expands Group EBITDA margins, supporting a dual-listing IPO in Istanbul and London or New York at an enterprise value of $18.0 billion to $22.0 billion (1.2x–1.4x forward GMV). In our Base Case (55% probability), domestic Turkish revenue grows at a durable 15% to 20% annual clip in USD terms, underpinned by market dominance and steady inflation pass-through, while international operations achieve moderate expansion in the Gulf and Romania. However, private market liquidity constraints and multiple normalization hold the fair valuation to $9.0 billion to $11.5 billion (0.7x–0.9x 2024 GMV), implying a necessary 30% to 45% discount to the 2021 funding mark before fresh institutional capital can achieve attractive mid-teens IRR. In the Bear Case (20% probability), fierce international competition from Amazon and Noon in the Gulf drives persistent cash burn, while Turkish macroeconomic volatility and domestic currency depreciation erode dollar-denominated profitability. Under this scenario, enterprise value compresses to $5.5 billion to $7.5 billion (0.4x–0.6x GMV), reflecting distressed emerging-market retail valuations. A 5% tail risk scenario accounts for prolonged capital lockup and multiple liquidation haircuts."
