callouts:
  - calloutType: "risk"
    title: "GMV cannot substitute for revenue"
    body: "The strongest scale disclosure is 2024 GMV, while current consolidated revenue and margins are absent. Applying a revenue multiple to GMV or treating reported Turkish operating profitability as consolidated free cash flow would materially overstate what the evidence establishes."
    claimRefs:
      - "CI006"
      - "CI009"
      - "CI015"
  - calloutType: "recommendation"
    title: "Make the data room the underwriting gate"
    body: "Require audited statements, a GMV-to-revenue bridge, segment contribution margins, and a current liquidity schedule before assigning earnings credit. Historical funding raised and valuation do not demonstrate cash available or runway in October 2026."
    claimRefs:
      - "CI001"
      - "CI014"
      - "CI016"
