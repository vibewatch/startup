company:
  name: "Trendyol"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence shows a scaled, diversified commerce engine and reports Turkish operating profitability, but the strongest disclosed scale measure is GMV rather than revenue. Current audited revenue, margins, cash, burn, runway, and unit economics remain unavailable, so neither earnings quality nor capital adequacy can be underwritten."
sections:
  - id: "revenue-model"
    title: "Revenue architecture is broad, but current take rates are private"
    body: >-
      Trendyol's economic model spans a third-party marketplace, owned logistics, food and
      grocery delivery, payments, resale, and historically first-party private labels. The
      clearest pricing evidence is old: a 2016 WWD interview said brands set pricing while
      Trendyol received a percentage of each sale, with the percentage varying by brand and
      target category margin. That establishes a commission mechanism, not a current realized
      take rate. The same interview described controlled private-label pricing, while later
      Turkish rules required those products to move off the main marketplace. Investors should
      therefore separate marketplace commissions, merchandise margin, delivery economics, and
      any payment revenue rather than applying one blended marketplace multiple.
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI014"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-unit-economics"
    title: "GMV and operating scale do not resolve revenue or margin"
    body: >-
      Lucidity Insights reports more than $12.5 billion of 2024 GMV, 2.5 million daily
      packages across 35 countries, 40 million customers, and Turkish operational
      profitability since 2023. These are useful scale signals, but none is interchangeable
      with audited revenue, gross profit, EBITDA, or free cash flow. Historical WWD data also
      show that Trendyol once combined transaction volume with rapid inventory turns, yet that
      2016 snapshot cannot establish today's consolidated economics. The diligence focus
      should be a reconciliation from GMV to recognized revenue, then to contribution margin
      after returns, discounts, payment fees, fulfillment, courier subsidies, and customer
      acquisition spending.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy"
    title: "Funding history is not evidence of current liquidity"
    body: >-
      The assigned evidence confirms a $1.5 billion financing at a $16.5 billion valuation in
      August 2021, while Tracxn summarizes $1.54 billion raised across four rounds and identifies
      August 2021 as the latest round in its profile. Those figures describe historical capital
      raised, not cash still available in October 2026. The sources do not disclose current cash,
      burn, runway, debt, working-capital requirements, capital expenditure, or the allocation of
      liquidity among Turkey and international operations. The 2022 IPO discussion is similarly
      a dated management threshold rather than a financing commitment. A current balance sheet,
      cash-flow statement, debt schedule, and downside liquidity plan are prerequisites for any
      capital-adequacy conclusion.
    claimRefs:
      - "CI001"
      - "CI010"
      - "CI011"
      - "CI014"
      - "CI016"
  - id: "financial-verdict"
    title: "Financial verdict: scaled activity, unproven earnings quality"
    body: >-
      The public case is strongest on activity and ecosystem breadth: Trendyol has multiple
      monetizable transaction surfaces, large reported GMV, dense logistics activity, and an
      external report of domestic operating profitability. The underwriting case is weakest
      exactly where value accrues: realized commission rates, segment revenue, gross margin,
      contribution margin, cash conversion, and international customer-acquisition efficiency
      are not disclosed in the assigned evidence. Regulatory separation of private-label sales
      and continuing restrictions on marketplace-data use can also change economics that older
      pricing evidence once described. The appropriate conclusion is not that margins are poor,
      but that revenue quality, margin durability, and financing independence remain unverified.
    claimRefs:
      - "CI002"
      - "CI006"
      - "CI009"
      - "CI012"
      - "CI013"
      - "CI015"
      - "CI016"
