              - CO002
              - CO003
              - CO007
              - CO010
              - CO011
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Superapp Operating Flywheel and Carve-Out Strategy
            body: >-
              Trendyol's evolution from a specialized fashion marketplace into Turkey's preeminent horizontal superapp
              demonstrates the power of closed-loop operational integration across logistics, digital payments, and
              local delivery. However, structural separation mandates under Turkish competition law and the subsequent
              $700 million sale of Trendyol Go to Uber illustrate how regulatory friction and capital constraints are
              reshaping its conglomerate model ahead of any potential public offering.
            calloutType: insight
            claimRefs:
