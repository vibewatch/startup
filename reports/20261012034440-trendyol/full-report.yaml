      - number: '5.4'
        title: Cross-Border Deployment and System Operating Layers
        blocks:
          - type: paragraph
            body: >-
              To sustain expansion beyond its mature domestic market, Trendyol has adapted its platform architecture for
              multi-region cross-border operations while simultaneously executing mandatory structural changes under
              Turkish e-commerce legislation. Under amended Law No. 6563, large marketplace operators are prohibited
              from selling their own private-label branded products on their intermediary platforms. To achieve
              compliance by January 1, 2024, Trendyol decoupled its private-label lines (including TrendyolMilla,
              TrendyolMan, and TrendyolKids) into an entirely separate mobile application and website, establishing
              independent technical data boundaries between third-party marketplace listings and internal retail
              operations. In international operations, Trendyol launched dedicated localized platforms in Europe
              covering 27 countries, anchored by a regional office in Berlin and planned fulfillment centers in Romania,
              alongside aggressive expansion into Gulf Cooperation Council markets including Saudi Arabia and the United
              Arab Emirates. Frontend localized interfaces such as trendyol.ae integrate regional payment methods,
              localized currency settlement, and dynamic inventory filtering. Furthermore, Trendyol secured global brand
              and merchandising reach through official e-commerce partnerships with the International Olympic Committee,
              manufacturing and distributing licensed merchandise internationally.
