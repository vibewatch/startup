            body: >-
              Trendyol has built an exceptional consumer franchise with over 40 million active shoppers, 50 million app
              downloads, and 250,000 merchants. By bundling retail, Trendyol Express logistics, Trendyol Pay checkout,
              and Dolap resale into a unified interface, Trendyol maximizes consumer switching costs and daily
              application touchpoints across Turkey.
