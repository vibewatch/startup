      - number: '6.3'
        title: Commercial Dependencies, Channel Friction, and Adverse Compliance Headwinds
        blocks:
          - type: paragraph
            body: >
              Trendyol’s customer concentration risk is structurally low on the consumer side due to extreme
              fragmentation across tens of millions of retail households; no single retail customer or merchant
              represents material corporate revenue. However, the business exhibits high geographic and regulatory
              concentration: Turkey generates roughly 87% of core e-commerce revenues, leaving the consolidated customer
              ecosystem exposed to domestic macroeconomic volatility, currency devaluation, and shifting local
              e-commerce regulations. On the merchant supply side, Trendyol historically faced severe regulatory
              friction from the Turkish Competition Authority (TCA). The TCA investigated Trendyol for algorithmic
              self-preferencing and unauthorized exploitation of third-party seller data to benefit its proprietary
              private-label lines, resulting in a TRY 61.3 million administrative fine in 2023 and mandating the
              operational separation of private-label fashion into the standalone TrendyolMilla application as of
              January 2024.


              International customer expansion introduces acute legal, IP, and platform compliance headwinds. In Europe,
              where Trendyol has expanded across CEE and Greece, local brand owners have mounted aggressive legal
              pushback. Specifically, Greek knitwear manufacturer GRUPPO PAPARAZZI secured an interim injunction against
              Trendyol from the Athens Single-Member Court of First Instance on November 21, 2025, barring Trendyol from
              using or distributing products bearing the registered MASSARO trademark in Greece under threat of a
              €10,000 fine per violation and initiating a €500,000 damages claim for trademark infringement and
              counterfeiting. These intellectual property enforcement actions, alongside heightened European Commission
              scrutiny over product safety and compliance across cross-border marketplaces, demonstrate that
              international customer acquisition carries material counterparty and brand-protection risks that could
              impede merchant onboarding and consumer adoption abroad.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU015
              - CU016
