  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Trendyol operates under rigorous antitrust and statutory oversight in its core Turkish domestic market
              while simultaneously navigating emerging digital regulations across Europe and the Middle East. In July
              2023, the Turkish Competition Authority (TCA) concluded an extensive investigation into Trendyol's
              marketplace practices, imposing an administrative fine of TRY 61,342,847.73 (approximately EUR 5.8
              million) after determining that the company had abused its dominant position through algorithmic ranking
              manipulation and improper utilization of third-party merchant data to benefit its private-label brands. In
              response to amendments to Law No. 6563 on the Regulation of Electronic Commerce enacted through Law No.
              7416, Trendyol structurally unbundled its private-label retail activities by launching the dedicated
              TrendyolMilla application and completely removing first-party private-label sales from its core
              marketplace platform effective January 1, 2024. In its July 2024 Re-evaluation Decision, the TCA
              acknowledged that algorithmic self-preferencing concerns were moot under the current operational
              separation, but explicitly upheld ongoing obligations governing marketplace third-party data collection,
              storage, and isolation, emphasizing that structural separation alone does not eliminate competitive
              exposure. Across international markets, Trendyol faces expanding compliance obligations, including
              voluntary adherence to the European Union Consumer Protection Commitment framework signed in 2025 and
              strict data localization standards under Gulf personal data protection laws.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
      - number: '7.2'
        title: Operational Logistics, Cross-Border Execution, and Security
        blocks:
          - type: paragraph
            body: >-
              Trendyol's rapid internationalization strategy introduces severe operational execution complexity across
              fragmented regional corridors. In early 2024, the group accelerated expansion into Central and Eastern
              Europe (CEE) by launching localized e-commerce platforms across seven countries—Romania, Greece, Hungary,
              Czech Republic, Slovakia, Poland, and Bulgaria—reaching 2.2 million active shoppers by year-end. Romania
              has emerged as the critical regional hub, accounting for 70% of CEE active customers with 1.5 million
              shoppers and 16 million items sold. To sustain two-day delivery commitments for in-stock inventory and
              stabilize customer retention, Trendyol commissioned a 50,000-square-meter fulfillment center in Ștefănești
              near Bucharest in February 2025, employing up to 250 personnel. However, cross-border fulfillment across
              multiple customs jurisdictions, reverse-logistics processing in apparel categories, and multi-country
              carrier handoffs create persistent delivery bottleneck risks. While core domestic delivery reliability is
              anchored by the proprietary Trendyol Express logistics network established in 2018 across all 81 Turkish
              provinces, international operations depend heavily on regional commercial couriers. Furthermore,
              maintaining product quality, catalog safety, and authentic branding across more than 300,000 marketplace
              sellers demands continuous machine learning moderation from the Trendyol Tech R&D division to avoid
              counterfeit liabilities and reputational impairment.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
