      - number: '8.3'
        title: Bull, Base, and Bear Return Scenarios
        blocks:
          - type: paragraph
            body: >-
              To evaluate Trendyol's risk-adjusted return profile, we construct multi-scenario valuation models anchored
              on 2024 operating metrics ($12.5 billion GMV, 40 million shoppers), recent subsidiary transactions, and
              peer multiples. In the Bull Case (20% probability), Trendyol successfully accelerates its international
              expansion across Saudi Arabia, the United Arab Emirates, Germany, and Central and Eastern Europe, driving
              international sales from roughly 20% to over 40% of total Group revenue by 2027. Operating leverage from
              Trendyol Express and advertising revenue expansion expands Group EBITDA margins, supporting a dual-listing
              IPO in Istanbul and London or New York at an enterprise value of $18.0 billion to $22.0 billion (1.2x–1.4x
              forward GMV). In our Base Case (55% probability), domestic Turkish revenue grows at a durable 15% to 20%
              annual clip in USD terms, underpinned by market dominance and steady inflation pass-through, while
              international operations achieve moderate expansion in the Gulf and Romania. However, private market
              liquidity constraints and multiple normalization hold the fair valuation to $9.0 billion to $11.5 billion
              (0.7x–0.9x 2024 GMV), implying a necessary 30% to 45% discount to the 2021 funding mark before fresh
              institutional capital can achieve attractive mid-teens IRR. In the Bear Case (20% probability), fierce
              international competition from Amazon and Noon in the Gulf drives persistent cash burn, while Turkish
              macroeconomic volatility and domestic currency depreciation erode dollar-denominated profitability. Under
              this scenario, enterprise value compresses to $5.5 billion to $7.5 billion (0.4x–0.6x GMV), reflecting
              distressed emerging-market retail valuations. A 5% tail risk scenario accounts for prolonged capital
              lockup and multiple liquidation haircuts.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
      - number: '8.4'
        title: Exit Readiness, Regulatory Constraints, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Trendyol's path to an initial public offering faces structural operational prerequisites and stringent
              regulatory hurdles. Group President Çağlayan Çetin has explicitly articulated management's strategic
              threshold: Trendyol will pursue a dual-listing IPO—combining Borsa Istanbul with either the London Stock
              Exchange or New York—only after international revenue reaches 30% to 35% (and ideally 50%) of total sales.
              With current foreign revenue estimated at approximately 20%, achieving this benchmark requires continued
              heavy capital deployment in European and Middle Eastern fulfillment infrastructure. Compounding this
              operational timeline are significant regulatory and antitrust constraints imposed by the Turkish
              Competition Authority (TCA). Following a comprehensive investigation into algorithmic manipulation and
              data self-preferencing, the TCA levied an administrative fine of TRY 61.3 million against Trendyol in July
              2023. Under subsequent Electronic Commerce Law amendments, Trendyol was compelled to structurally separate
              its private-label apparel business (TrendyolMilla) from its core marketplace, ceasing direct on-platform
              private-label sales as of January 1, 2024. While the TCA's 2024 re-evaluation confirmed that algorithmic
              self-preferencing concerns were addressed by this operational separation, the regulator firmly upheld
              ongoing behavioral obligations restricting third-party seller data usage. For prospective investors, core
              diligence asks center on three critical areas: first, obtaining standalone audited IFRS financial
              statements verifying segment gross margins; second, assessing the legal and technical boundaries governing
              data-sharing between the marketplace, TrendyolMilla, and parent Alibaba; and third, clarifying minority
              shareholder rights and board governance under Alibaba's controlling stake. Key thesis-break triggers
              include sustained negative free cash flow in international expansion hubs or renewed antitrust enforcement
              that impairs marketplace take rates.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Primary Investment Directive: Track'
            body: >-
              We assign Trendyol an investment recommendation of Track with a Medium confidence rating and a High risk
              assessment. While domestic scale and marketplace economics are highly compelling, entry at or near the
              2021 decacorn valuation of $16.5 billion is unattractive in light of current public emerging-market
              multiples and unverified international unit margins. Investors should monitor private secondary discounts
              and await audited financial filings.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV015
          - type: callout
            title: Governance and Structural Regulatory Overhang
            body: >-
              Alibaba's overwhelming 70% to 86.5% equity ownership, coupled with the Turkish Competition Authority's
              regulatory mandates requiring structural separation of TrendyolMilla and strict data-usage firewalls,
              introduces persistent operational and governance friction. Minority investors face asymmetric liquidity
              timing and potential alignment conflicts with the majority shareholder.
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV008
