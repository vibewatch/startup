      - number: '7.4'
        title: Comprehensive Risk Heatmap, Mitigation Maturity, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Trendyol's risk architecture reveals asymmetric exposure between mature domestic fulfillment
              infrastructure and fragile regulatory and governance frameworks. The group possesses robust technical
              mitigations through its dedicated Trendyol Tech engineering center and localized fulfillment nodes, but
              residual vulnerabilities in antitrust data ring-fencing, international seller currency exposure, and
              Alibaba ownership concentration remain substantial. For prospective pre-IPO investors, monitoring explicit
              thesis-break triggers is essential to protect capital. Key thesis-break triggers include: (1) an adverse
              TCA enforcement determination establishing unauthorized information flow between marketplace merchant
              databases and TrendyolMilla private-label merchandising; (2) European regulatory or consumer protection
              sanctions imposing severe cross-border operational restrictions or customs delays across CEE markets; (3)
              failure to demonstrate sustained progress toward the 50% international revenue milestone required to
              unlock a dual-listing liquidity event; and (4) acute Turkish lira foreign exchange depreciation severely
              eroding dollar-denominated gross margins and merchant recruitment. Prior to committing growth capital,
              allocators must pursue targeted diligence regarding technical compliance firewalls, regional unit
              economics, and minority governance protections.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR012
              - CR014
