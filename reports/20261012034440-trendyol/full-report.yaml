  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Trendyol's addressable commercial boundary spans domestic multi-category e-commerce in Türkiye, regional
              cross-border apparel export across the Middle East and Europe, and urban quick commerce. Founded as a
              focused fashion destination, the platform diversified into a horizontal marketplace spanning electronics,
              home goods, cosmetics, and groceries, aggregating more than 300,000 active third-party merchants and 40
              million consumers. In its domestic market, core retail transactions anchor platform engagement and
              operational cash flow, supported by its proprietary Trendyol Express logistics network. Adjacencies
              include second-hand fashion resale through Dolap, which hosts over 1.4 million active peer-to-peer
              sellers, and instant grocery and prepared meal delivery via Trendyol Go. In May 2025, Uber acquired an 85%
              majority interest in Trendyol Go for $700 million, separating food delivery unit economics from the core
              marketplace while retaining ecosystem integration and commercial synergy across consumer touchpoints.
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM013
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Evidence-Constrained SOM Lenses'
        blocks:
          - type: paragraph
            body: >-
              Assessing Trendyol's total addressable opportunity requires separating its high-inflation Turkish domestic
              core from international cross-border expansion in the Gulf Cooperation Council and Central and Eastern
              Europe. Third-party research by Lucidity Insights sizes the broader MENA e-commerce market at
              approximately $29 billion in 2024, forecasting expansion to $50 billion by 2028 at a 14.5% compound annual
              growth rate. Within Türkiye, the serviceable addressable e-commerce market represents between $35 billion
              and $40 billion in annual online retail transactions. In 2021, Trendyol established clear market
              leadership by capturing 34% of Turkish e-commerce GMV, far outpacing principal domestic competitor
              Hepsiburada at 11%. By 2024, Trendyol reported processing over $12.5 billion in consolidated platform GMV.
              Furthermore, international operations reached an annualized GMV run-rate exceeding $1.0 billion in the
              Gulf within sixteen months of launch, demonstrating that cross-border fashion demand can capture
              meaningful share in affluent Middle Eastern consumer markets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
      - number: '2.3'
        title: Buyer, User, and Merchant Segmentation Dynamics
        blocks:
          - type: paragraph
            body: >-
              Trendyol operates a two-sided platform ecosystem characterized by distinct consumer buyer personas and
              commercial merchant segments. The consumer base comprises value-conscious domestic mass-market shoppers
              seeking convenience, competitive pricing, and bundled promotions, alongside cross-border retail buyers in
              the Gulf and Europe purchasing Turkish-origin apparel. On the supply side, the platform aggregates
              traditional retailers, brand distributors, and small textile manufacturers who leverage Trendyol's
              technology infrastructure and merchant onboarding integrations to reach 40 million active consumers. In
              CEE markets such as Romania, where Trendyol acquired 1.5 million shoppers and onboarded over 6,600
              sellers, rapid adoption was propelled by digital onboarding programs that reduced seller activation times
              to six days. Consumer stickiness is reinforced through multi-category purchasing habits across fashion,
              personal care, and second-hand resale on Dolap, creating high switching costs compared to single-category
              vertical competitors.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Drivers, Inflation Deflation, and Regulatory Headwinds
        blocks:
          - type: paragraph
            body: >-
              Trendyol's forward growth trajectory is driven by international market penetration and Turkey's structural
              cost advantage in textile manufacturing, but faces acute macroeconomic and regulatory constraints.
              Macroeconomic volatility remains a primary operational headwind: with Turkish consumer price inflation
              reaching 31.75% year-over-year in July 2026, nominal TRY marketplace sales figures overstate true
              consumption growth, requiring rigorous category-level deflation passes. Concurrently, regulatory
              interventions have reshaped the competitive landscape. Under Law No. 7416 amending the Electronic Commerce
              Law, major marketplace operators are strictly barred from retailing proprietary private-label merchandise
              on their core intermediary platforms. Following Turkish Competition Authority investigations and a TRY
              61.3 million penalty for algorithmic self-preferencing in 2023, Trendyol completed the migration of its
              private-label apparel into TrendyolMilla in January 2024. While international sales reached roughly 20% of
              revenue in late 2024, achieving management's 50% international mix target prior to an initial public
              offering requires substantial capital deployment in foreign fulfillment.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Macroeconomic Inflation Distorts Nominal Marketplace Metrics
            body: >-
              In an economy where consumer price index inflation exceeded 31% year-over-year in 2026, nominal GMV growth
              in Turkish Lira cannot be interpreted as volume or demand expansion. Real top-line performance requires
              deflating transacted values against sector-specific indices, distinguishing headline inflation
              pass-through from authentic underlying market share gains.
            calloutType: insight
            claimRefs:
              - CM005
          - type: callout
            title: Regulatory Decoupling of Private Label Operations
            body: >-
              The Turkish Competition Authority's enforcement and the Electronic Commerce Law amendments under Law No.
              7416 forced Trendyol to structurally separate its private label apparel business into TrendyolMilla,
              removing high-margin proprietary brands from the core marketplace algorithm and curtailing platform
              self-preferencing.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Turkish E-Commerce Landscape and Core Marketplace Dynamics
        blocks:
          - type: paragraph
            body: >-
              The Turkish e-commerce marketplace landscape is characterized by a concentrated competitive duopoly
              alongside expanding multinational incumbents. Trendyol and Hepsiburada historically define Turkish digital
              commerce, establishing opposite strategic trajectories between 2024 and 2025. Hepsiburada transitioned to
              regional ownership after Kazakhstan-based Kaspi.kz completed its acquisition of a controlling stake on
              January 29, 2025, while Trendyol remains consolidated under Alibaba Group's majority shareholding.
              Third-party sector analyses indicate that Trendyol captured more than 30 percent domestic market share in
              2023, more than doubling the volume of its nearest rival. Industry estimates project Trendyol's primary
              marketplace platform sales at 14,009 million US dollars for 2025, with expected expansion of 10 to 15
              percent into 2026 as scale advantages compound across high-frequency retail categories.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
      - number: '3.2'
        title: Platform Capabilities and Proprietary Fulfillment Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Fulfillment infrastructure serves as the primary operational battleground between Turkish marketplace
              operators. Trendyol Express operates an extensive proprietary delivery network covering all 81 provinces
              of Turkey, enabling same-day delivery promises in dense metropolitan areas and reducing reliance on
              third-party commercial couriers. Hepsiburada counters with its dedicated HepsiJet logistics arm and
              HepsiLojistik integrated merchant warehousing. Trendyol's multi-service super-app expansion through
              Trendyol Go and second-hand trading on Dolap broadens customer touchpoints beyond traditional marketplace
              transactions. Internationally, Trendyol has extended its operational footprint into the Gulf Cooperation
              Council, serving more than 3.7 million regional customers with dedicated infrastructure in Saudi Arabia
              and the UAE to capture cross-border export demand.
            claimRefs:
              - CP004
              - CP005
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP014
      - number: '3.3'
        title: Pricing Dynamics, Seller Economics, and Multi-Homing Realities
        blocks:
          - type: paragraph
            body: >-
              Price competition across Turkish digital retail centers on promotional discount calendars, merchant
              commissions, and subsidized shipping arrangements. Platform operators deploy dynamic pricing algorithms
              and segmented campaigns to target price-sensitive demographic cohorts amid domestic macroeconomic
              inflation. For merchant partners, multi-homing across both Trendyol and Hepsiburada is standard practice,
              driven by high seller concentration where the Marmara industrial region alone accounts for 50 percent of
              registered merchants. However, neither platform publishes audited quarterly gross merchandise volume or
              standardized unit take-rate disclosures under public reporting formats. Platform inertia is sustained
              primarily by massive customer reach and integrated merchant logistics rather than contractual seller
              exclusivity.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP009
      - number: '3.4'
        title: Moat Durability, Platform Displacement, and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of Trendyol's competitive moat is constrained by escalating domestic antitrust
              enforcement and platform governance rules. In July 2023, the Turkish Competition Authority concluded an
              investigation by penalizing Trendyol approximately 61.3 million Turkish lira for algorithmic manipulation
              and unauthorized utilization of third-party seller marketplace data. Regulatory interventions under
              Turkey's revised e-commerce legislation impose structural restrictions on marketplace operators promoting
              proprietary private labels over independent merchant inventory. While Trendyol's scale, proprietary
              logistics fleet, and international export channels defend against domestic displacement, compliance
              obligations restrict aggressive self-preferencing and platform lock-in tactics.
            claimRefs:
              - CP010
              - CP011
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Ownership Divergence Between Turkish Marketplace Leaders
            body: >-
              While Trendyol scales under Alibaba Group's global technological and capital backing, Hepsiburada's
              acquisition by Kazakhstan's Kaspi.kz introduces a fintech-led regional challenger model into Turkish
              retail.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: callout
            title: Regulatory Scrutiny on Marketplace Algorithmic Self-Preferencing
            body: >-
              Antitrust enforcement by the Turkish Competition Authority underscores the legal vulnerability of hybrid
              marketplace operators that balance third-party seller hosting with private-label brand competition.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broad, but current take rates are private
        blocks:
          - type: paragraph
            body: >-
              Trendyol's economic model spans a third-party marketplace, owned logistics, food and grocery delivery,
              payments, resale, and historically first-party private labels. The clearest pricing evidence is old: a
              2016 WWD interview said brands set pricing while Trendyol received a percentage of each sale, with the
              percentage varying by brand and target category margin. That establishes a commission mechanism, not a
              current realized take rate. The same interview described controlled private-label pricing, while later
              Turkish rules required those products to move off the main marketplace. Investors should therefore
              separate marketplace commissions, merchandise margin, delivery economics, and any payment revenue rather
              than applying one blended marketplace multiple.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI010
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI015
      - number: '4.2'
        title: GMV and operating scale do not resolve revenue or margin
        blocks:
          - type: paragraph
            body: >-
              Lucidity Insights reports more than $12.5 billion of 2024 GMV, 2.5 million daily packages across 35
              countries, 40 million customers, and Turkish operational profitability since 2023. These are useful scale
              signals, but none is interchangeable with audited revenue, gross profit, EBITDA, or free cash flow.
              Historical WWD data also show that Trendyol once combined transaction volume with rapid inventory turns,
              yet that 2016 snapshot cannot establish today's consolidated economics. The diligence focus should be a
              reconciliation from GMV to recognized revenue, then to contribution margin after returns, discounts,
              payment fees, fulfillment, courier subsidies, and customer acquisition spending.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
              - CI016
      - number: '4.3'
        title: Funding history is not evidence of current liquidity
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence confirms a $1.5 billion financing at a $16.5 billion valuation in August 2021, while
              Tracxn summarizes $1.54 billion raised across four rounds and identifies August 2021 as the latest round
              in its profile. Those figures describe historical capital raised, not cash still available in October
              2026. The sources do not disclose current cash, burn, runway, debt, working-capital requirements, capital
              expenditure, or the allocation of liquidity among Turkey and international operations. The 2022 IPO
              discussion is similarly a dated management threshold rather than a financing commitment. A current balance
              sheet, cash-flow statement, debt schedule, and downside liquidity plan are prerequisites for any
              capital-adequacy conclusion.
            claimRefs:
              - CI001
              - CI010
              - CI011
              - CI014
              - CI016
      - number: '4.4'
        title: 'Financial verdict: scaled activity, unproven earnings quality'
        blocks:
          - type: paragraph
            body: >-
              The public case is strongest on activity and ecosystem breadth: Trendyol has multiple monetizable
              transaction surfaces, large reported GMV, dense logistics activity, and an external report of domestic
              operating profitability. The underwriting case is weakest exactly where value accrues: realized commission
              rates, segment revenue, gross margin, contribution margin, cash conversion, and international
              customer-acquisition efficiency are not disclosed in the assigned evidence. Regulatory separation of
              private-label sales and continuing restrictions on marketplace-data use can also change economics that
              older pricing evidence once described. The appropriate conclusion is not that margins are poor, but that
              revenue quality, margin durability, and financing independence remain unverified.
            claimRefs:
              - CI002
              - CI006
              - CI009
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: GMV cannot substitute for revenue
            body: >-
              The strongest scale disclosure is 2024 GMV, while current consolidated revenue and margins are absent.
              Applying a revenue multiple to GMV or treating reported Turkish operating profitability as consolidated
              free cash flow would materially overstate what the evidence establishes.
            calloutType: risk
            claimRefs:
              - CI006
              - CI009
              - CI015
          - type: callout
            title: Make the data room the underwriting gate
            body: >-
              Require audited statements, a GMV-to-revenue bridge, segment contribution margins, and a current liquidity
              schedule before assigning earnings credit. Historical funding raised and valuation do not demonstrate cash
              available or runway in October 2026.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Multi-Category Marketplace and Ecosystem Services
        blocks:
          - type: paragraph
            body: >-
              Trendyol has transformed its operating posture from a vertical flash-sale apparel merchant into a
              comprehensive digital superapp ecosystem. The platform anchors on its core multi-category marketplace,
              which aggregates catalog listings from more than 300,000 third-party merchants across fashion, consumer
              electronics, home goods, cosmetics, and grocery supplies. Rather than operating purely as a commercial
              storefront, Trendyol surrounds consumer shopping journeys with tightly integrated vertical services,
              including second-hand C2C apparel exchange via Dolap, proprietary sorting and parcel fulfillment through
              Trendyol Express, and rapid urban grocery dispatch through Trendyol Go. This multi-product architecture
              increases user engagement frequency and creates significant ecosystem lock-in, as consumers consolidate
              retail, resale, and convenience purchasing into a unified mobile application. Technical capabilities
              supporting this ecosystem are centralized under Trendyol Tech, an R&D unit officially recognized by the
              Turkish Ministry of Industry and Technology, which deploys thousands of software engineers focused on
              high-throughput catalog indexing, dynamic search ranking, and real-time logistics optimization.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Proprietary Logistics and On-Demand Delivery Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The core operational differentiator of Trendyol's e-commerce platform is its proprietary logistics
              infrastructure, established to overcome fragmented third-party carrier networks in Turkey. Launched in
              2018, Trendyol Express insourced last-mile delivery, scaling to handle approximately 2.5 million daily
              package deliveries across all 81 Turkish provinces through automated regional sorting hubs, dedicated
              linehaul routes, and localized courier networks. Controlling package movement enables predictable delivery
              windows, faster returns processing, and lower per-unit fulfillment costs compared to independent freight
              carriers. Alongside standard parcel logistics, the group deployed Trendyol Go as an on-demand delivery
              network for hot restaurant meals and supermarket groceries, addressing dense metropolitan demand with
              sub-hour fulfillment. The strategic value of this courier dispatch layer was validated in May 2025 when
              Uber acquired an 85% majority stake in Trendyol Go for $700 million after the division processed 200
              million orders in 2024. Simultaneously, Dolap provides an asset-light consumer-to-consumer circular
              fashion channel with 1.4 million sellers, leveraging the group's integrated payment and parcel networks.
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Technology Architecture, AI Capabilities, and Regulatory Governance
        blocks:
          - type: paragraph
            body: >-
              Trendyol's software architecture combines proprietary internal development from Trendyol Tech with
              scalable cloud and machine learning technologies inherited from Alibaba Group following its majority
              investment. Alibaba's technical engagement provided access to advanced distributed data stores, container
              orchestration, and real-time personalization frameworks that power recommendation feeds for tens of
              millions of active shoppers. In 2024, Trendyol expanded this technical stack by deploying Turkey's first
              proprietary large language model, trained on Alibaba's compute infrastructure to automate multi-lingual
              product description translation and seller-buyer messaging across 25 export jurisdictions. However,
              Trendyol's algorithmic architecture has faced stringent regulatory scrutiny. In July 2023, the Turkish
              Competition Authority imposed a TRY 61.3 million administrative penalty after finding that Trendyol
              systematically manipulated search ranking algorithms using an internal coefficient multiplier to favor its
              private-label brands and utilized third-party seller transaction data for its own product lines. This
              enforcement forced significant architectural adjustments, requiring audited ranking neutrality and
              verifiable algorithmic change logging.
