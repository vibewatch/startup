            title: Cross-Border Regulatory and Intellectual Property Headwinds
            body: >-
              As Trendyol scales internationally to reduce its 87% domestic revenue dependency, it encounters
              substantial legal and compliance friction. The Athens Court injunction won by GRUPPO PAPARAZZI over
              counterfeit MASSARO apparel underscores the vulnerability of Trendyol's marketplace model to European
              trademark enforcement and potential EU regulatory penalties.
