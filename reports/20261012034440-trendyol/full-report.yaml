      - number: '7.3'
        title: Partner Dependencies, Governance Concentration, and Macro Exposure
        blocks:
          - type: paragraph
            body: >-
              Trendyol exhibits heavy strategic, technological, and corporate governance concentration centered on its
              majority owner, Alibaba Group. Following Alibaba's initial strategic investment of $728 million in 2018
              and subsequent capital injections, Alibaba expanded its shareholding to between 70% and 86.5%,
              transforming Trendyol into a critical pillar of its international digital commerce operations. While
              Alibaba provides advanced logistics architecture and cloud computing infrastructure, this pronounced
              shareholding creates notable corporate governance and capital allocation overhang. Management has
              articulated an eventual ambition to pursue a dual-listing initial public offering across Istanbul and
              Western financial centers once international sales reach 50% of revenue, but majority control by a Chinese
              multinational creates friction among Western institutional allocators and capital market regulators. At
              the operating level, international merchants transacting through Trendyol face financial and foreign
              exchange vulnerabilities, as platform payouts and accounting settlements are standardly denominated in
              Turkish lira. Sustained domestic inflation and currency fluctuations introduce margin compression and
              hedging overhead for cross-border sellers, requiring multi-currency banking agreements with regional
              European and Gulf financial institutions to preserve merchant retention.
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR013
