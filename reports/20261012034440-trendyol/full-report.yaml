  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Trendyol represents the undisputed market leader in Turkish e-commerce, operating a diversified superapp
              ecosystem spanning horizontal retail marketplace, instant grocery delivery (Trendyol Go), proprietary
              logistics (Trendyol Express), and consumer payments (Trendyol Pay). The core investment thesis rests on
              Trendyol's dominant domestic scale, having processed over $12.5 billion in gross merchandise value in 2024
              across 40 million customers and 2.5 million daily package deliveries, alongside proven operational
              profitability in its domestic Turkish market since 2023. This operational momentum was powerfully
              validated in May 2025 when Uber agreed to acquire an 85% stake in Trendyol Go for $700 million, unlocking
              non-dilutive liquidity and validating the standalone market value of the group's logistics and delivery
              assets. However, this impressive operational achievement is sharply counterbalanced by valuation reality:
              Trendyol's last confirmed institutional valuation mark of $16.5 billion, set during the August 2021
              funding round led by SoftBank, General Atlantic, Princeville Capital, ADQ, and QIA, is five years stale
              and unanchored to subsequent global valuation corrections. Public emerging-market and European e-commerce
              comparables have experienced dramatic valuation multiple compression from peak pandemic highs of 2.0x–3.5x
              revenue to current levels of 0.3x–0.8x revenue and 0.4x–0.7x GMV. At its historical $16.5 billion mark,
              Trendyol trades at an implied 1.3x 2024 GMV multiple, representing a rich premium to peers that is
              difficult to justify without audited corporate financial disclosures, proven international unit margins,
              and a transparent capital structure. Consequently, we assign Trendyol an investment recommendation of
              Track with an Expensive valuation stance, High risk rating, and Medium confidence, advising investors to
              maintain pricing discipline and seek a target entry valuation between $9.0 billion and $11.5 billion.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: Financing History, Cap Table Dynamics, and Valuation Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Trendyol's financing trajectory illustrates the dramatic scale of foreign capital backing Turkey's leading
              digital platform while also creating concentrated corporate governance. After bootstrapping the business
              in 2010 with $300,000 in personal savings, founder Demet Mutlu attracted institutional backing from Tiger
              Global, the European Bank for Reconstruction and Development, and Kleiner Perkins. The defining strategic
              inflection occurred in June 2018 when Alibaba Group acquired an initial majority stake for approximately
              $728 million, followed by an additional $350 million capital injection in March 2021 at an implied
              valuation of $9.4 billion. In August 2021, Trendyol completed a landmark $1.5 billion funding round co-led
              by General Atlantic, SoftBank Vision Fund 2, Princeville Capital, ADQ, and the Qatar Investment Authority,
              elevating the company's post-money valuation to $16.5 billion and crowning it as Turkey's first decacorn.
              Today, Alibaba controls an overwhelming 70% to 86.5% equity stake, with company founders and early
              executives holding the remaining equity alongside golden share voting rights. While this backing provides
              deep technological alignment and patient sovereign balance sheets, it creates significant governance
              overhang for potential public market investors. In private secondary transactions, emerging-market tech
              decacorns have traded at 30% to 50% discounts to 2021 peak valuations. Benchmark comparisons to publicly
              listed regional peers—including Poland's Allegro, Kazakhstan's Kaspi.kz, Latin America's MercadoLibre, and
              domestic rival Hepsiburada—demonstrate that normalized enterprise values cluster around 0.6x to 1.1x GMV
              for profitable platforms and below 0.5x GMV for capital-intensive marketplaces. Uber's $700 million
              acquisition of an 85% stake in Trendyol Go establishes an implied $824 million post-money enterprise
              valuation for the quick-commerce vertical against $2.0 billion in gross bookings (0.41x bookings),
              confirming that asset-heavy delivery infrastructure commands modest multiples.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
