          detail: Rapid entry into Gulf and CEE; international revenue reaches ~20%, but remains below the 30-50% IPO target.
        - label: 4. Regulatory & Antitrust Headwinds
          detail: >-
            TCA fine of TRY 61.3M, mandatory spin-off of TrendyolMilla private label, and ongoing data-separation
            compliance requirements.
        - label: 5. Valuation Multiple Compression
