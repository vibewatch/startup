  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Multi-Sided Customer Base and Geographic Segmentation
        blocks:
          - type: paragraph
            body: >
              Trendyol’s customer architecture operates as a dual-sided marketplace connecting digital consumers with
              merchants, brand owners, and local service providers. On the demand side, the platform serves over 40
              million consumers globally, with strong concentration among younger demographic cohorts, specifically
              millennials and Gen Z buyers drawn to its fashion-first merchandising, private label offerings (Trendyol
              Collection), and mobile application experience. The customer base spans three primary geographic tiers:
              the domestic core in Turkey, an expanding international presence across Central and Eastern Europe (CEE)
              and Germany, and a high-growth cross-border retail presence across the Gulf Cooperation Council (GCC)
              region.


              In its domestic market, Trendyol functions as an everyday superapp where retail buyers interact across
              multiple adjacent spending surfaces, including general marketplace goods, grocery delivery via Trendyol
              Go, peer-to-peer secondhand transactions via Dolap, and integrated digital checkout through Trendyol Pay.
              Geographically, Trendyol reaches across all 81 provinces of Turkey, supported by its in-house Trendyol
              Express delivery network. Internationally, demand segments vary: in Germany, over 1.5 million customers
              purchase Turkish apparel and goods; in Azerbaijan, the platform has scaled to approximately 2 million
              active customers; and in the GCC, active shoppers exceed 3.7 million across Saudi Arabia, the UAE, Qatar,
              Kuwait, Bahrain, and Oman. On the supply side, the platform aggregates over 250,000 domestic and
              cross-border merchants, ranging from independent SME apparel producers to major global apparel brands such
              as Nike, Adidas, Mango, and luxury cosmetics houses.
            claimRefs:
