chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Superapp Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2010 in Istanbul, Turkey, by Demet Mutlu alongside Evren Üçok and Begüm Tekin, Trendyol has
              evolved from an initial bootstrapped online fashion merchant into Turkey's largest multi-category
              e-commerce platform. The company operates a comprehensive horizontal marketplace connecting hundreds of
              thousands of merchant sellers with tens of millions of consumers across Turkey, Europe, and the Middle
              East. Over its decade-long expansion, Trendyol established an integrated superapp architecture combining
              core retail goods with proprietary infrastructure, including its dedicated logistics carrier Trendyol
              Express, secondhand apparel marketplace Dolap, and integrated payment gateway Trendyol Pay. This
              closed-loop operational model creates high customer retention and defensible switching costs across
              Turkey's digital consumer economy.
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO008
              - CO014
      - number: '1.2'
        title: Executive Leadership, Founder Background, and Alibaba Governance
        blocks:
          - type: paragraph
            body: >-
              Trendyol's corporate leadership combines experienced entrepreneurial founders with professional operators
              backed by institutional board governance. Founder Demet Mutlu launched the platform after leaving Harvard
              Business School, drawing on consumer brand management experience at multinational corporations including
              Procter & Gamble and Reckitt Benckiser to establish consumer trust and operational discipline in early
              Turkish e-commerce. Co-founder Evren Üçok serves as Chairperson of the board, overseeing strategic
              governance and capital allocation alongside majority shareholder Alibaba Group. Chief Executive Officer
              Erdem Inan manages day-to-day marketplace execution and commercial operations, while Group President
              Çağlayan Çetin directs international growth across Europe and the Gulf as well as major corporate
              transactions, providing leadership continuity under Alibaba's controlling governance.
            claimRefs:
              - CO001
              - CO002
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO007
      - number: '1.3'
        title: Capitalization History, Decacorn Valuation, and M&A Transactions
        blocks:
          - type: paragraph
            body: >-
              Trendyol's balance sheet and ownership structure reflect successive waves of international venture and
              strategic capital. Following early seed backing and venture financing from Tiger Global Management and
              Kleiner Perkins in 2010 and 2011, Alibaba Group made a transformative strategic entry in June 2018 by
              acquiring a majority stake for approximately $728 million. Alibaba subsequently expanded its equity
              commitment with follow-on funding, elevating its ownership to over 70%. In August 2021, Trendyol became
              Turkey's first private decacorn by securing a $1.5 billion funding round at a $16.5 billion post-money
              valuation co-led by General Atlantic, SoftBank Vision Fund 2, Princeville Capital, and Gulf sovereign
              wealth funds ADQ and QIA. In May 2025, Uber acquired an 85% stake in Trendyol's food and grocery unit
              Trendyol Go for $700 million, unlocking external liquidity and strategic alignment in domestic quick
              commerce.
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO007
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
              - CO004
      - number: '1.4'
        title: Operational Scale, International Expansion, and Regulatory Scrutiny
        blocks:
          - type: paragraph
            body: >-
              By 2024, Trendyol achieved substantial operating scale, processing more than $12.5 billion in annual GMV,
              serving 40 million customers, and dispatching 2.5 million packages daily across 35 countries. The platform
              achieved its first domestic operational profitability in Turkey in 2023, while aggressively expanding
              cross-border commerce into Central and Eastern Europe and the Gulf Cooperation Council markets, where
              annual Gulf GMV crossed $1 billion. This rapid expansion has been tempered by heightened regulatory
              intervention. In July 2023, the Turkish Competition Authority penalized Trendyol TRY 61.3 million for
              algorithmic self-preferencing and third-party merchant data exploitation. In response to amendments in
              Turkey's Electronic Commerce Law, the company executed a structural separation of its private-label brands
              to the standalone TrendyolMilla application as of January 1, 2024, demonstrating proactive compliance with
              tightening antitrust frameworks.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
