  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Operating Assumptions
      - Implied Valuation Logic
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Gulf GMV accelerates beyond $3B; international share hits 40%; Trendyol Go scales under Uber partnership;
          successful dual-listing IPO by 2027
        - $18.0B–$22.0B enterprise value based on 1.2x–1.4x forward GMV and premium emerging-market superapp multiple
        - Geopolitical tensions in Middle East, adverse cross-border tariff regulations in EU
        - 20% probability; contingent on international margin inflection and global IPO window opening
      - - Base Case
        - >-
          Domestic Turkey growth stabilizes at 15–20% in USD terms; Gulf maintains steady share; international revenue
          reaches 25–30%; IPO delayed to 2028–2029
        - >-
          $9.0B–$11.5B enterprise value based on 0.7x–0.9x 2024 GMV ($12.5B), reflecting private-market multiple
          compression
        - Extended Turkish macroeconomic instability, ongoing TCA data compliance friction
        - 55% probability; reflects current market conditions, private liquidity discounts, and Alibaba control
      - - Bear Case
        - >-
          International expansion stalls under severe local competition (Amazon, Noon); domestic margin compression from
          TCA regulatory enforcement; no IPO path
        - >-
          $5.5B–$7.5B enterprise value based on 0.4x–0.6x GMV, in line with low-margin distressed emerging-market retail
          comps
        - Further antitrust penalties, regulatory blockage of cross-border data sharing, subsidiary impairment
        - >-
          20% probability; triggered if Gulf operations generate persistent heavy cash burn without market share
          leadership
      - - Downside Liquidation / Stagnation
        - >-
          Severe currency collapse in Turkey; complete failure of European expansion; trapped minority equity with no
          exit
        - $3.5B–$4.5B asset liquidation value anchored solely on core Turkish logistics and Turkish e-commerce cash flow
        - Outright regulatory ban on marketplace operations or forced Alibaba divestiture
        - 5% probability; tail risk scenario driven by severe geopolitical or regulatory rupture
    notes: >-
      Valuation ranges are derived from 2024 GMV of $12.5B and May 2025 Uber transaction benchmarks; figures represent
      enterprise value estimates assuming debt-free operations.
