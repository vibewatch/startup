chapter:
  number: 6
  title: Customers
  summary: Trendyol operates a two-sided platform serving over 40 million active consumers and more than 250,000 marketplace sellers across Turkey, Europe, and the GCC. While consumer engagement is high across core domestic fashion and superapp verticals, international customer expansion faces severe compliance friction, including Greek trademark injunctions and ongoing competition scrutiny over seller data.
sections:
  - id: customer-segmentation
    title: Multi-Sided Customer Base and Geographic Segmentation
    body: >
      Trendyol’s customer architecture operates as a dual-sided marketplace connecting digital consumers with merchants, brand owners, and local service providers. On the demand side, the platform serves over 40 million consumers globally, with strong concentration among younger demographic cohorts, specifically millennials and Gen Z buyers drawn to its fashion-first merchandising, private label offerings (Trendyol Collection), and mobile application experience. The customer base spans three primary geographic tiers: the domestic core in Turkey, an expanding international presence across Central and Eastern Europe (CEE) and Germany, and a high-growth cross-border retail presence across the Gulf Cooperation Council (GCC) region.


      In its domestic market, Trendyol functions as an everyday superapp where retail buyers interact across multiple adjacent spending surfaces, including general marketplace goods, grocery delivery via Trendyol Go, peer-to-peer secondhand transactions via Dolap, and integrated digital checkout through Trendyol Pay. Geographically, Trendyol reaches across all 81 provinces of Turkey, supported by its in-house Trendyol Express delivery network. Internationally, demand segments vary: in Germany, over 1.5 million customers purchase Turkish apparel and goods; in Azerbaijan, the platform has scaled to approximately 2 million active customers; and in the GCC, active shoppers exceed 3.7 million across Saudi Arabia, the UAE, Qatar, Kuwait, Bahrain, and Oman. On the supply side, the platform aggregates over 250,000 domestic and cross-border merchants, ranging from independent SME apparel producers to major global apparel brands such as Nike, Adidas, Mango, and luxury cosmetics houses.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU007
      - CU013
      - CU014
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-and-durability
    title: Adoption Trajectory, Usage Velocity, and Retention Dynamics
    body: >
      The platform's adoption curve has expanded dramatically over the past decade, scaling from 4 million members in 2011 to 16 million in 2018, 19.3 million in 2020, 30 million in 2021, and over 40 million active consumers by 2024–2025. Mobile application adoption remains the primary operational engine: the Trendyol mobile application has accumulated over 50 million downloads, maintaining a 4.7-star rating across 93,000 Apple App Store reviews and 4.2 stars across 2 million Google Play Store reviews. Engagement intensity is evidenced by peak shopping volumes; during November 2024 promotional campaigns, the platform recorded 250 million total visits, 120 million products sold, and 25 million daily active users, including 5 million active international shoppers.


      Customer retention and engagement durability are reinforced through algorithmic personalization, automated flash discounts (branded as Trendyol Days), and high-frequency delivery logistics. Operational velocity relies on Google Cloud BigQuery and Looker business intelligence infrastructure, processing over 260,000 analytical queries daily during peak retail events like Black Friday to optimize conversion rates and dynamic pricing. However, Trendyol does not disclose standard software or subscription-grade cohort retention metrics, such as Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or multi-year consumer cohort churn curves. While repeat purchasing is structurally supported by low-cost everyday categories and logistics speed through Trendyol Express—delivering over 1.5 million packages daily across 27 countries—the lack of audited cohort survival data represents a critical diligence gap for evaluating customer lifetime value durability.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU008
      - CU012
    tableRefs:
      - TU002
  - id: concentration-and-adverse-friction
    title: Commercial Dependencies, Channel Friction, and Adverse Compliance Headwinds
    body: >
      Trendyol’s customer concentration risk is structurally low on the consumer side due to extreme fragmentation across tens of millions of retail households; no single retail customer or merchant represents material corporate revenue. However, the business exhibits high geographic and regulatory concentration: Turkey generates roughly 87% of core e-commerce revenues, leaving the consolidated customer ecosystem exposed to domestic macroeconomic volatility, currency devaluation, and shifting local e-commerce regulations. On the merchant supply side, Trendyol historically faced severe regulatory friction from the Turkish Competition Authority (TCA). The TCA investigated Trendyol for algorithmic self-preferencing and unauthorized exploitation of third-party seller data to benefit its proprietary private-label lines, resulting in a TRY 61.3 million administrative fine in 2023 and mandating the operational separation of private-label fashion into the standalone TrendyolMilla application as of January 2024.


      International customer expansion introduces acute legal, IP, and platform compliance headwinds. In Europe, where Trendyol has expanded across CEE and Greece, local brand owners have mounted aggressive legal pushback. Specifically, Greek knitwear manufacturer GRUPPO PAPARAZZI secured an interim injunction against Trendyol from the Athens Single-Member Court of First Instance on November 21, 2025, barring Trendyol from using or distributing products bearing the registered MASSARO trademark in Greece under threat of a €10,000 fine per violation and initiating a €500,000 damages claim for trademark infringement and counterfeiting. These intellectual property enforcement actions, alongside heightened European Commission scrutiny over product safety and compliance across cross-border marketplaces, demonstrate that international customer acquisition carries material counterparty and brand-protection risks that could impede merchant onboarding and consumer adoption abroad.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU015
      - CU016
    tableRefs:
      - TU003
