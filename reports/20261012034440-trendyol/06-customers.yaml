callouts:
  - calloutType: strength
    title: Decacorn-Scale Consumer Ecosystem and Superapp Engagement
    body: Trendyol has built an exceptional consumer franchise with over 40 million active shoppers, 50 million app downloads, and 250,000 merchants. By bundling retail, Trendyol Express logistics, Trendyol Pay checkout, and Dolap resale into a unified interface, Trendyol maximizes consumer switching costs and daily application touchpoints across Turkey.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
  - calloutType: risk
    title: Cross-Border Regulatory and Intellectual Property Headwinds
    body: As Trendyol scales internationally to reduce its 87% domestic revenue dependency, it encounters substantial legal and compliance friction. The Athens Court injunction won by GRUPPO PAPARAZZI over counterfeit MASSARO apparel underscores the vulnerability of Trendyol's marketplace model to European trademark enforcement and potential EU regulatory penalties.
    claimRefs:
      - CU009
      - CU010
      - CU011
