evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Consolidated audited income statements, balance sheets, and cash flow reports for Trendyol Group under IFRS.
    whyItMatters: >-
      Trendyol has never published standalone audited financial statements, making exact net margins, cash burn, and
      international unit economics unverifiable.
    diligencePath: >-
      Obtain audited financial disclosures from Alibaba quarterly reports and confidential data room materials during
      pre-IPO review.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: international-margins-and-segment-reporting
    missingEvidence: >-
      Audited segment financials, contribution margins, and cross-border logistics cost per order for Gulf and CEE
      operations.
    whyItMatters: >-
      Without segmented unit economics, international market expansion cannot be validated for profitability or
      standalone cash generation.
    diligencePath: >-
      Obtain Alibaba Group segment disclosures or confidential IPO prospectus draft detailing country-level EBITDA and
      logistics subsidies.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: scale-benchmarks
    missingEvidence: >-
      Audited financial statements and standardized GMV disclosures comparing Trendyol and Hepsiburada on an
      inflation-adjusted basis.
    whyItMatters: >-
      Reported marketplace growth figures in Turkish lira suffer from acute inflation distortions, hindering exact
      apples-to-apples share comparison.
    diligencePath: >-
      Review subsequent regulatory filings from Kaspi.kz regarding Hepsiburada and parent Alibaba disclosures for
      Trendyol.
  - type: private-evidence-only
    severity: minor
    topic: pricing-competition
    missingEvidence: Net take-rate and commission schedule comparisons across overlapping retail categories for third-party sellers.
    whyItMatters: >-
      Take-rate compression or merchant subsidies directly determine sustainable unit economics between rival
      marketplace operators.
    diligencePath: >-
      Obtain merchant fee schedules and seller settlement statements across Turkish fashion, electronics, and FMCG
      categories.
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Audited consolidated and segment financial statements with a GMV-to-revenue reconciliation, gross margin, EBITDA,
      and cash flow.
    whyItMatters: GMV and operating activity cannot establish recognized revenue, earnings quality, or cash conversion.
    diligencePath: >-
      Request audited IFRS statements, management accounts, and monthly segment reconciliations for Turkey and each
      international region.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current realized take rates, returns, discounting, fulfillment cost, CAC, retention, contribution margin, and
      payback by stream and geography.
    whyItMatters: Scale may consume rather than generate cash if logistics and acquisition costs exceed net monetization.
    diligencePath: Obtain order-level cohort economics and reconcile each metric to the general ledger.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-gap
    missingEvidence: >-
      Current unrestricted cash, monthly burn, runway, debt and covenants, working-capital needs, planned use of funds,
      and downside financing triggers.
    whyItMatters: >-
      Historical funding raised does not establish liquidity available to finance current operations or international
      expansion.
    diligencePath: >-
      Request a current balance sheet, 24-month cash forecast, debt schedule, covenant certificates, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cloud-infrastructure
    missingEvidence: >-
      Granular breakdown of cloud computing infrastructure allocation between Alibaba Cloud and domestic data center
      facilities
    whyItMatters: >-
      Technical dependency on Alibaba Cloud infrastructure influences long-term operational resilience, latency in
      non-domestic regions, and compliance with data localization mandates
    diligencePath: >-
      Request engineering architecture documentation and cloud hosting vendor contracts during technical confirmatory
      diligence
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public engineering telemetry, open-source repositories, or developer API uptime status dashboards for Trendyol
      Tech services
    whyItMatters: >-
      Independent developer metrics would corroborate internal R&D throughput and system reliability across high-volume
