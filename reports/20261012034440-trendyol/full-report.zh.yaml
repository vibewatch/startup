      - number: '8.3'
        title: 乐观、基准与悲观回报情景
        blocks:
          - type: paragraph
            body: >-
              为评估 Trendyol 的风险调整后回报，我们以 2024 年运营指标（$12.5 billion GMV、40 million 名购物者）、近期子公司交易和同业倍数为锚，搭建多情景估值模型。在乐观情景（20%
              概率）下，Trendyol 成功加快在沙特阿拉伯、阿联酋、德国以及中东欧的国际扩张，到 2027 年将国际销售占集团总收入的比例从约 20% 提高到 40% 以上。Trendyol Express
              的经营杠杆和广告收入扩张推高集团 EBITDA 利润率，支持公司在伊斯坦布尔及伦敦或纽约双重上市，企业价值达到 $18.0 billion 至 $22.0 billion（预期 GMV 的
              1.2x–1.4x）。在基准情景（55% 概率）下，土耳其国内收入以美元计价每年稳健增长 15% 至
              20%，由市场主导地位和稳定的通胀传导支撑；国际业务则在海湾地区和罗马尼亚实现温和扩张。但私募市场流动性受限、倍数回归常态，使合理估值维持在 $9.0 billion 至 $11.5 billion（2024 年
              GMV 的 0.7x–0.9x）。要让新一轮机构资本获得有吸引力的中十几位数 IRR，估值必须较 2021 年融资估值折价 30% 至 45%。在悲观情景（20% 概率）下，Amazon 和 Noon
              在海湾地区展开激烈竞争，导致现金持续消耗；土耳其宏观经济波动和本币贬值则侵蚀美元计价的盈利能力。在该情景下，企业价值压缩至 $5.5 billion 至 $7.5 billion（0.4x–0.6x
              GMV），反映新兴市场零售的困境估值。另有 5% 的尾部风险情景，代表资本长期锁定和倍数清算折价。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
