            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO008
              - CO014
      - number: '1.2'
        title: 高管团队、创始人背景与 Alibaba 治理
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的公司领导层由经验丰富的创业者和职业经理人组成，并由机构化的董事会治理提供支持。创始人 Demet Mutlu 离开哈佛商学院后创办该平台，凭借在 Procter & Gamble 和
              Reckitt Benckiser 等跨国公司的消费品牌管理经验，在土耳其电商早期建立消费者信任和运营纪律。联合创始人 Evren Üçok 担任董事长，与控股股东 Alibaba Group
              共同负责战略治理和资本配置。首席执行官 Erdem Inan 管理平台日常执行和商业运营，集团总裁 Çağlayan Çetin 则负责欧洲和海湾地区的国际增长及重大公司交易，在 Alibaba
              控制下维持领导层连续性。
            claimRefs:
              - CO001
              - CO002
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO007
      - number: '1.3'
        title: 资本化历程、超级独角兽估值与并购交易
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的资产负债表和所有权结构反映出国际风险资本与战略资本的多轮注入。2010 年和 2011 年获得 Tiger Global Management、Kleiner Perkins
              的早期种子和风险投资后，Alibaba Group 于 2018 年 6 月以约 $728M 收购多数股权，完成改变公司格局的战略入股。随后 Alibaba 通过追加融资扩大股权投入，将持股比例提升至 70%
              以上。2021 年 8 月，Trendyol 以 15 亿美元融资、165 亿美元投后估值成为土耳其首家私营超级独角兽；该轮融资由 General Atlantic、SoftBank Vision Fund
              2、Princeville Capital 以及海湾主权财富基金 ADQ 和 QIA 联合领投。2025 年 5 月，Uber 以 $700M 收购 Trendyol 旗下餐饮和杂货业务 Trendyol Go
              的 85% 股权，为国内即时零售释放外部流动性并实现战略协同。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO007
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
