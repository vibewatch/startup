  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 多边客户基础与地域分层
        blocks:
          - type: paragraph
            body: >
              Trendyol 的客户架构是连接数字消费者、商户、品牌所有者和本地服务商的双边平台。需求端，平台在全球服务超过 40M 消费者，用户明显集中于年轻群体，尤其是被时尚优先的商品运营、自有品牌 Trendyol
              Collection 和移动应用体验吸引的千禧一代及 Gen Z 买家。客户基础分为三个主要地域层次：土耳其国内核心市场、覆盖中东欧（CEE）和德国的扩张中海外业务，以及覆盖 GCC 地区的高增长跨境零售业务。


              在国内市场，Trendyol 是一款日常超级应用，零售买家可以在多个相邻消费触点互动，包括普通平台商品、通过 Trendyol Go 配送杂货、通过 Dolap 进行点对点二手交易，以及通过 Trendyol
              Pay 集成数字结账。Trendyol 借助自有 Trendyol Express 配送网络覆盖土耳其全部 81 个省份。国际需求则各有不同：德国有超过 1.5M
              名客户购买土耳其服饰和商品；阿塞拜疆平台已扩大到约 2M 名活跃客户；GCC 的沙特阿拉伯、阿联酋、卡塔尔、科威特、巴林和阿曼共有超过 3.7M 名活跃购物者。供给端，平台汇聚超过 250,000
              家国内和跨境商户，从独立中小服饰生产商到 Nike、Adidas、Mango 等全球大型服装品牌及高端化妆品公司。
