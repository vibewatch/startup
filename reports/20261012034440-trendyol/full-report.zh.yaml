        - 签约区域包裹配送和储物柜网络
        - 高
        - 罗马尼亚配送网络出现运力瓶颈、服务中断或涨价
        - 高
        - 与多家快递服务商建立战略合作，并投资自有布加勒斯特仓库
        - 中等（依赖土耳其核心 Trendyol Express 网络之外的本地第三方承运商）
      - - 跨境支付与银行网关
        - 区域商业银行（Banca Transilvania、ING 等）
        - 支付处理、消费者分期贷款和货币清算
        - 中等
        - 支付结算失败、货币兑换损耗或监管机构对交换费设限
        - 中等
        - 多银行集成和本地消费金融促销协议
        - 低（关键运营市场的金融机构合作伙伴基础多元化）
      - - 土耳其核心快递运力
        - Trendyol Express 独立承包商
        - 覆盖土耳其 81 个省的末端快递和配送车队
        - 高
        - 劳资纠纷、零工承包商重新归类或燃油成本通胀上升
        - 中等
        - 专有调度算法、有竞争力的薪酬方案和燃油补贴
        - 中等（土耳其持续的通胀压力影响快递车队留存）
    notes: 交易对手方风险敞口评估依据是截至 2026 年 10 月的公司治理记录、物流协议和银行合作披露。
