            body: >-
              Trendyol 已建立起出色的消费者业务，拥有超过 40M 活跃购物者、50M 应用下载和 250,000 家商户。通过在统一界面整合零售、Trendyol Express 物流、Trendyol Pay
              结账和 Dolap 二手交易，Trendyol 将消费者迁移成本和土耳其各地的日常应用触点推至最大。
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: callout
            title: 跨境监管与知识产权逆风
            body: >-
              Trendyol 为降低 87% 的国内收入依赖而进行国际扩张，同时遭遇显著的法律和合规摩擦。GRUPPO PAPARAZZI 就仿冒 MASSARO 服饰在雅典法院取得的禁令，凸显 Trendyol
              平台模式容易受到欧洲商标执法和潜在欧盟监管处罚的影响。
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险架构
        blocks:
          - type: paragraph
            body: >-
              Trendyol 在土耳其核心国内市场接受严格的反垄断和法定监管，同时还要应对欧洲和中东不断出现的数字法规。2023 年 7 月，TCA 完成对 Trendyol
              平台实践的广泛调查，认定公司通过操纵算法排序和不当使用第三方商户数据为自有品牌获益、滥用支配地位，处以 TRY 61,342,847.73（约 EUR 5.8M）行政罚款。针对第 7416 号法律修订第 6563
              号《电子商务监管法》，Trendyol 推出专门的 TrendyolMilla 应用，将自有品牌零售业务结构性拆分，并于 2024 年 1 月 1 日起彻底移除核心平台上的第一方自有品牌销售。TCA 在 2024
              年 7
              月的复评决定中承认，当前运营拆分已使算法自我偏好问题失去现实意义，但明确维持平台第三方数据收集、存储和隔离方面的持续义务，强调结构性拆分本身并不会消除竞争风险。国际市场还带来不断增加的合规义务，包括自愿遵守
              2025 年签署的欧盟消费者保护承诺框架，以及海湾个人数据保护法下严格的数据本地化标准。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
