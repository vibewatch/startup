  - id: FV001
    title: 推荐逻辑：从运营规模到估值立场的决策流程
    type: flow
    summary: 这条决策路径串起土耳其市场主导地位、单位盈利能力、国际化扩张、监管合规阻力和估值倍数压缩，最终给出观察建议。
    data:
      nodes:
        - label: 1. 市场领导地位与国内规模
          detail: Trendyol 是土耳其领先的电商平台，GMV 超过 $12.5B、拥有 40M 名客户，为收入端提供坚实的规模基础。
        - label: 2. 国内盈利里程碑
          detail: Trendyol 自 2023 年起在土耳其实现运营盈利；Uber 以 $700M 收购 Trendyol Go 85% 的股权，也从外部印证了这一点。
        - label: 3. 国际扩张进展
          detail: 快速进入海湾地区和 CEE；国际收入约占 20%，但仍低于 IPO 目标的 30-50%。
        - label: 4. 监管与反垄断逆风
          detail: TCA 处以 TRY 61.3M 罚款，强制拆分 TrendyolMilla 自有品牌，公司还要持续满足数据隔离合规要求。
        - label: 5. 估值倍数压缩
          detail: 2021 年 8 月的 $16.5B 估值已经过时；同业可比公司估值和宏观折价指向 $9.0B-$11.5B 的公允价值（GMV 的 0.7x-0.9x）。
        - label: 6. 最终立场：观察
          detail: 维持观察立场；在经审计的独立财务报表和正式的双重上市 IPO 申报文件出现前，暂缓投资。
    approximationNotes: 这条顺序逻辑链说明运营优势会受到估值倍数压缩和监管障碍的制约，观察建议也由此而定。
