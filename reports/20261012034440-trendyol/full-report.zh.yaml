        title: 展示材料
        blocks:
          - type: callout
            title: 超级应用运营飞轮与拆分策略
            body: >-
              Trendyol 从专业时尚平台演变为土耳其领先的横向超级应用，说明物流、数字支付和本地配送的闭环整合能够产生多大力量。不过，土耳其竞争法要求结构性拆分，以及随后以 $700M 将 Trendyol Go 出售给
              Uber，都说明监管摩擦和资本约束正在重塑其综合业务模式，IPO 仍在未来。
            calloutType: insight
