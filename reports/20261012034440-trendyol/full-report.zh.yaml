              按每笔销售额收取一定比例，比例随品牌和目标品类利润率变化。这只能说明存在佣金机制，不能说明当前实际抽成率。同一采访还描述了受控的自有品牌定价，但后来的土耳其规则要求这些商品移出主平台。因此，投资者应分别看平台佣金、商品利润、配送经济和支付收入，而不是套用一个混合平台倍数。
