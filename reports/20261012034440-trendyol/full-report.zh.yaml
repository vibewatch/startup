      - number: '2.3'
        title: 买家、用户与商户的分层动态
        blocks:
          - type: paragraph
            body: >-
              Trendyol
              运营着一个双边平台生态，消费者买家画像和商业商户分层各不相同。消费者包括追求便利、有竞争力价格和组合促销、注重性价比的国内大众购物者，也包括在海湾和欧洲购买土耳其服饰的跨境零售买家。供给端则汇聚传统零售商、品牌分销商和小型纺织制造商；这些商户借助
              Trendyol 的技术基础设施和入驻集成触达 40M 活跃消费者。在罗马尼亚等中东欧市场，Trendyol 已获得 1.5M 买家并吸引超过 6,600 名卖家入驻，数字化入驻项目将卖家激活时间缩短至 6
              天，推动了快速采用。消费者还会在时尚、个护和 Dolap 二手交易等多个品类重复购买，形成黏性；相比单一品类的垂直竞争者，迁移成本更高。
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、通胀折算与监管逆风
        blocks:
          - type: paragraph
            body: >-
              Trendyol 未来增长靠国际市场渗透和土耳其纺织制造的结构性成本优势，但也面临严峻的宏观经济和监管约束。宏观波动是首要运营逆风：土耳其消费者价格通胀在 2026 年 7 月达到同比 31.75%，以 TRY
              计的名义平台销售额会夸大真实消费增长，因此必须按品类严格进行通胀折算。同时，监管干预也重塑了竞争格局。根据修订《电子商务法》的第 7416
              号法律，大型平台运营商不得在核心中介平台上销售自有品牌商品。继土耳其竞争管理局调查并因 2023 年算法自我偏好处以 TRY 61.3M 罚款后，Trendyol 于 2024 年 1 月完成将自有品牌服饰迁至
              TrendyolMilla。2024 年末国际销售约占收入 20%，但要在 IPO 前实现管理层提出的国际业务占比 50% 目标，还需在海外履约上投入大量资本。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 宏观通胀扭曲平台名义指标
            body: >-
              在消费者价格指数于 2026 年同比超过 31% 的经济体中，按土耳其里拉计的名义 GMV
              增长不能解读为交易量或需求扩张。要看真实的营收表现，必须用行业特定指数对交易金额进行折算，区分总体通胀传导与真正的底层市场份额增长。
            calloutType: insight
            claimRefs:
              - CM005
          - type: callout
            title: 自有品牌业务的监管拆分
            body: >-
              土耳其竞争管理局的执法行动，以及第 7416 号法律下的《电子商务法》修订，迫使 Trendyol 将自有品牌服饰业务结构性拆分至
              TrendyolMilla，从核心平台算法中移除高毛利自有品牌，限制平台自我偏好。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 土耳其电商格局与核心平台动态
        blocks:
          - type: paragraph
            body: >-
              土耳其电商平台市场由高度集中的双寡头竞争和不断扩张的跨国老牌企业共同构成。Trendyol 与 Hepsiburada 长期定义着土耳其数字商业，并在 2024 至 2025 年间走上相反的战略路径。哈萨克斯坦的
              Kaspi.kz 于 2025 年 1 月 29 日完成控股股权收购后，Hepsiburada 转为区域所有权；Trendyol 则仍由 Alibaba Group
              多数持股控制。第三方行业分析显示，Trendyol 在 2023 年占据超过 30% 的国内市场份额，交易规模是最近竞争对手的两倍以上。行业估算显示，              Trendyol 主平台 2025
              年销售额为 14,009M 美元，预计 2026 年增长 10 至 15%，规模优势将在高频零售品类中进一步累积。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
