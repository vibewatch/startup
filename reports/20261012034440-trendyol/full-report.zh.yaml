        - 不按未经调整的 2021 年融资轮估值入场；目标入场估值为 $9.0B–$11.5B（GMV 的 0.7–0.9 倍）
      - - 风险评级
        - 高
        - TCA 反垄断承诺、PL 分拆（TrendyolMilla）、数据限制
        - 要求建立治理保护，防止母公司（Alibaba 持股 70–86%）自我交易
      - - 信心水平
        - 中
        - 土耳其运营盈利已获证明；国际利润率走势尚未验证
        - 关注海湾和 CEE 收入向 IPO 30–50% 门槛扩张的进展
