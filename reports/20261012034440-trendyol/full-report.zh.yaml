  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与相邻业务
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的可服务商业边界包括 Türkiye 的国内多品类电商、中东和欧洲的区域跨境服饰出口，以及城市即时零售。平台最初专注于时尚，后来扩展为覆盖电子产品、家居用品、化妆品和杂货的横向平台，汇聚超过
              300,000 家活跃第三方商户和 40M 消费者。在国内市场，核心零售交易支撑平台活跃度和运营现金流，并由自有 Trendyol Express 物流网络提供支持。相邻业务包括通过 Dolap
              开展二手时尚交易（活跃点对点卖家超过 1.4M），以及通过 Trendyol Go 提供即时杂货和熟食配送。2025 年 5 月，Uber 以 $700M 收购 Trendyol Go 的 85%
              多数股权，将餐饮配送的单位经济与核心平台拆开，同时保留生态整合和各消费触点之间的商业协同。
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM013
      - number: '2.2'
        title: 市场规模：TAM、SAM 与受证据约束的 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              评估 Trendyol 的可触达总机会时，需要把高通胀的土耳其国内核心业务，与其在 GCC 和中东欧的国际跨境扩张分开看。第三方研究机构 Lucidity Insights 估计，更广义的 MENA 电商市场在
              2024 年约为 $29B，预计到 2028 年以 14.5% 的复合年增长率扩张至 $50B。在 Türkiye，可服务的电商市场对应每年 $35B–$40B 的线上零售交易。2021 年，Trendyol 以
              34% 的土耳其电商 GMV 占比确立明显领先，远超主要国内竞争对手 Hepsiburada 的 11%。到 2024 年，Trendyol 报告其合并平台 GMV 超过 $12.5B。此外，国际业务在上线 16
              个月内便在海湾地区达到超过 $1.0B 的年化 GMV 跑速，说明跨境时尚需求能够在富裕的中东消费市场获得可观份额。
