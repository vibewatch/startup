              Trendyol 的软件架构将 Trendyol Tech 的自有内部开发，与 Alibaba Group 控股投资后带来的可扩展云和机器学习技术结合起来。Alibaba
              的技术参与使其能够使用先进的分布式数据存储、容器编排和实时个性化框架，为数千万活跃购物者提供推荐信息流。2024 年，Trendyol 又部署了土耳其首个自有大语言模型，利用 Alibaba
              的算力基础设施训练模型，自动翻译 25 个出口司法辖区的多语言商品描述和卖家—买家消息。不过，Trendyol 的算法架构受到严格监管审查。2023 年 7 月，土耳其竞争管理局认定 Trendyol
