chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立历程与超级应用商业模式
        blocks:
          - type: paragraph
            body: >-
              Trendyol 由 Demet Mutlu 携手 Evren Üçok 和 Begüm Tekin 于 2010
              年在土耳其伊斯坦布尔创立，已从最初靠自筹资金运营的线上时尚商户，成长为土耳其最大的多品类电商平台。公司运营综合性横向平台，连接土耳其、欧洲和中东数十万商户卖家与数千万消费者。经过十余年的扩张，Trendyol
              搭建起一套超级应用架构，将核心零售商品与自有基础设施结合起来，包括专属物流承运商 Trendyol Express、二手服饰平台 Dolap 和集成支付网关 Trendyol
              Pay。这种闭环运营模式提高了客户留存，也在土耳其数字消费经济中筑起了较高且可防守的迁移成本。
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO014
