  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 多品类平台与生态服务
        blocks:
          - type: paragraph
            body: >-
              Trendyol 已从垂直闪购服饰商户转型为完整的数字超级应用生态。平台以核心多品类市场为锚，汇聚超过 300,000 家第三方商户在时尚、消费电子、家居用品、化妆品和杂货领域的商品目录。Trendyol
              不只是商业店面，还围绕消费者购物旅程配置紧密整合的垂直服务，包括通过 Dolap 进行二手 C2C 服饰交易、通过 Trendyol Express 自有分拣和包裹履约，以及通过 Trendyol Go
              快速配送城市杂货。这套多产品架构提高用户参与频率，也带来显著的生态锁定：消费者把零售、二手和便利购物集中到一个移动应用中。支撑生态的技术能力集中在 Trendyol
              Tech，该研发部门获土耳其工业与技术部正式认可，拥有数千名软件工程师，专注于高吞吐目录索引、动态搜索排序和实时物流优化。
