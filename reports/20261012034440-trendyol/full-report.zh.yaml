      - number: '5.2'
        title: 自有物流与按需配送基础设施
        blocks:
          - type: paragraph
            body: >-
              Trendyol 电商平台的核心运营差异化来自自有物流基础设施，用来克服土耳其第三方承运网络碎片化的问题。Trendyol Express 于 2018
              年上线，将最后一公里配送内置化，通过自动化区域分拣中心、专用干线和本地快递网络，在土耳其全部 81 个省份扩大到每天约 2.5M
              个包裹。掌控包裹流转后，平台能提供更可预测的配送时段、更快的退货处理，并把单件履约成本降到低于独立货运承运商的水平。除标准包裹物流外，集团还将 Trendyol Go
              打造成热食和超市杂货的按需配送网络，在人口密集的大都市实现一小时内履约。2025 年 5 月，Uber 以 $700M 收购 Trendyol Go 85% 的多数股权；该部门 2024 年处理了 200M
              笔订单，验证了这层快递调度网络的战略价值。同时，Dolap 以轻资产模式提供消费者对消费者的循环时尚渠道，拥有 1.4M 名卖家，并利用集团整合的支付和包裹网络。
            claimRefs:
