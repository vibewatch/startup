      - number: '6.3'
        title: 商业依赖、渠道摩擦与不利合规逆风
        blocks:
          - type: paragraph
            body: >
              由于零售家庭高度分散在数千万消费者中，Trendyol 在消费者端的客户集中度风险从结构上较低；没有单个零售客户或商户贡献重大公司收入。但业务在地域和监管上高度集中：土耳其约贡献核心电商收入的
              87%，使合并客户生态暴露于国内宏观波动、货币贬值和当地电商法规变化。商户供给端方面，Trendyol 历来受到土耳其竞争管理局（TCA）的严重监管摩擦。TCA
              曾调查其算法自我偏好和未经授权利用第三方卖家数据为自有品牌线获益的问题，并于 2023 年处以 TRY 61.3M 行政罚款，要求自 2024 年 1 月起将自有品牌服饰运营拆分至独立的
              TrendyolMilla 应用。


              国际客户扩张带来严峻的法律、知识产权和平台合规逆风。在 Trendyol 已拓展至中东欧和希腊的欧洲市场，本地品牌所有者发起了强烈法律反击。具体而言，希腊针织品制造商 GRUPPO PAPARAZZI 于
              2025 年 11 月 21 日获得雅典一审单法官法院的临时禁令，禁止 Trendyol 在希腊使用或分销带有注册 MASSARO 商标的商品；每次违规可能罚款 €10,000，并另行提出 €500,000
              的商标侵权和仿冒损害赔偿主张。这些知识产权执法行动，加上欧盟委员会对跨境平台产品安全和合规的加强审查，说明国际获客伴随重大的交易对手和品牌保护风险，可能阻碍海外商户入驻和消费者采用。
