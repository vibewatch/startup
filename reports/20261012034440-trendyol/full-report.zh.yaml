      - number: '1.4'
        title: 运营规模、国际扩张与监管审查
        blocks:
          - type: paragraph
            body: >-
              到 2024 年，Trendyol 已达到可观的运营规模：年度 GMV 超过 $12.5B，服务 40M 客户，并在 35 个国家每天发出 2.5 million 个包裹。平台于 2023
              年首次在土耳其实现国内运营盈利，同时积极将跨境电商拓展至中东欧和 GCC 市场，海湾地区年度 GMV 已超过 $1B。但快速扩张也伴随着更强的监管干预。2023 年 7
              月，土耳其竞争管理局因算法自我偏好和滥用第三方商户数据，对 Trendyol 处以 TRY 61.3M 罚款。为应对土耳其《电子商务法》的修订，公司于 2024 年 1 月 1 日将自有品牌结构性拆分至独立的
              TrendyolMilla 应用，主动遵守日益严格的反垄断框架。
            claimRefs:
