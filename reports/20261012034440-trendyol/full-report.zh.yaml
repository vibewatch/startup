  - id: TV002
    title: 投资正反论点平衡
    columns:
      - 支柱
      - 投资正论（看涨驱动因素）
      - 投资反论（看跌风险）
      - 改变判断的催化剂
    rows:
      - - 市场地位与规模
        - 土耳其主导型电商平台，2024 年 GMV 超过 $12.5B，拥有 40M 活跃客户和覆盖全国的物流基础设施
        - 土耳其国内市场饱和，宏观波动加剧（土耳其里拉通胀、货币贬值）
        - 土耳其国内业务持续产生正自由现金流，直至 FY2026
      - - 变现与生态
        - 自 2023 年起国内运营盈利得到证明；Uber 以 $700M 收购 Trendyol Go 85% 股份，说明其具备可独立变现的资产
        - 监管从结构上禁止混合自有品牌电商模式，迫使业务拆分为 TrendyolMilla
        - 披露金融科技（Trendyol Pay）和物流（Trendyol Express）的贡献利润率
      - - 国际扩张
        - 在主权财富基金（ADQ、QIA）支持下，业务快速覆盖海湾（KSA、UAE）、德国和 CEE，海湾 GMV 已超过 $1B
        - 海湾 / CEE 客户获取成本和物流资本开支高，盈利情况未披露
        - 国际收入达到集团总收入的 35% 以上，且当地单位经济性为正
      - - 退出流动性与治理
        - 规划在 Borsa Istanbul 和 London/NYSE 双重上市，为机构投资者提供流动性
        - Alibaba 持股 70%–86% 并占多数，创始人拥有黄金股权利，公开上市时间表未定
        - 向 CMB / SEC / FCA 正式提交 IPO 招股书，并由独立董事会治理保障
    notes: 正反论点把主要资料和分析资料记录的结构性运营驱动因素，与监管和资本结构约束放在一起评估。
