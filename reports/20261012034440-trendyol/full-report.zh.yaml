      - number: '8.4'
        title: 退出准备度、监管约束与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Trendyol 走向首次公开发行，面临结构性运营前提和严格监管障碍。集团总裁 Çağlayan Çetin 已明确管理层的战略门槛：只有在国际收入达到总销售额的 30% 至 35%（理想情况下为
              50%）后，Trendyol 才会推进双重上市 IPO——将 Borsa Istanbul 与伦敦证券交易所或纽约证券交易所二选一结合。当前海外收入估计约为
              20%，要达到这一标准，就需要继续在欧洲和中东的履约基础设施上大量投入资本。与此同时，土耳其竞争管理局（TCA）施加了重大的监管和反垄断约束。TCA 对算法操纵和数据自我优待展开全面调查后，于 2023 年 7
              月对 Trendyol 处以 TRY 61.3 million 行政罚款。根据后续《电子商务法》修订，Trendyol 被迫将自有品牌服装业务（TrendyolMilla）与核心平台在结构上分离，并自 2024
              年 1 月 1 日起停止在平台上直接销售自有品牌。TCA 在 2024
              年重新评估时确认，算法自我优待问题已通过这次运营分离得到处理，但监管机构明确维持了限制第三方卖家数据使用的持续行为义务。潜在投资者需要重点尽调三块：第一，取得能够核实分部毛利率的独立经审计 IFRS
              财务报表；第二，评估平台、TrendyolMilla 与母公司 Alibaba 之间数据共享的法律和技术边界；第三，厘清 Alibaba
              控股之下的少数股东权利和董事会治理。关键投资逻辑破坏触发因素包括国际扩张中心持续出现负自由现金流，或反垄断执法重启并损害平台抽佣率。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 核心投资指令：跟踪
            body: >-
              我们给予 Trendyol “跟踪”投资建议、中等信心评级和高风险评估。虽然其国内规模和平台经济性极具吸引力，但鉴于当前公开新兴市场倍数以及未经验证的国际单元利润率，在 2021 年 decacorn 估值
              $16.5 billion 附近入场并不划算。投资者应监测私募二级折价，并等待经审计的财务申报。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV015
          - type: callout
            title: 治理与结构性监管悬置
            body: >-
              Alibaba 压倒性的 70% 至 86.5% 股权，加上土耳其竞争管理局要求 TrendyolMilla
              进行结构性分离并设置严格数据使用防火墙的监管命令，持续制造运营和治理摩擦。少数投资者面临不对称的流动性时间安排，以及与大股东潜在的利益协同冲突。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV008
