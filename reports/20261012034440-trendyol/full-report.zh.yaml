  - id: TV003
    title: 乐观、基准与悲观情景预测
    columns:
      - 情景
      - 运营假设
      - 隐含估值逻辑
      - 主要下行情景触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 海湾 GMV 加速超过 $3B；国际业务占比达到 40%；Trendyol Go 在 Uber 合作下扩大规模；2027 年成功双重上市 IPO
        - 企业价值 $18.0B–$22.0B，依据为远期 GMV 的 1.2–1.4 倍及新兴市场高端超级应用倍数
        - 中东地缘政治紧张，欧盟跨境关税法规不利
        - 概率 20%；取决于国际利润率出现拐点、全球 IPO 窗口开启
      - - 基准情景
        - 土耳其国内业务按美元计增长稳定在 15–20%；海湾市场份额保持稳定；国际收入达到 25–30%；IPO 延至 2028–2029 年
        - 企业价值 $9.0B–$11.5B，依据为 2024 年 GMV（$12.5B）的 0.7–0.9 倍，反映私人市场倍数压缩
        - 土耳其宏观经济长期不稳定，TCA 数据合规摩擦持续
        - 概率 55%；反映当前市场环境、私人市场流动性折价和 Alibaba 的控制权
      - - 悲观情景
        - 激烈的本地竞争（Amazon、Noon）令国际扩张停滞；TCA 监管执法压缩国内利润率；没有 IPO 路径
        - 企业价值 $5.5B–$7.5B，依据为 GMV 的 0.4–0.6 倍，与低利润率困境新兴市场零售可比公司一致
        - 进一步反垄断处罚、监管阻断跨境数据共享、子公司减值
        - 概率 20%；若海湾业务持续大量烧钱且无法取得市场份额领先地位，则触发
      - - 下行清算 / 停滞
        - 土耳其货币严重崩溃；欧洲扩张彻底失败；少数股权被套且无法退出
        - 资产清算价值 $3.5B–$4.5B，仅以土耳其核心物流和土耳其电商现金流为锚
        - 监管全面禁止电商平台运营，或强制 Alibaba 出售持股
        - 概率 5%；由严重地缘政治或监管破裂驱动的尾部风险情景
    notes: 估值区间源自 2024 年 $12.5B GMV 和 2025 年 5 月 Uber 交易基准；这些数字是在无债务运营假设下估算的企业价值。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV011
      - CV012
