      - number: '3.2'
        title: 平台能力与自有履约基础设施
        blocks:
          - type: paragraph
            body: >-
              履约基础设施是土耳其平台运营商争夺的核心运营战场。Trendyol Express 运营覆盖土耳其全部 81
              个省份的自有配送网络，在人口密集的大都市兑现当日送达承诺，并降低对第三方商业快递的依赖。Hepsiburada 则以专属物流部门 HepsiJet 和整合商户仓储的 HepsiLojistik
              应对。Trendyol 通过 Trendyol Go 的多服务超级应用扩张，以及 Dolap 的二手交易，将客户触点延伸到传统平台交易之外。在国际市场，Trendyol 已将运营版图扩展至
              GCC，通过在沙特阿拉伯和阿联酋部署专属基础设施，服务超过 3.7M 区域客户，承接跨境出口需求。
            claimRefs:
              - CP004
              - CP005
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP014
      - number: '3.3'
        title: 定价动态、卖家经济与多平台经营现实
        blocks:
          - type: paragraph
            body: >-
              土耳其数字零售的价格竞争看的是促销折扣日历、商户佣金和补贴运费。面对国内宏观通胀，平台运营商用动态定价算法和分层营销活动触达价格敏感人群。对商户合作伙伴而言，同时经营 Trendyol 和 Hepsiburada
              是常态；卖家高度集中，单是马尔马拉工业区就占注册商户的
              50%。但两家平台都没有按公开报告格式披露经审计的季度商品交易总额或标准化单位抽成率。平台黏性主要来自庞大的客户触达和整合式商户物流，而非合同层面的卖家排他性。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP009
      - number: '3.4'
        title: 护城河韧性、平台替代与监管风险
        blocks:
          - type: paragraph
            body: >-
              Trendyol 竞争护城河的长期韧性受到国内反垄断执法升级和平台治理规则的限制。2023 年 7 月，土耳其竞争管理局结束调查，因算法操纵及未经授权使用第三方卖家平台数据，对 Trendyol 处以约
              61.3M 土耳其里拉罚款。土耳其修订后的电商法规要求平台运营商在结构上限制用自有品牌压过独立商户库存。Trendyol
              的规模、自有物流车队和国际出口渠道能够抵御国内替代，但合规义务限制了激进的自我偏好和平台锁定策略。
            claimRefs:
              - CP010
              - CP011
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 土耳其平台龙头的战略所有权分化
