      - number: '6.2'
        title: 采用轨迹、使用速度与留存动态
        blocks:
          - type: paragraph
            body: >
              过去十年，平台采用曲线大幅扩张：会员数从 2011 年的 4M 增至 2018 年的 16M、2020 年的 19.3M、2021 年的 30M，并在 2024–2025 年达到超过 40M
              活跃消费者。移动应用仍是主要运营引擎：Trendyol 应用下载量超过 50M，在 Apple App Store 的 93,000 条评价中获 4.7 星，在 Google Play Store 的 2M
              条评价中获 4.2 星。              高峰期的购物量显示用户参与度很高：2024 年 11 月促销期间，平台记录总访问量 250M、售出商品 120M 件、DAU 25M，其中活跃国际购物者 5M。


              算法个性化、自动闪购折扣（品牌名为 Trendyol Days）和高频配送物流共同支撑客户留存和参与度。运营速度依靠 Google Cloud BigQuery 与 Looker
              商业智能基础设施；在黑色星期五等零售高峰期，每天处理超过 260,000 次分析查询，用于优化转化率和动态定价。但 Trendyol
              没有披露标准软件或订阅业务常用的客户群留存指标，例如净收入留存率（NRR）、毛收入留存率（GRR）或多年度消费者客户群流失曲线。虽然低价日常品类和 Trendyol Express 的物流速度（覆盖 27
              个国家、每天配送超过 1.5M 个包裹）在结构上支持复购，但缺少经审计的客户群存续数据，是评估客户终身价值韧性的关键尽调缺口。
