          outputs:
            - Search query results
            - Seller cross-lingual messaging
        - label: FinTech & Payment Settlement Tier
          detail: Integrated digital wallet, tokenized card payments, escrow mechanisms, and merchant payout reconciliation
          modules:
            - Trendyol Pay Digital Wallet
            - Credit Card Tokenization Gateway
            - Merchant Escrow & Settlement
            - Installment Engine
          outputs:
            - Payment capture
            - Merchant net disbursement
        - label: Fulfillment, Logistics & Dispatch Tier
          detail: Proprietary delivery network (Trendyol Express), urban courier dispatch (Trendyol Go), and cross-border air hubs
          modules:
            - Automated Sortation Center Management
            - Last-Mile Dynamic Route Optimization
            - Trendyol Go Courier Dispatch
            - Istanbul Airport Air Export Hub
          outputs:
            - 2.5M daily package deliveries
            - Sub-hour meal and grocery delivery
        - label: Governance, Data Isolation & Cloud Infrastructure Tier
          detail: Alibaba Cloud scalable infrastructure, TCA-mandated private-label data walls, and data privacy compliance
          modules:
            - Alibaba Cloud Compute & Storage
            - TCA Algorithmic Audit Logging
            - Marketplace-Private Label Data Isolation Barrier
            - KVKK & EU GDPR Compliance Layer
          outputs:
            - High-availability compute
            - Audited data neutrality
    approximationNotes: Architectural representation synthesizes regulatory filings, official R&D announcements, and technical disclosures; physical cluster deployments are private.
