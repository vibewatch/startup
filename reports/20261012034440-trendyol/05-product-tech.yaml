      - - Cross-border European and Gulf consumer purchase
        - High international shipping rates and localized language barriers
        - Dedicated localized storefronts (e.g., trendyol.ae) and e-export pipelines
        - Local currency pricing, regional customer support, and localized sizing
        - Longer fulfillment windows (5-7 days) and regional import clearance complexity
    notes: Workflow stages and consumer solutions based on platform service capabilities; delivery SLAs and regional coverage vary by destination province and country.
