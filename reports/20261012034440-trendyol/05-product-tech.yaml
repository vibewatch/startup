    rows:
      - - Multi-category consumer retail shopping
        - Visiting fragmented brick-and-mortar stores or single-category sites
        - Unified mobile superapp with cross-category search, cart, and wallet
        - Broad product selection, price discovery, and personalized recommendations
        - Delivery speed variations across 3P merchant inventory
      - - Merchant catalog listing and order fulfillment
        - Manual inventory management and third-party parcel dispatch
        - Automated merchant portal integrated with Trendyol Express logistics
        - Integrated domestic pickup, label generation, and tracking automation
        - Strict platform fulfillment SLAs and penalty fees for dispatch delays
      - - On-demand urban grocery and hot meal ordering
        - Direct phone ordering or fragmented regional restaurant apps
        - Trendyol Go hyperlocal routing connecting local couriers and merchants
        - Sub-hour rapid delivery with live order tracking and cashless payment
