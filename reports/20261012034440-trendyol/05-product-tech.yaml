callouts:
  - calloutType: insight
    title: Proprietary Logistics as Moat Against Global Entrants
    body: 'By developing Trendyol Express in 2018 and scaling it to 2.5 million daily package deliveries across 81 Turkish provinces, Trendyol insourced the critical friction point of emerging-market e-commerce: fragmented third-party logistics. Controlling last-mile delivery and sorting infrastructure enables rapid fulfillment SLAs and lower return costs that international competitors lacking local delivery networks cannot easily match.'
    claimRefs:
      - CE003
      - CE007
  - calloutType: risk
    title: Structural Platform Separation Under TCA Oversight
    body: The Turkish Competition Authority's 2023 penalty of TRY 61.3 million and the subsequent enforcement of Turkey's amended Electronic Commerce Law forced Trendyol to end hybrid self-preferencing by spinning off its private-label brands into TrendyolMilla. While physical algorithmic favoritism on the core marketplace was addressed by removing private-label products, ongoing regulatory scrutiny over third-party seller data usage imposes strict compliance overhead and eliminates cross-selling synergies.
    claimRefs:
      - CE009
      - CE010
