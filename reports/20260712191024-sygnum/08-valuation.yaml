chapter:
  number: 8
  title: Valuation
  summary: Sygnum's USD 1 billion valuation is strategically credible but still not fully underwritten from public evidence. The company has enough regulated, institutional, and product proof to merit a serious base-case anchor around the latest round, yet the lack of financial disclosure keeps the right call at research-more rather than a confident pass.
sections:
- id: recommendation-and-thesis
  title: Recommendation and thesis
  body: 'Sygnum is one of the most strategically interesting private companies in this report set because it combines bank regulation, crypto infrastructure, tokenization, and partner-bank distribution. The positive thesis is clear: the company has advanced from an ~USD 800 million valuation in 2022 to USD 900 million in 2024 and USD 1 billion in 2025 while accumulating stronger institutional proof points rather than merely riding market sentiment. The anti-thesis is equally clear: even with better proof, investors still lack the revenue, margin, retention, and concentration data that would let them test whether the unicorn price is conservative or demanding.


    That combination leads to a research-more recommendation. There is enough public evidence to take the valuation seriously, and enough quality to avoid dismissing it as hype. But there is not enough financial transparency to argue with high conviction that the next dollar invested at or around the latest mark will be mispriced in either direction.'
  claimRefs:
