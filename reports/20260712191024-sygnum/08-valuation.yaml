  - CV036
  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Revenue by product, geography, and top customers
    - Needed to turn narrative into valuation model
    - Management data room / CFO
  - - Retention and concentration
    - NRR, GRR, churn, top-10 customer exposure
    - Determines durability of the unicorn mark
    - Management / customer references
  - - Capital and balance sheet
    - Stress scenarios, liquidity plan, loss exposure
    - Critical for a regulated bank valuation
    - Risk / finance under NDA
  - - Unit economics
    - Gross margin and implementation economics for bank-to-bank deployments
    - Tests whether channel scale creates operating leverage
    - Operations / finance review
  - - Tokenization and Protect monetization
    - Revenue contribution and pipeline visibility
    - Shows whether option value is becoming cash flow
    - Product and finance diligence
  - - Incident history
    - Security, compliance, and outage remediation history
    - Directly affects trust discount
    - Risk / audit diligence
  notes: If these asks are satisfied strongly, the latest private mark may look more attractive than public evidence alone suggests.
