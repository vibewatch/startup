- id: scenario-ranges-and-valuation-stance
  title: Scenario ranges and valuation stance
  body: 'The most usable scenario framing is simple. The bear case places value around USD 0.6 billion if crypto-market conditions worsen, partner distribution proves more fragile than expected, or revenue monetization is weaker than the brand suggests. The base case keeps value around the latest USD 1 billion financing mark because public evidence does support meaningful strategic quality: regulated status, strong bank references, product breadth, Protect scale, and growing European optionality. The bull case reaches roughly USD 1.5 billion if Sygnum successfully converts EU access, tokenized-product momentum, and partner-bank network effects into visibly stronger operating leverage.


    This produces a valuation stance best described as fair-to-slightly-stretched, but operationally the safer label is cannot-assess with precision. The latest mark is defensible enough to respect, yet not transparent enough to chase without private diligence. Investors should treat it as a serious base anchor rather than as a bargain.'
