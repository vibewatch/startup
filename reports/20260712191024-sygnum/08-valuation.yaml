- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - License or supervisory restriction
    - Any material restriction on core custody, trading, or cross-border servicing
    - Undermines trust and distribution thesis
    - Pause or materially re-price
  - - Security / control incident
    - Severe incident causing client harm or major scrutiny
    - Damages bank-grade trust moat
    - Move to avoid unless fully remediated
  - - Partner-channel contraction
    - Loss of flagship partners or clear slowdown in bank-to-bank momentum
    - Weakens distribution-led upside
    - Reduce base case and upside probability
  - - Economics miss
    - Private diligence shows weak monetization or heavy concentration
    - Reveals latest round was ahead of fundamentals
    - Re-rate toward bear case
  - - Capital pressure
    - Stress shows weak resilience or thin buffers
    - Raises solvency and growth concerns
    - Increase risk discount materially
  notes: These triggers are designed for IC monitoring, not only for post-investment reporting.
