- id: financing-context-and-price-history
  title: Financing context and price history
  body: 'The funding history matters because it shows valuation progression rather than a single point estimate. Sygnum''s 2022 Series B valued the company at about USD 800 million and was supported by concrete operating claims: near-1,000 institutional clients, more than USD 2 billion in assets under administration, and a tenfold increase in consolidated gross revenues in 2021. The January 2024 interim close set a USD 900 million post-money valuation after raising more than USD 40 million. The January 2025 strategic growth round then moved the company to USD 1 billion on USD 58 million of new capital. This is a measured staircase, not a meme-stock leap.


    That said, the latest mark is still a private financing output, not an intrinsic-value proof. Investors know the price that existing backers accepted, but not the revenue or margin base supporting it. The financing history is therefore useful as an anchor and as evidence of investor confidence, but it cannot fully replace conventional valuation work.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV006
  - CV018
  - CV029
  tableRefs: []
- id: comparable-context-and-relative-position
  title: Comparable context and relative position
  body: 'The comparable set suggests Sygnum is neither obviously overvalued nor obviously cheap. On the private crypto-infrastructure side, Fireblocks reached an $8 billion valuation and Anchorage exceeded $3 billion, both well above Sygnum. On the strategic-M&A side, Ripple bought custody/tokenization provider Metaco for USD 250 million, which is much lower but also reflects a narrower asset and different market moment. On the public-market side, Coinbase, Robinhood, Swissquote, Interactive Brokers, and CME Group all trade at far larger market caps, though they differ sharply in business model, geography, disclosure quality, and customer base.


    Taken together, these anchors frame Sygnum as a subscale-but-credible institutional infrastructure player. The company is large enough to deserve serious strategic valuation, but still too opaque to benchmark tightly against public-market multiples. The comp set therefore supports a reasonable range around the last round more than it supports a precise formula.'
  claimRefs:
  - CV010
