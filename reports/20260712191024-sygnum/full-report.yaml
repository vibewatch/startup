        title: Operational, security, and capital risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is the second major category because Sygnum sits inside custody, settlement, and
              tokenized-asset workflows where errors can be expensive and reputation can turn quickly. The annual report
              explicitly includes failures of processes, people, systems, and external events. It also singles out
              information security and compliance risk. The custody-architecture blog adds adverse color: even
              sophisticated institutions can fail if key management or workflow design is weak. Investors should
              therefore assume that the biggest downside would come not from ordinary software bugs but from control
              failures with financial or regulatory consequences.


              Capital is the other side of the same story. Sygnum disclosed a 17.48 percent total capital ratio against
              a 16.83 percent target ratio. That is supportive—Sygnum was above target—but it is not such a large
              cushion that investors should ignore stress risk. The same report shows credit, market, and operational
              risk all matter for capital consumption. This reinforces that Sygnum is subject to banking-style
              balance-sheet discipline even if revenue appears fee-based on the surface.
