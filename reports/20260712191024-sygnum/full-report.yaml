              This makes the operating model look like a set of connected layers: regulated custody and compliance at
              the center, workflow modules around it, and partner-bank or infrastructure integrations at the edges. The
              most interesting product fact is not that Sygnum has many pages; it is that the pages imply shared
              orchestration across custody, collateral, settlement, and issuance. The open question is whether that
              shared orchestration is as unified internally as it appears externally. Public materials do not show
              service topology, detailed API docs, or status telemetry, so the architecture is credible but still only
