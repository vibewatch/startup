  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and market classes
        blocks:
          - type: paragraph
            body: >-
              Sygnum's competitive set is wider than a list of crypto custodians. The fetched evidence shows at least
              three serious classes: regulated digital-asset banks that try to own custody, trading, settlement, and
              trust in one relationship; custody-first or workflow-first operators that keep institutions connected to
              venues while emphasizing control and security; and software platforms that help banks and fintechs launch
              digital-asset services without outsourcing the full customer relationship. That framing matters because
              Sygnum is selling not only safekeeping but also an institutional operating stack that touches execution,
              collateral, issuance, and bank distribution. Its own public materials are explicit on this point: custody,
              staking, trading, tokenization, Protect, Connect, and B2B banking all sit inside one regulated platform.


              The relevant competition therefore includes direct peers such as Anchorage, plus firms like BitGo,
              Komainu, Zodia, Copper, Fireblocks, and Ripple that attack adjacent layers of the same workflow. Some
              compete as banks, some as custodians, and some as infrastructure vendors for banks. Incumbent-bank
              collaborations also matter. The stablecoin sandbox with UBS, PostFinance, Raiffeisen, ZKB, and BCV shows
              that Sygnum is operating inside the same design space that larger financial institutions increasingly want
              to own. The result is a landscape where Sygnum benefits from breadth, but also faces competition from
              several different operating models instead of one monolithic rival.
            claimRefs:
