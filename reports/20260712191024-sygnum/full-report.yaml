      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is the cornerstone risk for Sygnum because permissions define which products it can offer,
              to whom, and in which jurisdictions. The company operates with a Swiss banking license and Singapore
              permissions, while EU expansion increasingly intersects with MiCA. MiCA is directionally helpful because
              it standardizes rules for crypto-asset services, but it also raises compliance overhead through
              authorisation, supervision, disclosure, and record-keeping requirements. Sygnum's own disclosures
              reinforce the same point: materials cannot be used in jurisdictions where the bank lacks the relevant
              registration or approval.


              The legal-complexity stack is broader than simple custody licensing. The annual report shows prudential
              capital and liquidity oversight, and the AIFMD disclosure reveals fund and liquidity-risk responsibilities
              for the asset-management side. Even the sustainability-risk statement matters as a signal: it shows that
              not every disclosure regime is yet fully harmonized with evolving investor expectations. The practical
              conclusion is that regulation is both moat and moving target.
