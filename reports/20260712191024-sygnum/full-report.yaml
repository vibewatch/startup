            body: >-
              The mitigation story is real. Sygnum has licenses, reporting discipline, institutional partners, and a
              risk framework. That means the risk chapter is not a generic crypto cautionary tale. But the kill triggers
              are also specific. A meaningful license restriction, a severe control or custody incident, clear
              partner-channel contraction, or a drop in capital headroom would all materially weaken the investment
              case. The 2025 unicorn valuation increases the cost of disappointment because it leaves less room for
