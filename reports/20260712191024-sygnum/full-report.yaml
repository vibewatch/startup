              escalating just to remain credible. For underwriting, the right conclusion is not that Sygnum lacks moat,
              but that its moat looks moderate and distribution-led rather than permanently exclusive. The company seems
              well positioned in European and Swiss institutional channels, yet the global infrastructure race is
              crowded enough that durable share leadership still requires further proof on revenue concentration, client
