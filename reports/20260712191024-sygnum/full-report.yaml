      - number: '8.2'
        title: Financing context and price history
        blocks:
          - type: paragraph
            body: >-
              The funding history matters because it shows valuation progression rather than a single point estimate.
              Sygnum's 2022 Series B valued the company at about USD 800 million and was supported by concrete operating
              claims: near-1,000 institutional clients, more than USD 2 billion in assets under administration, and a
              tenfold increase in consolidated gross revenues in 2021. The January 2024 interim close set a USD 900
              million post-money valuation after raising more than USD 40 million. The January 2025 strategic growth
              round then moved the company to USD 1 billion on USD 58 million of new capital. This is a measured
              staircase, not a meme-stock leap.


              That said, the latest mark is still a private financing output, not an intrinsic-value proof. Investors
              know the price that existing backers accepted, but not the revenue or margin base supporting it. The
              financing history is therefore useful as an anchor and as evidence of investor confidence, but it cannot
              fully replace conventional valuation work.
