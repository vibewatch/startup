chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Sygnum's public materials are consistent on the core identity: it presents itself as the world's first
              digital asset bank and a global digital asset banking group built on Swiss and Singapore heritage. The
              founding timeline is also unusually explicit for a private fintech. Its homepage says the company was
              conceptualised in 2017 and incorporated in May 2018, while its contact materials show a Swiss bank entity
              in Zurich and a Singapore entity in DUO Tower. Those same company surfaces position Sygnum as an
              institutional and professional market participant rather than a retail exchange. Reuters-backed coverage
              reinforces that point by stating the company does not cater to retail users and focuses on letting
              institutional users trade tokens, obtain custody, and borrow against crypto assets. The practical
              implication is that Sygnum is not competing on mass-retail distribution; it is competing on regulated
              infrastructure, cross-border credibility, and integration into partner banks and institutional workflows.


              That positioning is broader than simple custody. Across the homepage, B2B page, and 2026 Europe update,
              Sygnum frames itself as an all-in-one digital asset banking platform spanning trading, custody, staking,
              tokenization, settlement, and bank-to-bank services. The group's legal and regulatory footprint appears
              wider than its two main hubs. Company filings and announcements repeatedly state that Switzerland and
              Singapore are the core operating bases, but also describe regulated or registered presences in Abu Dhabi,
              Luxembourg, Liechtenstein, and—by mid-2026—expanded EU access. The important diligence conclusion is that
              Sygnum's identity is best read as a regulated digital asset financial-infrastructure group with multiple
              legal footholds, not as a narrow crypto broker or a purely software vendor.
            claimRefs:
              - CO001
              - CO002
