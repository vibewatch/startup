      - number: '1.3'
        title: Funding history, valuation path, and ownership signals
        blocks:
          - type: paragraph
            body: >-
              Sygnum's financing trajectory is one of the clearest parts of the public record. The January 2022 Series B
              raised USD 90 million, was led by Sun Hung Kai & Co., and valued the company at roughly USD 800 million
              post-money. By Sygnum's account, that round followed tenfold consolidated gross-revenue growth in 2021 and
              an institutional client base nearing 1,000, which makes the valuation step-up understandable even in
              retrospect. The next disclosed financing event came in January 2024, when Sygnum raised more than USD 40
              million in an interim close of its strategic growth round at a USD 900 million post-money valuation, with
              Azimut Holding as lead investor. Management tied that round to a USD 100 million-plus annualised revenue
              run rate, positive cash flow in Q4 2023, more than USD 4 billion in assets under administration, and a
              client base above 1,700.


              The final validation came in January 2025. Sygnum's official release and Reuters-backed coverage agree
              that the company raised USD 58 million, brought in Fulgur Ventures as cornerstone investor, and crossed
              the USD 1 billion valuation mark. That round also broadened the story from simple balance-sheet support to
              strategic expansion: management said the proceeds would support EU and EEA entry, a regulated Hong Kong
              presence, more Bitcoin-technology products, acquisitions, and greater resilience investment. What remains
              less transparent is the exact current cap table after these rounds. Public sources clearly identify lead
              investors and management participation, but they do not provide a complete updated ownership table with
              dilution, employee pool size, or board-control rights. That is a meaningful diligence gap even though the
              funding chronology itself is well supported.
