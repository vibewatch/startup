        title: Pricing, packaging, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency in this market is weak. The fetched pages mostly describe capabilities, target
              customer types, and relationship structures rather than standardized fee cards. That forces a more useful
              comparison on packaging. Sygnum and Anchorage package a regulated-bank relationship; BitGo packages wallet
              flexibility plus regulated options; Fireblocks and Ripple package control-plane software; Copper and Zodia
              package institutional workflow infrastructure; and Komainu packages custody-first access to adjacent
              services. These packaging differences matter because they influence who controls onboarding, who carries
              compliance and operational burden, and how much a client can internalize rather than outsource.


              Switching cost is therefore real but incomplete. Institutions face onboarding, legal, policy, integration,
              and migration friction, which makes rapid vendor switching unattractive. At the same time, the
              architecture is modular enough that multi-homing remains plausible: one provider can handle custody,
              another execution, another off-venue settlement, and another tokenization or software orchestration.
              Sygnum's own B2B and API-led framing reinforces this point. The company may be sticky once embedded, but
              it is not obviously irreplaceable in every layer of the stack.
