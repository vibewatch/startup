            body: >-
              The capital story currently looks expansion-oriented rather than distress-driven. The 2022 Series B funded
              new markets and Web 3.0 offerings. The January 2024 round combined a fresh valuation step-up with the
              first strong public run-rate and positive-cash-flow language. The January 2025 round then financed
              geographic expansion, acquisitions, Bitcoin-technology products, and compliance build-out after FY2024
              operational profitability had already been claimed. That sequencing matters. It suggests Sygnum has been
              using outside capital to accelerate a regulated banking platform, not simply to offset an unbounded burn
              profile.


              Even so, the company remains capital-intensive. A CET1 ratio of 17.48 percent and CET1 capital of CHF
              125.53 million show that capital adequacy is an active operating constraint, not a background detail.
              Growth in asset-heavy or bank-wrapped services has to coexist with prudential requirements. The missing
              piece is liquidity visibility: no fetched source discloses cash, burn, or runway. Public evidence
              therefore supports the view that Sygnum is better capitalized and less financing-dependent than a typical
              loss-making crypto startup, but it does not eliminate financing risk if product expansion or regulation
