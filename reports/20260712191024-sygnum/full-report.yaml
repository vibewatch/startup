  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included workflows, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Sygnum is not best described as simple crypto custody. Sygnum's own product pages
              consistently bundle custody, trading, staking, lending, tokenization, settlement, traditional securities,
              FX, and B2B banking into one operating model. Competitor pages reinforce the same framing. Anchorage,
              BitGo, Fireblocks, Komainu, Zodia, Copper, and Ripple all position themselves around some combination of
              regulated custody, execution, settlement, wallet infrastructure, tokenization, or stablecoin rails. That
              recurring bundle matters because it means the competitive and valuation arena is really institutional
              digital-asset financial infrastructure rather than a narrow wallet-storage niche.


              That boundary includes at least five recurring workflow categories: secure custody; execution and
              financing; staking and yield; tokenization and issuance; and payment or settlement infrastructure. In
              Sygnum's case, the B2B channel adds a sixth element—distribution through incumbent banks. PostFinance is
              the clearest proof point: its launch with Sygnum shows that the buyer can be a traditional principal bank
              seeking regulated digital-asset capabilities for end-clients rather than a crypto-native hedge fund alone.
              The main substitutes outside this market are self-custody, unregulated exchanges, and internal-build
              efforts by large institutions. Those substitutes matter because they cap pricing power and can slow
              adoption, but they do not erase the underlying need for regulated, auditable, institutional-grade
              infrastructure.
