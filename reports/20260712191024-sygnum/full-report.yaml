      - number: '8.5'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Sygnum looks exit-worthy in narrative terms because it has the ingredients public investors or strategic
              acquirers often reward: licenses, institutional references, bank-grade trust positioning, tokenization
              relevance, and multi-jurisdiction growth. What it lacks is the disclosure layer that would make that
              narrative financeable with conviction. The key diligence asks are straightforward: revenue by product
              line, customer concentration, retention and renewal, balance-sheet and capital stress, and unit economics
              for bank-to-bank deployments.


              Until those are available, the recommendation remains research-more. The public evidence is too good for
