      - number: '1.4'
        title: Scale signals, regulation, and partner-bank distribution
        blocks:
          - type: paragraph
            body: >-
              The most investable aspect of Sygnum's public profile is that the business shows evidence of both
              regulated status and commercial scale. On regulation, the MAS Financial Institutions Directory directly
              lists Sygnum Pte. Ltd. as a Capital Markets Services licensee and a Major Payment Institution, including
              permissions such as custodial services and digital payment token service. On the Swiss side, Sygnum's
              annual report and homepage consistently state that the group holds a Swiss banking licence. The 2024
              regulatory disclosure also provides a hard prudential datapoint: CET1 capital of CHF 125.53 million and a
              CET1 ratio of 17.48 percent. For a digital-asset bank, that matters because it shows Sygnum is not only
              using regulatory language as marketing; it is operating inside capital and disclosure frameworks that
              traditional institutional counterparties care about.


              Commercially, the disclosed scale markers are meaningful even if they remain incomplete. Sygnum said its
              January 2025 funding round closed with more than USD 5 billion in client assets and a 2,000-strong
              institutional client base across more than 70 countries. The same announcement said 2024 trading revenues
              surpassed the prior year's total by the third quarter and annual trades grew by more than 1,000 percent
              year over year. On the distribution side, Sygnum's June 2024 bank-partner update said the B2B platform had
              onboarded more than 20 banks, enabled regulated crypto services for more than a third of the Swiss
              population, and processed more than 1,000 B2B trades per day with 99.9 percent automation. PostFinance's
              own launch announcement confirms that at least one systemically important Swiss bank trusted Sygnum as the
              regulated partner for customer-facing crypto services. The limitation is precision: there is no public
              segmentation of active versus inactive clients, fee mix, or exact partner economics.
            claimRefs:
