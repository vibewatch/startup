              a large end-client base without Sygnum having to acquire every account directly. The 2026 AGM disclosure
              that bank-to-bank revenues grew 70 percent through existing partners is one of the strongest available
              channel-economics clues in the entire fetched set.


              Product-level signals also suggest where monetization may concentrate. Custody integrates directly with
              trading and staking, which should improve share-of-wallet per onboarded client. Tokenization issuer
              tooling adds structuring, subscription, and secondary-market activity. Protect introduces a higher-value
              service around counterparty-risk mitigation and collateral management, and its asset growth suggests that
              clients view it as more than a feature checkbox. The weakness in the public case is list pricing: without
              contract economics, fee schedules, or product-level revenue split, investors can see how money should be
              made but not yet how much each rail contributes in practice.
