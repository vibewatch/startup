      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Sygnum's public founder story is partly clear and partly messy. The homepage explicitly names Luka Müller,
              Manuel Krieger, Mathias Imbach, and Gerald Goh as founders. Individual profile pages then provide strong
              role detail for three of the operational founders. Manuel Krieger is described as a co-founder, board
              member, former CEO Switzerland, and former executive board member who moved to the board in October 2020.
              Mathias Imbach is clearly the group CEO, while Gerald Goh is the APAC chief executive with prior
              family-office and Cambridge Associates experience. The team page confirms the current split across board,
              group executive board, and Singapore executive board. That is enough to support credible founder and
              leadership bios for diligence purposes.


              The main caveat is that not every named historical leader remains equally visible in the current public
              structure. Thomas Brunner appears in a May 2026 Sygnum article as Head of Custody & Staking, but the
              current team pages do not show him as the present CTO or as part of the top public executive roster. That
              does not prove he left the company, but it does create a disclosure gap relative to background materials
              that still describe him as a founder-level technical leader. Governance disclosure improved further in the
              May 2026 AGM update, which documented board refreshes, Gerald Goh's transition toward Executive Chairman
              APAC, and planned additions such as a new chief compliance officer and private-wealth lead. Even so,
              public materials still stop short of a full, always-current executive bench map with tenure dates and
              complete reporting lines, so investors should treat management-depth assessment as mostly supported but
              not fully closed.
