      - number: '8.3'
        title: Comparable context and relative position
        blocks:
          - type: paragraph
            body: >-
              The comparable set suggests Sygnum is neither obviously overvalued nor obviously cheap. On the private
              crypto-infrastructure side, Fireblocks reached an $8 billion valuation and Anchorage exceeded $3 billion,
              both well above Sygnum. On the strategic-M&A side, Ripple bought custody/tokenization provider Metaco for
              USD 250 million, which is much lower but also reflects a narrower asset and different market moment. On
              the public-market side, Coinbase, Robinhood, Swissquote, Interactive Brokers, and CME Group all trade at
              far larger market caps, though they differ sharply in business model, geography, disclosure quality, and
              customer base.


              Taken together, these anchors frame Sygnum as a subscale-but-credible institutional infrastructure player.
              The company is large enough to deserve serious strategic valuation, but still too opaque to benchmark
              tightly against public-market multiples. The comp set therefore supports a reasonable range around the
              last round more than it supports a precise formula.
