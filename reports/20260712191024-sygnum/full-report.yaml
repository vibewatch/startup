            body: >-
              The most favorable reading is that Sygnum has built a differentiated institutional workflow franchise
              around Swiss-bank custody, partner-bank distribution, off-exchange collateral, tokenization, and
              traditional-bank connectivity. The public evidence is particularly strong on niche proof points:
              PostFinance for distribution, Fidelity for tokenization, BNY for settlement rails, and Protect for
              off-exchange traction. That is enough to argue Sygnum has more substance than a generic custody vendor.


              The adverse reading is that many underlying capabilities are spreading across the ecosystem. Fireblocks
              already shows bank and fintech case studies; Ripple explicitly targets banks and fintechs; Zodia and
              Copper frame themselves as institutional-grade operating infrastructure; Anchorage can outflank Sygnum in
