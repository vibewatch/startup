  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking overview
        blocks:
          - type: paragraph
            body: >-
              Sygnum is not a speculative app company; it is a regulated digital-asset bank. That changes the risk
              stack. The primary risks are licensing, cross-border compliance, capital adequacy, operational control,
              and partner-channel dependence rather than pure consumer-acquisition risk. The annual
              regulatory-disclosure report makes this visible by explicitly framing technology, information-security,
              KYC/AML, and cross-border compliance as core operational risks, while MiCA and the MAS license perimeter
              show that external regulation is both an enabler and a constant execution burden. The most important
              insight is that these risks sit upstream of revenue. If regulatory permissions narrow, or if a major
              control failure damages trust, customer growth, product breadth, and valuation can all deteriorate at
              once.


              That does not mean the business is fragile. Sygnum has real mitigations: banking licenses, prudential
              reporting, a named risk-management framework, partner-grade references, and expanding leadership depth.
              But the residual profile still screens as moderate-to-high because the business depends on maintaining
              institutional trust across several jurisdictions and several workflow layers simultaneously.
            claimRefs:
