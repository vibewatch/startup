  topStrengths:
    - Regulated Swiss and Singapore operating footprint creates real trust and market-access scarcity.
    - Public customer proof spans major banks, private banks, tokenization partners, and institutional crypto operators.
    - >-
      Valuation history progressed in measured steps from ~USD 800M to USD 900M to USD 1.0B rather than a single hype
      spike.
    - Partner-bank distribution and Protect / tokenization products create meaningful strategic optionality.
    - European expansion under MiCA/CASP rules adds a credible next leg of growth.
  topRisks:
    - Public evidence still does not disclose current revenue, margin, NRR, concentration, or profitability.
    - Regulatory, operational, and trust failures would transmit directly into customers, partners, and valuation.
    - Partner-bank channel dependence could become a concentration and pricing-power risk.
    - The current unicorn mark may be reasonable, but it is not fully underwritten without private financial diligence.
    - >-
      Frontier initiatives like tokenized credit and AI-driven workflows add option value but also governance and
      execution complexity.
  unresolvedGaps:
    - Current audited revenue, gross margin, and cash flow are not public.
    - Top-customer and top-partner concentration remain undisclosed.
    - Renewal, churn, and attach-rate data across product lines are not public.
    - Capital-stress scenarios and downside resilience beyond point-in-time ratios remain private.
    - The fully diluted cap table and current ownership structure after the 2025 round are not public.
