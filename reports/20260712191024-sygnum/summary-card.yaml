summary:
  headline: >-
    Sygnum appears to be a strategically credible regulated digital-asset bank with real institutional proof and scarce
    regulatory positioning, but public evidence still leaves enough revenue, retention, concentration, and margin gaps
    that the right call is research-more rather than an unconditional pass.
