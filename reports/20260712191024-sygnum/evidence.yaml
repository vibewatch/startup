  - id: GP001
    question: What are Sygnum's actual custody, trading, Protect, and tokenization fee schedules relative to peers?
    whyItMatters: Public pricing opacity prevents a true margin or packaging comparison and makes value-for-money judgment weaker.
    severity: high
    suggestedNextStep: Request live proposal decks or RFP responses from Sygnum and at least two peers such as Anchorage and Fireblocks.
  - id: GP002
    question: >-
      How concentrated is Sygnum's competitive traction across a few flagship relationships such as PostFinance and
      Fidelity?
    whyItMatters: >-
      A small number of reference customers can overstate moat if expansion within the rest of the client base is
      shallow.
    severity: medium
    suggestedNextStep: Ask for cohort retention, active-client counts by product, and revenue concentration by top counterparties.
  - id: GP003
    question: How much repeat revenue comes from Protect, tokenization, and settlement versus basic custody or trading?
    whyItMatters: The moat case depends on higher-value workflows, but public evidence proves launches more than monetization depth.
    severity: high
    suggestedNextStep: Request product-level revenue mix and gross-margin disclosure under NDA.
  - id: GI001
    question: What are Sygnum's audited FY2024 and FY2025 revenue, EBITDA, and net income?
    whyItMatters: >-
      Without audited financials, public profitability and run-rate claims cannot be reconciled into valuation-quality
      earnings.
    severity: high
    suggestedNextStep: Request audited consolidated financials and management bridge from 2023 run-rate to FY2024/FY2025 actuals.
  - id: GI002
    question: What share of revenue comes from custody, trading, staking, tokenization, B2B, Protect, and settlement?
    whyItMatters: >-
      The moat and margin story depends on whether higher-value workflow services are already material or still mostly
      narrative.
    severity: high
    suggestedNextStep: Request product-level revenue and gross-margin splits.
  - id: GI003
    question: How much cash, liquidity runway, and unused capital capacity does Sygnum actually have?
    whyItMatters: Capital adequacy and financing dependency cannot be fully underwritten from CET1 and profitability language alone.
    severity: high
    suggestedNextStep: Request cash position, liquidity forecast, capital plan, and any warehouse or credit-facility obligations.
  - id: GE001
    question: >-
      What are the actual API surface, sandbox, SDK, and changelog details for partner-bank and institutional
      integrations?
    whyItMatters: >-
      The public workflow case is strong, but the public developer ergonomics are still too thin to judge implementation
      friction confidently.
    severity: high
    suggestedNextStep: Request API docs, sandbox access, changelog, and implementation guides under NDA or customer preview.
  - id: GE002
    question: What are the operational metrics for SygnEx, Protect, and tokenization issuance?
    whyItMatters: >-
      Public proof points show launches and scale anecdotes, but not uptime, throughput, liquidity depth, or incident
      rates.
    severity: high
    suggestedNextStep: Request status metrics, incident history, supported-asset standards, and trading / settlement volume by module.
  - id: GE003
    question: Who controls smart-contract upgrades, freezes, recovery, and whitelist logic across tokenized products?
