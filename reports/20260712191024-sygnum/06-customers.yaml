- id: adoption-trajectory-and-channel-expansion
  title: Adoption trajectory and channel expansion
  body: 'Sygnum''s adoption trajectory is most visible through channel growth and product-surface expansion rather than through public usage telemetry. The company said its institutional client base reached 2,000 across more than 70 countries, partner banks exceeded 20 by mid-2024, and bank-to-bank revenues grew 70 percent in 2025. PostFinance created a 2.5 million-customer distribution surface, Moomoo reported more than 1 million users in Singapore even though access to DAMMF is limited to accredited investors, and the Arbitrum application exposed both fund-scale and token-scale indicators inside the Fidelity relationship. These are strong adoption clues, but they are not cohort analytics.


    The more subtle adoption story is expansion inside the same account base. Tactical Crypto Allocation, crypto sector indices, tokenized-liquidity products, and tokenized private-markets access all suggest that once a client enters Sygnum''s custody-and-banking perimeter, the company can expand the relationship with investment wrappers and capital-markets products. That is attractive because it implies land-and-expand potential, but the public record does not quantify attach rates or repeat purchase. The adoption story is therefore directionally positive, with the caveat that investors still have to infer repeat usage from launches and channel growth rather than from hard retention data.'
  claimRefs:
  - CU004
  - CU014
  - CU015
  - CU017
  - CU020
  - CU024
