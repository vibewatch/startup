company:
  name: Sygnum
chapter:
  number: 6
  title: Customers
  summary: Sygnum's customer base looks institutionally credible and strongly partner-led. Public proof is strongest in bank distribution and capital-markets relationships—PostFinance, ZugerKB, PKB, Fidelity, Hamilton Lane, Moomoo, and FalconX—while the biggest disclosure gap is still retention and concentration rather than customer existence. The company appears to land with regulated custody or B2B enablement and then expand into investment wrappers and tokenized-capital-markets workflows.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Sygnum''s customer base is best understood as institutional and partner-led rather than retail-direct. Public materials consistently describe the company as serving professional and institutional investors, banks, corporates, DLT foundations, external asset managers, and fund managers. The named proof set reinforces that description. PostFinance, Zuger Kantonalbank, and PKB show bank-distribution customers; Fidelity and Hamilton Lane show asset-management and tokenized-capital-markets customers; FalconX shows a digital-asset prime-brokerage customer type; and Moomoo shows platform-based accredited-investor distribution. This is a diverse institutional customer mix, but it is diverse within a specific universe: customers that need regulated digital-asset access through financial infrastructure rather than through a consumer app.


    The size signals are also meaningful. Sygnum said it had 2,000 institutional clients in more than 70 countries by January 2025, and the bank-partner network had already passed 20 institutions by mid-2024. That does not reveal revenue distribution or concentration by client, but it does show that Sygnum is not relying on only one geography or one buyer class. The strongest visible cluster remains Switzerland and Swiss-adjacent private banking, followed by Singapore-accredited-investor distribution and global asset-management partnerships.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU019
  - CU023
  - CU030
  - CU031
  - CU032
