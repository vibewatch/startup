- id: named-customer-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: 'The highest-quality public references are the ones that show live, branded offers inside another institution''s own channel. PostFinance is the strongest single example because it is a large Swiss incumbent that publicly named Sygnum and tied the partnership to a customer surface of 2.5 million users. Zuger Kantonalbank is also strong because it shows product expansion over time, not just launch rhetoric: the 2025 release says the bank expanded its token menu and that customers access crypto directly through the bank''s e-banking and mobile app. PKB adds a private-banking and wealth-management proof point, with customers using fiat deposits to buy, hold, and trade leading cryptocurrencies through Sygnum''s platform.


    The non-bank proofs matter because they broaden reference quality. Moomoo Singapore demonstrates accredited-investor platform distribution. Fidelity and Hamilton Lane show that Sygnum can sit inside tokenized asset-management workflows with institutional-grade partners. FalconX adds a digital-asset-market-structure customer class. The total picture is stronger than a list of logos because these references span several different buyer types. Still, public evidence proves reference quality more clearly than reference depth: launch, expansion, and integration are visible, but revenue contribution and renewal quality are not.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
