- id: retention-durability-and-concentration
  title: Retention, durability, and concentration
  body: 'Public retention evidence is weak in the strict sense: there is no NRR, GRR, churn, renewal rate, or contract-length disclosure. The best available durability signals are indirect. Bank partners appear embedded because services are delivered inside the partner''s own channels and product strategy; ZugerKB expanded its token menu after launch, PKB framed the relationship as part of a medium- to long-term strategy, and Sygnum said bank-to-bank revenues grew through existing partners. Those are constructive signs, but they are not substitutes for explicit renewal metrics.


    Concentration remains the most material customer-risk question. The public record is anchored by a relatively small number of flagship names—PostFinance, ZugerKB, PKB, Moomoo, Fidelity, Hamilton Lane, and FalconX. Those are high-quality names, but they could still represent a meaningful share of public narrative relative to actual client count. The adverse conclusion is therefore straightforward: customer quality appears strong, yet the distribution of that quality across the broader base remains opaque. Investors should treat the named references as proof of capability, not proof that concentration or retention risk is low.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU034
  tableRefs:
  - TU004
  - TU006
- id: customer-verdict-and-diligence-path
  title: Customer verdict and diligence path
  body: 'The customer verdict is positive. Sygnum''s public proof set is unusually strong for a private digital-asset bank because it includes live bank-distribution partners, asset-management relationships, accredited-investor platform distribution, and digital-asset market-structure customers. The company appears to have real reference quality across several buyer classes and more than one geography. It also appears to have credible expansion paths once a relationship is established, thanks to investment wrappers and tokenized-capital-markets products layered on top of custody and B2B banking.


    The underwriting blocker is not whether Sygnum has customers; it is whether those customers are durable and well-distributed enough to support the next phase of scaling. The public record still does not show retention, contract duration, revenue concentration, or cohort expansion by segment. That means the correct diligence path is to request segment revenue, top-10 customer concentration, renewal metrics, product attach rates, and referenceable customer interviews. Until then, the customer base looks impressive and institutionally credible, but still not fully underwritten.'
  claimRefs:
  - CU023
  - CU024
  - CU032
  - CU034
  - CU035
