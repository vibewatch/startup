  - - Settlement / treasury rails
    - USD settlement and payment connectivity
    - BNY relationship announced
    - Transactions / balances / treasury services
    - Potentially sticky but economics undisclosed
    - Settlement volumes and monetization model
  notes: The table separates visible monetization rails from undisclosed realized economics. Public sources are best at proving existence and weakest at proving segment mix.
