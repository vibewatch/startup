- id: cost-structure-and-capital-intensity
  title: Cost structure and capital intensity
  body: 'Sygnum''s cost structure is probably heavier than that of software-only crypto infrastructure vendors. The custody materials reference Crypto-AML screening, FIPS-140.2 Level 3 hardware, Swiss Tier IV data centers, insurance, and integrated compliance controls. The custody-architecture article reinforces that institutional custody requires multiple security layers and expert operational oversight, not just code. Add MAS-regulated Singapore operations on top of Swiss bank requirements, and the compliance burden is clearly real. That is the cost of selling a high-trust regulated wrapper.


    At the same time, not every product rail should be equally capital-intensive. Tokenization issuer tooling automates shareholder registries and payment flows, which should have more software-like scaling once the platform is built. B2B banking can benefit from partner leverage. Protect and settlement appear operationally more complex but potentially high-value because they sit close to treasury, liquidity, and counterparty-risk management. The likely result is a blended model: regulated custody and banking drive the fixed cost base and capital discipline, while tokenization, B2B enablement, and adjacent workflow services are the most likely sources of operating leverage if volumes keep compounding.'
