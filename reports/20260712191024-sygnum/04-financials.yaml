company:
  name: Sygnum
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence suggests Sygnum had crossed into a more mature operating phase before the 2025 unicorn round: management disclosed a USD 100m-plus 2023 exit revenue run rate, positive Q4 2023 cash flow, and FY2024 operational profitability. The business appears multi-rail and fee-based across custody, trading, staking, tokenization, Protect, settlement, and B2B banking, but disclosure quality remains too thin for a conviction underwriting case because audited revenue, product mix, margin, cash, and runway are still private.'
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction
  body: 'Sygnum''s public financial story is unusual for a private fintech because it discloses a few meaningful operating anchors without releasing a full income statement. The clearest revenue-scale proxy is the January 2024 funding update, where management said the business had exited 2023 with a USD 100 million-plus annualized revenue run rate and positive cash flow in the fourth quarter. One year later, the January 2025 growth-round announcement said FY2024 was operationally profitable. Those claims do not substitute for audited revenue or EBITDA, but they do matter: they imply Sygnum had already moved beyond pure venture-subsidy economics before the unicorn round. Asset and balance growth reinforce the point. Public disclosures moved from more than USD 4 billion of assets under administration in early 2024 to more than USD 5 billion of client assets at the 2025 round, and then to more than USD 1 billion of net new money in 2025 according to the 2026 AGM update.


    The revenue model itself is clearly multi-rail. Sygnum''s current product pages point to custody, trading, staking, tokenization, off-exchange collateral, settlement, and bank-enablement revenue rather than one dominant software license. That mix is important because it suggests monetization can come from both asset balances and activity: custody and staking depend on held assets, Protect and trading depend on trading and collateral usage, and B2B plus tokenization depend on partner adoption and issuance activity. The company therefore looks structurally more like an institutional workflow bank than like a single-product custodian or asset manager.'
