- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Current public workaround
  - Exact diligence path
  rows:
  - - Standalone audited revenue
    - Cannot test valuation against actual sales
    - Use 2023 run-rate claim and profitability claims as rough anchors
    - Request audited FY2024-FY2025 financial statements
  - - Segment revenue mix
    - Cannot know which rails drive economics
    - Infer multi-rail model from product pages
    - Request revenue by custody, trading, staking, tokenization, B2B, settlement
  - - Gross margin by product
    - Cannot separate attractive software-like rails from capital-heavy rails
    - Infer cost drivers from custody/compliance disclosures
    - Request gross margin by product family
  - - Cash / runway
    - Financing dependency remains uncertain
    - Use profitability language and capital ratios only
    - Request cash balance, 13-week cash forecast, and runway model
  - - Realized pricing
    - Cannot test contract economics or competitive discounting
    - Use product descriptions and partner proof only
    - Request sample client contracts or pricing sheets
  - - Client concentration
    - Reference customers may overstate breadth
    - Use PostFinance, Fidelity, BNY, and FalconX as proof points
    - Request top-10 client and partner concentration
  notes: The gaps are not minor reporting nuisances; they are the main reason a constructive narrative still falls short of a conviction underwriting case.
