      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险是 Sygnum 的核心风险，因为许可决定它能提供哪些产品、提供给谁、在哪些司法辖区提供。公司拥有瑞士银行牌照和新加坡许可，欧盟扩张则越来越多地与 MiCA 交汇。MiCA
              方向上有帮助，因为它统一了加密资产服务规则；但它也通过授权、监管、披露和记录保存要求抬高合规开销。Sygnum 自己的披露也强化了同一点：如果银行缺少所需注册或批准，材料不能在这些司法辖区使用。


              法律复杂性栈比简单的托管牌照更宽。年报显示审慎资本和流动性监管，AIFMD
              披露则揭示资产管理一侧承担基金和流动性风险责任。即便可持续性风险声明也有信号意义：它说明并非每个披露制度都已经与不断变化的投资者预期完全协调。实际结论是，监管既是护城河，也是移动靶。
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR009
              - CR021
              - CR032
