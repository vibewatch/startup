  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              Sygnum
              不是投机型应用公司；它是一家受监管的数字资产银行。这改变了风险栈。主要风险不是纯粹的消费者获客，而是牌照、跨境合规、资本充足、运营控制和合作伙伴渠道依赖。年度监管披露报告把技术、信息安全、KYC/AML
              和跨境合规明确列为核心运营风险，MiCA 和 MAS
              牌照边界也显示，外部监管既是赋能因素，也是持续执行负担。最重要的洞察是，这些风险位于收入上游。一旦监管许可收窄，或重大控制失败损害信任，客户增长、产品广度和估值都可能同时恶化。


              这不意味着业务脆弱。Sygnum
              有真实缓释因素：银行牌照、审慎报告、具名风险管理框架、合作伙伴级背书，以及不断加深的领导层厚度。但剩余风险画像仍应评为中高，因为业务依赖在多个司法辖区和多个工作流层同时维持机构信任。
            claimRefs:
              - CR001
              - CR004
              - CR024
              - CR025
              - CR029
