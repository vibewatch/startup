      - number: '6.2'
        title: 具名客户证明与背书质量
        blocks:
          - type: paragraph
            body: >-
              质量最高的公开背书，是那些在另一家机构自有渠道里上线、带品牌的产品。PostFinance 是最强的单一案例：它是瑞士大型既有机构，公开点名 Sygnum，并把合作对应到 250 万用户的客户触点。Zuger
              Kantonalbank 也很强，因为它展示了随时间推进的产品扩展，而不只是上线话术：2025 年发布稿称，该行扩展了代币菜单，客户可直接通过该行电子银行和移动应用访问加密资产。PKB
              增加了一个私人银行和财富管理证明点：客户通过 Sygnum 平台使用法币存款买入、持有和交易主流加密货币。


              非银行证据也重要，因为它拓宽了背书质量。Moomoo Singapore 证明合格投资者平台分销。Fidelity 和 Hamilton Lane 显示，Sygnum
              能嵌入机构级合作伙伴的代币化资产管理工作流。FalconX
              增加了数字资产市场结构客户类别。整体画面强于一串客户标志，因为这些背书跨越了几类买方。尽管如此，公开证据更清楚地证明了背书质量，而不是背书深度：上线、扩展和集成可见，但收入贡献和续约质量不可见。
