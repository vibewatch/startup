      - number: '3.4'
        title: 定价、打包与切换成本
        blocks:
          - type: paragraph
            body: >-
              这个市场的公开定价透明度很弱。已抓取页面大多描述能力、目标客户类型和关系结构，而不是标准化费率表。因此，更有用的比较落在打包方式上。Sygnum 和 Anchorage 打包的是受监管银行关系；BitGo
              打包钱包弹性加受监管选项；Fireblocks 和 Ripple 打包控制平面软件；Copper 和 Zodia 打包机构工作流基础设施；Komainu
              打包托管优先、并通往相邻服务的准入。这些打包差异很重要，因为它们影响谁控制接入、谁承担合规和运营负担，以及客户能内部化多少能力、外包多少能力。


              因而，切换成本真实存在，但不完整。机构会面对接入、法律、政策、集成和迁移摩擦，快速更换供应商并不吸引人。与此同时，架构又足够模块化，多归属仍有可能：一家供应商处理托管，另一家处理执行，再一家处理场外结算，还有一家处理代币化或软件编排。Sygnum
              自己的 B2B 和 API 主导框架也强化了这一点。公司一旦嵌入会有黏性，但并不是栈里每一层都明显不可替代。
