chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的公开材料在核心身份上口径一致：它把自己定位为全球首家数字资产银行，也是建立在瑞士和新加坡底色上的全球数字资产银行集团。作为一家私营金融科技公司，Sygnum 的创立时间线也罕见地清楚。官网称公司
              2017 年开始构思，2018 年 5 月注册成立；联系材料则显示，苏黎世有瑞士银行实体，新加坡 DUO Tower 有新加坡实体。同一批公司页面也把 Sygnum
              放在机构和专业市场，而非零售交易所。Reuters 背书报道进一步强化了这一点：公司不服务零售用户，重点是让机构用户交易代币、获得托管，并以加密资产抵押借款。实际含义是，Sygnum
              不是在争夺大众零售分销，而是在争夺受监管基础设施、跨境可信度，以及接入合作银行和机构工作流的能力。


              这一定位比单纯托管宽得多。官网、B2B 页面和 2026 年欧洲更新中，Sygnum
              都把自己描述为一体化数字资产银行平台，覆盖交易、托管、质押、代币化、结算和银行间服务。集团的法律与监管足迹也似乎不止两个主枢纽。公司备案和公告反复说明，瑞士和新加坡是核心运营基地，但也披露在 Abu
              Dhabi、Luxembourg、Liechtenstein，以及截至 2026 年中扩大的 EU 准入中，拥有受监管或注册存在。关键尽调结论是：Sygnum
              更应被理解为拥有多处法律支点的受监管数字资产金融基础设施集团，而不是狭义加密经纪商或纯软件供应商。
