      - number: '3.5'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              最乐观的读法是，Sygnum 已围绕瑞士银行托管、合作银行分销、交易所外抵押、代币化和传统银行连接，建立起差异化机构工作流业务壁垒。公开证据在利基验证点上尤其强：PostFinance 验证分销，Fidelity
              验证代币化，BNY 验证结算通道，Protect 验证交易所外牵引。这足以说明 Sygnum 比普通托管供应商更有内容。


              反向读法是，许多底层能力正在生态内扩散。Fireblocks 已展示银行和金融科技公司案例；Ripple 明确瞄准银行和金融科技公司；Zodia 和 Copper
              把自己定位为机构级运营基础设施；Anchorage 可以在美国监管信号上侧翼压过 Sygnum；Sygnum 自己的托管架构笔记也暗示，安全主张必须持续升级才能保持可信。做承销判断时，正确结论不是 Sygnum
              没有护城河，而是它的护城河看起来中等、以分销为主导，并非永久排他。公司在欧洲和瑞士机构渠道中位置不错，但全球基础设施竞赛已经足够拥挤，若要证明可持续份额领先，还需要收入集中度、客户留存和重复产品扩张的进一步证据。
