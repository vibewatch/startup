      - number: '7.3'
        title: 运营、安全和资本风险
        blocks:
          - type: paragraph
            body: >-
              运营风险是第二大类别，因为 Sygnum
              位于托管、结算和代币化资产工作流内部，错误代价高，声誉也可能很快反转。年报明确纳入流程、人员、系统和外部事件失效。它还单独点出信息安全和合规风险。托管架构博客补充了不利色彩：即便是复杂机构，如果密钥管理或工作流设计薄弱，也可能失败。因此，投资者应假设最大下行不会来自普通软件缺陷，而会来自带来财务或监管后果的控制失败。


              资本是同一故事的另一面。Sygnum 披露总资本比率为 17.48%，目标比率为 16.83%。这提供支撑——Sygnum
              高于目标——但缓冲并没有大到让投资者可以忽视压力风险。同一报告显示，信用、市场和运营风险都会消耗资本。这进一步说明，即使收入表面上以费用为主，Sygnum 也受银行式资产负债表纪律约束。
