        - ~USD 1.5B 估值锚；稀缺受监管基础设施可选性享有溢价
        - 执行、监管、变现滞后
        - 需要更强经营披露
      - - 基准
        - 质量继续改善，但经济性仍只部分公开
        - ~USD 1.0B 锚点，接近最新融资轮
        - 透明度有限，估值难以实质性重估
        - 与现有证据最一致
      - - 悲观
        - 增长放缓、加密周期走弱，或收入证据改善前渠道集中度先反噬
        - ~USD 0.6B 锚点，更接近此前战略金融科技估值标记的折价水平
        - 变现、集中度、监管摩擦
        - 会跟随负面尽调或市场冲击出现
    notes: 这些区间是决策锚点，不是精确内在价值结果。
