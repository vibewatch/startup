      - number: '4.4'
        title: 资本充足与融资依赖
        blocks:
          - type: paragraph
            body: >-
              当前资本故事更像扩张导向，而非困境驱动。2022 年 Series B 资助了新市场和 Web 3.0 产品。2024 年 1 月融资把新的估值上台阶，与首次强公开年化收入和正现金流语言组合在一起。2025 年
              1 月融资又在 FY2024 运营盈利已被声称之后，支持地理扩张、收购、Bitcoin 技术产品和合规建设。这个顺序很重要。它说明 Sygnum
              一直在用外部资本加速一个受监管银行平台，而不是单纯填补无边界现金消耗。


              即便如此，公司仍然资本密集。17.48% 的 CET1 比率和 CHF 125.53M 的 CET1
              资本显示，资本充足率是一个主动运营约束，不是背景细节。资产重或银行包装服务的增长，必须与审慎监管要求共存。缺失环节是流动性能见度：没有已抓取来源披露现金、现金消耗或现金跑道。因此，公开证据支持这样一种看法：Sygnum
              比典型亏损型加密创业公司资本更充足、融资依赖更低；但如果产品扩张或监管要求的资本超过内部现金生成能力，融资风险并没有被消除。
