      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 按产品、地域和头部客户拆分的收入
        - 需要用它把叙事转成估值模型
        - 管理层资料室 / CFO
      - - 留存与集中度
        - NRR、GRR、流失率、前十大客户敞口
        - 决定独角兽估值的耐久度
        - 管理层 / 客户访谈
      - - 资本与资产负债表
        - 压力情景、流动性计划、损失敞口
        - 监管银行估值的关键
        - NDA 下的风控 / 财务资料
      - - 单元经济
        - 银行间部署的毛利率和实施经济性
        - 检验渠道规模能否带来经营杠杆
        - 运营 / 财务复核
      - - 代币化和 Protect 变现
        - 收入贡献和管线可见度
        - 显示期权价值是否正在变成现金流
        - 产品与财务尽调
      - - 事件历史
        - 安全、合规和宕机整改历史
        - 直接影响信任折扣
        - 风控 / 审计尽调
    notes: 如果这些问题能得到有力满足，最新私募估值可能会比仅看公开证据更有吸引力。
