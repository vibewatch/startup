      - number: '3.3'
        title: 直接同行与相邻对手
        blocks:
          - type: paragraph
            body: >-
              在已抓取集合中，Anchorage 似乎是最接近的直接同行，因为它也主张银行级宽度，而不是纯软件专门化。其页面描述的是面向机构的加密银行、合格托管、交易、质押、结算、稳定币，以及 MAS 持牌的新加坡业务。这与
              Sygnum 的受监管银行叙事形成近似参照；重要差别在于，Anchorage 还能指向美国联邦银行和合格托管人措辞。BitGo
              同样很宽，但姿态更偏基础设施弹性：受监管托管旁边还有自托管、钱包工具、主经纪服务、融资和加密即服务。Komainu 和 Zodia 更接近机构托管与工作流基础设施，Copper
              则强调只面向机构的交易和资金管理工作流。


              Fireblocks 和 Ripple 重要，是因为它们削弱了一个观点：银行必须购买完整外包银行包装，才能推出数字资产产品。Fireblocks 销售钱包、稳定币支付、代币化和银行上线工具；Ripple
              销售面向银行和金融科技公司的机构托管软件，并带有代币化和结算接口。这些公司未必复制 Sygnum 的法律姿态，但它们直接争夺对客户栈的战略控制。因此，Sygnum
              的竞争一部分关乎客户结果，一部分关乎谁掌握支撑这些结果的运营层。
