      - number: '7.4'
        title: 合作伙伴依赖与人员风险
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的运营模式有清晰依赖。合作银行驱动分销，而且随着时间推移显得更重要：AGM 更新报告 2025 年银行对银行收入增长 70%。PostFinance、ZugerKB 和 PKB
              是很好的证明点，但这种强项也带来渠道集中度敞口。BNY 结算关系和 FalconX 代币化信贷关系揭示了另一层依赖：关键工作流可能依赖外部通道、交易对手或法律结构，而 Sygnum
              无法单方面控制。SwissBanking 存款代币概念验证在市场基础设施层面也指向同一方向。


              人员风险重要，但严重程度低于监管或控制风险。公司仍与一个小型高管团队绑定，带来关键人敏感性；但 AGM 关于加深全球领导层梯队的表述，说明风险已被识别并部分缓释。执行风险夹在这些主题之间：一个承诺快速 B2B
              部署的模式，每次新合作伙伴上线，都必须把合规、集成、支持和控制对齐。
