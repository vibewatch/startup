  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与模块图
        blocks:
          - type: paragraph
            body: >-
              Sygnum
              的产品故事是连贯的，因为公司卖的不是一个支持加密的钱包账户。公开产品栈把托管、质押、Protect、代币化、结算相邻流程和合作银行赋能，放在同一个受监管运营模式之下。代币化材料尤其有帮助，因为它们列出了模块，而不只是类别：Desygnate
              处理发行侧工作，如结构设计、认购和铸造；SygnEx 则提供受监管的二级市场层。更宽的代币化页面随后显示，这些模块已经被用于私募市场、货币市场基金、私募债、艺术品和代币化投资准入。


              这种宽度重要，因为它让 Sygnum
              更接近工作流银行，而不是单功能供应商。托管仍是枢纽，但不是整个产品。客户可以在不离开平台边界的情况下，从持有资产走向质押、交易、交易所外抵押品管理或代币化发行。因此，产品表面看起来有意模块化，但商业上又被打包在一起。需要谨慎的是，公开包装强于公开模块级商业化数据：投资者能看到存在哪些东西，却看不到附加销售率、模块渗透率或按产品线划分的客户集中度。
