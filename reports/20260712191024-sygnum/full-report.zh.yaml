      - number: '4.2'
        title: 定价、GTM 与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开记录对变现机制的说明强于对实际价格表的说明。Sygnum 没有像大众市场应用展示零售价格那样，公开广泛的机构费率表，覆盖托管、代币化、Protect 或结算。不过，GTM 模式可见。B2B
              银行业务页面称，银行靠 API 主导的集成最快 60 天上线；PostFinance 则展示了这一渠道可能如何运转：一个企业关系就能把加密交易和托管分发给庞大的终端客户群，而 Sygnum
              不必直接获取每个账户。2026 年 AGM 披露，银行间收入靠既有合作伙伴增长 70%，这是整个已抓取集合中最强的渠道经济性线索之一。


              产品层面的信号也显示，变现可能集中在哪里。托管直接接入交易和质押，应能提高每个已接入客户的钱包份额。代币化发行人工具增加结构设计、认购和二级市场活动。Protect
              围绕交易对手风险缓释和抵押品管理，引入更高价值服务；其资产增长说明，客户不只是把它当成一个功能勾选项。公开案例的弱点是标价：没有合同经济性、费率表或产品级收入拆分，投资者能看到钱应该如何赚，却还看不到每条业务线实际贡献多少。
