  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入工作流与替代方案
        blocks:
          - type: paragraph
            body: >-
              Sygnum 所处市场不应简单称为加密托管。Sygnum 自己的产品页面一直把托管、交易、质押、借贷、代币化、结算、传统证券、FX 和 B2B
              银行服务打包成一种运营模式。竞争对手页面也强化了同一框架。Anchorage、BitGo、Fireblocks、Komainu、Zodia、Copper 和 Ripple
              都围绕受监管托管、执行、结算、钱包基础设施、代币化或稳定币通道的某种组合来定位自己。这组反复出现的能力包很重要，因为它说明真正的竞争和估值场域，是机构数字资产金融基础设施，而不是狭窄的钱包存储利基。


              这个边界至少包含五类反复出现的工作流：安全托管；执行和融资；质押和收益；代币化和发行；支付或结算基础设施。Sygnum 还靠 B2B 渠道加入了第六个元素——借现有银行分销。PostFinance
              是最清晰的验证点：它与 Sygnum
              的上线显示，买方可以是一家传统主力银行，想为终端客户获得受监管数字资产能力，而不只是加密原生对冲基金。这个市场之外的主要替代方案是自托管、未受监管交易所，以及大型机构内部自建。这些替代方案重要，因为它们限制定价权，也可能拖慢采用；但它们并不会消除对受监管、可审计、机构级基础设施的底层需求。
