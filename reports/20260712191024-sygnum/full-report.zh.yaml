      - number: '2.4'
        title: 增长驱动、监管与约束
        blocks:
          - type: paragraph
            body: >-
              当前增长逻辑建立在机构化和监管之上，而不只是投机性零售狂热。EY 2026 年对 350 多位机构投资者的调查显示，73% 计划提高数字资产配置；Sygnum 自己的 Sygnal 和季度笔记则把 2026
              年描述为代币化、链上银行和机构采用从试验走向真实执行的一年。MiCA 是最清晰的区域顺风之一。ESMA 称，该制度在透明度、披露、授权和监管上建立统一 EU 规则；Sygnum 自己的 B2B 材料也明确把
              MiCA 描述为在 27 国 EU 区块获得更广增长的路径。合作银行渠道、代币化基金、稳定币结算和机构信贷产品的成熟，都指向同一方向。


              但约束同样真实。BCG 称，代币化仍面临碎片化、标准薄弱、二级市场浅和监管复杂。Galaxy 认为，与多数碎片化、超额抵押的 DeFi 市场相比，机构信贷需要资本效率更高的结构。Sygnum
              季报还加上一层宏观背景：机构采用继续推进，但风险偏好仍弱，代币价格下跌；即便 SEC 和 CFTC
              协调改善，美国立法清晰度仍不完整。落到实处，需求存在，但收入兑现可能取决于谁最快解决信任、合规和运营复杂性。因此，这个市场之所以有吸引力，恰恰因为它很难：强控制的受监管基础设施会得到回报，无法把机构兴趣转成可扩展、可审计工作流采用的供应商会被惩罚。
