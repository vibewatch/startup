      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              加密原生公司通常买方更窄，Sygnum 的买方版图却异常多元。Sygnum 自己的 B2B 材料明确瞄准银行、私人客户、外部资产管理人、基金和对冲基金，以及 DLT 或企业客户。竞争对手页面进一步扩展了这张图，把
              ETF 发行方、财富管理机构、金融科技公司、交易所、协议，甚至公共部门机构都纳入其中。因此，这个市场最好被理解为多细分机构栈，而不是单一垂直利基。


              采用路径通常从受监管中介开始，而不是从零售获客开始。Sygnum 称，合作银行最快可借助模块化服务集成在 60 天内上线；2024 年 6 月 B2B
              里程碑则显示，这些合作伙伴覆盖私人、零售、综合和州立银行。PostFinance 接着验证了漏斗下一步：一家系统重要性既有机构借 Sygnum，把加密交易和托管带给大众客户群。合作银行路线很重要，因为它让
              Sygnum 能触达终端需求，却不必承担与消费级交易所同等的零售监管和零售 CAC 负担。它也意味着，实际预算负责人会随产品变化：银行 CIO
              可能购买基础设施，财富团队可能为客户购买准入，机构投资者可能直接购买托管或代币化服务。尽调视角下，这种复杂性是特性，不是缺陷——但它确实让直接市场份额测算更难。
