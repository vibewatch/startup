      - number: '6.3'
        title: 采用轨迹与渠道扩张
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的采用轨迹，最清楚地体现在渠道增长和产品触点扩展上，而不是公开使用遥测。公司称机构客户基数达到 2,000 家、覆盖 70 多个国家，合作银行到 2024 年中超过 20 家，2025
              年银行对银行收入增长 70%。PostFinance 创造了一个覆盖 250 万客户的分销触点，Moomoo 报告新加坡用户超过 100 万，尽管 DAMMF 仅向合格投资者开放；Arbitrum 申请还暴露了
              Fidelity 关系中的基金规模和代币规模指标。这些都是强采用线索，但不是分群分析。


              更细的采用故事，是在同一账户基础内扩展。Tactical Crypto Allocation、加密行业指数、代币化流动性产品和代币化私募市场入口都说明，一旦客户进入 Sygnum
              的托管和银行边界，公司可以用投资封装和资本市场产品扩展关系。这很有吸引力，因为它暗示先落地、再扩张的潜力，但公开记录没有量化附加率或重复购买。因此，采用故事方向正面，但必须附上一个保留：投资者仍要从发布和渠道增长推断重复使用，而不是从硬留存数据判断。
