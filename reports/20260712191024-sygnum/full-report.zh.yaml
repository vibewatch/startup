      - number: '8.4'
        title: 情景区间与估值立场
        blocks:
          - type: paragraph
            body: >-
              最可用的情景框架很简单。熊市情景把价值放在约 USD 0.6 billion：如果加密市场环境恶化、合作伙伴分销比预期更脆弱，或收入变现弱于品牌暗示。基准情景把价值维持在最新 USD 1 billion
              融资标记附近，因为公开证据确实支持有意义的战略质量：受监管状态、强银行背书、产品广度、Protect 规模和增长中的欧洲可选性。牛市情景达到约 USD 1.5 billion，前提是 Sygnum
              成功把欧盟准入、代币化产品动能和合作银行网络效应转化为更清晰的运营杠杆。


              这导出一个最适合描述为公允到略微偏紧的估值立场；但在操作上，更安全的标签是无法精确评估。最新标记有足够防守性，值得尊重；但透明度不足，不能在没有私有尽调的情况下追价。投资者应把它视为严肃的基准锚，而不是便宜货。
            claimRefs:
              - CV020
