      - number: '1.2'
        title: 创始人、领导层与治理能见度
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的公开创始故事一半清楚，一半杂乱。官网明确列出 Luka Müller、Manuel Krieger、Mathias Imbach 和 Gerald Goh
              为创始人。个人资料页随后为三位运营型创始人提供了扎实的角色细节。Manuel Krieger 被描述为联合创始人、董事会成员、前瑞士 CEO、前执行董事会成员，并于 2020 年 10
              月转入董事会。Mathias Imbach 明确是集团 CEO，Gerald Goh 则是 APAC 首席执行官，此前有家族办公室和 Cambridge Associates
              经历。团队页确认了当前董事会、集团执行董事会和新加坡执行董事会的分工。尽调层面，这些已经足以支撑可信的创始人与领导层履历。


              主要保留点在于，并非每位列名历史领导者在当前公开架构中都有同等可见度。Thomas Brunner 出现在 Sygnum 2026 年 5 月一篇文章中，头衔是 Head of Custody &
              Staking；但当前团队页面没有显示他是现任 CTO，也没有把他列入最顶层公开高管名单。这不能证明他已经离开公司，但相对仍把他描述为创始级技术负责人的背景材料，确实形成披露缺口。2026 年 5 月 AGM
              更新进一步改善了治理披露，记录了董事会更新、Gerald Goh 向 Executive Chairman APAC
              过渡，以及新增首席合规官和私人财富负责人等计划。即便如此，公开材料仍没有给出完整且始终最新的高管梯队图、任期日期和完整汇报线，因此投资者应把管理深度评估视为大体有支撑、但尚未完全闭环。
