      - number: '4.5'
        title: 财务判断与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              最强的正面财务结论是，Sygnum 似乎早于许多同行进入了更成熟的运营阶段。公开证据支持真实收入基础、2023 年底第四季度正现金流、FY2024 运营盈利、持续再投资 AI
              驱动工作流和代币化信贷准入等产品，以及客户资产、净新增资金和合作银行收入继续增长。这足以说明，公司并不是一个脆弱的过桥融资案例。


              最强的负面结论是，披露质量仍远低于承销方形成估值信心所需水平。没有独立经审计收入，没有分部组合，没有已实现定价披露，没有现金消耗或现金跑道披露，也没有产品级利润率数据。投资者可以推断，Sygnum
              最好的长期经济性可能来自在受监管托管之上扩展更高价值的工作流服务，但公开记录无法证明这些工作流现在已经有多赚钱。因此，正确的委员会判断是建设性但受限：Sygnum
              的财务质量看起来好于私营加密公司中位数，但严肃承销案例仍需要保密财务数据，估值意见才可能变强。
