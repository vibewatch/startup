      - number: '1.4'
        title: 规模信号、监管与合作银行分销
        blocks:
          - type: paragraph
            body: >-
              Sygnum 公开画像中最有投资价值的一点，是业务同时展现出受监管身份和商业规模证据。监管方面，MAS Financial Institutions Directory 直接把 Sygnum Pte. Ltd.
              列为 Capital Markets Services 持牌机构和 Major Payment Institution，许可包括托管服务和数字支付代币服务。瑞士方面，Sygnum
              年报和官网一贯称集团持有瑞士银行牌照。2024 年监管披露还提供了硬性的审慎监管数据：CET1 资本 CHF 125.53M，CET1 比率 17.48%。数字资产银行需要这类证据，因为它说明 Sygnum
              不只是把监管语言当营销，而是在传统机构交易对手真正关心的资本和披露框架内运营。


              商业上，已披露的规模标记有意义，虽然仍不完整。Sygnum 称，2025 年 1 月融资轮完成时，公司拥有超过 USD 5B 的客户资产，机构客户基数超过 2,000，覆盖 70 多个国家。同一公告称，2024
              年交易收入到第三季度已超过上一年全年，全年交易量同比增长超过 1,000%。分销侧，Sygnum 2024 年 6 月合作银行更新称，B2B 平台已接入 20
              多家银行，为超过三分之一瑞士人口启用受监管加密服务，并以 99.9% 自动化率每天处理超过 1,000 笔 B2B 交易。PostFinance 自己的上线公告确认，至少一家系统重要性瑞士银行信任
              Sygnum，把它作为面向客户加密服务的受监管合作伙伴。限制在于精度：公开材料没有拆分活跃与非活跃客户、费用组合或确切合作伙伴经济性。
