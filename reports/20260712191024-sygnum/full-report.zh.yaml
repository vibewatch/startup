      - number: '1.3'
        title: 融资历史、估值路径与所有权信号
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的融资轨迹是公开记录中最清楚的部分之一。2022 年 1 月 Series B 融资 USD 90M，由 Sun Hung Kai & Co. 领投，公司投后估值约 USD 800M。按
              Sygnum 的说法，这轮融资前，2021 年合并总收入增长十倍，机构客户数接近 1,000；即便回头看，估值上台阶也说得通。下一次披露融资发生在 2024 年 1 月，Sygnum 战略增长轮中期交割筹得超过
              USD 40M，投后估值 USD 900M，Azimut Holding 为领投方。管理层把该轮融资与超过 USD 100M 的年化收入规模、2023 年第四季度正现金流、超过 USD 4B 的管理资产，以及超过
              1,700 的客户基数绑定在一起。


              最终验证出现在 2025 年 1 月。Sygnum 官方新闻稿和 Reuters 背书报道一致显示，公司融资 USD 58M，引入 Fulgur Ventures 作为基石投资者，并跨过 USD 1B
              估值门槛。这轮融资也把叙事从单纯资产负债表支持，扩展到战略扩张：管理层称资金将支持进入 EU 和 EEA、建立受监管香港业务、推出更多 Bitcoin
              技术产品、开展收购，并加大韧性投入。仍不透明的是，这几轮之后的确切当前股权结构。公开来源清楚列出了领投方和管理层参与，但没有给出包含稀释、员工池规模或董事会控制权的完整最新股权表。即便融资年表本身支撑充分，这仍是重要尽调缺口。
