  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的公开财务故事对私营金融科技公司并不常见：它披露了几个有意义的经营锚点，却没有发布完整损益表。最清晰的收入规模代理，是 2024 年 1 月融资更新中管理层称，业务在 2023 年结束时已有超过
              USD 100M 的年化收入规模，并在第四季度实现正现金流。一年后，2025 年 1 月增长轮公告称 FY2024 已实现运营盈利。这些说法不能替代经审计收入或 EBITDA，但确实重要：它们暗示，Sygnum
              在独角兽轮之前已经越过纯风险资本补贴经济阶段。资产和余额增长进一步支撑这一点。公开披露从 2024 年初超过 USD 4B 的管理资产，增长到 2025 年融资轮时超过 USD 5B 的客户资产；随后，按
              2026 年 AGM 更新，2025 年净新增资金超过 USD 1B。


              收入模式本身明显是多通道。Sygnum
              当前产品页面指向托管、交易、质押、代币化、交易所外抵押、结算和银行赋能收入，而不是一种主导性软件许可证。这种组合重要，因为它说明变现既可来自资产余额，也可来自动作量：托管和质押取决于持有资产，Protect
              和交易取决于交易与抵押使用，B2B 加代币化则取决于合作伙伴采用和发行活动。因此，公司在结构上更像一家机构工作流银行，而不是单一产品托管商或资产管理人。
