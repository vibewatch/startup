  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资论点
        blocks:
          - type: paragraph
            body: >-
              Sygnum 是本报告集中最具战略意味的私人公司之一，因为它把银行监管、加密基础设施、代币化和合作银行分销结合在一起。正面论点很清楚：公司从 2022 年约 USD 800 million 估值，推进到 2024
              年 USD 900 million、2025 年 USD 1
              billion，并且期间积累了更强的机构证明点，而不只是搭市场情绪的车。反论点同样清楚：即便证明更好，投资者仍缺少收入、利润率、留存和集中度数据，无法检验独角兽价格到底保守还是激进。


              这种组合导向继续研究建议。公开证据足以让人认真对待估值，质量也足以避免把它当作炒作直接否定。但财务透明度不足，还无法高确信地判断，按最新标记附近投入下一美元，是向上还是向下被错定价。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV023
              - CV024
              - CV038
              - CV040
