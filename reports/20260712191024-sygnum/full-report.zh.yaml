  - id: TV005
    title: 打破投资论点与否决触发表
    columns:
      - 触发项
      - 阈值
      - 如何传导到投资论点
      - 行动含义
    rows:
      - - 牌照或监管限制
        - 核心托管、交易或跨境服务受到任何实质限制
        - 削弱信任与分销论点
        - 暂停，或大幅重估
      - - 安全 / 控制事件
        - 发生严重事件，导致客户受损或引发重大审查
        - 损害银行级信任护城河
        - 除非彻底整改，否则转向回避
      - - 合作伙伴渠道收缩
        - 流失旗舰伙伴，或银行间业务势头明显放缓
        - 削弱分销驱动的上行空间
        - 下调基准情景和上行情景概率
      - - 经济性不达预期
        - 私下尽调显示变现弱或集中度高
        - 说明最近一轮估值跑在基本面前面
        - 向悲观情景重估
      - - 资本压力
        - 压力测试显示韧性不足或缓冲偏薄
        - 抬高偿付能力和增长顾虑
        - 显著提高风险折扣
    notes: 这些触发项用于投委会监控，不只是投后汇报。
