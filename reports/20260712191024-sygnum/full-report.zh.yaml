      - number: '2.5'
        title: 市场视图中的矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              已抓取证据支持一个庞大且增长中的市场，但不支持对 Sygnum 确切可服务或可获取份额做虚假精确化。市场研究来源可以宽口径测算托管或代币化，官方公司页面则证明产品匹配和买方多样性；但没有任何公开材料披露
              Sygnum 相对同行的资产、收入或交易量市场份额。因此，市场证据在方向和品类宽度上强，在公司特定份额上弱。


              基础设施价值指标和可变现收入池之间，也存在方法错配。一万亿美元级代币化资产预测，不等于一万亿美元级银行收入机会；其中大量价值可能流向发行方、结算通道、交易所或软件平台，而不是银行。同样，以资产价值表达的托管市场规模估算，如果没有抽成率、产品组合和相邻服务附加销售率假设，也不能直接转成费用池。正确的尽调姿态是，把市场视为毫无疑问相关且结构性扩张，同时继续保留一个明确证据缺口：一家受监管的瑞士-新加坡运营商，现实中能捕获多少
              SAM 和 SOM。
