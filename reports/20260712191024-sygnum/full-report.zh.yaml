      - number: '8.5'
        title: 退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Sygnum
              从叙事上看具备退出条件，因为它拥有公开投资者或战略收购方常常奖励的要素：牌照、机构背书、银行级信任定位、代币化相关性和多司法辖区增长。它缺少的是能让这一叙事以高确信度被融资定价的披露层。关键尽调问题很直接：按产品线划分的收入、客户集中度、留存和续约、资产负债表与资本压力，以及银行对银行部署的单位经济模型。


              在这些数据可用前，建议仍是继续研究。公开证据好到不足以下避开结论，但也不完整到可以在当前价格干净放行。决策应由私有财务尽调决定，而不是由独角兽标签的表面吸引力决定。
            claimRefs:
              - CV008
              - CV019
              - CV035
              - CV036
              - CV037
              - CV039
