  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >-
              Sygnum 的客户基础更适合理解为机构客户与合作伙伴驱动，而不是直接面向零售。公开材料始终把公司描述为服务专业和机构投资者、银行、企业、DLT
              基金会、外部资产管理人和基金管理人。具名证据也强化了这一点。PostFinance、Zuger Kantonalbank 和 PKB 显示银行分销客户；Fidelity 和 Hamilton Lane
              显示资产管理和代币化资本市场客户；FalconX 显示数字资产主经纪客户类型；Moomoo
              则显示基于平台的合格投资者分销。这是一组多元化的机构客户组合，但多元化发生在一个特定圈层里：这些客户需要通过金融基础设施获得受监管的数字资产入口，而不是通过消费级应用。


              规模信号也有意义。Sygnum 称截至 2025 年 1 月，已有 2,000 家机构客户、覆盖 70 多个国家；到 2024 年中，银行合作伙伴网络已超过 20
              家。这没有披露按客户划分的收入分布或集中度，但说明 Sygnum 并不只依赖一个地区或一个买方类别。最清晰的可见集群仍是瑞士及瑞士周边私人银行，其次是新加坡合格投资者分销和全球资产管理合作。
