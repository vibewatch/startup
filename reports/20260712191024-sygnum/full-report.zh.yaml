      - number: '2.2'
        title: 用多重视角测算 TAM 与相邻资金池
        blocks:
          - type: paragraph
            body: >-
              测算 Sygnum 市场规模时，最站得住的方法是使用多重视角，而不是假装一个市场数字能回答所有问题。托管方面，Grand View Research 估计，2024 年全球数字资产托管市场为 USD
              683.38B，并预计到 2033 年达到约 USD 4.38T；Research and Markets 则把同一类别框定为一个跨北美、欧洲和亚太的多区域市场，并给出到 2035
              年的预测表。这些研究有用，因为它们量化了 Sygnum 明确参与的受监管存储和基础设施层，但它们仍是市场研究产品，不是运营商层面的收入证据。


              代币化带来第二个、也大得多的视角。Sygnum 自己的 2026 年第二季度市场笔记称，无许可现实世界资产价值已超过 USD 30B，而 Canton 等许可制网络已经管理超过 USD 320B
              的代币化资产。CoinDesk 对 Ripple-BCG 报告的总结，加上 BCG PDF 原文，都指向到 2033 年潜在 USD 18.9T 的代币化资产市场，基准是 2025 年约 USD
              0.6T。这些数字方向上很有力，但不能直接等同于 Sygnum 可服务市场。更好的解读是，Sygnum
              位于两个大型资金池的交叉点：一个是有数万亿美元资产价值在场的托管与执行基础设施市场；另一个是如果监管、标准和分销继续成熟，可能大幅扩张的代币化市场。
