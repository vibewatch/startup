      - number: '1.5'
        title: 里程碑、2025-2026 动能与未解决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年里程碑显示，公司正试图从可信的利基玩家扩展为多市场基础设施平台。2026 年 5 月 AGM 更新称，Sygnum 在 2025 年吸引超过 USD 1B 净新增资金，银行间收入增长
              70%，Protect 交易所外托管资产增加九倍。该更新还强调了新的产品和市场动作，包括 Starboard Sygnum BTC Alpha Fund、与 UBS 和 PostFinance
              合作的代币化存款概念验证、联合 CHF 稳定币沙盒、Fidelity International 代币化货币市场基金、完全离线冷托管，以及 AI 智能体驱动交易。2026 年 6 月欧洲公告又补上了围绕扩大 EU
              准入的具体下一步叙事。合在一起看，这些里程碑说明，Sygnum 正把 2025 年独角兽事件当作产品深度和地理覆盖的起点，而不是只庆祝纸面估值。


              但公开记录仍留下几个未解尽调事项。独角兽轮之后没有完全更新的股权结构表；除四舍五入的营销披露外，没有精确、经审计的当前员工数；也没有完整公开解释 Thomas Brunner
              相对创始人故事的当前身份。集团披露了强劲的顶线牵引指标，却没有给出独立经审计损益表，也没有按托管、交易、质押、代币化和 B2B 更细拆分业务。这些缺口都不否定业务根基，但它们很重要：Sygnum
              已经足够后期，投资者在把公开故事视为完整之前，理应看到更好的治理深度、财务分部和所有权结构能见度。
