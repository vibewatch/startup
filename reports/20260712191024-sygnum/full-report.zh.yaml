      - number: '6.4'
        title: 留存、耐久性与集中度
        blocks:
          - type: paragraph
            body: >-
              严格意义上，公开留存证据很弱：没有 NRR、GRR、流失、续约率或合同期限披露。最佳可用的耐久性信号都是间接的。银行合作伙伴看起来嵌得较深，因为服务交付在合作伙伴自己的渠道和产品策略里；ZugerKB
              在上线后扩展了代币菜单，PKB 把关系描述为中长期战略的一部分，Sygnum 称银行对银行收入通过现有合作伙伴增长。这些都是建设性信号，但不能替代明确的续约指标。


              集中度仍是最实质的客户风险问题。公开记录由相对少数旗舰名称支撑——PostFinance、ZugerKB、PKB、Moomoo、Fidelity、Hamilton Lane 和
              FalconX。这些名称质量很高，但相对实际客户数量，它们仍可能占据公开叙事中的相当大比例。因此，不利结论很直接：客户质量看起来强，但这类质量在更广客户基础中的分布仍不透明。投资者应把具名背书视为能力证明，而不是集中度或留存风险很低的证明。
