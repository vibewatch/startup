      - number: '7.5'
        title: 缓释、监控与终止触发条件
        blocks:
          - type: paragraph
            body: >-
              缓释故事是真实的。Sygnum
              有牌照、报告纪律、机构合作伙伴和风险框架。因此，风险章节不是泛泛的加密行业警示。但终止触发条件也很具体。重大牌照限制、严重控制或托管事件、清晰的合作伙伴渠道收缩，或资本余量下降，都会实质性削弱投资案例。2025
              年独角兽估值抬高了失望成本，因为一旦增长或韧性弱于叙事，它留给执行滑坡的空间更小。


              因此，正确的尽调路径很直接：索取资本压力情景、事件历史、合作伙伴集中度、客户续约数据和跨境合规路线图。如果这些私有数据点很强，风险画像相对护城河可能可以接受。否则，当前让 Sygnum
              显得差异化的监管复杂性，可能变成投资论点破裂的最快路径。
