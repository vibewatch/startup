            body: Desygnate、SygnEx、Fidelity 代币化流动性和 Protect 提供的工作流证据，远比一句泛泛的「数字资产银行」口号具体。
            calloutType: strength
            claimRefs:
              - CE003
              - CE006
              - CE014
              - CE022
          - type: callout
            title: 公开架构细节仍比产品广度暗示的要薄
            body: Sygnum 能证明产品广度和受监管控制，但还不能在足以支撑技术尽调的层级，公开证明 API 深度、状态遥测或控制边界细节。
            calloutType: risk
            claimRefs:
              - CE033
              - CE035
          - type: callout
            title: 真正可能成为护城河的是监管下的集成工作流
            body: 竞争模块在别处也存在，但把托管、代币化、结算、抵押品和合作银行分销作为一套协调运营栈来评估时，Sygnum 看起来最强。
            calloutType: insight
            claimRefs:
              - CE019
              - CE028
              - CE032
