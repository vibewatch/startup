        title: 图表
        blocks:
          - type: callout
            title: 最新一轮像延续，不像尖峰
            body: Sygnum 在 2022–2025 年间从约 USD 800M 走到 USD 900M，再到 USD 1B，比一次性炒作重定价更有秩序。
            calloutType: insight
