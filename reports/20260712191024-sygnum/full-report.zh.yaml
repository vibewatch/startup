      - number: '8.2'
        title: 融资背景和价格历史
        blocks:
          - type: paragraph
            body: >-
              融资历史重要，因为它显示的是估值递进，而不是单点估计。Sygnum 2022 年 Series B 对公司的估值约 USD 800 million，并有具体运营主张支撑：接近 1,000 家机构客户、超过 USD
              2 billion 在管资产，以及 2021 年合并总收入增长十倍。2024 年 1 月中期交割在融资超过 USD 40 million 后，设定了 USD 900 million 投后估值。2025 年 1
              月战略增长轮随后以 USD 58 million 新资本把公司推到 USD 1 billion。这是有节奏的台阶，不是网红股式跃升。


              不过，最新估值仍是私人融资结果，不是内在价值证明。投资者知道现有支持者接受了什么价格，却不知道支撑它的收入或利润率基础。因此，融资历史可作为锚，也能证明投资者信心，但不能完全替代常规估值工作。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV018
              - CV029
      - number: '8.3'
        title: 可比背景与相对位置
        blocks:
          - type: paragraph
            body: >-
              可比集合显示，Sygnum 既没有明显高估，也没有明显便宜。在私人加密基础设施一侧，Fireblocks 估值达到 $8 billion，Anchorage 超过 $3 billion，均明显高于
              Sygnum。在战略 M&A 一侧，Ripple 以 USD 250 million 收购托管 / 代币化提供商
              Metaco，低得多，但也反映资产更窄、市场时点不同。在公开市场一侧，Coinbase、Robinhood、Swissquote、Interactive Brokers 和 CME Group
              的市值都大得多，尽管它们在商业模式、地域、披露质量和客户基础上差异很大。


              合在一起，这些锚把 Sygnum
              定位为规模尚小但可信的机构基础设施玩家。公司已经大到值得严肃做战略估值，但仍过于不透明，难以用公开市场倍数紧密对标。因此，可比集合更支持围绕上一轮形成合理区间，而不是支持一个精确公式。
            claimRefs:
              - CV010
              - CV011
