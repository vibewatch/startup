      - number: '5.2'
        title: 工作流与运营架构
        blocks:
          - type: paragraph
            body: >-
              已抓取证据支持的是具体产品工作流，而不是泛泛的营销方框。在 Fidelity 案例中，Desygnate 提供链上基金登记、智能合约结算、稳定币认购，以及 24/7 认购和赎回。Arbitrum
              申请又补充了更多实施细节：多链支持、以 FIUSD 代币提供非交易时段流动性，以及与 Chainlink 式 NAV 发布对接的运营接口。托管方面，Sygnum
              称资产保持隔离，随后成为质押、交易或代币化资产活动的基础层。Protect 则把这套架构向外延伸到交易所交易，在把抵押品留在交易所外的同时，镜像余额以获得交易访问。


              这让运营模式看起来像一组相连层：中心是受监管托管和合规，周围是工作流模块，边缘是合作银行或基础设施集成。最有意思的产品事实，不是 Sygnum
              有很多页面，而是这些页面暗示托管、抵押、结算和发行之间存在共享编排。开放问题是，这种共享编排在内部是否像外部呈现那样统一。公开材料没有展示服务拓扑、详细 API 文档或状态遥测，因此架构可信，但仍只是部分透明。
