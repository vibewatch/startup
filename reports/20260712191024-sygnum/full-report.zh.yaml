      - number: '6.5'
        title: 客户结论与尽调路径
        blocks:
          - type: paragraph
            body: >-
              客户结论是正面的。对一家私人数字资产银行来说，Sygnum
              的公开证明集异常强，因为它包括已上线的银行分销合作伙伴、资产管理关系、合格投资者平台分销和数字资产市场结构客户。公司看起来在几类买方和不止一个地区都具备真实背书质量。关系建立后，借助叠加在托管和 B2B
              银行业务之上的投资封装与代币化资本市场产品，公司似乎也有可信的扩展路径。


              投资判断的堵点不是 Sygnum
              有没有客户，而是这些客户是否足够耐久、分布是否足够均衡，能否支撑下一阶段扩张。公开记录仍没有显示留存、合同期限、收入集中度或按细分的分群扩展。因此，正确的尽调路径是索取细分收入、前 10
              大客户集中度、续约指标、产品附加率和可供访谈的客户。到那之前，客户基础看起来亮眼且具机构可信度，但仍没有完全完成投资验证。
            claimRefs:
              - CU023
