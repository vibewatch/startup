company:
  name: Sygnum
chapter:
  number: 3
  title: Competitors
  summary: Sygnum competes in a crowded institutional stack rather than a narrow custody niche. Its strongest public advantages are Swiss-bank custody, partner-bank distribution, Protect off-exchange collateral, and tokenization proof points with Fidelity, BNY, and major Swiss banks. The moat looks real but moderate because Anchorage, BitGo, Fireblocks, Zodia, Copper, Ripple, and Komainu can each attack important layers of the same workflow.
sections:
- id: landscape-and-market-classes
  title: Landscape and market classes
  body: 'Sygnum''s competitive set is wider than a list of crypto custodians. The fetched evidence shows at least three serious classes: regulated digital-asset banks that try to own custody, trading, settlement, and trust in one relationship; custody-first or workflow-first operators that keep institutions connected to venues while emphasizing control and security; and software platforms that help banks and fintechs launch digital-asset services without outsourcing the full customer relationship. That framing matters because Sygnum is selling not only safekeeping but also an institutional operating stack that touches execution, collateral, issuance, and bank distribution. Its own public materials are explicit on this point: custody, staking, trading, tokenization, Protect, Connect, and B2B banking all sit inside one regulated platform.


    The relevant competition therefore includes direct peers such as Anchorage, plus firms like BitGo, Komainu, Zodia, Copper, Fireblocks, and Ripple that attack adjacent layers of the same workflow. Some compete as banks, some as custodians, and some as infrastructure vendors for banks. Incumbent-bank collaborations also matter. The stablecoin sandbox with UBS, PostFinance, Raiffeisen, ZKB, and BCV shows that Sygnum is operating inside the same design space that larger financial institutions increasingly want to own. The result is a landscape where Sygnum benefits from breadth, but also faces competition from several different operating models instead of one monolithic rival.'
  claimRefs:
  - CP001
  - CP008
  - CP020
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: sygnum-differentiation-and-proof-points
  title: Sygnum differentiation and proof points
  body: 'Sygnum''s strongest public differentiation is its ability to combine a Swiss-bank custody model with newer institutional workflows that are still rare to see documented in one offering. The custody page emphasizes ring-fenced, off-balance-sheet client ownership and no reliance on third-party custodians. Protect extends that model into exchange trading by keeping collateral bankruptcy-remote, while the March 2026 update shows that this niche has real traction: platform assets surpassed USD 1 billion after 900 percent growth during 2025. Tokenization is the other major proof point. Sygnum is not just presenting tokenization as strategy rhetoric; it publicly describes structuring, issuance, secondary-market access, and a live Fidelity International launch powered by Desygnate.


    The BNY settlement relationship and the CHF stablecoin sandbox add a second layer of evidence: institutional trust and incumbent interoperability. Those announcements matter because they show Sygnum competing on the connective tissue between digital-asset infrastructure and traditional banking rails. PostFinance is similarly important as a distribution proof point. Together, these references suggest Sygnum''s advantage is less about saying it is regulated and more about showing that multiple counterparties already use it for banking-adjacent digital-asset workflows. That is a more durable claim than security marketing alone, although it is still not the same as dominant global share.'
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP005
