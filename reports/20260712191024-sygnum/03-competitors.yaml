- id: pricing-packaging-and-switching-costs
  title: Pricing, packaging, and switching costs
  body: 'Public pricing transparency in this market is weak. The fetched pages mostly describe capabilities, target customer types, and relationship structures rather than standardized fee cards. That forces a more useful comparison on packaging. Sygnum and Anchorage package a regulated-bank relationship; BitGo packages wallet flexibility plus regulated options; Fireblocks and Ripple package control-plane software; Copper and Zodia package institutional workflow infrastructure; and Komainu packages custody-first access to adjacent services. These packaging differences matter because they influence who controls onboarding, who carries compliance and operational burden, and how much a client can internalize rather than outsource.


    Switching cost is therefore real but incomplete. Institutions face onboarding, legal, policy, integration, and migration friction, which makes rapid vendor switching unattractive. At the same time, the architecture is modular enough that multi-homing remains plausible: one provider can handle custody, another execution, another off-venue settlement, and another tokenization or software orchestration. Sygnum''s own B2B and API-led framing reinforces this point. The company may be sticky once embedded, but it is not obviously irreplaceable in every layer of the stack.'
  claimRefs:
  - CP025
  - CP026
  - CP027
  - CP028
  - CP029
  tableRefs:
  - TP003
- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'The most favorable reading is that Sygnum has built a differentiated institutional workflow franchise around Swiss-bank custody, partner-bank distribution, off-exchange collateral, tokenization, and traditional-bank connectivity. The public evidence is particularly strong on niche proof points: PostFinance for distribution, Fidelity for tokenization, BNY for settlement rails, and Protect for off-exchange traction. That is enough to argue Sygnum has more substance than a generic custody vendor.


    The adverse reading is that many underlying capabilities are spreading across the ecosystem. Fireblocks already shows bank and fintech case studies; Ripple explicitly targets banks and fintechs; Zodia and Copper frame themselves as institutional-grade operating infrastructure; Anchorage can outflank Sygnum in US regulatory signaling; and Sygnum''s own custody-architecture note suggests security claims must keep escalating just to remain credible. For underwriting, the right conclusion is not that Sygnum lacks moat, but that its moat looks moderate and distribution-led rather than permanently exclusive. The company seems well positioned in European and Swiss institutional channels, yet the global infrastructure race is crowded enough that durable share leadership still requires further proof on revenue concentration, client retention, and repeat product expansion.'
