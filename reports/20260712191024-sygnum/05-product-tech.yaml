company:
  name: Sygnum
chapter:
  number: 5
  title: Product & Technology
  summary: 'Sygnum''s product appears most differentiated as an integrated workflow bank rather than as a single-feature crypto vendor. Public evidence best supports mature custody, Protect, staking, and tokenization modules tied together by a regulated control plane, with especially concrete proof in Fidelity tokenized liquidity, SygnEx / Desygnate tokenization flows, and Protect''s off-exchange scale. The main diligence blocker is technical transparency: public sources still say too little about APIs, status history, control boundaries, and module-level operating metrics.'
sections:
- id: product-surface-and-module-map
  title: Product surface and module map
  body: 'Sygnum''s product story is coherent because the company is not just selling a bank account with crypto support. The public stack combines custody, staking, Protect, tokenization, settlement-adjacent flows, and partner-bank enablement under one regulated operating model. The tokenization materials are especially helpful because they name modules instead of only categories: Desygnate handles issuance-side work such as structuring, subscription, and minting, while SygnEx provides a regulated secondary-market layer. The broader tokenization page then shows that these modules are already being applied to private markets, money market funds, private debt, art, and tokenized-investment access.


    That breadth matters because it places Sygnum closer to a workflow bank than to a single-feature vendor. Custody is still the hub, but it is not the whole product. Clients can move from holding assets to staking, trading, off-exchange collateral management, or tokenized issuance without leaving the platform perimeter. The product surface therefore appears intentionally modular yet commercially bundled. The caution is that public packaging is stronger than public module-level commercialization data: investors can see what exists, but not attach rates, module penetration, or customer concentration by product line.'
