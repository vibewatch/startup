    - Desygnate plus SygnEx on one regulated stack
    - Lower workflow fragmentation and more transparent investor journey
    - Public evidence lacks issuance-volume metrics
  - - Deploy tokenized liquidity
    - Institution must add on-chain registry, subscriptions, and settlement tooling
