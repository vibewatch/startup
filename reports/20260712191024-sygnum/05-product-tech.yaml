- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Custody control layer
    - Stores and controls client assets
    - MPC, HSM, data centers, compliance operations
    - Control failure would be high severity
  - - Tokenization orchestration layer
    - Handles structuring, minting, subscription, and lifecycle management
    - Smart contracts, legal structuring, custody integration
    - Upgrade and control boundaries remain only partly public
  - - Secondary-market layer
    - Enables tokenized-asset trading on SygnEx
    - Rulebook, whitelisted custody, OTF operation
    - Liquidity and market-depth transparency are limited publicly
  - - Staking operations layer
    - Runs validator infrastructure and reward accounting
    - Supported networks and validator uptime
    - Operational burden and slashing exposure are not quantified publicly
  - - Protect / settlement layer
    - Mirrors collateral to exchanges and connects treasury rails
    - Exchange integrations, fiat rails, legal framework
    - Partner or venue failure could interrupt workflow
  - - Bank / API integration layer
    - Connects partner banks and clients to services
    - API quality, onboarding, support, and compliance mapping
    - Public developer ergonomics remain thin
  notes: This is a public-evidence operating model, not an internal engineering diagram.
