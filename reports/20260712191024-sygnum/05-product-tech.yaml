    - Firm separately manages validators and custody controls
    - Staking inside regulated custody
    - No separate technical setup and unified account view
    - No public reward-share disclosure
  - - Trade on exchanges with lower counterparty risk
    - Collateral usually sits on exchange
    - Protect off-exchange custody
    - Bankruptcy-remote collateral and yield-bearing alternatives
    - Dependence on connected exchanges and legal framework
  - - Launch bank-distributed crypto services
    - Bank stitches together several vendors
    - B2B banking APIs
    - Faster deployment inside incumbent-bank channels
    - No public API or sandbox depth detail
