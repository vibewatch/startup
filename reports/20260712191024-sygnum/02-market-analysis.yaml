callouts:
- calloutType: strength
  title: The market is bigger than custody and more defensible than retail trading
  body: The fetched sources repeatedly show institutional digital-asset banking converging around custody, settlement, tokenization, and bank-distribution workflows. That makes Sygnum's category more strategically valuable and structurally stickier than a narrow retail exchange niche.
  claimRefs:
  - CM001
  - CM020
  - CM021
  - CM022
  - CM035
- calloutType: risk
  title: Large TAM estimates do not automatically translate into Sygnum's serviceable fee pool
  body: Tokenized-asset and custody market estimates are useful for direction, but they mix asset values, infrastructure volume, and adoption intent. Without public share, fee, and take-rate data, they should be used to bound opportunity rather than to infer near-term Sygnum revenue.
  claimRefs:
  - CM013
  - CM017
  - CM031
- calloutType: risk
  title: Institutional demand is improving faster than the market's standardization
  body: EY, Sygnum, and Chainalysis all show demand and adoption moving forward, but BCG, Galaxy, and Sygnum's own quarterly note still point to fragmentation, capital-efficiency limits, and regulatory incompleteness. Execution quality will therefore matter as much as market size.
  claimRefs:
  - CM012
  - CM029
  - CM031
  - CM033
