  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sygnum-market-share
    missingEvidence: A public source showing Sygnum's market share in custody assets, tokenized assets, or partner-bank transaction volume relative to peers.
    whyItMatters: TAM evidence is strong, but investors still lack a reliable public read on Sygnum's actual share capture inside that expanding market.
    diligencePath: Request company-level market-share disclosures, peer benchmarking, and wallet or volume statistics from management.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: sam-som-methodology
    missingEvidence: A company-specific bridge from broad custody and tokenization market estimates to Sygnum's serviceable and obtainable market.
    whyItMatters: Public third-party reports measure asset-value pools, not Sygnum's realistic fee opportunity or share by buyer segment.
    diligencePath: Build a bottom-up model from partner-bank counts, client segments, product take rates, and geography-specific regulatory permissions.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: stale
