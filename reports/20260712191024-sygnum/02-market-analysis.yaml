  - Caveat
  rows:
  - - Custody market value
    - Global digital-asset-custody market
    - USD 683.38B in 2024
    - USD 4.38T by 2033; 23.6% CAGR
    - Supports large underlying asset-value pool for custody-led business
    - Asset value is not equal to revenue pool
  - - Tokenization market value
    - Tokenized assets overall
    - ~USD 0.6T in 2025
    - USD 18.9T by 2033
    - Huge expansion runway for issuance, servicing, and custody
    - Forecast relies on regulation and standardization
  - - Permissionless RWA
    - On-chain RWA value
    - '>USD 30B in Q2 2026'
    - Quarterly growth remained strong
    - Shows near-term tokenization traction is no longer hypothetical
    - Represents ecosystem value, not bank revenue
  - - Permissioned tokenized assets
    - Canton and similar networks
    - '>USD 320B in tokenized assets'
    - Institutional repo and collateral scaling
    - Suggests banks and capital-markets players are already active
    - Permissioned volume may not be open to all providers
  - - Bank distribution
    - Partner-bank route
    - 20+ Sygnum bank partners
    - MiCA and more bank launches can widen reach
    - Gives Sygnum a distribution SAM larger than its direct-sales footprint
    - No public data on partner-bank revenue concentration
  - - Institutional sentiment
    - Allocation intent
    - 73% plan to increase allocations in 2026
    - More deliberate but still constructive
    - Supports continued demand for regulated infrastructure
    - Survey intent is not booked revenue
  notes: This sizing table mixes market-value lenses, adoption-intent lenses, and distribution lenses because no fetched public source cleanly discloses a company-specific SAM or SOM for Sygnum. The point is evidence-constrained triangulation, not false precision.
