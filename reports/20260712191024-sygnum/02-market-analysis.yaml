tables:
- id: TM001
  title: Market definition table
  columns:
  - Workflow category
  - Included in Sygnum market?
  - Why it belongs
  - Key buyers
  - Status-quo substitute
  rows:
  - - Regulated custody
    - 'Yes'
    - Core holding layer for institutional digital assets and tokenized assets
    - Banks, asset managers, funds
    - Self-custody or unregulated exchanges
  - - Trading and financing
    - 'Yes'
    - Institutions often need execution, liquidity, and credit alongside storage
    - Funds, trading firms, partner banks
    - Broker-dealer integrations or internal execution stack
  - - Staking and yield
    - 'Yes'
    - Yield-bearing network participation is part of institutional product design
    - Funds, wealth managers, corporates
    - Validator self-operation or pure DeFi access
  - - Tokenization and issuance
    - 'Yes'
    - Sygnum and peers market issuance, tokenized funds, and collateral workflows
    - Banks, issuers, asset managers
    - Traditional issuance rails and paper-heavy servicing
  - - Payments and settlement
    - 'Yes'
    - Stablecoin, FX, and settlement networks are increasingly bundled into the offer
    - Banks, corporates, payment institutions
    - Traditional correspondent banking and slower securities settlement
  - - Retail exchange speculation
    - 'No'
    - Sygnum's model is institutional and bank-distributed rather than mass-retail first
    - End-users reached indirectly via partners
    - Consumer crypto exchanges
  notes: The table intentionally defines the market in workflow terms rather than by legal entity type. It excludes pure retail exchange activity because the fetched Sygnum sources repeatedly frame the model around institutional, professional, and partner-bank distribution.
