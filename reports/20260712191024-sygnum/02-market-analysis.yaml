- id: what-is-still-missing
  title: Contradictions and diligence gaps in the market view
  body: 'The fetched evidence supports a large and growing market, but it does not support false precision about Sygnum''s exact serviceable or obtainable share. Market-research sources can size custody or tokenization broadly, while official company pages prove product fit and buyer variety, yet none of the public material exposes Sygnum''s market share in assets, revenues, or transaction volume relative to peers. The market evidence is therefore strong on direction and category breadth, but weak on company-specific share.


    There is also a methodological mismatch between infrastructure-value metrics and monetizable revenue pools. A trillion-dollar tokenized-asset forecast does not mean a trillion-dollar bank-revenue opportunity; much of that value may accrue to issuers, settlement rails, exchanges, or software platforms rather than to banks. Similarly, custody market-size estimates expressed in asset-value terms do not directly translate into fee pools without assumptions on take rates, product mix, and attachment rates for adjacent services. The right diligence posture is to treat the market as unquestionably relevant and structurally expanding, while carrying forward an explicit evidence gap on the exact SAM and SOM that a regulated Swiss-Singapore operator can realistically capture.'
  claimRefs:
  - CM013
