- id: TM005
  title: Adjacency and substitute table
  columns:
  - Category
  - Role in market
  - Why relevant to Sygnum
  - Why it is not the whole market
  - Evidence
  rows:
  - - Pure custody
    - Core workflow
    - It is the regulated holding layer every institutional workflow needs
    - Sygnum and peers also sell trading, settlement, and tokenization
    - Sygnum, Anchorage, Komainu
  - - Retail exchanges
    - Substitute
    - They can satisfy speculative access cheaply
    - They usually do not solve bank-distribution or regulated-infrastructure needs
    - PostFinance and Sygnum bank-partner model
  - - Self-custody / internal build
    - Substitute
    - Large institutions can avoid vendor fees and retain direct control
    - It raises operational, governance, and regulatory burdens
    - Galaxy and BCG constraints framing
  - - Tokenized funds and private credit
    - Adjacency
    - They expand the monetizable asset pool beyond spot trading
    - They require standards, distribution, and legal structuring that are still maturing
    - Sygnum Q2, BCG, Galaxy
  - - Stablecoin and settlement rails
    - Adjacency
    - They make digital-asset banking more relevant to payments and treasury use cases
    - They still depend on regulation, interoperability, and partner adoption
    - Fireblocks, Chainalysis, Sygnum product stack
  notes: This extra table captures the included-versus-adjacent logic that a single market-size number cannot. It is intentionally qualitative because the fetched sources give much stronger directional evidence than precise revenue-pool segmentation for these categories.
