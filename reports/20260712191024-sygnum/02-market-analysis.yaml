- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver or constraint
  - Direction
  - Evidence
  - Why it matters for Sygnum
  - Time horizon
  rows:
  - - Institutional allocation intent
    - Driver
    - EY survey says 73% plan to increase allocations in 2026
    - Supports demand for regulated infrastructure and product breadth
    - Near term
  - - Tokenization scale-up
    - Driver
    - Sygnum Q2 and BCG point to rising RWA and tokenized-asset volume
    - Expands TAM beyond custody into issuance and settlement
    - Medium term
  - - MiCA harmonization
    - Driver
    - ESMA says MiCA creates uniform rules; Sygnum cites EU growth tailwind
    - Could lower go-to-market friction across Europe
    - Near to medium term
  - - Partner-bank distribution
    - Driver
    - 20+ banks and PostFinance prove the bank-channel model
    - Lets Sygnum scale through incumbents rather than pure direct sales
    - Near term
  - - Regulatory fragmentation outside Europe
    - Constraint
    - Sygnum Q2 says US clarity still incomplete; BCG highlights fragmented rules
    - Slows cross-border scaling and product standardization
    - Near term
  - - Secondary-market and standards gaps
    - Constraint
    - BCG highlights insufficient standards and liquidity
    - Could delay monetization of tokenized assets even if issuance grows
    - Medium term
  - - Capital-efficiency limits in on-chain credit
    - Constraint
    - Galaxy says fragmented overcollateralized markets constrain larger borrowers
    - Means some institutional credit use cases may need hybrid or bespoke structures
    - Near term
  - - Market volatility and weak risk appetite
    - Constraint
    - Sygnum Q2 says prices weakened and ETF flows turned negative despite structural adoption
    - Can slow customer onboarding and asset growth even if long-run demand survives
    - Near term
  notes: The market is attractive precisely because these drivers and constraints coexist. The presence of real demand does not eliminate the need for regulatory, liquidity, and operational infrastructure before value accrues at scale.
