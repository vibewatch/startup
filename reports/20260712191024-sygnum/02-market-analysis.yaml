- id: sizing-lenses-and-adjacent-pools
  title: TAM and adjacent-pool sizing using multiple lenses
  body: 'The most defensible way to size Sygnum''s market is to use multiple lenses rather than pretend one market number answers everything. For custody, Grand View Research estimates the global digital-asset-custody market at USD 683.38 billion in 2024 and projects it to reach roughly USD 4.38 trillion by 2033, while Research and Markets frames the same category as a multi-region market extending across North America, Europe, and Asia-Pacific with forecast tables through 2035. Those studies are useful because they quantify the regulated-storage and infrastructure layer in which Sygnum clearly participates, but they are still market-research products rather than operator-level revenue evidence.


    Tokenization introduces a second and much larger lens. Sygnum''s own Q2 2026 market note says permissionless real-world-asset value surpassed USD 30 billion while permissioned networks such as Canton already manage more than USD 320 billion in tokenized assets. CoinDesk''s summary of the Ripple-BCG report, together with the underlying BCG PDF, points to a potential USD 18.9 trillion tokenized-asset market by 2033 from a base of roughly USD 0.6 trillion in 2025. Those numbers are directionally powerful, but they are not directly equivalent to Sygnum''s serviceable market. A better interpretation is that Sygnum sits at the intersection of two large pools: a custody-and-execution infrastructure market with trillions of asset value at stake, and a tokenization market that could expand dramatically if regulation, standards, and distribution continue to mature.'
