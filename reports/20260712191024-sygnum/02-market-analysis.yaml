- id: drivers-regulation-and-constraints
  title: Growth drivers, regulation, and constraints
  body: 'The current growth case rests on institutionalization and regulation, not on speculative retail euphoria alone. EY''s 2026 survey of more than 350 institutional investors shows 73 percent planned to increase digital-asset allocations, while Sygnum''s own Sygnal and quarterly notes describe 2026 as a year in which tokenization, on-chain banking, and institutional adoption move from experimentation toward real execution. MiCA is one of the clearest regional tailwinds. ESMA says the regime creates uniform EU rules on transparency, disclosure, authorisation, and supervision, and Sygnum''s own B2B materials explicitly frame MiCA as a route to broader growth in the 27-country EU block. The maturation of partner-bank channels, tokenized funds, stablecoin settlement, and institutional credit products all point in the same direction.


    But the constraints are equally real. BCG says tokenization still faces fragmentation, weak standards, thin secondary markets, and regulatory complexity. Galaxy argues that institutional credit needs more capital-efficient structures than most fragmented overcollateralized DeFi markets currently provide. Sygnum''s quarterly report adds a macro overlay: institutional adoption continued, but risk appetite remained weak, token prices sold off, and US legislative clarity stayed incomplete even as SEC and CFTC harmonisation improved. In practice, that means demand exists, but revenue realization may depend on who solves trust, compliance, and operational complexity fastest. The market is therefore attractive precisely because it is hard: it rewards regulated infrastructure with strong controls, but it punishes providers that cannot turn institutional interest into scalable, auditable workflow adoption.'
