- id: milestones-and-remaining-diligence-gaps
  title: Milestones, 2025-2026 momentum, and unresolved diligence gaps
  body: 'The 2025-2026 milestone set shows a company trying to scale from credible niche player into multi-market infrastructure platform. The May 2026 AGM update said Sygnum attracted more than USD 1 billion in net new money during 2025, grew bank-to-bank revenue by 70 percent, and saw Protect off-exchange custody assets increase ninefold. It also highlighted new product and market initiatives including the Starboard Sygnum BTC Alpha Fund, a tokenized deposit proof of concept with UBS and PostFinance, a joint CHF stablecoin sandbox, Fidelity International''s tokenized money market fund, fully offline cold custody, and AI-agent-driven transactions. The June 2026 Europe announcement added a concrete next-step narrative around expanded EU access. Taken together, these milestones suggest Sygnum is using its 2025 unicorn event as a launching point for product depth and geographic reach rather than simply celebrating a paper valuation.


    Still, the public record leaves several diligence items unresolved. There is no fully updated cap table after the unicorn round, no precise audited current employee count beyond rounded marketing disclosures, and no complete public explanation of Thomas Brunner''s current standing relative to the founder story. The group also discloses strong top-line traction indicators without giving a standalone audited income statement or a more granular breakdown of the business by custody, trading, staking, tokenization, and B2B. None of these gaps invalidates the franchise, but they matter because Sygnum is now late-stage enough that investors should expect better visibility on governance depth, financial segmentation, and ownership structure before treating the public story as complete.'
