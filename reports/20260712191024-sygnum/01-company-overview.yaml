callouts:
- calloutType: strength
  title: The strongest public signal is not branding but regulated, partner-bank distribution
  body: Sygnum's partner-bank traction and multi-jurisdiction licensing do more to support its identity than the phrase 'world's first digital asset bank' alone. The combination of MAS permissions, Swiss bank positioning, PostFinance as a named partner, and 20-plus bank relationships suggests real institutional integration rather than a marketing-only claim.
  claimRefs:
  - CO002
  - CO019
  - CO030
  - CO032
  - CO034
- calloutType: risk
  title: The funding chronology is clear, but the current ownership picture is not
  body: Sygnum's 2022, 2024, and 2025 rounds are well documented, yet public evidence still does not provide a complete current cap table, preference stack, or insider ownership percentage after the unicorn event. That missing ownership detail matters more now that the company has crossed into late-stage, cross-border growth mode.
  claimRefs:
  - CO014
  - CO019
  - CO024
- calloutType: risk
  title: Leadership credibility is strong, but the Thomas Brunner disclosure gap is real
  body: Current public materials support strong biographies for Manuel Krieger, Mathias Imbach, and Gerald Goh. However, Thomas Brunner appears publicly as Head of Custody & Staking rather than as a clearly presented current CTO, so any diligence process that assumes the older founder-role framing should verify his exact present remit directly.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO010
  - CO011
