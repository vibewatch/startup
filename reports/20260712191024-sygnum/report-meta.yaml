companyProfile:
  summary: >-
    Sygnum is a Zurich-founded digital asset banking group with Swiss and Singapore regulatory roots.
    Its public platform spans regulated custody, trading, Lombard-style lending, staking, tokenization,
    off-exchange collateral workflows, and bank-to-bank enablement for partner institutions. Public
    customer proof includes PostFinance, Zuger Kantonalbank, PKB Private Bank, Fidelity International,
    and FalconX, while recent releases also show expanding European market access under MiCA/CASP rules
    and continuing product innovation in tokenized assets and human-in-the-loop AI workflows.
