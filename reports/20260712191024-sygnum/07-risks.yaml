- id: mitigations-monitoring-and-kill-triggers
  title: Mitigations, monitoring, and kill triggers
  body: 'The mitigation story is real. Sygnum has licenses, reporting discipline, institutional partners, and a risk framework. That means the risk chapter is not a generic crypto cautionary tale. But the kill triggers are also specific. A meaningful license restriction, a severe control or custody incident, clear partner-channel contraction, or a drop in capital headroom would all materially weaken the investment case. The 2025 unicorn valuation increases the cost of disappointment because it leaves less room for execution slippage if growth or resilience prove weaker than the narrative.


    The correct diligence path is therefore straightforward: request capital-stress scenarios, incident history, partner concentration, customer-renewal data, and cross-border compliance roadmaps. If those private data points are strong, the risk profile may be acceptable relative to the moat. If not, the same regulatory complexity that now differentiates Sygnum could become the fastest path to a thesis break.'
  claimRefs:
  - CR019
  - CR020
  - CR022
  - CR023
  - CR028
