  - TR002
  figureRefs:
  - FR002
- id: partner-dependency-and-people-risk
  title: Partner dependency and people risk
  body: 'Sygnum''s operating model has clear dependencies. Partner banks drive distribution and visibly matter more over time: the AGM update reported 70 percent bank-to-bank revenue growth in 2025. PostFinance, ZugerKB, and PKB are excellent proof points, but that strength also creates channel concentration exposure. The BNY settlement relationship and the FalconX tokenized-credit relationship reveal another layer of dependency: key workflows can depend on external rails, counterparties, or legal structures that Sygnum cannot unilaterally control. The SwissBanking deposit-token proof of concept points in the same direction at the market-infrastructure level.


    People risk is material but less severe than regulatory or control risk. The company is still identified with a small senior leadership group, which creates key-person sensitivity, but the AGM messaging about a deepened global leadership bench suggests the risk is recognized and partially mitigated. Execution risk sits between these themes: a model that promises rapid B2B deployment still has to align compliance, integration, support, and controls every time a new partner goes live.'
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
