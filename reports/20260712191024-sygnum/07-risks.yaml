chapter:
  number: 7
  title: Risks
  summary: Sygnum's risk profile is shaped by regulation and trust. The most material exposures are license and cross-border compliance, operational/security control failure, and partner-channel dependence; prudential capital and execution risk matter too, but mostly as consequences or amplifiers of those core themes.
sections:
- id: risk-ranking-overview
  title: Risk ranking overview
  body: 'Sygnum is not a speculative app company; it is a regulated digital-asset bank. That changes the risk stack. The primary risks are licensing, cross-border compliance, capital adequacy, operational control, and partner-channel dependence rather than pure consumer-acquisition risk. The annual regulatory-disclosure report makes this visible by explicitly framing technology, information-security, KYC/AML, and cross-border compliance as core operational risks, while MiCA and the MAS license perimeter show that external regulation is both an enabler and a constant execution burden. The most important insight is that these risks sit upstream of revenue. If regulatory permissions narrow, or if a major control failure damages trust, customer growth, product breadth, and valuation can all deteriorate at once.


    That does not mean the business is fragile. Sygnum has real mitigations: banking licenses, prudential reporting, a named risk-management framework, partner-grade references, and expanding leadership depth. But the residual profile still screens as moderate-to-high because the business depends on maintaining institutional trust across several jurisdictions and several workflow layers simultaneously.'
  claimRefs:
  - CR001
  - CR004
  - CR024
  - CR025
  - CR029
  tableRefs: []
  figureRefs:
  - FR001
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Regulatory risk is the cornerstone risk for Sygnum because permissions define which products it can offer, to whom, and in which jurisdictions. The company operates with a Swiss banking license and Singapore permissions, while EU expansion increasingly intersects with MiCA. MiCA is directionally helpful because it standardizes rules for crypto-asset services, but it also raises compliance overhead through authorisation, supervision, disclosure, and record-keeping requirements. Sygnum''s own disclosures reinforce the same point: materials cannot be used in jurisdictions where the bank lacks the relevant registration or approval.


    The legal-complexity stack is broader than simple custody licensing. The annual report shows prudential capital and liquidity oversight, and the AIFMD disclosure reveals fund and liquidity-risk responsibilities for the asset-management side. Even the sustainability-risk statement matters as a signal: it shows that not every disclosure regime is yet fully harmonized with evolving investor expectations. The practical conclusion is that regulation is both moat and moving target.'
  claimRefs:
  - CR002
  - CR003
  - CR006
  - CR008
  - CR009
  - CR021
  - CR032
  tableRefs:
  - TR001
- id: operational-security-and-capital-risk
  title: Operational, security, and capital risk
  body: 'Operational risk is the second major category because Sygnum sits inside custody, settlement, and tokenized-asset workflows where errors can be expensive and reputation can turn quickly. The annual report explicitly includes failures of processes, people, systems, and external events. It also singles out information security and compliance risk. The custody-architecture blog adds adverse color: even sophisticated institutions can fail if key management or workflow design is weak. Investors should therefore assume that the biggest downside would come not from ordinary software bugs but from control failures with financial or regulatory consequences.


    Capital is the other side of the same story. Sygnum disclosed a 17.48 percent total capital ratio against a 16.83 percent target ratio. That is supportive—Sygnum was above target—but it is not such a large cushion that investors should ignore stress risk. The same report shows credit, market, and operational risk all matter for capital consumption. This reinforces that Sygnum is subject to banking-style balance-sheet discipline even if revenue appears fee-based on the surface.'
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR010
  - CR011
  - CR030
  - CR031
  - CR036
  - CR039
  - CR040
