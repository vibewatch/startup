  topStrengths:
    - 受监管的瑞士和新加坡运营版图，带来真实信任背书和稀缺市场准入。
    - 公开客户证据覆盖大型银行、私人银行、代币化合作伙伴和机构级加密运营商。
    - 估值历史从约 USD 800M 到 USD 900M 再到 USD 1.0B，节奏克制，不是一次性炒作拉升。
    - 合作银行分销，以及 Protect / 代币化产品，带来有意义的战略可选性。
    - MiCA/CASP 规则下的欧洲扩张，为下一段增长提供了可信支点。
  topRisks:
    - 公开证据仍未披露当前收入、利润率、NRR、集中度或盈利能力。
    - 监管、运营和信任一旦出问题，会直接传导到客户、合作伙伴和估值。
    - 合作银行渠道依赖可能演变成集中度和定价权风险。
    - 当前独角兽估值或许合理，但没有私有财务尽调就无法完全承销。
    - 代币化信贷和 AI 驱动工作流等前沿项目增加期权价值，也抬高治理和执行复杂度。
  unresolvedGaps:
    - 当前经审计收入、毛利率和现金流未公开。
    - 头部客户和头部合作伙伴集中度仍未披露。
    - 各产品线的续约、流失和附加销售率数据未公开。
    - 资本压力情景以及时点比率之外的下行韧性仍是私有信息。
    - 2025 年融资后的完全稀释股权结构和当前所有权结构未公开。
