      dependencies.
    claimRefs: [CR004, CR005, CR010, CR011, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual exposures cluster around pre-product execution, capital
      intensity, incumbent bundle pressure, and still-undisclosed control maturity.
    data:
      columns:
        - label: Likelihood
          detail: Probability over the next 12-18 months based on current public evidence.
        - label: Impact
          detail: Consequence for underwriting if the risk materializes.
        - label: Mitigation maturity
          detail: How much public evidence currently shows a concrete mitigation.
        - label: Residual exposure
          detail: Net risk after considering the limited visible mitigations.
      rows:
        - label: Pre-product execution
          note: Public sources still describe humans& as pre-product or research-only.
          values: [High, Critical, Low, Critical]
        - label: Compute and capital squeeze
          note: Training a new model competes directly with larger labs for scarce resources.
          values: [High, High, Medium, High]
        - label: Incumbent bundle pressure
          note: Collaboration and multi-agent features are already being embedded into existing suites.
          values: [High, High, Low, High]
        - label: Safety and governance gap
          note: Frontier-AI risk categories are visible, but the company's public control stack is not.
          values: [Medium, High, Low, High]
        - label: Key-person concentration
          note: Public governance evidence is still thin relative to the size of the round.
          values: [Medium, Medium, Low, Medium]
        - label: Acquisition and talent pressure
          note: Strategic acquirer interest and frontier-lab competition can disrupt roadmap continuity.
          values: [Medium, Medium, Medium, Medium]
    approximationNotes: >-
      Ordinal matrix derived from sourced evidence; it is a prioritization aid,
      not a quantified loss model.
    claimRefs: [CR002, CR004, CR006, CR008, CR010, CR016]
callouts:
  - calloutType: risk
    title: Kill criteria before the next financing event
    body: >-
      Treat the thesis as broken if humans& still lacks an externally usable
      product or named production deployment after the stated launch window, if
      incumbents lock the collaboration layer inside bundled suites before humans&
      establishes a defensible wedge, or if compute access forces a downshift in
      model ambition.
    claimRefs: [CR010, CR012, CR015, CR016]
  - calloutType: insight
    title: Fastest de-risking evidence
    body: >-
      The quickest upgrade would be a working product tied to named design
      partners, plus disclosed privacy and model-governance materials and a
      governance package that broadens visible control beyond a single founding
      executive.
    claimRefs: [CR002, CR006, CR009, CR014]
