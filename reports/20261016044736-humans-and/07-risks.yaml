      - ["Collaboration distribution layer", "Anthropic, Google, OpenAI, and other incumbent suites", "Controls where enterprise users already collaborate and where multi-agent workflow features can be bundled", "High", "Incumbents make the collaboration layer a bundled feature before humans& establishes a wedge", "High", "A differentiated social-intelligence model could still carve out a niche if it ships fast", "High"]
      - ["Founding researchers and executives", "Core founding team", "Holds the technical roadmap, recruiting narrative, and much of the external credibility behind the round", "High", "Talent loss, governance conflict, or acquisition pressure slows the roadmap and weakens fundraising leverage", "Medium-High", "Strong investor syndicate can help recruit and retain, but the public evidence does not show a broader bench yet", "Medium-High"]
