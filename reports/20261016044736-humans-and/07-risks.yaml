      - ["Compute and capital squeeze while training a new frontier model", "High", "High", "Medium", "High", "TechCrunch and Built In both frame the model path as expensive and resource-intensive", "No public disclosure of compute partners, cost structure, or runway assumptions"]
      - ["Safety / cyber / privacy failure from multi-agent, long-horizon workflows", "Medium", "High", "Low", "High", "Frontier-AI literature flags autonomy, concentration, misuse, and cybersecurity risks for agentic systems", "No public evaluation, privacy, or incident-response materials surfaced in the assigned evidence"]
      - ["Collaboration thesis collapses into ordinary automation and role compression", "High", "High", "Low", "High", "Independent commentary argues enterprise AI incentives still skew toward efficiency and headcount leverage", "Need customer evidence showing augmentation outcomes rather than surveillance or labor replacement"]
    notes: >-
      Residual exposure reflects what is supported by public evidence now, not
      management's private roadmap; low mitigation maturity means the assigned
      sources do not yet show operating proof or disclosed controls.
    claimRefs: [CR002, CR004, CR006, CR008, CR013, CR014]
