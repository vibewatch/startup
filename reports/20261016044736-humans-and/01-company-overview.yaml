    - Ask whether any compute supply, credits, or GTM relationship accompanies the check.
  - - Jeff Bezos
    - Individual investor
    - High-signal outside capital that may improve fundraising leverage.
    - Named in official and independent financing coverage; role beyond capital is not disclosed.
    - Clarify information rights and likely follow-on participation.
  - - GV
    - Institutional investor
    - Connects the company to a major AI ecosystem and distribution network.
    - Appears in official and media investor lists, but no board seat is public.
    - Confirm governance rights, pro-rata rights, and any strategic partnership terms.
  - - Emerson Collective
    - Institutional investor
    - Broadens the syndicate beyond pure infrastructure or AI-specialist capital.
    - Named among investors in the official launch materials and financing recaps.
    - Confirm check size, rights, and whether the investor has board observation rights.
  - - Eric Zelikman
    - Officer of record
    - Most concentrated publicly disclosed internal control point because the filing lists CEO, CFO, and secretary roles together.
    - This is the clearest named operating authority in the current public record.
    - Request current org chart, board approvals matrix, and finance delegation.
