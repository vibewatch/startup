callouts:
- calloutType: strength
  title: Pedigree and capital arrived before commercial disclosure
  body: The public record already supports unusual founder-market fit and financing depth for a seed-stage AI lab, with five named founders from frontier organizations and a disclosed $480 million round. That gives humans& material runway and strategic signal before it has had to disclose a mature commercial surface.
  claimRefs:
  - CO002
  - CO005
  - CO007
  - CO008
- calloutType: risk
  title: Governance and commercial proof are still mostly private
  body: Current sources still do not surface board composition, cap-table terms, pricing, revenue, or customer proof, while the filing-derived officer record concentrates the clearest disclosed authority in Eric Zelikman. That combination makes underwriting difficult despite the quality of the founding team and investor roster.
  claimRefs:
  - CO011
  - CO013
  - CO014
