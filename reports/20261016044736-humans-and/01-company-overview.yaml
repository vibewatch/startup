  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: Current customer list, pricing model, revenue or ARR, and evidence of live production deployments.
    whyItMatters: These metrics are required to judge whether the seed valuation rests on early commercialization or only on founder pedigree and financing momentum.
    diligencePath: Request a management data room pack with customer references, pipeline conversion, pricing sheets, and monthly revenue history.
  - type: private-evidence-only
    severity: material
    topic: board-disclosure
    missingEvidence: Board composition, cap-table ownership, investor rights, liquidation preferences, and any delegation matrix below the founders.
    whyItMatters: Governance structure determines who controls hiring, financing, follow-on rounds, and downside protection despite the impressive investor roster.
    diligencePath: Obtain the cap table, financing documents, and current board deck or bylaws summary from counsel or management.
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A current headcount and functional org chart beyond the January 2026 launch-era employee figure.
    whyItMatters: The only personnel-scale datapoint in the assigned sources is historical, which limits confidence in current operating capacity.
    diligencePath: Ask management for current employee count by function, hiring pace, and any major leadership additions since launch.
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A complete cap table and board roster covering the broader seed syndicate, economics, and governance rights behind the named investors.
    whyItMatters: The stakeholder table can only show publicly named participants, not who controls the company or how much dilution and preference overhang exists.
    diligencePath: Request the full financing summary, cap table, and board observer list from management or lead counsel.
    relatedTableRefs:
    - TO003
