  rows:
  - - Andi Peng
    - Co-founder
    - TechCrunch and TechFundingNews describe Peng as a former Anthropic researcher who worked on reinforcement learning and post-training for Claude models.
    - Anchors post-training, alignment, and model-behavior expertise relevant to the company thesis.
    - High until a fuller operating bench is disclosed.
  - - Georges Harik
    - 'Co-founder; Google employee #7'
    - Independent coverage ties Harik to Google's earliest ad systems, while the company says the seed round was led by SV Angel and co-founder Georges Harik.
    - Adds early-internet operating experience plus investor-network credibility.
    - Medium-high because public sources do not show delegated commercial leadership.
  - - Eric Zelikman
    - Co-founder; filing-named CEO/CFO/Secretary
    - TechFundingNews calls Zelikman an ex-xAI researcher; the filing-derived registry page lists him in all three officer roles.
    - Combines research pedigree with the clearest public operating authority.
    - Very high because multiple disclosed officer functions sit with one founder.
  - - Yuchen He
    - Co-founder
    - TechCrunch and TechFundingNews both list He among the former xAI researchers on the founding team.
    - Extends frontier-model engineering depth within the founding cohort.
    - Medium because no separate public operating remit is disclosed.
  - - Noah Goodman
    - Co-founder; Stanford professor
    - TechCrunch names Goodman as a Stanford professor, and Google Research hosts the 2022 STaR paper listing Noah D. Goodman as a coauthor.
    - Adds published cognition / reasoning research credibility to the lab narrative.
    - Medium because governance and product ownership remain undisclosed.
