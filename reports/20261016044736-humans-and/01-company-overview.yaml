company:
  name: humans&
chapter:
  number: 1
  title: Company Overview
  summary: humans& entered the public record in late 2025 and early 2026 as a seed-stage frontier AI lab with elite founder pedigree and a disclosed $480 million seed round at a $4.48 billion valuation. The company and independent coverage align on a human-collaboration thesis, but current public evidence still leaves live product status, customers, revenue, pricing, and governance terms largely private.
sections:
- id: identity-and-stage
  title: Identity and stage
  body: 'humans& presents itself as a "human-centric frontier AI lab" building systems that help people understand one another, collaborate, and work together rather than simply replacing labor. Independent January 2026 coverage matches that framing and shows the company reached the public market unusually early with seed-stage branding but late-stage capital intensity: multiple outlets reported a $480 million seed round at a $4.48 billion valuation. The legal footprint is more concrete than the operating one: a California-linked filing record says Humans& Ai, Inc. was filed on October 27, 2025, is active, and lists a Redwood City address, while media shorthand places the company in the broader San Francisco/Bay Area ecosystem.'
  claimRefs:
  - CO001
  - CO002
  - CO004
  - CO014
  tableRefs:
  - TO001
- id: founders-and-governance
  title: Founders, leadership, and governance
  body: 'Independent launch coverage consistently names five founders: Andi Peng, Georges Harik, Eric Zelikman, Yuchen He, and Noah Goodman. Official positioning stresses experience across xAI, Anthropic, Google DeepMind, OpenAI, Meta, AI2, Stanford, and MIT rather than a detailed org chart, which supports strong founder-market fit but leaves current reporting lines opaque. The filing-derived public officer record is concentrated: Eric Zelikman is listed as chief executive officer, chief financial officer, and secretary. Noah Goodman''s published STaR research record adds visible academic credibility, but the assigned source set does not surface a board roster, delegated finance controls, or other governance detail that would reduce key-person risk.'
  claimRefs:
  - CO005
  - CO007
  - CO008
  - CO011
  - CO014
  tableRefs:
  - TO002
- id: capital-base-and-stakeholders
  title: Capital base and stakeholder map
  body: 'The company''s own site and third-party funding coverage align that humans& raised a very large seed round led by SV Angel and co-founder Georges Harik, with named backing from Nvidia, Jeff Bezos, GV, Emerson Collective, and a broader syndicate. That investor set matters beyond headline signaling because it implies access to both follow-on capital and relationships that could matter for talent, infrastructure, and distribution. At the same time, the public record still stops at named backers rather than economics: the reviewed sources do not disclose ownership percentages, board seats, liquidation preferences, or other control provisions, so the stakeholder picture is directionally strong but not yet underwritable on governance terms alone.'
  claimRefs:
  - CO002
  - CO003
  - CO011
  - CO014
  tableRefs:
  - TO003
- id: milestones-and-open-issues
  title: Milestones and open diligence issues
  body: 'The dated public trail is short but telling: a 2022 research paper connects founder Noah Goodman to published reasoning work, the company filing appears in October 2025, and by January 2026 humans& was already announcing one of the largest seed rounds in AI while describing a product vision centered on collaboration and memory-rich interaction. What remains missing is just as important as what is present. Current sources in this pool still do not disclose revenue, pricing, current customers, or a named board, and the only headcount datapoint is launch-era. That disclosure gap matters more because frontier-model companies operate against a backdrop of persistent compute, power, and data-center constraints, which raises the execution bar for any research-heavy lab trying to convert pedigree and financing into an enduring product business.'
  claimRefs:
  - CO009
  - CO010
  - CO012
  - CO013
  - CO014
  figureRefs:
  - FO001
