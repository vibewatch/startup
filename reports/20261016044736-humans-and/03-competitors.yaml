figures:
  - id: "FP001"
    title: "Competitive positioning map"
    type: "quadrant"
    summary: >-
      Assigned evidence places humans& near direct frontier-lab peers on narrative differentiation
      but below incumbents and shipped workflow products on commercialization and distribution.
    data:
      xAxis:
        label: "Commercialization maturity (1-5 ordinal)"
        min: 1
        max: 5
        low: "concept / undisclosed"
        high: "shipped and deployed"
        description: >-
          Ordinal score from the assigned evidence: 1 means pre-product or undisclosed commercialization,
          while 5 means public product availability with deployment evidence.
      yAxis:
        label: "Distribution / purchase leverage (1-5 ordinal)"
        min: 1
        max: 5
        low: "limited"
        high: "embedded channel or active enterprise adoption"
        description: >-
          Ordinal score from the assigned evidence: 1 means no disclosed installed base, while 5 means
          large embedded distribution or active enterprise deal flow.
      points:
        - label: "humans&"
          x: 1
          y: 2
          detail: >-
            Collaborative-reasoning thesis and a large seed round are public, but assigned evidence still
            lacks public pricing, named customers, or live product access.
          claimRefs: ["CP001", "CP004", "CP012"]
        - label: "Thinking Machines Lab"
          x: 3
          y: 2
          detail: >-
            Raised about $2B, was last valued at $12B, and launched Tinker in October; broader
            distribution proof remains limited in the assigned pool.
          claimRefs: ["CP005"]
        - label: "Google DeepMind"
          x: 4
          y: 5
          detail: >-
            Tracxn lists Google DeepMind as a top competitor, and humans& is competing against
            alternatives tied to incumbent software and model ecosystems.
          claimRefs: ["CP003", "CP007"]
        - label: "OpenAI / Anthropic"
          x: 4
          y: 4
          detail: >-
            AI Market Watch names these labs as main competitors, and the collaboration thesis is being
            defined relative to foundation-model incumbents rather than outside them.
          claimRefs: ["CP002", "CP006"]
        - label: "Sierra / workflow agents"
          x: 4
          y: 3
          detail: >-
            Workflow vendors can sell outcomes-based automation into specific functions instead of asking
            buyers to underwrite frontier-lab optionality.
          claimRefs: ["CP010", "CP011"]
        - label: "Internal build / status quo"
          x: 3
          y: 4
          detail: >-
            Enterprises already expand embedded GenAI and agentic workflows inside current software, even
            while many still struggle to prove tangible AI value.
          claimRefs: ["CP008", "CP009"]
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores authored from the assigned pool, not measured market
      shares or benchmark outputs.
    claimRefs: ["CP001", "CP005", "CP007", "CP008", "CP009", "CP011", "CP012"]
callouts:
  - calloutType: "insight"
    title: "The current moat is conceptual before it is commercial"
    body: >-
      Assigned evidence consistently describes a distinctive human-collaboration thesis, but not an equally
      mature public product or commercial motion.
    claimRefs: ["CP001", "CP006", "CP012"]
  - calloutType: "risk"
    title: "Incumbent distribution can compress the window for differentiation"
    body: >-
      humans& is competing against incumbents and workflow agents that already control the software surfaces
      where AI spending and adoption are actually happening.
    claimRefs: ["CP007", "CP008", "CP011"]
  - calloutType: "recommendation"
    title: "Next diligence should focus on customer proof and pricing, not branding"
    body: >-
      Public customer references, live product access, and contract structure are the missing evidence that
      would show whether humans& has real switching-cost leverage.
    claimRefs: ["CP012", "CP014"]
