  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: downside-protection
      missingEvidence: Specific board seats, liquidation preferences, pro rata rights, dilution, and any secondary pricing or internal marks.
      whyItMatters: Those terms determine downside protection and can change expected returns materially even if the headline valuation is unchanged.
      diligencePath: Request the current cap table, term sheet, board roster, and any later financing or secondary documentation.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: commercial-proof
      missingEvidence: Named customers, pricing, contracted revenue, usage or retention cohorts, and gross-margin evidence.
      whyItMatters: Without commercial proof, investors cannot test whether the current valuation reflects product-market fit or only founder and market narrative.
      diligencePath: Request a customer reference list, booked ARR or revenue bridge, cohort retention, and product-usage dashboards.
    - type: missing-source
      severity: material
      topic: follow-on-valuation
      missingEvidence: Any disclosed follow-on round, mark, or third-party valuation update after the January 2026 seed.
      whyItMatters: A later market-clearing data point would help confirm whether the headline seed valuation has held, expanded, or reset.
      diligencePath: Ask management for updated financing history, board-approved marks, or secondary transaction data since the seed round.
