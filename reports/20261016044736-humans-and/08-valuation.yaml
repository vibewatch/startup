      - Side
      - Argument
      - What would change the view
    rows:
      - [
          "Thesis",
          "The founding team and investor syndicate are strong enough to win more time and capital in a market still rewarding frontier AI scarcity.",
          "Upgrade if later evidence shows customer adoption or a follow-on round priced on operating proof rather than reputation."
        ]
      - [
          "Thesis",
          "A $480 million seed gives humans& unusual balance-sheet room to recruit, train models, and iterate toward a defensible platform.",
          "This gets stronger if management shows compute access, hiring leverage, and milestone pacing that convert capital into shipped product."
        ]
      - [
          "Thesis",
          "Sector capital concentration means a breakout collaboration platform could still justify a premium multiple if it becomes a category winner.",
          "The case improves if the company can show buyers, usage depth, or benchmarked product performance."
        ]
      - [
          "Anti-thesis",
          "Public evidence still does not disclose revenue, ARR, customer count, or retention, so the current mark is not grounded in observable commercial proof.",
          "This concern falls if investors receive verified operating metrics and those metrics are consistent with frontier-scale valuation."
        ]
      - [
          "Anti-thesis",
          "Independent sector sources say AI spending is real but still led by vendors and hyperscalers, which can leave application-layer adoption behind narrative valuations.",
          "The risk falls if enterprise demand converts into named deployments and repeat expansion for humans& specifically."
        ]
      - [
          "Anti-thesis",
          "Public sources do not disclose the board, preference stack, dilution, or any secondary pricing, so downside protection at entry is unclear.",
          "The view improves if cap-table terms and later marks show investor protections and no hidden reset."
        ]
    notes: >-
      Arguments are valuation-sensitive and assume no undisclosed commercial or
      governance support beyond the retained public record.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV010, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [
          "Bull",
          "Product launches, named enterprise adoption appears, and the next round or strategic mark is set on clear commercial milestones.",
          "The $4.48B seed entry can still work if humans& becomes a scarce frontier platform rather than a research lab with limited revenue proof.",
          "Execution on go-to-market and model differentiation must happen before sentiment cools.",
          "Would require new external evidence on customers, pricing, and product usage."
        ]
      - [
          "Base",
          "Team quality and capital remain strengths, but public commercialization proof stays thin through the next diligence cycle.",
          "Current mark remains stretched; the right move is to track or negotiate only after evidence or price improves.",
          "Opportunity cost, dilution, and preference overhang become more important than upside optionality.",
          "Best fit with the retained source set today."
        ]
      - [
          "Bear",
          "Commercial launch slips, enterprise demand is slower than AI funding headlines imply, and later financings reprice the business.",
          "A down-round or flat round would impair returns because the entry case already assumes significant future success.",
          "Multiple compression, customer proof delays, and hidden term-sheet protections could all hurt new investors.",
          "Supported by missing KPI disclosure plus mixed sector-demand evidence."
        ]
    notes: >-
      These scenarios are qualitative because retained public sources do not
      disclose revenue, margins, customer cohorts, or preference terms.
    claimRefs: [CV004, CV006, CV008, CV010, CV012, CV013, CV014]
