callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Research more: the price may be defensible for a breakout frontier winner,
      but retained public evidence is still too thin on commercialization and
      downside terms to justify underwriting the January 2026 mark.
    claimRefs: [CV001, CV012, CV013, CV014]
  - calloutType: risk
    title: What can break the thesis
    body: >-
      The fastest route to a broken thesis is a mismatch between frontier-lab
      narrative and actual customer adoption, especially if the next financing
      arrives before revenue or usage proof becomes visible.
    claimRefs: [CV004, CV008, CV010, CV012, CV013]
  - calloutType: assumption
    title: What would move the call
    body: >-
      A later mark supported by named customers, pricing evidence, and disclosed
      governance terms would improve the risk-adjusted view more than generic AI
      market optimism alone.
    claimRefs: [CV005, CV012, CV014]
