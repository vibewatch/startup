evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: Current customer list, pricing model, revenue or ARR, and evidence of live production deployments.
    whyItMatters: >-
      These metrics are required to judge whether the seed valuation rests on early commercialization or only on founder
      pedigree and financing momentum.
    diligencePath: >-
      Request a management data room pack with customer references, pipeline conversion, pricing sheets, and monthly
      revenue history.
  - type: private-evidence-only
    severity: material
    topic: board-disclosure
    missingEvidence: >-
      Board composition, cap-table ownership, investor rights, liquidation preferences, and any delegation matrix below
      the founders.
    whyItMatters: >-
      Governance structure determines who controls hiring, financing, follow-on rounds, and downside protection despite
      the impressive investor roster.
    diligencePath: Obtain the cap table, financing documents, and current board deck or bylaws summary from counsel or management.
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A current headcount and functional org chart beyond the January 2026 launch-era employee figure.
    whyItMatters: >-
      The only personnel-scale datapoint in the assigned sources is historical, which limits confidence in current
      operating capacity.
    diligencePath: >-
      Ask management for current employee count by function, hiring pace, and any major leadership additions since
      launch.
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      A complete cap table and board roster covering the broader seed syndicate, economics, and governance rights behind
      the named investors.
    whyItMatters: >-
      The stakeholder table can only show publicly named participants, not who controls the company or how much dilution
      and preference overhang exists.
    diligencePath: Request the full financing summary, cap table, and board observer list from management or lead counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: buyer-proof
    missingEvidence: >-
      Named customers, procurement records, case studies, or budget disclosures showing who buys humans& and which line
      item pays.
    whyItMatters: >-
      Buyer identity and budget ownership determine whether the product competes for collaboration seats, AI platform
      budgets, or consumer subscriptions.
    diligencePath: >-
      Request customer references, live deployments, and any procurement or pricing materials before using the broad AI
      market to underwrite adoption.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Public pricing, packaging, launch, or revenue data that would let the chapter convert external AI market lenses
      into a defensible SAM or SOM.
    whyItMatters: >-
      Without a company-specific monetization path, broad AI spending figures can only frame context and cannot justify
      a serviceable market for humans&.
    diligencePath: >-
      Obtain current product roadmap, pricing hypotheses, pipeline segmentation, and any bottom-up revenue build used
      internally.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: product-readiness
    missingEvidence: >-
      A current public product surface, launch date, or usage evidence showing whether humans& has moved beyond
      pre-launch positioning.
    whyItMatters: Adoption timing, switching cost, and buyer urgency all depend on what is actually shipped and who is using it.
    diligencePath: >-
      Verify the current product state through launch materials, documentation, demos, pricing pages, or named reference
      customers.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercial-proof-gap
    missingEvidence: Public or diligence-room evidence for humans& pricing, contract structure, and live product access.
    whyItMatters: >-
      Without packaging and product evidence, it is hard to compare humans& against workflow substitutes or to estimate
      buyer willingness to switch from incumbents.
    diligencePath: >-
      Request current product demo access, pricing sheets, contract templates, and any public or customer-shareable
      launch materials.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
