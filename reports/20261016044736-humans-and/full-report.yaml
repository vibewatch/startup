    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports category demand and product framing, but not named deployment or expansion proof for
      humans&.
    data:
      items:
        - label: Category interest exists
          detail: Gartner and Microsoft both show enterprises increasing AI and agent activity.
          tone: positive
          touchpoints:
