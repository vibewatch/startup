        blocks:
          - type: paragraph
            body: >-
              The company's own site and third-party funding coverage align that humans& raised a very large seed round
              led by SV Angel and co-founder Georges Harik, with named backing from Nvidia, Jeff Bezos, GV, Emerson
              Collective, and a broader syndicate. That investor set matters beyond headline signaling because it
              implies access to both follow-on capital and relationships that could matter for talent, infrastructure,
