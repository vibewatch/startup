        title: Category demand is visible, but company-specific adoption proof is not
        blocks:
          - type: paragraph
            body: >-
              The broader 2026 market backdrop is constructive. Gartner forecasts sharp AI spending growth and
              explicitly says enterprise demand, not only hyperscaler buildout, should inflect in 2026. Microsoft's Work
              Trend Index similarly reports meaningful employee-level value from AI and rapid growth in active agents
              inside enterprise software environments. IEEE's summary of the 2026 AI Index adds evidence that private
              capital and model development remain abundant. Even so, these category signals do not verify that humans&
              has converted interest into production deployments. Gartner cautions that enterprises still prefer
              tactical ROI and IEEE notes benchmark gains may not map cleanly into real workflows, so humans& still
              needs customer evidence beyond a strong market narrative.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU008
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
              - CU012
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration remain underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The core underwriting problem in this chapter is not demand; it is durability. None of the assigned
              company-specific sources discloses customer count, active deployments, contract length, renewal behavior,
              or concentration by account or channel. That means land-and-expand remains a hypothesis rather than a
              demonstrated motion. The adverse evidence in the pool is also directionally important: Forbes describes
              aggressive competition for project leads, sales talent, and relationship managers in the human-data and
              frontier-model ecosystem, with contracts that can reach very large values. For humans&, that raises the
              risk that even if early interest exists, scaling enterprise demand could still bottleneck on
              customer-facing execution capacity before durable recurring adoption is visible.
            claimRefs:
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Category pull is stronger than company proof
            body: >-
              The customer story currently relies more on external evidence that enterprises are adopting agentic AI
              than on direct proof that humans& has translated that demand into named production accounts.
            calloutType: insight
            claimRefs:
              - CU005
              - CU007
              - CU013
          - type: callout
            title: Durability cannot yet be underwritten from public evidence
            body: >-
              Without customer count, deployment, renewal, or concentration disclosure, the chapter cannot verify
              whether humans& has a repeatable land-and-expand motion or only strong financing and category timing.
            calloutType: risk
            claimRefs:
              - CU003
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The core underwriting problem is not a hidden scandal; it is that the public narrative is still mostly a
              capital-and-pedigree story. Multiple sources agree humans& raised an unusually large seed round at a
              valuation that already assumes category creation, yet public coverage also still describes the company as
              pre-product or research-only. That combination makes the top risk straightforward: if humans& does not
              convert founder pedigree and technical ambition into externally visible product proof, the current
              valuation has little room for ordinary frontier-model delays. The heatmap and operating register therefore
              rank pre-product execution, compute intensity, incumbent bundle pressure, and safety-governance maturity
              above narrower legal events that have not yet surfaced publicly.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR008
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR008
              - CR010
              - CR016
      - number: '7.2'
        title: Regulatory, governance, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              humans& is framing itself around multi-agent, long-horizon, memory-rich AI for communication and
              collaboration, which pulls the company toward the governance questions already flagged in frontier-AI
              policy literature: autonomy, concentration of power, misuse, and cybersecurity. The assigned evidence does
              not surface a disclosed trust center, model-evaluation program, privacy architecture, or
              incident-reporting process, so the public record does not yet show how the company intends to
              operationalize those controls. Public entity evidence is also thin: a registry-derived extract shows the
              CEO simultaneously listed as CEO, CFO, and Secretary, which does not prove weak governance but does
              highlight how little institutional scaffolding is visible from outside.
            claimRefs:
              - CR003
              - CR006
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR011
      - number: '7.3'
        title: Operational and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The operating model compounds the governance uncertainty. TechCrunch and Built In both describe a product
              path that depends on training a new model, preserving user context, and supporting long-horizon
              interaction; that is a more capital-intensive and technically fragile route than layering workflow
              features onto existing models. Gartner's 2026 market view adds a structural risk: AI spending is still led
              by vendors and hyperscalers, while enterprises remain biased toward tactical efficiency gains rather than
              disruptive workflow redesign. At the same time, TechCrunch notes Anthropic, Google, and OpenAI are already
              pushing collaboration and multi-agent workflow features inside existing suites. That means humans& is
              exposed to both sides of the stack: upstream compute concentration and downstream distribution bundling.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR010
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: Monitoring indicators and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The most useful diligence posture is to demand concrete milestones rather than debate the philosophy of
              "human-centric" AI. The company reportedly planned to ship a first product within the year, and TechCrunch
              reported that strategic acquirers had already shown interest. Those facts create clear checkpoints. A
              positive path would show a live product, named production users, documented privacy and model-governance
              controls, and evidence that collaboration is creating customer value rather than simply another labor-
              compression tool. A negative path would show continued research-only status, dependence on scarce compute
              without differentiated distribution, or talent and acquisition pressure that interrupts the company's
              independent product roadmap.
            claimRefs:
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before the next financing event
            body: >-
              Treat the thesis as broken if humans& still lacks an externally usable product or named production
              deployment after the stated launch window, if incumbents lock the collaboration layer inside bundled
              suites before humans& establishes a defensible wedge, or if compute access forces a downshift in model
              ambition.
            calloutType: risk
            claimRefs:
              - CR010
              - CR012
              - CR015
              - CR016
          - type: callout
            title: Fastest de-risking evidence
            body: >-
              The quickest upgrade would be a working product tied to named design partners, plus disclosed privacy and
              model-governance materials and a governance package that broadens visible control beyond a single founding
              executive.
            calloutType: insight
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current public record points to a price-sensitive research-more recommendation rather than a clean buy
              call. Reuters and The SaaS News corroborate that humans& raised a $480 million seed at roughly a $4.48
              billion valuation in January 2026, which is an unusually large seed mark even in a hot AI market. Yet the
              same retained evidence set still offers no revenue, ARR, customer-count, or retention disclosure, and
              Reuters framed the company as still expecting a product launch early in 2026 rather than documenting
              scaled commercial adoption. That combination leaves the investment case leaning on team quality, access to
              capital, and market optionality more than on proven monetization, so public evidence does not support
              paying the last disclosed mark without more diligence or a meaningfully better entry. 
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing context and comparables
        blocks:
          - type: paragraph
            body: >-
              The financing backdrop explains why humans& could command a frontier-style seed price, but it does not by
              itself prove that the price is attractive. Gartner forecast worldwide AI spending would reach $2.595667
              trillion in 2026, up 47 percent year over year, while warning that spending is still dominated by vendors
              and hyperscalers and that enterprises have not yet fully flexed demand. IEEE Spectrum separately reported
              that 2025 AI investment topped $581 billion, more than double 2024, and Feed the AI described 2026 funding
              as concentrating into a small set of frontier and infrastructure winners. Those conditions help explain
              why an elite ex-OpenAI/xAI/Google team could raise quickly, but they also imply that market sentiment is
              doing a meaningful amount of valuation work. As a rough public reference, CoreWeave's October 2026 market
              capitalization of $38.43 billion is about 8.6 times humans&'s last disclosed private mark, underscoring
              both the upside ambition and the large proof gap between a public AI company and a pre-scale private lab.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios, valuation stance, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires humans& to convert frontier talent and a very large seed balance into shipped
              product, credible enterprise adoption, and a next financing that clears or exceeds the current mark on
              operating proof rather than narrative alone. The base case is narrower: the company continues to attract
              talent and capital, but outside investors still lack public evidence on customer traction, repeat usage,
              unit economics, and downside-protection terms, leaving the current mark stretched rather than clearly
              broken. The bear case is that commercialization slips while AI multiples compress and large customers slow
              real deployment, producing a down-round or a long period where the company is valuable strategically but
              not underwriteable financially. Before moving off research-more, an investor should request named
              production customers, cohort or pipeline evidence, revenue and gross-margin detail, board and
              preference-stack terms, and any later marks or secondary transactions that sharpen the downside case.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research more: the price may be defensible for a breakout frontier winner, but retained public evidence is
              still too thin on commercialization and downside terms to justify underwriting the January 2026 mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
          - type: callout
            title: What can break the thesis
            body: >-
              The fastest route to a broken thesis is a mismatch between frontier-lab narrative and actual customer
              adoption, especially if the next financing arrives before revenue or usage proof becomes visible.
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV012
              - CV013
          - type: callout
            title: What would move the call
            body: >-
              A later mark supported by named customers, pricing evidence, and disclosed governance terms would improve
              the risk-adjusted view more than generic AI market optimism alone.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV012
              - CV014
