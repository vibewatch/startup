chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and stage
        blocks:
          - type: paragraph
            body: >-
              humans& presents itself as a "human-centric frontier AI lab" building systems that help people understand
              one another, collaborate, and work together rather than simply replacing labor. Independent January 2026
              coverage matches that framing and shows the company reached the public market unusually early with
              seed-stage branding but late-stage capital intensity: multiple outlets reported a $480 million seed round
              at a $4.48 billion valuation. The legal footprint is more concrete than the operating one: a
              California-linked filing record says Humans& Ai, Inc. was filed on October 27, 2025, is active, and lists
              a Redwood City address, while media shorthand places the company in the broader San Francisco/Bay Area
              ecosystem.
