      - number: '1.4'
        title: Milestones and open diligence issues
        blocks:
          - type: paragraph
            body: >-
              The dated public trail is short but telling: a 2022 research paper connects founder Noah Goodman to
              published reasoning work, the company filing appears in October 2025, and by January 2026 humans& was
              already announcing one of the largest seed rounds in AI while describing a product vision centered on
              collaboration and memory-rich interaction. What remains missing is just as important as what is present.
              Current sources in this pool still do not disclose revenue, pricing, current customers, or a named board,
              and the only headcount datapoint is launch-era. That disclosure gap matters more because frontier-model
              companies operate against a backdrop of persistent compute, power, and data-center constraints, which
              raises the execution bar for any research-heavy lab trying to convert pedigree and financing into an
              enduring product business.
