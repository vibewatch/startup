  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer logic
        blocks:
          - type: paragraph
            body: >-
              The current public record puts humans& in a narrower category than the multi-trillion-dollar "AI market"
              headline suggests. Independent summaries consistently describe the company as building human-centric
              software for collaboration, communication, search, and coordination, rather than selling raw compute or a
              general infrastructure layer. That matters because the closest commercial boundary is application and
              workflow software for knowledge work, even if the enabling model and infrastructure ecosystem is much
              larger. The buyer path also appears staged rather than settled: broad public descriptions point to
              enterprise and consumer possibilities, but observable budget ownership is still most consistent with CIO,
              CTO, or functional software leaders who can sponsor collaboration tooling before a broader platform
              standard emerges.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
              - CM016
