      - number: '2.3'
        title: Adoption drivers, constraints, and remaining diligence work
        blocks:
          - type: paragraph
            body: >-
              The near-term adoption case is credible but conditional. Deloitte's forecast that a quarter of GenAI-using
              enterprises will deploy AI agents in 2025 shows rising willingness to operationalize AI workflows, and
              IEEE's investment and compute figures show that capital is still pouring into the sector. However, Gartner
              says enterprises still prefer tactical efficiency gains and that CIOs struggle to prove business outcomes,
              which means budget release remains tied to measurable workflow value, trust, and integration rather than
              frontier-model novelty alone. Supply-side conditions also matter: Gartner's mix and Colliers' data-center
              data both show that power, build cost, and permitting have become real constraints on frontier-AI
              capacity. For humans&, the biggest underwriting gap is not whether AI is a large market; it is whether the
              company can prove a specific buyer, product surface, and pricing path inside that market before
              infrastructure-heavy competition resets expectations.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape extends beyond one startup cohort
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not support a narrow view of humans& as competing only with one or two seed-stage
              labs. Tracxn describes 1,339 active competitors and explicitly names Thinking Machines Lab, Google
              DeepMind, and Recursive among the top peers, while AI Market Watch lists OpenAI, Anthropic, and xAI as
              main competitors. That combination matters because it puts humans& into at least four buyer comparisons at
              once: direct frontier-research startups, incumbent foundation-model labs, workflow-specific AI
              applications, and the status quo of internal build plus embedded AI in existing software. The result is a
              market where humans& is not only defending a differentiated thesis; it is also competing against
              categories that already have more mature products, broader installed bases, or both.
