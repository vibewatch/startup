      - number: '5.3'
        title: The main product risk is execution under compute-heavy economics and limited trust proof
        blocks:
          - type: paragraph
            body: >-
              The product and technical risk is less about lack of ambition than about the order in which proof has to
              arrive. Retained coverage says most of the seed capital is going to compute and in-house model training,
              while Gartner's 2026 spending outlook says AI demand is still dominated by infrastructure providers and
              that enterprises mostly favor tactical efficiency gains over disruptive workflow change. IEEE Spectrum's
              summary of the 2026 AI Index adds that notable model releases remain heavily concentrated in industry and
              that world AI compute capacity has been growing at a very high rate since 2022. Taken together, those
              signals imply that humans& must fund a frontier-style technical stack before public evidence shows that a
              collaboration-first application can win distribution and trust.


              That sequencing raises three concrete diligence issues. First, there is still no retained public evidence
              of a shipped model, public API, open-weights release, or benchmark package. Second, the retained pool does
              not provide public trust artifacts such as security documentation, reliability disclosures, or compliance
              credentials. Third, the company still has to prove that augmentation-centered collaboration can create
              measurable enterprise value in a market that often rewards faster automation stories. The technical bet
              may be coherent, but the validation path remains open.
            claimRefs:
