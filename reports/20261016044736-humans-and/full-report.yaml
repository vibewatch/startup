      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is that humans& currently looks more like a capitalized frontier-AI research and
              product bet than a business with publicly visible unit economics. Coverage describes a company of roughly
              20 employees at funding time, building a new model and product simultaneously, and one source explicitly
              warns that training and scaling the model will require large sums of cash and competition for compute
              against incumbents. Another skeptical observation is that collaboration-oriented augmentation may still
              run into enterprise incentives that favor cost reduction over coordination quality. Those issues do not
              negate the opportunity, but they materially limit underwriting confidence because the public record still
              lacks revenue, customer, pricing, gross-margin, burn, runway, debt, and compute-obligation disclosures.
              The chapter therefore supports only a research-more posture until management can show launch economics,
              customer adoption, and capital-consumption discipline.
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI010
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface remains defined by workflow thesis rather than a launched SKU
        blocks:
          - type: paragraph
            body: >-
              The retained public record still describes humans& primarily through the workflow it wants to improve
              rather than through a generally available product. Across independent profiles and funding coverage, the
              company is described as building AI that helps people coordinate with one another rather than replacing
              them outright, with the first product repeatedly framed as a messaging- or collaboration-style
              application. That positioning matters because it is more specific than a generic frontier-model pitch: the
              company is not saying only that it will build a strong model, but that it wants the model to become
              connective tissue inside group work.


              The catch is maturity. The same retained sources also say the first product had not launched publicly as
              of spring and mid-2026, that the company was only a few months old when it announced the seed round, and
              that the disclosed surface is still mostly conceptual. For diligence purposes, that means the module map
              below should be treated as an early operating hypothesis rather than a production-proven SKU hierarchy.
              Public descriptions support the direction of travel, but not yet customer-visible evidence on adoption,
              reliability, pricing realization, or implementation depth.
            claimRefs:
