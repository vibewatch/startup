      - number: '4.2'
        title: Demand proxies and operating economics
        blocks:
          - type: paragraph
            body: >-
              The external demand backdrop is favorable: Gartner forecasts $2.59 trillion of worldwide AI spending in
              2026, up 47% year over year, while IDC says software and information services alone should spend $33
              billion on AI in 2024 and nearly $222 billion by 2028. That supports the existence of a large addressable
              budget pool, but it does not by itself validate humans&'s GTM motion. Deloitte’s 2026 work on
              human-machine interaction is the more relevant commercial proxy for this company’s thesis: most
              organizations still layer AI onto legacy processes, and ROI improves when work design changes alongside
              the model. That makes adoption for a collaboration-first AI product as much an implementation and workflow
              problem as a model-quality problem. Publicly, humans& still offers no usable sales-cycle, CAC, payback,
              conversion, or customer-count disclosures, and the finance function also appears thin in public filings,
              with Eric Zelikman listed as CEO, CFO, and secretary in a March 2026 filing extract.
