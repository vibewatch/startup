      - number: '3.3'
        title: Commercial alternatives already span shipped products, outcome pricing, and embedded suites
        blocks:
          - type: paragraph
            body: >-
              The strongest commercialization contrast in the pool is not between humans& and another stealth lab, but
              between humans& and alternatives with more concrete buying motions. Reuters reports that Thinking Machines
              Lab has already launched Tinker, a product for fine-tuning language models, while CNBC describes live
              customer-service agent vendors such as Sierra and Decagon selling into enterprises with outcome-linked or
              workflow-linked value propositions. Gartner also says enterprises are expanding use of GenAI models
              embedded in existing software applications, which reinforces the purchasing advantage of incumbent suites.
              By comparison, the assigned humans& evidence emphasizes research direction and use of funds rather than
              public SKU, packaging, or adoption proof, so buyers today have more ways to purchase AI than they have
              evidence to underwrite humans& specifically.
            claimRefs:
              - CP005
