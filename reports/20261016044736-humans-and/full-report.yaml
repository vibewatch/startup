      - number: '2.2'
        title: Sizing lenses and what they actually measure
        blocks:
          - type: paragraph
            body: >-
              Market sizing is available only through broad external lenses, not through a company-specific SAM or SOM.
              Gartner's 2026 forecast shows a global AI market of roughly $2.6 trillion, but that envelope is heavily
              shaped by infrastructure, services, and model spending rather than direct spend on collaboration
              applications. The narrower software and model figures are more relevant to humans&, and even those remain
              category lenses rather than a source-backed addressable revenue pool for this company. The evidence
              therefore supports a "large market with unresolved monetizable slice" conclusion, not a precise
              TAM/SAM/SOM stack. The figure below keeps the published numeric lenses visible while making clear that the
              layers are analytical buckets, not a computed conversion funnel.
            claimRefs:
              - CM004
