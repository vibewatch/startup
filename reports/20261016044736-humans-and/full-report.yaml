  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital base and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              The core public financial fact pattern is a January 2026 seed round of $480 million at a $4.48 billion
              valuation, backed by Nvidia, Jeff Bezos, SV Angel, GV, and Emerson Collective. That capital base is
              meaningful, but the current evidence still describes a company before commercial proof: public coverage
              said humans& still did not have a product and had not been clear about exactly what it would ship, even as
              it framed the target experience as a replacement for multiplayer communication or collaboration contexts.
              The company’s disclosed use of funds points to model and product development around multi-agent
              reinforcement learning, memory, long-horizon planning, and user-centered collaboration software, which is
              directionally helpful for understanding cost drivers but not enough to establish revenue mix, realized
              pricing, gross margin, or revenue recognition mechanics. In practical terms, the available evidence shows
              capital in and technical ambition out, but not a disclosed monetization engine yet.
