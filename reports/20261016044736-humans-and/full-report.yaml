      - number: '3.4'
        title: Moat durability remains the main unresolved question
        blocks:
          - type: paragraph
            body: >-
              The key debate is whether humans& is building a durable layer in the stack or only an appealing narrative
              around the current frontier-lab financing cycle. BCG says only 26% of companies have developed the
              capabilities needed to move beyond proofs of concept and 74% have yet to show tangible AI value, while
              CNBC documents that many AI interfaces still trap users in non-resolving loops. Those category signals
              matter because they imply buyers will reward measurable resolution, trust, and workflow fit rather than
              frontier-lab pedigree alone. Until humans& shows public customer adoption, pricing, or switching-cost
              evidence, the assigned pool supports a view of its moat as plausible but unproven, with incumbent
              distribution and better-specified substitutes still positioned to commoditize collaboration features if
              the company does not create a distinctly better human-agent experience.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
