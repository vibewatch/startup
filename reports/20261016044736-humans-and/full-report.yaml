      - number: '5.2'
        title: Public architecture is inferable at the layer level, not yet disclosed in implementation detail
        blocks:
          - type: paragraph
            body: >-
              The technical picture that emerges from the retained sources is a layered one: capital-intensive in-house
              model training, a reasoning and coordination layer oriented around long-horizon work, a memory and
              user-understanding layer, and then a collaboration-facing application surface. Public coverage names
              multi-agent reinforcement learning, memory, long-horizon planning, and user-centered product development
              as explicit areas of investment. Eric Zelikman's prior Quiet-STaR work adds real research pedigree around
              reasoning-oriented model training, but it does not substitute for a public system card, benchmark release,
              API reference, or architecture document for humans& itself.


              Differentiation today is therefore more legible in framing than in disclosed implementation. The company
              is clearly betting against the default autonomous-agent story, but peers are also moving toward
              collaboration language. Thinking Machines Lab, for example, says it is building multimodal systems that
              work with people collaboratively and explicitly commits to publish technical blog posts, papers, and code.
              Relative to that benchmark, humans& still presents a stronger public thesis than a public artifact trail.
              That does not invalidate the strategy, but it does keep technical diligence focused on what has not yet
              been disclosed.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
