      - number: '3.2'
        title: Differentiation is clearest in product thesis, not yet in go-to-market proof
        blocks:
          - type: paragraph
            body: >-
              Third-party descriptions are directionally consistent about what humans& is trying to be. AI Market Watch
              frames the company around collaborative reasoning, emotional intelligence, and workflows where AI supports
              people rather than replacing them, and AgentMarketCap argues that humans& is pursuing collaboration
              infrastructure instead of competing head-on on benchmark-driven foundation-model performance. That thesis
              is strategically legible, but the same assigned evidence also says the collaboration market is crowded
              with incumbents such as Microsoft Copilot, Google Workspace AI, and Notion AI, all of which start with
              existing user distribution. In practice, that means humans& can claim conceptual whitespace, yet still
              begins the commercialization race behind competitors that already control the surrounding workflow
              surface.
