      - number: '8.3'
        title: 情景、估值立场与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 humans&
              把前沿人才和规模很大的种子轮余额转化为已上线产品、可信的企业采用，以及一轮凭运营证明而非单纯叙事达到或超过当前估值的后续融资。基准情景更窄：公司继续吸引人才和资本，但外部投资者仍看不到客户增长、重复使用、单位经济性和下行保护条款的公开证据，因此当前估值显得偏高，却还不能说已经失效。悲观情景是商业化延迟，同时
              AI 倍数收缩、大客户放慢实际部署，最终出现 down-round，或公司在很长一段时间里具有战略价值，却无法进行财务投资判断。在不再“继续研究”之前，投资者应索取具名生产客户、cohort 或 pipeline
              证据、收入和毛利细节、董事会与优先权层级条款，以及任何能进一步刻画下行风险的后续估值或二级交易。
            claimRefs:
