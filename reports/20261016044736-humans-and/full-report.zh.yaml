          items:
            - label: 客户部署证明
            - label: 基准证据
            - label: 安全与合规披露
    approximationNotes: 这张分层图根据已保留的公开描述和研究引用推断而来，因为已分配来源池不包含公司发布的架构图。
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持品类需求和产品定位，但没有证明 humans& 已有具名部署或扩张。
    data:
      items:
        - label: 品类兴趣存在
          detail: Gartner 和 Microsoft 都显示企业正在增加 AI 和智能体活动。
          tone: positive
          touchpoints:
            - Gartner：2026 年是企业 AI 支出的拐点年。
            - Microsoft：活跃智能体同比增长 15x。
        - label: humans& 定位引发共鸣
          detail: 已保留的 2026 年 1 月公司报道始终将 humans& 定位为协作和以人为中心的工作。
          tone: positive
          touchpoints:
            - Crunchbase 和 The SaaS News 将其描述为协作型、以人为中心的 AI 定位。
            - VentureCapital 将这组产品称为沟通与协作工具。
        - label: 评估标准趋严
          detail: 买方仍需要工作流适配、治理能力和可量化的战术 ROI。
          tone: neutral
          touchpoints:
            - Gartner：组织偏好能带来渐进改善的战术型 AI 项目。
            - IEEE：基准分数可能无法说明产品是否适配真实工作流。
        - label: 试点证明未公开
          detail: 已分配证据没有列出 humans& 的设计合作伙伴、试点群体或试点结果。
          tone: risk
          touchpoints:
            - 已保留的公司特定来源中没有出现客户名称或试点数量。
        - label: 生产部署仍未验证
          detail: 没有披露部署数量、活跃用户数据或客户结果。
          tone: risk
          touchpoints:
            - 公开记录缺少客户数、使用量分母或部署量分母。
        - label: 扩张逻辑仍是假设
          detail: 品类采用可能支撑扩张，但 humans& 没有公开续约或客户集中度披露。
          tone: risk
          touchpoints:
            - Microsoft 显示企业智能体存在扩张潜力。
            - 来源池中仍没有发现 humans& 的公开 NRR、GRR、合同期限或头部客户披露。
    approximationNotes: 阶段顺序反映从品类需求到续约证明的证据推进，并非 humans& 的实际转化率。
    claimRefs:
      - CU005
      - CU006
      - CU008
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余敞口集中在产品推出前的执行、资本密集度、既有厂商套装产品压力，以及仍未披露的控制成熟度。
    data:
      columns:
        - label: 可能性
          detail: 基于当前公开证据，对未来 12-18 个月的概率判断。
        - label: 影响
          detail: 风险发生后对投资判断的影响。
        - label: 缓释成熟度
          detail: 当前有多少公开证据显示已有具体缓释措施。
        - label: 剩余敞口
          detail: 考虑有限的可见缓释措施后的净风险。
      rows:
        - label: 产品推出前执行
          note: 公开来源仍将 humans& 描述为产品推出前阶段或仅做研究。
          values:
            - 高
            - 严重
            - 低
            - 严重
        - label: 算力和资本挤压
          note: 训练新模型要直接与更大型实验室争夺稀缺资源。
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 既有厂商套装压力
          note: 协作和多智能体功能已经被嵌入现有软件套件。
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 安全与治理缺口
          note: 前沿 AI 的风险类别已经可见，但公司的公开控制栈并不可见。
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 关键人物集中度
          note: 相对于融资轮规模，公开治理证据仍然稀薄。
          values:
            - 中
            - 中
            - 低
            - 中
        - label: 收购和人才压力
          note: 战略收购方兴趣和前沿实验室竞争可能打乱路线图的连续性。
          values:
            - 中
            - 中
            - 中
            - 中
    approximationNotes: 该序数矩阵源自所引证据；它用于确定优先级，不是量化损失模型。
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR008
      - CR010
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐仍是继续研究，因为前沿趋势和充裕资本无法抵消披露入场价格下缺失的证明。
    data:
      nodes:
        - id: funding
          label: $480M 种子轮，估值 $4.48B
          note: 大额种子轮设定了溢价入场点。
        - id: market
          label: AI 资本仍然充裕
          note: 独立行业来源仍显示支出和融资非常强劲。
        - id: proof
          label: 商业证明仍然有限
          note: 已保留来源没有披露收入、客户数或留存。
        - id: governance
          label: 下行保护不清楚
          note: 没有公开的优先股堆叠、董事会或二级定价细节。
        - id: stance
          label: 估值偏高
          note: 价格跑在公开证明前面。
        - id: recommendation
          label: 继续研究
          note: 只有证明更充分或价格更合理时才上调判断。
      edges:
