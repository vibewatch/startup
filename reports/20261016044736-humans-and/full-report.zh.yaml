              - CO013
      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              独立的公司发布报道始终列出五位创始人：Andi Peng、Georges Harik、Eric Zelikman、Yuchen He 和 Noah Goodman。官方定位强调团队横跨
              xAI、Anthropic、Google DeepMind、OpenAI、Meta、AI2、Stanford 和 MIT
              的经历，而没有给出详细组织架构；这支持较强的创始人—市场匹配度，却让当前汇报关系仍然模糊。备案衍生的公开高管记录高度集中：Eric Zelikman 同时担任 chief executive
              officer、chief financial officer 和 secretary。Noah Goodman 已发表的 STaR
              研究记录增加了可见的学术可信度，但指定来源没有披露董事会名单、分工后的财务控制或其他能够降低关键人风险的治理细节。
