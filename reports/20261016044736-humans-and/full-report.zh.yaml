        title: 里程碑与待解决尽调问题
        blocks:
          - type: paragraph
            body: >-
              有日期的公开轨迹虽然短，却很能说明问题：2022 年的一篇研究论文将创始人 Noah Goodman 与已发表的推理研究联系起来，公司备案出现在 2025 年 10 月，到 2026 年 1 月，humans&
              已经宣布 AI
              领域规模最大的种子轮之一，同时将产品愿景聚焦于协作和富记忆交互。仍然缺失的信息与已经存在的信息同样重要。该来源池中的当前资料仍未披露收入、定价、现有客户或具名董事会，唯一的员工人数数据也来自发布初期。前沿模型公司长期受算力、电力和数据中心约束，这使得披露缺口更加关键：任何试图把创始人履历和融资转化为持久产品业务的研究型实验室，都面临更高的执行门槛。
