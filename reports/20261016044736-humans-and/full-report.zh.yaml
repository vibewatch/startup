      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 继续研究：作为脱颖而出的前沿 AI 赢家，这一价格或许可以辩护；但保留的公开证据在商业化和下行条款上仍过于稀薄，不足以支撑对 2026 年 1 月估值的投资判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
          - type: callout
            title: 什么会击穿论点
            body: 最快击穿论点的路径，是前沿实验室叙事与实际客户采用不匹配，尤其是下一轮融资在收入或使用证明出现之前到来。
            calloutType: risk
            claimRefs:
