      - number: '4.2'
        title: 需求代理指标与经营经济性
        blocks:
          - type: paragraph
            body: >-
              外部需求背景有利：Gartner 预测 2026 年全球 AI 支出为 $2.59 trillion，同比增长 47%；IDC 表示，仅软件和信息服务行业就将从 2024 年的 $33 billion AI
              支出增至 2028 年接近 $222 billion。这支持存在庞大可触达预算池，但不能单独验证 humans& 的 GTM 动作。Deloitte 2026
              年关于人机交互的研究是与公司理念更相关的商业代理指标：多数组织仍是在旧流程上叠加 AI，而只有工作设计与模型同步变化时，ROI 才会改善。因此，协作优先的 AI
              产品既是实施和工作流问题，也是模型质量问题。公开层面，humans& 仍未披露可用的销售周期、CAC、回本期、转化率或客户数；公开备案中的财务职能也显得单薄，2026 年 3 月的备案摘录将 Eric
              Zelikman 列为 CEO、CFO 和 secretary。
