  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方逻辑
        blocks:
          - type: paragraph
            body: >-
              当前公开记录显示，humans& 所处的细分市场比“数万亿美元 AI 市场”这一标题式市场口径
              更窄。独立摘要一致将公司描述为打造用于协作、沟通、搜索和协调的以人为中心的软件，而不是销售原始算力或通用基础设施层。这一点很重要，因为它最接近的商业边界是知识工作的应用和工作流软件，尽管底层模型与基础设施生态大得多。买方路径似乎也在分阶段形成，而非已经确定：公开描述同时指向企业和消费者可能性，但可观察到的预算归属仍最符合
              CIO、CTO 或职能软件负责人，他们可以在更广泛的平台标准出现前，为协作工具提供预算支持。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
              - CM016
