        title: 资本基础与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              公司官网和第三方融资报道相互印证：humans& 完成了一轮规模很大的种子融资，由 SV Angel 和联合创始人 Georges Harik 领投，Nvidia、Jeff Bezos、GV、Emerson
              Collective 及更广泛的投资者联合体出资。这个投资者组合的意义不止于标题式信号
              信号，因为它可能带来后续资本，以及对人才、基础设施和分销有价值的关系。但公开记录仍停留在出资方名单，没有披露经济条款：已审阅来源没有给出持股比例、董事席位、清算优先权或其他控制条款，因此利益相关方格局方向上很强，却还不足以仅凭治理条款完成投资判断。
