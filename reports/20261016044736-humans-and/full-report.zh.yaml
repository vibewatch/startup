chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与阶段
        blocks:
          - type: paragraph
            body: >-
              humans& 将自己定义为一家“以人为中心的前沿 AI 实验室”，打造帮助人们相互理解、协作和共同工作的系统，而不是简单取代劳动。2026 年 1
              月的独立报道与这一定位一致，也显示公司以种子阶段品牌却配以晚期资本强度，异常早地进入公众视野：多家媒体报道其完成 $480 million 种子轮融资，估值 $4.48
              billion。它的法律足迹比运营足迹更具体：与 California 相关的备案记录显示，Humans& Ai, Inc. 于 2025-10-27 成立，目前仍为存续状态，地址位于 Redwood
              City；媒体通常将其归入更广义的 San Francisco / Bay Area 生态。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO014
