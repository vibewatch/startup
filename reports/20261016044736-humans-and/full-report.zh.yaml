            body: >-
              公开财务事实的核心是：2026 年 1 月完成 $480 million 种子轮融资，估值 $4.48 billion，投资者包括 Nvidia、Jeff Bezos、SV Angel、GV 和 Emerson
              Collective。这一资本基础很有分量，但现有证据仍将公司描述为尚未完成商业验证：公开报道称 humans&
              仍没有产品，也没有明确说明究竟会交付什么，尽管它将目标体验描述为多人沟通或协作场景的替代方案。公司披露的资金用途指向围绕多 agent
              强化学习、记忆、长时段规划和以用户为中心的协作软件开展模型与产品开发；这有助于理解成本驱动，却不足以确定收入结构、实际定价、毛利率或收入确认机制。实际而言，现有证据只显示资本流入和技术野心，尚未显示已披露的变现引擎。
