      - number: '2.2'
        title: 市场规模视角及其实际衡量内容
        blocks:
          - type: paragraph
            body: >-
              市场规模只能通过宽泛的外部口径估算，而不能通过公司特定的 SAM 或 SOM 得出。Gartner 的 2026 年预测显示，全球 AI 市场约为 $2.6
              trillion，但这一总盘子主要由基础设施、服务和模型支出构成，而不是直接用于协作应用的支出。更窄的软件和模型数字与 humans&
              更相关，但它们仍是品类视角，并非有来源支持的、属于该公司的可触达收入池。因此，证据支持的是“市场很大，但可变现切片尚未厘清”，而不是一套精确的
              TAM/SAM/SOM。下图保留了已发布的数字口径，同时明确这些层级只是分析桶，并非计算出的转化漏斗。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
      - number: '2.3'
        title: 采用驱动、约束与剩余尽调工作
        blocks:
          - type: paragraph
            body: >-
              短期采用逻辑可信，但有条件。Deloitte 预测，2025 年四分之一使用 GenAI 的企业将部署 AI agents，说明将 AI 工作流投入实际运营的意愿正在上升；IEEE
              的投资和算力数据也显示，资本仍在涌入这一领域。不过，Gartner 表示企业仍偏好战术性效率提升，CIO
              也难以证明业务结果，因此预算释放仍取决于可量化的工作流价值、信任和集成，而不只是前沿模型的新颖性。供给侧条件同样重要：Gartner 的结构数据和 Colliers
              的数据中心数据都显示，电力、建设成本和许可已经成为前沿 AI 产能的现实约束。对 humans& 而言，最大的投资判断缺口不是 AI
              是否是大市场，而是公司能否在基础设施密集型竞争重置预期前，在这个市场里证明明确的买方、产品形态和定价路径。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局不止一个创业公司群体
        blocks:
          - type: paragraph
            body: >-
              指定来源池不支持把 humans& 简化为只与一两家种子轮实验室竞争。Tracxn 描述了 1,339 家活跃竞争者，并明确将 Thinking Machines Lab、Google DeepMind 和
              Recursive 列为主要同业；AI Market Watch 则将 OpenAI、Anthropic 和 xAI 列为主要竞争者。这一组合很重要，因为它同时把 humans&
              放进至少四种买方比较：直接的前沿研究创业公司、成熟的基础模型实验室、特定工作流 AI 应用，以及企业内部自建加现有软件内嵌 AI 的现状。结果是，humans&
              不仅要守住差异化论点，还要面对产品更成熟、安装基础更广，或两者兼具的品类。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
