  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 创始团队和投资人联合体足够强，可以在市场仍奖励前沿 AI 稀缺性的情况下争取更多时间和资本。
        - 如果后续证据显示客户采用，或后续融资以运营证明而非声誉定价，应上调判断。
      - - 正论
        - $480 million seed 融资让 humans& 获得了不同寻常的资产负债表空间，可以招聘、训练模型，并迭代出有防守力的平台。
        - 如果管理层展示算力接入、招聘杠杆和里程碑节奏，证明资本能够转化为已发布产品，这一论点会更强。
      - - 正向论点
        - 行业资本高度集中；如果协作平台成为品类赢家，即使估值倍数偏高，也仍可能有其合理性。
        - 如果公司能展示买方、使用深度或经基准测试的产品表现，投资逻辑会更扎实。
      - - 反向论点
        - 公开证据仍未披露收入、ARR、客户数或留存，因此当前估值没有建立在可观察的商业证明之上。
        - 如果投资人拿到经过核实的经营指标，且这些指标与前沿级估值相符，这项担忧会减轻。
      - - 反向论点
        - 独立行业来源称，AI 支出确实存在，但主导者仍是模型厂商和超大规模云厂商；这可能让应用层采用落后于叙事型估值。
        - 如果企业需求转化为明确客户部署，并在 humans& 身上带来重复扩张，这项风险会下降。
      - - 反向论点
        - 公开来源没有披露董事会、优先股堆叠、稀释情况或任何二级定价，因此入场时的下行保护并不清楚。
        - 如果股权表条款和后续估值显示投资人受到保护，且不存在隐藏的重置条款，判断会改善。
    notes: 这些论点对估值高度敏感，并假设除已保留的公开记录外，不存在未披露的商业或治理支持。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 产品上线、明确的企业采用出现，且下一轮融资或战略估值建立在清晰的商业里程碑之上。
        - 如果 humans& 成为稀缺的前沿平台，而不是收入证明有限的研究实验室，$4.48B 的种子轮入场估值仍可能成立。
        - 必须在市场情绪降温前完成市场拓展和模型差异化。
        - 需要新的外部证据，证明客户、定价和产品使用情况。
      - - 基准
        - 团队质量和资本仍是优势，但在下一轮尽调周期内，公开商业化证明仍然有限。
        - 当前估值仍然偏高；只有证据或价格改善后，才适合继续跟踪或谈判。
        - 机会成本、稀释和优先权悬置压力比上行选择权更重要。
        - 这是目前与已保留来源集合最匹配的情景。
      - - 悲观
        - 商业发布延期，企业需求慢于 AI 融资新闻所暗示的速度，后续融资重新给公司定价。
        - 由于入场逻辑已经假设未来会取得显著成功，降价轮或平价轮都会损害回报。
        - 倍数压缩、客户证明延迟以及隐藏的条款清单保护，都可能伤害新投资人。
        - 这一判断得到 KPI 未披露以及行业需求证据参差不齐的支持。
    notes: 这些情景是定性的，因为已保留的公开来源没有披露收入、利润率、客户群组或优先权条款。
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
