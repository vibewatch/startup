      - number: '3.2'
        title: 差异化最清晰地体现在产品理念，而非商业化证明
        blocks:
          - type: paragraph
            body: >-
              第三方描述对 humans& 想成为什么样的公司大体一致。AI Market Watch 将公司定位为协作推理、情商以及由 AI 支持人而非取代人的工作流；AgentMarketCap 则认为 humans&
              追求的是协作基础设施，而不是正面参与基于基准测试的基础模型性能竞争。这一理念在战略上清晰，但同一来源也指出，Microsoft Copilot、Google Workspace AI 和 Notion AI
              等成熟产品已经让协作市场拥挤，而且它们从既有用户分发渠道起步。实际上，humans& 可以主张概念上存在空白，却仍然落后于已经掌控周边工作流入口的竞争者，开启商业化竞赛。
            claimRefs:
