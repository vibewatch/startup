      - number: '3.3'
        title: 商业替代方案已经覆盖已上线产品、结果定价和嵌入式套件
        blocks:
          - type: paragraph
            body: >-
              来源池中最强的商业化对比，不是 humans& 与另一家隐身实验室的比较，而是 humans& 与采购动作更具体的替代方案之间的比较。Reuters 报道 Thinking Machines Lab
              已经推出用于微调语言模型的产品 Tinker；CNBC 则描述了 Sierra 和 Decagon 等已上线的客服智能体供应商，它们以结果挂钩或工作流挂钩的价值主张向企业销售。Gartner
              还表示，企业正在扩大对现有软件应用中嵌入的 GenAI 模型的使用，这进一步强化了成熟套件的采购优势。相比之下，指定的 humans& 证据更强调研究方向和资金用途，而不是公开
              SKU、产品包装或采用证明，因此今天的买方有更多购买 AI 的方式，却没有足够证据专门评估 humans&。
            claimRefs:
              - CP005
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河能否持久仍是未解问题
        blocks:
          - type: paragraph
            body: >-
              核心争论在于，humans& 是在技术栈中构建持久层，还是只是在当前前沿实验室融资周期上包装了一个吸引人的叙事。BCG 表示，只有 26% 的公司具备超越概念验证所需的能力，74% 尚未展示切实的 AI
              价值；CNBC 则记录了许多 AI 界面仍把用户困在无法解决问题的循环中。这些品类信号意味着，买方会奖励可量化的解决结果、信任和工作流适配，而不只是前沿实验室履历。在 humans&
              展示公开客户采用、定价或转换成本证据之前，来源池支持的判断是：其护城河有可能成立，但尚未得到验证；如果公司无法创造明显更好的人机协作体验，成熟分发渠道和定义更清楚的替代品仍可能把协作功能商品化。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
