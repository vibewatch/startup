company:
  name: "humans&"
chapter:
  number: 4
  title: Financials
  summary: >-
    humans& has raised unusually large seed capital for a company that still lacks a publicly
    launched product, disclosed pricing, or public traction metrics. The public record supports a
    view of the business as a heavily financed frontier-model and collaboration-product build whose
    commercial proof, cost structure, and runway remain too sparse for conventional underwriting.
sections:
  - id: capital-base-and-monetization-visibility
    title: Capital base and monetization visibility
    body: >-
      The core public financial fact pattern is a January 2026 seed round of $480 million at a
      $4.48 billion valuation, backed by Nvidia, Jeff Bezos, SV Angel, GV, and Emerson Collective.
      That capital base is meaningful, but the current evidence still describes a company before
      commercial proof: public coverage said humans& still did not have a product and had not been
      clear about exactly what it would ship, even as it framed the target experience as a
      replacement for multiplayer communication or collaboration contexts. The company’s disclosed
      use of funds points to model and product development around multi-agent reinforcement
      learning, memory, long-horizon planning, and user-centered collaboration software, which is
      directionally helpful for understanding cost drivers but not enough to establish revenue mix,
      realized pricing, gross margin, or revenue recognition mechanics. In practical terms, the
      available evidence shows capital in and technical ambition out, but not a disclosed
      monetization engine yet.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI009, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: demand-proxies-and-operating-economics
    title: Demand proxies and operating economics
    body: >-
      The external demand backdrop is favorable: Gartner forecasts $2.59 trillion of worldwide AI
      spending in 2026, up 47% year over year, while IDC says software and information services
      alone should spend $33 billion on AI in 2024 and nearly $222 billion by 2028. That supports
      the existence of a large addressable budget pool, but it does not by itself validate
      humans&'s GTM motion. Deloitte’s 2026 work on human-machine interaction is the more relevant
      commercial proxy for this company’s thesis: most organizations still layer AI onto legacy
      processes, and ROI improves when work design changes alongside the model. That makes
      adoption for a collaboration-first AI product as much an implementation and workflow problem
      as a model-quality problem. Publicly, humans& still offers no usable sales-cycle, CAC,
      payback, conversion, or customer-count disclosures, and the finance function also appears
      thin in public filings, with Eric Zelikman listed as CEO, CFO, and secretary in a March 2026
      filing extract.
    claimRefs: [CI008, CI009, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: underwriting-verdict-and-diligence-blockers
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial verdict is that humans& currently looks more like a capitalized frontier-AI
      research and product bet than a business with publicly visible unit economics. Coverage
      describes a company of roughly 20 employees at funding time, building a new model and product
      simultaneously, and one source explicitly warns that training and scaling the model will
      require large sums of cash and competition for compute against incumbents. Another skeptical
      observation is that collaboration-oriented augmentation may still run into enterprise
      incentives that favor cost reduction over coordination quality. Those issues do not negate the
      opportunity, but they materially limit underwriting confidence because the public record still
      lacks revenue, customer, pricing, gross-margin, burn, runway, debt, and compute-obligation
      disclosures. The chapter therefore supports only a research-more posture until management can
      show launch economics, customer adoption, and capital-consumption discipline.
    claimRefs: [CI006, CI007, CI009, CI010, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Enterprise collaboration software
        - Collaboration product for workplace communication and decision workflows
        - Per seat, per workspace, or annual enterprise contract
        - Public use cases are described, but no product launch, customer contract, or price is disclosed
        - Low confidence; current evidence is pre-launch positioning rather than monetization proof
        - Provide pilot contracts, packaging, and initial conversion assumptions
      - - Consumer or family coordination
        - Potential consumer-facing collaboration layer for households or groups
        - Monthly subscription, freemium, or household plan
        - Consumer use cases are mentioned, but no plan, price, or launch data is public
        - Low confidence; use case is hinted but not monetized publicly
        - Provide launch roadmap, price architecture, and retention assumptions
      - - Collaboration-platform replacement motion
        - Product could replace multiplayer contexts such as Slack, Google Docs, or Notion-like workflows
        - Workspace or usage-based contract
        - Positioning is public, but revenue mechanism and recognition policy are undisclosed
        - Low confidence; no signed deployments or revenue recognition evidence
        - Provide target customer, contract term, and implementation services assumptions
      - - Strategic compute economics
        - Nvidia is both an investor and strategic infrastructure signal, but economics are not public
        - Capacity reservation, credits, or infrastructure spend commitment
        - Material to gross margin and runway, yet no contract terms are disclosed
        - Medium confidence on importance, low confidence on actual economics
        - Provide GPU reservation terms, minimum commitments, and pass-through costs
    notes: >-
      Public sources describe possible monetization surfaces and cost dependencies, not disclosed
      current revenue mix; blanks indicate information the retained evidence does not publish.
    claimRefs: [CI002, CI003, CI004, CI005, CI009, CI010]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / benchmark
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - humans& collaboration product
        - Not publicly disclosed
        - No list pricing or realized pricing evidence in retained sources
        - Contract term, seat model, and discounting are all unknown
        - CI004 / CI009
      - - humans& enterprise deployments
        - Not publicly disclosed
        - No named pilots, customer cohorts, or paid seats disclosed
        - Sales cycle, implementation scope, and channel economics are unknown
        - CI005 / CI009
      - - humans& consumer or family use case
        - Not publicly disclosed
        - No public freemium, subscription, or advertising model is attached to the consumer hint
        - ARPU, churn, and acquisition-cost assumptions are unknown
        - CI005 / CI009
      - - OpenAI ChatGPT Go benchmark
        - $8 USD per month, with ads planned for free and Go tiers in the U.S.
        - Public list pricing is disclosed; realized monetization mix remains external-party opaque
        - Benchmark only; competitor economics should not be imputed to humans&
        - CI015
    notes: >-
      The first three rows are disclosure gaps for humans&; the OpenAI row is a clearly labeled
      frontier-model benchmark for monetization design rather than evidence of humans& pricing.
    claimRefs: [CI004, CI005, CI009, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Seed capital raised
        - $480 million seed round at $4.48 billion valuation
        - High
        - Establishes unusual initial capitalization and sets expectations for runway and progress
        - Confirm gross cash proceeds, close timing, and any tranched commitments
      - - Team-size proxy at funding
        - Approximately 20 employees
        - Medium
        - Suggests an early operating organization relative to the scale of capital raised
        - Provide current headcount by engineering, research, product, sales, and finance
      - - Finance-leadership depth
        - Public filing extract lists Eric Zelikman as CEO, CFO, and secretary
        - Medium
        - Indicates concentrated financial oversight and limited visible finance infrastructure
        - Provide current finance org chart, controller/CFO hires, and reporting cadence
      - - Revenue / ARR / customer count
        - Not publicly disclosed in retained sources
        - Low
        - Core underwriting metrics are missing
        - Provide revenue run rate, customer count, and cohort breakout
      - - CAC / payback / sales cycle
        - Not publicly disclosed in retained sources
        - Low
        - Sales efficiency cannot be assessed without acquisition and conversion data
        - Provide pipeline, win rates, sales-cycle length, CAC, and payback assumptions
      - - Gross margin / compute COGS / runway
        - Not publicly disclosed in retained sources
        - Low
        - Frontier-model cost structure determines whether the seed round is sufficient
        - Provide training cost, inference cost, gross margin, monthly burn, and runway
    notes: >-
      Publicly disclosed values are mixed with explicit disclosure gaps; "not publicly disclosed"
      means the retained source set does not provide a supportable number.
    claimRefs: [CI001, CI007, CI008, CI009, CI010]
