company:
  name: humans&
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a large and fast-growing AI market, but the broadest
    2026 spend pool is still dominated by infrastructure and vendor capacity rather
    than application-layer collaboration budgets. The software and model slices most
    adjacent to humans& are materially smaller, while Gartner and Deloitte both show
    enterprise budgets still depend on tactical ROI proof. Because humans& has not
    publicly disclosed pricing, customers, or shipped-product traction, this chapter
    treats SAM and SOM as unresolved diligence work rather than disguising them with
    a generic TAM.
sections:
  - id: market-boundary
    title: Market boundary and buyer logic
    body: >-
      The current public record puts humans& in a narrower category than the
      multi-trillion-dollar "AI market" headline suggests. Independent summaries
      consistently describe the company as building human-centric software for
      collaboration, communication, search, and coordination, rather than selling
      raw compute or a general infrastructure layer. That matters because the closest
      commercial boundary is application and workflow software for knowledge work,
      even if the enabling model and infrastructure ecosystem is much larger. The
      buyer path also appears staged rather than settled: broad public descriptions
      point to enterprise and consumer possibilities, but observable budget ownership
      is still most consistent with CIO, CTO, or functional software leaders who
      can sponsor collaboration tooling before a broader platform standard emerges.
    claimRefs: [CM001, CM002, CM003, CM015, CM016]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Sizing lenses and what they actually measure
    body: >-
      Market sizing is available only through broad external lenses, not through a
      company-specific SAM or SOM. Gartner's 2026 forecast shows a global AI market
      of roughly $2.6 trillion, but that envelope is heavily shaped by infrastructure,
      services, and model spending rather than direct spend on collaboration
      applications. The narrower software and model figures are more relevant to
      humans&, and even those remain category lenses rather than a source-backed
      addressable revenue pool for this company. The evidence therefore supports a
      "large market with unresolved monetizable slice" conclusion, not a precise
      TAM/SAM/SOM stack. The figure below keeps the published numeric lenses visible
      while making clear that the layers are analytical buckets, not a computed
      conversion funnel.
    claimRefs: [CM004, CM005, CM006, CM009, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: drivers-constraints
    title: Adoption drivers, constraints, and remaining diligence work
    body: >-
      The near-term adoption case is credible but conditional. Deloitte's forecast
      that a quarter of GenAI-using enterprises will deploy AI agents in 2025 shows
      rising willingness to operationalize AI workflows, and IEEE's investment and
      compute figures show that capital is still pouring into the sector. However,
      Gartner says enterprises still prefer tactical efficiency gains and that CIOs
      struggle to prove business outcomes, which means budget release remains tied
      to measurable workflow value, trust, and integration rather than frontier-model
      novelty alone. Supply-side conditions also matter: Gartner's mix and Colliers'
      data-center data both show that power, build cost, and permitting have become
      real constraints on frontier-AI capacity. For humans&, the biggest underwriting
      gap is not whether AI is a large market; it is whether the company can prove a
      specific buyer, product surface, and pricing path inside that market before
      infrastructure-heavy competition resets expectations.
    claimRefs: [CM007, CM008, CM010, CM011, CM012, CM013, CM014]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Frontier AI collaboration software
        - AI-assisted communication, coordination, search, memory, and workflow support for teams
        - Model-training capex, raw compute resale, and generic infrastructure contracts
        - CIO / CTO plus functional software budgets
        - Closest public category to humans&'s stated positioning
      - - AI model layer
        - Model consumption, orchestration, and model-adjacent tooling
        - Physical data-center build-out and non-AI SaaS seat spend
        - Central AI platform and engineering budgets
        - Important enabling layer but not the same as application revenue
      - - AI infrastructure
        - AI-optimized IaaS, servers, network fabric, semiconductors, and devices
        - Collaboration software seats and service-delivery budgets
        - Hyperscalers, cloud vendors, and infrastructure operators
        - Sets supply-side constraints more than direct demand for humans&
      - - Enterprise AI experimentation programs
        - Pilot and incremental productivity projects using GenAI and agents
        - Long-duration transformation value not yet released into budget
        - CIOs and business-function leaders
        - Describes the likely adoption path before a scaled platform budget exists
    notes: >-
      Boundary uses public product descriptions plus external market categories; it
      separates broad AI capex from the narrower application budgets humans& still
      has to win.
    claimRefs: [CM001, CM002, CM003, CM008, CM013, CM014]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR / growth
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Gartner
        - "2026"
        - Worldwide
        - $2.595667T total AI spending
        - +47% YoY
        - Top-down market forecast across AI categories
        - Medium
        - Broad envelope is dominated by infrastructure and vendor capacity, not collaboration software
      - - Gartner
        - "2026"
        - Worldwide
        - $453.209B AI software spending
        - Point estimate
        - Segment forecast inside the broader AI market
        - Medium
        - Still too broad to equal humans&'s serviceable market
      - - Gartner
        - "2026"
        - Worldwide
        - $32.604B AI models spending
        - +110% growth in 2026
        - Subsegment forecast
        - Medium
        - Model-layer spend is not the same as application revenue
      - - IEEE Spectrum citing Stanford AI Index / Quid
        - "2025"
        - Global / U.S.
        - $581B global private AI investment; $344B U.S. investment
        - Record year versus 2024
        - Aggregate investment activity
        - Medium
        - Capital deployed is not customer demand or recurring software budget
      - - Colliers
        - "2025"
        - Global / North America
        - $580B+ data-center investment; 15.6 GW North America absorption
        - +27% YoY investment; 2x 2024 absorption
        - Infrastructure market snapshot
        - Medium
        - Measures capacity build-out economics, not application TAM
    notes: >-
      The table preserves top-down lenses because public evidence does not disclose a
      source-backed SAM or SOM for humans&; values are not interchangeable revenue
      pools.
    claimRefs: [CM004, CM005, CM006, CM009, CM010, CM011]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Enterprise knowledge-work teams
        - CIO / CTO with a business-function leader
        - Cross-functional teams
        - Central IT plus departmental software budgets
        - Collaboration, search, and task coordination
        - CIO / CTO
        - Clear productivity lift without replacing workers
      - - Internal AI platform teams
        - Head of AI platform or VP Engineering
        - Model builders and internal toolchain owners
        - R&D or platform budgets
        - Memory, orchestration, and multi-agent workflow tooling
        - CTO / Head of AI
        - Reusable infrastructure for repeated frontier-model workflows
      - - Consumer / prosumer applications
        - Product lead or individual end user
        - Individual users
        - Subscription or bundled product spend
        - Personal collaboration or productivity assistance
        - Product GM / growth owner
        - Daily-use utility strong enough to justify a direct paid surface
    notes: >-
      Buyer mapping is constrained by public descriptions and not yet corroborated by
      named customers, procurement records, or pricing disclosures.
    claimRefs: [CM002, CM003, CM007, CM014, CM016]
