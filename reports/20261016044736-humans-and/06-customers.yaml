    title: Customer journey map
    type: journey-map
    summary: Public evidence supports category demand and product framing, but not named deployment or expansion proof for humans&.
    data:
      items:
        - label: Category interest exists
          detail: Gartner and Microsoft both show enterprises increasing AI and agent activity.
          tone: positive
          touchpoints:
            - "Gartner: 2026 is the inflection year for enterprise AI spending."
            - "Microsoft: active agents grew 15x year over year."
        - label: humans& positioning resonates
          detail: Retained January 2026 company coverage consistently frames humans& around collaboration and human-centered work.
          tone: positive
          touchpoints:
            - "Crunchbase and The SaaS News describe collaboration- and human-centered AI positioning."
            - "VentureCapital calls the product set communication and collaboration tools."
        - label: Evaluation standards harden
          detail: Buyers still need workflow fit, governance, and measurable tactical ROI.
          tone: neutral
          touchpoints:
            - "Gartner: organizations favor tactical AI initiatives with incremental improvements."
            - "IEEE: benchmark scores may say little about fit in real workflows."
        - label: Pilot proof is not public
          detail: The assigned evidence names no design partners, pilot cohort, or pilot outcomes for humans&.
          tone: risk
          touchpoints:
            - "No customer names or pilot counts appear in retained company-specific sources."
        - label: Production deployment remains unverified
          detail: No deployment counts, active-user figures, or customer outcomes are disclosed.
          tone: risk
          touchpoints:
            - "Public record lacks customer count, usage denominator, or deployment denominator."
        - label: Expansion thesis is still hypothetical
          detail: Category adoption could support expansion, but humans& has no public renewal or concentration disclosure.
          tone: risk
          touchpoints:
            - "Microsoft shows enterprise agent expansion potential."
            - "humans& still has no public NRR, GRR, contract-length, or top-customer disclosure in the pool."
    approximationNotes: >-
      Stage order reflects the evidence progression from category demand to renewal
      proof, not observed conversion rates for humans&.
    claimRefs: [CU005, CU006, CU008, CU010, CU012, CU013]
callouts:
  - calloutType: insight
    title: Category pull is stronger than company proof
    body: >-
      The customer story currently relies more on external evidence that enterprises
      are adopting agentic AI than on direct proof that humans& has translated that
      demand into named production accounts.
    claimRefs: [CU005, CU007, CU013]
  - calloutType: risk
    title: Durability cannot yet be underwritten from public evidence
    body: >-
      Without customer count, deployment, renewal, or concentration disclosure, the
      chapter cannot verify whether humans& has a repeatable land-and-expand motion
      or only strong financing and category timing.
    claimRefs: [CU003, CU011, CU012]
