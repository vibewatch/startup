  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Named production customers, customer quotes, pilot-to-production conversions, and customer outcomes tied to identifiable deployments.
      whyItMatters: Without named references, the chapter cannot distinguish a compelling thesis from proven adoption.
      diligencePath: Request a customer reference list with deployment stage, use case, date, and measurable outcome, then corroborate at least two accounts independently.
      relatedQuestionRefs: [QU003, QU005, QU007]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: durability-and-concentration
      missingEvidence: NRR, GRR, churn, renewal cadence, contract length, and customer concentration by top account or top five accounts.
      whyItMatters: These metrics determine whether humans& has durable recurring demand or only early-stage experimentation.
      diligencePath: Obtain cohort, renewal, and concentration reporting from management or data room materials and reconcile it to signed contract counts.
    - type: missing-source
      severity: material
      topic: channel-and-procurement
      missingEvidence: Partner-channel mix, marketplace distribution, security review outcomes, and procurement cycle length by customer segment.
      whyItMatters: Channel dependence or long procurement cycles can materially slow conversion even when product interest is high.
      diligencePath: Ask for pipeline stage data by segment, partner-sourced pipeline share, and median sales-cycle timing from first evaluation to paid deployment.
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU001]
    - type: missing-source
      severity: material
      topic: adoption-denominators
      missingEvidence: Active customer count, live teams or users, deployment count, and product usage denominators that connect category demand to company adoption.
      whyItMatters: Funding and market momentum do not prove product-market fit without adoption denominators.
      diligencePath: Request customer-count and usage reporting with date stamps, then test whether disclosed growth reconciles with revenue and retention metrics.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU002]
