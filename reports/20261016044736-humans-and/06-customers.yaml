schemaVersion: report-v2
artifact: customers
slug: humans-and
runDate: 2026-10-16
company:
  name: "humans&"
chapter:
  number: 6
  title: Customers
  summary: >-
    The assigned evidence supports a real category opportunity for collaborative and
    agentic AI, but it does not yet show customer-level proof for humans& itself.
    Public January 2026 company coverage describes the product vision and capital
    raise, while named deployments, retention metrics, and concentration data remain
    absent from the retained source pool.
sections:
  - id: segment-and-positioning
    title: Public positioning suggests enterprise collaboration buyers, not a proven installed base
    body: >-
      The retained company-specific sources consistently frame humans& as a
      human-centric AI platform for communication, collaboration, and coordinated
      work rather than as a consumer product or a narrow vertical application. That
      points most directly to enterprise knowledge-work buyers, AI program owners,
      and research-heavy teams that need human-in-the-loop workflow support.
      However, the same January 2026 financing coverage that describes the product
      direction does not publish a customer roster, named design partners, or any
      buyer / user / payer breakdown. A March 2026 registry summary confirms the
      company's very recent formation but adds no commercial detail, so the public
      record still shows positioning before customer proof.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-backdrop-versus-company-proof
    title: Category demand is visible, but company-specific adoption proof is not
    body: >-
      The broader 2026 market backdrop is constructive. Gartner forecasts sharp AI
      spending growth and explicitly says enterprise demand, not only hyperscaler
      buildout, should inflect in 2026. Microsoft's Work Trend Index similarly
      reports meaningful employee-level value from AI and rapid growth in active
      agents inside enterprise software environments. IEEE's summary of the 2026 AI
      Index adds evidence that private capital and model development remain abundant.
      Even so, these category signals do not verify that humans& has converted
      interest into production deployments. Gartner cautions that enterprises still
      prefer tactical ROI and IEEE notes benchmark gains may not map cleanly into
      real workflows, so humans& still needs customer evidence beyond a strong
      market narrative.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration remain underwriting gaps
    body: >-
      The core underwriting problem in this chapter is not demand; it is durability.
      None of the assigned company-specific sources discloses customer count, active
      deployments, contract length, renewal behavior, or concentration by account
      or channel. That means land-and-expand remains a hypothesis rather than a
      demonstrated motion. The adverse evidence in the pool is also directionally
      important: Forbes describes aggressive competition for project leads, sales
      talent, and relationship managers in the human-data and frontier-model
      ecosystem, with contracts that can reach very large values. For humans&, that
      raises the risk that even if early interest exists, scaling enterprise demand
      could still bottleneck on customer-facing execution capacity before durable
      recurring adoption is visible.
    claimRefs: [CU011, CU012, CU013]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Enterprise knowledge-work teams
        - "Buyer: CIO / COO / AI lead; user: knowledge workers and managers; payer: central IT or AI budget"
        - Human-centered collaboration and coordinated work with AI systems
        - Category demand is visible; humans& account count is undisclosed
        - Could become a shared workflow layer if adoption clears governance and ROI review
        - No named humans& accounts, pricing, or contract examples are public in the assigned pool
      - - Frontier model and product teams
        - "Buyer: research or engineering leadership; user: model builders, evaluators, and operators; payer: R&D budget"
        - Multi-agent reinforcement learning, memory, planning, and user-centered AI tooling
        - Product intent is described; deployment evidence is not
        - Strategic design-partner value may matter before material revenue
        - No design partners, pilots, or reference teams are publicly named
      - - Large enterprises experimenting with agents
        - "Buyer: line-of-business and IT sponsors; user: cross-functional operating teams; payer: digital-transformation budget"
        - Pilot-to-production agent workflows inside existing software environments
        - Microsoft shows category experimentation at scale; humans& proof is absent
        - Plausible land-and-expand motion if a vendor can show outcome and control
        - Procurement path, security review, and outcome evidence for humans& are not public
      - - Channel or ecosystem-led access
        - "Buyer: partner or ecosystem lead; user: joint customers; payer: shared or embedded software budget"
        - Potential partner distribution or workflow embedding
        - Not evidenced in the assigned source pool
        - Could accelerate reach if real
        - No partner-channel mix, marketplace presence, or reseller evidence is disclosed
    notes: >-
      Segments are inferred from company positioning plus enterprise AI adoption
      studies; the assigned pool does not disclose an official customer list.
    claimRefs: [CU001, CU005, CU007, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Worldwide AI spending forecast
        - "$2.59T in 2026; +47% YoY"
        - "2026-05-19"
        - Gartner
        - High
        - Broad enterprise AI budgets are expanding, supporting top-of-funnel demand
        - Spending is not segmented to humans& or to collaboration-specific workflows
      - - AI user reported value
        - 66% spend more time on high-value work; 58% produce work they could not a year ago
        - "2026-05-05"
        - Microsoft Work Trend Index
        - Medium
        - Human-augmenting AI workflows are showing user-level value
        - Survey measures AI users broadly, not humans& users
      - - Active agents growth
        - 15x YoY overall; 18x in large enterprises
        - "2026-05-05"
        - Microsoft Work Trend Index
        - Medium
        - Enterprises are moving beyond simple chat into repeatable agent workflows
        - No humans& deployment count, active firms, or usage share is disclosed
      - - humans& customer proof disclosure
        - No named customers, customer count, deployment count, or retention metric in retained company-specific coverage
        - 2026-01
        - Crunchbase / VentureCapital / The SaaS News
        - Medium
        - Company proof lags category momentum in the assigned evidence
        - Public record does not separate stealth pilots from zero live deployments
    notes: >-
      Company rows capture what the assigned pool does and does not disclose; they
      do not prove the absence of private customers outside the retained evidence.
    claimRefs: [CU003, CU005, CU007, CU008, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - No public named account in assigned pool
        - Unknown
        - No customer-specific deployment is described in retained funding coverage
        - Not evidenced
        - None public
        - Public sources discuss company vision and financing, not customer references
      - - No public pilot cohort disclosed
        - Unknown
        - No design-partner list, pilot cohort, or evaluation program is named
        - Not evidenced
        - None public
        - Assigned evidence cannot distinguish stealth pilots from no pilots
      - - No public renewal or expansion exemplar disclosed
        - Unknown
        - No multi-team rollout, renewal, upsell, or contract-length example is published
        - Not evidenced
        - None public
        - Land-and-expand remains an assumption rather than observed proof
    notes: >-
      This is a sample-based negative-evidence table built from the assigned public
      pool; it records missing named proof rather than asserting the company has no
      private customers.
    enumerationScope:
      coverage: sample
      basis: >-
        Assigned sources are concentrated in January 2026 financing coverage plus a
        small set of market-backdrop references, with no company-authored customer
        roster in the pool.
    claimRefs: [CU003, CU012, CU013]
figures:
