schemaVersion: "report-v2"
artifact: financials
slug: cadence
runDate: 2026-10-21
company:
  name: Cadence
chapter:
  number: 4
  title: Financials
  summary: >-
    Cadence presents a recurring, reimbursement-linked model spanning billing infrastructure,
    at-risk contracts, and Medicare programs, while company-reported ARR tripled in 2025.
    However, absolute revenue, realized pricing, gross margin, cash, burn, and runway remain
    undisclosed, and proposed reimbursement changes make policy sensitivity a material
    underwriting constraint.
sections:
  - id: revenue-engine-and-pricing
    title: Revenue engine and pricing
    body: >-
      Cadence describes a hybrid revenue engine rather than a simple software subscription:
      care is reimbursed through billing infrastructure and at-risk contracts, while its
      preventive-primary-care offer is marketed as Medicare covered. An industry operator
      separately describes a monthly insurer fee rather than per-alert or per-device pricing,
      but that account is not a contract and does not establish realized price. The clearest
      public rate is for the ACCESS model, where STAT reported $180 to $420 per patient in the
      first year depending on condition, with full payment contingent on outcomes. STAT also
      reported this is materially below roughly $100 per month under a common RPM model. The
      mix can therefore produce recurring revenue, but price, code mix, discounts, and
      outcome-risk allocation remain private.
    claimRefs: [CI001, CI002, CI003, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-operating-leverage
    title: Traction and operating-leverage signals
    body: >-
      Public traction is substantial but mostly non-financial. Cadence reported that annual
      recurring revenue tripled in 2025, more than 100,000 active patients, and relationships
      with over 20 health systems in June 2026. Its March ACCESS announcement used a different
      denominator, saying more than 130,000 patients had been served since 2021; that
      cumulative figure should not be compared directly with active patients. The company
      also advertises 85,000 clinician hours returned annually and 99% of alerts resolved
      without physician escalation. Those measures suggest automation may improve labor
      leverage, but they do not establish recognized revenue, gross margin, or contribution
      margin. Absolute ARR and profit remain undisclosed in the retained evidence.
    claimRefs: [CI007, CI009, CI010, CI011, CI012, CI013, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-policy
    title: Capital adequacy and policy dependence
    body: >-
      Cadence raised a $100 million Series C in June 2026 and said the capital would support
      health-system expansion, AI-agent development, and growth in value-based care. The round
      extends financing capacity, but funding raised is not cash available: without current
      cash, burn, debt, working-capital requirements, or committed expansion spend, runway and
      the next financing trigger cannot be calculated. Policy exposure compounds that
      uncertainty. Legis1 reported that a proposed 2027 CMS rule would restrict payment for
      outsourced third-party RPM vendors and require more physician involvement. Because that
      rule is proposed rather than final, it is a scenario risk, not a current revenue loss;
      nevertheless, it could raise delivery cost or pressure the billing-based stream.
    claimRefs: [CI008, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Revenue quality is directionally attractive but not yet underwritable from public
      evidence. Recurring reimbursement, health-system distribution, and outcome-linked
      contracts can support durable demand, while relative ARR growth and patient scale point
      to commercial momentum. The same model carries labor, clinical-service, and reimbursement
      exposure that cannot be quantified from the available disclosures. Company-reported
      clinician-capacity gains are useful operating proxies, not proof of gross-margin
      expansion. The investment case therefore depends on a private-data review of recognized
      revenue by stream and payer, realized price, gross-to-net deductions, clinical labor and
      device costs, cohort contribution margin, customer concentration, cash, burn, runway,
      debt obligations, and downside economics under lower RPM reimbursement.
    claimRefs: [CI001, CI004, CI007, CI012, CI013, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public value or status
      - Revenue-quality view
      - Diligence ask
    rows:
      - - RPM and chronic-care billing
        - Reimbursement through billing infrastructure
        - Patient or service period; exact unit undisclosed
        - No realized rate disclosed
        - Recurring potential with direct policy exposure
        - Revenue mix by code, payer, and health-system contract
      - - At-risk contracts
        - Payment linked to contractual outcomes
        - Outcome period; exact denominator undisclosed
        - No realized rate disclosed
        - Alignment benefit with performance downside
        - Benchmarks, attribution, downside, and settlement timing
      - - CMS ACCESS
        - Condition-level first-year payment adjusted for outcomes
        - Per patient, by condition
        - "$180-$420; full amount only if outcomes are achieved"
        - Lower headline payment than the common RPM comparator
        - Eligible lives, targets, retention, and cost to serve
      - - 24/7 Preventive Primary Care
        - Medicare-covered care model
        - Billing unit not disclosed by Cadence
        - No realized rate disclosed
        - Potential recurring stream with code-mix uncertainty
        - Codes, realized rate, and overlap with other programs
    notes: >-
      Company descriptions and STAT program rates as of 2026-10-21; realized Cadence pricing,
      revenue recognition, payer mix, discounts, and contract economics are not public.
    claimRefs: [CI001, CI003, CI005, CI006]
  - id: TI002
    title: Public pricing and monetization signals
    columns:
      - Offer or benchmark
      - Price and unit
      - Evidence status
      - Qualification
      - Diligence ask
    rows:
      - - CMS ACCESS
        - "$180-$420 per patient in year one"
        - Independent reporting on program rates
        - Condition dependent; full payment requires target outcomes
        - Cadence-specific eligibility and achieved payment
      - - Common RPM comparator
        - "About $100 per month"
        - Independent market comparator reported by STAT
        - Provider earning potential, not Cadence realized revenue
        - Cadence code mix and gross-to-net realization
      - - Cadence remote-care contract model
        - Monthly insurer fee; amount undisclosed
        - Third-party industry account
        - Not a disclosed customer contract or audited price
        - Contract samples, fee schedule, discounts, and escalation
    notes: >-
      ACCESS and RPM values are program or market benchmarks rather than Cadence realized
      pricing; the monthly-fee description comes from an industry blog and needs contract
      verification.
    claimRefs: [CI002, CI005, CI006]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annual recurring revenue
        - Tripled in 2025; dollar base unavailable
        - Medium
        - Relative growth cannot establish scale or revenue quality
        - Monthly ARR bridge by stream, payer, and cohort
      - - Gross and contribution margin
        - Unavailable
        - Low
        - Clinical labor, devices, logistics, and support may be material
        - Margin by product and cohort with direct-cost allocation
      - - CAC, sales cycle, and payback
        - Unavailable
        - Low
        - Health-system contracting may require long implementation cycles
        - Pipeline cohorts, sales cost, implementation cost, and payback
      - - Cash, burn, runway, and debt
        - Unavailable; $100 million financing is not cash on hand
        - Low
        - Capital adequacy and next-round timing cannot be calculated
        - Bank statements, monthly burn, debt schedule, and downside runway
    notes: >-
      Only the relative 2025 ARR-growth statement and June 2026 financing amount are public;
      unavailable fields are diligence gaps, not zero values or estimates.
    claimRefs: [CI007, CI008, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer activity can reach revenue through billing and outcome-linked routes, but the
      public evidence does not support a numeric gross-profit bridge.
    data:
      nodes:
        - id: patient-enrollment
          label: Patient enrollment
          detail: Health-system and affiliated-physician channels enroll eligible chronic-care patients.
        - id: remote-signals
          label: Remote care activity
          detail: Connected monitoring and preventive-care workflows generate patient signals and interventions.
        - id: ai-triage
          label: AI-supported triage
          detail: Cadence reports automation of routine alerts and protocol-driven work.
        - id: clinical-action
          label: Clinical action
          detail: Cadence care teams and supervising clinicians act within partner workflows.
        - id: monetization-route
          label: Billing or at-risk route
          detail: Billing infrastructure, Medicare programs, and at-risk contracts are the disclosed routes.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Absolute revenue, realized price, mix, and recognition policy are not public.
        - id: gross-profit
          label: Gross profit
          detail: Gross margin and the direct clinical, device, and service-delivery cost base are unavailable.
    approximationNotes: >-
      Ordered operating flow only; no conversion rate, revenue amount, margin, or cumulative
      waterfall is inferred from the retained sources.
    claimRefs: [CI001, CI003, CI004, CI005, CI012, CI013, CI014]
callouts:
  - calloutType: risk
    title: Reimbursement sensitivity is material
    body: >-
      ACCESS offers lower annual payment than a common RPM billing benchmark, while a proposed
      2027 rule could restrict outsourced-vendor reimbursement. Neither item proves current
      revenue loss, but both require contract-level downside testing.
    claimRefs: [CI005, CI006, CI015]
  - calloutType: recommendation
    title: Treat the financing as capacity, not runway
    body: >-
      The $100 million Series C supports expansion plans, but cash, burn, debt, and committed
      uses are undisclosed; underwriting should require a monthly liquidity and cohort-margin
      bridge before assigning a runway.
    claimRefs: [CI008, CI014, CI016]
