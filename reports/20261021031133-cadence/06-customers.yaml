      - [Duke Health, "Academic health system", "Continuous connection and chronic-condition monitoring between visits", "New affiliation announced in June 2026", "Customer executive described intended earlier intervention", "No Duke-specific enrolled population, contract term, or measured outcome disclosed"]
      - [Texas Health Resources, "Nonprofit health system", "Remote chronic-care relationship; precise public deployment scope not stated", "New affiliation announced in June 2026", "No customer-specific measured outcome disclosed", "Production status, enrollment, contract value, and renewal terms not disclosed"]
    notes: >-
      Sample covers named relationships supported by the assigned source pool; announcement
      language is not treated as proof of full production deployment or retained revenue.
    enumerationScope:
      coverage: sample
      basis: >-
        Named health-system relationships in the assigned, successfully prefetched customer
        evidence available for the 2026-10-21 run.
    claimRefs: [CU004, CU005, CU006]
figures:
  - id: FU001
    title: Health-system customer journey and expansion loop
    type: journey-map
    summary: >-
      The public evidence supports a staged path from institutional affiliation to additional
      care programs, while leaving conversion, timing, and retention at each stage undisclosed.
    data:
      items:
        - label: Health-system selection
          detail: "Institution evaluates clinical evidence, capacity impact, reimbursement, and strategic fit."
          touchpoints: ["Executive sponsor", "Clinical leadership", "Procurement"]
        - label: Clinical and EMR integration
          detail: "Cadence embeds into medical groups, electronic records, and clinical workflows."
          touchpoints: ["EMR workflow", "Clinical protocols", "Cadence medical group"]
        - label: Patient enrollment
          detail: "Eligible older adults enter remote or preventive chronic-care programs."
          touchpoints: ["Eligibility", "Consent", "Connected devices"]
        - label: Continuous monitoring
          detail: "Vitals, symptoms, medications, and engagement signals are monitored between visits."
          touchpoints: ["Home readings", "AI-supported review", "Risk flags"]
        - label: Clinical response
          detail: "Care teams triage alerts, support medication changes, and coach patients."
          touchpoints: ["Triage", "Medication support", "Lifestyle coaching"]
        - label: Account expansion
          detail: "A relationship may extend across conditions, sites, preventive care, post-acute care, or value-based contracts."
          touchpoints: ["Additional programs", "More patient cohorts", "Value-based care"]
    approximationNotes: >-
      Ordered stages reflect the disclosed operating model, not measured conversion rates,
      elapsed time, or proof that every named customer has completed every stage.
    claimRefs: [CU001, CU005, CU011, CU012, CU013, CU016]
callouts:
  - calloutType: strength
    title: Scale is visible across patient and system counts
    body: >-
      Cadence's more-than-100,000 active-patient and more-than-20-system claims are repeated
      by independent trade coverage and accompanied by several named health-system relationships.
    claimRefs: [CU002, CU004, CU005]
  - calloutType: risk
    title: Durability and concentration remain private
    body: >-
      Public adoption counts do not reveal renewals, churn, cohort retention, contract length,
      or concentration by health system and payer, limiting underwriting of revenue durability.
    claimRefs: [CU014, CU015]
