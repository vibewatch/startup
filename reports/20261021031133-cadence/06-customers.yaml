      - [Older adults with chronic disease, "Medicare or other payer through the health-system care model", Patients and caregivers, "Daily monitoring and proactive support for hypertension, heart failure, and type 2 diabetes", "100,000+ active patients reported in June 2026", "Enrollment eligibility and payer mix undisclosed"]
      - [Primary-care practices, "Health system or medical group", "Primary-care clinicians and care teams", "Preventive primary care, care-gap closure, and panel management", "Company positions the service as capacity expansion", "Account-level adoption and utilization not disclosed"]
      - [Post-acute and specialty care, "Health system or medical group", "Cardiology and transition-of-care teams", "Home support after discharge and condition-specific medication management", "Named Duke and Memorial Hermann relationships broaden the channel", "Production volume and customer-specific outcomes not disclosed"]
    notes: >-
      Segments synthesize company, customer, and independent descriptions; scale is
      company-reported, and null commercial details are treated as diligence gaps.
    claimRefs: [CU001, CU002, CU004, CU005, CU011, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period
      - Source characterization
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - ["Active patients", "18,000+", "March 2024", "Independent company profile", Medium, "Establishes an earlier scale point", "Profile methodology and active-patient definition not disclosed"]
      - ["Active patients", "90,000+", "April 2026", "Customer-issued partnership release", Medium, "Shows scale before the June financing announcement", "No partner-level patient allocation"]
      - ["Active patients", "100,000+", "June 2026", "Company announcement repeated by trade press", High, "Indicates continued enrollment growth", "No cohort retention, payer mix, or health-system distribution"]
      - ["Health systems", "20+", "June 2026", "Company announcement repeated by trade press", High, "Demonstrates broad institutional distribution", "No revenue or patient concentration by system"]
      - ["Annual recurring revenue growth", "3x", "2025", "Company-reported in financing announcement", High, "Suggests commercial expansion alongside patient growth", "Absolute ARR, starting value, and customer contribution not disclosed"]
    notes: >-
      Values preserve the source periods and attribution; the profile series is not audited,
      and company-reported metrics lack the denominators identified in the final column.
    claimRefs: [CU002, CU003, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Evidence stage
      - Public outcome
      - Limitation
    rows:
