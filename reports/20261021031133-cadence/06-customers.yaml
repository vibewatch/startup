schemaVersion: "report-v2"
artifact: customers
slug: cadence
runDate: 2026-10-21
company:
  name: Cadence
chapter:
  number: 6
  title: Customers
  summary: >-
    Cadence reports more than 100,000 active patients across more than 20 health systems,
    with recent affiliations spanning Duke Health, Texas Health Resources, and Memorial
    Hermann. The customer evidence demonstrates scaled health-system distribution and
    several named relationships, but public materials do not establish partner-level
    production volumes, renewal behavior, contract duration, or concentration.
sections:
  - id: customer-model-and-segments
    title: Customer model and segments
    body: >-
      Cadence operates a multi-stakeholder model in which health systems are the principal
      institutional buyers and workflow owners, clinicians use an EMR-integrated care
      service, and older adults with hypertension, heart failure, or type 2 diabetes are
      the end users. The company says its model is reimbursed through billing
      infrastructure and at-risk contracts, making payer economics and health-system
      implementation part of the buying decision rather than an afterthought. Public
      evidence also distinguishes several care surfaces: remote patient care, preventive
      primary care, and post-acute support. This breadth can expand account value, but it
      also creates multiple approval, integration, enrollment, and reimbursement steps
      before a named affiliation becomes durable utilization.
    claimRefs: [CU001, CU005, CU011, CU012]
    tableRefs: [TU001]
  - id: adoption-and-reference-proof
    title: Adoption trajectory and reference quality
    body: >-
      The strongest adoption signal is the June 2026 scale claim of more than 100,000
      active patients and more than 20 health systems, reported by Cadence and repeated by
      an independent trade publication. A customer-issued April 2026 announcement described
      a base of more than 90,000 patients, while an independent company profile lists a
      longer trajectory from more than 18,000 patients in March 2024 to more than 100,000
      in June 2026. Named evidence includes Duke Health, Texas Health Resources, and
      Memorial Hermann, but the sources mostly establish affiliations or planned service
      introductions. They do not disclose deployment-level enrolled populations, contract
      value, or customer-specific clinical outcomes, so the named references should not be
      treated as equivalent to mature, fully quantified production accounts.
    claimRefs: [CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Cadence's disclosed operating model creates a plausible expansion path from initial
      health-system affiliation through EMR integration, patient enrollment, continuous
      monitoring, clinical response, and additional care programs. Company-reported
      operating metrics indicate substantial activity, including 24,000 medication
      titrations in 2025, 85,000 clinician hours returned annually, 99% of alerts resolved
      without physician escalation, and 4.9/5 patient satisfaction. These metrics do not
      substitute for retention evidence: the assigned public sources disclose no NRR, GRR,
      churn, renewal rate, contract length, or cohort retention. They also do not quantify
      revenue or patient concentration by health system, payer, or channel. Health-system
      investors and affiliations may support distribution, but they also make procurement,
      integration, and partner dependence central diligence questions.
    claimRefs: [CU007, CU008, CU009, CU010, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
