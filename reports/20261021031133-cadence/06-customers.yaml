  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: >-
        Customer cohorts showing gross and net retention, logo churn, renewal rates, contract
        duration, and expansion by deployment vintage.
      whyItMatters: >-
        Patient and health-system counts cannot establish whether adoption converts into
        durable recurring revenue or whether growth masks churn.
      diligencePath: >-
        Request an anonymized health-system cohort schedule with contracts, renewal dates,
        patient enrollment, revenue, churn, and expansion by quarter.
      relatedQuestionRefs: [QU006]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: >-
        Revenue, active-patient, and gross-margin concentration by health system, payer,
        care program, and channel.
      whyItMatters: >-
        A count of more than 20 systems does not show whether a few partners or reimbursement
        pathways dominate economics and negotiating leverage.
      diligencePath: >-
        Obtain top-10 customer and payer concentration schedules, including contract terms,
        renewal dates, revenue share, enrollment share, and contribution margin.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        A complete roster separating signed, implementation, pilot, production, and renewed
        health-system accounts, with deployment dates and customer-specific outcomes.
      whyItMatters: >-
        Public affiliation announcements cannot distinguish reference logos from scaled,
        retained production deployments.
      diligencePath: >-
        Reconcile management's customer roster to contracts, implementation records, invoices,
        active-patient files, and reference calls for a representative account sample.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
