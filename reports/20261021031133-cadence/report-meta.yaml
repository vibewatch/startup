  topStrengths:
    - More than 100,000 active patients across over 20 health systems indicate meaningful operating scale.
    - The integrated clinical-service model combines connected devices, supervised automation, and clinician oversight.
    - A $100 million Series C and company-reported tripling of ARR in 2025 support continued growth investment.
  topRisks:
    - Reimbursement and regulatory changes could weaken the economics of outsourced remote chronic care.
    - Absolute revenue, margins, retention, cash burn, runway, and patient-level unit economics remain undisclosed.
    - >-
      Security assurance, reliability history, and the durable authorization path for medication-management automation
      require private diligence.
    - Public customer counts do not reveal renewal quality or concentration by health system, payer, or channel.
  unresolvedGaps:
    - Audited revenue, ARR bridge, gross margin, clinical labor cost, cash burn, cash balance, and runway.
    - Customer renewal, retention, contract duration, expansion, and concentration by health system and payer.
    - Independent security assurance, incident history, uptime, recovery objectives, and model-governance controls.
    - >-
      Complete regulatory and legal register, including the authorization path for HypertensionOS and reimbursement
      exposure.
    - Fully diluted capitalization, financing preferences, debt, board composition, and investor-control rights.
