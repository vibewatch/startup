        - Low
        - No underlying dataset, condition overlap, or reimbursable-share calculation is provided
      - - Cadence observed reach
        - June 2026
        - United States
        - More than 100,000 active patients across more than 20 health systems
        - Not reported
        - Company-reported deployment count repeated by independent coverage
        - Medium
        - Company reach is not a market-size estimate and the patient denominator is not audited
      - - Cadence long-term ambition
        - End of decade
        - Not specified beyond current U.S. focus
        - 1 million people with chronic conditions
        - Not reported
        - Company target
        - Low
        - Aspiration is not a forecast, contracted pipeline, SAM, or SOM
      - - Monetary TAM, SAM, or SOM
        - As of 2026-10-21
        - United States
        - Not supportable from assigned evidence
        - Not supportable
        - Requires claims, reimbursement, eligible-population, and adoption data
        - Low
