    notes: >-
      The table deliberately keeps population need, current deployment, company ambition, and
      monetary market size separate; no conversion between them is assumed.
    claimRefs: [CM004, CM005, CM006, CM014]
  - id: TM003
    title: Segment, buyer, user, payer, and adoption map
    columns:
      - Segment
      - Buyer
      - User
      - Payer or funding path
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Enterprise chronic-care programs
        - Health systems and medical groups
        - Patients, physicians, and Cadence clinical staff
        - Billing infrastructure and at-risk contracts
        - Daily monitoring, risk identification, medication support, and escalation
        - Not publicly disclosed
        - Extend capacity without proportional physician headcount
      - - Preventive primary care
        - Primary-care organizations within health systems
        - PCPs and Medicare patients
        - Medicare-covered care model
        - Care-gap closure, symptom support, medication management, and coaching
        - Not publicly disclosed
        - Larger panels with continuity and 24/7 support
      - - Post-acute heart-failure care
        - Hospital and cardiology service lines
        - Recently discharged patients and cardiology teams
        - Not publicly disclosed
        - At-home recovery monitoring and early intervention
        - Not publicly disclosed
        - Avoidable readmissions and length-of-stay pressure
      - - Value-based care programs
        - Provider organizations bearing cost or quality risk
        - Population-health and clinical teams
        - At-risk contracts
        - Longitudinal management linked to outcomes and utilization
        - Not publicly disclosed
        - Lower avoidable utilization and cost
      - - Internal-build or dashboard alternative
        - Health systems
        - Existing nursing and physician teams
        - Internal operating budget
        - Staff manually review alerts and coordinate interventions
        - Clinical operations leadership
        - Control and avoidance of an external clinical-service contract
    notes: >-
      Buyer and workflow roles are evidence-backed; budget ownership, pricing, payer mix, and
      procurement duration remain unavailable and are shown as gaps rather than estimates.
    claimRefs: [CM002, CM007, CM008, CM010, CM011, CM013, CM016]
figures:
  - id: FM001
    title: Evidence-constrained addressability ladder
    type: pyramid
    summary: >-
      The available evidence narrows from a broad need population to observed company reach
      without treating the layers as a conversion funnel or a revenue market estimate.
    data:
      items:
        - label: Broad chronic-disease need
          value: "56 million"
          unit: U.S. older adults
          note: Third-party publisher estimate; underlying denominator is not supplied.
        - label: Target condition scope
          value: "4 named conditions"
          detail: Hypertension, heart failure, type 2 diabetes, and COPD
          note: Product scope, not a patient count.
        - label: Company ambition
          value: "1 million"
          unit: people
          note: Company goal for the end of the decade, not contracted reach.
        - label: Current active reach
          value: "100,000+"
          unit: active patients
          note: Company-reported June 2026 deployment count.
        - label: Current distribution base
          value: "20+"
          unit: health systems
          note: Company-reported June 2026 partner count.
        - label: Monetary TAM, SAM, or SOM
          value: Not available
          note: Assigned evidence has no credible dollar value, CAGR, or reimbursement-weighted denominator.
    approximationNotes: >-
      Values are shown exactly as characterized by their sources. Layer order expresses analytical
      narrowing only; widths do not represent proportional magnitude, conversion, or forecast.
    claimRefs: [CM001, CM004, CM005, CM006, CM014, CM015]
callouts:
  - calloutType: risk
    title: Do not capitalize the broad denominator
    body: >-
      The 56 million-person need estimate cannot be converted into revenue without condition
      overlap, eligibility, reimbursement, adoption, retention, pricing, and service-capacity data.
    claimRefs: [CM005, CM014]
