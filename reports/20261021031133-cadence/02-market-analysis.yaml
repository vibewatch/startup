schemaVersion: "report-v2"
artifact: market-analysis
slug: cadence
runDate: 2026-10-21
company:
  name: Cadence
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Cadence operates in the narrower market for clinically integrated remote chronic care,
    not the whole digital-health or remote-monitoring category. Public evidence establishes
    substantial need and early deployment scale, but it does not support a credible dollar
    TAM, SAM, SOM, CAGR, payer mix, or budget-owner estimate.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is the delivery of longitudinal, clinically managed care between
      visits for older adults with hypertension, heart failure, type 2 diabetes, and COPD.
      Cadence combines connected devices, an EMR-integrated workflow, supervised automation,
      and a physician-led clinical team; that makes it narrower than generic digital health
      and more service-intensive than device-only remote patient monitoring. The status quo
      is episodic in-person management, manual inbox follow-up, or a monitoring dashboard
      that leaves triage and intervention with the health system. Evidence from the allocated
      search pool was also screened for the Cadence Design Systems namesake, whose semiconductor
      market results are not evidence for Cadence Solutions.
    claimRefs: [CM001, CM002, CM003, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      Available sources support three different, non-interchangeable sizing lenses. A broad
      need estimate says 56 million U.S. older adults live with chronic disease; Cadence reports
      a current deployment base above 100,000 active patients across more than 20 health systems;
      and the company states an ambition to treat one million people by the end of the decade.
      These are respectively a population denominator, observed company reach, and a corporate
      goal, not TAM, SAM, and SOM. No retained source supplies a defensible market revenue value,
      CAGR, condition-level overlap adjustment, reimbursement-weighted addressable population,
      or payer mix. A valuation model should therefore avoid converting these figures into a
      revenue opportunity without claims, reimbursement, retention, and capacity data.
    claimRefs: [CM004, CM005, CM006, CM014, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      Health systems and their medical groups are the demonstrated institutional buyers, while
      patients and health-system clinicians are the day-to-day users. Cadence says reimbursement
      runs through billing infrastructure and at-risk contracts, but public material does not
      disclose payer mix, contract allocation, pricing, or the executive budget owner. Adoption
      therefore appears to depend on an integrated clinical-service sale rather than a stand-alone
      software purchase: connected devices collect readings, Cadence's team handles routine
      monitoring and escalation, and the workflow connects back to the health system. Reported
      capacity benefits and expansion into additional systems are useful demand signals, but
      procurement duration and implementation cost remain unquantified.
    claimRefs: [CM002, CM007, CM008, CM010, CM011, CM016]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand is supported by clinician shortages, a large chronic-disease burden, and health
      systems' need to manage patients between visits without adding equivalent physician
      headcount. Cadence also cites a 27% reduction in hospital admissions, while third-party
      coverage describes expansion toward more health systems and value-based care. The main
      adoption constraints are trust, clinical accountability, reimbursement durability, and
      patient acceptance of AI-enabled medical devices; TechTarget reports that one-third of
      respondents in a 2025 survey were concerned about their safety. For valuation, deployment
      growth is evidence of product-market pull, but it is not a substitute for market revenue,
      unit economics, payer concentration, implementation cost, or independently verified ROI.
    claimRefs: [CM009, CM011, CM012, CM013, CM014]
tables:
  - id: TM001
    title: Market definition and substitute set
    columns:
      - Segment or category
      - Included spend and activity
      - Excluded spend
      - Buyer or payer
      - Relevance to Cadence
    rows:
      - - Clinically integrated remote chronic care
        - Connected monitoring, longitudinal clinical intervention, medication support, and coaching
        - General telehealth, wellness apps, and unrelated acute care
        - Health-system medical groups; reimbursement channel not fully disclosed
        - Core market boundary
      - - Remote patient monitoring infrastructure
        - Connected devices, vital-sign transmission, alerts, and workflow integration
        - Clinical intervention delivered outside the monitoring contract
        - Health systems and practices
        - Enabling layer and partial substitute
      - - Preventive primary care
        - Medicare-covered care-gap closure, continuous support, and medication management
        - Ordinary episodic primary-care visits
        - Primary-care organizations; Medicare channel identified
        - Adjacent workflow within Cadence's offering
      - - Post-acute chronic care
        - At-home monitoring and support after discharge, especially for heart failure
        - General home health and unrelated rehabilitation
        - Health-system service lines; payer allocation undisclosed
        - Adjacent expansion path
      - - Status quo and internal build
        - In-person follow-up, clinician inbox triage, and internally staffed monitoring
        - Third-party platform and outsourced clinical-service fees
        - Health-system operating budgets
        - Principal substitution and switching benchmark
    notes: >-
      Boundary is synthesized from Cadence product descriptions and independent coverage; spend,
      pricing, payer allocation, and budget ownership are not publicly disclosed.
    claimRefs: [CM001, CM002, CM003, CM010, CM016]
