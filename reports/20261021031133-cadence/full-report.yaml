    summary: >-
      The disclosed product is a vertically integrated care stack whose performance depends on devices, data, AI,
      clinical operations, and health-system integration.
    data:
      layers:
        - label: Patient experience
          detail: Patient-facing measurements and communication initiate the care workflow.
          modules:
