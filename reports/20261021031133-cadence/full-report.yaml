            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO009
              - CO012
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reimbursement scrutiny is a core diligence dependency
            body: >-
              STAT reported that remote-monitoring reimbursement supporting much of Cadence's business has drawn
              scrutiny from the federal health department's watchdog and UnitedHealthcare. This is evidence of sector
              and model risk, not proof of a Cadence-specific violation.
            calloutType: risk
            claimRefs:
