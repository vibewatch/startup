      Ordered stages reflect the disclosed operating model, not measured conversion rates, elapsed time, or proof that
      every named customer has completed every stage.
    claimRefs:
      - CU001
      - CU005
      - CU011
      - CU012
      - CU013
      - CU016
  - id: FR001
    title: Residual risk and thesis-break matrix
    type: matrix
    summary: Six evidence-linked risk domains translated into monitorable exposure and explicit investment triggers.
    data:
      columns:
        - Evidence basis
        - Residual exposure
        - Thesis-break trigger
      rows:
        - label: Regulatory pathway
          values:
            - TEMPO participation is not clearance
            - High until a durable pathway and safety evidence are documented
            - Loss of pilot pathway or failure to establish an authorization route
        - label: Reimbursement
          values:
            - ACCESS pays $180-$420 in year one and conditions full payment on outcomes
            - Margin depends on automation, condition mix, and outcome attainment
            - Negative cohort contribution margin at contracted payment bands
        - label: Medication safety
          values:
            - Bounded scope and clinician control are described
            - Adverse-event and override distributions are not public
            - Material automation-attributable safety event or unauditable medication change
        - label: Privacy and security
          values:
            - Control categories are identifiable, but assurance evidence is absent
            - Incident frequency and recovery readiness are unquantified
            - Material PHI breach or inability to evidence tested recovery and access controls
        - label: Partner concentration
          values:
            - More than 20 health systems are reported
            - Revenue and enrollment distribution are not disclosed
            - A single nonrenewal can materially impair revenue or patient scale
        - label: Financial durability
          values:
            - ARR growth is reported, but dollar revenue and profit are not
            - Funding raised does not establish cash available, burn, or runway
            - Runway under 18 months without a credible path to positive cohort economics
    approximationNotes: >-
      Qualitative matrix; no numeric probability is estimated. Triggers are diligence thresholds derived from the cited
      operating model and identified disclosure gaps.
    claimRefs:
      - CR004
      - CR006
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision path moves from demonstrated operating scale through proof and unresolved risks to a research-more
      recommendation.
    data:
      nodes:
        - id: scale
          label: Scale
          detail: 100,000+ active patients and 20+ health systems are company-reported.
        - id: proof
          label: Clinical proof
          detail: Cadence reports a 27% reduction in hospital admissions.
        - id: automation
          label: Automation evidence
          detail: Published alert-resolution measures have different denominators and need reconciliation.
        - id: risk
          label: Execution risk
          detail: Reimbursement, regulation, procurement, and labor intensity remain material.
        - id: price
          label: Price support
          detail: The $1.2B-$1.23B round mark lacks public audited revenue, margin, and preference support.
        - id: decision
          label: Research more
          detail: Require financial, cohort, and capitalization diligence before underwriting an entry.
      edges:
        - from: scale
          to: proof
        - from: proof
          to: automation
        - from: automation
          to: risk
        - from: risk
          to: price
        - from: price
          to: decision
    approximationNotes: This is a decision sequence, not a probability-weighted or value-proportional diagram.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV015
