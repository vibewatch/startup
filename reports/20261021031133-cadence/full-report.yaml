  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the delivery of longitudinal, clinically managed care between visits for older
              adults with hypertension, heart failure, type 2 diabetes, and COPD. Cadence combines connected devices, an
              EMR-integrated workflow, supervised automation, and a physician-led clinical team; that makes it narrower
              than generic digital health and more service-intensive than device-only remote patient monitoring. The
              status quo is episodic in-person management, manual inbox follow-up, or a monitoring dashboard that leaves
              triage and intervention with the health system. Evidence from the allocated search pool was also screened
              for the Cadence Design Systems namesake, whose semiconductor market results are not evidence for Cadence
              Solutions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available sources support three different, non-interchangeable sizing lenses. A broad need estimate says
              56 million U.S. older adults live with chronic disease; Cadence reports a current deployment base above
              100,000 active patients across more than 20 health systems; and the company states an ambition to treat
              one million people by the end of the decade. These are respectively a population denominator, observed
              company reach, and a corporate goal, not TAM, SAM, and SOM. No retained source supplies a defensible
              market revenue value, CAGR, condition-level overlap adjustment, reimbursement-weighted addressable
              population, or payer mix. A valuation model should therefore avoid converting these figures into a revenue
              opportunity without claims, reimbursement, retention, and capacity data.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Health systems and their medical groups are the demonstrated institutional buyers, while patients and
              health-system clinicians are the day-to-day users. Cadence says reimbursement runs through billing
              infrastructure and at-risk contracts, but public material does not disclose payer mix, contract
              allocation, pricing, or the executive budget owner. Adoption therefore appears to depend on an integrated
              clinical-service sale rather than a stand-alone software purchase: connected devices collect readings,
              Cadence's team handles routine monitoring and escalation, and the workflow connects back to the health
              system. Reported capacity benefits and expansion into additional systems are useful demand signals, but
              procurement duration and implementation cost remain unquantified.
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by clinician shortages, a large chronic-disease burden, and health systems' need to
              manage patients between visits without adding equivalent physician headcount. Cadence also cites a 27%
              reduction in hospital admissions, while third-party coverage describes expansion toward more health
              systems and value-based care. The main adoption constraints are trust, clinical accountability,
              reimbursement durability, and patient acceptance of AI-enabled medical devices; TechTarget reports that
              one-third of respondents in a 2025 survey were concerned about their safety. For valuation, deployment
              growth is evidence of product-market pull, but it is not a substitute for market revenue, unit economics,
              payer concentration, implementation cost, or independently verified ROI.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize the broad denominator
            body: >-
              The 56 million-person need estimate cannot be converted into revenue without condition overlap,
              eligibility, reimbursement, adoption, retention, pricing, and service-capacity data.
            calloutType: risk
            claimRefs:
              - CM005
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than pure remote-patient-monitoring software. The retained
              registry identifies scaled managed-care peers including HealthSnap, Health Recovery Solutions, TimeDoc
              Health, and CoachCare, while the buyer can also assemble devices, monitoring software, internal clinical
              operations, and existing episodic care. Cadence reported more than 100,000 active patients across more
              than 20 health systems in June 2026 and raised a $100 million Series C, giving it meaningful scale and
              capital for expansion. Peer scale is not trivial: the retained registry attributes about 80,000 patient
              programs across about 200 systems and groups to HealthSnap, more than 400 provider organizations to Health
              Recovery Solutions, and more than 150,000 patients to CoachCare. Those figures come from one
              low-reputation registry and are directional rather than independently verified benchmarks. Internal build
              and the status quo remain material substitutes because health systems retain clinical protocols, existing
              patient relationships, and workflow control even when they outsource monitoring and care-team capacity.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: Service model, capabilities, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Cadence's clearest supported distinction is operating-model depth. Independent coverage describes the
              company as a clinical service rather than only a monitoring platform, supported by a medical group with
              more than 300 staff. Customer and partner materials describe supervised agents reviewing daily data while
              clinicians complete medication recommendations inside the health system's existing care relationship.
              Cadence and secondary coverage also describe direct electronic-medical-record and workflow integration.
              The company reports a 3.5-minute median response time for incoming vitals alerts and says 55% are resolved
              without human adjustment, but these operating metrics are company-originated and are not a neutral
              comparison with peers. The capability matrix therefore records only features stated in retained sources
              and marks unsupported competitor cells as unknown. Cadence appears more vertically integrated than a
              device-dashboard vendor, yet that conclusion does not establish superior safety, outcomes, regulatory
              posture, or total cost against named alternatives.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Commercial model, distribution power, and switching
        blocks:
          - type: paragraph
            body: >-
              Public commercial evidence is thin. One industry-operator commentary says Cadence charges insurers a
              monthly remote-care fee rather than a per-alert or per-device fee; no retained source provides the fee,
              realized contract price, discounting, minimum commitment, reimbursement split, or contract duration.
              Distribution is supported more clearly: Cadence embeds into health-system medical groups, clinical
              protocols, electronic records, and branded care relationships. That integration likely creates
              implementation and process-switching friction, because replacement would require reworking workflows and
              clinical accountability rather than swapping a standalone dashboard. It does not prove contractual
              lock-in, exclusivity, low churn, or an inability to multi-home. Health-system venture participation and
              customer references may strengthen channel access, but they should not be treated as independent product
              validation. The central diligence need is contract-level evidence comparing Cadence's net economics and
              implementation burden with managed RPM peers and an internal-build case.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The defensible thesis is not that Cadence alone can monitor chronic-care patients. Retained descriptions
              show competitors offering devices, RPM, chronic-care management, Advanced Primary Care Management, staffed
              monitoring, and national clinical teams. Cadence's stronger case is the combination of workflow
              integration, clinical-service ownership, health-system distribution, reported operating responsiveness,
              and evidence claims. Even that combination may be replicated or unbundled: managed-care peers can deepen
              clinical services, health systems can internalize higher-value workflows, and incumbent workflow vendors
              could extend from the electronic record into supervised automation. The positioning map is therefore an
              evidence-constrained taxonomy, not a performance ranking; its ordinal coordinates encode only the service
              ownership and integration described in the retained sources. No independent head-to-head benchmark,
              competitor pricing set, win-loss data, churn evidence, or adverse competitor study was available.
              Durability depends on proving outcome and economic superiority after implementation, not merely on
              attaching AI to a familiar RPM model.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is plausible; durability is unproven
            body: >-
              Cadence's integration and clinical-service ownership can create switching friction, but overlapping
              managed-care offerings mean moat durability depends on independently proving better outcomes and
              economics.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue engine and pricing
        blocks:
          - type: paragraph
            body: >-
              Cadence describes a hybrid revenue engine rather than a simple software subscription: care is reimbursed
              through billing infrastructure and at-risk contracts, while its preventive-primary-care offer is marketed
              as Medicare covered. An industry operator separately describes a monthly insurer fee rather than per-alert
              or per-device pricing, but that account is not a contract and does not establish realized price. The
              clearest public rate is for the ACCESS model, where STAT reported $180 to $420 per patient in the first
              year depending on condition, with full payment contingent on outcomes. STAT also reported this is
              materially below roughly $100 per month under a common RPM model. The mix can therefore produce recurring
              revenue, but price, code mix, discounts, and outcome-risk allocation remain private.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI012
              - CI013
              - CI014
      - number: '4.2'
        title: Traction and operating-leverage signals
        blocks:
          - type: paragraph
            body: >-
              Public traction is substantial but mostly non-financial. Cadence reported that annual recurring revenue
              tripled in 2025, more than 100,000 active patients, and relationships with over 20 health systems in June
              2026. Its March ACCESS announcement used a different denominator, saying more than 130,000 patients had
              been served since 2021; that cumulative figure should not be compared directly with active patients. The
              company also advertises 85,000 clinician hours returned annually and 99% of alerts resolved without
              physician escalation. Those measures suggest automation may improve labor leverage, but they do not
              establish recognized revenue, gross margin, or contribution margin. Absolute ARR and profit remain
              undisclosed in the retained evidence.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI012
              - CI013
              - CI016
      - number: '4.3'
        title: Capital adequacy and policy dependence
        blocks:
          - type: paragraph
            body: >-
              Cadence raised a $100 million Series C in June 2026 and said the capital would support health-system
              expansion, AI-agent development, and growth in value-based care. The round extends financing capacity, but
              funding raised is not cash available: without current cash, burn, debt, working-capital requirements, or
              committed expansion spend, runway and the next financing trigger cannot be calculated. Policy exposure
              compounds that uncertainty. Legis1 reported that a proposed 2027 CMS rule would restrict payment for
              outsourced third-party RPM vendors and require more physician involvement. Because that rule is proposed
              rather than final, it is a scenario risk, not a current revenue loss; nevertheless, it could raise
              delivery cost or pressure the billing-based stream.
            claimRefs:
              - CI008
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is directionally attractive but not yet underwritable from public evidence. Recurring
              reimbursement, health-system distribution, and outcome-linked contracts can support durable demand, while
              relative ARR growth and patient scale point to commercial momentum. The same model carries labor,
              clinical-service, and reimbursement exposure that cannot be quantified from the available disclosures.
              Company-reported clinician-capacity gains are useful operating proxies, not proof of gross-margin
              expansion. The investment case therefore depends on a private-data review of recognized revenue by stream
              and payer, realized price, gross-to-net deductions, clinical labor and device costs, cohort contribution
              margin, customer concentration, cash, burn, runway, debt obligations, and downside economics under lower
              RPM reimbursement.
            claimRefs:
              - CI001
              - CI004
              - CI007
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reimbursement sensitivity is material
            body: >-
              ACCESS offers lower annual payment than a common RPM billing benchmark, while a proposed 2027 rule could
              restrict outsourced-vendor reimbursement. Neither item proves current revenue loss, but both require
              contract-level downside testing.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI015
          - type: callout
            title: Treat the financing as capacity, not runway
            body: >-
              The $100 million Series C supports expansion plans, but cash, burn, debt, and committed uses are
              undisclosed; underwriting should require a monthly liquidity and cohort-margin bridge before assigning a
              runway.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Cadence is delivered as a clinical service rather than a standalone monitoring dashboard. Its public
              portfolio spans 24/7 Preventive Primary Care, Remote Patient Care, Post-Acute Care, and the narrower
              HypertensionOS prescription-software program. Across these products, the workflow begins with home
              measurements and engagement signals, moves through risk identification and protocol-driven action, and
              escalates decisions that require clinical judgment. The model therefore bundles software, connected
              devices, clinical operations, and workflow integration. This breadth is strategically useful because it
              addresses the health system's labor constraint, but it also means product quality depends on coordinated
              service delivery rather than software performance alone.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE007
              - CE010
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has five layers: patient devices and interactions, longitudinal signal
              ingestion, Clinical Intelligence, a multidisciplinary care team, and the partner health system's EMR and
              clinical workflow. Cadence says its agents monitor vitals daily, surface risk, support medication changes,
              and provide lifestyle coaching under clinical protocols and human supervision. Public third-party material
              also identifies AWS, Kubernetes, Terraform, and GitHub Actions in the hiring surface, but that signal is
              insufficient to verify production topology or resilience. The integration claim is consequently credible
              at the workflow level while the implementation details remain a diligence item.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
              - CE012
      - number: '5.3'
        title: Maturity, automation, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Cadence's strongest disclosed differentiation is the combination of an EMR-native product, its own
              clinical operating layer, and data generated through continuous care delivery. Company materials report
              85,000 clinician hours returned annually, 99% of alerts resolved without physician escalation, and a
              3.5-minute median response time for incoming vital alerts; the funding announcement separately says 55%
              are resolved without human adjustment. These measures are directionally consistent with workflow
              automation, but their denominators and definitions differ and should not be treated as one conversion
              funnel. The scale signal is meaningful, while independent validation of the automation metrics remains
              limited in this assigned evidence set.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE016
      - number: '5.4'
        title: Controls, roadmap, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The public control model is clinician-supervised: Cadence describes safety guardrails, health-system
              protocols, and physician control over consequential decisions. HypertensionOS's reported selection for the
              FDA TEMPO pilot is evidence of regulatory engagement, not evidence of approval or clearance. Cadence says
              new capital will support additional health-system expansion, AI-agent development, and value-based-care
              models, which increases the importance of change control, monitoring, and auditable protocol governance.
              The retained evidence does not establish security certifications, privacy architecture, uptime history,
              disaster recovery objectives, model-validation methods, or incident-response performance; those remain
              material underwriting gaps rather than proof that the controls are absent.
            claimRefs:
              - CE003
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product and service are integrated
            body: >-
              Cadence's offering joins device data, workflow software, clinical labor, and EMR integration, reducing the
              handoff burden that can limit dashboard-only RPM programs.
            calloutType: strength
            claimRefs:
              - CE004
              - CE006
              - CE010
          - type: callout
            title: Public controls evidence trails product claims
            body: >-
              TEMPO participation is not clearance, and the assigned evidence does not verify security certifications,
              model-governance controls, uptime, or disaster-recovery targets.
            calloutType: risk
            claimRefs:
              - CE012
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer model and segments
        blocks:
          - type: paragraph
            body: >-
              Cadence operates a multi-stakeholder model in which health systems are the principal institutional buyers
              and workflow owners, clinicians use an EMR-integrated care service, and older adults with hypertension,
              heart failure, or type 2 diabetes are the end users. The company says its model is reimbursed through
              billing infrastructure and at-risk contracts, making payer economics and health-system implementation part
              of the buying decision rather than an afterthought. Public evidence also distinguishes several care
              surfaces: remote patient care, preventive primary care, and post-acute support. This breadth can expand
              account value, but it also creates multiple approval, integration, enrollment, and reimbursement steps
              before a named affiliation becomes durable utilization.
            claimRefs:
              - CU001
              - CU005
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption trajectory and reference quality
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal is the June 2026 scale claim of more than 100,000 active patients and more
              than 20 health systems, reported by Cadence and repeated by an independent trade publication. A
              customer-issued April 2026 announcement described a base of more than 90,000 patients, while an
              independent company profile lists a longer trajectory from more than 18,000 patients in March 2024 to more
              than 100,000 in June 2026. Named evidence includes Duke Health, Texas Health Resources, and Memorial
              Hermann, but the sources mostly establish affiliations or planned service introductions. They do not
              disclose deployment-level enrolled populations, contract value, or customer-specific clinical outcomes, so
              the named references should not be treated as equivalent to mature, fully quantified production accounts.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Cadence's disclosed operating model creates a plausible expansion path from initial health-system
              affiliation through EMR integration, patient enrollment, continuous monitoring, clinical response, and
              additional care programs. Company-reported operating metrics indicate substantial activity, including
              24,000 medication titrations in 2025, 85,000 clinician hours returned annually, 99% of alerts resolved
              without physician escalation, and 4.9/5 patient satisfaction. These metrics do not substitute for
              retention evidence: the assigned public sources disclose no NRR, GRR, churn, renewal rate, contract
              length, or cohort retention. They also do not quantify revenue or patient concentration by health system,
              payer, or channel. Health-system investors and affiliations may support distribution, but they also make
              procurement, integration, and partner dependence central diligence questions.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible across patient and system counts
            body: >-
              Cadence's more-than-100,000 active-patient and more-than-20-system claims are repeated by independent
              trade coverage and accompanied by several named health-system relationships.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU005
          - type: callout
            title: Durability and concentration remain private
            body: >-
              Public adoption counts do not reveal renewals, churn, cohort retention, contract length, or concentration
              by health system and payer, limiting underwriting of revenue durability.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and reimbursement path
        blocks:
          - type: paragraph
            body: >-
              HypertensionOS is operating inside a novel policy pathway rather than on the strength of a conventional
              clearance. Reporting on the TEMPO pilot says participation is neither FDA clearance nor an endorsement of
              effectiveness; it instead permits controlled deployment under enforcement discretion while evidence is
              generated. The bounded scope, licensed-user requirement, and excluded patient groups reduce immediate
              clinical exposure, but they also constrain addressable use and make evidence quality a commercialization
              dependency. Payment risk is similarly material. STAT reports first-year ACCESS payments of $180-$420 per
              patient, with full payment contingent on outcomes, versus roughly $100 per month under a common RPM model.
              The investment case therefore depends on automation lowering clinical labor enough to offset lower,
              outcome-contingent reimbursement without weakening escalation or prescribing controls.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR014
      - number: '7.2'
        title: Clinical operations, quality, and security
        blocks:
          - type: paragraph
            body: >-
              Cadence presents a human-in-the-loop architecture: AI agents perform protocol-driven work, physicians
              retain control, and most alerts are resolved without physician escalation. Those controls are
              directionally appropriate, but the reported scale of automation creates a large monitoring surface.
              Cadence says it completed 24,000 medication titrations in 2025, while its evidence page reports that 75%
              of a hypertension cohort still measured vitals at six months. Device continuity, patient nonresponse,
              alert quality, medication-review latency, and escalation staffing are therefore operating controls rather
              than implementation details. The retained evidence describes what a buyer should verify for privacy and
              PHI handling, but it does not disclose Cadence's certifications, incident history, access-control testing,
              recovery objectives, or device-replacement service levels. Absence of those disclosures is a diligence
              gap, not evidence that incidents have or have not occurred.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Partner, dependency, and financial exposure
        blocks:
          - type: paragraph
            body: >-
              Cadence reports more than 100,000 active patients across more than 20 health systems, which demonstrates
              scale but does not reveal revenue concentration, renewal rights, termination exposure, or payer mix.
              Delivery also depends on connected devices, EHR integration, a clinical workforce, and reimbursement
              programs; disruption in any layer can impair both outcomes and billability. Public financial visibility
              remains thin. An independent profile says Cadence has not published dollar revenue or profit while
              reporting that annual recurring revenue tripled in 2025. The June 2026 financing is evidence of capital
              raised, not current cash, burn, or runway. Until management provides partner-level economics, gross margin
              after clinical labor and devices, claims-denial experience, and liquidity, the residual exposure is
              execution risk rather than a quantifiable solvency conclusion.
            claimRefs:
              - CR003
              - CR008
              - CR011
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR008
              - CR011
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Monitoring framework and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk posture should be monitored through evidence that maps directly to the operating model.
              Regulatory progress means a defined path beyond pilot discretion and prospective safety evidence in the
              intended population. Reimbursement resilience means positive contribution margin under ACCESS payment
              bands after clinical labor, devices, support, and outcome adjustments. Clinical resilience means stable
              adverse-event rates, alert precision, medication-review latency, device uptime, and six-month engagement
              as patient volume grows. Commercial resilience means no single health system or payer can materially
              impair revenue through nonrenewal. A failure to produce auditable controls for medication changes and PHI,
              a material patient-safety event attributable to automation, loss of the regulatory pathway, or
              persistently negative cohort contribution margin should break the thesis rather than be treated as a
              temporary execution miss.
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory progress is not product clearance
            body: >-
              TEMPO participation enables evidence generation under enforcement discretion; it should not be
              underwritten as approval or as proof of effectiveness.
            calloutType: risk
            claimRefs:
              - CR004
          - type: callout
            title: Condition the thesis on auditable controls
            body: >-
              Require prospective safety, security, concentration, and cohort-economics evidence before treating
              clinical scale or funding raised as proof of durable risk reduction.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and an unproven valuation stance.
              The June 2026 Series C supplies a transaction marker of approximately $1.2 billion to $1.23 billion
              post-money, not proof that the price offers an attractive risk-adjusted return. Cadence reports meaningful
              operating scale, and third-party commentary points to substantial 2026 revenue, but no public source in
              the assigned evidence set provides current audited revenue, gross margin, cash burn, retention, or cash
              available after the round. Those omissions make a target return, hold period, and exit value
              non-quantifiable without private diligence. Entry should therefore be conditioned on financial
              verification and security terms rather than company quality alone.
            claimRefs:
              - CV002
              - CV004
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV010
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Cadence announced a $100 million Series C led by Spark Capital, with the company and multiple independent
              summaries identifying a broad investor syndicate. Third-party sources place the post-money value between
              $1.2 billion and $1.23 billion. Dividing that mark by SiliconSnark's Forbes-attributed forecast of $140
              million in annualized revenue at year-end 2026 produces an illustrative 8.6x to 8.8x multiple, but this is
              a forward-looking annualized-revenue comparison rather than a current ARR or audited-revenue multiple. The
              same transaction figures imply roughly 8.1% to 8.3% primary dilution before option-pool changes,
              liquidation preferences, participation rights, debt, and other securities. Because those terms are not
              public, headline post-money value is an incomplete measure of common-equity entry economics.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
      - number: '8.3'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on scale, workflow integration, and evidence that supervised automation can extend scarce
              clinical capacity. Cadence says it treats more than 100,000 active patients across more than 20 health
              systems and reports lower admissions in its cited research. It also publishes two operational automation
              measures with different denominators: alerts resolved without human adjustment and alerts resolved without
              physician escalation. These should not be merged into one autonomy metric. The anti-thesis is that
              reimbursement scrutiny, clinician oversight, health-system procurement, and regulatory execution may keep
              the business services-heavy while the current valuation anticipates software-like leverage. Selected
              digital-health IPO revenue multiples provide directional context, but their dates, business mixes,
              liquidity, and accounting bases differ too much to validate Cadence's private round price directly.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately signal-based rather than a false-precision valuation model. A bull
              case requires verified revenue scale, improving gross margin as supervised AI expands, durable
              reimbursement, and evidence that new health-system deployments do not add proportionate clinical labor. A
              base case assumes continued adoption but treats the June 2026 financing as the only public price marker
              until financial and preference data are supplied. A bear case is triggered by reimbursement compression,
              delayed regulated-AI deployment, weak retention, or labor intensity that does not decline. Exit readiness
              remains uncertain because the evidence set does not establish profitability, audited controls, or a clean
              preference stack. The final diligence request is a cohort-level revenue, margin, retention, labor, cash,
              and capitalization package reconciled to the financing documents.
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is observable; value is not yet underwritable
            body: >-
              The Series C establishes a private-market mark, but the evidence set does not support a target return or
              fair-value range without current financials and security terms.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV012
              - CV013
              - CV015
          - type: callout
            title: Do not conflate automation metrics
            body: >-
              Cadence's 55% no-human-adjustment and 99% no-physician-escalation figures describe different operational
              thresholds and cannot be combined into a single autonomy rate.
            calloutType: risk
            claimRefs:
              - CV009
