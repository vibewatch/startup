        label: Workflow integration depth
        min: 1
        max: 5
        low: Standalone or tool-layer
        high: Embedded in health-system workflows
        description: Analyst ordinal coding from retained product and partnership descriptions
        scale: ordinal
      yAxis:
        label: Care-delivery ownership
        min: 1
        max: 5
        low: Software or device enablement
        high: Staffed longitudinal clinical service
        description: Analyst ordinal coding from retained descriptions, not measured clinical quality
        scale: ordinal
      points:
