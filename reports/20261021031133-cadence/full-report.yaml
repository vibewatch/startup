chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Cadence Solutions, Inc. was founded in 2020 and is headquartered in New York. Its service combines
              connected monitoring devices, an EMR-integrated workflow, supervised AI agents, and a dedicated clinical
              team to manage hypertension, heart failure, and type 2 diabetes between office visits. Chris Altchek is
              the founder and chief executive, while Kareem Zaki is identified as a cofounder. This is more
              operationally intensive than a software-only monitoring dashboard: Cadence participates in care delivery
              and insurer reimbursement while embedding into health-system workflows. That integration may strengthen
              retention, but it also makes clinical labor, reimbursement rules, and partner execution central
              dependencies rather than peripheral implementation details.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO014
      - number: '1.2'
        title: Financing and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Cadence announced a $100 million Series C on June 23, 2026, led by Spark Capital. STAT reported a $1.23
              billion post-money valuation, while a separate company profile rounds the figure to $1.2 billion; the
              difference is treated as rounding rather than a conflicting financing event. Disclosed equity funding
              totals $241 million across the 2021 launch financing, the 2021 Series B, and the 2026 Series C. The round
              also brought health-system investors into the syndicate and added Spark partner Will Reed to the board.
              Those affiliations may aid distribution, but public evidence does not establish voting control, founder
              ownership, liquidation preferences, secondary activity, debt, or cash available after the financing.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO013
              - CO014
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO013
              - CO014
      - number: '1.3'
        title: Scale and disclosure
        blocks:
          - type: paragraph
            body: >-
              By June 2026, Cadence said it served more than 100,000 active patients and worked with over 20 health
              systems. Its financing announcement also said annual recurring revenue tripled during 2025, but neither
              that announcement nor the reviewed company profile supplies a dollar ARR, revenue, profit, gross-margin,
              burn, or runway figure. A third-party company profile lists 516 employees, which is useful directional
              evidence but not a company-confirmed current headcount. The resulting scale picture is therefore strongest
              on patient and partner counts, weaker on workforce verification, and insufficient for deriving revenue per
              patient, capital efficiency, or cash runway. Funding raised must not be read as cash currently available.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO015
      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Cadence progressed from a 2020 founding and 2021 venture rounds to product extensions in preventive,
              post-acute, and regulated hypertension care before its 2026 financing. The company profile reports
              launches of the Proactive Care Engine and AHA Connected Care in 2025 and selection of HypertensionOS for
              the FDA TEMPO pilot in August 2026. The principal adverse signal is business-model exposure rather than a
              documented company-specific enforcement action: STAT reported scrutiny of remote-monitoring reimbursement
              by the federal health department's watchdog and UnitedHealthcare, including concerns that the framework
              may enable low-quality care. Investors should verify billing quality, clinical oversight, and payer
              durability alongside the undisclosed governance and financial data.
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO010
              - CO011
              - CO012
              - CO014
