  - id: FU001
    title: Health-system customer journey and expansion loop
    type: journey-map
    summary: >-
      The public evidence supports a staged path from institutional affiliation to additional care programs, while
      leaving conversion, timing, and retention at each stage undisclosed.
    data:
      items:
        - label: Health-system selection
          detail: Institution evaluates clinical evidence, capacity impact, reimbursement, and strategic fit.
          touchpoints:
            - Executive sponsor
            - Clinical leadership
            - Procurement
        - label: Clinical and EMR integration
          detail: Cadence embeds into medical groups, electronic records, and clinical workflows.
          touchpoints:
            - EMR workflow
            - Clinical protocols
            - Cadence medical group
        - label: Patient enrollment
          detail: Eligible older adults enter remote or preventive chronic-care programs.
          touchpoints:
            - Eligibility
            - Consent
            - Connected devices
        - label: Continuous monitoring
          detail: Vitals, symptoms, medications, and engagement signals are monitored between visits.
          touchpoints:
            - Home readings
            - AI-supported review
            - Risk flags
        - label: Clinical response
          detail: Care teams triage alerts, support medication changes, and coach patients.
          touchpoints:
            - Triage
            - Medication support
            - Lifestyle coaching
        - label: Account expansion
          detail: >-
            A relationship may extend across conditions, sites, preventive care, post-acute care, or value-based
            contracts.
          touchpoints:
            - Additional programs
            - More patient cohorts
            - Value-based care
