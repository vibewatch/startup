        - label: Health-system workflow
          detail: Cadence returns relevant context to the partner's existing care process.
          modules:
            - EMR integration
            - Physician escalation
        - label: Governance boundary
          detail: Protocols and clinical supervision constrain disclosed AI-agent activity.
          modules:
            - Health-system protocols
