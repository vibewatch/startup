    - type: private-evidence-only
      severity: material
      topic: privacy-security
      missingEvidence: >-
        Independent security assurance, certification scope, penetration results, incident history,
        BAA and subprocessor terms, tested recovery objectives, and cyber-insurance coverage.
      whyItMatters: >-
        Cadence handles PHI across connected devices, EHR workflows, support access, and clinical
        operations, so assurance quality affects patient safety, compliance, and partner retention.
      diligencePath: >-
        Review the current security audit package, architecture and data-flow diagrams, incident
        register, access-control test results, BAA/subprocessor schedules, RTO/RPO tests, and insurance terms.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: partner-concentration
      missingEvidence: >-
        Revenue, enrollment, gross margin, renewal, termination, payer, code, EHR, device-vendor,
        and clinical-capacity concentration by counterparty and cohort.
      whyItMatters: >-
        A broad logo count cannot show whether one partner, payer, workflow integration, supplier,
        or staffing pool creates a material single point of failure.
      diligencePath: >-
        Obtain top-ten customer and payer schedules, contract renewal and termination calendars,
        cohort contribution margins, claims-denial data, vendor shares, staffing ratios, and redundancy plans.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR003]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-register
      missingEvidence: >-
        Comprehensive federal and state licenses, prescribing and corporate-practice analyses,
        billing audits, investigations, litigation, complaints, enforcement history, and insurance claims.
      whyItMatters: >-
        The public pool supports three material pathways but cannot establish a complete legal and
        regulatory population or prove the absence of disputes and enforcement.
      diligencePath: >-
        Request counsel's regulatory matrix, license inventory, billing-audit history, litigation
        schedule, complaint log, insurer notices, and all material regulator correspondence.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-durability
      missingEvidence: >-
        Dollar revenue, gross margin after clinical labor and devices, burn, unrestricted cash,
        runway, claims denials, outcome adjustments, and condition-level contribution margins.
      whyItMatters: >-
        Funding raised and percentage growth do not establish cash available or whether the
        outcome-linked care model scales economically.
      diligencePath: >-
        Review monthly financial statements, cash reconciliation, board plan, cohort contribution
        margins by condition and payer, claims-denial waterfall, staffing productivity, and downside runway.
      relatedQuestionRefs: [QR007]
      relatedTableRefs: [TR003]
