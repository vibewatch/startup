artifact: risks
slug: cadence
runDate: "2026-10-21"
company:
  name: Cadence
chapter:
  number: 7
  title: Risks
  summary: >-
    Cadence's central risk is not whether supervised clinical AI can create value, but whether
    medication-management automation can preserve safety, regulatory eligibility, and attractive
    economics as the platform scales. Public evidence shows meaningful clinical outcomes and
    clinician controls, while leaving security posture, partner concentration, unit economics,
    and the durable authorization path insufficiently disclosed.
sections:
  - id: regulatory-and-reimbursement
    title: Regulatory and reimbursement path
    body: >-
      HypertensionOS is operating inside a novel policy pathway rather than on the strength of a
      conventional clearance. Reporting on the TEMPO pilot says participation is neither FDA
      clearance nor an endorsement of effectiveness; it instead permits controlled deployment
      under enforcement discretion while evidence is generated. The bounded scope, licensed-user
      requirement, and excluded patient groups reduce immediate clinical exposure, but they also
      constrain addressable use and make evidence quality a commercialization dependency. Payment
      risk is similarly material. STAT reports first-year ACCESS payments of $180-$420 per patient,
      with full payment contingent on outcomes, versus roughly $100 per month under a common RPM
      model. The investment case therefore depends on automation lowering clinical labor enough to
      offset lower, outcome-contingent reimbursement without weakening escalation or prescribing
      controls.
    claimRefs: [CR004, CR005, CR006, CR009, CR014]
    tableRefs: [TR001]
  - id: clinical-operations-and-security
    title: Clinical operations, quality, and security
    body: >-
      Cadence presents a human-in-the-loop architecture: AI agents perform protocol-driven work,
      physicians retain control, and most alerts are resolved without physician escalation.
      Those controls are directionally appropriate, but the reported scale of automation creates
      a large monitoring surface. Cadence says it completed 24,000 medication titrations in 2025,
      while its evidence page reports that 75% of a hypertension cohort still measured vitals at
      six months. Device continuity, patient nonresponse, alert quality, medication-review latency,
      and escalation staffing are therefore operating controls rather than implementation details.
      The retained evidence describes what a buyer should verify for privacy and PHI handling, but
      it does not disclose Cadence's certifications, incident history, access-control testing,
      recovery objectives, or device-replacement service levels. Absence of those disclosures is
      a diligence gap, not evidence that incidents have or have not occurred.
    claimRefs: [CR001, CR002, CR010, CR011, CR012, CR013]
    tableRefs: [TR002]
  - id: dependency-and-financial-exposure
    title: Partner, dependency, and financial exposure
    body: >-
      Cadence reports more than 100,000 active patients across more than 20 health systems, which
      demonstrates scale but does not reveal revenue concentration, renewal rights, termination
      exposure, or payer mix. Delivery also depends on connected devices, EHR integration, a
      clinical workforce, and reimbursement programs; disruption in any layer can impair both
      outcomes and billability. Public financial visibility remains thin. An independent profile
      says Cadence has not published dollar revenue or profit while reporting that annual recurring
      revenue tripled in 2025. The June 2026 financing is evidence of capital raised, not current
      cash, burn, or runway. Until management provides partner-level economics, gross margin after
      clinical labor and devices, claims-denial experience, and liquidity, the residual exposure is
      execution risk rather than a quantifiable solvency conclusion.
    claimRefs: [CR003, CR008, CR011, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring framework and thesis-break triggers
    body: >-
      The risk posture should be monitored through evidence that maps directly to the operating
      model. Regulatory progress means a defined path beyond pilot discretion and prospective
      safety evidence in the intended population. Reimbursement resilience means positive
      contribution margin under ACCESS payment bands after clinical labor, devices, support, and
      outcome adjustments. Clinical resilience means stable adverse-event rates, alert precision,
      medication-review latency, device uptime, and six-month engagement as patient volume grows.
      Commercial resilience means no single health system or payer can materially impair revenue
      through nonrenewal. A failure to produce auditable controls for medication changes and PHI,
      a material patient-safety event attributable to automation, loss of the regulatory pathway,
      or persistently negative cohort contribution margin should break the thesis rather than be
      treated as a temporary execution miss.
    claimRefs: [CR004, CR006, CR009, CR010, CR012, CR013, CR015, CR016]
    figureRefs: [FR001]
tables:
