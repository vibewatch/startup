    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved evidence
    rows:
      - - "Incorrect or delayed medication action"
        - "Unquantified across 24,000 reported 2025 titrations"
        - High
        - "Documented concept: clinician supervision, bounded eligibility, and protocol checks"
        - "Model error, stale data, or review latency can affect treatment"
        - "Prospective adverse-event rate, override rate, audit-log completeness, and review-time distribution"
      - - "Missed deterioration or alert overload"
        - "Scale exposure is current; error frequency is undisclosed"
        - High
        - "Company reports 99% of alerts resolved without physician escalation"
        - "A high auto-resolution rate does not disclose false negatives, severity mix, or delayed escalations"
        - "Sensitivity by condition, false-negative review, severity-weighted escalation, and staffing stress tests"
      - - "Device dropout or patient nonresponse"
        - "Observed engagement attrition is possible; company reports 75% measuring at six months"
        - Medium-high
        - "Connected-device model and clinical triage are described"
        - "Missing readings can weaken both care and outcome-linked payment"
        - "Device uptime, replacement time, nonresponse protocol, engagement by demographic group, and billability effects"
      - - "PHI, EHR, or access-control failure"
        - "Unquantified; no incident inference is made"
        - High
        - "Public diligence guidance identifies consent, access, retention, integrations, and support access"
        - "Certifications, testing cadence, incident history, recovery objectives, and subcontractor controls are not disclosed"
        - "Security audit, penetration results, BAA/subprocessor list, incident log, RTO/RPO, and cyber-insurance terms"
    notes: >-
      Risk ratings are conditional on the cited workflow and scale evidence; missing incident,
      model-performance, staffing, and security data are shown as gaps rather than estimated events.
    claimRefs: [CR001, CR002, CR005, CR010, CR011, CR012, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - "Reimbursement and outcome thresholds"
        - "CMS / ACCESS and RPM-related payment pathways"
        - "Payment bands are public; payer and code mix are not"
        - "Lower payment, missed outcome target, denial, or policy change compresses unit economics"
        - High
        - "Outcome-accountable design helps, but condition-level contribution margin and denial sensitivity remain private"
      - - "Health-system distribution and EHR workflow"
        - "More than 20 reported health systems provide patient access and workflow integration"
        - "No partner-level revenue, enrollment, renewal, or termination distribution disclosed"
        - "Large partner loss or integration disruption reduces enrollment, data continuity, and revenue"
        - High
        - "Multi-system footprint offers breadth; require top-five concentration, renewal schedule, and portability plan"
      - - "Connected devices and clinical-service capacity"
        - "Device vendors, connectivity, Cadence clinical team, and licensed prescribers"
        - "Vendor shares and staffing ratios are not disclosed"
        - "Supply interruption, connectivity failure, or staffing bottleneck delays monitoring and escalation"
        - Medium-high
        - "Integrated service model creates control but also fixed obligations; require redundancy, inventory, and surge-capacity evidence"
    notes: >-
      Public sources establish the dependency categories but not contract concentration, vendor
      shares, payer mix, denial rates, staffing ratios, or termination rights; all such quantities remain gaps.
    claimRefs: [CR003, CR006, CR008, CR011, CR014, CR015, CR016]
figures:
  - id: FR001
    title: Residual risk and thesis-break matrix
    type: matrix
    summary: >-
      Six evidence-linked risk domains translated into monitorable exposure and explicit investment triggers.
    data:
      columns:
        - Evidence basis
        - Residual exposure
        - Thesis-break trigger
      rows:
        - label: Regulatory pathway
          values:
            - "TEMPO participation is not clearance"
            - "High until a durable pathway and safety evidence are documented"
            - "Loss of pilot pathway or failure to establish an authorization route"
        - label: Reimbursement
          values:
            - "ACCESS pays $180-$420 in year one and conditions full payment on outcomes"
            - "Margin depends on automation, condition mix, and outcome attainment"
            - "Negative cohort contribution margin at contracted payment bands"
        - label: Medication safety
          values:
            - "Bounded scope and clinician control are described"
            - "Adverse-event and override distributions are not public"
            - "Material automation-attributable safety event or unauditable medication change"
        - label: Privacy and security
          values:
            - "Control categories are identifiable, but assurance evidence is absent"
            - "Incident frequency and recovery readiness are unquantified"
            - "Material PHI breach or inability to evidence tested recovery and access controls"
        - label: Partner concentration
          values:
            - "More than 20 health systems are reported"
            - "Revenue and enrollment distribution are not disclosed"
            - "A single nonrenewal can materially impair revenue or patient scale"
        - label: Financial durability
          values:
            - "ARR growth is reported, but dollar revenue and profit are not"
            - "Funding raised does not establish cash available, burn, or runway"
            - "Runway under 18 months without a credible path to positive cohort economics"
    approximationNotes: >-
      Qualitative matrix; no numeric probability is estimated. Triggers are diligence thresholds
      derived from the cited operating model and identified disclosure gaps.
    claimRefs: [CR004, CR006, CR010, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Regulatory progress is not product clearance
    body: >-
      TEMPO participation enables evidence generation under enforcement discretion; it should not
      be underwritten as approval or as proof of effectiveness.
    claimRefs: [CR004]
  - calloutType: recommendation
    title: Condition the thesis on auditable controls
    body: >-
      Require prospective safety, security, concentration, and cohort-economics evidence before
      treating clinical scale or funding raised as proof of durable risk reduction.
    claimRefs: [CR009, CR010, CR015, CR016]
