company:
  name: "Cadence"
chapter:
  number: 3
  title: "Competitors"
  summary: "Cadence is positioned as an embedded clinical service rather than a monitoring dashboard, combining supervised automation, a medical group, and health-system workflow integration. That packaging is differentiated in the retained evidence, but the competitive moat remains provisional because peer capabilities, realized pricing, switching behavior, and independent head-to-head outcomes are not publicly comparable."
sections:
  - id: "landscape-and-buyer-alternatives"
    title: "Landscape and buyer alternatives"
    body: >-
      The relevant competitive set is broader than pure remote-patient-monitoring software. The retained registry identifies scaled managed-care peers including HealthSnap, Health Recovery Solutions, TimeDoc Health, and CoachCare, while the buyer can also assemble devices, monitoring software, internal clinical operations, and existing episodic care. Cadence reported more than 100,000 active patients across more than 20 health systems in June 2026 and raised a $100 million Series C, giving it meaningful scale and capital for expansion. Peer scale is not trivial: the retained registry attributes about 80,000 patient programs across about 200 systems and groups to HealthSnap, more than 400 provider organizations to Health Recovery Solutions, and more than 150,000 patients to CoachCare. Those figures come from one low-reputation registry and are directional rather than independently verified benchmarks. Internal build and the status quo remain material substitutes because health systems retain clinical protocols, existing patient relationships, and workflow control even when they outsource monitoring and care-team capacity.
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
    tableRefs:
      - "TP001"
  - id: "service-model-and-capabilities"
    title: "Service model, capabilities, and trust posture"
    body: >-
      Cadence's clearest supported distinction is operating-model depth. Independent coverage describes the company as a clinical service rather than only a monitoring platform, supported by a medical group with more than 300 staff. Customer and partner materials describe supervised agents reviewing daily data while clinicians complete medication recommendations inside the health system's existing care relationship. Cadence and secondary coverage also describe direct electronic-medical-record and workflow integration. The company reports a 3.5-minute median response time for incoming vitals alerts and says 55% are resolved without human adjustment, but these operating metrics are company-originated and are not a neutral comparison with peers. The capability matrix therefore records only features stated in retained sources and marks unsupported competitor cells as unknown. Cadence appears more vertically integrated than a device-dashboard vendor, yet that conclusion does not establish superior safety, outcomes, regulatory posture, or total cost against named alternatives.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
    tableRefs:
      - "TP002"
  - id: "commercial-model-and-switching"
    title: "Commercial model, distribution power, and switching"
    body: >-
      Public commercial evidence is thin. One industry-operator commentary says Cadence charges insurers a monthly remote-care fee rather than a per-alert or per-device fee; no retained source provides the fee, realized contract price, discounting, minimum commitment, reimbursement split, or contract duration. Distribution is supported more clearly: Cadence embeds into health-system medical groups, clinical protocols, electronic records, and branded care relationships. That integration likely creates implementation and process-switching friction, because replacement would require reworking workflows and clinical accountability rather than swapping a standalone dashboard. It does not prove contractual lock-in, exclusivity, low churn, or an inability to multi-home. Health-system venture participation and customer references may strengthen channel access, but they should not be treated as independent product validation. The central diligence need is contract-level evidence comparing Cadence's net economics and implementation burden with managed RPM peers and an internal-build case.
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP010"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moat-durability-and-displacement"
    title: "Moat durability and displacement risk"
    body: >-
      The defensible thesis is not that Cadence alone can monitor chronic-care patients. Retained descriptions show competitors offering devices, RPM, chronic-care management, Advanced Primary Care Management, staffed monitoring, and national clinical teams. Cadence's stronger case is the combination of workflow integration, clinical-service ownership, health-system distribution, reported operating responsiveness, and evidence claims. Even that combination may be replicated or unbundled: managed-care peers can deepen clinical services, health systems can internalize higher-value workflows, and incumbent workflow vendors could extend from the electronic record into supervised automation. The positioning map is therefore an evidence-constrained taxonomy, not a performance ranking; its ordinal coordinates encode only the service ownership and integration described in the retained sources. No independent head-to-head benchmark, competitor pricing set, win-loss data, churn evidence, or adverse competitor study was available. Durability depends on proving outcome and economic superiority after implementation, not merely on attaching AI to a familiar RPM model.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP006"
      - "CP007"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
      - "CP016"
    figureRefs:
      - "FP001"
