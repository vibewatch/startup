artifact: product-tech
slug: cadence
runDate: "2026-10-21"
company:
  name: Cadence
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Cadence combines connected-device monitoring, EMR-embedded software, supervised AI
    agents, and a physician-led clinical team across preventive, chronic, and post-acute
    care. The public evidence describes a scaled operating model and measurable workflow
    automation, but it does not establish the underlying model architecture, security
    certifications, service levels, or full regulatory status.
sections:
  - id: product-workflow
    title: Product portfolio and customer workflow
    body: >-
      Cadence is delivered as a clinical service rather than a standalone monitoring
      dashboard. Its public portfolio spans 24/7 Preventive Primary Care, Remote Patient
      Care, Post-Acute Care, and the narrower HypertensionOS prescription-software
      program. Across these products, the workflow begins with home measurements and
      engagement signals, moves through risk identification and protocol-driven action,
      and escalates decisions that require clinical judgment. The model therefore bundles
      software, connected devices, clinical operations, and workflow integration. This
      breadth is strategically useful because it addresses the health system's labor
      constraint, but it also means product quality depends on coordinated service
      delivery rather than software performance alone.
    claimRefs: [CE001, CE002, CE003, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: architecture-and-integration
    title: Architecture and operating model
    body: >-
      The observable architecture has five layers: patient devices and interactions,
      longitudinal signal ingestion, Clinical Intelligence, a multidisciplinary care
      team, and the partner health system's EMR and clinical workflow. Cadence says its
      agents monitor vitals daily, surface risk, support medication changes, and provide
      lifestyle coaching under clinical protocols and human supervision. Public
      third-party material also identifies AWS, Kubernetes, Terraform, and GitHub Actions
      in the hiring surface, but that signal is insufficient to verify production topology
      or resilience. The integration claim is consequently credible at the workflow
      level while the implementation details remain a diligence item.
    claimRefs: [CE003, CE004, CE005, CE006, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity, automation, and differentiation
    body: >-
      Cadence's strongest disclosed differentiation is the combination of an EMR-native
      product, its own clinical operating layer, and data generated through continuous
      care delivery. Company materials report 85,000 clinician hours returned annually,
      99% of alerts resolved without physician escalation, and a 3.5-minute median
      response time for incoming vital alerts; the funding announcement separately says
      55% are resolved without human adjustment. These measures are directionally
      consistent with workflow automation, but their denominators and definitions differ
      and should not be treated as one conversion funnel. The scale signal is meaningful,
      while independent validation of the automation metrics remains limited in this
      assigned evidence set.
    claimRefs: [CE007, CE008, CE009, CE016]
  - id: controls-roadmap-and-risk
    title: Controls, roadmap, and technical risk
    body: >-
      The public control model is clinician-supervised: Cadence describes safety
      guardrails, health-system protocols, and physician control over consequential
      decisions. HypertensionOS's reported selection for the FDA TEMPO pilot is evidence
      of regulatory engagement, not evidence of approval or clearance. Cadence says new
      capital will support additional health-system expansion, AI-agent development, and
      value-based-care models, which increases the importance of change control,
      monitoring, and auditable protocol governance. The retained evidence does not
      establish security certifications, privacy architecture, uptime history, disaster
      recovery objectives, model-validation methods, or incident-response performance;
      those remain material underwriting gaps rather than proof that the controls are
      absent.
    claimRefs: [CE003, CE012, CE013, CE014, CE015]
tables:
  - id: TE001
    title: Product module and care-model matrix
    columns:
      - Product or module
      - Primary user or buyer
      - Public maturity signal
      - Differentiation
      - Diligence gap
    rows:
      - - 24/7 Preventive Primary Care
        - Primary-care practices and Medicare-focused health systems
        - Marketed as an active care model
        - Care-gap closure, coaching, and between-visit access
        - Enrollment, utilization, and contract-level performance are undisclosed
      - - Remote Patient Care
        - Chronic-care clinicians and patients with hypertension, heart failure, or diabetes
        - Core service with daily monitoring and medication-management workflows
        - Connected devices plus a physician-led care team and EMR integration
        - Device fleet reliability and integration implementation data are undisclosed
      - - Post-Acute Care
        - Hospital and cardiology teams managing discharge recovery
        - Marketed as a deployed post-discharge model
        - Home recovery support intended to shorten stays and reduce readmissions
        - Program-level deployment volume and comparative performance are undisclosed
      - - HypertensionOS
        - Licensed prescribers treating Stage 2 hypertension
        - Reported as selected for the FDA TEMPO pilot
        - Protocol-bounded support for initiation and titration
        - TEMPO participation is not FDA approval or clearance
    notes: >-
      Statuses reflect the retained public pages as of 2026-10-21; they do not establish
      contract availability, regulatory clearance, or production volume for each module.
    claimRefs: [CE001, CE002, CE006, CE012]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Existing friction
      - Cadence workflow
      - Disclosed benefit signal
      - Limitation
    rows:
      - - Detect deterioration between visits
        - Monthly encounters miss daily changes
        - Track vitals, symptoms, medications, and engagement, then flag risk
        - Earlier signal routing is described
        - Sensitivity, specificity, and false-alert rates are not disclosed
      - - Manage routine alerts
        - Clinician inbox capacity is constrained
        - AI and the Cadence care team resolve routine work and escalate exceptions
        - 99% reported without physician escalation
        - Denominator and independent audit are not provided
      - - Adjust chronic-disease medication
        - Titration can lag between appointments
        - Protocol-guided recommendations support clinician-supervised changes
        - 24,000 medication titrations reported for 2025
        - Automation boundary and override rate are not disclosed
      - - Coordinate with the health system
        - Separate tools can create workflow fragmentation
        - Embed signals and actions in the partner EMR and clinical workflow
        - Company describes no new system required
        - Supported EMRs, integration time, and maintenance burden are not enumerated
    notes: >-
      Benefits are company-reported operating signals, not a controlled comparison; null
      denominators and integration details require customer references and raw logs.
    claimRefs: [CE002, CE003, CE004, CE007, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Public dependency
      - Principal risk
    rows:
      - - Patient edge
        - Capture home vitals and patient-reported needs
        - Cellular blood-pressure cuffs, scales, and glucose meters
        - Device adherence, connectivity, calibration, and replacement logistics
      - - Clinical Intelligence
        - Combine signals, identify risk, and propose protocol-driven action
        - Longitudinal patient data and configured clinical protocols
        - Model drift, alert quality, explainability, and change control
      - - Clinical operations
        - Triage, coach, titrate, and escalate exceptions
        - Multidisciplinary physician-led care team
        - Staffing coverage, licensure, handoffs, and escalation consistency
      - - Health-system integration
        - Return relevant context and actions to the care workflow
        - Partner EMR and medical-group processes
        - Interface reliability, data mapping, access control, and implementation burden
    notes: >-
      This architecture is reconstructed from public product descriptions and an
      independent company profile; production topology, vendors, controls, and SLAs remain unverified.
    claimRefs: [CE004, CE005, CE006, CE010, CE011]
figures:
  - id: FE001
    title: Observable product architecture
    type: stack
    summary: >-
      The disclosed product is a vertically integrated care stack whose performance
      depends on devices, data, AI, clinical operations, and health-system integration.
    data:
      layers:
        - label: Patient experience
          detail: Patient-facing measurements and communication initiate the care workflow.
          modules:
            - Home vital measurements
            - Symptom and medication messages
        - label: Connected edge
          detail: Cellular devices capture condition-specific measurements in the home.
          modules:
            - Blood-pressure cuffs
            - Scales
            - Glucose meters
        - label: Clinical Intelligence
          detail: Software organizes longitudinal signals and supports protocol-driven action.
          modules:
            - Risk identification
            - Protocol-driven recommendations
        - label: Care delivery
          detail: The clinical team handles routine work and escalates consequential decisions.
          modules:
            - Clinical triage
            - Medication titration
            - Lifestyle coaching
        - label: Health-system workflow
          detail: Cadence returns relevant context to the partner's existing care process.
          modules:
            - EMR integration
            - Physician escalation
        - label: Governance boundary
          detail: Protocols and clinical supervision constrain disclosed AI-agent activity.
          modules:
            - Health-system protocols
            - Human supervision
    approximationNotes: >-
      Layering is an analyst reconstruction of disclosed functions, not a verified
      production-system diagram; no infrastructure boundaries or data flows are inferred.
    claimRefs: [CE003, CE004, CE005, CE006, CE011, CE012]
callouts:
  - calloutType: strength
    title: Product and service are integrated
    body: >-
      Cadence's offering joins device data, workflow software, clinical labor, and EMR
      integration, reducing the handoff burden that can limit dashboard-only RPM programs.
    claimRefs: [CE004, CE006, CE010]
  - calloutType: risk
    title: Public controls evidence trails product claims
    body: >-
      TEMPO participation is not clearance, and the assigned evidence does not verify
      security certifications, model-governance controls, uptime, or disaster-recovery targets.
    claimRefs: [CE012, CE014, CE015]
