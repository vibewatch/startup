  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-and-privacy
      missingEvidence: >-
        Current certification reports, penetration-test summaries, privacy architecture,
        access-control design, and model-governance documentation.
      whyItMatters: >-
        The platform handles clinical data and influences medication workflows, so control
        failures could create patient-safety, privacy, and health-system liability exposure.
      diligencePath: >-
        Obtain current SOC 2 or HITRUST reports, security questionnaires, data-flow diagrams,
        model cards, change-control records, and the last two penetration-test summaries.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: >-
        A public status history, uptime calculation, recovery objectives, escalation
        performance, and incident postmortems tied to production deployments.
      whyItMatters: >-
        Continuous chronic-care monitoring depends on resilient device, data, software,
        and clinical-operation handoffs.
      diligencePath: >-
        Request 24 months of uptime and incident data, contractual SLAs, RTO and RPO targets,
        business-continuity test results, and device-connectivity failure rates.
      relatedQuestionRefs: [QE004]
      relatedTableRefs: [TE002, TE003]
    - type: private-evidence-only
      severity: material
      topic: product-architecture
      missingEvidence: >-
        Verified production topology, model architecture, evaluation methodology, supported
        EMR interfaces, integration lead times, and technical ownership boundaries.
      whyItMatters: >-
        Public workflow descriptions do not establish scalability, technical defensibility,
        implementation burden, or the division of responsibility with health systems.
      diligencePath: >-
        Conduct an architecture review and request system diagrams, integration runbooks,
        model-evaluation packs, dependency inventories, and three implementation retrospectives.
      relatedQuestionRefs: [QE003, QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: regulatory-status
      missingEvidence: >-
        Primary FDA documentation defining HypertensionOS's TEMPO scope, device classification,
        evidence obligations, and current authorization status.
      whyItMatters: >-
        Pilot participation cannot be treated as approval, clearance, or validation of all
        product claims and clinical workflows.
      diligencePath: >-
        Obtain the FDA pilot record, regulatory correspondence, intended-use statement,
        risk classification, validation protocol, and counsel's current status memorandum.
      relatedQuestionRefs: [QE008]
