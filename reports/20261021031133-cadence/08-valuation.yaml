company:
  name: "Cadence"
chapter:
  number: 8
  title: "Valuation"
  summary: "Cadence's June 2026 financing establishes a roughly $1.2 billion private-market reference point, but public evidence does not disclose current absolute revenue, margins, cash burn, preference terms, or a complete capitalization table. The appropriate stance is research-more at the current mark: operating scale and reported clinical outcomes support continued tracking, while reimbursement exposure and the absence of decision-grade financial inputs prevent a defensible return model."
sections:
  - id: "decision"
    title: "Decision and valuation stance"
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and an
      unproven valuation stance. The June 2026 Series C supplies a transaction marker
      of approximately $1.2 billion to $1.23 billion post-money, not proof that the
      price offers an attractive risk-adjusted return. Cadence reports meaningful
      operating scale, and third-party commentary points to substantial 2026 revenue,
      but no public source in the assigned evidence set provides current audited
      revenue, gross margin, cash burn, retention, or cash available after the round.
      Those omissions make a target return, hold period, and exit value non-quantifiable
      without private diligence. Entry should therefore be conditioned on financial
      verification and security terms rather than company quality alone.
    claimRefs: ["CV002", "CV004", "CV012", "CV015", "CV016"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "financing-context"
    title: "Financing context and entry discipline"
    body: >-
      Cadence announced a $100 million Series C led by Spark Capital, with the company
      and multiple independent summaries identifying a broad investor syndicate.
      Third-party sources place the post-money value between $1.2 billion and $1.23
      billion. Dividing that mark by SiliconSnark's Forbes-attributed forecast of $140
      million in annualized revenue at year-end 2026 produces an illustrative 8.6x to
      8.8x multiple, but this is a forward-looking annualized-revenue comparison rather
      than a current ARR or audited-revenue multiple. The same transaction figures
      imply roughly 8.1% to 8.3% primary dilution before option-pool changes,
      liquidation preferences, participation rights, debt, and other securities.
      Because those terms are not public, headline post-money value is an incomplete
      measure of common-equity entry economics.
    claimRefs: ["CV001", "CV002", "CV004", "CV005", "CV006", "CV012", "CV013"]
  - id: "thesis-and-antithesis"
    title: "Thesis, anti-thesis, and comparable context"
    body: >-
      The thesis rests on scale, workflow integration, and evidence that supervised
      automation can extend scarce clinical capacity. Cadence says it treats more than
      100,000 active patients across more than 20 health systems and reports lower
      admissions in its cited research. It also publishes two operational automation
      measures with different denominators: alerts resolved without human adjustment
      and alerts resolved without physician escalation. These should not be merged into
      one autonomy metric. The anti-thesis is that reimbursement scrutiny, clinician
      oversight, health-system procurement, and regulatory execution may keep the
      business services-heavy while the current valuation anticipates software-like
      leverage. Selected digital-health IPO revenue multiples provide directional
      context, but their dates, business mixes, liquidity, and accounting bases differ
      too much to validate Cadence's private round price directly.
    claimRefs: ["CV007", "CV008", "CV009", "CV010", "CV011", "CV014"]
    tableRefs: ["TV002"]
  - id: "scenarios-and-diligence"
    title: "Scenarios, exit readiness, and diligence asks"
    body: >-
      The scenario framework is deliberately signal-based rather than a false-precision
      valuation model. A bull case requires verified revenue scale, improving gross
      margin as supervised AI expands, durable reimbursement, and evidence that new
      health-system deployments do not add proportionate clinical labor. A base case
      assumes continued adoption but treats the June 2026 financing as the only public
      price marker until financial and preference data are supplied. A bear case is
      triggered by reimbursement compression, delayed regulated-AI deployment, weak
      retention, or labor intensity that does not decline. Exit readiness remains
      uncertain because the evidence set does not establish profitability, audited
      controls, or a clean preference stack. The final diligence request is a
      cohort-level revenue, margin, retention, labor, cash, and capitalization package
      reconciled to the financing documents.
    claimRefs: ["CV003", "CV009", "CV010", "CV012", "CV013", "CV015", "CV016"]
    tableRefs: ["TV003"]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Dimension", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Research more / track", "Do not underwrite a new entry until financial and security-term diligence closes the identified gaps."]
      - ["Confidence", "Medium", "The financing and scale markers are corroborated, but decision-grade financial inputs remain private."]
      - ["Risk rating", "High", "Reimbursement, regulatory execution, clinical-labor intensity, and preference terms can materially change common-equity returns."]
      - ["Valuation stance", "Unproven at approximately $1.2B-$1.23B post-money", "Treat the June 2026 round as a price marker, not independent evidence of fair value."]
    notes: "Assessments use the June 2026 financing and currently retained public evidence; no audited valuation model, security terms, or target-return range is available."
    claimRefs: ["CV002", "CV004", "CV010", "CV012", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Lens", "Evidence-based argument", "What would change the view"]
    rows:
      - ["Thesis", "Cadence reports 100,000+ active patients across 20+ health systems and a 27% reduction in hospital admissions.", "Confirm that growth cohorts retain patients and contribution margin while clinical labor per patient declines."]
      - ["Anti-thesis", "Independent commentary identifies reimbursement, regulatory, procurement, and clinical-oversight constraints that may limit operating leverage.", "Durable payer contracts, a clear regulatory pathway, and audited margin expansion would reduce this concern."]
      - ["Swing factor", "Cadence reports automation measures, but the 55% no-human-adjustment and 99% no-physician-escalation metrics use different denominators.", "Provide a reconciled operating funnel from alerts to AI action, clinical review, escalation, and outcome."]
    notes: "Company outcome and automation measures are reported claims; the two alert-resolution percentages are not presented as comparable."
    claimRefs: ["CV007", "CV008", "CV009", "CV010", "CV011"]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Scenario", "Assumptions and signals", "Valuation / return logic", "Downside trigger"]
    rows:
      - ["Bull", "Verified revenue reaches the reported year-end trajectory; gross margin expands; reimbursement remains durable; AI lowers labor intensity.", "A premium to selected digital-health IPO revenue references may become defensible, but no numeric return range is supportable without audited revenue and entry terms.", "Growth requires proportional clinical hiring or regulated-AI deployment stalls."]
      - ["Base", "Health-system and patient growth continues, while margin, retention, and cash conversion remain undisclosed.", "Use the June 2026 post-money mark only as a transaction reference and defer a target return until private diligence is complete.", "The next financing requires weaker price or investor protections that subordinate new common-equity economics."]
      - ["Bear", "Payer pressure compresses reimbursement before automation reduces cost; procurement slows; retention or clinical outcomes weaken.", "Public evidence cannot bound downside because liquidation preferences, debt, cash, and burn are unavailable.", "Material reimbursement change, adverse regulatory outcome, declining cohort economics, or an insider-led down round."]
    notes: "Scenarios are qualitative because public evidence lacks audited revenue, margins, burn, retention, cash, debt, and preference terms; no unsupported valuation range or probability is assigned."
    claimRefs: ["CV002", "CV004", "CV005", "CV010", "CV012", "CV013", "CV014", "CV015", "CV016"]
figures:
