    title: "Recommendation logic"
    type: "flow"
    summary: "The decision path moves from demonstrated operating scale through proof and unresolved risks to a research-more recommendation."
    data:
      nodes:
        - id: "scale"
          label: "Scale"
          detail: "100,000+ active patients and 20+ health systems are company-reported."
        - id: "proof"
          label: "Clinical proof"
          detail: "Cadence reports a 27% reduction in hospital admissions."
        - id: "automation"
          label: "Automation evidence"
          detail: "Published alert-resolution measures have different denominators and need reconciliation."
        - id: "risk"
          label: "Execution risk"
          detail: "Reimbursement, regulation, procurement, and labor intensity remain material."
        - id: "price"
          label: "Price support"
          detail: "The $1.2B-$1.23B round mark lacks public audited revenue, margin, and preference support."
        - id: "decision"
          label: "Research more"
          detail: "Require financial, cohort, and capitalization diligence before underwriting an entry."
      edges:
        - from: "scale"
          to: "proof"
        - from: "proof"
          to: "automation"
        - from: "automation"
          to: "risk"
        - from: "risk"
          to: "price"
        - from: "price"
          to: "decision"
    approximationNotes: "This is a decision sequence, not a probability-weighted or value-proportional diagram."
    claimRefs: ["CV007", "CV008", "CV009", "CV010", "CV012", "CV015"]
callouts:
  - calloutType: "recommendation"
    title: "Price is observable; value is not yet underwritable"
    body: "The Series C establishes a private-market mark, but the evidence set does not support a target return or fair-value range without current financials and security terms."
    claimRefs: ["CV002", "CV012", "CV013", "CV015"]
  - calloutType: "risk"
    title: "Do not conflate automation metrics"
    body: "Cadence's 55% no-human-adjustment and 99% no-physician-escalation figures describe different operational thresholds and cannot be combined into a single autonomy rate."
    claimRefs: ["CV009"]
