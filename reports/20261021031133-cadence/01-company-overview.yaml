callouts:
  - calloutType: "risk"
    title: "Reimbursement scrutiny is a core diligence dependency"
    body: >-
      STAT reported that remote-monitoring reimbursement supporting much of Cadence's
      business has drawn scrutiny from the federal health department's watchdog and
      UnitedHealthcare. This is evidence of sector and model risk, not proof of a
      Cadence-specific violation.
    claimRefs:
      - "CO010"
      - "CO011"
