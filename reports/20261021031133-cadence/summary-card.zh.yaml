  topStrengths:
    - 超过 20 个医疗系统里的活跃患者超过 100,000 人，说明业务已经具备一定运营规模。
    - 一体化临床服务模式把联网设备、受监督的自动化和临床人员把关组合在一起。
    - $100 million 的 Series C，以及公司自报 2025 年 ARR 增长至三倍，支撑继续投入增长。
  topRisks:
    - 报销和监管变化可能削弱外包远程慢病管理的经济性。
    - 绝对收入、利润率、留存、烧钱速度、现金跑道和患者层面的单位经济性仍未披露。
    - 安全保障、可靠性历史，以及药物管理自动化能否获得长期授权，都需要通过私下尽调核实。
    - 公开客户数无法说明续约质量，也无法说明客户在医疗系统、支付方或渠道之间的集中度。
  unresolvedGaps:
    - 经审计收入、ARR bridge、毛利率、临床人力成本、烧钱速度、现金余额和现金跑道。
    - 客户续约、留存、合同期限、扩张，以及按医疗系统和支付方划分的集中度。
    - 独立安全保障、事故历史、正常运行时间、恢复目标和模型治理控制。
    - 完整的监管与法律事项清单，包括 HypertensionOS 的授权路径和报销风险敞口。
    - 完全摊薄后的股权结构、融资优先权、债务、董事会构成和投资人控制权。
