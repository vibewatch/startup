    sections:
      - number: '7.1'
        title: 监管与报销路径
        blocks:
          - type: paragraph
            body: >-
              HypertensionOS 处于一条新颖的政策路径中，而不是依靠传统许可运行。关于 TEMPO 试点的报道称，参与既不是 FDA
              许可，也不是对效果的认可；它是在生成证据的同时，根据执法裁量允许受控部署。有限的范围、持证用户要求和被排除的患者群体降低了近期临床暴露，但也限制了可服务用途，使证据质量成为商业化依赖。付款风险同样重大。STAT
              报道 ACCESS 首年每位患者支付 $180-$420，且全额支付取决于结果；常见 RPM 模式下约为 $100 /
              月。因此，投资判断取决于自动化能否将临床人力成本降到足以抵消较低且与结果挂钩的报销，同时不削弱升级处理或处方控制。
            claimRefs:
              - CR004
