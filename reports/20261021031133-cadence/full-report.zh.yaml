            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              医疗系统及其医疗集团是已被证实的机构买方，患者和医疗系统临床医生是日常用户。Cadence
              称报销通过计费基础设施和风险共担合同实现，但公开材料未披露付款方结构、合同分配、定价或负责预算的高管。因此，采用似乎依赖一套整合式临床服务销售，而不是单独的软件采购：联网设备采集读数，Cadence
              团队负责日常监测和升级处理，工作流再接回医疗系统。报道中的产能收益和向更多系统扩张是有用的需求信号，但采购周期和实施成本仍未量化。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              临床医生短缺、庞大的慢病负担，以及医疗系统希望在不同比例增加医生人数的情况下管理门诊间患者，共同支撑需求。Cadence 还称住院率下降
              27%，第三方报道则描述其向更多医疗系统和价值医疗扩张。主要采用约束包括信任、临床问责、报销持续性，以及患者对 AI 医疗设备的接受度；TechTarget 报道，2025
              年一项调查中有三分之一受访者担心其安全性。对估值而言，部署增长说明产品市场有拉力，但不能替代市场收入、单位经济、付款方集中度、实施成本或独立核验的 ROI。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把广义分母资本化
            body: 56 million 人的需求估计，在缺少疾病重叠、资格、报销、采用、留存、定价和服务产能数据时，不能换算成收入。
            calloutType: risk
            claimRefs:
              - CM005
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不止纯远程患者监测软件。保留的登记资料列出 HealthSnap、Health Recovery Solutions、TimeDoc Health 和 CoachCare
              等规模化管理式护理同业；买方也可以自行组合设备、监测软件、内部临床运营和现有的间歇性护理。Cadence 称 2026 年 6 月已覆盖超过 20 个医疗系统中的逾 100,000 名活跃患者，并完成 $100
              million Series C，为扩张提供了可观的规模和资本。同业规模也不小：保留的登记资料称 HealthSnap 覆盖约 200 个系统和医疗集团中的约 80,000 个患者项目，Health
              Recovery Solutions 服务超过 400 个医疗服务机构，CoachCare 覆盖超过 150,000
              名患者。这些数字来自一个信誉较低的登记库，只能作为方向性信息，不能视为独立核验的基准。内部自建和现状仍是重要替代方案，因为即便医疗系统外包监测和护理团队产能，它们仍掌握临床协议、既有患者关系和工作流控制。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: 服务模式、能力与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Cadence 得到最清晰支持的差异化在于运营模式深度。独立报道将其描述为临床服务，而非单纯监测平台，并称其背后有一支超过 300 人的医疗团队。客户和合作方材料称，受监督的 agents
              每日审阅数据，临床医生在医疗系统既有护理关系中完成用药建议。Cadence 及二手报道还描述了其与电子病历和工作流的直接整合。公司称收到生命体征警报后的响应中位数为 3.5 分钟，并称其中 55%
              无需人工调整即可解决，但这些运营指标来自公司自身，不适合与同业作中性比较。因此，能力矩阵只记录保留来源明确提到的功能，未获支持的竞争对手单元格标为未知。Cadence
              看起来比设备仪表盘供应商更垂直整合，但这不能证明其相较于所列替代方案拥有更高的安全性、效果、监管水平或更低的总成本。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: 商业模式、分销能力与切换
        blocks:
          - type: paragraph
            body: >-
              公开商业证据很薄弱。一位行业运营者称，Cadence
              向保险公司收取按月远程护理费，而不是按警报或设备收费；保留的来源没有提供该费用、实际合同价格、折扣、最低承诺、报销分成或合同期限。分销方面的证据更清晰：Cadence
              嵌入医疗系统的医疗集团、临床协议、电子记录和品牌护理关系。这种整合可能带来实施和流程切换摩擦，因为替换它需要重做工作流和临床问责，而不是简单换掉一个独立仪表盘。但这不能证明存在合同锁定、排他性、低流失或无法多平台并用。医疗系统参与风投和客户推荐可能加强渠道进入，但不应视为独立的产品验证。核心尽调需要合同层面的证据，将
              Cadence 的净经济性和实施负担与管理式 RPM 同业及内部自建方案比较。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP015
      - number: '3.4'
        title: 壁垒持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              可辩护的论点不是 Cadence 独自拥有监测慢病患者的能力。保留的描述显示，竞争者也提供设备、RPM、慢病管理、Advanced Primary Care
              Management、人工监测和全国性临床团队。Cadence
              更有力的论据在于工作流整合、临床服务所有权、医疗系统分销、已报告的运营响应速度和证据主张。即便如此，这种组合仍可能被复制或拆分：管理式护理同业可以加深临床服务，医疗系统可以把高价值工作流收回内部，既有工作流供应商也可能从电子记录延伸到受监督的自动化。因此，定位图是受证据约束的分类，而不是业绩排名；其序数坐标只编码保留来源描述的服务所有权和整合程度。没有独立的正面对比基准、竞争对手定价集合、输赢数据、流失证据或不利竞争者研究可用。持久性取决于实施后能否证明效果和经济性更优，而不只是把
              AI 接到熟悉的 RPM 模式上。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 差异化有一定可能，持久性尚未证实
            body: Cadence 的整合和临床服务所有权可以制造切换摩擦，但管理式护理方案彼此重叠，壁垒持久性仍取决于独立证明更好的效果和经济性。
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入引擎与定价
        blocks:
          - type: paragraph
            body: >-
              Cadence 描述的是混合收入引擎，而非简单的软件订阅：护理通过计费基础设施和风险共担合同获得报销，预防性初级护理产品则以 Medicare
              覆盖为卖点。一位行业运营者另称其按月向保险公司收费，而不是按警报或设备收费，但该说法不是合同，不能证明实际价格。公开信息中最清晰的费率来自 ACCESS 模式：STAT 报道，首年每位患者收费 $180 至
              $420，取决于病情，且全额付款取决于结果。STAT 还称，这一金额明显低于常见 RPM 模式下约 $100 / 月的水平。因此，该组合可以产生经常性收入，但价格、代码组合、折扣和结果风险分配仍属非公开信息。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
          - type: table
