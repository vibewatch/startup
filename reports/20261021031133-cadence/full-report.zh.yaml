  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是为患有高血压、心力衰竭、2 型糖尿病和 COPD 的老年人提供门诊间的持续性临床管理护理。Cadence 将联网设备、接入 EMR
              的工作流、受监督的自动化和医生主导的临床团队结合起来，因此比泛数字医疗更聚焦，也比纯设备远程患者监测更依赖服务。现状可能是间歇性的线下管理、人工跟进收件箱，或由医疗系统负责分诊和干预的监测仪表盘。分配到的搜索池也筛查了同名的
              Cadence Design Systems；其半导体市场业绩不能作为 Cadence Solutions 的证据。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM016
      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有来源支持三种不同且不可互换的测算视角。广义需求估计称，美国有 56 million 名老年人患有慢病；Cadence 称当前部署覆盖超过 20 个医疗系统中的逾 100,000
              名活跃患者；公司还提出在本十年末治疗 100 万人的目标。它们分别是人口分母、已观察到的公司触达范围和公司目标，不是 TAM、SAM 和
              SOM。保留的来源没有给出可信的市场收入规模、CAGR、疾病层面的重叠调整、按报销加权的可服务人口或付款方结构。因此，在缺少理赔、报销、留存和产能数据时，估值模型不应把这些数字直接换算成收入机会。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
