        blocks:
          - type: paragraph
            body: >-
              Cadence 从 2020 年成立和 2021 年的风险融资，发展到 2026 年融资前在预防性护理、急性后期护理和受监管高血压护理领域扩展产品。公司简介称，Proactive Care Engine 和
              AHA Connected Care 于 2025 年推出，HypertensionOS 于 2026 年 8 月入选 FDA TEMPO
              试点。主要不利信号是商业模式暴露，而不是已有记录的公司特定执法行动：STAT 报道，联邦卫生部门的监察机构和 UnitedHealthcare
              正审查远程监测报销，包括担忧该框架可能助长低质量护理。投资者应在核查治理和财务数据的同时，验证计费质量、临床监督和付款方持续性。
