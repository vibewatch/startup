chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Cadence Solutions, Inc. 成立于 2020 年，总部位于纽约。其服务将联网监测设备、接入 EMR 的工作流、受监督的 AI agents
              和专门的临床团队结合起来，在门诊之间管理高血压、心力衰竭和 2 型糖尿病。Chris Altchek 是创始人兼 CEO，Kareem Zaki
              被列为联合创始人。与纯软件监测仪表盘相比，这种模式的运营投入更重：Cadence
              参与护理交付和保险报销，并嵌入医疗系统工作流。这种整合可能提升留存，但也让临床人力、报销规则和合作方执行成为核心依赖，而不是边缘性的实施细节。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO014
      - number: '1.2'
        title: 融资与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Cadence 于 2026 年 6 月 23 日宣布完成由 Spark Capital 领投的 $100 million Series C。STAT 报道其投后估值为 $1.23
              billion，另一份公司简介则四舍五入为 $1.2 billion；这里将差异视为四舍五入，而非相互冲突的融资事件。已披露股权融资合计 $241 million，来自 2021 年启动融资、2021 年
              Series B 和 2026 年 Series C。本轮还将医疗系统投资者纳入银团，并让 Spark 合伙人 Will Reed
              加入董事会。这些关系可能有助于分销，但公开证据无法确认投票控制权、创始人持股、清算优先权、老股转让、债务或融资后可用现金。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO013
              - CO014
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO013
              - CO014
      - number: '1.3'
        title: 规模与披露
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Cadence 称已服务逾 100,000 名活跃患者，并与超过 20 个医疗系统合作。其融资公告还称，年度经常性收入在 2025
              年增长至三倍，但该公告和审阅过的公司简介均未给出美元口径的 ARR、收入、利润、毛利率、现金消耗或现金跑道。一份第三方公司简介列出 516
              名员工，这可作为方向性证据，但不是公司确认的当前员工数。因此，现有规模画像在患者数和合作方数量上最清晰，在员工数核验上较弱，也不足以推导单患者收入、资本效率或现金跑道。融资额不能被解读为当前可用现金。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
