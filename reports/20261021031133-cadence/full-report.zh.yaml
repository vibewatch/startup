              整合、临床人员和报销项目；任何一层受扰都可能损害结果和可计费性。公开财务可见度仍然很低。一份独立简介称 Cadence 尚未公布美元收入或利润，同时报告年度经常性收入在 2025 年增长至三倍。2026 年 6
