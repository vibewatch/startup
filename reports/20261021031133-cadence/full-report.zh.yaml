        - 美国；州级执业、处方、监督和计费职责需要按部署审查
        - 取决于部署；公开证据未量化不合规程度
        - 控制失效时为高
        - 医生控制、临床监督、预设资格和升级机制
        - 获取逐州责任矩阵、常规医嘱、审计日志和不良事件审查流程
      - - 与结果挂钩的 Medicare 报销
        - 美国；据报告 ACCESS 首年每位患者支付 $180-$420，全部付款取决于结果
        - 当前模式设计暴露
        - 中高
        - AI 支持的运营模式和对结果负责的服务设计
        - 获取各付款档位、按病情拆分的模式贡献利润，并在未达到结果阈值时测试下行空间
    notes: 该登记表仅覆盖部分公开来源，按潜在投资影响排序；可能性标签描述已有证据的依赖，或明确保持未量化；没有保留的来源能建立完整的诉讼、执法、许可或州级执业历史。
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible U.S. regulatory and reimbursement issues identified in the assigned evidence pool as of the run
        date; private legal records and state-by-state analyses excluded.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR009
      - CR014
  - id: TR002
    title: 运营、质量与安全风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余暴露
      - 未解决的证据
    rows:
      - - 用药操作错误或延迟
        - 在据报告的 2025 年 24,000 次滴定中尚未量化
        - 高
        - 已有记录的概念：临床监督、限定资格和方案检查
        - 模型错误、数据过时或审查延迟都可能影响治疗
        - 前瞻性不良事件率、人工覆盖率、审计日志完整性和审查时长分布
      - - 漏掉病情恶化或告警过载
        - 当前存在规模暴露；错误频率未披露
        - 高
        - 公司称 99% 的告警无需医生升级即可解决
        - 较高的自动解决率没有披露假阴性、严重性构成或升级延迟
        - 按病情拆分的敏感度、假阴性审查、按严重性加权的升级和人员压力测试
      - - 设备掉线或患者无响应
        - 可能出现参与度流失；公司称六个月时 75% 仍在测量
        - 中高
        - 已描述连接设备模式和临床分诊
        - 读数缺失会削弱照护和与结果挂钩的付款
        - 设备在线时间、更换时间、无响应方案、按人口群体拆分的参与度和可计费性影响
      - - PHI、EHR 或访问控制失效
        - 尚未量化；不据此推断发生过事件
        - 高
        - 公开尽调指南列出同意、访问、留存、集成和支持访问
        - 认证、测试频率、事件历史、恢复目标和分包商控制未披露
        - 安全审计、渗透测试结果、BAA / 子处理方名单、事件日志、RTO / RPO 和网络保险条款
    notes: 风险评级取决于所引工作流和规模证据；缺失的事件、模型表现、人员和安全数据列为缺口，而非估算事件。
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR010
      - CR011
      - CR012
      - CR013
  - id: TR003
    title: 合作方与依赖风险登记表
    columns:
      - 依赖
      - 交易对手 / 角色
      - 集中度证据
      - 失效情景
      - 严重性
      - 缓释措施与剩余暴露
    rows:
      - - 报销与结果阈值
        - CMS / ACCESS 及 RPM 相关付款路径
        - 付款档位公开；付款方和代码组合不公开
        - 付款降低、未达结果目标、拒付或政策变化会压缩单位经济性
        - 高
        - 对结果负责的设计有帮助，但按病情拆分的贡献利润和对拒付的敏感度仍属非公开信息
      - - 医疗系统分销与 EHR 工作流
        - 据报告超过 20 个医疗系统提供患者触达和工作流集成
        - 未披露按合作方拆分的收入、入组、续约或终止分布
        - 大型合作方流失或集成中断会减少入组、数据连续性和收入
        - 高
        - 多系统覆盖带来广度；需获取前五大集中度、续约计划和可迁移方案
      - - 连接设备与临床服务能力
        - 设备供应商、连接服务、Cadence 临床团队和持证处方医生
        - 供应商份额和人员配比未披露
        - 供应中断、连接故障或人员瓶颈会延迟监测和升级
        - 中高
        - 一体化服务模式带来控制力，也带来固定义务；需获取冗余、库存和峰值容量证据
    notes: 公开来源确立了依赖类别，但没有提供合同集中度、供应商份额、付款方组合、拒付率、人员配比或终止权；这些数量全部仍是缺口。
    claimRefs:
      - CR003
      - CR006
      - CR008
      - CR011
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: 建议总结
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究 / 跟踪
        - 在财务和安全条款尽调补齐已识别缺口前，不要对新的进入机会做投资判断。
      - - 置信度
        - 中
        - 融资和规模指标得到交叉印证，但达到决策标准的财务输入仍属非公开信息。
      - - 风险评级
        - 高
        - 报销、监管执行、临床人力密度和优先权条款可能实质性改变普通股回报。
      - - 估值立场
        - 在约 $1.2B-$1.23B 投后估值下尚未证实
        - 将 2026 年 6 月轮次视为价格标记，而不是公允价值的独立证据。
    notes: 评估采用 2026 年 6 月融资和当前保留的公开证据；没有经审计的估值模型、安全条款或目标回报区间。
    claimRefs:
      - CV002
      - CV004
      - CV010
      - CV012
      - CV015
      - CV016
  - id: TV002
    title: 论点与反论点
    columns:
      - 视角
      - 基于证据的论点
      - 哪些信息会改变判断
    rows:
      - - 论点
        - Cadence 称覆盖 20+ 个医疗系统、拥有 100,000+ 名活跃患者，并将住院率降低 27%。
        - 确认增长队列能够留住患者并守住贡献利润，同时每位患者的临床人力投入下降。
      - - 反论点
        - 独立评论指出，报销、监管、采购和临床监督约束可能限制运营杠杆。
        - 持久的付款方合同、清晰的监管路径和经审计的利润率扩张将缓解这一担忧。
      - - 关键摆动因素
        - Cadence 报告了自动化指标，但 55% 的无需人工调整和 99% 的无需医生升级使用不同分母。
        - 提供从告警到 AI 操作、临床审查、升级和结果的对账后运营漏斗。
    notes: 据公司报告，结果和自动化指标属于公司口径；两个告警解决率没有被作为可比数据呈现。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 牛市、基准与熊市情景
    columns:
      - 情景
      - 假设与信号
      - 估值 / 回报逻辑
      - 下行触发因素
    rows:
      - - 牛市
        - 经核实的收入达到报告的年末轨迹；毛利率扩张；报销保持稳定；AI 降低人力投入。
        - 相对于选定数字医疗 IPO 收入参照的溢价可能变得有理有据，但在没有经审计收入和进入条款前，无法支持任何数值回报区间。
        - 增长需要同比例增加临床人员，否则受监管的 AI 部署会停滞。
      - - 基准
        - 医疗系统和患者数量仍在增长，但利润率、留存率和现金转化率尚未披露。
        - 仅将 2026 年 6 月的投后估值作为交易参考；在完成私有资料尽调前，不设定目标回报。
        - 下一轮融资需要更低的价格，或需要投资人保护条款来压低新普通股的经济权益。
      - - 熊市情景
        - 在自动化降低成本前，支付方压力会压缩报销；采购放缓；留存率或临床结果走弱。
        - 由于清算优先权、债务、现金和烧钱情况均不可得，公开证据无法界定下行空间。
        - 报销机制发生重大变化、监管结果不利、客户群经济性下滑，或由内部人士主导的下轮融资。
    notes: 公开证据缺少经审计的收入、利润率、烧钱、留存、现金、债务和优先权条款，因此情景仅作定性描述；不赋予未经支持的估值区间或概率。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
