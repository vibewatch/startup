        title: 展示项
        blocks:
          - type: callout
            title: 价格可观察，价值尚不足以支撑投资判断
            body: Series C 确立了一个私募市场估值标记，但没有当前财务数据和证券条款，证据集不足以支持目标回报或公允价值区间。
