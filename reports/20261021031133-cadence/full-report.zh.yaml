        title: 展示项
        blocks:
          - type: callout
            title: 报销审查是核心尽调依赖
            body: STAT 报道，支撑 Cadence 大部分业务的远程监测报销，已受到联邦卫生部门监察机构和 UnitedHealthcare 的审查。这说明行业和模式风险，不等于 Cadence 存在特定违规。
            calloutType: risk
            claimRefs:
