            - 人工监督
    approximationNotes: 分层是分析师根据已披露功能重构的示意，不是经过验证的生产系统图；不推断基础设施边界或数据流。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE011
      - CE012
  - id: FU001
    title: 医疗系统客户旅程与扩张循环
    type: journey-map
    summary: 公开证据支持从机构合作关系走向更多护理项目的分阶段路径，但每个阶段的转化率、时间和留存情况仍未披露。
    data:
      items:
        - label: 医疗系统选择
          detail: 机构评估临床证据、对承载能力的影响、报销和战略契合度。
          touchpoints:
            - 高管赞助人
            - 临床领导层
            - 采购
        - label: 临床与 EMR 整合
          detail: Cadence 嵌入医疗集团、电子病历和临床工作流。
          touchpoints:
            - EMR 工作流
            - 临床协议
            - Cadence 医疗集团
        - label: 患者入组
          detail: 符合条件的老年人进入远程或预防性慢性病护理项目。
          touchpoints:
            - 资格
            - 同意
            - 连接设备
        - label: 持续监测
          detail: 在两次就诊之间持续监测生命体征、症状、用药和参与度信号。
          touchpoints:
            - 家庭读数
            - AI 辅助审查
            - 风险标记
        - label: 临床响应
          detail: 护理团队分诊警报、支持调整用药，并指导患者。
          touchpoints:
            - 分诊
            - 用药支持
            - 生活方式指导
        - label: 客户扩张
          detail: 一段合作关系可能扩展至不同病症、地点、预防性护理、急性期后护理或价值医疗合同。
          touchpoints:
            - 更多项目
            - 更多患者群体
            - 价值医疗
    approximationNotes: 有序阶段反映已披露的运营模式，不代表实测转化率、耗时，也不证明每个列名客户都完成了每个阶段。
    claimRefs:
      - CU001
      - CU005
      - CU011
      - CU012
      - CU013
      - CU016
  - id: FR001
    title: 剩余风险与论点失效矩阵
    type: matrix
    summary: 将六个与证据挂钩的风险领域转化为可监测敞口和明确的投资触发条件。
    data:
      columns:
        - 证据基础
        - 剩余敞口
        - 论点失效触发条件
      rows:
        - label: 监管路径
          values:
            - 参与 TEMPO 不等于获得许可
            - 在形成稳定路径并记录安全证据前，风险为高
            - 失去试点路径，或未能建立授权路径
        - label: 报销
          values:
            - ACCESS 首年支付 $180-$420，并将全额付款与结果挂钩
            - 利润率取决于自动化、病症组合和结果达成情况
            - 在合同支付区间内，客户群贡献利润为负
        - label: 用药安全
          values:
            - 已描述明确的范围和临床医生控制
            - 不良事件和人工接管分布未公开
            - 发生可归因于自动化的重大安全事件，或无法审计的用药变更
        - label: 隐私与安全
          values:
            - 可识别控制类别，但缺少保障证据
            - 事件频率和恢复准备度尚未量化
            - 发生重大 PHI 泄露，或无法证明恢复和访问控制已通过测试
        - label: 合作伙伴集中度
          values:
            - 据报告已有超过 20 个医疗系统
            - 收入和入组分布未披露
            - 单个客户不续约就可能实质性损害收入或患者规模
        - label: 财务持久性
          values:
            - 据报告 ARR 在增长，但美元收入和利润均未披露
            - 已募资金额不能证明可用现金、烧钱速度或 runway
            - runway 少于 18 个月，且没有可信的客户群经济性转正路径
    approximationNotes: 定性矩阵；不估算数值概率。触发条件源自所引用的运营模式和已识别的信息披露缺口，是尽调阈值。
    claimRefs:
      - CR004
      - CR006
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策路径从已证明的运营规模出发，经过验证和未解决风险，最终指向“继续研究”的建议。
    data:
      nodes:
        - id: scale
          label: 规模
          detail: 公司报告称，已有 100,000+ 名活跃患者和 20+ 个医疗系统。
        - id: proof
          label: 临床验证
          detail: Cadence 报告称住院入院率下降了 27%。
        - id: automation
          label: 自动化证据
          detail: 已发布的警报解决率使用不同分母，需要对齐。
        - id: risk
          label: 执行风险
          detail: 报销、监管、采购和劳动密集度仍是重大风险。
        - id: price
          label: 价格支撑
          detail: $1.2B-$1.23B 的本轮估值缺少公开的经审计收入、利润率和优先权条款支撑。
        - id: decision
          label: 继续研究
          detail: 在评估入场前，需要完成财务、客户群和资本结构尽调。
      edges:
        - from: scale
          to: proof
        - from: proof
          to: automation
        - from: automation
          to: risk
        - from: risk
          to: price
        - from: price
          to: decision
    approximationNotes: 这是决策顺序图，不是按概率加权或按价值比例绘制的图。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV015
