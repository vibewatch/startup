      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Cadence 宣布完成由 Spark Capital 领投的 $100 million Series C，公司和多份独立摘要均列出广泛的投资者银团。第三方来源将投后价值置于 $1.2 billion 至
              $1.23 billion 之间。用这一估值除以 SiliconSnark 引用 Forbes 预测的 2026 年底年化收入 $140 million，得到约 8.6x 至 8.8x
              的示意倍数，但这只是前瞻年化收入比较，不是当前 ARR 或经审计收入倍数。同一组交易数字还意味着在期权池调整、清算优先权、参与权、债务和其他证券之前，一级融资稀释约为 8.1% 至
              8.3%。由于这些条款未公开，表面投后价值并不能完整衡量普通股入场经济性。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
      - number: '8.3'
        title: 投资论点、反论点与可比背景
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在规模、工作流整合，以及受监督自动化可以延伸稀缺临床产能的证据上。Cadence 称其为超过 20 个医疗系统中的逾 100,000
              名活跃患者提供服务，并在引用的研究中报告住院率下降。公司还公布了两个分母不同的运营自动化指标：无需人工调整解决的警报，以及无需医生升级解决的警报。两者不应合并成一个自主性指标。反论点是，报销审查、临床医生监督、医疗系统采购和监管执行，可能让业务保持较重的服务属性，而当前估值却预期软件式杠杆。选取的数字医疗
              IPO 收入倍数只能提供方向性背景，因为它们的日期、业务组合、流动性和会计基础差异过大，无法直接验证 Cadence 私募轮的价格。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景框架刻意以信号为基础，而不是制造虚假精确度的估值模型。乐观情景要求已核验的收入规模、随着受监督 AI
              扩大而改善的毛利率、持久的报销，以及新医疗系统部署不会按比例增加临床人力的证据。基准情景假设采用继续，但在财务和优先权数据提供前，将 2026 年 6 月融资视为唯一公开价格标记。悲观情景由报销压缩、受监管 AI
              部署延迟、留存疲弱或人力密集度不下降触发。由于证据集无法证明盈利能力、经审计控制或清晰的优先股堆叠，退出准备度仍不确定。最终尽调要求是将队列层面的收入、利润率、留存、人力、现金和资本结构资料与融资文件核对一致。
            claimRefs:
