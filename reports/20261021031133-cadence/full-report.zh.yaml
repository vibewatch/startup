              建议为继续研究，信心中等、风险高，估值立场尚未证实。2026 年 6 月 Series C 提供了约 $1.2 billion 至 $1.23 billion
              的投后交易标记，但不能证明这一价格带来有吸引力的风险调整后回报。Cadence 报告了可观的运营规模，第三方评论也指向 2026
              年较高收入，但分配到的证据中没有公开来源提供当前经审计收入、毛利率、现金消耗、留存或融资后可用现金。这些缺口使目标回报、持有期和退出价值在没有私有尽调时无法量化。因此，入场应以财务核验和证券条款为条件，而不是只看公司质量。
            claimRefs:
              - CV002
              - CV004
              - CV012
              - CV015
              - CV016
