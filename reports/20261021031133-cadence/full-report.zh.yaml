            body: >-
              从方向上看，收入质量有吸引力，但公开证据尚不足以支撑投资判断。经常性报销、医疗系统分销和与结果挂钩的合同可以支撑持久需求，ARR
              相对增长和患者规模也显示商业动能。同一模式还带来无法由现有披露量化的劳动、临床服务和报销暴露。公司报告的临床产能提升是有用的运营代理指标，不是毛利率扩张的证据。因此，投资判断取决于私有数据审阅：按收入流和付款方拆分的确认收入、实际价格、毛收入到净收入的扣减、临床人力和设备成本、队列贡献利润率、客户集中度、现金、现金消耗、跑道、债务义务，以及
              RPM 报销下降时的下行情景经济性。
