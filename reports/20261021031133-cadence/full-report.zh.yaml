              付款区间内，扣除临床人力、设备、支持和结果调整后仍有正贡献利润率。临床韧性意味着随着患者量增长，不良事件率、警报精确率、用药审查延迟、设备运行时间和六个月参与度保持稳定。商业韧性意味着任何单一医疗系统或付款方都不能通过不续约实质性损害收入。如果无法为用药变更和
