        blocks:
          - type: paragraph
            body: >-
              Cadence 于 2026 年 6 月完成 $100 million Series C，并称资金将支持医疗系统扩张、AI agent
              开发和价值医疗增长。本轮融资延长了融资能力，但融资额不等于可用现金：没有当前现金、现金消耗、债务、营运资金需求或已承诺的扩张支出，就无法计算现金跑道和下一轮融资触发点。政策暴露进一步加剧这一不确定性。Legis1
              报道，一项拟议的 2027 年 CMS 规则将限制对外包第三方 RPM
              供应商的付款，并要求更多医生参与。由于规则仍是提案而非最终版本，这属于情景风险，不是当前收入损失；但它可能推高交付成本，或挤压基于计费的收入流。
