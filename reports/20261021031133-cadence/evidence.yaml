evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board composition, committee structure, founder responsibilities, succession planning,
      and governance rights.
    whyItMatters: Key-person risk, clinical accountability, and investor control cannot be assessed from the partial public roster.
    diligencePath: >-
      Request the current organization chart, board and committee roster, board minutes, delegated-authority matrix, and
      executive employment agreements.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance-and-capitalization
    missingEvidence: >-
      Fully diluted capitalization, ownership percentages, preference terms, debt, secondaries, option pool, cash
      balance, and restrictions tied to strategic investors.
    whyItMatters: >-
      Headline funding and valuation do not reveal investor control, dilution, liquidation economics, or the capital
      actually available for operations.
    diligencePath: >-
      Obtain the latest cap table, charter, financing documents, debt schedule, secondary transaction records, and
      current bank statements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Absolute ARR, recognized revenue, gross margin, operating loss, cash burn, runway, patient-level unit economics,
      and customer concentration.
    whyItMatters: >-
      A 3x ARR growth claim cannot establish revenue scale, profitability, capital efficiency, or concentration risk
      without denominators and accounting detail.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, ARR bridge, cohort contribution margins, cash
      forecast, and revenue by customer and payer.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A credible market dataset with eligible patients by condition, geography, reimbursement route, pricing, adoption
      rate, and market revenue or CAGR.
    whyItMatters: >-
      Without these inputs, population need and company deployment cannot be converted into a defensible TAM, SAM, SOM,
      growth rate, or valuation multiple.
    diligencePath: >-
      Obtain claims-based covered-life counts and reimbursement schedules, triangulate them with health-system
      procurement data, and build condition-overlap and adoption scenarios.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: reimbursement
    missingEvidence: >-
      Contract-level pricing, payer mix, reimbursement-code exposure, at-risk economics, implementation cost, renewal
      data, and the health-system budget owner.
    whyItMatters: >-
      These variables determine addressable revenue, procurement friction, gross margin, concentration risk, and
      sensitivity to reimbursement policy.
    diligencePath: >-
      Review representative customer contracts, payer invoices, claims remittances, pipeline stages, renewal cohorts,
      and implementation-resource plans in the data room.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      Current first-party product, pricing, customer, security, regulatory, and funding evidence for each named
      competitor and likely EHR-native entrant.
    whyItMatters: >-
      The retained landscape is concentrated in one low-reputation registry, so feature and scale comparisons are
      directional rather than underwritable.
    diligencePath: >-
      Collect current competitor product pages, contracts or procurement records, funding filings, customer references,
      and regulatory materials, then rebuild the profile and capability tables.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP004
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cadence and peer contract duration, exclusivity, implementation cost, churn, renewal, multi-homing, win-loss, and
      displacement data.
    whyItMatters: >-
      Workflow integration suggests friction but does not quantify retention, pricing power, or buyer willingness to
      replace or supplement the service.
    diligencePath: >-
      Review redacted customer contracts and cohort-level renewals, interview lost prospects and former customers, and
      compare implementation plans across at least three alternatives.
    relatedQuestionRefs:
      - QP005
      - QP007
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent head-to-head outcomes, safety, service-level, regulatory, and total-cost benchmarks against named
      competitors and internal build.
    whyItMatters: >-
      Without matched comparisons, Cadence's differentiation and reported operating metrics cannot establish durable
      superiority or rule out commoditization.
    diligencePath: >-
      Commission a matched health-system reference study covering outcomes, alert burden, clinician labor, net
      reimbursement, adverse events, and total implementation cost.
    relatedQuestionRefs:
      - QP009
      - QP010
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized price, discounts, code mix, revenue recognition, payer mix, and revenue by billing versus at-risk
      contract are not public.
    whyItMatters: >-
      Program rate cards and an industry description do not establish Cadence's realized revenue or the durability of
      its recurring revenue.
    diligencePath: Review customer contracts, payer remittances, monthly revenue bridges, and gross-to-net schedules by stream.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, contribution margin, clinical labor cost, device and logistics cost, CAC, sales cycle, and payback
      are unavailable.
    whyItMatters: >-
      Automation and alert-resolution proxies cannot show whether each patient cohort generates positive contribution
      margin.
    diligencePath: Obtain cohort P&Ls with direct-cost allocation, sales-efficiency cohorts, and implementation-cost schedules.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, working-capital needs, debt obligations, committed expansion spend, runway, and the
      next-round trigger are undisclosed.
    whyItMatters: >-
      A financing amount cannot be treated as cash available or converted into runway without uses, liabilities, and
      burn.
    diligencePath: >-
      Review bank statements, the debt schedule, board-approved budget, monthly cash flow, and base and downside runway
      cases.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Absolute ARR, recognized revenue, customer concentration, renewal, retention, and outcome-contract settlement data
      are not disclosed in the retained evidence.
    whyItMatters: >-
      Relative ARR growth and patient scale do not establish revenue scale, concentration, collectability, or
      persistence.
    diligencePath: >-
      Reconcile audited or management financials to contracts and billing data, then review revenue and retention
      cohorts by customer and payer.
    relatedQuestionRefs:
      - QI005
      - QI009
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-and-privacy
    missingEvidence: >-
      Current certification reports, penetration-test summaries, privacy architecture, access-control design, and
      model-governance documentation.
    whyItMatters: >-
      The platform handles clinical data and influences medication workflows, so control failures could create
      patient-safety, privacy, and health-system liability exposure.
    diligencePath: >-
      Obtain current SOC 2 or HITRUST reports, security questionnaires, data-flow diagrams, model cards, change-control
      records, and the last two penetration-test summaries.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      A public status history, uptime calculation, recovery objectives, escalation performance, and incident postmortems
      tied to production deployments.
    whyItMatters: Continuous chronic-care monitoring depends on resilient device, data, software, and clinical-operation handoffs.
    diligencePath: >-
      Request 24 months of uptime and incident data, contractual SLAs, RTO and RPO targets, business-continuity test
      results, and device-connectivity failure rates.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: product-architecture
    missingEvidence: >-
      Verified production topology, model architecture, evaluation methodology, supported EMR interfaces, integration
      lead times, and technical ownership boundaries.
    whyItMatters: >-
      Public workflow descriptions do not establish scalability, technical defensibility, implementation burden, or the
      division of responsibility with health systems.
    diligencePath: >-
      Conduct an architecture review and request system diagrams, integration runbooks, model-evaluation packs,
      dependency inventories, and three implementation retrospectives.
    relatedQuestionRefs:
      - QE003
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: regulatory-status
    missingEvidence: >-
      Primary FDA documentation defining HypertensionOS's TEMPO scope, device classification, evidence obligations, and
      current authorization status.
    whyItMatters: >-
      Pilot participation cannot be treated as approval, clearance, or validation of all product claims and clinical
      workflows.
    diligencePath: >-
      Obtain the FDA pilot record, regulatory correspondence, intended-use statement, risk classification, validation
      protocol, and counsel's current status memorandum.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Customer cohorts showing gross and net retention, logo churn, renewal rates, contract duration, and expansion by
      deployment vintage.
    whyItMatters: >-
      Patient and health-system counts cannot establish whether adoption converts into durable recurring revenue or
      whether growth masks churn.
    diligencePath: >-
      Request an anonymized health-system cohort schedule with contracts, renewal dates, patient enrollment, revenue,
      churn, and expansion by quarter.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Revenue, active-patient, and gross-margin concentration by health system, payer, care program, and channel.
    whyItMatters: >-
      A count of more than 20 systems does not show whether a few partners or reimbursement pathways dominate economics
      and negotiating leverage.
    diligencePath: >-
      Obtain top-10 customer and payer concentration schedules, including contract terms, renewal dates, revenue share,
      enrollment share, and contribution margin.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A complete roster separating signed, implementation, pilot, production, and renewed health-system accounts, with
      deployment dates and customer-specific outcomes.
    whyItMatters: Public affiliation announcements cannot distinguish reference logos from scaled, retained production deployments.
    diligencePath: >-
      Reconcile management's customer roster to contracts, implementation records, invoices, active-patient files, and
      reference calls for a representative account sample.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: privacy-security
    missingEvidence: >-
      Independent security assurance, certification scope, penetration results, incident history, BAA and subprocessor
      terms, tested recovery objectives, and cyber-insurance coverage.
    whyItMatters: >-
      Cadence handles PHI across connected devices, EHR workflows, support access, and clinical operations, so assurance
      quality affects patient safety, compliance, and partner retention.
    diligencePath: >-
      Review the current security audit package, architecture and data-flow diagrams, incident register, access-control
      test results, BAA/subprocessor schedules, RTO/RPO tests, and insurance terms.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Revenue, enrollment, gross margin, renewal, termination, payer, code, EHR, device-vendor, and clinical-capacity
      concentration by counterparty and cohort.
    whyItMatters: >-
      A broad logo count cannot show whether one partner, payer, workflow integration, supplier, or staffing pool
      creates a material single point of failure.
    diligencePath: >-
      Obtain top-ten customer and payer schedules, contract renewal and termination calendars, cohort contribution
      margins, claims-denial data, vendor shares, staffing ratios, and redundancy plans.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register
    missingEvidence: >-
      Comprehensive federal and state licenses, prescribing and corporate-practice analyses, billing audits,
      investigations, litigation, complaints, enforcement history, and insurance claims.
    whyItMatters: >-
      The public pool supports three material pathways but cannot establish a complete legal and regulatory population
      or prove the absence of disputes and enforcement.
    diligencePath: >-
      Request counsel's regulatory matrix, license inventory, billing-audit history, litigation schedule, complaint log,
      insurer notices, and all material regulator correspondence.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
