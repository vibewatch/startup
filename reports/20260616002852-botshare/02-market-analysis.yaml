company:
  name: Botshare
chapter:
  number: 2
  title: Market Analysis
  summary: 'Botshare sits at the intersection of two very different markets: a still-fragmented Chinese robot-rental niche that multiple 2025-2026 sources size at roughly RMB 1 billion in 2025 and around RMB 10 billion in 2026, and a much larger industrial and service robotics ecosystem where China already leads global installations, manufacturing density, and policy support. The opportunity exists because leasing lowers capex and trial risk for SMEs and event-led buyers, but commercialization timing remains uneven: industrial robots are already scaled, while humanoid deployments are still early, service-heavy, and vulnerable to price compression and maintenance bottlenecks.'
sections:
- id: market-boundary-sizing
  title: Market boundary and sizing lenses
  body: 'Botshare does not compete in the entire robotics economy. Its addressable market is narrower and should be defined as robot access and deployment spend where a customer chooses temporary use, pay-per-project service, or operating-lease style access instead of outright hardware ownership. In practice, that means event and activation rentals, retail and reception deployments, short-duration education and tourism use cases, and a future wedge into warehouse, park, inspection, and industrial workflows where customers want robot capability without immediate capex. Multiple Chinese 2025-2026 sources cluster around a similar short-term market estimate: about RMB 1 billion of domestic robot-rental volume in 2025 and roughly RMB 10 billion in 2026, implying a tenfold jump during the first year of broad commercialization. That rental niche remains tiny relative to the wider industrial and service robotics economy, but it is strategically important because it acts as the trial, distribution,
    and data-collection layer that can accelerate adoption of more expensive hardware.'
