- id: buyers-and-adoption-path
  title: Buyers, users, payers, and adoption path
  body: 'The buyer map is heterogeneous. Near-term demand is led by event organizers, malls, tourism venues, retailers, schools, and marketing teams that value novelty, traffic generation, and short-duration staffing alternatives. In these cases, the buyer and payer often sit in brand, event, or store-operations budgets rather than factory capex committees. The next layer includes facilities managers, office operators, commercial landlords, and park operators that may care more about recurring reception, patrol, or cleaning workflows. Only after those layers does the market begin to overlap with industrial and logistics buyers, where procurement logic changes materially: operations, engineering, and warehouse managers need uptime, safety, and integration rather than spectacle. Several sources explicitly frame robot leasing as a low-risk trial mechanism for customers and a real-world feedback loop for manufacturers. That is why adoption funnels tend to start with one-off projects, move into
    repeat service packages, and only then become candidates for standardized operational budgets. The pathway is intuitive, but repeatability remains unproven in many categories.'
