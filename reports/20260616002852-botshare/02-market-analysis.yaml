  - type: private-evidence-only
    severity: material
    topic: sam-som-modeling
    missingEvidence: A clean China-specific serviceable available market and serviceable obtainable market model for robot leasing by segment, city tier, and workflow.
    whyItMatters: Public sources size the niche at a headline level, but they do not reveal how much of that spend is realistically addressable by one platform versus local integrators or direct OEM channels.
    diligencePath: Build a bottom-up model using city counts, segment budgets, rental frequency, and robot-class utilization by scenario.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer-payback
    missingEvidence: Customer-level payback data, utilization targets, and willingness-to-pay by SME, retail, logistics, and industrial segment.
    whyItMatters: Without segment-level ROI, it is impossible to know whether falling prices accelerate adoption faster than they destroy contribution margins.
    diligencePath: Interview customers, obtain proposal templates, and model payback against outright purchase and labor substitution.
    relatedQuestionRefs:
    - QM025
