      - number: '7.4'
        title: 价格压缩、需求质量与产业时点风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的市场风险在于，Botshare
              可能判断对了机器人租赁市场的方向，却仍然踩在可持续经济性过早的阶段。多方来源显示当前需求真实存在，但结构仍偏向节庆、展会、零售活动、旅游等高曝光、尚未深嵌运营流程的场景。上海春假报告显示订单大幅增长，但超过一半来自假日场景；Tencent
              访谈也明确说，2025 年需求仍主要由新鲜感驱动，而非习惯性运营使用。与此同时，价格已经在动。Sohu 和 Tencent
              报道称，供给扩张后租赁费率明显下滑；负面评论也提醒，六个月回本的故事依赖暂时稀缺和高价格，未必扛得住更大规模量产。政策雄心不等于客户准备好了。MIIT 的 2026
              行动和上海具身智能计划都指向工业、物流、零售和服务部署，但这些类别仍被描述为验证和示范赛道，需要安全性、可靠性、标准以及长期经济性证明。如果 Botshare
              不能在价格正常化前，从活动驱动的爆发迁移到可重复的企业工作流，市场可以继续变大，平台的利润池却会收缩。
            claimRefs:
