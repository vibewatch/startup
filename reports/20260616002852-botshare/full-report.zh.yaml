      - number: '1.2'
        title: 领导层、创始方与治理背景
        blocks:
          - type: paragraph
            body: >-
              领导层看起来分布在 Agibot 生态和消费互联网运营班底之间。独立和准参考报道把蒋青松列为董事长、Zhiyuan AGIBOT 合伙人，以及上海运营实体的法定代表人。李奕彦则被持续标注为
              CEO，也是解释公司成立逻辑的主要发声人：降低采用摩擦只是第一步，更难的是在真实生产场景中交付稳定、可重复的服务。中文参考资料进一步称，平台由 Zhiyuan Robotics 相关实体和 Flycode
              联合创立，前 Alibaba 和 Ele.me 高管在 2026 年初加入，以扩张运营和战略能力。缺口在于普通 late-seed 公司应有的治理披露：没有公开董事会名单、股东权利摘要，也没有围绕对
              Zhiyuan 生态关联方依赖的控制安排。尽调视角下，创始人与市场匹配度强，但治理透明度仍薄。
