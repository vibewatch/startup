  - id: TI003
    title: 单位经济表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 为什么重要
      - 尽调要求
    rows:
      - - 自有资产强度
        - 平台资产负债表上较低
        - 中
        - 管理层称合作伙伴购买或持有机器人，降低直接车队 capex
        - 按月核实自有与托管机器人组合
      - - 操作员强度
        - 当前部署约 1 名操作员 / 机器人
        - 高
        - 人工是直接服务成本，会封顶类软件利润率假设
        - 按场景提供每笔预订的操作员工时
      - - 国内价格趋势
        - 较 >RMB10k/day 峰值大幅下降
        - 高
        - 价格下行会压缩简单经纪模式的价差经济性
        - 展示上线以来月度实际 ASP 和折扣率
      - - 保险覆盖
        - 1,000+ 台投保机器人 / >RMB200m 保额
        - 中
        - 保险是运营模式的一部分，可能保护现金免受损坏事件冲击
        - 提供保费成本、理赔频率和免赔额结构
      - - 维修和售后依赖
        - 高
        - 中
        - JD 和其他服务网络连接显示，正常运行基础设施是交付质量的关键
        - 提供每次事故的停机时间、MTTR 和恢复成本
      - - 工业利用率证据
        - 未公开披露
        - 低
        - 工业利润率上行靠可重复的正常运行和 ROI，不只靠活动需求
        - 提供工业试点的利用率和续约数据
      - - 公开收入 / ARR
        - 未披露
        - 高
        - 没有收入披露，投资人无法检验规模、增长或变现质量
        - 提供月度收入、确认收入，以及 GMV 到收入的转化
      - - 现金转换周期
        - 未披露
        - 低
        - 合作伙伴付款、退款、应收账款和维护节奏决定营运资金负担
        - 按交易对手类别分享应收和应付账龄
    notes: 本表混合了观察到的成本驱动因素和刻意留白。缺失行是阻止形成可用公开单位经济模型的关键障碍。
