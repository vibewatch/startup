      - number: '2.3'
        title: 政策支持与结构性需求驱动
        blocks:
          - type: paragraph
            body: >-
              中国更大的机器人背景异常有利。IFR、Statista 和 SCIO/Xinhua
              材料都显示，中国已经是全球最大的工业机器人市场，无论存量还是年度装机量都领先；国家政策也在有意把行业从传统自动化推向具身和智能机器人。2026 年 6 月 MIIT-SASAC 行动方案尤其关系到
              Botshare，因为方案明确点名制造、巡检、维护、仓储物流、零售、医疗和应急响应中的工业、服务和特殊场景部署。方案也鼓励
              Robot-as-a-Service、经营租赁、按效果付费等商业创新，以降低用户投资门槛。与此同时，中国的标准制定、真实场景训练基础设施、开放数据项目和共享测试基地，都是为了缩短从 demo
              到可部署产品的路径。这些政策对 Botshare 的意义，不是直接给补贴，而是扩大「租一台机器人」成为机构可接受采购行为的场景范围。
