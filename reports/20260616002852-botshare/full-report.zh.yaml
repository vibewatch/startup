  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Botshare 英文名为 BOTSHARE，中文名为擎天租，经营的是机器人租赁与出租平台，而不是单一机器人 OEM。官网文案和上线报道都把它定义为 Robotics-as-a-Service
              市场：连接需求侧客户、供给侧机器人厂商、服务伙伴和运营方。短期产品不是孤立的软件订阅，而是一套协同履约层，把机器人选型、预订、现场部署、受训操作员，以及越来越多的保险和维护打包在一起。上线材料显示，公司先从零售快闪、展会、婚礼、接待和教育等高曝光场景切入；管理层则称，战略目标是迁移到工业制造、园区运营、仓储、物流等更可重复的工作流。Botshare
              因此有双重属性：按资产所有权口径看偏轻，但在调度、地方服务质量和 uptime 执行上很重。
