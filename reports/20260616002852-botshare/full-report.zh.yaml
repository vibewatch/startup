        - 需求仍由活动驱动，价格下行，服务人力保持高位，新轮融资需要比公司公开可展示内容更强的证据。
        - $0.30B-$0.60B
        - 如果到下一次更新时，工业续约和单位经济性仍不透明，这一情景就有实质权重。
        - 今天的头条估值会显得偏早，并容易受到平轮或下轮冲击。
      - - 基准
        - Botshare 成为真实的全国部署平台，但工业重复性和利润率结构的验证，比融资叙事暗示的时间更长。
        - $0.60B-$0.95B
        - 与当前公开来源集最一致。
        - 头条估值看起来已满；更好的入场点来自时间推移或更多披露。
      - - 多头
        - 工业、物流和企业工作流开始续约，伙伴密度提升利用率，披露 KPI 支撑持久编排模型。
        - $1.10B-$1.60B
        - 需要几个仍处私域的验证点。
        - 当前头条估值可以跑通，但前提是公司迅速验证重复经济性。
      - - 当前头条估值
        - May 2026 融资估值在外部报道中被视为约 $1B 等值。
        - $0.95B-$1.05B
        - 市场已经可见。
        - 此处买入的投资人，是在披露追上前承保很大一部分上行。
    notes: 区间有意保持宽泛，并按情景设定。它们反映公开证据框架，不是基于缺失私有指标搭建的折现现金流模型。
