      - number: '4.3'
        title: 资本充足性、融资依赖与投资人组合
        blocks:
          - type: paragraph
            body: >-
              融资是最清晰的公开财务数据点，但应被视作前置燃料，而不是盈利能力证明。Botshare 在数月内从种子轮推进到天使轮、Pre-A，再到 A/A+，最终达到据报道 RMB 7 billion 估值，并拿到
              Crunchbase $1 billion 独角兽头衔。速度说明投资人兴趣强，但这股兴趣的构成同样重要：36Kr、Baidu Baike 和 Tencent
              都指向战略产业投资者、上市公司、生态内部方，以及娱乐或消费端资本的组合。换句话说，股权结构表看起来既为开场景和渠道而设计，也为提供现金而设计。最新一轮降低了短期融资风险，但也支撑一轮野心很大的铺开：更多城市、更多伙伴、更多创作者、更多工业场景、全球
              App 和 SaaS
              工具，甚至潜在国际扩张。即使采用轻资产模式，也意味着公司要在伙伴赋能、销售、调度系统、保险、维护连接和应收支持上投入不少钱。公司仍未披露现金、烧钱速度、现金跑道或融资条款，因此审慎读法是：在管理层证明服务费和场景解决方案能自我融资网络增长之前，Botshare
