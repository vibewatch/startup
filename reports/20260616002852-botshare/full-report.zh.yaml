      - number: '1.3'
        title: 融资历史、所有权信号与早期规模
        blocks:
          - type: paragraph
            body: >-
              Botshare 在公开亮相不到六个月内压缩进了异常密集的融资活动。Baidu Baike 和 3 月融资报道指向 2026 年 1 月种子轮、3 月超过 RMB 100 million 的天使和天使+
              融资包（据称估值 RMB 3 billion）、4 月由产业资本和上市公司资本领投的 Pre-A，以及 2026 年 5 月 A 和 A+ 轮；多家媒体称，公司估值被推高到 RMB 7
              billion。Crunchbase News 另把 Botshare 列入 2026 年 5 月新晋独角兽，估值写为 $1
              billion；尽管按即期汇率人民币折美元略低，方向上仍与中文报道一致。运营侧公开牵引指标仍是市场型指标，而不是财务指标：上线覆盖 50 个核心城市、600 多家服务商、初始超过 1,000 台设备，2026 年
              3 月可部署机器人超过 3,000 台，累计订单超过 5,500 单。这些是有意义的网络效应信号，但不能替代收入、利润率或利用率披露。
