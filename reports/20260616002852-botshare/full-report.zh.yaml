  - id: TV005
    title: 论点失效与终止触发项表
    columns:
      - 触发项
      - 需要观察的阈值
      - 为什么重要
      - 行动含义
    rows:
      - - 没有工业重复性
        - 下一次更新仍没有具名续约、没有试点转生产，也没有正常运行时间证明。
        - 多头情形依赖经常性运营工作流，而不只是活动需求。
        - 将当前估值视为超额透支了证据基础。
      - - 服务负担压垮定价
        - 价格持续下行，同时操作员、维修和物流成本披露仍缺失或为负。
        - 公司可能保持忙碌，但经济性很薄。
        - 除非价格大幅回调，否则立场转向规避。
      - - 融资继续跑在披露前面
        - 估值再次上台阶，但没有披露经审计 KPI，也没有更清晰的轮次条款。
        - 叙事不断复利却缺少验证，后续估值下调融资风险会上升。
        - 即便账面估值上行，也应假设优先权风险在抬升。
      - - 合作伙伴中立性削弱
        - 少数 OEM 或关联生态参与方主导供给和经济性。
        - 集中度可能压住市场平台的公信力和议价能力。
        - 下调平台可选性和战略退出上行空间。
      - - 事故画像恶化
        - 索赔、故障或合规摩擦的上升速度快过服务控制的成熟速度。
        - 运营可靠性决定企业客户能否反复采用。
        - 重新评估 Botshare 究竟是可扩展平台，还是脆弱的服务协调方。
    notes: 这些触发项是下一轮尽调的决策规则，并不意味着任何单一失败都会自动否定公司。
    claimRefs:
      - CV039
      - CV043
      - CV045
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 经审计的 2025 年收入，以及 2026 年从订单到确认收入的月度桥接。
        - 没有这项证据，估值就无法锚定规模或增长。
        - CFO 数据室和审计师材料包。
      - - 抽佣率和利润率
        - 按场景拆分的抽佣率、毛利率、操作员成本、物流成本和维修成本。
        - 这决定 Botshare 是平台，还是重人力的服务生意。
        - 财务团队加运营 KPI 工作簿。
      - - 工业续约
        - 具名工业试点、合同期限、续约率和客户 ROI 佐证。
        - 牛市情形取决于运营场景里的复购。
        - 客户访谈和合同样本审阅。
      - - 留存和集中度
        - 分群留存、重复预订率、头部客户敞口，以及取消 / 退款数据。
        - 需求活跃不等于收入质量可持续。
        - CRM 导出和分群材料。
      - - 机队经济性
        - 自有与托管机队结构、按场景拆分的利用率，以及营运资本节奏。
        - 投资人需要看清资本强度到底落在哪里。
        - 运营 + 财务对账。
      - - 轮次条款
        - 优先权堆栈、反稀释、投资人权利和股权集中度。
        - 如果条款偏向投资人，名义估值可能高估普通股经济性。
        - 对股权结构表和已签投资条款清单做法律尽调。
    notes: 如果管理层能用一手证据回答，这几项最可能快速改变投资建议。
    claimRefs:
      - CV013
      - CV036
      - CV041
      - CV045
      - CV046
      - CV047
