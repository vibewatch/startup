      - number: '2.4'
        title: 约束、时点与商业化风险
        blocks:
          - type: paragraph
            body: >-
              市场在扩张，但来源材料里的摩擦也很明显。IFR
              明确提醒，不能把人形机器人和成熟工业机器人混为一谈：可预见未来，高速精密制造仍会使用专用工业系统，人形机器人在工厂或家庭的大规模采用还是偏后期计划，不是近期基准。IDC
              从需求侧补充了另一处瓶颈：用户普遍认可工业机器人的价值主张，但仍希望性能、软件、售后服务和系统集成更好。Sohu 2026 年 6
              月租赁分析说明了这些缺口的商业后果。供给增加后，租赁价格快速下跌，简单撮合方可获得的价差经济收缩，差异化转向物流、维护、保险、编舞、维修和恢复。简言之，Botshare
              的市场机会真实存在，但可投资版本取决于平台能否在价格压缩摧毁利润率之前，把演出驱动的需求转成可重复的服务工作流。
