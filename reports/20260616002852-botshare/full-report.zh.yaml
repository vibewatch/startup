      - number: '4.4'
        title: 披露缺口、治理风险与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开记录仍缺少投资承保最关键的变量。所审阅来源没有披露收入、ARR、毛利率、烧钱速度、现金跑道、CAC、回本周期或净留存率；本章也没有能从一手登记页面清晰核验当前所有权的公开备案，因为 Qichacha
              自动访问受阻。Botshare 自己的隐私政策又增加了一层财务风险：平台收集订单、场景、预算、交易和伙伴申请数据，并称部分注册或交易数据可能同步给关联方或业务伙伴。这些披露支持了 Botshare
              正在搭建真实运营平台的判断，但随着业务扩张到更多城市和国家，也会增加治理、合规和跨方数据处理成本。因此，Tencent 和 Sohu
              提出的反向案例是连贯的：估值已经跑赢披露经济性，高服务强度可能在价格压缩快于利用率提升时迫使公司进一步稀释。财务结论：Botshare
              可能成为有意义的机器人服务基础设施层，但今天它仍是一家服务很重、披露私密的公司；仅凭公开证据，还无法充分承保其收入质量、利润率路径和资本效率。
