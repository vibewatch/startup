      - number: '8.2'
        title: 早期机器人编排平台的可比视角
        blocks:
          - type: paragraph
            body: >-
              Botshare 没有完美的公开可比公司，这也正是假精确会出错的原因。Serve Robotics 有参考价值，因为它是公开上市的自动驾驶平台，有真实 SEC 披露、真实亏损和真实流动性；Richtech
              有参考价值，因为它明确推销 RaaS 和经常性合同，同时也展示融资结构和控制质量如何让估值故事变复杂；Knightscope
              展示了服务很重的机器人业务在有经常性收入但增长和盈利能力仍有争议时会如何交易；Symbotic
              则展示了规模化工业自动化在收入和现金终于足够大、能够靠运营证明支撑数十亿美元市值时是什么样子。合在一起，这些同行不会给 Botshare
              一个干净倍数，而是搭出一把估值阶梯。一端是公开微型市值机器人公司，即便有经审计报表、经常性收入和现金披露，交易价格也可能远低于 Botshare
              的头条估值；另一端是真正规模化的自动化龙头，可以交易得高得多，但前提是已经交付数十亿美元收入和深得多的客户证明。Botshare
              目前处在两端之间：战略上比普通微型市值公司更有意思，但证明负担仍更接近早期平台，而不是工业自动化龙头的成熟画像。
