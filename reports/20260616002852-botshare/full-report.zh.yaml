  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 质量
      - 尽调要求
    rows:
      - - 平台运营管理费
        - 合作伙伴持有机器人资产，Botshare 负责调度和履约运营
        - 每笔订单 / 托管资产 / 服务包
        - Tencent 4 月报道明确描述；具体抽成率未公开
        - 中
        - 按合作伙伴类型和场景提供收费表
      - - 服务费 / 交付费
        - 围绕每次租赁提供现场部署、技术支持、编程和编排
        - 每项任务 / 服务包
        - 轻资产访谈和重服务报道可支撑；实际拆分未披露
        - 中
        - 拆分服务收入与纯平台收入
      - - 打包场景解决方案
        - 年会、零售活动、教育、旅游和定制表演的打包定价
        - 每包 / 每天 / 每次活动
        - Tencent 首发报道显示公开套餐起价为 RMB 13,300 或 RMB 16,900 / 天
        - 中
        - 按套餐提供实际 ASP 和定制工作的附加率
      - - 工业和物流场景扩张
        - 向仓库、园区和生产流程部署 RaaS
        - 每次部署 / 合同
        - 管理层称新资本瞄准这些场景，但尚未披露收入
        - 低至中
        - 提供已签工业合同、试点到续约转化，以及按场景毛利
      - - 海外租赁
        - 通过 13 个国家的区域伙伴开展本地化租赁
        - 每天 / 解决方案包
        - 公开有高价轶事，但海外已预订收入未披露
        - 低至中
        - 提供海外预订、本地伙伴经济性和国家级毛利
      - - 硬件销售
        - Botshare 自身确认的直接机器人销售
        - 单台销售
        - 已审阅公开来源没有支持 Botshare 是主要硬件卖方
        - 低
        - 确认公司是否确认任何直接机器人转售收入
    notes: 公开证据支持收费型、打包型和场景解决方案变现，但没有来源披露 Botshare 的实际抽成率或分收入流拆分。
