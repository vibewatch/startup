      - number: '4.2'
        title: 服务重的单位经济模型与利润率路径约束
        blocks:
          - type: paragraph
            body: >-
              核心承保问题在于，Botshare 也许硬件持有较轻，但运营并不轻。多个独立来源已经描述了下单之后的重活：跨城调度、现场调试、编舞或定制编程、操作员、维护、保险和故障恢复。Xinhua
              提到合理人机比仍约为一名操作员对应一台机器人，这尤其关键，因为当前人工负担难以忽略。与此同时，市场价格快速下跌。Xinhua 和 China Daily 都描述国内日租从 2025 年初超过 RMB 10,000
              的高点大幅重置，Sohu 则认为简单信息套利正在消失。两者叠加意味着，Botshare 的护城河必须来自服务可靠性、地方伙伴密度和资产利用率，而不是只靠头条租金。若可重复的高频需求出现，工业逻辑仍可能有吸引力；但
              IFR 和 MIIT 材料合在一起说明，真实世界大规模人形机器人部署仍处早期。在 Botshare 披露利用率、退款、维护和续约数据之前，利润率路径更像叙事，而不是模型。
