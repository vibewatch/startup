      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方版图很杂。短期需求由活动主办方、商场、文旅场馆、零售商、学校和营销团队带动，他们看重新奇感、引流和短时用工替代。这类场景里，买方和付款方往往在品牌、活动或门店运营预算里，而不是工厂 capex
              委员会。下一层是设施管理方、办公运营商、商业地产方和园区运营方，他们更在意接待、巡逻或清洁等可重复工作流。再往后，市场才开始与工业和物流买方重叠，采购逻辑也会明显变化：运营、工程和仓库经理要的是
              uptime、安全和集成，而不是看点。多份来源明确把机器人租赁框定为客户低风险试用机制，也是厂商的真实世界反馈回路。因此，采用漏斗通常从一次性项目开始，迁移到重复服务包，最后才可能进入标准化运营预算。路径直观，但很多品类的可重复性仍未证实。
