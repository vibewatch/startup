      - number: '8.4'
        title: 建议、入场纪律与逻辑破裂信号
        blocks:
          - type: paragraph
            body: >-
              实际投资结论是，战略上把 Botshare 放在前排观察，价格上保持保守。公开证据已经足够反驳“Botshare 是假公司或纯概念
              PPT”的看法：融资已经发生，市场存在，服务需求真实，多方公开来源显示平台试图解决部署基础设施，而不是只租硬件。但以当前头条估值给出买入式结论，证据仍太薄。公司还没有拿出经审计财务和 cohort
              数据，无法让投资人判断它该被拿来和投机期权价值公司、服务很重的机器人运营商，还是最终的规模化自动化平台相比。因此，最干净的立场是继续研究，置信度中等、风险高、估值姿态偏紧。下一轮尽调应聚焦收入确认、抽佣率、续约和留存、工业试点转化、在线率和事故数据、以及轮次条款细节。如果这些检查结果很强，当前估值可能显得有先见之明。如果这些指标继续不公开，而估值不断上台阶，投资逻辑应被视为越来越脆弱，而不是越来越被证实。
