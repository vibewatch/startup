  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              Botshare 已经处在比普通分类信息市场更重的监管边界内，因为产品打包了实体机器人、支付、用户身份、配送协调、现场运营，以及越来越多的公共场景互动。公司自己的隐私政策称，服务覆盖
              App、小程序、网站和第三方集成，并收集设备标识、订单详情、地址、预算、使用场景、照片、视频和支付相关信息。与此同时，2026 年 MIIT/SASAC 部署行动和 CAC
              智能体实施意见，都把行业推向更强的生命周期管理、隐私控制、行为边界、防碰撞、黑匣子可追溯和大规模部署前的明确责任分配。长期看，这有利于行业合法性，但也意味着 Botshare
              这样的年轻运营方，可能比公开披露暗示的更快被拉入合规工作。已有保险产品覆盖第三方责任、产品责任和信息泄露，是一个有用旁证：保险方已经理解真实世界风险。问题不是没有缓释，而是相对商业铺开速度，公开证据里的董事会级治理、认证和事故治理成熟度仍然薄。
