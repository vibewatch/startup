    rows:
      - - 基础机器狗入门租赁
        - RMB 200-499 / 天
        - 多为标价式或促销价
        - 硬件使用权和基础交付窗口
        - 利用率、补贴成本和合作伙伴分成未知
        - 低入门价拉动需求，但没有规模时大概率只剩很薄利润
      - - 主流国内人形机器人租赁
        - RMB 1,499-5,000 / 天
        - 观察到的市场价格，未披露平均实际价格
        - 很多情况下包括机器人、操作员或安全支持、现场处理
        - 折扣、差旅费和停机时间未知
        - 价格正降到数千元低位，挤压套利经济性
      - - 高端定制套餐
        - 最高约 RMB 100,000 / 天
        - 套餐卡 / 场景报价
        - 技术人员、定制编程、演出设计、多机器人协同
        - 实际毛利率和可重复性未知
        - 如果服务质量守得住，高价打包能抵消低端价格压缩
      - - Tencent 首发套餐
        - RMB 13,300 或 RMB 16,900 / 天起
        - 公开套餐报价
        - 预定义租赁组合加可选定制
        - 转化率和加购组合未知
        - 支撑打包解决方案收入，而不只是按机器人计费
      - - 欧洲 Lingxi X2 租赁
        - EUR 2,000-3,000 / 天
        - 管理层公开轶事价格
        - 本地服务伙伴交付和支持
        - 本地合规、人工和伙伴分成未知
        - 国际定价可能抬高 ASP，但会增加执行成本
      - - 北美 Expedition 租赁
        - 最高 USD 6,000 / 天
        - 管理层公开轶事价格
        - 伙伴支持下的本地化部署
        - 价格上限可持续性尚未验证
        - 存在潜在上行，但没有量级数据前不应建成基本情景
    notes: 各行反映公开标价、套餐价或访谈级定价信号。没有任何一项提供 Botshare 的实际平均价格、贡献毛利或客户级留存经济性。
