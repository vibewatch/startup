  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 国内平台和 OEM 相关渠道已经在争夺同一访问层
        blocks:
          - type: paragraph
            body: >-
              Botshare 在中国的直接竞争版图，不只是几款相似租赁 App。这个品类现在包括第二个聚合平台 Wanjiyi Rental、JD 自营机器人租赁上线和 JoyInside
              生态带来的零售商主导分销，以及让客户直接租 Unitree 机器并配套配送、操作员支持和损坏保障的 OEM 相关预订渠道。这一点关键，因为 Botshare 当前价值主张不是独占机器人
              IP，而是便捷访问、城市级调度和打包服务。Wanjiyi 直接复制市场逻辑；JD 和 Unitree 相关渠道则用租赁叠加零售发现、物流、融资和售后，间接攻击
              Botshare。因此，国内竞争场里，Botshare 也许有强品牌动能，但还没有拥有客户如何预订、接收、维修或归还机器人的全国标准。
