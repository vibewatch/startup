  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现架构与定价证据
        blocks:
          - type: paragraph
            body: >-
              公开证据能勾勒商业模式形态，但拼不出干净利润表。Botshare 没有把自己包装成确认硬件销售的机器人 OEM，而是一个 RaaS
              式应用平台，连接机器人供应商、地方服务伙伴、创作者和终端客户。最具体的变现信号来自 4 月 Tencent 报道，CEO 李奕彦描述了早期完全轻资产结构：战略伙伴持有或购买机器人，Botshare
              运营资产，平台赚运营管理费和服务费。这一点重要，因为它降低直接机队 capex，却把经济性依赖转向 take rate、利用率和服务执行。定价也不是简单的单机器人价目表。上线报道、Xinhua 和 Tencent
              材料显示，基础机器狗或长租入门方案日租几百元人民币，主流国内租赁在每天低千元区间，高端捆绑包或定制方案可升至五位数，甚至接近 RMB
              100,000。结果是，公司收入很可能混合了平台费、打包解决方案收费和场景定制，但实际成交价格仍未披露。
