  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 头条估值与公开运营披露
        blocks:
          - type: paragraph
            body: >-
              Botshare 2026 年 5 月的融资头条很容易复述，却很难承保。多家英文和中文来源对核心事实一致：公司完成了数亿元人民币的 Series A 和 A+ 轮融资，新估值达到人民币 70
              亿元，管理层计划用这笔钱从活动驱动部署转向更广的 RaaS
              平台，覆盖工业、园区、仓储、物流和商业服务场景。这足以证明估值存在，也足以说明投资人买的是平台逻辑，而不是单个项目。但这些证据不足以证明当前价格有已披露经济性支撑。确认头条的同一组来源，也暴露了缺口：公开层面仍没有收入、ARR、毛利率、烧钱速度、现金跑道或股权条款披露；运营标记仍主要落在可调度机队、城市覆盖、订单轶事和场景宽度。公开观感上，这轮融资像是在押注机器人部署基础设施类别领导者的战略稀缺性。因此，尽调负担不是证明需求是否存在，而是检验约
              $1 billion 的估值买到的是可运转的运营飞轮，还是一个跑得很快、财务形状仍然私密的叙事。
