        title: 按机器人类型划分的能力成熟度
        blocks:
          - type: paragraph
            body: >-
              目录宽度真实存在，但不同机器人类别的成熟度差异很大。AgiBot 官方界面展示了可商业销售的人形机器人和四足机器人，但这些页面仍把 X2 人形机器人定位在娱乐和商业表演，把 D1
              四足机器人定位在表演、巡检和教育，而不是深度集成的工业自主性。产品页还披露了具体限制：自主导航可能需要可选包，硬件保修之外的手动技术问题解决由用户承担，四足机器人载重只有约 5
              公斤，续航更接近一到两小时，而不是整班运行。AheadForm 和 ULS 把感知目录扩展到服务人形机器人和外骨骼，但公开证明仍集中在演示和场景包装，而非标准化生产结果。因此，Botshare
              今天有一个可用的活动和试点目录，但对可重复工业或物流表现的证据基础薄得多。
