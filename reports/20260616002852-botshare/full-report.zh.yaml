      - number: '7.3'
        title: 生态依赖、治理不透明与融资脆弱性
        blocks:
          - type: paragraph
            body: >-
              Botshare 对外讲的是开放平台，但公开记录仍把它和 Agibot 生态绑得很紧。Agibot 共同主办发布会；Jiang Qingsong 同时以 Agibot 合伙人和 Botshare
              董事长身份公开露面；Tencent 的报道也把平台描述成一条通道：Agibot 自有机器人和能力借它进入更多场景，更大的生态则补齐缺口。供给稀缺、标准未成熟时，这种依赖有帮助；但如果第三方 OEM 或服务伙伴认为
              Agibot
              获得优待，产品准入、伙伴中立性和关联方经济都会形成真实集中风险。治理不透明又放大了这个问题。公开材料谈投资人、高管和增长计划，但董事会构成、正式风险监督、关联方规则、单位经济披露仍大体缺位。融资节奏带来的不是安心，而是压力。Botshare
              几个月内从种子轮走到独角兽级头条，负面评论已经质疑订单量和已披露运营证据是否足以支撑估值跃升。如果融资预期跑在可见经济性前面，即便表面业务活动仍很热闹，后续轮次也会更脆弱。
