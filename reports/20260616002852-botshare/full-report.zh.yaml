        title: 信任、安全与技术控制环境
        blocks:
          - type: paragraph
            body: >-
              Botshare 确实有真实的信任建设层，但大多是生态级能力，而不是平台认证控制。公开报道指向受训操作员、打包保险，以及 JD 支持的维修或回收；App store
              披露至少显示公司维护着移动端界面，并有明确隐私告知。政策层面，中国 2026
              年人形机器人标准和部署行动方案高度相关，因为它们聚焦真实场景运行、维护、数据治理、隐私、防碰撞、力限制、急停、黑匣子日志和长时可靠性。这些框架解释了 Botshare
              为何想从看点迁移到更标准化的服务和工业场景，也意味着公司未来进入物流、巡检或辅助作业部署时，需要比婚礼或商场快闪套餐严格得多的运营纪律。缺口在于，Botshare 自身没有公开披露 uptime
