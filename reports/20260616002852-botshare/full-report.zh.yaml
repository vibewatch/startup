  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 多头 / 正向论点
      - 反论点 / 为什么可能失败
      - 什么会改变判断
    rows:
      - - 市场时点
        - 机器人租赁需求和政策支持都是真实的，公开来源显示品类认知快速提升。
        - 需求可以真实存在，但经济性仍由新奇感驱动、呈阶段性。
        - 证据显示工业和企业需求变成重复需求，而不是展示流量。
      - - 商业模式
        - 一个协调 OEM、伙伴和场景的平台，可能成为机器人部署的操作层。
        - 平台可能仍是重服务协调方，软件式利润率有限。
        - 披露抽成率和按场景划分的贡献利润率。
      - - 战略稀缺性
        - 快速融资和独角兽地位可能反映其在新兴瓶颈中的品类领先。
        - 快速融资也可能反映的是热度，而非持久经济性。
        - 证明后续融资跟随运营进展，而不只是叙事势能。
      - - 可比公司组
        - 公开可比公司显示，自动化平台若能规模化，存在大结果空间。
        - 公开可比公司也显示，一旦规模、控制或重复经济性不达预期，估值压缩会很残酷。
        - 更成熟的披露，说明 Botshare 实际属于哪类可比桶。
      - - 执行护城河
        - 本地交付、正常运行时间、保险和伙伴管理可能难以复制。
        - 同样这些层也会吃掉利润，并让规模化运营变复杂。
        - 城市级 SLA、事故和留存指标。
      - - 退出路径
        - 如果 Botshare 完成工业化，它可能成为有吸引力的战略或成长股权平台资产。
        - 治理弱、控制薄或 KPI 薄，都会推迟 IPO 就绪，并压缩退出价值。
        - 董事会质量报告、审计就绪度和更清晰的股权结构披露。
    notes: 本表并列上行和下行论点，让建议保持对证据敏感，而不是只判断公司质量。
