            title: 中国政策栈与 Botshare 逻辑高度同向
            body: 很少有市场同时具备机器人制造规模、国家标准工作、真实场景试点基础设施，以及对服务化或租赁式商业化的明确背书。中国的政策和供给背景，让机器人租赁平台在当地比多数其他地区更有可能快速放大。
