      - number: '3.3'
        title: 工业老牌厂商靠服务渠道信任竞争，而不是开放市场
        blocks:
          - type: paragraph
            body: >-
              在工厂里，Botshare 最难对付的替代品可能是 ABB、KUKA 和 FANUC
              的既有服务栈。它们在面向消费者的租赁页面上不那么显眼，但在真实采购里更有力量。每家公司都提供生命周期支持、培训、现代化改造、备件或维护基础设施，并与工厂工程师有长期关系。IFR 2024
              年数据显示，中国这个安装基础已经很大：一年安装 295,000 台工业机器人，在运机器人超过 2 million 台。在这个语境下，工厂经理不需要另一个 App
              来发现机器人需求；他们已经有可信供应商、支持团队和资格认证路径。Botshare 在灵活访问能降低试用风险的地方仍有价值，但只要
              uptime、合规和长期支持比短期资产访问更重要，工厂买方可能把老牌渠道视为更安全答案。换个角度看，工厂采购团队已经有与这些厂商绑定的升级路径、培训惯例和备件习惯。即便 Botshare
              能找到兼容机器，也必须证明现场服务、故障排查和生产中出问题时的问责能力同样可靠。
