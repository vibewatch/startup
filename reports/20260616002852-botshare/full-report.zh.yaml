      - number: '8.3'
        title: 用情景框架，而不是单点估值确定性
        blocks:
          - type: paragraph
            body: >-
              今天框定 Botshare
              的正确方式是做情景，而不是给单一数字目标。牛市情景假设公司成为中国具身机器人部署的默认编排层：工业和企业工作流开始重复出现，调度密度提升，伙伴中立性仍可信，变现来自可靠的平台和服务经济性，而不是一次性活动爆发。基准情景更温和。Botshare
              仍会成为一个真实类别公司，但经济性在更长时间里保持混合且受人工影响，工业部署扩张慢于融资故事暗示。熊市情景不是机器人需求消失；而是需求真实但主要是阶段性的，价格继续压缩，人工支持和维修仍然很重，后续投资人在没有审计证据时拒绝继续为估值跃升买单。在这个框架下，当前头条估值已经向上行倾斜。只有当
              Botshare 证明自己显著高于公开微型市值机器人桶，并开始补上收入质量、可重复性和单位经济性的披露缺口时，约 $1 billion 的估值才说得通。在那之前，情景宽度比小数点精度更重要。
