      - number: '1.4'
        title: 里程碑、运营覆盖与眼前执行风险
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月以来的里程碑很清楚：在上海上线平台，借助早期融资搭建全国服务网络，加入保险等生态服务，再用 JD.com 和 Rui’an Office
              等战略伙伴拓宽平台。公开来源还显示，管理层试图把叙事从「活动上的机器人」转向更广泛的运营工作流。但同一组证据已经暴露主要执行风险。Sohu 2026 年 6
              月分析称，租赁价格下行会挤压纯市场运营商的套利空间，物流、维护、保险和回收才是真正护城河。Xinhua
              还补充，当前需求仍高度娱乐化，复购客户稀少，现有部署往往仍需要每台机器人配一名操作员。换句话说，Botshare
              很快拿到了能见度和头条估值，但公司仍需证明其服务网络能支撑工业级利用率和可持续单位经济模型，而不是只靠新奇驱动增长。
