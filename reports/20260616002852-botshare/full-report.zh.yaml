  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Botshare
              并不竞争整个机器人经济。它的可服务市场更窄，应定义为客户选择临时使用、按项目付费服务或经营租赁式访问，而不是直接购买硬件时产生的机器人使用和部署支出。落到实践，就是活动和快闪租赁、零售与接待部署、短期教育和文旅场景，以及未来切入仓库、园区、巡检和工业工作流——客户想要机器人能力，但不想立刻投入
              capex。多份中国 2025-2026 年来源给出的短期市场估算接近：2025 年国内机器人租赁规模约 RMB 1 billion，2026 年约 RMB 10
              billion，意味着广泛商业化第一年增长十倍。这个租赁细分相对更大的工业和服务机器人经济仍很小，但战略上重要，因为它是试用、分销和数据收集层，能加速更昂贵硬件的采用。
