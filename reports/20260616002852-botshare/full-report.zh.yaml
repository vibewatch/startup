            body: 平台把机器人变成可预订服务，并打包操作员、保险和本地履约，降低初始 capex 门槛。对想获得分销、场景数据并加快商业化的上游机器人厂商来说，Botshare 有战略价值，因为厂商不必从零搭建全国服务网络。
