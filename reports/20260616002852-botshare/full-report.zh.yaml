            body: >-
              中国报道中的反向证据很一致：公众关注创造了需求，也加速了供给过剩和价格压力。Xinhua、Yicai、Sohu、RoboHorizon 和 China Daily
              都描述了同一个市场：活动驱动需求仍重要，价格已从炒作高峰大幅下跌，简单撮合的价差经济在收缩。多个城市的本地运营商已经在机器人租赁上变现，意味着 Botshare 必须协调碎片化供给，同时防守 JD
              式基础设施包和仓库 RaaS 替代品。护城河分析因此要从故事转向运营。稀缺能力是快速维护、可靠调度、保险处理、伙伴密度和可重复场景执行。公开材料仍缺少硬核承保证据——take rate、利用率、毛利率和工业
              win-loss 数据——来证明 Botshare 能在竞争者把同一套服务包标准化之前，把品类动能转成耐久经济性。缺少这些证据，护城河故事仍是暂定，而非已证实。
