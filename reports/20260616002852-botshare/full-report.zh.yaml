  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 有证据支撑的理由
      - 缓释措施 / 尽调问题
    rows:
      - - 开放市场领先
        - Wanjiyi 和其他国内聚合商
        - 高
        - Botshare 并不独占平台模式；Wanjiyi 上线时已有联盟、金融和保险支持。
        - 索取按城市拆分的供应份额、月活服务商，以及各场景买方复购率
      - - OEM 接入优势
        - JD 和 Unitree 关联直营渠道
        - 高
        - 零售商和 OEM 渠道已经能提供预订、交付和支持，不需要中立市场。
        - 要求提供渠道冲突数据、OEM 排他性，以及被 JD 或直营网页锁定的供应占比
      - - 工业扩张选择权
        - 仓储 RaaS 专家
        - 高
        - Locus、inVia、Vecna 和 Geek+ 已经在销售可续约的仓储成果，并配套支持与扩张逻辑。
        - 展示具名工业部署、SLA，以及相对物流替代方案的复购证据
      - - 工厂信任和支持
        - ABB / KUKA / FANUC 装机基础服务渠道
        - 高
        - 既有渠道已经在工厂内部，掌握培训、备件和维护基础设施。
        - 收集工厂 RFQ、替换既有供应商案例，以及所需认证路径
      - - 定价优势
        - 价格快速压缩
        - 中高
        - 中国报道显示主流租金在降温，真正的瓶颈仍是重服务交付。
        - 按场景持续跟踪综合实际价格、毛利率和服务附加率
      - - 叙事护城河
        - 商品化便利性叙事
        - 中
        - 竞争对手也在使用类 Didi 或简单接入叙事，单靠漏斗顶部故事撑不起防御。
        - 衡量获客来源、推荐循环和首次预订后的转化，不要依赖品牌口号
    notes: 严重性是基于截至 2026-06-16 已审阅公开证据的承销判断，不是市场份额预测。
