        title: 多品牌目录与履约架构
        blocks:
          - type: paragraph
            body: >-
              Botshare 真正交付的是一套分层编排栈。供给来自多个机器人 OEM 和相邻硬件厂商；上线报道点名 AgiBot 人形机器人和机器狗、AheadForm 仿生机器人、ULS 外骨骼，管理层目标是在 2026
              年接入 10 多家 OEM 和 200 家优质服务伙伴。公司自有界面强调城市伙伴、制造伙伴、RaaS
              伙伴和创作者伙伴，意味着目录宽度不仅取决于机器人库存，也取决于本地服务覆盖和定制内容。履约同样外部化：订单生成后，地方伙伴负责运输、部署、操作员和现场执行，保险以及 JD
              相关维护或回收层包在流程外围。换句话说，Botshare
              更像服务网络协调者，而不是单一品牌机器人门店；每增加一个城市或场景，都需要硬件可用，也需要能准时到场的本地执行层。这个架构比集中持有机队更快放大覆盖，但也让 Botshare 依赖伙伴质量、OEM
              兼容性和不在其直接控制内的售后基础设施。
