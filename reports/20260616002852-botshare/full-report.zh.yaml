        blocks:
          - type: paragraph
            body: >-
              最重要的近期风险是执行负担。Botshare
              的上线材料和访谈反复描述一门远不止撮合供需的生意：用户在平台下单，地方伙伴履约，工程师现场调参，操作员监控实时运行，公司还承诺跨多城市服务保障。上海节假日报道让隐藏人工变得可见。工程师描述的日常包括交付前检查、实时监控、参数调整和应急响应；在密集公共场馆里，机器人可能遭遇碰撞、意外指令、人群拥挤和长时间运行。Securities
              Daily 2026 年 6 月保险特写把这一点从 Botshare 扩展到整个品类：运输、跨场景部署、第三方伤害、系统故障和高昂维修都是租赁核心风险，不是边缘情况。因此，Sohu
              的反向观点重要——护城河可能属于能大规模协调物流、维护、保险和恢复的人，而不是列出最多机器人的人。这让 Botshare 的服务网络既是公司最好的资产，也是最大的运营负债。
