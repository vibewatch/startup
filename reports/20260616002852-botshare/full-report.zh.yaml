companyProfile:
  summary: >-
    Botshare 是一家位于上海浦东的机器人租赁平台，把自己定位为 Robot-as-a-Service
    市场和服务层，连接机器人供给、地方服务伙伴和企业用户。公开材料显示，早期牵引力最强的场景是活动、零售、餐饮、办公和推广部署；管理层和政策相关报道则把工业制造、仓储、物流和园区运营包装成下一条扩张线。公司与 Agibot
    生态绑定很深，上线数月内就打出独角兽级估值头条，但经常性收入、留存、利润率、治理和单位经济模型仍披露很少。
