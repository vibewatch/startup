  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 公司 / 渠道
      - 公开定价信号
      - 合同模式
      - 包含能力
      - 未知项
      - 含义
    rows:
      - - Botshare
        - 公开报道覆盖从低于 CNY2,000 的促销到高端定制套餐
        - 短期租赁与场景套餐模式
        - 视套餐而定，包含机器人、配送、操作人员、保险和定制编程
        - 抽佣率、实际利润率和利用率均为私有信息
        - 竞争点更多在打包服务广度，而不是单纯 listing fee
      - - Wanjiyi Rental
        - 未找到清晰公开标价
        - 平台型租赁，背后有联盟支持
        - 机器人匹配、标准化 O&M、生态联盟赋能
        - 实际定价和伙伴经济性仍未披露
        - 定位压力来自宽场景覆盖，而非透明价格
      - - JD / Unitree 渠道
        - 官方租赁发布披露可按日或长期灵活使用，但没有稳定价目表
        - 零售商主导租赁，加售后基础设施
        - 发现、预订、物流、维修、保险、回收和数据服务
        - 零售层与租赁层之间的单位经济性是私有信息
        - 即便没有最清晰的公开日租价表，JD 也能竞争
      - - ZMProbots / Unitree G1
        - 自助 $299/day 起，或全服务活动套餐约 $1,875/day
        - 直营租赁页，提供自助或操作人员带队活动套餐
        - 配送、回收、保护保障，以及可选受训操作人员
        - 跨国家定价和利用率不能与中国日租价直接比较
        - OEM 关联直营租赁可能绕开中立市场，直接拿到旗舰人形机器人需求
      - - Futurobots / Unitree Go2-A2
        - 7 天最低租期，按国家实时定价
        - 直营多日租赁
        - 配送、取件、培训、损坏保障、技术支持
        - 定价随国家和租期变化
        - 可作为供应商如何变现试用、巡检和教育用例的参照
      - - Locus / inVia / Vecna 等仓储机器人方案
        - Opex 订阅或年费叙事，而非公开日租价
        - RaaS 订阅合同
        - 硬件、软件、维护、监控、分析和灵活扩容
        - 公开标价有限，通常按报价
        - 仓储买方更看重经常性订阅经济性，而非活动式日租
      - - ABB / KUKA / FANUC
        - 定制化服务合同；没有公开日租可比口径
        - 生命周期服务、维护、现代化改造和支持
        - 规划、培训、维修、升级、备件和装机基础服务
        - 可比定价和 SLA 细节是私有信息
        - 既有厂商靠采购信心竞争，不靠可见标价
    notes: 公开证据更能说明包装和支持结构，难以归一化比较实际价格。因此本表强调合同逻辑，而不是做虚假的苹果对苹果价格对比。
