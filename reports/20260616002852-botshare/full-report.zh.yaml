      - number: '7.5'
        title: 缓释措施、监控信号与终止标准
        blocks:
          - type: paragraph
            body: >-
              公开层面的缓释措施确实存在，但都只是局部，应该用运营证据而不是叙事来判断。Botshare
              已把基础隐私条款公开，保险公司开始承保这个类别，政府政策正在打开真实世界部署场景，公司也招募了有经验的运营人员搭建全国网络。这些是必要条件，不是充分条件。投资逻辑会在几种情况下破裂：可重复企业使用不能替代活动驱动需求；城市级在线率和事故处理无法标准化；对
              Agibot 的依赖削弱生态中立性；或估值预期继续比收入和利润率披露更快复利。未来 12
              个月的正确监控框架应当很具体：订单中来自重复运营账户而非节庆活动的占比；各城市服务可靠性和事故率；多品牌供给且无冲突的证据；以及融资是否仍需要缺乏公开经济性支撑的头条式估值跳升。Botshare
              今天看起来不是被法律卡死，而是受执行约束。这个区别很重要，因为公司仍可能成功，但前提是服务基础设施成熟得比热度退潮更快，也比价格压缩侵蚀中介价差更快。
