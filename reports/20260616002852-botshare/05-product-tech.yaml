- id: trust-safety-standards
  title: Trust, safety, and technical control environment
  body: Botshare does have real trust-building layers, but most are ecosystem-level rather than platform-certified controls. Public coverage points to trained operators, bundled insurance, and JD-supported repair or recycling, while app-store disclosures at least show a maintained mobile surface with explicit privacy notices. At the policy level, China’s 2026 humanoid standards and deployment action plan are highly relevant because they focus on real-scene operation, maintenance, data governance, privacy, collision detection, force limits, emergency stops, black-box logging, and long-duration reliability. Those frameworks help explain why Botshare wants to move from spectacle into more standardized service and industrial scenarios. They also imply that future growth into logistics, inspection, or assisted-work deployments will require much tighter operating discipline than a wedding or mall activation package. The gap is that Botshare itself does not publicly disclose uptime SLAs, incident rates, operator-certification standards, insurance exclusions, or platform-level API and integration documentation, so diligence still depends on private operating evidence rather
    than public compliance artifacts.
