- id: robot-type-maturity-limitations
  title: Capability maturity by robot type
  body: 'The catalog breadth is real, but maturity differs sharply by robot class. AgiBot’s official surfaces show commercially listed humanoids and quadrupeds, yet those pages still frame the X2 humanoid around entertainment and commercial performance and the D1 quadruped around performances, inspection, and education rather than deeply integrated industrial autonomy. The product pages also disclose concrete limitations: autonomous navigation can require optional packages, manual technical problem-solving sits with the user beyond hardware warranty, the quadruped’s payload is only about 5 kilograms, and battery life is closer to one or two hours than full-shift operation. AheadForm and ULS broaden the perceived catalog into service-humanoid and exoskeleton territory, but public proof still centers on demonstrations and scenario framing rather than standardized production outcomes. The result is a viable event and pilot catalog today, with a much thinner evidence base for repeatable industrial
    or logistics performance.'
