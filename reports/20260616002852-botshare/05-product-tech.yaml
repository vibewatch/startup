    - Humanoid or mixed-robot package with choreography and operator support
    - High attention value without asset purchase
    - Novelty may not repeat and staffing remains heavy
  - - Wedding / proposal ceremony
    - One-off ceremony needing a signature moment
    - Ring-delivery or greeting robot package
    - Differentiated guest experience for a single day
    - Task tolerance is narrow; failures are highly visible
  - - Mall / holiday promotion
    - Traffic-building activation across a few days
    - Greeting, performance, and host-style robots
    - Lower cost than buying equipment and easy seasonal scaling
    - ROI still depends on footfall and human supervision
  - - School / education demo
    - Short classroom or campus program
    - Humanoid or quadruped demo unit with scripted interaction
    - Accessible trial for institutions without owning hardware
    - Battery life and technical support remain constraints
  - - Security patrol / inspection pilot
    - Light patrol or site inspection experiment
    - Quadruped deployment with remote operation and optional follow-on development
    - Cheaper field trial than buying and integrating a permanent fleet
    - Payload, endurance, and autonomy remain limited
  - - Industrial / logistics assist
    - Exploratory use in warehousing, maintenance, or assisted work
    - Future-oriented exoskeleton or embodied-robot pilot path
    - Policy alignment and low upfront access to new hardware
    - Public proof of repeatable industrial ROI is still sparse
  notes: Benefits summarize why leasing lowers adoption friction. Limitations summarize the public technical or operating constraints that still appear in current sources.
