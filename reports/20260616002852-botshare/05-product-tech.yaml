callouts:
- calloutType: strength
  title: Botshare’s real product is orchestration
  body: The strongest evidence is not that Botshare owns the best robot; it is that the company is assembling ordering, packaging, operator services, insurance, and after-sales into one commercial workflow. That is a more defendable product surface than a simple rental listing board, even if it is also much heavier operationally.
  claimRefs:
  - CE001
  - CE007
  - CE016
  - CE018
  - CE022
- calloutType: risk
  title: Operator intensity is still the key technical limiter
  body: Public sources repeatedly point to manual scripting, trained operators, setup burden, and limited autonomy or warranty support. That makes Botshare suitable for curated events and pilots today, but it also means industrial-scale repeatability remains more of a roadmap than a proven product state.
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE039
  - CE040
  - CE042
- calloutType: insight
  title: JD and insurance layers matter because uptime is the moat
  body: The more Botshare moves beyond weddings and exhibitions, the less the customer cares about novelty and the more the customer cares about repair speed, loss coverage, and fulfillment consistency. The JD and insurance tie-ins are therefore core product infrastructure, not peripheral partnerships.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
