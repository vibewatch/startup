  title: Product module / asset matrix
  columns:
  - Module / asset
  - User / buyer
  - Current maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Mini-program / app ordering surface
    - Event organizer, venue, SME buyer
    - Live
    - Scenario-led ordering, guided quote flow, multiple payment methods
    - No public conversion funnel, API, or enterprise admin documentation
  - - Humanoid rental offers
    - Marketing, events, reception
    - Live but operator-heavy
    - High visual impact and packaged choreography
