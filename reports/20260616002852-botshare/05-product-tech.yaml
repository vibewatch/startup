company:
  name: Botshare
chapter:
  number: 5
  title: Product & Technology
  summary: 'Botshare’s product is not a single robot but a service bundle: mobile ordering, multi-brand robot sourcing, local operator-led deployment, insurance, and now JD-linked after-sales. Public evidence shows a broad event-first catalog spanning humanoids, quadrupeds, bionic service robots, and exoskeletons, but the technical stack remains operator-heavy, standards-dependent, and only partially ready for industrial-grade self-serve deployment.'
sections:
- id: product-surface-ordering
  title: Product surface and ordering workflow
  body: 'Botshare presents the customer-facing product as a scenario-led rental workflow rather than a bare equipment marketplace. The English and Chinese sites both push a WeChat mini-program or app entry point, assisted by customer service for quoting and scenario adaptation, while the iOS listing adds concrete buyer controls such as scenario selection, rental duration, device quantity, operator add-ons, custom content, and multiple payment methods. Public launch and seasonal-demand coverage show the platform leaning into weddings, annual galas, exhibitions, mall activations, temple fairs, and school or parent-child events because those use cases can tolerate current robot limitations while still paying for novelty and service. In practice, the product promise is convenience plus offline fulfillment: users browse a package, configure a job, place an order, and rely on Botshare’s network to deliver a robot, operator, and script that can actually run on site.'
