- id: multi-brand-fulfillment-architecture
  title: Multi-brand catalog and fulfillment architecture
  body: 'What Botshare actually delivers is a layered orchestration stack. Supply comes from multiple robot OEMs and adjacent hardware makers; launch reporting names AgiBot humanoids and robot dogs, AheadForm bionic robots, and ULS exoskeletons, while management targets more than 10 onboarded OEMs and 200 premium service partners by 2026. The company’s own surfaces emphasize city partners, manufacturing partners, RaaS partners, and creator partners, which means catalog breadth depends as much on local service coverage and custom content as on robot inventory. Fulfillment is similarly externalized: after an order is booked, local partners handle transport, deployment, operators, and on-site execution, with insurance and JD-linked maintenance or recycling layers sitting around that process. In other words, Botshare is closer to a service-network coordinator than to a monobrand robot storefront, and each incremental city or scenario requires both hardware availability and a local execution layer that can show up on time. This architecture scales reach faster than a centralized fleet would, but it also makes Botshare dependent on partner quality, OEM compatibility, and after-sales infrastructure outside its direct control.'
