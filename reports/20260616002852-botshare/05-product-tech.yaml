  - - Quadruped rental offers
    - Patrol, education, demo buyers
    - Live
    - Lower price point and stronger terrain adaptability than humanoids
    - Short battery life and light payload limit heavier workflows
  - - Bionic service robots
    - Hostessing, experiential retail, exhibitions
    - Showcase / early commercial
    - Lifelike appearance extends event and reception scenarios
    - Public proof is marketing-led; reliability data absent
  - - Exoskeletons
    - Industrial and logistics users
    - Showcase / pilot
    - Expands catalog beyond pure spectacle into labor-assist use cases
    - Botshare has not published deployment case studies or safety KPIs
  - - Operator and custom-content package
    - Customers needing polished performance
    - Live
    - Trained operators and custom skill packs reduce setup burden
    - Operator curriculum, staffing mix, and reusability are undisclosed
  - - Insurance layer
    - Risk-sensitive buyers and partners
    - Live
    - Body-loss plus third-party liability cover lowers adoption friction
    - Policy terms, exclusions, and deductibles are not public
  - - JD after-sales / recovery layer
    - Service partners and OEMs
    - New 2026 extension
    - Adds maintenance, recycling, and logistics infrastructure
    - Botshare-specific repair SLA and contractual scope are not public
  notes: Rows mix Botshare-owned surfaces with launch and partner coverage. “Maturity” reflects public evidence quality, not an engineering certification.
