  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: Public uptime, incident frequency, on-time delivery, and mean-time-to-repair metrics by robot type, city, or partner tier.
    whyItMatters: Botshare’s moat is supposed to be stable fulfillment, but public evidence still shows capability statements rather than measurable service reliability.
    diligencePath: Request partner scorecards, MTTR dashboards, incident logs, and SLA commitments from Botshare and JD-linked after-sales operations.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: platform-integration
    missingEvidence: Public Botshare API, SDK, admin-console, or enterprise integration documentation for customers and service partners.
    whyItMatters: A platform that wants to move into industrial or recurring enterprise workflows usually needs clearer systems integration than a consumer event-booking flow.
    diligencePath: Ask for partner onboarding manuals, API docs, data-rights terms, and any platform documentation separate from OEM hardware guides.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: insurance-terms
    missingEvidence: Policy wording, exclusions, deductibles, premium logic, and loss-ratio data for Botshare’s robot insurance products.
    whyItMatters: Insurance is presented as a trust layer, but without terms it is hard to judge how much risk is actually transferred away from customers or partners.
    diligencePath: Request the policy schedule, underwriter deck, claim examples, and scenario-by-scenario premium tables from PICC or Botshare.
    relatedQuestionRefs:
    - QE009
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: industrial-repeatability
    missingEvidence: Named case studies and utilization or repeat-order data for non-event scenarios such as patrol, logistics, maintenance, or exoskeleton-assisted work.
    whyItMatters: The investment case depends on moving beyond novelty, but public proof of sticky industrial usage is still limited.
    diligencePath: Request cohort-level order data, named industrial pilots, deployment duration, and renewal metrics by scenario class.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE004
