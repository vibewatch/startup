  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: A fuller list of named enterprise customers, property operators, and merchants using Botshare beyond the few public examples.
    whyItMatters: Without broader named proof, the public customer set may overrepresent showcase deployments and underrepresent durable commercial usage.
    diligencePath: Request customer reference list by vertical, deployment status, and renewal state; reconcile against platform GMV by segment.
    relatedQuestionRefs:
    - QU011
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal frequency, and contract-length data by segment.
    whyItMatters: Customer-quality underwriting depends more on repeat behavior than on one-off deployment logos, especially for a marketplace with seasonal demand spikes.
    diligencePath: Request monthly cohort tables for event, retail, office, restaurant, and industrial customers with repeat-order and revenue-retention views.
    relatedQuestionRefs:
