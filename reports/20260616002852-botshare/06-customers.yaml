- id: adoption-and-order-mix
  title: Adoption trajectory, order mix, and named deployment proof
  body: 'The strongest hard demand signal in the public pack is the 2026 Spring Festival surge. People''s Daily Online and China Daily both say Botshare had already logged more than 1,000 holiday orders by February 12 and expected to exceed 5,000 by the end of the holiday period. The same two sources say more than 54 percent of those orders were concentrated in Chinese New Year greetings, temple fairs, and shopping-mall performances, which is useful because it reveals not just volume but mix: Botshare had real demand, yet the mix leaned heavily toward promotional and experiential work rather than recurring operational automation. Global Times adds the clearest named brand example, reporting that Haidilao became Botshare''s first major client and planned to place leased robots in select stores before Spring Festival for calligraphy, dance, and customer interaction. Public proof therefore exists, but it is still mostly campaign-like or seasonal, so the chapter should not overstate durability.'
