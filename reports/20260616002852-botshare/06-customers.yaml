- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value / status
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - NRR / GRR / churn
    - null
    - All customer segments
    - high that it is undisclosed
    - Request cohort retention, gross churn, and net expansion by segment
  - - Contract length / renewal rate
    - null
    - Office, retail, restaurant, and event contracts
    - high that it is undisclosed
    - Request standard contract term, renewal frequency, and minimum commitment
  - - Repeat-customer prevalence
    - Xinhua says repeat customers are rare
    - Event and promotional rentals
    - medium
    - Request monthly repeat-order share and top repeat verticals
  - - Operator intensity
    - Xinhua quotes a rational 1:1 operator-to-robot ratio
    - Complex humanoid deployments
    - medium
    - Request operator hours per deployment and labor cost per order
  - - Trust / risk mitigation proxy
    - 1,000+ robots insured with aggregate coverage above RMB 200M
    - Cross-segment fleet operations
    - medium
    - Request claims frequency, incident rate, and whether insured fleets have better renewal behavior
  notes: Null means Botshare has not publicly disclosed the metric in reviewed sources; the table uses indirect durability proxies where direct retention reporting is absent.
