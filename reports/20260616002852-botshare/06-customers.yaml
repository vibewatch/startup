    - Retail and brand-channel merchants
    - Robot-assisted mobile retail, themed pop-up stores, and brand interaction
    - Early ecosystem launch
    - 163 report shows Botshare entering structured retail operations with Flash Shop and downstream brand merchants
    - This is ecosystem/channel proof more than disclosed Botshare merchant cohort data
