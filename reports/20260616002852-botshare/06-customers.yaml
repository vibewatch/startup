- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Why it matters
  - Current evidence
  - Impact
  - Diligence path
  rows:
  - - Holiday and event concentration
    - Promotional budgets can spike quickly but may not renew like operating contracts
    - People's Daily / China Daily say >54% of Spring Festival orders were greetings, temple fairs, and shopping malls
    - Could create seasonal revenue volatility and weak cohort durability
    - Request monthly revenue mix by event, retail, office, and industrial categories
  - - Named-account concentration opacity
    - One named restaurant account and one named office-property deployment do not reveal revenue concentration
    - No public top-customer share is disclosed
    - A few large accounts could dominate marketplace GMV without investors seeing it
    - Request top-10 customer mix and largest-account share
  - - City-partner execution dependence
    - Botshare scales through local service nodes, not just software
    - Yangtse says city partners handle local delivery while platform handles orchestration
    - Quality variance or partner churn could hurt fulfillment and reputation
    - Request partner SLA compliance, churn, and city-level fill rates
  - - Service-layer moat vs commoditization
    - Price compression weakens simple listing arbitrage and shifts value to logistics, repair, and insurance
    - Sohu says differentiation is moving to delivery, maintenance, and recovery capabilities
    - If Botshare cannot out-operate peers, customer acquisition may not translate to durable margins
    - Request delivery SLA, repair turnaround, and gross margin by service bundle
  - - Lack of recurring retention disclosure
    - Without NRR, GRR, churn, or renewal data, logos may overstate durability
    - No public retention metrics are disclosed and Xinhua says repeat customers are rare
    - Underwriting confidence stays low even if deployment count is real
    - Request cohort retention, repeat-order frequency, and contract renewal data
  notes: The risk table separates adoption breadth from durability so the chapter does not over-credit marketplace activity as recurring customer quality.
