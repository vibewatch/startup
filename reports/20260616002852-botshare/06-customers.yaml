    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 customer mix, and sector concentration by GMV or revenue.
    whyItMatters: Botshare could look diversified by logo count while still being economically concentrated in a small set of event agencies, channels, or accounts.
    diligencePath: Request concentration schedule by customer, channel partner, and vertical with a trailing-12-month revenue or GMV basis.
