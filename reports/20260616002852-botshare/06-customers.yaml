company:
  name: Botshare
chapter:
  number: 6
  title: Customers
  summary: 'Botshare has credible early adoption proof across event, retail, restaurant, office, and marketing-led use cases, with especially strong evidence around Spring Festival demand, a 50-city launch footprint, and an expanding city-partner network. However, the public customer picture is still campaign-heavy rather than recurring-software-like: named proof is limited, more than half of holiday orders were promotional, repeat customers are described as rare, and no public source discloses NRR, GRR, churn, contract length, or top-customer concentration.'
sections:
- id: segments-and-use-cases
  title: Customer segments, sectors served, and buying surfaces
  body: 'Botshare is not selling to one homogeneous customer class. Official site copy positions the platform as a matchmaker between robotics service providers and end clients, and explicitly highlights restaurants, retail, and corporate events as target sectors. Launch and trade-show coverage broadens that set into conferences, weddings, education, malls, exhibitions, cultural tourism, celebrations, and reception workflows. That matters because the payer often differs from the user: a brand manager may fund a mall activation, a restaurant chain may use the robot to improve guest engagement during a holiday campaign, while an office operator or landlord may care more about tenant experience and property traffic. The official material and later deployment reporting consistently suggest that Botshare wins first where customers want short-duration robotic capability without owning hardware, while management keeps framing industrial, logistics, and routine service scenarios as the next expansion
    wedge rather than the current revenue center.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU017
