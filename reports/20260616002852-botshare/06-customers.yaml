- id: durability-and-concentration-risks
  title: Retention visibility, expansion limits, and concentration risk
  body: 'The weakest part of Botshare''s customer case is durability. No reviewed public source discloses NRR, GRR, churn, renewal rates, contract length, repeat-purchase frequency, or top-customer revenue share. Xinhua is explicitly cautionary: repeat customers are rare, many rentals still depend on novelty and entertainment, and the market has to move from “show” to “service.” The same Xinhua feature says current deployments often still require manual scripting and roughly one operator per robot, while Sohu argues that the commercial moat is shifting away from listing robots online and toward logistics, maintenance, insurance, repair, and recovery. Those points matter for customer concentration as much as for margins. If more than half of Spring Festival orders are greetings, temple fairs, and mall shows, then current demand is likely concentrated in event calendars and promotional budgets. Botshare may broaden into office operations, store service, light industry, and logistics, but public
    evidence still describes that as an expansion path rather than a proven recurring base.'
