      - number: '4.5'
        title: 财务结论与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              KEENON 的公开财务画像几乎完全由缺失项定义，而不是由已知项定义。任何公开表面都从未披露收入数字、年经常性收入
              （ARR）、毛利率、EBITDA、现金余额、烧钱速度、客户流失或单位经济性。即便按私营公司标准看，公司信息黑箱也很彻底； 没有管理账和经审计财务报表的直接访问，无法评估收入质量、利润率轨迹或资本充足性。

              三种情景框定资本充足性问题。乐观情景下，强劲硬件出货和增长中的 RaaS 账本已经产生足够收入，仅靠 2021 年融资 就能维持运营。基准情景下，公司已经消耗大部分 D
              轮资金，谨慎管理现金，同时靠国际扩张带来新收入。悲观情景下， KEENON 需要新资本，且正在低调融资。三种情景都与可观察证据相容。IFR 认为「真实生产场景中的实际能力目前仍局限于
              演示机或试点项目」，这一判断专指人形机器人，并为 KEENON 的 XMAN 收入线引入执行风险；配送机器人分部则成熟得多。 酒店机器人市场到 2030 年 24% CAGR
              的增长，为需求提供了有利背景。收入质量、硬件与 RaaS 组合、客户留存和地理 P&L 分布，是最急需尽调的四个财务维度。没有这些输入，无法可靠搭建任何投资财务模型。
