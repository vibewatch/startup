      - number: '7.5'
        title: 人员、执行与人形机器人分心风险
        blocks:
          - type: paragraph
            body: >-
              KEENON 创始 CEO Li Tong 是公司最主要的公开面孔，也是与公司战略愿景、投资人关系和客户背书叙事联系最紧的人。高级管理团队的深度和继任准备情况没有公开披露。对一家处于 IPO
              前、经营在高资本和高信任行业的公司来说，CEO 层面的关键人依赖是实质风险。截至 2026 年 5 月，我们审阅的 KEENON 英文沟通中，没有公开具名 Chief Financial
              Officer、Chief Revenue Officer 或 Chief Technology Officer。

              海外执行能力一直是缺口。KEENON 称业务覆盖 60+ 个国家和 600+ 个城市，但这一覆盖主要靠伙伴渠道分销搭建，而不是 KEENON
              自有销售和服务团队。非中国市场的机器人维护，需要本地现场服务网络，配套训练有素的技术人员、备件物流和响应时间保证。西方市场——北美、欧洲、中东——没有公开记录的服务基础设施，这构成了公司在这些地区扩张的结构性障碍。

              XMAN 人形机器人系列（XMAN-F1 和 XMAN-R1）可能把 R&D 资源从核心服务机器人收入线拉走。IFR 2026 年 5 月对中国“十五五”规划的评估明确表示，“mass adoption of
              humanoid robots as universal factory helpers or in private households will not happen within the near- and
              medium-term future”，并指出“十五五”规划把人形机器人的商业可行性推向 2026–2030 周期末。若 KEENON 向人形机器人开发投入大量资本和工程人力，核心
              DINERBOT、BUTLERBOT 和 KLEENBOT 产品线用于质量改进、客户支持和地理扩张的资源可能减少。
