      - number: '6.4'
        title: 分销渠道与伙伴策略
        blocks:
          - type: paragraph
            body: >-
              KEENON 的国际市场进入主要依赖酒店和设施管理分销伙伴，而不是直销队伍。YY Group 以设施管理和酒店服务为伞，覆盖 新加坡、马来西亚、泰国、越南和阿联酋，使其成为 KEENON
              同时进入五个东南亚市场的单一具名入口。KT Group 则把 Korea Telecom 的商业酒店和智能楼宇网络作为 KEENON 机器人在韩国的分销载体。伙伴渠道模式减少了 KEENON 配置本地销售办公室的
              需求，也加快了在电信或酒店运营商已有企业关系市场中的参考客户获取。代价是客户关系、续约决策和反馈回路都经由伙伴中介， 而不是由 KEENON 直接掌握，从而产生对伙伴商业健康和目标一致性的依赖。KEENON 在
              Interclean Amsterdam 2026 参展，显示 公司在酒店主线之外，也在主动扩展欧洲商业清洁渠道。按公司自有披露，全球分销覆盖已累计到 60+ 国家和 600+ 城市，但该网络
              的密度和商业激活程度因地区差异很大。
