      - number: '8.3'
        title: 情景分析与风险调整后估值
        blocks:
          - type: paragraph
            body: >
              乐观、基准和悲观情景围绕三组变量搭建：市场增长轨迹、利润率改善速度和披露情况，以及退出或流动性事件时间。

              乐观情景（$2.5–4.0 billion，概率信号约 20%）：服务机器人市场按预测高端增长。Keenon 到 2027 年仍保持 IDC 三项第一 排名，成功商业化 XMAN-R1 人形机器人，并实现有意义的
              RaaS 合同渗透，从而改善利润率结构。公司要么以 $2.5 billion 或以上估值完成增长轮融资，要么在 2027–2028 年于香港交易所或新加坡 IPO。SoftBank
              仍是建设性战略股东。没有重大地缘政治升级限制进入关键西方企业市场。中国“十五五”规划带来超出基准轨迹的额外国内收入加速。

              基准情景（$1.5–2.5 billion，概率信号约 55%）：Keenon 机队每年增长 20–30%，但利润率和盈利能力仍未披露并存在争议。近期不发生
              IPO；最可能的退出是与全球设施管理集团、酒店连锁或中国科技集团进行战略 M&A，按估计收入 5–7x 定价。D 轮（按 CB Insights 分类）估值区间为 $1.5–2.0
              billion。地缘政治摩擦保持高位但可控；Keenon 把增长集中在东南亚、韩国、中东和日本，而不是直接开拓美国或欧盟企业客户。人形机器人项目（XMAN-R1）仍处于有限部署试点阶段。

              悲观情景（$600 million–$1.2 billion，概率信号约 25%）：SoftBank Vision Fund 2 的组合纪律推动 Keenon
              仓位被减记；下一次融资成为折价轮。美国和欧洲出口管制收紧，限制中国机器人硬件进入关键基础设施场景，实质削弱西方市场扩张。随着 Bear Robotics、Pudu Robotics
              和资金充足的中国本土同行加剧价格竞争，硬件毛利率未能改善。人形机器人发布到 2027 年仍未形成商业牵引力。如果需要增长资本，融资价格会显著低于 2022 年 C 轮锚点。

              概率加权中点：应用近似概率权重后，预期价值约为 $1.7–2.0 billion——大致等于或略低于 2022 年 C 轮价格，取决于假设约 $29 million 后续融资带来的稀释。C
              轮进入的投资者在价格上很可能接近盈亏平衡，并可能因增长轮融资面临进一步稀释。任何明显高于 $2 billion 的进入价格，都要求对乐观情景落地有很高信心。
