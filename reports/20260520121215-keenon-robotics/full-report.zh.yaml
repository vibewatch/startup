  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按垂直与地域划分的客户分层
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 至少服务四个不同客户垂直。餐厅和餐饮是公司的创始市场：KEENON DINERBOT 配送机器人把食品从厨房自动 运到餐桌，用于高翻台休闲餐厅和火锅店。全球最大火锅连锁
              Haidilao 在 2018 年开出 KEENON 所称的「全球首家智能餐厅」后， 成为锚定参考客户。酒店与住宿垂直主要由 BUTLERBOT
              产品服务，处理酒店和度假村里的客房用品配送与大堂导航。亚洲和西方市场 都长期缺工，酒店垂直因此存在结构性拉动需求。医疗与医药垂直由 COVID-19 疫情部署催化：2020 年，KEENON 机器人在中国 100
              多家医院和隔离中心执行无接触药品和餐食配送，在紧急条件下建立了医疗参考基础。由 KLEENBOT 服务的商业清洁垂直最新， 公开记录也最少，面向零售、交通和物流场所的设施管理买方。地域上，KEENON
              在中国本土的装机基础仍最集中，其次是东亚 （经 KT Group 进入韩国）、东南亚（经 YY Group 进入新加坡和马来西亚），以及通过分销合作而非直销团队覆盖的更广泛国际市场。
