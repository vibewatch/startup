  - id: FE001
    title: Keenon 产品架构图——技术层
    type: stack
    layout: standard
    summary: 梳理 Keenon 配送和清洁机器人家族从物理硬件到导航、AI、车队管理和客户集成的技术栈。XMAN 人形机器人作为单独的新生平台放在栈顶；除硬件外，尚无已确认的生产就绪层。
    data:
      layers:
        - label: 硬件平台
          detail: >-
            底盘、执行器、电池、充电系统和机身传感器。DINERBOT：38–71 kg 底盘；KLEENBOT C55：150 kg；S300：300 kg 承载的无货架结构，配 23 cm 行业低底盘。底盘专利覆盖 CAE
            仿真悬架（T9）。电池选项包括自动回桩、手动适配器、15 秒快速换电（S100、S300、C40、C55）。
        - label: 感知与传感
          detail: >-
            LiDAR（主要距离感知和 SLAM 建图）、立体视觉摄像头（每台机器人 1–4 个，视型号而定，用于 3D 障碍检测）、RGB 摄像头（T10 和更高型号）以及防撞机身条。T8 可检测 5 cm
            以下障碍物。S300 采用双 LiDAR + 立体视觉 + VSLAM，冗余度最高。
        - label: 导航与建图（SLAM / VSLAM）
          detail: >-
            LiDAR SLAM：构建持久空间地图，并处理动态改道。VSLAM（T10、S300）：基于摄像头的视觉特征跟踪，在部分遮挡下补充 LiDAR。S300
            离线模式：无需网络连接即可在设备端规划路径。部署建图：VSLAM 取消磁条 / QR 码；S300 声称 1 天完成现场设置，相比传统 3–6 个月。
        - label: AI 路径规划与多机器人调度
          detail: >-
            专利 AI 算法为同时运行的机器人优化路径。KOM 2.0 AI 平台覆盖全车队任务分配、调度优先级、死锁规避和实时路线调整。可作为本地部署或云托管车队管理器运行。T3、T9、T10 和 S-series
            支持多机器人调度。
        - label: 集成与 IoT 层
          detail: 电梯 IoT 集成（W3 BUTLERBOT）：与楼宇 BMS 通信，自主呼梯、乘梯和出梯。PMS 集成支持酒店前台调度。舱门自动化（W3）。每栋楼都需要匹配特定电梯协议。
        - label: 客户应用与车队 UI
          detail: KOM 2.0 网页 / 移动车队看板：创建任务、查看机器人状态、部署地图和分析。机器人端 UI：触摸屏（10.1–23.8 英寸，视型号而定）、语音提示、托盘 LED 引导。T10 可定制头部配件、表情和外观皮肤。
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE017
  - id: FE002
    title: Keenon 配送机器人客户工作流——餐饮场景
    type: flow
    layout: wide
    summary: 展示餐厅如何使用 DINERBOT 完成桌边配送：从厨房下单，到机器人调度、导航、送达，再返回基站充电。图中标出机器人替代或补充人工的触点，以及依赖哪些集成。
    data:
      nodes:
        - id: N01
          label: 厨房员工在调度终端或 POS 下单
          detail: 员工选择目标桌号，并把菜品放到机器人托盘上；可通过 KOM 2.0 API 接入现有 POS
        - id: N02
          label: KOM 2.0 调度最近的可用机器人
          detail: 车队管理器按距离、电量和当前任务队列，从空闲池中选择最优机器人；多机器人调度避免走廊冲突
        - id: N03
          label: 机器人通过 LiDAR SLAM 自主导航
          detail: 机器人沿预先建好的路线前往目标餐桌；用立体视觉动态避开员工、食客、家具等障碍；遇阻实时重规划路线
        - id: N04
          label: 机器人到桌；用屏幕、灯光和语音提醒食客
          detail: 托盘 LED 点亮目标托盘；10.1–23.8 英寸触摸屏显示引导；语音提示食客取餐；AI 托盘检测（T10）确认取走
        - id: N05
          label: 食客取餐；机器人通过托盘传感器确认
          detail: 重量传感器或 AI 托盘检测确认托盘已空；若托盘仍有载荷，机器人等待确认超时；向 KOM 2.0 记录配送事件
        - id: N06
          label: 机器人返回厨房基站，或自动回桩充电
          detail: 若电量高于阈值，返回厨房等待下一次调度；若低于阈值，自主导航到充电桩；车队管理器更新可用状态
      edges:
        - from: N01
          to: N02
          label: 下单调度信号
        - from: N02
          to: N03
          label: 路线分配
        - from: N03
          to: N04
          label: 到达餐桌
        - from: N04
          to: N05
          label: 食客取餐
        - from: N05
          to: N06
          label: 任务完成
    claimRefs:
      - CE009
      - CE017
      - CE019
  - id: FE003
    title: 关键依赖图——Keenon 产品与技术
    type: dag
    layout: wide
    summary: 列出可能扰动 Keenon 产品交付、导航可靠性、集成能力或市场准入的关键外部依赖。每个节点代表一类依赖；边显示哪些 Keenon 产品或能力依赖该项。
    data:
      nodes:
        - id: D01
          label: 中国 LiDAR / 传感器供应链
          detail: 主要 LiDAR 传感器供应商位于中国（Livox、RoboSense、Slamtec）。出口管制、部件短缺或关税变化都会影响所有依赖导航的产品。
        - id: D02
          label: 自研 SLAM / VSLAM 算法核心
          detail: Keenon 导航基于内部开发的 SLAM 和 VSLAM 算法，并由 50+ 项专利覆盖。算法精度、地图漂移，以及新环境边缘案例处理，是关键技术风险。
        - id: D03
          label: 楼宇电梯 IoT 基础设施
          detail: W3 电梯集成要求每栋楼都有兼容的 BMS / 电梯控制器 API。老旧楼宇、专有电梯控制器和非标准协议，会带来按场地逐一集成的风险。
        - id: D04
          label: 网络 / 云连接（KOM 2.0）
          detail: 多机器人调度和车队分析依赖 KOM 2.0 连接。S300 是唯一已确认可离线运行的型号；其他型号都依赖场地 Wi-Fi 或 5G。
        - id: D05
          label: 电池芯和充电硬件供应商
          detail: 电池芯（DC 24V–25.6V 电池包）、充电桩硬件，以及 24/7 型号（S100、S300、C40、C55）的快速换电物流，都需要可靠的供应商关系。
        - id: D06
          label: 企业客户现场建图与上线
          detail: 所有基于 SLAM 的型号在自主运行前，都需要先完成现场建图。初始地图精度、布局更新的变更管理，以及技术员可用性，都是部署瓶颈。
      edges:
        - from: D01
          to: D02
          label: LiDAR 数据输入 SLAM 引擎
        - from: D02
          to: D03
          label: SLAM 导航机器人需要电梯通行
        - from: D02
          to: D04
          label: 路线计划同步到车队管理器
        - from: D04
          to: D03
          label: 电梯控制命令经网络发送
        - from: D05
          to: D02
          label: 电池状态限制机器人可用性
        - from: D06
          to: D02
          label: 现场地图质量决定导航精度
        - from: D01
          to: D05
          label: 供应中断与电池供应问题同时发生
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE018
      - CE021
