      - number: '3.6'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Keenon 的主要竞争护城河是规模（IDC 在 2025 年称其为市场领导者）、产品宽度（单一同行中最宽的 组合）和生态深度（KT Group、Shangri-La、Vision Fund
              背书）。每一道护城河都有实质耐久性风险。

              规模护城河正在被侵蚀：如果 OrionStar 声称的 60,000 多台部署属实，它已经落在 Keenon 未经验证的 100,000 多台数字的一个数量级以内。Pudu
              和其他中国厂商也在同一地理市场增长。IFR 2026 年 5 月 关于中国第十五个五年规划的报告显示，国家导向的具身 AI 和机器人投资将加剧中国本土竞争，并压低全行业
              制造成本，加速核心导航栈商品化。多家中国机器人硬件厂商现在使用相似的 LiDAR SLAM 组件，削弱了整机 之间的技术差异。

              Bear Robotics 与 LG Electronics 是西方市场最可信的威胁：LG 的全球商业销售基础设施叠加 Bear 的 工程路线图（清洁、仓储、多产品），形成一个有能力在三到五年内追上 Keenon
              产品宽度的西方竞争者。 具体到美国医院和政府采购，Bear 的本土来源与 Aethon 长期积累的记录构成优先购买条件；任何中国厂商 若不做结构性调整，都无法复制。

              车队管理软件带来中等切换成本：运营商如果已经完成场地建图、培训员工使用某家供应商的车队控制套件，并把 机器人接入 PMS 和电梯系统，换供应商需要两到三个月重新部署。这是有意义的摩擦，但对成本驱动型运营商
              还不足以决定选择。SaaS 或 RaaS 合同结构还能进一步降低切换成本，因为客户可在合同结束时替换供应商， 而不是等资本化资产报废。

              反向竞争证据：价格压力已经能从市场结构看出——多家中国厂商在同一地理市场用相似硬件、相近价格竞争，长期 会压缩毛利率。2021 年中国餐饮机器人市场增长 110%，但所有厂商的复购数据和流失率均未出现在公开来源，
              留存耐久性仍是未知数。硬件商品化是最严重的结构性风险；Keenon 的 KOM 2.0 VLA 模型和人形机器人扩张 是对该风险的战略回应，但截至 2026 年 5 月，商业验证仍处早期。
