      - number: '1.4'
        title: 产品组合与技术平台
        blocks:
          - type: paragraph
            body: >-
              KEENON 的产品组合覆盖四大类：餐饮自主配送机器人（DINERBOT 系列）、酒店及多楼层服务机器人（BUTLERBOT 系列）、商用清洁机器人（KLEENBOT 系列）以及近期推出的 XMAN
              人形机器人系列。这种宽度使 KEENON 区别于只押注单一垂直场景的服务机器人竞争者。

              DINERBOT 产品线包括 T3（卫生设计）、T8（紧凑机身，可在 55cm 通道中导航）、T9（40kg 高载重）、T10（配送与营销，iF Design Award 2025 获奖产品）和
              T11（窄通道营销专用），并面向全球餐厅市场提供 T5 和 T6。T1 是全球首款自主配送机器人（2016 年发布），也是首款进入量产的同类产品（2018 年）。BUTLERBOT W3
              可在多楼层酒店环境中通过电梯配送。S 系列（S100、S300）面向重载快递和工业配送场景。

              KLEENBOT 清洁产品线于 2023 年随 C30 推出，到 2025 年底扩展至 C40（专业 4-in-1 地面清洁机）、C55（面向大空间的三滚刷设计）和 C20（面向小空间的紧凑机型）。C55
              采用行业首创的三滚刷设计，集成清扫和刷洗，超大水箱单次加水可覆盖相当于三块足球场的面积。

              在 AI 和软件层，KEENON 于 2025 年 9 月 26 日发布 KOM 2.0（KEENON Operator Model 2.0）——公司称其为全球首个面向服务行业的自研
              VLA（Vision-Language-Action）模型。KOM 2.0 结合 K-Mind（感知）、K-Act（行动）和情境学习，并通过 ProS 提供特定角色专长，使机器人能够自主感知、理解和行动。2025
              年 7 月，KEENON 在 WAIC（World AI Conference）上海首次展示其双足人形服务机器人。XMAN-R1 和 XMAN-F1 人形机器人于 2026 年 4 月随最新 KLEENBOT
              产品正式发布，标志 KEENON 进入人形机器人细分市场。
