      - number: '3.2'
        title: 直接同业画像 — Pudu Robotics、Bear Robotics 与 OrionStar
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics（普渡科技）约成立于 2016 年，总部位于深圳，是与 Keenon 运营形态最相似的竞争者。其产品组合覆盖餐厅配送机器人、酒店服务机器人和商用楼宇机器人，映射 Keenon 的
              DINERBOT、BUTLERBOT 和 KLEENBOT 产品线。Pudu 网站版权显示 2026，确认公司仍在持续运营。Pudu 已完成多轮融资；公开引用数字显示累计融资达到或超过 $150
              million，但公司未在已审阅来源中发布经审计财务报表。Pudu 在中国餐厅机器人市场与 Keenon 直接竞争，并已在东南亚、日本、韩国和欧洲市场进行国际部署。缺少独立发布的出货量数据，使其无法与
              Keenon 做直接台数比较。

              Bear Robotics 成立于 2017 年，总部位于 Silicon Valley（Redwood City, California），四轮融资合计约 $175.8 million：$2.8 million
              种子轮（2018）、$32 million Series A，SoftBank Robotics 参与（2020）、IMM 领投的 $81 million Series B（2022），以及 LG
              Electronics 出资的 $60 million Series C（2024）。2025 年宣布的 LG Electronics 战略联盟，把 Bear 的工程能力与 LG
              面向餐厅、零售、工厂和仓库的全球商业分销触达结合起来。Bear 核心产品线是 Servi 系列（Servi、Servi Mini、Servi Plus）：紧凑型酒店业配送机器人，配备 LiDAR
              导航、防洒托盘、66 至 88 磅载荷能力，充电四小时可运行 12 小时。2026 年，Bear 推出 Servi Clean（商用清洁）和 Carti Low-Profile 仓库 AMR 产品线。相较
              Keenon 和 Pudu，Bear 的美国基地和 LG 合作关系，构成其在西方和韩国采购流程中的结构性优势。

              OrionStar Robotics 背靠 Orion technology group，声称已在 60 多个国家部署 60,000
              多台机器人，并提供直接同业中最宽的产品组合：LuckiBot（送餐）、LuckiBot Pro 和 LuckiBot Pro Autodoor（带自动门集成的安全配送）、CarryBot（仓库
              AMR）、GreetingBot Mini 和 GreetingBot Nova（30 多种语言的 AI 接待），以及 CleaniBot（商用清洁）。如果 OrionStar 的 60,000+
              部署口径准确，其规模接近 Keenon 估计的全球规模，双方在“规模可信度”这一销售维度上形成正面竞争。两家公司都没有发布经独立审计的出货注册表。
