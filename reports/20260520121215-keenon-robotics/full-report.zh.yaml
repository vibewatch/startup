      - - 酒店 / 酒旅客房与走廊配送机器人
        - 多楼层配送机器人（接入电梯）、酒店用品配送、走廊导航、RaaS 合同
        - 前台自助入住终端；礼宾 AI 聊天；行李处理设备；户外代客泊车
        - 酒店总经理或运营负责人（买方）；酒店管理公司或物业业主（付款方）
        - 核心垂直场景——BUTLERBOT 系列；与 Shangri-La Group 的合作验证其进入高端层级的能力
      - - 商用室内地面清洁机器人
        - 餐厅、酒店、医院、零售场所的自主洗地与扫地机器人；RaaS 清洁合同
        - 家用 / 消费级扫地机器人（iRobot、Dyson）；户外清扫机；工业地面抛光机
        - 设施管理负责人（买方）；物业运营方或 FM 承包商（付款方）
        - 增长中的垂直场景——KLEENBOT 系列（C30、C40、C55、C20）；贴近配送机器人客户群
      - - 医院和医疗物流机器人
