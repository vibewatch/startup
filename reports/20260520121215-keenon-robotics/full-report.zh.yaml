  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 至少有两条已确认的商业收入路径：资本购买模式下的一次性硬件销售，以及 机器人即服务（Robotics-as-a-Service，RaaS）订阅模式，即按经常性费用部署机器人。YY
              Group Holding Limited （NASDAQ: YYGH）在 2025 年向 SEC 提交的文件确认了双模式结构；文件披露，在新加坡和马来西亚合作中，
              KEENON「将提供……多种部署选项，包括按需模式和资本所有权模式」。硬件销售是更传统的收入流：买方直接 购买机器人，用于餐饮、酒店、医疗和商业清洁。RaaS 渠道把资本开支从客户转移到 KEENON，带来经常性
              订阅收入，但代价是更高的前期资产负债表投入。

              KEENON 的产品线覆盖 DINERBOT（餐饮配送）、BUTLERBOT（酒店客房配送）、KLEENBOT（商业清洁）以及 XMAN
              人形机器人系列。每条产品线对应一个不同垂直场景，买方画像、合同长度和定价动态也不同。管理机器人 车队的 KOM 2.0 AI 平台引入了潜在的软件即服务层，但公司未披露软件专项价格。根据公司披露，截至 2025
              年，KEENON 覆盖 60 个以上国家和 600 个以上城市；这种地理宽度把收入分散到监管和竞争动态不同 的市场。通过 YY Group
              等酒店集团和设施管理公司分销协议获得的伙伴渠道收入，是第五个收入维度；它能在 不等比例增加销售人数的情况下放大规模。
