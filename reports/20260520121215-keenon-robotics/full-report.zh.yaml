      - number: '3.5'
        title: 定价、包装与渠道策略
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，主要直接餐厅机器人竞争者——Keenon、Bear Robotics、Pudu、OrionStar——均未在 官方网站公布标价。Bear Robotics 采用其材料所称的订阅或
              RaaS（机器人即服务）模式，但没有披露 月费或前期硬件成本。根据 Keenon 的产品页和解决方案页，其商业模式看起来以硬件销售加软件和服务订阅 为中心，但没有给出价格。Pudu 和 OrionStar
              在已审阅英文网站内容中也未公布价格。

              该领域唯一有独立来源的价格基准来自 Aethon 的 TUG 医院机器人：据 Becker's Hospital Review 对 UCSF Medical Center 25
              台机器人队列的报道，租赁价格为每台机器人每月 $1,500 to $2,000，或 单台购买价 $75,000 to $140,000。该价格对应带药房安全功能的高规格医院配送机器人，不能直接与
              餐厅配送机器人相比，但为受监管环境中的高端室内自主配送硬件提供了数量级锚点。

              竞品集体不公开价格，意味着定价权、折扣做法和净合同价值从公开来源看完全不透明。运营商评论中引用的 行业从业者估计，餐厅配送机器人的一次性购买成本通常在每台 $10,000 to $20,000，订阅则为每台每月
              $500 to $1,000，但 Keenon 的具体条款尚未确认。Bear Robotics 的 Servi 产品包含前期硬件成本和 订阅，二者拆分未披露。

              渠道定价差异又增加了一层不透明度。Keenon 通过六个国际市场的直属子公司销售，并在其他地区依靠区域 分销商；价格很可能因市场而大幅不同。Bear Robotics 借助 LG Electronics
              分销，可能形成不同打包 方式（例如与 LG 商用显示屏或电器合并销售），从而产生一个脱离独立机器人 SKU 的价格比较点。尽调应 从 Keenon
              管理层取得真实合同条款，并在至少两个地区对运营商做渠道核验，三角验证实际合同经济性。
