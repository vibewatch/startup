      - number: '8.2'
        title: 可比公司集合与估值方法
        blocks:
          - type: paragraph
            body: >
              Keenon 在可比公司图谱中位置特殊：服务机器人领域没有商业规模相当的私营公司，上市同业要么是早期投机性载体，要么业务规模小得多。本报告采用四个视角。

              上市公司可比：Serve Robotics（SERV，Nasdaq）是一家从 Uber 于 2021 年拆分出来的美国人行道配送机器人公司；截至 2025 年 6 月 30 日，其非关联方市值约为 $584.9
              million，机队超过 2,000 台机器人，商业收入仍处早期。尽管 2026 年 1 月收购 Diligent Robotics（医院自动化）扩展了可服务市场，Serve Robotics
              仍是一个尚未盈利的增长载体。Richtech Robotics（RCRT，Nasdaq）是一家位于 Las Vegas
              的餐厅和酒店机器人制造商，属于小市值上市可比公司，收入仅为低个位数百万美元，企业价值也相应更低。两家上市可比公司的收入倍数都不适合直接套用到 Keenon
              的规模；它们反映的是早期增长溢价和投机性可选性，而不是稳态盈利能力。

              私营公司融资轮：Bear Robotics（总部 Sunnyvale 的餐厅机器人制造商，自 2020 年起获得 SoftBank Robotics 支持）在 2024 年 C 轮从 LG Electronics
              融资 $60 million，累计融资约 $173 million，估值估计在 $300–500 million 区间。Pudu Robotics 是 Keenon 最接近的中国同行，已完成多轮累计超过 $200
              million 融资，行业分析师估计隐含估值在 $600 million–$1.2 billion 区间。

              收入倍数法：没有经审计财务报表，分析师只能用部署机队乘以单台机器人平均收入估计来代理 Keenon 收入。以 70,000+ 台设备、单台年收入估计 $2,000–$4,000 计算（反映硬件销售、经常性软件 /
              维护和新兴 RaaS 合同的组合），隐含收入运行率为 $140–280 million。按 5–10x 收入倍数计算——这个倍数适合这种规模和增速下的硬件加经常性收入业务——企业价值落在 $700
              million–$2.8 billion，中点约为 $1.5 billion。要达到区间上沿，需要持续机队增长、利润率披露改善，并给出清晰的正现金流路径。

              M&A 退出倍数：商用机器人和自动化领域的先例交易——包括 ABB 收购 ASTI Mobile Robotics、Zebra Technologies 收购 Fetch Robotics——成交价为过去收入的
              3–6x。战略收购方（大型酒店集团、物流公司或多元化中国互联网平台）考虑到 Keenon 的全球市场地位和企业客户基础，可能愿意给出 6–8x 收入。按当前估计收入运行率，该区间对应 $840
              million–$2.24 billion 的退出企业价值。
