          - type: callout
            title: 主要风险：估值悬而未决与披露缺口
            body: >
              2022 年 $2 billion
              估值是在接近零利率环境、私募市场倍数见顶时确定的。没有公开财务报表、机队利用率数据或近期独立第三方融资轮，就没有客观依据确认该估值仍然成立、被维持，还是已经减记。硬件利润率不透明，再叠加没有公开的单台盈利能力竞争分析，是最大的尽调阻塞点。
