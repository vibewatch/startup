      - number: '6.3'
        title: 采用轨迹与部署规模
        blocks:
          - type: paragraph
            body: >-
              KEENON 披露的部署里程碑显示早期增长很快，之后年份则变得不透明。CEO Li Tong 在 2021 年 9 月表示，KEENON 已在全球 出货超过 20,000 台机器人，该数字由 36Kr
              报道佐证。更早报道显示，2020 年前后达到 10,000 台里程碑。公司现在声称截至 2025 年，装机基础超过 100,000 台，部署在 60+ 国家和 600+
              城市；但这一数字没有任何分析师或文件独立审计或佐证。IDC 认可 KEENON 在中国商用服务机器人餐饮细分中的市场位置，称其连续三年市场份额和增速均排名第一；SCMP 在 2024 年报道了 这一点。IFR
              的全球服务机器人市场数据确认，2024 年全球售出 276 万台服务机器人，其中配送机器人属于增长最快的 品类之一——这为 KEENON 声称的轨迹提供行业顺风背景，尽管 KEENON
              在全球池子中的份额没有独立量化。Mordor Intelligence 跟踪的酒店机器人市场预计到 2030 年将以 24.1% CAGR 增长，说明 KEENON 最大可服务细分背后有结构性需求。已确认的
              2021 年 数字（20,000+ 台）与未确认的 2025 年声称（100,000+ 台）之间相差五倍，且没有独立验证；这是重大尽调核验要求。
