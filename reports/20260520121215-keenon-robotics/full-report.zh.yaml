      - number: '7.6'
        title: 缓释阶梯与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              缓释 KEENON 风险，需要一套结构化监控机制，用明确阈值区分可接受经营风险和足以打破投资逻辑的事件。监管侧，最关键且可监控的触发点包括：中国国家互联网信息办公室确认执法行动、披露 PIPL
              罚款或调查，或美国通过立法明确把类似 NDAA 的采购限制扩展到服务机器人。任何一项发生，都需要立即复核投资逻辑，因为机构和政府邻近垂直场景的可服务市场会受到实质损害。

              财务和融资侧，主要触发点是 KEENON 到 2027 年底仍未完成后续融资（D 轮后六年），或 SoftBank 在 Vision Fund 2 组合报告中正式宣布减记 KEENON
              仓位。任一事件都说明外部资本无法以可接受条款获得（暗示业务前景恶化），或主要机构赞助方正在与这笔投资拉开距离。

              客户和伙伴侧，关键触发点包括：（a）Haidilao 公开终止或实质缩减 KEENON 机器人部署；（b）YY Group MOU
              到达任何已宣布的到期或续期日期，却仍未转化为有约束力的采购订单或服务协议；（c）KT Group 宣布与竞争机器人品牌合作，或终止与 KEENON
              的关系。任何一个事件都会拿掉参考客户叙事的一根支柱，并要求正式重新评定集中度风险分数。

              能降低风险的正向信号包括：披露经审计财务报表或提交招股说明书、公布 KOM 2.0 的独立安全认证、宣布把 YY Group MOU 转为有约束力合同，或由独立第三方验证 100,000+
              台机器人安装基数的说法。
