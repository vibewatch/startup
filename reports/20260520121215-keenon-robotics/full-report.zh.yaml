      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议：观察
            body: >
              Keenon Robotics 是全球商用服务机器人领导者，具备真实的独角兽资质；IDC
              已确认其地位，蓝筹投资人和企业伙伴也提供支撑。但四年多估值不透明、缺少经审计财务报表、硬件利润率风险，以及针对中国公司的地缘政治折价，使得在 $2B C 轮估值锚点上无法给出买入评级。当前应保持观察；若收到
              FY2025 经审计财务报表、确认 D 轮条款，并看到毛利率改善证据，才可能上调至买入。
            calloutType: recommendation
