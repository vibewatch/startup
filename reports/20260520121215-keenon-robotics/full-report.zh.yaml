  - id: TV005
    title: 投资逻辑破裂与止损触发器
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价融资
        - 新一轮以低于 $1.5B 投后估值完成
        - 确认估值受损；现有股东被显著稀释
        - 退出或重组持仓；重跑完整尽调
      - - 出口管制扩大至中国服务机器人
        - BIS / 美国商务部将 Keenon 列入 Entity List，或出台广泛行业限制
        - 将西方企业市场的可服务机会削减估计 30%+
        - 投资逻辑立即破裂；切换到悲观情景
      - - IDC 市场领导地位丧失
        - 下一次 IFR / IDC 数据中，Keenon 不再位居全球商业服务机器人第一
        - 市场领导溢价这一主要估值锚被削弱
        - 下调至继续研究；重新评估竞争护城河
      - - SoftBank Vision Fund 2 强制出售 / 老股交易
        - SVF2 以较上一轮估值折价 >30% 出售 Keenon 持股
        - NAV 减记获得独立公平交易确认
        - 悲观情景确认；按折价水平重新定价入场
      - - 机队年流失率超过 15%
        - 客户流失或运营方破产，使已部署基数在 12 个月内减少 >15%
        - 削弱经常性收入逻辑和单位经济假设
        - 推翻收入运行率模型；回到继续研究
    notes: 止损触发器是二元事件；未触发不代表乐观或基准情景成立。监控节奏：IDC 每年一次，融资事件按公告跟进，出口管制文件通过 Federal Register 实时跟踪。
    claimRefs:
      - CV024
      - CV025
      - CV027
      - CV030
      - CV038
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与毛利率
        - FY2024 和 FY2025 经审计损益表；按收入类型拆分的毛利率
        - 没有财务数据，所有估值模型只能靠机队数量做代理；毛利率相差 10 个百分点，EV 会变动约 $500M
        - 公司 CFO；作为投资条款书条件索取
      - - 单台机器人单位经济
        - 单台年收入；部署成本；维护成本；远程监督成本
        - RaaS 可行性和 EBITDA 转正路径的关键驱动因素
        - 运营团队；对照 Serve Robotics 10-K 可比数据做基准
      - - 收入结构拆分
        - 硬件销售、SaaS / 软件、服务化合同收入占比
        - RaaS 合同毛利上限更高；收入结构切换会推动估值重评上行
        - 销售负责人；与合作伙伴协议交叉核对
      - - D 轮确认
        - CB Insights 所称「D 轮」到底基于已完成轮次，还是前瞻性标注？条款和估值是多少？
        - 以 $2B 或以上完成的新一轮确认此前估值；过桥或弱化条款融资则释放压力信号
        - 股权结构表审阅；法律顾问尽调
      - - SoftBank NAV 标记
        - 截至 2025 年 12 月基金报告，SVF2 对 Keenon 持仓的当前账面价值
        - 为当前公允价值提供独立、公平交易视角验证
        - SVF2 LP 报告或二级市场询价
      - - 客户流失与续约条款
        - 前 20 大企业客户年流失率；平均合同期限和续约率
        - 高流失会推翻已安装基数粘性逻辑和经常性收入增长模型
        - 客户访谈；尽调中索取 CRM 数据
    notes: 尽调事项按对投资逻辑完整性的影响排序。第 1、2 项是任何买入建议的前置阻断项。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV039
