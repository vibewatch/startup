      - number: '7.4'
        title: 财务、披露与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              KEENON 几乎处于财务信息黑箱状态。截至 2026 年 5 月，公司没有公开披露收入、毛利率、EBITDA、现金余额或烧钱速度。唯一确认的资本事件是 2021 年 9 月由 SoftBank Vision
              Fund 2 领投的 USD 200 million D 轮，使累计披露融资约为 USD 244 million。没有经审计财务报表，就无法判断 KEENON 是否有足够现金跑道、RaaS
              模式下资本强度有多高，或是否产生正经营现金流。OECD 对 AI 行业经济性的分析指出，扩张 AI 硬件业务需要持续把大量资本投入库存、物流和服务基础设施；这些成本会随地理扩张叠加。

              机器人即服务（Robotics-as-a-Service）模式引入了随规模放大的结构性资本强度：KEENON 必须先为机器人硬件垫资，再在订阅周期内收回成本，同时承担库存、维护和报废处置风险。如果 RaaS
              合同时长较短或续约率偏低（HBR 2023 年分析认为劳动力市场条件变化时这很常见），KEENON 的营运资本状况可能承压。SP Global 对商业场所 RaaS
              业务的市场分析也把营运资本和折旧风险列为投资者的关键担忧。

              服务机器人行业中，硬件商品化风险正在加速。Bear Robotics、Pudu Technology 和 Orion Star
              等竞争对手都在生产可比的餐饮和酒店配送机器人，价格点越来越有竞争力。随着平均售价被压缩，KEENON 本就无法验证的利润率结构会面临结构性压力。公司没有披露任何流动性事件（IPO
              或战略出售）的计划或时间表。作为一家 2021 年 D 轮私营公司，2025 年之后 SoftBank 和其他投资者实现回报的压力可能增强，任何退出的条款和时间表都存在不确定性。
