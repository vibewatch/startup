    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、使命与结构
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics Co., Ltd.——以中文名 上海擎朗智能科技有限公司（Shanghai Keenon Intelligent Technology Co.,
              Ltd.）运营——是一家总部位于上海的自主服务机器人公司，成立于 2010 年。公司网站页脚显示 ICP 备案号 沪ICP备10216247号，备案属地为上海。LinkedIn
              资料显示，公司注册地址为中国上海市金海路 1000 号 56 号楼，邮编
              200120。公司自称是“商用服务机器人与解决方案的全球领导者”，使命围绕用智能无人配送和服务方案替代餐饮、酒店、医疗及相邻行业的人工劳动。

              到 2022 年，KEENON 已在美国、荷兰、阿联酋、日本、韩国和中国香港设立全资子公司，支撑主要全球市场的直接商业和支持运营。LinkedIn 将公司规模列为 1,001 至 5,000
              名员工。公司为私营有限责任公司（LinkedIn 分类为 “partnership”），在已审阅材料中未披露 IPO
              计划。公司的商业模式以自主配送、清洁和服务机器人硬件销售为核心，软件集成和云端机队管理作为补充；但硬件、软件和服务之间的具体收入拆分并未公开披露。

              产品品牌架构覆盖 DINERBOT（餐饮配送）、BUTLERBOT（酒店服务）、KLEENBOT（商用清洁）和 XMAN（人形机器人），各自瞄准不同部署垂直场景。2025-2026 年，KEENON 通过推出
              XMAN 双足人形机器人系列和 KOM 2.0 视觉-语言-动作基础模型扩展品牌身份，明确切入“具身智能”市场叙事。
