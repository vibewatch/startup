      - number: '2.2'
        title: 市场规模：多重口径与矛盾估计
        blocks:
          - type: paragraph
            body: >-
              没有分析师单独拆出一个全球一致、狭义定义的“室内商用服务机器人”市场，能与 Keenon 范围完全重合。现有规模估计使用的定义彼此重叠但并不相同，因此必须用多重口径保留不确定性。

              最宽口径下，MarketsandMarkets 将 2024 年全球服务机器人市场估为 USD 47.1 billion（预测 2029 年 USD 98.65 billion，CAGR
              15.9%）；Precedence Research 将 2025 年估为 USD 62.85 billion（预测 2035 年 USD 233.8 billion，CAGR 14.04%）；Mordor
              Intelligence 将 2025 年估为 USD 68.31 billion（预测 2031 年 USD 209.72 billion，CAGR 19.51%）。三组 2025 年基准值相差超过
              40%，反映其对医疗机器人、消费机器人和物流自动化的纳入标准不同。MarketsandMarkets 口径明确覆盖所有专业终端用途中的地面、空中和海上平台。Precedence Research
              纳入个人机器人。Mordor Intelligence 覆盖专业、消费和国防子细分市场。定义不一致使直接比较风险很高。本次未审阅到独立的方法论审计。

              中等口径下，Mordor Intelligence 将 2025 年酒店业机器人市场估为 USD 0.61 billion，并预计到 2031 年增至 USD 2.23 billion，CAGR
              24.1%。其中，配送系统在 2025 年以 39.05% 份额领先（约 USD 238 million），酒店贡献 43.35% 的终端用户需求。餐厅和酒吧预计到 2031 年录得最快 CAGR，达到
              26.05%，显示餐饮服务垂直仍处于更早的采用曲线。北美在 2025 年占酒店业机器人 37.70% 市场份额；亚太预计以 25.8% CAGR 增长最快。这些数字是细分层面上 Keenon 最相关的 TAM
              代理。

              最窄口径下，Precedence Research 将全球配送机器人市场（室内 + 户外）2024 年规模估为 USD 409.30 million，预计 2034 年达到 USD 6,578.20
              million，CAGR 32.01%。食品和饮料细分在 2024 年占最大份额 42%（约 USD 172 million），室内配送细分预计到 2034 年是增长最快的类别。北美以 42%
              份额领先，亚太预计拥有增长最快的区域市场。

              这些估计不能相加；它们部分重叠。酒店业机器人估计（Mordor，USD 0.61B）在限定室内 F&B 细分后，口径很可能比配送机器人估计（Precedence，USD 0.41B）更窄；这也说明 Mordor
              计入了 Precedence 未纳入的其他机器人类型（清洁、安全、礼宾）。若基于中国餐饮机器人 2021 年已记录的 110% 增长做自下而上估算，以约 20,000 台机器人、约 $15,000 ASP
              为基数推算，中国 F&B 机器人市场 2021 年约为 USD 300-500 million——与 Precedence 2024
              年全球数字大体一致，暗示中国以外的全球市场仍处早期，中国占主导。已审阅来源中没有可用的中国特定 SAM 独立规模估计。

              规模尽调缺口很大：(a) 没有分析师在收入层面将纯室内机器人与户外配送机器人拆开；(b) 没有分析师在可免费访问的近期（2024-2026）报告中发布中国餐饮服务机器人市场规模；(c)
              医院机器人和酒店机器人市场估计常常与手术、康复或远程呈现机器人打包，而 Keenon 并不生产这些产品；(d) RaaS 合同收入没有与硬件收入稳定区分，使增长率比较不可靠。
