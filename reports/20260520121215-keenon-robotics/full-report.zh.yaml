        title: 展示材料
        blocks:
          - type: callout
            title: 具名客户证据高度集中在三大旗舰关系
            body: >-
              KEENON 可公开核验的客户基础，主要落在 Haidilao（2018 年）、疫情期间医院场景（2020 年）、KT Group（2024 年）和 YY Group（2025
              年）。最近两个具名合作，一个不具约束力（YY Group MOU），另一个未披露部署范围（KT Group）。尽管公司称已安装 100,000+
              台机器人，却没有披露中端市场或中小企业（SME）具名客户，这意味着长尾客户基础几乎完全未公开。任何一个旗舰客户关系流失，都会在对应垂直场景里结构性削弱 KEENON 的客户背书叙事。
            calloutType: insight
