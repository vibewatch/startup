      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              KEENON 机器人作为客户场所内的联网终端运行，场景包括餐厅、酒店、医院和商业设施；它们连接 KOM 2.0 云管理平台，用于车队协调、路线优化和远程监控。截至 2026 年 5 月，公开信息中没有找到
              KEENON 云基础设施的安全认证（SOC 2 Type II、ISO 27001 或同等认证）。CISA 多次发布联网设备安全风险以及软件物料清单（SBOM）重要性的指引；KEENON 没有发布任何 SBOM
              或安全披露。每台部署在酒店、医院或餐厅的机器人，都是客户环境中的长期联网传感器；一旦云平台或机器人固件被攻破，就可能带来数据外泄风险。

              运营可靠性是实质问题。2023 年 Hacker News 工程讨论中，长期存在对自动配送机器人正常运行时间、边界场景碰撞处理和真实部署维护负担的怀疑。HBR 2023 年对
              Robotics-as-a-Service 的分析指出，机器人停机和 ROI 预期落空，是 RaaS 合同不续约的主要原因。如果 KEENON 机器人在生产环境中无法守住正常运行时间承诺，RaaS
              渠道留存率会恶化。公司没有披露任何产品的平均故障间隔时间（MTBF）、正常运行时间 SLA 条款或维护响应时间保证。

              KEENON 供应链集中在中国，因此会暴露在组件短缺、物流约束、地缘政治事件或技术出口监管限制之下。更广义的商用清洁产品线（KLEENBOT
              C20、C40、C55）比餐饮和酒店产品线更新、公开资料更少；独立性能验证也不存在。最后，IFR 2026 年关于中国“十五五”规划的分析指出，人形机器人在真实生产场景中的能力仍停留在演示或试点项目阶段——这说明
              KEENON 对 XMAN 人形机器人的投入，短期商业价值可能有限，却会消耗可观的 R&D 资源。
