      - number: '7.3'
        title: 伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              KEENON 的机构投资者基础由一个已披露参与方主导：SoftBank Vision Fund 2，该基金在 2021 年 9 月领投 USD 200 million D 轮。SoftBank Group
              自身财务历史中包括对 Vision Fund 2 组合公司的大额减记，且公司最近的战略沟通已经公开转向 AI 基础设施投资。若某个在 KEENON
              持有大额仓位的投资人同时承受组合层面的业绩压力，它未必会持续提供后续资本支持，也可能寻求对少数股东不利的退出条款。KEENON D 轮没有公开披露其他机构投资者。

              客户集中度在参考客户和分销伙伴两端都很高。Haidilao——全球最大火锅连锁——是 KEENON 最常被引用的参考客户，也很可能是餐饮垂直场景的重要收入贡献方。一旦 Haidilao 关系流失，KEENON
              面向全球潜在餐饮客户的背书叙事会明显变弱。YY Group（NASDAQ: YYGH）谅解备忘录由两份 SEC 6-K 文件确认（2025 年 8 月和 2026 年 3 月），措辞持续不具约束力：“plans
              to”、“intends to”和 “as we prepare for deployment”。在 SEC 安全港条款下，该 MOU 不附带收入义务，也没有披露有约束力的采购订单或服务协议。KT Group
              合作（2024 年 9 月，AP News 确认）同样没有披露商业条款——公开来源看不到最低采购承诺、排他安排或部署里程碑。

              KEENON 的国际分销模式依赖 YY Group 和 KT Group 等第三方伙伴，而不是自建直销团队。这些中介可能代理竞争机器人品牌，激励结构也可能不同于
              KEENON，并掌握与终端客户的续约关系。如果任一伙伴终止或降低对 KEENON 的投入，从 KEENON 视角看，对应地理市场实际上就无人覆盖。SCMP 2024
              年报道称，中国服务机器人公司在海外市场面对文化阻力、进口复杂度和本地维护网络有限等摩擦；分销越依赖伙伴，这些风险越会放大。
