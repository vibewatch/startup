      - number: '3.4'
        title: 能力与分销对比
        blocks:
          - type: paragraph
            body: >-
              Keenon 的产品覆盖面在已审阅的直接同行中最宽，横跨餐厅配送（DINERBOT）、酒店服务 （BUTLERBOT）、商业清洁（KLEENBOT）和人形机器人（XMAN）。截至 2026 年 5
              月，没有其他竞品在 一个商业产品组合里同时覆盖这四类。Bear Robotics 在 2026 年推出 Servi Clean 后进入清洁场景，但 仍没有酒店专用机器人或人形机器人。Pudu
              覆盖配送和清洁，但尚未公开宣布人形机器人项目。 OrionStar 提供配送、清洁、迎宾和仓储，除了人形机器人之外，覆盖面大体可与 Keenon 相比。 Aethon
              垂直聚焦医院配送和酒店用品配送，不参与餐厅或清洁竞争。Gaussian 是单一品类公司，只做清洁。

              导航技术上，所有已审阅厂商都把基于 LiDAR 的 SLAM（同步定位与建图）作为核心导航方案。没有同行 发布经过独立基准测试的导航性能数据，因此无法直接做技术对比。已审阅官方来源显示，Keenon、Aethon
              和 OrionStar 均声称具备电梯集成能力；Bear Robotics 将「全楼层导航」列为产品功能；Gaussian 提到 在 Changi Airport
              可执行电梯运行。因此，多楼层作业在主要直接同行中并不是差异化能力。

              分销与渠道策略差异更明显。Bear Robotics 在 2025 年与 LG Electronics 建立合作，接入 LG 的全球 销售队伍和商业客户网络；在西方市场，这是 Keenon
              缺少的渠道优势。Keenon 的渠道伙伴（韩国 KT Group、越南 DigiCorp）具有区域属性，无法构成一个可与 LG 触达能力相比的全球分销层。Pudu 和 OrionStar
              看起来依赖本地分销商，已审阅材料中没有披露单一标志性全球渠道伙伴。Aethon 隶属 ST Engineering，在临近国防采购的医疗环境里提供采购可信度。

              信任与监管姿态是不对称维度。Bear Robotics 和 Aethon 是美国实体，并强调美国制造。中国厂商
              （Keenon、Pudu、OrionStar）在美国联邦和州级采购、获得美国政府资金的医院系统，以及欧盟公共部门 环境中面临更高审查；这些场景正在把对中国制造硬件的数据安全担忧写进规则。IFR 在 2026 年
              5 月对 中国第十五个五年规划的分析进一步把中国机器人公司抬高为国家支持型参与者，这可能让 Keenon 及其 同行在西方企业采购中的观感更复杂。
