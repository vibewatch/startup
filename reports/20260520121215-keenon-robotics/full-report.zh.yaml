            title: 关键信号：IDC 三项第一与 2025 年前企业动能
            body: >
              Keenon 的 IDC 三项第一排名，以及 2024–2025 年企业合作公告（KT Group、Shangri-La Hotels），提供了可信第三方证据：C 轮四年多后，公司仍维持市场领导地位。60
              个国家的部署基础形成规模优势，Bear Robotics 等较小同行很难快速复制。
