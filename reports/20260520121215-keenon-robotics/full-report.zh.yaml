              - CU037
          - type: callout
            title: YY Group MOU 的非约束性措辞带来收入管线不确定性
            body: >-
              YY Group 2025 年 8 月提交的 SEC 6-K 文件，在描述 KEENON 机器人部署时反复使用 “plans to” 和 “intends to”。2026 年 3 月股东信重申 MOU
              仍有效，但没有更新任何部署里程碑。两份文件都附有 SEC 安全港前瞻性陈述免责声明，因此这些承诺不构成法律义务。在签署有约束力的采购订单或服务协议之前，不能把该渠道对应的东南亚收入视为已签约积压订单。
            calloutType: risk
            claimRefs:
              - CU011
              - CU030
          - type: callout
            title: 海外市场摩擦限制西方酒店餐饮渗透
            body: >-
              SCMP 2024 年关于中国服务机器人出海的报道，列出了 KEENON 这类公司的具体障碍：西方酒店餐饮场景对自动化的文化阻力、进口关税和合规复杂度，以及本地维护现场服务网络有限。2023 年 Hacker
              News 讨论串和 HBR 的 RaaS 分析也各自指出，机器人可靠性和 ROI 兑现是运营方反复担心的问题。合在一起，这些信号说明 KEENON
              走出亚洲、尤其进入北美和欧洲时，面对的市场进入摩擦高于中国本土餐饮场景轨迹所暗示的水平。
            calloutType: risk
            claimRefs:
              - CU031
              - CU032
              - CU033
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 在 60 多个国家运营联网室内机器人，带来多司法辖区监管敞口；截至 2026 年 5 月，我们审阅的公开文件没有披露这些敞口。中国《个人信息保护法》（PIPL，2021 年 11
              月生效）和《数据安全法》（DSL，2021 年 9 月生效）要求在中国境内收集个人信息的实体取得同意、满足数据本地化要求，并遵守跨境传输规则。KEENON 机器人会在室内环境中导航和建图、记录运营数据，并连接
              KOM 2.0 云管理平台。keenon.com 发布的隐私政策承认会向全球关联方和服务提供商跨境传输数据，但没有披露 PIPL 合规认证、数据处理协议（DPA）或安全评估。按照 PIPL 第 38
              条，个人信息跨境传输必须满足以下路径之一：（a）通过国家互联网信息办公室（CAC）安全评估，（b）获得 CAC 指定机构认证，或（c）向 CAC 备案标准合同。上述任何路径都没有被公开确认适用于 KEENON。

              地缘政治上，美国 USTR 管理的 Section 301 关税对机器人及相关产品加征 25%，中国原产硬件都会受到影响。这些关税抬高美国经销商和客户的到岸成本，并削弱 KEENON
              相对美国本土制造替代品的价格竞争力。BIS 执行的出口管理条例（EAR）可能适用于 KEENON 产品使用的先进 AI 和传感器组件，尤其当公司随 XMAN 人形机器人系列扩展 AI 能力时。另一个风险来自
              NDAA Section 889：美国政府机构不得采购特定中国供应商的电信或视频监控设备；KEENON 目前似乎不在覆盖供应商名单上，但若未来立法扩展到室内导航和服务机器人，美国机构和政府采购渠道就会被关闭。

              Council on Foreign Relations 关于 Digital Silk Road
              的分析显示，西方政府正更严格审视中国科技公司部署项目中的国家关联数据风险。中国网络安全立法要求企业配合国家安全机关并在中国境内存储数据，使这种担忧进一步升高。EU AI Act 将在 2024 至 2026
              年分阶段实施，对公共或专业场景使用的 AI 系统提出合格评定要求；KEENON 的自主导航和环境建图系统可能被认定为须接受合格评定的 AI 系统。
