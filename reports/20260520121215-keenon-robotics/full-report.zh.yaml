      - number: '4.4'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              KEENON 已披露融资历史的高点是 2021 年 9 月完成的 USD 200 million D 轮，由 SoftBank Vision Fund 2 领投，CICC ALPHA Capital（China
              International Capital Corporation 关联方）和 Prosperity7 Ventures（Aramco 关联方）共同投资。The Robot Report 称 D
              轮完成时累计披露融资约为 USD 244 million，意味着 A 到 C 轮合计约融资 USD 44 million。截至 2026 年 5 月本报告生成日， 任何公开来源——媒体、SEC 文件或
              KEENON 自有通信——都未出现后续融资轮。到 2026 年 5 月，KEENON 也未在 任何公开交易所提交 IPO 招股书或上市前文件。

              YY Group（NASDAQ 上市公司，2025 年 8 月与 KEENON 签署 MOU）在 2026 年 3 月向 SEC 提交的股东信中， 将 KEENON
              描述为在新加坡和马来西亚部署机器人的活跃商业伙伴，显示公司在 D 轮完成近 56 个月后仍保持运营 健康。USD 200 million
              融资究竟已被大量消耗，还是通过收入产生而部分保留，没有私有访问无法判断。中国第十五个 五年规划（2026-2030）把机器人列为战略性国家产业，可能打开政府补贴融资、政策性银行信贷和国资基金参与等渠道；
              这些资金不一定出现在国际媒体或 SEC 文件中。现金余额、月度烧钱速度、资金计划用途，以及债务或项目融资义务全部 未披露。下一轮触发点——KEENON 已盈利、靠储备运行，还是在寻找新资本——仍不透明。
