    title: 风险热力图——KEENON Robotics 严重性与可能性矩阵
    type: matrix
    notes: 每个单元列出按可能性（横轴：低 / 中 / 高）和剩余影响（纵轴：低 / 中 / 高）定位的主要风险类别。位置反映缓释后的剩余严重性；颜色越深，风险优先级越高。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 高剩余影响
          values:
            - label: NDAA 扩展至服务机器人；EU AI Act 符合性缺口
            - label: PIPL / 数据跨境传输不合规；SoftBank 减记信号；Haidilao 集中度
            - label: US Section 301 关税负担；YY Group MOU 未转化；KOM 2.0 网络安全缺口
        - label: 中剩余影响
          values:
            - label: 出口市场 IP 保护缺口；CEO 关键人事件
            - label: 机器人可靠性 / 正常运行时间不达标；KLEENBOT 性能不及预期；R&D 人才流失
            - label: 硬件 ASP 商品化；伙伴渠道中介导致关系流失；海外服务缺口
        - label: 低剩余影响
          values:
            - label: 轻微诉讼风险
            - label: 供应链局部中断
            - label: 财务不透明（仅监测）
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR010
      - CR018
      - CR026
      - CR029
      - CR034
