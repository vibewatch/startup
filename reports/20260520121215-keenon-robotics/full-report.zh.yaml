      - number: '4.2'
        title: 定价与商业化
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，KEENON 未在官网或任何公开监管文件中公布标价。官方 KEENON 材料既没有硬件单价， 也没有 RaaS 月费。企业级 B2B
              机器人公司通常会与酒店集团、医疗系统和连锁餐饮逐单谈判价格，这种不透明 并不罕见。因此，定价只能参照已披露的竞争者来估计。

              在硬件销售渠道，已披露同行的可比服务配送机器人单价在 USD 15,000 to 30,000 区间；考虑到功能丰富度 和自主导航能力，预计 KEENON 旗舰 BUTLERBOT 与 DINERBOT
              产品线会落在该区间内或略高。在 RaaS 渠道， 市场类比显示每台机器人月费大约 USD 1,500 to 3,000，包含维护和软件。YY Group 的 SEC 文件确认， KEENON
              在新加坡和马来西亚部署的机器人同时提供按需和所有权模式，说明截至 2025 年 8 月，RaaS 层已经 上线并商业活跃，而不是未来路线图。面向仓储和工业场景等更高价值应用的 XMAN 人形机器人线，价格应高于
              标准配送机器人层，但没有数据可以约束这一估计。批量折扣、伙伴渠道利润率，以及实际价格与标价之间的差距 全部未披露。
