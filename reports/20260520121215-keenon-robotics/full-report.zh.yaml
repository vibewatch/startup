      - number: '1.3'
        title: 融资历史、估值与资本状况
        blocks:
          - type: paragraph
            body: >-
              从成立到 2021 年，KEENON Robotics 至少完成了四轮已确认融资。最早披露的是 Series A，为早期增长提供资金；细节未获公开确认。Pandaily 援引 36Kr 中文报道，称公司于
              2020 年 12 月完成“数亿元人民币” Series C，投资方包括 SoftBank Ventures Asia 和 Alibaba Group。该轮发生在公司 COVID-19
              疫情部署阶段，并伴随国际扩张加速。

              最重要的公开确认融资是 2021 年 9 月宣布的 D 轮：$200 million USD，由 SoftBank Vision Fund 领投（西方媒体称 SoftBank Vision Fund
              2），CICC ALPHA（中金甲子）和 Prosperity7 Ventures（Saudi Aramco 多元化 VC 基金）跟投。China Renaissance 担任独家财务顾问。36Kr
              当时称其为“中国商用服务机器人领域最大单笔商业融资”。西方媒体在 2022 年初将同一轮 $200M 称为 “Series C”，与中文“D
              轮”标签存在轮次字母差异；但金额和领投方在各来源中一致，强烈指向同一轮融资。

              截至本报告日期 2026 年 5 月，之后未有公开宣布的融资轮次。收入、ARR 和 EBITDA 均完全未披露。未确认 IPO
              申报或公开上市计划。未披露债务或信贷工具。公司资本状况显示，其仍依赖机构股权资金维持运营，符合商业规模下的 pre-IPO 硬件 + AI 公司特征。基于 D 轮 $200M
              融资和中国服务机器人行业可比估值，该轮当时隐含投后估值约 $2 billion，但公司未正式确认。已审阅材料中未发现 2024-2026 年独角兽身份再确认或新的估值锚点。
