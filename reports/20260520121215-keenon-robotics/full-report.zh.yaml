      - number: '1.6'
        title: 里程碑时间线与战略轨迹
        blocks:
          - type: paragraph
            body: >-
              KEENON 16 年历史可分为三个阶段。第一阶段（2010-2017）是技术开拓期：公司 2010 年成立，2013 年推出首款履带式餐厅服务机器人 “Xiaolang”，2016 年推出 DINERBOT
              T1——公司称其为全球首款自主配送机器人——从而建立商用餐饮机器人品类。

              第二阶段（2018-2022）以量产、垂直扩展和全球资本募集为特征。DINERBOT T1 于 2018 年进入量产，采用全球首条餐饮配送机器人专用量产线。KEENON 于 2018 年协助 Haidilao
              建立全球首家智慧餐厅。到 2019 年，公司扩展至全球 600 多个城市；2020 年为 COVID-19 医院推出医疗配送机器人 M1 和消毒机器人 M2；完成 Series C（2020 年 12 月）和 D
              轮（2021 年 9 月），合计融资等值超过 $300M+；并到 2022 年在六个市场设立全资国际子公司。

              第三阶段（2023 年至今）是产品多元化和 AI 集成期。2023 年 KLEENBOT C30 发布，标志公司进入专业清洁。KT Group 合作（2024 年 9 月）、Shangri-La
              酒店合作（2025 年 10 月）和 KOM 2.0 VLA 模型（2025 年 9 月）构成商业与技术里程碑。XMAN 双足人形机器人于 2025 年 7 月在 WAIC Shanghai 首次亮相，并在
              2026 年 4 月正式发布产品（XMAN-R1、XMAN-F1）。KEENON 于 2025 年 9 月入选 MIT Technology Review TR50
              最具创新力公司榜单。这些里程碑共同显示，KEENON 正从纯配送机器人公司转向多形态、AI 驱动的服务机器人平台。
