      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              2024-2026 年，五个结构性驱动因素正在推动室内商用服务机器人市场。

              劳动力短缺是最直接的驱动。OECD 成员国预计在 2025 至 2030 年间流失 15 million 名劳动者。美国 2026 年 3 月报告有 6.9 million 个职位空缺（BLS
              JOLTS），住宿和餐饮服务业空缺率持续偏高。Mordor Intelligence 酒店业机器人报告将疫情后劳动力短缺列为最大单一驱动因素，对 CAGR 的贡献约 6.8%。美国酒店业约有 1.9
              million 个空缺岗位，促使酒店运营商部署配送机器人，把剩余员工释放到能产生收入的住客互动中。

              部件价格下行是第二个驱动。IFR World Robotics 2025 报告（Mordor Intelligence 引用）显示，2022 至 2025 年间，lidar 和视觉芯片迁移到
              7-nanometer 节点，使导航栈物料成本降至 USD 1,000 以下。移动服务机器人 5 年平均总拥有成本自 2020 年以来下降约 50%。开源 ROS 2 库将软件开发周期缩短到 18-24
              个月，降低新品迭代门槛，也让机器人在更小场地具备经济可行性。

              疫情后延续的无接触服务需求是第三个驱动。Mordor Intelligence 酒店业机器人报告引用的行业调查显示，68%
              的旅行者偏好最少接触的服务触点；这种偏好在急性疫情健康担忧过去后仍然存在。将配送机器人与数字钥匙和自助入住结合的物业，报告的 Net Promoter Scores
              更高，因为客人会感知到贯穿住宿体验的一致技术叙事。

              机器人即服务（RaaS）订阅模式是第四个驱动，打开了预算受限的中端市场运营商。清洁机器人月费起步 USD 1,500，移动配送单元月费起步 USD 3,000，把大额 capex 转为可预测
              opex。Seegrid 报告其 2025 年新合同中 70% 为 RaaS，确认该模式正在跨越鸿沟。RaaS 捆绑软件更新、维护和机队管理仪表盘，降低过去让小企业却步的停机风险。RaaS
              部署的回本周期被引用为低于 18 个月。

              政府政策支持——尤其在亚洲——是第五个驱动。中国“十五五”规划（2026-2030）将机器人定位为国民经济核心支柱，要求下属行业规划对齐机器人部署目标。Japan's SME Labor-Saving
              Investment Subsidy 每处物业最高覆盖 JPY 15 million。Singapore's National Robotics Program 拨出 USD 60 million
              用于试点部署。Italy's Piano Transizione 5.0 为服务业数字化预留 EUR 6.3 billion。这些计划合计可为早期采用者降低 20-40%
              净成本，并创造国内参考案例，加速区域扩散。

              在所有已审阅分析师报告中，由中国、日本和韩国领衔的亚太都是增长最快的区域。Mordor Intelligence 预测，到 2031 年，亚太整体服务机器人市场 CAGR 为 20.57%，酒店业机器人 CAGR
              为 25.8%。Precedence Research 的配送机器人分析同样预计亚太是增长最快的区域。Keenon 总部在中国，并在日本、韩国设有子公司，这种地理集中度给了它结构性的本土市场增长优势。
