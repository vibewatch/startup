  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics
              所在市场是室内商用服务机器人市场：部署在商业场所内、无需持续人工监督即可执行重复服务任务的自主移动机器。纳入的支出包括自主配送机器人（食品、备品、药品、布草）、自主地面清洁机器人，以及同类设备的机器人即服务（RaaS）订阅合同。市场边界限定在三大核心垂直的室内专业用途：餐饮服务（餐厅、食堂、自助餐厅）、酒店业（酒店、度假村、辅助生活设施）和医疗健康（医院、诊所）。该范围不包括户外最后一公里配送机器人（Starship、Nuro）、工业仓储自动化（Kiva/Amazon
              Robotics、Locus Robotics）、手术机器人（Intuitive Surgical）和个人 / 家用消费机器人（iRobot）。

              相邻市场有助于理解规模背景，但必须明确分开。多份分析师报告显示，2024-2025 年更广义的全球服务机器人市场价值为 USD 47-68 billion，涵盖物流、农业、医疗和国防机器人，其中不少并非
              Keenon 覆盖的领域。分析师将酒店和餐饮服务机器人细分市场归入“专业服务机器人”，而专业服务机器人本身又是更大市场中的最大收入类别。室内配送机器人最接近的替代品，是人工传菜员或搬运员——现状工作流是厨房 /
              茶水间员工把托盘或推车实际送到餐桌或客房。次级替代品包括送餐升降机（固定基础设施、成本高）、传送带系统（受固定布局限制）和气动管道系统（仅限医院、载荷有限）。这些替代品都无法像自主移动机器人一样，同时做到改路径无需
              capex、多点路线和机队可扩展。

              中国仍是室内商用服务机器人迄今最大的单一国家市场。Pandaily 报道称，中国餐饮服务机器人市场在 2021 年同比增长 110%；IFR 2025 World Robotics
              报告确认，中国约占全球年度工业机器人装机量的 54%，仅制造业运营存量就约有 2 million 台机器人。IFR 于 2026 年 5
              月披露，中国“十五五”规划（2026-2030）将机器人置于国家创新议程中心，推动商业和政府采购流向国内机器人厂商。这为 Keenon
              这样的中国本土供应商创造了结构性本土市场优势；同时向日本、韩国、东南亚和中东扩张，则构成中国以外的增长机会。
