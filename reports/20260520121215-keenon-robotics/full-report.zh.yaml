companyProfile:
  summary: >-
    KEENON Robotics (上海擎朗智能科技有限公司) 是一家总部位于上海的自主服务机器人公司，由 Li Tongzhi (Tony Li) 于 2010 年创立。截至 2025 年，公司是全球商用室内服务机器人市场领导者，在
    IDC 全球出货量、全球市场份额、中国市场份额三项排名中均位列第一。产品组合覆盖 DINERBOT（餐饮配送）、BUTLERBOT（酒店服务）、KLEENBOT（商用清洁）以及新推出的 XMAN 人形机器人系列，底层由 KOM
    2.0 视觉-语言-动作 AI 平台支撑。KEENON 已在 60+ 个国家部署 70,000+ 台机器人，锚定客户包括 Haidilao、KT Group（韩国）、Shangri-La Hotels 和 YY
    Group（东南亚）。公司披露的最大融资是 2021 年 9 月由 SoftBank Vision Fund 2 领投的 $200M Series D，隐含约 $2B 投后估值。公司未公开披露收入或财务指标。
