        - label: 1. 认知 / 问题识别
          value: 100
          detail: 运营方面临严重用工短缺、工资上涨，或看到竞争对手部署机器人。2024-2026 年，劳动力市场压力普遍可见。Keenon：展会露出、KT Group 和 Shangri-La 参考案例推动认知。
        - label: 2. 供应商评估
          value: 35
          detail: >-
            运营方研究供应商；围绕功能和价格比较 Keenon、Bear Robotics、Pudu、Richtech。摩擦：RaaS 与资本开支难以横向比较；需要参考站点访问。Keenon：IDC 三项第一排名和 iF
            Design Award 提供可信信号。
        - label: 3. 试点批准
          value: 15
          detail: 内部预算持有人批准试点；IT 和设施团队评估 PMS 与电梯集成。40% 运营方将预算列为首要障碍。集成评估带来 4-12 周延迟。Keenon：认证 PMS 集成和 RaaS 选项降低门槛。
        - label: 4. 试点部署
          value: 12
          detail: 在受控场地部署 1-3 台机器人；培训员工；跟踪 30-90 天表现。员工信任和边缘场景导航是风险。Keenon：KOM 2.0 AI 支持自适应导航；多语言界面帮助培训。
        - label: 5. 购买 / 规模化决策
          value: 8
          detail: 运营方评估试点 ROI，决定铺开机队或取消。ROI 必须跨过回本门槛；多站点采购需要集团批准。Keenon：机队管理仪表盘支持多站点 ROI 报告。
        - label: 6. 续约与扩张
          value: 6
          detail: 运营方续约 RaaS，或扩展到更多场地 / 机器人类型。切换成本低（机器人可退回）。留存取决于正常运行时间和支持质量。Keenon：通过配送 + 清洁机器人组合有交叉销售机会。
