            title: PIPL 与联网设备安全带来无法量化的监管敞口
            body: >-
              KEENON 部署的联网机器人会在客户场所建图和导航，记录运营数据，并连接 KOM 2.0 云平台。中国 PIPL（2021 年 11 月生效）要求向中国境外传输个人信息的公司完成 CAC
