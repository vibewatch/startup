      - number: '5.6'
        title: 差异化、路线图与技术风险
        blocks:
          - type: paragraph
            body: >-
              Keenon 的核心差异化建立在四个要素上：在相同室内服务垂直领域超过 13 年的商业部署经验；覆盖导航、底盘、感知和 AI 算法的 50
              多项专利；可在单一企业客户关系中交叉销售的宽产品组合；以及多数纯食品配送机器人公司不提供的 IoT 电梯集成 能力。YY Group MOU（2025 年 8 月）和 SEC
              文件确认，新加坡和马来西亚已在所有权与 RaaS 两种模式下进行活跃商业部署， 为 2025 年中以来中国以外的商业活动提供了独立第三方佐证。

              XMAN 人形机器人系列（R1 和 F1）体现 Keenon 在具身 AI 上的宣示野心，但执行风险很高。截至 2026 年 5 月，任何英文来源
              都未发布技术规格——自由度、载重、操作能力、运动方式或电池续航。也没有独立确认的商业部署。IFR 对 2026 年全球人形机器人
              市场的评估确认，全行业「真实生产场景中的实际能力目前仍局限于演示机或试点项目」，这一约束直接适用于 Keenon 的 XMAN 线。 投资者应把 XMAN 项目视为商业化前阶段，且近期没有收入贡献。

              多项技术风险需要尽调。产品线中的电池续航主张（T9：最高 18 小时；T3：最高 12 小时；S300：满载最高 6 小时；C40： 清扫最高 12 小时 / 洗地 5
              小时）都使用「最高」措辞，并用星号指向测试条件。高频商业部署中的真实续航通常比制造商测试规格 低 10–30%。S300
              声称一天部署完成（而竞品传统系统需要三到六个月），这个主张有吸引力，但尚未由已发布第三方评估独立验证。 电梯 IoT
              集成依赖场地，需要逐楼宇与电梯供应商做集成，可能影响老旧建筑群中的可扩展性。任何产品线都未发布可靠性或平均故障 间隔时间（MTBF）数据，这是尽调缺口，阻碍对企业采购总拥有成本的评估。
