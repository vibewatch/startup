  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示酒店、餐饮和医疗垂直的企业买方，如何从初始认知推进到试点部署、生产车队，并最终扩张或续约。通过伙伴渠道进入（KT Group、YY Group）会压缩国际买方的评估阶段，加快从接触到试点的时间。
    approximationNotes: 阶段时长和转化动态按行业常态及现有 KEENON 部署公告估算；KEENON 未披露漏斗指标或销售周期长度。
    data:
      items:
        - id: stage-awareness
          label: 认知
          actor: 企业买方（采购 / F&B 运营 / 酒店总经理）
          description: 买方通过酒店业媒体、同行推荐、行业会议（Interclean、HICAP），或现有分销伙伴关系（韩国买方对应 KT Group；新加坡 / 马来西亚运营方对应 YY Group）发现 KEENON。
          channels:
            - 行业媒体（HospitalityTech、RoboticsBiz）
            - 行业会议
            - 伙伴推荐网络
        - id: stage-evaluation
          label: 评估 / 试点申请
          actor: 企业买方 + KEENON 或分销商售前
          description: 买方申请在单一场地试点 1–3 台机器人，以评估用工替代、客人体验和运营匹配度。国际买方通常通过本地分销伙伴接触；中国买方直接对接 KEENON 或区域办公室。
          channels:
            - 分销商演示（KT Group、YY Group）
            - KEENON 直销（中国和大客户）
            - 旗舰参考场地产品演示
        - id: stage-pilot
          label: 有限试点（1–5 台机器人）
          actor: 场地运营团队 + KEENON 集成工程师
          description: 在目标环境中单场地部署 1–5 台机器人试点。KEENON KOM 2.0 平台完成机器人上线；员工接受培训。试点评估期通常为 30–90 天。COVID 期间的医院部署在应急采购下绕过了这一阶段。
          channels:
            - 现场集成与调试
            - 通过 KOM 2.0 远程监控车队
        - id: stage-production
          label: 生产部署
          actor: 企业买方（多场地运营）
          description: 成功试点转为生产合同。买方采用硬件销售（资本支出）或 RaaS 订阅（运营支出）模式，承诺部署机器人车队。KEENON 提供维护 SLA、车队管理平台访问和 KOM 2.0 集成。
          channels:
            - 正式采购合同
            - KOM 2.0 车队管理
        - id: stage-expansion
          label: 车队扩张（多场地、多 SKU）
          actor: 企业总部 / 集团采购
          description: >-
            单场地成功生产后，买方扩展到更多物业，或增加新的产品 SKU（DINERBOT + BUTLERBOT + KLEENBOT）。集团层面合同由 KEENON 或分销商谈判。Shangri-La Group
            智慧酒店合作被定位在这一阶段。
          channels:
            - 集团采购谈判
            - 分销商企业客户管理
        - id: stage-partner-channel
          label: 伙伴渠道部署（国际）
          actor: 分销伙伴（KT Group、YY Group）+ 终端客户
          description: 韩国和东南亚的国际买方通过分销伙伴获得 KEENON 机器人；伙伴负责最后一公里物流、本地化和服务。KEENON 不直接持有终端客户关系；续约决策由伙伴居中传导。
          channels:
            - KT Group 酒店网络（韩国）
            - YY Group 设施管理（FM）和酒店组合（新加坡、马来西亚、泰国、越南、阿联酋）
        - id: stage-renewal
          label: 续约 / 增购
          actor: 企业买方 + KEENON 客户管理
          description: 硬件机器人更新周期（估计 3–5 年）或 RaaS 合同续约。增购机会包括新一代产品、扩展 SKU 组合、KOM 2.0 高级分析层，以及新场地部署。KEENON 未公开披露续约率数据。
          channels:
            - 现有客户管理
            - 产品升级计划
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU023
