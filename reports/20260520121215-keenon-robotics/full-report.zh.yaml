      - number: '6.6'
        title: 反向证据、海外风险与集中度担忧
        blocks:
          - type: paragraph
            body: >-
              两个实质反向信号值得尽调关注。第一，SCMP 2024 年报道记录，中国服务机器人公司——明确包括 KEENON——在海外市场面临有意义的
              阻力：西方酒店场景对自动化的文化抵触、复杂进口监管、缺少本地维护维修服务基础设施，以及带来北美和欧洲账户采购风险的地缘 摩擦（尤其是中美技术紧张）。第二，HBR
              对机器人即服务（RaaS）经济性的分析警告，按经常性费用收费的机器人合同比一次性硬件 销售更容易流失：如果劳动力短缺缓解、替代自动化提供商出现，或机器人正常运行时间无法持续交付承诺 ROI，客户在月费安排下的
              切换成本有限。KEENON 的客户证据集中在三大旗舰合作——Haidilao（中国餐饮）、KT Group（韩国渠道）和 YY Group（东南亚渠道）—— 独立验证的中端市场或 SME
              客户参考有限。付费企业客户总数未披露；KEENON 用机器人数量主张而不是客户数指标描述其触达。这种 集中格局构成重大客户层面风险：任何一个旗舰伙伴流失或不续约，都可能对收入和参考叙事产生不成比例影响，尤其是在
              KEENON 依赖 旗舰伙伴品牌吸引后续账户的市场。
