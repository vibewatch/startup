      - number: '5.2'
        title: 导航与感知架构
        blocks:
          - type: paragraph
            body: >-
              Keenon 当前所有配送和重载机器人都以 LiDAR SLAM（同步定位与建图）作为主导航底座。机器人在初始建图运行中构建 部署环境的空间地图，随后通过持续把实时 LiDAR
              点云数据与存储地图相关联来自主导航。这一方案省去了磁性地贴或 QR code 网格等环境改造；传统 AMR 系统需要这些改造，既增加安装成本，也提高刚性。

              高端型号在 LiDAR SLAM 之外加入视觉 SLAM（VSLAM），把基于摄像头的视觉特征跟踪与惯性或里程计数据融合，在 光照变化或 LiDAR 局部遮挡下保持定位。T10 和 S300 都明确部署
              VSLAM。S300 把 LiDAR SLAM、立体视觉融合和 VSLAM 组合成三模式栈，在检测到障碍物时支持毫秒级自主路径重规划。

              避障采用分层感知。T8 使用 3 个立体视觉传感器，可识别常见高障碍物以及 5 cm 以下障碍物，解决平面物体检测中的 常见失效模式。T10 部署 4 个立体视觉传感器加 1 个 RGB 摄像头，实现 360
              度识别。S300 面向最重载荷级别，在 立体视觉和 VSLAM 之外增加双 LiDAR。机身防撞条提供物理备份层。S100 和 S300 上的三重急停按钮允许人工介入。

              路径规划使用专利 AI 算法进行多机器人调度和动态路径优化，让单一车队管理实例协调多台机器人且不发生碰撞。T9 底盘 设计用
              CAE（计算机辅助工程）仿真开发，并由三项底盘专利覆盖，涉及独立悬挂和减震；这提升了机器人跨越门槛和最高 5 度坡面转换等不平整表面的能力。Keenon 产品资料称截至 2023 年在导航、底盘设计、感知和 AI
              算法上拥有 50 多项 专利，但截至 2026 年，公开来源无法独立验证专利数量。
