      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Keenon Robotics 的退出准备度呈混合状态。支持流动性事件的结构性理由很有说服力：公司是全球商用服务机器人市场领导者，背后有 SoftBank Vision Fund 2（其 5–7
              年持有周期正在接近），并已把伙伴基础扩展到全球知名企业品牌。中国总部科技公司近期更偏好香港或新加坡上市，以避开类似 CFIUS 的美国上市审查；尽管 WeRide 2024 年 10 月在 Nasdaq
              IPO，Keenon 仍可能设计香港 H 股发行或新加坡主板上市。

              但反对近期 IPO 的理由也很强。没有披露盈利路径，在当前软件优先或 AI 优先叙事占主导的环境下，公开市场路演会很难。硬件机器人估值在公开市场已经压缩，纯服务机器人公司相对 2022
              年前私募估值打折交易。四年没有新一轮融资公告，也带来内部估值锚问题，必须用可信路演价格区间解决。因此，近期最可信的流动性路径仍是战略 M&A，或由战略产业伙伴提供大额增长轮融资（类似 Bear Robotics
              与 LG Electronics 的交易），而不是未来 12–24 个月内上市 IPO。

              提升信心之前的关键尽调问题：（a）FY2024 和 FY2025 经审计收入与毛利率；（b）机队利用率和单台机器人年度经济性（收入、部署成本、维护、远程监督人工）；（c）收入在硬件销售、软件和
              SaaS、以及服务化合同之间的拆分；（d）确认 CB Insights “Series D” 标识是否对应一轮实际完成的融资，并给出条款和估值；（e）SoftBank Vision Fund 2 对 Keenon
              仓位的当前账面价值或 NAV 标记；（f）前二十名企业客户的流失率和续约条款。若至少拿不到上述（a）和（b），从风险调整角度看，给出高于“观察”的评级没有支撑。
