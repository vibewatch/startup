  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线与使用场景
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics 将商业产品组合划分为五条清晰产品线，每条都对应特定客户工作流。DINERBOT 线面向餐厅和餐饮 运营商，用机器人在后厨和餐桌之间配送食品饮料，替代或补充前厅服务员。T8
              是紧凑选项，最低通道宽度 55 cm， 配备 3 个立体视觉传感器，适合布局紧凑的用餐空间。T9 把容量扩展到四层可调托盘合计 40 kg，电池续航最高 18
              小时，并采用受三项底盘专利保护的车规级独立悬挂底盘。T10 是旗舰互动款，加入可动头部、23.8 英寸触摸屏、 AI 托盘检测，以及 VSLAM 加 4 个立体摄像头感知。T11 载重 20 kg，电池续航
              13.5 小时，最低通道 49 cm，处在 中端位置。

              BUTLERBOT 线面向多楼层酒店环境；机器人必须使用楼宇电梯，跨楼层配送用品、洗衣和餐食。W3 与电梯 IoT 系统集成，
              使用自动舱门提供无接触、卫生服务，并可在一次调度中通过独立可访问隔间服务最多四个目的地。T3 是更大的酒店配送 机器人，可通过 42.2 × 57.5 cm 层托盘承载最高 40 kg，电池续航 12
              小时，并具备专利多机器人调度。

              KLEENBOT 线覆盖酒店、零售和设施管理中的商业地面清洁。C20 是最轻型号（22 kg），适合较小商业空间，清洁效率最高 400 m²/h。C40 扩展到 1,100 m²/h，并支持电池更换以实现
              24/7 作业。旗舰清洁机 C55 采用业内首创三滚刷设计， 单次通过完成清扫和洗地，理论效率达到 2,376 m²/h；60 升清水箱减少每日补水次数。

              S 系列面向制造、医疗物流和工业场景中的重载物流。S100 提供 100 kg 以上载重、即插即用部署、三种充电选项 （充电桩、适配器和 15 秒换电），以及 360° 避障。S300 采用无货架平台承载 300
              kg，底盘高度 23 cm，为行业低位； 它支持最高 120 × 120 cm 的任意货架，并用 VSLAM 在最快一天内完成部署，不需要铺设磁条或安装 QR code。XMAN 人形机器人线由 R1 和 F1
              组成，2024 年随 KLEENBOT C40/C55/C20 更新一同发布；但截至 2026 年 5 月，没有发布 技术规格或部署数据。
