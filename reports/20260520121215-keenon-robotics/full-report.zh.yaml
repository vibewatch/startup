      - number: '6.5'
        title: 留存、耐久性与满意度信号
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，KEENON 未公开披露净收入留存率（NRR）、总收入留存率（GRR）、年度流失率、客户满意度评分或净推荐值
              （NPS），也没有任何分析师独立测量。早期企业硬件公司缺少留存指标很常见，但这会给耐久性评估留下显著盲点：KEENON 的复购 证据仅限于品牌化伙伴公告——Shangri-La、KT Group 和 YY
              Group——而不是队列级续约或扩张数据。YY Group MOU 通篇使用非约束 性语言，不能视为已确认收入。酒店和餐饮垂直的机器人替换周期按行业惯例估计为三到五年，意味着即便是 2018 年 Haidilao
              参考关系，到 2026 年也应进入第二或第三代机器人周期，但任何公开来源都没有续约或增购公告。2023 年 Hacker News 讨论串提出
              了开发者和运营商对自主配送机器人可靠性、维护成本和边缘案例性能失败的担忧；这与 HBR 的发现一致，即 RaaS 合同在劳动力 市场条件变化或机器人正常运行时间达不到运营商 ROI
              门槛时，会面临更高流失风险。这些信号合在一起说明，留存动态不透明，风险 可能高于 KEENON 伙伴公告节奏所暗示的水平。
