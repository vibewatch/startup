  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >
              进入 2022 年风险投资周期时，Keenon Robotics 是无可争议的全球商用服务机器人领导者。公司在 2022 年 1 月由 SoftBank Vision Fund 2 和 Prosperity7
              Ventures 共同领投，融资 $200 million，投后估值 $2 billion。这个独角兽估值建立在三根支柱上：明确的 IDC 市场领导地位、始于 2016 年的餐饮配送机器人业务，以及已接近
              10,000 台的全球机队。到 2025 年，机队规模已经超过 70,000 台机器人，覆盖 60 多个国家；Keenon 也连续多年拿到 IDC
              三项第一排名，覆盖全球商用服务机器人出货量、全球市场份额和中国市场份额。

              核心投资逻辑有五点。第一，在高增长行业中已经证明市场领导地位：服务机器人市场预计将从 2024 年的 $47.1 billion 增长到 2029 年的 $98.65 billion，CAGR 为
              15.9%（MarketsandMarkets），Keenon 是最有位置吃到这轮增长的私营公司。第二，黏性的安装基数会形成切换成本，运营方围绕 Keenon 的软件栈和服务合同搭建工作流。第三，与 KT
              Group（韩国，2024 年 9 月）和 Shangri-La Hotels（2025 年 10 月）的战略合作验证了企业级产品，也打开了竞争对手难以快速复制的结构化铺设渠道。第四，Keenon 2025
              年推出 XMAN-R1
              人形机器人，显示公司有意参与更广义的具身智能浪潮，潜在可服务市场不再只限于送餐和酒店场景。第五，中国“十五五”规划（2026–2030）明确把机器人置于国家工业战略核心，为国内龙头创造政府背书的顺风。

              反向逻辑同样重要。四年多没有公开宣布新一轮融资，让当前公允市场价值高度不确定。CB Insights 将 Keenon 归为 “Series D”，累计融资 $228.79 million，意味着除 C
              轮外大约还有 $28–29 million，估值未披露。$2 billion 估值锚定在 2021–2022 年增长倍数峰值，当时的倍数已经明显压缩。硬件为中心的商业模式天然毛利率低于软件（通常 30–50%
              vs. 60–80%），且没有公开财务数据，就无法验证 Keenon 的经济性是否在改善。SoftBank Vision Fund 2 已经对同一批投资做过大额减记，目前 NAV 中 Keenon
              仓位是高于、等于还是低于 C 轮价格并不清楚。最后，针对中国公司的地缘政治折价——源自美国出口管制、类似 CFIUS
              的审查风险，以及技术标准分裂——压低了西方投资者对中国私营科技公司的兴趣；市场通常估计相对同等西方注册地同行低 20–30%。
