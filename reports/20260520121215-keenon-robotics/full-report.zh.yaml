  - id: TM004
    title: 增长驱动与约束表
    description: >-
      Structured summary of key drivers and constraints affecting market growth, with timing, implication, and diligence
      asks.
    columns:
      - 驱动或约束
      - 方向
      - 时点
      - 影响
      - 尽调追问
    rows:
      - - 疫后劳动力短缺（酒旅、餐饮服务）
        - 驱动（+）
        - 短期（2024-2026 年仍在发生）
        - 酒旅业员工流失率比疫情前基线高 76%；2026 年 3 月美国职位空缺 6.9M；支撑机器人部署的 ROI 论证
        - 核实空缺率是持续性而非周期性；跟踪劳动力市场正常化信号
      - - OECD 范围劳动力收缩（2025-2030 年净减少 15M 名工人）
        - 驱动（+）
        - 长期（4 年以上）
        - 结构性人口因素提供顺风；日本、德国、韩国、美国的劳动力压力不受周期影响、会持续
        - 确认 OECD 预测具体适用于酒旅 / 餐饮服务，而不只是制造业
      - - 零部件价格下行（激光雷达、视觉芯片、电池）
        - 驱动（+）
        - 短期（已发生，2022-2025 年）
        - 导航 BOM 低于 USD 1,000；5 年 TCO 自 2020 年以来减半；更低 ASP 扩大可覆盖场所数量
        - 跟踪大宗商品价格趋势；ASP 下压可能挤压硬件利润率
      - - 机器人即服务（RaaS）模式拆掉资本开支门槛
        - 驱动（+）
        - 中期（2-4 年）
        - 月费 USD 1,500 起；回本少于 18 个月；Seegrid 2025 年 RaaS 合同占 70%；打开 SME 和中端市场
        - 核实 Keenon RaaS 在订单额中占比；RaaS 现金流模型可能压低近期利润率
      - - 政府政策与补贴项目（中国、日本、新加坡）
        - 驱动（+）
        - 中期（政策周期）
        - 日本每处物业覆盖 JPY 15M；新加坡 NRP 规模 USD 60M；中国“十五五”规划要求发展机器人；买方净成本降低 20-40%
        - 确认 Keenon 是否进入各市场补贴项目认可供应商名单
      - - 无接触服务偏好（68% 旅客）
        - 驱动（+）
        - 短中期
        - 疫后零接触客房服务需求延续；使用机器人的物业记录到 NPS 提升
        - 用 Keenon 客户案例验证；渗透率上升后，无接触可能变成标配，而非高端差异化
      - - 运营方前期 CAPEX 高（尤其独立商户）
        - 约束（−）
        - 近期（约束仍在）
        - 40% 运营方把预算列为首要障碍；单机 USD 8,000-20,000；初始机队 USD 30,000-80,000
        - 评估 Keenon 融资 / 租赁方案；面向餐厅规模运营方的 RaaS 可得性与条款
      - - 存量 PMS 和电梯 API 集成复杂度
        - 约束（−）
        - 中期
        - Mordor 酒旅报告称 CAGR 受 2.1% 逆风；集成失败会导致试点放弃；酒店连锁要求 PMS 认证
        - 确认 Keenon 已认证 PMS 集成；评估酒店电梯协议覆盖度
      - - 安全认证和监管合规成本
        - 约束（−）
        - 中期
        - ISO 13482 和 EU Machinery Regulation 最高使开发成本增加 20%；多司法辖区合规会拉高全球扩张成本
        - 按市场核实 Keenon 的 CE、FCC 和本地安全认证
      - - 信任、员工抵触和客人体验风险
        - 约束（−）
        - 短中期
        - 员工担心被替代；西方高端场景客人可能更偏好真人服务；数据隐私担忧带来 1.8% CAGR 逆风
        - 获取 Keenon 客户部署的 NPS 数据；检查是否有记录在案的客诉事件
      - - 宏观经济周期（低迷期酒旅资本开支收缩）
        - 约束（−）
        - 长期（潜在）
        - 衰退期酒店和餐厅资本开支被超比例削减；RaaS 提供部分缓冲
        - 建模测算旅行放缓时新机器人订单下降 10-20% 的敏感性
