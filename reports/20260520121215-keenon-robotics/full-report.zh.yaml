            body: >-
              KEENON 可公开记录的客户基础由五个具名关系支撑，证据质量各不相同。Haidilao（全球最大火锅连锁，全球门店超过 1,300 家） 在 2018 年首家「智能餐厅」中部署 KEENON 机器人，是
              KEENON 营销和第三方媒体中最常被引用的参考客户。2020 年，中国 100 多家医院和隔离中心部署机器人，建立了医疗垂直参考基础；但没有公开点名任何单家医院，也没有疫情后续约数据。KT Group
              （Korea Telecom，韩国三大全国性运营商之一）在 2024 年 9 月宣布与 KEENON 建立战略合作，AP News 和 Finance Yahoo 均独立确认；具体部署范围和商业条款仍未披露。YY
              Group Holding Limited（NASDAQ: YYGH）总部位于新加坡，提供设施管理 和酒店服务；它在 2025 年 8 月与 KEENON
              签署谅解备忘录，计划在新加坡和马来西亚业务中部署机器人——该 MOU 由 SEC 6-K 文件确认，并在公司 2026 年 3
              月股东信中重申，不过通篇使用非约束性表述，说明截至本报告生成日尚未形成已确认收入。Shangri-La Group 在 2025 年被宣布为智能酒店部署伙伴，出现在 KEENON 新闻材料和
