      - number: '3.3'
        title: 既有玩家、相邻竞争者与替代品
        blocks:
          - type: paragraph
            body: >-
              Aethon 位于 Pennsylvania 的 Pittsburgh，是医院自主室内配送领域历史最久的专业公司，运营历史超过 20 年。其 TUG 机器人产品部署在 140 多家医院；一篇引用的
              Becker's Hospital Review 文章报道称，当时其安装基数每周完成约 50,000 次配送。Aethon 披露的价格——租赁模式每台机器人每月 $1,500 至 $2,000，或买断
              $75,000 至 $140,000——是本次审阅的公开来源中，任何相邻细分竞争者唯一独立披露的定价基准。Aethon 强调美国制造硬件、电梯集成、指纹保护药品舱、温控载荷区和 24x7
              联网支持，这些都是受监管医疗采购中的差异化功能。Aethon 现已纳入 ST Engineering 投资组合，母公司是成熟的工程和国防承包商。

              Gaussian Robotics 总部位于 Singapore，专注自主商用清洁。其 ECOBOT 品牌已在六个以上国家部署于机场（Singapore 的 Changi
              Airport）、学校、办公室、购物中心、医院和酒店。Gaussian 描述其与 IFSC 的合作汇聚了 100 多年清洁服务领域经验。Gaussian 在酒店和医院商用清洁部署中，直接与 Keenon 的
              KLEENBOT 产品线（C20、C40、C55）竞争。不过，Gaussian 尚未公开披露规模、融资或定价。

              SoftBank Robotics Group 是相邻竞争者和机器人集成商。2026 年 5 月，它扩大了与 Direct Supply 的合作，在养老社区部署服务机器人。同样在 2026 年 5
              月，它宣布在美国推出自主烹饪机器人 STEAMA 和 FLAMA。2026 年 4 月，它与 Matternet 建立最后一公里配送合作。这些动作说明公司正在积极扩展商业场所服务自动化，而非退出。

              非机器人替代品在实践中是主导竞争选项。人工劳动力（餐厅服务员、酒店行李员、医院护理员和搬运员）仍是任何未签机器人合同运营商的默认选择。手推车和餐车在酒店和医院广泛使用，技术成本近乎为零。固定传送系统或传菜窗口可在高吞吐餐厅厨房替代配送机器人。每一笔销售中的核心竞争问题，都是
              3 到 5 年合同期内机器人总拥有成本，相比既有安排能否带来可衡量的人工成本下降或服务质量收益。
