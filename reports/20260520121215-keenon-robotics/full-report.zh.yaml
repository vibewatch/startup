      - number: '2.5'
        title: 采用约束、反向证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管市场动力有利，室内商用服务机器人市场仍面临结构性采用约束，会压低增长预测，并对包括 Keenon 在内的参与者构成重大风险。

              高资本开支仍是主要门槛。Mordor Intelligence 服务机器人报告引用的行业调查显示，40% 的运营商将预算上限列为采用机器人的首要障碍。中端产品中，一台室内配送机器人成本为 USD
              8,000-20,000；一家小餐厅若部署三到四台机器人，在集成、员工培训或持续服务成本之前，就要一次性支出 USD 30,000-80,000。锂离子电池每 3-4 年更换一次，成本 USD
              5,000-8,000，进一步增加生命周期负担。按门店数量看，独立餐厅运营商是全球最大细分，也最容易被这套经济性挤压。

              集成复杂度是第二个约束。室内机器人必须在动态环境中导航：电梯 API 要向机器人机队管理软件开放，物业管理系统（PMS）要把机器人调度与客房订单打通，POS 系统要与机器人配送确认对接。酒店业遗留 PMS 平台的
              API 支持出了名地差。Mordor Intelligence 将酒店业机器人市场 2.1% 的 CAGR 下修归因于“与遗留 PMS
              的互操作和集成问题”。医院也有类似的药房和护士呼叫系统集成要求。一般服务机器人采用文献记录了因集成摩擦导致的试点失败，但本次审阅的免费来源未能访问到具体案例。

              信任、新奇感和客人体验风险是第三个约束。在西方酒店市场，客人和员工可能对机器人互动产生负面反应——员工担心岗位被替代，客人则可能觉得服务缺少人情味。面向客人的场景中，机载摄像头带来的数据隐私担忧构成监管风险；Mordor
              Intelligence 估计，GDPR 等框架形成 1.8% 的 CAGR 逆风。习惯人工服务的餐厅顾客，如果把机器人互动视为降本措施而非服务升级，可能会降低参与度。

              安全和合规会增加开发成本。ISO 13482 风险评估和 EU Machinery Regulation 合格测试，最高可让开发预算增加 20%，并可能把市场发布推迟最多一年。美国 Cybersecurity
              and Infrastructure Security Agency 记录了 2025 年仓库中的 14 起机器人安全事件，说明企业买方开始要求机器人供应商提供网络安全证明。Keenon
              正在多个司法辖区同时扩张，这类合规成本会更重地压在这一类公司身上。

              宏观不确定性是潜在反向因素。消费机器人初创公司的 VC 融资已经出现回调（Mordor Intelligence 将其识别为 0.9% 的 CAGR
              逆风）；经济下行压缩酒店和餐厅资本预算的速度，通常快于经常性运营支出。若劳动力市场转松——可能削弱工资压力这一驱动——采用机器人的经济性就会变弱。不同分析师对 2024-2025 年酒店 /
              配送子细分市场的规模估计相互矛盾（USD 0.41B vs USD 0.61B），反映市场发展速度确实不确定，不应通过选择更乐观数字来化解。

              本章特定尽调缺口：(a) 没有分析师在公开、已验证报告中给出 2024-2026 年中国单一餐厅机器人市场规模；(b) 没有独立数据集确认酒店或医院机器人实际机队利用率、正常运行时间百分比或部署后留存率；(c)
              没有可访问的上市公司文件或行业协会数据，量化美国 / 欧洲餐厅中有多少在试点后评估并拒绝机器人，而不是从未评估——这块“失败试点”暗物质是重大缺口；(d) 酒店和餐厅子垂直中的 RaaS 渗透率没有公开精确报告。
