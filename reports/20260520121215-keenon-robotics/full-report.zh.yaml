      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              室内商用服务机器人市场有三方购买结构：买方（采购决策者）、用户（员工和客人）和付款方（持有预算的实体）。同一次部署中，这些角色往往并不相同。

              餐厅细分中，买方通常是连锁层面的 F&B
              运营总监或总经理，或独立餐厅的业主经营者。用户是楼面服务员工（服务员、传菜员），以及间接的用餐客人。付款方是餐厅业主实体、集团采购职能或加盟运营商。大型连锁（Haidilao、Yum
              China、McDonald's）的预算所有权在资本开支委员会；独立餐厅则在业主手中。采用触发因素是劳动力短缺程度（空缺率、工资通胀）、经营经济性（机器人每天替代 1-2
              个传菜班次）和竞争压力（邻近餐厅部署机器人）的组合。行业报道中常见 ROI 案例是，一台配送机器人成本 USD 8,000-20,000，可替代 1.0-1.5 个 FTE 传菜员，意味着回本周期随当地工资水平在
              6-24 个月之间变化。

              酒店细分中，买方是酒店总经理或运营总监；品牌酒店集团层面（IHG、Marriott、Shangri-La）的采购会施加供应商标准。用户是客房送餐和客房清洁员工，以及接收配送的酒店客人。付款方是酒店管理公司或物业业主。采用触发因素是美国酒店业劳动力短缺已有数据支撑：Mordor
              Intelligence 引用的 National Restaurant Association Labor Shortage Report 显示，2024 年餐饮服务和住宿企业的员工流失率仍比 2020 年前高
              76%。美国 BLS 2026 年 3 月数据显示，美国职位空缺总数为 6.9 million，住宿和餐饮服务业仅 3 月新增雇佣 124,000 人，确认市场范围内劳动力压力仍在延续。Keenon 与
              Shangri-La Group 的合作（2025 年 10 月）确认，高端品牌酒店是可触达且愿为集成机器人方案支付溢价的客户细分。

              医疗健康细分中，买方是医院采购部门或供应链总监。用户是护理人员（目前负责运送药品、布草和餐食的路线执行者），以及间接的患者。付款方是医院或医疗系统。Keenon
              瞄准医院物流（向病房送餐、布草运输、药房物资配送），而非手术或康复机器人等临床应用。医疗健康采用触发因素包括护理短缺（OECD 预计仅日本到 2030 年就短缺 690,000
              名养老护理人员）、感染控制要求（无接触配送降低接触风险）和医院效率基准（Mordor Intelligence 称机器人每班可减少护士步行距离最多 25%）。政府补贴计划会加速付款方决策：Japan's SME
              Labor-Saving Investment Subsidy 每处物业最高报销 JPY 15 million（约 USD 100,000），可抵消两到三台机器人；Singapore's National
              Robotics Program 拨出 USD 60 million，用于医疗健康和酒店业试点部署。

              跨细分来看，Keenon 的商用清洁机器人（KLEENBOT
              产品线）遵循与酒店和医院清洁运营相同的买方-用户-付款方模式：设施管理总监是买方，清洁员工是用户，物业运营方是付款方。采用触发因素是避免人工成本和覆盖稳定性——机器人 24/7 工作，没有换班空档。
