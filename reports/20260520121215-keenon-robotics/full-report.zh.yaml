      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 由 Li Tongzhi 创立，他公开使用英文名 “Tony Li” 和 “Li Tong”。Li 担任创始人兼 CEO，自创立以来一直在任。World Economic
              Forum Annual Meeting of the New Champions Dalian 2024 将其列为 “CEO and Founder of KEENON Robotics”
              演讲嘉宾，在第三方国际场景中确认了这一头衔。36Kr 对 D 轮融资的报道（2021 年 9 月）将 CEO 称为“李通”（Li Tong），指向同一位中文姓名下的个人。

              在本次研究审阅的英文材料和可公开访问的中文材料中，未出现联合创始人或其他核心高管姓名。公司未发布董事会构成、投资人席位披露、治理章程或接班计划。这意味着关键人物集中度偏高：一家拥有 1,001 至 5,000
              名员工、业务横跨多大洲的公司，由单一创始人兼 CEO 同时掌握战略和运营权力。

              董事会治理未披露，与尚未进入公开上市流程的中国民营成长阶段公司特征一致。截至 2026 年 5 月，公司未在已审阅材料中宣布任何重大领导层变动、高管任命或离职。公司概况层面的主要治理风险，是对 Li
              Tongzhi 的关键人物依赖；未发现公开信号显示公司已形成分布式领导梯队或接班规划。
