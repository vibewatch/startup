      - number: '5.4'
        title: 清洁机器人平台
        blocks:
          - type: paragraph
            body: >-
              KLEENBOT 线代表 Keenon 从配送扩展到商业地面清洁，进入此前 2024 年以前没有产品存在的赛道，并与 Gaussian
              Robotics（Gausium）等专业清洁机器人厂商竞争。三款型号（C20、C40、C55）都把自主导航与清扫、吸尘、洗地功能 集成在一起，回应酒店、购物中心、机场和医疗设施中设施管理的劳动力成本压力。

              C55 是旗舰款，采用 Keenon 所称的业内首创三滚刷设计，把扫地和刷洗整合进单次通过；按产品营销说法，相比传统双滚刷 洗地机，清洁效果更好。C55 超大水箱可容纳 60 升清水和 47 升污水——按
              Keenon 描述，约为可比行业型号的 两倍——降低每日补水频率。C55 可跨越最高 5 cm 减速带，能在地下停车场等复杂环境运行。其理论清洁效率达到 2,376 m²/h，
              足以在一个班次内清洁大型机场航站楼区域。C55 支持换电以延长作业时间。

              C40 面向中型商业空间，理论清洁效率 1,100 m²/h，配备 16 升清水箱，并有双运行模式：洗地（最长 5 小时）和仅清扫 （最长 12 小时）。快速换电支持连续作业。C20 是最轻选项，重量 22
              kg，面向较小酒店或办公环境，效率 400 m²/h，水箱 7 升。

              KLEENBOT 线的关键未解问题包括：运营条件下（多尘环境、不同地面纹理）的真实清洁效率与理论效率差距；连续洗地模式下的 实际电池续航与测试条件差距；以及三滚刷主张是否已由 ISSA 或 EN
              标准测试等第三方清洁行业标准机构独立验证。
            claimRefs:
              - CE022
