      - number: '1.5'
        title: 规模、市场地位与商业证据
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics 到 2020 年 10 月全球累计产品出货量已超过 20,000 台，这是 CEO Li Tongzhi 对 36Kr 披露的数字，当时业务覆盖中国 500 多个城市以及 60
              多个海外国家和地区。到 2021 年 9 月，这一部署基数继续增长。行业来源和公司自身营销材料提到，截至 2024-2025 年累计部署机器人达到 100,000
              台或更多；但已审阅来源中没有审计文件或监管文件可独立验证这一数字，仍应作为公司口径，待进一步佐证。

              IDC 在 2021 年认定 KEENON 为中国餐饮行业商用服务机器人市场领导者，市场份额和增长排名均居首。2025 年 7 月，KEENON 宣布获得 IDC 全球商用服务机器人市场三项第一，显示其在 IDC
              定义的多个产品类别中延续主导地位。

              公开点名的重要合作和部署包括：2024 年 9 月宣布与 Korea Telecom（KT Group）建立战略合作，在韩国加速具身服务机器人部署；2025 年 10 月宣布与 Shangri-La Group
              合作，打造 KEENON 所称的“全球首家由 Universal + Specialized Robots 驱动的智能酒店”；以及 2024-2026 年参加多个全球贸易活动，包括 WEF Annual
              Meeting of New Champions Dalian 2024、2024 World Robot Conference Beijing、ISSA PULIRE 2025（KLEENBOT
              欧洲首秀）、Food Hotel Tech Paris 2025 和 Interclean Amsterdam 2026。DINERBOT T10 于 2025 年 3 月获得 iF DESIGN AWARD
              2025。

              2025 年 11 月，KEENON 在官网发布了一份公开声明。已审阅材料无法完整访问声明内容，但该动作与公司当时回应客户或媒体提出的市场或运营问题相吻合。在审阅声明全文前，应将其作为一条反向核查数据点处理。
