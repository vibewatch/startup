    title: 投资 KPI 记分卡
    type: kpi
    layout: wide
    summary: 面向投委会的七项投资维度打分；1–10 分制，10 分代表同类最佳。
    data:
      items:
        - label: 市场机会
          value: 8.5
          description: 服务机器人到 2029 年达 $47B–$99B，CAGR 15.9%；中国国家政策提供顺风
        - label: 市场验证
          value: 8
          description: IDC 三项第一；70,000+ 台机器人；60+ 个国家；与 KT、Shangri-La 合作
        - label: 竞争护城河
          value: 7.5
          description: 部署规模、成型的服务网络和软件栈带来切换成本
        - label: 单位经济模型
          value: 4
          description: 无公开财务数据；硬件毛利率为估计值但未经验证；RaaS 转型仍在早期
        - label: 融资 / 估值
          value: 4.5
          description: $2B 估值锚点已陈旧；~$29M 增量融资未披露估值；SVF2 形成悬顶压力
        - label: 风险敞口
          value: 3.5
          description: 地缘政治折价、出口管制、硬件毛利风险、缺少审计财务数据
        - label: 证据质量
          value: 5
          description: 第三方市场数据扎实；公司披露的财务证据薄弱
