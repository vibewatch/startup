  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              室内商用服务机器人市场的竞争分为五类。直接同业包括中国供应商 Pudu Robotics 和 OrionStar Robotics，两者都在与 Keenon
              相同的餐厅、酒店和医院垂直场景中提供多品类机器人组合。Bear Robotics 是领先的西方直接同业，聚焦酒店业，同时在 LG Electronics
              作为战略支持者和分销渠道的加持下扩展到仓储物流。垂直领域既有玩家包括 Aethon（医院配送机器人，拥有 20 多年医疗部署经验）和 Gaussian Robotics（商用清洁机器人，已部署于六个以上国家，包括
              Changi Airport）。SoftBank Robotics 则是相邻竞争者和机器人集成商，2026 年在养老社区、自主烹饪和最后一公里配送上继续扩张野心。

              现状替代品是最普遍的竞争力量：人工劳动力——餐厅服务员、酒店行李员、医院护理员——仍是每个目标垂直的主要替代方案。手推车和餐车以最低资本开支服务酒店和医院。固定传送系统可在高吞吐的餐厅后厨场景替代配送机器人。内部自建（运营商用通用硬件开发
              AMR
              部署）在大型医院网络中少见但并非没有。未来需要监测的进入者包括主要电梯和楼宇自动化公司（KONE、Schindler、Otis）：它们在多楼层部署中掌握深度集成优势，可能将轻量配送机器人打包进楼宇系统合同。IFR
              关于中国“十五五”规划的 2026 年报告显示，国家引导的机器人投资会持续，支撑中国供应商竞争多年。

              Keenon 的 IDC Triple No.1 声明确立了其自称的领先位置，但缺少独立发布的 IDC
              报告，限制了可验证性。因此，本竞争地图不是来自单一权威排名，而是由各供应商官方信息、第三方融资披露和行业报道拼合而成。
