      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Keenon 的安全架构依赖分层硬件和软件控制。避障使用多传感器融合（LiDAR、立体视觉、RGB 摄像头）、机身防撞条和每台 机器人的急停按钮。S100 与 S300 均标明 3 个急停按钮。S300
              的安全栈——3D 视觉加双 LiDAR 加 VSLAM 加三重急停——是当前 产品线中最完整的组合。这些是硬件和软件控制；截至 2026 年 5 月，Keenon 未在任何英文公开文件中披露已发布的第三方
              安全认证，例如 IEC 61508 功能安全、UL 列名，或带具体机械指令合规的 CE 标志。

              Keenon 的英文隐私政策允许收集设备信息、使用数据，以及通过网站和产品互动提交的个人信息。政策明确允许向 Keenon 或其
              服务提供商运营所在的任何国家进行跨境数据传输，并提示「这些国家的数据保护规则可能不同于你所在国家」。数据可与全球关联
              公司和子公司、服务提供商、参与联合营销或联合品牌服务的商业伙伴，以及用于广告定制的第三方伙伴共享。政策承认「没有任何 安全措施万无一失」，数据传输无法保证不被拦截。

              Keenon 产品或云基础设施没有公开披露 ISO 27001（信息安全管理）、SOC 2（服务组织控制）或同等网络安全认证。对西方医疗、
              政府和关键基础设施采购流程中的企业买方而言，中国企业注册地、宽泛的跨境数据共享权利，以及缺少第三方安全认证，三者叠加
              构成实质采购障碍。分析师对更广泛服务机器人市场的报道，已记录中国来源硬件在欧盟和美国公共部门场景中的反向采购动态。 目前没有公开报道具体 Keenon 安全事件，但结构性信任缺口可从公开文件中验证。
