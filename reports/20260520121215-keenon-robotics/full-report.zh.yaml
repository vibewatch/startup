    title: 技术 / 运营架构
    description: >-
      Keenon's core technology layers, each layer's role, its key dependencies, and the associated risk if the
      dependency is disrupted or underperforms.
    columns:
      - 层级 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - LiDAR 感知
        - 主要空间感知，用于障碍物检测和环境建图
        - 第三方 LiDAR 模组供应商（中国市场：Livox、RoboSense、Slamtec）
        - 供应受限或组件涨价；多尘环境中传感器精度下降
      - - SLAM 导航引擎
        - 将 LiDAR 点云转化为机器人定位和自主路径选择
        - 自研 SLAM 算法（引用 50+ 项专利）；可能包含开源 ROS 组件
        - 动态高流量环境中导航漂移；地图边缘区域精度不足
      - - VSLAM（视觉 SLAM）
        - LiDAR 单独不足时，用摄像头特征估计位置；用于 T10、S300
        - 摄像头硬件 + VSLAM 算法；光照条件必须足够
        - 弱光或反光地面环境中性能下降；物理损伤后需要校准
      - - AI 路线规划与多机器人调度
        - KOM 2.0 车队编排：排定任务优先级、避开死锁、优化全队路线
        - 运行 KOM 2.0 的云端或本地服务器；网络连接（S300 离线模式除外）
        - 网络中断会打断所有不支持离线机型的多机器人协同
      - - IoT 电梯集成（W3）
        - 通过控制电梯呼叫和保持开门，让机器人自主跨楼层配送
        - 每次安装都取决于楼宇管理系统（BMS）和电梯控制器 API 兼容性
        - 单点集成投入高；老旧或封闭电梯系统可能不兼容
      - - 充电与电源管理
        - 各产品线支持自动回桩充电、手动适配器和快换电池
        - 电芯供应商；充电站硬件兼容性；部署场地电网
        - 电池随时间衰减；大规模车队运营中的换电物流
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE017
      - CE018
      - CE020
      - CE021
    notes: 技术栈仅反映官方产品页和公开文档披露的信息。自研算法内部、第三方组件供应商和软件架构细节均未经独立验证。
