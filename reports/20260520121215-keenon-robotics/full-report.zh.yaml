      - number: '5.3'
        title: 车队管理与集成
        blocks:
          - type: paragraph
            body: >-
              Keenon 配送产品线的多机器人协同由 KOM 2.0 AI 平台管理，平台负责路线分配、调度优先级和共同部署机器人车队的 交通管理。T3 和 T9 产品页描述了专利 AI
              算法，可优化同时运行设备之间的路线规划，提高任务执行效率，减少空闲时间， 并避免大型餐厅大厅或酒店走廊等高流量环境中的瓶颈。

              电梯集成是 BUTLERBOT W3 明确的架构组件。机器人通过 IoT 协议与楼宇电梯系统通信，自主呼叫、进入、乘坐并离开电梯，
              完成多楼层配送，去掉员工替机器人实际操作电梯的依赖。该能力落地需要与楼宇电梯控制器硬件和楼宇管理系统（BMS）兼容， 形成按场地而异的集成依赖，并受电梯制造商和楼龄影响。

              充电自动化在不同产品线中的处理方式不同。S100 支持充电桩（自动返回并停靠）、适配器和 15 秒手动换电，支撑 24/7 作业周期。S300 支持自动充电、手动充电和换电，在满载下最长运行 6 小时，并支持
              3.5 小时快充。测试条件下，T9 支持 自主充电且单次充电最长 18 小时。

              S300 的关键差异点是离线运行模式：设备端路径规划和任务执行不依赖中央控制服务器或外部网络（Wi-Fi 或 5G）。在地下室、
              冷库、多楼宇工业园区等网络覆盖波动的环境中，这一设计提升可靠性。它也降低了基于网络的干扰攻击面；不过，不依赖网络的 运行会限制实时全车队协调，而这种协调需要连接。
