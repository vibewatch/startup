      - number: '4.3'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >-
              KEENON 未披露毛利率、COGS 拆分或运营成本数据。单位经济性只能从制造背景、行业可比公司和成本驱动因素 分析中推断。服务配送机器人的物料成本主要由 LIDAR
              传感器、避障摄像头、驱动电机、板载计算、电池组和 钢制底盘构成。对中端自主移动机器人而言，这些部件合计约占硬件售价的 40% to 60%，意味着规模化制造商的 硬件毛利率大约为 25% to 40%。

              KEENON 在苏州和深圳设厂，受益于中国供应链成本优势以及靠近零部件供应商。但公司也暴露在零部件成本波动 中，尤其是 LIDAR 传感器价格；随着中国本土生产商放量，该价格已大幅下行。国际销售若以人民币以外货币
              计价，还带来外汇风险。对 KOM 2.0 Visual Language Action（VLA）AI 模型的研发投入增加了间接费用， 且没有即时收入抵消，压缩近期利润率。在 RaaS
              分部，硬件部署后，订阅服务的增量成本（维护上门、软件更新、 远程监控）低于初始机器人成本，说明经常性收入流的毛利率会显著高于初始硬件销售。IFR 数据确认，服务机器人 板块在 2023 年按价值计增长
              37%，显示需求强劲，可能支撑稳定或改善后的实际价格。营运资本需求很重：硬件 库存和成品形成数月现金周期，国际扩张还会放大物流和清关成本。
