  - id: SP-section-direct-peers
    title: Direct Peer Profiles — Pudu Robotics, Bear Robotics, and OrionStar
    body: >-
      Pudu Robotics (普渡科技), founded approximately in 2016 and headquartered in Shenzhen, is the
      most operationally similar competitor to Keenon. Its product portfolio spans restaurant delivery
      robots, hotel service robots, and commercial building robots — mirroring Keenon's DINERBOT,
      BUTLERBOT, and KLEENBOT lines. Pudu's website copyright reads 2026, confirming continued active
      operations. Pudu has raised multiple funding rounds; publicly cited figures place total raised
      capital at or above $150 million, though the company has not published audited financial
      statements in reviewed sources. Pudu competes directly in China's restaurant robot market and
      has deployed internationally across Southeast Asia, Japan, South Korea, and European markets.
      The absence of independently published shipment figures makes a direct unit-count comparison
      with Keenon impossible.

      Bear Robotics, founded in 2017 and headquartered in Silicon Valley (Redwood City, California),
      has raised approximately $175.8 million across four rounds: $2.8 million seed (2018), $32
      million Series A with SoftBank Robotics participation (2020), $81 million Series B led by IMM
      (2022), and $60 million Series C from LG Electronics (2024). A strategic alliance with LG
      Electronics, announced in 2025, combines Bear's engineering expertise with LG's global
      commercial distribution reach across restaurants, retail, factories, and warehouses. Bear's
      core product line is the Servi family (Servi, Servi Mini, Servi Plus), compact hospitality
      delivery robots with LiDAR navigation, spill-proof trays, 66-to-88-pound payload capacity, and
      12-hour operating shifts on four-hour battery charges. In 2026, Bear launched Servi Clean
      (commercial cleaning) and the Carti Low-Profile warehouse AMR line. Bear's US base and LG
      partnership constitute structural advantages in Western and South Korean procurement processes
      relative to Keenon and Pudu.

      OrionStar Robotics, backed by the Orion technology group, claims 60,000-plus robots deployed
      across 60-plus countries and offers the broadest portfolio of any direct peer: LuckiBot (food
      delivery), LuckiBot Pro and LuckiBot Pro Autodoor (secure delivery with auto-door integration),
      CarryBot (warehouse AMR), GreetingBot Mini and GreetingBot Nova (AI reception in 30-plus
      languages), and CleaniBot (commercial cleaning). OrionStar's 60,000-plus deployment claim, if
      accurate, approaches parity with Keenon's estimated global scale, creating a direct
      head-to-head on the "scale credibility" dimension that both companies use in sales conversations.
      Neither company has published an independently audited shipment registry.
