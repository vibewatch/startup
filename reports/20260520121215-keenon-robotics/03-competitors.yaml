  - id: SP-section-comparison
    title: Capability and Distribution Comparison
    body: >-
      Keenon's product breadth — spanning restaurant delivery (DINERBOT), hotel service (BUTLERBOT),
      commercial cleaning (KLEENBOT), and humanoid robots (XMAN) — is the widest of any direct peer
      reviewed. No other competitor offers all four product categories in a single commercial portfolio
      as of May 2026. Bear Robotics' Servi Clean launch in 2026 brings it into cleaning, but the
      company does not yet offer a hotel-specific robot or humanoid. Pudu covers delivery and cleaning
      but has not publicly announced a humanoid program. OrionStar offers delivery, cleaning, greeting,
      and warehouse — broadly comparable to Keenon except for humanoid. Aethon is vertically
      concentrated in hospital delivery and hospitality amenity delivery but does not compete in
      restaurants or cleaning. Gaussian is single-category (cleaning only).

      On navigation technology, all reviewed vendors use LiDAR-based SLAM (Simultaneous Localization
      and Mapping) as the core navigation approach. No peer has published independently benchmarked
      navigation performance data that would allow a direct technical comparison. Elevator
      integration capability is claimed by Keenon, Aethon, and OrionStar from reviewed official
      sources; Bear Robotics lists "all-floor navigation" as a product feature; Gaussian references
      elevator operation at Changi Airport. Multi-floor operation is therefore not a differentiating
      capability across the primary field of direct peers.

      Distribution and channel strategy show meaningful divergence. Bear Robotics' 2025 partnership
      with LG Electronics provides access to LG's global sales force and commercial customer network
      — a channel advantage Keenon lacks in Western markets. Keenon's channel partners (KT Group in
      South Korea, DigiCorp in Vietnam) are regionally specific and do not constitute a global
      distribution tier comparable to LG's reach. Pudu and OrionStar appear to rely on local
      distributors without a single marquee global channel partner disclosed in reviewed materials.
      Aethon's ST Engineering parentage provides procurement credibility in defence-adjacent
      healthcare environments.

      Trust and regulatory posture is an asymmetric dimension. Bear Robotics and Aethon are
      US-based entities with US manufacturing emphasis. Chinese vendors (Keenon, Pudu, OrionStar)
      face heightened scrutiny in US federal and state procurement, hospital systems with US
      government funding, and EU public-sector environments where data-security concerns about
      hardware manufactured in China are increasingly codified. China's 15th Five-Year Plan, as
      analysed by IFR in May 2026, further elevates Chinese robotics companies as state-backed
      actors, which may complicate Western enterprise procurement optics for Keenon and its peers.
