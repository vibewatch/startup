figures:
  - id: FP001
    title: Competitive Positioning Map — Geographic Reach vs. Product Breadth
    type: quadrant
    layout: wide
    summary: >-
      Evidence-backed ordinal positioning of seven competitive entities on two dimensions: geographic
      reach (1=primarily domestic China or single-country, 5=commercially active across multiple
      continents) and product breadth (1=single category, 5=five or more distinct robot use-cases).
      Scores are ordinal estimates derived from official product pages, funding disclosures, and
      publicly available deployment evidence; they are not source-backed numeric metrics.
    approximationNotes: >-
      All x/y coordinates are ordinal estimates on a 1–5 scale. Keenon: geographic reach 4
      (60+ countries with 6 direct subsidiaries) and product breadth 5 (delivery, hotel, cleaning,
      humanoid, plus KOM AI). Bear Robotics: reach 3 (US-primary with LG international partnership
