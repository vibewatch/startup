  evidenceGaps:
    - id: EGP001
      description: >-
        No competitor win-loss data — cases where a customer chose Keenon over Bear Robotics,
        Pudu, or OrionStar, or vice versa — was found in reviewed public sources. This gap makes
        it impossible to assess Keenon's true competitive win rate, deal size advantages, or
        segment-specific positioning effectiveness. Aethon's competitive strategy post-ST
        Engineering acquisition and whether it intends to expand into restaurant or hotel delivery
        is also unclear from reviewed public sources.
      impact: high
      relatedQuestionRefs:
        - QP015
        - QP019
      diligencePath: >-
        Request win-loss analysis from Keenon management; conduct operator reference calls in
        3+ geographies; ask distributors about competitive encounters. Review ST Engineering
        annual reports for Aethon strategy disclosures.

    - id: EGP002
      description: >-
        No competitor — Keenon, Bear Robotics, Pudu, OrionStar, or Gaussian — has disclosed
        list pricing for restaurant delivery or hotel service robots in reviewed public sources.
        Aethon's hospital pricing is the only available benchmark and is not directly comparable.
      impact: high
      relatedQuestionRefs:
