  - id: SP-section-pricing
    title: Pricing, Packaging, and Channel Strategy
    body: >-
      None of the primary direct restaurant-robot competitors — Keenon, Bear Robotics, Pudu, or
      OrionStar — publish list pricing on their official websites as of May 2026. Bear Robotics
      operates on what its materials describe as a subscription or Robotics-as-a-Service model;
      neither monthly rate nor upfront hardware cost is disclosed. Keenon's commercial model
      appears to center on hardware sale plus software-and-service subscription, based on its product
      pages and solution pages, but no pricing is stated. Pudu and OrionStar do not publish pricing
      in the reviewed English-language portions of their websites.

      The only independently sourced pricing benchmark in the sector comes from Aethon's TUG
      hospital robot: a lease of $1,500 to $2,000 per robot per month or a purchase price of
      $75,000 to $140,000 per unit, as cited in Becker's Hospital Review coverage of UCSF Medical
      Center's 25-robot fleet. This pricing is specific to a high-specification hospital delivery
      robot with pharmacy security features and is not directly comparable to restaurant-delivery
      robots, but it anchors the order of magnitude for premium indoor autonomous delivery hardware
      in regulated environments.

      The absence of public pricing across the competitive set means that pricing power, discount
      practices, and net contract value are entirely opaque from public sources. Industry practitioner
      estimates cited in operator reviews typically place restaurant delivery robot costs in the
      range of $10,000 to $20,000 per unit for outright purchase or $500 to $1,000 per month per
      unit on subscription, though Keenon's specific terms have not been confirmed. Bear Robotics'
      Servi product carries an upfront hardware cost plus a subscription; the split is undisclosed.

      Channel pricing differentials add a further layer of opacity. Keenon sells through direct
      subsidiaries in six international markets and through regional distributors elsewhere; pricing
      likely varies materially by market. Bear Robotics' LG Electronics distribution may enable
      different bundling (e.g., combined with LG commercial displays or appliances) that creates a
      pricing comparison point outside the standalone robot SKU. Diligence should obtain actual
      contract terms from Keenon management and conduct channel checks with operators in at least
      two geographies to triangulate realized contract economics.
    claimRefs:
      - CP035
      - CP036
      - CP037
      - CP038
      - CP039
