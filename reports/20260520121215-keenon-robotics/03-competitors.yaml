company:
  name: Keenon Robotics

chapter:
  number: 3
  title: Competitors
  summary: >-
    Keenon Robotics competes in a fragmented global indoor service robot market against four direct
    categories of alternatives: Chinese peer vendors (Pudu Robotics, OrionStar Robotics), Western
    hospitality-robotics specialists (Bear Robotics), vertical-domain incumbents (Aethon in
    hospital delivery, Gaussian Robotics in commercial cleaning), adjacently expanding platforms
    (SoftBank Robotics), and non-robot substitutes including human labor, manual carts, and fixed
    conveyor automation. IDC named Keenon the global leader in commercial service robots in 2025,
    but this self-reported ranking is unverified by an independently published IDC report. Bear
    Robotics — backed by a $60 million Series C from LG Electronics and a 2025 strategic alliance
    with LG — presents the most credible Western distribution threat through LG's global commercial
    reach. OrionStar claims 60,000-plus robots across 60-plus countries and a product portfolio
    comparable to Keenon's in breadth. Pudu Robotics, also Shenzhen-based, competes in essentially
    every overlapping geography and segment. Chinese vendor hardware commoditization is an ongoing
    risk: multiple manufacturers offer LiDAR-navigating delivery robots on similar form factors at
    potentially lower list prices. Trust and security concerns in Western public-sector and
    healthcare procurement create a structural barrier for all China-origin hardware vendors,
    including Keenon. Switching costs are moderate — fleet-management software lock-in is real but
    not decisive, as mapping and integration work can be replicated within one to two deployment
    cycles. No direct competitor publishes verified revenue, profitability, or independently audited
    deployment figures, making exact scale comparisons impossible from public sources.

sections:
  - id: SP-section-landscape
    title: Competitive Landscape Overview
    body: >-
      The indoor commercial service robot market features competition across five distinct categories.
      Direct peers are Chinese vendors Pudu Robotics and OrionStar Robotics, both offering
      multi-category robot portfolios in the same restaurant, hotel, and hospital verticals as Keenon.
      Bear Robotics is the leading Western-originated direct peer, focused on hospitality but
      expanding into warehouse logistics with LG Electronics as a strategic backer and distribution
      channel. Vertical-domain incumbents include Aethon (hospital delivery robots with 20-plus years
      of healthcare deployments) and Gaussian Robotics (commercial cleaning robots deployed across
      six-plus countries, including Changi Airport). SoftBank Robotics functions as an adjacent
      competitor and robot integrator with expanding ambitions in senior living, autonomous cooking,
      and last-mile delivery in 2026.

      Status-quo substitutes are the most prevalent competitive force: human labor — restaurant
      servers, hotel bellhops, hospital orderlies — remains the primary alternative in every target
      vertical. Manual carts and trolleys serve hotels and hospitals at minimal capex. Fixed conveyor
      systems substitute in high-throughput back-of-house restaurant settings. Internal builds
      (operator-developed AMR deployments using generic hardware) are rare but not absent in large
      hospital networks. Future entrants to monitor include major elevator and building-automation
      companies (KONE, Schindler, Otis) that hold deep integration advantages for multi-floor
      deployments and could package lightweight delivery robots as part of building-systems contracts.
      The IFR's 2026 report on China's 15th Five-Year Plan signals continued state-directed
      investment in robotics, which will sustain Chinese vendor competition for years.

      Keenon's IDC Triple No.1 claim establishes its self-reported pole position, but the absence of
      an independently published IDC report limits verifiability. The competitive map is therefore
      assembled from each vendor's official surfaces, third-party funding disclosures, and industry
      coverage rather than any single authoritative ranking.
