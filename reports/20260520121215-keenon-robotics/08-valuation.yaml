  - id: scenario-analysis
    title: Scenario Analysis and Risk-Adjusted Valuation
    body: >
      Bull, base, and bear cases are structured around three variable clusters: market growth
      trajectory, margin improvement pace and disclosure, and exit or liquidity event timing.

      Bull case ($2.5–4.0 billion, probability signal approximately 20%): The service robotics
      market grows at the high end of projections. Keenon maintains its IDC Triple No. 1 rankings
      through 2027, successfully commercializes the XMAN-R1 humanoid, and achieves meaningful
      RaaS contract penetration that improves the margin profile. The company either raises a
      growth round at $2.5 billion or above or executes an IPO on the Hong Kong Stock Exchange or
      in Singapore in 2027–2028. SoftBank remains a constructive strategic shareholder. No
      material geopolitical escalation restricts access to key Western enterprise markets.
      China's 15th Five-Year Plan generates additional domestic revenue acceleration beyond the
      base trajectory.

      Base case ($1.5–2.5 billion, probability signal approximately 55%): Keenon grows its
      fleet 20–30% annually, but margin and profitability remain undisclosed and contested.
      No IPO occurs in the near term; the most likely exit is a strategic M&A transaction with
      a global facility-management group, hospitality chain, or Chinese technology conglomerate
      at 5–7x estimated revenue. The Series D (per CB Insights classification) closes at a
      valuation in the $1.5–2.0 billion range. Geopolitical friction remains elevated but
      manageable; Keenon concentrates growth in Southeast Asia, South Korea, Middle East, and
      Japan rather than direct US or EU enterprise accounts. The humanoid program (XMAN-R1)
      remains at a limited-deployment pilot stage.

      Bear case ($600 million–$1.2 billion, probability signal approximately 25%): SoftBank
      Vision Fund 2's portfolio discipline drives a mark-down of the Keenon position; the next
      funding event comes in as a down round. US and European export controls tighten to restrict
      Chinese robotics hardware in critical infrastructure contexts, materially limiting Western
      market expansion. Hardware gross margins fail to improve as competition from Bear Robotics,
      Pudu Robotics, and well-funded Chinese domestic peers intensifies on price. The humanoid
      robot launch does not achieve commercial traction by 2027. If growth capital is required,
      it arrives at a significant discount to the 2022 Series C anchor.

      Probability-weighted midpoint: Applying approximate probability weights yields an expected
      value of roughly $1.7–2.0 billion—approximately at or slightly below the 2022 Series C
      mark, depending on assumed dilution from the ~$29 million subsequent raise. Investors who
      entered at Series C are likely at or near break-even on price and may face additional
      dilution from a growth round. Entry at any material premium to $2 billion requires
      high conviction in the bull case materializing.
