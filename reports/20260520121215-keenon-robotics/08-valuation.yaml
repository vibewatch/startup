  - id: comparable-set
    title: Comparable Set and Valuation Methodology
    body: >
      Keenon occupies an unusual position in the comparable landscape: no private company of
      comparable commercial scale exists in service robotics, and listed peers are either
      early-stage speculative vehicles or much smaller franchises. Four lenses are applied.

      Public company comps: Serve Robotics (SERV, Nasdaq), a US sidewalk delivery robot
      company spun out of Uber in 2021, reported a non-affiliate market capitalization of
      approximately $584.9 million as of June 30, 2025, with a fleet of over 2,000 robots and
      early-stage commercial revenue. Despite a January 2026 acquisition of Diligent Robotics
      (hospital automation) that expanded its addressable market, Serve Robotics remains a
      pre-profitability growth vehicle. Richtech Robotics (RCRT, Nasdaq), a Las Vegas-based
      restaurant and hospitality robot maker, is a smaller-cap public comp with revenues in
      the low single-digit millions and a correspondingly lower enterprise value. Both public
      comps trade at revenue multiples unsuitable for direct application to Keenon's scale;
      they reflect early-stage growth premia and speculative optionality, not steady-state
      earnings power.

      Private company rounds: Bear Robotics (Sunnyvale-based restaurant robot maker,
      SoftBank Robotics-backed since 2020) has raised $60 million from LG Electronics in
      its 2024 Series C and approximately $173 million in total, with an estimated valuation
      in the $300–500 million range. Pudu Robotics, Keenon's closest China-based peer, has
      raised over $200 million across multiple rounds at an implied valuation estimated in
      the $600 million–$1.2 billion range by sector analysts.

      Revenue multiple approach: Without audited financials, analysts proxy Keenon's revenue
      by multiplying the deployed fleet by an average revenue-per-robot estimate. At 70,000-plus
      units with an estimated $2,000–$4,000 in average annual revenue per unit (reflecting a
      mix of hardware sale, recurring software/maintenance, and emerging RaaS contracts), the
      implied revenue run-rate is $140–280 million. At a 5–10x revenue multiple—appropriate
      for a hardware-plus-recurring-revenue business at this scale and growth rate—enterprise
      value falls in the $700 million–$2.8 billion range, with a midpoint near $1.5 billion.
      Reaching the upper end requires sustained fleet growth, improving margin disclosure, and
      a clear path to positive cash flow.

      M&A exit multiples: Precedent transactions in commercial robotics and automation—
      including ABB's acquisition of ASTI Mobile Robotics and Zebra Technologies' purchase of
      Fetch Robotics—closed at 3–6x trailing revenue for proven platforms. A strategic acquirer
      (a major hospitality conglomerate, logistics company, or diversified Chinese internet
      platform) could justify 6–8x revenue for Keenon given its global market position and
      enterprise client base. This range yields an exit enterprise value of $840 million–
      $2.24 billion at the current estimated revenue run-rate.
