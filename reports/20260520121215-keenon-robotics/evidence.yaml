evidenceGaps:
  - topic: Revenue and financial performance
    description: >-
      KEENON has never publicly disclosed revenue, gross margin, EBITDA, or any profit/loss metric. Diligence must
      obtain audited or management-reviewed financial accounts directly from the company.
    diligenceAsk: Request audited accounts or management accounts for FY2022-2025.
    relatedQuestionRefs:
      - QO005
  - topic: Post-2021 funding and current valuation
    description: >-
      No financing events have been publicly announced since the September 2021 D-round. It is unknown whether KEENON
      has raised additional capital, completed secondaries, or obtained credit facilities. The last known valuation
      anchor ($2B implied) is approximately four years old.
    diligenceAsk: Confirm current cap table, any undisclosed rounds, and current 409A or third-party valuation.
  - topic: Cumulative robot deployment count (100,000+ claim)
    description: >-
      Industry coverage and KEENON's own marketing materials reference 100,000+ robots deployed as of 2024-2025, but no
      audited shipment record or regulatory filing was found to corroborate this figure. The confirmed number from an
      accessible primary source is 20,000+ as of October 2020.
    diligenceAsk: Obtain verified shipment records or quarterly delivery reports from management.
  - topic: Board composition and governance
    description: >-
      No board membership, investor seat allocation, or governance charter has been publicly disclosed. The company's
      governance structure relative to its investors (SoftBank Vision Fund 2, Alibaba, CICC) is completely opaque in
      reviewed public sources.
    diligenceAsk: Request shareholders' agreement, board composition, and investor rights documentation.
  - topic: November 2025 public statement
    description: >-
      KEENON published a "Statement of KEENON Robotics Co., Ltd." on November 20, 2025, listed on the company news page
      but its full content was not accessible in reviewed sources. This may address a controversy, market claim, or
      legal matter requiring adverse diligence.
    diligenceAsk: Obtain and review full text of the November 2025 statement and any underlying issue.
  - topic: Named senior leadership beyond founder-CEO
    description: >-
      No C-suite, VP, or divisional leadership team has been named in English or accessible Chinese-language materials.
      The company's leadership depth is entirely opaque below the founder-CEO.
    diligenceAsk: Request full org chart with names, tenures, and responsibilities for all VP+ roles.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - topic: Revenue model and hardware-software mix
    description: >-
      Public materials describe KEENON's robot categories and deployments but do not disclose how revenue splits across
      hardware sales, software, maintenance, leasing, or recurring service contracts.
    diligenceAsk: >-
      Request segment revenue mix, contract structures, attach rates for software/service, and gross margin by product
      line.
    relatedQuestionRefs:
      - QO015
  - topic: Competitive benchmarking data
    description: >-
      Reviewed sources do not provide a like-for-like comparison of KEENON versus Bear Robotics, Pudu Robotics, Aethon,
      or other peers on deployments, capital raised, pricing, or market share as of 2026.
    diligenceAsk: >-
