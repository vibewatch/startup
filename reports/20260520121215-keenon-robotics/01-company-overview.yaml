  - id: SO-section-scale
    title: Scale, Market Position, and Commercial Evidence
    body: >-
      KEENON Robotics reached cumulative product shipments exceeding 20,000 units globally by October
      2020, as stated by CEO Li Tongzhi to 36Kr, with operations spanning 500-plus cities in China and
      more than 60 overseas countries and regions. By September 2021, this deployment base had continued
      to grow. Industry sources and the company's own marketing materials reference figures of 100,000
      or more cumulative robots deployed as of 2024-2025, though independent verification of this
      figure from audited or regulatory filings was not available in reviewed sources and should be
      treated as a company-claimed figure pending corroboration.

      IDC recognised KEENON as the market leader in China's commercial service robots for the catering
      industry in 2021, topping both market share and growth rankings. In July 2025, KEENON announced
      it had secured triple No.1 rankings from IDC in the global commercial service robot market,
      representing continued dominance across multiple IDC-defined product categories.

      Notable named partnerships and deployments include: a strategic partnership with Korea Telecom
      (KT Group) announced September 2024 to accelerate deployment of embodied service robots in South
      Korea; a partnership with Shangri-La Group announced October 2025 to create what KEENON calls
      "the world's first smart hotel powered by Universal + Specialized Robots"; and participation in
      multiple global trade events in 2024-2026 including the WEF Annual Meeting of New Champions
      Dalian 2024, the 2024 World Robot Conference Beijing, ISSA PULIRE 2025 (European debut of
      KLEENBOT), Food Hotel Tech Paris 2025, and Interclean Amsterdam 2026. The iF DESIGN AWARD 2025
      was won by the DINERBOT T10 in March 2025.

      In November 2025, KEENON published a public statement on its website, the contents of which
      were not fully accessible in reviewed materials but which is consistent with the company
      addressing market or operational questions from customers or media at that time. This should
      be treated as an adverse-check data point pending review of the statement's full content.
