  - id: SO-section-milestones
    title: Milestone Chronology and Strategic Trajectory
    body: >-
      KEENON's 16-year history divides into three distinct phases. The first phase (2010-2017) was one
      of technology pioneering: the company was founded in 2010, launched its first tracked restaurant
      service robot "Xiaolang" in 2013, and in 2016 launched the DINERBOT T1 — which it describes as
      the world's first autonomous delivery robot — establishing the commercial catering robot category.

      The second phase (2018-2022) was characterised by mass production, vertical expansion, and global
      capital raising. DINERBOT T1 entered mass production in 2018 with the world's first dedicated
      mass production line for catering delivery robots. KEENON assisted Haidilao in establishing the
      world's first intelligent restaurant in 2018. The company expanded to 600-plus cities globally
      by 2019, launched medical delivery robot M1 and disinfection robot M2 in 2020 for COVID-19
      hospitals, raised its Series C (December 2020) and D-round (September 2021) totalling over
      $300M+ equivalent, and established wholly-owned international subsidiaries across six markets
      by 2022.

      The third phase (2023-present) is one of product diversification and AI integration. KLEENBOT
      C30 launched in 2023 marked entry into professional cleaning. KT Group partnership (September
      2024), Shangri-La hotel partnership (October 2025), and the KOM 2.0 VLA model (September 2025)
      represent the commercial and technology milestones. The XMAN bipedal humanoid robot premiered
      at WAIC Shanghai in July 2025 and the formal product launch (XMAN-R1, XMAN-F1) followed in
      April 2026. KEENON was included in the MIT Technology Review TR50 most innovative companies
      list in September 2025. These milestones collectively position KEENON as transitioning from a
      pure-play delivery robot company to a multi-form AI-powered service robotics platform.
