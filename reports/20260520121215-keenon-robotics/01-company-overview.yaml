chapter:
  number: 1
  title: Company Overview
  summary: >-
    KEENON Robotics (上海擎朗智能科技有限公司, KEENON Robotics Co., Ltd.) is a Shanghai-founded autonomous
    service robotics company established in 2010 by Li Tongzhi (Tony Li), who serves as founder and CEO.
    The company holds market-leadership positions in commercial service robots for catering, hospitality,
    and healthcare, with products deployed across 60-plus countries and product shipments exceeding 20,000
    units by late 2021 — with estimates of 100,000-plus cumulative units circulating in industry coverage
    by 2024-2025, though this figure has not been independently verified in accessible filings. Its
    largest disclosed funding event is a $200 million D-round led by SoftBank Vision Fund in September
    2021, which 36Kr described as the largest single commercial financing in China's commercial service
    robot sector at the time; an earlier Series C of several hundred million yuan was closed in December
    2020 with SoftBank Ventures Asia and Alibaba Group. The company has never disclosed revenue or profit
    metrics. In 2025-2026 it launched its first bipedal humanoid robot (XMAN-R1) and a proprietary
    Vision-Language-Action foundation model (KOM 2.0), signalling a strategic expansion into embodied AI
    while maintaining its core service robot business. IDC named KEENON the global leader in the
    commercial service robot market with triple No.1 rankings in 2025.

sections:
  - id: SO-section-identity
    title: Identity, Mission, and Corporate Structure
    body: >-
      KEENON Robotics Co., Ltd. — operating under the Chinese name 上海擎朗智能科技有限公司 (Shanghai Keenon
      Intelligent Technology Co., Ltd.) — is a Shanghai-headquartered autonomous service robotics company
      incorporated in 2010. The company's ICP registration number 沪ICP备10216247号 appears in its website
      footer, confirming Shanghai jurisdiction. According to its LinkedIn profile, the company's registered
      address is Building 56, No.1000 Jinhai Road, Shanghai 200120, China. The company self-describes as a
      "global leader in commercial service robots and solutions" and positions its mission around replacing
      manual labour with intelligent unmanned delivery and service solutions in catering, hospitality,
      healthcare, and adjacent industries.

      KEENON's corporate structure includes wholly-owned subsidiaries established by 2022 in the United
      States, the Netherlands, the United Arab Emirates, Japan, South Korea, and Hong Kong SAR, enabling
      direct commercial and support operations in major global markets. LinkedIn lists the company size as
      1,001 to 5,000 employees. It operates as a private limited company ("partnership" per LinkedIn's
      classification) and has not disclosed IPO plans in reviewed materials. The company's commercial model
      centers on hardware sales of autonomous delivery, cleaning, and service robots, complemented by
      software integration and cloud-based fleet management — though the specific revenue split across
      hardware, software, and services has not been publicly disclosed.

      The product brand architecture spans DINERBOT (catering delivery), BUTLERBOT (hotel service),
      KLEENBOT (commercial cleaning), and XMAN (humanoid robots), each targeting distinct deployment
      verticals. In 2025-2026, KEENON expanded its brand identity by launching the XMAN series of
      bipedal humanoid robots and the KOM 2.0 Vision-Language-Action foundation model, marking a
      deliberate move into the "embodied intelligence" market narrative.
