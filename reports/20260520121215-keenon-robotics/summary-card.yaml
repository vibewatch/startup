summary:
  headline: >-
    KEENON is the uncontested global leader in commercial service robotics with 70,000+ deployed robots and IDC Triple
    No.1 rankings, but a four-year funding silence, complete financial opacity, and compounding geopolitical risk
    constrain conviction to a track/research-more stance at the implied $2B valuation.
