  topStrengths:
    - >-
      IDC Triple No.1 global commercial service robot rankings (shipments, global share, China share) as of 2025;
      15-year first-mover franchise dating to the 2016 world-first autonomous delivery robot launch.
    - >-
      70,000+ robots deployed across 60+ countries with anchor enterprise relationships: Haidilao (world's largest
      hotpot chain), KT Group (South Korea telecom), and Shangri-La Hotels.
    - >-
      Dual hardware-sale and RaaS subscription model confirmed by SEC filings (YY Group 6-K), providing recurring
      revenue optionality as the installed base scales.
    - >-
      KOM 2.0 VLA foundation model and XMAN humanoid launch position KEENON at the intersection of service robotics and
      embodied AI, expanding the addressable market and supporting a premium narrative.
    - >-
      Blue-chip institutional backing via SoftBank Vision Fund 2 and Prosperity7 Ventures; China's 15th Five-Year Plan
      (2026–2030) explicitly designates robotics as a strategic national priority, creating government tailwinds.
  topRisks:
    - >-
      Complete financial opacity: no revenue, gross margin, EBITDA, burn rate, or capital adequacy data is publicly
      disclosed; investment thesis cannot be stress-tested without access to audited financials.
    - >-
      Four-year funding silence (no public round since September 2021) creates deep uncertainty about current
      fair-market value; the $2B anchor predates significant growth-multiple compression.
    - >-
      Geopolitical and regulatory exposure: US Section 301 tariffs (25%+) on Chinese-origin hardware, NDAA expansion
      risk, PIPL/DSL data-sovereignty compliance gaps, and a commonly estimated 20–30% Western-investor discount on
      Chinese private tech.
    - >-
      Single-founder key-person concentration (Li Tongzhi holds sole disclosed executive authority at 1,000–5,000-person
      multi-continental company; no board governance or succession plan disclosed).
    - >-
      Customer concentration: Haidilao anchor dependency, YY Group MOU non-binding (no closed revenue confirmed), KT
      Group commercial terms undisclosed; churn risk undocumented without NRR data.
    - >-
      XMAN humanoid distraction risk: entering the crowded humanoid segment may dilute R&D focus and capital from the
      profitable core service-robot business.
  unresolvedGaps:
    - >-
      Audited financial statements (revenue, gross margin, EBITDA, cash position, burn rate) — not publicly available
      for any period.
    - >-
      Current fair-market valuation: no round since September 2021; SoftBank Vision Fund 2 NAV mark for KEENON position
      is unknown.
    - >-
      YY Group MOU conversion to binding contract and closed revenue — MOU signed August 2025, non-binding language
      throughout.
    - NRR, GRR, and churn data across all customer verticals — not disclosed.
    - PIPL/DSL compliance certifications and cross-border data transfer filings — not confirmed in public materials.
    - XMAN humanoid commercial revenue contribution and margin profile — not disclosed.
    - IPO timeline, target exchange, and listing valuation range — no public filing or confirmation as of May 2026.
