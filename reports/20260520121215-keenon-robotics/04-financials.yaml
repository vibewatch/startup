callouts:
  - calloutType: risk
    title: Near-Total Financial Opacity Is the Primary Diligence Blocker
    body: >-
      KEENON has disclosed zero income statement, balance sheet, or cash-flow data across
      any public surface as of May 2026. Revenue quality, margin path, burn rate, and runway
      cannot be assessed without private access to audited financials and management accounts.
      Any investment underwriting must treat the financial due-diligence gate as a prerequisite
      to model construction, not an enhancement of it.
    claimRefs:
      - CI033
      - CI016

  - calloutType: strength
    title: RaaS Model Confirmed Active by SEC-Filed Partner Disclosure
    body: >-
      The August 2025 SEC 6-K filing by YY Group Holding Limited (NASDAQ: YYGH) confirms
      that KEENON commercially offers both on-demand (RaaS) and capital ownership models.
      This is the highest-confidence financial fact available for chapter scope: primary-tier
      (SEC filing), dated, and independently corroborated. It validates the recurring-revenue
      thesis and confirms Southeast Asia deployments are live.
    claimRefs:
      - CI002
      - CI010

  - calloutType: assumption
    title: Post-D Operational Continuity Inferred from Partner Activity
    body: >-
      The absence of any post-2021 funding disclosure, combined with active commercial
      partnerships as of March 2026 (per YY Group SEC filings), implies KEENON is either
      revenue-sustainable or managing reserves from the D-round. Neither scenario can be
      confirmed without financial statements. The assumption of operational continuity is
      reasonable but must be validated in diligence.
    claimRefs:
      - CI026
      - CI027
      - CI034

