company:
  name: Keenon Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    KEENON Robotics presents a near-total financial information blackout typical of late-stage
    Chinese private companies: no revenue, gross margin, EBITDA, or balance-sheet data has
    been publicly disclosed as of May 2026. The single confirmed anchor is the September 2021
    Series D of USD 200 million led by SoftBank Vision Fund 2, bringing total disclosed funding
    to approximately USD 244 million. An August 2025 SEC 6-K filing by partner YY Group
    confirms KEENON offers both hardware-sale and Robotics-as-a-Service on-demand deployment
    models. Pricing and unit economics must be estimated by peer analogy. The primary due-
    diligence prerequisite is access to audited financials: revenue quality, margin path, and
    capital adequacy cannot be evaluated from public sources alone.

sections:
  - id: SI-section-revenue
    title: Revenue Streams and Business Model
    body: >-
      KEENON Robotics generates revenue through at least two confirmed commercial pathways:
      outright hardware sales under a capital purchase model and a Robotics-as-a-Service (RaaS)
      subscription model in which robots are deployed on a recurring fee basis. The dual-model
      structure is confirmed by a 2025 SEC filing from YY Group Holding Limited (NASDAQ: YYGH),
      which discloses that KEENON "will provide … multiple deployment options, including both
      on-demand and capital ownership models" in their Singapore and Malaysia partnership.
      Hardware sales are the more traditional revenue stream: buyers purchase robots outright
      for catering, hotel, healthcare, and commercial cleaning applications. The RaaS channel
      shifts capital expenditure from the customer to KEENON, generating recurring subscription
      income at the cost of higher upfront balance-sheet investment.

      KEENON's product lines span DINERBOT (catering delivery), BUTLERBOT (hotel in-room
      delivery), KLEENBOT (commercial cleaning), and the XMAN humanoid series. Each product
      addresses a distinct vertical with differing buyer profiles, contract lengths, and
      pricing dynamics. The KOM 2.0 AI platform that manages robot fleets introduces a
      potential software-as-a-service layer, though no software-specific pricing has been
      disclosed. KEENON operates across 60 or more countries and 600 or more cities as
      of 2025 per company disclosures, providing geographic breadth that distributes revenue
      across markets with different regulatory and competitive dynamics. Partner-channel revenue
      through distribution agreements with hospitality chains and facilities management
      companies such as YY Group represents a fifth revenue dimension that adds scale without
      equivalent sales headcount.
