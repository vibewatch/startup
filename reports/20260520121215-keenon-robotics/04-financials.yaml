  - id: SI-section-pricing
    title: Pricing and Monetization
    body: >-
      KEENON has not published any list pricing on its official website or in any public filing
      as of May 2026. Neither hardware unit prices nor RaaS monthly rates appear in official
      KEENON materials. This opacity is common for enterprise B2B robotics companies that
      negotiate deal-specific pricing with hospitality groups, healthcare systems, and
      restaurant chains. Pricing is therefore estimated by analogy with disclosed competitors.

      In the hardware-sale channel, comparable service delivery robots from disclosed peers
      are priced in the USD 15,000 to 30,000 range per unit; KEENON's flagship BUTLERBOT
      and DINERBOT lines are expected to fall within or modestly above this band given their
      feature richness and autonomous navigation capabilities. In the RaaS channel, market
      analogues suggest per-robot monthly fees of approximately USD 1,500 to 3,000, inclusive
      of maintenance and software. YY Group's SEC filing confirms that KEENON-deployed robots
      in Singapore and Malaysia are offered under both on-demand and ownership models, indicating
      that the RaaS tier is live and commercially active as of August 2025 — not a future
      roadmap item. Pricing for the XMAN humanoid line, targeting higher-value applications
      in warehousing and industrial settings, would command a premium over the standard
      delivery-robot tier, but no data exists to bound this estimate. Volume discounts,
      partner-channel margins, and realized versus list pricing gaps remain entirely undisclosed.
