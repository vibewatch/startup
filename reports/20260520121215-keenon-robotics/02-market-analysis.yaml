  - id: SM-section-buyers
    title: Buyer, User, and Payer Segmentation
    body: >-
      The indoor commercial service robot market has a three-party purchase structure: the buyer
      (procurement decision-maker), the user (staff and guests), and the payer (entity holding the
      budget). These roles are often different within the same deployment.

      In the restaurant segment, the buyer is typically the F&B operations director or general
      manager at a chain level, or the owner-operator at an independent restaurant. The user is
      floor-service staff (servers, runners) and, indirectly, dining guests. The payer is the
      restaurant ownership entity, group procurement function, or franchise operator. Budget
      ownership at large chains (Haidilao, Yum China, McDonald's) sits with capital expenditure
      committees; at independents, it sits with the owner. The adoption trigger is a combination
      of labor shortage severity (vacancy rate, wage inflation), operating economics (robot replaces
      1-2 runner shifts per day), and competitive pressure (neighboring restaurants deploy robots).
      A typical ROI case cited in industry coverage involves a delivery robot costing USD 8,000-20,000
      replacing 1.0-1.5 FTE runners, implying payback in 6-24 months depending on local wage levels.

      In the hotel segment, the buyer is the hotel general manager or director of operations, with
      procurement at branded hotel group level (IHG, Marriott, Shangri-La) imposing vendor standards.
      The user is room-service and housekeeping staff plus hotel guests receiving deliveries. The
      payer is the hotel management company or property owner. Adoption trigger is the documented
      US hospitality labor shortage: in 2024, turnover rates remained 76% higher than pre-2020
      levels in food-service and lodging businesses per the National Restaurant Association Labor
      Shortage Report cited by Mordor Intelligence. US BLS data for March 2026 shows 6.9 million
      total US job openings, with accommodation and food services hires increasing 124,000 in March
      alone, confirming ongoing market-wide labor pressure. Keenon's Shangri-La Group partnership
      (October 2025) confirms that luxury-tier branded hotels represent an accessible customer segment
      willing to pay a premium for integrated robot solutions.

      In the healthcare segment, the buyer is the hospital procurement office or supply chain director.
      The user is nursing staff (route-runners currently transporting medications, linens, and meals)
      and, indirectly, patients. The payer is the hospital or health system. Keenon targets hospital
      logistics (food delivery to patient rooms, linen transport, pharmacy supply delivery), not
      clinical applications such as surgical or rehabilitation robots. Adoption trigger in healthcare
      combines nursing shortage (OECD projects 690,000 elder-care worker shortage in Japan alone by
      2030), infection-control requirements (touchless delivery reduces contact risk), and hospital
      efficiency benchmarks (robots reduce nurse walking distance by up to 25% per shift per Mordor
      Intelligence). Government subsidy programs accelerate the payer decision: Japan's SME Labor-
      Saving Investment Subsidy reimburses up to JPY 15 million (approximately USD 100,000) per
      property, offsetting two to three robot units. Singapore's National Robotics Program allocates
      USD 60 million for pilot deployments in healthcare and hospitality.

      Cross-segment, Keenon's commercial cleaning robots (KLEENBOT line) follow the same buyer-user-
      payer pattern as hotel and hospital cleaning operations: facility management director as buyer,
      cleaning staff as users, and property operator as payer. Adoption trigger is labor cost
      avoidance and consistency of coverage — robots work 24/7 without shift-change gaps.
