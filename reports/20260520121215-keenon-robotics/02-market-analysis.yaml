company:
  name: Keenon Robotics

chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The primary market for Keenon Robotics is indoor commercial service robots — specifically autonomous
    delivery, cleaning, and hospitality robots deployed in restaurants, hotels, and hospitals. Analyst
    estimates for the global service robotics market in 2024-2025 range from roughly USD 47 billion
    (MarketsandMarkets, 2024 base) to USD 68 billion (Mordor Intelligence, 2025 base), with the full
    market expected to roughly double to USD 98-210 billion by 2029-2031 at CAGRs of 15-20%. The
    narrower hospitality robots sub-segment — the most direct proxy for Keenon's addressable market —
    was valued at approximately USD 0.61 billion in 2025 by Mordor Intelligence, with a 24% CAGR
    forecast to reach USD 2.23 billion by 2031. The even narrower delivery robots market (covering
    both indoor and outdoor use) was valued at USD 409 million in 2024 by Precedence Research, growing
    at a 32% CAGR. These estimates diverge significantly, reflecting different scope definitions,
    methodologies, and geographic coverage. Sizing uncertainty is material and preserved throughout.
    The core adoption triggers are labor shortages, ROI from staff redeployment, and touchless service
    preferences. Constraints include high capital expenditure, PMS/building-system integration
    complexity, and trust barriers, especially in Western markets. Buyers are mid-to-large restaurant
    chains, hotel management companies, and hospital procurement offices; the payer is typically the
    property operator or F&B group, while the user is floor staff and guests.

sections:
  - id: SM-section-boundary
    title: Market Boundary and Definition
    body: >-
      Keenon Robotics competes in the indoor commercial service robot market — autonomous, mobile
      machines deployed within commercial venues to perform repetitive service tasks without
      continuous human supervision. The included spend comprises autonomous delivery robots (food,
      amenities, medicines, linens), autonomous floor-cleaning robots, and robot-as-a-service (RaaS)
      subscription contracts for the same device categories. The market boundary is constrained to
      indoor professional use in three primary verticals: food service (restaurants, canteens,
      cafeterias), hospitality (hotels, resorts, assisted-living facilities), and healthcare
      (hospitals, clinics). This scope excludes outdoor last-mile delivery robots (Starship,
      Nuro), industrial warehouse automation (Kiva/Amazon Robotics, Locus Robotics), surgical
      robots (Intuitive Surgical), and personal/domestic consumer robots (iRobot).

      Adjacent markets are relevant for sizing context but must be clearly separated. The
      broader global service robotics market, valued at USD 47-68 billion in 2024-2025 across
      multiple analyst reports, includes logistics, agriculture, medical, and defense robots
      that Keenon does not address. Analysts classify the hospitality and food service robot
      segment as a sub-segment of "professional service robots," which itself is the largest
      revenue category within the broader market. The closest substitute for an indoor delivery
      robot is a human runner or porter — the status-quo workflow involves kitchen/pantry
      staff physically carrying trays or trolleys to tables or rooms. Secondary substitutes
      include dumbwaiter lifts (fixed infrastructure, high cost), conveyor belt systems
      (limited to fixed layouts), and pneumatic tube systems (hospitals only, limited payload).
      None of these substitutes offer the same combination of zero-capex-for-path-changes,
      multi-stop routing, and fleet scalability as autonomous mobile robots.

      China remains by far the largest single national market for indoor commercial service
      robots. Pandaily reported that China's catering service robot market grew 110% year-over-year
      in 2021, and the IFR's 2025 World Robotics report confirms China installs approximately 54%
      of annual industrial robots worldwide and hosts roughly 2 million robot units in operational
      stock in manufacturing alone. China's 15th Five-Year Plan (2026-2030), announced by the
      IFR in May 2026, places robotics at the center of the national innovation agenda, directing
      both commercial and government procurement toward domestic robot manufacturers. This creates
      structural home-market advantages for Keenon as a Chinese-origin vendor while international
      expansion into Japan, South Korea, Southeast Asia, and the Middle East creates the growth
      opportunity outside China.
