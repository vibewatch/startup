  - id: SM-section-drivers
    title: Growth Drivers
    body: >-
      Five structural drivers are propelling the indoor commercial service robot market in 2024-2026.

      Labor shortages are the most immediate driver. OECD member countries are projected to lose
      15 million workers between 2025 and 2030. The US reported 6.9 million job openings in March
      2026 (BLS JOLTS), with accommodation and food services showing continued high vacancy rates.
      Mordor Intelligence's hospitality robots report identifies post-pandemic labor shortages as the
      single largest driver with approximately 6.8% contribution to CAGR. US hospitality recorded
      approximately 1.9 million unfilled vacancies that prompted hotel operators to deploy delivery
      robots to free remaining staff for revenue-generating guest interactions.

      Component price deflation is the second driver. Lidar and vision chips migrated to 7-nanometer
      nodes between 2022 and 2025, cutting navigation stack bill-of-materials to under USD 1,000
      according to IFR's World Robotics 2025 report cited by Mordor Intelligence. The average 5-year
      total cost of ownership for a mobile service robot has dropped by approximately 50% since 2020.
      Open-source ROS 2 libraries shrink software development cycles to 18-24 months, reducing the
      barrier to new product iterations and making robots economically viable at smaller venues.

      Contactless service demand, sustained post-pandemic, is the third driver. Industry surveys cited
      by Mordor Intelligence's hospitality robots report show 68% of travelers prefer minimal-contact
      service touchpoints; this preference has persisted well beyond acute pandemic health concerns.
      Properties combining delivery robots with digital key access and self-check-in report higher
      Net Promoter Scores because guests perceive a coherent technology narrative across the stay.

      Robot-as-a-service (RaaS) subscription models are the fourth driver, unlocking budget-
      constrained mid-market operators. Monthly fees starting at USD 1,500 for cleaning robots and
      USD 3,000 for mobile delivery units convert lumpy capex into predictable opex. Seegrid reported
      that 70% of its 2025 new contracts were RaaS, confirming the model is crossing the chasm.
      RaaS bundles include software updates, maintenance, and fleet management dashboards, reducing
      downtime risk that previously deterred smaller businesses. Payback periods have been cited as
      below 18 months for RaaS deployments.

      Government policy support — particularly in Asia — is the fifth driver. China's 15th Five-Year
      Plan (2026-2030) positions robotics as a core pillar of the national economy, mandating
      subordinate sectoral plans to align with robotics deployment targets. Japan's SME Labor-Saving
      Investment Subsidy covers up to JPY 15 million per property. Singapore's National Robotics
      Program allocates USD 60 million to pilot deployments. Italy's Piano Transizione 5.0 earmarks
      EUR 6.3 billion for digitalization of service industries. These programs collectively reduce
      net cost to early adopters by 20-40% and create domestic reference cases that accelerate
      regional diffusion.

      Asia Pacific, led by China, Japan, and South Korea, is the fastest-growing region across all
      analyst reports reviewed. Mordor Intelligence forecasts a 20.57% CAGR for Asia Pacific in the
      overall service robotics market through 2031, and a 25.8% CAGR in hospitality robots. The
      Precedence Research delivery robots analysis similarly projects Asia Pacific as the fastest-
      growing region. This geographic concentration gives Keenon, as a China-headquartered vendor
      with subsidiaries in Japan and South Korea, a structural home-market growth advantage.
