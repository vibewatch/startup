  researchQuestions:
    - id: QM001
      question: >-
        What is the precise boundary between Keenon's addressable indoor service robot market and
        adjacent markets (outdoor delivery, warehouse AMRs, surgical robots)?
      type: verification
      targets:
        - contentRequirements/0
      priority: high
      status: answered
      answerSummary: >-
        Addressed in Section 1 and Table TM001: indoor commercial deployment in restaurants, hotels,
        and hospitals is the included scope; outdoor last-mile, warehouse, and surgical are excluded.

    - id: QM002
      question: >-
        What are the primary status-quo substitutes for indoor delivery robots, and at what cost
        threshold does a robot become economically superior to each substitute?
      type: verification
      targets:
        - contentRequirements/0
      priority: high
      status: answered
      answerSummary: >-
        Human runners, dumbwaiter lifts, conveyor systems, and pneumatic tubes are substitutes.
        Economic superiority depends on local wage levels; a USD 12,000 robot replacing a USD 15/hour
        runner implies payback under 12 months in high-wage markets.

    - id: QM003
      question: >-
        What was the absolute size and growth rate of China's catering service robot market in
        2021-2026, and what sources support the 110% growth claim?
      type: quantification
      targets:
        - contentRequirements/1
      priority: high
      status: partial
      answerSummary: >-
        Pandaily reported 110% YoY growth in 2021 citing Chinese research; absolute dollar value not
        confirmed in publicly accessible sources; 2022-2026 growth rates not available in reviewed
        materials.

    - id: QM004
      question: >-
        How does China's 15th Five-Year Plan (2026-2030) specifically benefit domestic commercial
        service robot vendors like Keenon versus foreign competitors?
      type: verification
      targets:
        - contentRequirements/3
      priority: high
      status: answered
      answerSummary: >-
        IFR confirms the plan positions robotics at the core of China's industrial strategy with
        subordinate plans mandating alignment; specific procurement preferences for domestic vendors
        not confirmed in reviewed sources.

    - id: QM005
      question: >-
        Why do analyst market size estimates for the global service robotics market in 2024-2025 vary
        by more than 40%, and which estimate is most relevant for Keenon's TAM?
      type: quantification
      targets:
        - contentRequirements/1
      priority: high
      status: answered
      answerSummary: >-
        Estimates vary due to different inclusion of medical, consumer, agricultural, and defense
        robots. The hospitality robots sub-segment (Mordor Intelligence, USD 0.61B 2025) is the most
        relevant TAM proxy for Keenon's core verticals.

    - id: QM006
      question: >-
        What CAGR and absolute market size is the global service robotics market projected to reach
        by 2029-2031, and which analyst sources support this?
      type: quantification
      targets:
        - contentRequirements/1
      priority: high
      status: answered
      answerSummary: >-
        MarketsandMarkets projects USD 98.65B by 2029 at 15.9% CAGR; Mordor Intelligence projects
        USD 209.72B by 2031 at 19.51% CAGR; Precedence Research projects USD 233.8B by 2035 at
        14.04% CAGR. Estimates not directly comparable due to scope differences.

    - id: QM007
      question: >-
        What is the most specific available market size estimate for the hospitality robots segment —
        covering hotels and restaurants — and how does it compare to the delivery robots segment?
      type: quantification
      targets:
        - contentRequirements/1
      priority: high
      status: answered
      answerSummary: >-
        Mordor Intelligence: hospitality robots USD 0.61B (2025) growing to USD 2.23B by 2031 at 24%
        CAGR. Precedence Research: delivery robots USD 0.41B (2024) growing to USD 6.58B by 2034 at
        32% CAGR. Estimates are not additive and use different scope definitions.

    - id: QM008
      question: >-
        Which end-use verticals within the hospitality robots market are growing fastest, and how
        does this align with Keenon's product line?
      type: quantification
      targets:
        - contentRequirements/1
      priority: medium
      status: answered
      answerSummary: >-
        Restaurants and bars growing fastest at 26.05% CAGR per Mordor Intelligence; delivery systems
        lead with 39% share. This aligns with Keenon's DINERBOT focus as its primary product line.

    - id: QM009
      question: >-
        Which geographic regions are growing fastest in the service robot and hospitality robot
        markets, and what does this imply for Keenon's international expansion priority?
      type: enumeration
      targets:
        - contentRequirements/1
      priority: high
      status: answered
      answerSummary: >-
        Asia Pacific fastest growing across all reviewed reports (20-26% CAGRs). North America leads
        share at 37-42% depending on sub-segment. Implies Keenon's strongest structural advantage
        aligns with its home region and its Japan/South Korea subsidiary investments.

    - id: QM010
      question: >-
        What share of the delivery robots market is indoor vs outdoor, and is the indoor segment
        growing faster?
      type: quantification
      targets:
        - contentRequirements/1
      priority: medium
      status: answered
      answerSummary: >-
        Precedence Research confirms the indoor segment is expected to grow fastest through 2034;
        the outdoor segment led by count in 2024. Absolute indoor-only revenue not isolated in
        available sources.

    - id: QM011
      question: >-
        How reliable and consistent are the analyst market size estimates, and what are the key
        methodological assumptions to probe in diligence?
      type: comparison
      targets:
        - contentRequirements/0
      priority: high
      status: answered
      answerSummary: >-
        Estimates diverge by 40%+; methodology is proprietary and not independently audited; key
        assumptions are inclusion/exclusion criteria and geographic scope. Contradictory estimates
        are preserved without reconciliation.

    - id: QM012
      question: >-
        Who are the buyers, users, and payers across restaurant, hotel, and hospital segments, and
        what is the budget approval process for a robot purchase?
      type: mechanism
      targets:
        - contentRequirements/2
      priority: high
      status: answered
      answerSummary: >-
        Addressed in Section 3 and Table TM003. Buyer is operations director/GM; payer is ownership
        entity or FM company; user is floor staff. Chain chains require capex committee approval;
        independents require owner decision.

    - id: QM013
      question: >-
        How severe and persistent is the labor shortage in hospitality and food service, and is it
        a cyclical or structural driver of robot adoption?
      type: mechanism
      targets:
        - contentRequirements/2
      priority: high
      status: answered
      answerSummary: >-
        Turnover 76% above pre-2020 levels per NRA; BLS reports 6.9M US job openings in March 2026;
        OECD projects 15M worker loss 2025-2030. Both cyclical (vacancy rates) and structural
        (demographic aging) components; structural component more durable.

    - id: QM014
      question: >-
        What ROI evidence exists for indoor delivery robot deployments in restaurants and hotels,
        and what payback periods do operators report?
      type: quantification
      targets:
        - contentRequirements/3
      priority: high
      status: answered
      answerSummary: >-
        Industry data cites 20-35% reduction in manual room-service runs; 15-30% uplift in
        operational metrics; payback under 18 months for RaaS; nurse walking distance reduced 25%.
        Specific vendor-verified case study data was not independently confirmed in reviewed sources.

    - id: QM015
      question: >-
        Which government subsidy programs are active in Keenon's target markets (Japan, Singapore,
        China, EU), and what is the effective per-unit cost reduction they provide?
      type: verification
      targets:
        - contentRequirements/3
      priority: high
      status: answered
      answerSummary: >-
        Japan METI: JPY 15M per property (approx. 2-3 robot units); Singapore NRP: USD 60M program;
        China 15th FYP: broad mandate; Italy Transizione 5.0: EUR 6.3B for services digitalization.
        Combined effect reduces net buyer cost by 20-40%.

    - id: QM016
      question: >-
        How strong and persistent is post-pandemic guest preference for contactless service, and does
        it translate into measurable purchase intent for delivery robots?
      type: mechanism
      targets:
        - contentRequirements/2
      priority: medium
      status: answered
      answerSummary: >-
        68% of travelers prefer contactless service per industry survey cited in Mordor; NPS uplifts
        documented at properties combining robots with digital-key systems. Causal link to purchase
        intent not independently quantified in reviewed sources.

    - id: QM017
      question: >-
        What are the quantified efficiency gains and ROI metrics documented for robots deployed
        in hospitals, hotels, and restaurants?
      type: quantification
      targets:
        - contentRequirements/3
      priority: high
      status: answered
      answerSummary: >-
        Hospitals: 25% reduction in nurse walking distance. Hotels: 20-35% reduction in manual
        room-service runs, 15-30% operational KPI improvement. RaaS payback under 18 months.
        All from industry reports citing secondary data; not independently audited.

    - id: QM018
      question: >-
        By how much have component costs (lidar, vision, battery) declined since 2020, and how does
        this affect robot ASP trends through 2026-2031?
      type: mechanism
      targets:
        - contentRequirements/3
      priority: medium
      status: answered
      answerSummary: >-
        Navigation BOM under USD 1,000 as of 2025 (IFR via Mordor); 5-year TCO halved since 2020.
        ASP trajectory for commercial delivery robots not confirmed from Keenon or any competitor's
        disclosed pricing.

    - id: QM019
      question: >-
        What share of commercial service robot contracts are now structured as RaaS vs outright
        purchase, and is Keenon capturing this model shift?
      type: mechanism
      targets:
        - contentRequirements/3
      priority: high
      status: partial
      answerSummary: >-
        Seegrid reported 70% RaaS in 2025; Locus Robotics payback under 18 months. Keenon's own
        RaaS penetration as % of bookings not publicly disclosed; diligence gap.

    - id: QM020
      question: >-
        What fraction of potential buyers in the restaurant and hotel market decline to purchase due
        to high upfront cost, and how does RaaS address this?
      type: mechanism
      targets:
        - contentRequirements/3
      priority: high
      status: answered
      answerSummary: >-
        40% of operators cite budget ceilings as top barrier per Mordor intelligence industry survey.
        RaaS converts capex to opex with fees from USD 1,500-3,000/month. Whether Keenon offers
        RaaS terms and at what rate is a diligence gap.

    - id: QM021
      question: >-
        What are the lifecycle costs (battery replacement, maintenance, upgrades) for commercial
        delivery robots, and how do they affect total cost of ownership?
      type: quantification
      targets:
        - contentRequirements/3
      priority: medium
      status: answered
      answerSummary: >-
        Battery replacement USD 5,000-8,000 every 3-4 years; navigation BOM under USD 1,000;
        5-year TCO halved since 2020. Keenon-specific TCO figures not publicly disclosed.

    - id: QM022
      question: >-
        How significant is PMS / elevator API integration complexity as a barrier to hotel robot
        adoption, and which PMS platforms does Keenon certify against?
      type: mechanism
      targets:
        - contentRequirements/3
      priority: high
      status: partial
      answerSummary: >-
        Mordor Intelligence estimates 2.1% CAGR headwind from legacy PMS issues. Keenon's certified
        PMS integration list was not confirmed in reviewed public sources; diligence gap.

    - id: QM023
      question: >-
        What safety and cybersecurity certifications (ISO 13482, CE, FCC, GDPR compliance) does
        Keenon hold, and what markets do these certifications enable?
      type: verification
      targets:
        - contentRequirements/3
      priority: high
      status: partial
      answerSummary: >-
        Keenon's specific safety and cybersecurity certifications were not confirmed in reviewed
        public sources. ISO 13482 and EU Machinery Regulation are identified as relevant; compliance
        adds up to 20% to development budget and can delay launches by one year.

    - id: QM024
      question: >-
        How do GDPR and equivalent data-privacy frameworks constrain the deployment of onboard
        camera-equipped robots in guest-facing hotel and restaurant settings across the EU and US?
      type: verification
      targets:
        - contentRequirements/3
      priority: medium
      status: answered
      answerSummary: >-
        Mordor Intelligence quantifies a 1.8% CAGR headwind from data-privacy concerns. GDPR
        applies in EU; California CCPA and state laws apply in US. Specific Keenon data-handling
        policy for camera footage was not reviewed.

    - id: QM025
      question: >-
        What evidence exists of failed or abandoned robot deployments in restaurants or hotels, and
        what were the documented reasons for failure?
      type: adverse
      targets:
        - contentRequirements/4
      priority: high
      status: partial
      answerSummary: >-
        No specific documented failed pilot cases were accessible in free public sources reviewed.
        VC funding correction for consumer robotics (Mordor) and high CAPEX (40% operator barrier)
        are circumstantial evidence of deployment friction. Dark matter of failed evaluations is a
        material gap. This represents an adverse evidence gap that diligence should probe.

