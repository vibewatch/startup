  - id: FM004
    title: Robot Adoption Funnel — From Awareness to Renewal
    type: funnel
    layout: standard
    summary: >-
      Illustrates the typical commercial service robot purchase and deployment funnel for a
      restaurant, hotel, or hospital buyer. Each stage narrows the opportunity; friction
      points at each stage map to the adoption constraints documented in the chapter.
    data:
      items:
        - label: "1. Awareness / Problem Recognition"
          value: 100
          detail: "Operator faces acute labor shortage, rising wages, or sees competitor robot deployment. Labor market conditions are universally visible in 2024-2026. Keenon: trade show presence, KT Group and Shangri-La reference cases drive awareness."
        - label: "2. Vendor Evaluation"
          value: 35
          detail: "Operator researches vendors; compares Keenon, Bear Robotics, Pudu, Richtech on features and price. Friction: unclear how to compare RaaS vs capex; reference site access needed. Keenon: IDC Triple No.1 ranking and iF Design Award provide credibility signals."
        - label: "3. Pilot Approval"
          value: 15
          detail: "Internal budget holder approves pilot; IT and facilities evaluate PMS and elevator integration. 40% of operators cite budget as top barrier. Integration assessment adds 4-12 week delay. Keenon: certified PMS integrations and RaaS option reduce barrier."
        - label: "4. Pilot Deployment"
          value: 12
          detail: "1-3 robots deployed in controlled venue; staff trained; performance tracked for 30-90 days. Staff trust and edge-case navigation are risks. Keenon: KOM 2.0 AI supports adaptive navigation; multi-language interface aids training."
        - label: "5. Purchase / Scale Decision"
          value: 8
          detail: "Operator evaluates pilot ROI; decision to roll out fleet or cancel. ROI must clear payback hurdle; multi-site procurement requires group approval. Keenon: fleet management dashboard enables multi-site ROI reporting."
        - label: "6. Renewal and Expansion"
          value: 6
          detail: "Operator renews RaaS or expands to additional venues or robot types. Switching cost is low (robots returned). Retention depends on uptime and support quality. Keenon: cross-sell opportunity via delivery plus cleaning robot combination."
    claimRefs:
      - CM036
