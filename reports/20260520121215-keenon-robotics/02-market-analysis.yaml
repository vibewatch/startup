  - id: SM-section-sizing
    title: Market Sizing — Multiple Lenses and Contradictory Estimates
    body: >-
      No analyst isolates a globally consistent, narrowly-defined "indoor commercial service robot"
      market that exactly matches Keenon's scope. The available sizing estimates use overlapping
      but non-identical definitions, forcing a multi-lens approach that preserves uncertainty.

      At the broadest level, the global service robotics market was valued at USD 47.1 billion in
      2024 by MarketsandMarkets (forecast: USD 98.65 billion by 2029, CAGR 15.9%), USD 62.85 billion
      in 2025 by Precedence Research (forecast: USD 233.8 billion by 2035, CAGR 14.04%), and USD
      68.31 billion in 2025 by Mordor Intelligence (forecast: USD 209.72 billion by 2031, CAGR
      19.51%). These three estimates diverge by more than 40% in their 2025 base values, reflecting
      different inclusion criteria for medical robots, consumer robots, and logistics automation.
      The MarketsandMarkets figure explicitly covers ground, aerial, and marine platforms across all
      professional end-uses. Precedence Research includes personal robots. Mordor Intelligence
      covers professional, consumer, and defense sub-segments. This definitional inconsistency
      makes direct comparison hazardous. No independent audit of methodology has been reviewed.

      At the mid level, Mordor Intelligence sizes the hospitality robots market at USD 0.61 billion
      in 2025, growing to USD 2.23 billion by 2031 at a CAGR of 24.1%. Within this, delivery
      systems led with a 39.05% share (approximately USD 238 million) in 2025, while hotels
      captured 43.35% of end-user demand. Restaurants and bars are projected to register the
      fastest CAGR through 2031 at 26.05%, signaling the food-service vertical is earlier in its
      adoption curve. North America held 37.70% market share in 2025 for hospitality robots;
      Asia Pacific is forecast to grow fastest at 25.8% CAGR. These figures represent Keenon's
      most relevant TAM proxy at the segment level.

      At the narrowest level, Precedence Research sizes the global delivery robots market (indoor
      plus outdoor) at USD 409.30 million in 2024, projected to reach USD 6,578.20 million by 2034
      at a 32.01% CAGR. The food and beverage segment held the largest share at 42% (approximately
      USD 172 million) in 2024, and the indoor delivery segment is projected to be the fastest
      growing category through 2034. North America led with 42% share, and Asia Pacific is expected
      to host the fastest-growing regional market.

      These estimates are not additive; they overlap partially. The hospitality robots estimate
      (Mordor, USD 0.61B) is probably narrower than the delivery robots estimate (Precedence, USD
      0.41B) when restricted to the indoor F&B segment, suggesting Mordor counts additional robot
      types (cleaning, security, concierge) that Precedence does not. A bottom-up estimate based
      on China's documented 110% growth in catering robots in 2021 alone, extrapolated to a
      base of ~20,000 robots at roughly $15,000 ASP, implies a China-only F&B robot market of
      roughly USD 300-500 million in 2021 — broadly consistent with Precedence's 2024 global
      figure, suggesting the global market outside China is still nascent and China dominates.
      Independent sizing of a China-specific SAM was not available in reviewed sources.

      Sizing diligence gaps are significant: (a) no single analyst separates indoor-only from
      outdoor delivery robots at the revenue level; (b) no analyst publishes a China-only food
      service robot market size in a recent (2024-2026) report accessible for free; (c) hospital
      robot and hotel robot market estimates are often bundled with surgical, rehabilitation, or
      telepresence robots that Keenon does not make; and (d) RaaS contract revenue is not
      consistently distinguished from hardware revenue, making growth rate comparisons unreliable.
