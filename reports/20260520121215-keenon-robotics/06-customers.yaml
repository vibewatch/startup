company:
  name: Keenon Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    KEENON Robotics serves four primary verticals — restaurant/catering, hotel/hospitality,
    healthcare/medical, and commercial cleaning — with a fifth channel-distribution segment
    emerging through partners such as YY Group (Southeast Asia) and KT Group (South Korea).
    The strongest named-customer proof is the 2018 Haidilao "world's first intelligent
    restaurant" production deployment, the 2020 COVID-era deployment in 100+ Chinese hospitals,
    and the September 2024 KT Group strategic partnership confirmed by AP News. IDC ranked
    KEENON #1 in China catering service robot market share and growth in 2021. Geographic
    reach is company-claimed at 60+ countries and 600+ cities, but no independent audit of
    the purported 100,000+ installed-robot figure exists. No Net Revenue Retention, Gross
    Revenue Retention, or churn data has been publicly disclosed. Adverse signals include
    an SCMP article documenting overseas market friction and an HBR study highlighting RaaS
    churn risk when labour conditions change. Customer concentration in three flagship
    partnerships (Haidilao, KT Group, YY Group) is a material due-diligence concern.

sections:
  - id: SU-section-segmentation
    title: Customer Segmentation by Vertical and Geography
    body: >-
      KEENON Robotics addresses at least four distinct customer verticals. The restaurant
      and catering segment is the company's founding market: KEENON DINERBOT delivery robots
      automate food transport from kitchen to table in high-turnover casual-dining and hotpot
      restaurants. Haidilao, the world's largest hotpot chain, became the anchor reference
      customer when it opened what KEENON called the "world's first intelligent restaurant"
      in 2018. The hotel and hospitality segment is served primarily by the BUTLERBOT
      product, which handles in-room amenity delivery and lobby navigation in hotels and
      resorts. The hospitality vertical benefits from persistent labour-shortage dynamics
      in both Asian and Western markets, creating structural pull demand. The healthcare and
      medical segment was catalysed by COVID-19 pandemic deployments: KEENON robots
      performed contactless medication and meal delivery in more than 100 hospitals and
      quarantine centres across China in 2020, establishing a healthcare reference base
      under emergency conditions. The commercial cleaning segment, served by KLEENBOT, is
      the newest and least documented vertical, addressing facilities management buyers in
      retail, transportation, and logistics venues. Geographically, KEENON's domestic China
      installed base remains the largest concentration, followed by East Asia (Korea via KT
      Group), Southeast Asia (Singapore and Malaysia via YY Group), and broader international
      markets served through distribution partnerships rather than direct sales teams.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
