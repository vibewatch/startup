  - id: SU-section-adoption
    title: Adoption Trajectory and Deployment Scale
    body: >-
      KEENON's disclosed deployment milestones trace a rapid early growth curve that becomes
      opaque in later years. CEO Li Tong stated in September 2021 that KEENON had shipped
      more than 20,000 robots globally, a figure corroborated by 36Kr reporting. Earlier
      coverage indicated a 10,000-robot milestone around 2020. The company now claims an
      installed base exceeding 100,000 robots deployed across 60+ countries and 600+ cities
      as of 2025, but this figure has not been independently audited or corroborated by any
      analyst or filing. IDC recognised KEENON's market position in China's commercial
      service robot catering segment by ranking it first in both market share and growth for
      three consecutive years, as reported by SCMP in 2024. Global service robot market
      data from the IFR confirm that 2.76 million service robots were sold worldwide in
      2024, with delivery robots among the fastest-growing categories — providing sector
      tailwind context for KEENON's claimed trajectory even though KEENON's share of this
      global pool is not independently quantified. The hospitality robots market, as tracked
      by Mordor Intelligence, is projected to grow at a 24.1 percent CAGR through 2030,
      suggesting structural demand underlying KEENON's largest addressable segment. The gap
      between the confirmed 2021 figure (20,000+ units) and the unconfirmed 2025 claim
      (100,000+) represents a five-fold increase without independent validation, a
      material due-diligence verification requirement.
    claimRefs:
      - CU013
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
