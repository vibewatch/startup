        Shangri-La is the highest-prestige named hospitality partner in KEENON's portfolio.
        If the relationship remains announcement-stage rather than production-scale, it
        overstates the current evidence of hospitality-vertical penetration at the luxury tier.
      diligencePath: >-
        Search Shangri-La Group's investor relations and press room for robot deployment
        announcements; conduct a Shangri-La property check (field visit or phone inquiry)
        at announced sites; request a KEENON-provided Shangri-La deployment summary with
        property count and robot serial numbers.
      relatedQuestionRefs:
        - QU026
