  - id: SU-section-named-proof
    title: Named Customer Proof and Partnership Evidence
    body: >-
      KEENON's publicly documentable customer base is anchored by five named relationships
      at varying stages of evidence quality. Haidilao (the world's largest hotpot chain, with
      over 1,300 locations globally) deployed KEENON robots in its first "intelligent
      restaurant" in 2018 and is the most frequently cited reference customer in KEENON
      marketing and third-party press coverage. The COVID-19 deployment of robots across
      more than 100 Chinese hospitals and quarantine centres in 2020 created the healthcare
      vertical reference base, though no individual hospital is publicly named and no
      post-pandemic renewal data is available. KT Group (Korea Telecom, one of three national
      carriers in South Korea) announced a strategic partnership with KEENON in September
      2024, as confirmed independently by AP News and Finance Yahoo; the specific deployment
      scope and commercial terms remain undisclosed. YY Group Holding Limited (NASDAQ: YYGH),
      a Singapore-headquartered facilities management and hospitality services company, signed
      a memorandum of understanding with KEENON in August 2025 for robot deployment across
      its Singapore and Malaysia operations — the MOU is confirmed by a SEC 6-K filing and
      reiterated in the company's March 2026 shareholder letter, though the non-binding
      language used throughout indicates no closed revenue as of the run date. Shangri-La
      Group was announced as a smart hotel deployment partner in 2025, appearing in KEENON
      press materials and GlobeNewswire wire releases; independent confirmation of
      production-scale deployment has not been identified as of May 2026.
    claimRefs:
