  - id: SU-section-channels
    title: Distribution Channels and Partner Strategy
    body: >-
      KEENON's international go-to-market relies predominantly on hospitality and facilities
      management distribution partners rather than direct sales forces. YY Group covers
      Singapore, Malaysia, Thailand, Vietnam, and the UAE under its facilities management
      and hotel services umbrella, making it KEENON's single named entry point into five
      Southeast Asian markets simultaneously. KT Group provides Korea Telecom's commercial
      hospitality and smart-building network as the distribution vehicle for KEENON robots
      in South Korea. The partner-channel model reduces KEENON's need to staff local sales
      offices and accelerates reference-customer acquisition in markets where a telecom or
      hospitality operator already holds incumbent enterprise relationships. The trade-off
      is that customer relationships, renewal decisions, and feedback loops are intermediated
      through the partner rather than held directly by KEENON, creating dependency on partner
      commercial health and alignment. KEENON demonstrated at Interclean Amsterdam 2026,
      signalling active expansion into European commercial cleaning channels alongside the
      hospitality focus. Globally, the company has accumulated distribution coverage across
      60+ countries and 600+ cities per its own disclosures, though the density and
      commercial activation level of this network varies widely by region.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
    tableRefs:
      - TU005
    figureRefs:
      - FU004

  - id: SU-section-retention
    title: Retention, Durability, and Satisfaction Signals
    body: >-
      No Net Revenue Retention, Gross Revenue Retention, annual churn rate, customer
      satisfaction score, or Net Promoter Score data has been publicly disclosed by KEENON
      or independently measured by any analyst as of May 2026. The absence of retention
      metrics is typical of early-stage enterprise hardware companies, but it creates a
      significant blind spot for durability assessment: KEENON's repeat purchase evidence
      is limited to branded partnership announcements — Shangri-La, KT Group, and YY Group —
      rather than cohort-level renewal or expansion data. The YY Group MOU uses non-binding
      language throughout and cannot be treated as confirmed revenue. Robot replacement cycles
      in the hospitality and catering verticals are estimated at three to five years based
      on industry norms, meaning that even the 2018 Haidilao reference relationship would
      have entered its second or third robot-generation cycle by 2026, yet no renewal or
      upsell announcement has appeared in any public source. A Hacker News discussion thread
      from 2023 surfaced developer and operator concerns about autonomous delivery robot
      reliability, maintenance cost, and edge-case performance failures, consistent with
      the HBR finding that RaaS contracts face elevated churn risk when labour market
      conditions shift or when robot uptime falls short of operator ROI thresholds. These
      signals collectively indicate that retention dynamics are opaque and may carry more
      risk than KEENON's partnership announcement cadence would suggest.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
    tableRefs:
      - TU004

  - id: SU-section-adverse
    title: Adverse Evidence, Overseas Risks, and Concentration Concerns
    body: >-
      Two substantive adverse signals warrant diligence attention. First, SCMP reporting
      from 2024 documents that Chinese service robot companies — explicitly including KEENON
      — face meaningful headwinds in overseas markets: cultural resistance to automation in
      Western hospitality contexts, complex import regulations, lack of local service
      infrastructure for maintenance and repair, and geopolitical friction (particularly
      US-China technology tensions) that introduces procurement risk in North American and
      European accounts. Second, the HBR analysis of Robotics-as-a-Service economics
      warns that recurring-fee robot contracts are more vulnerable to churn than one-time
      hardware sales: if labour shortages ease, if alternative automation providers emerge,
      or if robot uptime does not consistently deliver the promised ROI, customers face
      limited switching costs under monthly fee arrangements. KEENON's customer proof is
      concentrated in three flagship partnerships — Haidilao (China catering), KT Group
      (South Korea channel), and YY Group (Southeast Asia channel) — with limited
      independently verified mid-market or SME customer references. The total count of
      paying enterprise customers is not disclosed; KEENON characterises its reach through
      robot-count claims rather than customer-count metrics. This concentration pattern
      represents material customer-level risk: the loss or non-renewal of any one flagship
      partnership could have a disproportionate impact on both revenue and reference
      narrative, particularly in markets where KEENON depends on the flagship partner's
      brand to attract follow-on accounts.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037

