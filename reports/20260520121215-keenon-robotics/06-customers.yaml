  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named mid-market and SME customer references with independently confirmed production
        deployments across restaurant, hotel, and healthcare verticals outside the three flagship
        partners (Haidilao, KT Group, YY Group). The broader installed base of 20,000+ robots
        (2021) and claimed 100,000+ (2025) implies thousands of unnamed operators for whom no
        public reference data exists.
      whyItMatters: >-
        The current named-customer evidence is insufficient to assess whether KEENON's
        customer base is genuinely diversified or whether revenue is structurally concentrated
        in a small number of flagship relationships. Concentration in three partners amplifies
        partnership renewal risk.
      diligencePath: >-
        Request a customer reference list from KEENON including at least 10 independent
        operators of varying sizes; conduct reference calls covering deployment experience,
        renewal intent, and ROI realisation. Validate the 100,000+ fleet claim against
        a third-party or audited unit-shipment ledger.
      relatedQuestionRefs:
        - QU006
        - QU022
        - QU023
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: blocking
      topic: retention-data-gap
      missingEvidence: >-
        Customer Net Revenue Retention, Gross Revenue Retention, annual churn rate, contract
        length distribution, renewal rate by vertical, and any customer satisfaction or NPS
        data for KEENON's RaaS subscription and hardware-sale customer cohorts.
      whyItMatters: >-
        Without retention metrics, the durability of KEENON's revenue base cannot be assessed.
        The HBR RaaS risk signal and absence of any disclosed renewal data collectively make
        retention the most significant unverifiable dimension of this customer chapter.
      diligencePath: >-
        Request cohort-level NRR and GRR from KEENON CFO; obtain anonymised contract renewal
        data by vertical and year; conduct at least five customer reference calls with specific
        NPS and contract renewal questions. Cross-reference with YY Group and KT Group for
        their own robot deployment renewal intentions.
      relatedQuestionRefs:
        - QU011
        - QU027
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: shangri-la-deployment-status
      missingEvidence: >-
        Independent confirmation of production-scale KEENON robot deployment at Shangri-La Group
        hotel properties as of May 2026 — including the number of properties live, robot SKUs
        deployed, and any customer outcome metrics published by Shangri-La.
