callouts:
  - id: CU-CALL-01
    calloutType: insight
    title: Named Customer Proof Highly Concentrated in Three Flagship Relationships
    body: >-
      KEENON's publicly documentable customer base rests on Haidilao (2018), COVID-era
      hospitals (2020), KT Group (2024), and YY Group (2025). The two most recent named
      partnerships are either non-binding (YY Group MOU) or undisclosed in deployment scope
      (KT Group). The absence of mid-market or SME named references — despite a claimed
      100,000+ robot installed base — suggests that the long-tail customer base is entirely
      undisclosed. Loss of any one flagship relationship would structurally undermine
      KEENON's reference narrative in its respective vertical.
    severity: major
    claimRefs:
      - CU034
      - CU036
      - CU037

  - id: CU-CALL-02
    calloutType: risk
    title: YY Group MOU Non-Binding Language Creates Revenue Pipeline Uncertainty
    body: >-
      YY Group's August 2025 SEC 6-K filing uses the phrase "plans to" and "intends to"
      throughout its description of the KEENON robot deployment. The March 2026 shareholder
      letter reiterates the MOU as active but provides no deployment milestone update.
      Under the SEC's safe-harbour forward-looking statement disclaimer attached to both
      filings, these commitments carry no legal obligation. Until a binding purchase order
      or service agreement is signed, Southeast Asia revenue attributable to this channel
      cannot be treated as contracted backlog.
    severity: major
    claimRefs:
      - CU011
      - CU030

  - id: CU-CALL-03
    calloutType: risk
    title: Overseas Market Friction Constrains Western Hospitality Penetration
    body: >-
      SCMP's 2024 reporting on Chinese service robot overseas expansion documents specific
      barriers for companies like KEENON: cultural resistance to automation in Western
      hospitality settings, import duty and compliance complexity, and limited local
      field-service networks for maintenance. The Hacker News discussion thread from 2023
      and the HBR RaaS analysis both independently surface robot reliability and ROI
      realisation as recurring operator concerns. Taken together, these signals suggest that
      KEENON's expansion beyond Asia — particularly into North America and Europe — faces
      a higher-friction go-to-market than the domestic China catering trajectory implies.
    severity: moderate
    claimRefs:
      - CU031
      - CU032
      - CU033

