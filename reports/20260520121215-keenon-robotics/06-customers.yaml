      Restaurant/catering has the strongest pilot-to-production evidence (Haidilao reference,
      IDC #1 ranking) while healthcare proof is historically significant but not renewed
      post-COVID. Hotel/hospitality has the most active recent partnership activity but
      evidence quality is largely announcement-stage rather than confirmed production scale.
    data:
      columns:
        - Pilot Evidence
        - Production Evidence
        - Active Partner Support
        - Growth Potential (2025–2030)
      rows:
        - label: Restaurant / Catering
          values:
            - label: "High — Haidilao 2018 production reference; IDC #1 China market share"
            - label: "High — CEO confirmed 20,000+ robots shipped 2021; catering dominant vertical"
            - label: "Medium — no active named catering distribution partner outside China"
            - label: "Medium — catering segment maturing in China; overseas growth dependent on channel"
        - label: Hotel / Hospitality
          values:
