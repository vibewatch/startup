figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Illustrates how enterprise buyers in the hospitality, catering, and healthcare verticals
      progress from initial awareness through pilot deployment to production fleet and eventual
      expansion or renewal. The partner-channel entry point (KT Group, YY Group) compresses
      the evaluation stage for international buyers, accelerating time-to-pilot.
    approximationNotes: >-
      Stage durations and conversion dynamics are estimated from industry norms and available
      KEENON deployment announcements; KEENON has not disclosed funnel metrics or sales cycle length.
    data:
      items:
        - id: stage-awareness
          label: Awareness
          actor: Enterprise buyer (procurement / F&B ops / hotel GM)
          description: >-
            Buyer discovers KEENON through hospitality trade press, peer referrals, industry
            conferences (Interclean, HICAP), or via an existing distribution partner relationship
            (KT Group for Korean buyers; YY Group for Singapore/Malaysia operators).
          channels:
            - Trade press (HospitalityTech, RoboticsBiz)
            - Industry conferences
            - Partner referral network
        - id: stage-evaluation
          label: Evaluation / Pilot Request
          actor: Enterprise buyer + KEENON or distributor pre-sales
          description: >-
            Buyer requests a pilot of 1–3 robots in a single venue to assess labour offset, guest
            experience, and operational fit. International buyers typically engage through local
            distribution partner; China buyers engage KEENON direct or through regional office.
          channels:
            - Distributor demo (KT Group, YY Group)
            - KEENON direct sales (China and key accounts)
            - Product demo at flagship reference site
        - id: stage-pilot
          label: Limited Pilot (1–5 robots)
          actor: Venue operations team + KEENON integration engineer
          description: >-
            Single-site pilot deployment of 1–5 robots in target environment. KEENON KOM 2.0
            platform onboards robots; staff training conducted. Pilot assessment period typically
            30–90 days. COVID-era hospital deployments bypassed this stage under emergency procurement.
          channels:
            - On-site integration and commissioning
            - Remote fleet monitoring via KOM 2.0
        - id: stage-production
          label: Production Deployment
          actor: Enterprise buyer (multi-site ops)
          description: >-
            Successful pilot converts to production contract. Buyer commits to a robot fleet
            under either hardware-sale (capex) or RaaS subscription (opex) model. KEENON
            provides maintenance SLA, fleet management platform access, and KOM 2.0 integrations.
          channels:
            - Formal procurement contract
            - KOM 2.0 fleet management
        - id: stage-expansion
          label: Fleet Expansion (multi-site, multi-SKU)
          actor: Enterprise headquarters / group procurement
          description: >-
            Following successful single-site production, buyer expands to additional properties
            or adds new product SKUs (DINERBOT + BUTLERBOT + KLEENBOT). Group-level contracts
            negotiated with KEENON or distributor. This is where Shangri-La Group smart hotel
            partnership is positioned.
          channels:
            - Group procurement negotiation
            - Distributor enterprise account management
        - id: stage-partner-channel
          label: Partner-Channel Deployment (International)
          actor: Distribution partner (KT Group, YY Group) + end customer
          description: >-
            International buyers in Korea and Southeast Asia receive KEENON robots via the
            distribution partner, who manages last-mile logistics, localisation, and service.
            KEENON does not hold the direct end-customer relationship; renewal decisions
            are intermediated through the partner.
          channels:
            - KT Group hospitality network (South Korea)
            - YY Group FM and hotel portfolio (Singapore, Malaysia, Thailand, Vietnam, UAE)
        - id: stage-renewal
          label: Renewal / Upsell
          actor: Enterprise buyer + KEENON account management
          description: >-
            Hardware robot refresh cycle (est. 3–5 years) or RaaS contract renewal. Upsell
            opportunity includes new product generations, expanded SKU mix, KOM 2.0 premium
            analytics tier, and new-site deployments. No renewal rate data has been publicly
            disclosed by KEENON.
          channels:
            - Existing account management
            - Product upgrade programme
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU023

