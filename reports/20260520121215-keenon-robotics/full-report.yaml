  - id: TE003
    title: Technology / Operating Architecture
    description: >-
      Keenon's core technology layers, each layer's role, its key dependencies, and the associated risk if the
      dependency is disrupted or underperforms.
    columns:
      - Layer / Component
      - Role
      - Dependency
      - Risk
    rows:
      - - LiDAR Sensing
        - Primary spatial perception for obstacle detection and environment mapping
        - 'Third-party LiDAR module suppliers (Chinese market: Livox, RoboSense, Slamtec)'
        - Supply constraint or component price inflation; sensor accuracy degradation in dusty environments
      - - SLAM Navigation Engine
        - Translates LiDAR point-cloud into robot position and autonomous path selection
        - Proprietary SLAM algorithm (50+ patents cited); may incorporate open-source ROS components
        - Navigation drift in dynamic high-traffic environments; accuracy in map-edge zones
      - - VSLAM (Visual SLAM)
        - Position estimation using camera features when LiDAR alone is insufficient; used in T10, S300
        - Camera hardware + VSLAM algorithm; lighting conditions must be adequate
        - Degradation in low-light or reflective floor environments; calibration after physical damage
      - - AI Route Planning and Multi-Robot Dispatch
        - 'KOM 2.0 fleet orchestration: prioritises tasks, avoids deadlocks, optimises fleet-wide routes'
        - Cloud or on-premise server running KOM 2.0; network connectivity (except S300 offline mode)
        - Network outage disrupts multi-robot coordination for all non-offline-capable models
      - - IoT Elevator Integration (W3)
        - Enables autonomous multi-floor delivery by controlling elevator calls and door holds
        - Building management system (BMS) and elevator controller API compatibility per installation
        - High per-site integration effort; incompatibility with older or proprietary elevator systems
      - - Charging and Power Management
        - Auto-dock charging (pile), manual adapter, and quick-swap battery across product lines
        - Battery cell supplier; charging station hardware compatibility; power grid at deployment site
        - Battery degradation over time; swapped-battery logistics in large fleet operations
