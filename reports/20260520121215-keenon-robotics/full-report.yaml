  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics competes in the indoor commercial service robot market — autonomous, mobile machines
              deployed within commercial venues to perform repetitive service tasks without continuous human
              supervision. The included spend comprises autonomous delivery robots (food, amenities, medicines, linens),
              autonomous floor-cleaning robots, and robot-as-a-service (RaaS) subscription contracts for the same device
              categories. The market boundary is constrained to indoor professional use in three primary verticals: food
              service (restaurants, canteens, cafeterias), hospitality (hotels, resorts, assisted-living facilities),
              and healthcare (hospitals, clinics). This scope excludes outdoor last-mile delivery robots (Starship,
              Nuro), industrial warehouse automation (Kiva/Amazon Robotics, Locus Robotics), surgical robots (Intuitive
              Surgical), and personal/domestic consumer robots (iRobot).

              Adjacent markets are relevant for sizing context but must be clearly separated. The broader global service
              robotics market, valued at USD 47-68 billion in 2024-2025 across multiple analyst reports, includes
              logistics, agriculture, medical, and defense robots that Keenon does not address. Analysts classify the
              hospitality and food service robot segment as a sub-segment of "professional service robots," which itself
              is the largest revenue category within the broader market. The closest substitute for an indoor delivery
              robot is a human runner or porter — the status-quo workflow involves kitchen/pantry staff physically
              carrying trays or trolleys to tables or rooms. Secondary substitutes include dumbwaiter lifts (fixed
              infrastructure, high cost), conveyor belt systems (limited to fixed layouts), and pneumatic tube systems
              (hospitals only, limited payload). None of these substitutes offer the same combination of
              zero-capex-for-path-changes, multi-stop routing, and fleet scalability as autonomous mobile robots.

              China remains by far the largest single national market for indoor commercial service robots. Pandaily
              reported that China's catering service robot market grew 110% year-over-year in 2021, and the IFR's 2025
              World Robotics report confirms China installs approximately 54% of annual industrial robots worldwide and
              hosts roughly 2 million robot units in operational stock in manufacturing alone. China's 15th Five-Year
              Plan (2026-2030), announced by the IFR in May 2026, places robotics at the center of the national
              innovation agenda, directing both commercial and government procurement toward domestic robot
              manufacturers. This creates structural home-market advantages for Keenon as a Chinese-origin vendor while
              international expansion into Japan, South Korea, Southeast Asia, and the Middle East creates the growth
              opportunity outside China.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
