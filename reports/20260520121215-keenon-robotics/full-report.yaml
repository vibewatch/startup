      - number: '7.6'
        title: Mitigation Ladders and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigating KEENON's risk profile requires a structured monitoring programme with defined thresholds that
              distinguish acceptable operating risk from thesis-breaking events. On the regulatory front, the key
              monitorable trigger is any confirmed enforcement action by China's Cyberspace Administration of China, a
              PIPL fine or investigation disclosure, or the enactment of US legislation explicitly extending NDAA-style
              procurement restrictions to service robots. Either event would require an immediate investment thesis
              review, as the addressable market in institutional and government-adjacent verticals would be materially
              impaired.

              On the financial and funding front, the primary trigger is KEENON failing to raise a follow-on round by
              the end of 2027 (six years post Series D), or SoftBank announcing a formal write-down of the KEENON
              position in its Vision Fund 2 portfolio reporting. Either event signals either that external capital is
              unavailable at acceptable terms (suggesting deteriorating business prospects) or that the principal
              institutional sponsor is distancing itself from the investment.

              On the customer and partner front, the key triggers are: (a) Haidilao publicly terminating or materially
              reducing its KEENON robot deployment; (b) YY Group's MOU reaching any announced expiry or renewal date
              without conversion to a binding purchase order or service agreement; (c) KT Group announcing a competing
              robot brand partnership or termination of the KEENON relationship. Each of these events would remove a
              pillar of the reference customer narrative and require a formal re-rating of the concentration risk score.

              Positive signals that reduce risk include: disclosure of audited financials or a prospectus filing,
              publication of independent security certifications for KOM 2.0, announced binding contracts converting
              from the YY Group MOU, or independent third-party validation of the 100,000+ robot installed-base claim.
