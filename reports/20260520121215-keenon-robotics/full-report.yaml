      - number: '6.3'
        title: Adoption Trajectory and Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              KEENON's disclosed deployment milestones trace a rapid early growth curve that becomes opaque in later
              years. CEO Li Tong stated in September 2021 that KEENON had shipped more than 20,000 robots globally, a
              figure corroborated by 36Kr reporting. Earlier coverage indicated a 10,000-robot milestone around 2020.
