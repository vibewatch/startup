      - number: '1.4'
        title: Product Portfolio and Technology Platform
        blocks:
          - type: paragraph
            body: >-
              KEENON's product portfolio spans four major categories: autonomous delivery robots for catering (DINERBOT
              series), hotel and multi-floor service robots (BUTLERBOT series), commercial cleaning robots (KLEENBOT
              series), and the recently launched XMAN humanoid robot series. This breadth distinguishes KEENON from
              single-vertical service robot competitors.

              The DINERBOT line includes the T3 (hygienic design), T8 (compact, 55cm aisle navigation), T9 (high-load
              40kg capacity), T10 (delivery and marketing, iF Design Award 2025 winner), and T11 (narrow-aisle marketing
              specialist), alongside the T5 and T6 for global restaurant markets. The T1 was the world's first
              autonomous delivery robot (launched 2016) and the first to enter mass production (2018). The BUTLERBOT W3
              delivers via elevator in multi-floor hotel environments. The S-series (S100, S300) addresses heavy-load
              courier and industrial delivery scenarios.

              The KLEENBOT cleaning line was launched with the C30 in 2023 and expanded to the C40 (professional 4-in-1
              floor cleaner), C55 (triple-roller design for large spaces), and C20 (compact for small spaces) by late
              2025. The C55 features an industry-first triple-roller design integrating sweeping and scrubbing, with an
              extra-large water tank covering the equivalent of three football fields per fill.

              In the AI and software layer, KEENON launched KOM 2.0 (KEENON Operator Model 2.0) on September 26, 2025 —
              described as the world's first self-developed VLA (Vision-Language-Action) model for the service industry.
              KOM 2.0 combines K-Mind (perception), K-Act (action), and contextual learning, with ProS role-specific
              expertise, enabling robots to perceive, understand, and act autonomously. In July 2025, KEENON debuted its
              first bipedal humanoid service robot at WAIC (World AI Conference) Shanghai. The XMAN-R1 and XMAN-F1
              humanoid robots were formally launched in April 2026 alongside the latest KLEENBOT additions, marking
              KEENON's entry into the humanoid segment.
