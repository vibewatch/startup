  - id: FE001
    title: Keenon Product Architecture Map — Technology Layers
    type: stack
    layout: standard
    summary: >-
      Technology stack from physical hardware through navigation, AI, fleet management, and customer integration for
      Keenon's delivery and cleaning robot families. The XMAN humanoid is shown as a separate nascent platform at the
      top of the stack with no confirmed production-ready layer above hardware.
    data:
      layers:
        - label: Hardware Platform
          detail: >-
            Chassis, actuators, battery, charging systems, and body sensors. DINERBOT: 38–71 kg chassis; KLEENBOT C55:
            150 kg; S300: 300 kg-rated shelfless structure with 23 cm industry-low chassis. Chassis patents cover
            CAE-simulation suspension (T9). Battery options: auto-dock, manual adapter, 15-second quick swap (S100,
            S300, C40, C55).
        - label: Perception and Sensing
          detail: >-
            LiDAR (primary distance sensing and SLAM mapping), stereo vision cameras (1–4 per robot depending on model
            for 3D obstacle detection), RGB camera (T10, higher models), and anti-collision body strips. T8 detects
            obstacles under 5 cm. S300 uses dual LiDAR + stereo vision + VSLAM for maximum redundancy.
        - label: Navigation and Mapping (SLAM / VSLAM)
          detail: >-
            LiDAR SLAM: builds persistent spatial map; handles dynamic re-routing. VSLAM (T10, S300): camera-based
            visual feature tracking supplements LiDAR under partial occlusion. S300 offline mode: on-device path
            planning without network connectivity. Deployment mapping: VSLAM eliminates magnetic tape/QR codes; S300
            claims 1-day site setup vs traditional 3–6 months.
        - label: AI Route Planning and Multi-Robot Dispatch
          detail: >-
            Patented AI algorithms for route optimisation across simultaneously active robots. KOM 2.0 AI platform:
            fleet-wide task allocation, dispatching priority, deadlock avoidance, and real-time route adaptation.
            Operates as on-premise or cloud-hosted fleet manager. Multi-robot dispatching supported on T3, T9, T10, and
            S-series.
