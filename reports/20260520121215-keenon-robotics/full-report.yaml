              in 2024, with delivery robots among the fastest-growing categories — providing sector tailwind context for
              KEENON's claimed trajectory even though KEENON's share of this global pool is not independently
              quantified. The hospitality robots market, as tracked by Mordor Intelligence, is projected to grow at a
              24.1 percent CAGR through 2030, suggesting structural demand underlying KEENON's largest addressable
              segment. The gap between the confirmed 2021 figure (20,000+ units) and the unconfirmed 2025 claim
              (100,000+) represents a five-fold increase without independent validation, a material due-diligence
