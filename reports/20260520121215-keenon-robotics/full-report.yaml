      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics was founded by Li Tongzhi, who is publicly known by the English names "Tony Li" and "Li
              Tong." Li serves as founder and CEO, a role he has held continuously since founding. He appeared as a
              named speaker at the World Economic Forum Annual Meeting of the New Champions Dalian 2024 under the
              designation "CEO and Founder of KEENON Robotics," confirming the title in a third-party international
              context. The 36Kr D-round coverage (September 2021) refers to the CEO as "李通" (Li Tong), identifying him
              as the same individual under the Chinese name.

              No co-founders or additional C-suite executives have been named in English-language or publicly accessible
              Chinese-language materials reviewed during this research. The company has not published a board
              composition, investor seat disclosures, governance charter, or succession plan in reviewed sources. This
              represents elevated key-person concentration: a single founder-CEO occupies both strategic and operational
              authority at a company of 1,001 to 5,000 employees across multiple continents.

              The absence of disclosed board governance is consistent with a private Chinese growth-stage company that
              has not yet entered a public listing process. The company has not announced any material leadership
              changes, executive hires, or departures in reviewed materials through May 2026. Key-person dependence on
              Li Tongzhi is the primary governance risk at the company overview level; no public indication of
              distributed leadership depth or succession planning has been found.
