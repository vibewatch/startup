      - number: '4.4'
        title: Capital Adequacy and Financing
        blocks:
          - type: paragraph
            body: >-
              KEENON's disclosed financing history culminates in a September 2021 Series D of USD 200 million led by
              SoftBank Vision Fund 2, with co-investors CICC ALPHA Capital (an affiliate of China International Capital
              Corporation) and Prosperity7 Ventures (an Aramco affiliate). The Robot Report places total disclosed
              funding at the time of the D-round close at approximately USD 244 million, implying roughly USD 44 million
              was raised in Series A through C. No subsequent funding rounds have surfaced in any public source — media,
              SEC filings, or KEENON's own communications — as of the May 2026 run date. KEENON has also filed no IPO
              prospectus or pre-listing documentation on any public exchange through May 2026.

              The March 2026 shareholder letter filed with the SEC by YY Group (a NASDAQ-listed company that signed an
              MOU with KEENON in August 2025) describes KEENON as an active commercial partner deploying robots in
              Singapore and Malaysia, indicating the company remains operationally healthy nearly 56 months after its
              D-round close. Whether the USD 200 million raise has been substantially consumed or partially preserved
              through revenue generation cannot be determined without private access. China's 15th Five-Year Plan
              (2026-2030) designates robotics as a strategic national sector, creating potential avenues for
              government-subsidized financing, policy bank credit, and state-backed fund participation that would not
              appear in international media or SEC filings. Cash position, monthly burn, planned use of funds, and debt
              or project-finance obligations remain entirely undisclosed. The next-round trigger — whether KEENON is
              profitable, running on reserves, or seeking fresh capital — is opaque.
