  - id: TM004
    title: Growth Drivers and Constraints Table
    description: >-
      Structured summary of key drivers and constraints affecting market growth, with timing, implication, and diligence
      asks.
    columns:
      - driver_or_constraint
      - direction
      - timing
      - implication
      - diligence_ask
    rows:
      - - Post-pandemic labor shortages (hospitality, food service)
        - Driver (+)
        - Short term (active 2024-2026)
        - >-
          Turnover 76% above pre-COVID baseline in hospitality; 6.9M US job openings March 2026; drives ROI case for
          robot deployment
        - Verify vacancy rates are persistent rather than cyclical; track labor market normalization signals
      - - OECD-wide workforce contraction (2025-2030 net -15M workers)
        - Driver (+)
        - Long term (4+ years)
        - >-
          Structural demographic tailwind; sustained labor pressure in Japan, Germany, South Korea, US independent of
          cycle
        - Confirm OECD projection applies to hospitality/food service specifically, not only manufacturing
      - - Component price deflation (lidar, vision chips, battery)
        - Driver (+)
        - Short term (active, 2022-2025 already occurred)
        - Navigation BOM under USD 1,000; 5-year TCO halved since 2020; lower ASPs expand addressable venue count
        - Track commodity pricing trend; ASP compression may compress hardware margins
      - - Robot-as-a-service (RaaS) models removing capex barrier
        - Driver (+)
        - Medium term (2-4 years)
        - >-
          Monthly fees from USD 1,500; payback under 18 months; Seegrid 70% RaaS contracts in 2025; unlocks SME and
          mid-market
        - Verify Keenon's RaaS penetration as % of bookings; RaaS cash-flow model may pressure near-term margins
      - - Government policy and subsidy programs (China, Japan, Singapore)
        - Driver (+)
        - Medium term (policy cycles)
        - >-
          Japan covers JPY 15M per property; Singapore USD 60M NRP; China 15th FYP mandates robotics; reduces net buyer
          cost by 20-40%
        - Confirm Keenon is on approved-vendor lists for subsidy programs in each market
      - - Contactless service preference (68% of travelers)
        - Driver (+)
        - Short-to-medium term
        - Sustained post-pandemic demand for zero-contact room-service; NPS uplift documented in properties using robots
        - >-
          Validate with Keenon customer case studies; contactless may be table-stakes rather than premium differentiator
          as penetration rises
      - - High upfront CAPEX for operators (esp. independents)
        - Constraint (−)
        - Near term (active constraint)
        - 40% of operators cite budget as top barrier; USD 8,000-20,000 per unit; USD 30,000-80,000 for initial fleet
        - Assess Keenon's financing/leasing options; RaaS availability and terms for restaurant-sized operators
      - - Legacy PMS and elevator API integration complexity
        - Constraint (−)
        - Medium term
        - >-
          2.1% CAGR headwind per Mordor hospitality report; integration failures cause pilot abandonment; hotel chains
          require PMS certification
        - Confirm Keenon's certified PMS integrations; evaluate hotel elevator protocol coverage
      - - Safety certification and regulatory compliance cost
        - Constraint (−)
        - Medium term
        - >-
          ISO 13482 and EU Machinery Regulation add up to 20% to dev cost; multi-jurisdiction compliance costly for
          global expansion
        - Verify Keenon's CE, FCC, and local safety certifications per market
      - - Trust, staff resistance, and guest experience risk
        - Constraint (−)
        - Short-to-medium term
        - >-
          Staff fear displacement; Western guests in premium settings may prefer human service; 1.8% CAGR headwind from
          data-privacy concerns
        - Obtain NPS data from Keenon customer deployments; check for any documented guest-complaint incidents
      - - Macroeconomic cycle (hospitality capex compression in downturns)
        - Constraint (−)
        - Long term (latent)
        - Hotel and restaurant capex cut disproportionately in recessions; RaaS provides partial insulation
        - Model sensitivity to 10-20% drop in new robot orders if travel slows
