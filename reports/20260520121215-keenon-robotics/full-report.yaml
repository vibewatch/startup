      - number: '7.2'
        title: Operational, Quality, and Security Risks
        blocks:
          - type: paragraph
            body: >-
              KEENON robots operate as networked endpoints in customer premises — restaurants, hotels, hospitals, and
              commercial facilities — connecting to the KOM 2.0 cloud management platform for fleet coordination, route
              optimisation, and remote monitoring. No publicly available security certifications (SOC 2 Type II, ISO
              27001, or equivalent) have been identified for KEENON's cloud infrastructure as of May 2026. The CISA has
              issued repeated guidance on connected-device security risks and the importance of software bills of
              materials (SBOM); KEENON has not published any SBOM or security disclosure. Each robot deployed in a
              hotel, hospital, or restaurant is a persistent networked sensor in a customer environment, creating
              potential data exfiltration risk if the cloud platform or robot firmware is compromised.

              Operational reliability is a material concern. Hacker News engineering discussions from 2023 surface
              persistent scepticism about autonomous delivery robot uptime, edge-case collision handling, and
              maintenance burden in real-world deployments. HBR's 2023 analysis of Robotics-as-a-Service identified
              robot downtime and unmet ROI expectations as the leading causes of RaaS contract non-renewal. If KEENON
              robots fail to maintain uptime commitments in production, retention rates in the RaaS channel will
              deteriorate. The company has not disclosed mean-time-between-failure (MTBF), uptime SLA terms, or
              maintenance response-time guarantees for any product.

              KEENON's supply chain is concentrated in China, exposing the company to disruptions from component
              shortages, logistics constraints, geopolitical events, or regulatory restrictions on technology exports.
              The broader commercial cleaning product line (KLEENBOT C20, C40, C55) is newer and less documented than
              the catering and hotel lines; independent performance validation is not available. Finally, the IFR's 2026
              analysis of China's 15th Five-Year Plan notes that humanoid robot capabilities in real-world production
              scenarios remain limited to demonstrators or pilot projects — suggesting that KEENON's XMAN humanoid
              investment may deliver limited near-term commercial value while consuming material R&D resources.
            claimRefs:
