      - number: '6.5'
        title: Retention, Durability, and Satisfaction Signals
        blocks:
          - type: paragraph
            body: >-
              No Net Revenue Retention, Gross Revenue Retention, annual churn rate, customer satisfaction score, or Net
              Promoter Score data has been publicly disclosed by KEENON or independently measured by any analyst as of
              May 2026. The absence of retention metrics is typical of early-stage enterprise hardware companies, but it
              creates a significant blind spot for durability assessment: KEENON's repeat purchase evidence is limited
              to branded partnership announcements — Shangri-La, KT Group, and YY Group — rather than cohort-level
              renewal or expansion data. The YY Group MOU uses non-binding language throughout and cannot be treated as
              confirmed revenue. Robot replacement cycles in the hospitality and catering verticals are estimated at
              three to five years based on industry norms, meaning that even the 2018 Haidilao reference relationship
              would have entered its second or third robot-generation cycle by 2026, yet no renewal or upsell
              announcement has appeared in any public source. A Hacker News discussion thread from 2023 surfaced
              developer and operator concerns about autonomous delivery robot reliability, maintenance cost, and
              edge-case performance failures, consistent with the HBR finding that RaaS contracts face elevated churn
              risk when labour market conditions shift or when robot uptime falls short of operator ROI thresholds.
              These signals collectively indicate that retention dynamics are opaque and may carry more risk than
              KEENON's partnership announcement cadence would suggest.
