      - number: '7.4'
        title: Financial, Disclosure, and Business Model Risks
        blocks:
          - type: paragraph
            body: >-
              KEENON presents a near-total financial information blackout. No revenue, gross margin, EBITDA, cash
              balance, or burn rate has been publicly disclosed as of May 2026. The only confirmed capital event is the
              September 2021 Series D of USD 200 million led by SoftBank Vision Fund 2, bringing total disclosed funding
              to approximately USD 244 million. Without audited financials, it is impossible to assess whether KEENON
              has sufficient runway, what its capital intensity is under the RaaS model, or whether it is generating
              positive operating cash flow. The OECD's analysis of AI-sector economics notes that scaling AI-hardware
              businesses requires substantial ongoing capital investment in inventory, logistics, and service
              infrastructure — costs that compound with geographic expansion.

              The Robotics-as-a-Service model introduces structural capital intensity that grows with scale: KEENON must
              finance robot hardware upfront and recover the cost over the subscription period, while bearing inventory,
              maintenance, and end-of-life disposal risk. If RaaS contract durations are short or renewal rates are low
              (as HBR's 2023 analysis suggested is common when labour market conditions change), KEENON's working
              capital position may be under pressure. SP Global's market analysis of RaaS businesses in commercial
              venues flagged working capital and depreciation risk as key investor concerns.

              Hardware commoditisation is an accelerating risk in the service robot sector. Competitors including Bear
              Robotics, Pudu Technology, and Orion Star produce comparable catering and hotel delivery robots at
              increasingly competitive price points. As average selling prices compress, KEENON's margin profile —
              already unverifiable — faces structural pressure. The company has not disclosed any plan or timeline for a
              liquidity event (IPO or strategic sale). As a 2021 Series D vintage private company, the pressure on
              SoftBank and other investors to realise returns may intensify after 2025, creating uncertainty about the
              terms and timeline of any exit.
