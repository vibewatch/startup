      - CE019
  - id: FE003
    title: Critical Dependency Map — Keenon Product and Technology
    type: dag
    layout: wide
    summary: >-
      Key external dependencies that could disrupt Keenon's product delivery, navigation reliability, integration
      capability, or market access. Each node represents a dependency category; edges show which Keenon product or
      capability relies on that dependency.
    data:
      nodes:
        - id: D01
          label: Chinese LiDAR / Sensor Supply Chain
          detail: >-
            Primary LiDAR sensor suppliers are China-domiciled (Livox, RoboSense, Slamtec). Export controls, component
            shortages, or tariff changes affect all navigation-dependent products.
        - id: D02
          label: Proprietary SLAM / VSLAM Algorithm Core
          detail: >-
            Keenon's navigation is built on internally developed SLAM and VSLAM algorithms covered by 50+ patents.
            Algorithm accuracy, map drift, and edge-case handling in novel environments are key technical risks.
        - id: D03
          label: Building Elevator IoT Infrastructure
          detail: >-
            W3 elevator integration requires compatible BMS/elevator controller APIs per building. Older buildings,
            proprietary elevator controllers, and non-standard protocols create per-site integration risk.
        - id: D04
          label: Network / Cloud Connectivity (KOM 2.0)
          detail: >-
            Multi-robot dispatch and fleet analytics depend on KOM 2.0 connectivity. S300 is the only model with
            confirmed offline operation; all others depend on site Wi-Fi or 5G.
        - id: D05
          label: Battery Cell and Charging Hardware Suppliers
          detail: >-
            Battery cells (DC 24V–25.6V packs), charging pile hardware, and quick-swap battery logistics for 24/7 models
            (S100, S300, C40, C55) require reliable supplier relationships.
        - id: D06
          label: Enterprise Customer Site Mapping and Onboarding
          detail: >-
            All SLAM-based models require initial site mapping run before autonomous operation. Accuracy of initial map,
            change management for layout updates, and technician availability are deployment bottlenecks.
      edges:
        - from: D01
          to: D02
          label: LiDAR data feeds SLAM engine
        - from: D02
          to: D03
          label: SLAM-navigated robot requires elevator access
        - from: D02
          to: D04
          label: route plans sync to fleet manager
        - from: D04
          to: D03
          label: elevator control commands sent via network
        - from: D05
          to: D02
          label: battery state constrains robot availability
        - from: D06
          to: D02
          label: site map quality determines navigation accuracy
        - from: D01
          to: D05
          label: supply disruption co-occurs with battery supply
