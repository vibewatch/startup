      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              KEENON has disclosed no gross margin, COGS breakdown, or operating cost data. Unit economics must be
              inferred from manufacturing context, industry comparables, and cost-driver analysis. A service delivery
              robot's bill of materials is dominated by LIDAR sensors, obstacle-avoidance cameras, drive motors, onboard
              compute, battery packs, and a steel chassis. For mid-range autonomous mobile robots, these components
              collectively represent approximately 40 to 60 percent of the hardware selling price, implying hardware
              gross margins of roughly 25 to 40 percent for manufacturers at scale.

              KEENON manufactures at facilities in Suzhou and Shenzhen, benefiting from Chinese supply-chain cost
              advantages and proximity to component suppliers. However, the company faces exposure to component-cost
              volatility — particularly LIDAR sensor pricing, which has declined sharply as Chinese domestic producers
              scaled — and to foreign-exchange risk on international sales denominated in currencies other than the
              renminbi. R&D investment in the KOM 2.0 Visual Language Action (VLA) AI model adds to overhead without
              immediate revenue offset, compressing near-term margins. In the RaaS segment, once hardware is deployed,
              the incremental cost of the subscription service (maintenance visits, software updates, remote monitoring)
              is lower than the initial robot cost, suggesting materially higher gross margins on the recurring revenue
              stream than on the initial hardware sale. IFR data confirms the service robot sector grew 37 percent in
              value terms in 2023, indicating robust demand that may support stable or improving realized prices.
              Working capital requirements are material: hardware inventory and finished goods represent a multi-month
              cash cycle, and international expansion amplifies logistics and customs-clearance costs.
