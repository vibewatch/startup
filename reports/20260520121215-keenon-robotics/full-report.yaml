      - number: '6.4'
        title: Distribution Channels and Partner Strategy
        blocks:
          - type: paragraph
            body: >-
              KEENON's international go-to-market relies predominantly on hospitality and facilities management
              distribution partners rather than direct sales forces. YY Group covers Singapore, Malaysia, Thailand,
              Vietnam, and the UAE under its facilities management and hotel services umbrella, making it KEENON's
              single named entry point into five Southeast Asian markets simultaneously. KT Group provides Korea
              Telecom's commercial hospitality and smart-building network as the distribution vehicle for KEENON robots
