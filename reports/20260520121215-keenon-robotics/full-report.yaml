            title: Privacy Policy Allows Broad Cross-Border Data Transfers Without Data Localisation
            body: >-
              Keenon's published privacy policy permits transfer of personal and device data to any country where Keenon
              or its service providers operate, sharing with affiliates, subsidiaries, service providers, business
              partners, and third-party advertising partners. No data localisation guarantees, GDPR processor agreement
              templates, or EU-US data transfer mechanism disclosures (e.g., Standard Contractual Clauses) are
              published. Combined with the absence of ISO 27001 or SOC 2 certification, this creates a structural
              procurement barrier in Western regulated industries and should be treated as a material diligence item for
              healthcare, government, and financial services buyers.
