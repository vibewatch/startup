companyProfile:
  summary: >-
    KEENON Robotics (上海擎朗智能科技有限公司) is a Shanghai-headquartered autonomous service robotics company founded in 2010 by Li
    Tongzhi (Tony Li). It is the global market leader in commercial indoor service robots, holding IDC Triple No.1
    rankings across global shipments, global market share, and China market share as of 2025. Its product portfolio
    spans DINERBOT (catering delivery), BUTLERBOT (hotel service), KLEENBOT (commercial cleaning), and the newly
    launched XMAN humanoid robot series, underpinned by the KOM 2.0 Vision-Language-Action AI platform. KEENON has
    deployed 70,000+ robots across 60+ countries, with anchor customers including Haidilao, KT Group (South Korea),
    Shangri-La Hotels, and YY Group (Southeast Asia). Its largest disclosed funding round is a $200M Series D led by
    SoftBank Vision Fund 2 in September 2021, implying a ~$2B post-money valuation. No revenue or financial metrics have
    been publicly disclosed.
