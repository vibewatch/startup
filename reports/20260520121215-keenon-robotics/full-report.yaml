      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Keenon Robotics exhibits a mixed exit-readiness profile. The structural case for a liquidity event is
              compelling: it is the global commercial service robot market leader, backed by SoftBank Vision Fund 2
              whose 5–7 year hold horizon is approaching, and it has expanded its partner base to include globally
              recognized enterprise brands. Chinese- headquartered tech companies have recently favored Hong Kong or
              Singapore as listing venues to avoid CFIUS-adjacent US listing scrutiny; WeRide's October 2024 Nasdaq IPO
              notwithstanding, Keenon could plausibly structure a Hong Kong H-share offering or Singapore primary
              listing.

              However, the case against a near-term IPO is also strong. No disclosed path to profitability makes a
              public-market roadshow difficult in the current environment where software-first or AI-first narratives
              dominate. Hardware robotics valuations have compressed in public markets, with pure-play service robot
              companies trading at discounts to pre-2022 private marks. The four-year absence of new-round announcements
              raises internal anchor questions that would need resolution with a credible roadshow range. The most
              credible near-term liquidity path therefore remains a strategic M&A transaction or a large growth round
              from a strategic industrial partner (analogous to Bear Robotics' LG Electronics deal), rather than a
              listed IPO in the next 12–24 months.

              Critical diligence asks before upgrading conviction: (a) audited revenue and gross margin for FY2024 and
              FY2025; (b) fleet utilization rates and per-robot annual economics (revenue, cost of deployment,
              maintenance, remote-supervision labor); (c) breakdown of revenue between hardware sale, software and SaaS,
              and as-a-service contracts; (d) confirmation of whether the CB Insights "Series D" designation reflects an
              actually closed round, with terms and valuation; (e) current SoftBank Vision Fund 2 carrying value or NAV
              mark for the Keenon position; and (f) customer churn rate and renewal terms for the top twenty enterprise
              accounts. Without at least items (a) and (b) above, a rating above "track" is not defensible on a
              risk-adjusted basis.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
