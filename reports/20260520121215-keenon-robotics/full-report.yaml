            title: PIPL and Connected-Device Security Create Unquantified Regulatory Exposure
            body: >-
              KEENON deploys networked robots that map and navigate customer premises, logging operational data that
              connects to the KOM 2.0 cloud platform. China's PIPL (effective November 2021) requires companies
              transferring personal information outside China to complete a CAC security assessment or obtain
              certification. No such assessment has been publicly confirmed for KEENON. The Stanford DigiChina
              translation of PIPL Article 38 confirms that cross-border transfers — including to global affiliates and
              service providers — require one of three compliance pathways. At the same time, CISA and NIST have both
