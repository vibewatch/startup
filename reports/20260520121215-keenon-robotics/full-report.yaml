      - number: '7.5'
        title: People, Execution, and Humanoid Distraction Risks
        blocks:
          - type: paragraph
            body: >-
              KEENON's founding CEO Li Tong is the primary public face of the company and the individual most associated
              with its strategic vision, investor relationships, and customer reference narrative. The depth and
              succession readiness of the senior management team are not publicly disclosed. Key-person dependency at
              the CEO level is a material risk for a pre-IPO company operating in a high-capital, high-trust sector. No
              Chief Financial Officer, Chief Revenue Officer, or Chief Technology Officer has been publicly named in
              KEENON's English-language communications reviewed as of May 2026.

              Overseas execution capability is a persistent gap. KEENON claims commercial presence in 60+ countries and
              600+ cities, but this footprint is built primarily through partner-channel distribution rather than direct
              KEENON sales and service teams. Robot maintenance in non-China markets requires local field-service
              networks with trained technicians, spare-parts logistics, and response-time guarantees. The absence of
              publicly documented service infrastructure in Western markets — North America, Europe, the Middle East —
              represents a structural barrier to scaling in those regions.

              The XMAN humanoid robot series (XMAN-F1 and XMAN-R1) represents a potentially material diversion of R&D
              resources from the core service-robot revenue lines. The IFR's May 2026 assessment of China's 15th
              Five-Year Plan explicitly states that "mass adoption of humanoid robots as universal factory helpers or in
              private households will not happen within the near- and medium-term future" and that the 15th Five-Year
              plan projects commercial humanoid viability towards the end of the 2026–2030 period. If KEENON allocates
              significant capital and engineering headcount to humanoid development, the core DINERBOT, BUTLERBOT, and
              KLEENBOT product lines may receive fewer resources for quality improvements, customer support, and
              geographic expansion.
