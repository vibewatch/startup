      - number: '1.3'
        title: Funding History, Valuation, and Capital Position
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics has completed at least four confirmed financing rounds from inception through 2021. The
              earliest disclosed round was a Series A that provided initial growth capital; details are not publicly
              confirmed. In December 2020, the company closed a Series C round of "several hundred million yuan" with
              SoftBank Ventures Asia and Alibaba Group as investors, as reported by Pandaily referencing 36Kr Chinese
              media coverage. This round coincided with the company's COVID-19 pandemic deployment phase and
              accelerating international expansion.

              The most significant publicly confirmed round is the D-round announced in September 2021: $200 million
              USD, led by SoftBank Vision Fund (SoftBank Vision Fund 2 per western press), with CICC ALPHA (中金甲子) and
              Prosperity7 Ventures (the Saudi Aramco diversification VC fund) as co-investors. China Renaissance served
              as exclusive financial adviser. 36Kr described this as the "largest single commercial financing in China's
              commercial service robot sector" at the time. Western press in early 2022 referenced this same round as a
              "Series C" of $200M, creating a letter-denomination discrepancy with the Chinese "D-round" label; the
              underlying amount and lead investor are consistent across sources, strongly suggesting a single round.

              No subsequent funding rounds have been publicly announced through the report date of May 2026. Revenue,
              ARR, and EBITDA remain fully undisclosed. No IPO filings or public listing plans have been confirmed. No
              debt or credit facilities have been disclosed. The company's capital position implies continued operation
              on institutional equity, consistent with a pre-IPO hardware-and-AI company at commercial scale. Based on
              the $200M raise at the D-round and industry comparable valuations in the Chinese service robot sector, the
              implied post-money valuation was approximately $2 billion at the time of that round, though this was not
              officially confirmed by the company. No 2024-2026 unicorn confirmation or new valuation anchor has been
              found in reviewed materials.
