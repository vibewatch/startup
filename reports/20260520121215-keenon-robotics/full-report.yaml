  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation by Vertical and Geography
        blocks:
          - type: paragraph
            body: >-
              KEENON Robotics addresses at least four distinct customer verticals. The restaurant and catering segment
              is the company's founding market: KEENON DINERBOT delivery robots automate food transport from kitchen to
              table in high-turnover casual-dining and hotpot restaurants. Haidilao, the world's largest hotpot chain,
              became the anchor reference customer when it opened what KEENON called the "world's first intelligent
              restaurant" in 2018. The hotel and hospitality segment is served primarily by the BUTLERBOT product, which
              handles in-room amenity delivery and lobby navigation in hotels and resorts. The hospitality vertical
              benefits from persistent labour-shortage dynamics in both Asian and Western markets, creating structural
              pull demand. The healthcare and medical segment was catalysed by COVID-19 pandemic deployments: KEENON
              robots performed contactless medication and meal delivery in more than 100 hospitals and quarantine
              centres across China in 2020, establishing a healthcare reference base under emergency conditions. The
              commercial cleaning segment, served by KLEENBOT, is the newest and least documented vertical, addressing
              facilities management buyers in retail, transportation, and logistics venues. Geographically, KEENON's
              domestic China installed base remains the largest concentration, followed by East Asia (Korea via KT
              Group), Southeast Asia (Singapore and Malaysia via YY Group), and broader international markets served
              through distribution partnerships rather than direct sales teams.
