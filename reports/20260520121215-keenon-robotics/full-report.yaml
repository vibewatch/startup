  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The indoor commercial service robot market features competition across five distinct categories. Direct
              peers are Chinese vendors Pudu Robotics and OrionStar Robotics, both offering multi-category robot
              portfolios in the same restaurant, hotel, and hospital verticals as Keenon. Bear Robotics is the leading
              Western-originated direct peer, focused on hospitality but expanding into warehouse logistics with LG
              Electronics as a strategic backer and distribution channel. Vertical-domain incumbents include Aethon
              (hospital delivery robots with 20-plus years of healthcare deployments) and Gaussian Robotics (commercial
              cleaning robots deployed across six-plus countries, including Changi Airport). SoftBank Robotics functions
              as an adjacent competitor and robot integrator with expanding ambitions in senior living, autonomous
              cooking, and last-mile delivery in 2026.

              Status-quo substitutes are the most prevalent competitive force: human labor — restaurant servers, hotel
              bellhops, hospital orderlies — remains the primary alternative in every target vertical. Manual carts and
              trolleys serve hotels and hospitals at minimal capex. Fixed conveyor systems substitute in high-throughput
              back-of-house restaurant settings. Internal builds (operator-developed AMR deployments using generic
              hardware) are rare but not absent in large hospital networks. Future entrants to monitor include major
              elevator and building-automation companies (KONE, Schindler, Otis) that hold deep integration advantages
              for multi-floor deployments and could package lightweight delivery robots as part of building-systems
              contracts. The IFR's 2026 report on China's 15th Five-Year Plan signals continued state-directed
              investment in robotics, which will sustain Chinese vendor competition for years.

              Keenon's IDC Triple No.1 claim establishes its self-reported pole position, but the absence of an
              independently published IDC report limits verifiability. The competitive map is therefore assembled from
              each vendor's official surfaces, third-party funding disclosures, and industry coverage rather than any
              single authoritative ranking.
