      - number: '4.5'
        title: Financial Verdict and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              KEENON's public financial profile is defined almost entirely by what is absent rather than what is
              present. No revenue figure, ARR, gross margin, EBITDA, cash position, burn rate, customer churn, or unit
              economic has ever been disclosed across any public surface. The company's information blackout is
              comprehensive even by private-company standards, making it impossible to assess revenue quality, margin
              trajectory, or capital adequacy without direct access to management accounts and audited financials.

              Three scenarios bracket the capital-adequacy question. In the best case, strong hardware volume and a
              growing RaaS book have generated sufficient revenue to sustain operations from the 2021 raise alone. In
              the base case, the company has consumed most of the D-round and is managing cash carefully while
              international expansion provides new revenue. In the downside case, KEENON requires fresh capital and is
              currently in a quiet fundraising process. All three scenarios are consistent with observable evidence.
              IFR's observation that "the actual capabilities in real-world production scenarios are currently limited
              to demonstrators or pilot projects" applies specifically to humanoid robots and introduces execution risk
              for KEENON's XMAN revenue line, though the delivery-robot segment is substantially more mature. The
              service robotics market's 24 percent CAGR for hospitality robots through 2030 provides a favorable demand
              backdrop. Revenue quality, the hardware-to-RaaS mix, customer retention, and geographic P&L distribution
              are the four financial dimensions requiring diligence most urgently. Without those inputs, no investment
              financial model can be reliably built.
