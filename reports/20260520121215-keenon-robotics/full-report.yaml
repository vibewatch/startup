      - number: '6.6'
        title: Adverse Evidence, Overseas Risks, and Concentration Concerns
        blocks:
          - type: paragraph
            body: >-
              Two substantive adverse signals warrant diligence attention. First, SCMP reporting from 2024 documents
              that Chinese service robot companies — explicitly including KEENON — face meaningful headwinds in overseas
              markets: cultural resistance to automation in Western hospitality contexts, complex import regulations,
              lack of local service infrastructure for maintenance and repair, and geopolitical friction (particularly
              US-China technology tensions) that introduces procurement risk in North American and European accounts.
              Second, the HBR analysis of Robotics-as-a-Service economics warns that recurring-fee robot contracts are
              more vulnerable to churn than one-time hardware sales: if labour shortages ease, if alternative automation
              providers emerge, or if robot uptime does not consistently deliver the promised ROI, customers face
              limited switching costs under monthly fee arrangements. KEENON's customer proof is concentrated in three
              flagship partnerships — Haidilao (China catering), KT Group (South Korea channel), and YY Group (Southeast
              Asia channel) — with limited independently verified mid-market or SME customer references. The total count
              of paying enterprise customers is not disclosed; KEENON characterises its reach through robot-count claims
              rather than customer-count metrics. This concentration pattern represents material customer-level risk:
              the loss or non-renewal of any one flagship partnership could have a disproportionate impact on both
              revenue and reference narrative, particularly in markets where KEENON depends on the flagship partner's
              brand to attract follow-on accounts.
