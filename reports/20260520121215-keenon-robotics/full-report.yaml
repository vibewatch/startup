        title: Exhibits
        blocks:
          - type: callout
            title: XMAN Humanoid Line Has No Published Specifications or Commercial Deployments
            body: >-
              The XMAN-R1 and XMAN-F1 humanoid robots were announced alongside the KLEENBOT refresh in 2024 but carry
              zero published technical specifications, no confirmed pilot or production deployments, and no
              independently sourced capability claims as of May 2026. IFR's 2026 assessment of the humanoid market
              states that real-world production capability is still limited to demonstrators or pilots across the
              industry. Investors should assign no near-term revenue contribution to XMAN and treat it as a strategic
              option with high execution risk.
            calloutType: risk
