      - number: '5.3'
        title: Fleet Management and Integration
        blocks:
          - type: paragraph
            body: >-
              Multi-robot coordination across Keenon's delivery lines is managed by the KOM 2.0 AI platform, which
              handles route allocation, dispatching priority, and traffic management for co-deployed robot fleets. The
              T3 and T9 product pages describe patented AI algorithms that optimise route planning for efficient task
              execution across simultaneously operating units, reducing idle time and preventing bottlenecks in
              high-traffic environments such as large restaurant dining halls or hotel corridors.

              Elevator integration is a defined architectural component for the BUTLERBOT W3. The robot communicates
              with building elevator systems via an IoT protocol to autonomously request, enter, ride, and exit
              elevators for multi-floor delivery, removing the dependency on staff to physically operate lifts on behalf
              of the robot. The practical deployment of this capability requires compatibility with the building's
              elevator controller hardware and building management system (BMS), creating a site-specific integration
              dependency that varies by elevator manufacturer and building vintage.

              Charging automation is addressed differently across product lines. The S100 supports a charging pile
              (auto-return and dock), an adapter, and a 15-second manual battery swap, enabling 24/7 operation cycles.
              The S300 supports automatic charging, manual charging, and battery swap, with up to six hours of full-load
              operation and 3.5-hour fast charging. The T9 supports autonomous charging with up to 18 hours per charge
              under test conditions.

              A critical differentiator in the S300 is its offline operation mode: on-device path planning and task
              execution run without dependency on a central control server or external network (Wi-Fi or 5G). This
              design choice improves reliability in environments with variable network coverage such as basements, cold
              storage, and multi-building industrial campuses. It also reduces the attack surface for network-based
              disruption, though network-independent operation limits real-time fleet-wide coordination, which requires
              connectivity.
            claimRefs:
              - CE017
              - CE018
              - CE019
              - CE020
              - CE021
