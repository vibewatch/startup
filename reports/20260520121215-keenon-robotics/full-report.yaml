  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >
              Keenon Robotics entered the 2022 venture cycle as the uncontested global leader in commercial service
              robotics, raising $200 million in January 2022 at a $2 billion post-money valuation co-led by SoftBank
              Vision Fund 2 and Prosperity7 Ventures. That unicorn valuation was grounded in three pillars: clear IDC
              market leadership, a catering delivery robot franchise dating to 2016, and a global fleet already
              approaching 10,000 units. By 2025 the fleet had grown beyond 70,000 robots across 60-plus countries and
              Keenon had secured IDC Triple No. 1 rankings—covering global commercial service robot shipments, global
              market share, and China market share— for multiple consecutive years.

              The core investment thesis rests on five arguments. First, demonstrated market leadership in a high-growth
              sector: the service robotics market is projected to grow from $47.1 billion in 2024 to $98.65 billion by
              2029 at a 15.9% CAGR (MarketsandMarkets), and Keenon is the best-positioned private company to capture
              that growth. Second, a sticky installed base creates switching costs as operators build workflows around
              Keenon's software stack and service contracts. Third, strategic partnerships with KT Group (South Korea,
              September 2024) and Shangri-La Hotels (October 2025) validate the enterprise product and open
              structured-rollout channels that competitors cannot replicate quickly. Fourth, Keenon's 2025 launch of the
              XMAN-R1 humanoid robot signals ambitions to participate in a broader embodied intelligence wave,
              potentially expanding the addressable market beyond food delivery and hospitality. Fifth, China's 15th
              Five-Year Plan (2026–2030) explicitly places robotics at the heart of the national industrial strategy,
              creating government-backed tailwinds for domestic champions.

              The anti-thesis is equally material. Four-plus years without a public new-round announcement creates deep
              uncertainty about the current fair-market value. CB Insights classifies Keenon at "Series D" with $228.79
              million total raised, implying roughly $28–29 million beyond the Series C at an undisclosed valuation. The
              $2 billion anchor was set when growth multiples were at a 2021–2022 peak that has since compressed
              significantly. Hardware-centric business models carry inherently lower gross margins than software
              (typically 30–50% vs. 60–80%), and without public financials there is no way to verify whether Keenon's
              economics are improving. SoftBank Vision Fund 2 has recorded substantial write-downs across its cohort,
              and it is unclear whether Keenon's position is marked above, at, or below the Series C price in current
              NAV. Finally, a China-specific geopolitical discount—rooted in US export controls, CFIUS-adjacent review
              risk, and bifurcating technology standards—depresses Western-investor appetite for Chinese private tech by
              a commonly estimated 20–30% versus equivalent Western domiciled peers.
