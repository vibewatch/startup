      - number: '5.4'
        title: Cleaning Robot Platform
        blocks:
          - type: paragraph
            body: >-
              The KLEENBOT line represents Keenon's expansion beyond delivery and into commercial floor cleaning,
              competing with specialist cleaning robot vendors such as Gaussian Robotics (Gausium) in a segment where
              Keenon had no product presence before 2024. All three models (C20, C40, C55) combine autonomous navigation
              with integrated sweeping, vacuuming, and floor-scrubbing functions, addressing the labour-cost pressure in
              facilities management for hotels, shopping malls, airports, and healthcare facilities.

              The C55 is the flagship, featuring what Keenon calls an industry-first triple-roller design that
              integrates a sweeper and a scrubber into a single pass, producing a cleaner result compared with
              traditional dual-roller scrubbers according to product marketing. The C55's extra-large water tank holds
              60 litres of clean water and 47 litres of waste water — approximately double comparable industry models
              per Keenon's description — reducing the daily refill frequency. The C55 can traverse speed bumps up to 5
              cm in height, enabling operation in complex environments such as underground parking garages. Its
              theoretical cleaning efficiency reaches 2,376 m²/h, sufficient to clean a large airport terminal zone in a
              single shift. Battery swapping is supported for extended operation.

              The C40 serves mid-size commercial spaces with 1,100 m²/h theoretical cleaning efficiency, a 16-litre
              clean water tank, and dual operating modes: floor scrubbing (up to 5 hours) and sweeping only (up to 12
              hours). Quick battery replacement enables continuous operations. The C20 is the lightest option at 22 kg,
              targeting smaller hospitality or office environments with 400 m²/h efficiency and a 7-litre water tank.

              Key open questions for the KLEENBOT line include real-world versus theoretical cleaning efficiency under
              operational conditions (dusty environments, varied floor textures), actual battery runtime in continuous
              scrubbing mode versus test conditions, and whether the triple-roller claim has been independently
              validated by third-party cleaning industry standards bodies such as ISSA or EN standards testing.
            claimRefs:
              - CE022
              - CE023
              - CE024
              - CE025
              - CE026
      - number: '5.5'
        title: Trust, Safety, Privacy, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Keenon's safety architecture relies on layered hardware and software controls. Obstacle avoidance uses
              multi-sensor fusion (LiDAR, stereo vision, RGB camera), anti-collision body strips, and per-robot
              emergency stop buttons. The S100 and S300 both specify three emergency stop buttons. The S300's safety
              stack — 3D vision plus dual LiDAR plus VSLAM plus triple emergency stops — is the most comprehensive in
              the current product line. These are hardware and software controls; no published third-party safety
              certification (such as IEC 61508 functional safety, UL listing, or CE marking with specific machinery
              directive compliance) has been disclosed by Keenon in any English-language public document as of May 2026.

              Keenon's English-language Privacy Policy permits collection of device information, usage data, and
              personal information submitted through its website and product interactions. The policy explicitly allows
              cross-border data transfer to any country where Keenon or its service providers operate, with the caveat
              that "data protection rules in these countries may differ from those in your country." Data may be shared
              with affiliates and subsidiaries globally, service providers, business partners engaged in joint marketing
              or co-branded services, and third-party partners for advertising customisation. The policy acknowledges
              that "no security measures are foolproof" and that data transmission cannot be guaranteed against
              interception.

              No ISO 27001 (information security management), SOC 2 (service organisation controls), or equivalent
              cybersecurity certification is publicly disclosed for Keenon's products or cloud infrastructure. For
              enterprise buyers in Western healthcare, government, and critical infrastructure procurement processes,
              the combination of Chinese corporate domicile, broad cross-border data-sharing rights, and absence of
              third-party security certification constitutes a material procurement barrier. Adverse procurement
              dynamics have been documented for Chinese-origin hardware in EU and US public-sector contexts by analyst
              coverage of the broader service robotics market. No specific Keenon security incidents have been publicly
              reported, but the structural trust gap is verifiable from public documentation.
            claimRefs:
              - CE027
              - CE028
              - CE029
              - CE030
              - CE031
          - type: table
            tableRef: TE004
            claimRefs:
              - CE027
              - CE028
              - CE029
              - CE030
              - CE031
      - number: '5.6'
        title: Differentiation, Roadmap, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Keenon's core differentiation rests on four elements: thirteen-plus years of commercial deployment
              experience in the same indoor service verticals, 50-plus patents covering navigation, chassis, sensing,
              and AI algorithms, a broad multi-line portfolio that enables cross-selling within a single enterprise
              customer relationship, and an IoT-elevator integration capability that most pure-play food delivery robot
              companies do not offer. The YY Group MOU (August 2025) and SEC filing confirm active commercial deployment
              in Singapore and Malaysia under both ownership and RaaS models, providing independent third-party
              corroboration of commercial activity outside China as of mid-2025.

              The XMAN humanoid series (R1 and F1) represents Keenon's declared ambition in embodied AI, but carries
              significant execution risk. As of May 2026, no technical specifications — degree of freedom, payload,
              manipulation capability, locomotion type, or battery life — have been published in any English-language
              source. No independently confirmed commercial deployment exists. IFR's 2026 assessment of the global
              humanoid market confirms that "actual capabilities in real-world production scenarios are currently
              limited to demonstrators or pilot projects" across the industry, a constraint that applies directly to
              Keenon's XMAN line. Investors should treat the XMAN programme as pre-commercial with no near-term revenue
              contribution.

              Several technical risk factors require diligence. Battery life claims across the product line (T9: up to
              18 hours; T3: up to 12 hours; S300: up to 6 hours full-load; C40: up to 12 hours sweeping / 5 hours
              scrubbing) all use "up to" language with asterisks referencing test conditions. Real-world runtimes in
              high-use commercial deployments typically fall 10–30% below manufacturer test specifications. The S300's
              claim of one-day deployment (versus the traditional three-to-six months for competitor systems) is
              compelling but has not been independently verified by a published third-party evaluation. Elevator IoT
              integration is site-dependent and requires per-building integration work with elevator vendors, which may
              affect scalability in older building stock. The absence of published reliability or
              mean-time-between-failure (MTBF) data for any product line is a diligence gap that prevents assessment of
              total cost of ownership in enterprise procurement.
            claimRefs:
