            exit elevators. PMS integration for hotel front-desk dispatch. Compartment door automation (W3).
            Site-specific elevator protocol compatibility required per building.
        - label: Customer Application and Fleet UI
          detail: >-
            KOM 2.0 web/mobile fleet dashboard: task creation, robot status, deployment maps, and analytics. Robot-side
            UI: touchscreen (10.1–23.8 inch depending on model), voice prompts, tray LED guidance. Customisation options
            on T10: head accessories, expressions, skins.
