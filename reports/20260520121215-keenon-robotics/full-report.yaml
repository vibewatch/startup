              - CV037
              - CV039
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Track'
            body: >
              Keenon Robotics is the global commercial service robot leader with legitimate unicorn credentials
              confirmed by IDC and supported by blue-chip investors and enterprise partners. However, four-plus years of
              valuation opacity, the absence of audited financials, hardware margin risk, and a China-specific
              geopolitical discount prevent a buy rating at the $2B Series C anchor. A track posture is warranted, with
              a potential upgrade to buy contingent on receipt of audited FY2025 financials, confirmation of the Series
              D round terms, and evidence of improving gross margin.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV010
              - CV040
          - type: callout
            title: 'Primary Risk: Valuation Overhang and Disclosure Gap'
            body: >
              The $2 billion 2022 valuation was set at peak private-market multiples in an environment of near-zero
              interest rates. Without public financials, fleet utilization data, or a recent arm's-length round, there
              is no objective basis to confirm whether the mark holds, has been maintained, or has been written down.
              Hardware margin opacity—compounded by no public competitive analysis of per-unit profitability—is the
              single largest diligence blocker.
            calloutType: risk
            claimRefs:
              - CV005
              - CV009
              - CV014
              - CV033
              - CV036
          - type: callout
            title: 'Key Signal: IDC Triple No. 1 and Enterprise Momentum Through 2025'
            body: >
              Keenon's IDC Triple No. 1 rankings and 2024–2025 enterprise partnership announcements (KT Group,
              Shangri-La Hotels) provide credible third-party evidence that market leadership was maintained four-plus
              years beyond the Series C. The 60-country deployment base provides a scale advantage that smaller peers
              such as Bear Robotics cannot replicate quickly.
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV032
