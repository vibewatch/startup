  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Lines and Use Cases
        blocks:
          - type: paragraph
            body: >-
              Keenon Robotics structures its commercial product portfolio into five distinct lines, each addressing a
              specific customer workflow. The DINERBOT line targets restaurant and catering operators who need to
              replace or augment front-of-house servers for food and beverage delivery between kitchen and dining
              tables. The T8 is the compact option — minimum 55 cm passage width, 3 stereo vision sensors — designed for
              tightly configured dining spaces. The T9 expands capacity to 40 kg across four adjustable trays with up to
              18-hour battery life and a vehicle-grade independent suspension chassis protected by trio chassis patents.
              The T10 is the flagship engagement model, adding a movable head, 23.8-inch touchscreen, AI tray detection,
              and VSLAM-plus-4-stereo-camera sensing. The T11 offers 20 kg capacity with a 13.5-hour battery and 49 cm
              minimum passage, occupying the mid-tier slot.

              The BUTLERBOT line is designed for multi-storey hotel environments where robots must use building
              elevators for floor-to-floor delivery of amenities, laundry, and food. The W3 integrates with elevator IoT
              systems, uses automatic compartment doors for contactless and hygienic service, and serves up to four
              destinations per dispatch across independently accessible compartments. The T3 is a larger hotel courier
              robot carrying up to 40 kg across 42.2 × 57.5 cm layer trays with a 12-hour battery and patented
              multi-robot dispatching.

              The KLEENBOT line covers commercial floor cleaning in hospitality, retail, and facilities management. The
              C20 is the lightest model (22 kg) suited to smaller commercial spaces, achieving up to 400 m²/h cleaning
              efficiency. The C40 scales to 1,100 m²/h with battery swap support for 24/7 operation. The C55, the
              flagship cleaner, uses an industry-first triple-roller design to sweep and scrub in a single pass,
              achieving 2,376 m²/h theoretical efficiency with a 60-litre clean water tank that requires fewer daily
              refills.

              The S-series targets heavy-load logistics in manufacturing, healthcare logistics, and industrial settings.
              The S100 offers 100 kg-plus capacity with plug-and-play deployment, three charging options (charging pile,
              adapter, and 15-second battery swap), and 360° obstacle avoidance. The S300 carries 300 kg on a shelfless
              platform with an industry-low 23 cm chassis, supporting any shelf up to 120 × 120 cm, and deploys in as
              little as one day using VSLAM without magnetic tape or QR code installation. The XMAN humanoid line,
              consisting of the R1 and F1 models, was introduced alongside the KLEENBOT C40/C55/C20 refresh in 2024 but
              has not had technical specifications or deployment data published as of May 2026.
            claimRefs:
