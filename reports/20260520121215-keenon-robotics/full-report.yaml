      - number: '3.6'
        title: Moat Durability and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Keenon's primary competitive moats are scale (claimed market leadership by IDC in 2025), product breadth
              (widest portfolio of any single peer), and ecosystem depth (KT Group, Shangri-La, Vision Fund backing).
              Each moat carries meaningful durability risk.

              Scale moat is eroding: OrionStar's 60,000-plus deployment claim, if accurate, is already within one order
              of magnitude of Keenon's unverified 100,000-plus figure. Pudu and other Chinese vendors are growing in the
              same geographies. The IFR's May 2026 report on China's 15th Five-Year Plan indicates that state-directed
              investment in embodied AI and robotics will intensify domestic Chinese competition and lower manufacturing
              costs industry-wide, accelerating the commoditization of the core navigation stack. Multiple Chinese robot
              hardware makers now use similar LiDAR SLAM components, reducing the technical differentiation between
              units.

              Bear Robotics and LG Electronics are the most credible Western-market threat: LG's global commercial sales
              infrastructure, combined with Bear's engineering roadmap (cleaning, warehouse, multi-product), represents
              a Western competitor capable of matching Keenon on breadth over a three-to-five year horizon. For US
              hospital and government procurement specifically, Bear's domestic origin and Aethon's long-standing track
              record constitute preferential buying criteria that no Chinese vendor can replicate without structural
              changes.

              Fleet management software provides moderate switching costs: operators who have mapped their facilities,
              trained staff on a vendor's fleet control suite, and integrated the robots with PMS and elevator systems
              face a two-to-three month re-deployment effort to switch vendors. This is meaningful friction but not
              decisive for a cost-motivated operator. SaaS or RaaS contract structures can further reduce switching
              costs by enabling vendor substitution at contract end rather than at a capital-write-off event.

              Adverse competitive evidence: pricing pressure is evident from the market structure — multiple Chinese
              vendors competing in the same geographies with similar hardware at comparable price points will compress
              gross margins over time. The 2021 catering robot market grew 110% in China, but repeat-order data and
              churn rates across all vendors are absent from public sources, creating an unknown on retention
              durability. Hardware commoditization is the most severe structural risk; Keenon's KOM 2.0 VLA model and
              humanoid expansion are strategic responses to this risk, but their commercial validation remains
              early-stage as of May 2026.
