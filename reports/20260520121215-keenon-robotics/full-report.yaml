      - number: '7.3'
        title: Partner, Dependency, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              KEENON's institutional investor base is dominated by a single disclosed participant: SoftBank Vision Fund
              2, which led the USD 200 million Series D in September 2021. SoftBank Group's own financial history
              includes significant write-downs on Vision Fund 2 portfolio companies, and the company has publicly
              pivoted toward AI-infrastructure investments in its most recent strategic communications. An investor
              holding a large position in KEENON who faces portfolio-level performance pressure may not provide
              consistent follow-on capital support or may seek an exit on unfavourable terms for minority shareholders.
              No other institutional investors are publicly identified in KEENON's Series D.

              Customer concentration is high across both reference customers and distribution partners. Haidilao — the
              world's largest hotpot chain — is KEENON's most frequently cited reference customer and likely a material
              revenue contributor in the restaurant vertical. Loss of the Haidilao relationship would significantly
              weaken KEENON's reference narrative for prospective restaurant customers globally. The YY Group (NASDAQ:
              YYGH) Memorandum of Understanding, confirmed by two SEC 6-K filings (August 2025 and March 2026), uses
              consistently non-binding language: "plans to," "intends to," and "as we prepare for deployment." Under SEC
              safe-harbour provisions, no revenue obligation is attached to the MOU, and no binding purchase orders or
              service agreements have been disclosed. The KT Group partnership (September 2024, confirmed by AP News)
              has similarly undisclosed commercial terms — no minimum purchase commitments, exclusivity arrangements, or
              deployment milestones are available from public sources.

              KEENON's international distribution model relies on third-party partners such as YY Group and KT Group
              rather than direct sales forces. These intermediaries may carry competing robot brands, have different
              incentive structures than KEENON, and control the renewal relationship with end customers. If either
              partner terminates or reduces its KEENON commitment, the corresponding geographic market becomes
              effectively unserved from KEENON's perspective. The SCMP reported in 2024 that Chinese service robot
              companies face overseas market friction including cultural resistance, import complexity, and limited
              local maintenance networks — risks that are amplified when distribution is partner-dependent.
