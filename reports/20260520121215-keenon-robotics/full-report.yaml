  - id: FE002
    title: Keenon Delivery Robot Customer Workflow — Catering Use Case
    type: flow
    layout: wide
    summary: >-
      End-to-end flow of how a restaurant uses a DINERBOT for table delivery, from order placement at the kitchen
      through robot dispatch, navigation, delivery, and return to base for recharging. Illustrates the touchpoints where
      the robot replaces or supplements human labour and the integration dependencies.
    data:
      nodes:
        - id: N01
          label: Kitchen staff places order on dispatch terminal or POS
          detail: >-
            Staff selects destination table and places dishes on robot trays; may integrate with existing POS via KOM
            2.0 API
        - id: N02
          label: KOM 2.0 dispatches nearest available robot
          detail: >-
            Fleet manager selects optimal robot from idle pool based on proximity, battery state, and current task
            queue; multi-robot dispatching avoids corridor conflicts
        - id: N03
          label: Robot navigates autonomously via LiDAR SLAM
          detail: >-
            Robot follows pre-mapped route to destination table; dynamically avoids obstacles (staff, diners, furniture)
            using stereo vision; replans route in real time if blocked
        - id: N04
          label: Robot arrives at table; notifies diner via screen, light, and voice
          detail: >-
            Tray LEDs illuminate target trays; 10.1–23.8 inch touchscreen shows guidance; voice prompt instructs diner
            to retrieve dishes; AI tray detection (T10) confirms pickup
        - id: N05
          label: Diner retrieves dishes; robot confirms via tray sensor
          detail: >-
            Weight sensor or AI tray detection confirms tray empty; robot waits for confirmation timeout if tray still
            loaded; logs delivery event to KOM 2.0
        - id: N06
          label: Robot returns to kitchen base or auto-docks for charging
          detail: >-
            If battery above threshold, returns to kitchen for next dispatch; if below threshold, autonomously navigates
            to charging dock; fleet manager updates availability status
      edges:
        - from: N01
          to: N02
          label: order dispatch signal
        - from: N02
          to: N03
          label: route assignment
        - from: N03
          to: N04
          label: table arrival
        - from: N04
          to: N05
          label: diner pickup
        - from: N05
          to: N06
          label: task complete
