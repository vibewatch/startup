companyProfile:
  summary: >-
    KEENON Robotics (上海擎朗智能科技有限公司) is a Shanghai-headquartered autonomous service robotics
    company founded in 2010 by Li Tongzhi (Tony Li). It is the global market leader in commercial
    indoor service robots, holding IDC Triple No.1 rankings across global shipments, global market
    share, and China market share as of 2025. Its product portfolio spans DINERBOT (catering
    delivery), BUTLERBOT (hotel service), KLEENBOT (commercial cleaning), and the newly launched
    XMAN humanoid robot series, underpinned by the KOM 2.0 Vision-Language-Action AI platform.
    KEENON has deployed 70,000+ robots across 60+ countries, with anchor customers including
    Haidilao, KT Group (South Korea), Shangri-La Hotels, and YY Group (Southeast Asia). Its
    largest disclosed funding round is a $200M Series D led by SoftBank Vision Fund 2 in
    September 2021, implying a ~$2B post-money valuation. No revenue or financial metrics have
    been publicly disclosed.
  foundedDate: "2010-01-01"
  founders:
    - name: "Li Tongzhi (Tony Li)"
      role: "Founder & CEO"
      background: "Founded KEENON Robotics in 2010 in Shanghai; remains sole disclosed executive; appeared at World Economic Forum Dalian 2024 as CEO and Founder."
      claimRefs: [CO009, CO010, CO011]
  foundingLocation: "Shanghai, China"
  headquarters: "Building 56, No.1000 Jinhai Road, Shanghai 200120, China"
  productSummary: >-
    Autonomous indoor service robots: DINERBOT (food delivery, T-series), BUTLERBOT (hotel
    in-room service, W-series), KLEENBOT (commercial floor cleaning, C-series), and XMAN
    (bipedal humanoid, R1/F1). Fleet managed via KOM 2.0 Vision-Language-Action AI platform.
    Sold via hardware purchase and Robotics-as-a-Service (RaaS) subscription models.
  customerFocus: >-
    Mid-to-large restaurant chains, hotel groups, hospital procurement offices, and commercial
    facilities managers across China (primary), East Asia, Southeast Asia, and 60+ countries globally.
  businessModel: >-
    Hardware sales of autonomous mobile robots (capital purchase) supplemented by a Robotics-as-a-Service
    (RaaS) subscription model (recurring monthly fee per robot); partner-channel distribution
    through hospitality and facilities management groups; potential SaaS layer via KOM 2.0 fleet
    management platform (pricing undisclosed).
  stage: "Late-stage private; Series D (no subsequent public round disclosed through May 2026)"
  fundingStatus: >-
    Series D: $200M USD, September 2021, led by SoftBank Vision Fund 2, co-invested by CICC
    ALPHA and Prosperity7 Ventures (Saudi Aramco). Prior: Series C (several hundred million
    CNY, December 2020, SoftBank Ventures Asia + Alibaba Group). Total disclosed raised ~$244M.
    No subsequent public round or IPO filing as of May 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO009, CO014, CO015, CO016, CO017, CO018, CO022, CO031, CO036]

summary:
  headline: >-
    KEENON is the uncontested global leader in commercial service robotics with 70,000+ deployed
    robots and IDC Triple No.1 rankings, but a four-year funding silence, complete financial
    opacity, and compounding geopolitical risk constrain conviction to a track/research-more
    stance at the implied $2B valuation.
  overallScore: 5.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: unknown
  keyMetrics:
    valuationUsdM: 2000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 244
    customerCount: null
    headcount: 3000
  topStrengths:
    - "IDC Triple No.1 global commercial service robot rankings (shipments, global share, China share) as of 2025; 15-year first-mover franchise dating to the 2016 world-first autonomous delivery robot launch."
    - "70,000+ robots deployed across 60+ countries with anchor enterprise relationships: Haidilao (world's largest hotpot chain), KT Group (South Korea telecom), and Shangri-La Hotels."
    - "Dual hardware-sale and RaaS subscription model confirmed by SEC filings (YY Group 6-K), providing recurring revenue optionality as the installed base scales."
    - "KOM 2.0 VLA foundation model and XMAN humanoid launch position KEENON at the intersection of service robotics and embodied AI, expanding the addressable market and supporting a premium narrative."
    - "Blue-chip institutional backing via SoftBank Vision Fund 2 and Prosperity7 Ventures; China's 15th Five-Year Plan (2026–2030) explicitly designates robotics as a strategic national priority, creating government tailwinds."
  topRisks:
    - "Complete financial opacity: no revenue, gross margin, EBITDA, burn rate, or capital adequacy data is publicly disclosed; investment thesis cannot be stress-tested without access to audited financials."
    - "Four-year funding silence (no public round since September 2021) creates deep uncertainty about current fair-market value; the $2B anchor predates significant growth-multiple compression."
    - "Geopolitical and regulatory exposure: US Section 301 tariffs (25%+) on Chinese-origin hardware, NDAA expansion risk, PIPL/DSL data-sovereignty compliance gaps, and a commonly estimated 20–30% Western-investor discount on Chinese private tech."
    - "Single-founder key-person concentration (Li Tongzhi holds sole disclosed executive authority at 1,000–5,000-person multi-continental company; no board governance or succession plan disclosed)."
    - "Customer concentration: Haidilao anchor dependency, YY Group MOU non-binding (no closed revenue confirmed), KT Group commercial terms undisclosed; churn risk undocumented without NRR data."
    - "XMAN humanoid distraction risk: entering the crowded humanoid segment may dilute R&D focus and capital from the profitable core service-robot business."
  unresolvedGaps:
    - "Audited financial statements (revenue, gross margin, EBITDA, cash position, burn rate) — not publicly available for any period."
    - "Current fair-market valuation: no round since September 2021; SoftBank Vision Fund 2 NAV mark for KEENON position is unknown."
    - "YY Group MOU conversion to binding contract and closed revenue — MOU signed August 2025, non-binding language throughout."
    - "NRR, GRR, and churn data across all customer verticals — not disclosed."
    - "PIPL/DSL compliance certifications and cross-border data transfer filings — not confirmed in public materials."
    - "XMAN humanoid commercial revenue contribution and margin profile — not disclosed."
    - "IPO timeline, target exchange, and listing valuation range — no public filing or confirmation as of May 2026."

