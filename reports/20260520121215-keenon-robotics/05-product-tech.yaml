company:
  name: Keenon Robotics

chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Keenon Robotics offers five commercially deployed product lines covering restaurant and hotel
    delivery, commercial floor cleaning, heavy-load logistics, and a nascent humanoid series. The
    DINERBOT family (T8, T9, T10, T11) dominates in catering with up to 40 kg payload and 13–18-hour
    battery life. The BUTLERBOT line (W3, T3) adds IoT elevator integration for multi-floor hotel
    delivery. KLEENBOT (C20, C40, C55) covers small-to-large commercial cleaning with the flagship
    C55 claiming an industry-first triple-roller design and 2,376 m²/h theoretical efficiency. The
    S-series (S100, S300) targets heavy warehouse and industrial logistics with up to 300 kg capacity
    and offline VSLAM-based path planning that cuts deployment from months to one day. The XMAN
    humanoid line (R1, F1) was introduced in 2024/2025 alongside the KLEENBOT refresh but carries
    no published capability specifications, no confirmed deployment data, and must be treated as a
    pre-commercial programme. Core navigation relies on LiDAR SLAM across all product lines,
    augmented by stereo vision and, in higher-end models, VSLAM. Multi-robot coordination and
    elevator IoT integration are differentiated but dependent on third-party building-management
    infrastructure. Privacy disclosures allow broad cross-border data transfers with limited data
    localisation commitments, and no third-party security or functional-safety certifications are
    publicly disclosed, creating procurement friction in Western regulated industries. Battery-life
    claims use "up to" language with conditions undisclosed, and independent verification of the S300
    1-day deployment claim is absent from public sources.

sections:
  - id: SE-section-products
    title: Product Lines and Use Cases
    body: >-
      Keenon Robotics structures its commercial product portfolio into five distinct lines, each
      addressing a specific customer workflow. The DINERBOT line targets restaurant and catering
      operators who need to replace or augment front-of-house servers for food and beverage delivery
      between kitchen and dining tables. The T8 is the compact option — minimum 55 cm passage width,
      3 stereo vision sensors — designed for tightly configured dining spaces. The T9 expands capacity
      to 40 kg across four adjustable trays with up to 18-hour battery life and a vehicle-grade
      independent suspension chassis protected by trio chassis patents. The T10 is the flagship
      engagement model, adding a movable head, 23.8-inch touchscreen, AI tray detection, and
      VSLAM-plus-4-stereo-camera sensing. The T11 offers 20 kg capacity with a 13.5-hour battery
      and 49 cm minimum passage, occupying the mid-tier slot.

      The BUTLERBOT line is designed for multi-storey hotel environments where robots must use
      building elevators for floor-to-floor delivery of amenities, laundry, and food. The W3
      integrates with elevator IoT systems, uses automatic compartment doors for contactless and
      hygienic service, and serves up to four destinations per dispatch across independently
      accessible compartments. The T3 is a larger hotel courier robot carrying up to 40 kg across
      42.2 × 57.5 cm layer trays with a 12-hour battery and patented multi-robot dispatching.

      The KLEENBOT line covers commercial floor cleaning in hospitality, retail, and facilities
      management. The C20 is the lightest model (22 kg) suited to smaller commercial spaces,
      achieving up to 400 m²/h cleaning efficiency. The C40 scales to 1,100 m²/h with battery
      swap support for 24/7 operation. The C55, the flagship cleaner, uses an industry-first
      triple-roller design to sweep and scrub in a single pass, achieving 2,376 m²/h theoretical
      efficiency with a 60-litre clean water tank that requires fewer daily refills.

      The S-series targets heavy-load logistics in manufacturing, healthcare logistics, and
      industrial settings. The S100 offers 100 kg-plus capacity with plug-and-play deployment,
      three charging options (charging pile, adapter, and 15-second battery swap), and 360°
      obstacle avoidance. The S300 carries 300 kg on a shelfless platform with an industry-low
      23 cm chassis, supporting any shelf up to 120 × 120 cm, and deploys in as little as one day
      using VSLAM without magnetic tape or QR code installation. The XMAN humanoid line, consisting
      of the R1 and F1 models, was introduced alongside the KLEENBOT C40/C55/C20 refresh in 2024
      but has not had technical specifications or deployment data published as of May 2026.
