callouts:
  - calloutType: risk
    title: XMAN Humanoid Line Has No Published Specifications or Commercial Deployments
    body: >-
      The XMAN-R1 and XMAN-F1 humanoid robots were announced alongside the KLEENBOT refresh in
      2024 but carry zero published technical specifications, no confirmed pilot or production
      deployments, and no independently sourced capability claims as of May 2026. IFR's 2026
      assessment of the humanoid market states that real-world production capability is still
      limited to demonstrators or pilots across the industry. Investors should assign no near-term
      revenue contribution to XMAN and treat it as a strategic option with high execution risk.
    claimRefs:
      - CE033
      - CE036

  - calloutType: risk
    title: Privacy Policy Allows Broad Cross-Border Data Transfers Without Data Localisation
    body: >-
      Keenon's published privacy policy permits transfer of personal and device data to any country
      where Keenon or its service providers operate, sharing with affiliates, subsidiaries, service
      providers, business partners, and third-party advertising partners. No data localisation
      guarantees, GDPR processor agreement templates, or EU-US data transfer mechanism disclosures
      (e.g., Standard Contractual Clauses) are published. Combined with the absence of ISO 27001
      or SOC 2 certification, this creates a structural procurement barrier in Western regulated
      industries and should be treated as a material diligence item for healthcare, government,
      and financial services buyers.
    claimRefs:
      - CE029
      - CE030
      - CE031

