  - id: SE-section-navigation
    title: Navigation and Sensing Architecture
    body: >-
      All current Keenon delivery and heavy-load robots use LiDAR SLAM (simultaneous localisation
      and mapping) as the primary navigation substrate. The robot builds a spatial map of the
      deployment environment during an initial mapping run, then navigates autonomously by
      continuously correlating real-time LiDAR point-cloud data with the stored map. This approach
      eliminates the need for environmental modifications such as magnetic floor tape or QR code
      grids, which traditional AMR systems required and which added installation cost and rigidity.

      Higher-end models augment LiDAR SLAM with visual SLAM (VSLAM), which fuses camera-based
      visual feature tracking with inertial or odometry data to maintain position under lighting
      changes or partial LiDAR occlusion. The T10 and S300 both deploy VSLAM explicitly. The S300
      combines LiDAR SLAM, stereo vision fusion, and VSLAM in a three-mode stack that supports
      autonomous route replanning in milliseconds when obstacles are detected.

      Obstacle detection uses layered sensing. The T8 uses three stereo vision sensors capable of
      detecting common tall obstacles and those under 5 cm, addressing a common failure mode of
      flat-object detection. The T10 deploys four stereo vision sensors plus one RGB camera for
      360-degree recognition. The S300 adds dual LiDAR to stereo vision and VSLAM for its heaviest
      payload class. Anti-collision strips on the robot body provide a physical backup layer. Triple
      emergency stop buttons on the S100 and S300 allow human intervention.

      Route planning uses patented AI algorithms for multi-robot dispatching and dynamic route
      optimisation, enabling a single fleet manager instance to coordinate multiple robots without
      collision. The T9 chassis design, developed using CAE (computer-aided engineering) simulation,
      is covered by trio chassis patents addressing independent suspension and shock absorption,
      which improves traversal over uneven surfaces such as thresholds and slope transitions up
      to 5 degrees. Keenon's product profile notes 50-plus patents as of 2023 across navigation,
      chassis design, sensing, and AI algorithms, though an independently verifiable patent count
      as of 2026 is not available from public sources.
