  - id: TE002
    title: Workflow / Use-Case Table
    description: >-
      How Keenon's products address specific customer jobs-to-be-done, with the workflow replaced,
      the robot's role, measurable benefit claimed, and known limitations.
    columns:
      - User Job / Scenario
      - Current Workflow
      - Keenon Solution
      - Measurable Benefit (claimed or inferred)
      - Limitation
    rows:
      - - Restaurant food delivery (kitchen to table)
        - Server carries dishes from kitchen pass to table; labour-intensive, prone to delays and errors
        - DINERBOT T8/T9/T10/T11 navigates autonomously; notifies customer via screen/voice
        - Labour hour savings per shift; reduced table wait time; server freed for upselling
        - Cannot handle spills, open-tray fragile items, or table layout changes autonomously
      - - Hotel in-room and amenity delivery (multi-floor)
        - Concierge or bellhop delivers amenities, laundry, food between floors via elevator
        - BUTLERBOT W3 (elevator IoT) or T3 delivers contactlessly; auto-dispatched from front desk PMS
        - Labour substitution for low-complexity hotel errands; contactless service (hygiene benefit)
        - Requires per-building elevator IoT integration; high-variance building compatibility
      - - Heavy-load warehouse / logistics (floor transport)
        - Forklift operator or picker manually transports heavy shelf loads across facility floor
        - S300 (300 kg) or S100 (100 kg+) autonomously transports shelves; offline capable
        - Reduced manual handling injuries; 24/7 operation capability; faster throughput
        - Does not lift or stack; purely horizontal transport; operator must load/unload shelf
      - - Commercial floor cleaning (large-venue daily operations)
        - Manual cleaning crew with ride-on scrubbers; multi-pass operation; high water usage
        - KLEENBOT C55 (triple-roller single-pass) or C40/C20 for smaller spaces
        - Labour reduction per square metre cleaned; reduced water per clean cycle (C55 60 L tank)
        - Theoretical efficiency 2,376 m²/h unverified under real-world conditions; requires mapping run
      - - Hospital / healthcare logistics (medical supply delivery)
        - Orderly or technician delivers linens, medications, specimens between wards and dispensaries
        - S100 or T3 used in medical context per 36Kr report (2021); product pages confirm hospital use
        - Reduced orderly time on logistics; contactless delivery with W3 door compartments
        - No dedicated medical certification disclosed; regulatory approval status for CE/FDA unknown
    claimRefs:
