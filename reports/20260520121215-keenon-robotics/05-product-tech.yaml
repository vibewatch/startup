figures:
  - id: FE001
    title: Keenon Product Architecture Map — Technology Layers
    type: stack
    layout: standard
    summary: >-
      Technology stack from physical hardware through navigation, AI, fleet management, and
      customer integration for Keenon's delivery and cleaning robot families. The XMAN humanoid
      is shown as a separate nascent platform at the top of the stack with no confirmed
      production-ready layer above hardware.
    data:
      layers:
        - label: "Hardware Platform"
          detail: >-
            Chassis, actuators, battery, charging systems, and body sensors. DINERBOT: 38–71 kg chassis;
            KLEENBOT C55: 150 kg; S300: 300 kg-rated shelfless structure with 23 cm industry-low chassis.
            Chassis patents cover CAE-simulation suspension (T9). Battery options: auto-dock, manual
            adapter, 15-second quick swap (S100, S300, C40, C55).
        - label: "Perception and Sensing"
          detail: >-
            LiDAR (primary distance sensing and SLAM mapping), stereo vision cameras (1–4 per robot
            depending on model for 3D obstacle detection), RGB camera (T10, higher models), and
            anti-collision body strips. T8 detects obstacles under 5 cm. S300 uses dual LiDAR +
            stereo vision + VSLAM for maximum redundancy.
        - label: "Navigation and Mapping (SLAM / VSLAM)"
          detail: >-
            LiDAR SLAM: builds persistent spatial map; handles dynamic re-routing. VSLAM (T10, S300):
            camera-based visual feature tracking supplements LiDAR under partial occlusion. S300 offline
            mode: on-device path planning without network connectivity. Deployment mapping: VSLAM
            eliminates magnetic tape/QR codes; S300 claims 1-day site setup vs traditional 3–6 months.
        - label: "AI Route Planning and Multi-Robot Dispatch"
          detail: >-
            Patented AI algorithms for route optimisation across simultaneously active robots. KOM 2.0
            AI platform: fleet-wide task allocation, dispatching priority, deadlock avoidance, and
            real-time route adaptation. Operates as on-premise or cloud-hosted fleet manager.
            Multi-robot dispatching supported on T3, T9, T10, and S-series.
        - label: "Integration and IoT Layer"
          detail: >-
            Elevator IoT integration (W3 BUTLERBOT): communicates with building BMS to autonomously
            request, ride, and exit elevators. PMS integration for hotel front-desk dispatch.
            Compartment door automation (W3). Site-specific elevator protocol compatibility required
            per building.
        - label: "Customer Application and Fleet UI"
          detail: >-
            KOM 2.0 web/mobile fleet dashboard: task creation, robot status, deployment maps, and
            analytics. Robot-side UI: touchscreen (10.1–23.8 inch depending on model), voice prompts,
            tray LED guidance. Customisation options on T10: head accessories, expressions, skins.
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE017

  - id: FE002
    title: Keenon Delivery Robot Customer Workflow — Catering Use Case
    type: flow
    layout: wide
    summary: >-
      End-to-end flow of how a restaurant uses a DINERBOT for table delivery, from order placement
      at the kitchen through robot dispatch, navigation, delivery, and return to base for recharging.
      Illustrates the touchpoints where the robot replaces or supplements human labour and the
      integration dependencies.
    data:
      nodes:
        - id: N01
          label: "Kitchen staff places order on dispatch terminal or POS"
          detail: "Staff selects destination table and places dishes on robot trays; may integrate with existing POS via KOM 2.0 API"
        - id: N02
          label: "KOM 2.0 dispatches nearest available robot"
          detail: "Fleet manager selects optimal robot from idle pool based on proximity, battery state, and current task queue; multi-robot dispatching avoids corridor conflicts"
        - id: N03
          label: "Robot navigates autonomously via LiDAR SLAM"
          detail: "Robot follows pre-mapped route to destination table; dynamically avoids obstacles (staff, diners, furniture) using stereo vision; replans route in real time if blocked"
        - id: N04
          label: "Robot arrives at table; notifies diner via screen, light, and voice"
          detail: "Tray LEDs illuminate target trays; 10.1–23.8 inch touchscreen shows guidance; voice prompt instructs diner to retrieve dishes; AI tray detection (T10) confirms pickup"
        - id: N05
          label: "Diner retrieves dishes; robot confirms via tray sensor"
          detail: "Weight sensor or AI tray detection confirms tray empty; robot waits for confirmation timeout if tray still loaded; logs delivery event to KOM 2.0"
        - id: N06
          label: "Robot returns to kitchen base or auto-docks for charging"
          detail: "If battery above threshold, returns to kitchen for next dispatch; if below threshold, autonomously navigates to charging dock; fleet manager updates availability status"
      edges:
        - from: N01
          to: N02
          label: "order dispatch signal"
        - from: N02
          to: N03
          label: "route assignment"
        - from: N03
          to: N04
          label: "table arrival"
        - from: N04
          to: N05
          label: "diner pickup"
        - from: N05
          to: N06
          label: "task complete"
    claimRefs:
      - CE009
      - CE017
      - CE019

  - id: FE003
    title: Critical Dependency Map — Keenon Product and Technology
    type: dag
    layout: wide
    summary: >-
      Key external dependencies that could disrupt Keenon's product delivery, navigation reliability,
      integration capability, or market access. Each node represents a dependency category; edges
      show which Keenon product or capability relies on that dependency.
    data:
      nodes:
        - id: D01
          label: "Chinese LiDAR / Sensor Supply Chain"
          detail: "Primary LiDAR sensor suppliers are China-domiciled (Livox, RoboSense, Slamtec). Export controls, component shortages, or tariff changes affect all navigation-dependent products."
        - id: D02
          label: "Proprietary SLAM / VSLAM Algorithm Core"
          detail: "Keenon's navigation is built on internally developed SLAM and VSLAM algorithms covered by 50+ patents. Algorithm accuracy, map drift, and edge-case handling in novel environments are key technical risks."
        - id: D03
          label: "Building Elevator IoT Infrastructure"
          detail: "W3 elevator integration requires compatible BMS/elevator controller APIs per building. Older buildings, proprietary elevator controllers, and non-standard protocols create per-site integration risk."
        - id: D04
          label: "Network / Cloud Connectivity (KOM 2.0)"
          detail: "Multi-robot dispatch and fleet analytics depend on KOM 2.0 connectivity. S300 is the only model with confirmed offline operation; all others depend on site Wi-Fi or 5G."
        - id: D05
          label: "Battery Cell and Charging Hardware Suppliers"
          detail: "Battery cells (DC 24V–25.6V packs), charging pile hardware, and quick-swap battery logistics for 24/7 models (S100, S300, C40, C55) require reliable supplier relationships."
        - id: D06
          label: "Enterprise Customer Site Mapping and Onboarding"
          detail: "All SLAM-based models require initial site mapping run before autonomous operation. Accuracy of initial map, change management for layout updates, and technician availability are deployment bottlenecks."
      edges:
        - from: D01
          to: D02
          label: "LiDAR data feeds SLAM engine"
        - from: D02
          to: D03
          label: "SLAM-navigated robot requires elevator access"
        - from: D02
          to: D04
          label: "route plans sync to fleet manager"
        - from: D04
          to: D03
          label: "elevator control commands sent via network"
        - from: D05
          to: D02
          label: "battery state constrains robot availability"
        - from: D06
          to: D02
          label: "site map quality determines navigation accuracy"
        - from: D01
          to: D05
          label: "supply disruption co-occurs with battery supply"
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE018
      - CE021

