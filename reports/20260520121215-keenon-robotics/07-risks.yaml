        - Ongoing structural risk
        - Low — KEENON has 50+ patents; no active IP litigation identified
        - Low — loss of design exclusivity if core navigation IP is copied
        - 50+ patents cited by company; no third-party IP audit or litigation status disclosed
        - Low — core SLAM navigation is broadly patented territory
