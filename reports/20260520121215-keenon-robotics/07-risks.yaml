callouts:
  - id: CR-CALL-01
    calloutType: risk
    title: Financial Opacity Makes Capital Adequacy Entirely Unverifiable
    body: >-
      No revenue, gross margin, EBITDA, cash balance, or burn rate has been publicly
      disclosed by KEENON as of May 2026. The last confirmed capital event is the
      September 2021 Series D (USD 200 million), now nearly five years old. Without
      audited financials, investors cannot determine whether KEENON has sufficient runway
      to fund its RaaS model expansion, XMAN humanoid development, and overseas
      infrastructure build-out. The RaaS model is capital-intensive by design: robots
      must be purchased and deployed before subscription revenue is collected. At scale,
      this creates a structurally growing working-capital deficit that may require
      continuous external financing. Financial opacity is itself a risk signal — a company
      capable of disclosing strong financials typically does so to support fundraising,
      strategic partnerships, and IPO readiness.
    severity: major
    claimRefs:
      - CR026
      - CR027
      - CR028

  - id: CR-CALL-02
    calloutType: risk
    title: YY Group MOU and KT Group Terms Are Insufficient Revenue Evidence
    body: >-
      Both of KEENON's most recently announced international partnerships — YY Group
      (August 2025 MOU) and KT Group (September 2024 strategic partnership) — lack
      disclosed commercial terms that would allow investors to size their revenue
      contribution. The YY Group MOU uses non-binding language in both its August 2025
      SEC 6-K filing and its March 2026 shareholder letter; SEC safe-harbour disclaimers
      are attached to both. The KT Group announcement via AP News names no deployment
      targets, minimum purchase volumes, or contract duration. Together, these two
      partnerships represent KEENON's most visible international growth story, yet neither
      has been converted into verifiable contracted revenue. Treating either as backlog
      would materially overstate near-term revenue visibility.
    severity: major
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024

  - id: CR-CALL-03
    calloutType: risk
    title: PIPL and Connected-Device Security Create Unquantified Regulatory Exposure
    body: >-
      KEENON deploys networked robots that map and navigate customer premises, logging
      operational data that connects to the KOM 2.0 cloud platform. China's PIPL (effective
      November 2021) requires companies transferring personal information outside China to
      complete a CAC security assessment or obtain certification. No such assessment has
      been publicly confirmed for KEENON. The Stanford DigiChina translation of PIPL
      Article 38 confirms that cross-border transfers — including to global affiliates and
      service providers — require one of three compliance pathways. At the same time, CISA
      and NIST have both issued guidance on the cybersecurity risks of connected commercial
      devices, and CFR's analysis of China's Digital Silk Road notes that Chinese
      cybersecurity legislation requires firms to cooperate with state security authorities.
      Together, these risks create dual exposure: regulatory non-compliance in China and
      national-security scrutiny in Western markets — both of which could impair KEENON's
      ability to operate in key markets.
    severity: major
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR010
      - CR011

