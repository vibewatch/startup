sections:
  - id: SR-section-regulatory
    title: Regulatory, Legal, and Geopolitical Risks
    body: >-
      KEENON Robotics operates connected indoor robots in more than 60 countries, creating
      multi-jurisdictional regulatory exposure that is not disclosed in any public document
      reviewed as of May 2026. China's Personal Information Protection Law (PIPL, effective
      November 2021) and Data Security Law (DSL, effective September 2021) impose consent,
      data localisation, and cross-border transfer requirements on entities that collect
      personal information within China. KEENON robots navigate and map indoor environments,
      log operational data, and connect to the KOM 2.0 cloud management platform. The
      privacy policy published on keenon.com acknowledges cross-border transfers to global
      affiliates and service providers but discloses no PIPL compliance certifications,
      data processing agreements (DPAs), or security assessments. Under PIPL Article 38,
      cross-border personal information transfers require either: (a) security assessment
      by the Cyberspace Administration of China (CAC), (b) certification by an institution
      designated by CAC, or (c) a standard contract filed with CAC. None of these have
      been publicly confirmed for KEENON.

      Geopolitically, Chinese-origin hardware is subject to US Section 301 tariffs of 25%
      on robotics and related products, administered by the USTR. These tariffs increase
      landed costs for US distributors and customers and reduce KEENON's price
      competitiveness relative to domestically manufactured alternatives. The Bureau of
      Industry and Security (BIS) administers Export Administration Regulations (EAR) that
      may apply to advanced AI and sensor components used in KEENON products as the company
      scales its AI capabilities with the XMAN humanoid series. Separately, NDAA Section
      889 prohibits US government agencies from procuring telecommunications or video
      surveillance equipment from specific Chinese vendors; while KEENON does not currently
      appear on the covered vendors list, future legislative expansion to indoor navigation
      and service robots would close the US institutional and government procurement channel.

      The Council on Foreign Relations' Digital Silk Road analysis documents how Western
      governments increasingly scrutinise Chinese technology companies' deployments for
      state-linked data risks — a concern heightened by Chinese cybersecurity legislation
      that requires firms to cooperate with state security authorities and store data in
      China. The EU AI Act, phasing in from 2024 to 2026, introduces conformity assessment
      requirements for AI systems used in public or professional settings; KEENON's
      autonomous navigation and environmental mapping systems may qualify as AI systems
      subject to conformity assessment.
