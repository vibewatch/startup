    title: Regulatory / legal risk register
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Includes all material regulatory and legal risk categories identifiable from
        public regulatory sources, government agency disclosures, and independent legal
        commentary through May 2026. Coverage is partial because enforcement actions,
        active investigations, and confidential compliance programmes are not publicly
        disclosable by KEENON or by regulators prior to enforcement.
    notes: >-
      Risks ordered by residual severity (high to low). Likelihood reflects the probability
      that this risk will crystallise into an adverse event within a 24-month investment
      horizon given current market and regulatory conditions. Mitigation maturity is
      assessed from public evidence only; private compliance programmes may exist.
    columns:
      - Risk / Rule / Exposure
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation Evidence
      - Residual Exposure
      - Diligence Path
    rows:
      - - China PIPL / DSL connected-robot data transfer restrictions
        - China
        - Active law since Nov 2021 / Sep 2021
        - Medium — dependent on CAC enforcement activity
        - High — potential operational shutdown or large fines in China
        - Privacy policy discloses cross-border transfers; no CAC security assessment confirmed
        - High — no independent PIPL compliance evidence found
        - Request PIPL compliance certificates, CAC security assessment, and DPA evidence
      - - US Section 301 tariffs (25%+) on Chinese-origin robotics hardware
        - USA
        - Active since 2018; expanded 2024
        - High — tariffs are established law with enforcement track record
        - High — increases US landed cost and reduces price competitiveness
        - RaaS model partially offsets customer capex; no tariff mitigation disclosed
        - Medium — RaaS margin absorbs tariff headwind; quantification unavailable
        - Confirm BOM origin and tariff classification for all SKUs shipped to US buyers
      - - US NDAA procurement restrictions expansion to service robots
        - USA
        - Current NDAA does not cover KEENON; legislative risk from future expansion
        - Medium — bipartisan legislative activity around Chinese tech procurement
        - High — blocks US government and defence-adjacent institutional channel
        - Not currently on covered-vendor list; no pre-emptive compliance programme disclosed
        - High — government channel entirely closed if extended
        - Monitor NDAA Section 889 legislative activity; screen US prospects for NDAA applicability
      - - EU AI Act conformity assessment for autonomous indoor navigation systems
        - EU
        - Phasing in 2024–2026; full enforcement by 2026
        - Medium — applicability depends on final AI Act implementing acts
        - Medium — market access risk if conformity certification delayed
        - No EU AI Act conformity declaration found; no Notified Body engagement disclosed
        - Medium — EU expansion delayed until certification obtained
        - Obtain legal opinion on KEENON product classification under EU AI Act; initiate conformity roadmap
      - - Intellectual property protection risk in export markets
