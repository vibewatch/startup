  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        KEENON revenue, gross margin, EBITDA, operating cash flow, cash balance, burn rate,
        and capital adequacy data. The company has not disclosed audited or unaudited financial
        statements in any public form as of May 2026. Without these, capital adequacy, RaaS
        model economics, and runway cannot be assessed.
      whyItMatters: >-
        Financial opacity is the most significant unverifiable dimension of KEENON's risk
        profile. It prevents assessment of whether the company can fund its overseas expansion,
        humanoid development, and RaaS capital deployment simultaneously. It also makes it
        impossible to determine whether the five-year-old Series D capital has been substantially
        consumed or is still available.
      diligencePath: >-
        Request audited financial statements from KEENON CFO for the most recent three fiscal
        years. Obtain interim management accounts for 2025 and YTD 2026. Specifically request
        revenue by vertical and geography, gross margin by product and model (hardware vs RaaS),
        capex for robot manufacturing, and operating cash flow.
      relatedQuestionRefs:
        - QR008
        - QR009
        - QR011
        - QR012

    - type: missing-source
      severity: blocking
      topic: pipl-compliance-gap
      missingEvidence: >-
        Any publicly available evidence that KEENON has completed a CAC security assessment,
        obtained an institution-designated PIPL certification, or filed a standard contract with
        CAC for its cross-border personal information transfers under PIPL Article 38. The
        privacy policy acknowledges cross-border transfers but provides no compliance pathway
        documentation.
      whyItMatters: >-
        PIPL non-compliance exposes KEENON to enforcement actions in China — its primary market —
        including fines of up to 5% of annual turnover under Article 66, suspension of data
        processing activities, or forced operational changes that could disrupt the KOM 2.0
        cloud management platform. It also undermines KEENON's ability to represent itself as
        compliant to prospective Western enterprise customers.
      diligencePath: >-
        Request PIPL compliance documentation package from KEENON legal team, including: the
        specific compliance pathway selected under Article 38, the CAC security assessment
        certificate number and date (if applicable), the standard contract for cross-border
        transfers (if applicable), and a list of all jurisdictions to which personal information
        is transferred.
      relatedQuestionRefs:
        - QR001
        - QR013
        - QR026
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: material
      topic: kom20-security-posture
      missingEvidence: >-
        Any publicly available security certification (SOC 2 Type II, ISO 27001, or equivalent),
        software bill of materials (SBOM), or independent third-party security assessment for
        KEENON's KOM 2.0 cloud robot management platform and robot firmware as of May 2026.
      whyItMatters: >-
        Each deployed KEENON robot is a networked endpoint in a customer's commercial environment,
        connected to a centralised cloud platform. Without independent security assurance, customers
        in regulated verticals (healthcare, government-adjacent) cannot meet their own compliance
        obligations by deploying KEENON robots, and investors cannot assess whether a data breach
        incident is a plausible near-term risk.
      diligencePath: >-
        Request SOC 2 Type II audit report for KOM 2.0 cloud platform; SBOM for robot firmware
        stack; penetration test report from a qualified third-party security firm; and KEENON's
        incident response plan and vulnerability disclosure policy.
      relatedQuestionRefs:
        - QR014
        - QR019
        - QR022
      relatedTableRefs:
        - TR002

    - type: missing-source
      severity: material
      topic: mitigation-pathway-opacity
      missingEvidence: >-
        Publicly disclosed mitigation evidence for KEENON's top regulatory risk exposures —
        specifically, any documentation of PIPL compliance pathways, NDAA monitoring programmes,
        or EU AI Act conformity roadmaps. KEENON has not published any regulatory compliance
        programme, legal opinion, or regulatory engagement timeline.
      whyItMatters: >-
        Without evidence of mitigation activity, investors cannot distinguish between a company
        that has assessed its regulatory exposure and taken private steps versus one that is
        unaware of or unprepared for regulatory enforcement. This gap is particularly acute for
        PIPL, where non-compliance carries fines up to 5% of annual turnover.
      diligencePath: >-
        Request KEENON's regulatory compliance roadmap including: PIPL compliance status and
        timeline; NDAA applicability assessment and any pre-emptive compliance steps; EU AI Act
        conformity assessment plan; and any external legal opinions on applicable regulatory frameworks.
      relatedQuestionRefs:
        - QR005
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: material
      topic: deployment-activity-opacity
      missingEvidence: >-
        Granular breakdown of KEENON's claimed 100,000+ installed-base figure by active versus
        inactive deployments, RaaS subscription versus outright hardware sale, revenue-generating
        versus pilot or gifted units, and geographic distribution. No deployment ledger or
        customer-count by segment has been publicly disclosed.
      whyItMatters: >-
        The installed-base figure is KEENON's primary commercial proof point, but without a
        breakdown by active/inactive and RaaS/hardware, it cannot be used to estimate recurring
        revenue, churn, or capital intensity. An installed base that is largely inactive or
        unsupported would materially reduce the company's intrinsic value.
      diligencePath: >-
        Request a deployment ledger from KEENON showing: total units shipped vs actively managed
        via KOM 2.0; breakdown by commercial model (RaaS subscription vs outright sale); revenue
        by geographic region and customer vertical; and the number of units that have been
        returned, decommissioned, or are no longer generating revenue.
      relatedQuestionRefs:
        - QR010

