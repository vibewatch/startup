company:
  name: Keenon Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    KEENON Robotics faces a layered risk profile that reflects its status as an opaque,
    China-headquartered private company deploying networked service robots across
    geopolitically sensitive markets. The most severe risks are: (1) regulatory and
    geopolitical exposure — China's Personal Information Protection Law (PIPL) and
    Data Security Law apply to data collected by connected robots; US Section 301
    tariffs at 25%+ apply to Chinese-origin hardware; and procurement-restriction
    legislation analogous to NDAA Section 889 could expand to service robots; (2) partner
    concentration — SoftBank Vision Fund 2 is the sole disclosed institutional investor,
    Haidilao is the anchor reference customer, and the YY Group Southeast Asia relationship
    remains a non-binding MOU; (3) financial opacity — no revenue, margin, or burn-rate
    data is publicly disclosed, making capital adequacy unverifiable; (4) connected-robot
    cybersecurity — KEENON's KOM 2.0 cloud platform represents an unaudited networked
    attack surface in customer premises; and (5) XMAN humanoid distraction risk — the
    humanoid product line may divert R&D resources from the core service-robot revenue base.
    Thesis-break triggers include SoftBank initiating a formal write-down, Haidilao
    terminating its deployment, YY Group MOU expiring without conversion, or a regulatory
    enforcement action in any key market.

