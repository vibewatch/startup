      - number: '8.3'
        title: Bull, base, and bear case framing
        blocks:
          - type: paragraph
            body: >-
              Equity Residential’s about page is another reminder that established operators can pair premium branding
              with much deeper operating disclosure. HUD rental-assistance context underscores how far Flow’s premium
              product sits from the most subsidized or affordability-driven end of housing demand. Blackstone’s
              real-estate scale is a reminder that sophisticated capital already understands branded and experience-led
              housing. Flow therefore cannot rely on novelty alone to sustain a premium mark. Public data is strong
              enough to say the company is not obviously fictitious or pre-product. Public data is not strong enough to
              say the 2025 valuation is cheap. The most defensible public valuation stance is that Flow screens
              stretched until private economics prove otherwise. A bull case would argue that brand, hospitality attach,
              and cross-border expansion create multi-product upside beyond plain apartments. A base case would value
              Flow as an upscale apartment operator with some service upside but still limited reporting. This section
              matters because it frames the scenario spread between bull, base, and bear cases. The evidence is
              sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics,
              governance, and unit economics.
            claimRefs:
