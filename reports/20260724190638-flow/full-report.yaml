      - number: '3.4'
        title: Competitive limits and benchmark implications
        blocks:
          - type: paragraph
            body: >-
              Co-living and service startups set a high bar for customer-experience differentiation but also illustrate
              failure modes. Flow is unusual because it is trying to sit across both competitor groups simultaneously.
              That hybrid positioning may support valuation storytelling but also makes execution comparisons messier.
              Competing against institutional incumbents on operations while competing against startups on experience
              raises coordination burden. The public evidence supports treating Flow as a differentiated premium
              operator rather than a category-of-one. The strongest comparables are public apartment REITs for
              discipline and co-living brands for product narrative. WeWork remains the most emotionally salient
              reference point for partners and investors even if it is not the cleanest economic comp. Flow’s edge, if
              real, must come from better resident experience and tighter vertical integration than these comparator
              sets provide today. This section matters because it converts the peer set into underwriting implications.
              The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the
              underlying metrics, governance, and unit economics.
