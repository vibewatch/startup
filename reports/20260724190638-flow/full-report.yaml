      - number: '8.2'
        title: What comps and pricing context do—and do not—tell us
        blocks:
          - type: paragraph
            body: >-
              That means any valuation view must lean heavily on narrative, comparable public operators, and the
              scarcity value of brand differentiation. Public REITs are generally valued on asset quality, rent growth,
              balance-sheet structure, and cash-flow durability. Flow is instead being marked on perceived future
              platform value plus private information the market has not seen. That can be reasonable if internal
              operating metrics are exceptional, but public sources do not verify that today. Vox and TechCrunch
              criticism remain relevant because they warn that founder charisma can inflate valuation narratives. A
              premium brand premium is plausible, but a full platform premium requires evidence that the operating model
              scales better than luxury apartments alone. Wikipedia’s residential-REIT and REIT summaries reinforce that
              listed real-estate vehicles are usually judged on transparent asset and income characteristics. Co-living
              reference material reminds investors that communal-living narratives can attract attention without
              guaranteeing durable economics. CBRE’s multifamily-services page underscores that sophisticated advisory
              and capital-market infrastructure already exists around the category. This section matters because it
              shows what public comps can and cannot justify. The evidence is sufficient to describe the public picture,
              but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
            claimRefs:
