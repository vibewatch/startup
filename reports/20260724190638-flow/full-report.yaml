      - number: '3.3'
        title: Where Flow is actually differentiated
        blocks:
          - type: paragraph
            body: >-
              It can also be copied selectively by well-capitalized incumbents that already control local inventory.
              WeWork’s post-bankruptcy state highlights that brand and community narratives alone do not guarantee
              durable economics. Selina’s troubled history is another cautionary example for lifestyle-heavy real-estate
              hybrids. Yardi is relevant as enabling property-tech infrastructure rather than as a branded-living
              competitor. Blackstone and LivCor show that institutional capital can bundle operations, asset management,
              and scale without founder-centered branding. Flow’s most direct competitive battles are likely local and
              asset-specific even when its investor narrative is broader. In South Florida, premium location, service
              quality, and lease economics are likely more decisive than abstract community branding alone. In Riyadh,
              partner access and product fit may matter more than U.S. brand awareness. Public-company comps set a high
              bar for reporting, consistency, and asset-level performance proof. This section matters because it shows
              where differentiation could matter and where scale still wins. The evidence is sufficient to describe the
              public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit
              economics.
            claimRefs:
