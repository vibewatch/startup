      - number: '7.2'
        title: Regulatory, market, and geographic exposure
        blocks:
          - type: paragraph
            body: >-
              HUD’s Fair Housing Act overview is a reminder that housing operators face regulatory obligations very
              different from consumer apps. HUD multifamily and housing-market surfaces show the category is regulated,
              data-heavy, and exposed to policy shifts. Census construction and vacancy data also highlight macro
              sensitivity to supply cycles and housing-market conditions. Saudi expansion introduces geopolitical and
              legal complexity beyond the U.S. apartment market. Vision 2030 provides growth rationale, but it does not
              remove local execution, compliance, or reputational risk. For some stakeholders, Saudi exposure also
              carries ethical and reputational concerns. Calcalist’s monopoly framing underscores skepticism that Flow’s
              rhetoric about housing can drift toward overreach. Fortune’s reporting on possible competition or
              partnership with WeWork implies strategy creep beyond residential focus. TechCrunch’s Saudi reporting
              shows geographic expansion risk arriving relatively early in the company life cycle. This section matters
              because it shows that regulatory and geographic risk are real and layered. The evidence is sufficient to
              describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance,
