        title: Demand, supply, and category structure
        blocks:
          - type: paragraph
            body: >-
              Harvard’s rental-housing work shows that affordability pressure remains a defining feature of the renter
              market. Apartment List publishes recurring national rent data, demonstrating continued consumer and
              investor focus on rent levels. Zumper also publishes recurring rent-price data, offering a second pricing
              lens for renter budgets. Census construction data shows that new residential supply is tracked nationally
              and remains material to the housing balance. The Housing Vacancy Survey provides a direct public lens on
              vacancy conditions that influence apartment pricing power. HUD maintains a multifamily-data surface,
              signaling sustained regulatory and financing attention to apartment stock. HUD User publishes
              housing-market-conditions updates, adding another official lens on supply-demand trends. NAHB’s
              multifamily market survey reflects the supply side’s expectations around rental production and leasing
              conditions. NMHC’s quick-facts downloads show the apartment industry supports a large resident and asset
              base in the United States. This section matters because it shows why scarcity and rent pressure matter to
              the thesis. The evidence is sufficient to describe the public picture, but not sufficient to skip
              diligence on the underlying metrics, governance, and unit economics.
            claimRefs:
