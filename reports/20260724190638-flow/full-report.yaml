chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and mission
        blocks:
          - type: paragraph
            body: >-
              Flow was founded in 2022 by Adam Neumann. Flow is headquartered in Miami, Florida. Flow operates as a
              residential real estate company rather than a pure software startup. a16z announced a $350 million seed
              round for Flow in August 2022. Public reporting valued Flow at more than $1 billion in 2022. TechCrunch
              reported a 2025 round of more than $100 million at roughly a $2.5 billion valuation. Public disclosures
              imply at least about $450 million raised across the seed and Series B. Calcalist described Flow as a
              four-pillar model spanning management, ownership, financial services, and value-sharing. Flow’s mission
              language centers on connection to self, neighbors, and the natural world. Together, those facts frame Flow
              as a capital-intensive operating company that is trying to turn lifestyle branding and resident experience
              into a differentiated apartment product rather than merely a digital marketplace.
