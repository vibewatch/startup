      - number: '7.3'
        title: Operational and organizational execution risks
        blocks:
          - type: paragraph
            body: >-
              The legal and people hiring map suggests management is aware that compliance and organizational process
              matter. But hiring for controls is not equivalent to proving strong controls. Strategic initiatives and
              business-development roles imply optionality, but also raise the risk of overextension. A premium service
              model raises labor and service-quality risk because resident expectations are high and delivery is human
              intensive. The absence of public retention, complaint, or unit-economics metrics makes it difficult to
              measure those risks objectively. Housing operators also face fair-housing, resident-safety, and
              property-condition risks that can scale quickly with footprint. The market itself is cyclical: rent
              growth, asset values, and financing conditions can all change against Flow. If luxury demand softens,
              Flow’s premium positioning could compress faster than broader-market housing demand. The renter
              value-sharing narrative remains a product and regulatory uncertainty because public details are sparse.
              This section matters because it converts hiring and disclosure gaps into operational risk. The evidence is
              sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics,
              governance, and unit economics.
