      - number: '7.4'
        title: Mitigants, open questions, and overall rating
        blocks:
          - type: paragraph
            body: >-
              Cross-border data handling in the privacy policy adds another operational-compliance dimension. The core
              reputational risk is that Flow could be perceived as another charisma-heavy real-estate narrative ahead of
              proof. The strongest current mitigants are capital access, hiring for controls, and a live product
              footprint. Those mitigants do not eliminate founder, governance, or execution risk. Risk concentration is
              highest where founder dependence, luxury demand, and geographic expansion intersect. The public evidence
              supports a high-risk rating even if the company continues to execute operationally. Serious diligence
              should prioritize governance rights, legal exposure, asset-level safety and compliance, and Saudi partner
              structures. The central risk question is whether Flow has truly institutionalized around the founder’s
              prior failure or is mainly hoping to outrun it. This section matters because it separates mitigating
              signals from actual de-risking. The evidence is sufficient to describe the public picture, but not
