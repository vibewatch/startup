  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding history and what is actually disclosed
        blocks:
          - type: paragraph
            body: >-
              a16z announced a $350 million seed investment in Flow in August 2022. TechCrunch’s April 2025 coverage put
