  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Incumbent operator landscape
        blocks:
          - type: paragraph
            body: >-
              Flow competes first against scaled apartment owners and managers, not just against software startups.
              AvalonBay is a large public apartment operator with institutional-scale communities and investor
              disclosure. Equity Residential is another large public apartment operator with a national portfolio and
              public-company reporting discipline. Greystar’s platform scale makes it a more direct operating benchmark
              than most proptech startups. LivCor sits inside Blackstone’s real-estate ecosystem and represents a scaled
              institutional multifamily model. NMHC owner and manager rankings show that scaled apartment operations are
              already crowded with institutional incumbents. Flow’s Miami and hospitality surfaces imply competition on
              brand, amenities, and experience rather than on lowest rent. Four Seasons is a useful premium-brand
              comparator for experience and residence signaling, even though its operating model is different. Common is
              a legacy co-living comparator for community-oriented multifamily product positioning. This section matters
              because it establishes the real benchmark set around Flow. The evidence is sufficient to describe the
              public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit
              economics.
            claimRefs:
