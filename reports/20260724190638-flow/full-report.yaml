      - number: '3.2'
        title: Startup, lifestyle, and service comparators
        blocks:
          - type: paragraph
            body: >-
              Starcity is another co-living precedent that illustrates both demand ambition and execution difficulty in
              communal housing. Alfred represents the service-layer/property-tech competitor archetype that tries to add
              resident convenience to apartment living. Sage serves as a weak but relevant brand comparator for
              consumer-facing community or lifestyle positioning in housing-adjacent categories. WeWork remains a
              strategic reference point because Neumann has said Flow could compete with or partner with it. The Real
              Deal described Flow’s Saudi plans, which implies competition can also involve regional development
              partnerships rather than just U.S. leasing brands. Public REIT competitors publish detailed financials,
              while Flow does not. Institutional incumbents can spread technology and amenity costs over much larger
              portfolios than Flow currently shows publicly. Flow’s differentiation pitch relies on brand curation and
              resident experience rather than portfolio breadth. That strategy can create premium pricing power if
              residents value programming, hospitality, and design enough to justify rent spreads. This section matters
              because it separates startup precedents from institutional alternatives. The evidence is sufficient to
              describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance,
              and unit economics.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
