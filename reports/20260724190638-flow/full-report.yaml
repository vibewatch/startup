  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation anchors and benchmark set
        blocks:
          - type: paragraph
            body: >-
              The latest widely cited public valuation anchor for Flow is roughly $2.5 billion from the reported April
              2025 round. A16Z’s $350 million 2022 seed set an unusually high starting value and expectation base.
              Together, those two marks imply investors have continued to assign premium strategic option value to Flow.
              Public apartment REIT filings provide the cleanest disclosed benchmark set for valuation discipline. CBRE,
              Trimont, RealPage, and Newmark all frame multifamily as a large but economically cyclical asset class.
              NMHC owner and manager rankings show that scaled operators exist with proven breadth, which matters when
              thinking about Flow’s relative maturity. Apartment List and Zumper rent data provide context that premium
              rents can be monetized, but they do not prove Flow’s property margins. Flow’s listing pages prove live
              inventory and real-world monetization surfaces. They do not provide enough information to calculate
              stabilized NOI, cap rates, or cash-on-cash returns. This section matters because it identifies the public
              anchors any valuation discussion must start from. The evidence is sufficient to describe the public
              picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
