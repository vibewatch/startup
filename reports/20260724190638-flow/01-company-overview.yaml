- id: history
  title: Milestones and leadership scale
  body: Fortune reported roughly 150 employees in 2023. Fortune reported that Neumann said Flow could compete with or partner with WeWork. TechCrunch reported Neumann’s 2024 attempt to buy back WeWork out of bankruptcy. Vox and TechCrunch framed Flow’s relaunch as controversial given WeWork’s collapse. Flow Hotel and Flow House show the brand extending beyond long-term apartments. Lever hiring shows active legal, finance, HR, and operations buildout. No reviewed official page disclosed a board roster. No reviewed public source disclosed revenue, occupancy, or NOI. Flow’s public story blends apartments, software, hospitality, and media. The hiring mix is especially important because it indicates a real operating platform is being assembled, but it also implies higher fixed overhead and a need for stronger process control than the public materials presently demonstrate. In practical terms, the company appears to be building enough corporate infrastructure to support wider expansion, while still leaving outside observers with a thin view of management controls and financial cadence.
  claimRefs:
  - CO019
  - CO020
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
