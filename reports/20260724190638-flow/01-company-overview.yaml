  figureRefs: []
- id: gaps
  title: Adverse history and disclosure gaps
  body: Saudi and U.S. contacts in the privacy policy imply cross-border compliance complexity. The company is more legible publicly through listings, legal pages, and hiring than through financial disclosure. The renter value-sharing mechanism remains under-explained in public sources. Flow’s current visible product family includes app, apartments, hotel, and publication surfaces. Flow’s organizational breadth suggests a platform operator, not a single-asset landlord. The public record supports ambition and scale-up, but not yet durable economics. WeWork’s history remains the main reputational shadow on Flow. Current public evidence supports treating Flow as a funded, live, but under-disclosed platform. For an investor, that means the central diligence question is not whether the concept is visible in market; it is whether governance, unit economics, and expansion controls are robust enough to justify another premium narrative around the same founder. Until Flow publishes clearer resident economics or property-level performance indicators, the business remains easier to narrate than to underwrite with conviction.
  claimRefs:
  - CO028
  - CO029
  - CO030
  - CO031
