company:
  name: Flow
chapter:
  number: 1
  title: Company Overview
  summary: Flow is Adam Neumann’s 2022 residential real estate company, combining branded apartments, resident software, hospitality, and media extensions. Public sources support significant financing and multi-geography rollout, but governance and portfolio economics remain thinly disclosed.
sections:
- id: identity
  title: Identity and mission
  body: Flow was founded in 2022 by Adam Neumann. Flow is headquartered in Miami, Florida. Flow operates as a residential real estate company rather than a pure software startup. a16z announced a $350 million seed round for Flow in August 2022. Public reporting valued Flow at more than $1 billion in 2022. TechCrunch reported a 2025 round of more than $100 million at roughly a $2.5 billion valuation. Public disclosures imply at least about $450 million raised across the seed and Series B. Calcalist described Flow as a four-pillar model spanning management, ownership, financial services, and value-sharing. Flow’s mission language centers on connection to self, neighbors, and the natural world. Together, those facts frame Flow as a capital-intensive operating company that is trying to turn lifestyle branding and resident experience into a differentiated apartment product rather than merely a digital marketplace.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
