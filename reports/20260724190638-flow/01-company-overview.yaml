- id: ops
  title: Operating footprint and model
  body: The Terms of Service say the Flow App helps residents and staff communicate, manage amenities, and handle rent-related tasks. The same Terms extend Flow’s service perimeter to the website, store, hotel properties, Flow Trip, and events. The Privacy Policy identifies FOL Management LLC and a Bay Harbor Islands address. The Terms mention FOL Management LLC and NIP FINCO LLC in the contract header. Official pages show current Miami, Fort Lauderdale, and Riyadh surfaces. TechCrunch and Forbes reported that Flow Narjis opened in Riyadh with 238 apartments. TechCrunch reported three additional Riyadh properties with nearly 1,000 apartments. Business Insider reported Flow’s purchase of Whalebone, later repositioned as Flow Trip. The Jerusalem Post reported Neumann’s 30% stake in Canada Global. This makes the visible operating perimeter much broader than a normal leasing website and suggests management is testing how far one resident brand can extend across housing, travel, content, and adjacent capital deployment.
  claimRefs:
  - CO010
