callouts:
- calloutType: strength
  title: Flow already looks broader than a single leasing brand
  body: The public legal, property, hotel, and publication surfaces point to a platform thesis that goes well beyond simple apartment marketing. That breadth could support deeper resident engagement if it also improves retention or NOI.
  claimRefs:
  - CO010
  - CO011
  - CO023
  - CO027
  - CO031
- calloutType: risk
  title: Governance and economics still trail the ambition
  body: The founder story and financing are easy to verify publicly; the board structure, resident value-sharing mechanics, and property-level economics are not. That mismatch is material given the WeWork precedent attached to Adam Neumann.
  claimRefs:
  - CO021
  - CO022
  - CO025
  - CO026
