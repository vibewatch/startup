- calloutType: recommendation
  title: Request governance and compliance materials before treating momentum as de-risking
  body: Live properties and active hiring are encouraging, but they do not replace board rights, entity maps, compliance systems, incident tracking, and Saudi partner documentation. Those materials should be first-wave diligence requests.
