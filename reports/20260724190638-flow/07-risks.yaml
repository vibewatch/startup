callouts:
- calloutType: risk
  title: Do not collapse the risk picture into “Adam Neumann risk” alone
  body: Founder history is the most visible risk, but the more important underwriting question is how that history interacts with governance opacity, luxury exposure, and early international expansion.
  claimRefs:
  - CR001
  - CR004
