  - FM003
- id: limits
  title: Constraints, contradictions, and investability
  body: Institutional research coverage implies buyers, owners, lenders, and managers all influence market adoption, not residents alone. Flow must win both renter demand and owner-level capital discipline because multifamily operations are capital intensive. The market is not just apartments; it includes operations, amenities, underwriting, financing, and service layers. Miami and Riyadh suggest Flow is prioritizing high-income urban nodes with amenity density and brand appeal. Adoption constraints include rent affordability, interest-rate pressure, entitlement friction, and the challenge of proving community ROI. Growth drivers include housing scarcity, renter demand for convenience, and investor appetite for differentiated multifamily product. Flow’s TAM is large at the category level, but its serviceable market is much narrower because of price point and geography. Public sources support a real market opportunity, but not an assumption that Flow can address the mass-market housing shortage.
    This section matters because it separates a large macro market from a narrow serviceable wedge. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
