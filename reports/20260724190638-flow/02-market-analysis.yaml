callouts:
- calloutType: insight
  title: The category is large, but Flow’s realistic wedge is not
  body: Public market research supports a very large multifamily category, but Flow is clearly targeting a premium, service-heavy subset of demand rather than the full rental market. That distinction is essential for sane TAM framing.
  claimRefs:
  - CM004
  - CM010
  - CM021
  - CM031
  - CM034
  - CM035
- calloutType: risk
  title: Housing-crisis rhetoric outruns the serviceable market
  body: Affordability and supply constraints are real, yet Flow’s price point, amenity posture, and geography mean the company is not addressing the most burdened renter cohorts directly. That narrative tension should remain explicit.
