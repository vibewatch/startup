chapter:
  number: 2
  title: Market Analysis
  summary: Flow operates inside large, institutionally capitalized multifamily markets, but its realistic serviceable opportunity is the narrower slice of premium apartment demand willing to pay for branded experience and service density. Public market data supports real category tailwinds, while affordability and capital intensity remain the core constraints.
sections:
- id: boundary
  title: Market boundary and sizing lenses
  body: Flow addresses the intersection of multifamily housing, hospitality-style living, and resident services rather than a single narrow software category. The company’s public story explicitly links community design to conventional apartment supply. Calcalist framed Flow as an attempt to address housing pain points through a vertically integrated model. CBRE’s 2025 outlook treats multifamily as a major U.S. real estate asset class with institutional-scale capital attention. Cushman & Wakefield publishes a dedicated U.S. multifamily marketbeat, underscoring the depth of market monitoring and transaction activity in the category. Trimont tracks the U.S. multifamily market as a distinct investable sector with finance and operations implications. RealPage maintains apartment data and multifamily research, indicating a mature analytics ecosystem around rent and occupancy. Newmark publishes a dedicated U.S. multifamily capital-markets report, reinforcing that pricing and liquidity are central
    to category economics. Zelman maintains apartment-sector research, which further confirms multifamily housing as a separately analyzed investment vertical. This section matters because it defines the category Flow is actually trying to enter. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
