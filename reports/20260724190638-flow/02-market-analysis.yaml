- id: buyers
  title: Buyer segmentation and adoption mechanics
  body: NMHC’s top-owners ranking demonstrates that apartment ownership is already dominated by scaled institutional operators. NMHC’s top-managers ranking shows that operational scale in property management is already concentrated among large platforms. Flow’s U.S. footprint in Miami targets a premium submarket rather than the average American renter. Flow’s Riyadh expansion points to a second demand pool shaped by expatriate, premium, and Vision 2030-linked demand. Vision 2030 provides a macro narrative for Saudi real-estate expansion and urban-development investment. Wikipedia’s housing-crisis entry captures the broad public framing that housing scarcity and affordability are unresolved structural issues. Wikipedia’s multifamily entry usefully distinguishes apartment-style housing from other residential formats in category terms. Flow’s thesis benefits from constrained housing supply because scarcity can support premium rent positioning. The same scarcity also constrains social-impact
    claims because a luxury product does not directly solve broad affordability pressure. This section matters because it maps who pays, who uses, and where the company is choosing to play. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  tableRefs:
