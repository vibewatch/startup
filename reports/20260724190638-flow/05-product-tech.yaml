  - FE002
- id: stack
  title: What the hiring map says about the stack
  body: Document-control roles imply process needs around drawings, vendors, approvals, or construction records. Public evidence points to a tech-enabled operator rather than a pure software vendor selling to third parties. The product is vertically integrated because software, brand, space design, leasing, and operations appear under one umbrella. This vertical integration may improve resident experience but also increases execution burden and fixed-cost complexity. The reviewed public surfaces do not expose a third-party developer API or a standalone software product motion. They instead describe controlled first-party experiences tied to buildings Flow owns, operates, or brands. A city-to-property funnel plus live inventory pages is consistent with conventional leasing workflows augmented by brand positioning. Riyadh pages suggest the platform architecture is portable enough to support another geography, at least at the surface layer. The current public product is strongest on merchandising,
    listing, and community framing rather than on visible fintech functionality. This section matters because it turns hiring signals into a view of the underlying stack. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: moat
  title: Moat, gaps, and what is still unproven
  body: That matters because early commentary described financial services and renter value-sharing as part of the broader concept. The gap between concept and visible product suggests Flow is shipping the operational core before more novel economic features. Technical and operational hiring breadth supports the view that management is building an internal systems stack, not relying only on outsourced property software. Yet there is no public architecture documentation detailing how the resident app, property systems, and hospitality workflows connect. Investors should therefore treat the product as operationally real but technically under-documented from the public record. The technology moat, if any, likely comes from workflow integration and service execution rather than hard-to-copy software IP alone. That kind of moat can matter, but only if resident satisfaction and operating economics improve materially. Public evidence supports a differentiated operating product, but not yet a clearly
    documented technology platform moat. This section matters because it distinguishes visible operations from still-undocumented moat claims. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CE028
  - CE029
  - CE030
  - CE031
