chapter:
  number: 5
  title: Product & Technology
  summary: Flow’s public product stack looks like a vertically integrated resident and property-operations system wrapped in premium lifestyle branding. The visible platform is strongest on leasing, community merchandising, and building operations, while the more ambitious fintech and value-sharing claims remain largely offstage in the current public record.
sections:
- id: surface
  title: Visible product surface and funnel
  body: Flow’s public product surface is a combination of website, resident app workflows, apartment inventory, and hospitality-adjacent offerings. The Terms of Service describe a Flow App used by residents and staff to communicate, manage amenities, and handle rent-related tasks. The Terms also extend the product perimeter to the website, the store, hotel properties, Flow Trip, and events. The mission and why-Flow pages emphasize connection, wellbeing, and designed community as core product outcomes. The join surface shows that touring and lead capture are integrated into the consumer product funnel. The locations and region pages show a city-based discovery layer rather than a single-building microsite strategy. Fort Lauderdale, Miami Worldcenter, Brickell, and Wynwood pages show a structured property catalog with live inventory pages. Riyadh Narjis, Granada, Olaya, and Science Park pages show that the same digital pattern extends into Saudi inventory. That consistency suggests a shared
    content and listing system across geographies. This section matters because it shows the consumer-facing and operational surface already exists. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflows
  title: Inventory architecture and operating workflows
  body: Flow Hotel extends the brand into short-stay inventory, increasing the number of operating workflows the platform likely has to support. Flow House adds another residential product surface, this time around condominium-style inventory in Miami. The brokers page implies the platform also supports external leasing or channel relationships. The Privacy Policy confirms cross-border data handling and a Saudi contact path, which raises platform-governance complexity. The existence of explicit Terms and Privacy surfaces indicates product maturity beyond a brochure site. Job postings for head of corporate IT and lead IT engineer indicate internal platform and systems ownership. AI BIM/CAD modeler and BIM/Revit roles imply software-enabled design and construction workflows around the physical product. Construction project-manager roles suggest Flow is integrating digital coordination with physical rollout. Maintenance and facilities roles show that the product promise depends on ongoing in-building
    service execution. This section matters because it maps how brand adjacencies and workflows extend beyond simple listings. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  tableRefs:
  - TE002
