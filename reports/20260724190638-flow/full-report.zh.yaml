      - number: '8.4'
        title: 立场、置信度和下一步尽调
        blocks:
          - type: paragraph
            body: >-
              悲观情形会认为，这家公司是估值很高的私有房地产载体，还叠加创始人溢价叙事风险。几种情形之间存在估值差距，是因为公开证据无法定论利润率、留存或投入资本回报。公开可比对象即使不能捕捉 Flow
              的全部可选性，也能锚定下行纪律。没有公开 KPI 支撑的私募估值上调，在 2026 年市场一般应谨慎对待。正确的尽调动作，是把 2025 年估值接到底层楼宇经济性和组合增长假设上。如果 Flow
              能证明强劲入住率、利润率和附加变现，当前估值可能最终合理。如果不能，相比披露更透明的公寓运营商，这个估值会显得昂贵。公司仍是私有且不透明，估值置信度应保持中等，而不是高。公开证据支持 Flow
              是真实业务，但不能证明最近一次报道估值存在明确安全边际。因此建议应偏向继续研究，而不是立刻乐观。本节重要，因为它把剩余不确定性转成可辩护的立场，而不是虚假的精确。证据足以描述公开图景，但不足以跳过对底层指标、治理和单位经济的尽调。
