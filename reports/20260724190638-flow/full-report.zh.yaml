      - number: '2.2'
        title: 需求、供给与品类结构
        blocks:
          - type: paragraph
            body: >-
              Harvard 的租赁住房研究显示，负担能力压力仍是租客市场的定义性特征。Apartment List 持续发布全国租金数据，说明消费者和投资人仍紧盯租金水平。Zumper
              也持续发布租金价格数据，为租客预算提供第二个定价视角。Census 建筑数据表明，美国会全国性追踪新增住宅供给，且这一供给对住房平衡仍然重要。Housing Vacancy Survey
              为影响公寓定价权的空置状况提供直接公开视角。HUD 维护多户住宅数据界面，说明公寓存量持续受到监管和融资关注。HUD User 发布住房市场状况更新，又增加了一个官方供需趋势视角。NAHB
              的多户住宅市场调查反映供给侧对租赁住宅建设和出租条件的预期。NMHC 的速览下载显示，美国公寓行业支撑了庞大的住户和资产基础。本节重要，因为它说明为什么稀缺和租金压力会影响 Flow
              的命题。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
            claimRefs:
