  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点与可比基准
        blocks:
          - type: paragraph
            body: >-
              Flow 最新、市场广泛引用的公开估值锚点，来自报道中的 2025 年 4 月融资，约为 $2.5 billion。a16z 2022 年 $350 million
              种子轮，把起点估值和外界预期都抬得异常高。两者合在一起说明，投资者仍在给 Flow 较高的战略期权价值。要约束估值，公开公寓 REIT 申报文件是最干净的披露基准组。CBRE、Trimont、RealPage 和
              Newmark 都把多户住宅定义为规模很大、但经济周期性也很强的资产类别。NMHC 业主和管理方排名显示，已经有规模化运营商跑出了可验证的广度；评估 Flow 的相对成熟度时，这一点很关键。Apartment
              List 和 Zumper 租金数据说明，高端租金可以变现，但不能证明 Flow 的物业利润率。Flow 的房源页面证明了活跃库存和真实变现界面。它们不足以计算稳定
              NOI、资本化率或现金回报率。本节重要，因为它列出任何估值讨论都必须起步的公开锚点。证据足以描述公开图景，但不足以跳过对底层指标、治理和单位经济的尽调。
