        blocks:
          - type: paragraph
            body: >-
              服务条款称，Flow App 帮助住户和员工沟通、管理设施，并处理租金任务。同一份条款也把 Flow 的服务边界延伸到网站、商店、酒店物业、Flow Trip 和活动。隐私政策列出 FOL Management
              LLC 和 Bay Harbor Islands 地址。条款的合同抬头提到 FOL Management LLC 和 NIP FINCO LLC。官方页面展示了 Miami、Fort Lauderdale 和
              Riyadh 当前界面。TechCrunch 和 Forbes 报道，Flow Narjis 已在 Riyadh 开业，拥有 238 套公寓。TechCrunch 还报道 Riyadh 另有三处物业、接近
              1,000 套公寓。Business Insider 报道 Flow 收购 Whalebone，后来将其重新定位为 Flow Trip。The Jerusalem Post 报道 Neumann 持有
              Canada Global 30% 股份。可见运营边界远宽于普通租赁网站，也说明管理层在测试一个住户品牌能向住房、旅行、内容和相邻资本部署延伸多远。
