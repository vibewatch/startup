  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 创始人与治理包袱
        blocks:
          - type: paragraph
            body: >-
              Flow 从 Adam Neumann 的 WeWork 历史继承了实质创始人风险。TechCrunch 2022 年评论在公司启动时就把创始人风险争议摆到台面上。Vox 同样透过 WeWork
              失败来看这家新公司。TechCrunch 报道，Neumann 在 Flow 搭建期间曾于 2024 年试图买回 WeWork。Quartz 报道 WeWork 在没有 Neumann
              的情况下走出破产，凸显失败先例的持续影响。因此，公开批评不是历史噪音；它仍附着在当前创始人身份上。Flow
              的法律页面确认真实实体和合同界面，但没有给出公开治理包。审阅过的公开页面没有披露当前董事会名单或正式治理框架。公司资本强度高且围绕创始人展开，这让治理不透明更重要。本节重要，因为它框定了持续存在的创始人和治理包袱。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
