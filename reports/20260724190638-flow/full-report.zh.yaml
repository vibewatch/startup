      - number: '8.2'
        title: 可比公司和定价语境能说明什么、不能说明什么
        blocks:
          - type: paragraph
            body: >-
              因此，任何估值判断都必须重度依赖叙事、可比上市运营商，以及品牌差异化的稀缺价值。公开 REIT 通常按资产质量、租金增长、资产负债表结构和现金流耐久性定价。市场给 Flow
              的定价，则更多看外界感知的未来平台价值，以及市场看不到的私有信息。如果内部运营指标异常出色，这并非不合理；但公开来源今天无法验证。Vox 和 TechCrunch
              的批评仍然重要，因为它们提醒：创始人魅力会抬高估值叙事。高端品牌溢价可以成立，但完整平台溢价需要证明运营模型比单纯奢华公寓更能扩张。Wikipedia 的住宅 REIT 和 REIT
              摘要也说明，上市房地产载体通常看透明的资产和收入特征。合居参考资料提醒投资者，社区居住叙事可以吸引注意力，却不保证经济性足够持久。CBRE 的 multifamily-services
              页面强调，围绕这个品类，成熟咨询和资本市场基础设施已经存在。本节重要，因为它说明公开可比对象能支撑什么、不能支撑什么。证据足以描述公开图景，但不足以跳过对底层指标、治理和单位经济的尽调。
