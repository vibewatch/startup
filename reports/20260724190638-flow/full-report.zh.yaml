  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Flow 面向的是多户住宅、酒店式居住和住户服务的交叉地带，而不是单一狭窄软件品类。公司的公开叙事明确把社区设计与常规公寓供给连接起来。Calcalist 将 Flow
              描述为试图用垂直整合模式解决住房痛点。CBRE 的 2025 年展望把多户住宅视为美国房地产中的重要资产类别，吸引机构级资本关注。Cushman & Wakefield
              发布专门的美国多户住宅市场动态，凸显该品类的市场监测和交易活动深度。Trimont 把美国多户住宅市场作为独立可投资板块追踪，并覆盖融资和运营含义。RealPage
              维护公寓数据和多户住宅研究，说明租金和入住率周围已经形成成熟分析生态。Newmark 发布专门的美国多户住宅资本市场报告，进一步说明定价和流动性是品类经济性的核心。Zelman
              持续做公寓板块研究，也再次确认多户住宅是被单独分析的投资垂直。本节的作用，是界定 Flow 实际要进入的品类。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
