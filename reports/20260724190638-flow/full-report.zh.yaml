      - number: '7.3'
        title: 运营与组织执行风险
        blocks:
          - type: paragraph
            body: >-
              法律和人员招聘地图显示，管理层意识到合规和组织流程很重要。但为控制而招聘，不等于已经证明控制强。战略计划和业务拓展岗位意味着可选项，也抬高了过度扩张风险。高端服务模式会带来劳动力和服务质量风险，因为住户预期高，交付又高度依赖人。公开留存、投诉或单位经济性指标缺失，让这些风险难以被客观衡量。住房运营商还面对公平住房、住户安全和物业状况风险，这些风险会随版图快速放大。市场本身有周期性：租金增长、资产价值和融资条件都可能转向不利于
              Flow。如果奢侈需求走软，Flow
              的高端定位可能比大盘住房需求更快受压。租客价值共享叙事仍有产品和监管不确定性，因为公开细节稀少。本节重要，因为它把招聘和披露缺口转化为运营风险。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
