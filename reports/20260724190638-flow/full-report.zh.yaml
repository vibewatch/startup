      - number: '2.3'
        title: 买方分层与采用机制
        blocks:
          - type: paragraph
            body: >-
              NMHC 的最大业主排名显示，公寓所有权已经由规模化机构运营商主导。NMHC 的最大管理方排名也说明，物业管理的运营规模已集中在大型平台手里。Flow 在 Miami
              的美国版图瞄准的是高端子市场，而不是普通美国租客。Flow 的 Riyadh 扩张指向第二个需求池，受外籍人士、高端居住和 Vision 2030 需求影响。Vision 2030 为 Saudi
              房地产扩张和城市开发投资提供宏观叙事。Wikipedia 的住房危机条目捕捉了一个广泛公共框架：住房稀缺和负担能力仍是未解决的结构性问题。Wikipedia
              的多户住宅条目则在品类层面有助于区分公寓式住房和其他住宅形态。受限住房供给有利于 Flow
              的命题，因为稀缺可以支撑高端租金定位。同样的稀缺也会限制社会影响叙事，因为奢侈型产品并不直接解决广泛负担能力压力。本节的作用，是标出谁付钱、谁使用，以及公司选择在哪些地方下注。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
