              年估值上调说明，尽管公开运营披露很薄，投资人仍愿意继续押注创始人叙事。审阅过的公开来源没有披露收入、毛利率、入住率、NOI、烧钱速度或现金余额。Flow
              的条款和隐私页面能证明运营实体结构，但不是公开财务报表包。定价页面显示 Flow
