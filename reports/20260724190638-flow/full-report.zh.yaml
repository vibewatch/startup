              Saudi 计划，说明竞争也可能涉及区域开发合作，而不只是美国租赁品牌。上市 REIT 竞争者会发布详细财务，而 Flow 不会。机构既有玩家可以把技术和设施成本摊到远大于 Flow
              当前公开规模的组合上。Flow
              的差异化叙事依赖品牌策展和住户体验，而不是组合宽度。如果住户足够重视活动、酒店式服务和设计，愿意为租金价差买单，这套策略可以创造高端定价权。本节重要，因为它把创业公司先例和机构替代方案分开。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
