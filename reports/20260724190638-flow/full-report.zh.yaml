              显示品牌已延伸到长期公寓之外。Lever 招聘信息显示，法律、财务、人力和运营正在搭建。审阅过的官方页面没有披露董事会名单。审阅过的公开来源没有披露收入、入住率或 NOI。Flow
              的公开叙事混合了公寓、软件、酒店和媒体。招聘组合尤其重要，因为它说明一个真实运营平台正在组装；但它也意味着更高固定开销，并且需要比当前公开材料展示得更强的流程控制。实际来看，公司似乎正在搭建足以支撑更大扩张的企业基础设施，但外部观察者仍只能看到很薄的管理控制和财务节奏。
