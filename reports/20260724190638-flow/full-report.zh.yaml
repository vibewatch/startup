        blocks:
          - type: paragraph
            body: >-
              隐私政策中的 Saudi 和美国联系人意味着跨境合规复杂度。相比财务披露，公司在公开层面更容易通过房源、法律页面和招聘被看清。租客价值共享机制在公开来源中解释不足。Flow 当前可见产品家族包括
              App、公寓、酒店和出版物界面。Flow 的组织宽度指向平台运营商，而不是单一资产房东。公开记录支持野心和扩张，但还不支持可持续经济性。WeWork 历史仍是 Flow 最大的声誉阴影。当前公开证据支持把
              Flow 视为一家资金充足、已经上线、但披露不足的平台。投资人真正要尽调的问题，不是概念是否已经在市场上可见，而是治理、单位经济性和扩张控制是否足够扎实，能够支撑同一位创始人的又一次高溢价叙事。在 Flow
              发布更清晰的住户经济性或物业层面业绩指标之前，这家公司比起让人有把握地下投资判断，更容易被讲成一个故事。
