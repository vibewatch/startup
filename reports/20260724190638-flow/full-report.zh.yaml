      - number: '8.3'
        title: 乐观、基准和悲观情形框架
        blocks:
          - type: paragraph
            body: >-
              Equity Residential 的关于页面再次提醒，成熟运营商可以同时拥有高端品牌和深得多的运营披露。HUD 租房援助语境凸显，Flow
              的高端产品离住房需求中补贴最重、最受可负担性驱动的一端有多远。Blackstone 的房地产规模也提醒我们，成熟资本已经理解品牌化、体验驱动的住房。Flow
              因此不能只靠新鲜感维持溢价。公开数据足以说明，公司并非明显虚构，也不是尚未有产品。公开数据不足以说明 2025 年估值便宜。公开层面最稳妥的估值立场，是 Flow
              看起来偏贵，除非私有经济性另证其合理。乐观情形会主张，品牌、酒店式服务附加和跨境扩张，能在普通公寓之外创造多产品上行空间。基准情形会把 Flow
              估为高端公寓运营商：有一些服务上行空间，但披露仍然有限。本节重要，因为它框定了乐观、基准和悲观情形之间的场景跨度。证据足以描述公开图景，但不足以跳过对底层指标、治理和单位经济的尽调。
