companyProfile:
  summary: >-
    Flow 是 Adam Neumann 在 2022 年创立、总部位于 Miami 的私营住宅地产公司，把品牌化公寓社区、住户软件流程、酒店式服务和向 Riyadh 的国际扩张放在一起。公开证据支持几项事实：Andreessen
    Horowitz 大额支持、2025 年报道估值约 $2.5B，以及 South Florida 和 Saudi Arabia 多处物业已上线。公司看起来运营真实、战略野心很大，但公开财务披露、治理细节和住户经济性证据仍明显单薄。
  foundedDate: '2022-01-01'
