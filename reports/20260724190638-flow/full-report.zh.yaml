          - type: paragraph
            body: >-
              隐私政策里的跨境数据处理，又给运营合规增加了一层要求。Flow
              的核心声誉风险在于：拿出充分证明之前，外界可能把它视为又一个由个人魅力驱动的房地产叙事。目前最强的缓释因素，是融资能力、面向控制体系的招聘，以及已经上线的产品足迹。但这些缓释因素不能消除创始人、治理或执行风险。创始人依赖、奢华需求、地域扩张交叉处，风险最集中。即便公司继续推进运营，公开证据仍支持高风险评级。严肃尽调应优先核查治理权利、法律风险、资产层面的安全与合规，以及沙特合作方结构。核心风险问题是，Flow
              是否真的围绕创始人此前失败完成了制度化，还是主要指望靠速度跑过去。本节重要，因为它区分缓释信号与真正降险。证据足以描述公开图景，但不足以跳过对底层指标、治理和单位经济的尽调。
