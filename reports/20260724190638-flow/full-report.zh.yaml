      - number: '2.4'
        title: 约束、矛盾与可投资性
        blocks:
          - type: paragraph
            body: >-
              机构研究覆盖意味着买方、业主、贷款人和管理方都会影响市场采用，而不只是住户。Flow
              必须同时赢得租客需求和业主层面的资本纪律，因为多户住宅运营资本强度很高。这个市场不只是公寓，还包括运营、设施、承保、融资和服务层。Miami 和 Riyadh 显示 Flow
              正优先选择收入较高、设施密度高、品牌吸引力强的城市节点。采用约束包括租金负担能力、利率压力、审批摩擦，以及证明社区 ROI
              的难度。增长驱动因素包括住房稀缺、租客对便利性的需求，以及投资人对差异化多户住宅产品的兴趣。Flow 的 TAM 在品类层面很大，但受价格带和地理位置限制，可服务市场窄得多。公开来源支持真实市场机会，但不支持假设
              Flow 能解决大众市场住房短缺。本节重要，因为它把庞大宏观市场和狭窄可服务切口分开。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
