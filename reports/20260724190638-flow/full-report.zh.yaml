  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 既有运营商版图
        blocks:
          - type: paragraph
            body: >-
              Flow 首先竞争的是规模化公寓业主和管理方，而不只是软件创业公司。AvalonBay 是大型上市公寓运营商，拥有机构级社区和投资人披露。Equity Residential
              是另一家大型上市公寓运营商，拥有全国组合和上市公司报告纪律。Greystar 的平台规模让它比大多数 proptech 创业公司更适合作为运营基准。LivCor 位于 Blackstone
              的房地产生态中，代表规模化机构多户住宅模式。NMHC 业主和管理方排名显示，规模化公寓运营领域已经挤满机构既有玩家。Flow 的 Miami 和酒店界面暗示，它竞争的是品牌、设施和体验，而不是最低租金。Four
              Seasons 可作为有用的高端品牌参照，用来比较体验和住宅信号，尽管运营模式不同。Common 是一个传统共居参照，可用于理解社区导向多户住宅产品定位。本节重要，因为它建立了围绕 Flow
              的真实基准集合。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
