    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与使命
        blocks:
          - type: paragraph
            body: >-
              Flow 由 Adam Neumann 在 2022 年创立，总部位于 Florida 的 Miami。Flow 是一家住宅地产公司，而不是纯软件创业公司。a16z 在 2022 年 8 月宣布对 Flow 投入
              $350M 种子轮。公开报道在 2022 年给 Flow 的估值超过 $1B。TechCrunch 报道，2025 年公司以约 $2.5B 估值完成超过 $100M 的新一轮融资。公开披露显示，种子轮和
              Series B 合计融资至少约 $450M。Calcalist 把 Flow 描述成四支柱模型，横跨管理、所有权、金融服务和价值共享。Flow 的使命叙事围绕个体、邻里和自然世界的连接展开。放在一起看，Flow
              更像一家资本密集型运营公司，试图把生活方式品牌和住户体验变成差异化公寓产品，而不只是做一个数字市场。
