            title: 品类很大，但 Flow 的现实切口并不大
            body: 公开市场研究支持一个非常庞大的多户住宅品类，但 Flow 明显瞄准的是高端、服务密集型需求子集，而不是整个租赁市场。这个区分是理性 TAM 框架的关键。
