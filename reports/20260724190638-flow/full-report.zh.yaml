              也提醒投资人，公寓生意要看入住率、租金增长、费用和资产负债表结构。本节重要，因为它把公开可比对象转成 Flow 尚未公开满足的指标清单。证据足以勾勒公开图景，但还不足以跳过对底层指标、治理和单位经济性的尽调。
