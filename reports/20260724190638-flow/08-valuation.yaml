- id: stance
  title: Stance, confidence, and next diligence steps
  body: A bear case would argue the company is a richly priced private real-estate vehicle with founder-premium narrative risk. The valuation gap between those cases exists because public evidence does not settle margins, retention, or return on invested capital. Public comps can anchor downside discipline even if they cannot capture all of Flow’s optionality. Private markups without corresponding public KPIs should generally be treated with caution in 2026 markets. The right diligence move is to bridge the 2025 valuation to actual building-level economics and portfolio growth assumptions. If Flow can show strong occupancy, margin, and ancillary monetization, the current mark may prove fair. If it cannot, the valuation will look expensive relative to more transparent apartment operators. Because the company is private and opaque, valuation confidence should remain medium rather than high. Public evidence supports a real business, but not a clear margin of safety at the last reported price.
    The recommendation therefore should lean toward more research rather than immediate enthusiasm. This section matters because it turns the remaining uncertainty into a defensible stance rather than false precision. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
