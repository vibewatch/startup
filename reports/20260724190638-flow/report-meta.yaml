  topStrengths:
    - Strong capital backing and repeat support from Andreessen Horowitz.
    - Visible multi-property operating footprint across South Florida and Riyadh.
    - Differentiated brand and hospitality-oriented resident experience thesis.
    - Meaningful internal buildout across finance, legal, technology, construction, and operations.
    - Potential option value if premium apartments, software workflows, and adjacencies integrate successfully.
  topRisks:
    - WeWork founder overhang still shapes governance, partner, and investor trust risk.
    - Revenue, occupancy, NOI, leverage, and retention remain materially undisclosed in public sources.
    - Luxury customer concentration narrows the serviceable market and heightens downturn sensitivity.
    - Saudi expansion adds geopolitical, legal, and execution complexity early in the company life cycle.
    - The last reported $2.5B valuation screens stretched relative to transparent public multifamily benchmarks.
  unresolvedGaps:
    - Asset-level rent roll, occupancy, NOI, and leverage remain undisclosed.
    - Board composition, governance rights, and cap-table preferences remain private.
    - Resident renewal, NPS, complaint, and service-usage data are not public.
    - Saudi partner economics, entity structure, and return profile are not public.
    - The renter value-sharing or equity mechanism remains conceptually described but operationally under-documented.
disclaimer: This report is based on publicly available information as of 2026-07-24 and clearly distinguishes observed evidence from inference where Flow has not disclosed core operating metrics.
