companyProfile:
  summary: Flow is Adam Neumann’s privately held residential real-estate company, founded in 2022 and headquartered in Miami, that combines branded apartment communities, resident software workflows, hospitality-like services, and international expansion into Riyadh. Public evidence supports major backing from Andreessen Horowitz, a reported 2025 valuation of roughly $2.5 billion, and a live multi-property footprint across South Florida and Saudi Arabia. The company appears operationally real and strategically ambitious, but its public financial disclosure, governance detail, and resident-economics evidence remain materially thin.
  foundedDate: '2022-01-01'
  founders:
    - name: Adam Neumann
      role: Founder & CEO
      background: WeWork co-founder turned residential real-estate founder; central to Flow’s capital access, vision, and reputational overhang.
      claimRefs: [CO001, CR001, CV002]
  foundingLocation: Miami, Florida, USA
  headquarters: Miami, Florida, USA
  productSummary: Vertically integrated residential platform spanning branded apartment communities, resident app workflows, hospitality-style services, short-stay adjacencies, and selective media/community extensions.
  customerFocus: Affluent urban renters, premium Riyadh residents, and selected short-stay or business-travel users who value design, service, and community.
  businessModel: Asset-heavy branded multifamily operator monetizing rent, resident services, and adjacent hospitality or experience surfaces while exploring broader platform economics.
  stage: Series B private
  fundingStatus: $350M seed announced by a16z in 2022 and a reported >$100M 2025 round at roughly a $2.5B valuation; deeper economics and cap-table terms remain private.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO006, CI001, CI002, CV001, CE001, CU001]
summary:
  headline: Flow has real operating substance and unusual access to capital, but the public record still does not justify high-conviction comfort on governance, unit economics, or a $2.5B private valuation.
  overallScore: 5.8
