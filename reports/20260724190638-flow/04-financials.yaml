- id: benchmarks
  title: What public comps imply about the missing data
  body: The Jerusalem Post’s Canada Global item suggests Neumann has continued to make adjacent real-estate capital moves outside Flow’s core U.S. apartments. Expansion into Riyadh adds potential upside but also complicates any clean read on consolidated capital efficiency. Public pricing pages support the view that Flow is pursuing a premium rent band rather than a low-cost housing model. Premium rent positioning can support unit economics if occupancy and service attachment remain healthy, but those metrics are undisclosed. The company’s financial story is therefore driven more by funding rounds and valuation marks than by transparent operating KPIs. TechCrunch reported Neumann’s 2024 attempt to buy back WeWork, raising a question about managerial focus during Flow’s build phase. The market is being asked to trust the founder and backer base ahead of audited public economics. Job postings show the company is staffing for reporting and control, which is positive but not a substitute for
    actual disclosure. Public REITs also remind investors that apartment businesses are judged on occupancy, rent growth, expenses, and balance-sheet structure. This section matters because it turns public comps into a metric checklist Flow has not yet met publicly. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
