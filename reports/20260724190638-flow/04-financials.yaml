  - FI003
- id: asks
  title: Underwriting limits and required diligence asks
  body: Flow’s public materials do not yet offer that same metric stack. The 2025 round implies investors saw enough internal progress to reprice the company upward, but the evidence is private. That makes the current valuation hard to underwrite from public sources alone. Posted rents and geographic rollout indicate a functioning business, not a pre-launch concept. But functioning inventory is not equivalent to proven portfolio economics or attractive cash-on-cash returns. From a diligence perspective, the missing financial package is now the largest single gap in Flow’s public record. The company likely needs a private data room with occupancy, rent roll, margin, and asset-level performance to support serious underwriting. Public sources support an extremely well-funded private operator, but not a fully investable financial profile. This section matters because it converts the missing metrics into explicit diligence asks. The evidence is sufficient to describe the public picture, but not
    sufficient to skip diligence on the underlying metrics, governance, and unit economics.
