  - CI035
- calloutType: recommendation
  title: Treat any valuation view as provisional until asset-level data arrives
  body: The right next step is not another narrative debate about Adam Neumann. It is a private data-room review covering occupancy, rent roll, expenses, leverage, capex, and Saudi project returns by asset.
