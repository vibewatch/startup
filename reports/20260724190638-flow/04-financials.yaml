- id: signals
  title: Signals from staffing, pricing, and expansion
  body: Fortune’s 2023 report of roughly 150 employees implies a meaningful cost base even before Saudi expansion. Lever roles for strategic finance, accounting, and property financial control signal deliberate finance-function buildout. That hiring pattern is consistent with a company preparing for more complex asset, budget, and reporting needs. Public REIT comparators publish 10-Ks and investor materials that make Flow’s opacity especially visible. AvalonBay and Equity Residential provide a cleaner view of apartment economics than Flow currently does. Because Flow is private, the relevant question is whether the latest valuation already discounts strong property-level performance that outsiders cannot verify. A16Z’s original investment thesis emphasized community and experience more than near-term public financial metrics. That narrative orientation may help fundraising while delaying the moment when investors demand conventional multifamily reporting. Saudi reporting from TechCrunch,
    Forbes, Semafor, and The Real Deal signals geographic expansion that likely increases capital needs. This section matters because it shows where hiring and expansion imply complexity and cash needs. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CI010
  - CI011
