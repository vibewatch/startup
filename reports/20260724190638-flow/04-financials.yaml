chapter:
  number: 4
  title: Financials
  summary: Flow’s public financial story is dominated by two large funding marks—a $350M seed in 2022 and a reported $100M+ Series B in 2025—while revenue, occupancy, NOI, and cash-flow detail remain undisclosed. The result is a company that looks well capitalized but still difficult to underwrite from public evidence alone.
sections:
- id: funding
  title: Funding history and what is actually disclosed
  body: a16z announced a $350 million seed investment in Flow in August 2022. TechCrunch’s April 2025 coverage put a new round at more than $100 million and roughly a $2.5 billion valuation. The disclosed funding floor from public reporting is therefore roughly $450 million-plus. Vox treated the 2022 raise as unusually controversial given Neumann’s WeWork history. TechCrunch’s 2022 commentary likewise framed the seed round as a highly debated capital allocation decision. The 2025 valuation step-up implies investor willingness to keep backing the founder narrative despite thin public operating disclosure. No reviewed public source disclosed revenue, gross margin, occupancy, NOI, burn, or cash balance. Flow’s Terms and Privacy pages evidence an operating entity structure but not a public financial statement package. The pricing pages show that Flow has live inventory and posted rents, but not realized occupancy or revenue. This section matters because it separates funding visibility from operating
    visibility. The evidence is sufficient to describe the public picture, but not sufficient to skip diligence on the underlying metrics, governance, and unit economics.
  claimRefs:
  - CI001
  - CI002
  - CI003
