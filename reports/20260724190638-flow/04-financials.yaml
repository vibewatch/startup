callouts:
- calloutType: risk
  title: Funding visibility exceeds operating visibility
  body: Flow’s public record makes it easy to verify large financing events, but much harder to judge the economics of the apartment portfolio behind them. That imbalance is the core financial diligence problem.
  claimRefs:
  - CI001
  - CI002
  - CI003
