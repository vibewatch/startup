  topStrengths:
    - 资本后盾强，Andreessen Horowitz 多轮跟投。
    - 南佛罗里达和利雅得的多物业运营足迹清晰可见。
    - 品牌定位有差异，押注以酒店式体验重塑住户体验。
    - 财务、法务、技术、施工和运营等内部能力已实质搭建。
    - 如果高端公寓、软件工作流和相邻业务能顺利打通，仍有可观期权价值。
  topRisks:
    - WeWork 创始人阴影仍在影响治理、合作伙伴和投资人信任风险。
    - 收入、入住率、NOI、杠杆和留存等关键指标在公开来源中仍严重缺失。
    - 奢华客群集中缩窄可服务市场，也放大下行周期敏感度。
    - 公司早期就推进沙特扩张，带来地缘政治、法律和执行复杂度。
    - 最近披露的 $2.5B 估值，相比透明的公开多户住宅基准显得偏高。
  unresolvedGaps:
    - 资产级租金表、入住率、NOI 和杠杆仍未披露。
