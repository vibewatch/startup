  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Customer quotes, statements of work, or procurement records showing realized price per site, pallet, or throughput unit for Mytra, Symbotic, AutoStore, Exotec, and incumbent pallet integrators.
    whyItMatters: Pricing transparency is the biggest blind spot in the public landscape and directly affects whether Mytra is differentiated enough to defend gross margin.
    diligencePath: Request anonymized customer proposals, win-loss quote sheets, and any public RFP awards from named reference customers.
    relatedQuestionRefs: [QP023]
    relatedTableRefs: [TP003]
  - type: private-evidence-only
    severity: material
    topic: live-site-roi
    missingEvidence: Live-site payback, labor-dollar savings, uptime, and utilization metrics from named customer deployments across the closest peers.
    whyItMatters: Public case studies are promotional and do not reveal whether Mytra's workflow breadth translates into superior economics versus adjacent substitutes.
    diligencePath: Ask for customer business cases, post-go-live KPI dashboards, and renewal materials from at least one Mytra site and two rival sites.
    relatedQuestionRefs: [QP024]
    relatedTableRefs: [TP003]
  - type: missing-source
    severity: minor
    topic: adverse-peer-failures
    missingEvidence: Public post-mortems, lawsuit outcomes, or contract termination records involving the shortlisted vendors in pallet-heavy deployments.
    whyItMatters: The chapter can identify structural risks, but a fuller adverse ranking would improve if comparable deployment failures were public and attributable.
    diligencePath: Search court dockets, procurement disputes, insurer claims, and local-news coverage around named sites and counterparties.
    relatedQuestionRefs: [QP025]
    relatedTableRefs: [TP004]
