- id: FP004
  title: Switching-barrier journey by deployment model
  type: journey-map
  layout: wide
  summary: The most practical competitive threat to Mytra is that buyers can start with narrower AMR or tote-based automation and still accumulate software, integration, and operating lock-in before a full-pallet rebuild becomes urgent.
  data:
    nodes:
    - label: 1. Problem framing
      detail: Buyers first decide whether the pain is dense full-pallet storage, pallet transport labor, or high-SKU case and tote fulfilment. That framing already changes whether Mytra, incumbent pallet AS/RS, Ocado Porter, or HaiPick make the shortlist.
      tone: neutral
    - label: 2. Pilot path
      detail: Brownfield pilots usually start with the lowest-disruption option such as transport AMRs, Ocado Porter-style pallet movers, or tote-based goods-to-person cells, because they need less facility redesign than a new full-pallet architecture.
      tone: risk
    - label: 3. Software anchor
      detail: Once a vendor owns WMS or WES hooks, robot orchestration, task logic, and exception handling through layers such as Ocado IQ, HaiQ, LocusONE, GreyMatter, SynQ, or Symbotic software, switching costs rise even if hardware remains modular.
      tone: risk
    - label: 4. Go-live and retraining
      detail: Incumbents and public peers benefit from field-service playbooks, named references, and partner coverage that reduce buyer anxiety during rollout and staff retraining.
      tone: risk
    - label: 5. Expansion decision
      detail: After go-live, buyers often expand the platform already embedded in maintenance, labor planning, and workflow data unless a new system produces a step-change in pallet density, sequencing, or economics.
      tone: risk
  approximationNotes: Journey stages are qualitative and show where adjacent solutions can intercept the buying process before a Mytra-style full-pallet decision is made.
