evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: Full board roster, ownership concentrations, voting rights, and investor protective provisions.
    whyItMatters: >-
      Control rights and governance concentration determine how much strategic leverage founders, new investors, and
      strategic investors actually hold.
    diligencePath: Request the latest board observer list, charter documents, and cap-table summary with preferred-share rights.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact 2026 Series C post-money valuation and any secondary component or preference-stack reset.
    whyItMatters: >-
      An exact valuation is needed to judge dilution, price discipline, and whether headline capital raised translated
      into an efficient step-up.
    diligencePath: >-
      Request the signed Series C term sheet, board consent, and any investor-mark memo that describes the round
      mechanics.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A primary-source employee count reconciled against the 100-person June 2025 disclosure, the 78% 2025 growth claim,
      and Tracxn’s May 2026 estimate.
    whyItMatters: >-
      Hiring velocity is a proxy for deployment readiness, burn, and management control, and the public file still
      relies on mixed official and secondary signals.
    diligencePath: Ask management for a month-end headcount bridge by function from June 2025 through June 2026.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Revenue, ARR, gross margin, and contract economics for Albertsons and the unnamed enterprise deployments.
    whyItMatters: >-
      Without operating metrics, it is impossible to test whether strong deployment claims translate into software-like
      recurring economics or hardware-heavy services revenue.
    diligencePath: >-
      Request a customer-by-customer revenue bridge, backlog schedule, and gross-margin view for current deployments and
      near-term pipeline.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      A fuller public chronology for every intermediate pilot, customer launch, and internal leadership hire between
      July 2024 and January 2026.
    whyItMatters: >-
      The milestone table is intentionally selective, but later refreshes should add more dated operating events so
      growth pacing can be assessed without relying on summary language.
    diligencePath: >-
      Ask management for a dated milestone list covering customer go-lives, leadership hires, and facility changes, then
      reconcile it to public announcements.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: mytra-unit-economics
    missingEvidence: Site-level capex, throughput, payback, and service metrics for named Mytra deployments.
    whyItMatters: >-
      Without deployment economics, broad market size cannot be translated into a believable revenue-capture or margin
      model.
    diligencePath: Request pilot and production scorecards from Mytra and named customers such as Albertsons under NDA.
    relatedQuestionRefs:
      - QM024
      - QM027
  - type: missing-source
    severity: material
    topic: vertical-mix
    missingEvidence: Named customer or revenue mix between grocery, food, and industrial distribution accounts.
    whyItMatters: >-
      The right valuation multiple depends on whether Mytra is concentrated in one vertical or already diversified
      across pallet-heavy segments.
    diligencePath: Request a customer pipeline and booked-deployment mix by vertical, node type, and workflow.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: tam-scope
    missingEvidence: >-
      A single apples-to-apples market map that isolates pallet ASRS and brownfield pallet orchestration from broader
      automation categories.
    whyItMatters: >-
      Analyst ranges are directionally useful but still too broad to serve as a direct TAM, SAM, or SOM stack for
      underwriting.
    diligencePath: >-
      Ask management or an industry expert to reconcile broad warehouse automation, ASRS, and pallet-only categories in
