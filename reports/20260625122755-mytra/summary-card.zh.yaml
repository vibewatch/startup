  topStrengths:
    - 产品卡位清楚，聚焦全托盘存储、缓冲和排序，而不是只做泛化 AMR 搬运。
    - 一线资本和产业方背书够硬，包括 Avenir Growth、Eclipse、Greenoaks、Lineage、RyderVentures，以及进入董事会的 Zach Kirkhorn。
    - 商业化信号真实：Albertsons 已有部署验证，2025 年更大规模试点和生产上线推进中，Brisbane 也有 100,000 平方英尺设施。
  topRisks:
    - 收入、毛利率、定价模式、烧钱速度和 runway 均未披露，仅靠公开资料无法承销单位经济性。
    - 客户集中度和留存仍不透明；Albertsons 是唯一明确具名客户，其他大客户还没有公开姓名。
    - 如果第三方约 $2B 的估值估算大体仍有效，入场价可能已经预设了规模化成功，而公开证据还没有完全证明这一点。
  unresolvedGaps:
    - Series C 精确投后估值、股权结构条款和清算优先权未公开披露。
    - 公开资料没有收入、毛利率、积压订单或现金 runway 数字，无法承销资本充足性。
    - 除 Albertsons 和未具名 Fortune 100/500 引用外，具名客户覆盖面、ACV 集中度、续约行为和部署经济性仍不透明。
    - 正式安全认证、网络安全保障材料和经审计 SLA 表现未公开披露。
