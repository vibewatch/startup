callouts:
- calloutType: strength
  title: Distinctive full-pallet architecture is the clearest moat in the public file
  body: Mytra’s best-supported advantage is not simply “warehouse robotics” in the abstract; it is a software-defined full-pallet system that combines 3D movement, simpler perimeter integration, and a structure that can be reshaped without rethinking the whole site. Public customer proof at Albertsons makes that more credible than a purely conceptual demo story.
  claimRefs:
  - CO003
  - CO004
  - CO018
  - CO025
  - CO035
- calloutType: risk
  title: Execution risk is more visible than valuation discipline
  body: The company has credible momentum, but public materials still do not disclose revenue, ARR, or a precise Series C post-money valuation. Because the service-led model pushes uptime and delivery risk back onto Mytra, investors are effectively underwriting execution quality without much public economic disclosure.
  claimRefs:
  - CO040
  - CO041
  - CO042
- calloutType: insight
  title: The 2025 storyline is a transition from stealth R&D to scaled deployment readiness
  body: 'The CFO hire, Brisbane facility move, board expansion, and 2026 investor mix all point to the same transition: Mytra is trying to professionalize around larger, more visible deployments rather than remain a founder-led prototype effort. That transition is strategically positive, but it raises the bar for capital efficiency and governance transparency.'
