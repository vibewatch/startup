- id: funding-investors-and-scale
  title: Funding, Investors, and Scale Signals
  body: 'Mytra’s capital story is unusually clear on round sequence but still incomplete on valuation mechanics. The company launched publicly in July 2024 with $78 million raised through the Series B stage, with Greenoaks leading the B round and Eclipse leading the seed and Series A. Tracxn adds a more granular round history, showing a 2023 Series A and a 2024 $50 million Series B before the January 2026 Series C. The major current event is the $120 million Series C closed on January 15, 2026 and led by Avenir Growth. New investors Kivu Ventures, Liquid 2, D. E. Shaw, and Offline Ventures joined existing backers Eclipse, Greenoaks, Abstract Ventures, and Promus Ventures, while strategic investors Lineage and RyderVentures added supply-chain signaling value.


    Total funding is best described as approximately $198 million to just over $200 million depending on source conventions: Tracxn shows $198 million across four rounds, while Mytra-aligned and trade-publication coverage rounds that number up to “over $200 million.” The difference looks more like rounding than a substantive contradiction, but exact capitalization still needs confirmation. Scale signals were stronger than the valuation disclosure itself. January 2026 sources said Mytra had signed a deployment 60 times the size of its prior largest installation in 2025, shipped two pilot systems, gone live at a new customer site, and kept hiring after growing the team 78% during the year. Public valuation remains the weakest part of the file: Tracxn lists a $2 billion current valuation, but official round materials did not publish an exact post-money number.'
