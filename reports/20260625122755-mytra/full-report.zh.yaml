      - number: '7.3'
        title: 运营、部署与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Mytra 承担的是一组难度很高的风险配置：重载搬运、棕地仓库集成，以及把失败成本推回供应商的服务主导承诺。官网宣传 3,000 磅提升能力、99.999% 正常运行时间和每小时 150
              次呈现，这些主张很亮眼，但也提高了安全、维护和降级模式恢复的举证门槛。同一组公开记录显示，公司正在快速扩张：更大的 Brisbane
              场地、强调测试和验证、两个试点已交付，并招聘安全系统、技术项目管理、运营和工程岗位。这符合一家仍在强化部署可重复性的公司特征。行业证据说明了为什么这很重要。Modern Materials Handling 的
              2026 年研究称，买方如今高度重视正常运行时间、快速响应和集成兼容性；DC Velocity 则说，大多数工业设施仍然零自动化，因为成本、复杂性和缺乏灵活性仍是障碍。CEO Today
              把核心经济性讲得很清楚：在机器人即服务中，维护、正常运行时间和系统演进都变成供应商义务，因此部署失误会打击续约、利润率和估值，而不只是客户的运营问题。实际读法是，Mytra
              的缓释因素真实存在——新资金、测试空间、招聘和专利——但在出现更多公开投产客户背书、更强保障材料，以及大型安装能在不侵蚀利润率的情况下被支持之前，剩余运营风险仍高。
