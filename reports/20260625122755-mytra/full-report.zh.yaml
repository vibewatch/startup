  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Mytra
              的产品应按客户工作流来定义，而不是按单个机器人来定义。公开材料反复把系统呈现为三个组件——机器人、软件和存储单元——用于自动化移动和存储物料这一常见工业任务。对一家早期机器人公司而言，具名工作流异常具体：托盘拣选、箱拣、码头缓冲和越库。这很重要，因为这些不是投机式
              AI
              用例，而是食品杂货商、零售商和工业配送场地内最高频的托盘和箱级移动。产品承诺是，仓库运营方可以用一个可配置的三维基底，替代依赖通道的叉车运动；该基底接收、存储、排序并把库存释放到出库流程。独立报道进一步证明，Mytra
              已围绕真实运营任务定义系统，例如为 Albertsons 配送中心缓冲和排序库存，而不是围绕通用仓储自动化叙事。客户工作流还保留了外围兼容性。Mytra
              称叉车、托盘车、人员和其他机器人仍可在结构外侧作业，这降低了棕地设施的采用摩擦。这在战略上重要，因为产品并不要求客户丢掉所有相邻物料搬运流程。相反，它试图成为高流量托盘和箱级移动的可编程中间层，同时上游和下游处理仍可保持混合。因此，尽调结论正面但有边界：工作流定义清楚，但客户特定集成细节在公开来源中仍然偏薄。
