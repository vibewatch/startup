        - 基准情形支撑看起来低于第三方 $2B 锚点，因此价格纪律比泛泛热情更重要。
    notes: 这张表区分公司质量和承销质量。公司可以不错，但进入价格仍可能过于不透明，无法背书。
    claimRefs:
      - CV001
      - CV008
      - CV011
      - CV013
      - CV040
      - CV041
