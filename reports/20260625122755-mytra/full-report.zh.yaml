        title: 成本结构、利润率驱动与单位经济性
        blocks:
          - type: paragraph
            body: >-
              公开证据强烈暗示，Mytra 的成本基础是多层的，而且偏硬件服务。Brisbane 总部公告称，100,000 平方英尺工厂支持一个 100 人团队进行搭建、研发和现场客户演示；公司页面后来把员工数四舍五入为
              150+，招聘页显示商业、硬件、运营和 G&A 都在招人。这种组合不符合轻量软件成本模型。它反而意味着现金会花在装配或制造协同、验证环境、现场部署人工和持续客户支持上。Mytra 自身 ROI
              主张方向上有吸引力：官方材料称物料搬运人工降低 32%、存储密度提升 34%；独立发布报道则重复了最高节省 88% 工时、内部收益率为同类最佳方案两倍的说法。这些结果解释了客户为何购买，但没有揭示 Mytra
              能赚什么。公开可比公司可帮助划定区间。Symbotic 最新申报显示，其收入结构偏系统，毛利率为 20% 出头，并有大量库存、未开票应收、递延收入和物业设备需求。相比之下，AutoStore 报告接近 70%
              的毛利率，并依赖集成伙伴负责设计、安装和服务。Mytra 的公开足迹更接近直接部署端，而不是伙伴主导端；这意味着服务责任和现场复杂度，可能比软件毛利率理论更重要。
