  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与分层
        blocks:
          - type: paragraph
            body: >-
              Mytra 真正的竞争集合比通用仓储机器人厂商名单更窄。它自己的应用地图围绕托盘拣选、箱拣、码头缓冲和越库；The Robot Report 的 RBR50 资料则把产品定义为在密集存储阵列中移动并取回
              3,000 磅整托盘。这意味着，直接可比集合应由需要在一个系统里完成整托盘存储、排队和排序的买方来定义，而不是所有辅助拣选或托盘车机器人供应商。按这个定义，Symbotic 是最强的规模化直接基准；Dematic
              和 Swisslog 是最清楚的在位托盘自动化替代；AutoStore 和 Exotec 是战略上重要的相邻 AS/RS 可比；Seegrid、MiR、Locus 和 GreyOrange
              则是在同一仓库中替代离散任务的方案，而不是完全一一对应的替代品。

              采购含义是，Mytra 处在固定基础设施和棕地 AMR
              之间。它承诺的运营系统角色比运输机器人更宽，但仍缺少公开同行的装机基础、渠道杠杆和经审计披露。因此，只有当买方对密集整托盘存储加缓冲和越库控制的重视，超过在既有流程上叠加运输
              AMR、编排软件或在位托盘系统这条低风险路径时，Mytra 才有真实切入点。这个细分有意义，但不能只靠品类叙事防守。
