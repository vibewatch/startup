      - number: '5.4'
        title: 差异化、IP 与工程 know-how
        blocks:
          - type: paragraph
            body: >-
              Mytra
              的差异化逻辑可信，因为它有多层。在产品层面，多个来源称公司试图去掉叉车、输送机、电梯和单点机器人带来的硬件复杂度与设施僵硬性。在系统层面，差异化来自一个主张：物料流可以抽象成移动、存储、拣选、路由这些原语，从而让物理运营变得可编程。在工程诀窍层面，公开证据显示，公司的护城河不是某一个神奇算法，而是机器人运动、存储网格几何、运动规划和动态再平衡的协同设计。这类诀窍比单一机器人形态更难商品化。IP
              记录支持这一解读。Justia 的受让人和发明人页面显示，Mytra 在 2025 年获得多货架存储和动态再平衡授权专利，并在 2026 年公布了围绕存储自动化、从任意单元到任意单元的 3D
              导航、统一物料存储和运输的申请。即使看不到内部权利要求图，公开专利集也有方向性价值：它围绕网格、机器人和编排问题聚集。尽调提示是，公开 IP 证据更多说明机械和控制架构，而不是定价权、数据网络效应或客户切换成本。
