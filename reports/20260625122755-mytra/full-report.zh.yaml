        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事比运营故事清楚。公开层面，Mytra 至少能支撑 $198M 的累计融资：公开亮相时披露至 Series B 的 $78M，加上后来的 $120M Series C；公司官网现在将其四舍五入为
              $200M。最新融资明确定位为部署扩张和人才资金，这与可观察足迹吻合：更大的工厂、更快的员工增长、更高级的财务领导层，以及仍在开放的岗位。这足以说明 Mytra
              眼下并不缺资本。但这不足以证明现金续航。已审阅公开来源没有披露手头现金、月度烧钱、债务、设备融资或项目融资义务。这个缺口重要，因为硬件部署业务往往会在收入完全转化前吞掉营运资本，尤其当客户要求正常运行时间承诺、定制现场准备或较长验收周期时。Symbotic
              的申报是有用的警示类比：即使达到规模，仓储自动化经济性仍可能包含大量库存、未开票应收和递延收入余额。Mytra 可能更小，结构也不同，但方向足够相似，不能随意乐观假设。可支持的结论是，Series C
              很可能买来了时间和可信度；但下一轮融资仍将取决于可复制部署、服务可靠性和实际收入转化，而不是叙事本身。
