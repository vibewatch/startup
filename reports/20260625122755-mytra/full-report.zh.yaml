      - number: '8.2'
        title: 可比框架与公开市场锚点
        blocks:
          - type: paragraph
            body: >-
              Mytra 没有公开披露收入或现金流输入，因此最干净的估值框架是相对估值，而不是公式化估值。公开仓库自动化可比公司跨度很宽。Symbotic 是高端结果：市值约 $24B，过去十二个月收入约 $2.5B，2026
              年 Q2 净利润为正，现金 $2.0B，EV/sales 约 8.6x。AutoStore 提供了更紧凑但仍强的基准：市值约 $4.1B，过去十二个月收入约 NOK 6.0B，毛利率高于 70%，EV/sales
              接近 7.1x。Ocado 是谨慎的反向参照：尽管有技术能力且成交量继续增长，其公开市值只有约 $2.0B，EV/sales 更接近 1.8x，背后是多年资本密集性质疑和站点合理化。Daifuku
              则展示了物料搬运领域现有巨头的规模形态，但其多元化、成熟业务更像底部参照，不是创业公司天花板。


              这个含义很重要。当投资者能看到规模、盈利轨迹、装机基础耐久性和资产负债表强度时，公开市场愿意为自动化企业支付高倍数；当这些证明缺失，或资本强度主导叙事时，同一品类也会被大幅重估。Mytra
              目前披露还不够，无法自信地把自己放到这条光谱上的某一点。即便私有追踪机构层也不稳定：Tracxn 显示约 $2B，Premier Alternatives 显示 $565M，凸显任何单一 Mytra
              标记都缺少公开支撑。因此，字面做收入倍数练习会制造虚假精确。可比公司的正确用法是划定护栏：Symbotic 是高端证明案例，AutoStore 是盈利平台案例，Ocado 是压缩案例，Daifuku
              是现有巨头规模案例。Mytra 仍处在这些端点之间，公开披露太少，无法声称自己属于区间高端。
