  - id: TP004
    title: 护城河耐久性 / 竞争风险登记
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓解 / 尽调问题
    rows:
      - - 全托盘工作流利基
        - 既有托盘系统已经自动化存储、缓冲和 WIP 流
        - 高
        - Dematic 和 Swisslog 公开的托盘流能力，覆盖了大量相同买方痛点
        - 要求提供赢单 / 输单数据，说明开放周边架构在实际经济性上如何胜过既有托盘 AS/RS
      - - 缓冲与排序差异化
        - Exotec 正把集成缓冲和出库排序内化到相邻的 AS/RS 工作流中
        - 高
        - 新一代 Skypod 增加缓冲和排序，并声称密度与吞吐量大幅提升
        - 当买方问题是混合箱拣加托盘流、而不是纯托盘存储时，验证 Mytra 是否仍然胜出
      - - 硬件独特性
        - Locus 和 GreyOrange 可能把买方注意力转向混合硬件车队之上的编排层
        - 中高
        - 两家厂商都在营销大规模多机器人或多站点编排能力
        - 测试 Mytra 能否掌控控制层，或开放 API 让自己留在编排栈内
      - - 渠道与装机基础不足
        - AutoStore、Dematic 和 Swisslog 已有合作伙伴或既有客户触达，可缩短销售周期
        - 高
        - AutoStore 披露 1,950+ 套系统和合作伙伴模式；排名资料把 Dematic 和 Swisslog 描述为全球集成商
        - 要求提供 Mytra 当前部署数量、渠道计划，以及直销不靠转售商杠杆也能规模化的证据
      - - 定价权
        - 大客户可借公开同业合同和既有厂商报价压价
        - 高
        - Symbotic 的 Walmart 披露显示成本加成式实施经济性和长期支持条款
        - 获取真实报价对照或已签 SOW，测试 Mytra 是在出售溢价能力，还是靠服务换增长
      - - 服务主导的信任模型
        - 厂商负责制提升买方吸引力，但把毛利率和续约风险集中到 Mytra
        - 高
        - CEO Today 认为，服务模式把正常运行时间和集成风险转给厂商，一次糟糕部署就可能伤及续约
        - 在把经常性收入视为耐久之前，审计 SLA、验收标准、准备金政策和升级处理手册
      - - 架构与 IP 护城河
        - 存储自动化 IP 争议多，且大玩家会执行权利
        - 中
        - AutoStore 提到 3,800+ 项已授权专利和专利申请，并引用 Ocado 和解
        - 在假定 Mytra 的机械路径不可挑战之前，复核专利版图和自由实施工作
    notes: 严重性是作者基于证据的判断：未来一至三年内，哪些因素可能削弱 Mytra 的差异化或商业议价力。
