chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品系统
        blocks:
          - type: paragraph
            body: >-
              Mytra 不应被理解为单点机器人供应商，而更像一家软件定义的仓储机器人公司。官方材料始终把公司放在一个工业任务里：移动和存储物料；系统架构由机器人、可重复的存储单元结构和软件拼成。物理设计很关键，因为
              Mytra 瞄准的是整托盘物料流，而不只是料箱级履约自动化。公开发布、官网和功能报道都指向同一点：系统能在三维空间移动，并处理最高 3,000
              磅负载。这正是食品杂货商、零售商和其他托盘密集型运营方关注它的核心原因。


              这个运营概念呈现得异常简单，尽管底层机械并不简单：软件编排货物放在哪里、机器人怎么走、仓库布局如何随时间重配；硬件则让外围继续对叉车、托盘车、人员和其他机器人开放。Mytra
              因此更像一个可编程基础设施层，而不是一个固定自动化单元。公开具名工作流包括托盘拣选、箱拣、码头缓冲和越库，这也解释了为什么 Albertsons
              成为公司最清晰的早期验证点。价值主张不只是减少人工，还包括更高密度存储、更好的排队，以及收回传统叉车所需的大量通道空间。
