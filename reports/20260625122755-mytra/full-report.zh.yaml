      - number: '5.5'
        title: 信任、安全、安保与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任与合规是公开材料最弱的地方。Mytra
              已审阅公开控制披露真实存在，但范围很窄：用于安全导航的传感器和冗余；把网站和应聘者数据与客户处理数据区分开的隐私政策；把实际产品义务推入客户合同的网站条款；以及对需求、风险、测试、安全系统工程和质量招聘的可见内部重视。对一家工业机器人公司而言，这些信号比只有落地页的初创公司更好。但尽调不应把它夸大成正式保证。已审阅来源没有列出网络安全认证、安全认证、独立正常运行时间审计、仓储设备标准或详细安全白皮书。没有公开
              SLA、MTBF 数据集、客户参考架构或事故历史来解释 99.999% 正常运行时间或每小时 150 次呈现如何测量。缺失不代表控制不存在，但这是实质尽调缺口，因为 Mytra
              销售的是服务主导的自动化模式，正常运行时间和集成责任仍留在供应商身上。对企业买方来说，信任包大概率要在尽调室和客户合同中证明，而不能从公开营销中推断。
