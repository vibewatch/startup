  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Mytra
              的公开客户材料范围窄，但内在一致。最清楚的可观察切入点是企业级食品杂货和托盘密集型配送；官方、行业和客户相邻来源都指向同一个运营问题：在大型设施内移动、存储、排序和取回托盘或箱货。官网和发布报道反复描述托盘拣选、箱拣、码头缓冲和越库工作流，这意味着买方更可能在仓库运营、供应链工程或配送领导层，而不是
              IT 主导或开发者主导预算。公开来源也支持一种用户画像：它包括地面操作员和相邻物料搬运团队，因为系统明确设计为在外围与叉车、托盘车、人员和其他机器人交接。


              这种分层仍然更偏定性，而非定量。最强的可见垂直证据是食品杂货配送中的 Albertsons；2026 年后续材料只新增了一家未具名 Fortune 100 食品公司和一家未具名 Fortune 500
              工业用品分销商。Deloitte 和公司自有页面也把框架拓宽到制造业和工厂物料流，但公开部署讨论仍主要停留在北美仓库场景。因此，本章把地理、客户数量和多站点推广深度视为证据缺口，而不是已解决事实。Mytra
              显然在向大型工业运营方销售，但公开记录尚未揭示这一叙事背后到底有多少买方、站点或国家。
