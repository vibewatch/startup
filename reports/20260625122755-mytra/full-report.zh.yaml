      - number: '3.2'
        title: 直接同行与在位厂商
        blocks:
          - type: paragraph
            body: >-
              Symbotic 是最难绕开的外部基准，因为它把密集存储仓储自动化、箱级处理，以及与 Walmart 的超强战略绑定结合在一起。公开披露显示，其优势不只是产品宽度，还有真实合同杠杆：截至 2025
              年末，Walmart 持有 Symbotic 约 13% 股份，拥有董事会观察员权利，承诺采购 400 套微履约系统并可选择再采购 200 套，还同意一项 $520M 开发计划。Mytra
              销售的产品形态并不完全相同，但这就是规模化对手可获得的买方信任和合同控制水平。AutoStore 在整托盘存储上没那么直接，却具有战略重要性，因为其渠道模式已覆盖 1,950 套系统、65+ 个国家和
              1,300+ 个独立客户。对 Mytra 来说，渠道架构可能和机器人架构一样重要。

              Exotec、Dematic、Swisslog 和 Geek+ 构成其余严肃可比集合。Exotec 新一代 Skypod 现在捆绑集成缓冲、出库排序以及逐件加箱级拣选，缩小了 Mytra 的一个叙事优势，尽管
              Exotec 仍以箱级为中心，而非原生 3,000 磅整托盘自动化。Dematic 和 Swisslog 代表在位厂商答案：项目制托盘自动化，覆盖 WIP 缓冲、成品处理，并拥有长期集成历史。Geek+
              更接近相邻同行，但其托盘到人系统可处理整托盘和混合品项拣选，因此一旦买方更重视柔性拣选而非 Mytra 特定存储几何，它就会变得相关。
