  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Mytra 应放在仓储自动化的一个窄切片里，而不是所有机器人或物流软件品类。Research and Markets 对仓储自动化的定义足够宽，涵盖输送和分拣系统、ASRS、移动机器人、WMS 和 AIDC；但
              Mytra 已披露的产品形态更接近整托盘 ASRS 加编排，而非通用仓储软件或包裹机器人。BLS 对仓储和存储的定义也重要，因为它说明 Mytra
              要自动化的运营环境：存储货物，并提供库存控制、包装、拣货包装和运输安排等物流服务的设施。公开可比部署进一步划定边界。Albertsons、Walmart
              和其他食品杂货商正在为密集型区域配送中心采购托盘和门店补货自动化；McKinsey
              则把这些用例与电商逐件拣选夹层和微履约系统区分开。因此，纳入支出覆盖托盘存储、取回、缓冲、排序和棕地改造控制；排除支出包括仅面向包裹的拣选、仅 WMS 预算，以及仍作为现状替代方案的人工叉车队。
