      - number: '6.3'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Mytra 客户故事里披露最少的是耐久性。公开资料暗示了先落地再扩张的逻辑：同一套模块化系统可以先从一个工作流切入，再延伸到相邻的托盘、箱件、码头缓冲或交叉转运任务；Series C
              材料也明确说，新资金将用于按客户需求扩大部署。Lineage、RyderVentures
              等战略投资方也可能扩大公司接触重物流客户的通道。但审阅资料没有披露定价、合同期限、NRR、GRR、流失率、队列留存，甚至没有给出活跃站点的基本数量。因此，公开证据支持扩张可能，不支持留存确定性。


              因此，负面档案更多是结构性，而不是由事件驱动。CEO Today 关于 RaaS 的分析认为，Mytra
              的服务主导模式让客户续约更脆弱，因为正常运行时间、集成和吞吐失败都由供应商承担，而不是买方承担。Allianz 的通用集中度框架也给出一个有用基准：一旦单一客户贡献收入达到或超过
              20%，定价权和估值韧性可能迅速恶化。Albertsons
              是唯一具名的投产客户，其他旗舰账户仍未具名，所以集中度风险不能忽略。同时，抓取来源没有出现具名失败部署或明确流失事件；负面证据更多指向耐久性证明缺失和模式敏感性，而不是已确认的客户流失。这样的组合意味着，尽调团队在承销粘性之前，应把客户访谈、合同形态和账户集中度放在核心位置。
