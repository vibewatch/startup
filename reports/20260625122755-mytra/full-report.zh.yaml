        - 初始系统销售加长期服务协议
        - 低
        - 合作伙伴主导的分销、安装和支持模式
        - 装机生态、合作伙伴交付所有权，以及同一平台内模块化扩展
        - 公开年报和极大的装机基础
      - - Exotec
        - 定制化项目采购，随时间模块化扩展
        - 低
        - 由设计和执行团队支撑的直接方案销售
        - 缓冲、排序和箱件 / 单件工作流逻辑一经配置就会嵌入
        - Komar 等具名项目，但公开披露仍有选择性
      - - Dematic / Swisslog
        - 经典项目制资本自动化，加软件和服务
        - 低
        - 直接企业销售，集成周期长，既有关系深
        - 深度 WMS、控制、设施布局和维护集成
        - 全球集成商品牌和长期客户案例历史
      - - Seegrid / MiR
        - 设备主导的 AMR 销售，配套软件车队管理和支持
        - 低
        - 直接或渠道主导 AMR 销售，进入存量站点
        - 车队软件、交通规则和流程重设计形成中等粘性
        - 试点路径比完整 AS/RS 更容易，但工作流所有权更窄
      - - Locus / GreyOrange
        - 软件主导编排，叠加在 AMR 和其他自动化之上
        - 低
        - 直接企业软件和机器人销售动作
        - 编排层可以掌握工作流数据、任务分配和跨供应商逻辑
        - 信任更多取决于集成广度和具名站点案例，而不是硬件新颖性
      - - 内部自建 / 维持现状
        - 叉车、托盘搬运车、WMS 规则和定制集成工作
        - 人工费率和设备成本可见度高；真实系统总成本可见度低
        - 内部工程和操作员流程设计
        - 既有用工习惯和低初始扰动拖慢供应商替换
        - 熟悉度高，但存储密度和排序能力仍弱
    notes: 整个行业几乎没有公开定价。因此，表格聚焦合同形态、GTM 路径和切换成本的实际来源，而不是假装存在可比标价。
