  - id: TM002
    title: TAM/SAM/SOM 或规模测算视角表
    columns:
      - 视角
      - 发布方 / 年份
      - 地理 / 范围
      - 数值
      - 方法 / 纳入口径
      - 置信度
      - 局限
    rows:
      - - 广义仓库自动化视角
        - Mordor Intelligence / 2026
        - 全球
        - '2026: $34.17B; 2031: $65.74B; CAGR 13.98%'
        - 将仓库自动化作为宽品类统计，包含机器人、软件和仓库功能
        - 中
        - 口径过宽，不能作为 Mytra 实际 SAM
      - - 另一广义仓库自动化视角
        - Fortune Business Insights / 2026
        - 全球
        - '2026: $36.24B; 2034: $119.86B; CAGR 16.13%'
        - 宽自动化框架，包含机器人、物料搬运设备、控制软件和分析
        - 中
        - 长期预测更高，范围也比 Mytra 相关托盘自动化更宽
      - - 历史到未来的广义视角
        - Grand View Research / 2024
        - 全球
        - '2024: $21.30B; 2030: $59.52B; CAGR 18.7%'
        - 按组件、自动化水平、应用和地区划分的广义仓库自动化
        - 中
        - 公开摘要没有发布 2026 年点位
      - - 狭义 ASRS 视角
        - Mordor Intelligence / 2026
        - 全球
        - '2026: $11.39B; 2031: $16.99B; CAGR 8.34%'
        - 单独统计 ASRS，并指出 unit-load 占 2025 年负载类型份额的 41.92%
        - 中
        - 仍包含 mini-load 和超出 Mytra 切入口的非托盘系统
      - - 另一 ASRS 视角
        - Polaris Market Research / 2026 年
        - 全球
        - '2026: $10.51B; 2034: $20.52B; CAGR 8.7%'
        - ASRS 专项预测，驱动因素包括劳动力、密度和 Industry 4.0 集成
        - 中
        - 公开摘要较高层，且不是托盘专属
      - - ASRS 低端视角
        - NextMSC / 2026
        - 全球
        - '2026: $8.56B; 2035: $22.74B; CAGR 11.46%'
        - 基于运营商和集成商研究、含单位和价值的仓库 ASRS 框架
        - 中
        - 预测期更长，范围选择也不同于 Mordor 和 Polaris
      - - 棕地支出代理
        - L.E.K. / 2026
        - 美国装机基础视角
        - 年支出的 65%-70%；装机基础 >20B sq ft
        - 把当前需求视为改造和存量设施现代化，而不只是新建绿地项目
        - 中
        - 支出占比代理值，不是独立收入 TAM
    notes: 表格刻意保留相互矛盾的估计。广义仓库自动化总量、仅 ASRS 的估算、存量设施占比代理值回答的是不同问题，不应压成一个数字。
