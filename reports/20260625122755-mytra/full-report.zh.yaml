  - id: FE001
    title: Mytra 产品架构栈
    type: stack
    layout: standard
    summary: 从物理底座到软件编排和外部接口，用五层视角拆解已披露的 Mytra 系统。
    data:
      layers:
        - label: 物理底座
          detail: 重复的存储单元结构、托盘和可配置占地面积，消除了以巷道优先的托盘存储模式。
        - label: 机器人运动
          detail: 基于 Helix 的攀爬机器人，可在网格中沿 X、Y、Z 方向移动满载负载。
        - label: 感知与控制
          detail: 11 个摄像头、陀螺仪、无线通信和控制算法，用于导航和机器人状态感知。
        - label: 运动规划与货位分配
          detail: 路径模拟、路线规划、冲突解决、动态并行、无固定货位库存和自愈冗余。
        - label: 运营编排
          detail: 移动、存储、拣选、路由等基础动作，以及面向拖车装载、拆垛和出库呈递的库存排队。
        - label: 边界接口
          detail: 面向叉车、托盘搬运车、人员、其他机器人、演示和客户验证流程的交接层。
    claimRefs:
      - CE009
      - CE011
      - CE015
      - CE020
      - CE021
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: standard
    summary: 托盘和箱件在启用 Mytra 的仓库区域内流动的示意运营流程。
    data:
      nodes:
        - id: n1
          label: 入库接收或存储需求
          detail: 托盘或箱件需要被存储、缓冲，或为出库作业取回。
        - id: n2
          label: 边界交接
          detail: 叉车、托盘搬运车、人工操作员或其他机器人把物料送到 Mytra 系统边界。
        - id: n3
          label: 网格存储 / 特征识别
          detail: 系统在没有固定巷道货位的情况下存储、识别并放置负载。
        - id: n4
          label: 软件路由与排队
          detail: 规划器决定物料放在哪里，以及何时为出库或越库排序而移动。
        - id: n5
          label: 特定流程取回
          detail: 系统取回负载，用于托盘拣选、箱件拣选、月台缓冲或越库场景。
        - id: n6
          label: 出库呈递
          detail: 系统把物料送回边界，用于拖车装载、混合托盘组建或下游处理。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE014
      - CE023
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 已披露技术与运营依赖的有向图；Mytra 要可靠规模化，必须守住这些依赖。
    data:
      nodes:
        - id: d1
          label: 结构网格 / 单元
        - id: d2
          label: Helix 机器人平台
        - id: d3
