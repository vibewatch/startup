        - from: d3
          to: d8
    claimRefs:
      - CE021
      - CE033
      - CE034
      - CE035
      - CE038
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 截至运行日，基于公开证据评估 Mytra 主要能力成熟度。
    data:
      columns:
        - 公开成熟度信号
        - 证据基础
        - 成熟度（1=概念，5=已验证）
      rows:
        - label: 整托盘存取
          values:
            - 已报道生产使用
            - 官方 + 多个行业来源
            - '4'
        - label: 箱件拣选 / 混合托盘流程
          values:
            - 已支持，但证据深度较弱
            - 官网 + 发布报道
            - '3'
        - label: 软件定义路由 / 无固定货位库存
          values:
            - 定位强，且有部分技术佐证
            - 官网 + Flow + Series C 报道
            - '4'
        - label: 部署工具 / 验证环境
          values:
            - 持续成长，但仍处扩张期
            - 总部扩张 + 招聘足迹
            - '3'
        - label: 信任 / 安全 / 保障包
          values:
            - 公开披露弱
            - 法律页面 + 证据缺口分析
            - '2'
    claimRefs:
      - CE025
      - CE027
      - CE043
      - CE045
      - CE047
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 可见的 Mytra 客户旅程从企业识别痛点开始，经过流程界定、试点或生产验证，再走向潜在的站点内扩展。
    data:
      nodes:
        - id: j1
          label: 买方痛点：用工、巷道浪费和僵化的传统自动化
        - id: j2
          label: 流程界定：托盘拣选、箱件拣选、月台缓冲、越库
        - id: j3
          label: 试点或初始部署：在单一站点验证适配度
        - id: j4
          label: 生产上线：吞吐量和用工结果必须站住
        - id: j5
          label: 服务责任：正常运行时间、维护和支持由 Mytra 承担
        - id: j6
          label: 扩展：如果验证复利，可扩到更多流程、更多通道或更多站点
    approximationNotes: 旅程依据公开流程描述、发布验证和 RaaS 分析推断，而非 Mytra 披露的销售打法。
