  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图谱排序
        blocks:
          - type: paragraph
            body: >-
              Mytra 最高的剩余风险不是概念，而是执行。公开证据已经足以证明公司有真实产品、刚完成 $120M 融资、交付了两个试点系统、一个新客户站点已上线，还签下了比此前最大安装项目大 60
              倍的部署。这些都是鼓舞人心的动能信号，但也说明公司仍在把部署工业化，而不是已经拥有长期公开、可重复的大型站点记录。公开档案仍缺少工业自动化承销中通常会降低不确定性的材料：具名安全认证、公开服务级别承诺、客户集中度披露、续约数据，以及详细事故或正常运行时间审计轨迹。可比仓库自动化公司的披露是这里的重要警讯。Symbotic
              的文件显示，大型部署会造成营运资金时点压力，并让公司依赖少数战略账户；AutoStore 年报称，其业务仍由项目驱动，并通过 AutoStore-as-a-Service
              暴露于服务模式风险。行业研究还显示，客户越来越看重正常运行时间、快速响应和集成兼容性。这组因素把 Mytra 的剩余风险分成四层：部署可靠性居首，合同和保障不透明居次，客户与伙伴集中度不透明第三，利润率 /
              现金时点第四。现有证据支持继续尽调，但不支持低触达承销。
