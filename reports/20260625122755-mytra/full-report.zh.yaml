      - number: '3.4'
        title: 护城河耐久性与负面证据
        blocks:
          - type: paragraph
            body: >-
              Mytra 的护城河看起来真实，但不是永久的。最有证据支撑的差异化，是适配托盘密集型运营：这些场景需要在一个架构里完成存储、缓冲管理和排序，同时让外围继续对叉车、人员和其他机器人开放。这比料箱或立方体
              AS/RS、托盘运输 AMR 解决的问题更窄，也更具工业特异性。但周边市场正在走向融合。Exotec 正把缓冲和排序内化，在位托盘系统已经能自动化原材料、WIP 和成品流，Locus 和 GreyOrange
              等软件玩家则在推可覆盖多种机器人形态的编排层。如果软件控制变成主要采购锚点，硬件独特性本身可能无法守住定价权。

              负面证据是实践层面的，而非理论层面。AutoStore 年报明确表示，扩张中的业务可能给分销伙伴模式带来压力，并强调专利深度和此前 Ocado 和解，说明 IP 与渠道权力会强化在位优势。Symbotic 对
              Walmart 的暴露，显示巨型客户能要求多大杠杆。CEO Today 还认为，Mytra 自身服务主导的模式把正常运行时间、集成和续约责任转移给供应商，使利润率和估值对单次糟糕部署更敏感。因此，承销时应把
              Mytra 的护城河视为在特定整托盘用例中最强，但它仍依赖完美执行、参考客户扩展，以及在资本更充足的对手吸收同类工作流之前控制软件层。
