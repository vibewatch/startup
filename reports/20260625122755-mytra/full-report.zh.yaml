      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              其运营模型是一个类似 ASRS 的软件定义平台，新意在于把更多逻辑转移到协同软件层。公开来源描述，一种低矮机器人在重复存储网格中沿 X、Y、Z 方向移动托盘或载荷单元；公司自有材料补充了头部指标：3,000
              磅举升能力、99.999% 正常运行时间、11 个摄像头加陀螺仪导航，以及每小时 150 次呈现。Flow Engineering
              给出罕见技术细节，解释路线规划、无槽位库存、动态并行化和自愈冗余是在软件中实现的，而不是硬编码进固定硬件路径。这个架构信号比发布新闻稿本身更强，因为它把产品主张连接到了真实系统工程工作。同一来源还展示了
              Mytra 如何在内部管理复杂性。机械、电气、固件、软件和 AI
              工作流通过一个需求-风险-测试记录系统连接起来，这正是小团队试图商业化安全相关机器人时应有的流程。实际看，架构像五层：物理网格和托盘、机器人运动与螺旋驱动、感知与控制、编排软件，以及与客户运营的外围交接。公开材料仍缺少面向客户的
              WMS、ERP、码头设备或运输系统集成细节。
