      - number: '1.4'
        title: 里程碑、客户与风险信号
        blocks:
          - type: paragraph
            body: >-
              Mytra 的公开里程碑显示，公司正很快从概念验证走向规模部署准备。2022 年 5 月成立后约两年内，公司便走出隐身状态，已经在 Albertsons
              投产，有已披露的蓝筹客户背书，并讲出差异化整托盘自动化叙事。到 2025 年中，公司搬入 100,000 平方英尺 Brisbane 总部和工厂，据称面积为此前 7
              倍，用于支持机器人搭建、测试、研发和客户演示。2025 年 8 月 Zach Kirkhorn 加入董事会、2026 年 1 月 Series C，又进一步强化了这些规模信号。合在一起看，Mytra
              正试图以足够快的速度专业化，以支撑更大、更复杂的部署。


              客户证明有意义，但仍带选择性。Albertsons 仍是最佳具名参考；2026 年 1 月披露只新增了一家 Fortune 100 食品公司和一家 Fortune 500
              工业用品分销商的类别级信息。对早期机器人公司而言，性能主张很强：物料搬运人工降低 32%、存储密度提升 34%、最高节省 88%
              工时，内部收益率约为同类最佳方案的两倍。主要负面信号不是公开诉讼或召回，而是结构性问题。CEO Today 2026 年分析认为，Mytra
              更偏服务主导的模式把责任集中在供应商身上，意味着一次糟糕部署可能直接伤害续约、利润率和估值信心。叠加公开收入、ARR 和精确估值披露缺失，Mytra 的执行风险比品类叙事更重要。
