  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Mytra 的相关性
    rows:
      - - 整托盘 ASRS 和托盘编排
        - 面向整载移动的托盘存储、取回、缓冲、排序和控制软件
        - 仅包裹机器人、纯 WMS 订阅、非仓库运输支出
        - 大型杂货商、大型零售商、工业分销商
        - 核心切入口，因为 Mytra 被披露为托盘搬运 ASRS，并与交叉转运和缓冲相关
      - - 棕地 DC 改造自动化
        - 既有 DC 内的改造硬件、控制、WCS/WMS 集成、安全升级、站点重新布局
        - 从零建设的建筑外壳、一般房地产开发、无关 ERP 项目
        - 拥有既有网络和集中资本开支的运营商
        - 核心切入口，因为当前多数支出正流向已安装设施，而不是只流向绿地巨型项目
      - - 杂货和食品配送中心自动化
        - 门店补货托盘、冷链缓冲、订单排序、码头暂存、抗天气区域节点
        - 门店收银技术、最后一公里配送车队、店内拣货应用
        - 杂货商、批发商、合作社
        - 高匹配垂直，因为公开客户类比反复强调整托盘、准确性和服务可靠性
      - - 工业和综合商品区域 DC 自动化
        - 大宗补货、托盘储备存储、出站拖车装载、交叉转运队列
        - 工厂产线自动化、运输远程信息处理、仅包裹分拣
        - 工业分销商、零售区域 DC
        - 高匹配相邻垂直，因为 Mytra 也提到一家未具名 Fortune 500 工业用品客户
      - - 单件拣选包裹自动化和微履约相邻领域
        - AMR、周转箱系统、货到人拣选、城市微履约
        - 整托盘储备和门店装载编排
        - 包裹电商运营商、全渠道零售商
        - 重要相邻领域，但不是最干净的匹配，因为工作流经济性更偏向单件拣选速度，而不是托盘密度
      - - 手动叉车和选择性机械化替代方案
        - 叉车、托盘搬运车、货架、劳动力排班、窄点解决方案
        - 集成式软件定义托盘基础设施
        - 维持当前流程的既有仓库运营商
        - 主要现状替代方案，因为许多设施仍选择劳动力加简单设备，而不是系统级自动化
