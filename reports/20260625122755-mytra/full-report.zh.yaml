      - CV031
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 区间图把价格纪律说清楚：当前买方需要牛市情景才能证明全价合理，而基准情景仍低于可见的私人市场锚点。
    approximationNotes: 区间是基于公开证据的情景估计，不是 DCF，也不是管理层指引。
    data:
      items:
        - label: 熊市公允价值（USD M）
          low: 600
          mid: 800
          high: 1000
        - label: 基准公允价值（USD M）
          low: 1100
          mid: 1400
          high: 1700
        - label: 牛市公允价值（USD M）
          low: 1800
          mid: 2200
          high: 2600
        - label: 总价值 / 假设 $2B 入场（x）
          low: 0.3
          mid: 0.7
          high: 1.3
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Mytra 在产品相关性和融资支持上得分较高，但公开经济性披露得分较低；在可见私人市场锚点下，估值支撑只算中等。
    data:
      items:
        - label: 市场需求
          value: 8
          detail: 仓库用工、密度和流转问题真实存在，证据也充分。
        - label: 产品 / 流程适配
          value: 8
          detail: 整托盘存储、缓冲和排序看起来有足够差异化，值得重视。
        - label: 客户验证
          value: 6
          detail: 具名行业和部署增长存在，但公开推荐仍有限，且多数未具名。
        - label: 融资质量
          value: 7
          detail: Series C 和投资人名单是强信号。
        - label: 经济性披露
          value: 3
          detail: 收入、利润率、积压订单和烧钱速度仍未公开。
        - label: 估值支撑
          value: 4
          detail: 如果没有高溢价经济性的证据，可见私人市场锚点很难支撑。
        - label: 退出准备度
          value: 3
          detail: 尚无公开审计、治理或流动性路线图，足以支撑高溢价后期入场。
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV033
      - CV040
      - CV043
