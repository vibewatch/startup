      - number: '2.3'
        title: 买方细分、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开需求信号指向一小组高价值买方，而不是广泛的 SMB 长尾。Albertsons 预计 30% 配送量将实现自动化，且 22 个专用配送中心中已有 3 个自动化，这是典型的门店补货需求。UNFI 和 AWG
              展示第二类买方：食品杂货批发商和合作社正在改造百万平方英尺级设施，以提升订单准确率、韧性和劳动条件。Walmart 的 Symbotic
              推广展示了可比集合的外沿：托盘化门店就绪负载和高密度机器人，已成为网络级战略基础设施。Giant Eagle 则给出软件预算线索，因为其 WMS
              迁移正在同一张需要仓库现代化的网络中推进，说明仓库控制和物理自动化支出往往联动。在这些工作流里，买方、付款方和用户分散在不同职能。供应链领导层、财务和采购批准资本支出；DC 运营、维护和 WMS
              团队定义并运行系统；门店和运输网络获得下游服务收益。这种结构有利于 Mytra 这类供应商，前提是现场具备集中资本支出、整托盘强度，以及对越库、缓冲和出库排序流程的强需求。
