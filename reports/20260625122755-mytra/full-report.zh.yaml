      - CV045
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正方：Mytra 有真实部署势头，不只是概念推介。
        - 官方和独立来源描述了 $120M Series C、规模大得多的 2025 年部署、试点发货和生产上线。
        - 如果审计或客户参考显示部署只是狭窄试点、可重复性弱，这条论点会削弱。
      - - 正方：投资人质量和战略支持方带来融资韧性。
        - Avenir 领投 Series C，Lineage/RyderVentures 与成熟风投支持方同场出现。
        - 如果下一轮持平或下调，并带有更重优先权，说明当前融资支持没有转化成持久定价权。
      - - 正方：如果执行守住，全托盘工作流契合度可能支撑溢价结果。
        - Mytra 称早期部署减少了搬运人力并提升密度；仓库自动化赢家在规模和经济性可见后会得到市场奖励。
        - 只有 Mytra 披露利润率、积压订单质量和可重复客户经济性，溢价情形才会改善。
      - - 反方：公开估值支撑仍是间接的。
        - Mytra 披露融资金额但不披露估值；可见的 ~$2B 数字来自 Tracxn，不来自公司。
        - 官方定价轮或经审计融资包会消除这一担忧。
      - - 反方：驱动回报的变量仍是私有信息。
        - 审阅来源中没有公开收入、毛利率、现金流或优先权栈披露。
        - 经审计财务报表和清晰股权结构表会显著提升承销信心。
      - - 反方：板块可比公司证明，自动化叙事可能被大幅重估。
        - Ocado 运营持续进展，但公开倍数远低于 Symbotic 或 AutoStore，说明资本密集型自动化重估有多难。
        - 更强披露包和可重复的盈利部署，会把 Mytra 推向更好的公开可比公司，而不是被压缩估值的那一组。
    notes: 反方论点围绕估值，而不是否定产品。它认为价格支撑包不完整，并不是说公司没有真实问题可解决。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV027
      - CV031
      - CV033
      - CV034
      - CV042
  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 概率信号
      - 估值区间（USD M）
      - 假设 $2B 进入价的回报逻辑
      - 关键摇摆因素
    rows:
      - - 牛市
        - 25%
        - 1800-2600
        - 以 $2B 进入价计，毛价值约 0.9x-1.3x；上行需要执行能证明溢价，而不只是溢价叙事。
        - 可供背书的客户、披露的服务经济性、可重复多站点部署，以及高于可见第三方标记的新定价轮。
      - - 基准
        - 50%
        - 1100-1700
        - 毛价值约 0.55x-0.85x；公司不错，但在可见公开锚点上的安全边际很薄。
        - 继续拿下订单，但收入质量、利润率和融资条款持续不透明，使披露折价继续存在。
      - - 熊市
        - 25%
        - 600-1000
        - 如果下一轮重设价格或部署经济性不及预期，约 0.3x-0.5x。
        - 持平 / 下调轮、重优先权栈、商业化放慢，或更广泛板块倍数压缩。
      - - 概率加权中点
        - 100%
        - 1150-1650
        - 说明公开证据支持继续尽调，而不是把支付完整可见私募标记作为基准情形。
        - 只有新证据补上披露缺口，或条款转向有利投资人，建议才会改善。
    notes: 情景区间是分析师估计，来自公开可比公司语境、融资信号和明确披露缺口。它们不是管理层指引，也有意避免在收入倍数上制造虚假精确。
    claimRefs:
      - CV031
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 最新公开锚点
      - 倍数 / 估值 / 状态
      - 与 Mytra 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public references reviewed for this run: Mytra's financing signal and
        third-party estimate, two listed warehouse-automation peers, one compressed automation cautionary comp, and one
        incumbent scale reference. It is not an exhaustive census of every global logistics-automation company or
        private secondary mark.
    rows:
      - - Mytra Series C
        - 2026 年 1 月私募融资
        - $120M 融资；官方估值未披露；独立报道称总资本栈 >$200M
        - 最相关的最新融资信号，因为这是公司最新披露轮次。
        - 该轮没有公开投后估值、清算瀑布或经审计财务包。
      - - Mytra 第三方估计
        - Tracxn 融资页面
        - 截至 2025 年 3 月 24 日，估计估值 ~$2B；四轮共融资 $198M
        - 没有官方估值披露时，可作为有用的方向性私募市场锚点。
        - 第三方数据库估计，不是公司认证价格或条款清单。
      - - Mytra Premier Alternatives 估计
        - 2026 年 1 月 15 日跟踪器快照
        - 估计估值 $565M
        - 官方投后仍未披露时，显示私募市场跟踪器结果可以相差多大。
        - 二级市场数据库估计，与 Tracxn 的 ~$2B 标记冲突，且未经公司认证。
      - - Symbotic
        - 2026 年 6 月公开市场
        - 市值 ~$23.9B；EV/销售额 ~8.65x；2026 年 Q2 收入 $676M 且净利润为正
        - 最能证明溢价的公开基准：规模化仓库自动化，且披露经济性。
        - 规模、上市公司披露和客户足迹都远大于 Mytra。
      - - AutoStore
        - 2026 年 6 月公开市场
        - 市值 ~$4.15B；EV/销售额 ~7.06x；2026 年 Q1 收入 $165.8M；1,300+ 客户
        - 强盈利自动化平台参考，显示投资人愿为已安装基础的耐久性支付什么价格。
        - 箱式 / 料箱履约架构不是同类全托盘系统。
      - - Ocado Group
        - 2026 年 6 月公开市场
        - 市值 ~$1.96B；EV/sales ~1.83x；尽管技术进展仍在重组
        - 是资本强度、较慢变现和估值压缩的有用警示可比公司。
        - 混合杂货、物流和技术模式比 Mytra 更宽。
      - - Daifuku
        - 2026 年 6 月公开市场 / TTM 基本面
        - 市值 ~$16.13B；TTM 收入 ~673.18B JPY；成熟在位者画像
        - 提供在位者规模地板，并显示大型多元化物料搬运企业如何被估值。
        - 业务成熟、多元，地域覆盖也广，因此更像地板式参照，而不是创业公司增长天花板。
    notes: >-
      这张表用公开市场背景和定性方式约束 Mytra 的估值逻辑，并不意味着可以把某个干净的收入倍数直接搬到一家私有 ASRS 创业公司的估值里。Tracxn 与 Premier Alternatives
      追踪值之间的分歧，是证据集本身的特征，不是需要抹平的错误。
    claimRefs:
      - CV001
      - CV011
      - CV015
      - CV016
      - CV017
      - CV018
      - CV021
      - CV022
      - CV023
      - CV025
      - CV026
      - CV027
      - CV029
      - CV030
      - CV031
      - CV035
      - CV045
  - id: TV005
    title: 论点失效与止损触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 下轮降估或平轮但偏好权更重
        - 下一轮定价融资在计入偏好权后低于或实质低于可见的私募锚点
        - 说明融资支持弱于当前叙事，也说明普通股上行空间正在被次级化。
        - 暂停或放弃，除非价格重设到足以恢复预期回报。
      - - 经审计经济性偏弱
        - 经审计收入、毛利率或服务贡献显著低于投资人预期
        - 打破溢价可证的逻辑，把 Mytra 推向压缩可比公司的估值框架。
        - 估值重置到熊市情景，或停止推进。
      - - 客户证明无法转化
        - 没有可供背书的多站点客户，或部署可复制性明显弱于 2025 年公告暗示的水平
        - 削弱由工作流契合度推导出的市场份额和护城河叙事。
        - 维持「继续研究」建议，推迟投资。
      - - 部署经济性过度依赖服务
        - 支持、集成或现场服务负担压过软件或硬件利润率改善
        - 增长会变成劳动密集型交付，而不是可扩展的平台经济性。
        - 要求大幅降价，或放弃。
      - - 公开市场可比公司重估
        - 仓储自动化倍数从当前 Symbotic / AutoStore 区间明显压缩
        - 抽走外部支撑，而这种支撑目前连牛市情景上限都在依赖。
        - 收紧估值区间，并要求更宽的安全边际。
    notes: 这些触发因素的设计，是为了让投资委员会能在尽调或未来融资事件中观察到。每一项都把定性担忧转成具体的等待 / 投资 / 放弃规则。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 官方估值与股权结构表
        - Series C 投后估值、逐轮所有权、清算优先权、参与权，以及任何结构化融资的优先级
        - 偏好权包袱较重时，股权回报可能与企业价值标题数字相差很大。
        - 财务 + 法务资料室；审查章程、融资文件和更新后的股权结构表。
      - - 经审计财务报表
        - 2025 年及 2026 年至今收入、毛利率、服务利润率、现金消耗、积压订单和营运资本需求
        - 核心经济性输入没有公开，因此当前公开估值逻辑受限。
        - CFO 尽调包；与审计工作底稿和董事会材料核对。
      - - 客户集中度与部署经济性
        - 具名客户、ACV、回本周期、正常运行时间、安装周期，以及按队列划分的续约行为
        - 帮助判断 2025 年动能能否规模化，还是仍高度依赖单个项目。
        - 收入运营 / 客户成功审查和客户访谈。
      - - 运营扩张负担
        - 现场服务人员计划、集成负担、质保敞口和备件假设
        - 判断增长是在复利放大，还是只是把服务复杂度成倍放大。
        - 运营 / 制造尽调和部署复盘审查。
      - - 退出准备度
        - 审计准备度、投行沟通、治理成熟度和可能的流动性路径
        - 如果可信的下一轮融资或流动性路径存在，高溢价私募价格更容易解释。
        - CEO / GC / 财务尽调；索取治理日历和融资路线图。
      - - 能推动价格的证明点
        - 支持高于当前方向性标记价格的条件
        - 把对公司的欣赏和有纪律的入场定价分开。
        - 尽调结束后更新 IC 备忘录；收到私有指标后重跑情景表。
    notes: 这些要求按对承保判断的直接影响排序。第 1-3 项对估值至关重要；第 4-6 项决定溢价逻辑能否站住。
    claimRefs:
      - CV012
      - CV033
      - CV034
      - CV043
      - CV044
