      - number: '1.3'
        title: 融资、投资人与规模信号
        blocks:
          - type: paragraph
            body: >-
              Mytra 的资本故事在轮次顺序上异常清楚，但估值机制仍不完整。公司于 2024 年 7 月公开亮相，当时已融资 $78M，覆盖至 Series B；Greenoaks 领投 B 轮，Eclipse 领投种子轮和
              Series A。Tracxn 给出更细的轮次历史：2023 年 Series A、2024 年 $50M Series B，以及 2026 年 1 月 Series C。当前最重要事件是 2026 年 1 月
              15 日完成、由 Avenir Growth 领投的 $120M Series C。新投资人 Kivu Ventures、Liquid 2、D. E. Shaw 和 Offline Ventures
              加入，既有投资人 Eclipse、Greenoaks、Abstract Ventures 和 Promus Ventures 跟投；战略投资人 Lineage 和 RyderVentures
              则增加了供应链信号价值。


              总融资最好表述为约 $198M 至略高于 $200M，取决于来源口径：Tracxn 显示四轮合计 $198M，而 Mytra 相关材料和行业媒体报道将该数字四舍五入为「超过
              $200M」。差异更像四舍五入，而非实质矛盾，但精确资本结构仍需确认。规模信号比估值披露本身更强。2026 年 1 月来源称，Mytra 已签下一项部署，规模为 2025 年此前最大安装项目的 60
              倍；已交付两个试点系统，在新客户现场上线，并在全年团队增长 78% 后继续招聘。公开估值仍是材料最弱处：Tracxn 列出当前估值 $2B，但官方轮次材料没有发布精确投后估值。
