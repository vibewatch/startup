      - CU003
      - CU027
      - CU031
      - CU032
      - CU038
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据显示，Mytra 已从广泛企业痛点推进到具名生产验证、匿名企业客户斩获、试点，以及至少一个更新的生产站点。
    data:
      nodes:
        - id: f1
          label: 企业用工与密度痛点
          detail: 大型工业运营商需要更密的存储，以及更少依赖叉车的流转
        - id: f2
          label: 商业兴趣
          detail: 发布材料提到包括 Albertsons 在内的商业合作伙伴
        - id: f3
          label: 试点动作
          detail: 2025 年交付了两套试点系统
        - id: f4
          label: 具名生产验证
          detail: Albertsons 在部分配送中心投入生产
        - id: f5
          label: 其他企业客户
          detail: 按类别披露了 Fortune 100 食品客户和 Fortune 500 工业分销客户
        - id: f6
          label: 规模化铺开潜力
          detail: 一个新站点已上线，并签署了规模为此前最大安装量 60 倍的部署
      edges:
