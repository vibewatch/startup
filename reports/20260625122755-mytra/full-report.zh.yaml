  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Mytra 不应按传统 SaaS 公司来承销。最好的公开证据指向一种企业级工业销售动作：围绕软件定义的仓储系统、大型现场部署，以及仍未稳定的前置和经常性经济性组合。官方材料确认了 $120M Series
              C、具名的大客户类别，以及一项 2025 年部署，其规模为公司此前最大安装项目的 60 倍。Fortune
              报道的投资人评论给出了最清楚的定价代理：工业交易起步可能就是数千万美元，并在同一客户关系内继续扩大。这支持一种高
              ACV、低账户数的销售模型，周期长、范围定制、售后支持负担不轻。公开材料没有披露的内容同样重要。已审阅来源没有发布 Mytra
              标价、标准合同结构、实际折扣，或收入主要在安装时确认、随服务逐步确认，还是通过硬件、软件和运营承诺混合确认。CEO Today
              的服务主导框架有方向性参考价值，因为它暗示客户买的可能是可靠吞吐，而不是纯设备所有权；但这仍是外部解读，不是已披露合同模板。财务上，结论是一家公司有可信需求信号，但关于收入质量和结构的公开证据不足。
