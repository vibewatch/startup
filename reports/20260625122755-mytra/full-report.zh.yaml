  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 公开支撑
      - 当前价值 / 状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - 企业部署 / 系统收入
        - 独立报道称工业合同起步金额为数千万美元，官方来源强调更大规模的站点部署。
        - 可支撑其很可能是一项收入来源；具体占比未知。
        - 单个账户订单额可能很大，但大概率高度依赖里程碑且客户集中。
        - 要求按部署阶段提供订单到收入桥、验收标准和收入确认政策。
      - - 经常性服务 / 正常运行时间收入
        - CEO Today 描述的是服务主导、基于结果的模式，但 Mytra 未公开合同形式。
        - 可能存在且方向上有支撑；官方未量化。
        - 若续约稳固，可提升可见度，但执行风险也仍由 Mytra 承担。
        - 复核 SLA 条款、续约经济性、正常运行时间抵扣，以及按站点队列划分的服务毛利率。
      - - 软件 / 编排收入
        - Mytra 自称软件定义；Symbotic 显示一条小规模软件收入线，AutoStore 则把软件揉进合作伙伴主导模式。
        - Mytra 没有公开披露独立软件金额。
        - 高毛利潜力存在，但公开证据尚未证明今天的软件变现可被单独拆出。
        - 如有软件许可或维护条目，要求提供，并证明按已安装站点计算的附着率。
      - - 扩张 / 追加部署收入
        - Series C 材料提到已签大型组织，以及比此前最大规模大 60 倍的部署。
        - 可支撑其存在管线或扩张潜力；实际转化未知。
        - 若首批站点跑通，追加销售潜力较好；但在看到多次扩张前，集中度风险仍高。
        - 要求提供队列排期，显示初始部署、扩张时点和增量毛利。
    notes: 本表区分公开可支撑的收入机制和未披露的收入结构。未知表示所审阅公开资料没有给出某项收入占比或会计政策的数字。
