      - number: '7.2'
        title: 法律、监管与合同边界
        blocks:
          - type: paragraph
            body: >-
              法律和监管风险不在于 Mytra 目前披露了执法事件；风险在于，公司销售与安全相关的仓库自动化，而投资级保障包的大部分仍不在公开档案里。OSHA
              的仓储概览明确把动力工业车辆、物料搬运和机器人列为行业危险源；OSHA 的动力工业车辆标准也显示，周边运营环境有大量具体叉车规则约束。Mytra 现在在加州设有总部和工厂，因此 Cal/OSHA 监管和
              Title 8 标准也重要。Mytra 自己的公开法律页面限制了外部人士仅靠网站能够承销的内容。隐私政策称，客户处理的个人信息受客户协议约束；条款页面称，Mytra Services
              受单独协议约束，公共网站按现状提供。也就是说，正常运行时间补救、验收标准、赔偿、数据处理和服务积分等核心问题，都被放进了私下合同。隐私政策还说，Mytra 使用技术、组织和物理防护措施，但不能保证安全。FTC
              指引和 NIST 网络安全框架使其成为真实尽调问题，而不是样板条款。再加上 CPSC 召回权、条款页面里的出口管制语言，以及仍留下实施自由和执行问题的扩张中专利组合，结论是：这套法律 /
              监管风险栈只有拿到私有尽调室证据后才可管理。
