  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 当前判断沿着一条简单链条展开：产品和融资信号有吸引力，支持继续尽调；但估值和经济性披露缺失，使建议仍低于买入。
    data:
      nodes:
        - id: n1
          label: 产品 / 流程适配
          detail: 公开证据和前文支持一个真实的整托盘自动化切入点。
        - id: n2
          label: 融资支持
          detail: $120M Series C 和蓝筹投资人显示外部验证。
        - id: n3
          label: 披露缺口
          detail: 官方未披露估值、收入、毛利率、积压订单或优先权结构。
        - id: n4
          label: 上市可比公司语境
          detail: 高溢价倍数存在，但需要已披露规模或盈利能力来支撑。
        - id: n5
          label: 估值评估
          detail: 官方立场未知；在更多证据出现前，可见的约 $2B 第三方锚点显得要求较高。
        - id: n6
          label: 建议
          detail: 继续研究 / 跟踪，直到披露改善或价格改善。
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
