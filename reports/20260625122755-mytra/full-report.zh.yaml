            body: >-
              部署成熟度强于一般深科技机器人发布，但仍明显处于中等规模。到 2024 年 7 月，独立行业报道称 Mytra 已在部分 Albertsons 配送中心投产。到 2026 年 1
              月，公司称已交付两个试点系统，在新客户现场上线，并签下一项规模为此前最大安装项目 60 倍的部署。2025 年 6 月搬入 100,000 平方英尺 Brisbane
              总部和工厂，也与产品直接相关，而不只是公司事件。Mytra
              将该场地描述为用于搭建、研发、测试、验证和现场客户演示的地方，说明部署准备依赖大规模内部验证环境。支持和路线图信号主要来自招聘和组织设计。公司公开招聘系统集成、系统测试、安全系统架构、电气工程、技术项目管理、质量和运营岗位，同时分别扩展
              AI / computer vision、电气和结构工程领导层。合在一起，这些信号暗示未来 18
