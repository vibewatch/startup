companyProfile:
  summary: >-
    Mytra 是一家位于加州 Brisbane 的仓储自动化公司，Chris Walti 和 Ahmad Baitalmal 于 2022 年 5 月创立。公司销售软件定义的整托盘
    ASRS，由机器人、存储单元和编排软件组成，服务托盘拣选、箱拣、码头缓冲和越库流程。公开证据显示，Mytra 已在 Albertsons 落地运行，另有未具名 Fortune 100 和 Fortune 500 客户，在
    Brisbane 拥有 100,000 平方英尺总部 / 工厂，并于 2026 年 1 月完成 Avenir Growth 领投的 $120M Series
    C。公开尽调材料最强的是产品差异化、投资人质量和运营势头；最弱的是收入、利润率、定价、客户集中度和治理披露。
