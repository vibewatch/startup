      - number: '7.4'
        title: 伙伴、客户与资本依赖
        blocks:
          - type: paragraph
            body: >-
              Mytra 的公开依赖图比产品故事更不透明。积极读法是，公司已吸引战略和财务支持，包括 DC Velocity
              提到的物流相邻投资方，并且现在有足够资本追求更大的部署节奏。更严苛的读法是，公开档案仍未披露客户数量、头部账户敞口、续约行为，或试点与规模化投产站点之间的拆分。这样很难区分广泛市场拉动和少数高价值灯塔关系。可比上市公司披露再次有用。Symbotic
              的文件显示，一家自动化供应商可以多么依赖少数战略关系，部署现金时点又如何扭曲经营现金流。AutoStore
              年报称，其业务由项目驱动，推动了新的关税处理流程，并增加供应商以降低风险，暗示即便对规模化供应商而言，供应商韧性和贸易政策也很重要。Interact Analysis 给出宏观警示：2025
              年仓库自动化市场动荡，关税和政治波动叠加供应商困境事件，例如 Attabotics 破产和 Zebra 收缩机器人业务。因此，应把 Mytra
              当作一家可能有真实需求、但仍处在一个约束会迅速变化的品类中承销：供应商约束、战略账户集中、资本开支暂停和融资窗口都可能快速改变。公开集中度和供应商披露缺失，本身就是实质风险输入，而不是文书疏漏。
