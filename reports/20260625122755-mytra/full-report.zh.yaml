      - number: '3.3'
        title: 替代方案、切换成本与分销权力
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本不只是拆掉硬件。买方一旦把仓库控制逻辑、ERP 或 WMS 集成、维护流程、出库排序规则和用工计划绑定到一个自动化栈，更换供应商就会变成跨季度运营项目。Symbotic 的 Walmart
              合同通过长期支持尾部、性能门槛和战略权利，把这一点说得很明白。AutoStore
              的锁定更软，但仍然有力，因为分销伙伴掌握安装、支持和大量客户界面。这些动态有利于拥有密集伙伴网络、重要参考客户或上市公司审计披露的厂商，而不利于仍在证明可复制部署手册的早期进入者。

              相邻和替代供应商重要，因为它们能拿走某一个买方痛点，却不要求重写整个仓库。Seegrid 和 MiR 在棕地环境中自动化托盘运输和举升作业；LocusONE 和 GreyMatter
              承诺从软件层编排混合车队和多种工作流；如果买方主要想要更安全运输或更好的 WMS 纪律，而不是密集存储，内部自建仍然可行。Ocado Intelligent Automation 和 Hai Robotics
              更应归入相邻桶，而非直接同行桶：Ocado 的公开栈在 Ocado IQ 下把 Porter 托盘搬运 AMR 与 Chuck 单件拣选机器人配对；HaiPick Climb 则是在 HaiQ
              下运行的双深位料箱和箱货货到人系统。两者完全可能出现在同一 RFP 宇宙里，但它们更直接解决托盘移动、单件履约或软件编排的工作流广度，而不是 Mytra 的核心问题：密集整托盘存储加缓冲控制。这抬高了 Mytra
              的 GTM 负担。公司必须证明，存储密度、缓冲管理和排序的组合价值，超过在现状之上叠加运输 AMR、编排软件或在位服务这条低风险替代路径。
