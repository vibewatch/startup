      - number: '2.4'
        title: 增长驱动、约束与相反证据
        blocks:
          - type: paragraph
            body: >-
              需求逻辑真实存在，但并不均匀。BLS 显示，2026 年 5 月美国仓储就业人数为 1.842M，平均时薪 $26.76；McKinsey 和 Deloitte
              都认为，自动化越来越多是对劳动力短缺和服务水平压力的回应，而不仅是工资套利。Modern Materials Handling 2026 年研究显示，市场仍有大量空间：只有 12%
              受访者报告拣选已完全自动化，11% 报告存储已完全自动化，尽管许多公司已经使用输送机、货到人系统、AGV 或
              ASRS。各来源反复出现的增长驱动一致——劳动力压力、吞吐、密度、订单准确率和棕地韧性——但约束同样清楚。McKinsey 强调 ROI 与租期错配，MHI/Deloitte
              提到用例不清、商业论证难做，Mordor ASRS 则补充 legacy WMS 集成、技师短缺和网络风险。食品杂货配送中心也提供了对 Mytra 重要的相反证据。Mytra 称早期部署让物料搬运人工降低
              32%、存储密度提升 34%；但 Kroger 正在评估并关闭部分 Ocado 自动化设施，因为固定架构没有带来可接受的电商盈利能力。市场有吸引力，但采用节奏取决于架构和经济性，不会自动发生。
