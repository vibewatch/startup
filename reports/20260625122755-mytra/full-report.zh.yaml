      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Mytra
              的公开财务结论是：融资能力正面，披露完整性负面。公司具备风投支持工业赛道潜在赢家的特征：蓝筹客户证明、潜在合同金额很大、有意义的战略投资人基础，以及在人和设施上的可见扩张投入。这些都是收入增长的正确要素。但公开材料仍保留了几乎所有判断收入质量、毛利率耐久性、客户集中度或现金续航所需的指标。反面情形不是
              Mytra
              缺少需求，而是服务主导的机器人模式会把风险留在供应商身上，恰好发生在硬件、正常运行时间和集成复杂度最难标准化的时候。食品杂货和托盘密集型设施还会因温度、包装和工作流复杂度带来额外执行负担。合起来，本章支持一个窄判断：Mytra
              看起来有足够资金继续扩大部署，但任何承销观点都应保持暂定，直到尽调确认合同经济性、营运资本节奏，以及经常性服务义务是在创造价值，还是只是在推迟利润确认。
