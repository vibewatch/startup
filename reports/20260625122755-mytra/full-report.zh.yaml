  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 最影响决策的敏感性不是倍数微调，而是 Mytra 落在压缩情景底部、披露折价基准情景和可见私人市场锚点之间的哪个位置。
    approximationNotes: 数值为分析师情景锚点，单位为百万美元；依据上市可比公司语境和披露质量构建，而非 Mytra 已披露收入。
    data:
      items:
        - label: 熊市中点
          value: 800
        - label: 基准低位
          value: 1100
        - label: 基准中点
          value: 1400
        - label: 基准高位
          value: 1700
        - label: 可见 Tracxn 锚点
          value: 2000
        - label: 牛市中点
          value: 2200
    claimRefs:
