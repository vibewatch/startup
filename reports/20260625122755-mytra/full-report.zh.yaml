      - number: '8.4'
        title: 进入纪律、论点破坏项与尽调要求
        blocks:
          - type: paragraph
            body: >-
              实际 IC 结论很直接。Mytra
              不是一个按公开证据应回避的标的，因为产品叙事、融资支持和部署主张都强于典型机器人初创公司。但它也不是一个按公开证据可以买入的标的，因为真正决定股权回报的变量仍是私有的：精确投后估值、清算优先权、债务或结构化融资层、服务毛利率、客户集中度、部署回收期，以及
              2025 年安装跃升的可重复性。投资者因此应把下一轮作为披露闸门来承销。如果公司想要高端定价，就应拿出高端证据。


              这会转化成清晰的尽调要求和否决触发项。下轮下调估值、平轮但附带更重优先权、经审计收入低于或质量弱于投资者预期，或证据显示部署经济性服务重、利润轻，都会破坏当前上行情景。相反，经审计财务、可背书客户队列，以及高于当前第三方估计的定价轮，都可能把判断上调。在那之前，正确纪律是把对公司的欣赏和对进入价格的信念分开。今天的公开证据支持继续做功课，而不是急着写支票。
