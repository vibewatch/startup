      - number: '6.2'
        title: 采用轨迹与具名证据
        blocks:
          - type: paragraph
            body: >-
              最有力的采用证据，来自三层区分：哪些客户被点名、哪些已经投产、哪些还停留在品类层面。Albertsons 证据级别最高，因为多方资料都说，Mytra 在 2024 年 7 月公开亮相时，已经在
              Albertsons 的部分配送中心投产。这比标识墙或试点公告强得多。相比之下，另外两个 2026 年客户仍未具名。公司称，这些账户包括一家 Fortune 100 食品公司和一家 Fortune 500
              工业用品分销商；2025 年签下的一个部署规模是此前最大安装项目的 60
              倍；公司还交付了两个试点系统，并让一个新客户站点投产。这些都是有意义的牵引信号，但客户是谁、涉及多少站点、已签部署是否就是新投产站点，仍然不清楚。


              结果证据同样不对称。2026 年公开材料称，早期部署将物料搬运人工降低 32%、存储密度提高 34%；官网则宣传更激进的通用性能主张，例如密度提升 2 倍、劳动力效率提高 70%、99.999%
              正常运行时间，以及每小时 150 次呈现。Silicon Foundry 补充了一个有用但仍由公司转述的案例：首个客户项目约六周后，吞吐量约达到 SLA
              的三倍。正确读法是：部署证据真实且在改善，但置信度最高的事实仍是部署存在和早期方向性结果，还不是大规模客户群已经跑通。
