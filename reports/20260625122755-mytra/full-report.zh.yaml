      - number: '8.3'
        title: 牛市、基准与熊市估值区间
        blocks:
          - type: paragraph
            body: >-
              因此，情景区间应被理解为有纪律的三角校准，而不是管理层指引。牛市情景下，Mytra 证明 2025
              年动能可以延续为可重复的多站点部署；服务和支持经济性足够有吸引力，能够规模化；客户从未具名标识转化为可背书、耐久的账户。在这个世界里，约 $1.8B-$2.6B
              的估值区间可以成立，因为投资者能论证其更接近高端公开可比公司组。这也是第三方 $2B 标记开始看起来稳妥挣到，而不只是勉强可辩护的唯一路径。


              基准情景没那么慷慨。它假设产品仍有吸引力，公司持续赢得部署，但公开披露仍稀疏，投资者继续相对 Symbotic 或 AutoStore 给出显著不透明折价。在这个视角下，约 $1.1B-$1.7B
              的区间更可支撑。熊市情景假设部署复杂性、服务利润率压力或更艰难的融资市场，把估值拉向公开自动化参照点的低端，形成类似 $0.6B-$1.0B
              的结果。这些估计都不应被误解为精确价值。它们是把当前公共证据集转化为投资纪律的情景带：上行存在，但比单纯公司质量故事暗示的更薄。
            claimRefs:
              - CV031
