      nodes:
        - label: 广义仓储自动化视角
          detail: 当前公开的 2026 年估算集中在全球 $34.17B-$36.24B，定义较宽，混合了硬件、软件、机器人和控制系统。
          tone: neutral
        - label: ASRS 视角
          detail: ASRS 专项的 2026 年估算把区间收窄到约 $8.56B-$11.39B；它以存储和检索系统为中心，而不是全部仓储技术，因此更接近 Mytra。
          tone: positive
        - label: 棕地现代化层
          detail: L.E.K. 称，当前 65%-70% 的年度支出投向改造和棕地升级，覆盖已安装仓储面积 >20B sq ft；这比只看绿地 TAM 更贴合当前买方动作。
