  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 预算负责人相关性
      - 尽调问题
    rows:
      - - 劳动力短缺和工资压力
        - 驱动
        - 当前
        - 庞大劳动力池和上涨工资让自动化成为对冲服务降级与招聘困难的手段
        - 当劳动力长期难招、难留时，提高资本开支意愿
        - 承保回本期前，要求提供站点级岗位空缺、加班和流失率数据
      - - 立方空间利用和闲置空间
        - 驱动
        - 当前
        - 密集托盘系统可以把通道和净空浪费的昂贵面积变现
        - 设施受限但搬迁吸引力不高时，支持项目立项
        - 量化当前可用立方空间、储备托盘密度和避免的扩建支出
      - - 订单准确率、服务可靠性和门店就绪排序
        - 驱动
        - 当前至近期
        - 食品杂货商和分销商购买自动化，是为了提升有货表现、减少发货错误，不只是裁减人手
        - 把商业案例从劳动力扩展到客户服务经济性
        - 要求提供试点与人工基线的错误率、满足率和门店配送指标
      - - 存量设施灵活性和分阶段推出
        - 驱动
        - 近期
        - 在现有网络内，适合改造的系统比全有或全无的新建重建更容易拿到预算
        - 帮助预算负责人把支出分摊到多个节点和阶段
        - 测试在运转中的设施里需要多少土建、停机和 WMS 变更
      - - 高资本开支和长回本期
        - 约束
        - 当前
        - 节约兑现慢于租期或需求密度偏弱时，项目可能达不到门槛回报率
        - 回本期超过两到三年后，CFO 审查会明显加严
        - 询问部署资本开支、调试成本，以及低于计划吞吐量时的敏感性
      - - 旧系统集成、技师短缺和网络风险
        - 约束
        - 当前至中期
        - 存量站点往往先要完成 WMS/WCS 集成、配备专业人力、加强 OT 安全，自动化才能稳定运行
        - 硬件合同签署后，可能拖慢上线并推高服务支出
        - 要求提供集成地图、人员配置计划、备件模型和网络责任矩阵
      - - 架构不匹配或节点经济性错误
        - 约束
        - 当前
        - Kroger 的收缩说明，当货量密度和工作流形态不匹配时，固定式自动化会摧毁 ROI
        - 预算负责人必须仔细比较托盘储备用例与单件消费者履约
        - 在全网络复制同一设计前，逐站点测试密度和渠道组合
      - - 宏观、关税和供应商波动
        - 约束
        - 2026 至 2027
        - Interact 点出政策、原材料和存储供应风险，这些因素会改变定价和下单时点
        - 即使运营痛点真实，资本开支委员会也可能推迟项目
        - 监测 2026-2027 年关税、供应商健康，以及绿地与改造需求的组合
    notes: 让市场有吸引力的因素，也会收窄可变现切片。本章把每个驱动因素或约束绑定到时点和预算归属，避免估值假设无摩擦采用。
