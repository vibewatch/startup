  - id: FP004
    title: 按部署模式划分的切换壁垒旅程
    type: journey-map
    layout: wide
    summary: Mytra 最现实的竞争威胁在于，买方可以先从更窄的 AMR 或料箱式自动化起步，并在整托盘重建变得紧迫前，已经积累软件、集成和运营锁定。
    data:
      nodes:
        - label: 1. 问题界定
          detail: 买方会先判断痛点是高密度整托盘存储、托盘运输劳动力，还是高 SKU 箱级与料箱履约。这个界定已经会改变 Mytra、既有托盘 AS/RS、Ocado Porter 或 HaiPick 是否进入候选名单。
          tone: neutral
        - label: 2. 试点路径
          detail: 棕地试点通常从扰动最低的方案开始，比如运输 AMR、Ocado Porter 式托盘搬运器，或基于料箱的货到人单元，因为它们比新建整托盘架构需要更少设施重设计。
          tone: risk
        - label: 3. 软件锚点
          detail: >-
            一旦某家供应商借助 Ocado IQ、HaiQ、LocusONE、GreyMatter、SynQ 或 Symbotic 软件等层，掌握 WMS 或 WES
            挂钩、机器人编排、任务逻辑和异常处理，即便硬件仍然模块化，切换成本也会上升。
          tone: risk
        - label: 4. 上线与再培训
          detail: 既有企业和公开同行拥有现场服务手册、具名参考客户和合作伙伴覆盖，能在铺开和员工再培训时降低买方焦虑。
          tone: risk
        - label: 5. 扩张决策
          detail: 上线之后，平台已经嵌进维护、用工规划和流程数据。除非新系统能在托盘密度、排序或经济性上带来跃迁式改善，买方通常会扩展既有平台。
          tone: risk
    approximationNotes: 旅程阶段为定性判断，用来显示在企业决定采购 Mytra 式整托盘方案之前，相邻方案可能在哪些环节截住采购流程。
