      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              把规模证据看作一组透镜，而不是单一标准 TAM 时，材料最扎实。在最宽的当前视角下，Mordor 估计 2026 年仓储自动化市场为 $34.17B，Fortune Business Insights 对同年给出
              $36.24B；Grand View 则从较低的 2024 年基数 $21.30B 起算，并预计 2030 年达到 $59.52B。缩窄到 ASRS 后，区间下降但分歧并未消失：NextMSC 估计 2026
              年仓储 ASRS 为 $8.56B，Polaris 为 $10.51B，Mordor 为
              $11.39B。这些差异主要来自方法，而不是事实错误。有些发布方计算所有仓储自动化基础设施，有些只隔离存储与取回系统，还有一些把 TAM 当作完整分层框架，其中也包含移动机器人、WMS 和 AIDC。对
              Mytra 来说，最有决策价值的筛选条件，是大型既有配送网络中的棕地托盘自动化。L.E.K. 称，如今年度支出有 65%-70% 投向超过 20B
              平方英尺仓储空间的改造和棕地升级；这比通用全球自动化总量更适合作为 Mytra 实际切入点的代理指标。
