  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 类别
      - 规模 / 融资信号
      - 目标客户
      - 差异化
      - 相比 Mytra 的限制
    rows:
      - - Mytra
        - 直接创业公司
        - 公开披露约 $198M 至超过 $200M 融资；早期具名生产验证
        - 食品杂货、零售、食品，以及需要存储加流量控制的重托盘运营商
        - 全托盘存储，加箱件拣选、码头缓冲和越库工作流，整合在一个系统中
        - 公开装机基数披露有限，定价不透明，分销触达较弱
      - - Symbotic
        - 直接规模化基准
        - 上市公司规模；Walmart 战略持股和 400 套系统承诺
        - 大型零售商和食品杂货配送网络
        - 密集存储、箱件自动化、软件，以及无可比拟的企业级案例深度
        - 客户集中度高，部署画像复杂
      - - AutoStore
        - 相邻既有 AS/RS
        - 1,950+ 套系统、65+ 个国家、通过合作伙伴覆盖 1,300+ 家客户
        - 高 SKU 零售、电商、医疗健康、制造、3PL
        - 装机基础、合作伙伴渠道、立方存储效率、IP 深度
        - 不是原生全托盘存储或码头缓冲系统
      - - Exotec
        - 相邻 AS/RS 同行
        - 20+ 个下一代项目和 $400M 披露项目价值
        - 零售、食品杂货、3PL、医疗健康、多渠道履约
        - 箱件和单件灵活性，整合缓冲、排序和紧凑设计
        - 以箱件为中心的架构，不是直接的全托盘类比
      - - Ocado Intelligent Automation / 6 River Systems 对比组
        - 相邻 AMR 和软件栈
        - 披露 127 个仓库、1,000+ 家门店、70 个商业客户或合作伙伴、2,500+ 台在运行 AMR
        - 3PL、食品杂货、零售配送，以及混合托盘加单品履约站点
        - Porter 覆盖托盘和笼车，Chuck 和 Ocado IQ 延伸到单品拣选和软件编排
        - 对托盘移动或拣选编排是强替代品，但不是原生密集全托盘存储系统
      - - Hai Robotics
        - 相邻货到人 AS/RS
        - 模块化周转箱和箱件自动化，具备双深位密度，适合存量设施部署
        - 高 SKU 电商、零售、3PL、制造，以及混合箱件或周转箱履约
        - HaiPick 和 HaiQ 提供灵活的容器化自动化，改造经济性强
        - 核心载荷和存储模型是周转箱、纸箱和箱件，而不是全托盘
      - - Dematic
        - 既有托盘集成商
        - 按收入计，全球最大自动化提供商之一
        - 制造、食品饮料、零售、电商、医药
        - WIP 缓冲、成品处理、托盘穿梭车变体、系统集成深度
        - 项目周期复杂，且无公开标价
      - - Swisslog
        - 既有托盘集成商
        - KUKA 支持的全球自动化足迹，有具名饮料和 FMCG 案例
        - FMCG、食品饮料、制造、低 SKU 高吞吐仓库
        - PowerStore 托盘密度、温度范围、SynQ 软件集成
        - 最适合 SKU 更少、吞吐更结构化的场景，而不是广泛混合工作流
      - - Geek+
        - 直接相邻机器人同行
        - 披露服务 800+ 行业领导者，员工 950+
        - 零售、3PL、FMCG、医药、汽车、B2B 和 B2C 仓库
        - 在一个多层系统中支持整托盘加混合单品拣选
        - 公开验证更偏向拣选灵活性，而不是 Mytra 式缓冲和越库
      - - Seegrid / MiR
        - 运输替代品
        - Seegrid 高载重举升 AMR；MiR1200 可搬运 1,200 kg 欧标托盘
        - 寻求更安全托盘移动的存量仓库和工厂
        - 无需重大基础设施变更即可更快改造、替代人力
        - 运输自动化无法形成密集存储或排序护城河
      - - Locus / GreyOrange
        - 软件层替代品
        - 1,000+ 台机器人或 100+ 个站点编排说法；GreyOrange 显示 3,000+ 个活跃站点
        - 已混用供应商的运营商、存量站点、工作流软件层
        - 多机器人编排可以抽象硬件并扩大买方选择
        - 今天仍是间接替代，而非一比一全托盘存储竞争对手
    notes: 画像行覆盖截至 2026 年运行日由官方来源和独立排名浮现的最相关直接、既有、相邻和替代选项；不是完整全球普查。
