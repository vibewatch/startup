      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Mytra 的创始人与市场匹配度强，而且公开记录里异常清楚。Chris Walti 带来 Tesla 仓储物流以及后续 Optimus 人形机器人项目的直接经验；Ahmad Baitalmal 则带来 Tesla
              和 Rivian 的工厂软件领导经验。这些背景正好对应公司的论点：传统物料流自动化不足，并不是没人看到痛点，而是现有仓储系统太僵硬、太重硬件、太难改。多篇发布报道还提到，Mytra 源自 Eclipse 的
              venture-equity 引擎，这有助于解释公司为何能从概念快速推进到有融资支持的产品项目。


              2025 年，公开领导层材料有所扩展：Gabi Bressack Gantus 出任首任 CFO，Zach Kirkhorn 加入董事会，两人此前都在 Tesla 拥有高级财务经验。2026 年 1 月材料还列出
              Ingrid Cotoros 担任首席发展官，Nigel Marcussen 担任规模化副总裁。领导层扩张很重要，因为它说明 Mytra 在完成 Series C
              时，已不只是创始人主导的秘密项目。即便如此，公开治理透明度仍然偏薄。已审阅公开来源没有给出完整董事会名单、控制权安排或所有权图谱，只能看到少数具名高管和投资人。因此，关键人物风险和控制权风险仍需后续尽调解决。
