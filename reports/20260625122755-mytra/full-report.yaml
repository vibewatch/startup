  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Full-pallet workflow niche
        - Incumbent pallet systems already automate storage, buffering, and WIP flows
        - High
        - Dematic and Swisslog publish pallet-flow capabilities that cover much of the same buyer pain
        - Request win-loss data showing where open-perimeter architecture beats incumbent pallet AS/RS on live economics
      - - Buffer and sequencing differentiation
        - Exotec is internalizing integrated buffer and outbound sequencing in adjacent AS/RS workflows
        - High
        - Next-generation Skypod adds buffer and sequencing and claims strong density and throughput gains
        - >-
          Validate whether Mytra still wins when the buyer's problem is mixed case-plus-pallet flow rather than pure
          pallet storage
      - - Hardware uniqueness
        - Locus and GreyOrange could shift buyer attention toward orchestration layers above mixed hardware fleets
        - Medium-High
        - Both vendors market multi-robot or multi-site orchestration at scale
        - Test whether Mytra can own the control layer or expose APIs that keep it inside the orchestration stack
      - - Channel and installed-base deficit
        - AutoStore, Dematic, and Swisslog already have partner or incumbent reach that shortens sales cycles
        - High
        - >-
          AutoStore discloses 1,950+ systems and a partner model; rankings describe Dematic and Swisslog as global
          integrators
        - >-
          Ask for Mytra's current deployment count, channel plan, and evidence that direct sales can scale without
          reseller leverage
      - - Pricing power
        - Large buyers can use public-peer contracts and incumbent bids to force concessions
        - High
        - Symbotic's Walmart disclosure shows cost-plus style implementation economics and long support terms
        - >-
          Get actual quote comps or signed SOWs to test whether Mytra is selling premium capability or buying growth
          with services
      - - Service-led trust model
        - Vendor accountability improves buyer appeal but concentrates margin and renewal risk on Mytra
        - High
        - >-
          CEO Today argues the service model shifts uptime and integration risk to the vendor, where one bad deployment
          can impair renewals
        - >-
          Audit SLAs, acceptance criteria, reserve policy, and escalation playbooks before treating recurring revenue as
          durable
      - - Architecture and IP moat
        - Storage-automation IP is contested and enforced by scaled players
        - Medium
        - AutoStore cites 3,800+ granted patents and patent applications and references the Ocado settlement
        - >-
          Review patent landscape and freedom-to-operate work before assuming Mytra's mechanical approach is
          uncontestable
    notes: >-
      Severity is the author's evidence-backed judgment about what could impair Mytra's differentiation or commercial
      leverage over the next one to three years.
    enumerationScope:
