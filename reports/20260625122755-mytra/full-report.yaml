      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The operating model is a software-defined ASRS-like platform whose novelty lies in how much logic is
              shifted into a coordinated software layer. Public sources describe a low-profile robot moving trays or
              payload cells in X, Y, and Z directions through a repeating storage grid, with company-authored materials
              adding the headline metrics: 3,000-pound lift capacity, 99.999% uptime, 11 cameras plus a gyroscope for
              navigation, and 150 presentations per hour. Flow Engineering adds rare technical color by explaining that
              route planning, slotless inventory, dynamic parallelization, and self-healing redundancy are implemented
              in software rather than being hard-coded into a fixed hardware path. That is a stronger architecture
              signal than the launch PR alone because it connects product claims to real systems-engineering work. The
              same source also shows how Mytra manages complexity internally. Mechanical, electrical, firmware,
              software, and AI workstreams are linked through a requirements-risk-test system of record, which is
              exactly the kind of process one would expect from a company trying to commercialize safety-relevant
              robotics with a small team. In practice, the architecture looks like five layers: physical grid and trays,
              robot locomotion and helical drive, perception and control, orchestration software, and perimeter handoff
              to customer operations. What remains missing from the public file is customer-facing detail on WMS, ERP,
              dock-equipment, or transport-system integration.
