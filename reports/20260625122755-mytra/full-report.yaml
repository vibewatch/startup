      - number: '1.4'
        title: Milestones, Customers, and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              Mytra’s public milestone sequence shows a company moving from concept validation into scaled deployment
              readiness very quickly. Within roughly two years of its May 2022 founding, it emerged from stealth with
              live Albertsons production use, a disclosed blue-chip customer reference, and a differentiated full-pallet
              automation narrative. By mid-2025 it had upgraded into a 100,000-square-foot Brisbane headquarters and
              factory, described as seven times the prior footprint, to support robot build-outs, testing, development,
              and customer demos. Those scale signals were then reinforced by the August 2025 Zach Kirkhorn board
              addition and the January 2026 Series C. The combined picture is of a company trying to professionalize
              fast enough to support larger and more complex deployments.


              Customer proof is meaningful but still selective. Albertsons remains the best-named reference, while
              January 2026 disclosures added only category-level detail on a Fortune 100 food company and a Fortune 500
              industrial-supply distributor. Performance claims are strong for an early-stage robotics company: 32%
              lower material-handling labor, 34% better storage density, up to 88% labor-hour savings, and roughly
              double the internal rate of return versus best-in-class alternatives. The main adverse signal is not a
              public lawsuit or recall but a structural one. CEO Today’s 2026 analysis argued that Mytra’s more
              service-led model concentrates accountability on the vendor, meaning a bad deployment could directly
              damage renewals, margins, and valuation confidence. Combined with the absence of public revenue, ARR, and
              precise valuation disclosure, that makes Mytra’s execution risk more important than its category
              narrative.
