  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Budget-owner relevance
      - Diligence ask
    rows:
      - - Labor scarcity and wage pressure
        - Driver
        - Current
        - Large labor pools and rising wages make automation a hedge against service degradation and hiring difficulty
        - Raises willingness to fund capex when labor is chronically hard to source or retain
        - Request site-level labor vacancy, overtime, and turnover data before underwriting payback
      - - Cube utilization and dead space
        - Driver
        - Current
        - Dense pallet systems can monetize footprint where aisles and clearance waste expensive square footage
        - Supports projects when facilities are constrained but relocation is unattractive
        - Quantify current usable cube, reserve-pallet density, and avoided expansion spend
      - - Order accuracy, service reliability, and store-ready sequencing
        - Driver
        - Current to near-term
        - >-
          Grocers and distributors buy automation to improve in-stock performance and reduce shipping errors, not just
          remove heads
        - Expands the business case beyond labor to customer-service economics
        - Request error-rate, fill-rate, and store-delivery metrics for pilot vs manual baseline
      - - Brownfield flexibility and phased rollout
        - Driver
        - Near-term
        - Retrofit-friendly systems are more fundable than all-or-nothing greenfield rebuilds inside existing networks
        - Helps budget owners spread spend over multiple nodes and phases
        - Test how much civil work, downtime, and WMS change are needed in a live facility
      - - High capex and long payback
        - Constraint
        - Current
        - Projects can miss hurdle rates when savings are slower than lease duration or demand density is weak
        - CFO scrutiny rises sharply when payback extends beyond two to three years
        - Ask for deployment capex, commissioning cost, and sensitivity to lower-than-plan throughput
      - - Legacy integration, technician scarcity, and cyber risk
        - Constraint
        - Current to medium-term
        - >-
          Brownfield sites often need WMS/WCS integration, specialist labor, and stronger OT security before automation
          works reliably
        - Can delay launches and inflate services spend after the hardware contract is signed
        - Request integration map, staffing plan, spare-parts model, and cyber-responsibility matrix
      - - Architecture mismatch or wrong node economics
        - Constraint
        - Current
        - >-
          Kroger's pullback shows that fixed automation can destroy ROI when volume density and workflow shape do not
          fit
        - Budget owners must compare pallet reserve use cases against each-pick consumer fulfillment carefully
        - Run site-by-site density and channel-mix tests before scaling one design across the network
      - - Macro, tariff, and vendor volatility
        - Constraint
        - 2026 to 2027
        - Interact highlights policy, raw-material, and memory-supply risks that can move pricing and order timing
        - Capex committees may defer projects even when operational pain is real
        - Monitor tariffs, vendor health, and the mix of greenfield versus retrofit demand in 2026-2027
    notes: >-
      The same factors that make the market attractive also narrow the monetizable slice. The chapter ties each driver
      or constraint to timing and budget ownership so valuation does not assume frictionless adoption.
