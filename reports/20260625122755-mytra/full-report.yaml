        title: Partner, Customer, and Capital Dependencies
        blocks:
          - type: paragraph
            body: >-
              Mytra's public dependency map is more opaque than its product story. The positive reading is that the
              company has attracted strategic and financial backing, including logistics-adjacent investors cited by DC
              Velocity, and it now has enough capital to pursue a larger deployment cadence. The harder reading is that
              the public file still does not disclose customer count, top-account exposure, renewal behavior, or the
              split between pilots and scaled production sites. That makes it hard to distinguish broad market pull from
              a few high-value lighthouse relationships. Comparable public-company disclosures are again useful.
              Symbotic's filing shows how much one automation vendor can depend on a small set of strategic
              relationships and how deployment cash timing can distort operating cash flow. AutoStore's annual report
              says the business is project-driven, pushed new tariff-handling processes, and added suppliers to reduce
              risk, implying that supplier resilience and trade policy matter even for scaled vendors. Interact Analysis
              adds the macro warning: the warehouse-automation market was turbulent in 2025, with tariff and political
              volatility plus vendor distress events such as Attabotics' bankruptcy and Zebra's robotics retrenchment.
              Mytra therefore should be underwritten as a company that may have real demand, but still sits inside a
              category where supplier constraints, strategic-account concentration, capex pauses, and financing windows
              can change quickly. The lack of public concentration and supplier disclosures is itself a material risk
              input, not a clerical omission.
