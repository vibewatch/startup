      - - Gross margin bridge and service margin
        - Separates attractive software leverage from hardware and uptime burden.
        - Unknown publicly.
        - >-
          Request cohort gross margin by installation, steady-state service margin, and warranty / credit reserve
          history.
      - - Cash, burn, and runway
        - Needed to assess capital adequacy after the Series C.
        - Unknown publicly.
        - Request current cash, 13-week cash forecast, monthly burn by function, and downside runway case.
      - - Contract structure and SLA risk transfer
        - Determines whether service-led positioning creates durable recurring value or margin fragility.
