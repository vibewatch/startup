      - number: '3.3'
        title: Substitutes, Switching Costs, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this market come from more than ripping out hardware. Once a buyer ties warehouse
              control logic, ERP or WMS integration, maintenance procedures, outbound sequencing rules, and labor plans
              to one automation stack, changing vendors becomes a multi-quarter operating project. Symbotic's Walmart
              contract makes this explicit through long support tails, performance gates, and strategic rights.
              AutoStore's lock-in is softer but still powerful because distribution partners own installation, support,
              and much of the customer interface. Those dynamics favor vendors with dense partner networks, major
              reference customers, or audited public-company disclosure over earlier entrants that are still proving
              repeatable deployment playbooks.

              Adjacent and substitute vendors matter because they can peel off one buyer pain point without asking for a
              warehouse-wide rewrite. Seegrid and MiR automate pallet transport and lift work in brownfield settings;
              LocusONE and GreyMatter promise to orchestrate mixed fleets and multiple workflows from a software layer;
              and internal build remains viable where the buyer mainly wants safer transport or better WMS discipline
              rather than dense storage. Ocado Intelligent Automation and Hai Robotics belong in this adjacency bucket
              more than in the direct-peer bucket: Ocado's public stack pairs Porter pallet-move AMRs with Chuck
              item-picking robots under Ocado IQ, while HaiPick Climb is a double-deep tote and case goods-to-person
              system under HaiQ. Both can absolutely appear in the same RFP universe, but they solve pallet movement,
              item fulfillment, or software-orchestrated workflow breadth more directly than Mytra's core problem of
              dense full-pallet storage plus buffer control. This raises Mytra's GTM burden. The company must prove that
              the combined value of storage density, buffer management, and sequencing outweighs the lower-risk
              alternative of layering transport AMRs, orchestration software, or incumbent services on top of the status
              quo.
