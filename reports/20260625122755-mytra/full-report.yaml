      - number: '2.2'
        title: Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence is strongest when treated as a stack of lenses instead of a single canonical TAM. On
              the broadest current lens, Mordor estimates the warehouse automation market at $34.17 billion in 2026
              while Fortune Business Insights publishes $36.24 billion for the same year; Grand View starts from a lower
              2024 base of $21.30 billion and projects $59.52 billion by 2030. Narrowing to ASRS brings the range down
              but does not eliminate disagreement: NextMSC puts warehouse ASRS at $8.56 billion in 2026, Polaris at
              $10.51 billion, and Mordor at $11.39 billion. Those differences are mostly methodological, not factual
              errors. Some publishers are counting all warehouse automation infrastructure, others isolate
              storage-and-retrieval systems, and others still treat TAM as a full segmentation framework that also
              contains mobile robots, WMS, and AIDC. For Mytra, the most decision-useful filter is brownfield pallet
              automation inside large installed distribution networks. L.E.K. says 65%-70% of annual spend now targets
              retrofit and brownfield upgrades across more than 20 billion square feet of warehouse space, which is a
              better proxy for Mytra's practical wedge than a generic global automation total.
