      - number: '8.2'
        title: Comparable Framework and Public-Market Anchors
        blocks:
          - type: paragraph
            body: >-
              Because Mytra does not disclose revenue or cash-flow inputs publicly, the cleanest valuation frame is
              relative rather than formulaic. Public warehouse-automation comps span a wide band. Symbotic is the
              premium outcome: roughly $24 billion of market value, about $2.5 billion of trailing revenue, positive Q2
              2026 net income, $2.0 billion of cash, and EV/sales around 8.6x. AutoStore offers a more compact but still
              strong benchmark: about $4.1 billion of market cap, roughly NOK 6.0 billion of trailing revenue, gross
              margins above 70%, and EV/sales near 7.1x. Ocado is the cautionary counterweight: despite technical
              capability and continuing volume growth, its public market cap is only about $2.0 billion and its EV/sales
              sits closer to 1.8x, after years of capital-intensity skepticism and site rationalization. Daifuku,
              meanwhile, shows what incumbent scale looks like in material handling, but its diversified, mature profile
              is more floor-like reference than startup ceiling.


              The implication is important. Public markets will pay premium multiples for automation businesses when
              investors can see scale, profitability trajectory, installed-base durability, and balance-sheet strength.
              They will also rerate the same category hard when those proofs are missing or when capital intensity
              dominates the story. Mytra has not yet disclosed enough to place itself confidently on that spectrum. Even
              the private-tracker layer is unstable: Tracxn shows about $2 billion while Premier Alternatives shows $565
              million, underscoring how little public support exists for any single Mytra mark. That is why a literal
              revenue-multiple exercise would be false precision. The right use of comparables is to define guardrails:
              Symbotic is the premium proof case, AutoStore is the profitable platform case, Ocado is the compression
              case, and Daifuku is the incumbent scale case. Mytra still sits between those endpoints, with too little
              public disclosure to claim the premium end of the range.
