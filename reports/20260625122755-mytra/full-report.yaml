      - number: '5.3'
        title: Deployment, Integration, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Deployment maturity is stronger than the average deep-tech robotics launch, but it is still visibly
              mid-scale. By July 2024, independent trade coverage said Mytra was already in production at select
              Albertsons distribution centers. By January 2026, the company said it had shipped two pilot systems, gone
              live at a new customer site, and signed a deployment sixty times the size of its prior largest
              installation. The June 2025 move into a 100,000-square-foot Brisbane headquarters and factory is also
              product-relevant, not merely corporate. Mytra describes the site as a place for build-outs, research and
              development, testing, validation, and live customer demos, which suggests deployment readiness depends on
              a substantial in-house validation environment. Support and roadmap signals come mostly from hiring and org
              design. The company publicly advertised roles in systems integration, systems test, safety systems
              architecture, electrical engineering, technical program management, quality, and operations, while
              separately expanding leadership in AI/computer vision, electrical, and structural engineering. Together,
              those signals imply that the next eighteen months of roadmap execution are likely to focus on making
              deployments more repeatable, scaling robot-and-rack hardware, and hardening perception and control. That
              is a healthy sign for maturity, but it also implies the product is not yet a fully standardized drop-in
              platform with public interface or service documentation.
