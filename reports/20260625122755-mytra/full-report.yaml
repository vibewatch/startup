  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              Mytra's highest residual risk is executional rather than conceptual. Public evidence is strong enough to
              show a real product, a fresh $120 million round, two shipped pilot systems, a new live customer site, and
              a signed deployment sixty times larger than the company's prior largest installation. Those are
              encouraging momentum signals, but they also show the company is in the middle of industrializing
              deployments rather than operating from a long-public record of repeatable large-scale sites. The public
              file is still light on the artifacts that usually reduce underwriting uncertainty in industrial
              automation: named safety certifications, public service-level commitments, customer concentration
              disclosures, renewal data, and a detailed incident or uptime audit trail. Comparable warehouse-automation
              disclosures are the important warning signal here. Symbotic's filing shows how large deployments can
              create working-capital timing pressure and dependence on a few strategic accounts, while AutoStore's
              annual report says the business remains project-driven and now carries service-model exposure through
              AutoStore-as-a-Service. Industry research adds that customers increasingly prioritize uptime, fast
              response, and integration compatibility. That combination puts Mytra's residual risk stack in four tiers:
              deployment reliability first, contract and assurance opacity second, customer and partner concentration
              opacity third, and margin/cash timing fourth. The current evidence supports continued diligence, but not a
              low-touch underwriting process.
