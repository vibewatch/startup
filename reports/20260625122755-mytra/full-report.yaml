  - id: TI002
    title: Pricing / monetization table
    columns:
      - Pricing unit / contract concept
      - Public evidence
      - List vs realized pricing status
      - Implication
      - Diligence ask
    rows:
      - - Large enterprise deployment contract
        - >-
          Fortune-reported Eclipse commentary says industrial deals begin in the tens of millions and can scale far
          higher inside one account.
        - No public list price; only opportunity framing.
        - Suggests bespoke site-level pricing and long sales cycles rather than catalog pricing.
        - Obtain signed SOWs with initial contract value, change-order rules, and deployment milestones.
      - - Service-led / RaaS outcome fee
        - CEO Today says customers buy certainty and vendors keep accountability for uptime and performance.
        - Third-party characterization only; realized terms unknown.
        - If true, revenue may recur over time but vendor risk retention increases.
        - Inspect one service-led contract and its KPI definitions, credits, renewal mechanics, and payment cadence.
      - - Capex-avoidance pitch to customer CFOs
        - CEO Today says buyers are reluctant to place fast-changing robotics on their own balance sheets.
        - Narrative support only; no actual financing plan disclosed.
        - Supports buyer ROI story but may imply Mytra must finance more of the delivery burden.
        - Ask whether customers pay upfront, on milestones, or through ongoing throughput or capacity fees.
      - - No public price card for robots, cells, or software
        - Company pages and jobs pages publish no standard commercial terms.
        - Entirely undisclosed publicly.
        - Prevents comparison of list price, discounting, and realized contribution margin.
        - Request a standard pricing architecture and last five won-deal pricing exceptions.
    notes: >-
      This is a pricing-evidence table, not a realized-pricing table. Every row either cites public narrative evidence
      or explicitly marks the pricing field as undisclosed.
