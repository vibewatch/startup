      - CV022
      - CV023
      - CV025
      - CV026
      - CV027
      - CV029
      - CV030
      - CV031
      - CV035
      - CV045
  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down round or flat round with heavier preferences
        - Next priced financing below or effectively below the visible private anchor after preferences
        - >-
          Shows that financing support was weaker than the current narrative suggests and that equity upside is being
          subordinated.
        - Pause or walk unless price resets far enough to restore expected return.
      - - Weak audited economics
        - Audited revenue, gross margin, or service contribution materially below investor expectations
        - Breaks the premium-proof case and pushes Mytra toward compressed-comp logic.
        - Rebase to bear-case valuation or stop.
      - - Customer proof does not convert
        - >-
          No referenceable multi-site accounts or materially weaker deployment repeatability than implied by 2025
          announcements
        - Undermines the market-share and moat narrative derived from workflow fit.
        - Hold recommendation at research-more and delay investment.
      - - Deployment economics are service-heavy
        - Support, integration, or field-service burden overwhelms software or hardware margin progress
        - Turns growth into labor-intensive delivery rather than scalable platform economics.
        - Demand a much lower price or walk.
      - - Public-market comp reset
        - Warehouse-automation multiples compress meaningfully from current Symbotic/AutoStore bands
        - Removes the external support that currently underpins even the bull-case ceiling.
        - Tighten valuation band and require wider margin of safety.
    notes: >-
      Triggers are framed so an investment committee can observe them in diligence or in future financing events. Each
      one turns a qualitative concern into a concrete wait / invest / walk-away rule.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV039
      - CV042
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Official valuation and cap table
        - >-
          Series C post-money, round-by-round ownership, liquidation preferences, participation, and any
          structured-financing seniority
        - Equity returns can differ materially from enterprise-value headlines when preference overhang is large.
        - Finance + legal data room; review charter, financing docs, and updated cap table.
      - - Audited financial statements
        - 2025 and YTD 2026 revenue, gross margin, service margin, cash burn, backlog, and working-capital needs
        - Current public valuation logic is constrained because the core economic inputs are not public.
        - CFO diligence package; reconcile to audit workpapers and board materials.
      - - Customer concentration and deployment economics
        - Named accounts, ACV, payback, uptime, installation timeline, and renewal behavior by cohort
        - Helps determine whether the 2025 momentum is scalable or still highly project-specific.
        - Revenue-ops / customer-success review and reference calls.
      - - Operational scaling burden
        - Field-service headcount plan, integration burden, warranty exposure, and spare-parts assumptions
        - Determines whether growth compounds or simply multiplies service complexity.
        - Ops / manufacturing diligence and deployment postmortem review.
      - - Exit readiness
        - Audit readiness, banker dialogue, governance maturity, and likely liquidity path
        - A premium private price is easier to justify when a credible next-financing or liquidity route exists.
        - CEO / GC / finance diligence; request governance calendar and financing roadmap.
      - - Price-moving proof points
        - Conditions that would justify paying above the current directional mark
        - Separates company admiration from disciplined entry pricing.
        - IC memo update after diligence closure; re-run scenario table once private metrics are received.
    notes: >-
      These asks are prioritized by how directly they change underwriting. Items 1-3 are valuation critical; items 4-6
      determine whether the premium case can endure.
    claimRefs:
      - CV012
      - CV033
      - CV034
      - CV043
      - CV044
