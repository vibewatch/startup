        title: Exhibits
        blocks:
          - type: callout
            title: Distinctive full-pallet architecture is the clearest moat in the public file
            body: >-
              Mytra’s best-supported advantage is not simply “warehouse robotics” in the abstract; it is a
              software-defined full-pallet system that combines 3D movement, simpler perimeter integration, and a
              structure that can be reshaped without rethinking the whole site. Public customer proof at Albertsons
