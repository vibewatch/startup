        title: Cost structure, margin drivers, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence strongly suggests that Mytra’s cost base is multi-layered and hardware-service heavy. The
              Brisbane headquarters announcement described a 100,000-square-foot factory that supports build-outs, R&D,
              and live customer demos for a 100-person team, while the company page later rounded headcount to 150+ and
              the jobs board showed hiring across commercial, hardware, operations, and G&A. That combination is
              inconsistent with a lightweight software cost model. Instead, it implies cash use across assembly or
              manufacturing coordination, validation environments, field deployment labor, and ongoing customer support.
              Mytra’s own ROI claims are directionally attractive: official materials cite 32% lower material-handling
              labor and 34% higher storage density, while independent launch coverage repeated claims of up to 88%
              labor-hour savings and double the internal rate of return versus best-in-class alternatives. Those
              outcomes help explain why customers buy, but they do not reveal what Mytra earns. Public comps help frame
              the range. Symbotic’s latest filing shows a systems-heavy revenue mix with low-20s gross margin and
              meaningful inventories, unbilled receivables, deferred revenue, and property-and-equipment needs.
              AutoStore, by contrast, reports near-70% gross margins while relying on integrator partners for design,
              installation, and service. Mytra’s public footprint looks closer to the direct-deployment end than the
              partner-led end, which means service accountability and site complexity likely matter more than software
              gross-margin theory.
