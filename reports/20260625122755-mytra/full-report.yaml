  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue stream
      - Public support
      - Current value / status
      - Revenue-quality read
      - Diligence ask
    rows:
      - - Enterprise deployment / system revenue
        - >-
          Independent coverage says industrial contracts start in the tens of millions and official sources emphasize
          much larger site deployments.
        - Supportable as a likely revenue stream; exact share unknown.
        - Potentially large bookings per account, but likely milestone-heavy and concentrated.
        - Request bookings-to-revenue bridge, acceptance criteria, and revenue-recognition policy by deployment stage.
      - - Recurring service / uptime revenue
        - CEO Today describes a service-led, outcome-based model, but Mytra does not publish contract form.
        - Possible and directionally supported; not officially quantified.
        - Could improve visibility if renewals stick, but also keeps execution risk on Mytra.
        - Review SLA terms, renewal economics, uptime credits, and service gross margin by site cohort.
      - - Software / orchestration revenue
        - >-
          Mytra describes itself as software-defined; Symbotic shows a small software line while AutoStore blends
          software into a partner-led model.
        - No standalone public dollar disclosure for Mytra.
        - High-margin potential exists, but public evidence does not prove software monetization is separable today.
        - Request software license or maintenance line items, if any, and proof of attach rate by installed site.
      - - Expansion / add-on deployment revenue
        - Series C materials cite signed large organizations and a 60x larger deployment than the prior maximum.
        - Supportable as pipeline or expansion potential; realized conversion unknown.
        - >-
          Good upsell potential if first sites work, but concentration risk remains high until multiple expansions are
          visible.
        - Request cohort schedule showing initial deployment, expansion timing, and incremental gross margin.
    notes: >-
      The table distinguishes publicly supported revenue mechanisms from undisclosed revenue mix. Unknown means the
      reviewed public file does not provide a numeric stream share or accounting policy.
    claimRefs:
      - CI011
      - CI013
      - CI014
      - CI017
      - CI018
      - CI019
      - CI037
