      - number: '7.2'
        title: Legal, Regulatory, and Contract Boundaries
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory risk is not that Mytra has a disclosed enforcement event today; it is that the
              company sells safety-relevant warehouse automation while most of the investor-grade assurance package
              still sits outside the public file. OSHA's warehousing overview explicitly lists powered industrial
              trucks, material handling, and robotics among the industry's hazards, and OSHA's powered-industrial-truck
              standards show how much of the surrounding operating environment is governed by specific forklift rules.
              Because Mytra now operates a California headquarters and factory, Cal/OSHA oversight and Title 8 standards
              also matter. Mytra's own public legal pages narrow what outsiders can underwrite from the website alone.
              The privacy policy says customer-processed personal information is governed by customer agreements, and
              the terms page says Mytra Services are governed by separate agreements while the public site is provided
              as-is. That means core questions around uptime remedies, acceptance criteria, indemnities, data handling,
              and service credits have been pushed into private contracts. The privacy policy also says Mytra uses
              technical, organizational, and physical safeguards but cannot guarantee security. FTC guidance and NIST's
              cybersecurity framework make that a real diligence issue, not boilerplate. Add CPSC recall authority,
              export-control language in the terms page, and an expanding patent estate that still leaves
              freedom-to-operate and enforcement questions, and the result is a legal/regulatory stack that is
              manageable only with private diligence-room evidence.
