      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The capital story is clearer than the operating story. Publicly, Mytra can support at least $198 million
              of lifetime funding using the $78 million disclosed at launch through Series B and the later $120 million
              Series C; the company now rounds that to $200 million on its website. The latest raise was explicitly
              positioned as deployment-scaling and talent capital, which fits the observable footprint: a larger
              factory, faster headcount growth, more senior finance leadership, and continued open roles. That is enough
              to argue that Mytra is not currently starved for capital. It is not enough to prove runway. No reviewed
              public source discloses cash on hand, monthly burn, debt, equipment finance, or project-finance
              obligations. That omission matters because hardware deployment businesses often absorb working capital
              before revenue fully converts, especially when customers demand uptime commitments, custom site
              preparation, or long acceptance cycles. Symbotic’s filing is a useful cautionary analogue: even at scale,
              warehouse-automation economics can include large inventories, unbilled receivables, and deferred revenue
              balances. Mytra may be smaller and structurally different, but the direction of travel is similar enough
              to warn against casual assumptions. The supportable conclusion is that the Series C likely bought time and
              credibility, yet a future round will still hinge on repeatable deployments, service reliability, and
              actual revenue conversion rather than narrative alone.
