  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / class
      - Category
      - Scale / funding signal
      - Target customer
      - Differentiation
      - Limitation vs Mytra
    rows:
      - - Mytra
        - Direct startup
        - Approx. $198M to >$200M raised publicly; early named production proof
        - Grocery, retail, food, and pallet-heavy operators needing storage plus flow control
        - Full-pallet storage plus case pick, dock buffer, and cross-dock workflows in one system
        - Limited public installed-base disclosure, opaque pricing, and weaker distribution reach
      - - Symbotic
        - Direct scaled benchmark
        - Public-company scale; Walmart strategic ownership and 400-system commitment
        - Large retailers and grocery distribution networks
        - Dense storage, case automation, software, and unrivaled enterprise reference depth
        - Heavy customer concentration and complex deployment profile
      - - AutoStore
        - Incumbent adjacent AS/RS
        - 1,950+ systems, 65+ countries, 1,300+ customers via partners
        - High-SKU retail, ecommerce, healthcare, manufacturing, 3PL
        - Installed base, partner channel, cube-storage efficiency, IP depth
        - Not a native full-pallet storage or dock-buffer system
      - - Exotec
        - Adjacent AS/RS peer
        - 20+ next-gen projects and $400M disclosed project value
        - Retail, grocery, 3PL, healthcare, multichannel fulfilment
        - Case and each flexibility with integrated buffer, sequencing, and compact design
        - Case-centric architecture is not a direct full-pallet analogue
      - - Ocado Intelligent Automation / 6 River Systems
        - Adjacent AMR and software stack
        - 127 warehouses, 1,000+ stores, 70 commercial clients or partners, and 2,500+ live AMRs disclosed
        - 3PL, grocery, retail distribution, and mixed pallet plus item-fulfilment sites
        - Porter covers pallets and cages while Chuck and Ocado IQ extend into item-picking and software orchestration
        - >-
          Strong substitute for pallet movement or picking orchestration, but not a native dense full-pallet storage
          system
      - - Hai Robotics
        - Adjacent goods-to-person AS/RS
        - Modular tote and case automation with double-deep density and brownfield-friendly deployment
        - High-SKU ecommerce, retail, 3PL, manufacturing, and mixed case or tote fulfilment
        - HaiPick and HaiQ offer flexible container-based automation with strong retrofit economics
        - Core payload and storage model is totes, cartons, and cases rather than full pallets
      - - Dematic
        - Incumbent pallet integrator
        - One of the world's largest automation providers by revenue
        - Manufacturing, food and beverage, retail, ecommerce, pharma
        - WIP buffering, finished-goods handling, pallet shuttle variants, system integration depth
        - Project-cycle complexity and no public list pricing
      - - Swisslog
        - Incumbent pallet integrator
        - Global KUKA-backed automation footprint with named beverage and FMCG references
        - FMCG, food and beverage, manufacturing, lower-SKU high-throughput warehouses
        - PowerStore pallet density, temperature range, SynQ software integration
        - Best fit is fewer unique products and structured throughput rather than broad mixed workflows
      - - Geek+
        - Direct-adjacent robotics peer
        - 800+ industry leaders served and 950+ employees disclosed
        - Retail, 3PL, FMCG, pharma, automotive, B2B and B2C warehouses
        - Whole-pallet plus mixed-item picking in one multilevel system
        - Public proof leans toward picking flexibility, not Mytra-style buffering and cross-dock
      - - Seegrid / MiR
        - Transport substitute
        - Seegrid high-payload lift AMRs; MiR1200 handles 1,200 kg EU pallets
        - Brownfield warehouses and factories seeking safer pallet movement
        - Faster retrofit and labor substitution without major infrastructure change
        - Transport automation does not create dense storage or sequencing moat
