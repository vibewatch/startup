        - label: Strongest channel moat
          value: AutoStore
          note: 1,950+ systems and a 23-partner-style ecosystem compress GTM friction for the incumbent.
        - label: Strongest adjacent workflow threat
          value: Exotec
          note: Integrated buffer and sequencing erode part of Mytra's narrative without matching full-pallet geometry.
        - label: Best brownfield substitute
          value: Seegrid / MiR
          note: Buyers can automate pallet movement without committing to dense storage architecture.
        - label: Biggest commoditization vector
          value: Locus / GreyOrange orchestration
          note: Software layers can own task logic above mixed fleets and reduce hardware lock-in.
        - label: Biggest unresolved diligence gap
          value: Realized project pricing
          note: Public sources reveal commercial shape but almost never final price per site, pallet, or throughput unit.
    approximationNotes: Values are qualitative summaries from the retained source pack rather than a scored model.
