  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              Mytra’s product should be defined in customer-workflow terms, not as a single robot. Public materials
              repeatedly present the system as three components—bots, software, and cells—built to automate the common
              industrial job of moving and storing material. The named workflows are unusually concrete for an
              early-stage robotics company: pallet pick, case pick, dock buffer, and cross dock. That matters because
              these are not speculative AI use cases; they are the highest-frequency pallet and case movements inside
              grocer, retailer, and industrial distribution sites. The product promise is that a warehouse operator can
              replace aisle-heavy forklift motion with a configurable three-dimensional substrate that receives, stores,
              sequences, and releases inventory to outbound processes. Independent coverage reinforces that Mytra is
              already framing the system around real operational jobs such as buffering and sequencing inventory for
              Albertsons distribution centers rather than around generic warehouse automation. The customer workflow
              also preserves perimeter compatibility. Mytra says forklifts, pallet jacks, people, and other robots can
              still work around the outside of the structure, which lowers adoption friction for brownfield facilities.
              That is strategically important because the product does not ask customers to throw away every adjacent
              material-handling process. Instead, it tries to become the programmable middle layer for high-volume
              pallet and case movement while upstream and downstream handling can remain hybrid. The consequence for
              diligence is positive but bounded: the workflow definition is clear, but customer-specific integration
              details remain thin in public sources.
