      - Lock-in or switching-cost vector
      - Trust signal
    rows:
      - - Mytra
        - Service-led / outcome-oriented positioning with undisclosed realized pricing
        - Unknown
        - Direct enterprise sales and deployment proof still concentrated in a small public set
        - Workflow, uptime, and integration logic sit with the vendor if deployed deeply
        - Named Albertsons proof and strong investor roster, but private-company disclosure is thin
      - - Symbotic
        - Large project economics plus long support and maintenance tails
        - Low for general buyers; partial contract detail exists through Walmart filing disclosure
        - Direct sales into very large retailers and strategic enterprise relationships
        - Performance-gated agreements, long support periods, equity links, and custom software integration
        - Public-company filings plus Walmart reference make trust unusually high
      - - AutoStore
        - Initial system sales plus long-term service agreements
        - Low
        - Partner-led distribution, installation, and support model
        - Installed ecosystem, partner ownership of delivery, and modular expansion inside the same platform
        - Public annual report and very large installed base
      - - Exotec
        - Customized project procurement with modular expansion over time
        - Low
        - Direct solution sales backed by design and execution teams
        - Buffer, sequencing, and case/each workflow logic become embedded once configured
        - Named projects such as Komar, but still selective public disclosure
      - - Dematic / Swisslog
        - Classic project-based capital automation plus software and services
        - Low
        - Direct enterprise sales with long integration cycles and incumbent relationships
        - Deep WMS, controls, facility layout, and maintenance integration
        - Global integrator brands and long customer-reference history
      - - Seegrid / MiR
        - Equipment-led AMR sale with software fleet management and support
        - Low
        - Direct or channel-led AMR sales into brownfield sites
        - Fleet software, traffic rules, and process redesign create moderate stickiness
        - Easier pilot path than full AS/RS but narrower workflow ownership
      - - Locus / GreyOrange
        - Software-led orchestration layered over AMRs and other automation
        - Low
        - Direct enterprise software and robotics-sales motion
        - Orchestration layer can own workflow data, task allocation, and cross-vendor logic
        - Trust depends on breadth of integrations and named site references more than on hardware novelty
      - - Internal build / status quo
        - Forklifts, pallet jacks, WMS rules, and custom integration work
        - High on labor rates and equipment cost; low on true total system cost visibility
        - Internal engineering and operator process design
        - Existing labor habits and low initial disruption slow vendor replacement
        - Familiarity is high, but storage density and sequencing capability stay weak
