  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Safety / assurance gap
        - Named external safety artifact is still unavailable late in customer diligence
        - No cert list, no safety case summary, and no credible reference call on operating incidents
        - Do not underwrite scaled rollout economics until private assurance evidence is produced.
      - - Deployment repeatability
        - Production references fail to broaden after the current pilot wave
        - No second wave of clearly named live sites or repeated reference quality by next financing cycle
        - Shift stance toward track / research-more rather than assuming platform repeatability.
      - - Contract opacity
        - MSA / SLA review shows weak uptime remedies or unusually vendor-hostile economics
        - Material gaps in acceptance criteria, service credits, indemnities, or liability allocation
        - Require repricing, stronger protections, or smaller position sizing.
      - - Customer concentration
        - One account or one channel partner dominates near-term pipeline economics
        - Reference calls or board materials show revenue heavily dependent on one deployment family
        - Apply valuation discount and treat delay risk as thesis-relevant.
      - - Cash / margin stress
        - Follow-on financing occurs before evidence of broader production adoption or with defensive terms
        - Bridge-style round, down-round, or large services burn without new production proof
        - Reassess capital intensity and stop assuming smooth service-led scaling.
      - - Incident / enforcement event
        - A serious safety, privacy, export, or recall event becomes public
        - Named OSHA, Cal/OSHA, FTC, BIS, or CPSC event or credible live-site incident
        - Pause investment decision pending root-cause review and control remediation evidence.
    notes: >-
      These monitors are intentionally event-based because Mytra is private and does not publish the operating metrics a
      public company would. They are meant to convert public ambiguity into concrete diligence gates.
