              The people risk is tightly coupled to execution risk. Mytra's careers page shows 34 open roles across G&A,
              commercial, hardware engineering, operations, and software, while the January 2026 funding release
              separately highlighted more than 20 openings and specifically named senior technical program management
              and safety-systems-engineering needs. That combination suggests both ambition and bandwidth risk: the
              company is trying to scale hardware, software, commercial delivery, and safety assurance at once.
              Investors should treat this as a monitorable risk rather than a generic startup caveat. The leading
              indicators that matter most are visible: whether the company turns pilots into multiple named production
              sites, whether it starts publishing or privately sharing stronger safety and cyber assurance artifacts,
              whether customer references broaden beyond a small set of early adopters, whether headcount growth stays
              focused on deployment and service capacity rather than reactive patching, and whether a follow-on
              financing is raised from strength rather than as a bridge for working capital. None of those indicators
              requires perfect public transparency, but together they define whether Mytra is becoming a repeatable
              industrial platform or remains a promising but labor-intensive custom deployment company. The diligence
              plan should therefore focus on contract terms, reference calls, installation economics, supplier
              redundancy, incident history, and service response data before any investor treats the current valuation
