  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Latest public anchor
      - Multiple / valuation / status
      - Relevance to Mytra
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public references reviewed for this run: Mytra's financing signal and
        third-party estimate, two listed warehouse-automation peers, one compressed automation cautionary comp, and one
        incumbent scale reference. It is not an exhaustive census of every global logistics-automation company or
        private secondary mark.
    rows:
      - - Mytra Series C
        - January 2026 private financing
        - $120M round; official valuation undisclosed; total capital stack reported as >$200M by independent coverage
        - Most relevant live financing signal because it is the company's latest disclosed round.
        - No public post-money valuation, liquidation waterfall, or audited financial package accompanies the round.
      - - Mytra third-party estimate
        - Tracxn funding page
        - ~$2B estimated valuation as of March 24, 2025; $198M raised across four rounds
        - Useful directional private-market anchor when no official valuation is disclosed.
        - Third-party database estimate, not a company-certified price or term sheet.
      - - Mytra Premier Alternatives estimate
        - January 15, 2026 tracker snapshot
        - $565M estimated valuation
        - Shows how wide private-market tracker outcomes can be when the official post-money remains undisclosed.
        - Secondary-market database estimate that conflicts with Tracxn's ~$2B mark and is not company-certified.
      - - Symbotic
        - June 2026 public market
        - ~$23.9B market cap; EV/sales ~8.65x; Q2 2026 revenue $676M and positive net income
        - Best premium-proof public benchmark for scaled warehouse automation with disclosed economics.
        - Much larger scale, public-company disclosure, and customer footprint than Mytra.
      - - AutoStore
        - June 2026 public market
        - ~$4.15B market cap; EV/sales ~7.06x; Q1 2026 revenue $165.8M; 1,300+ customers
        - Strong profitable automation-platform reference showing what investors pay for installed-base durability.
        - Cube/tote fulfillment architecture is not a like-for-like full-pallet system.
      - - Ocado Group
        - June 2026 public market
        - ~$1.96B market cap; EV/sales ~1.83x; still restructuring despite technology progress
        - Useful cautionary comp for capital intensity, slower monetization, and valuation compression.
        - Mixed grocery, logistics, and technology model is broader than Mytra.
      - - Daifuku
        - June 2026 public market / TTM fundamentals
        - ~$16.13B market cap; TTM revenue ~673.18B JPY; mature incumbent profile
        - Provides an incumbent scale floor and shows how large diversified material-handling businesses are valued.
        - >-
          Diversified, mature, and geographically broad, so it is a floor-like reference rather than a startup-growth
          ceiling.
    notes: >-
      The table is designed to bound Mytra's valuation logic qualitatively and with public-market context, not to imply
      that one clean revenue multiple can be ported straight into a private ASRS startup valuation. The split
      Tracxn/Premier Alternatives tracker marks are a feature of the evidence set, not an error to smooth away.
    claimRefs:
      - CV001
