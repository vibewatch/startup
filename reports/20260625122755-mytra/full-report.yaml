      - number: '6.2'
        title: Adoption Trajectory and Named Proof
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is the distinction between what is named, what is production, and what is
              still only category-level. Albertsons clears the highest proof bar because multiple sources state that
              Mytra was already in production at select Albertsons distribution centers when the company launched
              publicly in July 2024. That is materially stronger than a logo wall or pilot announcement. By contrast,
              the two additional 2026 customer references remain unnamed. The company says those accounts include a
              Fortune 100 food company and a Fortune 500 industrial-supply distributor, that a large deployment 60 times
              the prior largest installation was signed in 2025, that two pilot systems shipped, and that one new
              customer site went live in production. Those are meaningful traction signals, but they still preserve
              ambiguity around who the customers are, how many sites are involved, and whether the signed deployment is
              the same account as the new production go-live.


              Outcome proof is similarly asymmetric. Public 2026 materials cite 32% lower material-handling labor and
              34% better storage density in early deployments, while the homepage markets more aggressive generalized
              performance claims such as 2x density, 70% workforce-efficiency improvement, 99.999% uptime, and 150
              presentations per hour. Silicon Foundry adds a useful but still company-mediated anecdote that the first
              customer project exceeded its SLA by roughly three times throughput after about six weeks. The right
              reading is that deployment proof is real and improving, but the highest-confidence facts are still
              existence of deployments and early directional outcomes, not yet broad customer-base scale.
