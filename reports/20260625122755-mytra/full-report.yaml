      - number: '3.2'
        title: Direct Peers and Incumbents
        blocks:
          - type: paragraph
            body: >-
              Symbotic is the hardest external benchmark because it combines dense-storage warehouse automation,
              case-level handling, and extraordinary strategic embed with Walmart. Public disclosures show not just
              product breadth but real contractual leverage: Walmart owned roughly 13% of Symbotic's stock in late 2025,
              had board-observer rights, committed to 400 micro-fulfillment systems with an option for 200 more, and
              agreed to a $520 million development program. Mytra is not selling exactly the same product shape, but
              this is the level of buyer trust and contractual control that a scaled rival can command. AutoStore is
              less direct on full-pallet storage, yet strategically important because its channel model already reaches
              1,950 systems, 65+ countries, and 1,300+ unique customers. For Mytra, that means channel architecture can
              matter as much as robot architecture.

              Exotec, Dematic, Swisslog, and Geek+ round out the serious comparison set. Exotec's next-generation Skypod
              now bundles integrated buffering, outbound sequencing, and each-plus-case picking, narrowing one of
              Mytra's narrative advantages even though Exotec remains case-centric rather than native 3,000-pound
              full-pallet automation. Dematic and Swisslog represent the incumbent answer: project-based pallet
              automation with WIP buffering, finished-goods handling, and long integration histories. Geek+ is closer to
              an adjacent peer, but its pallet-to-person system can work with whole pallets and mixed-item picking, so
