companyProfile:
  summary: >-
    Mytra is a Brisbane, California warehouse-automation company founded in May 2022 by Chris Walti and Ahmad Baitalmal.
    The company sells a software-defined full-pallet ASRS built from bots, storage cells, and orchestration software for
    pallet pick, case pick, dock buffer, and cross-dock workflows. Public evidence shows a live Albertsons deployment,
    additional unnamed Fortune 100 and Fortune 500 customers, a 100,000-square-foot Brisbane headquarters/factory, and a
    $120M Series C in January 2026 led by Avenir Growth. The public diligence file is strongest on product
    differentiation, investor quality, and operating momentum, and weakest on revenue, margin, pricing, concentration,
    and governance disclosure.
