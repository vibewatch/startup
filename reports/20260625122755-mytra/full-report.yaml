  - id: TI004
    title: Capital adequacy table
    columns:
      - Capital item
      - Public value / status
      - What is supportable
      - Risk / implication
      - Diligence ask
    rows:
      - - Lifetime equity raised
        - At least $198M; company page rounds to $200M.
        - Well-supported from official and independent sources.
        - Shows financing access, but not available cash or remaining runway.
        - Reconcile closing cash received net of fees and any secondary or earmarked use.
      - - Cash on hand
        - Unknown
        - No reviewed public source discloses cash balance.
        - Prevents any public runway calculation.
        - Provide latest cash balance, minimum cash covenant, and restricted-cash amounts.
      - - Monthly burn / cash runway
        - Unknown
        - Not publicly disclosed.
        - Series C adequacy cannot be judged without burn and working-capital timing.
        - Provide 13-week cash forecast plus monthly burn by function and scenario.
      - - Planned use of funds
        - Deployment scaling and strategic talent acquisition.
        - Officially disclosed.
        - Consistent with factory expansion and hiring, but does not reveal unit economics.
        - Break planned spend into deployment inventory, headcount, R&D, and SG&A buckets.
      - - Debt / equipment finance / project finance
        - No public disclosure found.
        - Absence of evidence, not evidence of absence.
        - Hidden leverage or customer financing could materially change cash needs.
        - Provide debt schedule, lease obligations, guarantees, and customer-financing programs.
      - - Next-round trigger
        - Likely repeatable deployment execution and revenue conversion from large enterprise accounts.
        - Inference from public customer and contract-size signals.
        - Future capital need likely depends on standardization more than on awareness.
        - >-
          Show board-defined financing trigger metrics: backlog, revenue run rate, gross margin, and on-time go-live
          rate.
    notes: >-
      The table separates what is publicly known from what remains opaque. Unknown means the reviewed public record does
      not disclose the number, not that the value is immaterial.
