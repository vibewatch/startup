          A flat or down next round with heavier preferences would show that the current financing support did not
          translate into durable pricing power.
      - - 'THESIS: Full-pallet workflow fit could justify premium outcomes if execution holds.'
        - >-
          Mytra says early deployments cut handling labor and improve density, while warehouse automation winners are
          rewarded when scale and economics become visible.
        - The premium case improves only if Mytra discloses margins, backlog quality, and repeatable customer economics.
      - - 'ANTI-THESIS: Public valuation support is still indirect.'
        - >-
          Mytra discloses the round amount but not the valuation; the visible ~$2B figure comes from Tracxn, not from
          the company.
        - An official priced round or audited financing package would remove this concern.
      - - 'ANTI-THESIS: The variables that drive returns are still private.'
        - There is no public revenue, gross-margin, cash-flow, or preference-stack disclosure in the reviewed sources.
        - Audited financial statements and a clean cap-table schedule would materially improve underwriting confidence.
      - - 'ANTI-THESIS: Sector comps prove that automation narratives can rerate sharply.'
        - >-
          Ocado has continued operating progress but a much lower public multiple than Symbotic or AutoStore, showing
          how hard capital-intensive automation can re-rate.
        - >-
          A stronger disclosure package and repeatable profitable deployments would move Mytra toward the better public
          comps instead of the compressed ones.
    notes: >-
      The anti-thesis is valuation-centered rather than product-denial. It argues that the price-support package is
      incomplete, not that the company lacks a real problem to solve.
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV027
      - CV031
      - CV033
      - CV034
      - CV042
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Probability signal
      - Valuation range (USD M)
      - Return logic from assumed $2B entry
      - Key swing factors
    rows:
      - - Bull
        - 25%
        - 1800-2600
        - >-
          Roughly 0.9x-1.3x gross value from a $2B entry; upside requires premium-proof execution rather than just
          premium narrative.
        - >-
          Referenceable customers, disclosed service economics, repeatable multi-site deployments, and a new priced
          round above the visible third-party mark.
      - - Base
        - 50%
        - 1100-1700
        - Roughly 0.55x-0.85x gross value; good company, but thin margin of safety at the visible public anchor.
        - >-
          Continued wins, but ongoing opacity on revenue quality, margins, and financing terms keeps a disclosure
          discount in place.
      - - Bear
        - 25%
        - 600-1000
        - Roughly 0.3x-0.5x if the next round resets price or deployment economics disappoint.
        - Flat/down round, heavy preference stack, slower commercialization, or broader sector multiple compression.
      - - Probability-weighted midpoint
        - 100%
        - 1150-1650
        - >-
          Suggests public evidence supports continuing diligence, not paying the full visible private mark as a base
          case.
        - >-
          Recommendation improves only if new evidence closes the disclosure gap or if terms move in the investor's
          favor.
    notes: >-
      Scenario bands are analyst estimates derived from public-comp context, financing signals, and explicit disclosure
      gaps. They are not management guidance and intentionally avoid false precision on revenue multiples.
    claimRefs:
