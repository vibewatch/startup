  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-identity
    missingEvidence: Named customer-level documentation for the Fortune 100 food company and Fortune 500 industrial-supply distributor, including site count and workflow scope.
    whyItMatters: Without names and site details, public references cannot be upgraded into full production case studies or concentration analysis.
    diligencePath: Request customer permission for reference calls, statements of work, and go-live schedules.
    relatedQuestionRefs:
    - QU008
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, and account-expansion cohort data.
    whyItMatters: Durability is currently inferred from deployment momentum rather than measured from recurring customer behavior.
    diligencePath: Request cohort retention tables and renewal histories by account.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: commercial-model
    missingEvidence: Contract term, pricing basis, penalty clauses, and whether customers buy RaaS, capex, or a hybrid structure.
    whyItMatters: Commercial shape determines stickiness, margin sensitivity, and how much concentration risk the board is underwriting.
    diligencePath: Collect template MSAs, pricing schedules, and top-customer contracts.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU005
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: geography-and-count
    missingEvidence: A complete customer ledger with active sites, countries, and vertical mix.
    whyItMatters: Public geography and customer-count disclosures are too sparse to segment the base confidently beyond a few categories.
    diligencePath: Request an active-deployment list with geography, workflow, and stage fields.
    relatedQuestionRefs:
    - QU006
    - QU025
    relatedTableRefs:
    - TU001
    - TU003
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: Third-party satisfaction proof such as named case studies, review-platform depth, SLA scorecards, or support-ticket trend data.
    whyItMatters: The public story is outcome-positive, but satisfaction remains mostly anecdotal and company-mediated.
    diligencePath: Request reference calls, SLA attainment dashboards, and support escalation logs.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, backlog concentration, and concentration by live site.
    whyItMatters: A small number of large accounts can materially change valuation resilience even if deployment proof looks strong.
    diligencePath: Request top-5 customer revenue shares, backlog mix, and single-site concentration exposure.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU006
