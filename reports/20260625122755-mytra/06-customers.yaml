chapter:
  number: 6
  title: Customers
  summary: Mytra has credible but still selective public customer proof. Albertsons is the only named production deployment, while 2026 materials add an unnamed Fortune 100 food company and an unnamed Fortune 500 industrial-supply distributor, plus evidence of two pilots, one newer production go-live, and early labor and density outcomes. The main unresolved questions are retention, contract shape, customer count, and concentration risk.
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: |-
    Mytra’s public customer file is narrow but coherent. The clearest observable wedge is enterprise grocery and pallet-heavy distribution, where official, trade, and customer-adjacent sources all converge on the same operational problem: moving, storing, sequencing, and retrieving pallets or cases inside large facilities. The homepage and launch coverage repeatedly describe pallet pick, case pick, dock buffer, and cross-dock workflows, which implies a buyer inside warehouse operations, supply-chain engineering, or distribution leadership rather than an IT-led or developer-led budget. Public sources also support a user profile that includes floor operators and adjacent material-handling teams, because the system is explicitly designed to hand off to forklifts, pallet jacks, humans, and other robots at the perimeter.

    That segmentation is still more qualitative than quantitative. The strongest visible vertical proof is Albertsons in grocery distribution, with later 2026 materials adding only one unnamed Fortune 100 food company and one unnamed Fortune 500 industrial-supply distributor. Deloitte and company-authored pages also broaden the frame to manufacturing and factory material flow, but public deployments remain discussed mostly in North American warehouse contexts. The chapter therefore treats geography, customer count, and multi-site rollout depth as evidence gaps rather than resolved facts. Mytra is clearly selling into large industrial operators, but the public record does not yet reveal how many buyers, sites, or countries sit behind that narrative.
