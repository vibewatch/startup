- id: durability-expansion-and-concentration-risk
  title: Durability, Expansion, and Concentration Risk
  body: |-
    Durability is the least disclosed part of Mytra’s customer story. Public sources suggest a land-and-expand logic: the same modular system can start with one workflow and extend into adjacent pallet, case, dock-buffer, or cross-dock jobs, and the Series C materials explicitly say new capital will be used to scale deployments against customer demand. Strategic investors such as Lineage and RyderVentures may also widen access to logistics-heavy accounts. But none of the reviewed sources publish pricing, contract duration, NRR, GRR, churn, cohort retention, or even a basic count of active sites. That means public evidence supports expansion possibility, not retention certainty.

    The adverse file is therefore mostly structural rather than event-driven. CEO Today’s RaaS analysis argues that Mytra’s service-led model makes customer renewals fragile because uptime, integration, and throughput failures sit on the vendor rather than the buyer. Allianz’s generic concentration framework adds a useful benchmark: once one customer becomes 20% or more of revenue, pricing leverage and valuation resilience can deteriorate quickly. Because Albertsons is the only named production customer and the other flagship accounts remain unnamed, concentration risk cannot be dismissed. At the same time, no fetched source surfaced a named failed deployment or explicit churn event, so the negative evidence is more about missing durability proof and model sensitivity than about confirmed customer loss. That combination should keep a diligence team focused on customer references, contract shape, and account concentration before underwriting stickiness.
