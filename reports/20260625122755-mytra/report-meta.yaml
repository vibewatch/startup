  topStrengths:
    - Distinct product positioning in full-pallet storage, buffering, and sequencing rather than generic AMR transport alone.
    - Blue-chip investor and operator validation, including Avenir Growth, Eclipse, Greenoaks, Lineage, RyderVentures, and Zach Kirkhorn on the board.
    - "Real commercialization signals: Albertsons deployment proof, larger 2025 pilots and production go-live, and a 100,000-square-foot Brisbane facility."
  topRisks:
    - Revenue, gross margin, pricing model, burn, and runway remain undisclosed, making unit-economics underwriting impossible from public data alone.
    - Customer concentration and retention are opaque because Albertsons is the only clearly named account and the other large customers remain unnamed.
    - If the third-party ~$2B valuation estimate is directionally current, entry price may already assume scaling success that public evidence does not yet fully prove.
  unresolvedGaps:
    - Exact Series C post-money valuation, cap-table terms, and liquidation preferences are not publicly disclosed.
    - No public revenue, gross margin, backlog, or cash-runway figures exist to underwrite capital adequacy.
    - Named-customer breadth, ACV concentration, renewal behavior, and deployment economics remain opaque beyond Albertsons and unnamed Fortune 100/500 references.
    - Formal safety certifications, cyber-assurance artifacts, and audited SLA performance are not publicly disclosed.
