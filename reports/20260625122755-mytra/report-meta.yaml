companyProfile:
  summary: >-
    Mytra is a Brisbane, California warehouse-automation company founded in May 2022 by Chris Walti and
    Ahmad Baitalmal. The company sells a software-defined full-pallet ASRS built from bots, storage
    cells, and orchestration software for pallet pick, case pick, dock buffer, and cross-dock
    workflows. Public evidence shows a live Albertsons deployment, additional unnamed Fortune 100 and
    Fortune 500 customers, a 100,000-square-foot Brisbane headquarters/factory, and a $120M Series C in
    January 2026 led by Avenir Growth. The public diligence file is strongest on product differentiation,
    investor quality, and operating momentum, and weakest on revenue, margin, pricing, concentration,
    and governance disclosure.
  founders:
    - name: Chris Walti
      role: Co-founder
      background: Former Tesla warehouse-logistics and Optimus leader.
      claimRefs: [CO001, CO008]
    - name: Ahmad Baitalmal
      role: Co-founder
      background: Former Tesla and Rivian factory-software leader.
      claimRefs: [CO001, CO009]
  headquarters: Brisbane, California, USA
  productSummary: >-
    Software-defined warehouse robotics for full-pallet storage, buffering, sequencing, and retrieval
    using bots, cells, and orchestration software.
  customerFocus: >-
    Large grocers, retailers, industrial distributors, manufacturers, and other pallet-heavy warehouse
    operators.
  businessModel: >-
    Public sources imply enterprise automation deployments spanning infrastructure, robots, software,
    and ongoing service/support economics, but exact pricing and revenue mix remain undisclosed.
  stage: Late-stage private (Series C)
  fundingStatus: >-
    $198M is disclosed across tracked rounds, while contemporaneous coverage rounds total funding to
    more than $200M; the latest round was a $120M Series C led by Avenir Growth on 2026-01-15, but the
    post-money valuation remains undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO006, CO020, CO024, CU009, CU031]
summary:
  headline: >-
    A differentiated full-pallet warehouse-automation platform with real customer proof and top-tier
    backers, but limited public financial disclosure, unresolved concentration questions, and a possibly
    stretched private valuation keep Mytra in research-more territory rather than clear underwriting
    range.
