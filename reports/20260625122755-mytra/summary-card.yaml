  headline: >-
    A differentiated full-pallet warehouse-automation platform with real customer proof and top-tier backers, but
    limited public financial disclosure, unresolved concentration questions, and a possibly stretched private valuation
    keep Mytra in research-more territory rather than clear underwriting range.
