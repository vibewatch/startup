    {
      "id": "bull-base-and-bear-valuation-range",
      "title": "Bull, Base, and Bear Valuation Range",
      "body": "The scenario range should therefore be read as disciplined triangulation, not management guidance. In the bull case, Mytra proves that its 2025 momentum carries into repeatable, multi-site deployments; that service and support economics are attractive enough to scale; and that customers convert from unnamed logos into referenceable, durable accounts. In that world, a valuation band around roughly $1.8-2.6 billion is arguable because investors could justify paying closer to the premium public-comp set. That is also the only path where a third-party $2 billion mark starts to look comfortably earned rather than merely defensible.\n\nThe base case is less generous. It assumes the product remains attractive and the company keeps winning deployments, but public disclosure remains sparse and investors continue to price a material opacity discount relative to Symbotic or AutoStore. On that view, a band around roughly $1.1-1.7 billion is more supportable. The bear case assumes that deployment complexity, service-margin pressure, or a tougher financing market drags valuation toward the lower public automation reference points, producing something like $0.6-1.0 billion. None of these estimates should be mistaken for exact worth. They are scenario bands that convert the current public evidence set into investment discipline: upside exists, but it is thinner than the company-quality story alone might suggest.",
