    {
      "id": "entry-discipline-thesis-breaks-and-diligence-asks",
      "title": "Entry Discipline, Thesis-Breaks, and Diligence Asks",
      "body": "The practical IC conclusion is straightforward. Mytra is not a public-evidence avoid because the product narrative, financing support, and deployment claims are stronger than those of a typical robotics startup. But it is also not a public-evidence buy because the variables that actually determine equity returns remain private: exact post-money valuation, liquidation preferences, debt or structured-financing layers, service gross margin, customer concentration, deployment payback, and repeatability of the 2025 installation step-up. Investors should therefore underwrite the next round as disclosure-gated. If the company wants premium pricing, it should show premium evidence.\n\nThat translates into clear diligence asks and kill triggers. A down round, a flat round with heavier preferences, audited revenue that is lower or lower-quality than investors expect, or evidence that deployment economics are service-heavy and margin-light would all break the current upside case. Conversely, audited financials, referenceable customer cohorts, and a priced round above the current third-party estimate could move the call upward. Until then, the right discipline is to separate admiration for the company from conviction on the entry price. Public evidence today supports continuing the work, not rushing the check.",
