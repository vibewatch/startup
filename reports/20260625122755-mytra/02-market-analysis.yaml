figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Nested market layers from the broadest warehouse-automation envelope to the narrower brownfield pallet-automation wedge that best matches Mytra's disclosed use cases.
  data:
    nodes:
    - label: Broad warehouse automation lens
      detail: Current public 2026 estimates cluster around $34.17B-$36.24B globally across broad automation definitions that mix hardware, software, robots, and controls.
      tone: neutral
    - label: ASRS lens
      detail: ASRS-specific 2026 estimates narrow the range to about $8.56B-$11.39B, which is closer to Mytra because it centers on storage and retrieval systems rather than all warehouse technology.
      tone: positive
    - label: Brownfield modernization layer
      detail: L.E.K. says 65%-70% of annual spend now targets retrofit and brownfield upgrades across >20B sq ft of installed warehouse space, which matches the current buyer motion better than greenfield-only TAMs.
      tone: positive
    - label: Mytra practical wedge
      detail: The real near-term wedge is pallet-dense grocery, retail, and industrial distribution nodes where reserve storage, buffering, cross-dock, and outbound sequencing justify full-pallet automation.
      tone: neutral
  approximationNotes: This is a lens stack rather than a strict TAM-SAM-SOM waterfall. The first two layers are public market estimates; the third is a spend-share proxy; the fourth is a qualitative operational wedge with no clean standalone public revenue number.
