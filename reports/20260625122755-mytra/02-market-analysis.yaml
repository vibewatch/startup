tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Mytra
  rows:
  - - Full-pallet ASRS and pallet orchestration
    - Pallet storage, retrieval, buffering, sequencing, and control software for full-load movement
    - Parcel-only robotics, pure WMS subscriptions, non-warehouse transport spend
    - Large grocers, big-box retailers, industrial distributors
    - Core wedge because Mytra is disclosed as a pallet-handling ASRS with cross-dock and buffering relevance
  - - Brownfield DC retrofit automation
    - Retrofit hardware, controls, WCS/WMS integration, safety upgrades, site re-layout inside existing DCs
    - Ground-up building shell, general real-estate development, unrelated ERP projects
    - Operators with existing networks and centralized capex
    - Core wedge because most current spend is moving into installed facilities rather than only greenfield megaprojects
  - - Grocery and food distribution center automation
    - Store-replenishment pallets, cold-chain buffering, order sequencing, dock staging, weather-resilient regional nodes
    - Store checkout tech, last-mile delivery fleets, in-store picking apps
    - Grocers, wholesalers, cooperatives
    - High-fit vertical because public customer analogs repeatedly emphasize full pallets, accuracy, and service reliability
  - - Industrial and general-merchandise regional DC automation
    - Bulk replenishment, pallet reserve storage, outbound trailer loading, cross-dock queues
    - Factory-line automation, transportation telematics, parcel sortation only
    - Industrial distributors, retail regional DCs
    - High-fit adjacent vertical because Mytra also cites an unnamed Fortune 500 industrial-supply customer
  - - Each-pick parcel automation and micro-fulfillment adjacency
    - AMRs, tote systems, goods-to-person picking, urban micro-fulfillment
    - Full-pallet reserve and store-load orchestration
    - Parcel e-commerce operators, omnichannel retailers
    - Important adjacency but not the cleanest fit because workflow economics favor each-pick speed more than pallet density
  - - Manual forklifts and selective mechanization as substitutes
    - Forklifts, pallet jacks, racking, labor scheduling, narrow point solutions
    - Integrated software-defined pallet infrastructure
    - Existing warehouse operators preserving current process
    - Main status-quo alternative because many facilities still choose labor plus simple equipment over system-level automation
  notes: The table narrows Mytra from broad warehouse automation into pallet-heavy brownfield DC workflows and preserves adjacent categories as complements or substitutes rather than part of a false single TAM.
  enumerationScope:
    coverage: partial
    basis: Rows capture the market categories most relevant to Mytra's public product shape and buyer evidence; they are not an exhaustive warehouse-automation taxonomy.
