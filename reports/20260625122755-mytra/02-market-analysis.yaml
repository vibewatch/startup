- id: drivers-constraints-contradictions
  title: Growth Drivers, Constraints, and Contradictory Evidence
  body: 'The demand case is real, but it is not uniform. BLS shows U.S. warehousing employment at 1.842 million workers in May 2026 with average hourly earnings of $26.76, while McKinsey and Deloitte both argue that automation is increasingly a response to labor scarcity and service-level pressure rather than just wage arbitrage. Modern Materials Handling''s 2026 study shows how much headroom still exists: only 12% of respondents report full automation in picking and 11% in storage, even though many already use conveyors, goods-to-person systems, AGVs, or ASRS. The recurring growth drivers are consistent across sources—labor pressure, throughput, density, order accuracy, and brownfield resilience—but constraints are equally visible. McKinsey highlights ROI and lease-duration mismatch, MHI/Deloitte cites unclear use cases and difficulty building business cases, and Mordor ASRS adds legacy-WMS integration, technician scarcity, and cyber risk. Grocery distribution centers also provide contradictory
    evidence that matters for Mytra. Mytra says early deployments reduced material-handling labor by 32% and improved storage density by 34%, yet Kroger is reviewing and closing some automated Ocado facilities because a fixed architecture did not produce acceptable e-commerce profitability. The market is attractive, but adoption timing is architecture-specific and economics-specific, not automatic.'
