callouts:
- calloutType: insight
  title: Mytra's real wedge is pallet-dense brownfield modernization, not generic AMR spend
  body: The most defensible market framing is not "warehouse robotics" in the abstract. It is pallet-heavy, retrofit-friendly automation for grocery, retail, and industrial distribution centers where buyers care about reserve storage, buffering, sequencing, and labor intensity.
  claimRefs:
  - CM001
  - CM004
  - CM014
  - CM015
  - CM016
  - CM020
  - CM039
- calloutType: risk
  title: Grocery proves demand is real, but wrong architecture can still miss ROI
  body: Kroger's Ocado pullback matters because it demonstrates that automation budgets are not enough on their own. Capital intensity, node density, and workflow fit can turn a valid category tailwind into a bad deployment outcome.
  claimRefs:
  - CM033
  - CM035
  - CM040
  - CM041
  - CM042
- calloutType: assumption
  title: Use lens-based sizing in valuation until Mytra-specific deployment economics are available
  body: Public sources support broad and narrow market ranges, but they do not support a clean public SOM for Mytra. The safer approach is to carry broad warehouse automation, ASRS, and brownfield-spend lenses separately and request site-level economics before converting them into revenue assumptions.
  claimRefs:
