chapter:
  number: 2
  title: Market Analysis
  summary: Mytra's real market is not all warehouse automation but the narrower full-pallet ASRS and brownfield material-flow layer inside grocery, retail, and industrial distribution centers. Public 2026 market estimates still span wide ranges—from roughly $34.2B-$36.2B for broad warehouse automation and $8.6B-$11.4B for ASRS—because publishers mix hardware, software, robots, and workflow scope differently. The adoption case is strong where labor, density, and store-ready pallet sequencing matter, but grocery evidence also shows that architecture fit and site economics can destroy ROI when automation is too rigid or demand density is wrong.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: 'Mytra should be placed in a narrow slice of warehouse automation rather than in every robotics or logistics-software category. Research and Markets frames warehouse automation broadly enough to include conveyor and sortation systems, ASRS, mobile robots, WMS, and AIDC, but Mytra''s disclosed product shape sits much closer to full-pallet ASRS plus orchestration than to generic warehouse software or parcel robotics. BLS''s definition of warehousing and storage also matters because it shows the operating environment Mytra is trying to automate: facilities that store goods and run logistics services such as inventory control, packaging, pick-pack, and transportation arrangement. Public comparable deployments reinforce the boundary. Albertsons, Walmart, and other grocers are buying pallet and store-replenishment automation for dense regional distribution centers, while McKinsey separates those use cases from each-pick e-commerce mezzanines and micro-fulfillment systems. Included spend
    therefore covers pallet storage, retrieval, buffering, sequencing, and brownfield retrofit controls; excluded spend includes parcel-only picking, generic WMS-only budgets, and manual forklift fleets that remain the status-quo substitute.'
