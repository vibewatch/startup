  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Self-operated national grocer DC
    - SVP supply chain / DC design team
    - DC ops, maintenance, store-replenishment planners
    - Corporate capex / productivity program
    - Store-ready pallet replenishment, reserve storage, dock sequencing
    - Supply chain leadership with CFO oversight
    - Need to lower cost-to-serve and improve in-stock service across a multi-node grocery network
  - - Grocery wholesaler DC
    - Operations and transformation leadership
    - Warehouse associates, robotics operators, replenishment staff
    - Wholesale network capex
    - High-SKU grocery fulfillment with goods-to-person and pallet movement
    - COO / supply chain transformation office
    - Order accuracy, operating-cost pressure, and working-condition improvement
  - - Grocery cooperative or weather-exposed regional node
    - Regional support-center leadership
    - Warehouse ops and member-service teams
    - Board-approved facility modernization budget plus incentives
    - Selection and movement of grocery products with resilience requirements
    - Operations leadership plus finance and state incentive stakeholders
    - Need to improve reliability while hardening an existing brownfield facility
  - - Big-box regional distribution center
    - Innovation / automation leadership
    - Regional DC operators and maintenance technicians
    - Corporate logistics capex
    - Palletized loads for store distribution at very high throughput
    - Central supply-chain automation budget
    - Network-scale speed, accuracy, and labor simplification
  - - Industrial-supply or general-merchandise DC
    - Distribution strategy and engineering leaders
    - Forklift-adjacent operators, cross-dock planners, dock teams
    - Operations-improvement capital budget
    - Bulk replenishment, cross-dock buffering, trailer sequencing
    - Distribution strategy plus finance
    - Need to compress handling labor and use cubic space more effectively
  - - Each-pick parcel or micro-fulfillment operator
    - E-commerce operations
    - Pickers, tote-system operators, parcel-sort teams
    - Digital commerce or omnichannel budget
    - Each-pick fulfillment, tote retrieval, urban MFC throughput
    - E-commerce P&L owner
    - Demand for fast consumer order picking rather than pallet reserve automation
  notes: The rows are public analog segments, not Mytra's customer list. They separate buyer, user, payer, and workflow because warehouse automation decisions are usually cross-functional.
