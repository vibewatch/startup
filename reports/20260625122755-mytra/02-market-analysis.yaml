  - - Low-end ASRS lens
    - NextMSC / 2026
    - Global
    - '2026: $8.56B; 2035: $22.74B; CAGR 11.46%'
    - Warehouse ASRS framing based on operator and integrator research with units and value
    - Medium
    - Longer forecast horizon and scope choices differ from Mordor and Polaris
