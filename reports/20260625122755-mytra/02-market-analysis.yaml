    - L.E.K. / 2026
    - U.S. installed base lens
    - 65%-70% of annual spend; >20B sq ft installed base
    - Treats current demand as retrofit and brownfield modernization rather than only greenfield construction
    - Medium
    - Share-of-spend proxy, not a standalone revenue TAM
  notes: The table intentionally keeps contradictory estimates intact. Broad warehouse-automation totals, ASRS-only estimates, and brownfield-share proxies answer different questions and should not be collapsed into one number.
