  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: mytra-unit-economics
    missingEvidence: Site-level capex, throughput, payback, and service metrics for named Mytra deployments.
    whyItMatters: Without deployment economics, broad market size cannot be translated into a believable revenue-capture or margin model.
    diligencePath: Request pilot and production scorecards from Mytra and named customers such as Albertsons under NDA.
    relatedQuestionRefs:
    - QM024
    - QM027
  - type: missing-source
    severity: material
    topic: vertical-mix
    missingEvidence: Named customer or revenue mix between grocery, food, and industrial distribution accounts.
    whyItMatters: The right valuation multiple depends on whether Mytra is concentrated in one vertical or already diversified across pallet-heavy segments.
    diligencePath: Request a customer pipeline and booked-deployment mix by vertical, node type, and workflow.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: minor
    topic: tam-scope
    missingEvidence: A single apples-to-apples market map that isolates pallet ASRS and brownfield pallet orchestration from broader automation categories.
    whyItMatters: Analyst ranges are directionally useful but still too broad to serve as a direct TAM, SAM, or SOM stack for underwriting.
    diligencePath: Ask management or an industry expert to reconcile broad warehouse automation, ASRS, and pallet-only categories in one segmentation note.
    relatedQuestionRefs:
    - QM006
    - QM007
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: brownfield-win-rate
    missingEvidence: Direct evidence on Mytra win rates and deployment success by brownfield versus greenfield site.
    whyItMatters: Brownfield spending is a large proxy market, but not every retrofit project is technically or economically compatible with Mytra's architecture.
    diligencePath: Request internal pipeline segmentation, lost-deal analysis, and civil-work requirements by site class.
    relatedQuestionRefs:
    - QM008
    - QM024
    - QM027
