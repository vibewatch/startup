- id: buyers-and-adoption
  title: Buyer Segments, Payers, and Adoption Path
  body: 'Public demand signals point to a short list of high-value buyer segments rather than a broad SMB long tail. Albertsons expects 30% of distribution volume to be automated and had already automated three of twenty-two dedicated distribution centers, which is classic store-replenishment demand. UNFI and AWG show a second buyer group: grocery wholesalers and cooperatives modernizing million-square-foot facilities to improve order accuracy, resilience, and labor conditions. Walmart''s Symbotic rollout demonstrates the outer edge of the comparable set, where palletized store-ready loads and high-density robotics become network-level strategic infrastructure. Giant Eagle adds a software budgeting clue because its WMS migration is being rolled across the same network that needs warehouse modernization, showing that warehouse control and physical automation spend are often linked. In these workflows, buyer, payer, and user split across functions. Supply chain leadership, finance, and procurement
    authorize capital; DC operations, maintenance, and WMS teams specify and run the system; stores and transport networks capture downstream service gains. That structure favors vendors like Mytra when the site has centralized capex, full-pallet intensity, and a strong need for cross-dock, buffer, and outbound sequencing workflows.'
