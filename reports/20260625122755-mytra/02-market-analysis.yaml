    - Medium
    - Too broad to use as Mytra's practical SAM
  - - Alternative broad warehouse automation lens
    - Fortune Business Insights / 2026
    - Global
    - '2026: $36.24B; 2034: $119.86B; CAGR 16.13%'
    - Broad automation framing that includes robotics, material handling equipment, control software, and analytics
    - Medium
    - Higher long-range forecast and broader scope than Mytra-specific pallet automation
  - - Historical-to-forward broad lens
    - Grand View Research / 2024
    - Global
    - '2024: $21.30B; 2030: $59.52B; CAGR 18.7%'
    - Broad warehouse automation by component, automation level, application, and region
    - Medium
    - Does not publish a 2026 point in the public summary
  - - Narrow ASRS lens
    - Mordor Intelligence / 2026
    - Global
    - '2026: $11.39B; 2031: $16.99B; CAGR 8.34%'
    - Isolates ASRS and identifies unit-load as 41.92% of 2025 load-type share
    - Medium
    - Still includes mini-load and non-pallet systems that extend beyond Mytra's wedge
  - - Alternative ASRS lens
    - Polaris Market Research / 2026
    - Global
    - '2026: $10.51B; 2034: $20.52B; CAGR 8.7%'
    - ASRS-specific forecast with drivers around labor, density, and Industry 4.0 integration
    - Medium
