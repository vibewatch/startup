- id: scenario-ranges-and-recommendation
  title: Bull, base, and bear ranges
  body: The cleanest way to handle PatSnap’s valuation is through scenarios rather than a single point estimate. In a bull case, PatSnap shows accelerated ARR since 2024, proves strong retention and margins, demonstrates real AI-led workflow differentiation, and benefits from a receptive HKEX/SGX window. In that case, a valuation range above $2 billion can be defended, though even then investors should watch for float structure. In a base case, the company is solid but not yet fully de-risked; public investors apply a material opacity discount and value the business more conservatively than private backers hope. In a bear case, IPO timing slips, disclosure disappoints, concentration or cost dependencies look worse than expected, and the multiple compresses toward what public markets have recently been willing to pay for challenged information-services assets. The resulting valuation dispersion is wide because the disclosure delta is wide.
  claimRefs:
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
