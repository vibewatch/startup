company:
  name: PatSnap
chapter:
  number: 8
  title: Valuation
  summary: PatSnap has enough scale, breadth, and IPO momentum to merit serious attention, but the reported $2 billion-plus target valuation already asks investors to underwrite a premium story ahead of premium disclosure. The most important public anchor is the company’s own $100 million ARR disclosure from 2024. Against that base, a $2 billion-plus valuation implies a high-teens to 20x-plus ARR multiple before investors have visibility into retention, gross margin, cash flow, or the primary-versus-secondary split of the proposed float. The right stance is therefore constructive on quality, cautious on price, and conditional on much deeper diligence.
sections:
- id: thesis-vs-anti-thesis
  title: Investment thesis versus anti-thesis
  body: The bullish thesis on PatSnap is straightforward. It sits in a real and expanding innovation-intelligence market, has public proof of scaled recurring revenue, spans multiple workflows across IP and R&D, and is trying to present itself as a domain-specific AI winner rather than a commoditized data vendor. The anti-thesis is equally clear. Public disclosure remains materially below public-market standards, competitors are not standing still, and the reported IPO target already appears ambitious relative to the company’s last hard revenue datapoint and to the mixed public-market performance of relevant information-services peers. Investors therefore should not decide between 'great company' and 'bad company.' They should decide between 'good company at the right discount' and 'good company priced as though disclosure, retention, and margin quality are already proven.' That distinction is the core valuation issue.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV001
