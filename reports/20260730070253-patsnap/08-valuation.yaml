- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR meaningfully above 2024 level; strong NRR/GM disclosed; AI workflow differentiation validated; healthy IPO demand
    - ~$2.3B-$2.8B valuation can be defended
    - Execution still required; secondary supply can cap upside
    - Would require prospectus-quality metrics and clear anchor demand
  - - Base
    - Good business, but opacity discount persists; growth respectable, not exceptional; public buyers cautious
    - ~$1.4B-$2.0B valuation range looks more defensible
    - Disclosure gaps, concentration, and comp de-rating remain
    - Most plausible without major positive surprises
  - - Bear
    - IPO slips or underwhelms; retention/margin/governance disappoint; multiple compresses toward challenged comp set
    - ~$0.8B-$1.3B valuation range
    - Disclosure and execution risk stack together
    - Would be signaled by delays, weak book, or poor diligence read-through
  notes: These ranges are analytical scenarios, not market quotes.
