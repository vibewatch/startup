  evidenceGaps:
  - type: missing-metric
    severity: material
    topic: Current ARR, retention, and margin bridge
    missingEvidence: Public sources do not yet provide a prospectus-grade bridge from the 2024 ARR disclosure to current ARR, NRR, GRR, and gross margin.
    whyItMatters: Valuation depends much more on current growth quality than on the existence of one historical ARR milestone.
    diligencePath: Request audited 2025/2026 ARR bridge, NRR/GRR, gross margin, and segment growth.
    relatedQuestionRefs:
    - QV002
    - QV015
    - QV024
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: Primary versus secondary IPO structure
    missingEvidence: No public source confirms how much of the proposed float would be new capital versus existing-holder sell-down.
    whyItMatters: A secondary-heavy float changes the interpretation of the deal from growth financing toward liquidity.
    diligencePath: Review draft prospectus, banker book, and shareholder sell-down plan.
    relatedQuestionRefs:
    - QV016
    - QV024
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: important
    topic: Enumeration coverage for comparable set
    missingEvidence: Many private or subscale IP analytics vendors do not publish enough clean valuation or financial data to include as robust comparables.
    whyItMatters: The public comp set is necessarily partial, which can overemphasize a few large or challenged names.
    diligencePath: Build a banker-style private comparable set with transaction, round, and revenue-multiple data under NDA.
    relatedQuestionRefs:
    - QV010
    - QV013
    relatedTableRefs:
    - TV004
