  - FV004
- id: final-recommendation-and-diligence-asks
  title: Final recommendation and thesis-break triggers
  body: The correct investment posture is conditional. PatSnap deserves serious diligence and likely merits a premium to small, unproven AI software stories because it already disclosed meaningful ARR, has broad product and customer proof, and appears to have real enterprise relevance. But a premium does not mean accepting the full rumored IPO mark. Unless management can show strong retention, healthy margins, clean governance, and a sensible primary-capital use case, public investors should demand a meaningful discount to the most optimistic private narrative. The recommendation is therefore to engage, but only with disciplined entry criteria and clear kill triggers. If IPO documents or management disclosure confirm durable software quality and a balanced float structure, the opportunity becomes stronger quickly. If the listing remains a story trade without those disclosures, the risk-adjusted stance should shift toward watchlist rather than aggressive participation.
