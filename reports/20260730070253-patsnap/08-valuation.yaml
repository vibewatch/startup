- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak retention metrics
    - NRR/GRR materially below high-quality SaaS expectations
    - Undermines premium-multiple case
    - Demand deeper discount or step back
  - - High secondary supply
    - Float is heavily existing-holder sell-down
    - Turns growth story into liquidity event
    - Reduce participation appetite
  - - Governance or security diligence miss
    - Major enterprise-grade control gaps surface
    - Damages trust and IPO-readiness case
    - Pause or downgrade investment view
  - - Growth re-acceleration absent
    - ARR growth stalls relative to 2024 base
    - Removes premium-AI-growth narrative
    - Value business closer to challenged comp set
  - - Weak IPO demand or delay
    - Bookbuilding weak or listing pushed without clarity
    - Signals narrative/price mismatch
    - Shift to watchlist stance
  notes: These triggers matter more than micro-variations in point estimates.
