- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Retention
    - NRR, GRR, churn, renewal cohorts
    - Determines whether premium recurring-software multiple is deserved
    - Finance / GTM diligence
  - - Margin quality
    - Gross margin, services mix, support burden, inference cost
    - Determines software quality and operating leverage
    - Finance / product diligence
  - - Customer concentration
    - Top-10 accounts, region mix, renewal cliffs
    - Determines downside risk and bargaining power
    - Finance / sales-ops diligence
  - - Governance and security
    - SOC/ISO artifacts, incident history, model-governance controls
    - Determines enterprise trust and IPO readiness
    - Security / legal diligence
  - - IPO structure
    - Primary vs secondary split, anchor demand, use of proceeds
    - Determines whether float is growth capital or liquidity event
    - Banker / IR diligence
  - - Current scale
    - Updated 2025/2026 ARR and growth bridge
    - Needed to replace stale 2024 anchor
    - Management / prospectus diligence
  notes: The highest-impact open items are all knowable if management opens the data room.
