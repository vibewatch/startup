- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Scaled, multi-workflow innovation-intelligence platform with real ARR and customer proof
    - Evidence that ARR has stalled, AI differentiation is weak, or customers view PatSnap as non-core
  - - Domain-specific AI and benchmarks may justify a premium narrative
    - Independent validation that task quality does not materially exceed alternatives would weaken the thesis
  - - Broad product and customer surface supports expansion potential
    - Weak retention or poor gross margin would undermine the expansion case
  - - Private backers and IPO momentum create optionality
    - A float dominated by secondary selling or weak demand would weaken confidence
  notes: The anti-thesis is about proof and price, not about denying the existence of a real business.
