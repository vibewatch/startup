  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Security and compliance disclosure
    missingEvidence: Reviewed public sources do not clearly disclose certifications, audit results, incident history, or detailed admin controls.
    whyItMatters: Enterprise-wide adoption of AI research tooling depends heavily on security and governance comfort, not only workflow value.
    diligencePath: Request SOC/ISO documentation, security architecture, incident history, and admin-control walkthroughs.
    relatedQuestionRefs:
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-metric
    severity: important
    topic: Independent workflow-quality validation
    missingEvidence: PatentBench is useful but still vendor-controlled; there is no broad third-party benchmark pack comparing PatSnap to all major competitors on live enterprise tasks.
    whyItMatters: Quality leadership claims are stronger when validated outside the vendor’s own evaluation environment.
    diligencePath: Run blinded customer task bake-offs and request external benchmark replications.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: important
    topic: Module-level adoption and reliability metrics
    missingEvidence: No public source discloses usage intensity, uptime, latency, error rates, or renewal by module.
    whyItMatters: A broad suite can hide weak adoption or reliability in individual surfaces.
    diligencePath: Request module-level MAU/WAU, uptime, support-ticket, and renewal data.
    relatedQuestionRefs:
    - QE015
    - QE017
    - QE024
    relatedTableRefs:
    - TE001
