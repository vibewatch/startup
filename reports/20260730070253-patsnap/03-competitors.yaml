  - - Clarivate Derwent
    - Incumbent patent intelligence
    - 70M+ human-authored invention summaries; 270+ search professionals; 40 patent-office data-feed users
    - IP, legal, portfolio, chemistry, sequence search
    - Strong curation, services, and data distribution
    - Can feel incumbent-heavy and service-led
  - - LexisNexis PatentSight + Cipher
    - Incumbent analytics and classification
    - Backed by RELX distribution; PatentSight plus acquired Cipher classifiers
    - IP strategy, portfolio valuation, legal and analytics teams
    - Trusted valuation metrics and custom taxonomy capability
    - Less obviously R&D-workflow broad than PatSnap
  - - Questel Orbit Intelligence
    - Incumbent platform
    - 100,000+ users; 100M+ patents; 150M+ NPL records
    - IP, legal, strategy, innovation teams
    - Large data estate and multi-system AI assistant
    - Breadth can overlap with PatSnap but category focus is still IP-first
  - - Anaqua
    - Adjacent IP management platform
    - Nearly half of top 100 US patent filers; 2M+ users across products
    - IP operations, law firms, legal departments
    - System-of-record position plus rising AI automation
    - Discovery and landscape workflows are not its historic center
  - - TechInsights
    - Specialist substitute
    - 200+ global leaders trust the platform
    - Semiconductor, electronics, IP litigation and licensing teams
    - Evidence-of-use, teardown, cost, and prior-art depth
    - Narrower industry focus than PatSnap
  - - Relecura
    - AI-native niche competitor
    - Enterprise-logo social proof visible but limited public detail
    - Patent search and intelligence users
    - AI-led positioning and search relevance
    - Public scale and product detail are thin
  notes: This table emphasizes public evidence visible to outside investors. Scale fields mix user, data, and services proxies because private vendors disclose very different headline metrics.
