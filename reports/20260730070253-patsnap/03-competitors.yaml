callouts:
- calloutType: insight
  title: Competition is fragmenting by workflow, not converging on one winner
  body: The category remains fragmented across search, portfolio analytics, IP management, reverse engineering, and AI-assisted research. That fragmentation helps PatSnap land wedge use cases, but it also normalizes multi-homing and limits winner-take-all dynamics.
  claimRefs:
  - CP002
  - CP004
  - CP033
  - CP034
- calloutType: strength
  title: PatSnap has a credible AI-specific differentiation story
  body: PatentBench, Hiro, Discovery, and Synapse give PatSnap a more concrete AI and cross-workflow narrative than a generic "AI inside" claim.
  claimRefs:
  - CP025
  - CP027
  - CP031
  - CP032
