- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - AI-first user experience
    - Incumbents are adding AI copilots and classifiers
    - High
    - Interface advantage can compress quickly
    - Track customer win reasons and task-level benchmark results
  - - Broad multi-domain data estate
    - Large incumbents already own major patent and legal datasets
    - High
    - Raw breadth alone may not sustain pricing power
    - Test whether PatSnap data combinations drive better decisions in practice
  - - Cross-functional R&D + IP workflow
    - System-of-record vendors can extend upward while specialist tools extend sideways
    - Medium-High
    - Buyers may unbundle research, legal, and operations use cases
    - Measure expansion rates across departments inside existing accounts
  - - Open benchmark leadership
    - Benchmarks can differentiate credibility if they stay current
    - Medium
    - Public evaluation claims can decay if peers publish comparable tests
    - Refresh PatentBench coverage and third-party validation
  - - Customer usability advantage
    - Multi-homing and procurement lock-in can offset usability gains
    - Medium
    - A better UI does not guarantee replacement of incumbent contracts
    - Probe renewal drivers and system-of-record dependence
  notes: Competitive durability should be underwritten as a moving target rather than a static moat.
