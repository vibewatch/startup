- id: switching-costs-durability-and-bottom-line
  title: Switching costs, multi-homing, and bottom-line competitive view
  body: The market structure suggests moderate switching costs but widespread multi-homing. Patent and R&D teams often keep more than one tool because no single platform dominates every workflow equally well. A law firm or central IP team may rely on incumbent search or management platforms for high-trust legal tasks while using PatSnap for landscape, valuation, or cross-functional research. Conversely, a strategy or R&D-led buyer may start with PatSnap and still supplement with specialist data in chemicals, semiconductors, or legal prosecution. That creates both opportunity and risk. Multi-homing lowers the hurdle to land an account because PatSnap does not need to replace every incumbent on day one. But it also means PatSnap's revenue can remain vulnerable to budget scrutiny if customers frame it as an overlay rather than a system of record. The competitive bottom line is that PatSnap looks differentiated enough to win, especially where cross-functional AI workflows matter, but not insulated
    enough to assume durable premium pricing without continuous product proof and enterprise adoption evidence.
