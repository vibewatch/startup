  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Win/loss rates versus named competitors
    missingEvidence: No public dataset shows PatSnap's actual win rates, replacement rates, or renewal outcomes against Clarivate, Questel, LexisNexis, or Anaqua by segment.
    whyItMatters: Competitive narratives are much stronger with observed buying behavior than with product marketing alone.
    diligencePath: Ask management for named win/loss analyses, cohort expansion by competitive backdrop, and reference calls from recent enterprise bake-offs.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-metric
    severity: material
    topic: Realized pricing versus peers
    missingEvidence: Public sources do not disclose meaningful realized ACV, module pricing, or discount structures for PatSnap or most peers.
    whyItMatters: Without pricing evidence, it is difficult to judge whether product breadth converts into durable gross profit or simply supports discounting.
    diligencePath: Request recent order forms, ACV bands by module, and competitive discount data from sales operations.
    relatedQuestionRefs:
    - QP017
    - QP018
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: important
    topic: Relecura scale and product detail
    missingEvidence: Publicly accessible detail on Relecura's revenue, users, product modules, and recent roadmap is limited.
    whyItMatters: A weakly disclosed AI-native competitor can still matter tactically in enterprise evaluations.
    diligencePath: Search for customer references, procurement records, or management interviews that quantify Relecura's scale and differentiation.
    relatedQuestionRefs:
    - QP009
