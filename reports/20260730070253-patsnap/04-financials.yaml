company:
  name: PatSnap
chapter:
  number: 4
  title: Financials
  summary: PatSnap's public financial record is thin but directionally strong. The strongest hard datapoint is the company's June 2024 disclosure that annual recurring revenue reached $100 million in Q2 2024 after 20% revenue growth in 2023, while KR-Asia later reported profitability and heavy revenue concentration in the US and China. Public evidence supports an enterprise-software subscription model and ample historic equity funding, but leaves major underwriting gaps around gross margin, CAC, net retention, cash balance, burn, deferred revenue, and the split between primary and secondary proceeds in the reported 2026 IPO process.
sections:
- id: revenue-model-and-monetization-surface
  title: Revenue model and monetization surface
  body: 'PatSnap''s revenue model appears to be classic enterprise SaaS layered across multiple workflow modules. Official product pages show the company sells distinct but connected surfaces including Discovery, Synapse, Insights, and Eureka workflows, while earlier reporting described contracts that can range from modest initial deployments to large enterprise account expansions. The most reasonable financial interpretation is subscription software sold by seat, workflow, or enterprise package, potentially with training, support, and data-enablement services around larger deployments. What is not public is just as important: no reliable revenue-mix disclosure breaks out how much ARR comes from core IP workflows versus newer life-sciences or R&D intelligence products, how much comes from services, or whether usage-based AI features are creating a new billing layer. Investors should therefore treat the monetization model as enterprise subscription first, but reserve judgment on mix quality
    until management discloses module attach rates, contract lengths, and realized pricing by segment.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: traction-growth-and-mix-signals
  title: Traction, growth, and public mix signals
  body: 'The public traction signals that do exist are encouraging. PatSnap said in June 2024 that annual revenue grew 20% in 2023 and ARR hit $100 million in Q2 2024. KR-Asia''s 2025 interview with Guan Dian then added two important color points: the company had reached $100 million ARR and turned profitable earlier that year, and roughly 70% of revenue came from US and Chinese customers. Official messaging also said life-sciences products were growing at more than 50% annual compound rates over three years, implying the mix may be shifting toward higher-value vertical workflows rather than staying a pure patent-search business. That said, these data points are still management-guided snapshots rather than audited financial statements. There is no public disclosure of quarterly revenue history, deferred revenue, net dollar retention, gross churn, average contract value, or cohort behavior. The financial story is therefore credible but incomplete: PatSnap looks past early-stage experimentation
    and into scaled SaaS territory, yet still lacks the evidence density public-market investors typically require.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
  - TI003
