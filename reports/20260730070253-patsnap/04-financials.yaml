  evidenceGaps:
  - type: missing-metric
    severity: material
    topic: Gross margin and retention metrics
    missingEvidence: No public source discloses gross margin, net retention, gross retention, churn, or cohort behavior.
    whyItMatters: Recurring-software valuation depends more on margin and retention quality than on headline ARR alone.
    diligencePath: Obtain audited SaaS KPI pack with margin, NRR, GRR, churn, and cohort tables.
    relatedQuestionRefs:
    - QI010
    - QI015
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-metric
    severity: material
    topic: Cash, burn, runway, and debt
    missingEvidence: Public sources do not disclose unrestricted cash, monthly burn, debt facilities, or runway scenarios.
    whyItMatters: Without liquidity detail, the financing motivation behind the reported IPO cannot be underwritten.
    diligencePath: Request latest management accounts, cash-flow statement, debt schedule, and runway forecast.
    relatedQuestionRefs:
    - QI021
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: important
    topic: Primary versus secondary IPO proceeds
    missingEvidence: No public filing or prospectus confirms how much of the reported 2026 float would be new capital versus shareholder sell-down.
    whyItMatters: The split affects dilution, after-market supply, and whether the listing is growth-funded or liquidity-driven.
    diligencePath: Review draft prospectus, banker materials, or cap-table sell-down plan once available.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
    - TI005
