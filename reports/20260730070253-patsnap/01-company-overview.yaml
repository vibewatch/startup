company:
  name: PatSnap
chapter:
  number: 1
  title: Company Overview
  summary: PatSnap is a Singapore-founded innovation-intelligence software company established in 2007 by Jeffrey Tiong. Public evidence shows it scaled from a patent-search specialist into a broader AI-driven R&D and IP workflow platform, raised $300 million in a March 2021 Series E that made it a unicorn, reached at least $100 million of ARR by mid-2024 according to the company, and as of June 2026 was reported to be confidentially pursuing a dual IPO in Hong Kong and Singapore at a $2 billion-plus target valuation.
sections:
- id: identity-and-business-model
  title: Identity, headquarters, and business model
  body: PatSnap is an AI-native innovation-intelligence software company founded in Singapore in 2007. Official company materials now describe the business as serving IP and R&D teams with domain-specific AI agents and analytics tools that support patent search, novelty and freedom-to-operate work, competitive intelligence, drug discovery, materials research, and adjacent technical workflows. The company has clearly broadened from its original patent-search use case into a larger 'connected innovation intelligence' stack that mixes proprietary data, workflow software, and AI assistance. Official pages place the headquarters in Singapore and list additional offices in London, Toronto, Tokyo, and Shanghai, underscoring a globally distributed commercial footprint. PatSnap monetizes primarily through subscription software; earlier reporting described annual contract values ranging from a few thousand dollars for limited usage to hundreds of thousands for large enterprises, which is consistent
    with an enterprise SaaS business that spans self-serve experimentation and larger account-based expansion.
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO023
  - CO024
  - CO025
  - CO026
  - CO035
  tableRefs:
