callouts:
- calloutType: strength
  title: Rare combination of IP depth and AI-native workflow breadth
  body: PatSnap no longer presents as a simple patent database. Its current positioning combines IP search, R&D analytics, chemistry, life-sciences workflows, and agentic AI tools, which broadens budget ownership and helps explain continued growth toward pre-IPO scale.
  claimRefs:
  - CO004
  - CO024
  - CO029
- calloutType: risk
  title: Public scale metrics do not fully reconcile
  body: Customer and headcount figures vary materially across official marketing, older funding announcements, and 2026 third-party profiles. The business clearly has scale, but investors still need audited or prospectus-grade counts before underwriting efficiency or growth durability.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO018
- calloutType: insight
  title: IPO narrative depends on Asia-tech market re-opening, not just company quality
  body: Independent 2026 coverage frames PatSnap as a test case for whether Hong Kong and Singapore can attract meaningful software listings again. That means listing success will reflect both PatSnap fundamentals and broader market liquidity conditions.
  claimRefs:
  - CO020
  - CO021
  - CO022
  - CO037
