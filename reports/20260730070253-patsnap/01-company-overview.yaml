- id: founders-and-leadership
  title: Founders, leadership, and governance
  body: Jeffrey Tiong remains the central public executive identity of PatSnap, and multiple sources still describe him as founder and CEO. Independent reporting links the original company idea to Tiong's experience reviewing patents during an NUS Overseas Colleges internship in the medical-device field, which gives the founding story a concrete founder-market-fit logic rather than a generic AI pivot narrative. Public reporting from 2021 and later profile pages also reference a broader early team including CTO Markus Haense, Ray Chohan on new ventures, and Guan Dian leading Asian operations or acting as a co-founder in some profiles. Governance visibility, however, is thin for a company of PatSnap's scale. Tracxn's public profile discloses only Jeffrey Tiong as an active board member, so outside investors should assume that the full board, committee structure, and control rights remain materially opaque until an IPO prospectus or equivalent regulatory filing surfaces.
  claimRefs:
  - CO002
  - CO003
  - CO027
  - CO036
  - CO038
  tableRefs:
  - TO002
- id: funding-history-and-capital-structure
  title: Funding history, investors, and valuation path
  body: PatSnap's public financing history is now well established through both company and independent sources. The defining round remains the March 2021 Series E, when the company announced $300 million from SoftBank Vision Fund 2 and Tencent Investment with participation from CPE Industrial Fund and existing investors including Sequoia China, Shunwei Capital, and Vertex Ventures. Independent coverage at the time stated the post-money valuation crossed $1 billion, making PatSnap a Singapore unicorn. Earlier growth capital included a $38 million Series D in June 2018 led by Sequoia and Shunwei with Qualgro participation, and third-party databases now describe cumulative funding of roughly $352 million across six rounds. PatSnap's investor base therefore combines Asian strategic/financial capital, Singapore-linked venture money, and growth investors with IPO experience. That cap table is a strategic asset for IPO marketing, but it also raises familiar diligence questions around liquidation
    preferences, secondary sales, float overhang, and how much of any 2026 listing would represent primary capital versus holder sell-down.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
