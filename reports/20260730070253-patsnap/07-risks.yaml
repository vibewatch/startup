  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Enterprise governance and security artifacts
    missingEvidence: Reviewed public sources do not expose certifications, audit reports, incident history, or detailed model-governance controls.
    whyItMatters: These are often the decisive documents in enterprise AI procurement and public-market diligence.
    diligencePath: Request SOC/ISO materials, security architecture, incident log, and AI-governance policy set.
    relatedQuestionRefs:
    - QR009
    - QR015
    - QR027
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-metric
    severity: material
    topic: Top-customer exposure and renewal risk
    missingEvidence: No public source discloses top-account concentration, renewal cliffs, or segment-level churn.
    whyItMatters: Concentration and churn can turn a broad logo story into a fragile revenue story.
    diligencePath: Request top-10 account exposure, renewal schedule, NRR/GRR, and churn analysis.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR025
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-metric
    severity: important
    topic: AI cost and model dependency economics
    missingEvidence: No public source quantifies model spend, data-license concentration, or how AI gross margins behave under rising usage.
    whyItMatters: Dependency risk becomes financially material if usage grows faster than monetization or if third-party terms change.
    diligencePath: Request compute spend, model-vendor concentration, data-license renewal schedule, and gross-margin sensitivity.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR028
    relatedTableRefs:
    - TR002
    - TR003
