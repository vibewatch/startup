company:
  name: PatSnap
chapter:
  number: 6
  title: Customers
  summary: PatSnap shows unusually broad named-customer proof for a private B2B software company, with public references spanning law firms, universities, corporates, biotech, and venture investors. The strongest adoption evidence points to production use in research-heavy workflows—prior-art search, competitor monitoring, patent valuation, commercialization analysis, and sequence-driven FTO work—rather than shallow logo placement. Still, public evidence remains much stronger on customer anecdotes and workflow ROI than on formal retention, churn, contract duration, or revenue concentration metrics.
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation, buyer map, and where PatSnap lands first
  body: PatSnap's customer base appears more diverse than a normal legal-tech or data-software business. Official materials and customer stories show adoption across universities, IP law firms, corporate patent teams, biopharma and life-sciences users, venture or advisory firms, and broader enterprise innovation groups. The buyers are not uniform. In some accounts, legal or IP leaders own the relationship because they need novelty, FTO, and portfolio strategy. In others, business-development, strategy, or commercialization teams use the platform to assess technology opportunities and competitive landscapes. This diversity is a commercial strength because it broadens the addressable user base and reduces dependence on one narrow persona. But it also fragments procurement, complicates messaging, and raises the importance of land-and-expand execution. PatSnap does not look like a one-department tool; it looks like a platform that can enter through IP, R&D, commercialization, or investment workflows
    depending on the account.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-public-scale-signals
  title: Adoption trajectory and public scale signals
  body: 'The company''s public customer-scale narrative has grown over time even though exact numbers vary across sources. The 2021 Series E announcement said more than 10,000 customers in over 50 countries used the platform. The 2024 ARR release updated that to more than 12,000 IP and R&D teams across 50 countries. Current official marketing and third-party profiles point to larger figures such as 15,000 clients or more than 18,000 innovators, while case studies show the product being used in real production workflows rather than generic pilots. The right conclusion is not that one customer count is precisely true and the rest are wrong. Rather, public evidence supports meaningful global adoption with continuing growth, while reminding investors that management-quality customer metrics still need reconciliation. What is missing is the denominator and the cohort view: active usage, deployments per module, contract counts, and customer-maturity segmentation remain undisclosed.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof-and-outcomes
  title: Named customer proof and outcome specificity
  body: Public customer stories are the strongest part of the customer chapter because many of them describe concrete workflows and outcomes. Grab uses PatSnap for patent prior-art search, competitive analysis, startup and partnership evaluation, patent valuation, and monitoring of competitor filings. BOA uses PatSnap Analytics and Insights to track competitors, manage a 200-plus patent portfolio, and spot infringement or market shifts. Hatch Blue says the platform improved the speed of IP searches by roughly 30 to 40 percent. The National University of Singapore says PatSnap saved tens of thousands of dollars in manpower and raw-data costs. Vyriad says sequence and patent analysis compressed multi-week research projects into under two days. Gowling and Levenfeld show law-firm use cases that bring complex search and due diligence work in house. This is valuable because it suggests PatSnap is not just a logo vendor; it is embedded in knowledge-intensive decision workflows where time, confidence,
    and breadth of data directly matter.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-durability-and-expansion
  title: Retention, durability, and expansion signals
  body: 'Public sources do not provide formal NRR or GRR, but several qualitative signals imply reasonable durability. Multiple case studies describe daily or repeated use, not one-off analyses. Gowling says PatSnap is always open on screen and is used all day. BOA relies on alerts, workspaces, and legal-status monitoring. City University and NUS use the platform as part of ongoing commercialization or policy-support workflows, not just one project. Grab integrates PatSnap into risk management and investment evaluation. These patterns suggest that once a team standardizes a research workflow inside PatSnap, the tool can become sticky. Expansion potential also looks real: customer stories frequently start in one function, then widen into competitor monitoring, collaboration, due diligence, valuation, or commercialization support. Still, without renewal rates, contract lengths, or cohort retention data, durability remains inferred rather than measured. The customer evidence points to stickiness,
    but not yet to quantifiable retention quality.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-risk-and-bottom-line-view
  title: Expansion potential, concentration risk, and bottom-line customer view
  body: 'The most important customer risks are concentration visibility and proof-quality asymmetry. KR-Asia reported that US and Chinese clients currently account for around 70% of revenue, which implies geographic concentration even if the platform serves customers globally. Public references are also skewed toward customer-success narratives rather than hard commercial metrics. That means the evidence base is excellent for showing ''real use'' but weaker for showing revenue durability, net retention, and concentration by account. On the positive side, the breadth of named references across sectors makes it less likely that PatSnap is dependent on one micro-vertical. The product also appears capable of expanding from patent research into commercialization, investment diligence, strategy, and life-sciences workflows. The bottom-line customer view is therefore constructive: PatSnap has strong adoption proof and cross-functional expansion logic, but investors still need account-level revenue
    concentration, renewal, and cohort data before treating the customer base as fully underwritten.'
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
