  evidenceGaps:
  - type: missing-metric
    severity: material
    topic: Retention and renewal metrics
    missingEvidence: No public source discloses NRR, GRR, churn, renewal rates, or cohort retention by segment.
    whyItMatters: Strong named logos do not prove durable recurring revenue without retention metrics.
    diligencePath: Request NRR/GRR, logo churn, renewal cohorts, and contract-term distribution by segment.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
  - type: missing-metric
    severity: material
    topic: Top-customer concentration
    missingEvidence: No public source discloses top-customer or top-10 account concentration.
    whyItMatters: A few large accounts can create hidden revenue risk even in a diversified logo set.
    diligencePath: Request top-customer revenue exposure, renewal timing, and segment concentration analysis.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: important
    topic: TU003 named customer proof coverage
    missingEvidence: The public named-customer table is intentionally partial and does not show the full active customer base or ranked strategic accounts.
    whyItMatters: A curated customer-proof set can overrepresent success stories and underrepresent churned, downgraded, or low-usage accounts.
    diligencePath: Request the full customer-reference roster, top-account list, and churned-reference log by segment.
    relatedQuestionRefs:
    - QU007
    - QU024
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: important
    topic: Current customer count
    missingEvidence: Public sources cite 10,000+, 12,000+, 15,000+, and 18,000+ style customer/team counts without one reconciled current figure.
    whyItMatters: Customer-count inflation or inconsistency can distort sales-efficiency and penetration narratives.
    diligencePath: Request one audited current customer metric with definitions for logos, teams, users, and active accounts.
    relatedQuestionRefs:
    - QU005
    - QU006
    relatedTableRefs:
    - TU002
