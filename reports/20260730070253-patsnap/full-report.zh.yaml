      - number: '3.3'
        title: 相邻专家与 AI 压缩
        blocks:
          - type: paragraph
            body: >-
              更宽的威胁是相邻专家和 AI 加持既有厂商带来的功能压缩。Anaqua 2025 年 AI 发布显示，记录系统厂商正快速进入自动案卷管理、AI 分类、文档分析、翻译和报告。这并不会让 Anaqua 直接替代
              PatSnap 的发现和图谱工作流，但会缩短法律运营平台与更高层情报平台之间的距离。TechInsights
              位于另一侧翼：它提供拆解数据、基准测试、原理图、现有技术库，以及面向半导体和电子决策的使用证据支持。在客户同样看重产品成本结构或硬件实现而非只看专利检索的行业，TechInsights
              可能是更受偏好的入口。Relecura 的公开可见度似乎更小，但定位于 AI 主导检索，并有足够蓝筹客户标识表明它会进入企业评估。教训是，PatSnap 的护城河不只是「AI」；许多竞争者现在都声称有
              AI。它的防线必须来自工作流集成、领域专用数据资产，以及更快从检索走向行动的路径。
