  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 如何给风险栈排序
        blocks:
          - type: paragraph
            body: >-
              分析 PatSnap
              风险，最有用的方法是拆成五组相互作用的风险：监管与法律、运营与质量、依赖与伙伴、财务与市场、人员与执行。单看任何一组，今天都不明显足以击穿公司。问题在于它们会彼此强化。例如，一家公司既依赖外部模型和授权数据，也需要强治理、高客户信任，以及足够资本缓冲来吸收成本或合规冲击。一家公司若一边推进
              IPO，一边仍只披露有限留存和现金流细节，一旦尽调中出现治理、质量或集中度疑虑，暴露度会更高。简言之，PatSnap
              更像复合风险，而不是二元成败风险。公司大概率能管理每个单点问题，但投资承保应聚焦风险之间的传导路径，以及哪些具体信号能证明这些路径正在被压住。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR007
              - CR015
              - CR023
              - CR030
      - number: '7.2'
        title: 监管、法律与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的产品方向让它更接近新兴 AI 治理要求的中心。欧盟《AI 法案》建立正式的基于风险的法律框架，提出透明度义务，并设置高风险场景要求；在受监管或权利敏感工作流中使用 AI
              的部署方和提供方都会受影响。NIST 的 AI RMF 及相关画像不是强制法律，但对可信 AI、治理和文档化有重要指导作用。WIPO 不断扩展 AI 与知识产权工作，也说明 AI
              生成输出、训练数据和专利流程使用的法律与政策处理仍在变化。对 PatSnap 而言，合规风险不局限于某个司法辖区或一本规则书。它还包括 AI
              辅助输出的透明度、法律或权利敏感用例管理、数据来源可追溯性，以及企业客户会要求多少可解释性。公开资料没有显示 PatSnap
              面临具体执法行动，但企业治理细节缺乏可见度，会提高法律或采购摩擦先于正式监管失败出现的概率。
