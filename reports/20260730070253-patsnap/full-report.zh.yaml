  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现界面
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的收入模式看起来是经典企业 SaaS，叠加在多个工作流模块上。官方产品页面显示，公司销售 Discovery、Synapse、Insights 和 Eureka
              工作流等彼此独立但相互连接的界面；早期报道则提到，合同可以从小规模初始部署到大型企业账户扩张不等。最合理的财务解释是：订阅软件按席位、工作流或企业包销售，大型部署周围可能叠加培训、支持和数据启用服务。未公开的信息同样重要：没有可靠的收入结构披露能拆分多少
              ARR 来自核心 IP 工作流、多少来自较新的生命科学或 R&D 情报产品、多少来自服务，或基于使用量的 AI
              功能是否正在形成新的计费层。因此，投资者应先把变现模型视为企业订阅为主，但在管理层披露模块附加率、合同期限和各细分实际定价前，对收入组合质量保留判断。
