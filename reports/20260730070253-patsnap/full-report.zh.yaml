      - number: '2.5'
        title: PatSnap 的市场底线判断
        blocks:
          - type: paragraph
            body: >-
              最有用的结论不是一个醒目的 TAM 数字。PatSnap
              卖向的是分层机会。专利分析和专利情报的狭义直接市场已经足够大，可以支撑多家规模化厂商，并继续以大约低双位数速度复合增长。更宽的企业创新管理层要大得多，但包含了 PatSnap
              只部分覆盖的功能。这意味着公司有可能随时间向更大的相邻市场扩张，但承销仍应锚定更可辩护的核心口径，以及交叉销售进入相邻 R&D 工作流的证据。WIPO 申请量增长、亚洲持续的创新强度，以及企业对 AI
              辅助技术决策的需求，都形成支撑。开放尽调问题在于：PatSnap 能否把宏观顺风转化为持久预算归属，企业是否偏好集成式 AI
              原生工作流而非既有点工具，以及公司最先在一个客户内部赢下哪里。这些答案比任何单一第三方市场报告数字更能决定 SAM。
