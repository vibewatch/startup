      - number: '7.3'
        title: 运营、质量与依赖风险
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的运营风险很大程度上由产品架构决定。公司依赖大规模且持续演进的数据资产、AI 工作流编排、外部模型基础设施，以及用户对复杂技术输出的信任。KR-Asia 提到 PatSnap
              因成本过高选择不自建基础模型，这在财务上合理，但也确认了它对第三方模型栈的依赖。产品页面还显示，平台依赖庞大的专利、法律、文献、序列和临床试验数据集；一旦条款变化或数据摄取质量下滑，任何一类数据都可能带来成本、授权、时效或质量风险。PatentBench
              是正面的质量控制信号，但无法消除 AI 产品的典型风险：幻觉、检索漏召、工作流脆弱，或模型行为的隐性变化。运营上，最大问题不是 PatSnap
              有没有风险——显然有——而是内部控制、监控和客户支持是否足够强，能否在失败演变成侵蚀信任的事件之前抓住它们。
            claimRefs:
              - CR015
