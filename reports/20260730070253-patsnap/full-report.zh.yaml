      - number: '8.4'
        title: 乐观、基准与悲观区间
        blocks:
          - type: paragraph
            body: >-
              处理 PatSnap 估值，最干净的方法是做情景，而不是给单点估计。乐观情景下，PatSnap 证明 2024 年以来 ARR 加速增长，留存和利润率强，AI 驱动的工作流差异化真实存在，并赶上 HKEX/SGX
              接受度较高的窗口。届时，超过 $2 billion
              的估值区间可以站得住，但即便如此，投资人也应盯住流通结构。基准情景下，公司质量不错，但风险尚未完全拆掉；公开市场投资人给出明显不透明折扣，估值比私募支持者希望的更保守。悲观情景下，IPO
              时点后移，披露不及预期，集中度或成本依赖看起来比预期更差，倍数向公开市场最近愿意支付给承压信息服务资产的水平压缩。最后估值区间很宽，因为披露差距本身很宽。
            claimRefs:
              - CV024
              - CV025
              - CV026
