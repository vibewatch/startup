      - number: '2.2'
        title: 规模测算口径与重叠调整后的机会
        blocks:
          - type: paragraph
            body: >-
              公开市场测算差异很大，取决于分析师统计的是狭义专利分析切口，还是宽得多的企业创新技术栈。The Business Research Company 估计，专利分析市场从 2025 年 $1.2 billion
              增至 2026 年 $1.34 billion，并在 2030 年达到 $2.11 billion。另一份 GII 摘要指向 2025 年约 $1.26 billion、2034 年 $3.72
              billion；WiseGuyReports 则把更宽的专利情报软件类别放在 2025 年 $2.75 billion，并预计到 2035 年达 $7.5
              billion。更宽的创新管理测算分歧更大：Fortune Business Insights 认为 2026 年市场约 $2.06 billion，而 The Business Research Company
              对创新管理软件的 2026 年估计为 $5.76 billion。正确的尽调反应不是把所有数字盲目平均。更大的估计把创意管理、组合管理和趋势软件都扫入其中，远超 PatSnap 的核心 IP 与 R&D
              切口。更可辩护的 2026 年区间，是把 $1.34-2.75 billion 视作狭义直接核心口径，把 $2.06-5.76 billion 视作更宽的相邻市场带。
