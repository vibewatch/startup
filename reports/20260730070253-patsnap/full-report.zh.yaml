      - number: '3.5'
        title: 迁移成本、多栖使用与竞争底线
        blocks:
          - type: paragraph
            body: >-
              市场结构显示迁移成本中等，但多栖使用普遍。专利和 R&D 团队常保留不止一个工具，因为没有单一平台能同样好地统治每一个工作流。律所或中央 IP 团队可能在高信任法律任务上依赖既有厂商的检索或管理平台，同时用
              PatSnap 做图谱、估值或跨职能研究。反过来，战略或 R&D 主导的买方可能从 PatSnap 起步，但仍在化学、半导体或法律审查中补充专业数据。这同时创造机会和风险。多栖使用降低了进入账户的门槛，因为
              PatSnap 不需要第一天就替换所有既有厂商。但这也意味着，如果客户把 PatSnap 视为叠加层而不是记录系统，其收入仍可能受预算审查影响。竞争底线是，PatSnap 看起来足够差异化，尤其在跨职能 AI
              工作流重要的场景中有赢面；但并没有强到可以在没有持续产品证明和企业采用证据的情况下假设持久溢价定价。
