        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              净财务结论是谨慎正面。PatSnap 有一个真正强的公开指标——2024 年 Q2 ARR 达 $100 million——还有数个支撑信号，指向真实企业规模、垂直向上销售
              潜力和盈利能力改善。融资历史也说明，成熟投资方愿意承销长期增长。但「可信规模故事」与「可承销财务画像」之间仍有很大距离。公开投资者还不知道毛利率、流失、净留存、自由现金流、递延收入、销售效率，也不知道收入在模块和地域之间的真实拆分；同样不知道传闻
              IPO 主要是为了增长、流动性还是清理资本表。这意味着 PatSnap 当前的财务叙事应被视为晚期私人公司质量，而不是招股书质量。公司仍可能值得溢价关注，但前提是管理层提供经审计报表、队列
              指标和募资用途细节，把增长、利润率路径和资本需求连成一个一致模型。
