chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              PatSnap 是一家 AI 原生创新情报软件公司，2007 年创立于新加坡。官方材料现在将公司描述为服务 IP 与 R&D 团队的业务，提供领域专用 AI
              智能体和分析工具，支持专利检索、新颖性与自由实施工作、竞争情报、药物发现、材料研究，以及相邻技术工作流。公司已经明显从最初的专利检索用例，扩展成更大的 连接式创新情报技术栈，混合了专有数据、工作流软件和 AI
              辅助。官方页面将总部列在新加坡，并列出伦敦、多伦多、东京和上海等办公室，显示其商业足迹已全球分布。PatSnap
              主要靠订阅软件变现；早期报道提到，年合同价值从有限使用的数千美元到大型企业的数十万美元不等，这与横跨自助试用和大型客户扩张的企业 SaaS 业务相符。
