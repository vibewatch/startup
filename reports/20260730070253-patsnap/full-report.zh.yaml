  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图、类别与购买标准
        blocks:
          - type: paragraph
            body: >-
              PatSnap 面对的不是单一、整齐的同业集合。评估该平台的买方，会把它与经典专利检索既有厂商、IP 分析厂商、端到端 IP
              管理平台、逆向工程或使用证据专家、开放或低成本替代品，以及内部分析师工作流比较。实际竞争集合可分为四组。第一类是专利情报 既有厂商，例如 Clarivate Derwent、LexisNexis
              PatentSight 和 Questel Orbit，提供大型精选数据集、分析、监测和既有企业可信度。第二类是 Anaqua 等与工作流相邻的 IP 管理平台，它们正把 AI 和分析挂到系统记录上。第三类是
              TechInsights 等专业情报提供商，拥有深度使用证据和硬件拆解工作流，在半导体和电子领域很重要。第四类是 Relecura 等 AI 原生或低成本替代方案、The Lens 等开放资源，以及使用通用 AI
              搭配付费专利数据源的内部团队。客户用例从新颖性与 FTO
              检索，到组合战略、空白区绘制、化学和投资分析不等，真正的购买标准是数据宽度、对数据增补的信任、可解释分析、工作流贴合度，以及非专业用户多快能得到可用于决策的输出。
