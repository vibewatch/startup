      - number: '8.2'
        title: 当前估值语境与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开资料大体一致认为，PatSnap 已秘密推进 2026 年双地 IPO，目标融资约 $300 million 至 $400 million，估值超过 $2 billion。最强硬经营数据仍是公司 2024 年
              6 月声明：ARR 在 2024 年 Q2 达到 $100 million。仅按公开数据粗算，$2 billion 估值意味着 ARR 倍数约 20x；只有收入或 ARR
              此后大幅增长，这一倍数才可能略低。高质量垂直 AI 软件公司并非不能支撑这样的估值，但在 NRR、GRR、毛利率、自由现金流和集中度缺乏可见度时，很难盲目认可。因此，入场纪律比平时更重要。买方应把传闻中的 IPO
              估值视为开价，而不是已经挣来的估值锚，并要求针对披露缺口、潜在老股供给和公开市场倍数压缩风险给出折扣。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
