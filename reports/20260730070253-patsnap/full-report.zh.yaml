    layout: standard
    summary: PatSnap 原则上有吸引力，但入场价格仍要守纪律。
    data:
      nodes:
        - id: proof
          label: 真实业务证据
          detail: ARR、客户案例和产品广度足以支撑严肃尽调
        - id: gaps
          label: 披露缺口
          detail: 留存、利润率、现金流和流通股结构仍不清楚
