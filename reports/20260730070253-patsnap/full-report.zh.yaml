        title: 客户分层、买方地图与 PatSnap 最先切入之处
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的客户基础看起来比普通法律科技或数据软件业务更多元。官方材料和客户故事显示，高校、IP
              律所、企业专利团队、生物医药和生命科学用户、风投或咨询机构，以及更广泛的企业创新团队都在采用。买方并不一致。有些账户由法律或 IP 负责人拥有关系，因为他们需要新颖性、FTO
              和组合战略；另一些账户则由业务发展、战略或商业化团队使用平台评估技术机会和竞争图谱。这种多元性是商业优势，因为它扩大了可触达用户基础，并减少对单一狭窄角色
