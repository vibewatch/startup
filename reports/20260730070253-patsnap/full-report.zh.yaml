      - number: '7.4'
        title: 伙伴、客户与资本市场风险
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的伙伴和市场风险，落在集中度、竞争和时点的交叉处。KR-Asia 报道，约 70%
              收入来自美国和中国客户；即使全球客户名单很广，这也意味着有实质地理集中度。公开客户证据也更强于筛选后的案例故事，而不是头部账户暴露或续约断崖。资本端，据报道 2026 年双地 IPO 会让 PatSnap
              面临一种风险：机构投资人要求的信息披露，可能高于后期私募买方过去接受的水平。多家媒体称公司拟融资 $300 million 至 $400 million、估值超过 $2
              billion，但公开资料仍未披露新股与老股的拆分、基石需求，或现有支持者可能寻求多大减持。竞争会放大这个问题，因为既有厂商也在同步提升 AI 能力。如果 PatSnap
              在披露更强留存和治理数据之前就遇到公开市场怀疑，商业风险和融资风险可能同时收紧。
            claimRefs:
              - CR023
