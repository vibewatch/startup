      - number: '8.5'
        title: 最终建议与投资逻辑破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              正确的投资姿态应是有条件推进。PatSnap 值得认真尽调，也可能应比小型、未经验证的 AI 软件故事享有溢价：它已经披露有意义的 ARR，有广泛产品和客户证据，看起来也确有企业相关性。但溢价不等于接受完整传闻
              IPO 估值。除非管理层能拿出强留存、健康利润率、干净治理和合理的新股用途，公开市场投资人都应相对最乐观的私募叙事要求明显折扣。因此，建议是接触，但只在入场标准严格、否决触发条件清晰的前提下推进。若 IPO
              文件或管理层披露确认软件质量耐久、流通结构平衡，机会会迅速变强。若上市仍是缺少这些披露的故事交易，风险调整后的立场应转向观察名单，而不是激进参与。
