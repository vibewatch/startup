        blocks:
          - type: paragraph
            body: >-
              PatSnap 显然融资充足。2021 年 Series E 从 SoftBank Vision Fund 2、Tencent 和其他投资者获得 $300 million，较早的 2018 年 Series D
              又增加 $38 million 并支持扩张。这一资本基础很可能资助了多年产品搭建、国际销售覆盖和近期 AI 转型。不过，传闻中的 2026 年双重 IPO
              进程显示，公司可能想要额外增长资本、为既有股东提供流动性，或两者兼有。AInvest、Startup Fortune、Crypto Briefing 和 Tech in Asia 均称目标募资约 $300
              million 至 $400 million、估值超过 $2 billion，但都无法确认流通部分有多少是一级发行、多少是二级减持。英国子公司的 Companies House
              记录显示申报维护活跃、当前账目期限有效，但并不能回答母公司层面的核心问题：手头现金、烧钱、资金续航、债务和营运资本状态。因此，投资者应把 PatSnap 理解为资本足以达到 IPO 前规模，但仍缺少判断 IPO
              是机会型、战略型还是融资驱动型所需的披露。
