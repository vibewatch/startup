      - number: '1.4'
        title: 规模、客户与运营足迹
        blocks:
          - type: paragraph
            body: >-
              公开规模指标显示业务已有实质体量，但增长信号略有不一致，这在私人软件公司中很常见。PatSnap 2021 年 3 月融资公告称，平台服务 50 多个国家的 10,000 多名客户，员工超过 700 人。到
              2024 年 6 月，公司称 50 个国家的 12,000 多个 IP 与 R&D 团队使用平台。较新的官方营销页面和第三方档案则称有超过 18,000 名创新者或超过 15,000 个客户；Tracxn 另在
              2026 年 6 月列出约 574 名员工，LeadIQ 则把员工规模归为 501-1000 人区间。方向性结论很清楚：PatSnap
              拥有全球企业牵引力，且客户验证覆盖行业企业、高校和律所。未解的问题不是业务是否有规模，而是临近传闻 IPO 进程时，哪些当前客户数和员工数最可靠。
