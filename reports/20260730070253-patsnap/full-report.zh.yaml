            body: >-
              已经存在的公开牵引信号令人鼓舞。PatSnap 2024 年 6 月表示，2023 年年收入增长 20%，ARR 在 2024 年 Q2 达到 $100 million。KR-Asia 2025 年对 Guan
              Dian 的采访随后补充了两个重要细节：公司当年早些时候已达到 $100 million ARR 并实现盈利，约 70% 收入来自美国和中国客户。官方信息还称生命科学产品三年年复合增长超过
              50%，意味着组合可能正向价值更高的垂直工作流迁移，而不是停留在纯专利检索业务。不过，这些数据点仍是管理层引导的快照，而不是经审计财务报表。公司没有公开季度收入历史、递延收入、净美元留存、总流失、平均合同价值或队列
              行为。因此，财务故事可信但不完整：PatSnap 看起来已越过早期试验阶段、进入规模化 SaaS 区间，但仍缺少公开市场投资者通常要求的证据密度。
