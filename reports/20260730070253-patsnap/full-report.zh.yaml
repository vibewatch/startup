      - number: '2.4'
        title: 增长驱动、采用约束与矛盾证据
        blocks:
          - type: paragraph
            body: >-
              PatSnap 所处市场背后的结构性需求驱动是真实的。WIPO 报告显示 2023 年和 2024 年专利申请量均创纪录，说明全球 IP 活动量继续上升。与此同时，市场报告持续把 AI
              驱动的专利检索、云端分析、技术扫描和数字化转型列为增长动力。这与 PatSnap 向智能体式 AI、基准化检索、化学和 R&D
              协作延伸的产品方向高度匹配。医疗健康和制药尤其相关，因为多份市场摘要将其标为重要或快速增长的用户细分，PatSnap 自己的 2024 年披露也强调，生命科学产品三年复合增长超过
              50%。约束同样重要。实施成本高、集成复杂、类别重叠和买方困惑，仍是更广泛创新管理研究中的反复主题。投资者还面对一个叙事风险：同一个可能奖励可信 AI/IP
              平台的公开市场环境，也会审视「创新情报」究竟是真类别，还是相邻软件功能拼在一起的包。因此，市场研究之间的差异不是可以忽略的噪音，而是类别风险的一部分。
