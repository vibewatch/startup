        title: 成本结构、单位经济与利润率未知项
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的成本结构只能间接推断。作为数据密集型企业软件公司，订阅经济应有助于毛利率，但数据获取、数据增补、云端推理、销售覆盖、实施和客户支持都会吃掉大量成本。公司向 AI
              智能体、领域专用模型和科学工作流推进，可能同时提高计算成本，并加大对专业产品团队和领域团队的需求。KR-Asia 提到 PatSnap 认为训练新的基础模型成本过高、并不划算，这一点尤其有信息量：PatSnap
              似乎是在外部基础模型基础设施之上构建差异化工作流，而不是自己追逐资本密集型模型训练。这个选择可以保持资本效率，但如果模型、云或数据账单上升，也会引入依赖成本和利润率暴露。公开层面，几乎所有承销关键的单位经济指标仍然缺失：CAC、回本期、毛利率、专业服务占比、实施负担、支持强度和续约经济都还未知。
