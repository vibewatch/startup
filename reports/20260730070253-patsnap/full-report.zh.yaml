      - number: '5.2'
        title: 运营模型、架构与 AI 交互模型
        blocks:
          - type: paragraph
            body: >-
              PatSnap 公开呈现的产品架构是工作流优先，而不是基础设施优先。Eureka 和 Hiro
              被定位为自然语言入口，但帮助文档清楚显示，这些界面会通过技能路由任务，检索多个底层数据集，并生成结构化输出，而不只是返回原始搜索结果。Discovery、Synapse、Bio 和 Chemical
              则分别在这个共同情报模型上叠加领域专用数据和工作流功能能力。结果更接近垂直化应用技术栈，而不是通用聊天机器人。这个架构重要，因为它说明 PatSnap
              的产品防御力来自以可重复模式编排数据、任务、提示词、过滤器和输出，而不只来自模型所有权。也就是说，可靠性取决于多个移动部件：数据新鲜度、提示词或技能
              路由、权限、导出、引用结果的可解释性，以及底层外部基础模型和云依赖的稳定性。
