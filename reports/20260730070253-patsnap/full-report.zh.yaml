  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的商业机会位于专利分析、专利情报软件、创新管理软件，以及相邻 R&D
              工作流工具的交汇处。最窄口径的纳入支出包括专利检索、专利监测、组合分析、图谱绘制、竞争情报和法律风险审查。稍宽一层还包括技术扫描、趋势管理、创意验证、协作研究工作流，以及领域专用科学或化学情报。最宽的相邻市场则包括企业创新管理软件，用于捕捉创意、评估项目，并在组织内管理创新组合。这些更宽的类别很重要，因为
              PatSnap 正越来越多地从传统 IP 检索卖向 R&D 与决策支持。即便如此，排除支出应包括通用 ERP、通用协作工具、纯咨询项目、没有软件的广义法律服务，以及无差异化研究数据库。实际竞争中，PatSnap
              不只面对直接专利软件厂商，也面对内部研究团队、手工分析师工作流，以及大型企业内部拼装的点状方案。
            claimRefs:
