      - number: '7.5'
        title: 缓释措施、监控指标与投资逻辑破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              只要尽调提问足够聚焦，PatSnap 大部分主要风险都可监控。监管与法律风险可以通过安全认证、政策披露、企业采购结果，以及 AI
              输出相关文档质量来跟踪。运营与依赖风险可以通过客户访谈、支持响应速度、基准刷新节奏，以及 PatSnap
              在产品扩张中保持数据新鲜度和模型质量的证据来监控。客户和资本市场风险应通过集中度明细、续约行为、现金流可见度，以及最终 IPO
              结构来监控。投资逻辑真正破裂，只会发生在多个信号同时恶化：企业客户开始把平台视为非核心，IPO
              深入推进后披露仍然单薄，成本依赖上涨快过变现，或者治理缺口在重大采购或上市尽调中成为拦路点。若没有这些信号，风险栈严峻但可能可控。因此，正确立场不是默认拒绝，而是高监控强度的承保。
