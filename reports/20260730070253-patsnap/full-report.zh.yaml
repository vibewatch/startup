      - number: '1.3'
        title: 融资历史、投资方与估值路径
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的公开融资历史如今已有公司和独立来源双重确认。最关键的一轮仍是 2021 年 3 月 Series E：公司宣布从 SoftBank Vision Fund 2 和 Tencent
              Investment 获得 $300 million，CPE Industrial Fund 参投，既有投资方 Sequoia China、Shunwei Capital 和 Vertex Ventures
              等继续跟投。当时独立报道称投后估值超过 $1 billion，使 PatSnap 成为新加坡独角兽。更早的成长资本包括 2018 年 6 月由 Sequoia 和 Shunwei 领投、Qualgro 参投的
              $38 million Series D；第三方数据库现在称累计融资约 $352 million、共六轮。因此，PatSnap 的股东基础混合了亚洲战略 / 财务资本、新加坡相关风投资金，以及有 IPO
              经验的成长投资方。这张资本表有利于 IPO 营销，但也带来熟悉的尽调问题：清算优先权、二级出售、流通股悬压，以及 2026 年若上市，究竟有多少是一级融资、多少是持有人减持。
