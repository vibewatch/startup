      - number: '1.5'
        title: 里程碑、ARR 披露与当前 IPO 状态
        blocks:
          - type: paragraph
            body: >-
              PatSnap 近期里程碑既显示经营动能，也显示公司正转向公开市场准备。公司 2024 年 6 月披露，2023 年年收入增长 20% 后，ARR 在 2024 年 Q2 达到 $100
              million，这是整个尽调材料中最强的硬数据点之一。与此同时，第三方估算页面仍显示较低的 2024 年 ARR
              数字，投资者需要核对这些供应商是滞后于公司自身披露，还是使用了不同的收入确认时点假设。运营上，PatSnap 继续推出 Eureka、PatentBench、Hiro，以及生命科学顾问委员会项目等 AI
              原生工作流。到 2026 年 6 月，多家援引 Bloomberg 的媒体报道，PatSnap 已秘密申请在 HKEX 和 SGX 双重 IPO，目标募资约 $300 million 至 $400
              million，估值超过 $2 billion。这些报道在方向上彼此一致，但最终上市地点、规模和估值要等正式申报或招股书公开后才能确认。
