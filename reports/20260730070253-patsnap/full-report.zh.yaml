  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的乐观逻辑很直接。它所在的创新情报市场真实存在且在扩张，有公开证据证明经常性收入已具规模，工作流横跨 IP 和 R&D，并试图把自己定位为垂直领域 AI
              胜出者，而不是商品化数据供应商。反向逻辑同样清晰。公开披露明显低于公开市场标准，竞争对手没有原地等待；相对于公司最后一个硬收入数据点，以及相关信息服务同行在公开市场的参差表现，据报道的 IPO
              目标已经显得有野心。因此，投资人不应在「好公司」和「坏公司」之间二选一，而应判断：这是「好公司但必须有合适折扣」，还是「好公司却按披露、留存和利润质量都已被证明来定价」。这个区别就是估值问题的核心。
