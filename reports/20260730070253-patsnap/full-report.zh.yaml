      - number: '8.3'
        title: 可比公司组与公开市场信号
        blocks:
          - type: paragraph
            body: >-
              最相关的上市可比公司并不完美，但仍有启发。Clarivate 是 IP 与科学信息服务领域最接近的可见上市参照；但截至 2026 年 7 月，其市值约 $1.3 billion 至 $1.4
              billion（视来源而定），明显低于 PatSnap 据报道的 IPO 目标。RELX 和 Thomson Reuters 体量大得多，且是质量更高的信息服务和法律数据平台，市值约在 $40 billions
              中段到 $60 billions
              中段。这些公司不是直接的规模或产品可比，但定义了公开市场中真正成熟的信息与分析特许经营应有的样子。可比公司的信号是双面的。正面看，投资人确实会奖励有规模、有信任、有数据厚度的耐久工作流软件。负面看，一旦增长、杠杆或战略清晰度令人失望，市场会重罚。Clarivate
              的估值下修尤其关键，因为它说明，如果没有执行证据，「信息服务」和「分析」不会自动拿到高倍数。
