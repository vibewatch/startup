        - 业务不错，但不透明折价仍在；增长体面但不突出；公开市场买家谨慎
        - ~$1.4B-$2.0B 估值区间更容易站住脚
        - 披露缺口、集中度和可比公司估值下修仍在
        - 若没有重大正面惊喜，这是最可能情景
      - - 悲观
        - IPO 延后或低于预期；留存 / 利润率 / 治理令人失望；估值倍数向承压可比公司组压缩
        - ~$0.8B-$1.3B 估值区间
        - 披露和执行风险叠加
        - 延迟、订单簿偏弱或尽调反馈不佳会释放这一信号
    notes: 这些区间是分析情景，不是市场报价。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most useful public analogues visible in public sources; many private or niche IP vendors do not
        disclose enough to include.
    rows:
      - - Clarivate
        - 市值
        - 2026 年 7 月约 ~$1.3B-$1.4B
        - IP / 科学信息服务里最接近的上市参照
        - 当前估值已下修，也不是纯 SaaS 可比公司
      - - RELX
        - 市值
        - 2026 年 7 月约 ~$66.8B
        - 显示成熟、可信的分析业务能拿到怎样的估值
        - 规模远大于 PatSnap，业务也更分散
      - - Thomson Reuters
        - 市值
        - 2026 年 7 月约 ~$46.4B
        - 高质量法律 / 信息服务参照
        - 非 IP 专项，成熟度也高得多
      - - PatSnap（媒体报道 IPO 目标）
        - 私人市场估值目标
        - 2026 年报道称估值 >$2B、融资 $300M-$400M
        - 当前交易背景
        - 尚非公开市场价格，也未获申报文件确认
    notes: 可比组并不完美，但 PatSnap 要价与 Clarivate 公开市场价值之间的缺口，是最突出的公开市场张力。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 留存指标偏弱
        - NRR/GRR 明显低于高质量 SaaS 预期
        - 削弱溢价倍数逻辑
        - 要求更深折价，或退出
      - - 老股供给高
        - 流通盘大量来自现有股东减持
        - 把增长故事变成流动性事件
        - 降低参与意愿
      - - 治理或安全尽调失误
        - 暴露重大企业级控制缺口
        - 损害信任和 IPO 准备度逻辑
        - 暂停或下调投资观点
      - - 增长没有重新加速
        - ARR 增长相对 2024 年基数停滞
        - 拿掉 AI 高增长溢价叙事
        - 按更接近承压可比公司组的方式给业务估值
      - - IPO 需求偏弱或延迟
        - 簿记建档偏弱，或上市在缺乏清晰度下推迟
        - 释放叙事与价格不匹配信号
        - 转为观察名单立场
    notes: 这些触发项比点估算的细微变化更重要。
    claimRefs:
      - CV027
      - CV033
      - CV036
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 留存
        - NRR、GRR、流失率、续约分群
        - 决定是否配得上经常性软件溢价倍数
        - 财务 / GTM 尽调
      - - 利润率质量
        - 毛利率、服务收入占比、支持负担、推理成本
        - 决定软件业务质量和经营杠杆
        - 财务 / 产品尽调
      - - 客户集中度
        - 前 10 大客户、区域结构、续约断崖
        - 决定下行风险和议价权
        - 财务 / 销售运营尽调
      - - 治理和安全
        - SOC/ISO 证明材料、事件历史、模型治理控制
        - 决定企业信任和 IPO 准备度
        - 安全 / 法务尽调
      - - IPO 结构
        - 新股 / 老股比例、基石需求、募资用途
        - 决定流通盘是增长资本还是流动性事件
        - 投行 / IR 尽调
      - - 当前规模
        - 更新后的 2025/2026 ARR 和增长桥
        - 需要用来替换过时的 2024 年锚点
        - 管理层 / 招股书尽调
    notes: 影响最大的开放问题，只要管理层开放数据室，都可以查清。
    claimRefs:
      - CV032
      - CV034
      - CV035
      - CV037
      - CV038
