      - number: '3.2'
        title: 既有平台与装机基础力量
        blocks:
          - type: paragraph
            body: >-
              最强的既有厂商挑战来自把可信数据整理与深厚企业关系结合起来的厂商。Clarivate 围绕 Derwent 打出超过 70 million 份人工撰写的发明摘要、组合分析、监测、化学、序列检索、API 和 270
              人服务层。LexisNexis 围绕 PatentSight+ 打出精选专利数据、Patent Asset Index 等估值指标、高管可视化、所有权和法律状态数据，以及 Protégé AI
              助手。Questel 的 Orbit Intelligence 宣传超过 100,000 名用户、超过 100 million 件专利、17 million 件外观设计、150 million
              条非专利文献记录，以及 Sophia 这个横跨多个 IP 系统的 AI 助手。这些厂商重要，因为它们在法律、IP 和组合管理买方中已有强可信度。PatSnap 仍可以凭更统一的 R&D 加 IP
              工作流取胜，但既有厂商可以依靠既有合同、服务团队和法律流程信任。装机基础优势抬高迁移成本，也让功能对等本身不够。
