      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Jeffrey Tiong 仍是 PatSnap 最核心的公开高管身份，多方资料仍称其为创始人兼 CEO。独立报道把最初的公司想法追溯到 Tiong 在 NUS Overseas Colleges
              医疗器械领域实习期间审阅专利的经历，这让创立故事呈现出具体的创始人与市场匹配逻辑，而不是泛泛的 AI 转型叙事。2021 年公开报道和后续人物页面还提到更广泛的早期团队，包括 CTO Markus
              Haense、负责新业务的 Ray Chohan，以及领导亚洲业务或在部分档案中被称为联合创始人的 Guan Dian。不过，以 PatSnap 的规模看，治理可见度偏低。Tracxn 的公开档案只披露
              Jeffrey Tiong 为在任董事会成员，因此外部投资者应假设，在 IPO 招股书或同等监管文件出现前，完整董事会、委员会结构和控制权安排仍然高度不透明。
            claimRefs:
              - CO002
              - CO003
              - CO027
              - CO036
              - CO038
