      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              PatSnap 的买方地图比传统专利检索工具更宽。官方产品信息面向 R&D 负责人、IP 专业人士、R&D 工程师、科学家和研究人员，这意味着多个彼此独立的预算所有者：中央 IP 团队、R&D
              职能负责人、企业创新团队、法律 / IP 运营，以及生命科学领域中的药物发现或技术情报团队。日常用户包括专利律师、IP
              分析师、配方科学家、材料研究人员和技术战略人员。这一点很关键，因为不同细分的采用路径不同。法律或 IP 主导的客户可能从新颖性、FTO 或专利撰写工作流起步。R&D
              主导的客户可能从竞争对手技术研究、化学或材料探索、战略尽调起步。生命科学买方可能先从 Synapse 或科学情报工作流开始，再扩展到 IP 分析。因此，更合适的理解是：PatSnap
              的商业动作是在相邻研究和决策工作流中先落地再扩张，而不是单一庞大软件类别。战略上这很有吸引力，但也会让采购碎片化、拉长销售周期，因为多个团队都可能影响购买。
