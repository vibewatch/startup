  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: PatSnap 交付什么，套件如何分层
        blocks:
          - type: paragraph
            body: >-
              PatSnap 已不像单一专利检索应用。公开产品页面显示，其产品组合横跨用于技术扫描和竞争图谱的 Discovery、用于生物医药情报的 Synapse、用于领域专用检索和 IP 工作流的 Chemical 与
              Bio、用于可视化商业情报的 Insights，以及作为以 AI 为中心的交互层的 Eureka。Hiro 被呈现为把自然语言问题转成结构化答案的分析界面，Eureka Desktop
              则把该工作流延伸进持续存在的研究工作区。按客户工作流看，套件现在覆盖在 IP、R&D、战略和生命科学职能中检索、分类、比较、监测、总结和导出技术情报。这个宽度在战略上有吸引力，因为 PatSnap
              可以卖向多个待完成任务；但也带来产品管理挑战：如何在许多专业界面之间维持一致导航、权限、可靠性和用户教育。
