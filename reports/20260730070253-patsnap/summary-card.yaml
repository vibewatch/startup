summary:
  headline: >-
    PatSnap looks like a real scaled innovation-intelligence platform with meaningful ARR and customer proof, but
    public-only evidence still supports a research-more stance because the rumored IPO valuation appears full before
    retention, margin, governance, and float-structure details are proven.
