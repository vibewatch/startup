  topStrengths:
    - Real public ARR anchor at $100 million in Q2 2024 with 20% 2023 revenue growth.
    - Broad multi-module product suite spanning IP, R&D, biopharma, chemistry, and AI workflow interfaces.
    - Strong named-customer proof across corporates, law firms, universities, biotech, and investor-advisory use cases.
    - Sophisticated backer base including SoftBank Vision Fund 2, Tencent, and repeat investors from earlier rounds.
    - >-
      Credible AI differentiation narrative supported by workflow-specific product docs and PatentBench evaluation
      artifacts.
  topRisks:
    - Public disclosure on retention, gross margin, cash flow, and current ARR bridge remains materially thin.
    - Reported IPO pricing above $2 billion looks stretched relative to the last hard public revenue anchor.
    - >-
      Geographic revenue concentration appears meaningful, with KR-Asia reporting about 70% of revenue from the US and
      China.
    - >-
      Product quality and economics depend on external models, data rights, and controls that are not deeply disclosed
      publicly.
    - >-
      Public-market comps show information and analytics assets can de-rate sharply when growth quality or strategic
      clarity is questioned.
  unresolvedGaps:
    - Audited 2025/2026 ARR, retention, churn, and gross-margin disclosure.
    - Cash balance, burn, runway, debt, and full cash-flow profile.
    - Top-customer concentration, renewal cliffs, and contract-length distribution.
    - Security certifications, model-governance controls, and incident / audit history.
    - Primary-versus-secondary split, anchor demand, and exact use of proceeds for any IPO.
