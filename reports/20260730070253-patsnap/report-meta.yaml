companyProfile:
  summary: >-
    PatSnap is a Singapore-founded innovation-intelligence software company serving IP, R&D, strategy, and
    life-sciences users with products spanning Discovery, Synapse, Chemical, Bio, Insights, and AI workflow
    surfaces such as Eureka Hiro. Public evidence shows a $300 million 2021 Series E that established unicorn
    status, a June 2024 company disclosure of $100 million ARR after 20% 2023 growth, and broad customer proof
    across corporates, law firms, universities, and biotech. Public reporting in 2026 suggests the company has
    confidentially explored a dual HKEX/SGX IPO at a valuation above $2 billion, but key public-market diligence
    gaps remain around retention, gross margin, cash flow, governance, and float structure.
  foundedDate: '2007-01-01'
