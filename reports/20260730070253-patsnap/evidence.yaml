evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A prospectus-grade current employee count that reconciles the 700+ figure from 2021 with 2026 third-party
      estimates near 574 or in the 501-1000 band.
    whyItMatters: Headcount is a proxy for operating leverage, sales capacity, and margin trajectory before IPO.
    diligencePath: >-
      Check any IPO filing, audited annual report, or management interview that explicitly states current full-time
      employee count.
    relatedQuestionRefs:
      - QO013
  - type: conflicting-data
    severity: material
    topic: arr
    missingEvidence: >-
      A reconciled 2024 revenue / ARR bridge explaining the gap between PatSnap's June 2024 $100M ARR disclosure and
      lower third-party estimate pages.
    whyItMatters: Revenue quality and growth are central to IPO valuation and SaaS-multiple selection.
    diligencePath: >-
      Request audited financial statements or a banker / prospectus revenue bridge that ties ARR timing conventions to
      recognized revenue.
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: material
    topic: governance and investor map for TO003
    missingEvidence: >-
      A current board roster with independent directors, committee structure, investor-representation detail, and a
      fully disclosed current cap-table ownership split.
    whyItMatters: >-
      Governance quality and cap-table transparency matter more once the company is pricing a public offering and facing
      minority investors.
    diligencePath: Review the eventual IPO prospectus, shareholder letters, or official corporate-governance disclosures.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: ipo-structure
    missingEvidence: >-
      A public filing confirming venue, timing, raise split, cornerstone participation, and whether existing holders
      will sell shares.
    whyItMatters: Offer structure determines dilution, float quality, and aftermarket risk.
    diligencePath: Monitor HKEX and SGX filing systems plus underwriter communications for a public prospectus or hearing-posting.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: PatSnap overlap-adjusted 2026 SAM
    missingEvidence: >-
      A management or banker-style overlap-adjusted SAM that explicitly quantifies how much of broader
      innovation-management spend PatSnap can capture today.
    whyItMatters: >-
      Without an overlap-adjusted SAM, the largest public market figures can make valuation discipline look stronger
      than it is.
    diligencePath: >-
      Look for an IPO prospectus, investor presentation, or banker book that segments PatSnap's opportunity by current
      module and vertical.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: opening wedge by function
    missingEvidence: Win-rate or pipeline data showing whether IP, R&D, legal, or scientific users most often open initial deals.
    whyItMatters: SAM is more credible when paired with evidence about which budget owner most efficiently buys the product.
    diligencePath: Request funnel data, top-of-funnel pipeline by product entry point, or customer cohort analysis from management.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market definition spread
    missingEvidence: >-
      A clearer crosswalk from narrow patent analytics to broader innovation management that reconciles where technology
      scouting and scientific intelligence are counted.
    whyItMatters: Definition spread makes peer-group selection and TAM-based valuation support harder.
    diligencePath: Benchmark multiple analyst taxonomies and map PatSnap modules into each.
    relatedQuestionRefs:
      - QM021
      - QM022
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: minor
    topic: pricing and willingness to pay by segment
    missingEvidence: Segment-specific ACV or seat-pricing data for IP teams, life sciences, and broader R&D workflows.
    whyItMatters: Strong demand drivers do not guarantee attractive monetization across every user segment.
    diligencePath: Collect customer contracts, pricing cards, or procurement interviews by vertical and company size.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: Win/loss rates versus named competitors
    missingEvidence: >-
      No public dataset shows PatSnap's actual win rates, replacement rates, or renewal outcomes against Clarivate,
      Questel, LexisNexis, or Anaqua by segment.
    whyItMatters: Competitive narratives are much stronger with observed buying behavior than with product marketing alone.
    diligencePath: >-
      Ask management for named win/loss analyses, cohort expansion by competitive backdrop, and reference calls from
      recent enterprise bake-offs.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-metric
    severity: material
    topic: Realized pricing versus peers
    missingEvidence: >-
      Public sources do not disclose meaningful realized ACV, module pricing, or discount structures for PatSnap or most
      peers.
    whyItMatters: >-
      Without pricing evidence, it is difficult to judge whether product breadth converts into durable gross profit or
      simply supports discounting.
    diligencePath: Request recent order forms, ACV bands by module, and competitive discount data from sales operations.
    relatedQuestionRefs:
      - QP017
      - QP018
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: important
    topic: Relecura scale and product detail
    missingEvidence: Publicly accessible detail on Relecura's revenue, users, product modules, and recent roadmap is limited.
    whyItMatters: A weakly disclosed AI-native competitor can still matter tactically in enterprise evaluations.
    diligencePath: >-
      Search for customer references, procurement records, or management interviews that quantify Relecura's scale and
      differentiation.
    relatedQuestionRefs:
      - QP009
