- id: growth-drivers-and-constraints
  title: Growth drivers, adoption constraints, and contradictory evidence
  body: 'The structural demand drivers behind PatSnap''s market are real. WIPO reported record patent filings in both 2023 and 2024, showing that the volume of global IP activity continues to rise. At the same time, market reports consistently cite AI-driven patent search, cloud analytics, technology scouting, and digital transformation as growth drivers. That aligns well with PatSnap''s product direction into agentic AI, benchmarked search, chemistry, and R&D collaboration. Healthcare and pharmaceuticals are especially relevant because multiple market summaries flag them as important or fast-growing user segments, and PatSnap''s own 2024 disclosure highlighted 50%+ compound growth in life-sciences products. The constraints are equally important. High implementation cost, integration complexity, category overlap, and buyer confusion remain recurring themes in broader innovation-management research. Investors also face a narrative risk: the same public-market environment that could reward
    a credible AI/IP platform also scrutinizes whether ''innovation intelligence'' is a real category or a stitched-together bundle of adjacent software functions. The variability across market studies is therefore not noise to ignore; it is part of the category risk.'
  claimRefs:
  - CM018
  - CM021
  - CM022
