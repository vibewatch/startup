- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters for PatSnap
  - Residual caveat
  rows:
  - - Global patent filing growth
    - Driver
    - WIPO reported 3.55M applications in 2023 and 3.7M in 2024
    - More filings create more need for search, monitoring, and analytics
    - Volume does not automatically convert into software spend
  - - AI-driven search and analytics
    - Driver
    - Market reports cite AI-powered patent search and ideation assistants as major trends
    - Directly fits PatSnap Eureka, Hiro, and benchmarked AI positioning
    - Incumbents are adding similar features
  - - Digital transformation
    - Driver
    - Innovation-management research links adoption to cloud, AI, and analytics modernization
    - Supports enterprise budget creation for workflow software
    - Budgets can be absorbed by broader transformation suites
  - - Healthcare / pharma demand
    - Driver
    - Reports identify healthcare as a strong segment; PatSnap disclosed 50%+ life-sciences CAGR
    - Validates vertical specialization in Synapse and scientific workflows
    - Sector sales can be longer and more regulated
  - - High implementation cost and integration complexity
    - Constraint
    - Fortune BI highlights high implementation cost and difficult infrastructure integration
    - Can slow deals and reduce SMB penetration
    - Enterprise customers may still absorb this if ROI is clear
  - - Category overlap and buyer confusion
    - Constraint
    - Public forecasts vary widely across adjacent categories
    - Makes TAM inflation easy and procurement more complex
    - Requires clear wedge and budget-owner proof
  notes: The same conditions that expand the opportunity—AI, data growth, vertical workflows—also increase integration demands and sharpen scrutiny of category definition.
