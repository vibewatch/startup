callouts:
- calloutType: insight
  title: PatSnap is too broad for a single clean TAM label
  body: The company clearly fits inside patent analytics, but its chemistry, scientific-intelligence, and R&D workflow products also push it toward broader innovation-management budgets. Investors should separate the direct-core market from the broader adjacency rather than letting the largest category dictate valuation alone.
  claimRefs:
  - CM013
  - CM014
  - CM017
  - CM038
- calloutType: strength
  title: Macro innovation intensity continues to rise
  body: WIPO record filing volumes in both 2023 and 2024, plus continued AI adoption across research and innovation functions, support the thesis that demand for patent and innovation intelligence tools should keep expanding.
  claimRefs:
  - CM018
  - CM021
  - CM022
  - CM033
- calloutType: risk
  title: Category-definition risk is part of the market itself
  body: Because public market studies disagree sharply on what counts as patent analytics, patent intelligence, and innovation management, PatSnap faces an ongoing burden to explain why its wedge deserves a premium multiple instead of being treated as a bundle of adjacent features.
  claimRefs:
  - CM013
  - CM014
  - CM036
  - CM037
