  evidenceGaps:
  - type: missing-source
    severity: material
    topic: PatSnap overlap-adjusted 2026 SAM
    missingEvidence: A management or banker-style overlap-adjusted SAM that explicitly quantifies how much of broader innovation-management spend PatSnap can capture today.
    whyItMatters: Without an overlap-adjusted SAM, the largest public market figures can make valuation discipline look stronger than it is.
    diligencePath: Look for an IPO prospectus, investor presentation, or banker book that segments PatSnap's opportunity by current module and vertical.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: opening wedge by function
    missingEvidence: Win-rate or pipeline data showing whether IP, R&D, legal, or scientific users most often open initial deals.
    whyItMatters: SAM is more credible when paired with evidence about which budget owner most efficiently buys the product.
    diligencePath: Request funnel data, top-of-funnel pipeline by product entry point, or customer cohort analysis from management.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: market definition spread
    missingEvidence: A clearer crosswalk from narrow patent analytics to broader innovation management that reconciles where technology scouting and scientific intelligence are counted.
    whyItMatters: Definition spread makes peer-group selection and TAM-based valuation support harder.
    diligencePath: Benchmark multiple analyst taxonomies and map PatSnap modules into each.
    relatedQuestionRefs:
    - QM021
    - QM022
    relatedTableRefs:
    - TM001
    - TM002
  - type: missing-source
    severity: minor
    topic: pricing and willingness to pay by segment
    missingEvidence: Segment-specific ACV or seat-pricing data for IP teams, life sciences, and broader R&D workflows.
    whyItMatters: Strong demand drivers do not guarantee attractive monetization across every user segment.
