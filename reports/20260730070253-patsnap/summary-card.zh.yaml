summary:
  headline: PatSnap 看起来是一家真实规模化的创新情报平台，ARR 和客户证明都有分量；但仅凭公开证据仍应继续研究，因为留存、利润率、治理和流通股结构细节尚未证明前，传闻 IPO 估值已经显得充分。
