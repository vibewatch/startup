  topStrengths:
    - 真实公开 ARR 锚点为 2024 年 Q2 的 $100 million，2023 年收入增长 20%。
    - 多模块产品套件较宽，覆盖 IP、R&D、生物医药、化学和 AI 工作流界面。
    - 具名客户证明强，横跨企业、律所、高校、生物科技和投资顾问场景。
    - 投资方基础成熟，包括 SoftBank Vision Fund 2、Tencent 和早期轮次的复投方。
    - 工作流专用产品文档和 PatentBench 评测材料，支撑了可信的 AI 差异化叙事。
  topRisks:
    - 留存、毛利率、现金流和当前 ARR 桥接的公开披露仍明显单薄。
    - 相比最后一个硬公开收入锚点，据报超过 $2 billion 的 IPO 定价显得偏高。
    - 地域收入集中度似乎不低；KR-Asia 报道约 70% 收入来自美国和中国。
    - 产品质量和经济性依赖外部模型、数据权利和控制机制，但公开披露不深。
    - 上市可比公司显示，一旦增长质量或战略清晰度受质疑，信息与分析资产可能快速降估值。
  unresolvedGaps:
    - 经审计的 2025/2026 ARR、留存、流失和毛利率披露。
    - 现金余额、烧钱速度、现金跑道、债务和完整现金流画像。
    - 头部客户集中度、续约悬崖和合同期限分布。
    - 安全认证、模型治理控制，以及事故 / 审计历史。
    - 任何 IPO 的新股 / 老股拆分、锚定需求和确切募资用途。
