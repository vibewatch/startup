      - number: '1.4'
        title: Scale, customers, and operational footprint
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators point to meaningful but slightly inconsistent growth signals, which is typical for
              private software companies. PatSnap's March 2021 funding announcement said the platform served more than
              10,000 customers in over 50 countries with more than 700 employees. By June 2024, the company said more
              than 12,000 IP and R&D teams across 50 countries used the platform. More recent official marketing pages
              and third-party profiles describe either more than 18,000 innovators or more than 15,000 clients, while
              Tracxn separately listed about 574 employees in June 2026 and LeadIQ categorized the workforce in the
              501-1000 range. The directional conclusion is clear: PatSnap has global enterprise traction and broad
              customer proof across industries, universities, and law firms. The unresolved question is not whether the
              business has scale; it is which current customer and headcount figures are most reliable immediately ahead
              of the reported IPO process.
