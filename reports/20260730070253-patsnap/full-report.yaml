              appears to build differentiated workflows on top of external foundation-model infrastructure rather than
              pursue capital-intensive model training itself. That choice can preserve capital efficiency, but it also
              introduces dependency costs and margin exposure if model, cloud, or data bills rise. Publicly, however,
              almost every underwriting-critical unit-economic metric remains absent: CAC, payback, gross margin,
