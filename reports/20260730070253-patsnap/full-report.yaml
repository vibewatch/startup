chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              PatSnap is an AI-native innovation-intelligence software company founded in Singapore in 2007. Official
              company materials now describe the business as serving IP and R&D teams with domain-specific AI agents and
              analytics tools that support patent search, novelty and freedom-to-operate work, competitive intelligence,
              drug discovery, materials research, and adjacent technical workflows. The company has clearly broadened
              from its original patent-search use case into a larger 'connected innovation intelligence' stack that
              mixes proprietary data, workflow software, and AI assistance. Official pages place the headquarters in
              Singapore and list additional offices in London, Toronto, Tokyo, and Shanghai, underscoring a globally
              distributed commercial footprint. PatSnap monetizes primarily through subscription software; earlier
              reporting described annual contract values ranging from a few thousand dollars for limited usage to
              hundreds of thousands for large enterprises, which is consistent with an enterprise SaaS business that
              spans self-serve experimentation and larger account-based expansion.
