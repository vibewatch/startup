        title: Milestones, ARR disclosure, and current IPO status
        blocks:
          - type: paragraph
            body: >-
              PatSnap's recent milestone path shows both operating momentum and a transition toward public-market
              readiness. The company disclosed in June 2024 that ARR reached $100 million in Q2 2024 after 20% annual
              revenue growth in 2023, making it one of the strongest hard data points in the entire diligence set. At
              the same time, third-party estimate pages continued to show lower 2024 ARR figures, which suggests
              investors should reconcile whether those vendors lag the company's own disclosure or use different revenue
              timing assumptions. Operationally, PatSnap has continued launching AI-native workflows such as Eureka,
              PatentBench, Hiro, and advisory-board programs in life sciences. By June 2026, several outlets citing
              Bloomberg reported PatSnap had confidentially filed for dual IPOs on HKEX and SGX targeting roughly $300
              million to $400 million at a valuation above $2 billion. Those reports are directionally consistent across
              sources, but final listing venue, size, and valuation remain unverified until a formal filing or
              prospectus becomes public.
