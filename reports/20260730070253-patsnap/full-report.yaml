            body: >-
              The public traction signals that do exist are encouraging. PatSnap said in June 2024 that annual revenue
              grew 20% in 2023 and ARR hit $100 million in Q2 2024. KR-Asia's 2025 interview with Guan Dian then added
              two important color points: the company had reached $100 million ARR and turned profitable earlier that
              year, and roughly 70% of revenue came from US and Chinese customers. Official messaging also said
              life-sciences products were growing at more than 50% annual compound rates over three years, implying the
              mix may be shifting toward higher-value vertical workflows rather than staying a pure patent-search
              business. That said, these data points are still management-guided snapshots rather than audited financial
              statements. There is no public disclosure of quarterly revenue history, deferred revenue, net dollar
              retention, gross churn, average contract value, or cohort behavior. The financial story is therefore
              credible but incomplete: PatSnap looks past early-stage experimentation and into scaled SaaS territory,
