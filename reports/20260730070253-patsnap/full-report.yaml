  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              PatSnap's commercial opportunity sits at the intersection of patent analytics, patent-intelligence
              software, innovation-management software, and adjacent R&D workflow tools. The narrowest included spend
              covers patent search, patent monitoring, portfolio analytics, landscape mapping, competitive intelligence,
              and legal-risk review. A somewhat broader included layer adds technology scouting, trend management, idea
              validation, collaborative research workflows, and domain-specific scientific or chemistry intelligence.
              The broadest adjacency includes enterprise innovation-management software that captures ideas, evaluates
              projects, and manages innovation portfolios across an organization. Those broader categories matter
              because PatSnap increasingly sells beyond classic IP search into R&D and decision support. Even so,
              excluded spend should include generic ERP, general collaboration tools, consulting-only engagements, broad
              legal services without software, and undifferentiated research databases. In practice, PatSnap often
              competes not only with direct patent-software vendors, but also with internal research teams, manual
              analyst workflows, and point solutions assembled inside large enterprises.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
