        title: Exhibits
        blocks:
          - type: callout
            title: The biggest risk is stacked uncertainty
            body: >-
              PatSnap is not obviously failing in public, but too many important questions remain open at once:
              governance, retention, cost dependencies, and IPO mechanics.
            calloutType: risk
