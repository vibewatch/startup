              - CP021
              - CP022
              - CP031
              - CP035
              - CP037
      - number: '3.4'
        title: Where PatSnap appears strongest today
        blocks:
          - type: paragraph
            body: >-
              PatSnap's best competitive case is that it spans more of the pre-decision workflow than many peers.
              Discovery combines patent, legal, literature, company, funding, and grants data for landscape work;
              Synapse pushes deeper into biopharma and clinical intelligence; Insights packages visual
              business-intelligence outputs for strategic users; and Eureka Hiro lowers the interface barrier through
              natural-language analysis. On top of that, PatentBench and the open-source patent-bench repository let
              PatSnap make a more concrete quality claim around domain-specific AI evaluation than vendors relying
              purely on marketing language. This matters because many buyer frustrations come from having to stitch
              together raw search, enrichment, visualization, and communication across tools. PatSnap's advantage is
