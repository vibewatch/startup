  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation, buyer map, and where PatSnap lands first
        blocks:
          - type: paragraph
            body: >-
              PatSnap's customer base appears more diverse than a normal legal-tech or data-software business. Official
              materials and customer stories show adoption across universities, IP law firms, corporate patent teams,
              biopharma and life-sciences users, venture or advisory firms, and broader enterprise innovation groups.
              The buyers are not uniform. In some accounts, legal or IP leaders own the relationship because they need
              novelty, FTO, and portfolio strategy. In others, business-development, strategy, or commercialization
              teams use the platform to assess technology opportunities and competitive landscapes. This diversity is a
              commercial strength because it broadens the addressable user base and reduces dependence on one narrow
              persona. But it also fragments procurement, complicates messaging, and raises the importance of
              land-and-expand execution. PatSnap does not look like a one-department tool; it looks like a platform that
