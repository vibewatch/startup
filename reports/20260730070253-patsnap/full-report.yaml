  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What PatSnap delivers and how the suite is segmented
        blocks:
          - type: paragraph
            body: >-
              PatSnap no longer looks like a single patent-search application. Public product pages show a portfolio
              that spans Discovery for technology scouting and competitive landscapes, Synapse for biopharma
              intelligence, Chemical and Bio for domain-specific search and IP workflows, Insights for visual business
              intelligence, and Eureka as the AI-centric interaction layer. Hiro is presented as the analytics interface
              that turns natural-language questions into structured answers, while Eureka Desktop extends that workflow
              into a persistent research workspace. In customer-workflow terms, the suite now covers searching,
              classifying, comparing, monitoring, summarizing, and exporting technical intelligence across IP, R&D,
              strategy, and life-sciences functions. That breadth is strategically attractive because it lets PatSnap
              sell into multiple jobs-to-be-done, but it also raises the product-management challenge of maintaining
              coherent navigation, permissions, reliability, and user education across many specialized surfaces.
