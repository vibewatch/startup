            title: PatSnap is too broad for a single clean TAM label
            body: >-
              The company clearly fits inside patent analytics, but its chemistry, scientific-intelligence, and R&D
              workflow products also push it toward broader innovation-management budgets. Investors should separate the
              direct-core market from the broader adjacency rather than letting the largest category dictate valuation
              alone.
