  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, categories, and buying criteria
        blocks:
          - type: paragraph
            body: >-
              PatSnap does not compete against a single, uniform peer set. Buyers evaluating the platform can compare it
              with classic patent-search incumbents, IP analytics vendors, end-to-end IP management platforms,
              reverse-engineering or evidence-of-use specialists, open or lower-cost substitutes, and in-house analyst
              workflows. In practice the competitive set breaks into four groups. First are patent-intelligence
              incumbents such as Clarivate Derwent, LexisNexis PatentSight, and Questel Orbit, which offer large curated
              datasets, analytics, monitoring, and established enterprise credibility. Second are workflow-adjacent
              IP-management platforms like Anaqua that increasingly bolt AI and analytics onto systems of record. Third
              are specialist intelligence providers such as TechInsights, which own deep evidence-of-use and hardware
              teardown workflows that matter in semiconductors and electronics. Fourth are AI-native or lower-cost
              substitutes such as Relecura, open resources like The Lens, and internal teams using general-purpose AI
              with paid patent data feeds. Because customer use cases range from novelty and FTO search to portfolio
              strategy, white-space mapping, chemistry, and investment analysis, the real buying criteria are breadth of
              data, trust in enrichment, explainable analytics, workflow fit, and how quickly non-specialists can get to
              decision-ready outputs.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
