    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              PatSnap's revenue model appears to be classic enterprise SaaS layered across multiple workflow modules.
              Official product pages show the company sells distinct but connected surfaces including Discovery,
              Synapse, Insights, and Eureka workflows, while earlier reporting described contracts that can range from
              modest initial deployments to large enterprise account expansions. The most reasonable financial
              interpretation is subscription software sold by seat, workflow, or enterprise package, potentially with
              training, support, and data-enablement services around larger deployments. What is not public is just as
              important: no reliable revenue-mix disclosure breaks out how much ARR comes from core IP workflows versus
              newer life-sciences or R&D intelligence products, how much comes from services, or whether usage-based AI
              features are creating a new billing layer. Investors should therefore treat the monetization model as
              enterprise subscription first, but reserve judgment on mix quality until management discloses module
              attach rates, contract lengths, and realized pricing by segment.
