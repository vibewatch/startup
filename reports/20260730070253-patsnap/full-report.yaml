      - number: '2.5'
        title: Bottom-line market view for PatSnap
        blocks:
          - type: paragraph
            body: >-
              The most useful conclusion is not a single headline TAM. PatSnap sells into a layered opportunity. The
              narrow direct market for patent analytics and patent intelligence is already large enough to support
              multiple scaled vendors and continues to compound at roughly low-double-digit rates. The broader
              enterprise innovation-management layer is much larger, but it includes functionality that PatSnap only
              partially addresses. That means the company can plausibly expand toward a bigger adjacency over time, yet
              underwriting should remain anchored on the more defensible core lens and on evidence of cross-sell into
              adjacent R&D workflows. WIPO's filing growth, Asia's continued innovation intensity, and enterprise demand
              for AI-assisted technical decision-making are all supportive. The open diligence questions are whether
              PatSnap can convert that macro tailwind into durable budget ownership, whether enterprises prefer
              integrated AI-native workflows to incumbent point tools, and where the company wins first inside an
              account. Those answers determine SAM far more than any single third-party market-report number.
            claimRefs:
              - CM015
              - CM016
              - CM018
              - CM019
              - CM020
              - CM030
              - CM036
              - CM038
