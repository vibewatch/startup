              2, Tencent, and other investors, while the earlier 2018 Series D added $38 million and supported
              expansion. That capital base likely funded multi-year product buildout, international sales coverage, and
              the recent AI transition. Yet the reported 2026 dual-IPO process suggests the company either wants
              additional growth capital, liquidity for existing shareholders, or both. AInvest, Startup Fortune, Crypto
