      - number: '3.2'
        title: Incumbent platforms and installed-base power
        blocks:
          - type: paragraph
            body: >-
              The strongest incumbent challenge comes from vendors that combine trusted data curation with deep
              enterprise relationships. Clarivate positions Derwent around 70 million-plus human-authored invention
              summaries, portfolio analytics, monitoring, chemistry, sequence search, APIs, and a 270-person services
              layer. LexisNexis positions PatentSight+ around curated patent data, valuation metrics such as the Patent
              Asset Index, executive visualizations, ownership and legal-status data, and its Protégé AI assistant.
              Questel's Orbit Intelligence markets more than 100,000 users, more than 100 million patents, 17 million
              designs, 150 million non-patent-literature records, and Sophia, an AI assistant spanning multiple IP
              systems. These vendors matter because they start with strong credibility among legal, IP, and
              portfolio-management buyers. PatSnap can still win against them by offering a more unified R&D-plus-IP
              workflow, but incumbents can lean on existing contracts, services teams, and legal-process trust. That
              installed-base advantage raises switching costs and makes feature parity insufficient on its own.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP012
              - CP014
              - CP018
              - CP025
              - CP026
              - CP028
