      - number: '5.2'
        title: Operating model, architecture, and AI interaction model
        blocks:
          - type: paragraph
            body: >-
              The product architecture that PatSnap exposes publicly is workflow-first rather than infrastructure-first.
              Eureka and Hiro are positioned as natural-language entry points, but the help documentation makes clear
              that those interfaces route tasks through skills, search multiple underlying datasets, and generate
              structured outputs rather than only returning raw search results. Discovery, Synapse, Bio, and Chemical
              each layer domain-specific data and workflow affordances on top of that common intelligence model. The
              result is closer to a verticalized application stack than a generic chatbot. This architecture matters
              because it suggests PatSnap's product defensibility comes from orchestrating data, tasks, prompts,
              filters, and outputs in repeatable patterns rather than from model ownership alone. It also means
              reliability depends on several moving parts: data freshness, prompt or skill routing, permissions,
              exports, explainability of cited results, and the stability of external foundation-model and cloud
