      - number: '3.3'
        title: Adjacent specialists and AI compression
        blocks:
          - type: paragraph
            body: >-
              The broader threat is feature compression from adjacent specialists and AI-enabled incumbents. Anaqua's
              2025 AI launch shows that systems-of-record vendors are moving quickly into automated docketing, AI
              classification, document analysis, translation, and reporting. That does not make Anaqua a direct
              replacement for PatSnap's discovery and landscape workflows, but it does narrow the distance between a
              legal-ops platform and a higher-level intelligence platform. TechInsights occupies a different flank: it
              offers teardown data, benchmarking, schematics, prior-art libraries, and evidence-of-use support for
              semiconductor and electronics decisions. In sectors where customers care as much about product cost
              structure or hardware implementation as patent search, TechInsights can be a preferred entry point.
              Relecura appears smaller in public visibility but positions around AI-led search and has enough blue-chip
              logos to signal relevance in enterprise evaluations. The lesson is that PatSnap's moat is not just 'AI';
              many competitors now claim AI. Its defense has to come from workflow integration, domain-specific data
              assets, and faster paths from search to action.
            claimRefs:
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
          - type: table
            tableRef: TP004
