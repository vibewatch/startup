      - number: '2.2'
        title: Sizing lenses and overlap-adjusted opportunity
        blocks:
          - type: paragraph
            body: >-
              Public market estimates vary sharply depending on whether the analyst counts a narrow patent-analytics
              wedge or a much broader enterprise-innovation stack. The Business Research Company estimates the
              patent-analytics market grows from $1.2 billion in 2025 to $1.34 billion in 2026 and $2.11 billion by
              2030. A separate GII summary points to roughly $1.26 billion in 2025 and $3.72 billion by 2034, while
              WiseGuyReports puts the broader patent-intelligence-software category at $2.75 billion in 2025 on a path
              to $7.5 billion by 2035. Broader innovation-management estimates diverge even more: Fortune Business
              Insights places the 2026 market at about $2.06 billion, while The Business Research Company estimates
              $5.76 billion in 2026 for innovation-management software. The correct diligence response is not to average
              all those figures blindly. The larger estimates sweep in idea management, portfolio management, and trend
              software far beyond PatSnap's core IP and R&D wedge. A more defensible 2026 range is to treat $1.34-2.75
              billion as the narrow direct-core lens and $2.06-5.76 billion as the broader adjacency band.
