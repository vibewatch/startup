  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish thesis on PatSnap is straightforward. It sits in a real and expanding innovation-intelligence
              market, has public proof of scaled recurring revenue, spans multiple workflows across IP and R&D, and is
              trying to present itself as a domain-specific AI winner rather than a commoditized data vendor. The
              anti-thesis is equally clear. Public disclosure remains materially below public-market standards,
              competitors are not standing still, and the reported IPO target already appears ambitious relative to the
              company’s last hard revenue datapoint and to the mixed public-market performance of relevant
              information-services peers. Investors therefore should not decide between 'great company' and 'bad
              company.' They should decide between 'good company at the right discount' and 'good company priced as
              though disclosure, retention, and margin quality are already proven.' That distinction is the core
              valuation issue.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV014
              - CV015
              - CV040
      - number: '8.2'
        title: Current valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public sources broadly agree that PatSnap confidentially pursued a dual IPO in 2026 targeting roughly $300
              million to $400 million at a valuation above $2 billion. The strongest hard operating datapoint remains
              the company’s June 2024 statement that ARR reached $100 million in Q2 2024. On a simple public-data basis,
              a $2 billion valuation implies roughly a 20x ARR multiple, and the multiple could be somewhat lower only
              if revenue or ARR has risen materially since then. That is not impossible for a high-quality vertical AI
              software company, but it is difficult to endorse blindly given missing visibility into NRR, GRR, gross
              margin, free cash flow, and concentration. Entry discipline therefore matters more than usual. A buyer
              should treat the rumored IPO valuation as an opening ask, not as an earned mark, and should require a
              discount for disclosure gaps, potential secondary supply, and public-market multiple compression risk.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV019
              - CV024
              - CV025
              - CV026
      - number: '8.3'
        title: Comparable set and what the public market is saying
        blocks:
          - type: paragraph
            body: >-
              The most relevant public comps are not perfect, but they are still instructive. Clarivate is the closest
              visible public analogue in IP and scientific information services, yet its market capitalization in July
              2026 sits around $1.3 billion to $1.4 billion depending on source—well below PatSnap’s reported IPO
              target. RELX and Thomson Reuters are much larger, higher-quality information-services and legal-data
              platforms, with market caps around the mid-$40 billions to mid-$60 billions. Those firms are not direct
              size or product comps, but they define what truly mature information and analytics franchises look like in
              public markets. The comp message is two-sided. On the positive side, investors do reward durable,
              data-rich workflow software with scale and trust. On the negative side, the market heavily punishes
              businesses where growth, leverage, or strategic clarity disappoint. The de-rating of Clarivate is
              especially important because it shows that 'information services' and 'analytics' do not automatically
              command premium multiples without execution proof.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV004
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
      - number: '8.4'
        title: Bull, base, and bear ranges
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to handle PatSnap’s valuation is through scenarios rather than a single point estimate.
              In a bull case, PatSnap shows accelerated ARR since 2024, proves strong retention and margins,
              demonstrates real AI-led workflow differentiation, and benefits from a receptive HKEX/SGX window. In that
              case, a valuation range above $2 billion can be defended, though even then investors should watch for
              float structure. In a base case, the company is solid but not yet fully de-risked; public investors apply
              a material opacity discount and value the business more conservatively than private backers hope. In a
              bear case, IPO timing slips, disclosure disappoints, concentration or cost dependencies look worse than
              expected, and the multiple compresses toward what public markets have recently been willing to pay for
              challenged information-services assets. The resulting valuation dispersion is wide because the disclosure
              delta is wide.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV003
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
          - type: table
            tableRef: TV005
            claimRefs:
              - CV027
              - CV033
              - CV036
              - CV039
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV031
              - CV033
              - CV040
      - number: '8.5'
        title: Final recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The correct investment posture is conditional. PatSnap deserves serious diligence and likely merits a
              premium to small, unproven AI software stories because it already disclosed meaningful ARR, has broad
              product and customer proof, and appears to have real enterprise relevance. But a premium does not mean
              accepting the full rumored IPO mark. Unless management can show strong retention, healthy margins, clean
              governance, and a sensible primary-capital use case, public investors should demand a meaningful discount
              to the most optimistic private narrative. The recommendation is therefore to engage, but only with
              disciplined entry criteria and clear kill triggers. If IPO documents or management disclosure confirm
              durable software quality and a balanced float structure, the opportunity becomes stronger quickly. If the
              listing remains a story trade without those disclosures, the risk-adjusted stance should shift toward
              watchlist rather than aggressive participation.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV032
              - CV034
              - CV035
              - CV037
              - CV038
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The rumored IPO valuation already assumes a lot
            body: >-
              A $2B-plus mark against the last hard public ARR datapoint leaves little room for disclosure
              disappointment.
            calloutType: risk
            claimRefs:
              - CV010
              - CV014
          - type: callout
            title: Clarivate is the cautionary comp
            body: >-
              Clarivate’s depressed public valuation is a reminder that information-services and IP analytics assets can
              de-rate sharply when the market doubts growth or quality.
            calloutType: insight
            claimRefs:
              - CV016
              - CV021
          - type: callout
            title: PatSnap has enough proof to merit real diligence
            body: >-
              The company is not just a speculative AI narrative; it has product breadth, named customers, and a real
              ARR anchor.
            calloutType: strength
            claimRefs:
              - CV003
              - CV004
              - CV010
