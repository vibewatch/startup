      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Jeffrey Tiong remains the central public executive identity of PatSnap, and multiple sources still
              describe him as founder and CEO. Independent reporting links the original company idea to Tiong's
              experience reviewing patents during an NUS Overseas Colleges internship in the medical-device field, which
              gives the founding story a concrete founder-market-fit logic rather than a generic AI pivot narrative.
              Public reporting from 2021 and later profile pages also reference a broader early team including CTO
              Markus Haense, Ray Chohan on new ventures, and Guan Dian leading Asian operations or acting as a
              co-founder in some profiles. Governance visibility, however, is thin for a company of PatSnap's scale.
              Tracxn's public profile discloses only Jeffrey Tiong as an active board member, so outside investors
              should assume that the full board, committee structure, and control rights remain materially opaque until
              an IPO prospectus or equivalent regulatory filing surfaces.
