      - number: '1.3'
        title: Funding history, investors, and valuation path
        blocks:
          - type: paragraph
            body: >-
              PatSnap's public financing history is now well established through both company and independent sources.
              The defining round remains the March 2021 Series E, when the company announced $300 million from SoftBank
              Vision Fund 2 and Tencent Investment with participation from CPE Industrial Fund and existing investors
              including Sequoia China, Shunwei Capital, and Vertex Ventures. Independent coverage at the time stated the
              post-money valuation crossed $1 billion, making PatSnap a Singapore unicorn. Earlier growth capital
              included a $38 million Series D in June 2018 led by Sequoia and Shunwei with Qualgro participation, and
              third-party databases now describe cumulative funding of roughly $352 million across six rounds. PatSnap's
              investor base therefore combines Asian strategic/financial capital, Singapore-linked venture money, and
              growth investors with IPO experience. That cap table is a strategic asset for IPO marketing, but it also
              raises familiar diligence questions around liquidation preferences, secondary sales, float overhang, and
              how much of any 2026 listing would represent primary capital versus holder sell-down.
