            title: Macro innovation intensity continues to rise
            body: >-
              WIPO record filing volumes in both 2023 and 2024, plus continued AI adoption across research and
              innovation functions, support the thesis that demand for patent and innovation intelligence tools should
              keep expanding.
            calloutType: strength
            claimRefs:
              - CM018
              - CM021
              - CM022
              - CM033
          - type: callout
            title: Category-definition risk is part of the market itself
            body: >-
              Because public market studies disagree sharply on what counts as patent analytics, patent intelligence,
              and innovation management, PatSnap faces an ongoing burden to explain why its wedge deserves a premium
              multiple instead of being treated as a bundle of adjacent features.
            calloutType: risk
            claimRefs:
