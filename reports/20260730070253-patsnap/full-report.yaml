            body: >-
              PatSnap's cost structure can be inferred only indirectly. As a data-heavy enterprise software company, its
              gross margin should benefit from subscription economics but absorb significant costs in data acquisition,
              data enrichment, cloud inference, sales coverage, implementation, and customer support. The company's move
              into AI agents, domain-specific models, and scientific workflows likely increases both computing cost and
              the need for specialized product and domain teams. KR-Asia's comment that it did not make sense for
