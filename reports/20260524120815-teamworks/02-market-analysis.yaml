- id: buyer-user-payer-and-adoption-path
  title: Buyer, User, Payer, and Adoption Path
  body: 'The buyer map is multi-threaded. Recruiting staffs need prospect pipelines and communication; operations staffs need calendars, travel, messaging, and files; academics teams need appointment and study-plan workflows; performance staffs need centralized athlete data; and finance, compliance, and athletic-department leadership now increasingly own payment and governance decisions around NIL and revenue sharing. Public procurement evidence supports this cross-functional pattern. Texas A&M bought a bundled Teamworks package covering Hub, Academics, Video, INFLCR, and nutrition support for a discounted $235,000 annual fee, showing that budget ownership can be justified by several departmental pain points at once. Charleston''s memo separately framed Hub as a proprietary center of gravity because it already connected compliance and academics. Teamworks'' own pages reinforce the same land-and-expand pattern: Recruiting centralizes prospect data, Hub becomes the shared operating layer,
    AMS centralizes athlete performance data, Academics adds support workflows, Intelligence adds predictive decision support, and Wallet adds payment administration. In other words, the likely adoption path is wedge first, system of record second, and cross-sell into higher-stakes data or payment workflows later.'
