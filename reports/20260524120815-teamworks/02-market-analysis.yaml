company:
  name: Teamworks
chapter:
  number: 2
  title: Market Analysis
  summary: 'Teamworks sits in a real but easily overstated market: broad sports-analytics sources point to a $2.29B 2025 market growing past $4.75B by 2030, while narrower athlete-management software estimates start at $1.60B in 2025 and NIL-market sources point to a separate $2.75B 2025-2026 transaction layer. The best evidence says Teamworks'' direct SAM is the subset of elite sports organizations with complex workflow and payment needs, especially well-funded college departments, pro clubs, and Olympic/NGB programs. Policy change is accelerating buyer urgency, but uneven school budgets and poor public transparency still limit bottom-up precision.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'Teamworks should not be underwritten against a vague "all sports tech" market. The current official product set spans recruiting, operations, academics, athlete management, intelligence, and wallet-driven payment workflows, which together form a vertical operating system for elite sports organizations rather than a single analytics product. That means included spend in this chapter is software that coordinates athlete, staff, and department workflows: communication, scheduling, travel, recruiting, data centralization, academic support, decision-support analytics, and NIL or revenue-sharing administration. Excluded spend should include categories that appear in broad analyst reports but sit outside Teamworks'' direct monetization path today, such as betting analytics, fan-engagement tooling, generic consumer team apps, and other media-adjacent categories. The status quo substitute is still fragmentation. Memphis explicitly described spreadsheets, emails, and manual workflows as inadequate
    once revenue sharing arrived, and Charleston''s sole-source memo described why one department wanted a unified operational platform instead of disconnected systems. The market boundary therefore starts with workflow orchestration, not with every sports-data or sports-media budget line.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
