- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Teamworks' market expansion in college athletics most plausibly starts with operational pain and then expands into system-of-record, payment, and analytics workflows.
  approximationNotes: This is a qualitative adoption path, not a numeric conversion funnel. It shows the sequence implied by procurement evidence and Teamworks' own cross-module positioning.
  data:
    nodes:
    - id: pain
      label: Manual pain
      detail: Spreadsheets, emails, and disconnected point tools break once workload and policy complexity rise.
    - id: wedge
      label: Initial wedge
      detail: A department lands on Recruiting, Hub, AMS, or another urgent operational workflow.
    - id: system
      label: System of record
      detail: Shared rosters, schedules, and data create a common operating layer across staff.
    - id: payments
      label: High-stakes admin
      detail: Revenue-sharing budgets, contracts, tax handling, and payment orchestration add urgency.
    - id: analytics
      label: Decision support
      detail: Once data centralizes, analytics and intelligence modules become easier to justify.
    - id: constraint
      label: Budget filter
      detail: Only the best-funded or highest-pain departments are likely to expand into the full stack quickly.
    edges:
    - from: pain
      to: wedge
      label: operational trigger
    - from: wedge
      to: system
      label: shared workflow data
    - from: system
      to: payments
      label: new compliance burden
    - from: system
      to: analytics
      label: data now usable
    - from: payments
      to: constraint
      label: budget and complexity test
    - from: analytics
      to: constraint
      label: only some buyers expand
