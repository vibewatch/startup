  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: A normalized bridge that separates broad sports-analytics categories, narrower athlete-management software, and direct Teamworks-addressable workflow spend.
    whyItMatters: Without a normalized bridge, TAM headlines can be mistaken for direct revenue opportunity and overstate valuation support.
    diligencePath: Request management’s segment revenue mix and a bottoms-up mapping from modules to buyer budgets.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: college-athletics-bottom-up-sam
    missingEvidence: A public or private count of which schools are opting into revenue sharing, how they cluster by budget tier, and what software categories they are actively funding.
    whyItMatters: Budget concentration is likely the main determinant of near-term SAM, especially outside the wealthiest conferences.
    diligencePath: Build a cohort model using opt-in lists, public athletics revenue data, and management pipeline segmentation by school tier.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: wallet-adoption-depth
    missingEvidence: Live-customer counts, payment volume, and renewal or expansion data for Teamworks Wallet and GM.
    whyItMatters: The market thesis is materially stronger if Wallet and GM are already converting installed-base relationships into recurring revenue, not just pilots or case studies.
    diligencePath: Request module-level customer counts, live-versus-pilot breakdowns, payment volumes, and attachment rates from management.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: revenue-based-som
    missingEvidence: Average contract values, implementation scope, and module mix by school tier, league, and customer segment.
    whyItMatters: Procurement examples show willingness to pay, but they do not support a defendable revenue-based SOM without broader pricing dispersion data.
    diligencePath: Request ACV distribution, implementation fee structure, and renewal cohort data by customer segment.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: opt-in-rates
    missingEvidence: A confirmed school-by-school map of revenue-sharing opt-in decisions for the 2025-2026 cycle.
    whyItMatters: The speed of opt-in adoption will shape how quickly college-athletics workflow demand becomes recurring software demand.
    diligencePath: Track conference-by-conference opt-in decisions and compare them with Teamworks pipeline or installed-base coverage.
    relatedQuestionRefs:
    - QM024
