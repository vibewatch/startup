- id: sizing-lenses-and-what-counts
  title: Sizing Lenses and What Counts
  body: 'The public evidence supports multiple market lenses, not one heroic TAM. MarketsandMarkets places global sports analytics at $2.29 billion in 2025 and above $4.75 billion by 2030, but its taxonomy explicitly includes fan engagement and social-media analytics that overstate Teamworks'' direct opportunity. Verified Market Research offers a narrower adjacent lens in athlete management software, at $1.60 billion in 2025 rising to $3.40 billion by 2033, with sports teams as the dominant end user and North America around 40% share. College athletics adds a third lens. RallyFuel projects a $2.75 billion NIL market in the 2025-2026 cycle, while Opendorse reports network activity across 150,000+ athlete users, $250 million+ in compensation, and institutional penetration reaching 98% of NCAA, NAIA, and NJCAA members. These figures measure different things: broad category spend, narrower workflow-software demand, and transactional ecosystem activity. They are best read as upper bound, nearer-term
    proxy, and demand-signal layers rather than as interchangeable TAM numbers. The practical implication is that Teamworks'' direct SAM is likely much smaller than the headline sports-analytics market but still meaningfully enlarged by NIL and revenue-sharing complexity.'
