- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: The strongest near-term demand driver is policy change in college athletics. NCAA's April 2025 rule package contemplated direct payments to student-athletes and elimination of more than 150 rules, while subsequent coverage framed the first revenue-sharing cap at $20.5 million for 2025-2026, tied to 22% of average Power Conference revenue and expected to step up over time. That turns budgeting, contracting, tax withholding, roster management, and cross-functional coordination from back-office friction into front-office urgency. Teamworks' own Wallet and Memphis materials are built around precisely that pain. But the same change is also a constraint. University Business and Oak View Group both emphasize that schools are under real financial pressure and are searching for new funding pathways, while SportsRecruits highlights hard roster trade-offs. The college market is therefore not a flat wave of demand. It is a budget-strained, opt-in market where the best funded departments move
    first, the mid-market hesitates, and product adoption will depend on whether software clearly reduces administrative burden rather than simply adding another line item.
