tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Elite team operations
    - Communication, scheduling, travel, files, operational workflows, and shared roster data
    - Generic team chat apps or unmanaged spreadsheets
    - Operations staff use; athletic department or club operations budget pays
    - This is the system-of-record wedge that makes later module expansion possible
  - - Recruiting workflows
    - Prospect data, boards, evaluation pipelines, automated communications, and recruiting tasks
    - Consumer recruiting media and unrelated SIS tooling
    - Coaches and recruiting staff use; sport or department budget pays
    - A high-frequency workflow with visible ROI in staff efficiency and information access
  - - Athlete management and performance
    - Centralized medical, workload, nutrition, and performance data plus APIs into the tech stack
    - Wearables hardware, lab equipment, or standalone diagnostics devices
    - Performance and medical staffs use; performance budget pays
    - Closer to the athlete-management SAM than to generic sports analytics
  - - Intelligence and decision support
    - Predictive models for athlete evaluation, roster construction, contract valuation, and game strategy
    - Betting, fan engagement, media analytics, and social listening
    - GM, analysts, and leadership use; sport operations or strategy budget pays
    - This is real spend, but broad sports-analytics reports overstate the directly relevant slice
  - - NIL and revenue-sharing administration
    - Contracting, payment orchestration, tax handling, budget controls, and athlete-finance workflows
    - General-purpose banking or collective fundraising that bypasses departments
    - Compliance, NIL, finance, and athletics leadership use and pay
    - This is the newest wedge created by the 2025-2026 policy shift in college athletics
  notes: This table defines the Teamworks-relevant market by included workflow spend and explicit exclusions so later sizing does not rely on one inflated category headline.
