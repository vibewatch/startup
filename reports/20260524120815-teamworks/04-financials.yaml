tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Core workflow subscriptions
    - Annual institutional software subscriptions for Hub, Operations, Academics, Recruiting, AMS, and Performance
    - Institution / department contract
    - Core suite is publicly visible across multiple product pages and procurement bundles
    - Likely recurring and sticky, but revenue mix is undisclosed
    - Provide module-level ARR, contract count, and renewal rate by segment
  - - Analytics / intelligence module
    - Premium predictive-model and contract-valuation software sold as Teamworks Intelligence
    - Module / team / organization license
    - Marketed as a distinct advanced-analytics product for elite teams
    - Potentially higher-value software, but pricing and model-maintenance cost are unknown
    - Provide Intelligence list pricing, attach rate, and gross margin
  - - Athlete earnings planning
    - GM software for roster planning, scenario analysis, and total athlete earnings management
    - Athletic department contract
    - Officially launched in September 2024 for rev-share and budget workflows
    - Strategic budget software with policy-driven demand, but no public pricing
    - Provide GM pricing, active customers, and revenue contribution
  - - Payments and wallet workflows
    - Wallet handles NIL, per diem, and revenue-share disbursements into athlete accounts
    - Payment workflow / disbursement program
    - Official materials position Wallet as payment and banking infrastructure for athletes
    - Could create transaction revenue and switching costs, but may also add service/compliance load
    - Provide payment volume, fee model, bank partner economics, and chargeback/loss data
  - - Cross-sold module expansion
    - Existing customers add Hub or other modules on top of Compliance, Academics, or Influencer footprints
    - Expansion order / amendment
    - Charleston and TAMU documents show multi-module economics rather than single-SKU selling
    - Good signal for land-and-expand revenue quality if retention is strong
    - Provide attach rates and expansion ARR from installed-base customers
  - - Usage-based extras
    - Overage charges for message credits and additional two-way users on top of annual subscription fees
    - Per credit / per user
    - Public TAMU contract shows usage-style billing layered onto fixed annual fees
    - Helpful upside lever, but can also signal support-heavy deployments
    - Provide share of revenue tied to overages, seats, and non-recurring services
  - - Support and services
    - Premium ongoing customer success and support services plus implementation-like workflow setup
    - Included service tier / possible services line
    - TAMU contract includes P5 premium support; Memphis case implies high-touch payment workflow enablement
    - May support retention but can compress gross margin if labor-intensive
    - Break out implementation and support revenue versus cost to serve
  notes: This table separates recurring platform subscriptions from analytics, payment, usage-based, and service-style monetization. Public sources reveal architecture, not revenue mix or recognition policy.
