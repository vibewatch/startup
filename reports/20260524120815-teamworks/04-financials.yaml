    - 2.75B NIL market and 20.5M annual per-school direct-benefit cap
    - Policy-driven institutional payment pool
    - Large addressable budget, but dependent on regulatory execution
    - Supports GM and Wallet demand while increasing policy sensitivity
  notes: Comp rows mix public-company market data with end-market size markers. They bound potential economics and valuation logic; they do not substitute for Teamworks revenue disclosure.
