  title: Capital adequacy table
  columns:
  - Input
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cumulative capital raised
    - About 400M
    - high
    - Establishes that Teamworks has had substantial access to outside capital
    - Reconcile public total to full cap table and primary versus secondary proceeds
  - - Latest large round
    - 235M Series F at pre-money valuation above 1000M
    - high
    - Most important public liquidity inflection point for the current platform strategy
    - Provide closing cash balance, investor rights, and any secondary component
  - - Prior institutional round
    - 65M Series E in 2023
    - medium
    - Shows financing support before the 2025 unicorn round
    - Provide remaining proceeds and burn between Series E and Series F
  - - Disclosed use of funds
    - AI-powered innovation, M&A, new regions, and elite human performance expansion
    - medium
    - Use-of-funds guidance signals future cash demands and integration spend
    - Provide board-approved use-of-proceeds plan and acquisition budget
  - - Cash on hand
    - 'null'
    - low
    - Runway cannot be assessed without cash and restricted-cash detail
    - Provide latest cash, restricted cash, and short-term investments
  - - Monthly burn / runway
    - 'null'
    - low
    - Capital sufficiency depends on burn relative to growth and acquisition plans
    - Provide trailing 12-month burn and base / downside runway assumptions
  - - Debt / project finance / earn-outs
    - 'null'
    - low
    - Leverage, seller notes, and contingent consideration can change risk materially
    - Provide revolvers, term debt, seller notes, earn-outs, and lease obligations
  - - Legal / integration contingencies
    - Zelus litigation continues; acquisition-related obligations are not publicly quantified
    - medium
    - Unexpected cash needs can arise from disputes, reserves, or integration miss
    - Provide litigation reserve, indemnities, contingent liabilities, and acquisition holdbacks
  notes: Capital adequacy is directionally positive because fundraising support is strong, but multiple balance-sheet fields remain undisclosed and block a true runway or leverage judgment.
