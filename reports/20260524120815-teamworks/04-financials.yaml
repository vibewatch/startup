- id: financial-verdict-and-diligence-blockers
  title: 'Verdict: evidence supports enterprise pricing power and strategic breadth, but not yet revenue quality or capital-efficiency underwriting'
  body: 'The investable part of the story is easy to see. Teamworks can command six-figure annual contracts at large universities, monetize add-ons and overages, and extend beyond workflow software into analytics, athlete-earnings planning, and payment/tax orchestration. The surrounding market also looks favorable: sports analytics and athlete-management software are both growing at double-digit rates, while the post-House environment creates a new direct-payment budget line that Wallet and GM are explicitly designed to capture. In a best case, that produces a compound model with sticky core subscriptions, premium analytics, and budget-critical payment workflows. The underwriting blockers are equally clear. Public sources still do not show module-level ARR, gross margin, CAC, payback, net retention, customer concentration, backlog, cash balance, burn, runway, or debt and earn-out obligations. Procurement documents prove price points exist, but they do not reveal realized discounting across
    the broader customer base. Likewise, the public comp set helps bound valuation logic but cannot rescue a missing revenue denominator. The financial conclusion is therefore positive but incomplete: Teamworks looks strategically broad and well financed, yet the company remains materially under-disclosed on the specific inputs needed to judge revenue quality, margin path, and capital adequacy with confidence.'
