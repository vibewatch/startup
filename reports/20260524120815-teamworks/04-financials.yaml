- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Annual contract value proxy
    - About 0.112M to 0.235M per year in disclosed university examples
    - medium
    - Provides a rough top-down ACV anchor for large institutions
    - Provide pricing waterfall by segment, module, and contract year
  - - Contract term / revenue visibility
    - TAMU schedule shows three annual payments with discount roll-off
    - medium
    - Longer contracts can improve payback and reduce churn risk
    - Provide weighted-average initial term and renewal term
  - - Land-and-expand economics
    - Installed-base expansion is visible, but attach rate is undisclosed
    - medium
    - Expansion revenue can materially improve CAC efficiency and NRR
    - Provide % of new ARR from existing customers and cross-sell conversion
  - - Usage-based monetization
    - Extra message credits and users are billable, but revenue share is unknown
    - medium
    - Usage revenue can lift ARPU but may introduce variability
    - Provide % of ARR tied to usage or overage charges
  - - Implementation / customer success load
    - Workflow, budgeting, payment, and compliance use cases imply high-touch support
    - medium
    - Support intensity directly affects gross margin and payback
    - Provide implementation revenue, support headcount, and cost to serve per customer
  - - Payments / compliance burden
    - Wallet handles withholding, tax forms, and revenue-share royalties
    - medium
    - Payment orchestration can create margin drag or working-capital needs
    - Provide payment take rate, bank fees, float economics, and compliance-support cost
  - - CAC / payback
    - 'null'
    - low
    - Sales efficiency cannot be underwritten without it
    - Provide CAC, payback period, and quota productivity by segment
  - - Gross margin / NRR / churn
    - 'null'
    - low
    - These are the core inputs for valuation and revenue quality
    - Provide gross margin, net retention, gross retention, logo churn, and services mix
  notes: Nulls mean the metric is not publicly disclosed in the fetched record. Public unit-economics analysis is therefore proxy-based and should not be mistaken for reported company KPIs.
