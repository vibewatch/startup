callouts:
- calloutType: strength
  title: Procurement docs prove enterprise ACVs, not just marketing breadth
  body: 'Texas A&M and Charleston provide unusually concrete public pricing evidence for a private sports-software company: six-figure annualized values, multi-year schedules, add-on fees, and a sole-source expansion dynamic into existing modules.'
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
- calloutType: risk
  title: Public pricing clues do not equal realized revenue quality
  body: Procurement proxies show what some customers can pay, but they do not answer whether Teamworks has healthy module mix, retention, services margins, or portfolio-wide discount discipline.
  claimRefs:
  - CI043
  - CI044
  - CI048
  - CI056
- calloutType: insight
  title: Wallet and GM may be strategically valuable but financially less pure than core workflow SaaS
  body: Athlete-payment, revenue-share, and tax-compliance workflows can deepen customer dependence and enlarge budgets, yet they also introduce bank, compliance, support, and operational-cost considerations absent in simpler workflow modules.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI045
  - CI053
- calloutType: risk
  title: Capital adequacy is still an inference problem
  body: A $235 million Series F and roughly $400 million of total funding are meaningful positives, but without public cash, burn, debt, or earn-out data, investors still cannot quantify runway or balance-sheet risk.
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI049
  - CI055
