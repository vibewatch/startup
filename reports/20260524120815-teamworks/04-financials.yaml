- id: gtm-and-sales-efficiency-proxies
  title: GTM evidence points to a land-and-expand sales motion with high switching costs, but public CAC and payback remain absent
  body: The best publicly visible sales-efficiency clue is not a published CAC figure but the shape of customer contracts. The College of Charleston’s sole-source document says Hub was needed because the athletics department already used Teamworks Compliance and Academics, and it puts the estimated four-year cost at $446,800. That is a textbook expansion sale into an existing installed base. Texas A&M’s contract shows a three-year payment schedule stepping from $185,000 to $210,000 to $235,000 as early-adopter discounts roll off, which suggests Teamworks can raise realized annual contract value over time rather than rely on one-year discounting alone. The University of Maine’s 2026 athletics-solutions RFP results show that Teamworks is also competing in formal procurement processes against vendors such as Trackman, TruMedia, and Concourse Tech, reinforcing the idea that this is an enterprise procurement sale, not lightweight self-serve software. Memphis’ case study adds an operational angle.
    The school describes using GM and Wallet to manage budgets to the penny, coordinate high-volume contracts, and avoid late payments with a lean administrative team. That kind of workflow pain relief can produce strong retention and expansion if the product becomes embedded in daily finance and compliance operations. The tradeoff is that the same value proposition likely requires onboarding, support, implementation coordination, and customer success resources that pure bottom-up SaaS would not. Public sources therefore support a high- switching-cost, multi-product enterprise motion, but they do not expose CAC, payback, sales productivity, or attach-rate data directly.
