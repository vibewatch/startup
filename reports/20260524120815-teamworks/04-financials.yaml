- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / pricing clue
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source-backed implication
  rows:
  - - TAMU Elite Package base
    - 225000 annual list price for bundled Teamworks modules
    - List proxy from a single university contract
    - Realized price depends on term discounts and procurement context
    - Large athletic departments can support six-figure annual ACVs for a broad Teamworks stack
  - - INFLCR Plus add-on
    - 12500 annual add-on license
    - Explicit add-on price in same TAMU document
    - Unknown adoption outside this one contract
    - Teamworks can monetize optional feature layers on top of the base platform
  - - TAMU discounted annual total
    - 235000 annual after a 2500 term discount
    - Appears to be the realized year-three annual fee in the disclosed schedule
    - Single customer only; broader discount policy unknown
    - Public pricing evidence is negotiated enterprise pricing, not a public menu
  - - Message-credit overage
    - 0.045 per additional message credit
    - Usage-style charge on top of annual subscription
    - Share of customers incurring overages is unknown
    - Revenue is not purely fixed-fee SaaS; some contracts have metered economics
  - - Additional two-way users
    - 50 per year per extra user
    - Seat-style incremental charge
    - Unknown standard user bundle across customers
    - User expansion can lift contract value without a full platform upsell
  - - Early-adopter year 1 pricing
    - 185000 payment due in year 1
    - Realized contractual price after a 50000 special discount
    - Reserved for early-adopter extension terms; not general list price
    - Teamworks uses discounting strategically to win or retain large accounts
  - - Early-adopter year 2 pricing
    - 210000 payment due in year 2
    - Realized contractual price after a 25000 special discount
    - One disclosed contract only
    - Step-up pricing suggests confidence that customers will remain on platform
  - - College of Charleston Hub contract
    - 446800 estimated total over four years, or about 111700 annualized
    - Realized sole-source estimate for one module expansion
    - Annualization hides any implementation or uneven schedule details
    - Even an incremental Hub deployment can still represent meaningful six-figure contract value
  - - Wallet and GM
    - Public product pages disclose workflow and value proposition but no public list price
    - Realized monetization is not observable from public sources
    - Fee model, revenue share, and support terms remain unknown
    - Newest products may be financially important even though public pricing is absent
  notes: Procurement documents provide the strongest public pricing evidence, but they are customer-specific proxies rather than a universal Teamworks price list or realized blended ASP.
