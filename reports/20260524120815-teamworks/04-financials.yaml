- id: capital-adequacy-and-financing-dependency
  title: Capital depth looks directionally strong, but public liquidity disclosure is far too thin for a real runway judgment
  body: 'The visible funding story is a genuine strength. Teamworks’ current About page says the company has raised roughly $400 million, and the company’s June 2025 Series F announcement says it secured $235 million in an oversubscribed round led by Dragoneer at a pre-money valuation above $1 billion. The earlier 2023 Series E added $65 million and explicitly said the new capital would continue to fund M&A and expansion into new regions and elite human performance. Taken together with the acquisition pace from ARMS through Telemetry, Zelus, Opteamal, Sportlogiq, and PFF Enterprise, the public record suggests capital has been used both for organic product expansion and inorganic platform broadening rather than for mere survival financing. That said, “well funded” is not the same as “adequately capitalized.” Public sources do not disclose cash on hand, monthly burn, runway, debt facilities, seller notes, earn-outs, or integration reserves. Wallet and GM may also increase working-capital and
    compliance demands relative to core workflow software, especially as institutions move into revenue sharing and royalty withholding. The Zelus litigation is not obviously catastrophic, but ongoing legal and integration exposure is still a real contingent call on management attention and potentially on cash. The right financial judgment is therefore asymmetrical: Teamworks clearly has strong fundraising support, yet outside investors still lack the balance-sheet data needed to decide whether another financing round is optional or strategically necessary.'
