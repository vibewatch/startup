- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Module-level ARR and revenue mix
    - Without it, valuation and revenue-quality analysis are mostly narrative
    - Request ARR bridge by module, segment, geography, and acquired business
  - - Gross margin and services mix
    - Cannot judge whether support, analytics, and payment workflows dilute software economics
    - Request gross margin by product family plus implementation and support revenue versus cost
  - - CAC, payback, and sales productivity
    - Enterprise pricing evidence cannot be converted into sales efficiency
    - Request CAC, payback, quota attainment, pipeline conversion, and sales-cycle data by segment
  - - NRR, gross retention, and customer concentration
    - High switching costs are plausible but unproven without cohort data
    - Request cohort retention, concentration schedule, top-customer ARR, and renewal calendar
  - - Cash, burn, runway, debt, and earn-outs
    - Capital adequacy cannot be underwritten from fundraising history alone
    - Request latest balance sheet, debt schedule, contingent consideration, and runway model
  - - Wallet and GM payment-unit economics
    - Newest products may be strategically important but financially opaque
    - Request payment volume, take rate, bank/processor fees, loss events, and compliance-support cost
  notes: These are the highest-impact disclosure gaps that still block a reliable view of revenue quality, margin path, and capital sufficiency.
