    - Valuation denominator is missing
    - Private valuation is visible, but revenue quality and scale are not
  - - Sportradar
    - About 1.55B TTM revenue
    - About 3.85B market cap in May 2026
    - Roughly 2.5x market cap / revenue
    - Large public data-and-betting infrastructure comp sets the low end of the fetched public multiple range
  - - Catapult
    - About 0.11B 2025 revenue
    - About 0.78B market cap in May 2026
    - Roughly 7.1x market cap / revenue
    - Smaller public sports-performance software comp sets a much richer multiple anchor
  - - Genius Sports
    - 2025 Form 20-F filed with complete audited financial statements; over 1000 sports organizations in 150 countries
    - Fetched pack confirms public filing availability rather than a clean numeric multiple
    - Disclosure benchmark, not a resolved multiple from this pack
    - Shows the disclosure standard public sports-data investors can expect from a scaled peer
  - - Sports analytics market
    - 2.29B in 2025 growing to 4.75B by 2030
    - 15.7% CAGR
    - TAM is expanding quickly
    - Supports the strategic case for Intelligence and analytics-led upsell
