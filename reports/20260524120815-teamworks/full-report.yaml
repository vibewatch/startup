              The strongest product-level conclusion from the fetched Teamworks pack is that the company is no longer
              selling a single communications application. Current product pages divide the platform across Hub,
              Operations, Performance, Recruiting, and Intelligence, while older-but-still-useful product-breakdown
              material shows how legacy brands such as ARMS, Smartabase, Notemeal, INFLCR, Pulse, and Retain were pulled
              into that broader operating-system narrative. Hub remains the clearest anchor: Teamworks describes it as
              the unified command center for rosters, calendars, messages, travel, files, and other daily coordination
              workflows. Around that core, Operations handles logistics and inventory, AMS acts as the performance-data
              layer, Recruiting manages evaluation and onboarding, and Intelligence plus GM extend the stack into
              decision support. Customer procurement evidence from Charleston and Texas A&M makes this more than
              branding. Those documents show real buyers treating Teamworks as a multi-module suite that can centralize
