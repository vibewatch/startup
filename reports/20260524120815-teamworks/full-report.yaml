      - number: '8.4'
        title: Bull, base, and bear scenarios with explicit triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case requires Teamworks to prove that the operating-system story is monetizing faster than public
              evidence currently shows. Underwriting that outcome means assuming Teamworks has already crossed into
              roughly $200M+ of revenue-equivalent scale, that Wallet and GM capture a meaningful share of the
              post-House payment/compliance workflow, and that the Intelligence / Zelus / PFF stack becomes a durable
              premium analytics layer rather than an integration project. In that world, the company can plausibly
              support a $1.8B-$2.4B valuation by 2028, especially if public sports-tech multiples stabilize and
              Teamworks can show strong retention plus multi-product penetration.

              The base case is much more conservative and is the right public-only default today. It assumes Teamworks
              is real, scaled, and strategically well positioned, but not yet publicly proven enough to command an
              aggressive premium. If audited revenue lands in the roughly $150M-$200M zone, if attach rates are mixed
              across the stack, and if public multiples remain in the current range, then the present >$1B mark can be
              justified only as roughly fair rather than obviously attractive. The bear case emerges if revenue is
              materially below the Catapult-implied threshold, if litigation or customer-confidentiality disputes slow
              analytics adoption, or if the Series F preference stack heavily subordinates a new entrant. In that
              outcome, Teamworks could still be a good company and a bad price, which is exactly why kill criteria and
              diligence asks matter more here than broad product admiration.
