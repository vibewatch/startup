      - number: '1.5'
        title: Adverse signals, chronology conflicts, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most visible adverse signal in the current public record is inherited from the Zelus Analytics
              acquisition. CourtListener and PacerMonitor show that The Phillies sued Zelus Analytics in March 2025, and
              local reporting from On Pattison plus broader summaries from Yahoo Sports and Athlon describe allegations
              that Zelus and Teamworks were preparing to market analytics products the Phillies believed they had
              contracted to use exclusively. A judge denied the Phillies’ request for emergency injunctive relief, but
              the broader contract dispute continued. That does not prove a material financial liability, yet it is
              exactly the type of data-rights and customer-trust issue that becomes more meaningful when a software
              platform acquires specialized analytics assets. Separate from litigation, Teamworks’ public materials
              leave several basic diligence items unanswered: exact incorporation date, full board composition, current
              cap-table terms, the bridge from team/org counts to paying customers, and how much of recent growth is
              organic rather than acquired. There are also data consistency issues worth preserving rather than
              smoothing away, including 2004 versus 2006 founding references and 17-country versus 24-country footprint
              claims. None of those issues undermine the reality that Teamworks is a scaled and well-financed category
              leader. They do, however, limit how aggressively later chapters should assume precision where the public
              record is still mostly marketing, financing, and transaction disclosure rather than audited operating
              evidence.
            claimRefs:
              - CO038
              - CO039
              - CO040
              - CO041
              - CO042
              - CO044
              - CO045
