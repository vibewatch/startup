  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - Audited revenue miss
        - Revenue or ARR-equivalent below roughly $150M on a normalized basis
        - Current price would imply a multiple far above the public comp set without proof of exceptional economics
        - Reprice underwriting to the bear range or step away
      - - Preference stack overhang
        - Series F seniority, liquidation preferences, or secondary-heavy structure materially subordinating new money
        - The headline mark may not equal the economics available to a fresh investor
        - Require waterfall model before entry; otherwise treat the round as non-comparable
      - - Analytics contract risk worsens
        - Litigation expands, settlement is costly, or exclusivity disputes recur in acquired analytics products
        - AI / analytics premium depends on trust, data rights, and defensible customer contracts
        - Haircut premium assumptions and revisit integration thesis
      - - Wallet / GM adoption disappoints
        - Direct-pay and NIL workflow uptake is slow or attach rates remain immaterial
        - The collegiate tailwind is one of the few visible upside catalysts after the House changes
        - Remove payment-workflow upside from the bull case
      - - Public sports-tech multiples compress
        - Catapult-like premium drops materially and Genius / Sportradar de-rate further
        - A private mark above $1B becomes harder to defend without superior disclosed growth
        - Tighten entry range and require stronger private proof before investing
    notes: >-
      These are monitoring triggers for post-entry discipline and pre-entry diligence gates. They are designed to
      prevent a strong product story from overwhelming valuation discipline.
