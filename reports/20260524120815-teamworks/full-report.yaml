  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and why price sensitivity dominates the call
        blocks:
          - type: paragraph
            body: >-
              The long case for Teamworks is straightforward to articulate. Teamworks has assembled a broad vertical
              operating stack across Hub, Recruiting, AMS, Intelligence, Wallet, Academics, Influencer, and adjacent
              workflow tools, which is exactly the type of product breadth that can justify a premium multiple if
              customers truly buy multiple modules and renew them over time. Public contracts show that departments can
              spend well into six figures annually for a bundled Teamworks deployment, while the NCAA's post-House rules
              create more reporting, revenue-sharing, and payment complexity inside athletic departments. That
              combination means Teamworks is not just selling software seats; it may be selling workflow consolidation
              at a moment when schools and elite teams need fewer vendors and better data integrity. The bull case is
              therefore less about raw team-count marketing and more about whether Teamworks has become the system of
              record for operational, performance, and payment workflows across elite sports organizations.

              The anti-thesis is equally important because valuation is already non-trivial. Public evidence still does
              not disclose the revenue base, margin profile, net revenue retention, or cap-table terms that would let an
              outside investor test whether the >$1B mark is conservative, fair, or aggressive. Public comps such as
              Genius Sports and Sportradar disclose audited revenue and still trade closer to 2x-3x EV/revenue, while
              Catapult trades at a higher premium but does so with visible public-market marks and formal reporting.
              Teamworks also carries integration and contract-execution risk through the Zelus analytics dispute and the
              broader challenge of monetizing acquired products instead of merely assembling them. The recommendation
              therefore has to be explicitly price-sensitive: Teamworks may be strategically strong, but the current
              public record is not strong enough to support a buy at any price above the last disclosed private round
              without further diligence.
