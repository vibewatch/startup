      - number: '2.5'
        title: Valuation Relevance and Open Gaps
        blocks:
          - type: paragraph
            body: >-
              For valuation, the key question is not whether sports software is a large theme; it is which slice
              Teamworks can repeatedly monetize with attractive contract depth and cross-sell. The public record points
              to a narrower but more actionable SAM in elite sports organizations with operational complexity, enough
              budget concentration to justify integrated software, and new payment or governance burdens that make
              manual processes untenable. That includes major college athletic departments, pro clubs, and Olympic or
              NGB programs with distributed staff and athletes. What remains missing is a clean bridge from public
              category headlines to Teamworks-specific revenue pools. Public sources do not disclose live Wallet or GM
              customer counts, the distribution of average contract values by school tier, the percentage of schools
              that will fully opt into revenue sharing, or how much current spending is replacing point tools versus
              expanding overall software budget. Those gaps do not negate the opportunity, but they do argue for
              underwriting Teamworks against constrained elite-workflow spend rather than the full sports-analytics
              headline market.
            claimRefs:
              - CM042
              - CM043
              - CM044
              - CM045
              - CM049
