      - number: '3.4'
        title: Moat durability is strongest in workflow density, but intelligence expansion adds trust risk
        blocks:
          - type: paragraph
            body: >-
              The best-supported Teamworks moat is workflow density: one identity layer, connected products, and
              customer evidence that departments use Hub to tie together existing modules instead of keeping fragmented
              tools. That moat is real, but it is not invulnerable. Specialists still provide rational best-of-breed
              alternatives, especially where recruiting, video, athletic-training EMR, or human-performance teams want
              depth without a full-platform migration. Large adjacent data companies also matter because they have
              public scale and could move closer to team decision-support over time. The clearest adverse evidence is
              the Phillies dispute over Zelus/Titan exclusivity. Public reporting says the court denied emergency
              injunctive relief, yet the broader breach-of-contract fight continues and the allegations go directly to
              trust, exclusivity, and data-rights stewardship in Teamworks Intelligence. For diligence, that means
              Teamworks should be underwritten less as an unassailable monopoly and more as a broad suite whose
              defensibility depends on attach rates, integration depth, and clean governance of acquired intelligence
              assets.
