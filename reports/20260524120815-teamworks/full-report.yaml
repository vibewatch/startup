      - number: '8.2'
        title: Current valuation context and explicit price discipline
        blocks:
          - type: paragraph
            body: >-
              The best public valuation anchor remains the June 2025 Series F: Teamworks raised $235M at a pre-money
              valuation above $1B, and public coverage now points to roughly $400M of total funding since inception.
              That is enough to confirm that Teamworks has graduated from a niche workflow vendor into a scaled,
              institutionally financed private sports-tech platform. It is not enough, however, to validate the current
              price. The same public record that gives investors a headline valuation withholds the inputs that matter
              most for underwriting: revenue, gross margin, operating leverage, customer concentration, debt, and the
              liquidation waterfall. Public procurement evidence helps, because it proves Teamworks can land annualized
              contracts ranging from roughly $112k for a Hub-led deployment to $235k for a broader multi-module package.
              But those contracts do not solve the central problem: one department-level deal can span many teams and
              many modules, so the company's 6,500-team / 7,000-organization scale claims cannot be translated cleanly
              into ARR.

              That opacity drives the entry rule. If Teamworks deserves only the 2x-3x revenue multiples that public
              comps such as Genius Sports and Sportradar receive, then a >$1B valuation would require roughly
              $333M-$500M of revenue. If Teamworks deserves a more premium Catapult-like 5x-7x multiple because it is
              closer to a vertical operating system with sticky workflow ownership, the mark still implies roughly
              $143M-$200M of revenue. Public evidence does not tell the market which world is real. The right discipline
              is therefore not to accept the private mark at face value, but to insist on audited revenue, retention,
              and cap-table proof before treating the current price as more than a sponsor-backed reference point.
            claimRefs:
              - CV001
              - CV002
