  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Budget, compliance, litigation, and integration risks can compound into bookings, retention, and valuation
      pressure.
    approximationNotes: The edges are causal pathways inferred from the reviewed sources, not measured coefficients.
    data:
      nodes:
        - id: rules
          label: NCAA / House rule shifts
          type: risk
          detail: Payment and reporting rules remain newly operational.
        - id: budget
          label: School budget pressure
          type: risk
          detail: Revenue sharing adds material cost to athletic departments.
        - id: payments
          label: Wallet compliance load
          type: risk
          detail: Tax, withholding, and privacy workflows create execution burden.
        - id: litigation
          label: Zelus data-rights dispute
          type: risk
          detail: Customer-rights conflict can weaken analytics trust.
        - id: integration
          label: Analytics-stack integration
          type: risk
          detail: Recent acquisitions must operate as one platform.
        - id: bookings
          label: New bookings / expansion
          type: output
          detail: Budget scrutiny and procurement friction can slow sales.
        - id: retention
          label: Customer trust / retention
          type: output
          detail: Errors or rights disputes can raise hesitation to centralize workflows.
        - id: valuation
          label: Growth quality / valuation
          type: output
          detail: If bookings and retention weaken, platform upside compresses quickly.
      edges:
        - from: rules
          to: payments
          label: creates new workflow requirements
        - from: rules
          to: budget
          label: changes buyer economics
        - from: budget
          to: bookings
          label: raises procurement friction
        - from: payments
          to: retention
          label: errors hit trust
        - from: litigation
          to: retention
          label: rights disputes unsettle customers
        - from: integration
          to: retention
          label: poor coherence lowers confidence
        - from: integration
          to: bookings
          label: slows cross-sell
        - from: bookings
          to: valuation
          label: reduces growth confidence
        - from: retention
          to: valuation
          label: weakens quality of ARR
