  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape shape: Teamworks is competing against wedges, suites, and infrastructure layers'
        blocks:
          - type: paragraph
            body: >-
              Teamworks is no longer competing only against legacy scheduling tools or one direct clone. Its own product
              pages now describe an operating system that spans talent acquisition, daily operations, athlete
              management, performance, and intelligence. That breadth means the relevant landscape has to be split into
              classes: direct workflow wedges such as Front Rush in recruiting; performance and medical specialists such
              as Catapult, SportsWareOnLine, and CoachMePlus; adjacent athlete-monetization vendors such as Opendorse;
              and larger external-data and media-infrastructure companies such as Sportradar and Genius Sports.
              Status-quo substitutes also matter. The College of Charleston procurement record explicitly says athletics
              departments can remain stuck on multiple disconnected systems, while Teamworks argues that one identity
              layer, one hub, and shared calendars/tasks reduce that fragmentation. The key takeaway is that Teamworks’
              buyer is often not choosing between Teamworks and one perfect like-for-like rival. The real choice is
              between adopting one broader suite, staying multi-homed across specialists, or delaying migration
              altogether.
            claimRefs:
