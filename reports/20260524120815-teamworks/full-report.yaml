      - - Customer monetization
        - >-
          Count of paying departments, average ACV, multi-product attach rates, and share of entity counts that are full
          athletic departments
        - Team / organization tallies are not reliable revenue proxies without billing-unit disclosure
        - Revenue-operations export by segment and product
      - - Acquired analytics performance
