      - number: '8.5'
        title: Diligence blockers, exit readiness, and final recommendation
        blocks:
          - type: paragraph
            body: >-
              The decisive blockers are all products of private-company opacity. Public sources do not disclose audited
              revenue, gross margin, EBITDA, net revenue retention, cohort expansion, module attach rates, customer
              concentration, debt, or the preference stack created by the Series F. Those are not cosmetic omissions.
              They determine whether the >$1B mark is a disciplined private round, a sponsor-friendly marketing mark, or
              a price that only works because insiders hold better downside protection than a new investor would. The
              same problem affects exit readiness: Teamworks may well be strategically interesting to a buyer because it
              spans operations, recruiting, analytics, and payments, but the public record does not prove the type of
              audited scale and governance maturity that would normally justify broad IPO-style underwriting.

              That leaves a narrow but defensible conclusion. Teamworks deserves to stay on the buy list because the
              product breadth, contract evidence, and market tailwinds are real. It does not deserve a buy
              recommendation at the last disclosed price until management discloses enough financial and cap-table
              detail to bridge public evidence to the current valuation. The correct recommendation today is
              research-more / track: proceed only if diligence proves that Teamworks is already at least a high-end
              private vertical-SaaS revenue scale with clean renewal dynamics and investor terms that do not transfer
              hidden downside to new money. Without that proof, the company remains compelling while the entry remains
              under-justified.
