  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Teamworks should not be underwritten against a vague "all sports tech" market. The current official
              product set spans recruiting, operations, academics, athlete management, intelligence, and wallet-driven
              payment workflows, which together form a vertical operating system for elite sports organizations rather
              than a single analytics product. That means included spend in this chapter is software that coordinates
              athlete, staff, and department workflows: communication, scheduling, travel, recruiting, data
              centralization, academic support, decision-support analytics, and NIL or revenue-sharing administration.
              Excluded spend should include categories that appear in broad analyst reports but sit outside Teamworks'
              direct monetization path today, such as betting analytics, fan-engagement tooling, generic consumer team
              apps, and other media-adjacent categories. The status quo substitute is still fragmentation. Memphis
              explicitly described spreadsheets, emails, and manual workflows as inadequate once revenue sharing
              arrived, and Charleston's sole-source memo described why one department wanted a unified operational
              platform instead of disconnected systems. The market boundary therefore starts with workflow
              orchestration, not with every sports-data or sports-media budget line.
            claimRefs:
