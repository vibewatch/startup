      - number: '4.3'
        title: Teamworks increasingly sits between workflow SaaS, sports data infrastructure, and payment/compliance software
        blocks:
          - type: paragraph
            body: >-
              Teamworks’ product mix makes simplistic SaaS assumptions risky. Hub, Operations, Academics, Recruiting,
              and AMS read like familiar vertical-software modules whose economics should benefit from recurring
              contracts and workflow stickiness. But Intelligence explicitly markets predictive models, contract
              valuation, and sport-specific data science, while Wallet adds withholding calculations, W-8BEN collection,
              royalty-payment handling, and compliance safeguards for international athletes. Those capabilities may
              support premium pricing and larger budgets, yet they also imply specialized talent, support overhead,
              banking/compliance dependencies, and lower comparability to a pure seat-based workflow vendor. Public
              comps illustrate the spread. CompaniesMarketCap puts Sportradar at roughly $3.85 billion of market cap on
              about $1.55 billion of trailing revenue, while Catapult sits around $0.78 billion of market cap on about
              $0.11 billion of annual revenue. That yields a rough public market-cap-to- revenue anchor from about 2.5x
              to about 7.1x across relevant sports-technology businesses. Teamworks almost certainly lands somewhere on
              that wide spectrum rather than on a single clean software multiple. The problem is that no public
              Teamworks source discloses revenue, ARR, gross margin, services mix, or retention. The comp set is
              therefore useful for framing valuation possibilities and disclosure expectations, but not for confirming
              whether Teamworks’ >$1 billion private valuation is conservative or aggressive.
