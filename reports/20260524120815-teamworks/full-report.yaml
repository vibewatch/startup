  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: >-
          Revenue model breadth is real, and procurement documents prove Teamworks can sell enterprise bundles rather
          than only point products
        blocks:
          - type: paragraph
            body: >-
              Teamworks is no longer a single communications tool monetized through a flat subscription. Current
              official pages show a portfolio spanning Hub, Operations, Academics, Recruiting, Intelligence, AMS,
              Performance, GM, and Wallet, which means the economic model is best understood as modular vertical
              software with multiple expansion paths. The clearest pricing evidence comes from procurement rather than a
              public rate card. A Texas A&M contract shows an Elite Package covering Hub, Academics, Video, INFLCR
              Verified, IN+ Local Exchange, and Notemeal at a $225,000 annual list price, plus a $12,500 INFLCR Plus
              add-on, before discounting to a $235,000 annual total. The same document also discloses usage-style
              charges for extra message credits and additional two-way users. That is materially different from simple
              seat licensing: it suggests Teamworks can combine recurring platform subscriptions, optional module
              upsells, and metered extras inside one institutional agreement. Wallet and GM widen the model further.
              Wallet is framed as a digital banking and payment workflow for NIL, per diem, and revenue-share
              disbursements, while GM is positioned as a budgeting, scenario-analysis, and athlete-earnings platform.
              Those launches imply a future mix that could include payment orchestration, compliance-related service
              load, and higher-value decision-support software alongside classic workflow subscriptions. Public evidence
              is therefore good enough to describe the revenue architecture, but not to quantify revenue mix,
              recognition policy, or realized gross profit by module.
