companyProfile:
  summary: >
    Teamworks is a Durham-based vertical software company built around the idea that elite sports organizations should
    run personnel, operations, recruiting, performance, intelligence, and now athlete-finance workflows on one
    integrated operating system. The best-supported public origin story traces founder and CEO Zach Maurides back to
    Duke football in 2005-2006, where he saw fragmented communication and athlete-support workflows firsthand. Since
    then Teamworks has grown into a broad platform serving professional leagues, college athletic departments, and
    Olympic / governing-body customers. Its recent strategy is especially notable: capital raised from Delta-v and
    Dragoneer has financed an acquisition wave across recruiting, analytics, football data, hockey intelligence,
    video-first analysis, and athlete monitoring, pushing the company beyond workflow software toward a more ambitious
    AI-and-intelligence platform.
  founders:
    - name: Zach Maurides
      role: Founder & CEO
      background: >-
        Former Duke football player whose experience with fragmented athlete-support workflows seeded Teamworks'
        operating-system thesis.
      claimRefs:
        - CO002
        - CO003
        - CO013
    - name: Mitch Heath
      role: Co-Founder
      background: Publicly listed co-founder who provides continuity from the company’s early operating years.
      claimRefs:
        - CO014
  foundingLocation: Durham, North Carolina, USA
  headquarters: Durham, North Carolina, USA
  productSummary: >
    Teamworks sells a modular sports-technology platform spanning Hub, Operations, Recruiting, Academics, AMS /
    performance workflows, Intelligence, Wallet, and adjacent modules, then deepens product breadth through acquired
    assets such as Zelus Analytics, Telemetry Sports, Sportlogiq, Opteamal, and PFF Enterprise.
  customerFocus: >
    Professional sports teams and leagues, collegiate athletic departments, Olympic and national governing bodies, and
    adjacent elite-sport organizations that need integrated operational and performance software.
  businessModel: >
    Enterprise SaaS sold through annual institutional contracts, module cross-sells, usage-based overages, and emerging
    payment/compliance workflows such as Wallet and General Manager.
  stage: Growth-stage unicorn (post-Series F)
  fundingStatus: >
    Roughly $400M cumulative funding per the current About page, highlighted by a $235M Series F in June 2025 led by
    Dragoneer at a pre-money valuation above $1B.
