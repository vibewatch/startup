      - number: '1.2'
        title: Leadership bench, governance signals, and founder dependence
        blocks:
          - type: paragraph
            body: >-
              Teamworks’ official full-text About page exposes a compact but credible executive bench around founder and
              chief executive Zach Maurides. The current public roster lists co-founder Mitch Heath, CFO Kyle Charters,
              COO Anna Resman, CTO Reed Shaffner, chief data scientist Doug Fearing, chief strategy officer James
              Coffos, and executive vice president of sales Corey Richardson. The combination matters for diligence
              because it shows the company now presents itself as more than a founder-led communications tool vendor:
              finance, technology, sales, and data-science functions all have named executive owners. Teamworks’
              November 2021 leadership-update announcement also signals that the company deliberately professionalized
              its management layer well before the 2025-2026 AI acquisition wave, suggesting scale preparation rather
              than purely reactive hiring. Still, the public record is thin on board composition, committee structure,
              investor rights, and succession planning. Founder dependence remains material because Maurides is still
              both the clearest strategic voice and the public face attached to fundraising, M&A, and category
              positioning. Mitch Heath’s continuing public role as co-founder provides some continuity, but the
              governance picture remains materially less transparent than the company’s product and customer marketing.
              For later underwriting, the key question is not whether a management team exists — it clearly does — but
              how much decision-making, product vision, and key relationship management still concentrate in Maurides
              and a small leadership circle.
