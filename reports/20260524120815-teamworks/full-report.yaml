      - number: '3.2'
        title: 'Module-level overlap: specialists still own credible wedges in recruiting, performance, and intelligence'
        blocks:
          - type: paragraph
            body: >-
              At the workflow level, Teamworks’ breadth is genuine, but specialist alternatives remain credible because
              they sell depth where a staff can justify keeping a separate tool. Front Rush remains a real recruiting
              wedge in college sports because it talks directly to recruiting and roster management and discloses
              meaningful scale with more than 9,500 teams at 850-plus schools. Hudl pressures Teamworks from the
              game-preparation and video-analysis side, especially as Teamworks broadens through Telemetry and
              Intelligence. On the performance side, Catapult sells sports technology and analytics with public-company
              reporting discipline, while SportsWareOnLine remains tightly focused on athletic-training EMR and
              CoachMePlus keeps a lighter-weight human-performance and communication pitch. In intelligence, Sportradar
              and Genius Sports are not daily operations suites, but their scale, data infrastructure, and public
              disclosure make them credible adjacency threats if team decision-support converges further toward external
              data stacks. The implication is that Teamworks wins most cleanly when a buyer values cross-module workflow
              integration more than single-function depth.
