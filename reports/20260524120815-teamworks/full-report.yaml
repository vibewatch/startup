  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public maturity is strongest in the shared workflow core and thinner in newer AI modules, reliability evidence,
      and attach-rate proof.
    approximationNotes: Cells are qualitative judgments based on public evidence depth, not internal KPIs or roadmap commitments.
    data:
      columns:
        - Workflow maturity
        - Integration maturity
        - AI / data differentiation
        - Public customer proof
        - Diligence confidence
      rows:
        - label: Hub / shared operations core
          values:
            - label: high
              tone: positive
              detail: >-
                Hub and Operations surfaces are clearly marketed and customer procurement documents confirm operational
                use.
            - label: high
              tone: positive
              detail: Profiles, calendars, tasks, SSO, and app-switching are repeatedly documented.
            - label: medium
              tone: warning
              detail: The core is workflow-centric more than AI-centric.
            - label: high
              tone: positive
              detail: Charleston and Texas A&M provide customer-side proof of suite usage.
            - label: high
              tone: positive
              detail: Best-documented layer in the fetched pack.
        - label: AMS / performance data layer
          values:
            - label: high
              tone: positive
              detail: AMS and Smartabase continuity pages make the core role clear.
            - label: high
              tone: positive
              detail: Multiple public integration posts show upstream data aggregation.
            - label: medium
              tone: warning
              detail: Differentiation comes from integration more than proprietary model detail.
            - label: medium
              tone: warning
              detail: Public buyer proof is strong but mostly marketing-driven.
            - label: medium-high
              tone: positive
              detail: Architecture is credible, but implementation depth is still private.
        - label: Recruiting / compliance workflows
          values:
            - label: high
              tone: positive
              detail: The recruiting surface and ARMS/Hub workflow steps are public and concrete.
            - label: high
              tone: positive
              detail: Hourly sync, one login, and Hub task routing show genuine workflow stitching.
            - label: low-medium
              tone: warning
              detail: This layer is more process automation than AI today.
            - label: medium
              tone: warning
              detail: Strong product evidence but less customer-side adoption data.
            - label: medium-high
              tone: positive
              detail: Integration direction is clear even if module attach data is absent.
        - label: Intelligence
          values:
            - label: medium
              tone: warning
              detail: Use cases are clear, but day-to-day operator workflows are less transparent than Hub or AMS.
            - label: medium
              tone: warning
              detail: Acquisition links are visible, but one unified UI is only partially public.
            - label: high
              tone: positive
              detail: Machine learning, predictive models, and tracking-data inputs are central to positioning.
            - label: medium
              tone: warning
              detail: Public references skew to marquee sports and Teamworks-authored materials.
            - label: medium
              tone: warning
              detail: Compelling roadmap, but deeper customer proof is still needed.
        - label: General Manager
          values:
            - label: medium
              tone: warning
              detail: Core workflows are intelligible, but the product is newer and still expanding.
            - label: medium
              tone: warning
              detail: Compliance and Intelligence links are described, with football metrics newly added.
            - label: medium-high
              tone: positive
              detail: PFF and Intelligence integration clearly improve data differentiation.
            - label: low-medium
              tone: warning
              detail: Public customer adoption evidence is still thin in the fetched pack.
            - label: medium-low
              tone: warning
              detail: Needs more deployment, uptime, and attach-rate proof.
        - label: Trust / support layer
          values:
            - label: medium
              tone: warning
              detail: Privacy and help surfaces exist but not a full public trust center.
            - label: medium
              tone: warning
              detail: SSO and public support entry points are visible.
            - label: low
              tone: warning
              detail: This layer is about governance, not differentiation.
            - label: medium
              tone: warning
              detail: Procurement docs help, but public SLA/certification evidence is missing.
            - label: medium-low
              tone: warning
              detail: Adequate for initial diligence, not for final operational underwriting.
    claimRefs:
