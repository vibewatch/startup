  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对判断的影响
      - 具体尽调路径
    rows:
      - - 模块级 ARR 和收入结构
        - 没有它，估值和收入质量分析大多只能停留在叙事层面
        - 索取按模块、细分市场、地域和被收购业务拆分的 ARR 桥接
      - - 毛利率和服务结构
        - 无法判断支持、分析和支付工作流是否稀释软件经济性
        - 索取按产品族划分的毛利率，以及实施和支持收入 vs. 成本
      - - CAC、回本周期和销售产能
        - 企业定价证据无法转换为销售效率
        - 按细分市场索取 CAC、回本周期、配额达成率、管道转化率和销售周期数据
      - - NRR、总留存和客户集中度
        - 高切换成本看起来合理，但缺少队列数据无法证明
        - 索取队列留存、集中度明细、头部客户 ARR 和续约日历
      - - 现金、烧钱速度、现金跑道、债务和或有对价
        - 仅凭融资历史无法评估资本充足性
        - 索取最新资产负债表、债务明细、或有对价和现金跑道模型
      - - Wallet 和 GM 支付单位经济性
        - 最新产品可能具备战略重要性，但财务上不透明
        - 索取支付量、抽佣率、银行 / 处理商费用、损失事件和合规支持成本
    notes: 这些是影响最大的披露缺口，仍然阻碍可靠判断收入质量、利润率路径和资本充足性。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Rows enumerate the main financial disclosure gaps surfaced by all reviewed pricing, funding, procurement,
        market, and adverse sources used in this chapter.
    claimRefs:
      - CI048
      - CI049
      - CI052
      - CI055
      - CI056
  - id: TI006
    title: 基准可比公司和市场锚点
    columns:
      - 基准
      - 公开规模标记
      - 公开估值 / 融资标记
      - 隐含倍数或护栏
      - 对 Teamworks 的含义
    rows:
      - - Teamworks（私有）
        - 无公开收入；采购案例显示大学客户年度定价代理约 0.112M 至 0.235M
        - 投前估值高于 1000M；累计融资约 400M
        - 估值分母缺失
        - 私有市场估值可见，但收入质量和规模不可见
      - - Sportradar
        - TTM 收入约 1.55B
        - 2026 年 5 月市值约 3.85B
        - 市值 / 收入约 2.5x
        - 大型上市数据与博彩基础设施可比公司，构成本次获取公开倍数区间的低端
      - - Catapult
        - 2025 年收入约 0.11B
        - 2026 年 5 月市值约 0.78B
        - 市值 / 收入约 7.1x
        - 规模较小的上市运动表现软件可比公司，给出高得多的倍数锚点
      - - Genius Sports
        - 2025 年 Form 20-F 已提交，包含完整经审计财务报表；覆盖 150 个国家的 1000 多家体育组织
        - 获取资料包确认公开文件可用，而不是给出干净的数字倍数
        - 披露基准，不是本资料包解析出的倍数
        - 展示投资者可从规模化上市体育数据同业那里期待的披露标准
      - - 体育分析市场
        - 2025 年 2.29B，2030 年增至 4.75B
        - 15.7% CAGR
        - TAM 正在快速扩张
        - 支撑 Intelligence 和分析驱动增购的战略逻辑
      - - NIL / 收入分成工作流预算
        - 2.75B NIL 市场，以及每校每年 20.5M 直接福利上限
        - 政策驱动的机构支付资金池
        - 可触达预算很大，但依赖监管执行
        - 支撑 GM 和 Wallet 需求，同时提高政策敏感性
    notes: 可比行混合了上市公司市场数据和终端市场规模标记。它们框定潜在经济性和估值逻辑，但不能替代 Teamworks 的收入披露。
