      - number: '8.4'
        title: 乐观、基准与悲观情景及明确触发器
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 Teamworks 证明，操作系统叙事的变现速度快于当前公开证据。承销这种结果，就要假设 Teamworks 已经进入约 $200M+ 的收入等价规模，Wallet 和 GM 拿下 House
              后付款 / 合规工作流的有意义份额，且 Intelligence / Zelus / PFF 产品栈成为耐久的溢价分析层，而不是一项整合工程。在这个世界里，到 2028 年公司有望支撑 $1.8B-$2.4B
              估值，尤其是在公开体育科技倍数稳定、Teamworks 能展示强留存和多产品渗透的情况下。

              基准情景保守得多，也是今天只看公开材料时的默认选择。它假设 Teamworks 真实、有规模、战略位置好，但尚未公开证明自己足以拿到激进溢价。如果经审计收入落在约 $150M-$200M
              区间，如果全产品栈附加率参差不齐，且公开市场倍数维持当前范围，那么当下 >$1B 标记只能解释为大致合理，而不是明显有吸引力。悲观情景会在几种情况下出现：收入显著低于 Catapult
              隐含门槛，诉讼或客户保密纠纷拖慢分析产品采用，或 F 轮优先股堆叠严重压低新进入者顺位。在那种结果里，Teamworks
              仍可能是一家好公司，却不是一个好价格；这正是为什么否决标准和尽调问题在这里比泛泛欣赏产品更重要。
