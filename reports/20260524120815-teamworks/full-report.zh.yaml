      - number: '2.5'
        title: 估值相关性与开放缺口
        blocks:
          - type: paragraph
            body: >-
              估值的核心问题不是体育软件是不是一个大主题，而是 Teamworks 能以有吸引力的合同深度和交叉销售，反复变现哪一块。公开记录指向一个更窄但更可执行的 SAM：
              运营复杂度高、预算集中度足以支撑集成软件、且新的支付或治理负担让手工流程难以为继的精英体育组织。这包括主要大学体育部门、职业俱乐部， 以及拥有分布式员工和运动员的奥运或 NGB 项目。缺口在于，公开品类标题与
              Teamworks 特定收入池之间仍缺少干净桥接。公开来源没有披露 Wallet 或 GM
              的实时客户数、按学校层级划分的平均合同价值分布、会全面选择收入分享的学校比例，或当前支出有多少是在替代点状工具、多少是在扩大整体软件预算。 这些缺口不否定机会，但说明承销 Teamworks
              应基于受约束的精英工作流支出，而不是完整体育分析大盘。
