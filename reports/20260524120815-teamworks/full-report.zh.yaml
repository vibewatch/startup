      - number: '5.3'
        title: AI、分析与决策支持资产
        blocks:
          - type: paragraph
            body: >-
              最重要的产品扩张故事，是 Teamworks 从工作流软件走向数据和决策支持。Intelligence 围绕机器学习和预测模型营销，Recruiting 发布也指出，许多大学项目没有内部工程能力，
              无法独自把现代球员追踪和逐回合数据落地到运营中。GM 把这一逻辑延伸到预算和阵容建设：它集中运动员收入数据，将其连接到 Compliance 和 Intelligence， 并且现在把 Player
              Impact、Snap Count、Play Speed、Change of Direction 等橄榄球指标直接放进档案。收购轨迹给这一策略提供了实体支撑。 Zelus 带来 Data Engine 和
              Titan Intelligence；Telemetry 增加教练工作流和与视觉数据联动的橄榄球工具；Sportlogiq 增加自动化追踪和研究深度； PFF 增加橄榄球数据；Opteamal
              扩展了欧洲足球的运动员监测覆盖。结果还不是一个已在公开证据中完全跑通的统一分析栈，但资产地图真实存在，而且明显宽于关于 AI 的简单营销文案。
