    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑，以及价格敏感性为何主导判断
        blocks:
          - type: paragraph
            body: >-
              Teamworks 的做多逻辑并不难讲清。Teamworks 已经围绕 Hub、Recruiting、AMS、Intelligence、Wallet、Academics、Influencer
              和相邻工作流工具，拼出一套宽的垂直运营栈；如果客户真的购买多个模块并长期续约，这正是能支撑溢价倍数的产品宽度。公开合同显示，部门级客户可以为捆绑式 Teamworks 部署每年花到六位数；NCAA 的 House
              后规则又在体育部门内部制造更多报告、收入分享和付款复杂性。两者结合意味着，Teamworks
              卖的不只是软件席位；在学校和精英球队需要更少供应商、更好数据完整性的时点，它可能在卖工作流整合。因此，乐观情景不应围绕原始球队数量营销，而应围绕 Teamworks
              是否已经成为精英体育组织中运营、表现和付款工作流的记录系统。

              反向逻辑同样重要，因为估值已经不低。公开证据仍未披露收入基数、利润率结构、净收入留存或股权结构条款，外部投资人因此无法检验 >$1B 标记是保守、合理还是激进。Genius Sports 和 Sportradar
              等公开可比公司披露经审计收入，但交易倍数仍接近 2x-3x EV/revenue；Catapult 享有更高溢价，但它有可见的公开市场标记和正式报告。Teamworks 还通过 Zelus
              分析纠纷和更广泛的收购产品变现挑战，承担整合与合同执行风险。因此，建议必须明确带有价格敏感性：Teamworks
              可能具备战略强度，但在没有进一步尽调之前，当前公开材料不足以支持在最后披露私募轮以上任何价格给出买入。
