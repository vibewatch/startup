companyProfile:
  summary: >
    Teamworks 是一家总部在 Durham 的垂直软件公司，核心判断是：精英体育组织应把人员、运营、招聘、表现、智能， 以及现在的运动员财务工作流，放到一套集成操作系统上运转。公开证据支撑最强的起源故事，把创始人兼 CEO
    Zach Maurides 追溯到 2005-2006 年的 Duke 橄榄球经历；他在那里亲眼看到沟通和运动员支持工作流的碎片化。此后， Teamworks 已成长为一个宽平台，服务职业联盟、大学体育部门以及奥运 /
    管理机构客户。其近期策略尤其值得关注： Delta-v 和 Dragoneer 的融资推动了一轮收购，覆盖招聘、分析、橄榄球数据、冰球智能、视频优先分析和运动员监测， 把公司从工作流软件推向更有野心的 AI 与数据智能平台。
