      - - Genius Sports
        - $1.43B 市值；$0.66B 收入
        - 收入约 2x；EV/收入约 1.8x
        - 显示一家有经审计报告的大型公开体育科技平台，在当前市场能拿到什么估值
        - 产品组合更偏官方数据、博彩和媒体，而不是球队工作流软件
      - - Sportradar
        - $3.85B 市值；$1.55B 收入
        - EV/收入约 2.3x
        - 大型体育数据可比公司，EBITDA 为正，且有公开 SEC 披露
        - 规模大得多，博彩 / 媒体暴露也高于 Teamworks
      - - Texas A&M Teamworks 合同
        - 第三年年化 $235k
        - 部门级 ACV 锚点
        - 证明宽 Teamworks 套餐能在机构层面变现出有意义的 ACV
        - 单一合同不能外推为全公司 ARR，因为一所学校覆盖许多球队和模块
      - - College of Charleston Hub 备忘录
        - 四年 $446.8k
        - Hub 主导锚点，年化约 $112k
        - 显示更窄的 Teamworks 部署也能拿到六位数机构支出
        - 单一来源理由无法揭示续约、使用强度或完整竞争定价背景
    notes: 公开市场数据有助于框定可支撑倍数；公开采购证据有助于框定每个机构账户的变现能力。两者合在一起，支撑的是估值区间，而不是单一精确公允价值。
