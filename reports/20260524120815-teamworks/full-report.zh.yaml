        - 显示 2025 年独角兽轮之前已有融资支持
        - 提供 Series E 到 Series F 期间剩余资金和烧钱速度
      - - 已披露资金用途
        - AI 驱动创新、M&A、新区域和精英人类表现扩张
        - 中
        - 资金用途指引提示未来现金需求和整合支出
        - 提供董事会批准的资金用途计划和收购预算
      - - 账面现金
        - 'null'
        - 低
        - 缺少现金和受限现金明细，无法评估现金跑道
        - 提供最新现金、受限现金和短期投资
      - - 月度烧钱 / 现金跑道
        - 'null'
        - 低
        - 资本是否充足取决于烧钱速度相对增长和收购计划的水平
        - 提供过去 12 个月烧钱速度，以及基准 / 下行情景现金跑道假设
      - - 债务 / 项目融资 / 或有对价
        - 'null'
        - 低
        - 杠杆、卖方票据和或有对价可能显著改变风险
        - 提供循环信贷、定期债务、卖方票据、或有对价和租赁义务
      - - 法律 / 整合或有事项
        - Zelus 诉讼仍在继续；收购相关义务未公开量化
        - 中
        - 争议、准备金或整合不达预期可能引发意外现金需求
        - 提供诉讼准备金、赔偿安排、或有负债和收购留置款
    notes: 融资支持强，资本充足性方向上为正；但多个资产负债表字段仍未披露，阻碍真正判断现金跑道或杠杆。
