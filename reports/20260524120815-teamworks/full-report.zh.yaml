        title: 可投资姿态取决于可观察触发器，而不是泛泛品类乐观
        blocks:
          - type: paragraph
            body: >-
              承销 Teamworks 的正确方法，是盯住外部压力与内部复杂性交汇的节点。如果大学项目继续选择加入收入分享，但体育部门出现赤字上升、采购放缓或更依赖赞助补缺，公司仍可能赢得
              logo，同时面对更艰难的预算谈判。如果 Wallet 继续扩张，尽调应寻找付款错误、预扣例外、投诉量，以及隐私或安全保证在政策语言背后的深度。如果 Phillies-Zelus
              纠纷产生不利裁决、限制性和解条款，或在证据开示中暴露更广泛的客户权利紧张关系，就应立刻下调分析上行叙事。近期增长绑定收购来的分析资产，因此迁移里程碑、交叉销售证据和平台理顺，比头条交易数量更重要。下方否决标准因此聚焦管理层用话术消解不了的事件：客户预算压力、合规失败、诉讼受挫、整合失误，以及任何显示创始人中心化执行从优势变成瓶颈的迹象。公开证据足够现在给这些风险排序，但还不足以在没有更深入客户、法律和系统尽调的情况下清除它们。
