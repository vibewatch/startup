  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Teamworks 不应按一个模糊的「全部体育科技」市场来承销。当前官方产品集覆盖 Recruiting、Operations、Academics、运动员管理、Intelligence， 以及 Wallet
              驱动的支付工作流；这些加起来是服务精英体育组织的垂直操作系统，而不是单一分析产品。因此，本章纳入的支出，是协调运动员、员工和部门工作流的软件： 沟通、排程、差旅、招聘、数据集中、学业支持、决策支持分析，以及
              NIL 或收入分享管理。应排除的支出包括宽泛分析师报告中会出现、但目前不在 Teamworks 直接变现路径上的类别， 例如博彩分析、粉丝互动工具、通用消费者球队
              App，以及其他媒体相邻类别。现状替代方案仍是碎片化。Memphis 明确称，收入分享到来后，电子表格、邮件和手工工作流已经不够用； Charleston
              的单一来源备忘录也解释了为什么一个部门想要统一运营平台，而不是一堆割裂系统。因此，市场边界从工作流编排开始，而不是从每一条体育数据或体育媒体预算线开始。
