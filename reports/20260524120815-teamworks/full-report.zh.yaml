      - number: '1.2'
        title: 领导层厚度、治理信号与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              Teamworks 官方全文 About 页面呈现出一个围绕创始人兼 CEO Zach Maurides 的精简但可信的高管班子。当前公开名单列有联合创始人 Mitch Heath、CFO Kyle
              Charters、COO Anna Resman、CTO Reed Shaffner、首席数据科学家 Doug Fearing、首席战略官 James Coffos，以及销售执行副总裁 Corey
              Richardson。这一组合对尽调有意义，因为公司现在呈现的已不只是创始人驱动的沟通工具供应商： 财务、技术、销售和数据科学都有具名高管负责。Teamworks 2021 年 11
              月领导层更新公告也显示，公司早在 2025-2026 年 AI 收购潮前就有意专业化管理层，更像是在为规模化做准备，而不是被动补人。不过，公开记录对董事会构成、委员会架构、投资人权利和继任计划披露很薄。
              创始人依赖仍然关键，因为 Maurides 仍是最清晰的战略声音，也是融资、M&A 和品类定位绑定的公众面孔。Mitch Heath 继续以联合创始人身份公开露出，
              提供了一定连续性，但治理图谱仍比产品和客户营销透明度低得多。后续承销的核心问题不是有没有管理团队——显然有——而是决策、产品愿景和关键关系管理还有多少集中在 Maurides 和一个小型领导圈。
