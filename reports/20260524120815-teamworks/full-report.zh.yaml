            body: >-
              公开材料反复指向一套围绕统一身份、导航、档案、日历和任务搭建的共享架构。OSS 集成页明确称，Teamworks 已在产品间集成这些共享组件；Hub 和 OSS 材料合起来显示出一个 Teamworks
              ID、共享导航，以及面向客户的档案和日历数据 API。这一模式随后出现在具体工作流集成中。Recruiting 可以把招募对象转入 Hub。ARMS 和 Whistle
              增加了每小时同步和统一招聘看板。Hub-ARMS Tasks 把合规动作带进同一个移动端界面。2024 年集成浪潮进一步加深了这一模式：一个登录、应用切换、App 内 CARA 日志，以及在 Hub
              中创建招募对象。表现侧，Teamworks 称 Nutrition 通过开放 API 接入 AMS，而 Smartabase 或 AMS 可以聚合 GPS、测力台、动作捕捉、 S&C
              和营养数据等上游馈送。合起来看，公开架构不像单体，更像是位于专业工作流模块和外部数据输入之上的共享控制平面。
