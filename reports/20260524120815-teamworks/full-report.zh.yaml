      - number: '5.1'
        title: 模块地图与客户工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              从抓取到的 Teamworks 材料包看，最强的产品层结论是：公司已不再销售单一沟通应用。当前产品页面把平台分成 Hub、Operations、Performance、Recruiting 和
              Intelligence；较早但仍有用的产品拆解材料，则展示 ARMS、Smartabase、Notemeal、INFLCR、Pulse、Retain 等旧品牌如何被纳入更宽的操作系统叙事。 Hub
              仍是最清晰的锚点：Teamworks 把它描述为统一指挥中心，覆盖名单、日历、消息、差旅、文件和其他日常协调工作流。围绕这一核心，Operations 处理物流和库存， AMS
              充当表现数据层，Recruiting 管理评估和入队，Intelligence 加上 GM 把技术栈延伸到决策支持。Charleston 和 Texas A&M 的客户采购证据让这一点不只是品牌包装。
              这些文件显示，真实买方把 Teamworks 当作一个多模块套件，能够集中运营工作流并打包相邻产品，而不是一个狭窄点状方案。
