      - number: '7.2'
        title: 付款、隐私与数据权利敞口已经进入产品表面
        blocks:
          - type: paragraph
            body: >-
              Teamworks 的风险表面已经比传统通讯或排程软件更宽。Wallet 把公司推入付款时点、预扣、IRS
              汇缴和国际运动员税务工作流；隐私政策保留了从学校、管理机构、合作伙伴和数据提供方收集数据、合并数据集做分析，并在法律程序或收购中转移数据的广泛权利；Phillies-Zelus
              纠纷也显示，分析产品可以很快卷入独占性、IP 和客户信任争议。Wallet 材料尤其重要，因为它显示 Teamworks 承担的运营步骤更接近受监管金融管道，而不是纯工作流自动化：W-8BEN
              收集、预扣计算、1042-S 签发，以及机构指定 Teamworks 为 withholding agent 时的汇缴。与此同时，隐私政策公开预设了分处理方使用、业务伙伴共享、FERPA 处理、CPRA
              权利，以及出售或合并中的数据转移。这意味着每个新产品和每次收购，都会围绕访问控制、数据来源和机构同意增加治理工作。Zelus
              案是该风险最清楚的反向表现。即便没有禁令，围绕谁能向竞争对手商业化分析组件的实时纠纷，也正是会动摇客户的那类问题：客户正在决定是否把名单估值和合同策略集中到 Teamworks 里。
