  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 分层、买方地图与安装基数形态
        blocks:
          - type: paragraph
            body: >-
              Teamworks 公开客户记录明显集中在精英体育机构，而不是大众市场球队或消费者体育应用。买方 / 付款方很少与终端用户是同一个人：体育总监、运营高管、财务负责人和 NGB
              管理者似乎负责采购；运动员、教练、医疗人员、联盟官员，甚至家属才是日常用户。产品足迹也按待办工作清晰分层。Hub 和 Operations 资料把 Teamworks
              定位为名单、日历、差旅、消息和文件的记录系统；AMS 出现在需要集中表现和医疗数据的场景；Memphis 带来更新的 NIL
              与收入分享买方；公开采购材料显示，大学体育买方可以采购宽产品包，而不是单一功能。规模口径足够重要：Teamworks 称 2025 年服务超过 6500 支精英球队，2026 年 3 月达到超过 7000
              个组织；其融资材料还声称在 NFL、NCAA Division
              I、奥林匹克联合会和其他主要联盟有深度渗透。关键细节在于，这些是安装基数声明，不是收入质量披露。它们证明触达和品类相关性，却不能单独证明整个足迹都转化成耐久的多产品 ARR。
