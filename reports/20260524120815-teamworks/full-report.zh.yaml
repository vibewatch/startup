  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 大学需求顺风真实存在，但 NCAA 预算压力仍可能挤压支出
        blocks:
          - type: paragraph
            body: >-
              Teamworks 当前最紧迫的增长楔子，已经直接绑在美国体育里财务压力最大的买方群体上。公司称 General Manager 服务 NCAA Division I 院校的 98%，Wallet 也已获得
              700 多所 NCAA 院校信任，这意味着 Teamworks 不只是贴近 House 时代转型，而是直接向这场转型销售。NCAA 规则变化现在允许选择加入的学校向学生运动员提供最高 $20.5 million
              的直接经济利益，并要求技术平台支持付款监控和第三方 NIL 协议报告。这给 GM、Wallet 和相邻合规工作流带来明显产品需求。风险在于，描述机会的同一批来源也在描述买方压力。University
              Business、OVG、SportsRecruits、Opendorse 和 RallyFuel 都呈现出一个市场：学校正在增加新的运动员付款义务，寻找赞助和辅助收入，同时还要应对持续的规则不确定性。对
              Teamworks 来说，这可能产生双速客户结果：市场头部对规划和付款软件的紧迫性更强，但 Division I 其余部分采购更慢、预算更紧、ROI
              审查更重。如果收入分享成本被视为非可自由支配，而软件预算仍要竞争，大学需求可能保持庞大，但会更周期性、更具政治可见度。
