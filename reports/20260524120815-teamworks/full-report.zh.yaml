      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是多线程的。招聘团队需要潜在球员管线和沟通；运营团队需要日历、差旅、消息和文件；学业团队需要预约和学习计划工作流；表现团队需要集中的运动员数据； 财务、合规和体育部门领导层如今也越来越多承担围绕 NIL
              与收入分享的支付和治理决策。公开采购证据支撑这种跨职能模式。Texas A&M 购买了一个打包 Teamworks 套餐，覆盖 Hub、Academics、Video、INFLCR 和营养支持，折后年费
              $235,000，显示预算归属可以同时由多个部门痛点支撑。 Charleston 的备忘录则把 Hub 描述为专有重心，因为它已经连接了 Compliance 和 Academics。Teamworks
              自己页面也强化了同样的先切入、再扩张模式： Recruiting 集中潜在球员数据，Hub 成为共享运营层，AMS 集中运动员表现数据，Academics 增加支持工作流，Intelligence
              增加预测型决策支持， Wallet 增加支付管理。换句话说，可能的采用路径是：先用楔子切入，再成为记录系统，之后交叉销售到风险更高的数据或支付工作流。
