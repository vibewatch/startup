          detail: 公共采购文件证明 ACV 有分量，但样本很小
          claimRefs:
            - CV005
            - CV006
            - CV026
        - label: 公开价格支撑
          value: 4
          unit: /10
          detail: 只有公司未公开收入规模已经很高，当前估值才说得通
          claimRefs:
            - CV022
            - CV023
            - CV039
        - label: 披露质量
          value: 2
          unit: /10
          detail: 收入、利润率、NRR、债务和优先权数据仍未公开
          claimRefs:
            - CV024
            - CV025
            - CV037
        - label: 退出准备度
          value: 4
          unit: /10
          detail: 战略选择权存在，但 IPO 式证据仍然缺位
          claimRefs:
            - CV037
            - CV042
