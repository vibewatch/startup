      - number: '8.3'
        title: 可比公司组，以及公开市场对可支撑估值的启示
        blocks:
          - type: paragraph
            body: >-
              可比公司组必须同时完成两件事。第一，要用真正披露收入和市值的公开体育科技运营商给 Teamworks 夹出范围。第二，要纳入 Teamworks 自身公开合同中的定价证据，因为 Teamworks
              是私营公司，公开市场数据本身无法告诉投资人，其工作流栈可能已经产生多少收入。Catapult 是 Teamworks 表现和运营角度最干净的溢价可比：它直接向球队销售体育表现技术，当前收入倍数约
              5x-7x，取决于使用 Yahoo 的 EV/revenue，还是 CompaniesMarketCap 的市值口径。Genius Sports 和 Sportradar
              在产品组合上可比性较弱，但它们重要，因为二者都是有规模的公开体育数据平台，且有经审计报告；它们当前交易倍数都更接近 2x-3x 收入。这个区间就是 Teamworks 的核心估值框架。

              公开 Teamworks 合同则提供缺失的变现锚点。Texas A&M 的 Elite 包到第三年达到每年 $235k，College of Charleston 的 Hub-only
              单一来源备忘录则隐含更窄部署每年约 $112k。这些数据点还不足以搭建精确 ARR 模型，但足以证明 Teamworks 能在机构级 ACV 上实现有意义变现。关键限制在于，公开材料没有说明多少客户像 Texas
              A&M、多少像 Charleston，实体数量中多少代表完整体育部门、多少代表单支球队，也没有说明分析和 Wallet 产品有多少附加率。因此，可比分析给出的是估值区间，而不是单一公允价值答案。
