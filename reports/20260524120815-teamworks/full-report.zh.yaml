    title: 竞争对手画像表
    columns:
      - 竞争对手或替代方案
      - 类别
      - 规模或融资信号
      - 目标细分
      - 差异化
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the major elite-sports workflow vendors and substitutes evidenced in the 2026 fetched source pack; it
        excludes niche private tools without a current fetched public page or customer proof.
    rows:
      - - Teamworks
        - 集成套件
        - 2025 年估值 >$1B；公开合同显示部门支出达六位数
        - 顶级职业、大学、奥运和运动表现团队
        - 用一个“操作系统”叙事覆盖招募、运营、运动表现和情报
        - 运营指标、附加率和实际定价仍未公开
      - - Front Rush
        - 招募 / 名册专精厂商
        - 850+ 所学校的 9,500+ 支大学队伍
        - 大学教练团队
        - 深耕招募和名册工作流，并有打包产品
        - 公开证据集中在招募，而不是更广的运动表现或情报
      - - Hudl
        - 视频和数据专精厂商
        - 数百万运动员、教练和球迷
        - 优先考虑视频采集、分析和 AI 辅助复盘的团队
        - 视频、直播和运动表现分析品牌很强
        - 抓取证据中，运营、合规和运动员管理深度较弱
      - - Catapult
        - 运动表现技术专精厂商
        - 上市公司报告，加上约 $0.11B TTM 收入
        - 多运动项目的高表现团队
        - 以分析为核心的运动表现定位，并有投资级披露
        - 抓取页面未显示透明公开定价，也未显示广泛运营套件范围
      - - SportsWareOnLine
        - 运动防护 EMR 专精厂商
        - 公司声称在运动防护文档品类领先
        - 运动防护师和医疗团队
        - 聚焦伤病文档和报告工作流
        - 范围窄于完整的运营 + 运动表现套件
      - - CoachMePlus
        - 人体表现单点方案
        - 官网提供免费试用，但未广泛披露规模
        - 教练和运动表现从业者
        - 评估门槛低，工作流围绕沟通和运动表现
        - 范围似乎比企业套件买方所需更窄、更轻
      - - Opendorse
        - 邻近 NIL 平台
        - 年度 NIL 报告，以及面向大学、collective 和品牌的工作流定位
        - 学生运动员商业化利益相关方
        - NIL 市场和运动员收入邻近能力强
        - 不能替代招募、Hub 或日常运动表现工作流
      - - Sportradar
        - 外部数据 / 媒体 / 博彩基础设施
        - 公开申报文件，加上约 $1.55B TTM 收入
        - 联赛、博彩平台、媒体和数据买方
        - 庞大的外部数据和版权基础设施
        - 在团队日常运营工作流中的嵌入较浅
      - - Genius Sports
        - 外部数据 / 分析 / 转播基础设施
        - 150+ 个国家、1,000+ 个组织，约 $0.66B TTM 收入
        - 联赛、媒体、博彩和数据买方
        - 全球数据、分析和转播足迹
        - 直接重叠主要在情报，而非 Hub 或招募
      - - 内部自建 / 碎片化工具
        - 现状替代方案
        - 不需要外部资金；通常已经在用
        - 预算受限或抗拒变化的部门
        - 避免整个平台迁移，保留既有习惯
        - 造成数据割裂、行政工作重复，共享上下文更弱
    notes: 这是 2026 年抓取 source pack 中，在精英体育运营、招募、运动表现和情报工作流里可见的最相关公开竞争对手和替代方案； 名单并不完整。
