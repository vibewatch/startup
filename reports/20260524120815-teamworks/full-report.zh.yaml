        title: 工作流密度上的护城河最强，但 Intelligence 扩张增加信任风险
        blocks:
          - type: paragraph
            body: >-
              Teamworks 支撑最充分的护城河是工作流密度：一个身份层、相连产品，以及客户证据显示，部门用 Hub 把既有模块绑在一起，而不是继续保留碎片化工具。
              这条护城河真实存在，但不是攻不破。专业厂商仍提供理性的单点最优替代，尤其是在招聘、视频、运动训练 EMR 或人体表现团队想要深度、但不想全面迁移平台的地方。
              大型相邻数据公司也重要，因为它们已有公开规模，并可能随着时间推近球队决策支持。最清晰的反向证据，是 Phillies 关于 Zelus / Titan 独家性的争议。
              公开报道称，法院驳回了紧急禁令救济，但更广泛的违约之争仍在继续，且指控直指 Teamworks Intelligence 中的信任、独家性和数据权利治理。 对尽调来说，这意味着承销 Teamworks
              时，不应把它看作不可撼动的垄断，而应看作一个宽套件；其防御力取决于模块附加率、集成深度，以及对收购 Intelligence 资产的干净治理。
