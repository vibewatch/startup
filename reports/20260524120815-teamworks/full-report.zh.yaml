      - number: '3.3'
        title: 定价、包装和切换成本动态有利于套件，但公开基准仍难建立
        blocks:
          - type: paragraph
            body: >-
              这个品类的公开定价透明度很弱。抓取到的大多数同业页面都在谈能力、套餐或联系销售流程，而不披露标价。Teamworks 是这组来源中少数能看到真实合同证据的供应商之一。 Texas A&M 协议显示，折后
              Teamworks 年度套餐为 $235,000，并带有按用量收取超额费用的机制；College of Charleston 的单一来源理由则显示了一项四年期 Hub 承诺，并明确把采购与已安装的
              Compliance 和 Academics 模块挂钩。这对竞争有意义，因为它把 Teamworks 的集成故事从官网话术变成了更具体的事实：
              一旦一个部门在共享身份、共享日历和相连运营模块上标准化，替换会更难，采购也会更具战略性。与此同时，公开同业定价普遍缺失，投资人仍无法仅凭公开证据判断 Teamworks
              是靠高价套装价值取胜、靠折扣取胜，还是只是卖进了比点状方案供应商目标客户预算更高的体育部门。
