        - 运营人员使用；体育部门或俱乐部运营预算付款
        - 这是记录系统楔子，使后续模块扩张成为可能
      - - 招募工作流
        - 潜在球员数据、看板、评估管线、自动化沟通和招募任务
        - 面向消费者的招募媒体和无关 SIS 工具
        - 教练和招募人员使用；运动项目或部门预算付款
        - 高频工作流，在员工效率和信息访问上有可见 ROI
      - - 运动员管理与表现
        - 集中医疗、负荷、营养和表现数据，并通过 API 接入技术栈
        - 可穿戴硬件、实验室设备或独立诊断设备
        - 表现和医疗人员使用；表现预算付款
        - 更接近运动员管理 SAM，而不是通用体育分析
      - - Intelligence 与决策支持
        - 用于运动员评估、名单构建、合同估值和比赛策略的预测模型
