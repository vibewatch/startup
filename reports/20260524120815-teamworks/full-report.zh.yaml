      - number: '4.3'
        title: Teamworks 正越来越位于工作流 SaaS、体育数据基础设施和支付 / 合规软件之间
        blocks:
          - type: paragraph
            body: >-
              Teamworks 的产品组合让简单 SaaS 假设有风险。Hub、Operations、Academics、Recruiting 和 AMS 看起来像熟悉的垂直软件模块，其经济性应受益于经常性合同和工作流粘性。
              但 Intelligence 明确营销预测模型、合同估值和运动专项数据科学；Wallet 则增加预扣计算、W-8BEN 收集、特许权使用费支付处理，以及面向国际运动员的合规保障。
              这些能力可能支撑溢价定价和更大预算，但也意味着专业人才、支持开销、银行 / 合规依赖；与纯席位制工作流供应商相比，可比性也更低。公开可比公司显示跨度。 CompaniesMarketCap 把
              Sportradar 市值列为约 $3.85 billion、过去十二个月收入约 $1.55 billion；Catapult 市值约 $0.78 billion、年度收入约 $0.11
              billion。这给出了一个大致的公开市值 / 收入锚，在这组体育科技企业中约从 2.5x 到 7.1x。Teamworks 几乎肯定会落在这条宽光谱上的某处， 而不是一个干净的软件倍数上。问题在于，没有任何公开
              Teamworks 来源披露收入、ARR、毛利率、服务组合或留存。因此，可比公司组有助于框定估值可能性和披露预期， 但无法确认 Teamworks 的 >$1 billion 私募估值是保守还是激进。
