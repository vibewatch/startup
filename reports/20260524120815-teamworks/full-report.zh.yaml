chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立脉络与操作系统定位
        blocks:
          - type: paragraph
            body: >-
              Teamworks 将自己定位为「The Operating System for Sports」，是一套统一软件栈，为精英体育组织覆盖人才获取、 运营、运动员发展和表现工作流。公司当前官方页面把根扎在
              North Carolina 州 Durham，并称使命是用技术赋能运动员， 以及支持他们的教练、管理人员和表现团队。独立报道和投资方背书材料，把这一定位追溯到创始人 Zach Maurides 作为 Duke
              橄榄球队员的经历；他看到大型大学项目内部的沟通、日程和运动员支持工作流高度碎片化。Delta-v Capital 的 Teamworks 案例研究称，Maurides 识别这些工作流缺口后，于 2006
              年开始打造 Teamworks；Forbes 画像则称，他在 2005 年效力 Duke 时构思了这家公司。与此同时，一篇 2025 年 6 月 SportsPro 文章称 Teamworks 创立于 2004
              年， 公开记录因此存在窄但真实的时间线差异。因此，本章把 2005-2006 视为公司清晰的起源弧线，用当前官方和投资方材料中支撑最强的 2006 年作为运营创立年份，并把相互冲突的 2004
              年引用保留为证据缺口，而不是制造虚假精度。没有争议的是商业模式方向： Teamworks 已从沟通和排程起家，扩展成专为职业、大学、奥运和战术体育场景打造的宽口径垂直 SaaS 平台。
