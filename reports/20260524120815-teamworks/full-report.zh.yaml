            body: >-
              公开可见的最佳销售效率线索不是某个 CAC 数字，而是客户合同形态。College of Charleston 的单一来源文件称，体育部门已经使用 Teamworks Compliance 和
              Academics，因此需要 Hub，并把估算四年成本列为 $446,800。这是典型的存量客户扩张销售。Texas A&M 合同显示三年付款计划从 $185,000 到 $210,000 再到
              $235,000，早期采用折扣逐步退坡，说明 Teamworks 可以随着时间提高实际年度合同价值，而不是只依赖一年期折扣。University of Maine 的 2026 年体育解决方案 RFP
              结果显示，Teamworks 也在正式采购流程中与 Trackman、TruMedia、Concourse Tech 等供应商竞争，进一步说明这是企业采购销售， 不是轻量自助软件。Memphis
              案例研究又补上了运营角度。学校称，它用 GM 和 Wallet 精确到每一分钱管理预算、协调大量合同，并让精简管理团队避免付款延误。
              如果产品嵌入日常财务和合规运营，这类工作流减负可以带来强留存和扩张。代价是，同样的价值主张可能需要上线、支持、实施协调和客户成功资源，而纯自下而上 SaaS 不需要这些负担。
              因此，公开来源支持一个高切换成本、多产品的企业动作，但没有直接披露 CAC、回本周期、销售生产率或附加率数据。
