      - number: '3.2'
        title: 模块层重叠：招聘、表现和 Intelligence 领域，专业厂商仍有可信楔子
        blocks:
          - type: paragraph
            body: >-
              在工作流层面，Teamworks 的宽度是真实的，但专业替代品仍有可信度，因为它们在团队能证明需要保留独立工具的地方卖深度。Front Rush 仍是大学体育中真实的招聘楔子，
              因为它直击招聘和名单管理，并披露了超过 850 所学校、9,500 多支球队的可观规模。随着 Teamworks 借助 Telemetry 和 Intelligence 扩宽，Hudl
              从比赛准备和视频分析侧施压。 表现侧，Catapult 销售体育科技和分析，并具备上市公司披露纪律；SportsWareOnLine 仍紧盯运动训练 EMR；CoachMePlus
              则保持更轻量的人体表现和沟通叙事。 Intelligence 领域，Sportradar 和 Genius Sports
              不是日常运营套件，但其规模、数据基础设施和公开披露，使它们在球队决策支持进一步向外部数据栈收敛时， 成为可信的相邻威胁。含义是：买方更看重跨模块工作流集成、而非单一功能深度时，Teamworks 最容易赢。
