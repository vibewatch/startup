      - number: '1.5'
        title: 反向信号、时间线冲突与未解尽调问题
        blocks:
          - type: paragraph
            body: >-
              当前公开记录中最显眼的反向信号来自 Zelus Analytics 收购。CourtListener 和 PacerMonitor 显示，The Phillies 于 2025 年 3 月起诉 Zelus
              Analytics；On Pattison 的本地报道，以及 Yahoo Sports、Athlon 的更广泛摘要称，Phillies 指控 Zelus 和 Teamworks 准备销售分析产品， 而
              Phillies 认为自己已签约独家使用这些产品。法官驳回了 Phillies 要求紧急禁令救济的请求，但更广泛的合同争议仍在继续。这并不能证明存在重大财务负债，
              却正是软件平台收购专业分析资产后更值得关注的数据权利和客户信任问题。诉讼之外，Teamworks 公开材料仍未回答几个基础尽调项：准确注册成立日期、完整董事会构成、 当前股权结构条款、从球队 /
              组织数量到付费客户的桥接，以及近期增长有多少来自有机而非收购。还有一些值得保留而非抹平的数据一致性问题，包括 2004 与 2006 两个创立年份引用，以及 17 国与 24 国足迹声明。这些问题都没有动摇
              Teamworks 作为规模化且融资充分的品类领导者这一事实。但它们确实限制了后续章节对精度的激进假设， 因为公开记录主要仍是营销、融资和交易披露，而不是经审计运营证据。
