      - number: '4.4'
        title: 资本厚度看起来强，但公开流动性披露太薄，无法真正判断跑道
        blocks:
          - type: paragraph
            body: >-
              看得见的融资故事是真优势。Teamworks 当前 About 页面称公司已融资约 $400 million；公司 2025 年 6 月 Series F 公告称，它在 Dragoneer
              领投的超额认购轮次中获得 $235 million，投前估值超过 $1 billion。更早的 2023 年 Series E 增加 $65 million，并明确称新资本将继续资助
              M&A，以及向新地区和精英人体表现扩张。 结合从 ARMS 到 Telemetry、Zelus、Opteamal、Sportlogiq 和 PFF Enterprise
              的收购节奏，公开记录说明资本既被用于有机产品扩张，也被用于无机平台扩宽，
              而不仅是生存性融资。不过，「融资充足」不等于「资本充足」。公开来源没有披露账上现金、月度烧钱、现金跑道、债务工具、卖方票据、earn-out 或整合准备金。 相比核心工作流软件，Wallet 和 GM
              也可能提高营运资本和合规需求，尤其是在机构进入收入分享和特许权使用费预扣之后。Zelus 诉讼显然未到灾难级，
              但持续法律和整合暴露仍可能占用管理层注意力，并可能消耗现金。正确的财务判断因此是不对称的：Teamworks 显然拥有强融资支持，但外部投资人仍缺少判断下一轮融资是可选项还是战略必要项所需的资产负债表数据。
