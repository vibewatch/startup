  - id: TV005
    title: 投资逻辑破裂与终止触发点表
    columns:
      - 触发点
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 经审计收入不达标
        - 收入或 ARR 等价指标按标准化口径低于约 $150M
        - 若没有异常经济性证明，当前价格对应的倍数将远高于公开可比公司组
        - 把核保重新定价到悲观区间，或退出
      - - 优先股堆叠悬置
        - Series F 轮优先级、清算优先权或老股占比高的结构，实质性压低新资金地位
        - 名义估值可能不等于新投资人可获得的经济权益
        - 入场前要求瀑布模型；否则把该轮视为不可比
      - - 分析业务合同风险恶化
        - 诉讼扩大、和解成本高，或收购分析产品中排他性争议反复出现
        - AI / 分析溢价依赖信任、数据权利和可防守的客户合同
        - 下调溢价假设，并重新审视整合逻辑
      - - Wallet / GM 采用不及预期
        - 直接付款和 NIL 工作流采用慢，或附加率仍不重要
        - House 变动后，高校顺风是少数可见上行催化剂之一
        - 从乐观情景中移除付款工作流上行
      - - 公开体育科技倍数压缩
        - Catapult 式溢价明显下滑，Genius / Sportradar 进一步降级
        - 若没有更优的披露增长，>$1B 的私募估值更难自圆其说
        - 收紧入场区间，并在投资前要求更强的私营公司证据
    notes: 这些是入场后纪律和入场前尽调关口的监测触发点，目的是避免强产品故事压过估值纪律。
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV030
      - CV031
      - CV032
      - CV033
      - CV036
      - CV041
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - 过去两个财年及最新滚动期间的收入、毛利率、EBITDA、现金消耗和 NRR
        - 这些指标决定 >$1B 相对公开可比公司是溢价、合理还是偏高
        - CFO 会议加经审计财务包
      - - 股权结构表和清算瀑布
        - Series F 轮条款、清算优先权、优先级、转换权和准确老股占比
        - 新资金经济权益可能与名义私募估值大幅背离
        - 法律顾问审查加董事会批准的股权结构表导出
      - - 客户变现
        - 付费部门数量、平均 ACV、多产品附加率，以及实体计数中完整体育部门的占比
        - 没有计费单位披露时，球队 / 组织数量不是可靠收入代理
        - 按细分市场和产品导出的收入运营数据
      - - 收购分析资产表现
        - Zelus / PFF / 相关分析资产的续约队列、收入贡献、重大合同，以及任何活跃或已和解客户争议
        - 乐观情景溢价要求这些产品能干净变现并良好续约
        - 产品和法律尽调包
      - - Wallet / GM 牵引力
        - 付款量、上线机构客户、在现有账户中的附加率和合规错误率
        - House 变动后的工作流需求是可见上行催化剂，但前提是 Teamworks 正把它转化为经常性收入
        - 产品总经理加客户访谈
      - - 治理与退出准备度
        - 董事会构成、投资人权利、信息权、债务契约和上市公司准备度控制
        - 退出选择权和下行保护，与产品实力一样取决于治理质量
        - CEO / 法律顾问 / 财务尽调线
    notes: 这份清单每一项都必要，因为公开记录不是缺公司信息，而是缺估值信息。缺失的信息，正是判断私募入场价格是否可投资的信息。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV030
      - CV037
      - CV039
      - CV042
