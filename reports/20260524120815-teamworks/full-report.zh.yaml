      - number: '4.5'
        title: 结论：证据支持企业定价能力和战略宽度，但还不足以承销收入质量或资本效率
        blocks:
          - type: paragraph
            body: >-
              这个故事可投资的部分很容易看见。Teamworks 能在大型大学拿下六位数年度合同，变现附加项和超额用量，并从工作流软件延伸到分析、运动员收入规划和支付 / 税务编排。
              周边市场也有利：体育分析和运动员管理软件都在以双位数增长，House 案后环境又创造了一条新的直接支付预算线，而 Wallet 和 GM 明确为捕捉这条线而设计。
              乐观情景下，这会形成一个复合模型：粘性的核心订阅、溢价分析，以及预算关键型支付工作流。承销障碍同样清楚。公开来源仍未显示模块级 ARR、毛利率、CAC、回本周期、
              净留存率、客户集中度、积压订单、现金余额、烧钱、跑道，或债务和 earn-out 义务。采购文件证明价格点存在，但不能揭示更大客户群中的实际折扣。类似地，
              公开可比公司组能帮助框定估值逻辑，却无法弥补缺失的收入分母。因此，财务结论是正面但不完整：Teamworks 看起来战略宽度足、融资情况好，
              但在判断收入质量、毛利率路径和资本充足性所需的具体输入上，公司披露仍明显不足。
