    title: 精英体育客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，当体育组织想用一个操作系统串起运营、表现和不断扩展的邻近工作流时，Teamworks 更容易赢。
    data:
      items:
        - label: 运动部门或俱乐部运营负责人
          actor: 运动部门或俱乐部运营负责人
          touchpoints:
            - 日历、差旅、文件和沟通工作流四处分散
            - 把 Hub 评估为单一事实来源
            - 推广给员工、运动员，有时还包括家属
          emotion: 希望减少交接，也减少遗漏细节
          painpoint: Too many point tools and manual coordination loops
          opportunity: Teamworks becomes daily operating infrastructure
        - label: 表现与医疗团队
          actor: 表现与医疗团队
          touchpoints:
            - 需要集中运动员数据，并打通跨职能可见性
            - 按具体运动项目工作流配置 AMS
            - 由内部员工调整仪表盘和报告
          emotion: 想增加洞察，但不增加行政负担
          painpoint: Fragmented data and weak collaboration between departments
          opportunity: AMS can attach after Hub or land directly in a performance use case
        - label: NIL 或收入分成管理员
          actor: NIL 或收入分成管理员
          touchpoints:
            - 手工表格和合同跟踪无法继续扩展
            - 引入 General Manager 和 Wallet 处理预算、签约和付款
            - 把运动员和教练工作流迁入受控系统
          emotion: 团队精简时，需要可审计性和规模化
          painpoint: Version control, payment complexity, and compliance risk
          opportunity: Newer modules expand Teamworks beyond classic team operations
        - label: 联盟办公室、NGB 或奥运项目负责人
          actor: 联盟办公室、NGB 或奥运项目负责人
          touchpoints:
            - 需要一个覆盖俱乐部、团队或协会的渠道
            - 在分散利益相关方中部署 Hub 或 AMS
            - 用同一系统协调大型赛事准备和沟通
          emotion: 需要在多实体、多时区之间标准化
          painpoint: Stakeholders are dispersed across teams, countries, and disciplines
          opportunity: International and league-level sales motion compounds footprint density
