      - number: '2.2'
        title: 规模测算视角与口径
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多个市场视角，而不是一个英雄式 TAM。MarketsandMarkets 将全球体育分析市场估为 2025 年 $2.29 billion、2030 年超过 $4.75
              billion，但其分类明确包含粉丝互动和社交媒体分析，会高估 Teamworks 的直接机会。Verified Market Research 提供了更窄的相邻视角： 运动员管理软件，2025 年为 $1.60
              billion，2033 年升至 $3.40 billion，其中体育球队是主导终端用户，北美约占 40%。大学体育提供第三个视角。 RallyFuel 预计 2025-2026 周期 NIL 市场为 $2.75
              billion；Opendorse 报告其网络活跃度覆盖 150,000+ 名运动员用户、$250 million+ 补偿，以及对 NCAA、NAIA、NJCAA 成员达到 98%
              的机构渗透率。这些数字衡量的是不同事：宽口径品类支出、更窄的工作流软件需求、以及交易生态活跃度。 最好把它们理解为上限、较近端代理和需求信号三层，而不是可互换的 TAM 数字。实际含义是：Teamworks
              的直接 SAM 可能远小于体育分析大盘， 但 NIL 和收入分享复杂度仍显著放大了它。
