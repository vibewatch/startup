      - number: '8.5'
        title: 尽调阻碍、退出准备度与最终建议
        blocks:
          - type: paragraph
            body: >-
              决定性阻碍都来自私营公司不透明。公开来源没有披露经审计收入、毛利率、EBITDA、净收入留存、队列扩张、模块附加率、客户集中度、债务，或 F 轮形成的优先股堆叠。这些不是表面缺项。它们决定 >$1B
              标记究竟是一轮有纪律的私募融资、对赞助方友好的营销标记，还是一个只有因为内部人拥有比新投资人更好下行保护才成立的价格。同样的问题也影响退出准备度：Teamworks
              因为覆盖运营、招募、分析和付款，可能确实对买方有战略吸引力；但公开记录并未证明通常支撑广泛 IPO 式承销所需的经审计规模和治理成熟度。

              因此，结论狭窄但站得住。Teamworks
              值得留在买入名单上，因为产品宽度、合同证据和市场顺风都真实存在。但在管理层披露足够财务和股权结构细节、能把公开证据桥接到当前估值之前，它不值得按最后披露价格给出买入建议。今天正确建议是 research-more
              / track：只有当尽调证明 Teamworks 至少已经达到高端私营垂直 SaaS
              收入规模、续约动态干净，且投资人条款不会把隐藏下行转嫁给新钱时，才继续推进。没有这些证据，公司依然有吸引力，但入场价格仍缺乏足够支撑。
