      - number: '6.3'
        title: 耐久性信号、先落地再扩张动作与采购经济性
        blocks:
          - type: paragraph
            body: >-
              公开材料能显示长期使用或模块扩张时，Teamworks 看起来更耐久。Penguins 自 2014 年起使用 Hub，是最干净的长期证据。Bates 从 Hub、Compliance 和 Recruiting
              走向 AMS，Memphis 为收入分享时代增加 General Manager 与 Wallet，Charleston 的单一来源采购理由也明确说，因为 Compliance 和 Academics
              已经到位，所以需要 Hub。Texas A&M 的合同显示，至少部分大学客户会把 Teamworks 当作宽产品包采购，年合同价值达到六位数，而不是把它当作狭窄单点方案。这一点重要，因为它意味着
