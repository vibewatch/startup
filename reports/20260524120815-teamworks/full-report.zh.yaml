  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：Teamworks 面对的是楔子、套件和基础设施层的竞争
        blocks:
          - type: paragraph
            body: >-
              Teamworks 已不再只和传统排程工具或一个直接复制品竞争。它自己的产品页面现在描述的是一套操作系统，横跨人才获取、日常运营、运动员管理、表现和智能。 这种宽度意味着竞争格局必须拆成几类：招聘领域的
              Front Rush 等直接工作流楔子；Catapult、SportsWareOnLine、CoachMePlus 等表现和医疗专业厂商； Opendorse 等相邻的运动员变现供应商；以及
              Sportradar、Genius Sports 等更大的外部数据和媒体基础设施公司。现状替代方案同样重要。 College of Charleston
              采购记录明确称，体育部门可能继续困在多个割裂系统里；Teamworks 则主张，一个身份层、一个枢纽、共享日历 / 任务可以减少碎片化。 核心结论是，Teamworks 的买方往往不是在 Teamworks
              和一个完美对位的竞争对手之间二选一。真正的选择是：采用一套更宽的套件，继续在多个专业工具间并行， 或干脆推迟迁移。
