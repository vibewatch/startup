      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              近期最强需求驱动是大学体育政策变化。NCAA 2025 年 4 月规则包设想向学生运动员直接付款，并取消 150 多条规则；后续报道把 2025-2026 年首个收入分享上限定为 $20.5 million，与
              Power Conference 平均收入的 22% 挂钩，并预计会随时间上调。这把预算、签约、税款预扣、名单管理和跨职能协调， 从后台摩擦推成前台紧迫任务。Teamworks 自己的 Wallet 和
              Memphis 材料正是围绕这个痛点展开。但同一变化也是约束。University Business 和 Oak View Group
              都强调，学校承受真实财务压力，正在寻找新的资金路径；SportsRecruits 则凸显名单名额的硬取舍。因此，大学市场不是一波平坦需求浪潮，
              而是一个预算紧、需主动选择的市场：资金最充裕的部门先动，中端市场犹豫，产品采用取决于软件能否明确减轻行政负担，而不是简单增加一项支出。
