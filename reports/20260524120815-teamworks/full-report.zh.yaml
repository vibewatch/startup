      - number: '8.2'
        title: 当前估值背景与明确价格纪律
        blocks:
          - type: paragraph
            body: >-
              最好的公开估值锚点仍是 2025 年 6 月 F 轮：Teamworks 融资 $235M，投前估值高于 $1B；公开报道现在指向成立以来累计融资约 $400M。这足以确认 Teamworks
              已从小众工作流供应商升级为有机构融资支持、具备规模的私营体育科技平台。但它仍不足以验证当前价格。给投资人一个头条估值的同一套公开记录，隐去了承销最关键的输入：收入、毛利率、经营杠杆、客户集中度、债务和清算瀑布。公开采购证据有帮助，因为它证明
              Teamworks 可以拿下年化合同，从 Hub 主导部署的大约 $112k 到更宽多模块包的 $235k 不等。但这些合同解决不了核心问题：一个部门级交易可以覆盖许多球队和许多模块，因此公司的
              6,500-team / 7,000-organization 规模声明不能干净换算成 ARR。

              这种不透明决定了进场规则。如果 Teamworks 只配得上 Genius Sports 和 Sportradar 等公开可比公司的 2x-3x 收入倍数，那么 >$1B 估值就需要大约 $333M-$500M
              收入。如果 Teamworks 因为更接近拥有粘性工作流控制权的垂直操作系统，而配得上类似 Catapult 的 5x-7x 溢价倍数，该标记仍隐含大约 $143M-$200M
              收入。公开证据没有告诉市场哪种世界才是真的。因此，正确纪律不是照单全收私募标记，而是在把当前价格视为超过赞助方背书参考点之前，坚持拿到经审计收入、留存和股权结构证据。
