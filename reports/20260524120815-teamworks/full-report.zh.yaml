        blocks:
          - type: paragraph
            body: >-
              公开信任姿态真实存在，但比产品地图薄。Teamworks 隐私政策明确称，公司作为服务数据处理者，披露的子处理方名单包括 AWS、Twilio 和 DocuSign，说明服务不面向 13
              岁以下儿童，并承认跨境传输以及数字传输安全的内在边界。公开技术和支持触点也存在。Teamworks 维护 AMS 和 Recruiting Communications 帮助中心入口、 带有登录和移动 App
              链接的员工资源页面，以及解释 Smartabase 和 Whistle 如何更名为 Teamworks AMS 与 Teamworks Recruiting Communications 的迁移页面。
