      - number: '1.3'
        title: 融资历史、投资人基础与并购驱动扩张
        blocks:
          - type: paragraph
            body: >-
              公开融资来源能从 2020 年起拼出一条强劲的逐轮融资线索。BusinessWire 记录，2020 年 4 月 Teamworks 完成 Delta-v Capital 领投的 $25M Series
              C，Afia Capital、Stadia Ventures 新进参投，General Catalyst、Seaport Capital 等老股东跟投。随后 Teamworks 自己的 Series D
              公告显示，公司在 2022 年 6 月融资 $50M，仍由 Delta-v 领投，Seaport、General Catalyst、Teamworthy Ventures、 Blossom Street
              Ventures、Afia Capital 以及一批现役和前职业运动员组成的广泛财团参投。下一步是 2023 年 4 月由 Dragoneer Investment Group 领投的 $65M Series
              E，公告同时披露收购 ARMS Software，并把当时已披露累计融资推至 $165M。拐点发生在 2025 年 6 月 17 日： Teamworks 宣布完成超额认购的 $235M Series
              F，由回归投资人 Dragoneer 领投，投前估值超过 $1B。公司当前官方材料称累计融资约 $400M，意味着未披露的早期轮次和后续战略资金，补上了 2020-2025
              年公开逐项列示轮次与今天累计总额之间的差额。资本不只是用来延长跑道； 它明显资助了平台宽度。2024 至 2026 年，Teamworks 收购 Zelus Analytics、Telemetry
              Sports、Opteamal、Sportlogiq 和 PFF Enterprise，
              把公司从工作流软件推向更有野心的数据与智能栈。这一并购节奏能支撑一个品类整合故事，但也意味着后续尽调必须把有机模块扩张与通过 M&A 买来的增长拆开看。
