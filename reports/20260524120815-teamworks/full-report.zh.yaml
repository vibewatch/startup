      - number: '1.4'
        title: 规模标记、客户覆盖和全球市场存在
        blocks:
          - type: paragraph
            body: >-
              Teamworks 商业规模最强的公开证据，来自公司自己的融资和收购公告，而不是经审计财务披露。2025 年 6 月 Series F 公告称，Teamworks 为全球 6,500
              多支精英体育球队提供支持，并声称在 100% 的 NFL 球队、90% 的 MLB 和 Premier League 俱乐部、87% 的 NBA 球队、83% 的 MLS 俱乐部、81% 的 NHL 球队、99%
              的 Division I NCAA 体育部门，以及 24 个国家的 65 个以上奥运联合会中拥有优选技术地位。到 2026 年 3 月，PFF Enterprise 收购公告把规模表述更新为全球 7,000
              多个精英体育组织，强化了这样的判断：Series F 关闭后，公司仍在新增客户标识 或纳入更多实体统计。Teamworks 当前 About 页面给出另一组不同但互补的官方成熟度标记：485+ 名员工、约
              $400M 融资，以及由 24x7x365 服务模型支撑的 17 国足迹。2025 年融资报道里的 24 国，与 2026 年 About 页面上的 17 国不一致，可能反映「服务覆盖国家」
              与「直接运营足迹国家」口径不同，但这个差异仍应承认。几乎无可争议的是，Teamworks 已深度嵌入北美主要职业联盟、顶尖大学体育和奥运 / NGB 环境。
              开放尽调问题在于：这些渗透率指标能否干净转换成持久的多模块 ARR，而不是一个合同深度参差不齐的大型装机基础。
