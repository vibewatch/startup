  rows:
  - - Overall recommendation
    - RESEARCH-MORE / TRACK
    - Strong strategic asset, but public evidence does not underwrite the current >$1B price
    - Move toward BUY only after audited financials, retention, and cap-table terms are disclosed
  - - Confidence
    - Medium
    - The strategic thesis is clear, but valuation evidence is incomplete
    - Confidence rises if management proves revenue scale, margin quality, and customer stickiness
  - - Risk rating
    - High
    - Private-company opacity, acquired-analytics execution, and term uncertainty create downside asymmetry
    - Risk falls if litigation, renewal, and preference overhangs are resolved
  - - Valuation stance
    - Unknown to stretched
    - Could be fair at high-end private SaaS scale; could be expensive if revenue is materially below that threshold
    - Becomes fair-to-attractive only with auditable proof that revenue is roughly $170M-$200M+ and durable
  - - Entry discipline
    - Do not underwrite off the headline round alone
    - The latest mark is a reference point, not a sufficient valuation proof set
    - Require audited revenue, module mix, NRR, and full waterfall before pricing an entry
  notes: This table intentionally separates company quality from price quality. Teamworks may be a strong business, but the public record still lacks the financial detail needed to treat the last private round as an investable market-clearing price.
