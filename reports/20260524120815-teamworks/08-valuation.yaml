- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Supportable valuation band
  - Return vs. >$1B current mark
  - Core assumptions
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - $1.8B-$2.4B by 2028
    - ~1.8x-2.4x
    - Revenue or ARR-equivalent clearly above $200M, strong multi-module retention, meaningful Wallet / GM adoption, and analytics monetization proves premium status
    - Requires audited disclosure plus public comp stability and evidence that Teamworks acts like a system of record, not a bundle of point tools
    - Failure to prove monetization of AI, analytics, or payments modules after the 2025-2026 product push
  - - Base
    - $1.0B-$1.3B
    - Flat to modest upside
    - Revenue roughly in the $150M-$200M zone, mixed attach rates, and no major step-down in public sports-tech multiples
    - Most consistent with current public evidence because it accepts the business quality but discounts missing financial proof
    - Audited results show subscale revenue, weak margins, or limited expansion beyond core workflow tools
  - - Bear
    - $0.5B-$0.8B
    - ~0.5x-0.8x
    - Revenue materially below Catapult-like premium thresholds, preference stack heavily favors insiders, or analytics / payments renewal disappoints
    - Triggered by hidden seniority, slower acquired-product uptake, or comp multiple compression toward low public-market levels
    - Down-round, insider-heavy recap, or customer / legal evidence that the premium story is overstated
  notes: These are supportable valuation bands, not assertions about Teamworks' undisclosed internal forecast. The bands are derived from current public comp multiples, public contract anchors, and explicit diligence assumptions.
