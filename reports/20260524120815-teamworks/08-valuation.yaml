- id: comparable-set
  title: Comparable set and what public markets imply about supportable valuation
  body: 'The comparable set has to do two jobs at once. First, it needs to bracket Teamworks against public sports-tech operators that actually disclose revenue and market values. Second, it needs to incorporate pricing evidence from Teamworks'' own public contracts, because Teamworks is private and the public-market data alone cannot tell investors how much revenue its workflow stack might already generate. Catapult is the cleanest premium comp for Teamworks'' performance-and-operations angle: it sells sports performance technology directly to teams and currently trades around 5x-7x revenue depending on whether one uses Yahoo''s EV/revenue or CompaniesMarketCap''s market-cap framing. Genius Sports and Sportradar are less directly comparable on product mix, but they matter because they are scaled public sports-data platforms with audited reporting, and both currently trade much closer to 2x-3x revenue. That spread is the essential valuation frame for Teamworks.

    Public Teamworks contracts then provide the missing monetization anchors. Texas A&M''s Elite package reached $235k annually by year three, and College of Charleston''s Hub-only sole-source memo implied roughly $112k annually for a narrower deployment. Those are not enough data points to build a precise ARR model, but they do establish that Teamworks can monetize at institutional ACVs that matter. The key limitation is that the public record does not reveal how many customers look like Texas A&M versus Charleston, how many entity counts represent full athletic departments versus single teams, or how much attach rate exists for analytics and Wallet products. That is why the comparable analysis points to a valuation band, not a single fair-value answer.'
