- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / anchor
  - Metric
  - Multiple / valuation status
  - Why it matters for Teamworks
  - Key limitation
  enumerationScope:
    coverage: partial
    basis: The table covers the most useful public sports-tech comparables plus public Teamworks pricing anchors, but it does not capture undisclosed private sports-tech rounds, secondaries, or every departmental contract needed to build a full private-market comp set.
  rows:
  - - Teamworks Series F (June 2025)
    - $235M raise; >$1B pre-money
    - Latest disclosed private round
    - The only direct company-level valuation anchor in the public record
    - No public revenue, margin, or preference disclosure accompanies the mark
  - - Catapult Group International
    - $0.78B market cap; $0.11B revenue
    - ~5x-7x revenue depending on data source
    - Best premium public comp for team-facing sports-performance technology
    - Smaller revenue base and public-company disclosure discipline make it an imperfect but useful premium bracket
  - - Genius Sports
    - $1.43B market cap; $0.66B revenue
    - ~2x revenue / ~1.8x EV-revenue
    - Shows what a scaled public sports-tech platform with audited reporting currently earns in the market
    - Product mix leans more to official data, betting, and media than team workflow software
  - - Sportradar
    - $3.85B market cap; $1.55B revenue
    - ~2.3x EV-revenue
    - Large-scale sports-data comp with positive EBITDA and public SEC disclosure
    - Much larger and more betting / media exposed than Teamworks
  - - Texas A&M Teamworks contract
    - $235k annualized by year three
    - Department-level ACV anchor
    - Proves that broad Teamworks bundles can monetize at meaningful institutional ACVs
    - One contract cannot be extrapolated into company-wide ARR because a single school covers many teams and modules
  - - College of Charleston Hub memo
    - $446.8k over four years
    - ~$112k annualized Hub-led anchor
    - Shows narrower Teamworks deployments still clear six-figure institutional spend
    - Sole-source justification does not reveal renewal, usage intensity, or full competitive pricing context
  notes: Public market data helps bound supportable multiples; public procurement evidence helps bound monetization per institutional account. Together they justify a valuation band rather than a single precise fair value.
