  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, cash burn, and NRR for the latest two fiscal years plus trailing period.
    whyItMatters: Public comps only become usable when Teamworks' actual scale and economics are known.
    diligencePath: Request audited financial statements, management bridge schedules, and cohort retention analysis from finance.
    relatedQuestionRefs:
    - QV017
  - type: private-evidence-only
    severity: blocking
    topic: series-f-waterfall
    missingEvidence: Series F liquidation preference terms, seniority, participation rights, and exact primary-secondary allocation.
    whyItMatters: New-money economics can diverge sharply from the headline valuation if downside protection is concentrated with insiders.
    diligencePath: Obtain the current cap table, stock purchase agreement, investor rights agreement, and waterfall model from counsel and finance.
    relatedQuestionRefs:
    - QV018
  - type: private-evidence-only
    severity: material
    topic: customer-monetization-density
    missingEvidence: Paying-customer counts, average ACV by segment, and the share of entity counts that represent multi-product institutional contracts.
    whyItMatters: Team and organization tallies are not reliable ARR proxies, so price support cannot be validated without billing-unit clarity.
    diligencePath: Pull revenue-operations exports that reconcile departments, teams, modules, ACV, and renewal status.
    relatedQuestionRefs:
    - QV019
  - type: private-evidence-only
    severity: material
    topic: acquired-module-renewal
    missingEvidence: Renewal, expansion, and churn data for acquired analytics products plus live Wallet / GM payment volume and attach rate.
    whyItMatters: The bull case depends on high-value modules monetizing beyond the legacy workflow core.
    diligencePath: Review product-level cohort dashboards, customer references, and post-acquisition integration scorecards.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table-private-coverage
    missingEvidence: Broader disclosed private rounds, secondaries, and transaction references for directly comparable private sports-tech platforms.
    whyItMatters: The comparable table currently relies on public comps plus Teamworks pricing anchors and therefore remains directional rather than exhaustive.
    diligencePath: Expand the comp set with disclosed secondaries or brokered private-market references if available.
    relatedTableRefs:
    - TV004
