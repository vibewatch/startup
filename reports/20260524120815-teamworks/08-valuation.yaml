- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Platform breadth
    - Integrated workflow stack across operations, recruiting, performance, analytics, and payments can create sticky operating-system economics
    - Breadth may reflect acquisitions more than proven cross-sell or unified retention
    - Show module-level attach rates, cross-sell cohorts, and renewal data by acquired product line
  - - Pricing power
    - Public contracts show six-figure annualized departmental ACVs for bundled and hub-led deployments
    - A few visible contracts do not reveal average ACV or whether entity counts overstate paying accounts
    - Provide customer-count, ACV, and module-mix disclosure by segment
  - - Collegiate tailwind
    - NCAA direct-pay rules and NIL reporting create new payment, compliance, and workflow demand
    - Budget pressure could also make schools more selective and ROI-driven in software spend
    - Show Wallet / GM adoption, payment volumes, and renewal expansion post-July 2025
  - - Analytics upside
    - Teamworks Intelligence and acquired analytics assets can justify a premium if they improve roster and valuation workflows
    - Litigation or exclusivity disputes can slow adoption and undermine the premium narrative
    - Resolve key disputes and disclose analytics customer retention and revenue contribution
  - - Current price support
    - If Teamworks is already at high-end private vertical-SaaS revenue scale, >$1B can be defensible
    - Without public revenue, margin, or preference data, the mark may simply reflect insider-friendly private pricing
    - Release audited financials and full Series F economic terms
  notes: The anti-thesis is intentionally about price and evidence quality, not about denying that Teamworks has built a real platform. The central debate is whether today's public proof set is enough for the current valuation.
