- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financials
    - Revenue, gross margin, EBITDA, cash burn, and NRR for the last two fiscal years plus latest trailing period
    - These metrics determine whether >$1B is premium, fair, or stretched versus public comps
    - CFO room plus audited financial package
  - - Cap table and waterfall
    - Series F terms, liquidation preferences, seniority, conversion rights, and exact secondary mix
    - New-money economics can diverge sharply from the headline private valuation
    - Counsel review plus board-approved cap-table export
  - - Customer monetization
    - Count of paying departments, average ACV, multi-product attach rates, and share of entity counts that are full athletic departments
    - Team / organization tallies are not reliable revenue proxies without billing-unit disclosure
    - Revenue-operations export by segment and product
  - - Acquired analytics performance
    - Renewal cohorts, revenue contribution, major contracts, and any active or settled customer disputes for Zelus / PFF / related analytics assets
    - Bull-case premium requires these products to monetize cleanly and renew well
    - Product and legal diligence package
  - - Wallet / GM traction
    - Payment volume, live institutional customers, attach rate into existing accounts, and compliance-error rate
    - Post-House workflow demand is a visible upside catalyst, but only if Teamworks is converting it into recurring revenue
    - Product GM plus customer-reference calls
  - - Governance and exit readiness
    - Board composition, investor rights, information rights, debt covenants, and public-company readiness controls
    - Exit optionality and downside protection depend on governance quality as much as product strength
    - CEO / counsel / finance diligence stream
  notes: Every item on this list is required because the public record is valuation-sparse rather than company-sparse. The missing information is exactly the information that determines whether a private entry price is investable.
