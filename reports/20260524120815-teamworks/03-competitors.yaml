- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Current public evidence
  - Mitigation / diligence ask
  rows:
  - - Integrated workflow suite
    - Best-of-breed buyers keep separate recruiting, performance, or intelligence tools
    - high
    - Front Rush, Hudl, Catapult, SportsWareOnLine, and CoachMePlus each own a wedge with clear public positioning
    - Request module-level win-loss data and reasons accounts stay multi-homed
  - - Shared identity and connected data
    - Departments may accept fragmented systems rather than pay for full migration
    - high
    - Charleston explicitly described the pain of disconnected platforms before adopting Hub
    - Ask for usage telemetry showing cross-module login and workflow depth after deployment
  - - Enterprise packaging and bundle value
    - Opaque pricing may force discounting or slow budget approval
    - medium
    - Texas A&M and Charleston show Teamworks contract values, but most peers hide public pricing
    - Review realized discounting, sales-cycle length, and procurement objections by segment
  - - Intelligence moat from Zelus and predictive models
    - Data-rights or exclusivity disputes can erode customer trust
    - critical
    - Phillies litigation alleges rival-sale risk around Titan Intelligence and continues beyond the denied TRO
    - Review acquired analytics contracts, indemnities, and governance over proprietary models
  - - Expansion into video and preparation
    - Hudl and other video/data specialists defend the category Teamworks is entering
    - high
    - SportsPro tied Telemetry to Teamworks video expansion while Hudl remains a scaled incumbent
    - Measure attach and retention for any Teamworks video-intelligence bundles against Hudl-led alternatives
  - - Large adjacent data ecosystem advantage
    - Sportradar and Genius can invest at far larger disclosed scale
    - high
    - Public revenue comparables show much larger external data businesses than Teamworks publicly discloses
    - Stress-test whether Teamworks truly needs to match those vendors or only interoperate with them
  notes: Severity is an analyst judgment based on current public evidence. It prioritizes diligence topics rather than estimating exact financial downside.
