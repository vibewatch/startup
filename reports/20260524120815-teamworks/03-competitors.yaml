callouts:
- calloutType: strength
  title: Integration is the clearest direct moat
  body: The procurement records matter because they move Teamworks from marketing language to operational reality. Texas A&M and Charleston both point to bundle value and platform consolidation rather than to a single isolated feature.
  claimRefs:
  - CP031
  - CP033
  - CP034
  - CP035
  - CP045
- calloutType: insight
  title: Most alternatives are wedges, not full replacements
  body: Front Rush, Hudl, Catapult, SportsWareOnLine, CoachMePlus, and Opendorse each attack a particular workflow. That keeps multi-homing alive and means Teamworks must win on orchestration rather than by assuming buyers want one vendor everywhere.
  claimRefs:
  - CP043
  - CP047
  - CP048
- calloutType: risk
  title: Intelligence expansion increases trust and data-rights exposure
  body: The Phillies-Zelus dispute is the strongest adverse evidence in the public record because it challenges how acquired intelligence assets are governed, licensed, and sold. That kind of conflict can weaken trust even if the product itself remains strong.
  claimRefs:
  - CP040
  - CP041
  - CP042
