- id: pricing-and-switching
  title: Pricing, packaging, and switching-cost dynamics favor suites but remain hard to benchmark publicly
  body: 'Public pricing transparency is weak across this category. Most of the fetched peer pages talk about capabilities, packages, or contact-sales flows without exposing list prices. Teamworks is one of the few vendors in this source set where real contract evidence is visible. Texas A&M’s agreement shows a discounted annual Teamworks package at $235,000 plus overage mechanics for usage, while the College of Charleston’s sole-source justification shows a four-year Hub commitment and explicitly ties the purchase to already-installed Compliance and Academics modules. That matters competitively because it turns Teamworks’ integration story into something more concrete than homepage language: once a department standardizes on shared identity, shared calendars, and connected operations modules, replacement gets harder and procurement gets more strategic. At the same time, the absence of broad public peer pricing means investors still cannot tell from public evidence whether Teamworks wins
    by premium bundle value, by discounting, or by simply selling into higher-budget athletic departments than point-solution vendors target.'
  claimRefs:
  - CP031
