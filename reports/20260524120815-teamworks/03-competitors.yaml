  rows:
  - - Teamworks
    - Integrated suite
    - '>$1B valuation in 2025; public contracts show six-figure departmental spend'
    - Elite pro, college, Olympic, and performance staffs
    - One operating-system pitch across recruiting, operations, performance, and intelligence
    - Private operating metrics, attach rates, and realized pricing are still not public
  - - Front Rush
    - Recruiting / roster specialist
    - 9,500+ college teams at 850+ schools
    - College coaching staffs
    - Deep recruiting and roster workflow focus plus packaged offerings
    - Public evidence stays concentrated in recruiting rather than broad performance or intelligence
  - - Hudl
    - Video and data specialist
    - Millions of athletes, coaches, and fans
    - Teams prioritizing video capture, analysis, and AI-assisted review
    - Strong brand in video, livestream, and performance analysis
    - Fetched proof is lighter on operations, compliance, and athlete-management depth
  - - Catapult
    - Performance technology specialist
    - Public-company reporting plus roughly $0.11B TTM revenue
    - High-performance staffs across many sports
    - Analytics-heavy performance positioning with investor-grade disclosure
    - Fetched pages do not show transparent public pricing or broad operations-suite scope
  - - SportsWareOnLine
    - Athletic-training EMR specialist
    - Company claims category leadership in athletic-training documentation
    - Athletic trainers and medical staffs
    - Focused injury documentation and reporting workflow
    - Narrower scope than a full operations-plus-performance suite
  - - CoachMePlus
    - Human-performance point solution
    - Public site offers a free trial but no broad scale disclosure
    - Coaches and performance practitioners
    - Low-friction evaluation and communication-centric performance workflow
    - Scope appears narrower and lighter-weight than enterprise suite buyers may need
  - - Opendorse
    - Adjacent NIL platform
    - Annual NIL report and college/collective/brand workflow positioning
    - Student-athlete monetization stakeholders
    - Strong NIL marketplace and athlete-earnings adjacency
    - Not a replacement for recruiting, hub, or daily performance workflows
  - - Sportradar
    - External data / media / betting infrastructure
    - Public filings plus roughly $1.55B TTM revenue
    - Leagues, sportsbooks, media, and data buyers
    - Massive external data and rights infrastructure
    - Less team-embedded in daily operations workflows
  - - Genius Sports
    - External data / analytics / broadcast infrastructure
    - 150+ countries, 1,000+ organizations, roughly $0.66B TTM revenue
    - Leagues, media, betting, and data buyers
    - Global data, analytics, and broadcast footprint
    - Direct overlap is strongest in intelligence rather than hub or recruiting
  - - Internal build / fragmented tools
    - Status quo substitute
    - No external funding required; often already in place
    - Budget-constrained or change-averse departments
    - Avoids full-platform migration and preserves incumbent habits
    - Creates disconnected data, duplicated admin work, and weaker shared context
