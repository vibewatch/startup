  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table coverage
    missingEvidence: Current public pages or customer proof for additional niche elite-sports workflow vendors such as TeamSnap or Kitman-style alternatives.
    whyItMatters: The current table is directionally robust but not exhaustive across the long tail of private sports-tech vendors.
    diligencePath: Expand the source pack with current official pages, customer procurement records, and product summaries for remaining niche vendors.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: realized pricing and discounting
    missingEvidence: Actual discount waterfall, realized contract values by module, and competitive pricing sheets across recent deals.
    whyItMatters: Without realized pricing, the public record cannot show whether Teamworks wins on premium bundle value, discounting, or segment selection.
    diligencePath: Request recent pricing approvals, deal desks, and competitive quote sheets segmented by pro, college, and governing-body customers.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: module attach rates and win-loss data
    missingEvidence: Product-level attach rates, logo-to-ARR mix, renewal cohorts, and closed-lost reasons by module.
    whyItMatters: These metrics determine whether Teamworks’ suite moat is deep or whether customers remain shallowly attached to one or two modules.
    diligencePath: Review board reporting, product dashboards, and CRM win-loss notes for the last twelve months.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: missing-source
    severity: material
    topic: likely entrant roadmaps
    missingEvidence: Current roadmaps or M&A signals from Hudl, Catapult, Sportradar, and Genius about moving deeper into team workflow software.
    whyItMatters: Entry risk may accelerate if adjacent vendors decide to move from data or analysis into orchestration and decision-support workflows.
    diligencePath: Collect 2026 release cadence, investor commentary, and corporate-development updates for the named adjacent vendors.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: commoditization versus specialist choice
    missingEvidence: Churn reasons, replacement reasons, and customer interviews explaining why buyers stay multi-homed or replace Teamworks with specialists.
    whyItMatters: Public evidence shows specialist wedges, but it cannot distinguish simple price pressure from deliberate best-of-breed workflow decisions.
    diligencePath: Request churn analyses, closed-lost categories, and reference calls from accounts that expanded or contracted their Teamworks footprint.
