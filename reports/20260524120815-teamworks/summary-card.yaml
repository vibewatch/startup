    headcount: 485
  topStrengths:
    - >-
      Deep installed-base proof across professional leagues, NCAA programs, and Olympic / governing-body customers
      creates real category credibility.
    - >-
      The company has expanded from a workflow platform into a broader intelligence stack through a visible acquisition
      cadence rather than narrative alone.
    - >-
      Teamworks has unusually strong capital support for a private vertical SaaS company, including a $235M Series F and
      repeated backing from Dragoneer and Delta-v.
    - >-
      Integrated workflow ownership across recruiting, operations, performance, analytics, and athlete-finance processes
      can raise switching costs and cross-sell potential.
  topRisks:
    - >-
      Public disclosures do not reveal ARR, gross margin, NRR, customer concentration, or cap-table terms, making
      valuation underwriting materially incomplete.
    - >-
      The acquisition wave raises integration, codebase, and operating-complexity risk at exactly the moment Teamworks
      is trying to present itself as a single AI platform.
    - >-
      NCAA revenue-sharing changes and broader college-athletics budget pressure could constrain software spending or
      slow wallet / rev-share adoption dynamics.
    - >-
      The Phillies versus Zelus dispute highlights data-rights and exclusivity risk attached to acquired analytics
      assets.
    - >-
      Founder and key-executive dependence remain meaningful because governance transparency is much thinner than
      product or customer marketing.
  unresolvedGaps:
    - Current ARR, revenue mix, gross margin, burn, and runway remain undisclosed.
    - Paying-customer quality behind the 6,500-team and 7,000-organization counts is not public.
    - Current board composition, liquidation preferences, and fully diluted cap table are not public.
    - Founding-year chronology and geography-count methodology still conflict across public sources.
    - Integration economics and contingent liabilities tied to acquired businesses are not public.
