summary:
  headline: >
    Teamworks looks like the leading vertical software platform for elite sports — with unusually deep league
    penetration, a broad workflow suite, and strong AI-oriented acquisitions — but the current $1B+ valuation sits on
    top of a public record that is far richer on scale and fundraising than on revenue quality, margin structure, or
    integration economics.
