evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: >-
      Exact incorporation filing, early cap-table documents, or archived official company materials that reconcile 2004
      versus 2006 public references.
    whyItMatters: >-
      Founding chronology is a core overview fact and affects how long the company has had to build product,
      relationships, and scale.
    diligencePath: Obtain Delaware incorporation records, earliest financing documents, and archived company bios from management.
    relatedQuestionRefs:
      - QO001
      - QO025
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board roster, board committee structure, fully diluted cap table, investor rights summary, and liquidation
      preferences.
    whyItMatters: >-
      Public valuation headlines are hard to underwrite without knowing control rights, dilution, and preference
      overhang.
    diligencePath: Request board materials, charter documents, stock ledger, and most recent financing documents.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: >-
      Paying-customer count, ARR by product and cohort, renewal schedule, and concentration metrics behind the
      6,500-team and 7,000-organization disclosures.
    whyItMatters: Logo or organization counts do not automatically translate into durable revenue quality or contract depth.
    diligencePath: Request customer-level ARR, logo-to-account mapping, cohort retention, and expansion data.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: geography-count
    missingEvidence: >-
      Methodology defining the 17-country figure on the current About page versus the 24-country figure in the 2025
      Series F materials.
    whyItMatters: Geographic reach is a public scale KPI and should not drift across materials without explanation.
    diligencePath: Ask management to reconcile whether one number reflects countries served and the other direct operating presence.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: litigation-exposure
    missingEvidence: >-
      Complaint, contracts, damages theory, insurance coverage, and post-acquisition indemnity or escrow protections
      tied to the Phillies/Zelus dispute.
    whyItMatters: Inherited analytics-IP disputes can affect customer trust, legal cost, and acquisition economics.
    diligencePath: >-
      Request the acquisition agreement, litigation memo, outside counsel assessment, and any settlement or reserve
      analysis.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: TO002 leadership and governance coverage
    missingEvidence: >-
      Board roster, committee structure, deeper executive bench, and succession documentation beyond the public founder
      and C-suite roster.
    whyItMatters: >-
      The leadership table is intentionally partial, and governance opacity limits confidence in key-person risk and
      oversight quality.
    diligencePath: Request board deck materials, committee charters, org chart, and succession plans from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      A normalized bridge that separates broad sports-analytics categories, narrower athlete-management software, and
      direct Teamworks-addressable workflow spend.
    whyItMatters: >-
      Without a normalized bridge, TAM headlines can be mistaken for direct revenue opportunity and overstate valuation
      support.
    diligencePath: Request management’s segment revenue mix and a bottoms-up mapping from modules to buyer budgets.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: college-athletics-bottom-up-sam
    missingEvidence: >-
      A public or private count of which schools are opting into revenue sharing, how they cluster by budget tier, and
      what software categories they are actively funding.
    whyItMatters: >-
      Budget concentration is likely the main determinant of near-term SAM, especially outside the wealthiest
      conferences.
    diligencePath: >-
      Build a cohort model using opt-in lists, public athletics revenue data, and management pipeline segmentation by
      school tier.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: wallet-adoption-depth
    missingEvidence: Live-customer counts, payment volume, and renewal or expansion data for Teamworks Wallet and GM.
    whyItMatters: >-
      The market thesis is materially stronger if Wallet and GM are already converting installed-base relationships into
      recurring revenue, not just pilots or case studies.
    diligencePath: >-
      Request module-level customer counts, live-versus-pilot breakdowns, payment volumes, and attachment rates from
      management.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: revenue-based-som
    missingEvidence: Average contract values, implementation scope, and module mix by school tier, league, and customer segment.
    whyItMatters: >-
      Procurement examples show willingness to pay, but they do not support a defendable revenue-based SOM without
      broader pricing dispersion data.
    diligencePath: Request ACV distribution, implementation fee structure, and renewal cohort data by customer segment.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: opt-in-rates
    missingEvidence: A confirmed school-by-school map of revenue-sharing opt-in decisions for the 2025-2026 cycle.
    whyItMatters: >-
      The speed of opt-in adoption will shape how quickly college-athletics workflow demand becomes recurring software
      demand.
    diligencePath: >-
      Track conference-by-conference opt-in decisions and compare them with Teamworks pipeline or installed-base
      coverage.
    relatedQuestionRefs:
      - QM024
      - QM026
    relatedTableRefs:
      - TM004
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table coverage
    missingEvidence: >-
      Current public pages or customer proof for additional niche elite-sports workflow vendors such as TeamSnap or
      Kitman-style alternatives.
    whyItMatters: The current table is directionally robust but not exhaustive across the long tail of private sports-tech vendors.
    diligencePath: >-
      Expand the source pack with current official pages, customer procurement records, and product summaries for
      remaining niche vendors.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized pricing and discounting
    missingEvidence: Actual discount waterfall, realized contract values by module, and competitive pricing sheets across recent deals.
    whyItMatters: >-
      Without realized pricing, the public record cannot show whether Teamworks wins on premium bundle value,
      discounting, or segment selection.
    diligencePath: >-
      Request recent pricing approvals, deal desks, and competitive quote sheets segmented by pro, college, and
      governing-body customers.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: module attach rates and win-loss data
    missingEvidence: Product-level attach rates, logo-to-ARR mix, renewal cohorts, and closed-lost reasons by module.
    whyItMatters: >-
      These metrics determine whether Teamworks’ suite moat is deep or whether customers remain shallowly attached to
      one or two modules.
    diligencePath: Review board reporting, product dashboards, and CRM win-loss notes for the last twelve months.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: missing-source
    severity: material
    topic: likely entrant roadmaps
    missingEvidence: >-
      Current roadmaps or M&A signals from Hudl, Catapult, Sportradar, and Genius about moving deeper into team workflow
      software.
    whyItMatters: >-
      Entry risk may accelerate if adjacent vendors decide to move from data or analysis into orchestration and
      decision-support workflows.
    diligencePath: >-
      Collect 2026 release cadence, investor commentary, and corporate-development updates for the named adjacent
      vendors.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: commoditization versus specialist choice
    missingEvidence: >-
      Churn reasons, replacement reasons, and customer interviews explaining why buyers stay multi-homed or replace
      Teamworks with specialists.
    whyItMatters: >-
      Public evidence shows specialist wedges, but it cannot distinguish simple price pressure from deliberate
      best-of-breed workflow decisions.
    diligencePath: >-
      Request churn analyses, closed-lost categories, and reference calls from accounts that expanded or contracted
      their Teamworks footprint.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-disclosure
    missingEvidence: Module-level ARR, gross margin, CAC, payback, net retention, churn, and services mix by product family.
    whyItMatters: >-
      These are the core inputs for deciding whether Teamworks deserves a premium software multiple or is carrying
      hidden service and support burden.
    diligencePath: >-
      Request CFO reporting package with ARR bridge, cohort retention, gross-margin waterfall, sales-efficiency
      dashboard, and implementation-versus-support cost detail.
    relatedQuestionRefs:
      - QI011
      - QI012
      - QI027
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-disclosure
    missingEvidence: >-
      Latest cash balance, restricted cash, monthly burn, runway, debt facilities, seller notes, and acquisition
      earn-out schedule.
    whyItMatters: >-
      Fundraising history alone cannot show whether Teamworks has ample runway or whether acquisitions and new payment
      workflows have created hidden balance-sheet pressure.
    diligencePath: >-
      Request latest balance sheet, cash-flow statement, debt schedule, contingent consideration roll-forward, and
      board-approved base/downside runway model.
    relatedQuestionRefs:
      - QI014
      - QI018
      - QI028
    relatedTableRefs:
      - TI004
      - TI005
