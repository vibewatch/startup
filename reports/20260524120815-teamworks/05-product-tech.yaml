  - TE004
- id: roadmap-signals-and-open-gaps
  title: Roadmap signals and open diligence gaps
  body: 'Roadmap signals from 2023 onward point to a company prioritizing consolidation, cross-product workflow depth, and data-asset integration. PR Newswire framed the ARMS acquisition as a way to accelerate continued integrations across the operating system, while Forbes reported that Teamworks also needed several quarters to digest and integrate the wave of recent acquisitions. The 2024 integration releases around ARMS, Hub, and INFLCR show genuine workflow progress, and the 2024-2026 AI and analytics acquisitions give the platform more proprietary data and model depth. Even so, the public record still stops short of proving how completely those assets are unified in day-to-day operator workflows or how broadly customers buy across the stack. That leaves the core underwriting split unchanged: Teamworks has a credible module map, visible integration motion, and a real AI roadmap, but later diligence still needs operational proof on attach rates, uptime, API depth, and trust controls before
    treating the entire surface as mature and uniform.'
