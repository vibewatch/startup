- id: ai-analytics-and-decision-support
  title: AI, analytics, and decision-support assets
  body: The most important product expansion story is Teamworks' move from workflow software into data and decision support. Intelligence is marketed around machine learning and predictive models, and the recruiting launch argues that many college programs do not have the in-house engineering capacity to operationalize modern player-tracking and play-by-play data on their own. GM extends that logic into budgets and roster construction by centralizing athlete-earnings data, linking it to Compliance and Intelligence, and now surfacing football metrics such as Player Impact, Snap Count, Play Speed, and Change of Direction directly inside profiles. The acquisition trail gives substance to that strategy. Zelus brought the Data Engine and Titan Intelligence; Telemetry added coaching workflows and vision-linked football tooling; Sportlogiq added automated tracking and research depth; PFF added football data; and Opteamal extended athlete-monitoring reach in European football. The result is not
    yet a fully proven unified analytics stack in public, but the asset map is real and materially broader than simple marketing copy about AI.
