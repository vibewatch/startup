- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Public evidence
  - Scope
  - Buyer implication
  - Gap
  rows:
  - - Processor posture
    - Privacy policy
    - Teamworks says it acts as processor for service data
    - Useful baseline for enterprise procurement
    - No public DPA package in fetched pack
  - - Subprocessor disclosure
    - Privacy policy
    - AWS, Twilio, DocuSign and other partners are named
    - Gives buyers starting visibility into data-handling chain
    - No public control-attestation package attached
  - - Age and data-use boundary
    - Privacy policy
    - Services are not intended for children under 13
    - Relevant because athlete populations can include minors
    - No public youth-specific control narrative beyond policy text
  - - Cross-border transfer caveat
    - Privacy policy
    - Data may be transferred across jurisdictions and transmission cannot be fully guaranteed secure
    - Reasonable legal disclosure but still a risk boundary
    - No public residency or encryption architecture detail
  - - Public support surface
    - AMS help center, Recruiting Communications help center, Staff Resources
    - Public sign-in and mobile-app endpoints plus support entry points exist
    - Shows operational continuity and onboarding surface
    - Depth of public troubleshooting material is limited
  - - Customer SSO / integration proof
    - Charleston sole-source document
    - Hub described as single-sign-on core tied to Compliance and Academics
    - Suggests workflow stickiness once installed
    - No public uptime or support-resolution metrics
  notes: Trust evidence in this chapter comes from policy, help, and procurement surfaces; it is materially thinner than the product-marketing surface and should not be mistaken for a full trust center.
