  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-evidence
    missingEvidence: A public status page, uptime history, incident archive, or SLA disclosure for Hub, AMS, Recruiting, or GM.
    whyItMatters: Core operational and roster workflows can become mission-critical for athletic departments, but the fetched public pack does not quantify uptime or incident response.
    diligencePath: Request customer-facing SLA terms, uptime reports, and any public or private status-page history from Teamworks during management diligence.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Public trust-center material covering certifications, audits, DPA terms, or control attestations beyond the privacy policy.
    whyItMatters: Processor posture and subprocessor disclosure help, but enterprise buyers still need auditable evidence on security controls and contractual data-protection commitments.
    diligencePath: Request SOC 2 or ISO reports, DPA templates, penetration-test summaries, and security-questionnaire responses from Teamworks.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-attach-and-adoption
    missingEvidence: Module-level attach rates, MAU/DAU by product surface, customer renewal rates, and the share of customers buying multi-module bundles.
    whyItMatters: The public record proves breadth and bundling potential, but not how deeply the installed base is monetizing across the stack.
    diligencePath: Request cohort-level product adoption, attach-rate, and renewal data by customer segment and sport.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: api-and-integration-depth
    missingEvidence: Public API references, webhook/event docs, or connector catalogs that show endpoint depth beyond marketing-level statements.
    whyItMatters: API claims matter most when assessing implementation cost, systems-of-record fit, and the likelihood of durable cross-product adoption.
    diligencePath: Ask for developer documentation, sample payloads, connector inventories, and implementation guides during technical diligence.
    relatedQuestionRefs:
    - QE010
    relatedTableRefs:
    - TE003
