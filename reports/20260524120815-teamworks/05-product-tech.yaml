- id: architecture-and-integration-workflows
  title: Architecture and integration workflows
  body: Public materials repeatedly point to a shared architecture built around common identity, navigation, profiles, calendars, and tasks. The OSS integrations page explicitly says Teamworks has already integrated those shared components across products, while Hub and OSS materials together show one Teamworks ID, shared navigation, and customer-facing APIs for profile and calendar data. That pattern then appears in concrete workflow integrations. Recruiting can promote a recruit into Hub. ARMS and Whistle added hourly sync and unified recruiting boards. Hub-ARMS Tasks brought compliance actions into the same mobile surface. The 2024 integration wave deepened that pattern with one login, app switching, CARA logs in the app, and recruit creation in Hub. On the performance side, Teamworks says Nutrition uses an open API into AMS and that Smartabase or AMS can aggregate upstream feeds such as GPS, force plates, motion capture, S&C, and nutrition data. Taken together, the public architecture
    looks less like a monolith and more like a shared control plane sitting above specialist workflow modules and external data inputs.
