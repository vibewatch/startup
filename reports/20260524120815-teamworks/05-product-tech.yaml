  rows:
  - - Hub
    - Athletes, coaches, operations staff
    - Daily command center for rosters, schedules, messages, travel, and tasks
    - Profiles, calendars, Teamworks ID, Hub API
    - Mature core surface with customer procurement proof
    - Need attach-rate and retention data by segment
  - - Operations
    - Operations and equipment staff
    - Logistics, communication, inventory
    - Shared identity and athlete/staff records via Hub
    - Clear current landing page but limited public product-depth detail
    - Need module-specific customer proof and workflow telemetry
  - - AMS
    - Sports scientists, athletic trainers, performance staff
    - Central performance and athlete-management record
    - Mature API; nutrition and third-party performance feeds
    - Strong public positioning plus Smartabase continuity
    - Need public API depth and implementation evidence
  - - Nutrition / S&C
    - Dietitians and strength coaches
    - Meal planning, nutrition monitoring, personalized training
    - Open API into AMS; unified athlete app within Performance
    - Real integration examples but limited public pricing/GA detail
    - Need product-level adoption and usage metrics
  - - Recruiting + Recruiting Communications + ARMS workflows
    - Recruiting staff, compliance, coaches
    - Prospect evaluation, communications, compliance, onboarding
    - Boards sync, hourly data flow, recruit promotion into Hub
    - High visible integration velocity since 2023
    - Need proof of workflow depth outside marketing use cases
  - - Intelligence
    - Analysts, personnel, front-office leaders
    - Predictive evaluation, roster construction, game preparation
    - Consumes player-tracking and play-by-play data; tied to GM
    - AI positioning is strong and acquisition-backed
    - Need customer evidence outside marquee sports
  - - General Manager
    - ADs, NIL directors, team GMs, coaches
    - Budgeting, earnings allocation, roster planning
    - Compliance + Intelligence + PFF player insights
    - Newer module with active feature expansion
    - Need broad customer deployment proof and non-football evidence
  - - Acquired analytics assets
    - Analysts, coaches, front office
    - Warehouse, video, tracking, football data, athlete monitoring
    - Zelus, Telemetry, Sportlogiq, PFF, Opteamal
    - Real asset breadth from 2024-2026 M&A
    - Need proof of one operator workflow across all assets
  notes: Rows mix currently branded modules and material acquired assets; maturity labels reflect public evidence depth, not internal roadmap certainty.
