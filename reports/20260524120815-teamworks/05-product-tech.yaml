- id: trust-privacy-and-operational-support
  title: Trust, privacy, and operational-support signals
  body: 'The public trust posture is real but thinner than the product map. Teamworks'' privacy policy clearly states that the company acts as a processor for service data, discloses a subprocessor set that includes AWS, Twilio, and DocuSign, states that services are not intended for children under 13, and acknowledges both cross-border transfers and the inherent limits of digital-transmission security. Public technical and support surfaces also exist. Teamworks maintains public AMS and Recruiting Communications help-center entry points, a staff-resources page with sign-in and mobile-app links, and transition pages that explain how Smartabase and Whistle were rebranded into Teamworks AMS and Teamworks Recruiting Communications. Customer procurement material from Charleston adds another operational signal by describing single sign-on and direct integration between Hub and already-installed Compliance and Academics tools. What remains missing from the public pack is the deeper reliability
    and assurance layer enterprise buyers often expect: status evidence, uptime reporting, and certification detail do not appear with the same specificity as product marketing.'
  claimRefs:
  - CE035
  - CE036
  - CE037
  - CE038
  - CE039
  - CE040
  - CE041
