- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Exposure type
  - Impact on thesis
  - Current public evidence
  - Diligence path
  rows:
  - - Hub-to-suite cross-sell
    - Expansion driver
    - Supports higher wallet share per customer and deeper stickiness
    - Bates, Memphis, Charleston, and Texas A&M all show multi-product or bundle logic
    - Request attach-rate, bundle discounting, and module gross margin by segment
  - - Olympic and NGB international motion
    - Expansion driver
    - Diversifies beyond U.S. college athletics and pro clubs
    - Aquatics GB, Swim England, Team Netherlands, and dedicated Olympics page support the motion
    - Request regional revenue split and win-rate by geography
  - - League / conference channel sales
    - Expansion driver
    - Can accelerate density within a sport or institutional cohort
    - Customer-stories index lists conference and association partnerships
    - Request pipeline mix for conference-wide versus single-team deals
  - - Football analytics acquisitions
    - Expansion driver
    - Adds every NFL team and 240+ Division I football programs to the broader ecosystem
    - PFF materials support the customer carryover
    - Separate organic cross-sell from acquired installed base in diligence
  - - Embedded module interoperability
    - Potential moat
    - Can raise switching costs once multiple modules are in place
    - Charleston sole-source note explicitly cites existing Compliance and Academics usage
    - Review win-loss data when incumbency exists versus when Teamworks is challenger
  - - Competitive procurement pressure
    - Risk
    - Win rates may compress if budgets are rebid against analytics and workflow specialists
    - Maine RFP listed Teamworks with Trackman, TruMedia, and Concourse
    - Collect recent public RFPs and private win-loss summaries
  - - Vendor-authored proof bias
    - Risk
    - Can overstate customer quality relative to renewals or ROI
    - Most detailed evidence in this chapter comes from Teamworks-authored stories
    - Request customer-reference calls and third-party review corpus
  - - Customer trust / data-rights dispute
    - Risk
    - Could matter more as Teamworks expands into analytics and proprietary decision support
    - Phillies/Zelus litigation alleges exclusivity conflicts around analytics models
    - Track resolution, remediation, and customer contract language around exclusivity
  - - Unknown top-customer concentration
    - Risk
    - Could hide dependence on a narrow set of elite leagues or flagship departments
    - No public ARR mix or top-account exposure found
    - Request concentration by league, segment, and top-10 accounts
  notes: 'This table blends upside and risk because Teamworks’ expansion engine and its concentration exposure are driven by many of the same facts: elite customers, big bundles, and specialized workflows.'
