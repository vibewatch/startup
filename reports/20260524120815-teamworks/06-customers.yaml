  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, logo churn, average contract length, and renewal cohorts by product line.
    whyItMatters: Without retention math the public corpus can show deployment depth but not durable customer economics or true product-market resilience.
    diligencePath: Request cohort retention decks, renewal waterfall data, and standard contract terms by segment.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU028
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer exposure, segment-level ARR mix, and revenue concentration by league, conference, or sport.
    whyItMatters: Teamworks serves elite institutions, so concentration can materially change downside risk even when logo count looks broad.
    diligencePath: Ask management for concentration tables and customer ARR by segment, league, and geography.
    relatedQuestionRefs:
    - QU024
    - QU028
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: independent-proof
    missingEvidence: Independent customer references, review data, or third-party case studies that verify outcomes beyond Teamworks-authored stories.
    whyItMatters: Vendor-authored proof can establish fit but may overstate satisfaction, ROI, or deployment completeness.
    diligencePath: Obtain direct customer calls in each core segment and pull any third-party review corpus or conference presentations.
    relatedQuestionRefs:
    - QU019
    - QU026
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: material
    topic: analytics-trust
    missingEvidence: Resolution documents, settlement terms, or customer remediation details for the Phillies and Zelus dispute.
    whyItMatters: The litigation may not be financially material, but it is the clearest public customer-trust signal attached to an acquired analytics product.
    diligencePath: Track docket developments and ask management how exclusivity, model ownership, and customer trust controls changed after the dispute.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU006
