chapter:
  number: 6
  title: Customers
  summary: Teamworks’ public customer evidence supports a broad elite-sports footprint spanning college athletics, pro clubs, leagues, and Olympic or national governing-body programs, with the strongest proof clustered around Hub and AMS as system-of-record workflows. Named deployments at Melbourne City, Aquatics GB and Swim England, Bates, Team Netherlands, Pittsburgh, Memphis, Austin FC, Baylor, Bristol City, and the NWSL support real production use and visible cross-sell depth, while procurement documents suggest six-figure collegiate ACV and sticky bundle economics. The main gap is not whether Teamworks has customers; it is that public proof remains overwhelmingly vendor-authored and says almost nothing about NRR, churn, contract length, or top-customer concentration.
sections:
- id: segmentation-and-installed-base
  title: Segmentation, buyer map, and installed-base shape
  body: 'Teamworks’ public customer record is unusually concentrated in elite-sports institutions rather than in mass-market teams or consumer sports apps. The buyer and payer is rarely the same person as the end user: athletic directors, operations executives, finance leaders, and NGB administrators appear to buy the system, while athletes, coaches, medical staff, league officials, and even family members are the daily users. The product footprint also segments clearly by job-to-be-done. Hub and Operations material anchor Teamworks as the system of record for rosters, calendars, travel, messages, and files; AMS appears where performance and medical data need to be centralized; Memphis adds a newer NIL and revenue-sharing buyer; and public procurement shows college athletics buyers can purchase broad bundles rather than single features. Scale claims are large enough to matter: Teamworks says it served more than 6500 elite teams in 2025 and more than 7000 organizations by March 2026, while
    its own financing materials claim deep penetration in the NFL, NCAA Division I, Olympic federations, and other major leagues. The important nuance is that these are installed-base claims, not revenue-quality disclosures. They prove reach and category relevance, but they do not by themselves prove durable multi-product ARR across the whole footprint.'
