- id: retention-visibility-quality-gaps-and-risk
  title: Retention visibility, evidence-quality gaps, and customer trust risk
  body: The biggest diligence gap is not a shortage of named customers; it is the lack of public evidence on customer quality. No reviewed source disclosed NRR, GRR, churn, contract length, customer concentration, or segment-level ARR mix. Even the strongest case studies are overwhelmingly vendor-authored, which means they do a good job of illustrating workflow fit but a weak job of proving renewal economics or independently measured outcomes. Public proof therefore supports a conclusion that Teamworks is deeply embedded in elite-sports workflows, but not that its installed base is uniformly high-value or equally durable across segments. This matters more because Teamworks is moving further into sensitive data and decision-support use cases. The Phillies and Zelus dispute is not a broad churn event, but it is a real customer-trust signal attached to an acquired analytics asset and raises the possibility that exclusivity, data-rights governance, and acquired-customer obligations can become
    meaningful in later diligence. Investors should read the customer chapter as strong on segmentation and deployment proof, decent on expansion logic, and still underpowered on retention math, independent satisfaction evidence, and concentration analysis.
