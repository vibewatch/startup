- id: named-proof-and-international-depth
  title: Named proof, deployment depth, and international breadth
  body: The strongest evidence in this chapter comes from named deployments that go beyond logos and identify actual workflows or stakeholders. Melbourne City used Hub and AMS during a move into a new training facility and described an in-season implementation across two professional and six academy teams. Aquatics GB and Swim England adopted Hub and AMS for athletes, coaches, medical teams, and performance staff, explicitly tying the rollout to data-driven performance decisions ahead of LA 2028. Bates is a useful lower-resource proof point because it had already implemented Hub and Compliance plus Recruiting before making AMS the next step in its roadmap, framing the purchase as a way to reduce staff burden rather than add another system. Team Netherlands shows Olympic customization, with sport-specific data and workflow views by federation. In North America, the Penguins provide the longest visible durability signal, Austin FC adds current AMS proof in MLS, Memphis shows Teamworks moving
    into NIL and revenue-sharing administration, Baylor shows daily Hub usage in women’s college basketball operations, and the NWSL story claims near-leaguewide Hub penetration. Bristol City adds a second international club-soccer logo, helping confirm that Teamworks’ customer proof is not just North American or college-centric. The chapter therefore supports real multi-segment adoption, with especially strong proof in pro clubs, NCAA departments, and Olympic or NGB environments.
