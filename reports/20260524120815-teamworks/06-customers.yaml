- id: durability-expansion-and-procurement-economics
  title: Durability signals, land-and-expand motion, and procurement economics
  body: Teamworks looks more durable where the public record shows either long tenure or module expansion. The Penguins’ use of Hub since 2014 is the cleanest long-duration proof. Bates moved from Hub and Compliance plus Recruiting into AMS, Memphis added General Manager and Wallet for the revenue-sharing era, and Charleston’s sole-source justification explicitly said Hub was needed because Compliance and Academics were already in place. Texas A&M’s contract suggests that at least some collegiate customers buy Teamworks as a broad bundle with six-figure annual value rather than as a narrow point solution. That is important because it implies Teamworks can deepen wallet share inside existing accounts, not just count more logos. At the same time, public evidence also shows that expansion is not frictionless. The Maine RFP shows Teamworks still appears in competitive procurements alongside Trackman, TruMedia, and Concourse, and PFF Enterprise illustrates that some customer expansion is arriving
    through acquisition rather than purely organic cross-sell. The practical conclusion is that Teamworks appears to have a credible land-and-expand engine, but the balance between organic module attach, acquired customer base, and procurement win rate is still opaque.
