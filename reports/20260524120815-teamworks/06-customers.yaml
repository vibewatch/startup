figures:
- id: FU001
  title: Elite-sports customer journey map
  type: journey-map
  layout: wide
  summary: Public proof suggests Teamworks wins when a sports organization wants one operating system to connect operations, performance, and expanding adjacent workflows.
  data:
    items:
    - label: Athletic department or club operations leader
      actor: Athletic department or club operations leader
      touchpoints:
      - Workflow sprawl across calendars, travel, files, and communication
      - Hub evaluation as single source of truth
      - Rollout to staff, athletes, and sometimes families
      emotion: Needs fewer handoffs and fewer missed details
      painpoint: Too many point tools and manual coordination loops
      opportunity: Teamworks becomes daily operating infrastructure
    - label: Performance and medical team
      actor: Performance and medical team
      touchpoints:
      - Need centralized athlete data and cross-functional visibility
      - AMS configured to match sport-specific workflows
      - Dashboards and reporting adjusted by in-house staff
      emotion: Wants better insight without adding admin burden
      painpoint: Fragmented data and weak collaboration between departments
      opportunity: AMS can attach after Hub or land directly in a performance use case
    - label: NIL or revenue-sharing administrator
      actor: NIL or revenue-sharing administrator
      touchpoints:
      - Manual spreadsheets and contract tracking become unscalable
      - General Manager and Wallet introduced for budgeting, contracting, and payments
      - Athlete and coach workflows moved into a controlled system
      emotion: Needs auditability and scale with lean staff
      painpoint: Version control, payment complexity, and compliance risk
      opportunity: Newer modules expand Teamworks beyond classic team operations
    - label: League office, NGB, or Olympic program leader
      actor: League office, NGB, or Olympic program leader
      touchpoints:
      - Need one channel across clubs, teams, or federations
      - Deploy Hub or AMS across distributed stakeholders
      - Use same system to coordinate major-event preparation and communication
      emotion: Needs standardization across many entities and time zones
      painpoint: Stakeholders are dispersed across teams, countries, and disciplines
      opportunity: International and league-level sales motion compounds footprint density
  claimRefs:
  - CU012
  - CU015
  - CU032
  - CU041
  - CU042
  - CU045
