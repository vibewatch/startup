summary:
  headline: |
    Teamworks 看起来是精英体育垂直软件平台龙头：联盟渗透异常深，工作流套件很宽，AI 取向收购也强；但当前 $1B+ 估值压在一份公开记录上，后者对规模和融资讲得多，对收入质量、利润率结构和整合经济性讲得少。
