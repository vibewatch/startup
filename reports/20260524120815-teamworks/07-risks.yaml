  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer revenue mix by end market
    missingEvidence: Segmented ARR, customer count, and renewal data showing how much Teamworks revenue comes from college, pro, Olympic, tactical, and governing-body buyers.
    whyItMatters: Without end-market mix, it is hard to quantify how exposed Teamworks is to collegiate budget pressure versus more stable pro or international spending.
    diligencePath: Request cohort revenue by customer segment, module attach, churn, and renewal timing for college versus non-college accounts.
    relatedQuestionRefs:
    - QR029
  - type: enumeration-incomplete
    severity: material
    topic: TR001 legal and regulatory universe
    missingEvidence: Complete Common Pleas pleadings, reserve analysis, indemnities, and any other active legal or regulatory matters touching analytics exclusivity, privacy, or athlete payments.
    whyItMatters: The public record is enough to show material exposure, but not enough to bound downside, reserve needs, or precedent risk across other customer contracts.
    diligencePath: Obtain outside-counsel matter list, current pleadings, board or finance reserve memos, and any customer contract provisions governing analytics exclusivity or data rights.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: post-acquisition integration KPIs
    missingEvidence: Migration milestones, cross-sell rates, duplicated-platform sunset plans, product attach, and support metrics for Zelus, Telemetry, Sportlogiq, PFF, and Opteamal.
    whyItMatters: Public deal announcements prove breadth, but not whether the acquired businesses are integrating cleanly enough to justify platform-level upside.
    diligencePath: Request integration scorecards, cross-sell conversion by acquired asset, product roadmap dependencies, and customer migration dashboards.
    relatedQuestionRefs:
    - QR031
  - type: missing-source
    severity: material
    topic: privacy and security assurance for Wallet, GM, and Intelligence
    missingEvidence: SOC reports, penetration-test summaries, DPA language, subprocessor detail, and any external privacy or security certifications tied to the new payment and analytics workflows.
    whyItMatters: Policy language alone does not show that Teamworks has operational controls strong enough for merged athlete, payment, and analytics data flows.
    diligencePath: Request security assurance packages, privacy-control ownership matrix, audit scope, incident history, and data-retention settings for each relevant product.
    relatedQuestionRefs:
    - QR032
