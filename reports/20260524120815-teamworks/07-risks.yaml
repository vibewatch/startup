- id: payments-privacy-and-data-rights
  title: Payments, privacy, and data-rights exposure now sit inside the product surface
  body: 'Teamworks'' risk surface is broader than legacy communications or scheduling software. Wallet pushes the company into payment timing, withholding, IRS remittance, and international-athlete tax workflows; the privacy policy reserves wide rights to collect data from schools, governing bodies, partners, and data providers, to combine data sets for analytics, and to transfer data in legal processes or acquisitions; and the Phillies-Zelus dispute shows how quickly analytics products can become entangled in exclusivity, IP, and customer-trust fights. The Wallet material is especially important because it shows Teamworks taking on operational steps that are closer to regulated financial plumbing than pure workflow automation: W-8BEN collection, withholding calculations, 1042-S issuance, and remittance when the institution appoints Teamworks as withholding agent. At the same time, the privacy policy openly contemplates subprocessor use, business-partner sharing, FERPA handling, CPRA rights,
    and data transfers in a sale or merger. That means every new product and acquisition adds governance work around access controls, data provenance, and institutional consent. The Zelus case is the clearest adverse manifestation of that risk. Even without an injunction, a live dispute over who can commercialize analytics components to rivals is exactly the kind of issue that can unsettle customers deciding whether to centralize roster valuation and contract strategy inside Teamworks.'
