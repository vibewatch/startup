- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - College budget pressure
    - School deficits, student-fee increases, sponsorship backfill, or slower collegiate pipeline conversion
    - Evidence that the settlement era is raising procurement friction faster than it raises software urgency
    - Cut near-term college expansion assumptions and demand cohort-by-cohort renewal data
  - - Rule volatility in revenue sharing / NIL oversight
    - NCAA or CSC changes that force product rework or change reporting standards mid-cycle
    - Multiple major workflow changes inside one academic year
    - Raise implementation-cost assumptions and re-underwrite margin for collegiate products
  - - Zelus / data-rights litigation
    - Restrictive settlement, adverse ruling, or discovery showing broader customer-rights tension
    - Any event that limits how Teamworks can commercialize Titan / Intelligence assets
    - Mark down analytics-platform upside and require legal reserve visibility before relying on expansion scenarios
  - - Privacy or payment-compliance failure
    - Payment delays, withholding mistakes, privacy complaints, or audit findings
    - Repeated workflow errors or any material regulatory inquiry
    - Assume higher support cost, slower customer trust formation, and more conservative attach rates for Wallet
  - - Acquisition integration miss
    - Duplicative platforms remain, migration slips, or cross-sell evidence does not appear
    - Key acquired assets still operate as silos after the planned integration window
    - Cap synergy assumptions and treat platform breadth as complexity rather than leverage
  - - Founder / key-person concentration
    - Strategic cadence slows or leadership turnover disrupts product coordination
    - Visible dependency on Maurides becomes a bottleneck rather than an amplifier
    - Apply a higher execution discount and demand clearer ownership of acquired-business roadmaps
  notes: The triggers here are intentionally observable so the chapter can be refreshed against concrete events rather than qualitative impressions alone.
