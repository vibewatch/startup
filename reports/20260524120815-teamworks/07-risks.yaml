- id: monitoring-and-kill-criteria
  title: The investable posture depends on observable triggers rather than broad category optimism
  body: 'The right way to underwrite Teamworks is to watch the junctions where external pressure and internal complexity meet. If college programs keep opting in to revenue sharing but athletic departments show rising deficits, procurement slowdowns, or a heavier dependence on sponsorship backfill, the company may still win logos while seeing tougher budget negotiations. If Wallet keeps expanding, diligence should look for payment errors, withholding exceptions, complaint volume, and the depth of privacy or security assurance behind the policy language. If the Phillies-Zelus dispute produces adverse rulings, restrictive settlement terms, or discovery that exposes broader customer-rights tension, the analytics-upside narrative should be marked down immediately. And because recent growth is tied to acquired analytics assets, migration milestones, cross-sell evidence, and platform rationalization matter more than headline deal volume. The kill criteria below therefore focus on events that management
    cannot spin away: customer budget strain, compliance failures, litigation setbacks, integration misses, and any sign that founder-centered execution is becoming a bottleneck rather than an edge. Public evidence is good enough to rank those risks now, but not good enough to clear them without deeper customer, legal, and systems diligence.'
