company:
  name: Teamworks
chapter:
  number: 7
  title: Risks
  summary: Teamworks most material risks cluster around NCAA budget pressure and House-era rule volatility, Zelus-linked data-rights litigation, and the operational complexity created by moving from workflow SaaS into payments, tax, and integrated analytics. The same forces making GM, Wallet, and Intelligence strategically relevant also make the business more sensitive to customer budget cycles, privacy and compliance mistakes, acquisition integration misses, and founder-centered execution.
sections:
- id: college-demand-and-budget-volatility
  title: College demand tailwinds are real, but NCAA budget pressure can still squeeze spend
  body: 'Teamworks'' most urgent growth wedge is now tied directly to the most financially stressed buyer cohort in U.S. sports. The company says General Manager serves 98% of Division I NCAA institutions and that Wallet is already trusted by more than 700 NCAA institutions, which means Teamworks is not just adjacent to the House-era transition; it is selling directly into it. NCAA rule changes now allow schools that opt in to provide up to $20.5 million in direct financial benefits to student-athletes and require technology platforms for payment monitoring and third-party NIL agreement reporting. That creates obvious product demand for GM, Wallet, and adjacent compliance workflows. The risk is that the same sources describing the opportunity also describe buyer stress. University Business, OVG, SportsRecruits, Opendorse, and RallyFuel all depict a market where schools are adding new athlete-payment obligations, searching for sponsorship and auxiliary revenue, and coping with continuing
    rule uncertainty. For Teamworks, this can produce a two-speed customer outcome: stronger urgency for planning and payments software at the top of the market, but slower procurement, tighter budgets, and more ROI scrutiny across the rest of Division I. If revenue-sharing costs are treated as non-discretionary while software budgets remain contestable, college demand may stay large but become more cyclical and politically visible.'
