company:
  name: Teamworks
chapter:
  number: 1
  title: Company Overview
  summary: Teamworks is a Durham, North Carolina sports-technology company whose current official materials describe a 2006 founding, 485+ employees, roughly $400M in cumulative funding, and a global footprint spanning 17 countries. The company raised a $235M Series F in June 2025 at a pre-money valuation above $1B, then expanded its AI/data stack through acquisitions including Telemetry Sports, Zelus Analytics, Opteamal, Sportlogiq, and PFF Enterprise. Public evidence strongly supports category leadership in pro, college, and Olympic sports software, but exact founding-year history, cap-table terms, board structure, and the conversion of logo count into paying ARR remain partially opaque.
sections:
- id: identity-founding
  title: Identity, founding arc, and operating-system positioning
  body: 'Teamworks positions itself as "The Operating System for Sports," a unified software stack spanning talent acquisition, operations, athlete development, and performance workflows for elite sports organizations. The company’s current official pages anchor its roots in Durham, North Carolina and describe a mission to empower athletes and the coaches, administrators, and performance staff who support them with technology. Independent and investor-backed coverage ties that positioning to founder Zach Maurides’ experience as a Duke football player who saw how fragmented communication, scheduling, and athlete-support workflows were inside a major college program. Delta-v Capital’s Teamworks case study says Maurides set out to build Teamworks in 2006 after recognizing those workflow gaps, while a Forbes profile says he conceived the business in 2005 while playing at Duke. At the same time, one June 2025 SportsPro article described Teamworks as founded in 2004, which creates a narrow but
    real chronology discrepancy in the public record. This chapter therefore treats 2005-2006 as the company’s clear origin arc, uses 2006 as the best-supported operating founding year from current official and investor materials, and preserves the conflicting 2004 reference as an evidence gap rather than forcing false precision. What is not disputed is the business model direction: Teamworks has expanded from communication and scheduling roots into a broad vertical SaaS platform built specifically for professional, collegiate, Olympic, and tactical sports use cases.'
