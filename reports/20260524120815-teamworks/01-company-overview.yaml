- id: scale-and-market-presence
  title: Scale markers, customer reach, and global market presence
  body: 'The strongest public proof of Teamworks’ commercial scale comes from the company’s own funding and acquisition releases rather than from audited financial disclosure. The June 2025 Series F announcement said Teamworks powered more than 6,500 elite sports teams globally and claimed preferred-technology status across 100% of NFL teams, 90% of MLB and Premier League clubs, 87% of NBA teams, 83% of MLS clubs, 81% of NHL teams, 99% of Division I NCAA athletic departments, and more than 65 Olympic federations across 24 countries. By March 2026, the PFF Enterprise acquisition release updated the scale language to more than 7,000 elite sports organizations globally, reinforcing the view that the company continued adding logos or counting additional entities after the Series F close. Teamworks’ current About page provides a different but complementary set of official maturity markers: 485+ employees, roughly $400M in funding, and a 17-country footprint supported by a 24x7x365 service model.
    The mismatch between the 24-country figure in 2025 financing coverage and the 17-country figure on the 2026 About page likely reflects a methodology change between "countries served" and countries with direct operating presence, but the discrepancy should still be acknowledged. What seems beyond serious dispute is that Teamworks has become deeply embedded in major North American professional leagues, elite college athletics, and Olympic/NGB environments. The open diligence question is whether those penetration metrics translate cleanly into durable multi-module ARR rather than a large installed base with uneven contract depth.'
  claimRefs:
  - CO037
  - CO038
