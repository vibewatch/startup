  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: Exact incorporation filing, early cap-table documents, or archived official company materials that reconcile 2004 versus 2006 public references.
    whyItMatters: Founding chronology is a core overview fact and affects how long the company has had to build product, relationships, and scale.
    diligencePath: Obtain Delaware incorporation records, earliest financing documents, and archived company bios from management.
    relatedQuestionRefs:
    - QO001
    - QO025
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: Current board roster, board committee structure, fully diluted cap table, investor rights summary, and liquidation preferences.
    whyItMatters: Public valuation headlines are hard to underwrite without knowing control rights, dilution, and preference overhang.
    diligencePath: Request board materials, charter documents, stock ledger, and most recent financing documents.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Paying-customer count, ARR by product and cohort, renewal schedule, and concentration metrics behind the 6,500-team and 7,000-organization disclosures.
    whyItMatters: Logo or organization counts do not automatically translate into durable revenue quality or contract depth.
    diligencePath: Request customer-level ARR, logo-to-account mapping, cohort retention, and expansion data.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: geography-count
    missingEvidence: Methodology defining the 17-country figure on the current About page versus the 24-country figure in the 2025 Series F materials.
    whyItMatters: Geographic reach is a public scale KPI and should not drift across materials without explanation.
    diligencePath: Ask management to reconcile whether one number reflects countries served and the other direct operating presence.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: litigation-exposure
    missingEvidence: Complaint, contracts, damages theory, insurance coverage, and post-acquisition indemnity or escrow protections tied to the Phillies/Zelus dispute.
    whyItMatters: Inherited analytics-IP disputes can affect customer trust, legal cost, and acquisition economics.
    diligencePath: Request the acquisition agreement, litigation memo, outside counsel assessment, and any settlement or reserve analysis.
    relatedQuestionRefs:
    - QO023
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: TO002 leadership and governance coverage
    missingEvidence: Board roster, committee structure, deeper executive bench, and succession documentation beyond the public founder and C-suite roster.
    whyItMatters: The leadership table is intentionally partial, and governance opacity limits confidence in key-person risk and oversight quality.
    diligencePath: Request board deck materials, committee charters, org chart, and succession plans from management.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
