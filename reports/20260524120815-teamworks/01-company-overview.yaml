- id: capital-and-ma
  title: Funding history, investor base, and acquisition-driven expansion
  body: Public financing sources reconstruct a strong round-by-round capital story from 2020 onward. BusinessWire records a $25M Series C led by Delta-v Capital in April 2020, with new participation from Afia Capital and Stadia Ventures plus returning investors such as General Catalyst and Seaport Capital. Teamworks’ own Series D announcement then showed the company raising $50M in June 2022, again led by Delta-v and joined by Seaport, General Catalyst, Teamworthy Ventures, Blossom Street Ventures, Afia Capital, and a broad syndicate of current and former professional athletes. The next capital step was a $65M Series E in April 2023 led by Dragoneer Investment Group, announced alongside the acquisition of ARMS Software and bringing disclosed cumulative funding to $165M at that point. The inflection event came on June 17, 2025, when Teamworks announced an oversubscribed $235M Series F led by returning investor Dragoneer at a pre-money valuation above $1B. Current official company materials
    now state roughly $400M of funding, implying that undisclosed early rounds and later strategic additions bridge the gap between the publicly itemized 2020-2025 rounds and today’s cumulative total. Capital has not been used only to extend runway; it has visibly financed platform breadth. Between 2024 and 2026 Teamworks bought Zelus Analytics, Telemetry Sports, Opteamal, Sportlogiq, and PFF Enterprise, extending the company beyond workflow software toward a more ambitious data-and-intelligence stack. That acquisition cadence creates a plausible category-consolidation story, but it also means later diligence must separate organic module expansion from growth bought through M&A.
