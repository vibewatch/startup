    columns: [Offer, Public price, Disclosed unit or term, Discount evidence, Financial implication]
    rows:
      - [New-Scale cloud products, null, "Daily ingest volume; reseller SKUs reportedly sized in GB/day", "No public realized-price or discount data", "Telemetry growth can expand billings, but optimization can reduce payable ingest"]
      - [Federated search and third-party storage, null, "Configuration-dependent; contract unit not disclosed", "No public data", "Customer cost control may aid retention while reducing storage monetization"]
      - [Self-hosted LogRhythm SIEM, null, "License and support entitlement referenced; duration and metric undisclosed", "No public data", "Renewal and upgrade economics cannot be modeled"]
    notes: "Null means no public list or realized price in the assigned evidence; obtain order forms, discount waterfalls, and renewal cohorts."
    claimRefs: [CI003, CI004, CI009, CI015]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - [Revenue / ARR / growth, null, Low, "Sets scale and forward growth base", "Monthly revenue and ARR bridge by product, deployment, geography, and new versus expansion"]
      - [Gross margin, null, Low, "Tests cloud ingestion, storage, support, and AI inference economics", "Gross margin and hosting COGS by New-Scale, Fusion, and self-hosted LogRhythm"]
      - [NRR / gross retention / churn, null, Low, "Tests merger disruption, pricing power, and expansion quality", "Quarterly logo and dollar cohorts, including migrated and legacy LogRhythm customers"]
      - [CAC / payback / sales cycle, null, Low, "Tests enterprise GTM efficiency and capital needs", "Fully loaded CAC, new-logo ACV, sales cycle, partner contribution, and payback"]
      - [Cash / burn / runway / debt, null, Low, "Determines financing dependency and downside protection", "Current cash, monthly burn, debt and covenants, integration spend, and downside runway"]
    notes: "All values are intentionally null because the assigned public evidence does not disclose these metrics; no proxy is treated as an estimate."
    claimRefs: [CI010, CI011, CI012, CI016]
