company:
  name: Exabeam
chapter:
  number: 4
  title: Financials
  summary: >-
    Exabeam appears to monetize a modular security-operations portfolio whose cloud
    economics are tied at least partly to daily data ingest, while the combined
    company also supports self-hosted LogRhythm deployments. Public evidence does
    not disclose current revenue, ARR, margins, retention, burn, runway, or debt,
    so financial underwriting remains blocked pending management data.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Exabeam sells a portfolio rather than a single undifferentiated product.
      Public product materials describe cloud-native New-Scale SIEM, New-Scale
      Analytics, New-Scale Fusion, automation, and a continuing self-hosted
      LogRhythm SIEM offer. New-Scale Fusion can augment an installed SIEM or
      replace it, creating a plausible expansion path from analytics into a
      broader platform subscription. One independent directory says licensing
      follows SIEM economics and is driven by daily data-ingest volume, with
      reseller SKUs sized in gigabytes per day, but no public list price. That
      makes telemetry volume a likely billing driver, not proof of realized price,
      recurring revenue, or gross margin. Professional services, education, and
      support are visible on the company site, but their contract structure and
      revenue contribution are not disclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      Current company-issued evidence supplies operating signals but not audited
      financial traction. An October 2026 release says Exabeam is trusted by more
      than 3,000 enterprises and reports that its own security team measured Nova
      AI triage at roughly ten minutes versus five hours for a human analyst.
      Those claims may strengthen the value proposition and support enterprise
      selling, but neither customer count nor an internal workflow benchmark
      reveals annual contract value, renewal behavior, revenue growth, CAC,
      payback, or sales-cycle length. The same release says capabilities are
      intended to improve outcomes without adding headcount, which is a customer
      ROI proposition rather than evidence of Exabeam's own operating leverage.
      The retained evidence therefore supports product-demand hypotheses, not a
      sales-efficiency conclusion.
    claimRefs: [CI005, CI006, CI007, CI010, CI011]
  - id: cost-and-unit-economics
    title: Cost structure and unit-economics limits
    body: >-
      The delivery mix points to materially different cost profiles that cannot be
      collapsed into one SaaS margin assumption. Cloud-native ingestion, search,
      analytics, storage, automation, and AI inference should carry variable
      infrastructure costs, while self-hosted LogRhythm shifts more infrastructure
      to the customer but can retain support, maintenance, and engineering costs.
      Exabeam says New-Scale can route data to third-party storage and run
      federated searches, and that pipeline controls can use lower-cost storage;
      these features may lower customer spend or improve retention while also
      limiting payable ingest. No retained source discloses gross margin by
      deployment, cost of service, revenue mix, NRR, churn, CAC, payback, or
      working-capital requirements. The unit-economics table therefore records
      nulls rather than estimates.
    claimRefs: [CI001, CI004, CI009, CI010, CI011, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Sponsor backing and historical financing are not substitutes for present
      liquidity. Thoma Bravo lists Exabeam as a portfolio company and reports an
      investment year of 2018, while a 2026 directory says the company had raised
      more than $400 million across multiple rounds. Neither item establishes cash
      currently available after years of operations or the 2024 LogRhythm merger.
      The retained evidence contains no current cash balance, operating loss,
      accounting cash-flow statement, burn rate, runway, debt facilities,
      covenants, integration costs, planned use of funds, or next-round trigger.
      The combined cloud and self-hosted portfolio may broaden monetization, but
      an adverse commercial analysis warns that roadmap investment is shifting
      toward New-Scale and that migration requires re-tuning. The financial
      verdict is therefore potentially durable usage-based revenue with
      unquantified revenue quality, integration cost, margin path, and capital
      dependency.
    claimRefs: [CI008, CI009, CI012, CI013, CI014, CI016]
callouts:
  - calloutType: risk
    title: Financial underwriting blocker
    body: >-
      Require a post-merger monthly financial package before underwriting:
      revenue and ARR by cloud versus self-hosted product, gross margin by delivery
      model, cohort retention, sales efficiency, cash, burn, debt, integration
      spend, and a management runway bridge.
    claimRefs: [CI010, CI011, CI012, CI016]
