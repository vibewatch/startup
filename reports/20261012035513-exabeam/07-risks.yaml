callouts:
  - calloutType: "risk"
    title: "The LogRhythm Cloud Migration Cliff"
    body: "The sunsetting of the standalone LogRhythm brand in the 2025 Gartner SIEM Magic Quadrant signals a decisive strategic shift toward Exabeam's cloud-native New-Scale platform. While self-hosted LogRhythm 7.21 remains supported, net-new feature investment has shifted entirely to cloud SaaS. Customers facing migration must abandon years of customized AIE correlation rules in favor of UEBA behavioral modeling, creating an immediate window of vulnerability to customer churn from competing SIEM and XDR vendors."
    claimRefs:
      - "CR005"
      - "CR006"
  - calloutType: "insight"
    title: "Private Equity Leverage and Strategic Exit Optionality"
    body: "Under majority ownership by Thoma Bravo, Exabeam operates without public financial disclosure obligations, obscuring post-merger ARR trajectory and debt service coverage. This capital structure provides financial resilience for long-term R&D integration but exposes the company to sponsor-driven exit timing, potential secondary recapitalizations, or margin pressure if growth fails to outpace integration overhead."
    claimRefs:
      - "CR007"
      - "CR013"
