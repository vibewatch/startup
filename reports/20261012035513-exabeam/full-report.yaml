  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-tier architectural stack illustrating the progression from enterprise telemetry ingestion to agentic
      co-investigation and unified threat response.
    data:
      layers:
        - label: 1. Data Collection & Ingestion
          detail: >-
            Over 7,000 prebuilt log parsers and cloud collectors processing up to 2 million events per second into the
            Exabeam Common Information Model (CIM).
        - label: 2. Cloud Storage & Data Lake
          detail: >-
            Elastic cloud security data lake providing 30-day hot search index, long-term compliance retention, and
            federated search across customer repositories.
        - label: 3. Behavioral Analytics & Baselines
          detail: >-
            Stateful user and asset tracking building dynamic behavioral baselines from 90 days of logs across human
            identities and non-human entities.
        - label: 4. Dynamic Risk Scoring Engine
          detail: >-
            Machine-learned anomaly quantification assigning context-aware risk scores (0–100) based on statistical
            rarity, peer groups, and asset criticality.
        - label: 5. Exabeam Nova Agentic Layer
          detail: >-
            Six specialized AI agents (Investigation, Search, Visualization, Threat Scoring, Analyst Assistant, Advisor)
            executing autonomous triage and natural language queries.
        - label: 6. SOC Threat Center & Response
          detail: >-
            Unified analyst workbench consolidating alerts, notable events, smart timelines, and low-code playbooks
            integrated with over 650 third-party security tools.
    approximationNotes: >-
      Layer hierarchy reflects cloud-native New-Scale Fusion deployment; on-premises LogRhythm deployments decouple
      cloud analytics from local storage appliances.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE009
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Enterprise adoption sequence and expansion pathways from initial SIEM ingestion or UEBA augmentation to
      full-platform consolidation and agentic SOC deployment.
    approximationNotes: >-
      Illustrative synthesis of customer journey phases based on technical documentation, deployment models, and
      customer references.
    claimRefs:
      - CU001
      - CU004
      - CU013
    data:
      items:
        - label: 'Phase 1: Log Aggregation & Compliance Ingestion'
          touchpoints:
            - Connect Active Directory, firewall, and cloud logs to Common Information Model
            - Establish compliance log retention and audit reporting baseline
        - label: 'Phase 2: UEBA Augmentation Overlay'
          touchpoints:
            - Deploy New-Scale Analytics on top of existing Splunk or Microsoft Sentinel SIEM
            - Construct baseline behavioral models and dynamic peer groups across entities
        - label: 'Phase 3: Full Cloud Modernization (New-Scale Fusion)'
          touchpoints:
            - Retire legacy on-prem log appliances in favor of cloud-native GCP infrastructure
            - Unify log storage, search, correlation, and automated incident response in one platform
        - label: 'Phase 4: Hybrid Co-Management (LogRhythm Integration)'
          touchpoints:
            - Maintain on-premises LogRhythm SIEM for sensitive data residency constraints
            - Integrate LogRhythm Intelligence to stream cloud analytics into local operations
        - label: 'Phase 5: Agentic SOC & Nova Autonomous AI'
          touchpoints:
            - Activate Exabeam Nova co-investigators for persistent background context gathering
            - Deploy Agent Behavior Analytics to monitor ChatGPT, Copilot, and Gemini usage
        - label: 'Phase 6: Multi-Tenant & Channel Expansion'
          touchpoints:
            - Extend platform access to MSSP partners (e.g. Lumifi, The Missing Link)
            - Deploy Executive Digest and Outcomes Navigator to prove business value at renewal
