  - id: FI001
    title: Revenue model bridge and economic tension
    type: flow
    summary: >-
      Customer telemetry can drive platform value and ingest-linked monetization, while storage and pipeline
      optimization can reduce the billable data base.
    data:
      nodes:
        - id: telemetry
          label: Customer security telemetry
          detail: Logs and signals from cloud, on-premises, identities, endpoints, and other tools.
        - id: ingest
          label: Ingest and normalize
          detail: Daily ingest volume is the clearest publicly described commercial unit.
        - id: optimize
          label: Route and optimize data
          detail: Pipeline controls, third-party storage, and federated search can lower storage cost or payable ingest.
        - id: analyze
          label: Apply analytics and automation
          detail: SIEM, UEBA, risk scoring, investigation, and Nova agents create workflow value.
        - id: outcome
          label: Deliver security outcomes
          detail: Faster investigation and broader threat context support the customer ROI case.
        - id: monetize
          label: Subscription and usage revenue
          detail: Realized price, expansion, retention, and gross profit remain undisclosed.
    approximationNotes: Conceptual flow from public product and licensing evidence; it is not a quantified revenue waterfall.
