        title: Exhibits
        blocks:
          - type: callout
            title: UEBA Tuning Overhead and Ingestion Bottlenecks
            body: >-
              Competitors actively target Exabeam's operational maintenance requirements, arguing that behavioral models
              require ongoing manual tuning that risks alert fatigue and query latency during peak event-per-second
              ingestion periods.
            calloutType: risk
