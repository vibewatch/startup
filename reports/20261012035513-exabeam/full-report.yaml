        title: Operational Scale, Product Milestones, and Integration Trajectory
        blocks:
          - type: paragraph
            body: >-
              Exabeam's post-merger operations represent significant commercial reach, supporting an enterprise customer
              base of more than 3,000 organizations across 22 countries. The technical roadmap centers on Exabeam Nova,
              introduced in April 2025 as a multi-agent AI framework, and Agent Behavior Analytics (ABA), launched in
