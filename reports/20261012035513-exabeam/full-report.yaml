        title: Growth Drivers, Adoption Bottlenecks, and Implementation Constraints
        blocks:
          - type: paragraph
            body: >-
              Market adoption is accelerated by stringent regulatory frameworks, including the European Union NIS2
              Directive, the Digital Operational Resilience Act (DORA), and U.S. SEC disclosure requirements mandating
              timely incident reporting. Concurrently, security operations face structural friction points: migrating
              from legacy correlation engines demands substantial re-tuning of detection rules and behavioral baselines,
              creating vendor lock-in. Furthermore, customer adoption of automated orchestration workflows can be
              constrained by subscription-tier execution limits, requiring ongoing data fine-tuning to deliver reliable
