        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Exabeam's governance and executive structure have undergone deliberate transitions across its scaling
              phases. Founding CEO Nir Polak guided the firm's early product innovation before transitioning to Chairman
              of the Board in 2021 when former McAfee and ForeScout leader Michael DeCesare was appointed chief
              executive officer. Following the landmark July 2024 merger with LogRhythm, the executive bench was unified
              under Chief Executive Officer Pete Harteveld, who brings more than two decades of go-to-market and
              integration experience. Product and technical innovation are spearheaded by Chief AI and Product Officer
              Steve Wilson, founder of the OWASP GenAI Security Project, alongside Chief Technology Officer David
              Kennedy. The executive bench maintains specialized functional coverage spanning enterprise sales, customer
              success, and legal governance, supported by private equity sponsor representation from Thoma Bravo.
