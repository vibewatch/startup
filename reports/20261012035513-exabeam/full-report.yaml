  - id: TV002
    title: Investment Thesis and Anti-Thesis Matrix
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence & Market Context
      - Thesis-Altering Trigger
    rows:
      - - 'Thesis: Agentic AI Leadership'
        - Nova platform and behavioral modeling automate triage and context collection at machine speed.
        - Exabeam Nova delivers platform-wide contextual assistance across analyst workflows.
        - Adoption stagnation or failure to displace legacy rule-based detection engines.
      - - 'Thesis: Scaled Customer Base'
        - LogRhythm combination provides immediate cross-sell runway into thousands of security teams.
        - Combined entity unites LogRhythm data ingestion with Exabeam threat detection.
        - Excessive customer churn or refusal of legacy accounts to transition to cloud.
      - - 'Anti-Thesis: Integration Overhead'
        - Maintaining dual self-hosted and cloud architectures drains engineering capital and slows R&D.
        - UnderDefense reviews note separate support commitments and roadmap bifurcation.
        - Material acceleration of unified cloud roadmap and rapid legacy SKU retirement.
      - - 'Anti-Thesis: Financial Opacity'
        - Private equity structure shields ARR, cash burn, and net retention from external audit.
        - Neither Thoma Bravo nor Exabeam discloses post-merger standalone financial results.
        - Independent audited financial disclosure or formal IPO prospectus filing.
    notes: Balanced evaluation of growth drivers versus operational and competitive vulnerabilities for the combined company.
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV011
  - id: TV003
    title: Exabeam Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation & Return Profile
      - Key Downside Triggers
      - Probability Weight
    rows:
      - - Bull Case
        - Rapid cloud migration of LogRhythm base; ARR expands >25% annually; gross margins reach 75%.
        - Enterprise valuation expands to $4.0B–$4.5B (9.0x–10.0x ARR); 1.7x–1.9x MOIC via IPO or strategic sale.
        - Hyperscaler SIEM displacement or aggressive pricing pressure from Splunk/Cisco.
        - 25%
      - - Base Case
        - Stable retention (>90%); steady migration to Nova; mid-teens ARR growth; PE cash flow discipline.
        - Enterprise valuation reaches $2.8B–$3.2B (7.0x–8.0x ARR); 1.2x–1.3x MOIC via sponsor recapitalization.
        - Elevated customer churn during forced on-premise upgrades; sluggish new logo acquisition.
        - 55%
      - - Bear Case
        - High attrition (>15%) in LogRhythm accounts; competitive losses to cloud-native SIEMs; flat revenue.
        - Valuation contracts to $1.5B–$1.8B (4.5x–5.5x ARR); downside multiple compression and restructuring.
        - Critical outage in cloud infrastructure; major customer defection wave to Microsoft Sentinel.
        - 20%
    notes: >-
      Scenario analysis modeling operating trajectories, valuation ranges, and key downside triggers across a 3-year
      holding horizon.
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV013
      - CV014
