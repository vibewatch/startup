  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Exabeam was founded in 2013 by Nir Polak and seasoned cybersecurity executives in Foster City, California.
              The company established its initial market presence by applying user and entity behavior analytics (UEBA)
              to massive enterprise log data, deriving its corporate name from the concept of shining an analytical beam
              across an exabyte of security telemetry. Operating under a growth-stage software-as-a-service model,
              Exabeam transitioned over a decade from an analytics overlay into a comprehensive Security Information and
              Event Management (SIEM) and Threat Detection, Investigation, and Response (TDIR) vendor. The company
              generates recurring revenue through annual subscriptions for its cloud-native New-Scale Security
              Operations Platform as well as continued software maintenance across its installed base of self-managed
              enterprise log collectors.
            claimRefs:
