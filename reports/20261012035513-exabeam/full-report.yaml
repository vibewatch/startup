      - number: '1.3'
        title: Financing History, Valuation, and Investor Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Between 2014 and 2021, Exabeam raised approximately $390 million across six institutional equity funding
              rounds, supported by prominent venture capital firms including Lightspeed Venture Partners, Norwest
              Venture Partners, and Acrew Capital. In June 2021, the company solidified its unicorn status by closing a
              $200 million Series F round led by Blue Owl Capital's Owl Rock division at a $2.4 billion post-money
              valuation. A fundamental capital transformation occurred on July 17, 2024, when private equity sponsor
              Thoma Bravo finalized the merger of Exabeam with its portfolio company LogRhythm. While specific
              transaction valuation terms and post-merger equity splits remain undisclosed, Thoma Bravo assumed
              controlling ownership, restructuring Exabeam's governance around operating discipline, software
              profitability, and platform synergy while earlier venture investors retained rollover participation.
