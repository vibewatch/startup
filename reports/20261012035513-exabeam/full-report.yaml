            title: Migration Friction and Retention Vulnerability in the LogRhythm Installed Base
            body: >-
              Industry co-management providers observe significant customer anxiety regarding the post-merger sunsetting
              of LogRhythm's independent brand in the 2025 Gartner Magic Quadrant. Transitioning years of customized AIE
              rules to Exabeam New-Scale risks customer churn to rival platforms.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU014
          - type: callout
            title: Augmentation Strategy Mitigates Full SIEM Rip-and-Replace Hurdles
            body: >-
              By packaging New-Scale Analytics as a standalone overlay that augments existing SIEM deployments like
              Splunk or Microsoft Sentinel, Exabeam lowers initial enterprise adoption barriers and establishes an
              incremental expansion runway into full platform modernization.
            calloutType: insight
            claimRefs:
              - CU001
