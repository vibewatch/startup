      - number: '4.3'
        title: Cost structure and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              The delivery mix points to materially different cost profiles that cannot be collapsed into one SaaS
              margin assumption. Cloud-native ingestion, search, analytics, storage, automation, and AI inference should
              carry variable infrastructure costs, while self-hosted LogRhythm shifts more infrastructure to the
              customer but can retain support, maintenance, and engineering costs. Exabeam says New-Scale can route data
              to third-party storage and run federated searches, and that pipeline controls can use lower-cost storage;
              these features may lower customer spend or improve retention while also limiting payable ingest. No
              retained source discloses gross margin by deployment, cost of service, revenue mix, NRR, churn, CAC,
              payback, or working-capital requirements. The unit-economics table therefore records nulls rather than
              estimates.
