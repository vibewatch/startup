          - type: callout
            title: The Dual-Platform Retention Challenge
            body: >-
              While Exabeam's merger with LogRhythm provides immediate scale as the largest independent SIEM vendor,
              managing distinct codebases—cloud-native New-Scale vs. self-hosted LogRhythm—creates migration friction
              and exposes legacy accounts to aggressive displacement campaigns by cloud conglomerates.
            calloutType: insight
            claimRefs:
