      - number: '5.2'
        title: Behavioral Analytics Engine, Normalization, and Multi-Agent AI
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of Exabeam is its behavioral analytics engine, which replaces brittle
              static correlation rules with dynamic baseline profiling [CE001, CE008]. Upon ingestion, raw security logs
              are mapped to the Exabeam Common Information Model (CIM) across hundreds of disparate vendor schemas,
              enriching raw events with contextual identity, asset, and network attributes [CE004]. The analytics engine
              tracks stateful user and asset sessions, establishing historical baselines of normal behavior over an
              initial 90-day training period and continuously updating risk scores based on statistical anomaly rarity
              and business context [CE008]. In 2025, Exabeam embedded Exabeam Nova directly into the platform workflow,
              deploying six specialized AI agents—Investigation, Search, Visualization, Threat Scoring, Analyst
              Assistant, and Advisor—to automate alert triage, natural-language threat hunting, and timeline synthesis
              [CE006]. The company reports that Nova saves an average of three hours per shift on alert triage and
              improves analyst productivity by up to 80% [CE007]. In 2026, Exabeam extended this behavioral modeling to
              non-human entities via Agent Behavior Analytics (ABA), continuously monitoring enterprise AI agents such
              as Claude, ChatGPT, and Copilot for anomalous tool use, data leakage, and drift [CE009].
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
      - number: '5.3'
        title: Data Ingestion Pipeline, Collector Scale, and Ecosystem Breadth
        blocks:
          - type: paragraph
            body: >-
              Handling enterprise data volume requires a high-throughput ingestion and normalization architecture
              capable of sustained cloud performance [CE002, CE005]. Exabeam's cloud collectors process more than two
              million security events per second (EPS) across distributed environments, supported by over 7,000 prebuilt
              log parsers that normalize high-volume telemetry at line rate [CE005]. For enterprise interoperability,
              the platform provides bidirectional integrations with more than 650 third-party security tools—including
              endpoint detection and response (EDR) platforms like CrowdStrike, SentinelOne, and Microsoft Defender, as
              well as cloud infrastructure providers and IT service management tools like ServiceNow [CE002, CE010].
              Ingestion feeds over 2,500 prebuilt detection rules and machine-learning behavioral models designed to
              identify compromised credentials, lateral movement, and insider threat patterns [CE010]. Low-code
              automation engines and Model Context Protocol (MCP) server endpoints allow SOC teams to trigger
              containment actions and orchestrate multi-vendor workflows without manual scripting [CE007, CE011].
            claimRefs:
              - CE002
              - CE005
              - CE007
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE010
      - number: '5.4'
        title: Trust, Compliance Certifications, and Dual-Platform Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Enterprise and public-sector adoption requires strict verification of infrastructure security, governance,
              and model privacy controls [CE012, CE014]. Exabeam New-Scale Fusion maintains audited compliance with SOC
              2 Type II, ISO 27001, ISO 27017 (cloud security), and ISO 27018 (cloud privacy), alongside completed IRAP
              assessment at the PROTECTED level for Australian government workloads [CE012]. The company enforces
              enterprise data boundaries by encrypting telemetry in transit and at rest while guaranteeing that customer
              logs are never utilized to train third-party or shared foundational AI models [CE014]. These technical
              credentials contributed to Exabeam being recognized as a Leader in the 2025 Gartner Magic Quadrant for
              SIEM [CE013]. However, technical diligence highlights platform convergence friction following the July
              2024 LogRhythm merger. While Exabeam actively develops cloud-native New-Scale Fusion, it must concurrently
              support legacy on-premises LogRhythm SIEM installations, creating dual-codebase maintenance overhead and
              potential feature lag for self-managed enterprise deployments [CE003].
            claimRefs:
              - CE003
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Embedded Multi-Agent AI as a Core Platform Capability
            body: >-
              Unlike legacy security software vendors that monetize generative AI as an expensive add-on license,
              Exabeam embeds its multi-agent Exabeam Nova framework directly into the core New-Scale platform at no
              additional SKU surcharge. Delivering six purpose-built agents directly within the analyst console
              democratizes Tier 3 investigation capabilities for Tier 1 SOC analysts, structurally accelerating triage
              velocity and defending platform pricing power against standalone copilot point solutions.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Dual Codebase Maintenance and Migration Friction Post-Merger
            body: >-
              While Exabeam accelerates cloud-native feature velocity on New-Scale Fusion, the company continues to
              support a large installed base on self-hosted LogRhythm SIEM following the July 2024 merger. Maintaining
              parallel R&D tracks for cloud-native microservices and legacy on-premises appliance architectures risks
              developer fragmentation, feature disparity between deployment models, and customer friction as legacy
              accounts evaluate mandatory cloud migration timelines.
            calloutType: risk
            claimRefs:
              - CE003
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Deployment Paths
        blocks:
          - type: paragraph
            body: >-
              Exabeam's commercial customer base is bifurcated across two primary architectural cohorts following its
              July 2024 merger with LogRhythm: modern enterprise security teams adopting the cloud-native New-Scale
              Security Operations Platform, and traditional organizations operating self-hosted, on-premises LogRhythm
              SIEM deployments [CU001]. The core buyer persona across both environments centers on enterprise Chief
              Information Security Officers (CISOs), Security Operations Center (SOC) managers, and security
              architecture directors in regulated industries [CU003]. Primary customer concentration spans five key
              industry verticals—financial services, healthcare, manufacturing, government, and higher education—where
              compliance requirements, insider threat risk, and credential misuse demand sophisticated behavioral
              surveillance rather than static alert thresholds [CU003]. To accommodate diverse enterprise architectures
              and procurement cycles, Exabeam supports two distinct customer entry points: a full platform modernization
              path via New-Scale Fusion, and an analytics overlay path via New-Scale Analytics that augments incumbent
              SIEM systems such as Splunk or Microsoft Sentinel without requiring a disruptive rip-and-replace [CU013].
            claimRefs:
              - CU001
              - CU003
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU013
      - number: '6.2'
        title: Adoption Trajectory, Daily Telemetry Scale, and AI Velocity
        blocks:
          - type: paragraph
            body: >-
              The scale and velocity of customer adoption across the combined Exabeam organization reflect both the vast
              telemetry demands of modern enterprise IT and the emerging transition toward autonomous security
              operations [CU002, CU010]. In large enterprise environments, security operations teams routinely ingest
              upwards of 10 terabytes of log data daily across distributed endpoints, cloud infrastructures, SaaS
              applications, and operational technology networks [CU002]. Across this footprint, the merged operating
              entity reports serving more than 3,000 enterprise customers globally under Thoma Bravo ownership [CU010].
              Recent customer adoption is heavily propelled by the deployment of Exabeam Nova, an embedded multi-agent
              AI framework introduced across 2025 and 2026 that autonomously correlates attack signals, constructs
              dynamic entity baselines, and accelerates alert triage to machine speed [CU004]. By reducing the manual
              investigation burden and synthesizing complex behavioral timelines in roughly ten minutes rather than the
              five hours traditionally required by tier-one security analysts, Exabeam drives measurable operational ROI
              across its production accounts [CU004].
            claimRefs:
              - CU002
              - CU004
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU010
      - number: '6.3'
        title: Named Customer Deployments and Verifiable Production Outcomes
        blocks:
          - type: paragraph
            body: >-
              Production evidence from named enterprise accounts demonstrates quantifiable efficiency gains and
              sustained technical validation across diverse vertical use cases [CU005, CU007, CU008, CU009]. In the
              commercial food production and supply chain sector, Mastronardi Produce deployed Exabeam Nova on the
              New-Scale platform, reporting that autonomous case summaries lifted a massive manual burden off security
              operations analysts and cut triage turnaround in half [CU005]. Similarly, in regional transaction
              processing, Mexican financial institution E-Global validated that Nova AI enabled analysts to prioritize
              critical incidents faster while preserving human judgment in high-stakes threat defense [CU009]. In IT
              services, Japanese technology provider MTI Ltd. cited Exabeam's rapid software release cadence and
              continuous functional enhancements within New-Scale Fusion as key drivers of operational agility [CU008].
              Furthermore, managed security service providers (MSSPs) including Lumifi and Australia-based The Missing
              Link demonstrate strong channel endorsement, leveraging Exabeam's customizable user and entity behavior
              analytics (UEBA) to deliver multi-tenant managed detection and response for mid-market and enterprise
              clients [CU006, CU007].
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
      - number: '6.4'
        title: Retention Durability, Merger Integration Friction, and Churn Exposure
        blocks:
          - type: paragraph
            body: >-
              Despite strong customer satisfaction reported among modern New-Scale references, Exabeam faces material
              retention vulnerabilities and switching risks within its legacy installed base [CU011, CU012, CU014].
              Industry observers and co-management partners highlight growing customer anxiety following the July 2024
              merger, particularly after LogRhythm ceased to appear as an independent vendor in the 2025 Gartner SIEM
              Magic Quadrant [CU011]. While Exabeam has committed to ongoing maintenance releases for on-premises
              LogRhythm SIEM through version 7.21 in 2025, long-term product innovation has decisively shifted to
              cloud-native New-Scale, creating a two-speed roadmap [CU001, CU012]. Legacy customers forced to migrate
              face significant operational hurdles: years of bespoke correlation rules tuned within LogRhythm's Advanced
              Intelligence Engine cannot be seamlessly ported to Exabeam's UEBA models, necessitating costly re-tuning
              [CU012]. In an environment where enterprise teams manage an average of 76 security tools while utilizing
              only 20% of their capabilities, platform migration friction introduces acute risk of customer attrition to
              competitors like Microsoft Sentinel or Securonix [CU014].
            claimRefs:
              - CU001
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong Customer Validation for Automated Case Summaries and Behavioral Timelines
            body: >-
              Customer feedback from enterprise references including Mastronardi Produce, E-Global, and The Missing Link
              highlights Exabeam's automated timelines and Nova case summaries as high-value operational
              differentiators, cutting alert investigation times from hours to minutes and easing analyst fatigue.
            calloutType: strength
            claimRefs:
