  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Delivery Architecture, Product Lineup, and Threat Center
        blocks:
          - type: paragraph
            body: >-
              Exabeam structures its technical offering around the New-Scale Security Operations Platform, delivered
              primarily as a cloud-native software-as-a-service solution [CE001, CE002]. The platform converges security
              information and event management (SIEM), user and entity behavior analytics (UEBA), and security
              orchestration, automation, and response (SOAR) into a cohesive analyst workbench [CE001, CE007].
              Commercial product packaging spans modular cloud components—including New-Scale SIEM for cloud-scale log
              ingestion and compliance, New-Scale Analytics for machine-learned behavioral profiling, and Outcomes
              Navigator for security posture benchmarking—alongside the acquired self-managed LogRhythm SIEM and
              LogRhythm Intelligence platforms [CE003]. At the center of daily security operations is Threat Center, a
              centralized analyst console that groups disparate alerts into correlated incidents, automatically compiles
              activity evidence, constructs end-to-end event timelines, and executes standardized investigation
              playbooks to resolve entire attack chains rather than isolated alerts [CE011].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
