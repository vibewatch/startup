  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Enterprise security operations center (SOC) architectures delineate clear boundaries between telemetry
              ingestion, threat detection, investigation, and response. The core market boundary encompasses Next-Gen
              Security Information and Event Management (SIEM), centralized security log management, User and Entity
              Behavior Analytics (UEBA), and Security Orchestration, Automation, and Response (SOAR). Included spend
              covers high-throughput log ingestion, data normalization via common information models, behavioral
              baselining, and automated case triage. Conversely, the market excludes adjacent spending on standalone
              endpoint protection agents, identity directory governance, and general-purpose IT observability platforms
              that lack specialized threat detection rules.
            claimRefs:
