        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Current company-issued evidence supplies operating signals but not audited financial traction. An October
              2026 release says Exabeam is trusted by more than 3,000 enterprises and reports that its own security team
