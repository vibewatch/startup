        title: Market Sizing, Addressable Opportunity, and Growth Projections
        blocks:
          - type: paragraph
            body: >-
              According to global market research, the worldwide SIEM market is expanding steadily from $10.67 billion
              toward $20.78 billion by 2031, growing at an 11.5% compound annual growth rate. Growth dynamics vary
              significantly by infrastructure footprint: while legacy and on-premises deployments represented 55.27% of
              total revenue in 2025, cloud-native SIEM architectures are growing at a faster 12.84% CAGR as
              organizations separate compute from storage to ingest over 10 terabytes of daily telemetry. Exabeam
              targets both the cloud-native modernization market via its New-Scale platform and the self-hosted
              installed base via LogRhythm co-deployment.
