      - number: '3.3'
        title: Pricing Models, Switching Costs & Lock-In Dynamics
        blocks:
          - type: paragraph
            body: >
              Pricing models in the SIEM and security analytics sector represent a critical competitive battleground and
              a primary driver of customer friction. Traditional SIEM vendors have historically utilized punitive
              ingestion-based pricing models tied to data volume (gigabytes per day or events per second), which created
              perverse economic incentives for enterprise security teams to drop or filter security-relevant log sources
              to manage software licensing expenditures. Exabeam markets its cloud-native New-Scale platform as a
              corrective to volume penalties, offering predictable user- and identity-oriented packaging options that
              encourage comprehensive telemetry ingestion. In contrast, Microsoft Sentinel relies on consumption-based
              cloud ingestion tiers with Azure commitment discounts, while Palo Alto Networks frequently packages Cortex
              XSIAM with broader multi-year enterprise license agreements spanning firewalls, SASE, and endpoint
              software.


              Switching costs in the SIEM sector remain exceptionally high due to deep operational lock-in. Migrating
              between security operations platforms requires re-architecting data ingestion pipelines, reconstructing
              historical compliance reporting schemas, and re-authoring detection content. For legacy self-hosted
              LogRhythm customers evaluating an upgrade to Exabeam New-Scale Fusion, switching friction is particularly
              acute: transitioning from deterministic, fact-based Advanced Intelligence Engine (AIE) correlation rules
              to probabilistic UEBA behavioral baselines demands substantial staff re-training and operational
              adjustment. Furthermore, enterprises operating high-volume environments report that legacy SIEM
              architectures suffer performance degradation and search latency during peak event-per-second ingestion
              spikes, making migration to modern data-lake-backed SIEM solutions an operational necessity despite the
              formidable switching costs involved.
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
      - number: '3.4'
        title: Moat Durability & Platform Displacement Risks
        blocks:
          - type: paragraph
            body: >
              Exabeam's long-term moat durability depends on maintaining its innovation lead in behavioral analytics
              while defending its substantial installed base against aggressive displacement campaigns. The vendor's
              core competitive moat resides in its proprietary machine learning baselines, extensive threat behavioral
              modeling IP, and vendor-neutral positioning, which appeals strongly to enterprises determined to avoid
              single-vendor lock-in across Microsoft, Palo Alto Networks, or Cisco ecosystems. Exabeam has reinforced
              this defense by demonstrating sustained engineering commitment across both cloud and on-premises
              portfolios, delivering the self-hosted LogRhythm 7.21 release in 2025 and maintaining a disciplined
              quarterly feature launch cadence.


              Nevertheless, Exabeam faces material displacement vulnerabilities. The post-merger integration of
              LogRhythm presents significant operational risk: following the transaction, the 2025 Gartner SIEM Magic
              Quadrant marked the first time LogRhythm ceased to appear as an independent evaluated vendor, underscoring
              brand consolidation under Exabeam. Competitors have seized upon this transition to instigate migration
              anxiety among on-premises LogRhythm accounts. Furthermore, because Exabeam is privately held under private
              equity sponsorship by Thoma Bravo and Francisco Partners, critical underwriting indicators—including
              segmented customer retention rates, net revenue retention (NRR), and the precise revenue split between
              legacy LogRhythm licenses and New-Scale Fusion cloud subscriptions—remain undisclosed private data. Until
              Exabeam demonstrates durable retention and seamless migration across its merged account base, displacement
              risks from well-capitalized platform conglomerates will remain elevated.
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP011
              - CP013
              - CP014
