callouts:
  - calloutType: "insight"
    title: "Architectural Shift from Analytics Overlay to Full-Stack SIEM Engine"
    body: "Exabeam's corporate evolution from a pure-play behavioral analytics (UEBA) overlay in 2014 to a scaled security operations platform culminating in the 2024 LogRhythm merger marks a structural shift. Rather than relying on third-party SIEM feeds as an add-on layer, the company now controls data ingestion, log correlation, agentic triage, and cloud-native analytics under a single operating roof."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO011"
      - "CO013"
  - calloutType: "risk"
    title: "Dual-Engine Maintenance vs. Cloud Migration Friction"
    body: "While Exabeam's leadership committed to ongoing maintenance for LogRhythm SIEM (demonstrated by the 7.21 release in July 2025), third-party MSSP analysis notes that strategic product investment and net-new AI capabilities flow exclusively to New-Scale Fusion. Bridging thousands of legacy on-premises LogRhythm deployments to cloud-native agentic architectures without inducing customer churn or competitor migrations represents a pivotal execution test."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
