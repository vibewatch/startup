chapter:
  number: 1
  title: "Company Overview"
  summary: "Exabeam is an enterprise security operations vendor that unified cloud-native UEBA with LogRhythm's SIEM ingestion under Thoma Bravo ownership in July 2024, now serving over 3,000 customers globally while advancing persistent AI agent triage via its New-Scale architecture."
sections:
  - id: "corporate-identity-and-foundational-architecture"
    title: "Corporate Identity, Foundation, and Business Model"
    body: "Exabeam was founded in 2013 by Nir Polak and seasoned cybersecurity executives in Foster City, California. The company established its initial market presence by applying user and entity behavior analytics (UEBA) to massive enterprise log data, deriving its corporate name from the concept of shining an analytical beam across an exabyte of security telemetry. Operating under a growth-stage software-as-a-service model, Exabeam transitioned over a decade from an analytics overlay into a comprehensive Security Information and Event Management (SIEM) and Threat Detection, Investigation, and Response (TDIR) vendor. The company generates recurring revenue through annual subscriptions for its cloud-native New-Scale Security Operations Platform as well as continued software maintenance across its installed base of self-managed enterprise log collectors."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Structure"
    body: "Exabeam's governance and executive structure have undergone deliberate transitions across its scaling phases. Founding CEO Nir Polak guided the firm's early product innovation before transitioning to Chairman of the Board in 2021 when former McAfee and ForeScout leader Michael DeCesare was appointed chief executive officer. Following the landmark July 2024 merger with LogRhythm, the executive bench was unified under Chief Executive Officer Pete Harteveld, who brings more than two decades of go-to-market and integration experience. Product and technical innovation are spearheaded by Chief AI and Product Officer Steve Wilson, founder of the OWASP GenAI Security Project, alongside Chief Technology Officer David Kennedy. The executive bench maintains specialized functional coverage spanning enterprise sales, customer success, and legal governance, supported by private equity sponsor representation from Thoma Bravo."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-valuation-and-sponsor-ownership"
    title: "Financing History, Valuation, and Investor Stakeholders"
    body: "Between 2014 and 2021, Exabeam raised approximately $390 million across six institutional equity funding rounds, supported by prominent venture capital firms including Lightspeed Venture Partners, Norwest Venture Partners, and Acrew Capital. In June 2021, the company solidified its unicorn status by closing a $200 million Series F round led by Blue Owl Capital's Owl Rock division at a $2.4 billion post-money valuation. A fundamental capital transformation occurred on July 17, 2024, when private equity sponsor Thoma Bravo finalized the merger of Exabeam with its portfolio company LogRhythm. While specific transaction valuation terms and post-merger equity splits remain undisclosed, Thoma Bravo assumed controlling ownership, restructuring Exabeam's governance around operating discipline, software profitability, and platform synergy while earlier venture investors retained rollover participation."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-agentic-trajectory"
    title: "Operational Scale, Product Milestones, and Integration Trajectory"
    body: "Exabeam's post-merger operations represent significant commercial reach, supporting an enterprise customer base of more than 3,000 organizations across 22 countries. The technical roadmap centers on Exabeam Nova, introduced in April 2025 as a multi-agent AI framework, and Agent Behavior Analytics (ABA), launched in January 2026 to govern emerging non-human AI identities alongside traditional users. In October 2026, Exabeam announced the general availability of its Agentic SOC architecture, integrating autonomous case triage with developer environments like Claude Code. Simultaneously, the company balances strategic migration with legacy continuity, delivering scheduled quarterly updates including LogRhythm 7.21 in July 2025, even as third-party market trackers highlight the sunset of the independent LogRhythm brand in premier industry benchmarks."
    claimRefs:
      - "CO006"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
