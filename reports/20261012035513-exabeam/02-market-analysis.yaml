callouts:
  - calloutType: insight
    title: 'The Post-Merger Platform Pivot: Preserving Self-Hosted Continuity While Driving Cloud Migration'
    body: >-
      Following the July 2024 merger with LogRhythm, Exabeam faces a dual mandate: sustaining support for self-hosted
      LogRhythm 7.21 customers who demand strict data residency, while directing net-new R&D into the cloud-native
      New-Scale Fusion platform and AI-driven Exabeam Nova.
    claimRefs:
      - CM006
      - CM008
      - CM010
  - calloutType: risk
    title: Workflow Execution Caps and Rule Migration Friction Limit Automation Velocity
    body: >-
      Customer evidence highlights that transitioning from legacy correlation engines to modern automated SOCs
      introduces friction, including subscription-based execution caps on automated playbooks and the extensive effort
      required to re-tune behavioral models and case templates.
    claimRefs:
      - CM013
      - CM014
