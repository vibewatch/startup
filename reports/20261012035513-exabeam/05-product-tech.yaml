figures:
  - id: "FE001"
    title: "Product architecture map"
    type: "stack"
    summary: "Six-tier architectural stack illustrating the progression from enterprise telemetry ingestion to agentic co-investigation and unified threat response."
    data:
      layers:
        - label: "1. Data Collection & Ingestion"
          detail: "Over 7,000 prebuilt log parsers and cloud collectors processing up to 2 million events per second into the Exabeam Common Information Model (CIM)."
        - label: "2. Cloud Storage & Data Lake"
          detail: "Elastic cloud security data lake providing 30-day hot search index, long-term compliance retention, and federated search across customer repositories."
        - label: "3. Behavioral Analytics & Baselines"
          detail: "Stateful user and asset tracking building dynamic behavioral baselines from 90 days of logs across human identities and non-human entities."
        - label: "4. Dynamic Risk Scoring Engine"
          detail: "Machine-learned anomaly quantification assigning context-aware risk scores (0–100) based on statistical rarity, peer groups, and asset criticality."
        - label: "5. Exabeam Nova Agentic Layer"
          detail: "Six specialized AI agents (Investigation, Search, Visualization, Threat Scoring, Analyst Assistant, Advisor) executing autonomous triage and natural language queries."
        - label: "6. SOC Threat Center & Response"
          detail: "Unified analyst workbench consolidating alerts, notable events, smart timelines, and low-code playbooks integrated with over 650 third-party security tools."
    approximationNotes: "Layer hierarchy reflects cloud-native New-Scale Fusion deployment; on-premises LogRhythm deployments decouple cloud analytics from local storage appliances."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE009"
      - "CE011"
callouts:
  - calloutType: "insight"
    title: "Embedded Multi-Agent AI as a Core Platform Capability"
    body: "Unlike legacy security software vendors that monetize generative AI as an expensive add-on license, Exabeam embeds its multi-agent Exabeam Nova framework directly into the core New-Scale platform at no additional SKU surcharge. Delivering six purpose-built agents directly within the analyst console democratizes Tier 3 investigation capabilities for Tier 1 SOC analysts, structurally accelerating triage velocity and defending platform pricing power against standalone copilot point solutions."
    claimRefs:
      - "CE006"
      - "CE007"
  - calloutType: "risk"
    title: "Dual Codebase Maintenance and Migration Friction Post-Merger"
    body: "While Exabeam accelerates cloud-native feature velocity on New-Scale Fusion, the company continues to support a large installed base on self-hosted LogRhythm SIEM following the July 2024 merger. Maintaining parallel R&D tracks for cloud-native microservices and legacy on-premises appliance architectures risks developer fragmentation, feature disparity between deployment models, and customer friction as legacy accounts evaluate mandatory cloud migration timelines."
    claimRefs:
      - "CE003"
      - "CE011"
