chapter:
  number: 5
  title: "Product & Technology"
  summary: "Exabeam delivers an AI-driven security operations platform combining cloud-native SIEM, user and entity behavior analytics (UEBA), and security orchestration and automation (SOAR) anchored by its proprietary Common Information Model and multi-agent Exabeam Nova framework. Processing over two million events per second with more than 650 prebuilt integrations, the architecture baselines human and autonomous agent behaviors to accelerate threat detection, though maintaining dual codebases following the LogRhythm merger presents ongoing platform convergence risks."
sections:
  - id: "platform-delivery-and-soc-workflow"
    title: "Platform Delivery Architecture, Product Lineup, and Threat Center"
    body: "Exabeam structures its technical offering around the New-Scale Security Operations Platform, delivered primarily as a cloud-native software-as-a-service solution [CE001, CE002]. The platform converges security information and event management (SIEM), user and entity behavior analytics (UEBA), and security orchestration, automation, and response (SOAR) into a cohesive analyst workbench [CE001, CE007]. Commercial product packaging spans modular cloud components—including New-Scale SIEM for cloud-scale log ingestion and compliance, New-Scale Analytics for machine-learned behavioral profiling, and Outcomes Navigator for security posture benchmarking—alongside the acquired self-managed LogRhythm SIEM and LogRhythm Intelligence platforms [CE003]. At the center of daily security operations is Threat Center, a centralized analyst console that groups disparate alerts into correlated incidents, automatically compiles activity evidence, constructs end-to-end event timelines, and executes standardized investigation playbooks to resolve entire attack chains rather than isolated alerts [CE011]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE007"
      - "CE011"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "behavioral-analytics-and-agentic-ai"
    title: "Behavioral Analytics Engine, Normalization, and Multi-Agent AI"
    body: "The core technical differentiator of Exabeam is its behavioral analytics engine, which replaces brittle static correlation rules with dynamic baseline profiling [CE001, CE008]. Upon ingestion, raw security logs are mapped to the Exabeam Common Information Model (CIM) across hundreds of disparate vendor schemas, enriching raw events with contextual identity, asset, and network attributes [CE004]. The analytics engine tracks stateful user and asset sessions, establishing historical baselines of normal behavior over an initial 90-day training period and continuously updating risk scores based on statistical anomaly rarity and business context [CE008]. In 2025, Exabeam embedded Exabeam Nova directly into the platform workflow, deploying six specialized AI agents—Investigation, Search, Visualization, Threat Scoring, Analyst Assistant, and Advisor—to automate alert triage, natural-language threat hunting, and timeline synthesis [CE006]. The company reports that Nova saves an average of three hours per shift on alert triage and improves analyst productivity by up to 80% [CE007]. In 2026, Exabeam extended this behavioral modeling to non-human entities via Agent Behavior Analytics (ABA), continuously monitoring enterprise AI agents such as Claude, ChatGPT, and Copilot for anomalous tool use, data leakage, and drift [CE009]."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE002"
  - id: "ingestion-pipeline-and-integrations"
    title: "Data Ingestion Pipeline, Collector Scale, and Ecosystem Breadth"
    body: "Handling enterprise data volume requires a high-throughput ingestion and normalization architecture capable of sustained cloud performance [CE002, CE005]. Exabeam's cloud collectors process more than two million security events per second (EPS) across distributed environments, supported by over 7,000 prebuilt log parsers that normalize high-volume telemetry at line rate [CE005]. For enterprise interoperability, the platform provides bidirectional integrations with more than 650 third-party security tools—including endpoint detection and response (EDR) platforms like CrowdStrike, SentinelOne, and Microsoft Defender, as well as cloud infrastructure providers and IT service management tools like ServiceNow [CE002, CE010]. Ingestion feeds over 2,500 prebuilt detection rules and machine-learning behavioral models designed to identify compromised credentials, lateral movement, and insider threat patterns [CE010]. Low-code automation engines and Model Context Protocol (MCP) server endpoints allow SOC teams to trigger containment actions and orchestrate multi-vendor workflows without manual scripting [CE007, CE011]."
    claimRefs:
      - "CE002"
      - "CE005"
      - "CE007"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
  - id: "compliance-trust-and-architecture-risks"
    title: "Trust, Compliance Certifications, and Dual-Platform Diligence Gaps"
    body: "Enterprise and public-sector adoption requires strict verification of infrastructure security, governance, and model privacy controls [CE012, CE014]. Exabeam New-Scale Fusion maintains audited compliance with SOC 2 Type II, ISO 27001, ISO 27017 (cloud security), and ISO 27018 (cloud privacy), alongside completed IRAP assessment at the PROTECTED level for Australian government workloads [CE012]. The company enforces enterprise data boundaries by encrypting telemetry in transit and at rest while guaranteeing that customer logs are never utilized to train third-party or shared foundational AI models [CE014]. These technical credentials contributed to Exabeam being recognized as a Leader in the 2025 Gartner Magic Quadrant for SIEM [CE013]. However, technical diligence highlights platform convergence friction following the July 2024 LogRhythm merger. While Exabeam actively develops cloud-native New-Scale Fusion, it must concurrently support legacy on-premises LogRhythm SIEM installations, creating dual-codebase maintenance overhead and potential feature lag for self-managed enterprise deployments [CE003]."
    claimRefs:
      - "CE003"
      - "CE012"
      - "CE013"
      - "CE014"
