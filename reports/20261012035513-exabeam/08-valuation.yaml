  - id: TV001
    title: Exabeam Recommendation Summary
    columns:
      - Evaluation Dimension
      - Assessment / Rating
      - Key Evidence & Analytical Rationale
      - Investment Implication
    rows:
      - - Recommendation
        - Buy
        - Leading independent position in UEBA and AI-driven SIEM following the LogRhythm merger.
        - Accumulate exposure in growth-stage secondary or co-investment syndicates.
      - - Confidence
        - Medium
        - Strong product and market footprint counterbalanced by private financial non-disclosure.
        - Condition position sizing on validation of underlying customer retention.
      - - Risk Rating
        - Medium
        - Legacy on-premise maintenance obligations and dual-platform migration friction.
        - Monitor LogRhythm renewal cohorts and customer satisfaction signals.
      - - Valuation Stance
        - Fair
        - Last private post-money mark of $2.4B reflects balanced valuation versus peer multiples.
        - Maintain disciplined entry multiple threshold below 8.0x estimated recurring revenue.
    notes: Synthesis of core diligence vectors, valuation benchmarks, and investment implications reflecting the combined entity profile.
