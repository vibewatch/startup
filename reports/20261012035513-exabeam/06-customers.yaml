      - "CU013"
    data:
      items:
        - label: "Phase 1: Log Aggregation & Compliance Ingestion"
          touchpoints:
            - "Connect Active Directory, firewall, and cloud logs to Common Information Model"
            - "Establish compliance log retention and audit reporting baseline"
        - label: "Phase 2: UEBA Augmentation Overlay"
          touchpoints:
            - "Deploy New-Scale Analytics on top of existing Splunk or Microsoft Sentinel SIEM"
            - "Construct baseline behavioral models and dynamic peer groups across entities"
        - label: "Phase 3: Full Cloud Modernization (New-Scale Fusion)"
          touchpoints:
            - "Retire legacy on-prem log appliances in favor of cloud-native GCP infrastructure"
            - "Unify log storage, search, correlation, and automated incident response in one platform"
        - label: "Phase 4: Hybrid Co-Management (LogRhythm Integration)"
          touchpoints:
            - "Maintain on-premises LogRhythm SIEM for sensitive data residency constraints"
            - "Integrate LogRhythm Intelligence to stream cloud analytics into local operations"
        - label: "Phase 5: Agentic SOC & Nova Autonomous AI"
          touchpoints:
            - "Activate Exabeam Nova co-investigators for persistent background context gathering"
            - "Deploy Agent Behavior Analytics to monitor ChatGPT, Copilot, and Gemini usage"
        - label: "Phase 6: Multi-Tenant & Channel Expansion"
