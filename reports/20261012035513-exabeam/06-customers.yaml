chapter:
  number: 6
  title: "Customers"
  summary: "Exabeam serves an enterprise customer base exceeding 3,000 organizations worldwide following its July 2024 merger with LogRhythm, providing AI-driven security operations and behavioral analytics across cloud-native and on-premises environments. While production deployments at references such as Mastronardi Produce, E-Global, and The Missing Link validate measurable analyst productivity gains from automated case correlation, critical commercial durability metrics including post-merger net revenue retention, customer migration velocity, and legacy LogRhythm churn risk remain unconfirmed private equity diligence gaps."
sections:
  - id: "customer-segmentation-and-buyer-personas"
    title: "Customer Base Segmentation, Buyer Personas, and Deployment Paths"
    body: "Exabeam's commercial customer base is bifurcated across two primary architectural cohorts following its July 2024 merger with LogRhythm: modern enterprise security teams adopting the cloud-native New-Scale Security Operations Platform, and traditional organizations operating self-hosted, on-premises LogRhythm SIEM deployments [CU001]. The core buyer persona across both environments centers on enterprise Chief Information Security Officers (CISOs), Security Operations Center (SOC) managers, and security architecture directors in regulated industries [CU003]. Primary customer concentration spans five key industry verticals—financial services, healthcare, manufacturing, government, and higher education—where compliance requirements, insider threat risk, and credential misuse demand sophisticated behavioral surveillance rather than static alert thresholds [CU003]. To accommodate diverse enterprise architectures and procurement cycles, Exabeam supports two distinct customer entry points: a full platform modernization path via New-Scale Fusion, and an analytics overlay path via New-Scale Analytics that augments incumbent SIEM systems such as Splunk or Microsoft Sentinel without requiring a disruptive rip-and-replace [CU013]."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU013"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory, Daily Telemetry Scale, and AI Velocity"
    body: "The scale and velocity of customer adoption across the combined Exabeam organization reflect both the vast telemetry demands of modern enterprise IT and the emerging transition toward autonomous security operations [CU002, CU010]. In large enterprise environments, security operations teams routinely ingest upwards of 10 terabytes of log data daily across distributed endpoints, cloud infrastructures, SaaS applications, and operational technology networks [CU002]. Across this footprint, the merged operating entity reports serving more than 3,000 enterprise customers globally under Thoma Bravo ownership [CU010]. Recent customer adoption is heavily propelled by the deployment of Exabeam Nova, an embedded multi-agent AI framework introduced across 2025 and 2026 that autonomously correlates attack signals, constructs dynamic entity baselines, and accelerates alert triage to machine speed [CU004]. By reducing the manual investigation burden and synthesizing complex behavioral timelines in roughly ten minutes rather than the five hours traditionally required by tier-one security analysts, Exabeam drives measurable operational ROI across its production accounts [CU004]."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof-and-production-outcomes"
    title: "Named Customer Deployments and Verifiable Production Outcomes"
    body: "Production evidence from named enterprise accounts demonstrates quantifiable efficiency gains and sustained technical validation across diverse vertical use cases [CU005, CU007, CU008, CU009]. In the commercial food production and supply chain sector, Mastronardi Produce deployed Exabeam Nova on the New-Scale platform, reporting that autonomous case summaries lifted a massive manual burden off security operations analysts and cut triage turnaround in half [CU005]. Similarly, in regional transaction processing, Mexican financial institution E-Global validated that Nova AI enabled analysts to prioritize critical incidents faster while preserving human judgment in high-stakes threat defense [CU009]. In IT services, Japanese technology provider MTI Ltd. cited Exabeam's rapid software release cadence and continuous functional enhancements within New-Scale Fusion as key drivers of operational agility [CU008]. Furthermore, managed security service providers (MSSPs) including Lumifi and Australia-based The Missing Link demonstrate strong channel endorsement, leveraging Exabeam's customizable user and entity behavior analytics (UEBA) to deliver multi-tenant managed detection and response for mid-market and enterprise clients [CU006, CU007]."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "retention-durability-and-merger-migration-risks"
    title: "Retention Durability, Merger Integration Friction, and Churn Exposure"
    body: "Despite strong customer satisfaction reported among modern New-Scale references, Exabeam faces material retention vulnerabilities and switching risks within its legacy installed base [CU011, CU012, CU014]. Industry observers and co-management partners highlight growing customer anxiety following the July 2024 merger, particularly after LogRhythm ceased to appear as an independent vendor in the 2025 Gartner SIEM Magic Quadrant [CU011]. While Exabeam has committed to ongoing maintenance releases for on-premises LogRhythm SIEM through version 7.21 in 2025, long-term product innovation has decisively shifted to cloud-native New-Scale, creating a two-speed roadmap [CU001, CU012]. Legacy customers forced to migrate face significant operational hurdles: years of bespoke correlation rules tuned within LogRhythm's Advanced Intelligence Engine cannot be seamlessly ported to Exabeam's UEBA models, necessitating costly re-tuning [CU012]. In an environment where enterprise teams manage an average of 76 security tools while utilizing only 20% of their capabilities, platform migration friction introduces acute risk of customer attrition to competitors like Microsoft Sentinel or Securonix [CU014]."
    claimRefs:
      - "CU001"
      - "CU011"
      - "CU012"
      - "CU014"
    figureRefs:
      - "FU001"
