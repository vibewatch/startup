evidenceGaps:
  - type: missing-source
    severity: material
    topic: post-merger-arr-and-retention
    missingEvidence: >-
      Audited financial disclosure of post-merger combined Annual Recurring Revenue (ARR), organic subscription growth
      rate, and net revenue retention (NRR) for the consolidated entity.
    whyItMatters: >-
      Exabeam operates as a private company under Thoma Bravo ownership without publishing segmented financials,
      preventing independent verification of cloud revenue scale vs. legacy on-premises maintenance.
    diligencePath: >-
      Review confidential information memorandum (CIM) or request private sponsor financial packets verifying ARR
      decomposition between New-Scale Fusion and self-managed LogRhythm.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: executive-bench-and-stakeholder-mapping
    missingEvidence: >-
      Full capitalization table breakdown showing equity rollover percentages for venture syndicates (Blue Owl,
      Lightspeed, Norwest, Acrew) vs. Thoma Bravo debt and preferred stock.
    whyItMatters: >-
      Enables assessment of governance voting rights, liquidation preferences, management incentive pool dilution, and
      sponsor investment horizon.
    diligencePath: Obtain shareholder registry and operating agreement disclosures during confirmatory investor diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: post-merger-arr
    missingEvidence: >-
      Disaggregated revenue, ARR, and net revenue retention (NRR) broken down between cloud-native Exabeam New-Scale and
      on-premises LogRhythm product lines.
    whyItMatters: >-
      Private equity ownership under Thoma Bravo obscures whether organic cloud growth compensates for potential
      attrition across the legacy installed base.
    diligencePath: >-
      Request confidential revenue cohort reporting and customer renewal rates by product family during management
      diligence sessions.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-sizing-divergence
    missingEvidence: >-
      Independent bottom-up sizing isolating pure-play UEBA and agentic SOC software spend from broad enterprise SIEM
      and log aggregation budgets.
    whyItMatters: >-
      Vendor-quoted TAM estimates of $10.67B to $20.78B aggregate commodity storage and log collection with higher-value
      analytics, potentially overstating Exabeam's immediate addressable budget.
    diligencePath: >-
      Cross-reference Gartner and IDC market share trackers specifically covering security analytics platforms and TDIR
      software sub-segments.
    relatedQuestionRefs:
      - QM001
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-product-split
    missingEvidence: >-
      Audited post-merger customer retention rates, net revenue retention (NRR), and customer counts split between
      New-Scale Fusion cloud and legacy on-premises LogRhythm installations.
    whyItMatters: >-
      Without segmented retention data, underwriting cannot determine whether legacy LogRhythm renewals are stabilizing
      or churn is accelerating toward competitors like Cortex XSIAM and Microsoft Sentinel.
    diligencePath: >-
      Request confidential sponsor disclosures from Thoma Bravo and Francisco Partners detailing renewal cohorts,
      migration conversion rates, and gross/net retention across product lines.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Executed order forms, price books, discount waterfalls, committed-ingest bands, overage terms, and realized ACV by
      product.
    whyItMatters: List architecture and an ingest unit do not establish realized revenue, discounting, expansion, or pricing power.
    diligencePath: >-
      Sample new-logo, renewal, and expansion contracts from the last four quarters and reconcile them to billing and
      ARR.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Revenue, gross margin, hosting and AI inference costs, support costs, NRR, gross retention, CAC, payback, and
