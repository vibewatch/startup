    title: Exabeam 建议与估值流程
    type: flow
    summary: 端到端分析决策链，将市场规模、AI 差异化、合并执行、运营风险和估值连接到最终建议。
    approximationNotes: 将战略输入映射至投资立场的逻辑流程。
