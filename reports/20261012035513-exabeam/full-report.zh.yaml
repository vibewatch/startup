              - CV006
              - CV008
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 买入判断：以整合纪律为前提
            body: >-
              在 Thoma Bravo 的支持以及 LogRhythm 合并后客户基础规模的支撑下，Exabeam 是一项颇具吸引力的成长阶段 AI 原生安全运营投资。不过，要实现长期倍数扩张，必须严格监测
              LogRhythm 客户留存以及向云原生 Nova 架构迁移的速度。
