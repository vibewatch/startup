    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Exabeam 是一家由私募股权支持的安全运营厂商，将云原生 UEBA、SIEM 摄取、自动化和智能体 AI 结合起来，服务混合云及自管环境中的企业 SOC。公司 2013
              年成立，最初从行为分析叠加层发展为完整的 SIEM/TDIR 厂商；收入主要来自 New-Scale 平台年度订阅和自管日志采集器的软件维护。
