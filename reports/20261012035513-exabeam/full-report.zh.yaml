        blocks:
          - type: paragraph
            body: >-
              2014—2021 年，Exabeam 通过六轮机构股权融资筹得约 $390M，投资者包括 Lightspeed、Norwest 和 Acrew。2021 年 6 月，Blue Owl Capital 旗下
              Owl Rock 领投 $200M 的 Series F，投后估值 $2.4B。2024 年 7 月 17 日，Thoma Bravo 完成 Exabeam 与 LogRhythm
              的合并并取得控股权；交易估值和合并后的股权比例未公开，早期投资人保留滚存权益。
