            body: >-
              全球 SIEM 市场预计从 $10.67B 稳步增长至 2031 年的 $20.78B，复合增速 11.5%。2025 年传统及本地部署占收入 55.27%，但云原生 SIEM 以 12.84% CAGR
              更快增长；组织正把计算与存储分离，以每日摄取超过 10TB 遥测。Exabeam 以 New-Scale 切入云现代化市场，以 LogRhythm 服务自托管存量。
