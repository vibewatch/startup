            title: UEBA 调优开销与摄取瓶颈
            body: 竞争者认为 Exabeam 的行为模型需要持续人工调优，可能在每秒事件摄取高峰造成告警疲劳和查询延迟。
            calloutType: risk
            claimRefs:
