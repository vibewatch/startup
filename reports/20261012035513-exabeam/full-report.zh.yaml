            title: 从分析叠加层到全栈 SIEM 引擎的架构转变
            body: >-
              Exabeam 从 2014 年的 UEBA 行为分析叠加层，演进为在 2024 年并购 LogRhythm 后的安全运营平台。公司如今把数据摄取、日志关联、智能体分诊和云原生分析收进同一平台，不再只是依赖第三方
