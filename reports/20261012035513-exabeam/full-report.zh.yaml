        title: 架构差异化与能力矩阵
        blocks:
          - type: paragraph
            body: >-
              Exabeam 以行为分析和智能体 AI 形成架构差异化。New-Scale Fusion 用动态基线替代静态关联规则，ABA 覆盖机器账户和自主软件智能体；Nova 的六个 AI
              智能体自动完成日志解析、异常检测、威胁排序和响应编排，平台支持逾 1,000 个连接器及 MCP。Palo Alto 认为 UEBA 需要持续调参并造成规则泛滥，强调 SmartGrouping
              和无索引数据湖；独立评测也显示 AI 编排器仍需大量上下文微调。
