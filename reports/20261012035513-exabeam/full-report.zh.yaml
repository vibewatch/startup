        title: 增长驱动、采用瓶颈与实施约束
        blocks:
          - type: paragraph
            body: >-
              严格监管（包括欧盟 NIS2、DORA 和美国 SEC
              披露要求）推动市场采用，但从旧关联引擎迁移需要重调检测规则和行为基线，也会造成厂商锁定。自动化编排还可能受订阅层执行上限约束，团队必须持续微调数据，才能在避免误升级的同时可靠完成事件分诊。
