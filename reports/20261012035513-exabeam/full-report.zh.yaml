  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              现代安全运营和 SIEM 市场正受遥测爆发、云迁移及自主运营需求推动而重构。2025 年本地 SIEM 仍占市场 55.27%，云架构预计到 2031 年以 12.84% CAGR 增长。2024 年 7 月
              17 日，Exabeam 在 Thoma Bravo 控股下完成与 LogRhythm 的合并，将 LogRhythm 的企业客户和摄取能力，与自身行为分析及云原生 New-Scale Fusion
              结合。竞争者包括 Palo Alto Networks、Fortinet、Microsoft Sentinel、Google Cloud SecOps 和已并入 Cisco 的 Splunk；Exabeam
              以开放、厂商中立和异构遥测摄取作为差异化。
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP010
