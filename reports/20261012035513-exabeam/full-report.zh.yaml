        title: 护城河持久性与平台替代风险
        blocks:
          - type: paragraph
            body: >-
              Exabeam 的护城河来自机器学习基线、威胁建模 IP、厂商中立定位及云端/本地双线工程投入，包括 2025 年 LogRhythm 7.21 发布。但 2025 Gartner SIEM 魔力象限不再把
              LogRhythm 列为独立厂商，竞品借此制造迁移焦虑。客户留存、NRR 以及 LogRhythm 与 New-Scale Fusion 的收入拆分仍未公开；在未证明留存和迁移顺畅前，平台替代威胁仍高。
