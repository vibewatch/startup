      - number: '3.3'
        title: 定价模式、切换成本与锁定效应
        blocks:
          - type: paragraph
            body: >-
              SIEM 定价是竞争焦点。传统厂商按每日 GB 或每秒事件数收费，促使客户过滤日志；Exabeam 将 New-Scale 定位为可预测的用户/身份套餐。Microsoft Sentinel
              按消费量收费，Palo Alto 常把 Cortex XSIAM 与防火墙、SASE 和终端产品打包。SIEM 迁移还要求重构摄取管道、合规报告和检测内容；LogRhythm 客户从 AIE 规则转向 UEBA
              基线，需要培训、调优并承受峰值性能风险。
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
