        blocks:
          - type: paragraph
            body: >-
              Exabeam 的治理和高管团队随规模扩张经历了有意的交接：创始 CEO Nir Polak 于 2021 年转任董事长，Michael DeCesare 接任 CEO；2024 年 7 月与 LogRhythm
              合并后，Pete Harteveld 统一领导公司。Steve Wilson、David Kennedy 分别负责 AI/产品与技术，团队覆盖销售、客户成功和法务，Thoma Bravo 提供私募股东支持。
