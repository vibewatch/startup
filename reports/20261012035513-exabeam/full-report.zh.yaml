  - id: FI001
    title: 收入模式桥接与经济张力
    type: flow
    summary: 客户遥测可以提升平台价值并带来与摄入量挂钩的变现，但存储和管道优化也可能减少可计费数据基础。
    data:
      nodes:
        - id: telemetry
          label: 客户安全遥测
          detail: 来自云端、本地部署、身份、终端和其他工具的日志与信号。
        - id: ingest
          label: 摄入与标准化
          detail: 每日摄入量是公开描述最清晰的商业计费单位。
        - id: optimize
          label: 路由与优化数据
          detail: 管道控制、第三方存储和联合搜索可以降低存储成本或付费摄入量。
        - id: analyze
          label: 应用分析与自动化
          detail: SIEM、UEBA、风险评分、调查和 Nova 智能体共同创造工作流价值。
        - id: outcome
          label: 交付安全成果
          detail: 更快的调查速度和更广的威胁上下文支撑客户 ROI 论据。
        - id: monetize
          label: 订阅与使用收入
          detail: 实际价格、扩张、留存和毛利均未披露。
    approximationNotes: 基于公开产品与许可证据的概念性流程，并非量化收入瀑布图。
    claimRefs:
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈展示从企业遥测摄入到智能体式协同调查和统一威胁响应的演进。
    data:
      layers:
        - label: 1. 数据收集与摄入
          detail: 超过 7,000 个预构建日志解析器和云采集器，每秒最多处理 2 百万个事件并写入 Exabeam 通用信息模型（CIM）。
        - label: 2. 云存储与数据湖
          detail: 弹性云安全数据湖提供 30 天热搜索索引、长期合规留存，并支持跨客户存储库的联合搜索。
        - label: 3. 行为分析与基线
          detail: 跟踪用户和资产状态，基于人类身份与非人类实体 90 天的日志构建动态行为基线。
        - label: 4. 动态风险评分引擎
          detail: 机器学习异常量化引擎根据统计稀有性、同伴群组和资产关键性，分配上下文感知风险评分（0–100）。
        - label: 5. Exabeam Nova 智能体层
          detail: 六个专用 AI 智能体（调查、搜索、可视化、威胁评分、分析师助手、顾问）自主执行分流和自然语言查询。
        - label: 6. SOC 威胁中心与响应
          detail: 统一分析师工作台整合告警、重要事件、智能时间线和低代码剧本，并接入超过 650 个第三方安全工具。
    approximationNotes: 层级反映云原生 New-Scale Fusion 部署；本地部署的 LogRhythm 将云分析与本地存储设备解耦。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示企业从初始 SIEM 摄入或 UEBA 增强，到全平台整合和智能体式 SOC 部署的采用顺序与扩张路径。
    approximationNotes: 基于技术文档、部署模式和客户参考资料，对客户旅程阶段进行示意性综合。
    claimRefs:
      - CU001
      - CU004
      - CU013
    data:
      items:
        - label: 阶段 1：日志聚合与合规摄入
          touchpoints:
            - 将 Active Directory、防火墙和云日志连接到通用信息模型
            - 建立合规日志留存与审计报告基线
        - label: 阶段 2：UEBA 增强叠加
          touchpoints:
            - 在现有 Splunk 或 Microsoft Sentinel SIEM 之上部署 New-Scale Analytics
            - 跨实体构建行为基线模型和动态同伴群组
        - label: 阶段 3：全面云端现代化（New-Scale Fusion）
          touchpoints:
            - 淘汰旧版本地日志设备，改用云原生 GCP 基础设施
            - 在单一平台统一日志存储、搜索、关联和自动化事件响应
        - label: 阶段 4：混合联合管理（LogRhythm 集成）
          touchpoints:
            - 因敏感数据驻留约束，保留本地部署的 LogRhythm SIEM
            - 集成 LogRhythm Intelligence，将云端分析流式传输到本地运营
        - label: 阶段 5：智能体式 SOC 与 Nova 自主 AI
          touchpoints:
            - 启用 Exabeam Nova 协同调查智能体，持续在后台收集上下文
            - 部署智能体行为分析，监测 ChatGPT、Copilot 和 Gemini 使用情况
        - label: 阶段 6：多租户与渠道扩张
          touchpoints:
            - 向 MSSP 合作伙伴（如 Lumifi、The Missing Link）扩展平台访问权限
            - 部署 Executive Digest 和 Outcomes Navigator，在续约时证明业务价值
