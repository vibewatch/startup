              合并后的 Exabeam 服务覆盖 22 个国家、逾 3,000 家企业。技术路线包括 2025 年 4 月推出的多智能体框架 Exabeam Nova、2026 年 1 月推出的 Agent Behavior
              Analytics，以及 2026 年 10 月发布的 Agentic SOC 架构。公司一边推进云迁移，一边维护旧产品，例如 2025 年 7 月发布 LogRhythm
