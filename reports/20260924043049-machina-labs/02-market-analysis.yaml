company:
  name: Machina Labs
chapter:
  number: 2
  title: Market Analysis
  summary: 'Machina Labs sells into a narrow but real market: low-volume, high-complexity metal forming for defense,
    aerospace, and advanced mobility. The wedge is attractive because it reduces tooling and lead-time friction,
    but the market is bounded by qualification cycles and an inability to displace mass-production stamping.'
sections:
- id: market-boundary
  title: Market boundary and buyer set
  body: 'Machina Labs is not trying to replace every metalworking process. The addressable market is much narrower:
    low-volume, high-complexity sheet-metal parts where tooling is expensive, geometry changes often, and lead times
    matter more than throughput. That puts the company in the overlap of defense sustainment, aerospace prototyping
    and production, and niche mobility programs such as custom body panels. The buyer set is therefore specific:
    program managers, manufacturing engineers, sustainment teams, and OEMs with parts that are too specialized for
    ordinary stamping lines yet too repeatable to hand-fabricate forever. The practical buyer is usually the person
    who owns a program deadline, a tooling budget, and a manufacturing risk register at the same time.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  - TM002
- id: market-drivers-and-constraints
  title: Adoption drivers and constraints
  body: 'The core adoption driver is economic and operational: eliminate geometry-specific dies and compress the
    path from CAD file to physical part. That proposition matters most when a part is changed frequently, built
    in low quantities, or required in locations where the supply chain cannot easily be rerouted. The constraint
    is equally important. Machina Labs is compelling for low-rate initial production, sustainment, and prototyping,
    but the same facts that make it useful there also limit it in mass-market manufacturing, where legacy stamping
    still wins on cost per unit and throughput. In diligence terms, the company competes where a design-change penalty
    can outweigh ordinary throughput economics.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM003
- id: market-sizing-and-gap
  title: Sizing logic and diligence gap
  body: 'Public sources do not support a clean TAM/SAM/SOM for Machina Labs, so any market sizing has to be proxy-based.
    The best evidence points to a market made of fragmented program budgets rather than a single large category,
    with the most concrete demand coming from defense sustainment, aerospace structures, and specialty mobility
    programs. That is enough to justify the business but not enough to justify a software-style winner-take-most
    thesis. The open diligence question is not whether the market exists; it is how much recurring, repeatable volume
    the company can capture once the novelty premium fades. In other words, the sizing problem is really a conversion
    problem: how many programs can justify switching from conventional fabrication to a reprogrammable cell.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  figureRefs:
  - FM001
tables:
- id: TM001
  title: Market boundary and buyer map
  columns:
  - Segment
  - Primary buyer
  - Why Machina fits
  - Constraint
  rows:
  - - Defense sustainment
    - Program and depot teams
    - Old tooling disappears and parts must be remade quickly
    - Qualification and procurement cycles
  - - Aerospace prototyping
    - Engineering / manufacturing
    - Frequent design change and low-volume runs
    - Throughput lower than incumbent stamping
  - - Advanced mobility pilots
    - OEM product teams
    - Custom panels and fast iteration
    - Not yet a mass-production solution
  - - Space / mission hardware
    - Program managers
    - Complex geometry and thin lead times
    - Niche demand and high qualification burden
  - - Specialty industrial
    - Plant engineering
    - Point-of-need deployment
    - Requires customer willingness to adopt new process
  notes: Boundary table is a qualitative market map rather than a full TAM model; it intentionally preserves where
    public evidence is strong and where it is only directional.
  claimRefs:
  - CM001
  - CM002
  - CM005
  - CM006
  - CM009
- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Lens
  - What it would include
  - Why it is hard
  rows:
  - - TAM
    - All low-volume complex metal parts
    - Too broad without customer budget data
  - - SAM
    - Defense, aerospace, and niche mobility parts
    - Program budgets are fragmented
  - - SOM
    - Programs already willing to qualify a new process
    - Adoption depends on qualification and repeatability
  - - Proxy
    - Sustainment, prototyping, and custom-body-panel work
    - Public sources do not disclose exact spend
  - - Diligence lens
    - Budget-owner and program-level opportunity map
    - Needs customer interviews and contract data
  notes: Sizing lens is qualitative because public sources do not support a defensible numeric TAM.
  claimRefs:
  - CM007
  - CM010
  - CM012
- id: TM003
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Why it matters
  - Diligence ask
  rows:
  - - Lead-time reduction
    - Positive
    - Creates immediate engineering value
    - Show customer-side cycle-time deltas
  - - Tooling elimination
    - Positive
    - Avoids expensive dies and molds
    - Quantify avoided tooling spend
  - - Qualification burden
    - Negative
    - Slows adoption in regulated programs
    - Show qualification timeline per account
  - - Throughput ceiling
    - Negative
    - Limits mass-production use
    - Disclose capacity and utilization
  - - Field deployment
    - Positive
    - Expands use cases beyond centralized factories
    - Provide examples of deployed operations
  notes: Driver table intentionally balances upside and adoption friction rather than projecting a numeric market
    forecast.
  claimRefs:
  - CM003
  - CM005
  - CM006
  - CM011
