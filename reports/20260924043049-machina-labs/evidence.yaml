evidenceGaps:
  - type: missing-source
    severity: material
    topic: investor-map
    missingEvidence: A fuller map of strategic investor roles and any preferred economics or control rights
    whyItMatters: The company's economics cannot be underwritten from public information alone
    diligencePath: Request a data-room extract or management review of the latest financials
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Board composition, succession plan, and named independent directors
    whyItMatters: Governance concentration remains a risk even when operations are progressing
    diligencePath: Review board consent materials and cap table / governance schedules
  - type: missing-source
    severity: material
    topic: tam
    missingEvidence: A defensible market-sizing source or bottom-up customer budget model
    whyItMatters: The company's market can be described qualitatively but not sized precisely from public sources
    diligencePath: Build a bottom-up model from public program budgets and customer interviews
  - type: missing-source
    severity: minor
    topic: switching-costs
    missingEvidence: Public per-part cost, yield, and throughput benchmarks against specific incumbents
    whyItMatters: Without benchmark data, the competitive moat is hard to translate into economics
    diligencePath: Request customer quotes, pilot KPIs, or third-party benchmark results
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: blocking
    topic: economics
    missingEvidence: Revenue run rate, gross margin, backlog, and burn
    whyItMatters: Those metrics are required to underwrite how the factory buildout converts into value creation
    diligencePath: Request audited financials or a management operating model
  - type: missing-source
    severity: material
    topic: architecture
    missingEvidence: Independent throughput, yield, defect-rate, and uptime benchmarks
    whyItMatters: Those metrics determine whether the product is a demo or an industrial platform
    diligencePath: Request customer-side pilot data and factory-level operating KPIs
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: blocking
    topic: customer-proof
    missingEvidence: Customer count, contract values, renewal timing, and revenue concentration
    whyItMatters: The business model cannot be judged without knowing how concentrated or recurring the revenue base is
    diligencePath: Ask management for a customer concentration schedule and program-level backlog
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: operational-risk
    missingEvidence: Customer concentration schedule, backlog, and retention metrics
    whyItMatters: These are the cleanest ways to measure whether growth is broad or fragile
    diligencePath: Request a customer revenue concentration schedule and a backlog report
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: price-discovery
    missingEvidence: A confirmed post-money valuation or live secondary quote with methodology
    whyItMatters: The current valuation anchor is still a third-party estimate rather than a disclosed company value
    diligencePath: Request the latest cap table and secondary market data with methodology notes
    relatedTableRefs:
      - TV003
