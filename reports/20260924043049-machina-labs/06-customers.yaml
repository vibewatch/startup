company:
  name: Machina Labs
chapter:
  number: 6
  title: Customers
  summary: 'Machina Labs has a real customer narrative rather than a generic pipeline story: defense sustainment,
    aerospace programs, Toyota pilots, and UAE strategic partnership work are all publicly named. The risk is that
    the customer list is still small and the economics of repeat ordering are not public.'
sections:
- id: customer-segments
  title: Named programs and customer segments
  body: The public customer set clusters around defense and aerospace, with a secondary mobility wedge. Named programs
    include the Air Force Research Laboratory, the Air Force Rapid Sustainment Office, Toyota Motor North America,
    NASA-related case-study work, and the UAE Strategic Development Fund partnership. That set is important because
    it shows the company is not relying on anonymous hype; it has real program names attached to the technology.
    The downside is that the public list is still short, and the company does not disclose a clean customer count
    or concentration profile. The key diligence question is whether those names translate into recurring production
    rather than only publicity-value references. That also means the company needs durable conversion discipline,
    not just exciting logos.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  - TU002
- id: customer-traction
  title: Repeat-use signals and deployment modes
  body: The most interesting traction signal is not a logo; it is repeat use. Public sources indicate that the Air
    Force Rapid Sustainment Office purchased a second RoboCraftsman cell, which is stronger evidence than a one-off
    pilot. Toyota's pilot is another positive sign because it ties the product to an OEM engineering workflow rather
    than only to government procurement. Even so, most of the evidence points to early-stage deployments and program-specific
    work, not a broad installed base with disclosure around renewal rates or utilization. The key diligence question
    is whether those names translate into recurring production rather than only publicity-value references. That
    also means the company needs durable conversion discipline, not just exciting logos.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU003
- id: customer-gaps
  title: What remains unproven
  body: 'The diligence gaps are straightforward: customer count, contract values, program duration, repeat order
    rate, and revenue concentration are all undisclosed. That matters because in a hardware-and-services model,
    a small set of customers can create a misleadingly strong public narrative while still leaving economic concentration
    risk untouched. Machina Labs likely has the beginnings of a repeatable defense and aerospace business, but the
    public record is not yet enough to prove breadth or durability. The key diligence question is whether those
    names translate into recurring production rather than only publicity-value references. That also means the company
    needs durable conversion discipline, not just exciting logos.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  figureRefs:
  - FU001
