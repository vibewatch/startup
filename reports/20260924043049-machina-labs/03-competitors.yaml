  rows:
  - - Qualification burden
    - Slows procurement
    - Repeatable process qualification
  - - Per-part economics
    - Creates price scrutiny
    - Competitive unit economics
  - - Throughput ceiling
    - Limits volume adoption
    - Capacity and utilization data
  - - Program-specific engineering
    - Raises sales effort
    - A repeatable deployment playbook
  notes: Adoption frictions matter because they determine whether Machina is a strategic niche winner or a niche
    curiosity.
