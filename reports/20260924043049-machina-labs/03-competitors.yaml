  - Best at
  - Weakness versus Machina
  - Why customers still choose it
  rows:
  - - Hard-tool stamping
    - Scale economics
    - Needs dies and long lead times
    - Lowest cost per unit at volume
  - - Superplastic forming
    - Complex aerospace parts
    - Slower setup and process complexity
    - Established aerospace workflow
  - - Additive metal manufacturing
    - Geometry freedom
    - Different material / cost profile
    - Strong design flexibility
  notes: This table focuses on the most common alternatives that show up in public discussion of the product category.
