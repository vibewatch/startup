  title: Competitive substitute matrix
  columns:
  - Alternative
  - Why customers choose it
  - Why Machina can win
  - Residual advantage of incumbent
  rows:
  - - Hard-tool stamping
    - Best cost per unit at scale
    - Faster changeover and no dies
    - Mass-production throughput
  - - Superplastic / stretch forming
    - Complex geometry with established processes
    - Reprogrammable and deployable
    - Longer track record
  - - Additive metal manufacturing
    - Geometry freedom and low tooling
    - Better on larger sheet-metal structures
    - Broader installed base
  - - Job shop fabrication
    - Flexible custom runs
    - Software-defined cell consistency
    - Lower capex and local availability
  - - In-house prototyping lab
    - Control and speed for prototypes
    - Point-of-need deployment
    - Already embedded in OEM orgs
  notes: This is a substitute matrix, not a quoted market-share table. It highlights economic and operational reasons
    buyers might choose a competitor or incumbent instead of Machina Labs.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP006
- id: TP002
