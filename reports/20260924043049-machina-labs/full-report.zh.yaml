  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方群体
        blocks:
          - type: paragraph
            body: >-
              Machina Labs
              并不打算取代所有金属加工工艺。其目标市场要窄得多：模具成本高昂、外形频繁变更、且交期敏感度高于产能吞吐量的小批量、高复杂度钣金件。这让公司切入了国防维保、航空航天原型试制与小批试产，以及定制车身覆盖件等特种出行项目的交集。其买方群体因而十分明确：项目主管、制造工程师、维保保障团队，以及手握特殊零部件的
              OEM 厂商——这类部件走普通冲压产线成本过高，长期靠手工制造也难以为继。现实中的买方通常是同一位关键负责人：既要盯项目交付节点、控制模具预算，也要管制造风险。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
