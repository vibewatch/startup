      - number: '5.3'
        title: 工程进展信号与性能验证疑点
        blocks:
          - type: paragraph
            body: >-
              公开技术信号包括活跃的 GitHub
              组织，以及机器学习、软件、基础设施和技术招聘等岗位的信息，显示其技术栈仍在演进。这是工程研发能力的积极信号，也说明公司还在验证平台能否规模化运行。目前没有公开的良率、加工周期或缺陷率基准数据；在客户 KPI
              公布或经第三方独立验证前，尽调仍应保持审慎。关键是确认这些技术环节能否在客户现场协同运行，而不只是完成演示。
