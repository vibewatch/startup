        blocks:
          - type: paragraph
            body: >-
              公开客户群体主要集中在国防与航空航天，出行领域则是次要切口。已点名的合作对象包括 Air Force Research Laboratory、Air Force Rapid Sustainment
              Office、Toyota Motor North America、NASA 案例研究，以及与 UAE Strategic Development Fund
              的战略伙伴关系。这一客群组合颇具说服力，表明公司并非依赖空中楼阁式的宣传，而是拥有实打实的项目背书。但不足之处在于公开名单依旧有限，且公司未披露明确的客户数或集中度画像。尽调的关键，是厘清这些标杆名称究竟已转化为可持续的复购生产，抑或仅作为品宣背书案例。这也意味着公司不仅需要抢眼的明星客户，更需要扎实的客户转化能力。
