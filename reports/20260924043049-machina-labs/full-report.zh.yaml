      - number: '1.2'
        title: 融资沿革、业务规模与运营布局
        blocks:
          - type: paragraph
            body: >-
              最新公布的融资为 2026 年 2 月交割的 $124 million Series C 轮，参投方包括 Woven Capital、Lockheed Martin Ventures、Balerion Space
              Ventures 及 Strategic Development Fund。第三方数据库测算其累计融资在 $200 出头，公司目前在 Los Angeles
              地区扩建大规模智能工厂。公开披露与数据库快照显示其员工人数刚过 100 人，符合一家仍处于产能铺设期而非成熟创收期的 Series C
              硬件企业特征。资金结构与厂房规划表明，公司在主动加码量产产能，而非偏离最初的国防与航天主线。
