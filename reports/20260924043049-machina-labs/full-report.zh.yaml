          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
      - number: '3.2'
        title: 护城河的真实落脚点
        blocks:
          - type: paragraph
            body: >-
              Machina Labs
              的护城河主要由技术与运营能力撑起。该平台的壁垒依托软件定义刀具路径、可重构生产单元以及现场部署能力，三者协同降低了设计改型和启动小批量生产的摩擦阻力。这一护城河客观存在，但也有边界：面对大批量吞吐能力远胜于己的传统替代方案，公司仍需通过客户资质认证、证明工艺稳定可重复，并守住单件经济效益。因此，竞争维度的核心命题不在于
              Machina 是否独一无二，而在于传统厂商调整方案之前，它能拿下多少可持续、可重复的生产订单。这一点很关键：如果既有厂商更愿意沿用熟悉工装、认为这样风险更低，Machina
              就必须持续胜过他们，护城河才有实际价值。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 竞争格局对尽调判断的意义
        blocks:
          - type: paragraph
            body: >-
              战略推论是：在模具成本敏感、设计迭代频繁以及生产地点灵活性要求高的场景中，Machina Labs
              大概率胜出；而在标准化批量生产主导的领域，它难以抗衡传统工艺。即使不占据广泛市场份额，公司也能创造价值，但成长上限取决于有多少项目具备这些小众特征。因此，尽调应聚焦于有壁垒的项目、单件经济性，以及公司能否把一次性试点转成持续生产订单。还要核实实际中标率、客户复购率，以及客户完成资质认证后，Machina
              能否提高切换成本。
