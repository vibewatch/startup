            body: >-
              最值得关注的业务进展信号并非品牌 Logo，而是客户复购。公开信息显示，Air Force Rapid Sustainment Office 采购了第二套 RoboCraftsman
              单元，这比一次性的单点试点有力得多。Toyota
              推进的试点则是另一个积极信号，说明产品已进入主机厂工程流程，而不只是政府采购。即便如此，现有证据大多指向早期部署和定制项目，尚看不出广泛装机，也没有续约率或设备利用率数据。尽调要确认这些客户名称能否带来持续生产，而非只提供宣传背书；公司需要把项目转化为订单，而不只是积累知名客户。
