        title: 部署形态、材料范围与系统集成
        blocks:
          - type: paragraph
            body: >-
              公司口径称，该平台可加工最大约 12 英尺 × 5 英尺的零件，可处理厚度最高达四分之一英寸的结构板材，并支持集装箱化或机动部署。官方页面还提到平台可接入通用数字格式和安全
              API，这很重要：设备必须融入客户现有的工程与制造流程，而不是要求客户另起炉灶。真正要验证的不是机器能否完成演示，而是它能否在多种材料和客户项目中稳定达到质量、产能与工艺重复性要求。关键在于这些环节能否在客户实际生产中协同运转。
