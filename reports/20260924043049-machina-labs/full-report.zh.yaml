              - CR004
              - CR005
              - CR009
      - number: '7.2'
        title: 运营与安全合规风险
        blocks:
          - type: paragraph
            body: >-
              公司同时承担制造商、硬件集成商和软件平台运营方的复杂任务。招聘和基础设施建设迹象显示工程负担不轻；公开的合规信息也意味着公司必须达到国防客户要求的高信任标准。执行到位，模式可以成立；但任何交付延误、工艺故障或安全事件都可能迅速损害客户信任，犯错代价很高。因此，尽调标准应高于一般成长型公司；下一轮融资也会受到这些风险进展的影响。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
