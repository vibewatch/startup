  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心架构与工艺流程
        blocks:
          - type: paragraph
            body: >-
              RoboCraftsman 是公司的核心平台：由导轨上的两台工业机械臂、钣金夹持框架和工艺软件组成，软件负责把数字几何转成工具路径。RoboForming
              无需传统模具或压机，便可逐步成形板材，这是产品的核心创新。Machina
              将其定位为软件定义的制造单元，而非单台机器：同一单元可重新编程，用于不同零件和材料组合。公司仍需证明，这套架构不只是设计新颖，而能稳定产出达到工业质量标准的零件。尽调要核实各环节能否在客户生产中协同运行，而不只是完成演示。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
