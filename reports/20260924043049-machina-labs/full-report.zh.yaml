      - number: '2.2'
        title: 采购驱动力与制约因素
        blocks:
          - type: paragraph
            body: >-
              核心采纳驱动力在于经济和运营效益：省去针对特定几何形状的模具，缩短从 CAD
              图纸到实体零件的流程。零件频繁改型、批量小，或必须在供应链难以迅速转供的地点生产时，这套方案最有价值。制约因素也同样明显。Machina Labs
              适合小批量试制（LRIP）、装备维保和原型验证，但这些优势也限制了它进入大规模制造领域；在规模化生产中，传统冲压仍在单件成本和产能上占优。从尽调角度看，Machina 适合设计变更成本足以抵消常规规模经济的场景。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
      - number: '2.3'
        title: 市场测算逻辑与尽调盲区
        blocks:
          - type: paragraph
            body: >-
              公开资料无法支撑对 Machina Labs 测算出清晰的
              TAM/SAM/SOM，任何市场测算都必须依赖代理指标。现有证据表明，该市场由分散的项目预算构成，而非单一的大型垂直品类，其中最具体的需求来自国防维保、航空航天结构件以及特种出行项目。这足以说明业务有成立基础，但不足以支撑软件行业赢家通吃的投资逻辑。尽调中悬而未决的核心疑问并非市场是否存在，而是一旦新技术的新鲜感褪去，公司能在多大程度上锁定持续、可重复的订单。换句话说，测算规模本质上是一个客户转化问题：究竟有多少项目能够证明放弃传统加工、转用可重构单元值得。
