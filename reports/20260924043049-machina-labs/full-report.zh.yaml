      - number: '7.3'
        title: 客户集中度与品类扩张风险
        blocks:
          - type: paragraph
            body: >-
              另一大风险是客户集中。公开客户名单仍短，业务偏重国防，主要是具名试点和维保项目。少数项目一旦放缓，公司即使仍有媒体曝光，收入也未必因此更加多元。技术最适合小批量、高复杂度零件，能否进入更广泛的制造领域仍无把握。因此，尽调标准应高于一般成长型公司；下一轮融资也会受到这些风险进展的影响。
