  - number: 7
    title: 核心风险
    sections:
      - number: '7.1'
        title: 核心商业风险
        blocks:
          - type: paragraph
            body: >-
              最大的潜在风险在于：Machina Labs
              尚未公开证明经济效益，就要求市场相信其工艺路线和工厂模式。收入、毛利率、在手订单和设备利用率均未披露，外界难以判断公司是在走向健康的单体经济模型，还是只靠烧钱扩产。相比软件公司，这种不透明更值得警惕：Machina
              不仅要证明需求存在，还要证明制造过程可靠。因此，尽调标准应高于一般成长型公司；下一轮融资也会受到这些风险进展的影响。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
