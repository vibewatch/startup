  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品与相邻替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争对手不仅限于机器人初创公司。Machina Labs
              必须直面传统冲压厂、合同制造商、超塑成形供应商、金属增材制造厂商，以及各类在经济合算时承接定制加工的外协机械工坊。其产品因省去模具而具备差异化，但这一特性同时也收窄了适用市场。将该公司理解为高端制造工艺的竞争者，远比将其视为通用自动化设备商更为准确。在实际竞争中，公司不仅要对抗既有的存量成熟工艺，还要面对任何在
              Machina 完成工艺认证之前就能更快报出定制加工报价的细分厂商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
