      - number: '7.3'
        title: Concentration and expansion risk
        blocks:
          - type: paragraph
            body: >-
              The other major risk is concentration. The public customer set is still small, defense-heavy, and
              dominated by named pilot or sustainment relationships. If a few programs slow down, the company can look
              strong in press coverage while still failing to diversify revenue. The market also remains bounded by the
              fact that the technology is best for low-volume, high-complexity parts, so expansion into broader
              manufacturing categories is not guaranteed. That is why the diligence standard here is stricter than a
              normal growth-company review. The company's next financing round will also be judged against how these
              risks evolve.
            claimRefs:
