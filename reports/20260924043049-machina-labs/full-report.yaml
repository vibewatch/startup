          - type: paragraph
            body: >-
              The most interesting traction signal is not a logo; it is repeat use. Public sources indicate that the Air
              Force Rapid Sustainment Office purchased a second RoboCraftsman cell, which is stronger evidence than a
              one-off pilot. Toyota's pilot is another positive sign because it ties the product to an OEM engineering
