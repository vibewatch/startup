      - number: '1.2'
        title: Funding, scale, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed financing is a $124 million Series C closed in February 2026 with Woven Capital,
              Lockheed Martin Ventures, Balerion Space Ventures, and Strategic Development Fund. Third-party databases
              place total funding in the low-$200 millions, and the company is now building a large intelligent-factory
              footprint in the Los Angeles area. Public disclosures and database snapshots indicate a headcount just
              above 100 employees, which is consistent with a Series C hardware company still in buildout mode rather
              than a mature revenue platform. The capital mix and facility plans suggest a deliberate bet on production
              scale, not a pivot away from the original defense and aerospace mission.
