              - CV007
              - CV008
      - number: '8.3'
        title: Diligence stance and sensitivity
        blocks:
          - type: paragraph
            body: >-
              On balance, the right stance is fair rather than clearly cheap. The company has enough validation to
              deserve a meaningful private-market mark, but not enough disclosure to justify a bullish revenue multiple
              or a premium public-style growth narrative. If management can show repeatable factory utilization and
              customer expansion, the implied value could move materially upward; if not, the current valuation may
              already assume more success than the public evidence can verify. The key diligence variable is not just
              price, but proof that the industrial model can scale. The right valuation question is whether factory
              scale turns into durable cash flow or just a larger cost base. The valuation case is therefore a blend of
              strategic validation and public-data discounting. The market is not pricing a software monopoly; it is
              pricing an industrial execution story.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
