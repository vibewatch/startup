              The public customer set clusters around defense and aerospace, with a secondary mobility wedge. Named
              programs include the Air Force Research Laboratory, the Air Force Rapid Sustainment Office, Toyota Motor
              North America, NASA-related case-study work, and the UAE Strategic Development Fund partnership. That set
              is important because it shows the company is not relying on anonymous hype; it has real program names
              attached to the technology. The downside is that the public list is still short, and the company does not
              disclose a clean customer count or concentration profile. The key diligence question is whether those
