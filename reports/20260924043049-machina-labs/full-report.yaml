              - CM010
              - CM012
      - number: '2.2'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The core adoption driver is economic and operational: eliminate geometry-specific dies and compress the
              path from CAD file to physical part. That proposition matters most when a part is changed frequently,
              built in low quantities, or required in locations where the supply chain cannot easily be rerouted. The
              constraint is equally important. Machina Labs is compelling for low-rate initial production, sustainment,
              and prototyping, but the same facts that make it useful there also limit it in mass-market manufacturing,
              where legacy stamping still wins on cost per unit and throughput. In diligence terms, the company competes
              where a design-change penalty can outweigh ordinary throughput economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM011
      - number: '2.3'
        title: Sizing logic and diligence gap
        blocks:
          - type: paragraph
            body: >-
              Public sources do not support a clean TAM/SAM/SOM for Machina Labs, so any market sizing has to be
              proxy-based. The best evidence points to a market made of fragmented program budgets rather than a single
              large category, with the most concrete demand coming from defense sustainment, aerospace structures, and
              specialty mobility programs. That is enough to justify the business but not enough to justify a
              software-style winner-take-most thesis. The open diligence question is not whether the market exists; it
              is how much recurring, repeatable volume the company can capture once the novelty premium fades. In other
              words, the sizing problem is really a conversion problem: how many programs can justify switching from
              conventional fabrication to a reprogrammable cell.
            claimRefs:
