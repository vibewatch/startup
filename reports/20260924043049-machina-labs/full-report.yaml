  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct and adjacent alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive set is not limited to robotics startups. Machina Labs has to beat traditional stamping
              shops, contract manufacturers, superplastic forming suppliers, additive metal players, and job shops that
              can absorb a custom run when the economics justify it. Its product is differentiated because it removes
              dies and molds, but that same distinction also narrows the available market. The company is best
              understood as a high-end manufacturing process competitor, not as a generic automation vendor. In
              practice, the company is competing against both the installed base and any niche vendor that can quote a
              custom run faster than Machina can qualify it.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
