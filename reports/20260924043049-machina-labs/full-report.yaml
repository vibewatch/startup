        blocks:
          - type: paragraph
            body: >-
              The public signal set includes an active GitHub organization and job postings for machine learning,
              software, infrastructure, and technical recruiting roles, which is consistent with a technology stack that
              is still evolving. That is a positive sign for engineering depth, but it also means the company is still
              proving its own platform at scale. There is no public benchmark pack for yield, cycle time, or defect
              rates, so the diligence standard should remain conservative until customer-side KPIs are disclosed or
              independently validated. The important diligence question is whether these layers work together at
              customer scale instead of only in demonstrations.
