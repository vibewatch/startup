        title: What remains unproven
        blocks:
          - type: paragraph
            body: >-
              The diligence gaps are straightforward: customer count, contract values, program duration, repeat order
              rate, and revenue concentration are all undisclosed. That matters because in a hardware-and-services
              model, a small set of customers can create a misleadingly strong public narrative while still leaving
              economic concentration risk untouched. Machina Labs likely has the beginnings of a repeatable defense and
              aerospace business, but the public record is not yet enough to prove breadth or durability. The key
