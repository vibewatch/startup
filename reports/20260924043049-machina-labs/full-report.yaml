      - number: '5.2'
        title: Deployment, materials, and integrations
        blocks:
          - type: paragraph
            body: >-
              The company says the platform can form parts up to roughly 12 feet by 5 feet, handle structural sheet up
              to a quarter inch thick, and operate in containerized or deployable form factors. Public pages also point
              to integrations with standard digital formats and secure APIs, which matters because the product must fit
              into existing engineering and manufacturing workflows instead of forcing a greenfield stack. The practical
              technology question is not whether the machine works in a demo; it is whether it can hit quality,
              throughput, and repeatability targets across multiple material classes and customer programs. The
              important diligence question is whether these layers work together at customer scale instead of only in
              demonstrations.
            claimRefs:
