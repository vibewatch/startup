              hardware concept. The limitation is equally straightforward: without revenue, margin, or utilization
              disclosure, the market cannot tell whether the current valuation is cheap, fair, or expensive relative to
              actual operating performance. That leaves valuation stuck between strategic narrative and hard financial
              proof. The right valuation question is whether factory scale turns into durable cash flow or just a larger
