              million, which keeps Machina Labs well below unicorn scale despite the large Series C. Tracxn and other
              databases also suggest that total funding sits in the low-$200 millions, which reinforces the picture of a
              serious but still mid-stage industrial company. Because the company does not disclose revenue, the
              valuation has to be interpreted as a capital-and-strategy verdict rather than a clean revenue multiple.
              The right valuation question is whether factory scale turns into durable cash flow or just a larger cost
              base. The valuation case is therefore a blend of strategic validation and public-data discounting. The
