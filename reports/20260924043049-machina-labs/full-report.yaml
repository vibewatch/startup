  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and deployment model
        blocks:
          - type: paragraph
            body: >-
              Machina Labs is a private advanced-manufacturing company headquartered in Chatsworth, California, founded
              in 2019 by Edward Mehr and Dr. Babak Raeisinia. Its core product is the RoboCraftsman platform, a
              software-defined robotic cell that uses electromagnetic forming to reshape sheet metal without
              geometry-specific dies or molds. The company positions the platform for aerospace, defense, and advanced
              mobility workloads where low-volume complexity, frequent design changes, and deployment flexibility matter
              more than mass-production throughput. The public record consistently describes the business as a
              combination of manufacturing-as-a-service, equipment deployment, and defense-oriented production capacity.
