  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core architecture and process flow
        blocks:
          - type: paragraph
            body: >-
              RoboCraftsman is the company's core platform: two robotic arms on rails, a sheet-metal holding frame, and
              process software that turns digital geometry into toolpaths. The process uses RoboForming to incrementally
              shape sheet metal without traditional dies, molds, or presses, which is the essential innovation behind
              the product. Machina presents the system as a software-defined manufacturing cell rather than a standalone
              machine, because the same cell can be reprogrammed for different parts and different material stacks. The
              company is still proving that the architecture can move from interesting cell design to consistently
              deliverable output at industrial quality. The important diligence question is whether these layers work
              together at customer scale instead of only in demonstrations.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
