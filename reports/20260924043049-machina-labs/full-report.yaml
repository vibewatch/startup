        title: Milestones, customer validation, and open gaps
        blocks:
          - type: paragraph
            body: >-
              Machina Labs has enough public proof points to confirm that the company is more than a science project:
              named programs include the Air Force Research Laboratory, the Air Force Rapid Sustainment Office, Toyota
              Motor North America, NASA case-study work, and an initial partnership with the UAE Strategic Development
              Fund. At the same time, the company does not publicly disclose revenue, gross margin, customer
