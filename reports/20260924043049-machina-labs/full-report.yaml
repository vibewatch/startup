  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Core business risks
        blocks:
          - type: paragraph
            body: >-
              The biggest risk is that Machina Labs is still asking the market to believe in a process and a factory
              model without public proof of the economics. Revenue, gross margin, backlog, and utilization are all
              undisclosed, which makes it hard to know whether the company is scaling toward healthy unit economics or
              just burning capital to stand up capacity. That opacity is more consequential here than in software
              because the company must also prove manufacturing reliability, not merely demand. That is why the
              diligence standard here is stricter than a normal growth-company review. The company's next financing
              round will also be judged against how these risks evolve.
            claimRefs:
              - CR001
              - CR002
