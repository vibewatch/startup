              - CP002
              - CP006
      - number: '3.2'
        title: Where the moat actually sits
        blocks:
          - type: paragraph
            body: >-
              Machina Labs' moat is primarily technical and operational. The platform's value comes from
              software-defined toolpaths, reconfigurable cells, and field deployability, which together reduce the
              friction of changing designs and launching low-rate production. That moat is real, but it is bounded: the
              company still needs to pass qualification, prove repeatability, and maintain unit economics against
              incumbent alternatives that are much better at high-volume throughput. As a result, the competitive
              question is less about whether Machina is unique and more about how much repeatable production volume it
              can capture before incumbents adapt. That matters because the moat only helps if the company can stay
              ahead of incumbent engineers who may be perfectly happy to solve the same problem with familiar tooling
              and lower perceived risk.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Why competition matters for diligence
        blocks:
          - type: paragraph
            body: >-
              The strategic implication is that Machina Labs will likely win where tooling cost, change frequency, and
              location flexibility matter, then lose where standardized production dominates. This means the company can
              be valuable even without broad market share, but it also means the ceiling depends on how many programs
              share those niche characteristics. Diligence therefore needs to focus on defensible program wins, per-part
              economics, and whether the company can translate a pilot into recurring production rather than one-off
              demos. The diligence focus should therefore stay on actual win rates, repeat orders, and the extent to
              which the company can raise switching costs once a customer is already qualified.
            claimRefs:
