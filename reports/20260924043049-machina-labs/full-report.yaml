  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer set
        blocks:
          - type: paragraph
            body: >-
              Machina Labs is not trying to replace every metalworking process. The addressable market is much narrower:
              low-volume, high-complexity sheet-metal parts where tooling is expensive, geometry changes often, and lead
              times matter more than throughput. That puts the company in the overlap of defense sustainment, aerospace
              prototyping and production, and niche mobility programs such as custom body panels. The buyer set is
              therefore specific: program managers, manufacturing engineers, sustainment teams, and OEMs with parts that
              are too specialized for ordinary stamping lines yet too repeatable to hand-fabricate forever. The
              practical buyer is usually the person who owns a program deadline, a tooling budget, and a manufacturing
              risk register at the same time.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
