      - number: '7.2'
        title: Operational and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the company is taking on the complexity of a production manufacturer, a hardware
              integrator, and a software stack owner all at once. Job postings and infrastructure issues point to a real
              engineering burden, while the public compliance story suggests the company must maintain high-trust
              defense standards. That is fine if execution is strong, but it means the cost of a mistake is high:
              delivery delays, process failures, or security incidents would hit customer trust immediately. That is why
              the diligence standard here is stricter than a normal growth-company review. The company's next financing
              round will also be judged against how these risks evolve.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
