  name: Machina Labs
chapter:
  number: 1
  title: Company Overview
  summary: Machina Labs is a Series C advanced-manufacturing company using robotic electromagnetic forming to make
    low-volume metal structures without hard tooling. Public evidence still supports real defense traction, but
    revenue opacity and a narrow manufacturing wedge keep the company in track-not-buy territory.
sections:
- id: overview-identity-and-product
  title: Identity, product, and deployment model
  body: Machina Labs is a private advanced-manufacturing company headquartered in Chatsworth, California, founded
    in 2019 by Edward Mehr and Dr. Babak Raeisinia. Its core product is the RoboCraftsman platform, a software-defined
    robotic cell that uses electromagnetic forming to reshape sheet metal without geometry-specific dies or molds.
    The company positions the platform for aerospace, defense, and advanced mobility workloads where low-volume
    complexity, frequent design changes, and deployment flexibility matter more than mass-production throughput.
    The public record consistently describes the business as a combination of manufacturing-as-a-service, equipment
    deployment, and defense-oriented production capacity.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
  - TO002
- id: overview-scale-and-capital
  title: Funding, scale, and operating footprint
  body: The latest disclosed financing is a $124 million Series C closed in February 2026 with Woven Capital, Lockheed
    Martin Ventures, Balerion Space Ventures, and Strategic Development Fund. Third-party databases place total
    funding in the low-$200 millions, and the company is now building a large intelligent-factory footprint in the
    Los Angeles area. Public disclosures and database snapshots indicate a headcount just above 100 employees, which
    is consistent with a Series C hardware company still in buildout mode rather than a mature revenue platform.
    The capital mix and facility plans suggest a deliberate bet on production scale, not a pivot away from the original
    defense and aerospace mission.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
  - TO003
- id: overview-gaps-and-control-points
  title: Milestones, customer validation, and open gaps
  body: 'Machina Labs has enough public proof points to confirm that the company is more than a science project:
    named programs include the Air Force Research Laboratory, the Air Force Rapid Sustainment Office, Toyota Motor
    North America, NASA case-study work, and an initial partnership with the UAE Strategic Development Fund. At
    the same time, the company does not publicly disclose revenue, gross margin, customer concentration, or a clean
    secondary-market valuation trail. Those omissions matter because the operating model depends on turning a technically
    interesting process into repeatable production economics. Until that happens, the strongest diligence conclusion
    is that Machina has real traction but incomplete financial visibility.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  figureRefs:
  - FO001
