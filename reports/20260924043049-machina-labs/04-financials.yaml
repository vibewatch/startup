company:
  name: Machina Labs
chapter:
  number: 4
  title: Financials
  summary: Machina Labs has enough capital to build its first large-scale factory, but not enough public financial
    disclosure to underwrite revenue quality, margins, or cash consumption. The story is attractive on funding momentum
    and strategic investors, yet still opaque on operating economics.
sections:
- id: financial-capital-stack
  title: Capital stack and round history
  body: 'Machina Labs has progressed from an early 2021 seed/A-era funding story to a 2023 Series B and a $124 million
    Series C in February 2026. The strategic investor roster matters as much as the headline number: Woven Capital,
    Lockheed Martin Ventures, NVIDIA-linked capital earlier in the lifecycle, and Strategic Development Fund all
    point to a dual-use industrial thesis. Public sources still disagree on exact cumulative capital raised, but
    the broad range is clear enough to show that the company has moved beyond venture hobby scale and into a capital-intensive
    factory buildout phase. The company still has to prove that these revenue lines can compound without collapsing
    under production bottlenecks or customer-specific custom work.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  - TI002
- id: financial-use-of-proceeds
  title: Use of proceeds and operating burn profile
  body: 'The February 2026 round is explicitly tied to an intelligent-factory buildout in Los Angeles: a 200,000-square-foot
    production site with roughly 50 RoboCraftsman cells. That tells us the company is spending on capex, equipment,
    production labor, and facility fit-out rather than just software R&D. As a result, the burn profile should look
    more like a specialized advanced-manufacturing company than a pure software startup. The public evidence also
    suggests that materials and program-specific costs are likely passed through or heavily managed on a contract
    basis, which keeps gross margin analysis out of reach from public filings alone.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI003
- id: financial-opacity
  title: Opacity and diligence implications
  body: 'No public source reviewed for this refresh provides a credible revenue run rate, gross margin, or cash-burn
    statement. That is not unusual for a private Series C hardware company, but it does mean every valuation conversation
    has to lean on proxy data: headcount, contract announcements, and the size of the factory being built. Until
    management opens the books, the right diligence stance is to treat financial strength as plausible but unverified.
    The most useful next-step questions are about backlog, utilization, and how quickly the new factory can convert
    capex into repeatable revenue.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  figureRefs:
  - FI001
