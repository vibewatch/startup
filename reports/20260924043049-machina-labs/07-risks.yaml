runDate: '2026-09-24'
company:
  name: Machina Labs
chapter:
  number: 7
  title: Risks
  summary: 'Machina Labs has real technical differentiation, but the risk set is still heavy: revenue opacity, scale-up
    execution, defense procurement dependence, and key-person concentration all remain material. The company is
    also taking on manufacturing, cyber, and operational complexity at the same time.'
sections:
- id: risk-core
  title: Core business risks
  body: The biggest risk is that Machina Labs is still asking the market to believe in a process and a factory model
    without public proof of the economics. Revenue, gross margin, backlog, and utilization are all undisclosed,
    which makes it hard to know whether the company is scaling toward healthy unit economics or just burning capital
    to stand up capacity. That opacity is more consequential here than in software because the company must also
    prove manufacturing reliability, not merely demand. That is why the diligence standard here is stricter than
    a normal growth-company review. The company's next financing round will also be judged against how these risks
    evolve.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  tableRefs:
  - TR001
- id: risk-operations
  title: Operational and security risk
  body: 'Operationally, the company is taking on the complexity of a production manufacturer, a hardware integrator,
    and a software stack owner all at once. Job postings and infrastructure issues point to a real engineering burden,
    while the public compliance story suggests the company must maintain high-trust defense standards. That is fine
    if execution is strong, but it means the cost of a mistake is high: delivery delays, process failures, or security
    incidents would hit customer trust immediately. That is why the diligence standard here is stricter than a normal
    growth-company review. The company''s next financing round will also be judged against how these risks evolve.'
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR002
- id: risk-concentration
  title: Concentration and expansion risk
  body: The other major risk is concentration. The public customer set is still small, defense-heavy, and dominated
    by named pilot or sustainment relationships. If a few programs slow down, the company can look strong in press
    coverage while still failing to diversify revenue. The market also remains bounded by the fact that the technology
    is best for low-volume, high-complexity parts, so expansion into broader manufacturing categories is not guaranteed.
    That is why the diligence standard here is stricter than a normal growth-company review. The company's next
    financing round will also be judged against how these risks evolve.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  tableRefs:
  - TR003
  figureRefs:
  - FR001
