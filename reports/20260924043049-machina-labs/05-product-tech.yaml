chapter:
  number: 5
  title: Product & Technology
  summary: Machina Labs is essentially a software-defined manufacturing system wrapped around a robotic forming
    process. The product looks differentiated because it combines robotics, process control, and deployment flexibility
    into one cell, but the diligence question is whether those technical claims translate into repeatable production
    performance.
sections:
- id: tech-architecture
  title: Core architecture and process flow
  body: 'RoboCraftsman is the company''s core platform: two robotic arms on rails, a sheet-metal holding frame,
    and process software that turns digital geometry into toolpaths. The process uses RoboForming to incrementally
    shape sheet metal without traditional dies, molds, or presses, which is the essential innovation behind the
    product. Machina presents the system as a software-defined manufacturing cell rather than a standalone machine,
    because the same cell can be reprogrammed for different parts and different material stacks. The company is
    still proving that the architecture can move from interesting cell design to consistently deliverable output
    at industrial quality. The important diligence question is whether these layers work together at customer scale
    instead of only in demonstrations.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE001
  - TE002
- id: tech-capabilities
  title: Deployment, materials, and integrations
  body: The company says the platform can form parts up to roughly 12 feet by 5 feet, handle structural sheet up
    to a quarter inch thick, and operate in containerized or deployable form factors. Public pages also point to
    integrations with standard digital formats and secure APIs, which matters because the product must fit into
    existing engineering and manufacturing workflows instead of forcing a greenfield stack. The practical technology
    question is not whether the machine works in a demo; it is whether it can hit quality, throughput, and repeatability
    targets across multiple material classes and customer programs. The important diligence question is whether
    these layers work together at customer scale instead of only in demonstrations.
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE003
- id: tech-signals-and-gaps
  title: Engineering signals and open performance questions
  body: The public signal set includes an active GitHub organization and job postings for machine learning, software,
    infrastructure, and technical recruiting roles, which is consistent with a technology stack that is still evolving.
    That is a positive sign for engineering depth, but it also means the company is still proving its own platform
    at scale. There is no public benchmark pack for yield, cycle time, or defect rates, so the diligence standard
    should remain conservative until customer-side KPIs are disclosed or independently validated. The important
    diligence question is whether these layers work together at customer scale instead of only in demonstrations.
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  figureRefs:
  - FE001
