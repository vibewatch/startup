companyProfile:
  summary: >-
    Machina Labs is a Los Angeles-area advanced manufacturing startup founded in 2019 by Edward Mehr and Dr. Babak
    Raeisinia. Its RoboCraftsman platform uses robotic electromagnetic forming to reshape metal sheets without
    geometry-specific dies, positioning the company for low-volume, high-complexity aerospace, defense, and mobility
    work. The company has raised a large Series C, is building a production-scale intelligent factory, and has named
    traction with the Air Force, Toyota, NASA-related work, and UAE strategic partners.
