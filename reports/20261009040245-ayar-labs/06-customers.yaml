callouts:
  - calloutType: "insight"
    title: "The Component Provider Paradox: Long Design Intercepts and High Qualification Leverage"
    body: "Ayar Labs' commercialization model means it cannot generate fast-turnaround SaaS-style customer traction. Because its TeraPHY chiplets must be physically co-packaged with complex compute silicon using TSMC's cutting-edge packaging lines, Ayar Labs is bound to the multi-year silicon tapeout cycles of custom ASIC houses and tier-1 hyperscalers. Securing an intercept on a 2028-2029 hyperscaler platform creates a multi-hundred-million-dollar revenue trajectory, but missing the 2027 qualification window would defer production monetization by an entire silicon product generation."
    claimRefs:
      - "CU003"
      - "CU010"
      - "CU011"
  - calloutType: "risk"
    title: "Incumbent Copper Resilience and Ecosystem Disintermediation Risk"
    body: "The primary competitive risk facing Ayar Labs' customer adoption is twofold: the enduring resilience of copper interconnects and the strategic ambiguity of its semiconductor backers. Continuous improvements in copper cabling, SerDes signaling, and retimers continue to extend electrical reach across short rack-scale distances, postponing the economic necessity of optical co-packaging. Concurrently, major strategic backers like NVIDIA and potential customers like Broadcom actively develop internal silicon photonics programs, creating permanent disintermediation risk if merchant optical chiplet margins compress."
    claimRefs:
      - "CU012"
      - "CU015"
      - "CU016"
