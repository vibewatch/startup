companyProfile:
  summary: >-
    Ayar Labs is a silicon-photonics company focused on co-packaged optical interconnects for AI and HPC systems. Its
    TeraPHY optical I/O chiplet and SuperNova remote light source are designed to replace copper SerDes with
    package-level optical connectivity for accelerators, switches, and rack-scale fabrics. The company appears to be in
    a late-venture manufacturing scale-up phase: it has raised substantial private capital and disclosed major strategic
    relationships, but it still does not publish audited revenue, ARR, customer counts, or margin data.
