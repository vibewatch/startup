company:
  name: "Ayar Labs"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Ayar Labs is a 2015-founded, San Jose-based semiconductor company developing
    co-packaged optical interconnects for AI scale-up. Its March 2026 Series E
    established a company-reported $3.75 billion valuation and $870 million of
    cumulative funding, while September financing funded manufacturing readiness
    and global engineering expansion; revenue, customer count, current headcount,
    and complete governance remain undisclosed or insufficiently verified.
sections:
  - id: "identity-and-product"
    title: "Identity, product, and business model"
    body: >-
      Ayar Labs was founded in 2015 and is headquartered in San Jose, California,
      according to company materials and an independent company profile. The
      company develops a co-packaged-optics stack centered on the TeraPHY optical
      engine and SuperNova external light source. Its stated value proposition is
      to replace bandwidth-limited electrical connections with optical
      connectivity closer to compute, reducing the power and reach constraints
      encountered as AI systems scale across racks. The public record supports a
      semiconductor-component and ecosystem-integration model rather than a
      disclosed recurring-software model. Product-performance and commercial-readiness
      descriptions are company claims; no audited shipment or revenue evidence in
      the assigned pool independently verifies broad deployment.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: "capital-and-stage"
    title: "Capital history and current stage"
    body: >-
      Financing progressed from a $35 million Series B in November 2020 to a
      $155 million Series D in December 2024 and a $500 million Series E in March
      2026. The company said the Series D brought cumulative funding to
      $370 million and valuation above $1 billion. The Series E announcement
      reported cumulative funding of $870 million and a $3.75 billion valuation;
      these are financing disclosures, not revenue, cash on hand, or available
      runway. In September 2026, Ayar Labs announced another $150 million and said
      primary capital raised during 2026 totaled $650 million. This capital
      intensity and the stated use of proceeds for production and test capacity
      place the company at a late-venture, manufacturing-scale-up stage.
    claimRefs: [CO004, CO007, CO008, CO009, CO010, CO011, CO012, CO015]
    figureRefs: [FO001]
  - id: "leadership-and-governance"
    title: "Leadership, governance, and key-person exposure"
    body: >-
      Charles Wuischpard was identified as chief executive in the November 2020
      Series B release, whereas Mark Wade was identified as chief executive and
      co-founder in the 2024 and 2026 financing materials. The public evidence
      therefore establishes a leadership transition but does not date or explain
      it. Wade is the principal public spokesperson for both product positioning
      and scale-up execution, creating visible key-person dependence around
      strategy and commercialization. Neuberger Berman was promised a board
      observer role after leading the Series E, but the assigned evidence does not
      disclose the observer, full board roster, voting rights, investor protective
      provisions, or founder ownership. Governance conclusions should remain
      limited until corporate records and financing documents are reviewed.
    claimRefs: [CO005, CO006, CO010, CO013]
    tableRefs: [TO002]
  - id: "stakeholders-scale-and-gaps"
    title: "Stakeholders, operating footprint, and unresolved scale"
    body: >-
      The investor and partner roster spans institutional capital, semiconductor
      strategics, and systems companies. Advent Global Opportunities and Light
      Street Capital led the 2024 Series D; Neuberger Berman led the 2026 Series E
      and obtained an observer role; and the September 2026 release placed Wiwynn
      alongside Alchip, AMD, Intel, MediaTek, and NVIDIA in the disclosed strategic
      group. Ayar Labs also announced a Bengaluru design center to complement
      teams in the United States and Hsinchu. These relationships signal ecosystem
      access but do not prove purchase commitments, customer concentration, or
      production revenue. Public revenue, ARR, customer count, audited headcount,
      cash, burn, and runway remain gaps, and the assigned pool cannot establish
      that no legal, regulatory, outage, or security incident exists.
    claimRefs: [CO007, CO010, CO013, CO014, CO016]
    tableRefs: [TO003]
