callouts:
  - calloutType: "risk"
    title: "Capital strength does not resolve commercial opacity"
    body: >-
      The disclosed financing supports manufacturing investment, but no assigned
      source provides audited revenue, ARR, cash, burn, runway, customer count, or
      customer concentration. Underwriting should not treat funding raised as cash
      available or strategic investment as purchase demand.
    claimRefs: [CO010, CO011, CO014, CO015]
