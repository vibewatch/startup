  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "regulatory-legal-posture"
      missingEvidence: "Primary Ayar-specific licenses, export classifications, regulatory correspondence, litigation schedule, patent schedule, freedom-to-operate opinion, privacy policy, DPA, and security assurance evidence."
      whyItMatters: "Without primary legal records, the analysis cannot establish either compliance or the absence of proceedings and cannot bound potential deployment restrictions."
      diligencePath: "Have outside counsel review the complete legal, IP, export-control, privacy, security, and dispute data rooms by jurisdiction."
      relatedQuestionRefs:
        - "QR002"
      relatedTableRefs:
        - "TR001"
    - type: "missing-source"
      severity: "material"
      topic: "independent-adverse-operating-evidence"
      missingEvidence: "Independent evidence on production yields, reliability incidents, outages, recalls, failed qualifications, customer concentration, burn, runway, or deployment failures."
      whyItMatters: "Company releases and investor commentary cannot independently validate the likelihood or financial impact of the highest-ranked risks."
      diligencePath: "Obtain customer references, qualification reports, supplier quality records, incident logs, audited financials, and independent technical review."
      relatedQuestionRefs:
        - "QR010"
    - type: "conflicting-data"
      severity: "material"
      topic: "revenue-estimates"
      missingEvidence: "Audited revenue by period and accounting basis, plus a definition and period for every third-party ARR or revenue estimate."
      whyItMatters: "The retained estimates use different metric labels, ranges, sources, and unspecified periods, so they cannot support burn, runway, margin, or valuation conclusions."
      diligencePath: "Reconcile audited monthly revenue, bookings, deferred revenue, gross margin, cash, and burn to management reporting and bank records."
      relatedQuestionRefs:
        - "QR007"
    - type: "private-evidence-only"
      severity: "material"
      topic: "partner-concentration"
      missingEvidence: "Binding capacity, pricing, exclusivity, yield responsibility, liability, second-source, and termination terms for manufacturing and integration partners."
      whyItMatters: "Public descriptions of potential pathways do not establish committed capacity or recoveries if qualification, yield, or delivery fails."
      diligencePath: "Review executed partner contracts, capacity schedules, qualification milestones, supplier scorecards, and contingency plans."
      relatedTableRefs:
        - "TR003"
