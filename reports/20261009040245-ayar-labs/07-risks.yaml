chapter:
  number: 7
  title: "Risks"
  summary: "The principal underwriting risk is execution: Ayar Labs says fresh capital will fund high-volume production and test capacity, while its own partner quotation identifies architectural, power, signal-integrity, mechanical, and thermal integration challenges. Public evidence does not establish regulatory posture, production yields, field reliability, customer concentration, revenue, cash burn, or partner concentration, so the residual risk remains high despite a large 2026 financing."
sections:
  - id: "ranked-risk-posture"
    title: "Ranked Risk Posture and Legal Diligence"
    body: >-
      The highest residual exposures are the transition to high-volume manufacturing, multi-domain
      package integration, and weak public visibility into commercial economics. Ayar Labs announced
      a $500 million Series E, $870 million of total funding, and a $3.75 billion valuation, but
      funding raised is not cash available and none of the retained sources discloses burn, runway,
      audited revenue, gross margin, or customer concentration. The legal register therefore treats
      export controls, freedom to operate, privacy, and customer-security obligations as diligence
      gaps rather than confirmed violations or confirmed compliance. Cross-border expansion into
      Hsinchu increases the importance of that review, while the fetched GUC material establishes
      only GUC's own privacy-policy framework, not Ayar-specific controls. The investment thesis
      should break if counsel cannot document required licenses and IP ownership, or if management
      cannot reconcile public commercial estimates with audited results.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "manufacturing-quality-and-security"
    title: "Manufacturing, Quality, and Technical Execution"
    body: >-
      Management's stated use of proceeds is itself a risk signal: high-volume production and test
      capacity still require scaling. The product must combine the TeraPHY optical engine with the
      SuperNova external light source, and Ayar says TeraPHY uses standard form factors and packaging
      flows used by major accelerator and switch vendors. Compatibility claims reduce redesign risk
      but do not prove yield, throughput, qualification time, or field reliability. More importantly,
      a GUC executive quoted on Ayar's website names architectural, power and signal-integrity,
      mechanical, and thermal challenges in CPO integration. Ayar also claims extensive verification
      and reliability testing, yet the assigned evidence provides no test protocol, sample size,
      failure distribution, or field-return data. Monitor production-test throughput, package yield,
      optical-coupling defects, qualification escapes, and mean time between failures; a missed
      customer qualification or persistent yield shortfall should pause additional underwriting.
    claimRefs:
      - "CR004"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
  - id: "partner-and-financial-dependencies"
    title: "Partner Dependencies and Financial-Model Risk"
    body: >-
      Ayar's commercialization path is ecosystem-dependent rather than vertically self-contained.
      KraneShares describes potential manufacturing pathways involving GlobalFoundries and the TSMC
      ecosystem through Alchip and GUC, while the company lists AMD, Alchip, MediaTek, and NVIDIA
      among strategic investors. Those relationships can accelerate qualification, but public
      materials do not disclose capacity commitments, exclusivity, pricing, second-source coverage,
      liability allocation, or customer concentration. Financial visibility is also unreliable:
      LeadIQ estimates annual revenue of $100 million to $250 million, whereas Silicon Valley Invest
      Club separately lists an undefined “ARR / revenue” value of $91.6 million and a $25 million to
      $50 million revenue-range estimate. These are third-party estimates with unclear periods and
      denominators, not audited company revenue. The kill criteria are unreconciled financials,
      single-counterparty manufacturing exposure without a qualified alternative, or partner
      qualification delays that consume the new capital before repeat production shipments.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
