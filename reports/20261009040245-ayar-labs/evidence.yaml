evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Audited revenue, ARR, customer count, current headcount, cash, burn, runway, and customer concentration.
    whyItMatters: Without period-matched operating metrics, financing scale cannot be translated into commercial traction or runway.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank statements, payroll records, the customer ledger, and
      signed backlog.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete current leadership and board roster, voting rights, observer identity, founder ownership, and investor
      protective provisions.
    whyItMatters: The public record cannot establish control, succession depth, or governance constraints.
    diligencePath: Review the current capitalization table, charter, bylaws, voting agreements, board minutes, and executive roster.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Complete capitalization table and the commercial terms behind strategic-investor relationships.
    whyItMatters: Named participation does not reveal ownership, control, exclusivity, purchase obligations, or realized revenue.
    diligencePath: >-
      Obtain the post-Series E capitalization table, financing documents, side letters, and contracts with strategic
      investors.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Authoritative legal, regulatory, outage, breach, complaint, recall, and sanctions checks across relevant
      jurisdictions.
    whyItMatters: A search result without a retained authoritative adverse source cannot prove the absence of incidents.
    diligencePath: >-
      Run counsel-led litigation and regulatory searches, request incident logs, and review security, insurance, and
      compliance disclosures.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: commercial revenue and unit shipment volumes
    missingEvidence: Audited GAAP revenues, ARR, customer shipment volumes, and average selling prices for TeraPHY chiplets.
    whyItMatters: >-
      Without primary revenue disclosures, market sizing and commercial adoption progress must be inferred from private
      equity valuations.
    diligencePath: Request confidential commercial traction data, production tape-out volume, and customer backlog under NDA.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market TAM boundaries and adoption timelines
    missingEvidence: Standardized industry consensus on optical I/O market sizing separate from broad optical transceiver hardware.
    whyItMatters: >-
      Broad optical transceiver forecasts conflate pluggable optical modules with monolithic in-package optical chiplet
      revenues.
    diligencePath: >-
      Examine specialized silicon photonics industry reports (e.g. Yole Group, LightCounting) to isolate die-to-die CPO
      forecasts.
    relatedQuestionRefs:
