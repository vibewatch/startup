  - id: TV002
    title: Investment Thesis and Anti-Thesis Breakdown
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Thesis-Break Indicator
    rows:
      - - Thesis
        - Optical I/O is physically required to break copper interconnect bandwidth and power walls
        - TeraPHY chiplet delivers terabits-per-second bandwidth density at 10x lower interconnect power
        - Hyperscalers extend copper reach through active cables or retimers beyond 2027
      - - Thesis
        - Elite strategic backing creates defensive distribution across accelerator ecosystems
        - Cap table features NVIDIA, AMD Ventures, Intel Capital, Alchip, MediaTek, and Wiwynn
        - Key strategic partner launches competing in-house optical interconnect solution
      - - Anti-Thesis
        - Extreme commercial revenue opacity and lack of disclosed customer production volumes
        - Company has disclosed $1.02B in total funding but zero revenue, ARR, or margin figures
        - Audited revenue disclosures reveal annualized product sales below $50M by 2027
      - - Anti-Thesis
        - Consolidation and peer capitalization threaten independent commercial market share
        - Lightmatter capitalized at $4.4B; Celestial AI acquired by Marvell for $3.25B in 2026
        - Customer design-win losses to integrated networking vendors (Broadcom, Marvell)
    notes: Thesis arguments synthesize technical and ecosystem evidence against commercial disclosure gaps.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV013
  - id: TV003
    title: Bull, Base, and Bear Scenario Projections Through 2028
    columns:
      - Scenario
      - Probability Signal
      - Operating & Milestone Assumptions
      - Valuation & Return Logic
      - Downside Triggers & Key Risks
    rows:
      - - Bull Case
        - 25%
        - Rapid hyperscaler adoption of 1024+ GPU optical clusters; >100M units shipped by 2028; $200M+ revenue
        - $10.0B - $14.0B IPO or premium acquisition multiple (20x-30x forward revenue)
        - Supply chain bottleneck in advanced packaging or optical fiber alignment yields
      - - Base Case
        - 50%
        - Successful commercial production ramp with Wiwynn and custom ASIC design wins; $50M-$100M revenue by 2027
        - $5.0B - $7.0B valuation at next liquidity event (1.0x-1.4x from current secondary benchmark)
        - Adoption timeline slips to 2028; gross margins compressed by high foundry packaging costs
      - - Bear Case
        - 25%
        - Protracted qualification cycles; hyperscalers deploy proprietary CPO; revenue remains negligible
        - $1.5B - $2.5B down-round or distressed acquisition (50%-70% haircut from secondary mark)
        - Severe cash burn depletes 2026 reserves; customer concentration losses to Marvell/Broadcom
    notes: >-
      Valuation projections reflect forward multiple assumptions anchored to 2026 primary Series E ($3.75B) and
      secondary ($5.0B) pricing.
    claimRefs:
      - CV001
      - CV004
