        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs was founded in 2015 and is headquartered in San Jose, California, according to company materials
              and an independent company profile. The company develops a co-packaged-optics stack centered on the
              TeraPHY optical engine and SuperNova external light source. Its stated value proposition is to replace
              bandwidth-limited electrical connections with optical connectivity closer to compute, reducing the power
              and reach constraints encountered as AI systems scale across racks. The public record supports a
              semiconductor-component and ecosystem-integration model rather than a disclosed recurring-software model.
              Product-performance and commercial-readiness descriptions are company claims; no audited shipment or
              revenue evidence in the assigned pool independently verifies broad deployment.
