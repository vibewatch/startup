      - number: '4.2'
        title: Go-to-Market Integration and Operating Cost Dynamics
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs pursues a multi-tiered semiconductor ecosystem go-to-market motion rather than direct
              board-level end-customer sales. The company interfaces directly with contract ASIC design shepherds,
              advanced packaging providers, and system ODMs—including strategic partners Alchip Technologies, Wiwynn,
              MediaTek, and Global Unichip (GUC)—to qualify CPO architectures into customer acceleration programs. This
              GTM model creates multi-year development cycles spanning 18 to 24 months from architectural evaluation to
              tape-out and qualification, requiring intensive engineering support per design win. Consequently, cost of
              goods sold is driven by advanced silicon photonics manufacturing flows, specifically TSMC's COUPE (compact
              universal photonic engine) process and SoIC-X 3D copper-to-copper die-to-wafer bonding. Operating expenses
              are heavily concentrated in specialized R&D personnel across Santa Clara headquarters, the Hsinchu
              engineering office in Taiwan, and the design center in Bengaluru, India. In addition, procurement of
              scarce optical raw materials, such as indium phosphide laser dies from suppliers like Lumentum, Coherent,
              and Sumitomo, introduces inventory working capital requirements and supply-chain dependencies.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
