  - id: FU001
    title: Ayar Labs Customer Adoption and Commercialization Journey Map
    type: journey-map
    summary: >-
      Multi-stage customer journey mapping the progression from foundational silicon research to ecosystem co-packaging,
      qualification, and multi-rack hyperscale deployment.
    data:
      items:
        - label: 'Phase 1: Research & Silicon Proof (2015-2020)'
          detail: >-
            DARPA-backed research spinoff commercializes micro-ring silicon photonics IP; demonstrates TeraPHY optical
            transmission in lab environments.
          touchpoints:
            - DARPA research grants and university patents
            - First silicon prototype demonstrations
            - Initial Series A venture capital funding
        - label: 'Phase 2: Ecosystem & MSA Standardization (2020-2024)'
          detail: >-
            Co-founds CW-WDM MSA consortium (expanding to 55 members); engages semiconductor foundries (TSMC,
            GlobalFoundries) and early strategic investors (Intel, NVIDIA, AMD).
          touchpoints:
            - CW-WDM MSA consortium launch and specification releases
            - OmniScale Media brand transformation from research entity to category innovator
            - Series B and C funding rounds with strategic semiconductor backing
        - label: 'Phase 3: ASIC & ODM Co-Development (2025-2026)'
          detail: >-
            Forms bilateral development partnerships with ASIC design leader Alchip and rack ODM Wiwynn; secures $650M
            in 2026 funding and opens Hsinchu and Bengaluru design centers.
          touchpoints:
            - Alchip strategic partnership on TSMC COUPE and SoIC packaging flows
            - Wiwynn rack-scale co-packaged optics partnership and equity investment
            - Closing of $500M Series E funding at $3.75B valuation and $150M extension
        - label: 'Phase 4: Component Mass Qualification (2026-2027)'
          detail: >-
            Hard operational gate targeting late 2027 to qualify TeraPHY and SuperNova modules for mass production
            yields, thermal reliability, and optical attach tolerances.
          touchpoints:
            - High-volume packaging and test capacity expansion
            - Rigorous customer component qualification testing against copper alternatives
            - Multi-customer design freeze window for next-generation platforms
        - label: 'Phase 5: Commercial Hyperscale Launch (2028-2029)'
          detail: >-
            Targeted commercial launch of customer AI systems incorporating Ayar Labs optical I/O, unlocking multi-rack
            optical fabrics across hyperscale AI clusters.
          touchpoints:
            - Initial customer shipments of TeraPHY chiplets and SuperNova light sources
            - Integration into customer multi-rack hyperscale AI accelerator systems
            - Initial recognition of commercial product revenue and operating margins
        - label: 'Phase 6: Multi-Rack Optical Fabric Scale (2029+)'
          detail: >-
            Full volume ramp across heterogeneous AI compute fabrics, expanding optical scale-up domains across
            multi-thousand accelerator data center installations.
          touchpoints:
            - High-volume repeat component orders across diverse cloud hyperscalers
            - Replacement of electrical copper backplanes in multi-megawatt AI data centers
            - Standardization of co-packaged optics across next-generation server architectures
    approximationNotes: >-
      Chronological phase representation derived from public corporate disclosures, CEO interviews, and partnership
      announcements; phase 4 and 5 represent management milestone targets rather than finalized outcomes.
