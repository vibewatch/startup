      - number: '6.3'
        title: Named Customer Partnerships, Ecosystem Proof, and Strategic Dependencies
        blocks:
          - type: paragraph
            body: >-
              Direct public proof of customer traction for Ayar Labs is concentrated in high-profile strategic
              partnerships, custom ASIC development agreements, and consortium building rather than published commercial
              offtake contracts. In September 2025, Ayar Labs announced a flagship commercial and technical partnership
              with Alchip Technologies, a leading high-performance ASIC design service provider serving tier-1
              hyperscalers. Under this partnership, Alchip integrates Ayar Labs' TeraPHY optical I/O into custom
              high-performance compute ASICs utilizing TSMC's advanced packaging and silicon processes, specifically
              COUPE and TSMC-SoIC. This collaboration provides hyperscalers with a repeatable, production-ready path to
              bypass copper bottlenecks in scale-up networks. On the system assembly side, Ayar Labs established a
              strategic partnership with Taiwanese cloud infrastructure manufacturer Wiwynn, which invested
              strategically in Ayar Labs in 2026 to co-develop rack-scale AI architectures integrating co-packaged
              optics modules and SuperNova light sources into deployable data center chassis. Further ecosystem
              alignment is evident in Ayar Labs' cap table, which includes premier semiconductor and accelerator leaders
              NVIDIA, AMD, and MediaTek. Additionally, Ayar Labs co-founded the CW-WDM MSA (Continuous-Wave Wavelength
              Division Multiplexing Multi-Source Agreement) Group to standardize optical source specifications,
              expanding the consortium from 11 initial members to 55 industry leaders including Arista Networks, Intel,
              and Hewlett Packard Enterprise. However, these high-profile alignments present significant strategic
              concentration and execution risks. Large semiconductor backers routinely preserve architectural
              optionality by funding external startups while advancing proprietary internal photonics and electrical
              interconnect programs, such as NVIDIA's silicon photonics switches and Broadcom's switch CPO platforms.
              Furthermore, with volume adoption dependent on a very small cadre of hyperscaler custom ASIC programs
              targeting 2028-2029 deployments, any qualification slip, package assembly defect, or architecture pivot by
              a single lead customer would severely impair Ayar Labs' projected revenue ramp.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
