      - number: '2.3'
        title: Target Customers, Value Chain, and Ecosystem Adoption
        blocks:
          - type: paragraph
            body: >-
              Adoption of optical I/O cannot occur in isolation; it requires deep horizontal coordination across the
              semiconductor foundry, packaging, and system integration value chain [CM008, CM010]. Ayar Labs has
              anchored its commercialization strategy around multi-tier ecosystem partnerships [CM010, CM011]. At the
              silicon manufacturing tier, the company partners with GlobalFoundries to fabricate optical chiplets on
              commercial-scale silicon photonics manufacturing lines [CM010]. This manufacturing integration ensures
              that optical dies adhere to standard CMOS fabrication tolerances and automated wafer-scale test
              environments [CM008, CM010]. At the strategic and customer tier, Ayar Labs counts industry leaders
              including NVIDIA, AMD, Alchip Technologies, Intel, Hewlett Packard Enterprise (HPE), and Lockheed Martin
              as strategic financial and development partners [CM011]. Participation in the Universal Chiplet
              Interconnect Express (UCIe) Consortium further anchors Ayar Labs within open industry standards, allowing
              its optical I/O chiplets to interface seamlessly with third-party compute dies across standardized
              die-to-die PHY protocols [CM014]. Nevertheless, significant commercial adoption bottlenecks persist
              [CM008]. In-package integration requires advanced packaging technologies, specialized fiber attachment
              tooling, and rigorous thermal management to ensure that delicate laser diodes remain stable under extreme
              data center operating conditions [CM008, CM012]. Customers must carefully weigh the high initial packaging
              re-engineering costs against long-term energy and bandwidth benefits [CM003, CM008].
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
