      - number: '7.2'
        title: Manufacturing, Quality, and Technical Execution
        blocks:
          - type: paragraph
            body: >-
              Management's stated use of proceeds is itself a risk signal: high-volume production and test capacity
              still require scaling. The product must combine the TeraPHY optical engine with the SuperNova external
              light source, and Ayar says TeraPHY uses standard form factors and packaging flows used by major
              accelerator and switch vendors. Compatibility claims reduce redesign risk but do not prove yield,
              throughput, qualification time, or field reliability. More importantly, a GUC executive quoted on Ayar's
              website names architectural, power and signal-integrity, mechanical, and thermal challenges in CPO
              integration. Ayar also claims extensive verification and reliability testing, yet the assigned evidence
              provides no test protocol, sample size, failure distribution, or field-return data. Monitor
              production-test throughput, package yield, optical-coupling defects, qualification escapes, and mean time
              between failures; a missed customer qualification or persistent yield shortfall should pause additional
              underwriting.
            claimRefs:
