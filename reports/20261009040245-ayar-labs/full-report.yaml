  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs commercializes co-packaged optics (CPO) architectures designed to dismantle the interconnect
              bandwidth and thermal power wall that limits copper networking within AI clusters. The company's
              commercial architecture centers on two complementary hardware offerings: the TeraPHY optical I/O chiplet
              and the SuperNova multi-wavelength remote laser light source. TeraPHY optical engines are integrated
              directly onto host accelerator packages alongside compute silicon, functioning as high-density optical
              transceivers that convert electrical signals into optical data streams. SuperNova provides external
              optical power via field-replaceable ELSFP modules, decoupling heat-generating laser diodes from sensitive
              processor packages. Beyond direct silicon sales, Ayar Labs monetizes its intellectual property and
              engineering through custom NRE (non-recurring engineering) contracts, system reference designs
              co-developed with custom ASIC partners, and prospective volume wafer/die licensing agreements. However,
              commercial list pricing is not public; engagements operate under negotiated enterprise and strategic
              semiconductor development agreements, with realized average selling prices heavily dependent on custom
              packaging integrations and committed wafer allocations.
