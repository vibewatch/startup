      - number: '7.3'
        title: Partner Dependencies and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >-
              Ayar's commercialization path is ecosystem-dependent rather than vertically self-contained. KraneShares
              describes potential manufacturing pathways involving GlobalFoundries and the TSMC ecosystem through Alchip
              and GUC, while the company lists AMD, Alchip, MediaTek, and NVIDIA among strategic investors. Those
              relationships can accelerate qualification, but public materials do not disclose capacity commitments,
              exclusivity, pricing, second-source coverage, liability allocation, or customer concentration. Financial
              visibility is also unreliable: LeadIQ estimates annual revenue of $100 million to $250 million, whereas
              Silicon Valley Invest Club separately lists an undefined “ARR / revenue” value of $91.6 million and a $25
              million to $50 million revenue-range estimate. These are third-party estimates with unclear periods and
              denominators, not audited company revenue. The kill criteria are unreconciled financials,
              single-counterparty manufacturing exposure without a qualified alternative, or partner qualification
              delays that consume the new capital before repeat production shipments.
