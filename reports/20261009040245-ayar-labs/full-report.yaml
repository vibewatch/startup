  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a layered competitive set rather than a single peer group. Tracxn identifies NVIDIA,
              Lightmatter, and Acacia as Ayar Labs' top competitors and separately profiles Celestial AI as an acquired
              optical-interconnect company. Lightmatter is the clearest direct specialist because its description
              explicitly combines photonic interconnects and co-packaged optics for AI infrastructure. NVIDIA is the
              incumbent platform alternative: it sells a broad hardware-and-software stack and can influence
              architecture, supply, and distribution even where Ayar supplies a component. Acacia and Celestial AI are
              adjacent optical precedents. Copper electrical I/O remains the status quo that Ayar seeks to displace,
              while a customer's internal design is a credible alternative that the assigned pool does not quantify. The
              resulting market boundary is therefore direct optical peers, integrated semiconductor incumbents, acquired
              optical assets, legacy copper, and internal build.
