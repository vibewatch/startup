      - number: '5.2'
        title: Deployment Workflows, Ecosystem Integration, and NVLink Fusion Compatibility
        blocks:
          - type: paragraph
            body: >-
              Deploying co-packaged optical interconnects requires deep cross-industry coordination across electronic
              design automation (EDA), custom ASIC design houses, foundries, and system ODMs. Rather than attempting
              vertical system assembly, Ayar Labs integrates into established semiconductor packaging supply chains. The
              company collaborates closely with Taiwan Semiconductor Manufacturing Company (TSMC), utilizing TSMC's
              Compact Universal Photonic Engine (COUPE) technology and System-on-Integrated-Chips (TSMC-SoIC) packaging
              flows. In partnership with leading ASIC design service providers Alchip Technologies and Global Unichip
              Corp (GUC), Ayar Labs enables hyperscalers to integrate TeraPHY chiplets into custom accelerator packages
              using standard die-to-die protocols, including Universal Chiplet Interconnect Express (UCIe). A critical
              commercial and technical milestone occurred in June 2026 when Ayar Labs joined NVIDIA's NVLink Fusion
              ecosystem, establishing optical and electrical interoperability with NVIDIA's proprietary NVLink SerDes
              protocols and optical networking roadmaps. This integration allows system architects designing
              heterogeneous AI factories to combine proprietary XPUs and custom silicon with NVIDIA accelerator clusters
              across multi-rack scale-up domains. Complementing silicon-level integration, Ayar Labs partners with
              server ODM Wiwynn to engineer rack-level CPO server nodes, managing mechanical strain, optical fiber
              routing, and precision blind-mate connectors essential for data center scale-out.
            claimRefs:
              - CE006
              - CE007
              - CE008
