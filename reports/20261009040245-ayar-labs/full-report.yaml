      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Inevitability of In-Package Optical Interconnects
            body: >-
              As AI accelerator clusters scale beyond individual server chassis, electrical copper interconnects face
              insurmountable physical thermal and reach boundaries [CM003, CM012]. Ayar Labs' co-packaged optics
              architecture delivers up to 10x lower power consumption and up to 16x higher bandwidth density,
              positioning optical I/O as an architectural inevitability for future hyperscale scale-up topologies
              [CM003, CM012, CM013, CM015].
            calloutType: insight
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM015
          - type: callout
            title: Packaging Yield and Qualification Bottlenecks
            body: >-
              Transitioning from monolithic semiconductor packages to multi-die co-packaged optics introduces severe
              advanced packaging, thermal alignment, and multi-vendor qualification hurdles [CM008, CM010]. While
              foundry partnerships with GlobalFoundries provide commercial fabrication capacity, widespread adoption
              depends on end customers accepting complex packaging re-engineering cycles [CM008, CM010, CM014].
            calloutType: risk
            claimRefs:
