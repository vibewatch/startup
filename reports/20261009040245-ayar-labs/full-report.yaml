      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Component Provider Paradox: Long Design Intercepts and High Qualification Leverage'
            body: >-
              Ayar Labs' commercialization model means it cannot generate fast-turnaround SaaS-style customer traction.
              Because its TeraPHY chiplets must be physically co-packaged with complex compute silicon using TSMC's
              cutting-edge packaging lines, Ayar Labs is bound to the multi-year silicon tapeout cycles of custom ASIC
              houses and tier-1 hyperscalers. Securing an intercept on a 2028-2029 hyperscaler platform creates a
              multi-hundred-million-dollar revenue trajectory, but missing the 2027 qualification window would defer
              production monetization by an entire silicon product generation.
            calloutType: insight
            claimRefs:
              - CU003
              - CU010
              - CU011
          - type: callout
            title: Incumbent Copper Resilience and Ecosystem Disintermediation Risk
            body: >-
              The primary competitive risk facing Ayar Labs' customer adoption is twofold: the enduring resilience of
              copper interconnects and the strategic ambiguity of its semiconductor backers. Continuous improvements in
              copper cabling, SerDes signaling, and retimers continue to extend electrical reach across short rack-scale
              distances, postponing the economic necessity of optical co-packaging. Concurrently, major strategic
              backers like NVIDIA and potential customers like Broadcom actively develop internal silicon photonics
              programs, creating permanent disintermediation risk if merchant optical chiplet margins compress.
            calloutType: risk
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Posture and Legal Diligence
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are the transition to high-volume manufacturing, multi-domain package
              integration, and weak public visibility into commercial economics. Ayar Labs announced a $500 million
              Series E, $870 million of total funding, and a $3.75 billion valuation, but funding raised is not cash
              available and none of the retained sources discloses burn, runway, audited revenue, gross margin, or
              customer concentration. The legal register therefore treats export controls, freedom to operate, privacy,
              and customer-security obligations as diligence gaps rather than confirmed violations or confirmed
              compliance. Cross-border expansion into Hsinchu increases the importance of that review, while the fetched
              GUC material establishes only GUC's own privacy-policy framework, not Ayar-specific controls. The
              investment thesis should break if counsel cannot document required licenses and IP ownership, or if
              management cannot reconcile public commercial estimates with audited results.
            claimRefs:
