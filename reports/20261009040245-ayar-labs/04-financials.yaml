callouts:
  - calloutType: "risk"
    title: "Operational and Scaling Risks in Commercializing Co-Packaged Optics"
    body: "Transitioning silicon photonics from demonstration vehicles to high-volume commercial production introduces severe operational vulnerabilities. Ayar Labs must maintain high-yield packaging with TSMC, achieve rigorous optical and thermal reliability across dense multi-rack AI server environments, and absorb escalating operational overhead across international design centers. Any timeline misalignment among key partners like Alchip or Wiwynn could delay commercial shipments and rapidly compress available cash buffers."
    claimRefs:
      - "CI006"
      - "CI012"
