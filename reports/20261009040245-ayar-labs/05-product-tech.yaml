callouts:
  - calloutType: "insight"
    title: "Decoupled External Lasers as a Prerequisite for CPO Manufacturability"
    body: "The core architectural insight behind Ayar Labs' SuperNova is that co-packaging temperature-sensitive semiconductor lasers directly on a kilowatt-class GPU substrate introduces severe reliability penalties. By keeping lasers in a serviceable front-panel ELSFP module and delivering light through optical fiber, Ayar Labs preserves high laser lifetime while capturing the full bandwidth density of in-package optical modulation."
    claimRefs:
      - "CE003"
      - "CE005"
  - calloutType: "risk"
    title: "Ecosystem Packaging Interdependencies and Foundry Tolerances"
    body: "Co-packaged optics cannot be commercialized in isolation. Ayar Labs depends fundamentally on TSMC's COUPE packaging flow and ASIC design partners like Alchip and GUC. Any defect in sub-micron fiber attachment, micro-ring thermal tuning, or package substrate yield directly impacts whole-wafer economics, creating an ecosystem dependency where delivery timing is tethered to external foundry maturity."
    claimRefs:
      - "CE006"
      - "CE010"
      - "CE013"
