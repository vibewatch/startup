        title: 商业模式、分销与合作伙伴接入
        blocks:
          - type: paragraph
            body: >-
              审阅页面更清楚地证明了生态接入，而不是商业条款。Ayar Labs 披露获得 Alchip、AMD、Intel、MediaTek、NVIDIA 和 Wiwynn 的战略支持；Wiwynn 尤其重要，因为它把
              Ayar 与数据中心基础设施供应商及机架级部署工作连接起来。公司还称 TeraPHY
              适配既有封装流程，这可能降低加速器和交换机厂商的集成摩擦。但指定产品或公司页面都没有说明目录价格、合同单位、批量折扣、授权条款、一次性工程费用、保修分配或客户排他性。Lightmatter、NVIDIA 和
              Celestial AI 的同类商业细节也缺失。因此，定价权、渠道经济性、多归属权和采购信任仍是尽调问题，而不是可守住的比较优势。
