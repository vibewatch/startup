  - id: FV001
    title: 建议与估值决策逻辑
    type: flow
    summary: 决策树展示从核心技术优势到最终跟踪建议的推导过程。
    data:
      nodes:
        - id: node-tech
          label: 光互连优势：TeraPHY 打破物理铜 I/O 瓶颈
        - id: node-ecosystem
