        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 凭借雄厚融资进入竞争：Tracxn 报告其累计融资 $1.02B，高于 Lightmatter 的 $850M 和 Celestial AI 的 $589M；2026 年披露还显示新增
              $150M，使当年新增募集资本达到 $650M。资本可以资助认证和制造，但不能证明出货、收入、现金可用性或客户锁定。CityBiz
              将当前扩张描述为制造准备，说明执行风险已从证明光学架构转向生产准备。不利情形是垂直竞争：NVIDIA 同时是 Ayar 的战略支持者和 Tracxn
              列出的主要竞争者，因此生态验证可以与渠道依赖和潜在替代并存。在缺乏独立基准、有约束力的放量承诺和量化重新设计成本时，投资评估应将其护城河视为有前景但尚未证明。
