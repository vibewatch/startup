              - CR008
              - CR009
              - CR011
              - CR014
              - CR016
      - number: '7.2'
        title: 制造、质量与技术执行
        blocks:
          - type: paragraph
            body: >-
              管理层对资金用途的表述本身就是风险信号：大批量生产和测试产能仍需扩张。产品必须把 TeraPHY 光学引擎与 SuperNova 外部光源结合起来；Ayar 称 TeraPHY
              采用主要加速器和交换机厂商已使用的标准外形与封装流程。兼容性说法可以降低重新设计风险，但不能证明良率、吞吐量、认证周期或现场可靠性。更重要的是，Ayar 网站引用的 GUC 高管指出
              CPO               集成会同时遇到架构、功耗与信号完整性、机械和热管理挑战。Ayar
              还声称进行了广泛验证和可靠性测试，但指定证据没有提供测试协议、样本量、故障分布或现场退货数据。应监测生产测试吞吐量、封装良率、光耦合缺陷、认证遗漏和平均故障间隔时间；若客户认证失败或良率持续不足，应暂停追加投资评估。
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
