      - number: '7.3'
        title: 合作伙伴依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Ayar 的商业化路径依赖生态，而不是垂直自足。KraneShares 描述了通过 Alchip 和 GUC 接入 GlobalFoundries 与 TSMC 生态的潜在制造路径；公司则把
              AMD、Alchip、MediaTek 和 NVIDIA 列为战略投资者。这些关系可能加快认证，但公开材料没有披露产能承诺、排他性、定价、第二供应源覆盖、责任分配或客户集中度。财务透明度同样不可靠：LeadIQ
              估算年收入为 $100M–$250M，Silicon Valley Invest Club 则单独列出未定义的“ARR / 收入”值 $91.6M，以及 $25M–$50M
              的收入区间估算。这些都是期间和分母不明确的第三方估算，不是公司经审计收入。否决条件包括无法对账的财务数据、没有合格替代方案的单一交易对手制造暴露，或合作伙伴认证延迟并在重复生产出货前耗尽新增资本。
            claimRefs:
              - CR010
