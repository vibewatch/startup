      - number: '2.3'
        title: 目标客户、价值链与生态采用
        blocks:
          - type: paragraph
            body: >-
              光学 I/O 不可能孤立采用；它需要半导体晶圆代工、封装和系统集成价值链之间深度横向协同 [CM008, CM010]。Ayar Labs 围绕多层生态伙伴关系推进商业化 [CM010,
              CM011]。在硅制造层，公司与 GlobalFoundries 合作，在商业规模的硅光子产线上制造光学芯粒 [CM010]。这种制造整合确保光学裸片符合标准 CMOS 制造公差，并适配自动化晶圆级测试环境
              [CM008, CM010]。在战略和客户层，Ayar Labs 将 NVIDIA、AMD、Alchip Technologies、Intel、Hewlett Packard Enterprise（HPE）和
              Lockheed Martin 等行业领先者列为战略金融及开发伙伴 [CM011]。参与 Universal Chiplet Interconnect Express（UCIe）联盟，也进一步把 Ayar
              Labs 锚定在开放行业标准中，使其光学 I/O 芯粒能够通过标准化 die-to-die PHY 协议与第三方计算裸片无缝连接 [CM014]。不过，商业采用仍有明显瓶颈
              [CM008]。封装内集成需要先进封装技术、专用光纤连接工具和严格热管理，才能让脆弱的激光二极管在极端数据中心环境下保持稳定 [CM008, CM012]。客户必须权衡高昂的前期封装再设计成本与长期节能和带宽收益
              [CM003, CM008]。
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
