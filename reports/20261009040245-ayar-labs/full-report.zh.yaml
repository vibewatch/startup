  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主张与反方论点
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 的核心投资主张建立在传统铜互连的物理极限之上：随着 AI 扩展突破单个服务器机架，计算将走向数千加速器组成的光网络。公司的 TeraPHY 光学 I/O 芯粒和 SuperNova
              多波长远程光源，相较电 SerDes 通道能以显著更低功耗提供每秒太比特级带宽密度，使其成为纯硅光子互连领域的重要供应商。与台湾数据中心基础设施供应商 Wiwynn 以及定制 ASIC 设计商
              Alchip、MediaTek 的战略商业合作表明，Ayar Labs 已从实验室组件演示迈向系统级和机架级制造整合。此外，NVIDIA、AMD Ventures 和 Intel Capital
              等主要计算厂商参与多轮融资，也印证了其与主流 AI 加速器路线图的深度协同。


              反方论点则强调商业化和估值上方的严重压力，因此不支持直接买入。Ayar Labs
              尚未披露经审计商业收入、ARR、毛利率、现金消耗或超大规模客户有约束力的量产承诺，因此数十亿美元企业估值依赖未来商业采用，而不是历史现金创造。与此同时，纯光学同行 Lightmatter 凭 Passage
              CPO 平台达到 $4.4B 估值，竞争对手 Celestial AI 则以 $3.25B 被 Marvell 收购，体现出高资本强度和激烈整合。Ayar Labs 虽预计 2028 年年出货量超过 1
              亿件，但客户集中度仍不透明；任何设计赢单延迟或超大规模客户自行开发光学技术，都可能压低私募市场倍数并触发下轮融资风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
      - number: '8.2'
        title: 建议、估值立场与风险评级
        blocks:
          - type: paragraph
            body: >-
              我们给予 Ayar Labs “跟踪”建议，中等置信度、高风险评级和“合理”估值判断。2026 年的资本扩张从 Neuberger Berman 于 2026 年 3 月领投、投后估值 $3.75B 的
              $500M Series E 开始，随后 2026 年 9 月追加 $150M，使 2026 年新增募集资本达到 $650M、累计融资达到 $1.02B。这为 Ayar Labs
              建设大批量制造生态和资助新的班加罗尔设计中心提供了较长现金跑道。同期由 Antero Peak Group 牵头、估值 $5.0B 的 2026 年 9
              月二级市场交易，为早期员工和初始投资人提供流动性，也说明机构兴趣强。


              但在看不到毛利率走势、生产良率或商业采购里程碑的情况下，以 $5.0B 或更高估值承接新的私募股权敞口，不符合纪律化入场标准。由于资本强度高、多芯片共封装装配流程复杂，并依赖晶圆代工和 ODM
              执行，风险评级仍为高。要正式升级为“买入”，必须看到可验证的客户出货、已披露的非零商业收入，以及超大规模客户 AI 集群中明确的生产部署里程碑。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析、可比公司与尽调问题
        blocks:
          - type: paragraph
            body: >-
              我们的情景框架评估 Ayar Labs 截至 2028 年的三条运营路径。基准情景下，Ayar Labs 与 Wiwynn 及主要 ASIC 合作伙伴顺利爬坡生产， 按计划在 2027-2028
              年实现商业出货爬坡，支撑退出估值 $5.0B-$7.0B。乐观情景下，超大规模云厂商集群迅速从铜互连迁移，推动光学 I/O 加速采用，使 Ayar Labs 能拿下可观市场份额、累计出货超过 1 亿颗光学
              chiplet，并以 $10.0B+ 的公开发行或战略收购溢价退出。 悲观情景下，制造封装良率落后，超大规模云厂商推迟采用光学方案或转向内部硅光项目，商业收入迟迟无法落地，最终被迫以稀释性低价轮融资， 或以低于
              $2.5B 的价格出售困难资产。


              关键可比交易凸显了这一格局：Lightmatter 在 2024 年以 $4.4B 估值融资 $400M，用于扩大光学计算和互连平台；Marvell 在 2026 年以 $3.25B 收购 Celestial
              AI，将 Photonic Fabric 光互连整合进其商用芯片组合。退出准备度取决于：证明芯片级可靠性足以覆盖数据中心高温运行环境，并拿到多年期大批量采购合同。最终尽调需核实非约束性管线的转化率、Series
              E 各批次融资后的完整股权结构表和清算优先权，以及 ELSFP 远端激光模块的独立现场可靠性测试结果。
            claimRefs:
              - CV004
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 资本纪律不支持激进买入
            body: Ayar Labs 拥有行业领先的光学 I/O 知识产权和一流半导体战略支持，但在客户合同金额未披露、商业毛利率尚无证明的情况下， 按 $5.0B 二级市场估值买入，意味着投资者承担了没有补偿的风险。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV010
          - type: callout
            title: 一体化半导体同行带来的整合威胁
            body: Marvell 以 $3.25B 收购 Celestial AI，凸显大型半导体厂商可能将光互连架构内化的风险，从而挑战独立光学 I/O chiplet 的利润率和定价权。
            calloutType: risk
            claimRefs:
              - CV004
              - CV013
