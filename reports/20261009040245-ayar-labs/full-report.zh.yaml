              的交换机 CPO 平台。此外，批量采用依赖极少数面向 2028–2029 年部署的超大规模客户定制 ASIC 项目；任何一家主要客户的认证延误、封装装配缺陷或架构转向，都可能严重打击 Ayar Labs
