    approximationNotes: 分析师编制的 1–5 序数评分。X 轴：光互连聚焦度（1 = 通用或电气，5 = 专用光互连）。Y 轴：指定证据的封装完整性（1 = 没有相关封装细节，5 = 明确的引擎、光源和集成路径）。评分衡量证据具体性，不代表技术优越性。
