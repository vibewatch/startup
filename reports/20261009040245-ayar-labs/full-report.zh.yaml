        - 顶级战略支持在加速器生态中形成防御性分销
        - 股权结构表包括 NVIDIA、AMD Ventures、Intel Capital、Alchip、MediaTek 和 Wiwynn
        - 关键战略合作伙伴推出内部竞争性光互连方案
      - - 反论点
        - 商业收入极度不透明，且未披露客户生产量
        - 公司披露累计融资 $1.02B，但收入、ARR 或利润率均为零披露
        - 经审计收入披露显示，到 2027 年产品年化销售额低于 $50M
      - - 反论点
        - 行业整合和同行资本化威胁独立商业市场份额
        - Lightmatter 估值 $4.4B；Celestial AI 于 2026 年被 Marvell 以 $3.25B 收购
        - 客户设计赢单流失给集成网络厂商（Broadcom、Marvell）
    notes: 论点将技术和生态证据与商业披露缺口进行综合对照。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV013
  - id: TV003
    title: 2028 年前乐观、基准和悲观情景预测
    columns:
      - 情景
      - 概率信号
      - 运营与里程碑假设
      - 估值与回报逻辑
      - 下行触发条件与关键风险
    rows:
      - - 乐观情景
        - 25%
        - 超大规模客户快速采用 1024+ GPU 光学集群；到 2028 年出货量超过 100M；收入超过 $200M
        - $10.0B - $14.0B IPO 或溢价收购倍数（远期收入的 20x-30x）
        - 先进封装或光纤对准良率出现供应链瓶颈
      - - 基准情景
        - 50%
        - 与 Wiwynn 的商业生产顺利爬坡并赢得定制 ASIC 设计；2027 年收入 $50M-$100M
        - 下一次流动性事件估值 $5.0B - $7.0B（当前二级基准的 1.0x-1.4x）
        - 采用时间表推迟至 2028 年；高昂晶圆厂封装成本压缩毛利
      - - 悲观情景
        - 25%
        - 认证周期长期拖延；超大规模客户部署自有 CPO；收入仍微乎其微
        - $1.5B - $2.5B 下轮融资或困境收购（二级市场估值折价 50%-70%）
        - 严重现金消耗耗尽 2026 年储备；客户集中度导致客户流失至 Marvell/Broadcom
    notes: 估值预测反映以 2026 年 Series E 主要融资（$3.75B）和二级交易（$5.0B）定价为锚的远期倍数假设。
    claimRefs:
      - CV001
      - CV004
      - CV012
      - CV014
      - CV015
      - CV016
