              根据公司材料和独立公司简介，Ayar Labs 于 2015 年成立，总部位于加利福尼亚州圣何塞。公司围绕 TeraPHY 光学引擎和 SuperNova
              外部光源开发共封装光学技术栈。其宣称的价值是用更靠近计算端的光连接取代受带宽限制的电连接，从而降低 AI
              系统跨机架扩展时面临的功耗和距离限制。公司称，这种方案能以半导体组件和生态集成模式运作，而不是已披露的经常性软件模式。产品性能和商业成熟度的描述属于公司说法；指定证据池中没有经审计的出货或收入证据能够独立验证其已广泛部署。
