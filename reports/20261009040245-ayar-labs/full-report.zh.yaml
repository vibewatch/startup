      - number: '6.2'
        title: 采用轨迹、2027 年量产里程碑与放量时点
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 光学 I/O 技术的采用轨迹由多年的半导体开发和认证周期决定，而不是由软件的快速部署节奏决定。公司源自 2015 年 DARPA 资助的大学研究，前十年开发硅光子微环谐振器
              IP、验证概念性光链路，并让市场认知从研究机构转向工业半导体创新者。到 2026 年，外部累计资本超过 $1B，其中 2026 年新增募集资本 $650M（3 月由 $500M、估值 $3.75B 的
              Series E 领投，9 月追加 $150M），另有一笔估值超过 $5B 的 $225M
              二级股份交易。这波后期资本专门用于扩大高批量生产、测试基础设施和工程验证，覆盖圣何塞、新竹（台湾）和班加罗尔（印度）设施。尽管资本雄厚，Ayar Labs
              仍处于量产前认证阶段，尚未披露商业批量收入或大众市场芯片出货。CEO Mark Wade 已公开承认，搭载 Ayar Labs 组件的客户产品预计在 2028 或 2029
              年左右实现规模化商业发布。因此，公司面临不可回避的运营期限：必须在 2027
              年底前完成量产所需的组件认证、封装良率和可靠性验证，以配合客户的设计冻结窗口。主要市场采用障碍不仅是竞争性光学方案，还包括成熟铜缆和电               SerDes
              的持续技术进步。短距离场景下，铜互连成本低、制造成熟，现场维护也更容易，优势依然明显。Ayar Labs 的商业采用速度完全取决于能否证明光学 I/O
              带来的系统级节能和距离改善不可替代，足以抵消在千瓦级计算硅片旁直接共封装光学所固有的良率、散热和封装整合风险。
