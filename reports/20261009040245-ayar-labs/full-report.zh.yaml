              - CM004
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: 证据图表
        blocks:
          - type: callout
            title: 封装内光互连的架构必然性
            body: >-
              当 AI 加速器集群超出单台服务器机箱的规模后，铜制电互连将触及无法克服的散热和传输距离边界 [CM003, CM012]。Ayar Labs 的共封装光学架构可将功耗降低最高 10 倍、带宽密度提高最高 16
              倍，使光学 I/O 成为未来超大规模扩展架构的必然选择 [CM003, CM012, CM013, CM015]。
            calloutType: insight
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM015
          - type: callout
            title: 封装良率与认证瓶颈
            body: >-
              从单片半导体封装转向多芯片共封装光学，会带来严峻的先进封装、热对准和多供应商认证难题 [CM008, CM010]。GlobalFoundries
              的晶圆代工合作提供了商业化制造产能，但大规模采用仍取决于终端客户是否接受复杂的封装再设计周期 [CM008, CM010, CM014]。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              证据显示这是分层竞争格局，而不是单一同行群体。Tracxn 将 NVIDIA、Lightmatter 和 Acacia 列为 Ayar Labs 的主要竞争对手，并单独介绍了已被收购的光互连公司
              Celestial AI。Lightmatter 是最直接的专业竞争者，因为其描述明确结合了面向 AI 基础设施的光互连与共封装光学。NVIDIA 是现有平台替代者：其销售广泛的软硬件技术栈，即使 Ayar
              只供应组件，也能影响架构、供应和分销。Acacia 与 Celestial AI 属于相邻的光学先例。铜制电 I/O 仍是 Ayar
              试图取代的现状，而客户内部设计也是可信替代方案，只是指定证据池没有量化。由此，市场边界包括直接光学同行、集成半导体巨头、被收购光学资产、传统铜互连和内部自研。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP016
      - number: '3.2'
        title: 能力定位与证据边界
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 最具体的差异化在于把 TeraPHY 光学引擎与 SuperNova 外部光源结合起来。产品页面称二者可为数千个 GPU 构建光网络，且 TeraPHY 采用主要 XPU
              和交换机厂商已经使用的外形、制造流程和封装流程。在本证据集内，这些说法支持其封装完整性和集成准备度优势，但仍属于公司说法，不是独立基准结果。Tracxn 只为 Lightmatter、Celestial
              AI、Acacia 和 NVIDIA
              提供高层描述，没有提供可比的延迟、功耗、可靠性、良率或认证数据。因此，矩阵将缺乏支持的竞争者单元标记为未知，定位图只评估方案聚焦度和公开指定产品证据的完整性，而非产品性能或市场份额。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
              - CP014
