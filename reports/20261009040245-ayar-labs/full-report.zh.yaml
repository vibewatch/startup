      - number: '5.2'
        title: 部署流程、生态整合与 NVLink Fusion 兼容性
        blocks:
          - type: paragraph
            body: >-
              部署共封装光互连，需要电子设计自动化（EDA）、定制 ASIC 设计公司、晶圆代工厂和系统 ODM 之间深度跨行业协同。Ayar Labs 不试图垂直组装系统，而是接入既有半导体封装供应链。公司与 Taiwan
              Semiconductor Manufacturing Company（TSMC）紧密合作，采用 TSMC 的 Compact Universal Photonic Engine（COUPE）技术和
              System-on-Integrated-Chips（TSMC-SoIC）封装流程。通过与 Alchip Technologies 和 Global Unichip Corp（GUC）等领先 ASIC
              设计服务商合作，Ayar Labs 让超大规模客户可使用包括 Universal Chiplet Interconnect Express（UCIe）在内的标准 die-to-die 协议，把 TeraPHY
              芯粒集成到定制加速器封装中。2026 年 6 月，Ayar Labs 加入 NVIDIA 的 NVLink Fusion 生态，这是重要商业和技术里程碑，使其与 NVIDIA 专有 NVLink SerDes
              协议和光网络路线图实现光学及电气互操作。该整合让异构 AI 工厂的系统架构师能够在多机架扩展域中，把专有 XPU 和定制硅片与 NVIDIA 加速器集群结合。除硅片级整合外，Ayar Labs 还与服务器 ODM
              Wiwynn 合作设计机架级 CPO 服务器节点，处理数据中心扩展所需的机械应力、光纤布线和精密盲插连接器。
