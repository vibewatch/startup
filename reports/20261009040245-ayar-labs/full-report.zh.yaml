  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 分层市场规模视角，将宏观 AI 互连需求追溯至封装内光学 I/O 以及 Ayar Labs 经核实的 Series E 资本化。
    data:
      nodes:
        - level: 1
          label: 可触达总市场（TAM）
          value: Macro AI Interconnect Fabric
          unit: Global Datacenter Fabrics
          detail: 全球对高速机架间网络、交换机和加速器互连的总市场需求。
        - level: 2
          label: 可服务可触达市场（SAM）
          value: Co-Packaged Optics & Optical I/O
          unit: In-Package Interconnects
          detail: 部署在 AI 计算加速器和内存系统中的硅光子芯粒与外部光源。
        - level: 3
          label: 可服务可获得市场（SOM）
          value: Standardized Multi-Die Silicon
          unit: Commercial Foundry Partnerships
          detail: TeraPHY 和 SuperNova 架构在合作伙伴 ASIC、GPU 和超大规模云集群中的设计赢单。
        - level: 4
          label: 企业资本化里程碑
          value: $3.75B Valuation / $870M Funding
          unit: Capitalization Through Series E
          detail: Neuberger Berman 和战略半导体合作伙伴于 2026 年领投的 $500M Series E，为商业验证提供证据。
        - level: 5
          label: Series D 资本化代理
          value: $155M Raised at >$1B Valuation
          unit: December 2024 Financing
          detail: 资本化里程碑，显示光互连扩张获得早期独角兽验证。
        - level: 6
          label: 公开主题投资组合敞口
          value: 0.64% Fund Allocation
          unit: KraneShares AI ETF (AGIX)
          detail: 截至 2026 年 7 月，活跃机构敞口持有私有光子学先驱 Ayar Labs。
    approximationNotes: 估值和融资指标反映已披露的主要融资轮次；更广泛的 TAM/SAM 规模反映架构层面的市场定义。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM015
  - id: FP001
    title: 受证据边界约束的竞争定位
    type: quadrant
    summary: 序数定位比较光互连聚焦度与指定来源池中产品封装证据的完整性，不代表市场份额或性能。
    data:
      points:
        - label: Ayar Labs
          x: 5
          'y': 5
          detail: 专注光学 I/O；指定官方来源同时描述了光学引擎和外部光源。
          claimRefs:
