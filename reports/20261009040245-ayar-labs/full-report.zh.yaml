  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与向光学 I/O 的架构转变
        blocks:
          - type: paragraph
            body: >-
              前沿人工智能模型的快速扩展，推动了高性能计算互连架构转型 [CM001, CM004]。前沿分布式训练和推理集群需要在数百至数千个计算节点之间实现前所未有的加速器间通信带宽 [CM004,
              CM015]。过去，沿铜质印刷电路板走线和有源电缆运行的高速串行器/解串器通道能够满足机架级互连需求 [CM003]。但当单通道数据传输速率超过 112 Gbps 和 224 Gbps
              后，电阻会造成严重信号衰减、散热瓶颈和延迟恶化 [CM003, CM012]。为解决这一铜互连的物理瓶颈，共封装光学（CPO）把硅光子直接与 GPU、TPU 和内存堆栈等计算硅片集成到共享基板或中介层上
              [CM002, CM003]。Ayar Labs 以 TeraPHY 光学芯粒和 SuperNova 多波长远程光源组成的集成光学 I/O 方案定义这一商业空间 [CM002, CM012,
              CM013]。在硅封装中以光波导和光纤取代铜线后，该架构相较标准铜电接口可实现最高 10 倍的功耗降低、最高 9 倍的延迟降低和最高 16 倍的带宽密度提升 [CM012,
              CM013]。这一结构性转变将物理互连长度与功耗解耦，使计算扩展突破单台服务器和机架边界，进入统一光网络架构 [CM003, CM015]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM012
              - CM015
      - number: '2.2'
        title: 市场规模、资本速度与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              光学 I/O 的可服务市场正随全球对 AI 数据中心基础设施的资本开支同步扩张 [CM004, CM005]。总潜在市场（TAM）涵盖更广泛的 AI 互连和高速通信网络，包括光收发器、交换机和机架网络
              [CM001, CM004]。在这一宏观类别内，可服务市场（SAM）由集成到下一代 AI 加速器、定制 ASIC 和解耦内存架构中的封装内光学芯粒与共封装光学方案构成 [CM002, CM010,
              CM015]。Ayar Labs 的可获取市场（SOM）体现为其与领先半导体厂商和转向标准化芯粒模块化的超大规模云运营商取得商业设计赢单 [CM010, CM011,
              CM014]。尽管私营公司运营收入、年度经常性收入（ARR）和出货量指标在公开申报中仍未披露，私人资本的增长速度仍可作为商业进展的有力量化代理指标 [CM005, CM006, CM009]。2024 年 12
              月，Ayar Labs 完成 $155M 融资，投后估值超过 $1.0B [CM006]。截至 2026 年 3 月，公司完成由 Neuberger Berman 领投的 $500M Series
              E，累计股权资本增至 $870M，企业估值升至 $3.75B [CM005, CM006]。KraneShares AI ETF（AGIX）等公开主题基金也已直接持有 Ayar Labs，截至 2026 年 7
              月占组合权重 0.64%，显示影响已外溢到更广泛资本市场 [CM007]。
            claimRefs:
