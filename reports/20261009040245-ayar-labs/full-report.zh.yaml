  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构：TeraPHY 光学芯粒与 SuperNova 光源
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 将模块化硅光子架构商业化，用于解决 AI 加速器集群中铜互连的散热、传输距离和带宽密度瓶颈。物理架构核心是
              TeraPHY：一种封装内光输入/输出（I/O）引擎，以单片硅光子裸片实现。TeraPHY 集成高速 CMOS 驱动逻辑、微环调制器、光探测器和标准化电 die-to-die 接口。通过标准封装流程（如 TSMC
              COUPE 和先进 2.5D/3D 基板）将 TeraPHY 与 GPU、XPU 或网络交换机一起直接共封装到共享多裸片基板上，电走线可缩短到毫米级。相较传统可插拔光收发器，这种微架构整合可将能耗降低约
              85%，并使单位边缘占用的带宽密度提高最高 100 倍。光功率通过与 SuperNova 连接的保偏单模光纤阵列传输；SuperNova 是置于行业标准可现场更换 ELSFP
              外形中的外部多波长激光光源。将激光二极管与高温加速器计算封装物理解耦，可隔离敏感半导体激光器，减少剧烈热循环，显著延长激光器寿命并提升现场可靠性。平台合在一起建立光网络，让数千个 GPU
              裸片具备单一统一域的延迟和带宽特征。
