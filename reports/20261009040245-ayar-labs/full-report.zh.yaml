  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业变现架构
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 将共封装光学（CPO）架构商业化，旨在打破 AI 集群中铜网络受带宽和散热功耗限制的瓶颈。商业架构由两项互补硬件组成：TeraPHY 光学 I/O 芯粒和 SuperNova
              多波长远程激光光源。TeraPHY 光学引擎与计算硅片一起直接集成到主机加速器封装中，作为高密度光收发器把电信号转换为光数据流。SuperNova 通过可现场更换的 ELSFP
              模块提供外部光功率，将发热的激光二极管与敏感的处理器封装解耦。除直接销售硅片外，Ayar Labs 还通过定制 NRE（一次性工程）合同、与定制 ASIC
              伙伴共同开发的系统参考设计，以及拟议的批量晶圆/裸片授权协议，变现其 IP 和工程能力。不过，商业目录价格并未公开；合作采用谈判确定的企业和战略半导体开发协议，实际平均售价高度取决于定制封装整合和承诺的晶圆配额。
