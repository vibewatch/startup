      - number: '5.3'
        title: 技术护城河、差异化与执行缺口
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 的技术差异化建立在四根支柱上：密集波分复用（DWDM）微环谐振器 IP、协议无关的电接口、外部激光热管理，以及经过认证的高批量晶圆代工兼容性。TeraPHY 使用微米级环形调制器，而不是笨重的
              Mach-Zehnder 干涉仪，因此能实现每毫米裸片边缘极高的光带宽密度。协议无关性还让同一硅片能够传输 PCIe、CXL、UCIe 或 NVLink Fusion
              等专有网络，在不同加速器架构间提供灵活性。为保护技术基础，公司维护覆盖热环稳定、光耦合和封装级光互连的大量专利。但产品和工业化风险仍很大：光纤连接和光学封装要求亚微米对准公差，在批量 2.5D
              封装装配中可能形成良率瓶颈。复杂机架架构中损坏光纤尾纤的现场更换，也带来可维修性挑战。外部 SuperNova
              模块在多年部署中的激光衰减，需要冗余激光通道故障切换机制，而该机制目前尚未在兆瓦级客户集群中验证。随着 Ayar Labs 通过台湾新竹设施和生态伙伴扩大高批量制造，公司必须跨过这些封装良率和可靠性障碍。
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: 证据图表
        blocks:
          - type: callout
            title: 解耦式外部激光器是 CPO 可制造性的前提
            body: >-
              Ayar Labs 的 SuperNova 背后的核心架构洞见是：把对温度敏感的半导体激光器直接共封装在千瓦级 GPU 基板上，会带来严重可靠性损失。将激光器保留在可维修的前面板 ELSFP
              模块中，再通过光纤送光，Ayar Labs 既能保持较长激光器寿命，又能获得封装内光调制的全部带宽密度。
            calloutType: insight
            claimRefs:
              - CE003
              - CE005
          - type: callout
            title: 生态封装相互依赖与晶圆代工容差
            body: >-
              共封装光学不可能孤立商业化。Ayar Labs 根本上依赖 TSMC 的 COUPE 封装流程，以及 Alchip、GUC 等 ASIC
              设计伙伴。亚微米光纤连接、微环热调谐或封装基板良率的任何缺陷，都会直接影响整片晶圆经济性，形成一种生态依赖：交付时间被外部晶圆代工厂的成熟度所牵制。
            calloutType: risk
            claimRefs:
              - CE006
              - CE010
              - CE013
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、价值主张与间接采用模式
        blocks:
          - type: paragraph
            body: >-
              Ayar Labs 采用由生态驱动的间接商业模式，面向超大规模 AI 基础设施中的三类买方和集成环节。主要终端需求来自面临严重电互连边界的一级超大规模云服务商和前沿 AI 实验室，如
              Microsoft、Google、AWS 和 Meta。在数千加速器组成的训练和推理集群中，传统铜制 SerDes
              互连触及功耗和距离上限，把扩展网络限制在单个服务器机架内，并消耗集群能源预算中不可接受的比例。为此，Ayar Labs 用 TeraPHY 光学引擎和 SuperNova 外部光源取代电链路，构建光网络，让数千个
              GPU 或 XPU 以低延迟、高带宽密度跨多个机架通信。但 Ayar Labs 不制造完整计算服务器或加速器，因此不会以独立系统形式直接向超大规模客户采购团队销售。其直接商业对手方是定制 ASIC
              设计服务商、半导体封装厂和原始设计制造商（ODM）。以 Alchip Technologies 为首的定制硅伙伴，利用 TSMC COUPE 和 TSMC-SoIC 等先进封装技术，把 TeraPHY
              芯粒集成到超大规模客户的定制加速器封装中。同时，Wiwynn 等服务器 ODM 将共封装光学模块和 SuperNova 光源集成到可部署机架架构中，处理精密光纤布线、盲插连接器和机箱散热。第二类战略客户是
              NVIDIA、AMD 等企业级加速器和网络硅厂商，它们既是战略投资人也是生态伙伴，在内部光学开发和外部 CPO 集成之间权衡。由于 Ayar Labs 将专业硅芯粒供应给多层 OEM 和 ODM
              供应链，其收入结构性依赖批量设计赢单和芯粒出货，而非软件订阅，因而认证周期长、客户集中度高。
