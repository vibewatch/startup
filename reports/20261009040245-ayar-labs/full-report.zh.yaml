  - id: FE001
    title: Ayar Labs 共封装光学架构分层图
    type: stack
    summary: Ayar Labs 光学 I/O 与共封装光学部署架构的结构分层，从硅光子学延伸至系统集成。
    data:
      layers:
        - label: 计算与主机逻辑层
          detail: 主机 AI 加速器、GPU 和定制 XPU 执行模型训练与推理工作负载
        - label: 芯粒间互连层
          detail: 高密度标准电气接口（UCIe、专有 SerDes）将主机芯粒连接至光学引擎
        - label: TeraPHY 硅光子层
          detail: 单片光学 I/O 引擎通过微环将电气数据转换为多波长光信号流
        - label: 外部激光与光功率层
          detail: SuperNova 远端多波长连续波激光器通过 PM 光纤提供光功率
        - label: 先进封装集成层
          detail: TSMC COUPE / SoIC 2.5D/3D 基板与 Alchip 封装容纳计算硅片和光学芯粒
        - label: 系统与机架级光学互连网络
          detail: Wiwynn 机架级机箱和 NVLink Fusion 光学互连网络，将数千个 GPU 连接成光学岛
    approximationNotes: 架构分层表示源自已发布的技术图和生态合作公告；展示结构层级，而非物理尺寸比例。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE008
      - CE010
      - CE014
  - id: FU001
    title: Ayar Labs 客户采用与商业化旅程图
    type: journey-map
    summary: 多阶段客户旅程图，展示从基础硅研究到生态共封装、认证和多机架超大规模部署的进程。
    data:
      items:
        - label: 阶段 1：研究与硅验证（2015-2020）
          detail: DARPA 支持的研究衍生公司将微环硅光子知识产权商业化；在实验室环境中展示 TeraPHY 光传输。
          touchpoints:
            - DARPA 研究资助和大学专利
            - 首次硅原型展示
            - 首轮 Series A 风险投资
        - label: 阶段 2：生态与 MSA 标准化（2020-2024）
          detail: 共同创立 CW-WDM MSA 联盟（扩展至 55 个成员）；与半导体晶圆厂（TSMC、GlobalFoundries）及早期战略投资者（Intel、NVIDIA、AMD）合作。
          touchpoints:
            - CW-WDM MSA 联盟启动和规范发布
            - OmniScale Media 从研究实体转型为品类创新者
            - 获半导体战略支持的 Series B 和 C 融资轮
        - label: 阶段 3：ASIC 与 ODM 联合开发（2025-2026）
          detail: 与 ASIC 设计领导者 Alchip 和机架 ODM Wiwynn 建立双边开发合作；2026 年获得 $650M 融资，并开设新竹和 Bengaluru 设计中心。
          touchpoints:
            - Alchip 围绕 TSMC COUPE 和 SoIC 封装流程的战略合作
            - Wiwynn 机架级共封装光学合作与股权投资
            - 完成 $500M Series E 融资，估值 $3.75B，并追加 $150M
        - label: 阶段 4：组件批量认证（2026-2027）
          detail: 严格运营关卡，目标是在 2027 年底前完成 TeraPHY 和 SuperNova 模块的批量生产良率、热可靠性及光学连接公差认证。
          touchpoints:
            - 大批量封装和测试产能扩张
            - 针对铜替代方案开展严格的客户组件认证测试
            - 面向下一代平台的多客户设计冻结窗口
        - label: 阶段 5：商业化超大规模发布（2028-2029）
          detail: 计划商业发布集成 Ayar Labs 光学 I/O 的客户 AI 系统，在超大规模 AI 集群中启用多机架光学互连网络。
          touchpoints:
            - 首批向客户出货 TeraPHY 芯粒和 SuperNova 光源
            - 集成到客户的多机架超大规模 AI 加速器系统
            - 首次确认商业产品收入和经营利润率
        - label: 阶段 6：多机架光学互连网络扩张（2029+）
          detail: 在异构 AI 计算互连网络中全面放量，将光学扩张领域延伸至部署数千个加速器的数据中心。
          touchpoints:
            - 不同云超大规模客户的大批量重复组件订单
            - 在兆瓦级 AI 数据中心替换电气铜背板
            - 在下一代服务器架构中实现共封装光学标准化
    approximationNotes: 按时间顺序的阶段表示源自公司公开披露、CEO 访谈和合作公告；阶段 4 和 5 是管理层里程碑目标，而非最终结果。
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU013
      - CU014
      - CU015
