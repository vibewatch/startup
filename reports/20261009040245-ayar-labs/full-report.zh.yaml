        title: 证据图表
        blocks:
          - type: callout
            title: 组件供应商悖论：漫长设计切入周期与高认证杠杆
            body: >-
              Ayar Labs 的商业化模式决定了它无法快速获得 SaaS 式客户 traction。由于 TeraPHY 芯粒必须借助 TSMC 的尖端封装产线与复杂计算硅片物理共封装，公司受制于定制 ASIC
              厂商和一级超大规模客户多年流片周期。若切入 2028–2029 年的超大规模客户平台，可形成数亿美元收入轨迹；但若错过 2027 年认证窗口，生产变现将推迟整整一代硅产品。
            calloutType: insight
            claimRefs:
              - CU003
              - CU010
              - CU011
          - type: callout
            title: 现有铜互连的韧性与生态去中介风险
            body: >-
              Ayar Labs 客户采用面临两项主要竞争风险：铜互连的持续韧性，以及半导体支持者的战略模糊性。铜缆、SerDes 信号和 retimer
              的持续改进不断延长短距离机架级电连接范围，推迟了共封装光学的经济必要性。与此同时，NVIDIA 等主要战略支持者和 Broadcom
              等潜在客户都在积极开发内部硅光子项目；一旦商业光学芯粒利润率被压缩，公司就会面临永久性的去中介风险。
            calloutType: risk
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与法律尽调
        blocks:
          - type: paragraph
            body: >-
              最大的剩余风险是转向大批量制造、多领域封装整合，以及商业经济性缺乏公开透明度。Ayar Labs 宣布了 $500M Series E、累计融资 $870M 和 $3.75B
              估值，但募集资金不等于可用现金，现有来源也没有披露现金消耗、现金跑道、经审计收入、毛利率或客户集中度。因此，法律清单将出口管制、自由实施、隐私和客户安全义务视为尽调缺口，而不是已确认的违规或合规。跨境扩展到新竹提高了审查重要性；抓取的
              GUC 材料只说明 GUC 自身的隐私政策框架，不代表 Ayar 的控制措施。如果法律顾问无法证明所需许可证和 IP 所有权，或管理层无法将公开商业估算与审计结果对账，投资主张就应失效。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR011
              - CR012
              - CR013
              - CR016
