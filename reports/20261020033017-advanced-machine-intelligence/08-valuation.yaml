    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Large financing is verified, but entry terms and commercial metrics are not disclosed.", "Do not underwrite an invest-now decision from the headline round alone."]
      - ["Confidence", "Medium", "Round size and valuation are consistently reported; operating and ownership inputs remain unavailable.", "Treat the view as conditional on data-room verification."]
      - ["Risk rating", "High", "The company is in a research-first period and physical-AI peers can remain pre-commercial despite large capital bases.", "Require milestone, runway, and commercialization gates."]
      - ["Valuation stance", "Expensive / insufficiently supported", "The reported $3.5B pre-money mark precedes public commercial proof in the retained evidence.", "Negotiate price or structure only after terms and operating evidence are available."]
      - ["Return / exit view", "Not publicly underwritable", "No ownership, dilution, preference, revenue, or exit-multiple inputs support a target return.", "Defer numeric return and hold-period modeling."]
    notes: "Analyst synthesis from the retained public evidence; no return range or ownership outcome is estimated where financing and operating inputs are missing."
    claimRefs: [CV001, CV002, CV004, CV005, CV008, CV012, CV015, CV016]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "Capital capacity", "AMI raised $1.03B in a seed round, giving it an unusually large research budget.", "Evidence that capital converts into independently verified milestones without disproportionate burn."]
      - ["Thesis", "Defined research horizon", "Reports describe first-year R&D focus, partner discussions in six to twelve months, and a three-to-five-year ambition.", "Signed partner scope, milestone acceptance criteria, and budgeted timelines."]
      - ["Anti-thesis", "Price precedes proof", "The reported $3.5B pre-money valuation is not accompanied by disclosed commercial metrics or investor terms.", "Audited operating metrics and clean, investor-aligned financing terms."]
      - ["Anti-thesis", "Hot-market mark risk", "A few deals dominated first-quarter 2026 venture value, while investors separately warned that early-stage AI valuations were frothy.", "Comparable marks supported by revenue, technical benchmarks, and durable exit liquidity."]
    notes: "The comparable signals describe market conditions and proof timing; they are not normalized valuation multiples for AMI."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV010, CV012, CV015]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Partner discussions convert into material commitments; externally tested technical and safety milestones arrive on schedule.", "The current mark becomes more defensible, but no numeric upside or return range is supportable without ownership and exit inputs.", "Compute intensity, technical failure, and weak contract economics.", "No defensible public probability; require milestone and contract evidence."]
      - ["Base", "AMI executes the disclosed research-first year and opens partner discussions, but commercial metrics and terms remain private.", "Maintain research-more and treat $3.5B pre-money as expensive relative to public proof.", "Long proof cycle, dilution, and valuation compression.", "Most consistent with the currently disclosed timeline, but not statistically estimable."]
      - ["Bear", "Commercialization slips, technical evidence remains internal, and early-stage AI valuation enthusiasm cools.", "A down round, structured financing, or material dilution becomes plausible; magnitude cannot be quantified publicly.", "Preference overhang, financing concentration, and an extended pre-revenue cost base.", "Triggered by missed milestones or another financing before externally validated proof."]
    notes: "Scenarios are qualitative because the retained sources do not disclose cap-table, cash-flow, commercial, or preference inputs needed for numeric probabilities and returns."
    claimRefs: [CV002, CV004, CV005, CV008, CV011, CV012, CV015, CV016]
