company:
  name: "Advanced Machine Intelligence"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    AMI raised $1.03 billion at a reported $3.5 billion pre-money valuation, an
    unusually large seed financing that gives the company time to pursue a
    long-duration research plan. The retained evidence does not disclose the
    financing terms or commercial metrics needed to underwrite that mark, so the
    appropriate stance is research-more, with high risk and an expensive,
    insufficiently supported entry valuation.
sections:
  - id: "investment-view"
    title: "Investment view and recommendation"
    body: >-
      The recommendation is research-more, not invest-now. AMI has exceptional
      financing capacity for a seed-stage company: independent reports place the
      round at $1.03 billion and the pre-money valuation at about $3.5 billion.
      That scale can fund a serious research program, but it also moves much of
      the expected technical and commercial success into today's entry price.
      The retained evidence describes a first year centered on research and
      development, with corporate-partner discussions expected within six to
      twelve months, rather than verified revenue, retention, margin, or customer
      economics. Confidence is medium because the financing facts are consistent
      across the assigned sources, while the underwriting inputs that determine
      effective price and return remain private. Risk is high and the valuation
      stance is expensive until milestones and terms can be verified.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "financing-and-comparables"
    title: "Financing context and comparable signals"
    body: >-
      The closest public signals describe a market willing to finance frontier
      physical-AI research before commercialization. Physical Intelligence was
      reportedly discussing a roughly $1 billion raise above an $11 billion
      valuation while acknowledging no commercialization timeline and an
      appetite for additional compute. That is useful as a market-temperature
      indicator, not as a direct operating comparable: the source does not
      normalize technology scope, ownership, revenue, burn, or round terms.
      Broader venture evidence is similarly hot and concentrated. SiliconANGLE's
      account of PitchBook data says first-quarter 2026 U.S. venture deal value
      reached $267.2 billion, with five deals representing 73% and AI accounting
      for 89%. These figures support caution about mark-setting conditions, not a
      precise AMI multiple.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: "scenario-analysis"
    title: "Bull, base, and bear framing"
    body: >-
      A defensible scenario framework must remain milestone-based because the
      assigned evidence does not establish revenue, cash burn, ownership,
      dilution, liquidation preferences, or an exit multiple. In the bull case,
      AMI converts its unusually large capital base into externally validated
      technical milestones and substantive partner commitments on or ahead of
      the disclosed six-to-twelve-month discussion window. The base case follows
      the stated research-first plan but leaves valuation unsupported by
      commercial proof, preserving a research-more stance. The bear case combines
      delayed commercialization with a correction in early-stage AI valuations,
      increasing down-round or dilution risk. No numeric probabilities, return
      targets, or valuation ranges are supportable from the retained public
      evidence; investment committee modeling should wait for the missing terms
      and operating data.
    claimRefs: [CV002, CV004, CV005, CV006, CV008, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
  - id: "diligence-and-thesis-breaks"
    title: "Entry discipline, diligence asks, and thesis breaks"
    body: >-
      Entry discipline should require the capitalization table, fully diluted
      ownership, option-pool treatment, security type, liquidation preference,
      participation rights, tranches, side letters, pro-rata rights, and any debt
      or compute commitments. Commercial diligence should obtain signed partner
      agreements, revenue and pipeline by stage, customer concentration,
      retention, gross margin, monthly burn, runway, and milestone-linked compute
      budgets. Technical diligence should define measurable reliability and
      safety thresholds, using a documented risk process such as the voluntary
      NIST AI Risk Management Framework rather than treating broad safety
      language as validation. Thesis-break triggers are a missed partner window,
      repeated milestone slippage, financing terms that materially subordinate
      new investors, or failure to produce independently testable performance and
      safety evidence before the next capital event.
    claimRefs: [CV005, CV008, CV012, CV014, CV015, CV016]
tables:
