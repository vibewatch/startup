      severity: material
      topic: revenue-model
      missingEvidence: "Executed customer and partner contracts showing pricing, minimum commitments, revenue share, term, renewals, and cash receipts."
      whyItMatters: "Without contract economics, strategic access cannot be translated into revenue quality or recurring gross profit."
      diligencePath: "Review the Nabla agreement and a complete contract-level revenue schedule with finance and legal."
      relatedQuestionRefs: [QI001, QI002, QI007]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: "Bank-confirmed unrestricted cash, monthly cash burn, closing proceeds, tranches, debt, and contracted compute or capex obligations."
      whyItMatters: "Funding raised cannot determine liquidity, financing dependency, or the date of the next capital trigger."
      diligencePath: "Reconcile the financing closing statement to bank balances and a monthly twenty-four-month cash forecast."
      relatedQuestionRefs: [QI003, QI005]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: "Company-specific compute, data, cloud, integration, support, and partner costs by product workload."
      whyItMatters: "Industry compute benchmarks cannot establish AMI's gross margin or contribution margin."
      diligencePath: "Obtain workload-level cost telemetry and reconcile it to invoices, deployment volumes, and accounting classifications."
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: go-to-market
      missingEvidence: "Paid pipeline, sales-cycle, CAC, implementation burden, pilot-conversion, renewal, and customer-concentration data."
      whyItMatters: "Partner discussions and one strategic relationship do not demonstrate repeatable commercial efficiency."
      diligencePath: "Review CRM cohorts, signed pilots, losses, conversion timing, customer references, and acquisition spending."
      relatedQuestionRefs: [QI001, QI007]
      relatedTableRefs: [TI001, TI002]
    - type: missing-source
      severity: material
      topic: valuation-risk
      missingEvidence: "A milestone-based operating plan linking the reported valuation and financing to technical, commercial, and cash outcomes."
      whyItMatters: "A high entry valuation increases the scale and timing of outcomes required for venture returns."
      diligencePath: "Model ownership and return outcomes against milestone slippage, follow-on dilution, and downside financing scenarios."
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI003]
