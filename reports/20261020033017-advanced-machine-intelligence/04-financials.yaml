    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Seed financing, "$1.03B reported", High, "Defines financing scale, not current liquidity", "Closing statement, tranches, fees, and net cash proceeds"]
      - [Pre-money valuation, "$3.5B reported", High, "Sets a demanding value-creation threshold", "Cap table, fully diluted shares, preferences, and effective entry price"]
      - [Near-term hiring, "Expansion planned", Medium, "Provides a limited operating-expansion proxy", "Current payroll, hiring plan, loaded cost, and geography"]
      - [Recognized revenue or ARR, null, Low, "Required to assess traction and revenue quality", "Audited revenue bridge by customer, product, geography, and contract type"]
      - [Gross or contribution margin, null, Low, "Required to test scalable economics", "Compute, data, cloud, implementation, support, and partner costs by workload"]
      - [Monthly cash burn, null, Low, "Required for capital planning", "Monthly operating, capex, and working-capital cash bridge"]
      - [Cash and runway, null, Low, "Funding raised cannot substitute for cash availability", "Bank-confirmed unrestricted cash, obligations, burn scenarios, and next-round trigger"]
    notes: "Reported financing and valuation are corroborated media figures; operating metrics are unavailable in the reviewed public evidence and must not be read as zero."
    claimRefs: [CI001, CI002, CI004, CI010, CI011, CI012, CI015]
