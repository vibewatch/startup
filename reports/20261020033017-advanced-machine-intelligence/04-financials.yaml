company:
  name: Advanced Machine Intelligence
chapter:
  number: 4
  title: Financials
  summary: >-
    AMI has unusually large reported seed financing, but the public record still describes a
    research-stage company and does not disclose pricing, recognized revenue, gross margin, burn,
    cash, or runway. The financial case therefore rests on capitalized R&D and future partner-led
    commercialization rather than underwritable operating economics.
sections:
  - id: revenue-model
    title: Revenue evidence remains pre-commercial
    body: >-
      The clearest public commercialization signal is Nabla: multiple reports identify it as AMI's
      first partner, and a healthcare-industry account describes an exclusive strategic arrangement
      that gives Nabla first access to AMI's models. That establishes a potential partner-led route
      into healthcare, but not a revenue stream. None of the reviewed sources discloses a license
      fee, usage price, minimum commitment, revenue share, contract duration, recognized revenue,
      ARR, or gross margin. One market profile explicitly characterizes AMI as focused on
      foundational research with no short-term revenue. The underwriting distinction is important:
      privileged technology access may validate strategic interest, but it does not establish
      monetization, cash collection, or revenue quality.
    claimRefs: [CI007, CI008, CI009, CI010]
    tableRefs: [TI001]
  - id: commercialization-motion
    title: Commercialization is staged behind research
    body: >-
      Reported milestones imply a research-first go-to-market motion rather than a scaled sales
      engine. AMI was expected to focus on R&D in its first year, expand hiring in the near
      term, and begin corporate-partner discussions within six to twelve months. Its stated horizon
      for broadly capable systems was three to five years. Those disclosures provide timing proxies,
      not CAC, payback, sales-cycle, pipeline, utilization, or channel-economics evidence. The likely
      sequence is capital-funded research followed by selected strategic deployments and only then
      repeatable commercial packaging. Diligence should test whether Nabla is a paid arm's-length
      customer, a development partner, or a related-party route to market before assigning revenue
      value to the relationship.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capitalization-and-runway
    title: Financing scale does not establish runway
    body: >-
      Independent coverage consistently reports a $1.03 billion seed round and an approximately
      $3.5 billion pre-money valuation. That financing is a major capacity signal, but it is not a
      disclosed balance-sheet cash figure. The retained evidence provides no closing schedule,
      tranches, cash-on-hand date, monthly burn, compute commitments, debt facilities, working
      capital, capex, or planned use-of-funds bridge. Consequently, runway cannot be calculated from
      public data. Near-term hiring and a multi-year research objective imply material forward
      spending, yet the magnitude and timing remain private. The correct diligence anchor is a
      monthly cash bridge from closing proceeds to unrestricted cash, contracted obligations, and
      milestone-triggered financing needs.
    claimRefs: [CI001, CI002, CI004, CI011, CI015, CI016]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: unit-economics-verdict
    title: Unit economics are unproven and compute-sensitive
    body: >-
      No company-specific evidence supports gross margin, contribution margin, deployment cost,
      inference cost, customer acquisition cost, payback, retention, or service intensity. Broader
      AI-infrastructure analysis estimates that GPUs represent only half of data-center total cost
      and argues that commoditized GPU capacity can pressure infrastructure pricing while rapidly
      depreciating older hardware. Those are context benchmarks, not AMI estimates; AMI may consume
      compute rather than resell it. The adverse capital-market backdrop also matters: Reuters
      reported investor warnings that early-stage AI valuations had become frothy and could outrun
      technical delivery. The financial verdict is therefore research-more: financing reduces
      immediate fundraising pressure, but revenue quality, margin path, capital intensity, and
      runway remain blocked by missing company records.
    claimRefs: [CI012, CI013, CI014, CI016]
