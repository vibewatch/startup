  - id: "TM001"
    title: "Market definition and boundary"
    columns: ["Segment or category", "Included spend", "Excluded spend", "Buyer or payer", "AMI relevance"]
    rows:
      - ["World-model software", "Predictive representations, planning, and action-consequence modeling", "General-purpose text generation and consumer chatbots", "Enterprise R&D and engineering leaders", "Core stated category"]
      - ["Industrial robotics and automation", "Intelligence software, integration, simulation, and control layers", "Robot hardware sold without AMI software", "Manufacturing engineering and operations", "Primary adjacent deployment market"]
      - ["Autonomous transportation", "Perception, prediction, planning, validation, and simulation software", "Vehicle manufacturing and unrelated mobility services", "Autonomy and vehicle engineering organizations", "Named prospective application"]
      - ["Safety-critical industrial simulation", "Models of engines, power plants, and complex operating systems", "Generic business intelligence and non-operational analytics", "Industrial R&D, reliability, and operations", "Named prospective application"]
      - ["AI-enabled medical devices", "Validated AI functions embedded in regulated devices", "Unregulated wellness software and general clinical administration", "Device manufacturers and regulated product teams", "Attractive but regulation-intensive adjacency"]
    notes: "Boundary is synthesized from retained company-related, industry, and regulatory evidence; no row represents disclosed AMI revenue."
    claimRefs: [CM001, CM002, CM003, CM010, CM011, CM012]
  - id: "TM002"
    title: "Evidence-constrained sizing lenses"
    columns: ["Lens", "Period / geography", "Observed value", "Methodology", "Confidence", "Limitation"]
    rows:
      - ["AI startup financing", "Q1 2025 / global", "$73.1B; 57.9% of venture funding", "PitchBook figures reported by Reuters", "Medium", "Capital raised is not market revenue or AMI-addressable spend"]
      - ["Industrial and service robotics data", "Visible page covers 1993-2019 / multi-country", "No current market value visible", "IFR categories by robot type, application, industry, and country", "Low for 2026 sizing", "Accessible text is historical and paid reports contain the deeper data"]
      - ["Physical-AI adoption", "2025 / industry examples", "No defensible market value", "Expert and deployment evidence reported by MIT Technology Review", "Medium", "Direction and constraints only; not a TAM estimate"]
      - ["AMI-specific TAM / SAM / SOM", "2026 / undisclosed", null, "Requires product, price, buyer, deployment, and geographic assumptions", "Unavailable", "No retained source supports a numeric company-specific estimate"]
    notes: "Values preserve source period and denominator; financing is shown only as capital-market context, and null means no supportable AMI-specific size."
    claimRefs: [CM004, CM005, CM006, CM007, CM012]
  - id: "TM003"
    title: "Segment and buyer map"
    columns: ["Segment", "Economic buyer", "Primary user", "Likely payer / budget", "Adoption trigger"]
    rows:
      - ["Robotics manufacturing", "VP Engineering or product leader", "Robotics and controls engineers", "Product R&D and engineering", "Safer task generalization with lower integration burden"]
      - ["Industrial automation", "Plant or operations executive", "Automation engineers and operators", "Operations, capex, or transformation budget", "Measured uptime, throughput, and safety improvement"]
      - ["Autonomous transportation", "Autonomy program executive", "Perception, planning, and validation teams", "Vehicle R&D and autonomy program", "Validated prediction and planning under edge cases"]
      - ["Aerospace, defense, and complex-system simulation", "Program or R&D leader", "Simulation and systems engineers", "Program R&D or mission systems", "Reliable modeling of consequential physical systems"]
      - ["AI-enabled medical devices", "Regulated product executive", "Clinical, data-science, and quality teams", "Device development and regulatory budget", "Validated clinical utility with an approvable change-control plan"]
    notes: "Buyer and budget roles are analytical mappings, not disclosed AMI contracts; validation requires named procurement owners and signed deployment evidence."
    claimRefs: [CM002, CM003, CM008, CM010, CM011, CM013, CM016]
