company:
  name: "Advanced Machine Intelligence"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    AMI is pursuing a broad physical-world intelligence opportunity spanning robotics,
    autonomous systems, industrial simulation, and regulated medical applications, but
    reviewed public evidence does not support a defensible company-specific TAM, SAM, or
    SOM. Adoption is more likely to proceed through narrow, industry-specific deployments
    constrained by safety, power, integration, regulation, and proof of commercial ROI.
sections:
  - id: "market-boundary"
    title: "Market boundary: world models for consequential physical systems"
    body: >-
      AMI's relevant market is narrower than all artificial intelligence and broader than
      humanoid robots. Its investor-authored description centers on world models that
      represent reality, predict how situations evolve, and connect actions to consequences.
      Independent reporting identifies prospective uses in autonomous driving, robotics,
      jet engines, power plants, and models of human organs. That evidence supports a market
      boundary around predictive and planning systems for physical or safety-critical
      workflows. It excludes general-purpose text generation, consumer chatbots, and
      conventional analytics that do not model action in a physical environment. It also
      separates software intelligence from robot hardware revenue: industrial robots,
      service robots, autonomous vehicles, and regulated medical devices are adjacent demand
      pools, not interchangeable spend categories. Status-quo substitutes include scripted
      automation, domain simulators, human operators, and task-specific control software.
    claimRefs: [CM001, CM002, CM003, CM011, CM012]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: "sizing-evidence"
    title: "Sizing: capital intensity is visible, addressable spend is not"
    body: >-
      The reviewed evidence does not expose a credible AMI-specific revenue pool, contract
      value, deployment count, or buyer budget from which to calculate TAM, SAM, or SOM.
      Reuters reported that AI startups raised $73.1 billion in the first quarter of 2025,
      representing 57.9% of global venture funding, but venture financing is not customer
      demand and cannot be used as market revenue. The accessible IFR page provides a useful
      segmentation convention for industrial and service robots, yet its visible underlying
      data covers 1993-2019 and therefore cannot anchor a 2026 opportunity estimate. The
      investable conclusion is evidence-constrained: AMI addresses several potentially large
      adjacencies, while reachable spend remains unquantified until product scope, pricing,
      procurement pathway, and deployment economics are disclosed. Frothy early-stage AI
      valuations further weaken any attempt to infer market size from capital raised.
    claimRefs: [CM004, CM005, CM006, CM012]
    tableRefs: [TM002]
  - id: "buyers-and-adoption-path"
    title: "Buyers, users, payers, and the path to budget"
    body: >-
      Public evidence points to robotics manufacturers, autonomous-vehicle developers,
      industrial automation firms, aerospace and defense organizations, and scientific
      simulation teams as plausible buyer groups. The operational user would vary by
      deployment: robotics engineers, autonomy teams, plant operators, researchers, or
      clinical-device teams. Budget ownership is not disclosed and likely sits with R&D,
      engineering, operations, or regulated product organizations rather than a horizontal
      software budget. AMI said it would focus on research and development during its first
      year and expected corporate-partner discussions within six to twelve months, indicating
      a partnership-led discovery phase rather than a mature repeatable sales motion. Named
      strategic backers may provide domain access, and Nabla is described by one secondary
      profile as an early deployment partner, but neither signal establishes an arm's-length
      customer, recurring revenue, willingness to pay, or scalable procurement.
    claimRefs: [CM003, CM013, CM015, CM016]
    tableRefs: [TM003]
  - id: "drivers-and-constraints"
    title: "Adoption drivers and constraints"
    body: >-
      Demand is driven by the gap between fluent generative systems and machines that must
      reason about consequences, retain context, and act safely over time. AMI's three-to-five
      year ambition for broadly capable systems creates option value across multiple
      industries, but the adoption clock should be tied to field reliability rather than the
      research roadmap. MIT Technology Review reports that humanoid deployment is likely to
      be slow and industry-specific, with power, battery weight, safety, manufacturing
      complexity, and absent workplace regulation all limiting scale. Success in one vertical
      may not transfer to another. Medical applications add a separate regulatory burden:
      FDA guidance expects planned modifications, validation and implementation methodology,
      impact assessment, and review through established device pathways. These constraints
      favor narrow pilots with measurable safety and ROI gates before broad platforms. They
      also make switching cost and trust endogenous to deployment evidence; neither can be
      assumed before AMI shows production performance, integration requirements, and buyer
      economics.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM014]
