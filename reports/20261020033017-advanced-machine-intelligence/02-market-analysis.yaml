callouts:
  - calloutType: "insight"
    title: "Large adjacency does not equal serviceable market"
    body: "AMI's possible use cases span several industries, but no retained evidence connects those adjacencies to a sellable product, price, deployment unit, or current buyer budget."
    claimRefs: [CM002, CM003, CM004]
  - calloutType: "risk"
    title: "Adoption timing is likely vertical-specific"
    body: "Physical constraints, safety regulation, integration complexity, and uneven transfer between industries make a single cross-sector adoption curve unreliable."
    claimRefs: [CM007, CM008, CM009, CM010]
