        - Long proof cycle, dilution, and valuation compression.
        - Most consistent with the currently disclosed timeline, but not statistically estimable.
      - - Bear
        - Commercialization slips, technical evidence remains internal, and early-stage AI valuation enthusiasm cools.
        - >-
          A down round, structured financing, or material dilution becomes plausible; magnitude cannot be quantified
          publicly.
        - Preference overhang, financing concentration, and an extended pre-revenue cost base.
        - Triggered by missed milestones or another financing before externally validated proof.
    notes: >-
      Scenarios are qualitative because the retained sources do not disclose cap-table, cash-flow, commercial, or
      preference inputs needed for numeric probabilities and returns.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV008
      - CV011
