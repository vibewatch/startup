      - number: '7.3'
        title: Operating, quality, security, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Compute is a monitorable operating exposure rather than a quantified AMI cost. CloudZero's October 2026
              market review put on-demand H100 rental rates at $2.89-$6.98 per GPU-hour with a $3.25 September median,
              reported a 22% one-month rental increase, and described one-year contract rates as roughly 38% above
              October 2025. These are market observations, not AMI invoices, so burn and runway remain unknown.
              Execution complexity also rises with hiring planned across Paris, New York, Montreal, and Singapore. The
              practical mitigation is staged capacity contracting tied to measured utilization, alongside reliability
              gates and security-control evidence before safety-critical pilots. Missing supplier commitments,
              utilization, burn, runway, penetration testing, and recovery metrics prevent a lower residual rating.
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
