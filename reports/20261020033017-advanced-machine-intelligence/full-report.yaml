chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating thesis
        blocks:
          - type: paragraph
            body: >-
              Advanced Machine Intelligence, or AMI, is a private Paris-based AI research company founded on December
              15, 2025. It reports operating locations in Paris, New York, Montreal, and Singapore. AMI describes its
              mission as building systems that understand the real world rather than relying only on language, using
              world models that learn abstract representations of noisy sensor data and predict in representation space.
              The stated application set spans industrial process control, automation, wearable devices, robotics, and
              healthcare. This is a research-led product thesis rather than a demonstrated commercial model: the
              assigned evidence describes intended capabilities and application domains but does not disclose a priced
              product, revenue, ARR, customer count, or current workforce total. The snapshot therefore separates
              verified identity and financing facts from unsupported operating metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
