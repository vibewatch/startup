  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from exceptional capital and a premium mark through delayed proof and hot-market risk to
      a research-more decision.
    data:
      nodes:
        - id: capital
          label: $1.03B seed capital
          detail: Exceptional funding capacity for a research-stage company.
        - id: price
          label: $3.5B pre-money
          detail: A large share of expected success is embedded at entry.
        - id: proof-window
          label: Research-first proof window
          detail: First-year R&D and partner discussions in six to twelve months.
        - id: market-heat
          label: Concentrated AI funding
          detail: AI represented 89% of first-quarter 2026 U.S. venture deal value.
        - id: downside
          label: Commercialization and multiple risk
          detail: >-
            A physical-AI peer reports no commercialization timeline; institutional investors warn of frothy early-stage
            marks.
        - id: risk-gate
          label: Measured risk controls
          detail: Technical and safety claims require a documented framework and independent validation.
        - id: decision
          label: Research more
          detail: Verify terms, operating evidence, and milestones before pricing an entry.
      edges:
        - source: capital
          target: price
        - source: price
          target: proof-window
        - source: proof-window
          target: market-heat
        - source: market-heat
          target: downside
        - source: downside
          target: risk-gate
        - source: risk-gate
          target: decision
    approximationNotes: This is a qualitative decision chain, not a probability-weighted valuation model.
