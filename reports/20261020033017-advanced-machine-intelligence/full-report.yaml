      - number: '1.3'
        title: Capitalization and proof burden
        blocks:
          - type: paragraph
            body: >-
              AMI reportedly raised $1.03 billion in seed financing at a $3.5 billion pre-money valuation, led by Bezos
              Expeditions, Cathay Innovation, Greycroft, Hiro Capital, and HV Capital, with strategic participation that
