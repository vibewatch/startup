      - number: '6.3'
        title: Adoption evidence belongs to Nabla, not yet to AMI
        blocks:
          - type: paragraph
            body: >-
              Nabla brings an attractive downstream testing surface: a secondary industry report says its assistant is
              used by more than 85,000 clinicians across more than 130 U.S. healthcare organizations and names CVS
              Health, Children's Hospital Los Angeles, and University of Iowa Health Care. The same source reports
              fivefold Nabla revenue growth over six months. These are Nabla metrics, with Nabla denominators and
              periods; they must not be relabeled as AMI customer, usage, or revenue metrics. For AMI itself, the
              assigned sources disclose no active-account count, paid pilot count, utilization, ARR, NRR, GRR, churn,
              renewal, contract length, or satisfaction measure. Without those measures, durability and expansion cannot
              be assessed, and the existence of a large partner footprint establishes access to a potential evaluation
              environment rather than product-market fit.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
