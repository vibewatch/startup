  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: world models for consequential physical systems'
        blocks:
          - type: paragraph
            body: >-
              AMI's relevant market is narrower than all artificial intelligence and broader than humanoid robots. Its
              investor-authored description centers on world models that represent reality, predict how situations
              evolve, and connect actions to consequences. Independent reporting identifies prospective uses in
              autonomous driving, robotics, jet engines, power plants, and models of human organs. That evidence
              supports a market boundary around predictive and planning systems for physical or safety-critical
              workflows. It excludes general-purpose text generation, consumer chatbots, and conventional analytics that
              do not model action in a physical environment. It also separates software intelligence from robot hardware
              revenue: industrial robots, service robots, autonomous vehicles, and regulated medical devices are
              adjacent demand pools, not interchangeable spend categories. Status-quo substitutes include scripted
              automation, domain simulators, human operators, and task-specific control software.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
