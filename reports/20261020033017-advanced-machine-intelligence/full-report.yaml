  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and recommendation
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, not invest-now. AMI has exceptional financing capacity for a
              seed-stage company: independent reports place the round at $1.03 billion and the pre-money valuation at
              about $3.5 billion. That scale can fund a serious research program, but it also moves much of the expected
              technical and commercial success into today's entry price. The retained evidence describes a first year
              centered on research and development, with corporate-partner discussions expected within six to twelve
              months, rather than verified revenue, retention, margin, or customer economics. Confidence is medium
              because the financing facts are consistent across the assigned sources, while the underwriting inputs that
              determine effective price and return remain private. Risk is high and the valuation stance is expensive
              until milestones and terms can be verified.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
