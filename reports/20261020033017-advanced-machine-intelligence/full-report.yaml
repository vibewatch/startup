      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes reliability, controllability, and safety as product goals rather than verified
              operating controls. Nabla is identified as AMI's first partner and a prospective clinical proving ground,
              which raises privacy, medical-device, model-governance, and professional-liability questions before any
              production use can be underwritten. Separately, LeCun described AMI's work as a direct continuation of
              Meta's JEPA research. That lineage is a technical asset, but the assigned sources do not resolve
              ownership, licensing, employee invention assignments, open-source commitments, or boundaries with Meta and
              academic affiliations. No absence-of-incident conclusion is warranted: the source pool simply does not
              contain a regulator record, litigation docket, certification artifact, or incident register.
            claimRefs:
              - CR003
              - CR005
              - CR008
