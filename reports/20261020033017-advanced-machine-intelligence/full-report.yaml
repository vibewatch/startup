  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set extends beyond other world-model startups
        blocks:
          - type: paragraph
            body: >-
              AMI is not competing in a single, clean product category. Its stated objective is to build world models
              that predict how situations evolve and how actions produce consequences, with applications spanning
              robotics, industrial systems, healthcare, and other sensor-rich environments. That places direct research
              labs such as World Labs beside robotics-focused Physical Intelligence, incumbent platforms such as Google
              DeepMind's Gemini Robotics, and vertical applications such as Nabla. It also leaves internal research
              teams and conventional automation as status-quo substitutes whenever a buyer can solve a bounded workflow
              without waiting for a general world model. Seedtable's thin profile confirms that AMI is active and
              positioned as an AI research-and-development platform, but it adds no product-scale evidence. The
              practical landscape is therefore a contest among generality, deployment maturity, distribution, and trust
              rather than a list of companies using the same terminology.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
              - CP011
              - CP013
              - CP014
