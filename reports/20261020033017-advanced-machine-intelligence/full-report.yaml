      - number: '5.3'
        title: Deployment, reliability, and trust controls
        blocks:
          - type: paragraph
            body: >-
              External evidence argues for narrow, controlled deployment before claims of general physical intelligence.
              Bain reports that humanoid systems remain mostly in pilots and depend heavily on human input, with
              structured industrial settings likely to precede open environments; it also identifies battery endurance
              as a persistent operational constraint. AMI may initially sell software rather than robots, but the same
              diligence logic applies: a world model must be tested against a defined task, sensor stack, failure
              envelope, fallback process, and measurable uptime. A Nabla-issued release syndicated through TMCnet says
              the separate healthcare company completed an Oracle Cerner integration in under 60 days. That is evidence
              of CEO Alexandre Lebrun's adjacent operating experience, not evidence that AMI has an integration layer or
              customer deployment. Public AMI evidence states goals of controllability, safety, and guardrails but does
              not disclose privacy architecture, cybersecurity controls, quality management, incident response, red-team
              results, regulatory approvals, or certifications. Before underwriting deployment readiness, diligence
              should require an AMI-specific product demo, architecture and threat-model review, benchmark pack,
              incident history, release process, and referenceable pilot.
            claimRefs:
              - CE010
              - CE011
              - CE014
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product evidence has not caught up with the technical ambition
            body: >-
              Treat the roadmap as a testable research thesis, not a shipped platform. A financing or partnership
              announcement does not substitute for an AMI-specific SKU, benchmark, deployment, reliability record, or
              safety-control review.
            calloutType: risk
            claimRefs:
              - CE008
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Disclosed customer proof is limited to one early partner
        blocks:
          - type: paragraph
            body: >-
              Nabla is the only named AMI partner in the assigned evidence. TechCrunch, EU-Startups, and Crunchbase News
              each identify the healthcare AI company as AMI's first partner, while STAT reports that Nabla expects
              early access to AMI technology. The relationship is substantive enough to create a plausible first
              validation environment, but it is not yet documented as a production customer deployment: STAT reported no
              formal equity or licensing agreement between the companies at publication, even though Nabla's COO said
              they were already working closely. This distinction matters because a partner relationship, early-model
              access, and shared leadership do not establish a paid contract, production use, renewal, or measurable
              customer outcome. The reviewed set therefore supports one named partner, not a customer roster.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU016
