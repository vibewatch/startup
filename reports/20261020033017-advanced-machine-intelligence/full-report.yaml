      - number: '1.2'
        title: Leadership and execution dependence
        blocks:
          - type: paragraph
            body: >-
              Public reporting identifies Yann LeCun as non-executive chairman, Alexandre LeBrun as chief executive, and
              Laurent Solly as chief operating officer. That configuration combines globally recognized AI research
              leadership with company-building and operating experience, but it also concentrates execution and external
              credibility in a small founding group. The near-term plan reported in March 2026 was to add 20 to 30
              people, which is a hiring intention rather than evidence of current headcount. Governance diligence is
              especially important because LeBrun was also reported to remain chairman and chief AI scientist at Nabla
              while serving as AMI's CEO, and Nabla is AMI's first partner. Investors should verify time allocation,
              related-party approval, IP ownership, data rights, and commercial terms rather than infer safeguards from
              the founders' reputations.
