      - number: '6.4'
        title: Expansion depends on converting research access into arm's-length deployments
        blocks:
          - type: paragraph
            body: >-
              Management's own sequencing is long dated. TechCrunch reports that AMI has no plans to generate revenue
              for the time being, although it intends to engage prospective customers early so models can encounter real
              data and evaluations. AFP reporting says corporate-partner discussions could begin within six to 12
              months, while broadly useful systems are a three-to-five- year objective. That sequence makes early design
              partnerships plausible but leaves procurement, integration, regulatory acceptance, pricing, and renewal
              untested. Nabla also concentrates the disclosed customer story in a company whose chairman is AMI's CEO,
              creating a related-party diligence question without proving any undisclosed transaction. Expansion
              evidence should require signed arm's-length agreements, AMI-specific deployment outcomes, cohort
              retention, and customer concentration data before the partnership narrative is treated as a repeatable
              commercial motion.
