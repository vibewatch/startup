      - number: '2.3'
        title: Buyers, users, payers, and the path to budget
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to robotics manufacturers, autonomous-vehicle developers, industrial automation
              firms, aerospace and defense organizations, and scientific simulation teams as plausible buyer groups. The
              operational user would vary by deployment: robotics engineers, autonomy teams, plant operators,
              researchers, or clinical-device teams. Budget ownership is not disclosed and likely sits with R&D,
              engineering, operations, or regulated product organizations rather than a horizontal software budget. AMI
              said it would focus on research and development during its first year and expected corporate-partner
              discussions within six to twelve months, indicating a partnership-led discovery phase rather than a mature
              repeatable sales motion. Named strategic backers may provide domain access, and Nabla is described by one
              secondary profile as an early deployment partner, but neither signal establishes an arm's-length customer,
              recurring revenue, willingness to pay, or scalable procurement.
            claimRefs:
