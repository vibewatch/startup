  - id: FM001
    title: Constrained market-sizing perimeter
    type: pyramid
    summary: >-
      Conceptual layers narrow from broad AI capital activity to AMI-reachable deployments without assigning unsupported
      monetary values.
    data:
      items:
        - label: Global AI ecosystem
          value: Not TAM
          detail: Venture financing demonstrates capital intensity, not customer spend.
        - label: Physical-world intelligence
          value: Unquantified
          detail: World models, prediction, planning, and action under real-world constraints.
        - label: Robotics and autonomous systems
          value: Unquantified
          detail: Industrial robots, autonomous transport, and related control workflows.
        - label: Industrial and scientific simulation
          value: Unquantified
          detail: Engines, power plants, and other consequential complex systems.
        - label: Regulated medical-device AI
          value: Unquantified
          detail: Device functions subject to validation and marketing-submission pathways.
        - label: AMI serviceable and obtainable market
          value: Unknown
          detail: Requires product packaging, pricing, geography, contracts, and deployment economics.
    approximationNotes: Layer order represents narrowing applicability, not proportional value; no numeric TAM, SAM, or SOM is inferred.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM010
      - CM011
      - CM013
  - id: FP001
    title: 'Evidence-backed competitive positioning: deployment proof versus breadth'
    type: quadrant
    summary: >-
      Ordinal scores show how the retained evidence positions six alternatives on public deployment proof and breadth of
      stated physical-world ambition; they are not performance benchmarks or market-share estimates.
    data:
      points:
        - label: AMI
          x: 2
          'y': 5
          note: Broad world-model ambition; limited disclosed deployment proof.
        - label: Physical Intelligence
          x: 3
          'y': 5
          note: Broad robotics ambition and substantial capital; no commercialization timeline reported.
        - label: Gemini Robotics
          x: 4
          'y': 5
          note: Published robotics capabilities across tasks and embodiments.
        - label: World Labs
          x: 2
          'y': 4
          note: Broad real-world foundation-model positioning; limited product detail in retained evidence.
        - label: Nabla
          x: 5
          'y': 2
          note: Narrower application scope with reported production-workflow rollout.
        - label: Internal build / automation
          x: 3
          'y': 1
          note: Narrow workflow scope; deployment proof varies by buyer and is not quantified here.
    approximationNotes: >-
      Both axes use analyst-assigned 1-5 ordinal scores based only on the retained evidence: x is public deployment
      proof (low to high), and y is breadth of stated physical-world scope (narrow to broad). Scores are directional,
      not measured performance.
    claimRefs:
      - CP014
      - CP016
  - id: FI001
    title: Publicly evidenced capital-to-commercialization bridge
    type: flow
    summary: >-
      The disclosed sequence reaches planned commercialization milestones, but public evidence does not connect
      financing to revenue or runway.
    data:
      nodes:
        - id: financing
          label: $1.03B financing reported
          detail: Capital raised; unrestricted cash and closing mechanics are not disclosed.
        - id: research
          label: First-year R&D focus
          detail: Public reporting places foundational research before commercial scale.
        - id: hiring
          label: Near-term hiring plan
          detail: A directional cost signal without a payroll or burn bridge.
        - id: partner-talks
          label: Partner talks in 6-12 months
          detail: A timing proxy, not a contracted pipeline.
        - id: system-horizon
          label: 3-5 year system horizon
          detail: A long development objective with undisclosed milestone spend.
        - id: underwriting-gap
          label: Revenue and runway unresolved
          detail: No public pricing, ARR, gross margin, burn, cash, or obligations.
    approximationNotes: Sequence reflects reported milestone timing; it is not a cumulative cash waterfall or a forecast.
    claimRefs:
      - CI016
  - id: FE001
    title: Publicly described world-model operating concept
    type: stack
    summary: An evidence-bounded concept map separating disclosed mechanism from undisclosed implementation and controls.
    data:
      layers:
        - label: Multimodal observations
          detail: Video, audio, lidar, robot-state, and other sensor streams are the stated input class.
          modules:
            - Video
            - Audio
            - Lidar
            - Robot state
            - Other sensors
          outputs:
            - Time-aligned real-world observations; AMI data pipeline is not disclosed
        - label: Representation learning
          detail: JEPA-style learning is described as encoding abstract, predictable structure.
          modules:
            - Abstract representation
            - Self-supervised learning
          outputs:
            - Latent world state; AMI model design and scale are not disclosed
        - label: Predictive world model
          detail: Predictions are intended to occur in representation space rather than reproduce every raw detail.
          modules:
            - State prediction
            - Action conditioning
          outputs:
            - Predicted consequences; calibration evidence is unavailable
        - label: Planning and control
          detail: Management says action-conditioned models can plan sequences subject to safety guardrails.
          modules:
            - Action sequence planning
            - Constraint application
          outputs:
            - Candidate actions; implementation and fallback behavior are unavailable
        - label: Application interface
          detail: Industrial, robotic, wearable, mobility, and healthcare settings are named as targets.
          modules:
            - Industrial systems
            - Robotics
            - Wearables
            - Mobility
            - Healthcare
          outputs:
            - Domain applications; no released AMI SKU or API is evidenced
        - label: Lifecycle assurance
          detail: Deployment needs evaluation, monitoring, security, privacy, support, and quality controls.
          modules:
            - Evaluation
            - Monitoring
            - Security
            - Privacy
            - Support
            - Quality
          outputs:
            - Production assurance; no AMI-specific control evidence is public
    approximationNotes: >-
      Conceptual synthesis of public descriptions; layer order is analytical and does not represent a disclosed AMI
      implementation.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE009
      - CE016
