              - CM011
              - CM013
              - CM016
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by the gap between fluent generative systems and machines that must reason about
              consequences, retain context, and act safely over time. AMI's three-to-five year ambition for broadly
              capable systems creates option value across multiple industries, but the adoption clock should be tied to
              field reliability rather than the research roadmap. MIT Technology Review reports that humanoid deployment
              is likely to be slow and industry-specific, with power, battery weight, safety, manufacturing complexity,
              and absent workplace regulation all limiting scale. Success in one vertical may not transfer to another.
              Medical applications add a separate regulatory burden: FDA guidance expects planned modifications,
              validation and implementation methodology, impact assessment, and review through established device
              pathways. These constraints favor narrow pilots with measurable safety and ROI gates before broad
              platforms. They also make switching cost and trust endogenous to deployment evidence; neither can be
              assumed before AMI shows production performance, integration requirements, and buyer economics.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large adjacency does not equal serviceable market
            body: >-
              AMI's possible use cases span several industries, but no retained evidence connects those adjacencies to a
              sellable product, price, deployment unit, or current buyer budget.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM004
          - type: callout
            title: Adoption timing is likely vertical-specific
            body: >-
              Physical constraints, safety regulation, integration complexity, and uneven transfer between industries
              make a single cross-sector adoption curve unreliable.
            calloutType: risk
            claimRefs:
