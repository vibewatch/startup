      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence condition
            body: >-
              Do not underwrite safety-critical deployment until AMI supplies a product milestone map, independent
              reliability results, a data-rights architecture, incident-response evidence, and signed partner scopes
              with production acceptance criteria.
