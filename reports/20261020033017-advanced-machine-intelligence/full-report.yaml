              - CM013
      - number: '2.2'
        title: 'Sizing: capital intensity is visible, addressable spend is not'
        blocks:
          - type: paragraph
            body: >-
              The reviewed evidence does not expose a credible AMI-specific revenue pool, contract value, deployment
              count, or buyer budget from which to calculate TAM, SAM, or SOM. Reuters reported that AI startups raised
              $73.1 billion in the first quarter of 2025, representing 57.9% of global venture funding, but venture
              financing is not customer demand and cannot be used as market revenue. The accessible IFR page provides a
              useful segmentation convention for industrial and service robots, yet its visible underlying data covers
              1993-2019 and therefore cannot anchor a 2026 opportunity estimate. The investable conclusion is
              evidence-constrained: AMI addresses several potentially large adjacencies, while reachable spend remains
              unquantified until product scope, pricing, procurement pathway, and deployment economics are disclosed.
              Frothy early-stage AI valuations further weaken any attempt to infer market size from capital raised.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
