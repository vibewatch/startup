  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is research-to-product execution. AMI raised $1.03 billion at a reported
              $3.5 billion pre-money valuation, yet management said the first year would emphasize research and
              development, corporate-partner discussions could begin within six to twelve months, and fairly universal
              systems could take three to five years. That mismatch does not prove failure, but it makes schedule
              evidence, reproducible safety benchmarks, and partner conversion the decisive monitoring variables. The
              second tier combines compute procurement volatility, a four-office operating footprint, rapid hiring, and
              leadership dependencies. Legal and regulatory exposure is potentially severe because factories and
              hospitals are contemplated applications, while the assigned evidence does not establish approvals,
              certifications, privacy controls, insurance, or incident-response maturity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
