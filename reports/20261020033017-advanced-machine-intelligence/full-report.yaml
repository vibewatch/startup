      - number: '6.2'
        title: Initial segments are hypotheses around real-world operating data
        blocks:
          - type: paragraph
            body: >-
              AMI publicly describes target applications spanning healthcare, industrial process control, automation,
              wearables, robotics, and other systems that operate on continuous sensor data. Those fields imply
              different buying centers: clinical product leaders and health systems in healthcare, engineering or
              operations teams in industry, and robotics or autonomy teams for machines in open environments. Only the
              healthcare path has a named AMI partner. The other segments are application directions, not verified
              customer categories. A competitor-issued Covariant release shows what mature physical-AI proof can look
              like - customers across 15 countries and four continents and hundreds of deployed robots - but it cannot
              be attributed to AMI. AMI's segment map should therefore be read as a prioritized diligence framework
              rather than evidence of diversified demand.
            claimRefs:
              - CU008
              - CU014
              - CU015
          - type: table
