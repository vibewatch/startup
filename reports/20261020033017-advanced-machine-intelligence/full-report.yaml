      - number: '7.4'
        title: Partner dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Nabla is the only named operating partner in the retained evidence, so it is both a useful validation
              venue and a concentration signal until additional counterparties are documented. Leadership overlap
              compounds that exposure: Alexandre LeBrun moved from Nabla CEO to AMI CEO while remaining Nabla's chairman
              and chief AI scientist. Financing capacity is substantial, but Reuters-reported investor warnings that
              early-stage AI valuations were becoming frothy sharpen the downside if technical milestones do not convert
              into independent deployments. Monitorable triggers are therefore: no documented partner discussions after
              the stated six-to-twelve-month window; no audited safety or reliability benchmark before regulated pilots;
              compute commitments without utilization reporting; material schedule slippage against the
              three-to-five-year ambition; or unresolved IP, data-rights, and governance boundaries. Any two persisting
              through the next financing decision should pause new capital.
            claimRefs:
