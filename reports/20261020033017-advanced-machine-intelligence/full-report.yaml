        title: Commercialization is staged behind research
        blocks:
          - type: paragraph
            body: >-
              Reported milestones imply a research-first go-to-market motion rather than a scaled sales engine. AMI was
              expected to focus on R&D in its first year, expand hiring in the near term, and begin corporate-partner
