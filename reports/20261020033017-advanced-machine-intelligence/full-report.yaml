          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The closest public signals describe a market willing to finance frontier physical-AI research before
              commercialization. Physical Intelligence was reportedly discussing a roughly $1 billion raise above an $11
              billion valuation while acknowledging no commercialization timeline and an appetite for additional
              compute. That is useful as a market-temperature indicator, not as a direct operating comparable: the
              source does not normalize technology scope, ownership, revenue, burn, or round terms. Broader venture
              evidence is similarly hot and concentrated. SiliconANGLE's account of PitchBook data says first-quarter
              2026 U.S. venture deal value reached $267.2 billion, with five deals representing 73% and AI accounting
              for 89%. These figures support caution about mark-setting conditions, not a precise AMI multiple.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario framework must remain milestone-based because the assigned evidence does not
              establish revenue, cash burn, ownership, dilution, liquidation preferences, or an exit multiple. In the
              bull case, AMI converts its unusually large capital base into externally validated technical milestones
              and substantive partner commitments on or ahead of the disclosed six-to-twelve-month discussion window.
              The base case follows the stated research-first plan but leaves valuation unsupported by commercial proof,
              preserving a research-more stance. The bear case combines delayed commercialization with a correction in
              early-stage AI valuations, increasing down-round or dilution risk. No numeric probabilities, return
              targets, or valuation ranges are supportable from the retained public evidence; investment committee
              modeling should wait for the missing terms and operating data.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Entry discipline, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Entry discipline should require the capitalization table, fully diluted ownership, option-pool treatment,
              security type, liquidation preference, participation rights, tranches, side letters, pro-rata rights, and
              any debt or compute commitments. Commercial diligence should obtain signed partner agreements, revenue and
              pipeline by stage, customer concentration, retention, gross margin, monthly burn, runway, and
              milestone-linked compute budgets. Technical diligence should define measurable reliability and safety
              thresholds, using a documented risk process such as the voluntary NIST AI Risk Management Framework rather
              than treating broad safety language as validation. Thesis-break triggers are a missed partner window,
              repeated milestone slippage, financing terms that materially subordinate new investors, or failure to
              produce independently testable performance and safety evidence before the next capital event.
            claimRefs:
              - CV005
              - CV008
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Exceptional capitalization is not a substitute for disclosed terms and commercial proof; the investment
              case remains research-more until both are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV015
              - CV016
