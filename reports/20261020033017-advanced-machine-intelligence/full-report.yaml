  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product thesis, scope, and maturity
        blocks:
          - type: paragraph
            body: >-
              AMI describes its intended product as a new class of AI system that understands the physical world,
              maintains persistent memory, reasons and plans, and remains controllable and safe. MIT Technology Review
              provides the clearest independent account of the intended distinction: AMI is pursuing world models for
              the physical world rather than treating language models as the whole intelligence stack. The disclosed
              application surface is broad—industrial processes, robotics, autonomous driving, wearables, and
              healthcare—but it is a portfolio of target workflows, not a set of purchasable modules. AFP reporting
              carried by France 24 and RFI says management expected the first year to focus on R&D, with
              corporate-partner discussions on a six-to-twelve-month horizon and more universal systems targeted in
              three to five years. Those timeframes are management plans, not delivery evidence. The retained public
              sources do not identify an AMI SKU, API, release, benchmark, production deployment, or customer
              integration. The underwriting conclusion is therefore research-stage maturity: the technical thesis is
              specific enough to test, but product-market and engineering execution remain largely private.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE015
      - number: '5.2'
        title: Operating concept, data requirements, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The public operating concept begins with video, audio, robot-state, lidar, and other sensor streams, then
              uses JEPA-style learning to form abstract representations and predict in that representation space while
              ignoring details that cannot be predicted. AMI has further said that action-conditioned world models
              should let an agent forecast consequences and plan action sequences subject to safety guardrails. This is
              a coherent mechanism claim, not a disclosed production architecture: the company has not published model
              sizes, training corpus rights, evaluation protocols, latency, compute requirements, interfaces, or system
              boundaries. IEEE Spectrum's account of Covariant illustrates the practical moat AMI would still need to
              build. Covariant linked its robotics model to tens of millions of trajectories gathered from a deployed
              warehouse fleet, while acknowledging that the model could not generalize to wholly new objects or
              situations without suitable data. That comparison is not an AMI benchmark; it shows why proprietary
              real-world data, deployment feedback, and domain-bounded evaluations may matter as much as the
              architecture. AMI's public materials do not yet establish any comparable data flywheel or measured
              generalization advantage.
            claimRefs:
