artifact: risks
slug: advanced-machine-intelligence
runDate: 2026-10-20
company:
  name: Advanced Machine Intelligence
chapter:
  number: 7
  title: Risks
  summary: >-
    AMI's principal risk is execution against an unusually well-funded and highly valued research
    mandate: public reporting places commercial discussions six to twelve months after launch and
    broadly capable systems three to five years out. The available evidence identifies concrete
    compute, organizational, partner, and valuation exposures, but leaves legal controls, incident
    history, contractual concentration, burn, and safety validation as material diligence gaps.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest residual exposure is research-to-product execution. AMI raised $1.03 billion at a
      reported $3.5 billion pre-money valuation, yet management said the first year would emphasize
      research and development, corporate-partner discussions could begin within six to twelve
      months, and fairly universal systems could take three to five years. That mismatch does not
      prove failure, but it makes schedule evidence, reproducible safety benchmarks, and partner
      conversion the decisive monitoring variables. The second tier combines compute procurement
      volatility, a four-office operating footprint, rapid hiring, and leadership dependencies.
      Legal and regulatory exposure is potentially severe because factories and hospitals are
      contemplated applications, while the assigned evidence does not establish approvals,
      certifications, privacy controls, insurance, or incident-response maturity.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR011, CR012, CR013, CR014]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and safety exposure
    body: >-
      Public reporting describes reliability, controllability, and safety as product goals rather
      than verified operating controls. Nabla is identified as AMI's first partner and a prospective
      clinical proving ground, which raises privacy, medical-device, model-governance, and
      professional-liability questions before any production use can be underwritten. Separately,
      LeCun described AMI's work as a direct continuation of Meta's JEPA research. That lineage is a
      technical asset, but the assigned sources do not resolve ownership, licensing, employee
      invention assignments, open-source commitments, or boundaries with Meta and academic
      affiliations. No absence-of-incident conclusion is warranted: the source pool simply does not
      contain a regulator record, litigation docket, certification artifact, or incident register.
    claimRefs: [CR003, CR005, CR008, CR009, CR010]
    tableRefs: [TR001]
  - id: operating-financial
    title: Operating, quality, security, and financial-model risk
    body: >-
      Compute is a monitorable operating exposure rather than a quantified AMI cost. CloudZero's
      October 2026 market review put on-demand H100 rental rates at $2.89-$6.98 per GPU-hour with a
      $3.25 September median, reported a 22% one-month rental increase, and described one-year
      contract rates as roughly 38% above October 2025. These are market observations, not AMI
      invoices, so burn and runway remain unknown. Execution complexity also rises with hiring
      planned across Paris, New York, Montreal, and Singapore. The practical mitigation is staged
      capacity contracting tied to measured utilization, alongside reliability gates and
      security-control evidence before safety-critical pilots. Missing supplier commitments,
      utilization, burn, runway, penetration testing, and recovery metrics prevent a lower residual
      rating.
    claimRefs: [CR006, CR007, CR011, CR012, CR013, CR014]
    tableRefs: [TR002]
  - id: dependencies-and-triggers
    title: Partner dependencies, mitigations, and thesis-break triggers
    body: >-
      Nabla is the only named operating partner in the retained evidence, so it is both a useful
      validation venue and a concentration signal until additional counterparties are documented.
      Leadership overlap compounds that exposure: Alexandre LeBrun moved from Nabla CEO to AMI CEO
      while remaining Nabla's chairman and chief AI scientist. Financing capacity is substantial,
      but Reuters-reported investor warnings that early-stage AI valuations were becoming frothy
      sharpen the downside if technical milestones do not convert into independent deployments.
      Monitorable triggers are therefore: no documented partner discussions after the stated
      six-to-twelve-month window; no audited safety or reliability benchmark before regulated pilots;
      compute commitments without utilization reporting; material schedule slippage against the
      three-to-five-year ambition; or unresolved IP, data-rights, and governance boundaries. Any two
      persisting through the next financing decision should pause new capital.
    claimRefs: [CR001, CR004, CR005, CR008, CR009, CR015]
    tableRefs: [TR003]
