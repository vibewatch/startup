        - High
        - High
        - Unverified
        - High
        - H100 rents rose 22% in one month and one-year rates were roughly 38% above October 2025
        - No AMI capacity contracts, utilization, workload mix, or effective cost per run
      - - Distributed hiring outruns management systems
        - Medium
        - High
        - Early
