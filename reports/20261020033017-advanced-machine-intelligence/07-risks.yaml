  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Initial application and validation partner
        - Nabla
        - First named partner and healthcare test environment
        - Only named operating partner in retained evidence
        - Clinical work slips, produces weak validation, or creates data and liability constraints
        - Critical
        - Add independent design partners and contractually separate research access from production acceptance
        - High
      - - Executive bandwidth and related-party governance
        - Alexandre LeBrun / Nabla
        - AMI CEO while retaining Nabla chairman and chief AI scientist roles
        - Role overlap across the first partner and AMI
        - Conflicts, prioritization disputes, or unclear IP and data allocation delay decisions
        - High
        - Board-approved conflict policy, recusal rules, time allocation, and intercompany agreement
        - High
      - - Accelerated-compute capacity
        - GPU suppliers and cloud providers not publicly identified
        - Training and inference infrastructure
        - Supplier and contract mix undisclosed amid volatile H100 pricing
        - Capacity scarcity or unfavorable commitments increase burn and delay experiments
        - High
        - Multi-provider capacity, utilization telemetry, workload portability, and staged commitments
        - High
      - - Financing milestone discipline
        - Broad seed investor syndicate
        - Funds a multi-year research program
        - $1.03 billion round at a reported $3.5 billion pre-money valuation
        - Valuation expectations outrun technical and commercial proof, constraining the next round
        - High
        - Milestone-based budgets, independent benchmark reviews, and financing downside scenarios
        - Medium-high
    notes: >-
      Concentration is inferred from named public relationships, not from contracts or spend data;
      supplier, partner, and investor rights require confirmation in private diligence.
    claimRefs: [CR001, CR004, CR005, CR008, CR009, CR011, CR012, CR013, CR014, CR015]
figures:
  - id: FR001
    title: Evidence-qualified residual risk heatmap
    type: matrix
    summary: >-
      Residual ratings remain high where ambitious timing or exposed market inputs coincide with
      missing company-specific controls.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Evidence-based directional assessment, not a modeled probability
        - id: impact
          label: Impact
          detail: Potential effect on the investment thesis
        - id: residual
          label: Residual severity
          detail: Exposure after publicly evidenced mitigations
      rows:
        - id: research-conversion
          label: Research-to-product conversion
          note: First-year R&D focus and a three-to-five-year systems ambition
          values: [Medium, Critical, High]
        - id: regulated-deployment
          label: Regulated deployment controls
          note: Hospitals and other safety-critical settings are contemplated; controls are not evidenced
          values: [Medium, Critical, High]
        - id: compute-economics
          label: Compute economics
          note: Current H100 rental pricing is volatile and AMI utilization is undisclosed
          values: [High, High, High]
        - id: partner-concentration
          label: Partner concentration
          note: Nabla is the only named operating partner in retained evidence
          values: [Medium, High, High]
        - id: leadership-governance
          label: Leadership and related-party governance
          note: AMI and Nabla roles overlap around the first partnership
          values: [Medium, High, High]
        - id: valuation-expectations
          label: Valuation and milestone expectations
          note: Record-scale seed financing precedes public commercial proof
          values: [Medium, High, Medium-high]
    approximationNotes: >-
      Categorical ratings are analytical judgments, not statistical estimates; the matrix preserves
      unknown company controls as residual exposure rather than treating missing incidents as zero.
    claimRefs: [CR001, CR003, CR004, CR005, CR008, CR009, CR011, CR012, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Highest-priority diligence condition
    body: >-
      Do not underwrite safety-critical deployment until AMI supplies a product milestone map,
      independent reliability results, a data-rights architecture, incident-response evidence, and
      signed partner scopes with production acceptance criteria.
    claimRefs: [CR003, CR004, CR005, CR008]
  - calloutType: recommendation
    title: Capital-release trigger
    body: >-
      Tie incremental capital to verified partner conversion, benchmark progress, compute utilization,
      and closure of IP and regulated-domain controls rather than to the size of the seed syndicate.
    claimRefs: [CR001, CR004, CR010, CR011, CR012, CR013, CR014, CR015]
