        - Planned near-term hiring of 20-30 people across four operating locations
        - No org design, hiring plan by function, security onboarding, or key-person succession plan
      - - Reliability, security, or recovery failure in a safety-critical pilot
        - Medium
        - Critical
        - Unverified
