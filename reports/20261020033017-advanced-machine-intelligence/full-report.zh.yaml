chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营论题
        blocks:
          - type: paragraph
            body: >-
              Advanced Machine Intelligence（AMI）是一家总部位于巴黎的私营 AI 研究公司，于 2025 年 12 月 15 日成立。公司报告的运营地点包括巴黎、纽约、蒙特利尔和新加坡。AMI
              表示，其使命是构建真正理解现实世界的系统，而不是只依赖语言；公司使用世界模型，从嘈杂传感器数据中学习抽象表征，并在表征空间中进行预测。其声称的应用范围涵盖工业过程控制、自动化、可穿戴设备、机器人和医疗。这是一项研究驱动的产品论题，而非已经证明的商业模式：现有证据描述了预期能力和应用领域，但没有披露定价产品、收入、ARR、客户数或当前员工总数。因此，本快照将已验证的身份和融资事实，与未经支持的经营指标分开。
