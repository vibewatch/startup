  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点与建议
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是立即投资。AMI 作为一家种子阶段公司，融资能力非同寻常：独立报道将融资额定为 10.3 亿美元，投前估值约为 35
              亿美元。这一规模足以支持严肃的研究计划，但也意味着许多预期中的技术和商业成功已经被计入今日入场价格。保留证据描述的是以研发为中心的第一年，预计六至十二个月内展开企业合作伙伴讨论，而不是已经验证的收入、留存、利润率或客户经济性。由于指定来源对融资事实的描述一致，但决定实际价格和回报的投资判断输入仍属非公开信息，信心为中等。在里程碑和条款得到验证前，风险高，估值立场偏贵。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
