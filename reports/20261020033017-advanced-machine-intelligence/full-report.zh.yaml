            title: 最高优先级尽调条件
            body: 在 AMI 提供产品里程碑地图、独立可靠性结果、数据权利架构、事件响应证据，以及带有生产验收标准的已签署伙伴范围前，不要评估安全关键部署。
            calloutType: risk
