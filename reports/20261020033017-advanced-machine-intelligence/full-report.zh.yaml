              - CR010
      - number: '7.3'
        title: 运营、质量、安全与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              算力是可监测的运营敞口，而不是已量化的 AMI 成本。CloudZero 的 2026 年 10 月市场评估显示，按需 H100 租赁价格为每 GPU 小时 $2.89-$6.98，9 月中位数为 $3.25
              美元；报告称单月租金上涨 22%，一年期合同价格约比 2025 年 10 月高 38%。这些是市场观察，不是 AMI
              发票，因此烧钱和资金续航仍未知。覆盖巴黎、纽约、蒙特利尔和新加坡的招聘计划也增加了执行复杂度。实际缓释措施应是把分阶段产能合同与已测利用率挂钩，并在安全关键试点前设置可靠性门槛和安全控制证据。缺少供应商承诺、利用率、烧钱、资金续航、渗透测试和恢复指标，使剩余风险评级无法下调。
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
