      - number: '2.2'
        title: 市场规模：资本密集度可见，但可触达支出不可见
        blocks:
          - type: paragraph
            body: >-
              审阅过的证据没有提供可信的 AMI 专属收入池、合同价值、部署数量或买方预算，无法据此计算 TAM、SAM 或 SOM。Reuters 报道称，AI 初创公司在 2025 年第一季度融资 731
              亿美元，占全球风险投资的 57.9%；但风险融资不是客户需求，不能用作市场收入。可访问的 IFR 页面为工业和服务机器人提供了有用的细分口径，但其可见底层数据覆盖 1993-2019 年，因此无法支撑 2026
              年机会规模估计。对投资的结论受证据约束：AMI 覆盖多个潜在的大型相邻市场，但在产品范围、定价、采购路径和部署经济性披露前，可触达支出仍无法量化。早期 AI 估值过热，也进一步削弱了从融资额反推市场规模的做法。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
