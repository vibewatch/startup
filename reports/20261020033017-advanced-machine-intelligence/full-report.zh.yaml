  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品论题、范围与成熟度
        blocks:
          - type: paragraph
            body: >-
              AMI 将其目标产品描述为新一类 AI 系统：理解物理世界、维持持久记忆、进行推理和规划，并保持可控与安全。MIT Technology Review 给出了最清晰的独立说明：AMI
              追求的是面向物理世界的世界模型，而不是把语言模型视为完整的智能技术栈。已披露的应用面很广——工业流程、机器人、自动驾驶、可穿戴设备和医疗——但这是一组目标工作流，而不是一组可购买模块。France 24 和
              RFI 转述 AFP 报道称，管理层预计第一年专注研发，在六至十二个月时间范围内展开企业合作伙伴讨论，并在三至五年内瞄准更通用的系统。这些时间表是管理层计划，不是交付证据。保留的公开来源没有确定 AMI 的
              SKU、API、发布版本、基准、生产部署或客户集成。因此投资判断中的结论是研究阶段成熟度：技术论题足够具体，可以接受检验，但产品市场匹配和工程执行仍大体属于非公开信息。
            claimRefs:
              - CE001
