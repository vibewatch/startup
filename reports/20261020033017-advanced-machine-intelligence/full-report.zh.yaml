      - number: '1.3'
        title: 资本结构与证明责任
        blocks:
          - type: paragraph
            body: >-
              据报道，AMI 以 35 亿美元投前估值完成 10.3 亿美元种子轮融资，领投方包括 Bezos Expeditions、Cathay Innovation、Greycroft、Hiro Capital 和 HV
              Capital，Toyota Ventures、NVIDIA 和 Samsung
              等战略投资者也参与其中。轮次规模代表已募集或承诺的融资，不等于当前可用现金、资金续航、收入或产品市场匹配的证据。由于管理层给出的较为通用的智能系统时间表是三至五年，这一估值也包含很高的执行负担。更广泛的市场证据强化了这一区别：PitchBook
              和 NVCA 报告称，截至 2026 年第三季度，AI 占美国风险投资交易价值的 82.7%；Reuters 另有报道称，投资者担忧部分早期 AI 估值过热并领先于技术交付。这些基准并非 AMI
              的专项证据，但使融资条款、治理权利、里程碑、烧钱速度和独立产品验证成为核心尽调事项。
