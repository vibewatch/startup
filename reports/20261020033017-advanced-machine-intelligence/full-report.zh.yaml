      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              需求来自流畅的生成式系统，与必须推理后果、保持上下文并长期安全行动的机器之间的差距。AMI 对三至五年内实现广泛能力系统的抱负，为多个行业创造了期权价值，但采用时间表应以现场可靠性为锚，而不是研究路线图。MIT
              Technology Review
              报道称，人形机器人部署可能缓慢且因行业而异，电力、电池重量、安全、制造复杂度和缺少工作场所监管都会限制规模。一个垂直领域的成功未必能迁移到另一个领域。医疗应用还增加了单独的监管负担：FDA
              指引要求规划变更、验证和实施方法、影响评估，以及通过既有设备路径进行审查。在广泛平台推出前，这些约束更支持带有可量化安全和 ROI 门槛的窄范围试点。它们也使切换成本和信任取决于部署证据；在 AMI
              展示生产性能、集成要求和买方经济性之前，二者都不能假定存在。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
