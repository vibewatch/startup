            body: >-
              公开的运营概念从视频、音频、机器人状态、激光雷达和其他传感器流开始，随后用 JEPA 式学习形成抽象表征，并在表征空间中进行预测，同时忽略无法预测的细节。AMI
              还表示，行动条件世界模型应能让智能体预测后果，并在安全护栏约束下规划行动序列。这是连贯的机制主张，但不是已披露的生产架构：公司尚未公布模型规模、训练语料权利、评估协议、延迟、算力要求、接口或系统边界。IEEE
              Spectrum 对 Covariant 的报道说明了 AMI 仍需建立的实际壁垒。Covariant
              将其机器人模型连接到从已部署仓库车队收集的数千万条轨迹，同时承认没有合适数据时，模型无法推广到全新的物体或情境。这一比较不是 AMI
              基准；它说明专有真实世界数据、部署反馈和限定领域评估，可能与架构同等重要。AMI 的公开材料尚未证明存在可比的数据飞轮或可量化的泛化优势。
