      - number: '3.2'
        title: 竞争对手已展现不同形式的能力与资本密集度
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence 是已披露的最接近机器人类比对象：CNBC 报道其在 2024 年 11 月以 24 亿美元投后估值完成 4 亿美元融资；TechCrunch 则在 2026 年 3
              月报道称，公司在刚融资略超 10 亿美元、拥有约 80 名员工后，正讨论追加约 10 亿美元融资，估值超过 110 亿美元。这是 AMI 所处长期赛道上的资本和人才竞争，尽管据报道 Physical
              Intelligence 尚无商业化时间表。Google DeepMind 构成另一种威胁。其 Gemini Robotics
              论文描述了直接机器人控制、对未见环境的稳健性、开放词汇指令、对新型机器人形态的适应，以及仅用约 100 次演示学习部分短期任务的能力。这些是已发表的能力主张，而不是针对 AMI
              的中性基准；但它们说明，成熟玩家可以在 AMI 发布可比产品证据前，把模型研究、算力和既有平台结合起来。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
