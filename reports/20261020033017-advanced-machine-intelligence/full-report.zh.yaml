  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止是其他世界模型初创公司
        blocks:
          - type: paragraph
            body: >-
              AMI 并不在一个边界清晰的单一产品类别中竞争。其既定目标是构建能够预测情境如何演变、行动如何产生后果的世界模型，应用横跨机器人、工业系统、医疗和其他传感器密集型环境。因此，直接研究实验室 World
              Labs、专注机器人的 Physical Intelligence、Google DeepMind 的 Gemini Robotics 等成熟平台，以及 Nabla
              等垂直应用都会纳入竞争集合。只要买方可以解决一个边界明确的工作流而不必等待通用世界模型，内部研究团队和传统自动化也会成为现状替代方案。Seedtable 的简略资料确认 AMI 正在运营，并定位为 AI
              研发平台，但没有增加产品规模证据。因此，实际竞争是通用性、部署成熟度、分发能力和信任之间的较量，而不是一张使用相同术语的公司名单。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
              - CP011
              - CP013
              - CP014
