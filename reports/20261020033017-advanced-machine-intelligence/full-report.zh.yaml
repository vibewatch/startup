      - number: '3.3'
        title: 在模型架构决定胜负前，分发可能更重要
        blocks:
          - type: paragraph
            body: >-
              AMI 首个披露的合作伙伴是医疗 AI 公司 Nabla，后者曾由 AMI CEO Alexandre LeBrun 领导。保留证据没有披露合作的经济条款、排他性、数据权利，或 Nabla 是否会在生产环境中使用
              AMI 模型。但 Nabla 展示了嵌入既有工作流的分发优势：Hit Consultant 报道称，一项试点后，Nabla 通过 Epic 向数百名 University of Toledo Health
              临床医生推广，同时报告图表关闭时间减少 29%。接入现有的记录系统可以制造转换摩擦，并为用户提供可信路径，即使底层模型层仍可替换。包括 Toyota Ventures、NVIDIA 和 Samsung 在内的
              AMI 战略投资者，也可能成为供应、渠道或设计合作伙伴优势；但仅有投资参与不能证明商业访问、优先算力或客户承诺。
