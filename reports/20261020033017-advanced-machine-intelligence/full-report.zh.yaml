      - number: '8.2'
        title: 融资背景与可比信号
        blocks:
          - type: paragraph
            body: >-
              最接近的公开信号显示，市场愿意在前沿物理 AI 商业化前为其研究提供融资。据报道，Physical Intelligence 正讨论约 10 亿美元融资，估值超过 110
              亿美元，同时承认没有商业化时间表，并有追加算力的需求。这可作为市场温度指标，而不是直接运营可比对象：来源没有对技术范围、所有权、收入、烧钱或轮次条款进行标准化。更广泛的风险投资证据同样火热且集中。SiliconANGLE
              转述 PitchBook 数据称，2026 年第一季度美国风险投资交易价值达到 2,672 亿美元，其中五笔交易占 73%，AI 占 89%。这些数字支持对定价环境保持谨慎，而不能导出 AMI 的精确倍数。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              可辩护的情景框架必须以里程碑为基础，因为指定证据没有确定收入、现金烧钱、所有权、稀释、清算优先权或退出倍数。在乐观情景中，AMI
              将异常庞大的资本基础转化为外部验证的技术里程碑，并在已披露的六至十二个月讨论窗口内或之前取得实质性伙伴承诺。基准情景遵循既定的研究优先计划，但商业证据不足以支撑估值，因此继续保持“继续研究”立场。悲观情景将商业化延迟与早期
              AI 估值修正叠加，增加下一轮融资折价或稀释风险。根据保留的公开证据，无法支持任何数字概率、回报目标或估值区间；投资委员会应等待缺失的条款和运营数据后再建模。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 入场纪律、尽调要求与论题破裂
        blocks:
          - type: paragraph
            body: >-
              入场纪律应要求资本表、完全稀释后的所有权、期权池处理方式、证券类型、清算优先权、参与权、分批交割、附函、按比例认购权，以及任何债务或算力承诺。商业尽调应取得已签署的伙伴协议，按阶段拆分的收入和销售漏斗、客户集中度、留存、毛利率、月度烧钱、资金续航和与里程碑挂钩的算力预算。技术尽调应定义可量化的可靠性和安全阈值，使用诸如自愿采用的
              NIST AI
              风险管理框架这类有记录的风险流程，而不是把宽泛的安全措辞当作验证。论题破裂触发点包括错过伙伴窗口、里程碑反复延误、实质性劣后于新投资者的融资条款，或在下一次资本事件前无法提供可独立测试的性能和安全证据。
            claimRefs:
              - CV005
              - CV008
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 非同寻常的资本规模不能替代已披露的条款和商业证据；在二者都得到验证前，投资判断仍应是继续研究。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV015
              - CV016
