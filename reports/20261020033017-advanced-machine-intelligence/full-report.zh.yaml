            body: >-
              公开报道把可靠性、可控性和安全描述为产品目标，而不是已验证的运营控制。Nabla 被确定为 AMI
              的首个合作伙伴和潜在临床验证场景，这在任何生产使用能够进入投资判断前，就带来了隐私、医疗器械、模型治理和专业责任问题。另一方面，LeCun 将 AMI 的工作描述为 Meta 的 JEPA
              研究的直接延续。这一传承是技术资产，但指定来源没有解决所有权、许可、员工发明转让、开源承诺，或与 Meta
              和学术关联的边界。不能据此得出没有事件发生的结论：来源池只是没有包含监管机构记录、诉讼案卷、认证材料或事件登记。
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
