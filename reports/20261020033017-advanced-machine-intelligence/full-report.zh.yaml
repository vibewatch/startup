      - number: '2.3'
        title: 买方、用户、付款方与预算路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向机器人制造商、自动驾驶开发商、工业自动化企业、航空航天与国防机构，以及科学模拟团队等可能的买方群体。实际用户会随部署场景变化：机器人工程师、自主系统团队、工厂运营人员、研究人员或临床设备团队。预算归属尚未披露，可能属于研发、工程、运营或受监管产品组织，而不是横向软件预算。AMI
              表示第一年将聚焦研发，并预计在六至十二个月内与企业合作伙伴展开讨论，显示其处于由合作伙伴驱动的探索阶段，而非成熟、可重复的销售流程。具名战略投资者可能提供领域访问，某份二手资料也将 Nabla
              描述为早期部署伙伴，但这两点都不能证明存在独立客户、经常性收入、付费意愿或可规模化采购。
