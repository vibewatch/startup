  - id: FE001
    title: 公开描述的世界模型运行概念
    type: stack
    summary: 有证据边界的概念图，将已披露机制与未披露的实现方式和控制措施分开。
    data:
      layers:
        - label: 多模态观测
          detail: 视频、音频、激光雷达、机器人状态及其他传感器流是已声明的输入类别。
          modules:
            - 视频
            - 音频
            - 激光雷达
            - 机器人状态
            - 其他传感器
          outputs:
            - 时间对齐的现实世界观测；AMI 数据管线未披露
        - label: 表征学习
          detail: 据描述，JEPA 式学习负责编码抽象且可预测的结构。
          modules:
            - 抽象表征
            - 自监督学习
          outputs:
            - 潜在世界状态；AMI 模型设计和规模未披露
        - label: 预测型世界模型
          detail: 预测目标是在表征空间中进行，而不是复现每一个原始细节。
          modules:
            - 状态预测
            - 动作条件化
          outputs:
            - 预测结果；校准证据不可得
        - label: 规划与控制
          detail: 管理层称，动作条件化模型可以在安全护栏约束下规划序列。
          modules:
            - 动作序列规划
            - 施加约束
          outputs:
            - 候选动作；实现方式和回退行为不可得
        - label: 应用接口
          detail: 工业、机器人、可穿戴设备、移动出行和医疗场景被列为目标。
          modules:
            - 工业系统
            - 机器人
            - 可穿戴设备
            - 移动出行
            - 医疗
          outputs:
            - 领域应用；没有证据显示 AMI 已发布 SKU 或 API
        - label: 生命周期保障
          detail: 部署需要评估、监控、安全、隐私、支持和质量控制。
          modules:
            - 评估
            - 监控
            - 安全
            - 隐私
            - 支持
            - 质量
          outputs:
            - 生产保障；没有公开的 AMI 专属控制证据
    approximationNotes: 这是对公开描述的概念性综合；层级顺序是分析安排，不代表 AMI 已披露的实现方式。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE009
      - CE016
