      - number: '7.4'
        title: 合作伙伴依赖、缓释措施与论题破裂触发点
        blocks:
          - type: paragraph
            body: >-
              在保留证据中，Nabla 是唯一点名的运营合作伙伴，因此在记录更多交易对手前，它既是有用的验证场景，也是集中度信号。领导层重叠进一步放大了这一风险：Alexandre LeBrun 从 Nabla CEO 转任
              AMI CEO，同时仍担任 Nabla 董事长和首席 AI 科学家。融资能力很强，但 Reuters 报道的投资者警告称早期 AI
              估值正在变得过热；如果技术里程碑无法转化为独立部署，下行风险会因此加剧。可监测触发点包括：在所述六至十二个月窗口之后仍没有记录在案的合作伙伴讨论；受监管试点前仍没有经审计的安全或可靠性基准；承诺算力却不披露利用率；相对于三至五年目标出现重大进度滑坡；或知识产权、数据权利和治理边界未解决。若其中任何两项持续到下一次融资决策，应暂停新增资本。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR009
