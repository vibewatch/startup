        blocks:
          - type: paragraph
            body: >-
              外部证据支持在宣称通用物理智能前，先开展范围窄、受控的部署。Bain 报告称，人形系统大多仍处于试点阶段，高度依赖人工输入；结构化工业环境可能先于开放环境采用；电池续航也是持续的运营约束。AMI
              初期可能销售软件而不是机器人，但相同的尽调逻辑仍然适用：世界模型必须针对明确任务、传感器栈、故障边界、备用流程和可量化正常运行时间测试。TMCnet 转发的一份 Nabla 新闻稿称，这家独立医疗公司在 60
              天内完成了 Oracle Cerner 集成。这证明 CEO Alexandre Lebrun 具备相邻领域运营经验，并不能证明 AMI 拥有集成层或客户部署。AMI
              公开证据提到可控性、安全和护栏目标，但没有披露隐私架构、网络安全控制、质量管理、事件响应、红队结果、监管批准或认证。在评估部署准备度前，尽调应要求 AMI
              专项产品演示、架构和威胁模型审查、基准资料包、事件记录、发布流程及可供核验的试点。
