    title: 有证据支撑的竞争定位：部署证明与广度
    type: quadrant
    summary: 序数评分展示留存证据如何将六个替代方案定位在公开部署证明和已声明的物理世界目标广度上；这些评分不是性能基准或市场份额估计。
    data:
      points:
        - label: AMI
          x: 2
          'y': 5
          note: 世界模型目标广泛；公开披露的部署证明有限。
        - label: Physical Intelligence
          x: 3
          'y': 5
          note: 机器人目标广泛、资本充足；据报道没有商业化时间表。
        - label: Gemini Robotics
          x: 4
          'y': 5
          note: 已发布覆盖多项任务和多种具身形态的机器人能力。
        - label: World Labs
          x: 2
          'y': 4
          note: 现实世界基础模型定位广泛；留存证据中的产品细节有限。
        - label: Nabla
          x: 5
          'y': 2
          note: 应用范围较窄，但据报道已在生产工作流中推出。
        - label: 内部开发 / 自动化
          x: 3
          'y': 1
          note: 工作流范围较窄；部署证明因买方而异，本文不作量化。
    approximationNotes: 两条轴均仅依据留存证据由分析师赋予 1-5 的序数评分：x 轴为公开部署证明（低至高），y 轴为已声明的物理世界范围（窄至宽）。评分体现方向，不是实测性能。
