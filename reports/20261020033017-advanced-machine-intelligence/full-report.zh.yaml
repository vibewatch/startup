  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从异常充足的资本和溢价估值出发，经由延后的证明和热门市场风险，最终指向“继续研究”的决定。
    data:
      nodes:
        - id: capital
          label: $1.03B 种子资本
          detail: 对一家研究阶段公司而言，这是异常充足的融资能力。
        - id: price
          label: $3.5B 投前估值
          detail: 预期成功的大部分价值已被计入入场价格。
        - id: proof-window
          label: 研究优先的证明窗口
          detail: 第一年研发，以及六至十二个月内的合作伙伴讨论。
        - id: market-heat
          label: 集中的 AI 融资
          detail: AI 占 2026 年第一季度美国风投交易价值的 89%。
        - id: downside
          label: 商业化与倍数风险
          detail: 一家物理 AI 同行据报道没有商业化时间表；机构投资者警告早期估值过热。
        - id: risk-gate
          label: 有度量的风险控制
          detail: 技术和安全主张需要有据可查的框架与独立验证。
        - id: decision
          label: 继续研究
          detail: 在确定入场价格前，先核验条款、经营证据和里程碑。
      edges:
        - source: capital
          target: price
        - source: price
          target: proof-window
        - source: proof-window
          target: market-heat
        - source: market-heat
          target: downside
        - source: downside
          target: risk-gate
        - source: risk-gate
          target: decision
    approximationNotes: 这是定性的决策链，不是按概率加权的估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV008
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
