    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 合作伙伴讨论转化为实质性承诺；经过外部测试的技术和安全里程碑按时出现。
        - 当前估值会更有说服力，但在缺少持股和退出输入的情况下，仍无法支持数字化的上行空间或回报区间。
        - 算力强度、技术失败和合同经济性疲弱。
        - 公开信息无法给出有依据的概率；需要里程碑和合同证据。
      - - 基准
        - AMI 执行已披露的研究优先年度计划并启动合作伙伴讨论，但商业指标和条款仍属非公开信息。
        - 维持“继续研究”的建议，并认为相对于公开证据，$3.5B 投前估值偏贵。
        - 证据周期长、稀释和估值压缩。
        - 与当前披露的时间线最一致，但无法进行统计估计。
      - - 悲观
        - 商业化延期，技术证据仍停留在内部，早期 AI 估值热情降温。
        - 下轮融资、结构化融资或重大稀释变得可能；其幅度无法由公开信息量化。
        - 优先权悬置、融资集中，以及持续扩大的前收入成本基础。
        - 若错过里程碑，或在外部验证前再次融资，就会触发。
