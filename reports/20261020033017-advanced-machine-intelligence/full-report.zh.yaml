      - number: '3.4'
        title: 壁垒尚在未来，而商品化和替代风险已在当下
        blocks:
          - type: paragraph
            body: >-
              AMI 最强的公开差异化在于一个连贯的论题：针对连续、嘈杂物理数据的表征空间预测；持久记忆；规划；以及对可控性和安全性的重视。France 24 和 RFI
              报道称，公司计划第一年聚焦研发，在六至十二个月内讨论企业合作，并以三至五年为时间范围，目标是实现广泛有用的系统。这一时间表创造了被替代的窗口。Physical Intelligence
              可以继续扩大机器人模型，Google 可以推进既有机器人技术栈，World Labs 可以开发相邻的真实世界基础模型，垂直应用也可能在 AMI
              通用平台商业化前占据客户工作流。审阅过的资料中没有披露价格、合同结构、AMI 基准、生产可靠性结果或监管验证。因此，投资判断应把架构和团队质量视为未来差异化的期权，而不是当前锁定能力或定价权的证明。
