            body: >-
              公开报道显示，Yann LeCun 任非执行董事长，Alexandre LeBrun 任首席执行官，Laurent Solly 任首席运营官。这一配置把全球知名的 AI
              研究领导力与创业和运营经验结合起来，但也把执行力和外部可信度集中在一个规模很小的创始团队中。2026 年 3 月报道的近期计划是增加 20 至 30
