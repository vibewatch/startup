  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：面向关键物理系统的世界模型
        blocks:
          - type: paragraph
            body: >-
              AMI
              所处的相关市场比全部人工智能更窄，比人形机器人更宽。投资者撰写的描述聚焦于能够表征现实、预测情境如何演变，并把行动与后果连接起来的世界模型。独立报道指出，其潜在用途包括自动驾驶、机器人、喷气发动机、发电厂和人体器官模型。现有证据支持这样一个市场边界：面向物理或安全关键工作流的预测与规划系统。它不包括通用文本生成、消费者聊天机器人，以及不对物理环境中的行动建模的传统分析工具。它也把软件智能与机器人硬件收入区分开来：工业机器人、服务机器人、自动驾驶汽车和受监管医疗设备属于相邻需求池，并非可互换的支出类别。现状替代方案包括脚本化自动化、领域模拟器、人工操作员和特定任务控制软件。
            claimRefs:
              - CM001
