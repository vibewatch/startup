evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Executed financing documents covering funded amount, tranches, security type, liquidation preferences, option-pool
      treatment, investor rights, board rights, and current cash availability.
    whyItMatters: >-
      The reported round size and pre-money valuation do not establish ownership, downside protection, governance
      control, dilution, liquidity, or runway.
    diligencePath: >-
      Review the signed term sheet, stock purchase documents, cap table, board consents, bank statements, and a
      sources-and-uses schedule.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Audited revenue, ARR definition and bridge, customer count, signed contracts, current headcount, monthly burn, and
      runway.
    whyItMatters: >-
      Without these records, financing and hiring plans cannot be translated into commercial traction, capital
      efficiency, or cash durability.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank balances, payroll, the customer contract register,
      and reference calls.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-stakeholder-enumeration
    missingEvidence: >-
      A complete board and executive roster, current organization chart, fully diluted cap table, and schedule of
      strategic or related-party rights.
    whyItMatters: >-
      Public named-person and investor lists cannot establish exhaustive governance coverage, ownership, succession
      depth, conflicts, or control.
    diligencePath: >-
      Reconcile board minutes, employment agreements, conflict policies, the option ledger, investor side letters, and
      the fully diluted cap table.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      AMI product packaging, price, deployment unit, target geography, buyer budget, and contracted pipeline needed for
      a bottom-up TAM, SAM, and SOM.
    whyItMatters: Without these inputs, broad AI or robotics estimates would overstate the market AMI can actually serve and win.
    diligencePath: >-
      Obtain management's market model and reconcile every assumption to signed pilots, procurement budgets, and
      deployment economics.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named arm's-length customers, contract status, pricing, budget owner, deployment scope, paid-pilot terms, and
      renewal or expansion evidence.
    whyItMatters: >-
      Investor and partner relationships do not establish willingness to pay or a repeatable path from research to
      revenue.
    diligencePath: >-
      Review executed contracts and interview economic buyers separately from investors, affiliates, and research
      collaborators.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: robotics-sizing
    missingEvidence: >-
      Current robot installations, service-robot revenue, application mix, and regional adoption data comparable on a
      2026 basis.
    whyItMatters: The accessible IFR text exposes historical periods and cannot support a current robotics market estimate.
    diligencePath: >-
      Acquire the current IFR dataset or another independent industry dataset and normalize categories, geography, and
      period.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: cross-vertical-adoption
    missingEvidence: >-
      Independent production benchmarks for reliability, safety, integration effort, power consumption, and ROI in each
      target vertical.
    whyItMatters: A successful pilot in one domain does not establish portability or an adoption curve in another.
    diligencePath: >-
      Require vertical-specific pilot scorecards, incident logs, baseline comparisons, and buyer-approved ROI
      calculations.
    relatedQuestionRefs:
      - QM006
      - QM009
      - QM010
  - type: private-evidence-only
    severity: material
    topic: pricing gap
    missingEvidence: >-
      Comparable list and realized pricing, billing units, contract duration, discounts, minimum commitments, and
      gross-margin implications for AMI and direct alternatives.
    whyItMatters: >-
      Without commercial terms, diligence cannot compare buyer economics, pricing power, multi-homing incentives, or the
      durability of switching costs.
    diligencePath: >-
      Request AMI pricing and pipeline materials, sample contracts, discount schedules, partner economics, and buyer
      references; obtain comparable competitor quotes through procurement checks.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: trust and reliability
    missingEvidence: >-
      Independent, AMI-specific benchmark results, production reliability data, safety evaluations, regulatory posture,
      incident history, and customer validation.
    whyItMatters: >-
      Safety and controllability are central differentiation claims, but the retained evidence does not establish
      performance in production or regulated settings.
    diligencePath: >-
      Request benchmark protocols and raw results, model and system cards, red-team reports, incident logs, regulatory
      analyses, and direct references from production design partners.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitive landscape
    missingEvidence: >-
      A buyer-validated census of internal-build programs, conventional automation vendors, and additional world-model
      entrants by target workflow.
    whyItMatters: >-
      The retained sources establish representative alternatives but do not quantify the full population or the
      frequency with which buyers choose each substitute.
    diligencePath: >-
      Interview target buyers and integrators, review procurement records, and map active deployments by workflow,
      geography, and system integrator.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: >-
      Executed customer and partner contracts showing pricing, minimum commitments, revenue share, term, renewals, and
      cash receipts.
    whyItMatters: Without contract economics, strategic access cannot be translated into revenue quality or recurring gross profit.
