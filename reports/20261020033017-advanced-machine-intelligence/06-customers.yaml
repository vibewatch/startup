        - Named Nabla customer; not identified as an AMI customer
        - Nabla clinical assistant
        - Nabla use reported; no AMI deployment disclosed
        - Included in Nabla's reported organizational footprint
        - Cannot be counted as AMI customer proof
      - - University of Iowa Health Care
        - Named Nabla customer; not identified as an AMI customer
        - Nabla clinical assistant
        - Nabla use reported; no AMI deployment disclosed
        - Included in Nabla's reported organizational footprint
        - Cannot be counted as AMI customer proof
    notes: >-
      Partial enumeration limited to organizations named in the assigned source
      set; downstream Nabla users are shown to delimit the validation surface and
      are explicitly not classified as AMI customers.
