artifact: customers
slug: advanced-machine-intelligence
runDate: 2026-10-20
company:
  name: Advanced Machine Intelligence
chapter:
  number: 6
  title: Customers
  summary: >-
    AMI remains pre-commercial in the reviewed public record: Nabla is the only
    disclosed partner and expects early access, while no AMI customer count,
    production deployment, revenue, retention, contract-length, or concentration
    metric was disclosed. Nabla offers a potentially valuable healthcare
    validation surface, but its own customer footprint is not evidence of AMI
    adoption.
sections:
  - id: disclosed-customer-proof
    title: Disclosed customer proof is limited to one early partner
    body: >-
      Nabla is the only named AMI partner in the assigned evidence. TechCrunch,
      EU-Startups, and Crunchbase News each identify the healthcare AI company as
      AMI's first partner, while STAT reports that Nabla expects early access to
      AMI technology. The relationship is substantive enough to create a
      plausible first validation environment, but it is not yet documented as a
      production customer deployment: STAT reported no formal equity or licensing
      agreement between the companies at publication, even though Nabla's COO
      said they were already working closely. This distinction matters because a
      partner relationship, early-model access, and shared leadership do not
      establish a paid contract, production use, renewal, or measurable customer
      outcome. The reviewed set therefore supports one named partner, not a
      customer roster.
    claimRefs: [CU001, CU002, CU003, CU012, CU016]
    tableRefs: [TU003]
  - id: segment-and-buyer-map
    title: Initial segments are hypotheses around real-world operating data
    body: >-
      AMI publicly describes target applications spanning healthcare, industrial
      process control, automation, wearables, robotics, and other systems that
      operate on continuous sensor data. Those fields imply different buying
      centers: clinical product leaders and health systems in healthcare,
      engineering or operations teams in industry, and robotics or autonomy
      teams for machines in open environments. Only the healthcare path has a
      named AMI partner. The other segments are application directions, not
      verified customer categories. A competitor-issued Covariant release shows
      what mature physical-AI proof can look like - customers across 15 countries
      and four continents and hundreds of deployed robots - but it cannot be
      attributed to AMI. AMI's segment map should therefore be read as a
      prioritized diligence framework rather than evidence of diversified demand.
    claimRefs: [CU008, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption evidence belongs to Nabla, not yet to AMI
    body: >-
      Nabla brings an attractive downstream testing surface: a secondary industry
      report says its assistant is used by more than 85,000 clinicians across
      more than 130 U.S. healthcare organizations and names CVS Health,
      Children's Hospital Los Angeles, and University of Iowa Health Care. The
      same source reports fivefold Nabla revenue growth over six months. These are
      Nabla metrics, with Nabla denominators and periods; they must not be
      relabeled as AMI customer, usage, or revenue metrics. For AMI itself, the
      assigned sources disclose no active-account count, paid pilot count,
      utilization, ARR, NRR, GRR, churn, renewal, contract length, or satisfaction
      measure. Without those measures, durability and expansion cannot be
      assessed, and the existence of a large partner footprint establishes
      access to a potential evaluation environment rather than product-market fit.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
  - id: expansion-and-concentration
    title: Expansion depends on converting research access into arm's-length deployments
    body: >-
      Management's own sequencing is long dated. TechCrunch reports that AMI has
      no plans to generate revenue for the time being, although it intends to
      engage prospective customers early so models can encounter real data and
      evaluations. AFP reporting says corporate-partner discussions could begin
      within six to 12 months, while broadly useful systems are a three-to-five-
      year objective. That sequence makes early design partnerships plausible but
      leaves procurement, integration, regulatory acceptance, pricing, and
      renewal untested. Nabla also concentrates the disclosed customer story in a
      company whose chairman is AMI's CEO, creating a related-party diligence
      question without proving any undisclosed transaction. Expansion evidence
      should require signed arm's-length agreements, AMI-specific deployment
      outcomes, cohort retention, and customer concentration data before the
      partnership narrative is treated as a repeatable commercial motion.
    claimRefs: [CU004, CU005, CU006, CU007, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and evidence status
    columns:
      - Segment
      - Buyer / user / payer
      - Disclosed AMI proof
      - Scale or strategic value
      - Diligence gap
    rows:
      - - Healthcare AI
        - Nabla product teams; downstream clinicians and health systems
        - First disclosed partner; expected early access; no production outcome disclosed
        - Nabla reportedly reaches more than 85,000 clinicians at more than 130 U.S. organizations
        - AMI contract, licensing terms, deployment scope, regulated-use controls, and AMI-specific outcomes
      - - Industrial process control
        - Plant engineering, operations, and automation teams
        - Application direction only; no named AMI customer
        - Potential access to continuous, high-dimensional operating data
        - Named design partner, paid pilot, integration burden, and measurable operating result
      - - Robotics and autonomy
        - Robotics developers, fleet operators, manufacturers, and logistics teams
        - Application direction only; no named AMI customer
        - Peer evidence shows physical-AI deployments can scale to hundreds of robots
        - AMI embodiment, reliability, safety, fleet scale, and production reference
      - - Wearables and sensor systems
        - Device makers, product teams, and end users
        - Application direction only; no named AMI customer
        - Potential high-frequency real-world data and recurring evaluation loops
        - Data rights, privacy, device integration, buyer, pricing, and retention evidence
    notes: >-
      Segments beyond healthcare are AMI-stated application directions, not
      verified customer categories; Nabla scale is partner-level evidence and the
      Covariant figures are a competitor-issued benchmark, not AMI adoption.
    claimRefs: [CU001, CU008, CU009, CU013, CU014]
