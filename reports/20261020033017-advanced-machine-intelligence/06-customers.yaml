    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU012, CU013]
figures:
  - id: FU001
    title: Evidence-based path from research to durable customer expansion
    type: journey-map
    summary: >-
      Public evidence supports the first four relationship-building stages, while
      paid production, renewal, and multi-customer expansion remain unverified.
    data:
      nodes:
        - id: research
          label: Fundamental research
          detail: AMI is prioritizing research and development before near-term revenue.
          status: evidenced
        - id: prospect-engagement
          label: Prospective-customer engagement
          detail: Management plans early engagement to obtain real-world data and evaluations.
          status: management-plan
        - id: partner-discussions
          label: Corporate-partner discussions
          detail: Discussions could occur within six to 12 months from March 2026.
          status: forward-looking
        - id: first-partner
          label: Nabla partnership
          detail: Nabla is the first disclosed partner and the only named AMI relationship.
          status: evidenced
        - id: early-access
          label: Early-model access
          detail: Nabla expects early access, but production scope and commercial terms are undisclosed.
          status: early
        - id: durable-expansion
          label: Production, renewal, and expansion
          detail: Paid deployment, retention, outcomes, and customer concentration are not publicly evidenced.
          status: unverified
    approximationNotes: >-
      Stage order synthesizes reported management sequencing; it does not imply
      completed conversion, elapsed time, or a measured funnel rate.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU015, CU016]
callouts:
  - calloutType: risk
    title: Do not count Nabla's customers as AMI customers
    body: >-
      Nabla's reported clinician and organization footprint may offer an
      evaluation surface, but none of the reviewed sources identifies those
      organizations as AMI customers or AMI production users.
    claimRefs: [CU009, CU010, CU012]
  - calloutType: recommendation
    title: Gate commercial credit on arm's-length evidence
    body: >-
      Require executed AMI contracts, deployment-level outcomes, retention
      cohorts, and concentration data before underwriting a repeatable customer
      motion.
    claimRefs: [CU003, CU013, CU015, CU016]
