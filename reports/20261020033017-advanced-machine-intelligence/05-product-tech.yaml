company:
  name: Advanced Machine Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    AMI has articulated a differentiated research thesis around JEPA-derived, multimodal world models
    that predict in representation space and support planning, but the public record still describes a
    research program rather than a released product. No retained source provides an AMI SKU, API,
    benchmark, deployment specification, reliability record, certification, or implemented safety
    control, so product maturity and technical defensibility remain unverified.
sections:
  - id: product-thesis-and-maturity
    title: Product thesis, scope, and maturity
    body: >-
      AMI describes its intended product as a new class of AI system that understands the physical
      world, maintains persistent memory, reasons and plans, and remains controllable and safe. MIT
      Technology Review provides the clearest independent account of the intended distinction:
      AMI is pursuing world models for the physical world rather than treating language models as the
      whole intelligence stack. The disclosed application surface is broad—industrial processes,
      robotics, autonomous driving, wearables, and healthcare—but it is a portfolio of target
      workflows, not a set of purchasable modules. AFP reporting carried by France 24 and RFI says
      management expected the first year to focus on R&D, with corporate-partner discussions on a
      six-to-twelve-month horizon and more universal systems targeted in three to five years. Those
      timeframes are management plans, not delivery evidence. The retained public sources do not
      identify an AMI SKU, API, release, benchmark, production deployment, or customer integration.
      The underwriting conclusion is therefore research-stage maturity: the technical thesis is
      specific enough to test, but product-market and engineering execution remain largely private.
    claimRefs: [CE001, CE002, CE007, CE008, CE015]
    tableRefs: [TE001, TE002]
  - id: operating-concept-and-data-loop
    title: Operating concept, data requirements, and differentiation
    body: >-
      The public operating concept begins with video, audio, robot-state, lidar, and other sensor
      streams, then uses JEPA-style learning to form abstract representations and predict in that
      representation space while ignoring details that cannot be predicted. AMI has further said
      that action-conditioned world models should let an agent forecast consequences and plan action
      sequences subject to safety guardrails. This is a coherent mechanism claim, not a disclosed
      production architecture: the company has not published model sizes, training corpus rights,
      evaluation protocols, latency, compute requirements, interfaces, or system boundaries.
      IEEE Spectrum's account of Covariant illustrates the practical moat AMI would still need to
      build. Covariant linked its robotics model to tens of millions of trajectories gathered from a
      deployed warehouse fleet, while acknowledging that the model could not generalize to wholly
      new objects or situations without suitable data. That comparison is not an AMI benchmark; it
      shows why proprietary real-world data, deployment feedback, and domain-bounded evaluations may
      matter as much as the architecture. AMI's public materials do not yet establish any comparable
      data flywheel or measured generalization advantage.
    claimRefs: [CE003, CE004, CE005, CE006, CE009, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-reliability-and-controls
    title: Deployment, reliability, and trust controls
    body: >-
      External evidence argues for narrow, controlled deployment before claims of general physical
      intelligence. Bain reports that humanoid systems remain mostly in pilots and depend heavily on
      human input, with structured industrial settings likely to precede open environments; it also
      identifies battery endurance as a persistent operational constraint. AMI may initially sell
      software rather than robots, but the same diligence logic applies: a world model must be tested
      against a defined task, sensor stack, failure envelope, fallback process, and measurable uptime.
      A Nabla-issued release syndicated through TMCnet says the separate healthcare company completed
      an Oracle Cerner integration in under 60 days. That is evidence of CEO Alexandre Lebrun's
      adjacent operating experience, not evidence that AMI has an integration layer or customer
      deployment. Public AMI evidence states goals of controllability, safety, and guardrails but
      does not disclose privacy architecture, cybersecurity controls, quality management, incident
      response, red-team results, regulatory approvals, or certifications. Before underwriting
      deployment readiness, diligence should require an AMI-specific product demo, architecture and
      threat-model review, benchmark pack, incident history, release process, and referenceable pilot.
    claimRefs: [CE010, CE011, CE014, CE016]
