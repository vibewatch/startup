callouts:
  - calloutType: risk
    title: Product evidence has not caught up with the technical ambition
    body: >-
      Treat the roadmap as a testable research thesis, not a shipped platform. A financing or
      partnership announcement does not substitute for an AMI-specific SKU, benchmark, deployment,
      reliability record, or safety-control review.
    claimRefs: [CE008, CE015, CE016]
