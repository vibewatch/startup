company:
  name: "Advanced Machine Intelligence"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Advanced Machine Intelligence is a Paris-based world-model research company founded in December 2025 and financed with a reported $1.03 billion seed round at a $3.5 billion pre-money valuation. The capital base and senior technical leadership are unusually strong for a seed company, but public evidence still leaves revenue, customer count, current headcount, financing terms, governance controls, and cash availability unverified."
sections:
  - id: "identity-and-operating-thesis"
    title: "Identity and operating thesis"
    body: >-
      Advanced Machine Intelligence, or AMI, is a private Paris-based AI research company founded on December 15, 2025. It reports operating locations in Paris, New York, Montreal, and Singapore. AMI describes its mission as building systems that understand the real world rather than relying only on language, using world models that learn abstract representations of noisy sensor data and predict in representation space. The stated application set spans industrial process control, automation, wearable devices, robotics, and healthcare. This is a research-led product thesis rather than a demonstrated commercial model: the assigned evidence describes intended capabilities and application domains but does not disclose a priced product, revenue, ARR, customer count, or current workforce total. The snapshot therefore separates verified identity and financing facts from unsupported operating metrics.
    claimRefs: ["CO001", "CO002", "CO003", "CO004"]
    tableRefs: ["TO001"]
    figureRefs: ["FO001"]
  - id: "leadership-and-execution-dependence"
    title: "Leadership and execution dependence"
    body: >-
      Public reporting identifies Yann LeCun as non-executive chairman, Alexandre LeBrun as chief executive, and Laurent Solly as chief operating officer. That configuration combines globally recognized AI research leadership with company-building and operating experience, but it also concentrates execution and external credibility in a small founding group. The near-term plan reported in March 2026 was to add 20 to 30 people, which is a hiring intention rather than evidence of current headcount. Governance diligence is especially important because LeBrun was also reported to remain chairman and chief AI scientist at Nabla while serving as AMI's CEO, and Nabla is AMI's first partner. Investors should verify time allocation, related-party approval, IP ownership, data rights, and commercial terms rather than infer safeguards from the founders' reputations.
    claimRefs: ["CO009", "CO010", "CO011", "CO013", "CO014"]
    tableRefs: ["TO002"]
  - id: "capitalization-and-proof-burden"
    title: "Capitalization and proof burden"
    body: >-
      AMI reportedly raised $1.03 billion in seed financing at a $3.5 billion pre-money valuation, led by Bezos Expeditions, Cathay Innovation, Greycroft, Hiro Capital, and HV Capital, with strategic participation that included Toyota Ventures, NVIDIA, and Samsung. The round size is financing raised or committed, not evidence of cash currently available, runway, revenue, or product-market fit. The valuation also embeds a substantial execution burden because management's stated horizon for fairly universal intelligent systems is three to five years. Broader market evidence reinforces that distinction: PitchBook and NVCA reported that AI represented 82.7% of U.S. venture deal value through Q3 2026, while Reuters separately reported investor concern that some early-stage AI valuations were frothy and ahead of technical delivery. Those benchmarks are not AMI-specific proof, but they make financing terms, governance rights, milestones, burn, and independent product validation central diligence items.
    claimRefs: ["CO005", "CO006", "CO007", "CO008", "CO012", "CO015", "CO016"]
    tableRefs: ["TO003"]
