    - type: "private-evidence-only"
      severity: "material"
      topic: "commercial-scale"
      missingEvidence: "Audited revenue, ARR definition and bridge, customer count, signed contracts, current headcount, monthly burn, and runway."
      whyItMatters: "Without these records, financing and hiring plans cannot be translated into commercial traction, capital efficiency, or cash durability."
