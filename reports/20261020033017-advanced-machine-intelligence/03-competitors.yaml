company:
  name: "Advanced Machine Intelligence"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    AMI enters a well-capitalized field that includes direct world-model labs, robotics
    foundation-model companies, incumbent research platforms, vertical applications, and
    internal-build alternatives. Its public differentiation is architectural ambition,
    leadership, safety framing, and unusually large seed financing; however, the retained
    evidence does not disclose commercial pricing, customer benchmarks, or deployment-grade
    performance that would yet establish a durable moat.
sections:
  - id: "competitive-set"
    title: "The competitive set extends beyond other world-model startups"
    body: >-
      AMI is not competing in a single, clean product category. Its stated objective is to
      build world models that predict how situations evolve and how actions produce
      consequences, with applications spanning robotics, industrial systems, healthcare,
      and other sensor-rich environments. That places direct research labs such as World
      Labs beside robotics-focused Physical Intelligence, incumbent platforms such as
      Google DeepMind's Gemini Robotics, and vertical applications such as Nabla. It also
      leaves internal research teams and conventional automation as status-quo substitutes
      whenever a buyer can solve a bounded workflow without waiting for a general world
      model. Seedtable's thin profile confirms that AMI is active and positioned as an AI
      research-and-development platform, but it adds no product-scale evidence. The practical
      landscape is therefore a contest among generality, deployment maturity, distribution,
      and trust rather than a list of companies using the same terminology.
    claimRefs: [CP001, CP002, CP004, CP009, CP011, CP013, CP014]
    tableRefs: [TP001]
  - id: "capability-and-scale"
    title: "Rivals already show different forms of capability and capital intensity"
    body: >-
      Physical Intelligence is the closest disclosed robotics analogue: CNBC reported a
      $400 million round at a $2.4 billion post-money valuation in November 2024, while
      TechCrunch reported in March 2026 that the company was discussing roughly $1 billion
      more at a valuation above $11 billion after raising just over $1 billion and employing
      about 80 people. That is capital and talent competition on AMI's own long-horizon
      terrain, although Physical Intelligence reportedly had no commercialization timeline.
      Google DeepMind presents a different threat. Its Gemini Robotics paper describes direct
      robot control, robustness to unseen environments, open-vocabulary instructions,
      adaptation to novel embodiments, and learning some short-horizon tasks from as few as
      100 demonstrations. Those are published capability claims, not a neutral benchmark
      against AMI, but they demonstrate that an incumbent can combine model research,
      compute, and an existing platform before AMI has published comparable product evidence.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP002]
  - id: "distribution-and-switching"
    title: "Distribution may matter before model architecture becomes decisive"
    body: >-
      AMI's first disclosed partnership is Nabla, the healthcare AI company previously led
      by AMI CEO Alexandre LeBrun. The retained evidence does not disclose the partnership's
      economics, exclusivity, data rights, or whether Nabla will consume an AMI model in
      production. Yet Nabla illustrates the distribution advantage of embedding within an
      established workflow: Hit Consultant reported a rollout to hundreds of University of
      Toledo Health clinicians through Epic after a pilot, alongside a reported 29% reduction
      in chart-closure time. Integration into an incumbent system of record can create
      switching friction and a trusted route to users even when the underlying model layer
      remains replaceable. Strategic AMI backers including Toyota Ventures, NVIDIA, and
      Samsung could also become supply, channel, or design-partner advantages, but investment
      participation alone is not evidence of commercial access, preferred compute, or
      customer commitments.
    claimRefs: [CP003, CP011, CP012, CP016]
    tableRefs: [TP003]
  - id: "moat-and-displacement"
    title: "The moat is prospective, while commoditization and displacement risks are current"
    body: >-
      AMI's strongest public differentiation is a coherent thesis: representation-space
      prediction for continuous, noisy physical data; persistent memory; planning; and an
      emphasis on controllability and safety. France 24 and RFI reported that the company
      planned to focus on research and development during its first year, discuss corporate
      partnerships within six to twelve months, and target broadly useful systems over a
      three-to-five-year horizon. That timing creates a displacement window. Physical
      Intelligence can continue scaling robotics models, Google can advance an incumbent
      robotics stack, World Labs can pursue adjacent real-world foundation models, and
      vertical applications can own customer workflows before AMI's general platform is
      commercial. The reviewed corpus contains no disclosed price, contract structure, AMI
      benchmark, production reliability result, or regulatory validation. The investment
      case should therefore treat architecture and team quality as options on future
      differentiation, not proof of present lock-in or pricing power.
    claimRefs: [CP001, CP004, CP007, CP008, CP009, CP010, CP013, CP015, CP016]
    figureRefs: [FP001]
