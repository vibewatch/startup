figures:
  - id: "FP001"
    title: "Evidence-backed competitive positioning: deployment proof versus breadth"
    type: "quadrant"
    summary: >-
      Ordinal scores show how the retained evidence positions six alternatives on public
      deployment proof and breadth of stated physical-world ambition; they are not performance
      benchmarks or market-share estimates.
    data:
      points:
        - label: "AMI"
          x: 2
          y: 5
          note: "Broad world-model ambition; limited disclosed deployment proof."
        - label: "Physical Intelligence"
          x: 3
          y: 5
          note: "Broad robotics ambition and substantial capital; no commercialization timeline reported."
        - label: "Gemini Robotics"
          x: 4
          y: 5
          note: "Published robotics capabilities across tasks and embodiments."
        - label: "World Labs"
          x: 2
          y: 4
          note: "Broad real-world foundation-model positioning; limited product detail in retained evidence."
        - label: "Nabla"
          x: 5
          y: 2
          note: "Narrower application scope with reported production-workflow rollout."
        - label: "Internal build / automation"
          x: 3
          y: 1
          note: "Narrow workflow scope; deployment proof varies by buyer and is not quantified here."
    approximationNotes: "Both axes use analyst-assigned 1-5 ordinal scores based only on the retained evidence: x is public deployment proof (low to high), and y is breadth of stated physical-world scope (narrow to broad). Scores are directional, not measured performance."
    claimRefs: [CP014, CP016]
callouts:
  - calloutType: "risk"
    title: "Capital does not remove the commercialization clock"
    body: >-
      AMI can fund a long research program, but Physical Intelligence, Google DeepMind, World
      Labs, and embedded vertical applications can improve or capture distribution during the
      same period. No retained source establishes that AMI already has customer switching
      costs, exclusive data, or production performance advantages.
    claimRefs: [CP003, CP007, CP008, CP009, CP011, CP013, CP015, CP016]
  - calloutType: "recommendation"
    title: "Underwrite milestones, not terminology"
    body: >-
      Diligence should require AMI-specific benchmark protocols, deployment evidence,
      partnership economics, and pricing before assigning moat value to the world-model label.
    claimRefs: [CP001, CP004, CP015, CP016]
