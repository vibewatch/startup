  topStrengths:
    - >-
      A reported $1.03 billion seed round provides exceptional capacity to fund a long-horizon world-model research
      program.
    - The founding team combines recognized AI research leadership with company building and operating experience.
    - >-
      The JEPA-derived physical-world thesis is technically coherent and Nabla offers a plausible first healthcare
      validation environment.
  topRisks:
    - >-
      No public AMI SKU, benchmark, released product, production deployment, or independently validated reliability and
      safety record.
    - >-
      The reported $3.5 billion pre-money valuation precedes disclosed revenue, customer, margin, burn, runway,
      ownership, or financing-term evidence.
    - >-
      Nabla concentration, overlapping leadership roles, and unresolved IP, data-rights, licensing, and related-party
      controls create governance risk.
    - >-
      A multi-year commercialization horizon and volatile accelerated-compute capacity expose the research plan to
      schedule and capital-intensity risk.
  unresolvedGaps:
    - >-
      Financing terms, capitalization, liquidation preferences, tranches, option-pool treatment, investor rights, net
      cash proceeds, and effective entry price.
    - >-
      AMI-specific product specification, SKU or API, reproducible benchmarks, roadmap milestones, deployment interface,
      reliability record, and safety case.
    - >-
      Signed customer or partner contracts, paid pilots, production deployments, customer count, pricing, ARR,
      retention, concentration, and referenceable outcomes.
    - >-
      Nabla economics, data rights, licensing, exclusivity, transfer pricing, governance approvals, and separation of
      AMI from downstream Nabla metrics.
    - >-
      Cash balance, monthly burn, runway, compute procurement commitments, supplier concentration, utilization, and
      workload-level unit economics.
    - >-
      Board and executive roster, current organization chart, IP provenance, invention assignments, privacy and security
      controls, certifications, incident history, and regulated-domain approvals.
