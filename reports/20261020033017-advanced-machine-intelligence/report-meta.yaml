companyProfile:
  summary: >-
    Advanced Machine Intelligence is a private, Paris-headquartered AI research company founded in December 2025 to
    build multimodal world models that learn from real-world sensor data, predict consequences, and support planning.
    Its reported $1.03 billion seed round and experienced founding team provide unusual research capacity, while the
    public record still describes a research-stage business without a released product, verified production deployment,
    or disclosed operating economics.
  foundedDate: '2025-12-15'
  founders:
    - name: Yann LeCun
      role: Co-founder and non-executive chairman
      background: AI researcher associated with the JEPA and world-model thesis.
      claimRefs:
        - CO009
        - CR010
    - name: Alexandre LeBrun
      role: Co-founder and chief executive officer
      background: AI company builder who retains chairman and chief AI scientist roles at Nabla.
      claimRefs:
        - CO009
        - CO014
    - name: Laurent Solly
      role: Co-founder and chief operating officer
      background: Operating executive with prior Meta leadership experience.
      claimRefs:
        - CO010
  foundingLocation: Paris, France
  headquarters: Paris, France
  productSummary: >-
    AMI is researching JEPA-derived, multimodal world models intended to learn abstract representations from video,
    audio, lidar, robot-state, and other sensor data, predict action consequences, and plan within safety guardrails; no
    public AMI SKU, API, benchmark, or released product is evidenced.
  customerFocus: >-
    Industrial process control, robotics and autonomy, wearables, and healthcare organizations operating on continuous
    real-world sensor data.
  businessModel: >-
    Not publicly established; the evidence indicates a research-first, partnership-led path, beginning with early model
    access for Nabla.
  stage: Seed
  fundingStatus: >-
