  title: Risks
  summary: Altos Labs’ risk profile is dominated by scientific uncertainty, capital dependence, and public scrutiny rather
    than by disclosed legal events or operational incidents.
sections:
- id: risk-stack
  title: Risk stack and severity
  body: Altos Labs carries a risk profile that is unusual even for biotech. The dominant exposure is not a single legal event
    or a commodity-price cycle; it is whether the underlying science can be translated into human benefit before capital patience
    runs out. That puts regulatory ambiguity, scientific uncertainty, and proof risk at the top of the stack. The public record
    does not show a history of enforcement or incident-driven risk, which is good, but it also means the memo has to treat
    the absence of disclosed problems as a gap in visibility rather than as proof of low risk. In practice, that means severity
    should be driven by thesis dependence, not by incident counts. Because the category is still early, the main risk is not
    a known incident but a sustained inability to generate enough proof to justify continued funding.
  claimRefs:
  - CR001
  - CR006
  - CR009
  - CR010
  tableRefs:
  - TR001
  - TR002
- id: dependency-risk
  title: Dependency and execution risk
  body: The company depends on private capital, scientific leadership, and a long runway of experimental work. Hiring pages
    show active investment in lab informatics and scientific support, which is an encouraging signal that the organization
    is still building. But those same signals also imply continued burn and the need to keep the scientific portfolio moving.
    If leadership or funding weakens, the platform becomes much harder to sustain. This makes partner and funding dependency
    a central diligence question even though the public record is sparse. If that happens, the company would need either a
    new financing narrative or a visible scientific breakthrough to avoid a reset.
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR011
  - CR012
  tableRefs:
  - TR003
  figureRefs:
  - FR001
- id: risk-judgment
  title: Risk judgment
  body: 'Altos is a high-upside, high-variance research bet. The right control framework is not a standard enterprise risk
    register but a research milestone register with explicit kill criteria. The business can tolerate a lot of uncertainty
    if the science advances, but it cannot tolerate indefinite ambiguity about translational value. That makes the most important
    risk-monitoring question very simple: are they generating convincing proof fast enough to justify the capital they will
    keep consuming? Investors should therefore monitor evidence production as closely as they monitor cash, governance, and
    hiring.'
  claimRefs:
  - CR002
  - CR007
  - CR008
