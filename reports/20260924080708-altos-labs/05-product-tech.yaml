chapter:
  number: 5
  title: Product & Technology
  summary: Altos Labs is a biology-first research platform with visible hiring signals around computational support, but the
    public record does not yet show a customer-facing product or a formal technical moat.
sections:
- id: product-definition
  title: Product definition and workflow
  body: 'Altos Labs does not present a conventional customer-facing product. The public surface describes a cellular rejuvenation
    research platform whose purpose is to generate biological insight and, eventually, medicines. That means the user workflow
    is internal: scientists work on discovery, model-building, and experimental design rather than selling a standard software
    package. For diligence, the important distinction is that Altos should be judged as a research engine first and as a commercial
    platform only after there is external proof of repeatable translational output. The absence of a packaged product is not
    a flaw by itself, but it does mean the memo should not force software-style assumptions onto the business.'
  claimRefs:
  - CE001
  - CE010
  - CE012
  tableRefs:
  - TE001
  - TE002
- id: architecture
  title: Architecture and operating model
  body: The operating model appears to combine biology, computation, and hiring for specialized scientific roles. The public
    job postings show that machine learning and data capabilities matter, but they are clearly support functions for a biology-first
    system. That architecture implies high dependency on lab work, research leadership, and experimental throughput. It also
    means the main technical question is not software uptime but whether the platform can repeatedly generate useful biological
    signals that justify continued investment. In other words, the technical moat is a function of scientific output, not
    an API surface or product release cadence.
  claimRefs:
  - CE002
  - CE003
  - CE005
  - CE008
  - CE010
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: trust-and-roadmap
  title: Trust, controls, and roadmap
  body: 'The trust and compliance story is different from a software company because Altos is not operating a public digital
    service. There is no visible consumer privacy stack or product security program to audit, which is itself an important
    finding. The bigger risk is roadmap opacity: the company is deliberately preserving optionality across research programs,
    which makes public milestones sparse. That is normal for a moonshot research platform, but it leaves outside investors
    with little hard evidence about technical maturity or product readiness. The right diligence posture is to ask for internal
    controls, stage gates, and publication cadence rather than standard SaaS controls. The lack of a public trust page or
    certification program is itself the signal: controls exist, but the company does not expose them as a product promise.'
  claimRefs:
  - CE004
  - CE006
  - CE007
  - CE009
  - CE011
  tableRefs: []
