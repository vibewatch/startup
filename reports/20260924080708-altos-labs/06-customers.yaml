  summary: Altos Labs is still pre-customer in public evidence, so the chapter focuses on adoption absence, strategic audience
    categories, and the diligence gap around named counterparties.
sections:
- id: customer-definition
  title: Customer definition and segmentation
  body: 'Altos Labs does not yet have a standard customer base. The company is still a research platform, so the most relevant
    external constituencies are investors, scientific collaborators, and potential strategic partners rather than end users.
    That makes customer segmentation unusual: the “buyer” may eventually be a therapeutic partner or a sponsor of research,
    but that is not visible as an operating customer today. The right interpretation is that Altos is pre-customer, not customer-rich.
    For diligence, the absence of a customer segment is a major part of the story, not a missing section to fill with guesses.
    The only defensible public audience categories are scientists, investors, and potential collaborators, which is why customer
    language is mostly premature.'
  claimRefs:
  - CU001
  - CU002
  - CU009
  - CU011
  tableRefs:
  - TU001
  - TU002
- id: adoption
  title: Adoption, proof, and expansion
  body: There is no public evidence of production deployment, repeat usage, or a durable customer cohort. The company’s public
    signal is internal capability build and category signaling, which is useful for future adoption but not adoption itself.
    If the platform ever converts, the first meaningful “customer” evidence is likely to be sponsored research, collaboration,
    or another strategic arrangement. Until then, customer-style metrics such as retention and expansion should stay null.
    That is a weakness for underwriting, but it is also the correct accounting of where the business sits on the commercialization
    curve. That means the operating question is whether the company can ever create a partner-ready proof point, not whether
    it has a retention curve today.
  claimRefs:
  - CU003
  - CU004
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU003
  figureRefs:
  - FU001
- id: customer-judgment
  title: Customer judgment
  body: 'The customer conclusion is simple: Altos is not yet a customer business. The public evidence shows awareness and
    interest, but not paying users, repeat deployments, or retention. That means the diligence focus should shift from customer
    health metrics to partner readiness, scientific credibility, and the conditions under which a future partner would pay
    to accelerate the science. If those conditions never materialize, the customer story remains a thesis rather than a business
    model. A future partner might pay for access or acceleration, but the public evidence does not yet show that willingness-to-pay.'
  claimRefs:
  - CU005
  - CU010
  - CU012
