company:
  name: Altos Labs
chapter:
  number: 8
  title: Valuation
  summary: Altos Labs is best valued as a scientific option with high upside and high variance, so the public evidence supports
    a cautious stance rather than a conventional growth-company multiple.
sections:
- id: thesis
  title: Thesis and anti-thesis
  body: 'Altos Labs is worth considering only as a scientific option on a very large future market. The bullish case is straightforward:
    if the company can keep attracting exceptional talent, generate meaningful biological insight, and eventually translate
    that insight into medicine, the strategic value could be very large. The bearish case is equally straightforward: the
    company may create impressive science but never cross the line into a repeatable commercial product. That makes the investment
    question less about near-term growth and more about whether the probability of eventual proof is rising or falling. The
    public evidence still leans toward caution, not conviction. The memo should therefore explicitly separate scientific conviction
    from commercial conviction and keep the recommendation conservative until one of them hardens.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV010
  - CV011
  tableRefs:
  - TV001
  - TV002
- id: scenarios
  title: Scenarios and valuation stance
  body: In the bull case, Altos would prove that its platform can repeatedly turn biology into candidate therapies or partnerable
    assets, and capital would keep flowing at favorable terms. In the base case, it remains a long-duration research platform
    with persistent private-market interest but little visible commercialization. In the bear case, funding or scientific
    momentum weakens and the option value collapses. On that framing, the best public-evidence stance is cautious or neutral
    rather than aggressive. The company is interesting, but the price should be judged against proof, not against narrative
    intensity. In practice, that means the valuation discussion should center on milestone probability and not on a static
    multiple.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV009
  tableRefs:
  - TV003
  figureRefs:
  - FV001
- id: actionability
  title: Actionability and diligence asks
  body: 'Altos is not exit-ready in the normal sense because it has no public product, no disclosed revenue, and no public
    customer base. That means the actionability question is not whether to buy a mature business but whether to keep underwriting
    a long-duration scientific optionality bet. The final diligence asks are therefore practical: what milestones matter,
    how much capital is required to reach them, and what evidence would force a reassessment. If those answers stay vague,
    the valuation should stay conservative. The first decision gate is evidence production, followed by capital efficiency
    and then exit optionality.'
  claimRefs:
  - CV008
  - CV009
  - CV012
