evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: A current primary-source disclosure of revenue, operating runway, or customer economics.
    whyItMatters: Without it, the company cannot be scored as a normal commercial biotech with observable traction.
    diligencePath: >-
      Track future press releases, investor materials, and any regulatory filings that disclose revenue or customer
      activity.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: minor
    topic: TO002-leadership-map
    missingEvidence: A full public leadership roster including all PIs and functional leaders tied to Altos Labs.
    whyItMatters: The public list is only a partial map of the company's real scientific bench and key-person risk.
    diligencePath: Review future company pages, conference speakers, and author lists for the current PI roster.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: TO003-stakeholder-map
    missingEvidence: A cap table or investor ownership summary with actual percentages and economic rights.
    whyItMatters: The stakeholder map is only directional without ownership and control details.
    diligencePath: Seek investor filings, secondary-market documents, or company disclosures that reveal ownership concentration.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: market-size
    missingEvidence: A credible 2026 market-size estimate with explicit category boundaries for cellular rejuvenation.
    whyItMatters: The market boundary is still fuzzy, so any TAM/SAM/SOM estimate remains heuristic.
    diligencePath: Use analyst reports or industry surveys that explicitly separate rejuvenation biology from adjacent biotech spend.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: Comparable pricing or contract data for longevity-platform competitors.
    whyItMatters: Competition is more about scientific proof than price today.
    diligencePath: Review partner agreements and any disclosed sponsored-research economics.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: major
    topic: cash runway
    missingEvidence: A current balance sheet or verified cash-and-burn disclosure.
    whyItMatters: Runway is the key financial risk for a long-duration research platform.
    diligencePath: Request a current management update or audited financial statement.
    relatedQuestionRefs:
      - QI002
      - QI008
  - type: missing-source
    severity: minor
    topic: formal-compliance
    missingEvidence: A public trust/security/compliance page or certification relevant to a non-software research organization.
    whyItMatters: Compliance and quality controls are part of product credibility, even for research platforms.
    diligencePath: Request internal quality and compliance documentation.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: major
    topic: named customers
    missingEvidence: A named customer, sponsored-research partner, or production user with public proof.
    whyItMatters: Without a named counterparty, customer adoption cannot be validated.
    diligencePath: Ask management for partner disclosures or contract references.
    relatedQuestionRefs:
      - QU001
      - QU002
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: major
    topic: legal regulatory
    missingEvidence: A formal legal or regulatory filing that shows any current proceeding or confirms the absence of one.
    whyItMatters: Legal and regulatory risk is still largely inferred from category context.
    diligencePath: Request counsel memo and regulatory roadmap.
    relatedQuestionRefs:
      - QR001
      - QR006
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: minor
    topic: valuation comps
    missingEvidence: A disclosed pricing mark or transaction comparable for Altos Labs itself.
    whyItMatters: Without a direct mark, valuation must remain probabilistic and qualitative.
    diligencePath: Request the latest internal valuation memo or financing summary.
    relatedQuestionRefs:
      - QV003
      - QV005
      - QV007
