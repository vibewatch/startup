      - number: '2.2'
        title: 同业群体与资本定位
        blocks:
          - type: paragraph
            body: >-
              同业包括 Retro Biosciences、Life Biosciences、Tune Therapeutics、Calico、Tenaya Therapeutics 和 Orca Bio
              等长寿及再生生物学公司。Altos
              的差异不在先发，而在资金和人才都远超同行。老股交易信息和分析师文章让公司持续曝光，有助于招聘和市场发声，却也在临床证据出现前抬高预期。它既是参赛者，也是行业标尺，利弊并存：既能吸引人才，也招来持续质疑。
