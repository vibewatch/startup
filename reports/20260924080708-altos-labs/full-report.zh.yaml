      - number: '4.3'
        title: 财务研判
        blocks:
          - type: paragraph
            body: >-
              投资判断应把 Altos
              当作押注科学验证的期权，而不是收入倍数故事。它的估值比传统成长指标更受里程碑成功概率、资本效率和证据质量影响。公开收入、烧钱速度和现金跑道都无数据；在公司或可靠申报文件披露前，模型应明确保留
              null。早期科研平台可以接受这种做法，但备忘录必须严守不确定性边界；若是已有销售额披露的运营公司，这些空缺就不可接受。
            claimRefs:
