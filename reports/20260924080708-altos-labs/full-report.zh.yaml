      - number: '3.3'
        title: 竞争研判
        blocks:
          - type: paragraph
            body: >-
              行业格局趋于常态前，Altos
              能否把品牌和资金转成扎实的科学证据？若能，公司可能成为赛道的核心平台；若不能，优势或会缩成融资故事和校友网络。眼下最值得看的不是产品矩阵，而是科研验证速度、组织质量，以及其他资金或学术项目是否在追近。Altos
              声量很大，竞争胜负仍未定。尽调应盯住拿出证据需要多久，而不是头条估值。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业变现
        blocks:
          - type: paragraph
            body: >-
              Altos Labs
              并不像有公开收入来源的传统运营公司。公开证据显示，它主要靠庞大的私募资金支持研发。变现问题不在于当前销售额，而在于未来能否把科学发现转化为许可收入、合作收入或疗法价值。目前没有可供分析的当期收入桥接路径，财务模型应明确保留
              null，不拿代理指标补空。出现具体商业化路径后，备忘录再重点分析未来经济性。
