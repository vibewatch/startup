              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV010
      - number: '8.2'
        title: 情景推演与估值立场
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，Altos
              证明平台能反复把生物学发现转成候选疗法或可合作资产，且能以有利条件持续融资。基准情景下，公司仍是长周期科研平台，私募市场关注度不减，但商业化进展有限。悲观情景下，资金或科研势头减弱，期权价值随之缩水。基于公开证据，当前更适合审慎或中性，而非激进看多。估值应看证据，不看叙事声量；讨论重点应放在里程碑成功概率，而不是套用静态倍数。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV011
      - number: '8.3'
        title: 可操作性与尽调问询
        blocks:
          - type: paragraph
            body: >-
              Altos
              没有公开产品、收入或客户群体，因此还谈不上通常意义上的退出准备。要判断的不是是否买入一家成熟公司，而是是否继续押注这项长周期科学期权。尽调要问得具体：哪些里程碑最重要？达到它们需要多少资金？什么证据会触发重新评估？如果答案仍然模糊，估值就应保持保守。决策先看证据产出，再看资金效率，最后才看退出选择权。
            claimRefs:
              - CV008
              - CV009
              - CV012
