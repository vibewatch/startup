      - number: '3.2'
        title: 差异化与护城河
        blocks:
          - type: paragraph
            body: >-
              Altos
              的差异化主要来自宏大抱负、充足资金和招揽顶尖科学家的能力，这些条件共同支撑起平台型运营模式。招聘信息显示，公司在搭建覆盖面广的组织，而非只做单一产品，意在打造长期科研引擎。问题是，基础科学成果仍公开可见、赛道资金充足，最终目标也尚未证实，这类护城河很难守住。人才和资本或能带来短期优势，但还没有产品驱动型壁垒那样持久。公司必须更快拿出证据，赶在市场把这套叙事复制到失去差异化之前建立真正优势。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
