      - number: '5.3'
        title: 信任、控制与技术路线图
        blocks:
          - type: paragraph
            body: >-
              与软件公司不同，Altos
              并不运营公开数字服务，其信任与合规机制遵循全然不同的逻辑。由于不存在可供审查的用户隐私架构或产品安全体系，这一缺失本身即是重要发现。更显著的风险在于路线图的不透明：公司有意在各研发项目间保留战略弹性，导致公开里程碑屈指可数。登月型科研平台固然常有此类情形，但客观上导致外部投资人缺乏关于技术成熟度或产品就绪状态的过硬证据。合适的尽调姿态应聚焦内部质控、分期评审节点与论文发表节奏，而非套用标准
              SaaS 管控标准。缺少公开信任页面或合规认证本身就是一种信号：内控体系固然存在，但公司并未将其包装为对外产品承诺。
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE011
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户界定与细分群体
        blocks:
          - type: paragraph
            body: >-
              Altos Labs 还没有常规客户。公司仍是科研平台，最相关的外部群体是投资者、科研合作者和潜在战略伙伴，而非终端用户。未来的“买方”或许是疗法合作方或科研资助方，但目前看不到实际运营客户。Altos
              还处在客户出现之前，而不是客户充足的阶段。没有客户细分本身就是重要事实，不该靠猜测填补。现有公开证据只支持把科学家、投资者和潜在合作者列为受众；现在谈客户还为时过早。
            claimRefs:
