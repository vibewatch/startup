  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险全貌与严重程度
        blocks:
          - type: paragraph
            body: >-
              即使放在生物技术行业，Altos
              的风险结构也很特别。最大的风险不是某一宗法律事件或商品价格周期，而是在资本耐心耗尽前，底层科学能否转化为人类获益。监管路径不明、科学不确定性和验证风险因此居于首位。公开记录没有显示执法或事故驱动的风险，这固然是好事，但未披露问题反映的是可见度不足，不能当作低风险的证据。风险评级应看业务对核心假设的依赖，而不是历史事件数量。赛道仍早，真正的风险是长期拿不出足够证据来支撑后续融资。
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR010
