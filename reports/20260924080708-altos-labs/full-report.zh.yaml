            body: >-
              公开信息没有显示 Altos
              已实现生产部署、重复使用或形成稳定客户群。公司目前对外展示的是内部能力建设和赛道影响力；这有助于未来获客，却不等于已经被客户采用。若平台未来实现转化，最早能证明客户关系的可能是受资助研究、合作开发或其他战略安排。在此之前，留存率、客户扩张等指标都应保留为
              null。这限制了投资判断，也如实反映公司所处的商业化阶段。当前要问的是能否拿出足以打动合作伙伴的成果，而不是它是否已有留存曲线。
