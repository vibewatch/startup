      - number: '4.2'
        title: 资本结构与资金跑道
        blocks:
          - type: paragraph
            body: >-
              Altos
              对外叙事主要讲启动融资，私募市场曝光也一直是重点，因此资金是否充足是首要财务问题。经营现金流和现金跑道都未披露，关键在于公司能否撑过漫长实验周期，而不被迫过早转向。招聘动向显示公司继续投入人才和基础设施，很可能意味着烧钱仍在持续，但月度消耗额不公开。财务判断应看情景：烧钱速度高、现金跑道不明，后续融资则依赖研发里程碑。相比经营杠杆，更应关注资本选择权和里程碑纪律。
