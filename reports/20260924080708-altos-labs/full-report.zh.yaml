      - number: '1.3'
        title: 当前研判与未决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Altos 最近的公开动向不是推出产品，而是扩展平台：公司新增 Institute of Computation，并继续把自己定位为长周期研发引擎。投资者仍应按平台型故事理解
              Altos，而非把它当作商业化公司。关键问题是，这个平台能否及时产出有差异化的候选疗法，对得起已投入的巨额资本和高涨的市场热度。眼下，它作为科学命题比作为运营业务更令人期待。没有公开产品、收入线或客户名单，不是小缺项，而是判断商业价值的核心尽调缺口。现阶段，Altos
              仍是一家资金雄厚、叙事吸引力强的科研平台，外部看不到经营杠杆；这一点尤其需要谨慎看待。
