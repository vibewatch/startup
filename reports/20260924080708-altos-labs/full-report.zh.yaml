chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位与使命
        blocks:
          - type: paragraph
            body: >-
              Altos Labs
              更适合被看作一家以科研为先的生物技术平台。公司反复强调的主线很清楚：借助细胞年轻化编程恢复细胞健康与韧性，再把相关生物学发现转化为药物。它走的是长周期科研路线，而非传统产品公司的路子。公开信息先呈现的是雄心、资金和科学声望，收入与客户指标仍在其后；理解全篇，应从这个落差出发。
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO012
      - number: '1.2'
        title: 业务布局、领导团队与体量规模
        blocks:
          - type: paragraph
            body: >-
              Altos 在多个研究中心开展业务。启动公告和招聘页面显示，其布局覆盖 Bay Area、San Diego、Cambridge 和 Japan，公司仍在这些地点招聘。Hal Barron、Hans Bishop
              与 Richard Klausner 等知名高管构成领导层。第三方估算员工达数百人；对一家研发密集型私营生物技术公司而言，这个规模不小，也说明它已不是小型实验室衍生项目。
