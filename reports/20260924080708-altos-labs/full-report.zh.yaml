              - CR010
      - number: '7.2'
        title: 依赖性与执行风险
        blocks:
          - type: paragraph
            body: >-
              Altos
              依赖私募资本、科学领导力和漫长的实验周期。招聘页面显示，公司仍在投入实验室信息系统和科研支持岗位，说明组织还在扩建；但这也意味着持续烧钱，并须不断推进科研项目。领导力或资金一旦减弱，平台就更难维持。即使公开信息有限，合作伙伴和资金依赖仍是尽调重点。若势头受挫，公司需要讲出新的融资逻辑，或拿出看得见的科学突破，才能避免业务重置。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR011
              - CR012
