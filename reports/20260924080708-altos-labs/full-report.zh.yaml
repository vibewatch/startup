  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与业务流程
        blocks:
          - type: paragraph
            body: >-
              Altos Labs 没有面向客户的传统产品。公开信息将它描述为细胞年轻化研究平台，旨在产出生物学洞见，并最终转化为药物。工作主要在公司内部开展：科学家负责发现、建模和实验设计，而不是销售标准软件。尽调时应先把
              Altos 当作科研引擎；只有外界看到可重复的转化成果，才谈得上商业平台。没有打包产品本身不是缺陷，但不能因此套用软件公司的假设。
            claimRefs:
