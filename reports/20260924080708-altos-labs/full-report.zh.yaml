              - CR012
      - number: '7.3'
        title: 风险研判
        blocks:
          - type: paragraph
            body: >-
              Altos
              是一笔上行空间大、结果波动也大的科研押注。适合它的不是传统企业风险清单，而是列明终止条件的科研里程碑台账。如果科研持续推进，业务可以承受较高不确定性；但转化价值不能一直说不清。风险监控的核心问题是：公司能否足够快地拿出可信证据，支撑不断消耗的资本？投资者应像盯现金、治理和招聘一样，紧盯证据产出。
            claimRefs:
              - CR002
              - CR007
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              Altos Labs
              只有作为押注未来大市场的科学期权才值得考虑。乐观情景是，公司持续吸引顶尖人才、产出重要生物学发现，并最终将其转化为药物，由此获得很高的战略价值。悲观情景是，科学成果虽亮眼，却始终无法变成可重复的商业产品。投资判断的关键不是短期增长，而是最终验证的概率在上升还是下降。现有公开证据仍支持审慎，而非确信。备忘录应把科学信心与商业信心分开，在其中一方变得更确定前维持保守建议。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
