      - number: '2.3'
        title: 市场研判
        blocks:
          - type: paragraph
            body: >-
              Altos Labs
              所在的赛道真实存在，但仍高度投机。若部分重编程技术能在人体中奏效，市场回报可能很大；反过来，这个领域也可能不断产出有意思的生物学发现，却迟迟无法推出近期可用的疗法。因此，投资者应以科研为重、保持审慎，而不是套用高成长公司的逻辑。Altos
              受关注，是因为它代表这个赛道，并不意味着行业已跨过商业化门槛。投资测算应假设研发周期很长，商业化结果呈二元分化。
            claimRefs:
              - CM003
              - CM005
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 同业格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              Altos 所处的同业圈规模很小，讨论却很热。最直接的同行是 Retro Biosciences 等长寿与细胞年轻化平台，Calico
              的相关性稍弱。替代选项更广：高校实验室、药企内部研发，以及等待下一次科学突破，也都在争夺关注和资本。真正要比的，不是功能是否相同，而是类似科学设想能否推进得更快、证据更硬、资金用得更省。这个领域看重信号，学术声望和人才密度几乎不亚于已发表成果。商业标尺尚不清晰，Altos
              仍得持续吸引关注。
            claimRefs:
