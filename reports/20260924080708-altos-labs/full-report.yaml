            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO009
              - CO010
      - number: '1.3'
        title: Current read and open gap
        blocks:
          - type: paragraph
            body: >-
              The newest public signal is not a product launch but a platform expansion: Altos added an Institute of
              Computation and continued to frame itself as a long-horizon research engine. That means the right
              interpretation for investors is still a platform story, not a commercial commercialization story. The main
              unresolved question is whether that platform will surface differentiated therapeutic candidates quickly
              enough to justify the capital and hype already attached to it. Until then, the company remains more
              exciting as a scientific thesis than as an operating business. The absence of a public product, revenue
              line, or disclosed customer list is not a small omission; it is the central diligence gap for any
              commercial judgment. For now, the company should still be read as a well-capitalized scientific platform
              with promising narrative density, not as a business whose operating leverage is visible from outside. That
              caution is especially important now.
            claimRefs:
              - CO007
              - CO009
              - CO010
              - CO011
