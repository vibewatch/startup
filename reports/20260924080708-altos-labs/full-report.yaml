chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and mission
        blocks:
          - type: paragraph
            body: >-
              Altos Labs is best understood as a research-first biotech platform. The company's own language is
              unusually consistent: restore cell health and resilience through cell rejuvenation programming, then
              translate the biology into medicines. That framing matters because it puts Altos closer to a long-horizon
              scientific organization than to a conventional product company. The public record still shows ambition,
              capital, and scientific prestige ahead of revenue or customer metrics, and that is the right lens for the
              rest of the report.
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO012
      - number: '1.2'
        title: Footprint, leadership, and scale
        blocks:
          - type: paragraph
            body: >-
              Operationally, Altos spans several research hubs. The launch announcement and careers page point to the
              Bay Area, San Diego, Cambridge, and Japan, and the company continues to recruit for those sites. Public
              leadership is also unusually high-profile, with Hal Barron, Hans Bishop, and Richard Klausner anchoring
              the executive story. Third-party headcount estimates place the company in the hundreds, which is large for
              a private research-intensive biotech and reinforces that this is not a small lab spinout.
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO006
