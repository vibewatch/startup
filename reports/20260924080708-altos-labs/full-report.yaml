      role: Co-founder / executive leadership
      background: Former CEO of GRAIL and senior biotech operator.
    - name: Anabey Camarena
      role: Co-founder
      background: Biotech operator associated with Altos launch coverage.
    - name: Rick Klauser
      role: Co-founder
      background: Biotech and life-sciences executive with startup leadership experience.
  foundingLocation: United States
  headquarters: Redwood City, California, United States
