company:
  name: Altos Labs
chapter:
  number: 4
  title: Financials
  summary: Altos Labs appears to be funded like a research platform, not a revenue company, so the financial analysis centers
    on capital dependence, runway uncertainty, and valuation optionality.
sections:
- id: revenue-model
  title: Revenue model and monetization
  body: Altos Labs does not behave like a conventional operating company with a public revenue stream. The public evidence
    points instead to a research platform funded by a very large private capital base. That means the monetization question
    is less about current sales and more about whether the company can eventually convert scientific discovery into licensing,
    partnerships, or therapeutic value. For diligence, the key point is that there is no clean current revenue bridge to analyze,
    so any financial model should explicitly show nulls rather than invented proxy metrics. The memo should therefore emphasize
    future economics only after a concrete commercialization path appears.
  claimRefs:
  - CI001
  - CI003
  - CI010
  tableRefs:
  - TI001
  - TI002
- id: capital-structure
  title: Capital structure and runway
  body: 'The company’s public story is dominated by its launch funding and by ongoing private-market visibility. That makes
    capital adequacy the central financial issue. Without disclosed operating cash flow or runway, the right question is whether
    the company can sustain a long experimental cycle without forcing a premature pivot. Hiring signals suggest continued
    investment in talent and infrastructure, which likely means continued burn, but the exact monthly rate is not public.
    The financial lens is therefore scenario-based: high burn, long runway uncertainty, and milestone-driven follow-on dependence.
    In diligence terms, this makes capital optionality and milestone discipline more important than operating leverage.'
  claimRefs:
  - CI002
  - CI004
  - CI007
  - CI009
  tableRefs:
  - TI003
  figureRefs:
  - FI001
- id: financial-judgment
  title: Financial judgment
  body: 'Altos should be underwritten as an option on scientific proof, not as a revenue multiple story. That makes the valuation
    more sensitive to milestone probability, capital efficiency, and evidence quality than to traditional growth metrics.
    The main diligence gaps are straightforward: public revenue, public burn, and public runway are all unavailable, so they
    should remain explicitly null until the company or a reliable filing source provides them. In practice, that is acceptable
    for an early research platform, but it means the memo must be disciplined about uncertainty. That is an acceptable posture
    for an early research platform, but not for an operating business with disclosed sales.'
  claimRefs:
  - CI005
  - CI006
  - CI008
  - CI011
  - CI012
