company:
  name: M-KOPA
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence supports a late-stage fintech with real scale, improving profitability, and unusually sophisticated receivables financing for an African private company. The strongest reported data point is TechCabal’s reading of 2024 UK filings: roughly $416 million of revenue and a first annual profit of about $9.2 million. The main financial question is less whether demand exists and more whether M-KOPA can keep funding a capital-intensive receivables machine at attractive enough terms while governance and secondary-liquidity disputes remain unresolved.'
sections:
- id: revenue-monetization
  title: Revenue Scale and Monetization Logic
  body: |
    M-KOPA’s monetization engine is visible in structure even when private-company disclosure is incomplete. The company finances devices and productive assets, collects daily or periodic repayments, and then layers additional financial and protection products around that installed base. That creates at least three monetization rails: margin on financed assets, recurring repayment-linked economics, and revenue from adjacent services such as loans, insurance, data, and device protection.

    Public disclosures do not provide a full segment P&L, but the scale signal is increasingly credible. M-KOPA’s own 2026 commentary says revenue grew more than 65% in 2024 and that growth remained profitable through 2025 and into 2026. A separate company narrative framed the business at about $400 million of ARR. TechCabal then added a stronger but media-mediated data point: KES 53.7 billion of 2024 revenue, or roughly $416 million, based on UK filings.

    This combination suggests a business that has crossed from “high growth with uncertain scale” into “large enough that funding structure and margin quality matter more than top-line proof.”
  claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
  tableRefs: [TI001, TI002]
  figureRefs: [FI001]
- id: unit-economics-collections
  title: Unit Economics, Credit Design, and Collections Logic
  body: |
    M-KOPA’s public financial logic depends on cash-flow matching more than on conventional unsecured lending. Customers pay a deposit, receive the device immediately, and then repay in small fixed installments that fit irregular income cycles. This matters because the company is not relying solely on court-based recovery or floating-rate consumer credit to protect returns; the financed asset itself can be restricted or unlocked based on repayment status.

    Public reporting from Nigeria sharpens that logic. Condia describes M-KOPA’s model as cost-based rather than interest-led, with fixed total repayment and embedded device enforcement rather than repossession through the courts. It also reports management commentary that Nigerian loss rates are single digit and the market has the strongest repayment performance across M-KOPA’s geographies. These are not audited unit-economics disclosures, but they point toward why institutional receivables finance has remained available.

    The main disclosure gap is that public materials still do not provide vintage curves, charge-offs, net interest-equivalent margins, funding cost by warehouse, or loss-adjusted contribution by product cohort.
  claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014]
  tableRefs: [TI003]
  figureRefs: [FI002]
- id: capital-stack
  title: Capital Stack, Debt Facilities, and Balance-Sheet Support
  body: |
    M-KOPA’s capital structure is a core competitive asset. The 2023 financing package combined strategic equity from Sumitomo with a large debt facility led by Standard Bank, while IFC and DFC separately disclosed meaningful support tied to receivables growth and sustainability-linked targets. BII’s historical investment page adds a longer-dated DFI lineage, showing that M-KOPA has attracted both impact and commercially minded capital over multiple stages.

    This matters because the business is inherently capital intensive. Devices are delivered upfront while cash comes back over time, so scale requires both underwriting discipline and reliable refinancing. The existence of multi-year facilities, sustainability-linked structures, local-currency components, and DFI participation implies that outside financiers view M-KOPA as more than a consumer-gadget reseller.

    The risk is that capital-market access can tighten precisely when governance becomes noisier. ImpactAlpha’s 2025 Series F reporting and the related employee-share dispute suggest that future capital may become more expensive or more conditional if investors demand cleaner cap-table and governance visibility.
  claimRefs: [CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI022]
  tableRefs: [TI004]
  figureRefs: [FI003, FI004]
- id: public-financial-gaps
  title: Public Financial Gaps and Reliability of the Evidence
  body: |
    The financial evidence is meaningful but uneven. The strongest current metrics come from a mix of official company growth disclosures, DFI and partner financing announcements, Companies House records, and reputable third-party reporting. That is enough to support a serious late-stage scale story. It is not enough to support a fully rigorous underwriting model for equity investors or private-credit providers without management materials.

    Missing items include a clean audited consolidated P&L published by the company, gross margin by product line, country-level profitability, receivables aging, warehouse-level advance rates, and a precise reconciliation from ARR rhetoric to recognized revenue. Public accounts and filing history prove activity, but they do not disclose the operating detail required to fully separate device margin, credit income, service income, and loss experience.

    The overall financial conclusion is therefore favorable but not fully transparent: M-KOPA looks real, large, and probably sustainably fundable, yet it remains a private company whose best numbers are still surfaced indirectly.
  claimRefs: [CI023, CI024, CI025, CI026, CI027, CI028, CI029, CI030]
  tableRefs: [TI005]
