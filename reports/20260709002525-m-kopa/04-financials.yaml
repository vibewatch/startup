- id: TI002
  title: Pricing / monetization table
  columns:
  - Pricing element
  - Public anchor
  - What it implies
  - Limitation
  rows:
  - - Daily instalments
    - PAYG / daily digital micropayments framing
    - Product is designed for irregular daily-income cycles
    - Exact APR-equivalent and take-rate are not disclosed
  - - Fixed total repayment
    - Condia says total repayment is fixed at origination in Nigeria
    - Protects customer from floating-rate drift and aids predictability
    - Single-country evidence, not full global pricing disclosure
  - - 3-12 month device schedules in substitutes
    - MTN EasyBuy tenure disclosure
    - Market alternative is clearly installment-led rather than cash purchase
    - Not a direct M-KOPA pricing disclosure
  - - Insurance / bundle attachment
    - More than a Phone positioning
    - Value capture likely extends beyond base handset margin
    - Bundle economics and attach rates are undisclosed
  notes: Public pricing evidence is strongest on repayment format and weakest on true retained economics.
