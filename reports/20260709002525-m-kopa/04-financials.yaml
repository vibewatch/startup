callouts:
- calloutType: strength
  title: Institutional debt is part of the moat
  body: M-KOPA’s capital stack is not incidental. The ability to raise warehouse-style debt and DFI-backed facilities is itself a competitive advantage in a receivables-heavy business.
  claimRefs: [CI015, CI016, CI017, CI018, CI019]
- calloutType: strength
  title: Scale now looks real enough that margins matter
  body: The debate is no longer whether M-KOPA found demand. Reported revenue and profit signals imply the next diligence phase should focus on margin quality, funding cost, and portfolio performance.
  claimRefs: [CI003, CI004, CI005, CI006]
- calloutType: risk
  title: Governance can raise the cost of capital
  body: The 2025 Series F controversy and employee-share dispute matter financially because they can affect secondary liquidity, investor confidence, and the terms of future financing.
  claimRefs: [CI020, CI021, CI022, CI030]
- calloutType: risk
  title: Public financial disclosure is still one layer too thin
  body: Even with credible scale evidence, investors still lack a clean public bridge for margins, portfolio losses, and country-level profitability.
  claimRefs: [CI026, CI027, CI028, CI029]
