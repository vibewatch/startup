  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 当前观点依据
      - 何种情况会改变观点
    rows:
      - - 建议
        - 继续研究
        - 公开证据能证明这是一门真实的大规模生意，但还撑不起高于中低段独角兽区间的高置信定价。
        - 补齐贷方级资产组合数据、最终 Series F 经济条款和更清晰的治理披露。
      - - 置信度
        - 中
        - 收入和盈利锚点有分量，但股权结构和损失率图景仍不完整。
        - 经审计或达到贷方级别的 2025 年财务与资产组合披露。
      - - 风险评级
        - 高
        - 主要风险是在披露不完整时，为一个运营复杂、未上市、应收账款重的模式付出过高价格。
        - 更清晰地看见损失、稀释和法律悬而未决事项。
      - - 估值立场
        - 接近 $1.3B–$1.7B 属合理；高于 $2.0B 偏吃紧
        - 按最强公开收入锚点给 3x–4x 倍数可以支撑；更高溢价需要更多证据。
        - 2025 年收入更强、损失较低、治理结果干净的证据。
      - - 决策含义
        - 不要仅凭当前公开证据承销激进溢价
        - 业务可信，但价格纪律比品牌叙事更重要。
        - 入场价格更公允，或披露质量改善后，再更积极推进。
    notes: 判断明确对价格敏感，并把公司质量与当前公开证据能否支撑特定估值分开。
    claimRefs:
      - CV001
      - CV003
      - CV010
      - CV028
      - CV030
      - CV033
      - CV039
  - id: TV002
    title: 正反论点表
    columns:
      - 主题
      - 看多论点
      - 反向论点
      - 改变判断的条件
    rows:
      - - 规模与增长
        - 据报道，M-KOPA 2024 年收入达 $416M，公司仍在传递盈利增长信息，已具备后期公司规模。
        - 最硬的财务锚点仍来自媒体转述，而非招股书级发行人披露。
        - 直接提供经审计的 2025 年财务数据。
      - - 资本结构
        - 机构债务和战略投资者表明，第三方对其应收账款模式有信心。
        - 依赖融资意味着，一旦资产组合或治理出现坏消息，市场会快速重定价这门生意。
        - 仓储融资契约和损失率披露。
      - - 独角兽合理性
        - 低个位数收入倍数就足以把 M-KOPA 推到 $1B 以上。
        - 同一套测算并不能自动支撑数十亿美元级溢价。
        - 2025 年收入和利润清晰上台阶，且损失稳定。
      - - 治理
        - 公开反驳和后续融资说明，诉讼目前并非生死问题。
        - 纠纷仍带来证据开示、声誉和股权结构不确定性。
        - 诉讼解决或风险下降，Series F 后股权结构透明。
      - - 可比公司
        - 高增长金融科技可比公司说明，投资者会为高质量增长支付高倍数。
        - 但 M-KOPA 是未上市、新兴市场、应收账款重的业务，相比更干净的上市金融科技模式应打折。
        - 证明损失率、资金管理和治理比市场担心的更干净。
    notes: 表格把公司质量与估值支撑分开，也标出 M-KOPA 相比更干净上市金融科技公司应折价的地方。
    claimRefs:
      - CV004
      - CV005
      - CV011
      - CV018
      - CV019
      - CV025
      - CV032
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（USD bn）
      - 概率信号
      - 必须成立的条件
    rows:
      - - 牛市
        - 2025 年收入较 2024 年基数显著放大，盈利能力守住，损失受控，治理悬念淡化。
        - 2.1–2.5
        - 20–25%
        - 管理层必须证明增长强劲、股权结构干净，资产组合质量达到贷方级。
      - - 基准
        - 2024 年锚点大体能代表基本面，增长延续，但未上市公司和运营风险折价仍适用。
        - 1.3–1.7
        - 50–60%
        - 公司需要保持盈利和融资能力，且不出现重大法律或资产组合意外。
      - - 熊市
        - 融资成本上升、诉讼恶化，或披露的损失与稀释数据削弱信心。
        - 1.0–1.2
        - 20–30%
        - 要么披露令人失望，要么市场施加更强的未上市公司 / 新兴市场 / 应收账款折价。
    notes: 区间刻意放宽，因为公开记录更适合划边界，而不是给出精确点位。
    claimRefs:
      - CV010
      - CV014
      - CV015
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - PayPal
        - 2025 年收入 $33.17B；2026 年 7 月市值 $39.28B
        - ~1.2x 收入
        - 大型成熟金融科技 / 支付平台，展示成熟上市公司低端倍数
        - 比 M-KOPA 更干净、增长更慢、模式更成熟。
      - - SoFi
        - 2025 年收入 $3.61B；2026 年 7 月市值 $22.74B
        - ~6.3x 收入
        - 带信贷属性的消费金融平台，兼具增长和融资复杂度
        - 美国披露质量和产品组合比 M-KOPA 干净得多。
      - - Affirm
        - 2025 年收入 $3.71B；2026 年 7 月市值 $27.22B
        - ~7.3x 收入
        - 消费金融和 BNPL 可比公司，增长强、承销敏感度高
        - 美国上市 BNPL 仍比 M-KOPA 更容易分析和再融资。
      - - Adyen
        - 2025 年收入 $3.10B；2026 年 7 月市值 $29.89B
        - ~9.6x 收入
        - 高质量金融科技的溢价倍数，显示公开市场愿意给到的上限
        - Adyen 是比 M-KOPA 干净得多的支付和类软件业务。
    notes: 倍数按 CompaniesMarketCap 2026 年 7 月市值页面及同源 2025 年收入页面计算；它们定义估值走廊，不是 M-KOPA 的直接定价。
