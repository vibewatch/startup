  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与客户公平风险
        blocks:
          - type: paragraph
            body: >-
              M-KOPA
              的法律和监管风险，重点不在是否缺少经营许可，而在客户待遇、数据处理和股东权利受到挑战时，模式会如何运转。公司的隐私材料显示数据足迹很广：购买和支付数据、设备标识符、公开可得信息、合作伙伴提供的信息、跨境处理，以及与集团公司、服务提供商、征信机构、催收方和有关机关共享。这个范围对承保和催收可以理解，但也抬高了同意质量、披露和逐国合规纪律的门槛。


              最显眼的法律悬而未决事项是肯尼亚员工股份诉讼。法院材料、Business & Human Rights 报道和 TechCabal 报道都指向一项仍在进行的争议：当地非洲员工是否因 Growth Shares
              的创设以及后续资本重组步骤而受到不利对待。M-KOPA
              公开否认指控，并把案件称为错误信息或放错司法辖区的挑战；但即使公司最终胜诉，诉讼本身也很重要。在后期资本和二级流动性看起来具有战略重要性的时点，诉讼会带来证据开示、声誉和融资流程风险。


              客户公平风险有双向性。肯尼亚影响力材料和公司 FAQ
              主张，设备锁定与无隐藏费用、无逾期罚金、退还产品即可退押金配套。这些缓释有意义。但如果特定市场的监管者、法院或消费者倡导者认为设备限制、催收或征信共享做法过于激进，这些设计并不能消除反对风险。
