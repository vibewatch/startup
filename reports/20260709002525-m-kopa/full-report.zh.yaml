      - number: '8.2'
        title: 当前财务基础能支撑什么
        blocks:
          - type: paragraph
            body: >-
              财务问题不在 M-KOPA 是否配得上规模公司标签，而在这个规模能合理拿到什么倍数。一个拥有 $416 million 收入、正利润、多国增长和强融资关系的 fintech，不是困境资产。但 M-KOPA
              也不是干净的软件公司或纯支付平台。它是一个应收账款重、运营强度高的新兴市场融资业务，模式里叠着设备供应、催收、司库和治理复杂度。即便增长亮眼，它也应相对更干净的上市 fintech 标的打折。


              因此，用简单收入倍数框架比围绕 DCF 做伪精确更站得住。按 2024 年收入约 2.5x 计算，股权价值约 $1.0 billion；3.5x 约 $1.46 billion；5.0x 约 $2.08
              billion；6.0x 的拉伸情形约 $2.5 billion。这些数字表明，公开记录可以支撑可信的独角兽结果，但若没有更好的损失率、营运资本强度和 Series F 后稀释披露，无法舒服支撑无限溢价。
