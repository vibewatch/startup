      - number: '7.3'
        title: 资本、融资与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              M-KOPA 的模式在结构上依赖可靠外部资本，因为设备和贷款需要先行出资，还款则随时间回流。Standard Bank、IFC、DFC 和公司自身的公开材料都支持一个判断：M-KOPA
              已在该地区搭出异常强的资本栈。这是一道护城河，也是一种依赖。如果应收账款表现走弱、诉讼升级，或仓储融资提供方重定价风险，增长、定价和审批率会很快承压。


              最强的缓释信号是支持方的深度和多样性。Standard Bank 安排了一项多币种融资，明确帮助 M-KOPA 管理跨市场融资和外汇需求。DFC 的公开信息材料描述，在肯尼亚有最高 $210 million
              的融资智能手机、太阳能和现金贷款应收账款；IFC 披露则指向可持续挂钩条件和行动计划监测。这些不是来打卡的投资者；它们在意抵押品表现和运营纪律。


              但合作伙伴和资金集中度仍真实存在。M-KOPA 依赖 OEM 和渠道伙伴、各国监管者、征信和催收基础设施，以及大型仓储式资金方。模式越成功，任何一个薄弱环节——资金成本、股权类别争议、手机供应，或电信 /
              渠道冲突——越可能传导为放款放缓或利润率下降。
