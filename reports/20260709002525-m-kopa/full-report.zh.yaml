  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与核心待办任务
        blocks:
          - type: paragraph
            body: >
              M-KOPA
              的公开材料反复把目标客户界定为「日常谋生者」：收入不稳定、正规信用画像薄，又非常需要能帮自己赚钱和办事的数字工具。这个分层比「大众市场」或「无银行账户人群」更具体，也更有用，因为它直接贴着产品的还款设计。客户往往不是为了买一部彰显身份的智能手机，而是想打开工作、支付、储蓄、沟通或抗风险能力。


              公开分层证据指向几个高价值用户群：首次拥有智能手机的人、微型创业者和商贩、开始接入正规金融或保险的女性、农村或城郊家庭，以及那些必须先拥有生产性资产、才有资格使用更广泛金融产品的客户。这些客户想完成的事，在各国影响力报告和客户故事中保持一致。


              重要之处在于，分层纪律本身就是承保纪律的一部分。手机如果关系到客户的日常收入、供应商协调或家庭韧性，客户行为大概率不同于购买可选设备的人。M-KOPA 的公开客户语言反复表明，公司理解这个差别，并围绕它设计旅程。
