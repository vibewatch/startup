              550,000、南非超过 105,000。尼日利亚尤其重要，因为 M-KOPA 称该市场是公司历史上最快达到 100 万客户的市场。


              这些数字不只是虚荣指标，也证明模式可复制。M-KOPA 不再只是肯尼亚故事。多个市场的采用轨迹支撑这样一个论点：融资智能手机接入加服务，可以走出公司最初的太阳能和东非根基。


              客户基础的组合也透露出一种有用的运营模式：在可负担性痛点高、但数字效用已经很明显的市场，公司能够放量。这解释了为什么即使没有传统银行信贷基础设施，扩张也能看起来很快。
