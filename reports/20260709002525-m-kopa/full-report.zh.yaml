      - number: '2.5'
        title: 市场规模测算框架及其对 M-KOPA 的含义
        blocks:
          - type: paragraph
            body: >
              最有用的规模测算框架不是一个单一总可用市场（TAM）数字，而是分层漏斗。最宽的一层，是生活在覆盖范围内却仍离线的非洲人，或电力有限、文件证明薄弱、没有正规信贷接入的人。这个群体中，有一部分人在入口产品定价正确时，可以支撑每日或每周还款。再往里，才是
              M-KOPA 当前的运营切口：智能手机主导的接入，以及进入更高价值金融产品的路径。


              公开证据支持一个很大的宏观机会，同时也提醒不要简单膨胀 TAM。不是每个没有电的人都需要融资智能手机；不是每个处在覆盖下的人都买得起数据；不是每个有手机的人都想要或符合信贷资格。尽调真正要看的是，M-KOPA
              能否比税费、汇率压力和购买力约束侵蚀可负担性的速度更快，把结构性需求转成可复制经济性。


              因此，市场结论有利但带条件。M-KOPA 瞄准的是真实、持久的品类缺口，并具备多国扩张潜力。但胜出模式取决于能否解决客户完整的可负担性栈——设备、能源、数据和信贷——而不只是卖出更多手机。
