      - number: '3.4'
        title: M-KOPA 看起来更强的地方，以及暴露点
        blocks:
          - type: paragraph
            body: >
              多种能力必须同时跑通的地方，M-KOPA 看起来最强：融资设备控制、数千名代理分销、面向不规则收入的承保，以及获客之后更宽的服务包。Condia 对 M-KOPA
              尼日利亚模式的描述在这里很有帮助，因为它把约束优势说得很清楚。可远程锁定的手机不只是融资产品；在通过法院收回资产缓慢且昂贵的市场，它是一种异常有效的抵押品。


              公司更暴露的地方，是对手可以拆开体验。Sun King 可以用类似 PAYG 和组装故事竞争；Asopo 可以用后台工具武装其他运营商或金融方；电信运营商可以用门店、SIM
              关系和钱包通道，以更低获客成本争夺同一个设备融资场景。这些力量单独看都没有完全复制 M-KOPA，但合在一起，如果公司不能持续拉大服务差距，就会压缩差异化。


              因此，竞争答案不是 M-KOPA 没有同业，而是它的护城河是组合型的。客户和资金方重视整套栈时，它会胜出；如果市场认为第一部融资手机才是真正重要的唯一产品，它会变弱。
