  - id: TV005
    title: 打破论点与止损触发器表
    columns:
      - 触发器
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 资产组合质量披露不及预期
        - 损失、核销或逾期显著高于公开叙事中的温和水平
        - 削弱利润率、应收账款杠杆和投资者信心
        - 把估值重置到熊市情景附近。
      - - 治理悬而未决事项升级
        - 出现不利诉讼事件、破坏性证据开示或有争议的资本重组结果
        - 抬高稀释和融资风险
        - 施加更大的未上市公司折价。
      - - 融资成本显著上升
        - 仓储融资或债务再融资明显变贵或受限
        - 挤压增长和单位经济
        - 下调可接受倍数。
      - - 2025 年财务规模不及预期
        - 收入或盈利能力未能在 2024 年基数上台阶
        - 削弱牛市和基准上沿情景
        - 把估值维持在区间低端附近。
      - - 监管 / 客户处置约束
        - 监管机构或法院实质限制基于锁机的执行或催收
        - 损害模式的核心抵押逻辑
        - 在补救得到证明前，视为当前论点已破。
    notes: 触发器入选，是因为它们会直接传导到估值，而不只是带来头条风险。
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV036
      - CV037
