      - number: '8.3'
        title: 上市可比筛选与折价逻辑
        blocks:
          - type: paragraph
            body: >-
              这里的上市可比更适合用来划边界，而不是一键给答案。运行日抓取的 CompaniesMarketCap 页面显示，即便在成熟 fintech 和金融相邻平台中，倍数也差异很大。按 2026 年 7 月市值和
              2025 年收入计算，PayPal 接近 1.2x 2025 年收入；SoFi 约 6.3x；Affirm 约 7.3x；Adyen 约
              9.6x。这个离散度很重要，因为它显示倍数对增长质量、盈利能力、模式简洁度、地理和资产负债表风险有多敏感。


              M-KOPA
              有一些特征支持它相对成熟低增长支付公司拿溢价，尤其是高增长、强采用证据，以及在渗透不足市场中可防守的分销和催收栈。但它也带着上市可比公司未必完全共有的折价：私营公司不透明、国家和汇率风险、仓储融资依赖、围绕设备锁定的客户公平敏感性，以及未解决的治理诉讼。因此，正确推论不是
              M-KOPA 应按 PayPal 的低位或 Adyen 的高位交易；而是中个位数倍数需要异常强的证明，低个位数倍数已经足以把公司推到或推过独角兽门槛。
