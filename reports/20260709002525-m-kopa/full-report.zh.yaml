      - number: '3.2'
        title: 直接 PAYG 与联网资产同业
        blocks:
          - type: paragraph
            body: >
              Sun King 是最清楚的相邻同业，因为它把最后一公里分销、灵活融资和向可负担智能手机的明确迁移结合在一起。它的智能手机叙事仍比 M-KOPA
              更偏能源中心，但重叠真实存在：两家公司都把融资设备与可负担性话术、本地组装，以及连接提升生产力和包容性的论证配在一起。d.light 属于同一个大类，不过其公开定位仍更扎根于太阳能和家电，而不是更宽的金融科技栈。


              Bboxx 和 Asopo 组成另一类同业集合。Bboxx 仍把自己呈现为向数百万人交付清洁能源、智能手机、电动出行和融资的公司；Asopo
              则把后台逻辑说得更明白：运营、支付、信用评分、客户管理，甚至资产锁定，都可以作为模块化平台提供。这意味着竞争者既可能是有品牌的消费者提供商，也可能是为他人服务的白标赋能层。


              Izili 提供了这套打法的另一个版本：通过与小额金融机构（MFI）和电信运营商合作，融资能源和数字产品接入。相较 M-KOPA，Izili 看起来更依赖合作伙伴，也更偏西非 /
              法语区非洲，但它强化了一个事实：这一品类正在超出一两家东非先行者。
