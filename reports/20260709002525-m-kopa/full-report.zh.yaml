  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争框架：直接同业与替代品
        blocks:
          - type: paragraph
            body: >
              M-KOPA 面对的不是单一竞争者品类。它有直接同业，同样用 PAYG 逻辑融资生产性资产；也有替代品，通过电信运营商或 OEM 渠道更狭义地解决智能手机可负担性。这个区分很重要，因为 M-KOPA
              的竞争优势不只取决于表面的手机价格，还取决于对手能否复制回款纪律、嵌入式服务，以及初始设备销售之后的交叉销售。


              实际看，市场分成三组。第一组是 PAYG 起家的玩家，如 Sun King、d.light、Bboxx 和 Izili，它们在资产融资、最后一公里分销和能源接入根基上与 M-KOPA
              重叠。第二组是软件或赋能层，如 Asopo；它们未必像消费品牌，却可以通过支付、锁机和评分基础设施，驱动竞争性的融资资产模式。第三组是手机主导的替代品，如 EasyBuy、MTN EasyBuy 和
              Safaricom Lipa Mdogo Mdogo；它们借助既有电信或零售通道，把主张简化为可负担手机拥有。


              因此，正确尽调视角是能力重叠，而不是市场标签。M-KOPA 的真正问题是，对手能否比肩它在资产约束、分期可负担性、交叉销售深度和运营触达上的组合，而不是对手是否也自称普惠金融科技。
