        - 供电不稳定，距离正规金融较远
        - PAYG 积累和对离网场景的贴近降低采用摩擦
        - 能源、物流和服务成本仍然更高
      - - 开始进入正规金融的女性
        - 获得第一件数字工具和第一批金融产品
        - 收入、可负担性和证件缺口
        - M-KOPA 影响力报告显示，许多女性客户首次获得智能手机和保险
