  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与品类存在的原因
        blocks:
          - type: paragraph
            body: >
              M-KOPA
              真正的市场既不只是“离网太阳能”，也不只是“消费贷款”。它处在可负担智能手机接入、分布式能源接入，以及为收入不规则、按日流入、常常被主流银行看不见的人提供正规金融包容的交叉区。公司自己使用的“日常劳动收入者”很有用，因为它比无银行账户或低收入这类泛化标签更能抓住底层客户现实。


              这个交叉区存在，是因为非洲数字参与的供给很足，转化很弱。GSMA 近期数据显示，大多数人口生活在移动宽带覆盖下，但实际移动互联网使用远远落后。World Bank 和 ITU
              材料从另一个角度显示同一模式：账户、储蓄和连接都在改善，但可负担性、文件证明、设备拥有和服务可靠性仍把大量人挡在正规数字经济之外。


              因此，M-KOPA
              的品类应被理解为一个融合市场。设备融资重要，是因为智能手机是入口产品；能源接入重要，是因为生产性数字使用依赖可靠充电和离网替代方案；数字金融重要，是因为最终目标不是卖出一部手机，而是基于还款行为和产品挂载建立持久客户关系。
