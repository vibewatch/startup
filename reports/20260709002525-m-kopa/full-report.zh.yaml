      - number: '7.5'
        title: 缓释、监测与论点破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              缓释案例可信。M-KOPA 面向客户的材料反复强调透明定价、无隐藏费用、漏缴不罚款，以及退还设备即可退回押金。尼日利亚的代理留存数据表明，公司能让大型地面团队保持产出；DFI
              和银行参与则说明外部对手方已经看到足够的组合质量和政策纪律，愿意继续提供资本。这些都是有意义的正面因素。


              但剩余尽调负担仍然不小。公开来源未披露合并损失曲线、逐国逾期、设备限制后的恢复还款率、消费者投诉量、监管函件，或员工股份争议的最终法律和经济影响。M-KOPA
              的模式高度互联，错误的负面信号会很快扩散：催收争议会伤害审批和资本获取；资金收紧会压缩增长并恶化单位经济；治理冲击会同时重定价债务和股权。


              实操投资立场因此应使用明确否决标准。若法院或监管者实质限制锁定和催收模式，若仓储融资明显收紧，若诉讼迫使痛苦资本重组或暴露董事会流程弱点，或新披露显示损失率显著高于管理层话术，投资论点就需要立即重审。
