  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与用户承诺
        blocks:
          - type: paragraph
            body: >
              M-KOPA
              的公开产品承诺很清楚：融资智能手机只是入口。公司在官网、产品和影响页面把主张包装为“不止是一部手机”，意思是设备接入捆绑了一条通向贷款、保险、数据和保护的阶梯。理解产品栈时，这一点很关键，因为手机更像承载更广客户关系的载体，而不是独立
              SKU。


              可见模块包括融资智能手机、现金贷款接入、保险、移动数据相关使用，以及设备保护流程。公开影响报告显示，这些模块不是边缘附加项：许多客户通过平台第一次拥有智能手机、第一次接触正规金融产品，也第一次获得健康保险。这强化了一个判断：M-KOPA
              搭建的是围绕接入和变现的产品系统，而不只是转售硬件。
