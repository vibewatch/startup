chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、业务版图与商业模式
        blocks:
          - type: paragraph
            body: >
              M-KOPA 于 2010
              年围绕一个简单但有力的判断创立：如果每天的数字化小额付款能和内置联网能力的设备结合，非洲银行服务不足的家庭就能获得原本一次性买不起的生产性资产。公司从太阳能照明和家庭能源系统起步，随后扩展到家电，2020
              年进入智能手机，2023 年又推进出行相关产品和试点。这条演进很关键，因为今天的 M-KOPA 已经不宜再被定义成纯粹的离网太阳能公司；它更像一个联网资产融资与普惠金融科技平台。


              公司公开材料显示，其运营覆盖肯尼亚、乌干达、尼日利亚、加纳和南非五个国家。M-KOPA
              母公司自称总部位于伦敦，但运营重心仍在东非，内罗毕是关键的商业、组装和执行枢纽。当前消费者主张明显超越硬件融资：公司用“不止是一部手机”包装一部融资手机，把它变成贷款、保险、数据接入和持续金融关系的入口。


              这套模式和传统零售分期计划有结构性差异，因为设备联网、还款回收和信用扩展被紧密绑在一起。公司和投资者材料反复把商业闭环描述为：低额首付款之后，客户每天用数字方式小额还款；融资设备既是获客切口，也是未来承保的数据来源。后续尽调都应围绕这个核心视角展开：M-KOPA
              用联网资产为“日常劳动收入者”搭建信贷和服务栈，而不是简单赊卖太阳能套件或智能手机。
