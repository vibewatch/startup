            body: >-
              实操建议是继续研究，信心中等；不是因为 M-KOPA 看起来弱，而是公开证据仍给低到中段独角兽区间以上的估值误差留下太多空间。基准情形应集中在约 $1.3 billion 到 $1.7
              billion，对应最强公开 2024 收入锚点的 3x–4x 倍数，并为持续盈利增长给一点溢价。熊市情形约落在 $1.0 billion 到 $1.2
              billion，前提是治理悬而未决、资金成本或组合质量披露令人失望。牛市情形可延伸到约 $2.1 billion 到 $2.5 billion，前提是管理层能展示干净的 2025
              年扩张、可持续盈利、低损失，以及不会吓退债务或股权投资者的诉讼后 cap table。


              这个框架刻意保持价格敏感。它为用户给出的独角兽特征留出空间，同时尊重证据缺口。如果交易在约 $1.0 billion 到 $1.5 billion
