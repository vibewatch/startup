    type: flow
    layout: wide
    summary: 典型旅程从首次获得设备开始，进入生产性使用，再延伸到更广的金融服务参与。
    data:
      nodes:
        - id: need
          label: 需要负担得起的数字工具
          detail: 客户缺少一次性购买智能手机的现金。
        - id: acquire
          label: 获得融资智能手机
          detail: 首付加分期模式打开入口。
        - id: use
          label: 用设备工作和生活
          detail: 沟通、支付、采购、学习和抗风险能力开始运转。
        - id: engage
          label: 建立还款和使用历史
          detail: 持续互动积累信任和产品资格。
        - id: expand
          label: 使用更广服务
          detail: 客户可能使用贷款、保险或更多产品。
      edges:
        - from: need
          to: acquire
          label: 由此解决
        - from: acquire
          to: use
          label: 促成
        - from: use
          to: engage
          label: 深化为
        - from: engage
          to: expand
          label: 解锁
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU022
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: M-KOPA 当前客户基数只是区域内更大可负担性和普惠缺口的一小部分。
    data:
      items:
        - label: 广义每日收入者口径（百万）
          value: 1000
        - label: 有移动覆盖但受限用户（百万）
          value: 400
        - label: M-KOPA 累计服务客户（百万）
          value: 7
        - label: M-KOPA 活跃客户（百万）
          value: 3
    approximationNotes: 前几个阶段是以百万计的方向性市场口径；最后阶段是公司报告的客户人数，单位同为百万。
    claimRefs:
      - CU002
      - CU007
      - CU008
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开客户证明更多落在实际成效上，而不是正式企业 logo 或具名机构。
    data:
      columns:
        - 首次可获得性
        - 创收
        - 满意度
        - 地域证明
        - 复购 / 深度代理指标
      rows:
        - label: 影响力报告
          values:
            - 高
            - 高
            - 高
            - 高
            - 中
        - label: 客户故事
          values:
            - 中
            - 高
            - 中
            - 中
            - 低
        - label: 国家市场发布
          values:
            - 中
            - 高
            - 中
            - 高
            - 中
        - label: 应用和支持界面
          values:
            - 低
            - 中
            - 低
            - 低
            - 中
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
  - id: FU004
    title: 留存 / 复购队列
    type: kpi
    summary: 公开材料没有给出队列表，而是用满意度、生产性使用和活跃客户口径来代理客户耐久度。
    data:
      items:
        - label: 活跃客户（M）
          value: 3
        - label: 累计服务客户（M）
          value: 7
        - label: 生活质量改善（%）
          value: 90
        - label: 使用手机创收（%）
          value: 70
        - label: 报告收入提高（%）
          value: 59
    approximationNotes: 这些只是代理指标，不是披露的留存模型。
    claimRefs:
      - CU007
      - CU008
      - CU016
      - CU017
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 治理诉讼和融资依赖是后果最重的风险，因为它们会同时传导到回款、资本获取和估值。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 治理 / 股权纠纷诉讼
          values:
            - 中高
            - 严重
            - 中
            - 高
        - label: 融资和仓储资金依赖
          values:
            - 中高
            - 严重
            - 中高
            - 高
        - label: 设备锁定 / 催收反弹
          values:
            - 中高
            - 高
            - 中
            - 中高
        - label: 隐私 / 数据处理暴露
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 规模化后的运营质量漂移
          values:
            - 中
            - 高
            - 中
            - 中
    claimRefs:
      - CR001
      - CR003
      - CR012
      - CR019
      - CR027
      - CR036
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最高风险的路径从客户对待方式和资产组合质量出发，同时传到资本可得性和声誉信任。
    data:
      nodes:
        - id: lock
          label: 锁机 / 催收事件
          detail: 设备限制或回收中出现公平性或执行问题。
        - id: trust
          label: 客户信任流失
          detail: 客户还款、推荐或升级意愿下降。
        - id: loss
          label: 资产组合损失压力
          detail: 回正率下降、损失上升削弱应收账款质量。
        - id: fund
          label: 融资重新定价
          detail: 仓储资金或 DFI 支持资本变得更贵或更受限。
        - id: growth
          label: 新增发放放缓
          detail: 审批、可负担性或市场扩张转弱。
        - id: margin
          label: 利润率压缩
          detail: 更高 CAC、资金成本或催收成本挤压经济性。
        - id: value
          label: 估值压力
          detail: 投资者降低可接受倍数，或要求更多尽调。
      edges:
        - from: lock
          to: trust
          label: 可能触发
        - from: trust
          to: loss
          label: 削弱还款
        - from: loss
          to: fund
          label: 重新定价
        - from: fund
          to: growth
          label: 约束
        - from: fund
          to: margin
          label: 推高成本
        - from: growth
          to: value
          label: 削弱上行空间
        - from: margin
          to: value
          label: 压缩
    claimRefs:
      - CR013
      - CR019
      - CR020
      - CR021
      - CR037
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: M-KOPA 依赖的不是一条简单供应链，而是资金方、OEM、服务商和监管方紧密咬合的一张网络。
    data:
      nodes:
        - id: mk
          label: M-KOPA 核心平台
          detail: 应收款、设备控制、地面运营和嵌入式金融。
        - id: funders
          label: 仓储融资 / DFI 资金方
          detail: Standard Bank、DFC、IFC 及其他资本提供方。
        - id: oems
          label: OEM / 硬件伙伴
          detail: 设备伙伴和本地组装资源。
        - id: agents
          label: 代理网络
          detail: 线下获客和服务层。
        - id: payments
          label: 支付 / 回款通道
          detail: 还款和服务流程。
        - id: bureaus
          label: 征信机构 / 催收方
          detail: 信用核验和追偿支持。
        - id: regulators
          label: 监管机构 / 法院
          detail: 国家层面的法律与合规边界。
      edges:
        - from: funders
          to: mk
          label: 融资
        - from: oems
          to: mk
          label: 供货
        - from: agents
          to: mk
          label: 分销
        - from: payments
          to: mk
          label: 回款
        - from: bureaus
          to: mk
          label: 核验 / 追偿
        - from: regulators
          to: mk
          label: 约束 / 放行
    claimRefs:
      - CR020
      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 这项建议沿着一条链条展开：真实规模和融资支持先成立，但治理与披露缺口限制结论，最终落在对价格敏感的判断上。
    data:
      nodes:
        - id: scale
          label: 规模真实
          detail: 2024 年收入和客户证据说明它够得上后期标的。
        - id: growth
          label: 增长仍强
          detail: 公司称 2024 年增速超过 65%，且到 2026 年仍保持盈利。
        - id: support
          label: 资本支持
          detail: DFI、银行和战略投资者看起来仍在参与。
        - id: gaps
          label: 披露缺口
          detail: 损失曲线、股权结构表和最终融资条款仍不完整。
        - id: discount
          label: 折价合理
          detail: 私营公司、新兴市场、应收款和治理风险，都支持估值折价。
        - id: call
          label: 继续研究
          detail: 接近低到中段独角兽估值较合理；若没有更好证据，超过 $2B 就显得偏高。
      edges:
        - from: scale
          to: growth
          label: 支撑
        - from: growth
          to: support
          label: 强化
        - from: support
          to: gaps
          label: 未消除
        - from: gaps
          to: discount
          label: 要求
        - from: discount
          to: call
          label: 推动
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV011
      - CV028
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 简单收入倍数敏感性显示，M-KOPA 只需要相对温和的倍数就能跨过独角兽门槛；但要拿到大幅溢价，还需要更干净的证据。
    data:
      items:
        - label: 2024 年收入的 2.5x
          value: 1040
        - label: 2024 年收入的 3.5x
          value: 1456
        - label: 2024 年收入的 4.0x
          value: 1664
        - label: 2024 年收入的 5.0x
          value: 2080
        - label: 2024 年收入的 6.0x
          value: 2496
    claimRefs:
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开信息的估值区间支持可信的独角兽结果，但上沿区间取决于 2025 年披露能否显著改善。
    data:
      items:
        - label: 熊市情景
          low: 1000
          mid: 1100
          high: 1200
        - label: 基准情景
          low: 1300
          mid: 1500
          high: 1700
        - label: 牛市情景
          low: 2100
          mid: 2300
          high: 2500
    approximationNotes: 这些区间是情景估算，依据最强的公开收入锚点和估值折价 / 溢价框架，而不是管理层指引的预测。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: M-KOPA 在市场需求和验证上得分较好，但估值确定性和证据质量偏弱。
    data:
      items:
        - label: 市场需求
          value: 8.5
          unit: /10
        - label: 客户验证
          value: 8
          unit: /10
        - label: 运营护城河
          value: 7.5
          unit: /10
        - label: 经济性可见度
          value: 6
          unit: /10
        - label: 风险姿态
          value: 4.5
          unit: /10
        - label: 估值支撑
          value: 5.5
          unit: /10
        - label: 证据质量
          value: 5.5
          unit: /10
    claimRefs:
      - CV022
      - CV025
      - CV032
      - CV033
      - CV039
