      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              M-KOPA 现在运行的是一套真正工业化的运营系统：每天超过 100 万笔支付、数万名代理、本地组装、融资设备，以及数字金融服务挂接。规模是优势，也意味着小运营故障会快速复合。设备锁定
              bug、支付渠道中断、维修处理差，或代理沟通断裂，都可能同时伤害催收、客户信任和重复产品采用。


              公开记录显示优势和脆弱性并存。尼日利亚影响力报告提到 11,000
              名活跃直销代理和极低的代理流失率，指向成熟的地面执行。肯尼亚影响力报告也强调透明条款和可退押金设计，说明公司意识到声誉和过度负债风险。但同一批材料也确认，设备锁定是执行的核心。手机如果是客户的工作工具，任何误锁或解释不清的限制，都可能不像逾期提醒，而更像对日常收入的打断。


              安全和数据风险同样与运营交织。隐私声明明确提到网页、App、支付和客服数据流，包括 WhatsApp Business 和第三方服务提供商。DFC
              项目摘要还提到使用私人安保，以及与环境和社会政策相连的条件。上述内容都不是当前泄露或滥用的证据；它说明 M-KOPA 的运营模式触及足够多敏感表面，流程质量和头条增长一样重要。
