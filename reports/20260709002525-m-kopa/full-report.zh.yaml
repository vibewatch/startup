figures:
  - id: FO001
    title: M-KOPA 公司演进时间线
    type: timeline
    summary: M-KOPA 已从离网太阳能接入，转向以智能手机为入口的普惠金融科技平台，服务更宽、覆盖多国。
    data:
      items:
        - label: 2010：成立
          value: PAYG affordability thesis built around digital micropayments and connected devices
        - label: 2011：早期扩张
          value: Commercial operations began building cumulative customer base in Kenya
        - label: 2010s：太阳能根基
          value: Business initially centered on solar lighting, home systems, and appliances
        - label: 2020：推出智能手机
          value: Handsets became the main acquisition wedge for digital inclusion and embedded finance
        - label: 2023：重大融资
          value: '>$250M package announced with Sumitomo equity and Standard Bank-led debt'
        - label: 2025：国家报告
          value: Public country-level impact disclosures showed repeatability beyond Kenya
        - label: 2025：300 万活跃客户
          value: Company disclosed 3M active and 7M total customers served
        - label: 2026：FT 排名
          value: Revenue grew >65% in 2024 and profitable growth continued into 2026
    approximationNotes: 时间线依据公司新闻稿、DFI 公告，以及后续融资和诉讼背景报道拼出。
    claimRefs:
      - CO001
      - CO003
      - CO009
      - CO011
      - CO015
