      - number: '4.4'
        title: 公开财务缺口与证据可靠性
        blocks:
          - type: paragraph
            body: >
              财务证据有分量，但不均衡。当前最强的指标来自官方公司增长披露、发展金融机构（DFI）和合作伙伴融资公告、Companies House
              记录，以及可信第三方报道的组合。这足以支撑一个严肃的后期规模故事；但如果没有管理层材料，还不足以让股权投资者或私人信贷提供方建立完全严谨的承保模型。


              缺失项目包括公司公开发布的清晰经审计合并损益表（P&L）、按产品线拆分的毛利率、国家层面盈利能力、应收账款账龄、仓储层面预付率，以及从年经常性收入（ARR）叙事到确认收入的精确对账。公开账户和备案历史证明了活动存在，但没有披露足以完全拆分设备利润、信贷收入、服务收入和损失经验的运营细节。


              因此，整体财务结论是有利但不完全透明：M-KOPA 看起来真实、规模大，也大概率具备可持续融资能力；但它仍是一家未上市公司，最好的数字仍通过间接渠道浮出水面。
