      - number: '6.4'
        title: 留存信号、集中度与扩张风险
        blocks:
          - type: paragraph
            body: >
              公开留存披露远弱于规模披露。公司使用「活跃客户」口径有帮助，因为它强调持续参与而非原始注册量；但 M-KOPA 仍未发布按 cohort 的留存、按 vintage
              的重复借款，或按客群分的客户生命周期价值。尽调只能改用代理指标：重复产品挂接、满意度、国家扩张，以及设备的生产性使用逻辑。


              广泛的市场组合在一定程度上降低单一国家集中风险，但肯尼亚仍是最深的客户基础，也仍应被视为这项业务的核心。因此，客户风险问题不是 M-KOPA
              有没有找到市场——它显然已经找到了——而是公司走出最成熟本土市场后，新市场增长能否保持质量。实操上，投资者应把获客量和客户耐久度分开看。一个市场可能因为首台设备需求清晰而快速放量，但如果扩张后重复使用、支持质量或后续产品挂接变弱，仍可能令人失望。公开证据在这一点上显得混合，只是因为不完整，不是因为负面。
