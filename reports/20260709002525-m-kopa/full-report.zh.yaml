      - number: '2.2'
        title: 需求驱动：连接、金融与非正规经济规模
        blocks:
          - type: paragraph
            body: >
              需求由几条深层宏观驱动支撑。第一，非洲移动经济已经有很大经济体量，并且仍在扩张。GSMA Intelligence 估计，该行业 2024 年为非洲大陆经济贡献 $220 billion，到 2030 年可能达到
              $270 billion。第二，金融包容明显改善；World Bank 报告称，2024 年撒哈拉以南非洲成年人账户拥有率达到 58%，正规储蓄也显著上升。第三，M-KOPA
              自身披露和相邻行业来源都指向一个庞大的非薪资、非正规收入劳动者池；这些人需要生产性工具，却拿不到传统消费金融。


              这些驱动彼此补强。正规账户增长让还款和钱包关联行为更容易落地。移动覆盖提升抬高设备效用上限。支付、储蓄和商业更快数字化，会提升第一部智能手机的价值。这就是为什么即使没有全民电网接入或全民银行服务，市场仍能扩张：一层取得进展，会增加解决其他层的经济回报。


              M-KOPA 最受益的地方，是这种融合最强的经济体——移动支付通道深、非正规劳动力规模大、使用缺口明显、客户能快速用融资设备变现。肯尼亚是最清楚的例子，但尼日利亚和加纳表明，更广泛的区域模式可以复制。
