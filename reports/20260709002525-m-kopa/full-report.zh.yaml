      - number: '3.3'
        title: 手机融资替代品与电信渠道
        blocks:
          - type: paragraph
            body: >
              即便没有复制 M-KOPA 的完整服务栈，手机聚焦的先买后付（BNPL）替代品仍有战略重要性。EasyBuy 的公开主张刻意简单：付首付、拿手机，然后每周或每月还款。MTN EasyBuy
              和相关运营商关联项目使用类似表述，同时借助品牌信任、SIM 关系、门店和开户数据。Safaricom 的 Lipa Mdogo Mdogo 在肯尼亚构成同类威胁，M-PESA 分销和客户熟悉度可以降低获客摩擦。


              这些替代品可能产生不成比例的影响，因为它们把竞争收窄到客户的第一个决定：如何负担得起地拿到一部手机。如果对手通过电信或 OEM 通道低成本赢下这个入口，M-KOPA
              失去的不只是设备销售，还有建立还款历史并在之后挂载贷款、保险或数据相关服务的机会。这就是为什么更窄的产品仍可能成为严肃竞争威胁。


              但仔细拆开栈之后，这些挑战者通常比 M-KOPA 更浅。它们的公开材料更强调设备可负担性和付款机制，而不是通向更广泛金融产品的整合阶梯；这说明 M-KOPA 仍有空间靠宽度和客户终身价值防守。
