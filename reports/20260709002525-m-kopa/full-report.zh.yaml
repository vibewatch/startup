      - number: '1.5'
        title: 里程碑、财务拐点与负面背景
        blocks:
          - type: paragraph
            body: >
              M-KOPA 近期故事同时包含正向运营拐点和实质性负面背景。正面看，公司 2026 年自己的评论称，2024 年收入增长超过 65%，并且 2025 年到 2026 年增长仍保持盈利。TechCabal
              引用英国备案进一步报道称，2024 年收入约 $416 million，并实现首次年度盈利。如果能够持续，M-KOPA 将脱离常见的“高增长、依赖资本、仍在亏损”后期公司篮子。


              同时，围绕员工持股和资本重组风险的公开证据也有分量。TechCabal、Business & Human Rights Resource Centre 和 Kenya Law
              一项裁定都描述了一起由前员工主导的请愿，指称 M-KOPA 的增长股结构在保护投资者和外籍员工的同时，让非洲员工处于不利地位。M-KOPA
              强烈否认指控，发布反驳，并挑战肯尼亚法院管辖权。案件尚未证明底层不当行为，但它是贴着融资周期发生的真实治理事件，不是边缘投诉。


              实际尽调结论是：M-KOPA 已经做到足够的规模和盈利能力，值得后期投资人认真研究；但投资人原本可能为这种进展支付的治理溢价，应在 2025 年后股权类别和老股流动性问题被更好理解之前打折。
