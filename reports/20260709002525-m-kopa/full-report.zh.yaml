      - number: '4.2'
        title: 单体经济性、信贷设计与回款逻辑
        blocks:
          - type: paragraph
            body: >
              M-KOPA
              的公开财务逻辑更依赖现金流匹配，而不是传统无抵押贷款。客户支付首付后立刻拿到设备，再按适配不规则收入周期的小额固定分期还款。这一点很关键，因为公司不是只靠法院追偿或浮动利率消费信贷来保护回报；融资资产本身可以根据还款状态被限制或解锁。


              尼日利亚的公开报道让这套逻辑更清晰。Condia 将 M-KOPA
              模式描述为以成本为基础、而非以利息为主导：总还款额固定，内置设备约束，而不是通过法院收回资产。报道还援引管理层评论称，尼日利亚损失率为个位数，并且是 M-KOPA
              各地理市场中还款表现最强的市场。这些不是经审计的单体经济性披露，但它们解释了为什么机构应收账款融资仍然可得。


              主要披露缺口在于，公开材料仍没有给出放款批次曲线、核销、等效净息差、各仓储融资成本，或按产品队列调整损失后的贡献。
            claimRefs:
