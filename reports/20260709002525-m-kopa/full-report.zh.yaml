      - number: '7.4'
        title: 治理、人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              公开治理图景足以显示公司有复杂度，但噪音也足以挡住低风险结论。Companies House 记录显示，2025–2026 年公司密集处理配发、注销、优先购买权和证券决议、重新创建股权类别、采纳章程，以及与
              Series F 阶段融资相关的变更。这些对后期私营公司并非天然有问题，事实上可能只是成熟化和资本重组的反映。问题在于，这些动作与有关稀释、信息权和员工差别待遇的争议指控重叠。


              这种重叠让股份争议超出观感层面。如果投资者、员工和法院同时在检验谁得到保护、谁被稀释、哪个司法辖区控制争议，未来融资轮可能变得更贵，或附带更多条件。案件还带来管理带宽风险：领导层必须同时扩张五国运营、维持催收质量、稳住资金方信心，并处理诉讼和叙事攻击。


              因此，执行风险不太是 M-KOPA 有没有合格运营者的问题，而是治理复杂度会不会开始消耗整台机器。公司的公开反驳以及机构资本仍可获得，都是缓释信号。但它们不能完全替代董事会流程透明度、最终融资条款或 cap
              table 清晰度。
