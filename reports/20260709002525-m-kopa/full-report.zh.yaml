      - number: '1.4'
        title: 规模、国家牵引力与产品市场契合证据
        blocks:
          - type: paragraph
            body: >
              公司 2025-2026 年官方披露显示，其运营规模在非洲未上市金融科技公司中罕见。M-KOPA 称已达到 3 million 活跃客户，自 2011 年以来累计服务 7 million 客户，累计投放超过 $2
              billion 信贷，现在每天新增客户超过 10,000。这些数字显示，公司已经从验证产品市场契合，进入让大陆级分销和承保引擎复利扩张的阶段。


              国家层面的证据强化了这一结论。肯尼亚仍是最深的市场，已有 4.8 million 客户、释放 KES 207 billion 信贷、本地组装 2 million 部手机，并贡献可观税收和采购。尼日利亚成为最快达到
              1 million 客户的市场；加纳已经超过 550,000 客户，覆盖全国各地区；南非上线后也很快突破 100,000 客户。这不是一家单一国家公司贴上泛非标签——多种运营环境下的可复制性已有真实证据。


              更重要的是，M-KOPA
              的牵引力并不只用客户数量来包装。其影响报告称，平台经常带来客户第一部智能手机、第一项正规金融产品，或第一段健康保险关系。数字接入切口加上后续金融产品挂载，使公司在战略上比狭义设备融资商更有意思，也解释了为什么模式复杂却仍能拿到投资人支持。
