            body: >
              信任和合规在两个地方可见：公开政策文件和客户支持机制。隐私通知显示了一个很宽的数据处理边界，包括身份核验（KYC）、欺诈检查、信贷流程、营销、调查、债务催收，以及在允许情况下与征信机构或支付伙伴共享。常见问题（FAQ）显示，付款后设备解锁可能需要数据或
              Wi-Fi 连接；这个小细节揭示了支持、回款和设备状态如何缠在一起。


              这在商业上有力量，但并非没有风险。产品质量本身也关乎信任，因为客户买的是一段持续关系，而不只是一部手机。本地组装、耐用设备话术和合作伙伴 / OEM
