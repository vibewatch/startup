  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察锚点与融资背景
        blocks:
          - type: paragraph
            body: >-
              给 M-KOPA 估值的起点，不是关于品类光环的传闻，而是一小组可观察锚点。TechCabal 根据英国备案报道，公司 2024 年收入约 $416 million、利润约 $9.2
              million。公司官方信息另称，2024 年收入增长超过 65%，盈利性增长延续到 2025 和 2026 年，业务 ARR 约 $400 million。ImpactAlpha
              随后补充了一个后期融资信号：据报道，一份 $160 million 的 Series F 条款清单在诉讼噪音期间同时包含新主融资和二级流动性。


              这些锚点支持两个结论。第一，仅从运营规模看，M-KOPA 已明显大到足以支撑独角兽地位。第二，公开记录仍不能高精度证明任何具体投后估值。Companies House
              活动确认同一时期仍在进行股份发行、注销和类别管理步骤，但没有发布清晰的公开 cap table 或最终 Series F 经济条款。因此，估值必须锚定收入、增长、盈利信号和融资质量，而不是某个被宣称的标志性估值。
