      - number: '2.4'
        title: 能源接入仍然塑造可服务市场
        blocks:
          - type: paragraph
            body: >
              即便 M-KOPA 已经转向智能手机，能源接入仍是其市场的一阶变量。Lighting Global、ESMAP、Mission 300 和 IEA
              都指向同一结论：撒哈拉以南非洲仍承载全球电力接入缺口的绝大部分，补缺口必须依赖去中心化方案。离网太阳能已经带来大量新增接入连接，并且对相当一部分仍未通电人口来说，仍是最低成本路径。


              这对 M-KOPA 有两层意义。第一，公司在 PAYG
              能源上的历史经验仍有战略价值，因为充电、韧性和家庭能源经济性会影响融资设备的效用。第二，一个不仅需要融资手机、还需要融资电力的客户，往往也是主流信贷服务不足的客户。从这个意义上，智能手机金融市场和离网能源市场不是两个割裂市场，而是同一可负担性问题的相邻表达。


              宏观约束在于能源接入改善太慢。IEA 和 Lighting Global 都显示，在当前轨迹下，到 2030 年仍可能有数亿非洲人没有电。这延长了
              PAYG、分布式能源和混合融资模式的相关性，即便本章重点是智能手机和数字接入。
