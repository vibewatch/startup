  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2025 年经审计财务
        - 收入、毛利、EBITDA / EBIT、现金流和国家组合
        - 从划定边界走向承销判断必须依赖这些数据
        - 索取管理层材料包和经审计报表。
      - - 资产组合质量
        - 账龄曲线、核销、治愈率、回收和现金贷款损失率
        - 融资韧性和股权价值的核心
        - 索取贷方级资产组合材料。
      - - 股权结构和优先权层级
        - Series F 后持股、优先权条款、二级交易规模和期权池状态
        - 用于判断每一美元新投资对应的真实股权价值
        - 审阅融资文件和股权结构模型。
      - - 诉讼状态
        - 当前诉状、管辖权结果、董事会流程证据和任何和解路径
        - 决定治理折价和悬而未决事项持续多久
        - 与肯尼亚和英国律师开展法律尽调。
      - - 融资到期梯队
        - 仓储融资提供方、期限、契约、外汇 / 对冲政策
        - 用于测试压力情景下的韧性
        - 开展资金管理尽调和贷方访谈。
    notes: 问题清单是把“继续研究”建议推进到更明确价格判断所需的最低要求。
    claimRefs:
