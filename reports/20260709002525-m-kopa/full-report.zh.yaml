      - number: '2.3'
        title: 核心约束是可负担性，不是覆盖
        blocks:
          - type: paragraph
            body: >
              最重要的市场约束是可负担性，而不是理论上的连接。GSMA 多次把手机可负担性描述为撒哈拉以南非洲采用移动互联网的单一最大障碍。其 2025-2026 年联盟工作显示，一部 $40 智能手机可能让该地区另外 20
              million 人上线；一部 $30 设备最多可释放 50 million 新用户。同一组来源也强调，税收和进口关税是主要扭曲：在一些国家，财政政策让入门设备成本增加超过 30%。


              World Bank 和 IFC 证据也从相邻角度支持同一判断。IFC 指出，即便已有改善，撒哈拉以南非洲的智能手机可负担性在新兴地区中仍然最差。World Bank Findex
              材料显示，数以百万计被金融排除的成年人已经有手机，甚至有智能手机，却仍没有正规账户；这说明问题不只是硬件绝对缺位。ITU 又把问题放大：低收入消费者为基础连接支付的收入占比，仍远高于富裕市场用户。


              含义很简单：市场很大，但转化对单体经济性极度敏感。任何能削减设备首付、摊开付款、降低保持在线总成本的公司，都能释放传统零售模式误判为不存在的需求。
