        - 押金加分期结构直接化解初始现金门槛
        - 后续数据流量是否负担得起仍然关键
      - - 非正规商贩 / 微型创业者
        - 用手机收付款、销售、采购和沟通
        - 收入不规律，信用记录薄
        - 每日小额还款比银行贷款更贴合现金流节奏
        - 收入波动仍会推高逾期风险
      - - 农村或城郊家庭
