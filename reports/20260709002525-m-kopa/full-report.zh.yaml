  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入规模与变现逻辑
        blocks:
          - type: paragraph
            body: >
              即便未上市公司披露不完整，M-KOPA
              的变现引擎在结构上已经可见。公司为设备和生产性资产融资，收取每日或定期还款，再围绕这批存量客户叠加更多金融和保障产品。这至少形成三条变现通道：融资资产的利润、与还款绑定的经常性经济性，以及贷款、保险、数据和设备保护等相邻服务收入。


              公开披露没有提供完整分部损益表（P&L），但规模信号越来越可信。M-KOPA 自己 2026 年的评论称，2024 年收入增长超过 65%，并且 2025 年到 2026
              年增长仍保持盈利。另一套公司叙事把业务描述为约 $400 million 年经常性收入（ARR）。TechCabal 随后补充了更强、但经媒体中介的数据点：基于英国备案，2024 年收入为 KES 53.7
              billion，约 $416 million。


              这组信息指向一家已经从“高增长但规模不确定”跨到“规模已足够大，因此融资结构和利润质量比证明收入更重要”的公司。
