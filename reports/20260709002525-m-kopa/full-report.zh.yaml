companyProfile:
  summary: >-
    M-KOPA 由 Jesse Moore、Nick Hughes 和 Chad Larson 于 2010
    年创立，起点是一套按用付费（PAYG）可负担性逻辑：把数字化小额支付和联网设备结合，让用户分期获得生产性资产。后来，公司从太阳能接入扩展为智能手机主导的普惠金融平台，覆盖信贷、保险、数据、设备保护和更多融资资产，市场包括肯尼亚、乌干达、尼日利亚、加纳和南非。公开证据已经支撑真实的后期规模和可信的独角兽估值底线，但还不足以给出公开市场级别的完整投资判断信心。
