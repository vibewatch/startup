callouts:
- calloutType: strength
  title: Operations software appears as important as the consumer app
  body: The visible stack suggests M-KOPA’s core product strength is not just the end-user interface but the orchestration of field teams, device state, repayments, and support.
  claimRefs: [CE010, CE014, CE018, CE019]
- calloutType: strength
  title: Device control is a product feature and a credit feature
  body: M-KOPA’s ability to restrict or restore financed devices links product design directly to collections performance, which is unusual relative to plain retail BNPL.
  claimRefs: [CE016, CE017, CE018]
- calloutType: risk
  title: Public observability is much thinner than the operating stack suggests
  body: Privacy, support, and product pages are visible, but public sources do not show engineering telemetry, scoring governance, or support-resolution metrics.
  claimRefs: [CE022, CE023, CE026, CE027]
- calloutType: insight
  title: The stack looks reusable across more than phones
  body: Because the core system manages financed assets, field workflows, and repayment state, it can likely support new productive-asset categories without a total platform rebuild.
  claimRefs: [CE029, CE030, CE033, CE034]
