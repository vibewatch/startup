  topStrengths:
    - 真实运营规模：公开锚点支持 3 million 活跃客户、7 million 累计服务客户，以及约 $416 million 的 2024 年收入。
    - 在渗透率不足的品类里，分期智能手机能成为更广泛金融普惠入口，市场契合度强。
    - 融资结构成熟，战略股权、银行授信和 DFI 支持并存，许多区域同行很难复制。
    - 护城河由多块拼成：线下分销、设备控制、针对不规则收入的授信，以及首台手机之外的服务绑定。
  topRisks:
    - 资产组合质量仍看不清；公开来源没有披露贷款人级别损失曲线、核销或治愈率。
    - 员工股权诉讼留下的治理和股权结构包袱，可能同时影响估值和资本成本。
    - 这个模型资本密集，对仓储融资定价、外汇管理和合作伙伴可靠性敏感。
    - 设备锁定和催收逻辑是经济性核心，也带来法律、监管和客户公平风险。
    - 公开证据支持独角兽估值底线，但不足以高置信度支持高于 low-to-mid $1B 区间的溢价估值。
  unresolvedGaps:
    - 经审计的 2025 年财务报表，包括国家组合、分部经济性，以及清晰的 ARR 到收入桥接。
    - 贷款人级别资产组合包，覆盖 vintages、逾期、核销、回收和现金贷款表现。
    - Series F 最终条款、轮后股权结构表、优先股堆叠和老股分配细节。
    - 当前诉讼状态、董事会流程证据，以及对未来稀释或治理权的任何影响。
    - 融资到期阶梯、仓储融资契约，以及各运营市场的外汇 / 对冲政策。
