summary:
  headline: 继续研究：M-KOPA 看起来是一家有规模的泛非 fintech，具备可信的独角兽经济性；但如果没有贷款人级别的资产组合、股权结构和治理披露，公开证据仍不足以支持以远高于约 $1.7 billion 的价格买入。
