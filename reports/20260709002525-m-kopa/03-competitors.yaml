callouts:
- calloutType: insight
  title: The most dangerous competitors may be narrower than M-KOPA
  body: A rival does not need M-KOPA’s entire stack to hurt M-KOPA. If it captures the first financed device through cheaper channels or stronger telco distribution, it can still destroy the economics of the broader customer journey.
  claimRefs: [CP024, CP025, CP029, CP033]
- calloutType: strength
  title: M-KOPA still appears unusual on combined breadth
  body: Public evidence suggests no single rival clearly matches M-KOPA on device control, services attachment, multi-country reach, and informal-income underwriting at the same time.
  claimRefs: [CP001, CP002, CP028, CP035]
- calloutType: risk
  title: Sun King and telco substitutes are the most credible immediate threats
  body: Sun King overlaps most on PAYG and field distribution, while MTN and Safaricom can attack the acquisition wedge through trusted customer rails and simpler handset-financing propositions.
  claimRefs: [CP003, CP004, CP013, CP014, CP030, CP031]
- calloutType: strength
  title: Backend imitation is a real but different kind of risk
  body: Asopo shows that the M-KOPA-style operating model can be modularized into software, which means competition can come from enablement layers as well as from branded consumer businesses.
  claimRefs: [CP008, CP009, CP010, CP032]
