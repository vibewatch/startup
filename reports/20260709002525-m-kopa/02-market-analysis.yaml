company:
  name: M-KOPA
chapter:
  number: 2
  title: Market Analysis
  summary: 'M-KOPA operates at the intersection of three large African market failures: electricity access, affordable smartphone access, and formal financial access for informal-income consumers. The macro opportunity is substantial—mobile networks cover most of the continent, but usage lags badly; sub-Saharan Africa still has hundreds of millions of people without electricity; and financial inclusion is improving but remains constrained by affordability, documentation, and phone ownership. The critical judgment is that M-KOPA is pointed at a real structural gap, but the addressable market only converts into revenue when device cost, taxes, energy reliability, and customer affordability are solved simultaneously.'
sections:
- id: market-definition
  title: Market Definition and Why the Category Exists
  body: |
    M-KOPA’s real market is not just “off-grid solar” and not just “consumer lending.” It sits in the overlap of affordable smartphone access, distributed energy access, and formal financial inclusion for people whose incomes are irregular, daily, and often invisible to mainstream banks. The company’s own language about “every day earners” is useful because it captures the underlying customer reality better than generic labels like unbanked or low-income.

    This overlap exists because African digital participation remains supply-rich but conversion-poor. In recent GSMA data, most of the population lives under mobile broadband coverage, yet actual mobile-internet use lags far behind. World Bank and ITU material shows the same pattern from a different angle: accounts, savings, and connectivity are improving, but affordability, documentation, device ownership, and service reliability still stop large numbers of people from joining the formal digital economy.

    M-KOPA’s category therefore should be understood as a convergence market. Device financing matters because the smartphone is the gateway product; energy access matters because productive digital use depends on reliable charging and off-grid alternatives; and digital finance matters because the end goal is not a handset sale but a durable customer relationship built on repayment behavior and product attachment.
  claimRefs: [CM001, CM002, CM004, CM005, CM006, CM012, CM018, CM036]
  tableRefs: [TM001]
  figureRefs: [FM001]
- id: demand-drivers
  title: 'Demand Drivers: Connectivity, Finance, and Informal-Economy Scale'
  body: |
    Demand is underwritten by several deep macro drivers. First, Africa’s mobile economy is already economically large and still expanding. GSMA Intelligence estimates the sector contributed $220 billion to the continent’s economy in 2024 and could reach $270 billion by 2030. Second, financial inclusion has clearly improved, with World Bank reporting sub-Saharan African account ownership reaching 58% of adults in 2024 and formal savings rising materially. Third, M-KOPA’s own disclosures and adjacent industry sources point to a vast pool of non-salaried and informal-income workers who need productive tools but cannot access conventional consumer finance.

    These drivers are complementary. Formal account growth makes repayment and wallet-linked behavior more tractable. Greater mobile coverage raises the ceiling for device utility. Faster digitization of payments, savings, and commerce increases the value of a first smartphone. That is why the market can expand even without universal grid access or universal banking: progress in one layer increases the economic return of solving the others.

    M-KOPA benefits most where this convergence is strongest—economies with deep mobile-money rails, large informal workforces, meaningful usage gaps, and a customer base that can monetize a financed device quickly. Kenya is the clearest example, but Nigeria and Ghana show that the broader regional pattern is repeatable.
  claimRefs: [CM002, CM003, CM008, CM012, CM013, CM014, CM016, CM036]
  tableRefs: [TM002, TM003]
- id: affordability-barriers
  title: Affordability is the Core Constraint, Not Coverage
  body: |
    The most important market constraint is affordability, not theoretical connectivity. GSMA repeatedly describes handset affordability as the single largest barrier to mobile internet adoption in sub-Saharan Africa. Its 2025-2026 coalition work suggests that a $40 smartphone could bring another 20 million people online in the region, while a $30 device could unlock up to 50 million additional users. The same source set also highlights taxes and import duties as a major distortion: in some countries, fiscal policy adds more than 30% to entry-level device cost.

    World Bank and IFC evidence supports the same thesis from adjacent angles. IFC noted that even after improvement, smartphone affordability in sub-Saharan Africa remained the worst among emerging regions. World Bank Findex material shows that millions of financially excluded adults already have phones—or even smartphones—but still lack formal accounts, meaning the issue is not pure absence of hardware alone. ITU then broadens the point by showing how lower-income consumers still pay a far larger share of income for basic connectivity than users in richer markets.

    The implication is simple: the market is large, but conversion is brutally sensitive to unit economics. Any company that can cut upfront device cost, spread payments, and reduce the total cost of staying connected can unlock demand that conventional retail models misread as non-existent.
  claimRefs: [CM004, CM005, CM007, CM009, CM010, CM019, CM020, CM034, CM035, CM038]
  tableRefs: [TM004]
  figureRefs: [FM002]
- id: energy-access-convergence
  title: Energy Access Still Shapes the Addressable Market
  body: |
    Energy access remains a first-order variable in M-KOPA’s market even as the company has shifted toward smartphones. Lighting Global, ESMAP, Mission 300, and IEA all point to the same conclusion: sub-Saharan Africa still contains the overwhelming majority of global electricity-access deficits, and decentralized solutions will be required to close them. Off-grid solar is already delivering a large share of new access connections and remains the least-cost path for a substantial portion of the remaining unelectrified population.

    That matters for M-KOPA in two ways. First, the company’s historical expertise in PAYG energy is still strategically useful because charging, resilience, and household energy economics affect the utility of financed devices. Second, a customer who needs help financing power, not just a phone, is often the same customer who is underserved by mainstream credit. In that sense, the smartphone-finance market and the off-grid-energy market are not separate markets—they are adjacent expressions of the same affordability problem.

    The macro constraint is that energy access is improving too slowly. IEA and Lighting Global both show that hundreds of millions of Africans could still be without electricity by 2030 under current trajectories. That prolongs the relevance of PAYG, distributed energy, and blended-finance models even in a chapter focused on smartphones and digital access.
  claimRefs: [CM021, CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM029, CM030, CM032, CM033, CM037]
  figureRefs: [FM003]
- id: sizing-and-implications
  title: Market Sizing Lens and Implications for M-KOPA
  body: |
    The most useful sizing lens is not a single TAM number but a layered funnel. At the broadest level are Africans who live within coverage but remain offline, or who have limited electricity, weak documentation, or no formal credit access. Within that group sits the subset that can support daily or weekly repayments if the entry product is priced correctly. Within that subset sits M-KOPA’s current operating wedge: smartphone-led access plus a pathway into higher-value financial products.

    Public evidence supports a very large macro opportunity but also warns against simplistic TAM inflation. Not everyone without electricity needs a financed smartphone; not everyone under coverage can afford data; not everyone with a phone wants or qualifies for credit. What matters for diligence is whether M-KOPA can convert structural demand into repeatable economics faster than taxes, FX pressure, and purchasing-power constraints erode affordability.

    The market conclusion is therefore favorable but conditional. M-KOPA is aimed at a real and persistent category gap with multi-country scale potential. However, the winning model depends on solving the customer’s full affordability stack—device, energy, data, and credit—not merely selling more phones.
  claimRefs: [CM009, CM011, CM015, CM017, CM023, CM027, CM036, CM038]
  figureRefs: [FM004]
tables:
- id: TM001
  title: Market definition table
  columns:
  - Market layer
  - Core unmet need
  - Buyer / user
  - Public evidence
  - Why it matters for M-KOPA
  rows:
  - - Affordable smartphone access
    - Low upfront device cost for first-time or replacement smartphones
    - Informal-income adults and micro-entrepreneurs
    - GSMA, IFC, and M-KOPA all identify device affordability as a core barrier
    - The handset is the gateway product for acquisition and later monetization
  - - Mobile-internet participation
    - Converting coverage into actual usage
    - Covered-but-offline mobile users
    - GSMA shows 95% coverage but only about 40% mobile-internet usage in Africa
    - Device finance only works if users derive recurring value from connectivity
  - - Financial inclusion
    - First account, saving, payments, and small-ticket credit access
    - Unbanked or underbanked adults
    - World Bank Findex shows inclusion gains but continued gaps by income, gender, and documentation
    - Embedded finance can turn a device relationship into a durable credit relationship
  - - Distributed energy access
    - Affordable electricity for households and micro-enterprises
    - Unelectrified or weak-grid households
    - IEA, Lighting Global, and Mission 300 show decentralized energy remains essential
    - Energy access affects charging reliability and productive use of devices
  - - Productive-use financing
    - Turning financed devices into income-generating tools
    - Traders, riders, service workers, and household entrepreneurs
    - M-KOPA says many customers use phones to generate income and improve earnings
    - Supports better repayment behavior and higher lifetime value
  notes: The category is best understood as a convergence market rather than a single traditional vertical.
