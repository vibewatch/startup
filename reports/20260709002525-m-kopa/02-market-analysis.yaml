callouts:
- calloutType: strength
  title: M-KOPA is pointed at a genuine structural market failure
  body: The company is not inventing demand; it is monetizing the gap between coverage and usage, between phone ownership and formal finance, and between electricity need and electricity access.
  claimRefs: [CM001, CM005, CM006, CM012, CM021]
- calloutType: insight
  title: Affordability is the lever that changes everything
  body: Industry sources suggest that relatively small reductions in device cost can unlock tens of millions of additional users. That makes pricing, taxes, and financing design more important than abstract TAM rhetoric.
  claimRefs: [CM009, CM010, CM019, CM034]
- calloutType: risk
  title: Macro demand is large, but monetizable demand is narrower
  body: Many target users still face documentation barriers, gender gaps, energy constraints, and high connectivity costs. The market can look enormous while the conversion pool remains fragile.
  claimRefs: [CM017, CM018, CM024, CM032, CM038]
- calloutType: strength
  title: Energy-access adjacency is still strategically useful
  body: Even as M-KOPA becomes more smartphone-led, the off-grid and productive-energy context remains highly relevant because energy reliability still shapes the utility of digital devices in target markets.
  claimRefs: [CM021, CM023, CM027, CM028, CM037]
