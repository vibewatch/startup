- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary job to be done
  - Key affordability or access barrier
  - Why M-KOPA fits
  - Residual friction
  rows:
  - - First-time smartphone owner
    - Get affordable access to internet-capable device
    - Upfront handset price and taxes
    - Deposit-plus-instalment structure directly addresses initial cash barrier
    - Ongoing data affordability still matters
  - - Informal trader / micro-entrepreneur
    - Use phone for payments, sales, sourcing, and communication
    - Irregular income and weak credit file
    - Daily micropayments match cash-flow pattern better than bank lending
    - Volatile income can still raise delinquency risk
  - - Rural or peri-urban household
    - Combine digital access with resilience and charging reliability
    - Patchy electricity access and distance from formal finance
    - PAYG heritage and off-grid adjacency reduce adoption friction
    - Energy, logistics, and service costs remain higher
  - - Women entering formal finance
    - Obtain first digital tool and first financial products
    - Income, affordability, and documentation gaps
    - M-KOPA’s impact reporting shows first-time smartphone and insurance access for many women customers
    - Gender gaps in account access and handset ownership persist at market level
  - - Credit-thin but connected adult
    - Build repayment record and unlock more services
    - Limited formal history despite phone ownership
    - Device repayment behavior creates a first structured data trail
    - Consumer-protection, collections, and data-privacy risk remain important
  - - Energy-constrained micro-enterprise
    - Keep productive assets charged and connected
    - Weak or expensive grid access
    - Energy-access lineage and device finance can be paired where relevant
    - Universal grid access is still years away in many markets
  notes: Segments are organized around the affordability problem being solved, not around classical demographic marketing buckets.
  enumerationScope:
    coverage: exhaustive
    basis: Covers the main buyer/use-case clusters implied by public market and company evidence.
  claimRefs: [CM002, CM017, CM018, CM020, CM024, CM036, CM038]
- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Evidence
  - Direction
  - Why it helps or hurts M-KOPA
  - Durability
  rows:
  - - Mobile coverage expansion
    - Coverage is already near universal in population terms
    - positive
    - Broadens the potential utility of financed devices
    - durable
  - - Usage-gap persistence
    - Actual mobile-internet use lags coverage badly
    - mixed
    - Creates opportunity, but only if affordability improves
    - durable
  - - Smartphone affordability initiatives
    - GSMA coalition and pilots target $30-$40 4G devices
    - positive
    - Validates the category and could lower acquisition cost
    - medium
  - - Taxes and import duties
    - Device taxes can add 30%+ and should be reduced for sub-$100 phones
    - negative
    - Directly weakens customer affordability and repayment headroom
    - durable
  - - Financial inclusion momentum
    - Account ownership and formal saving are rising in SSA
    - positive
    - Improves readiness for digital repayment and product attachment
    - durable
  - - Electricity-access deficit
    - Hundreds of millions still lack electricity in SSA
    - negative
    - Limits digital productivity and raises importance of distributed-energy solutions
    - durable
  - - Off-grid and Mission 300 capital flows
    - Public programs and blended capital are scaling access investment
    - positive
    - Can improve the surrounding ecosystem for energy-linked and productive-use financing
    - medium
  - - Documentation and gender gaps
    - KYC, phone ownership, and gender gaps remain material
    - negative
    - Slows penetration in precisely the target segments M-KOPA wants to reach
    - durable
  notes: The same factor can be an opportunity and a constraint depending on whether M-KOPA can absorb or offset the customer’s total cost stack.
  enumerationScope:
    coverage: exhaustive
    basis: Summarizes the major public macro drivers and frictions most relevant to category conversion.
