company:
  name: M-KOPA
chapter:
  number: 6
  title: Customers
  summary: 'M-KOPA’s customer base is large, multi-country, and structurally oriented toward informal-income users who need financed access to digital tools. Official evidence supports 3 million active customers and 7 million total customers served, with meaningful country-level traction in Kenya, Nigeria, Ghana, and South Africa. The strongest customer insight is that M-KOPA is not just selling to low-income households; it is serving working customers who use financed devices to earn, communicate, and access their first formal financial products.'
sections:
- id: customer-segments
  title: Customer Segmentation and Core Jobs-to-be-Done
  body: |
    M-KOPA’s public materials consistently describe the target customer as an “every day earner”—someone with irregular income, limited formal credit visibility, and a high need for productive digital tools. This is a more specific and more useful segment definition than “mass market” or “unbanked” because it aligns directly with the repayment design of the product. The customer is often not trying to buy a status smartphone; they are trying to unlock work, payments, savings, communication, or resilience.

    The public segmentation evidence points to several high-value user groups: first-time smartphone owners, micro-entrepreneurs and traders, women entering formal finance or insurance, rural or peri-urban households, and customers who need a productive asset before they can qualify for broader financial products. These jobs-to-be-done are consistent across the country impact reports and customer stories.

    This matters because segmentation discipline is part of underwriting discipline. A customer whose phone is central to daily earnings, supplier coordination, or household resilience is likely to behave differently from a customer buying a discretionary device. M-KOPA’s public customer language repeatedly suggests that it understands this distinction and designs the journey around it.
  claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
  tableRefs: [TU001]
  figureRefs: [FU001]
- id: growth-and-adoption
  title: Growth, Adoption, and Country Trajectory
  body: |
    Public evidence supports large and accelerating customer scale. The company says it has reached 3 million active customers and 7 million total customers since 2011, while country releases show substantial local depth: 4.8 million customers in Kenya, over 1 million in Nigeria, more than 550,000 in Ghana, and over 105,000 in South Africa. Nigeria is especially important because M-KOPA describes it as the fastest market in company history to reach 1 million customers.

    These numbers matter not just as vanity metrics but as evidence of repeatability. M-KOPA is no longer a Kenya-only story. The adoption trajectory across multiple markets supports the thesis that financed smartphone access plus services can travel beyond the company’s original solar and East African roots.

    The customer-base mix also hints at a useful operating pattern: the company can scale in markets where affordability pain is high but digital utility is already obvious. That pattern helps explain why expansion can look fast even without traditional bank-credit infrastructure.
  claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014]
  tableRefs: [TU002]
  figureRefs: [FU002]
- id: proof-and-satisfaction
  title: Customer Proof, Productive Use, and Satisfaction
  body: |
    M-KOPA’s strongest customer proof is usage-linked rather than logo-linked. Official impact materials say many customers get their first smartphone, first formal financial product, or first health insurance through the platform, while a large share use the phone to generate income and report higher earnings. These are not perfect customer-retention metrics, but they are useful signals that the device is economically meaningful rather than discretionary.

    Country- and customer-story evidence reinforces that point. M-KOPA’s customer narratives repeatedly emphasize business growth, higher sales, easier supplier communication, and improved family resilience. Together with the company’s 9-out-of-10 quality-of-life statistic, this supports a credible product-value story even though public churn and cohort-retention data remain sparse.
  claimRefs: [CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022]
  tableRefs: [TU003, TU004]
  figureRefs: [FU003]
- id: retention-and-risk
  title: Retention Signals, Concentration, and Expansion Risk
  body: |
    Public retention disclosure is far weaker than scale disclosure. The company’s “active customers” framing is helpful because it emphasizes sustained engagement rather than raw registrations, but M-KOPA still does not publish cohort retention, repeat borrowing by vintage, or customer-lifetime-value by segment. That forces diligence to use proxies such as repeat product attachment, satisfaction, country expansion, and the productive-use logic of the device.

    The broad market mix reduces single-country concentration risk somewhat, but Kenya remains the deepest customer base and should still be treated as the heart of the franchise. The customer-risk question is therefore not whether M-KOPA has found a market—it clearly has—but whether growth in newer markets can remain high-quality as the company scales beyond its most mature home base. In practice, that means investors should separate customer acquisition volume from customer durability. A market can scale fast because the first-device need is obvious, but still disappoint if repeat usage, support quality, or follow-on product attachment weaken after expansion. The public evidence on this point remains mixed only because it is incomplete, not because it is negative.
  claimRefs: [CU023, CU024, CU025, CU026, CU027, CU028, CU029]
  tableRefs: [TU005]
  figureRefs: [FU004]
