callouts:
- calloutType: strength
  title: Customers appear economically motivated, not merely price sensitive
  body: M-KOPA’s customer evidence repeatedly ties the device to work, earnings, and first-time access to formal tools, which is a stronger value proposition than simple gadget ownership.
  claimRefs: [CU002, CU015, CU016, CU017, CU019]
- calloutType: strength
  title: Multi-country adoption reduces the risk of a one-market franchise
  body: Kenya remains the heart of the business, but Nigeria, Ghana, and South Africa all show enough customer traction to support repeatability beyond the original home market.
  claimRefs: [CU009, CU010, CU011, CU012]
- calloutType: risk
  title: Public retention disclosure still lags public growth disclosure
  body: M-KOPA’s customer story is strong on scale and satisfaction, but investors still lack cohort retention, repeat-purchase, and market-level durability data.
  claimRefs: [CU023, CU024, CU027, CU028]
- calloutType: insight
  title: The best customer proof is the first-product ladder
  body: The same official materials that show first-smartphone access also show first financial-product and first insurance access, reinforcing the idea that M-KOPA’s customer value compounds over time.
  claimRefs: [CU003, CU004, CU005, CU022]
