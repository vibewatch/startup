- id: operational-quality-security
  title: Operational, quality, and security risk
  body: 'M-KOPA now runs a genuinely industrial operating system: more than one million payments per day, tens of thousands of agents, local assembly, financed devices, and digital-financial-service attachments. That scale is a strength, but it also means small operational failures can compound quickly. A bug in device locking, a payment-channel outage, poor repair handling, or breakdowns in agent communication can harm collections, customer trust, and repeat-product uptake at the same time.


    The public record suggests both strength and fragility. Nigeria’s impact report describes 11,000 active direct sales agents and exceptionally low agent turnover, which points to field execution maturity. Kenya’s impact report also emphasizes transparent terms and a refundable-deposit design, suggesting the company is aware of reputational and over-indebtedness risk. But the same materials confirm how central device locking is to enforcement. If the phone is the customer’s work tool, any mistaken lockout or poorly explained restriction can feel less like a missed-payment reminder and more like an interruption to daily income.


    Security and data risk are similarly intertwined with operations. The privacy notice explicitly references web, app, payment, and customer-care data flows, including WhatsApp Business and third-party service providers. The DFC project summary additionally notes the use of private security and conditions linked to environmental and social policies. None of that is evidence of a current breach or abuse; it is evidence that M-KOPA’s operating model touches enough sensitive surfaces that process quality matters as much as headline growth.'
  claimRefs:
