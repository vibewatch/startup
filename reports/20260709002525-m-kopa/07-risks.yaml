- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Shareholder-governance litigation
    - Court or settlement update
    - Adverse ruling, forced restructure, or damaging discovery on share treatment
    - Re-open governance workstream; pause aggressive valuation assumptions.
  - - Collections / device-locking backlash
    - Consumer complaints or regulatory action
    - Evidence of systemic wrongful locks, bureau misuse, or mandated model changes
    - Treat unit-economics thesis as impaired until cure data are reviewed.
  - - Funding squeeze
    - Debt pricing or facility availability
    - Warehouse cost spikes materially or refinance path narrows
    - Lower growth and margin expectations; revisit solvency buffer.
  - - Portfolio-quality deterioration
    - Loss and delinquency data
    - Disclosed loss rates materially exceed single-digit rhetoric in key markets
    - Reduce confidence in receivables leverage and valuation multiple.
  - - Execution strain
    - Service quality or field metrics
    - Sharp rise in agent churn, support backlog, or repair failures
    - Assume CAC and collections friction worsen simultaneously.
  notes: Kill criteria are chosen for their ability to transmit directly into growth, margin, financing, or reputational durability.
