- id: mitigations-monitoring-kill-criteria
  title: Mitigations, monitoring, and thesis-break triggers
  body: 'The mitigation case is credible. M-KOPA’s customer-facing materials repeatedly stress transparent pricing, no hidden fees, no penalties for missed payments, and the ability to return devices for a deposit refund. Nigeria’s agent-retention data suggests the company can keep large field teams productive, while DFI and bank involvement suggests external counterparties have seen enough portfolio quality and policy discipline to keep providing capital. Those are meaningful positives.


    But the remaining diligence burden is still material. Public sources do not disclose consolidated loss curves, country-by-country delinquency, cure rates after device restriction, consumer-complaint volumes, regulatory correspondence, or the final legal and economic effects of the employee-share dispute. Because M-KOPA’s model is so interconnected, the wrong adverse signal can spread fast: a collections controversy can hurt approvals and capital access; a funding squeeze can shrink growth and worsen unit economics; a governance shock can reprice both debt and equity.


    The practical investment stance should therefore use explicit kill criteria. If courts or regulators materially constrain the locking-and-collections model, if warehouse funding tightens sharply, if litigation forces a painful recap or exposes board-process weakness, or if new disclosure reveals loss rates materially above management rhetoric, the thesis needs to be revisited immediately.'
