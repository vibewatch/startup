- id: governance-people-and-execution
  title: Governance, people, and execution risk
  body: 'The public governance picture is strong enough to show sophistication but noisy enough to block a low-risk conclusion. Companies House records show a busy 2025–2026 cycle of allotments, cancellations, resolutions on pre-emption and securities, recreated share classes, adoption of articles, and changes tied to Series F-era financing. None of that is inherently problematic for a late-stage private company. In fact, it may simply reflect maturation and recapitalisation. The problem is that this activity overlaps with contested allegations about dilution, information rights, and differential treatment of employees.


    That overlap is why the share-dispute story matters beyond optics. If investors, employees, and courts are simultaneously testing who was protected, who was diluted, and which jurisdiction controls the dispute, then future rounds may become more expensive or more conditional. The case also creates management-bandwidth risk: leadership must scale five-country operations, maintain collections quality, keep funders confident, and handle litigation and narrative attacks at once.


    Execution risk is therefore less about whether M-KOPA has competent operators and more about whether governance complexity begins to tax the whole machine. The company’s public rebuttals and the continued availability of institutional capital are mitigating signs. They do not fully substitute for board-process transparency, finalized financing terms, or cap-table clarity.'
