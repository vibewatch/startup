companyProfile:
  summary: >-
    M-KOPA was founded in 2010 by Jesse Moore, Nick Hughes, and Chad Larson around a
    pay-as-you-go affordability thesis that combined digital micropayments with connected devices.
    Over time it evolved from solar access into a smartphone-led inclusive-finance platform spanning
    credit, insurance, data, device protection, and additional financed assets across Kenya, Uganda,
    Nigeria, Ghana, and South Africa. Public evidence now supports real late-stage scale and a
    credible unicorn floor, but not full public-market-style underwriting confidence.
  foundedDate: '2010-01-01'
