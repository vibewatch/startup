  productSummary: >-
    Financed smartphones and other productive assets that become an entry point to digital loans,
    health insurance, device protection, data bundles, and broader financial inclusion services.
  customerFocus: >-
    Everyday earners and other consumers with irregular income who need productive digital access,
    flexible repayments, and an on-ramp into formal financial products.
  businessModel: >-
    A receivables-heavy inclusive-fintech model: customers pay a deposit and regular installments on
    connected assets, M-KOPA manages collections and device control, and then monetizes adjacent
    services around that installed base.
  stage: Late-stage private / unicorn
  fundingStatus: >-
