  claims:
  - id: CO001
    statement: M-KOPA was founded in 2010 around a pay-as-you-go affordability thesis that combined daily digital micropayments with embedded device connectivity.
    type: company-claimed
    topic: founding
    sourceRefs: [SO009]
    confidence: medium
    freshness: historical
    answersQuestionRefs: [QO001]
  - id: CO002
    statement: Public reporting consistently identifies Jesse Moore, Nick Hughes, and Chad Larson as M-KOPA’s founding trio, even though current company materials emphasize Jesse Moore most prominently.
    type: third-party-reported
    topic: founders
    sourceRefs: [SO022, SO023]
    confidence: medium
    freshness: historical
    answersQuestionRefs: [QO002]
  - id: CO003
    statement: The company began with solar lighting and home-energy products, added solar appliances, launched smartphones in 2020, and was testing electric-motorbike offerings by 2023.
    type: company-claimed
    topic: business-model-evolution
    sourceRefs: [SO009, SO016]
    confidence: medium
    freshness: historical
    answersQuestionRefs: [QO001, QO003]
  - id: CO004
    statement: As of the runDate, M-KOPA publicly identifies Kenya, Uganda, Nigeria, Ghana, and South Africa as its operating markets.
    type: company-claimed
    topic: geography
    sourceRefs: [SO001, SO003]
    confidence: high
    freshness: current
    answersQuestionRefs: [QO004]
  - id: CO005
    statement: M-KOPA’s parent presents as London-headquartered, while Nairobi functions as the core operating and assembly hub in public company materials.
    type: company-claimed
    topic: headquarters
    sourceRefs: [SO001, SO005]
    confidence: medium
    freshness: current
    answersQuestionRefs: [QO004]
  - id: CO006
    statement: The business model is a small initial deposit followed by daily digital micropayments for productive assets and related services.
    type: company-claimed
    topic: business-model
    sourceRefs: [SO001, SO018]
    confidence: high
    freshness: current
    answersQuestionRefs: [QO005]
  - id: CO007
