summary:
  headline: >-
    Research more: M-KOPA looks like a scaled pan-African fintech with credible unicorn economics, but public evidence
    still does not justify paying a large premium above roughly $1.7 billion without lender-grade portfolio, cap-table,
    and governance disclosure.
