- id: recommendation-scenarios-and-diligence-thresholds
  title: Recommendation, scenarios, and diligence thresholds
  body: 'The practical recommendation is research-more with medium confidence, not because M-KOPA looks weak, but because public evidence still leaves too much room for valuation error above the low-to-mid unicorn range. The base case should cluster around roughly $1.3 billion to $1.7 billion, which is consistent with a 3x–4x multiple on the strongest public 2024 revenue anchor and a modest premium for continued profitable growth. The bear case falls toward about $1.0 billion to $1.2 billion if governance overhang, funding cost, or portfolio-quality disclosure disappoints. The bull case extends to roughly $2.1 billion to $2.5 billion if management can show clean 2025 scale-up, durable profitability, low losses, and a post-litigation cap table that does not spook either debt or equity investors.


    That framework is intentionally price-sensitive. It allows room for the user-supplied unicorn characterization while still respecting the evidence gap. If a transaction clears near $1.0 billion to $1.5 billion, the stance improves toward fair. If it pushes materially above $2.0 billion without prospectus-grade or lender-grade disclosure, the stance becomes stretched. Investors should not confuse proof of company quality with proof of price support.'
