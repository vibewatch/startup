    - Provide lender-grade portfolio data, final Series F economics, and cleaner governance disclosure.
  - - Confidence
    - medium
    - Revenue and profitability anchors are meaningful, but the cap table and loss-rate picture are still incomplete.
    - Audited or lender-grade 2025 financial and portfolio disclosure.
  - - Risk rating
    - high
    - The main risk is paying too much for an operationally complex, private, receivables-heavy model on incomplete disclosure.
    - Better visibility on losses, dilution, and legal overhang.
  - - Valuation stance
    - fair near $1.3B–$1.7B; stretched above $2.0B
    - A 3x–4x multiple on the strongest public revenue anchor is supportable; larger premiums need more proof.
    - Evidence of stronger 2025 revenue, low losses, and clean governance outcomes.
  - - Decision implication
    - Do not underwrite aggressive premium pricing on today’s public evidence
    - The franchise is credible, but price discipline matters more than brand narrative.
    - Engage more positively at fairer entry levels or after disclosure quality improves.
