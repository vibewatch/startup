- id: what-the-financial-base-can-support
  title: What the current financial base can support
  body: 'The financial question is less whether M-KOPA deserves to be called a scale company and more what multiple that scale can reasonably command. A fintech with $416 million of revenue, positive profit, multi-country growth, and strong funding relationships is not a distressed asset. But M-KOPA is also not a clean software or pure-payments platform. It is a receivables-heavy, operationally intensive, emerging-market financing business with device supply, collections, treasury, and governance complexity layered into the model. That should create a discount versus cleaner public fintech franchises even when growth is impressive.


    A simple revenue-multiple framing is therefore more defensible than false precision around discounted cash flow. At roughly 2.5x 2024 revenue, the equity value is about $1.0 billion. At 3.5x, about $1.46 billion. At 5.0x, about $2.08 billion. A 6.0x stretch case would imply about $2.5 billion. Those numbers suggest that the public record can support a credible unicorn outcome, but it does not comfortably support an unlimited premium without better disclosure on loss rates, working-capital intensity, and post-Series-F dilution.'
