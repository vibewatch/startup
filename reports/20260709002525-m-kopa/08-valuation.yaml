- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Topic
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale and growth
    - M-KOPA has reached late-stage scale with reported $416M of 2024 revenue and continued profitable growth messaging.
    - The best hard financial anchor is still media-mediated rather than prospectus-grade issuer disclosure.
    - Direct audited 2025 financials.
  - - Capital stack
    - Institutional debt and strategic investors imply third-party confidence in the receivables model.
    - Funding dependence means bad portfolio or governance news can reprice the business quickly.
    - Warehouse covenant and loss-rate disclosure.
  - - Unicorn plausibility
    - A low-single-digit revenue multiple already gets M-KOPA above $1B.
    - The same math does not automatically justify a multi-billion premium.
    - Clear 2025 revenue and profit step-up with stable losses.
  - - Governance
    - Public rebuttals and continued financing suggest the litigation is not existential today.
    - The dispute still creates discovery, reputation, and cap-table uncertainty.
    - Resolved or de-risked litigation and transparent post-Series-F cap table.
  - - Comparables
    - High-growth fintech comps show investors can pay rich multiples for quality growth.
    - M-KOPA deserves a discount to cleaner public fintech models because it is private, emerging-market, and receivables-heavy.
    - Proof that loss rates, treasury, and governance are cleaner than feared.
  notes: The table separates company quality from valuation support and highlights where M-KOPA should trade at a discount to cleaner public fintechs.
