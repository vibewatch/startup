      - CR024
      - CR025
      - CR026
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a chain from real scale and funding support to a price-sensitive conclusion constrained
      by governance and disclosure gaps.
    data:
      nodes:
        - id: scale
          label: Scale is real
          detail: 2024 revenue and customer evidence support late-stage relevance.
        - id: growth
          label: Growth still strong
          detail: Company says 2024 growth exceeded 65% and remained profitable into 2026.
        - id: support
          label: Capital support exists
          detail: DFIs, banks, and strategic investors still appear engaged.
        - id: gaps
          label: Disclosure gaps remain
          detail: Loss curves, cap table, and final financing terms remain incomplete.
        - id: discount
          label: Discount warranted
          detail: Private, EM, receivables, and governance risks justify valuation discount.
        - id: call
          label: Research-more
          detail: Fair near low-to-mid unicorn levels; stretched above $2B without better proof.
      edges:
        - from: scale
          to: growth
          label: supports
        - from: growth
          to: support
          label: reinforces
        - from: support
          to: gaps
          label: does not remove
        - from: gaps
          to: discount
