      - number: '6.2'
        title: Growth, Adoption, and Country Trajectory
        blocks:
          - type: paragraph
            body: >
              Public evidence supports large and accelerating customer scale. The company says it has reached 3 million
              active customers and 7 million total customers since 2011, while country releases show substantial local
              depth: 4.8 million customers in Kenya, over 1 million in Nigeria, more than 550,000 in Ghana, and over
              105,000 in South Africa. Nigeria is especially important because M-KOPA describes it as the fastest market
              in company history to reach 1 million customers.


              These numbers matter not just as vanity metrics but as evidence of repeatability. M-KOPA is no longer a
              Kenya-only story. The adoption trajectory across multiple markets supports the thesis that financed
              smartphone access plus services can travel beyond the company’s original solar and East African roots.


              The customer-base mix also hints at a useful operating pattern: the company can scale in markets where
              affordability pain is high but digital utility is already obvious. That pattern helps explain why
              expansion can look fast even without traditional bank-credit infrastructure.
