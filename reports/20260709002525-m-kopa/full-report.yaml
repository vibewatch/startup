      - number: '3.2'
        title: Direct PAYG and Connected-Asset Peers
        blocks:
          - type: paragraph
            body: >
              Sun King is the clearest adjacent peer because it combines last-mile distribution, flexible financing, and
              an explicit move into affordable smartphones. Its smartphone narrative is still more energy-centric than
              M-KOPA’s, but the overlap is real: both firms pair financed devices with affordability messaging, local
              assembly, and the argument that connectivity drives productivity and inclusion. d.light belongs in the
              same broad family, though its public positioning remains more rooted in solar and appliances than in a
              broader fintech stack.


              Bboxx and Asopo form a different kind of peer set. Bboxx still presents itself as a company delivering
              clean energy, smartphones, e-mobility, and financing to millions, but Asopo makes the backend logic more
              explicit: operations, payments, credit scoring, customer management, and even asset locking are available
              as a modular platform. That suggests a competitor can arise either as a branded consumer provider or as a
              white-label enablement layer for others.


              Izili adds another version of the playbook: access to energy and digital products financed through
              partnerships with MFIs and telcos. Relative to M-KOPA, Izili looks more partnership-led and more
              West/francophone Africa tilted, but it reinforces that the category is broadening beyond one or two East
              African pioneers.
