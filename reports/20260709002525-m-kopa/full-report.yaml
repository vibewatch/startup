      - number: '4.2'
        title: Unit Economics, Credit Design, and Collections Logic
        blocks:
          - type: paragraph
            body: >
              M-KOPA’s public financial logic depends on cash-flow matching more than on conventional unsecured lending.
              Customers pay a deposit, receive the device immediately, and then repay in small fixed installments that
              fit irregular income cycles. This matters because the company is not relying solely on court-based
              recovery or floating-rate consumer credit to protect returns; the financed asset itself can be restricted
              or unlocked based on repayment status.


              Public reporting from Nigeria sharpens that logic. Condia describes M-KOPA’s model as cost-based rather
              than interest-led, with fixed total repayment and embedded device enforcement rather than repossession
              through the courts. It also reports management commentary that Nigerian loss rates are single digit and
              the market has the strongest repayment performance across M-KOPA’s geographies. These are not audited
              unit-economics disclosures, but they point toward why institutional receivables finance has remained
              available.


              The main disclosure gap is that public materials still do not provide vintage curves, charge-offs, net
              interest-equivalent margins, funding cost by warehouse, or loss-adjusted contribution by product cohort.
            claimRefs:
              - CI008
              - CI009
