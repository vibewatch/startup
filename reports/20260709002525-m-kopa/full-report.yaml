      - number: '3.3'
        title: Handset-Financing Substitutes and Telco Channels
        blocks:
          - type: paragraph
            body: >
              Handset-focused BNPL substitutes are strategically important even when they do not replicate M-KOPA’s full
              services stack. EasyBuy’s public proposition is intentionally simple: pay a deposit, take the phone, then
              repay weekly or monthly. MTN EasyBuy and related operator-linked programs use a similar framing while
              leveraging brand trust, SIM relationships, stores, and onboarding data. Safaricom’s Lipa Mdogo Mdogo
              offers the same kind of threat in Kenya, where M-PESA distribution and customer familiarity can lower
              acquisition friction.


              These substitutes can matter disproportionately because they narrow the competition to the customer’s
              first decision: how to get a phone affordably. If a rival wins that entry point cheaply through telco or
              OEM rails, M-KOPA loses not only the device sale but also the chance to build a repayment history and
              attach loans, insurance, or data-related services later. This is why a narrower product can still be a
              serious competitive threat.


              At the same time, these challengers often look shallower than M-KOPA once the stack is examined carefully.
              Their public materials emphasize device affordability and payment mechanics more than an integrated ladder
              into broader financial products, which suggests M-KOPA still has room to defend on breadth and lifetime
              value.
