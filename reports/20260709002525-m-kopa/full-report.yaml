      - number: '1.3'
        title: Funding History, Capital Providers, and Balance-Sheet Support
        blocks:
          - type: paragraph
            body: >
              M-KOPA has financed its expansion through a layered mix of equity, warehouse-style receivables funding,
              and sustainability-linked debt rather than through venture equity alone. The most clearly disclosed
              step-change came in 2023, when the company announced more than $250 million of new financing, including
              Sumitomo-backed equity and a debt package led by Standard Bank. IFC described its own participation as
              part of a broader five-year $202 million facility, while DFC separately approved a $51 million loan to
              support a much larger pool of Kenyan receivables and cash loans.


              This capital structure is strategically important. M-KOPA finances productive assets for customers with
              limited formal credit history, so the business is capital intensive even when unit economics are
              attractive. The presence of IFC, DFC, BII, Sumitomo, Standard Bank, and other institutional partners
              signals that the company has persuaded serious capital providers that its underwriting, collections, and
              impact metrics are credible enough to support structured financing. That is a competitive advantage
              relative to smaller PAYG or device-finance competitors that struggle to refinance receivables efficiently.


              Public reporting in 2025 also points to a new late-stage financing cycle. ImpactAlpha reported that M-KOPA
              had secured a roughly $160 million Series F term sheet led by Sumitomo, but also noted that secondary
              sales and employee-shareholder rights had become contentious during the process. The key diligence
              implication is that M-KOPA appears financeable at scale, yet late-stage capital access is now intersecting
              with governance friction rather than sitting above it.
            claimRefs:
              - CO015
              - CO016
              - CO017
              - CO018
              - CO019
              - CO037
              - CO038
