  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Portfolio-quality disclosure disappoints
        - Losses, charge-offs, or delinquency meaningfully exceed the benign public narrative
        - Weakens margin, receivables leverage, and investor confidence
        - Rebase valuation toward the bear case.
      - - Governance overhang escalates
        - Adverse litigation event, damaging discovery, or contentious recap outcome
        - Raises dilution and financing risk
        - Apply larger private-company discount.
      - - Funding cost rises materially
        - Warehouse or debt refinancing becomes clearly more expensive or constrained
        - Pressures growth and unit economics
        - Lower acceptable multiple.
      - - 2025 financial scale disappoints
        - Revenue or profitability fails to step up from the 2024 base
        - Undercuts bull and upper-base cases
        - Keep valuation near the low end of the range.
      - - Regulatory / customer-treatment constraint
        - Authorities or courts materially constrain lock-based enforcement or collections
        - Impairs the model’s core collateral logic
        - Treat the current thesis as broken until remediation is proven.
    notes: >-
      These triggers are chosen because they map directly into valuation, not because they are merely headline-risk
      events.
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - 2025 audited financials
        - Revenue, gross profit, EBITDA / EBIT, cash flow, and country mix
        - Needed to move from boundary-setting to underwriting
        - Request management pack and audited statements.
      - - Portfolio quality
        - Vintage curves, charge-offs, cure rates, recoveries, and cash-loan loss rates
        - Core to funding durability and equity value
        - Request lender-grade portfolio deck.
      - - Cap table and preference stack
        - Post-Series-F ownership, preference terms, secondary volume, and option pool status
        - Needed to judge true equity value per new dollar invested
        - Review financing docs and cap-table model.
      - - Litigation status
        - Current pleadings, jurisdiction outcomes, board-process evidence, and any settlement path
        - Determines governance discount and overhang duration
        - Legal diligence with Kenya and UK counsel.
      - - Funding maturity ladder
        - Warehouse providers, tenors, covenants, and FX / hedging policy
        - Needed to test resilience under stress
        - Treasury diligence and lender reference calls.
    notes: These asks are the minimum required to move from a research-more recommendation to a firmer price call.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV038
      - CV040
