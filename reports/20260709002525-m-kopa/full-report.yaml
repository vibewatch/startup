  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Why the Category Exists
        blocks:
          - type: paragraph
            body: >
              M-KOPA’s real market is not just “off-grid solar” and not just “consumer lending.” It sits in the overlap
              of affordable smartphone access, distributed energy access, and formal financial inclusion for people
              whose incomes are irregular, daily, and often invisible to mainstream banks. The company’s own language
              about “every day earners” is useful because it captures the underlying customer reality better than
              generic labels like unbanked or low-income.


              This overlap exists because African digital participation remains supply-rich but conversion-poor. In
              recent GSMA data, most of the population lives under mobile broadband coverage, yet actual mobile-internet
              use lags far behind. World Bank and ITU material shows the same pattern from a different angle: accounts,
              savings, and connectivity are improving, but affordability, documentation, device ownership, and service
              reliability still stop large numbers of people from joining the formal digital economy.


              M-KOPA’s category therefore should be understood as a convergence market. Device financing matters because
              the smartphone is the gateway product; energy access matters because productive digital use depends on
              reliable charging and off-grid alternatives; and digital finance matters because the end goal is not a
              handset sale but a durable customer relationship built on repayment behavior and product attachment.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
              - CM012
              - CM018
              - CM036
