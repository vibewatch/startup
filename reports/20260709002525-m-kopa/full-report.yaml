  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Governance litigation and funding dependence are the most consequential risks because they can spread into
      collections, capital access, and valuation at once.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
