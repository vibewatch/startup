      - number: '4.3'
        title: Capital Stack, Debt Facilities, and Balance-Sheet Support
        blocks:
          - type: paragraph
            body: >
              M-KOPA’s capital structure is a core competitive asset. The 2023 financing package combined strategic
              equity from Sumitomo with a large debt facility led by Standard Bank, while IFC and DFC separately
              disclosed meaningful support tied to receivables growth and sustainability-linked targets. BII’s
              historical investment page adds a longer-dated DFI lineage, showing that M-KOPA has attracted both impact
              and commercially minded capital over multiple stages.


              This matters because the business is inherently capital intensive. Devices are delivered upfront while
              cash comes back over time, so scale requires both underwriting discipline and reliable refinancing. The
              existence of multi-year facilities, sustainability-linked structures, local-currency components, and DFI
              participation implies that outside financiers view M-KOPA as more than a consumer-gadget reseller.


              The risk is that capital-market access can tighten precisely when governance becomes noisier.
              ImpactAlpha’s 2025 Series F reporting and the related employee-share dispute suggest that future capital
              may become more expensive or more conditional if investors demand cleaner cap-table and governance
              visibility.
