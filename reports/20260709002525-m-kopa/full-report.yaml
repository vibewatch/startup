  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The highest-risk paths run from customer treatment and portfolio quality into both capital availability and
      reputational trust.
    data:
      nodes:
        - id: lock
          label: Locking / collections event
          detail: A fairness or execution issue emerges in device restriction or recovery.
        - id: trust
          label: Customer trust erosion
          detail: Customers become less willing to repay, refer, or upgrade.
        - id: loss
          label: Portfolio-loss pressure
          detail: Lower cure rates and higher losses weaken receivables quality.
        - id: fund
          label: Funding repricing
          detail: Warehouse or DFI-backed capital becomes more expensive or constrained.
        - id: growth
          label: Origination slowdown
          detail: Approvals, affordability, or market expansion weaken.
        - id: margin
          label: Margin compression
          detail: Higher CAC, funding cost, or collections cost compress economics.
        - id: value
          label: Valuation pressure
          detail: Investors reduce acceptable multiple or demand more diligence.
      edges:
        - from: lock
          to: trust
          label: can trigger
        - from: trust
          to: loss
          label: weakens repayment
        - from: loss
          to: fund
          label: reprices
        - from: fund
          to: growth
          label: constrains
        - from: fund
          to: margin
          label: raises cost
        - from: growth
          to: value
          label: reduces upside
        - from: margin
          to: value
          label: compresses
    claimRefs:
