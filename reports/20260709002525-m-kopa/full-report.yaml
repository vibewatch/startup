        - Funding costs rise, litigation worsens, or disclosed loss and dilution data weaken confidence.
        - 1.0–1.2
        - 20–30%
        - Either disclosure disappoints or the market applies a stronger private/EM/receivables discount.
    notes: Ranges are deliberately broad because the public record supports boundary-setting better than point precision.
