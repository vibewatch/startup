      - number: '1.4'
        title: Scale, Country Traction, and Evidence of Product-Market Fit
        blocks:
          - type: paragraph
            body: >
              Official 2025-2026 company disclosures support unusually strong operating scale for a private African
              fintech. M-KOPA says it has reached 3 million active customers, served 7 million total customers since
              2011, deployed over $2 billion in cumulative credit, and now onboards more than 10,000 new customers per
              day. Those figures suggest the company has moved from proving product-market fit to compounding a
              continent-scale distribution and underwriting engine.


              Country-level evidence reinforces that conclusion. Kenya remains the deepest market, with 4.8 million
              customers, KES 207 billion of unlocked credit, 2 million phones assembled locally, and significant tax and
              procurement contribution. Nigeria has become the fastest market to reach 1 million customers; Ghana has
              already reached over 550,000 customers with nationwide regional coverage; and South Africa surpassed
              100,000 customers quickly after launch. This is not a single-country business wearing a pan-African
              label—there is real evidence of repeatability across multiple operating environments.


              Importantly, M-KOPA’s traction is not framed only in customer-count terms. Its own impact reporting says
              the platform frequently creates a customer’s first smartphone, first formal financial product, or first
              health-insurance relationship. That combination of digital-access wedge plus downstream financial-product
              attachment is what makes the company strategically more interesting than a narrow device financier. It
              also explains why investor backing has remained available despite the complexity of the model.
