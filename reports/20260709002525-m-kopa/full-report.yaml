      - number: '2.4'
        title: Energy Access Still Shapes the Addressable Market
        blocks:
          - type: paragraph
            body: >
              Energy access remains a first-order variable in M-KOPA’s market even as the company has shifted toward
              smartphones. Lighting Global, ESMAP, Mission 300, and IEA all point to the same conclusion: sub-Saharan
              Africa still contains the overwhelming majority of global electricity-access deficits, and decentralized
              solutions will be required to close them. Off-grid solar is already delivering a large share of new access
              connections and remains the least-cost path for a substantial portion of the remaining unelectrified
              population.


              That matters for M-KOPA in two ways. First, the company’s historical expertise in PAYG energy is still
              strategically useful because charging, resilience, and household energy economics affect the utility of
              financed devices. Second, a customer who needs help financing power, not just a phone, is often the same
              customer who is underserved by mainstream credit. In that sense, the smartphone-finance market and the
              off-grid-energy market are not separate markets—they are adjacent expressions of the same affordability
              problem.


              The macro constraint is that energy access is improving too slowly. IEA and Lighting Global both show that
              hundreds of millions of Africans could still be without electricity by 2030 under current trajectories.
              That prolongs the relevance of PAYG, distributed energy, and blended-finance models even in a chapter
              focused on smartphones and digital access.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
