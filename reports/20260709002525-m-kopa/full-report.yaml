  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Scale and Monetization Logic
        blocks:
          - type: paragraph
            body: >
              M-KOPA’s monetization engine is visible in structure even when private-company disclosure is incomplete.
              The company finances devices and productive assets, collects daily or periodic repayments, and then layers
              additional financial and protection products around that installed base. That creates at least three
              monetization rails: margin on financed assets, recurring repayment-linked economics, and revenue from
              adjacent services such as loans, insurance, data, and device protection.


              Public disclosures do not provide a full segment P&L, but the scale signal is increasingly credible.
              M-KOPA’s own 2026 commentary says revenue grew more than 65% in 2024 and that growth remained profitable
              through 2025 and into 2026. A separate company narrative framed the business at about $400 million of ARR.
              TechCabal then added a stronger but media-mediated data point: KES 53.7 billion of 2024 revenue, or
              roughly $416 million, based on UK filings.


              This combination suggests a business that has crossed from “high growth with uncertain scale” into “large
              enough that funding structure and margin quality matter more than top-line proof.”
