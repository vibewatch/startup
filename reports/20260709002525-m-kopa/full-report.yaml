      - number: '6.4'
        title: Retention Signals, Concentration, and Expansion Risk
        blocks:
          - type: paragraph
            body: >
              Public retention disclosure is far weaker than scale disclosure. The company’s “active customers” framing
              is helpful because it emphasizes sustained engagement rather than raw registrations, but M-KOPA still does
              not publish cohort retention, repeat borrowing by vintage, or customer-lifetime-value by segment. That
              forces diligence to use proxies such as repeat product attachment, satisfaction, country expansion, and
              the productive-use logic of the device.


              The broad market mix reduces single-country concentration risk somewhat, but Kenya remains the deepest
              customer base and should still be treated as the heart of the franchise. The customer-risk question is
              therefore not whether M-KOPA has found a market—it clearly has—but whether growth in newer markets can
              remain high-quality as the company scales beyond its most mature home base. In practice, that means
              investors should separate customer acquisition volume from customer durability. A market can scale fast
              because the first-device need is obvious, but still disappoint if repeat usage, support quality, or
              follow-on product attachment weaken after expansion. The public evidence on this point remains mixed only
              because it is incomplete, not because it is negative.
