      - number: '1.5'
        title: Milestones, Financial Inflection, and Adverse Context
        blocks:
          - type: paragraph
            body: >
              M-KOPA’s recent story includes both positive operating inflections and material adverse context. On the
              positive side, the company’s own 2026 commentary says revenue grew more than 65% in 2024 and that growth
              remained profitable through 2025 and into 2026. TechCabal, citing UK filings, went further and reported
              roughly $416 million of 2024 revenue and a first-ever annual profit. If sustained, that moves M-KOPA out
              of the usual “high-growth, capital-dependent, still-lossmaking” late-stage bucket.


              At the same time, public evidence around employee shareholding and recapitalization risk is meaningful.
              TechCabal, Business & Human Rights Resource Centre, and a Kenya Law ruling all describe a former
              employee-led petition alleging that M-KOPA’s growth-share structure disadvantaged African employees while
              protecting investors and expatriate staff. M-KOPA has strongly denied the allegations, published
              rebuttals, and challenged the Kenyan court’s jurisdiction. The case does not yet prove underlying
              wrongdoing, but it is a real governance event attached to a financing cycle, not a fringe complaint.


              The practical diligence takeaway is that M-KOPA has achieved enough scale and profitability to merit
              serious late-stage attention, but the governance premium investors might otherwise pay for that progress
              should be tempered until post-2025 share-class and secondary-liquidity issues are better understood.
