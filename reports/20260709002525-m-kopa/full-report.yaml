      - number: '2.3'
        title: Affordability is the Core Constraint, Not Coverage
        blocks:
          - type: paragraph
            body: >
              The most important market constraint is affordability, not theoretical connectivity. GSMA repeatedly
              describes handset affordability as the single largest barrier to mobile internet adoption in sub-Saharan
              Africa. Its 2025-2026 coalition work suggests that a $40 smartphone could bring another 20 million people
              online in the region, while a $30 device could unlock up to 50 million additional users. The same source
              set also highlights taxes and import duties as a major distortion: in some countries, fiscal policy adds
              more than 30% to entry-level device cost.


              World Bank and IFC evidence supports the same thesis from adjacent angles. IFC noted that even after
              improvement, smartphone affordability in sub-Saharan Africa remained the worst among emerging regions.
              World Bank Findex material shows that millions of financially excluded adults already have phones—or even
              smartphones—but still lack formal accounts, meaning the issue is not pure absence of hardware alone. ITU
              then broadens the point by showing how lower-income consumers still pay a far larger share of income for
              basic connectivity than users in richer markets.


              The implication is simple: the market is large, but conversion is brutally sensitive to unit economics.
              Any company that can cut upfront device cost, spread payments, and reduce the total cost of staying
              connected can unlock demand that conventional retail models misread as non-existent.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM010
              - CM019
              - CM020
              - CM034
