            body: >
              M-KOPA’s strongest customer proof is usage-linked rather than logo-linked. Official impact materials say
              many customers get their first smartphone, first formal financial product, or first health insurance
              through the platform, while a large share use the phone to generate income and report higher earnings.
              These are not perfect customer-retention metrics, but they are useful signals that the device is
              economically meaningful rather than discretionary.


              Country- and customer-story evidence reinforces that point. M-KOPA’s customer narratives repeatedly
              emphasize business growth, higher sales, easier supplier communication, and improved family resilience.
              Together with the company’s 9-out-of-10 quality-of-life statistic, this supports a credible product-value
              story even though public churn and cohort-retention data remain sparse.
