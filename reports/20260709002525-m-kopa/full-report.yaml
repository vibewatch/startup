      - number: '2.5'
        title: Market Sizing Lens and Implications for M-KOPA
        blocks:
          - type: paragraph
            body: >
              The most useful sizing lens is not a single TAM number but a layered funnel. At the broadest level are
              Africans who live within coverage but remain offline, or who have limited electricity, weak documentation,
              or no formal credit access. Within that group sits the subset that can support daily or weekly repayments
              if the entry product is priced correctly. Within that subset sits M-KOPA’s current operating wedge:
              smartphone-led access plus a pathway into higher-value financial products.


              Public evidence supports a very large macro opportunity but also warns against simplistic TAM inflation.
              Not everyone without electricity needs a financed smartphone; not everyone under coverage can afford data;
              not everyone with a phone wants or qualifies for credit. What matters for diligence is whether M-KOPA can
              convert structural demand into repeatable economics faster than taxes, FX pressure, and purchasing-power
              constraints erode affordability.


              The market conclusion is therefore favorable but conditional. M-KOPA is aimed at a real and persistent
              category gap with multi-country scale potential. However, the winning model depends on solving the
              customer’s full affordability stack—device, energy, data, and credit—not merely selling more phones.
            claimRefs:
              - CM009
              - CM011
              - CM015
              - CM017
              - CM023
              - CM027
              - CM036
              - CM038
