  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and customer-fairness risk
        blocks:
          - type: paragraph
            body: >-
              M-KOPA’s legal and regulatory risk is less about missing permission to operate and more about how its
              model behaves when customer treatment, data handling, and shareholder rights are contested. The company’s
              privacy materials show a broad data footprint: purchase and payment data, device identifiers, publicly
              available information, partner-provided information, cross-border processing, and sharing with group
              companies, service providers, credit bureaus, debt collectors, and authorities. That breadth is
              understandable for underwriting and collections, but it also raises the threshold for consent quality,
              disclosures, and country-by-country compliance discipline.


              The most visible legal overhang is the employee-share litigation in Kenya. Court materials, Business &
              Human Rights coverage, and TechCabal’s reporting all point to a live dispute over whether local African
              employees were disadvantaged by the creation of Growth Shares and later recapitalisation steps. M-KOPA
              publicly rejects the allegations and frames the case as misinformation or a jurisdictionally misplaced
              challenge, but the existence of the litigation matters even if the company ultimately prevails. It creates
              discovery, reputation, and financing-process risk at exactly the moment when late-stage capital and
              secondary liquidity appear strategically important.


              Customer-fairness risk cuts in both directions. Kenya impact materials and company FAQs argue that device
              locking is paired with no hidden fees, no late-payment penalties, and a refundable deposit if the product
              is returned. Those are meaningful mitigants. But they do not eliminate the risk that regulators, courts,
              or consumer advocates could still object if device restriction, collections, or bureau-sharing practices
              are judged too aggressive in specific markets.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
