      - number: '2.2'
        title: 'Demand Drivers: Connectivity, Finance, and Informal-Economy Scale'
        blocks:
          - type: paragraph
            body: >
              Demand is underwritten by several deep macro drivers. First, Africa’s mobile economy is already
              economically large and still expanding. GSMA Intelligence estimates the sector contributed $220 billion to
              the continent’s economy in 2024 and could reach $270 billion by 2030. Second, financial inclusion has
              clearly improved, with World Bank reporting sub-Saharan African account ownership reaching 58% of adults
              in 2024 and formal savings rising materially. Third, M-KOPA’s own disclosures and adjacent industry
              sources point to a vast pool of non-salaried and informal-income workers who need productive tools but
              cannot access conventional consumer finance.


              These drivers are complementary. Formal account growth makes repayment and wallet-linked behavior more
              tractable. Greater mobile coverage raises the ceiling for device utility. Faster digitization of payments,
              savings, and commerce increases the value of a first smartphone. That is why the market can expand even
              without universal grid access or universal banking: progress in one layer increases the economic return of
              solving the others.


              M-KOPA benefits most where this convergence is strongest—economies with deep mobile-money rails, large
              informal workforces, meaningful usage gaps, and a customer base that can monetize a financed device
              quickly. Kenya is the clearest example, but Nigeria and Ghana show that the broader regional pattern is
              repeatable.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM012
              - CM013
              - CM014
              - CM016
              - CM036
          - type: table
            tableRef: TM002
            claimRefs:
