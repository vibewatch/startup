chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >
              M-KOPA was founded in 2010 around a simple but powerful thesis: if daily digital micropayments could be
              combined with embedded device connectivity, underbanked African households could obtain productive assets
              that were unaffordable upfront. The company started with solar lighting and home-energy systems, then
              expanded into appliances, smartphones in 2020, and mobility-related products and pilots by 2023. That arc
              matters because the business is no longer best described as a pure off-grid solar company; it is now a
              connected-asset financing and inclusive-fintech platform.


              Public company materials show a five-country operating footprint spanning Kenya, Uganda, Nigeria, Ghana,
              and South Africa. M-KOPA’s parent presents itself as London-headquartered, but the operating center of
              gravity remains in East Africa, with Nairobi functioning as the key commercial, assembly, and execution
              hub. The current consumer proposition is explicitly broader than hardware financing: the company positions
              “More than a Phone” as a way to turn a financed handset into an on-ramp for loans, insurance, data access,
              and a recurring financial relationship.


              This model is structurally differentiated from a traditional retail installment plan because device
              connectivity, repayment collection, and credit expansion are tightly linked. Company and investor
              materials consistently describe the commercial loop as a small initial deposit, followed by daily digital
              micropayments, with the financed device becoming both the customer acquisition wedge and the behavioral
              data source for future underwriting. That is the central lens for the rest of the diligence: M-KOPA is
              using connected assets to build a credit and services stack for “every day earners,” not merely selling
              solar kits or smartphones on time.
            claimRefs:
