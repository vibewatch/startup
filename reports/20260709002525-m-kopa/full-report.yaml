      - number: '3.4'
        title: Where M-KOPA Appears Stronger—and Where It Is Exposed
        blocks:
          - type: paragraph
            body: >
              M-KOPA appears strongest where multiple capabilities must work together: financed-device control,
              distribution through thousands of agents, underwriting for irregular incomes, and a broader service bundle
              after acquisition. The Condia account of M-KOPA’s Nigerian model is helpful here because it makes the
              enforcement advantage explicit. A remote-locking handset is not just a financed product; it is an
              unusually effective form of collateral in markets where court-led repossession is slow and expensive.


              The company is more exposed where rivals can unbundle the experience. Sun King can compete with a similar
              PAYG and assembly story; Asopo can arm other operators or financiers with backend tooling; and telcos can
              use stores, SIM relationships, and wallet rails to compete for the same device-financing use case at lower
              customer-acquisition cost. None of those forces alone fully replicates M-KOPA, but together they compress
              differentiation if the company fails to keep widening the service gap.


              The competitive answer, therefore, is not that M-KOPA has no peers; it is that its moat is combinational.
              It wins if customers and capital providers value the entire stack. It weakens if the market decides that
              the first financed handset is the only product that really matters.
