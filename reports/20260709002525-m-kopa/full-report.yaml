      - CR019
      - CR020
      - CR021
      - CR037
      - CR040
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      M-KOPA depends on a tightly linked web of funders, OEMs, service providers, and regulators rather than on one
      simple supply chain.
    data:
      nodes:
        - id: mk
          label: M-KOPA core platform
          detail: Receivables, device control, field operations, and embedded finance.
        - id: funders
          label: Warehouse / DFI funders
          detail: Standard Bank, DFC, IFC, and related capital providers.
        - id: oems
          label: OEM / hardware partners
          detail: Device partners and local assembly inputs.
        - id: agents
          label: Agent network
          detail: Field acquisition and servicing layer.
        - id: payments
          label: Payments / collections rails
          detail: Repayment and servicing workflow.
        - id: bureaus
          label: Bureaus / collectors
          detail: Credit verification and recovery support.
        - id: regulators
          label: Regulators / courts
          detail: Country-level legal and compliance boundary.
      edges:
        - from: funders
