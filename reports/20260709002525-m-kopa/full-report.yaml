  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Core Jobs-to-be-Done
        blocks:
          - type: paragraph
            body: >
              M-KOPA’s public materials consistently describe the target customer as an “every day earner”—someone with
              irregular income, limited formal credit visibility, and a high need for productive digital tools. This is
              a more specific and more useful segment definition than “mass market” or “unbanked” because it aligns
              directly with the repayment design of the product. The customer is often not trying to buy a status
              smartphone; they are trying to unlock work, payments, savings, communication, or resilience.


              The public segmentation evidence points to several high-value user groups: first-time smartphone owners,
              micro-entrepreneurs and traders, women entering formal finance or insurance, rural or peri-urban
              households, and customers who need a productive asset before they can qualify for broader financial
              products. These jobs-to-be-done are consistent across the country impact reports and customer stories.


              This matters because segmentation discipline is part of underwriting discipline. A customer whose phone is
              central to daily earnings, supplier coordination, or household resilience is likely to behave differently
              from a customer buying a discretionary device. M-KOPA’s public customer language repeatedly suggests that
              it understands this distinction and designs the journey around it.
            claimRefs:
              - CU001
