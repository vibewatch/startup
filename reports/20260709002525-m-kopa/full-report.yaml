      - number: '4.4'
        title: Public Financial Gaps and Reliability of the Evidence
        blocks:
          - type: paragraph
            body: >
              The financial evidence is meaningful but uneven. The strongest current metrics come from a mix of official
              company growth disclosures, DFI and partner financing announcements, Companies House records, and
              reputable third-party reporting. That is enough to support a serious late-stage scale story. It is not
              enough to support a fully rigorous underwriting model for equity investors or private-credit providers
              without management materials.


              Missing items include a clean audited consolidated P&L published by the company, gross margin by product
              line, country-level profitability, receivables aging, warehouse-level advance rates, and a precise
              reconciliation from ARR rhetoric to recognized revenue. Public accounts and filing history prove activity,
              but they do not disclose the operating detail required to fully separate device margin, credit income,
              service income, and loss experience.


              The overall financial conclusion is therefore favorable but not fully transparent: M-KOPA looks real,
              large, and probably sustainably fundable, yet it remains a private company whose best numbers are still
              surfaced indirectly.
