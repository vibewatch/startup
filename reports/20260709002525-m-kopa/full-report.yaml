  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Frame: Direct Peers Versus Substitutes'
        blocks:
          - type: paragraph
            body: >
              M-KOPA does not face only one competitor category. It has direct peers that also finance productive assets
              with PAYG logic, and it has substitutes that focus more narrowly on smartphone affordability through telco
              or OEM channels. That distinction matters because M-KOPA’s competitive advantage depends on more than
              headline phone pricing; it depends on whether the rival can replicate collections discipline, embedded
              services, and cross-sell after the initial device sale.


              In practical terms, the field splits into three groups. First are PAYG-origin players such as Sun King,
              d.light, Bboxx, and Izili, which overlap with M-KOPA on asset financing, last-mile distribution, and
              energy-access roots. Second are software or enablement layers such as Asopo, which may not look like
              consumer brands but can power competing financed-asset models through payments, locking, and scoring
              infrastructure. Third are handset-led substitutes such as EasyBuy, MTN EasyBuy, and Safaricom Lipa Mdogo
              Mdogo, which simplify the proposition to affordable phone ownership using existing telecom or retail
              rails.


              This means the right diligence lens is capability overlap, not just market labels. M-KOPA’s real question
              is whether rivals can equal its combination of asset enforcement, installment affordability, cross-sell
              depth, and operating reach—not whether they also call themselves inclusive fintechs.
            claimRefs:
              - CP001
