      - number: '8.3'
        title: Public comparable screen and discount logic
        blocks:
          - type: paragraph
            body: >-
              Public comps are useful here as a boundary-setting tool, not as a one-click answer. CompaniesMarketCap
              pages fetched on the run date show a wide spread even among established fintech and finance-adjacent
              platforms. PayPal sits near 1.2x 2025 revenue using July 2026 market cap and 2025 revenue. SoFi sits
              around 6.3x. Affirm is around 7.3x. Adyen is roughly 9.6x. That dispersion matters because it shows how
              sensitive multiples are to growth quality, profitability, model simplicity, geography, and balance-sheet
              risk.


              M-KOPA has some traits that argue for a premium to mature low-growth payments, especially high growth,
              strong adoption proof, and a defensible distribution-and-collections stack in underpenetrated markets. But
              it also carries discounts that public comps do not fully share: private-company opacity, country and
              currency risk, warehouse-funding dependence, customer-fairness sensitivity around device locking, and
              unresolved governance litigation. The right inference is therefore not that M-KOPA should trade at
              PayPal-like lows or Adyen-like highs. The right inference is that a mid-single-digit multiple would
              require unusually strong proof, while a low-single-digit multiple already gets the company to or above the
              unicorn threshold.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
