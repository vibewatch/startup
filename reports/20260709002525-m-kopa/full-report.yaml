  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Observable anchors and financing context
        blocks:
          - type: paragraph
            body: >-
              The starting point for valuing M-KOPA is not a rumor about category prestige but a small set of observable
              anchors. TechCabal reported, from UK filings, that the company generated about $416 million of revenue in
              2024 and about $9.2 million of profit. Official company messaging separately says revenue grew more than
              65% in 2024, that profitable growth continued into 2025 and 2026, and that the business had reached
              roughly $400 million of ARR. ImpactAlpha then added a late-stage financing signal: a reported $160 million
              Series F term sheet that combined new primary capital with secondary liquidity during a period of
              litigation noise.


              Those anchors support two conclusions. First, M-KOPA is clearly large enough that unicorn status is
              plausible on operating scale alone. Second, the public record still does not prove any specific post-money
              valuation with high precision. Companies House activity confirms ongoing share issuance, cancellation, and
              class-management steps around the same period, but it does not publish a clean public cap-table or final
              Series F economics. Valuation therefore has to stay anchored in revenue, growth, profitability signal, and
              financing quality rather than in an asserted headline mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
