evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      Audited or management-verified revenue, ARR, customer count, headcount, and cohort metrics are absent from public
      disclosures.
    whyItMatters: >-
      Without basic scale metrics it is impossible to judge whether the seed valuation reflects early traction or only
      narrative quality.
    diligencePath: >-
      Request KPI dashboard, board materials, or investor update covering revenue, customers, active members, and
      headcount.
    relatedQuestionRefs:
      - QO017
      - QO023
  - type: missing-source
    severity: material
    topic: named-customers
    missingEvidence: >-
      Tala does not publicly name the two large insurer partners referenced in the launch essay, and it names no
      employer or provider-group customers.
    whyItMatters: >-
      Commercial quality depends on whether the insurer relationships are pilots, channel partnerships, or scaled paid
      contracts.
    diligencePath: Request executed customer list, signed contracts, launch dates, covered-lives counts, and named references.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: privacy-disclosure
    missingEvidence: >-
      The website privacy policy says Tala collects no personal or health data even though the product description
      implies personalized virtual-care workflows.
    whyItMatters: >-
      This inconsistency raises diligence questions around compliance maturity, legal review, and whether public-facing
      disclosures are production ready.
    diligencePath: >-
      Request HIPAA architecture memo, BAAs, privacy counsel review, and the current production privacy notice used with
      live customers.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: No public board roster, ownership table, or governance rights are disclosed.
    whyItMatters: >-
      Investor control, founder concentration, and incubator economics affect both downside protection and future
      financing behavior.
    diligencePath: Request cap table, board observer list, investor rights agreement, and any Titan shared-services or IP agreements.
    relatedQuestionRefs:
      - QO019
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: tala-sam
    missingEvidence: >-
      Disclosed pricing, covered lives, implementation counts, or member engagement metrics that would let an external
      analyst convert the broad market into Tala's actual serviceable market.
    whyItMatters: >-
      Without unit economics or deployment scale, any public SAM/SOM estimate would be mostly invented and could
      overstate investability.
    diligencePath: >-
      Request current contracts by buyer type, covered lives, PMPM or case-rate pricing, and pilot-to-production
      conversion rates from management.
    relatedQuestionRefs:
      - QM008
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named employer customers, payer case studies, or implementation outcome data for Tala itself.
    whyItMatters: >-
      Adjacency evidence proves the category exists, but it does not prove Tala has secured repeatable demand or
      clinical and financial results.
    diligencePath: >-
      Ask for signed customer references, de-identified implementation metrics, and renewal or expansion evidence by
      insurer or employer cohort.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-estimate-boundary
    missingEvidence: >-
      A consistent publisher methodology that isolates payer/employer navigation plus virtual-care software from broader
      healthcare-delivery spend.
    whyItMatters: >-
      Public market reports disagree by orders of magnitude, which makes top-down TAM claims fragile and easy to misuse
      in valuation work.
    diligencePath: >-
      Rebuild the market bottom-up from covered lives, target buyer cohorts, and contract pricing instead of relying on
      generic analyst TAM pages.
    relatedQuestionRefs:
      - QM007
      - QM008
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: go-to-market-conversion
    missingEvidence: Pipeline conversion, implementation timeline, and retention data for payer and employer sales cycles.
    whyItMatters: >-
      The market may be attractive, but payer-led procurement friction can destroy growth assumptions if pilots fail to
      convert quickly.
    diligencePath: >-
      Request historical sales-stage conversion, implementation duration, compliance objections, and contract-renewal
      metrics by buyer segment.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Exact Tala and peer contract economics by pricing unit, implementation fee, guarantee structure, and renewal
      uplift.
    whyItMatters: >-
      Public packaging is visible, but actual procurement comparison and margin-quality judgment still depend on the
      missing economic terms.
    diligencePath: >-
      Request Tala's current payer or employer contracts, pricing sheets, and any competitor rate-card benchmarks from
      benefits consultants.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: tala-scale
    missingEvidence: >-
      Named Tala customers, covered lives, channel mix, retention, win rates, and implementation timelines versus direct
      peers.
    whyItMatters: >-
      Without disclosed traction, it is hard to compare Tala's distribution readiness or switching leverage against
      scaled incumbents.
    diligencePath: >-
      Request a customer list, covered-lives count, channel pipeline, win-loss log, and cohort-level renewal data from
      Tala management.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Published Tala outcome proof on referral completion, member engagement, cost reduction, and clinician-efficiency
      gains relative to direct peers.
    whyItMatters: >-
      Tala's public moat still rests more on positioning than on external proof, so underwriting durability from public
      evidence alone remains incomplete.
    diligencePath: >-
      Ask for outcome studies, payer case studies, consultant references, and any risk-share or guarantee language tied
      to live deployments.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: pricing-realization
    missingEvidence: Tala’s executed contracts showing pricing unit, discounts, implementation fees, and any at-risk payment component.
    whyItMatters: >-
      Without realized contract terms, investors cannot distinguish software pricing power from service-heavy revenue or
      buyer-subsidized pilots.
    diligencePath: Request redacted payer and employer MSAs, order forms, and sample invoices for the top five current accounts.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: The names of Tala’s insurer partners, covered lives, active member counts, and concentration by top customer.
    whyItMatters: >-
      Scale, concentration, and renewal quality cannot be judged from a generic claim of working with two large
      insurers.
    diligencePath: Request a current customer list, covered-population schedule, and cohort-level utilization by account.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-margin-burn
    missingEvidence: Revenue by stream, gross margin by stream, current cash, monthly burn, runway, and budgeted hiring spend.
    whyItMatters: >-
      These are the core inputs required to judge whether the company can scale without another near-term financing
      event.
    diligencePath: Request the latest board financial package with P&L, gross-profit bridge, balance sheet, and 24-month cash plan.
    relatedQuestionRefs:
      - QI012
      - QI023
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: leverage
    missingEvidence: Any debt facilities, lease liabilities, guarantees, or project-finance obligations.
    whyItMatters: Hidden leverage can materially change downside risk and shorten effective runway.
    diligencePath: Request the debt schedule, lease commitments, covenant summary, and any off-balance-sheet guarantees.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: roi-validation
    missingEvidence: Claims-based or clinically validated ROI cohorts, outcome scorecards, and contract adjudication results.
    whyItMatters: >-
      2026 buyers are explicitly moving toward validated outcomes, so renewal quality cannot be inferred from marketing
      language alone.
    diligencePath: Request buyer scorecards, adjudication files for any at-risk contracts, and third-party validated outcome studies.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI002
      - TI005
  - type: missing-source
    severity: minor
    topic: reimbursement-mix
    missingEvidence: Tala’s actual reimbursement exposure by state, line of business, and contract type.
    whyItMatters: >-
      Policy support for virtual care is broad but fragmented, so multi-state delivery economics may vary more than the
      product narrative suggests.
    diligencePath: >-
      Request a state-by-state reimbursement and licensure matrix covering any visit- or episode-based revenue
      components.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI004
