chapter:
  number: 7
  title: Risks
  summary: Tala’s biggest risks are that its regulatory surface area is already broad while public operating proof is still
    thin. The combination of multistate telehealth rules, fast-moving healthcare-AI laws, privacy and tracking enforcement,
    and aggressive fraud scrutiny means a clinician-in-the-loop story is directionally helpful but not enough on its own.
    The central underwriting question is whether Tala’s unnamed payer relationships and patient-facing workflows are already
    backed by the licensure, privacy, safety, and operating infrastructure that public materials do not yet show.
