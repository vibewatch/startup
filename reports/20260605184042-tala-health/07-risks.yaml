  title: Operational, clinical-safety, and privacy risk all hinge on product reality outrunning public evidence
  body: The highest residual operating risk is not that Tala is pursuing an impossible concept; it is that patient-facing
    AI can sound operationally mature well before its safety, escalation logic, and privacy controls are visible. Tala’s privacy
    policy currently says it collects no personal data, no health data, and no tracking technologies, which may be accurate
    for the present website but does not yet reconcile with the company’s broader virtual-care ambition if it begins handling
    authenticated user traffic, intake workflows, or symptom data at scale. HHS OCR guidance makes clear that once authenticated
    telehealth workflows or appointment flows touch PHI, tracking vendors can become business associates and ordinary cookie
    consent flows are not enough. External evidence on virtual triage is directionally encouraging, but the same literature
    also shows that patient-facing systems need explicit escalation pathways and clinical confirmation; the Stanford synthesis
    is especially important because it argues that most medical AI evidence still does not reflect real-world workflow complexity,
    uncertainty, or bias testing. For Tala, that means the safety question is not whether virtual triage can ever help, but
    whether this company’s specific implementation can do so safely and audibly under payer scrutiny.
