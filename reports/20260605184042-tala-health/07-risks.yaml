- calloutType: assumption
  title: Clinician-in-the-loop is necessary but not sufficient
  body: 'State AI laws and Stanford’s evidence review both point to the same conclusion: human oversight helps, but investors
    still need product-specific validation, escalation rules, and state-compliant disclosures.'
