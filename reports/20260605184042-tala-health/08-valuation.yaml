- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue, gross margin, and retention
    - No public disclosure of core economics.
    - Determines whether any premium multiple is supportable.
    - CFO packet with monthly recurring revenue bridge and cohort data.
  - - Covered lives, active members, and named customers
    - No public scale disclosure or reference accounts.
    - Tests whether the platform is already distribution-ready.
    - Commercial diligence and customer-reference calls.
  - - Pricing model and ROI proof
    - No public PMPM pricing, savings metrics, or renewal proof.
    - Buyer scrutiny in 2026 makes this central to valuation support.
    - Contract sample plus buyer outcome dashboard.
  - - Seed term sheet and cap-table economics
    - No public disclosure of preferences, dilution, or secondary mix.
    - Headline valuation may not equal common-equity value.
    - Legal review of financing documents.
  - - Competitive win-loss and implementation data
    - No public evidence on why Tala wins or how fast it goes live.
    - Distinguishes genuine platform advantage from launch-stage marketing.
    - Go-to-market and implementation diligence with recent deals.
  notes: Until these asks are answered, the right output is diligence discipline rather than price-taking enthusiasm.
