  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: core-economics
    missingEvidence: Current revenue, gross margin, net retention, cohort retention, and contribution margin by product or buyer type.
    whyItMatters: Without core economics, investors cannot tell whether Tala belongs anywhere near premium health-tech multiples or is simply an expensive narrative asset.
    diligencePath: Obtain a CFO data room package with monthly revenue bridge, cohort retention, gross margin by product, and any board-level KPI deck used in the financing.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: Covered lives, active members, named payer or employer logos, customer concentration, and renewal history.
    whyItMatters: Spring Health, Transcarent, and Included Health all disclose some scale evidence, while Tala's public record does not show whether commercial adoption is still pilot-like or already meaningful.
    diligencePath: Request current customer list, contracted lives, active-member metrics, implementation cohort data, and at least three reference calls with live customers.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: round-terms
    missingEvidence: Full seed term sheet, liquidation preferences, participation rights, anti-dilution terms, board rights, and any secondary mix.
    whyItMatters: A headline post-money valuation can materially overstate common-equity quality when investor protections or secondary components are large.
    diligencePath: Have counsel review the executed seed financing documents and cap table, then convert the headline valuation into effective common-equity entry terms.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: material
    topic: pricing-roi
    missingEvidence: PMPM pricing, outcome guarantees, claims savings, renewal rates, and any verified customer ROI analysis.
    whyItMatters: 2026 buyer literature makes clear that digital-health vendors need measurable outcomes to keep premium contracts and premium valuations.
    diligencePath: Review a recent contract, ROI dashboard, and buyer renewal memo, then test whether the economics hold up under independent customer reference calls.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV002
    - TV004
    - TV006
