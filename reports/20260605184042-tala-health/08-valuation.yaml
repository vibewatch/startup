- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Valuation logic
  - Revenue needed for $1.2B
  - What must be true
  - Probability signal
  rows:
  - - Bull
    - Illustrative 5.0x premium-growth multiple.
    - $240M
    - Tala already has strong contracted scale, verified ROI, and attractive unit economics that are not yet public.
    - Possible but not evidenced publicly today.
  - - Base
    - Hims-like public-growth multiple of ~2.5x.
    - $480M
    - Tala would need substantial commercial scale plus visible retention and pricing power.
    - Too much hidden proof is currently being assumed.
  - - Bear
    - 1.0x low-premium telehealth multiple.
    - $1.2B
    - The company grows, but buyers treat it as an unproven or less differentiated virtual-care vendor.
    - A plausible outcome if ROI proof remains sparse.
  - - Hard downside
    - Teladoc-like compressed multiple of ~0.49x.
    - $2.45B
    - Public markets eventually judge Tala like a telehealth platform facing sector compression.
    - At this lens the current seed looks very full.
  notes: The 5.0x and 1.0x rows are scenario assumptions used to test underwriting discipline, while the 2.5x and 0.49x rows anchor on public benchmark math from Hims and Teladoc.
