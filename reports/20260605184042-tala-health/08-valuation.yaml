- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category fit
    - Tala could be an AI-native care-navigation and clinician-augmentation platform with real buyer leverage.
    - The public file could just be early-stage narrative without corresponding commercial depth.
    - Disclose revenue, buyer retention, and covered lives.
  - - Comparable stack
    - Private winners like Spring Health and Transcarent show that large valuations are possible in digital health.
    - Those companies disclosed more scale, customer proof, or pricing structure than Tala has.
    - Show that Tala already matches or exceeds comparable proof points.
  - - Buyer behavior
    - Outcome-based contracting can reward vendors with genuine ROI.
    - 2026 purchasers are explicitly raising standards and cutting underperformers.
    - Provide verified PMPM savings, outcomes, or renewal data.
  - - Public-market discipline
    - A premium multiple is possible if Tala is already scaling unusually fast.
    - Public telehealth comps show that large equity values can coexist with much lower revenue multiples.
    - Demonstrate economics strong enough to clear premium public and private benchmarks.
  notes: The anti-thesis is not that Tala lacks ambition; it is that the market is being asked to trust too much without operating disclosure.
