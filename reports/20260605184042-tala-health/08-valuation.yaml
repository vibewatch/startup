- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Evidence
  - What it says about Tala
  - Limitation
  - Status
  rows:
  - - Hims & Hers Health
    - ~$6.07B market cap; Q1 2026 revenue ~$608M; ~2.6M subscribers.
    - A high-growth public health platform still has visible revenue and subscriber scale behind its value.
    - Consumer-oriented model is not the same as payer-led virtual care.
    - Public
  - - Teladoc Health
    - ~$1.26B market cap; FY2025 revenue $2.53B; 2025 cap/revenue ~0.49x.
    - Tala is priced near Teladoc's entire equity value without Teladoc's disclosure base.
    - Teladoc is a mature post-reset comp with different legacy baggage.
    - Public
  - - American Well
    - ~$0.14B market cap and ongoing 10-K disclosure.
    - Provides a low-end public telehealth reference for enterprise infrastructure names.
    - Current operating trajectory is weaker than Tala's aspirational story.
    - Public
  - - Spring Health
    - $100M Series E at $3.3B with >10M lives and >400 employers disclosed at the round.
    - Private category winners can be worth billions, but they usually show large-scale buyer evidence.
    - Mental-health specialization differs from Tala's broader care-navigation ambition.
    - Private
  - - Transcarent
    - $2.2B valuation after $126M Series D; at-risk employer pricing and later Accolade merger.
    - Integrated-navigation platforms can justify large values when commercial structure is visible.
    - More mature platform and capital history than Tala.
    - Private
  - - Hot AI seed market
    - Hot AI seeds can clear $40M-$45M post-money and some rare AI seeds exceed $100M.
    - Tala's $1.2B seed sits far above even euphoric AI-seed norms.
    - General AI benchmarks are noisier than direct digital-health comps.
    - Cross-sector
  notes: This table mixes public telehealth comps, private digital-health leaders, and AI-seed context because no perfect one-to-one public Tala analog exists.
