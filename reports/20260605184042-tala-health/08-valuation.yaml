- id: scenario-math-and-price-discipline
  title: Scenario Math and Price Discipline
  body: 'Scenario logic pushes the same conclusion. Annualizing Hims''s current quarter against its June 2026 market cap implies an equity-value-to-revenue multiple of roughly 2.5x. Applying that public-growth yardstick to Tala''s $1.2 billion price implies around $480 million of annual revenue. Teladoc''s 2025 capitalization-to-revenue ratio is far lower at about 0.49x, which would imply roughly $2.45 billion of revenue to support Tala''s valuation under a compressed public-telehealth lens. Tala is also priced at roughly 95% of Teladoc''s entire public equity value today, even though Teladoc has billions of revenue and filing-grade disclosure. Against hot AI seed benchmarks, the gap is even more dramatic: Tala''s $1.2 billion mark is about 27 times the $45 million upper-end post-money benchmark cited for hot AI seed deals. The bull case is therefore possible only if Tala has already built hidden commercial scale, durable payer or employer ROI, and contract economics far stronger than public
    evidence shows. The base case is simpler: capital formation has outrun disclosed proof, so the price looks stretched.'
  claimRefs:
  - CV015
