    - The price signal is real, but key operating metrics remain undisclosed.
    - Enough evidence to flag stretch, not enough to build precision.
  - - Risk rating
    - High
    - Missing revenue, customer, ROI, and term-sheet detail leave many downside paths open.
    - Require downside protection or defer.
  - - Valuation stance
    - Stretched
    - Capital formation outruns public proof relative to public and private benchmarks.
    - Price discipline should be stricter than the round headline suggests.
  - - Decision implication
    - Track only after diligence
    - The company may be attractive, but the current price is ahead of disclosed validation.
    - Upgrade only if private metrics materially exceed what public evidence implies.
