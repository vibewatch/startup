  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: pricing-realization
      missingEvidence: Tala’s executed contracts showing pricing unit, discounts, implementation fees, and any at-risk payment component.
      whyItMatters: Without realized contract terms, investors cannot distinguish software pricing power from service-heavy revenue or buyer-subsidized pilots.
      diligencePath: Request redacted payer and employer MSAs, order forms, and sample invoices for the top five current accounts.
      relatedQuestionRefs:
        - QI005
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: material
      topic: customer-scale
      missingEvidence: The names of Tala’s insurer partners, covered lives, active member counts, and concentration by top customer.
      whyItMatters: Scale, concentration, and renewal quality cannot be judged from a generic claim of working with two large insurers.
      diligencePath: Request a current customer list, covered-population schedule, and cohort-level utilization by account.
      relatedQuestionRefs:
        - QI004
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: revenue-margin-burn
      missingEvidence: Revenue by stream, gross margin by stream, current cash, monthly burn, runway, and budgeted hiring spend.
      whyItMatters: These are the core inputs required to judge whether the company can scale without another near-term financing event.
      diligencePath: Request the latest board financial package with P&L, gross-profit bridge, balance sheet, and 24-month cash plan.
      relatedQuestionRefs:
        - QI012
        - QI023
      relatedTableRefs:
        - TI003
        - TI004
        - TI005
    - type: missing-source
      severity: material
      topic: leverage
      missingEvidence: Any debt facilities, lease liabilities, guarantees, or project-finance obligations.
      whyItMatters: Hidden leverage can materially change downside risk and shorten effective runway.
      diligencePath: Request the debt schedule, lease commitments, covenant summary, and any off-balance-sheet guarantees.
      relatedQuestionRefs:
        - QI024
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: roi-validation
      missingEvidence: Claims-based or clinically validated ROI cohorts, outcome scorecards, and contract adjudication results.
      whyItMatters: 2026 buyers are explicitly moving toward validated outcomes, so renewal quality cannot be inferred from marketing language alone.
      diligencePath: Request buyer scorecards, adjudication files for any at-risk contracts, and third-party validated outcome studies.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI002
        - TI005
    - type: missing-source
      severity: minor
      topic: reimbursement-mix
      missingEvidence: Tala’s actual reimbursement exposure by state, line of business, and contract type.
      whyItMatters: Policy support for virtual care is broad but fragmented, so multi-state delivery economics may vary more than the product narrative suggests.
      diligencePath: Request a state-by-state reimbursement and licensure matrix covering any visit- or episode-based revenue components.
      relatedQuestionRefs:
        - QI021
      relatedTableRefs:
        - TI004
