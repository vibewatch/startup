tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Payer or insurer platform contract
        - AI-enabled navigation, triage, and care-orchestration platform sold to a health plan or insurer
        - Contract or covered population
        - Plausible from Tala narrative; no public contract terms
        - Medium on mechanism, low on realization
        - Provide executed insurer MSAs, covered-population counts, and revenue-recognition policy.
      - - Employer-sponsored covered benefit
        - Tala-like navigation or virtual-care access embedded as a benefit through an employer or health plan
        - Covered member per month or per employee per month
        - Common adjacent model; Tala has not disclosed it uses one
        - Medium on market fit, low on Tala-specific proof
        - Provide buyer mix by employer, payer, and provider channel with realized billing unit.
      - - Virtual care encounter revenue
        - Revenue tied to virtual visits, episodes, or clinician-supervised interventions
        - Visit, episode, or case
        - Tala discloses 24/7 virtual care but no visit economics
        - Low
        - Provide visit volume, reimbursement/contract basis, and clinician-cost burden per episode.
      - - Implementation and integration fees
        - One-time setup, workflow integration, data exchange, and support fees for enterprise deployment
        - Project or implementation fee
        - Plausible in enterprise healthcare software; not publicly disclosed by Tala
        - Low
        - Provide implementation SOWs, one-time fee schedules, and margin profile.
      - - Performance-based upside
        - Engagement fee plus withheld outcome-based component or shared-savings style payment
        - Outcome metric, savings share, or withhold
        - Supported by 2026 buyer preference; Tala adoption undisclosed
        - Medium on market logic, low on Tala-specific proof
        - Provide any at-risk contract language, validation methodology, and adjudication cadence.
      - - Referral or downstream care coordination revenue
        - Economic participation tied to moving members to the right clinician, specialist, or in-person setting
        - Referral, case, or program fee
        - Product narrative supports the workflow; monetization is undisclosed
        - Low
        - Provide revenue share, referral economics, and compliance memo for any downstream participation.
    notes: >-
      This table distinguishes between public Tala disclosures and market-plausible monetization rails. A row marked plausible is not a confirmed Tala revenue stream; it is a mechanism supported by Tala’s product narrative and adjacent buyer models.
