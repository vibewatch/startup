  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Current public proxy
      - Impact
      - Exact diligence path
    rows:
      - - Realized pricing by buyer type
        - Tala product narrative plus adjacent PMPM and performance-contracting context
        - Revenue quality cannot be assessed without contract realization
        - Request redacted payer/employer contracts showing price unit, discounts, and implementation fees.
      - - Revenue, ARR, and covered lives
        - Two large insurer partnerships claimed; no counts or dollar metrics disclosed
        - Scale and valuation support cannot be tested
        - Request monthly recurring revenue, TTM revenue, covered lives, and active member counts.
      - - Gross margin by stream
        - None; only market analogs disclose margins publicly
        - Impossible to know whether Tala behaves like software, services, or hybrid care delivery
        - Request gross-profit waterfall for platform, clinical labor, support, and implementation.
      - - Sales efficiency and renewal quality
        - Insurer-partner narrative and hiring only
        - CAC, payback, and durability of bookings remain opaque
        - Request funnel metrics, sales-cycle length, cohort retention, and renewal rates.
      - - Burn, runway, and leverage
        - $100M seed disclosed, but no cash or debt schedule
        - Capital adequacy remains an inference instead of a measured fact
        - Request current cash, monthly burn, debt/lease schedule, and board runway plan.
      - - ROI validation and adjudication
        - 2026 buyer materials demand validated outcomes rather than vendor-reported metrics
        - Tala’s enterprise renewal quality cannot be judged
        - Request claims-based ROI studies, performance-scorecard definitions, and adjudication rights.
    notes: >-
      Each gap directly blocks underwriting. The chapter can explain Tala’s possible monetization, but it cannot convert that possibility into an investable financial model without these documents.
