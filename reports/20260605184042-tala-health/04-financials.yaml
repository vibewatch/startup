  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer or contract surface
      - Price/unit/contract
      - List vs realized pricing
      - Discounts/unknowns
      - Source
    rows:
      - - Tala public rate card
        - Not publicly disclosed
        - No Tala list pricing or realized price disclosed
        - Everything from PMPM to implementation fees remains unknown
        - Tala official and funding coverage reviewed; none publish a price book.
      - - Covered-life or PMPM contract
        - Per member per month or per employee per month
        - Common enterprise-health model, but Tala realization unknown
        - Dependent multipliers, activation thresholds, and add-ons can change true cost materially
        - GoPivot explains PMPM/PEPM math; adjacent vendors sell covered benefits without public rate cards.
      - - Performance-based two-stream contract
        - Engagement fee plus withheld performance component
        - Market-recommended structure, not Tala-confirmed structure
        - Outcome definitions, audit rights, and payout timing unknown
        - PHTI playbook and MedCity reporting.
      - - Implementation / integration fees
        - One-time setup or ongoing service package
        - Often separate from platform price in enterprise deployments
        - SOW scope, support burden, and waived-fee practices unknown
        - Adjacent payer/employer platforms and enterprise healthcare workflows.
      - - Visit or episode pricing
        - Per consult, episode, or care-navigation case
        - Could exist if Tala monetizes the virtual-care layer directly
        - Payer reimbursement basis and clinician compensation model unknown
        - Tala’s 24/7 virtual-care narrative plus telehealth policy context.
    notes: >-
      The absence of public Tala pricing is itself a material finding. This exhibit uses market context to frame plausible contract structures, not to impute a realized Tala price.
