chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, launch thesis, and operating model
        blocks:
          - type: paragraph
            body: >-
              Tala Health emerged publicly in August 2025 with a narrative that the U.S. healthcare system fails
              patients at the last mile between symptom onset and actual resolution. The company positions itself not as
              a narrow chatbot vendor but as an AI-native virtual-care platform that combines proprietary clinical and
              non-clinical agents with licensed clinicians from intake through follow-up. Across the homepage, about
              page, and launch essay, Tala repeatedly claims it can compress time to diagnosis and treatment by
              coordinating triage, referrals, follow-up, and administrative steps that are usually fragmented across
              providers and payer workflows. That framing matters for diligence because it implies Tala wants to own a
              broad care-navigation layer, not a single point solution. Independent coverage from TFN, HLTH, and HIT
              Consultant also describes Tala as a San Francisco venture incubated by Titan Holdings, giving later
              chapters a stable identity anchor but not yet proving commercial traction.
