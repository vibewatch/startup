      - number: '2.4'
        title: 'Adoption drivers and constraints: demand is real, but regulation, integration, and ROI scrutiny raise the bar'
        blocks:
          - type: paragraph
            body: >-
              Several adoption drivers line up behind Tala's thesis. Consumer appetite for virtual care remains durable,
              with Deloitte reporting strong repeat willingness and NCQA reporting that virtual visits still represent a
              materially higher share of outpatient care than before the pandemic. Plans and providers are still
              budgeting for virtual health and digital engagement, while academic evidence suggests AI-assisted triage
              can improve acuity alignment and steer some patients away from inappropriate care settings or delayed
              emergency care. But the same sources show why market capture is hard. Telehealth policy is still
              fragmented across reimbursement, licensure, controlled-substance prescribing, and state rules. Health-AI
              regulation is tightening faster at the state level than at the federal level, especially around
              disclosure, mental-health uses, and claims of clinician oversight. Buyers are also moving from permissive
              PMPM contracts toward outcome-linked purchasing, which shifts proof requirements onto vendors. Combined
              with Menlo's evidence that payers buy more slowly than providers, the implication for Tala is
              straightforward: the company may be entering a large and active market, but success will depend less on
              broad TAM rhetoric than on proving compliant workflows, measurable clinical and economic outcomes, and
              enough integration depth to survive long enterprise buying cycles.
