    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The revenue needed to support Tala's $1.2B valuation changes drastically with the multiple investors assign.
    data:
      items:
        - label: 0.49x Teladoc-like compressed public multiple
          value: 2449
        - label: 1.0x low-premium telehealth scenario
          value: 1200
        - label: 2.5x Hims-like public growth multiple
          value: 480
        - label: 5.0x premium-growth scenario
          value: 240
      yAxis:
        label: Revenue needed to support $1.2B valuation (USD M)
    approximationNotes: >-
      The 0.49x and 2.5x points are anchored on Teladoc and Hims public math; the 1.0x and 5.0x points are scenario
      assumptions used for underwriting discipline.
