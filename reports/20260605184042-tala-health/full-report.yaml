  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Payer proof never moves from narrative to evidence
        - Named insurer go-live, member counts, or recurring contract disclosure
        - >-
          No named payer implementation, member denominator, or renewal proof by next financing or major expansion
          milestone
        - Treat Tala as pre-proof on distribution and reset moat assumptions downward
      - - Privacy narrative is contradicted by product reality
        - Public privacy updates, app-store disclosures, tracking-tech findings, or incident reports
        - Any evidence of PHI handling or ad-tech use that conflicts with the current “no data / no tracking” policy
        - Escalate immediately; re-underwrite legal, partner-trust, and security exposure
      - - State AI law constrains core workflow
        - Material product gating in California, Texas, Illinois, or Nevada
        - A top target state requires disabling or materially redesigning a core Tala feature
        - Cut addressable-market assumptions and require state-by-state product roadmap before funding
      - - Clinical-safety evidence stays external only
        - Tala-specific validation or adverse-event reporting
        - No Tala-specific prospective validation, override data, or safety-monitoring proof before broad payer launch
        - Treat clinical-safety claims as unverified and cap underwriting confidence
      - - Execution bench stays thin
        - Hiring of compliance, clinical operations, payer implementation, and reliability leaders
        - Key operating roles remain unfilled or founder-concentrated while payer scope expands
        - Assume slower implementation and higher outage or compliance slippage risk
      - - FCA or AKS warning signal appears
        - Whistleblower claim, audit issue, or remuneration concern in payer or referral workflows
        - Any internal or external signal that volume, documentation, or steering incentives are misaligned
        - Pause growth assumptions pending compliance remediation and independent legal review
    notes: >-
      These kill criteria are designed to be monitorable from diligence materials, management updates, or public
      disclosures rather than requiring hindsight after a failure.
