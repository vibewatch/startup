      - number: '2.3'
        title: 'Buyer / user / payer map: insurers and employers buy, members use, clinicians and admins must integrate'
        blocks:
          - type: paragraph
            body: >-
              The public buyer map for this category is clearer than Tala's own traction data. Adjacent vendors
              repeatedly show the same structure: insurers, self-insured employers, and health-system partners buy the
              platform; members or employees are the day-to-day users; clinicians, care guides, and administrative staff
              become the operational participants; and the ultimate payer is usually the sponsoring health plan or
              employer. Transcarent emphasizes benefits navigation plus expert guidance plus 24/7 virtual care. Included
              Health markets employers and health plans an all-in-one mix of claims support, navigation, and clinical
              care. Amwell sells payers and health systems a platform layer, while Spring Health markets covered lives,
              ROI, and employer outcomes. These patterns matter because they imply Tala is not selling only to doctors
              or only to patients. Budget authority likely sits with medical-cost, care-management, population-health,
              or benefits leaders who want fewer misrouted episodes, faster member resolution, lower avoidable
              utilization, and a cleaner member experience. That also means adoption depends on the ability to carry
              context across administrative and clinical workflows. In Tala's framing, the important journey is not just
              'can a patient video-chat with a doctor?' but 'can a payer or employer move a member from symptom or
              confusion to the right care setting faster, with fewer handoffs and lower waste?'
            claimRefs:
              - CM037
