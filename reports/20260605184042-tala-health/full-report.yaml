      - number: '2.2'
        title: 'Sizing lenses: the buyer pool is large, but public market estimates are inconsistent outer bounds'
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for Tala's category is directionally positive but methodologically messy. At the
              broadest level, Menlo frames healthcare as a $4.9 trillion sector that still underspends on software,
              while StartUs and MarkWide place U.S. telehealth and virtual-care revenue in roughly a $39 billion to $43
              billion current range with double-digit growth into the next decade. Those figures are useful as outer
              bounds for the digital-delivery layer, not as Tala's actual TAM. The more decision-useful buyer lens is
              covered lives and employer cost pressure: Peterson-KFF says employer-sponsored insurance covered 165.6
              million people under 65 in March 2025, while KFF's 2025 employer survey still counts roughly 154 million
              people in employer-sponsored coverage and shows family premiums near $27,000. That tells us the pool of
              members and economic pain points is enormous even before Tala proves share capture. The problem is that
              analyst definitions are not stable. IMARC's U.S. virtual-care figure is orders of magnitude larger than
              MarkWide or StartUs, implying a much broader boundary that likely includes far more healthcare-delivery
              spend than a navigation software wedge should claim. The right conclusion is not that Tala's market is
              tiny; it is that a credible SAM or SOM must be rebuilt bottom-up from target covered lives, use cases,
              pricing, and conversion data that Tala has not publicly disclosed.
