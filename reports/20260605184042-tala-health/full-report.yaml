      - number: '3.3'
        title: Packaging and trust signals are more public than exact pricing
        blocks:
          - type: paragraph
            body: >-
              Public pricing is weak across the enterprise peer set, but public packaging is not. Tala does not publish
              price, contract structure, covered lives, named customers, or published outcomes. Most direct peers do not
              publish exact rate cards on their main public pages either, so comparisons have to use the signals buyers
              can actually see. Transcarent sells an integrated member experience across navigation, guidance, and care
              delivery. Included sells a single covered benefit and app spanning medical, financial, and administrative
              needs. Quantum signals modularity through tiered packages, and apree explicitly markets performance
              guarantees plus risk-sharing. Hims stands out mainly because consumer subscriptions force far more visible
              pricing than enterprise navigation contracts do. The important 2026 context is that buyers are getting
              stricter, not looser. Business Group on Health says employers expect a median 9% cost trend and are
              raising the bar on vendor partnerships, while PHTI-related coverage says digital-health purchasing is
              shifting away from simple PMPM access fees toward performance-based models. NCQA and ATA add a second
              buyer screen: virtual-care platforms still have to prove trust, standardization, and reimbursement
              readiness, not just AI ambition.
