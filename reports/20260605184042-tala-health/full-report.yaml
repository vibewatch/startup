  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Likely action
    rows:
      - - Commercial scale underwhelms
        - Revenue is far below the levels implied even by Hims-like public growth multiples.
        - The round would be ahead of proof, not ahead of time.
        - Reset valuation expectations or walk away.
      - - Buyer ROI evidence is weak
        - Management cannot show pricing, savings, retention, or outcome guarantees that clear purchaser scrutiny.
        - 2026 buyers are explicitly raising standards.
        - Treat the company as an unproven pilot-stage asset.
      - - Customer disclosure remains absent
        - No covered-life, member, or named-customer disclosure emerges in diligence.
        - Without scale evidence, premium comparables lose force.
        - Keep the recommendation at research-more or avoid.
      - - Seed terms are investor-protective
        - Preferences, ratchets, or secondary mix reveal weaker common-equity economics than the headline suggests.
        - Headline valuation can overstate true entry quality.
        - Re-price to common-equity reality.
      - - Category compression spreads
        - Public telehealth multiples remain depressed and buyer skepticism intensifies.
        - Even solid execution may not hold a premium multiple.
        - Use downside cases rather than headline marks.
    notes: These triggers are designed to move the decision quickly from narrative to underwriting discipline.
