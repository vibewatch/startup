      - number: '8.4'
        title: Final Recommendation and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The most supportable call from public evidence alone is research-more, with medium confidence, high risk,
              and a stretched valuation stance. Tala may yet deserve a premium if internal data show large covered-life
              penetration, strong retention, and verified outcomes that matter to buyers, but the current public file
              does not clear that bar. The downside is not abstract. Buyers are explicitly tightening ROI requirements,
              and the sector already has a cautionary example in Babylon, where virtual-care ambition and public-market
              narrative did not prevent bankruptcy and a wind-down. For Tala, the decisive diligence asks are
              straightforward: current revenue and gross margin, retention by buyer cohort, covered lives or active
              members, named payer or employer logos, actual pricing or performance guarantees, and the term-sheet
              mechanics of the $100 million seed. Until those items are produced, the right discipline is to treat the
              company as promising but expensive rather than proven and investable at face value.
