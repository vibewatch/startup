      - number: '3.5'
        title: Babylon is the cautionary comparable the category should not ignore
        blocks:
          - type: paragraph
            body: >-
              Babylon is the adverse comparable the category should not ignore. TechCrunch reported that the company had
              once been valued at nearly $2 billion, then went bankrupt, entered UK administration, and was sold for
              parts in 2023. That is not evidence that virtual care is a dead market. It is evidence that AI-enabled
              telehealth scale, insurer ties, and a strong narrative do not by themselves create durable economics. That
              lesson applies directly to Tala. New entrants can still win if they solve a narrow enterprise workflow
              better than incumbents, but the market already contains broader platforms with more disclosed reach, more
              mature packaging, and in some cases better public outcome framing. The practical ranking of threat is
              therefore: direct overlap from Transcarent, Included, Amwell, Teladoc, and Quantum; budget leakage to
              Spring and Hims; and Babylon as the reminder that narrative strength without commercial proof can collapse
              quickly.
            claimRefs:
              - CP015
              - CP020
              - CP021
