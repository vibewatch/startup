    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a real financing event into missing proof, tougher buyer scrutiny, and a stretched
      valuation call.
    data:
      nodes:
        - id: price
          label: Headline price
