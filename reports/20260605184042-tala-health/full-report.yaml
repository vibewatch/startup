      - number: '7.5'
        title: Mitigation exists conceptually, but the kill criteria are simple and unforgiving
        blocks:
          - type: paragraph
            body: >-
              Tala does have some visible mitigations. It talks explicitly about AI working with clinicians rather than
              replacing them, references FDA-tracked tools for clinical agents, and has at least begun staffing core
              infrastructure roles. Category sources also provide a reasonable compliance playbook: preserve independent
              clinical judgment, keep administrative and clinical functions separate, implement BAAs and breach
              workflows, and use formal AI risk-management frameworks. But the residual-exposure question is whether
              those controls are already instantiated in Tala’s actual deployment architecture. The thesis can break
              quickly if public proof does not catch up. The three fastest failure paths are: payer traction remains
              unnamed and non-quantified, privacy or tracking practice contradicts the no-data public narrative, or
              state-by-state AI and telehealth rules force a narrower product than investors expected. Because Tala has
              not yet published the documents that would close those risks, diligence should treat the current story as
              promising but provisional. The investment case improves sharply only when compliance evidence, named
              implementations, and measurable member outcomes move from inferred to verified.
