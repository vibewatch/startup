      - number: '8.2'
        title: Benchmark Stack and Buyer Reality
        blocks:
          - type: paragraph
            body: >-
              The right comparison set makes Tala's price look demanding. Public telehealth comps are not trading on
              mystery premiums: Hims carries a roughly $6.1 billion market cap with about $608 million of first-quarter
              revenue, nearly 2.6 million subscribers, and raised 2026 guidance, while Teladoc sits near a $1.26 billion
              market cap despite $2.53 billion of 2025 revenue. Amwell is even lower at roughly $140 million of market
              value and still offers filing-grade disclosure as a public company. Private digital-health leaders also
              show much fuller proof stacks than Tala's public record. Spring Health disclosed a $3.3 billion valuation
              only after reporting over 10 million covered lives and 400-plus employers, and Transcarent disclosed a
              $2.2 billion valuation alongside at-risk employer pricing and a later Accolade acquisition. On the demand
              side, 2026 employer and purchaser sources are skeptical rather than forgiving: buyers are confronting
              elevated healthcare cost trends, demanding measurable outcomes, and explicitly warning that
              underperforming vendors will be cut. That backdrop raises, not lowers, the proof threshold for a $1.2
              billion seed.
