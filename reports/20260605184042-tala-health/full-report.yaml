      - number: '1.2'
        title: Leadership team, advisors, and founder dependence
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is centered on founder Ritankar Das and CEO Tanner Smith. Das presents
              himself as a scientist-entrepreneur who founded both Titan Holdings and Tala Health, with a
              machine-learning research background, a Cambridge PhD dropout story, and exceptionally ambitious claims
              around early academic achievement. Smith, by contrast, is framed as the operating executive who previously
              helped scale Dascena and Forta Health. Tala's website also highlights a bench of advisors that is
              unusually heavyweight for a newly launched company: former Johnson & Johnson R&D chief Mathai Mammen,
              emergency physician and digital-health operator Uli Chettipally, and Nobel laureate John Mather. That
              bench helps offset pure founder-key-person risk, but governance remains lightly disclosed: there is no
              public board list, no formal committee structure, and no visibility into ownership or decision rights. The
              result is strong signaling on credibility, but still a founder-centric governance profile at seed stage.
