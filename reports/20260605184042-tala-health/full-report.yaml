  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the most immediate scaling constraint
        blocks:
          - type: paragraph
            body: >-
              Tala’s own materials frame the company as a clinician-augmented virtual-care platform that wants to
              influence referral routing, care coordination, medication renewals, and 24/7 patient access while serving
              large insurers. That combination gives the company a much larger compliance surface than a simple
              administrative SaaS workflow. Public regulatory sources show that telehealth licensure, payer
              reimbursement, consent, and prescribing rules still vary materially across states, while 2025-2026 AI laws
              in California, Texas, Illinois, Nevada, and other states add disclosure, oversight, and
              mental-health-specific restrictions that can force product segmentation by state. At the same time,
              telehealth enforcement has moved beyond abstract warning signals: legal reviews highlight real actions
              around kickbacks, pressure-to-prescribe, and insufficient clinician-patient relationships, and FTC privacy
              precedent shows that a consumer-health platform can face meaningful penalties if data-use practice outruns
              its promises. Tala’s strongest public mitigation is the clinician-in-the-loop framing, but that alone does
              not answer the key diligence question, which is whether the company has a state-by-state licensure,
              supervision, documentation, and vendor architecture already built for a national rollout.
            claimRefs:
              - CR002
