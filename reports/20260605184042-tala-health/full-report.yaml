      - number: '3.2'
        title: Incumbents, bundled alternatives, and substitutes widen the field
        blocks:
          - type: paragraph
            body: >-
              Competitive pressure also comes from outside the direct peer set. Quantum and apree/Castlight show how
              navigation can be folded into broader employer-benefits or primary-care relationships rather than
              purchased as a separate AI-first system. Accolade's still-live member surface shows that bill help,
              advocacy, second opinions, and nurse-backed guidance are already familiar category features, even without
              Tala's agent vocabulary. Spring Health and Hims are different kinds of substitutes. Spring does not
              replicate Tala's full insurer-facing orchestration story, but its more than 20 million covered lives, fast
              appointment access, and guaranteed ROI let it win the same benefits budget when the buyer prioritizes
              mental-health outcomes. Hims works from the opposite direction: it is mostly consumer subscription
              telehealth, with visible member pricing and very large revenue scale, so it can absorb some low-acuity
              demand without solving Tala's payer or employer navigation job. Built In, Becker's, and StartUs all
              reinforce the same broader point: telehealth remains crowded, innovation-heavy, and full of adjacent
              vendors that can siphon budget or member attention even when they are not one-for-one substitutes.
