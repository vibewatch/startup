    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Valuation logic
      - Revenue needed for $1.2B
      - What must be true
      - Probability signal
    rows:
      - - Bull
        - Illustrative 5.0x premium-growth multiple.
