      - number: '7.4'
        title: People and execution risk remain high because the public bench still looks early
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated because Tala is trying to build several demanding capabilities at once: insurer
              implementation, clinician oversight, patient operations, AI development, privacy and compliance, and
              always-on reliability. Public hiring signals show work on the right ingredients—data science, MLOps, and
              site reliability—but also imply that core operational machinery was still being assembled late in 2025.
              Public materials also emphasize founder and advisor credibility more than the deeper operating bench
              normally associated with a multistate regulated-services rollout. That does not mean the bench is weak in
              reality; it means outside investors cannot verify depth, succession, or decision rights from public
              evidence today. In practical terms, that raises two related risks. First, delivery quality can deteriorate
              if a small set of senior leaders becomes a bottleneck for compliance, clinical design, and payer
              implementation. Second, execution mistakes in a virtual-care business tend to compound: a thin reliability
              team can worsen service quality, which can slow payer expansion, which can in turn constrain hiring and
              compliance investment. The sparse public bench is therefore not just a governance concern; it is a direct
              operating-risk multiplier.
            claimRefs:
              - CR009
              - CR010
