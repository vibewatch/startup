companyProfile:
  summary: >-
    Tala Health is a San Francisco-based AI virtual-care startup incubated by Titan Holdings and founded by Ritankar Das
    in 2025 to rebuild the fragmented healthcare journey around a clinician-in-the-loop operating model. Public
    materials describe Tala as combining proprietary AI agents with licensed clinicians to handle intake, triage,
    referral coordination, documentation, treatment support, and follow-up on a 24/7 basis for payer-oriented buyer
    channels. The company exited stealth in August 2025 and announced a $100M seed round in November 2025 led by Sofreh
    Capital, but its public profile still discloses little about revenue, customer scale, retention, or seed terms.
