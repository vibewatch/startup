      - number: '1.5'
        title: External caveats around privacy, regulation, and clinical AI
        blocks:
          - type: paragraph
            body: >-
              The most important negative signal in Tala's current public materials is not an adverse news article; it
              is an internal inconsistency. The privacy policy says Tala does not collect personal information or health
              data, yet the company product description promises personalized virtual care, symptom handling, referrals,
              and clinician-supported coordination. That mismatch may simply reflect an immature marketing site, but for
              a healthcare company it also suggests legal and compliance documentation is not yet production grade.
              External context makes that issue more material. JAMA's 2025 review of health-AI regulation emphasized
              that liability and regulatory boundaries remain unsettled, while Stanford Medicine's 2026 State of
              Clinical AI summary argued that real-world clinical performance often lags benchmark-level claims and
              still depends on human oversight. HHS and CCHP guidance reinforce that a national telehealth model must
              manage reimbursement, licensure, and state-law fragmentation. Tala's concept is credible enough to attract
              major capital, but its public disclosure package is still thinner than its ambition.
