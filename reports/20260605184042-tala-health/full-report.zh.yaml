            body: >-
              Tala 确有一些可见缓释。它明确表示 AI 与临床医生协作而不是取代他们，也提到受 FDA 跟踪的临床智能体工具，并且至少已经开始招聘核心基础设施岗位。
              品类来源也给出一套合理合规操作手册：保留独立临床判断，区分行政和临床功能，落实 BAA 和违规事件流程，并使用正式 AI 风险管理框架。 但剩余暴露问题在于，这些控制是否已经落到 Tala
              的实际部署架构里。如果公开证据跟不上，投资论点会很快破裂。最快的三条失败路径是： 支付方牵引仍未具名且不可量化；隐私或追踪做法与不收集数据的公开叙事相冲突；或逐州 AI 和远程医疗规则迫使产品比投资人预期更窄。
