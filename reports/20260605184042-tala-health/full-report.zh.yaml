            body: >-
              放到正确可比集合里，Tala 的价格显得要求很高。上市远程医疗可比公司不是靠神秘溢价交易：Hims 市值约 $6.1 billion，一季度收入约 $608 million， 订阅者近 2.6
              million，并上调了 2026 年指引；Teladoc 虽有 $2.53 billion 的 2025 年收入，市值仍接近 $1.26 billion。 Amwell 市值更低，约 $140
              million，但作为上市公司仍提供申报级披露。私营数字健康龙头的证据栈也比 Tala 的公开记录完整得多。 Spring Health 是在报告超过 10 million 覆盖人群和 400+ 雇主之后，才披露
              $3.3 billion 估值；Transcarent 披露 $2.2 billion 估值时， 也伴随基于风险的雇主定价和后来收购 Accolade 的背景。需求侧，2026
              年雇主和采购方来源更怀疑而不是宽容：买方正面对更高的医疗成本趋势， 要求可衡量结果，并明确警告表现不佳的供应商会被砍掉。这一背景抬高了而不是降低了 $1.2 billion 种子轮的举证门槛。
