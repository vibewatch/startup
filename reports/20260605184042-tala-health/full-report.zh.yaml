  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接平台竞争者围绕 Tala 对外宣传的任务聚集
        blocks:
          - type: paragraph
            body: >-
              从 Tala 自己对外宣传的任务入手。公司称正在打造 AI 智能体，用来支持持证专业人员、减轻行政负担，并让患者获得 24/7
              虚拟医疗访问，且能顺畅转入线下医疗。公司还称已与美国两家最大型医疗保险公司合作。这个框架把大量泛远程医疗排除在外，因为它们过窄或过于面向消费者。最接近的公开直接同行是 Transcarent、Included
              Health、Amwell、Teladoc 和 Quantum。Transcarent 的叙事匹配度最高，因为它把智能体 AI、临床人员支持的指导、福利导航和 24/7
              虚拟初级保健放进同一条流程。Included 与 Tala 重叠在同一组雇主和健康计划买方上，并销售一个单一应用，覆盖医疗、财务和行政支持以及 24/7 帮助。Amwell
              更接近企业基础设施，而不是面向成员的导航，但它仍通过承诺单一医疗平台争夺同一批支付方和医疗系统预算。Teladoc 和 Quantum
              更像既有厂商，但在真实评估中仍重要，因为它们已经把虚拟访问或导航与规模化企业分销绑在一起。因此，Tala 并不是进入一个空白的 AI
              原生小众市场；它进入的是拥挤子赛道，多家厂商已经销售前门导航、虚拟访问和临床协调的某种组合。
