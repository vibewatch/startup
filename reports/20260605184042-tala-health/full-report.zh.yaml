      - CV048
  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 证据
      - 对 Tala 的启示
      - 局限
      - 状态
    rows:
      - - Hims & Hers Health
        - ~$6.07B 市值；2026 年 Q1 收入 ~$608M；~2.6M 订阅用户。
        - 高增长公开健康平台的估值背后，仍有可见收入和订阅用户规模
        - 面向消费者的模式不同于支付方主导的虚拟照护
        - 公开市场
      - - Teladoc Health
        - ~$1.26B 市值；FY2025 收入 $2.53B；2025 市值 / 收入 ~0.49x。
        - Tala 的定价接近 Teladoc 整体股权价值，却没有 Teladoc 的披露基础
        - Teladoc 是重置后的成熟可比公司，历史包袱不同
        - 公开市场
      - - American Well
        - ~$0.14B 市值，并持续披露 10-K。
        - 为企业基础设施型公司提供低端公开远程医疗参照
        - 当前运营轨迹弱于 Tala 的愿景叙事
        - 公开市场
      - - Spring Health
        - $100M Series E 轮，估值 $3.3B；该轮披露 >10M 覆盖人群和 >400 家雇主。
        - 私有品类赢家可以值数十亿美元，但通常会拿出大规模买方证据
        - 心理健康专精不同于 Tala 更宽的照护导航野心
        - 私有市场
      - - Transcarent
        - $126M Series D 后估值 $2.2B；采用风险共担的雇主定价，后续与 Accolade 合并。
        - 商业结构清晰时，集成式导航平台可以支撑大估值
        - 平台和融资历史都比 Tala 更成熟
        - 私有市场
      - - 火热 AI 种子轮市场
        - 火热 AI 种子轮投后可达 $40M-$45M，少数稀缺 AI 种子轮超过 $100M。
        - Tala 的 $1.2B 种子轮远高于亢奋 AI 种子轮常态
        - 通用 AI 基准比直接数字健康可比公司噪声更大
        - 跨行业
    notes: 本表混合公开远程医疗可比公司、私有数字健康龙头和 AI 种子轮背景，因为不存在完美一一对应的公开 Tala 类比。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the main benchmark buckets most relevant to Tala's financing narrative rather than every listed or
        private digital-health company.
