      - number: '1.4'
        title: 里程碑、招聘与早期就绪信号
        blocks:
          - type: paragraph
            body: >-
              从发布到融资之间，Tala 最具体的运营信号来自自家招聘页面。2025 年末，职业页面和职位描述显示公司在数据科学、机器学习、MLOps、站点可靠性和通用 AI
              工程岗位上扩建团队。这些招聘信息比普通初创公司文案更有信息量，因为它们写清了 Tala 预期运行的交付栈：去标识化临床数据集、模型微调、实验跟踪、特征库、模型注册表、可观测性、事件响应和 24/7
              在线。换句话说，Tala 招的是生产级临床 AI
              平台团队，而不是原型项目团队。发布文章还给出一个有意义的里程碑：公司声称已与两家美国最大型医疗保险公司合作。这提供了有方向性的证据，但没有具名支付方合作伙伴或案例研究，外部读者仍无法区分试点与规模化合约。因此，里程碑记录显示出严肃的运营意图，却还没有显示成熟的商业证明。
