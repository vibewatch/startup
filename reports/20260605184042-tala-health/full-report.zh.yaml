            body: >-
              Babylon 是该类别不应忽视的反向可比。TechCrunch 报道称，该公司曾估值接近 $2 billion，随后破产、进入英国破产管理，并在 2023 年被拆售。这不是虚拟医疗已成死市场的证据，而是说明
              AI 赋能远程医疗的规模、保险公司关系和强叙事本身不能创造持久经济模型。这个教训直接适用于
              Tala。新进入者如果比既有厂商更好解决一个狭窄企业工作流，仍可以赢；但市场已经存在覆盖更广的平台，它们披露的触达更大、产品打包更成熟，有些公开结果叙事也更好。实际威胁排序因此是：Transcarent、Included、Amwell、Teladoc
