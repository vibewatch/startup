  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 估值逻辑
      - 支撑 $1.2B 所需收入
      - 必须成立的条件
      - 概率信号
    rows:
      - - 乐观
        - 示意性 5.0x 溢价增长倍数。
        - $240M
        - Tala 已有强合同规模、经验证 ROI 和有吸引力的单位经济，只是尚未公开
        - 有可能，但今天没有公开证据
      - - 基准
        - Hims 式公开增长倍数，约 2.5x。
        - $480M
        - Tala 需要相当商业规模，以及可见留存和定价权
        - 当前假设了过多隐藏证据
      - - 悲观
        - 1.0x 低溢价远程医疗倍数。
        - $1.2B
        - 公司增长，但买方把它视为未经验证或差异化较弱的虚拟照护供应商
        - 如果 ROI 证据仍稀疏，这是合理结果
      - - 硬下行
        - Teladoc 式压缩倍数，约 0.49x。
        - $2.45B
        - 公开市场最终按面临行业压缩的远程医疗平台来评判 Tala
        - 用这个视角看，当前种子轮定价非常满
    notes: 5.0x 和 1.0x 行是用于测试投资纪律的情景假设；2.5x 和 0.49x 行则锚定 Hims 和 Teladoc 的公开基准数学。
    claimRefs:
