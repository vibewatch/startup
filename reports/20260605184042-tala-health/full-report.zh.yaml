              Tala 最重要的外部依赖不是云供应商或 AI 模型供应商，而是未具名保险公司关系是否是真正上线渠道，带有会员量、报销路径和续约潜力。 公司没有披露支付方、部署州或会员基数，投资人还无法判断 Tala
              拥有分发、只是拿到入口，还是仅停留在早期战略对话。同类竞争者公布的规模和广度证据更强， 这让不透明更成问题。Transcarent 主打智能体式导航，并报告其在雇主和健康计划中的会员互动更好；Included
