  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 合规、隐私和验证问题如何从产品设计传导到支付方信任、收入和估值。
    data:
      nodes:
        - id: state_ai
          label: 州级 AI 法律碎片化
          detail: 披露、监督和治疗用途限制可能因州而异。
        - id: telehealth_rules
          label: 远程医疗执照 / 报销差异
          detail: 执照、同意、处方和支付方同等报销规则仍然因州而异。
        - id: privacy_gap
          label: 隐私政策 / PHI 处理不匹配
          detail: 未来面向患者的工作流可能比当前政策显示的监管强度更高。
        - id: validation_gap
          label: Tala 专属安全证据缺口
          detail: 外部 VT 文献存在，但 Tala 专属验证尚未公开。
        - id: implementation_delay
          label: 实施延迟或返工
          detail: 法律把关、集成工作或重新设计会拖慢部署。
        - id: member_trust
          label: 会员和临床医生信任受损
          detail: 升级处理不佳、隐私问题或 AI 角色设计混乱，都可能压低采用率。
        - id: payer_renewal
          label: 支付方续约 / 扩张风险
          detail: 结果疲弱或合规顾虑会降低转化和续约概率。
        - id: fca
          label: 欺诈 / 报酬审查
          detail: 文档、营销或导流问题可能引来 FCA 或 AKS 关注。
        - id: valuation
          label: 估值压缩
          detail: 如果证据滞后或风险上升，融资杠杆会下降。
      edges:
        - from: state_ai
          to: implementation_delay
          label: 迫使功能按州设限
        - from: telehealth_rules
          to: implementation_delay
          label: 增加逐州合规工作
        - from: privacy_gap
          to: member_trust
          label: 削弱信任叙事
        - from: validation_gap
          to: member_trust
          label: 削弱安全信心
        - from: implementation_delay
