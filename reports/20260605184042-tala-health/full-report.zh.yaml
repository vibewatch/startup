      - number: '1.5'
        title: 隐私、监管与临床 AI 的外部警示
        blocks:
          - type: paragraph
            body: >-
              Tala 当前公开材料中最重要的负面信号不是负面新闻，而是内部不一致。隐私政策称 Tala
              不收集个人信息或健康数据，但公司产品描述又承诺个性化虚拟医疗、症状处理、转诊和临床人员支持的协调。这种错位可能只是营销网站尚未成熟，但对医疗公司来说，也说明法律与合规文件还没到生产级。外部背景让这个问题更重要。JAMA
              2025 年关于健康 AI 监管的综述强调，责任和监管边界仍未稳定；Stanford Medicine 2026 年《State of Clinical
              AI》摘要则认为，真实世界临床表现往往落后于基准测试层面的主张，并且仍依赖人工监督。HHS 和 CCHP 指引也强化了同一点：全国性远程医疗模式必须处理报销、执照和州法碎片化。Tala
              的概念足以吸引大额资本，但其公开披露包仍比野心薄得多。
