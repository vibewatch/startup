              情景逻辑也指向同一结论。用 Hims 当前季度年化收入对照其 2026 年 6 月市值，隐含股权价值 / 收入倍数约 2.5x。把这个公开成长股标尺套到 Tala 的 $1.2 billion 价格上，意味着约
              $480 million 年收入。Teladoc 2025 年市值 / 收入比低得多，约 0.49x；在压缩后的上市远程医疗视角下， 这意味着 Tala 需要约 $2.45 billion
              收入才能支撑估值。Tala 今天的定价也大约相当于 Teladoc 整个上市股权价值的 95%，尽管 Teladoc 拥有数十亿美元收入和申报级披露。若对照热门 AI 种子轮基准，差距更夸张：Tala 的
              $1.2 billion 标记约为热门 AI 种子轮交易所引用 $45 million 高端投后基准的 27 倍。因此，牛市情景只有在 Tala 已经建立隐藏商业规模、可持续支付方或雇主
              ROI，且合同经济性远强于公开证据显示时才成立。 基准情景更简单：资本形成跑在已披露证据前面，所以价格看起来偏紧。
