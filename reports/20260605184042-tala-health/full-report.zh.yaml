      - number: '2.3'
        title: 买方 / 用户 / 支付方地图：保险公司和雇主采购，成员使用，临床与行政人员必须接入
        blocks:
          - type: paragraph
            body: >-
              这个类别的公开买方地图比 Tala
              自身牵引力数据更清楚。相邻厂商反复呈现同一结构：保险公司、自保雇主和医疗系统合作伙伴采购平台；成员或员工是日常用户；临床人员、照护向导和行政人员成为运营参与者；最终支付方通常是赞助的健康计划或雇主。Transcarent
              强调福利导航、专家指导和 24/7 虚拟医疗。Included Health 向雇主和健康计划销售一个整合式组合，覆盖理赔支持、导航和临床医疗。Amwell 向支付方和医疗系统销售平台层，Spring
              Health 则营销覆盖人群、ROI 和雇主结果。这些模式重要，因为它们意味着 Tala
              不是只卖给医生，也不是只卖给患者。预算权很可能在医疗成本、医疗管理、人口健康或福利负责人手里；他们想要的是更少被导错路径的就医事件、更快成员问题解决、更低可避免利用率和更清晰成员体验。这也意味着采用取决于跨行政与临床工作流传递上下文的能力。在
              Tala 的框架里，重要旅程不是“患者能否和医生视频聊天？”，而是“支付方或雇主能否把成员从症状或困惑更快带到合适医疗场景，同时减少交接和浪费？”
