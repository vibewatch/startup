        - 高
        - 如果对手复制工作流语言和分销，AI 文案会很快商品化
        - 索取相对具名同业在成本、质量和转诊完成率上的工作流级证明
      - - 24/7 虚拟医疗访问形成直接护城河
        - Transcarent 和 Teladoc 已在营销 24/7 访问，且披露的企业覆盖远大得多
