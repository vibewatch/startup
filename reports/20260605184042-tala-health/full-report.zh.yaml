        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，最站得住的结论是 research-more，信心中等、风险高，估值立场偏紧。如果内部数据显示覆盖人群渗透率大、留存强、且买方在意的结果得到验证， Tala
              未来也许配得上溢价，但当前公开文件没有跨过这条线。下行风险并不抽象。买方正在明确收紧 ROI 要求，行业也已有 Babylon 这个警示案例： 虚拟医疗野心和公开市场叙事没有阻止破产和清盘。对 Tala
              而言，决定性尽调要求很直接：当前收入和毛利率、按买方队列划分的留存、 覆盖人群或活跃会员、具名支付方或雇主标识、实际定价或履约保证，以及 $100 million 种子轮的条款清单机制。在拿到这些事项之前，
              正确纪律是把公司视为有前景但昂贵，而不是按表面估值已经可投。
