  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是最直接的扩张约束
        blocks:
          - type: paragraph
            body: >-
              Tala 自身材料把公司定位为由临床医生增强的虚拟医疗平台，目标是在服务大型保险公司的同时，影响转诊路由、照护协调、用药续方和 24/7 患者访问。 这组能力让公司的合规暴露面远大于简单行政 SaaS
              工作流。公开监管来源显示，远程医疗执照、支付方报销、同意和处方规则在各州仍有实质差异； 加州、德州、伊利诺伊、内华达等州 2025-2026 年 AI
              法律又加入披露、监督和心理健康专项限制，可能迫使产品按州拆分。同时， 远程医疗执法已不再只是抽象警示：法律评论列出围绕回扣、处方压力和临床医患关系不足的真实行动；FTC 隐私先例也显示，
              消费者健康平台若数据使用做法跑在承诺前面，可能面临实质处罚。Tala 公开最强缓释是临床医生在环叙事，但它本身不能回答关键尽调问题： 公司是否已经搭好了面向全国推广的逐州执照、监督、文档和供应商架构。
