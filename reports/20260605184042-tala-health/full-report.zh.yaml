      - number: '3.2'
        title: 既有厂商、打包替代方案和替代品把战场拉宽
        blocks:
          - type: paragraph
            body: >-
              竞争压力也来自直接同行之外。Quantum 和 apree/Castlight 说明，导航可以折进更广泛的雇主福利或初级保健关系里，而不必作为单独 AI 优先系统采购。Accolade
              仍在线的成员界面显示，账单协助、权益倡导、第二诊疗意见和护士支持的指导早已是熟悉的类别功能，即便没有 Tala 的智能体词汇。Spring Health 和 Hims 是不同类型的替代品。Spring 不复制
              Tala 完整的面向保险公司的编排故事，但其超过 20 million 覆盖人群、快速预约访问和保证 ROI，使它在买方优先考虑心理健康结果时能赢得同一笔福利预算。Hims
              从相反方向切入：它主要是消费者订阅远程医疗，成员定价可见、收入规模很大，因此能吸收部分低急迫性需求，却不解决 Tala 面向支付方或雇主的导航任务。Built In、Becker's 和 StartUs
              都强化同一个更广泛观点：远程医疗仍然拥挤、创新密集，充满相邻厂商；即使不是一对一替代品，它们也能分走预算或成员注意力。
