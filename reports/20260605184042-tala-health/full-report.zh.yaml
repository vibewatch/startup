      - number: '5.3'
        title: 信任、质量、隐私与监管就绪度
        blocks:
          - type: paragraph
            body: >-
              信任披露好坏参半。积极面是，Tala 的招聘信息持续提到
              HIPAA、审计日志、加密、可解释性、安全指标、访问控制和受监管环境工程。这是一支预期处理敏感工作流的团队才会使用的语言，而不是纯信息型应用的语言。但公开信任表面本身很薄。隐私政策称 Tala
              不收集个人数据、健康数据、用户画像或 Cookie，这读起来像是针对公开网站的声明，而不是完整解释一个上线虚拟医疗产品如何处理 PHI、同意、留存、商业伙伴关系或去标识化治理。同样，发布文章提到受 FDA
              跟踪的工具，但已审阅公开材料没有说明这个短语背后的产品、研究或质量体系。


              外部政策和研究来源让这些遗漏不仅是表面问题。HHS 远程医疗指引和 CCHP 州政策调查显示，全国性虚拟医疗部署仍取决于逐州执照和报销约束。AMA 和 Fenwick 都描述了州层面 AI
              医疗制度正快速收紧，重点围绕披露、人工监督，以及误导性拟人化或临床声明。Stanford、PHTI、Wolters Kluwer、Doximity 和 NCQA 都指向同一个更广泛观点：AI
              可以带来真实工作流价值，但安全规模化需要证据、治理、临床人员信任和标准化。Tala 的公开材料与这个方向一致，但还没有给出足够运营证据来单独闭合信任论证。
