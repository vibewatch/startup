        title: 领导团队、顾问与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              公开披露的领导层以创始人 Ritankar Das 和 CEO Tanner Smith 为中心。Das 自称科学家型创业者，创立了 Titan Holdings 和 Tala
              Health，有机器学习研究背景、Cambridge 博士辍学经历，并围绕早期学术成就提出极其雄心的表述。相比之下，Smith 被定位为运营型高管，曾帮助扩张 Dascena 和 Forta
              Health。Tala 官网还突出了一组对新近发布公司而言异常重磅的顾问：Johnson & Johnson 前 R&D 负责人 Mathai Mammen、急诊医生兼数字健康运营者 Uli
              Chettipally，以及诺贝尔奖得主 John
              Mather。这组顾问能部分抵消单纯的创始人关键人风险，但治理披露仍很轻：没有公开董事会名单，没有正式委员会结构，也看不到所有权或决策权安排。结果是可信度信号很强，但种子阶段的治理轮廓仍以创始人为中心。
