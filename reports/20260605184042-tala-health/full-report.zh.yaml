chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、发布逻辑与运营模式
        blocks:
          - type: paragraph
            body: >-
              Tala Health 于 2025 年 8 月公开亮相，叙事核心是美国医疗体系在症状出现到真正解决之间的“最后一公里”失灵。公司并不把自己定位为窄口径聊天机器人供应商，而是 AI
              原生虚拟医疗平台：从接诊到随访，把自研临床和非临床智能体与持证临床人员串在一起。在官网、关于页面和发布文章中，Tala
              反复声称可以协调分诊、转诊、随访和行政环节，把诊断和治疗时间压短；这些环节通常分散在医疗服务方和支付方工作流里。这个定位对尽调很关键，因为它意味着 Tala
              想掌握的是一层广义的就医导航，而不是单点方案。TFN、HLTH 和 HIT Consultant 等独立报道也把 Tala 描述为 Titan Holdings
              孵化的旧金山公司，为后文提供稳定的身份锚点，但尚未证明商业牵引力。
