  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Tala 还必须补完这段公开买方旅程，早期合作才能被视作可持续的企业采用。
    data:
      items:
        - label: 痛点触发
          detail: 支付方、医疗服务方以及最终的雇主，都面对照护碎片化、成本上升、会员体验差；患者和临床医生最直接感受到摩擦。
          touchpoints:
            - 碎片化导诊
            - 行政负担
            - 成本压力
        - label: 买方兴趣
          detail: Tala 面向买方讲的是 AI + 临床医生：核心是 24/7 可及、照护协调，以及帮支付方减少浪费。
          touchpoints:
            - 支付方价值主张
            - 虚拟就医可及承诺
            - 临床 AI 支持
        - label: 证据关口
          detail: 试点或合同要有完整商业分量，企业买方还需要具名参考客户、部署范围、集成细节和结果记分卡。
          touchpoints:
            - 具名参考客户
            - 实施计划
            - 结果衡量
        - label: 部署
          detail: Tala 设想的运营模式是先做虚拟分诊，由临床医生支持转诊；需要时再交接到线下照护。
          touchpoints:
            - 24/7 虚拟入口
            - 转诊编排
            - 临床医生在环工作流
        - label: 续约 / 扩张
          detail: Tala 要进入雇主、更多健康计划或更广医疗服务网络，就需要可审计的使用率、节省额、满意度和续约证据。
          touchpoints:
