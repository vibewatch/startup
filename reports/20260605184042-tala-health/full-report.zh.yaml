  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 支付方证据始终停留在叙事，未变成实证
        - 具名保险公司上线、会员数或持续合同披露
        - 在下一轮融资或重大扩张里程碑前，仍没有具名支付方实施、会员分母或续约证据
        - 将 Tala 视为分发尚未验证，并下调护城河假设
      - - 隐私叙事被产品现实反驳
        - 公开隐私更新、应用商店披露、跟踪技术发现或事件报告
        - 任一证据显示 PHI 处理或广告技术使用，与当前“无数据 / 无跟踪”政策冲突
        - 立即升级；重新评估法律、合作伙伴信任和安全暴露
      - - 州级 AI 法限制核心工作流
        - California、Texas、Illinois 或 Nevada 出现实质产品门槛
        - 重点目标州要求关闭或重大重设计一项 Tala 核心功能
        - 下调可服务市场假设，并在投资前要求逐州产品路线图
      - - 临床安全证据仍仅来自外部
        - Tala 专属验证或不良事件报告
        - 在广泛支付方上线前，没有 Tala 专属前瞻性验证、人工改判数据或安全监测证明
        - 将临床安全主张视为未验证，并为投资判断信心设上限
      - - 执行板凳仍薄
        - 合规、临床运营、支付方实施和可靠性负责人招聘
        - 支付方范围扩大时，关键运营岗位仍空缺或集中在创始人手中
        - 假设实施更慢，宕机或合规滑坡风险更高
      - - 出现 FCA 或 AKS 预警信号
        - 支付方或转诊工作流中出现举报人主张、审计问题或报酬安排疑虑
        - 任一内外部信号显示量、文档或导流激励错配
        - 在合规整改和独立法律审查前，暂停增长假设
    notes: 这些否决标准旨在通过尽调材料、管理层更新或公开披露来监测，而不是等失败后回头判断。
    claimRefs:
      - CR017
      - CR024
      - CR051
      - CR052
      - CR053
      - CR054
      - CR058
      - CR059
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 含义
    rows:
      - - 建议
        - 继续研究
        - 公开证据还不足以支撑按名义入场价投资
        - 没有私有数据包，不按表面价格出手
      - - 信心
        - 中
        - 价格信号真实，但关键运营指标仍未披露
        - 证据足以标记估值偏高，不足以精确定价
      - - 风险评级
        - 高
        - 缺少收入、客户、ROI 和条款清单细节，留下太多下行路径
        - 要求下行保护，或推迟
      - - 估值立场
        - 偏高
        - 对照公开和私募基准，融资节奏跑在公开证据前面
        - 价格纪律应比本轮融资头条更严格
      - - 决策含义
        - 仅在尽调后跟踪
        - 公司可能有吸引力，但当前价格跑在已披露验证之前
        - 只有私有指标显著超过公开证据暗示的水平，才上调判断
    notes: 本表是本章结论，不替代定价轮模型或股权结构表审查。
