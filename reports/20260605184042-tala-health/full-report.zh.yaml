  - id: TV005
    title: 论点破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 为何重要
      - 可能行动
    rows:
      - - 商业规模不及预期
        - 收入远低于即便 Hims 式公开增长倍数所隐含的水平
        - 本轮融资是跑在证据前面，不是跑在时代前面
        - 重设估值预期，或退出
      - - 买方 ROI 证据薄弱
        - 管理层无法拿出经得起采购方审查的定价、节省、留存或结果保证
        - 2026 年买方明确提高标准
        - 将公司视为未经验证的试点阶段资产
      - - 客户披露仍缺席
        - 尽调中没有出现覆盖人群、会员或具名客户披露
        - 没有规模证据，溢价可比公司的说服力会减弱
        - 保持“继续研究”建议，或回避
      - - 种子轮条款保护投资人
        - 优先权、棘轮或老股比例显示，普通股经济性弱于头条估值暗示
        - 头条估值可能夸大真实入场质量
        - 按普通股经济性现实重新定价
      - - 品类压缩扩散
        - 公开远程医疗倍数持续低迷，买方怀疑加深
        - 即使执行扎实，也未必守得住溢价倍数
        - 使用下行情景，而不是头条估值
    notes: 这些触发因素旨在迅速把决策从叙事拉回投资纪律。
    claimRefs:
      - CV006
      - CV007
      - CV013
      - CV014
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 待核实事项
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入、毛利率与留存
        - 核心经济指标没有公开披露。
        - 决定溢价倍数是否站得住。
        - CFO 数据包，包含月度经常性收入桥接表和队列数据。
      - - 覆盖人群、活跃会员与具名客户
        - 没有公开规模数据或可访谈标杆客户。
        - 检验平台是否已经具备分发落地条件。
        - 商业尽调和客户访谈。
      - - 定价模型与 ROI 证据
        - 没有公开 PMPM 定价、节省指标或续约证据。
        - 2026 年买方审查趋严，这会成为估值支撑的核心。
        - 合同样本加买方结果仪表盘。
      - - 种子轮条款清单与股权结构经济性
        - 优先权、稀释、老股比例均无公开披露。
        - 名义估值可能不等于普通股价值。
        - 融资文件法律审查。
      - - 竞争赢单 / 输单与实施数据
        - 没有公开证据说明 Tala 为什么赢单、上线多快。
        - 区分真实平台优势和发布期营销。
        - 结合近期交易做市场进入与实施尽调。
    notes: 在这些问题得到回答前，正确做法是保持尽调纪律，而不是热情照单接受价格。
    claimRefs:
