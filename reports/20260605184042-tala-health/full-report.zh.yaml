        title: 运营、临床安全和隐私风险都卡在产品现实是否跑在公开证据前面
        blocks:
          - type: paragraph
            body: >-
              最大的剩余运营风险不是 Tala 追的概念不可能，而是面向患者的 AI 在安全、升级逻辑和隐私控制可见之前，就可能听起来已经运营成熟。 Tala
              的隐私政策目前说其不收集个人数据、健康数据或追踪技术；这对当前网站也许准确，但如果公司开始规模化处理认证用户流量、问诊录入工作流或症状数据， 它还没有和更大的虚拟医疗抱负对上。HHS OCR
              指引明确，一旦认证远程医疗工作流或预约流程触及 PHI，追踪供应商可能成为业务伙伴， 普通 cookie 同意流程不够。外部虚拟分诊证据方向上令人鼓舞，但同一文献也表明，面向患者系统需要明确升级路径和临床确认；
              Stanford 综述尤其重要，因为它认为多数医疗 AI 证据仍未反映真实世界工作流复杂性、不确定性或偏差测试。对 Tala 而言，
              安全问题不是虚拟分诊是否永远能帮上忙，而是这家公司的具体实现能否在支付方审查下安全、可审计地运行。
