companyProfile:
  summary: >-
    Tala Health 是一家总部位于旧金山的 AI 虚拟医疗初创公司，由 Titan Holdings 孵化，Ritankar Das 于 2025
    年创立，试图围绕“临床人员在环”的运营模式重构碎片化的医疗旅程。公开材料称，Tala 结合自研 AI 智能体和持证临床人员，为面向支付方的采购渠道提供 24/7 接诊、分诊、转诊协调、文档记录、治疗支持和随访。公司于 2025 年
    8 月走出隐身状态，并在 2025 年 11 月宣布由 Sofreh Capital 领投的 $100M 种子轮；但公开信息对收入、客户规模、留存和种子轮条款仍披露很少。
