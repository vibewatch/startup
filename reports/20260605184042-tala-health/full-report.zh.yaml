        - 既有厂商可以靠更强采购信任抵消访问主张
        - 索取专门对企业虚拟医疗平台的赢单 / 输单数据
      - - 保险公司合作形成持久分销杠杆
        - Tala 披露两家大型保险公司合作，但没有具名客户、覆盖人数或续约证据
        - 高
        - 即使关系真实，未披露规模也会削弱 GTM 护城河主张
        - 索取具名合同、覆盖人数和按渠道划分的管线转化
      - - 转诊闭环焦点形成差异化会员体验
        - Included、Accolade 和 Quantum 已在营销理赔帮助、指导、第二诊疗意见或协调
        - 中
        - 工作流痛点可能是全品类共性，而非 Tala 独有
        - 索取与 Tala 部署绑定的转诊周期、完成率和 NPS 变化
      - - 企业买方会偏好 AI 原生新进入者
        - 雇主正在提高供应商合作门槛，并转向绩效挂钩合同
        - 高
        - 没有公开 ROI 或保证语言的新进入者，信任负担更重
        - 询问 Tala 是否愿意用风险共担或可量化保证来承担绩效
      - - 切换成本会保护续约
        - Quantum 和 apree 显示，叠加层可以以有限扰动接入现有承保方或医疗技术栈
        - 中
        - 多供应商并用会降低锁定效应，即便实施并非小事
        - 对照直接同业，核查实施投入、迁移周期和流失原因
      - - 品类规模验证了模式
