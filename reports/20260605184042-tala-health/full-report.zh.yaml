        - 买方选择公开证据更多、产品更宽或已有会员规模更大的平台
        - 高
        - Tala 的聚焦和新融资或许能帮它切入特定楔形市场
        - 公开竞争对手证据强于 Tala 当前披露的牵引力
      - - 福利方案设计与合规中介
        - 理赔管理方、PBM、福利团队、法律顾问
        - 同等待遇合规、文档和报销运营
        - 中
        - 落地复杂度会拖慢销售周期，或给每次部署增加隐性成本
        - 中高
        - 既有福利项目已经有成熟打法
        - Tala 与支付方管理员之间如何分配责任尚未公开
    notes: 剩余风险暴露最高的地方，正是 Tala 叙事依赖未具名对手方或未公开运营细节的地方。
