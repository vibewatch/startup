      - number: '7.4'
        title: 人员和执行风险仍高，因为公开团队厚度看起来仍早期
        blocks:
          - type: paragraph
            body: >-
              执行风险偏高，因为 Tala 试图一次搭建多项高难度能力：保险公司实施、临床医生监督、患者运营、AI 开发、隐私与合规、全天候可靠性。 公开招聘信号显示公司在补正确要素——数据科学、MLOps
              和站点可靠性——但也暗示核心运营机器到 2025 年末仍在组装。公开材料更强调创始人和顾问可信度，
              而不是多州受监管服务推广通常需要的更深运营班底。这不代表实际团队薄弱；它意味着外部投资人今天无法从公开证据验证深度、继任安排或决策权。
              现实里，这抬高了两类风险。第一，如果少数高管成为合规、临床设计和支付方实施的瓶颈，交付质量会下滑。第二，
              虚拟医疗业务里的执行错误往往会复合：可靠性团队偏薄会拖累服务质量，继而放慢支付方扩张，再反过来限制招聘和合规投入。 因此，公开团队厚度稀疏不只是治理问题；它会直接放大运营风险。
