      - number: '3.3'
        title: 产品打包和信任信号比精确定价更公开
        blocks:
          - type: paragraph
            body: >-
              企业同行的公开定价普遍薄弱，但产品打包信息披露并不少。Tala
              不公布价格、合约结构、覆盖人群、具名客户或已发布结果。多数直接同行在主公开页面也不公布准确价目表，因此比较只能使用买方真正看得到的信号。Transcarent
              销售的是跨导航、指导和医疗交付的一体化成员体验。Included 销售单一覆盖福利和应用，横跨医疗、财务和行政需求。Quantum 通过分层套餐传递模块化信号，apree 明确营销绩效保证和风险共担。Hims
              主要突出在消费者订阅迫使其定价远比企业导航合约更可见。2026 年的重要背景是买方只会更严格，不会更宽松。Business Group on Health 称，雇主预期中位数 9%
              成本趋势，并提高供应商合作门槛；PHTI 相关报道称，数字健康采购正从简单 PMPM 访问费转向基于绩效的模式。NCQA 和 ATA 又加上第二道买方筛选：虚拟医疗平台仍必须证明信任、标准化和报销就绪度，而不只是
              AI 野心。
