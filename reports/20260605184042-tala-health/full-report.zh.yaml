      - number: '2.2'
        title: 规模测算视角：买方池很大，但公开市场估算只是口径不一的外边界
        blocks:
          - type: paragraph
            body: >-
              Tala 所在类别的公开市场规模方向积极，但方法上很混乱。最宽口径下，Menlo 把医疗描述为 $4.9 trillion 行业，但软件投入仍不足；StartUs 和 MarkWide
              则把美国远程医疗和虚拟医疗收入放在当前大约 $39 billion 到 $43 billion 区间，并预计未来十年保持双位数增长。这些数字适合作为数字化交付层的外边界，而不是 Tala 的真实
              TAM。更有决策价值的买方视角是覆盖人群和雇主成本压力：Peterson-KFF 称，2025 年 3 月雇主赞助保险覆盖了 165.6 million 名 65 岁以下人群；KFF 2025 年雇主调查仍统计约
              154 million 人拥有雇主赞助保险，并显示家庭保费接近 $27,000。也就是说，在 Tala 证明份额获取之前，成员池和经济痛点已经巨大。问题在于分析师定义并不稳定。IMARC 的美国虚拟医疗数字比
              MarkWide 或 StartUs 高出几个数量级，意味着边界宽得多，可能纳入了远超导航软件切入点应声称的医疗交付支出。正确结论不是 Tala 的市场很小，而是可信的 SAM 或 SOM
              必须从目标覆盖人群、用例、定价和转化数据自下而上重建，而这些数据 Tala 尚未公开披露。
