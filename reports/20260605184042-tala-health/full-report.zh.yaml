        - 高
        - 没有稳固经济模型支撑，叙事优势会很快反转
        - 要求提供烧钱速度、贡献利润率、资本依赖度，以及走向稳固企业单位经济模型的路径
    notes: 严重度衡量的是对 Tala 持久性的风险，而不是威胁必然发生。买方采购会同时横跨直接同业、在位者、替代方案和警示性可比对象， 因此本风险登记表有意把四类证据放在一起。
