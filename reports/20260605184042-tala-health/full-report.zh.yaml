  - id: TR004
    title: 人员 / 执行风险登记表
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - 创始人 / 产品论点
        - 战略、临床 AI 叙事和品类定义，在公开材料里仍由创始人主导
        - 中
        - 高
        - 创始人信誉强，顾问阵容也较强
        - 要求提供继任计划、授权决策权，以及董事会对产品风险决策的监督机制
      - - 合规与法务运营
        - 公开资料看不到隐私、执照、报销或反欺诈合规执行的人才纵深
        - 中高
        - 高
        - 可借助外部律师和政策框架
        - 要求提供组织架构、内审节奏，以及执照、隐私和计费控制的责任矩阵
      - - 临床运营领导层
        - 公开资料看不到把“临床医生在环”设计转成可规模化服务交付的运营层
        - 中
        - 高
        - Tala 明确把临床医生放在中心，而不是完全自治 AI
        - 要求提供医疗主任架构、监督临床医生安排和升级治理机制
      - - 基础设施 / 可靠性领导层
        - 24/7 照护承诺依赖 SRE、平台和事件响应纵深，而这些岗位仍在公开招聘中
        - 中
        - 高
        - 至少能看到 SRE 和平台岗位招聘
        - 要求提供值班设计、可用性历史、人员计划和事件指挥流程
      - - 支付方实施团队
        - 未披露名称的保险合作方意味着公司有实施职能，但公开资料没有描述
        - 中高
        - 中高
        - 大额种子轮提供招聘能力
        - 要求按支付方提供部署人员模型、实施时间表和客户成功 KPI
    notes: 本表评估的是公开团队板凳风险，而非私下真实情况；严重性反映在受监管服务推出中，公开披露越薄，执行不确定性越被放大。
