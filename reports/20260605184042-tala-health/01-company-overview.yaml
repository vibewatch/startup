chapter:
  number: 1
  title: Company Overview
  summary: >-
    Tala Health exited stealth in 2025 with an unusually large $100M seed round, a $1.2B valuation, and
    a high-credibility advisor bench. Public materials establish an ambitious AI-plus-clinician virtual-care
    thesis and early insurer relationships, but they do not yet disclose the commercial metrics, named
    customers, or governance detail needed to underwrite operating maturity.
