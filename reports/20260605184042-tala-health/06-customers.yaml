- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Diligence path
  rows:
  - - Anchor payer relationships
    - One or two insurer contracts could represent most early revenue or implementation load
    - Renewal slippage or procurement pauses could materially slow scale
    - Request top-customer revenue share, contract start dates, lives covered, and renewal calendar
  - - Provider / institution partnerships
    - Unnamed institutions could be pilots or narrow design partnerships rather than scaled deployments
    - Channel may not generalize across markets or service lines
    - Request site list, use-case scope, go-live dates, and reference calls
  - - Employer benefits expansion
    - Buyer demand exists in the category, but Tala shows no public employer proof
    - Sales motion may be aspirational rather than active
    - Request employer pipeline, consultant relationships, and PMPM pricing structure
  - - Performance-based contracting
    - 2026 buyers want validated outcomes, scorecards, and audit rights
    - Weak proof or poor data access can cap pricing power and block renewals
    - Request active scorecards, guarantees, clawbacks, and buyer reporting packs
  - - State-by-state telehealth policy
    - Licensure and reimbursement rules still vary by state and payer
    - Implementation speed and economics may differ by market
    - Request state launch map, reimbursement assumptions, and staffing model
  - - Proof-surface gap versus peers
    - Peer vendors publish much denser evidence than Tala does
    - Raises diligence burden and likely slows trust-based enterprise expansion
    - Request named logos, deployment metrics, and at least one 12-month renewal cohort
  notes: This risk register is derived from retained public proof gaps and 2026 buyer behavior, not from Tala internal contract data.
