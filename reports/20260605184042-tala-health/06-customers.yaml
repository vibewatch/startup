- id: sec603
  title: 'Durability and Analog Benchmarks: Buyers Exist, but Tala Does Not Yet Publish Their Usual Proof Pack'
  body: 'Tala''s biggest customer-evidence gap is not buyer demand; it is proof density. Third-party and official 2026 buyer-side sources show that enterprise purchasers are raising the bar for digital-health vendors. PHTI says performance-based contracting is now table stakes and that buyers want data access, validated outcomes, and better value. Business Group on Health says employers are scrutinizing vendors harder and cutting those that cannot demonstrate measurable outcomes. NCQA says most payers already cover telehealth, but they increasingly want partners who can document outcomes, engagement, and operational fit. Stanford''s 2026 clinical-AI review adds a parallel warning: AI adoption is real, but the evidence base often lags flashy claims. Against that backdrop, mature peers publish the sort of facts Tala does not. Included Health discloses health-plan partnerships, covered lives, and satisfaction data; Transcarent discloses client and member scale plus quantified plan-side outcomes;
    Amwell publishes covered-benefit, health-system, and visit counts with named customer references; Spring Health publishes covered lives, rapid-access metrics, and continuation and clinical-improvement rates. Those analogs do not prove Tala''s traction, but they do show that enterprise virtual-care buyers exist and that category winners typically publish more concrete customer evidence than Tala currently does.'
