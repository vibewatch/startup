  rows:
  - - Payers
    - Buyer and payer; end users are members and care teams
    - Lower-cost navigation, triage, and virtual-care routing
    - Tala claims partnerships with two of the largest U.S. health insurers
    - Could anchor PMPM-style revenue and data access if contracts are real
    - No insurer names, covered lives, contract terms, or deployment scope
  - - Healthcare institutions
    - Possible buyer or delivery/channel partner; users are clinicians and patients
    - Clinician support, referrals, and integrated care delivery
    - Funding coverage says Tala plans to expand partnerships with leading U.S. healthcare institutions
    - Could unlock local care capacity and referral credibility
    - No institution names, service lines, or go-live evidence
  - - Clinicians
    - Primary workflow user rather than direct payer
    - Use AI support for diagnosis, coordination, and admin burden reduction
    - Clinician role is central across Tala official materials
    - Clinical adoption is necessary for any enterprise contract to stick
    - No clinician counts, specialty mix, or utilization data
  - - Patients
    - End user rather than contracting party
    - Access 24/7 virtual care with handoff to in-person visits when needed
    - Always-on access is a core product promise, but no member count is public
    - Patient engagement drives outcomes and renewal economics
    - No active-member, visit, or referral-completion metrics
  - - Employers (category-adjacent)
    - Potential self-insured buyer archetype inferred from peer market structure
    - Could buy navigation or virtual-care benefits if Tala enters benefits channels
    - No Tala employer page or named employer customer identified in retained sources
    - Large TAM if Tala can sell through benefit consultants or plans
    - Current employer relevance is inferential, not directly evidenced for Tala
  notes: The employer row is a category-adjacent inference based on peer distribution models and buyer-side sources, not verified Tala customer proof.
