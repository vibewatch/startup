  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-customer-identities
    missingEvidence: Named payer, provider, or employer accounts with at least one referenceable deployment.
    whyItMatters: Without named customers, outsiders cannot assess proof quality, segment mix, or strategic concentration.
    diligencePath: Request customer list, reference-call candidates, and one signed case study or press-release waiver.
    relatedQuestionRefs:
    - QU006
    - QU022
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: GRR, NRR, logo renewal, contract duration, and repeat-usage data by cohort.
    whyItMatters: Customer durability is the difference between an early partnership claim and a recurring enterprise revenue base.
    diligencePath: Request renewal cohorts, renewal calendar, term sheets, and customer-success scorecards for the first insurer and provider accounts.
    relatedQuestionRefs:
    - QU008
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: complaints-and-failed-deployments
    missingEvidence: Internal churn log, escalations, complaint volumes, implementation misses, and postmortems if any exist.
    whyItMatters: Low public visibility means public silence cannot prove low operational risk.
    diligencePath: Ask for lost-deal analysis, major-customer issue log, and any corrective-action summaries from implementations.
    relatedQuestionRefs:
    - QU023
  - type: missing-source
    severity: material
    topic: employer-channel-proof
    missingEvidence: Direct Tala evidence of employer targeting such as a benefits page, named employer logos, or consultant/channel partnerships.
    whyItMatters: Employer relevance is currently inferred from category structure rather than proved by Tala-specific go-to-market evidence.
    diligencePath: Request employer pipeline, benefits-consultant relationships, and one employer-specific demo or proposal deck.
    relatedQuestionRefs:
    - QU003
    - QU021
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: deployment-metrics
    missingEvidence: Covered lives, go-live sites, implementation timeline, active-member counts, visits, and referral-completion metrics.
    whyItMatters: Without deployment metrics, Tala’s public adoption trajectory cannot be quantified or benchmarked against peers.
    diligencePath: Request implementation tracker, KPI dashboard extracts, and one payer or provider monthly business review deck.
    relatedQuestionRefs:
    - QU005
    - QU007
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: contract-mechanics
    missingEvidence: Pricing model, PMPM or shared-savings structure, guarantees, clawbacks, audit rights, and data-sharing terms.
    whyItMatters: 2026 buyers increasingly use performance-linked contracts, so contract mechanics shape both expansion risk and gross-margin quality.
    diligencePath: Request redacted customer agreements, performance-scorecard templates, and renewal decision criteria from the first payer relationships.
    relatedQuestionRefs:
    - QU012
    - QU024
    relatedTableRefs:
    - TU005
