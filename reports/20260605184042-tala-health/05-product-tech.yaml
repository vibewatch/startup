    - Publicly claimed concept
    - Frames coordination and guidance as a middle layer between admin bots and clinical support
    - No public escalation logic, contraindication handling, or scope boundary
  - - Clinical AI agents
    - Licensed clinicians
    - Publicly claimed concept with “FDA-tracked tools” language
    - Keeps the clinician in the loop rather than marketing fully autonomous care
    - No named product, indication, trial, or regulatory artifact disclosed
  - - 24/7 virtual-care access layer
    - Patients
    - Publicly claimed access surface
    - Combines always-on digital entry with handoff into in-person care when needed
    - No state-by-state licensure, staffing, or response-time detail
  - - Internal data / AI platform
    - Data scientists, ML engineers, platform engineers
    - Hiring signal only
    - Careers pages imply de-identified data, evals, feature stores, registries, and observability
    - No public architecture diagram or trust center
  notes: Rows separate what Tala explicitly markets from the internal platform capabilities only inferable through recruiting pages.
