  evidenceGaps:
  - type: missing-source
    severity: material
    topic: integration-disclosure
    missingEvidence: Named payer, provider, EHR, and referral-network integrations plus a buyer-facing deployment architecture.
    whyItMatters: Integration depth determines whether Tala is a light navigation layer or a deeply embedded operational platform.
    diligencePath: Request architecture diagrams, implementation docs, and at least one live workflow integration walkthrough.
    relatedQuestionRefs:
    - QE012
    - QE023
  - type: private-evidence-only
    severity: material
    topic: clinical-governance
    missingEvidence: Named FDA-tracked tools, validation packets, human-override rules, model cards, and monitoring thresholds for clinical workflows.
    whyItMatters: Without these artifacts it is impossible to judge the safety, regulatory posture, or practical maturity of Tala's clinical-agent claims.
    diligencePath: Request product-specific validation studies, governance committee materials, and post-deployment monitoring dashboards.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Historical uptime, latency SLOs, incident logs, SLA terms, and disaster-recovery test evidence.
    whyItMatters: A 24/7 care promise creates patient-safety and buyer-risk implications that cannot be assessed from hiring language alone.
    diligencePath: Request a 12-month operational review, status exports, customer SLA language, and DR test summaries.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: A dated 2026 roadmap, release notes, and milestone-level product plan beyond launch messaging and hiring.
    whyItMatters: Roadmap specificity is needed to separate a credible build plan from a broad but still pre-product strategic narrative.
    diligencePath: Request the current product roadmap, shipped-vs-planned release history, and engineering milestone owners.
    relatedQuestionRefs:
    - QE016
  - type: missing-source
    severity: material
    topic: data-handling
    missingEvidence: PHI handling model, consent and retention rules, subprocessor list, BAA posture, and the specific de-identification method used for model training.
    whyItMatters: The website privacy page is not enough to evaluate a live virtual-care platform that claims de-identified training data and clinician-facing workflows.
    diligencePath: Request the trust packet, data-flow diagram, privacy architecture review, and legal/compliance memo on training-data governance.
    relatedQuestionRefs:
    - QE010
    - QE021
