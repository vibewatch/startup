- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow gap
  - Tala solution
  - Claimed benefit
  - Limitation
  rows:
  - - Start from symptoms and find the right next step
    - Patients face fragmented navigation and unclear first actions
    - AI-guided intake paired with clinician-backed care orchestration
    - Faster symptom-to-resolution path
    - No public intake questionnaire, routing rubric, or escalation thresholds
  - - Route a patient to the right specialist
    - Referral loops and manual coordination delay care
    - Quasi-clinical coordination plus referral support
    - Right specialist on the first referral
    - No named referral-network, EHR, or payer integrations disclosed
  - - Order, schedule, and review diagnostics
    - Ordering and scheduling often span slow, disconnected systems
    - Workflow claim around MRI ordering, scheduling, and review in days not months
    - Compresses delays around diagnostics
    - No public proof of operational throughput or turnaround times
  - - Renew medications and close follow-up tasks
    - Renewals and follow-up frequently break across providers and admin teams
    - Non-clinical and quasi-clinical agents handle logistics and continuity tasks
    - Reduces drop-off between visits
    - No refill governance, pharmacy integrations, or exception handling published
  - - Monitor chronic conditions before they worsen
    - Signals are often missed until they become emergencies
    - AI-assisted flagging plus clinician review
    - Earlier intervention and lower acuity escalation
    - No public model cards, sensitivity thresholds, or monitored conditions list
  - - Access care outside office hours
    - Traditional access is limited by clinic schedules and handoff friction
    - 24/7 virtual front door with in-person handoff when needed
    - Continuous patient access and smoother transitions
    - No public SLA, staffing model, or state rollout map
  notes: Benefits are public claims from Tala materials, not independently audited outcome measurements.
