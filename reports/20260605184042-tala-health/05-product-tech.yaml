- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Patient access and orchestration layer
    - Captures symptoms, requests, and follow-up needs through a 24/7 digital front door
    - Depends on reliable triage logic and clinician escalation paths
    - Public surface does not show actual channel mix, routing UX, or state gating
  - - Clinical workflow application layer
    - Coordinates non-clinical, quasi-clinical, and clinician-support agents
    - Depends on strong task boundaries and human oversight
    - Overclaim risk if agent roles blur into unlicensed or unsupported care
  - - Model development and evaluation layer
    - Fine-tunes models and measures accuracy, bias, hallucination, and safety
    - Depends on de-identified data, evaluation suites, and clinical feedback loops
    - No public validation packet or threshold policy
  - - ML platform and serving layer
    - Handles CI/CD, feature store, registry, experiment tracking, and model serving
    - Depends on Kubernetes, schedulers, registries, and deployment tooling
    - Tooling breadth is inferred from hiring rather than public docs
  - - Data and analytics layer
    - Builds data pipelines, models, BI apps, and performance analytics
    - Depends on scalable SQL and cross-functional data quality management
    - No public schema, interoperability standard, or governance description
  - - Reliability and security layer
    - Runs observability, SLOs, on-call, DR, secrets, and certificate management
    - Depends on cloud infrastructure, telemetry stacks, and operational playbooks
    - No public uptime, incident history, or certification evidence
  notes: This table models the public operating architecture implied by recruiting pages; it is not a company-published system diagram.
