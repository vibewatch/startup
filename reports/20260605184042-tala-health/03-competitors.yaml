  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform
      - Public price / unit signal
      - Packaging signal
      - Buyer orientation
      - What remains unknown
      - Implication
    rows:
      - - Tala Health
        - No public price or unit rate disclosed
        - AI-plus-clinician virtual-care and coordination layer
        - Payers / insurers; likely employers through plan distribution
        - Contract model, implementation fees, covered lives, and outcomes
        - Buyers can understand the thesis but cannot underwrite ROI from public evidence alone
      - - Transcarent
        - No public enterprise rate card visible
        - One member experience across navigation, guidance, and care delivery
        - Employers and benefits buyers
        - Contract mechanics, minimums, and realized savings terms
        - Very close scope overlap with Tala, but price proof is still private
      - - Included Health
        - No public enterprise rate card visible
        - Single covered benefit and app for medical, financial, and administrative needs
        - Employers and health plans
        - PEPM, implementation economics, and guarantee structure
        - Competes on breadth and trust more than on public price transparency
      - - Amwell
        - No public enterprise rate card visible
        - Single technology platform spanning multiple care programs
        - Payers and health systems
        - Implementation minimums, partner economics, and module pricing
        - More infrastructure-like procurement than navigation-overlay procurement
      - - Quantum Health
        - No public enterprise rate card visible
        - Tiered packages from lower-disruption to full navigation
        - Employers keeping current carriers
        - Savings guarantees and exact commercial terms
        - Easier procurement story may matter more than list price
      - - apree / Castlight
        - No public enterprise rate card visible
        - Navigation plus primary care with performance guarantees and risk share
        - Employers
        - Base fees, performance thresholds, and downside mechanics
        - Shared-risk packaging can appeal when new vendors lack public proof
      - - Spring Health
        - No public employer rate card visible
        - Mental-health benefit with guaranteed ROI and fast access
        - Employers
        - PMPM or case-rate structure and renewal economics
        - Can win budget with outcomes even without whole-stack breadth
      - - Hims & Hers
        - '$39 first month then $149/month membership for weight loss, plus medication pricing as applicable'
        - Consumer subscription with explicit member charges
        - Consumers
        - Employer-channel economics and whether buyers subsidize usage
        - Clearest public price signal in this set, but for a different buyer model
    notes: >-
      Public packaging evidence is much richer than public rate cards. Unknown means the exact economic term was not
      recoverable from retained sources and should be diligence-requested rather than inferred.
