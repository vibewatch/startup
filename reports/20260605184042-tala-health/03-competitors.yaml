  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: Exact Tala and peer contract economics by pricing unit, implementation fee, guarantee structure, and renewal uplift.
      whyItMatters: Public packaging is visible, but actual procurement comparison and margin-quality judgment still depend on the missing economic terms.
      diligencePath: Request Tala's current payer or employer contracts, pricing sheets, and any competitor rate-card benchmarks from benefits consultants.
      relatedQuestionRefs:
        - QP021
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: tala-scale
      missingEvidence: Named Tala customers, covered lives, channel mix, retention, win rates, and implementation timelines versus direct peers.
      whyItMatters: Without disclosed traction, it is hard to compare Tala's distribution readiness or switching leverage against scaled incumbents.
      diligencePath: Request a customer list, covered-lives count, channel pipeline, win-loss log, and cohort-level renewal data from Tala management.
      relatedQuestionRefs:
        - QP022
      relatedTableRefs:
        - TP001
        - TP004
    - type: missing-source
      severity: material
      topic: moat-durability
      missingEvidence: Published Tala outcome proof on referral completion, member engagement, cost reduction, and clinician-efficiency gains relative to direct peers.
      whyItMatters: Tala's public moat still rests more on positioning than on external proof, so underwriting durability from public evidence alone remains incomplete.
      diligencePath: Ask for outcome studies, payer case studies, consultant references, and any risk-share or guarantee language tied to live deployments.
      relatedQuestionRefs:
        - QP026
      relatedTableRefs:
        - TP004
