  title: Market Analysis
  summary: 'Tala Health''s public positioning fits a narrower but commercially interesting slice of virtual care: an always-on care-navigation and virtual-care layer sold through insurers and employers, not commodity video visits alone. Market signals are favorable—telehealth coverage is widespread, buyers are still investing, and adjacent vendors prove demand for integrated navigation plus care—but public market-size estimates vary wildly and Tala has not disclosed pricing, covered lives, or named customers, so a precise SAM/SOM cannot be supported from public evidence alone.'
