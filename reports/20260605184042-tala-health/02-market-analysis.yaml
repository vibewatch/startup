- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Four nested layers show why Tala's opportunity is narrower than generic telehealth but still anchored to a large payer and employer problem pool.
  data:
    items:
    - label: Macro healthcare context
      value: $4.9T U.S. healthcare economy
    - label: Broad U.S. virtual-care revenue lens
      value: $38.6B-$42.54B current U.S. market estimates
    - label: Employer-sponsored covered-life pool
      value: 154M-165.6M covered lives
    - label: Tala-described wedge
      value: Payer/employer navigation + virtual-care layer (no public SAM disclosed)
  approximationNotes: This pyramid is a constrained framing tool, not a clean TAM/SAM/SOM cascade. It intentionally mixes dollar and covered-life proxies because public evidence is sufficient to bracket the category but not to compute Tala's actual revenue opportunity.
