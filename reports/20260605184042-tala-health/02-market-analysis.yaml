- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - National commercial insurer
    - Medical-cost / care-management leader
    - Member plus internal care teams
    - Health plan
    - Navigation, triage, referral, follow-up
    - Medical management or digital strategy
    - Reduce waste, improve member experience, defend retention
  - - Regional plan or Medicare-focused payer
    - Population-health or network leader
    - Member plus partner clinicians
    - Health plan
    - Steer to covered sites of care and close gaps
    - Care management or quality budget
    - Access gaps, network adequacy, and service continuity
  - - Large self-insured employer
    - Benefits leader
    - Employee and dependents
    - Employer
    - Benefit navigation, claims help, virtual care access
    - Benefits or total rewards
    - Premium pressure, absenteeism, and employee frustration
  - - Employer channelled through a health-plan ecosystem
    - Employer with payer-selected vendor set
    - Employee / member
    - Employer and plan jointly
    - Member support layered on plan benefits and provider network
    - Benefits plus plan account team
    - Need for a simpler front door without building internally
  - - Clinician / provider partner in sponsored model
    - Not the economic buyer but an operational gatekeeper
    - Clinician and patient
    - Plan or employer sponsor
    - Escalation, diagnosis support, and in-person handoff
    - Sponsored program operations
    - Need to carry context from digital intake into real care delivery
  notes: Rows show who controls budget versus who touches the workflow. In this category the daily user is often the member, but buying authority usually sits with plan or employer leaders rather than the clinician alone.
