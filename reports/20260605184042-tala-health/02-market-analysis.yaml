tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend / work
  - Excluded spend / work
  - Buyer / payer
  - Relevance to Tala
  rows:
  - - AI-enabled care navigation layer
    - Benefit guidance, symptom intake, referral routing, scheduling, follow-up, claims and admin resolution
    - Pure claims-core systems or BPO-only admin without member-facing orchestration
    - Insurer or employer sponsors; member uses it
    - Core fit with Tala's public messaging
  - - Virtual clinical touchpoints
    - 24/7 virtual consults, clinician escalation, medication renewals, first referral routing
    - One-off video visits without continuity or workflow carryover
    - Insurer, employer, or provider-sponsored benefit
    - Included when part of the end-to-end journey
  - - Remote monitoring and disease programs
    - Condition-specific monitoring or coaching that plugs into triage and care pathways
    - Standalone device sales or single-condition tools with no navigation layer
    - Plan, employer, or provider program budgets
    - Adjacent but not obviously Tala's core wedge
  - - Integrated navigation competitors
    - Benefits navigation plus claims support plus care coordination and clinical access
    - Direct-to-consumer wellness apps with no payer or employer channel
    - Benefits, medical-cost, or population-health owners
    - Best public analogue for Tala's likely category
  - - Status-quo substitutes
    - Call centers, nurse lines, portal messaging, care managers, utilization management teams, local provider referrals
    - None; these are the incumbent alternative
    - Already funded inside plans and employers
    - Main substitute set Tala must displace or orchestrate
  notes: 'Boundary is functional, not taxonomic: the chapter includes workflow and service layers that move a member from question or symptom to resolution, and excludes most point solutions that do not carry context across the journey.'
  claimRefs:
  - CM003
  - CM004
  - CM037
  - CM038
  - CM043
  - CM047
