companyProfile:
  summary: >-
    OpenEvidence is a private medical AI company founded in 2022 that sells a clinician-focused evidence search product
    and is based in Miami. The platform is free to verified physicians and is monetized primarily through pharmaceutical
    and medical device advertising, with emerging enterprise workflow integrations and specialty content partnerships
    expanding the product footprint.
