  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的核心投资逻辑在于临床医生快速采用和自有工作流集成：超过 40% 的已授权美国医生在 10,000 家医院和临床中心使用该平台。2026 年 3 月 10 日，公司在单个 24
              小时内记录了 1 million 次临床咨询，证明医疗 AI 已实现规模化临床采用。更关键的是，OpenEvidence 通过与 New England Journal of Medicine、JAMA 和
              NCCN 临床指南等顶级医学期刊建立正式合作，实现知识检索差异化。反向逻辑则强调 OpenEvidence 商业模式和竞争防御力的结构性脆弱。用户免费使用，公司的变现依靠 $70 至 $150 CPM
              的药品广告，而不是企业软件席位授权，因此收入可预测性容易受广告预算周期和诊疗现场工具商业偏见监管审查影响。此外，发表于 PubMed Central 的同行评审临床评估显示，OpenEvidence
              的清晰度（3.55/4）和相关性（3.75/4）得分虽高，但对改变临床决策的实测影响有限（1.95/4），说明临床医生主要把它当作参考确认引擎，而非不可或缺的诊断系统。随着 OpenAI Health 和
              Claude Healthcare 等前沿实验室竞争者直接推进医疗工作流，未签约医生的切换成本仍然微乎其微。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
