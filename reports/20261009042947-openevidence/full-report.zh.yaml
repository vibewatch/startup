      - number: '8.4'
        title: 退出路径与尽调否决标准
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的退出准备面临明确的时点与估值障碍。CEO Daniel Nadler 此前曾推动 Kensho Technologies 成功战略退出（S&P Global 于 2018 年以
              $700 million 收购），OpenEvidence 也在 2026
              年初与一家大型科技集团初步讨论过收购，但公司能否独立登陆公开市场，仍取决于市场是否成熟。管理层指出，前沿基础模型开发商必须先接受公开市场检验，应用层 AI 服务商才可能进行首次公开募股。若要支撑 $12
              billion 及以上的 IPO 估值，机构公募股权投资者会要求经审计的 GAAP 账目、赞助内容与医疗指导之间的清晰隔离，以及稳健的企业治理。OpenEvidence 已通过 SOC 2 Type II
              认证并与 HIPAA 对齐，建立了基础合规能力。但在投入成长资本前，投资者必须执行聚焦式尽调否决标准：核实 FY2025
              经审计收入及各变现渠道的毛利率，确认前五大制药广告主的集中度与续约率，评估已签企业协议带来的非广告健康系统 ARR，并审查高级别清算优先权，确保收购结果不会严重侵蚀次级普通股权益。
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: 证据展品
        blocks:
          - type: callout
            title: 尽调结论：维持当前市场标示估值下的观望立场
            body: >-
              OpenEvidence 在临床医生中渗透率超过 40%，并将收入运行率从 $100M 快速推高至约 $300M，展现出异常强的医生端牵引力。但在 $12B 估值、且据报道考虑进行 $20B
              融资的情况下，公司仍高度依赖制药广告，而非签约企业 SaaS，交易倍数约为收入的 40x 至 120x。投资者应继续保持“继续研究”的立场；在考虑参与成长股权投资前，必须取得经审计的 FY2025
              财务数据、广告主集中度披露，以及经过核实的非广告 ARR。
            calloutType: recommendation
            claimRefs:
              - CV001
