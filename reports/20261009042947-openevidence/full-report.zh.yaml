        - 在正式提交投资委员会批准前，要求直接访问数据室
      - - 风险评级
        - high
        - 依赖制药赞助、大科技竞争和稀释压力
        - 建模 Series A 至 D 的下行情景清算优先权和资本表优先级
      - - 估值立场
        - expensive
        - 2026 年 1 月估值为 $12B（约为收入的 40x-120x）；因稀释问题暂停 $20B 融资谈判
        - 不要以二级市场溢价（UpMarket 的 $14B 标记）或拟议的 $20B 估值参与
    notes: 基于 Series D 融资标记、报道的收入运行率及截至 2026-10-09 的市场风险评估投资立场。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 论点
      - 反论点
      - 改变判断的条件
    rows:
      - - 临床规模与网络壁垒
        - 超过 40% 的美国医生在使用，每日 100 万次咨询，由此形成难以攻破的真实世界临床查询反馈闭环
        - 临床医生免费使用且由广告驱动；若 ChatGPT Health 或 Claude Healthcare 获得企业 EHR 集成，转换成本仍接近于零
        - 证明已签约的留存队列，以及超越公开医学文献合作的可守护专有 IP
      - - 收入与单位经济模型
        - 2025 年末实现 $100M 年化收入，2026 年中报道运行率为 $300M，并实现现金流盈亏平衡
        - 变现依赖 $70-$150 CPM 的制药广告，而非经常性企业 SaaS；广告支出可能周期性波动或面临监管审查
        - 经审计的 GAAP FY2025 财务报表，证明毛利率高且制药广告合同已实现多年期、多元化
      - - 企业工作流集成
        - Mount Sinai、Cedars-Sinai 和 Sutter Health 的合作将 OpenEvidence 直接嵌入医疗系统临床工作流
        - 医疗系统企业试点经常无法转化为全企业范围的付费经常性软件许可
        - 主要医疗系统签署长期付费企业订阅，ARR 超过 $50M
      - - 退出与估值纪律
        - 创始人此前退出（Kensho 以 $700M 出售）以及大科技公司的收购兴趣提供了有形底部
        - $12B-$20B 的私募估值要求可比上市公司按收入 10x-15x 交易，从而造成 IPO 后倍数严重压缩
        - 二级市场以现实倍数完成交易，或达成明确的科技集团收购协议
    notes: 平衡核心投资论点支柱、下行反论点和明确的尽调决策断点。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 收入与增长假设
      - 倍数与估值逻辑
      - 主要下行触发因素与风险
      - 概率信号
    rows:
      - - 乐观情景
        - 借助高 CPM 制药广告，并在 10,000+ 个医疗中心实现 30%+ 的企业 SaaS 转化，收入快速扩大至 $500M+
        - 凭借主导市场地位和 IPO 准备度，按 ARR / 收入 40x-50x 给予 $20B-$25B 估值
        - 大科技平台封锁，监管严查医疗 AI 工具中的制药广告
        - 20% 概率：需要企业 SaaS 变现顺畅，并且临床医生自然增长持续
      - - 基准情景
        - 收入维持在 $250M-$350M 年化运行率，主要来自制药广告；企业软件转化缓慢
        - $8B-$12B 估值（25x-35x 倍数），反映高增长被广告收入周期性和软件缺乏锁定效应所抵消
        - 制药广告预算收缩、GPU 推理成本侵蚀利润率、企业合同无法规模化
        - 55% 概率：与当前已验证的 $12B Series D 标记及不愿以 $20B 融资一致
      - - 悲观情景
        - 制药广告支出触顶；医疗系统拒绝广告资助的临床工具；OpenAI Health 和 Claude 抢走市场份额
        - $3B-$5B 估值（收入倍数压缩至 10x-15x，或被困境收购）
        - 临床错误争议、监管调查临床建议中的商业偏见、下轮融资造成严重稀释
        - 25% 概率：依赖免费采用且 标题级进入估值极高，因此脆弱性高
    notes: 在不同商业变现和倍数压缩假设下，建模 3 年估值轨迹。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV013
      - CV014
