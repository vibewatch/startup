      - number: '7.2'
        title: 运营可靠性、临床准确性与技术治理
        blocks:
          - type: paragraph
            body: >-
              尽管 OpenEvidence 报告在 MedQA USMLE 等标准化选择题考试中取得完美的 100% 分数，独立学术和临床评估显示，当其遇到非线性的亚专科病例时，性能会明显下降。在 2025 年 12 月针对
              MedXpertQA 亚专科数据集的试点研究中，标准平台在 Quick Consult 上的准确率仅为 34%，在 Deep Consult 上为 41%；对于相同临床提示词，评估者层面的可重复性方差分别达到
              77% 和 72%。急诊医学论坛中的临床医生记录了基础诊断错误，例如错误地称标准胸部 X 光可以排除或确认肺栓塞。此外，在前瞻性初级保健评估中，OpenEvidence
              的清晰度（3.55/4.0）和引文相关性（3.75/4.0）得分很高，但其对改变临床决策的可测影响仅为
              1.95/4.0，主要是证据确认工具，而非主动诊断驱动器。对于免费用户层，平台不提供合同服务等级协议（SLA），也不保证正常运行时间；活跃门诊时段曾出现有记录的服务中断，扰乱医生工作流。平台在 Google
              Cloud Platform 和 Vercel 基础设施上保持 SOC 2 Type II 认证和 HIPAA 合规，并采用 AES-256 数据库加密，但缺乏公开披露的机构
              SLA，使临床机构在宕机期间缺乏救济渠道。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
