        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              两位公开确认的创始人分别带来互补的公司建设和机器学习背景。Nadler 此前创办 Kensho，S&P Global 于 2018 年以约 $700 million 收购该公司；Ziegler 则被描述为
              Harvard AI 研究员或博士生。官方团队页面显示技术和临床人才储备深厚，但现有证据没有提供完整高管名单、董事会构成、投票安排或继任计划。投资者评论异常偏向创始人，GV 一名代表称其在 GV 领投
              Series B 后加入董事会。因此，创始人与市场的匹配度似乎很强，但决策是否过度集中于 Nadler，仍是待尽调问题，而非已有量化结论。
