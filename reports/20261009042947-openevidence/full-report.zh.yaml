  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条连续分析链依次评估临床采用、变现机制、估值压力、下行风险，最终得出尽调结论。
    data:
      nodes:
        - id: adoption
          label: 医生规模与参与度
          detail: 美国医生中有超过 40% 在使用，每日临床咨询量达 1M，并与顶级期刊合作。
          tone: positive
        - id: monetization
          label: 广告驱动的收入扩张
          detail: 依靠 $70-$150 CPM 的制药赞助，收入运行率从 2025 年末的 $100M 增长到 2026 年中约 $300M。
          tone: positive
        - id: valuation-multiple
          label: 极高的名义估值
          detail: $12B 的 D 轮估值对应 40x-120x 收入倍数；因稀释担忧，$20B 估值的谈判已暂停。
          tone: risk
        - id: model-fragility
          label: 企业模式与广告模式的摩擦
          detail: 缺少签约企业软件 SaaS ARR，使业务容易受到广告预算周期性波动的影响。
          tone: risk
        - id: competitive-pressure
          label: 生态与治理威胁
          detail: OpenAI 和 Anthropic 进入医疗领域，同时监管机构也在审查赞助型临床参考工具。
          tone: risk
        - id: verdict
          label: 尽调结论：继续研究
          detail: 估值立场偏贵；风险评级为高；入场前需要经审计的财务报表和非广告 ARR。
          tone: neutral
      edges:
        - from: adoption
          to: monetization
          label: 推动
        - from: monetization
          to: valuation-multiple
          label: 支撑
        - from: valuation-multiple
          to: model-fragility
          label: 承受……压力
        - from: model-fragility
          to: competitive-pressure
          label: 因……加剧
        - from: competitive-pressure
          to: verdict
          label: 决定
    approximationNotes: 将运营规模、变现机制和估值风险综合为投资立场的逻辑推演。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
