  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险格局
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 面临的首要结构性脆弱点，是其两分的监管定位。在美国，OpenEvidence 严格依靠《食品、药品和化妆品法》第 520(o)(1)(E) 节确立的非器械豁免；该条款由《21
              世纪治愈法案》制定，并经 FDA 于 2026 年 1
              月更新的临床决策支持指南细化。在这一法定安全港下，平台确保建议具有上下文、透明，并附有可核验的同行评审引文，保留临床医生作为最终决策者，由此避免被归类为医疗器械软件（SaMD）。然而，这一监管姿态在国际市场失效。2026
              年 4 月 27–28 日，OpenEvidence 突然暂停平台可用性，并终止欧盟和英国所有临床医生的访问，理由是欧盟《人工智能法案》及 EMA 和 MHRA 执行的医疗器械分类带来的监管不确定性加剧。欧盟
              AI 法案把临床诊断和分诊 AI 系统列为高风险技术，要求严格的合规评估、算法审计轨迹和正式法律责任分配。OpenEvidence
              没有重构模型，也没有让资产负债表暴露于欧洲合规执法，而是选择全面退出相关地区。与此同时，OpenEvidence 正卷入美国联邦法院的高风险知识产权诉讼，已依据《捍卫商业秘密法》《计算机欺诈和滥用法》及 DMCA
              起诉 Doximity，指称对方组织提示注入攻击并部署冒充医生的人员，以提取专有模型提示词。
            claimRefs:
              - CR001
