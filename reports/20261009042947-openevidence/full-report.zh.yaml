            body: >-
              OpenEvidence 于 2026 年 4 月 27 日突然退出英国和欧盟，凸显美国与欧洲医疗 AI 治理之间的分歧。美国临床医生已大规模采用 OpenEvidence，无需软件即医疗器械上市前认证；而欧盟
              AI 法案和英国 MHRA 框架对诊疗现场决策支持实施严格监管审查，使欧洲临床需求转向 iatroX 和 BMJ Best Practice 等本地竞争者。
