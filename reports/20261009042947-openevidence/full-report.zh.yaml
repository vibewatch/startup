            body: >-
              OpenEvidence 在美国医生中的快速采用依赖独立的移动端和网页使用，但长期企业变现取决于与 Epic 等电子健康记录的深度集成。Epic 覆盖超过 40% 的美国医院床位，其专有的 Art for
              Clinicians 计划带来结构性平台风险：Epic 可以把原生 AI 直接嵌入制图和医嘱工作流，可能限制第三方 FHIR 连接器，或把 OpenEvidence 降格为未集成的外部标签页。
