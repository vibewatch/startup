      - number: '8.2'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              我们给予 OpenEvidence 的建议为 research-more，同时评定高风险、中等信心和昂贵估值立场。2026 年 1 月，OpenEvidence 完成由 Thrive Capital 和 DST
              Global 共同领投的 $250 million Series D 融资，投后估值为 $12 billion，累计融资约 $700 million。公司称，收入从 2025 年底的 $100 million
              年化收入增长到 2026 年年中的约 $300 million（每月 $25 million），现金流口径接近盈亏平衡；但 $12 billion 估值对应收入的 40x 至
              120x，倍数要求很高。该倍数显著高于典型高增长软件和数字医疗可比公司，后者远期收入倍数在 10x 至 18x 之间。此外，2026 年 7 月的报道称，OpenEvidence 曾评估以 $20 billion
              估值追加融资 $200 million，但因担心创始人和现有股东权益被稀释而决定不推进。在二级市场，UpMarket 的估值模型估算 IPO 前股权价值为 $14 billion，较 Series D
              条款有溢价。按当前公开报价，成长型投资者承担极高的估值下行风险，却没有长期签约经常性 SaaS 软件收入带来的下行保护。
            claimRefs:
