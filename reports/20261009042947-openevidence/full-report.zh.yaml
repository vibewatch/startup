      - number: '7.3'
        title: 商业模式冲突、依赖与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的商业模式仍高度集中于药品和医疗器械数字广告，在为 NPI 验证医生检索临床证据时，把等待的几秒钟变现。Direct-to-Clinician 模式虽推动平台迅速扩展到 1
              million 次日临床咨询、覆盖超过 10,000 家医疗设施，却带来尖锐的机构摩擦。学术医疗中心和医疗系统采购部门对在治疗建议旁展示药品广告表达了深刻的伦理和临床治理担忧，在 FTC 和 FDA
              的推广边界下持续受到审查。此外，OpenEvidence 依赖与顶级出版商直接签订的内容授权合作，包括 New England Journal of Medicine、JAMA、NCCN 和 Cochrane
              Library。如果出版商合作伙伴提高授权费，或向基础 LLM 开发者授予非独家访问权，OpenEvidence 的证据数据护城河可能被削弱。企业 EHR 集成是另一项架构脆弱点：平台虽已在 Mount
              Sinai、Sutter Health 和 Cedars-Sinai 部署 Epic，但 Epic 与 Microsoft 和 OpenAI 开展的原生 AI
              计划构成明显的去中介化威胁。对投资者而言，关键投资逻辑破坏触发器包括 FDA 执法行动将多智能体临床推理归类为 SaMD、企业医院网络普遍拦截广告，或核心期刊授权协议流失。
            claimRefs:
              - CR012
              - CR014
              - CR015
              - CR016
