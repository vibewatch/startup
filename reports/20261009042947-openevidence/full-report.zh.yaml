      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 欧洲 AI 法案先例与 SaMD 蠕变
            body: >-
              OpenEvidence 于 2026 年 4 月全面退出欧盟和英国，说明支撑诊疗现场医疗 AI 的监管基础十分脆弱。美国 FD&C 法案第 520(o)(1)(E)
              节为仅呈现参考引文的临床决策支持提供安全港，但会交叉审视治疗选项的先进多智能体架构，已经危险地接近诊断自动化。如果美国监管机构与欧洲的风险型监管接轨，OpenEvidence
              可能面临突然的运营停摆或巨额合规负担。
            calloutType: risk
            claimRefs:
              - CR001
