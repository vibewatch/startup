chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 由 Daniel Nadler 和 Zachary Ziegler 于 2022 年创立，将产品描述为帮助医生在诊疗现场做出临床决策的 AI 副驾驶。CNBC 和当前 Wikipedia
              记录均将公司所在地列为 Miami，但一份 2026 年综述摘要把 OpenEvidence Inc. 标为 Cambridge,
              Massachusetts；留存证据无法确定这代表旧办公室、法律注册地还是过时描述。产品向符合条件的医疗专业人士免费开放，CNBC
              报道称广告（包括应用内视频推广）是已披露的主要变现引擎。这种分发模式降低了采用门槛，却也意味着据报道的临床医生覆盖人数不同于签约企业客户数。
            claimRefs:
