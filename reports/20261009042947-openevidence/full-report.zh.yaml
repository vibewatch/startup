      - number: '3.3'
        title: 护城河持久性、平台替代与传统厂商回应
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 竞争优势的持久性，取决于独家期刊内容授权、临床医生工作流习惯、电子健康记录集成和国际监管合规之间的协同。OpenEvidence 的防御性护城河由与顶级出版商签订的正式授权协议支撑，包括
              New England Journal of Medicine、JAMA Network、Nature Portfolio、Cochrane Systematic Reviews 和 National
              Comprehensive Cancer Network。这些合作阻止通用前沿大语言模型合法复制受版权保护医学文献的全文临床综合。此外，医生习惯已经很强：超过 650,000 名经过验证的美国医生使用该平台，在
              10,000 家医疗中心产生每月超过 20 million 次咨询。不过，个体临床医生的切换成本仍低，因为核心网页和移动工具无需付费，医生可以同时使用 OpenEvidence、Doximity Ask 和
              UpToDate。最严重的平台威胁来自电子健康记录厂商，尤其是 Epic Systems；它控制超过 40% 的美国医院 EHR 市场，并通过 Cosmos 持有覆盖 300 million
              名患者的纵向临床数据。如果 Epic 限制第三方 FHIR 接口，或把原生 AI 决策支持直接捆入制图工作流，OpenEvidence
              的诊疗现场分发可能遭遇严重去中介化。此外，国际扩张也受到严重限制：OpenEvidence 于 2026 年 4 月 27 日突然退出欧盟和英国，称原因是欧盟 AI 法案和 MHRA 器械法规存在监管不确定性，使
              iatroX、BMJ Best Practice 和 Vera Health 等区域替代品能够承接海外临床需求。
            claimRefs:
              - CP003
              - CP004
              - CP006
