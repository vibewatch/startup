  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界范围与现状替代品
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence
              所处的商业和临床领域横跨三个交叉的软件与媒体类别：临床决策支持（CDS）平台、诊疗现场医学文献搜索，以及数字药品营销。过去，医院医疗系统和医疗集团诊所通过企业出版商的自上而下机构授权采购临床参考数据库，例如
              Wolters Kluwer（UpToDate）、Elsevier（ClinicalKey）和
              EBSCO（DynaMed）。这些传统平台直接销售给医院首席医疗信息官（CMIO）和医疗系统首席信息官（CIO），把机构指南和药品数据库嵌入企业电子健康记录（EHR）系统。相比之下，OpenEvidence
              通过提供面向临床医生、免费且有证据支撑的 AI
              搜索工具，重新划定可服务边界；该工具服务于移动端和网页工作流，而非企业计费部门。这种消费式分发绕开传统机构采购周期，让医生能在诊疗期间及两次诊疗之间查询医学文献。不过，这一独立产品范围有意排除交易型 EHR
              计费工作流、专用药物剂量计算器和自动鉴别诊断生成器，从而与全套企业临床软件划清产品和市场边界。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
      - number: '2.2'
        title: 市场规模视角：数字药品广告与企业 CDS 支出
        blocks:
          - type: paragraph
            body: >-
              评估 OpenEvidence 的市场规模，必须把临床决策支持软件预算与数字药品广告支出分开。医疗软件领域的风险投资人往往把医疗 AI 理解为数十亿美元级的全球临床生产力市场，但 OpenEvidence
              近期的商业模式主要由查询生成等待期间展示的药品品牌广告驱动。据 Series D 领投投资者披露，美国数字药品广告的总可用市场（TAM）估计每年为 $20 billion 至 $25
              billion，不包括国际市场。在这一广告 TAM 中，可服务市场（SAM）受高意向 HCP（医疗专业人士）数字广告渠道界定，药品营销人员按专科和临床查询意图触达经过验证的处方医生。OpenEvidence
              的可获取市场（SOM）锚定于其据报道在 2026 年 1 月实现的 $100 million 年化收入，当时覆盖 757,000 名注册美国医生。换一个软件采购视角，医疗系统企业订阅构成相邻但商业上不同的
              TAM，医疗系统预算负责人会评估年度席位授权或全机构站点协议；这条收入流对 OpenEvidence 仍处于早期阶段。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
      - number: '2.3'
        title: 临床工作流中的买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence
              市场定位的核心结构，是有意把终端用户与经济付费方拆开。终端用户是经过验证的个体临床医生，包括初级保健医生、亚专科医生、住院医生和急诊医生；他们无需付费即可采用平台，查询同行评审证据和临床指南。相反，商业付费方是药品营销团队和品牌经理，他们购买定向数字广告库存，广告显示在提交查询与生成答案之间的检索等待期。医疗系统
              IT 采购是正在出现的第二买方群体，医院会授权集成式 EHR 副驾驶，例如 OpenEvidence 与 Sutter Health 和 Epic
              系统的试点集成。这种三方分层带来不同的采用速度：个体临床医生通过移动端和网页应用商店即时采用，而企业医疗系统买方在批准机构部署前，需要经过严格的 SOC 2 Type II 合规审查、HIPAA
              业务伙伴协议和正式临床安全评估。
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
