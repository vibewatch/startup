      - number: '8.3'
        title: 乐观、基准与悲观情景建模
        blocks:
          - type: paragraph
            body: >-
              我们的估值情景在不同假设下评估潜在投资回报轨迹，包括药品广告持久性、企业医院软件转化，以及流动性实现时的倍数压缩。在乐观情景（20% 概率）下，OpenEvidence 成功抵御前沿 AI
              实验室争夺临床心智，令药品广告年收入扩大到 $500 million，并把企业医疗系统转化为高毛利经常性软件订阅客户。这支持公司在公开市场首次亮相时以 40x 至 50x 倍数取得 $20 billion 至
              $25 billion 估值。在基准情景（55% 概率）下，OpenEvidence 在 $250 million 至 $350 million
              收入运行率区间内保持收入扩张，同时仍主要是广告支持的参考工具。实现流动性后，公开市场可比公司把该业务重新定价为 25x 至 35x 收入倍数，带来 $8 billion 至 $12 billion
              的企业估值，晚期 Series D 投资者回报持平或小幅为正。在悲观情景（25% 概率）下，药品营销预算受到宏观经济或监管收缩，医院医疗系统因临床诚信担忧限制广告支持的 AI 工具，或者 OpenAI
              Health 和 Claude Healthcare 快速实现功能对等，导致临床医生参与度下降。在这一情景下，收入收缩或停滞于 $200 million 以下，倍数压缩至 10x 至 15x，对应 $3
              billion 至 $5 billion 的股权估值，并触发 Series D 优先股分层的严重稀释和下行损失。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
