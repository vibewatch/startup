      - number: '2.4'
        title: 采用驱动因素与监管瓶颈
        blocks:
          - type: paragraph
            body: >-
              临床 AI 搜索的长期扩张，受医学文献呈指数级翻倍推动；即使采用保守的影响因子期刊门槛，文献量估计也每五年翻一倍，导致执业医生仅靠传统的研究生阶段阅读无法吸收新的临床试验发现。             
              OpenEvidence 靠整合与优质出版商签订的权威全文文献协议，加快临床信任建立，其中包括 New England Journal of Medicine、JAMA Network、National
              Comprehensive Cancer Network（NCCN）和 Cochrane Systematic Reviews；其 EvidenceGrade 方法还把 GRADE
              确定性框架落到诊疗现场。尽管增长催化剂明确，市场扩张仍面临严重约束。2026 年 4 月，OpenEvidence 因围绕欧盟《人工智能法案》和不断变化的英国 MHRA 临床 AI
              工具合规标准的不确定性，退出英国和欧盟市场。此外，初级保健临床试验表明，AI 建议在管理常见慢性病时清晰度和相关性较高，但对改变既有医生临床方案的现实影响仍有限，主要作用是强化而非改写医生判断。
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多方变现转移了经济负担
            body: >-
              OpenEvidence 用零成本、消费级搜索工具吸引临床医生参与，绕开医院 IT
              采购延迟，再通过高毛利药品广告变现处方医生注意力。这种脱钩结构把采用速度与医疗系统采购预算分开，但也让长期企业估值暴露于广告主续约队列和医生对赞助信息的容忍度。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与战略替代方案
        blocks:
          - type: paragraph
            body: >-
              临床人工智能的竞争场覆盖传统专家策划的参考数据库、专门的医学推理引擎、临床医生工作流网络、环境式文档录入助手和平台型传统厂商。OpenEvidence
              主要是一个以文献为基础的临床问答工具，直接为经过验证的执业者综合同行评审医学引文。在传统参考资料类别中，Wolters Kluwer 的 UpToDate 和 Elsevier 的 ClinicalKey AI
              与医院采购部门及学术医疗中心保持了数十年的企业关系。UpToDate 拥有超过 12,000 个临床主题，由超过 7,400 名医生作者策划；个人临床医生每年付费 $579 至
              $699，机构则可在电子健康记录系统中购买全机构授权。然而，传统出版商在生成式对话能力上推进缓慢，往往把高级 AI 功能置于高价层级之后。相反，EvidenceMD、Vera Health 和 Glass
              Health 等专门 AI 挑战者瞄准第一代临床搜索的架构局限。EvidenceMD 以透明的思维链推理形成差异化，公开最多 64,000 个思考 tokens，并提供兼容 OpenAI 的开发者 API，与
              OpenEvidence 的黑箱式综合形成鲜明对比。同时，Abridge 和 Ambience Healthcare 等环境式记录助手在患者诊疗期间争夺临床医生注意力，促使 OpenEvidence 推出
              Visits 和 Voice Mode，拓展纯证据查询之外的场景。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 竞争对手画像、定价模式与平台能力
        blocks:
          - type: paragraph
            body: >-
              对临床智能领域的评估显示，变现模式、目标用户群和经验证的临床效用存在明显分化。OpenEvidence 向持有 National Provider Identifier
              资质的美国医疗专业人士免费开放，通过答案生成等待期内的药品数字展示广告资助核心运营，同时在 Cedars-Sinai、Mount Sinai 和 Sutter Health
              等机构试点无广告企业模式。相比之下，UpToDate 通过医院系统站点授权和个人临床医生订阅产生经常性订阅收入，价格从实习生的 $219 到含 Expert AI 的 Pro Plus $699 不等。EBSCO
              的 DynaMedex 把临床综合与 Micromedex 药理及药物相互作用数据库捆绑销售，依托机构图书馆授权，而非公开个人定价。Doximity 拥有超过 3 million 名注册美国医疗会员，并在
              Scribe 和 Dialer 工具之外部署 Doximity Ask，把专业通信网络转化为诊疗现场助手。EvidenceMD 等专门临床 AI 平台在 30 种语言上运营全球免费增值模式，不要求美国 NPI
              门槛，并公布包括 HealthBench Hard 54.6% 在内的实证准确率基准。由此形成的市场格局，是高摩擦、企业付费数据库与无摩擦、广告资助工具及新兴可审计推理平台之间的对比。
