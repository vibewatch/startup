      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Clinical Scale & Network Moat
        - >-
          Used by >40% of US physicians with 1M daily consultations, creating an insurmountable feedback loop of
          real-world clinical queries
        - >-
          Clinician engagement is free and ad-driven; switching costs remain near zero if ChatGPT Health or Claude
          Healthcare gain enterprise EHR integration
        - >-
          Demonstrated contracted retention cohorts and defensible proprietary IP beyond public medical literature
          partnerships
      - - Revenue & Unit Economics
        - >-
          Achieved $100M annualized revenue in late 2025 and reported $300M run-rate in mid-2026 with cash-flow
          breakeven
        - >-
          Monetization relies on pharma ads at $70-$150 CPM rather than recurring enterprise SaaS; ad spend can
          cyclicalize or face regulatory scrutiny
        - >-
          Audited GAAP FY2025 financials proving high gross margin and diversified multi-year pharmaceutical ad
          contracts
      - - Enterprise Workflow Integration
        - >-
          Partnerships with Mount Sinai, Cedars-Sinai, and Sutter Health embed OpenEvidence directly into health system
          clinical workflows
        - >-
          Health system enterprise pilots frequently fail to convert into enterprise-wide paid recurring software
          licenses
        - Signed long-term paid enterprise subscription ARR exceeding $50M from major health systems
      - - Exit & Valuation Discipline
        - Prior founder exit (Kensho for $700M) and acquisition interest from major tech firms provide tangible floor
        - >-
          Private valuation of $12B-$20B demands public market comps that trade at 10x-15x revenue, creating severe
          post-IPO multiple compression
        - Secondary market trade clearing at realistic multiples or an explicit tech conglomerate acquisition agreement
    notes: Balances core investment thesis pillars against downside counterarguments and explicit diligence break points.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & Growth Assumptions
      - Multiple & Valuation Logic
      - Key Downside Triggers & Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Rapid scaling to $500M+ revenue via high-CPM pharma ads plus 30%+ enterprise SaaS conversion across 10,000+
          medical centers
        - $20B-$25B valuation at 40x-50x ARR / revenue on dominant market position and IPO readiness
        - Big-tech platform lockout, regulatory crackdowns on pharmaceutical advertising in medical AI tools
        - '20% probability: Requires seamless enterprise SaaS monetization and continued organic clinician expansion'
      - - Base Case
        - >-
          Revenue sustains at $250M-$350M annualized run-rate primarily from pharma ads; slow enterprise software
          conversion
        - >-
          $8B-$12B valuation (25x-35x multiple), reflecting high growth offset by ad-revenue cyclicality and lack of
          software lock-in
        - >-
          Pharmaceutical ad budget compression, margin erosion from GPU inference costs, failure to scale enterprise
          contracts
        - '55% probability: Consistent with current verified $12B Series D mark and reluctance to raise at $20B'
      - - Bear Case
        - >-
          Pharma ad spending plateaus; hospital systems reject ad-funded clinical tools; OpenAI Health and Claude take
          market share
        - $3B-$5B valuation (10x-15x revenue multiple compression or distressed acquisition)
        - >-
          Clinical error controversy, regulatory inquiry into commercial bias in clinical recommendations, heavy
          dilution from down-round
        - '25% probability: High vulnerability given reliance on free adoption and extreme headline entry valuation'
    notes: Models 3-year valuation trajectories under varying commercial monetization and multiple compression assumptions.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV013
      - CV014
