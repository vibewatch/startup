              - CI014
      - number: '4.3'
        title: Capital Adequacy, Cash Runway, and Underwriting Dilemmas
        blocks:
          - type: paragraph
            body: >-
              With approximately $700 million in aggregate institutional venture capital raised across four rounds
              between February 2025 and January 2026—culminating in a $250 million Series D at a $12 billion
              valuation—OpenEvidence maintains substantial capital adequacy. Reported cash reserves provide multi-year
              runway, supported by positive contribution margins in the core digital advertising segment. Leadership has
              stated an intention to avoid burning billions of dollars on foundation-model training, focusing
              computational resources on domain-specific medical fine-tuning and retrieval-augmented generation.
              Nonetheless, from an underwriting perspective, the company's valuation multiple (implying 40x to 50x
              annualized revenue of $300M, or 80x to 120x FY2025 revenue) bakes in rapid TAM expansion into the broader
              $20B to $25B U.S. digital pharma ad market and commercial life sciences intelligence. The primary
              underwriting risks center on potential regulatory restrictions on point-of-care pharmaceutical marketing,
              institutional physician scrutiny regarding advertiser influence on clinical cognition, and the absence of
              audited disclosure separating ad revenue from software contract ARR.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Bypassed Procurement Paradox
            body: >-
              OpenEvidence achieved unprecedented point-of-care clinical velocity by treating doctors as consumers,
              offering free access to bypass multi-quarter hospital IT committees. However, this consumer-style adoption
              creates a financial paradox: while digital pharma advertising generates rapid top-line scaling, enterprise
              hospital systems currently pay zero software subscription fees. Converting high daily utilization into
              enterprise-grade software ARR will require proving institutional ROI and overcoming administrative
              inertia.
            calloutType: insight
            claimRefs:
              - CI002
              - CI005
              - CI009
          - type: callout
            title: Sponsorship Independence and Prior-Shifting Scrutiny
            body: >-
              Although OpenEvidence maintains that its medical answer generation architecture is strictly walled off
              from its advertising delivery engine, independent clinical researchers have raised concerns regarding
              cognitive 'prior-shifting.' If physicians viewing targeted pharmaceutical promotions unconsciously adapt
              subsequent prescribing habits, regulatory authorities or clinical societies could impose marketing
              restrictions that would directly impair the company's core monetization model.
            calloutType: risk
            claimRefs:
              - CI003
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Clinical Decision Support and Workflow Product Line
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence structures its clinical offering around point-of-care medical search, consultation, and
              operational communication for verified healthcare professionals. The core clinical consultation interface
              allows NPI-verified physicians to query complex clinical dilemmas, retrieving synthesized answers grounded
              directly in peer-reviewed medical literature. To capture clinician interactions across routine patient
              encounters, the company expanded its surface from standalone query retrieval into conversational and
              telephony workflows. This includes the Visits ambient scribe feature, designed to transcribe patient
              encounters into structured documentation, and an AI-integrated doctor dialer that incorporates calling,
              messaging, and straight-to-voicemail capabilities. By embedding clinical guidance directly into notes
              generated from telehealth and telephone encounters, OpenEvidence aims to unify real-time decision support
              with documentation.
            claimRefs:
              - CE001
