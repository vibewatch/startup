        title: Milestones and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence launched in 2023 after participating in the Mayo Clinic Platform ecosystem and has since
              assembled content relationships spanning NEJM, JAMA, NCCN, Nature, Cochrane, and Wiley, plus a reported
