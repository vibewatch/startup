              - CU007
              - CU008
              - CU009
              - CU012
      - number: '6.4'
        title: Durability and expansion remain the diligence bottleneck
        blocks:
          - type: paragraph
            body: >-
              Public adoption proof is ahead of public durability proof. None of the assigned evidence reports NRR, GRR,
              churn, renewal cohorts, contract length, paid-seat conversion, advertiser concentration, or top-enterprise
              concentration. Enterprise embedding and specialty-content licensing create plausible expansion routes, but
              they do not demonstrate recurring economics. Deployment governance can also slow expansion: NBC reports
              that MaineHealth asks clinicians not to enter protected health information and describes broader "shadow
              AI" use on personal devices. OpenEvidence states that it is HIPAA compliant and SOC 2 Type II certified,
              yet those controls do not by themselves resolve institution-specific approval, patient-outcome evidence,
              or clinician dependence risks.
            claimRefs:
              - CU010
              - CU011
              - CU015
              - CU016
