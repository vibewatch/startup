      - number: '5.2'
        title: Hybrid Operating Architecture, Infrastructure, and Model Modalities
        blocks:
          - type: paragraph
            body: >-
              The platform's technical stack relies on a hybrid infrastructure model designed to bridge high-throughput
              frontend demand with computationally intensive biomedical reasoning. Frontend routing and user session
              delivery are deployed on Vercel utilizing Next.js and Fluid compute, whereas backend data ingestion, core
              business logic, and model orchestration execute on Google Cloud Platform. At the model layer, OpenEvidence
              publicizes a suite of branded answering modes including Osler, Sackett, Snow, and a research preview
              designated Darwin. While commercial partnerships with technology providers such as Anthropic supply
              underlying foundational model capabilities, the exact parameter counts, base model versions, and internal
              routing logic across specific products remain undisclosed. The primary technical differentiation centers
              on constrained retrieval-augmented generation across licensed authoritative corpuses rather than
              ungrounded parameter recall.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.3'
        title: Content Licensing Differentiation, Security, and Governance Limits
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence differentiates its clinical outputs from general-purpose consumer chatbots by restricting
              search retrieval to vetted medical sources, establishing formal publishing partnerships with the New
              England Journal of Medicine, JAMA Network, Cochrane Systematic Reviews, and the National Comprehensive
              Cancer Network. On the compliance and security front, the organization maintains HIPAA compliance and has
              achieved SOC 2 Type II certification for the Security trust services category, implementing AES-256 data
              encryption at rest and TLS 1.2 in transit. Despite these controls, peer-reviewed clinical evaluations
              indicate that OpenEvidence functions primarily to reinforce existing physician treatment plans rather than
              steer clinical decision-making. Significant governance gaps persist regarding external audit trails for
              hallucination logs, independent clinical error rates, and the lack of a standardized public API for
              third-party developer integration.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Content Moat Precedes Parametric Distinction
            body: >-
              OpenEvidence's core technological defensibility derives from its exclusive content licensing partnerships
              with top medical publishers (NEJM, JAMA, Cochrane) and NPI-gated workflow access, rather than proprietary
              base LLM architectures or independent foundational model training.
            calloutType: insight
            claimRefs:
              - CE007
              - CE010
          - type: callout
            title: Opaque Foundation Model Lineage and Routing
            body: >-
              Public product branding around Osler, Sackett, and Snow obscures underlying foundational dependencies;
              independent technical reviews confirm that neither parameter scale, base model versions, nor exact
              provider allocation across answering modes have been disclosed.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and payer map
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence's core user is the verified clinician rather than the patient. NBC reports that U.S.
              practitioners register with a government-issued healthcare ID and can ask unlimited questions for free,
              while a company release scopes its one-day usage milestone to NPI-verified physicians. The public evidence
              therefore separates users from likely payers: individual clinicians receive free access, health systems
              can sponsor workflow integration, professional societies license specialty content, and pharmaceutical or
              device advertisers may fund attention. International reach is reported, but the competitor-authored source
              describing it is not an independent benchmark, and no geography-level engagement or revenue mix is
              disclosed.
            claimRefs:
              - CU001
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU009
              - CU013
              - CU016
      - number: '6.2'
        title: Adoption trajectory is large but not cohort evidence
        blocks:
          - type: paragraph
            body: >-
              Three 2026 snapshots point to substantial use: OpenEvidence told NBC that about 65% of U.S. doctors used
              the service across almost 27 million April encounters; CNBC relayed the company's estimate that 40% of
              U.S. doctors used it daily and that 10,000 medical centers were clients; and a company release claimed one
              million consultations on March 10. These figures are directionally consistent with scale, but they are not
              a comparable time series. "Active," "daily," "encounter," "consultation," and "client" have different
              populations and denominators, so they cannot establish conversion, retention, or paid-account growth.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU014
      - number: '6.3'
        title: Named proof spans integration, content, and limited clinical evaluation
        blocks:
          - type: paragraph
            body: >-
              Named evidence exists at three different proof levels and should not be collapsed into a logo count. Mount
              Sinai announced an enterprise link from its electronic health record for doctors, nurses, and pharmacists,
              but disclosed no utilization or outcome result. The American Academy of Ophthalmology described a live
              content integration and a feedback loop using high-level ophthalmologist usage data, but not commercial
              terms or adoption. A Mayo-supported retrospective study tested five primary-care cases and found strong
              clarity, relevance, support, and satisfaction scores, while the low impact score and narrow retrospective
              design limit any claim of improved patient outcomes.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
