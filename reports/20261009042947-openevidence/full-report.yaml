      - number: '4.2'
        title: Gross Margin Drivers, Inference Economics, and Organic Go-To-Market
        blocks:
          - type: paragraph
            body: >-
              The platform's reported unit economics reflect the financial divergence between high-margin digital
              advertising inventory and variable generative AI inference costs. Third-party analyses and company
              disclosures report gross margins near 90% on the core digital advertising business, driven by high
              realized CPMs against a sold inventory rate estimated at approximately 5%. Infrastructure costs consist of
              compute and hosting services primarily delivered via Google Cloud Platform and Vercel, paired with
              licensed content royalties paid to medical publishers including the Massachusetts Medical Society (NEJM
              Group) and the American Medical Association (JAMA Network). On the distribution side, customer acquisition
              costs for clinicians are near zero; CEO Daniel Nadler stated that 95% of new users join through
              physician-to-physician word-of-mouth rather than paid marketing campaigns. However, converting bottom-up
              organic clinician utilization into recurring institutional enterprise revenue requires navigating hospital
              IT review boards, responsible AI committees, and EHR integration protocols, which introduces traditional
              enterprise enterprise sales overhead.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
