  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              The primary structural vulnerability facing OpenEvidence is its bifurcated regulatory position. In the
              United States, OpenEvidence relies strictly on the non-device carve-out established under Section
              520(o)(1)(E) of the Food, Drug, and Cosmetic Act, enacted by the 21st Century Cures Act and refined by the
              FDA's updated January 2026 Clinical Decision Support guidance. Under this statutory safe harbor, the
              platform avoids classification as Software as a Medical Device (SaMD) by ensuring that recommendations are
              contextual, transparent, and accompanied by verifiable peer-reviewed citations that preserve the clinician
              as the ultimate decision-maker. However, this regulatory posture failed internationally. On April 27–28,
              2026, OpenEvidence abruptly suspended platform availability and terminated access for all clinicians
              across the European Union and the United Kingdom, citing mounting regulatory uncertainty under the EU
              Artificial Intelligence Act and medical device classifications enforced by the EMA and MHRA. The EU AI Act
              classifies clinical diagnosis and triage AI systems as high-risk technologies, requiring rigorous
              conformity assessments, algorithmic audit trails, and formal legal liability allocations. Rather than
              re-architecting its models or exposing its balance sheet to European compliance enforcement, OpenEvidence
              chose full geographic withdrawal. In parallel, OpenEvidence is embroiled in high-stakes intellectual
              property litigation in US federal courts, having sued Doximity under the Defend Trade Secrets Act,
              Computer Fraud and Abuse Act, and DMCA for allegedly orchestrating prompt-injection attacks and deploying
              physician impersonators to extract proprietary model prompts.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.2'
        title: Operational Reliability, Clinical Accuracy, and Technical Governance
        blocks:
          - type: paragraph
            body: >-
              Despite reporting perfect 100% scores on standardized multiple-choice exams like MedQA USMLE, independent
              academic and clinical evaluations indicate meaningful performance degradation when OpenEvidence encounters
              non-linear subspecialty cases. In a December 2025 pilot study on the MedXpertQA subspecialty dataset, the
              standard platform achieved only 34% accuracy on Quick Consult and 41% accuracy on Deep Consult,
              accompanied by evaluator-level repeatability variance of 77% and 72% respectively across identical
              clinical prompts. Clinicians in emergency medicine forums documented fundamental diagnostic inaccuracies,
              such as incorrectly stating that a standard chest X-ray could rule in or out pulmonary embolism.
              Furthermore, in prospective primary care evaluations, while OpenEvidence scored highly on clarity
              (3.55/4.0) and citation relevance (3.75/4.0), its measurable impact on altering clinical decision-making
              was rated 1.95/4.0, functioning primarily as an evidentiary confirmation tool rather than an active
              diagnostic driver. Operationally, the platform provides no contractual service-level agreements (SLAs) or
              guaranteed uptime for its free user tier, leading to documented service outages during active clinic hours
              that disrupted physician workflows. The platform maintains SOC 2 Type II certification and HIPAA
              compliance on Google Cloud Platform and Vercel infrastructure with AES-256 database encryption, but the
              absence of publicly disclosed institutional SLAs leaves clinical organizations without recourse during
              downtime.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR009
              - CR010
              - CR014
      - number: '7.3'
        title: Commercial Model Conflicts, Dependencies, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence's commercial model remains heavily concentrated in pharmaceutical and medical device digital
              advertising, monetizing the seconds of latency while clinical evidence is retrieved for NPI-verified
              physicians. While this Direct-to-Clinician model enabled rapid adoption to 1 million daily clinical
              consultations across more than 10,000 healthcare facilities, it introduces acute institutional friction.
              Academic medical centers and health system procurement bodies express deep ethical and clinical governance
              concerns regarding pharmaceutical ads displayed alongside therapeutic recommendations, raising ongoing
              scrutiny under FTC and FDA promotional boundaries. Furthermore, OpenEvidence relies on direct content
              licensing partnerships with elite publishers, including the New England Journal of Medicine, JAMA, NCCN,
              and Cochrane Library. If publisher partners escalate licensing fees or grant non-exclusive access to
              foundational LLM developers, OpenEvidence's evidentiary data moat could erode. Enterprise EHR integration
              represents another architectural vulnerability: while the platform has achieved Epic deployments at Mount
              Sinai, Sutter Health, and Cedars-Sinai, Epic's native AI initiatives with Microsoft and OpenAI create a
              distinct disintermediation threat. Key thesis-break triggers for investors include any FDA enforcement
              action classifying multi-agent clinical reasoning as SaMD, institutional ad-blocking across enterprise
              hospital networks, or the loss of core journal licensing agreements.
            claimRefs:
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The European AI Act Precedent and SaMD Creep
            body: >-
              OpenEvidence's complete withdrawal from the EU and UK in April 2026 illustrates the fragile regulatory
              foundation supporting point-of-care medical AI. While Section 520(o)(1)(E) of the US FD&C Act provides a
              safe harbor for clinical decision support that merely presents reference citations, advanced multi-agent
              architectures that cross-examine treatment options edge dangerously close to diagnostic automation. If US
              regulators harmonize with European risk-based oversight, OpenEvidence could face sudden operational
              paralysis or massive compliance overhead.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence's core investment thesis centers on its rapid clinician adoption and proprietary workflow
              integration, with more than 40% of licensed U.S. physicians utilizing the platform across 10,000 hospitals
              and clinical centers. On March 10, 2026, the company logged 1 million clinical consultations within a
              single 24-hour period, demonstrating that medical AI has achieved scaled clinician adoption. Crucially,
              OpenEvidence differentiates its knowledge retrieval through formal partnerships with premier medical
              journals including the New England Journal of Medicine, JAMA, and NCCN clinical guidelines. Conversely,
              the anti-thesis highlights structural vulnerabilities in OpenEvidence's business model and competitive
              defensibility. Because user access is free to clinicians and monetized via pharmaceutical advertising at
              $70 to $150 CPM rather than enterprise software seat licenses, revenue predictability remains vulnerable
              to advertising budget cycles and potential regulatory scrutiny over commercial bias in point-of-care
              tools. Furthermore, peer-reviewed clinical evaluation published in PubMed Central indicates that while
              OpenEvidence scored high in clarity (3.55/4) and relevance (3.75/4), its measured impact on modifying
              clinical decision-making was limited (1.95/4), suggesting that clinicians treat the tool primarily as a
              reference confirmation engine rather than an indispensable diagnostic system. As frontier lab competitors
              like OpenAI Health and Claude Healthcare pursue direct healthcare workflows, switching costs for
              uncontracted physicians remain negligible.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
      - number: '8.2'
        title: Recommendation and Financing Context
        blocks:
          - type: paragraph
            body: >-
              We assign OpenEvidence a recommendation of research-more, accompanied by a high risk rating, a medium
              confidence score, and an expensive valuation stance. In January 2026, OpenEvidence closed a $250 million
              Series D financing round co-led by Thrive Capital and DST Global, establishing a post-money valuation of
              $12 billion and bringing total capital raised to approximately $700 million. While the company reported
              expanding from $100 million annualized revenue in late 2025 to roughly $300 million by mid-2026 ($25
              million per month) while operating at approximately breakeven on a cash-flow basis, the $12 billion
              valuation implies a demanding multiple of 40x to 120x revenue. That multiple is substantially higher than
              typical high-growth software and digital health comparables, which trade between 10x and 18x forward
              revenue. Furthermore, reports in July 2026 indicated OpenEvidence evaluated raising an additional $200
              million at a $20 billion valuation but declined to proceed due to concerns regarding dilution of founder
              and existing shareholder equity. In secondary markets, UpMarket's valuation model estimated pre-IPO share
              value at $14 billion, reflecting a premium over Series D terms. At current headline pricing, growth
              investors take on extreme downside valuation exposure without the downside protection of long-term
              contracted recurring SaaS software revenue.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
      - number: '8.3'
        title: Bull, Base, and Bear Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              Our valuation scenarios evaluate potential investment return trajectories under varying assumptions
              regarding pharmaceutical advertising durability, enterprise hospital software conversion, and multiple
              compression upon liquidity. In the bull scenario (20% probability), OpenEvidence successfully defends its
              clinical mindshare against frontier AI labs, scales pharmaceutical advertising to $500 million in annual
              revenue, and converts enterprise health systems into high-margin recurring software subscribers. This
              justifies a $20 billion to $25 billion valuation upon public market debut at a 40x to 50x multiple. In the
              base case (55% probability), OpenEvidence sustains revenue expansion within the $250 million to $350
              million run-rate band while remaining primarily an ad-supported reference utility. Upon liquidity, public
              market comparables re-rate the business to a 25x to 35x revenue multiple, yielding an enterprise valuation
              between $8 billion and $12 billion and resulting in flat to modest returns for late-stage Series D
              investors. In the bear scenario (25% probability), pharmaceutical marketing budgets face macroeconomic or
              regulatory contraction, hospital health systems restrict ad-supported AI tools on clinical integrity
              concerns, or rapid feature parity from OpenAI Health and Claude Healthcare erodes clinician engagement.
              Under this scenario, revenue contracts or stalls below $200 million, driving multiple compression down to
              10x to 15x and implying an equity valuation of $3 billion to $5 billion, which triggers severe dilution
              and downside loss for Series D preference tranches.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
      - number: '8.4'
        title: Exit Pathways and Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Exit readiness for OpenEvidence faces distinct timing and valuation hurdles. Although CEO Daniel Nadler
              previously engineered a successful strategic exit with Kensho Technologies ($700 million acquisition by
              S&P Global in 2018) and OpenEvidence held preliminary acquisition discussions with a major technology
              conglomerate in early 2026, standalone public market listing prospects remain subject to market maturity.
              Management has noted that frontier foundation model developers must test public markets before
              application-layer AI providers can conduct an initial public offering. To support an IPO at or above $12
              billion, institutional public equity investors will demand audited GAAP accounting, clear separation
              between sponsored content and medical guidance, and robust enterprise governance. OpenEvidence has
              established foundational compliance through SOC 2 Type II certification and HIPAA alignment. However,
              before committing growth capital, investors must execute focused diligence kill criteria: verifying FY2025
              audited revenue and gross margins by monetization stream, confirming top-five pharmaceutical advertiser
              concentration and renewal rates, evaluating non-advertising health system ARR from signed enterprise
              agreements, and auditing senior liquidation preferences to ensure subordinate common equity is not
              severely impaired under acquisition outcomes.
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Verdict: Hold Position at Current Headline Valuation'
            body: >-
              OpenEvidence exhibits extraordinary clinician traction with over 40% physician penetration and rapid
              top-line revenue expansion from $100M to roughly $300M run-rate. However, at a $12B valuation—and with
              reported contemplation of a $20B round—the company trades at roughly 40x to 120x revenue while relying
              heavily on pharmaceutical advertising rather than contracted enterprise SaaS. Investors should maintain a
              'research-more' stance and require audited FY2025 financials, advertiser concentration disclosures, and
              verified non-ad ARR before considering growth equity participation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
