      - number: '3.3'
        title: Moat Durability, Platform Substitution, and Incumbent Response
        blocks:
          - type: paragraph
            body: >-
              The durability of OpenEvidence's competitive advantage rests upon an interplay between exclusive journal
              content licensing, clinician workflow habits, electronic health record integration, and international
              regulatory compliance. OpenEvidence's defensive moat is anchored by formal licensing agreements with
              premier publishers including The New England Journal of Medicine, JAMA Network, Nature Portfolio, Cochrane
              Systematic Reviews, and the National Comprehensive Cancer Network. These partnerships prevent generic
              frontier large language models from legally replicating full-text clinical synthesis across
              copyright-protected medical literature. Furthermore, physician habituation is strong: more than 650,000
              verified U.S. physicians use the platform, generating over 20 million monthly consultations across 10,000
              medical centers. Nevertheless, switching costs for individual clinicians remain low because the core web
              and mobile tool requires no financial commitment, allowing clinicians to multi-home between OpenEvidence,
              Doximity Ask, and UpToDate. The most severe platform threats stem from electronic health record vendors,
              particularly Epic Systems, which controls over 40% of the U.S. hospital EHR market and possesses
              longitudinal clinical data spanning 300 million patient records through Cosmos. If Epic restricts
              third-party FHIR interfaces or bundles native AI decision support directly into charting workflows,
              OpenEvidence's point-of-care distribution could face severe disintermediation. Additionally, international
              expansion is severely constrained: OpenEvidence abruptly withdrew from the European Union and United
              Kingdom on April 27, 2026, citing regulatory uncertainty surrounding the EU AI Act and MHRA device
              regulations, allowing regional alternatives like iatroX, BMJ Best Practice, and Vera Health to capture
              overseas clinician demand.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP010
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP007
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: EHR Disintermediation and Incumbent Platform Risk
            body: >-
              OpenEvidence's rapid adoption among U.S. physicians relies on standalone mobile and web usage, but
              long-term enterprise monetization depends upon deep integration within electronic health records like
              Epic. Epic's dominance across more than 40% of U.S. hospital beds and its proprietary Art for Clinicians
              initiative create a structural platform risk: Epic can embed native AI directly into charting and order
              workflows, potentially restricting third-party FHIR connectors or relegating OpenEvidence to an
              unintegrated external tab.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP015
          - type: callout
            title: The Transatlantic Regulatory Divide in Clinical AI
            body: >-
              OpenEvidence's sudden withdrawal from the United Kingdom and European Union on April 27, 2026, highlights
              the divergence between U.S. and European healthcare AI governance. While U.S. clinicians have adopted
              OpenEvidence at scale without software-as-a-medical-device premarket certification, the European Union AI
              Act and UK MHRA frameworks treat point-of-care decision support with acute regulatory scrutiny, ceding
              European clinical demand to localized competitors like iatroX and BMJ Best Practice.
            calloutType: insight
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization Streams, High-CPM Sponsorships, and Enterprise Licensing
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence operates a predominantly ad-supported monetization architecture that pairs frictionless free
              access for NPI-verified clinicians with premium pharmaceutical and medical device sponsorships. By
              deliberately bypassing traditional health system procurement cycles, the company allows individual
              clinicians to query its platform at no charge, building a verified prescriber base of over 757,000
              physicians across 10,000 medical centers. Advertisers pay premium CPMs ranging between $70 and upwards of
              $1,000 to display non-intrusive promotional placements and video units during the seconds required for the
              system to generate evidence-grounded answers. In addition to core pharmaceutical sponsorships,
              OpenEvidence introduced continuing medical education (CME) credit partnerships in April 2025 to capture
              medical accreditation and sponsorship budgets. While the company has announced enterprise integrations
              with hospital networks including Sutter Health, Mount Sinai, Cedars-Sinai, and NewYork-Presbyterian, these
              deployments currently utilize the core ad-supported service. Management has disclosed plans to pioneer a
              dedicated non-ad-supported enterprise subscription tier—mirroring private foundation-model enterprise
              software tiers—but realized software ARR from hospital IT budgets remains nascent.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
