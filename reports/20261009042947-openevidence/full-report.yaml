  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Sequential analytical chain evaluating clinical adoption, monetization mechanics, valuation strain, downside
      risks, and ultimate diligence verdict.
    data:
      nodes:
        - id: adoption
          label: Physician Scale & Engagement
          detail: Used by >40% of U.S. physicians with 1M daily clinical consultations and top-tier journal partnerships.
          tone: positive
        - id: monetization
          label: Ad-Driven Revenue Expansion
          detail: Grew from $100M run-rate in late 2025 to ~$300M by mid-2026 via $70-$150 CPM pharma sponsorships.
          tone: positive
        - id: valuation-multiple
          label: Extreme Headline Valuation
          detail: $12B Series D mark embeds 40x-120x revenue multiple; paused talks at $20B on dilution concerns.
          tone: risk
        - id: model-fragility
          label: Enterprise vs Ad Model Friction
          detail: Absence of contracted enterprise software SaaS ARR leaves business vulnerable to ad budget cyclicality.
          tone: risk
        - id: competitive-pressure
          label: Ecosystem & Governance Threats
          detail: OpenAI and Anthropic healthcare entries plus regulatory scrutiny on sponsored clinical reference tools.
          tone: risk
        - id: verdict
          label: 'Diligence Verdict: Research-More'
          detail: Valuation stance expensive; risk rating high; require audited financials and non-ad ARR before entry.
          tone: neutral
      edges:
        - from: adoption
          to: monetization
