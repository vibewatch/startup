        - Critical
        - Transitioning to enterprise B2B paid health system licenses (e.g. Mount Sinai deal)
        - B2B enterprise pipeline may ramp slower than ad revenue compression or procurement boycotts
      - - Content IP Moat
        - Medical Journal Publishers (NEJM, JAMA, NCCN, Cochrane)
        - Provides exclusive or licensed full-text ingestion corpus for RAG
        - High
        - Publishers terminate licenses or grant identical rights to OpenAI/Anthropic/Google
        - High
