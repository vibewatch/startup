        title: Exhibits
        blocks:
          - type: callout
            title: Bottom-up clinician adoption is the strongest customer signal
            body: >-
              Multiple 2026 sources report substantial individual use, and named integrations show a route from
              self-service discovery into institutional workflows.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU008
          - type: callout
            title: Usage is not yet durability
            body: >-
              Public evidence does not connect clinician activity to renewals, recurring enterprise economics,
              advertiser retention, or customer concentration.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
