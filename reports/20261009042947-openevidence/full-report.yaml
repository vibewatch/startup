  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundary Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial and clinical domain in which OpenEvidence operates spans three intersecting software and
              media categories: clinical decision support (CDS) platforms, point-of-care medical literature search, and
              digital pharmaceutical marketing. Historically, hospital health systems and medical group practices
              procured clinical reference databases through top-down institutional licenses from enterprise publishers
              such as Wolters Kluwer (UpToDate), Elsevier (ClinicalKey), and EBSCO (DynaMed). These incumbent platforms
              are sold directly to hospital Chief Medical Information Officers (CMIOs) and health system Chief
              Information Officers (CIOs), embedding institutional guidelines and drug databases into enterprise
              electronic health record (EHR) systems. In contrast, OpenEvidence redefines its addressable boundary by
              offering a free, direct-to-clinician, evidence-grounded AI search tool designed for mobile and web
              workflows rather than enterprise billing departments. This consumer-style distribution bypasses
              traditional institutional procurement cycles, allowing physicians to query medical literature during and
              between clinical consultations. However, this distinct product scope intentionally excludes transactional
              EHR billing workflows, dedicated drug dosing calculators, and automated differential diagnosis generators,
              establishing clear product and market boundaries against full-suite enterprise clinical software.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
      - number: '2.2'
        title: 'Market Sizing Lenses: Digital Pharma Advertising vs. Enterprise CDS Spend'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market size for OpenEvidence requires separating top-line clinical decision support
              software budgets from digital pharmaceutical advertising spend. While healthcare software venture
              investors often conceptualize medical AI as a broad multi-billion-dollar global clinical productivity
              market, OpenEvidence's near-term commercial model is primarily driven by pharmaceutical brand advertising
              displayed during query generation latency. According to venture capital disclosures from Series D lead
              investors, the total addressable market (TAM) for US digital pharmaceutical advertising is estimated at
              $20 billion to $25 billion annually, excluding international markets. Within this advertising TAM, the
              serviceable addressable market (SAM) is bounded by high-intent HCP (healthcare professional) digital
              advertising channels, where pharmaceutical marketers target verified prescribers by specialty and clinical
              query intent. OpenEvidence's serviceable obtainable market (SOM) is anchored by its reported $100 million
              in annualized run-rate revenue achieved by January 2026 across its 757,000 registered US physicians. On
              the alternative software procurement lens, health system enterprise subscriptions represent an adjacent
              but commercially distinct TAM where health system budget owners evaluate annual seat licenses or
              enterprise-wide site agreements, a stream that remains nascent for OpenEvidence.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
      - number: '2.3'
        title: Buyer, User, and Payer Segmentation Across the Clinical Workflow
        blocks:
          - type: paragraph
            body: >-
              A central structural dynamic of OpenEvidence's market position is the deliberate decoupling of the end
              user from the economic payer. The end users are individual verified clinicians—including primary care
              physicians, subspecialists, hospital residents, and emergency medicine doctors—who adopt the platform
              without financial cost to look up peer-reviewed evidence and clinical guidelines. The commercial payers,
              conversely, are pharmaceutical marketing teams and brand managers who purchase targeted digital ad
              inventory displayed during the retrieval latency between a submitted query and the generated answer.
              Health system IT procurement represents an emerging secondary buyer segment where hospitals license
              integrated EHR copilots, such as OpenEvidence's pilot integration with Sutter Health and Epic systems.
              This tri-part segmentation creates distinct adoption velocity across user tiers: individual clinicians
              adopt instantaneously via mobile and web app stores, whereas enterprise health system buyers require
              rigorous SOC 2 Type II compliance reviews, HIPAA business associate agreements, and formal clinical safety
              evaluations before approving institutional deployment.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM010
              - CM012
              - CM014
      - number: '2.4'
        title: Adoption Drivers and Regulatory Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The secular expansion of clinical AI search is propelled by the exponential doubling of medical
              literature, estimated to double every five years even under conservative impact-factor journal thresholds,
              leaving practicing physicians unable to assimilate new clinical trial findings through traditional
              postgraduate reading alone. OpenEvidence accelerates clinical trust by integrating authoritative full-text
              literature agreements with premium publishers, including the New England Journal of Medicine, JAMA
              Network, National Comprehensive Cancer Network (NCCN), and Cochrane Systematic Reviews, reinforced by its
              EvidenceGrade methodology that operationalizes GRADE certainty frameworks at point of care. Despite these
              growth catalysts, severe market expansion constraints exist. In April 2026, OpenEvidence withdrew from the
              UK and European Union markets due to regulatory uncertainty surrounding the EU Artificial Intelligence Act
              and evolving UK MHRA compliance standards for clinical AI tools. Furthermore, clinical trials in primary
              care demonstrate that while AI recommendations achieve high clarity and relevance in managing common
              chronic diseases, their real-world impact on altering established physician clinical plans remains
              limited, functioning primarily to reinforce rather than redirect physician judgment.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Sided Monetization Shifts the Economic Burden
            body: >-
              By capturing clinician engagement through a zero-cost, consumer-grade search tool, OpenEvidence bypasses
              hospital IT procurement delays and monetizes prescriber attention through high-margin pharmaceutical
              advertising. This decoupled structure decouples adoption velocity from health system procurement budgets,
              though it exposes long-term enterprise valuation to advertiser renewal cohorts and physician tolerance for
              sponsored messaging.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Strategic Alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding clinical artificial intelligence spans legacy expert-curated reference
              databases, specialized medical reasoning engines, clinician workflow networks, ambient documentation
              scribes, and platform incumbents. OpenEvidence operates primarily as a literature-grounded clinical
              question-answering tool that synthesizes peer-reviewed medical citations directly for verified
              practitioners. In the legacy reference category, Wolters Kluwer's UpToDate and Elsevier's ClinicalKey AI
              hold multi-decade enterprise relationships with hospital procurement offices and academic health centers.
              UpToDate commands over 12,000 clinical topics curated by more than 7,400 physician authors, charging
              individual clinicians from $579 to $699 annually or licensing institution-wide across electronic health
              record systems. However, legacy publishers have moved incrementally on generative conversational
              capabilities, often gating advanced AI features behind premium tiers. Conversely, specialized AI
              challengers such as EvidenceMD, Vera Health, and Glass Health target architectural limitations in
              first-generation clinical search. EvidenceMD differentiates via transparent chain-of-thought reasoning
              that exposes up to 64,000 thinking tokens and provides an OpenAI-compatible developer API, contrasting
              sharply with OpenEvidence's black-box synthesis. Simultaneously, ambient scribes such as Abridge and
              Ambience Healthcare compete for clinician attention during patient encounters, prompting OpenEvidence to
              release Visits and Voice Mode to expand beyond pure evidence lookup.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: Competitor Profiles, Pricing Models, and Platform Capabilities
        blocks:
          - type: paragraph
            body: >-
              Evaluating the clinical intelligence sector reveals stark divergences in monetization models, target user
              populations, and verified clinical utility. OpenEvidence provides free access to verified U.S. healthcare
              professionals possessing National Provider Identifier credentials, funding core operations via
              pharmaceutical digital display advertising during answer generation latency while piloting non-ad
              enterprise models at institutions including Cedars-Sinai, Mount Sinai, and Sutter Health. In contrast,
              UpToDate generates recurring subscription revenue through hospital system site licenses and individual
              clinician subscriptions ranging between $219 for trainees and $699 for Pro Plus with Expert AI. EBSCO's
              DynaMedex bundles clinical synthesis with Micromedex pharmacological and drug interaction databases,
              leveraging institutional library licensing rather than public individual pricing. Doximity commands over 3
              million registered U.S. healthcare members and deploys Doximity Ask alongside its Scribe and Dialer
              utilities, converting its professional communication network into a point-of-care assistant. Specialized
              clinical AI platforms such as EvidenceMD operate freemium global models across 30 languages without
              requiring a U.S. NPI gate, publishing empirical accuracy benchmarks including 54.6% on HealthBench Hard.
              The resulting market dynamic contrasts high-friction enterprise-paid databases against friction-free
              ad-funded utilities and emerging auditable reasoning platforms.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
