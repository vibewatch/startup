  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Rating / Value
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Extreme valuation multiple on ad-supported model with unproven enterprise conversion
        - Withhold growth-equity capital until audited unit economics and non-ad ARR are demonstrated
      - - Confidence
        - medium
        - Public reporting covers round sizes and revenue run-rate, but lacks audited financials
        - Require direct data room access before issuing formal investment committee approval
      - - Risk Rating
        - high
        - Dependence on pharmaceutical sponsorship, big-tech competition, and dilution overhang
        - Model downside liquidation preferences and cap-table seniority across Series A through D
      - - Valuation Stance
        - expensive
        - Valued at $12B in Jan 2026 (~40x-120x revenue); paused $20B round talks over dilution
        - Do not participate at secondary premiums ($14B UpMarket mark) or proposed $20B valuations
    notes: >-
      Evaluates investment posture based on Series D financing marks, reported revenue run-rates, and market risks as of
      2026-10-09.
