        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The two publicly identified founders bring complementary company-building and machine-learning
              credentials. Nadler previously built Kensho, which S&P Global acquired for about $700 million in 2018,
              while Ziegler is described as a Harvard AI researcher or doctoral student. The official team page lists a
              deep technical and clinical bench, but the assigned evidence does not provide a complete executive roster,
              board composition, voting arrangements, or succession plan. Investor commentary is unusually
              founder-centric and a GV representative said they joined the board after GV led the Series B. Accordingly,
              founder-market fit appears strong, but the degree of decision concentration around Nadler remains a
              diligence question rather than a quantified governance conclusion.
