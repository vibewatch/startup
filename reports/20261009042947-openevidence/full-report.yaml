    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence was founded in 2022 by Daniel Nadler and Zachary Ziegler and describes its product as an AI
              copilot that helps doctors make point-of-care clinical decisions. CNBC and the current Wikipedia record
              place the company in Miami, while a 2026 review abstract labels OpenEvidence Inc. as Cambridge,
              Massachusetts; the retained evidence does not establish whether that reflects a former office, legal
              domicile, or stale descriptor. The product is free to eligible healthcare professionals, and CNBC reports
              that advertising, including in-app video promotions, is the principal disclosed monetization engine. That
              distribution model lowers adoption friction but makes reported clinician reach different from contracted
              enterprise customer count.
