        - Loss of proprietary retrieval exclusivity turns platform into a commodity interface
      - - Workflow Platform
        - EHR Gatekeepers (Epic Systems)
        - Hosts embedded clinician lookup workflows inside hospital records
        - High
        - Epic bundles native OpenAI/Microsoft clinical assistants, disintermediating OpenEvidence
        - High
        - FHIR-based bidirectional note generation via Visits and direct health system agreements
        - Platform risk from EHR vendor policy shifts or exorbitant app integration taxes
