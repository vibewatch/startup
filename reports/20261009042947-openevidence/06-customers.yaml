schemaVersion: "report-v2"
artifact: customers
slug: openevidence
runDate: 2026-10-09
company:
  name: OpenEvidence
chapter:
  number: 6
  title: Customers
  summary: >-
    OpenEvidence shows unusually broad clinician adoption, multiple named workflow
    integrations, and specialty-content partnerships, but the strongest scale metrics
    are company-reported and use incompatible definitions. Public evidence still does
    not establish retention, renewals, contract economics, or customer concentration.
sections:
  - id: customer-base-and-payer-map
    title: Customer base and payer map
    body: >-
      OpenEvidence's core user is the verified clinician rather than the patient. NBC
      reports that U.S. practitioners register with a government-issued healthcare ID
      and can ask unlimited questions for free, while a company release scopes its
      one-day usage milestone to NPI-verified physicians. The public evidence therefore
      separates users from likely payers: individual clinicians receive free access,
      health systems can sponsor workflow integration, professional societies license
      specialty content, and pharmaceutical or device advertisers may fund attention.
      International reach is reported, but the competitor-authored source describing it
      is not an independent benchmark, and no geography-level engagement or revenue mix
      is disclosed.
    claimRefs:
      - CU001
      - CU009
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption trajectory is large but not cohort evidence
    body: >-
      Three 2026 snapshots point to substantial use: OpenEvidence told NBC that about
      65% of U.S. doctors used the service across almost 27 million April encounters;
      CNBC relayed the company's estimate that 40% of U.S. doctors used it daily and
      that 10,000 medical centers were clients; and a company release claimed one
      million consultations on March 10. These figures are directionally consistent
      with scale, but they are not a comparable time series. "Active," "daily,"
      "encounter," "consultation," and "client" have different populations and
      denominators, so they cannot establish conversion, retention, or paid-account
      growth.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU014
    tableRefs:
      - TU002
  - id: named-proof-and-outcomes
    title: Named proof spans integration, content, and limited clinical evaluation
    body: >-
      Named evidence exists at three different proof levels and should not be collapsed
      into a logo count. Mount Sinai announced an enterprise link from its electronic
      health record for doctors, nurses, and pharmacists, but disclosed no utilization
      or outcome result. The American Academy of Ophthalmology described a live content
      integration and a feedback loop using high-level ophthalmologist usage data, but
      not commercial terms or adoption. A Mayo-supported retrospective study tested
      five primary-care cases and found strong clarity, relevance, support, and
      satisfaction scores, while the low impact score and narrow retrospective design
      limit any claim of improved patient outcomes.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU012
    tableRefs:
      - TU003
  - id: durability-expansion-and-risk
    title: Durability and expansion remain the diligence bottleneck
    body: >-
      Public adoption proof is ahead of public durability proof. None of the assigned
      evidence reports NRR, GRR, churn, renewal cohorts, contract length, paid-seat
      conversion, advertiser concentration, or top-enterprise concentration. Enterprise
      embedding and specialty-content licensing create plausible expansion routes, but
      they do not demonstrate recurring economics. Deployment governance can also slow
      expansion: NBC reports that MaineHealth asks clinicians not to enter protected
      health information and describes broader "shadow AI" use on personal devices.
      OpenEvidence states that it is HIPAA compliant and SOC 2 Type II certified, yet
      those controls do not by themselves resolve institution-specific approval,
      patient-outcome evidence, or clinician dependence risks.
    claimRefs:
      - CU010
      - CU011
      - CU015
      - CU016
    figureRefs:
      - FU001
tables:
  - id: TU001
    title: Customer segmentation and economic role
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale proof
      - Strategic value
      - Evidence gap
    rows:
      - - U.S. individual clinicians
        - "User: verified physicians; access is free; reported payer includes advertisers"
        - Point-of-care evidence search, clinical decisions, study support
        - "Company told NBC: about 650,000 active U.S. physicians in April 2026"
        - Large clinician attention surface and bottom-up adoption
        - Active-use definition, specialty cohorts, and paid conversion are undisclosed
      - - International clinicians
        - "User: verified clinicians; payer and eligibility vary by geography"
        - Evidence queries outside the United States
        - "Company told NBC: about 1.2 million international users"
        - Geographic reach beyond the U.S. core
        - Country mix, localization, engagement, and revenue are undisclosed
      - - Health systems
        - "Buyer: institution; users: doctors, nurses, and pharmacists"
        - EHR-linked clinical decision support and governed deployment
        - Mount Sinai announced an enterprise EHR link; CNBC relayed 10,000 medical centers as clients
        - Workflow depth and possible enterprise revenue
        - Paying status, contract value, renewal, and measured outcomes are undisclosed
      - - Professional societies and content licensors
        - "Partner / licensor: specialty body; users: member clinicians"
        - Guideline integration and usage-feedback loop
        - AAO described integration serving a 32,000-doctor professional community
        - Specialty depth and differentiated licensed content
        - Economics, activated users, and outcome impact are undisclosed
    notes: >-
      Scale figures are reported by OpenEvidence or its partners and use different
      definitions; they are not additive and do not identify paying customers.
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU009
      - CU013
      - CU016
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period / date
      - Source and attribution
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - U.S. physician active use
        - "About 65%; roughly 650,000 doctors"
        - April 2026
        - OpenEvidence representatives quoted by NBC News
        - Medium
        - Broad reported penetration among U.S. physicians
        - Active-use definition and eligible-physician denominator are not provided
      - - U.S. physician daily use
        - "40%"
        - Reported 2026-05-19
        - Company estimate relayed by CNBC
        - Medium
        - Meaningful reported frequency, not just registration
        - Measurement method, day definition, and denominator are not provided
      - - Clinical encounters
        - "Almost 27 million"
        - April 2026
        - Company figure relayed by NBC News
        - Medium
        - High monthly interaction volume
        - Encounter definition, unique users, and repeat rate are not provided
      - - Clinical consultations in one day
        - "1 million"
        - "2026-03-10"
        - OpenEvidence company release syndicated by PR Newswire
        - Medium-low
        - Demonstrates a claimed peak-volume milestone
        - No independent audit, unique-user count, or normal-day baseline
      - - Medical centers described as clients
        - "10,000"
        - Reported 2026-05-19
        - Company statement relayed by CNBC
        - Medium-low
        - Suggests institutional breadth beyond individual accounts
        - Client definition, paying status, and center/account overlap are not provided
    notes: >-
      This is a set of reported snapshots, not a cohort or funnel. Values cannot be
      converted into growth, retention, market share, or revenue without consistent
      populations, definitions, and prior-period observations.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU014
  - id: TU003
    title: Named customer proof table
    columns:
      - Named organization
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Observed outcome
      - Limitation
    rows:
      - - Mount Sinai Health System
        - Enterprise health system
        - Direct EHR-portal link for doctors, nurses, and pharmacists
        - Enterprise partnership and integration announced in March 2026
        - Workflow access moved inside the institutional EHR surface
        - No utilization, contract, renewal, safety, or patient-outcome metric disclosed
      - - American Academy of Ophthalmology
        - Professional society / content licensor
        - Preferred Practice Patterns and technology assessments integrated with usage feedback
        - AAO described the resources as integrated and available free to ophthalmologists
        - Specialty guidance entered the clinician workflow and generated topic-level feedback
        - No activated-user, query-volume, commercial, or clinical-outcome metric disclosed
      - - Mayo Clinic primary-care case series
        - Practitioner research / customer proof
        - Retrospective review of five common chronic-condition cases by four independent physicians
        - Evaluation study, not evidence of a commercial deployment
        - "Mean scores: clarity 3.55, relevance 3.75, support 3.35, satisfaction 3.60; impact 1.95 on a 0-4 scale"
        - Five retrospective cases from one institution; prospective and complex-case validation remains needed
    notes: >-
      Sample coverage only: these are the named deployments, partner relationships, and
      practitioner evaluations supported by the retained assigned evidence, not an
      exhaustive customer roster. Status labels avoid treating an announced integration
      or a research evaluation as a paid production renewal.
    enumerationScope:
      coverage: sample
      basis: >-
        Named organizations with a concrete use case in the retained customer evidence
        available through the 2026-10-09 research cutoff.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
figures:
  - id: FU001
    title: Observed customer journey and missing durability proof
    type: journey-map
    summary: >-
      Adoption moves from verified free clinician access toward specialty content and
      enterprise workflow embedding, but public evidence stops before renewal economics.
    data:
      items:
        - label: Verify
          detail: Clinicians register with a government-issued healthcare identifier.
          touchpoints:
            - Website or mobile app
            - NPI verification
        - label: First point-of-care query
          detail: A clinician asks for cited evidence on a treatment or diagnostic question.
          touchpoints:
            - Clinical search
            - Peer-reviewed citations
        - label: Repeat individual use
          detail: Company-reported active, daily, encounter, and consultation metrics indicate frequency at scale.
          touchpoints:
            - Follow-up questions
            - Deep Consult or related workflows
        - label: Specialty expansion
          detail: Licensed society guidelines deepen the evidence available within a specialty workflow.
          touchpoints:
            - AAO guidance
            - Topic-level usage feedback
        - label: Enterprise embedding
          detail: Health systems can link OpenEvidence from the EHR for governed workforce access.
          touchpoints:
            - Mount Sinai EHR portal
            - Institutional privacy review
        - label: Renewal and monetization
          detail: Public evidence does not disclose renewal cohorts, contract duration, NRR, GRR, or concentration.
          touchpoints:
            - Enterprise renewal
            - Advertiser renewal
            - Paid expansion
    approximationNotes: >-
      This is an evidence map, not a conversion funnel; stages describe observed
      adoption surfaces and unresolved diligence steps rather than a shared population.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU008
      - CU010
      - CU015
callouts:
  - calloutType: strength
    title: Bottom-up clinician adoption is the strongest customer signal
    body: >-
      Multiple 2026 sources report substantial individual use, and named integrations
      show a route from self-service discovery into institutional workflows.
    claimRefs:
      - CU002
      - CU003
      - CU008
  - calloutType: risk
    title: Usage is not yet durability
    body: >-
      Public evidence does not connect clinician activity to renewals, recurring
      enterprise economics, advertiser retention, or customer concentration.
    claimRefs:
      - CU014
      - CU015
      - CU016
