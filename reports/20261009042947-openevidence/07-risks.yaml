company:
  name: "OpenEvidence"
chapter:
  number: 7
  title: "Risks"
  summary: "OpenEvidence operates under acute regulatory, clinical, operational, and intellectual property exposure, headlined by its complete April 2026 withdrawal from the European Union and United Kingdom under the EU Artificial Intelligence Act. While the platform has captured over 40% of US physician daily point-of-care traffic, real-world evaluations document subspecialty accuracy drops and downtime incidents, while ongoing federal trade secret litigation against Doximity and high dependence on pharmaceutical advertising create multi-faceted downside risks."
sections:
  - id: "regulatory-and-legal-risks"
    title: "Regulatory and Legal Risk Landscape"
    body: "The primary structural vulnerability facing OpenEvidence is its bifurcated regulatory position. In the United States, OpenEvidence relies strictly on the non-device carve-out established under Section 520(o)(1)(E) of the Food, Drug, and Cosmetic Act, enacted by the 21st Century Cures Act and refined by the FDA's updated January 2026 Clinical Decision Support guidance. Under this statutory safe harbor, the platform avoids classification as Software as a Medical Device (SaMD) by ensuring that recommendations are contextual, transparent, and accompanied by verifiable peer-reviewed citations that preserve the clinician as the ultimate decision-maker. However, this regulatory posture failed internationally. On April 27–28, 2026, OpenEvidence abruptly suspended platform availability and terminated access for all clinicians across the European Union and the United Kingdom, citing mounting regulatory uncertainty under the EU Artificial Intelligence Act and medical device classifications enforced by the EMA and MHRA. The EU AI Act classifies clinical diagnosis and triage AI systems as high-risk technologies, requiring rigorous conformity assessments, algorithmic audit trails, and formal legal liability allocations. Rather than re-architecting its models or exposing its balance sheet to European compliance enforcement, OpenEvidence chose full geographic withdrawal. In parallel, OpenEvidence is embroiled in high-stakes intellectual property litigation in US federal courts, having sued Doximity under the Defend Trade Secrets Act, Computer Fraud and Abuse Act, and DMCA for allegedly orchestrating prompt-injection attacks and deploying physician impersonators to extract proprietary model prompts."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR001"
  - id: "operational-and-clinical-accuracy-risks"
    title: "Operational Reliability, Clinical Accuracy, and Technical Governance"
    body: "Despite reporting perfect 100% scores on standardized multiple-choice exams like MedQA USMLE, independent academic and clinical evaluations indicate meaningful performance degradation when OpenEvidence encounters non-linear subspecialty cases. In a December 2025 pilot study on the MedXpertQA subspecialty dataset, the standard platform achieved only 34% accuracy on Quick Consult and 41% accuracy on Deep Consult, accompanied by evaluator-level repeatability variance of 77% and 72% respectively across identical clinical prompts. Clinicians in emergency medicine forums documented fundamental diagnostic inaccuracies, such as incorrectly stating that a standard chest X-ray could rule in or out pulmonary embolism. Furthermore, in prospective primary care evaluations, while OpenEvidence scored highly on clarity (3.55/4.0) and citation relevance (3.75/4.0), its measurable impact on altering clinical decision-making was rated 1.95/4.0, functioning primarily as an evidentiary confirmation tool rather than an active diagnostic driver. Operationally, the platform provides no contractual service-level agreements (SLAs) or guaranteed uptime for its free user tier, leading to documented service outages during active clinic hours that disrupted physician workflows. The platform maintains SOC 2 Type II certification and HIPAA compliance on Google Cloud Platform and Vercel infrastructure with AES-256 database encryption, but the absence of publicly disclosed institutional SLAs leaves clinical organizations without recourse during downtime."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-financial-and-execution-risks"
    title: "Commercial Model Conflicts, Dependencies, and Thesis-Break Triggers"
    body: "OpenEvidence's commercial model remains heavily concentrated in pharmaceutical and medical device digital advertising, monetizing the seconds of latency while clinical evidence is retrieved for NPI-verified physicians. While this Direct-to-Clinician model enabled rapid adoption to 1 million daily clinical consultations across more than 10,000 healthcare facilities, it introduces acute institutional friction. Academic medical centers and health system procurement bodies express deep ethical and clinical governance concerns regarding pharmaceutical ads displayed alongside therapeutic recommendations, raising ongoing scrutiny under FTC and FDA promotional boundaries. Furthermore, OpenEvidence relies on direct content licensing partnerships with elite publishers, including the New England Journal of Medicine, JAMA, NCCN, and Cochrane Library. If publisher partners escalate licensing fees or grant non-exclusive access to foundational LLM developers, OpenEvidence's evidentiary data moat could erode. Enterprise EHR integration represents another architectural vulnerability: while the platform has achieved Epic deployments at Mount Sinai, Sutter Health, and Cedars-Sinai, Epic's native AI initiatives with Microsoft and OpenAI create a distinct disintermediation threat. Key thesis-break triggers for investors include any FDA enforcement action classifying multi-agent clinical reasoning as SaMD, institutional ad-blocking across enterprise hospital networks, or the loss of core journal licensing agreements."
    claimRefs:
      - "CR012"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
