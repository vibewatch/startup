callouts:
  - calloutType: "risk"
    title: "The European AI Act Precedent and SaMD Creep"
    body: "OpenEvidence's complete withdrawal from the EU and UK in April 2026 illustrates the fragile regulatory foundation supporting point-of-care medical AI. While Section 520(o)(1)(E) of the US FD&C Act provides a safe harbor for clinical decision support that merely presents reference citations, advanced multi-agent architectures that cross-examine treatment options edge dangerously close to diagnostic automation. If US regulators harmonize with European risk-based oversight, OpenEvidence could face sudden operational paralysis or massive compliance overhead."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
