    title: "Diligence Verdict: Hold Position at Current Headline Valuation"
    body: "OpenEvidence exhibits extraordinary clinician traction with over 40% physician penetration and rapid top-line revenue expansion from $100M to roughly $300M run-rate. However, at a $12B valuation—and with reported contemplation of a $20B round—the company trades at roughly 40x to 120x revenue while relying heavily on pharmaceutical advertising rather than contracted enterprise SaaS. Investors should maintain a 'research-more' stance and require audited FY2025 financials, advertiser concentration disclosures, and verified non-ad ARR before considering growth equity participation."
