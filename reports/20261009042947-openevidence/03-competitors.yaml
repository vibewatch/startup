callouts:
  - calloutType: "risk"
    title: "EHR Disintermediation and Incumbent Platform Risk"
    body: "OpenEvidence's rapid adoption among U.S. physicians relies on standalone mobile and web usage, but long-term enterprise monetization depends upon deep integration within electronic health records like Epic. Epic's dominance across more than 40% of U.S. hospital beds and its proprietary Art for Clinicians initiative create a structural platform risk: Epic can embed native AI directly into charting and order workflows, potentially restricting third-party FHIR connectors or relegating OpenEvidence to an unintegrated external tab."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP015"
  - calloutType: "insight"
    title: "The Transatlantic Regulatory Divide in Clinical AI"
    body: "OpenEvidence's sudden withdrawal from the United Kingdom and European Union on April 27, 2026, highlights the divergence between U.S. and European healthcare AI governance. While U.S. clinicians have adopted OpenEvidence at scale without software-as-a-medical-device premarket certification, the European Union AI Act and UK MHRA frameworks treat point-of-care decision support with acute regulatory scrutiny, ceding European clinical demand to localized competitors like iatroX and BMJ Best Practice."
    claimRefs:
      - "CP013"
      - "CP014"
