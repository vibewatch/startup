company:
  name: "OpenEvidence"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "OpenEvidence delivers an evidence-grounded clinical AI decision support system and workflow suite powered by hybrid cloud infrastructure on Google Cloud Platform and Vercel. Its technical architecture integrates multimodal language models with verified peer-reviewed medical publications, though granular model routing, parameter scale, and unassisted diagnostic modifications remain proprietary or unproven."
sections:
  - id: "clinical-product-workflow"
    title: "Clinical Decision Support and Workflow Product Line"
    body: "OpenEvidence structures its clinical offering around point-of-care medical search, consultation, and operational communication for verified healthcare professionals. The core clinical consultation interface allows NPI-verified physicians to query complex clinical dilemmas, retrieving synthesized answers grounded directly in peer-reviewed medical literature. To capture clinician interactions across routine patient encounters, the company expanded its surface from standalone query retrieval into conversational and telephony workflows. This includes the Visits ambient scribe feature, designed to transcribe patient encounters into structured documentation, and an AI-integrated doctor dialer that incorporates calling, messaging, and straight-to-voicemail capabilities. By embedding clinical guidance directly into notes generated from telehealth and telephone encounters, OpenEvidence aims to unify real-time decision support with documentation."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-operating-model"
    title: "Hybrid Operating Architecture, Infrastructure, and Model Modalities"
    body: "The platform's technical stack relies on a hybrid infrastructure model designed to bridge high-throughput frontend demand with computationally intensive biomedical reasoning. Frontend routing and user session delivery are deployed on Vercel utilizing Next.js and Fluid compute, whereas backend data ingestion, core business logic, and model orchestration execute on Google Cloud Platform. At the model layer, OpenEvidence publicizes a suite of branded answering modes including Osler, Sackett, Snow, and a research preview designated Darwin. While commercial partnerships with technology providers such as Anthropic supply underlying foundational model capabilities, the exact parameter counts, base model versions, and internal routing logic across specific products remain undisclosed. The primary technical differentiation centers on constrained retrieval-augmented generation across licensed authoritative corpuses rather than ungrounded parameter recall."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "evidence-differentiation-governance"
    title: "Content Licensing Differentiation, Security, and Governance Limits"
    body: "OpenEvidence differentiates its clinical outputs from general-purpose consumer chatbots by restricting search retrieval to vetted medical sources, establishing formal publishing partnerships with the New England Journal of Medicine, JAMA Network, Cochrane Systematic Reviews, and the National Comprehensive Cancer Network. On the compliance and security front, the organization maintains HIPAA compliance and has achieved SOC 2 Type II certification for the Security trust services category, implementing AES-256 data encryption at rest and TLS 1.2 in transit. Despite these controls, peer-reviewed clinical evaluations indicate that OpenEvidence functions primarily to reinforce existing physician treatment plans rather than steer clinical decision-making. Significant governance gaps persist regarding external audit trails for hallucination logs, independent clinical error rates, and the lack of a standardized public API for third-party developer integration."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
callouts:
  - calloutType: "insight"
    title: "Content Moat Precedes Parametric Distinction"
    body: "OpenEvidence's core technological defensibility derives from its exclusive content licensing partnerships with top medical publishers (NEJM, JAMA, Cochrane) and NPI-gated workflow access, rather than proprietary base LLM architectures or independent foundational model training."
    claimRefs:
      - "CE007"
      - "CE010"
  - calloutType: "risk"
    title: "Opaque Foundation Model Lineage and Routing"
    body: "Public product branding around Osler, Sackett, and Snow obscures underlying foundational dependencies; independent technical reviews confirm that neither parameter scale, base model versions, nor exact provider allocation across answering modes have been disclosed."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE014"
