callouts:
  - calloutType: "insight"
    title: "The Bypassed Procurement Paradox"
    body: "OpenEvidence achieved unprecedented point-of-care clinical velocity by treating doctors as consumers, offering free access to bypass multi-quarter hospital IT committees. However, this consumer-style adoption creates a financial paradox: while digital pharma advertising generates rapid top-line scaling, enterprise hospital systems currently pay zero software subscription fees. Converting high daily utilization into enterprise-grade software ARR will require proving institutional ROI and overcoming administrative inertia."
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI009"
  - calloutType: "risk"
    title: "Sponsorship Independence and Prior-Shifting Scrutiny"
    body: "Although OpenEvidence maintains that its medical answer generation architecture is strictly walled off from its advertising delivery engine, independent clinical researchers have raised concerns regarding cognitive 'prior-shifting.' If physicians viewing targeted pharmaceutical promotions unconsciously adapt subsequent prescribing habits, regulatory authorities or clinical societies could impose marketing restrictions that would directly impair the company's core monetization model."
    claimRefs:
      - "CI003"
      - "CI015"
      - "CI016"
