company:
  name: "OpenEvidence"
chapter:
  number: 4
  title: "Financials"
  summary: "OpenEvidence scaled annualized revenue from $7.9M in late 2024 to $150M by year-end 2025 and an estimated $300M in mid-2026, driven primarily by sponsored pharmaceutical and medical device advertising at CPMs reaching $1,000+ across verified clinical workflows. Despite reported 90% ad gross margins and $700M in venture backing, institutional enterprise software ARR remains negligible, leaving forward underwriting dependent on sustaining high-CPM advertiser demand without compromising clinical trust."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Monetization Streams, High-CPM Sponsorships, and Enterprise Licensing"
    body: "OpenEvidence operates a predominantly ad-supported monetization architecture that pairs frictionless free access for NPI-verified clinicians with premium pharmaceutical and medical device sponsorships. By deliberately bypassing traditional health system procurement cycles, the company allows individual clinicians to query its platform at no charge, building a verified prescriber base of over 757,000 physicians across 10,000 medical centers. Advertisers pay premium CPMs ranging between $70 and upwards of $1,000 to display non-intrusive promotional placements and video units during the seconds required for the system to generate evidence-grounded answers. In addition to core pharmaceutical sponsorships, OpenEvidence introduced continuing medical education (CME) credit partnerships in April 2025 to capture medical accreditation and sponsorship budgets. While the company has announced enterprise integrations with hospital networks including Sutter Health, Mount Sinai, Cedars-Sinai, and NewYork-Presbyterian, these deployments currently utilize the core ad-supported service. Management has disclosed plans to pioneer a dedicated non-ad-supported enterprise subscription tier—mirroring private foundation-model enterprise software tiers—but realized software ARR from hospital IT budgets remains nascent."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "cost-structure-and-gtm"
    title: "Gross Margin Drivers, Inference Economics, and Organic Go-To-Market"
    body: "The platform's reported unit economics reflect the financial divergence between high-margin digital advertising inventory and variable generative AI inference costs. Third-party analyses and company disclosures report gross margins near 90% on the core digital advertising business, driven by high realized CPMs against a sold inventory rate estimated at approximately 5%. Infrastructure costs consist of compute and hosting services primarily delivered via Google Cloud Platform and Vercel, paired with licensed content royalties paid to medical publishers including the Massachusetts Medical Society (NEJM Group) and the American Medical Association (JAMA Network). On the distribution side, customer acquisition costs for clinicians are near zero; CEO Daniel Nadler stated that 95% of new users join through physician-to-physician word-of-mouth rather than paid marketing campaigns. However, converting bottom-up organic clinician utilization into recurring institutional enterprise revenue requires navigating hospital IT review boards, responsible AI committees, and EHR integration protocols, which introduces traditional enterprise enterprise sales overhead."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy, Cash Runway, and Underwriting Dilemmas"
    body: "With approximately $700 million in aggregate institutional venture capital raised across four rounds between February 2025 and January 2026—culminating in a $250 million Series D at a $12 billion valuation—OpenEvidence maintains substantial capital adequacy. Reported cash reserves provide multi-year runway, supported by positive contribution margins in the core digital advertising segment. Leadership has stated an intention to avoid burning billions of dollars on foundation-model training, focusing computational resources on domain-specific medical fine-tuning and retrieval-augmented generation. Nonetheless, from an underwriting perspective, the company's valuation multiple (implying 40x to 50x annualized revenue of $300M, or 80x to 120x FY2025 revenue) bakes in rapid TAM expansion into the broader $20B to $25B U.S. digital pharma ad market and commercial life sciences intelligence. The primary underwriting risks center on potential regulatory restrictions on point-of-care pharmaceutical marketing, institutional physician scrutiny regarding advertiser influence on clinical cognition, and the absence of audited disclosure separating ad revenue from software contract ARR."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
