evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Complete executive roster, board composition, founder voting control, succession coverage, and material leadership
      changes.
    whyItMatters: >-
      The public narrative is founder-centric, so governance and continuity risk cannot be assessed from biographies
      alone.
    diligencePath: >-
      Request the current board deck, charter documents, voting agreement, executive organization chart, and succession
      plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited revenue, ARR if tracked, advertiser concentration, enterprise customer count, active clinician cohorts,
      headcount, locations, gross margin, and cash runway.
    whyItMatters: >-
      Company-reported annualized revenue and usage cannot establish revenue quality, customer durability, operating
      leverage, or cash availability.
    diligencePath: >-
      Request audited financials, revenue recognition schedules, advertiser and enterprise cohorts, payroll records,
      office leases, and the latest cash forecast.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      Fully diluted cap table, primary versus secondary round allocations, debt or credit facilities, liquidation
      preferences, and investor governance rights.
    whyItMatters: >-
      Reported financing amounts and valuations do not reveal ownership, preference overhang, control, or cash available
      to the company.
    diligencePath: >-
      Obtain closing sets for every financing, the current cap table, debt schedule, option ledger, and investor rights
      agreements.
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: independent-company-profile
    missingEvidence: >-
      The assigned Contrary Research profile returned only a privacy-policy banner and could not support any retained
      claim.
    whyItMatters: An additional independent company history could corroborate leadership, financing, and operating milestones.
    diligencePath: Review the same profile through an authorized readable channel in a future research run.
  - type: private-evidence-only
    severity: material
    topic: revenue-breakdown
    missingEvidence: >-
      Audited financial disclosure detailing FY2025 and 2026 revenue contribution split between pharmaceutical digital
      advertising and enterprise health system software contracts.
    whyItMatters: >-
      Determines whether OpenEvidence is fundamentally a specialized digital advertising network or an enterprise
      clinical software provider with recurring software margins.
    diligencePath: Request audited revenue ledgers and customer concentration schedules from company management or lead investors.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: regulatory-re-entry
    missingEvidence: >-
      Formal regulatory documentation or European CE-mark / UKCA medical device certification roadmap outlining planned
      re-entry into UK and European healthcare markets.
    whyItMatters: >-
      Quantifies the durability of international geographic market boundaries and whether European clinical AI search
      competitors enjoy protected regional moats.
    diligencePath: Review MHRA and European notified body device classification submissions and interviews with regulatory counsel.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-pricing
    missingEvidence: >-
      Audited contracted annual recurring revenue, per-seat licensing rates, and renewal terms for OpenEvidence's
      enterprise health system deployments at Mount Sinai and Cedars-Sinai.
    whyItMatters: >-
      Validating whether OpenEvidence can transition from ad-supported free access to a defensible, multi-million-dollar
      enterprise SaaS model is essential to underwriting its $12B valuation.
    diligencePath: >-
      Request blinded health system master service agreements, enterprise renewal cohorts, and per-seat fee schedules
      during commercial diligence.
    relatedQuestionRefs:
      - QP007
  - id: gap-clinical-accuracy-benchmarks
    type: missing-source
    severity: material
    topic: clinical-benchmarks
    missingEvidence: >-
      Standardized, independent head-to-head clinical accuracy and hallucination benchmark comparisons between
      OpenEvidence, UpToDate Expert AI, and specialized reasoning models.
    whyItMatters: >-
      Without independent benchmark evaluations on complex multi-morbidity cases, claims of diagnostic superiority rely
      primarily on marketing claims rather than empirical evidence.
    diligencePath: >-
      Commission independent clinical evaluation panels to evaluate randomized diagnostic vignettes across diagnostic
      accuracy, citation correctness, and hallucination rates.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: enterprise-arr
    missingEvidence: >-
      Audited breakdown of realized annual recurring revenue (ARR) from hospital enterprise software contracts versus
      advertising revenues.
    whyItMatters: >-
      Underwriting long-term software multiples requires proving that hospital systems will transition from free
      ad-supported usage to recurring IT software contracts.
    diligencePath: >-
      Request management's FY2025 and 1H 2026 GAAP revenue schedules, segmenting software contract ARR from ad network
      billing.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: developer-api-availability
    missingEvidence: >-
      Publicly accessible self-service API specifications, programmatic developer documentation, and published pricing
      for external EHR developers.
    whyItMatters: >-
      Without an open programmatic developer API, third-party hospital integration requires custom bilateral enterprise
      deals rather than modular platform extension.
    diligencePath: Request developer API terms, partner SDK documentation, and endpoint SLAs during enterprise management diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: clinical-hallucination-logs
    missingEvidence: >-
      Audited incident logs and quantitative prospective clinical error rates in specialized or rare multi-morbid
      pathology.
    whyItMatters: >-
      Retrospective primary care studies show high satisfaction for routine chronic care, but cannot prove diagnostic
      safety in complex edge cases.
    diligencePath: >-
      Review internal clinical quality assurance incident logs, medical director escalation records, and prospective
      clinical trial telemetry.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort-level NRR, GRR, churn, renewal, contract-duration, active-seat, and paid-conversion data by clinician
      specialty and health-system deployment.
    whyItMatters: >-
      Large registration and query volumes do not establish durable usage, recurring enterprise value, or renewal
      quality.
    diligencePath: >-
      Request monthly user cohorts, health-system renewal schedules, contract durations, seat activation, and gross and
      net retention reconciled to invoices.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue and gross-profit concentration by advertiser, health system, content partner, and monetization stream,
      including renewal and cancellation history.
    whyItMatters: >-
      The free-access model may convert clinician attention into economics through a small number of counterparties
      whose durability is not visible publicly.
    diligencePath: >-
      Obtain customer and advertiser concentration schedules, renewal cohorts, pipeline conversion, and content-license
      economics for the last eight quarters.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster of paying production deployments with contract status, implementation date, active users,
      measured outcomes, and renewal state.
    whyItMatters: >-
      Public examples span integrations, partnerships, and evaluations but cannot establish how many named organizations
      are paying and renewed production customers.
    diligencePath: >-
      Reconcile the CRM and billing roster to signed contracts, implementation logs, monthly active users, outcome
      studies, and customer-reference interviews.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP financial statements for FY2025 and 1H2026 breaking down revenue between pharmaceutical advertising
      and enterprise software subscriptions, alongside gross margins and cash burn.
    whyItMatters: >-
      A $12B to $20B valuation depends critically on whether revenue represents high-margin recurring software ARR or
      cyclical, non-contracted advertising spend.
    diligencePath: >-
      Request audited financial statements, CPM renewal cohort analytics, and pharmaceutical advertiser concentration
      data during formal management diligence.
    relatedQuestionRefs:
      - QV002
      - QV004
  - type: missing-source
    severity: material
    topic: cap-table-preferences
    missingEvidence: >-
      Detailed capitalization table disclosing liquidation preferences, senior debt tranches, and participation rights
      across Series A through D preferred shares.
    whyItMatters: >-
      With $700M raised across rapid successive rounds, senior liquidation preferences could significantly compress
      common equity and late-round return profiles under downside or acquisition exit scenarios.
    diligencePath: >-
      Review certificate of incorporation and investor rights agreements in the virtual data room to model distribution
      waterfalls under sub-$12B exit outcomes.
    relatedQuestionRefs:
      - QV001
      - QV009
