callouts:
  - calloutType: "insight"
    title: "Multi-Sided Monetization Shifts the Economic Burden"
    body: "By capturing clinician engagement through a zero-cost, consumer-grade search tool, OpenEvidence bypasses hospital IT procurement delays and monetizes prescriber attention through high-margin pharmaceutical advertising. This decoupled structure decouples adoption velocity from health system procurement budgets, though it exposes long-term enterprise valuation to advertiser renewal cohorts and physician tolerance for sponsored messaging."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM004"
