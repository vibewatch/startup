company:
  name: "OpenEvidence"
chapter:
  number: 1
  title: "Company Overview"
  summary: "OpenEvidence is a medical AI company founded in 2022 and currently reported as headquartered in Miami. Its free, advertising-supported clinician product has scaled rapidly alongside roughly $700 million of financing, culminating in a January 2026 $250 million round at a reported $12 billion valuation, but governance, headcount, customer, and audited financial disclosures remain limited."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      OpenEvidence was founded in 2022 by Daniel Nadler and Zachary Ziegler and
      describes its product as an AI copilot that helps doctors make point-of-care
      clinical decisions. CNBC and the current Wikipedia record place the company
      in Miami, while a 2026 review abstract labels OpenEvidence Inc. as Cambridge,
      Massachusetts; the retained evidence does not establish whether that reflects
      a former office, legal domicile, or stale descriptor. The product is free to
      eligible healthcare professionals, and CNBC reports that advertising,
      including in-app video promotions, is the principal disclosed monetization
      engine. That distribution model lowers adoption friction but makes reported
      clinician reach different from contracted enterprise customer count.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The two publicly identified founders bring complementary company-building
      and machine-learning credentials. Nadler previously built Kensho, which S&P
      Global acquired for about $700 million in 2018, while Ziegler is described
      as a Harvard AI researcher or doctoral student. The official team page lists
      a deep technical and clinical bench, but the assigned evidence does not
      provide a complete executive roster, board composition, voting arrangements,
      or succession plan. Investor commentary is unusually founder-centric and a
      GV representative said they joined the board after GV led the Series B.
      Accordingly, founder-market fit appears strong, but the degree of decision
      concentration around Nadler remains a diligence question rather than a
      quantified governance conclusion.
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capital-and-scale"
    title: "Capitalization and Reported Scale"
    body: >-
      Financing accelerated sharply during 2025 and early 2026. Publicly reported
      rounds progressed from a $75 million financing at a $1 billion valuation in
      February 2025 to $210 million at $3.5 billion in July and $200 million at
      $6 billion in October. In January 2026, CNBC reported a further $250 million
      round led by Thrive Capital and DST at a $12 billion valuation, bringing
      reported capital raised to about $700 million in less than a year. Funding
      raised is not cash available: the evidence does not disclose secondary
      components, debt, preference terms, cash use, or current runway. Likewise,
      the reported $100 million-plus 2025 annualized revenue figure is neither
      audited revenue nor ARR.
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "milestones-and-evidence-quality"
    title: "Milestones and Evidence Quality"
    body: >-
      OpenEvidence launched in 2023 after participating in the Mayo Clinic Platform
      ecosystem and has since assembled content relationships spanning NEJM, JAMA,
      NCCN, Nature, Cochrane, and Wiley, plus a reported Cedars-Sinai integration.
      The company says more than 40% of U.S. physicians use the product and its
      about page reports more than 200 million clinical consultations, but these
      are company-originated scale measures without an independently audited
      denominator or cohort definition. External clinical evidence remains early:
      a five-case retrospective study found high clarity and relevance but limited
      impact on changing physician decisions, and both that study and a separate
      review call for human judgment or broader prospective evaluation. The
      milestones therefore demonstrate rapid distribution, not proven patient
      outcomes.
    claimRefs:
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
