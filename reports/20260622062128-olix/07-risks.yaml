  - id: governance-people-and-kill-criteria
    title: Governance, people, and thesis-break kill criteria
    body: >
      The governance risk centres on a single person: James Dacombe, age 25 at the time of the February 2026
      financing, is the sole continuously serving director since incorporation and the public face of Olix's
      entire strategy. Press coverage and company materials position Dacombe as both the intellectual architect
      of the photonic thesis and the chief executive responsible for execution. No public evidence of a
      co-founder, CTO, or COO with prior AI chip product delivery experience has been disclosed. The board
      includes experienced operators — Jonathan Heiliger (former Facebook infrastructure), Nicholas McKeown
      (Stanford networking professor), and Taavet Hinrikus (Transferwise co-founder and investor) — but board
      oversight does not substitute for a deep-tech operating team. Olix's own culture materials acknowledge
      the extraordinary demands of the build: the 18-week paid exit clause for mismatched hires signals the
      company is aware that talent fit and retention are fragile.


      Photonic and compound-semiconductor engineers are among the scarcest specialists globally. The company's
      own hiring pages show roles across optics, photonic packaging, FPGA, ASIC, manufacturing operations, and
      process integration — a hiring agenda that requires recruiting from a very thin talent pool. The UKtech.news
      and IDCNova reports on the February 2026 round flag the company's ambition to grow from 70 to 200-plus
      employees, meaning Olix must nearly triple headcount in a competitive labour market before it ships its
      first product.


      Thesis-break kill criteria are identifiable from the risk register: (a) failure to demonstrate a silicon
      photonic tapeout with acceptable photonic yield by end of 2026 would push first shipment beyond 2027
      and into the capital runway danger zone; (b) failure to secure a first named hyperscaler design-in by
      mid-2027 would indicate the DX-1 is not clearing enterprise procurement hurdles; (c) a BIS enforcement
      action or NSI Act blocking order that prevents a key supply chain transaction or acquisition exit would
      be structurally disqualifying; (d) a 40-percent or greater drawdown in AI infrastructure CapEx announced
      by any two of the top three hyperscalers would erode the demand thesis underpinning Olix's 2027 timeline.
      Investors should require Olix to disclose tapeout status and foundry partner contractually before the
      next funding event.
