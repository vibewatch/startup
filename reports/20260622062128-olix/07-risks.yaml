company:
  name: Olix
chapter:
  number: 7
  title: Risks
  summary: >
    Olix carries an unusually dense risk stack for a pre-revenue UK deep-tech startup: photonic co-packaged-optics
    manufacturing yield remains an industry-wide unsolved problem (Siemens CPO analysis identifies test scalability and
    micron-scale alignment as primary bottlenecks); the US BIS extended its Authorized IC Designer compliance timeline
    only until 31 December 2026 while tightening advanced-computing export-control enforcement that could constrain
    Olix's addressable market; the UK National Security and Investment Act 2021 introduces acquisition-review risk for
    a company with strategic-technology IP; the company has a sole founder-CEO with no prior semiconductor-company
    operating experience; and the $220 million raised at a $1 billion-plus valuation must sustain a multi-year
    pre-revenue build-out with no disclosed commercial milestones. The aggregate risk profile is high, with
    manufacturing execution and capital-markets timing as the two most likely thesis-break vectors.

sections:
  - id: technical-and-manufacturing-risks
    title: Technical and manufacturing risks
    body: >
      Olix's photonic inference chip programme centres on co-packaged optics (CPO) — a technology that industry
      sources widely classify as early-stage and high-risk in manufacturing. Siemens EDA's February 2026 CPO
      analysis identifies four compounding challenges: thermal management (photonic ICs are highly
      temperature-sensitive; transient thermal excursions from AI workloads can shift optical wavelengths and
      degrade modulator efficiency); test scalability (optical alignment requires micron-scale precision, far
      tighter than electrical test, making automated production-scale testing a primary bottleneck); supply-chain
      immaturity (silicon photonics manufacturing exhibits higher process variability than mature CMOS, while
      yield excursions in co-packaged assemblies have an outsized cost impact because rework is practically
      impossible after co-packaging); and standards fragmentation (CPO interoperability standards are still
      maturing through OIF and similar bodies, meaning early products face integration friction with customer
      rack architectures). An adverse industry report published by EdgeN in 2026 states that CPO mass production
      faces delays beyond 2026 specifically because of yield issues, validating the Siemens risk assessment.


      Against this background, Olix has disclosed no silicon tapeout results, no yield data, and no system-level
      demonstration. Its stated 2027 first-shipment milestone requires completing a full silicon photonics tapeout
      at a foundry partner (likely TSMC Specialty Technology), co-packaging qualification with an OSAT, software
      stack integration, and hyperscaler qualification — all within approximately twelve months as of the June 2026
      run date. TSMC's foundry technology pages confirm silicon photonics is offered as a specialty process, but
      the company has not disclosed photonic yield roadmaps publicly. ASML, whose EUV lithography systems underpin
      advanced semiconductor manufacturing globally, represents an upstream dependency common to all advanced
      foundry nodes. Power delivery is a secondary technical risk: Siemens notes that by 2027, AI data-centre
      power demand is expected to grow 50 percent globally, and approximately 60 percent of data-centre energy
      goes to data movement rather than compute — the very problem CPO is meant to solve but which also drives
      extreme thermal requirements on the Olix rack-scale design.
