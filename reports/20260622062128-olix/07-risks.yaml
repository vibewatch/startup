callouts:
  - calloutType: risk
    title: "Manufacturing yield: primary thesis-break risk"
    body: >
      CPO mass production has been delayed past 2026 industry-wide due to yield issues. Olix has not disclosed
      any silicon tapeout result or photonic yield target, making the 2027 first-shipment commitment entirely
      dependent on unverified manufacturing assumptions. This is the single highest-priority diligence ask for
      any investor entering the next round.
    claimRefs:
      - CR001
      - CR008
      - CR009

  - calloutType: risk
    title: "Key-person concentration: Dacombe as sole director and CEO"
    body: >
      James Dacombe has been the sole continuously serving director since Olix's March 2024 incorporation and is
      the only publicly identified executive. No co-founder with semiconductor delivery experience, no disclosed
      CTO appointment, and no disclosed succession plan represent a governance gap that is material for a
      $1 billion-plus-valued deep-tech startup.
    claimRefs:
      - CR030
      - CR031
      - CR037

  - calloutType: recommendation
    title: "Pre-investment: require tapeout status and BIS compliance disclosure"
    body: >
      Before committing to a next financing round, investors should require: (1) tapeout results or a firm
      timeline with foundry contract, (2) BIS Authorized IC Designer application status, (3) NSI Act legal
      opinion, (4) disclosure of the CTO and lead silicon architect, and (5) a named hyperscaler evaluation
      agreement or letter of intent.
    claimRefs:
      - CR011
      - CR012
      - CR031
      - CR038

