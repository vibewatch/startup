    - CO008
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: 'Olix is developing the DX-1 / OTPU platform, an inference-focused accelerator system built on SRAM-centric memory architecture integrated with photonics. Public materials frame the design as a rack-scale, cross-layer system spanning logic, data movement, optics, packaging, and serving software integrations for frameworks such as vLLM, SGLang, and NVIDIA Dynamo.

    '
