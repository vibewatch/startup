      freshness: current
      answersQuestionRefs: [QE001, QE025]

    - id: CE002
      statement: Olix's design thesis is to scale an SRAM-centric memory architecture integrated with photonics, explicitly avoiding dependence on High Bandwidth Memory (HBM).
      type: company-claimed
      topic: SRAM photonics thesis
      sourceRefs: [SE001, SE012]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE003, QE022]

