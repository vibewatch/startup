  - id: software-stack-and-developer-integration
    title: Software stack compatibility and developer integration
    body: >
      Olix's platform integration hiring confirms that the software layer for
      DX-1 is designed to plug into the dominant open-source inference stack
      rather than require a proprietary runtime. The Senior Platform Integration
      Engineer specification names vLLM, SGLang, and NVIDIA Dynamo as the
      target serving frameworks, with the expectation that engineers will extend
      these onto the DX-1 hardware. KV-cache management is addressed through
      NIXL and Mooncake TE, two emerging protocols for disaggregated prefill
      and decode that enable the separation of prefill compute from decode
      compute across different hardware partitions. Networking targets NCCL,
      RoCE, and InfiniBand for cluster communication, which implies DX-1 is
      designed to operate alongside existing GPU- or CPU-based prefill nodes
      in a heterogeneous cluster rather than as a fully self-contained system.

      This software strategy is technically sound: vLLM is one of the
      most active open-source inference projects with over 2,000 contributors
      across academic institutions and companies, and SGLang achieved a 3.8×
      prefill and 4.8× decode throughput improvement on NVIDIA GB300 NVL72 in
      early 2026, demonstrating rapid iteration capacity. Both frameworks
      expose hardware plugin architectures; Intel Gaudi, IBM Spyre, and
      Huawei Ascend are examples of non-NVIDIA hardware that has been integrated
      into vLLM. This gives Olix a credible integration path — but it requires
      custom kernel development, HAL-layer work, and continuous upstream
      maintenance as these frameworks evolve on GPU-first timelines.

      The critical gap is that Olix has no publicly documented open-source
      contributions to vLLM, SGLang, or related frameworks as of June 2026,
      and DX-1 is pre-silicon, meaning no hardware-in-the-loop validation of
      the software integration has occurred yet. The developer-community signal
      for Olix is therefore indirect: the frameworks it targets are vibrant and
      accessible, but Olix has yet to establish a presence in those communities
      as a hardware vendor with validated drivers or publicly available
      benchmarks.
    claimRefs:
