  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: DX-1 silicon tape-out and manufacturing partners
      missingEvidence: >
        Name of silicon photonics foundry, SRAM process node, CPO assembly OSAT,
        and laser source supplier; tape-out date; engineering samples timeline.
      whyItMatters: >
        Without disclosed manufacturing partners, no independent assessment
        of yield risk, capacity risk, or supply-chain concentration is possible.
        The entire DX-1 execution timeline depends on these undisclosed agreements.
      diligencePath: >
        Request NDA-covered manufacturing partnership disclosures during due
        diligence; cross-check against known silicon photonics foundry capacity
        at TSMC, GlobalFoundries, or IME Singapore.
      relatedQuestionRefs: [QE004, QE017]

    - type: missing-source
      severity: material
      topic: independent benchmark validation
      missingEvidence: >
        Third-party performance benchmarks, silicon characterisation data,
        or independent power measurements for any Olix prototype or simulation.
      whyItMatters: >
        All performance claims originate from the company or secondary
        interpretations of marketing; no independent validation exists.
        High-confidence investment judgement cannot be made without at least
        simulation or prototype data from a credible neutral party.
      diligencePath: >
        Request access to FPGA prototype benchmark data; commission independent
        architectural review by a photonics or semiconductor consultant.
      relatedQuestionRefs: [QE020]

    - type: missing-source
      severity: material
      topic: quality management and reliability certification
      missingEvidence: >
        ISO 9001, JEDEC, IEC, or equivalent quality management certifications;
        any internal reliability test methodology documentation.
      whyItMatters: >
        Data-centre hardware requires demonstrated reliability qualification
        before customer adoption; absence of any quality framework at this
        stage makes timeline to first production deployment opaque.
      diligencePath: >
        Ask for internal quality plan, HTOL or thermal cycling test protocols,
        and any MIL-STD or IEC standards the design targets.
      relatedQuestionRefs: [QE021]

    - type: missing-source
      severity: material
      topic: export control classification and licensing
      missingEvidence: >
        Specific EAR classification (ECCN) for Olix's photonic chip technology;
