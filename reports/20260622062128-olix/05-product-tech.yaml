callouts:
  - calloutType: strength
    title: Rack-scale co-design is architecturally distinctive
    body: >
      Olix's decision to co-design compute, memory, interconnect, and optics
      at the rack scale rather than optimising individual components within
      the existing GPU packaging paradigm is technically coherent as a response
      to the HBM memory wall. The architecture avoids the supply-chain
      constraints of HBM, bypasses the interposer bottleneck, and targets the
      decode phase specifically — the heaviest workload in modern LLM serving.
      If executed, this is a genuinely different approach from silicon-only SRAM
      startups or interconnect-layer photonics companies.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE040

  - calloutType: risk
    title: Pre-silicon CPO startup faces compounded execution risk
    body: >
      Olix must simultaneously: develop a novel silicon photonics die with
      sufficient SRAM capacity; qualify CPO assembly with an undisclosed OSAT
      partner in a manufacturing environment where yield issues are already
      delaying CPO mass production industry-wide; integrate with open-source
      serving frameworks that move on GPU-first timelines; and navigate US
      export controls that constrain both talent and customer pools. Each of
      these is a material challenge independently; the combination creates
      a high-risk execution profile that is common to photonic chip startups
      but rarely navigated successfully at speed.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
