    custom silicon orders is the most credible public signal on buyer readiness for photonic inference
    chips. Olix''s sales thesis depends on buyers recognising photonics as a necessity before incumbents
    deliver the same architectural capability in a more familiar package.

    '
  claimRefs:
  - CU023
  - CU024
  - CU029
  - CU038
- calloutType: insight
  title: Inference-as-a-service tier may offer faster first revenue path
  body: 'Inference cloud providers (CoreWeave, Lambda Labs) operate procurement cycles materially shorter
    than Tier-1 hyperscaler silicon qualification programmes. CoreWeave''s MLPerf v5.0 participation and
    Lambda''s on-demand GPU fleet confirm active hardware investment appetite. These buyers price on a
    per-token basis, creating a direct incentive to adopt lower-cost silicon once benchmarks are validated.
    Olix''s first production revenue may come from this tier rather than directly from a Tier-1 hyperscaler,
    making inference-cloud relationships an important early commercial milestone to track.

    '
  claimRefs:
  - CU002
  - CU003
  - CU010
