  title: Zero customer proof is a blocking diligence gap
  body: 'Olix''s customer count and logos are undisclosed and, as of June 2026, genuinely zero at a publicly
    verifiable level. This is structurally appropriate for a pre-silicon company but means that any commercial
    investment thesis rests entirely on technology potential and team credibility. The 2027 shipment target
    must be treated as a management forecast, not a contracted commitment. Continued absence of customer
    signals into Q3 2027 would be a material de-rating event.

    '
