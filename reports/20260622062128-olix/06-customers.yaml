  title: Customer journey map — hyperscaler adoption of a novel AI inference chip
  type: journey-map
  layout: wide
  summary: 'Stages a hyperscaler buyer traverses from initial awareness of a novel inference accelerator
    to production deployment, with Olix''s current position mapped at the pre-silicon evaluation gate.

    '
  data:
    nodes:
    - label: Awareness / mandate
      detail: 'Hyperscaler infrastructure team identifies throughput-per-watt gap in existing GPU fleet;
        internal team or external analyst flags photonic inference as emerging architectural option.

        '
    - label: Vendor evaluation
      detail: 'Request for information sent to candidate accelerator vendors; competitive benchmarking
        with NVIDIA, AWS Inferentia, Google TPU, and Groq as incumbent reference points.

        '
    - label: Prototype & integration
      detail: 'Pre-production silicon evaluated in-house; software integration into vLLM / SGLang inference
        stack built and validated; reliability and thermal characterisation completed.

        '
    - label: Silicon qualification
      detail: '12–24 month supply-chain audit, yield validation, reliability testing, and procurement
        negotiation; formal quality gate before purchase order.

        '
    - label: Production deployment
      detail: 'First production purchase order and rack-scale deployment; performance SLOs, cost-per-token
        benchmarks, and operational metrics tracked; expansion or churn decision after 6–12 months.

        '
    - label: Olix current position (June 2026)
      detail: Pre-silicon; FPGA prototype stage; no formal hyperscaler engagement disclosed
    - label: Key blocker at evaluation stage
      detail: No MLPerf results; no benchmark data; no vLLM upstream integration confirmed
    - label: Key blocker at prototype stage
      detail: First silicon tape-out not yet completed; CPO yield and thermal risk unresolved
    - label: Key blocker at qualification stage
      detail: 'Broadcom CEO: photonics not anytime soon — buyer readiness is the gate, not just product
        readiness'
    - label: Expansion trigger at production
      detail: Second customer win required within 12 months to avoid concentration risk
