chapter:
  number: 6
  title: Customers
  summary: 'No production customers have been publicly named or counted by Olix as of June 2026, consistent
    with a pre-silicon company targeting a 2027 first shipment milestone. Evidence assembled from Olix''s
    compute manifesto, job specifications, and external coverage identifies hyperscalers and inference-as-a-service
    cloud providers as the primary target buyer segment, with inference-optimised software stacks (vLLM,
    SGLang, NVIDIA Dynamo) as the integration surface that must be cleared before any commercial deployment.
    The key barrier is structural: hyperscalers run silicon qualification cycles of 12–24 months, Broadcom''s
    CEO publicly signalled that photonics will not matter in the datacentre "anytime soon," and no customer-proof
    artefacts exist in the public domain for Olix. The chapter treats these absences as evidence gaps
    and maps the buyer qualification hurdles, adoption path, and concentration risk that must be managed
    to turn the 2027 target into real revenue.

    '
sections:
- id: target-buyer-segments
  title: Target buyer segments and market positioning
  body: 'Olix''s public materials do not name a single customer, but the company''s compute manifesto
    and hiring specifications consistently point toward a narrow, capital-intensive buyer universe. The
    manifesto frames the problem as one that "even the most dominant players, with full-stack control
    across silicon, software, and supply chains, are unable to solve." That framing identifies large-scale
    hyperscaler and cloud operators — the only organisations that own silicon, software, and supply chains
    at the required scale — as the audience Olix is addressing, and by implication the initial target
    buyer. The platform integration engineer job description makes this explicit, stating that the role
    is "the technical authority on how OLIX serves large models as hyperscale AI infrastructure."

    Three buyer tiers are visible from the evidence. First, Tier-1 hyperscalers (Google, Microsoft, Amazon,
    Meta) who operate their own inference fleets at billions-of-tokens-per-day scale and have both the
    technical depth to evaluate novel silicon and the capital to absorb a multi-year qualification programme.
    Broadcom''s Q4 FY2025 earnings disclosed more than $50 billion in custom AI accelerator orders backlogged
    from hyperscale customers, illustrating the infrastructure capital intensity of this buyer class.
    Second, inference-as-a-service cloud providers — CoreWeave, Lambda Labs, and similar — who purchase
    GPU and accelerator capacity to resell as API endpoints. These buyers are structurally incentivised
    to adopt lower-cost-per-token alternatives if they can be qualified, because their business model
    is priced on a per-token basis. Groq''s $750 million September 2025 financing at a $6.9 billion valuation,
    achieved while serving more than two million developers on a proprietary LPU architecture, demonstrates
    that a dedicated cloud inference provider can scale quickly once hardware is in production. Third,
    enterprise private cloud operators who run large-model inference workloads on-premises but represent
    a longer procurement cycle and smaller first-order cheque than hyperscalers.

    Olix''s decision to avoid QAT/PTQ model quantisation — stated explicitly in the manifesto — pre-selects
    for buyers who run frontier-model inference with full-precision or lightly quantised weights, which
    skews toward hyperscalers and large inference clouds rather than edge deployments or SMB AI operators.
    The export-control language in every Olix job posting excludes certain geographies from employment
    eligibility and implicitly signals where initial customer relationships are expected to be built:
    UK, EU, US, and allied markets.

    No disclosed customer pipeline, letter of intent, or design-win announcement exists in any source
    reviewed. The absence of customer proof is itself a material signal at this stage: hyperscaler silicon
    decision cycles run 12–24 months from initial engagement to production commitment, and Olix has not
    yet taped out its first silicon as of June 2026. First commercial revenue is structurally locked behind
    the 2027 product delivery target.

    '
