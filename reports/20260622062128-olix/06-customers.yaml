- id: adoption-path-and-qualification
  title: Adoption path, sales motion, and integration requirements
  body: 'The path from Olix''s current pre-silicon state to first production revenue requires navigating
    three sequential gates: (1) silicon tape-out and functional validation, (2) software integration into
    the dominant open- source inference stack, and (3) customer qualification. None of these gates has
    been publicly cleared as of June 2026.

    On the software side, Olix''s hiring confirms a planned integration with vLLM, SGLang, and NVIDIA
    Dynamo. The vLLM project has accumulated more than 2,000 contributors and is the most widely deployed
    open-source inference serving framework; its GitHub repository had over 50,000 stars as of mid-2026.
    Integrating a novel accelerator into vLLM requires hardware-abstraction-layer work, operator kernels
    for key attention and matrix operations, and accepted upstream pull requests — none of which have
    been attributed to Olix in public repositories as of the research date. The platform integration engineer
    job specification indicates that Olix is hiring for this work now, consistent with the view that software
    integration is a pre-commercial dependency rather than a completed capability. The specification also
    requires deep familiarity with NIXL and Mooncake TE for disaggregated KV-cache management, which are
    themselves early-maturity standards still stabilising across the industry.

    On the customer qualification side, the dominant reference point is the hyperscaler silicon evaluation
    process. Broadcom''s CEO Hock Tan provided the clearest industry signal on photonic adoption timing
    in Broadcom''s Q4 FY2025 earnings call: "Silicon photonics won''t matter in the datacenter anytime
    soon," with an explicit framing that copper-based interconnects and then pluggable optics must be
    exhausted before silicon photonics becomes a procurement necessity. That sequencing from the CEO of
    the company holding more than $50 billion in hyperscaler custom silicon orders directly addresses
    buyer readiness for photonic inference accelerators. A separate DARPA PICASSO programme solicitation
    in early 2026 allocated $35 million to overcome fundamental photonic circuit scaling limitations,
    signalling that even government-funded research still treats photonics at system scale as an unsolved
    problem.

    Assuming Olix achieves first silicon in late 2026 or early 2027 and meets functional validation targets,
    a typical hyperscaler qualification cycle would then require a further 12–24 months of system-level
    testing, reliability characterisation, supply-chain audit, and procurement negotiation before a production
    purchase order could be issued. That timeline implies commercial revenue onset no earlier than late
    2027 at the most optimistic scenario, and 2028–2029 in a base case. The inference-as-a-service tier
    (CoreWeave, Lambda Labs) may move faster because their procurement processes are lighter than Tier-1
    hyperscaler vendor qualification programmes, but they also run on thinner margins and are unlikely
    to accept a prototype-stage accelerator without validated reliability benchmarks.

    MLCommons MLPerf inference benchmarks represent the industry-standard qualification signal — Groq,
    AWS Inferentia, and Google TPU all participate and use public benchmark results as a customer-credibility
    signal. Olix has not yet submitted to MLPerf, which is expected given its pre-silicon status, but
    absence from MLPerf will remain a tangible barrier to enterprise buyer trust even after first silicon
    is produced.

    '
