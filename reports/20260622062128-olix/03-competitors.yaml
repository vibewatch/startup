callouts:
  - calloutType: risk
    title: Olix enters a deployed-competitor market with an unshipped product
    body: >-
      As of mid-2026, Groq has deployed LPU-based inference at cloud scale, AWS Inferentia2
      is available in EC2, Google TPU is embedded in GCP, and NVIDIA Blackwell is shipping
      to hyperscalers. Olix has a credible funding base and a defensible architectural thesis
      but has not shipped silicon. The 12-to-18-month gap before its 2027 target is a
      real adversity window in which competitors can deepen software ecosystems, cut pricing,
      and secure multi-year supply agreements with the hyperscalers Olix hopes to address.
    claimRefs:
      - CP034
      - CP037
      - CP027
      - CP028
  - calloutType: insight
    title: Ayar Labs and Intel validate photonic manufacturing at scale but not at inference compute
    body: >-
      Ayar Labs' $3.75 billion Series E and NVIDIA NVLink Fusion membership, together
      with Intel's eight million PIC shipments, confirm that silicon photonics supply chains
      are maturing. However, both companies address the interconnect and optical I/O layer,
      not the AI compute core. Olix's architectural bet that SRAM-centric photonic compute
      delivers a superior inference unit economics is untested in production, while these
      adjacent photonic companies validate ecosystem readiness rather than compute performance.
    claimRefs:
      - CP013
      - CP015
      - CP038
      - CP041
  - calloutType: strength
    title: No direct competitor combines SRAM-centric memory with photonic compute in a shipped inference product
    body: >-
      The competitive map shows a genuine architectural whitespace: Lightmatter's Envise
      compute platform has not shipped at scale with an SRAM-centric decode optimisation,
      and Groq's LPU is fully electrical. If Olix ships on its 2027 timeline, it enters a
      market where the combined photonic-SRAM inference architecture is differentiated. The
      risk is that Lightmatter, NVIDIA, or a well-resourced hyperscaler internal team closes
      the gap before Olix clears customer qualification cycles.
    claimRefs:
      - CP030
      - CP031
      - CP032

