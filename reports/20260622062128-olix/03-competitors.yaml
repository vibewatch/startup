  - id: differentiation-moat-and-gaps
    title: Differentiation vectors, moat durability, and competitive gaps
    body: |
      Olix's primary differentiation claim is architectural: SRAM-centric memory combined
      with photonics avoids the high-bandwidth memory (HBM) supply bottleneck and associated
      cost, and targets the memory-bandwidth constraint that dominates autoregressive
      decode-heavy LLM inference. This positioning is genuinely distinct from Groq's
      latency-optimised streaming architecture, from NVIDIA's HBM-centric Blackwell design,
      and from the photonic interconnect focus of Lightmatter Passage. The DX-1 decode
      accelerator occupies a different optimisation point than any deployed competitor as of
      mid-2026.

      The durability of that differentiation depends on execution speed and the software
      ecosystem. Switching criteria for hyperscaler inference silicon buyers cluster around
      cost-per-token, throughput-per-watt, software stack compatibility, and supply-chain
      qualification lead times of typically twelve to twenty-four months. Groq has already
      cleared those hurdles for cloud-hosted inference; Olix has not yet entered the
      qualification pipeline. That timing gap is the most concrete competitive risk: Groq,
      Etched, and improved NVIDIA Blackwell B-series systems will have an additional eighteen
      months of production learning and ecosystem development before Olix's 2027 first
      shipment. If model architectures evolve toward mixture-of-experts or state-space
      architectures that stress different hardware bottlenecks, both Etched's hardcoded
      transformer design and Olix's SRAM-decode optimisation face re-scoping risk.

      Moat durability is strongest where Olix has combined photonic and memory IP that
      cannot be rapidly replicated. The Ayar Labs and Lightmatter funding rounds in 2025
      and 2026 show that photonic AI hardware attracts significant capital, but also that
      the specific SRAM-plus-photonics integration approach has not been publicly adopted
      by any competitor. Intel's volume-proven photonic manufacturing validates the broader
      technology ecosystem, but Intel's division focuses on interconnect components rather
      than inference-optimised compute, leaving the compute differentiation layer open.
      The adverse competitive reality, acknowledged directly by IEEE Spectrum's mid-2025
      inference benchmarking, is that NVIDIA and AMD hold every shipping performance record
      in AI inference; photonic challengers must displace that baseline with unshipped
      silicon in a qualification cycle that hyperscalers typically run over twelve to
      twenty-four months.
