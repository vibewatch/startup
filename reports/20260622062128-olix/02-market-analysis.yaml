callouts:
  - calloutType: risk
    title: CPO mass production not ready for Olix's 2027 ship date
    body: >-
      Multiple signals — edgen.tech reporting CPO mass production delays past 2026, Siemens CPO
      analysis confirming higher manufacturing variability than mature CMOS, and the Broadcom CEO's
      public assessment that silicon photonics adoption is "not anytime soon" — converge on a
      near-term supply-chain risk. Olix has a stated 2027 target for first customer shipments.
      If CPO yield and photonic foundry capacity do not scale by mid-2027, the company may face
      a bottleneck in both production and customer qualification, compressing the window between
      product availability and the hyperscaler capex cycles it is targeting.
    claimRefs:
      - CM016
      - CM025
      - CM030

  - calloutType: insight
    title: Hyperscaler capex at historic levels; inference spend is the fastest-growing segment
    body: >-
      The four top hyperscalers are collectively committing over $500 billion in annual capital
      expenditure to AI infrastructure in 2026. Alphabet alone guides $180–190 billion for the
      year; Microsoft $190 billion; Meta $125–145 billion. NVIDIA's data centre revenue has
      grown from near zero to over $51 billion per quarter in three years. Jensen Huang's
      statement that inference token generation surged tenfold in one year signals the inference
      segment is experiencing a demand surge that has rarely been matched in semiconductor
      history. This is the market dynamic Olix is attempting to capitalise on — the question is
      the timing and mechanism of photonic capture of that spend.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM020
      - CM021
      - CM022

