company:
  name: Olix
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Olix targets the AI inference accelerator market at a moment of exceptional demand: NVIDIA's data
    centre revenue hit $51.2 billion in Q3 FY2026 while the top three hyperscalers have each committed
    $125–190 billion in capital expenditure for 2026. The silicon photonics sub-market underpinning
    Olix's OTPU approach is projected to grow from $2.65 billion (2025) to $9.65 billion (2030) at a
    29.5% CAGR. Key constraints include Broadcom CEO Hock Tan's public view that silicon photonics
    "won't matter anytime soon" in datacentres, CPO manufacturing delays past 2026, and DARPA's
    acknowledgment of fundamental physics limits in scaling photonic circuits.

sections:
  - id: market-boundary
    title: Market boundary, substitutes, and adjacencies
    body: >-
      Olix operates at the intersection of three concentric markets. The broadest is the global AI
      accelerator chip market, which includes all custom silicon and GPUs used for AI training and
      inference across datacentres, cloud platforms, and edge deployments. The second ring is the AI
      inference accelerator sub-segment, which excludes training-optimised hardware (NVIDIA H100/H200
      class) and captures chips and systems designed specifically for inference latency, throughput, and
      token-decode efficiency. Olix's DX-1 Decode Accelerator sits squarely in this inference layer.
      The third, technology-specific ring is the silicon photonics and photonic integrated circuit
      market, which represents the enabling technology layer Olix is commercialising; this market also
      serves telecom transceivers, lidar, and biomedical sensors, meaning the AI share is a growing
      but still partial fraction of the total.


      Status-quo substitutes Olix must displace include: (1) NVIDIA GPUs running vLLM or SGLang-style
      inference serving on HBM-coupled Blackwell hardware; (2) custom ASICs from hyperscalers such as
      Google TPU, Meta MTIA, Amazon Trainium/Inferentia, and Microsoft Maia; and (3) pluggable optics
      combined with conventional copper rack-scale interconnects, which Broadcom's CEO publicly
      characterised as the intermediate step before silicon photonics becomes necessary. Excluded from
      Olix's primary SAM are: AI training workloads, edge/mobile AI inference, and general HPC
      workloads outside LLM-style architectures.


      Adjacencies worth tracking include the co-packaged optics supply chain (optical engine suppliers
      such as Ayar Labs, Broadcom photonics, Intel and Marvell), the high-bandwidth memory market
      (which Olix explicitly seeks to reduce dependence on through SRAM-centric design), and the
      optical networking / transceiver market that feeds into rack-scale and intra-pod connectivity.
      The AI data centre power and cooling market is a demand driver rather than a direct adjacency:
      IEA projects global data centre electricity demand will more than double to 945 TWh by 2030,
      with AI-optimised facilities quadrupling their share, creating acute incentives to adopt more
      energy-efficient inference hardware.
