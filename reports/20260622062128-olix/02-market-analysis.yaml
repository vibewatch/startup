  evidenceGaps:
    - type: missing-source
      severity: material
      topic: inference-capex-breakdown
      missingEvidence: >-
        Public breakdown of hyperscaler capex specifically allocated to inference hardware versus
        training hardware — e.g., proportion of $125–145B Meta capex directed to inference silicon.
      whyItMatters: >-
        Without this split, the inference-specific SAM cannot be isolated from the broader AI
        accelerator market, making SOM estimation speculative.
      diligencePath: >-
        Request inference-vs-training capex breakdown from hyperscaler IR or CFO commentary;
        cross-reference with data center operator job postings and silicon procurement announcements.
      relatedQuestionRefs: [QM018, QM023]

    - type: private-evidence-only
      severity: material
      topic: photonic-foundry-capacity
      missingEvidence: >-
        Production-ready yield and capacity data for photonic IC foundries (e.g., IMEC, GlobalFoundries
        photonics, AIM Photonics) that would underpin Olix's manufacturing ramp by 2027.
      whyItMatters: >-
        CPO yield issues and foundry capacity constraints, cited by edgen.tech and Siemens, are the
        primary near-term supply-side risk for Olix's product timeline.
      diligencePath: >-
        Obtain foundry roadmap data through Olix management or a direct engagement with photonic
        IC foundry commercial teams; compare against CPO supply chain readiness surveys.
      relatedQuestionRefs: [QM021]

    - type: missing-source
      severity: material
      topic: inference-token-pricing
      missingEvidence: >-
        Inference-as-a-service pricing trends and inference token cost trajectories in 2026,
        including whether falling token prices reduce or increase pressure to adopt lower-cost
        inference hardware.
      whyItMatters: >-
        Inference token price dynamics determine how quickly cost-per-token pressure drives
        hyperscalers toward non-NVIDIA inference silicon; this affects both Olix's timing and
        competitive urgency.
      diligencePath: >-
        Track public pricing from inference cloud providers (Together AI, Fireworks AI, Groq);
        analyse price-per-1M-token trends using aggregators such as artificialanalysis.ai.
      relatedQuestionRefs: [QM024]

    - type: conflicting-data
      severity: minor
      topic: CPO-deployment-timing
      missingEvidence: >-
        Reconciliation of the Siemens CPO analysis (CPO "already reshaping" data centre networks)
        and edgen.tech reporting (CPO mass production delayed past 2026); neither source provides
        deployment volume data that would resolve the discrepancy.
      whyItMatters: >-
        If CPO mass production is genuinely delayed, Olix's 2027 photonic shipment target faces
        a supply chain bottleneck; if CPO is already deploying, the ecosystem for Olix's architecture
        may be further along than the delay narrative implies.
      diligencePath: >-
        Identify specific hyperscaler CPO programme timelines (e.g., Google co-packaged optics
        roadmap, Meta optical interconnect deployment schedules) through IR disclosures and
        procurement signals.
      relatedQuestionRefs: [QM015, QM021]

