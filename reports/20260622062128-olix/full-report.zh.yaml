      - number: '4.2'
        title: 成本结构、人员 burn 与资本强度
        blocks:
          - type: paragraph
            body: >
              Olix 的成本结构主要由三类支出主导：人员、硅片工程（tape-out、EDA 工具、原型）、基础设施（实验室空间、测试设备、计算、专业服务）。三者都显著高于英国科技初创公司的中位水平，因为 Olix
              在打造带集成光子的全定制半导体——这是行业里最昂贵的工程任务之一。


              人员端，TechSparx 报道称 Olix 在 Bristol 招聘高级数字设计工程师，基础薪资 £125,000–£180,000，另加每年 £24,000
              本地生活补贴，意味着单个工程岗位在国民保险和股权前，总现金包最高可达 £204,000。Olix 招聘宣言确认，公司提供基准领先薪酬、有意义的股权授予，以及入职三个月文化不匹配时的 18
              周薪资退出包。单是这个退出条款，每次招聘失败都会带来一笔实质性一次性现金负债。Jon Peddie Research 2026 年 2 月报道，Olix 已增长到 70 多名员工，并计划到 2026 年底超过
              200 人。若以每人 £160,000– £200,000 的混合 fully-loaded 成本（base、NI、福利、本地奖金和股权摊销）套用 70 名现有员工，估算年度人员 run-rate 为
              £11–14 million（约 $14–17 million）。扩到 200 人后，在不计非人力成本前，这一数字约增长三倍至每年 £32–40 million（$40–50 million）。


              硅片工程是第二大成本驱动。在 TSMC 或 IMEC 等领先代工厂进行一次光子 ASIC tape-out，生产级芯片的 NRE、mask 和测试晶圆成本通常在 $10–50 million 区间。Siemens
              半导体封装博客解释，硅光子工艺仍呈现高于成熟 CMOS 的制造波动；co-packaged 组件可返工性有限，任何封装环节的良率偏离都会放大成本冲击。每一次失败的 tape-out
              迭代都会推迟收入并消耗资本。edgen.tech 关于 CPO 量产延期的报告进一步指出，封装复杂度可能让每轮迭代把交付时间线推迟 6 到 12 个月，从而成倍放大首笔收入前消耗的总资本。


              一个粗略的 2026 年中月度 burn 组合模型（70 名员工、tape-out 前原型阶段）：人员 $1.2–1.5M/月；硅片工程和工具 $0.5–1.0M/月；基础设施和 overheads
              $0.3–0.5M/月；合计估算 $2.0–3.0M/月。团队扩到 200 人并进入首轮 tape-out 生产后，估算 burn 升至 $5–8M/月。这些估计置信度低，完全基于行业成本 benchmark
              和员工数信号，并不来自任何已披露的 Olix 财务报表。
