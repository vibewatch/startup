      - number: '8.3'
        title: 情景分析、下行风险与资本强度
        blocks:
          - type: paragraph
            body: >
              牛市情景要求 Olix 在 2027 年前把 DX-1/OTPU 机架系统交付给付费的超大规模云厂商或云客户，完成足够规模的首批量产以证明每兆瓦吞吐量具备竞争力，并且在 NVIDIA
              的原生光子后继芯片进入规模量产前，从一级买方拿到两个或更多设计导入合同。在这个情景下，并购买方或 IPO 前二级市场可能给 Olix $5–8 billion 估值，相当于 Series A 投资者获得 5–8×
              回报。历史上还没有一家光子 AI 硬件公司在四年内从收入前阶段走到数十亿美元并购退出；这个情景依赖执行、时点和买方胃口同时到位。

              基准情景假设 2027 年出货目标延迟 12–18 个月，Olix 至少还需再融资 $400–600 million，用于流片、认证和商业化，并使 Series A 投资者持股被稀释至股权结构表的约
              12–16%。首批收入可能在 2028 年出现，硬件出货规模虽小但有意义，约 $10–50 million。该情景下后续估值 $2–3 billion，意味着 Series A 投资者在优先权和稀释前获得
              2–3× 回报；对一笔高风险深科技押注来说，这个结果偏弱。

              熊市情景里，OTPU 流片遇到良率或集成失败，首颗硅交付被推迟到 2029 年或更晚。到那时，NVIDIA 的原生光子或基于 CXL 的产品可能已经拿下效率市场，Groq 和 Positron AI
              也可能锁定大部分超大规模云厂商推理合同，Olix 可能被迫降价融资或寻求困境出售。单代半导体产品的资本强度——流片、封装、认证、系统集成——通常超过 $200–500 million，这意味着 Olix
              迄今融资的 $250 million 不太可能在没有稀释性后续资本的情况下支撑完整量产爬坡。Companies House 记录的 GBP 287.8572
              已配发股本确认，股权仍在分批发行，符合里程碑挂钩拨款的特征。

              NVIDIA 自己的光子路线图构成结构性反向风险：CNBC 2026 年 5 月报道称，NVIDIA 已在共封装光学上投入约 $2 billion，覆盖
              Lumentum、Coherent、Marvell、Corning；Jensen Huang 也在 GTC 确认，NVIDIA 正开始扩大硅光子技术规模。若 NVIDIA
              供应商生态（Lumentum、Coherent、Marvell、Corning）成功把 CPO
              大规模集成，独立光学加速器厂商的可服务市场就会从广阔的超大规模云厂商数据中心市场，收缩到专业化的推理即服务应用。CNBC 文章引用分析师预测，光子成为主流还需一到两代产品——也就是说，Olix 不仅要跑赢
              Groq 和 Positron，还要跑赢 NVIDIA 光子集成路线图内含的倒计时。
