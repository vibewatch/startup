      - number: '3.4'
        title: 差异化向量、护城河耐久性与竞争缺口
        blocks:
          - type: paragraph
            body: |
              Olix 的核心差异化主张是架构：SRAM 中心内存叠加光子技术，避开
              high-bandwidth memory（HBM）供应瓶颈和相关成本，并瞄准主导自回归
              decode-heavy LLM 推理的内存带宽约束。这个定位确实不同于 Groq 的
              低延迟优化 streaming 架构、NVIDIA 的 HBM 中心 Blackwell 设计，也不同于
              Lightmatter Passage 的光子互连重点。截至 2026 年中，DX-1 decode accelerator
              占据了不同于任何已部署竞争者的优化点。

              这种差异化能否持久，取决于执行速度和软件生态。Hyperscaler 推理硅片买方的
              切换标准集中在 cost-per-token、throughput-per-watt、软件栈兼容性，以及通常
              需要 12 到 24 个月的供应链认证周期。Groq 已经为云托管推理跨过这些门槛；Olix
              还没有进入认证管线。这个时间差是最具体的竞争风险：在 Olix 2027 年首批出货前，
              Groq、Etched 和改进后的 NVIDIA Blackwell B-series 系统还会多出 18 个月生产学习
              和生态开发时间。如果模型架构转向 mixture-of-experts 或 state-space 架构，并把
              硬件瓶颈推向不同位置，Etched 的 transformer 硬编码设计和 Olix 的 SRAM-decode
              优化都面临重新定范围的风险。

              Olix 护城河最强的地方，是它把光子与内存 IP 组合成难以快速复制的系统。Ayar Labs
              和 Lightmatter 在 2025、2026 年的融资显示，光子 AI 硬件吸引大量资本；但公开记录
              中还没有竞争者采用同样的 SRAM 加光子集成路线。Intel 量产验证过的光子制造能力
              证明了更大技术生态可行，但 Intel 部门聚焦互连组件，而不是推理优化计算，因而把
              计算差异化层留了出来。负面的竞争现实也很直接：IEEE Spectrum 2025 年中推理
              benchmark 显示，NVIDIA 和 AMD 拿下了所有已出货 AI 推理性能纪录；光子挑战者必须
              用尚未出货的硅片，在 hyperscaler 通常持续 12 到 24 个月的认证周期里替代这个基线。
