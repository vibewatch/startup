companyProfile:
  summary: >
    Olix 是一家总部位于伦敦的光子 AI 硬件初创公司，2024 年 3 月注册成立，2026 年 1 月由 Flux Corp Ltd 更名而来。公司在打造以 SRAM 加光子推理为核心的 DX-1 / OTPU
    架构，主张传统围绕 HBM 的加速器无法在规模化场景下同时经济地提供吞吐和交互性。公开证据支持其在 2026 年 2 月完成由 Hummingbird Ventures 领投的 $220M Series A，估值超过
    $1B，但公司尚未公开披露收入、设计导入、tapeout 完成情况或代工伙伴。因此，Olix 的资本形成和技术野心在同龄公司中异常突出，但商业就绪度的公开证据仍然有限。
