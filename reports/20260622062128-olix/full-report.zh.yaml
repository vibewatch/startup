  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与四层分类
        blocks:
          - type: paragraph
            body: |
              Olix 进入的是一个 AI 推理硅片尚无单一主导形态的市场，
              这既是机会，也说明光子计算板块仍然很早。尽调时可按技术物理
              和商业位置，把竞争者清晰分成四层。

              第一层是直接光子计算同行：这些公司在打造把光用于计算或
              AI 工作负载内存带宽管理的硅片。Lightmatter 是最突出的名字，
              但其 Passage 产品主要是光子互连 chiplet，Envise 计算平台
              尚未以 hyperscaler 规模出货。收购线索包括 Celestial AI，
              它已被 Marvell 吸收，其光学 fabric 知识产权现在落在半导体
              巨头内部，而不是独立挑战者手中。

              第二层是光互连和 co-packaged optics（CPO）供应商。Ayar Labs
              领跑这一组，为 AI scale-up 集群出货 TeraPHY 光 I/O chiplet，
              并让 NVIDIA 和 AMD 同时成为投资人。Intel Silicon Photonics
              部门已向数据中心收发器出货超过 800 万颗光子集成电路，并在开发
              4-Tbps Optical Compute Interconnect（OCI）chiplet。这些公司
              供应 Olix OTPU 这类系统所依赖的光子管线；它们可能是伙伴，也
              代表 hyperscaler 的另一种采购策略：把光子改装到现有 GPU 集群上，
              而不是采用新的计算平台。

              第三层是电学推理 ASIC：Groq（Language Processing Unit，已云端
              部署）、Etched（transformer 专用硬编码 ASIC，尚未商业化），以及
              NVIDIA 和 AMD 这些 GPU 巨头，其 Blackwell 和 MI 系列芯片主导当下
              推理服务。第四层是 hyperscaler 自用硅片：AWS Inferentia、Google
              TPU 和 Meta MTIA。它们按每个 hyperscaler 削减可寻址市场，而不是
              争夺商用硅片份额。
