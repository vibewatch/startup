      - number: '8.2'
        title: 可比估值、先例交易与公开市场背景
        blocks:
          - type: paragraph
            body: >
              2025–2026 年 AI 硬件推理创业公司的私募融资，给出了估值区间的参照。商业化最靠前的可比公司 Groq，2025 年 9 月以 $6.9 billion 投后估值融资 $750 million，约为
              Olix 隐含估值的 6.9×；但 Groq 已有出货的 LPU 产品、收入，并服务超过 200 万活跃开发者。Ayar Labs 2026 年 3 月融资 $500 million，估值 $3.75
              billion，反映的是它在 NVIDIA NVLink Fusion 生态中共封装光学产品的位置。Positron AI 2026 年 2 月以超过 $1 billion 估值融资 $230
              million，融资额和估值时间几乎与 Olix 完全可比；不同的是，Positron 已出货 FPGA 推理系统 Atlas，并有面向 2026 年底流片的自研芯片
              Asimov。这组对比值得重视：Positron 在与 Olix 相同的隐含估值下，已经有出货产品和付费种子客户 Jump Trading，而 Olix 两者都没有。SambaNova（$350M Series
              E）、Cerebras（2026 年 Q1 $1B Series H，准备 IPO）和 MatX（$500M Series B）则为 AI 加速器赛道补上更多参照点。

              从并购维度看，最清晰的光子专属可比案例是 Marvell 收购 Polariton Technologies；后者是一家瑞士公司，开发基于等离激元的硅光子器件。交易条款未披露。更广的半导体并购历史里，Intel
              约 $2 billion 收购 Habana Labs（2019 年），Qualcomm 以 $1.4 billion 收购 NUVIA（2021
              年）。两笔交易都奖励了在商业交付前押注架构期权价值的买方，但成交时两家公司都不是流片前状态。

              公开市场基准给分析区间的上沿定锚。NVIDIA 2027 财年 Q1 收入 $81.6 billion，同比增 85%，其中数据中心计算收入 $60.4 billion。按 2026 年 5 月约 $3.2
              trillion 市值（由回购和 EPS 推算），NVIDIA 约按年化收入 9–10× 交易；这个倍数对应的是量产产品、主导市场地位和 75% 毛利率。即便对 NVIDIA 前瞻倍数施加 70–80%
              的高幅度收入前折价，流向一个产品前竞争者的隐含可承受倍数也只是峰值预测收入约 2–3×。Grand View Research 对 AI 加速器市场的预测（2033 年 $256.8 billion，CAGR
              29.3%）以及 Precedence Research 对更广 AI 芯片市场的估计（2026 年 $121.7 billion，2035 年增至 $1.1
              trillion），确认了总需求扩张，但不能降低单个供应商拿下份额的风险。

              Lightmatter 是最接近的光子计算可比公司；截至本次分析时，它尚未确定公开披露最新轮估值。其 Guide 产品是面向 AI 的超大规模光子光引擎，产品成熟度高于 Olix 的 OTPU，因此
              Lightmatter 很可能享有更高倍数。CNBC 2026 年 5 月的光子文章引用了一位分析师的观点：大规模部署光子技术可能「还需要 NVIDIA 再迭代一到两代产品」。这句话直接框住了 Olix
              可服务市场的时间线风险。
