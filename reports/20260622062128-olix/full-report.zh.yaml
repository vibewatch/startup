              截至 2026 年中，Groq 已在云规模部署 LPU 推理，AWS Inferentia2 可在 EC2 使用，Google TPU 嵌入 GCP，NVIDIA Blackwell 正在向
              hyperscaler 出货。Olix 拥有可信融资基础和可防守的架构论点，但尚未出货硅片。距离 2027 年目标仍有 12 到 18 个月，这是真实的逆风窗口：竞争者可以加深软件生态、降价，并与 Olix
              希望触达的 hyperscaler 锁定多年供应协议。
