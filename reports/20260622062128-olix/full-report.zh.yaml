        title: 附录
        blocks:
          - type: callout
            title: 机架级协同设计在架构上具有差异性
            body: >
              Olix 选择在机架尺度协同设计计算、内存、互连和光学，而不是在现有 GPU 封装范式中优化单个组件；作为对 HBM 内存墙的回应，这条路线在技术上连贯。该架构避开 HBM 的供应链约束，绕开
              interposer 瓶颈，并专门瞄准 decode 阶段——现代 LLM serving 中最重的工作负载。如果执行到位，它确实不同于只做硅基 SRAM 的初创公司，也不同于只做互连层的光子公司。
