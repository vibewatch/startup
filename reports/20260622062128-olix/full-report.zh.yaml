      - number: '6.2'
        title: 采用路径、销售动作与集成要求
        blocks:
          - type: paragraph
            body: >
              Olix 从当前 pre-silicon 状态走到首笔生产收入，需要依次穿过三道门：（1）硅片 tape-out 与功能验证，（2）接入主流开源推理栈，（3）客户认证。截至 2026 年 6
              月，没有任何一道门被公开证明已经通过。

              软件侧，Olix 的招聘确认其计划接入 vLLM、SGLang 和 NVIDIA Dynamo。vLLM 项目已积累超过 2,000 名贡献者，是部署最广的开源推理 serving 框架；截至 2026 年中，其
              GitHub 仓库 star 超过 50,000。把新型加速器集成进 vLLM，需要硬件抽象层工作、关键 attention 和矩阵运算的 operator kernel，以及被接受的 upstream pull
              request——截至研究日期，公开代码库中没有任何一项归属于 Olix。平台集成工程师岗位说明显示，Olix
              现在才在为这项工作招聘，这与软件集成仍是商业化前依赖、而非已完成能力的判断一致。该岗位还要求深入熟悉用于分离式 KV-cache 管理的 NIXL 和 Mooncake
              TE，而这两项本身也是仍在行业内稳定下来的早期标准。

              客户认证侧，主导参照是 hyperscaler 硅片评估流程。Broadcom CEO Hock Tan 在 Broadcom Q4 FY2025
              财报电话会上给出了关于光子采用时点的最清晰行业信号：「Silicon photonics won't matter in the datacenter anytime soon」，并明确表示，必须先耗尽铜互连和
              pluggable optics 这两波技术，硅光子才会成为采购必需品。这个排序来自一家手握超过 $50 billion hyperscaler 定制硅订单的公司
              CEO，直接回应了买方对光子推理加速器的准备度。另一个独立信号是，DARPA PICASSO 项目在 2026 年初拨出 $35
              million，用于突破基础光子电路扩展限制，说明即便政府资助研究，仍把系统尺度光子视为未解问题。

              假设 Olix 在 2026 年末或 2027 年初拿到首颗硅片，并达到功能验证目标，典型 hyperscaler 认证周期仍需要额外 12–24 个月，用于系统级测试、可靠性
              characterization、供应链审计和采购谈判，然后才可能下达生产采购订单。这个时间线意味着，最乐观情景下商业收入也不会早于 2027 年末，基础情景则落在 2028–2029
              年。Inference-as-a-service 层（CoreWeave、Lambda Labs）可能推进更快，因为其采购流程轻于 Tier-1 hyperscaler
              供应商认证计划；但它们利润率更薄，也不太可能在没有可靠性 benchmark 验证的情况下接受原型阶段加速器。

              MLCommons MLPerf 推理 benchmark 是行业标准的认证信号——Groq、AWS Inferentia 和 Google TPU 都参与，并用公开 benchmark
              结果建立客户可信度。考虑到 Olix 仍处于 pre-silicon 状态，尚未提交 MLPerf 属于预期之内；但即使首颗硅片产出，缺席 MLPerf 仍会是企业买方信任的实质障碍。
