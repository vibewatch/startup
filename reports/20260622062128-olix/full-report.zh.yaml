          - type: callout
            title: 反向信号 — NVIDIA 光子集成提速
            body: >
              NVIDIA 已向 Lumentum、Coherent、Marvell、Corning 投入约 $2 billion 用于光子集成，CEO Jensen Huang 也在 GTC 2026 确认，NVIDIA
              正开始扩大硅光子技术规模。CNBC 2026 年 5 月光子文章引用的一位独立分析师估计，主流光子部署还需要 NVIDIA 再迭代一到两代产品——但这只钟已经开始走。若 NVIDIA 的共封装光学供应商生态在
              Blackwell 后继代内交付原生光子性能，独立 SRAM+光子推理加速器的投资逻辑会明显削弱；对代表 Olix 主要可服务机会的超大规模云厂商市场尤其如此。
            calloutType: risk
