      - number: '4.4'
        title: 财务结论与关键尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Olix 呈现出一家资本充足的收入前深科技硬件初创公司的画像：账面 runway 充裕，团队可信度高且薪酬优厚，产品论点清晰，并由 $250 million
              风险资本和独角兽估值背书。核心财务风险不是短期偿付能力，而是光子半导体开发的成本与时间敞口；一次 tape-out 延误或良率失败，就可能吃掉六到十二个月 runway，并迫使公司进行计划外融资。


              三个反向财务信号需要升级尽调。第一，Siemens CPO 封装博客和 edgen.tech 均记录到，共封装光学量产持续面对良率波动，单位成本被推高到商品化 CMOS 基线之上——Olix 的
              SRAM-and-photonics 架构正落在这个高波动区域。第二，Olix 的薪酬结构（£125– £180K 基薪加 £24K 本地奖金，18
              周离职缓冲）即便按伦敦深科技标准也偏慷慨；每一次招错人或文化不匹配离职，都会在收入出现前产生真实现金成本。第三，Olix 截至 2025 年 8 月 31 日期间的法定账目按 total exemption
              制度提交，意味着虽然有资产负债表，但损益表和董事报告（其中会出现收入、亏损和持续经营说明）根据英国小公司豁免未向公众披露。


              英国国家半导体战略描述了政府未来 20 年支持芯片 IP、设计和化合物半导体的意图，但当前政策文件没有承诺为具体芯片设计项目提供直接资本——它不是 Olix 的额外资金来源。


              毛利率、单位经济性和收入轨迹完全未披露。没有任何公开确认的 design
              win、意向书或试点客户，分析师无法精确建模收入爬坡。财务结论是：当前阶段资本位置足够；执行和良率风险是主导财务威胁；本章的尽调问题，在任何投资承销前都不可让步。
