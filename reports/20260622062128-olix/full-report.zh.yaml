      - number: '7.3'
        title: 商业、财务、竞争与供应链风险
        blocks:
          - type: paragraph
            body: >
              Olix 的财务风险画像由四个叠加特征塑造：公司仍处于收入前；融资时达到独角兽估值；面对资本密集的半导体开发路径；按 $220 million 融资对应模型化 $3–5 million 月烧钱率估算，30–45
              个月 runway 必须在任何商业收入抵消支出之前，覆盖多年 R&D、tape-out 成本、封装认证和 go-to-market 招聘。半导体分析机构 Jon Peddie Research 指出，AI
              处理器市场竞争激烈且资本密集。如果 AI 支出情绪转弱——触发因素可能是模型效率提升导致算力需求下降、云 CapEx 收缩，或市场回调——下一轮融资可能以显著更低估值或苛刻条款完成。Semiconductor
              Industry Association 的 2025 State of the Semiconductor Industry 报告也凸显了参与先进芯片设计竞争所需资本规模。


              竞争风险尖锐且迫近。NVIDIA 数据中心收入在 Q3 FY2026 达到 $51.2 billion，公司还在持续为推理工作负载优化 Blackwell，缩小 Olix 光子路线必须在 2027
              年前跨越的性能差距。最接近的光子计算同行 Lightmatter 已融资 $400 million，产品开发进展更靠前；CNBC 2026 年 5 月报道称，芯片公司正竞相解决 AI 光子瓶颈。如果 2027
              年目标滑到 2028 年或更晚，NVIDIA、Google TPU 和 AWS Inferentia 将获得更多时间在传统 CMOS 架构上缩小效率差距，侵蚀 Olix 想利用的 wedge。


              供应链有两个难以缓释的单源依赖。TSMC 是 Olix 所需工艺节点上先进硅光子的唯一可信 foundry；任何对 TSMC 访问的扰动——无论来自地缘政治、产能还是认证——都会实质推迟项目。TSMC
              上游，ASML 的 EUV 光刻系统是全球集中 chokepoint；EUV 工具可用性短缺会同时影响所有先进 foundry 节点。用于 III-V 化合物半导体光源（基于 indium
              phosphide）的激光供应商构成第三个供应链约束，因为 InP 晶圆供应地域集中，也受自身产能限制。
