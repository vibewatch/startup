            title: Inference-as-a-service 层可能提供更快的首笔收入路径
            body: >
              推理云供应商（CoreWeave、Lambda Labs）的采购周期明显短于 Tier-1 hyperscaler 硅片认证计划。CoreWeave 参与 MLPerf v5.0，以及 Lambda 的按需
              GPU 集群，都确认其有主动硬件投资意愿。这些买方按 token 定价，因此一旦 benchmark 通过验证，就有直接动力采用更低成本硅片。Olix 首笔生产收入可能来自这一层，而不是直接来自 Tier-1
              hyperscaler；推理云关系因此是需要跟踪的重要早期商业里程碑。
            calloutType: insight
            claimRefs:
