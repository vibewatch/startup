  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品与相邻市场
        blocks:
          - type: paragraph
            body: >-
              Olix 位于三个同心市场的交叉点。最外层是全球 AI 加速器芯片市场，覆盖数据中心、云平台和边缘部署中用于 AI 训练和推理的所有定制硅片与 GPU。第二层是 AI
              推理加速器子市场，排除面向训练优化的硬件（NVIDIA H100/H200 类），聚焦为推理延迟、吞吐和 token 解码效率设计的芯片与系统。Olix 的 DX-1 Decode Accelerator
              正处在这一推理层。第三层是更具体的技术市场：硅光子和光子集成电路，这是 Olix 试图商业化的使能技术层；该市场也服务电信收发器、lidar 和生物医疗传感器，意味着 AI 只占总量中不断增长但仍然部分的一块。


              Olix 必须替代的现状方案包括：（1）在 HBM 耦合的 Blackwell 硬件上运行 vLLM 或 SGLang 式推理服务的 NVIDIA GPU；（2）Google TPU、Meta
              MTIA、Amazon Trainium/Inferentia、Microsoft Maia 等 hyperscaler 自研 ASIC；（3）可插拔光模块叠加传统铜质机架级互连，Broadcom CEO
              曾公开称这会是硅光子变得必要前的中间步骤。Olix 的主要 SAM 不包括：AI 训练负载、边缘 / 移动端 AI 推理，以及 LLM 式架构之外的一般 HPC 工作负载。


              值得跟踪的相邻市场包括 co-packaged optics 供应链（Ayar Labs、Broadcom photonics、Intel、Marvell 等 optical engine
              供应商）、高带宽内存市场（Olix 明确希望用 SRAM 中心设计降低依赖），以及服务机架级和 pod 内连接的光网络 / 收发器市场。AI 数据中心电力与冷却市场是需求驱动，而非直接相邻：IEA
              预计全球数据中心用电量到 2030 年将增加一倍以上至 945 TWh，AI 优化设施的份额将扩大四倍，这会形成强烈动机，推动市场采用能效更高的推理硬件。
