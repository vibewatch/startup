      - number: '5.3'
        title: 制造挑战、标准、出口管制与技术风险
        blocks:
          - type: paragraph
            body: >
              不论硅片质量如何，光子与 CPO 供应链都给 Olix 带来多项有充分记录的风险。Siemens EDA 2026 年 CPO 分析中的行业报道指出四个交织挑战：热管理（photonic IC
              对温度高度敏感，AI 工作负载的瞬时热波动会让光波长漂移）、测试扩展性（光学对准需要微米级精度，远严于电测试，自动化量产级测试方法尚不成熟）、制造良率（硅光子工艺波动高于成熟 CMOS，CPO
              组装不可返工，使良率波动代价尤其高）、标准不完整（OIF 及相关联盟仍在制定调制格式、热包络和光学 attach 方法的互操作规范）。edgen.tech 的一份反向行业 note 具体报道，CPO
              量产因良率问题被推迟到 2026 年之后——这会直接映射为 Olix 计划中 2027 年产品发布窗口的风险。

              对一家收入前初创公司而言，Olix 的出口管制姿态异常明确。所审查的每个工程岗位都附有通知，限制最近国籍或永久居留地为 Iran、North
              Korea、Syria、Cuba、Russia、Belarus、China、Hong Kong、Macau 或 Venezuela 的候选人，并引用美国出口管制规定。这表明 Olix 的技术栈几乎肯定包含
              Export Administration Regulations（EAR）下的受控项目，对客户地域、供应链伙伴选择，以及来自受限国家关联投资人的融资都有现实影响。

              光子领域的竞争背景进一步说明成熟度缺口。Intel 等成熟玩家已为数据中心网络交付硅光子产品多年；获得 NVIDIA 支持的 Ayar Labs 已宣布共封装光学 chiplet 生产。Lightmatter 的
              Passage 平台从概念到初始部署用了四年或更久。Olix 做的是更有野心的全系统平台，而不只是光互连层；相对组件专家，工程和制造挑战被叠加放大。公开领域没有 DX-1 的独立 benchmark
              数据、可靠性测试结果或客户认证数据。
