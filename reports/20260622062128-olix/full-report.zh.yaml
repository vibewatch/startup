      - number: '2.2'
        title: 市场规模——TAM、SAM 与受约束的 SOM
        blocks:
          - type: paragraph
            body: >-
              Olix 最宽口径的 TAM 是全球 AI 加速器市场：Grand View Research 将 2024 年规模估为 $25.56 billion，并预计到 2033 年增至 $256.84
              billion，CAGR 为 29.3%。在这个范围内，推理负载是增长最快的部分。NVIDIA 自身财报披露暗示，归因于推理的年度数据中心计算支出已经达到每年数百亿美元量级，并仍在增长：仅 FY2026 Q3
              一个季度，数据中心收入就达到 $51.2 billion；Jensen Huang 提到，过去十二个月 AI 推理 token 生成量增长了十倍。


              硅光子技术市场为 Olix 的 SAM 提供了更窄代理。MarketsandMarkets 估计，全球硅光子市场将从 $2.65 billion（2025）增长到 2030 年 $9.65
              billion，CAGR 为 29.5%；北美在此区间内从 $1.16 billion 增至 $4.35 billion。The Research Insights 给出趋同但略低的估计：2030 年 $8.13
              billion。两组估计都把电信和 datacom 应用与 AI 推理一并纳入，因此纯推理切片更小——但按三家分析来源的说法，AI / 数据中心份额都是主要增长引擎。


              2027–2029 年 Olix 受约束的 SOM 取决于尚未公开的变量：客户认证时间线、光子代工良率，以及 hyperscaler 是把推理拉回自研，还是采用商用硅片。分析师估计显示，在 CPO
              和光子推理获得有意义的 hyperscaler 牵引时，到 2029–2030 年，可服务的年度推理光子收入机会可能达到 $1–3 billion。不过，这一 SOM
              估计明确受证据约束，应视为方向性区间，而不是硬预测。
