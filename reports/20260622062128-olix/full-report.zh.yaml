  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: DX-1 架构——SRAM 与共封装光子集成
        blocks:
          - type: paragraph
            body: >
              Olix 的计算宣言把数据移动——尤其是 KV-cache 流量穿过 High Bandwidth Memory 时产生的能耗和延迟成本——定义为根本约束，它让现有加速器无法同时交付高吞吐和低延迟。公司的回应是
              OLIX Decode Accelerator 1（DX-1），并称其为首个专为 decode 架构设计的加速器。设计理念是完全放弃 HBM，转而扩展以 SRAM
              为中心、并与光子集成的存储层级，同时处理带宽和延迟两维问题。

              SRAM+photonics 架构在机架尺度运行。Olix 材料把「logic、data movement、packaging、optics and interconnect 的 rack-scale
              co-design」描述成一个统一系统，并将其与同行采用的 reticle-scale 和 wafer-scale 路线区分开。光子部分覆盖芯片到芯片、tray 内、机架到机架的光互连，并以
              co-packaged optics（CPO）作为集成载体。Optical Communications Engineer 职位描述确认，Olix
              正在构建跨这三种距离层级的链路架构，系统级链路预算——损耗、BER、带宽、功耗和热裕量——由工程团队内部负责。

              第三方市场观察 profile 同时点名 Olix 的 OTPU（Optical Tensor Processing Unit）和 DX-1，称二者是不同产品组件。宣言没有明确使用 OTPU 标签，而是指向
              DX-1 系统层级；OTPU 似乎描述的是更大机架系统中的计算单元。公司声称 OTPU 使用光子元件完成矩阵乘法且发热极低，这应视为设计意图，而非已验证性能；目前没有公开 characterization
              data。

              预硅原型正在使用 Xilinx/AMD UltraScale+ 和 Versal FPGA 平台推进。FPGA 岗位要求 PCIe Gen4 接口、以超过 25 Gb/s NRZ 运行的多通道收发器、BER
              测量基础设施和 SECDED 纠错，确认 FPGA 控制逻辑与光学子系统之间存在高速数字集成层。White Rabbit 精密时序也被提及，暗示系统需要确定性 fabric，这与分布式机架级计算一致。
