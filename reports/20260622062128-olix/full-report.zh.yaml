        - 资本密集、执行风险、竞争替代、单一创始人 CEO、优先权悬置
      - - 估值立场
        - 偏高
        - 在没有收入时估值已超过 $1B，价格已经押注一长串尚未验证的执行里程碑
      - - 重估催化剂（上行）
        - 晶圆厂 tapeout 确认，加上 ≥1 份设计导入 LOI
        - 任一证据都会把立场推向合理，并把建议推向买入
      - - 重估催化剂（下行）
        - 错过 2027 年出货目标，或竞争对手签下 Olix 目标客户
        - 任一触发因素都会把立场推向昂贵，并把建议推向回避
    notes: 评估截至 2026-06-22。建议对价格敏感；一旦出现新证据，假设可能调整。
    claimRefs:
      - CV001
      - CV005
      - CV024
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 论点
      - 类型
      - 什么会改变这一判断
    rows:
      - - 到 2033 年推理市场 CAGR 约 29%，给一流硬件留下了很大的可寻址机会
        - 正论点（市场）
        - 模型效率提升压低算力需求，市场增长停滞
      - - SRAM + 光子架构绕过 HBM 内存墙和供应链约束；如果交付落地，就有结构性成本和延迟优势
        - 正论点（产品）
        - OTPU 良率或集成测试显示，在系统层面，光子计算相对下一代电气系统优势不足
      - - Olix 尚未产生收入，没有披露设计导入，没有 tapeout 证据，也没有客户承诺；全部价值都是期权价值
        - 反论点（执行）
        - 公司在 2026 年披露已确认的晶圆厂 tapeout、LOI 或首笔客户收入
      - - Groq（已出货，$6.9B）和 Positron AI（已出货，$1B+）在相同或更高估值下已有真实产品优势
        - 反论点（竞争）
        - Olix 展示更强的基准结果，迫使竞争对手暂停既有客户谈判
      - - NVIDIA 的 $2B 光子投资计划可能原生集成 CPO，压缩 Olix 的可寻址市场
        - 反论点（战略风险）
        - NVIDIA 确认 CPO 集成还要数年，或会基于供应链光学方案，而不是面向推理优化的设计
      - - 芯片开发吃资本，收入前可能还要 2-3 轮稀释性融资，侵蚀 Series A 投资人回报
        - 反论点（资本）
        - Olix 从英国政府半导体计划获得非稀释性补助资金，或宣布晶圆厂成本分担协议
    notes: 论点综合公开来源和跨章节证据；所有反论点都对应已确认的证据缺口，而不是猜测。
    claimRefs:
      - CV007
      - CV012
      - CV015
      - CV017
      - CV022
      - CV030
  - id: TV003
    title: 牛市 / 基准 / 熊市情景摘要
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - DX-1 在 2027 年上半年出货；≥2 家一线 hyperscaler 签署 LOI；后续融资估值 $3–5B；2030 年前以 $6–8B 并购退出
        - Series A 以 $1B 进入可获 5–8× 回报；收购方按 $400-600M ARR run-rate 的预测收入支付 15–20×
        - 硅光良率执行；hyperscaler 采购延迟；NVIDIA 在交易前完成替代
        - 低（需要完美执行 + 温和竞争环境）
      - - 基准
        - 首笔收入延迟 12–18 个月至 2028 年；一轮稀释性过桥融资（$400–600M），估值持平或小幅上台阶；首笔收入 $10–50M
        - Series A 毛回报 2–3×；扣除清算优先权和稀释后，净回报 1–2×
        - 跑道压力；人才留存；若 AI 投资周期降温，资本市场风险上升
        - 中（符合深科技硬件的基准概率）
      - - 熊市
        - 2029 年后才交付；down-round 或困境出售；NVIDIA CPO 集成大幅压缩可寻址市场
        - Series A 回报 0–0.5×；如果清算优先权排在普通股之前，可能全损
        - 资本完全减值；管理层离职；战略并购价格象征性
        - 低-中（高于典型 SaaS，但符合纯硬件、收入前押注）
    notes: 情景仅作示意；公开域没有收入、积压订单或设计导入数据，无法用量化方式锚定概率估计。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 轮次 / 事件
      - 估值（投后或 EV）
      - 阶段 / 收入状态
      - 与 Olix 的相关性
      - 局限
    rows:
      - - Groq
        - $750M Series D（2025 年 9 月）
        - $6.9B
        - LPU 已出货；200 万+ 开发者；披露收入
        - 直接的推理加速器同业；最成熟的电气替代方案
        - 已产生收入；牵引力支撑更高隐含倍数；电气方案，不是光子方案
      - - Ayar Labs
        - $500M Series E（2026 年 3 月）
        - $3.75B
        - 共封装光学 chiplet；NVIDIA NVLink 伙伴；量产
        - 光子计算相邻领域；共享供应链风险；获得 NVIDIA 背书
        - CPO 供应商，不是推理加速器；商业模式不同
      - - Positron AI
        - $230M Series B（2026 年 2 月）
        - '>$1B'
        - Atlas 已出货（基于 FPGA 的推理）；定制芯片 2026 年 tape-out
        - 阶段和轮次规模最接近；估值相同；今天已有出货产品
        - 基于 FPGA，不是光子方案；美国公司；竞争护城河不同
      - - Cerebras Systems
        - $1.0B Series H（2026 年 Q1）
        - 未披露；2026 年准备 IPO
        - 晶圆级 SRAM 芯片；已出货；云服务；IPO 待定
        - SRAM 中心架构重叠；IPO 估值将设定公开市场基准
        - 运营历史更长；已证明收入；技术路径不同
      - - MatX
        - $500M Series B（2026 年 Q1）
        - 未披露
        - SRAM 优先 LLM 芯片；量产前；Mountain View CA
        - SRAM 优先架构与 Olix 的内存论点一致
        - 没有光子层；美国公司；机构背书质量不同
      - - NVIDIA（公开市场）
        - 持续
        - 约 $3.2T 市值（2026 年 5 月）
        - 主导 AI 芯片供应商；FY27 Q1 收入 $81.6B（同比 +85%）；毛利率 75%
        - 为 AI 芯片硬件设定公开市场倍数上限（约 10-14× 远期收入）
        - 已产生收入的在位巨头；执行风险或技术成熟度不可比
    notes: >
      轮次数据来自 SemiEngineering 2026 年 Q1 Startup Funding 报告和新闻稿。NVIDIA 市值是根据 FY27 Q1 股票回购数据和流通股数估算，并非官方数字。Cerebras 的 IPO
      前估值未披露。所有可比轮次发生在 2025–2026 年。Lightmatter 融资轮次细节在运行日期未获公开确认。
    enumerationScope:
      coverage: partial
      basis: >
        Includes the five closest private peers by technology type, stage, and round date (2025–2026) plus NVIDIA as
        public benchmark. Lightmatter excluded due to unconfirmed valuation. Excludes older-vintage rounds (pre-2024) as
        market conditions are not comparable.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
      - CV017
      - CV018
  - id: TV005
    title: 论点破裂与止损触发器
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - DX-1/OTPU tape-out 失败或无限期延迟
        - 2026 年底前没有确认晶圆厂 tapeout
        - 核心产品前提坍塌；剩余资本只能支撑困境退出
        - 立即回避；监测 down-round 信号或领导层离职
      - - NVIDIA 加速 hyperscaler CPO 集成
        - NVIDIA 或主要 hyperscaler 宣布原生封装上光子方案在 2026 年下半年出货
        - Olix 的可寻址市场急剧收窄到边缘或专业推理细分
        - 重新评估可寻址机会规模；不自动杀死论点，但会实质性压低上行空间
      - - 领投方下调估值，或过桥轮估值持平 / 下调
        - 2026-2027 年公开报道或推断出现持平 / 下调估值的过桥轮
        - 市场信号显示内部人不再支撑 $1B+ 标记；清算优先权压力上升
        - 转为回避；优先权悬置让普通股接近无价值
      - - 竞争对手拿下推理工作负载的锚定 hyperscaler 合同
        - Groq、Positron 或基于 NVIDIA Rubin GPU 的系统与目标 hyperscaler 签署独家或优先供货协议
        - DX-1 出货前，Olix 就失去滩头客户
        - 重新评估产品差异化主张；可能需要转向其他客户细分
      - - 创始人 CEO 离职或领导层出现重大动荡
        - James Dacombe 离开 Olix CEO 职位，或活跃投入降至 50% 时间以下
        - 公司失去创始人驱动的技术能力和投资人关系能力，而这正是本轮融资的理由
        - 治理风险高；任何资金部署前，先索取董事会构成和继任证据
    notes: 触发器按事件监测，并在季度证据复核时更新。阈值为近似值；具体情境重要。
    claimRefs:
      - CV025
      - CV028
      - CV029
      - CV031
      - CV032
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 晶圆厂 tapeout 状态
        - 没有公开确认的 tapeout 日期、节点或晶圆厂伙伴
        - 验证芯片设计完整性和生产时间线；没有该证据，DX-1 2027 年出货目标完全是猜测
        - 管理层直接披露；TSMC 或 GlobalFoundries 客户名单（受限）
      - - 设计导入管线
        - 公开域没有 LOI、NDA 或概念验证客户互动
        - 判断 Olix 是否获得终端客户对其性能主张的验证；若证据可信，建议可从跟踪转向买入
        - 向投资人披露的 NDA 保护材料；检查 Olix 法律顾问文件，寻找 Companies House 上潜在 NDA
      - - 股权结构和优先权堆栈
        - 清算优先权条款、参与型优先股状态和反稀释条款未披露
        - 判断基准和熊市情景下的真实投资人回报；标题 $1B 估值未必反映普通股可获得的经济权益
        - 条款清单 / 股东协议披露；Companies House SH01 文件寻找资本结构线索
      - - 2026 年现金消耗和跑道
        - Companies House 账目只到 2025 年 8 月；没有中期数据
        - 检验 $250M 融资能否覆盖到首笔收入；若每月 burn 为 $5M，Series A 完成后约有 50 个月跑道，但扩张到 200+ 人可能让 burn 翻倍
        - 投资人报告包；英国审计豁免门槛可能触发 2026 年完整审计申报
      - - OTPU 基准结果
        - 没有独立或公司发布的推理基准，无法与 H100/B200 或 Groq LPU 对比
        - 支撑吞吐 / 兆瓦和延迟主张，而这些主张撑起整个投资论点
        - 量产前芯片样品或仿真结果；MLPerf Inference 提交可作为未来里程碑
    notes: 尽调事项按对建议的重要性排序。第 1 和第 2 项是买入建议的阻断项。
    claimRefs:
      - CV004
      - CV006
      - CV036
      - CV037
      - CV038
