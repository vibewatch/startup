              Olix 必须同时完成几件事：开发具备足够 SRAM 容量的新型硅光子 die；与未披露的 OSAT 伙伴完成 CPO 组装认证，而整个制造环境里良率问题已经在拖延行业 CPO 量产；接入按 GPU-first
              节奏推进的开源 serving 框架；并处理同时约束人才和客户池的美国出口管制。每一项单独看都是重大挑战；叠加之后形成高风险执行画像，这在光子芯片初创公司中常见，但很少能高速成功穿越。
