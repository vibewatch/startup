      - number: '5.2'
        title: 软件栈兼容性与开发者集成
        blocks:
          - type: paragraph
            body: >
              Olix 的平台集成招聘确认，DX-1 的软件层被设计为接入主流开源推理栈，而不是要求专有 runtime。Senior Platform Integration Engineer 职位说明点名
              vLLM、SGLang 和 NVIDIA Dynamo 作为目标 serving 框架，并预期工程师会把这些框架扩展到 DX-1 硬件上。KV-cache 管理由 NIXL 和 Mooncake TE
              承担；这两种新兴协议服务于分离式 prefill 与 decode，使 prefill 计算和 decode 计算可以跨不同硬件分区拆开。集群通信目标是 NCCL、RoCE 和 InfiniBand，这意味着
              DX-1 设计上会与现有基于 GPU 或 CPU 的 prefill 节点在异构集群中协同运行，而不是作为完全自包含系统。

              这套软件策略在技术上成立：vLLM 是最活跃的开源推理项目之一，来自学术机构和公司的贡献者超过 2,000 名；SGLang 在 2026 年初于 NVIDIA GB300 NVL72 上实现 3.8×
              prefill 和 4.8× decode 吞吐提升，展示了快速迭代能力。两个框架都开放硬件插件架构；Intel Gaudi、IBM Spyre 和 Huawei Ascend 都是已集成进 vLLM 的非
              NVIDIA 硬件例子。这给了 Olix 一条可信集成路径——但它需要自定义 kernel 开发、HAL 层工作，并在这些框架按 GPU-first 节奏演进时持续维护 upstream。

              关键缺口在于，截至 2026 年 6 月，Olix 没有公开记录显示其向 vLLM、SGLang 或相关框架贡献过开源代码；且 DX-1 仍处于 pre-silicon 阶段，软件集成尚未经历
              hardware-in-the-loop 验证。因此，Olix 的开发者社区信号是间接的：目标框架活跃且可接入，但 Olix 还没有以硬件供应商身份，凭已验证驱动或公开 benchmark 在这些社区建立存在感。
