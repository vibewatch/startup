      - number: '1.5'
        title: 负面信号与开放尽调问题
        blocks:
          - type: paragraph
            body: >-
              Olix 的承诺位于一个战略上很有吸引力、但运营上极不宽容的技术栈中。官方材料自己强调，一家初创公司无法现实地按巨头条件争夺 HBM 和先进封装产能，所以 Olix
              试图绕开这些卡点。这个论证在逻辑上成立，但也等于承认：主流 AI 硬件供应链仍有结构性约束，Olix 选择新架构，部分原因是标准路径难以进入。


              独立市场评论强化了这种谨慎。Siemens 2026 年 co-packaged optics 说明称，功耗、热管理、测试、良率和互操作性在 2026-2027 年仍是生态瓶颈。Edgen
              援引供应链报道称，由于良率仍然过低，CPO 大规模量产不太可能在 2026 年之后很快实现。CNBC 2026 年 5 月下旬的光子专题用更宽的方式给出同一判断：用光缓解 AI
              瓶颈是行业最有意思的方向之一，但商业化相对既有 GPU 生态仍处早期。即便 Olix 的具体架构不同于以交换芯片为中心的 CPO 路线图，制造和生态预警仍然重要，因为 Olix
              正在从同一个不成熟供应链中招聘光互连、封装和系统集成人才。


              第二个尽调问题是治理透明度。Companies House 揭示了桌边坐着谁、何时加入，却不揭示职位背后的经济权益。资本结构、股权集中度、客户承诺、晶圆 / fab 安排，以及 2026
              年融资所绑定的里程碑仍是私人信息。对早期 deep-tech 公司来说，这可以接受，但也意味着后续投资判断必须显式处理不确定性，而不是假装精确。
