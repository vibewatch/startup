      - number: '3.3'
        title: 电学推理 ASIC 与 hyperscaler 自用硅片
        blocks:
          - type: paragraph
            body: |
              Groq 是当下最成熟的电学推理替代品。它的 Language Processing Unit
              是一款电学 ASIC，采用 tensor-streaming 架构，专门为低延迟 LLM 推理
              和解码设计。Groq 于 2025 年 9 月以 $6.9 billion 估值融资 $750 million，
              投资方包括 Disruptive Investments、BlackRock、Samsung、Cisco、D1 Capital
              和 Altimeter Capital，并报告 2025 年收入约 $500 million。2025 年 12 月，
              Groq 与 NVIDIA 签署非独家推理技术授权协议，联合创始人 Jonathan Ross
              转入 NVIDIA；Simon Edwards 出任 CEO。GroqCloud 服务超过 200 万开发者，
              覆盖四个全球推理区域，并提供本地部署的 GroqRack 选项。截至写作时，Groq
              针对 200 亿参数开源模型的 LLM 定价为每百万输入 token $0.075、每百万输出
              token $0.30，速度约 1,000 tokens/sec；1200 亿参数模型分别为 $0.15 和
              $0.60，速度约 500 tokens/sec。NVIDIA 授权关系并未消除 Groq 的商业独立性，
              但压缩了其 IP 差异化叙事，并增加了与巨头绑定的风险。

              Etched 用另一条路线瞄准同一推理负载：名为 Sohu 的硬编码 transformer ASIC，
              无法重新编程，但声称在 transformer 推理工作负载上吞吐超过 NVIDIA H100
              二十倍。高管团队组合了 Harvard 数学背景（CEO Gavin Uberti）、Cypress
              Semiconductor 校友（CTO Mark Ross）和二十多年 NVIDIA 设计经验（VP Brian
              Loiler）。Etched 尚未发布商业定价或出货时间线；如果模型架构演进到
              transformer 范式之外，其 transformer 硬编码架构会面对所有固定功能 ASIC
              都有的模型灵活性风险。

              Hyperscaler 自用硅片——AWS Inferentia2、Google TPU、Meta MTIA——本质上是在
              缩小可寻址市场，而不是与商用硅片竞争。AWS Inferentia2 在公开客户 benchmark
              中实现了比 GPU 实例高 4.5 倍的吞吐，并把推理成本降低 90%。Google Cloud TPU
              自 2018 年起已进入商业部署，并支撑 Google 自身 AI 推理工作负载的相当一部分。
              每一个自建推理 ASIC 的 hyperscaler，都会永久减少包括 Olix 在内的任何商用
              推理硅片厂商可触达的市场空间。
