      - number: '2.4'
        title: 增长驱动、采用约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Olix 所在市场的首要需求驱动，是 AI 数据中心的电力与能源危机。IEA 的 Energy and AI 专题报告预计，数据中心用电需求到 2030 年将增加一倍以上至 945 TWh；AI
              优化设施的用电量将扩大四倍。在美国，数据中心预计将贡献 2030 年前近一半的电力需求增长。这些约束制造了结构性动机：市场需要每 token 能效显著更好的推理硬件——这正是光子架构的核心价值主张。Data
              Center Frontier 对 IEA 数据的分析指出，到 2026 年，AI 行业用电量预计将达到 2023 年的十倍；仅 NVIDIA 在 2024 年生产周期出货的 AI 服务器，年耗电量就约 7.3
              TWh。


              最大的采用约束，是行业巨头已经描述过的成熟度顺序。Broadcom CEO Hock Tan 明确提出两波模型：第一，铜基机架级互连必须先被推到极限；第二，可插拔光模块要成熟；只有到那之后，硅光子和 CPO
              的经济性才会显现。Broadcom 已拥有 $73 billion 的定制 AI 加速器订单 backlog，其中来自 hyperscaler 的定制 XPU 订单超过 $50
              billion，说明巨头并没有等待光子方案。第二个约束是制造就绪度：edgen.tech 报道，CPO 因良率问题量产推迟到 2026 年之后；Siemens CPO 分析也确认，硅光子制造波动高于成熟 CMOS
              工艺，良率偏离会放大成本冲击。DARPA 于 2026 年启动、资助 $35 million 的 PICASSO
              计划明确承认，光子电路由于光衰减、噪声和杂散波干扰，很难在系统层面展现相对电子系统的性能优势——这是基础物理约束，不只是工程缺口。


              尽管存在这些约束，结构性需求驱动仍有利于最终采用：hyperscaler 资本承诺的规模（仅 Alphabet 和 Microsoft 每年就 $180–190 billion）、推理 token
              量的指数级增长，以及能效压力，都会形成长期拉力。关键尽调问题是，Olix 能否及时跨过客户认证和制造就绪门槛，赶上 2027–2028 年 hyperscaler 预算周期。
