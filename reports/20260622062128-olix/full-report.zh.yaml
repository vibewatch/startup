      - number: '1.2'
        title: 创始人、董事与治理信号
        blocks:
          - type: paragraph
            body: >-
              核心关键人事实很直接：James Robert Dacombe 创立公司，自注册以来一直是 Companies House 记录中唯一连续任职的董事，也是融资叙事中公开出现的创始人。Companies House
              记录显示，他于 2024 年 3 月 22 日获任；媒体报道反复称他是 25 岁创始人，也是推动 Olix 反共识计算战略的 CEO。这个组合让 Dacombe 既是募资资产，也是执行上的单点依赖。


              2025-2026 年融资窗口前后，治理结构迅速成熟。Companies House 的高管名单和申报历史显示，Jonathan Heiliger 于 2025 年 6 月加入，Taavet Hinrikus 于
              2025 年 10 月加入，Firat Ileri 和 Professor Nicholas McKeown 于 2026 年 2 月加入；2026 年 2 月 10 日的董事变更移除了 David
              Helgason 和 Krishna Visvanathan。Saul Klein 也出现在现任高管名单中。结合外部履历看，这套董事和董事会阵容把 Olix
              连接到基础设施、欧洲创投和网络领域的强资源：Heiliger 曾领导 Facebook 基础设施，Klein 是长期欧洲种子投资人和运营者，McKeown 是 Stanford 网络教授，Hinrikus
              是知名欧洲创始人投资人。


              公司自己的招聘与文化材料又给出第二个治理信号：Olix 刻意打造高强度、线下办公文化，提供有意义的股权、每年 £24,000 的本地生活补贴，甚至为不匹配的员工在三个月节点提供 18 周带薪退出。这可能增强艰难
              deep-tech 搭建期的团队对齐，但也说明公司高度依赖在异常苛刻的运营规范下招聘并留住顶尖技术人才。
