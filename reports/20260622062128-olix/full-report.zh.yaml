      - number: '3.2'
        title: 光子计算与光互连同行
        blocks:
          - type: paragraph
            body: |
              Lightmatter 是 Olix 最接近的架构同行，但比较下来，差异多于重叠。
              Lightmatter 自称「Photonic Supercomputer Company」，已发布三条
              产品线：Passage（光子互连 chiplet）、Envise（光子计算平台）和
              Idiom（ML 框架与图编译器）。Passage 在 1 到 16 个或更多波长上
              以每 lane 56 到 448 Gbps 运行，采用公司称为「Edgeless I/O」的
              3D 集成。Lightmatter 称当前带宽能力为 114 Tbps，路线图将提升到
              每秒超过 1 petabit，并与 TSMC、GlobalFoundries、Tower Semiconductor
              建立代工关系。与 Olix 的关键差别在于，Lightmatter 的商业牵引和
              公开叙事集中在光子互连；Envise 的计算加速层尚未证明 Olix 的 OTPU
              和 DX-1 公开瞄准的 SRAM 中心、decode-heavy 推理专精。

              Ayar Labs 的位置更互补，而非直接竞争。它出货基于 UCIe 互连标准的
              TeraPHY 光 I/O chiplet，在等效功耗下提供约为铜互连十倍的带宽；
              SuperNova 则提供片上激光源。公司 2026 年 3 月完成 $500 million
              Series E，估值 $3.75 billion，并在 2026 年 6 月加入 NVIDIA NVLink
              Fusion 生态。NVIDIA、AMD、Alchip 和 MediaTek 都是投资人。Ayar Labs
              是 chiplet 供应商，不是系统厂商；hyperscaler 把 Ayar Labs TeraPHY
              chiplet 与第三方 AI 处理器一起部署时，仍可能是 Olix 的潜在客户。

              Intel Silicon Photonics 自 2016 年以来已出货超过 800 万颗光子集成
              电路，并将超过 3200 万个片上集成激光器嵌入可插拔收发器，是硅光子
              可靠性的量产制造标杆。其 OCI chiplet 提供每秒 4 terabits 双向带宽，
              设计用于与 CPU、GPU 和 IPU 硅片 co-package。Intel 的成熟度验证了
              光子制造可以规模化，但也说明成熟供应链产能集中在巨头手里，而不是
              光子 AI 计算初创公司。
