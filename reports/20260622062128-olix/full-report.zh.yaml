  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: wide
    summary: |
      从市场、产品、风险、估值四类证据推到「跟踪」建议，并列明估值重评条件。
    data:
      nodes:
        - id: mkt
          label: 市场：AI 加速器 $94B（2025）→ $257B（2033）；2026 年 Q1 光子投资浪潮
        - id: prod
          label: 产品：OTPU 架构有新意；尚未流片；目标 2027 年出货；相较 Groq/Positron 仍有竞争差距
        - id: risk
          label: 风险：高 — 良率、资本强度、NVIDIA CPO 风险、单一创始人依赖
        - id: val
          label: 估值：投后 $1B+；尚无收入；相较已有产品牵引力的可比公司偏高
        - id: rec
          label: 建议：跟踪 — 关注流片确认 + 设计定点 LOI 作为估值重评催化剂
        - id: buy_trigger
          label: → 买入：若代工厂流片确认且披露 ≥1 份一级客户 LOI
        - id: avoid_trigger
          label: → 回避：若确认错过 2027 年出货，或出现降估值融资信号
