  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标买方分层与市场定位
        blocks:
          - type: paragraph
            body: >
              Olix 公开材料没有点名任何客户，但公司的计算宣言和招聘规格一致指向一个狭窄、资本密集的买方群体。宣言把问题表述为「即便是最具主导地位、在硅、软件和供应链上拥有全栈控制的玩家，也无法解决」。这一定义把大型
              hyperscaler 和云运营商——唯一在所需规模上同时拥有硅、软件和供应链的组织——锁定为 Olix 面向的受众，也隐含为初始目标买方。平台集成工程师职位描述说得更明确：该岗位是「OLIX 如何作为
              hyperscale AI infrastructure 服务大模型的技术权威」。

              证据中可以看到三层买方。第一，Tier-1 hyperscaler（Google、Microsoft、Amazon、Meta），它们运营每天数十亿 token
              规模的自有推理集群，既有评估新型硅片的技术深度，也有吸收多年认证计划的资本。Broadcom Q4 FY2025 财报披露，来自 hyperscale 客户的定制 AI 加速器订单积压超过 $50
              billion，说明这类买方的基础设施资本强度。第二，inference-as-a-service 云供应商——CoreWeave、Lambda Labs 等——购买 GPU 和加速器容量，再以 API
              endpoint 转售。这类买方在结构上有动力采用更低 cost-per-token 的替代方案，只要产品能通过认证，因为其商业模式按 token 定价。Groq 2025 年 9 月以 $6.9 billion
              估值融资 $750 million，当时已在自有 LPU 架构上服务超过 200
              万名开发者，证明专用云推理供应商一旦硬件进入生产，可以快速放大。第三，企业私有云运营商，它们在本地运行大模型推理工作负载，但采购周期更长，首单金额也小于 hyperscaler。

              Olix 明确在宣言中表示避免 QAT/PTQ 模型量化，这会预先筛选买方：更可能是运行 frontier-model 推理、使用全精度或轻量量化权重的客户，因此偏向 hyperscaler
              和大型推理云，而不是边缘部署或 SMB AI 运营商。Olix 每个招聘岗位中的出口管制措辞排除了部分地域的就业资格，也隐含提示初始客户关系预计会在哪里建立：英国、欧盟、美国及盟友市场。

              所审查来源中没有任何披露的客户 pipeline、意向书或 design-win 公告。缺少客户证明本身就是这一阶段的重大信号：hyperscaler 硅片决策周期从初始接触到生产承诺通常需要 12–24
              个月，而截至 2026 年 6 月，Olix 尚未完成首颗硅片 tape-out。首笔商业收入在结构上被锁在 2027 年产品交付目标之后。
