  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与上一轮估值框架
        blocks:
          - type: paragraph
            body: >
              Olix 2026 年 2 月 Series A 完成 $220 million 融资，由 Hummingbird Ventures 领投，Plural、LocalGlobe 和 Entrepreneurs
              First 参投。媒体报道显示投后估值超过 $1 billion，使 Olix 成为最快达到独角兽地位的英国初创公司之一——从 2024 年 3 月成立到这一里程碑约 24 个月。若计入估计 $25–30
              million 的种子轮和 pre-seed 融资，累计融资约 $250 million。Companies House 备案历史记录了 2026 年 3 月 5 日配股后的 statement of
              capital，总资本为 GBP 287.8572，确认融资已完成且新股已发行。截至 2025 年 8 月 31 日编制的 total exemption
              accounts——公开记录中唯一法定账目——只披露资产负债表数据，并未记录运营收入。

              last-round-price 方法把当前标记锚定在 $1 billion，意味着投资人为得出与 $220 million primary 一致的投后估值，隐含接受约 22 percent
              稀释。实践中，优先股结构包含 liquidation preferences，但规模和类型并未公开；因此在低于 headline 的退出情景下，普通股和创始人持股价值可能远低于 headline 暗示。$1
              billion 投后估值约为总投入资本（约 $250 million 已融资）的 4×，这一覆盖倍数符合 2026 年 Q1 全球中期深科技硬件轮次——SemiEngineering 统计，2026 年 Q1 有
              80 家半导体初创公司融资超过 $8.4 billion，其中 18 轮超过 $100 million。光子领域在该季度仍是「popular segment for investment」。

              投资人似乎给两类价值定价：（1）OTPU 在推理市场围绕 NVIDIA Blackwell 或后续产品固化前投入生产的战略期权价值；（2）M&A 期权价值，即 hyperscaler 和 incumbent
              芯片公司收购光子能力——证据包括 Marvell 在 2026 年初收购 Polariton Technologies（基于 plasmonics 的硅光子），以及 NVIDIA 宣布向
              Lumentum、Coherent、Marvell、Corning 等光子公司投入约 $2 billion，并参与 Ayar Labs 的 $500 million Series E。这些投资的频率和规模，为
              Olix 的资产提供了一个可信战略底线，前提是 OTPU 论点在退出时至少部分成立。
