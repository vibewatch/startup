    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、成立与产品论点
        blocks:
          - type: paragraph
            body: >-
              Olix 的运营主体是 OLIX Computing Limited，这家英国私人公司于 2024 年 3 月 22 日注册，2026 年 1 月 19 日由 Flux Corp Ltd 更名。注册地址在 St
              Albans，但融资轮前后所有面向公众的运营描述都称公司总部在伦敦；招聘网站显示，公司在英国的伦敦、Bristol，以及北美的 Austin、San Francisco、Toronto
              招人。这个差异在尽调中很重要：法律实体年轻、披露很轻，而市场身份已经是伦敦 AI 硬件独角兽。


              公司选择的产品论点不同于标准 GPU 挑战者。官方材料称，Olix 希望用 SRAM 中心内存设计叠加光子技术，为「frontier AI」建设基础设施，避开对 HBM 重型加速器架构的依赖。公开材料同时提到
              Optical Tensor Processing Unit（OTPU）和 OLIX Decode Accelerator 1（DX-1）；宣言和职位页面都称系统专门面向推理和 decode-heavy
              工作负载。官方与第三方来源传递的核心信息一致：Olix 认为现有加速器迫使用户在吞吐和交互性之间付出高成本取舍，而光子、机架级架构有机会打破这个约束。


              因此，Olix 的高确信身份可信，但也暴露公司仍处在很早期。公司把论点、目标产品族和招聘议程讲得很清楚，却很少给出生产指标、客户胜利或已出货硅片。对一家 2024 年成立的 deep-tech
              初创公司来说，这种不对称并不罕见，但后文评估商业化风险时必须保留这一点。
