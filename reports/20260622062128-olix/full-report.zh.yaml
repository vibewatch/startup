  - id: FU001
    title: 客户旅程图——超大规模云厂商采用新型 AI 推理芯片
    type: journey-map
    layout: wide
    summary: |
      描绘超大规模云厂商买方从最初认识新型推理加速器到生产部署的各阶段，并把 Olix 当前状态定位在流片前评估关口。
    data:
      nodes:
        - label: 认知 / 任务授权
          detail: |
            超大规模云厂商基础设施团队发现现有 GPU 集群的每瓦吞吐存在缺口；内部团队或外部分析师将光子推理标记为新兴架构选项。
        - label: 供应商评估
          detail: |
            向候选加速器供应商发送 RFI；以 NVIDIA、AWS Inferentia、Google TPU 和 Groq 等既有方案作为竞争基准。
        - label: 原型与集成
          detail: |
            内部评估量产前硅片；完成并验证接入 vLLM / SGLang 推理栈的软件集成；完成可靠性和热特性表征。
        - label: 硅片认证
          detail: |
            12–24 个月的供应链审计、良率验证、可靠性测试和采购谈判；采购订单前的正式质量关口。
        - label: 生产部署
          detail: |
            首张生产采购订单和机架级部署；跟踪性能 SLO、每 token 成本基准和运营指标；6–12 个月后决定扩张或流失。
        - label: Olix 当前位置（2026 年 6 月）
          detail: 流片前；FPGA 原型阶段；未披露正式超大规模云厂商接触
        - label: 评估阶段关键阻塞
          detail: 没有 MLPerf 结果；没有基准数据；未确认 vLLM 上游集成
        - label: 原型阶段关键阻塞
          detail: 首次硅片流片尚未完成；CPO 良率和热风险未解决
        - label: 认证阶段关键阻塞
          detail: Broadcom CEO：光子技术短期内不会到来——买方就绪度才是关口，不只是产品就绪度
        - label: 生产阶段扩张触发点
          detail: 12 个月内必须拿下第二个客户，才能避免集中度风险
    approximationNotes: |
      旅程图由行业标准的超大规模云厂商硅片采购模式、Olix 公开材料和 Broadcom 2025 财年第四季度业绩会构建。Olix 未披露具体接触时间表；所有阶段时长均由可比项目估算。
    claimRefs:
      - CU001
      - CU013
      - CU019
      - CU020
      - CU021
      - CU022
