      - number: '4.3'
        title: 资本充足性、融资时间线参考与 runway 情景
        blocks:
          - type: paragraph
            body: >
              Olix 最近一次披露融资，是 Hummingbird Ventures 领投的 $220 million 轮次，于 2026 年 2 月 11 日宣布，并由 Cooley
              及多家独立媒体报道。媒体报道显示，公司累计融资约 $250 million，意味着此前从 Plural、Vertex Ventures、LocalGlobe、Entrepreneurs First
              等投资方合计募集约 $30 million。详细融资时间线（各轮金额与日期）放在「公司概览」章节；本节只为这里的资金充足性分析，新增所需资本事实的「财务」主张。


              Hummingbird 自己对策略的描述值得纳入判断：该机构称自己是全球种子期投资者，初始支票从 $500K 起，并会在后续轮次中继续投入 $50M-plus，为深科技发展的高风险阶段提供有耐心的长期资本。这让
              Hummingbird 成为一场多年、收入前建设周期里的可信共同投资方，但如果技术里程碑滑坡，或竞争环境发生实质变化，并不能保证它会继续支持。


              资金充足性表格用上一节推导出的烧钱率估计，建模了三种 runway 情景。基础情景下（当前 70 人团队，月烧钱约 $3M），$220M 可支撑约 73 个月，现金可覆盖到约 2032 年，远超 2027
              年产品目标。但 Olix 已明确表示计划在 2026 年扩张到 200-plus 名员工；一旦执行，月烧钱会升至 $5–8M/月，$220M 的有效 runway 会缩短至约 27–44 个月（约 2028
              年中至 2029 年中）。再叠加一次重大 tape-out 周期（$20–50M），runway 会进一步压缩到 15–30 个月（覆盖至 2028 年初至 2028 年中）。这些情景表明，按当前计划，Olix
              很可能需要在 2028 年底前再融一轮，具体取决于 tape-out 时点和运营规模。


              可比 AI 推理芯片初创公司提供了有用参照。Groq 于 2025 年 9 月以 $6.9 billion 估值融资 $750 million，说明已验证的 AI 推理平台仍可获得大额后续融资。Ayar Labs
              在 2025 年完成 $500 million Series E，用于 production-ready CPO 硬件，战略投资方包括
              NVIDIA、AMD、MediaTek——说明只要生产里程碑被清楚跑通，半导体光子公司可以吸引大额后续资本。Fractile 是另一家英国推理芯片初创公司，2026 年 5 月宣布完成 $220 million
              Series B，确认处在类似阶段的英国深科技芯片公司也能拿到可比资本。Olix 能否在更长、更烧钱的产品开发弧线中维持类似投资者信心，高度取决于技术里程碑执行。


              Companies House 备案显示股本约 GBP 288，反映出英国风投支持公司常见的 fractional penny-share 结构：为容纳复杂 cap
              table，股权以大量小面额股份发行。这对经济估值没有分析价值，但确认公司采用标准风投结构。2026 年 3 月 21 日提交的确认声明（CS01），以及截至 2025 年 8 月 31 日财年的 total
              exemption full accounts，是目前可公开验证的财务信息边界；账目提供资产负债表，但隐藏了收入、运营成本和亏损。
