      - number: '7.4'
        title: 治理、人员与论点击穿标准
        blocks:
          - type: paragraph
            body: >
              治理风险集中在一个人身上：James Dacombe 在 2026 年 2 月融资时 25 岁，自公司成立以来一直是唯一连续任职董事，也是 Olix 整体战略的公开面孔。媒体报道和公司材料把 Dacombe
              同时定位为光子论点的智识架构师，以及负责执行的首席执行官。没有公开证据显示公司有具备 AI 芯片产品交付经验的联合创始人、CTO 或 COO。董事会包括经验丰富的运营者——Jonathan Heiliger（前
              Facebook infrastructure）、Nicholas McKeown（Stanford 网络教授）和 Taavet Hinrikus（Transferwise
              联合创始人兼投资人）——但董事会监督不能替代深科技运营团队。Olix 自己的文化材料承认这场建设要求极高：对不匹配员工提供 18 周 paid exit 条款，说明公司知道人才匹配和留存很脆弱。


              光子和化合物半导体工程师是全球最稀缺的专才之一。公司招聘页显示岗位横跨 optics、photonic packaging、FPGA、ASIC、manufacturing operations 和 process
              integration——这套招聘议程必须从极薄的人才池中招人。UKtech.news 和 IDCNova 关于 2026 年 2 月融资的报道提到，公司计划从 70 人增长到 200-plus 人，意味着
              Olix 必须在竞争激烈的劳动力市场中把团队规模接近翻三倍，然后才能交付首个产品。


              风险登记表中可以识别出论点击穿标准：（a）如果到 2026 年底仍未展示具备可接受光子良率的硅光子 tapeout，首次出货会被推迟到 2027 年之后，并进入资本 runway 危险区；（b）如果到 2027
              年中仍未拿下首个具名 hyperscaler design-in，说明 DX-1 没有通过企业采购门槛；（c）若 BIS 执法行动或 NSI Act
              阻止令阻断关键供应链交易或收购退出，结构上应判为不合格；（d）若前三大 hyperscaler 中任意两家宣布 AI infrastructure CapEx 下调 40-percent 或以上，会侵蚀支撑
              Olix 2027 年时间线的需求论点。投资人应要求 Olix 在下一次融资事件前，以合同方式披露 tapeout 状态和 foundry partner。
