      - number: '7.2'
        title: 监管、法律与出口管制风险
        blocks:
          - type: paragraph
            body: >
              Olix 面临三类不同的监管与法律敞口。第一，美国 Bureau of Industry and Security（BIS）对 advanced computing integrated circuits
              的出口管制正在明显收紧。截至 2026 年 6 月，BIS 主页确认，向总部位于 Country Group D:5（包括中国）或 Macau
              的实体，或最终母公司位于这些司法辖区的实体出口先进计算项目，需要许可证——即便最终收货地点在其他地方。BIS 还把 Authorized IC Designer 合规时间线延长至 2026 年 12 月 31
              日，让公司有更多时间提交申请，但这一延长本身确认制度已生效且适用。一家英国光子 AI 芯片公司如果想卖入美国邻近云基础设施，或直接卖给美国总部
              hyperscaler，就必须确认其供应链和终端客户基础不会产生许可证敞口；考虑到 Olix 架构需要先进 foundry 工艺和可能触及 dual-use 设备分类的光子组件采购，这并不简单。


              第二，英国 National Security and Investment Act 2021（NSI Act）赋予英国 Secretary of State 广泛权力，可在十七个敏感行业中 call
              in、审查并阻止收购——半导体和先进材料被明确列入。任何考虑收购 Olix 的投资人或科技公司，一旦持股超过特定门槛，NSI Act
              合规就是强制要求。这一审查机制可能延迟或阻止战略退出，应作为重大风险向投资人披露。它还意味着，如果任何外国政府关联实体试图取得重要股权，Olix 的治理会受到英国国家监督。


              第三，知识产权风险较高，因为 Olix 未披露任何已授权专利组合，而竞争对手 Lightmatter 持有关于光子矩阵乘法和光互连架构的已公开专利。截至 run date，UK IPO 检索和 EPO
              register 没有在「Olix」或「OLIX Computing」名下显示重大已授权专利，尽管早期专利申请可能正在推进。NIST 的 AI Risk Management Framework 和英国政府
              2023 年 3 月发布的 pro-innovation AI regulation 白皮书构成监管背景，但二者都没有为 AI 芯片硬件初创公司引入短期许可义务。
