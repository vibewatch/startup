      - number: '8.4'
        title: 附录
        blocks:
          - type: callout
            title: 建议 — 跟踪
            body: >
              Olix 是一张押注突破性光子 AI 计算架构的高信念期权，背后有可信投资人和技术野心很强的创始团队。但在 $1 billion
              投后估值下，公司没有收入、没有确认流片，公开领域也没有客户承诺；这个估值已经把一串仍完全未经验证的执行里程碑计入价格。建议是跟踪——保持密切监控，一旦确认代工厂流片或一级设计导入意向书，立即重新评估。若没有上述两项证据中的至少一项，不应按当前估值或更高估值投入资本。
            calloutType: recommendation
