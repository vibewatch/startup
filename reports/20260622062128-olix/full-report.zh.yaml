      - number: '1.3'
        title: 融资历史、投资人组合与披露边界
        blocks:
          - type: paragraph
            body: >-
              最强的已验证融资事实来自 Cooley 2026 年 2 月 11 日公告：Cooley 为 Olix 一轮 $220 million 融资提供法律服务，该轮由总部位于伦敦的 Hummingbird
              Ventures 领投，对公司的估值略高于 $1 billion。SiliconANGLE、Jon Peddie Research、IDCNova、Tech Funding News 等报道复述了大致相同条款，使
              2026 年 2 月这一轮成为后续所有估值和 runway 讨论的锚点。媒体还称，公司此前获得 Plural、Vertex Ventures、LocalGlobe、Entrepreneurs First
              支持，并将总融资额放在约 $250 million。


              同样重要的是看不见的部分。Olix 仍是一家英国私人公司，没有公开股票研究，没有公开债务披露，没有披露二级交易，也没有随融资发布收入或客户指标。Companies House 申报显示，2026 年 1 月至 5
              月围绕资本和治理出现多份文件，包括股份配发、章程采纳、股份权利变更和优先购买权变更，但公开表面仍无法拼出可用 cap table 或投资人持股拆分。


              不过，投资人名单方向上很强。Hummingbird 将自己定位为愿意写大额 follow-on 支票的全球种子投资人；Olix 周边与董事会相连的参与者还包括 Plural、Phoenix
              Court/LocalGlobe、Vertex 和 Stanford 生态人物。这个组合意味着，Olix 比许多欧洲硬件初创公司更早获得了确信资本和运营者监督。但更深财务披露缺位，意味着 syndicate
              质量不能替代商业牵引证据。
