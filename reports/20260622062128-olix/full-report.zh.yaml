      - number: '6.3'
        title: 客户证明缺失、留存结构与集中度风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Olix 的客户证明状态是二元的：公开披露客户为零，披露试点为零，披露意向书为零，披露 design win 为零。SiliconAngle 指出，「it's unclear what
              optical components are included in the processor or how they're
              used」，反映即便在专业技术记者中，面向客户的技术主张也整体不透明。率先报道融资消息的 Financial Times 提到，Olix 预计 2027
              年开始向客户出货芯片，并把这视为管理层目标，而不是合同承诺。

              由此产生的结构性风险是集中，而非多元。当 Olix 拿下首个客户时，该账户实际上会定义公司 100% 收入。如果客户是 Tier-1 hyperscaler，这段关系将受该 hyperscaler
              标准供应条款约束，通常包括需求波动条款、多源采购要求，以及对客户署名的排他限制。如果首个客户是 inference-as-a-service
              供应商，关系会更透明，但收入规模更小，也更暴露于该供应商自身客户流失。在任一情景下，单一 anchor customer 都会构成关键集中度风险，直到第二、第三个客户关系成形。

              留存指标——net revenue retention、gross revenue retention、churn rate、repeat purchase rate、contract
              duration——完全不可得，因为还没有生产收入。Amazon 产品页上的 AWS Inferentia 客户证言展示了定制 AI 推理芯片在多年生产部署后的结果（NTT PC Communications
              实现 4.5× 吞吐、25% 更低延迟、90% 更低成本），可作为芯片供应商达到商业规模后留存证据应呈现什么样的参照；Olix 距离这个阶段还有数年。Groq 的客户名单说明了 reference-quality
              问题：其案例研究点名 Willow（实现零停机和响应快 500 ms）、PGA of America 等，且都依赖已生产、已部署并在生产环境运行的硬件。

              Broadcom CEO 记录下来的光子特定买方迟疑，是市场时点上最直接的反向信号：有能力吸收 Olix 产品的买方，尚未相信光子是必要采购。这形成了依赖窗口的销售论点——Olix
              需要买方先相信光子转型，且要赶在资金充足的 incumbents（NVIDIA、Broadcom 或 hyperscaler 自有团队）补上同一架构缺口之前。2026–2027
              年因此是关键市场时点窗口：早期客户对话和 design-win 披露会显著降低商业论点风险；如果客户进展到 2027 年仍持续沉默，这一缺口会升级为阻断性尽调问题。
