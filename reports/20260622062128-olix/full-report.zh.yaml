      - number: '2.3'
        title: 买方、用户与付款方拆分
        blocks:
          - type: paragraph
            body: >-
              Olix 初始商业化阶段的潜在买方，很可能集中在 hyperscaler 和大型云服务商。这些客户的推理资本强度足够高，才有理由承受非标准硅片认证周期。Meta 2026 年 Q1 单季度资本开支为 $19.8
              billion，并将 2026 全年指引上调至 $125–145 billion。Alphabet 2026 年 Q1 capex 约 $35.7 billion，全年指引为 $180–190
              billion。Microsoft FY2026 总 capex 预计约 $190 billion。这些承诺说明，早期采用者的主要约束不是预算，而是认证风险和生态就绪度。


              在 hyperscaler 推理硅片采购周期里，买方通常是向基础设施 VP 或 CTO 职能汇报的基础设施或 AI 平台组织。用户是 ML 平台工程团队，他们要把加速器接入 vLLM、SGLang、NVIDIA
              Dynamo 等推理服务框架——值得注意的是，Olix 自己的招聘信息确认公司在为这些框架建设软件集成，说明它理解用户集成要求。付款方则是管理推理 cost-per-token 和总拥有成本的 Cloud and
              AI 损益职能。


              次级买方包括 inference-as-a-service 云服务商（CoreWeave、Lambda Labs、Together AI 及同类公司），这些公司已经表现出较早采用非 NVIDIA
              硅片的意愿；还包括明确建设本国计算能力的国家 AI 基础设施项目。NVIDIA FY2026 Q3 财报提到，「世界各国都在把 AI 视为关键基础设施」；Olix 总部所在的英国，也被点名为 NVIDIA
              及合作伙伴投资 £2 billion 建设下一代 AI 基础设施的市场。这个 national-champion 角度可能降低 Olix 在欧洲主权算力采购中的采用摩擦。
