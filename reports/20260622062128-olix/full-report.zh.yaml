  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与制造风险
        blocks:
          - type: paragraph
            body: >
              Olix 的光子推理芯片计划以 co-packaged optics（CPO）为核心；行业来源普遍把这项技术归为早期、高制造风险。Siemens EDA 2026 年 2 月 CPO
              分析指出四个叠加挑战：热管理（photonic IC 对温度高度敏感；AI
              工作负载的瞬时热波动会移动光波长并降低调制器效率）；测试扩展性（光学对准需要微米级精度，远严于电测试，使自动化量产测试成为主要瓶颈）；供应链不成熟（硅光子制造的工艺波动高于成熟
              CMOS，而共封装组件的良率波动会带来放大的成本冲击，因为共封装后几乎无法返工）；以及标准碎片化（CPO 互操作标准仍在 OIF 等机构推动下成熟，早期产品会与客户机架架构产生集成摩擦）。EdgeN 于 2026
              年发布的反向行业报告称，CPO 量产因良率问题面临 2026 年之后的延迟，从而验证了 Siemens 的风险判断。


              在这个背景下，Olix 没有披露任何 silicon tapeout 结果、良率数据或系统级演示。它宣称的 2027 年首次出货里程碑，需要在 2026 年 6 月 run date 之后约十二个月内，完成一家
              foundry partner（可能是 TSMC Specialty Technology）的完整硅光子 tapeout、与 OSAT 的共封装认证、软件栈集成，以及 hyperscaler 认证。TSMC 的
              foundry 技术页面确认硅光子作为 specialty process 提供，但公司没有公开披露光子良率路线图。ASML 的 EUV 光刻系统支撑全球先进半导体制造，是所有先进 foundry
              节点共同的上游依赖。供电是次级技术风险：Siemens 指出，到 2027 年，AI 数据中心电力需求预计全球增长 50 percent，且约 60 percent 数据中心能耗用于数据移动而非计算——这正是
              CPO 要解决的问题，但也会给 Olix 机架级设计带来极端热要求。
