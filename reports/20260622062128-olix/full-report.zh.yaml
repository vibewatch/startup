      - number: '1.4'
        title: 运营足迹、招聘信号与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Olix
              的公开运营足迹更多通过招聘显现，而不是客户披露。招聘中心列出的开放岗位覆盖光学、FPGA、ASIC、平台软件、法务、封装、制造运营和工艺集成；一家试图把光子计算论点变成可出货半导体系统的公司，本来就需要这样的职能宽度。具体职位页面还显示，Olix
              在设计芯片到芯片、tray 内部和机架级光链路，同时为 vLLM、SGLang、NVIDIA Dynamo 等分布式推理栈搭建软件集成。这是一个有意义的信号：公司在架构硅片和系统软件，而不只是做实验室原型。


              公开记录中的里程碑集中在三个阶段。第一阶段是 2024 年，公司以 Flux Corp Ltd 名义在 James Dacombe 旗下成立。第二阶段是 2025 年，公司扩张时完成治理扩充和地址变更。第三阶段是
              2026 年 1 月至 5 月，公司密集完成更名、融资、资本配发、新董事任命和招聘提速，并以 AI 基础设施独角兽身份进入公众视野。公开报道还反复指向 2027 年为首批客户出货目标。


              规模上仍有真实的测量缺口。Jon Peddie 和 Tech Funding News 称 Olix 已增长到 70 多名员工，并计划超过 200 人；但 Companies House
              可获得的最新法定账目只覆盖到 2025 年 8 月 31 日。因此，投资人有证据证明公司在扩张，但没有一份干净、经审计的运营仪表盘，能够把历史法定披露与当下招聘说法对齐。
