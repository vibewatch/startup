  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价结构与商业化时间线
        blocks:
          - type: paragraph
            body: >
              Olix 披露的产品是 OLIX Decode Accelerator 1（DX-1），一个机架级 AI 推理系统，整合 SRAM
              内存、光互连和定制逻辑。产品架构、招聘宣言措辞和第三方报道共同暗示，其商业模式是面向 hyperscaler、云服务商和 AI-first 企业销售硬件，这些客户需要低延迟、高吞吐的大规模推理能力。这把 Olix
              放在与 Groq（销售硬件和云 API 访问）及 Ayar Labs（向系统集成商销售 CPO 模块）同一类收入模型中；但截至本报告日期，Olix 尚未公开确认任何定价、客户名称、收入或合同 backlog。


              Olix 的计算宣言明确把 DX-1 与 HBM-based GPU
              架构在总拥有成本（TCO）和每兆瓦吞吐上对标，而不是对标名义芯片价格。这种表述符合企业硬件销售逻辑：买方评估的是总基础设施成本，不是芯片标价。Olix 还称其 SRAM 架构避开对
              HBM、先进封装和其他供给受限组件的依赖——如果兑现，这个供应链论点可能让 Olix 在低于现有 GPU 内存成本的价格上销售，同时守住健康毛利。SiliconANGLE 报道补充称，Olix
              计划用资本为芯片开发融资；Financial Times 通过 SiliconANGLE 报道，首批 OTPU 客户交付预计在 2027 年。


              商业化时间线制造了显著收入空窗。Olix 这个阶段的硬件初创公司，通常要等首颗硅片 tape-out 验证、首批生产单元出货、初始客户认证完成后，才会有经常性收入。这个序列几乎总会比目标交付日期再延长 12–24
              个月。对 Olix 而言，公开的 2027 年交付预期意味着最乐观也要到 2027 年末才可能确认收入，更可能的商业爬坡不会早于 2028 年。公司没有披露任何
              design-win、意向书或试点客户接触，也进一步限制了外部分析师可见的收入确定性。Olix 是否会进入
              inference-as-a-service（直接提供算力容量）仍未确认；如果选择这条路，盈利前周期会被拉长，资本强度也会因需要类似 GPU 集群的基础设施投入而大幅上升。
