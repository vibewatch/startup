  - id: financial-verdict-and-gaps
    title: Financial verdict and critical diligence blockers
    body: >
      Olix presents the profile of a well-capitalised pre-revenue deep-tech hardware
      startup: ample runway on paper, highly credible and well-compensated team, and
      a clear product thesis backed by $250 million in venture capital at a unicorn
      valuation. The core financial risk is not solvency in the near term but rather
      the cost-and-time exposure of photonic semiconductor development, where a single
      tape-out delay or yield failure can erase six to twelve months of runway and
      require an unplanned capital raise.


      Three adverse financial signals warrant diligence escalation. First, the Siemens
      CPO packaging blog and edgen.tech both document that co-packaged optics
      production faces persistent yield excursions that inflate unit costs above
      commodity CMOS baselines—Olix's SRAM-and-photonics architecture is precisely in
      this higher-variability zone. Second, Olix's compensation structure (£125–
      £180K base plus £24K local bonus, 18-week exit cushions) is generous even by
      London deep-tech standards; each talent-acquisition miss or culture-fit departure
      produces a real cash cost before any revenue. Third, Olix's statutory accounts
      for the period ending 31 August 2025 were filed under the total exemption
      regime, meaning that while a balance sheet exists, the profit and loss account
      and director's report (where revenue, losses, and commentary on going concern
      appear) are withheld from public view under UK small-company exemptions.


      The UK national semiconductor strategy describes the government's intent to
      support chip IP, design, and compound semiconductors over 20 years, but the
      current policy document does not contain commitment to direct capital for
      specific chip-design projects—it is not a source of additional funding for Olix.


      Gross margin, unit economics, and revenue trajectory are wholly undisclosed. The
      absence of any publicly confirmed design win, letter of intent, or pilot customer
      means analysts cannot model a revenue ramp with any precision. The financial
      verdict is: capital position adequate for the current phase; execution and
      yield risk are the dominant financial threats; and the chapter's diligence asks
      are non-negotiable before any investment underwriting.

