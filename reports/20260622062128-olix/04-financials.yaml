callouts:
  - calloutType: risk
    title: Burn escalation risk — headcount target implies tripling of monthly spend
    body: >
      Olix's stated goal of growing from 70 to 200-plus employees in 2026 would
      triple estimated personnel costs. At benchmark-leading compensation levels
      (£125K–£180K base plus £24K local bonus per senior engineer), the incremental
      cash cost per new hire is approximately £160K–£200K annually. A 130-person
      scale-up adds roughly $25–30M annually to the burn rate. Combined with a
      tape-out cycle, this compresses the $220M runway to approximately 24–30 months
      under base assumptions—less time than the 2027 product target plus qualification
      period implies.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI016
      - CI022

  - calloutType: risk
    title: Adverse yield risk — silicon photonics manufacturing variability inflates unit cost
    body: >
      The Siemens semiconductor-packaging blog and edgen.tech's CPO delay report both
      independently identify that silicon photonics manufacturing has higher process
      variability than mature CMOS, that yield excursions can have outsized cost
      impact due to limited reworkability of co-packaged assemblies, and that CPO
      mass production was delayed past 2026 due to yield issues. Olix's SRAM-plus-
      photonics architecture places it squarely in this risk zone. A single yield
      excursion on a prototype tape-out can cost $10–30M in wasted silicon and delay
      the revenue ramp by six to twelve months.
    claimRefs:
      - CI017
      - CI018
      - CI031

  - calloutType: assumption
    title: Disclosure assumption — total exemption accounts confirm minimal public visibility
    body: >
      Olix filed total exemption full accounts for the period to 31 August 2025, which
      means the public Companies House record shows a balance sheet and basic notes but
      withholds the profit-and-loss account, revenue, and operating costs. The UK
      government's statutory accounts guidance confirms that small companies may file
      abridged or total-exemption accounts that omit the P&L entirely. All burn rate
      and revenue estimates in this chapter are therefore modelled approximations with
      no ability to verify against any disclosed financial statement.
    claimRefs:
      - CI030
      - CI032

