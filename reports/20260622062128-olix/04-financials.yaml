  - id: capital-adequacy-and-runway
    title: Capital adequacy, funding chronology reference, and runway scenarios
    body: >
      Olix's most recent disclosed financing was a $220 million round led by
      Hummingbird Ventures, announced on 11 February 2026 and reported by Cooley and
      multiple independent outlets. Press coverage placed total lifetime capital at
      approximately $250 million, implying approximately $30 million raised in earlier
      rounds from Plural, Vertex Ventures, LocalGlobe, and Entrepreneurs First.
      The detailed funding chronology (individual round sizes and dates) is maintained
      in the Company Overview chapter; this section mints fresh Financials claims for
      the capital facts needed for the adequacy analysis here.


      Hummingbird's own description of its strategy is relevant: the firm characterises
      itself as a global seed investor that writes initial checks from $500K and follows
      on with $50M-plus in subsequent rounds, providing patient long-term capital
      through the high-risk phases of deep-tech development. That strategy makes
      Hummingbird a credible co-investor for an extended multi-year pre-revenue build,
      but it does not guarantee continued support if technical milestones slip or the
      competitive environment changes materially.


      The capital adequacy table models three runway scenarios against the burn-rate
      estimates derived in the previous section. In the base case (current 70-person
      burn of approximately $3M/month), $220M provides about 73 months of runway,
      implying cash sufficient through approximately 2032—well beyond the 2027
      product target. However, Olix has explicitly stated the intent to scale to
      200-plus employees in 2026; executing that plan would lift monthly burn to
      $5–8M/month, cutting the effective runway on $220M to roughly 27–44 months
      (approximately mid-2028 to mid-2029). Adding a single major tape-out cycle
      ($20–50M) compresses the runway further to 15–30 months (through early 2028 to
      mid-2028). These scenarios suggest Olix will likely need to raise another round
      before the end of 2028 at current plans, depending on tape-out timing and
      operational scale.


      Comparable AI inference chip startups provide useful context. Groq raised $750
      million at a $6.9 billion valuation in September 2025, demonstrating that large
      follow-on rounds remain accessible for proven AI inference platforms. Ayar Labs
      closed a $500 million Series E for production-ready CPO hardware in 2025, with
      NVIDIA, AMD, and MediaTek as strategic investors—showing that semiconductor
      photonics companies can attract large follow-on capital when production milestones
      are demonstrably achieved. Fractile, another UK inference chip startup, raised
      $220 million in a Series B announced in May 2026, confirming that comparable
      capital is accessible for UK-based deep-tech chip startups at similar stages.
      Whether Olix can sustain similar investor confidence through its longer and more
      capital-intensive product development arc depends heavily on technical milestone
      execution.


      The Companies House filing shows share capital of approximately GBP 288, reflecting
      the fractional penny-share structure common in UK venture-backed companies where
      equity is issued in many small denominator shares to accommodate complex cap
      tables. This tells analysts nothing about economic valuation but confirms the
      company uses a standard venture-structuring approach. The confirmation statement
      filed 21 March 2026 (CS01) and the total exemption full accounts filed for FY to
      31 August 2025 are the extent of publicly verifiable financial information; the
      accounts provide a balance sheet but conceal revenue, operating costs, and losses.

