  - id: scenario-analysis
    title: Scenario Analysis, Downside Risks, and Capital Intensity
    body: >
      A bull scenario requires Olix to ship its DX-1/OTPU rack system to paying hyperscaler
      or cloud customers by 2027, achieve a first production run of sufficient scale to
      demonstrate competitive throughput-per-megawatt, and secure two or more design-win
      contracts from tier-1 buyers before NVIDIA's photonic-native successor chips enter
      volume production. In this scenario, an M&A acquirer or a pre-IPO secondary market
      could value Olix at $5–8 billion, representing a 5–8× return to Series A investors.
      Historical precedent for a photonic AI hardware company transiting from pre-revenue
      to a multi-billion M&A exit within four years is non-existent; the scenario depends
      on a conjunction of execution, timing, and buyer appetite.

      The base scenario assumes a modest 12–18 month delay against the 2027 shipping target,
      a requirement for at least one additional capital raise of $400–600 million to fund
      tape-out, qualification, and go-to-market, and a resulting dilution of Series A
      investors to roughly 12–16% of the cap table. First revenue could materialise in 2028
      at a small but meaningful scale of $10–50 million in hardware shipments. A follow-on
      valuation of $2–3 billion in this scenario implies a 2–3× return to Series A investors
      before preferences and dilution — sub-par for a high-risk deep-tech bet.

      In the bear scenario, the OTPU tape-out encounters yield or integration failures that
      push first silicon delivery to 2029 or beyond. By that point, NVIDIA's photonic-native
      or CXL-based products could have captured the efficiency market, Groq and Positron AI
      could have secured most hyperscaler inference contracts, and Olix may be forced to
      raise a down-round or seek a distressed sale. Capital intensity for a single
      semiconductor product generation — tapeout, packaging, qualification, system integration
      — typically exceeds $200–500 million, meaning Olix's $250 million raised to date is
      unlikely to be sufficient for a full production ramp without dilutive follow-on capital.
      The GBP 287.8572 allotted share capital recorded by Companies House confirms equity
      is still being issued in discrete tranches, consistent with milestone-linked disbursement.

      A structural adversarial risk sits in NVIDIA's own photonic roadmap: as CNBC reported
      in May 2026, NVIDIA has deployed approximately $2 billion in co-packaged optics
      investments and Jensen Huang confirmed at GTC that NVIDIA is "beginning to scale" its
      silicon photonics technology. If NVIDIA's supplier ecosystem (Lumentum, Coherent,
      Marvell, Corning) succeeds in integrating CPO at scale, the addressable market for an
      independent optical accelerator vendor shrinks to specialised inference-as-a-service
      applications rather than the broad hyperscaler data-centre market. The CNBC article
      quotes an analyst forecasting one to two additional product generations before photonics
      is mainstream — meaning Olix must outrace not only Groq and Positron but also the
      implicit clock of NVIDIA's photonic integration roadmap.

