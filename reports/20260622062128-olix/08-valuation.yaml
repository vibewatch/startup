  - id: comparable-valuations
    title: Comparable Valuations, Precedent Transactions, and Public Market Context
    body: >
      Comparable private rounds illustrate the valuation spectrum for AI-hardware inference
      startups in 2025–2026. Groq, the most commercialised peer, raised $750 million in
      September 2025 at a $6.9 billion post-money valuation — approximately 6.9× Olix's
      implied mark — but serves more than two million active developers with a shipping LPU
      product and revenue. Ayar Labs raised $500 million in March 2026 at $3.75 billion,
      reflecting its co-packaged optics product position inside the NVIDIA NVLink Fusion
      ecosystem. Positron AI raised $230 million in February 2026 at over $1 billion, an
      almost exact peer match to Olix on funding amount and valuation date but with a
      shipping FPGA-based inference system (Atlas) and a custom silicon (Asimov) in tape-out
      targeting late 2026. The juxtaposition is notable: Positron has a shipped product and
      a paying lead customer (Jump Trading) at the same implied valuation as Olix, which
      has neither. SambaNova ($350M Series E), Cerebras ($1B Series H in Q1 2026, preparing
      for IPO), and MatX ($500M Series B) add further reference points across the AI
      accelerator field.

      On the M&A dimension, the clearest photonic-specific comp is Marvell's acquisition of
      Polariton Technologies, a Swiss developer of plasmonics-based silicon photonics
      devices. Transaction terms were not disclosed. Broader semiconductor M&A history
      includes Intel's acquisition of Habana Labs (approximately $2 billion in 2019) and
      Qualcomm's acquisition of NUVIA ($1.4 billion in 2021) — both of which rewarded
      acquirers who saw architectural option value ahead of commercial delivery, though neither
      company was pre-tapeout at deal close.

      Public market benchmarks anchor the upper range of the analysis. NVIDIA reported Q1
      fiscal 2027 revenue of $81.6 billion, up 85% year-on-year, with data-centre compute
      revenue of $60.4 billion. At a market capitalisation of approximately $3.2 trillion as
      of May 2026 (implied from share buybacks and EPS), NVIDIA trades at roughly 9–10×
      annualised revenue — a multiple reflecting a product in mass production, dominant market
      position, and 75% gross margin. Applying even a steep pre-revenue haircut of 70–80%
      to NVIDIA's forward multiple yields an implied addressable multiple of roughly 2–3× peak
      projected revenue for a pre-product competitor. The Grand View Research AI accelerator
      market forecast ($256.8 billion by 2033, CAGR 29.3%) and Precedence Research's broader
      AI chip market estimate ($121.7 billion in 2026, growing to $1.1 trillion by 2035)
      confirm aggregate demand expansion, but do not de-risk individual vendor capture.

      Lightmatter, the closest photonic compute peer, has not publicly disclosed its latest
      round valuation with certainty at the time of this analysis. Its Guide product — a
      very-large-scale photonic light engine for AI — represents a more advanced product
      maturity than Olix's OTPU, suggesting Lightmatter likely commands a premium multiple.
      The CNBC photonics article from May 2026 includes an analyst observation that deploying
      photonics at scale may "require one or two more generations of products from NVIDIA"
      — a quote that directly frames the timeline risk to Olix's addressable market.

