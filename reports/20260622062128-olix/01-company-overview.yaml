- id: funding-and-capitalization
  title: Funding history, investor mix, and disclosure limits
  body: 'The strongest verified financing fact is Cooley’s 11 February 2026 announcement that it advised Olix on a $220 million financing round led by London-based Hummingbird Ventures, valuing the startup at just more than $1 billion. SiliconANGLE, Jon Peddie Research, IDCNova, Tech Funding News, and other coverage echo the same rough terms, making the February 2026 round the anchor event for every later discussion of valuation and runway. Press coverage also says the company had prior backing from Plural, Vertex Ventures, LocalGlobe, and Entrepreneurs First and places total funding at roughly $250 million.


    What is less visible is equally important. Olix remains a private UK company with no public equity research, no public debt disclosures, no disclosed secondary activity, and no revenue or customer metrics released alongside the financing. Companies House filings show several capital and governance documents around January through May 2026, including share allotment filings, adoption of articles, share-right changes, and pre-emption-right changes, but the public surface still does not provide a usable cap table or investor ownership breakdown.


    The investor roster is nonetheless directionally strong. Hummingbird frames itself as a global seed investor willing to write large follow-on checks, while board-linked participants around Olix include ecosystem figures from Plural, Phoenix Court/LocalGlobe, Vertex and Stanford. That mix suggests Olix has attracted conviction capital and operator oversight earlier than many European hardware startups. The absence of deeper financial disclosure, however, means the quality of the syndicate cannot substitute for missing evidence on commercial traction.'
