- id: adverse-signals-and-open-questions
  title: Adverse signals and open diligence questions
  body: 'Olix’s promise sits inside a technology stack that is strategically attractive but operationally unforgiving. Official materials themselves emphasize that a startup cannot realistically compete for HBM and advanced-packaging capacity on incumbent terms, which is why Olix is trying to avoid those choke points altogether. That framing is logically coherent, but it doubles as an admission that the prevailing AI hardware supply chain remains structurally constrained and that Olix is betting on a new architecture partly because the standard path is inaccessible.


    Independent market commentary reinforces that caution. Siemens’ 2026 co-packaged-optics note argues that power, thermal management, testing, yield, and interoperability remain unresolved ecosystem bottlenecks through the 2026-2027 period. Edgen, citing supply-chain reporting, says meaningful CPO mass production is unlikely before post-2026 because yields remain too low. CNBC’s late-May 2026 photonics feature makes the same high-level point in a broader form: using light to relieve AI bottlenecks is one of the most interesting directions in the sector, but commercialization remains early relative to incumbent GPU ecosystems. Even if Olix’s exact architecture differs from switch-centric CPO roadmaps, the manufacturing and ecosystem warnings still matter because Olix is recruiting optical interconnect, packaging, and system integration talent from the same immature supply chain.


    A second diligence issue is governance opacity. Companies House reveals who sits around the table and when they joined, but not the economics behind their positions. Capital structure, ownership concentration, customer commitments, wafer/fab arrangements, and the milestones attached to the 2026 raise remain private. That is acceptable for an early-stage deep-tech company, but it means later investment judgment has to be made with explicit uncertainty rather than implied precision.'
