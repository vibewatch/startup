- id: operating-footprint-and-milestones
  title: Operating footprint, hiring signal, and milestone record
  body: 'Olix’s public operating footprint is visible more through hiring than through customer disclosure. The careers hub lists open roles across optics, FPGA, ASIC, platform software, legal, packaging, manufacturing operations, and process integration, which is exactly the functional breadth expected for a company trying to turn a photonic compute thesis into a shipped semiconductor system. The specific role pages also show Olix is designing chip-to-chip, intra-tray, and rack-scale optical links while building software integrations for distributed inference stacks such as vLLM, SGLang, and NVIDIA Dynamo. That is a meaningful signal that the company is architecting both silicon and system software, not just a lab prototype.


    Milestones on the public record cluster into three periods. First, formation in 2024 as Flux Corp Ltd under James Dacombe. Second, governance expansion and address changes through 2025 as the company scaled. Third, the January-May 2026 burst of name change, financing, capital allotments, new board appointments, and intensified recruiting that pushed Olix into public view as a unicorn-valued AI infrastructure startup. Public coverage also repeatedly points to 2027 as the target for first customer shipments.


    There is still a real measurement gap around scale. Jon Peddie and Tech Funding News say Olix had grown to more than 70 employees and aimed to exceed 200, but the latest statutory accounts available through Companies House only cover the period to 31 August 2025. Investors therefore have evidence that the company is scaling, but not a clean, audited operating dashboard that reconciles historical statutory disclosures with present-day hiring claims.'
