- id: leadership-and-governance
  title: Founders, directors, and governance signals
  body: 'The central key-person fact is straightforward: James Robert Dacombe founded the company, has been the sole continuously serving Companies House director since incorporation, and is the public founder attached to the financing narrative. Companies House records show he was appointed on 22 March 2024, while press coverage repeatedly describes him as a 25-year-old founder and the chief executive driving Olix’s contrarian compute strategy. That combination makes Dacombe both a fundraising asset and a single-point execution dependency.


    Governance matured sharply around the 2025-2026 financing window. The Companies House officer list and filing history show Jonathan Heiliger joined in June 2025, Taavet Hinrikus in October 2025, Firat Ileri in February 2026, and Professor Nicholas McKeown in February 2026, while director changes on 10 February 2026 removed David Helgason and Krishna Visvanathan. Saul Klein also appears on the active officer list. Read together with the outside biographies, this board and director slate links Olix to investors and operators with strong infrastructure, European venture, and networking pedigrees: Heiliger previously led Facebook infrastructure, Klein is a long-time European seed investor and operator, McKeown is a Stanford networking professor, and Hinrikus is a notable European founder-investor.


    The company’s own careers and culture materials add a second governance signal: Olix is deliberately building a high-intensity, in-person culture with meaningful equity, a £24,000 annual living-local bonus, and even an 18-week paid exit at the three-month mark for mismatched hires. That may improve alignment in a hard deep-tech buildout, but it also underscores the company’s dependence on recruiting and retaining exceptional technical talent under unusually demanding operating norms.'
