company:
  name: Olix
chapter:
  number: 1
  title: Company Overview
  summary: Olix is a London-based photonic AI chip startup incorporated in March 2024 and renamed from Flux Corp Ltd in January 2026. Public sources show a $220 million February 2026 financing led by Hummingbird Ventures at just over a $1 billion valuation, while official hiring pages show the company building a cross-disciplinary optics, ASIC, software and manufacturing team ahead of a targeted 2027 product launch.
sections:
- id: identity-and-product
  title: Identity, formation, and product thesis
  body: 'Olix operates as OLIX Computing Limited, the UK private company that was incorporated on 22 March 2024 and renamed from Flux Corp Ltd on 19 January 2026. The registered office is in St Albans, but every public-facing operating description around the financing round describes the company as London-based, and the careers site shows hiring across London and Bristol in the UK plus Austin, San Francisco, and Toronto in North America. That split matters for diligence: the legal entity is young and lightly disclosed, while the market identity is already that of a London AI-hardware unicorn.


    The company is pursuing a distinct product thesis versus standard GPU challengers. Official materials say Olix wants to build infrastructure for “frontier AI” by combining SRAM-centric memory design with photonics, avoiding dependence on HBM-heavy accelerator architectures. Public materials name both an Optical Tensor Processing Unit (OTPU) and the OLIX Decode Accelerator 1 (DX-1), with the manifesto and role pages describing a system built specifically for inference and decode-heavy workloads. The core message is consistent across official and third-party sources: Olix believes current accelerators force an expensive tradeoff between throughput and interactivity, and that a photonic, rack-scale architecture can break that constraint.


    This gives Olix a credible high-conviction identity, but also reveals how early the company still is. The company states a thesis, a target product family, and a hiring agenda more clearly than it states production metrics, customer wins, or shipped silicon. That asymmetry is typical for a 2024 deep-tech startup but important to preserve as later chapters assess commercialization risk.'
