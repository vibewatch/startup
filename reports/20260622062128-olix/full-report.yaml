      - number: '7.3'
        title: Commercial, financial, competitive, and supply-chain risks
        blocks:
          - type: paragraph
            body: >
              Olix's financial risk profile is shaped by four compounding features: it is pre-revenue; it raised capital
              at a unicorn valuation; it faces a capital-intensive semiconductor development path; and its estimated
              runway of 30–45 months (based on a modelled $3–5 million monthly burn rate against $220 million raised)
              must sustain multi-year R&D, tape-out costs, packaging qualification, and go-to-market hiring before any
              commercial revenue can offset spend. The semiconductor analyst Jon Peddie Research notes that the AI
              processor market is highly contested and capital-intensive. If AI spending sentiment turns — triggered by
              model efficiency gains requiring less compute, cloud CapEx retrenchment, or a market correction — the next
              funding round could come at a significantly lower valuation or with onerous terms. The Semiconductor
              Industry Association's 2025 State of the Semiconductor Industry report highlights the scale of capital
              required to compete in advanced chip design.


              Competitive risk is acute and near-term. NVIDIA's data-centre revenue reached $51.2 billion in Q3 FY2026
              and the company is continuously optimising Blackwell for inference workloads, narrowing the performance
              gap that Olix's photonic approach must bridge before 2027. Lightmatter, the closest peer in photonic
              computing, raised $400 million and is further along in product development; CNBC reported in May 2026 that
              chip companies are racing to address AI bottlenecks in photonics. A 2027 target that slips to 2028 or
              later would give NVIDIA, Google TPU, and AWS Inferentia further time to close the efficiency gap on
              conventional CMOS architectures, eroding the wedge Olix is trying to exploit.


              The supply chain carries two single-source dependencies that are difficult to mitigate. TSMC is the only
              credible foundry for advanced silicon photonics at the process node Olix requires; any disruption to TSMC
              access — geopolitical, capacity-related, or qualification-related — would materially delay the programme.
              Upstream of TSMC, ASML's EUV lithography systems represent a concentrated global chokepoint; shortages in
              EUV tool availability affect all advanced foundry nodes simultaneously. Laser suppliers for III-V compound
              semiconductor light sources (indium phosphide-based) add a third supply-chain constraint, as InP wafer
              supply is geographically concentrated and subject to its own capacity limits.
            claimRefs:
