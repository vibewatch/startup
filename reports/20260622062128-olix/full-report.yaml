      - number: '3.2'
        title: Photonic compute and optical interconnect peers
        blocks:
          - type: paragraph
            body: |
              Lightmatter is Olix's nearest architectural peer but the comparison reveals more
              divergence than overlap. Lightmatter describes itself as a "Photonic Supercomputer
              Company" and has published three product lines: Passage (photonic interconnect
              chiplets), Envise (photonic compute platform), and Idiom (ML framework and graph
              compiler). Passage operates at 56 to 448 Gbps per lane across one to sixteen or more
              wavelengths using 3D integration the company calls "Edgeless I/O." Lightmatter cites
              a current bandwidth capacity of 114 Tbps and a roadmap to more than one petabit per
              second, with foundry relationships at TSMC, GlobalFoundries, and Tower Semiconductor.
              The critical distinction from Olix is that Lightmatter's commercial traction and
              public messaging centre on photonic interconnects; the compute acceleration layer in
              Envise has not yet demonstrated the SRAM-centric, decode-heavy inference specialisation
              that Olix's OTPU and DX-1 publicly target.

              Ayar Labs occupies a complementary rather than directly competitive position. It
              ships TeraPHY optical I/O chiplets on UCIe interconnect standards that deliver
              approximately ten times the bandwidth of copper at equivalent power, and its SuperNova
              provides an on-chip laser source. The company raised $500 million in a Series E round
              at a $3.75 billion valuation in March 2026 and joined the NVIDIA NVLink Fusion
              ecosystem in June 2026. NVIDIA, AMD, Alchip, and MediaTek are investors. Ayar Labs is
              a chiplet supplier, not a system vendor; a hyperscaler deploying Ayar Labs TeraPHY
              chiplets alongside third-party AI processors is still a potential Olix customer.

              Intel Silicon Photonics has shipped more than eight million photonic integrated circuits
              with over 32 million on-chip integrated lasers embedded in pluggable transceivers since
              2016, making it the volume manufacturing benchmark for silicon photonics reliability.
              Its OCI chiplet delivers four terabits per second bidirectional and is designed for
              co-packaging with CPU, GPU, and IPU silicon. Intel's maturity validates photonic
              manufacturing at scale but also illustrates the concentration of proven supply-chain
              volume at incumbents rather than at photonic AI compute startups.
