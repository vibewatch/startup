      - number: '3.3'
        title: Electrical inference ASICs and hyperscaler captive silicon
        blocks:
          - type: paragraph
            body: |
              Groq is the most commercially mature electrical inference substitute available today.
              Its Language Processing Unit is an electrical ASIC with a tensor-streaming architecture
              designed specifically for low-latency LLM inference and decode. Groq raised $750 million
              in September 2025 at a $6.9 billion valuation from Disruptive Investments, BlackRock,
              Samsung, Cisco, D1 Capital, and Altimeter Capital, and reported approximately $500
              million in 2025 revenue. In December 2025 it entered a non-exclusive inference
              technology licensing agreement with NVIDIA, with co-founder Jonathan Ross moving to
              NVIDIA; Simon Edwards became CEO. GroqCloud serves more than two million developers
              across four global inference regions, with an on-premises GroqRack option. At the
              time of writing, Groq's LLM pricing for a 20-billion-parameter open-source model
              is $0.075 per million input tokens and $0.30 per million output tokens at approximately
              1,000 tokens per second; a 120-billion-parameter model runs at $0.15 and $0.60
              respectively at about 500 tokens per second. The NVIDIA licensing relationship does
              not eliminate Groq's commercial independence but narrows its IP differentiation story
              and increases incumbency alignment risk.

              Etched targets the same inference workload with a different approach: a hardcoded
              transformer ASIC called Sohu that cannot be reprogrammed but claims more than twenty
              times the throughput of the NVIDIA H100 for transformer inference workloads. The
              executive team combines Harvard mathematics (CEO Gavin Uberti), Cypress Semiconductor
              alumni (CTO Mark Ross) and over two decades of NVIDIA design experience (VP Brian
              Loiler). Etched has not published commercial pricing or shipping timelines, and its
              transformer-hardcoded architecture faces the same model flexibility risk as any
              fixed-function ASIC if model architectures evolve beyond the transformer paradigm.

              Hyperscaler captive silicon — AWS Inferentia2, Google TPU, Meta MTIA — represents
              an addressable-market reduction rather than a competitor for merchant silicon. AWS
              Inferentia2 has delivered 4.5 times higher throughput and ninety percent lower inference
              cost than GPU instances in published customer benchmarks. Google Cloud TPU has been
              in commercial deployment since 2018 and powers a substantial fraction of Google's own
              AI inference workload. Each hyperscaler that builds its own inference ASIC permanently
              reduces the addressable footprint for any merchant-silicon inference vendor including Olix.
