      - number: '5.3'
        title: Manufacturing challenges, standards, export controls, and technology risks
        blocks:
          - type: paragraph
            body: >
              The photonic and CPO supply chain presents several well-documented risks that Olix will need to navigate
              regardless of silicon quality. Industry reporting from Siemens EDA's 2026 CPO analysis identifies four
              intertwined challenges: thermal management (photonic ICs are highly temperature-sensitive and transient
              thermal excursions from AI workloads can shift optical wavelengths), test scalability (optical alignment
              requires micron-scale precision, far tighter than electrical test, meaning automated production-scale test
              methodology is not yet mature), manufacturing yield (silicon photonics exhibits higher process variability
              than mature CMOS, and CPO assembly is not reworkable, making yield excursions particularly costly), and
              incomplete standards (OIF and related consortia are still developing interoperability specifications for
              modulation formats, thermal envelopes, and optical attach methods). An adversarial industry note from
              edgen.tech specifically reported that CPO mass production was delayed past 2026 due to yield issues — a
              direct read-across risk for Olix's planned 2027 product launch window.

              Olix's export control posture is unusually explicit for a pre-revenue startup. Every engineering job
              posting reviewed carries a notice restricting candidates whose most recent citizenship or permanent
              residency is in Iran, North Korea, Syria, Cuba, Russia, Belarus, China, Hong Kong, Macau, or Venezuela,
              citing US export control regulations. This indicates that Olix's technology stack almost certainly
              includes controlled items under the Export Administration Regulations (EAR), which has practical
              implications for customer geography, supply-chain partner selection, and fundraising from investors with
              restricted-country connections.

              The competitive context for photonics further illustrates maturity gaps. Established players such as Intel
              have been shipping silicon photonics products for data-centre networking for several years, and Ayar Labs
              with NVIDIA backing has announced co-packaged optical chiplet production. Lightmatter's Passage platform
              took four or more years from concept to initial deployment. Olix is building a more ambitious full-system
              platform, not just an optical interconnect layer, which compounds the engineering and manufacturing
              challenge relative to component specialists. No independent benchmark data, reliability test results, or
              customer qualification data for DX-1 are in the public domain.
