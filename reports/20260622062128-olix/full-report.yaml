  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and four-tier taxonomy
        blocks:
          - type: paragraph
            body: |
              Olix enters a market with no single dominant form factor for AI inference silicon,
              which is both an opportunity and a measure of how early the photonic compute segment
              remains. For diligence purposes the competitors split cleanly into four tiers based
              on technology physics and commercial position.

              The first tier is direct photonic compute peers: companies building silicon that uses
              light for computation or memory-bandwidth management in AI workloads. Lightmatter is
              the most prominent name, though its Passage product is primarily a photonic interconnect
              chiplet and its Envise compute platform has not shipped at hyperscaler scale. The
              acquisitions trail includes Celestial AI, which was absorbed by Marvell and whose optical
              fabric intellectual property now sits inside a semiconductor incumbent rather than a
              standalone challenger.

              The second tier is optical interconnect and co-packaged-optics (CPO) suppliers. Ayar Labs
              leads this group, shipping TeraPHY optical I/O chiplets for AI scale-up clusters and
              partnering with both NVIDIA and AMD as investors. Intel's Silicon Photonics division has
              shipped more than eight million photonic integrated circuits into data centre transceivers
              and is developing a 4-Tbps Optical Compute Interconnect (OCI) chiplet. These companies
              supply the photonic plumbing on which systems like Olix's OTPU depend; they are potential
              partners but also represent alternative sourcing strategies for hyperscalers who prefer
              to retrofit photonics onto existing GPU clusters rather than adopt a new compute platform.

              The third tier is electrical inference ASICs: Groq (Language Processing Unit, cloud
              deployed), Etched (transformer-specific hardcoded ASIC, pre-commercial), and the major
              GPU incumbents NVIDIA and AMD whose Blackwell and MI-series chips dominate today's
              inference serving. The fourth tier is hyperscaler captive silicon: AWS Inferentia, Google
              TPU, and Meta MTIA, which eliminate addressable market on a per-hyperscaler basis rather
              than competing for merchant silicon share.
