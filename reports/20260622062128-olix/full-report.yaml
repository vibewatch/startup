            title: No direct competitor combines SRAM-centric memory with photonic compute in a shipped inference product
            body: >-
              The competitive map shows a genuine architectural whitespace: Lightmatter's Envise compute platform has
              not shipped at scale with an SRAM-centric decode optimisation, and Groq's LPU is fully electrical. If Olix
              ships on its 2027 timeline, it enters a market where the combined photonic-SRAM inference architecture is
              differentiated. The risk is that Lightmatter, NVIDIA, or a well-resourced hyperscaler internal team closes
              the gap before Olix clears customer qualification cycles.
