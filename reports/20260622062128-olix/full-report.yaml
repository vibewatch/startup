      - number: '2.2'
        title: Market sizing — TAM, SAM, and constrained SOM
        blocks:
          - type: paragraph
            body: >-
              The broadest estimate of Olix's TAM is the global AI accelerator market: Grand View Research sized this at
              $25.56 billion in 2024 and projects $256.84 billion by 2033 at a 29.3% CAGR. Within that envelope,
              inference workloads are the fastest-growing component. NVIDIA's own earnings disclosures imply that total
              annual data centre compute spend attributable to inference is now on the order of tens of billions of
              dollars per year and growing: Q3 FY2026 data centre revenue alone hit $51.2 billion for a single quarter,
              and Jensen Huang noted AI inference token generation surged tenfold in the prior twelve months.


              The silicon photonics technology market provides a tighter proxy for Olix's SAM. MarketsandMarkets sizes
              the global silicon photonics market at $2.65 billion (2025) growing to $9.65 billion by 2030 at 29.5%
              CAGR, with North America accounting for $1.16–4.35 billion across that range. The Research Insights offers
              a convergent but slightly lower estimate of $8.13 billion by 2030. Both estimates include telecom and
              datacom applications alongside AI inference, so the pure inference-focused slice is smaller — but the
              AI/data centre share is the primary growth engine according to all three analyst sources.


              A constrained SOM for Olix in the 2027–2029 horizon depends on variables that are not yet public: customer
              qualification timelines, photonic foundry yield, and whether hyperscalers pull in-house or adopt merchant
              silicon for inference. The analyst estimates suggest the addressable inference photonics opportunity could
              reach $1–3 billion in serviceable annual revenue by 2029–2030 under a scenario where CPO and photonic
              inference gain meaningful hyperscaler traction. However, this SOM estimate is explicitly
              evidence-constrained and should be treated as a directional range rather than a hard forecast.
