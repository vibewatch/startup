      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Olix's likely buyer universe in its initial commercialisation phase is concentrated among hyperscalers and
              large cloud providers whose inference capital intensity is high enough to justify non-standard silicon
              qualification cycles. Meta's Q1 2026 capital expenditure was $19.8 billion in a single quarter, with
              full-year 2026 guidance raised to $125–145 billion. Alphabet's Q1 2026 capex reached approximately $35.7
              billion, with full-year guidance of $180–190 billion. Microsoft's FY2026 total capex is expected at
              approximately $190 billion. These commitments signal that budget is not the primary constraint for early
              adopters — the binding constraint is qualification risk and ecosystem readiness.


              The buyer in a hyperscaler procurement cycle for inference silicon is typically the infrastructure or AI
              platform organisation reporting to a VP of Infrastructure or CTO function. The user is the ML platform
              engineering team that integrates accelerators into inference serving frameworks such as vLLM, SGLang, and
              NVIDIA Dynamo — notably, Olix's own job postings confirm it is building software integrations for these
              frameworks, indicating awareness of the user integration requirement. The payer is the Cloud and AI
              profit-and-loss function that manages cost-per-token and total cost of ownership for inference.


              Secondary buyer segments include inference-as-a-service cloud providers (CoreWeave, Lambda Labs, Together
              AI, and similar) that have shown willingness to adopt non-NVIDIA silicon early, and national AI
              infrastructure programmes that are explicitly building domestic compute capacity. NVIDIA's Q3 FY2026
              earnings noted that "countries around the world are recognising AI as essential infrastructure," and the
              UK — where Olix is headquartered — has been named as a market where NVIDIA and partners are investing £2
              billion in next-generation AI infrastructure. That national-champion angle may lower adoption friction for
              Olix in European sovereign-compute procurement.
            claimRefs:
