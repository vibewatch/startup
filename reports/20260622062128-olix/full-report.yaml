  - id: TV003
    title: Bull / Base / Bear Scenario Summary
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull
        - DX-1 ships H1 2027; ≥2 tier-1 hyperscaler LOIs; follow-on at $3–5B; M&A at $6–8B by 2030
        - 5–8× return to Series A at $1B; acquirer pays 15–20× projected revenue at $400-600M ARR run-rate
        - Execution on silicon photonics yield; hyperscaler procurement delay; NVIDIA displaces before deal
        - Low (requires perfect execution + benign competitive environment)
      - - Base
        - >-
          12–18 month delay to 2028 first revenue; one dilutive bridge round ($400–600M) at flat/modest step-up; first
          revenue $10–50M
        - 2–3× gross return to Series A; net return 1–2× after liquidation preferences and dilution
        - Runway pressure; talent retention; capital market risk if AI investment cycle softens
        - Medium (consistent with deep-tech hardware base rates)
      - - Bear
        - 2029+ delivery; down-round or distressed sale; NVIDIA CPO integration shrinks addressable market materially
        - 0–0.5× return to Series A; total loss possible if liquidation preference senior to common tranche
        - Complete capital impairment; management departure; strategic M&A at nominal consideration
        - Low-Medium (elevated vs. typical SaaS but consistent with hardware-only pre-revenue bets)
    notes: >-
      Scenarios are illustrative; no revenue, backlog, or design-win data are in the public domain to anchor probability
      estimates quantitatively.
