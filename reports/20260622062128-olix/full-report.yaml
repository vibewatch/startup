            title: Hyperscaler capex at historic levels; inference spend is the fastest-growing segment
            body: >-
              The four top hyperscalers are collectively committing over $500 billion in annual capital expenditure to
              AI infrastructure in 2026. Alphabet alone guides $180–190 billion for the year; Microsoft $190 billion;
              Meta $125–145 billion. NVIDIA's data centre revenue has grown from near zero to over $51 billion per
              quarter in three years. Jensen Huang's statement that inference token generation surged tenfold in one
              year signals the inference segment is experiencing a demand surge that has rarely been matched in
              semiconductor history. This is the market dynamic Olix is attempting to capitalise on — the question is
              the timing and mechanism of photonic capture of that spend.
