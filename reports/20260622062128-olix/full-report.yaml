  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing structure, and commercialisation timeline
        blocks:
          - type: paragraph
            body: >
              Olix's stated product is the OLIX Decode Accelerator 1 (DX-1), a rack-scale AI inference system
              integrating SRAM memory, photonic interconnects, and custom logic. The business model implied by the
              product architecture, the careers-manifesto language, and third-party coverage is hardware sales targeting
              hyperscalers, cloud providers, and AI-first enterprises that need low-latency, high-throughput inference
              at scale. That places Olix in the same revenue-model category as Groq (which sells hardware and cloud-API
              access) and Ayar Labs (which sells CPO modules to system integrators), but Olix has not publicly confirmed
              any pricing, customer names, revenue, or contracted backlog as of the run date.


              Olix's compute manifesto explicitly positions the DX-1 against HBM-based GPU architectures on total cost
              of ownership (TCO) and throughput per megawatt, not on nominal chip price. That framing is consistent with
              enterprise hardware sales to buyers who evaluate total infrastructure cost, not chip list price. Olix also
              states that its SRAM architecture avoids dependence on HBM, advanced packaging, and other
              supply-constrained components—a supply-chain argument that, if realised, could allow Olix to price below
              incumbent GPU memory costs while maintaining healthy gross margins. The SiliconANGLE report added that
              Olix intends to use capital to finance chip development, and the Financial Times reported through
              SiliconANGLE that first OTPU customer deliveries are expected in 2027.


              The commercialisation timeline creates a significant revenue-gap window. Hardware startups at Olix's stage
              typically carry zero recurring revenue until first silicon tape-out is validated, first production units
              ship, and initial customer qualification is complete. That sequence almost always runs 12–24 months beyond
              a target delivery date. For Olix, the public 2027 delivery expectation means best-case revenue recognition
              no earlier than late 2027, with a more probable commercial ramp not before 2028. The absence of any
              disclosed design-win, letter of intent, or pilot customer engagement further limits the revenue visibility
              available to outside analysts. Olix's potential entry into inference-as-a-service (providing compute
              capacity directly) remains unconfirmed; if pursued, it would extend the pre-profitability period and
              substantially increase capital intensity through GPU-cluster-equivalent infrastructure spend.
