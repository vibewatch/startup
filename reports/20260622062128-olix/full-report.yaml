  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: DX-1 architecture — SRAM integration with co-packaged photonics
        blocks:
          - type: paragraph
            body: >
              Olix's compute manifesto identifies data movement — specifically the energy and latency cost of KV-cache
              traffic through High Bandwidth Memory — as the root constraint preventing existing accelerators from
              delivering both high throughput and low latency simultaneously. The company's response is the OLIX Decode
              Accelerator 1 (DX-1), described as the first accelerator architected specifically for decode. The design
              philosophy forfeits HBM entirely, instead scaling an SRAM-centric memory hierarchy integrated with
              photonics to address both the bandwidth and latency dimensions of the problem.

              The SRAM+photonics architecture operates at rack scale. Olix's materials describe "rack-scale co-design of
              logic, data movement, packaging, optics and interconnect" as a single unified system, contrasting this
              with reticle-scale and wafer-scale approaches taken by peers. The photonic element covers optical
              interconnects spanning chip-to-chip, intra-tray, and rack-to-rack links, with co-packaged optics (CPO) as
              the integration vehicle. The Optical Communications Engineer job description confirms Olix is building
              link architectures across all three distance tiers, with system-level link budgets — loss, BER, bandwidth,
              power, and thermal margins — owned within the engineering team.

              A third-party market-watch profile of Olix names both the OTPU (Optical Tensor Processing Unit) and the
              DX-1 as distinct product components. The manifesto does not use the OTPU label explicitly, instead
              referring to the DX-1 system level; the OTPU appears to describe the compute element within the larger
              rack system. Company claims that the OTPU performs matrix multiplications using photonic elements at very
              low heat generation should be treated as design intent, not validated performance; no published
              characterisation data exists.

              Pre-silicon prototyping is underway using Xilinx/AMD UltraScale+ and Versal FPGA platforms. The FPGA role
              requires PCIe Gen4 interfaces, multi-lane transceivers operating at greater than 25 Gb/s NRZ, BER
              measurement infrastructure, and SECDED error correction, confirming a high-speed digital integration layer
              between FPGA control logic and the optical subsystem. White Rabbit precision timing is also cited,
              suggesting a deterministic fabric requirement consistent with distributed rack-scale compute.
