  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and manufacturing risks
        blocks:
          - type: paragraph
            body: >
              Olix's photonic inference chip programme centres on co-packaged optics (CPO) — a technology that industry
              sources widely classify as early-stage and high-risk in manufacturing. Siemens EDA's February 2026 CPO
              analysis identifies four compounding challenges: thermal management (photonic ICs are highly
              temperature-sensitive; transient thermal excursions from AI workloads can shift optical wavelengths and
              degrade modulator efficiency); test scalability (optical alignment requires micron-scale precision, far
              tighter than electrical test, making automated production-scale testing a primary bottleneck);
              supply-chain immaturity (silicon photonics manufacturing exhibits higher process variability than mature
              CMOS, while yield excursions in co-packaged assemblies have an outsized cost impact because rework is
              practically impossible after co-packaging); and standards fragmentation (CPO interoperability standards
              are still maturing through OIF and similar bodies, meaning early products face integration friction with
              customer rack architectures). An adverse industry report published by EdgeN in 2026 states that CPO mass
              production faces delays beyond 2026 specifically because of yield issues, validating the Siemens risk
              assessment.


              Against this background, Olix has disclosed no silicon tapeout results, no yield data, and no system-level
              demonstration. Its stated 2027 first-shipment milestone requires completing a full silicon photonics
              tapeout at a foundry partner (likely TSMC Specialty Technology), co-packaging qualification with an OSAT,
              software stack integration, and hyperscaler qualification — all within approximately twelve months as of
              the June 2026 run date. TSMC's foundry technology pages confirm silicon photonics is offered as a
              specialty process, but the company has not disclosed photonic yield roadmaps publicly. ASML, whose EUV
              lithography systems underpin advanced semiconductor manufacturing globally, represents an upstream
              dependency common to all advanced foundry nodes. Power delivery is a secondary technical risk: Siemens
              notes that by 2027, AI data-centre power demand is expected to grow 50 percent globally, and approximately
              60 percent of data-centre energy goes to data movement rather than compute — the very problem CPO is meant
              to solve but which also drives extreme thermal requirements on the Olix rack-scale design.
            claimRefs:
