        - Missed 2027 shipping target or competitor signs Olix target account
        - Either trigger would shift stance to Expensive and recommendation toward Avoid
    notes: >-
      Assessment as of 2026-06-22. Recommendation is price-sensitive; assumptions subject to revision if evidence
      emerges.
