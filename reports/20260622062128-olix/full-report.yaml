      - number: '6.3'
        title: Customer proof absence, retention structure, and concentration risk
        blocks:
          - type: paragraph
            body: >
              Olix's customer proof position as of June 2026 is binary: zero publicly disclosed customers, zero
              disclosed pilots, zero disclosed letters of intent, and zero disclosed design wins. SiliconAngle noted
              that "it's unclear what optical components are included in the processor or how they're used," reflecting
              the general opacity of the customer-facing technical proposition even among specialist technology
              journalists. The Financial Times, which broke the financing news, noted that Olix expects to start
              shipping chips to customers in 2027, treating this as a management target rather than a contractual
              commitment.

              The structural risk this creates is concentration, not diversity. When Olix does win its first customer,
              that account will define effectively 100% of the company's revenue. If that customer is a Tier-1
              hyperscaler, the relationship will be governed by that hyperscaler's standard supply terms, which
              typically include demand variability clauses, multi-sourcing requirements, and exclusivity restrictions on
              customer naming. If the first customer is an inference-as-a-service provider, the relationship will be
              more transparent but revenue will be smaller and more exposed to that provider's own customer attrition.
              In either scenario, a single anchor customer represents a critical concentration risk until a second and
              third customer relationship materialises.

              Retention metrics — net revenue retention, gross revenue retention, churn rate, repeat purchase rate,
              contract duration — are entirely unavailable because no production revenue exists. AWS Inferentia customer
              testimonials on the Amazon product page show achieved outcomes (4.5× throughput, 25% lower latency, 90%
              lower cost for NTT PC Communications) from a custom AI inference chip after multi-year production
              deployment — a useful benchmark for what retention evidence looks like once a chip vendor reaches
              commercial scale, and one that Olix is years away from matching. Groq's customer roster illustrates the
              reference-quality question: its case studies name Willow (achieved zero downtime and 500 ms faster
              responses), PGA of America, and others, all relying on produced and deployed hardware running in
              production.

              The photonics-specific buyer reluctance documented by Broadcom's CEO is the most direct adverse signal on
              market timing: buyers capable of absorbing Olix's product are not yet convinced that photonics is a
              necessary purchase. This creates a window-dependent sales thesis — Olix needs buyers to become convinced
              of the photonics transition before a well-resourced incumbent (NVIDIA, Broadcom, or a hyperscaler captive
              team) closes the same architectural gap. The 2026–2027 period is therefore a critical market timing
              window: early customer conversations and design-win disclosures would significantly de-risk the commercial
              thesis, whereas continued silence on customer progress into 2027 would escalate this gap to a blocking
              diligence issue.
