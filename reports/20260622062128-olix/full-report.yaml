  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - DX-1/OTPU tape-out failure or indefinite delay
        - No foundry tapeout confirmed by end of 2026
        - Core product premise collapses; remaining capital supports only distressed exit
        - Immediate avoid; monitor for down-round signal or leadership departure
      - - Hyperscaler CPO integration accelerated by NVIDIA
        - NVIDIA or major hyperscaler announces native on-package photonics shipping in H2 2026
        - Olix's addressable market narrows sharply to edge or specialised inference niches
        - Re-evaluate size of addressable opportunity; does not automatically kill thesis but materially reduces upside
      - - Lead investor mark-down or bridge round at flat/down valuation
        - Publicly reported or inferred flat/down bridge in 2026-2027
        - Market signal that insiders no longer support $1B+ mark; liquidation preference pressure increases
        - Shift to avoid; preference overhang makes common equity near-worthless
      - - Competitor secures anchor hyperscaler contract for inference workloads
        - >-
          Groq, Positron, or NVIDIA Rubin GPU-based system signs exclusive or preferred supply agreement with a target
          hyperscaler
        - Olix loses its beachhead customer before DX-1 ships
        - Reassess product differentiation claim; potential pivot to different customer segment needed
      - - Founder CEO departure or material leadership disruption
        - James Dacombe leaves Olix CEO role or reduces active role below 50% time
        - Company loses the founder-driven technical and investor-relations capability that justified the round
        - High governance risk; seek board composition and succession evidence before any capital deployment
    notes: Triggers are event-based and monitored at quarterly evidence review. Thresholds are approximate; context matters.
    claimRefs:
      - CV025
      - CV028
      - CV029
      - CV031
      - CV032
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Foundry tapeout status
        - No public tapeout date, node, or foundry partner confirmed
        - >-
          Validates silicon design completeness and production timeline; without it DX-1 2027 shipping target is
          entirely speculative
        - Direct management disclosure; TSMC or GlobalFoundries customer list (restricted)
      - - Design-win pipeline
        - No LOI, NDA, or proof-of-concept customer engagement is in the public domain
        - >-
          Determines whether Olix has end-customer validation of its performance claims; changes recommendation from
          Track to Buy if credible
        - NDA-protected disclosure to investor; check Olix legal counsel filings for potential NDAs on Companies House
      - - Cap-table and preference stack
        - Liquidation preference terms, participating preferred status, and anti-dilution provisions are not disclosed
        - >-
          Determines actual investor return profile under base and bear scenarios; headline $1B valuation may not
          reflect economic interest available to common
        - Term sheet / shareholder agreement disclosure; Companies House SH01 filings for capital structure clues
      - - 2026 cash burn and runway
        - Companies House accounts to August 2025 only; no interim figures
        - >-
          Tests whether $250M raised covers runway to first revenue; burn of $5M/month implies ~50 months runway at
          Series A close, but 200+ person expansion may double burn
        - Investor reporting package; UK audit exemption threshold may trigger full audit filing for 2026
      - - OTPU benchmark results
        - No independent or company-published inference benchmark vs. H100/B200 or Groq LPU
        - Substantiates the throughput-per-megawatt and latency claims that justify the whole investment thesis
        - Pre-production silicon samples or simulation results; MLPerf Inference submission as future milestone
    notes: >-
      Diligence items are prioritised in order of materiality to recommendation. Items 1 and 2 are blocking for a buy
      recommendation.
    claimRefs:
      - CV004
      - CV006
      - CV036
      - CV037
      - CV038
