            body: >
              Olix's stated goal of growing from 70 to 200-plus employees in 2026 would triple estimated personnel
              costs. At benchmark-leading compensation levels (£125K–£180K base plus £24K local bonus per senior
              engineer), the incremental cash cost per new hire is approximately £160K–£200K annually. A 130-person
              scale-up adds roughly $25–30M annually to the burn rate. Combined with a tape-out cycle, this compresses
