      - CV024
  - id: TV002
    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Argument
      - Type
      - What Would Change This View
    rows:
      - - Inference market CAGR of ~29% through 2033 creates a large addressable opportunity for best-in-class hardware
        - Thesis (market)
        - Market growth stalls due to model efficiency improvements reducing compute demand
      - - >-
          SRAM+photonic architecture bypasses HBM memory wall and supply chain constraints, offering structural cost and
          latency advantage if delivered
        - Thesis (product)
        - >-
          OTPU yield or integration tests reveal that photonic compute offers insufficient advantage over next-gen
          electrical systems at system level
      - - >-
          Olix is pre-revenue with no disclosed design wins, no tapeout evidence, and no customer commitments; all value
          is option value
        - Anti-thesis (execution)
        - Company discloses a confirmed foundry tapeout, LOI, or first customer revenue in 2026
      - - >-
          Groq (shipping, $6.9B) and Positron AI (shipping, $1B+) hold real product advantage at same or higher
          valuations
        - Anti-thesis (competition)
        - Olix demonstrates superior benchmark results that force competitors to pause existing customer negotiations
      - - NVIDIA's $2B photonics investment programme may integrate CPO natively, shrinking Olix's addressable market
        - Anti-thesis (strategic risk)
        - >-
          NVIDIA confirms CPO integration is several years away or will be based on supply-chain optics rather than an
          inference-optimised design
      - - >-
          Capital intensity of chip development may require 2-3 further dilutive rounds before revenue, eroding Series A
          investor returns
        - Anti-thesis (capital)
        - >-
          Olix raises non-dilutive grant capital from UK government semiconductor programme or announces a foundry
          cost-sharing agreement
    notes: >-
      Arguments synthesised from public sources and cross-chapter evidence; all anti-thesis items reflect confirmed
      evidence gaps, not speculation.
    claimRefs:
