      - number: '7.2'
        title: Regulatory, legal, and export-control risks
        blocks:
          - type: paragraph
            body: >
              Three distinct regulatory and legal exposure vectors apply to Olix. First, US Bureau of Industry and
              Security (BIS) export controls on advanced computing integrated circuits have been tightening materially.
              The BIS homepage as of June 2026 confirms that a license is required to export advanced computing items to
              entities headquartered in Country Group D:5 (including China) or Macau, or with ultimate parent companies
              in those jurisdictions — even when the ultimate ship-to location is elsewhere. BIS also extended its
              Authorized IC Designer compliance timeline to 31 December 2026 to allow companies additional time to
              submit applications, but this extension confirms the regime is active and applicable. A UK-based photonic
              AI chip company that wants to sell into US-adjacent cloud infrastructure or directly to US-headquartered
              hyperscalers will need to confirm that its supply chain and end-customer base does not create a license
              exposure; this is non-trivial given Olix's architecture requires advanced foundry processes and photonic
              component sourcing that may touch dual-use equipment classifications.


              Second, the UK National Security and Investment Act 2021 (NSI Act) grants the UK Secretary of State broad
              powers to call in, review, and block acquisitions in seventeen sensitive sectors — semiconductors and
              advanced materials are explicitly named. For an investor or technology company contemplating an
              acquisition of Olix, NSI Act compliance is mandatory above certain threshold shareholding levels. This
              review mechanism could delay or prevent a strategic exit and should be disclosed to investors as a
              material risk. It also means that Olix's governance is subject to UK state oversight if any foreign
              government-linked entity seeks a significant stake.


              Third, intellectual property risk is elevated because Olix has not disclosed any granted patent portfolio,
              while competitor Lightmatter holds published patents on photonic matrix multiplication and optical
              interconnect architecture. The UK IPO search and EPO register do not surface significant granted patents
              under "Olix" or "OLIX Computing" as of the run date, though a nascent patent application may be in
              progress. NIST's AI Risk Management Framework and the UK government's pro-innovation AI regulation white
              paper (published March 2023) establish the regulatory backdrop but neither introduces near-term licensing
              obligations for AI chip hardware startups.
            claimRefs:
              - CR011
