companyProfile:
  summary: >
    Olix is a London-based photonic AI-hardware startup incorporated in March 2024 and renamed from Flux Corp Ltd in
    January 2026. The company is building an SRAM-plus-photonics inference platform centered on the DX-1 / OTPU
    architecture, arguing that conventional HBM-centric accelerators cannot deliver both throughput and interactivity
    economically at scale. Public evidence supports a $220M February 2026 Series A led by Hummingbird Ventures at a
    valuation above $1B, but the company has not publicly disclosed revenue, design wins, tapeout completion, or foundry
    partners. The result is a business with unusually strong capital formation and technical ambition for its age, but
    still limited public proof of commercial readiness.
