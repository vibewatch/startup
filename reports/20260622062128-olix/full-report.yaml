  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Last-Round Valuation Framework
        blocks:
          - type: paragraph
            body: >
              Olix's February 2026 Series A closed at $220 million, led by Hummingbird Ventures with participation from
              Plural, LocalGlobe, and Entrepreneurs First. Press coverage places the post-money valuation above $1
              billion, making Olix one of the fastest UK startups to reach unicorn status — a milestone achieved within
              roughly 24 months of incorporation in March 2024. Including an estimated $25–30 million seed and pre-seed
              financing, total capital raised stands at approximately $250 million. The Companies House filing history
              records a statement of capital following an allotment of shares on 5 March 2026 at GBP 287.8572 total
              capital, confirming the financing closed and new equity was issued. The total exemption accounts made up
              to 31 August 2025 — the only statutory accounts on public record — disclose balance-sheet data only and
              record no operating revenue.

              The last-round-price method anchors the current mark at $1 billion, implying investors assigned roughly 22
              percent implied dilution to arrive at a post-money figure consistent with a $220 million primary. In
              practice the preferred-share structure includes liquidation preferences whose size and flavour are not
              public, meaning the common equity and founder stakes could be worth materially less than the headline
              implies in a less-than headline-exit scenario. The $1 billion post-money represents approximately 4× the
              total capital deployed (roughly $250 million raised), a coverage ratio consistent with mid-stage deep-tech
              hardware rounds globally in Q1 2026 — SemiEngineering counted 80 semiconductor startups raising over $8.4
              billion in Q1 2026, with 18 rounds exceeding $100 million. Photonics specifically remained a "popular
              segment for investment" in that quarter.

              Investors appear to have priced two sources of value: (1) strategic option value on a working OTPU
              entering production before the inference market consolidates around NVIDIA Blackwell or its successors;
              and (2) M&A option value as hyperscalers and incumbent chip companies acquire photonic capabilities —
              evidenced by Marvell's acquisition of Polariton Technologies (plasmonics-based silicon photonics) in early
              2026 and NVIDIA's announced commitments of approximately $2 billion into photonics companies including
              Lumentum, Coherent, Marvell, and Corning, plus participation in Ayar Labs' $500 million Series E. The
              frequency and scale of these investments provide a plausible strategic floor for Olix's asset if the OTPU
              thesis remains even partially intact on exit.
