            title: CPO mass production not ready for Olix's 2027 ship date
            body: >-
              Multiple signals — edgen.tech reporting CPO mass production delays past 2026, Siemens CPO analysis
              confirming higher manufacturing variability than mature CMOS, and the Broadcom CEO's public assessment
              that silicon photonics adoption is "not anytime soon" — converge on a near-term supply-chain risk. Olix
              has a stated 2027 target for first customer shipments. If CPO yield and photonic foundry capacity do not
              scale by mid-2027, the company may face a bottleneck in both production and customer qualification,
              compressing the window between product availability and the hyperscaler capex cycles it is targeting.
