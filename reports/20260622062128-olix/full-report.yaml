            title: Rack-scale co-design is architecturally distinctive
            body: >
              Olix's decision to co-design compute, memory, interconnect, and optics at the rack scale rather than
              optimising individual components within the existing GPU packaging paradigm is technically coherent as a
              response to the HBM memory wall. The architecture avoids the supply-chain constraints of HBM, bypasses the
              interposer bottleneck, and targets the decode phase specifically — the heaviest workload in modern LLM
              serving. If executed, this is a genuinely different approach from silicon-only SRAM startups or
              interconnect-layer photonics companies.
