            body: >
              Olix filed total exemption full accounts for the period to 31 August 2025, which means the public
              Companies House record shows a balance sheet and basic notes but withholds the profit-and-loss account,
              revenue, and operating costs. The UK government's statutory accounts guidance confirms that small
              companies may file abridged or total-exemption accounts that omit the P&L entirely. All burn rate and
