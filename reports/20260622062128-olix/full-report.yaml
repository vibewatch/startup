            title: Ayar Labs and Intel validate photonic manufacturing at scale but not at inference compute
            body: >-
              Ayar Labs' $3.75 billion Series E and NVIDIA NVLink Fusion membership, together with Intel's eight million
              PIC shipments, confirm that silicon photonics supply chains are maturing. However, both companies address
              the interconnect and optical I/O layer, not the AI compute core. Olix's architectural bet that
              SRAM-centric photonic compute delivers a superior inference unit economics is untested in production,
              while these adjacent photonic companies validate ecosystem readiness rather than compute performance.
            calloutType: insight
            claimRefs:
              - CP013
