      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Track
            body: >
              Olix is a high-conviction option on a breakthrough photonic AI compute architecture, backed by credible
              investors and a technically ambitious founding team. However, at $1 billion post-money with no revenue, no
              confirmed tapeout, and no customer commitments in the public domain, the valuation prices in a sequence of
              execution milestones that remain entirely unverified. The recommendation is to track — maintain close
              monitoring and re-evaluate immediately upon confirmation of a foundry tapeout or a tier-1 design-win
              letter of intent. Do not commit capital at or above the current mark without at least one of these two
              evidence items.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV023
              - CV024
          - type: callout
            title: Adverse Signal — NVIDIA Photonic Integration Accelerating
            body: >
              NVIDIA has committed approximately $2 billion across Lumentum, Coherent, Marvell, and Corning for photonic
              integration, and CEO Jensen Huang confirmed at GTC 2026 that NVIDIA is beginning to scale silicon
              photonics technology. An independent analyst quoted in CNBC's May 2026 photonics article estimates that
              mainstream photonic deployment requires one to two additional NVIDIA product generations — but that clock
              is now running. If NVIDIA's co-packaged-optics supplier ecosystem delivers native photonic performance
              within the Blackwell successor generation, the rationale for an independent SRAM+photonic inference
              accelerator weakens materially, particularly for the hyperscaler market that represents the primary Olix
              addressable opportunity.
            calloutType: risk
            claimRefs:
              - CV021
              - CV022
