      - number: '2.4'
        title: Growth drivers, adoption constraints, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The primary demand driver for Olix's market is the AI data centre power and energy crisis. IEA's special
              report Energy and AI projects that electricity demand from data centres will more than double to 945 TWh
              by 2030; AI-optimised facilities will quadruple their electricity draw. In the US, data centres are
              projected to account for almost half of electricity demand growth through 2030. These constraints create a
              structural incentive to adopt inference hardware with materially better energy efficiency per token —
              which is the core value proposition of photonic architectures. The Data Center Frontier analysis of the
              IEA data notes that the AI industry is expected to consume ten times its 2023 electricity demand by 2026,
              and NVIDIA alone shipped AI servers consuming approximately 7.3 TWh annually as of its 2024 production
              run.


              The most significant adoption constraint is the maturity sequence that industry incumbents have
              articulated. Broadcom CEO Hock Tan explicitly described a two-wave model: first, copper-based rack-scale
              interconnects must saturate; second, pluggable optics must mature; only then does the economics of silicon
              photonics and CPO become compelling. Broadcom already has a $73 billion backlog of custom AI accelerator
              orders, with over $50 billion in custom XPU orders from hyperscalers, meaning incumbents are not waiting
              for photonics. A second constraint is manufacturing readiness: edgen.tech reported CPO mass production is
              delayed past 2026 on yield issues, and the Siemens CPO analysis confirmed that silicon photonics
              manufacturing variability is higher than in mature CMOS processes, with yield excursions having outsized
              cost impact. DARPA's PICASSO programme, launched in 2026 with $35 million in funding, explicitly
              acknowledges that photonic circuits struggle to show system-level performance advantages over electronic
              systems due to optical attenuation, noise, and spurious wave interference — fundamental physics
              constraints, not engineering gaps.


              Despite these constraints, the structural demand drivers favour eventual adoption: the scale of
              hyperscaler capital commitment ($180–190 billion per year from Alphabet and Microsoft alone), the
              exponential growth in inference token volume, and the energy efficiency imperative all create long-term
              pull. The key diligence question is whether Olix can clear the customer qualification and manufacturing
              readiness hurdles in time to capture the 2027–2028 hyperscaler budget cycle.
