      - number: '4.2'
        title: Cost structure, headcount burn, and capital intensity
        blocks:
          - type: paragraph
            body: >
              Olix's cost structure is dominated by three buckets: personnel, silicon engineering (tape-outs, EDA
              tooling, prototyping), and infrastructure (laboratory space, test equipment, computing, professional
              services). All three are significantly above median UK technology-startup benchmarks because Olix is
              building a full-custom semiconductor with integrated photonics—one of the most expensive engineering
              endeavours in the sector.


              On the personnel side, TechSparx reported that Olix was advertising senior digital design engineer roles
              in Bristol at £125,000–£180,000 base salary plus a £24,000 annual living-local supplement, implying a
              total cash package of up to £204,000 for a single engineering hire before national insurance and equity.
              The Olix careers manifesto confirms benchmark-leading compensation, meaningful equity grants, and an
              18-week salary exit package at the three-month mark for culture-fit mismatches. That exit provision alone
              is a material one-off cash liability every time a hire does not work out. Jon Peddie Research reported in
              February 2026 that Olix had grown to more than 70 employees and was targeting more than 200 by end of
              2026. Applying a blended fully-loaded cost of £160,000– £200,000 per person (base, NI, benefits, local
              bonus, and equity amortisation) to 70 current employees gives an estimated annualised personnel run-rate
              of £11–14 million (approximately $14–17 million). Scaling to 200 employees triples that to roughly £32–40
              million annually ($40–50 million), before non-headcount costs.


              Silicon engineering costs are the second major driver. A photonic-ASIC tape-out at a leading foundry such
              as TSMC or IMEC runs in the range of $10–50 million in NRE, masks, and test wafers for a production-grade
              chip at a mature node. The Siemens semiconductor-packaging blog explains that silicon photonics processes
              still exhibit higher manufacturing variability than mature CMOS, and that yield excursions at any
              packaging stage carry outsized cost impact due to limited reworkability of co-packaged assemblies. Each
              failed tape-out iteration delays revenue and consumes capital. The edgen.tech report on CPO mass
              production delays further highlights that packaging complexity can push delivery timelines by six to
              twelve months per iteration, multiplying the total capital consumed before first revenue.


              A rough composite monthly burn model for mid-2026 (70 employees, pre-tape-out prototyping): personnel
              $1.2–1.5M/month; silicon engineering and tooling $0.5–1.0M/month; infrastructure and overheads
              $0.3–0.5M/month; totalling an estimated $2.0–3.0M/month at current scale. As the team scales to 200 and
              enters first tape-out production runs, estimated burn rises to $5–8M/month. These estimates carry low
              confidence and rest entirely on industry-cost benchmarks and headcount signals; they are not based on any
              disclosed Olix financial statement.
