            title: Adverse yield risk — silicon photonics manufacturing variability inflates unit cost
            body: >
              The Siemens semiconductor-packaging blog and edgen.tech's CPO delay report both independently identify
              that silicon photonics manufacturing has higher process variability than mature CMOS, that yield
              excursions can have outsized cost impact due to limited reworkability of co-packaged assemblies, and that
              CPO mass production was delayed past 2026 due to yield issues. Olix's SRAM-plus- photonics architecture
              places it squarely in this risk zone. A single yield excursion on a prototype tape-out can cost $10–30M in
              wasted silicon and delay the revenue ramp by six to twelve months.
