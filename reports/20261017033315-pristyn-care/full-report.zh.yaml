      - number: '5.4'
        title: 产品风险在治理、质量控制与证据深度
        blocks:
          - type: paragraph
            body: >-
              最大的产品和技术风险不是典型软件漏洞，而是高接触医疗工作流中的治理、医疗质量和控制系统问题。Mint 对一例致死
              的胃球囊事件以及销售、转化激励的报道表明，数字获客、集中协调和分散交付结合后，责任边界可能模糊，手术转化 也可能承受压力。同时，公开产品材料强调“安全优先”和微创技术，却没有披露验证规模化质量所需的运营指标，例如
              医生资质复核频率、合作医院审计频率、不良事件分母或保险拒赔率。现有资料也没有开发者或技术社区入口、公开 API/ 文档体系或详细安全合规栈，因此除工作流设计和执行外，尽调应将技术护城河视为未经证明。
