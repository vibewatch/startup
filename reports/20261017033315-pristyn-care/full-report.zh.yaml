        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据足以在方向上排除乐观的投资判断，但不足以支持精确定价。第三方市场数据仍显示这是一家真实的 后期公司，累计融资约 $181M-$183M，最新披露融资发生于 2025 年 7
              月；公司材料和独立资料也继续沿用 2021 年 独角兽叙事。问题在于，较新的融资证据更像增量支持而非价格发现：Digital Health News 报道 2025 年发行按上一轮
              相同股价完成，而公开来源仍未披露清算优先权、债务或其他会决定真实入场经济性的悬垂事项。


              因此，本章判断为 **继续研究**，不是因为业务缺乏需求证据，而是融资和风险证据仍明显偏谨慎。Mint 关于增长停滞 评论、过失投诉和极高流失率的报道使下行风险仍在；当前公开材料也没有补上 FY25-FY26
              审计业绩或医院层面回报 的缺口。如果新投资者必须按此前独角兽时期的估值入场，现有证据还承担不起相应的证明负担。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 融资背景、运营证明与仍未排除的疑点
        blocks:
          - type: paragraph
            body: >-
              证据足以说明 Pristyn Care 不是早期试验：公司和第三方来源都描述了一个拥有 400+ 名医生和数百个医疗站点的网络， 独立来源也仍显示 FY24
              收入规模可观。但同一批来源对关键分母意见不一。官方材料称有 150+ 家自有诊所、800+ 家 合作医院和 40+ 个城市；2025 年 Hospital Management/Yahoo 的转载则称超过 200
              家诊所、700 家医院和 30 个城市。 财务指标同样混杂：PTI/NewsVoir 引述上一财年经审计总收入 Rs. 494 crore，Digital Health News 引述 FY24 营业收入 INR
              600 crore、亏损 INR 381 crore，Inc42 列出的 FY24 收入则为 ₹388.4 crore+。


              融资模式比表面规模更重要。Tracxn 列出 2025 年 7 月 22 日 E 轮融资 $5.48M，投后估值 $1.17B，低于其 2024 年 6 月记录的 $1.23B，也低于公司和联合发布来源仍引用的
              2021 年独角兽口径。Digital Health News 另称， 2025 年 CCPS 发行按上一轮相同股价完成，更像过桥支持而非新一轮市场出清式加价。这不能否定上行空间，但意味着
              当前价格叙事依赖未公开条款和未来执行。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
