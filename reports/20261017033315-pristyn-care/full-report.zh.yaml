      - - 基准
        - 增长延续，投资者继续支持公司，但条款仍仅部分披露，运营指标依旧嘈杂。
        - $1.0B-$1.2B 分析区间，以 2024-2025 年的公开估值为锚。
        - 最符合今天保留的证据：真实规模、平价过桥信号，以及尚未解决的尽调缺口。
        - 如果更大轮次融资延期、条款具有保护性，或医院经济性令人失望，估值会进一步下移。
      - - 悲观
        - 自有医院扩张提高资本强度，而亏损、治理噪声或质量问题阻断可信的 IPO 路径。
        - 低于 $1.0B，或采用结构化融资，导致表面估值高估新资金的经济性。
        - 与平价融资、尚未解决的不利信号和薄弱的披露质量相一致。
        - 下调轮次条款、审计延迟或质量 / 监管结果恶化都会触发该情景。
    notes: 区间是根据披露的 2021-2025 年估值推导出的分析区间，不是可执行价格，也不是完整 DCF / 可比公司分析的结果。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV008
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开记录的里程碑展现了公司从创立和独角兽融资，转向 2025 年自有医院扩张的过程，同时伴随值得注意的不利信号和重组标记。
    data:
      items:
        - date: 2018-08-01T00:00:00.000Z
          label: 在 Gurugram 创立
          details: 由 Harsimarbir Singh、Dr. Vaibhav Kapoor 和 Dr. Garima Sawhney 创立。
          tone: positive
          claimRefs:
            - CO001
        - date: 2021-12-07T00:00:00.000Z
          label: 独角兽轮次完成
          details: $96M 的 E 轮融资完成，公司估值约为 $1.4B。
          tone: positive
          claimRefs:
            - CO007
        - date: 2023-08-31T00:00:00.000Z
          label: Mint 记录不利运营信号
          details: 患者不满、人员流失和财务报表延迟等担忧进入公开视野。
          tone: warning
          claimRefs:
            - CO011
            - CO012
        - date: 2024-03-01T00:00:00.000Z
          label: 盈利推动与重组公布
          details: 公司称目标是在 FY25 实现盈利，且 1,700 名员工中受重组影响的比例低于 7%。
          tone: warning
          claimRefs:
            - CO009
            - CO013
        - date: 2025-02-14T00:00:00.000Z
          label: 首家自有医院开业
          details: 公司整理的新闻稿列表将首家医院开业列为战略里程碑。
          tone: positive
          claimRefs:
            - CO010
        - date: 2025-04-22T00:00:00.000Z
          label: 首家医院据报道实现盈利
          details: 同一新闻稿汇编强调了自有医院战略早期的盈利里程碑。
          tone: positive
          claimRefs:
            - CO010
        - date: 2025-06-20T00:00:00.000Z
          label: 新增三家智慧医院
          details: 公司网站整理的新闻报道显示，自有医院建设正在加速。
          tone: positive
          claimRefs:
            - CO010
        - date: 2025-07-22T00:00:00.000Z
          label: 记录到内部人士追加融资
          details: Tracxn 记录了一笔 $5.48M 的 E 轮追加融资，投后估值为 $1.17B。
          tone: neutral
          claimRefs:
            - CO006
    approximationNotes: 时间线以公开发布日期作为里程碑锚点；整理后的新闻条目应视为公司选取的证据，而不是对业绩的独立验证。
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 目前最有用的市场视角是一个分层框架：从 Pristyn 声称要解决的问题，延伸到其公开披露的覆盖范围和吞吐量。
    data:
      nodes:
        - label: 底层需求缺口
          displayValue: Trust, pricing, insurance, and logistics friction
          note: 仅作定性视角；指定证据池没有提供独立的卢比计价 TAM。
          tone: medium
          claimRefs:
            - CM013
        - label: 手术范围
          displayValue: 50+ diseases / conditions
          note: 覆盖多专科择期治疗和二级医疗，而非单一手术细分领域。
          tone: positive
          claimRefs:
            - CM002
        - label: 地理覆盖
          displayValue: 30-40+ cities
          note: 公开披露在方向上基本一致，但尚未完全核对。
          tone: positive
          claimRefs:
            - CM005
        - label: 合作伙伴交付网络
          displayValue: 700-800+ hospitals / centres
          note: 官方来源和媒体来源的定义不一，因此应将其视为区间。
          tone: positive
          claimRefs:
            - CM005
        - label: 吞吐量视角
          displayValue: ~200 surgeries / day
          note: Mint 将其报道为公司声明的一部分；这是利用率视角，不是 SAM。
          tone: medium
          claimRefs:
            - CM007
        - label: 自有产能建设
          displayValue: 8 hospitals | 450 beds | 200k sq ft
          note: 近期自有医院扩张增加了更紧密但资本强度更高的可服务层。
          tone: warning
          claimRefs:
            - CM008
    approximationNotes: 各层按作者设定的顺序概括了不同但相关的视角；它们没有共同分母，不应被解读为推导出的转化率。
    claimRefs:
      - CM002
      - CM005
      - CM007
      - CM008
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 1-5 的序数评分依据指定证据中可见的医疗交付控制力和面向买方的便利性组合，为各替代方案定位；这些是分析师基于公开描述的判断，不是来源报告的市场份额指标。
    xAxis:
      label: 医疗交付控制力（序数）
      min: 1
      max: 5
      lowLabel: light-touch intermediation
      highLabel: high control over delivery
    yAxis:
      label: 买方便利性组合（序数）
      min: 1
      max: 5
      lowLabel: few bundled supports
      highLabel: broad bundled supports
    data:
      points:
        - label: Pristyn Care
          x: 5
          'y': 5
          detail: 自有外科医生、合作医院、医疗协调、保险协助、EMI、交通和随访支持。
        - label: Vidia
          x: 2
          'y': 3
          detail: 线上预约私立手术，说明其便利性，但指定证据显示其直接交付控制力较弱。
        - label: Mykare Health
          x: 1
          'y': 2
          detail: 主打储蓄计划和医疗贷款，侧重财务支持，而非端到端的医疗交付。
        - label: FirstCure
          x: 2
          'y': 2
          detail: 其医疗管理服务定位说明具备一定协调能力，但几乎没有证据显示其具备 Pristyn 级别的组合服务。
        - label: Medineeds
          x: 2
          'y': 3
          detail: 提供咨询和手术协调，便利性居中，但公开披露的供给控制力有限。
        - label: UNOMEDi Health
          x: 2
          'y': 3
          detail: 患者支持定位表明能提供协调支持，但公开披露的资金或运营深度很少。
    approximationNotes: 坐标是根据 SP001、SP002 和 SP003 的描述进行的序数综合，仅应理解为方向性的定位。
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP012
  - id: FI001
    title: 收入模式衔接图
    type: flow
    summary: 公开来源描绘出数字获客漏斗：把患者咨询转化为问诊、手术履约和随访支持，而不是设施租赁模式。
    data:
      nodes:
        - id: inquiry
          label: 患者咨询
          value: 12000
          unit: daily
          note: Mint 引述的公司日均触达数。
        - id: consult
          label: 问诊
          value: 1300
          unit: daily
          note: Mint 引述的诊所问诊数。
        - id: coordinator
          label: Care Buddy 协调
          note: 预约、保险、交通、入院、出院和随访支持。
        - id: financing
          label: 保险 / 零成本 EMI
          note: 嵌入患者旅程，用来降低支付摩擦。
        - id: surgery
          label: 手术
          value: 200
          unit: daily
          note: Mint 引述的合作医院手术数。
        - id: infrastructure
          label: 合作医院基础设施
          note: 公司依托 800+ 家合作医院履约，而不是依靠自有医院建设。
        - id: followup
          label: 术后随访
          note: 免费随访支持有助于守住结果和体验。
      edges:
        - from: inquiry
          to: consult
        - from: consult
          to: coordinator
        - from: coordinator
          to: financing
        - from: financing
          to: surgery
        - from: infrastructure
          to: surgery
        - from: surgery
          to: followup
    approximationNotes: 数量是 Mint 报道的历史公司声明；该图是流程衔接，而不是声称同日漏斗必然将同一批患者转化。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Pristyn Care 将需求捕获、医疗协调、分布式临床交付和不断扩大的自有医院层并入同一条手术工作流。
    data:
      layers:
        - label: 患者入口
          detail: 网站和电话都可预约咨询，提供免费问诊和第二意见入口。
          modules:
            - 网站接入
            - 呼叫中心路由
        - label: 医疗协调
          detail: 专门的 Care Buddy 层负责诊断、文件和康复支持。
          modules:
            - 保险和文件
            - 入院 / 出院协调
            - 交通和随访
        - label: 临床供给
          detail: 专科临床医生和手术组合提供实际治疗产能。
          modules:
            - 400+ 名专科外科医生
            - 多专科微创手术
        - label: 设施网络
          detail: 交付依托合作设施与自有设施混合构成的资产网络。
          modules:
            - 800+ 家合作医院
            - 官方网站列出的 9 家自有医院
        - label: 扩张与控制
          detail: 近期融资正用于新建医院，以加深基础设施控制力。
          modules:
            - 2025 年报道中已上线的 8 家自有医院
            - 450 张床位 / 200
            - 000 平方英尺
            - 与进一步医院扩张挂钩的融资
        - label: 信任与质量层
          detail: 公开材料强调安全和支持，但运营验证仍然有限。
          modules:
            - 安全优先定位
            - 保险支持
            - 术后随访
    approximationNotes: 该架构结合了官方未标日期的产品披露和 2025 年有日期的外部报道，因此自有医院层对应不同的截至时点。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE008
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Pristyn 靠数字渠道获取高意向患者，借助保险和医院物流协调整个治疗过程，再尝试把结果和患者评价转化为可重复的信任信号。
    data:
      items:
        - label: 发现症状或手术需求
          actor: 患者或家属
          channels:
            - Google 搜索广告
            - SEO / 教育内容
            - 本地化数字营销活动
          touchpoints:
            - 在线搜索症状或手术
            - 接触 Pristyn 的教育和患者评价内容
          tone: neutral
        - label: 预约问诊
          actor: 患者与 Pristyn 协调员
          channels:
            - 网站
            - 电话 / 快速预约流程
          touchpoints:
            - 首次免费问诊
            - 快速问诊和专科分诊
          tone: positive
        - label: 保险与术前协调
          actor: 患者、保险商、Care Buddy
          channels:
            - 医疗协调员
            - 保险文件流程
          touchpoints:
            - 无现金 / 预授权支持
            - 出行与排期支持
          tone: positive
        - label: 在合作或自有站点手术
          actor: 外科医生与医院基础设施
          channels:
            - 合作医院
            - 自有医院
            - 诊所
          touchpoints:
            - 由诊所、医院和专属外科医生构成的网络
            - 在 Pristyn 管理的治疗过程中执行手术
          tone: neutral
        - label: 康复与随访
          actor: 患者与医生
          channels:
            - 随访问诊
            - 住院后指导
          touchpoints:
            - 医生免费随访
            - 居家康复指导
          tone: positive
        - label: 信任或升级循环
          actor: 未来患者、推荐人、监督机构
          channels:
            - 患者评价和案例故事
            - 投诉 / 警方或媒体审查
          touchpoints:
            - 良好结果带来转介和数字证明
            - 糟糕的交接可能升级为负面报道和投诉
          tone: risk
    approximationNotes: 这是根据保留来源综合出的工作流，不是经过测量的转化漏斗；它展现顺序和摩擦点，不展现转化率。
    claimRefs:
      - CU001
      - CU002
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 患者结果、合作站点执行与融资透明度问题叠加之处，剩余风险最高。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余风险敞口
      rows:
        - label: 临床治理与患者安全争议
          note: 基于 Mint 报道的过失案件、投诉报道和手术激励指控。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: high
            - label: 高
              tone: high
        - label: 合作医院与保险交接风险
          note: 公司在很大一部分交付中仍依赖外部医院和保险流程。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 自有医院扩张与资本强度
          note: 扩张可能改善控制力，但在亏损仍高企时会增加固定成本和利用率压力。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 披露与报告不透明
          note: Tracxn、Inc42 和新闻报道没有呈现经核对的运营基线。
          values:
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 低
              tone: high
            - label: 高
              tone: high
        - label: 员工队伍稳定性与管理控制深度
          note: 历史人员流失和裁员情况表明，重组时运营流程失稳可能重演。
          values:
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 融资与估值压缩
          note: 近期资本信号表明，下一轮融资可能更多是为扩张筹资，而不是奖励已被验证的现金使用效率。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
    approximationNotes: 该矩阵表达基于指定来源池的定性尽调判断，并非量化精算模型。
    claimRefs:
      - CR003
      - CR007
      - CR012
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 运营层面的验证确实存在，但定价、亏损和治理证据仍未解决，因此推荐仍保持谨慎。
    data:
      nodes:
        - id: scale
          label: 已验证的运营覆盖
          summary: Multiple sources describe hundreds of surgeons and care sites, confirming category relevance.
          claimRefs:
            - CV006
        - id: financial-proof
          label: 财务验证不完整
          summary: >-
            Revenue/total-income figures exist, but the retained public numbers are inconsistent and loss visibility
            remains partial.
          claimRefs:
            - CV004
        - id: pricing
          label: 2025 年定价信号偏弱
          summary: The latest disclosed raise was small and same-price, so there is limited fresh price discovery.
          claimRefs:
            - CV001
            - CV003
            - CV009
        - id: risk
          label: 执行与治理风险仍高
          summary: Adverse operating and quality reporting keep downside scenarios alive.
          claimRefs:
            - CV007
        - id: optionality
          label: IPO / 扩张期权取决于条件
          summary: >-
            Profitability and IPO goals exist, but they still depend on unproven hospital economics and cleaner
            disclosure.
          claimRefs:
            - CV005
            - CV011
            - CV014
        - id: decision
          label: 推荐：继续研究
          summary: Wait for audited profitability, terms, and owned-hospital proof before underwriting upside.
          claimRefs:
            - CV012
            - CV013
      edges:
        - from: scale
          to: financial-proof
          label: 规模带来关注
          detail: 运营覆盖只有转化为稳定的经济效益才有意义。
        - from: financial-proof
          to: pricing
          label: 波动的经济表现削弱价格支撑
          detail: 财务披露前后不一致，更难为溢价轮融资提供依据。
        - from: pricing
          to: risk
          label: 价格发现不足放大下行风险
          detail: 过桥式融资会放大市场对执行失误的敏感度。
        - from: risk
          to: optionality
          label: 退出前须化解风险
          detail: 治理和质量方面的担忧可能推迟 IPO 准备进程。
        - from: optionality
          to: decision
          label: 仅有期权还不够
          detail: 在条款和利润率得到验证前，保持谨慎更合适。
    approximationNotes: 这是一条分析决策路径，不是实际观察到的流程图。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
