      - number: '4.3'
        title: 资本依赖仍然存在，因为最新融资更像过桥而非最终定价
        blocks:
          - type: paragraph
            body: >-
              资本充足性风险仍是财务判断的核心。多个来源仍将 2021 年独角兽估值锚定在约 $1.4 billion，但最新披露的 2025 年融资要么是投后估值 $1.17 billion 的 $5.48 million
              轮融资，要么是按持平 $1.4 billion 估值、以 $4 million 进行的内部过桥。无论哪种说法，都更像支持性资本，而不是明显的新一轮增长定价上调。公开累计融资总额也互相
              冲突，仅凭外部报道难以判断资产负债表的可用缓冲。Mint 报道 2023 年 FY22 和 FY23 申报延迟，而现有公共来源
              没有披露现金余额、债务、营运资金使用、保险结算时间或自有站点贡献利润率。财务上模式或许仍能成立，但当前证据 支持的尽调结论是继续研究，而不是足以承保投资的信心。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI016
