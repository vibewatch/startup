  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 的公司材料和第三方资料都将其定位在择期及先进二级医疗手术，而非急诊、初级医疗或综合医院。
              纳入的支出是“手术加协调”链条：专科问诊、诊断、入院流程、保险文书、交通，以及多个专科微创手术的术后 随访。现状替代方案不是某个单一数字产品，而是患者独自寻找可信医生、比较医院、办理保险并协调康复的碎片化
              线下流程。这一定义意味着 Pristyn 的市场是面向消费者的手术导航与交付层，而不是整个印度医疗市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
