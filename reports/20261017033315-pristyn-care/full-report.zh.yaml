      - number: '2.3'
        title: 买方、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              终端用户是患者，但购买通常由家庭决策者推动，许多病例还要走保险审批流程。Pristyn 的价值主张反复强调免费问诊、医疗协调员、免现金理赔、免息
              EMI、交通和术后随访。这些因素说明，预算压力和行政负担在购买决策中与临床质量同样重要。公司解决的是自费或保险支付的择期手术所涉及的信任与便利问题，尤其是患者可以推迟治疗、比较方案，或转向
              更便宜的非手术治疗时。因而，转化率会受渠道质量、支付方组合，以及把搜索需求变成排期手术所需成本影响。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Pristyn 最强的增长驱动来自手术覆盖面、庞大的合作供给，以及能降低择期手术恐惧、文书和就医摩擦的面向消费者 的支持。如果利用率保持稳定，较新的自有医院布局可能凭借更强的体验控制和更优的经济性提升表现，因为
              Pristyn 无需 再与合作医院分走那么多利润。但这一转变也会增加房地产、设备、人员和床位占用的固定成本敞口。Mint 的报道还指出
              另一项执行约束：销售驱动的漏斗和转化目标可能提高吞吐量，但如果患者、保险方或承接医院认为激励在过度推动手术，
              也会带来声誉和监管风险。在缺乏按站点独立披露支付方结构、入住率或贡献利润率的情况下，采用与估值逻辑仍有部分 未经证明。
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自有医院提升控制力，但压缩容错空间
            body: >-
              如果 Pristyn 能把合作方驱动的择期手术需求转化为自有医院中的可复制入住率和利润率，市场故事会更有说服力；
              但现有证据池仍缺少支付方结构、入住率或站点贡献利润率的独立披露。在这些信息出现前，自有医院战略应被视为 带有真实执行风险的上行杠杆，而不是已被证明的市场扩张。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 周边可见的数字化格局并不只有一组同业。Tracxn 当前的竞争者视图在 24 家活跃竞争者中将 Pristyn
              排在第一，并列出多类替代者：手术预约平台、医疗管理中介和患者支持服务，而非纯医院连锁。这很重要，因为 买方可以用多种方式解决同一需求：选择 Pristyn
              这样的打包协调者、使用更轻量的手术市场、通过咨询或融资服务， 或回到传统的医院—医生就诊路径。因此，证据支持的不是一个整齐的同类竞争者类别，而是一张包含直接数字同业、
              相邻医疗管理工具，以及直接比较现有医院连锁和专科医生这一现状替代方案的市场图。公开规模数字彼此矛盾， 也意味着在管理层对当前覆盖和融资指标完成对账前，竞争比较只能作为方向性参考。
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP015
              - CP016
