  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构清晰，但实际变现仍不透明
        blocks:
          - type: paragraph
            body: >-
              即使具体收入总额不一致，公开证据对 Pristyn Care 如何赚钱的方向判断基本一致。公司通过合作医院承接择期手术，
              而不是完全依托自有医院，同时提供自己的医生、设备和患者协调层。因此，收入模式建立在手术转化和打包服务便利性 上，而非单纯拥有医疗设施。Care Buddy 模式、首次免费问诊、保险办理、交通和免息 EMI
              似乎都在提升转化并降低 客单价门槛，但公开来源没有披露实际收入中有多少来自手术费、自有诊所就诊、融资支持或较新的相邻业务。这一点 尤其重要，因为后续第三方分析称合并收入包含非核心 D2C
              业务；若不清晰拆分分部经济性，这会夸大核心手术引擎的表面 强度。
