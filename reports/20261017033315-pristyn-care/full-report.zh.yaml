        title: 产品已具成熟度，但模式正在重构
        blocks:
          - type: paragraph
            body: >-
              公开材料支持 Pristyn 已达到有意义的运营规模，但也显示产品正从以轻资产协调为主的模式，重构为基础设施更重的 医疗交付业务。官方页面目前列出 150+ 家诊所、9 家自有医院、800+ 家合作医院、400+
              名医生以及 40+/45+ 个城市； 2025 年末外部报道则称，公司在此前四个月开设了 8 家自有医院，管理约 450 张床位和 200,000 平方英尺空间。融资
              报道把新资金直接与自有医院扩张联系起来，因此这不是边缘试验，而是控制更多交付环境的战略尝试。需要谨慎的是， 公开覆盖数字尚未在不同来源间清晰对账，难以判断旧合作模式和新自有资产模式各自已有多少投入运营。
