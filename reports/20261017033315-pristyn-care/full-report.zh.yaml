  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 的产品更适合被理解为一套协调式择期手术工作流，而不是单一软件模块或专有临床设备。官方材料和
              第三方资料都将其描述为管理患者从预约问诊、诊断、保险文书、入院、手术支持、出院到随访的完整旅程。核心客户 承诺是让碎片化医疗路径更便利、更容易导航，而不是提供新的治疗或诊断方式。服务覆盖直肠病学、泌尿科、妇科、
              耳鼻喉科、眼科、骨科、生育、肿瘤以及居家护理等相邻领域，足以构成多专科二级医疗平台；即便技术护城河目前 主要仍是工作流和协调，产品面已经很宽。
            claimRefs:
              - CE001
              - CE002
              - CE003
