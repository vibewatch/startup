    rows:
      - - 选择性及进阶二级医疗手术
        - 计划手术的手术费及术前协调，涵盖肛肠科、泌尿科、妇科、耳鼻喉科、眼科、骨科、减重、肿瘤科及相关专科。
        - 急诊手术、创伤治疗和广义住院急性医疗。
        - 买方 / 用户是患者或家庭；支付方取决于审批路径，可能是自费患者或保险公司。
        - 定义了 Pristyn 反复宣称服务的核心市场。
      - - 围绕手术的照护协调层
        - 与手术完成挂钩的检查预约、入院流程、保险文件、交通、出院和随访。
        - 一般健康管理、长期疾病管理和独立的初级医疗订阅。
        - 买方是患者 / 家庭；支付方通常由保险公司和使用 EMI 融资的家庭共同承担。
        - 说明 Pristyn 竞争的是碎片化的线下就医导航，而不只是医院。
      - - 微创多专科组合
        - 覆盖 50+ 种疾病或病症的激光、腹腔镜、LASIK 及其他微创手术。
        - 制药、纯诊断和非手术慢病支出。
        - 买方 / 用户是患者；支付方取决于手术保障范围和家庭支付能力。
        - 支撑以专科广度驱动的扩张，但不代表完整的医疗 TAM。
      - - 自有医院扩张层
        - 将手术导入自有医院后产生的床位、手术室和基础设施经济性。
        - Pristyn 导流手术之外的全部综合医院收入。
        - 买方仍是患者或家庭；支付方仍由保险和自费混合构成。
        - 展示了较新的可服务层：可能提升控制力，但也会增加固定成本风险。
    notes: 市场边界依据公司和独立资料中的描述划定；当前资料池没有可信的全市场支出估算，因此纳入 / 排除的支出按手术流程定义， 而不是按已发布的卢比计价 TAM 定义。
