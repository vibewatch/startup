      - number: '3.2'
        title: 差异化：服务组合、控制点与战略方向
        blocks:
          - type: paragraph
            body: >-
              Pristyn 最明显的差异化不只是帮助用户找到手术，而是声称把手术包进一套便利服务：首次免费问诊、专属 Care Buddy、诊断排期、保险文书、交通、EMI
              和术后照护。独立报道还描述了一种模式：Pristyn 租用合作医院基础设施， 同时把自己的医生、设备和销售引擎嵌入患者旅程。这让它比公开描述集中在预约、咨询、贷款或手术支持上的轻量
              数字同业拥有更多控制力。与此同时，2024—2025 年来源显示战略正在转向：管理层称为提高效率已收缩城市和品类， 较新报道则称公司正在扩建自有医院和床位。可能的含义是，Pristyn
              正选择性加强供给控制，以守住体验质量和 单位经济，代价是原先轻资产故事不再那么简单。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
