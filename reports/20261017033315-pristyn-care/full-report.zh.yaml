chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律实体与医疗模式
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care 是一家总部位于 Gurugram、专注择期及二级医疗手术的印度医疗科技公司。其运营模式围绕患者获客、
              医疗协调、保险支持和手术交付展开，依托合作医院与不断扩大的自有医疗设施网络。公开来源一致认为公司由 Harsimarbir Singh、Dr. Vaibhav Kapoor 和 Dr. Garima
              Sawhney 于 2018 年 8 月创立；Tracxn 则将运营业务 关联至 GHV Advanced Care Private Limited，该公司于 2018 年 8 月 31
              日注册。公司官方页面始终把 Pristyn 定位为覆盖全流程的手术旅程管理者，而非普通门诊连锁，强调诊断协调、保险文书、交通和术后随访。


              这一身份关系到全文，因为 Pristyn 的价值主张取决于协调层、医生网络和患者陪护能否带来信任与可复制的单位 经济，而不只是带来线索。同一批证据还暴露出重要的术语风险：公司控制的页面、公司策划的 AI
              内容和第三方 数据库虽然描述了相近能力，却不总是采用相同的运营覆盖定义。因此，后文应将公开指标视为方向性数据，直到 它们能与经审计财务、当前站点数量以及更清晰的法律实体—运营资产映射完成对账。
            claimRefs:
              - CO001
