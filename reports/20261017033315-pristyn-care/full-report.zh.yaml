      - number: '3.3'
        title: 定价、迁移与护城河持续性
        blocks:
          - type: paragraph
            body: >-
              定价是公开记录最薄弱的环节，买方迁移也最容易发生。现有来源支持 Pristyn 宣传有竞争力的价格、折扣和融资，
              但没有提供按手术项目拆分的公开价目表或实际净价账本。这让服务组合有助于获客，却难以与现有医院做基准比较。 Mint
              的负面报道在此很关键：择期手术患者常会比较多位医生和不同报价，一对受访夫妇最终选择了更大的医院连锁， 因为对方开药且账单更低，而没有走 Pristyn 的手术路径。同一报道还提到激进的内部转化激励；2025
              年后续报道则 提到现金压力、裁员和高管离任。综合来看，Pristyn 的护城河依赖于在支付高接触服务层成本的同时守住信任；若服务 质量、定价可信度或合作医院经济性下滑，买方仍可多平台使用或回到既有服务商。
            claimRefs:
