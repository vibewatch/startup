      - number: '8.3'
        title: 牛市、基准与熊市框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景直观但大多仍是条件式的：如果公司把全国覆盖、自有医院扩张和 IPO 准备叙事转化为经审计盈利，并完成一轮价格明显更高的机构融资，现有 $1B+
              私募估值可能再次显得保守。保留的公开证据尚未显示这一转折；它展示的 反而是实际运营覆盖、公司声称的效率改善、同价过桥融资和未解决的披露缺口。


              因此，基准情景锚定最近的公开估值，而不是较早的独角兽标题。在该情景下，公司仍可能值得投资，但前提是条款克制且尽调更深入。悲观情景是医院扩张提高资本强度，而亏损、治理噪音或质量问题阻止公司获得 IPO
              所需的可信度。 这不需要业务失败；只要下一轮低于预期完成，或采用公开来源看不到的投资者保护条款即可。
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调事项与论文失效触发器
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调事项是实操性的，而非抽象问题。第一，取得经审计的 FY25 和 FY26 报表，对接营业收入、总收入、 亏损和现金消耗。第二，取得当前股权表，以及 2025 年 7
              月融资和据报道正在讨论的大轮融资条款，包括清算优先权、 债务、pay-to-play 机制和任何结构化下行保护。第三，通过审查床位入住率、ARPOB、贡献利润率、支付方结构和站点
              资本开支，验证自有医院战略是否创造价值。


              如果新披露显示大轮融资按更低有效价格完成、资本强度上升但亏损没有改善，或公司推进 IPO 窗口时治理和质量问题仍未
              解决，投资逻辑就会失效。只有定价证据变强，且下一轮尽调材料显示规模正在转化为持久利润率，而不是仅维持庞大运营 覆盖，建议才会改善。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断：继续研究
            body: 公开证据支持继续尽调，而不是直接进入投资判断。最新披露的定价看起来像过桥，亏损仍然可观，下一轮经济条件也 过于不透明，尚不足以给出买入建议。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV012
              - CV013
          - type: callout
            title: 什么会改善判断
            body: 判断改善需要的不只是增长叙事：还需要经审计的 FY25-FY26 利润率改善、不隐藏下行保护的融资条款，以及站点层面 证明自有医院战略获得的回报高于其资本负担。
            calloutType: assumption
            claimRefs:
              - CV005
              - CV011
              - CV014
