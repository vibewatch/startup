      - number: '4.2'
        title: 公开业务牵引力真实存在，但成本和利润率披露无法对账
        blocks:
          - type: paragraph
            body: >-
              现有数据确认 Pristyn Care 已搭建大型商业漏斗，但不能确认盈利具有持续性。Mint 引述公司数据称，每日触达患者超过 12,000 人、约 1,300 次门诊问诊、约 200
              台手术，说明获客引擎规模可观、运营吞吐量真实。但不同数据集的 FY24 财务披露并不一致：Inc42 报告收入 ₹388.4 crore、亏损 ₹200.1 crore；PTI/NewsVoir
              报告上一财年经审计总收入 ₹494 crore；ValueForStartups 则列出营业收入 ₹601 crore、总收入 ₹632 crore 和净亏损 ₹381
              crore。ValueForStartups 还认为 BeatXP D2C 业务抬高了收入，因此合并增长并不是手术利润质量的好代理。管理层称营销成本下降超过 50%，
              这一点令人鼓舞，但仍没有按专科和城市提供经验证的 CAC、回收期、毛利率或贡献利润率桥接表。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
