              处理和手术建议的指控。Pristyn 同时推进自有医院，使这些信号更值得重视：自有医院或许能改善控制，却也会在 FY24
              亏损仍高企时提高固定成本和执行风险。Tracxn、Inc42 和新闻报道的公开运营指标也不一致，因此当前员工数、收入和
              运营效率基线不能视为已干净对账。
