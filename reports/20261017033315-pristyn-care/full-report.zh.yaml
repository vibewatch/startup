      - number: '1.2'
        title: 管理层、融资历史与控制图谱
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，创始人三人仍同时主导管理和治理。公司官方材料将 Harsimarbir Singh 列为 CEO、Dr. Vaibhav Kapoor 列为 CMO、Dr. Garima Sawhney 列为
              CBO；Tracxn 也将这三人列为其能识别的现任董事。这种集中带来连续性和行业经验，但公开记录目前看不到有实质意义的独立董事监督、正式委员会架构，或高管管理与董事会控制之间清晰披露的分离。


              融资历史比治理细节清楚。多个来源证实，2021 年 12 月的 E 轮融资使 Pristyn 以约 $1.4 billion 估值跻身独角兽。 较新证据显示，2025
              年公司又从现有投资者处获得一轮规模小得多的追加融资；Tracxn 记录 2025 年 7 月的 $5.48 million E 轮投后估值为 $1.17 billion，Digital Health News
              则称公司按上一轮相同股价完成了 $4 million 内部融资。综合来看，公司仍能获得内部人资本支持，但尚未公开证明新一轮融资实现估值上调， 当前股权结构、债务堆栈及更完整的轮次条款仍披露不足。
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
              - CO008
