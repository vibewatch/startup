              - CO007
              - CO008
      - number: '1.3'
        title: 规模主张、里程碑节奏与负面信号
        blocks:
          - type: paragraph
            body: >-
              Pristyn 的公开里程碑叙事同时展现了运营覆盖和战略变化。公司控制的材料仍声称已具备全国规模；2025 年新闻
              记录则显示，公司通过开设首家医院、实现该院早期盈利里程碑，并在随后数月继续开院，转向自有基础设施。 独立来源支持公司在 2025 年扩张，但也说明后文为何应谨慎看待收入和规模数字：FY24 公开收入从 Inc42
              的 ₹388.4 crore 到 PTI 的 ₹494 crore 合并总收入，再到 Digital Health News 的 ₹600 crore 营业收入不等， 这些并非可互换指标。


              公开的下行记录同样不可忽视。Mint 报道了患者死亡调查、激进的手术转化激励指控、极高员工流失率，以及 2023 年财报延迟。PTI 后来称，公司为追求盈利于 2024 年进行重组，影响 1,700
              名员工中的不到 7%。 总体来看，公司确有运营野心，也有足够近期融资继续扩张，但公开披露仍未解决当前运行质量、治理韧性，以及 自有医院战略究竟降低还是叠加执行风险等问题。
