      - number: '2.2'
        title: 受证据约束的规模测算与覆盖
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持一套干净的外部 TAM/SAM/SOM 模型，因此最稳妥的规模测算方式是交叉验证已披露的运营口径。 官方及独立资料将 Pristyn 定位为全国多城市运营，但没有统一可对账的分母：披露范围从
              30 个城市到 40+ 个城市， 从约 700 家医院到 800+ 家医院或手术中心。历史融资报道补充了早期采用指标，Mint 2023 年的报道则提供了
              日患者互动、门诊问诊和完成手术等吞吐口径。这些信息说明公司已在印度择期手术协调领域实现实际渗透，但仍无法 量化 Pristyn 自身覆盖范围之外的总可服务支出。
