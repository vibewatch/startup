            body: >-
              现有证据指向分层运营模式：通过网站和问诊入口获取患者需求；由 Care Buddies 组成医疗协调层；由医生和手术组成
              临床供给层；再由合作医院和不断扩大的自有医院组成交付层。第三方明确称技术栈支持数字发现、接诊、医疗协调、 保险处理和工作流检查；外部报道则称历史模式租用医院基础设施，但提供 Pristyn
              自己的医生、设备和耗材。换句话说， 软件更像在编排一张服务密集型网络，而不是独立运行。这种架构扩张速度可能快于从零建设医院，但 Pristyn 员工、医生、 保险方和承接机构的每一次交接都带来依赖风险。
