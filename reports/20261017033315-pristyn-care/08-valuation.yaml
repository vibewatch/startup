    title: Bull / base / bear scenario table
    columns: [Scenario, Core assumptions, Valuation range logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Hospital expansion improves margins, profitability is audited, and the next round clears above the 2025 pricing signal.", "$1.3B-$1.5B analytical zone, roughly back toward the older unicorn narrative.", "Would require disclosed markup, cleaner governance, and evidence that scale converts into durable earnings.", "Breaks if the next raise is flat/down or if losses remain stubborn."]
      - [Base, "Growth continues and investors keep supporting the company, but terms stay only partly disclosed and operating metrics stay noisy.", "$1.0B-$1.2B analytical zone, anchored to the 2024-2025 public marks.", "Best fits today's retained evidence: real scale, same-price bridge signal, and unresolved diligence gaps.", "Moves lower if the larger round slips, terms are protective, or hospital economics disappoint."]
      - [Bear, "Owned-hospital expansion lifts capital intensity while losses, governance noise, or quality issues block a credible IPO path.", "Below $1.0B or a structured round where headline valuation overstates new-money economics.", "Would align with flat pricing, unresolved adverse signals, and weak disclosure quality.", "Triggered by down-round terms, delayed audits, or worsening quality/regulatory outcomes."]
