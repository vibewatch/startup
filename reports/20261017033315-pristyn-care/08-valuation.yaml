company:
  name: Pristyn Care
chapter:
  number: 8
  title: Valuation
  summary: >-
    Pristyn Care still looks like a real scaled care-delivery platform, but the latest
    public financing signals are too weak and too opaque to justify a clean buy call at
    current private marks. The retained evidence supports a **research-more** stance with
    **medium** confidence and a **stretched** valuation view until audited FY25-FY26
    economics, financing terms, and owned-hospital unit economics are disclosed.
sections:
  - id: recommendation
    title: Recommendation and price discipline
    body: |-
      The retained public evidence is directionally good enough to rule out a bullish underwriting case, but not good enough to support precise pricing. Third-party market-data sources still show a real late-stage company with roughly $181M-$183M raised and a latest disclosed July 2025 financing, while company-issued and independent materials continue to lean on the 2021 unicorn narrative. The problem is that the newer financing evidence looks incremental rather than price-discovering: Digital Health News reported the 2025 issuance was completed at the same share price as the previous round, and public sources still do not disclose liquidation preferences, debt, or other overhangs that would determine true entry economics.

      That pushes the chapter-level judgment to **research-more**, not because the business lacks evidence of demand, but because the financing and risk evidence is still skewed toward caution. Mint's reporting on flat growth commentary, a negligence complaint, and very high attrition keeps downside risk live, while current public materials do not close the gap on audited FY25-FY26 performance or hospital-level returns. If a new investor is being asked to pay near prior unicorn-era marks, the burden of proof is higher than the present evidence can carry.
    claimRefs: [CV001, CV002, CV003, CV007, CV009, CV012, CV013]
    tableRefs: [TV001]
  - id: valuation-context
    title: Financing context, operating proof, and what still does not clear
    body: |-
      There is enough evidence to conclude that Pristyn Care is not an early experiment: both company-issued and third-party sources describe a network with 400+ surgeons and hundreds of care sites, and independent sources still describe meaningful FY24 revenue scale. However, those same sources disagree on key denominators. Official material says 150+ owned clinics, 800+ partner hospitals, and 40+ cities, while a 2025 Hospital Management/Yahoo republish says more than 200 clinics, 700 hospitals, and 30 cities. Financial metrics are also mixed: PTI/NewsVoir cited Rs. 494 crore audited total income in the prior fiscal, Digital Health News cited INR 600 crore operating revenue with INR 381 crore of losses for FY24, and Inc42 listed FY24 revenue at ₹388.4 crore+.

      The financing pattern matters more than the headline scale. Tracxn lists a Jul 22, 2025 Series E financing of $5.48M at a $1.17B post-money valuation, below its own Jun 2024 $1.23B mark and below the older 2021 unicorn framing still cited by company-issued and syndicated sources. Digital Health News separately reported that the 2025 CCPS issuance was completed at the same share price as the previous round, which reads more like bridge support than a fresh market-clearing markup. That does not disprove upside, but it does mean the current price narrative depends on unpublished terms and future execution.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios
    title: Bull, base, and bear framing
    body: |-
      The bull case is straightforward but still mostly conditional: if the company converts its national footprint, owned-hospital expansion, and IPO preparation narrative into audited profitability and a clearly higher-priced institutional round, the existing $1B+ private marks could again look conservative. The retained public evidence does not yet show that turn. Instead, it shows a mix of real operating reach, company-claimed efficiency gains, same-price bridge financing, and unresolved disclosure gaps.

      The base case therefore stays anchored around the most recent public marks rather than the older unicorn headline. In that base case, the company can still be investable, but only with disciplined terms and deeper diligence. The bear case is that hospital expansion raises capital intensity while losses, governance noise, or quality issues prevent the company from earning IPO-ready credibility. That downside does not need business failure; it only needs the next round to clear below expectations or on investor-protective terms that are not visible in public sources.
    claimRefs: [CV005, CV008, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: diligence-asks
    title: Final diligence asks and thesis-break triggers
    body: |-
      The most important diligence asks are practical rather than abstract. First, obtain audited FY25 and FY26 statements that bridge operating revenue, total income, losses, and cash consumption. Second, obtain the current cap table and the terms of the July 2025 financing and the larger round reportedly in discussion, including liquidation preferences, debt, pay-to-play mechanics, and any structured downside protection. Third, test whether the owned-hospital strategy is creating value by reviewing bed occupancy, ARPOB, contribution margin, payor mix, and site-level capex.

      The thesis breaks if new disclosure shows that the larger round clears at a lower effective price, if losses remain flat while capital intensity rises, or if governance and quality issues remain unresolved as the company pushes toward an IPO window. The recommendation can improve only if pricing evidence strengthens and the next diligence package shows that scale is translating into durable margins rather than simply sustaining a large operating footprint.
    claimRefs: [CV004, CV006, CV007, CV011, CV012, CV013, CV014]
