    title: "Current call: research-more"
    body: >-
      Public evidence supports continued diligence, not a clean underwriting leap. The
      latest disclosed pricing looks bridge-like, losses are still meaningful, and the
      next-round economics remain too opaque for a buy recommendation.
    claimRefs: [CV003, CV012, CV013]
  - calloutType: assumption
    title: "What would upgrade the view"
    body: >-
      A view upgrade needs more than growth rhetoric: it needs audited FY25-FY26 margin
      improvement, round terms that do not hide downside protection, and site-level proof
      that the owned-hospital strategy earns returns above its capital burden.
    claimRefs: [CV005, CV011, CV014]
