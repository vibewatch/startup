    whyItMatters: >-
      A bridge-like 2025 financing event cannot be judged without knowing liquidity, debt covenants, and burn against
      available cash.
    diligencePath: Request latest board deck, treasury snapshot, debt schedule, and monthly cash-burn bridge.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Surgical revenue split versus BeatXP/D2C, including gross margin by segment and inventory working-capital impact.
    whyItMatters: >-
