evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: financials
    missingEvidence: >-
      A reconciled FY24-FY26 financial bridge separating operating revenue, total income, losses, and cash generation on
      the same reporting basis.
    whyItMatters: >-
      Later financial and valuation work cannot safely compare Pristyn's reported scale or margin trajectory while
      public sources use incompatible top-line labels.
    diligencePath: >-
      Obtain audited FY24-FY26 financial statements and management definitions for revenue, total income, and
      profitability metrics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, committee structure, independent-director presence, and any debt or venture-debt
      obligations.
    whyItMatters: >-
      Founder concentration and incomplete financing disclosures make it hard to judge downside control, covenant risk,
      and governance quality.
    diligencePath: Request the latest board deck, cap table, shareholder agreement summary, and debt schedule from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A current operating-footprint ledger defining owned hospitals, partner hospitals, clinics, surgeons, and city
      count on one date.
    whyItMatters: >-
      Company and third-party sources disagree on current network size, which affects diligence on growth efficiency and
      owned-asset strategy.
    diligencePath: Ask management for a dated site-and-provider ledger and reconcile it against internal MIS and public disclosures.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent India elective secondary-care surgery TAM/SAM/SOM with transparent methodology, geography, and
      segment definitions.
    whyItMatters: >-
      Without an external sizing benchmark, the chapter can only prove operating reach and throughput, not category
      share or true market headroom.
    diligencePath: >-
      Obtain a current analyst or industry-body study for Indian elective surgery or reimbursement-backed secondary-care
      procedures, then reconcile it to Pristyn's specialty mix and geographies.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: operating-footprint
    missingEvidence: >-
      A reconciled company ledger defining cities, clinics, partner hospitals, surgical centres, and daily patient
      interactions on one reporting basis.
    whyItMatters: >-
      The assigned sources point in the same direction but use different denominators, which weakens precision in SAM
      and utilization analysis.
    diligencePath: >-
      Request management's current operating-footprint deck or an audited KPI sheet that ties network counts and
      throughput to the same date and definitions.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: payor-mix-and-cac
    missingEvidence: >-
      Specialty-level payor mix, self-pay versus insurance split, CAC by channel and city tier, occupancy, and
      site-level contribution margins for owned hospitals.
    whyItMatters: >-
      Those metrics determine whether Pristyn's market penetration is profitable and whether owned hospitals widen the
      market or simply add fixed-cost leverage.
    diligencePath: >-
      Request board or lender materials covering hospital utilization, procedure mix, channel performance, and insurer
      approval rates by specialty and geography.
    relatedQuestionRefs:
      - QM004
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Procedure-level list prices, realized discounts, insurer mix, and payment terms for Pristyn and the named peers.
    whyItMatters: >-
      Without comparable price cards or realized pricing, the chapter can only compare packaging and anecdotal buyer
      tradeoffs rather than hard price competitiveness.
    diligencePath: >-
      Request current procedure price sheets, insurer reimbursement terms, and a sample of realized patient bills by
      specialty and city.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: footprint-reconciliation
    missingEvidence: >-
      A management-signed current operating-footprint ledger reconciling cities, clinics, partner hospitals, surgeons,
      and owned-hospital beds.
    whyItMatters: >-
      Conflicting scale numbers make it hard to benchmark Pristyn's true competitive reach against incumbents and
      digital peers.
    diligencePath: >-
      Obtain a dated internal network snapshot and reconcile it against hospital contracts, surgeon rosters, and current
      city-level operations.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: outcomes-and-trust
    missingEvidence: >-
      City-level conversion, complication, repeat-surgery, NPS, complaint, and partner-hospital renewal data by
      specialty.
    whyItMatters: >-
      Trust is central to moat durability, but the public record cannot distinguish whether Pristyn's bundle creates
      durable loyalty or masks service-quality weaknesses.
    diligencePath: >-
      Review monthly cohort dashboards, hospital renewal data, patient complaint logs, and medical-directorate quality
      metrics.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: conflicting-data
    severity: material
    topic: fy24-financials
    missingEvidence: >-
      Reconciled FY24-FY26 P&L, balance sheet, and cash-flow statements that map entity-level and consolidated numbers
      to one basis.
    whyItMatters: >-
      Public sources disagree on revenue, expenses, loss, and cumulative funding, so margin path and cash needs cannot
      be underwritten confidently.
    diligencePath: >-
      Obtain audited statutory filings, management accounts, and a one-page reconciliation of Inc42, PTI/NewsVoir, and
