      - number: '4.3'
        title: Capital dependence is still live because the latest financing looks bridge-like, not final
        blocks:
          - type: paragraph
            body: >-
              Capital-adequacy risk remains central to the financial verdict. Multiple sources still anchor the 2021
              unicorn valuation around $1.4 billion, but the latest disclosed 2025 financing is presented as either a
              $5.48 million round at a $1.17 billion post-money valuation or a $4 million internal bridge at a flat $1.4
              billion valuation. Either framing points to support capital rather than an obviously new growth-pricing
              step-up. Public tallies of lifetime funding also conflict, which makes it hard to judge available
              balance-sheet cushion from external reporting alone. That matters more because Mint reported delayed FY22
              and FY23 filings in 2023, while no current public source in this pool discloses cash on hand, debt,
              working-capital usage, insurer settlement timing, or owned-site contribution margins. Financially, the
              model may still work, but the present evidence supports a diligence verdict of research-more rather than
              underwriteable confidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI016
