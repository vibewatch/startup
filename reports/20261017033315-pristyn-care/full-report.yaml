      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The end user is the patient, but the adoption path is built around household decision makers and, for many
              cases, the insurance-approval workflow. Pristyn's value proposition repeatedly emphasizes free
              consultations, care coordinators, cashless claim handling, no-cost EMI, transport, and post-op follow-up,
              which suggests budget friction and administrative burden are as important as clinical quality in the
              buying decision. The company is therefore solving a trust-and-convenience problem for self-pay and insured
              elective procedures, especially where patients can defer treatment, compare options, or seek cheaper
              non-surgical care elsewhere. That makes conversion sensitive to channel quality, payor mix, and the cost
              of turning search demand into scheduled surgery.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Pristyn's strongest growth drivers are breadth of procedures, large partner supply, and consumer-facing
              support that reduces fear, paperwork, and access friction for elective surgery. The newer owned-hospital
              push could strengthen experience control and economics if utilization holds, because Pristyn no longer
              shares as much margin with partner hospitals. The same shift also increases fixed-cost exposure to real
              estate, equipment, staffing, and bed occupancy. Mint's reporting adds a separate execution constraint: a
              sales-led funnel and conversion targets may help throughput, but they also create reputational and
              regulatory risk if patients, insurers, or host hospitals perceive incentives as pushing surgery too
              aggressively. Without independent disclosure of payor mix, occupancy, or contribution margins by site, the
              adoption and valuation case remains partly unproven.
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Owned hospitals improve control but compress the margin for error
            body: >-
              The market story gets stronger if Pristyn can convert its partner-led elective-surgery demand into
              repeatable occupancy and margins inside owned hospitals, but the assigned pool still lacks independent
              disclosure on payor mix, occupancy, or site-level contribution margins. Until that appears, the
              hospital-ownership strategy should be treated as an upside lever with real execution risk rather than as
              proven market expansion.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The visible digital landscape around Pristyn Care is broader than a single peer set. Tracxn's current
              competitor view ranks Pristyn first among 24 active competitors and surfaces named alternatives that split
              between surgery-booking platforms, healthcare-management intermediaries, and patient-support services
              rather than pure hospital chains. That matters because the buyer can solve the same job in several ways:
              use a bundled coordinator such as Pristyn, pick a lighter-touch surgery marketplace, work through an
              advisory or financing-oriented service, or go back to a conventional hospital-and-doctor journey. The
              evidence therefore supports a market map with direct digital peers, adjacent healthcare-management tools,
              and the status-quo substitute of shopping among incumbent hospital chains and specialists directly rather
              than one neat category of like-for-like rivals. Contradictory public scale numbers also mean competitor
              comparisons should be treated as directional, not precise, until management reconciles current footprint
              and funding metrics.
            claimRefs:
