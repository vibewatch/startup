      - number: '5.2'
        title: Operating architecture is the real product
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a layered operating model: patient demand capture through web and
              consultation surfaces; a care-coordination layer staffed by Care Buddies; a clinical supply layer of
              surgeons and procedures; and a delivery layer spanning partner hospitals plus an expanding owned-hospital
              base. Third-party descriptions explicitly say the technology stack supports digital discovery, intake,
              care coordination, insurance processing, and workflow checks, while external reporting says the historical
              model leased hospital infrastructure but supplied Pristyn's own doctors, equipment, and consumables. In
              other words, software appears to orchestrate a service-heavy network rather than stand alone. That
              architecture can scale faster than greenfield hospital build-out, but it also creates dependency risk at
              every handoff between Pristyn staff, surgeons, insurers, and host facilities.
            claimRefs:
