          pricing.
        - Confidence rises with reconciled financials, cap-table terms, and owned-hospital KPIs.
      - - Risk rating
        - high
        - Adverse operating/governance signals remain material beside the growth narrative.
        - Risk falls only if quality controls and reporting discipline are evidenced.
      - - Valuation stance
        - stretched
        - Latest disclosed 2025 pricing signals do not show a convincing markup while losses remain unresolved.
        - A lower entry price or audited margin inflection would soften the stance.
      - - Decision implication
        - Wait for deeper diligence
        - Do not underwrite a clean rerating from the retained public record alone.
        - Proceed only if the next round and diligence package close the current blockers.
    notes: >-
      Assessments synthesize retained public sources as of 2026-10-17; missing financing terms and FY25-FY26 audits
      limit precision.
    claimRefs:
      - CV003
      - CV007
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Operating proof
        - National scale and hundreds of providers/sites show Pristyn Care is beyond concept stage.
        - Footprint definitions and financial metrics conflict across sources, so scale quality is still partly opaque.
        - Audited disclosures with consistent definitions for clinics, hospitals, surgeons, and city coverage.
      - - Financing signal
        - Existing investors are still supporting the business and a larger round remains under discussion.
        - The latest disclosed 2025 raise was small and same-price, which looks bridge-like rather than a fresh mark-up.
        - A fully priced institutional round with disclosed terms and a clear markup.
      - - Strategic optionality
        - Owned hospitals and the Lybrate acquisition could expand control and platform breadth.
        - >-
          Expansion adds capital intensity, and the retained public sources do not show unit economics or acquisition
          value creation.
        - Per-hospital economics and post-acquisition monetization evidence.
      - - Exit path
        - Management publicly targets FY25 profitability and a 2027 IPO path.
        - >-
          That path is still company-claimed and sits beside flat losses, adverse operating signals, and limited term
          disclosure.
        - Two audited periods of margin improvement plus IPO-grade governance/reporting readiness.
    notes: >-
      Cells summarize thesis drivers and their counterweights; valuation support remains conditional where only
      company-issued or partial disclosures exist.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation range logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Hospital expansion improves margins, profitability is audited, and the next round clears above the 2025
          pricing signal.
        - $1.3B-$1.5B analytical zone, roughly back toward the older unicorn narrative.
        - Would require disclosed markup, cleaner governance, and evidence that scale converts into durable earnings.
        - Breaks if the next raise is flat/down or if losses remain stubborn.
      - - Base
        - >-
          Growth continues and investors keep supporting the company, but terms stay only partly disclosed and operating
          metrics stay noisy.
        - $1.0B-$1.2B analytical zone, anchored to the 2024-2025 public marks.
        - 'Best fits today''s retained evidence: real scale, same-price bridge signal, and unresolved diligence gaps.'
        - Moves lower if the larger round slips, terms are protective, or hospital economics disappoint.
      - - Bear
        - >-
          Owned-hospital expansion lifts capital intensity while losses, governance noise, or quality issues block a
          credible IPO path.
        - Below $1.0B or a structured round where headline valuation overstates new-money economics.
        - Would align with flat pricing, unresolved adverse signals, and weak disclosure quality.
        - Triggered by down-round terms, delayed audits, or worsening quality/regulatory outcomes.
    notes: >-
      Ranges are analytical zones derived from disclosed 2021-2025 marks, not observed executable prices or a full
      DCF/comps output.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV008
      - CV012
      - CV013
      - CV014
