  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care's public materials and third-party profiles consistently position the company around elective
              and advanced secondary-care surgeries rather than emergency care, primary care, or a general hospital
              proposition. The included spend is the procedure-plus-coordination stack: specialist consultation,
              diagnostics, hospital admission workflow, insurance paperwork, transport, and follow-up for minimally
              invasive surgeries across multiple specialties. The status-quo substitute is not a single digital product;
              it is the fragmented offline process of finding a trusted surgeon, comparing hospitals, clearing
              insurance, and coordinating recovery alone. That framing matters because it defines Pristyn's market as a
              consumer-facing surgery navigation and delivery layer, not the whole Indian healthcare market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
