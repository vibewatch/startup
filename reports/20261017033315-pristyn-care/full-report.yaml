chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal entity, and care model
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care is a Gurugram-based Indian healthtech company focused on elective and secondary-care
              surgeries, with the operating model centered on patient acquisition, care coordination, insurer support,
              and procedure delivery through a mix of partner hospitals and a growing owned-facility footprint. Public
              sources align on an August 2018 founding by Harsimarbir Singh, Dr. Vaibhav Kapoor, and Dr. Garima Sawhney,
              while Tracxn ties the operating business to GHV Advanced Care Private Limited, incorporated on 31 August
              2018. The official company pages consistently position Pristyn as a full-stack surgery journey manager
              rather than a general outpatient chain, emphasizing diagnostics coordination, insurance paperwork,
              transport, and follow-up care.


              That identity matters for the rest of the report because Pristyn's value proposition depends on whether
              its coordination layer, doctor network, and patient-handholding produce trust and repeatable unit
              economics, not just lead generation. The same evidence also shows an important terminology risk:
              company-controlled pages, company-curated AI content, and third-party databases describe similar
              capabilities but do not always use the same operating-footprint definitions. Later chapters should
              therefore treat public metrics as directional until they can be reconciled against audited financials,
              current site counts, and a cleaner legal-entity-to-operating-asset map.
            claimRefs:
