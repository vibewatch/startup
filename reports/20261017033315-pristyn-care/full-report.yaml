  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays cautious because operating proof is real but pricing, losses, and governance evidence
      remain unresolved.
    data:
      nodes:
        - id: scale
          label: Verified operating reach
          summary: Multiple sources describe hundreds of surgeons and care sites, confirming category relevance.
          claimRefs:
            - CV006
        - id: financial-proof
          label: Financial proof is incomplete
          summary: >-
            Revenue/total-income figures exist, but the retained public numbers are inconsistent and loss visibility
            remains partial.
          claimRefs:
            - CV004
        - id: pricing
          label: 2025 pricing signal is weak
          summary: The latest disclosed raise was small and same-price, so there is limited fresh price discovery.
          claimRefs:
            - CV001
            - CV003
            - CV009
        - id: risk
          label: Execution and governance risk remain high
          summary: Adverse operating and quality reporting keep downside scenarios alive.
          claimRefs:
            - CV007
        - id: optionality
          label: IPO / expansion optionality is conditional
          summary: >-
            Profitability and IPO goals exist, but they still depend on unproven hospital economics and cleaner
            disclosure.
          claimRefs:
            - CV005
            - CV011
            - CV014
        - id: decision
          label: 'Recommendation: research-more'
          summary: Wait for audited profitability, terms, and owned-hospital proof before underwriting upside.
          claimRefs:
            - CV012
            - CV013
      edges:
        - from: scale
          to: financial-proof
          label: Scale creates interest
          detail: Operating reach matters only if it translates into consistent economics.
        - from: financial-proof
          to: pricing
          label: Noisy economics weaken price support
          detail: Inconsistent financial disclosures make it harder to justify a premium round.
        - from: pricing
          to: risk
          label: Weak price discovery amplifies downside
          detail: Bridge-like financing increases sensitivity to execution misses.
        - from: risk
          to: optionality
          label: Risk must clear before exit
          detail: Governance and quality concerns can delay IPO readiness.
        - from: optionality
          to: decision
          label: Optionality is not enough yet
          detail: Until terms and margins are proven, caution is the better call.
    approximationNotes: This is an analytical decision path, not an observed process map.
    claimRefs:
