  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product actually delivers
        blocks:
          - type: paragraph
            body: >-
              Pristyn Care's product is best understood as a coordinated elective-surgery workflow rather than a single
              software module or proprietary clinical device. Across official materials and third-party profiles, the
              company frames its offer as managing the patient journey from consultation booking through diagnostics,
              insurance paperwork, hospital admission, surgery support, discharge, and follow-up. That matters because
              the core customer promise is convenience and navigation in a fragmented care pathway, not a new
              therapeutic or diagnostic modality. The service map is broad enough to look like a multi-specialty
              secondary-care platform, spanning proctology, urology, gynecology, ENT, ophthalmology, orthopedics,
              fertility, oncology, and home-care adjacencies, so the product surface is wide even if the technical moat
              is still mostly workflow and coordination.
            claimRefs:
              - CE001
              - CE002
              - CE003
