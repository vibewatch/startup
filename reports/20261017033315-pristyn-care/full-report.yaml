              - CM002
              - CM003
              - CM012
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing and footprint
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a clean external TAM/SAM/SOM model, so the most defensible sizing
              approach is to triangulate disclosed operating lenses. The official and independent profile sources place
              Pristyn at national multi-city scale, but not with a single reconciled denominator: disclosures range from
              30 cities to 40+ cities and from roughly 700 hospitals to 800+ hospitals or surgical centres. Historical
              fundraising coverage adds earlier adoption markers, while Mint's 2023 reporting gives a throughput lens of
              daily patient interactions, clinic consultations, and completed surgeries. Together these show real
              penetration in Indian elective surgery coordination, but they still stop short of quantifying the total
              addressable spend outside Pristyn's own footprint.
            claimRefs:
              - CM004
