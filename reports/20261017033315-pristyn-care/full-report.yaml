      - number: '1.2'
        title: Leadership, funding history, and control map
        blocks:
          - type: paragraph
            body: >-
              The founder trio still anchors both management and governance in public records. Official company
              materials identify Harsimarbir Singh as CEO, Dr. Vaibhav Kapoor as CMO, and Dr. Garima Sawhney as CBO,
              while Tracxn lists those same three as the active board members it can identify. That concentration gives
              Pristyn continuity and domain context, but it also means the public record does not currently show
              meaningful independent-board oversight, formal committee structure, or a clearly disclosed separation
              between executive management and board control.


              Funding history is clearer than governance detail. Multiple sources corroborate the December 2021 Series E
              that took Pristyn to unicorn status at roughly a $1.4 billion valuation. More recent evidence indicates a
              much smaller 2025 follow-on round from existing investors, with Tracxn recording a $5.48 million Series E
              round in July 2025 at a $1.17 billion post-money valuation and Digital Health News describing a $4 million
              internal raise at the same share price as the prior round. Together those records suggest the company
              preserved access to insider capital but did not publicly demonstrate a new step-up round, leaving the
              current cap table, debt stack, and broader round terms insufficiently disclosed.
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Scale claims, milestone cadence, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Pristyn's public milestone narrative shows both operating reach and strategic change. Company-controlled
              materials still claim broad national scale, while the 2025 press roll documents a shift toward owned
              infrastructure through the first hospital opening, an early profitability milestone for that site, and
              additional hospital launches in the following months. Independent sources support the existence of a 2025
              expansion effort, but they also expose why later chapters should be cautious with top-line and scale
              numbers: FY24 public revenue references range from Inc42's ₹388.4 crore revenue figure to PTI's ₹494 crore
              consolidated total income and Digital Health News' ₹600 crore operating-revenue figure, which are not
              interchangeable metrics.


              The public downside record is also material. Mint reported a patient-death investigation, allegations of
              aggressive surgery conversion incentives, very high employee attrition, and delayed financial statements
              in 2023. PTI later described a 2024 restructuring affecting less than 7% of 1,700 employees as management
              pursued profitability. The net picture is a company with real operating ambition and enough recent
              financing to keep expanding, but also one whose public disclosures still leave unresolved questions on
              current run-rate quality, governance resilience, and whether the owned-hospital strategy improves or
              compounds execution risk.
            claimRefs:
              - CO009
              - CO010
