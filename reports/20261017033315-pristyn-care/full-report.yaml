              - CP005
              - CP006
              - CP012
      - number: '3.2'
        title: 'Differentiation: service bundle, control points, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              Pristyn's strongest visible differentiation is not merely that it helps users find surgery; it claims to
              wrap the procedure in a convenience bundle that includes a free first consultation, a dedicated Care
              Buddy, diagnostics scheduling, insurance paperwork, transport, EMI, and follow-up care. Independent
              reporting also describes a model in which Pristyn leases partner-hospital infrastructure while inserting
              its own surgeons, equipment, and sales engine into the patient journey. That gives it more control than
              lighter digital peers whose public descriptions focus on booking, advisory, loans, or surgery support. At
              the same time, 2024-2025 sources indicate a strategic shift: management says it has narrowed cities and
              categories for efficiency, while newer reporting says the company is expanding owned hospitals and bed
              capacity. The likely implication is that Pristyn is trying to defend experience quality and unit economics
              by selectively taking more control over supply, even though that reduces the simplicity of the original
              asset-light story.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP012
              - CP013
      - number: '3.3'
        title: Pricing, switching, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Pricing is where the public record is weakest and buyer switching looks most plausible. The assigned
              sources support that Pristyn advertises competitive prices, discounts, and financing, but they do not
              provide a clean procedure-by-procedure public price card or realized net pricing ledger. That makes the
              bundle helpful for acquisition but hard to benchmark against incumbents. Mint's adverse reporting is
              important here: patients in elective surgery often shop among multiple doctors and offers, and one
              interviewed couple ultimately chose a larger hospital chain that prescribed drugs and a cheaper bill
              instead of Pristyn's surgical path. The same report also describes aggressive internal conversion
              incentives, while later 2025 reporting cites cash pressure, layoffs, and senior exits. Combined, those
              facts suggest Pristyn's moat depends on maintaining trust while funding a high-touch service layer; if
              service quality, pricing credibility, or partner-hospital economics slip, buyers can still multi-home or
              revert to incumbent providers.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pristyn's competitive edge is a packaged service layer, not just discovery
            body: >-
              The assigned evidence repeatedly describes Pristyn as owning more of the patient journey than lighter
              surgery-booking peers. That makes its closest competition not only digital coordinators but also any
              incumbent that can match convenience, insurance support, and trust without copying the full bundle.
            calloutType: insight
            claimRefs:
              - CP003
              - CP006
          - type: callout
            title: Trust and capital intensity can narrow the moat quickly
            body: >-
              Recent adverse reporting suggests Pristyn's sales incentives, service quality debates, layoffs, and
              selective move toward owned capacity could make the model harder to defend if patients or partner
              hospitals lose confidence.
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is clear, but realized monetization is still opaque
        blocks:
          - type: paragraph
            body: >-
              Public evidence is directionally consistent on how Pristyn Care makes money even when exact revenue totals
              are not. The company routes elective procedures through partner hospitals rather than a fully owned
              hospital base, while supplying its own surgeons, equipment, and patient-coordination layer. That creates a
              revenue model built around procedure conversion and bundled service convenience rather than pure facility
              ownership. The Care Buddy model, free first consultation, insurance handling, transport, and no-cost EMI
              appear designed to improve conversion and ticket affordability, but public sources do not disclose how
              much of realized revenue comes from surgery fees, owned-clinic visits, financing support, or newer
              adjacent businesses. That is especially important because later third-party analysis suggests the
              consolidated top line includes non-core D2C activity, which can overstate the apparent strength of the
              core surgery engine if segment economics are not separated cleanly.
            claimRefs:
