      - number: '4.2'
        title: Public traction is meaningful, but cost and margin disclosure does not reconcile
        blocks:
          - type: paragraph
            body: >-
              The available data confirms that Pristyn Care has built a large commercial funnel, but it does not confirm
              durable profitability. Mint quoted the company at more than 12,000 daily patient reach-outs, roughly 1,300
              clinic consultations, and about 200 surgeries per day, which implies a substantial acquisition engine and
              meaningful operating throughput. Yet FY24 financial disclosure is inconsistent across datasets: Inc42
              reports ₹388.4 crore of revenue with a ₹200.1 crore loss, PTI/NewsVoir cites ₹494 crore of audited total
              income for the last fiscal year, and ValueForStartups presents ₹601 crore of operating revenue, ₹632 crore
              of total revenue, and a ₹381 crore net loss. ValueForStartups also argues the BeatXP D2C business padded
              the top line, which makes consolidated growth a poor proxy for surgical margin quality. Management's claim
              that marketing costs fell more than 50% is encouraging, but it still stops short of a verified CAC,
              payback, gross-margin, or contribution-margin bridge by specialty and city.
            claimRefs:
