      - ["Care-coordination layer around surgery", "Diagnostics scheduling, hospital admission workflow, insurance paperwork, transport, discharge, and follow-up tied to surgery completion.", "General wellness, longitudinal disease management, and stand-alone primary-care subscriptions.", "Buyer is the patient/household; payer often shares with insurer or EMI-financed household spend.", "Explains why Pristyn competes against fragmented offline navigation, not just against hospitals."]
      - ["Minimally invasive multi-specialty portfolio", "Laser, laparoscopy, LASIK, and other minimally invasive procedures across 50+ diseases or conditions.", "Pharma, diagnostics-only, and non-procedural chronic-care spending.", "Buyer/user is the patient; payer depends on procedure coverage and household affordability.", "Supports breadth-driven expansion without implying a full healthcare TAM."]
      - ["Owned-hospital expansion layer", "Bed, theatre, and infrastructure economics for procedures routed into owned hospitals.", "All general-hospital revenue outside Pristyn-routed procedures.", "Buyer remains the patient or household; payer still mixes insurance and self-pay.", "Shows the newer serviceable layer that may improve control but increases fixed-cost risk."]
    notes: >-
      Boundary uses company and independent profile descriptions; the assigned pool does not
      provide a credible full-market spend estimate, so included/excluded spend is defined
      by procedure workflow rather than by a published rupee TAM.
