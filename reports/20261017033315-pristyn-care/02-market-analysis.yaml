      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Pristyn Care official information page", "2026", "India", "40+ cities; 150+ clinics; 800+ partner hospitals; 400+ surgeons; 50+ conditions.", "n/a", "Current company operating-footprint disclosure.", "Medium", "Company-issued footprint is useful for SAM directionally, but it is not an independent market-size estimate."]
      - ["Mint (quoting company statement)", "2023", "India", "12,000+ new patients reaching out daily; ~1,300 clinic consultations; ~200 surgeries/day.", "n/a", "Independent reporting of company-stated funnel and throughput metrics.", "Medium", "These are funnel and utilization metrics, not a category TAM, and the values use different denominators."]
      - ["Entrepreneur India", "2021", "India", ">500,000 patients treated in 2.5 years; >100 clinics; >400 hospitals; 50+ diseases; >30 cities.", "n/a", "Fundraising announcement reporting company scale claims at Series D.", "Medium", "Historical and company-claimed; useful as an adoption checkpoint rather than a current size estimate."]
      - ["Business Outreach", "2025-2026", "India", "80,000-90,000 surgeries a year in the asset-light phase; 30-40 cities; 800+ surgical centres.", "n/a", "Independent profile synthesizing public reports and investor analysis.", "Low-Medium", "Methodology is not fully disclosed, so this is better for order-of-magnitude context than for precise SAM."]
      - ["Digital Health News / Entrackr reporting", "2025", "India", "8 owned hospitals; 450 operational beds; ~200,000 sq ft; 10+ more hospitals planned.", "n/a", "Expansion reporting based on internal documents and regulatory filings reviewed by the publication.", "Medium", "Owned-hospital capacity is only one serviceable layer and cannot be treated as total demand."]
    notes: >-
      Because the assigned pool lacks a robust external TAM/SAM/SOM study, this table uses
      multiple footprint and throughput lenses. The rows are intentionally not additive and
      do not share a common denominator.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Urban elective-surgery patient", "Patient plus household decision makers", "Patient", "Household self-pay or mixed with insurance", "Search -> free consult -> diagnostics -> surgery scheduling -> follow-up", "Household decision maker", "Need for trusted surgeon choice, transparent pricing, and simpler hospital logistics."]
      - ["Insurance-dependent procedure patient", "Patient and household, gated by insurer approval", "Patient", "Insurer with potential out-of-pocket top-up", "Consult -> paperwork and pre-authorization -> hospital admission -> discharge support", "Insurer approval plus household consent", "Cashless claim handling and administrative support materially lower friction."]
      - ["Tier-2 / tier-3 access-constrained patient", "Patient and family", "Patient", "Household cash flow, EMI, or insurer", "Remote inquiry -> care coordinator -> travel and local partner routing -> post-op follow-up", "Family budget owner", "Local access to minimally invasive surgery and financing support expands adoption."]
      - ["Higher-acuity patient routed into owned hospitals", "Patient, family, and referring clinician", "Patient", "Household or insurer", "Consult -> direct routing to Pristyn-owned facility -> inpatient procedure -> recovery and follow-up", "Family plus insurer where applicable", "Need for tighter clinical control, standardized infrastructure, and better margin capture."]
    notes: >-
      Buyer map is inferred from Pristyn's disclosed service design rather than from a
      published cohort breakdown. It is strongest on workflow and payment friction, and weak
      on exact segment mix by specialty, channel, or insurer.
    claimRefs:
      - CM003
      - CM008
      - CM010
      - CM011
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The best available market lens is an adoption stack moving from the problem Pristyn
      claims to solve to the footprint and throughput it publicly discloses.
    data:
      nodes:
        - label: Underlying demand gap
          displayValue: Trust, pricing, insurance, and logistics friction
          note: Qualitative lens only; the assigned pool does not provide an independent rupee TAM.
          tone: medium
          claimRefs:
            - CM013
        - label: Procedure breadth
          displayValue: 50+ diseases / conditions
          note: Multi-specialty elective and secondary-care coverage rather than a single procedure niche.
          tone: positive
          claimRefs:
            - CM002
        - label: Geographic reach
          displayValue: 30-40+ cities
          note: Public disclosures are directionally consistent but not fully reconciled.
          tone: positive
          claimRefs:
            - CM005
        - label: Partner delivery network
          displayValue: 700-800+ hospitals / centres
          note: Definitions vary across official and media sources, so treat this as a range.
          tone: positive
          claimRefs:
            - CM005
        - label: Throughput lens
          displayValue: ~200 surgeries / day
          note: Mint reported this as part of a company statement; it is a utilization lens, not SAM.
          tone: medium
          claimRefs:
            - CM007
        - label: Owned-capacity buildout
          displayValue: 8 hospitals | 450 beds | 200k sq ft
          note: Recent owned-hospital expansion adds a tighter but more capital-intensive serviceable layer.
          tone: warning
          claimRefs:
            - CM008
    approximationNotes: >-
      Layers summarize unlike but relevant lenses in authored order; they do not share a
      common denominator and should not be read as derived conversion rates.
    claimRefs:
      - CM002
      - CM005
      - CM007
      - CM008
      - CM013
callouts:
  - calloutType: risk
    title: Owned hospitals improve control but compress the margin for error
    body: >-
      The market story gets stronger if Pristyn can convert its partner-led elective-surgery
      demand into repeatable occupancy and margins inside owned hospitals, but the assigned
      pool still lacks independent disclosure on payor mix, occupancy, or site-level
      contribution margins. Until that appears, the hospital-ownership strategy should be
      treated as an upside lever with real execution risk rather than as proven market
      expansion.
    claimRefs:
      - CM008
      - CM009
      - CM011
