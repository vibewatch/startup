  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: An independent India elective secondary-care surgery TAM/SAM/SOM with transparent methodology, geography, and segment definitions.
      whyItMatters: Without an external sizing benchmark, the chapter can only prove operating reach and throughput, not category share or true market headroom.
      diligencePath: Obtain a current analyst or industry-body study for Indian elective surgery or reimbursement-backed secondary-care procedures, then reconcile it to Pristyn's specialty mix and geographies.
      relatedQuestionRefs:
        - QM008
    - type: conflicting-data
      severity: material
      topic: operating-footprint
      missingEvidence: A reconciled company ledger defining cities, clinics, partner hospitals, surgical centres, and daily patient interactions on one reporting basis.
      whyItMatters: The assigned sources point in the same direction but use different denominators, which weakens precision in SAM and utilization analysis.
      diligencePath: Request management's current operating-footprint deck or an audited KPI sheet that ties network counts and throughput to the same date and definitions.
      relatedQuestionRefs:
        - QM002
    - type: private-evidence-only
      severity: material
      topic: payor-mix-and-cac
      missingEvidence: Specialty-level payor mix, self-pay versus insurance split, CAC by channel and city tier, occupancy, and site-level contribution margins for owned hospitals.
      whyItMatters: Those metrics determine whether Pristyn's market penetration is profitable and whether owned hospitals widen the market or simply add fixed-cost leverage.
      diligencePath: Request board or lender materials covering hospital utilization, procedure mix, channel performance, and insurer approval rates by specialty and geography.
      relatedQuestionRefs:
        - QM004
        - QM006
        - QM008
