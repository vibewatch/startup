        - plannedTables/market-definition-table
      status: answered
    - id: QM002
      question: Which public operating-footprint lenses best constrain Pristyn's serviceable market in lieu of a generic healthcare TAM?
      type: quantification
      targets:
        - contentRequirements/1
        - plannedTables/tam-sam-som-or-sizing-lens-table
        - plannedFigures/market-sizing-lens
      status: answered
    - id: QM003
      question: How does the partner-hospital model reduce capital intensity and expand reach compared with building hospitals from scratch?
      type: mechanism
      targets:
        - contentRequirements/3
        - plannedTables/tam-sam-som-or-sizing-lens-table
      status: answered
    - id: QM004
      question: Which buyer frictions does the Care Buddy workflow remove, and who effectively owns the budget decision for elective surgery?
      type: mechanism
      targets:
        - contentRequirements/2
        - plannedTables/segment-buyer-map
      status: answered
    - id: QM005
