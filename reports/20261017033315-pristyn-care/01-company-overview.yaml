company:
  name: Pristyn Care
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pristyn Care remains a sizable Indian surgery-coordination company with a documented
    2018 founding, a formal legal entity, and a 2025-2026 push from an asset-light partner
    network toward owned hospitals. Public evidence still supports the original December 2021
    unicorn round and a smaller July 2025 follow-on, but current scale, revenue, losses, and
    governance detail remain only partially reconciled across company-issued and third-party
    records.
sections:
  - id: identity-and-model
    title: Identity, legal entity, and care model
    body: |-
      Pristyn Care is a Gurugram-based Indian healthtech company focused on elective and secondary-care surgeries, with the operating model centered on patient acquisition, care coordination, insurer support, and procedure delivery through a mix of partner hospitals and a growing owned-facility footprint. Public sources align on an August 2018 founding by Harsimarbir Singh, Dr. Vaibhav Kapoor, and Dr. Garima Sawhney, while Tracxn ties the operating business to GHV Advanced Care Private Limited, incorporated on 31 August 2018. The official company pages consistently position Pristyn as a full-stack surgery journey manager rather than a general outpatient chain, emphasizing diagnostics coordination, insurance paperwork, transport, and follow-up care.

      That identity matters for the rest of the report because Pristyn's value proposition depends on whether its coordination layer, doctor network, and patient-handholding produce trust and repeatable unit economics, not just lead generation. The same evidence also shows an important terminology risk: company-controlled pages, company-curated AI content, and third-party databases describe similar capabilities but do not always use the same operating-footprint definitions. Later chapters should therefore treat public metrics as directional until they can be reconciled against audited financials, current site counts, and a cleaner legal-entity-to-operating-asset map.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO014]
    tableRefs: [TO001, TO002]
  - id: leadership-capital-and-control
    title: Leadership, funding history, and control map
    body: |-
      The founder trio still anchors both management and governance in public records. Official company materials identify Harsimarbir Singh as CEO, Dr. Vaibhav Kapoor as CMO, and Dr. Garima Sawhney as CBO, while Tracxn lists those same three as the active board members it can identify. That concentration gives Pristyn continuity and domain context, but it also means the public record does not currently show meaningful independent-board oversight, formal committee structure, or a clearly disclosed separation between executive management and board control.

      Funding history is clearer than governance detail. Multiple sources corroborate the December 2021 Series E that took Pristyn to unicorn status at roughly a $1.4 billion valuation. More recent evidence indicates a much smaller 2025 follow-on round from existing investors, with Tracxn recording a $5.48 million Series E round in July 2025 at a $1.17 billion post-money valuation and Digital Health News describing a $4 million internal raise at the same share price as the prior round. Together those records suggest the company preserved access to insider capital but did not publicly demonstrate a new step-up round, leaving the current cap table, debt stack, and broader round terms insufficiently disclosed.
    claimRefs: [CO001, CO003, CO006, CO007, CO008]
    tableRefs: [TO003]
  - id: scale-milestones-and-risks
    title: Scale claims, milestone cadence, and adverse signals
    body: |-
      Pristyn's public milestone narrative shows both operating reach and strategic change. Company-controlled materials still claim broad national scale, while the 2025 press roll documents a shift toward owned infrastructure through the first hospital opening, an early profitability milestone for that site, and additional hospital launches in the following months. Independent sources support the existence of a 2025 expansion effort, but they also expose why later chapters should be cautious with top-line and scale numbers: FY24 public revenue references range from Inc42's ₹388.4 crore revenue figure to PTI's ₹494 crore consolidated total income and Digital Health News' ₹600 crore operating-revenue figure, which are not interchangeable metrics.

      The public downside record is also material. Mint reported a patient-death investigation, allegations of aggressive surgery conversion incentives, very high employee attrition, and delayed financial statements in 2023. PTI later described a 2024 restructuring affecting less than 7% of 1,700 employees as management pursued profitability. The net picture is a company with real operating ambition and enough recent financing to keep expanding, but also one whose public disclosures still leave unresolved questions on current run-rate quality, governance resilience, and whether the owned-hospital strategy improves or compounds execution risk.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
