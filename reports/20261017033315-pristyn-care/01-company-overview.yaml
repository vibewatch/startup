    claimRefs: [CO006, CO007, CO008]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly documented milestones show the shift from founding and unicorn financing to
      2025 owned-hospital expansion, alongside notable adverse and restructuring markers.
    data:
      items:
        - date: 2018-08-01
          label: Founded in Gurugram
          details: Founded by Harsimarbir Singh, Dr. Vaibhav Kapoor, and Dr. Garima Sawhney.
          tone: positive
          claimRefs: [CO001]
        - date: 2021-12-07
          label: Unicorn round closes
          details: Series E financing of $96M values the company at roughly $1.4B.
          tone: positive
          claimRefs: [CO007]
        - date: 2023-08-31
          label: Mint documents adverse operating signals
          details: Patient-backlash, attrition, and delayed-financial-statement concerns become public.
          tone: warning
          claimRefs: [CO011, CO012]
        - date: 2024-03-01
          label: Profitability push and restructuring announced
          details: Company says it is targeting FY25 profitability and that less than 7% of 1,700 employees are affected by a reorganization.
          tone: warning
          claimRefs: [CO009, CO013]
        - date: 2025-02-14
          label: First owned hospital opens
          details: Company-curated press roll flags the first hospital opening as a strategic milestone.
          tone: positive
          claimRefs: [CO010]
        - date: 2025-04-22
          label: First hospital reported profitable
          details: The same press roll highlights an early profitability milestone for the owned-hospital strategy.
          tone: positive
          claimRefs: [CO010]
        - date: 2025-06-20
          label: Three smart hospitals added
          details: Press coverage curated on the company site points to accelerating owned-hospital build-out.
          tone: positive
          claimRefs: [CO010]
        - date: 2025-07-22
          label: Insider follow-on financing recorded
          details: Tracxn logs a $5.48M Series E follow-on round at a $1.17B post-money valuation.
          tone: neutral
          claimRefs: [CO006]
    approximationNotes: >-
      Timeline uses public publication dates as milestone anchors; curated press entries should be
      read as company-selected evidence rather than independent validation of performance.
    claimRefs: [CO001, CO006, CO007, CO009, CO010, CO011, CO012, CO013]
