      - ["Peak XV Partners", "Lead continuing institutional investor", "Named in 2021 unicorn round and 2025 insider follow-on", "Signals continued sponsor support through a smaller internal round", "Confirm ownership %, liquidation preferences, and whether 2025 capital reset valuation expectations."]
      - ["Hummingbird Ventures", "Continuing institutional investor", "Named in 2021 round and 2025 follow-on participation", "Repeat support suggests willingness to defend the company through expansion", "Check pro-rata behavior, governance rights, and exit horizon."]
      - ["Tiger Global / Epiq / Winter / other prior funds", "Legacy growth backers", "Backed the 2021 unicorn financing and remain part of the cap-table narrative", "Important for down-round sensitivity and future syndicate behavior", "Request current cap table, investor consents, and any preference stack or ratchet terms."]
      - ["Trifecta Capital / debt-like capital providers", "Potential structured-capital influence", "Tracxn includes Trifecta in the 2021 investor roster", "Could matter if working-capital or structured instruments shape cash runway", "Confirm whether debt, venture debt, or covenant-bearing facilities remain outstanding."]
    notes: >-
      Investor-map rows synthesize disclosed cap-table fragments from profile pages and funding
      reports; they are directional until management provides a full current capitalization table.
    enumerationScope:
      coverage: partial
      basis: >-
