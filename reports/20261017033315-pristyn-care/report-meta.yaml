  topStrengths:
    - Real operating reach with a large surgery-coordination footprint and repeat investor support.
    - Clear category fit in elective and secondary-care surgery, with both partner and owned-hospital channels.
    - Enough disclosed revenue scale to confirm the company is beyond an early experiment.
  topRisks:
