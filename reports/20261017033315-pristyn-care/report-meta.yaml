companyProfile:
  summary: >-
    Pristyn Care is a Gurugram-based elective and secondary-care surgery platform founded in 2018. The company combines
    digital acquisition, care coordination, insurer support, partner- hospital delivery, and a growing owned-hospital
    footprint, which gives it real operating scale but also makes public performance harder to reconcile. The current
    underwriting debate remains centered on whether that scale turns into durable economics once FY25-FY26 audits,
    cap-table terms, and hospital-level unit economics are disclosed.
