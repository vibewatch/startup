callouts:
  - calloutType: risk
    title: Kill criteria before underwriting
    body: >
      Underwriting should pause unless diligence resolves the current legal status of the Mumbai
      negligence complaint, produces audited FY25-FY26 cash-loss and runway evidence for the owned-
      hospital strategy, and reconciles the conflicting public revenue/headcount disclosures into a
      single management-certified operating baseline.
    claimRefs: [CR003, CR007, CR010, CR012]
