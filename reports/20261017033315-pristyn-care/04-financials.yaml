  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: fy24-financials
      missingEvidence: Reconciled FY24-FY26 P&L, balance sheet, and cash-flow statements that map entity-level and consolidated numbers to one basis.
      whyItMatters: Public sources disagree on revenue, expenses, loss, and cumulative funding, so margin path and cash needs cannot be underwritten confidently.
      diligencePath: Obtain audited statutory filings, management accounts, and a one-page reconciliation of Inc42, PTI/NewsVoir, and ValueForStartups figures.
      relatedQuestionRefs: [QI004, QI005, QI008]
    - type: missing-source
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash on hand, debt or working-capital facilities, runway, and next-round trigger metrics.
      whyItMatters: A bridge-like 2025 financing event cannot be judged without knowing liquidity, debt covenants, and burn against available cash.
      diligencePath: Request latest board deck, treasury snapshot, debt schedule, and monthly cash-burn bridge.
      relatedQuestionRefs: [QI006, QI008]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Surgical revenue split versus BeatXP/D2C, including gross margin by segment and inventory working-capital impact.
      whyItMatters: Consolidated top-line growth may overstate the health of the core surgery business if lower-quality D2C revenue is mixed in.
      diligencePath: Get segment reporting for revenue, gross margin, contribution margin, inventory turns, and procurement cash cycle.
      relatedQuestionRefs: [QI001, QI004, QI005, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: material
      topic: site-level-unit-economics
      missingEvidence: Owned-clinic and partner-hospital utilization, ARPOB/ASP, surgeon payout model, contribution margin, and site-level capex.
      whyItMatters: The asset-light thesis lowers fixed infrastructure intensity only if surgeon utilization and partner economics stay healthy as the footprint expands.
      diligencePath: Request city cohorts, site P&Ls, occupancy/utilization data, and procedure-level margin bridges by specialty.
      relatedQuestionRefs: [QI003, QI004, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Paid vs organic acquisition mix, CAC, payback period, repeat demand, insurer denial rates, and receivables days.
      whyItMatters: Funnel counts alone do not establish whether low apparent conversion can still support attractive unit economics and working-capital discipline.
      diligencePath: Review channel dashboards, cohort economics, insurer settlement aging, and denied-claim write-off history.
      relatedQuestionRefs: [QI002, QI003, QI008]
      relatedTableRefs: [TI002, TI003]
