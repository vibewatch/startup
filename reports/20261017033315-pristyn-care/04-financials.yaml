artifact: financials
slug: pristyn-care
runDate: 2026-10-17
company:
  name: Pristyn Care
chapter:
  number: 4
  title: Financials
  summary: >-
    Pristyn Care's public financial picture supports an asset-light surgery-coordination model
    with real operating scale, but the revenue basis, loss profile, and even cumulative funding
    totals diverge sharply across sources. The underwriteable takeaway is not that the business is
    proven profitable; it is that capital discipline and segment mix must be tested with audited
    FY25-FY26 statements, surgical-vs-D2C splits, and site-level economics before trusting margin
    or runway claims.
sections:
  - id: revenue-architecture
    title: Revenue architecture is clear, but realized monetization is still opaque
    body: >-
      Public evidence is directionally consistent on how Pristyn Care makes money even when exact
      revenue totals are not. The company routes elective procedures through partner hospitals
      rather than a fully owned hospital base, while supplying its own surgeons, equipment, and
      patient-coordination layer. That creates a revenue model built around procedure conversion
      and bundled service convenience rather than pure facility ownership. The Care Buddy model,
      free first consultation, insurance handling, transport, and no-cost EMI appear designed to
      improve conversion and ticket affordability, but public sources do not disclose how much of
      realized revenue comes from surgery fees, owned-clinic visits, financing support, or newer
      adjacent businesses. That is especially important because later third-party analysis suggests
      the consolidated top line includes non-core D2C activity, which can overstate the apparent
      strength of the core surgery engine if segment economics are not separated cleanly.
    claimRefs: [CI001, CI002, CI003, CI004, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-costs-unit-economics
    title: Public traction is meaningful, but cost and margin disclosure does not reconcile
    body: >-
      The available data confirms that Pristyn Care has built a large commercial funnel, but it
      does not confirm durable profitability. Mint quoted the company at more than 12,000 daily
      patient reach-outs, roughly 1,300 clinic consultations, and about 200 surgeries per day,
      which implies a substantial acquisition engine and meaningful operating throughput. Yet FY24
      financial disclosure is inconsistent across datasets: Inc42 reports ₹388.4 crore of revenue
      with a ₹200.1 crore loss, PTI/NewsVoir cites ₹494 crore of audited total income for the last
      fiscal year, and ValueForStartups presents ₹601 crore of operating revenue, ₹632 crore of
      total revenue, and a ₹381 crore net loss. ValueForStartups also argues the BeatXP D2C
      business padded the top line, which makes consolidated growth a poor proxy for surgical
      margin quality. Management's claim that marketing costs fell more than 50% is encouraging,
      but it still stops short of a verified CAC, payback, gross-margin, or contribution-margin
      bridge by specialty and city.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-needs-and-verdict
    title: Capital dependence is still live because the latest financing looks bridge-like, not final
    body: >-
      Capital-adequacy risk remains central to the financial verdict. Multiple sources still anchor
      the 2021 unicorn valuation around $1.4 billion, but the latest disclosed 2025 financing is
      presented as either a $5.48 million round at a $1.17 billion post-money valuation or a $4
      million internal bridge at a flat $1.4 billion valuation. Either framing points to support
      capital rather than an obviously new growth-pricing step-up. Public tallies of lifetime
      funding also conflict, which makes it hard to judge available balance-sheet cushion from
      external reporting alone. That matters more because Mint reported delayed FY22 and FY23
      filings in 2023, while no current public source in this pool discloses cash on hand, debt,
      working-capital usage, insurer settlement timing, or owned-site contribution margins.
      Financially, the model may still work, but the present evidence supports a diligence verdict
      of research-more rather than underwriteable confidence.
    claimRefs: [CI005, CI006, CI007, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core elective surgery coordination
        - Procedure demand is acquired digitally, triaged through Pristyn, and fulfilled in partner hospitals.
        - per surgery
        - Active; Mint quoted about 200 surgeries/day in 2023.
        - Core revenue engine is evident, but realized take rate is undisclosed.
        - Audited surgery revenue split by specialty, city, and payor.
      - - Care-coordination bundle
        - Care Buddy handles scheduling, insurance paperwork, transport, admission, discharge, and follow-up.
        - per patient journey
        - Active and bundled into the offer; no standalone revenue disclosure.
        - Likely conversion enhancer rather than separately priced line item.
        - Contribution margin of the coordination layer by case.
      - - Owned-clinic consultation network
        - Local clinics create discovery, consult, and pre/post-op touchpoints that feed surgeries.
        - per visit or per site
        - Company claims 150+ owned clinics.
        - Network scale is visible, but site-level profitability is not.
        - Same-store revenue, occupancy, and clinic contribution margin.
      - - Insurance enablement
        - Cashless claim handling and documentation reduce patient friction at purchase.
        - per insured case
        - Active feature; pricing to Pristyn not disclosed.
        - Useful to conversion, but reimbursement timing and denial risk are unknown.
        - Insurer mix, denial rates, and receivables days.
      - - No-cost EMI / financing support
        - Financing options reduce upfront payment friction for elective procedures.
        - financed surgery ticket
        - Active feature; economics undisclosed.
        - Could expand demand, but subsidy and default burden are unclear.
        - Lending-partner terms, subsidy cost, and loss-sharing mechanics.
      - - D2C wellness / BeatXP
        - Third-party analysis says non-surgical D2C activity contributed meaningfully to FY24 top line.
        - hardware / wellness order
        - Present in third-party FY24 analysis; no audited segment split disclosed.
        - Material revenue-quality caveat because it muddies core surgery comparability.
        - Segment revenue, gross margin, inventory turns, and procurement working capital.
    notes: >-
      Mix combines official model description, Mint throughput, and third-party segment commentary;
      null economics reflect missing audited segment disclosure rather than zero contribution.
    claimRefs: [CI001, CI002, CI003, CI004, CI013, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - First consultation
        - Free first consultation
        - List price is explicit, but monetization depends on downstream conversion.
        - Realized CAC recovery per consult is undisclosed.
        - Official llm-info page
      - - Generic elective surgery ticket
        - Upwards of ₹30,000 and can run into several lakhs
        - Historical example range, not a disclosed average selling price.
        - Procedure mix and insurer coverage drive major variance.
        - Mint 2023 reporting
      - - Bariatric balloon example
        - Less than ₹4 lakh for the cited procedure
        - Single-patient case study, not representative list pricing.
        - Insurance eligibility and complication risk alter realized economics.
        - Mint 2023 reporting
      - - No-cost EMI
        - Financing available; pricing terms not disclosed publicly
        - Increases affordability, but not enough to infer realized net revenue.
        - Subsidy burden, defaults, and partner economics unknown.
        - Official llm-info page
      - - Cashless insurance support
        - Support included with surgical journey
        - Included service rather than separately quoted line item.
        - Working-capital impact and insurer deductions are undisclosed.
        - Official llm-info page
    notes: >-
      Public pricing evidence is mostly feature-level or anecdotal; there is no retained source in
      this pool with realized ASP, discounting, or reimbursement yield by procedure.
    claimRefs: [CI003, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Daily patient reach-outs
        - 12,000+
        - medium
        - Shows top-of-funnel scale but not channel quality or acquisition cost.
        - Paid vs organic mix and channel CAC.
      - - Daily clinic consultations
        - ~1,300
        - medium
        - Mid-funnel volume helps test clinician utilization and sales efficiency.
        - Consult-to-surgery conversion by specialty and city.
      - - Daily surgeries
        - ~200
        - medium
        - Throughput is the best public proxy for revenue capacity.
        - Monthly trend, cancellations, and repeat surgery share.
      - - Interaction-to-surgery conversion
        - 2% to 2.5% of patient interactions
        - medium
        - Low conversion can still work, but only with disciplined CAC and margin control.
        - CAC, payback, and blended gross contribution per converted case.
      - - Audited total income
        - Rs. 494 Crore in the last fiscal year vs Rs. 339 Crore in FY21-22
        - medium
        - One company-issued anchor point, but it is not a complete P&L or segment bridge.
        - Full audited FY24-FY26 statements with revenue-recognition policy.
      - - FY24 database revenue / loss snapshot
        - ₹388.4 Cr revenue and ₹200.1 Cr loss
        - medium
        - Suggests the statutory entity remained loss-making.
        - Filing copy and legal-entity mapping behind the database extract.
      - - FY24 third-party operating revenue
        - ₹601 Cr operating revenue
        - medium
        - Implies stronger scale than the database view, but basis must be reconciled.
        - Definition of operating revenue and consolidated scope.
      - - FY24 third-party total revenue / expenses
        - ₹632 Cr revenue and ₹1,014 Cr expenses
        - medium
        - Indicates heavy cost structure even if growth stayed positive.
        - Cost-of-service, surgeon payout, and fixed-vs-variable expense split.
      - - FY24 third-party net loss
        - ₹381 Cr net loss
        - medium
        - Suggests margin path is still far from fully proven despite scale.
        - Reconciled EBITDA, PAT, and cash-burn bridge.
      - - Marketing efficiency and profitability target
        - Marketing costs down >50%; management targeted FY25 profitability
        - low
        - Helpful directional signal, but still unaudited management guidance.
        - Cohort payback, repeat demand, and audited progress against target.
      - - Workforce reset
        - <7% of 1,700 employees affected in 2024; Tracxn listed 1,199 employees in May 2026
        - low
        - Labor mix is critical because care coordinators, clinics, and surgeons drive delivery cost.
        - Headcount and compensation split by role and geography.
    notes: >-
      This table intentionally keeps conflicting FY24 metrics side by side because the underwriting
      issue is non-reconciliation, not the absence of datapoints.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources portray a digitally acquired funnel that converts patient inquiries into
      consultations, surgery fulfillment, and follow-up support rather than a facility-rent model.
    data:
      nodes:
        - id: inquiry
          label: Patient inquiries
          value: 12000
          unit: daily
          note: Mint-quoted company figure for daily reach-outs.
        - id: consult
          label: Consultations
          value: 1300
          unit: daily
          note: Mint-quoted clinic consultations.
        - id: coordinator
          label: Care Buddy coordination
          note: Scheduling, insurance, transport, admission, discharge, and follow-up support.
        - id: financing
          label: Insurance / no-cost EMI
          note: Payment-friction reducer embedded in the journey.
        - id: surgery
          label: Surgeries
          value: 200
          unit: daily
          note: Mint-quoted company figure for surgeries at partner hospitals.
        - id: infrastructure
          label: Partner-hospital infrastructure
          note: Fulfillment runs through 800+ partner hospitals instead of owned hospital build-out.
        - id: followup
          label: Post-op follow-up
          note: Free follow-up support helps protect outcomes and experience.
      edges:
        - from: inquiry
          to: consult
        - from: consult
          to: coordinator
        - from: coordinator
          to: financing
        - from: financing
          to: surgery
        - from: infrastructure
          to: surgery
        - from: surgery
          to: followup
    approximationNotes: >-
      Counts are historical company statements reported by Mint; the figure is a process bridge,
      not a claim that the same-day funnel converts one cohort deterministically.
    claimRefs: [CI001, CI003, CI004, CI015]
callouts:
  - calloutType: strength
    title: Asset-light fulfillment is the clearest financial advantage
    body: >-
      The partner-hospital model appears to push fixed infrastructure cost off the balance sheet
      while letting Pristyn own demand generation, surgeon deployment, and the patient relationship.
    claimRefs: [CI001, CI002, CI003, CI004]
  - calloutType: risk
    title: Revenue quality is not yet underwriteable from public data
    body: >-
      FY24 revenue and loss figures vary materially by source, and third-party commentary suggests
      non-core D2C revenue may be inflating consolidated growth optics.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Treat profitability as a diligence question, not a demonstrated fact
    body: >-
      The latest financing looks bridge-like, public funding tallies conflict, and historical filing
      delays make it hard to rely on management's profitability path without audited follow-through.
    claimRefs: [CI006, CI007, CI014, CI016]
