- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Reliability / security event
    - Material outage, breach, or repeated severe incidents
    - Damages trust in the control-plane thesis
    - Pause, reprice, or step away until trust is re-earned
  - - AI-module attach disappointment
    - Management cannot show real production references or material attach economics
    - Reduces the upside case to core-feature-management economics
    - Value AI upside at zero
  - - Weak retention / margin quality
    - Private diligence shows mediocre NRR or lower-quality margins
    - Undercuts the premium-multiple case
    - Demand a materially lower entry
  - - Pricing / packaging friction
    - Win/loss evidence shows customers trading down to simpler tools
    - Weakens moat and pricing power assumptions
    - Reduce conviction or wait for simplification evidence
  notes: Kill triggers convert qualitative risk into monitorable investment rules.
