company:
  name: LaunchDarkly
chapter:
  number: 8
  title: Valuation
  summary: 'LaunchDarkly looks like a high-quality late-stage private infrastructure company, but the public-evidence answer is price-sensitive rather than uniformly bullish. More than $200M ARR, 5,500+ customers, Fortune penetration, and an expanding runtime-control product suite support a serious franchise. The challenge is valuation discipline: the last hard public mark remains the 2021 $3B Series D, and the public record still lacks the margin, retention, concentration, and attach-rate denominators needed to underwrite a clear premium to that mark. The resulting recommendation is constructive but conditional: track or invest only at a disciplined entry around or below the stale $3B anchor unless private diligence proves category-leading economics and AI-module monetization.'
sections:
- id: recommendation-and-core-thesis
  title: The company quality is real, but the recommendation is still conditional on entry price
  body: 'LaunchDarkly is easier to like as a company than as a blindly priced investment. Public evidence shows a scaled infrastructure software business with more than $200M ARR, a large customer base, strong enterprise proof, and a product that has expanded from feature flags into a broader runtime-control platform. Those facts justify continuing diligence and keep LaunchDarkly on the short list of serious late-stage devtools / infrastructure names.


    What public evidence does not justify is valuation complacency. The last hard public mark is still the $3B Series D from 2021, and the intervening disclosures are directionally strong but incomplete. Without margin, NRR, concentration, and cash-flow visibility, the cleanest conclusion is not “buy at any price”; it is “track or invest only with discipline.” That is especially true because LaunchDarkly’s newer AI-control story creates both upside optionality and new proof requirements. The discipline point is central. At this stage, investors are not underwriting whether the company is real; they are underwriting whether the next dollar of valuation still leaves enough return after accounting for incomplete economics visibility. Investors should not confuse strategic relevance with automatic valuation upside.'
