- id: valuation-band-and-scenario-discipline
  title: The stale $3B anchor is plausible, but public-only upside above it is not fully earned yet
  body: 'The public-only valuation exercise starts with a simple fact: at just over $200M ARR, the old $3B mark implies something around a mid-teens revenue multiple. That is no longer obviously absurd for a scaled, growing, enterprise infrastructure company, but neither is it obviously cheap. Public comps in adjacent categories span a wide range, from more workflow-centric developer software to premium observability and cloud-infrastructure names, and that spread is exactly why scenario discipline matters. LaunchDarkly can screen as attractively priced or fully valued depending on what denominator quality investors assume.


    The base case therefore should sit around the stale mark, not far above it. The bull case requires clear proof that higher-order modules—especially observability-linked workflows and AgentControl—drive meaningful account expansion and preserve growth. The bear case is not that the company is bad; it is that buyers may only value the mature core business while discounting the newer narrative until attach, retention, and margin evidence improves. Secondary comp context from adjacent premium software names such as Atlassian, MongoDB, Snowflake, Elastic, and Zscaler further reinforces how quickly apparent fair value can change once investors assume a different quality tier. That is useful as bracketing context, but it also warns against overfitting to the highest-quality public names when LaunchDarkly has not yet disclosed equally rich denominator data. Price still matters here.'
