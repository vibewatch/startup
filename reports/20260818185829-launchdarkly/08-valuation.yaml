    - Possible, but requires private proof
  - - Base
    - Core business remains strong, newer modules help but are not fully proven, and economics are good but not elite
    - Supports a value band roughly around $2.7B-$3.3B with modest upside near the stale mark
    - Public-comp volatility and denominator uncertainty persist
