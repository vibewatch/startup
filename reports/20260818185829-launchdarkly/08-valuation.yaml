  - - Bear
    - Growth slows, AI narrative monetizes slowly, and buyers benchmark the company more like mature tooling than premium control infrastructure
    - Supports a value band roughly around $1.7B-$2.4B
    - Multiple compression, weaker retention, or pricing pressure
    - Still credible if missing denominators prove weak
