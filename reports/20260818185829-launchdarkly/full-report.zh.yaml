      - number: '8.3'
        title: LaunchDarkly 是有纪律的入场机会，还是强观察标的，应由私下尽调决定
        blocks:
          - type: paragraph
            body: >-
              只看规模和战略相关性，LaunchDarkly 已经成熟到足以成为长期 IPO 候选，或有吸引力的战略资产。它有客户证明、赛道相关性、较宽的产品面，
              也有公开证据支持其增长具备持续性。但对投资人来说，退出准备度不等于公司成熟度。投资人需要知道，公司能否把规模转化为顶级质量收入， 新的 AI 时代模块究竟是在强化经济性，还是稀释经济性。


              所以最终判断必须跟证据走。如果私下尽调显示 NRR 同业最佳、利润率强、客户集中度低、AI 模块挂载可信，那么按过时锚点或略高价格买入可以成立。
              如果这些分母令人失望，或者可靠性、安全、定价摩擦比公开记录显示的更严重，正确动作就是等待、重估，或放弃。公司大概率已经值得更深尽调，
              但还没有资格让投资人暂停估值纪律。换句话说，正确姿态既不是怀疑式否定，也不是估值热情，而是结构化好奇：先假设业务可能配得上溢价，
              再要求证据，证据不到就不给。这正是有前景的后期公司与在某一价格可投资标的之间的区别。
