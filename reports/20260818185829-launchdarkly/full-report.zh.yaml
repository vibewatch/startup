  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司质地成立，但是否出手仍看入场价
        blocks:
          - type: paragraph
            body: >-
              如果只看公司，LaunchDarkly 很容易让人认可；如果不看价格直接投资，吸引力就没那么简单。公开证据指向一家已经起量的基础设施软件公司： 年经常性收入（ARR）超过
              $200M，客户基数大，企业级背书强，产品也从功能开关扩展到更宽的运行时控制平台。这些事实足以支撑继续尽调， 也让 LaunchDarkly 进入严肃后期开发者工具 / 基础设施标的的候选名单。


              公开证据不支持的是估值松懈。最后一个硬性的公开价格锚仍是 2021 年 Series D 轮的 $3B；之后披露的信号方向不错，但并不完整。
              毛利率、净留存率（NRR）、客户集中度和现金流看不清时，最干净的结论不是“任何价格都买”，而是“观察，或只在纪律约束下投资”。 LaunchDarkly 新的 AI
              控制叙事同时带来上行选择权和新的举证要求，这一点尤其重要。纪律是核心。到这个阶段，投资人承销的不是公司是否真实， 而是在经济性仍不透明的情况下，下一美元估值还能否留下足够回报。不能把战略相关性误读成估值必然上行。
