    summary: LaunchDarkly 的关键风险会沿着客户信任和产品复杂度，传导到收入和估值。
    data:
      nodes:
        - id: a
          label: 停机 / 安全 / 隐私事件
          description: 重大信任事件冲击控制平面。
        - id: b
          label: 客户信任流失
          description: 买家放慢部署、续约或扩张。
        - id: c
          label: 总留存 / 净留存压力
          description: 续约质量走弱。
        - id: d
          label: 增长和利润率压力
          description: 销售摩擦和支持成本上升。
        - id: e
          label: 估值压缩
          description: 增长质量下降，价格支撑变弱。
        - id: f
          label: AI 模块附加销售不及预期
          description: 新产品未能提供足够价值。
        - id: g
          label: 打包 / ROI 质疑
          description: 买家偏向更简单或更便宜的工具。
      edges:
        - from: a
          to: b
          label: 信任是第一条传导渠道
        - from: b
          to: c
          label: 续约和扩张效应
        - from: c
          to: d
          label: 增长质量走弱
        - from: d
          to: e
          label: 估值支撑下降
        - from: f
          to: d
          label: 收入杠杆不及预期
        - from: g
          to: d
          label: 折扣或降配压力
        - from: f
          to: g
          label: 只有广度、缺少证明会加重质疑
    approximationNotes: null
    claimRefs:
      - CR016
      - CR023
      - CR024
      - CR026
      - CR027
      - CR036
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 关键依赖包括云可用性、信任运营、生态标准和公共部门合规路径。
    data:
      nodes:
        - id: p1
          label: 基础设施层
          description: 底层云 / 托管可靠性。
        - id: p2
          label: 信任运营
          description: 安全、隐私、DPA、子处理方和事件流程。
        - id: p3
          label: 客户工作流
          description: 嵌入生产运营的发布和运行时控制。
        - id: p4
          label: OpenFeature / SDK 生态
          description: 遵循标准的可移植性与集成层。
        - id: p5
          label: 受监管采购路径
          description: 公共部门或高合规要求扩张机会。
        - id: p6
          label: 收入质量
          description: 留存、扩张和交叉销售韧性。
      edges:
        - from: p1
          to: p3
          label: 可用性依赖
        - from: p2
          to: p3
          label: 信任依赖
        - from: p4
          to: p3
          label: 开发者采用依赖
        - from: p5
          to: p6
          label: 扩张依赖
        - from: p3
          to: p6
          label: 运营价值驱动续约
    approximationNotes: null
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR030
      - CR032
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 最终建议取决于公司质量、风险和价格支撑能否在有纪律的入场点对齐。
    data:
      nodes:
        - id: m
          label: 市场 / 产品质量
          detail: 运行时控制相关性、货币化广度和 AI 选择权。
        - id: c
          label: 客户证明
          detail: 5,500+ 客户和企业渗透带来可信度。
        - id: r
          label: 风险约束
          detail: 可靠性、安全、执行和定价摩擦限制了可接受的溢价。
        - id: p
          label: 价格纪律
          detail: 过时的 $3B 标记需要用当前收入质量重新检验。
        - id: call
          label: 观察或有条件投资
          detail: 只有尽调和价格支撑同时成立，才继续推进。
      edges:
        - from: m
          to: p
          label: 可支撑溢价潜力
        - from: c
          to: p
          label: 值得继续关注
        - from: r
          to: p
          label: 限制审慎出价上限
        - from: p
          to: call
          label: 决定最终立场
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV015
      - CV032
      - CV035
      - CV036
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: LaunchDarkly 估值最敏感的是收入质量和证据，而不是泛泛的市场兴趣。
    data:
      items:
        - label: 净留存 / 模块附加销售可见度
          value: 10
        - label: 毛利率与云 / 支持成本质量
          value: 9
        - label: AI 模块商业化证据
          value: 9
        - label: 客户集中度和打包韧性
          value: 8
        - label: 可靠性 / 安全记录
          value: 8
        - label: 上市可比公司倍数选择
          value: 7
        - label: 单看 ARR 表观增长
          value: 6
    approximationNotes: 评分基于保留的公开证据，是 0-10 的序数投资测算敏感度。
    claimRefs:
      - CV010
      - CV011
      - CV019
      - CV032
      - CV033
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 最站得住脚的公开证据区间集中在过时估值标记附近；如果分母质量不及预期，下行空间不小。
    data:
      items:
        - label: 悲观价值区间
          low: 1.7
          mid: 2
          high: 2.4
          unit: USD B
          detail: 增长放缓、AI 附加销售不及预期，投资人按更接近低端上市可比区间来测算 LaunchDarkly。
        - label: 基准价值区间
          low: 2.7
          mid: 3
          high: 3.3
          unit: USD B
          detail: 核心业务保持强劲，但投资人仍会折价处理利润率、留存和高价附加销售上的未知数。
        - label: 乐观价值区间
          low: 3.8
          mid: 4.3
          high: 5
          unit: USD B
          detail: 增长继续强劲，私下尽调证明高端经济性成立，AI 模块也有实质扩张。
        - label: 偏好的新入场区间
          low: 2.4
          mid: 2.7
          high: 3
          unit: USD B
          detail: 如果最佳情景分母得到验证，低于或接近过时估值标记的价格能留下更多诱人回报空间。
    approximationNotes: 这些区间是情景投资测算带，来自公开 ARR、过时上一轮估值标记和相邻可比公司的离散度，并非完整 DCF 或条款清单模型。
    claimRefs:
      - CV007
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公司质量得分不错，但估值吸引力和证据质量明显更低。
    data:
      items:
        - label: 市场需求
          value: 8
        - label: 客户证明质量
          value: 8
        - label: 产品 / 工作流护城河
          value: 8
        - label: 经济性可见度
          value: 4
        - label: 风险调整后耐久性
          value: 6
        - label: 当前估值吸引力
          value: 5
        - label: 为本轮定价提供依据的证据质量
          value: 5
    approximationNotes: 评分是截至 2026-08-18 基于保留公开证据作出的 0-10 编辑判断，不是管理层披露的 KPI。
    claimRefs:
      - CV001
      - CV002
      - CV015
      - CV036
      - CV037
      - CV038
      - CV039
