      - number: '4.3'
        title: 融资额和上次公开标尺可见，分母质量不可见
        blocks:
          - type: paragraph
            body: >-
              公开来源基本收敛到约 $330 million 的资本基础，以及 2021 年 8 月 Series D 给出的 $3 billion
              上次定价估值。外部观察者因此有了一个坚实价格锚，但它已经很旧。业务显然已在此后增长， 这意味着同一个过时标尺，在不同分母和公开可比倍数下，既可能显得保守，也可能仍然苛刻。抓取到的 Yahoo
              报价页面说明，当今软件基础设施的区间有多宽：GitLab 和 Dynatrace 的 EV/Revenue 筛在 中个位数，Datadog 在低 20 倍，Cloudflare 则高得多。


              实际结论是，LaunchDarkly 的纯公开财务图景方向上很强，但仍缺关键规格。公司看起来有规模、 有资本、商业上可信。不过，外部人仍缺少利润率、队列、集中度和现金流这些分母，无法判断多少规模
              应转化成溢价倍数，或增长放缓时有多少下行支撑。财务尽调因此不应重点证明需求存在，而应证明收入质量、 盈利轨迹和扩张韧性。评论式和面向市场的证据也提醒投资人，LaunchDarkly 仍处在一个定价透明度很重要的
              竞争环境里。即便业务强，如果采购摩擦、模块复杂度或感知价值落后于更便宜、更容易做基准比较的替代方案， 也可能跑输财务模型。
