      - number: '1.2'
        title: 创始人、领导层梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事仍是公开记录的核心。LaunchDarkly 由 Edith Harbaugh 和 John Kodumal 于 2014 年
              创立，公开履历仍把两人的名字与公司的经营身份紧紧绑在一起。这种延续性支撑了创始人与市场契合的 叙事：业务起点来自创始人亲历的发布风险痛点，当前信息也仍借力这一源头。不过，到 2026 年，
              公开组织故事已不再只是创始人叙事。LaunchDarkly 在 2026 年 1 月任命 Cameron Etezadi 为 CTO、Robert O’Donovan 为 CFO，请回 Jonathan
              Nolen 担任产品 SVP，又在 2026 年 8 月任命 Andy Pemberton 为 CRO。这一连串动作显示，公司有意扩充工程、财务、产品和全球商业化的高管能力。


              即便如此，治理透明度仍比领导层品牌更薄。公开来源能说明高管任命和投资人脉络，却没有清楚披露 当前董事会名单、委员会结构、股权集中度或清算优先权结构。对一家 ARR 已超过 $200M、且仍背负 过时但重要的
              $3B 估值标尺的公司来说，这层治理信息缺口是真正的尽调缺口，不是表面瑕疵。 这不必然指向不利的控制权行为；它只是说明，公开证据在产品、融资和客户触达上明显强于私有公司 治理机制。
