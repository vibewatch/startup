      - number: '1.3'
        title: 融资历程、估值延续与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly 的融资史在公共记忆里略显混乱，但从当前跟踪记录看，方向很清楚。公司完成过 $8.7 million Series A、约 $21 million Series B、2019 年 3 月由
              Bessemer 领投的 $44 million Series C；Tracxn 还记录了一笔 2020 年 1 月单独的 $54 million Series C； 之后是 2021 年 8 月 $200
              million Series D。最后一轮是关键估值锚：Lead Edge 和公司均称 该轮融资定价为 $3 billion，公开跟踪方到 2026 年仍沿用这一标尺。因为没有更新一轮公开融资， 2021
              年估值仍是最后一个硬价格，尽管此后经营规模已明显提升。


              此后的里程碑路径显示的是产品扩张，而不是财务压力。LaunchDarkly 在 2024 年加入 Release Guardian，2025 年 4 月收购 highlight.io 以加深发布可观测性，2026
              年 1 月扩充 高管梯队，2026 年 5 月推出 AgentControl，随后在 2026 年 8 月披露 ARR 超过 $200M。
              这一顺序支撑了公司从纯功能管理，走向更宽的运行时控制和发布安全平台，尤其面向 AI 驱动的软件交付。 关键限定是公开数据质量不对称：规模、客户触达和里程碑节奏可见，但利润率、留存、董事会结构和
              当前股权结构表细节仍属私有。
