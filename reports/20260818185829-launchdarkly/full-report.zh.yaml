      - number: '8.2'
        title: 过时的 $3B 锚点仍说得通，但仅凭公开材料还撑不起更高上行
        blocks:
          - type: paragraph
            body: >-
              只用公开资料做估值，起点很简单：ARR 刚过 $200M，旧 $3B 估值大约对应十几倍收入倍数。对一家有规模、仍在增长的企业基础设施公司来说，
              这已经不再明显荒唐，但也谈不上明显便宜。相邻赛道的公开可比公司跨度很大，从更偏工作流的开发者软件，到高溢价的可观测性和云基础设施公司都有。
              正因为区间拉得这么开，情景纪律才重要。投资人假设的分母质量不同，LaunchDarkly 看起来可以是价格有吸引力，也可以是估值已经充分。


              因此，基准情景应落在过时锚点附近，而不是明显高于它。乐观情景需要清楚证明：更高阶模块，尤其是与可观测性相连的工作流和 AgentControl，
              能带来实质性账户扩张，并守住增长。悲观情景不是公司不好，而是买家可能只给成熟核心业务估值，在挂载率、留存和利润率证据改善前，对新叙事打折。
              Atlassian、MongoDB、Snowflake、Elastic、Zscaler 等相邻高溢价软件公司的可比参照也提醒我们，一旦投资人切换质量层级假设，表面公允价值会迅速变化。 这能用来框定区间，但
              LaunchDarkly 尚未披露同样扎实的分母数据，不能过度套用最高质量的上市公司。这里价格仍然重要。
