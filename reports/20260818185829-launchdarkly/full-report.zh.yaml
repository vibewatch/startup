  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 公开客户记录显示规模和真实企业渗透
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly 的客户证据首先是规模。官方和近官方来源称，公司服务超过 5,500 家客户，并在 2026 年初触达 37 家 Fortune 100 和 7 家 Fortune
              10。这些数字重要，因为它们把讨论从 「受欢迎的开发者工具」推进到更接近横向企业控制层的位置。再加上 2018 年第 500 家客户里程碑， 它们也说明采用是长期复合出来的，而不是只来自当前 AI 浪潮。


              同样重要的是，可见客户标识集合很多元。公开引用覆盖金融服务、医疗健康、汽车、公共部门、电商、 媒体、法律科技和开发者工具。这种多元性支撑了一个判断：LaunchDarkly 不依赖单一垂直叙事；
              只要软件团队需要在生产环境里可控变更，它就能受益。广度也有战略意义，因为它降低了公司只押中一个 周期性预算口袋的风险。如果医疗保险公司、银行、媒体应用、公共部门项目和软件平台都出于相关但不同的
              原因使用产品，那么客户需求就绑定在一个耐久运营问题上：如何安全、可衡量地改变生产系统。相比许多 私有基础设施同行公开披露的材料，这是更好的横向验证组合。
