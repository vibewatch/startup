chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与规模锚点
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly 已经从单一用途的功能开关工具，跨到更宽的运行时控制平台。官方首页和关于页面如今 把公司描述为生产环境中软件发布和 AI 智能体的控制层，同时保留最初让工程团队重视这门业务的
              功能管理血统。这个身份转向很重要：它把公司从小众开发者工具，重新框定为介于发布、观察、实验和 修复之间的基础设施。2026 年材料也持续把功能开关、实验、可观测性、AI 配置和智能体治理
              绑进同一个控制平面叙事，而不是把它们拆成彼此无关的附加模块。


              规模信号现在也撑得住这个更宽的定位。官方来源称 LaunchDarkly 服务超过 5,500 家组织，覆盖大约 四分之一 Fortune 500；2026 年 1 月的高管更新又给出更清晰的企业视角：37 家
              Fortune 100、 7 家 Fortune 10。2026 年 8 月 ARR 新闻稿称公司年经常性收入已突破 $200 million，且仍以 超过 25%
              的同比速度增长。公开第三方跟踪也大体符合这种成熟度：Forbes 和 Tracxn 都把公司估值 维持在 $3 billion，累计融资约 $330 million。合在一起，这些事实把 LaunchDarkly
              稳稳放在 后期私有基础设施软件公司的区间，而不是实验性创业公司状态。
