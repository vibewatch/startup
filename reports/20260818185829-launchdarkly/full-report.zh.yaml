  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 先定义市场边界和规模，才能谈估值
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly 明确服务的最窄市场是功能管理：可控发布、定向、审批、发布治理和相关开关运营。 多个第三方市场页面仍把它视为一个独立软件品类，并把 2026 年市场规模大致聚在 $369 million
              左右。这个数字有价值，因为它给出了 LaunchDarkly 最初开创的历史楔子的真实外边界。但单靠它 不足以描述公司当前机会。LaunchDarkly 自己的平台页面如今把产品呈现为软件和 AI 智能体的
              运行时控制，在功能开关之上叠加实验、可观测性、受保护发布和 AI 治理界面。


              实际含义是，投资人不应把单一的「功能开关 TAM」当成完整故事。公开证据指向一个分层市场： 一个规模适中、边界清晰的功能管理核心，嵌在更宽的软件交付、实验和 AI 运行时控制预算里。
              竞争对手页面也支持这种更宽的看法，因为许多替代方案也不再只是简单开关工具。正确的尽调立场因此 是同时保留两个判断：传统楔子小到迫使 LaunchDarkly 必须外扩，而外扩后的市场又真实到足以让公司
              竞争更大的企业发布控制预算。
