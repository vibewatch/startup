      - number: '2.3'
        title: 增长驱动清晰，但公开 SAM 测算仍不完整
        blocks:
          - type: paragraph
            body: >-
              当前来源里有三条需求驱动最突出。第一，发布本身变得更高风险，因为软件变更越来越依赖实时指标、 渐进式发布和快速回滚，而不是一次性部署事件。第二，实验仍是核心产品开发工作流，买方希望它接在
              交付上，而不是与交付割裂。第三，AI 带来新的运行时治理问题，因为提示词、模型、工具和政策都可能在 代码上线后继续变化。LaunchDarkly 当前定位最强的地方，正是这三条驱动的交汇处。


              主要约束也同样可见。开源和自助式替代方案限制了市场能容忍多少定价不透明；OpenFeature 降低了 代码层锁定；公开证据仍没有给出干净的 LaunchDarkly 专属 SAM 或
              SOM，因为模块附着率、分客群 ACV 和较新运行时控制变现仍属私有。因此，可发表的市场观点应当方向上有信心、数字上有纪律： 这里有真实增长逻辑，但公开证据更支持分层市场论，而不是单一精确 TAM
              断言。公开证据还显示， 市场教育仍是销售动作的一部分。LaunchDarkly 发布买方指南，把团队从 DIY 开关推向托管治理； OpenFeature
              和自助式竞争者则提醒买方，可移植性和低摩擦采用仍是活的替代路径。这种品类创造与 竞争标准化并存的状态，正是一个扩张中但尚未定型市场的典型样子。
