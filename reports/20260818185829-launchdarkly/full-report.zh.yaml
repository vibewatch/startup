        title: 竞争版图已经超出功能开关品类图
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly 已经不只和简单功能开关厂商竞争。当前市场包括治理优先的功能管理平台、实验优先套件、 自助式工程工具，以及把功能管理接到 CI/CD 或产品分析上的更宽交付平台。竞争对手页面直接显示了
              这个被拉宽的可比范围：Statsig 推完整产品开发平台，GrowthBook 组合实验与开关，Harness 把 功能管理嵌入交付套件，Optimizely 和 VWO 从实验切入，PostHog
              把开关与实验、分析打包， CloudBees 销售面向存量企业环境的控制能力。结果是，LaunchDarkly 必须同时守住品类楔子和 更宽的工作流楔子。


              这一点有战略意义，因为买方身份决定最关键的对手。平台和发布团队会拿 LaunchDarkly 对比 Harness、CloudBees 和治理较重的套件；产品或增长团队可能对比 Optimizely、VWO 和
              Statsig； 对可移植性敏感的工程团队可能对比 GrowthBook、DevCycle 或 PostHog。因此，可信的竞争分析
              必须按买方任务来划分市场，而不是沿用旧厂商标签。公开评论界面也强化了这一点：买方确实会把 LaunchDarkly 同更新的自助式工具和更老的企业发布平台一起评估。这进一步说明，品类正在收敛， 不是固定不变。
