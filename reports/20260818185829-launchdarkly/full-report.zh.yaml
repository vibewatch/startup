      - number: '4.2'
        title: 即便没有完整利润率披露，公开规模标尺也指向真实后期业务
        blocks:
          - type: paragraph
            body: >-
              按私有公司标准，LaunchDarkly 2026 年公开披露异常有用。公司先在 2026 年 1 月称 ARR 接近 $200 million，增长重新加速到同比 20% 以上，且每名 FTE ARR 远超
              $300K。到 2026 年 8 月， 公司称 ARR 已超过 $200 million，且同比增长超过 25%。Tracxn 2026 年 6 月给出的 648 名员工标尺让效率信号更具体：即便只用已披露
              ARR 下限，业务看起来也大约达到或超过每名员工 $309K ARR。


              更早的里程碑强化了这不是突然跳升。LaunchDarkly 2018 年报告收入增长 3 倍；2019 年 Series C 公告称客户超过 700 家、流失率低于 1%；2021 年 Series D
              时称客户超过 2,000 家、 员工超过 300 人。因此，公开证据支持的是一家在加入 AI 时代运行时控制界面之前，就已多年复合增长的公司。
              公开证据不能支持的，是完整盈利能力判断：毛利率、烧钱速度和现金生成仍属私有。
