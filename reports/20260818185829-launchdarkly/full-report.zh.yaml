      - - 只有在以下条件下转为投资
        - 私人尽调证明经济性同类最佳
        - 若可靠性、留存和利润率强，风险可下调一档
        - 可支撑相对旧估值的小幅溢价
        - 若 NRR、利润率和 AI 附加强，推进
      - - 转为放弃
        - 如果缺少溢价经济性，或新模块未能货币化
        - 若出现宕机、安全或打包问题，风险上调
        - 向上市可比公司低端区间重估
        - 退出或等待重新定价
    notes: 建议有意保持价格敏感，因为公开证据不支持虚假的精确度。
    claimRefs:
      - CV001
      - CV002
      - CV029
      - CV036
      - CV037
      - CV041
      - CV042
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 规模化运行时控制平台，企业级证据强，变现面更宽
        - 若证据显示客户只买核心功能开关，或更宽模块无法附加
      - - '> $200M ARR 和持久客户证据，足以支撑晚期投资关注'
        - 留存弱、利润率弱或客户集中度高，都会实质削弱投资理由
      - - AI 智能体控制若在存量客户中采用，会带来真实战略上行
        - 缺少客户背书或经济性，会把 AI 上行降为纯叙事
      - - 过时的 2021 年 $3B 估值，可能没有完全反映此后规模增长
        - 如果收入质量较低，即便旧估值也会显得吃力
    notes: 反向逻辑主要指向证据质量和价格支撑，而不是产品相关性不足。
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV015
      - CV018
      - CV019
      - CV038
      - CV039
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 增长保持 >25%，企业级证据仍强，AI 模块抬升账户价值，经济性证明可拿溢价
        - 大致支持 $3B 高段到 $4B+ 低段的估值区间；若以有纪律的价格进入，上行有吸引力
        - AI 附加被高估；支持负担上升
        - 有可能，但需要私人证据
      - - 基准
        - 核心业务保持强劲，新模块有帮助但尚未完全证明，经济性不错但不是顶尖
        - 大致支持 $2.7B-$3.3B 估值区间，在旧估值附近有温和上行
        - 上市可比公司波动和分母不确定性仍在
        - 最符合当前公开证据
      - - 悲观
        - 增长放缓，AI 叙事变现慢，买家更像看成熟工具那样对标公司，而不是按高溢价控制基础设施定价
        - 大致支持 $1.7B-$2.4B 估值区间
        - 倍数压缩、留存转弱或定价压力
        - 如果缺失分母被证明偏弱，这一情景仍可信
    notes: 情景区间来自基于公开证据的承销判断，而不是谈判后的投资条款清单模型。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV041
      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标 / 来源框架
      - 倍数 / 估值状态
      - 相关性
      - 局限性
    rows:
      - - GitLab
        - Yahoo 报价 + SEC 年度报告
        - 开发者工作流上市可比公司
        - 企业开发工具销售动作和开发者工作流相关性
        - 与 LaunchDarkly 目前主张的可观测性和运行时控制重叠更少
      - - Datadog
        - Yahoo 报价 + SEC 年度报告
        - 高溢价可观测性 / 云软件可比公司
        - 对运营控制软件的上沿参考有帮助
        - 公开市场溢价可能超过私人证据所能支撑的水平
      - - Cloudflare
        - Yahoo 报价 + SEC 年度报告
        - 高溢价基础设施软件可比公司
        - 有助于刻画战略稀缺性和基础设施质量
        - 作为直接承销类比可能溢价过高
      - - Dynatrace
        - Yahoo 报价 + SEC 年度报告
        - 规模化可观测性 / 企业软件可比公司
        - 可作为成熟企业运营软件的中段参考
        - 不是直接的功能管理类比
    notes: 本表覆盖本章保留使用的全部上市可比公司集合，目的在于框出合理倍数区间，而不是找一个完美可比对象。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Reviewed the retained LaunchDarkly public-comp set already fetched for adjacent developer-workflow,
        observability, and infrastructure-software references: GitLab, Datadog, Cloudflare, and Dynatrace.
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 投资逻辑破裂和止损触发器表
    columns:
      - 触发器
      - 阈值
      - 向投资逻辑的传导
      - 行动含义
    rows:
      - - 可靠性 / 安全事件
        - 重大宕机、泄露或反复严重事件
        - 破坏对控制平面投资逻辑的信任
        - 暂停、重新定价，或退出，直到信任重新建立
      - - AI 模块附加不及预期
        - 管理层拿不出真实生产客户背书或实质附加经济性
        - 将上行情景压缩为核心功能管理经济性
        - 将 AI 上行估为零
      - - 留存 / 利润率质量弱
        - 私人尽调显示 NRR 平庸或利润率质量较低
        - 削弱高溢价倍数逻辑
        - 要求大幅更低的进入价格
      - - 定价 / 打包摩擦
        - 赢单 / 输单证据显示客户降级到更简单工具
        - 削弱护城河和定价权假设
        - 降低信心，或等待简化证据
    notes: 止损触发器把定性风险转成可监控的投资规则。
    claimRefs:
      - CV021
      - CV027
      - CV032
      - CV034
      - CV039
      - CV040
      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入质量
        - 当前 NRR、GRR，以及按队列和模块拆分的扩张
        - 用来判断 LaunchDarkly 是否值得高溢价倍数
        - 要求提供董事会或财务材料包
      - - 盈利质量
        - 毛利率、自由现金流，以及云 / 支持成本结构
        - 用来把 ARR 规模转化为真实股权价值
        - 要求提供经审计财务包
      - - AI 附加和经济性
        - AgentControl / AI Configs 的管线转化、模块附加、支持负担和客户背书
        - 用来判断 AI 上行是真实存在，还是只是主题叙事
        - 要求提供产品和 GTM 尽调读数
      - - 客户集中度和打包
        - 大客户集中度、赢单 / 输单数据和价格敏感性
        - 用来评估更宽平台若显得过度复杂时的下行
        - 要求提供销售运营分析和客户背书
    notes: 这些变量最可能推动 LaunchDarkly 从观察转为投资，或从观察转为放弃。
    claimRefs:
