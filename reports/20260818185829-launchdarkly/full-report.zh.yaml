  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 按用量计费的变现已经覆盖开关、实验、可观测性和 AI 运行次数
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly 的公开定价页说清了两件事。第一，商业模式按用量计费，不是传统按席位收费的 SaaS。 公司明确称团队可以邀请无限用户，定价由服务连接、客户端 MAU、可观测性用量和 AI
              运行次数等用量指标驱动。 第二，变现已经大幅超出核心功能开关。当前界面计量实验 MAU、可观测性数据、会话回放和错误限制、AI 运行次数， 同时把最高价值的治理功能——高级定向、自定义角色、审批、工作流和
              Release Guardian 这类安全层——留给企业定价。


              这个结构很重要，因为它显示 LaunchDarkly 试图让价格跟运行时活动对齐，而不是跟简单用户数对齐。 它也解释了为什么客户加深生产使用后，业务可能高效扩张：更多发布、更多客户端触达、更多遥测数据和 更多
              AI 运行次数，都会自然形成变现界面。取舍在于，不透明的企业包装仍让外部人很难在没有直接客户数据时， 只按 TCO 把 LaunchDarkly
              与自助式对手做基准比较。这个模式还意味着，理论上收入应随生产重要性上升， 而不只是随席位扩张，这也是业务可以进入超大型企业账户、却不必变成传统按用户合同的原因之一。
