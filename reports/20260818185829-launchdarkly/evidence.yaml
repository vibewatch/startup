evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, committee structure, founder ownership, and liquidation-preference details.
    whyItMatters: These items determine control, refresh-risk, and downside economics for any new investor or strategic buyer.
    diligencePath: Request current board materials, cap table, charter documents, and the most recent financing documents.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: profitability-gap
    missingEvidence: Current gross margin, NRR, burn, free cash flow, and CAC/payback metrics.
    whyItMatters: >-
      ARR scale alone does not show whether LaunchDarkly is compounding efficiently or merely growing into a stale
      valuation mark.
    diligencePath: Request management financial package or audited statements with cohort and margin detail.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: funding-history
    missingEvidence: >-
      A reconciled explanation for the 2019 $44M Series C announcement and the separate $54M Jan. 2020 Series C tracker
      entry.
    whyItMatters: The discrepancy changes lifetime-funding math and can confuse later valuation analysis if left unexplained.
    diligencePath: Confirm financing chronology with management, cap table, and investor update materials.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: LaunchDarkly segment-level ACV, customer mix, module attach rates, and win/loss data.
    whyItMatters: >-
      Without those denominators, the report can describe the market qualitatively but cannot underwrite true share or
      expansion efficiency.
    diligencePath: Request segmented pipeline, ACV by motion, module attach, and customer cohort data.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      Methodology details behind third-party feature-management market pages and whether they count
      experimentation/observability revenue consistently.
    whyItMatters: The reported figures are directionally helpful but may not be comparable enough for hard model inputs.
    diligencePath: Request full analyst reports or management's preferred market-sizing framework.
    relatedQuestionRefs:
      - QM005
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
