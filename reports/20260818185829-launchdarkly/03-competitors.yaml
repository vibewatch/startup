  evidenceGaps:
  - type: missing-source
    severity: material
    topic: competitive-economics
    missingEvidence: Comparable win rates, renewal quality, and package-level TCO versus Statsig, GrowthBook, Harness, Optimizely, and PostHog.
    whyItMatters: Positioning alone cannot tell whether LaunchDarkly's governance premium actually sustains net retention and pricing power.
    diligencePath: Request competitive win/loss data, discounting, and cohort retention by buyer segment.
    relatedQuestionRefs:
    - QP023
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: ai-differentiation
    missingEvidence: Adoption, ACV, and attach-rate data for AgentControl and related AI-runtime modules.
    whyItMatters: The AI narrative could materially strengthen the moat, but public evidence does not show how commercial the attach is yet.
    diligencePath: Request pipeline, bookings, and customer-reference data for AI-control products.
    relatedQuestionRefs:
    - QP019
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: benchmarks
    missingEvidence: Independent latency, rollout-safety, and operations benchmarks across LaunchDarkly and the leading alternatives.
    whyItMatters: Current capability comparisons rely mostly on vendor and review evidence, not on lab-style measurements.
    diligencePath: Request reference-backed benchmark studies or run a controlled pilot bake-off.
