- id: drivers-constraints-and-diligence-gaps
  title: Growth drivers are clear, but public SAM math is still incomplete
  body: 'Three demand drivers stand out in the current source set. First, releases themselves have become riskier because software changes increasingly depend on real-time metrics, progressive rollout, and fast rollback rather than one-time deployment events. Second, experimentation remains a core product-development workflow that buyers want attached to delivery instead of separated from it. Third, AI introduces a new runtime-governance problem because prompts, models, tools, and policies can all change after code ships. LaunchDarkly''s current positioning is strongest where those three drivers intersect.


    The main constraints are equally visible. Open-source and self-serve alternatives cap how much pricing opacity the market will tolerate; OpenFeature lowers code-level lock-in; and public evidence still does not provide a clean LaunchDarkly-specific SAM or SOM because module attach rates, ACV by segment, and newer runtime-control monetization remain private. That means a publishable market view should be directionally confident but numerically disciplined: there is real growth logic here, but public evidence supports a layered market thesis better than a single precise TAM claim. Public evidence also suggests that market education is still part of the selling motion. LaunchDarkly publishes buyer-guide material to move teams from DIY flags toward managed governance, while OpenFeature and self-serve rivals remind buyers that portability and low-friction adoption remain live alternatives. That mix of category creation and competitive standardization is typical of a market that is expanding
    but not yet settled.'
