chapter:
  number: 2
  title: Market Analysis
  summary: LaunchDarkly operates inside a narrow but expanding feature-management market and a broader runtime-control budget that now spans experimentation, release safety, observability, and AI-agent governance. Public market pages cluster around a roughly $369M 2026 feature-management-software category, while competitor and standards evidence shows buyers increasingly evaluate LaunchDarkly against broader experimentation, product-analytics, and developer-platform alternatives rather than against simple flag tools alone.
sections:
- id: market-boundary-and-size
  title: Market boundary and size must be defined before it is valued
  body: 'The narrowest market LaunchDarkly clearly serves is feature management: controlled releases, targeting, approvals, rollout governance, and related flag operations. Multiple third-party market pages still treat that as a distinct software category and cluster around a roughly $369 million 2026 market size. That is helpful because it gives a real outer-bound number for the historic wedge that LaunchDarkly pioneered. But it is not enough on its own to describe the company''s current opportunity. LaunchDarkly''s own platform pages now present the product as runtime control for software and AI agents, with experimentation, observability, guarded releases, and AI-governance surfaces layered on top of feature flags.


    The practical implication is that investors should resist using a single “feature flags TAM” as the whole story. Public evidence suggests a layered market: a modest, clearly bounded feature-management core nested inside a much broader software-delivery, experimentation, and AI-runtime-control budget. Competitor pages support this wider view because many alternatives are no longer sold as simple flag tools either. The right diligence stance is therefore to preserve both truths at once: the legacy wedge is small enough that LaunchDarkly had to broaden, and the broadened market is real enough that the company now competes for much larger enterprise release-control budgets.'
