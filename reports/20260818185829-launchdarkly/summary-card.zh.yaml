  topStrengths:
    - LaunchDarkly 已从有潜力的开发者工具跨过门槛，成为规模化控制平面公司：ARR 超过 $200M、客户数 5,500+，并打进不少 Fortune 级客户。
    - 产品已从功能开关扩展为更有防守性的运行时控制工作流，覆盖实验、可观测性、受保护发布和 AI 智能体治理。
    - 公开客户和产品证据显示，在发布风险和可用性直接影响收入或服务质量的环境里，LaunchDarkly 与企业需求高度相关。
  topRisks:
    - 最大投资测算缺口在分母质量：公开资料仍不足以呈现毛利率、NRR、集中度、自由现金流或模块级附加销售，无法支撑明显高于过时 $3B 标记的溢价。
    - LaunchDarkly 扮演控制平面角色，可靠性、安全和信任事件都可能伤害续约与估值，尽管公开缓释措施看起来相当成熟。
    - AI 时代上行空间可信但尚未完全验证；AgentControl 及相关模块究竟加深护城河还是增加复杂度，取决于附加率、支持负担和客户实际价值。
  unresolvedGaps:
    - 当前 NRR、GRR、毛利率和自由现金流证据仍未公开，是按溢价倍数测算的主要障碍。
    - 公开资料缺少足够客户集中度、头部账户扩张或赢单 / 输单细节，难以衡量买家拿 LaunchDarkly 与更简单工具对标时的下行。
    - AI Configs 和 AgentControl 仍需要通过私下客户访谈验证附加率、支持负担和净新增收入贡献。
    - 股权结构表、清算优先权、老股比例，以及 2021 年之后任何融资或内部估值标记，公开留存证据均未披露。
