- id: capital-history-and-milestones
  title: Funding history, valuation continuity, and milestone chronology
  body: 'LaunchDarkly''s funding history is slightly messier in public memory than in the current tracker record, but the direction is clear. The company raised $8.7 million in Series A, about $21 million in Series B, $44 million in a March 2019 Series C led by Bessemer, a separate $54 million Series C entry in January 2020 according to Tracxn, and then $200 million in Series D in August 2021. That last round is the critical valuation anchor: both Lead Edge and the company said the financing set a $3 billion valuation, and public trackers still use that mark in 2026. Because no newer round is public, the 2021 valuation still functions as the last hard price even though operating scale has improved materially since then.


    The milestone path since then shows product broadening rather than financial distress. LaunchDarkly added Release Guardian in 2024, acquired highlight.io in April 2025 to deepen release observability, expanded its senior leadership bench in January 2026, launched AgentControl in May 2026, and then disclosed $200M-plus ARR in August 2026. That sequence supports a company moving from pure feature management toward a broader runtime-control and release-safety platform, particularly for AI-driven software delivery. The key caveat is that public data quality is asymmetrical: scale, customer reach, and milestone cadence are visible, but margin, retention, board structure, and current cap-table details remain private.'
