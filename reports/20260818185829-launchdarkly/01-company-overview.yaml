chapter:
  number: 1
  title: Company Overview
  summary: LaunchDarkly has matured from a 2014 feature-management startup into a late-stage private runtime-control platform with more than 5,500 customers, 37 Fortune 100 logos, and a disclosed $200M-plus ARR milestone in August 2026. Public evidence still anchors valuation at the August 2021 $3B Series D mark, while newer executive hires, the 2025 highlight.io acquisition, and the 2026 AgentControl launch show a company broadening from feature flags into release observability and AI-agent governance.
sections:
- id: identity-and-positioning
  title: Identity, positioning, and scale anchors
  body: 'LaunchDarkly has crossed from a single-use feature-flag tool into a broader runtime-control platform. The official homepage and about page now describe the company as the control layer for software releases and AI agents in production, while still preserving the original feature-management lineage that made the business relevant to engineering teams in the first place. That identity shift matters because it reframes the company from a niche developer utility into infrastructure that sits between shipping, observation, experimentation, and remediation. The 2026 materials consistently bundle feature flags, experimentation, observability, AI configs, and agent governance into one control-plane narrative rather than selling them as disconnected add-ons.


    The scale signals now support that broader positioning. Official sources say LaunchDarkly serves more than 5,500 organizations and roughly a quarter of the Fortune 500, while the January 2026 executive update adds a sharper enterprise lens: 37 of the Fortune 100 and 7 of the Fortune 10. The August 2026 ARR release says the company has surpassed $200 million in annual recurring revenue and is still growing more than 25% year over year. Public third-party trackers are directionally consistent with this maturity level: Forbes and Tracxn both keep the company at a $3 billion mark with roughly $330 million of cumulative funding. Together, those facts place LaunchDarkly firmly in late-stage private infrastructure territory rather than experimental startup status.'
