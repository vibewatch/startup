- id: leadership-governance-and-organization
  title: Founders, leadership bench, and governance visibility
  body: 'The founder story remains central to the public record. LaunchDarkly was founded in 2014 by Edith Harbaugh and John Kodumal, and public bios still keep both names tightly linked to the company''s operating identity. That continuity helps the founder-market-fit narrative: the business began around release-risk pain that the founders had seen firsthand, and current messaging still leans on that origin. But the public organization story in 2026 is no longer just founder-only. LaunchDarkly added Cameron Etezadi as CTO and Robert O’Donovan as CFO in January 2026, brought Jonathan Nolen back as SVP of Product, and then appointed Andy Pemberton as CRO in August 2026. That sequence suggests a deliberate push to broaden executive capacity across engineering, finance, product, and global go-to-market.


    Even so, governance transparency remains thinner than leadership branding. Public sources are informative on executive appointments and investor lineage, but they do not cleanly disclose a current board roster, committee structure, ownership concentration, or liquidation stack. For a company at $200M-plus ARR and a stale but still-important $3B valuation marker, that missing governance layer is a real diligence gap rather than a cosmetic omission. The implication is not necessarily adverse control behavior; it is simply that the public evidence set is much stronger on product, fundraising, and customer reach than on private-company governance mechanics.'
  claimRefs:
  - CO001
  - CO015
  - CO016
  - CO017
  - CO024
