- id: scale-and-capital-efficiency
  title: Public scale markers imply a real late-stage business even without full margin disclosure
  body: 'LaunchDarkly''s 2026 public disclosures are unusually helpful by private-company standards. The company first said in January 2026 that it was nearing $200 million in ARR with re-accelerated growth above 20% year over year and well over $300K of ARR per FTE. By August 2026 it said ARR had surpassed $200 million and was growing more than 25% year over year. Tracxn''s June 2026 headcount marker of 648 employees makes the efficiency signal even more concrete: even using the disclosed ARR floor, the business appears to be operating at roughly or above $309K ARR per employee.


    Earlier milestones reinforce that this is not a sudden spike. LaunchDarkly reported 3x revenue growth in 2018, said it had more than 700 customers and less than 1% churn in the 2019 Series C announcement, and said it had over 2,000 customers and 300-plus employees at the time of the 2021 Series D. Public evidence therefore supports a company that compounded steadily for years before adding AI-era runtime-control surfaces. What it does not support is a full profitability read: gross margin, burn, and cash generation still remain private.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
