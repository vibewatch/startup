  topStrengths:
    - LaunchDarkly has crossed the threshold from promising devtool to scaled control-plane company, with >$200M ARR, 5,500+ customers, and meaningful Fortune-tier penetration.
    - The product has broadened from feature flags into a more defensible runtime-control workflow spanning experimentation, observability, guarded releases, and AI agent governance.
    - Public customer and product evidence suggests strong enterprise relevance in environments where release risk and uptime directly matter to revenue or service quality.
  topRisks:
    - 'The main underwriting gap is denominator quality: public sources still do not show gross margin, NRR, concentration, free cash flow, or module-level attach strongly enough to justify a clear premium above the stale $3B mark.'
    - LaunchDarkly's control-plane role makes reliability, security, and trust events potentially damaging to renewals and valuation, even though public mitigations look reasonably mature.
    - AI-era upside is plausible but not yet fully proven; AgentControl and related modules could deepen moat or add complexity depending on attach, support burden, and realized customer value.
  unresolvedGaps:
    - Current NRR, GRR, gross margin, and free-cash-flow evidence remain private and are the main blockers to premium-multiple underwriting.
    - Public sources do not show enough customer concentration, top-account expansion, or win/loss detail to measure downside if buyers benchmark LaunchDarkly against simpler tools.
    - AI Configs and AgentControl still need private reference checks on attach rate, support burden, and net-new revenue contribution.
    - The cap table, liquidation preferences, secondary mix, and any post-2021 financing or internal marks remain undisclosed in retained public evidence.
