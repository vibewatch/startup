  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The public legal and trust surface is credible, but it creates ongoing privacy and compliance obligations
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly presents a comparatively mature public trust surface for a private infrastructure software
              company. The security page, privacy policy, data processing addendum, subprocessor list, and service-level
              agreement together show that management has formalized the policies enterprise buyers expect during
              procurement. That lowers one class of risk: the company is clearly not trying to sell a control-plane
              product into large enterprises with immature legal or trust artifacts.


              The more nuanced read is that these artifacts are evidence of obligations as much as of maturity. A
              company sitting in release workflows, targeting systems, and increasingly AI-runtime controls must keep
              privacy, processor governance, uptime commitments, and evolving buyer expectations current across
              jurisdictions. Public evidence did not surface a confirmed active enforcement or litigation event in the
              retained sources, but it also did not eliminate legal, privacy, or certification diligence risk. For that
              reason, the legal posture should be read as “structured and investable, but still requiring data-room
              verification.” The key takeaway is that legal and trust risk is not absent; it is institutionalized. That
              is usually what investors want to see in enterprise infrastructure, but it raises the importance of
              confirming that internal controls, renewal of legal schedules, and processor oversight have kept pace with
              product expansion.
