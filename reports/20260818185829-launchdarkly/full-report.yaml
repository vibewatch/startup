  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Usage-based monetization now spans flags, experimentation, observability, and AI runs
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly's public pricing page makes two things clear. First, the commercial model is usage-based, not
              classic seat-based SaaS. The company explicitly says teams can invite unlimited users and that pricing is
              driven by usage measures such as service connections, client-side MAU, observability volumes, and AI runs.
              Second, monetization has widened materially beyond core feature flags. The current surface meters
              experimentation MAU, observability data, session replay and error limits, and AI-run consumption, while
              reserving the highest-value governance features—advanced targeting, custom roles, approvals, workflows,
              and Release Guardian-type safety layers—for enterprise pricing.


              That structure matters because it shows LaunchDarkly trying to align price with runtime activity rather
              than with simple user counts. It also suggests why the business could scale efficiently if customers
              deepen production use: more releases, more client-side reach, more telemetry, and more AI runs all create
              natural monetization surfaces. The trade-off is that opaque enterprise packaging still makes it hard to
              benchmark LaunchDarkly against self-serve rivals on pure TCO without direct customer data. The model also
              means revenue should, in theory, rise with production importance rather than only with seat expansion,
              which is one reason the business can scale into very large enterprise accounts without converting into a
              classic per-user contract.
