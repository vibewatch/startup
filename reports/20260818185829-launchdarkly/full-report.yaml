  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape is broader than a feature-flag category map
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly is no longer competing only against simple feature-flag vendors. The current field includes
              governance-first feature-management platforms, experimentation-first suites, self-serve engineering tools,
              and broader delivery platforms that attach feature management to CI/CD or product analytics. That widening
              comparison set is visible directly on competitor pages: Statsig markets a full product-development
              platform, GrowthBook combines experimentation and flags, Harness embeds feature management into a delivery
              suite, Optimizely and VWO approach from experimentation, PostHog bundles flags with experiments and
              analytics, and CloudBees sells brownfield enterprise control. The result is a market where LaunchDarkly
              must defend both a category wedge and a broader workflow wedge.


              That matters strategically because buyer identity determines the rival that matters most. Platform and
              release teams will compare LaunchDarkly against Harness, CloudBees, and governance-heavy suites; product
              or growth teams may compare it against Optimizely, VWO, and Statsig; portability-sensitive engineering
              teams may compare it against GrowthBook, DevCycle, or PostHog. A credible competitive analysis therefore
              has to classify the market by buyer job rather than by old vendor labels. Public review surfaces reinforce
              that this is not an abstract analyst grouping: buyers visibly evaluate LaunchDarkly alongside both newer
              self-serve tools and older enterprise release platforms. That reinforces the need to read the category as
              converging rather than fixed.
