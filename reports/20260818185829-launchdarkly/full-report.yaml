      - number: '7.2'
        title: The main operating risk is control-plane criticality rather than physical operations
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly’s most important operational risk comes from where it sits in customer systems. A
              runtime-control platform becomes part of the live path for releases, targeting, experimentation, and now
              AI behavior. That means outages, security weaknesses, or rollback-control failures can transmit quickly
              into customer downtime, poor user experiences, and damaged trust. The public status page, SLA,
              observability materials, Release Guardian, and release-assurance guides all indicate that the company
              understands this and is building mitigations into both contract structure and product design.


              At the same time, outside lenses matter. UpGuard offers an adverse security-style view, TrustRadius
              provides customer-friction evidence, and OWASP plus privacy-regulatory frameworks provide the broader
              context for what a production control plane must defend against. Standards support through OpenFeature
              softens lock-in concerns, but it does not remove dependency risk around workflow adoption, history,
              integrations, and operating processes. In short, the operational risk looks tractable, but only if
              LaunchDarkly’s deep reliability and security practices are as mature as its public messaging. This is why
              residual diligence should focus on hard evidence instead of slogans: incident history, fallback logic,
              dependency concentration, and security operations quality. A platform that helps customers reduce release
              risk must itself be especially resilient under stress.
