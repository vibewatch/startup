  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The public customer record shows scale and real enterprise penetration
        blocks:
          - type: paragraph
            body: >-
              LaunchDarkly's customer evidence starts with scale. Official and near-official sources state that the
              company serves more than 5,500 customers and had reached 37 of the Fortune 100 and 7 of the Fortune 10 by
              early 2026. Those figures matter because they move the conversation beyond “well-liked developer tool”
              status into something closer to a horizontal enterprise-control layer. Combined with the earlier
              500th-customer milestone from 2018, they also suggest that adoption has compounded over a long period
              rather than emerging only from the current AI wave.


              Just as important, the visible logo set is diverse. Public references span financial services, healthcare,
              automotive, public sector, ecommerce, media, legal-tech, and developer tooling. That diversity supports
              the thesis that LaunchDarkly is not dependent on one vertical narrative; instead, it benefits anywhere
              software teams need controlled change in production. The breadth also matters strategically because it
              lowers the risk that the company is riding only one cyclical budget pocket. If healthcare insurers, banks,
              media apps, public-sector programs, and software platforms all use the product for related but distinct
              reasons, then customer demand is tied to a durable operating problem: how to change production systems
              safely and measurably. It is a better horizontal proof set than many private infrastructure peers disclose
              publicly.
