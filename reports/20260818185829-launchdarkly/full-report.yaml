companyProfile:
  summary: >-
    LaunchDarkly is a 2014-founded private infrastructure software company that began in feature management and now
    positions itself as a broader runtime-control platform for software and AI agents. Public evidence supports real
    scale rather than mere category narrative: more than 5,500 customers, disclosed penetration into 37 of the Fortune
    100, and ARR above $200 million by August 2026. The investment debate is therefore not whether LaunchDarkly matters;
    it is whether the company’s still-private revenue quality, margin profile, and AI-module attach justify paying
    materially above the last public $3 billion mark from 2021.
