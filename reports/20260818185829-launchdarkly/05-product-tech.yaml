chapter:
  number: 5
  title: Product & Technology
  summary: LaunchDarkly's product has broadened from core feature flags into a runtime-control stack spanning experimentation, observability-linked release safety, AI configs, and AgentControl. The official platform surface still starts with flags and rollout governance, but current 2025-2026 product materials show the company trying to own the full loop from rollout to measurement to remediation for both code and AI agents. Public technical evidence is strongest on workflow scope and developer integrations, and weaker on a deep system-architecture diagram or formal roadmap commitments.
sections:
- id: core-modules-and-workflows
  title: The product now spans release control, experimentation, observability, and AI governance
  body: 'LaunchDarkly''s public product surface now reads like a multi-module runtime-control platform rather than a narrow flag service. The official platform, feature-flags, experimentation, observability, AI-agent-control, and AI-built-code pages all describe pieces of one workflow: release software or agent behavior safely, measure what happens in production, and intervene quickly when something goes wrong. That workflow continuity matters more than any single module. It is why the company can credibly argue that it sits between deployment and outcome rather than inside only one step of the toolchain.


    The newest additions make the broadening especially explicit. Release Guardian linked releases to monitoring and automatic rollback logic in 2024; AI Configs made prompts and models a runtime-controlled asset; and AgentControl extended that control loop to agent behavior, optimization, and later multi-agent graphing. The result is a product vision where feature flags remain the control primitive, but the company increasingly sells higher-order governance and learning workflows on top of them. What makes the platform strategically interesting is that each added module reuses the same core idea: move operational decisions from code deploy time into controlled runtime decisions. That architecture thesis helps explain why LaunchDarkly can expand from release teams into product, SRE, and now AI-platform stakeholders without abandoning its original control primitive.'
