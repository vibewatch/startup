      - TU004

  - id: geographic-expansion-concentration
    title: Geographic Mix, Expansion Levers, and Concentration Risk
    body: >-
      team.blue's 22-country footprint spans Western Europe (Belgium, Netherlands, UK, Germany, France,
      Italy, Spain, Portugal, Switzerland, Austria, Ireland), the Nordics (Sweden, Denmark, Finland), and
      CEE (Czechia, Slovakia, Hungary, Serbia, Bulgaria, Cyprus, Greece). The company claims top-10
      market positions in 10 of these countries. Western Europe and the Nordics represent the
      legacy revenue base established through Combell (Benelux), TransIP (Netherlands), one.com
      (Nordic/UK), 123-reg (UK), Loopia (Sweden), and Register.it (Italy). CEE expansion has
      accelerated via Loopia Group's Slovak/Czech/Hungarian/Serbian operations (May 2024), Shoptet's
      Czech Republic/Slovakia leadership (September 2025), and Saleskit's Czech Republic/Slovakia CEE
      B2B intelligence footprint (March 2026).

      Geographic concentration risk is moderate: team.blue has limited explicit presence in France,
      Germany, and Spain at the volume level of its Benelux or Nordic brands, and no disclosed presence
      in Iberian Peninsula or Eastern Balkans at material scale. The three largest countries for
      digital-SMB spend in Europe (Germany, France, UK) are addressable, but relative market share in
      Germany and France versus IONOS, OVHcloud, or local operators is unconfirmed.

      Expansion levers include: (a) organic cross-sell of SaaS tools (Metricool, iubenda, Kolsquare,
      Saleskit, SimplyBook.me) to the existing 3.3M hosting base; (b) M&A of additional CEE/Southern
      European SMB platforms; (c) Macaly (AI app builder) roll-out across hosting brands as a
      differentiated onboarding upgrade; and (d) Windsor.ai (330+ data source integrations) serving
      the marketing-analytics upgrade path. Customer concentration risk at the individual customer level
      is low — no single SMB customer is material to group revenue. Agency concentration is a second-
      order risk: 30K agencies driving cross-sell amplification could represent a disproportionate
      share of referral-driven conversions, and any large-scale agency churn could compress acquisition
      efficiency.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU038
      - CU045
      - CU046
      - CU047
    tableRefs:
      - TU005

