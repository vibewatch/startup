  - id: named-customer-proof
    title: Named Customer Proof and Production Deployment
    body: >-
      team.blue's public customer evidence is largely confined to a small set of named testimonials on
      brand websites and the group's customers portal. The strongest outcome-anchored proofs are at the
      brand level. SimplyBook.me customer Permanent Makeup Budapest documented a no-show rate reduction
      from approximately 15% to 5% — a 67% improvement — directly attributable to automated booking
      reminders and 24/7 availability. This is a rare instance of a quantified outcome in team.blue's
      public evidence, and it validates the service-business appointment model. At the infrastructure
      tier, Pipa (described as a managed-hosting customer) reported a "quick and painless" migration to a
      hybrid environment with "no impact on customers," while Benerail (Virtual Servers, Managed
      Kubernetes, Cloud Solutions) cited team.blue's ability to advise on scalable infrastructure for
      continued growth, and Molokini used VPS, CAT2, and Shared Hosting.

      Enterprise-tier proof is strongest at Kolsquare, whose named clients include globally recognised
      brands (Coca-Cola, Netflix, Sony Music, Publicis, Sézane, Sephora, Lush, Hermès) with specific
      testimonials on influencer discovery accuracy, data-driven selection confidence, and time savings
      of 250+ hours per user. These are mid-market to enterprise buyers, distinct from the SMB base,
      using Kolsquare as a campaign intelligence platform. Shoptet's testimonials and independent review
      positioning as "most intuitive" Czech e-shop builder support its 90%+ satisfaction claim, though
      no independent review-platform score corroborating that figure was located in public sources.
      Overall, the named customer proof set demonstrates real production deployments across at least four
      distinct use cases (appointment booking, managed infrastructure, influencer marketing, e-commerce),
      but the depth and freshness of case studies at the group's core hosting brands (one.com, Combell,
      TransIP, 123-reg) is thin, relying on legacy brand positioning rather than recent outcome data.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU022
      - CU018
    tableRefs:
      - TU003
    figureRefs:
      - FU002

  - id: retention-satisfaction
    title: Retention, Satisfaction, and Adverse Customer Signals
    body: >-
      The sole publicly disclosed NPS figure in team.blue's ecosystem is Combell's 76 (Q1 2026 ESG
      impact report), benchmarked as high by Combell's own framing. No group-level NRR, GRR, cohort
      retention, churn rate, average contract length, or revenue per customer data has been disclosed
      by team.blue or Hg Capital in any press release, investor communication, or public filing reviewed
      during this research. The absence of these figures is a material diligence gap, as the company's
      subscription-led model's durability cannot be independently verified.

      Independent review platform evidence is significantly adverse for several key brands. SmartCustomer
      awards one.com 1.3 stars (very low) across a broad set of reviews spanning 2023–2025, with
      recurring themes including: arbitrary price increases mid-contract, forced package upgrades tied to
      backup-storage accounting changes, billing for services not ordered, deliberate friction in
      cancellation (requiring printed and signed domain-transfer forms), and extremely difficult domain
      transfer processes that multiple reviewers describe as "intentional." SmartCustomer rates 123-reg
      2.1 stars, with complaints spanning email service failures during upgrades, unresponsive technical
      support, and domain management issues. HostAdvice's expert review of one.com (2026) is more
      positive — rating the platform as fast (100% GTmetrix performance score, sub-600ms load times)
      and user-friendly — suggesting the product quality may be adequate but the commercial and
      post-sale experience drives negative customer sentiment.

      The structural implication is that team.blue's subscription model generates high initial conversion
      of cost-sensitive SMBs but risks retention degradation through price escalation practices, with
      lock-in created by domain transfer complexity and bureaucratic cancellation processes substituting
      for genuine product-led retention. Combell's NPS of 76 may reflect a different sub-segment (Belgian
      market, more established SMB base) and should not be extrapolated to the full 3.3 million base
      across all brands and geographies. No NPS data was located for one.com, 123-reg, TransIP, Loopia,
      or any other major hosting brand in the group's UK, Dutch, or Nordic operations.
    claimRefs:
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU041
