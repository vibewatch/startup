callouts:
  - calloutType: strength
    title: 3.3 Million Customers Provide Durable Distribution Moat
    body: >-
      team.blue's installed base of 3.3 million SMB subscribers across 22 countries is the primary
      commercial asset. At current scale, it enables zero-cost distribution for any newly acquired
      SaaS brand, as demonstrated by Metricool, Kolsquare, and iubenda gaining access to this base
      immediately post-acquisition. This moat compounds with every new brand added.
    claimRefs:
      - CU001
      - CU037

  - calloutType: strength
    title: Shoptet and Metricool Provide Rare Quantified Customer Proof
    body: >-
      Shoptet's >90% satisfaction score and Metricool's €17M ARR at 2M+ users are the only two
      disclosed brand-level metrics providing genuine diligence anchor points for the group's customer
      quality. Both brands show above-median SaaS engagement relative to their acquisition scale.
    claimRefs:
      - CU015
      - CU018

  - calloutType: risk
    title: Adverse Review Signals at Core Hosting Brands Are Structurally Material
    body: >-
      one.com's 1.3-star and 123-reg's 2.1-star SmartCustomer ratings reflect systemic commercial
      practices — price hikes, billing lock-in, cancellation friction — that risk churn acceleration
      at renewal. These brands together likely represent a significant portion of the 3.3M base. The
      absence of group-level GRR/NRR disclosure makes it impossible to quantify exposure.
    claimRefs:
      - CU031
      - CU032
      - CU035
      - CU036

  - calloutType: risk
    title: No Group NRR, GRR, or Cohort Data Disclosed
    body: >-
      team.blue and Hg Capital have not disclosed any group-level net revenue retention, gross revenue
      retention, annual churn rate, cohort retention curve, or average contract length. For a
      subscription-platform valued at €4.8 billion, this is a critical diligence gap. Combell's single
      NPS of 76 cannot be extrapolated to the full customer base.
    claimRefs:
      - CU029
      - CU028

  - calloutType: insight
    title: Agency Channel (~30K) Functions as a Multiplier for SMB Acquisition and Retention
    body: >-
      team.blue's explicit citation of ~30,000 agencies in its ecosystem — manifested through Kolsquare,
      Metricool, and Leadinfo — positions agencies as a channel layer that both drives SMB customer
      acquisition and increases switching costs. Agency relationships are stickier than consumer
      relationships, but agency-level concentration risk (if top agencies drive disproportionate volume)
      is unquantified.
    claimRefs:
      - CU025
      - CU024

