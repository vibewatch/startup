  - id: leadership-governance
    title: Leadership, Board, and Governance
    body: >-
      team.blue's leadership structure blends founder-entrepreneurs with PE-appointed operators and
      Hg-affiliated board members. Jonas Dhaenens (Founder and President) remains the strategic face
      and M&A driver of the group; he founded Combell at 16 and has personally led over 150 transactions
      across Europe. Claudio Corbetta (Group CEO) brings 25+ years of experience including a Mathematics
      degree from Cambridge (1994) and MBA from INSEAD (2000); he previously built data-driven marketing
      capabilities as CEO of DADA S.p.A. before joining team.blue. Dawn Marriott (Executive Chair),
      a Partner at Hg, joined in 2021 and previously drove the integration of 50+ acquisitions as
      CEO of Azets, an Hg portfolio company. Kirk Barlow (Group CTO) has 26+ years of global technology
      experience at Oracle, Compaq, HP, Siemens, IBM, and served as CIO at ABB, Novartis, Credit Suisse,
      and Belron Group. Benjamin Lang (Chief Growth Officer) is a former senior commercial leader at
      Shopify (nearly four years, Europe-focused) who leads customer success, cross-sell, and marketing.
      Torsten Hauschildt (Head of M&A) spent 12 years as MD of M&A and Investment at United Internet AG
      (parent of IONOS/1&1), institutionalising the M&A capability. Ali Niknam (Board Member, TransIP
      co-founder) also founded bunq, a European neo-bank, in 2012, and remains a cornerstone investor.
      The board includes Hg partners Joris Van Gool, Nick Jordan, and Matthijs Deroo, plus CPP-appointed
      Jessica Morris and Sofina-observer Anthony Keusters. Independent governance is further anchored
      by Jon Wrannall and Jeroen Hüpscher (former TransIP CEO). team.blue scored 9.9/10 in Hg's
      2025 Integrity and Stewardship diagnostic, one of the highest scores in the Hg portfolio, per
      company ESG disclosure. Hans Nijholt (Chief Product Officer) is quoted in the April 2026 AI press
      release. The concentration of Hg-affiliated board seats relative to external independent directors
      warrants monitoring as a governance risk.
