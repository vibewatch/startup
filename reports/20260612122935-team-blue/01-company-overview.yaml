  - id: capital-investors
    title: Capital Structure and Investor Ecosystem
    body: >-
      team.blue is a private, PE-backed company with no public filing obligations, making the precise
      debt and equity structure opaque to outside observers. The three disclosed institutional investors
      are Hg Capital (primary and largest investor, invested since December 2018/June 2019), CPP Investments
      (Canada Pension Plan Investment Board, significant minority at ~20%, announced July 10, 2024),
      and Sofina (Belgian listed investment company, minority stake, announced July 22, 2024). Jonas
      Dhaenens (Founder and President) and Ali Niknam (co-founder, TransIP) remain cornerstone investors
      with meaningful equity stakes alongside the wider management team. Hg managed approximately
      $70 billion in AUM at the time of the CPP Investments deal, and CPP Investments had a total
      fund of $632.3 billion as of March 31, 2024, making both backers institutions with long time
      horizons and deep pockets. The CPP Investments transaction — confirmed by Linklaters, which
      advised Hg and team.blue — valued the company at €4.8 billion, representing an eight-times
      return since Hg's initial partnership in 2019. The deal implied a CPP stake of roughly 20% per
      Linklaters' disclosure. Sofina joined just 12 days after CPP, with Harold Boël (Sofina CEO)
      describing it as backing "the strongest companies, entrepreneurs and investors in our sectors
      and geographies of interest." Advisors on the CPP transaction included Arma Partners, EY, Bain,
      Deloitte, Linklaters, and BearingPoint for team.blue; Harris Williams, KPMG, MacFarlanes, and
      Norbruis Clement for shareholders; and Kirkland & Ellis, JP Morgan, OC&C, and KPMG for CPP
      Investments. Neither the quantum of debt, the EBITDA multiple, nor the interest coverage
      structure have been disclosed. A Bloomberg report dated March 23, 2026, noted team.blue
      scrapped a two-part leveraged loan repricing deal, confirming that a leveraged capital
      structure exists but remains opaque in total quantum and tenor.
