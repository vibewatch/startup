callouts:
  - calloutType: strength
    title: Eight-Times Growth and Deep PE Backing Confirm Platform Durability
    body: >-
      The €4.8 billion July 2024 valuation represents an eight-times return since Hg's 2019 entry, corroborated
      by Linklaters (legal counsel) and CPP Investments' own public statements. The three-investor syndicate —
      Hg ($70B AUM), CPP ($632B fund), and Sofina (Belgian listed) — provides capital depth, governance support,
      and patient long-term horizons, substantially de-risking funding continuity.
    claimRefs:
      - CO009
      - CO022
      - CO023
      - CO035
      - CO036

  - calloutType: risk
    title: Leveraged Loan Opacity and Customer Review Friction Are Material Risks
    body: >-
      Bloomberg reported in March 2026 that team.blue scrapped a planned two-part leveraged loan repricing
      deal, confirming leverage exists but quantum and covenant structure remain entirely opaque. Separately,
      one.com (a major team.blue brand) averaged 1.3 stars on SmartCustomer.com, indicating potential NPS
      and retention challenges beneath the macro customer count headline. Investors cannot independently
      verify EBITDA coverage or churn dynamics without access to private financials.
    claimRefs:
      - CO031
      - CO032
      - CO033
      - CO034
      - CO030

  - calloutType: assumption
    title: Revenue and Margin Assumptions Must Be Held Until Private Disclosure
    body: >-
      All financial models relying on team.blue's revenue or EBITDA must be estimated from comparable
      public peers (IONOS: ~€1.3B FY2025, ~40% EBITDA target; OVHcloud: ~€906M). team.blue's own
      financials remain private and undisclosed. The platform's buy-and-build nature also means
      consolidated revenue will shift with each acquisition, making trailing estimates rapidly stale.
    claimRefs:
      - CO029
      - CO030
      - CO032

