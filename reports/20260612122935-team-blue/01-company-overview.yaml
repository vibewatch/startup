  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Consolidated team.blue annual revenue and EBITDA for any fiscal year; gross margin;
        net revenue retention; customer churn by brand.
      whyItMatters: >-
        Without revenue and EBITDA, the €4.8 billion valuation cannot be anchored to a multiple,
        making relative value assessment impossible for outside investors or acquirers.
      diligencePath: >-
        Request audited consolidated financial statements from Hg Capital or team.blue as part
        of formal due diligence; compare against IONOS (€1.316B FY2025) and OVHcloud comps.
      relatedQuestionRefs:
        - QO008
        - QO014

    - type: private-evidence-only
      severity: material
      topic: debt
      missingEvidence: >-
        Total leveraged loan quantum, interest rate (fixed/floating), maturity date, covenant package
        (net leverage cap, interest coverage ratio), and status of refinancing plan post March 2026 failure.
      whyItMatters: >-
        The scrapped 2026 loan repricing confirms leverage exists but the total debt burden, maturity
        profile, and free cash flow available for growth are unknown, creating material downside risk.
      diligencePath: >-
        Obtain the credit facility agreement and latest lender amendment letter; engage financial
        adviser to model debt service against estimated EBITDA range from peer comps.
      relatedQuestionRefs:
        - QO016

    - type: missing-source
      severity: material
      topic: customers
      missingEvidence: >-
        Updated 2026 customer count post-Shoptet (Sep 2025), Macaly (Dec 2025), and Windsor.ai (Jan 2026)
        acquisitions; the most recent confirmed count is 3.3M from July 2024.
      whyItMatters: >-
        Customer count is a core growth metric; the 2024 figure is nearly two years old and likely understates
        current scale by several hundred thousand customers.
      diligencePath: >-
        Monitor 2026 press releases and annual ESG report for updated customer count disclosure.
      relatedQuestionRefs: []

    - type: enumeration-incomplete
      severity: minor
      topic: financing
      missingEvidence: >-
        Exact equity ownership percentages for Hg Capital, Jonas Dhaenens, Ali Niknam, and management
        team; Sofina's stake size; CPP stake confirmed only as ~20% from Linklaters.
      whyItMatters: >-
        Governance and alignment analysis requires knowing exact voting rights and economic interests;
        the three-way institutional syndicate may have divergent exit timelines.
      diligencePath: >-
        Request shareholder agreement and cap table from team.blue or Hg Capital in formal diligence process.
      relatedQuestionRefs: []
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: adverse
      missingEvidence: >-
        Confirmed record of any data breach, cybersecurity incident, service outage, or regulatory
        enforcement action against any team.blue brand in 2025 or 2026.
