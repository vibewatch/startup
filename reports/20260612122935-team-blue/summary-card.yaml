summary:
  headline: >-
    team.blue is Europe's best-capitalised SMB digital platform with a proven buy-and-build flywheel and Tier-1 PE
    backing, but complete financial opacity, a failed leveraged loan repricing, and a valuation multiple that implies a
    3–5× premium to public European peers limit conviction to a "track" rating until the debt structure and revenue base
    are independently confirmed.
  overallScore: 6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
