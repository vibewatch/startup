chapter:
  number: 4
  title: Financials
  summary: >-
    team.blue is a private, PE-backed platform that discloses no revenue, EBITDA, or debt quantum,
    making full financial underwriting impossible from public sources alone. The strongest disclosed
    anchor is a €4.8 billion enterprise valuation at the July 2024 CPP Investments transaction,
    implying 8× growth since Hg's 2019 entry. M&A press releases reveal partial revenue data for
    acquired entities (Loopia 742 MSEK/~€65M in 2023; Shoptet >€30M; Metricool ARR €17M), while
    comp benchmarks from IONOS (€1.316B FY2025), OVHcloud (€1.085B FY2025), and GoDaddy ($4.951B
    FY2025) anchor an estimated revenue range of €450–650M on a bottom-up customer/ARPU methodology.
    An adverse Bloomberg signal (March 2026) confirmed that team.blue scrapped a two-part leveraged
    loan repricing deal, revealing a material leveraged capital structure whose quantum, maturity,
    and covenant terms remain entirely undisclosed.

sections:
  - id: revenue-model
    title: Revenue Streams and Recurring-Revenue Structure
    body: >-
      team.blue generates revenue primarily through recurring subscriptions sold to SMBs and
      entrepreneurs across 22 European countries. The core subscription engine covers four
      product families: (1) web hosting and shared-infrastructure services (Combell, one.com,
      TransIP, Loopia, Register.it, and 20+ additional brands); (2) domain registration and
      renewal, where the group manages multi-million domain portfolios including approximately
      2 million domains through the Loopia cluster alone; (3) e-commerce enablement (Shoptet,
      with revenues exceeding €30 million at acquisition in September 2025, is the anchor);
      and (4) a growing SaaS adjacency layer covering online compliance (iubenda, ConsentManager),
      social-media management (Metricool, ARR €17M at September 2024 acquisition), influencer
      marketing (Kolsquare), online bookings (SimplyBook.me), B2B lead intelligence (Leadinfo,
      Saleskit), AI web-app building (Macaly), and data integration (Windsor.ai). Pricing for
      hosting and domain subscriptions is published across brand websites (e.g., one.com,
      TransIP, Register.it) at low single-digit to mid-double-digit euros per month, creating
      predictable low-churn recurring cash flows. SaaS products carry higher per-seat pricing
      and ARR visibility, as evidenced by Metricool's disclosed €17M ARR. The company's own
      description as a "one-stop partner for web hosting, domains, e-commerce, online compliance,
      lead generation and other SaaS solutions" supported by 4,000+ experts describes a revenue
      model that blends mass-market low-ARPU hosting subscriptions with higher-ARPU SaaS
      adjacencies acquired through buy-and-build. Revenue recognition for subscription businesses
      is typically monthly or annual in advance, which combined with multi-year domain renewals
      creates a high proportion of contracted, visible forward revenue. IONOS's publicly disclosed
      ~80% recurring revenue profile and ~90% EBITDA cash conversion provide the closest
      comparable benchmarks and suggest team.blue's hosting-centric model carries structurally
      similar recurring-revenue and cash-flow characteristics, though at a smaller disclosed scale.
