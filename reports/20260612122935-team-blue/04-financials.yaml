  - id: financial-verdict
    title: Financial Verdict — Estimation Framework and Diligence Blockers
    body: >-
      team.blue presents a structurally attractive recurring-revenue profile — subscription-led,
      multi-brand, geographically diversified, with demonstrated ability to acquire revenue at
      scale — but the absence of any group-level financial disclosure creates deep uncertainty
      for external underwriting. The revenue estimate of €450–650M rests on three convergent
      signals: (1) bottom-up customer/ARPU triangulation using Loopia's disclosed €100/year
      and IONOS's public €212/year as floor and ceiling; (2) M&A press release revenue data
      from Loopia (€65M, 2023), Shoptet (>€30M, 2025), and Metricool (€17M ARR, 2024) as
      partial-portfolio anchors; and (3) the €4.8B valuation implying 7–10× EV/Revenue or
      18–25× EV/EBITDA if margins approximate IONOS's 40% target. None of these inputs is a
      management-confirmed figure, and all carry the risk of overestimating integration
      completeness, organic growth rate, and ARPU convergence across 60+ brands. The disclosed
      financial signals confirm a high recurring-revenue composition, strong customer retention
      inferred from the 20-year track record and industry-standard hosting churn benchmarks,
      and a growing SaaS adjacency layer that should carry higher EBITDA margins than core
      hosting. However, the leveraged capital structure is a material risk: a failed March 2026
      loan repricing suggests that the existing debt may have a near-term maturity or
      burdensome rate structure, and until the quantum is disclosed, interest coverage cannot
      be computed. The primary diligence blockers are: (1) consolidated group revenue and
      EBITDA for the most recent full fiscal year; (2) total net debt, loan maturity profile,
      and current interest rate; (3) gross margin by segment (hosting vs SaaS vs e-commerce);
      (4) customer churn and net revenue retention across the top 10 brands; (5) acquisition
      earnout obligations and integration capex pipeline. Without these inputs, revenue quality,
      margin trajectory, and capital-adequacy conclusions must remain provisional. The comparison
      to IONOS is instructive but limited: IONOS is organically focused, publicly listed, and
      has no significant leveraged debt; team.blue's buy-and-build complexity and PE capital
      structure make the EBITDA-to-free-cash-flow conversion materially less predictable.
      The €4.8B valuation at the July 2024 transaction represents the best available anchor
      for value, but it is now over 18 months old, the credit environment has tightened, and
      the failed loan repricing is an adverse signal that warrants explicit disclosure before
      any capital commitment.
