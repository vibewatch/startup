companyProfile:
  summary: >-
    team.blue (legal root: Combell Group NV) is a Belgium-headquartered private technology
    platform and Europe's largest privately owned digital-enabler for SMBs. Founded in 1999
    by Jonas Dhaenens as a Belgian web-hosting startup, the business was scaled through five
    years of Waterland Private Equity partnership before Hg Capital succeeded Waterland in
    December 2018. The June 2019 merger of Combell with TransIP Group — co-founded by Ali
    Niknam — established team.blue, which has since executed more than 150 acquisitions to
    reach 3.3 million customers in 22 European countries by July 2024. Key acquisitions include
    Loopia Group (May 2024, 650,000 customers), Metricool (September 2024, ARR €17M), Shoptet
    (September 2025, revenue >€30M), Macaly (December 2025), and Windsor.ai (January 2026).
    CPP Investments acquired approximately 20% of the equity in July 2024 at a €4.8 billion
    enterprise valuation — an eight-times return since Hg's 2019 entry. Group CEO Claudio
    Corbetta leads the business; Jonas Dhaenens serves as President and cornerstone shareholder.
    A March 2026 Bloomberg-reported failure to reprice and extend existing leveraged loans
    is the most material disclosed risk, confirming a leveraged capital structure whose
    quantum, maturity, and covenants remain entirely undisclosed.
