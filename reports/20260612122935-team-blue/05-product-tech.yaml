chapter:
  number: 5
  title: Product & Technology
  summary: >-
    team.blue operates a layered product architecture spanning five clusters: foundational hosting/domains/email,
    WordPress/VPS/cloud infrastructure, compliance SaaS (iubenda, consentmanager), e-commerce SaaS (Shoptet),
    and social/marketing SaaS (Metricool, Kolsquare, SimplyBook.me). All clusters are unified by the proprietary
    BlueAI platform and AI-native tooling including Macaly (no-code builder, Dec 2025), Windsor.ai (data
    integration, Jan 2026), and AI-enhanced booking and compliance products. The technology backbone is
    PHP-dominant, supported by VMware Pinnacle Partner infrastructure with ISAE/ISO 27001 certified datacentres,
    and European-only data residency commitments from TransIP and Windsor.ai. Developer engagement is materially
    evidenced by the January 2026 PHP Foundation Gold Sponsorship. Key risks are unverified ISO 27001 scope
    for core hosting brands and the opaque BlueAI infrastructure dependency chain.

sections:
  - id: product-portfolio
    title: Product Portfolio and Cluster Architecture
    body: >-
      team.blue's product portfolio is organised into five strategic clusters. The foundational cluster is
      hosting, domains, and email: brands such as Combell (Belgium), TransIP (Netherlands), one.com (UK/Nordics),
      Register.it and Aruba (Italy), 123-Reg (UK), Loopia (Sweden/Nordics), and ~35 other regional brands
      provide web hosting, domain registration, email hosting, SSL, and entry-level website builders. The
      ecosystem page confirms top-10 market positions in 10 of 22 operating countries. The second cluster —
      WordPress and VPS/cloud infrastructure — targets developers and growing SMBs: TransIP offers five VPS
      packages with performance add-ons, Managed WordPress with an AI Site Assistant (including GPT Image 1
      upgrade), and open-source AI application support (Ollama, n8n, OpenClaw); Aruba.it adds Private AI
      solutions for Italian enterprise customers. The e-commerce cluster is anchored by Shoptet, acquired
      September 2025, providing cloud-based shop building, payments, logistics, and digital advertising with
      revenue exceeding €30M and 90%+ customer satisfaction in CEE; Shoptet Premium extends to enterprise
      merchants. The compliance SaaS cluster covers iubenda (GDPR/CCPA/LGPD privacy and cookie automation
      with ML-optimised consent banners) and consentmanager (cookie consent management). The marketing and
      sales SaaS cluster spans Metricool (2M+ users, €17M ARR, social media scheduling and ad management),
      Kolsquare (influencer marketing platform across 180+ countries, G2 4.6/5, B Corp), SimplyBook.me
      (AI-powered booking for service businesses), and Saleskit/Leadinfo (B2B data and AI-driven lead
      generation, acquired March 2026). AI-native products Macaly and Windsor.ai act as capability-layer
      products enabling cross-sell from the hosting base.
