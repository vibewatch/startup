  - id: infrastructure-stack
    title: Infrastructure and Technology Stack
    body: >-
      PHP is the central language of team.blue's hosting and SaaS stack. The January 2026 PHP Foundation
      Gold Sponsorship confirms PHP underpins shared hosting, Managed WordPress across Combell, Register.it,
      and TransIP, and several SaaS products. PHP Foundation-sponsored contributors delivered ~2,000 commits
      and 1,300 code reviews to PHP core in 2024 alone, with a 2025 collaboration with Anthropic and Symfony
      creating the official PHP SDK for the Model Context Protocol — extending PHP's relevance directly into
      team.blue's AI stack. Beyond PHP, team.blue (via Curanet, Proserve, and Combell) holds VMware Pinnacle
      Partner status, one of approximately 100 worldwide, enabling it to offer authorised VMware environments
      to IT resellers displaced by Broadcom's 2023 restructuring. Private Cloud migrations use certified
      datacentres (ISAE 3402, ISAE 3000, ISO 27001), with transition deadlines before April 2027.
      TransIP explicitly stores all customer data in the Netherlands, reflecting the group's data-sovereignty
      positioning; Windsor.ai operates within European data centres. W3Techs June 2026 data confirms WordPress
      at 43.5% of all websites, making it team.blue's single most important technology segment dependency.
      The key architectural gap is fragmentation: 60+ autonomously operating brands mean technology stacks
      vary across regions, with no public evidence of a shared API surface, unified authentication layer,
      or cross-brand SSO — creating integration complexity as the portfolio grows.
