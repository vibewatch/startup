  - id: ai-products
    title: AI Products, BlueAI Engine, and Roadmap
    body: >-
      team.blue's AI product strategy operates on three levels: a proprietary AI infrastructure platform
      (BlueAI), AI-native user-facing products, and AI-augmented internal workflows. BlueAI controls "the
      full AI stack, from infrastructure and GPU compute to models, APIs, and end-user features" — ensuring
      GDPR compliance and brand-level governance across all 60+ subsidiaries, per the official AI page.
      The April 2026 AI press release confirms 4,000+ employees using AI tools; the roadmap explicitly
      targets evolution toward "agentic systems that can act, learn, and improve autonomously." Macaly
      (acquired December 2025) allows entrepreneurs to build websites and apps by describing what they want
      in plain language using AI agents for design, backend setup, and SEO — rolling out across hosting brands
      in Europe as of Q1 2026. Windsor.ai (acquired January 2026) connects 330+ data sources to ChatGPT and
      Claude for natural-language business analytics while keeping all data in EU data centres. SimplyBook.me's
      Q1 2026 updates include an AI voice assistant for real-time booking, an AI social media assistant
      (Instagram, Facebook, WhatsApp), and an AI Help Centre assistant. iubenda uses ML to optimise cookie
      banner configurations and an AI accessibility widget for WCAG compliance. TransIP Managed WordPress
      features an AI Site Assistant with GPT Image 1 image generation and supports self-hosted AI apps on VPS
      (OpenWebUI, Ollama, n8n). Internally, BlueChat is team.blue's secure AI assistant; Kolega AI built on
      BlueChat delivered 20% productivity gains for new support agents and saves 10 hours per week on repeated
      questions, with 100% adoption among new support staff.
