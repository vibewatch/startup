  - id: developer-signals
    title: Developer Signals, Open-Source, and Community Engagement
    body: >-
      team.blue's developer-community engagement is materially evidenced by the PHP Foundation Gold Sponsorship
      (January 2026). Group CTO Kirk Barlow stated: "PHP sits at the core of our hosting and WordPress ecosystem,
      so we are proud to give back." The Foundation in 2024 delivered ~2,000 commits and 13 RFC proposals to PHP
      core; completed the first security audit of PHP core in over a decade; and released PIE (PHP Installer for
      Extensions). The Foundation's 2025 partnership with Anthropic and Symfony to create the official PHP SDK
      for the Model Context Protocol positions team.blue's stack for agentic AI use cases. The German
      government-backed Sovereign Tech Agency also invested in the Foundation in 2025 to modernise PHP's streams
      layer security. TransIP further demonstrates developer credentials by offering open-source AI app templates
      on VPS (OpenWebUI, Ollama, n8n) with "full control over data, workflows, and infrastructure." Kolsquare's
      G2 rating of 4.6/5 represents independently collected practitioner feedback from marketing professionals.
      W3Techs June 2026 data confirms WordPress — the platform underlying team.blue's Managed WordPress offerings
      — holds 43.5% global CMS market share, making it the single largest community technology dependency.
      team.blue's AI roadmap targets agentic systems — a signal of developer-community ambition beyond traditional
      hosting. The notable gap is the absence of a public GitHub presence, documented open APIs, or developer
      portal, unusual for a group of team.blue's scale.
