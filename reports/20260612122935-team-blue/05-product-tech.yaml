callouts:
  - calloutType: strength
    title: EU-Native Compliance Stack Creates Durable Cross-Sell Moat
    body: >-
      iubenda and consentmanager together offer multi-law GDPR/CCPA/LGPD/UK GDPR coverage with ML-optimised
      consent management — converting regulatory obligation into a value-adding upsell for team.blue's 3.3
      million hosting customers. As NIS2 (October 2024) and the EU AI Act (August 2024) expand compliance
      obligations, team.blue's compliance SaaS cluster is structurally positioned to benefit from regulatory
      tailwinds without competing on hosting price alone. The January 2026 PHP Foundation Gold Sponsorship
      also confirms a material open-source community investment supporting PHP's role in AI-native product
      development.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE032
      - CE016

  - calloutType: risk
    title: Unverified Security Certification Scope and Integration Opacity Are Material Risks
    body: >-
      ISO 27001 certification is confirmed only for VMware Private Cloud datacentres; no equivalent was found
      for one.com, Combell, 123-Reg, Register.it, or other core hosting brands serving 3.3 million SMBs.
      NIS2 readiness has not been addressed in any fetched source. Combined with the adverse customer review
      signal (one.com: 1.3/5 on SmartCustomer.com) and the entirely opaque BlueAI infrastructure dependency
      chain (GPU providers undisclosed), these gaps create material risk for enterprise hosting customers,
      regulated sectors, and diligence processes relying on independent security attestations.
    claimRefs:
      - CE025
      - CE034
      - CE035
      - CE007

