  - id: compliance-security
    title: Compliance, Security, and Data Residency Positioning
    body: >-
      Compliance and data residency are strategic differentiators for team.blue in the European SMB market,
      reinforced by GDPR (2018), NIS2 Directive (October 2024), and the EU AI Act (August 2024). The official
      AI page commits to GDPR and EU AI Act compliance across all AI systems, data protection by design and
      by default, responsible AI usage policies governing all 60+ brands, and secure governed AI deployment
      with "rigorous testing, real-time monitoring, and clear governance frameworks." iubenda covers GDPR,
      UK GDPR, CCPA, and LGPD with automated policy generation; consentmanager positions itself as the leading
      GDPR CMP. These two brands convert regulatory compliance from a cost into an upsell product within the
      hosting funnel. TransIP's Dutch-only data residency and Windsor.ai's European data centre commitment align
      with SMB demand: team.blue's 2025 Digital Maturity Report (8,000+ European companies) found 47% of SMBs
      trust AI less than human-led work, citing data security concerns. VMware Private Cloud datacentres carry
      ISAE 3402, ISAE 3000, and ISO 27001 certifications per the CTO-authored blog — the only confirmed
      ISO-scoped infrastructure certification in fetched sources. No ISO 27001 certificates were found for
      one.com, Combell, 123-Reg, Register.it, or other core hosting brands, creating a material diligence gap.
      ENISA's Cloud Cybersecurity analysis confirms ransomware targeting managed service providers and cloud
      infrastructure as a primary threat vector — directly relevant to team.blue's VMware co-location and
      shared-hosting operations.
