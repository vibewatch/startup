    enumerationScope:
      coverage: sample
      basis: >-
        Five public or recently-private European and US web hosting, domain, and website-builder
        companies selected as closest strategic and financial comparables to team.blue as of
        June 2026; covers the primary public market evidence base for SMB digital platform
        valuation benchmarking.
    rows:
      - - IONOS Group SE (Germany; Euronext Frankfurt)
        - "€1.316B (FY2025)"
        - "~40% (target)"
        - European SMB hosting, domains, cloud; web-presence and productivity focus
        - "~2–3× (estimated; based on IPO price €18.50/share ~€2.1B market cap vs. FY2025 revenue)"
        - Closest structural and geographic peer; also Hg's prior hosting investment (DADA)
        - Public market discount vs. private; IONOS includes public cloud (higher capex) not present in team.blue
      - - OVHcloud (France; Euronext Paris)
        - "€1,085M (FY2025)"
        - "40.4% (FY2025)"
        - European cloud hosting; public+private+web cloud; 1.6M customers globally
        - "~1–2× (estimated; public listing context implies compressed multiple for infrastructure player)"
        - Only European pure-play cloud provider at scale; EBITDA margin benchmark directly comparable
        - Vertically integrated (server manufacturing); higher capex than team.blue buy-and-build model
      - - "GoDaddy Inc. (USA; NYSE: GDDY)"
        - "~$4.5B (FY2024 est.)"
        - High (>30% est.)
        - US hosting, domains, websites; SMB-focused; primary US market
        - "~3–4× (estimated; large-cap US platform trades at premium to European hosting)"
        - Largest domain registrar globally; US market leadership benchmark
        - US vs. European market; much larger scale; GoDaddy is the market leader not a challenger
      - - "Wix.com Ltd. (Israel; NASDAQ: WIX)"
        - "~$1.6B (FY2023)"
        - Growing (approaching profitability)
        - Website builder SaaS; freemium + premium; 200M+ users globally
        - "~5–8× (estimated; SaaS premium for high-growth website builder platform)"
        - SaaS premium multiple benchmark; team.blue's SaaS additions (Metricool, Kolsquare) will attract similar premium if isolated
        - Freemium model differs from team.blue subscription; much larger global footprint; US-listed
      - - Squarespace (USA; taken private by Permira, Nov 2024)
        - "~$1.1B (FY2024 est.)"
        - "~20–25% (est.)"
        - Website builder and e-commerce; SMB and creator focus; US and EU markets
        - "~6× (est.; Permira private acquisition provided a private market comp for website builder platforms)"
        - Private market comparator at recent transaction; Permira is peer PE buyer to Hg in European context
        - US-focused; design-led differentiator differs from team.blue's acquisition-led pan-EU model
    notes: >-
      All EV/Revenue multiples are estimated and based on publicly available revenue data and
      approximate market capitalisation/deal valuations at or near recent reporting periods.
      IONOS and OVHcloud revenue figures are confirmed from their official investor relations pages.
