  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Disclosed revenue below floor
        - "Revenue disclosed at <€450M in any formal diligence review"
        - "Implied EV/Revenue >10×; far above IONOS and OVHcloud public comps at 2–4×; multiple unjustified"
        - Exit or decline the investment at €4.8B; negotiate lower entry price
      - - Leveraged loan covenant breach or distressed refinancing
        - Lenders force covenant cure, equity injection, or asset sales due to debt-service coverage shortfall
        - Confirms hidden leverage risk; equity recovery materially impaired; management distraction
        - Immediate diligence escalation on debt structure; exit if management does not disclose terms
      - - AI-driven customer attrition at core hosting brands
        - "Gross churn across core hosting brands exceeds 20% in any 12-month period post-AI-builder proliferation"
        - Revenue declines offset M&A accretion; ARPU erodes as free AI-powered website builders commoditise the market
        - Reassess growth trajectory; reduce valuation target; track IONOS and Wix for peer churn data
      - - Down-round at next financing event
        - "Next secondary or financing values team.blue at <€3.5B (>27% markdown from €4.8B)"
        - Confirms market view that the July 2024 mark was excessive; signals PE sponsor capital at risk
        - Immediate review of position; down-round likely triggers covenant discussions and governance changes
      - - Key leadership departure without succession
        - Jonas Dhaenens or Claudio Corbetta exits without named successor within 12 months
        - M&A flywheel loses its primary architect; cultural cohesion of 60+ brand ecosystem at risk
        - Request succession plan and governance structure clarification; monitor board composition
    notes: >-
      Triggers and thresholds are illustrative based on the evidence available as of June 2026.
      "Revenue disclosed" refers to any audited or management-confirmed figure shared in a formal
      due diligence context; public disclosure is not required to trigger the threshold.
