  - id: TV002
    title: Investment Thesis and Anti-Thesis
    columns:
      - Argument
      - Evidence
      - "What Would Change the View"
    rows:
      - - "THESIS: Platform scale justifies premium"
        - 3.3M SMBs, 22 countries, 60+ brands, 20-yr growth record, top-10 positions in 10 markets
        - Would weaken if disclosed revenue is below €500M or customer churn above 15% annually
      - - "THESIS: Recurring revenue model supports stability"
        - IONOS (closest peer) has ~80% recurring; team.blue business model structurally similar
        - Would weaken if disclosed NRR below 95% or hosting ARPU declining due to AI commoditisation
      - - "THESIS: Buy-and-build flywheel validated"
        - 8× return since 2019; 150+ M&A transactions; Loopia, Metricool, Shoptet show deal quality
        - Would weaken if integration costs are consuming more than 50% of acquisition EBITDA uplift
      - - "ANTI-THESIS: Valuation opaque and potentially stretched"
        - No revenue/EBITDA disclosure; EV/Revenue estimated at 7–12× vs. IONOS ~2–3×
        - Would strengthen if management accounts show revenue ≥€750M and EBITDA margin ≥37%
      - - "ANTI-THESIS: Leveraged debt stress confirmed"
        - Bloomberg (March 2026) confirms scrapped loan repricing; Dedalus parallel cited
        - Would resolve if debt fully refinanced with extended maturity and disclosed to investors
      - - "ANTI-THESIS: 2026 PE software exit environment frozen"
        - Hg Visma IPO delayed; EQT Thinkproject stalled; TA Associates Unit4 exit stalled
        - Would resolve if PE credit markets re-open in H2 2026 and software multiples stabilise
    notes: >-
      Anti-thesis arguments are based on third-party and adverse sources; thesis arguments are
      based on official company and investor sources which have an inherent confirming bias.
