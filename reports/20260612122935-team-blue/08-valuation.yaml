  - id: scenarios-sensitivity
    title: Bull / Base / Bear Scenarios and Valuation Sensitivity
    body: >-
      Three scenarios frame the range of outcomes for team.blue's equity value, each anchored to
      explicit assumptions about revenue scale, EBITDA margin, exit multiple, and leverage resolution.

      In the bull case, team.blue's revenue has grown to €800–900 million by FY2025 through the
      full integration of Loopia (12 months of contribution), Shoptet, and the SaaS acquisitions
      of 2024–2026. EBITDA margins approach 38–42% on the consolidated platform as central
      infrastructure and shared services reduce cost. A strategic buyer or 2027–2028 IPO achieves
      an EV/EBITDA multiple of 15–18× (justified by 70%+ recurring revenue and 10%+ CAGR), producing
      an enterprise value of €5.5–9 billion. Equity value depends on leverage resolution; in this
      scenario the leveraged debt is refinanced at scale, with net equity above the current €4.8
      billion mark.

      In the base case, team.blue has consolidated revenue of €550–700 million by FY2025. Margins
      are 30–37% (integration friction, continued M&A costs). Exit by 2027–2029 is achieved at
      8–10× EBITDA on €180–260 million EBITDA, producing an EV of €1.5–2.6 billion on EBITDA
      metrics — which, after netting substantial leveraged debt, may yield an equity value that
      approximates or slightly exceeds the €4.8 billion mark only if leverage is low relative to
      EV. This scenario underscores that without debt disclosure, equity value cannot be reliably
      assessed.

      In the bear case, revenue comes in at €400–500 million. AI disruption reduces ARPU across
      the core hosting base as free AI website builders commoditise the entry tier. The leveraged
      loan repricing failure signals that debt markets have re-priced the risk; covenant pressure
      forces operational cuts. A distressed secondary or delayed exit at 4–6× EBITDA produces an
      enterprise value of €800 million to €1.5 billion — potentially below the debt stack, leaving
      equity holders with a near-zero or negative return relative to the 2024 entry price.
