  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: >-
        Audited or management-confirmed revenue and EBITDA for FY2022–FY2025, with segment breakdown
        across core hosting, SaaS, e-commerce, and AI verticals.
      whyItMatters: >-
        The entire valuation multiple analysis rests on an estimated denominator (€400–700M revenue)
        that could be wrong in either direction; without confirmed revenue, the EV/Revenue or
        EV/EBITDA multiple cannot be validated and the "stretched vs. fair" judgement is speculative.
      diligencePath: >-
