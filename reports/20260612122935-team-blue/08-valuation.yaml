          note: "Far above IONOS public comp; implies implausible discount to peers"
        - label: "€400M (low estimate)"
          value: 12.0
          note: "High relative to any public hosting peer; requires exceptional margin proof"
        - label: "€500M (low-mid estimate)"
          value: 9.6
          note: "Elevated; possible with heavy SaaS mix premium at 35%+ margin"
        - label: "€600M (mid estimate)"
          value: 8.0
          note: "Stretched but approaching PE private-market precedent for buy-and-build platforms"
        - label: "€700M (high estimate)"
          value: 6.9
          note: "Reasonable if disclosed EBITDA margin is 35–40% with high recurring base"
        - label: "€800M (bull case)"
          value: 6.0
          note: "Aligned with Squarespace Permira acquisition range; fair for premium SMB platform"
    approximationNotes: >-
      Revenue figures are estimated; IONOS reference multiple is estimated from IPO price and
      FY2025 revenue. All values illustrative; no team.blue financials have been disclosed.
