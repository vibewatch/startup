  - id: exit-readiness-diligence
    title: Exit Readiness, Final Diligence Asks, and Thesis-Break Triggers
    body: >-
      team.blue's exit readiness is moderate. The company has the scale (3.3 million customers,
      22 countries, 60+ brands, €4.8 billion mark) to pursue an IPO on a European exchange or a
      secondary sale to a strategic or financial buyer. Hg's AUM of ~$70 billion and CPP's
      $632 billion fund both support long hold periods, suggesting there is no near-term forced
      sale pressure. However, the scrapped leveraged loan repricing in early 2026 indicates that
      the credit markets have become more discerning about European software PE assets, and any
      IPO would require full financial disclosure, which has not yet been tested with public
      investors.

      The six final diligence asks that would convert this recommendation from "track" to
      "investable at price" are: (1) audited revenue and EBITDA for FY2022–FY2025 with segment
      breakdown by hosting vs. SaaS vs. e-commerce; (2) gross and net revenue retention by
      brand cohort; (3) total debt quantum, tenor, interest rate (fixed/floating), covenant
      headroom, and the circumstances of the March 2026 repricing failure; (4) the waterfall
      and preference stack (whether CPP or Sofina hold liquidation preferences over founders
      or management); (5) the M&A integration roadmap — specifically which of the 8+ acquisitions
      in 2025 are fully integrated and which are still on separate platforms; and (6) IONOS-style
      KPI disclosure — domains under management, active customers per brand, monthly churn.
