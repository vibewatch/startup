callouts:
  - calloutType: risk
    title: Leverage Opacity Is the Single Largest Valuation Risk
    body: >-
      The March 2026 Bloomberg-sourced adverse report — that team.blue scrapped a leveraged loan
      repricing alongside Dedalus — is the single most material data point not captured in any
      official team.blue communication. At a €4.8 billion EV, even €500 million of net debt
      (a conservative assumption for a PE-backed buy-and-build platform of this scale) would
      reduce equity value to €4.3 billion — below the CPP entry mark if any deterioration in
      EBITDA occurs. The debt quantum, maturity profile, and covenant package must be the first
      diligence priority.
    claimRefs:
      - CV031
      - CV032
      - CV038

  - calloutType: assumption
    title: Revenue Estimate Carries Critical Low-Confidence Flag
    body: >-
      The €400–700 million estimated revenue range is constructed bottom-up from disclosed
      acquisition revenues (Loopia €65M FY2023, Shoptet >€30M, Metricool ARR €17M) plus an
      implied core-base revenue derived from customer count and IONOS ARPU benchmarking. This
      estimate has not been validated by any official source and could be materially wrong in
      either direction. All valuation multiples in this chapter are conditional on this unverified
      figure and should be treated as illustrative only.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013

