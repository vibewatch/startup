  - id: moat-durability-competitive-risk
    title: Moat Durability, Switching Costs, and Competitive Risk
    body: >-
      team.blue's competitive moat rests on four identifiable pillars. First, European geographic density:
      top-10 positions in 10 countries and 22 countries of active presence represent compounded brand
      recognition and distribution infrastructure that would take years and hundreds of millions of euros
      to replicate — IONOS is the only entity that has matched this density. Second, compliance SaaS
      bundling: iubenda's GDPR consent tooling and ConsentManager allow team.blue to bundle regulatory
      compliance into hosting plans at a price point SMBs cannot replicate through DIY tools, creating
      a recurring SaaS upsell flywheel that IONOS, OVHcloud, GoDaddy, and Wix do not replicate. Third,
      multi-year subscription lock-in: domain registrations, multi-year hosting contracts, and WordPress
      plugin ecosystems create switching friction; domain transfer takes days (low friction) but hosted
      workload migration takes weeks (high friction), meaning lock-in resides primarily in the hosting
      and SaaS layers. Fourth, proprietary M&A pipeline: team.blue's 150+ acquisition track record and
      integration playbook represent a capability moat, though this is PE-cycle-dependent and may not
      outlast the current investment cycle.

      Displacement risks are material. AI-first builders (Wix, Macaly, Hostinger AI) are commoditising
      the entry-level website creation experience, potentially bypassing the domain-then-hosting funnel
      that has historically been the SMB hosting on-ramp. The Bloomberg-sourced report from March 2026
      (cached at CBInsights) that team.blue scrapped a leveraged loan repricing deal signals capital
      structure pressure that could constrain M&A capacity — the primary growth lever — if credit markets
      tighten for PE software assets; Hg's postponement of the Visma IPO reinforces sector-wide caution.
      The adverse customer reviews for one.com (1.3/5 stars, SmartCustomer) highlight execution risk in
      brand integration: brands retaining poor satisfaction scores represent churn exposure when IONOS or
      Hostinger offer competitive renewal pricing. GoDaddy's decline from over 4% to 2.5% global hosting
      share (W3Techs June 2026) is the clearest historical precedent that even large-scale incumbents face
      structural erosion when low-cost challengers and AI builders improve their price-performance.
      Multi-homing is low-friction for domain registration but high-friction for hosted workloads, which
      is why the structural lock-in resides in the hosting and SaaS layers, not the domain layer.
