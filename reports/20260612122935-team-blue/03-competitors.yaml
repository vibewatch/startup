chapter:
  number: 3
  title: Competitors
  summary: >-
    team.blue's primary direct rival in the European SMB hosting market is IONOS Group (€1.316B FY2025
    revenue, 6.2M customers, 51% German market share, Frankfurt-listed), which outscales team.blue on
    customer count and has a public-company disclosure advantage. OVHcloud (€1.085B FY2025, Euronext)
    competes on cloud infrastructure and European data sovereignty. Global incumbent GoDaddy ($4.951B,
    NYSE) holds a European footprint through Host Europe Group and its sub-brands but is losing share
    to lower-cost challengers. Wix (4.3% global hosting share) and Squarespace (2.5%, taken private by
    Permira 2024) are the principal substitute competitors via the website-builder lens. team.blue's
    multi-brand, European-data-sovereignty, and compliance-SaaS-bundled model is defensible short-term
    but faces commoditisation pressure from AI-first builders and an opaque leveraged capital structure.

sections:
  - id: direct-incumbent-competitors
    title: Direct and Incumbent Competitors — IONOS and GoDaddy
    body: >-
      IONOS Group SE (Frankfurt: IOS1) is team.blue's clearest direct competitor and the only publicly
      listed European pure-play SMB hosting group. IONOS reported €1.316 billion in total revenue for
      FY2025, growing 5.5% year-over-year, with a medium-term CAGR target of approximately 10% and an
      EBITDA margin target of ~40%. The company serves 6.2 million customers across 17 markets in Europe
      and North America, manages 22 million registered domains (fourth-largest global domain registrar),
      and claims 51% web hosting market share in Germany — the most important single European SMB market
      — and 21% in Spain. IONOS describes itself as the "clear market leader of web hosting in Europe."
      Its product portfolio mirrors team.blue's across domains, shared hosting, managed WordPress,
      AI-based website builder (launched 2024), email, e-commerce, and cloud, including a "personal
      consultant" model that assigns a dedicated support agent to every customer. IONOS's equity story
      highlights approximately 80% recurring revenue, high cash conversion of approximately 90% of EBITDA,
      and low capex intensity — a financial profile structurally identical to what team.blue implicitly
      targets but cannot confirm because it discloses no financials. Where team.blue has the advantage is
      geographic breadth (22 countries vs 17 markets), the compliance and SaaS adjacency layer (iubenda,
      ConsentManager, SimplyBook.me, Metricool), and AI-enabled buy-and-build momentum (Macaly,
      Windsor.ai, Saleskit). IONOS's public-company status provides quarterly investor disclosure
      and competitive intelligence that team.blue cannot match as a private entity.

      GoDaddy Inc. (NYSE: GDDY) is the US-headquartered global incumbent with $4.951 billion in FY2025
      revenue and 20 million customers worldwide, managing 84 million+ domain names as the world's
      largest domain registrar. In Europe, GoDaddy's primary footprint is through Host Europe Group (HEG),
      acquired in 2017; HEG sub-brands include 123 Reg (UK), Domainfactory (Germany), and Host Europe.
      W3Techs June 2026 data shows GoDaddy Group at 2.5% global hosting share (GoDaddy proper 2.1%,
      Host Europe 13% of the GoDaddy Group figure, Domainfactory 4%, 123 Reg under 0.1%). Critically,
      123 Reg is a GoDaddy brand — not team.blue — having been acquired via HEG in 2017; its 2.1/5-star
      SmartCustomer review score reflects GoDaddy execution risk in the UK market, not team.blue's.
      GoDaddy's Airo AI suite is its primary product response to AI-powered builders. For team.blue,
      GoDaddy in Europe is a second-tier threat: its Continental European share is weaker than IONOS,
      and its English-language-centric support model limits trust-building with non-English SMBs.
