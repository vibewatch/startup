  evidenceGaps:
    - id: GP001
      description: >-
        team.blue revenue, EBITDA, ARPU, and gross margin have never been publicly disclosed, making
        it impossible to anchor the €4.8 billion valuation to a concrete revenue multiple or compare
        unit economics with IONOS (which reports quarterly).
      impact: high
      diligencePath: >-
        Request audited annual accounts from Combell Group NV; review Hg investor data room;
        compare with IONOS as the publicly disclosed comparable.

    - id: GP002
      description: >-
        Aruba S.p.A. revenue, customer count, and Italian market share are undisclosed (private company),
        making it impossible to assess team.blue's competitive position in Italy vs Register.it.
        Additionally, Squarespace's post-Permira financial trajectory and European strategy are
        undisclosed, limiting competitive assessment of that substitute threat in Continental Europe.
      impact: medium
      diligencePath: >-
        Request Register.it revenue and Italian market share from team.blue IR; cross-reference
        with Italian AGCOM or MISE filings if available. Monitor Squarespace press releases and
        Permira portfolio announcements for post-acquisition strategic direction.
      relatedQuestionRefs:
        - QP024

    - id: GP003
      description: >-
        Hostinger's European SMB-specific market share versus team.blue is not broken out geographically,
        making it unclear whether Hostinger is primarily stealing share in team.blue's core European
        markets or in lower-income global markets outside Europe. Additionally, team.blue does not
        publish any data sovereignty certifications comparable to OVHcloud's SecNumCloud, and no
        evidence of in-progress certification has been found.
      impact: medium
      diligencePath: >-
        Request Hostinger geographic revenue breakdown from public filings; cross-check with
        European ccTLD registration data from CENTR and EURid. Ask team.blue directly whether
        ISO 27701 or SecNumCloud certification is on the product roadmap.
      relatedQuestionRefs:
        - QP023

    - id: GP004
      description: >-
        The total quantum of team.blue's leveraged capital structure — outstanding debt, maturity
        profile, interest coverage, and covenant headroom — is not publicly disclosed despite the
        March 2026 Bloomberg report confirming the existence of leveraged loans.
      impact: high
      diligencePath: >-
        Request full debt schedule, EBITDA reconciliation, and covenant package from team.blue IR;
        review Combell Group NV Belgian statutory accounts for debt disclosures.

