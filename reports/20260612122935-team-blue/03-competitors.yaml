  - id: FP001
    title: Competitive Positioning Map — European SMB Hosting (Ordinal, June 2026)
    type: quadrant
    layout: wide
    summary: >-
      Ordinal positioning map plotting eight competitors on two axes derived from disclosed product
      portfolios and geographic footprints: (x) European geographic concentration (0=US/global-primary,
      10=European-only) and (y) SMB product-stack breadth (0=hosting-only, 10=full digital suite
      including compliance SaaS, social SaaS, and AI builder). Scores are ordinal proxies, not
      quantitative survey data. team.blue shown as reference point.
    data:
      points:
        - label: "team.blue (reference)"
          x: 9
          y: 9
          detail: "22 EU countries; 60+ brands; hosting + compliance SaaS + social SaaS + AI builder"
        - label: "IONOS Group"
          x: 8
          y: 7
          detail: "17 markets; 6.2M customers; hosting + builder + e-commerce; strong EU brand; no compliance SaaS"
        - label: "OVHcloud"
          x: 9
          y: 6
          detail: "France-founded; €1.085B revenue; infra-heavy; SecNumCloud; developer-skewed"
        - label: "Aruba"
          x: 9
          y: 5
          detail: "Italy-only moat; hosting + trust services (PEC, digital signatures); no pan-EU scale"
        - label: "Hostinger"
          x: 4
          y: 4
          detail: "Lithuanian-founded but globally scaled; price-driven; strong AI builder; no compliance SaaS"
        - label: "GoDaddy Group"
          x: 2
          y: 7
