summary:
  headline: >-
    team.blue 是欧洲资本最充足的 SMB 数字平台，买入整合飞轮已经跑通，也有一线 PE 背书；但财务完全不透明、杠杆贷款重定价失败，估值倍数还隐含较欧洲上市同行 3–5×
    的溢价，在债务结构和收入基数得到独立确认前，只能给到「观察」。
