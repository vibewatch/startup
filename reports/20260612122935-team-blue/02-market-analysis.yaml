  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - AI-powered website creation (Macaly, Wix AI, Hostinger AI Builder)
        - Driver
        - Current — accelerating 2026–2028
        - Reduces skill barrier; expands TAM to zero-code SMB buyers; increases new-account velocity
        - What % of new team.blue signups use AI-first onboarding? AI attach rate by brand?
      - - NIS2 Directive + GDPR enforcement (compliance SaaS mandate)
        - Driver
        - "Current; NIS2 transpose deadline Oct 2024; EC proposed amendments Jan 2026"
        - Creates recurring compliance SaaS spend (iubenda, ConsentManager) and managed-security hosting upsell
        - Track iubenda and ConsentManager ARR growth; measure compliance SaaS attach rate per hosting customer
      - - WordPress dominance (41.5% of all sites, 76.2% on WP v6)
        - Driver
        - "Stable 2024–2028"
        - Sustained demand for managed WordPress hosting; multi-year lock-in through plugin ecosystems
        - What % of team.blue hosted sites run WordPress? Managed WP ARPU vs. shared hosting ARPU?
      - - SMB internet penetration growth in Eastern/Southern Europe
        - Driver
        - "2024–2028 (Loopia expansion markets)"
        - Organic TAM expansion in underserved markets (Czechia, Slovakia, Serbia, Hungary, Bulgaria)
        - Monitor Loopia customer additions in CEE; compare against regional broadband penetration data
      - - IONOS 51% German market share concentration
        - Constraint
        - "Current — structural"
        - Limits team.blue SAM expansion in Germany without direct incumbent displacement; Germany is largest EU SMB market
        - What is team.blue's estimated German customer count and brand revenue? Can Combell/1blu compete?
      - - Customer satisfaction deficit at team.blue brands
        - Constraint
        - "Current — requires investment to reverse"
        - one.com (1.3/5 stars) and 123-Reg (2.1/5 stars) reviews signal churn risk and organic growth drag
        - Request NPS and churn rate by brand from team.blue; compare against IONOS and OVHcloud satisfaction benchmarks
      - - GoDaddy hosting share erosion (from 4%+ in 2019 to 2.5% in 2026)
        - Constraint
        - "2019–2026 trend — ongoing"
        - Demonstrates that scale does not prevent hosting share loss to freemium and budget challengers (Hostinger, Wix)
        - What is team.blue's net revenue retention? Is ARPU growing or is customer count the sole growth lever?
      - - SMB digital tool overwhelm (30% of SMBs unsure which tools to use)
        - Constraint
        - "Current — structural education gap"
        - Slows self-serve organic adoption; requires costly guided onboarding to convert and retain
        - Measure time-to-first-value and assisted-onboarding conversion rate across team.blue brand funnel
    notes: >-
      Drivers and constraints drawn from team.blue Digital Maturity Report (Nov 2025), IONOS
      equity story, W3Techs market share data (June 2026), EC NIS2 directive, and smartcustomer.com
      user reviews. Timing is qualitative; quantitative adoption-rate data for team.blue's specific
      brands is unavailable as team.blue does not publish brand-level operational metrics.
