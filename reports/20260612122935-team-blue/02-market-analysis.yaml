  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      Structural growth drivers for the European SMB digital-presence market include four
      identifiable near-term forces. First, AI-powered website creation is materially reducing
      the skill barrier to entry: Hostinger built 590,000 new websites using AI tools in H1 2024
      alone, and team.blue's Macaly product targets the same zero-code audience, while Wix and
      Squarespace embed AI generation across their builder products. Second, NIS2 (effective
      October 2024) and GDPR compliance mandates create recurring SaaS spend for consent
      management, privacy policies, and managed-security hosting; on January 20, 2026 the
      European Commission proposed NIS2 amendments specifically to ease compliance for 28,700
      companies including 6,200 micro and small enterprises, confirming regulatory compliance as
      an ongoing driver rather than a one-off event. Third, WordPress's continued dominance —
      41.5% of all global websites and Version 6 used by 76.2% of all WordPress installations
      as of June 2026 — sustains demand for managed WordPress hosting at scale. Fourth, the
      shift of Shopify to 5.2% global hosting market share (the top single provider by website
      count) illustrates a broader ecommerce-SaaS penetration trend that creates an adjacent
      TAM expansion opportunity for European operators. Adoption constraints are equally
      material: IONOS already holds 51% web hosting market share in Germany, the most important
      European SMB market, limiting incremental SAM penetration for team.blue without displacement
      of the incumbent. GoDaddy's hosting share declined from over 4% globally in 2019 to 2.5%
      in 2026, demonstrating that even large-scale incumbents face structural erosion when low-cost
      challengers (Hostinger) and builder-native platforms (Wix) improve their price-performance.
      Customer satisfaction reviews for key team.blue brands — one.com at 1.3 out of 5 stars
      and 123-Reg at 2.1 out of 5 stars on smartcustomer.com — represent a concrete retention
      risk that limits the organic growth runway absent service improvement.
    claimRefs:
