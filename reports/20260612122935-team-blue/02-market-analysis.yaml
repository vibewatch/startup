chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The European SMB web hosting, domain registration, website-builder, and ecommerce-enablement
    market is estimated at €4–6 billion (2025 proxy), anchored by IONOS Group's disclosed
    €1.316 billion revenue across 17 markets — the only publicly listed European pure-play
    benchmark. team.blue addresses this market through 60+ brands across 22 countries, facing
    IONOS (51% German market share), OVHcloud, Aruba, and US incumbents. AI-powered website
    creation and NIS2/GDPR compliance mandates are the strongest structural demand catalysts
    for 2026–2029, while customer satisfaction deficits at key team.blue brands represent a
    material retention constraint.

sections:
  - id: market-definition
    title: Market Definition, Scope, and Adjacencies
    body: >-
      The European SMB digital-presence market encompasses four commercially distinct but
      routinely bundled product layers: domain registration (typically €8–30 per domain
      per year), shared and managed web hosting (€3–25 per site per month), website-builder
      SaaS (€10–30 per month), and ecommerce-enablement platforms (€20–100 per month for
      SMB tiers). team.blue, IONOS Group, OVHcloud, Aruba, and a long tail of regional
      operators compete primarily in shared hosting and domain registration, where annual
      subscription economics and multi-year renewal cycles dominate. Included spend covers
      annual domain fees, managed WordPress, bundled hosting-and-email plans, and compliance
      SaaS (GDPR consent management, privacy policy generators, eIDAS trust services) sold
      to businesses with no dedicated IT department. Excluded are enterprise hyperscale cloud
      compute (AWS, Azure, GCP), colocation for large enterprises, large-scale Shopify Plus
      deployments for high-volume retailers, and DevOps-focused developer platforms (Vercel,
      Netlify, Railway). Adjacent markets that team.blue actively monetises but that fall
      outside the core hosting TAM include social-media analytics (Metricool), influencer
      marketing (Kolsquare), bookings SaaS (SimplyBook.me), and AI no-code app generation
      (Macaly). The status-quo substitute for a paid hosting subscription is either a freemium
      website-builder tier (Wix free plan, Webnode) or a dormant legacy shared-hosting account
      — both representing win-back and upsell opportunities. The European market is structurally
      differentiated from the US by language fragmentation across 20+ languages, GDPR and NIS2
      regulatory obligations, strong ccTLD identity (especially .de, .fr, .it, .nl), and SMB
      buyer preference for local-language support — factors that reduce portability for
      US-headquartered incumbents and reinforce the moat of European-first operators such as
      team.blue and IONOS.
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM006
      - CM007
    tableRefs:
      - TM001

  - id: market-sizing
    title: Market Sizing and Competitive Revenue Scale
    body: >-
      No authoritative third-party research on the European-only SMB hosting and digital-presence
      TAM was accessible during this research. The sizing below is constructed from multiple
      proxy lenses and should be treated as evidence-derived ranges rather than quoted market
      figures. The best anchor is IONOS Group — the only publicly listed pure-play European
      SMB hosting provider — which reported €1.316 billion in total revenue for 2025 across
      17 markets, growing 5.5% year-over-year with a medium-term 10% CAGR target. If IONOS
      holds approximately 20–30% of the broader European SMB hosting market (plausible given
      its claimed 51% German and 21% Spanish market positions), the total European SAM would
      lie in the €4–6 billion range, with an upside scenario including website-builder and
      ecommerce-SaaS adjacencies of €7–8 billion. The global web hosting market was projected
      at approximately $192.85 billion in 2025 growing at 19.7% CAGR to $355.81 billion by
      2029 — a figure encompassing hyperscale cloud and enterprise hosting alongside SMB shared
      hosting, and should not be used as a proxy for European SMB alone. For reference,
      GoDaddy — the US-headquartered global incumbent — reported $4.951 billion in 2025
      revenue, while Wix reported approximately $2 billion in its most recent period, both
      primarily reflecting non-European revenue. team.blue's SOM is bounded by its 3.3 million
      current customers versus IONOS's 6.2 million, suggesting roughly 35–45% of IONOS's
      customer reach — which at IONOS-equivalent ARPU would imply a SOM of €0.8–1.5 billion.
      All sizing estimates carry material uncertainty; the absence of a disclosed team.blue
      revenue figure is a blocking diligence gap that prevents anchoring the €4.8 billion
      valuation to a concrete multiple.
    claimRefs:
      - CM002
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
