  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      The European SMB hosting market resolves into five distinct buyer archetypes, each with
      a different adoption trigger, budget owner, and expansion path. The largest segment by
      volume is the micro-business or sole trader (0–9 employees) — the founding customer of
      every European hosting operator — where the owner-founder simultaneously plays buyer,
      user, and payer. This archetype is price-sensitive and activated by the need to establish
      a first professional web presence (domain plus email plus a basic site). The small
      business (10–49 employees) segment is more complex: the purchase decision may involve
      a part-time marketing or admin lead, and the trigger often comes from a rebrand, platform
      migration, or ecommerce launch. Freelancers and web designers represent a third archetype
      — they buy hosting primarily for client delivery and value reseller access, white-labelling,
      and bulk-domain pricing. Local merchants and physical retailers are an increasing target
      for ecommerce-enablement platforms (Shoptet, WooCommerce) rather than traditional shared
      hosting. Web agencies buy at scale through reseller programmes and drive disproportionate
      account value per customer. team.blue's Digital Maturity Report, based on 8,000+
      European companies across 30 countries, found that 30% of small businesses do not know
      which digital tools to use, 26% lack skills or confidence, and 1 in 5 cite time and
      resource constraints — validating the need for guided, bundled, and AI-simplified
      onboarding. IONOS serves 6.2 million customers spanning freelancers, SMBs, and
      enterprises across 17 markets, while OVHcloud's 1.5 million customers skew toward
      developers and sovereignty-conscious enterprise buyers, illustrating the segmentation
      divergence within the market.
    claimRefs:
