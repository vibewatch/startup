callouts:
  - calloutType: strength
    title: European Regulatory Complexity as Structural Moat
    body: >-
      NIS2, GDPR, and eIDAS create a compliance layer that US-headquartered providers struggle
      to navigate cost-effectively at the SMB level. team.blue's iubenda and ConsentManager brands
      sit directly inside this compliance SaaS demand, creating a bundling advantage that generic
      US hosting providers cannot easily replicate — and which is mandated by EU law rather than
      optional.
    claimRefs:
      - CM026
      - CM027
      - CM028

  - calloutType: risk
    title: Concentration Risk — IONOS Dominance in Germany
    body: >-
      IONOS holds 51% web hosting market share in Germany and 21% in Spain, the two largest
      markets in team.blue's 22-country footprint. Organic growth in these markets requires
      displacing an entrenched public-company incumbent with comparable product breadth and
      materially larger disclosed revenue (€1.316B vs. team.blue's undisclosed figure). This
      concentration risk limits how much of the estimated €4–6B SAM team.blue can realistically
      capture without margin-dilutive pricing.
    claimRefs:
      - CM008
      - CM010
      - CM014

  - calloutType: risk
    title: Customer Satisfaction Deficit at Key Brands
    body: >-
      Smartcustomer.com user reviews rate one.com at 1.3 out of 5 stars and 123-Reg at 2.1
      out of 5 stars — both team.blue subsidiary brands. In a market where switching cost
      is low (domain transfer takes hours), sustained service quality deficits translate
      directly into churn and negative word-of-mouth, undermining organic growth and
      increasing customer acquisition cost. Neither NPS nor churn rate data is publicly
      available for team.blue brands.
    claimRefs:
      - CM041
      - CM042
