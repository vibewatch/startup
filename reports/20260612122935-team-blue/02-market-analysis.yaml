  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: market-sizing
      missingEvidence: >-
        team.blue consolidated annual revenue, EBITDA, and ARPU for any fiscal year; no
        financial data has been publicly disclosed by the company or Hg Capital.
      whyItMatters: >-
        Without team.blue's revenue, the European SAM cannot be anchored to a confirmed
        market share, and the €4.8 billion valuation cannot be tied to a defensible revenue
        multiple. The sizing pyramid SOM is a proxy estimate only.
      diligencePath: >-
        Request audited consolidated financial statements in formal due diligence; compare
        against IONOS Group (€1.316B FY2025) and derive implied market share.
      relatedQuestionRefs:
        - QM001
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent, third-party research report on the European-only SMB web hosting
        and digital-presence market size; the SAM estimate is entirely proxy-derived.
      whyItMatters: >-
        The absence of an authoritative European SMB hosting TAM figure means that any
        valuation or market-share claim rests on a single public competitor's revenue and
        an assumed market share percentage — both of which could be materially wrong.
      diligencePath: >-
        Commission or purchase an IDC, Gartner, or IDATE DigiWorld research report on
        European web hosting and SMB SaaS spend; alternatively, use Eurostat enterprise
        ICT expenditure microdata (if accessible via authorised research portal).
      relatedQuestionRefs:
        - QM001
        - QM025
      relatedTableRefs:
        - TM002

    - type: access-blocked
      severity: material
      topic: market-sizing
      missingEvidence: >-
        EURid Annual Report 2025 numeric data: .eu domain count, growth rate, geographic
        distribution across Member States — page was JS-rendered and text was not
        accessible in the fetch.
      whyItMatters: >-
        .eu TLD data would provide a concrete bottom-up proxy for European digital-economy
        activity and ground the ccTLD market framing in the market definition table.
      diligencePath: >-
        Download EURid Annual Report 2025 PDF directly from eurid.eu; alternatively cite
        CENTR (Council of European National Top-Level Domain Registries) statistical portal.
      relatedQuestionRefs:
        - QM011
        - QM025
      relatedTableRefs:
        - TM001

    - type: missing-source
      severity: material
      topic: buyer-segmentation
      missingEvidence: >-
        Independent NPS, churn rate, and customer lifetime value data for team.blue brands;
        customer satisfaction is currently evidenced only from public review aggregators.
      whyItMatters: >-
        one.com and 123-Reg review scores of 1.3 and 2.1 out of 5 stars indicate retention
        risk, but without NPS or churn rate data the financial magnitude of the problem
        and trajectory are unknown.
      diligencePath: >-
        Request brand-level NPS survey results and rolling 12-month churn rate from team.blue
        in formal due diligence; compare against IONOS and Hostinger satisfaction benchmarks.
      relatedQuestionRefs:
        - QM023

    - type: missing-source
      severity: minor
      topic: pricing-comparison
      missingEvidence: >-
        Systematic price comparison data between European SMB hosting providers (IONOS,
        OVHcloud, team.blue brands) and US-headquartered incumbents (GoDaddy, Wix,
        Squarespace) on equivalent plan tiers.
      whyItMatters: >-
        Pricing comparison determines whether European providers compete on value or must
        accept ARPU compression to retain price-sensitive SMBs; GoDaddy's revenue growth
        despite declining market share suggests ARPU expansion, but European equivalents
        are unknown.
      diligencePath: >-
        Scrape current pricing pages for IONOS, OVHcloud, one.com, Combell, GoDaddy,
        and Wix for equivalent shared-hosting and domain bundles; model normalized
        cost per site per month across regions.
      relatedQuestionRefs:
        - QM012

    - type: private-evidence-only
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        OVHcloud FY2025 revenue; approximately €900M–1B is widely cited in secondary sources
        but OVHcloud's corporate investor relations subdomain was not accessible in this run.
      whyItMatters: >-
        A confirmed OVHcloud revenue figure would provide a second European anchor for the
        SAM proxy, reducing reliance on IONOS alone and triangulating the €4–6B range.
      diligencePath: >-
        Access OVHcloud's Euronext-listed annual report (ticker OVH.PA) or quarterly
        press releases at corporate.ovhcloud.com when accessible.
      relatedQuestionRefs:
        - QM001

