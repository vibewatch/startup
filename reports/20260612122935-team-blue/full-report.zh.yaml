      - number: '6.2'
        title: 采用轨迹与品牌层面证据
        blocks:
          - type: paragraph
            body: >-
              自 2019 年 6 月 Combell–TransIP 合并以来，team.blue 合并口径客户数持续增长：成立时为 1.2 million， 2024 年 5 月收购 Loopia Group 前达到
              2.5 million，收购 Loopia 后突破 3 million，并在 2024 年 7 月 CPP Investments 交易时稳定在 3.3 million；截至 2026 年 4
              月，这一数字在每份新闻稿中都被持续引用。team.blue 和 Hg Capital 将这条连续 20 年增长轨迹（从 Combell 1999 年创立算起）作为品类韧性和网络密度复利的证据；公司自 2019
              年以来已完成超过 150 笔收购。

              品牌层面的客户证据比集团合并标题数字更有信号价值。2024 年 9 月收购的 Metricool 加入时已有 2 million+ 用户和 €17M
              ARR，证明其在社交媒体管理中的产品驱动增长；Kolsquare 加入 team.blue 后 18 个月内，员工从约 35 人增至 140 人，并完成三笔收购， 验证了 team.blue
              的并购后加速逻辑。iubenda 的 150,000+ 合规客户（2024 年前收购）构成覆盖组合内所有网站和应用构建器的粘性横向层。 2025 年 9 月收购的 Shoptet 收入超过 €30M，拥有
              47,000+ 活跃店铺、90%+ 客户满意度，并每年处理 43 million 订单，是集团在原始客户数之外最强的客户参与度量化证据。123-reg 经营 25 年后托管 1.7 million
              个网站（英国市场），one.com 描述自己「二十年来服务数百万客户」——这些长寿证据支持订阅粘性说法，尽管独立评论证据（见第 4 节）显示投诉量并不低。 Saleskit 收购（2026 年 3 月，CEE
              B2B 销售情报）覆盖 3,000+ 客户和 25,000 用户，把 team.blue 触达延伸至 CEE B2B 销售工作流。2026
