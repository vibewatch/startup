        - 驱动
        - 当前 — 2026–2028 年加速
        - 降低技能门槛；把 TAM 扩到零代码 SMB 买方；推高新账户增速
        - team.blue 新注册中有多少比例使用 AI 优先引导流程？各品牌 AI 附加率是多少？
      - - NIS2 Directive + GDPR 执法（合规 SaaS 需求）
        - 驱动
        - 当前；NIS2 转置截止期为 2024 年 10 月；EC 2026 年 1 月提出修订
        - 拉动经常性合规 SaaS 支出（iubenda、ConsentManager），并推动托管安全主机加售
        - 跟踪 iubenda 和 ConsentManager ARR 增长；衡量每个主机客户的合规 SaaS 附加率
      - - WordPress 主导地位（占全部网站 41.5%，WP v6 占 WP 站点 76.2%）
        - 驱动
        - 2024–2028 年稳定
        - 托管 WordPress 主机需求持续；插件生态带来多年锁定
        - team.blue 托管网站中有多少比例运行 WordPress？托管 WP ARPU 与共享主机 ARPU 相比如何？
      - - 东欧 / 南欧 SMB 互联网渗透率提升
        - 驱动
        - 2024–2028 年（Loopia 扩张市场）
        - 未充分服务市场（捷克、斯洛伐克、塞尔维亚、匈牙利、保加利亚）自然扩张 TAM
        - 监测 Loopia 在 CEE 的客户新增；与区域宽带渗透率数据对比
      - - IONOS 德国市场 51% 份额集中
        - 约束
        - 当前 — 结构性
        - 德国是欧盟最大 SMB 市场；如果不能直接挤走在位者，team.blue 在德国扩张 SAM 会受限
        - team.blue 估计德国客户数和品牌收入是多少？Combell/1blu 能否竞争？
      - - team.blue 品牌客户满意度短板
        - 约束
        - 当前 — 需要投入扭转
        - one.com（1.3/5 星）和 123-Reg（2.1/5 星）评论显示流失风险和自然增长拖累
        - 向 team.blue 索取各品牌 NPS 和流失率；与 IONOS、OVHcloud 满意度基准对比
      - - GoDaddy 主机份额被侵蚀（从 2019 年 4%+ 降至 2026 年 2.5%）
        - 约束
        - 2019–2026 年趋势 — 持续中
        - 规模不能阻止主机份额流向 freemium 和低价挑战者（Hostinger、Wix），GoDaddy 已经证明这一点
        - team.blue 的净收入留存是多少？ARPU 在增长，还是客户数才是唯一增长杠杆？
      - - SMB 数字工具过载（30% SMB 不确定该用哪些工具）
        - 约束
        - 当前 — 结构性教育缺口
        - 拖慢自助式自然采用；要用成本较高的引导流程才能转化和留存
        - 衡量 team.blue 品牌漏斗里的首次价值实现时间和辅助引导转化率
    notes: >-
