      - number: '2.2'
        title: 市场规模与竞争收入体量
        blocks:
          - type: paragraph
            body: >-
              本研究未能获得关于欧洲本土 SMB 托管和数字存在 TAM 的权威第三方研究。下方规模测算由多个代理视角搭建，应视为证据推导的区间，而非引用的市场数字。最佳锚点是 IONOS Group——唯一上市的纯欧洲
              SMB 托管服务商——其 2025 年在 17 个市场报告总收入 €1.316 billion，同比增长 5.5%，中期 CAGR 目标 10%。如果 IONOS 持有更广义欧洲 SMB 托管市场约 20–30%
              份额（考虑其声称在德国 51%、西班牙 21% 的市场地位，这是合理假设），则欧洲总 SAM 将落在 €4–6 billion 区间；若纳入网站构建器和电商 SaaS 相邻领域，上行情境为 €7–8
              billion。全球网页托管市场预计 2025 年约 $192.85 billion，并以 19.7% CAGR 增至 2029 年 $355.81 billion——该数字把超大规模云、企业托管和 SMB
              共享托管都算在内，不应作为欧洲 SMB 单独市场的代理。作为参考，美国总部的全球既有巨头 GoDaddy 2025 年收入 $4.951 billion，Wix 最近期间收入约 $2
              billion，二者主要反映非欧洲收入。team.blue 的 SOM 上限由其当前 3.3 million 客户对比 IONOS 的 6.2 million 客户约束，意味着约为 IONOS 客户触达的
              35–45%；若套用 IONOS 等价 ARPU，则 SOM 约为 €0.8–1.5 billion。所有规模估计都存在重大不确定性；team.blue 未披露收入数字，是阻碍尽调的核心缺口，使 €4.8
              billion 估值无法锚定到具体倍数。
