  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与经常性收入结构
        blocks:
          - type: paragraph
            body: >-
              team.blue 主要通过向 22 个欧洲国家的 SMB
              和创业者销售经常性订阅来产生收入。核心订阅引擎覆盖四个产品族：（1）网页托管和共享基础设施服务（Combell、one.com、TransIP、Loopia、Register.it 以及 20
              多个其他品牌）；（2）域名注册和续费，集团管理数百万规模的域名组合，仅 Loopia 集群就约 2 million 个域名；（3）电商赋能（Shoptet 是锚点，2025 年 9 月收购时收入超过 €30
              million）；（4）不断增长的 SaaS 相邻层，覆盖在线合规（iubenda、ConsentManager）、社交媒体管理（Metricool，2024 年 9 月收购时 ARR
              €17M）、网红营销（Kolsquare）、在线预订（SimplyBook.me）、B2B 销售线索情报（Leadinfo、Saleskit）、AI
              网页应用构建（Macaly）和数据集成（Windsor.ai）。托管和域名订阅价格在各品牌网站公开（如
              one.com、TransIP、Register.it），从低个位数到中双位数欧元每月不等，形成可预测、低流失的经常性现金流。SaaS 产品每席价格更高，ARR 可见度也更强，Metricool 披露的 €17M
              ARR 就是证据。公司自称是「网页托管、域名、电商、在线合规、线索生成和其他 SaaS 解决方案的一站式伙伴」，并由 4,000+ 专家支撑；这描述了一种收入模型：把大众市场低 ARPU
              托管订阅，与通过买入并整合获得的高 ARPU SaaS 相邻产品混合起来。订阅业务收入通常按月或按年预收确认，再叠加多年域名续费，因此合约化、可见的前瞻收入占比高。IONOS 公开披露约 80% 经常性收入、约
              90% EBITDA 现金转化，是最接近的可比基准，说明 team.blue 以托管为中心的模型在经常性收入和现金流特征上结构相似，只是披露规模更小。
