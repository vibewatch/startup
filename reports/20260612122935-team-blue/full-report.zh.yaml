  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方 / 用户 / 付款方动态
        blocks:
          - type: paragraph
            body: >-
              team.blue 的 3.3 million 活跃客户以微型和小型企业为主：个体经营者、首次创业者、自由职业者，以及正在成长、需要低成本全托管数字存在但缺少技术能力的
              SMB。公司明确把这一群体视为核心客户，主要通过 60+ 托管和域名品牌服务，包括 one.com、TransIP、123-reg、Combell、Loopia、 Webnode、Register.it，以及覆盖
              22 个欧洲国家的十多个本地市场品牌。买方（付款者）和用户（运营网站者）通常是同一个人或没有专职 IT 职能的小团队；在绝大多数托管关系中，付款方也是用户。

              第二个独立客群是代理商和专业人士：网页设计师、数字营销代理商、社交媒体经理和影响者营销从业者。team.blue 自称生态系统中有约 30,000 家代理商，最直观体现在 Kolsquare（2,000+
              品牌和代理客户，包括 Coca-Cola、Netflix、Sony Music、Publicis、 Sézane、Sephora、Lush、Hermès）以及 Metricool（2M+
              用户，其中相当一部分是自由职业社媒经理和代理商）。在这个客群中，买方往往是代理商账户， 最终用户则是品牌团队或其签约运营方。

              第三个且正在扩大的客群是电商商户，由 Shoptet 覆盖（Czechia 和 Slovakia 47K 活跃店铺，收入超过 €30M），同时也部分来自提供 WooCommerce 或 Shopify
              邻接集成的托管品牌。服务型 SMB——美容院、医疗服务方、私人教练、教育辅导老师——构成第四个独立子群体， 由 SimplyBook.me 预约平台服务；多个具名案例展示了预约自动化和 no-show
              降低。合规客户——需要 GDPR/CCPA/LGPD 政策生成器的网站和应用——构成第五个横向客群， 由 iubenda 覆盖跨垂直和地域的 150,000+ 客户。team.blue 的 Digital
              Maturity Report 基于 8,000+ 欧洲公司， 将核心受众描述为被数字复杂度压住：30% 不知道该用哪些工具，26% 缺少数字技能；这正是 team.blue 简化、打包产品要解决的痛点。
