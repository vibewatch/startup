          value: 3.3M vs 6.2M (team.blue is 54% of IONOS count)
          detail: team.blue 3.3M 客户（2024 年 7 月 CPP 交易）；IONOS 6.2M 客户；约 2.9M 的差距代表有机增长和 M&A 跑道
