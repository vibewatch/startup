      - number: '6.4'
        title: 留存、满意度与反向客户信号
        blocks:
          - type: paragraph
            body: >-
              team.blue 生态中唯一公开披露的 NPS 数字是 Combell 的 76（2026 年 Q1 ESG impact report）；按 Combell 自身口径，这是高水平。
              本次研究审阅的新闻稿、投资者沟通或公开文件中，team.blue 或 Hg Capital 均未披露集团层面的 NRR、GRR、队列留存、流失率、
              平均合同期限或单客户收入。缺少这些数字是实质性尽调缺口，因为公司订阅驱动模型的耐久性无法被独立验证。

              对若干关键品牌，独立评论平台证据明显偏反向。SmartCustomer 在覆盖 2023–2025 年的大量评论中给 one.com 1.3 星（很低），
              反复出现的主题包括：合同期内任意涨价、因备份存储计量变化强制升级套餐、对未订购服务收费、取消流程被刻意设置阻力（要求打印并签署域名转移表），
              以及极其困难的域名转移流程；多名评论者称其为「有意为之」。SmartCustomer 给 123-reg 2.1 星，投诉涵盖升级期间电子邮件服务故障、 技术支持无响应和域名管理问题。HostAdvice 对
              one.com 的 2026 年专家评测更正面，认为平台速度快（100% GTmetrix 性能评分、 加载时间低于 600ms）且易用；这说明产品质量可能尚可，但商业和售后体验拉低了客户情绪。

              结构性含义是：team.blue 的订阅模型能对价格敏感型 SMB 形成较高初始转化，但提价做法可能损害留存；域名转移复杂度和官僚化取消流程形成锁定效应， 替代了真正由产品驱动的留存。Combell 的 76
              NPS 可能反映的是不同子群体（比利时市场、更成熟的 SMB 基础），不应外推到跨所有品牌和地域的 3.3 million 客户基础。未找到 one.com、123-reg、TransIP、Loopia
              或集团英国、荷兰、北欧业务中任何其他主要托管品牌的 NPS 数据。
