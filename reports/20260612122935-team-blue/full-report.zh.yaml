  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 收入（最新披露）
      - EBITDA 利润率
      - 市场细分
      - EV / Revenue（估算）
      - 与 team.blue 的相关性
      - 关键局限
    enumerationScope:
      coverage: sample
      basis: >-
        Five public or recently-private European and US web hosting, domain, and website-builder companies selected as
        closest strategic and financial comparables to team.blue as of June 2026; covers the primary public market
        evidence base for SMB digital platform valuation benchmarking.
    rows:
      - - IONOS Group SE（德国；Euronext Frankfurt）
        - €1.316B (FY2025)
        - ~40%（目标）
        - 欧洲 SMB 主机、域名、云；聚焦在线呈现和生产力
        - ~2–3×（估算；基于 IPO 价格 €18.50/股，约 €2.1B 市值，相对 FY2025 收入）
        - 结构和地域上最接近的同业；也是 Hg 过去的主机投资（DADA）
        - 公开市场相对私有市场有折价；IONOS 包含公有云（资本开支更高），team.blue 没有
      - - OVHcloud（法国；Euronext Paris）
        - €1,085M (FY2025)
        - 40.4% (FY2025)
        - 欧洲云主机；公有 + 私有 + Web 云；全球 1.6M 客户
        - ~1–2×（估算；上市背景意味着基础设施公司的倍数被压缩）
        - 欧洲唯一有规模的纯云提供商；EBITDA 利润率基准可直接比较
        - 垂直整合（服务器制造）；资本开支高于 team.blue 买入并整合模式
      - - 'GoDaddy Inc.（美国；NYSE: GDDY）'
        - ~$4.5B（FY2024 估算）
        - 高（>30% 估算）
        - 美国主机、域名、网站；聚焦 SMB；美国为主要市场
        - ~3–4×（估算；美国大盘平台相对欧洲主机有溢价）
        - 全球最大域名注册商；美国市场领导地位基准
        - 美国与欧洲市场差异；规模大得多；GoDaddy 是市场领导者，不是挑战者
      - - 'Wix.com Ltd.（以色列；NASDAQ: WIX）'
        - ~$1.6B (FY2023)
        - 增长中（接近盈利）
        - 网站构建器 SaaS；免费增值 + 付费；全球 200M+ 用户
        - ~5–8×（估算；高增长网站构建器平台享受 SaaS 溢价）
        - SaaS 溢价倍数基准；team.blue 的 SaaS 新增资产（Metricool、Kolsquare）若单独拆分，会吸引类似溢价
        - 免费增值模式不同于 team.blue 订阅；全球覆盖大得多；美国上市
      - - Squarespace（美国；2024 年 11 月被 Permira 私有化）
        - ~$1.1B（FY2024 估算）
        - ~20–25%（估算）
        - 网站构建器和电商；聚焦 SMB 和创作者；美国和欧盟市场
        - ~6×（估算；Permira 私有化收购为网站构建器平台提供了私有市场可比交易）
        - 近期交易中的私有市场可比对象；在欧洲语境下，Permira 是 Hg 的同业 PE 买方
        - 聚焦美国；设计驱动的差异化不同于 team.blue 收购驱动的泛欧模式
    notes: >-
      所有 EV/Revenue 倍数均为估算，基于公开可得的收入数据以及近期报告期附近的大致市值 / 交易估值。IONOS 和 OVHcloud 收入数字来自其官方投资者关系页面确认。GoDaddy 和 Wix
      的收入与倍数来自市场数据估算；未能从抓取到的 IR 页面确认（两者返回内容很少）。Squarespace 私有化价格来自一般市场报道估算。这些估算仅具指示性，可能不反映 2026 年 6 月时的交易倍数。
