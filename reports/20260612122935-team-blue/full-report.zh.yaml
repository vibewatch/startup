        - 高 — 增长引擎依赖收购；若失去 Hg 的 M&A 支持且没有替代方，战略会明显放缓
        - CPP Investments 和 Sofina 提供额外资本；管理层持股使领导团队利益一致
        - 中 — 多利益相关方结构降低单一赞助方风险，但 Hg 仍占主导地位
      - - 云基础设施 / 数据中心第三方供应商
        - 未披露（team.blue 未公开披露数据中心供应商名单）
        - 托管服务的物理基础设施；电力、制冷、连接
        - 未知 — 未披露具体数据中心伙伴；地域分布只能部分推断
        - 数据中心供应商故障、容量受限或不可抗力事件（火灾、洪水）
        - 高 — OVHcloud SBG2 火灾（2021 年）是欧洲托管基础设施的相关先例
        - 22 国运营暗示存在地域分布；未发现明确灾备承诺
        - 高 — 依赖第三方数据中心，且未公开认证韧性或地域冗余政策
      - - 信贷 / 杠杆贷款市场可得性
        - 机构信贷投资者（银团贷款市场）
        - 为持续 M&A 和现有杠杆收购债务再融资提供债务融资
        - 高 — PE 软件信贷轮动离开 SaaS（Bloomberg，2026 年 3 月）；team.blue 取消贷款重新定价
        - 信贷市场收紧使再融资成本高到难以承受，或根本无法完成；契约违约触发违约
        - 关键 — 契约违约或被迫去杠杆会叫停 M&A、压缩估值，并威胁运营连续性
        - CPP Investments 交易（2024 年 7 月）提供股权支持；高质量资产仍可进入信贷市场
        - 高 — 杠杆结构下债务到期结构未知，而 PE 软件信贷环境正在恶化
    approximationNotes: >-
      Dependency severity ratings reflect public disclosures and market precedents. team.blue does not disclose its full
      vendor stack, data-centre roster, or debt maturity schedule publicly.
    notes: 交易对手集中度估计基于公开披露；实际合同条款、供应商多元化和失效场景概率未经独立验证。
