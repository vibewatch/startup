companyProfile:
  summary: >-
    team.blue（法律根基：Combell Group NV）是一家总部位于比利时的私营技术平台，也是欧洲最大的私营 SMB 数字赋能商。Jonas Dhaenens 1999 年以比利时网页托管初创公司的形态创办
    Combell；此后，公司在 Waterland Private Equity 五年合作期内扩张，Hg Capital 于 2018 年 12 月接替 Waterland。2019 年 6 月，Combell 与 Ali
    Niknam 联合创办的 TransIP Group 合并，team.blue 由此成形；之后公司完成 150 多起收购，到 2024 年 7 月覆盖 22 个欧洲国家、服务 3.3 million 客户。关键收购包括 Loopia
    Group（2024 年 5 月，650,000 客户）、Metricool（2024 年 9 月，ARR €17M）、Shoptet（2025 年 9 月，收入 >€30M）、Macaly（2025 年 12 月）和
    Windsor.ai （2026 年 1 月）。CPP Investments 于 2024 年 7 月以 €4.8 billion 企业估值收购约 20% 股权——较 Hg 2019 年进入时实现 8 倍回报。集团 CEO
    Claudio Corbetta 领导业务；Jonas Dhaenens 担任总裁和基石股东。2026 年 3 月 Bloomberg
    报道，公司未能完成既有杠杆贷款的重新定价和展期，这是已披露风险中最重大的一个；它确认公司存在杠杆资本结构，但规模、期限和契约条款仍完全未披露。
