      - number: '7.4'
        title: 市场商品化、平台依赖与供应商栈风险
        blocks:
          - type: paragraph
            body: >-
              team.blue 的核心 SMB 主机和域名业务压在三层很深的平台依赖上：WordPress（W3Techs 2026 年 6 月数据，覆盖全球 43.9% 网站）、PHP（WordPress
              和多数共享主机栈的底层运行时）、VMware（Curanet、Proserve、Combell 交付托管基础设施服务时使用的虚拟化层）。每一层依赖都带来不同风险。

              WordPress/PHP 依赖：team.blue 2026 年 1 月以 Gold Sponsor（黄金赞助商）身份加入 PHP Foundation，等于确认 PHP 是其主机栈的底座。WordPress
              或 PHP 一旦出现重大漏洞、弃用路径，或敌意 fork，team.blue 可能要让 60+ 品牌同时紧急修复；PHP 大约支撑全球 75% 网站。WordPress 插件生态有 60,000+
              个插件，供应链攻击面很大，team.blue 和客户都无法在规模化条件下完全控制或审计。

              VMware/Broadcom 供应商重组风险：Broadcom 2023 年底完成收购 VMware 后，大幅重塑合作伙伴计划，许多合作伙伴失去直接交易权。team.blue 通过
              Curanet、Proserve、Combell 保住 VMware Pinnacle Partner 身份（全球约 100 家之一），可以成为被迁移伙伴的授权承接通道。这是一把双刃剑：team.blue
              现在暴露在 Broadcom 后续合作伙伴政策、许可证定价和支持质量之下。被迁移伙伴过渡协议 2027 年 4 月到期，team.blue 同时面对机会（整合伙伴工作负载）和风险（伙伴可能改迁
              KVM、Proxmox、Nutanix 等替代 hypervisor，而不是并入 team.blue 基础设施）。team.blue 自身分析曾确认，把迁移成本算进去后，没有替代 hypervisor
              能在成熟度、生态深度或运营稳定性上匹配 VMware；但 Broadcom 接手后 VMware 许可证价格上行，这一判断可能过时。

              AI-first 建站工具带来的市场商品化风险也很实在：Hostinger 的 AI builder 在 2024 年上半年新增 914,000 个网站中拿下 590,000 个；Wix 全球主机份额为
              4.3%；team.blue 自有 Macaly AI builder 面对的则是更成熟的 AI-native 平台，这些平台用户基数更大、开发历史更长、获客成本更低。最直接的上市可比公司 IONOS 目标是
              10% 收入 CAGR 和约 40% EBITDA 利润率，这意味着欧洲 SMB 主机市场会持续承受很强的价格纪律。
