      - number: '3.4'
        title: 护城河耐久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              team.blue 的竞争护城河建立在四根可识别支柱上。第一，欧洲地域密度：在 10 个国家位列前 10，并活跃于 22 个国家，代表多年积累的品牌认知和分销基础设施；复制它需要数年时间和数亿欧元，IONOS
              是唯一匹配这一密度的实体。第二，合规 SaaS 打包：iubenda 的 GDPR 同意工具和 ConsentManager 让 team.blue 能把监管合规打包进托管计划，价格点是 SMB 无法靠 DIY
              工具复制的，由此形成经常性 SaaS 向上销售飞轮；IONOS、OVHcloud、GoDaddy 和 Wix 都没有复制。第三，多年订阅锁定：域名注册、多年托管合同和 WordPress
              插件生态会制造切换摩擦；域名转移耗时数天（低摩擦），但托管工作负载迁移需要数周（高摩擦），意味着锁定主要存在于托管和 SaaS 层，而非域名层。第四，专有 M&A 管线：team.blue 的 150+
              收购记录和整合打法构成能力护城河，尽管它依赖 PE 周期，未必能延续到当前投资周期之后。

              被替代风险也很重大。AI 优先构建器（Wix、Macaly、Hostinger AI）正在把入门级网站创建体验商品化，可能绕过历史上 SMB 托管的「先域名、再托管」入口。2026 年 3 月来自
              Bloomberg、由 CBInsights 缓存的报道称，team.blue 取消杠杆贷款重新定价交易，显示资本结构承压；如果信贷市场收紧 PE 软件资产，M&A 能力这个主要增长杠杆可能受限；Hg 推迟
              Visma IPO 也强化了全行业谨慎。one.com 的负面客户评价（1.3/5 星，SmartCustomer）凸显品牌整合中的执行风险：如果品牌满意度评分持续低迷，当 IONOS 或 Hostinger
              提供有竞争力的续约价格时，就会暴露流失风险。GoDaddy 全球托管份额从超过 4% 下滑到 2.5%（W3Techs 2026 年 6 月），是最清晰的历史先例：低成本挑战者和 AI
              构建器提升性价比后，即使大规模既有巨头也会遭遇结构性侵蚀。域名注册的多归属摩擦低，但托管工作负载摩擦高，因此结构性锁定在托管和 SaaS 层，而不在域名层。
