      - number: '1.2'
        title: 创立历史、增长路径与 M&A 策略
        blocks:
          - type: paragraph
            body: >-
              Jonas Dhaenens 1999 年 16 岁时创办 Combell，从零在比利时搭起网页托管业务。经过二十年的内生增长和收购扩张——其中包括约 2013 年开始与 Waterland Private
              Equity 合作，业务扩张超过 10 倍并完成 17 起补强收购——Hg Capital 于 2018 年 12 月接替 Waterland。Hg 进入当时的 Combell
              Group，被描述为其在技术服务领域的第 8 笔投资。战略拐点出现在 2019 年 6 月 12 日：Combell 与 TransIP Group 合并，成立 team.blue；TransIP Group 由
              Ali Niknam 创办，他也创办了欧洲新银行 bunq。合并后实体最初服务五个国家的 1.2 million 客户。新公司采用泛欧洲买入并整合模式：2019 至 2026 年，Jonas Dhaenens
              亲自带队完成 150 多起 M&A 交易。关键收购包括 Zitcom（2017 年，合并前，丹麦市场领导者）、Register Group（意大利，2019 年）、Loopia Group（瑞典 / 芬兰 /
              斯洛伐克 / 捷克 / 匈牙利 / 塞尔维亚，650,000 客户，2024 年 5 月）、Metricool（社交媒体 SaaS，ARR €17M，2024 年 9 月）、Kolsquare（网红营销，2024
              年 Q4）、Shoptet（电商平台，收入 >€30M，300 多名专家，2025 年 9 月）、Macaly（AI 无代码构建器，2025 年 12 月）、Windsor.ai（数据集成，2026 年 1
              月）和 Saleskit（B2B 销售工具，2026 年）。Loopia 收购把客户基础从 2.5 million 推高到 3 million 以上。Hg 还在 2022 年 7 月追加投资，用于产品扩张和欧洲
              M&A；仅 2022 年，Hg Capital Trust 所持 team.blue 股权的投资价值就上升 £16.4 million。2025 年 9 月 Shoptet 交易时，team.blue
              的专家人数被描述为 3,600+，显示收购推动员工规模快速增长。2026 年 3 月一篇来自 Bloomberg、由 CBInsights 缓存的报道披露，team.blue
              取消了一项原计划分两部分修订、展期并重新定价既有杠杆贷款的交易，说明公司存在重大杠杆资本结构，但公司并未公开披露。研究期间审阅的任何 team.blue 或 Hg 新闻稿、监管文件，都没有披露收入或
              EBITDA。
