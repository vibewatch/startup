  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合规风险——GDPR、NIS2、Data Act 与 AI Act
        blocks:
          - type: paragraph
            body: >-
              team.blue 在 22 个 EU 和 EEA 国家拥有 3.3 million SMB 客户，明确落入欧洲所有主要数字监管范围。GDPR（Regulation (EU) 2016/679）自 2018 年
              5 月起全面可执行；team.blue 作为客户个人数据的处理者和控制者，处理计费记录、网站内容、 电子邮件元数据和营销画像，因此既承担直接 GDPR
              责任（处理者义务），也承担影响终端客户的数据泄露间接责任。GDPR Article 83 对最严重违规的处罚最高可达 €20 million 或全球年营业额 4%，取较高者。公司为数百万 SMB
              处理数据，横跨执行力度差异很大的国家监管机构辖区。 team.blue 隐私政策确认数据存储在欧洲数据中心，并承诺按 GDPR 合规处理，但未发布对该承诺的独立审计或认证。

              NIS2（Directive (EU) 2022/2555）自 2024 年 10 月 18 日起取代 NIS1，并明确覆盖数字基础设施提供商、DNS 服务提供商、
              顶级域名注册机构和云计算服务提供商。team.blue 运营域名注册、共享托管和云基础设施，在多个成员国可被归为 NIS2 下的「基本实体」或「重要实体」。截至 2026 年 1 月，European
              Commission 已提议对 NIS2 做定向修订，以提高法律清晰度， 简化方案也在推进中。NIS2 要求风险管理措施、发现后 24
              小时内事件报告、董事会层面的网络安全问责，以及供应链安全。不合规可对重要实体处以最高 €10 million 或全球营业额 2% 的罚款，对 essential entities 也最高 €10 million
              或 2%；实际处罚由各国主管机构执行， 而各国落地速度不一。Data Act（Regulation (EU) 2023/2854）于 2025 年 9 月 12 日开始适用；其数据可携带性和云切换义务直接影响
              team.blue 作为云服务提供商的业务，其禁止不公平合同条款的规定也约束客户所报告的增购和锁定做法。EU AI Act（Regulation (EU) 2024/1689）在 2026 年 5
              月就简化实施达成政治协议后，将适用于已集成到 team.blue 产品栈的 AI 系统——Macaly（AI 建站工具）、 Windsor.ai（数据集成）和 AI 驱动的支持工具。AI Act
              合规，包括任何高风险用例的一致性评估，会带来增量合规成本和潜在产品重设计风险。
