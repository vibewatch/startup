      - number: '4.2'
        title: 已披露财务信号与 M&A 收入贡献
        blocks:
          - type: paragraph
            body: >-
              team.blue 从未发布披露集团层面收入、EBITDA、净利润或债务的新闻稿或监管文件。因此，所有财务情报都必须从交易周边披露和被收购实体收入数字拼起来。最关键的单一数据点，是 2024 年 7 月 CPP
              Investments 交易确定的 €4.8 billion 企业估值；新闻稿明确称其代表「自 Hg 2019 年首次投资以来增长 8 倍」。Hg 的投资始于 2018 年 12 月接替 Waterland 入主
              Combell Group；2019 年 6 月 Combell-TransIP 合并后，team.blue 约有 1.2 million 客户。如果 8× 增长适用于企业价值，且 2019 年创立时 EV 约为
              €600M（与合并成形时 Combell + TransIP 的规模一致），则 2024 年 7 月 €4.8B 正好是 8×。被收购实体收入披露提供了最细的财务证据：Loopia Group 报告 2023
              年收入 742 MSEK（按期内平均汇率约 €65M）；Shoptet 2025 年 9 月收购时收入「远超 €30M」；Metricool 2024 年 9 月收购时 ARR €17M；Saleskit 在
              CEE 服务 3,000+ 客户和 25,000+ 用户。2018 年 12 月 Hg/Waterland 交接时，Waterland 称其五年内通过 17 起补强收购把 Combell 做大「超过 10
              倍」；创立新闻稿则把合并实体描述为拥有 1.2 million 客户的「一站式伙伴」。到 2026 年初，team.blue 员工达到 4,000+ 专家，高于 2024 年 7 月的 2,500 人和 2024
              年 5 月 Loopia 收购完成时的 2,700 人。Hg Capital Trust 报告，仅 2022 年其 team.blue 投资价值就增加 £16.4
              million，确认股权继续升值，但未披露绝对金额。Linklaters 将 CPP 投资描述为收购「约 20% 股权」——意味着 CPP 在 €4.8B 估值下的进入价格约 €960M——同时 Hg
              保留最大单一投资人地位。Hg 投入的总股本金，以及资本结构中的债务 / 股权拆分，均未披露。基于客户数（3.3M）和从 Loopia（742 MSEK / 650K 客户 ≈ 每客户每年 €100）与
              IONOS（€1.316B / 6.2M 客户 ≈ 每客户每年 €212）对标得出的混合 ARPU，自下而上估算 team.blue 的混合 ARPU 可能为每客户每年 €130–200；考虑其低 ARPU
              CEE 市场和高 ARPU 西欧品牌的组合，对应估计收入区间为 €430–660M。
