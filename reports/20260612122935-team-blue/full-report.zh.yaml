      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与估值敏感性
        blocks:
          - type: paragraph
            body: >-
              三个情景框定 team.blue 股权价值的可能结果，每个情景都锚定收入规模、EBITDA 利润率、退出倍数和杠杆解决路径的明确假设。

              乐观情景下，team.blue 到 FY2025 收入已增至 €800–900 million，驱动因素包括 Loopia 完整并表（12 个月贡献）、Shoptet，以及 2024–2026 年 SaaS
              收购。随着中心基础设施和共享服务降低成本，合并平台 EBITDA 利润率接近 38–42%。战略买方或 2027–2028 年 IPO 能实现 15–18× EV/EBITDA 倍数（由 70%+ 经常性收入和
              10%+ CAGR 支撑），对应企业价值 €5.5–9 billion。股权价值取决于杠杆如何解决；在这一情景中，杠杆债务可按规模再融资，净股权价值高于当前 €4.8 billion 估值。

              基准情景下，team.blue 到 FY2025 合并收入为 €550–700 million。利润率为 30–37%（整合摩擦、持续 M&A 成本）。2027–2029 年按 €180–260 million
              EBITDA、8–10× EBITDA 退出，对应 EV €1.5–2.6 billion；扣除大量杠杆债务后，只有当杠杆相对 EV 较低时，股权价值才可能接近或略高于 €4.8 billion
              估值。该情景强调，在没有债务披露时，股权价值无法可靠评估。

              悲观情景下，收入落在 €400–500 million。免费 AI 建站工具把入门层商品化，AI 冲击压低核心主机客户基数的
              ARPU。杠杆贷款重新定价失败说明债务市场已重新定价风险；契约压力迫使公司削减运营。若以受压老股交易或延迟退出、4–6× EBITDA 定价，企业价值只有 €800 million 至 €1.5
              billion——可能低于债务堆栈，使股权持有人相对 2024 年入场价接近零回报或负回报。
