    sections:
      - number: '2.1'
        title: 市场定义、范围与相邻领域
        blocks:
          - type: paragraph
            body: >-
              欧洲 SMB 数字存在市场包含四个商业上不同但经常打包销售的产品层：域名注册（通常每域名每年 €8–30）、共享和托管式网页托管（每站点每月 €3–25）、网站构建器 SaaS（每月
              €10–30）以及电商赋能平台（SMB 档位每月 €20–100）。team.blue、IONOS Group、OVHcloud、Aruba
              和大量区域运营商主要在共享托管和域名注册领域竞争，这里由年度订阅经济和多年续约周期主导。纳入的支出包括年度域名费用、托管式 WordPress、打包的托管与电子邮件计划，以及卖给没有专职 IT 部门企业的合规
              SaaS（GDPR 同意管理、隐私政策生成器、eIDAS 信任服务）。排除的是企业级超大规模云计算（AWS、Azure、GCP）、大型企业托管机房、大型高客单零售商的 Shopify Plus 部署，以及面向
              DevOps 开发者的平台（Vercel、Netlify、Railway）。team.blue 主动变现但位于核心托管 TAM
              之外的相邻市场包括社交媒体分析（Metricool）、网红营销（Kolsquare）、预订 SaaS（SimplyBook.me）和 AI
              无代码应用生成（Macaly）。付费托管订阅的现状替代品，要么是免费增值的网站构建器档位（Wix
              免费计划、Webnode），要么是休眠的旧共享托管账户——二者都代表赢回和向上销售机会。欧洲市场与美国存在结构性差异：20 多种语言造成碎片化，GDPR 和 NIS2 监管义务，强 ccTLD 身份（尤其
              .de、.fr、.it、.nl），以及 SMB 买家偏好本地语言支持——这些因素降低美国总部玩家的可迁移性，并强化 team.blue、IONOS 等欧洲优先运营商的护城河。
