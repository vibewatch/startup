      - number: '4.4'
        title: 资本结构、杠杆不透明性与融资风险
        blocks:
          - type: paragraph
            body: >-
              对任何承销判断而言，team.blue 资本结构都是最关键、却未披露的财务变量。公司由 PE 支持，Hg Capital 自 2018 年 12 月起是主要且最大投资方，CPP Investments 自
              2024 年 7 月起持股约 20%，Sofina 自 2024 年 7 月 22 日起成为少数股权共同投资方。Jonas Dhaenens 和 Ali Niknam 仍是基石股权投资人。杠杆贷款工具的存在，已由
              2026 年 3 月 23 日 Bloomberg 报道确认；该报道由 CBInsights 缓存，披露 team.blue「取消了原计划分两步修改、延长并重定价现有贷款的交易」。报道同时提到德国医疗软件公司
              Dedalus 因投资者不安升温而暂停 €1.3 billion 杠杆贷款，说明 team.blue 也是遭遇信贷市场阻力的欧洲软件 PE 资产之一。报道把更广泛的交易市场紧张归因于 AI 扰动背景下投资者对软件
              / SaaS 估值的担忧，并指出「包括 Triton Partners、Warburg Pincus 和 Brookfield 在内的公司一直在募集新基金」投向非软件资产。再定价失败说明，2026 年 3
              月贷款人或投资者要求的条款 team.blue 无法接受；但债务总额、现有利率、到期日以及任何契约阈值仍完全未披露。team.blue 这种规模的 PE 平台型公司， 收购时通常背负 4–7× 净债务 /
              EBITDA，并在组建和每次 secondary 时再融资。Hg 自称其组合公司「收入每年持续增长超过 20%」。若 team.blue 的 EBITDA 位于 €190–270M 区间，杠杆为 4–6×
              EBITDA，总债务可能达到 €760M–€1.6B。再定价失败表明，现有贷款条款含有再定价溢价或契约结构，在 2026 年 3 月的信贷环境下变得吃力； 但公开信息并未确认违约、违约事件或契约违规。未发现
              Moody's、S&P 或 Fitch 的公开评级。team.blue 是在比利时注册的私营实体， 没有持续性的欧盟或国家层面财务报告义务会强制其披露。2024 年 8 月 CPP 和 Sofina
              两笔交易均需各自辖区监管批准， 但无需、也未发布详细财务披露。CPP 交易发生时，Hg 管理的 AUM 约 $70 billion，足以在基金层面支持 team.blue；
              但基金层面的流动性不能消除实体层面的再融资风险，尤其是在杠杆贷款市场走软时。
