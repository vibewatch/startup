chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、市场地位与商业模式
        blocks:
          - type: paragraph
            body: >-
              team.blue（法律根基：Combell Group NV）是一家总部位于比利时的私营技术平台，对外定位为「欧洲 SMB 的 #1 数字成功平台」。公司运营 60
              多个品牌，横跨网页托管、域名注册、电商赋能、在线合规 SaaS、社交媒体管理、网红营销和 AI 驱动的网站搭建。截至 2024 年 7 月，team.blue 服务 22 个欧洲国家的 3.3 million
              SMB 客户——奥地利、比利时、保加利亚、塞浦路斯、捷克、丹麦、芬兰、法国、德国、希腊、匈牙利、爱尔兰、意大利、荷兰、葡萄牙、塞尔维亚、斯洛伐克、西班牙、瑞典、瑞士、土耳其和英国——并在其中 10
              个国家跻身市场前 10。到 2026 年初，公司称员工超过 4,000 名专家，高于 2024 年 7 月交易时的 2,500 人，反映 M&A 活跃。商业模式由订阅驱动：客户为托管、域名、电子邮件和 SaaS
              附加产品支付经常性费用，平台再把自研或通过买入并整合策略收购的合规、分析和 AI 工具交叉销售给客户。PHP 支撑全球约 75% 的网站，也是 team.blue 在 Combell、Register.it 和
              TransIP 的共享托管栈和 WordPress 平台基础。公司于 2026 年 1 月以 Gold Sponsor 身份加入 PHP Foundation，确认其开源基础设施依赖和社区参与。自 2024 年
              7 月 CPP Investments 交易以来，team.blue 持续表述的愿景是「借助 AI 的智能，让在线商业成功在每一步都更简单」；最新补入的 AI 能力是 Macaly（AI
              无代码应用构建器，2025 年 12 月收购）和 Windsor.ai（数据集成，2026 年 1 月收购）。
