      - - 杠杆债务契约违约或到期悬崖
        - Bloomberg/Reuters 关于 team.blue 债务的信贷市场报道；Combell Group NV 法定账目
        - 任何进一步确认的贷款重新定价失败、契约豁免，或以惩罚性定价延长期限
        - 立即重估；暂停新并购；向 IR 索取债务时间表；若再融资全成本 >10%，考虑投资逻辑破裂
      - - 任何国家主管机关采取 NIS2 执法行动
        - ENISA、各国主管机关公告、媒体报道
        - 22 个运营国家中任何 NIS2 执法行动、罚款或强制整改令
        - 若反复出现则触发投资逻辑破裂；建模法律成本和运营扰动情景；评估系统性合规状态
      - - 任何 team.blue AI 产品被 AI Act 列为高风险
        - 欧盟 AI Act 监管指引、公告机构决定、EC AI Service Desk 公告
        - Macaly、Windsor.ai 或任何 team.blue AI 功能被列为高风险，需要做合规性评估
        - 产品重设计成本；合规时间延迟；欧盟内可能暂停功能；评估收入影响
      - - Combell（主要锚定品牌）NPS 或满意度崩塌
        - 管理层报告、Combell 品牌的 Trustpilot/SmartCustomer/G2 评价
        - Combell NPS 低于 50，或 SmartCustomer 评分低于 3/5
        - 最高收入品牌的客户留存风险上升；尽调竞争替代情况
      - - Hg Capital 退出或降低多数股权
        - Hg Capital 投资者报告、新闻公告、Companies House / 比利时公司注册处
        - 任何 Hg 二级出售、IPO 申报，或确认启动 team.blue 股权退出流程
        - 管理层连续性风险；收购节奏可能放慢；新所有者战略不确定；重新承销投资逻辑
    approximationNotes: >-
      Kill criteria are defined based on observable market events and regulatory outcomes. Monitoring requires access to
      credit-market databases, regulatory announcement feeds, and team.blue management reporting that is not publicly
      available.
    notes: 监控指标设计为可通过公共渠道观察（Bloomberg、ENISA 公告、公司注册处）；内部契约和 NPS 阈值需要 IR 权限。
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 证据基础
    rows:
      - - 建议
        - 继续研究 / 跟踪
        - 收入、EBITDA 和债务未披露；无法验证倍数
      - - 置信度
        - 低
        - 没有财务披露；€4.8bn 标记的分母只是估算
      - - 风险评级
        - 高
        - 杠杆不透明、AI 冲击、2026 年 PE 软件退出冻结
      - - 估值立场
        - 披露前偏高至合理
        - 收入 ≤€550M 时偏高（12×+）；只有收入 ≥€750M 且 EBITDA 利润率 ≥37% 时才合理
      - - 决策含义
        - 没有财务披露和债务审查，不应按 €4.8bn 投资
        - Linklaters 确认 €4.8bn 交易；Bloomberg 确认杠杆债务不透明
    notes: 评估基于估算收入区间 €400–700M（低置信度）；若管理账目显示收入高于 €750M 且 EBITDA 利润率 37%+，该估值标记可能站得住。
