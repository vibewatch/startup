      - number: '7.2'
        title: 网络安全、基础设施与运营风险
        blocks:
          - type: paragraph
            body: >-
              ENISA 年度 Threat Landscape 报告（2024）将可用性威胁列为欧盟网络安全首要威胁，其次是勒索软件和数据威胁。ENISA 2025 Threat Landscape
              确认，威胁组织正在复用工具和技术，更快利用漏洞，并协作攻击欧洲数字基础设施，且越来越聚焦云和托管提供商。 对 team.blue 而言，60+ 品牌横跨 22
              个国家运营，每个品牌都有独立托管基础设施、域名系统和客户数据库；攻击面明显宽于单品牌运营商。 ENISA
              的云网络安全市场分析（2023）强调，共享基础设施栈存在集中风险，且许多在欧盟市场运营的云服务提供商没有强制性安全认证。

              2021 年 3 月 OVHcloud Strasbourg SBG2 数据中心火灾，仍是欧洲云运营商灾难性单站点风险最清楚的先例：SBG2 被摧毁，SBG1
              部分被毁，缺少异地备份的客户遭遇不可逆数据丢失。team.blue 未发布等同 ISO 22301 的数据中心认证或业务连续性框架；其 60+ 品牌中， 也没有任何品牌的备份与恢复 SLA
              获得公开独立验证。ENISA 数据显示，由于多租户托管环境汇聚高价值客户数据，欧洲托管和 SMB 云提供商正被勒索软件组织主动瞄准 （ENISA ransomware landscape，2025
              更新）。若集团规模的勒索软件或 DDoS 攻击成功，同时中断数百万 SMB 的托管、电子邮件和 DNS， 可能触发 NIS2 强制事件报告、声誉损害，并导致切换成本低、价格敏感客户大规模流失。team.blue
              的法律与安全页面提到组合内 DDoS 防护和 SSL，但未公开确认统一安全认证（集团层面 ISO 27001、SOC 2 或同等认证）；相比之下，OVHcloud 拥有 ISO 27001、ISO 27701 和
              HDS 认证。
