  - id: TV005
    title: 投资逻辑破裂与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 披露收入低于底线
        - 在任何正式尽调中披露收入 <€450M
        - 隐含 EV/Revenue >10×；远高于 IONOS 和 OVHcloud 2–4× 的公开可比公司；倍数无法成立
        - 退出或拒绝按 €4.8B 投资；协商更低入场价
      - - 杠杆贷款契约违约或困境再融资
        - 贷款人因债务服务覆盖不足，强制契约补救、股权注入或资产出售
        - 确认隐藏杠杆风险；股权回收实质受损；管理层被分心
        - 立即升级债务结构尽调；若管理层不披露条款，则退出
      - - AI 驱动核心主机品牌客户流失
        - AI builder 普及后任意 12 个月内，核心主机品牌总流失率超过 20%
        - 收入下滑抵消并购增厚；免费 AI 网站构建器让市场商品化，ARPU 被侵蚀
        - 重新评估增长轨迹；下调估值目标；跟踪 IONOS 和 Wix 的同业流失数据
      - - 下一轮融资事件出现下轮
        - 下一次二级交易或融资对 team.blue 估值 <€3.5B（较 €4.8B 下调 >27%）
        - 确认市场认为 2024 年 7 月估值标记过高；信号显示 PE 发起人资本承压
        - 立即审查持仓；下轮很可能触发契约讨论和治理变化
      - - 核心领导人在无继任安排下离职
        - Jonas Dhaenens 或 Claudio Corbetta 离职，且 12 个月内未任命继任者
        - 并购飞轮失去主要设计者；60+ 品牌生态的文化凝聚力承压
        - 要求说明继任计划和治理结构；监控董事会构成
    notes: 触发项和阈值基于截至 2026 年 6 月可得证据，具有示意性。「披露收入」指在正式尽调场景中共享的任何经审计或管理层确认数字；不要求公开披露即可触发阈值。
    claimRefs:
