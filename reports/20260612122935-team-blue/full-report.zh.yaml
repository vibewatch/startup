              one.com（UK/Nordics）、Register.it 和 Aruba（Italy）、123-Reg（UK）、Loopia（Sweden/Nordics）以及约 35
              个其他区域品牌，提供网站托管、域名注册、电子邮件托管、SSL 和入门级建站工具。生态系统页面确认，team.blue 在 22 个运营国家中的 10 个市场位列前 10。第二个集群是 WordPress 与
              VPS / 云基础设施，面向开发者和成长型 SMB： TransIP 提供五档 VPS 套餐和性能附加项，提供带 AI Site Assistant 的 Managed WordPress（包含 GPT
              Image 1 升级），也支持开源 AI 应用（Ollama、n8n、OpenClaw）；Aruba.it 则为意大利企业客户补充 Private AI 方案。电商集群以 2025 年 9 月收购的
              Shoptet 为锚，提供基于云的店铺搭建、支付、物流和数字广告；其 CEE 收入超过 €30M，客户满意度 90%+，Shoptet Premium 延伸至企业商户。合规 SaaS 集群覆盖
              iubenda（GDPR/CCPA/LGPD 隐私与 Cookie 自动化， 带 ML 优化的同意横幅）和 consentmanager（Cookie 同意管理）。营销与销售 SaaS 集群包括
              Metricool（2M+ 用户、 €17M ARR、社媒排期和广告管理）、Kolsquare（覆盖 180+ 国家和地区的影响者营销平台，G2 4.6/5，B Corp）、
