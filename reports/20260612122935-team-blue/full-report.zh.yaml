      - number: '4.3'
        title: 可比基准——IONOS、OVHcloud、GoDaddy 和 Wix
        blocks:
          - type: paragraph
            body: >-
              最接近、且公开披露财务数据的参照公司是 IONOS Group SE（Frankfurt: IOS1）。IONOS 披露 FY2025 总收入 €1.316 billion（同比 +5.5%），中期目标是收入
              CAGR 约 10%，EBITDA 利润率逐步升至 ~40%。IONOS 在 17 个欧洲和北美市场服务 6.2 million 客户，比 team.blue 多约 2.9
              million；其股权故事披露经常性收入约 80%，EBITDA 向自由现金流转换率约 90%。IONOS
              的商业模式页面称公司「高度可扩展、轻资产……利润率有吸引力、可见性强、现金转换率高」——这正是以托管为核心的 team.blue 等运营商在结构上接近的财务原型。OVHcloud（Euronext Paris:
              OVH）披露 FY2025 收入 €1.085 billion，调整后 EBITDA €438 million（40.4% 利润率），在 46 个数据中心服务 1.6 million 客户。OVHcloud
              采用垂直整合模式，资本开支强度高于共享托管平台，因此只能作为部分可比公司。GoDaddy Inc.（NYSE: GDDY）FY2025 收入 $4.951 billion，全球客户 20 million、托管域名
              84 million+；其规模和偏美国的模式限制了与 team.blue 欧洲 SMB 聚焦的直接可比性，但能给全球市场底部定锚。Wix（NASDAQ: WIX）来自 260+ million 注册用户的年收入约
              $2 billion；按 W3Techs 2026 年 6 月数据，其全球托管市场份额为 4.3%。关键推断是： team.blue 拥有 3.3 million 客户，客户规模介于 IONOS（6.2M）和
              OVHcloud（1.6M）之间。将 IONOS 约 €212/年 的 ARPU 套用到 team.blue 的 3.3M 客户，得到约 €700M——上限。将 Loopia 披露的约 €100/年 ARPU
              套用后得到约 €330M——下限。€450–650M 的混合估计，反映 team.blue 在 Benelux、北欧、西欧等高 ARPU 市场的组合，正在扩张的 SaaS
              邻接层（Metricool、iubenda、Shoptet），以及 ARPU 较低的 CEE 新增资产（Loopia Slovakia/Hungary/Serbia、Shoptet
              Czech/Slovak）。若按 IONOS 披露的 ~40% EBITDA 利润率，team.blue 在收入中点估计下的 EBITDA 可能为 €180–260M。不过，team.blue 还背着更高的
              M&A 整合成本、earnout 结构， 以及最关键的杠杆资本结构；IONOS 并没有同等债务 / 股权比例。若 EBITDA 为 €190–270M，€4.8B 估值意味着交易倍数约 18–25× 远期
              EBITDA；若按 €450–650M 收入区间，则约为 7–10× 收入，符合 2024 年经常性收入型欧洲科技平台获得的溢价水平。
