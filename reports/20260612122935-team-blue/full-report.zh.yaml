      - number: '1.4'
        title: 领导层、董事会与治理
        blocks:
          - type: paragraph
            body: >-
              team.blue 的领导结构把创始人型企业家、PE 任命运营者和 Hg 关联董事混在一起。Jonas Dhaenens（创始人兼总裁）仍是集团的战略门面和 M&A 推手；他 16 岁创办
              Combell，并已亲自带队完成欧洲 150 多起交易。Claudio Corbetta（集团 CEO）拥有 25 年以上经验，包括 Cambridge 数学学位（1994）和 INSEAD
              MBA（2000）；加入 team.blue 前，他曾任 DADA S.p.A. CEO，搭建数据驱动营销能力。Dawn Marriott（执行主席）是 Hg 合伙人，2021 年加入；此前作为 Hg 被投公司
              Azets 的 CEO 推动整合 50 多起收购。Kirk Barlow（集团 CTO）拥有 26 年以上全球技术经验，曾在 Oracle、Compaq、HP、Siemens、IBM 任职，并担任
              ABB、Novartis、Credit Suisse 和 Belron Group 的 CIO。Benjamin Lang（首席增长官）曾是 Shopify
              高级商业负责人（近四年，聚焦欧洲），负责客户成功、交叉销售和营销。Torsten Hauschildt（M&A 负责人）曾在 United Internet AG（IONOS/1&1 母公司）担任 M&A 与投资
              MD 12 年，把 M&A 能力制度化。Ali Niknam（董事会成员、TransIP 联合创始人）也于 2012 年创办欧洲新银行 bunq，并仍是基石投资人。董事会包括 Hg 合伙人 Joris Van
              Gool、Nick Jordan 和 Matthijs Deroo，以及 CPP 任命的 Jessica Morris、Sofina 观察员 Anthony Keusters。独立治理还由 Jon
              Wrannall 和 Jeroen Hüpscher（前 TransIP CEO）进一步锚定。根据公司 ESG 披露，team.blue 在 Hg 2025 Integrity and Stewardship
              诊断中得分 9.9/10，是 Hg 投资组合中的最高分之一。Hans Nijholt（首席产品官）在 2026 年 4 月 AI 新闻稿中被引用。相对于外部独立董事，Hg
              关联董事席位集中，值得作为治理风险持续监测。
