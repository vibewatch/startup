      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              欧洲 SMB 托管市场可拆成五类清晰买家画像，每类都有不同采用触发点、预算所有者和扩张路径。按数量看，最大细分是微型企业或个体经营者（0–9
              名员工）——这是每个欧洲托管运营商的起始客户——其中所有者兼创始人同时充当买方、用户和付款方。该画像价格敏感，触发点是建立第一个专业线上存在（域名 + 电子邮件 + 基础网站）。小企业（10–49
              名员工）细分更复杂：采购决策可能涉及兼职营销或行政负责人，触发点常来自品牌重塑、平台迁移或电商上线。自由职业者和网页设计师构成第三类画像——他们购买托管主要是为了交付客户项目，并看重分销商权限、白标和批量域名价格。本地商户和实体零售商越来越成为电商赋能平台（Shoptet、WooCommerce）的目标，而非传统共享托管。网页代理机构通过分销商计划规模化购买，拉高单客户账户价值。team.blue
              的 Digital Maturity Report 覆盖 30 个国家 8,000 多家欧洲公司，发现 30% 小企业不知道该用哪些数字工具，26% 缺乏技能或信心，1/5
              提到时间和资源约束——这验证了引导式、打包式、AI 简化入门的需求。IONOS 服务 17 个市场的 6.2 million 客户，横跨自由职业者、SMB 和企业；OVHcloud 的 1.5 million
              客户则偏向开发者和重视主权的企业买家，显示市场内部的分层差异。
