  - id: TV003
    title: 牛市 / 基准 / 熊市情景分析
    columns:
      - 情景
      - 收入假设
      - EBITDA 利润率
      - 隐含 EV
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - €800–900M (FY2025E)
        - 38–42%
        - 以 15–18× EBITDA 计为 €5.5–9.0B；扣除杠杆后，股权价值高于 €4.8B 标记
        - 若 AI 在退出前冲击 SMB 主机需求，倍数会压缩
        - 只有 2024–2025 年所有收购全部完成整合、且 SaaS 占比高于 30% 时才可能成立
      - - 基准
        - €550–700M (FY2025E)
        - 30–37%
        - 按 EBITDA 指标为 €1.5–2.6B；股权上行高度取决于杠杆规模
        - 杠杆债务服务吃掉 FCF；退出推迟至 2028–2030 年
        - 结合已披露收购节奏且没有负面收入披露，这是最可能情景
      - - 熊市
        - €400–500M (FY2025E)
        - 20–30%
        - EV 为 €800M–1.5B，按 4–6× EBITDA；股权价值可能低于债务堆栈
        - 困境贷款重新定价、AI 驱动 ARPU 下滑、契约违约
        - 鉴于 2026 年 Bloomberg 对贷款重新定价发出的负面信号，概率低但不可忽略
    notes: 所有收入、EBITDA 和 EV 数字均为估算；team.blue 未披露任何财务结果。EBITDA 倍数区间来自 IONOS/OVHcloud 公开可比公司（3–6×），并叠加 PE 平台溢价。EV 计算仅作示意。
