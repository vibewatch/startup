      - number: '8.5'
        title: 退出准备度、最终尽调问题与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              team.blue 的退出准备度中等。公司具备规模（3.3 million 客户、22 个国家、60+ 品牌、€4.8 billion 估值），可以寻求在欧洲交易所 IPO，或出售给战略 / 财务买方。Hg 约
              $70 billion AUM 和 CPP $632 billion 基金都能支持长持有期，说明短期没有被迫出售压力。不过，2026 年初杠杆贷款重新定价失败显示，信贷市场对欧洲软件 PE 资产更挑剔；任何
              IPO 都需要完整财务披露，而该公司尚未接受公开市场投资者检验。

              能把建议从“观察”转为“按价格可投”的六个最终尽调问题是：（1）FY2022–FY2025 经审计收入和
              EBITDA，并按主机、SaaS、电商拆分分部；（2）按品牌队列计算的总收入留存和净收入留存；（3）债务总规模、期限、利率（固定 / 浮动）、契约余量，以及 2026 年 3
              月重新定价失败的具体情况；（4）分配瀑布和优先股堆叠（CPP 或 Sofina 是否相对创始人或管理层持有清算优先权）；（5）M&A 整合路线图——尤其是 2025 年 8+
              笔收购中哪些已完全整合、哪些仍在独立平台上；（6）类似 IONOS 的 KPI 披露——管理域名数、各品牌活跃客户、月度流失率。
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV031
              - CV032
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV009
              - CV003
              - CV031
              - CV032
              - CV007
              - CV045
              - CV015
              - CV017
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 杠杆不透明是最大的单一估值风险
            body: >-
              2026 年 3 月 Bloomberg 来源的反向报道——team.blue 与 Dedalus 一样取消杠杆贷款重新定价——是任何官方 team.blue 沟通中都没有覆盖的最重要数据点。在 €4.8
              billion EV 下，即便只有 €500 million 净债务（对这一规模的 PE 支持 buy-and-build 平台而言，这是保守假设），一旦 EBITDA 恶化，股权价值也会降至 €4.3
              billion，低于 CPP 入场估值。债务规模、到期结构和契约组合必须成为第一尽调优先级。
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
              - CV038
          - type: callout
            title: 收入估计带有关键低置信度标记
            body: >-
              €400–700 million 的估算收入区间，是自下而上由已披露收购收入（Loopia €65M FY2023、Shoptet >€30M、Metricool ARR €17M）加上根据客户数和 IONOS
              ARPU 基准推导的隐含核心基础收入拼出。该估计未经任何官方来源验证，可能在任一方向上出现重大偏差。本章所有估值倍数都取决于这个未经验证的数字，只应视为示意。
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV011
