      - number: '1.5'
        title: 负面信号、披露不透明与客户摩擦
        blocks:
          - type: paragraph
            body: >-
              三类负面信号需要审视。第一，杠杆不透明：Bloomberg 于 2026 年 3 月 23 日发布、CBInsights
              缓存的报道称，team.blue「取消了一项原计划分两部分修订、展期并重新定价既有贷款的交易」——这让它与德国医疗软件公司 Dedalus（暂停 €1.3 billion
              杠杆贷款）并列，成为债务市场承压的欧洲软件 PE 载体。总债务规模、债务成本、贷款到期日和契约结构均未公开披露。Bain Capital 估计，约 40% 的 PE 买断资产暴露于面临 AI
              驱动模型风险的软件企业。第二，客户评价：one.com（服务西欧的 team.blue 品牌）在 SmartCustomer.com 基于多年评价汇总的评分为
              1.3/5，投诉集中于任意涨价、强制升级存储档位和取消服务摩擦——说明至少部分品牌存在客户满意度挑战。123-Reg（英国的另一个 team.blue 品牌）在 SmartCustomer.com 得分为 2.1
              星。HostAdvice 也指出 one.com 的专家和用户评价喜忧参半。第三，财务披露不透明：team.blue 从未公开披露收入、EBITDA、客户流失率或利润率。€4.8 billion
              估值是交易标记，不是经常性报告数字；在当前私营公司规则下，公司没有披露义务。这些负面信号并不构成已确认减值，但实质上限制了外部投资人独立验证增长主张或财务健康度的能力。
