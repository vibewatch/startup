  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 法规
      - 司法辖区
      - 状态 / 生效
      - 可能性（team.blue）
      - 严重性
      - 缓释证据
      - 剩余敞口
      - 尽调路径
    rows:
      - - GDPR（Regulation (EU) 2016/679）
        - EU/EEA — 全部 22 个运营国家
        - 2018 年 5 月起可执行；持续适用
        - 中 — 多司法辖区内既担任数据处理者，也担任控制者；涉及多个监管机构
        - 关键 — 最高 €20M 或全球营业额 4%
        - 隐私政策声明处理符合 GDPR；承诺使用欧洲数据中心；为客户提供 iubenda 合规 SaaS
        - 高 — 未发布独立审计或 DPA 认证；多监管机构辖区；欧盟曾对托管处理者开出历史罚单
        - 要求 DPA/审计认证；确认主要监管机构；审查事件响应 SLA
      - - NIS2 Directive（EU）2022/2555
        - EU — 全部成员国；2024 年 10 月前转化为国内法
        - 2024 年 10 月 18 日起废止 NIS1；由各国主管机构执行；EC 于 2026 年 1 月提出简化修正案
        - 高 — team.blue 在多个国家的 DNS、托管、云业务可能构成基本或重要实体
        - 高 — €10M 或全球营业额 2%；不合规会触发董事会责任
        - team.blue 博客提到安全实践；2026 年 Q1 ESG 中体现 NIS2 意识；未发布认证或主管机构备案
        - 高 — 事件报告准备度、董事会问责框架、供应链安全政策均未获外部验证
        - 确认向各国主管机构完成 NIS2 注册；审查事件报告准备度；获取董事会网络安全授权证据
      - - Data Act（Regulation (EU) 2023/2854）
        - EU — 跨行业；2025 年 9 月 12 日起适用
        - 正在适用；云切换和数据可携带规则已生效
        - 中 — 托管 / 云切换义务直接适用；合同公平性规则约束增购做法
        - 中 — 合同不合规带来声誉和财务敞口；更易切换会推高客户流失
        - team.blue ESG 2026 年 Q1 提到产品创新；未发现 Data Act 准备度声明
        - 中 — 促进切换可能加速传统品牌流失；增购限制压制 ARPU 增长
        - 审查托管合同是否符合 Data Act 可携带要求；评估切换成本缓释策略
      - - EU AI Act（Regulation (EU) 2024/1689，法规）
        - EU — 分阶段实施；2026 年 5 月达成简化规则
        - 高风险系统禁令已生效；更广泛义务将在 2026–2027 年逐步落地
        - 中 — Macaly（AI 无代码构建器）、Windsor.ai（数据集成）、AI 支持工具均在范围内
        - 中 — AI 部署方承担合格评定、透明度和文档义务；高风险用途带来产品重构风险
        - EC 已建立 AI Continent Action Plan 和 AI Act Service Desk；2026 年 5 月简化协议降低 SMB 负担
        - 中 — 合规成本；若任何功能被归为高风险，需重构产品；分阶段实施期间监管不确定性仍在
        - 将 AI 产品映射到 AI Act 风险层级；确认没有高风险用例；跟踪简化实施规则
      - - GDPR 执法行动 — 托管行业先例
        - EU 多司法辖区
        - 活跃 — GDPRhub 跟踪 1,500+ 起执法决定；托管和云服务商被瞄准
        - 中 — 行业执法压力累积；客户数据泄露会产生直接责任
        - 高 — 罚款随全球营业额放大；Art. 82 下的集体诉讼赔偿权增加民事敞口
        - GDPR.eu 和 GDPRhub 确认，罚款根据包括历史记录在内的 10 项标准评估；公开记录未发现 team.blue 执法行动
        - 中 — 首次执法行动会同时引发 22 个司法辖区的监管审视
        - 审查影响托管行业同业的历史执法行动；确认 team.blue 监管机构登记情况
    enumerationScope:
      coverage: partial
      basis: >-
        Verified against EC digital-strategy policy pages, Eur-Lex full-text instruments, GDPR.eu fine framework,
        GDPRhub enforcement tracker, and ENISA threat landscape. Covers the four primary in-force EU regulations
        materially applicable to team.blue plus enforcement precedent. National-level transposition variances across 22
        operating countries, sector-specific national cybersecurity strategies, and any pending enforcement actions are
        not individually enumerated.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
    approximationNotes: >-
      Likelihood and severity ratings are assessor's ordinal judgments based on published regulatory texts and ENISA
      guidance. Actual fine quantum depends on national supervisory authority discretion and team.blue's specific
      compliance posture, which is not fully disclosed publicly.
    notes: 可能性和严重性为序数评级；实际监管结果取决于各国主管机构的执法裁量，而 22 个运营国家之间差异很大。
