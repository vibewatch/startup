      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 欧洲监管复杂性构成结构性护城河
            body: >-
              NIS2、GDPR 和 eIDAS 创造了合规层，美国总部服务商很难以有成本效率的方式服务到 SMB 层级。team.blue 的 iubenda 和 ConsentManager 品牌正落在这一合规 SaaS
              需求中，形成打包优势；通用美国托管服务商很难复制，而且这是欧盟法律强制要求，不是可选项。
            calloutType: strength
            claimRefs:
              - CM026
              - CM027
              - CM028
          - type: callout
            title: 集中度风险——IONOS 主导德国
            body: >-
              IONOS 在德国持有 51% 网页托管市场份额，在西班牙持有 21%；二者是 team.blue 22
              国足迹中最大的两个市场。在这些市场实现有机增长，意味着要从盘踞已久的上市公司既有巨头手中抢份额；对方产品宽度相当，披露收入也显著更大（€1.316B vs. team.blue
              未披露数字）。如果不靠压低利润率的定价，这一集中度风险限制了 team.blue 能现实拿下的 €4–6B SAM 比例。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM014
          - type: callout
            title: 关键品牌客户满意度赤字
            body: >-
              Smartcustomer.com 用户评价给 one.com 1.3/5 星、123-Reg 2.1/5 星——二者都是 team.blue
              子品牌。在切换成本低的市场里（域名转移只需数小时），持续服务质量赤字会直接转化为流失和负面口碑，削弱有机增长并抬高获客成本。team.blue 品牌没有公开 NPS 或流失率数据。
            calloutType: risk
            claimRefs:
              - CM041
              - CM042
              - CM043
          - type: callout
            title: AI 不只是功能，而是 TAM 扩张器
            body: >-
              仅 2024 年 H1，Hostinger 就有 590,000 个网站由 AI 构建，说明 AI 网站创建正在激活此前没有专业帮助就无法建站的净新增客户群。对 team.blue 而言，Macaly 和更广泛
              AI 推出是真正的 TAM 扩张工具——通过零代码路径，把那 30% 不知道该用哪些数字工具的 SMB 转化为首次托管客户。
            calloutType: insight
            claimRefs:
              - CM029
              - CM030
              - CM017
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接与既有竞争对手——IONOS 和 GoDaddy
        blocks:
          - type: paragraph
            body: >-
              IONOS Group SE（Frankfurt: IOS1）是 team.blue 最清晰的直接竞争对手，也是唯一上市的欧洲纯 SMB 托管集团。IONOS 报告 FY2025 总收入 €1.316
              billion，同比增长 5.5%，中期 CAGR 目标约 10%，EBITDA 利润率目标约 40%。公司服务欧洲和北美 17 个市场的 6.2 million 客户，管理 22 million
              个注册域名（全球第四大域名注册商），并声称在德国——最重要的单一欧洲 SMB 市场——持有 51% 网页托管市场份额，在西班牙持有 21%。IONOS
              称自己是「欧洲网页托管的清晰市场领导者」。其产品组合在域名、共享托管、托管式 WordPress、AI 网站构建器（2024 年推出）、电子邮件、电商和云上与 team.blue
              镜像相似，还包括为每位客户分配专属支持人员的「personal consultant」模式。IONOS 的股权故事强调约 80% 经常性收入、约 90% EBITDA
              的高现金转化和低资本开支强度——这一财务画像与 team.blue 隐含目标在结构上相同，但 team.blue 不披露财务，无法确认。team.blue 的优势在于地域广度（22 个国家 vs 17
              个市场）、合规和 SaaS 相邻层（iubenda、ConsentManager、SimplyBook.me、Metricool），以及 AI
              赋能的买入并整合势头（Macaly、Windsor.ai、Saleskit）。IONOS 的上市公司身份带来季度投资人披露和竞争情报，这是私营 team.blue 无法匹配的。

              GoDaddy Inc.（NYSE: GDDY）是美国总部的全球既有巨头，FY2025 收入 $4.951 billion，全球 20 million 客户，管理 84 million+
              域名，是全球最大域名注册商。在欧洲，GoDaddy 主要通过 2017 年收购的 Host Europe Group（HEG）布局；HEG 子品牌包括 123 Reg（英国）、Domainfactory（德国）和
              Host Europe。W3Techs 2026 年 6 月数据显示，GoDaddy Group 全球托管份额 2.5%（GoDaddy 本体 2.1%，Host Europe 占 GoDaddy Group
              数字的 13%，Domainfactory 4%，123 Reg 低于 0.1%）。关键是，123 Reg 是 GoDaddy 品牌——不是 team.blue——它在 SmartCustomer 的 2.1/5
              星评分反映的是 GoDaddy 在英国市场的执行风险，而非 team.blue。GoDaddy 的 Airo AI 套件是其应对 AI 构建器的主要产品回应。对 team.blue 而言，GoDaddy
              在欧洲是二线威胁：其欧洲大陆份额弱于 IONOS，而且以英语为中心的支持模式限制了它与非英语 SMB 建立信任。
