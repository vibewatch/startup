            title: 收入估算方法与局限
            body: >-
              €450–650M 收入估计来自「客户数 × 混合 ARPU」三角测算，以 Loopia（€100/yr）、IONOS（€212/yr）和部分 M&A 收入披露为锚点。关键假设包括：（1）3.3M 客户反映
              2024 年 7 月 CPP 交易时的客户数，2024 年之后的 M&A 新增并未完全纳入；（2）€130–200 的混合 ARPU 对西欧品牌赋予更高权重，而非 CEE 新增资产；（3）未建模公司间收入抵销；
              （4）Metricool、iubenda 和 SaaS 邻接品牌按席位贡献更高 ARPU，但客户体量更小。这些估计只能作为方向性判断。
