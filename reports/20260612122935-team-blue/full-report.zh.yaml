      - number: '8.4'
        title: 建议、置信度与投资逻辑评估
        blocks:
          - type: paragraph
            body: >-
              按当前 €4.8 billion 估值，team.blue 的投资建议是“继续研究 / 观察”：在三个关键未披露数据点解决前，不应投入资本——（1）按年份和分部拆分的收入与
              EBITDA，（2）杠杆债务总规模、到期日和契约组合，（3）股权分配瀑布与优先股堆叠。当前估值置信度低，风险评级高。估值立场是“披露前偏高至合理”：若收入不高于 €550 million，则偏高；只有收入超过
              €750 million、EBITDA 利润率高于 37% 时才算合理。

              资产层面看，投资逻辑很有吸引力：按客户数计，team.blue 是欧洲最大的私营 SMB 数字赋能平台，覆盖 22 个国家、60+ 品牌，在本地市场有可防守位置；强管理团队带领的 buy-and-build
              方法论已被验证；CPP 和 Hg 两个世界级机构 LP 进入，且投资期限很长。平台转向 AI 工具（Macaly、Windsor.ai）和 SaaS
              资产群（Metricool、Kolsquare、Shoptet），也提供了可信的增长可选性叙事。

              反向逻辑同样有力：公司从未披露收入、EBITDA 或杠杆画像，外部无法验证 €4.8 billion 估值。2026 年 3 月 Bloomberg
              关于杠杆贷款重新定价取消的反向报道，是本研究中最重要的单一风险信号——它确认杠杆存在，也确认市场不愿以更好条款展期。2026 年 PE 软件资产估值承压（Hg 的 Visma IPO 推迟；EQT/TA
              Associates 退出停滞），team.blue 下一次流动性事件高度取决于债务市场如何演变，以及增长轨迹是否足以支撑溢价倍数。
