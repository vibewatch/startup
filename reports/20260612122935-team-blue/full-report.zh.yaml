figures:
  - id: FO001
    title: team.blue —— 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 按时间梳理从 Combell 1999 年创立到 2026 年 AI 扩张公告的关键节点，覆盖融资事件、重大收购，以及负面的杠杆贷款披露。
    data:
      items:
        - date: '1999-01-01'
          label: Combell 创立
          detail: Jonas Dhaenens 16 岁时在比利时自力启动一家 Web 主机业务
          tone: positive
        - date: '2013-01-01'
          label: Waterland PE 投资 Combell
          detail: 第一家机构 PE 伙伴；五年内实现 10× 增长并完成 17+ 笔补强收购
          tone: positive
        - date: '2017-01-01'
          label: Combell 收购 Zitcom（丹麦）
          detail: 被描述为进入北欧的「量子跃迁」；确立比利时、荷兰、丹麦、瑞典市场领导地位
          tone: positive
        - date: '2018-12-21'
          label: Hg Capital 从 Waterland 手中收购 Combell
          detail: Hg 第 8 笔科技服务投资；Nick Jordan 和 Joris Van Gool 与 Jonas Dhaenens 合作开启下一阶段
          tone: positive
        - date: '2019-06-12'
          label: Combell + TransIP 合并 —— team.blue 诞生
          detail: Ali Niknam（TransIP）与 Jonas Dhaenens（Combell）创建 team.blue；覆盖 5 国、1.2M 客户
          tone: positive
        - date: '2022-07-01'
          label: Hg 追加投资；CPP Investments 首次共同投资
          detail: Hg 为产品和 M&A 扩张提供资金；CPP Investments 作为成长股权共同投资者加入
          tone: positive
        - date: '2024-05-23'
          label: 收购 Loopia Group
          detail: 新增瑞典 / 芬兰 / 斯洛伐克 / 捷克 / 匈牙利 / 塞尔维亚 650,000 客户；客户基数突破 3M
          tone: positive
        - date: '2024-07-10'
          label: CPP Investments 取得重要少数股权 —— 估值 €4.8bn
          detail: CPP 约 20% 股权对应 team.blue €4.8bn 估值；自 Hg 2019 年进入以来增长 8×
          tone: positive
        - date: '2024-07-22'
          label: Sofina 投资 team.blue
          detail: 这家比利时上市投资公司加入 Hg 和 CPP，成为第三个机构支柱
          tone: positive
        - date: '2024-09-17'
