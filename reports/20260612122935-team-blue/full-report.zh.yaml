      - number: '3.2'
        title: 欧洲区域竞争对手——OVHcloud 和 Aruba
        blocks:
          - type: paragraph
            body: >-
              OVHcloud（Euronext Paris: OVH）自称法国和欧洲领先云服务商，FY2025 报告收入 €1.085 billion、调整后 EBITDA €438 million（40.4%
              利润率）。公司在 4 大洲运营 46 个数据中心，运行超过 400,000 台服务器，服务 1.6 million 客户。OVHcloud 由 Octave Klaba 1999
              年创立，其差异化来自完全垂直整合模式——自行设计并制造服务器——相对于转售商拥有结构性成本和主权优势。OVHcloud 客户群更偏开发者和重视主权的企业，而不是纯 SMB；其网页托管产品线（面向 SMB
              的共享托管、面向中型市场的 VPS、面向企业的专用托管）次于公有云业务。公司持有 ISO 27001、ISO 27701、HDS 和 SecNumCloud 认证——team.blue
              均未持有——因此能服务法国公共部门和受监管行业买家，而 team.blue 没有可竞争的认证产品。重大负面事件是 2021 年 3 月 OVHcloud 位于斯特拉斯堡的 SBG2
              数据中心被火灾摧毁，所有服务离线，部分没有异地备份的账户遭遇不可恢复数据损失，这强化了所有欧洲托管服务商的 SMB 买家对备份和恢复 SLA 的关注。战略分化很清晰：team.blue 竞争 SMB 广度和合规
              SaaS 打包；OVHcloud 竞争基础设施、主权认证和开发者信任。二者买家画像只在 SMB 网页托管细分重叠，OVHcloud 的共享托管面向博客、小型网站和电商——正是 team.blue 品牌服务的买家。

              Aruba S.p.A.（aruba.it）是意大利领先的托管和信任服务商，也是 team.blue 在南欧最接近的直接区域对手，尤其针对 team.blue 收购的 Register.it 客户基础。Aruba
              提供托管、WordPress、域名、SSL、电子邮件、电商、PEC（认证电子邮件）、远程数字签名和云服务。Netcraft 将 Aruba 评为 2022 年最可靠的托管公司网站。Aruba
              是私营公司，收入未披露，无法直接做财务比较。Aruba 的 PEC 认证电子邮件和数字签名服务在意大利受法律强制要求，形成合规护城河，team.blue 的 Register.it
              必须与之竞争——这是有监管替代壁垒的高价值经常性收入产品。Aruba 的意大利本土护城河意味着 team.blue 不会在其他欧洲市场遭遇它，但考虑 Register.it
              在当地的历史地位，意大利市场具有重要性。
