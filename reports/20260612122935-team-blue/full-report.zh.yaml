  - id: TV002
    title: 投资论点与反论点
    columns:
      - 论点
      - 证据
      - 可能改变判断的因素
    rows:
      - - 正方：平台规模支撑溢价
        - 3.3M SMB、22 个国家、60+ 品牌、20 年增长记录、在 10 个市场位居前十
        - 若披露收入低于 €500M，或客户年流失率高于 15%，该观点会削弱
      - - 正方：经常性收入模型支撑稳定性
        - IONOS（最接近同业）约 80% 收入为经常性；team.blue 商业模式在结构上相似
        - 若披露 NRR 低于 95%，或主机 ARPU 因 AI 商品化而下降，该观点会削弱
      - - 正方：买入并整合飞轮已被验证
        - 2019 年以来回报 8×；150+ 笔并购；Loopia、Metricool、Shoptet 体现交易质量
        - 若整合成本吃掉被收购 EBITDA 增量的 50% 以上，该观点会削弱
      - - 反方：估值不透明且可能偏高
        - 无收入 / EBITDA 披露；EV/Revenue 估计为 7–12×，而 IONOS 约 2–3×
        - 若管理账目显示收入 ≥€750M 且 EBITDA 利润率 ≥37%，该反方观点会增强
      - - 反方：杠杆债务压力已获确认
        - Bloomberg（2026 年 3 月）确认取消贷款重新定价；引用 Dedalus 平行案例
        - 若债务以延长期限完成全面再融资并向投资者披露，该问题会化解
      - - 反方：2026 年 PE 软件退出环境冻结
        - Hg Visma IPO 推迟；EQT Thinkproject 受阻；TA Associates Unit4 退出受阻
        - 若 PE 信贷市场在 2026 年 H2 重新打开且软件倍数企稳，该问题会化解
    notes: 反论点来自第三方和负面来源；正方论点来自公司和投资者官方来源，天然带有证实偏差。
