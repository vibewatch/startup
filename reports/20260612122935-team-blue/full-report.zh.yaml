        title: 地理组合、扩张杠杆与集中度风险
        blocks:
          - type: paragraph
            body: >-
              team.blue 覆盖 22 个国家，横跨西欧（Belgium、Netherlands、UK、Germany、France、Italy、Spain、Portugal、
              Switzerland、Austria、Ireland）、北欧（Sweden、Denmark、Finland）和 CEE（Czechia、Slovakia、Hungary、
              Serbia、Bulgaria、Cyprus、Greece）。公司称在其中 10 个国家位列市场前 10。西欧和北欧构成历史收入基础，来自
              Combell（Benelux）、TransIP（Netherlands）、one.com（Nordic/UK）、123-reg（UK）、Loopia（Sweden）和
              Register.it（Italy）。CEE 扩张则通过 Loopia Group 的 Slovakia/Czech/Hungary/Serbia 业务（2024 年 5 月）、 Shoptet 在 Czech
              Republic/Slovakia 的领先地位（2025 年 9 月），以及 Saleskit 的 Czech Republic/Slovakia CEE B2B 情报版图（2026 年 3 月）提速。

              地理集中风险为中等：team.blue 在 France、Germany 和 Spain 的明确存在有限，体量不及 Benelux 或北欧品牌；在 Iberian Peninsula 或 Eastern
              Balkans 也未披露达到实质规模的存在。欧洲数字 SMB 支出最大的三个国家（Germany、France、UK）均可触达， 但其在 Germany 和 France 相对于 IONOS、OVHcloud
              或本地运营商的市场份额尚未确认。

              扩张杠杆包括：（a）向现有 3.3M 托管客户基础有机交叉销售 SaaS 工具（Metricool、iubenda、Kolsquare、Saleskit、SimplyBook.me）； （b）继续 M&A CEE
              / 南欧 SMB 平台；（c）Macaly（AI 应用构建器）在托管品牌中推出，作为差异化 onboarding 升级； （d）Windsor.ai（330+
              数据源集成）服务营销分析升级路径。单个客户层面的客户集中风险较低——没有单一 SMB 客户对集团收入有实质影响。 代理商集中是二阶风险：30K
