            title: 杠杆贷款再定价失败——融资风险得到确认
            body: >-
              2026 年 3 月 23 日 Bloomberg 报道确认，team.blue「取消了原计划分两步修改、延长并重定价现有贷款的交易」；同篇报道还把 Hg 的 Visma 列为推迟 IPO 的案例。这确认了三点：
              （1）公司存在实质性杠杆资本结构；（2）2026 年初市场拒绝了 team.blue 的再定价条款；（3）现有贷款仍处于再定价前条款。 在总债务、到期日和契约状态披露前，利息覆盖率和股权自由现金流无法可靠估计。
