  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史、2024 年 7 月交易与估值背景
        blocks:
          - type: paragraph
            body: >-
              team.blue 2024 年 7 月 €4.8 billion 的估值建立在三笔已披露机构交易之上。第一，Hg Capital 2018 年 12 月投资 Combell Group（接替
              Waterland；后者用五年、17 笔收购把业务做大十倍），随后在 2019 年 6 月安排 Combell 与 TransIP Group 合并，组成 team.blue，成立时服务 1.2 million
              客户。第二，Hg 2022 年 7 月追加股权投资，用于产品扩张和欧洲 M&A；HGT 当年对该持仓的账面价值增加 £16.4 million。第三，也是最关键的一笔，CPP Investments（Canada
              Pension Plan Investment Board，管理 C$632 billion 基金）于 2024 年 7 月 10 日收购 team.blue 约 20% 股权，交易将公司估值定在 €4.8
              billion；法律顾问 Linklaters 确认此事，并称其为“欧洲最大的私营科技公司之一”。比利时家族投资公司 Sofina（Euronext Brussels 上市，125 年历史）于 2024 年 7
              月 22 日按同样 €4.8 billion 估值追加少数股权投资。Hg 全程仍是最大单一股东。创始人 Jonas Dhaenens（总裁）和 Ali Niknam（TransIP
              联合创始人）仍与广泛的管理层股权池一起作为基石投资人。

              €4.8 billion 估值意味着 Hg 2019 年入场至今获得 8× 回报，反推 2019 年合并时 Combell+TransIP 实体的粗略成立估值约为 €600
              million。buy-and-build 计划——成立以来超过 150 笔收购、Jonas Dhaenens 亲自推动 150+ 起 M&A 事件，最近一笔为 2026 年初
              Saleskit——靠有机增长和平台级 EBITDA 杠杆共同推高价值。

              2026 年 3 月出现一个重要反向信号：Bloomberg（经 CBInsights）报道称，team.blue
              取消了原计划用于修订、展期并重新定价既有杠杆贷款的两段式交易。这确认公司存在杠杆资本结构，但总规模、期限、利率和契约组合从未公开披露。该重新定价取消事件与 Dedalus（暂停 €1.3 billion
              杠杆贷款）并列，被视为欧洲软件 PE 债务市场压力扩大的证据。Bain Capital 估计，约 40% 的 buyout 资产暴露在 2026 年面临 AI 驱动商业模式风险的软件业务中。
