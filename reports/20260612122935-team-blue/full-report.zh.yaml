            title: M&A 新闻稿给出的部分收入下限
            body: >-
              三项带收入数据的 M&A 披露——Loopia（€65M，FY2023）、Shoptet（>€30M，2025 年 9 月）和 Metricool（€17M ARR，2024 年 9 月）——合计约
              €112M+，但只覆盖 60+ 品牌中的三家实体。这个部分组合下限占 €450–650M 估计收入区间的 17–25%，说明估计具备合理性；但如果不了解这三家品牌对完整组合 ARPU 的代表性，就不能直接外推。
