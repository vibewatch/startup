        - 关键 — 数百万 SMB 客户同时停机；触发 NIS2 报告；声誉崩塌
        - 低 — 集团层面未公开 ISO 27001；无 SOC 2；安全说法限于品牌层面的 DDoS/SSL
        - 很高 — 未确认集团层面事件响应计划；多品牌攻击面
        - 确认 ISO 27001 认证范围；获取事件响应手册；验证各品牌之间备份隔离
      - - 数据中心火灾或物理基础设施故障（先例：OVHcloud SBG2，2021 年 3 月）
        - 低 — 数据中心经过工程设计，但极端事件确实会发生；SBG2 显示了剩余风险
        - 关键 — 没有异地备份的客户可能永久丢失数据；合同责任；NIS2 事件报告
        - 低 — 集团层面未发布 ISO 22301 或数据中心认证；未确认异地备份 SLA
        - 高 — 主要枢纽品牌若发生单一数据中心事件，可能影响数万家 SMB；存在诉讼风险
        - 验证数据中心认证；确认备份地域多样性；审查不可抗力合同条款
      - - DDoS 攻击 DNS 或域名注册基础设施
        - 高 — ENISA ETL 2024/2025 确认 DDoS 是欧盟首要可用性威胁；DNS 是高价值目标
        - 高 — DNS 停机会影响品牌组合中的所有托管域名；在生态系统内造成级联故障
        - 中 — team.blue 提到品牌层面 DDoS 防护；未发现集团层面 SLA 或正常运行时间保证
        - 中 — 商业 DDoS 清洗可部分缓释；地域分布也有帮助
        - 获取正常运行时间 SLA 数据；确认 anycast DNS 部署；验证 DDoS 清洗供应商质量
      - - WordPress 插件生态带来的供应链漏洞（60,000+ 个插件，开源）
        - 高 — WordPress 覆盖全部网站的 43.9%，是全球最大的软件供应链攻击面
        - 高 — WordPress 或插件零日漏洞可能同时影响数百万个 team.blue 托管站点
        - 低 — 未发布覆盖 team.blue 各品牌的插件审核政策或强制更新机制
        - 高 — team.blue 赞助 PHP Foundation，并不保证上游安全态势
        - 确认 Managed WordPress 自动更新政策；评估品牌层面的插件隔离；审查 WP 零日漏洞事件响应
      - - 收购后技术迁移期间，多品牌整合中的数据隔离失效
        - 中 — 150+ 起收购带来整合复杂度；品牌环境之间存在数据交叉
        - 高 — 收购品牌间数据混杂会触发 GDPR 违规；损害客户信任；引来监管行动
        - 低 — 未发布收购实体数据隔离框架；隐私政策未提及
        - 高 — 激进 M&A 节奏且未发布整合手册，造成结构性数据卫生风险
        - 要求收购后 GDPR 影响评估流程；确认被收购品牌数据隔离时间表
    approximationNotes: >-
      Likelihood and severity are qualitative assessments based on ENISA threat landscape reports and sector precedents.
      team.blue has not disclosed its security certification status or incident-response capabilities beyond brand-level
      product claims.
    notes: 风险评级为定性判断；team.blue 未公开披露安全认证、事件响应计划或数据中心规格，限制了独立验证。
  - id: TR003
