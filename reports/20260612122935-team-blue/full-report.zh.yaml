      - CV031
      - CV032
      - CV036
      - CV038
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和 EBITDA（FY2022–FY2025）
        - 经审计或管理层确认的 P&L，带分部拆分（主机 / SaaS / 电商）
        - 没有收入，就无法验证估值倍数；整个投资案例都压在估算分母上
        - team.blue CFO；通过 Hg Capital 作为共同投资者提出要求；聘请财务顾问（Big 4 QoE）
      - - 杠杆债务结构
        - 总债务规模、工具类型（TLB/RCF）、到期安排、适用利率、契约组合，以及 2026 年 3 月重新定价失败原因
        - 取消贷款重新定价确认存在隐藏杠杆；可用于增长的自由现金流未知
        - team.blue CFO / Hg / 银行贷款银团；要求提供信贷协议和最新修订函
      - - 收入留存和流失
        - 按品牌 cohort 划分的总收入留存和净收入留存（NRR）、年流失率、2022–2025 年 ARPU 趋势
        - 高 NRR（>100%）能支撑溢价倍数；低 NRR（<90%）会削弱溢价
        - team.blue Data & Analytics 团队；与 IONOS 股权故事（约 80% 经常性收入）作外部基准
      - - 股权结构、分配瀑布和优先权堆栈
        - 精确股权归属（Hg、CPP、Sofina、创始人、管理层池）；清算优先权条款；反稀释安排
        - CPP 约 20% 股权已确认；Sofina 和创始人比例未知；分配瀑布决定退出时股权回报
        - 公司秘书 / 法律顾问（Hg 由 Linklaters，CPP 由 Kirkland & Ellis）；正式审查 SPA
      - - M&A 整合状态（2024–2025 cohort）
        - Loopia、Shoptet、Metricool、Kolsquare、Windsor.ai、Macaly、Saleskit 每笔收购的整合计划、技术平台迁移状态、管理层激励绑定
        - 仅 2025 年就完成 8 笔收购；整合拖累可能压低 EBITDA 利润率并推迟价值兑现
        - team.blue Group CTO Kirk Barlow 和 Head of M&A Torsten Hauschildt；要求提供整合仪表盘
      - - 退出路线图和时间表
        - Hg 和 CPP 目标持有期、可能退出路径（IPO、出售给战略买家、二级 PE）、预期时点，以及 IPO 前 KPI 披露计划
        - 持有期和退出路径决定共同投资者 IRR；若走 IPO 路径，必须先完成 IONOS 式公开披露
        - Hg Partners（Joris Van Gool、Nick Jordan）；CPP Director（Hafiz Lalani）；正式 LP 报告包
    notes: 尽调要求按对估值的重要性排序。第 1 项（收入 / EBITDA）和第 2 项（债务结构）是阻断项：没有它们，投资建议不能从「跟踪」推进到「可投资」。
