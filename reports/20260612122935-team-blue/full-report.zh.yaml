      - number: '1.3'
        title: 资本结构与投资人生态
        blocks:
          - type: paragraph
            body: >-
              team.blue 是一家 PE 支持的私营公司，没有公开申报义务，外部观察者很难看清其精确债务和股权结构。已披露的三家机构投资人是 Hg Capital（主导且最大投资人，自 2018 年 12 月 /
              2019 年 6 月以来投资）、CPP Investments（Canada Pension Plan Investment Board，重要少数股权，约 20%，2024 年 7 月 10 日宣布）和
              Sofina（比利时上市投资公司，少数股权，2024 年 7 月 22 日宣布）。Jonas Dhaenens（创始人兼总裁）和 Ali Niknam（TransIP
              联合创始人）仍是基石投资人，与更广泛的管理团队一起持有有意义的股权。CPP Investments 交易时，Hg 管理约 $70 billion AUM；截至 2024 年 3 月 31 日，CPP
              Investments 总基金规模为 $632.3 billion，两家支持方都有长期资金周期和深口袋。CPP Investments 交易由为 Hg 和 team.blue 提供法律顾问的 Linklaters
              确认，公司估值 €4.8 billion，意味着 Hg 自 2019 年初始合作以来实现 8 倍回报。按 Linklaters 披露，该交易对应 CPP 约 20% 持股。CPP 之后仅 12 天，Sofina
              加入；Sofina CEO Harold Boël 称，这笔投资是在支持「我们关注行业和地域中最强的公司、企业家和投资人」。CPP 交易顾问包括 Arma
              Partners、EY、Bain、Deloitte、Linklaters 和 BearingPoint（team.blue 一方）；Harris Williams、KPMG、MacFarlanes 和
              Norbruis Clement（股东一方）；以及 Kirkland & Ellis、JP Morgan、OC&C 和 KPMG（CPP Investments 一方）。债务规模、EBITDA
              倍数和利息覆盖结构均未披露。Bloomberg 2026 年 3 月 23 日报道称，team.blue 取消了一项分两部分的杠杆贷款重新定价交易，确认存在杠杆资本结构，但总规模和期限仍不透明。
