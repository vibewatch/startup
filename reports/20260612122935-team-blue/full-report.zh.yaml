      - number: '7.5'
        title: 治理、财务不透明与客户流失风险
        blocks:
          - type: paragraph
            body: >-
              team.blue 的治理风险首先是信息获取和披露风险：作为私营公司，它按比利时法律无须发布经审计年报（Combell Group NV 只提交简式法定账目）；新闻稿、投资者材料或 Hg Capital
              文件也没有披露收入、EBITDA、毛利率、现金流、债务规模或客户层面的单位经济。任何潜在投资人、买方或贷款人都会因此遇到重大尽调缺口。Bloomberg 2026 年 3
              月报道的贷款重新定价失败，只通过新闻文章披露，不是 team.blue 或 Hg 直接披露——这暗示向信贷市场披露的信息和向潜在股权伙伴披露的信息之间存在落差。Sofina 少数股权投资（2023 年宣布）和
              CPP Investments 的重大少数股权投资（€4.8 billion，2024 年 7 月）都被表述为“支持增长战略”，但没有配套财务指标——这种不透明披露模式限制了外部独立验证投资逻辑假设的能力。

              多个品牌的客户满意度风险已有独立记录。SmartCustomer 汇总的已验证评论给 one.com 打出 1.3/5
              星——在欧洲主要主机品牌中处于最低一档——投诉集中在任意调整账单、重新划分存储配额导致用户被迫升级套餐、取消流程困难，以及平台迁移造成数据丢失。SmartCustomer 基于已验证评论给 123-Reg 打出
              2.1/5 星，问题包括 DNS 错误、支持响应差和域名注册做法。123-Reg 是 GoDaddy 品牌，不是 team.blue 品牌，但客户投诉分类（账单不透明、锁定效应、数据丢失）与 one.com
              的画像方向一致，反映多品牌主机模式的系统性风险。HostAdvice 对 one.com 的详尽专家评测也确认了账单和支持质量上的客户侧运营风险。team.blue 自身 2026 年一季度 ESG
              亮点提到，已在多个品牌部署 AI 驱动支持工具以控制成本，这可能削弱人工升级处理能力——在传统品牌推进成本优化时进一步放大满意度风险。ESG 报告没有披露 NPS、流失率或
              ARPU，也印证了上文的治理不透明。人员与执行风险包括创始人兼总裁 Jonas Dhaenens 的关键人集中度：他是主要 M&A 交易推动者，而公司没有披露这个“收购方—运营方”角色的继任计划；该角色正是
              buy-and-build 投资逻辑的核心。
