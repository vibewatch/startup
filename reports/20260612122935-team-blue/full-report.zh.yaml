      - number: '8.2'
        title: 收入倍数分析与上市可比公司组
        blocks:
          - type: paragraph
            body: >-
              team.blue 不披露财务结果，因此任何收入倍数分析都必须先估算分母。自下而上的估算从已披露收购数据拼出收入：Loopia Group 在收购时（2024 年 5 月）贡献约 €65 million
              FY2023 收入（742 MSEK）；Shoptet 2025 年 9 月被收购时收入“远超 €30 million”；Metricool 被收购时（2024 年 9 月）ARR 为 €17
              million。Loopia 并表前约 2.5 million 客户，按欧洲共享主机和域名市场相符的名义 ARPU €100–130/年估算（IONOS 披露 FY2025 收入 €1.316 billion、约
              6 million 客户，对应约 €220 ARPU），核心基础贡献约 €250–325 million。加上 Loopia、Shoptet、Metricool 以及其他 SaaS
              新增资产（iubenda、SimplyBook、Kolsquare、Windsor.ai），粗略合并收入估计为 €400–700 million，中点接近 €550
              million。由于官方披露完全缺失，这一估计置信度低。

              按 €4.8 billion EV 和 €550 million 估算收入（中点）计算，隐含 EV/Revenue 约为 8.7×。若采用低端收入假设（€400 million），倍数升至 12×；若收入为
              €700 million，则降至 6.9×。相对于最接近的欧洲上市同业 IONOS Group SE——其披露 FY2025 收入 €1.316 billion，目标约 40% EBITDA 利润率和 >10%
              CAGR——team.blue 估值隐含的私募市场溢价显得很高。IONOS 按 IPO 定价（€18.50/股、约 115 million 股、约 €2.1 billion
              市值）和当前收入基数估算，直接托管基础设施同业的 EV/Revenue 低于 3×。OVHcloud（Euronext Paris）报告 FY2025 收入 €1.085 billion、EBITDA €438
              million（40.4% 利润率），其估值背景同样显示，基础设施较重的欧洲云服务商在公开市场倍数被明显压缩。

              team.blue 支撑溢价倍数的乐观逻辑包括：（a）Metricool、Kolsquare、iubenda、SimplyBook、Shoptet、Windsor.ai 等收购提高 SaaS
              收入占比——这些都是纯经常性 SaaS 收入流，在私募市场可获得 6–10× 收入溢价；（b）共享基础设施、交叉销售 / 增购和中心化服务带来平台级 EBITDA 杠杆；（c）已验证的 buy-and-build
              飞轮让收入复合增长远高于核心主机基础。悲观逻辑则是：2026 年 SaaS 公司正因 AI 驱动替代风险遭遇倍数压缩，PE 债务市场压力阻碍价值兑现，在没有披露财务证据前，7–12× EV/Revenue
              区间并不成立。
