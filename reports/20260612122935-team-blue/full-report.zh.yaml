      - number: '4.5'
        title: 财务结论——估算框架与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              team.blue 的经常性收入画像在结构上有吸引力：订阅驱动、多品牌、地域分散，并已证明能靠收购放大收入。但集团层面没有任何财务披露， 让外部承销判断高度不确定。€450–650M
              的收入估计来自三类相互收敛的信号：（1）自下而上的客户数 / ARPU 三角测算，以 Loopia 披露的 €100/年 为下限、IONOS 公开的 €212/年
              为上限；（2）Loopia（€65M，2023）、 Shoptet（>€30M，2025）和 Metricool（€17M ARR，2024）等 M&A 新闻稿里的收入数据，作为部分组合锚点； （3）€4.8B
              估值暗示 7–10× EV/Revenue，或在利润率接近 IONOS 40% 目标时为 18–25× EV/EBITDA。 这些输入没有一个得到管理层确认，且都可能高估 60+ 品牌的整合完成度、有机增长率和
              ARPU 收敛。已披露的财务信号确认了较高的经常性收入占比； 结合 20 年经营记录和托管行业标准流失基准，可推断客户留存较强；同时，正在扩张的 SaaS 邻接层理应比核心托管有更高 EBITDA 利润率。
              但杠杆资本结构是实质风险：2026 年 3 月贷款再定价失败，暗示现有债务可能存在近期到期或费率结构沉重的问题；在债务规模披露前，无法计算利息覆盖。 主要尽调阻碍包括：（1）最近完整财年的集团合并收入和
              EBITDA；（2）净债务总额、贷款到期结构和当前利率；（3）按分部划分的毛利率（托管 vs SaaS vs 电商）；（4）前 10 大品牌的客户流失和净留存率（NRR）；（5）收购 earnout
              义务和整合资本开支管线。缺少这些输入，收入质量、 利润率路径和资本充足性结论都只能暂定。IONOS 具备参考价值，但边界清楚：IONOS 以有机增长为主、公开上市，且没有显著杠杆债务；team.blue 的
              buy-and-build 复杂度和 PE 资本结构，使 EBITDA 向自由现金流转换的可预测性明显更弱。2024 年 7 月交易中的 €4.8B 估值， 是目前最好的价值锚点；但交易距今已超过 18
              个月，信贷环境已收紧，贷款再定价失败是反向信号，任何资本承诺前都需要明确披露。
