  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History, July 2024 Transaction, and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              team.blue's July 2024 €4.8 billion valuation rests on three disclosed institutional transactions. First,
              Hg Capital invested in Combell Group in December 2018 (succeeding Waterland, which had grown the business
              tenfold via 17 acquisitions in five years), and then structured the June 2019 merger of Combell with
              TransIP Group to form team.blue serving 1.2 million customers at founding. Second, Hg made a further
              equity investment in July 2022 to fund product expansion and European M&A, with HGT's stake mark
              increasing by £16.4 million that year. Third — and most material — CPP Investments (Canada Pension Plan
              Investment Board, managing a C$632 billion fund) acquired approximately 20% of team.blue on 10 July 2024
              in a transaction valuing the company at €4.8 billion, confirmed by the legal advisors Linklaters who
              described it as "one of the largest privately owned technology companies in Europe." Sofina, the Belgian
              family investment company (Euronext Brussels listed, 125-year history), made an additional minority
              investment on 22 July 2024 at the same €4.8 billion mark. Hg remained the largest single shareholder
              throughout. Founders Jonas Dhaenens (President) and Ali Niknam (TransIP co-founder) remain cornerstone
              investors alongside a broad management equity pool.

              The €4.8 billion mark implies an 8× return on Hg's 2019 entry, which in turn implies a rough founding
              valuation of approximately €600 million for the combined Combell+TransIP entity at the time of the 2019
              merger. The buy-and-build programme — more than 150 acquisitions since inception, 150+ M&A events led
              personally by Jonas Dhaenens, the most recent being Saleskit in early 2026 — drove the value appreciation
              through both organic growth and platform-level EBITDA leverage.

              One material adverse signal emerged in March 2026: Bloomberg (via CBInsights) reported that team.blue
              scrapped a planned two-part deal to amend, extend, and reprice its existing leveraged loans. This confirms
              that a leveraged capital structure exists but the total quantum, maturity, interest rate, and covenant
              package have never been publicly disclosed. The scrapped repricing was cited alongside Dedalus (which
              paused a €1.3 billion leveraged loan) as evidence of broader European software PE debt market stress. Bain
              Capital estimated approximately 40% of buyout assets are exposed to software businesses facing AI-driven
              model risk in 2026.
