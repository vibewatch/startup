        title: Named Customer Proof and Production Deployment
        blocks:
          - type: paragraph
            body: >-
              team.blue's public customer evidence is largely confined to a small set of named testimonials on brand
              websites and the group's customers portal. The strongest outcome-anchored proofs are at the brand level.
              SimplyBook.me customer Permanent Makeup Budapest documented a no-show rate reduction from approximately
              15% to 5% — a 67% improvement — directly attributable to automated booking reminders and 24/7
              availability. This is a rare instance of a quantified outcome in team.blue's public evidence, and it
              validates the service-business appointment model. At the infrastructure tier, Pipa (described as a
              managed-hosting customer) reported a "quick and painless" migration to a hybrid environment with "no
              impact on customers," while Benerail (Virtual Servers, Managed Kubernetes, Cloud Solutions) cited
              team.blue's ability to advise on scalable infrastructure for continued growth, and Molokini used VPS,
              CAT2, and Shared Hosting.

              Enterprise-tier proof is strongest at Kolsquare, whose named clients include globally recognised brands
              (Coca-Cola, Netflix, Sony Music, Publicis, Sézane, Sephora, Lush, Hermès) with specific testimonials on
              influencer discovery accuracy, data-driven selection confidence, and time savings of 250+ hours per user.
              These are mid-market to enterprise buyers, distinct from the SMB base, using Kolsquare as a campaign
              intelligence platform. Shoptet's testimonials and independent review positioning as "most intuitive" Czech
              e-shop builder support its 90%+ satisfaction claim, though no independent review-platform score
              corroborating that figure was located in public sources. Overall, the named customer proof set
              demonstrates real production deployments across at least four distinct use cases (appointment booking,
              managed infrastructure, influencer marketing, e-commerce), but the depth and freshness of case studies at
              the group's core hosting brands (one.com, Combell, TransIP, 123-reg) is thin, relying on legacy brand
