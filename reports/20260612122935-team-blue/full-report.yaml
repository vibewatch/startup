  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Compliance Risk — GDPR, NIS2, Data Act, and AI Act
        blocks:
          - type: paragraph
            body: >-
              team.blue's 3.3 million SMB customers across 22 EU and EEA countries place it firmly within scope of every
              major European digital regulation. GDPR (Regulation (EU) 2016/679) has been fully enforceable since May
              2018; as a processor and controller of customer personal data — including billing records, website
              content, email metadata, and marketing profiles — team.blue carries both direct GDPR liability (processor
              obligations) and indirect liability for data breaches affecting end-customers. GDPR Article 83 sanctions
              reach up to €20 million or 4% of global annual turnover for the most serious infringements, whichever is
              higher. The company processes data for millions of SMBs across national supervisory authority
              jurisdictions with materially different enforcement vigour. team.blue's privacy policy confirms data is
              stored in European data centres and commits to GDPR-compliant processing, but no independent audit or
              certification of that commitment has been published.

              NIS2 (Directive (EU) 2022/2555) replaced NIS1 from 18 October 2024 and explicitly covers digital
              infrastructure providers, DNS service providers, top-level domain registries, and cloud computing service
              providers. team.blue — operating domain registries, shared hosting, and cloud infrastructure — is an
              "essential entity" or "important entity" under NIS2 in multiple member states. As of January 2026, the
              European Commission proposed targeted amendments to NIS2 to increase legal clarity, and a simplification
              package was in progress. NIS2 mandates risk management measures, incident reporting within 24 hours of
              discovery, board-level accountability for cybersecurity, and supply-chain security. Non-compliance can
              attract fines of up to €10 million or 2% of global turnover for important entities, and up to €10 million
              or 2% for essential entities — with actual sanctions administered by national competent authorities whose
              implementation pace varies. The Data Act (Regulation (EU) 2023/2854) entered application on 12 September
              2025; its data-portability and cloud-switching obligations directly affect team.blue as a cloud-service
              provider, and its prohibition of unfair contractual terms constrains the upsell and lock-in practices
              reported by customers. The EU AI Act (Regulation (EU) 2024/1689), with a political agreement reached on
              simplified implementation in May 2026, will apply to AI systems integrated into team.blue's product stack
              — Macaly (AI website builder), Windsor.ai (data integration), and the AI-powered support tools. AI Act
              compliance, including conformity assessments for any high-risk use cases, creates incremental compliance
              cost and potential product redesign risk.
