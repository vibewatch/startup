      - number: '7.5'
        title: Governance, Financial Opacity, and Customer Churn Risk
        blocks:
          - type: paragraph
            body: >-
              team.blue's governance risk is primarily an information-access and disclosure risk: as a private company,
              it is not required to publish audited annual accounts under Belgian law (Combell Group NV files
              abbreviated statutory accounts), and no press release, investor presentation, or Hg Capital filing
              discloses revenue, EBITDA, gross margin, cash flow, debt quantum, or customer-level unit economics. This
              opacity creates a material due-diligence gap for any prospective investor, buyer, or lender. The March
              2026 Bloomberg-reported loan repricing failure was disclosed only through a news article, not by team.blue
              or Hg directly — suggesting a gap between what is disclosed to credit markets and what is disclosed to
              potential equity partners. Sofina's minority investment (announced 2023) and CPP Investments' significant
              minority (€4.8 billion, July 2024) were both cited as "supporting growth strategy" without financial
              metrics — a pattern of opaque reporting that limits independent verification of investment thesis
              assumptions.

              Customer satisfaction risk is documented independently across multiple brands. SmartCustomer aggregates
              verified reviews giving one.com 1.3 out of 5 stars — one of the lowest ratings among major European
              hosting brands — driven by complaints about arbitrary billing changes, storage-quota reclassification
              forcing involuntary plan upgrades, difficult cancellation processes, and data loss from platform
              migrations. SmartCustomer gives 123-Reg 2.1 out of 5 stars based on verified reviews citing DNS errors,
              poor support response, and domain registration practices. While 123-Reg is a GoDaddy brand rather than a
              team.blue brand, the customer complaint taxonomy (billing opacity, lock-in, data loss) is directionally
              consistent with one.com's profile and reflects systemic risks in the multi-brand hosting model. HostAdvice
              gives one.com a detailed expert review confirming customer-facing operational risks in billing and support
              quality. team.blue's own ESG Q1 2026 highlights mention AI-driven support tools deployed across brands to
              manage costs, which may reduce human-escalation capacity — compounding satisfaction risk at legacy brands
              undergoing cost optimisation. The ESG report does not disclose NPS, churn, or ARPU metrics, confirming the
              governance opacity described above. People and execution risk includes key-person concentration on Jonas
              Dhaenens as founder-president and primary M&A dealmaker, with no disclosed succession plan for the
              acquirer-operator role that is central to the buy-and-build thesis.
