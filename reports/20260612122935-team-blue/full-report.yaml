  - id: FV004
    title: Investment KPIs — IC-Ready Scoring Across Seven Dimensions
    type: kpi
    layout: standard
    summary: >-
      Seven-dimension investment committee scoring for team.blue at the June 2026 research date. Scale 1–10 (10=best).
      Market position, moat, and scale score well; financial proof and evidence quality pull the composite down.
    data:
      items:
        - label: Market Position
          value: 7
          note: Largest private European SMB digital enabler; top-10 in 10 markets; 3.3M customers
        - label: Revenue Growth Proof
          value: 3
          note: No financial disclosure; growth inferred from M&A cadence only; denominator estimated
        - label: Moat Strength
          value: 7
          note: 150+ acquisitions, local brand loyalty, switching cost from hosting + domain lock-in, 20-yr track record
        - label: Unit Economics
          value: 3
          note: ARPU, NRR, CAC, and EBITDA margin undisclosed; proxy from IONOS suggests 35–40% EBITDA possible
        - label: Risk Profile
          value: 4
          note: Leverage opacity (scrapped repricing), AI disruption to core hosting, PE exit freeze in 2026
        - label: Valuation Assessment
          value: 4
          note: €4.8B mark at estimated 7–12× EV/Revenue; stretched vs. public comps at 2–3×; may be fair if revenue ≥€750M
        - label: Evidence Quality
          value: 3
          note: >-
            No financial disclosure, no public filings, one adverse leverage signal; heavily reliant on official press
            releases
    approximationNotes: >-
      Scores are subjective assessments by the research analyst based on publicly available evidence as of June 2026.
      Each dimension is scored 1–10 relative to investment-grade SMB SaaS/platform businesses at similar stage and
      scale. Composite = simple mean = 4.4/10.
