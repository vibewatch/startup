      - number: '8.4'
        title: Recommendation, Confidence, and Thesis Assessment
        blocks:
          - type: paragraph
            body: >-
              The investment recommendation for team.blue at the current €4.8 billion mark is "research more / track":
              do not commit capital until the three critical undisclosed data points are resolved — (1) revenue and
              EBITDA with vintage and segment breakdown, (2) total leveraged debt quantum, maturity date, and covenant
              package, and (3) equity waterfall and preference stack. Confidence in the current mark is low, and the
              risk rating is high. The valuation stance is "stretched-to-fair pending disclosure": stretched if revenue
              is at or below €550 million, fair only if revenue exceeds €750 million with EBITDA margins above 37%.

              The investment thesis is compelling at the asset level: team.blue is the largest private European SMB
              digital enabler by customer count, spans 22 countries with 60+ brands in defensible local positions,
              benefits from a proven buy-and-build playbook led by a strong management team, and has attracted two
              world-class institutional LPs (CPP and Hg) with very long time horizons. The platform's pivot to
              AI-powered tools (Macaly, Windsor.ai) and the SaaS cluster (Metricool, Kolsquare, Shoptet) provide a
              credible growth optionality narrative.

              The anti-thesis is equally compelling: the company has never disclosed revenue, EBITDA, or its leverage
              profile, making the €4.8 billion mark impossible to validate from the outside. The March 2026 Bloomberg
              adverse report on a scrapped leveraged loan repricing is the single most material risk signal in this
              research — it confirms leverage exists and that the market was reluctant to extend it on better terms. In
              a 2026 environment where PE software marks are under pressure (Hg's Visma IPO delayed; EQT/TA Associates
              exits stalled), team.blue's next liquidity event depends critically on how the debt market evolves and
              whether growth trajectory warrants a premium multiple.
            claimRefs:
              - CV001
