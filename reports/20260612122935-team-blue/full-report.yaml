      - number: '2.2'
        title: Market Sizing and Competitive Revenue Scale
        blocks:
          - type: paragraph
            body: >-
              No authoritative third-party research on the European-only SMB hosting and digital-presence TAM was
              accessible during this research. The sizing below is constructed from multiple proxy lenses and should be
              treated as evidence-derived ranges rather than quoted market figures. The best anchor is IONOS Group — the
              only publicly listed pure-play European SMB hosting provider — which reported €1.316 billion in total
              revenue for 2025 across 17 markets, growing 5.5% year-over-year with a medium-term 10% CAGR target. If
              IONOS holds approximately 20–30% of the broader European SMB hosting market (plausible given its claimed
              51% German and 21% Spanish market positions), the total European SAM would lie in the €4–6 billion range,
              with an upside scenario including website-builder and ecommerce-SaaS adjacencies of €7–8 billion. The
              global web hosting market was projected at approximately $192.85 billion in 2025 growing at 19.7% CAGR to
              $355.81 billion by 2029 — a figure encompassing hyperscale cloud and enterprise hosting alongside SMB
              shared hosting, and should not be used as a proxy for European SMB alone. For reference, GoDaddy — the
              US-headquartered global incumbent — reported $4.951 billion in 2025 revenue, while Wix reported
              approximately $2 billion in its most recent period, both primarily reflecting non-European revenue.
              team.blue's SOM is bounded by its 3.3 million current customers versus IONOS's 6.2 million, suggesting
              roughly 35–45% of IONOS's customer reach — which at IONOS-equivalent ARPU would imply a SOM of €0.8–1.5
              billion. All sizing estimates carry material uncertainty; the absence of a disclosed team.blue revenue
              figure is a blocking diligence gap that prevents anchoring the €4.8 billion valuation to a concrete
              multiple.
