      - number: '1.5'
        title: Adverse Signals, Disclosure Opacity, and Customer Friction
        blocks:
          - type: paragraph
            body: >-
              Three categories of adverse signal warrant scrutiny. First, leverage opacity: a Bloomberg report published
              March 23, 2026, and cached at CBInsights, disclosed that team.blue "scrapped a planned two-part deal to
              amend, extend and reprice existing loans" — placing it alongside German healthcare software firm Dedalus
              (which paused a €1.3 billion leveraged loan) as a European software PE vehicle under debt market pressure.
              Neither the total debt quantum, cost of debt, loan maturity, nor covenant structure is publicly disclosed.
              Bain Capital estimated approximately 40% of PE buyout assets are exposed to software businesses facing
              AI-driven model risk. Second, customer reviews: one.com (a team.blue brand serving Western Europe)
              averaged 1.3 stars out of 5 on SmartCustomer.com based on multi-year review aggregation, with complaints
              centring on arbitrary price increases, forced storage-tier upgrades, and cancellation friction —
              indicating customer satisfaction challenges across at least some brands. 123-Reg (another team.blue brand
              in the UK) showed 2.1 stars on SmartCustomer.com. HostAdvice similarly noted mixed expert and user ratings
              for one.com. Third, financial disclosure opacity: team.blue has never publicly disclosed revenue, EBITDA,
              customer churn, or margin. The €4.8 billion valuation is a transaction marker, not a recurring-reporting
              figure, and the company carries no obligation to disclose under current private-company rules. These
              adverse signals do not constitute confirmed impairment but materially constrain outside investors' ability
              to verify growth claims or financial health independently.
            claimRefs:
              - CO031
              - CO032
