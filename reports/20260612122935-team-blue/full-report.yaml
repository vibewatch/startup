      - number: '6.2'
        title: Adoption Trajectory and Brand-Level Evidence
        blocks:
          - type: paragraph
            body: >-
              team.blue's consolidated customer count has grown continuously since the Combell–TransIP merger in June
              2019 (1.2 million customers at formation), reaching 2.5 million before the Loopia Group acquisition in May
              2024, then crossing 3 million post-Loopia and stabilising at 3.3 million by the time of the CPP
              Investments deal in July 2024 — a figure consistently cited in every press release through April 2026.
              This unbroken 20-year growth trajectory (counting Combell's founding in 1999) is presented by team.blue
              and Hg Capital as evidence of category resilience and compounding network density, with the company having
              completed more than 150 acquisitions since 2019.

              Brand-level customer evidence provides stronger signal than the consolidated group headline. Metricool,
              acquired September 2024, arrived with 2 million-plus users and €17M ARR, demonstrating product-led growth
              in social media management; within 18 months of joining team.blue, Kolsquare grew from ~35 to 140
              employees, completing three acquisitions, confirming team.blue's post-M&A acceleration thesis. iubenda's
              150,000+ compliance customers (acquired pre-2024) represent a sticky horizontal layer across all website
              and app builders in the portfolio. Shoptet, acquired September 2025, operates at revenues exceeding €30M
              with 47,000+ active stores, a 90%+ customer satisfaction score, and 43 million orders processed annually,
              making it the group's strongest quantified proof point for customer engagement outside of raw headcount.
              123-reg hosts 1.7 million websites (UK market) after 25 years, and one.com describes "millions of
              customers for two decades" — longevity evidence that supports subscription stickiness claims, even as
              independent review evidence (see Section 4) indicates meaningful complaint volumes. The Saleskit
              acquisition (March 2026, CEE B2B sales intelligence) serves 3,000+ customers and 25,000 users, extending
              team.blue's reach into CEE B2B sales workflows. AI integrations across SimplyBook.me, iubenda, Windsor.ai
              (330+ data sources), and Macaly (AI app builder) are being embedded across all brands in 2026, with the
              stated goal of accelerating SMB digital adoption.
