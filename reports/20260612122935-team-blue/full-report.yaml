      - number: '6.4'
        title: Retention, Satisfaction, and Adverse Customer Signals
        blocks:
          - type: paragraph
            body: >-
              The sole publicly disclosed NPS figure in team.blue's ecosystem is Combell's 76 (Q1 2026 ESG impact
              report), benchmarked as high by Combell's own framing. No group-level NRR, GRR, cohort retention, churn
              rate, average contract length, or revenue per customer data has been disclosed by team.blue or Hg Capital
              in any press release, investor communication, or public filing reviewed during this research. The absence
              of these figures is a material diligence gap, as the company's subscription-led model's durability cannot
              be independently verified.

              Independent review platform evidence is significantly adverse for several key brands. SmartCustomer awards
              one.com 1.3 stars (very low) across a broad set of reviews spanning 2023–2025, with recurring themes
              including: arbitrary price increases mid-contract, forced package upgrades tied to backup-storage
              accounting changes, billing for services not ordered, deliberate friction in cancellation (requiring
              printed and signed domain-transfer forms), and extremely difficult domain transfer processes that multiple
              reviewers describe as "intentional." SmartCustomer rates 123-reg 2.1 stars, with complaints spanning email
