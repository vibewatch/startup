      - number: '3.2'
        title: European Regional Competitors — OVHcloud and Aruba
        blocks:
          - type: paragraph
            body: >-
              OVHcloud (Euronext Paris: OVH) is France's and Europe's self-described leading cloud provider, reporting
              €1.085 billion in FY2025 revenue and €438 million in adjusted EBITDA (40.4% margin). The company operates
              46 data centers on 4 continents, runs more than 400,000 servers, and serves 1.6 million customers. Founded
              in 1999 by Octave Klaba, OVHcloud distinguishes itself through a fully vertically integrated model — it
              designs and manufactures its own servers — giving it structural cost and sovereignty advantages relative
              to resellers. OVHcloud's customer base skews more toward developers and sovereignty-conscious enterprises
              than pure SMBs, and its web hosting product line (shared hosting for SMBs, VPS for mid-market, dedicated
              for enterprise) is secondary to its public-cloud business. The company holds ISO 27001, ISO 27701, HDS,
              and SecNumCloud certifications — none of which team.blue holds — positioning it for French public-sector
              and regulated-industry buyers where team.blue has no certified competing offer. A significant adverse
              event was the March 2021 destruction of OVHcloud's SBG2 data center in Strasbourg by fire, which took all
              services offline and caused irrecoverable data loss for some accounts without off-site backups,
              reinforcing SMB buyer attention to backup and recovery SLAs for all European hosting providers. The
              strategic divergence is clear: team.blue competes in SMB breadth and compliance SaaS bundles; OVHcloud
              competes on infrastructure, sovereignty certifications, and developer trust. Their buyer archetypes
              overlap only in the SMB web-hosting segment where OVHcloud's shared hosting targets blogs, small sites,
              and e-commerce — the same buyer team.blue brands serve.

              Aruba S.p.A. (aruba.it) is Italy's leading hosting and trust-services provider and team.blue's closest
              direct regional rival in Southern Europe, particularly for the Register.it customer base team.blue
              acquired. Aruba offers hosting, WordPress, domains, SSL, email, e-commerce, PEC (certified email), remote
              digital signatures, and cloud services. Netcraft named Aruba the most reliable hosting company site in
              2022. Aruba is a private company with undisclosed revenue, making direct financial comparison impossible.
              Aruba's PEC certified email and digital signature services are legally mandated in Italy, creating a
              compliance moat that team.blue's Register.it must compete against — a high-value recurring-revenue product
              with regulatory barriers to substitution. Aruba's Italy-only moat means team.blue does not face it in any
              other European market, but the Italian market is material given Register.it's historical position there.
