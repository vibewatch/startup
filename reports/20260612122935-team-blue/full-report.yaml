      - number: '3.3'
        title: Substitute and Status-Quo Competitors — Wix, Squarespace, Hostinger, DIY
        blocks:
          - type: paragraph
            body: >-
              Wix.com Ltd (NASDAQ: WIX) is the world's leading SaaS website-builder platform with 260+ million
              registered users, 85,000+ new websites created daily, and approximately $2 billion in annual revenue.
              W3Techs data from June 2026 shows Wix at 4.3% global hosting share — ahead of GoDaddy's 2.5% and
              Squarespace's 2.5% — primarily because its builder-native platform captures a large share of new site
              creation for non-technical buyers who do not need a traditional hosting relationship. Wix competes as a
              full-stack substitute combining AI-powered design, built-in e-commerce, SEO tools, and Wix Studio for
              agencies. Wix's European revenue was approximately 26% of total as of Q3 2022 — the last disclosed
              geographic breakdown — implying roughly €400–500M in European revenue equivalent. Wix's AI website
              generator competes directly with team.blue's Macaly, and the builder-native model can bypass the
              traditional domain-then-hosting purchase funnel by removing the need for a separate hosting vendor
              entirely. Wix's freemium conversion rate of approximately 2.5% (from ~238M registered users to ~6M paid)
              shows the platform accepts high CAC in exchange for volume, a model team.blue's recurring-subscription
              brands cannot match.

              Squarespace was taken private by Permira in 2024; prior to the deal it was valued at approximately $7.4
              billion at its 2021 NYSE IPO. W3Techs June 2026 shows Squarespace at 2.5% global hosting share.
              Squarespace's strength is in design-led English-language markets (US, UK, Canada, Australia) — it does not
              rank in the top five in France or Germany — making it a secondary competitive threat in Continental Europe
              where team.blue and IONOS dominate. Squarespace had 1,760+ employees and offers premium-tier pricing from
              approximately $16 per month, with no freemium tier.

              Hostinger is a Lithuanian private company that reported consolidated revenue growth of 57% YoY to €110.2
              million for FY2023 and reached 3 million clients and 5 million managed domains by mid-2024. Critically,
              590,000 of 914,000 new websites in H1 2024 were created using Hostinger's AI builder — the highest AI
              adoption rate of any comparable SMB hosting operator disclosed publicly — signalling that AI-first players
              can rapidly steal market share from traditional operators. HostingAdvice 2026 data ranks Hostinger at
              approximately 3.7% global hosting share, ahead of Wix (3.5% in that dataset) and GoDaddy (2.5%),
              demonstrating that the Lithuanian private company has already displaced traditional incumbents in
              site-count terms. Hostinger competes primarily on price (entry plans below €2 per month) and AI tools, not
              European compliance or local-language support.

              The status-quo alternative for any SMB buyer is retaining a dormant legacy account, using social media as
              the primary digital presence, or relying on freemium tiers (Wix free, Google Sites). team.blue's Digital
              Maturity Report found 30% of European small businesses do not know which digital tools to use and 26% cite
              lack of skills or confidence, confirming that inertia and the status quo are often the real competitor
              rather than a named vendor.
