      - number: '4.3'
        title: Comparative Benchmarks — IONOS, OVHcloud, GoDaddy, and Wix
        blocks:
          - type: paragraph
            body: >-
              The closest publicly disclosed financial benchmark is IONOS Group SE (Frankfurt: IOS1), which reported
              €1.316 billion in total revenue for FY2025 (+5.5% YoY) and targets a medium-term revenue CAGR of
              approximately 10% and EBITDA margin progressively reaching ~40%. IONOS serves 6.2 million customers —
              approximately 2.9 million more than team.blue — across 17 European and North American markets, and its
              equity story discloses ~80% recurring revenue and ~90% EBITDA-to-free-cash-flow conversion. IONOS's
              business model page describes it as "highly scalable, asset-light… with attractive margins, excellent
              visibility, and high cash conversion" — a financial archetype that hosting-centric operators like
              team.blue structurally approximate. OVHcloud (Euronext Paris: OVH) reported €1.085 billion in FY2025
              revenue with €438 million in adjusted EBITDA (40.4% margin), serving 1.6 million customers across 46 data
              centers. OVHcloud's vertically integrated model carries higher capex intensity than shared-hosting
              platforms, making it a partial comparable only. GoDaddy Inc. (NYSE: GDDY) reported $4.951 billion in
              FY2025 revenue and serves 20 million customers globally with 84 million+ managed domains; its scale and
              US-centric model limits direct comparability with team.blue's European SMB focus but anchors the global
              market floor. Wix (NASDAQ: WIX) generates approximately $2 billion in annual revenue from 260+ million
              registered users, with 4.3% global hosting market share per W3Techs June 2026 data. The key inferential
              step is that team.blue, with 3.3 million customers, sits between IONOS (6.2M) and OVHcloud (1.6M) in
              customer scale. Applying IONOS's ARPU of ~€212/year to team.blue's 3.3M base yields ~€700M — a ceiling.
              Applying Loopia's disclosed ARPU of ~€100/ year yields ~€330M — a floor. The blended estimate of €450–650M
              reflects team.blue's mix of higher-ARPU Benelux/Nordic/Western European markets, the growing SaaS
              adjacency layer (Metricool, iubenda, Shoptet), and lower-ARPU CEE additions (Loopia
              Slovakia/Hungary/Serbia, Shoptet Czech/Slovak). At IONOS's disclosed ~40% EBITDA margin, team.blue's
              EBITDA could be €180–260M on the midpoint revenue estimate. However, team.blue carries higher M&A
              integration costs, earnout structures, and — crucially — a leveraged capital structure that IONOS does not
              carry at the same debt/equity ratio. The €4.8B valuation implies a transaction multiple of approximately
              18–25× forward EBITDA if EBITDA is €190–270M, or approximately 7–10× revenue on the €450–650M revenue
              range, consistent with premiums paid for recurring-revenue European tech platforms in 2024.
