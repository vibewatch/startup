      - number: '7.4'
        title: Market Commoditisation, Platform Dependency, and Vendor Stack Risk
        blocks:
          - type: paragraph
            body: >-
              team.blue's core SMB hosting and domain business operates on three deeply embedded platform dependencies:
              WordPress (43.9% of all websites globally per W3Techs June 2026), PHP (the underlying runtime for
              WordPress and most shared-hosting stacks), and VMware (virtualisation for managed-infrastructure services
              delivered through Curanet, Proserve, and Combell). Each dependency creates a distinct risk vector.

              WordPress/PHP dependency: team.blue joined the PHP Foundation as Gold Sponsor in January 2026, confirming
              that PHP is foundational to its hosting stack. Any major vulnerability, deprecation, or hostile fork in
              WordPress or PHP — which powers approximately 75% of all websites — could require emergency remediation
              across all 60+ brands simultaneously. WordPress's plugin ecosystem (60,000+ plugins) represents a
              significant supply-chain attack surface that cannot be controlled or audited at scale by team.blue or its
              customers.

              VMware/Broadcom vendor restructuring risk: In late 2023, Broadcom completed its acquisition of VMware and
              significantly restructured the partner programme, removing many partners from direct transaction rights.
              team.blue — through Curanet, Proserve, and Combell — retained VMware Pinnacle Partner status (one of ~100
              worldwide), enabling it to act as the authorised route for displaced partners. This creates a double-edged
              dependency: team.blue is now exposed to Broadcom's continuing partner-programme decisions, licence
              pricing, and support quality. The April 2027 agreement expiry for displaced partner transitions means
              team.blue faces both an opportunity (consolidation of partner workloads) and a risk (partners may choose
              to migrate to alternative hypervisors — KVM, Proxmox, or Nutanix — rather than consolidate through
              team.blue's infrastructure). Team.blue's own analysis confirmed no alternative hypervisor matched VMware
              on maturity, ecosystem depth, or operational stability when migration cost is factored in — but this
              assessment may become outdated as VMware licence prices rise under Broadcom's ownership.

              Market commoditisation risk from AI-first builders is also material: Hostinger's AI builder captured
              590,000 of 914,000 new websites in H1 2024; Wix held 4.3% global hosting share; and team.blue's own Macaly
              AI builder is competing against established AI-native platforms that have larger user bases, longer
              development histories, and lower customer acquisition costs. IONOS, the most direct public comparable,
              targeted 10% revenue CAGR with ~40% EBITDA margin — a profile that implies aggressive price discipline
              across the European SMB hosting market.
