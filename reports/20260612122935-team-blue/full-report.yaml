      - number: '4.4'
        title: Capital Structure, Leverage Opacity, and Financing Risk
        blocks:
          - type: paragraph
            body: >-
              team.blue's capital structure is the most consequential undisclosed financial variable for any
              underwriting exercise. The company is PE-backed with Hg Capital as primary and largest investor since
              December 2018, CPP Investments holding approximately 20% since July 2024, and Sofina as a minority
              co-investor since July 22, 2024. Jonas Dhaenens and Ali Niknam remain cornerstone equity investors. The
              existence of a leveraged loan facility is confirmed by a March 23, 2026 Bloomberg report, cached at
              CBInsights, which disclosed that team.blue "scrapped a planned two-part deal to amend, extend and reprice
              existing loans" — placing it alongside German healthcare software company Dedalus (which paused a €1.3
              billion leveraged loan on rising investor unease) as a European software PE vehicle facing credit market
              friction. The report attributed the broader deal-market tension to investor concern about software/SaaS
              valuations in the context of AI disruption, noting that "firms including Triton Partners, Warburg Pincus
              and Brookfield have been raising new funds" for non-software assets. The failed repricing attempt
              indicates that lenders or investors demanded terms team.blue found unacceptable in March 2026, but the
              total quantum of debt, the existing interest rate, maturity date, and any covenant thresholds remain
              wholly undisclosed. PE platform businesses of team.blue's scale typically carry 4–7× net debt/EBITDA at
              acquisition and are refinanced at formation and on each secondary. Hg portfolio companies "consistently
              grow revenues at more than 20% annually" per Hg's own description. If team.blue's EBITDA is in the
              €190–270M range and leverage is 4–6× EBITDA, total debt could be €760M–€1.6B. The failed repricing signals
              that the existing loan terms include a repricing premium or covenant structure that became burdensome in
              the March 2026 credit environment, but confirmed no default, breach, or covenant violation. No public
              rating from Moody's, S&P, or Fitch has been identified. As a Belgian-incorporated private entity,
              team.blue carries no continuous EU or national-level financial reporting obligation that would force
              disclosure. The August 2024 CPP and Sofina transactions each required regulatory approval in their
              respective jurisdictions, but no detailed financial disclosures were required or published. Hg managed
              approximately $70 billion in AUM at the time of the CPP deal, providing ample fund-level capital to
              support team.blue — but fund-level liquidity does not eliminate entity-level refinancing risk,
