      - number: '1.2'
        title: Founding History, Growth Path, and M&A Strategy
        blocks:
          - type: paragraph
            body: >-
              Jonas Dhaenens founded Combell at age 16 in 1999, bootstrapping a web hosting business in Belgium from
              scratch. After two decades of organic and acquisitive growth — including a Waterland Private Equity
              partnership from ~2013 that saw more than tenfold expansion and 17 bolt-on acquisitions — Hg Capital
              succeeded Waterland in December 2018. Hg's entry at what was then Combell Group was described as its 8th
              investment in the technology services sector. The strategic inflection came on 12 June 2019, when Combell
              and the TransIP Group (founded by Ali Niknam, who also founded bunq, the European neo-bank) merged to
              create team.blue, initially serving 1.2 million customers across five countries. The combined entity
              adopted a pan-European buy-and-build model: between 2019 and 2026, Jonas Dhaenens personally led more than
              150 M&A transactions. Key acquisitions include Zitcom (2017, pre-merger, Denmark market leadership), the
              Register Group (Italy, 2019), Loopia Group (Sweden/Finland/Slovakia/ Czechia/Hungary/Serbia, 650,000
              customers, May 2024), Metricool (social media SaaS, ARR €17M, September 2024), Kolsquare (influencer
              marketing, Q4 2024), Shoptet (e-commerce platform, revenue >€30M, 300+ experts, September 2025), Macaly
              (AI no-code builder, December 2025), Windsor.ai (data integration, January 2026), and Saleskit (B2B sales
              tool, 2026). The Loopia acquisition expanded the customer base from 2.5 million to over 3 million. Hg also
              made a "further investment" in July 2022 to fund product expansion and European M&A, with the investment
              value of Hg Capital Trust's stake rising by £16.4 million in 2022 alone. In September 2025, at the time of
              the Shoptet deal, team.blue's expert count was described as 3,600+ — showing the pace of headcount growth
              through acquisition. A March 2026 Bloomberg-sourced report, cached at CBInsights, disclosed that team.blue
              scrapped a planned two-part deal to amend, extend, and reprice existing leveraged loans, signalling the
              existence of a material leveraged capital structure that the company does not publicly disclose. Revenue
              and EBITDA have never been disclosed by team.blue or Hg in any press release or regulatory filing reviewed
              during this research.
