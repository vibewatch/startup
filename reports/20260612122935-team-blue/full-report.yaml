      - number: '8.2'
        title: Revenue-Multiple Analysis and Public Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Because team.blue does not disclose financial results, any revenue-multiple analysis must begin with an
              estimated denominator. A bottom-up estimate constructs the revenue figure from disclosed acquisition data:
              Loopia Group contributed approximately €65 million in FY2023 revenue (742 MSEK) at acquisition (May 2024);
              Shoptet was acquired in September 2025 with revenue "well exceeding €30 million"; Metricool carried an ARR
              of €17 million at acquisition (September 2024). The pre-Loopia customer base of approximately 2.5 million,
              scaled at a notional ARPU of €100–130 per year consistent with the European shared-hosting and domain
              market (IONOS reported €1.316 billion FY2025 revenue against roughly 6 million customers, implying ~€220
              ARPU), yields a core base contribution of approximately €250–325 million. Adding Loopia, Shoptet,
              Metricool, and other SaaS additions (iubenda, SimplyBook, Kolsquare, Windsor.ai) produces a rough
              consolidated estimate of €400–700 million, with the midpoint near €550 million. This estimate carries low
              confidence given the complete absence of official disclosure.

              At €4.8 billion EV and €550 million estimated revenue (midpoint), the implied EV/Revenue multiple is
              approximately 8.7×. At the low-end revenue assumption (€400 million), the multiple rises to 12×; at €700
              million it falls to 6.9×. Relative to the closest European public peer — IONOS Group SE, which disclosed
              FY2025 revenue of €1.316 billion and targets a ~40% EBITDA margin and >10% CAGR — the private market
              premium implied by the team.blue mark appears substantial. IONOS's estimated EV/Revenue at IPO pricing
              (€18.50/share, ~115 million shares, ~€2.1 billion market cap) against its current revenue base implies a
              sub-3× EV/Revenue ratio for a direct hosted-infrastructure peer. OVHcloud (Euronext Paris) reported €1.085
              billion FY2025 revenue and €438 million EBITDA (40.4% margin) — its valuation context shows similarly
              compressed public multiples for infrastructure-heavy European cloud providers.

              The team.blue bull case for a premium multiple rests on: (a) higher SaaS revenue mix from the acquisitions
              of Metricool, Kolsquare, iubenda, SimplyBook, Shoptet, and Windsor.ai — all pure recurring SaaS revenue
              streams that attract 6–10× revenue premiums in private markets; (b) platform-level EBITDA leverage through
              shared infrastructure, cross-sell upsell, and central services; and (c) a demonstrated buy-and-build
              flywheel that has compounded revenue far above the core hosting base. The bear case is that SaaS
              businesses are facing multiple compression in 2026 due to AI-driven displacement risk, PE debt market
              stress is preventing value realisation, and the 7–12× EV/Revenue range is simply not justified without
              disclosed financial proof.
