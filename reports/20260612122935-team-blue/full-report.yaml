  - id: FV001
    title: Recommendation Logic — Evidence to Recommendation Chain
    type: flow
    layout: wide
    summary: >-
      Chain from platform scale and proof through risk and valuation assessment to the "research more / track"
      recommendation for team.blue at the July 2024 €4.8B mark.
    data:
      nodes:
        - id: scale
          label: Scale Proof
          detail: 3.3M SMBs, 22 countries, 60+ brands, 20-yr track record, top-10 in 10 markets
          tone: positive
        - id: moat
          label: Moat Assessment
          detail: Buy-and-build flywheel, local brand loyalty, 150+ acquisitions, 8× value creation 2019–2024
          tone: positive
        - id: fin-opacity
          label: Financial Opacity
          detail: Revenue, EBITDA, and debt structure never disclosed; multiple estimated only at 7–12×
          tone: negative
        - id: leverage-risk
          label: Leverage Risk
          detail: Scrapped loan repricing (Bloomberg, March 2026) confirms hidden leveraged capital structure
          tone: negative
        - id: market-risk
          label: PE Exit Freeze
          detail: 2026 PE software exit market frozen; Visma IPO delayed; EQT/TA exits stalled
          tone: negative
        - id: valuation-gap
          label: Valuation Gap
          detail: Implied EV/Revenue 7–12× vs IONOS/OVHcloud public comps at 2–3×; gap unjustified without EBITDA proof
          tone: negative
        - id: recommendation
          label: 'RECOMMENDATION: Research More / Track'
          detail: Do not invest at €4.8B without revenue/EBITDA disclosure and debt structure review
          tone: neutral
      edges:
        - from: scale
          to: recommendation
          label: Supports thesis
        - from: moat
          to: recommendation
          label: Supports thesis
        - from: fin-opacity
          to: valuation-gap
          label: Creates uncertainty
        - from: leverage-risk
          to: valuation-gap
          label: Magnifies risk
        - from: market-risk
          to: valuation-gap
          label: Compresses multiple
        - from: valuation-gap
          to: recommendation
          label: Drives track stance
    approximationNotes: null
    claimRefs:
      - CV001
      - CV009
      - CV014
      - CV031
      - CV034
      - CV035
      - CV038
  - id: FV002
    title: Valuation Sensitivity — Implied EV/Revenue at Different Revenue Assumptions
    type: bar
    layout: standard
    summary: >-
      Shows how the implied EV/Revenue multiple for team.blue's €4.8B mark shifts across six estimated annual revenue
      scenarios from €300M to €800M. The IONOS public-comp reference of approximately 2–3× EV/Revenue is shown for
      context.
    data:
      items:
        - label: €300M (very low)
          value: 16
          note: Far above IONOS public comp; implies implausible discount to peers
        - label: €400M (low estimate)
          value: 12
          note: High relative to any public hosting peer; requires exceptional margin proof
        - label: €500M (low-mid estimate)
          value: 9.6
          note: Elevated; possible with heavy SaaS mix premium at 35%+ margin
        - label: €600M (mid estimate)
          value: 8
          note: Stretched but approaching PE private-market precedent for buy-and-build platforms
        - label: €700M (high estimate)
          value: 6.9
          note: Reasonable if disclosed EBITDA margin is 35–40% with high recurring base
        - label: €800M (bull case)
          value: 6
          note: Aligned with Squarespace Permira acquisition range; fair for premium SMB platform
    approximationNotes: >-
      Revenue figures are estimated; IONOS reference multiple is estimated from IPO price and FY2025 revenue. All values
      illustrative; no team.blue financials have been disclosed.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: Valuation and Return Range — Bear / Base / Bull Scenarios
    type: range
    layout: standard
    summary: >-
      Low-to-high enterprise value range under three scenarios; base case includes a wide band reflecting leverage
      uncertainty. All figures in €M.
    data:
      items:
        - label: Bear Case EV
          low: 800
          mid: 1150
          high: 1500
          note: Revenue €400–500M; multiple compression and leverage headwinds; equity may be subordinated
        - label: Base Case EV
          low: 3500
          mid: 4500
          high: 5500
          note: Revenue €550–700M; 8–10× EBITDA; leverage quantum unknown; equity value uncertain
        - label: Bull Case EV
          low: 5500
          mid: 7000
          high: 9000
          note: Revenue €800–900M; 15–18× EBITDA exit; SaaS mix premium; full integration achieved
    approximationNotes: >-
      EV ranges are illustrative estimates derived from comparable company EBITDA multiples (IONOS, OVHcloud, Wix)
      applied to estimated revenue and margin scenarios. Leverage is not netted as the debt quantum is not disclosed;
      equity value in the base and bear cases could be materially lower than EV suggests.
