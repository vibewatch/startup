  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and EBITDA (FY2022–FY2025)
        - Audited or management-confirmed P&L with segment breakdown (hosting / SaaS / e-commerce)
        - >-
          Without revenue, no valuation multiple can be validated; the entire investment case rests on an estimated
          denominator
        - team.blue CFO; request via Hg Capital as co-investor; engage financial adviser (Big 4 QoE)
      - - Leveraged debt structure
        - >-
          Total debt quantum, instrument type (TLB/RCF), maturity schedule, applicable interest rate, covenant package,
          and reason for the March 2026 repricing failure
        - The scrapped loan repricing confirms hidden leverage; free cash flow available for growth is unknown
        - team.blue CFO / Hg / lending bank syndicate; request credit facility agreement and latest amendment letter
      - - Revenue retention and churn
        - Gross and net revenue retention (NRR) by brand cohort, annual churn rate, ARPU trend 2022–2025
        - High NRR (>100%) would justify a premium multiple; low NRR (<90%) undermines it
        - team.blue Data & Analytics team; compare to IONOS equity story (~80% recurring) as external benchmark
      - - Cap table, waterfall, and preference stack
        - >-
          Exact equity ownership (Hg, CPP, Sofina, founders, management pool); liquidation preference terms;
          anti-dilution provisions
        - CPP's ~20% stake is confirmed; Sofina and founder percentages unknown; waterfall governs equity return in exit
        - Company secretary / legal counsel (Linklaters for Hg; Kirkland & Ellis for CPP); formal SPA review
      - - M&A integration status (2024–2025 cohort)
        - >-
          Per-acquisition integration plan, technology platform migration status, management incentive alignment for
          Loopia, Shoptet, Metricool, Kolsquare, Windsor.ai, Macaly, Saleskit
        - >-
          8 acquisitions completed in 2025 alone; integration drag could suppress EBITDA margins and delay value
          realisation
        - team.blue Group CTO Kirk Barlow and Head of M&A Torsten Hauschildt; request integration dashboard
      - - Exit roadmap and timeline
        - >-
          Hg and CPP target hold period, likely exit route (IPO, trade sale, secondary PE), expected timing, and pre-IPO
          KPI disclosure plan
        - >-
          Hold period and exit route determine IRR for co-investors; an IPO path would require IONOS-style public
          disclosure first
        - Hg Partners (Joris Van Gool, Nick Jordan); CPP Director (Hafiz Lalani); formal LP reporting packet
    notes: >-
      Diligence asks are prioritised in order of materiality to valuation. Items 1 (revenue/EBITDA) and 2 (debt
      structure) are blocking: the investment recommendation cannot move from "track" to "investable" without them.
